/* ---------- Q25 ---------- */
{
  id:"q25", theme:"ir", type:"branch", title:"Live incident — the chlorine setpoint keeps moving back",
  scenario:"02:31. You are the on-call OT analyst for Northwind Water. The chlorine dose is trending up, the operator is worried, and the alert queue is filling. Every decision you take unlocks the next step of the incident.",
  task:"Choose the best action at each step. The scenario continues on the correct path, and every choice is explained.",
  nodes:[
    {
      s:"STEP 1 — The alert on your screen reads: 'Unauthorised Modbus write to PLC-31 from 10[.]20[.]5[.]44'. The chlorine dose is rising but is still inside the legal limit. What do you do first?",
      opts:[
        {t:"Open a ticket and email the network team, then wait for their reply.", ok:false,
         fb:"Wrong. Waiting costs time, and in OT time is measured in physical consequences. A ticket is a record, not a response."},
        {t:"Check whether the process is still inside safe limits and warn the operator to prepare manual control.", ok:true,
         fb:"Correct. First you establish whether anybody is in danger. Telling the operator to prepare manual control buys you a safe option before you touch the network."},
        {t:"Shut down the entire plant network immediately to stop the attack.", ok:false,
         fb:"Wrong. A blunt shutdown can create a bigger safety problem than the attack, and it removes your visibility. Containment must be surgical."},
        {t:"Start a full packet capture and analyse it before doing anything else.", ok:false,
         fb:"Wrong. Evidence matters, but it comes after you know the process is safe. Capturing while the dose climbs is the wrong order."}
      ]
    },
    {
      s:"STEP 2 — The dose is still rising and the operator reports that the setpoint on the HMI keeps changing back to 60%. The manual bypass panel is available and working.",
      opts:[
        {t:"Reboot the HMI to clear the attacker's session.", ok:false,
         fb:"Wrong. The HMI is only a screen. The attacker is writing to the PLC, so a reboot removes your visibility and changes nothing about the write path."},
        {t:"Ask the operator to take the loop to manual and hold the dose at a safe value.", ok:true,
         fb:"Correct. This is the OT priority in action. Manual control removes the process from the attacker's reach without stopping the plant."},
        {t:"Reset every password in Active Directory to lock the attacker out.", ok:false,
         fb:"Wrong. Modbus has no authentication, so the PLC does not check any password. Resetting accounts does not close the write path."},
        {t:"Call the vendor and let their engineer log in remotely to help.", ok:false,
         fb:"Wrong. You would be opening a second remote path into a plant that is under attack, and the response would take hours."}
      ]
    },
    {
      s:"STEP 3 — The process is safe under manual control. You confirm the write arrived through the firewall rule named IT-TO-OT-ANY.",
      opts:[
        {t:"Delete the rule completely and unplug the uplink to the corporate network.", ok:false,
         fb:"Partly reasonable, but too blunt. A full disconnection may break safety reporting and historian data, and it destroys the logging you need. Do the smallest effective change and keep the evidence."},
        {t:"Change the rule to deny, keep logging on, and identify every host that has used that rule.", ok:true,
         fb:"Correct. This closes the path, preserves the evidence trail, and answers the question that always follows: who else came through this door?"},
        {t:"Leave the network alone until the forensic image of the PLC is complete.", ok:false,
         fb:"Wrong. Preserving evidence never justifies leaving an open path that the attacker is actively using."},
        {t:"Reboot the PLC to clear the malicious logic out of its memory.", ok:false,
         fb:"Wrong. You would lose volatile evidence, and if the logic is stored in non-volatile memory the reboot changes nothing. Worse, the PLC may come back in an unknown state."}
      ]
    },
    {
      s:"STEP 4 — Three hours later the process is stable under manual control and the corporate path is closed. Sunrise is in two hours and demand will rise. What is the correct priority now?",
      opts:[
        {t:"Erase and reinstall every system in the OT network tonight.", ok:false,
         fb:"Wrong. A mass rebuild during the night removes your ability to prove what happened and risks bringing systems back in an untested state."},
        {t:"Keep the process safe, then collect evidence and compare the running PLC logic with the offline golden copy.", ok:true,
         fb:"Correct. Safety stays first. Then you prove what was changed by comparing the controller with a known good copy, which is the only reliable way to know whether the logic itself was altered."},
        {t:"Publish the observed indicators to a public blocklist immediately.", ok:false,
         fb:"Wrong. Publishing is a decision for the incident commander, and indicators must be defanged and checked first. It is not a containment action."},
        {t:"Restore the HMI from last year's backup and return to automatic control.", ok:false,
         fb:"Wrong. An old backup may restore the vulnerability that let the attacker in, and returning to automatic control before verification repeats the original risk."}
      ]
    }
  ],
  hint:"At every step ask two questions in this order: is the process safe, and is the attacker's path still open? Everything else waits.",
  explain:"This scenario is the whole OT response doctrine in four decisions. Safety first: establish whether people and the process are at risk before you touch anything. Stability second: take the loop to manual so the attacker loses control of the process without an outage. Containment third: make the smallest effective change, keep the logging, and work out who else used the same path. Evidence and eradication last: compare the running logic with your golden copy, because in ICS the logic itself is the target, and a controller that looks healthy can still be running altered code. A blunt plant-wide shutdown or a mass rebuild feels decisive, but in OT it usually creates a second incident on top of the first. Notice the escalation path too: the analyst confirms the situation and escalates to the incident commander, who decides on containment and on who informs the regulator.",
  focus:"Memorise the four-step order: safety, stability, surgical containment, then evidence and recovery. Practise applying it to a new scenario where the details are different."
},

/* ---------- Q26 ---------- */
{
  id:"q26", theme:"ir", type:"mcq", title:"Which alert is the true positive?",
  scenario:"04:00. Four alerts sit in the queue and you can only investigate one properly before shift handover. You know the plant and its normal behaviour, so you can tell process noise from a real signal.",
  task:"Which alert is most likely to be a true positive?",
  options:[
    {t:"Outstation 10[.]42[.]7[.]12 sends a DNP3 unsolicited response whenever the tank passes 80%, all day.", ok:false},
    {t:"EWS-03 opens port 502 to PLC-31 at 02:14, when no engineer is on site, and sends 4 KB.", ok:true},
    {t:"The firewall denies twelve inbound connections per hour from a known internet scanner range.", ok:false},
    {t:"The historian inserts a new trend row for every instrument every five seconds, as always.", ok:false}
  ],
  hint:"A true positive needs three things at once: unusual behaviour, the right direction, and a plausible consequence. Find the alert that has all three.",
  explain:"The engineering workstation alert has all three. The behaviour is unusual because no engineer is on site at 02:14. The direction matters: 4 KB flowing from the EWS toward the PLC is a program-style download, not a read. And the consequence is serious, because the engineering workstation is the one host that can change controller logic. The DNP3 alert is normal by design: unsolicited responses are how outstations report events, and a level crossing 80% is a routine trigger. The firewall denials are already blocked and come from generic scanning, so they are background noise. The historian row is exactly what a historian does. The professional habit here is to baseline normal process and protocol behaviour, because without a baseline every alert looks equally interesting.",
  focus:"For every alert, ask three questions: is the behaviour unusual, is the direction or source right, and what is the worst realistic consequence? Reject alerts that fail any of the three."
},

/* ---------- Q27 ---------- */
{
  id:"q27", theme:"def", type:"multi", title:"Firewall ruleset review — the gate between two worlds",
  scenario:"You review the only firewall between the corporate network and the plant. Select every genuine finding in this rule set.",
  task:"Select all real findings. Partial credit applies.",
  text:"# Firewall between IT 10[.]20[.]0[.]0/16 and OT 10[.]42[.]0[.]0/16\nrule 10  permit ip  10[.]20[.]0[.]0/16  10[.]42[.]0[.]0/16  any any   log-none\nrule 20  permit tcp 10[.]20[.]9[.]0/24 10[.]42[.]7[.]0/24  eq 502    log-none\nrule 30  permit tcp any                10[.]42[.]7[.]31      eq 102    log-none\nrule 40  deny   ip  any                any                   any       log",
  options:[
    {t:"Rule 10 lets the whole corporate network reach every port and protocol in the plant.", ok:true},
    {t:"Rule 20 lets corporate hosts drive the process directly, because Modbus has no authentication.", ok:true},
    {t:"Rule 30 allows any source, including the internet, to reach the Siemens programming port.", ok:true},
    {t:"Logging is switched off on the three rules that matter, so nobody can investigate later.", ok:true},
    {t:"Rule 40 is a problem because it blocks legitimate vendor traffic from reaching the plant.", ok:false},
    {t:"The rules use bare IP addresses instead of named objects, so they cannot be enforced.", ok:false}
  ],
  hint:"Rules 10, 20 and 30 each allow something. Ask what the allowed thing can actually do once it arrives, and then look at the last column of each rule.",
  explain:"Rule 10 is the worst: any protocol, any port, from the entire corporate range into the entire plant range. That single line erases the network boundary the whole design depends on. Rule 20 looks narrow because it names a port, but port 502 is Modbus, and Modbus has no authentication, so every host in 10[.]20[.]9[.]0/24 can write to field devices. Port filtering is not the same as authorisation. Rule 30 uses the keyword any as the source, which includes the internet, and sends it to port 102, the Siemens S7 programming port, so this is a direct programming path to a controller. Rule 30 is also the kind of rule that PIPEDREAM / INCONTROLLER was built to exploit. Every one of these rules has log-none, which means the SOC cannot answer the first question of any investigation. Rule 40 is a default deny and is good practice. Using IP addresses rather than hostnames is normal and, in OT, preferable, because controllers rarely have reliable DNS names.",
  focus:"Review firewall rules by asking three questions per rule: who is the source, what exactly is the destination port and protocol, and is it logged. Then ask what that protocol can do."
},

/* ---------- Q28 ---------- */
{
  id:"q28", theme:"def", type:"buckets", title:"GRC evidence pack — file the requirement under the right framework",
  scenario:"An auditor asks which framework each requirement in your evidence pack comes from. Sort them correctly, because the wrong label means the wrong audit and the wrong deadline.",
  task:"Drag each requirement into the framework it belongs to.",
  buckets:[
    {id:"IEC", label:"IEC 62443"},
    {id:"NIST", label:"NIST SP 800-82"},
    {id:"NERC", label:"NERC CIP"},
    {id:"TSA", label:"TSA Pipeline Security Directive"},
    {id:"ATT", label:"MITRE ATT&CK for ICS"}
  ],
  items:[
    {id:"i1", t:"Defines security levels SL1 to SL4 and applies them to zones and conduits.", b:"IEC", why:"Security levels for zones and conduits are the core of IEC 62443."},
    {id:"i2", t:"Certifies products and processes for industrial automation and control systems.", b:"IEC", why:"IEC 62443 has a certification scheme for components and for suppliers."},
    {id:"i3", t:"A US government guide to securing OT, with a control overlay for industrial sites.", b:"NIST", why:"NIST SP 800-82 is the OT security guide with a control overlay."},
    {id:"i4", t:"Provides an OT risk assessment method and a catalogue of recommended controls.", b:"NIST", why:"The guide describes how to assess OT risk and which controls to apply."},
    {id:"i5", t:"Mandatory reliability standards for the North American bulk electric system, with audits and fines.", b:"NERC", why:"Mandatory and enforceable for the bulk electric system, unlike a voluntary guide."},
    {id:"i6", t:"Requires electronic security perimeters and personnel risk assessment for control centres.", b:"NERC", why:"Perimeters and personnel vetting are specific CIP requirements."},
    {id:"i7", t:"Requires pipeline owners to name a cyber coordinator and report incidents to CISA.", b:"TSA", why:"The TSA directive covers pipelines and rail and adds CISA reporting duties."},
    {id:"i8", t:"Applies to pipelines and rail, and is mandatory rather than a voluntary guide.", b:"TSA", why:"It is a directive, so it is mandatory for the sectors in scope."},
    {id:"i9", t:"A knowledge base of adversary tactics and techniques seen in real attacks on control systems.", b:"ATT", why:"ATT&CK for ICS describes attacker behaviour, not defender configuration."},
    {id:"i10", t:"Used to describe what an attacker does, not to list the settings a defender must apply.", b:"ATT", why:"It is a behaviour model, not a control catalogue or a standard."}
  ],
  hint:"Two of these are voluntary guidance, two are mandatory in specific sectors and regions, and one is not a standard at all.",
  explain:"IEC 62443 is the international standard group for industrial automation and control systems security. Its signature ideas are security levels SL1 to SL4 applied to zones and conduits, plus a certification scheme for products and suppliers. NIST SP 800-82 is a US government guide. It is voluntary guidance that explains how to assess OT risk and which controls to apply, and it is often used together with the NIST Cybersecurity Framework. NERC CIP is different in kind: it is mandatory and enforceable for the North American bulk electric system, with audits and financial penalties, and it includes requirements such as electronic security perimeters and personnel risk assessment. The TSA Pipeline Security Directive covers pipelines and rail, requires a named cybersecurity coordinator and incident reporting to CISA, and is mandatory for the sectors in scope. MITRE ATT&CK for ICS is not a standard at all. It is a knowledge base of adversary tactics and techniques observed in real attacks on control systems, used to describe attacker behaviour and to test whether your detections cover it.",
  focus:"Learn the difference between voluntary guidance (NIST SP 800-82), certifiable standards (IEC 62443), mandatory regulation (NERC CIP, TSA) and behaviour models (ATT&CK for ICS)."
},

/* ---------- Q29 ---------- */
{
  id:"q29", theme:"role", type:"mcq", title:"Board briefing — why the plant is not the office",
  scenario:"A board member asks you a fair question: 'We already spend a lot on office IT security. Why does the water plant need its own team and its own budget?' The answer will decide next year's funding.",
  task:"Which answer is the most correct?",
  options:[
    {t:"OT faces the same risks as the office network, we simply use different tools and vendors.", ok:false},
    {t:"In OT a cyber mistake can change the process, so we protect the data and the plant.", ok:true},
    {t:"OT matters less, because process data is not personal information and no privacy law applies.", ok:false},
    {t:"OT is safer, because industrial protocols cannot be reached or attacked from a remote network.", ok:false}
  ],
  hint:"Think about what an attacker can reach through the network in each case, and what the worst realistic outcome looks like for a city.",
  explain:"The essential difference is the consequence. In the office, a breach costs money, data and reputation. In a water plant, a cyber action can change a physical process, so the outcome can be contaminated drinking water, an environmental release or an injury. That is why the analyst protects both digital assets and physical processes at the same time. Saying the risks are the same misses the point: the tools differ, but the risk model differs far more, because availability and safety outrank confidentiality here. Saying OT matters less is wrong because safety and public health are the relevant harms, not privacy alone. And saying OT is safer is dangerously wrong: industrial protocols were designed for reliability, most of them have no authentication at all, and real incidents such as Oldsmar and the Ukrainian grid attacks show that remote paths into a process are exactly what attackers look for.",
  focus:"Be able to explain the physical-consequence difference in two sentences, with one named incident as evidence. This is the core of the analyst's role in OT."
},

/* ---------- Q30 ---------- */
{
  id:"q30", theme:"role", type:"fill", title:"Close the case — finish the incident report",
  scenario:"INC-4412 must be closed with a report that a regulator, an engineer and an auditor can all read. Six words are missing from the draft.",
  task:"Tap a word in the bank, then tap the gap where it belongs.",
  text:"INCIDENT REPORT — INC-4412, Northwind Water, first alert 02:14\nAn unauthorised [[0]] write reached PLC-31 from a corporate host. The operator moved the process to [[1]] control so that the dose stayed inside safe limits. The IT-to-OT [[2]] rule was changed to deny, and the switch port was shut down. Running logic was then compared with the offline [[3]] copy, and a clean program was downloaded during the planned low-demand window. The shared vendor [[4]] account had no second factor, and this is recorded as the root [[5]] of the incident.",
  words:["Modbus","manual","firewall","golden","VPN","cause"],
  hint:"Three gaps name a technology, one names the way the plant was operated, one names the verified copy of the controller logic, and one names why the incident happened.",

/* ------------------------- helpers ------------------------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function fmt(sec){
  if(sec<0) sec=0;
  const m = Math.floor(sec/60), s = sec%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function qw(q){ return q.w || TYPE_DEFAULTS[q.type].w; }
function qt(q){ return q.t || TYPE_DEFAULTS[q.type].t; }
function curQ(){ return S.order[S.idx]; }
function possibleTotal(){ return S.order.reduce(function(s,q){ return s+qw(q); },0); }
function earnedTotal(){
  return Object.keys(S.res).reduce(function(s,k){ return s + S.res[k].earned; },0);
}
function pct(){ const p = possibleTotal(); return p ? (earnedTotal()/p*100) : 0; }
function stateOf(frac){ return frac>=0.999 ? 'ok' : (frac>0 ? 'part' : 'bad'); }

/* ------------------------- global drag ------------------------- */
document.addEventListener('dragstart', function(e){
  const c = e.target.closest ? e.target.closest('[data-drag]') : null;
  if(!c) return;
  DRAG = { kind:c.dataset.drag, key:c.dataset.key };
  if(e.dataTransfer){ try{ e.dataTransfer.setData('text/plain','x'); e.dataTransfer.effectAllowed='move'; }catch(err){} }
  c.classList.add('dragging');
});
document.addEventListener('dragend', function(){
  DRAG = null;
  $$('.dragging').forEach(function(x){ x.classList.remove('dragging'); });
  $$('.over').forEach(function(x){ x.classList.remove('over'); });
});
document.addEventListener('dragover', function(e){
  if(!DRAG) return;
  const z = e.target.closest ? e.target.closest('.dropzone') : null;
  if(!z) return;
  e.preventDefault();
  z.classList.add('over');
});
document.addEventListener('dragleave', function(e){
  const z = e.target.closest ? e.target.closest('.dropzone') : null;
  if(z) z.classList.remove('over');
});
document.addEventListener('drop', function(e){
  if(!DRAG) return;
  const z = e.target.closest ? e.target.closest('.dropzone') : null;
  if(!z) return;
  e.preventDefault();
  z.classList.remove('over');
  const d = DRAG; DRAG = null;
  $$('.dragging').forEach(function(x){ x.classList.remove('dragging'); });
  handleDrop(z, d);
});

function handleDrop(zone, d){
  const q = curQ(), rt = S.rt;
  if(!q || !rt || rt.locked) return;
  const zk = zone.dataset.zone;
  if(d.kind==='item' && q.type==='buckets'){
    rt.place[d.key] = (zk==='tray') ? null : zk;
    rt.selItem = null;
    drawBuckets(q, rt);
  } else if(d.kind==='word' && q.type==='fill'){
    if(zk==='bank'){
      for(const k in rt.place){ if(rt.place[k]===d.key) rt.place[k]=null; }
    } else {
      const idx = parseInt(zk,10);
      if(!isNaN(idx)){
        for(const k in rt.place){ if(rt.place[k]===d.key) rt.place[k]=null; }
        rt.place[idx] = d.key;
      }
    }
    rt.selWord = null;
    drawFill(q, rt);
  } else if(d.kind==='ord' && q.type==='order'){
    const from = parseInt(d.key,10);
    const to = zk.indexOf('ord:')===0 ? parseInt(zk.slice(4),10) : from;
    if(from!==to && !isNaN(to)){
      const it = rt.seq.splice(from,1)[0];
      rt.seq.splice(to,0,it);
      drawOrder(q, rt);
    }
  }
}

function startExam(){
  S.phase = 'exam';
  S.order = shuffle(QUESTIONS.slice());
  S.idx = 0;
  S.res = {};
  S.rt = null;
  S.timedOut = false;
  S.timeTotal = S.order.reduce(function(s,q){ return s+qt(q); },0);
  S.timeLeft = S.timeTotal;
  S.paused = false;
  WRAP.classList.remove('blurred');
  $('#pauseOverlay').classList.add('hidden');
  $('#pauseBtn').textContent = 'Pause';
  TOP.classList.remove('hidden');
  NAV.classList.remove('hidden');
  startTimer();
  renderCurrent();
}

function startTimer(){
  clearInterval(S.tick);
  paintTimer();
  S.tick = setInterval(function(){
    if(S.paused) return;
    S.timeLeft--;
    paintTimer();
    if(S.timeLeft<=0){ clearInterval(S.tick); S.timedOut = true; finishExam(); }
  },1000);
}

function paintTimer(){
  const el = $('#timerVal'), box = $('#timerBox');
  el.textContent = fmt(S.timeLeft);
  $('#pauseTime').textContent = fmt(S.timeLeft);
  box.classList.remove('warn','crit');
  const r = S.timeLeft / S.timeTotal;
  if(r<=0.10) box.classList.add('crit'); else if(r<=0.20) box.classList.add('warn');
}

function prepRT(q){
  const rt = { locked:false, hintUsed:false, sel:[], place:{}, seq:[], assign:{}, bank:[], picks:[], bIdx:0, last:'', log:'' };
  if(q.type==='mcq'||q.type==='multi'||q.type==='logview'){
    rt.opts = shuffle(q.options.map(function(o,i){ return {t:o.t, ok:!!o.ok, idx:i}; }));
  }
  if(q.type==='buckets'){ rt.items = shuffle(q.items.slice()); q.items.forEach(function(it){ rt.place[it.id]=null; }); }
  if(q.type==='order'){ rt.seq = shuffle(q.items.slice()); }
  if(q.type==='pair'){
    rt.left  = shuffle(q.pairs.map(function(p){ return p.id; }));
    rt.right = shuffle(q.pairs.map(function(p){ return p.id; }));
    q.pairs.forEach(function(p){ rt.assign[p.id]=null; });
  }
  if(q.type==='fill'){
    rt.bank = shuffle(q.words.slice());
    const n = (q.text.match(/\[\[\d+\]\]/g)||[]).length;
    for(let i=0;i<n;i++) rt.place[i]=null;
  }
  if(q.type==='branch'){ q.nodes.forEach(function(){ rt.picks.push(-1); }); }
  return rt;
}

function renderCurrent(){
  if(S.idx >= S.order.length){ renderSubmit(); return; }
  const q = curQ();
  if(!S.rt){ S.rt = prepRT(q); }
  drawQuestion();
  paintTop();
}

function drawQuestion(){
  const q = curQ(), rt = S.rt;
  const th = THEMES[q.theme];
  STAGE.innerHTML =
    '<div class="card">'+
      '<div class="qhead">'+
        '<span class="qnum">EXERCISE '+String(S.idx+1).padStart(2,'0')+' / '+S.order.length+'</span>'+
        '<span class="pill" style="color:'+th.color+';border-color:'+th.color+'">'+esc(th.name)+'</span>'+
        '<span class="pill">'+esc(TYPE_LABEL[q.type])+'</span>'+
        '<span class="pill">'+qw(q)+' pts</span>'+
        '<span class="pill">'+fmt(qt(q))+' budget</span>'+
      '</div>'+
      '<div class="qtitle">'+esc(q.title)+'</div>'+
      (q.scenario ? '<div class="scenario"><span class="lbl">Situation</span>'+esc(q.scenario)+'</div>' : '')+
      (q.task ? '<p class="task">'+esc(q.task)+'</p>' : '')+
      '<div id="hintSlot"></div>'+
      '<div id="widget"></div>'+
      '<div id="fbSlot"></div>'+
    '</div>';
  const w = $('#widget');
  if(q.type==='mcq'||q.type==='multi') drawMCQ(q, rt, w);
  else if(q.type==='logview') drawLog(q, rt, w);
  else if(q.type==='buckets') drawBuckets(q, rt, w);
  else if(q.type==='order') drawOrder(q, rt, w);
  else if(q.type==='pair') drawPair(q, rt, w);
  else if(q.type==='fill') drawFill(q, rt, w);
  else if(q.type==='terminal') drawTerm(q, rt, w);
  else if(q.type==='branch') drawBranch(q, rt, w);
  if(rt.hintUsed) showHint();
  if(rt.locked){
    paintGrade(q, rt);
    const r = S.res[q.id];
    if(r) $('#fbSlot').innerHTML = feedbackHTML(q, r);
  }
}

function paintTop(){
  const p = possibleTotal();
  $('#scoreVal').textContent = Math.round(pct())+'%';
  $('#qPos').textContent = Math.min(S.idx+1,S.order.length)+'/'+S.order.length;
  $('#barFill').style.width = (S.order.length ? ((S.idx)/S.order.length*100) : 0)+'%';

  const rail = THEMES;
  const keys = Object.keys(rail);
  $('#themeRail').innerHTML = keys.map(function(k){
    const qs = S.order.filter(function(q){ return q.theme===k; });
    const done = qs.filter(function(q){ return S.res[q.id]; });
    const good = done.filter(function(q){ return stateOf(S.res[q.id].frac)==='ok'; }).length;
    const w = qs.length ? (done.length/qs.length*100) : 0;
    return '<span class="tm"><i class="tmdot" style="background:'+rail[k].color+'"></i>'+
      esc(rail[k].short)+' <b>'+good+'/'+qs.length+'</b>'+
      '<span class="tmbar"><i style="width:'+w+'%;background:'+rail[k].color+'"></i></span></span>';
  }).join('');

  const dots = S.order.map(function(q,i){
    const r = S.res[q.id];
    let cls = 'qdot';
    if(r) cls += ' '+stateOf(r.frac);
    if(i===S.idx) cls += ' cur';
    return '<span class="'+cls+'" data-go="'+i+'" title="Exercise '+(i+1)+'"></span>';
  }).join('');
  const qd = $('#qdots'); if(qd) qd.innerHTML = dots;

  const locked = S.rt && S.rt.locked;
  const checkBtn = $('#checkBtn'), nextBtn = $('#nextBtn'), hintBtn = $('#hintBtn'), prevBtn = $('#prevBtn');
  if(checkBtn){
    checkBtn.classList.toggle('hidden', !!locked);
    nextBtn.classList.toggle('hidden', !locked);
    hintBtn.classList.toggle('hidden', !!locked || (S.rt && S.rt.hintUsed));
    hintBtn.disabled = !!(S.rt && S.rt.hintUsed);
    if(S.rt && S.rt.hintUsed) hintBtn.classList.add('hidden');
    nextBtn.textContent = (S.idx >= S.order.length-1) ? 'Submit exam →' : 'Next →';
    const q = curQ();
    checkBtn.disabled = (q && q.type==='branch' && S.rt && S.rt.picks.indexOf(-1)>=0);
    prevBtn.disabled = S.idx===0;
  }
}

function navTo(i){
  if(i<0 || i>=S.order.length) return;
  S.idx = i;
  const q = curQ();
  if(S.res[q.id]){ S.rt = S.res[q.id].rt; S.rt.locked = true; }
  else S.rt = prepRT(q);
  renderCurrent();
  window.scrollTo({top:0, behavior:'smooth'});
}

function optHTML(o, k, rt, multi){

function drawMCQ(q, rt, w){
  const multi = q.type==='multi';
  let html = '';
  if(q.text) html += '<div class="scenario mono small" style="border-left-color:#f59e0b;white-space:pre-wrap">'+esc(q.text)+'</div>';
  html += '<div class="opts">'+rt.opts.map(function(o,k){ return optHTML(o,k,rt,multi); }).join('')+'</div>';
  w.innerHTML = html;
  $$('.opt', w).forEach(function(b){
    b.onclick = function(){
      if(rt.locked) return;
      const o = rt.opts[+b.dataset.k];
      if(multi){
        const i = rt.sel.indexOf(o.idx);
        if(i>=0) rt.sel.splice(i,1); else rt.sel.push(o.idx);
      } else {
        rt.sel = [o.idx];
      }
      $$('.opt', w).forEach(function(x){
        const oo = rt.opts[+x.dataset.k];
        const s = rt.sel.indexOf(oo.idx)>=0;
        x.classList.toggle('sel', s);
        $('.mark', x).textContent = s ? '✓' : '';
      });
    };
  });
}

function logLineHTML(l, term){
  let m = esc(l.m);
  if(term){
    const safe = term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try{ m = m.replace(new RegExp('('+safe+')','ig'), '<mark>$1</mark>'); }catch(e){}
  }
  return '<div class="logline"><span class="lt">'+esc(l.t)+'</span><span class="ls">'+esc(l.s)+
    '</span><span class="lv lv-'+esc(l.l)+'">'+esc(l.l)+'</span><span class="lm">'+m+'</span></div>';
}
function drawLog(q, rt, w){
  const lvls = [];
  q.log.forEach(function(l){ if(lvls.indexOf(l.l)<0) lvls.push(l.l); });
  w.innerHTML =
    '<div class="logpanel">'+
      '<div class="logbar">'+
        '<span class="dim small">⌕</span>'+
        '<input type="text" id="lgF" placeholder="filter: try fc=6, GOOSE, UNSOL, 502, stNum" value="'+esc(rt.log)+'">'+
        '<select id="lgL"><option value="">all levels</option>'+lvls.map(function(l){ return '<option>'+esc(l)+'</option>'; }).join('')+'</select>'+
        '<span class="logcount" id="lgC"></span>'+
      '</div>'+
      '<div class="logbody" id="lgB"></div>'+
    '</div>'+
    '<div class="opts" style="margin-top:15px">'+rt.opts.map(function(o,k){ return optHTML(o,k,rt,false); }).join('')+'</div>';

  const body = $('#lgB', w), cnt = $('#lgC', w), inp = $('#lgF', w), sel = $('#lgL', w);
  function refresh(){
    const term = inp.value.trim(), lv = sel.value;
    const rows = q.log.filter(function(l){
      const hay = (l.t+' '+l.s+' '+l.l+' '+l.m).toLowerCase();
      if(lv && l.l!==lv) return false;
      if(term && hay.indexOf(term.toLowerCase())<0) return false;
      return true;
    });
    body.innerHTML = rows.map(function(l){ return logLineHTML(l, term); }).join('') ||
      '<div class="dim small" style="padding:8px">no matching lines</div>';
    cnt.textContent = rows.length+' / '+q.log.length+' lines';
  }
  inp.oninput = refresh; sel.onchange = refresh; inp.onkeyup = refresh;
  refresh();

  $$('.opt', w).forEach(function(b){
    b.onclick = function(){
      if(rt.locked) return;
      const o = rt.opts[+b.dataset.k];
      rt.sel = [o.idx];
      $$('.opt', w).forEach(function(x){
        const oo = rt.opts[+x.dataset.k];
        const s = rt.sel.indexOf(oo.idx)>=0;
        x.classList.toggle('sel', s);
        $('.mark', x).textContent = s ? '✓' : '';
      });
    };
  });
}

function chipHTML(it, rt, q){
  let extra = '';
  if(rt.locked){
    const b = rt.place[it.id];
    if(b !== it.b){
      const lab = (q.buckets.filter(function(x){ return x.id===it.b; })[0]||{}).label || it.b;
      extra = '<span class="mini">→ belongs in: '+esc(lab)+' — '+esc(it.why)+'</span>';
    } else {
      extra = '<span class="mini" style="color:#7ff0a8">✓ '+esc(it.why)+'</span>';
    }
  }
  return '<div class="chip'+(rt.selItem===it.id?' sel':'')+'" data-drag="item" data-key="'+it.id+'" data-i="'+it.id+'" draggable="'+(rt.locked?'false':'true')+'">'+
    '<span>'+esc(it.t)+'</span>'+extra+'</div>';
}
function drawBuckets(q, rt, w){
  const tray = rt.items.filter(function(it){ return !rt.place[it.id]; });
  w.innerHTML =
    '<div class="tray dropzone'+(rt.selItem?' ':'')+'" data-zone="tray" id="tray">'+
      (tray.length ? tray.map(function(it){ return chipHTML(it, rt, q); }).join('')
                   : '<span class="dim small">everything is placed — drag a chip back here to undo</span>')+
    '</div>'+
    '<div class="buckets">'+q.buckets.map(function(b){
      const inside = rt.items.filter(function(it){ return rt.place[it.id]===b.id; });
      return '<div class="bucket"><h4>'+esc(b.label)+'</h4>'+
        '<div class="drop dropzone" data-zone="'+b.id+'">'+
        (inside.length ? inside.map(function(it){ return chipHTML(it, rt, q); }).join('') : '<span class="dim small" style="font-size:11.5px">drop here</span>')+
        '</div></div>';
    }).join('')+'</div>';

  $$('.chip', w).forEach(function(c){
    c.onclick = function(ev){
      ev.stopPropagation();
      if(rt.locked) return;
      const id = c.dataset.i;
      if(rt.place[id]){ rt.place[id] = null; rt.selItem = null; }
      else { rt.selItem = (rt.selItem===id ? null : id); }
      drawBuckets(q, rt, w);
    };
  });
  $$('.dropzone', w).forEach(function(z){
    z.onclick = function(){
      if(rt.locked || !rt.selItem) return;
      const id = rt.selItem;
      rt.place[id] = (z.dataset.zone==='tray') ? null : z.dataset.zone;
      rt.selItem = null;
      drawBuckets(q, rt, w);
    };
  });
}

function drawOrder(q, rt, w){
  w.innerHTML = '<ul class="orderlist">'+rt.seq.map(function(it,i){
    let mark = '';
    if(rt.locked){
      mark = (it.id===q.items[i].id) ? '<span class="pill ok" style="font-size:10px">✓</span>'
                                     : '<span class="pill bad" style="font-size:10px">✗</span>';
    }
    return '<li class="dropzone'+(rt.locked?'':'')+'" data-zone="ord:'+i+'" data-drag="ord" data-key="'+i+'" draggable="'+(rt.locked?'false':'true')+'">'+
      '<span class="rk">'+(i+1)+'</span><span class="tx">'+esc(it.t)+'</span>'+mark+
      (rt.locked ? '' : '<span class="mvb"><button data-up="'+i+'" title="move up">▲</button><button data-down="'+i+'" title="move down">▼</button></span>')+
      '</li>';
  }).join('')+'</ul>';
  if(rt.locked){
    w.innerHTML += '<div class="answerline"><b>Correct sequence:</b><ol style="margin:6px 0 0;padding-left:20px">'+
      q.items.map(function(it){ return '<li>'+esc(it.t)+'</li>'; }).join('')+'</ol></div>';
    return;
  }
  $$('.mvb button', w).forEach(function(b){
    b.onclick = function(ev){
      ev.stopPropagation();
      const i = +(b.dataset.up!==undefined ? b.dataset.up : b.dataset.down);
      const j = b.dataset.up!==undefined ? i-1 : i+1;
      if(j<0 || j>=rt.seq.length) return;
      const it = rt.seq.splice(i,1)[0];
      rt.seq.splice(j,0,it);
      drawOrder(q, rt, w);
    };
  });
}

function drawPair(q, rt, w){
  const byId = {}; q.pairs.forEach(function(p){ byId[p.id]=p; });
  const used = {}; for(const k in rt.assign){ if(rt.assign[k]) used[rt.assign[k]]=true; }
  w.innerHTML =
    '<div class="pairs">'+
      '<div class="pcol"><h4>Item</h4>'+rt.left.map(function(id){
        const a = rt.assign[id];
        let cls = 'prow';
        if(rt.locked) cls += (a===id ? ' ok' : ' bad');
        else if(rt.selLeft===id) cls += ' sel';
        const atxt = a ? esc(byId[a].right) : 'click here, then click a description →';
        return '<div class="'+cls+'" data-l="'+id+'"><span class="pl">'+esc(byId[id].left)+'</span>'+
          '<span class="pa'+(a?'':' empty')+'">'+atxt+'</span>'+
          (rt.locked && a!==id ? '<span class="pa" style="color:#7ff0a8">✓ correct: '+esc(byId[id].right)+'</span>' : '')+
        '</div>';
      }).join('')+'</div>'+
      '<div class="pcol"><h4>Description</h4>'+rt.right.map(function(id){
        let cls = 'popt';
        if(used[id]) cls += ' used';
        if(rt.locked) cls += (rt.assign[id]===id ? ' ok' : ' bad');
        return '<div class="'+cls+'" data-r="'+id+'">'+esc(byId[id].right)+'</div>';
      }).join('')+'</div>'+
    '</div>';
  if(rt.locked) return;
  $$('.prow', w).forEach(function(r){
    r.onclick = function(){
      const id = r.dataset.l;
      if(rt.assign[id]){ rt.assign[id]=null; }
      else { rt.selLeft = (rt.selLeft===id ? null : id); }
      drawPair(q, rt, w);
    };
  });
  $$('.popt', w).forEach(function(p){
    p.onclick = function(){
      const id = p.dataset.r;
      if(used[id]) return;
      if(!rt.selLeft) return;
      rt.assign[rt.selLeft] = id;
      rt.selLeft = null;
      drawPair(q, rt, w);
    };
  });
}

function drawFill(q, rt, w){
  const parts = q.text.split(/(\[\[\d+\]\])/);
  const words = {}; q.words.forEach(function(x){ words[x]=true; });
  const usedWords = {}; for(const k in rt.place){ if(rt.place[k]) usedWords[rt.place[k]]=true; }
  const body = parts.map(function(p){
    const m = p.match(/^\[\[(\d+)\]\]$/);
    if(!m) return esc(p);
    const i = +m[1], val = rt.place[i];
    let cls = 'blank dropzone';
    if(!val) cls += ' empty';
    if(rt.selWord===i) cls += ' sel';
    if(rt.locked){ cls += (val===q.words[i] ? ' ok' : ' bad'); }
    let txt = val ? esc(val) : 'drop here';
    if(rt.locked && val!==q.words[i]) txt = esc(val||'—')+' ✗ → '+esc(q.words[i]);
    return '<span class="'+cls+'" data-zone="'+i+'" data-b="'+i+'" data-drag="'+(val?'word':'')+'" data-key="'+(val||'')+'" draggable="'+(val&&!rt.locked?'true':'false')+'">'+txt+'</span>';
  }).join('');
  const bankWords = rt.bank.filter(function(x){ return !usedWords[x]; });
  w.innerHTML =
    '<div class="filltext">'+body+'</div>'+
    '<div class="bank dropzone" data-zone="bank">'+
      (bankWords.length ? rt.bank.filter(function(x){ return !usedWords[x]; }).map(function(x){
        return '<div class="chip" data-drag="word" data-key="'+esc(x)+'" draggable="'+(rt.locked?'false':'true')+'"><span>'+esc(x)+'</span></div>';
      }).join('') : '<span class="dim small">bank empty</span>')+
    '</div>';
  if(rt.locked){
    const missing = q.words.filter(function(x){ return !usedWords[x]; });
    if(missing.length) w.innerHTML += '<div class="answerline"><b>Correct words:</b> '+q.words.map(function(x,i){ return (i+1)+'. '+esc(x); }).join(' &nbsp;•&nbsp; ')+'</div>';
    return;
  }
  $$('.chip', w).forEach(function(c){
    c.onclick = function(ev){
      ev.stopPropagation();
      if(rt.locked) return;
      rt.selWord = (rt.selWord===c.dataset.key ? null : c.dataset.key);
      drawFill(q, rt, w);
    };
  });
  $$('.blank', w).forEach(function(b){
    b.onclick = function(){
      if(rt.locked) return;
      const i = +b.dataset.b;
      if(rt.selWord){
        for(const k in rt.place){ if(rt.place[k]===rt.selWord) rt.place[k]=null; }
        rt.place[i] = rt.selWord; rt.selWord = null;
      } else if(rt.place[i]){
        rt.place[i] = null;
      }
      drawFill(q, rt, w);
    };
  });
  const bank = $('.bank', w);
  if(bank) bank.onclick = function(){
    if(rt.locked || !rt.selWord) return;
    for(const k in rt.place){ if(rt.place[k]===rt.selWord) rt.place[k]=null; }
    rt.selWord = null;
    drawFill(q, rt, w);
  };
}

function drawTerm(q, rt, w){
  w.innerHTML =
    '<div class="term">'+
      '<div class="termhead"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>'+
        '<span class="termtitle">analyst@'+esc(q.host||'ot-jump-01')+': ~</span></div>'+
      '<div class="termbody" id="tOut">'+q.banner.map(function(l){ return '<div class="tl dim">'+esc(l)+'</div>'; }).join('')+'</div>'+
      '<div class="terminline"><span class="tprompt">analyst@'+esc(q.host||'ot-jump-01')+':~$</span>'+
        '<input id="tIn" autocomplete="off" spellcheck="false" placeholder="type a command and press Enter" '+(rt.locked?'disabled':'')+'></div>'+
    '</div>'+
    '<div class="answerline" id="termAns"><b>Recorded answer:</b> '+(rt.last ? '<span class="mono">'+esc(rt.last)+'</span>' : '<span class="dim">nothing typed yet — your last command is your answer</span>')+'</div>';

  const out = $('#tOut', w), inp = $('#tIn', w);
  function push(txt, cls){
    const d = document.createElement('div');
    d.className = 'tl '+(cls||'');
    d.textContent = txt;
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  }
  if(!rt.locked){
    inp.focus();
    inp.onkeydown = function(e){
      if(e.key!=='Enter') return;
      const cmd = inp.value.trim();
      if(!cmd) return;
      push('analyst@'+(q.host||'ot-jump-01')+':~$ '+cmd, 'cmd');
      rt.last = cmd;
      let hit = null;
      (q.sim||[]).forEach(function(s){ if(!hit && s.re.test(cmd)) hit = s; });
      if(hit) hit.out.forEach(function(l){ push(l, hit.cls||''); });
      else push('bash: '+cmd.split(/\s+/)[0]+': command not found', 'err');
      inp.value = '';
      $('#termAns', w).innerHTML = '<b>Recorded answer:</b> <span class="mono">'+esc(rt.last)+'</span>';
    };
  }
}

function drawBranch(q, rt, w){
  const n = q.nodes.length;
  let html = '';
  if(rt.locked){
    q.nodes.forEach(function(nd, i){
      const pick = rt.picks[i];
      html += '<div class="scenario" style="border-left-color:#f59e0b"><span class="lbl" style="color:#f59e0b">Step '+(i+1)+'</span>'+esc(nd.s)+'</div>';
      html += '<div class="opts">'+nd.opts.map(function(o,k){
        let cls = 'opt';
        if(o.ok) cls += (pick===k ? ' ok' : ' miss');
        else if(pick===k) cls += ' bad';
        return '<button class="'+cls+'" disabled><span class="mark">'+(pick===k?'✓':'')+'</span><span class="otxt">'+esc(o.t)+'</span></button>';
      }).join('')+'</div>';
      const po = pick>=0 ? nd.opts[pick] : null;
      html += '<div class="fb '+(po && po.ok ? 'ok':'bad')+'" style="margin-top:9px;margin-bottom:18px"><div class="fbbody">'+
        '<b>Your choice:</b> '+esc(po ? po.t : '—')+'<br>'+esc(po ? po.fb : 'No choice recorded.')+'</div></div>';
    });
    w.innerHTML = html;
    return;
  }
  const i = Math.min(rt.bIdx, n-1);
  const nd = q.nodes[i];
  const pick = rt.picks[i];
  html += '<div class="scenario" style="border-left-color:#f59e0b"><span class="lbl" style="color:#f59e0b">Step '+(i+1)+' of '+n+'</span>'+esc(nd.s)+'</div>';
  html += '<div class="opts">'+nd.opts.map(function(o,k){
    let cls = 'opt';
    if(pick>=0){ if(o.ok) cls += (pick===k?' ok':' miss'); else if(pick===k) cls += ' bad'; }
    return '<button class="'+cls+'" data-k="'+k+'"'+(pick>=0?' disabled':'')+'><span class="mark">'+(pick===k?'✓':'')+'</span><span class="otxt">'+esc(o.t)+'</span></button>';
  }).join('')+'</div>';
  if(pick>=0){
    const po = nd.opts[pick];
    html += '<div class="fb '+(po.ok?'ok':'bad')+'" style="margin-top:13px"><div class="fbhead">'+(po.ok?'✓ Correct decision':'✗ Not the best decision')+'</div>'+
      '<div class="fbbody">'+esc(po.fb)+'</div></div>';
    if(i>=n-1){
      html += '<div class="answerline" style="margin-top:12px"><b>Scenario complete.</b> All '+n+' decisions are recorded — press <b>Lock in answer</b> to score the scenario.</div>';
    } else {
      html += '<div style="margin-top:12px"><button class="btn btn-primary" id="brNext">Continue to step '+(i+2)+' →</button></div>';
    }
  }
  w.innerHTML = html;
  $$('.opt', w).forEach(function(b){
    b.onclick = function(){
      if(rt.picks[i]>=0) return;
      rt.picks[i] = +b.dataset.k;
      drawBranch(q, rt, w);
      const btn = $('#checkBtn'); if(btn) btn.disabled = rt.picks.indexOf(-1)>=0;
    };
  });
  const nx = $('#brNext', w);
  if(nx) nx.onclick = function(){
    rt.bIdx = i+1;
    drawBranch(q, rt, w);
  };
}

/* =====================================================================
   GRADE PAINTING (colour the frozen widget after lock-in)
   ===================================================================== */
function paintGrade(q, rt){
  const w = $('#widget');
  if(!w) return;
  if(q.type==='mcq' || q.type==='multi' || q.type==='logview'){
    $$('.opt', w).forEach(function(b){
      const o = rt.opts[+b.dataset.k];
      if(!o) return;
      const picked = rt.sel.indexOf(o.idx)>=0;
      b.classList.remove('sel');
      if(o.ok) b.classList.add(picked ? 'ok' : 'miss');
      else if(picked) b.classList.add('bad');
      b.disabled = true;
      const mk = $('.mark', b);
      if(mk) mk.textContent = o.ok ? '✓' : (picked ? '✗' : '');
    });
  } else if(q.type==='buckets'){
    $$('.chip', w).forEach(function(c){
      const id = c.dataset.i;
      const it = q.items.filter(function(x){ return x.id===id; })[0];
      if(!it) return;
      c.classList.add(rt.place[it.id]===it.b ? 'ok' : 'bad');
      c.setAttribute('draggable','false');
    });
  } else if(q.type==='order'){
    $$('.orderlist li', w).forEach(function(li,i){
      const correct = rt.seq[i] && rt.seq[i].id===q.items[i].id;
      li.classList.add(correct ? 'ok' : 'bad');
      li.setAttribute('draggable','false');
    });
  } else if(q.type==='fill'){
    $$('.chip', w).forEach(function(c){ c.setAttribute('draggable','false'); });
  }
}

/* =====================================================================
   GRADING
   ===================================================================== */
function gradeQuestion(q, rt){
  const w = $('#widget');
  let frac = 0, detail = '';
  if(q.type==='mcq' || q.type==='logview'){
    const ok = rt.opts.filter(function(o){ return o.ok; }).map(function(o){ return o.idx; });
    const sel = rt.sel.slice().sort(function(a,b){ return a-b; });
    const okS = ok.slice().sort(function(a,b){ return a-b; });
    frac = (sel.length===okS.length && sel.every(function(v,i){ return v===okS[i]; })) ? 1 : 0;
    const your = rt.sel.map(function(i){ return q.options[i].t; });
    detail = '<b>Your answer:</b> '+esc(your.length?your.join(' / '):'nothing selected')+'<br>'+
             '<b>Correct answer:</b> '+esc(q.options[ok[0]].t);
  }
  else if(q.type==='multi'){
    const ok = rt.opts.filter(function(o){ return o.ok; }).map(function(o){ return o.idx; });
    let hit=0, miss=0;
    rt.sel.forEach(function(i){ if(ok.indexOf(i)>=0) hit++; else miss++; });
    frac = Math.max(0, (hit-miss)/ok.length);
    detail = '<b>You selected:</b> '+esc(rt.sel.length ? rt.sel.map(function(i){ return q.options[i].t; }).join(' • ') : 'nothing')+'<br>'+
             '<b>Correct set:</b> '+esc(ok.map(function(i){ return q.options[i].t; }).join(' • '));
  }
  else if(q.type==='buckets'){
    let good=0; const wrong=[];
    q.items.forEach(function(it){
      if(rt.place[it.id]===it.b) good++;
      else {
        const yb = (q.buckets.filter(function(b){ return b.id===rt.place[it.id]; })[0]||{}).label || 'left in the tray';
        const cb = (q.buckets.filter(function(b){ return b.id===it.b; })[0]||{}).label || it.b;
        wrong.push({it:it, yb:yb, cb:cb});
      }
    });
    frac = good/q.items.length;
    detail = '<b>'+good+' of '+q.items.length+' items placed correctly.</b>'+
      (wrong.length ? '<ul>'+wrong.map(function(x){ return '<li><b>'+esc(x.it.t)+'</b> — you put it in <i>'+esc(x.yb)+'</i>, correct is <i>'+esc(x.cb)+'</i>. '+esc(x.it.why)+'</li>'; }).join('')+'</ul>' : '');
  }
  else if(q.type==='order'){
    let good=0; const pos=[];
    q.items.forEach(function(it,i){
      if(rt.seq[i] && rt.seq[i].id===it.id){ good++; pos.push(i+1); }
    });
    frac = good/q.items.length;
    detail = '<b>'+good+' of '+q.items.length+' rows are in the correct position.</b><br>'+
      '<b>Correct order:</b><ol style="margin:6px 0 0;padding-left:20px">'+q.items.map(function(it){ return '<li>'+esc(it.t)+'</li>'; }).join('')+'</ol>';
  }
  else if(q.type==='pair'){
    let good=0; const bad=[];
    q.pairs.forEach(function(p){
      if(rt.assign[p.id]===p.id) good++;
      else {
        const got = q.pairs.filter(function(x){ return x.id===rt.assign[p.id]; })[0];
        bad.push({l:p.left, y:got?got.right:'not matched', c:p.right});
      }
    });
    frac = good/q.pairs.length;
    detail = '<b>'+good+' of '+q.pairs.length+' matches correct.</b>'+
      (bad.length ? '<ul>'+bad.map(function(x){ return '<li><b>'+esc(x.l)+'</b> — you linked it to: <i>'+esc(x.y)+'</i>. Correct: <i>'+esc(x.c)+'</i></li>'; }).join('')+'</ul>' : '');
  }
  else if(q.type==='fill'){
    let good=0; const bad=[];
    q.words.forEach(function(word,i){
      if(rt.place[i]===word) good++;
      else bad.push({i:i, y:rt.place[i], c:word});
    });
    frac = good/q.words.length;
    detail = '<b>'+good+' of '+q.words.length+' gaps correct.</b>'+
      (bad.length ? '<ul>'+bad.map(function(x){ return '<li>Gap '+(x.i+1)+': you wrote <i>'+esc(x.y||'nothing')+'</i>, correct is <b>'+esc(x.c)+'</b></li>'; }).join('')+'</ul>' : '');
  }
  else if(q.type==='terminal'){
    const cmd = rt.last||'';
    let hit=0;
    const rows = q.reqs.map(function(r){
      const ok = r.re.test(cmd);
      if(ok) hit++;
      return {label:r.label, ok:ok};
    });
    frac = hit/q.reqs.length;
    detail = '<b>Your command:</b> <span class="mono">'+esc(cmd||'(nothing typed)')+'</span>'+
      '<div class="reqs" style="margin-top:9px">'+rows.map(function(r){
        return '<div class="req '+(r.ok?'ok':'bad')+'"><span class="ic">'+(r.ok?'✓':'✗')+'</span><span>'+esc(r.label)+'</span></div>';
      }).join('')+'</div>';
  }
  else if(q.type==='branch'){
    let good=0; const rows=[];
    q.nodes.forEach(function(nd,i){
      const p = rt.picks[i];
      const ok = p>=0 && nd.opts[p].ok;
      if(ok) good++;
      rows.push({i:i, ok:ok, pick:p>=0 ? nd.opts[p].t : 'no choice'});
    });
    frac = good/q.nodes.length;
    detail = '<b>'+good+' of '+q.nodes.length+' decisions correct.</b><ul>'+
      rows.map(function(r){ return '<li>Step '+(r.i+1)+': <i>'+esc(r.pick)+'</i> '+(r.ok?'✓':'✗')+'</li>'; }).join('')+'</ul>';
  }
  return { frac:frac, detail:detail };
}

function lockAnswer(){
  const q = curQ(), rt = S.rt;
  if(!q || !rt || rt.locked) return;
  if(q.type==='branch' && rt.picks.indexOf(-1)>=0){ return; }
  const g = gradeQuestion(q, rt);
  const raw = g.frac;
  const frac = rt.hintUsed ? Math.max(0, raw - HINT_COST) : raw;
  const earned = frac * qw(q);
  rt.locked = true;
  S.res[q.id] = { q:q, rt:rt, frac:frac, raw:raw, earned:earned, hint:rt.hintUsed, detail:g.detail };
  drawQuestion();
  paintTop();
  const fb = $('#fbSlot');
  if(fb){
    fb.innerHTML = feedbackHTML(q, S.res[q.id]);
    fb.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

function feedbackHTML(q, r){
  const st = stateOf(r.frac);
  const cls = st==='ok' ? 'ok' : (st==='part' ? 'part' : 'bad');
  const head = st==='ok' ? '✓ Correct' : (st==='part' ? '◐ Partly correct' : '✗ Incorrect');
  const pctTxt = Math.round(r.raw*100)+'% of the marks'+(r.hint ? ' − 10% hint = '+Math.round(r.frac*100)+'%' : '');
  return '<div class="fb '+cls+'">'+
    '<div class="fbhead">'+head+' <span class="pill">'+pctTxt+'</span></div>'+
    '<div class="fbbody">'+
      '<div style="margin-bottom:10px">'+r.detail+'</div>'+
      '<b>Why:</b> '+esc(q.explain)+
      (st!=='ok' ? '<div class="focusbox"><b>What to focus on:</b> '+esc(q.focus)+'</div>' : '')+
    '</div></div>';
}

/* =====================================================================
   SUBMIT + RESULTS
   ===================================================================== */
function renderSubmit(){
  const answered = S.order.filter(function(q){ return S.res[q.id]; }).length;
  const left = S.order.length - answered;
  const rows = S.order.map(function(q,i){
    const r = S.res[q.id];
    return '<div class="rpt '+(r?stateOf(r.frac):'')+'" style="margin-bottom:7px"><div class="rh">'+
      '<span class="n">'+String(i+1).padStart(2,'0')+'</span>'+
      '<span class="t">'+esc(q.title)+'</span>'+
      (r ? '<span class="pill '+stateOf(r.frac)+'">'+Math.round(r.frac*100)+'%</span>' : '<span class="pill bad">not answered</span>')+
      '</div></div>';
  }).join('');
  STAGE.innerHTML =
    '<div class="card"><h1>Review before you submit</h1>'+
    '<p class="mut">You answered <b>'+answered+'</b> of '+S.order.length+' exercises. '+
    (left ? '<span style="color:#f59e0b">'+left+' still have no answer and will score zero.</span>' : 'All exercises are answered.')+'</p>'+
    '<div class="row"><button class="btn" id="backToQ">← Go back to exercise '+S.order.length+'</button>'+
    '<button class="btn btn-primary" id="submitBtn">Submit exam and see results</button></div></div>'+
    '<div class="card"><h3>Your progress</h3>'+rows+'</div>';
  paintTop();
  const cf = $('#checkBtn'); if(cf) cf.classList.add('hidden');
  const nf = $('#nextBtn'); if(nf) nf.classList.add('hidden');
  const hf = $('#hintBtn'); if(hf) hf.classList.add('hidden');
  $('#backToQ').onclick = function(){ navTo(S.order.length-1); };
  $('#submitBtn').onclick = function(){ finishExam(); };
}

function finishExam(){
  clearInterval(S.tick);
  S.phase = 'results';
  TOP.classList.add('hidden');
  NAV.classList.add('hidden');
  const total = possibleTotal();
  const earned = earnedTotal();
  const p = total ? earned/total*100 : 0;
  const pass = p >= PASS_MARK;
  const used = S.timeTotal - S.timeLeft;
  const okCount = Object.keys(S.res).filter(function(k){ return stateOf(S.res[k].frac)==='ok'; }).length;
  const partCount = Object.keys(S.res).filter(function(k){ return stateOf(S.res[k].frac)==='part'; }).length;
  const badCount = Object.keys(S.res).filter(function(k){ return stateOf(S.res[k].frac)==='bad'; }).length;
  const unsure = (p >= PASS_MARK-3 && p <= PASS_MARK+3);

  const themeRows = Object.keys(THEMES).map(function(k){
    const qs = S.order.filter(function(q){ return q.theme===k; });
    if(!qs.length) return '';
    const tw = qs.reduce(function(s,q){ return s+qw(q); },0);
    const te = qs.reduce(function(s,q){ const r=S.res[q.id]; return s+(r?r.earned:0); },0);
    const pc = tw ? te/tw*100 : 0;
    const col = pc>=80 ? '#22c55e' : (pc>=50 ? '#f59e0b' : '#ef4444');
    return '<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between">'+
      '<span class="small"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+THEMES[k].color+';margin-right:7px"></i>'+esc(THEMES[k].name)+'</span>'+
      '<span class="small mono" style="color:'+col+'">'+Math.round(pc)+'%</span></div>'+
      '<div class="tmbar" style="width:100%;margin-top:5px"><i style="width:'+pc+'%;background:'+col+'"></i></div></div>';
  }).join('');

  const report = S.order.map(function(q,i){
    const r = S.res[q.id];
    const st = r ? stateOf(r.frac) : 'bad';
    const head = r ? (st==='ok' ? '✓ Correct' : (st==='part' ? '◐ Partly correct' : '✗ Incorrect')) : '— Not answered';
    return '<div class="rpt '+st+'">'+
      '<div class="rh"><span class="n">'+String(i+1).padStart(2,'0')+'</span>'+
        '<span class="t">'+esc(q.title)+'</span>'+
        '<span class="pill" style="color:'+THEMES[q.theme].color+';border-color:'+THEMES[q.theme].color+'">'+esc(THEMES[q.theme].short)+'</span>'+
        '<span class="pill">'+esc(TYPE_LABEL[q.type])+'</span>'+
        '<span class="pill '+(st==='ok'?'ok':(st==='part'?'warn':'bad'))+'">'+head+'</span>'+
        '<span class="pill">'+(r?Math.round(r.earned)+'/'+qw(q)+' pts':'0/'+qw(q)+' pts')+'</span>'+
        (r && r.hint ? '<span class="pill warn">hint used</span>' : '')+
      '</div>'+
      '<div class="rb">'+
        '<div style="margin-bottom:9px"><b>Situation:</b> '+esc(q.scenario||'')+'</div>'+
        (r ? '<div style="margin-bottom:9px">'+r.detail+'</div>'
           : '<div class="answerline">You ran out of time or skipped this exercise. No answer was recorded.</div>')+
        '<div style="margin-bottom:9px"><b>Why:</b> '+esc(q.explain)+'</div>'+
        (st!=='ok' ? '<div class="focusbox"><b>What to focus on:</b> '+esc(q.focus)+'</div>' : '')+
      '</div></div>';
  }).join('');

  const certNo = 'OTSC1-'+Math.random().toString(36).slice(2,7).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();

  STAGE.innerHTML =
    '<div class="verdict '+(pass?'pass':'fail')+'">'+
      '<div class="pill '+(pass?'ok':'bad')+'">'+(S.timedOut?'TIME EXPIRED — AUTO SUBMITTED':'FINAL RESULT')+'</div>'+
      '<h1>'+(pass?'PASS':'FAIL')+'</h1>'+
      '<div class="bigscore" style="color:'+(pass?'#4ade80':'#f87171')+'">'+p.toFixed(1)+'%</div>'+
      '<p class="mut" style="margin-top:8px">Passing score: '+PASS_MARK+'% &nbsp;•&nbsp; You scored '+Math.round(earned)+' of '+total+' points</p>'+
      (pass
        ? '<div class="seal" style="border-color:#4ade80;color:#4ade80"><b>'+p.toFixed(0)+'%</b><span>OTSC-1</span><span>CERTIFIED</span></div>'+
          '<p class="small" style="color:#a9f3c4;margin-top:6px">ICS / SCADA Security Analyst — certificate '+certNo+'</p>'+
          '<p class="mut small">You demonstrated working knowledge of OT architecture, industrial protocols, the ICS threat landscape, OT incident response and the IEC 62443 / NIST SP 800-82 control space.</p>'
        : '<p style="color:#ffc0c0">You did not reach '+PASS_MARK+'%. You must retake the exam to be certified.</p>'+
          (unsure ? '<p class="small" style="color:#ffd98a">You are within three points of the pass mark. Read the focus notes below, then retake it — the questions and the answer positions are reshuffled, so you must really know the material.</p>'
                  : '<p class="mut small">Work through the report below. Each wrong exercise tells you exactly which topic to study before you try again.</p>'))+
    '</div>'+

    '<div class="card"><h2>Score breakdown</h2>'+
      '<div class="statgrid">'+
        '<div class="stat"><b style="color:#4ade80">'+okCount+'</b><span>Fully correct</span></div>'+
        '<div class="stat"><b style="color:#f59e0b">'+partCount+'</b><span>Partly correct</span></div>'+
        '<div class="stat"><b style="color:#f87171">'+badCount+'</b><span>Incorrect or skipped</span></div>'+
        '<div class="stat"><b>'+fmt(used)+'</b><span>Time used of '+fmt(S.timeTotal)+'</span></div>'+
      '</div>'+
      '<h3 style="margin-top:20px">Per theme</h3>'+themeRows+
    '</div>'+

    '<div class="card" style="text-align:center">'+
      '<h2>'+(pass?'Keep the edge':'Try again')+'</h2>'+
      '<p class="mut">'+(pass?'Retake it later to confirm that the knowledge stayed. Every attempt reshuffles both the questions and the answer positions.'
        :'The retake reshuffles every question and every answer position. Read the focus notes first, then go again.')+'</p>'+
      '<button class="btn btn-primary" id="retakeBtn" style="padding:12px 30px;font-size:16px">Retake exam ↻</button>'+
    '</div>'+

    '<div class="card"><h2>Detailed report — all '+S.order.length+' exercises</h2>'+
      '<p class="mut small">Each entry shows what you answered, what was correct, why, and what to study if you got it wrong.</p>'+
      report+'</div>';

  $('#retakeBtn').onclick = function(){ window.scrollTo({top:0}); startExam(); };
}

/* =====================================================================
   PAUSE
   ===================================================================== */
function togglePause(force){
  if(S.phase!=='exam') return;
  const want = (typeof force==='boolean') ? force : !S.paused;
  if(want && S.idx>=S.order.length) return;
  S.paused = want;
  WRAP.classList.toggle('blurred', want);
  $('#pauseOverlay').classList.toggle('hidden', !want);
  $('#pauseBtn').textContent = want ? 'Resume' : 'Pause';
  paintTimer();
}

/* =====================================================================
   WIRING
   ===================================================================== */
document.addEventListener('click', function(e){
  const dot = e.target.closest ? e.target.closest('.qdot') : null;
  if(dot && S.phase==='exam'){ navTo(+dot.dataset.go); }
});
$('#checkBtn').onclick = lockAnswer;
$('#prevBtn').onclick  = function(){ navTo(S.idx-1); };
$('#nextBtn').onclick  = function(){
  if(S.idx >= S.order.length-1){ S.idx = S.order.length; S.rt = null; renderSubmit(); window.scrollTo({top:0}); }
  else navTo(S.idx+1);
};
$('#hintBtn').onclick  = useHint;
$('#pauseBtn').onclick = function(){ togglePause(); };
$('#resumeBtn').onclick = function(){ togglePause(false); };
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && S.phase==='exam') togglePause();
});
window.addEventListener('beforeunload', function(e){
  if(S.phase==='exam'){ e.preventDefault(); e.returnValue=''; }
});

buildIntro();
</script>
</body>
</html>
