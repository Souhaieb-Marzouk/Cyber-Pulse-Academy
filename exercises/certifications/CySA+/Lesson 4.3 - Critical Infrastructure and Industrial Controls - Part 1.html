const QUESTIONS = [

/* ---------- Q1 ---------- */
{
  id:"q1", theme:"arch", type:"buckets", title:"Asset register triage — Northwind Water",
  scenario:"06:40. You are the new OT security analyst at Northwind Water. The asset register was rebuilt from a network scan and nobody sorted it. Put each asset in the layer where it really lives, because the layer decides which firewall rule and which patch window applies to it.",
  task:"Drag each asset into the correct layer. Tap an asset and then tap a layer if you prefer.",
  buckets:[
    {id:"L0",  label:"Field / process layer — touches the water, gas or metal"},
    {id:"L1",  label:"Basic control layer — controllers that drive equipment directly"},
    {id:"L23", label:"Supervisory & site layer — watches, stores and programs"},
    {id:"L45", label:"Enterprise / external layer — business and outside world"}
  ],
  items:[
    {id:"i1", t:"4–20 mA pressure transmitter on the main", b:"L0", why:"It is bolted to the pipe and sends one analogue signal upward."},
    {id:"i2", t:"Motor-operated gate valve actuator", b:"L0", why:"It physically moves the valve when a control signal arrives."},
    {id:"i3", t:"RTD temperature probe in the chlorine room", b:"L0", why:"A sensor that measures the process and nothing else."},
    {id:"i4", t:"Programmable Logic Controller (PLC)", b:"L1", why:"It runs the fast local control loop and drives outputs."},
    {id:"i5", t:"Remote Terminal Unit (RTU) at the remote pump station", b:"L1", why:"It collects field data and reports it over a long-distance link."},
    {id:"i6", t:"Safety Instrumented System logic solver", b:"L1", why:"It independently drives the plant to a safe state, but it is still a controller."},
    {id:"i7", t:"Networked variable frequency drive on the intake pump", b:"L1", why:"A networked drive is an intelligent device on the control network, so it is treated as Level 1."},
    {id:"i8", t:"SCADA master / MTU head-end server", b:"L23", why:"It supervises many sites and does not drive the loop itself."},
    {id:"i9", t:"Operator HMI console in the control room", b:"L23", why:"A screen where humans watch and adjust setpoints."},
    {id:"i10", t:"Process historian", b:"L23", why:"It stores process values for trends and reports."},
    {id:"i11", t:"Engineering workstation with the PLC programming suite", b:"L23", why:"It holds the project files and downloads logic to controllers."},
    {id:"i12", t:"Corporate Active Directory domain controller", b:"L45", why:"Business identity service. It must never reach a Level 1 device directly."}
  ],
  hint:"Ask one question per asset: does it touch the process, does it run the control loop, or does it only watch, store or program the system?",
  explain:"ICS layers are usually drawn with the Purdue model. Level 0 is the physical process: the sensors and actuators that touch the water, the gas or the metal. Level 1 is the basic control layer, where PLCs, RTUs, drives and safety logic drive equipment directly. Level 2 is area supervision, where HMIs let operators watch and change setpoints. Level 3 is site operations, where historians and engineering workstations live. Level 4 is the business network. A common mistake is to place the HMI or the historian in the control layer. They are supervisory, not control. The engineering workstation looks harmless but it holds the programming software, so it is one of the most dangerous assets in the plant. Devices that sit on the boundary, such as a networked variable frequency drive, are normally treated as Level 1 because they are addressable on the control network.",
  focus:"Study the Purdue model layer by layer and learn which asset belongs to which level. Practise drawing it from memory with three examples per level."
},

/* ---------- Q2 ---------- */
{
  id:"q2", theme:"arch", type:"pair", title:"Component to job — plant induction quiz",
  scenario:"Your plant manager is not technical but signs the security budget. You must explain each component in one line. Link every component on the left with the correct description on the right.",
  task:"Click a component, then click its description. Click an assigned description to take it back.",
  pairs:[
    {id:"p1", left:"Remote Terminal Unit (RTU)", right:"Collects measurements at a far-away site and reports them to the control centre over a long-distance link."},
    {id:"p2", left:"Programmable Logic Controller (PLC)", right:"Runs a fast local control loop and opens or closes equipment from its own inputs, even if the network is down."},
    {id:"p3", left:"Human-Machine Interface (HMI)", right:"The screen where the operator watches the process and changes setpoints."},
    {id:"p4", left:"Process historian", right:"Stores years of process values so that trends, reports and investigations are possible."},
    {id:"p5", left:"Engineering workstation (EWS)", right:"Holds the programming software and project files, and downloads logic into controllers."},
    {id:"p6", left:"Data diode / unidirectional gateway", right:"Lets data travel in one direction only, so nothing can come back into the control network."},
    {id:"p7", left:"Safety Instrumented System (SIS)", right:"A separate system that shuts the plant down safely when the process goes outside its limits."},
    {id:"p8", left:"Intelligent Electronic Device (IED)", right:"A substation protection device that trips a breaker in milliseconds when it detects a fault."},
    {id:"p9", left:"Distributed Control System (DCS)", right:"One vendor's integrated platform that controls a whole continuous plant, such as a refinery."}
  ],
  hint:"Two of these devices exist only to keep people safe, and one of them must be completely independent of the normal control system.",
  explain:"RTUs serve remote, spread-out sites; PLCs serve fast local logic. An HMI is only a window for humans. A historian is a database, not a controller. The engineering workstation is a tool that can change controller logic, which makes it a high-value target. A data diode enforces one-way flow by physics, not by a rule that somebody could change. An SIS is the last line of defence and must stay independent from the control system, otherwise one attack removes both layers. An IED does protection work in a substation. A DCS is a single integrated platform from one vendor, unlike SCADA, which normally supervises many separate sites.",
  focus:"Learn the one-line purpose of each ICS component, and especially which components can write to a controller (EWS) and which ones exist only for safety (SIS, IED)."
},

/* ---------- Q3 ---------- */
{
  id:"q3", theme:"arch", type:"pair", title:"Protocol identification from a capture",
  scenario:"A junior analyst captured traffic on the process network and cannot tell the protocols apart. Match every protocol with the correct description. This matters, because each protocol has a different way to be abused.",
  task:"Click a protocol, then click its description.",
  pairs:[
    {id:"p1", left:"Modbus TCP", right:"Simple request/response protocol on port 502 with no authentication and no encryption, so anybody who can reach the port can write."},
    {id:"p2", left:"DNP3", right:"Used by electric and water utilities; supports time-stamped events and unsolicited responses sent by outstations."},
    {id:"p3", left:"IEC 61850 / GOOSE", right:"Substation standard whose GOOSE messages carry trip signals between devices in about three milliseconds."},
    {id:"p4", left:"OPC UA", right:"Modern platform-independent protocol with certificates and encryption, often used between SCADA and higher systems."},
    {id:"p5", left:"PROFINET", right:"Industrial Ethernet used mostly in Siemens factory automation for real-time I/O."},
    {id:"p6", left:"EtherNet/IP", right:"Rockwell / Allen-Bradley industrial Ethernet built on the CIP object model."},
    {id:"p7", left:"HART", right:"Adds digital data on top of an analogue 4–20 mA signal, so a smart transmitter can report diagnostics."},
    {id:"p8", left:"IEC 60870-5-104", right:"Telecontrol protocol over TCP used by many European utilities for substation commands."},
    {id:"p9", left:"Siemens S7 (port 102)", right:"Vendor-specific protocol used to program and read Siemens controllers."}
  ],
  hint:"Sort them by age and by purpose: which ones were designed for speed, which for long-distance telemetry, and which one finally added certificates?",
  explain:"Most industrial protocols were designed for reliability and speed, long before security was a concern. Modbus TCP is the clearest example: port 502, no authentication, no encryption, so a write command is accepted from anyone who can reach it. That is why a single firewall rule can hand an attacker direct control of a process. DNP3 adds time stamps and lets the outstation speak first through unsolicited responses. IEC 61850 / GOOSE is the substation standard and is extremely fast, which is also why a spoofed GOOSE message can trip a breaker. OPC UA is the modern one and does support certificates. PROFINET and EtherNet/IP are factory Ethernet variants. HART rides on top of the old analogue loop. IEC 60870-5-104 is telecontrol over TCP. S7 on port 102 is Siemens-specific and appears directly in the PIPEDREAM / INCONTROLLER toolkit.",
  focus:"Memorise the port and the security weakness of Modbus (502), S7 (102) and GOOSE, then learn what DNP3, OPC UA and IEC 60870-5-104 are for."
},

/* ---------- Q4 ---------- */
{
  id:"q4", theme:"arch", type:"order", title:"Build the network model from the process upward",
  scenario:"The design workshop has the seven layers of an industrial network on the whiteboard, but they were written without numbers in a random order. Rebuild the model from the bottom, where the water is, to the top, where the outside world is.",
  task:"Drag the rows, or use the arrows, to put the layers in the correct order from bottom to top.",
  items:[
    {id:"n0", t:"Physical process — sensors, valves and motors that touch the water"},
    {id:"n1", t:"Basic control — PLCs, RTUs and SIS logic that run the loop"},
    {id:"n2", t:"Area supervisory — HMIs and operator stations that watch one area"},
    {id:"n3", t:"Site operations — historian, engineering workstation and patch staging"},
    {id:"n4", t:"IT/OT DMZ — jump host, replica historian and vendor access broker"},
    {id:"n5", t:"Enterprise — email, ERP and Active Directory"},
    {id:"n6", t:"External — vendor remote support and cloud services"}
  ],
  hint:"The DMZ does not belong to either side. It sits exactly between the plant and the business network, and nothing crosses it without a controlled stop.",
  explain:"This is the Purdue model, also linked to the ISA-95 hierarchy. Level 0 is the physical process; Level 1 is basic control; Level 2 is area supervisory; Level 3 is site operations; Level 3.5 is the IT/OT DMZ; Level 4 is the enterprise; Level 5 is the external world. The important security idea is not memorising numbers, it is that traffic must be forced to climb one level at a time and stop in the DMZ. A direct path from Level 4 to Level 1, such as a corporate laptop reaching a PLC on port 502, removes every control layer at once. That is exactly the flat design attackers look for.",
  focus:"Practise reproducing the seven levels and naming one asset and one control per level. Remember that Level 3.5 (the DMZ) exists to break direct paths."
},

/* ---------- Q5 ---------- */
{
  id:"q5", theme:"itot", type:"mcq", title:"Choosing the protection priority for a packaging plant",
  scenario:"A packaging plant is redesigning one of its lines. Engineering can only optimise for one property first, and the board asks you to state the OT priority order in writing. You know that a wrong command here can break a machine and injure a worker.",
  task:"Which ordering matches real OT practice?",
  options:[
    {t:"Confidentiality, then integrity, then availability, then safety.", ok:false},
    {t:"Safety, then availability, then integrity, then confidentiality.", ok:true},
    {t:"Integrity, then confidentiality, then availability, then safety.", ok:false},
    {t:"Availability, then confidentiality, then safety, then integrity.", ok:false}
  ],
  hint:"In IT the classic order starts with secrecy. Ask yourself what changes when a data mistake can physically hurt a person standing next to a machine.",
  explain:"The classic IT triad is CIA: confidentiality, integrity, availability. OT usually reverses the order into AIC, and adds safety at the very front. Safety comes first because a wrong command can injure a worker or release chlorine into drinking water. Availability comes next because stopping a water or power service harms the public, and a stopped production line costs a lot of money per hour. Integrity follows, because control commands and process values must be correct for the loop to work. Confidentiality is last because process data such as a tank level is far less sensitive than a customer database. The order that starts with confidentiality is the classic IT order, usually written as CIA. In OT the same three properties are reordered as AIC, with safety placed in front of all of them. Any order that pushes safety into third or last place repeats the mistake that turns a cyber incident into a physical one.",
  focus:"Learn to say the OT order out loud: safety, availability, integrity, confidentiality. Then be able to explain why confidentiality drops to last, using a concrete example."
},

/* ---------- Q6 ---------- */
{
  id:"q6", theme:"itot", type:"buckets", title:"Two worlds, one company — sort the constraints",
  scenario:"Northwind Water has just merged its IT and OT security teams. During the first meeting, every sentence started with 'but in our world we...'. Sort each working constraint into the world it describes, so the new team stops arguing about the wrong things.",
  task:"Drag each constraint into IT or OT.",
  buckets:[
    {id:"IT", label:"Typical IT system"},
    {id:"OT", label:"Typical OT system"}
  ],
  items:[
    {id:"a1", t:"Patch every month and reboot whenever the update needs it", b:"IT", why:"Short patch cycles and easy reboots are normal for business systems."},
    {id:"a2", t:"Patch only during a planned outage, sometimes years apart", b:"OT", why:"A reboot can stop a city's water supply, so updates wait for a shutdown."},
    {id:"a3", t:"Hardware is replaced after three to five years", b:"IT", why:"Business refresh cycles are short and driven by warranty and support."},
    {id:"a4", t:"Controllers stay in service for fifteen to twenty-five years", b:"OT", why:"Long lifecycles mean unsupported operating systems and no firmware fix."},
    {id:"a5", t:"Downtime is annoying; users can wait until the problem is fixed", b:"IT", why:"Business users tolerate an outage much better than a physical process does."},
    {id:"a6", t:"A reboot can stop a city's water supply", b:"OT", why:"Here availability has a public safety meaning, not just a cost meaning."},
    {id:"a7", t:"Strong unique passwords and MFA on every user account", b:"IT", why:"Identity control is mature and enforced by directory policy."},
    {id:"a8", t:"Shared operator accounts and hard-coded firmware passwords nobody can change", b:"OT", why:"Legacy design left hard-coded credentials and shared accounts that destroy accountability."},
    {id:"a9", t:"Antivirus agents are installed everywhere by default", b:"IT", why:"Endpoint protection is standard and cheap on business machines."},
    {id:"a10", t:"Endpoint agents are often refused because they can slow or reboot a control node", b:"OT", why:"A scan or a quarantine action can break a real-time control loop."},
    {id:"a11", t:"The network is designed mainly to protect the confidentiality of business data", b:"IT", why:"Secrecy of business information is the main IT driver."},
    {id:"a12", t:"The network is designed for deterministic, real-time delivery of small messages", b:"OT", why:"Late data is useless data; jitter can destabilise a control loop."},
    {id:"a13", t:"A weekly change window with low risk and an easy rollback", b:"IT", why:"Frequent small changes are normal and reversible in business systems."},
    {id:"a14", t:"Any change needs an engineering review, a test and a physical rollback plan", b:"OT", why:"A bad change can damage equipment or create an unsafe state."}
  ],
  hint:"Do not ask which system is more secure. Ask which system is allowed to stop, because that single question explains almost every difference on the list.",
  explain:"The two worlds differ because of consequences. IT optimises for confidentiality and short, reversible change cycles. OT optimises for deterministic real-time behaviour and for staying up, because stopping the plant can harm the public. That is why patching waits for outages, why hardware lives twenty years, why antivirus is sometimes refused, and why a change needs an engineering review. The legacy consequences are the dangerous ones: shared operator accounts and unchangeable firmware passwords remove accountability, and an operating system that is no longer supported never receives a fix. These are not laziness. They are engineering trade-offs that a security analyst must understand before proposing a control. One nuance: multi-factor authentication is still expected for remote and vendor access in OT. It is the control-room console, not the concept, that makes it impractical there.",
  focus:"Memorise four OT realities: long lifecycle, outage-based patching, real-time determinism, and safety-driven availability. Be able to justify each one with a consequence."
},

/* ---------- Q7 ---------- */
{
  id:"q7", theme:"itot", type:"multi", title:"Convergence review — what is actually true?",
  scenario:"Northwind Water wants the plant historian replicated into the corporate data lake so that analytics can predict pump failures. The architect writes five claims in the design document. Select every claim that is technically true.",
  task:"Select exactly the true statements, then lock in. Partial credit applies.",
  options:[
    {t:"A compromised corporate laptop can become an entry point into the control network.", ok:true},
    {t:"The DMZ must never allow a direct connection from the enterprise zone to a controller.", ok:true},
    {t:"Pulling data upward for analytics also creates a path that attackers can push commands down.", ok:true},
    {t:"Once the historian sits in the DMZ, the OT network can be treated like any other IT subnet.", ok:false},
    {t:"Convergence removes the need for a firewall, because the two sides use different protocols.", ok:false},
    {t:"Convergence only affects confidentiality, so availability does not need to be reviewed.", ok:false}
  ],
  hint:"Think about direction. Convergence projects always describe data going up. Ask what else can travel along the same path, in the other direction.",
  explain:"IT/OT convergence means the two networks start sharing data and, often, sharing paths. The first three statements are true. A business laptop that can reach a plant device is a real entry point. A DMZ exists exactly to stop a direct enterprise-to-controller path. And every channel that carries data upward is a potential channel for commands downward, because most industrial protocols have no authentication and do not care who is asking. The statement about treating the plant like any other subnet is false: a DMZ historian is still reachable from the business side, and the OT network still needs its own zones, rules and monitoring. The statement about the firewall is false precisely because the protocols differ, and a firewall that understands Modbus can block a write while allowing a read. The statement about confidentiality is false because convergence mainly threatens availability and integrity, which are the top OT priorities.",
  focus:"Learn to review a convergence design by asking two questions: which paths exist, and what can travel back along each of them."
},

/* ---------- Q8 ---------- */
{
  id:"q8", theme:"itot", type:"mcq", title:"The air gap that is not an air gap",
  scenario:"The plant manager tells you: 'Our control network is air-gapped, so we do not need OT monitoring.' During a walk-around you find a vendor VPN for remote support, a 4G router that the maintenance team uses for tablets, and a USB stick that carries daily reports to the corporate network.",
  task:"What is the correct professional response?",
  options:[
    {t:"Agree, because an air gap removes every remote attack path, so the budget is better spent elsewhere.", ok:false},
    {t:"Explain that the plant is not truly air-gapped, and that each bridge needs control and monitoring.", ok:true},
    {t:"Ask the vendor to sign a non-disclosure agreement with the plant, then keep the current design as it is.", ok:false},
    {t:"Disconnect the historian and stop all reporting to the board until the vendor VPN is permanently removed.", ok:false}
  ],
  hint:"An air gap is a physical fact, not a policy statement. Count the things in the story that can carry data across the gap.",
  explain:"An air gap only exists when there is no path at all. A vendor VPN, a 4G router and a removable USB stick are three bridges, so the network is connected, not isolated. The correct answer is to correct the belief and then control and monitor each bridge, because attackers use exactly these paths: Havex used vendor and supplier channels, and Stuxnet is believed to have crossed an air gap on removable media. Agreeing is wrong because the premise is false: three bridges exist, so the network is connected. A contract with the vendor does not stop malware. And switching off monitoring and reporting is a large action against the wrong target, because it destroys visibility while leaving all three bridges exactly where they are.",
  focus:"Learn the phrase 'air gap is a physical property'. Then practise listing the bridges you would check: remote access, wireless, removable media, shared vendors and dual-homed hosts."
},

/* ---------- Q9 ---------- */
{
  id:"q9", theme:"itot", type:"multi", title:"As-built review of the Riverside plant",
  scenario:"You review the as-built document of the Riverside water plant before the state drinking-water regulator's audit. Read the extract, then select every item that is a genuine security finding.",
  task:"Select all real findings. Partial credit applies.",
  text:"AS-BUILT EXTRACT — RIVERSIDE\n• All devices, from the PLCs to the corporate file server, sit in 10[.]20[.]0[.]0/16 with no internal firewalls.\n• The vendor connects by VPN straight to engineering workstation EWS-03 in the control room.\n• Every HMI logs in with the account operator / operator1.\n• The HMI runs Windows XP Embedded and the vendor has no update path.\n• The plant has a documented OT incident response plan that is reviewed and exercised every year.\n• The replica historian inside the DMZ is patched during the monthly corporate patch window.",
  options:[
    {t:"One flat subnet with no segmentation between the enterprise and control zones.", ok:true},
    {t:"The vendor VPN terminates directly on a control-room device instead of inside the DMZ.", ok:true},
    {t:"A shared operator account with a weak, guessable password gives no accountability.", ok:true},
    {t:"An unsupported operating system with no vendor update path stays exposed for years.", ok:true},
    {t:"The OT incident response plan is reviewed and exercised once a year.", ok:false},
    {t:"The DMZ replica historian is patched in the monthly corporate window.", ok:false}
  ],
  hint:"Four of the six lines are problems. The other two describe things that are either good practice or completely normal for a device that is not in the control loop.",
  explain:"The first four lines are real findings. A flat 10[.]20[.]0[.]0/16 that contains both the corporate file server and the PLCs means one compromised laptop is one hop from the process. A vendor VPN that lands on the engineering workstation gives an outside party the exact tool that can change controller logic, with no DMZ stop. The shared account operator / operator1 destroys attribution: after an incident you cannot tell who did what. Windows XP Embedded with no update path means the flaw will never be fixed, so it needs compensating controls instead. The last two lines are not findings. Reviewing and exercising an OT IR plan every year is good practice. Patching a replica historian in the DMZ during the corporate window is normal and safe, because that device is not in the control loop; the same treatment applied to a PLC would be a serious finding.",
  focus:"Practise separating a finding from normal practice. A finding always needs two parts: what is wrong, and what consequence it creates for the process."
},

/* ---------- Q10 ---------- */
{
  id:"q10", theme:"threat", type:"order", title:"Reconstruct the grid attack — Ukraine-style playbook",
  scenario:"Lessons-learned workshop. Your team must rebuild the sequence of a real grid attack, from the first email to the moment field crews have to drive to every substation. Put the steps in the correct order.",
  task:"Drag the steps into the correct sequence, first action at the top.",
  items:[
    {id:"s1", t:"A spear-phishing email with a malicious Office document reaches a corporate user."},
    {id:"s2", t:"An implant starts beaconing to hxxp://update-svc[.]example and the attacker has an IT foothold."},
    {id:"s3", t:"Credentials are stolen from the corporate domain and the IT/OT boundary is mapped."},
    {id:"s4", t:"The attacker pivots through the shared jump host into the OT network."},
    {id:"s5", t:"Traffic is captured to learn device addresses, protocol commands and the operator schedule."},
    {id:"s6", t:"Remote administration tools open breakers and disable UPS and communication equipment."},
    {id:"s7", t:"Operators lose visibility, and field crews must drive to each site to restore power by hand."}
  ],
  hint:"Start where the attacker is weakest and cheapest, and finish where the defender has lost the ability to see anything at all.",
  explain:"Real ICS campaigns follow this shape. Access starts in IT, because business networks are easier and the attacker only needs one mailbox. Spear-phishing is the usual first step. Once inside, the implant beacons out for instructions. The attacker then steals credentials and moves laterally through the business network, looking for the jump host, the VPN or the dual-homed machine that also touches OT. Only then does the pivot into the control network happen. What follows is patience: traffic is captured to learn addresses, command formats and when operators are on shift. In the Ukrainian grid attacks, the destructive stage combined unauthorised commands with the disabling of UPS and communication equipment, so operators could not see or control anything. The final step is on this list for a reason: the real damage is the loss of visibility, which forces manual restoration and turns a cyber incident into a physical outage.",
  focus:"Learn the recurring ICS attack pattern: initial access in IT, credential theft, boundary pivot, protocol reconnaissance, then impact through the process. Be able to name the stage after any given event."
},

/* ---------- Q11 ---------- */
{
  id:"q11", theme:"threat", type:"pair", title:"Name that incident — threat-intel briefing",
  scenario:"You must brief the night shift on the incidents that shaped OT security. Match each name with what actually happened. Precision matters: the brief is used to justify new controls.",
  task:"Click a name, then click its description.",
  pairs:[
    {id:"p1", left:"Stuxnet", right:"A worm that changed centrifuge speeds in an enrichment plant and hid the change from the operators."},
    {id:"p2", left:"Industroyer", right:"Malware with built-in protocol modules that opened breakers in the Ukrainian grid in 2016."},
    {id:"p3", left:"Triton / Trisis", right:"The first malware that attacked a safety instrumented system, trying to disable the plant's last line of defence."},
    {id:"p4", left:"Havex", right:"An espionage campaign that scanned industrial sites for OPC servers, mainly in Europe."},
    {id:"p5", left:"BlackEnergy", right:"Compromised the utility's IT network and HMIs, then wiped systems and cut power in Ukraine in 2015."},
    {id:"p6", left:"PIPEDREAM / INCONTROLLER", right:"A vendor-independent toolkit that can talk to many PLC brands and was built as a reusable weapon."},
    {id:"p7", left:"Colonial Pipeline ransomware", right:"An attack on the business network that made the company shut the pipeline down for days."},
    {id:"p8", left:"Oldsmar water plant", right:"An intruder used remote access to raise the amount of lye in the drinking water."}
  ],
  hint:"Three of these did not need to touch the process at all to cause physical consequences. Find those three first.",
  explain:"Stuxnet was the turning point because it changed the physical output of a plant and then lied to the operators about it. Industroyer showed that attackers could speak industrial protocols directly, and PIPEDREAM / INCONTROLLER made that capability reusable across vendors. Triton / Trisis is treated as the most alarming of all, because it targeted the safety instrumented system, the layer that exists to prevent a catastrophe. Havex was mostly espionage and used OPC to inventory industrial sites. BlackEnergy attacked the IT network and the HMIs and then cut power. Colonial Pipeline is the clearest lesson about convergence: the ransomware hit the business network, and the company shut the pipeline down itself because it could not safely bill or operate. Oldsmar proved that a remote-access path into a small water plant is enough to threaten drinking water.",
  focus:"For each named incident, learn one sentence: what it targeted and what changed afterwards. That pair of facts is what makes threat intel useful."
},

/* ---------- Q12 ---------- */
{
  id:"q12", theme:"threat", type:"mcq", title:"Trilog.exe on the engineering workstation",
  scenario:"03:10. A file called trilog.exe is found on engineering workstation EWS-03, and the SIS logic solver in the compressor house shows a modified program with a changed trip point. The plant manager asks why this is worse than a normal malware infection.",
  task:"What is the most accurate answer?",
  options:[
    {t:"The SIS speaks an old protocol, so anybody who can reach that network can read its traffic.", ok:false},
    {t:"The attack hit the system meant to keep the process safe, so people can be hurt.", ok:true},
    {t:"The SIS is reachable from the corporate network, so production data can be stolen.", ok:false},
    {t:"The SIS runs on Windows Server, so a normal antivirus scan would have detected the file.", ok:false}
  ],
  hint:"Ask what the SIS exists to do, and then ask what happens to the plant when the thing that stops a disaster is changed instead of the thing that runs production.",
  explain:"The SIS is the last line of defence. It sits outside the normal control loop and only acts when the process goes outside safe limits, for example by closing a valve or tripping a compressor. Triton / Trisis targeted exactly that layer, and that is why it is considered a step change: an attacker who can change a trip point can prevent the plant from protecting itself, so the physical consequence is no longer limited by engineering safeguards. Reading traffic is a genuine weakness of many industrial protocols, but it is not the point here, because an attacker who can read a controller can usually write to it as well. Confusing safety with data theft misses the physical consequence. And the antivirus claim is false twice over: the safety controller itself is not a Windows machine, and the Triton file was dropped on the Windows engineering workstation, where it was disguised as vendor support software.",
  focus:"Be able to explain in one sentence why an attack on the safety layer is different from an attack on the production layer."
},

/* ---------- Q13 ---------- */
{
  id:"q13", theme:"threat", type:"logview", title:"Alert triage — unauthorised Modbus write at 02:14",
  scenario:"02:14. You are the on-call OT analyst. No change request is open, and the plant is dosing chlorine. Use the filter box to work through the evidence, then answer.",
  task:"What do these logs show, and what is the most accurate description of the event?",
  log:[
    {t:"02:14:06.118", s:"fw-edge", l:"ALLOW", m:"src=10[.]20[.]5[.]44 dst=10[.]42[.]7[.]31:502 proto=tcp rule=IT-TO-OT-ANY"},
    {t:"02:14:06.402", s:"plc-31",  l:"INFO",  m:"Modbus/TCP txid=0x1a unit=1 fc=1 (Read Coils) from 10[.]20[.]5[.]44"},
    {t:"02:14:07.998", s:"plc-31",  l:"INFO",  m:"Modbus/TCP txid=0x1b unit=1 fc=3 (Read Holding Registers) from 10[.]20[.]5[.]44"},
    {t:"02:14:09.331", s:"plc-31",  l:"WARN",  m:"Modbus/TCP txid=0x1c unit=1 fc=5 (Write Single Coil) addr=0x0000 value=0xFF from 10[.]20[.]5[.]44"},
    {t:"02:14:09.556", s:"plc-31",  l:"WARN",  m:"Modbus/TCP txid=0x1d unit=1 fc=6 (Write Single Register) addr=0x0007 value=0x0258 (600 = 60.0%) from 10[.]20[.]5[.]44"},
    {t:"02:14:09.712", s:"scada-01",l:"WARN",  m:"Setpoint SP-07 changed 35.0% -> 60.0% by session operator (src 10[.]20[.]5[.]44)"},
    {t:"02:14:11.004", s:"plc-31",  l:"INFO",  m:"Pump P-3 started per coil 0x0000"},
    {t:"02:14:12.880", s:"ids-01",  l:"ALERT", m:"Modbus write from host outside OT asset list: 10[.]20[.]5[.]44 not in ot_assets.csv"}
  ],
  options:[
    {t:"A normal polling cycle from the HMI that read the pump state and then wrote the command as designed.", ok:false},
    {t:"An unauthorised corporate host wrote to the PLC, changed a setpoint, and started a pump.", ok:true},
    {t:"A Modbus protocol error made the PLC reject the write, so the pump started on its own.", ok:false},
    {t:"The historian collected process data, and the setpoint moved because of a sensor fault.", ok:false}
  ],
  hint:"Filter for fc=5 and fc=6 and look at the source address. Then compare that source with the OT asset list.",
  explain:"Modbus function codes tell you the intent of a message. Reading functions such as fc=1 and fc=3 are harmless lookups. fc=5 (Write Single Coil) and fc=6 (Write Single Register) change the process. In this log the same source, 10[.]20[.]5[.]44, reads first and then writes, which is exactly how a tool behaves when it has learned the layout. That source sits in 10[.]20[.]0[.]0/16, the corporate range, and the IDS confirms it is not in the OT asset list. The write changed SP-07 from 35.0% to 60.0% using a session named operator, and the pump started immediately afterwards. Modbus has no authentication, so the PLC cannot tell a real operator from an attacker: whoever can reach port 502 can write. Finally, the firewall rule name IT-TO-OT-ANY already tells you why this was possible.",
  focus:"Learn to read Modbus function codes: 1 and 3 are reads, 5, 6, 15 and 16 are writes. Then always check the source address against the OT asset inventory."
},

/* ---------- Q14 ---------- */
{
  id:"q14", theme:"arch", type:"terminal", title:"Terminal — inventory the substation with Nmap",
  scenario:"You are logged into the OT jump host ot-jump-01. The substation VLAN 10[.]42[.]7[.]0/24 is reachable from here. Before you can defend the devices, you must know which of them speak Modbus. A scan of this network is authorised in the current maintenance window.",
  task:"Type one Nmap command that probes port 502 across the whole substation VLAN and uses the modbus-discover NSE script.",
  host:"ot-jump-01",
  banner:[
    "Northwind Water — OT jump host (authorised use only)",
    "Last login: Tue 02:07:44 from 10[.]20[.]9[.]12",
    "Target VLAN: 10[.]42[.]7[.]0/24   Nmap 7.94 available   ICS scripts: modbus-discover, s7-info, enip-info",
    "Type a command and press Enter. When you are happy with it, press 'Lock in this command'."
  ],
  reqs:[
    {label:"Calls Nmap", re:/\bnmap\b/i},
    {label:"Restricts the scan to Modbus port 502", re:/-p\s*502\b|--ports?\s+502\b/},
    {label:"Uses the modbus-discover script", re:/modbus-discover/i},
    {label:"Targets the substation VLAN 10[.]42[.]7[.]0/24", re:/10(\[\.\]|\.)42(\[\.\]|\.)7(\[\.\]|\.)/}
  ],
  sim:[
    { re:/nmap[^\n]*modbus-discover/i, out:[
      "Starting Nmap 7.94 ( nmap[.]org )",
      "Nmap scan report for plc-31 (10[.]42[.]7[.]31)",
      "PORT    STATE SERVICE",
      "502/tcp open  mbap",
      "| modbus-discover:",
      "|   sid 0x01 (unit 1) — Slave ID data: 0x0d0b0101",
      "|_  Device: Schneider Electric M340",
      "Nmap scan report for rtu-07 (10[.]42[.]7[.]17)",
      "502/tcp open  mbap",
      "| modbus-discover:",
      "|_  sid 0x11 (unit 17) — Slave ID data: 0x0b0101",
      "Nmap done: 256 IP addresses (3 hosts up) scanned in 41.22 seconds"], cls:"ok"},
    { re:/\bnmap\b/i, out:[
      "Starting Nmap 7.94 ( nmap[.]org )",
      "Nmap scan report for 10[.]42[.]7[.]31",
      "PORT     STATE SERVICE",
      "502/tcp  open  mbap",
      "102/tcp  open  iso-tsap",
      "Nmap done: 256 IP addresses (3 hosts up) scanned in 12.04 seconds",
      "(open ports found, but no ICS script was run)"], cls:"warn"},
    { re:/^\s*ls\b/, out:["cases/  captures/  ot_assets.csv  vendor_projects/  golden_logic/"], cls:"dim"},
    { re:/^\s*(help|man)\b/, out:["Try nmap, tshark, plcscan, or read the case folder."], cls:"dim"}
  ],
  hint:"You need four parts in one line: the tool, the port Modbus listens on, the ICS script that speaks it, and the target range.",
  explain:"The command is: nmap -Pn -p 502 --script modbus-discover 10[.]42[.]7[.]0/24. Each part has a job. nmap is the scanner. -p 502 restricts the scan to the one port that matters, which keeps the traffic small and lowers the risk to fragile devices; without it, Nmap would probe its default port list on every address. --script modbus-discover asks Nmap to use the Modbus script, which reads the slave ID and sometimes the device model. The last part is the target range. In a real plant, always agree the scan with the engineering team first, because some legacy controllers crash or slow down when they receive unexpected packets. Passive discovery from a mirrored port is safer when the device is fragile, and active scanning is a deliberate trade-off between visibility and risk.",
  focus:"Learn the shape of an ICS discovery command: tool, restricted port, protocol-aware script, target. Then learn when passive discovery is the safer choice."
},

/* ---------- Q15 ---------- */
{
  id:"q15", theme:"ir", type:"buckets", title:"Incident INC-4412 — file every action under the right phase",
  scenario:"INC-4412 is closed. During the lessons-learned meeting you must file every action and observation under the correct incident response phase, because the audit will ask where each control sat.",
  task:"Drag each line into the correct phase.",
  buckets:[
    {id:"PREP", label:"Preparation"},
    {id:"DET",  label:"Detection & analysis"},
    {id:"CON",  label:"Containment"},
    {id:"ER",   label:"Eradication & recovery"},
    {id:"LL",   label:"Lessons learned"}
  ],
  items:[
    {id:"i1", t:"OT IR playbook exercised with the plant manager; manual-operation procedure printed and kept in the control room.", b:"PREP", why:"This happens before the incident, so the team is ready when it starts."},
    {id:"i2", t:"A spare PLC and a known-good logic backup are stored offline in the instrument workshop.", b:"PREP", why:"Spare hardware and golden copies are readiness items, not response actions."},
    {id:"i3", t:"IDS alert: a Modbus write arrived from 10[.]20[.]5[.]44, a host that is not in the OT asset list.", b:"DET", why:"An alert is the start of detection and analysis."},
    {id:"i4", t:"Historian shows setpoint SP-07 moved from 35.0% to 60.0% at 02:14:09 with no open change ticket.", b:"DET", why:"Correlating evidence to confirm what happened is analysis."},
    {id:"i5", t:"The switch port for the jump host is shut down and the IT-to-OT firewall rule is changed to deny with logging.", b:"CON", why:"These actions stop the spread and cut the attacker's path."},
    {id:"i6", t:"The plant is moved to manual control so the process stays inside safe limits during the investigation.", b:"CON", why:"This limits impact on the physical process while the threat is still present."},
    {id:"i7", t:"PLC logic is compared with the offline golden copy, and a clean program is downloaded in the planned low-demand window.", b:"ER", why:"Removing the malicious logic and returning the device to a known good state."},
    {id:"i8", t:"Engineering workstation EWS-03 is rebuilt from a hardened image and re-joined to the OT domain.", b:"ER", why:"Rebuilding the compromised host is part of recovery."},
    {id:"i9", t:"Root cause written up: the vendor VPN account had no second factor and was shared by three engineers.", b:"LL", why:"Finding the underlying cause is a lessons-learned activity."},
    {id:"i10", t:"The firewall change becomes a permanent zone-and-conduit rule in the IEC 62443 network design.", b:"LL", why:"Turning a temporary fix into a lasting design change is the output of lessons learned."}
  ],
  hint:"Two of these lines describe things that must already exist before the first alert ever fires. Start by separating those.",
  explain:"The classic phases are preparation, detection and analysis, containment, eradication and recovery, and lessons learned. Preparation is everything that exists before the incident: a tested playbook, a printed manual procedure, spare hardware and an offline golden copy of the logic. Detection and analysis is where you notice and confirm: the IDS alert and the historian comparison. Containment stops the damage from growing: shutting the switch port, denying the firewall rule, and moving the plant to manual control so the process stays safe. Eradication and recovery removes the attacker's changes and brings systems back: comparing logic with the golden copy, downloading a clean program, rebuilding the workstation. Lessons learned turns the event into permanent improvement: naming the root cause and converting a temporary firewall change into a permanent zone-and-conduit rule. In OT, containment and safety overlap, because a containment action that destabilises the process is not acceptable.",
  focus:"Learn the five phases and, for each one, one example action from an OT plant. Remember that safety actions sit inside containment in OT."
},

/* ---------- Q16 ---------- */
{
  id:"q16", theme:"ir", type:"mcq", title:"02:20 — the HMI is moving valves by itself",
  scenario:"02:20. An operator shouts that the HMI is opening and closing valves with nobody touching the mouse, and the chlorine dose on the trend is climbing. You are the on-call OT analyst. The control room is fully staffed and the manual bypass panel is working.",
  task:"What is your FIRST action?",
  options:[
    {t:"Pull the network cable from the HMI so that the attacker loses the session immediately.", ok:false},
    {t:"Tell the operator to take the process to a safe state, then isolate the network.", ok:true},
    {t:"Start a full packet capture for thirty minutes first, so that you have complete evidence.", ok:false},
    {t:"Call the vendor and wait for their remote support engineer to log in and help you.", ok:false}
  ],
  hint:"In OT, the first question is never 'how do we catch them'. It is 'is anybody in danger right now, and is the process still under control'.",
  explain:"Safety and the physical process come before everything else, so the first action is to bring the process to a known safe state with manual controls. Only after that do you isolate. Pulling the cable is wrong as a first action for two reasons: it may not stop a command that is already queued inside the PLC, and it removes your visibility while leaving the process in an unknown state. Starting a long capture is wrong because evidence collection never outranks a rising chlorine dose. Calling the vendor is wrong because you would be opening another remote path into a plant that is under attack, and vendor response takes hours. The correct sequence in OT is: make it safe, then isolate, then investigate.",
  focus:"Memorise the OT response order: safety of people, stability of the process, containment, then evidence. Be ready to justify why evidence waits."
},

/* ---------- Q17 ---------- */
{
  id:"q17", theme:"ir", type:"mcq", title:"Blue team: catching a logic download early",
  scenario:"You are the detection engineer for a substation. The threat you care about most is somebody downloading new logic into a controller, because that is the moment the process can be changed. You can only build one high-fidelity detection this quarter.",
  task:"Which detection gives the earliest and most reliable warning?",
  options:[
    {t:"A daily file-integrity scan of the project folder on the engineering workstation.", ok:false},
    {t:"An alert on the program-download function from outside the engineering VLAN.", ok:true},
    {t:"A weekly report of failed logins on the operator HMI consoles in the control room.", ok:false},
    {t:"Antivirus alerts collected from the SCADA master server and the domain controller.", ok:false}
  ],
  hint:"Ask which option fires at the exact moment the controller changes, and which ones only tell you about a file, an account or a server somewhere else.",
  explain:"The most valuable detection is the one that fires at the moment of change. A program download to a controller is that moment, and the strongest version of the rule adds context: the function came from a host that is not in the engineering VLAN. That single condition catches an attacker using stolen credentials from the corporate network, which is how most real pivots look. The daily file scan is too slow and watches the tool, not the target. The weekly failed-login report is unrelated to logic changes and far too slow. Antivirus on the SCADA master will miss ICS protocols entirely and many control nodes cannot run a modern agent. Good OT detections are built on process and protocol behaviour, not on file hashes.",
  focus:"For each OT attack stage, ask which protocol, which source and which function code would reveal it. Build detections around the change itself, not around the tool that makes it."
},

/* ---------- Q18 ---------- */
{
  id:"q18", theme:"threat", type:"mcq", title:"Red team: prove impact without being seen",
  scenario:"Authorised red-team engagement. You have code execution on engineering workstation EWS-03 inside the control room, and the vendor project files are on disk. The goal is to prove that the process can be changed without being detected.",
  task:"Which next step is most likely to stay undetected?",
  options:[
    {t:"Run a full Nmap scan of the OT VLAN to find every reachable controller on site.", ok:false},
    {t:"Use the vendor project already on disk to make a small, reversible setpoint change.", ok:true},
    {t:"Install a new service on the workstation and open a reverse shell to the internet.", ok:false},
    {t:"Brute-force the HMI with a common password list to obtain a second operator account.", ok:false}
  ],
  hint:"The quietest technique uses tools that are already installed, credentials that already exist, and traffic that already looks normal on this network.",
  explain:"This is living off the land. The engineering workstation already has the vendor software, the project files and usually a valid session to the controllers, so a small reversible setpoint change looks almost identical to normal engineering work. The other three options are loud. An Nmap scan of the whole OT VLAN creates unusual packets and can even disturb fragile devices. A new service and a reverse shell to the internet create new outbound traffic that any decent egress rule or OT IDS will flag, and the control network is exactly where egress should be tightly restricted. Password brute-forcing generates authentication failures, which are the easiest thing in the world to alert on. The lesson works in both directions: the red team's quietest path is also the blue team's best detection target.",
  focus:"Learn the living-off-the-land idea and then flip it: for each quiet technique, name the detection that would still catch it."
},

/* ---------- Q19 ---------- */
{
  id:"q19", theme:"def", type:"fill", title:"IEC 62443 design note — insert the missing terms",
  scenario:"You are drafting the network security design note for the Northwind Water plant. The compliance reviewer removed six key terms from your text and left gaps. Put them back so the document matches IEC 62443.",
  task:"Tap a word in the bank, then tap the gap where it belongs. Tap a filled gap to take the word back.",
  text:"The IEC 62443 family asks you to divide the plant into [[0]]. Every asset inside one of them must share the same [[1]] requirement, so a weak device cannot pull the others down. Traffic between two of them may only pass through a [[2]], where you filter and log it. The risk assessment gives you the [[3]] level you want to reach. A test of the real system tells you the [[4]] level you actually have. Products you buy must meet [[5]] requirements before you may use them in that area.",
  words:["zones","security","conduit","target","achieved","component"],
  hint:"Two of the gaps describe levels you measure at different moments: one before you build, one after you test.",
  explain:"IEC 62443 is the main international standard group for industrial automation and control systems security. It uses zones and conduits as its core design idea. A zone groups assets that share the same security requirement, so you never mix a hardened controller with an unprotected laptop. A conduit is the only approved path between two zones, and it is where you place filtering, inspection and logging. The standard also separates three ideas about security levels. The target level (SL-T) is what the risk assessment says you need. The achieved level (SL-A) is what testing shows you really have. Component requirements describe what a product must be able to do before it may be placed inside a zone with that level. The gap between SL-T and SL-A is your remediation list, and it is a much better conversation with management than a raw vulnerability count.",
  focus:"Learn the four IEC 62443 ideas in one sentence each: zones, conduits, security level target versus achieved, and component requirements."
},

/* ---------- Q20 ---------- */
{
  id:"q20", theme:"def", type:"fill", title:"Write the OT security policy — section 4",
  scenario:"Northwind Water must publish a one-page OT security policy that an auditor will accept and an engineer will actually follow. Six words are missing from section 4.",
  task:"Tap a word in the bank, then tap the gap where it belongs.",
  text:"OT SECURITY POLICY — SECTION 4, SEGREGATION AND REMOTE ACCESS\nControl networks are separated from business networks by an industrial [[0]]. The rule set allows only [[1]] traffic in each direction, and every rule is logged. Because controllers cannot be patched quickly, we rely on [[2]] controls such as passive monitoring and strict [[3]] on HMI and engineering workstations. Remote vendor support is allowed only through a [[4]] host inside the DMZ, protected by [[5]] authentication, and every session is recorded and reviewed.",
  words:["firewall","approved","compensating","allowlisting","jump","multi-factor"],
  hint:"One gap is the device that enforces the separation, one is the rule of least privilege for software, and one is the extra proof of identity beyond a password.",
  explain:"A workable OT policy is specific. The firewall is the enforcing device between the two worlds, and the policy states that only approved traffic may pass, in either direction, and that every rule is logged, because an unlogged rule is invisible during an investigation. Compensating controls are the honest answer to a controller that cannot be patched: if you cannot remove the flaw, you reduce exposure and add detection. Allowlisting is stronger than blocking known bad software, because on a control node the list of allowed programs is short and rarely changes. A jump host in the DMZ gives remote vendors a single controlled entry point instead of a direct path to a controller, and multi-factor authentication means a stolen password alone is not enough. The final clause, recording and reviewing every session, is what turns access into accountability.",
  focus:"Learn which control answers which OT problem: firewall for separation, allowlisting for unpatched nodes, jump host and MFA for vendor access, compensating controls when a fix does not exist."
},

/* ---------- Q21 ---------- */
{
  id:"q21", theme:"def", type:"buckets", title:"Defence in depth — place every control on the right layer",
  scenario:"The security improvement plan lists ten controls with no owners, because nobody agreed which layer each one belongs to. Sort them so the plan has one accountable team per layer.",
  task:"Drag each control into the layer where it belongs.",
  buckets:[
    {id:"NET", label:"Network"},
    {id:"END", label:"Endpoint / device"},
    {id:"PHY", label:"Physical"},
    {id:"PPL", label:"People & process"},
    {id:"MON", label:"Monitoring & detection"}
  ],
  items:[
    {id:"i1", t:"Unidirectional gateway (data diode) between the control network and the DMZ.", b:"NET", why:"It shapes how traffic may flow between networks."},
    {id:"i2", t:"Industrial firewall with zones and conduits between Level 3 and Level 2.", b:"NET", why:"Segmentation is a network-layer control."},
    {id:"i3", t:"Application allowlisting on every HMI and engineering workstation.", b:"END", why:"It restricts which programs may run on a specific host."},
    {id:"i4", t:"USB port blocking and signature checks on PLC logic files.", b:"END", why:"Removable media and code signing protect the device itself."},
    {id:"i5", t:"Badge access and locked cabinets for the PLC racks and network switches.", b:"PHY", why:"If you can touch the controller, you own it; this is physical protection."},
    {id:"i6", t:"CCTV and a signed visitor log for the control room.", b:"PHY", why:"Control-room entry is a physical security question."},
    {id:"i7", t:"OT incident response playbook tested twice a year with the plant manager.", b:"PPL", why:"A tested procedure is a process control, not a technology."},
    {id:"i8", t:"Change management that requires an engineering review and a rollback plan.", b:"PPL", why:"It governs how people make changes."},
    {id:"i9", t:"Passive network TAP feeding an OT IDS that understands Modbus and DNP3.", b:"MON", why:"It watches traffic and raises alerts without touching the process."},
    {id:"i10", t:"Daily comparison of running PLC logic against the offline golden copy.", b:"MON", why:"It detects unauthorised change in the controller logic."}
  ],
  hint:"Two of these controls cost nothing to test and involve no product at all. Those belong to the layer that is most often forgotten.",
  explain:"Defence in depth means an attacker must beat several different kinds of control, not the same control several times. Network controls shape the paths. Endpoint controls restrict what may run on a host or a device. Physical controls stop somebody from plugging a laptop into a controller cabinet, which is the fastest way to own a plant. People and process controls are documents and habits, and they are the layer most often skipped, even though a tested playbook and a real change process are what turn a technology stack into a response capability. Monitoring is the layer that tells you when the others have failed: passive taps and golden-copy comparison do not disturb the process, which is important in OT. A common mistake is to buy three network products and call it defence in depth, when the endpoint, physical and process layers are still empty.",
  focus:"Memorise the five layers and be able to name two controls per layer, including at least one that costs nothing but discipline."
},

/* ---------- Q22 ---------- */
{
  id:"q22", theme:"def", type:"mcq", title:"The RTU that cannot be patched this year",
  scenario:"A vendor advisory describes a serious flaw in the RTUs at your remote pump stations. The vendor will not release firmware for fourteen months, and patching requires a six-hour outage that the regulator does not allow during summer demand.",
  task:"What is the BEST action now?",
  options:[
    {t:"Patch the RTUs anyway in the next weekend window and accept the six-hour outage.", ok:false},
    {t:"Restrict the RTUs to an allow-list of sources and monitor them until the fix.", ok:true},
    {t:"Replace every RTU with a newer model before the summer demand period starts.", ok:false},
    {t:"Ask the vendor to sign a document that transfers the operational risk to them.", ok:false}
  ],
  hint:"The flaw cannot be removed inside the required time. Ask which option reduces exposure and gives you warning without stopping the water.",
  explain:"When a fix does not exist inside the allowed window, you use a compensating control. Here that means making the RTUs reachable only by the few hosts that genuinely need them, on the few ports that are genuinely needed, and watching their traffic for anything unusual. That reduces the chance of exploitation and gives you early warning. Patching anyway ignores a constraint the regulator has set, and an unplanned outage in a water network is a safety issue, not only a cost. Replacing the whole fleet is a good long-term plan but not an answer for the next fourteen months. And the contract idea is the classic mistake: risk does not disappear because a document says so, and a supplier cannot carry the operational and safety consequences of your plant.",
  focus:"Learn the compensating control pattern: reduce reachability, add monitoring, document the residual risk, and set a review date. Then practise applying it to an unpatched device."
},

/* ---------- Q23 ---------- */
{
  id:"q23", theme:"def", type:"order", title:"Vulnerability queue — rank by real risk in OT",
  scenario:"You are the OT vulnerability manager at a utility. Five findings are open and the engineering window allows one change this month. Rank them from the most urgent action to the least urgent.",
  task:"Drag the rows, or use the arrows, so that the most urgent item is at the top.",
  items:[
    {id:"v1", t:"CRITICAL flaw with public exploit code on the historian replica that is reachable from the corporate network and from the internet through the vendor VPN."},
    {id:"v2", t:"CRITICAL flaw on the engineering workstation that has vendor remote access, shared local admin accounts and no logging."},
    {id:"v3", t:"HIGH flaw on a PLC whose fix needs a six-hour outage with no compensating control, reachable only from the control VLAN."},
    {id:"v4", t:"MEDIUM flaw on an HMI that is already protected by allowlisting and a strict host firewall, with no known exploit."},
    {id:"v5", t:"LOW flaw on an offline spare laptop stored in the instrument workshop."}
  ],
  hint:"Do not start with the severity score. Start with who can reach the device from outside the plant, and then add the amplifiers you can see in the text.",
  explain:"In OT, CVSS severity alone is a poor ranking tool, because exposure and consequence decide the real risk. The historian replica is first because it is reachable from the corporate network and from the internet, and public exploit code already exists, so the chance of exploitation is high and the path is short. The engineering workstation is second because it has two amplifiers: a vendor remote path and shared admin accounts, and it holds the tooling that can change controller logic. The PLC is third: its potential consequence is serious, but it is only reachable from the control VLAN, and the fix requires an outage that must be planned and negotiated. The HMI is fourth because allowlisting and a host firewall already reduce the chance of success. The offline spare laptop is last because it is not connected and cannot be exploited remotely. Ranking by exposure, then blast radius, then exploitability, then existing controls is a defensible method you can explain to an auditor.",
  focus:"Practise ranking OT vulnerabilities using exposure first, then consequence, then exploitability, then existing controls, and be ready to justify each position out loud."
},

/* ---------- Q24 ---------- */
{
  id:"q24", theme:"ir", type:"terminal", title:"Terminal — pull the Modbus writes out of the capture",
  scenario:"INC-4412 evidence has been copied to this host. The capture was taken from a mirrored port during the incident. You must produce a short list of only the Modbus write operations, meaning function codes 5, 6, 15 and 16.",
  task:"Type one tshark command that reads /cases/INC-4412/ics_capture.pcap and displays only Modbus write operations.",
  host:"ot-jump-01",
  banner:[
    "Northwind Water — OT jump host (authorised use only)",
    "Evidence: /cases/INC-4412/ics_capture.pcap   (18.4 MB, 41,220 packets)",
    "tshark 4.2.0 available. Modbus display filter fields: modbus.func_code, modbus.reference_num, modbus.unit_id",
    "Type a command and press Enter. When you are happy with it, press 'Lock in this command'."
  ],
  reqs:[
    {label:"Calls tshark", re:/\btshark\b/i},
    {label:"Reads the capture file with -r", re:/-r\s+\S+/i},
    {label:"Uses the display filter field modbus.func_code", re:/modbus\.func_code/i},
    {label:"Filters on write function codes 5, 6, 15 or 16", re:/modbus\.func_code[^\n]{0,60}(5|6|15|16)/i}
  ],
  sim:[
    { re:/tshark[^\n]*modbus\.func_code/i, out:[
      "   12  02:14:09.331420  10[.]20[.]5[.]44 -> 10[.]42[.]7[.]31  Modbus/TCP 78  Query: Write Single Coil",
      "   14  02:14:09.556880  10[.]20[.]5[.]44 -> 10[.]42[.]7[.]31  Modbus/TCP 80  Query: Write Single Register",
      "   31  02:14:41.007113  10[.]20[.]5[.]44 -> 10[.]42[.]7[.]31  Modbus/TCP 82  Query: Write Multiple Registers",
      "3 packets shown (0.7% of capture)"], cls:"ok"},
    { re:/\btshark\b/i, out:[
      "   1  02:13:58.000112  10[.]42[.]7[.]17 -> 10[.]42[.]7[.]12  Modbus/TCP 66  Query: Read Holding Registers",
      "   2  02:13:58.121004  10[.]42[.]7[.]12 -> 10[.]42[.]7[.]17  Modbus/TCP 66  Response: Read Holding Registers",
      "   3  02:14:01.440991  10[.]42[.]7[.]31 -> 10[.]42[.]7[.]02  Modbus/TCP 74  Query: Read Coils",
      "   4  02:14:06.118002  10[.]20[.]5[.]44 -> 10[.]42[.]7[.]31  Modbus/TCP 78  Query: Write Single Coil",
      "   5  02:14:07.998441  10[.]42[.]7[.]02 -> 10[.]42[.]7[.]31  Modbus/TCP 74  Query: Read Holding Registers",
      "   6  02:14:09.331420  10[.]20[.]5[.]44 -> 10[.]42[.]7[.]31  Modbus/TCP 78  Query: Write Single Coil",
      "   7  02:14:09.556880  10[.]20[.]5[.]44 -> 10[.]42[.]7[.]31  Modbus/TCP 80  Query: Write Single Register",
      " 41220 packets shown (no display filter applied)"], cls:"warn"},
    { re:/^\s*(ls|dir)\b/, out:["/cases/INC-4412/  ics_capture.pcap  iocs.txt  timeline.md  plc31_logic.bin  golden/plc31_logic.bin"], cls:"dim"},
    { re:/^\s*(help|man)\b/, out:["Try tshark, capinfos, or read the timeline file in the case folder."], cls:"dim"}
  ],
  hint:"Three pieces must appear: the tool, the file to read, and a display filter that mentions the Modbus function-code field together with the write codes.",
  explain:"The command is: tshark -r /cases/INC-4412/ics_capture.pcap -Y \"modbus.func_code == 5 || modbus.func_code == 6 || modbus.func_code == 15 || modbus.func_code == 16\". In tshark, -r reads a saved capture instead of a live interface, and -Y applies a display filter, which selects packets after they are read. The interesting field here is modbus.func_code, because it tells you the intent of the message rather than just the port. Function codes 5 and 6 write a single coil or register, and 15 and 16 write several at once. Reducing 41,220 packets to three is the entire point of the job: an analyst who reads everything reads nothing. Note the timing in the filtered output. The write at 02:14:41 is 31 seconds after the first one, which is exactly the kind of detail a timeline needs.",
  focus:"Learn tshark basics: -r to read a file, -Y for a display filter, and the Modbus fields func_code and reference_num. Then memorise which function codes write."
