];
var EXERCISES=[
{id:'H1',type:'log',theme:'ap',title:'Sticky clients and slow handoffs',
 kw:['roaming','802.11r','802.11k','RSSI / dBm'],
 scenario:'Voice users on WLAN 3 (CORP) complain that calls crackle for two full seconds every time they walk between wings. You pull the controller log around 10:14–10:19.',
 lines:[
  {t:'10:14:02',lv:'warn',m:'STA 44:11:9c:02:7a:11 roam AP2->AP5 reason=low-RSSI rssi=-78 dBm roam-latency=812 ms auth=WPA2 full-EAP'},
  {t:'10:15:40',lv:'inf',m:'WLAN 3: 802.11r fast transition DISABLED (feature off)'},
  {t:'10:16:11',lv:'warn',m:'AP5 client count 47 (cell heavily loaded), airtime contention high'},
  {t:'10:17:03',lv:'inf',m:'STA 60:33:4b:1e:5c:88 roam AP5->AP2 reason=load-balance'},
  {t:'10:18:59',lv:'inf',m:'WLAN 3: 802.11k neighbor report DISABLED; 802.11v BSS transition DISABLED'},
  {t:'10:19:21',lv:'ok',m:'event forwarded to NMS collector 10[.]44[.]7[.]2'}
 ],

 hint:'Three facts are printed on the lines; two are inventions.',
 expl:'The log shows <code>auth=WPA2 full-EAP</code> with 812 ms roam latency and 802.11r disabled — every roam repeats the whole EAP exchange, which is exactly what 802.11r exists to avoid. The roam reason is <code>low-RSSI</code> at -78 dBm: by then the client is deep into the old cell. AP5 holds 47 clients, so load-balancing pushes others away. Nothing in the log mentions radar (DFS) or WPA3 transition mode — those options are inventions. <b>Focus on:</b> pair each symptom with the feature that removes it: 11r = key handoff speed, 11k/11v = timely, well-aimed roam decisions.'},
{id:'H2',type:'branch',theme:'freq',title:'DFS storm at the airport office',
 kw:['DFS (Dynamic Frequency Selection)','UNII bands','RRM','6 GHz band (Wi-Fi 6E)'],

 question:'Choose the correct option at every step.',

  {q:'Airport IT needs the WLAN stable today. Immediate mitigation?',opts:['Move critical WLANs to non-DFS UNII-1/3 space today','Disable PMF requirement to speed up client association','Bond everything to 160 MHz so channel switches finish faster'],c:0},
  {q:'The regulator later confirms a jammer was spiking radar-like energy. Long-term fix?',opts:['Add non-DFS capacity and shift modern clients to 6 GHz','Force every AP in the building to static channel 165','Turn off RRM channel assignment globally and leave it off'],c:0}
 ],
 hint:'Confirm, suspect, protect, redesign.',
 expl:'DFS incidents are a chain of judgment: (1) first decide if the radar is real — the duty cycle and log pattern tell you; (2) repeated detections with no actual radar suggest a <b>false detector trigger</b> (interference that mimics radar pulses); (3) the immediate mitigation is to keep critical SSIDs on <b>non-DFS</b> UNII-1/UNII-3 channels so radar events cannot touch them; (4) the durable fix adds non-DFS capacity and moves modern clients to <b>6 GHz</b>, which has no DFS. Disabling RRM or forcing static channels just freezes a bad plan in place.'},

 ],
 hint:'Same channel shares politely; overlapping channels corrupt; machines and walls are not Wi-Fi.',
 expl:'<b>Co-channel</b> = same channel: devices hear each other and take turns (airtime contention — slow but clean). <b>Adjacent-channel</b> = overlapping channels (1/2, 3/4): neither Listen-Before-Talk rhythm lines up, so frames arrive corrupted and retransmissions explode — usually worse than co-channel. <b>Non-Wi-Fi</b> = anything else radiating in-band: microwave ovens (pulsing, wide, near ch 9), Bluetooth, Zigbee. <b>Attenuation</b> = physics removing signal: concrete, metal, distance — a spectrum analyzer shows clean air where your clients still get nothing. <b>Focus on:</b> share vs corrupt vs foreign energy vs absorbed energy.'},
{id:'H4',type:'spot',theme:'sec',title:'Find the TWO lines that must change',
 kw:['WPA2 / AES-CCMP','channels 1 / 6 / 11','channel bonding (40/80/160 MHz)','PMF (802.11w)','802.1X'],
 scenario:'This corporate WLAN template is about to ship to 40 sites. Policy: staff WLANs authenticate with 802.1X (no shared passphrases anywhere), 2.4 GHz must stay clean (no overlapping channels, no bonding), and PMF may remain optional on this template. The reviewer already checked VLANs, RADIUS reachability and channel 100 legality.',
 cfg:['wlan CORP',' ssid CORP',' vlan 20',' security wpa2-psk',' pmf optional',' radius server 10[.]40[.]2[.]17',' band 2.4 channel 3 width 40',' band 5 channel 100 width 80',' wps disabled',' wmm enabled'],
 question:'Click the TWO lines that violate policy and must change before rollout.',
 need:[3,6],
 hint:'One line is about who may log in, one is about spectrum hygiene in 2.4 GHz.',
 expl:'Line 4 (<code>security wpa2-psk</code>) breaks the 802.1X policy — corporate staff WLANs authenticate against RADIUS per user, not with one shared passphrase that leaves with every leaver. Line 7 (<code>band 2.4 channel 3 width 40</code>) breaks two rules at once: channel 3 <b>overlaps</b> 1 and 6 in 2.4 GHz, and a 40 MHz channel has no place in a band with only three 20 MHz slots. PMF optional is allowed on this template (WPA3 will tighten that later), and channel 100 with 80 MHz is DFS space — legal while radar detection works. <b>Focus on:</b> PSK-on-corporate and 2.4 GHz overlap/bonding are template killers.'},
{id:'H5',type:'term',theme:'auth',title:'Pipeline the NAC failures',
 kw:['802.1X','EAP-TLS','RADIUS','supplicant / authenticator'],
 scenario:'You are on the NAC jump host. The file <code>nac.log</code> holds last night\'s authenticator-to-RADIUS results for the 802.1X WLAN; failing supplicants are tagged <code>EAP_FAILURE</code>, successful ones <code>EAP_SUCCESS</code>. File shape (15 lines total, five different failing MACs):<br><pre>2026-03-04T09:12:01 EAP_FAILURE mac=44:11:9c:02:7a:11 method=EAP-TLS reason=cert-expired\n2026-03-04T09:12:44 EAP_SUCCESS mac=60:33:4b:1e:5c:88 method=EAP-TLS\n2026-03-04T09:13:02 EAP_FAILURE mac=44:11:9c:02:7a:11 method=EAP-TLS reason=cert-expired</pre>',
 intro:'nac@jumphost:~$  file: nac.log  (15 lines)',
 question:'Produce <b>one line per failing MAC with a count of its failures, most failures first</b>. Choose your own tools — nothing is named for you, and no example command is given. Type the pipeline, press Run, then Check.',
 accepted:[
  /\bgrep\b[\s\S]*eap[-_]fail[\s\S]*(\|\s*awk\b[^|]*print\s+\$3\b|\|\s*grep\s+-o[^|]*mac=)[\s\S]*\|\s*sort\b[\s\S]*uniq\s+-c\b[\s\S]*sort\s+-(nr|rn)\b/i,
  /\bawk\b[^|]*eap[-_]fail[\s\S]*print\s+\$3\b[\s\S]*\|\s*sort\b[\s\S]*uniq\s+-c\b[\s\S]*sort\s+-(nr|rn)\b/i,
  /\bsed\b[^|]*eap[-_]fail[\s\S]*mac=[\s\S]*\|\s*sort\b[\s\S]*uniq\s+-c\b[\s\S]*sort\s+-(nr|rn)\b/i
 ],
 out:'   4 mac=44:11:9c:02:7a:11\n   3 mac=60:33:4b:1e:5c:88\n   2 mac=88:02:11:d3:9a:04\n   2 mac=aa:bb:cc:00:11:22\n   1 mac=cd:ef:12:34:56:78',
 err:'pipeline rejected — I need failures filtered, the MAC field isolated, then counted per MAC (uniq -c), then ordered by count descending (sort -nr)',
 hint:'You must count, not just find: one classic tool prints counts next to values.',
 example:"grep EAP_FAILURE nac.log | awk '{print $3}' | sort | uniq -c | sort -nr",
 expl:'The classic shape is <code>grep EAP_FAILURE nac.log</code> (keep only failures), extract the MAC field (<code>grep -o</code> or <code>awk \'{print $3}\'</code>), then <code>sort | uniq -c | sort -nr</code>: sort groups equal lines, <code>uniq -c</code> counts each group, and <code>sort -nr</code> orders by count descending. Success lines must be filtered out or their MACs pollute the tally. <b>Focus on:</b> filter → isolate the field → count → order; the same pipeline pattern answers half of all log triage questions.'},
{id:'H6',type:'match',theme:'auth',title:'Read the failure, name the method',
 kw:['EAP-TLS','PEAP','EAP-TTLS','EAP-FAST','certificates'],
 scenario:'The service desk pasted four cryptic 802.1X log excerpts into one ticket. Each one points at a different EAP method with its own characteristic failure. Map them so each desk queue gets the right fix.',
 question:'Match each log excerpt to the EAP method it identifies.',
 pairs:[
  {l:'"TLS alert unknown CA" raised by the client',r:'EAP-TLS: client lacks the RADIUS server\'s CA in its trust store'},
  {l:'"MSCHAPv2 rejected" after the TLS tunnel is up',r:'PEAP: wrong username or password inside the tunnel'},
  {l:'"PAC not provisioned / PAC expired"',r:'EAP-FAST: shared-secret provisioning problem'},
  {l:'"Tunnel established; inner method rejected by server"',r:'EAP-TTLS: server does not support the chosen inner method'}
 ],
 hint:'Certificates, passwords, PACs, tunnels — one excerpt per keyword.',
 expl:'<b>EAP-TLS</b> fails most often on trust: the client does not hold the CA that signed the server certificate (mutual certificates — both ends). <b>PEAP</b> builds the TLS tunnel first; a rejection after that is almost always the inner MSCHAPv2 password. <b>EAP-FAST</b> replaces certificates with PACs, so its failures talk about provisioning or expired PACs. <b>EAP-TTLS</b> tolerates many inner methods — its failure appears when the server does not accept the one the client picked. <b>Focus on:</b> the exact stage of failure names the method: before tunnel (certs), inside tunnel (password), PAC stage (FAST), inner-method negotiation (TTLS).'},
{id:'H7',type:'qcm',theme:'freq',title:'6 GHz rollout — pick the compliant plan',
 kw:['6 GHz band (Wi-Fi 6E)','AFC (Automated Frequency Coordination)','Wi-Fi 4/5/6/6E/7'],
 sim:true,
 scenario:'Your city permits 6 GHz Standard Power operation. The band map below shows the 6 GHz block; fixed microwave links are registered in the AFC database. The council wants the biggest, legal deployment.',
 svg:'<svg viewBox="0 0 560 170" role="img" aria-label="6 GHz band split into Standard Power, Low Power Indoor and very low power portable"><rect x="20" y="40" width="260" height="60" fill="#0c2b22" stroke="#1f7a4d"/><text x="34" y="76" class="svglbl">Standard Power (AFC required)</text><rect x="290" y="40" width="160" height="60" fill="#33270d" stroke="#8a6d1f"/><text x="300" y="76" class="svglbl">Low Power Indoor</text><rect x="460" y="40" width="80" height="60" fill="#331417" stroke="#8a3a3a"/><text x="466" y="76" class="svglbl">Portable</text><text x="20" y="130" class="svglbl">5925 MHz</text><text x="520" y="130" class="svglbl">7125 MHz</text></svg>',
 question:'Which plan is correct for Standard Power APs?',
 opts:['Each AP must query AFC and use only channels cleared near registered links','Standard Power APs must run the same DFS radar checks as UNII-2E channels','Only Low Power Indoor APs are allowed outdoors, and only without AFC','Wi-Fi 5 (802.11ac) clients may join 6 GHz once transition mode is enabled'],
 c:0,
 hint:'AFC is a permission slip per channel, per location.',
 expl:'6 GHz Standard Power depends on <b>AFC</b>: the AP reports its location and receives a per-channel permission list that protects registered fixed links (usually microwave backhaul). 6 GHz has <b>no DFS</b> — radar rules are a 5 GHz concept — but outdoor/high-power rules differ: Standard Power is outdoor-capable with AFC, while Low Power Indoor is indoor-only, and there is a lower tier for portable devices. Only 802.11ax/be (Wi-Fi 6/6E/7) clients may operate in 6 GHz; 802.11ac devices are not permitted there at all. <b>Focus on:</b> AFC = per-location channel permission, not a radar dance.'},
{id:'H8',type:'multi',theme:'sec',title:'WPA3 transition mode — separate fact from comfort',
 kw:['transition mode','WPA3 / SAE','KRACK','PMF (802.11w)'],
 scenario:'A vendor proposed enabling WPA3 transition mode "so WPA3 protects everyone immediately". The security architect asked you to fact-check the proposal before the CAB meeting.',
 question:'Select ALL statements that are TRUE about WPA3 transition mode.',
 opts:['WPA2-only clients can still connect while transition mode is on','Attackers can push vulnerable clients down to WPA2','WPA2-capable clients in transition mode may still skip PMF','WPA3-only mode removes the downgrade path entirely','Transition mode delivers full SAE protection to every client','Transition mode re-enables TKIP for legacy laptops','Even patched, WPA2 clients in transition stay the weakest link'],
 ans:[0,1,2,3,6],
 hint:'Transition is a compatibility compromise, not a free upgrade.',
 expl:'Transition mode advertises WPA2 and WPA3 side by side: WPA2-only clients still join (that is its purpose), but any client that accepts WPA2 can be targeted by downgrade tricks, and WPA2 clients may negotiate PMF as merely optional — the management-frame attacks PMF blocks come back. It certainly does not grant SAE to WPA2 clients, and TKIP stays out (it is forbidden in WPA3 deployments). Moving to WPA3-only removes the downgrade surface; until then, WPA2 clients — however patched after KRACK — remain the softest target on the air. <b>Focus on:</b> transition = compatibility today, compromise today.'},
{id:'H9',type:'order',theme:'ap',title:'Rank the hospital RF risks',
 kw:['microwave / Bluetooth / Zigbee interference','DFS (Dynamic Frequency Selection)','adjacent-channel interference','site survey','heat map'],
 scenario:'Harborview General booked you for a risk review. Five findings from the last audit need a fix-first order. House rule: clinical safety outranks everything, then shared infrastructure, then department throughput, then security exposure, then convenience.',
 question:'Rank the five findings from most dangerous to least dangerous — most dangerous on top.',
 lab:'Rank the risks — most dangerous on top',
 items:[
  {t:'Telemetry monitors (2.4 GHz) glitch when infusion-pump carts cross the ward'},
  {t:'Warehouse APs flap between DFS channels all night; inventory scanners lose link for minutes'},
  {t:'Radiology APs sit on channels 3 and 4; DICOM uploads crawl each morning'},
  {t:'Guest SSID reaches the public car park and advertises "HARBORVIEW-FREE" to passers-by'},
  {t:'The new east wing was built with no survey; the heat map shows dead zones by the lifts'}
 ],
 hint:'Bedside first, then building services, then a department, then reputation, then design debt.',
 expl:'(1) Telemetry is <b>clinical</b> — non-Wi-Fi 2.4 GHz emitters on the carts can corrupt a patient-data link; nothing outranks that. (2) DFS flapping on the <b>shared</b> warehouse WLAN breaks a building service for minutes at a time. (3) Channels 3/4 <b>overlap</b> and throttle one department. (4) The overshooting guest SSID is a <b>security/reputation</b> exposure — real, but it does not stop care. (5) The unsurveyed wing is design debt: document it with a proper survey and heat map. <b>Focus on:</b> rank by impact on people first, blast radius second, money and reputation after.'},
{id:'H10',type:'fill',theme:'sec',title:'Complete the wireless policy',
 kw:['WPA3 / SAE','EAP-TLS','WPA / TKIP','WPS','PMF (802.11w)'],
 scenario:'Legal sent back the wireless policy with holes. Every blank must hold exactly the right term — auditors will check.',
 question:'Complete the policy — one term per blank.',
 text:'All staff WLANs run WPA3-{{0}} with 802.1X against RADIUS; {{1}} certificates are issued to every managed device. WPA2 fallback is {{2}} on the controller because it invites downgrade attacks. Management frames are protected with {{3}} (802.11w). WPS is {{4}} on every AP, without exception.',
 ans:['Enterprise','EAP-TLS','disabled','PMF','banned'],
 bank:['Personal','TKIP','enabled','WEP','optional'],
 hint:'One mode name, one certificate method, three policy stances.',
 expl:'WPA3-<b>Enterprise</b> pairs with 802.1X/RADIUS and per-device <b>EAP-TLS</b> certificates (nothing to phish). Fallback to WPA2 must be <b>disabled</b> or attackers will simply ask clients to downgrade. <b>PMF</b> (802.11w) protects management frames from spoofed deauthentications. WPS is <b>banned</b> — its PIN design is brute-forceable. The distractors are the enemies of this policy: Personal/PSK belongs at home, TKIP and WEP are dead ciphers, and "enabled/optional" are the opposite of the policy\'s intent.'},
{id:'H11',type:'qcm',theme:'ap',title:'FT enabled, yet every roam re-authenticates',
 kw:['802.11r','RADIUS','PMF (802.11w)','WPA2 / AES-CCMP','roaming'],
 scenario:'WLAN 3 shows "802.11r enabled, over-the-air" on the controller, but captures show every handset running a full EAP exchange with RADIUS at each roam, and the controller log prints <code>FT not negotiated</code>. Handsets are a 2018 fleet; the WLAN is WPA2-Enterprise with PMF required and an old TKIP-era QoS profile was recently removed.',
 question:'What is the most likely explanation?',
 opts:['The handsets never negotiated FT — an AP flag cannot force clients to use it','802.11r only works on the 6 GHz band, so it cannot engage on this 5 GHz WLAN','802.11r is designed to replace RADIUS, so the server refused to take part','DFS quiet periods kept blocking every FT key exchange message'],
 c:0,
 sim:false,
 hint:'A feature being switched on is not the same as it being used — check the negotiation, not just the flag.',
 expl:'802.11r (Fast BSS Transition) must be <b>negotiated during association</b>: both the network advertises it and the client must ask for it and support it with the WLAN\'s security suite. Old handsets with stale firmware frequently skip FT (some never implemented it with PMF required or with certain EAP types). The controller correctly falls back to full EAP re-authentication — hence two seconds of crackle. 11r works on 2.4/5 GHz (and 6 GHz too); it does not replace RADIUS; and DFS has nothing to do with key negotiation. <b>Focus on:</b> verify client capability and security pairing first; "enabled" on the AP side is only half of a handshake.'},
{id:'H12',type:'order',theme:'sec',title:'Order the evil-twin response on the lobby SSID',
 kw:['BSSID','SSID','WPA2 / AES-CCMP','PMF (802.11w)'],
 scenario:'Users report the lobby "CORP-GUEST" asking for credentials twice. Spectrum and controller data suggest a second radio is broadcasting the same SSID from a backpack. Order your response the way an incident responder would.',
 question:'Put the five response steps in the correct order — first action on top.',
 lab:'Put the response steps in order — first action on top',
 items:[
  {t:'Confirm and locate the rogue BSSID (controller rogue list + spectrum/physical hunt)'},
  {t:'Contain: deauthenticate clients off the evil twin and warn staff to stop joining it'},
  {t:'Remove the device physically and preserve it as evidence'},
  {t:'Force a credential rotation for anyone who typed credentials into the fake portal'},
  {t:'Close the gap: PMF on corporate SSIDs, user guidance, and repeat rogue-AP sweeps'}
 ],
 hint:'Find it, empty it, remove it, rotate what was typed, then make it harder next time.',
 expl:'Order matters. You cannot contain what you have not identified — so first pin the <b>rogue BSSID</b> (each AP radio has its own MAC) and its physical location. Then <b>contain</b>: push clients off the twin before more credentials leak. Physically <b>remove</b> the device and keep it as evidence. Everyone who typed into the fake portal must <b>rotate credentials</b> — assume capture. Finally, reduce future exposure: PMF (802.11w) stops spoofed management frames, and awareness plus regular rogue sweeps catch repeats. <b>Focus on:</b> identify → contain → eradicate → rotate → harden.'},
{id:'H13',type:'dd',theme:'ap',title:'Deployment models — sort the facts',
 kw:['autonomous (fat) AP','lightweight (thin) AP','WLC (wireless LAN controller)','CAPWAP','cloud-managed AP','mesh backhaul'],
 scenario:'Four campuses, four architectures, one audit. Each fact belongs to exactly one deployment model.',
 question:'Drag each fact to its deployment model.',
 buckets:[{id:'auto',label:'Autonomous'},{id:'wlc',label:'Controller-based'},{id:'mesh',label:'Mesh'},{id:'cloud',label:'Cloud-managed'}],
 items:[
  {t:'Each fat AP carries its own web UI and config file',b:'auto'},
  {t:'Thin APs boot with no local config and tunnel to the WLC over CAPWAP',b:'wlc'},
  {t:'MAPs backhaul to a wired RAP across the courtyard',b:'mesh'},
  {t:'APs pull policy from the vendor dashboard over the internet; license per AP',b:'cloud'},
  {t:'Great for a single small office, painful for 200 APs',b:'auto'},
  {t:'RRM and roaming decisions are made centrally for the whole fleet',b:'wlc'},
  {t:'AP-to-AP links self-form and self-heal with no cable per AP',b:'mesh'},
  {t:'Controller upgrade lifts features for every joined AP at once',b:'wlc'}
 ],
 hint:'Where does the brain live? In the AP, in the closet, over the air, or in the cloud.',
 expl:'<b>Autonomous</b> APs are self-contained — one box, one config, fine small, painful at scale. <b>Controller-based</b> lightweight APs are stateless: CAPWAP tunnels to a WLC that owns config, RRM and roaming. <b>Mesh</b> links APs wirelessly (MAPs to a wired RAP) where cables cannot reach, self-forming and self-healing. <b>Cloud-managed</b> moves the brain to a vendor dashboard: per-AP licensing, zero local controller, internet dependency. <b>Focus on:</b> audit question number one — "who pushes the config, and where does that brain live?"'},
{id:'H14',type:'log',theme:'ap',title:'The phone that fails FT on roam',
 kw:['802.11r','802.11k','PMF (802.11w)','WEP','roaming'],
 scenario:'One handset model fails roaming on WLAN 3 since the security profile tightened. Everyone else roams fine. Logs around 09:03 below.',
 lines:[
  {t:'09:01:22',lv:'inf',m:'WLAN 3: FT enabled (over-the-air), PMF required, WPA2-Enterprise'},
  {t:'09:02:15',lv:'inf',m:'STA 60:33:4b:1e:5c:88 assoc AP7 rssi=-71 dBm'},
  {t:'09:03:44',lv:'err',m:'STA 60:33:4b:1e:5c:88 FT auth failed reason=6 (class-2 frame from non-authenticated) during transition'},
  {t:'09:03:45',lv:'warn',m:'STA 60:33:4b:1e:5c:88 full EAP fallback to RADIUS, roam-latency=880 ms'},
  {t:'09:05:02',lv:'inf',m:'AP7: 802.11k neighbor report sent to STA 60:33:4b:1e:5c:88'}
 ],
 question:'The handset mixes PMF-required with an old FT implementation. What is the pragmatic fix?',
 inner:{type:'qcm',opts:['Set PMF to optional — or update the handsets — so FT works again','Disable 802.11k neighbour reports so clients stop trusting the network\'s advice','Switch the WLAN down to WEP until the handsets are replaced','Raise every AP transmit power level to mask the transition problem'],c:0},
 hint:'One old client is failing on a capability clash — meet it halfway or modernise it.',
 expl:'FT and PMF must both be supported by the client, and 2018-era firmware often breaks when PMF flips to <b>required</b>. Making PMF optional keeps WPA3-ready clients protected while old ones keep working — or (better) update/replace the handsets. 802.11k reports are helping, not hurting; WEP is not a downgrade path, it is a surrender; and more transmit power hides nothing about a key-negotiation clash. <b>Focus on:</b> client capability matrices when PMF and FT interact; change one variable and re-test the fleet.'},
{id:'H15',type:'branch',theme:'guest',title:'A guest printed to a staff printer',
 kw:['guest VLAN','SSID-to-VLAN mapping','client isolation'],
 scenario:'An auditor found that a visitor on "Guest-Net" printed a test page to a staff printer. Nothing malicious — but the finding is real. Work the path.',
 question:'Choose the correct option at every step.',
 steps:[
  {q:'Which fact do you establish first?',opts:['Which VLAN Guest-Net maps to and which rules allow what','Which channel the guest APs broadcast on today','How long the guest DHCP lease time runs per client'],c:0},
  {q:'Guest-Net maps to VLAN 60. The printer lives on VLAN 20. The firewall shows an allow rule 60→20 on port 9100, left from a finished project. First change?',opts:['Delete or narrow the stale 60→20 firewall rule','Move the printer into the guest VLAN 60 instead','Hide the guest SSID from beacon frames going forward'],c:0},
  {q:'Now guests cannot reach anything internal. What stops guests attacking each other on the guest subnet?',opts:['Client isolation on the guest WLAN','A shorter DHCP lease for the guest subnet','WPA2-Personal for every guest device'],c:0},
  {q:'Finally, what stops one guest saturating the internet link?',opts:['A rate limit (and QoS class) on the guest WLAN','Disabling the 2.4 GHz guest radio at the site','A captive portal with a longer terms-of-use page'],c:0}
 ],
 hint:'Map, seal, isolate, throttle.',
 expl:'The audit finding is a <b>routing/SSID-to-VLAN mapping</b> story: guests sat in VLAN 60, and a stale firewall rule let 60 reach VLAN 20\'s printer port. The fix is inter-VLAN policy — guest VLANs speak only to the internet — not moving printers or hiding names. With routing sealed, <b>client isolation</b> keeps guests from scanning each other on the shared guest subnet, and a <b>rate limit</b> plus QoS keeps one guest from starving the link. Each control does one job; stack them in that order.'},
{id:'H16',type:'multi',theme:'freq',title:'Why 6 GHz — separate physics from marketing',
 kw:['6 GHz band (Wi-Fi 6E)','DFS (Dynamic Frequency Selection)','Wi-Fi 4/5/6/6E/7','channel bonding (40/80/160 MHz)'],
 scenario:'The CIO asks why the 6 GHz refresh is worth it. You must defend only claims that survive scrutiny.',
 question:'Select ALL claims that are TRUE about 6 GHz versus 5 GHz.',
 opts:['No legacy 802.11n/ac devices waste airtime — only 11ax/be clients may join','Several wide 160 MHz channels fit without touching DFS radar space','The signal reaches farther through walls than 2.4 GHz does','Standard Power APs may operate outdoors where AFC clears them','AFC permission is never needed anywhere in the whole band','2.4 GHz-only devices can be band-steered upward into 6 GHz'],
 ans:[0,1,3],
 hint:'Clean air and wide lanes — but physics still bills you for every wall.',
 expl:'6 GHz wins on cleanliness and width: legacy n/ac clients are simply not permitted, so no slow device drags airtime (protection for legacy rates), and multiple 160 MHz channels exist without any DFS radar constraint. What it cannot do is repeal physics: higher frequency attenuates more per wall, so 6 GHz covers less than 5 GHz and far less than 2.4 GHz. AFC is genuinely required for Standard Power operation. And steering sends dual-band clients <b>to</b> 6 GHz only if the client supports it — a 2.4 GHz-only device never becomes a 6 GHz client. <b>Focus on:</b> band = rules + physics, not a speed dial.'},
{id:'H17',type:'spot',theme:'ant',title:'Point-to-point bridge review — click BOTH mistakes',
 kw:['parabolic dish','sector antenna','EIRP','dBi gain','RSSI / dBm','SNR','point-to-point bridge','RF attenuation'],
 scenario:'An integrator drafted this plan for a 2.1 km rooftop link from HQ to Warehouse B. Regulatory check passed; your job is the two engineering mistakes.',
 cfg:['1. Link: HQ roof to Warehouse B, 2.1 km, clear horizon','2. Radios: two 5 GHz bridges, UNII-3 (channels 149+)','3. Antennas: parabolic dish, 23 dBi, both ends (sector antennas rejected — wasted gain)','4. Mount A: HQ dish bolted 30 cm behind the rooftop HVAC unit for wind shadow','5. Power: TX tuned so EIRP stays within local UNII-3 rules','6. Alignment: aim dishes, then fine-tune on RSSI and SNR','7. Path check: an HVAC duct and a flagpole cross the middle of the first Fresnel zone','8. Firmware: both bridges on the same current release'],
 question:'Click BOTH lines that will hurt the link.',
 need:[3,6],
 hint:'One hides the antenna behind metal; one blocks the invisible ellipse.',
 expl:'Line 4 mounts the dish <b>behind the HVAC unit</b> — metal at that distance acts like a wall: reflection, absorption and lobing wreck the pattern (a wind shadow is not an RF shadow; use a standoff mount). Line 7 is a <b>Fresnel zone</b> violation: the football-shaped ellipse around the line of sight must stay mostly clear — obstruction there costs far more signal than the distance alone suggests (rule of thumb: keep ~60% of the first zone clear). Lines 2, 3, 5, 6, 8 are correct practice: UNII-3 for outdoor PtP, high-gain dishes (23 dBi each), legal EIRP, alignment on measured RSSI/SNR, matching firmware. <b>Focus on:</b> metal near antennas and obstructions in the Fresnel zone are the classic PtP killers.'},
{id:'H18',type:'qcm',theme:'ant',title:'Great signal, terrible speed — interpret the numbers',
 kw:['RSSI / dBm','SNR','Yagi','spectrum analyzer'],
 scenario:'Warehouse AP-9 reports <b>RSSI -55 dBm</b> on most clients — a strong reading — yet speed tests crawl. The same capture shows <b>SNR 8 dB</b> on the affected channel, while neighbouring channels sit at SNR 25–30 dB.',
 question:'What is the correct interpretation and next step?',
 opts:['The signal is fine; the noise floor is high — hunt the interferer','The signal is far too weak — bolt a high-gain Yagi onto AP-9','RSSI and SNR are unrelated; raise TX power and ignore SNR','-55 dBm is dangerously hot — lower TX power to repair the SNR'],
 c:0,
 sim:false,
 hint:'Strength alone lies; the gap between signal and noise tells the truth.',
 expl:'<b>RSSI</b> only says how loud the AP is at the client (-55 dBm is comfortably strong). <b>SNR</b> says how far that signal stands above everything else transmitting on the channel — and 8 dB is a crowd of noise where you need 25+ for clean high-rate modulation. So the fix is not more antenna: a Yagi will boost signal and interferer alike, and raising TX power changes nothing about the noise floor. Put a spectrum analyzer on that channel and hunt the source (or re-channel). <b>Focus on:</b> strong RSSI + low SNR = interference, not coverage.'},
{id:'H19',type:'match',theme:'ssid',title:'Name that identifier or measurement',
 kw:['SSID','BSSID','ESS / ESSID','ad hoc mode','infrastructure mode','RSSI / dBm','SNR'],
 scenario:'A capture tool prints a table of wireless terms; the auditor wants each one defined without ambiguity. Match term to meaning.',
 question:'Match each term to its exact meaning.',
 pairs:[
  {l:'Two laptops share files with no AP at all',r:'Ad hoc (IBSS) mode'},
  {l:'Clients relay through APs to the wired network',r:'Infrastructure mode'},
  {l:'The network name carried in beacons',r:'SSID'},
  {l:'The MAC address of one AP radio',r:'BSSID'},
  {l:'Many BSSIDs sharing one name across a site',r:'ESS (one ESSID)'},
  {l:'How loud the received signal is, in dBm',r:'RSSI'},
  {l:'How far that signal stands above the noise, in dB',r:'SNR'}
 ],
 hint:'Name, address, family — then two different measurements.',
 expl:'<b>Ad hoc (IBSS)</b> is client-to-client with no AP; <b>infrastructure</b> is the normal AP-relayed mode. The <b>SSID</b> is the human-readable network name; the <b>BSSID</b> is the per-radio MAC (one AP, one BSSID per band); an <b>ESS</b> is the set of BSSIDs that share one ESSID so clients can roam. <b>RSSI</b> (dBm) measures raw received power — closer to zero is stronger. <b>SNR</b> (dB) measures that power against the noise floor — and SNR, not RSSI, decides how fast a link can talk. <b>Focus on:</b> RSSI = loudness, SNR = clarity.'},
{id:'H20',type:'row',theme:'guest',title:'Audit the SSID table',
 kw:['SSID-to-VLAN mapping','guest VLAN','802.1X','hidden SSID'],
 scenario:'The controller\'s WLAN table has three findings. For each row pick the fix that addresses the actual problem.',
 style:'table',
 question:'Choose the correct fix for each row.',
 rows:[
  {q:'Row 1 — "Guest-Net" maps to <b>VLAN 20</b> (the staff VLAN). Fix?',opts:['Re-map Guest-Net to its own guest VLAN, internet-only rules','Hide the guest SSID from beacons and rotate the PSK','Bond the guest APs together on a wide 80 MHz channel','Enable WPS on the guest APs for visitor convenience'],c:0},
  {q:'Row 2 — "IoT-Devices" (cameras, sensors) shares the staff VLAN 20. Fix?',opts:['Give IoT its own VLAN with deny-by-default rules','Merge the IoT devices into the guest WLAN for now','Disable encryption so the devices join faster','Move the IoT APs over to channel 14 for room'],c:0},
  {q:'Row 3 — "VOICE" (300 handsets) uses one shared WPA2-Personal key. Fix?',opts:['Move to 802.1X with per-device credentials','Print the shared key on every handset box','Switch the handsets to WEP for lower latency','Disable PMF so the old handsets can roam'],c:0}
 ],
 hint:'One wrong mapping, one wrong neighbourhood, one wrong trust model.',
 expl:'Row 1: a guest WLAN on the staff VLAN defeats the whole point of guest segmentation — guests need their <b>own VLAN</b> plus internet-only routing. Row 2: IoT devices belong in a <b>separate, locked-down VLAN</b>; co-habiting with staff means one breached camera is a beachhead on the LAN. Row 3: a shared PSK on 300 handsets cannot be revoked per device — <b>802.1X</b> with per-device credentials gives revocation, accounting and (via RADIUS attributes) dynamic VLAN placement. Hiding SSIDs, WEP and WPS fix none of this. <b>Focus on:</b> segmentation follows the trust boundary.'},
{id:'H21',type:'order',theme:'sec',title:'Order the WPA3-Enterprise rollout',
 kw:['WPA3 / SAE','GCMP-256','PMF (802.11w)','802.1X','certificates','WPS','supplicant / authenticator'],
 scenario:'The board approved WPA3-Enterprise for 900 laptops. Sequence the programme the way a network architect would run it.',
 question:'Put the six rollout steps in the correct order — first on top.',
 lab:'Put the rollout steps in order — first on top',
 items:[
  {t:'Provision RADIUS with a server certificate; enrol client certificates (EAP-TLS) on every supplicant'},
  {t:'Build the WLAN: 802.1X (authenticator = WLC), WPA3-Enterprise with GCMP-256, PMF required'},
  {t:'Pilot with one department; watch authentication logs daily'},
  {t:'Verify roaming and client capability (802.11k/v/r behaviour with PMF and FT)'},
  {t:'Roll out fleet-wide and retire the legacy WPA2-PSK SSIDs'},
  {t:'Disable WPS on every remaining AP and record it in the wireless policy'}
 ],
 hint:'Servers first, pilot before fleet, cleanup and policy last.',
 expl:'Certificates are the foundation — nothing joins without the RADIUS server certificate and client certificates deployed to supplicants. Then build the WLAN correctly (802.1X with the WLC as authenticator, GCMP-256 ciphers, PMF required) <b>before</b> any pilot, so the pilot tests the real thing. A pilot with log review catches capability mismatches cheaply; roaming verification (11k/v/r plus PMF/FT pairing) catches the voice problems later. Fleet rollout then retirement of legacy PSK SSIDs removes the downgrade path. WPS off everywhere closes the side door and belongs in the written policy. <b>Focus on:</b> trust infrastructure → WLAN → prove on a pilot → fleet → cleanup.'},
{id:'H22',type:'dd',theme:'freq',title:'Which band hurts? Sort the hazards',
 kw:['2.4 GHz band','5 GHz band','60 GHz WiGig','WPAN','WWAN','UNII bands','channels 1 / 6 / 11','microwave / Bluetooth / Zigbee interference','RF attenuation'],
 scenario:'Spectrum triage. Each hazard belongs to one bucket — know your bands.',
 question:'Drag each hazard to the band it affects.',
 buckets:[{id:'b24',label:'2.4 GHz'},{id:'b5',label:'5 GHz'},{id:'both',label:'Both 2.4 and 5'},{id:'nei',label:'Neither'}],
 items:[
  {t:'Microwave oven spray',b:'b24'},
  {t:'Weather radar forcing channel switches',b:'b5'},
  {t:'Bluetooth hops across the band (a WPAN guest)',b:'b24'},
  {t:'Concrete wall loss',b:'both'},
  {t:'Zigbee plug sensor',b:'b24'},
  {t:'UNII-3 point-to-point backhaul lives here',b:'b5'},
  {t:'6 GHz AFC checks',b:'nei'},
  {t:'Neighbour AP on channel 2',b:'b24'},
  {t:'WiGig 60 GHz dock',b:'nei'},
  {t:'5G failover dongle (WWAN)',b:'nei'}
 ],
 hint:'Walls do not read labels; radar only speaks 5 GHz; some things live on other bands entirely.',
 expl:'2.4 GHz is the shared band: microwave ovens, Bluetooth, Zigbee, and badly planned neighbours (channel 2 overlaps everything near 1/6/11). 5 GHz hosts the DFS radar space and the UNII-3 block used for outdoor point-to-point links. Concrete walls attenuate <b>any</b> band — physics is frequency-agnostic at this level of truth (higher loses a bit more, but both suffer). 6 GHz AFC, WiGig at 60 GHz and 5G dongles do not touch 2.4/5 GHz at all. <b>Focus on:</b> bucket by where the energy or the rule actually lives.'},
{id:'H23',type:'qcm',theme:'freq',title:'The AP that keeps switching channels',
 kw:['channel bonding (40/80/160 MHz)','DFS (Dynamic Frequency Selection)','channel width trade-off','channels 1 / 6 / 11'],
 scenario:'An AP configured with a 160 MHz channel on 5 GHz changes channel almost weekly, each time dropping its clients for several seconds. Neighbouring APs on 80 MHz channels are stable. The site is near a coastal weather radar.',
 question:'What is the root cause?',
 opts:['A 160 MHz channel spans DFS space, so radar forces it to move','160 MHz is only legal in 2.4 GHz and the AP keeps correcting itself','The AP is out of switch PoE budget and reboots its radios','WPS traffic is colliding with the beacon frames periodically'],
 c:0,
 sim:false,
 hint:'Follow where 160 MHz has to live in the 5 GHz band map.',
 expl:'There is no 160 MHz block in 5 GHz that avoids DFS: any 160 MHz-wide channel spans into UNII-2/UNII-2E, where radar detection forces the whole wide channel to move — hence the weekly drops near the coast. Neighbours on 80 MHz (or 20/40) channels can pick non-DFS space and stay put. PoE faults would show in the switch log, not as channel changes, and WPS has no channel role. <b>Focus on:</b> the channel width trade-off — width wants spectrum, DFS owns much of it; pick width per site, not per datasheet.'},
{id:'H24',type:'fill',theme:'guest',title:'Complete the guest onboarding flow',
 kw:['captive portal','guest VLAN','bandwidth rate limiting'],
 scenario:'The guest onboarding runbook lost its key nouns. Fill every blank from the word bank.',
 question:'Complete the runbook — one term per blank.',
 text:'Guests join "Guest-Net". The controller intercepts their first browser request (hxxp) and redirects it to the {{0}} portal page. After they accept the {{1}} of use, their traffic is placed in the {{2}} VLAN. From there, firewall rules allow {{3}}-bound traffic only, and a {{4}} limit keeps any single guest from starving the internet link.',
 ans:['captive','terms','guest','internet','rate'],
 bank:['enterprise','WPS','roaming','DFS','ad hoc'],
 hint:'A page you must pass, a promise you accept, a cage you sit in, a door you may use, a leash on speed.',
 expl:'The <b>captive portal</b> is the interception page every guest must pass; accepting the <b>terms</b> of use creates the legal agreement. Placement in the <b>guest VLAN</b> is what actually isolates the traffic, the firewall\'s <b>internet</b>-only rules enforce it, and the <b>rate</b> limit protects the link for everyone else. The distractors belong to other worlds: enterprise is the staff auth model, WPS is a join convenience best left off, roaming is client movement, DFS is a 5 GHz radar rule, and ad hoc has no portal at all.'},
{id:'H25',type:'spot',theme:'ap',title:'Spot the line that breaks stairwell roaming',
 kw:['roaming','802.11k','802.11v','802.11r','WPA3 / SAE','WPA2 / AES-CCMP'],
 scenario:'Since floor 3 was migrated early, phones demand a full manual reconnect at the floor 2→3 stairwell. Coverage and overlap were re-measured and are fine.',
 cfg:['1. wlan CORP — same ESSID advertised on floor 2 and floor 3','2. floor2 AP: channel 36, 80 MHz','3. floor3 AP: channel 100, 80 MHz (DFS)','4. floor2 AP: security wpa3-enterprise, PMF required','5. floor3 AP: security wpa2-enterprise, PMF optional','6. both floors: 802.11k/v/r enabled','7. measured cell overlap at the stairwell: 18%','8. min-RSSI rule: nudge clients below -70 dBm'],
 question:'Click the ONE line that explains the forced reconnects.',
 need:[4],
 hint:'Same name is not enough — the two cells must speak the same security suite.',
 expl:'Roaming is a client decision made between <b>identical-looking</b> networks: same SSID, same security suite. Floor 2 advertises WPA3-Enterprise while floor 3 advertises WPA2-Enterprise, so a client moving between them is not "roaming" — it is joining a different network, complete with fresh authentication. Align both floors on one suite (e.g., WPA3 with transition, or WPA2-Enterprise with PMF matching the fleet) and stairwell handoffs return. Overlap (18%), channels 36/100 (non-overlapping in 5 GHz) and 11k/v/r are all healthy. <b>Focus on:</b> SSID, security and PMF settings must match across every cell of an ESS.'},
{id:'H26',type:'row',theme:'guest',title:'Portal incident — blue hat, red hat',
 kw:['captive portal','client isolation','guest VLAN'],
 scenario:'A guest portal account created for one visitor was used by 47 different MAC addresses within an hour. Same guest WLAN, two perspectives.',
 style:'dual',
 question:'Answer from both perspectives.',
 rows:[
  {role:'BLUE',q:'What is the right next move on the "temp123" portal account?',opts:['Kill the shared account, issue per-user creds, review VLAN 60','Rename the portal page URL so attackers cannot find it again','Enable WPS so future guests can join without accounts','Bond the guest APs to 160 MHz channels for extra capacity'],c:0},
  {role:'RED',q:'You are the pentester inside the guest VLAN with client isolation ON. What can you still reach?',opts:['Whatever the inter-VLAN rules still permit, plus the open internet','Staff laptop file shares, by sniffing the staff VLAN traffic','Nothing at all — client isolation makes the VLAN harmless','The corporate SSID, simply by asking the portal nicely'],c:0}
 ],
 hint:'Blue stops the spread and cleans the door; red reads the firewall rulebook.',
 expl:'<b>Blue:</b> a shared portal credential with 47 consumers is a lost credential, not a capacity stat. Kill the account, replace shared credentials with unique ones (SMS/email/one-time codes), and check what the guest VLAN actually did while compromised. <b>Red:</b> client isolation only stops guest-to-guest traffic on the same subnet. Whatever the inter-VLAN rules still allow (that stale 60→LAN print rule, DNS, the internet itself) remains fair game — isolation is one control, not a force field. It never grants access to the staff SSID and never blocks cross-VLAN holes. <b>Focus on:</b> isolation contains east-west guest traffic; policy still owns north-south.'},
{id:'H27',type:'row',theme:'ap',title:'Conference room redesign — three decisions',
 kw:['WLAN','OFDMA','MIMO / MU-MIMO','beamforming','band steering','AP placement','heat map','omnidirectional antenna','patch / panel antenna','802.11r'],
 scenario:'The exec conference room on the campus WLAN seats 60 laptops and 12 phones. The last heat map shows weak edges by the glass wall, and meetings stall when everyone shares slides at once.',
 style:'design',
 question:'Pick the right option for each decision.',
 rows:[
  {q:'Air strategy — which plan fits 72 mostly-modern devices?',opts:['Wi-Fi 6 OFDMA with MU-MIMO and beamforming on 80 MHz 5 GHz','One 40 MHz 2.4 GHz cell serving all 72 devices at once','Maximum transmit power on every AP in the whole wing'],c:0},
  {q:'Placement — where does hardware go?',opts:['Two ceiling APs with omni antennas over the seats','One AP tucked inside the corner steel cabinet','Three ceiling APs all pinned to one channel (11)','A patch/panel antenna aimed only at the glass wall'],c:0},
  {q:'Handoff — calls still drop when people step out to the corridor. Fix?',opts:['Enable 802.11k/v/r fast roaming and tune min-RSSI','Set the beacon interval to 500 milliseconds instead','Enable WPS on the room\'s APs for faster joins'],c:0}
 ],
 hint:'Air for the crowd, ceiling for the seats, keys for the door.',
 expl:'Crowds need <b>OFDMA</b> (many small frames share one channel) plus <b>MU-MIMO/beamforming</b> to serve several clients at once, on wide clean channels — steering modern clients to 6 GHz if the fleet supports it. A 2.4 GHz cell cannot carry 72 devices, and max power just inflates cells and interference. Placement is ceiling-central <b>omnidirectional</b> APs with planned overlap; cabinets kill RF, same-channel clusters self-contend, and one patch antenna aimed at glass wastes the room. Dropped calls at doors are a roaming problem — <b>802.11k/v/r</b> plus a min-RSSI floor fix handoffs; beacons and WPS are irrelevant. <b>Focus on:</b> capacity, placement, and handoff are three separate decisions.'},
{id:'H28',type:'qcm',theme:'ap',title:'APs join, configure, then drop',
 kw:['PoE 802.3af/at/bt','PoE budget'],
 scenario:'Floor-4 APs join the controller, pull their config, then drop — in a rolling pattern, a few at a time. The switch log repeats: <code>PoE: port limit exceeded, denying power</code>. Each 802.11ax AP draws up to 25 W; the 24-port switch delivers 802.3at per port but its total PoE budget is 370 W, with 20 APs and desk phones already attached.',
 question:'What is the correct fix?',
 opts:['Add PoE budget — 802.3bt switches, a switch, or injectors','Disable DFS radar checks on the floor-4 APs entirely','Shorten the SSID names to reduce the beacon load','Force every floor-4 AP onto static channel 165'],
 c:0,
 sim:false,
 hint:'Count the watts: 20 devices x 25 W versus the chassis number.',
 expl:'Per-port the switch can deliver 802.3at (30 W), but the <b>chassis PoE budget</b> is the binding constraint: 20 APs at 25 W is 500 W plus phones — far beyond 370 W. The switch denies power to whichever ports exceed what remains, which is why APs fail in a rolling pattern after joining. The fix is more watts: 802.3bt-capable gear, another switch, or rated injectors (and verify the budget calculation per device class). DFS, SSID names and channel numbers have nothing to do with power delivery. <b>Focus on:</b> per-port standard AND total budget — check both.'},
{id:'H29',type:'log',theme:'freq',title:'Channel-switch chaos on the east wing',
 kw:['DFS (Dynamic Frequency Selection)','RRM','co-channel interference','roaming'],
 scenario:'East-wing users logged two "Wi-Fi blips" around noon. You pull the relevant controller lines.',

  {t:'12:00:01',lv:'warn',m:'RRM: AP-07 5 GHz ch 124->132 (DFS radar detected)'},
  {t:'12:00:09',lv:'inf',m:'AP-07: channel change complete; 38 clients reassociated'},
  {t:'12:04:55',lv:'warn',m:'RRM: AP-07 ch 132->116 (DFS radar detected)'},
  {t:'12:05:03',lv:'warn',m:'AP-11 (static ch 116): co-channel contention rising; airtime contention alerts'},
  {t:'12:06:12',lv:'inf',m:'RRM: monitoring; no further radar events this hour'}
 ],
 question:'Select ALL statements the log supports.',
 inner:{type:'multi',opts:['DFS events moved AP-07 twice within five minutes','After landing on 116, AP-07 now contends with static AP-11','Clients had to reassociate, so the blips match the switches','AP-07 is clearly a 2.4 GHz radio on the east wing'],ans:[0,1,2]},
 hint:'Two radar moves, one unlucky static neighbour — and read the band carefully.',
 expl:'The log shows two radar-triggered moves (124→132, then 132→116) with a client reassociation burst after each — that is the blip users felt. Landing on <b>116 put AP-07 on the same channel as static AP-11</b>, creating co-channel contention (they now share airtime; clean but slow). Channel numbers 116/124/132 are 5 GHz DFS space — a 2.4 GHz radio could never sit there. <b>Focus on:</b> after every DFS event, check where the AP landed and who it now shares a channel with.'},
{id:'H30',type:'row',theme:'ap',title:'Night SOC shift — three wireless pages',
 kw:['DFS (Dynamic Frequency Selection)','EAP-TLS','certificates','bandwidth rate limiting'],
 scenario:'You hold the pager tonight. Three pages, three different disciplines. Pick the correct handling for each.',
 style:'queue',
 question:'Choose the correct action for each page.',
 rows:[
  {q:'<b>PAGE 1</b> — UNII-2E radar false positives all night across campus; DFS channels keep vacating.',opts:['Report to the spectrum team; keep critical SSIDs off DFS','Disable RRM globally and force every AP to 160 MHz channels','Turn off all the 5 GHz radios until the morning'],c:0},
  {q:'<b>PAGE 2</b> — Thirty new tablets fail EAP-TLS with "unknown CA" on the staff WLAN.',opts:['Push the RADIUS CA chain via MDM and re-test enrollment','Downgrade the staff WLAN to WPA2-Personal for now','Reset every AP in the building at once tonight'],c:0},
  {q:'<b>PAGE 3</b> — Guest VLAN 60 pushes 900 Mbps to one video site; staff QA traffic stutters.',opts:['Verify/apply the guest rate limit and a QoS class for VLAN 60','Give the guest APs channel 14 for extra isolation','Disable the guest portal until Monday morning comes'],c:0}
 ],
 hint:'Spectrum, certificates, bandwidth — one page each, no overreactions.',
 expl:'Page 1: sustained <b>false radar detections</b> are a spectrum-hygiene case — report it (regulator/spectrum team) while keeping critical SSIDs on non-DFS channels; forcing 160 MHz (DFS-heavy) or going dark are overreactions. Page 2: "unknown CA" is a <b>certificate trust</b> failure — the tablets lack the RADIUS CA chain; MDM delivers it, downgrading the WLAN would gut security for a provisioning gap. Page 3: 900 Mbps of guest video starving staff QA is a <b>bandwidth rate limiting/QoS</b> gap on the guest VLAN, not a channel or portal problem. <b>Focus on:</b> match the page to its discipline before touching configs.'}
];

var TL={qcm:'Multiple choice',multi:'Multi-select',dd:'Drag & drop',match:'Matching',order:'Ordering',fill:'Fill the blanks',term:'Terminal',log:'Log analysis',branch:'Decision tree',spot:'Spot the mistake',row:'Guided scenario'};
var AL={qcm:'Choose one',multi:'Select all that apply',dd:'Drag each item to its bucket',match:'Match each item',order:'Put in the right order',fill:'Place the words in the blanks',term:'Type the command, press Run, then Check',log:'Read the log, answer below',branch:'Walk the decision path',spot:'Click the mistaken line(s)',row:'Answer every step'};

var S=null;
function curIdx(){return S.ord[S.cur];}
function curEx(){return EXERCISES[curIdx()];}

function buildView(ex){

  else if(ex.type==='row'){v.rows=ex.rows.map(function(r){return sh(r.opts.map(function(_,k){return k;}));});}
  else if(ex.type==='branch'){v.rows=ex.steps.map(function(r){return sh(r.opts.map(function(_,k){return k;}));});}
  else if(ex.type==='dd'){v.items=sh(ex.items.map(function(_,k){return k;}));}

  else if(ex.type==='fill'){v.bank=sh(ex.ans.concat(ex.bank||[]));}
  else if(ex.type==='log'){v.inner=sh(ex.inner.opts.map(function(_,k){return k;}));}

function initAns(ex,v){
  switch(ex.type){
    case 'qcm':return null;
    case 'multi':return [];
    case 'dd':return {sel:null,place:{}};
    case 'match':return {sel:null,place:{}};
    case 'order':return {ord:v.items.slice()};
    case 'fill':return {slots:ex.ans.map(function(){return null;})};
    case 'term':return {cmd:''};
    case 'log':return (ex.inner.type==='multi')?[]:null;
    case 'branch':return {picks:ex.steps.map(function(){return null;}),max:0};
    case 'spot':return {marked:[]};
    case 'row':return ex.rows.map(function(){return null;});

}
function hasAns(ex,lv){
  var a=lv.a;
  if(a===null||a===undefined)return false;
  switch(ex.type){
    case 'multi':return a.length>0;
    case 'dd':return ex.items.some(function(_,k){return a.place[k];});
    case 'match':return ex.pairs.some(function(_,k){return a.place[k]!==undefined&&a.place[k]!==null;});
    case 'order':return true;
    case 'fill':return a.slots.some(function(s){return s!==null;});
    case 'term':return String(a.cmd||'').trim().length>0;
    case 'log':return ex.inner.type==='multi'?a.length>0:a!==null;

/* validate -> {det:[{i,ok,bad,miss,fix}], corr, el} ; det entry per element (per option/line when marking needs it) */
function validate(ex,lv){
  var a=lv.a,v=lv.view,det=[],corr=0,el=0;
  function d(i,ok,bad,miss,fix){det.push({i:i,ok:ok,bad:bad,miss:miss,fix:fix||null});}
  switch(ex.type){
    case 'qcm':
      el=1;var ok=a===ex.c;
      if(ok)corr=1;
      det.push({i:a,ok:ok,bad:!ok,miss:false,fix:ok?null:ex.opts[ex.c]});
      break;
    case 'multi':
      el=ex.ans.length;
      ex.opts.forEach(function(_,k){
        var picked=a.indexOf(k)>=0,right=ex.ans.indexOf(k)>=0;
        if(right&&picked){corr++;d(k,true,false,false);}
        else if(right&&!picked){d(k,false,false,true);}
        else if(!right&&picked){d(k,false,true,false);}
      });
      break;
    case 'dd':
      el=ex.items.length;
      ex.items.forEach(function(it,k){
        var p=a.place[k];
        if(p===it.b){corr++;d(k,true,false,false);}
        else if(p){d(k,false,true,false,ex.buckets.filter(function(b){return b.id===it.b;})[0].label);}
        else{d(k,false,false,true,ex.buckets.filter(function(b){return b.id===it.b;})[0].label);}
      });
      break;
    case 'match':
      el=ex.pairs.length;
      ex.pairs.forEach(function(pr,k){
        var p=a.place[k];
        if(p!==undefined&&p!==null&&String(p)===String(k)){corr++;d(k,true,false,false);}
        else if(p!==undefined&&p!==null){d(k,false,true,false,pr.r);}
        else{d(k,false,false,true,pr.r);}
      });
      break;
    case 'order':
      el=ex.items.length;
      a.ord.forEach(function(ix,p){
        if(ix===p){corr++;d(p,true,false,false);}
        else{d(p,false,true,false,ex.items[p].t);}
      });
      break;
    case 'fill':
      el=ex.ans.length;
      a.slots.forEach(function(w,i){
        if(w===ex.ans[i]){corr++;d(i,true,false,false);}
        else if(w===null){d(i,false,false,true,ex.ans[i]);}
        else{d(i,false,true,false,ex.ans[i]);}
      });
      break;
    case 'term':
      el=1;var ok=ex.accepted.some(function(rx){return rx.test(String(a.cmd||'').trim());});
      if(ok)corr=1;
      det.push({i:0,ok:ok,bad:!ok,miss:false,fix:null});
      break;
    case 'log':
      return validateInner(ex.inner,a,v);
    case 'branch':
      el=ex.steps.length;
      ex.steps.forEach(function(st,k){
        var p=a.picks[k];
        if(p===st.c){corr++;d(k,true,false,false);}
        else{d(k,false,true,false,st.opts[st.c]);}
      });
      break;
    case 'spot':
      el=ex.need.length;
      ex.cfg.forEach(function(_,k){
        var marked=a.marked.indexOf(k)>=0,needed=ex.need.indexOf(k)>=0;
        if(needed&&marked){corr++;d(k,true,false,false);}
        else if(needed&&!marked){d(k,false,false,true);}
        else if(!needed&&marked){d(k,false,true,false);}
      });
      break;
    case 'row':
      el=ex.rows.length;
      ex.rows.forEach(function(r,k){
        var p=a[k];
        if(p===r.c){corr++;d(k,true,false,false);}
        else{d(k,false,true,false,r.opts[r.c]);}
      });
      break;
  }
  return {det:det,corr:corr,el:el};
}
function validateInner(inner,a,v){
  var det=[],corr=0,el=0;
  if(inner.type==='multi'){
    el=inner.ans.length;
    inner.opts.forEach(function(_,k){
      var picked=a.indexOf(k)>=0,right=inner.ans.indexOf(k)>=0;
      if(right&&picked){corr++;det.push({i:k,ok:true});}
      else if(right&&!picked){det.push({i:k,miss:true});}
      else if(!right&&picked){det.push({i:k,bad:true});}
    });
  }else{
    el=1;var ok=a===inner.c;
    if(ok)corr=1;
    det.push({i:a,ok:ok,bad:!ok,fix:ok?null:inner.opts[inner.c]});
  }
  return {det:det,corr:corr,el:el};
}
function summarize(ex,ans){
  try{
    switch(ex.type){
      case 'qcm':return ans==null?'—':esc(ex.opts[ans]);
      case 'multi':return (!ans||!ans.length)?'—':ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(ex.opts[k]);}).join(' + ');
      case 'dd':return ex.items.map(function(it,k){var p=ans?ans.place[k]:null;return esc(it.t)+' &rarr; '+(p?esc(ex.buckets.filter(function(b){return b.id===p;})[0].label):'(not placed)');}).join(';<br>');
      case 'match':return ex.pairs.map(function(pr,k){var p=ans?ans.place[k]:null;return esc(pr.l)+' &rarr; '+(p!==undefined&&p!==null?esc(pr.r):'(no match)');}).join(';<br>');
      case 'order':return ans?ans.ord.map(function(ix){return esc(ex.items[ix].t);}).join(' &rarr; '):'—';
      case 'fill':return ans?ans.slots.map(function(w){return w?esc(w):'____';}).join(' / '):'—';
      case 'term':return ans&&ans.cmd?esc(String(ans.cmd).trim()):'—';
      case 'log':return summarizeInner(ex.inner,ans);
      case 'branch':return ans?ex.steps.map(function(st,k){return 'Step '+(k+1)+': '+esc(ans.picks[k]!=null?st.opts[ans.picks[k]]:'(no choice)');}).join(';<br>'):'—';
      case 'spot':return ans&&ans.marked.length?ans.marked.map(function(k){return 'line '+(k+1);}).join(', '):'—';
      case 'row':return ans?ex.rows.map(function(r,k){return 'Row '+(k+1)+': '+esc(ans[k]!=null?r.opts[ans[k]]:'(no choice)');}).join(';<br>'):'—';
    }
  }catch(e){return '—';}
  return '—';
}
function summarizeInner(inner,ans){
  if(inner.type==='multi'){return (!ans||!ans.length)?'—':ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(inner.opts[k]);}).join(' + ');}
  return ans==null?'—':esc(inner.opts[ans]);
}
function correctSummary(ex){
  switch(ex.type){
    case 'qcm':return esc(ex.opts[ex.c]);
    case 'multi':return ex.ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(ex.opts[k]);}).join(' + ');
    case 'dd':return ex.items.map(function(it){return esc(it.t)+' &rarr; '+esc(ex.buckets.filter(function(b){return b.id===it.b;})[0].label);}).join(';<br>');
    case 'match':return ex.pairs.map(function(pr){return esc(pr.l)+' &rarr; '+esc(pr.r);}).join(';<br>');
    case 'order':return ex.items.map(function(it){return esc(it.t);}).join(' &rarr; ');
    case 'fill':return ex.ans.map(esc).join(' / ');
    case 'term':return 'Any command matching the task, e.g. <code>'+esc(ex.example)+'</code>';
    case 'log':return ex.inner.type==='multi'?ex.inner.ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(ex.inner.opts[k]);}).join(' + '):esc(ex.inner.opts[ex.inner.c]);
    case 'branch':return ex.steps.map(function(st,k){return 'Step '+(k+1)+': '+esc(st.opts[st.c]);}).join(';<br>');
    case 'spot':return 'line '+ex.need.map(function(k){return k+1;}).join(' and line ')+' ('+ex.need.map(function(k){return esc(ex.cfg[k]);}).join(' / ')+')';
    case 'row':return ex.rows.map(function(r,k){return 'Row '+(k+1)+': '+esc(r.opts[r.c]);}).join(';<br>');
  }
  return '';
}

function chipEl(txt,cls,dr){var b=document.createElement('button');b.type='button';b.className='chip '+(cls||'');b.innerHTML=txt;b.draggable=!dr?true:!!dr;return b;}
function placeChip(lv,host,ex,kind,lock,det){
  /* shared by dd & match */
  var isDD=kind==='dd';
  var buckets=isDD?ex.buckets:ex.pairs.map(function(pr,k){return {id:String(k),label:pr.l};});
  var pool=document.createElement('div');pool.className='chips';
  var zones=document.createElement('div');
  function itemText(k){return esc(isDD?ex.items[k].t:ex.pairs[k].r);}
  function bucketLabel(id){return esc(buckets.filter(function(b){return String(b.id)===String(id);})[0].label);}
  function bucketLabelRaw(id){return buckets.filter(function(b){return String(b.id)===String(id);})[0].label;}
  var sel=lv.a.sel;
  buckets.forEach(function(b){
    var z=document.createElement('div');z.className='zone';z.setAttribute('role','button');z.tabIndex=0;
    z.setAttribute('aria-label','Bucket: '+bucketLabelRaw(b.id));
    z.innerHTML='<div class="zh">'+(isDD?bucketLabel(b.id):'&rarr; '+bucketLabel(b.id))+'</div>';
    function put(k){lv.a.place[k]=b.id;lv.a.sel=null;renderEx();}
    z.addEventListener('click',function(){if(lock)return;if(lv.a.sel!==null&&lv.a.sel!==undefined)put(lv.a.sel);});
    z.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!lock){e.preventDefault();if(lv.a.sel!==null&&lv.a.sel!==undefined)put(lv.a.sel);}});
    z.addEventListener('dragover',function(e){if(!lock)e.preventDefault();});
    z.addEventListener('drop',function(e){if(lock)return;e.preventDefault();var k=parseInt(e.dataTransfer.getData('text/plain'),10);if(!isNaN(k))put(k);});
    Object.keys(lv.a.place).forEach(function(kk){
      if(String(lv.a.place[kk])!==String(b.id))return;
      var k=parseInt(kk,10);
      var c=det?detFor(det,k):null;
      var cls=c?(c.ok?'mark-ok':(c.bad?'mark-bad':'')):(lv.a.sel===k?'sel':'');
      var ch=chipEl(itemText(k),cls,!lock);
      if(c)ch.insertAdjacentHTML('beforeend',c.ok?stSpan('ok','&#10003;'):(c.bad?stSpan('bad','&#10007; correct: '+c.fix):stSpan('miss','! belongs in: '+c.fix)));
      ch.addEventListener('click',function(){if(lock)return;delete lv.a.place[k];renderEx();});
      z.appendChild(ch);
    });
    zones.appendChild(z);
  });
  var poolOrder=(isDD?lv.view.items:lv.view.rchips);
  poolOrder.forEach(function(k){
    if(lv.a.place[k]!==undefined&&lv.a.place[k]!==null)return;
    var c=det?detFor(det,k):null;
    var cls=c?(c.ok?'mark-ok':'mark-miss'):(lv.a.sel===k?'sel':'');
    var ch=chipEl(itemText(k),cls,!lock);
    if(c)ch.insertAdjacentHTML('beforeend',c.ok?stSpan('ok','&#10003;'):stSpan('miss','! place in: '+c.fix));
    ch.addEventListener('click',function(){if(lock)return;lv.a.sel=(lv.a.sel===k?null:k);renderEx();});
    ch.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',String(k));});
    pool.appendChild(ch);
  });
  host.appendChild(pool);
  host.appendChild(zones);
}

  else ind.classList.add('hidden');
}
function updScore(){
  var e=0,n=0;
  Object.keys(S.lock).forEach(function(k){e+=S.lock[k].earned;n++;});
  $('tScore').innerHTML='Score <b>'+r2(e)+'</b> / '+EXERCISES.length+' pts &middot; '+n+'/'+EXERCISES.length+' checked';
  var pct=Math.round(n/EXERCISES.length*100);
  $('pBar').style.width=pct+'%';
  $('pBar').parentElement.setAttribute('aria-valuenow',String(pct));
  var tc=$('themeChips');tc.innerHTML='';
  THEMES.forEach(function(t){
    var tot=0,dn=0;
    EXERCISES.forEach(function(ex,ix){if(ex.theme===t.id){tot++;if(S.lock[ix])dn++;}});
    var d=document.createElement('span');d.className='tchip';d.textContent=t.name+' '+dn+'/'+tot;
    tc.appendChild(d);
  });
}
function navState(i){
  if(S.lock[i]){var l=S.lock[i];return l.corr>=l.el?'full':(l.corr<=0?'zero':'part');}
  if(S.skp[i])return 'skip';
  return '';
}
function drawNav(){
  var g=$('navGrid');g.innerHTML='';
  S.ord.forEach(function(ix,p){
    var b=document.createElement('button');b.type='button';b.className='nbtn'+(p===S.cur?' cur':'')+(navState(ix)?' '+navState(ix):'');
    var gl={full:'&#10003;',part:'&#177;',zero:'&#10007;',skip:'&#187;'}[navState(ix)]||'';
    var w={full:'correct',part:'partial',zero:'wrong',skip:'skipped'}[navState(ix)]||'not answered';
    b.innerHTML=String(p+1)+'<span class="g">'+gl+'</span>';
    b.setAttribute('aria-label','Question '+(p+1)+' — '+w+(p===S.cur?' — current':''));
    b.addEventListener('click',function(){S.cur=p;renderEx();});
    g.appendChild(b);
  });
}
/* ---------- actions ---------- */
function warn(msg){
  var fb=$('fbPanel');fb.classList.remove('hidden');
  fb.innerHTML='<b style="color:#fbbf24">&#9888; '+esc(msg)+'</b>';
}
function showFb(i,silent){
  var lk=S.lock[i];if(!lk)return;
  var ex=EXERCISES[i];
  var lab=lk.corr>=lk.el?'FULL':(lk.corr<=0?'ZERO':'PARTIAL');
  var col=lab==='FULL'?'#34d399':(lab==='ZERO'?'#f87171':'#fbbf24');
  var fb=$('fbPanel');fb.classList.remove('hidden');
  fb.innerHTML='<b style="color:'+col+'">'+(lab==='FULL'?'&#10003;':(lab==='ZERO'?'&#10007;':'&#177;'))+' You earned '+r2(lk.earned)+' of '+lk.el+' point'+(lk.el>1?'s':'')+' on this exercise ('+lab.toLowerCase()+')'+(S.hint[i]?' — includes hint penalty (−10%)':'')+'</b>';
  var xe=$('exExpl');xe.classList.remove('hidden');
  xe.innerHTML='<div class="eh">Explanation — why</div>'+ex.expl;
  drawNav();updScore();
}
function doCheck(){
  if(S.done)return;
  var i=curIdx(),ex=curEx(),lv=live(i);
  if(S.lock[i]){S.cp=true;updTimer();showFb(i);return;}
  if(!hasAns(ex,lv)){warn('Give an answer first — or press Skip if you want to come back later.');return;}
  if(ex.type==='branch'&&lv.a.max<ex.steps.length){warn('Finish every step of the path first.');return;}
  var v=validate(ex,lv);
  var mult=S.hint[i]?0.9:1;
  var earned=r2(r2(v.corr/v.el)*mult);
  S.lock[i]={det:v.det,corr:v.corr,el:v.el,earned:earned,a:cp(lv.a)};
  S.skp[i]=false;
  S.cp=true;
  renderEx();updTimer();drawNav();
}
function doSkip(){
  if(S.done)return;
  var i=curIdx();
  if(S.lock[i])return;
  S.skp[i]=true;
  if(S.cur<S.ord.length-1){S.cur++;renderEx();drawNav();}
  else openSubmit();
}
function doHint(){
  var i=curIdx();
  if(S.lock[i]||S.hint[i])return;
  S.hint[i]=true;
  var hb=$('hintBox');hb.classList.remove('hidden');
  hb.innerHTML='<b>Hint</b> <span class="small">(costs 10% of this exercise — a nudge, not the answer)</span><br>'+esc(curEx().hint);
  $('btnHint').disabled=true;
}
function doRevise(){
  var i=curIdx();
  if(!S.lock[i])return;
  delete S.lock[i];
  var ex=curEx(),lv=live(i);
  lv.a=initAns(ex,lv.view); /* clear the answer so the exercise can be redone (branch steps reopen) */
  renderEx();drawNav();
}
function doNext(){
  if(S.done)return;
  if(S.cp){S.cp=false;updTimer();}
  if(S.cur<S.ord.length-1){S.cur++;renderEx();drawNav();window.scrollTo(0,0);}
  else openSubmit();
}
function doPrev(){if(S.done)return;if(S.cur>0){S.cur--;renderEx();drawNav();}}
function doPause(){
  if(S.done)return;
  S.mp=!S.mp;
  $('btnPause').innerHTML=S.mp?'Resume':'Pause';
  $('btnPause').setAttribute('aria-pressed',S.mp?'true':'false');
  $('blurBox').classList.toggle('blurred',S.mp);
  $('pauseCover').textContent=S.cp&&S.mp?'Paused (manual) — content hidden. The review pause ends on Next.':'Paused (manual) — press Resume to continue';
  updTimer();
}
function modal(html,btns){
  var h=$('modalHost');
  h.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="modalbox">'+html+'<div class="mbtns" id="mb"></div></div></div>';
  var mb=$('mb');
  btns.forEach(function(b){
    var el=document.createElement('button');el.type='button';el.className='btn '+(b.p?'primary':'');
    el.textContent=b.t;
    el.addEventListener('click',function(){h.innerHTML='';if(b.f)b.f();});
    mb.appendChild(el);
  });
}
function openSubmit(){
  if(S.done)return;
  var n=EXERCISES.length,sk=0,ck=0,un=0;
  for(var i=0;i<n;i++){if(S.skp[i]&&!S.lock[i])sk++;else if(S.lock[i])ck++;else un++;}
  if(sk===n){
    modal('<h2>Nothing to score</h2><p>Every exercise is skipped. The exam needs at least one answered exercise to produce a score. Go back and answer at least one, then submit again.</p>',[{t:'Go back',p:true,f:function(){}}]);
    return;
  }
  modal('<h2>Submit exam?</h2><ul class="tight"><li>Checked: <b>'+ck+'</b></li><li>Unchecked (counts 0 points): <b>'+un+'</b></li><li>Skipped (excluded from score): <b>'+sk+'</b></li></ul><p>Your score is computed over the non-skipped exercises only.</p>',[
    {t:'Keep working',f:function(){}},
    {t:'Submit exam',p:true,f:function(){finish();}}
  ]);
}
/* ---------- results & reporting ---------- */
function reportScore(correct,total){
  var percent=Math.round((correct/total)*100);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EXAM.topicId,
      score:correct,
      total:total,
      percent:percent,
      passed:percent>=EXAM.passMark
    },location.origin);
  }catch(e){/* opened directly, nothing to report to */}
}
function finish(){
  if(S.done)return;
  S.done=true;S.run=false;
  $('modalHost').innerHTML='';
  var n=EXERCISES.length,skipped=[],answered=0,earned=0;
  for(var i=0;i<n;i++){
    if(S.skp[i]&&!S.lock[i])skipped.push(i);
    else{answered++;if(S.lock[i])earned+=S.lock[i].earned;}
  }
  var sc=Math.round(earned);
  var pct=Math.round(sc/answered*100);
  var passed=pct>=EXAM.passMark;
  var rh=$('resHead');
  rh.innerHTML='<div class="bigpct" style="color:'+(passed?'#34d399':'#f87171')+'">'+pct+'%</div>'+
    '<div class="passpanel '+(passed?'pass':'fail')+'"><div class="pt">'+(passed?'&#9989; PASS':'&#10060; FAIL')+'</div>'+
    '<p>'+(passed?'Well done — you reached the pass mark of '+EXAM.passMark+'%.':'You needed '+EXAM.passMark+'%. Review the report below and retake the exam.')+'</p></div>'+
    '<div class="resgrid">'+
    '<div class="meta"><div class="mv">'+r2(earned)+' / '+answered+'</div><div class="mk">points earned / exercises answered</div></div>'+
    '<div class="meta"><div class="mv">'+skipped.length+'</div><div class="mk">skipped (excluded from scoring)</div></div>'+
    '<div class="meta"><div class="mv">'+fmt(EXAM.seconds-S.t)+'</div><div class="mk">time used</div></div>'+
    '</div>'+
    '<p class="small">Score = earned points over non-skipped exercises only, partial credit included. Reported to the site as '+sc+'/'+answered+'.</p>';
  var rs=$('resSkipped');
  if(skipped.length){
    rs.innerHTML='<div class="blk"><span class="lbl">Skipped — not counted</span><p class="small">These exercises were skipped and are excluded from both the points earned and the points possible:</p><ul class="tight">'+skipped.map(function(i){var p=S.ord.indexOf(i);return '<li>#'+(p+1)+' — '+esc(EXERCISES[i].title)+'</li>';}).join('')+'</ul></div>';
  }else rs.innerHTML='';
  var rl=$('resList');rl.innerHTML='';
  S.ord.forEach(function(ix,p){
    var ex=EXERCISES[ix],lk=S.lock[ix],skp=S.skp[ix]&&!lk;
    var lab,max;
    if(skp){lab='skipped';max='—';}
    else if(!lk){lab='zero';max='1';}
    else{lab=lk.corr>=lk.el?'full':(lk.corr<=0?'zero':'partial');max=String(lk.el);}
    var labCol={full:'full',partial:'partial',zero:'zero',skipped:'skipped'}[lab];
    var d=document.createElement('details');d.className='rex';
    var sum=document.createElement('summary');
    sum.innerHTML='<span class="rlab '+labCol+'">'+lab.toUpperCase()+'</span><b>#'+(p+1)+' '+esc(ex.title)+'</b><span class="spacer"></span><span class="small">'+(skp?'not counted':(r2(lk?lk.earned:0)+' / '+max+' pts'))+'</span>';
    d.appendChild(sum);
    var body=document.createElement('div');body.className='rebody';
    body.innerHTML=
      '<div class="sec"><div class="k">YOUR ANSWER</div>'+(skp?'<i>You skipped this one — not counted in the score.</i>':(lk?summarize(ex,lk.a):'<i>Not checked — scored 0.</i>'))+'</div>'+
      (skp?'':'<div class="sec"><div class="k">CORRECT ANSWER</div>'+correctSummary(ex)+'</div>')+
      '<div class="sec"><div class="k">EXPLANATION'+(skp?' (what this tested)':'')+'</div>'+ex.expl+'</div>';
    d.appendChild(body);
    rl.appendChild(d);
  });
  $('scrExam').classList.add('hidden');
  $('scrResults').classList.remove('hidden');
  window.scrollTo(0,0);
  if(!S.reported&&answered>0){S.reported=true;reportScore(sc,answered);}
}
/* ---------- timer ---------- */
var tick=null;
function startTimer(){
  if(tick)clearInterval(tick);
  tick=setInterval(function(){
    if(!S||S.done||!S.run||S.mp||S.cp)return;
    S.t--;
    updTimer();
    if(S.t<=0){S.t=0;updTimer();finish();}
  },1000);
}
/* ---------- lifecycle ---------- */
function start(){
  S={ord:sh(EXERCISES.map(function(_,k){return k;})),cur:0,live:{},lock:{},skp:{},hint:{},t:EXAM.seconds,mp:false,cp:false,run:true,done:false,reported:false};
  $('scrIntro').classList.add('hidden');
  $('scrResults').classList.add('hidden');
  $('scrExam').classList.remove('hidden');
  $('btnPause').innerHTML='Pause';$('btnPause').setAttribute('aria-pressed','false');
  $('blurBox').classList.remove('blurred');
  updTimer();updScore();drawNav();
  renderEx();
  startTimer();
}
function buildIntro(){
  $('introTitle').textContent=EXAM.cert+' — '+EXAM.chapterName+' — practice exam';
  var sb=$('sevBadge');sb.textContent=EXAM.severity+' severity';sb.className='sevbadge sev-'+EXAM.difficulty;
  $('introSub').textContent='Objective 2.3 — wireless devices: channels, frequencies, SSID, network types, encryption, guest networks, authentication, antennas and access points.';
  var mg=$('metaGrid');
  [['30','exercises'],['1 point','per exercise'],[EXAM.estMin+' min','timer'],[EXAM.passMark+'%','pass mark'],['-10%','hint cost']].forEach(function(p){
    var d=document.createElement('div');d.className='meta';d.innerHTML='<div class="mv">'+p[0]+'</div><div class="mk">'+p[1]+'</div>';mg.appendChild(d);
  });
  $('introRules').innerHTML=[
    '<b>'+EXAM.severity+' severity.</b> Every exercise needs real reasoning with realistic artifacts (logs, configs, tickets).',
    'Every exercise has a clearly separated <b>SCENARIO</b>, <b>QUESTION</b> and <b>ANSWER</b> area.',
    '<b>Check</b> validates and locks your answer, shows per-element feedback and the explanation, and <b>pauses the timer in review mode</b>. The pause ends only when you press <b>Next</b>.',
    '<b>Manual Pause</b> (top bar) freezes the timer but hides the content, so it cannot be abused. The two pauses can stack.',
    '<b>Skip</b> moves on and marks the exercise amber. You can return to skipped exercises any time before the timer ends. Skipped exercises are <b>excluded from the score</b> (numerator and denominator).',
    '<b>Multi-answer exercises</b> give partial credit per correct element. Wrong extra picks never subtract points.',
    '<b>Hint</b> costs 10% of that exercise and gives a nudge, never the answer.',
    'Pass mark: '+EXAM.passMark+'%. You may revise any checked answer while time remains. Retake reshuffles everything.'
  ].map(function(s){return '<li>'+s+'</li>';}).join('');
  var kb=$('kwBody');kb.innerHTML='';
  THEMES.forEach(function(t){
    var d=document.createElement('div');d.className='theme';
    d.innerHTML='<div class="tn">'+esc(t.name)+'</div><div class="kws">'+t.kw.map(function(k){return '<span class="kw">'+esc(k)+'</span>';}).join('')+'</div>';
    kb.appendChild(d);
  });
}
function boot(){
  buildIntro();
  $('btnStart').addEventListener('click',start);
  $('btnCheck').addEventListener('click',doCheck);
  $('btnSkip').addEventListener('click',doSkip);
  $('btnHint').addEventListener('click',doHint);
  $('btnRevise').addEventListener('click',doRevise);
  $('btnNext').addEventListener('click',doNext);
  $('btnPrev').addEventListener('click',doPrev);
  $('btnPause').addEventListener('click',doPause);
  $('btnSubmit').addEventListener('click',openSubmit);
  $('btnRetake').addEventListener('click',function(){start();window.scrollTo(0,0);});
  window.addEventListener('message',function(e){
    if(!e.data)return;
    if(e.data.type!=='CYBERPULSE_INIT'&&e.data.type!=='CYBERMASTERY_INIT')return;
    var g=$('greet');
    if(e.data.username)g.textContent='Signed in as '+e.data.username+(e.data.country&&e.data.country!=='ZZ'?' ('+e.data.country+')':'');
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
/* test hooks (harmless in production) */
window.__exam={EXAM:function(){return EXAM;},EXERCISES:function(){return EXERCISES;},THEMES:function(){return THEMES;},S:function(){return S;},finish:function(){finish();},openSubmit:function(){openSubmit();},start:function(){start();}};
})();
</script>
</body>
</html>
