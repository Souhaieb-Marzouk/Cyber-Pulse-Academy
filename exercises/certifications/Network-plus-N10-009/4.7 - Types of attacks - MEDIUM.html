var DATA=[];
function EX(o){DATA.push(o);}

/* ---- M1 — DDoS volumetric triage (logview + single choice) ---- */
EX({id:'M1',th:0,type:'qcm',pts:2,kw:['DDoS','botnet','volumetric'],
title:'NetFlow spike on the customer portal',
scenario:'<p>12:03. You are on SOC shift. The monitoring dashboard flags the customer portal. NetFlow shows traffic arriving from thousands of source addresses in more than 40 countries, all aimed at one public IP: 203[.]0[.]113[.]10. No other service is affected.</p>',
logs:[
'<span class="hi">12:01:11 flow src=71[.]19[.]244[.]8      dst=203[.]0[.]113[.]10 bytes=1,240,000</span>',
'<span class="hi">12:01:11 flow src=88[.]12[.]9[.]211       dst=203[.]0[.]113[.]10 bytes=2,003,112</span>',
'<span class="hi">12:01:12 flow src=41[.]203[.]88[.]7       dst=203[.]0[.]113[.]10 bytes=880,412</span>',
'12:01:12 flow src=203[.]0[.]113[.]25       dst=203[.]0[.]113[.]10 bytes=52,100 (local)',
'<span class="hi">12:01:13 flow src=190[.]44[.]12[.]90      dst=203[.]0[.]113[.]10 bytes=1,777,004</span>',
'<span class="hi">12:01:13 flow src=112[.]65[.]3[.]44       dst=203[.]0[.]113[.]10 bytes=2,451,880</span>',
'12:01:14 IDS alert: traffic pattern "volumetric flood" confidence 97%',
'<span class="hi">12:01:14 flow src=45[.]61[.]188[.]3       dst=203[.]0[.]113[.]10 bytes=1,004,220</span>',
'<span class="hi">12:01:15 flow src=14[.]192[.]7[.]66       dst=203[.]0[.]113[.]10 bytes=990,150</span>',
'12:01:15 summary: 4,312 unique sources in 60s, target 203[.]0[.]113[.]10 only'
],
question:'<p>What kind of attack is this, and why?</p>',
data:{opts:[
 {t:'A DoS — one attacker host flooding the portal IP',ok:false,note:'One source would be a plain DoS. Here there are 4,312 unique sources in one minute.'},
 {t:'A MAC flooding attack on the data-centre switch',ok:false,note:'MAC flooding is a Layer-2 attack inside a LAN. This traffic is arriving from the internet.'},
 {t:'A DDoS — thousands of sources flooding the portal IP',ok:true,note:'Thousands of independent sources against one target is the DDoS signature — usually a botnet.'},
 {t:'An evil twin harvesting logins on the portal SSID',ok:false,note:'An evil twin is a fake access point. Nothing here involves wireless.'}
]},
explain:{global:'<p>Many thousands of sources, one victim, one minute — this is a <b>DDoS</b>. The machines sending traffic are usually a <b>botnet</b>: ordinary infected devices taking orders from an attacker. A plain <b>DoS</b> comes from a single source, so its traffic is easy to block. A DDoS hides among thousands of addresses, which is why it needs upstream filtering, rate limiting or a scrubbing service.</p>',per:{}},
hints:['Count how many different source addresses hit the same destination in one minute.','One source means DoS. Thousands of sources mean D___S.']});

/* ---- M2 — availability vs interception buckets (drag & drop) ---- */
EX({id:'M2',th:0,type:'dnd',pts:8,kw:['SYN flood','ICMP flood','amplification','slowloris (application layer)','ARP poisoning','SSL stripping','evil twin','DNS spoofing'],
title:'Sort the attacks: break it or read it',
scenario:'<p>A junior analyst pinned eight attack cards on a whiteboard but mixed up two families. One family makes a service <b>unavailable</b>. The other family lets the attacker <b>read or change</b> traffic that is not theirs.</p>',
question:'<p>Drag every card into the right family.</p>',
data:{
 cats:[{id:'c1',t:'Availability attacks (make it go down)'},{id:'c2',t:'Interception attacks (read or alter traffic)'}],
 items:[
  {id:'i1',t:'SYN flood',cat:'c1',note:'Half-open TCP connections exhaust the server — a classic DoS.'},
  {id:'i2',t:'ICMP flood',cat:'c1',note:'Echo-request storm saturating bandwidth — availability.'},
  {id:'i3',t:'DNS amplification',cat:'c1',note:'Small queries produce huge replies that bury the victim — availability.'},
  {id:'i4',t:'Slowloris',cat:'c1',note:'Incomplete HTTP requests hold connections open — availability at the application layer.'},
  {id:'i5',t:'ARP poisoning',cat:'c2',note:'Poisoned ARP caches put the attacker on the traffic path — interception.'},
  {id:'i6',t:'SSL stripping',cat:'c2',note:'Downgrading HTTPS to HTTP so logins are readable — interception.'},
  {id:'i7',t:'Evil twin',cat:'c2',note:'A fake access point that captures what clients send — interception.'},
  {id:'i8',t:'DNS spoofing',cat:'c2',note:'False name-to-IP answers steer victims to the attacker — interception.'}
 ]},
explain:{global:'<p>Ask one question for each card: does the attack <b>stop</b> the service, or does it <b>sit in the middle</b> of the traffic? Floods and connection-exhaustion tricks stop services. ARP poisoning, SSL stripping, fake access points and forged DNS answers all put the attacker where the data flows, so they can read or change it.</p>',per:{
 i1:'SYN flood: thousands of half-open TCP connections starve the server. It is a DoS technique.',
 i2:'ICMP flood: raw echo-request traffic saturates a link. Pure availability attack.',
 i3:'DNS amplification: a 60-byte question gets a 4,000-byte answer aimed at the victim. Availability.',
 i4:'Slowloris: the attacker sends headers slowly and never finishes requests. Availability, at the application layer.',
 i5:'ARP poisoning: forged ARP replies place the attacker between victims and the gateway. Interception (an on-path position).',
 i6:'SSL stripping: forces plain HTTP so passwords cross the network in the clear. Interception.',
 i7:'Evil twin: clients connect to the attacker’s access point and send everything there. Interception.',
 i8:'DNS spoofing: forged answers steer victims to attacker servers. Interception.'}},
hints:['Two cards mention flooding — floods never read data, they only drown it.','If the attack ends with the attacker seeing your data, it belongs in the interception family.']});

/* ---- M3 — single-source SYN flood (logview + single choice) ---- */
EX({id:'M3',th:0,type:'qcm',pts:2,kw:['SYN flood','DoS','rate limiting'],
title:'Half-open connections on the web tier',
scenario:'<p>The firewall dashboard shows the web tier slowing down. All flows come from one address: 198[.]51[.]100[.]77. Each flow to 203[.]0[.]113[.]10:443 shows a SYN from the source and never a completed handshake.</p>',
logs:[
'12:20:01 tcp src=198[.]51[.]100[.]77:51002 dst=203[.]0[.]113[.]10:443 flags=SYN',
'12:20:01 tcp src=198[.]51[.]100[.]77:51003 dst=203[.]0[.]113[.]10:443 flags=SYN',
'12:20:02 tcp src=198[.]51[.]100[.]77:51004 dst=203[.]0[.]113[.]10:443 flags=SYN',
'12:20:02 firewall: half-open connection count 1,900 (limit 2,048)',
'12:20:03 tcp src=198[.]51[.]100[.]77:51005 dst=203[.]0[.]113[.]10:443 flags=SYN',
'12:20:03 tcp src=198[.]51[.]100[.]77:51006 dst=203[.]0[.]113[.]10:443 flags=SYN',
'12:20:04 tcp src=198[.]51[.]100[.]77:51007 dst=203[.]0[.]113[.]10:443 flags=SYN',
'12:20:04 firewall: no ACK observed for any flow from 198[.]51[.]100[.]77'
],
question:'<p>What is happening, and what is the best first move on the firewall?</p>',
data:{opts:[
 {t:'A DNS amplification attack — block outbound UDP 53',ok:false,note:'This is TCP 443, not UDP 53, and the attack sends requests at the victim instead of replies.'},
 {t:'A SYN flood — enable SYN cookies and rate-limit new SYNs',ok:true,note:'Half-open SYNs from one source are a SYN flood. SYN cookies keep the connection table clean.'},
 {t:'An ARP poisoning attempt — enable Dynamic ARP Inspection',ok:false,note:'DAI protects a LAN from forged ARP. These flows cross the firewall from outside.'},
 {t:'A rogue DHCP server — enable DHCP snooping on VLAN 1',ok:false,note:'DHCP snooping guards lease offers inside the LAN. Nothing here relates to DHCP.'}
]},
explain:{global:'<p>A <b>SYN flood</b> sends SYNs but never finishes the three-way handshake. Every half-open connection holds memory on the server, and the table fills up until real users are locked out — that is a classic <b>DoS</b>. <b>SYN cookies</b> (or a SYN proxy) let the firewall answer first and only pass on connections that complete, while rate limiting caps how fast one source may open connections.</p>',per:{}},
hints:['Look at the TCP flags: SYN goes out, ACK never comes back.','The mitigation shares its name with the attack: S___ cookies.']});

/* ---- M4 — botnet report cloze (fill) ---- */
EX({id:'M4',th:0,type:'fill',pts:4,kw:['botnet','command-and-control','reflection','amplification'],
title:'Finish the incident report',
scenario:'<p>Your manager asks you to finish the draft report on last night’s attack before the morning review.</p>',
question:'<p>Drag the right term into each blank. Two bank words are distractors.</p>',
data:{
 text:'Thousands of infected home routers took part in the attack. Each infected machine is called a {{0}}. All of them received instructions from one {{1}} server on the internet. The attackers also sent small DNS queries that carried the victim’s address as their source, so DNS servers sent their much bigger replies to the victim. Sending traffic to a third party this way is called a {{2}} attack, and the growth from small query to large reply is called {{3}}.',
 slots:[null,null,null,null],
 ans:['botnet','command-and-control','reflected','amplification'],
 bank:['botnet','command-and-control','reflected','amplification','pharming','tailgating']},
explain:{global:'<p>A <b>botnet</b> is an army of infected devices. Their orders come from a <b>command-and-control</b> (C2) server. In a <b>reflected</b> attack the victim’s address is forged as the source, so third-party servers send their answers to the victim. When the answers are much bigger than the questions, that is <b>amplification</b> — a small attack turns into a huge flood.</p>',per:{
 s0:'Infected machines in an attacker’s army are bots; together they form a botnet.',
 s1:'The server that sends orders to the bots is the command-and-control (C2) server.',
 s2:'Because the replies go to the victim, not to the sender, the attack is reflected.',
 s3:'The size jump between query and reply is amplification. Pharming is fake DNS, and tailgating is walking through a door — neither fits.'}},
hints:['The victim never contacted the DNS servers — the attackers did, with a faked source address.','Pharming is a DNS attack and tailgating is a door problem; the report is about floods.']});

/* ---- M5 — signature → attack (match) ---- */
EX({id:'M5',th:1,type:'match',pts:5,kw:['MAC flooding','CAM table','double tagging','rogue DHCP server','ARP poisoning','evil twin'],
title:'Match the symptom to the attack',
scenario:'<p>Five tickets landed in the queue at once. Each one describes one observable symptom from a different part of the network.</p>',
question:'<p>Match every symptom to the attack that produces it.</p>',
data:{
 pairs:[
  {l:'The switch CAM table fills with thousands of fake MACs; the switch floods frames to all ports',r:'MAC flooding',note:'A CAM overflow forces the switch into hub-like flooding so the attacker can sniff traffic.'},
  {l:'Frames arrive carrying two 802.1Q tags; the inner tag points at another VLAN',r:'VLAN double tagging',note:'A second tag smuggles frames into a VLAN the attacker should never reach.'},
  {l:'Users suddenly receive gateway 10[.]66[.]0[.]1 and unknown DNS servers',r:'Rogue DHCP server',note:'Leases nobody configured come from a fake DHCP server on the network.'},
  {l:'Many hosts show the default gateway’s IP mapped to one brand-new MAC address',r:'ARP poisoning',note:'One MAC claiming the gateway IP on many hosts is forged ARP at work.'},
  {l:'The office SSID appears with a stronger signal and a different radio MAC',r:'Evil twin',note:'A clone of your SSID with better signal is a fake access point waiting for clients.'}
 ]},
explain:{global:'<p>Each Layer-2 attack leaves a different fingerprint. <b>MAC flooding</b> overflows the <b>CAM table</b> (the switch’s MAC address list) so the switch floods traffic. <b>Double tagging</b> wraps a frame in a second VLAN tag to hop VLANs. A <b>rogue DHCP server</b> hands out leases that point victims at the attacker. <b>ARP poisoning</b> rewrites the gateway’s MAC in victims’ caches. An <b>evil twin</b> is a fake access point cloning your SSID.</p>',per:{}},
hints:['Two symptoms involve addresses the network never handed out — one on wires, one over the air.','The CAM table belongs to the switch; ARP tables belong to hosts.']});

/* ---- M6 — spot the phishing red flags (flags) ---- */
EX({id:'M6',th:4,type:'flags',pts:5,kw:['phishing','lookalike domain','urgency','generic greeting'],
title:'Flag the phishing indicators',
scenario:'<p>A user forwarded this mail to the security mailbox. Click every element that is a phishing indicator. Some clickable items are perfectly normal — do not flag those.</p>',
question:'<p>How many red flags can you find? Click each one in the mail below.</p>',
artifact:'<span class="fl">From: IT Helpdesk &lt;support@payro11-portal[.]com&gt;</span>\n<span class="fl">To: all-staff@corp.example</span>\n<span class="fl">Subject: URGENT — mailbox closure in 2 hours!!</span>\n\n<span class="fl">Dear employee,</span>\n\n<span class="fl">Your password will expire in 2 hours.</span> Click <span class="fl">hxxp://payro11-portal[.]com/reset</span>\nright now or <span class="fl">you will LOSE ACCESS to your email forever</span>.\n\nThank you,\nIT Support Team\n<span class="fl">Sent from my iPhone</span>',
data:{flags:[
 {t:'sender: support@payro11-portal[.]com',f:true,note:'The sender domain is a lookalike: payro11 instead of payroll. Real IT mail would come from the company domain.'},
 {t:'To: all-staff@corp.example',f:false,note:'An internal distribution list is normal for company-wide notices.'},
 {t:'Subject: URGENT — mailbox closure in 2 hours!!',f:true,note:'Manufactured urgency and double exclamation marks are pressure tactics.'},
 {t:'greeting: Dear employee,',f:true,note:'A generic greeting means the sender does not actually know you — mass phishing behaviour.'},
 {t:'your password will expire in 2 hours',f:false,note:'Password expiry alone is a routine statement, not an indicator.'},
 {t:'link: hxxp://payro11-portal[.]com/reset',f:true,note:'The link points at the lookalike domain, not the corporate portal. The hxxp spelling is the defanged form of a link.'},
 {t:'LOSE ACCESS to your email forever',f:true,note:'Fear and threats push you to act before thinking — a classic social-engineering lever.'},
 {t:'Sent from my iPhone',f:false,note:'A mobile mail signature is common and harmless.'}
]},
explain:{global:'<p>This mail shows the five tells of <b>phishing</b>: a lookalike sender domain, manufactured urgency, a generic greeting, a link to a domain that is not yours, and a threat. Real IT messages rarely need you to panic. Check the actual sender domain and hover over links before clicking anything.</p>',per:{}},
hints:['Compare the sender domain and the link domain letter by letter with the real company domain.','Normal elements: the internal recipient list, a plain password-expiry line, and a mail signature.']});

/* ---- M7 — tcpdump ARP (terminal) ---- */
EX({id:'M7',th:2,type:'terminal',pts:3,kw:['ARP poisoning','gratuitous ARP','tcpdump'],
title:'Capture ARP traffic on the jump host',
scenario:'<p>Users on VLAN 20 report brief connection drops. You are on the monitoring jump host, which sits in the same VLAN. You suspect ARP poisoning and want to see the ARP packets live.</p>',
question:'<p>Use a <b>tcpdump</b> command to capture <b>ARP</b> traffic on interface <b>eth0</b> with verbose output (-v). Type the command and press Check.</p>',
data:{ps:'analyst@jump-host:~$',ph:'type a command and press Check',
 req:['tcpdump','arp','eth0'],accept:'',forbid:['sudo rm'],
 banner:'Fake shell — the command you type is checked, not executed. Type addresses with normal dots.',
 sampleOut:'tcpdump: listening on eth0, link-type EN10MB\n14:02:31.882 ARP, Reply 10[.]20[.]5[.]1 is-at aa:bb:cc:11:22:33, length 28\n14:02:31.995 ARP, Reply 10[.]20[.]5[.]1 is-at aa:bb:cc:d9:41:07, length 28\n14:02:32.101 ARP, Reply 10[.]20[.]5[.]1 is-at aa:bb:cc:d9:41:07, length 28\n→ the gateway IP is claimed by TWO different MAC addresses',
 sol:'tcpdump -i eth0 -v arp'},
explain:{global:'<p>The capture shows two different MAC addresses answering for the <b>same IP</b> (10[.]20[.]5[.]1, the gateway). That is <b>ARP poisoning</b>: the attacker floods <b>gratuitous ARP</b> replies — announcements nobody asked for — so every host sends its traffic to the attacker, who relays it onward: an <b>on-path</b> position. tcpdump with <span class="mono">-i</span> chooses the interface, and the filter word <span class="mono">arp</span> keeps only ARP packets.</p>',per:{cmd:'Accepted syntax: tcpdump -i eth0 -v arp. Any flag order works, but tcpdump, arp and eth0 must all appear.'}},
hints:['tcpdump takes the interface with -i and the protocol as a filter word at the end.','Full shape: tcpdump -i eth0 -v arp.']});

/* ---- M8 — rogue device walk-through (branch) ---- */
EX({id:'M8',th:3,type:'branch',pts:3,kw:['rogue devices','port security','802.1X / NAC'],
title:'Unknown device in Conference Room 3',
scenario:'<p>Morning walk-through. A small grey laptop is plugged into the wall port in Conference Room 3. It is not in the asset inventory, and nobody in the room knows whose it is.</p>',
question:'<p>Decide each step of the response.</p>',
data:{steps:[
 {t:'The device is live on the network. What do you do first?',ch:[
   {t:'Disable the switch port and open a ticket with the asset team',ok:true,out:'The port is shut. Whatever the device is, it can no longer reach the network while you investigate.'},
   {t:'Leave it alone — someone probably plugged in a personal laptop',ok:false,out:'The device keeps running for hours. If it is a rogue device, it may now be scanning or sniffing the VLAN.'},
   {t:'Scan the whole VLAN from your desk to see what it is',ok:false,out:'Scanning from your desk alerts a watchful attacker and touches systems you have no reason to probe. Shut the port first.'}]},
 {t:'NAC shows the device failed its posture check and has no 802.1X credentials. Next?',ch:[
   {t:'Trace the port to the wall plate, label it, and check room bookings for the last users',ok:true,out:'You now have a physical trail and a short suspect list — normal, careful evidence work.'},
   {t:'Enable trunk negotiation on that port to see what the device negotiates',ok:false,out:'Enabling trunking is exactly what a VLAN-hopping attacker hopes for. You just widened the attack.'},
   {t:'Whitelist the device MAC so it can boot and identify itself',ok:false,out:'You just let an unknown device onto the network to be helpful. Whitelisting belongs to the asset owner, not to the responder.'}]},
 {t:'Leadership asks how to stop this from recurring. Your answer?',ch:[
   {t:'Roll out 802.1X network access control so only authenticated devices get onto ports',ok:true,out:'With 802.1X, an unknown laptop fails authentication and the port stays closed. This fixes the class of problem.'},
   {t:'Set every user port to dynamic auto so they negotiate safely',ok:false,out:'Dynamic auto still negotiates trunks — it invites switch spoofing, it does not stop rogue devices.'},
   {t:'Email all staff asking them not to plug in unknown devices',ok:false,out:'Awareness helps, but policy alone does not enforce anything at the port. Technical control wins here.'}]}
]},
explain:{global:'<p>An unknown device on a live port is a potential <b>rogue device</b>. The safe sequence is: <b>contain</b> (shut the port), <b>investigate</b> (trace, check bookings, asset data), then <b>fix the class of problem</b> with <b>802.1X</b>/NAC so every device must authenticate before the port passes traffic. Port security limits MACs per port, but 802.1X is what actually keeps unapproved machines off the network.</p>',per:{
 b0:'Containment comes first: a shut port stops everything the device could do.',
 b1:'Investigation means gathering physical and inventory facts — never re-opening the network to the suspect device.',
 b2:'Only 802.1X/NAC stops unknown devices by default. Negotiation settings and emails do not authenticate anything.'}},
hints:['What stops an unknown device from doing anything at all, in one action?','Shut first, then investigate, then make the network reject unknown devices by design.']});

/* ---- M9 — reflection chain (order) ---- */
EX({id:'M9',th:0,type:'order',pts:5,kw:['DDoS','botnet','reflection','amplification','rate limiting'],
title:'Rebuild the DDoS attack chain',
scenario:'<p>After the incident, you must present the attack chain to management — in the order it really happened.</p>',
question:'<p>Put the five steps in the correct order.</p>',
data:{items:[
 'The botnet herder wakes 20,000 infected machines and points them at open DNS resolvers',
 'Each bot sends a small DNS query with a spoofed source address — the victim’s IP',
 'The resolvers reply with large answers, all directed at the victim',
 'The victim’s internet link fills with reply traffic it never asked for',
 'The ISP applies rate limiting and scrubs the flood upstream to restore service'
],per:{
 p0:'The chain starts with the botnet receiving its orders.',
 p1:'The bots then fire the small spoofed queries — reflection begins.',
 p2:'The resolvers answer to the faked source, which is the victim.',
 p3:'Only now does the victim feel the impact: a link full of unwanted replies.',
 p4:'Mitigation ends the story: filter and rate-limit upstream, close to the source.'}},
explain:{global:'<p>A <b>reflected, amplified DDoS</b> runs in one direction: botnet receives orders → bots send small queries with the <b>victim’s forged source IP</b> → third-party servers answer the victim → the victim’s link drowns in replies. The fix works in the same direction but backwards for the attacker: <b>rate limiting and scrubbing</b> upstream, plus closing the open resolvers so they cannot be used for reflection again.</p>',per:{}},
hints:['Nothing can be sent before the botnet receives its orders.','The victim is hit by replies — so the spoofed queries must come first.']});

/* ---- M10 — DTP misconfig (spot, artifact + single choice) ---- */
EX({id:'M10',th:1,type:'qcm',pts:2,kw:['switch spoofing','VLAN hopping','DTP','native VLAN'],
title:'Find the VLAN-hopping hole',
scenario:'<p>You are hardening an access switch. An attacker could plug a laptop into user port Gi0/2 and run a tool that speaks trunk negotiation.</p>',
artifact:'interface GigabitEthernet0/2\n description user-port\n <span class="hi">switchport mode dynamic auto</span>\n switchport access vlan 10\n!\ninterface GigabitEthernet0/24\n description uplink\n switchport mode trunk\n switchport trunk native vlan 1\n switchport trunk allowed vlan 10,20',
question:'<p>What mistake makes switch spoofing possible on Gi0/2?</p>',
data:{opts:[
 {t:'The access VLAN is 10 rather than the default VLAN 1',ok:false,note:'Using a real user VLAN for access ports is normal; VLAN 1 as access would be worse.'},
 {t:'The uplink trunk still runs with native VLAN 1',ok:false,note:'A default native VLAN is bad hygiene for double tagging, but the question is about Gi0/2 negotiating a trunk.'},
 {t:'The port has no description line configured',ok:false,note:'Descriptions help documentation only; they change no behaviour.'},
 {t:'DTP negotiation is still enabled (dynamic auto)',ok:true,note:'A port set to dynamic auto will negotiate trunking with anyone who asks — that is switch spoofing.'}
]},
explain:{global:'<p><b>Dynamic auto</b> means the port is willing to become a trunk if the neighbour negotiates it. The attacker’s laptop negotiates, becomes a "switch", and can now see or send traffic for many VLANs — <b>switch spoofing</b>, the simplest form of <b>VLAN hopping</b>. The fix is <span class="mono">switchport mode access</span> plus <span class="mono">switchport nonegotiate</span>, which turns off DTP (Dynamic Trunking Protocol) completely.</p>',per:{}},
hints:['Which line lets the port change its role after talking to a neighbour?','DTP stands for Dynamic Trunking Protocol — "dynamic auto" is its negotiation mode.']});
/* ===== MEDIUM exam — exercises 11-20 ===== */

/* ---- M11 — DNS cache poisoning (logview + single choice) ---- */
EX({id:'M11',th:2,type:'qcm',pts:2,kw:['DNS poisoning','DNS cache poisoning'],
title:'Users land on the wrong supplier portal',
scenario:'<p>Several users report that the supplier portal shows a login page that looks slightly "off". The corporate resolver’s query log is below. The portal’s true address is 203[.]0[.]113[.]53.</p>',
logs:[
'12:44:01 query supplier-portal.corp.example A → cached answer 203[.]0[.]113[.]53 (TTL 3600)',
'12:44:02 query supplier-portal.corp.example A → <span class="hi">cached answer 198[.]51[.]100[.]23 (TTL 86400)</span>',
'12:44:02 resolver: answer accepted from non-authoritative source 198[.]51[.]100[.]9:53',
'12:44:03 query supplier-portal.corp.example A → cached answer 198[.]51[.]100[.]23 (TTL 86400)',
'12:45:10 auth-server check: authoritative server holds only 203[.]0[.]113[.]53',
'12:45:11 resolver: forged record found in cache for supplier-portal.corp.example',
'12:45:12 resolver: cache purge requested by admin',
'12:45:13 query supplier-portal.corp.example A → cached answer 203[.]0[.]113[.]53 (TTL 3600)'
],
question:'<p>What happened on the resolver?</p>',
data:{opts:[
 {t:'DNS cache poisoning — a forged answer entered the cache',ok:true,note:'An answer from a non-authoritative source replaced the real record. That is cache poisoning.'},
 {t:'A DNSSEC validation failure on the authoritative side',ok:false,note:'DNSSEC is not in play here — the resolver accepted an unsigned forged answer instead of failing it.'},
 {t:'A pharming attack launched through the users’ hosts files',ok:false,note:'The wrong answer is cached on the shared resolver, so many users are affected at once — not one edited hosts file.'},
 {t:'An evil twin access point re-routing the web traffic',ok:false,note:'The resolver log itself shows the forged record; no wireless device is involved.'}
]},
explain:{global:'<p>The resolver accepted a DNS answer that did not come from the authoritative server and cached it with a long TTL — that is <b>DNS cache poisoning</b> — the classic <b>DNS poisoning / spoofing</b> attack on a resolver. Every user of that resolver is then sent to the attacker’s address until the cache is purged. Defences: source-port and TXID randomisation, strict bailiwick checks, and <b>DNSSEC</b>, which signs records so forgeries fail validation.</p>',per:{}},
hints:['The resolver logged where each answer came from — compare the sources.','One record has a stranger TTL (86400) and comes from an address that is not the authoritative server.']});

/* ---- M12 — switch hardening checklist (fill) ---- */
EX({id:'M12',th:1,type:'fill',pts:5,kw:['DTP','native VLAN','DAI','DHCP snooping','port security'],
title:'Complete the switch hardening list',
scenario:'<p>The network team wrote a hardening checklist after a penetration test, but the terms are missing. Fill each blank with a term from the bank. Two bank terms are distractors.</p>',
question:'<p>Drag the right term into each blank.</p>',
data:{
 text:'Stop trunk negotiation on user ports with "switchport nonegotiate" — this disables {{0}} completely. Move the trunk {{1}} VLAN to an unused VLAN so double-tagged frames land harmlessly. Turn on {{2}} so ARP replies are checked against the DHCP snooping table. Turn on {{3}} so only the real server may hand out leases. Limit the number of MAC addresses per access port with {{4}} so a flooding tool cannot fill the CAM table.',
 slots:[null,null,null,null,null],
 ans:['DTP','native','Dynamic ARP Inspection','DHCP snooping','port security'],
 bank:['DTP','native','Dynamic ARP Inspection','DHCP snooping','port security','DNSSEC','WPA3']},
explain:{global:'<p>These five controls close the whole Layer-2 attack class: disabling <b>DTP</b> stops switch spoofing, moving the <b>native VLAN</b> breaks naive double tagging, <b>Dynamic ARP Inspection</b> drops forged ARP replies, <b>DHCP snooping</b> blocks fake DHCP servers, and <b>port security</b> caps MAC addresses so <b>MAC flooding</b> cannot overflow the CAM table.</p>',per:{
 s0:'DTP (Dynamic Trunking Protocol) is what negotiates trunks; nonegotiate turns it off.',
 s1:'Double tagging relies on the native VLAN — moving it to an unused VLAN breaks the hop.',
 s2:'Dynamic ARP Inspection validates every ARP reply against trusted bindings.',
 s3:'DHCP snooping treats only trusted ports as allowed to send offers.',
 s4:'Port security limits learned MACs per port. DNSSEC and WPA3 protect DNS and wireless — different layers.'}},
hints:['Three of the blanks protect wired ports; the remaining two are wireless and DNS defenses.','The first blank shares its initials with "Dynamic Trunking Protocol".']});

/* ---- M13 — spear phishing (pure QCM) ---- */
EX({id:'M13',th:4,type:'qcm',pts:2,kw:['spear phishing','phishing'],
title:'Which variant is this mail?',
scenario:'<p>The security mailbox received a forwarded message. It is addressed to one specific accounts clerk, uses her first name, mentions her real supplier names and this month’s exact invoice numbers, and asks her to "re-confirm bank details" on a linked page.</p>',
question:'<p>Which attack variant does this represent?</p>',
data:{opts:[
 {t:'Mass phishing sent to thousands of unknown recipients',ok:false,note:'Mass phishing uses generic greetings; this mail knows the victim’s suppliers and invoices.'},
 {t:'Whaling aimed at a chief executive and the board',ok:false,note:'Whaling targets executives. The victim here is an accounts clerk.'},
 {t:'Spear phishing — one target, real personal details',ok:true,note:'Personal details aimed at one victim define spear phishing, and they make it far more convincing.'},
 {t:'Smishing delivered over the SMS text channel',ok:false,note:'The message arrived by email with a link, not by SMS.'}
]},
explain:{global:'<p><b>Phishing</b> is mass mail to anyone. <b>Spear phishing</b> picks one victim and adds real, researched details — names, tickets, suppliers — to win trust. Because the details are genuine, spear phishing fools even careful people. Defences: verify payment changes through a second channel (a phone call to a known number), and train staff that "correct details" do not prove "real sender".</p>',per:{}},
hints:['Ask how many people were targeted and how personal the content is.','The mail quotes her real invoice numbers — no mass campaign knows those.']});

/* ---- M14 — technique → defense zones (drag & drop) ---- */
EX({id:'M14',th:4,type:'dnd',pts:6,kw:['shoulder surfing','privacy screen','dumpster diving','shredding','tailgating','mantrap'],
title:'Place each risk under its control',
scenario:'<p>Facilities asks which existing control actually mitigates which risk. Three controls are deployed: privacy screen filters, locked cross-cut shred bins, and an access control vestibule (mantrap) at reception.</p>',
question:'<p>Drag every risk description under the control that defeats it.</p>',
data:{
 cats:[{id:'c1',t:'Privacy screen filters'},{id:'c2',t:'Locked cross-cut shred bins'},{id:'c3',t:'Access control vestibule (mantrap)'}],
 items:[
  {id:'i1',t:'A stranger reads a colleague’s screen on the train',cat:'c1',note:'A privacy filter narrows the viewing angle, so side readers see a black screen.'},
  {id:'i2',t:'Visitors in the office glance at monitors from behind desks',cat:'c1',note:'Same lever as the train: stop shoulder surfing at the screen itself.'},
  {id:'i3',t:'Printed salary lists found intact in the outside bin',cat:'c2',note:'Cross-cut shredding makes paper reconstruction practically impossible — the answer to dumpster diving.'},
  {id:'i4',t:'Old customer forms left in recycling next to the printer',cat:'c2',note:'Paper with personal data must never reach open recycling; locked shred bins close that path.'},
  {id:'i5',t:'A stranger slips through the badge door behind an employee',cat:'c3',note:'Tailgating is defeated by a vestibule that admits exactly one badged person at a time.'},
  {id:'i6',t:'Two unbadged people walk in during the lunch rush',cat:'c3',note:'The mantrap holds the second person until they sign in — no piggybacking.'}
 ]},
explain:{global:'<p>Controls map to techniques: <b>shoulder surfing</b> dies at the screen (privacy filters), <b>dumpster diving</b> dies at the bin (cross-cut <b>shredding</b> in locked containers), and <b>tailgating</b> dies at the door (an <b>access control vestibule</b>/<b>mantrap</b> that lets one badged person through at a time). Matching the control to the technique is what auditors check.</p>',per:{}},
hints:['One control works on screens, one on paper, one on the door.','Tailgating is a door problem — no screen or shredder can stop it.']});

/* ---- M15 — phishing variants channels (match) ---- */
EX({id:'M15',th:4,type:'match',pts:5,kw:['phishing','smishing','vishing','whaling','spear phishing'],
title:'Name the channel of each attempt',
scenario:'<p>Five reports arrived in one hour, each through a different channel. The board wants the correct term for each.</p>',
question:'<p>Match each report to its attack name.</p>',
data:{
 pairs:[
  {l:'Bulk email to 5,000 customers: "your account is locked, click here"',r:'Phishing (mass email)',note:'High volume, generic content — the textbook phishing campaign.'},
  {l:'SMS to an employee: "parcel fee unpaid, pay 2.99 at this link"',r:'Smishing',note:'SMS + phishing = smishing; the bait arrives by text message.'},
  {l:'Phone call: "I am from your bank’s fraud team, read me the code we just sent"',r:'Vishing',note:'Voice + phishing = vishing; the attacker harvests one-time codes over the phone.'},
  {l:'Email to the CEO: "approve this transfer today — I am in a meeting"',r:'Whaling',note:'When the big fish (executives) is the target, it is whaling; the payoff is usually money transfer.'},
  {l:'Email to one engineer quoting his real service tickets and asking for his VPN login',r:'Spear phishing',note:'One named victim plus researched details — spear phishing.'}
 ]},
explain:{global:'<p>The channel names the attack: email = <b>phishing</b>, SMS = <b>smishing</b>, voice call = <b>vishing</b>. The target refines the name: executives = <b>whaling</b>, one researched individual = <b>spear phishing</b>. Reporting matters because each channel needs a different filter: mail gateways, SMS awareness, and phone verification procedures.</p>',per:{}},
hints:['Two names merge a channel with "phishing" — one for text messages, one for calls.','Who is targeted decides between spear phishing and whaling.']});

/* ---- M16 — evil twin on the WLC (logview + single choice) ---- */
EX({id:'M16',th:3,type:'qcm',pts:2,kw:['evil twin','rogue AP','WIPS'],
title:'Two radios, one SSID',
scenario:'<p>The wireless controller’s rogue-AP table has a new entry overnight. Corporate APs broadcast CORP-WiFi on channel 11. The new entry also broadcasts CORP-WiFi, but with an unknown vendor MAC and a much stronger signal near the lobby.</p>',
logs:[
'08:12:01 wlc: rogue AP detected bssid=00:d9:41:07:aa:11 ssid=CORP-WiFi ch=6 rssi=-41',
'08:12:01 wlc: known corporate AP bssid=00:1b:44:11:3a:b7 ssid=CORP-WiFi ch=11 rssi=-60 (lobby)',
'08:12:02 wlc: rogue OUI 00:d9:41 not in vendor allow-list',
'08:15:34 client klm-42 roamed: bssid 00:1b:44:11:3a:b7 → 00:d9:41:07:aa:11',
'08:15:35 client klm-42 802.1X auth FAILED on 00:d9:41:07:aa:11',
'08:16:02 wips: classified "evil twin" (SSID match, different BSSID, beacon flood)',
'08:16:40 client klm-42 captive portal page served from 10[.]99[.]0[.]1'
],
question:'<p>What is the new entry, and what should happen now?</p>',
data:{opts:[
 {t:'A neighbour’s AP on an overlapping channel — ignore it',ok:false,note:'A neighbour would not clone your exact SSID or capture your clients into a captive portal.'},
 {t:'An evil twin — contain it with WIPS and steer clients back',ok:true,note:'Same SSID, different BSSID, stronger signal: a fake AP harvesting clients. Contain and warn.'},
 {t:'A new corporate mesh node that needs a firmware update',ok:false,note:'Mesh nodes appear in the allow-list and pass 802.1X; this one failed authentication and is unknown.'},
 {t:'A rogue DHCP server operating on the wireless VLAN',ok:false,note:'DHCP hands out addresses; this device is a fake access point broadcasting beacons.'}
]},
explain:{global:'<p>An <b>evil twin</b> is a rogue AP (rogue access point) that copies a real SSID and out-shouts the real signal so clients connect to it. Giveaways in the log: same SSID, different BSSID, unknown vendor MAC, and clients failing 802.1X before being served a fake portal. A <b>WIPS</b> (wireless intrusion prevention system) detects and contains such APs; a physical <b>site survey</b> then locates the box itself.</p>',per:{}},
hints:['The corporate APs are known by their BSSIDs — what is different about the new radio?','Clients failed 802.1X and then saw a login page — who benefits from that page?']});

/* ---- M17 — on-path IR ordering (order) ---- */
EX({id:'M17',th:2,type:'order',pts:5,kw:['on-path attack','ARP poisoning','DAI','incident response'],
title:'Order the response to an on-path attack',
scenario:'<p>You confirmed ARP poisoning on VLAN 20: two hosts show the gateway IP at the attacker’s MAC, and the attacker was relaying traffic.</p>',
question:'<p>Put the five response actions in the order a good responder performs them.</p>',
data:{items:[
 'Confirm the scope: dump ARP tables on all VLAN 20 hosts and list who points at the wrong MAC',
 'Contain: isolate the affected hosts and block the attacker’s MAC at the switch port',
 'Collect evidence: save the ARP dumps, switch logs and Dynamic ARP Inspection drop counters',
 'Eradicate: clear every ARP cache and enable Dynamic ARP Inspection on the user VLANs',
 'Review: hunt for stolen session data and watch whether the attacker returns'
],per:{
 p0:'Detection comes first: know exactly who is poisoned before touching anything.',
 p1:'Containment stops ongoing theft without destroying evidence.',
 p2:'Evidence is collected while it is still in place — caches and counters are volatile.',
 p3:'Only then clean up: fresh ARP tables plus DAI stop the technique from working again.',
 p4:'Review closes the loop: what did the attacker see, and are they back?'}},
explain:{global:'<p>An <b>on-path attack</b> (the modern name for man-in-the-middle) built with <b>ARP poisoning</b> is handled like any incident, in order: detect the full scope, contain the attacker, preserve the volatile evidence (ARP tables!), then eradicate by clearing caches and enabling <b>Dynamic ARP Inspection</b>, and finally review what was exposed. Clearing caches before collecting evidence would destroy your proof.</p>',per:{}},
hints:['You cannot contain what you have not scoped, and you should not clean what you have not saved.','Detect → contain → collect → eradicate → review.']});

/* ---- M18 — DNS incident branch (branch) ---- */
EX({id:'M18',th:2,type:'branch',pts:3,kw:['DNS poisoning','DNSSEC','cache flush'],
title:'The portal that shows the wrong page',
scenario:'<p>Helpdesk reports that several users see a strange login page when they open the supplier portal. Other users see the correct page. You are the on-call network engineer.</p>',
question:'<p>Decide each step.</p>',
data:{steps:[
 {t:'Different users see different pages for the same name. Where do you look first?',ch:[
   {t:'Query your resolver and a trusted public resolver and compare the answers, then inspect the cache',ok:true,out:'Your resolver answers 198[.]51[.]100[.]23 while the trusted one answers 203[.]0[.]113[.]53 — you have a poisoned cache on your resolver.'},
   {t:'Reboot the reporting users’ laptops',ok:false,out:'The users who see the wrong page share one resolver; rebooting clients treats a server-side problem on the client side.'},
   {t:'Re-issue the portal’s TLS certificate',ok:false,out:'The certificate is not the problem — the name resolves to the wrong IP before any TLS handshake happens.'}]},
 {t:'The cache holds a forged record pointing at 198[.]51[.]100[.]23. Next move?',ch:[
   {t:'Purge the forged records and audit how a non-authoritative answer was accepted',ok:true,out:'Cache cleared and the audit shows the resolver accepted answers with matching TXID and port — randomisation was off.'},
   {t:'Raise the TTL on the forged record so clients cache the correct page longer',ok:false,out:'Raising a TTL on a poisoned record keeps the fraud alive longer — the opposite of what you want.'},
   {t:'Ask users to add the real IP to their hosts files',ok:false,out:'A hosts-file workaround hides the problem, breeds drift, and is a pharming pattern itself.'}]},
 {t:'Which upgrade makes forged answers detectable in the long term?',ch:[
   {t:'Enable DNSSEC validation on the resolvers',ok:true,out:'Signed zones fail validation when forged, so the resolver returns SERVFAIL instead of trusting the fake record.'},
   {t:'Move DNS from UDP 53 to UDP 5353',ok:false,out:'Changing ports does not authenticate answers; forged replies would simply follow the new port.'},
   {t:'Disable caching on the resolvers',ok:false,out:'No caching means heavy load and slow lookups for everyone, while poisoned upstream answers still flow through.'}]}
]},
explain:{global:'<p><b>DNS cache poisoning</b> puts forged records into a resolver’s cache, sending users to attacker servers. The safe path: verify against an independent resolver, flush the poisoned records, fix how the forgery was accepted (randomise TXID and source port), and adopt <b>DNSSEC</b> so forged answers fail validation. A one-host variant of fake DNS is called <b>pharming</b>.</p>',per:{
 b0:'Compare resolvers before changing anything — proof first.',
 b1:'Flush and audit; never lengthen the life of a forged record.',
 b2:'DNSSEC gives answers a verifiable signature; nothing else here authenticates DNS.'}},
hints:['Two resolvers, one question: do they answer with the same address?','The permanent fix makes forged answers detectable, not just rare.']});

/* ---- M19 — rogue DHCP trust (spot, artifact + single choice) ---- */
EX({id:'M19',th:1,type:'qcm',pts:2,kw:['rogue DHCP server','DHCP snooping','trusted port','DHCP starvation'],
title:'Snooping is on, but bad leases continue',
scenario:'<p>DHCP snooping was enabled on VLAN 10 yesterday. Users still receive leases with gateway 10[.]66[.]0[.]1 and a foreign DNS server.</p>',
artifact:'ip dhcp snooping\nip dhcp snooping vlan 10\n!\ninterface GigabitEthernet0/24\n description uplink-to-core\n! (no other snooping commands on this port)\n!\n%DHCP_SNOOPING-5: Offer from 10[.]66[.]0[.]5 received on UNTRUSTED port Gi0/7 — dropped\n%DHCP_SNOOPING-5: Offer from 10[.]66[.]0[.]5 received on UNTRUSTED port Gi0/7 — dropped',
question:'<p>The real server connects through the uplink. Users still get bad leases sometimes. What is missing?</p>',
data:{opts:[
 {t:'Snooping must also be enabled on VLAN 20 as well',ok:false,note:'VLAN 20 is not the one handing out bad leases; the symptom is on VLAN 10.'},
 {t:'Gi0/7 should be marked trusted to compare the offers',ok:false,note:'Trusting the attacker’s port is exactly what snooping exists to prevent.'},
 {t:'Snooping only works on trunk ports, not access ports',ok:false,note:'Snooping works on any port; trust is about which device you believe, not the port type.'},
 {t:'The uplink port must be marked as a trusted snooping port',ok:true,note:'Without "ip dhcp snooping trust" on the uplink, even the real server’s offers are filtered and some clients keep old bad leases.'}
]},
explain:{global:'<p><b>DHCP snooping</b> treats every port as untrusted by default: offers from untrusted ports (like the rogue server on Gi0/7) are dropped. The one missing piece is marking the path to the <b>real</b> DHCP server — the uplink — as <b>trusted</b>. The log proves the filter works; the trust line completes it. Snooping also feeds the binding table that <b>Dynamic ARP Inspection</b> uses, and its DISCOVER rate limiting blunts the <b>DHCP starvation</b> floods that often prepare a rogue-server attack.</p>',per:{}},
hints:['Snooping drops offers from untrusted ports — so which port may legally send offers?','The uplink has no trust configuration in the artifact.']});

/* ---- M20 — MAC flooding mitigations (multi-select QCM) ---- */
EX({id:'M20',th:1,type:'qmulti',pts:3,kw:['MAC flooding','port security','sticky MAC','802.1X'],
title:'Pick the real MAC-flooding defenses',
scenario:'<p>An attacker ran a MAC flooding tool against an access switch and the CAM table overflowed. The team proposes six actions; only three actually mitigate MAC flooding.</p>',
question:'<p>Select the three measures that directly mitigate CAM-table overflow.</p>',
data:{opts:[
 {t:'Set port-security violation mode to shutdown on overflow',ok:true,note:'When the MAC limit is exceeded, violation mode shutdown err-disables the port — the flood dies instantly.'},
 {t:'Enable DTP negotiation on all the access ports',ok:false,note:'DTP negotiation invites switch spoofing — it makes things worse, not better.'},
 {t:'Enable port security with a maximum MAC limit on access ports',ok:true,note:'A port that learns more MACs than allowed shuts down (or drops) — the flood dies at the port.'},
 {t:'Require 802.1X authentication before the port passes traffic',ok:false,note:'802.1X stops unauthorised devices entirely — a strong adjacent control, but the direct CAM-overflow mitigation is port security limits.'},
 {t:'Use sticky MAC learning so known devices bind to their ports',ok:true,note:'Sticky MAC pins the learned address to the config, so surprise MACs trigger violations.'},
 {t:'Disable aging so the CAM table keeps every learned MAC forever',ok:false,note:'A frozen, full table locks out legitimate users and does not stop the flood.'}
]},
explain:{global:'<p><b>MAC flooding</b> works by offering the switch thousands of fake source MACs until the <b>CAM table</b> is full, forcing the switch to flood frames. <b>Port security</b> with a MAC limit stops the overflow, <b>sticky MAC</b> binds legitimate addresses so anything new is a violation, and violation mode <b>shutdown</b> err-disables a port the moment a flood starts. Closing unused ports and 802.1X are valuable hardening moves against rogue devices, but they are not the specific countermeasure to CAM overflow.</p>',per:{}},
hints:['All three correct answers belong to the port-security feature family.','Ask of each option: does it limit or police how many MACs a port may learn?']});
/* ===== MEDIUM exam — exercises 21-30 ===== */

/* ---- M21 — nmap rogue service (terminal) ---- */
EX({id:'M21',th:3,type:'terminal',pts:3,kw:['rogue services','nmap','service detection'],
title:'Find the services the server really runs',
scenario:'<p>Change control says server 10[.]44[.]0[.]7 may run only a web stack. You are on the jump host and want an inventory of its open services, including version banners.</p>',
question:'<p>Use an <b>nmap</b> command with service/version detection (<b>-sV</b>) against 10[.]44[.]0[.]7. Type the command and press Check.</p>',
data:{ps:'analyst@jump-host:~$',ph:'type a command and press Check',
 req:['nmap','10[.]44[.]0[.]7','sV'],accept:'',forbid:[],
 banner:'Fake shell — the command you type is checked, not executed. Type addresses with normal dots.',
 sampleOut:'Starting Nmap 7.94\nPORT      STATE  SERVICE     VERSION\n22/tcp    open   ssh         OpenSSH 8.4p1\n80/tcp    open   http        nginx 1.24.0\n443/tcp   open   ssl/http    nginx 1.24.0\n31337/tcp open   elite       unknown banner "SHELL_BACKDOOR_v2"\nNmap done: 1 IP address (1 host up) scanned in 2.31s',
 sol:'nmap -sV 10[.]44[.]0[.]7'},
explain:{global:'<p>The scan reveals port 31337 with an unknown banner — a <b>rogue service</b> — one of the rogue services / rogue devices planted on hosts without approval, often a backdoor left by an attacker. <span class="mono">nmap -sV</span> probes each open port and reports the service and version, which is how you compare reality against the change-control baseline. Next steps: capture the process running on that port, isolate the host, and rebuild from a known-good image.</p>',per:{cmd:'Accepted shape: nmap -sV 10[.]44[.]0[.]7 — flags may appear anywhere in the command.'}},
hints:['The flag for version detection is two characters: -s and a letter.','Full shape: nmap -sV 10[.]44[.]0[.]7.']});

/* ---- M22 — attack → primary mitigation (drag & drop) ---- */
EX({id:'M22',th:2,type:'dnd',pts:6,kw:['DAI','DNSSEC','port security','DTP / nonegotiate','rate limiting','WIPS'],
title:'Hang each attack on its mitigation',
scenario:'<p>Audit finding: "mitigations are documented but mismatched". Six attack cards and six control cards need to be paired on the wall.</p>',
question:'<p>Drag each attack under the control that directly defeats it.</p>',
data:{
 cats:[{id:'c1',t:'Dynamic ARP Inspection'},{id:'c2',t:'DNSSEC validation'},{id:'c3',t:'Port security (MAC limits)'},{id:'c4',t:'switchport nonegotiate'},{id:'c5',t:'Rate limiting / upstream scrubbing'},{id:'c6',t:'WIPS containment'}],
 items:[
  {id:'i1',t:'ARP poisoning',cat:'c1',note:'DAI checks every ARP reply against the trusted binding table and drops forgeries.'},
  {id:'i2',t:'DNS cache poisoning',cat:'c2',note:'DNSSEC signs records, so forged answers fail validation and return SERVFAIL.'},
  {id:'i3',t:'MAC flooding',cat:'c3',note:'A MAC limit per port stops the CAM table from ever overflowing.'},
  {id:'i4',t:'Switch spoofing / VLAN hopping via trunk negotiation',cat:'c4',note:'nonegotiate disables DTP so the port can never negotiate into a trunk.'},
  {id:'i5',t:'Volumetric DDoS from the internet',cat:'c5',note:'Rate limiting and scrubbing shed the flood before it reaches the service.'},
  {id:'i6',t:'Rogue and evil-twin access points',cat:'c6',note:'WIPS detects and contains unauthorised radios by spoofing deauthentication and alerting.'}
 ]},
explain:{global:'<p>Every attack names its own antidote: forged ARP meets <b>Dynamic ARP Inspection</b>, forged DNS meets <b>DNSSEC</b>, CAM overflow meets <b>port security</b>, trunk negotiation meets <span class="mono">nonegotiate</span>, floods meet <b>rate limiting and scrubbing</b>, and unauthorised radios meet <b>WIPS</b>. Writing the pair "attack → control" is how you prove a control design actually covers the threat model.</p>',per:{}},
hints:['Two attacks are about fake identity (ARP, DNS) and two about local hardware limits (MACs, trunks).','The wireless card belongs with the wireless control.']});

/* ---- M23 — physical security policy (fill) ---- */
EX({id:'M23',th:4,type:'fill',pts:4,kw:['tailgating','mantrap','shredding','privacy screen'],
title:'Complete policy C-7',
scenario:'<p>The physical-security policy lost four terms during a document migration. Fill the blanks; two bank terms are distractors.</p>',
question:'<p>Drag the right term into each blank.</p>',
data:{
 text:'Doors must never be propped open, and anyone without a badge must wait at reception — this prevents {{0}}. Visitors pass through a {{1}}, which admits exactly one badged person at a time. Paper containing personal data goes into locked {{2}} bins and is never placed in open recycling. Monitors in public areas must use a {{3}} filter so people walking by cannot read the screen.',
 slots:[null,null,null,null],
 ans:['tailgating','mantrap (access control vestibule)','cross-cut shredding','privacy screen'],
 bank:['tailgating','mantrap (access control vestibule)','cross-cut shredding','privacy screen','smishing','vishing']},
explain:{global:'<p>Four physical and behavioural risks, four named controls: <b>tailgating</b> is stopped by badge discipline and a <b>mantrap</b> (access control vestibule) that lets one person through at a time; <b>dumpster diving</b> is starved by locked <b>cross-cut shredding</b> bins; <b>shoulder surfing</b> is blunted by <b>privacy screen</b> filters. Smishing and vishing are message-based attacks and have no place in this policy.</p>',per:{
 s0:'Following a badged person through the door without badging is tailgating.',
 s1:'The one-person-at-a-time door is the mantrap, also called an access control vestibule.',
 s2:'Locked shred bins feed a cross-cut shredder; open recycling feeds a dumpster diver.',
 s3:'The dark-angle filter on a monitor is a privacy screen.'}},
hints:['Two bank terms are phone- and message-based attacks — they do not belong to doors, bins or screens.','The blank that says "one badged person at a time" is describing a specific physical device.']});

/* ---- M24 — slowloris (logview + single choice) ---- */
EX({id:'M24',th:0,type:'qcm',pts:2,kw:['slowloris','application-layer DoS'],
title:'Web tier down, bandwidth normal',
scenario:'<p>The web tier is unresponsive, yet the link runs at only 11% capacity. The access log shows a pattern: many connections per client, requests that never finish their headers, and connections held open for minutes.</p>',
logs:[
'12:51:01 httpd: worker pool 250/250 busy',
'12:51:02 req 198[.]51[.]100[.]31 GET / — headers incomplete (age 240s)',
'12:51:02 req 198[.]51[.]100[.]31 GET / — headers incomplete (age 238s)',
'12:51:03 req 198[.]51[.]100[.]31 GET / — headers incomplete (age 235s)',
'12:51:03 req 198[.]51[.]100[.]44 GET / — headers incomplete (age 180s)',
'12:51:04 link utilisation 11% — no traffic surge',
'12:51:05 httpd: new connections queued (250 busy, 0 free)',
'12:51:06 req 198[.]51[.]100[.]44 GET / — partial header "X-a: b" appended'
],
question:'<p>Which attack matches this pattern?</p>',
data:{opts:[
 {t:'Slowloris — an application-layer DoS holding connections open',ok:true,note:'Few sources, tiny bandwidth, but every worker is pinned by a half-finished request. That is slowloris.'},
 {t:'A volumetric ICMP flood saturating the internet link',ok:false,note:'The link sits at 11% — a volumetric flood would show huge bandwidth, not worker exhaustion.'},
 {t:'A DNS amplification flood aimed at the public web tier',ok:false,note:'Amplification floods the pipe with UDP replies from DNS servers; this is slow, incomplete TCP traffic to one web service.'},
 {t:'An on-path attacker relaying the portal’s traffic',ok:false,note:'Nothing here shows interception; the server is simply starved of worker slots.'}
]},
explain:{global:'<p><b>Slowloris</b> is an <b>application-layer DoS</b>: the attacker opens many connections and drips request headers slowly, so each connection never completes. The web server keeps every worker busy waiting, and real users find the service down — while the network link looks almost idle. That is the signature: full connection table, tiny bandwidth. Fixes include request-header timeouts, connection limits per source, and a reverse proxy in front.</p>',per:{}},
hints:['Compare bandwidth (11%) with the worker pool (250/250 busy).','A flood drowns the pipe; this attack starves the application.']});

/* ---- M25 — vishing call (pure QCM) ---- */
EX({id:'M25',th:4,type:'qcm',pts:2,kw:['vishing','MFA codes'],
title:'The caller from "the bank"',
scenario:'<p>An employee phones the helpdesk, shaken: a caller claimed to be from the company bank’s fraud team, said three suspicious transfers were pending, and asked her to read out the 6-digit code that had just arrived by SMS "to stop the transfers". She had already read out four digits.</p>',
question:'<p>What is this attack called, and what must happen to that code?</p>',
data:{opts:[
 {t:'Smishing — block her phone number and wipe the device',ok:false,note:'The SMS itself was genuine; the attack arrived by voice call. Blocking her number punishes the victim.'},
 {t:'Whaling — escalate the case to the CEO’s office now',ok:false,note:'Whaling targets executives with tailored mail. This is a phone attack on a regular employee.'},
 {t:'Vishing — treat the code as compromised and revoke it',ok:true,note:'Voice phishing is vishing; the code is an MFA factor, so treat it as stolen and kill the session.'},
 {t:'Shoulder surfing — nothing to do, the code was only spoken',ok:false,note:'Codes read aloud to a stranger are captured just as surely as codes typed into a fake page.'}
]},
explain:{global:'<p>A trust-building phone call that harvests credentials or one-time codes is <b>vishing</b> (voice phishing). Multi-factor codes are secrets: the moment they are shared, they must be treated as compromised — revoke sessions, invalidate the code, reset credentials, and report the call so others are warned. No real fraud team needs your code to "stop a transfer".</p>',per:{}},
hints:['Which single word names phishing over the phone?','The moment a code is spoken to a stranger, assume the attacker owns it.']});

/* ---- M26 — traffic signatures (match) ---- */
EX({id:'M26',th:2,type:'match',pts:4,kw:['double tagging','ARP poisoning','ICMP flood','DNS amplification'],
title:'Read the signature, name the attack',
scenario:'<p>Four captures from the monitoring bus, four different attack families.</p>',
question:'<p>Match each capture line to the attack it proves.</p>',
data:{
 pairs:[
  {l:'Frame: [802.1Q VID 1][802.1Q VID 20][payload] — two tags in one frame',r:'VLAN double tagging',note:'The outer tag rides the native VLAN; the inner tag smuggles the frame into VLAN 20.'},
  {l:'ARP: 10[.]20[.]5[.]1 is-at 00:d9:41:07 — sent unsolicited to the whole VLAN, five times per second',r:'ARP poisoning',note:'Unsolicited (gratuitous) ARP replies claiming the gateway IP are a poisoning flood.'},
  {l:'Flows: one source, 14,000 ICMP echo requests in 10 seconds to one victim',r:'ICMP flood (DoS)',note:'An echo-request storm from one source is a plain ICMP flood — a denial-of-service attempt.'},
  {l:'Flows: 60-byte UDP queries out to DNS servers; 4,000-byte replies inbound to a host that never queried',r:'DNS amplification',note:'Small questions, giant answers to a third party — reflection with amplification.'}
 ]},
explain:{global:'<p>Signatures map cleanly to attacks: two VLAN tags = <b>double tagging</b> (VLAN hopping); unsolicited ARP claiming the gateway = <b>ARP poisoning</b>; a wall of echo requests = <b>ICMP flood</b>; tiny DNS queries with huge replies aimed elsewhere = <b>DNS amplification</b>. Reading captures at this level is the core skill behind fast triage.</p>',per:{}},
hints:['Count the tags on the first line; count who replies to whom on the last.','The ICMP line has one source and one destination — no reflection, no amplification.']});

/* ---- M27 — tailgating branch (branch) ---- */
EX({id:'M27',th:4,type:'branch',pts:3,kw:['tailgating','piggybacking','mantrap'],
title:'The door, the stranger, the policy',
scenario:'<p>You badge into the office at 08:40. Behind you, a person carrying two coffee cups and a laptop bag asks you to hold the door, smiling: "forgot my badge again, sorry!".</p>',
question:'<p>Decide each step.</p>',
data:{steps:[
 {t:'What do you do right now at the door?',ch:[
   {t:'Politely refuse, and point them to reception to sign in with ID',ok:true,out:'The person waits at reception. If they are legitimate, a two-minute check costs nothing; if not, you just stopped an intrusion.'},
   {t:'Hold the door — they look like they belong here',ok:false,out:'Looking like they belong is the entire technique. You were just tailgated, and the log shows only your badge entered.'},
   {t:'Let them in but note the time on a sticky note',ok:false,out:'Reporting after the fact does not undo the entry; the stranger is already inside the secure area.'}]},
 {t:'They insist: "I am from the vendor, late for the 9:00 meeting." Next?',ch:[
   {t:'Escort them to reception and verify with your meeting contact before any further access',ok:true,out:'Reception confirms the vendor visit, issues a visitor badge, and an escort takes them in. Policy kept, meeting saved.'},
   {t:'Point at the meeting room and walk away',ok:false,out:'They now roam unsupervised with a laptop bag — the exact risk the escort rule exists to prevent.'},
   {t:'Ask them to badge in next time and move on',ok:false,out:'They still walked in this time. A rule that applies "next time" is not a control.'}]},
 {t:'The security manager asks which physical control stops this at the door itself. Your answer?',ch:[
   {t:'An access control vestibule (mantrap) that admits one badged person at a time',ok:true,out:'With a vestibule, the second person is held in the airlock until they authenticate — tailgating becomes impossible.'},
   {t:'A taller fence around the parking lot',ok:false,out:'The fence guards the car park, not the door where the piggybacking happened.'},
   {t:'More CCTV cameras over the entrance',ok:false,out:'Cameras record tailgating; they do not prevent it. Prevention needs the one-person vestibule.'}]}
]},
explain:{global:'<p>Following a badged person through a controlled door is <b>tailgating</b> (also called <b>piggybacking</b>). The human fix is a polite refusal plus verification at reception; the structural fix is an <b>access control vestibule</b> — a mantrap that admits exactly one authenticated person at a time. Cameras help investigations, but only the vestibule prevents the entry.</p>',per:{
 b0:'The polite refusal plus reception check costs nothing and stops the technique.',
 b1:'Visitors get in through reception, verification and escorting — never through your held door.',
 b2:'Only a one-person-at-a-time vestibule physically prevents tailgating; cameras merely record it.'}},
hints:['What would the attacker lose if everyone refused to hold doors?','Prevention happens at the door; recording happens on the ceiling.']});

/* ---- M28 — hosts-file pharming (spot, artifact + single choice) ---- */
EX({id:'M28',th:2,type:'qcm',pts:2,kw:['pharming','hosts file'],
title:'One user, one fake portal',
scenario:'<p>A single user reaches a fake supplier portal. Everyone else resolves the name correctly, and the corporate DNS cache is clean. You pull her workstation’s hosts file.</p>',
artifact:'# C:\\Windows\\System32\\drivers\\etc\\hosts\n10[.]0[.]0[.]53    dns.corp.example\n<span class="hi">203[.]0[.]113[.]53  supplier-portal.corp.example   # added 3 days ago</span>\n# end of file',
question:'<p>The real portal lives at 10[.]20[.]30[.]44. What does the highlighted line represent?</p>',
data:{opts:[
 {t:'DNS cache poisoning on the corporate resolver cache',ok:false,note:'Other users resolve correctly, so the shared resolver cache is fine — the tampering is local to this machine.'},
 {t:'Pharming — a poisoned local hosts file redirects her',ok:true,note:'A hosts entry overrides DNS for that user only. That is local pharming via a tampered hosts file.'},
 {t:'An evil twin access point capturing her wireless traffic',ok:false,note:'A hosts file entry redirects names before any wireless path matters; no AP is involved.'},
 {t:'ARP poisoning inside her local switch uplink port',ok:false,note:'Her traffic is not intercepted; her machine simply resolves the name to the wrong IP locally.'}
]},
explain:{global:'<p>When one machine alone resolves a name wrongly, check its <b>hosts file</b> first. An entry there overrides DNS for that machine — a small-scale <b>pharming</b> attack (fake DNS baked onto the host). Fix: remove the entry, scan for malware (something must have written it), and alert other users. Pharming at scale happens on resolvers; pharming per-host happens here.</p>',per:{}},
hints:['The comment says the line was added three days ago — by whom?','One user is affected: is the problem shared infrastructure or her machine?']});

/* ---- M29 — phishing response workflow (order) ---- */
EX({id:'M29',th:4,type:'order',pts:5,kw:['phishing','awareness training','incident response'],
title:'Order the phishing response',
scenario:'<p>A user reports a convincing payroll-themed phishing mail. You are the security analyst handling the mailbox.</p>',
question:'<p>Put the five actions in the correct order.</p>',
data:{items:[
 'Do not click or open anything — preserve the message exactly as received',
 'Use the report-phishing flow to send the full sample to the security team',
 'Block the sender domain and purge matching messages from all mailboxes',
 'Run a mailbox search to find anyone who clicked or submitted credentials',
 'Force password resets for affected users and refresh staff awareness training with this example'
],per:{
 p0:'First, do no harm: the sample must stay intact for analysis.',
 p1:'The sample then reaches the team through the reporting channel.',
 p2:'With sender and subject known, stop the spread: block and purge everywhere.',
 p3:'Now find the blast radius: who clicked, who typed credentials.',
 p4:'Finish with recovery and prevention: resets plus a fresh awareness lesson drawn from this real mail.'}},
explain:{global:'<p>Good <b>phishing</b> response is a pipeline: preserve the sample → report it → block and purge at scale → search for victims → reset and retrain. Skipping the mailbox search is the classic mistake: the visible report is rarely the only click. The final awareness step turns one incident into training material for the whole company.</p>',per:{}},
hints:['Anything that deletes or alters the mail too early destroys evidence.','Block first, hunt second, reset third.']});

/* ---- M30 — on-path position (pure QCM) ---- */
EX({id:'M30',th:2,type:'qcm',pts:2,kw:['on-path attack'],
title:'Name the attacker’s position',
scenario:'<p>Packet capture shows an employee’s session to the intranet passing through an unknown internal host that relays every packet and occasionally rewrites content before forwarding to the real server. The employee never left the office network.</p>',
question:'<p>What is this position of the attacker called?</p>',
data:{opts:[
 {t:'A distributed denial-of-service attack on the link',ok:false,note:'The employee’s traffic still flows — it is being read and altered, not drowned.'},
 {t:'A phishing campaign against the company employees',ok:false,note:'No message was sent; the compromise is happening on the wire between two legit endpoints.'},
 {t:'A rogue DHCP server lease on the office segment',ok:false,note:'A lease could steer traffic, but the observed capture shows active relay and rewriting of an existing session — the on-path pattern.'},
 {t:'An on-path attack (formerly man-in-the-middle)',ok:true,note:'The attacker sits between victim and server, relaying and altering traffic — the definition of on-path.'}
]},
explain:{global:'<p>An <b>on-path attack</b> — the current CompTIA name for man-in-the-middle — means the attacker’s host sits on the delivery path, relaying traffic between two parties who believe they talk to each other. On a LAN it is usually built with <b>ARP poisoning</b>; the attacker can then read sessions or strip TLS. Defences: DAI, encrypted transports, and certificate warnings taken seriously.</p>',per:{}},
hints:['Both endpoints think they talk to each other — but every packet takes a detour.','The old name for this position had three words: man-in-the-middle.']});
