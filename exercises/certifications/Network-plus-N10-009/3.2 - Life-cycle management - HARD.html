.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--badbg);border:1px solid var(--bad);color:var(--tx);border-radius:10px;padding:12px 18px;z-index:60;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.5)}

}

<script>
window.EXAM = [

/* ── H01 (in file position 1) ── slots bins: sanitisation matrix with near-misses */
{ id:'H03', t:'The sanitisation matrix: level for every medium', theme:'Decommissioning & sanitisation', kw:['data sanitisation','wiping','purging','destruction','cryptographic erase','degaussing','media sanitisation'],
  points:6, type:'slots', mode:'bins',
  scenario:`<p>The auditor walks the staging room at <b>Talon Media</b> where decommissioned media waits in crates. Each crate carries a sticky note describing the medium and its destination. Your sanitizer must pick the right level for every note: the three levels of media sanitisation. Overwriting is only trusted on healthy media; anything that cannot be verified is destroyed.</p>`,
  question:`<p>Assign every note to its correct sanitisation level. Each note has exactly one defensible level.</p>`,

    { k:'n1', html:'Healthy HDD from a domain controller, being reused by another internal department', aria:'Healthy HDD, internal reuse', why:'Stays inside the company on healthy media: a verified overwrite (clear) is proportionate.' },
    { k:'n2', html:'Self-encrypting SSD that must leave the organisation for an RMA', aria:'SED leaving the company', why:'A cryptographic erase (purge) destroys the keys — the drive leaves as unreadable metal.' },
    { k:'n3', html:'Magnetic LTO backup tapes at end of retention, being reused for new backups', aria:'LTO tapes to be reused', why:'Degaussing purges magnetic media cleanly so the tapes can be rewritten.' },
    { k:'n4', html:'Cracked HDD platter that cannot spin up, holds HR case files', aria:'Cracked platter with HR data', why:'No overwrite can be verified on dead media: destruction is the only guarantee.' },
    { k:'n5', html:'RAID disks moving from the retired SAN into the development lab (internal)', aria:'RAID disks to the dev lab', why:'Internal reuse on healthy media: clear (overwrite) with validation.' },
    { k:'n6', html:'Optical discs containing final tax records, destined for the skip', aria:'Optical discs with tax records', why:'Writable optical media cannot be reliably purged: destruction before disposal.' }
  ],
  slots:[
    { label:'CLEAR — overwrite + verify (media stays in company)', accept:['n1','n5'], ph:'drop note', aria:'Clear' },
    { label:'CLEAR — overwrite + verify (media stays in company)', accept:['n1','n5'], ph:'drop note', aria:'Clear' },
    { label:'PURGE — crypto erase / degauss (media survives)', accept:['n2','n3'], ph:'drop note', aria:'Purge' },
    { label:'PURGE — crypto erase / degauss (media survives)', accept:['n2','n3'], ph:'drop note', aria:'Purge' },
    { label:'DESTROY — shred / incinerate', accept:['n4','n6'], ph:'drop note', aria:'Destroy' },
    { label:'DESTROY — shred / incinerate', accept:['n4','n6'], ph:'drop note', aria:'Destroy' }
  ],
  hint:'Two notes stay in the company, two can be purged without harming the media, two cannot be trusted at all.',
  explain:`<p>NIST-style media sanitisation scales the action to the risk: clear (overwrite) for healthy media that stays under your control, purging (cryptographic erase, degaussing) for media that leaves your control but must survive, and destroy (shredding, incineration) for media that can neither be verified nor trusted — a cracked platter or simple optical discs. The two hard cases here are the SED, where the keys are the data, and the platter, where no verification is possible at all.</p>`,
  tip:'Ask: can I verify the action, and does the medium stay? Then pick clear, purge or destroy.' },

/* ── H02 (position 2) ── viewer + multi: ticket audit against policy */
{ id:'H05', t:'Audit the change tickets against policy SWM-04', theme:'Software management', kw:['change management','rollback','software validation','test environment','audit trail'],
  points:4, type:'choice', multi:true,
  scenario:`<p>Policy <b>SWM-04</b> says every software change ticket must contain ALL of: (1) test evidence from the test environment, (2) a rollback plan, (3) a post-deploy validation step. The export below shows last month’s tickets. Two of them violate the policy. Read all three columns for every row — compliant tickets sometimes look messy.</p>`,
  artifacts:[{ label:'Change ticket export — September', kind:'table', filter:true, body:
`<span class="hl-k">TICKET     SUMMARY                STAGING-TEST   ROLLBACK-PLAN   VALIDATION</span>
CHG-3295   switch firmware 8.1    yes            yes             post-check list done
CHG-3297   AP controller patch    <span class="hl-b">no — “vendor tested it”</span>   yes        planned
CHG-3301   firewall rule tidy-up  yes            <span class="hl-b">none (“too small to fail”)</span>  post-check done
CHG-3304   DNS server upgrade     yes            yes             post-check done
CHG-3306   NAC cert renewal       yes (screenshot attached)  yes  post-check done
CHG-3310   WLAN survey tool 2.3   yes            yes             post-check done
CHG-3312   core stack patch       yes            yes             post-check done
CHG-3318   printer queue update   yes            yes             post-check done
CHG-3321   UPS firmware           yes            yes             post-check done
CHG-3325   VPN client 5.1 rollout yes            yes             post-check done` }],
  question:`<p>Select the <b>2</b> tickets that violate policy SWM-04 — and note each one violates a DIFFERENT clause.</p>`,
  options:[
    { k:'A', html:'CHG-3304', note:'All three clauses present — compliant.' },
    { k:'B', html:'CHG-3297', note:'Staging column says “no” — clause 1 broken.' },
    { k:'C', html:'CHG-3318', note:'All three clauses present — compliant, merely unpretty.' },
    { k:'D', html:'CHG-3301', note:'Rollback column says “none” — clause 2 broken.' },
    { k:'E', html:'CHG-3325', note:'All three clauses present — compliant.' }
  ],
  correct:['B','D'],
  hint:'Read all three columns of all ten rows before answering. Some compliant tickets are deliberately unpretty.',
  explain:`<p>Reading all three policy columns line by line: CHG-3297 has no staging test (clause 1 broken) and CHG-3301 has no rollback plan (clause 2 broken) — the only two violations in the export. The distractor tickets look messy — screenshots as evidence, low-value changes — but every clause is present, and messy-but-complete is compliant. Column-wise reading beats pattern-matching on ticket style, which is the entire lesson of change audits.</p>`,
  tip:'Audit tables column-wise, not row-wise, and never answer before the last row.' },

/* ── H03 (position 3) ── QCM: bulletin dates reasoning */
{ id:'H01', t:'Budget year versus end of support', theme:'Hardware & vendor lifecycle', kw:['EOL','EOS','end of sale','final release','support contract','third-party support'],
  points:3, type:'choice', multi:false,
  scenario:`<p>The vendor lifecycle notice (product bulletin) for router model <b>NG-4100</b> states: EOL announcement 2026-01-15 · end of sale 2026-07-31 · final software release 9.4 shipped 2026-10 · end of support 2029-07-31. Your replacement budget is only approved for fiscal year <b>2027</b>. The asset team wants to know whether keeping the routers until then is acceptable.</p>`,
  question:`<p>Which statement is <b>true</b> for a replacement in 2027?</p>`,
  options:[
    { k:'A', html:'Support ends on the announcement date; the fleet is already unsupported.', note:'Announcements do not end anything — they start the exit clock.' },
    { k:'B', html:'Security patches continue until 2029-07-31, so 2027 stays supported.', note:'Correct — and support contracts cannot outlive that date either.' },
    { k:'C', html:'The final release 9.4 was the last fix ever, so 2027 is too late.', note:'“Final release” ends feature work; security fixes continue until end of support.' },
    { k:'D', html:'End of sale in 2026 already cut the fleet off from security patches.', note:'End of sale stops purchasing, not patching.' }
  ],
  correct:['B'],
  hint:'Which date on the bulletin is the one after which NO fix will ever arrive?',
  explain:`<p>The only date that matters for risk is end of support: 2029-07-31. Before that, the vendor keeps shipping security fixes for the 9.4 line and honouring contracts. End of sale (2026) only closes the shop window, and the “final release” note means no more new features — not the last patch. A 2027 replacement is therefore a planned, supported migration — the natural anchor for replacement planning — and the plan should simply not slip past mid-2029.</p>`,
  tip:'Bulletins list many dates; only EOS controls whether you still get fixes.' },

/* ── H04 (position 4) ── branch: the forgotten switch (dual perspective) */
{ id:'H06', t:'The switch that would not die', theme:'Decommissioning & sanitisation', kw:['port activation','decommissioning','location tracking','CMDB','decommissioning review','documentation'],
  points:5, type:'branch',
  scenario:`<p>During a site walk you find switch <b>br-sw09</b> racked, powered, its uplink blinking green. The CMDB says “decommissioned, 8 months ago”. Nothing else in the room is yours to touch. This exercise looks at the same finding twice: once as the defender, once as the attacker.</p>`,
  question:`<p>Walk the four steps. Steps 1–2 are the defender’s view, step 3 is the red-team view, step 4 is the process fix.</p>`,
  steps:[
    { q:'DEFENDER: What is the immediate risk of this state?',
      options:[
        { html:'A live, unmonitored network port that bypasses normal controls.', ok:true, fb:'Correct — the port forwards frames today, whatever the CMDB believes.' },
        { html:'Only wasted electricity and rack space.', ok:false, fb:'Power waste is real but trivial; the forwarding port is the actual exposure.' },
        { html:'No risk — the CMDB says decommissioned, and records are the truth.', ok:false, fb:'Reality always beats the record. The record is wrong precisely because nobody checked.' }
      ]},
    { q:'DEFENDER: First physical action, right now?',
      options:[
        { html:'Shut the uplink / pull the cable, then verify nothing legitimate is attached.', ok:true, fb:'Kill the exposure first, reconcile the records second.' },
        { html:'Update the CMDB and walk on.', ok:false, fb:'Editing the record while the port stays live documents an ongoing exposure instead of fixing it.' },
        { html:'Wait for the next maintenance window.', ok:false, fb:'A forgotten live port is not scheduled work — it is an incident-shaped hole.' }
      ]},
    { q:'RED TEAM: You are the attacker who just found br-sw09. What does it give you?',
      options:[
        { html:'A quiet foothold: plug in, get a network address, and work inside the perimeter unmonitored.', ok:true, fb:'Exactly why “forgotten active port” is a named risk — it is an insider’s door left open for outsiders.' },
        { html:'Nothing; switch ports always require authorisation.', ok:false, fb:'Unless port security or NAC was left on it — and decommissioned gear is exactly where such configs get forgotten too.' },
        { html:'Only the ability to read the switch banner.', ok:false, fb:'The uplink forwards traffic; the banner is the least of it.' }
      ]},
    { q:'PROCESS: What stops this from happening again?',
      options:[
        { html:'A decommissioning review with physical verification: ports confirmed dead, location tracked, record signed.', ok:true, fb:'Correct — process + physical check + records is the only durable fix.' },
        { html:'Blame whoever closed the ticket 8 months ago.', ok:false, fb:'Blame fixes nobody; the process let the ticket close without verification.' },
        { html:'Return br-sw09 to production as a spare.', ok:false, fb:'Recommissioning unsanitised, unmanaged gear creates a new problem, not a fix.' }
      ]}
  ],
  hint:'Reality over records, stop the bleeding before the paperwork, and fix the process — not the person.',
  explain:`<p>A device the CMDB calls dead but the network calls alive is a port activation failure: an unmonitored entry point that NAC or port security may or may not cover. The defender’s order is fixed — cut the link, then verify, then reconcile records. The red-team view explains why: an attacker treats a forgotten switch as a free foothold inside the perimeter. The durable fix is a decommissioning review that physically verifies ports and location before any ticket closes.</p>`,
  tip:'If the CMDB and the blinking LED disagree, the LED wins — then fix why they disagreed.' },

/* ── H05 (position 5) ── spot: firewall change snippet */
{ id:'H07', t:'Spot the mistakes in the firewall change', theme:'Software management', kw:['rollback','change management','maintenance window','software validation'],
  points:4, type:'spot',
  scenario:`<p>Below is the transcript of a firewall change performed at 02:00 by an external contractor. Three lines represent serious process violations. The firewall itself stayed up, which is why nobody noticed — until the audit.</p>`,
  question:`<p>Select the <b>3</b> faulty lines.</p>`,
  lines:[
    { html:'! CHG-4410: temporary migration rules, window 01:00–04:00', bad:false, why:'A windowed change with an ID is exactly what the policy wants to see.' },
    { html:'conf t', bad:false, why:'Entering configuration mode is neutral.' },
    { html:'ip access-list ext MIG-TMP', bad:false, why:'Naming temporary objects so they can be found and removed later is good practice.' },
    { html:'permit ip any any', bad:true, why:'A temporary rule must be scoped to the migration hosts. “Any any” opens the perimeter wider than the business asked for.' },
    { html:'deny ip any any log', bad:false, why:'Logging the denies is proper visibility.' },
    { html:'write memory', bad:false, why:'Saving is routine — the violation sits in what was saved, and in the lines below.' },
    { html:'! old config not backed up; rollback plan “we remember the old rules”', bad:true, why:'Memory is not a rollback plan. Without a saved prior config, recovery depends on recollection under pressure.' },
    { html:'! removal of MIG-TMP: “someone will get to it after the project”', bad:true, why:'Temporary rules need an owner and a removal date at creation time; “someone later” is how permanent holes are born.' },
    { html:'exit', bad:false, why:'Leaving configuration mode is neutral.' }
  ],
  hint:'One line is too generous, one line has no way back, one line never ends.',
  explain:`<p>The three violations are a trio every auditor knows: an unscoped temporary rule (permit ip any any), a “rollback plan” that lives in someone’s memory instead of a saved config, and a temporary object with no removal owner or date. Each turns a controlled change into standing risk. The fix costs minutes: scope the rule, save the prior config, and write the removal date into the ticket.</p>`,
  tip:'Temporary means scoped, backed up, and dated for removal — or it is not temporary.' },

/* ── H06 (position 6) ── order: senior response to an EOS notice */
{ id:'H02', t:'Order the senior response to an EOS notice', theme:'Hardware & vendor lifecycle', kw:['EOS','CMDB','risk acceptance','replacement planning','decommissioning'],
  points:5, type:'order',
  scenario:`<p>End-of-support notices for the branch router model just arrived. The junior suggestion is “order replacements today”. The senior engineer’s sequence is more deliberate — and its order is what the interview panel will test.</p>`,
  question:`<p>Put the six professional steps in order.</p>`,
  items:[
    { k:'p1', html:'Verify affected devices and firmware versions in the CMDB', t:'Verify scope in the CMDB', why:'You cannot size a response before knowing what is actually affected.' },
    { k:'p2', html:'Map each device’s exposure and dependencies', t:'Map exposure and dependencies', why:'A router behind three firewalls and one at the edge are different problems.' },
    { k:'p3', html:'Apply interim mitigations and document residual risk', t:'Mitigate and document risk', why:'Exposure reduction and monitoring bridge the gap while procurement moves.' },
    { k:'p4', html:'Submit the replacement plan and budget request', t:'Submit plan and budget', why:'With scope, exposure and mitigations known, the request becomes credible.' },
    { k:'p5', html:'Schedule and rehearse the migration with rollback before EOS', t:'Rehearse migration with rollback', why:'A rehearsed cutover before the deadline beats an emergency after it.' },
    { k:'p6', html:'Decommission, sanitise, and close the records', t:'Decommission and close records', why:'The life ends with sanitisation, certificates and honest documentation.' }
  ],
  hint:'Know → weigh → protect → fund → move → close.',
  explain:`<p>The order converts a vendor email into governed work: verify scope from your own records, weigh each device’s exposure and dependencies, mitigate and document the residual risk, then fund and schedule the migration — rehearsed, with rollback, before the EOS date. Decommissioning closes the story. Budget requests built on this sequence get approved faster because they answer the questions finance will ask anyway.</p>`,
  tip:'Scope before spend, mitigation before migration, records before relief.' },

/* ── H07 (position 7) ── slots pairs: vendor vocabulary */
{ id:'H08', t:'Match the vendor lifecycle vocabulary', theme:'Hardware & vendor lifecycle', kw:['last-time buy','end of sale','support contract','third-party support','hotfix'],
  points:5, type:'slots', mode:'pairs',
  scenario:`<p>The procurement officer forwards vendor quotes full of lifecycle jargon and asks what each phrase commits the company to. The wrong match costs real money.</p>`,
  question:`<p>Match each term to the sentence that defines it.</p>`,
  bank:[
    { k:'v1', html:'Last-time buy', aria:'last-time buy', why:'The final ordering window before the product leaves the price list.' },
    { k:'v2', html:'End of sale', aria:'end of sale', why:'The date after which the product can no longer be purchased at all.' },
    { k:'v3', html:'Grace period', aria:'grace period', why:'A short post-contract window with reduced service while paperwork settles.' },
    { k:'v4', html:'Third-party support', aria:'third-party support', why:'A NON-vendor company sells fixes or spare parts after the vendor stops.' },
    { k:'v5', html:'Hotfix', aria:'hotfix', why:'A single urgent fix for one defect, shipped outside the normal cycle.' }
  ],
  slots:[
    { label:'The final chance to order the product before it disappears from the price list', accept:'v1', ph:'drop term' },
    { label:'The date the product can no longer be purchased, full stop', accept:'v2', ph:'drop term' },
    { label:'A short window after contract end during which limited service still works', accept:'v3', ph:'drop term' },
    { label:'Patches or spares for an EOS product sold by a company that is NOT the vendor', accept:'v4', ph:'drop term' },
    { label:'One urgent fix for one defect, outside the normal release cycle', accept:'v5', ph:'drop term' }
  ],
  hint:'One term is about money, one about time, one about who (not the vendor) saves you.',
  explain:`<p>The vocabulary maps directly onto money and risk. Last-time buy is the chance to stock spares before end of sale. A grace period is contractual politeness with limited value. Third-party support keeps an EOS device serviceable but never restores the vendor’s security patches — a bridge, not a destination. A hotfix is an urgent single-defect fix. Knowing which is which prevents both panic purchases and false comfort.</p>`,
  tip:'Third-party support buys time, not patches. Only the vendor’s EOS date ends the fixes.' },

/* ── H08 (position 8) ── slots fill: media policy drafting */
{ id:'H09', t:'Draft policy DIS-02 without the wrong words', theme:'Decommissioning & sanitisation', kw:['wiping','cryptographic erase','destruction','chain of custody','retention','media sanitisation'],
  points:5, type:'slots', mode:'fill',
  scenario:`<p>The disposal policy needs its precise wording restored. Two decoy tiles look tempting but would weaken the policy. Precision matters: auditors quote this text verbatim.</p>`,
  question:`<p>Complete the policy text.</p>`,
  text:`<p>Policy DIS-02 — media leaving the organisation: working hard drives are {{0}} with a verified overwrite before reuse. Self-encrypting drives leave only after a {{1}} has destroyed their keys. Media that cannot be reliably sanitised is sent for physical {{2}}. Every handover is logged as a {{3}} with serials and signatures. Disposal certificates are retained for the full {{4}} period.</p>`,
  bank:[
    { k:'q1', html:'wiped', aria:'wiped', why:'A verified overwrite is wiping — appropriate for healthy, reusable drives.' },
    { k:'q2', html:'cryptographic erase', aria:'cryptographic erase', why:'Destroying the keys of an SED makes its ciphertext unreadable for ever.' },
    { k:'q3', html:'destruction', aria:'destruction', why:'Unverifiable media must physically end: shredding or incineration.' },
    { k:'q4', html:'chain of custody', aria:'chain of custody', why:'Signed handovers with serials make every movement provable.' },
    { k:'q5', html:'retention', aria:'retention', why:'The retention period defines how long the evidence must be kept.' },
    { k:'d1', html:'burning (incineration)', aria:'incineration (decoy)', why:'Tempting, but the blank asks for the sanitisation LEVEL (destruction), and incineration is only one destruction technique.' },
    { k:'d2', html:'degaussing', aria:'degaussing (decoy)', why:'Degaussing purges magnetic media — but hard drives in this policy are overwritten, and SSDs cannot be degaussed reliably.' }
  ],
  slots:[
    { accept:'q1', label:'blank 1', aria:'blank 1' },
    { accept:'q2', label:'blank 2', aria:'blank 2' },
    { accept:'q3', label:'blank 3', aria:'blank 3' },
    { accept:'q4', label:'blank 4', aria:'blank 4' },
    { accept:'q5', label:'blank 5', aria:'blank 5' }
  ],
  hint:'The blanks name levels and documents, not brands of fire. Which tile is a technique and not a level?',
  explain:`<p>The policy uses level-words precisely: wiped (overwrite) for reusable drives, cryptographic erase for SEDs that must travel, destruction for media that cannot be verified, chain of custody for the evidence of every handover, and retention for how long that evidence lives. The decoys are techniques — incineration is one way to destroy, degaussing one way to purge — but policies commit to levels so they survive changes in tooling.</p>`,
  tip:'Policies name levels (clear / purge / destroy) and documents (custody, certificate, retention); techniques are examples, not commitments.' },

/* ── H09 (position 9) ── order: HA firewall patch campaign */
{ id:'H10', t:'Patch the HA firewall pair without dropping traffic', theme:'Software management', kw:['patch','rollback','maintenance window','software validation','firmware'],
  points:5, type:'order',
  scenario:`<p>Two firewalls run in a high-availability pair carrying production traffic. The vendor released a security patch. Done wrongly, the campaign drops traffic or — worse — leaves both members on different versions with no failover safety.</p>`,
  question:`<p>Order the six steps of a safe HA patch campaign.</p>`,
  items:[
    { k:'h1', html:'Book the maintenance window and inform stakeholders', t:'Book window, inform stakeholders', why:'Even seamless failovers deserve an announced window.' },
    { k:'h2', html:'Back up both members and confirm the rollback image is present', t:'Back up both, confirm rollback image', why:'Each member needs an independent way back before anything changes.' },
    { k:'h3', html:'Patch the standby member first', t:'Patch the standby first', why:'The passive member can fail safely without touching the traffic path.' },
    { k:'h4', html:'Validate the standby, then force a failover to it', t:'Validate standby, fail over', why:'Only a validated standby may become active — this proves the new version live.' },
    { k:'h5', html:'Patch the (now) standby member', t:'Patch the former active', why:'The second member is patched while traffic already runs on the new version.' },
    { k:'h6', html:'Validate traffic, then update documentation and close the ticket', t:'Validate, document, close', why:'The campaign ends with proof and honest records.' }
  ],
  hint:'Never have both members down, never patch the box that is carrying traffic, never skip the validation between halves.',
  explain:`<p>HA patching is choreography: prepare backups and the rollback image, patch the standby, prove it, fail over, prove again, patch the remaining member, then close with validation and documentation. At every instant one healthy member carries the traffic and one known way back exists. This is why “patch both at once” and “patch the active first” are the two classic disasters.</p>`,
  tip:'Standby first, prove it, fail over, then the other one.' },

/* ── H10 (position 10) ── text: RMA sanitisation terms */
{ id:'H11', t:'The RMA that must not leak', theme:'Decommissioning & sanitisation', kw:['cryptographic erase','destruction','media sanitisation'],
  points:2, type:'text',
  scenario:`<p>A self-encrypting drive from the database server must go back to the vendor under warranty. A second, physically broken drive from the same server cannot be wiped at all. Both leave the building on the same courier run, and the data owner has signed off both paths.</p>`,
  question:`<p>Type the two sanitisation terms that make this courier run safe.</p>`,
  inputs:[
    { label:'For the self-encrypting drive (keys destroyed, drive returned)', accept:['cryptographic erase','crypto erase','cryptographic-erase','crypto-erase','cryptographic purge'], ph:'two words', why:'With the keys destroyed, the returned drive carries unreadable ciphertext only.' },
    { label:'For the broken drive (cannot be wiped at all)', accept:['destruction','physical destruction','shredding','destroy'], ph:'one word', why:'Media that cannot be verified cannot be trusted — it is destroyed, and the certificate replaces the drive.' }
  ],
  hint:'One action destroys keys, the other destroys the media itself.',
  explain:`<p>The RMA is safe because each drive gets the strongest action its condition allows: the healthy SED keeps its data but loses its keys (cryptographic erase — the vendor receives unreadable metal), while the broken drive, which no one can verify, is destroyed and replaced by a certificate of destruction. Sending either drive without its matching action is how “routine warranty returns” end up in breach notifications.</p>`,
  tip:'Keys for the healthy, shredder for the dead — and a certificate for both.' },

/* ── H11 (position 11) ── multi: red flags in the review minutes */
{ id:'H12', t:'Read the decommissioning review minutes', theme:'Decommissioning & sanitisation', kw:['decommissioning review','CMDB','IPAM','certificate of destruction','documentation','audit trail'],
  points:3, type:'choice', multi:true,
  scenario:`<p>Two weeks after storage array <b>SAN-OLD2</b> left the building, the decommissioning review meets to decide whether the closure is defensible. The minutes extract below lists five outcomes. Three of them are <b>red flags</b> — evidence that something is still open, unverified or missing. The other two are the process working normally.</p>`,
  artifacts:[{ label:'Review minutes — extract (SAN-OLD2)', kind:'table', filter:true, body:
`<span class="hl-k">MIN — decommissioning review, SAN-OLD2</span>
1  CMDB state now "decommissioned"; removal date and port states recorded
2  Wipe job reported "finished", but the verification log cannot be located
3  Two VLANs still list SAN-OLD2 interfaces in IPAM as active addresses
4  Lessons learned captured; runbook update assigned with an owner and a date
5  Vendor confirmed the destruction certificate will be sent "in a few weeks"` }],
  question:`<p>Select the <b>3</b> minutes entries that are red flags — evidence the decommissioning is not safely closed.</p>`,
  options:[
    { k:'A', html:'Entry 2 — the wipe verification log is missing', note:'“Finished” without a verification log is an unproven sanitisation claim.' },
    { k:'B', html:'Entry 4 — the lessons-learned capture', note:'That is the review working as intended, not a red flag.' },
    { k:'C', html:'Entry 3 — IPAM still shows live addresses', note:'Records that disagree with reality mean the documentation loop was never closed.' },
    { k:'D', html:'Entry 1 — CMDB state and dates recorded', note:'Good bookkeeping — updated, not deleted; exactly what policy wants.' },
    { k:'E', html:'Entry 5 — the destruction certificate is pending', note:'Until the certificate exists, the disposal is an unaudited promise, not evidence.' }
  ],
  correct:['A','C','E'],
  hint:'A red flag is unfinished evidence: an unprovable wipe, records that still point at live address space, or proof that does not exist yet.',
  explain:`<p>The review can only close what the evidence can prove. A wipe without its verification log is a claim, not a fact. IPAM entries that still show live addresses mean the documentation loop was never closed — some network record still believes the array exists. And a certificate that will arrive “in a few weeks” leaves the destruction unaudited until it lands on the asset record. Entries 1 and 4 are the system working: records updated with dates, lessons captured with an owner. Red flags are not accusations — they are the open items a review exists to catch before the ticket closes for good.</p>`,
  tip:'Closure needs proof: verified sanitisation, records that match reality, and filed certificates.' },

/* ── H12 (position 12) ── slots pairs: testing vocabulary */
{ id:'H13', t:'Match the testing environments and checks', theme:'Software management', kw:['test environment','staging','UAT','pilot','regression testing','new application deployment'],
  points:5, type:'slots', mode:'pairs',
  scenario:`<p>The <b>“Atlas”</b> new application deployment is being planned, and the project plan mixes up the vocabulary of software validation and its safety nets. The deployment lead asks you to pin every term to its exact meaning before the plan is signed.</p>`,
  question:`<p>Match each term to the sentence that defines it.</p>`,
  bank:[
    { k:'e1', html:'Staging', aria:'staging', why:'The test environment that mirrors production for safe trials.' },
    { k:'e2', html:'UAT', aria:'UAT (user acceptance testing)', why:'Business users confirm the app does what the business needs.' },
    { k:'e3', html:'Pilot', aria:'pilot', why:'A small group of real users runs the change before everyone else.' },
    { k:'e4', html:'Regression testing', aria:'regression testing', why:'Re-running key tests to prove old features still work after a change.' },
    { k:'e5', html:'Smoke test', aria:'smoke test', why:'A quick check that the system basically starts and responds.' }
  ],
  slots:[
    { label:'A mirror of production where changes can fail safely', accept:'e1', ph:'drop term' },
    { label:'Business users confirm the app meets their needs', accept:'e2', ph:'drop term' },
    { label:'A small group of real users tries the change first', accept:'e3', ph:'drop term' },
    { label:'Proving the OLD features still work after the change', accept:'e4', ph:'drop term' },
    { label:'A minimal “does it start and respond at all” check', accept:'e5', ph:'drop term' }
  ],
  hint:'One term is a place, three are kinds of evidence, one is a tiny subset of evidence.',
  explain:`<p>The deployment’s safety net has named parts: staging is the place where failure is cheap; UAT is business users accepting the app; the pilot is a bounded real-world trial; regression testing protects the features nobody asked to change; and the smoke test merely proves the system is alive. A plan that swaps these — for example, calling a smoke test “UAT” — signs off risk without measuring it.</p>`,
  tip:'Place: staging. People: UAT, pilot. Old features: regression. Barely alive: smoke.' },

/* ── H13 (position 13) ── QCM: final-release nuance */
{ id:'H14', t:'The final firmware that fixes a CVE', theme:'Hardware & vendor lifecycle', kw:['EOL','EOS','final release','replacement planning','firmware'],
  points:3, type:'choice', multi:false,
  scenario:`<p>The vendor posts: “Final firmware 6.2.9 for the NG-2100 series fixes CVE-2026-3311. No further releases are planned. End of support remains 2027-12-31.” The device is already EOL, and a junior engineer proposes to “close the EOL ticket — they shipped a patch, so it is supported again”.</p>`,
  question:`<p>Which statement is <b>true</b>?</p>`,
  options:[
    { k:'A', html:'The device must be powered off today; a CVE on EOL gear is an emergency.', note:'The CVE has a fix available (6.2.9); the lifecycle risk is unchanged and planned.' },
    { k:'B', html:'EOS is cancelled automatically when a vendor ships a security fix.', note:'Nothing in a bulletin cancels an EOS date.' },
    { k:'C', html:'The device is fully supported again because a patch was released.', note:'One late fix does not restore support; no further releases are planned.' },
    { k:'D', html:'After 6.2.9 no more fixes will come; patch now and replace before EOS.', note:'Correct: patch now, but the lifecycle plan does not move.' }
  ],
  correct:['D'],
  hint:'One update is not a resurrection. What did the vendor say about FUTURE releases?',
  explain:`<p>A final firmware that fixes one CVE is exactly what “final” means: valuable, but not a return to support. The correct move is to apply 6.2.9 in a proper window — the CVE is real — while the replacement project continues toward the unchanged EOS date. Closing the EOL ticket because “a patch appeared” confuses a single fix with an ongoing support relationship, and that confusion is precisely what attackers monitor for on EOL fleets.</p>`,
  tip:'Final release = patch it, still replace it. One fix never cancels EOS.' },

/* ── H14 (position 14) ── viewer + choice: highest combined risk */
{ id:'H15', t:'Which asset is the single biggest risk?', theme:'Inventory & governance', kw:['EOS','asset inventory','replacement planning','support contract','third-party support'],
  points:3, type:'text',
  scenario:`<p>The asset register below (today: 2026-10-01) mixes lifecycle states, exposure and notes. Management wants the ONE device whose combined risk is highest — the choice must survive the CIO’s challenge. Note: one EOS device already carries a rejected third-party support quote.</p>`,
  artifacts:[{ label:'Asset register — combined risk view', kind:'table', filter:true, body:
`<span class="hl-k">ASSET       ROLE                STATUS                    EXPOSURE      NOTES</span>
AST-2101    edge VPN gateway    <span class="hl-b">EOS 2026-04-30</span>             <span class="hl-b">internet</span>      <span class="hl-w">third-party support quote rejected</span>
AST-2140    core switch         current                   internal      HA pair, healthy
AST-2218    branch router       <span class="hl-w">EOL notice, EOS 2028-05-31</span>  internet      patched 2026-09
AST-2233    print server        <span class="hl-b">EOS 2025-08-31</span>             internal      isolated VLAN, low value data
AST-2287    NAC server          current                   internal      patched 2026-09
AST-2302    lab hypervisor      <span class="hl-b">EOS 2026-08-31</span>             <span class="hl-m">isolated lab</span>   no business data
AST-2351    WLAN controller     current                   internal      patched 2026-08` }],
  question:`<p>Type the <b>asset tag</b> of the single asset that carries the highest combined risk right now.</p>`,
  inputs:[
    { label:'Highest combined-risk asset', accept:['ast-2101','2101'], ph:'AST-xxxx', why:'AST-2101 stacks EOS, internet exposure and a rejected support bridge.' }
  ],
  hint:'Filter for EOS. Among those, compare exposure, data value and whether ANY support path remains.',
  explain:`<p>Three assets are past EOS, but their risk is not equal. AST-2101 stacks every aggravating factor: it faces the internet, it lost vendor patches in April 2026, and the only bridge (third-party support) was explicitly rejected — so nothing at all reduces the exposure. The print server and lab hypervisor are unsupported but isolated with low-value data, and AST-2218, though exposed, is still supported and patched. Combined risk, not any single column, drives the decision.</p>`,
  tip:'Highest risk = support lost × exposure × value, not the scariest single word in the table.' },

/* ── H15 (position 15) ── multi: real risks of an EOS router */
{ id:'H04', t:'Separate real EOS risks from noise', theme:'Hardware & vendor lifecycle', kw:['EOS','support contract','firmware','replacement planning'],
  points:4, type:'choice', multi:true,
  scenario:`<p>The branch office router passed end of support last month. The CIO’s inbox now collects opinions about what that means. Your job: keep only the statements that describe a real lifecycle-management risk.</p>`,
  question:`<p>Select the <b>4</b> statements that are REAL consequences of running an EOS device.</p>`,
  options:[
    { k:'A', html:'The router stops forwarding traffic on the EOS date.', note:'Nothing stops at EOS; the danger is precisely that life carries on unpatched.' },
    { k:'B', html:'New vulnerabilities get no vendor patch — ever.', note:'Correct: the vendor ships nothing after EOS, so every future CVE is permanent.' },
    { k:'C', html:'The web interface becomes measurably slower every month.', note:'Age does not throttle hardware. Slowness is a performance complaint, not a lifecycle risk.' },
    { k:'D', html:'Compliance frameworks and auditors flag unsupported devices.', note:'Correct: unsupported gear is a standard audit finding.' },
    { k:'E', html:'An exploited flaw can no longer be fixed by the vendor under any contract.', note:'Correct: even paid contracts end with EOS.' },
    { k:'F', html:'The device keeps forwarding traffic exactly as before, so nothing changes for users.', note:'Correct in a scary way: EOS changes nothing until the day it changes everything — that silent continuation is the risk.' }
  ],
  correct:['B','D','E','F'],
  hint:'EOS does not break anything today. It removes tomorrow’s fixes and today’s compliance story.',
  explain:`<p>End of support is silent: the router forwards packets as always, users notice nothing, and that is exactly why the risk accumulates. The real consequences are permanent unpatchable vulnerabilities, audit and compliance findings, the impossibility of fixing an exploited flaw under any contract, and the false comfort of “nothing has changed”. Traffic does not stop at EOS, and hardware does not slow down from paperwork.</p>`,
  tip:'EOS = no more fixes + no compliance story, while everything LOOKS fine.' },

/* ── H16 (position 16) ── branch: core switch firmware upgrade */
{ id:'H16', t:'Upgrade the core switch firmware', theme:'Software management', kw:['firmware','rollback','backout plan','maintenance window','software validation','documentation'],
  points:5, type:'branch',
  scenario:`<p>Core switch <b>core-sw01</b> (HA supervisor pair) needs firmware 17.9.5 for a security fix. It carries the inter-data-centre traffic. The window is approved; the phone is in your hand.</p>`,
  question:`<p>Choose the professional option at each step.</p>`,
  steps:[
    { q:'Pre-checks before touching the core?',
      options:[
        { html:'Read the release notes for breaking changes, back up the config, and confirm the rollback image boots.', ok:true, fb:'Notes, backup, and a PROVEN rollback image — the trinity that makes the change reversible.' },
        { html:'Reboot the switch once to “clean” it before the upgrade.', ok:false, fb:'An unplanned core reboot is the outage you were trying to prevent.' },
        { html:'Book 10:00 on a trading day; core changes are quick.', ok:false, fb:'Core windows belong in quiet hours with stakeholders awake and informed.' }
      ]},
    { q:'Which supervisor is upgraded first?',
      options:[
        { html:'The standby supervisor, so the active keeps carrying traffic.', ok:true, fb:'The standby can fail safely — that is what standby means.' },
        { html:'The active supervisor, to test the impact immediately.', ok:false, fb:'“Testing impact” on the active core is testing the outage in production.' },
        { html:'Both at once to save window time.', ok:false, fb:'Both members down at once on a core switch is a self-inflicted outage.' }
      ]},
    { q:'Twenty minutes in, one line card fails to initialise on the new image. Now?',
      options:[
        { html:'Execute the rollback to the previous image on that member, per the backout plan.', ok:true, fb:'The backout plan exists for this exact minute; use it, diagnose calmly afterwards.' },
        { html:'Wait — the card may self-heal.', ok:false, fb:'Hope is not a version-control strategy; the window is burning.' },
        { html:'Upgrade the same card again to the same image.', ok:false, fb:'Repeating the failing action inside a live window doubles the risk.' }
      ]},
    { q:'Closing the change properly means…',
      options:[
        { html:'Validate the key traffic flows, update the documentation, record the outcome in the ticket.', ok:true, fb:'Proof, records, closure — the change is finished when the paper matches the metal.' },
        { html:'Close the ticket as soon as the CLI answers again.', ok:false, fb:'A reachable CLI is not validated traffic; closing now hides unknown damage.' },
        { html:'Delete the old image from the repository to save space.', ok:false, fb:'The old image IS the rollback path for weeks to come. Deleting it removes the way back.' }
      ]}
  ],
  hint:'Standby first, prove everything, and the old image stays until the new one has lived a while.',
  explain:`<p>Core firmware work is choreography around a single rule: at every moment one healthy member carries the traffic and one proven way back exists. Release notes and backups come first, the standby is patched and validated, failover proves the new image under real load, and only then is the second member patched. A failing line card triggers the backout plan — and the old image is kept, because for weeks it remains the only rollback path.</p>`,
  tip:'Reversible beats fast: standby first, validate twice, keep the old image.' },

/* ── H17 (position 17) ── terminal (unguided): identify image and licences */
{ id:'H21', t:'Console audit: what is this router running?', theme:'Software management', kw:['firmware','support contract','EOS'],
  points:3, type:'terminal',
  scenario:`<p>You have console access to branch router <b>br-rtr-02</b>. Procurement needs two facts before the support conversation with the vendor: the <b>exact software image the router booted from</b> and the <b>feature licences installed</b> on it. No command names are given — you know this CLI. Enter the commands you need, one per line.</p>`,
  question:`<p>Find both facts on the console. Two commands are expected.</p>`,
  prompt:'br-rtr-02#',
  accepts:[
    { re:'^show ver(s|ion|sion)?(\\s*\\|.*)?$', ok:true, ex:'show version',
      out:'Cisco IOS XE Software, Version 17.09.04a\nbr-rtr-02 uptime is 1 year, 12 weeks\nSystem image file is "bootflash:isr4300-universalk9.17.09.04a.SPA.bin"',
      why:'show version reports the booted image, version and uptime — the fact procurement needs first.' },
    { re:'^show licen[cs]es?(\\s*\\|.*)?$', ok:true, ex:'show license',
      out:'License Usage:\n  ipbasek9    permanent   Active\n  securityk9  permanent   Active\n  uck9        permanent   Active',
      why:'show license lists the installed feature licences that determine what the support contract must cover.' },
    { re:'^show run(ning-config)?$', ok:false, ex:'',
      out:'Building configuration...\n! (long config output — detailed, but it is not where the booted image or licence summary lives)',
      why:'' },
    { re:'^show inventory$', ok:false, ex:'',
      out:'NAME: "Chassis", DESCR: "ISR 4321"\nPID: ISR4321/K9  SN: FLM2044X2AB',
      why:'' }
  ],
  deny:'% Invalid input detected — the router does not understand that.',
  hint:'One command reports what the box booted from; the other lists what it is licensed for.',
  explain:`<p>Two commands answer the procurement question on any IOS/IOS-XE device: <code>show version</code> names the exact running image and version — the string the vendor’s support database is searched with — and <code>show license</code> lists the installed feature licences, which define what the support contract must actually cover. With those two outputs attached, the support conversation starts with facts instead of guesses.</p>`,
  tip:'What runs = show version. What is allowed = show license.' },

/* ── H18 (position 18) ── spot: datacentre exit notes */
{ id:'H18', t:'Spot the mistakes in the DC-exit notes', theme:'Decommissioning & sanitisation', kw:['CMDB','IPAM','documentation','destruction','wiping','decommissioning review'],
  points:4, type:'spot',
  scenario:`<p>Project <b>“DC-exit”</b> moved the branch out of an old data centre. The project log below has three entries that will surface as audit findings in six months.</p>`,
  question:`<p>Select the <b>3</b> faulty lines.</p>`,
  lines:[
    { html:'1. Project “DC-exit” runbook v3 approved and versioned.', bad:false, why:'Versioned runbooks are exactly what an auditor wants to see.' },
    { html:'2. CMDB records for the old DC deleted on day one, “so the new DC starts clean”.', bad:true, why:'Deleting records destroys the audit trail and location history; records are closed out with a state and a date, never erased.' },
    { html:'3. All services migrated to the new site and validated.', bad:false, why:'Migration plus validation is the core of the exit.' },
    { html:'4. IPAM entries for the old ranges purged on day one, before the first migration.', bad:true, why:'IPAM must track reality through the migration — deleting address records first leaves live services using untracked space.' },
    { html:'5. All removable drives wiped and verified; serial numbers recorded.', bad:false, why:'Verified wiping with serials is model sanitisation.' },
    { html:'6. Broken drive from the old SAN added to the normal recycling batch — it would not power on.', bad:true, why:'Unverifiable media must be destroyed, not “assumed empty”: a dead drive goes to destruction with a certificate.' },
    { html:'7. Uplinks disabled and every port labelled at the old site.', bad:false, why:'Port hygiene at the exit site prevents forgotten active ports.' },
    { html:'8. Certificates of destruction filed per asset with serials.', bad:false, why:'Per-asset certificates are the disposal evidence chain.' },
    { html:'9. Decommissioning review scheduled for the following month.', bad:false, why:'The review is part of the plan, not an afterthought.' }
  ],
  hint:'Two lines destroy records that should have been closed out. One line trusts a dead disk.',
  explain:`<p>The three findings share one theme: evidence. Deleting CMDB records on day one erases the audit trail instead of closing it out; purging IPAM before migration leaves live services on untracked addresses; and a power-dead drive sent to ordinary recycling is unverified media — it must be destroyed with a certificate, because “would not power on” is not a sanitisation method. Records get closed states, and unverifiable media gets the shredder.</p>`,
  tip:'Never delete what you can close out, and never trust what you cannot verify.' },

/* ── H19 (position 19) ── slots bins: findings triage */
{ id:'H19', t:'Triage the lifecycle findings', theme:'Inventory & governance', kw:['EOS','EOL','asset inventory','replacement planning','port activation'],
  points:6, type:'slots', mode:'bins',
  scenario:`<p>The quarterly lifecycle review of the asset inventory produced six findings. The steering group wants them triaged into three buckets, and it will defend each placement against your reasoning in the meeting.</p>`,
  question:`<p>Place every finding in the right bucket.</p>`,
  bank:[
    { k:'j1', html:'Edge firewall is past EOS and internet-facing', aria:'EOS edge firewall, internet', why:'Unpatchable AND exposed — this is an incident waiting for a date.' },
    { k:'j2', html:'Retired core switch still racked, cabled and powered', aria:'Retired switch still live', why:'A forgotten active port is an open door; decommissioning starts this week.' },
    { k:'j3', html:'Test-environment servers missing the latest patch', aria:'Test servers unpatched', why:'Real but contained — scheduled work inside the quarter.' },
    { k:'j4', html:'CMDB holds about 40 stale asset records', aria:'Stale CMDB records', why:'Hygiene that prevents future mis-triage — important, not urgent.' },
    { k:'j5', html:'Access switches: EOL announced, EOS in three years', aria:'EOL-announced switches', why:'A planning item with a long runway — next budget cycle.' },
    { k:'j6', html:'Print server past EOS but in an isolated VLAN with low-value data', aria:'Isolated EOS print server', why:'Unsupported but contained and low-value — planned replacement, not panic.' }
  ],
  slots:[
    { label:'FIX NOW (days)', accept:['j1','j2'], ph:'drop finding', aria:'Fix now' },
    { label:'FIX NOW (days)', accept:['j1','j2'], ph:'drop finding', aria:'Fix now' },
    { label:'PLAN THIS QUARTER', accept:['j3','j4'], ph:'drop finding', aria:'Plan this quarter' },
    { label:'PLAN THIS QUARTER', accept:['j3','j4'], ph:'drop finding', aria:'Plan this quarter' },
    { label:'NEXT BUDGET CYCLE', accept:['j5','j6'], ph:'drop finding', aria:'Next budget cycle' },
    { label:'NEXT BUDGET CYCLE', accept:['j5','j6'], ph:'drop finding', aria:'Next budget cycle' }
  ],
  hint:'Exposure and live doors first. Isolation and long runways buy time.',
  explain:`<p>The two “now” findings both expose you today: an unpatchable, internet-facing firewall and a forgotten, still-forwarding switch — one is a wide door, the other a side door. The quarter bucket holds contained-but-real work: unpatched lab servers and stale CMDB records that will corrupt the NEXT triage if ignored. The budget bucket has runway: EOL-announced switches with years of support left and an isolated, low-value EOS print server. Triage is exposure times support, divided by containment.</p>`,
  tip:'Now = exposed or live doors. Quarter = contained but real. Budget = runway.' },

/* ── H20 (position 20) ── choice: retention semantics */
{ id:'H17', t:'The auditor asks about the tape vault', theme:'Decommissioning & sanitisation', kw:['retention','off-site storage','on-site storage','location tracking'],
  points:3, type:'choice', multi:false,
  scenario:`<p>During the annual audit, the auditor reads your off-site vault log and asks what the arrangement actually achieves — and why some media stays in the data-centre safe instead.</p>`,
  question:`<p>Which answer is <b>correct</b>?</p>`,
  options:[
    { k:'A', html:'Off-site storage is for devices the company no longer wants to own; they simply stay powered until disposal day arrives.', note:'Unwanted devices are disposed of, not stored. Storage protects KEPT media.' },
    { k:'B', html:'On-site storage is always safer because the media never leaves the building, and transit is where all losses happen.', note:'On-site shares the site’s fate in a fire or flood; transit risk is managed with custody logs.' },
    { k:'C', html:'Off-site storage survives the site disaster; the vault log and retention schedule record what is kept and until when.', note:'Correct — distance survives the fire; the log and schedule survive the audit.' },
    { k:'D', html:'Retention means deleting everything older than 30 days; older records have no legal value and only cost money to keep.', note:'Retention is a per-record schedule of how LONG to keep things — it can mean years.' }
  ],
  correct:['C'],
  hint:'One answer names a threat, a record and a clock. The others confuse storage with disposal or guess a number.',
  explain:`<p>The arrangement does two different jobs. Off-site storage buys distance, so a fire or flood at the main site cannot destroy the last copy. On-site storage buys speed for quick restores but shares the site’s fate. The vault log is location tracking for retained media, and the retention schedule is the clock that says how long each item stays — whether that is months or years. “Delete after 30 days” is somebody’s guess, not a policy.</p>`,
  tip:'Off-site survives the site. The log says where. The schedule says until when.' },

/* ── H21 (position 21) ── order: chain of custody */
{ id:'H22', t:'Order the chain of custody for the destruction run', theme:'Decommissioning & sanitisation', kw:['chain of custody','destruction','location tracking','retention','certificate of destruction','CMDB'],
  points:5, type:'order',
  scenario:`<p>Thirty decommissioned drives leave for the destruction vendor next week. Legal has one requirement: at any moment, for any serial, someone must be able to say where the drive was and who held it.</p>`,
  question:`<p>Order the six steps of a defensible chain of custody.</p>`,
  items:[
    { k:'c1', html:'Record serials and asset tags in the disposal register', t:'Record serials in the register', why:'You cannot trace what you never wrote down.' },
    { k:'c2', html:'Sanitise where possible and mark the media status', t:'Sanitise and mark status', why:'Each item leaves with a recorded state: wiped, purged, or to-destroy.' },
    { k:'c3', html:'Sign the chain-of-custody form with the vendor at pickup', t:'Sign custody form at pickup', why:'The signature transfers responsibility explicitly, not implicitly.' },
    { k:'c4', html:'Transport in sealed, tracked containers', t:'Sealed tracked transport', why:'Seals and tracking make interference visible and attributable.' },
    { k:'c5', html:'Receive and file the per-serial certificate of destruction', t:'Receive and file certificates', why:'The certificate converts a van trip into auditable evidence.' },
    { k:'c6', html:'Close the CMDB records and set the retention date on the paperwork', t:'Close records, set retention', why:'Records end in a closed state with a retention clock on the evidence.' }
  ],
  hint:'Write it down, prove its state, sign it over, watch it travel, collect the proof, close the books.',
  explain:`<p>A chain of custody is a story told in signatures: the register records existence, sanitisation records each item’s state, the custody form transfers responsibility, sealed tracked transport keeps the story unbroken, certificates of destruction end each serial’s life provably, and the CMDB closure plus a retention date preserve the whole file for the auditor. Missing any link leaves a serial with an unanswerable question — and auditors collect exactly those.</p>`,
  tip:'Register → state → signature → sealed transport → certificate → closed record.' },

/* ── H22 (position 22) ── choice: regression catch */
{ id:'H23', t:'The patch that broke the nightly batch', theme:'Software management', kw:['regression testing','software validation','UAT','change management'],
  points:3, type:'choice', multi:false,
  scenario:`<p>A routine server patch was deployed last night. Users log in fine, the smoke test passed, the change ticket closed at 02:10. At 03:40 the monitoring wakes everyone: the nightly report-export batch job — which depends on a library path the patch changed — has failed for the first time in two years.</p>`,
  question:`<p>Which process step was skipped or too shallow?</p>`,
  options:[
    { k:'A', html:'Regression testing of the jobs and services that depend on the patched system.', note:'Correct: regression tests exist precisely to catch broken dependencies.' },
    { k:'B', html:'User acceptance testing by business users before the patch was deployed.', note:'UAT validates business workflows for users — a 03:40 machine batch is not a user workflow.' },
    { k:'C', html:'A deeper smoke test of the login page during the change window itself.', note:'The smoke test PASSED — it only proves the system is alive, which it is.' },
    { k:'D', html:'A second, senior approval signature for a risky change of this size.', note:'Approval happened; the ticket closed cleanly. The gap is downstream of approval.' }
  ],
  correct:['A'],
  hint:'The failure was not in what users see — it was in what DEPENDS on the server.',
  explain:`<p>Everything the users touch worked, which is why the smoke test and the early closure felt safe. The broken thing was a dependency: a batch job relying on the patched system. Regression testing — re-running the tests for features and jobs that depend on the change — is the only step designed to catch exactly this. UAT, smoke tests and approvals all passed honestly; the safety net for dependencies simply was not there.</p>`,
  tip:'Smoke = alive. UAT = users agree. Regression = dependencies still work.' },

/* ── H23 (position 23) ── slots pairs: disposal paths */
{ id:'H24', t:'Match the four fates of retired gear', theme:'Decommissioning & sanitisation', kw:['recycling','repurposing','resale','disposal','wiping'],
  points:4, type:'slots', mode:'pairs',
  scenario:`<p>The sustainability officer and the security officer are arguing about 200 retired laptops. The argument ends when everyone agrees on what each path REQUIRES. Security never changes: any path that keeps data dangerous is not on the list.</p>`,
  question:`<p>Match each path to the sentence that defines its obligation.</p>`,
  bank:[
    { k:'f1', html:'Certified e-waste recycling', aria:'certified e-waste recycling', why:'Breaks hardware down under environmental rules; certificates prove compliant handling.' },
    { k:'f2', html:'Repurposing', aria:'repurposing', why:'A new internal role for the hardware — sanitise first, update the records.' },
    { k:'f3', html:'Resale', aria:'resale', why:'Selling externally — allowed only after sanitisation and verification, with records.' },
    { k:'f4', html:'Donation', aria:'donation', why:'Giving gear away carries the SAME sanitisation duty as resale — charity is not a sanitisation method.' }
  ],
  slots:[
    { label:'Hardware is broken down under environmental rules; certificates prove safe handling', accept:'f1', ph:'drop path' },
    { label:'The appliance gets a new internal job (lab, training, spare)', accept:'f2', ph:'drop path' },
    { label:'Selling gear externally — only after verified sanitisation and honest records', accept:'f3', ph:'drop path' },
    { label:'Giving gear to a school — identical sanitisation duty to resale', accept:'f4', ph:'drop path' }
  ],
  hint:'Two paths keep the hardware alive, two end it. One of the alive paths just changes the recipient.',
  explain:`<p>Every path has the same precondition — verified sanitisation — and differs only in what happens next. Certified e-waste recycling ends the hardware with environmental certificates. Repurposing keeps it alive inside the company under new records. Resale and donation both move gear to people outside the company, which is why their duty is identical: verified wiping, serials logged, and honest documentation. Calling a donation “someone else’s problem” is how laptops reappear on auction sites with data intact.</p>`,
  tip:'Sanitise first, always. Then recycle, repurpose, resell or donate — with records.' },

/* ── H24 (position 24) ── slots fill: patch-day runbook */
{ id:'H25', t:'Complete the patch-day runbook', theme:'Software management', kw:['maintenance window','rollback','software validation','change ticket','backup'],
  points:5, type:'slots', mode:'fill',
  scenario:`<p>Runbook <b>PW-7</b> governs tonight’s patch day. Two decoy tiles would make the runbook unsafe if chosen. The wording must survive a 03:00 execution by someone who has never met you.</p>`,
  question:`<p>Complete the runbook text.</p>`,
  text:`<p>Runbook PW-7: at 22:00 take a verified {{0}} of every affected node and confirm it restores. Apply patches only inside the approved {{1}}. Immediately after patching, run the full {{2}} test suite. If a critical test fails, execute the documented {{3}} plan — do not improvise. Record the outcome and update the {{4}} before closing the window.</p>`,
  bank:[
    { k:'u1', html:'backup', aria:'backup', why:'A verified, restorable backup is the material of every rollback.' },
    { k:'u2', html:'maintenance window', aria:'maintenance window', why:'Patches land inside the approved window or not at all.' },
    { k:'u3', html:'validation', aria:'validation', why:'The test suite proves the patch did not break what matters.' },
    { k:'u4', html:'rollback', aria:'rollback', why:'The documented plan is executed verbatim; 03:00 is not improvisation hour.' },
    { k:'u5', html:'change ticket', aria:'change ticket', why:'The ticket carries the evidence and closes the audit trail.' },
    { k:'d1', html:'hotfix', aria:'hotfix (decoy)', why:'A hotfix is an urgent vendor fix — the opposite of tonight’s planned discipline.' },
    { k:'d2', html:'firmware wipe', aria:'firmware wipe (decoy)', why:'A made-up phrase; nothing here wipes anything.' }
  ],
  slots:[
    { accept:'u1', label:'blank 1', aria:'blank 1' },
    { accept:'u2', label:'blank 2', aria:'blank 2' },
    { accept:'u3', label:'blank 3', aria:'blank 3' },
    { accept:'u4', label:'blank 4', aria:'blank 4' },
    { accept:'u5', label:'blank 5', aria:'blank 5' }
  ],
  hint:'The runbook protects four things: the way back, the timing, the proof, and the record.',
  explain:`<p>The runbook reads like a chain of protection: a verified backup provides the material for rollback, the maintenance window defines when disruption is allowed, the validation suite provides proof, the documented rollback plan replaces improvisation, and the change ticket preserves the evidence. A runbook that misses any of these five words asks a tired engineer at 03:00 to invent them — which is exactly when invention goes wrong.</p>`,
  tip:'Back up, window, validate, roll back per plan, and write it all down.' },

/* ── H25 (position 25) ── viewer + choice: cross-reference bulletin and fleet */
{ id:'H26', t:'Cross-reference the bulletin with the fleet', theme:'Software management', kw:['firmware','patch','EOS','asset inventory'],
  points:3, type:'text',
  scenario:`<p>The vendor bulletin below describes vulnerable firmware ranges for the AX-2400 family. Your fleet runs a mix of branches and versions. Management wants the ONE device that is confirmed vulnerable on the current image.</p>`,
  artifacts:[
    { label:'Vendor security bulletin AX-2400', kind:'table', filter:false, body:
`<span class="hl-k">AFFECTED:</span>   firmware 7.2.x where x < 11  (7.2.0 – 7.2.10)
<span class="hl-k">NOT AFFECTED:</span> firmware 7.2.11 and later (fixed in 7.2.11)
<span class="hl-k">NOT AFFECTED:</span> firmware 7.3 and later (new branch, fixed by design)
<span class="hl-k">NOT AFFECTED:</span> older 6.9 branch (the flaw does not exist there)
<span class="hl-w">FIX:</span>          upgrade 7.2.x installs to 7.2.11 or later` },
    { label:'Firmware register — AX-2400 fleet', kind:'table', filter:true, body:
`<span class="hl-k">DEVICE      VERSION   ROLE</span>
core-sw01   7.3.2     core
sw-acc-04   7.2.9     access, floor 2
sw-acc-07   7.2.11    access, floor 3
sw-acc-12   7.2.14    access, floor 1 (patched 2026-09)
br-sw02     6.9.4     branch` }],
  question:`<p>Type the <b>device name</b> that is confirmed vulnerable on its current image and needs the upgrade now.</p>`,
  inputs:[
    { label:'Confirmed vulnerable device', accept:['sw-acc-04','sw-acc04'], ph:'device name', why:'sw-acc-04 runs 7.2.9 — inside the affected 7.2.0–7.2.10 range.' }
  ],
  hint:'The affected set is 7.2.0 through 7.2.10 — nothing else. Check every device against that range, including the “too old to be vulnerable” one.',
  explain:`<p>The bulletin defines the affected set precisely: 7.2.0 to 7.2.10. Only sw-acc-12’s neighbour sw-acc-04 (7.2.9) falls inside it. core-sw01’s 7.3 branch is unaffected by design, sw-acc-07 runs exactly the fixed release, and br-sw02’s 6.9.4 — although the oldest image on the list — lacks the vulnerable code entirely, which the bulletin states to stop exactly this panic-upgrade. Reading the ranges instead of guessing ages is the skill being tested.</p>`,
  tip:'Version ranges, not version feelings: match each device against the bulletin’s arithmetic.' },

/* ── H26 (position 26) ── multi: port activation controls */
{ id:'H27', t:'Controls against the forgotten active port', theme:'Decommissioning & sanitisation', kw:['port activation','CMDB','decommissioning review','documentation'],
  points:4, type:'choice', multi:true,
  scenario:`<p>After the br-sw09 incident (a “decommissioned” switch found live), the security committee asks which controls genuinely kill this risk class — and which are folklore.</p>`,
  question:`<p>Select the <b>5</b> controls that genuinely reduce the forgotten-active-port risk.</p>`,
  options:[
    { k:'A', html:'Leave spare ports enabled “for future growth”.', note:'Convenience is the risk: enabled spares are exactly the doors that get forgotten.' },
    { k:'B', html:'Disable unused ports as a default on every switch.', note:'Correct: a disabled port forwards nothing, whatever the paperwork says.' },
    { k:'C', html:'One shared VLAN for spare and production gear.', note:'A shared VLAN turns any forgotten port into instant production access.' },
    { k:'D', html:'Port security / sticky MAC on access ports.', note:'Correct: unknown MACs are shut down even on ports someone re-enables.' },
    { k:'E', html:'Physical verification during the decommissioning review.', note:'Correct: someone LOOKS at the rack and the LEDs before the ticket closes.' },
    { k:'F', html:'CMDB records carrying removal date and port state.', note:'Correct: the record and the reality get a chance to agree — and disagreements become visible.' },
    { k:'G', html:'NAC so unknown devices stay unauthenticated.', note:'Correct: even a live forgotten port hands out no working network access.' }
  ],
  correct:['B','D','E','F','G'],
  hint:'Four controls watch the port or the record; one control watches the device that just plugged in.',
  explain:`<p>The working controls form layers: disabled ports remove the forwarding path, port security and NAC stop unauthorised devices even on human errors, physical verification during the decommissioning review compares LEDs with records, and CMDB entries with removal dates and port states make drift visible. The folklore — spare ports left enabled and shared VLANs — optimises convenience today into incidents later.</p>`,
  tip:'Layer it: port off, MAC bound, device authenticated, rack verified, record dated.' },

/* ── H27 (position 27) ── branch: the CIO wants to cut corners */
{ id:'H28', t:'The CIO wants to skip steps', theme:'Decommissioning & sanitisation', kw:['decommissioning review','data sanitisation','port activation','documentation'],
  points:5, type:'branch',
  scenario:`<p>Quarter-end pressure. The CIO proposes shortcuts on the storage-array decommissioning, one per step. Each of your answers must name the consequence — that is what changes the CIO’s mind, or documents why it should not.</p>`,
  question:`<p>Answer each proposal with the professional response.</p>`,
  steps:[
    { q:'“Skip sanitisation — those disks are ancient.”',
      options:[
        { html:'Refuse: data survives formats for decades; sanitisation is what prevents a breach and satisfies the law.', ok:true, fb:'Age of the hardware never reduced the value of the data on it.' },
        { html:'Agree — old disks are probably unreadable anyway.', ok:false, fb:'“Probably” is the word that appears in breach reports afterwards.' },
        { html:'Agree if someone signs a note.', ok:false, fb:'A note does not sanitise; it just documents the decision to leak.' }
      ]},
    { q:'“Skip the documentation update — nobody reads it anyway.”',
      options:[
        { html:'Refuse: future teams will hunt ghost devices and mystery cables; records are how the next change stays safe.', ok:true, fb:'Documentation is written for the engineer who arrives at 03:00 in two years.' },
        { html:'Agree — the diagrams are already approximate.', ok:false, fb:'Approximate diagrams turn small incidents into long ones.' },
        { html:'Update only the CMDB and skip diagrams and IPAM.', ok:false, fb:'Partial records disagree with each other, which is worse than an honest gap.' }
      ]},
    { q:'“Leave the ports active during the cutover week, just in case.”',
      options:[
        { html:'Refuse: active ports on “retired” gear are unmonitored entry points; shut them and verify instead.', ok:true, fb:'The rollback path is a documented plan — not a live cable into a dead device.' },
        { html:'Agree for the uplink only.', ok:false, fb:'The uplink is THE door; one live door defeats every other control.' },
        { html:'Agree, but write “temporary” on the ticket.', ok:false, fb:'Undated “temporary” is how permanent holes are born.' }
      ]},
    { q:'“Cancel the review meeting — we are all busy.”',
      options:[
        { html:'Refuse: the review is what converts this decommissioning into lessons and evidence; skipping it repeats the mistakes.', ok:true, fb:'Thirty minutes of review is the cheapest process improvement the company owns.' },
        { html:'Agree — the ticket closure is enough.', ok:false, fb:'Ticket closure records THAT it happened; the review records WHY it went well or badly.' },
        { html:'Agree and send the lessons by email.', ok:false, fb:'Unowned lesson emails are never read; the meeting exists to force the conversation.' }
      ]}
  ],
  hint:'Each shortcut has a named victim: data, records, the perimeter, or the process itself.',
  explain:`<p>Every shortcut buys days and pays in incidents: skipped sanitisation converts a dusty array into a breach and a legal case; skipped documentation makes the NEXT engineer guess; live ports “just in case” hand attackers an unmonitored door; and a cancelled review guarantees the same mistakes next quarter. The professional answers all share one shape — name the consequence, then offer the controlled alternative.</p>`,
  tip:'Cut the process and the risk does not disappear — it just stops being scheduled.' },

/* ── H28 (position 28) ── choice: resale hygiene */
{ id:'H29', t:'Two hundred laptops, one broker, tonight', theme:'Decommissioning & sanitisation', kw:['wiping','software validation','documentation','resale','certificate of destruction'],
  points:3, type:'choice', multi:false,
  scenario:`<p>Two hundred retired laptops were wiped overnight by the batch tool. The broker’s truck arrives at 09:00 and the driver is impatient. The tool reported “completed” on all units, but nobody has looked at the per-serial results.</p>`,
  question:`<p>What is the professionally correct step before the laptops are loaded?</p>`,
  options:[
    { k:'A', html:'Verify the wipe results per serial, log them, and hand over with a signed record.', note:'Correct: “completed” is a status, not evidence — verification and records are.' },
    { k:'B', html:'Load them; the batch tool is certified and its “completed” flag can be trusted.', note:'Tools fail silently on locked sectors and sleeping drives. Trust is not verification.' },
    { k:'C', html:'Delete the user profiles once more, quickly — that is enough for resale.', note:'Profile deletion is not sanitisation; the data blocks remain recoverable.' },
    { k:'D', html:'Cancel the resale; wiping is never sufficient for laptop drives at this scale.', note:'Wiping IS sufficient when verified; cancelling wastes 200 sound assets.' }
  ],
  correct:['A'],
  hint:'The gap is not in the wiping — it is in the proof that the wiping happened everywhere.',
  explain:`<p>A batch wipe that reports “completed” has told you it finished, not that it succeeded on every sector of every serial. Verification of the per-serial results, a logged record, and a signed handover turn the overnight run into evidence; without them, a single failed drive among two hundred is an uncontained breach sold by the kilo. Resale is entirely legitimate — the discipline around it is what makes it safe.</p>`,
  tip:'Status ≠ evidence. Verify per serial, log, and get signatures.' },

/* ── H29 (position 29) ── order: the audit documentation chain */
{ id:'H30', t:'Order the evidence chain an auditor follows', theme:'Inventory & governance', kw:['change management','audit trail','documentation','retention','certificate of destruction'],
  points:5, type:'order',
  scenario:`<p>The auditor reconstructs the life of one device purely from documents. She says: “Show me the paper trail from cradle request to grave certificate.” The chain below is complete but shuffled.</p>`,
  question:`<p>Put the six documents in the order the auditor will read them.</p>`,
  items:[
    { k:'a1', html:'Approved change request (CAB minutes)', t:'Approved change request', why:'Life starts with an authorised entry into production.' },
    { k:'a2', html:'Test evidence stored with the ticket', t:'Test evidence', why:'Before deployment, the change proved itself in staging.' },
    { k:'a3', html:'Deployment record with version and timestamp', t:'Deployment record', why:'What exactly was installed, when, and by whom.' },
    { k:'a4', html:'Post-change validation results attached to the ticket', t:'Validation results', why:'Proof that the deployed change did what it promised.' },
    { k:'a5', html:'Decommissioning certificate filed at end of life', t:'Decommissioning certificate', why:'End of life is proven by the disposal certificate.' },
    { k:'a6', html:'Records archived per the retention schedule', t:'Records under retention', why:'The whole file survives until the retention clock releases it.' }
  ],
  hint:'Authorise → prove → deploy → verify → certify the end → archive it all.',
  explain:`<p>The audit chain mirrors the device’s life: an approved change request authorises its birth in production, test evidence shows it was proven before deployment, the deployment record fixes version and time, validation results prove it worked, the decommissioning certificate proves its controlled end, and the retention schedule guarantees the whole file survives long enough to be audited. A device whose paperwork follows this order can be reconstructed years later by a stranger — which is the entire definition of an audit trail.</p>`,
  tip:'Authorise, prove, deploy, verify, certify the end, archive.' },

/* ── H30 (position 30) ── multi: interim risk reduction that actually works */
{ id:'H20', t:'Six months on an EOL firewall: what really helps?', theme:'Hardware & vendor lifecycle', kw:['EOL','risk acceptance','replacement planning','firmware'],
  points:4, type:'choice', multi:true,
  scenario:`<p>The EOL perimeter firewall must survive six more months until its replacement lands. The budget for new controls is zero, but time and configuration changes are available. Marketing proposes several “solutions”; only some reduce actual risk.</p>`,
  question:`<p>Select the <b>4</b> actions that genuinely reduce risk on an EOL device that must keep running.</p>`,
  options:[
    { k:'A', html:'Remove direct internet exposure where possible; keep only required ports reachable.', note:'Correct: less reachability means fewer attempts on unpatchable code.' },
    { k:'B', html:'Lock management access down to VPN with MFA from the admin network.', note:'Correct: the management plane is the most valuable target on an aging box.' },
    { k:'C', html:'Increase monitoring and alerting specifically on this device.', note:'Correct: you cannot patch, so you watch — tightly.' },
    { k:'D', html:'Put an IPS rule set in front of it as a virtual patch.', note:'Correct: another control carries the protection the firewall itself can no longer receive.' },
    { k:'E', html:'Ask the vendor for a free support extension as an exception.', note:'Worth an email, but it changes nothing until signed — and vendors rarely make exceptions past EOS.' },
    { k:'F', html:'Get a signed, dated risk acceptance that documents the residual risk and the end date.', note:'Correct: governed risk with an expiry date is managed risk.' }
  ],
  correct:['A','B','C','D'],
  hint:'Three actions shrink the attack surface, one adds watching eyes, one adds paperwork with a deadline. The email to the vendor is not a control.',
  explain:`<p>When patching is impossible, risk falls in four proven ways: shrink the exposure (remove unneeded reachability), harden the management plane (VPN with MFA), watch the device intensively, and let a compensating control — an IPS — carry the protection load. A signed, dated risk acceptance is also part of the answer: governed risk with an expiry date. A polite request to the vendor is not a control; until ink dries, nothing has changed on the box.</p>`,
  tip:'Shrink, harden, watch, compensate — and write the risk down with an end date.' }
];
