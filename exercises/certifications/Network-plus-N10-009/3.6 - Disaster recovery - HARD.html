<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>3.6 - Disaster recovery</title>
<script type="application/json" id="cm-exercise-meta">{"topicId": "network-plus", "chapter": 3.6, "title": "3.6 - Disaster recovery", "difficulty": "hard", "questionCount": 30, "estimatedMinutes": 75, "passMark": 70}</script>
<style>
:root{
  --bg:#0b1120; --panel:#131c30; --panel2:#0f1728; --panel3:#182338;
  --line:#26324f; --line2:#33415f;
  --text:#e9effc; --muted:#a9b7d6; --faint:#7f8db0;
  --accent:#5cc8ff; --accent-ink:#04121f;
  --good:#3ddc97; --bad:#ff6b7a; --warn:#ffc857; --violet:#b18cff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 var(--sans)}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.95em;background:var(--panel3);padding:1px 6px;border-radius:6px}
h1,h2,h3{line-height:1.25}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
/* ---------- panels & blocks ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
.blk{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;background:var(--panel2)}
.blk-label{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 10px;margin:0 0 10px}
.blk.scen{border-left:5px solid var(--accent)}
.blk.quest{border-left:5px solid var(--violet);background:#161f36}
.blk.quest .blk-label{background:var(--violet);color:#140a24}
.blk.ans{background:#101a2e}
.blk.art{background:#0d1526}
.art-title{font-weight:700;color:var(--muted);font-size:14px;margin:0 0 8px}
.art-title .mono{color:var(--text)}
p{margin:.4em 0}
/* ---------- HUD ---------- */
.hud{position:sticky;top:0;z-index:40;background:rgba(11,17,32,.94);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:10px 0 8px;margin:0 -16px 16px;padding-left:16px;padding-right:16px}
.hud-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.exam-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.cand{font-size:12px;color:var(--muted)}
.sev-badge{font-size:11px;font-weight:800;letter-spacing:.12em;padding:4px 10px;border-radius:999px;color:var(--accent-ink)}
.sev-badge.medium{background:var(--accent)}
.sev-badge.hard{background:var(--bad);color:#2b0409}
.hud-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--panel3);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.chip.timer{font-family:var(--mono);font-size:16px}
.chip.timer.warn{border-color:var(--warn);color:var(--warn)}
.chip.timer.danger{border-color:var(--bad);color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.pauseflags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pflag{font-size:13px;font-weight:700;border-radius:8px;padding:4px 12px}
.pflag.manual{background:#123152;color:var(--accent);border:1px solid var(--accent)}
.pflag.review{background:#33270c;color:var(--warn);border:1px solid var(--warn)}
.hud-row2{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pbar{flex:1 1 220px;height:12px;background:var(--panel3);border:1px solid var(--line);border-radius:999px;overflow:hidden}
#pbarFill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .5s ease}
.themechips{display:flex;gap:6px;flex-wrap:wrap}
.themechip{font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px}
.themechip b{color:var(--text)}
/* ---------- navigator ---------- */
.navwrap{margin-top:10px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,44px));gap:6px;flex:1 1 320px}
.nchip{position:relative;min-width:44px;min-height:44px;border-radius:10px;border:2px solid var(--line2);background:var(--panel2);color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;padding:0}
.nchip .ntag{position:absolute;left:0;right:0;bottom:2px;font-size:9px;font-weight:800;letter-spacing:.05em}
.nchip.cur{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 2px rgba(92,200,255,.35)}
.nchip.ok{background:#0e3a2a;border-color:var(--good);color:var(--good)}
.nchip.part{background:#3a2f0e;border-color:var(--warn);color:var(--warn)}
.nchip.zero{background:#3d1118;border-color:var(--bad);color:var(--bad)}
.nchip.skip{background:#33270c;border-color:var(--warn);border-style:dashed;color:var(--warn)}
.legend{font-size:12px;color:var(--faint);max-width:220px;line-height:1.6}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:baseline;border:1px solid var(--line2)}
/* ---------- buttons ---------- */
.btn{min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line2);background:#1b2742;color:var(--text);padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .05s}
.btn:hover{background:#223055}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.primary:hover{background:#7ed3ff}
.btn.good{background:#0e3a2a;border-color:var(--good);color:var(--good)}
.btn.danger{background:#3d1118;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ctlbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 6px}
.ctlbar .spacer{flex:1}
/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;min-height:44px;background:var(--panel2)}
label.opt:hover{border-color:var(--line2);background:var(--panel3)}
label.opt input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.optText{flex:1}
.mark{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:2px 8px;margin-left:10px;white-space:nowrap;vertical-align:middle}
.m-ok{background:#0e3a2a;color:var(--good);border:1px solid var(--good)}
.m-bad{background:#3d1118;color:var(--bad);border:1px solid var(--bad)}
.m-miss{background:#33270c;color:var(--warn);border:1px solid var(--warn)}
.m-dim{background:var(--panel3);color:var(--faint);border:1px solid var(--line)}
.st-ok{border-color:var(--good)!important;background:rgba(61,220,151,.10)!important}
.st-bad{border-color:var(--bad)!important;background:rgba(255,107,122,.10)!important}
.st-miss{border-color:var(--warn)!important;background:rgba(255,200,87,.08)!important}
/* ---------- match / sort / bank ---------- */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pool,.slots{display:flex;flex-direction:column;gap:8px}
.slot{min-height:52px;border:2px dashed var(--line2);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--panel2)}
.slot .ph{color:var(--faint);font-size:14px}
.slot.over{border-color:var(--accent);background:#12233c}
.bslot{display:inline-block;min-width:86px;min-height:34px;border:2px dashed var(--line2);border-radius:8px;padding:2px 10px;text-align:center;cursor:pointer;background:var(--panel2);font-family:var(--mono)}
.bslot.filled{border-style:solid;border-color:var(--accent);color:var(--accent)}
.bslot.over{border-color:var(--accent)}
.chipItem{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--line2);border-radius:10px;background:#1b2742;cursor:pointer;font-size:15px;gap:8px}
.chipItem:hover{background:#223055}
.chipItem.selected{border-color:var(--accent);background:#12233c;box-shadow:0 0 0 2px rgba(92,200,255,.35)}
.chipItem[draggable=true]{user-select:none}
.bucket{border:2px dashed var(--line2);border-radius:12px;padding:10px;min-height:96px;background:var(--panel2)}
.bucket h4{margin:0 0 8px;font-size:15px;color:var(--muted)}
.bucket.over{border-color:var(--accent)}
.bucket .dropzone{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.poolbox{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0d1526;margin:0 0 12px}
.poolbox .dropzone{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.poolbox .ph,.bucket .ph2{color:var(--faint);font-size:13px;align-self:center}
/* ---------- order ---------- */
.orow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:8px 10px;margin:0 0 8px;min-height:52px}
.orow.over{border-color:var(--accent)}
.orow[draggable=true]{cursor:grab}
.onum{font-family:var(--mono);color:var(--faint);width:22px;text-align:right;flex:none}
.otext{flex:1}
.obtns{display:flex;gap:4px;flex:none}
.obtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line2);background:#1b2742;color:var(--text);font-size:17px;cursor:pointer}
.obtn:hover{background:#223055}
/* ---------- input ---------- */
.inputrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tin{background:#0a0f1c;border:1px solid var(--line2);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:15px;padding:10px 14px;min-width:220px;min-height:44px}
.unit{color:var(--muted);font-size:14px}
/* ---------- terminal ---------- */
.term{background:#070c17;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thead{background:var(--panel3);padding:6px 12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tscroll{max-height:300px;overflow:auto;padding:10px 12px;font-family:var(--mono);font-size:14.5px;line-height:1.5}
.tline{white-space:pre-wrap;word-break:break-word}
.tinrow{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:14.5px}
.tprompt{color:var(--good);white-space:nowrap}
.tin2{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--mono);font-size:14.5px;min-height:32px;outline:none}
/* ---------- log viewer ---------- */
.logbox{background:#070c17;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 14px}
.logtop{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--panel3);flex-wrap:wrap}
.logfilter{background:#0a0f1c;border:1px solid var(--line2);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:14px;padding:6px 10px;min-height:36px;min-width:180px}
pre.log{margin:0;padding:10px 12px;font-family:var(--mono);font-size:14px;line-height:1.55;overflow:auto;max-height:320px;white-space:pre-wrap;word-break:break-word}
.logline{display:block}
.lt{color:var(--faint)}
.lvl-e{color:var(--bad);font-weight:700}
.lvl-w{color:var(--warn);font-weight:700}
.lvl-g{color:var(--good)}
.lip{color:var(--violet)}
.lq{color:#8fd6ff}
/* ---------- config / ticket / table ---------- */
.clines{margin:0;padding:10px 12px;list-style:none;font-family:var(--mono);font-size:14.5px}
.cline{display:flex;gap:10px;padding:2px 0}
.cline .ln{color:var(--faint);min-width:26px;text-align:right;flex:none;user-select:none}
.cline.hl-ok{background:rgba(61,220,151,.10);outline:1px solid var(--good);border-radius:4px}
.cline.hl-bad{background:rgba(255,107,122,.12);outline:1px solid var(--bad);border-radius:4px}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.ticket dt{color:var(--faint);font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.ticket dd{margin:0}
table.tbl{border-collapse:collapse;width:100%;font-size:15px}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left}
table.tbl th{background:var(--panel3);color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
/* ---------- triage ---------- */
.trow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px;margin:0 0 10px}
.trow select{min-height:44px;min-width:190px;background:#0a0f1c;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:14px}
.tctx{color:var(--faint);font-size:13px}
/* ---------- branch ---------- */
.bstep{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px;margin:0 0 12px}
.bstep .stepno{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--violet);text-transform:uppercase}
.bchoices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bchoice{text-align:left;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:#1b2742;color:var(--text);padding:10px 14px;cursor:pointer;font-size:15px}
.bchoice:hover{background:#223055}
.bchoice.picked{border-color:var(--accent);background:#12233c}
.boutcome{margin-top:10px;border-left:4px solid var(--line2);background:#0d1526;border-radius:0 10px 10px 0;padding:8px 12px;color:var(--muted);font-size:14.5px}
/* ---------- feedback ---------- */
.fb{margin-top:14px}
.fbline{display:flex;gap:8px;align-items:baseline;padding:6px 10px;border-radius:8px;margin:0 0 6px;font-size:14.5px;background:var(--panel2);border:1px solid var(--line)}
.scoreline{font-weight:800;font-size:15px;margin:10px 0}
.expl{border-left:4px solid var(--good);background:#0e2a1f;border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0 0}
.expl h4{margin:0 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--good)}
.expl.bad{border-color:var(--warn);background:#2c220d}
.expl.bad h4{color:var(--warn)}
.tips{border-left:4px solid var(--accent);background:#0f1d31;border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0 0;font-size:14.5px}
.hintbox{border-left:4px solid var(--violet);background:#1b1430;border-radius:0 10px 10px 0;padding:8px 12px;margin:10px 0;font-size:14.5px}
.skipnote{border:1px dashed var(--warn);background:#33270c;color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
/* ---------- intro / results ---------- */
.intro h1{font-size:22px;margin:0 0 4px}
.intro .sub{color:var(--muted);margin:0 0 14px}
.factgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.fact .v{font-size:17px;font-weight:800}
.kwgroup{margin:10px 0}
.kwgroup h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kw{display:inline-block;background:var(--panel3);border:1px solid var(--line2);border-radius:999px;padding:3px 12px;margin:0 6px 6px 0;font-size:13.5px}
.cert{border:2px solid var(--good);background:linear-gradient(160deg,#0e2a1f,#101a2e);border-radius:16px;padding:26px;text-align:center}
.cert.fail{border-color:var(--bad);background:linear-gradient(160deg,#2c0f16,#101a2e)}
.cert .verdict{font-size:34px;font-weight:900;letter-spacing:.08em}
.cert.pass .verdict{color:var(--good)}
.cert.fail .verdict{color:var(--bad)}
.cert .bigscore{font-size:22px;margin:6px 0 2px}
.cert .meta{color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.rrow{border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin:0 0 10px}
.rrow summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:44px}
.rrow .rno{font-family:var(--mono);color:var(--faint);font-size:13px}
.rrow .rtitle{font-weight:700;flex:1;min-width:160px}
.rrow .rpts{font-family:var(--mono);font-size:13.5px;color:var(--muted)}
.rbody{padding:0 16px 14px}
.badge{font-size:11px;font-weight:800;letter-spacing:.08em;border-radius:6px;padding:3px 10px}
.badge.full{background:#0e3a2a;color:var(--good);border:1px solid var(--good)}
.badge.partial{background:#33270c;color:var(--warn);border:1px solid var(--warn)}
.badge.zero{background:#3d1118;color:var(--bad);border:1px solid var(--bad)}
.badge.skipped{background:#2a2110;color:var(--warn);border:1px dashed var(--warn)}
.kv{margin:8px 0}
.kv .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.kv .v{margin:2px 0 0}
/* ---------- toasts / modal / misc ---------- */
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#223055;border:1px solid var(--accent);color:var(--text);border-radius:10px;padding:10px 18px;font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.45);animation:pop .2s ease}
.toast.warn{border-color:var(--warn);background:#33270c}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.modal{position:fixed;inset:0;background:rgba(4,8,18,.72);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;max-width:460px;width:100%}
.pausecover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,12,23,.55);z-index:10;font-size:18px;font-weight:700;color:var(--text)}
.stagewrap{position:relative}
.blurred{filter:blur(14px);pointer-events:none;user-select:none}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
@media (max-width:820px){
  .mgrid{grid-template-columns:1fr}
  .trow{grid-template-columns:1fr}
  .trow select{width:100%}
  .exam-name{max-width:60vw}
  .nav{grid-template-columns:repeat(auto-fill,minmax(44px,44px))}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hud" id="hud" hidden>
    <div class="hud-row">
      <div class="brand">
        <span class="sev-badge" id="sevBadge"></span>
        <div>
          <div class="exam-name" id="examName"></div>
          <div class="cand" id="candChip" hidden></div>
        </div>
      </div>
      <div class="hud-right">
        <span class="chip" id="scoreChip">Score 0 / 0 pts</span>
        <span class="chip timer" id="timerChip" role="timer" aria-label="Time remaining">--:--</span>
        <button class="btn small ghost" id="pauseBtn" aria-pressed="false">Pause</button>
        <button class="btn small danger" id="finishBtn">Finish exam</button>
      </div>
    </div>
    <div class="pauseflags" id="pauseFlags" hidden></div>
    <div class="hud-row2">
      <div class="pbar" aria-hidden="true"><div id="pbarFill"></div></div>
      <div class="themechips" id="themeChips"></div>
    </div>
    <div class="navwrap">
      <div id="nav" class="nav" role="navigation" aria-label="Question navigator"></div>
      <div class="legend" id="legend">
        <i style="background:#0e3a2a;border-color:#3ddc97"></i>checked OK<br>
        <i style="background:#3a2f0e;border-color:#ffc857"></i>partial<br>
        <i style="background:#3d1118;border-color:#ff6b7a"></i>checked wrong<br>
        <i style="background:#33270c;border-color:#ffc857;border-style:dashed"></i>skipped<br>
        <i style="background:transparent"></i>not answered yet
      </div>
    </div>
