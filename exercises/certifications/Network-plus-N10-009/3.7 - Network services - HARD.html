<style>

*{box-sizing:border-box}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;transition:background .15s,border-color .15s,transform .06s}

.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}

#greet{color:var(--ok);font-weight:600;min-height:1em}
.startwrap{display:flex;gap:12px;align-items:center;margin:18px 0}

/* ---------- header ---------- */
#hdr{background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
.hdr-row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#hdr-title{font-weight:700;font-size:16px}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#timer{font-family:var(--mono);font-size:16px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;min-width:86px;text-align:center}

#timer.crit{color:var(--bad);border-color:var(--bad)}
#pausebar{margin:8px 0 2px;display:flex;gap:8px;flex-wrap:wrap}
.pmsg{display:inline-flex;align-items:center;gap:7px;background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);border-radius:9px;padding:6px 12px;font-size:14px;font-weight:600}
.pmsg.manual{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.progresswrap{height:10px;background:#0e1626;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 6px}

.hdr-row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--tx2)}

.tchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
.tchip b{color:var(--tx)}
.kwsub{margin:-4px 0 8px;color:var(--tx2);font-size:14px}

/* ---------- exercise layout ---------- */
.excard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:4px}
.exhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.exnum{font-weight:800;color:var(--acc)}
.extheme{font-size:12.5px;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.expts{margin-left:auto;font-size:13px;color:var(--tx3)}
.block{border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden}
.block .lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:1.1px;color:var(--tx3);background:var(--panel2);padding:7px 12px;border-bottom:1px solid var(--line)}
.block .bd{padding:12px 14px}
.block.scn .lbl{color:var(--acc)}
.block.q .lbl{color:var(--vio)}
.block.ans .lbl{color:var(--ok)}
.block.scn{border-left:4px solid var(--acc)}
.block.q{border-left:4px solid var(--vio)}
.block.ans{border-left:4px solid var(--ok)}
.blurred{filter:blur(9px);pointer-events:none;user-select:none}
.locked{pointer-events:none}

/* ---------- logs / artefacts ---------- */
.logwrap{background:#0a0f1a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.logtitle{font-size:12.5px;color:var(--tx3);font-weight:700;letter-spacing:.6px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filter{min-height:44px;max-width:280px}
.loglines{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:14px;line-height:1.6;max-height:340px;overflow:auto}
.loglines li{white-space:pre-wrap;word-break:break-word;padding:1px 0;border-bottom:1px dotted #1c2740}
.loglines .ln{color:var(--tx3);margin-right:10px;user-select:none}
.loghit{background:#33270f;border-radius:4px}

/* ---------- answers: options ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;min-height:44px;padding:10px 12px;margin:7px 0;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.opt .marker{flex:0 0 auto;font-family:var(--mono);font-weight:700;color:var(--acc)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.stateline{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.ok .stateline{color:var(--ok)}
.opt.bad .stateline{color:var(--bad)}

/* ---------- bank chips / slots (dnd, fill) ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chipbtn{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:14.5px}
.chipbtn.held{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 2px var(--accbg)}
.chipbtn[disabled]{opacity:.5;cursor:default}
.slots{display:grid;gap:10px;margin-top:8px}
.slot{border:2px dashed var(--line2);border-radius:11px;padding:10px 12px;min-height:56px;background:#0e1626;cursor:pointer}
.slot.over{border-color:var(--acc);background:var(--accbg)}
.slot .slbl{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.slot.ok{border-color:var(--ok)}
.slot.bad{border-color:var(--bad)}
.placed{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:4px 6px 4px 12px;margin:3px 5px 3px 0;font-size:14px}
.placed .x{min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--tx2)}
.filltext{font-size:15.5px;line-height:2}
.filltext select{margin:0 3px;font-family:var(--mono);font-size:14px;padding:4px 8px;min-height:44px}
select.ok{border-color:var(--ok);background:var(--okbg)}
select.bad{border-color:var(--bad);background:var(--badbg)}

/* ---------- match ---------- */
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol .colh{font-size:12.5px;font-weight:700;color:var(--tx3);letter-spacing:1px;margin-bottom:6px}
.mitem{display:block;width:100%;text-align:left;min-height:44px;padding:9px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.mitem.sel{border-color:var(--acc);background:var(--accbg)}
.mitem.ok{border-color:var(--ok);background:var(--okbg)}
.mitem.bad{border-color:var(--bad);background:var(--badbg)}
.mitem[disabled]{cursor:default;opacity:.85}
.pairlist{margin-top:10px}
.pairline{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin:5px 0;font-size:14px;flex-wrap:wrap}
.pairline .x{min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--tx2)}
.pairline .arr{color:var(--acc)}
@media(max-width:720px){.matchwrap{grid-template-columns:1fr}}

/* ---------- ordering ---------- */
.ordlist{list-style:none;margin:8px 0;padding:0}
.rowitem{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;margin:7px 0;cursor:grab;touch-action:none}
.rowitem.dragging{opacity:.55;border-style:dashed}
.rowitem .pos{font-family:var(--mono);font-weight:700;color:var(--acc);min-width:26px;text-align:center}
.rowitem .txt{flex:1}
.rowitem.ok{border-color:var(--ok);background:var(--okbg)}
.rowitem.bad{border-color:var(--bad);background:var(--badbg)}
.mv{min-height:44px;min-width:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer}

/* ---------- terminal ---------- */
.shell{background:#070b13;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:14.5px}
.termhist{margin:0 0 8px;padding:0;list-style:none;white-space:pre-wrap;word-break:break-word;color:var(--tx2)}
.termrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.termrow .pr{color:var(--ok);font-weight:700;white-space:nowrap}
.termrow input{flex:1;min-width:220px}
.helpbox{background:var(--accbg);border:1px solid var(--acc);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:14.5px}
.hintbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:14.5px}

/* ---------- branching ---------- */
.stg{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:#0e1626}
.stg .sth{font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--vio);margin-bottom:6px}
.outcome{border-left:3px solid var(--acc);background:var(--accbg);border-radius:0 9px 9px 0;padding:8px 12px;margin:8px 0;font-size:14.5px;color:var(--tx2)}

/* ---------- spot the mistake ---------- */
.codelines{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:14px}
.codelines li{margin:4px 0}
.codelines button{display:flex;width:100%;text-align:left;gap:10px;min-height:44px;padding:7px 10px;background:#0a0f1a;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:14px;color:var(--tx)}
.codelines button .ln{color:var(--tx3);min-width:26px}
.codelines button.sel{border-color:var(--acc);background:var(--accbg)}
.codelines button.ok{border-color:var(--ok);background:var(--okbg)}
.codelines button.bad{border-color:var(--bad);background:var(--badbg)}

/* ---------- feedback ---------- */
.fb{margin-top:12px}
.fbline{font-weight:800;font-size:15.5px}
.fbline.good{color:var(--ok)}
.fbline.part{color:var(--warn)}
.fbline.zero{color:var(--bad)}
.elems{margin:8px 0;padding:0;list-style:none}
.elems li{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:14.5px}
.elems .ic{font-weight:800;flex:0 0 auto}
.elems .ic.g{color:var(--ok)} .elems .ic.r{color:var(--bad)}
.explain{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:11px 14px;margin:10px 0 4px;font-size:15px}
.explain b{color:var(--acc)}
.locknote{font-size:13px;color:var(--tx3);margin-top:6px}

/* ---------- footer nav & navigator ---------- */
#footnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 8px;padding:10px 0 6px}
#footnav .spacer{flex:1}
#navgrid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.ncell{width:44px;height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:13.5px;color:var(--tx2);position:relative}
.ncell.cur{outline:3px solid var(--acc);outline-offset:1px}
.ncell.f{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.ncell.p{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.ncell.z{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.ncell.s{border-style:dashed;border-color:var(--warn);color:var(--warn)}

/* ---------- results ---------- */
.verdict{border-radius:16px;padding:26px 22px;text-align:center;border:1px solid;margin:10px 0}
.verdict.pass{border-color:var(--ok);background:linear-gradient(180deg,#0f2b1a,#0d1a2b)}
.verdict.fail{border-color:var(--bad);background:linear-gradient(180deg,#2b1215,#160f1f)}
.verdict .big{font-size:34px;font-weight:800;letter-spacing:2px}
.verdict.pass .big{color:var(--ok)}
.verdict.fail .big{color:var(--bad)}
.verdict .sub{color:var(--tx2);margin-top:8px}
.verdict .cert{margin:14px auto 0;max-width:460px;background:var(--panel);border:1px dashed var(--ok);border-radius:12px;padding:14px}
.ressum{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.rescard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.rescard .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rlab{font-size:12.5px;font-weight:800;letter-spacing:.8px;border-radius:999px;padding:3px 10px;border:1px solid}
.rlab.full{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.rlab.partial{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.rlab.zero{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.rlab.skipped{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.rya,.rca{font-size:14.5px;margin:7px 0}
.rya .k{color:var(--tx3)} .rca .k{color:var(--tx3)}
.rtipline{font-size:14px;color:var(--acc)}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(4,7,12,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;max-width:520px;width:100%}
.mbox h3{margin-top:0}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#33270f;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:11px 18px;z-index:120;max-width:90vw;transition:opacity .3s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media (max-width:640px){
  #app{padding:10px 10px 40px}
  .excard{padding:12px}
  .hdr-right{margin-left:0}
}

</style>

{ id:"H01", th:0, ty:"logview", ctl:"choice", ttl:"The offers that never arrived",
  scn:"After a switch swap last night, staff on floor 3 report “no network”. Your DHCP server logs look healthy and its pools are fine; clients show APIPA. You pull the access switch log.",
  q:"What is the actual fault?",
  logs:[{ src:"sw-access-3F.log — since 06:00", lines:[
    "06:02:11 %LINK-3-UPDOWN: Interface Gi1/0/24, changed state to up (uplink to core)",
    "06:02:15 ip dhcp snooping: enabled on VLAN 20 (config restored from template)",
    "06:12:39 DHCP_SNOOPING-5-UNTRUSTED_OFFER: Offer from 10[.]20[.]100[.]5 on Gi1/0/24 (untrusted) dropped",
    "06:12:44 DHCP_SNOOPING-5-UNTRUSTED_ACK: Ack from 10[.]20[.]100[.]5 on Gi1/0/24 (untrusted) dropped",
    "07:31:02 DHCP_SNOOPING-5-UNTRUSTED_OFFER: Offer from 10[.]20[.]100[.]5 on Gi1/0/24 (untrusted) dropped",
    "08:44:50 DHCP_SNOOPING-5-UNTRUSTED_OFFER: Offer from 10[.]20[.]100[.]5 on Gi1/0/24 (untrusted) dropped"
  ]}],
  opts:[
    { t:"The restored template left the server's uplink port untrusted — mark Gi1/0/24 trusted", ok:true },
    { t:"A rogue DHCP server at 10[.]20[.]100[.]5 is answering on the uplink and must be hunted down", ok:false },
    { t:"DHCP starvation has exhausted the scope, so the real server cannot offer any leases today", ok:false },
    { t:"The DHCP relay's ip helper-address was removed from the core during last night's swap", ok:false }
  ],
  hint:"Read the address in the dropped offers, then ask who owns it — and what last night's swap changed.",
  tip:"Snooping drops “offers from untrusted ports” for two very different reasons: a real rogue, or a legitimate server whose uplink lost its trust flag.",
  xpl:"Every dropped offer comes from <b>10[.]20[.]100[.]5 — your real DHCP server</b> — and arrives on the uplink port. The nightly switch swap restored a snooping template that left the uplink <b>untrusted</b>, so every legitimate OFFER/ACK is discarded as if rogue; clients starve into APIPA while the server side looks perfect. A rogue server would show offers from a foreign address on an access port; starvation would show pool exhaustion in the server logs. Fix: trust the uplink and any relay path, then watch the binding table refill." },

{ id:"H02", th:0, ty:"spot", ttl:"The scope the contractor built",
  scn:"A contractor built a new scope for the printers VLAN last night. This morning, some printers are online and others hold addresses that reach nothing. The helpdesk has renamed the ticket three times.",
  q:"Click the line that breaks this scope, then pick the reason.",
  code:[
    "subnet 172[.]20[.]8[.]0 netmask 255[.]255[.]255[.]240 {",
    "    range 172[.]20[.]8[.]10 172[.]20[.]8[.]20;",
    "    option routers 172[.]20[.]8[.]1;",
    "    option domain-name-servers 172[.]20[.]8[.]53;",
    "    default-lease-time 86400;",
    "    host p-lab-7 { hardware ethernet 00:0d:b9:44:01:07; fixed-address 172[.]20[.]8[.]9; }",
    "}"
  ],
  wl:1,
  rs:[
    { t:"The pool hands out addresses outside the subnet, so clients get unroutable IPs", ok:true },
    { t:"The router option points at an address outside this subnet", ok:false },
    { t:"The DNS server option is missing from the scope entirely", ok:false },
    { t:"A 24-hour default lease is far too short for network printers", ok:false },
    { t:"The fixed-address reservation hands out an address inside the dynamic range", ok:false }
  ],
  hint:"A /28 (255[.]255[.]255[.]240) leaves usable hosts .1–.14 in the last octet — count where the pool's end lands.",
  tip:"A dynamic range must sit inside its subnet: /28 → 172[.]20[.]8[.]1–14 usable, .15 broadcast; anything beyond belongs to another network.",
  xpl:"A <b>/28</b> mask gives hosts 172[.]20[.]8[.]1 through 172[.]20[.]8[.]14, with .15 as broadcast. The dynamic <b>range</b> stretches to 172[.]20[.]8[.]20 — six addresses that belong to a different network. Clients receiving .15–.20 get addresses their gateway refuses to route: “offline printers”. The gateway (.1) and DNS (.53) options are fine, the 24-hour printer lease is normal, and the <b>reservation</b> for p-lab-7 (.9) sits outside the range .10–.20, so it cannot collide with it. Fix the range to .10–.14 — or re-mask the VLAN — and consider an <b>exclusion</b> for statically addressed devices if you re-number; if the VLAN ever outgrows one subnet, a <b>superscope</b> bundles the additional scopes on the same wire." },

{ id:"H03", th:0, ty:"fill", ttl:"Reverse-engineer the EUI-64",
  scn:"Your inventory is stale and a printer must be physically located by MAC. The printer uses SLAAC with EUI-64 (privacy extensions disabled). Its current address on prefix 2001:db8:2:40::/64 is 2001:db8:2:40:020d:b9ff:fe11:c3a4/64.",
  q:"Rebuild the MAC from the interface identifier — three blanks.",
  text:"Remove the inserted {{0}} bytes from the middle of 020d:b9ff:fe11:c3a4, leaving 02:0d:b9:11:c3:a4. Then flip the {{1}} bit of the first octet back, so 02 becomes {{2}}. The printer's MAC is 00:0d:b9:11:c3:a4 — match it in the inventory and close the ticket.",
  bank:["FF:FE","7th","00","FF:FF","8th","02"],
  blanks:[ { a:["ff:fe","fffe"] }, { a:["7th","seventh","u/l","universal/local"] }, { a:["00","0"] } ],
  hint:"Undo the two EUI-64 steps in reverse order: strip the inserted bytes, then un-flip one bit.",
  tip:"Reverse EUI-64: delete FF:FE from the middle, then flip bit 7 back (02→00, 03→01, 0a→08…).",
  xpl:"To trace an EUI-64 address back to hardware, run the recipe backwards. The middle of the identifier always holds the inserted <b>FF:FE</b> — remove it. Then the first octet's <b>seventh bit</b> was flipped by SLAAC, so flip it back: 02→00, 03→01, 0a→08. You get 00:0d:b9:11:c3:a4. The classic trap is stopping after the strip and reporting 02:0d:b9:… — a MAC that looks right but still has the U/L bit set. And this only works because privacy extensions are off: rotating temporary identifiers (used on the same <b>link-local fe80::/10</b> addresses as everywhere else in IPv6) are not derived from the MAC at all." },

{ id:"H04", th:0, ty:"multi", ttl:"Three DHCP failures, one vocabulary",
  scn:"A post-incident review argues about words: was it starvation, a rogue server, or plain exhaustion? You close the argument with precise statements.",
  q:"Select every correct statement (6 are correct).",
  opts:[
    { t:"Starvation floods DISCOVERs from fake MACs until the real pool is empty", ok:true },
    { t:"A rogue server hands out its own offers, often with the attacker as gateway", ok:true },
    { t:"Natural growth alone can exhaust a scope without any attack", ok:true },
    { t:"DHCP snooping stops OFFER/ACK on untrusted ports and builds a binding table", ok:true },
    { t:"At T1 the client renews unicast; at T2 it renews by broadcast", ok:true },
    { t:"DHCPv6 runs Solicit, Advertise, Request, Reply — IPv4's DORA with new names", ok:true },
    { t:"Starvation requires the attacker to answer the offers it triggered", ok:false },
    { t:"A scope sitting at 100% utilisation always proves an attacker is present", ok:false },
    { t:"APIPA addresses on many clients prove a rogue DHCP server is active", ok:false }
  ],
  hint:"Three distractors each jump to a conclusion the evidence cannot support — or invent a requirement the attack does not have.",
  tip:"Separate the three DHCP failures: starvation (pool drained), rogue (wrong answerer), exhaustion (capacity) — snooping is the common defence.",
  xpl:"Keep the three phenomena apart. <b>Starvation</b> is pure volume: fake MACs drain the pool and the attacker never answers anything. A <b>rogue server</b> is a different animal — it answers offers and usually poisons option 3 so traffic flows through the attacker. <b>Exhaustion</b> can be innocent growth. <b>Snooping</b> is the switch-side defence, <b>T1/T2</b> are routine renewal behaviour, and DHCPv6 runs its own four-message dance (<b>Solicit, Advertise, Request, Reply</b>). Remember the options too: a rogue server usually poisons <b>option 3</b> (gateway), but wrong <b>option 6</b> (DNS), <b>option 15</b> (domain suffix) or a broken <b>option 150</b> for VoIP phones are the same class of fault. The distractors over-conclude: starvation needs no answers, 100% utilisation is not proof of attack, and APIPA only says “no offer reached me” — any of the three causes can explain it." },

{ id:"H05", th:1, ty:"branch", ttl:"Run the poisoning response",
  scn:"11:30. Users report the supplier portal asking for credentials twice, with a certificate warning. The internal resolver serves 4,000 clients. You have resolver admin rights and a maintenance window nobody is watching.",
  q:"Walk the incident. Choose the best action at each step.",
  stages:[
    { p:"Before touching anything — what proves or disproves poisoning?", okT:"Compare the resolver's answer with the authoritative answer",
      opts:[
        { t:"Query the resolver and the authoritative server separately; compare both answers", ok:true, out:"Resolver says 203[.]0[.]113[.]66; the authoritative server says 198[.]51[.]100[.]80. The cache is poisoned." },
        { t:"Reboot the resolver first and check whether the user complaints stop coming in", ok:false, out:"The reboot flushes the cache — you “fixed” it while destroying the only evidence you had." },
        { t:"Ask the users to switch to public resolvers until the portal starts answering", ok:false, out:"4,000 clients re-homed to a public resolver: the incident spreads beyond your control." },
        { t:"Lower the TTL on the portal's records so stale answers age out faster", ok:false, out:"TTLs are the portal owner's lever, not yours — and the poisoned entry ignores them anyway." }
      ]},
    { p:"Containment — what stops the harm without destroying evidence?", okT:"Flush the cache and cut clients over to a clean resolver",
      opts:[
        { t:"Flush the resolver's cache and point clients at the secondary while you investigate", ok:true, out:"Poison gone, users recover, and the clean secondary serves answers while you investigate." },
        { t:"Flush the cache and carry on — once the entries clear, no further action is needed", ok:false, out:"The poison was re-injected twice within the hour; flushing alone is a treadmill." },
        { t:"Firewall off all UDP 53 between the clients and the resolver to stop queries", ok:false, out:"You just cut 4,000 clients off DNS entirely — containment became an outage." },
        { t:"Wait for the poisoned entries to expire naturally as their TTLs run down", ok:false, out:"The forged record carries a one-hour TTL; that is an hour of credential theft." }
      ]},
    { p:"Which hardening actually closes this door?", okT:"Enable DNSSEC validation and modern resolver hygiene",
      opts:[
        { t:"Enable DNSSEC validation, patch the resolver, keep port randomisation on", ok:true, out:"The next forged reply fails validation; the postmortem ships with the fix, not just the story." },
        { t:"Add the correct address to the hosts file on every client machine", ok:false, out:"An unmanageable band-aid that fixes one name and teaches the wrong lesson." },
        { t:"Increase the DNS TTLs on the portal's records so forged entries live even longer", ok:false, out:"That is backwards — longer TTLs make poison stick longer." },
        { t:"Disable recursion for internal clients to keep them from asking at all", ok:false, out:"Internal clients are supposed to recurse through you; disabling it breaks the design without touching the flaw." }
      ]}
  ],
  hint:"Prove → stop the bleeding → make the whole class of attack impossible, in that order.",
  tip:"Poisoning IR: verify against authoritative, flush + contain (logs first!), then DNSSEC + patching + port randomisation.",
  xpl:"Poisoning response is a three-step ladder. <b>Verify</b>: compare the resolver's cached answer with the authoritative server's — disagreement is proof. <b>Contain</b>: save the logs, flush the cache, move clients to a clean resolver; flushing without containment just re-loses the race. <b>Harden</b>: <b>DNSSEC validation</b> makes forged answers fail outright, current resolver code enforces bailiwick and port randomisation, and DoT upstream protects the forward path. Each wrong branch here is a real-world anti-pattern: destroying evidence, masking symptoms, or causing an outage in containment's name." },

{ id:"H06", th:2, ty:"order", ttl:"Document the NTS handshake",
  scn:"An auditor wants your NTS rollout documented from a client's point of view — cold start to steady state. You write the sequence once, correctly.",
  q:"Order the five stages of an NTS-protected time exchange.",
  items:[
    "The client opens a TLS session to the NTS-KE server on TCP port 4460 and negotiates algorithms",
    "The key-exchange server returns cookies and the address of the NTP server to use",
    "The client sends an NTP request on UDP 123 carrying a cookie and a unique identifier",
    "The server replies — authenticated with AEAD — including a fresh cookie for next time",
    "Steady state: every exchange uses a new unique identifier, so replays of old packets are useless"
  ],
  hint:"TLS first, cookies in the middle, port 123 only after the introductions.",
  tip:"NTS = NTS-KE (TLS, 4460) for keys and cookies, then authenticated NTPv4 on 123 with per-query identifiers.",
  xpl:"<b>NTS</b> splits its work in two. First, <b>NTS-KE</b>: a TLS session on TCP <b>4460</b> negotiates ciphers and hands out <b>cookies</b> — encrypted state that lets the NTP server verify clients without keeping per-client state. Then time itself flows over plain NTP port 123, but every packet carries NTS extension fields: the cookie plus an <b>AEAD</b> authentication tag, and a <b>unique identifier</b> that makes replaying an old exchange pointless. Each response includes fresh cookies, so the client never runs dry. Forged or edited time packets fail authentication, and captured packets cannot be replayed to shift a clock." },

{ id:"H07", th:2, ty:"qcm", ttl:"Buy precision, not hope",
  scn:"A trading desk needs timestamp accuracy under 100 microseconds between the datacentre reference clock and the trading servers, across two switch hops. Current NTP delivers about 10 milliseconds. The CFO asks for the cheapest credible fix.",
  q:"What do you recommend?",
  opts:[
    { t:"Move the trading segment to PTP with hardware timestamping and PTP-aware switches", ok:true },
    { t:"Promote the NTP server to stratum 1 with a new GPS receiver", ok:false },
    { t:"Lower the NTP polling interval on every client from 64 s to 8 s", ok:false },
    { t:"Install a second NTP server and let clients pick whichever has the lowest offset", ok:false }
  ],
  hint:"The gap is a hundredfold — no amount of NTP tuning crosses three orders of magnitude.",
  tip:"Millisecond-to-microsecond jumps need PTP: hardware timestamps and clock-aware switches, not NTP knobs.",
  xpl:"Ten milliseconds to 100 microseconds is a <b>100×</b> gap. NTP's software timestamps and kernel discipline cannot cross it: stratum numbers, polling intervals and extra servers move accuracy by milliseconds at best. <b>PTP (IEEE 1588)</b> is built for this: packets are timestamped in the NIC <b>hardware</b>, switches participate as boundary or transparent clocks so queueing delay is measured and corrected, and a <b>grandmaster</b> elected by the BMCA anchors the timeline. Trading floors, 5G fronthaul and industrial control pay for PTP hardware because no NTP tuning reaches those numbers." },

{ id:"H08", th:0, ty:"dnd", ttl:"Artefacts into buckets",
  scn:"Three tickets arrive in one morning. The SOC lead wants them classified before anyone touches a firewall.",
  q:"Sort the six artefacts into the three buckets.",
  slots:[
    { id:"starv", lb:"DHCP starvation", ks:["c0","c1"] },
    { id:"rogue", lb:"Rogue DHCP server", ks:["c2","c3"] },
    { id:"snoop", lb:"Snooping doing its job", ks:["c4","c5"] }
  ],
  chips:[
    { k:"c0", t:"Hundreds of DISCOVERs per minute from MACs never seen before" },
    { k:"c1", t:"Server log: pool 10[.]20[.]50[.]0/24 at 100% utilisation, 214 leases to unknown hardware" },
    { k:"c2", t:"A client's default gateway (option 3) points at an address that is not your router" },
    { k:"c3", t:"An OFFER arrives for a client before the real server's OFFER does" },
    { k:"c4", t:"An OFFER from an access port is dropped as untrusted" },
    { k:"c5", t:"The switch's binding table grows with legitimate leases" }
  ],
  hint:"Two artefacts per bucket; the third bucket is the defence working, not an attack.",
  tip:"Starvation = volume of fake DISCOVERs; rogue = wrong answers (gateway!); snooping = drops plus a healthy binding table.",
  xpl:"Read artefacts, not vibes. <b>Starvation</b> shows up as request volume from MACs that never appeared before and a pool at 100% with “unknown hardware” leases. A <b>rogue server</b> shows up in the <b>content</b> of answers: option 3 pointing somewhere that is not your router, or offers that win the race against the real server. <b>Snooping</b> working looks like server traffic dropped on untrusted ports plus a growing binding table — that is the defence, not an incident. Same three keywords, three different logs: that is the pattern this exam drills." }
];

{ id:"H09", th:0, ty:"match", ttl:"Match the control to its threat",
  scn:"A security architect review asks each platform owner to state, in one sentence, which attack their control stops. Sloppy answers get bounced, so you prepare exact pairings.",
  q:"Match each control or mechanism to the threat it addresses.",
  pairs:[
    ["DHCP snooping","Rogue DHCP offers arriving on access ports"],
    ["RA guard","Forged Router Advertisements announcing a fake default router"],
    ["M / O / A flags in an RA","Direct hosts to stateful DHCPv6 addressing (M), stateless options only (O), or SLAAC prefixes (A)"],
    ["ND inspection","Spoofed Neighbor Discovery messages built on false address bindings"],
    ["DAD","Two hosts claiming the same IPv6 address on one link"],
    ["NTS","A man-in-the-middle shifting the clocks by tampering with or replaying time packets"]
  ],
  hint:"Two defences are switches watching IPv6, one is a host procedure, one is a flag with a job, one is a crypto upgrade.",
  tip:"snooping→rogue DHCP, RA guard→rogue RAs, ND inspection→false NDP bindings, DAD→address collisions, NTS→time spoofing/replay, M flag→DHCPv6 addressing.",
  xpl:"Each control owns one threat. <b>DHCP snooping</b> watches DHCP: server messages only on trusted ports. <b>RA guard</b> watches Router Advertisements: RAs only from ports where a router is allowed — killing fake “I am your default router” announcements that hosts would otherwise obey after sending a Router Solicitation. <b>ND inspection</b> validates Neighbor Discovery against the switch's binding table, so spoofed neighbour adverts bounce. <b>DAD</b> is the host's own pre-use check for address collisions. The RA's <b>M / O / A flags</b> are not defences but directives — M=1 switches hosts from SLAAC to <b>stateful DHCPv6</b>, O=1 adds stateless options, A=1 enables the prefix for SLAAC. And <b>NTS</b> upgrades time sync with authentication and replay protection so nobody quietly rewrites your clocks." },

{ id:"H10", th:2, ty:"logview", ctl:"multi", ttl:"Triage the source table",
  scn:"An application server “keeps losing Kerberos tickets”. Before blaming Kerberos, you read its time sources properly.",
  q:"Select every correct reading of this output (3 are correct).",
  logs:[{ src:"chronyc sources -v (abbreviated)", lines:[
    "MS Name/IP address         Stratum Reach LastRx Last sample",
    "============================================================================",
    "x ntp-a.corp.example         2    377    12   -114ms[ -114ms] +/- 12ms",
    "  ntp-b.corp.example         1      0    -    +0ns[ +0ns] +/- 0ns",
    "x ntp-c.corp.example         2    377    31   +205ms[+205ms] +/- 19ms",
    "^ ntp-d.pool.example         3    377     8   -1.2ms[ -1.2ms] +/- 21ms",
    "? ntp-e.corp.example        16    377    40   +0ns[ +0ns] +/- 200ms"
  ]}],
  opts:[
    { t:"ntp-a and ntp-c show x — falsetickers whose time disagrees with consensus", ok:true },
    { t:"ntp-b is unreachable: reach 0 means the last eight polls got no answer", ok:true },
    { t:"ntp-e reports stratum 16 — itself unsynchronised, useless as a source", ok:true },
    { t:"ntp-d is the worst source because stratum 3 is too high for production", ok:false },
    { t:"The +/- values at the end of each line are the drift file contents", ok:false }
  ],
  hint:"x marks falsetickers; reach is an octal health map; stratum 16 is NTP's way of saying “I have no time”.",
  tip:"chrony/ntpq triage: x = falseticker, reach 0 = dead, stratum 16 = unsynchronised; only then argue about offsets.",
  xpl:"Three independent faults hide in this table. The <b>x</b> sources are <b>falsetickers</b> — their offsets (−114 ms, +205 ms) disagree with each other and with consensus, so the algorithm rejects them. <b>Reach 0</b> means eight consecutive polls went unanswered — a dead source regardless of stratum. <b>Stratum 16</b> means the source itself declares “not synchronised”. ntp-d is a perfectly normal stratum-3 candidate (stratum is not a quality score by itself), and the ±values are estimated error, not <b>drift</b>. Fix: repair or replace the dead and lying sources, then let the selection algorithm re-converge." },

{ id:"H11", th:2, ty:"fill", ttl:"Name the unhealthy trio",
  scn:"You are writing the runbook entry for reading NTP peer tables. The entry needs three unambiguous indicators that a source is unusable.",
  q:"Complete the runbook sentences.",
  text:"A peer with reach {{0}} is not answering polls at all. A peer showing stratum {{1}} is itself unsynchronised and must not be trusted. A peer marked x by the selection algorithm is a {{2}} — its time disagrees with the consensus of the other sources.",
  bank:["0","16","falseticker","377","1","sys.peer"],
  blanks:[ { a:["0","zero"] }, { a:["16"] }, { a:["falseticker","false ticker"] } ],
  hint:"The three answers are the unhealthy trio every peer table hides in plain sight.",
  tip:"reach 0 = dead, stratum 16 = unsynchronised, x = falseticker. Anything else is tuning, not triage.",
  xpl:"The unhealthy trio in any NTP peer table: <b>reach 0</b> — the octal reachability bitmap is empty, so the last eight polls failed; <b>stratum 16</b> — the source declares itself unsynchronised (usable strata run 1–15); and the <b>falseticker</b> mark x — the selection algorithm rejects the source because its time disagrees with the others. A source can be alive and lying, or dead and honest — the three indicators catch different failure modes, which is why real triage reads reach, stratum and the selection flag together (and treats slow <b>drift</b> as a tuning problem, not an outage)." },

{ id:"H12", th:1, ty:"logview", ctl:"choice", ttl:"Why the partner rejects your mail",
  scn:"Your new outbound mail relay at 198[.]51[.]100[.]25 is intermittently deferred by one partner's gateway. The firewall team swears it is not them.",
  q:"What is the actual fault, and who fixes it?",
  logs:[{ src:"mail.log — outbound relay", lines:[
    "postfix/smtpd[2341]: connect from fe80::21a:2bff:fe3c:4d5e%eth0 (local monitor tap)",
    "postfix/smtp[5122]: connect to mx.partner.example[203[.]0[.]113[.]10]:25 (25)",
    "postfix/smtp[5122]: 4A2B1C: to=<orders@partner.example>, relay=mx.partner.example[203[.]0[.]113[.]10]:25, delay=2.1, dsn=4.7.1, status=deferred (host said: 450 4.7.1 reverse lookup failed for 198[.]51[.]100[.]25)",
    "postfix/smtp[5122]: 4A2B1D: to=<billing@partner.example>, relay=mx.partner.example[203[.]0[.]113[.]10]:25, dsn=4.7.1, status=deferred (no PTR record found)",
    "postfix/smtp[5122]: 4A2B1E: to=<other@corp.example>, relay=mail2.corp.example[198[.]51[.]100[.]26]:25, dsn=2.0.0, status=sent (250 OK)"
  ]}],
  opts:[
    { t:"The relay's address has no PTR record; the ISP owning the block must publish one", ok:true },
    { t:"The partner's gateway is rejecting your SPF record at connect time", ok:false },
    { t:"Your MX priority numbers in the public zone are ordered the wrong way round", ok:false },
    { t:"DKIM signatures are being stripped somewhere along your outbound firewall path", ok:false }
  ],
  hint:"“Reverse lookup failed” and “no PTR record” are literally in the log — the fix lives in the reverse zone.",
  tip:"Receivers check forward-confirmed reverse DNS: a PTR must exist and match the A record, or mail bounces.",
  xpl:"Receiving mail servers routinely punish senders without <b>PTR</b> records — the reverse lookup of the connecting IP. Best practice is <b>forward-confirmed reverse DNS</b>: the PTR of 198[.]51[.]100[.]25 must resolve to a name whose A record maps back to the same address. PTR records live in the reverse zone (in-addr.arpa) controlled by whoever owns the address block — usually your ISP — so the fix is a request to them, not a local button. SPF, DKIM, DMARC and MX priorities are separate mechanisms; none of them appears broken in this log, and your internal delivery (status=sent) confirms the relay itself works." },

{ id:"H13", th:2, ty:"match", ttl:"Name the NTS parts",
  scn:"You are reviewing a vendor's NTS claims. Their whitepaper names the components but never says what each one is for. You write the correct one-liners.",
  q:"Match each NTS component to its role.",
  pairs:[
    ["NTS-KE server","TLS endpoint on TCP 4460 that negotiates keys and hands out cookies"],
    ["NTS cookie","Stateless token letting the NTP server authenticate the client without keeping per-client state"],
    ["AEAD extension fields","Authenticated encryption wrapping the exchange so edits fail validation"],
    ["Unique identifier","Per-query value that makes replaying captured packets pointless"],
    ["Port 123","Where the actual time packets still travel after the handshake"]
  ],
  hint:"One component is an introducer, one is memory-on-the-client, one is the lock, one is the anti-replay trick, one is the road.",
  tip:"NTS-KE (4460) introduces; cookies carry state; AEAD authenticates; unique IDs kill replays; time itself stays on 123.",
  xpl:"<b>NTS</b> reuses NTP rather than replacing it. The <b>NTS-KE</b> server (TLS, TCP <b>4460</b>) is the introducer: it negotiates algorithms and gives the client <b>cookies</b> — blobs whose contents only the NTP server can read, so the server stays stateless at scale. During exchanges on port <b>123</b>, NTS extension fields protected by <b>AEAD</b> authenticate the packet: an on-path attacker cannot edit offsets undetected. Every query also carries a <b>unique identifier</b>, so capturing packets and replaying them later fails. Accuracy is untouched; trustworthiness is transformed." },

{ id:"H14", th:2, ty:"multi", ttl:"Why the clocks drifted",
  scn:"After a routine audit, half the estate shows clock offsets of minutes, Kerberos intermittently fails, and two servers reject each other's replication. You separate real causes from red herrings.",
  q:"Select every plausible cause or true statement (6 are correct).",
  opts:[
    { t:"A firewall rule blocks UDP 123 from clients to the time servers", ok:true },
    { t:"The chosen source reports stratum 16 — it is unsynchronised itself", ok:true },
    { t:"A VM resumed after a month and NTP's step correction broke live tickets", ok:true },
    { t:"NTP authentication keys on one server do not match its peer's", ok:true },
    { t:"Symmetric peers mean two servers exchange time as equals for backup", ok:true },
    { t:"Broadcast mode pushes time to a whole segment but is less accurate", ok:true },
    { t:"The DNS TTL on the time server's name has been set far too short", ok:false },
    { t:"The DHCP lease on the time server's own address expired during the night", ok:false }
  ],
  hint:"Two distractors import DNS and DHCP concepts into a pure time problem.",
  tip:"Time sync fails on blocked 123, dead or unsynchronised sources (stratum 16), huge steps after suspension, and key mismatches; peer and broadcast are legitimate modes.",
  xpl:"Time breaks in specific, diagnosable ways: a firewall eating <b>UDP 123</b>; sources that are dead (<b>reach 0</b>) or claiming <b>stratum 16</b>; virtual machines resuming with enormous offsets that force a <b>step</b> — a sudden jump that invalidates anything measuring across it; and mismatched symmetric keys that make servers reject each other. <b>Symmetric peering</b> (two servers exchanging time as equals) and <b>broadcast mode</b> (one-to-many pushes, lower accuracy) are normal NTP modes, not faults. DNS TTLs and DHCP leases govern names and addresses — they have no seat at the clock table." },

{ id:"H15", th:1, ty:"order", ttl:"Order the poisoning response",
  scn:"You are writing the canonical runbook for cache-poisoning incidents after last month's near-miss. The steps exist; the order in the last draft was wrong and cost the team three hours.",
  q:"Put the six response steps in the correct order.",
  items:[
    "Verify: compare the resolver's cached answer against the portal's authoritative name server",
    "Contain: flush the poisoned cache and move clients to the secondary resolver",
    "Preserve: export resolver logs and the forged packet samples for forensics",
    "Trace: find how the forged replies won — fixed ports, unpatched resolver, open recursion",
    "Harden: enable DNSSEC validation, patch, keep source-port randomisation, consider DoT upstream",
    "Watch: monitor for re-injection and close the ticket with the evidence attached"
  ],
  hint:"Evidence before surgery; surgery before improvements; improvements before the victory lap.",
  tip:"IR order: verify → contain → preserve → trace → harden → watch. Flushing first destroys the evidence.",
  xpl:"Sequence is strategy. <b>Verify</b> before acting — comparing with the authoritative answer turns a hunch into a fact. <b>Contain</b> stops user harm (flush + clean resolver) and <b>preserve</b> keeps the logs the flush would destroy. Only then <b>trace</b> how the forgeries won the race, <b>harden</b> so the whole class of attack fails — <b>DNSSEC</b> validation, patched code, source-port randomisation, encrypted upstream — and <b>watch</b> for re-injection before declaring victory. Hardening first, or flushing before copying logs, are the two classic postmortem regrets." },

{ id:"H16", th:1, ty:"qcm", ttl:"Read the referral on the wire",
  scn:"You capture one exchange on the wire between your resolver and a root server: the resolver asks “A? www.example.org” and the root replies with a list of .org name servers — and no final answer.",
  q:"Which statement matches the capture?",
  opts:[
    { t:"An iterative query — a referral came back and the resolver walks the tree", ok:true },
    { t:"The client's browser performed a recursive query straight to the root server", ok:false },
    { t:"The root server performed full recursion on behalf of the resolver", ok:false },
    { t:"The .org TLD server answered authoritatively with the final A record", ok:false }
  ],
  hint:"Who walks the tree? Root servers never walk it for anyone.",
  tip:"Client → resolver is recursive; resolver → root/TLD/authoritative is iterative referrals; roots do not recurse.",
  xpl:"The division of labour: the client makes one <b>recursive</b> request to its resolver (“final answer, please”). The resolver then works <b>iteratively</b>: it asks the <b>root</b>, which answers with a <b>referral</b> to the .org TLD servers; it asks the TLD, which refers to the domain's <b>authoritative</b> server; that one finally holds the record. Root servers never recurse for anyone — their job is referrals at internet scale. Recognising referral packets on the wire tells you instantly which leg of the journey you are watching." }
];

/* HARD exercises 17-23 */
window.__HARD3 = [
{ id:"H17", th:0, ty:"fill", ttl:"Harden the relayed design",
  scn:"A centralised DHCP server serves 14 VLANs through relays. Design review found the snooping config incomplete, and the red-team report notes that attackers try to strip option 82 from relayed requests.",
  q:"Complete the three blanks.",
  text:"On the router's client-facing interface, {{0}} forwards the clients' broadcasts to the central server. The relay stamps {{1}} into each request so the server can pick the right pool — and should reject relayed requests that arrive without it. On the access switch, DHCP snooping must treat the port toward that router as {{2}}, or the relayed offers are dropped as rogue.",
  bank:["ip helper-address","option 82","trusted","option 67","untrusted","APIPA"],
  blanks:[ { a:["ip helper-address","helper-address","ip helper"] }, { a:["option 82","82"] }, { a:["trusted"] } ],
  hint:"The router command, the stamped option, and the snooping verdict on the relay's port.",
  tip:"Relay design = helper-address on the interface + option 82 stamping + snooping trusting the relay path.",
  xpl:"Relayed DHCP has three moving parts that must agree. The <b>ip helper-address</b> on the client-facing interface turns broadcasts into unicast toward the server. <b>Option 82</b> rides along to identify the circuit and remote port, letting the server choose the correct scope and letting policies bind to physical location — which is why servers should treat missing option 82 on a relayed request as suspicious. And <b>DHCP snooping</b> on the switch must mark the relay's path <b>trusted</b>; otherwise it discards exactly the traffic the design depends on — the HARD log exercise shows that failure mode from the inside." },

{ id:"H18", th:1, ty:"dnd", ttl:"Forward or reverse?",
  scn:"A junior admin pasted records into the wrong zone files twice this week. You build the sorting drill once and pin it to the team channel.",
  q:"Sort the records and statements into the two zone families.",
  slots:[
    { id:"fwd", lb:"Forward zone (corp.example)", ks:["c0","c1","c2","c3","c4"] },
    { id:"rev", lb:"Reverse zone (in-addr.arpa)", ks:["c5","c6"] }
  ],
  chips:[
    { k:"c0", t:"A — www → 198[.]51[.]100[.]20" },
    { k:"c1", t:"AAAA — www → 2001:db8:20::20" },
    { k:"c2", t:"MX — mail handled by mail-gw with priority 10" },
    { k:"c3", t:"CNAME — shop is an alias of www" },
    { k:"c4", t:"TXT — the SPF policy for the domain" },
    { k:"c5", t:"PTR — 25[.]100[.]51[.]198.in-addr.arpa → mail.corp.example" },
    { k:"c6", t:"PTR entries that receiving mail servers check before accepting your mail" }
  ],
  hint:"Two chips are only ever about mapping addresses back to names.",
  tip:"Forward zones map name→IP (A/AAAA/MX/CNAME/TXT…); the reverse zone maps IP→name (PTR) — the thing mail receivers verify.",
  xpl:"Forward zones answer “what is the address of this name?” — <b>A</b>, <b>AAAA</b>, <b>MX</b>, <b>CNAME</b> and <b>TXT</b> all live there. The <b>reverse zone</b> (in-addr.arpa for IPv4, ip6.arpa for IPv6) answers the opposite question with <b>PTR</b> records — and the internet's mail receivers lean on it hard: no matching PTR, no mail (the HARD log exercise shows the rejection live). Reverse zones are administered by whoever owns the address block, usually the ISP, which is why “fix our PTR” is a ticket to them, not a click in your own DNS manager." },

{ id:"H19", th:0, ty:"order", ttl:"Rank the findings",
  scn:"Quarterly review. Four findings from four scans land on your desk at once, and you can only drive one remediation sprint at a time.",
  q:"Rank the four findings: fix first → fix last. One order is defensible; the explanation argues it.",
  items:[
    "The public zone allows AXFR from any address — the entire naming map is one query away",
    "Every firewall's NTP source shows stratum 16 — no device in the estate has trustworthy time",
    "The guest-VLAN DHCP pool sits at 96% utilisation with a conference starting Monday",
    "One lab printer holds an APIPA 169[.]254[.]7[.]44 address and prints locally only"
  ],
  hint:"Ask two questions per finding: how many systems are affected, and what does the exposure enable?",
  tip:"Rank by exposure × blast radius: an open zone dump tops a fleet-wide trust failure; a capacity risk beats a single host's cosmetic issue.",
  xpl:"Ranking is exposure times blast radius. An <b>open AXFR</b> is an active, attacker-facing exposure — one query dumps your entire naming map, and the fix takes five minutes. Fleet-wide <b>stratum 16</b> means nothing has trustworthy time, silently rotting certificates, Kerberos and log evidence across the estate. The guest pool at <b>96%</b> is painful but bounded: one VLAN, not yet exhausted, with a known lever (lease time or scope size). The <b>APIPA printer</b> affects one device on one segment. Urgency follows reach and exploitability, not how loud the ticket is." },

{ id:"H20", th:0, ty:"multi", ttl:"Snooping, done properly",
  scn:"A site survey shows DHCP snooping enabled on one trunk and nowhere else, all access ports marked trusted, and option 82 removed “to reduce noise”. You write the correct hardening list.",
  q:"Select every correct hardening step (4 are correct).",
  opts:[
    { t:"Trust only the uplink port toward the real DHCP server", ok:true },
    { t:"Rate-limit DHCP messages on untrusted access ports", ok:true },
    { t:"Enable snooping per VLAN, starting with the client VLANs", ok:true },
    { t:"Feed the binding table into dynamic ARP and ND inspection", ok:true },
    { t:"Mark all access ports trusted so clients are never blocked", ok:false },
    { t:"Disable option 82 processing so the relay stays invisible", ok:false },
    { t:"Enable snooping only on the uplink trunk and nowhere else", ok:false }
  ],
  hint:"Two distractors invert the trust model; one disables a feature that identifies physical ports.",
  tip:"Trust toward the server only, rate-limit clients, enable per VLAN, reuse the binding table — anything else weakens it.",
  xpl:"Snooping works when the trust model is right. <b>Trusted</b> means only paths toward genuine DHCP authority; trusting access ports re-opens the rogue door. <b>Rate limits</b> on untrusted ports blunt starvation floods. Snooping is enabled <b>per VLAN</b> — doing it only on a trunk protects nothing where clients actually sit. And the <b>binding table</b> it builds is the input for dynamic ARP inspection and ND inspection, so keep the pipeline connected. <b>Option 82</b> is your friend: it stamps the physical origin of relayed requests; removing it hides exactly the information policies and forensics need." },

{ id:"H21", th:1, ty:"branch", ttl:"The guest VLAN and the wrong view",
  scn:"Guest-Wi-Fi users intermittently cannot reach intranet.corp.example, and some see a certificate error. Office users are fine. You suspect the guest VLAN's DNS path.",
  q:"Walk the diagnosis. Choose the best action at each step.",
  stages:[
    { p:"First measurement?", okT:"Compare answers from the guest resolver and the office resolver",
      opts:[
        { t:"From the guest VLAN, dig intranet.corp.example against the guest and office resolvers", ok:true, out:"Guest resolver (a public service) answers 198[.]51[.]100[.]20 — the public web proxy. The office resolver answers 10[.]20[.]5[.]30. Split-brain confirmed." },
        { t:"Reboot the guest wireless controllers and see whether the portal comes back on its own", ok:false, out:"Signal strength was never the problem — name resolution was." },
        { t:"Flush the DNS cache on one guest laptop and retry the portal once more", ok:false, out:"The cache refills with the same wrong answer seconds later." },
        { t:"Check the certificate expiry date on the intranet portal's TLS certificate", ok:false, out:"The certificate is fine — the mismatch comes from answering with the wrong address." }
      ]},
    { p:"Root cause?", okT:"The guest VLAN uses resolvers that only hold the external view",
      opts:[
        { t:"The guest VLAN uses public resolvers, which hold only the external split-DNS view", ok:true, out:"Guest clients reach the public proxy for an internal app — sometimes it fails, sometimes it warns about certificates." },
        { t:"The internal resolver has been poisoning the public one since last night's change", ok:false, out:"Poisoning does not explain a stable, view-consistent wrong answer." },
        { t:"The intranet portal's AAAA record is missing, so IPv6-only guests fail", ok:false, out:"IPv6 has no role here — the IPv4 answer is already wrong." },
        { t:"The TTLs on intranet.corp.example are set far too low for public resolvers", ok:false, out:"TTL changes how long an answer sticks, not which view produced it." }
      ]},
    { p:"The clean fix?", okT:"Serve the guest VLAN from resolvers with the correct view",
      opts:[
        { t:"Point the guest VLAN at internal resolvers carrying the split-horizon views", ok:true, out:"Guests resolve intranet via the internal view; the public view stays untouched; certificate errors vanish." },
        { t:"Publish the internal 10[.]20[.]5[.]30 address as a record in the public zone", ok:false, out:"That leaks internal addressing to the internet — the exact failure split DNS exists to prevent." },
        { t:"Add static hosts-file entries to every guest device, one laptop at a time", ok:false, out:"Unmanageable across guest devices and a security anti-pattern." },
        { t:"Lower the TTL of the public record so later changes propagate faster", ok:false, out:"Wrong view, faster — solves nothing." }
      ]}
  ],
  hint:"One name, two answers — find who is answering, then move the answerer.",
  tip:"Split DNS incidents: measure both views (dig against each resolver), identify which view answered, fix the assignment — never leak private space publicly.",
  xpl:"<b>Split-horizon DNS</b> fails in the wild exactly like this: one name, two truthful-but-different answers, and a client asking the wrong view. The measurement — <code>dig</code> (or <code>nslookup</code>) against both resolvers — settles it in a minute. The root cause is resolver assignment, not records: the guest VLAN uses resolvers that only know the public view. The fix re-points the VLAN at resolvers carrying the right view, with an access policy for guests. The cardinal sin is <b>publishing the private address publicly</b> — that converts a UX bug into an information leak." },

{ id:"H22", th:2, ty:"logview", ctl:"choice", ttl:"Which peer actually wins?",
  scn:"An apprentice insists the server “must be using the GPS clock because stratum 1 is the best”. You show them the table and make them argue with it.",
  q:"Which source is the client actually synced to, and why?",
  logs:[{ src:"ntpq -p on app-04", lines:[
    "     remote           refid      st t when poll reach   delay   offset  jitter",
    "==============================================================================",
    " gps-clock.local   .GPS.            1 u   57   64    0    0.000    0.000   0.000",
    "+ntp1.corp.example ntp0.corp.exampl 2 u   29   64  377    0.311    0.418   0.051",
    "*ntp2.corp.example ntp0.corp.exampl 2 u   22   64  377    0.298    0.201   0.062",
    "+ntp3.corp.example ntp0.corp.exampl 2 u   40   64  377    0.342    0.655   0.097"
  ]}],
  opts:[
    { t:"ntp2 — the starred peer: healthy offset, full reach; the clock peer is dead", ok:true },
    { t:"gps-clock — a stratum 1 source always wins the selection", ok:false },
    { t:"ntp1 — it has the smallest network delay of the reachable peers", ok:false },
    { t:"None — with a stratum-1 source listed, the client refuses all stratum-2 peers", ok:false }
  ],
  hint:"Reach decides life or death before stratum is even considered.",
  tip:"Selection: unreachable sources are out immediately; among the living, offset and jitter order the candidates; * is the winner.",
  xpl:"A <b>stratum 1</b> label buys nothing if the source is dead: <b>reach 0</b> on gps-clock.local removes it from selection entirely. Among the living stratum-2 peers, the algorithm weighs <b>offset</b> and jitter and picks the <b>system peer</b> — the starred line, ntp2, healthy at 377 with the lowest offset. The + peers are kept as candidates, − would be discarded. Reading reach and the selection flags before the stratum column is the habit that separates NTP triage from NTP guessing — the same habit this exam's falseticker exercise drills." },

{ id:"H23", th:2, ty:"qcm", ttl:"The jump that broke the morning",
  scn:"A virtual machine resumed after a month in hibernation. Its clock was 26 days behind. NTP corrected it in one jump at 09:00:00. By 09:00:04 the helpdesk lights up: Kerberos logins fail for that client, a long-running backup re-verifies everything, and one TLS handshake fails.",
  q:"Why did applications break at the moment of correction?",
  opts:[
    { t:"The offset passed the step threshold, so the clock jumped", ok:true },
    { t:"The NTP server was a falseticker and gave the VM a wrong time", ok:false },
    { t:"The VM's drift file was missing, so the correction failed outright", ok:false },
    { t:"Stratum 16 on the VM blocked any correction until it was rebooted", ok:false }
  ],
  hint:"26 days cannot be eased in gently — ask what the protocol does with an offset that large.",
  tip:"Offsets beyond ~128 ms cause a step (instant jump); below that, slew eases the clock. Steps have blast radius — schedule and monitor them.",
  xpl:"NTP corrects small errors by <b>slewing</b> — stretching or shrinking the clock by tiny fractions so time never visibly jumps. Errors beyond the <b>step threshold</b> (about 128 ms) cannot be slewed in any reasonable time, so the daemon <b>steps</b> the clock: one discontinuity, instant correction. A 26-day gap guarantees a step. Applications measuring across the discontinuity — ticket lifetimes, timers, backups comparing timestamps — can fail during it. The professional response: expect steps after suspensions, jump-start VM time deliberately in a maintenance window, and watch dependent services across the jump." }
];

/* HARD exercises 24-30 */
window.__HARD4 = [
{ id:"H24", th:2, ty:"dnd", ttl:"Cast the PTP roles",
  scn:"A PTP deployment spans three buildings. The datacentre core hosts the GPS reference on server GM1. Factory-floor switches correct residence time but do not terminate PTP. Office aggregation switch S5 terminates PTP from the core and re-serves it to its downlinks. PLCs and cameras discipline their clocks from the timeline.",
  q:"Place each device in its PTP role.",
  slots:[
    { id:"gm", lb:"Grandmaster", ks:["c0"] },
    { id:"bc", lb:"Boundary clock", ks:["c1"] },
    { id:"tc", lb:"Transparent clock", ks:["c2"] },
    { id:"sl", lb:"Slave (syncing device)", ks:["c3"] }
  ],
  chips:[
    { k:"c0", t:"Server GM1 with the GPS receiver, anchoring the timeline" },
    { k:"c1", t:"Aggregation switch S5: terminates PTP upstream and regenerates it downstream" },
    { k:"c2", t:"Factory-floor switches that measure and correct their own forwarding delay" },
    { k:"c3", t:"A PLC that receives the time and disciplines its own clock from it" }
  ],
  hint:"Terminating vs correcting vs anchoring vs consuming — four verbs, four roles.",
  tip:"GM = the source (BMCA winner); BC = terminate + regenerate; TC = correct residence time; slave = consumes and disciplines.",
  xpl:"PTP's topology has named roles. The <b>grandmaster</b> is the timeline's anchor — the best clock as decided by the <b>BMCA</b> comparison. A <b>boundary clock</b> terminates PTP on one side and acts as the master on the other, absorbing the load of many slaves and isolating delay. A <b>transparent clock</b> stays out of the master/slave tree but measures exactly how long each packet sat in its queues (<b>residence time</b>) and corrects the packet accordingly — that correction is what makes multi-hop precision possible. Everything else — PLCs, cameras, trading boxes — are <b>slaves</b> that discipline their clocks to the timeline, ideally with <b>hardware timestamping</b>." },

{ id:"H25", th:1, ty:"fill", ttl:"The rollover that broke validation",
  scn:"Right after a DNSSEC key rollover, every validating resolver returns SERVFAIL for corp.example, while non-validating resolvers still answer. The child zone was signed with the new key before the parent was updated.",
  q:"Complete the chain-of-trust diagnosis.",
  text:"The parent (.example) still publishes the old {{0}} record pointing at the previous key. The child zone now serves a new {{1}}, whose {{2}} signatures no longer match what the parent attests. Until the parent publishes the new DS, every validating resolver fails the zone — DNSSEC working as designed.",
  bank:["DS","DNSKEY","RRSIG","SOA","PTR","NS"],
  blanks:[ { a:["ds"] }, { a:["dnskey"] }, { a:["rrsig"] } ],
  hint:"The parent attests to the child's key with one record type; the child answers with its keys and the signatures themselves.",
  tip:"Chain of trust: parent's DS → child's DNSKEY → RRSIG over the records. A DS/key mismatch after rollover = SERVFAIL.",
  xpl:"DNSSEC is a chain: the parent zone publishes a <b>DS</b> record vouching for the child's <b>DNSKEY</b>; those keys verify the <b>RRSIG</b> signatures covering every record set. A key rollover must publish the new key, sign with it, and only then swap the parent's DS — done out of order, the parent attests to a key the child no longer uses, and every validating resolver fails the zone with SERVFAIL (loud wrongness is the design working; silent forgery is what it prevents). The chain anchors at the root trust store, and validators check signature times against their own clocks — one more reason time sync matters." },

{ id:"H26", th:2, ty:"order", ttl:"The BMCA tie-break ladder",
  scn:"Two switches both believe they should be grandmaster, and the network keeps flip-flopping. You settle the election deterministically — by knowing exactly which attribute the BMCA compares first, second, and last.",
  q:"Order the six BMCA comparison criteria from first compared to last.",
  items:[
    "priority1 — operator-set coarse preference, compared first",
    "clockClass — the device's class (a GPS-locked grandmaster class outranks a free-running one)",
    "clockAccuracy — the advertised accuracy of its clock",
    "offsetScaledLogVariance — the stability of its oscillator",
    "priority2 — a second, finer operator preference tie-break",
    "clockIdentity — the final unique tie-break (MAC-based ID)"
  ],
  hint:"Operator preference first, physics second, identity last.",
  tip:"BMCA order: priority1 → clockClass → clockAccuracy → offsetScaledLogVariance → priority2 → clockIdentity.",
  xpl:"When several PTP devices could be master, the <b>BMCA</b> (Best Master Clock Algorithm) compares attribute sets in a fixed order: <b>priority1</b> — a blunt operator knob; then <b>clockClass</b> — what kind of clock the device is, where a GPS-locked one outranks a free-running one; then <b>clockAccuracy</b>; then oscillator stability (<b>offsetScaledLogVariance</b>); then <b>priority2</b> as a finer tie-break; and finally the unique <b>clockIdentity</b>, so the election always ends deterministically. Knowing the order lets you rig an election deliberately — or explain why the “wrong” switch became grandmaster." },

{ id:"H27", th:1, ty:"multi", ttl:"What really stops poisoning",
  scn:"After the near-miss incident, management funds “DNS hardening”. Half the suggestions on the table make things worse. You keep only the ones that work.",
  q:"Select every measure that genuinely reduces cache-poisoning risk (4 are correct).",
  opts:[
    { t:"Randomise the resolver's outgoing query source port (and query ID)", ok:true },
    { t:"Enable DNSSEC validation on the resolver so forged answers fail", ok:true },
    { t:"Run a current, patched resolver version with bailiwick checking", ok:true },
    { t:"Forward to an upstream over DoT so the path cannot be tampered with", ok:true },
    { t:"Enable DoH in every browser so DNS skips your resolver entirely", ok:false },
    { t:"Raise the TTL on all records so forged entries expire more slowly", ok:false },
    { t:"Allow AXFR from any host so secondaries stay current", ok:false }
  ],
  hint:"One distractor hands your DNS to someone else; two make the attacker's life easier.",
  tip:"Anti-poisoning: unpredictable ports/IDs, DNSSEC, patched code, encrypted upstream. Longer TTLs and open AXFR help the attacker.",
  xpl:"Poisoning needs the attacker to guess your query's ID and port and to slip an out-of-bailiwick answer past you. Real defences attack those requirements: <b>randomised ports and IDs</b> (the Kaminsky-era fix), <b>DNSSEC validation</b> (forged answers fail), <b>patched resolver code</b> with strict bailiwick checks, and an <b>encrypted, authenticated upstream</b> such as DoT (TCP 853) or DoH (443) to a trusted resolver. Lock zone transfers the same way — AXFR and IXFR only to known secondaries. The distractors all help the other side: browser <b>DoH</b> bypasses your controls instead of fixing them, longer <b>TTLs</b> make poison stick longer, and open <b>AXFR</b> hands over the map for free." },

{ id:"H28", th:1, ty:"logview", ctl:"choice", ttl:"The view that leaked",
  scn:"ns1 answers queries on both the internal network and the internet. You sample its public interface and freeze at two lines.",
  q:"What is wrong, precisely?",
  logs:[{ src:"ns1 queries (public interface) — sampled", lines:[
    "client 203[.]0[.]113[.]44#51231 (corp.example): query: intranet.corp.example IN A +",
    "client 203[.]0[.]113[.]44#51231 (corp.example): response: intranet.corp.example IN A 10[.]20[.]5[.]30",

function blockEl(cls, label, extra){
  var b = el('div','block ' + cls);
  var l = el('div','lbl','<span>' + label + '</span>' + (extra ? '<span style="margin-left:auto;font-weight:400;letter-spacing:0">' + extra + '</span>' : ''));
  var bd = el('div','bd');
  b.appendChild(l); b.appendChild(bd);
  return b;
}

function buildRt(ex){
  var ty = ex.ty, rt = {};
  if (ty === 'qcm' || ty === 'multi' || ty === 'logview'){
    rt.opts = sh(ex.opts.map(function(o, i){ return { key:'o'+i, t:o.t, ok:!!o.ok }; }));
  }
  if (ty === 'match'){
    rt.left = sh(ex.pairs.map(function(p, i){ return { key:'L'+i, t:p[0] }; }));
    rt.right = sh(ex.pairs.map(function(p, i){ return { key:'R'+i, t:p[1] }; }));
    rt.selL = null;
  }
  if (ty === 'order'){
    rt.seq = sh(ex.items.map(function(_, i){ return 'I'+i; }));
  }
  if (ty === 'dnd'){ rt.chips = sh(ex.chips.slice()); rt.held = null; }
  if (ty === 'fill'){ rt.words = sh(ex.bank); }
  if (ty === 'branch'){ rt.stageOpts = ex.stages.map(function(st){ return sh(st.opts.map(function(o, i){ return { key:'s'+i, t:o.t, ok:!!o.ok, out:o.out }; })); }); }
  if (ty === 'spot'){ rt.rs = sh(ex.rs.map(function(o, i){ return { key:'r'+i, t:o.t, ok:!!o.ok }; })); }
  return rt;
}

function emptyAns(ex){
  switch (ex.ty){
    case 'qcm': return { k:null };
    case 'multi': return { ks:[] };
    case 'match': return { pairs:{} };
    case 'order': return { seq:null, touched:false };
    case 'dnd': return { place:{} };
    case 'fill': return { vals:{}, touched:false };
    case 'logview': return ex.ctl === 'multi' ? { ks:[] } : { k:null };
    case 'branch': return { pick:{} };
    case 'terminal': return { cmd:'' };
    case 'spot': return { line:null, r:null };
  }
  return {};
}

function collectAnswer(i, ex){
  var a = S.ans[i];
  if (!a) return null;
  switch (ex.ty){
    case 'qcm': return a.k != null ? a : null;
    case 'multi': return a.ks.length ? a : null;
    case 'match': return Object.keys(a.pairs).length ? a : null;
    case 'order': return (a.touched && a.seq) ? a : null;
    case 'dnd': return Object.keys(a.place).length ? a : null;
    case 'fill': return a.touched ? a : null;
    case 'logview': return (ex.ctl === 'multi' ? a.ks.length : a.k != null) ? a : null;
    case 'branch': return Object.keys(a.pick).length ? a : null;
    case 'terminal': {
      /* grade what is actually in the input box right now (typed, run, or edited after run).
         An empty input never overwrites a command that was already Run. */
      var tin = document.getElementById('term-in-' + i);
      if (tin && typeof tin.value === 'string' && tin.value.trim()) a.cmd = tin.value;
      return (a.cmd && String(a.cmd).trim()) ? a : null;
    }
    case 'spot': return (a.line != null || a.r) ? a : null;
  }
  return null;
}

/* ---------- drag helper (pointer events: mouse + touch) ---------- */
function makeDrag(handle, getLabel, onDrop){
  handle.addEventListener('pointerdown', function(ev){
    if (ev.button !== undefined && ev.button !== 0) return;
    if (ev.target.closest('button,select,input,a')) return;
    ev.preventDefault();
    var startX = ev.clientX, startY = ev.clientY, moved = false;
    var g = el('div', null, esc(getLabel()));
    g.style.cssText = 'position:fixed;z-index:200;pointer-events:none;background:#18223a;border:1px solid #5aa7ff;border-radius:10px;padding:6px 12px;font-size:14px;color:#eaeef7;max-width:300px';
    document.body.appendChild(g);
    handle.classList.add('dragging');
    function mv(e){
      g.style.left = (e.clientX + 12) + 'px'; g.style.top = (e.clientY + 10) + 'px';
      if (Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY) > 6) moved = true;
      var t = document.elementFromPoint(e.clientX, e.clientY);
      var d = t && t.closest('.droppable');
      Array.prototype.forEach.call(document.querySelectorAll('.droppable.over'), function(x){ x.classList.remove('over'); });
      if (d) d.classList.add('over');
    }
    function up(e){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      var t = document.elementFromPoint(e.clientX, e.clientY);
      var d = t && t.closest('.droppable');
      g.remove(); handle.classList.remove('dragging');
      Array.prototype.forEach.call(document.querySelectorAll('.droppable.over'), function(x){ x.classList.remove('over'); });
      if (moved){ handle.__dragged = true; if (d) onDrop(d.getAttribute('data-drop')); }
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  });
}

/* ---------- per-type answer UIs ---------- */
/* Restore keyboard focus to the same control after a repaint (WCAG focus order). */
function repaintKeepFocus(root, fn){
  var ae = document.activeElement;
  var fk = (ae && root && root.contains(ae) && ae.getAttribute) ? ae.getAttribute('data-fk') : null;
  fn();
  if (fk){
    var n = root.querySelector('[data-fk="' + fk.replace(/"/g, '\\"') + '"]');
    if (n && !n.disabled){ try { n.focus(); } catch (e) {} }
  }
}

function buildAnsUI(ex, ix, rt, ans, bd){

      b.type = 'button';
      b.setAttribute('aria-pressed', rt.held === ch.k ? 'true' : 'false');
      b.dataset.key = ch.k;
      b.setAttribute('data-fk', ch.k);
      b.addEventListener('click', function(){
        if (S.checked[ix] && !S.revise) return;
        if (b.__dragged){ b.__dragged = false; return; }
        rt.held = (rt.held === ch.k) ? null : ch.k;
        repaint();
      });
      makeDrag(b, function(){ return ch.t; }, function(target){
        if (S.checked[ix] && !S.revise) return;
        rt.held = null;
        ans.place[ch.k] = target; repaint();
      });
      bank.appendChild(b);
    });
    if (!bank.querySelector('.chipbtn')) bank.appendChild(el('span',null,'<span style="color:var(--tx3)">all items placed</span>'));
    slots.innerHTML = '';
    ex.slots.forEach(function(sl){
      var d = el('div','slot droppable');
      d.setAttribute('data-drop', sl.id);
      d.innerHTML = '<div class="slbl">&#9635; ' + esc(sl.lb) + '</div>';
      rt.chips.forEach(function(ch){
        if (ans.place[ch.k] !== sl.id) return;
        var pill = el('span','placed');
        pill.dataset.key = ch.k;
        pill.innerHTML = esc(ch.t);
        var x = el('button','x','&#10005;'); x.setAttribute('aria-label','Move “' + ch.t + '” back to the items');
        x.setAttribute('data-fk', 'x' + ch.k);
        x.addEventListener('click', function(){
          if (S.checked[ix] && !S.revise) return;
          delete ans.place[ch.k]; repaint();
          var back = bd.querySelector('.chipbtn[data-key="' + ch.k + '"]');
          if (back) back.focus();
        });
        pill.appendChild(x);
        d.appendChild(pill);
      });
      d.addEventListener('click', function(ev){
        if (S.checked[ix] && !S.revise) return;
        if (ev.target.closest('.placed')) return;
        if (rt.held){
          var k = rt.held; ans.place[k] = sl.id; rt.held = null; repaint();
          var px = bd.querySelector('.placed[data-key="' + k + '"] .x');
          if (px) px.focus();
        }
      });
      slots.appendChild(d);
    });
    });
  }
  bd.appendChild(el('div',null,'<span style="font-size:14px;color:var(--tx3)">Every item belongs to exactly one group. Click-to-place works with keyboard and touch too.</span>'));
  bd.appendChild(bank); bd.appendChild(slots);
  repaint();
}
