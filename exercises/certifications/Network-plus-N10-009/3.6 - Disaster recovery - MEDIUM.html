}

/* ---------------- validation ---------------- */
function normStr(s) { return String(s).trim().toLowerCase().replace(/[\s,]/g, ''); }
/* cur is a POSITION in S.order; the exercise is EXS[S.order[cur]] and its state lives at state[cur] */
function curEx(cur) { return EXS[S.order[cur]]; }
function validate(cur) {
  var ex = curEx(cur), a = S.ans[cur], per = [], raw = 0, i;
  var t = ex.type;
  if (t === 'qcm') {
    if (a.sel === null) return { per: [{ s: 'empty' }], raw: 0, empty: true };
    raw = a.sel === ex.qcm.correct ? 1 : 0;
    per = [{ s: raw >= 1 ? 'ok' : 'bad' }];
  } else if (t === 'multi') {
    var c = ex.multi.correct, got = 0;
    c.forEach(function (oi) {
      if (a.sel.indexOf(oi) >= 0) { got++; per.push({ k: oi, s: 'ok' }); }
      else per.push({ k: oi, s: 'miss' });
    });
    a.sel.forEach(function (oi) { if (c.indexOf(oi) < 0) per.push({ k: oi, s: 'bad' }); });
    raw = got / c.length;
  } else if (t === 'match') {
    var okM = 0;
    ex.match.left.forEach(function (L, si) {
      if (a.slots[si] === null) per.push({ k: si, s: 'empty' });
      else if (a.slots[si] === si) { okM++; per.push({ k: si, s: 'ok' }); }
      else per.push({ k: si, s: 'bad' });
    });
    raw = okM / ex.match.left.length;
  } else if (t === 'sort') {
    var okS = 0;
    ex.sort.items.forEach(function (it, ii) {
      var put = a.put[ii];
      if (put === undefined || put === null) per.push({ k: ii, s: 'miss' });
      else if (put === it.b) { okS++; per.push({ k: ii, s: 'ok' }); }
      else per.push({ k: ii, s: 'bad' });
    });
    raw = okS / ex.sort.items.length;
  } else if (t === 'order') {
    var okO = 0;
    a.seq.forEach(function (it, pos) {
      if (it === pos) { okO++; per.push({ k: pos, s: 'ok' }); }
      else per.push({ k: pos, s: 'bad' });
    });
    raw = okO / ex.order.items.length;
  } else if (t === 'blank') {
    var okB = 0;
    ex.blank.answers.forEach(function (w, si) {
      var bi = a.slots[si];
      if (bi === null) per.push({ k: si, s: 'empty' });
      else if (ex.blank.bank[bi] === w) { okB++; per.push({ k: si, s: 'ok' }); }
      else per.push({ k: si, s: 'bad' });
    });
    raw = okB / ex.blank.answers.length;
  } else if (t === 'input') {
    var v = normStr(a.v);
    if (v === '') return { per: [{ s: 'empty' }], raw: 0, empty: true };
    var okI = false;
    if (ex.input.acceptNum) {
      var num = parseFloat(v.replace(/(hours?|hrs?|h|minutes?|mins?|m|days?|d|seconds?|s|%)$/i, ''));
      if (!isNaN(num) && Math.abs(num - ex.input.acceptNum.value) <= (ex.input.acceptNum.tol || 0.01)) okI = true;
    }
    if (!okI && ex.input.acceptStr) okI = ex.input.acceptStr.some(function (s) { return normStr(s) === v; });
    raw = okI ? 1 : 0;
    per = [{ s: okI ? 'ok' : 'bad' }];
  } else if (t === 'terminal') {
    var cmd = String(a.last || a.cur || '').trim();
    if (cmd === '') return { per: [{ s: 'empty' }], raw: 0, empty: true };
    var okT = ex.terminal.accept.some(function (rs) { return new RegExp(rs, 'i').test(cmd); });
    raw = okT ? 1 : 0;
    per = [{ s: okT ? 'ok' : 'bad' }];
  } else if (t === 'branch') {
    var okBr = 0, all = true;
    ex.branch.steps.forEach(function (st, si) {
      if (a.picks[si] === null) { all = false; return; }
    });
    if (!all) return { incomplete: true };
    ex.branch.steps.forEach(function (st, si) {
      var okB2 = st.choices[a.picks[si]].ok;
      if (okB2) okBr++;
      per.push({ k: si, s: okB2 ? 'ok' : 'bad' });
    });
    raw = okBr / ex.branch.steps.length;
  } else if (t === 'triage') {
    var okR = 0;
    ex.triage.rows.forEach(function (r, ri2) {
      if (a.sel[ri2] === null) per.push({ k: ri2, s: 'empty' });
      else if (a.sel[ri2] === r.correct) { okR++; per.push({ k: ri2, s: 'ok' }); }
      else per.push({ k: ri2, s: 'bad' });
    });
    raw = okR / ex.triage.rows.length;
  }
  return { per: per, raw: raw };
}

/* ---------------- feedback text ---------------- */
function fbWord(s) {
  if (s === 'ok') return '<span class="mark m-ok">OK</span>';
  if (s === 'bad') return '<span class="mark m-bad">WRONG</span>';
  if (s === 'miss') return '<span class="mark m-miss">MISSED</span>';
  return '<span class="mark m-miss">EMPTY</span>';
}
function elementName(ex, k) {
  var t = ex.type, i = k;
  if (t === 'multi') return esc(String(ex.multi.options[i]).slice(0, 70));
  if (t === 'match') return esc(ex.match.left[i]);
  if (t === 'sort') return esc(ex.sort.items[i].t);
  if (t === 'order') return 'Position ' + (i + 1);
  if (t === 'blank') return 'Blank ' + (i + 1);
  if (t === 'branch') return 'Step ' + (i + 1);
  if (t === 'triage') return esc(ex.triage.rows[i].label);
  return 'Answer';
}
var pendingFB = '';
function buildFeedback(cur, res) {
  var ex = curEx(cur);
  var h = '';
  var mult = ['multi', 'match', 'sort', 'order', 'blank', 'branch', 'triage'].indexOf(ex.type) >= 0;
  if (mult && res.per.length > 1) {
    h += res.per.map(function (p) {
      return '<div class="fbline">' + fbWord(p.s) + '<span>' + elementName(ex, p.k) + '</span></div>';
    }).join('');
  } else {
    h += '<div class="fbline">' + fbWord(res.per[0].s) + '<span>' + (res.raw >= 0.999 ? 'Your answer is correct.' : 'Your answer is not correct.') + '</span></div>';
  }
  var earned = res.raw * PTS * (1 - 0.1 * S.hints[cur]);
  S.earned[cur] = Math.round(earned * 100) / 100;
  S.raw[cur] = res.raw;
  S.label[cur] = res.raw >= 0.999 ? 'full' : (res.raw <= 0.001 ? 'zero' : 'partial');
  h += '<p class="scoreline">You earned ' + fmtPts(S.earned[cur]) + ' / ' + PTS + ' points' +
    (S.hints[cur] > 0 ? ' (includes a ' + (S.hints[cur] * 10) + '% hint reduction)' : '') + '</p>';
  var good = res.raw >= 0.999;
  h += '<div class="expl' + (good ? '' : ' bad') + '"><h4>' + (good ? 'Why this is right' : 'Why, and what to learn') + '</h4><p>' + ex.explanation + '</p></div>';
  if (res.raw < 0.999 && ex.tips) h += '<div class="tips"><b>Where to focus:</b> ' + ex.tips + '</div>';
  S.fb[cur] = h;
  return h;
}

/* ---------------- terminal emulation ---------------- */
/* Resolve a user-typed path ("backup.log", "./backup.log", "/var/log/backup.log")
   against the fake filesystem, which may key files by basename or full path. */
function termResolve(files, raw) {
  var n = String(raw).trim().replace(/^["']|["']$/g, '').replace(/^\.\//, '');
  if (!n) return null;
  if (files[n]) return n;
  var base = n.split('/').pop();
  if (base && files[base]) return base;
  var keys = Object.keys(files), i;
  for (i = 0; i < keys.length; i++) {
    if (keys[i].slice(-(n.length + 1)) === '/' + n) return keys[i];
  }
  return null;
}
function termRun(cur, cmd) {
  var ex = curEx(cur), t = ex.terminal, out = null;
  S.ans[cur].lines.push(t.prompt + ' ' + cmd);
  if (cmd.trim() === '') { /* nothing */ }
  else {
    for (var i = 0; i < t.canned.length; i++) {
      if (new RegExp(t.canned[i].re, 'i').test(cmd)) { out = t.canned[i].out; break; }
    }
    if (out === null) {
      var m;
      if (/^help$/i.test(cmd.trim())) {
        out = 'available commands: help, ls, cat <file>, grep [-i] <pattern> <file>, tail [-n N] <file>, head [-n N] <file>, clear';
      } else if (/^clear$/i.test(cmd.trim())) {
        S.ans[cur].lines = [];
      } else if (/^ls\b/i.test(cmd.trim())) {
        out = Object.keys(t.files).map(function (k) { return k.split('/').pop(); }).join('  ');
      } else if ((m = cmd.match(/^cat\s+['"]?([^'"]\S*)['"]?$/i))) {
        var f1 = termResolve(t.files, m[1]);
        out = f1 ? t.files[f1].join('\n') : ('cat: ' + m[1] + ': No such file or directory');
      } else if ((m = cmd.match(/^grep\b\s*(.*)$/i))) {
        /* argv-style parse: flags first (-i, -n, -E ...), then pattern, then file */
        var rest = m[1], toks = [], mm2, reTok = /"([^"]*)"|'([^']*)'|(\S+)/g;
        while ((mm2 = reTok.exec(rest))) { toks.push(mm2[1] !== undefined ? mm2[1] : (mm2[2] !== undefined ? mm2[2] : mm2[3])); }
        var ci = false;
        while (toks.length && toks[0].charAt(0) === '-' && toks[0] !== '-') {
          if (/^-i$/i.test(toks[0])) ci = true;
          toks.shift();
        }
        if (toks.length < 2) {

        } else {
          var pat = toks[0], farg = toks[1];
          var f2 = termResolve(t.files, farg);
          if (!f2) out = 'grep: ' + farg + ': No such file or directory';
          else {
            var hits = t.files[f2].filter(function (l) { return ci ? l.toLowerCase().indexOf(pat.toLowerCase()) >= 0 : l.indexOf(pat) >= 0; });
            out = hits.join('\n');
          }
        }
      } else if ((m = cmd.match(/^tail\s+(?:-n\s*(\d+)|-(\d+))?\s*(.*)$/i))) {
        var n = parseInt(m[1] || m[2] || '10', 10), f3 = termResolve(t.files, m[3]);
        if (!f3) out = m[3].trim() ? ('tail: ' + m[3].trim() + ': No such file or directory') : 'tail: missing file operand';
        else out = t.files[f3].slice(-n).join('\n');
      } else if ((m = cmd.match(/^head\s+(?:-n\s*(\d+)|-(\d+))?\s*(.*)$/i))) {
        var n2 = parseInt(m[1] || m[2] || '10', 10), f4 = termResolve(t.files, m[3]);
        if (!f4) out = m[3].trim() ? ('head: ' + m[3].trim() + ': No such file or directory') : 'head: missing file operand';
        else out = t.files[f4].slice(0, n2).join('\n');
      } else if (/^(grep|cat|tail|head)\b/i.test(cmd.trim())) {
        var w0 = cmd.trim().split(/\s+/)[0].toLowerCase();
        if (w0 === 'grep') out = 'usage: grep [-i] PATTERN FILE';
        else if (w0 === 'cat') out = 'usage: cat FILE';
        else if (w0 === 'tail') out = 'usage: tail [-n N] FILE';
        else out = 'usage: head [-n N] FILE';
      } else {
        out = 'bash: ' + cmd.trim().split(/\s+/)[0] + ': command not found';
      }
    }
  }
  if (out !== null && String(out).length) {
    String(out).split('\n').forEach(function (l) { S.ans[cur].lines.push(l); });
  }
  S.ans[cur].last = cmd;
}

/* ---------------- check / skip / nav ---------------- */
function doCheck() {
  if (S.phase !== 'exam') return;
  var cur = S.cur;
  var res = validate(cur);
  if (res.incomplete) { toast('Answer every step of this exercise before pressing Check.', 'warn'); return; }
  if (res.empty) { toast('Give an answer first — or press Skip.', 'warn'); return; }
  buildFeedback(cur, res);
  S.locked[cur] = true;
  S.skipped[cur] = false;
  S.checkPause = true;
  renderAll();
  var fb = $('#fbArea');
  if (fb) fb.scrollIntoView({ block: 'nearest' });
}
function goNext() {
  S.checkPause = false;
  if (S.cur >= S.order.length - 1) { openFinishModal(); return; }
  S.cur++;
  S.sel = null;
  renderAll();
}
function goPrev() {
  S.checkPause = false;
  if (S.cur === 0) return;
  S.cur--;
  S.sel = null;
  renderAll();
}
function doSkip() {
  S.skipped[S.cur] = true;
  toast('Skipped. It will not count — come back before the timer ends.');
  if (S.cur >= S.order.length - 1) { openFinishModal(); return; }
  S.checkPause = false;
  S.cur++;
  S.sel = null;
  renderAll();
}
function doHint() {
  var ex = curEx(S.cur);
  if (S.hints[S.cur] >= ex.hints.length) { toast('No hints left on this exercise.', 'warn'); return; }
  S.hints[S.cur]++;
  var n = S.hints[S.cur];
  var html = ex.hints.slice(0, n).map(function (htxt, i2) {
    return '<div class="hintbox"><b>Hint ' + (i2 + 1) + '</b> (' + ((i2 + 1) * 10) + '% off this exercise): ' + htxt + '</div>';
  }).join('');
  $('#hintArea').innerHTML = html;
  toast('Hint used — this exercise can earn 10% less.');
}
function doRevise() {
  S.locked[S.cur] = false;
  S.earned[S.cur] = 0; S.raw[S.cur] = 0; S.label[S.cur] = '';
  S.fb[S.cur] = '';
  renderAll();
  toast('Revise your answer, then press Check again.');
}
function jumpTo(pos) {
  if (pos < 0 || pos >= S.order.length) return;
  S.checkPause = false;
  S.cur = pos;
  S.sel = null;
  renderAll();
}

/* ---------------- timer ---------------- */
function startTimer() {
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function () {
    if (S.phase !== 'exam') return;
    if (S.manual || S.checkPause) return;
    S.remaining--;
    renderTimer();
    if (S.remaining <= 0) { finishExam(true); }
  }, 1000);
}

/* ---------------- finish & results ---------------- */
function includedList() {
  var out = [];
  S.order.forEach(function (exIdx, pos) {
    if (!S.skipped[pos] && (S.locked[pos] || hasAnswer(EXS[exIdx], S.ans[pos]))) out.push(pos);
  });
  return out;
}
function finishExam(auto) {
  if (S.phase === 'results') return;
  closeModal();
  /* silently grade answered-but-unchecked questions (no pause, no feedback) */
  S.order.forEach(function (exIdx, pos) {
    if (!S.locked[pos] && !S.skipped[pos] && hasAnswer(EXS[exIdx], S.ans[pos])) {
      var res = validate(pos);
      if (!res.incomplete && !res.empty) {
        buildFeedback(pos, res);
        S.locked[pos] = true;
      }
    }
  });
  var inc = includedList();
  if (inc.length === 0) {
    if (auto) { renderResultsNoAnswer(); S.phase = 'results'; return; }
    toast('Answer at least one exercise before finishing — everything is skipped or empty.', 'warn');
    return;
  }
  S.phase = 'results';
  if (S.timerId) clearInterval(S.timerId);
  renderResults(inc);
}
function renderResultsNoAnswer() {
  if (S.timerId) clearInterval(S.timerId);
  $('#stage').hidden = true; $('#results').hidden = false;
  $('#results').innerHTML = '<div class="panel"><h1>Nothing to score</h1><p class="sub">Every question was skipped or left empty, so there is no score to report.</p><div class="ctlbar"><button type="button" class="btn primary" data-act="retake">Retake the exam</button></div></div>';
}
function yourAnswerSummary(pos) {
  var ex = curEx(pos), a = S.ans[pos], t = ex.type;
  if (t === 'qcm') return a.sel === null ? '—' : esc(ex.qcm.options[a.sel]);
  if (t === 'multi') return uniqName(a.sel.map(function (i) { return ex.multi.options[i]; }));
  if (t === 'match') return uniqName(ex.match.left.map(function (L, si) { return L + ' → ' + (a.slots[si] === null ? '(empty)' : ex.match.right[a.slots[si]]); }));
  if (t === 'sort') return uniqName(ex.sort.items.map(function (it, ii) { var p = a.put[ii]; return it.t + ' → ' + (p === undefined || p === null ? '(none)' : ex.sort.buckets[p]); }));
  if (t === 'order') return uniqName((a.seq || []).map(function (it) { return ex.order.items[it]; }));
  if (t === 'blank') return uniqName(ex.blank.answers.map(function (w, si) { var bi = a.slots[si]; return bi === null ? '(empty)' : ex.blank.bank[bi]; }));
  if (t === 'input') return esc(a.v) || '—';
  if (t === 'terminal') return esc(a.last || a.cur || '—');
  if (t === 'branch') return uniqName(ex.branch.steps.map(function (st, si) { var p = a.picks[si]; return 'S' + (si + 1) + ': ' + (p === null ? '(none)' : st.choices[p].t); }));
  if (t === 'triage') return uniqName(ex.triage.rows.map(function (r, ri2) { var s2 = a.sel[ri2]; return r.label + ' → ' + (s2 === null ? '(none)' : r.options[s2]); }));

  if (t === 'multi') return uniqName(ex.multi.correct.map(function (i) { return ex.multi.options[i]; }));
  if (t === 'match') return uniqName(ex.match.left.map(function (L, si) { return L + ' → ' + ex.match.right[si]; }));
  if (t === 'sort') return uniqName(ex.sort.items.map(function (it) { return it.t + ' → ' + ex.sort.buckets[it.b]; }));
  if (t === 'order') return uniqName(ex.order.items);
  if (t === 'blank') return uniqName(ex.blank.answers);
  if (t === 'input') return esc(ex.input.acceptStr ? ex.input.acceptStr.join(' or ') : String(ex.input.acceptNum.value)) + (ex.input.unit ? ' ' + esc(ex.input.unit) : '');

  if (t === 'branch') return uniqName(ex.branch.steps.map(function (st, si) { var ok = st.choices.filter(function (c) { return c.ok; })[0]; return 'S' + (si + 1) + ': ' + ok.t; }));

}
function renderResults(inc) {

  var total = Math.round(pts);
  var poss = inc.length * PTS;
  var percent = Math.round(total / poss * 100);
  var passed = percent >= META.passMark;
  var skippedPos = [];
  S.order.forEach(function (exIdx, pos) { if (S.skipped[pos] || (!S.locked[pos] && !hasAnswer(EXS[exIdx], S.ans[pos]))) skippedPos.push(pos); });
  var used = S.full - Math.max(0, S.remaining);
  var h = '';
  h += '<div class="cert ' + (passed ? 'pass' : 'fail') + '">'
    + '<div class="verdict">' + (passed ? 'PASSED' : 'NOT PASSED') + '</div>'
    + '<div class="bigscore">' + percent + '% — ' + total + ' / ' + poss + ' points</div>'
    + '<div class="meta">' + esc(META.title) + ' · pass mark ' + META.passMark + '%'
    + (S.user ? ' · Candidate: ' + esc(S.user) : '') + '</div>'
    + (passed ? '<p style="margin-top:10px">Well done. You mastered this severity level of the chapter.</p>'

    + '<span class="chip">Time used: <b>&nbsp;' + fmtClock(used) + '</b></span>'
    + '</div>';
  if (skippedPos.length) {
    h += '<div class="skipnote">Excluded from scoring (they add nothing, for or against): question '
      + skippedPos.map(function (p) { return (p + 1); }).join(', ')
      + '. Their explanations are still listed below so you can learn from them.</div>';
  }
  h += '<h3 style="margin:16px 0 10px">Per-question report</h3>';
  S.order.forEach(function (exIdx, pos) {
    var ex = EXS[exIdx];
    var isSkipped = S.skipped[pos] || (!S.locked[pos] && !hasAnswer(ex, S.ans[pos]));
    var lab = isSkipped ? 'skipped' : (S.label[pos] || 'skipped');
    var labTxt = { full: 'FULL', partial: 'PARTIAL', zero: 'ZERO', skipped: 'SKIPPED — not counted' }[lab] || 'SKIPPED';
    var labCls = lab === 'full' ? 'full' : lab === 'partial' ? 'partial' : lab === 'zero' ? 'zero' : 'skipped';
    h += '<details class="rrow"><summary><span class="rno">Q' + (pos + 1) + '</span><span class="rtitle">' + esc(ex.title) + '</span>'
      + '<span class="themechip">' + esc(ex.theme) + '</span>'
      + '<span class="badge ' + labCls + '">' + labTxt + '</span>'
      + '<span class="rpts">' + (isSkipped ? '0 (excluded)' : fmtPts(S.earned[pos]) + ' / ' + PTS) + '</span></summary><div class="rbody">'
      + '<div class="kv"><div class="k">Your answer</div><div class="v">' + yourAnswerSummary(pos) + '</div></div>'
      + '<div class="kv"><div class="k">Correct answer</div><div class="v">' + correctAnswerSummary(pos) + '</div></div>'
      + '<div class="expl"><h4>Explanation</h4><p>' + ex.explanation + '</p></div>'
      + (ex.tips && !isSkipped ? '<div class="tips"><b>Where to focus:</b> ' + ex.tips + '</div>' : '')
      + '</div></details>';
  });
  h += '<div class="ctlbar"><span class="spacer"></span><button type="button" class="btn primary" data-act="retake">Retake the exam</button></div>';
  $('#stage').hidden = true;
  $('#results').hidden = false;
  $('#results').innerHTML = h;
  if (inc.length > 0 && !S.fired) reportScore(total, poss);
}
function reportScore(correct, total) {
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
    S.fired = true;
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
    S.fired = true;
  }
}
function retake() {
  $('#results').hidden = true;
  buildAttempt();
  S.phase = 'exam';
  $('#stage').hidden = false;
  renderAll();
  startTimer();
  toast('New attempt — questions and answers are reshuffled.');
}

/* ---------------- modal & toast ---------------- */
function openFinishModal() {
  var inc = includedList();
  var sk = [];
  S.order.forEach(function (exIdx, pos) { if (S.skipped[pos] || (!S.locked[pos] && !hasAnswer(EXS[exIdx], S.ans[pos]))) sk.push(pos); });
  $('#modalBody').innerHTML = 'Scored so far: <b>' + inc.length + '</b> question(s). Still skipped or empty: <b>' + sk.length + '</b>.'
    + (sk.length ? ' Skipped questions are excluded from the score.' : '')
    + (inc.length === 0 ? ' <b style="color:#ffc857">You must answer at least one question to get a score.</b>' : '');
  $('#modal').hidden = false;
  $('#modalYes').focus();
}
function closeModal() { $('#modal').hidden = true; }
function toast(msg, kind) {
  var d = document.createElement('div');
  d.className = 'toast' + (kind === 'warn' ? ' warn' : '');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 4200);
}

/* ---------------- events ---------------- */
function wireEvents() {
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act],[data-nav],[data-chip],[data-slot],[data-unplace],[data-unplace-sort],[data-bucket],[data-bslot],[data-mv],[data-ch],[data-bucket],[data-termrun],.bchoice') : null;
    if (!el) return;
    var cur = S.cur, ex = curEx(cur), a = S.ans[cur];
    if (el.hasAttribute('data-act')) {
      var act = el.getAttribute('data-act');
      if (act === 'check') doCheck();
      else if (act === 'skip') doSkip();
      else if (act === 'hint') doHint();
      else if (act === 'revise') doRevise();
      else if (act === 'next') goNext();
      else if (act === 'prev') goPrev();
      else if (act === 'retake') retake();
      return;
    }
    if (el.hasAttribute('data-nav')) {
      if (S.phase === 'exam') jumpTo(parseInt(el.getAttribute('data-nav'), 10));
      return;
    }
    if (S.phase !== 'exam' || S.locked[cur]) return;
    /* chip select (match/sort/blank) */
    if (el.hasAttribute('data-chip')) {
      var ci = parseInt(el.getAttribute('data-chip'), 10);
      S.sel = (S.sel === ci) ? null : ci;
      renderExercise();
      return;
    }
    /* match slot */
    if (el.hasAttribute('data-slot')) {
      var si = parseInt(el.getAttribute('data-slot'), 10);
      if (S.sel !== null) { a.slots[si] = S.sel; S.sel = null; renderExercise(); }
      else if (a.slots[si] !== null) { a.slots[si] = null; renderExercise(); }
      return;
    }
    if (el.hasAttribute('data-unplace')) {
      var s2 = parseInt(el.getAttribute('data-unplace'), 10);
      a.slots[s2] = null;
      renderExercise();
      return;
    }
    /* sort bucket */
    if (el.hasAttribute('data-bucket')) {
      var bi = parseInt(el.getAttribute('data-bucket'), 10);
      if (S.sel !== null) { a.put[S.sel] = bi; S.sel = null; renderExercise(); }
      return;
    }
    if (el.hasAttribute('data-unplace-sort')) {
      var it2 = parseInt(el.getAttribute('data-unplace-sort'), 10);
      delete a.put[it2];
      renderExercise();
      return;
    }
    /* blank slot */
    if (el.hasAttribute('data-bslot')) {
      var bsi = parseInt(el.getAttribute('data-bslot'), 10);
      if (S.sel !== null) { a.slots[bsi] = S.sel; S.sel = null; renderExercise(); }
      else if (a.slots[bsi] !== null) { a.slots[bsi] = null; renderExercise(); }
      return;
    }
    /* order move */
    if (el.hasAttribute('data-mv')) {
      var pv = el.getAttribute('data-mv').split(','), p = parseInt(pv[0], 10), dir = parseInt(pv[1], 10);
      var np = p + dir;
      if (np >= 0 && np < a.seq.length) {
        var tmp = a.seq[p]; a.seq[p] = a.seq[np]; a.seq[np] = tmp;
        a.touched = true;
        renderExercise();
      }
      return;
    }
    /* branch choice */
    if (el.hasAttribute('data-ch')) {
      var cv = el.getAttribute('data-ch').split(':'), stp = parseInt(cv[0], 10), ch = parseInt(cv[1], 10);
      if (a.picks[stp] !== ch) {
        a.picks[stp] = ch;
        if (a.step <= stp) a.step = stp + 1;
        /* changing an earlier choice invalidates every later step */
        for (var later = stp + 1; later < a.picks.length; later++) a.picks[later] = null;
        renderExercise();
      }
      return;
    }
    /* terminal run button */
    if (el.hasAttribute('data-termrun')) {
      var tin = $('[data-termin]');
      if (tin && tin.value.trim() !== '') {
        termRun(cur, tin.value);
        tin.value = '';
        a.cur = '';
        renderExercise();
      }
      return;
    }
  });
  /* keyboard activation for chip/slot role=button spans */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var el = ev.target.closest ? ev.target.closest('[data-chip],[data-slot],[data-bslot],[data-unplace],[data-unplace-sort]') : null;
    if (!el) return;
    if (el.tagName === 'INPUT' || el.tagName === 'BUTTON' || el.tagName === 'SELECT') return;
    ev.preventDefault();
    el.click();
  });
  /* change events: radios, checkboxes, selects, text input */
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (S.phase !== 'exam') return;
    var cur = S.cur, ex = curEx(cur), a = S.ans[cur];
    if (el.matches('[data-logf]')) { return; }
    if (el.type === 'radio' && el.name === 'q' + cur) {
      a.sel = parseInt(el.value, 10);
    } else if (el.type === 'checkbox' && el.name === 'q' + cur) {
      var v = parseInt(el.value, 10), i2 = a.sel.indexOf(v);
      if (el.checked && i2 < 0) a.sel.push(v);
      if (!el.checked && i2 >= 0) a.sel.splice(i2, 1);
    } else if (el.matches('[data-tsel]')) {
      a.sel[parseInt(el.getAttribute('data-tsel'), 10)] = el.value === '' ? null : parseInt(el.value, 10);
    } else if (el.matches('[data-input]')) {
      a.v = el.value;
    }
  });
  /* live typing capture */
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (S.phase !== 'exam') return;
    if (el.matches('[data-termin]')) { S.ans[S.cur].cur = el.value; return; }
    if (el.matches('[data-input]')) { S.ans[S.cur].v = el.value; return; }
    if (el.matches('[data-logf]')) {
      var box = document.getElementById(el.getAttribute('data-logf'));
      if (!box) return;
      var q = el.value.toLowerCase();
      $$('.logline', box).forEach(function (ln) {
        ln.style.display = ln.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });
    }
  });
  /* terminal Enter key */
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || S.phase !== 'exam') return;
    var el = ev.target;
    if (el.matches && el.matches('[data-termin]')) {
      ev.preventDefault();
      if (el.value.trim() !== '') {
        termRun(S.cur, el.value);
        el.value = '';
        S.ans[S.cur].cur = '';
        renderExercise();
      }
    }
  });
  /* drag & drop */
  var dragIdx = null;
  document.addEventListener('dragstart', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-chip],[data-orow]') : null;
    if (!el) return;
    if (S.phase !== 'exam' || S.locked[S.cur]) { ev.preventDefault(); return; }
    if (el.hasAttribute('data-chip')) {
      dragIdx = { kind: 'chip', idx: parseInt(el.getAttribute('data-chip'), 10) };
      S.sel = dragIdx.idx;
    } else if (el.hasAttribute('data-orow')) {
      dragIdx = { kind: 'orow', idx: parseInt(el.getAttribute('data-orow'), 10) };
    }
    if (ev.dataTransfer) { ev.dataTransfer.setData('text/plain', 'x'); ev.dataTransfer.effectAllowed = 'move'; }
  });
  document.addEventListener('dragover', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-slot],[data-bucket],[data-pool],[data-orow],[data-bslot]') : null;
    if (el && dragIdx) { ev.preventDefault(); el.classList.add('over'); }
  });
  document.addEventListener('dragleave', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-slot],[data-bucket],[data-pool],[data-orow],[data-bslot]') : null;
    if (el) el.classList.remove('over');
  });
  document.addEventListener('drop', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-slot],[data-bucket],[data-pool],[data-orow],[data-bslot]') : null;
    if (!el || !dragIdx) return;
    ev.preventDefault();
    el.classList.remove('over');
    var cur = S.cur, a = S.ans[cur];
    if (dragIdx.kind === 'chip') {
      var idx = dragIdx.idx;
      if (el.hasAttribute('data-slot')) a.slots[parseInt(el.getAttribute('data-slot'), 10)] = idx;
      else if (el.hasAttribute('data-bslot')) a.slots[parseInt(el.getAttribute('data-bslot'), 10)] = idx;
      else if (el.hasAttribute('data-bucket')) a.put[idx] = parseInt(el.getAttribute('data-bucket'), 10);
      else if (el.hasAttribute('data-pool')) {
        a.slots.forEach(function (v, si2) { if (v === idx) a.slots[si2] = null; });
        delete a.put[idx];
      }
      S.sel = null;
    } else if (dragIdx.kind === 'orow') {
      var tgt = el.hasAttribute('data-orow') ? parseInt(el.getAttribute('data-orow'), 10) : null;
      if (tgt !== null && tgt !== dragIdx.idx) {
        var seq = a.seq, moving = seq[dragIdx.idx];
        seq.splice(dragIdx.idx, 1);
        seq.splice(tgt, 0, moving);
        a.touched = true;
      }
    }
    dragIdx = null;
    renderExercise();
  });
  document.addEventListener('dragend', function () { dragIdx = null; $$('.over').forEach(function (el) { el.classList.remove('over'); }); });
  /* header buttons */
  $('#pauseBtn').addEventListener('click', function () {
    S.manual = !S.manual;
    renderPauseFlags();
    applyPauseCover();
  });
  $('#finishBtn').addEventListener('click', openFinishModal);
  $('#modalYes').addEventListener('click', function () { closeModal(); finishExam(false); });
  $('#modalNo').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', function (ev) { if (ev.target === $('#modal')) closeModal(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });
}
function applyPauseCover() {
  var st = $('#stage');
  var inner = $('#stageInner');
  var pc = document.getElementById('pauseCover');
  if (S.manual && S.phase === 'exam') {
    inner.classList.add('blurred');
    st.setAttribute('aria-hidden', 'true');
    if (!pc) {
      pc = document.createElement('div');
      pc.className = 'pausecover';
      pc.id = 'pauseCover';
      pc.innerHTML = '<div class="panel center"><p><b>Paused (manual)</b></p><p class="small">The question is hidden while the exam is paused. Press Resume in the header to continue.</p></div>';
      st.appendChild(pc);
    }
  } else {
    inner.classList.remove('blurred');
    st.removeAttribute('aria-hidden');
    if (pc) pc.parentNode.removeChild(pc);
  }
}

/* ---------------- handshake ---------------- */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  if (event.data.username) {
    S.user = String(event.data.username).slice(0, 40);
    var chip = $('#candChip');
    chip.textContent = 'Candidate: ' + S.user;
    chip.hidden = false;
  }
});

/* ---------------- boot ---------------- */
function renderAll() {
  renderHUD(); renderNav(); renderExercise(); renderTimer(); renderPauseFlags(); applyPauseCover();
}
function startExam() {
  buildAttempt();
  S.phase = 'exam';
  $('#intro').hidden = true;
  $('#hud').hidden = false;
  $('#stage').hidden = false;
  renderAll();
  startTimer();
}
wireEvents();
renderIntro();

</script>
</body>
</html>
