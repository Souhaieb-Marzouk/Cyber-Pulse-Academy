<style>

/* ---------- nav / buttons ---------- */

.qtn .lab{color:var(--pu)}
.ans{background:var(--card2);border:1px dashed #33507e}

.art{background:#0a1120;border:1px solid var(--line)}
.art .lab{color:var(--am)}

.ll{display:block;padding:1px 6px;border-radius:4px}
.ll.hideLn{display:none}
.ip{color:#7fd0ff}.kw{color:#ff9db1}.ok2{color:#8fe6a8}.er{color:#ff8f8f}.ts{color:#c9b98a}.num{color:#ffd98a}

/* ---------- answers ---------- */
.optrow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:var(--bg2);min-height:44px;cursor:pointer}
.optrow:hover{border-color:#3d5f96}
.optrow input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:#1d7fc4}
.optrow.checkedSel{border-color:#2f8a52;background:#10281a}
.mark{font-weight:800}
.res-ok{color:var(--gn)}.res-no{color:var(--rd)}.res-part{color:var(--am)}
.optrow.m-ok{border-color:#2f8a52;background:var(--gnbg)}
.optrow.m-no{border-color:#a34a5a;background:var(--rdbg)}
.optrow.m-part{border-color:#8a6a2f;background:var(--ambg)}
select.pick{background:#0d1729;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;min-height:44px;max-width:100%}
.slot select{margin:0 3px}
table.match{width:100%;border-collapse:collapse}

.triRow{border:1px solid var(--line);border-radius:10px;background:var(--bg2);padding:10px 12px;margin:9px 0}

.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:var(--card);min-height:44px;cursor:pointer}
.radios input{accent-color:#1d7fc4;width:18px;height:18px}
.lines .ln{display:block;width:100%;text-align:left;background:#0a1120;border:1px solid #1e2c49;border-radius:7px;padding:7px 10px;margin:6px 0;font-family:Consolas,Menlo,monospace;font-size:14px;color:#c8d6ef;min-height:44px}
.lines .ln[aria-pressed="true"]{border-color:var(--am);background:#241d0b}
.lines .ln.m-ok{border-color:#2f8a52;background:var(--gnbg)}
.lines .ln.m-no{border-color:#a34a5a;background:var(--rdbg)}

/* drag & drop */
.tray,.cols{display:flex;flex-wrap:wrap;gap:8px}
.tray{min-height:52px;background:var(--bg2);border:1px dashed #33507e;border-radius:10px;padding:9px}
.col{flex:1 1 200px;min-width:190px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:120px}
.col h4{margin:0 0 8px;font-size:14px;color:var(--cy);border-bottom:1px solid #24345a;padding-bottom:6px}
.col.over{border-color:var(--cy);background:#122240}
.col.m-ok{border-color:#2f8a52}.col.m-no{border-color:#a34a5a}
.itm{display:inline-block;background:var(--card2);border:1px solid #33507e;border-radius:9px;padding:8px 12px;margin:3px;font-size:14px;min-height:44px}
.itm.sel{outline:2px solid var(--cy)}
.itm.m-ok{border-color:#2f8a52;background:var(--gnbg)}
.itm.m-no{border-color:#a34a5a;background:var(--rdbg)}

.term{background:#050a12;border:1px solid #1e2c49;border-radius:10px;padding:10px 12px}

.ltool .cnt{font-size:14px;color:var(--dim)}

/* feedback + explanation */
.feed{border-radius:10px;padding:12px 14px;margin:10px 0 0;border:1px solid var(--line)}

.hintBox{background:var(--ambg);border:1px solid #8a6a2f;border-radius:10px;padding:10px 12px;margin:10px 0 0;color:#ffe1a6}

.kwPanel{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}

.intro ul{margin:8px 0;padding-left:22px}
.intro li{margin:6px 0}
.badge{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:800;letter-spacing:1px;font-size:14px;border:1px solid}
.badge.med{background:#0f3a2a;border-color:#2f8a52;color:#9fe8bd}
.badge.hard{background:#3a1620;border-color:#a34a5a;color:#ffb3bd}
#results .bigScore{font-size:56px;font-weight:900;text-align:center;margin:6px 0}
#results .passP{border:2px solid #2f8a52;background:linear-gradient(180deg,#0f2f1c,#123522);border-radius:14px;padding:22px;text-align:center}
#results .failP{border:2px solid #a34a5a;background:linear-gradient(180deg,#2f1118,#381722);border-radius:14px;padding:22px;text-align:center}
#results .passP h2,#results .failP h2{font-size:28px}
.statChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
table.rep{width:100%;border-collapse:collapse;margin-top:10px}
table.rep th,table.rep td{border:1px solid #223252;padding:8px 10px;text-align:left;vertical-align:top;font-size:15px}
table.rep th{background:var(--card2)}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:800;border:1px solid}
.tag.full{background:var(--gnbg);border-color:#2f8a52;color:#9fe8bd}
.tag.part{background:var(--ambg);border-color:#8a6a2f;color:#ffd98a}
.tag.zero{background:var(--rdbg);border-color:#a34a5a;color:#ffb3bd}
.tag.skip{background:#241d0b;border-color:#8a6a2f;color:#ffd98a}
.tag.nc{background:#1a2436;border-color:#3d5f96;color:#9fb8e0}
.repDet{margin:6px 0 0}
.center{text-align:center}

/* modal */
#modal{position:fixed;inset:0;background:rgba(3,8,18,.78);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modalBox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:20px}

@media (max-width:760px){
  #hdr .row1{flex-direction:column;align-items:flex-start}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media print{body{background:#fff;color:#000}}

<script>
window.EXAM_CONFIG = {"topicId": "network-plus", "passMark": 70, "totalSeconds": 3000, "title": "CompTIA Network+ (N10-009) — 4.4 Security terminology", "diffLabel": "MEDIUM", "badgeCls": "med"};
window.EXAM_KEYWORDS = [{"id": "risk", "name": "Risk & Risk Management", "kws": ["risk", "likelihood", "impact", "risk assessment", "risk register", "risk appetite", "risk tolerance", "inherent risk", "residual risk", "risk mitigation", "risk acceptance", "risk avoidance", "risk transference (sharing)", "qualitative analysis", "quantitative analysis", "SLE (single loss expectancy)", "ARO (annualized rate of occurrence)", "ALE (annualized loss expectancy)", "risk owner"]}, {"id": "vuln", "name": "Vulnerability & Weakness", "kws": ["vulnerability", "misconfiguration", "unpatched system", "zero-day vulnerability", "CVE", "CVSS", "vulnerability scan", "patch management", "exposure", "weak/default password", "open port"]}, {"id": "exploit", "name": "Exploit & Attack", "kws": ["exploit", "exploit kit", "proof-of-concept (PoC)", "weaponized exploit", "zero-day exploit", "attack vector", "breach", "command and control (C2)", "SQL injection", "path traversal"]}, {"id": "threat", "name": "Threat & Threat Actors", "kws": ["threat", "threat actor", "insider threat", "script kiddie", "hacktivist", "cybercriminal", "nation-state", "advanced persistent threat (APT)", "threat intelligence", "indicator of compromise (IoC)", "opportunistic attack", "targeted attack"], "alts": {"advanced persistent threat (APT)": ["apt"], "indicator of compromise (IoC)": ["ioc", "indicators of compromise"], "targeted attack": ["targeted"]}}, {"id": "cia", "name": "CIA Triad & Controls", "kws": ["confidentiality", "integrity", "availability", "DAD triad (disclosure, alteration, destruction)", "encryption", "hashing", "digital signature", "multi-factor authentication (MFA)", "access control", "backup", "redundancy", "denial of service (DoS)", "eavesdropping", "data tampering", "data leak / exfiltration"], "alts": {"DAD triad (disclosure, alteration, destruction)": ["dad triad", "dad"], "data tampering": ["tampering"], "data leak / exfiltration": ["exfiltration", "data leak"], "denial of service (DoS)": ["dos", "ddos"], "multi-factor authentication (MFA)": ["mfa"], "hashing": ["hash"]}}];
window.EXERCISES = [{"t": "ddcat", "th": "risk", "lbl": "New-hire vocabulary sort", "sc": "<p>It is your first week as a junior security analyst at Meridian Retail Group. Your team lead sends you a sorting drill before you touch any real alerts: <i>“Ten items. Four buckets. If you cannot name the difference between a threat, a vulnerability, an exploit and a risk, you will drown in our ticket queue.”</i></p>", "q": "<p>Sort every item into the correct bucket.</p>", "hint": "Ask yourself: is it a weakness we have, someone or something dangerous, code or an act that uses the weakness, or the chance of harm happening?", "ex": "<p>A <b>threat</b> is the source of danger (a person, a group, or a natural event). A <b>vulnerability</b> is a weakness we have (an unpatched system, a bad default, a broken lock). An <b>exploit</b> is the code or technique that actually uses a weakness. A <b>risk</b> is the chance that harm happens and how much it would hurt. In real work: the threat uses the exploit against the vulnerability, and the result is the risk we measured.</p>", "cats": ["Threat", "Vulnerability", "Exploit", "Risk"], "items": [{"s": "An unpatched VPN gateway facing the internet", "c": 1}, {"s": "A criminal group that sells ransomware services", "c": 0}, {"s": "The chance that a fire stops our operations this year", "c": 3}, {"s": "A working exploit module aimed at CVE-2024-21762", "c": 2}, {"s": "A warehouse door lock that no longer closes", "c": 1}, {"s": "Flood season starting in our main data-centre region", "c": 0}, {"s": "Malicious code inside an email attachment that runs", "c": 2}, {"s": "The possibility of losing customer data in a breach", "c": 3}, {"s": "A former employee who still has admin access and is angry", "c": 0}, {"s": "A default password left on a database server", "c": 1}]}, {"t": "match", "th": "risk", "lbl": "Risk response matching", "sc": "<p>You are a GRC analyst at Northwind Logistics. The quarterly risk committee reviewed five register entries and one lost note. Your manager slides the minutes to you: <i>“Match every action we took to the correct risk-response term for the audit pack.”</i></p>", "q": "<p>Match each action or definition on the left to the correct term on the right.</p>", "hint": "Two terms are actions against risk (change or move it), one is about what remains, and one is the document that tracks it all.", "ex": "<p><b>Risk mitigation</b> lowers a risk with controls (backup power). <b>Risk transference</b> moves the financial pain to another party (insurance). <b>Risk avoidance</b> removes the activity that carries the risk (stopping the legacy FTP service). <b>Risk acceptance</b> means the company knowingly lives with the risk and signs it off. <b>Residual risk</b> is what remains after controls. The <b>risk register</b> is the document that lists risks, owners and treatment plans.</p>", "left": ["Install a UPS so short power cuts cannot stop the servers", "Buy cyber insurance to cover breach costs", "Shut down and remove the unsafe legacy FTP server", "Keep the small residual danger and have the CISO sign the acceptance note", "The risk that is left after all controls are applied", "The document that lists risks, owners and treatment plans"], "right": ["Risk mitigation", "Risk transference", "Risk avoidance", "Risk acceptance", "Residual risk", "Risk register"], "ans": [0, 1, 2, 3, 4, 5]}, {"t": "fill", "th": "risk", "lbl": "Complete the risk formula memo", "sc": "<p>Your team lead is drafting the onboarding memo for new analysts. She wants the core risk vocabulary in one sentence so nobody confuses it again.</p>", "q": "<p>Pick the correct word for each blank from the word bank.</p>", "hint": "First blank pair multiplies together to give risk. Second pair describes risk before and after controls.", "ex": "<p>We compute risk as <b>likelihood × impact</b>: how probable the harm is, times how much it would hurt. Controls act on a risk at its <b>inherent</b> level — the raw danger before any control — and reduce it to the <b>residual</b> level, what remains afterwards. Words like threat, vulnerability and exploit name the parts of the story, but the numbers live on likelihood and impact.</p>", "pre": ["<p>Dear team: we measure <b>risk</b> as the ", "", " that a threat event happens, multiplied by the ", "", " it would cause. Controls are applied at the ", "", " level and bring the danger down to the ", "", " level.</p>"], "ans": ["likelihood", "impact", "inherent", "residual"], "bank": ["likelihood", "impact", "inherent", "residual", "threat", "exploit", "appetite", "breach"]}, {"t": "qcm", "th": "threat", "lbl": "Hurricane watch", "sc": "<p>Friday, 16:40. The facilities manager emails the whole IT department: <i>“The national weather service put our data-centre region under a hurricane watch for Saturday. Diesel is topped up, staff on standby.”</i> Your manager asks you to log the situation in the risk tool with the correct term.</p>", "q": "<p>In security terminology, the hurricane itself is best described as a …</p>", "hint": "Nothing has happened yet, and nothing is broken. The hurricane is the source of possible danger.", "ex": "<p>The hurricane is a <b>threat</b>: a possible source of harm. It is a natural threat — no attacker, no intent. A <b>vulnerability</b> would be our weakness against it (for example a generator in a flooded basement). An <b>exploit</b> is code or an act that uses a weakness — a hurricane cannot “run code”. A <b>risk</b> would be the measured combination: the likelihood of the hurricane hitting and the impact on our systems.</p>", "opts": ["Threat", "Vulnerability", "Exploit", "Risk"], "ans": 0}, {"t": "logview", "th": "vuln", "lbl": "Patch the scan findings", "sc": "<p>Monday morning. The weekly Nessus-style scan finished on the four web-tier hosts. Your shift lead says: <i>“We can patch one host in tonight's window. Tell me which one goes first and why.”</i></p>", "q": "<p>Which host should be patched first, using the scan data?</p>", "ex": "<p>Host <b>10[.]10[.]4[.]11</b> combines the worst factors: a <b>critical CVSS 9.8</b> flaw, <b>remote code execution</b>, and a public <b>proof-of-concept (PoC) exploit</b> already available. That is the fastest path for a <b>threat actor</b> from <b>vulnerability</b> to real <b>exploitation</b>. Host 10[.]10[.]4[.]12 is serious but has no public exploit. Host 10[.]10[.]4[.]13 is exploitable in practice, but SMB on a web tier is unusual; host 10[.]10[.]4[.]14 is a hardening issue. Severity alone is not the whole story — exploitability and exposure decide the order.</p>", "hint": "Compare severity first, then look for public exploits — a flaw attackers can already run goes first.", "logs": ["10[.]10[.]4[.]11  OpenSSH 7.4   CVE-2023-38408  CVSS 9.8  Critical  RCE, public exploit available", "10[.]10[.]4[.]12  Apache 2.4.29 CVE-2021-41773  CVSS 7.5  High      path traversal, no public exploit", "10[.]10[.]4[.]13  SMBv1         MS17-010 class  CVSS 8.1  High      exploit kits cover it", "10[.]10[.]4[.]14  TLS 1.0       WEAK-PROTO      CVSS 5.3  Medium    weak protocol accepted"], "w": {"k": "qcm", "opts": ["10[.]10[.]4[.]11 — critical RCE with a public exploit", "10[.]10[.]4[.]13 — SMBv1 covered by exploit kits", "10[.]10[.]4[.]12 — high-severity path traversal flaw", "10[.]10[.]4[.]14 — legacy weak TLS protocol accepted"], "ans": 0}}, {"t": "terminal", "th": "vuln", "lbl": "Confirm open services", "sc": "<p>The vulnerability team asked you to double-check what the scanner reported on web01. The target is <code>10[.]20[.]30[.]40</code>. They want proof of the open ports and the exact service versions running behind them.</p>", "q": "<p>Type a single <code>nmap</code> command that lists open ports with service and version detection on that host. Use the service-version flag, then press Enter, then Check.</p>", "art": "<pre class='log'>Expected output shape:\n22/tcp   open  ssh      OpenSSH 8.2p1\n80/tcp   open  http     Apache httpd 2.4.41\n443/tcp  open  ssl/http Apache httpd 2.4.41</pre>", "hint": "The flag for version detection is <code>-sV</code>. Type the target address exactly as shown, with the [.] brackets.", "ex": "<p>The expected command is <code>nmap -sV 10[.]20[.]30[.]40</code> (with or without extra options like <code>-Pn</code>). <code>-sV</code> turns on <b>service and version detection</b>, so you see the software behind each open port — exactly what a vulnerability scan needs, because every version string can match a <b>CVE</b> entry. An open port is <b>exposure</b>: a door a threat actor could knock on.</p>", "maxLines": 1, "okGroups": [{"re": "^nmap\\b.*-sv.*10(\\[\\.\\]|\\.)20(\\[\\.\\]|\\.)30(\\[\\.\\]|\\.)40", "sample": "nmap -sV 10[.]20[.]30[.]40"}]}, {"t": "triage", "th": "threat", "lbl": "SOC shift classification", "sc": "<p>You just took over the SOC queue at Copperline Bank. Six alerts came in during the shift change. The outgoing analyst left a sticky note: <i>“Classify before you act — vulnerability, exploit attempt, threat activity, or availability impact.”</i></p>", "q": "<p>Classify each alert with the best-fitting term.</p>", "hint": "A finding without action is a weakness. Blocked or running attack code is an exploit attempt. Human or attacker movement is threat activity. Something broken or flooded is availability.", "ex": "<p>Alert 1 is a <b>vulnerability</b> (end-of-life software is a weakness, even with no attacker). Alert 2 shows a <b>SQL injection exploit attempt</b> — attack code was sent, the WAF stopped it. Alert 3 is <b>threat activity</b>: logins from two countries in minutes mean someone is using accounts. Alert 4 is an <b>availability impact</b>: CPU saturation and timeouts. Alert 5 is again a <b>vulnerability</b> — a misconfiguration (RDP open to the internet). Alert 6 is an <b>availability impact</b>: ransomware makes files unusable, so nobody can work.</p>", "rows": [{"s": "Scanner flags PHP 7.2 on web02 — end of life, no security fixes", "opts": ["Vulnerability", "Exploit attempt", "Threat activity", "Availability impact"], "ans": 0}, {"s": "WAF blocked 400 requests containing <code>' UNION SELECT</code> payloads from 203[.]0[.]113[.]7", "opts": ["Vulnerability", "Exploit attempt", "Threat activity", "Availability impact"], "ans": 1}, {"s": "VPN account svc-backup logged in from two countries within 10 minutes", "opts": ["Vulnerability", "Exploit attempt", "Threat activity", "Availability impact"], "ans": 2}, {"s": "Help desk flooded with calls: file shares timing out, core switch CPU at 100%", "opts": ["Vulnerability", "Exploit attempt", "Threat activity", "Availability impact"], "ans": 3}, {"s": "Config review finds RDP port 3389 open to the whole internet on a payroll host", "opts": ["Vulnerability", "Exploit attempt", "Threat activity", "Availability impact"], "ans": 0}, {"s": "File server shows 40,000 renamed files with a <code>.locked</code> extension and a ransom note", "opts": ["Vulnerability", "Exploit attempt", "Threat activity", "Availability impact"], "ans": 3}]}, {"t": "spot", "th": "vuln", "lbl": "Weak spots in the config", "sc": "<p>An intern pasted the current config of a small internal service into the team channel and asked “looks fine, right?” Your mentor answers: “Count the weaknesses out loud.”</p>", "q": "<p>Click every line that is a real security weakness (there are 4). Click again to unmark.</p>", "art": "<pre class='log'># service.cfg — internal-timesheet service\nlisten 0[.]0[.]0[.]0:8080\nauth_mode = password\ndefault_admin_password = Passw0rd123   # never changed\ntelnet_admin = enabled\nsession_timeout = 300\nlogging = on\nworkers = 4\ntls_mode = disabled</pre>", "hint": "Look for: a default password, an ancient admin protocol, no encryption, and a listener bound to every interface.", "ex": "<p>The four weaknesses: the <b>weak, default password never changed</b> (an attacker can look it up online), <b>telnet</b> enabled (it sends everything, including passwords, in clear text), <b>TLS disabled</b> (no <b>encryption</b> — a confidentiality weakness), and listening on <code>0[.]0[.]0[.]0</code> (the service accepts connections from <b>every network interface</b>, not just the local one — extra <b>exposure</b>). Session timeout, logging on and worker count are normal settings, not weaknesses. Each weakness here is a <b>misconfiguration</b>: the software is fine, the settings are not.</p>", "lines": [{"s": "listen 0[.]0[.]0[.]0:8080", "bad": true}, {"s": "auth_mode = password", "bad": false}, {"s": "default_admin_password = Passw0rd123   # never changed", "bad": true}, {"s": "telnet_admin = enabled", "bad": true}, {"s": "session_timeout = 300", "bad": false}, {"s": "logging = on", "bad": false}, {"s": "workers = 4", "bad": false}, {"s": "tls_mode = disabled", "bad": true}]}, {"t": "order", "th": "risk", "lbl": "First response to a data leak", "sc": "<p>07:52. A manager reports that a spreadsheet with 5,000 customer emails was shared on a public forum. You are the on-call analyst. The incident lead asks you to lay out the response order on the whiteboard before acting.</p>", "q": "<p>Put the six response steps into the correct order.</p>", "hint": "Understand first, then stop the bleeding, then keep proof, then tell people, then remove the cause, then learn.", "ex": "<p>Correct order: <b>1. Confirm</b> — check what really leaked and where (an unconfirmed report may be wrong). <b>2. Contain</b> — cut access and block the sharing channel so the <b>data leak</b> — the disclosure — stops growing. <b>3. Preserve evidence</b> — export logs and hash copies before anything changes. <b>4. Notify</b> — legal, data-protection officer, management; leaked personal data is a <b>confidentiality</b> loss with legal duties. <b>5. Eradicate</b> — remove the cause (revoke the share, fix the permission). <b>6. Review</b> — update the playbook and the risk register. Doing notify before confirm, or wiping before preserving evidence, are classic mistakes.</p>", "seq": ["Confirm the leak: what data, where, how much", "Contain: revoke the public share and block the channel", "Preserve evidence: export logs, hash the copies", "Notify legal, the data-protection officer and management", "Eradicate: remove the bad permission and reset exposed secrets", "Review: update the playbook and the risk register"]}, {"t": "multi", "th": "cia", "lbl": "Availability or not?", "sc": "<p>The quarterly risk workshop at Halcyon Health uses a simple wall exercise. The facilitator pins six cards and asks one question: <i>“Which of these are mainly AVAILABILITY problems?”</i></p>", "q": "<p>Select every card that describes a mainly availability problem (3 of the 6).</p>", "hint": "Availability = the system and its data are ready to use when needed. Ask: “can people still work?”", "ex": "<p>The availability cards: a <b>denial of service (DoS) flood</b> — the DDoS card — makes the website unreachable, a <b>power feed failure</b> stops the rack, and a <b>failed disk losing the volume</b> destroys access to data. All three answer “can people still work?” with <i>no</i>. Changed transfer amounts are an <b>integrity</b> problem (data altered). A Wi-Fi packet capture is <b>eavesdropping</b> — a confidentiality problem (data seen). Posting the staff phone list online is also <b>confidentiality</b> — the data still exists and works, it was just disclosed.</p>", "opts": ["A DDoS flood makes the public website unreachable", "A rack power feed fails and stops three servers", "A failed SAN disk loses the night's database volume", "An attacker changes bank transfer amounts in transit", "Someone captures Wi-Fi packets during a meeting", "A staff phone list is posted on a public forum"], "ans": [0, 1, 2]}, {"t": "branch", "th": "cia", "lbl": "The 21:40 printout", "sc": "<p>Tuesday, 21:40. The night guard notes that a finance user printed a large job on the HR-floor printer. In the morning the print tray holds 300 pages of customer records. The printer is in a shared corridor. You lead the response.</p>", "q": "<p>Decide step by step. Each choice unlocks the next step.</p>", "hint": "Good response order: verify with evidence, then restrict and involve HR, then name the damaged CIA element.", "ex": "<p>Step 1: <b>verify before acting</b> — print-server logs show what was really printed and by whom; acting on a rumour can harm an innocent person. Step 2: with the facts confirmed, <b>preserve the logs</b>, <b>restrict access</b>, and let HR run the people process — deleting logs or wiping the printer destroys evidence. Step 3: 300 customer records on an open tray is a loss of <b>confidentiality</b>: the data was not changed (integrity) and the systems still work (availability) — it was seen by people who should not see it. This pattern also fits the <b>insider threat</b> keyword: the danger came from inside the company.</p>", "steps": [{"p": "What do you do first?", "opts": ["Confirm with print-server logs and inform the finance manager", "Fire the user immediately — the guard saw the name on the job", "Post a warning in the all-staff chat about “the leak”", "Ignore it — printing is a normal daily task"], "ans": 0, "why": "Verify first: print-server logs give facts (who, what, when). Firing or naming a person on a rumour is unfair and legally risky."}, {"p": "The logs confirm the user printed 300 customer records at 21:40. Next move?", "opts": ["Preserve the print logs, restrict the user's data access, engage HR", "Delete the print logs so the user is not embarrassed", "Wipe the printer's memory and carry on as normal", "Email the customer list to the user so they can check it"], "ans": 0, "why": "Preserve evidence and restrict access while HR handles the people side. Deleting logs or wiping the printer destroys proof."}, {"p": "For the incident record: which CIA element was mainly damaged?", "opts": ["Confidentiality — records were exposed to unauthorised eyes", "Availability — the printer was busy", "Integrity — the records were changed", "None — data stayed inside the building"], "ans": 0, "why": "The data was complete and systems worked — but unauthorised people could read it. That is a confidentiality loss (disclosure)."}]}, {"t": "rank", "th": "risk", "lbl": "Qualitative risk ranking", "sc": "<p>The risk committee at Voltaro Energy runs a quick qualitative exercise. Each item was scored by the group: likelihood (rare → common) and impact (minor → severe). You must turn the discussion into an ordered list.</p>", "q": "<p>Rank the five risks from highest to lowest (likelihood × impact). Drag or use the arrows.</p>", "hint": "Qualitative means judged, not calculated. Ransomware is common and severe; a fire is severe but rare; an encrypted stolen laptop loses little.", "ex": "<p>Ranking by likelihood × impact: <b>1. Ransomware on the unpatched file server</b> — attacks are common and full file loss is severe. <b>2. Insider selling the client list</b> — possible, and the impact is very high. <b>3. Data-centre fire</b> — severe impact but rare, so it lands in the middle in qualitative scoring. <b>4. Phishing outage of one mail gateway</b> — common but only a two-hour nuisance. <b>5. Stolen encrypted laptop</b> — plausible, but encryption keeps the impact minor. This is a <b>qualitative analysis</b> — the everyday form of a risk assessment, judged with high/medium/low words. A <b>quantitative analysis</b> would use money figures like ALE instead.</p>", "seq": ["Ransomware hits the unpatched file server (common × severe)", "Insider sells the client list (possible × very high)", "Fire in the data centre (rare × total loss)", "Phishing takes one mail gateway down for 2 hours (common × minor)", "Laptop stolen, but the disk is encrypted (plausible × minor)"]}, {"t": "qcm", "th": "vuln", "lbl": "What the 9.8 means", "sc": "<p>The weekly scan report lands in your queue with a red row: <code>VPN appliance — CVE-2024-21413 — CVSS 9.8</code>. A help-desk colleague leans over: “9.8 what? Nine point eight what?”</p>", "q": "<p>What does a CVSS score of 9.8 actually tell you?</p>", "hint": "CVSS is a severity scale from 0 to 10. It does not count events, hosts, or money.", "ex": "<p><b>CVSS</b> (Common Vulnerability Scoring System) rates how <b>severe</b> a vulnerability is on a fixed 0–10 scale; 9.0–10 is the <b>critical</b> band. It says nothing about how many times the flaw was exploited, how many hosts have it, or what a patch costs — those are separate facts you get from logs, asset inventories and vendors. A high CVSS with no exploit in the wild can be less urgent than a lower score that attackers actively use.</p>", "opts": ["How severe the flaw is, on a 0–10 scale", "How many times the flaw was exploited last year", "How much it costs to patch the flaw", "How many hosts in the company have the flaw"], "ans": 0}, {"t": "match", "th": "cia", "lbl": "Controls to CIA pillar", "sc": "<p>You are preparing the security-awareness poster wall for the open day. Each poster shows one control and must name the CIA triad element it mainly protects. The printer is waiting.</p>", "q": "<p>Match each control to the triad element it mainly protects.</p>", "hint": "Confidentiality = only the right eyes. Integrity = data is not changed. Availability = it works when needed.", "ex": "<p><b>Encryption</b> and <b>multi-factor authentication (MFA)</b> protect <b>confidentiality</b>: encrypted data is unreadable to outsiders, and MFA stops stolen passwords from opening accounts. <b>Checksums (hashing)</b> and <b>digital signatures</b> protect <b>integrity</b>: any change to the data breaks the check or the signature. A <b>backup generator</b> and a <b>redundant second internet line</b> protect <b>availability</b>: power and connectivity survive failures. Remember: one control can help two pillars (HTTPS also proves the server), but every poster picks the main one.</p>", "left": ["Full-disk encryption on all laptops", "SHA-256 checksum published next to each download", "Backup generator in the basement", "Digital signature on outgoing invoices", "MFA on all administrator accounts", "Second internet line from a different provider"], "right": ["Confidentiality", "Integrity", "Availability", "Integrity", "Confidentiality", "Availability"], "ans": [0, 1, 2, 3, 4, 5]}, {"t": "fill", "th": "risk", "lbl": "Draft the breach report", "sc": "<p>You must finish the draft incident report for management. Your team lead started it and left blanks with the word bank — she wants the exact terminology this time, not everyday words.</p>", "q": "<p>Complete the report with a word for each blank.</p>", "hint": "Blank 1 names what happened to the records. Blank 2 names the CIA element. Blank 3 names the weakness. Blank 4 names the document.", "ex": "<p>The report reads: the attacker caused <b>disclosure</b> of employee records — an unauthorised party saw them — which is a loss of <b>confidentiality</b>. The VPN's missing MFA was a known <b>vulnerability</b> (a weakness), and it had been listed on the <b>risk register</b> since March. That last fact matters for the audit: the risk was known, owned and documented, which shows governance worked even though the fix was late. If records had been destroyed, we would say <b>destruction</b> instead; if they had been changed, <b>alteration</b>.</p>", "pre": ["<p>At 04:12 an attacker used a stolen VPN account to reach the HR share. The incident caused ", "", " of 12,400 employee records, a direct loss of ", "", ". The VPN had no MFA — this ", "", " was known and had been listed on the ", "", " since March.</p>"], "ans": ["disclosure", "confidentiality", "vulnerability", "risk register"], "bank": ["disclosure", "confidentiality", "vulnerability", "risk register", "destruction", "alteration", "exploit", "appetite"]}, {"t": "ddcat", "th": "cia", "lbl": "Which pillar took the hit?", "sc": "<p>Train-the-trainer week. You must teach the DAD trio — the evil twin of the CIA triad — using nine mini-incidents from the company archive. The board fills with three columns.</p>", "q": "<p>Sort every incident into the CIA element it damaged (that is: which of Disclosure, Alteration or Destruction happened).</p>", "hint": "Disclosure = seen by wrong eyes. Alteration = changed. Destruction = gone or unusable.", "ex": "<p><b>Disclosure</b> (confidentiality): the customer list on the forum, salaries read without permission, and recorded passwords — all <b>seen</b> by unauthorised people. <b>Alteration</b> (integrity): the changed invoice total, the edited price column, and the changed routing table — configuration <b>data tampering</b> — data or config was <b>modified</b>. <b>Destruction</b> (availability): ransomware making files unusable, the failed core switch stopping work, and backup tapes lost in the flood — data or service became <b>unavailable</b>. The <b>DAD triad</b> — disclosure, alteration, destruction — is just the CIA triad read backwards: DAD names the attacks, CIA names the protections.</p>", "cats": ["Confidentiality (Disclosure)", "Integrity (Alteration)", "Availability (Destruction)"], "items": [{"s": "Customer list posted on a public forum", "c": 0}, {"s": "Invoice total changed from 90 to 900 in the system", "c": 1}, {"s": "Ransomware made every shared file unusable", "c": 2}, {"s": "Someone read HR salary files without permission", "c": 0}, {"s": "Attacker edited the price column of the shop database", "c": 1}, {"s": "Core switch failed — nobody could work for 3 hours", "c": 2}, {"s": "Backup tapes destroyed in a flood", "c": 2}, {"s": "Keylogger recorded an admin's SSH passwords", "c": 0}, {"s": "Routing table of the core router was silently changed", "c": 1}]}, {"t": "qcm", "th": "risk", "lbl": "ALE quick maths", "sc": "<p>Facilities asks for a number before the budget meeting: a printer-room fire. Asset value 4,000 USD, a fire would destroy it fully (exposure factor 100%), and the expected rate is 0.5 fires per year (once every two years).</p>", "q": "<p>What is the Annualized Loss Expectancy (ALE)?</p>", "hint": "SLE = asset value × exposure factor. ALE = SLE × ARO.", "ex": "<p><b>SLE</b> (Single Loss Expectancy) = 4,000 × 100% = 4,000 USD — what one event would cost. <b>ARO</b> (Annualized Rate of Occurrence) = 0.5 — the expected events per year. <b>ALE</b> = SLE × ARO = 4,000 × 0.5 = <b>2,000 USD per year</b>. This is <b>quantitative analysis</b> — a risk assessment with money numbers instead of high/medium/low words. A control that costs less per year than the ALE it removes is usually worth buying.</p>", "opts": ["2,000 USD per year", "4,000 USD per year", "500 USD per year", "8,000 USD per year"], "ans": 0}, {"t": "logview", "th": "exploit", "lbl": "Exploit attempts in the web log", "sc": "<p>You are reviewing yesterday's access log of the shop's web server. The WAF logged a busy night. Your mentor asks a sharp question: <i>“Which lines show someone actually trying to EXPLOIT something — not just browsing or scanning?”</i></p>", "q": "<p>Select all lines that show an exploit attempt (3 of the lines). Use the filter box to search.</p>", "hint": "Exploit attempts carry attack payloads: SQL pieces like UNION SELECT, path tricks like ../.., or an upload of a script file.", "ex": "<p>The three exploit attempts: <code>?id=1' OR '1'='1</code> is a <b>SQL injection</b> payload — even blocked (403) it is an attempt; <code>/../../etc/passwd</code> is a <b>path traversal</b> attempt to read a system file; <code>POST /upload … shell.php</code> with status 200 is worse — a webshell upload that <b>succeeded</b>: a weaponized exploit delivered, giving a foothold for command and control (C2). Normal page loads (logo, about) are just browsing. The run of 404s on plugin paths is <b>reconnaissance</b>: looking for what exists — noisy, but not an exploit yet. An exploit attempt means attack code or technique hit a specific weakness.</p>", "logs": ["GET /products?id=1' OR '1'='1 403 512 WAF-BLOCK", "GET /index.html 200 4021", "GET /products?id=..%2f..%2f..%2fetc%2fpasswd 400 210", "GET /static/logo.png 200 8813", "POST /upload filename=shell.php 200 342", "GET /about/team 200 5310", "GET /wp-content/plugins/a1 404 0", "GET /wp-content/plugins/a2 404 0", "GET /wp-content/plugins/a3 404 0"], "w": {"k": "multi", "opts": ["Line: <code>GET /products?id=1' OR '1'='1 403</code>", "Line: <code>GET /static/logo.png 200</code>", "Line: <code>GET /products?id=..%2f..%2f..%2fetc%2fpasswd 400</code>", "Line: <code>POST /upload filename=shell.php 200</code>", "Line: <code>GET /about/team 200</code>", "Line: <code>GET /wp-content/plugins/a1 404</code>"], "ans": [0, 2, 3]}}, {"t": "spot", "th": "risk", "lbl": "Errors in the risk register", "sc": "<p>An intern maintained the risk register while your colleague was on holiday. The risk manager pushes it back across the desk: <i>“Two cells in here are impossible. Fix them.”</i></p>", "q": "<p>Click the two cells that contain errors. Click again to unmark.</p>", "art": "<table class='rep'><thead><tr><th>ID</th><th>Risk</th><th>Likelihood</th><th>Impact</th><th>Inherent (0–25)</th><th>Controls</th><th>Residual (0–25)</th><th>Owner</th></tr></thead><tbody><tr><td>R-1</td><td>Ransomware</td><td>High</td><td>High</td><td>20</td><td>EDR + tested backups</td><td>8</td><td>Head of IT</td></tr><tr><td>R-2</td><td>Site flooding</td><td>Low</td><td>High</td><td>12</td><td>Barrier + insurance</td><td>10</td><td>Facilities lead</td></tr><tr><td>R-3</td><td>Data entry error</td><td>High</td><td>Low</td><td>9</td><td>Four-eyes check</td><td>11</td><td>Ops manager</td></tr><tr><td>R-4</td><td>Fire in hall B</td><td>Low</td><td>High</td><td>14</td><td>Sprinklers</td><td>9</td><td>The firewall</td></tr></tbody></table>", "hint": "Residual can never be higher than inherent — controls do not make things worse. And an owner must be a person, not a device.", "ex": "<p>Two impossible cells: <b>R-3 residual 11</b> — residual risk must be <b>lower</b> than inherent risk (9), because controls only reduce risk; if a control makes things worse, it is not a control. <b>R-4 owner “The firewall”</b> — a <b>risk owner</b> must be a <b>person</b> with authority to fund and accept decisions; a device cannot accept a risk. The other rows are consistent: residual below inherent, named owners, controls that plausibly reduce the score.</p>", "lines": [{"s": "R-3: Residual = 11 (inherent was 9)", "bad": true}, {"s": "R-4: Owner = “The firewall”", "bad": true}, {"s": "R-1: Residual = 8 (inherent 20, EDR + backups)", "bad": false}, {"s": "R-2: Residual = 10 (inherent 12, barrier + insurance)", "bad": false}]}, {"t": "qcm", "th": "threat", "lbl": "Who defaced the page?", "sc": "<p>Overnight, the marketing site's homepage was replaced with a joke banner. Forensics shows the attacker used a known exploit copied from a hacking forum, against a random target from a list of 500 companies. Nothing else was touched, no data was taken.</p>", "q": "<p>Which description fits the most likely actor?</p>", "hint": "Random target, copied tools, joke banner, no profit — think about skill and motive.", "ex": "<p>This is a classic <b>script kiddie</b>: low skill, uses other people's tools (the copied exploit), runs an <b>opportunistic attack</b> — a random target list, no research — and wants attention, not money or secrets. An <b>advanced persistent threat (APT)</b>, usually nation-state, works quietly for months on one chosen victim in a <b>targeted attack</b>. A <b>cybercriminal</b> wants money — ransom or card data. A <b>hacktivist</b> attacks for a political cause and leaves a message. Random + loud + copied tools = script kiddie.</p>", "opts": ["An opportunistic, low-skill attacker with copied tools", "A nation-state crew running a long espionage campaign", "An insider with admin rights stealing customer data", "A hacktivist pushing a political cause about our sector"], "ans": 0}, {"t": "ddcat", "th": "threat", "lbl": "Know your actors", "sc": "<p>HR asks the security team to run a short workshop for new joiners: <i>“Who actually attacks companies?”</i> You prepare eight anonymised mini-cases and four actor cards.</p>", "q": "<p>Sort each mini-case into the actor type it describes.</p>", "hint": "Follow the motive: money, politics, revenge or access from inside, espionage for a state, and skill level.", "ex": "<p><b>Insider threat</b>: the admin selling the client list before quitting, and the disgruntled operator opening the plant gates — the danger starts <i>inside</i> with legitimate access. <b>Hacktivist</b>: the oil-company defacement over a pipeline protest and the NGO takeover during an election — political motive. <b>Cybercriminal</b>: the ransomware crew demanding 2 million and the card-skimming ring — profit motive. <b>Nation-state</b>: the telecom backdoor for intelligence and the state-run lab — espionage, patience, state funding. Motive is the fastest clue: money = cybercriminal, politics = hacktivist, access + grudge = insider, espionage = nation-state.</p>", "cats": ["Insider threat", "Hacktivist", "Cybercriminal", "Nation-state"], "items": [{"s": "An admin copies the client list to sell before resigning", "c": 0}, {"s": "A group defaces an oil company's site over a pipeline protest", "c": 1}, {"s": "A ransomware crew demands 2 million USD from a hospital chain", "c": 2}, {"s": "An intelligence service keeps a quiet backdoor in a telecom network", "c": 3}, {"s": "A disgruntled operator opens the plant gates remotely after a dispute", "c": 0}, {"s": "A campaign takes over an NGO's website during an election", "c": 1}, {"s": "A card-skimming ring implants readers in petrol stations", "c": 2}, {"s": "A state-linked lab builds custom tools for one specific target", "c": 3}]}, {"t": "order", "th": "vuln", "lbl": "Vulnerability management lifecycle", "sc": "<p>You are writing the one-page “How we handle vulnerabilities” slide for the ops onboarding pack. The process must show the five lifecycle stages in order.</p>", "q": "<p>Put the five stages in the correct order.</p>", "hint": "First find it, then decide how bad it is, then fix, then confirm the fix worked.", "ex": "<p><b>1. Discover</b> — run a <b>vulnerability scan</b> (and review CVE feeds) to find weaknesses. <b>2. Prioritize</b> — rank findings by CVSS, exposure and asset value; you cannot fix everything at once. <b>3. Assess</b> — validate the finding in context (is the service reachable? is there a workaround?). <b>4. Remediate</b> — patch or apply another fix; this is <b>patch management</b> in action. <b>5. Verify</b> — re-scan to prove the weakness is gone. Scanning again last is what catches “we patched but it did not apply” cases.</p>", "seq": ["Discover — scan systems for known weaknesses", "Prioritize — rank findings by severity and exposure", "Assess — validate each finding in its context", "Remediate — patch or apply a compensating fix", "Verify — re-scan and confirm the weakness is gone"]}, {"t": "triage", "th": "risk", "lbl": "Choose the response", "sc": "<p>The change advisory board forwards five situations to you before Thursday's meeting. For each one, the minute-taker needs the standard risk-response term.</p>", "q": "<p>Choose the correct response type for each situation.</p>", "hint": "Ending the activity = avoid. Making it safer = mitigate. Moving the pain = transfer. Living with it knowingly = accept.", "ex": "<p>1. Filling in the basement pool removes the activity — <b>risk avoidance</b>. 2. A 2,000 EUR expected yearly loss is cheaper than a 40,000 EUR fix — the company knowingly lives with it — <b>risk acceptance</b> (documented). 3. Patch, restrict and monitor the old VPN — risk reduced with controls — <b>risk mitigation</b>. 4. Insurance and a flood-safe provider carry the financial pain — <b>risk transference</b>. 5. MFA rollout lowers account-takeover risk — <b>risk mitigation</b> again. Watch the classic traps: installing more controls is never “transfer”, and doing nothing because “it will be fine” is only acceptance when it is signed off — the risk must sit inside the company's <b>risk appetite</b> and the owner's <b>risk tolerance</b>, and the owner signs the note.</p>", "rows": [{"s": "The unused swimming pool in the office basement will be filled in.", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 2}, {"s": "Expected yearly loss 2,000 EUR; the only fix costs 40,000 EUR. The CISO signs the note.", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 1}, {"s": "The old VPN must stay: patch it, restrict access to two subnets, add monitoring.", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 0}, {"s": "Stock moves to a flood-safe warehouse and a new insurance rider covers the rest.", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 3}, {"s": "MFA rolls out next quarter to cut account-takeover incidents.", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 0}]}, {"t": "logview", "th": "threat", "lbl": "Intel bulletin meets the SIEM", "sc": "<p>A threat-intelligence bulletin arrived at 09:10. Your SIEM shows VPN activity you were about to dismiss as noise. Your lead asks you to write the SOC note with the exact terms.</p>", "q": "<p>Complete the SOC note — pick a word for each blank.</p>", "art": "<pre class='log'>== INTEL BULLETIN 2026-041 ==\nCriminal group “NOVABREAK” targets VPN appliances of mid-size\nfirms using CVE-2024-9999. Public exploit available. Motive: money.\nIndicators: login bursts from new hosting providers, config uploads.</pre>", "hint": "The bulletin names the group, the flaw and the motive. “Known flaw”, “code that uses it”, “chosen victim profile”, “where the tip came from”.", "ex": "<p>The SOC note: the VPN appliance had a known <b>vulnerability</b> (CVE-2024-9999 — a weakness). The group used a public <b>exploit</b> (code that uses the weakness) to get in. Because NOVABREAK picks mid-size firms with this exact appliance, the activity is a <b>targeted attack</b>, not a random one — an <b>opportunistic attack</b> hits anything reachable. The tip came from <b>threat intelligence</b>: outside knowledge about actors, their tools and their <b>indicators of compromise (IoCs)</b>, which turned “noise” into a match.</p>", "logs": ["09:02:11 vpn-gw auth failed user=admin from=198[.]51[.]100[.]23 asn=NEW-HOSTING", "09:02:19 vpn-gw auth failed user=root  from=198[.]51[.]100[.]23 asn=NEW-HOSTING", "09:02:27 vpn-gw auth failed user=svc-vpn from=198[.]51[.]100[.]23 asn=NEW-HOSTING", "09:03:44 vpn-gw auth accepted user=svc-vpn from=198[.]51[.]100[.]23 asn=NEW-HOSTING", "09:04:02 vpn-gw config upload /opt/vpn/ovpn.conf from=198[.]51[.]100[.]23", "09:04:31 vpn-gw session closed user=svc-vpn"], "w": {"k": "fill", "pre": ["<p>SOC note: the VPN appliance carried a known ", "", " (CVE-2024-9999). The group used a public ", "", " to gain access. Because the victim profile matches the bulletin, this is best classified as a ", "", " attack rather than a random one. The early warning came from ", "", ".</p>"], "ans": ["vulnerability", "exploit", "targeted", "threat intelligence"], "bank": ["vulnerability", "exploit", "targeted", "threat intelligence", "opportunistic", "acceptance", "zero-day", "availability"]}}, {"t": "ddcat", "th": "cia", "lbl": "Sort the controls", "sc": "<p>The new security poster for the operations floor groups nine controls under the three CIA columns. The designer needs the exact placement from you before printing.</p>", "q": "<p>Sort each control into the CIA element it mainly protects.</p>", "hint": "Who can see / who can get in = confidentiality. Not changed = integrity. Still running, not lost = availability.", "ex": "<p><b>Confidentiality</b>: full-disk encryption, HTTPS/TLS, <b>access control</b> reviews that remove stale accounts, and the badge system at the door — all decide <i>who can access</i>. <b>Integrity</b>: file-integrity monitoring alerts on changes, and code signing proves releases were not modified — both keep data and software <i>unchanged</i>. <b>Availability</b>: offsite backups survive site loss, UPS plus generator bridge power cuts, RAID and failover keep services running — all keep systems <i>usable</i>. Many controls help two pillars at once, but posters pick the main pillar.</p>", "cats": ["Confidentiality", "Integrity", "Availability"], "items": [{"s": "Full-disk encryption on servers", "c": 0}, {"s": "HTTPS/TLS on the public web shop", "c": 0}, {"s": "Quarterly access reviews remove stale accounts", "c": 0}, {"s": "Badge system at the data-centre door", "c": 0}, {"s": "File-integrity monitoring on system folders", "c": 1}, {"s": "Code signing of release packages", "c": 1}, {"s": "Offsite backups tested monthly", "c": 2}, {"s": "UPS plus diesel generator", "c": 2}, {"s": "RAID array with failover cluster", "c": 2}]}, {"t": "fill", "th": "vuln", "lbl": "The zero-day story", "sc": "<p>A developer asks in the team channel: “What exactly is a zero-day, and why does our scanner keep saying everything is fine?” You write a short explainer with gaps for the key words.</p>", "q": "<p>Complete the explainer with a word for each blank.</p>", "hint": "The flaw has no patch. The code that uses it may exist. Scanners only know yesterday's flaws. Fixes arrive through updates.", "ex": "<p>A <b>zero-day vulnerability</b> is a flaw the vendor has known for zero days — no patch exists yet. When attackers build a working <b>zero-day exploit</b> before the fix ships, <b>exposure</b> is highest. A <b>vulnerability scan</b> compares software versions against known CVE entries, so it can only find <i>known</i> flaws — it will happily report “fine” on a zero-day. Vendors ship fixes through <b>patch management</b>, which is why fast patching shrinks the window. Defences for zero-days are behaviour-based: EDR, network monitoring and least privilege.</p>", "pre": ["<p>A ", "", " vulnerability is a flaw with no patch available yet. If attackers build a working ", "", " before the vendor ships a fix, exposure is highest. A ", "", " scan only finds known weaknesses, so it can miss a zero-day. Vendors deliver fixes through ", "", " management.</p>"], "ans": ["zero-day", "exploit", "vulnerability", "patch"], "bank": ["zero-day", "exploit", "vulnerability", "patch", "breach", "appetite", "firewall", "signature"]}, {"t": "spot", "th": "risk", "lbl": "Policy sentences that misuse terms", "sc": "<p>A manager drafted six sentences for the risk-policy handbook. The GRC lead reads them and sighs: “Two of these use the risk-response words wrongly. Mark them.”</p>", "q": "<p>Click the two sentences that use a risk-response term incorrectly. Click again to unmark.</p>", "hint": "Installing controls reduces risk — that is mitigation, not acceptance. Patching is also mitigation, never transfer.", "ex": "<p>Wrong sentence 1: <i>“We accept risk by installing more firewalls.”</i> Installing controls <b>reduces</b> risk — that is <b>mitigation</b>. Acceptance means living with a risk and signing it off, no new controls. Wrong sentence 2: <i>“We transfer risk by patching servers.”</i> Patching is <b>mitigation</b> too — transfer means moving the financial pain to another party, like insurance or a contract clause. The correct sentences use the words properly: insurance = transfer, filters and training = mitigation, not collecting unneeded data = avoidance, what remains = residual.</p>", "lines": [{"s": "We transfer the risk of fire by buying insurance.", "bad": false}, {"s": "We mitigate the phishing risk with mail filters and training.", "bad": false}, {"s": "We accept the risk by installing more firewalls.", "bad": true}, {"s": "We avoid data-leak risk by not collecting data we do not need.", "bad": false}, {"s": "Residual risk is what remains after our controls.", "bad": false}, {"s": "We transfer risk by patching servers every month.", "bad": true}]}, {"t": "branch", "th": "threat", "lbl": "The salary-adjustment email", "sc": "<p>08:15. Several users report an email: <i>“HR: salary adjustments for 2026 — review your letter here.”</i> The link goes to an external page that looks like the intranet. Three users say they already clicked and typed their password.</p>", "q": "<p>Decide step by step. Each choice unlocks the next step.</p>", "hint": "Never click to “check”. Reset what the attackers caught. Then name what the stolen passwords endanger.", "ex": "<p>Step 1: never click the link yourself — check the sender and headers and report to the SOC. Forwarding it “as a warning” can spread the attack. Step 2: three users typed passwords, so <b>reset those credentials</b> and block the phishing domain; waiting for month-end leaves attacker doors open. Step 3: the fake page <b>harvested passwords</b> — passwords protect <b>confidentiality</b>: whoever holds them can read mail and files that should stay private. The email itself was the <b>attack vector</b>: the path the attacker used to reach users.</p>", "steps": [{"p": "Your first move as the SOC analyst?", "opts": ["Do not click; check headers and the sender, report to the SOC", "Click the link once to see if it is really phishing", "Forward the email to all staff as a warning", "Delete the reports — HR sends letters every year"], "ans": 0, "why": "Never confirm phishing by clicking. Headers and the sender domain give facts without risk."}, {"p": "The SOC confirms the link is fake and three users typed passwords. Next?", "opts": ["Reset the three users' credentials and block the phishing domain", "Wait until the month-end change window", "Reinstall the mail server", "Reply to the attacker asking them to stop"], "ans": 0, "why": "Stolen passwords are live keys — reset them now and block the domain. Waiting leaves the door open."}, {"p": "The fake page harvested passwords. If users reused them elsewhere, what is mainly endangered?", "opts": ["Confidentiality — the attacker can read mail and files", "Availability — the mail server might slow down", "Integrity — the phishing email was edited", "Nothing — passwords are not data"], "ans": 0, "why": "A stolen password exposes everything the account can read — a confidentiality loss. The phish arrived by the email attack vector."}]}, {"t": "rank", "th": "risk", "lbl": "The 03:00 on-call queue", "sc": "<p>You are on call. Four tickets arrived in the last hour. The runbook says: work in order of urgency — highest first.</p>", "q": "<p>Rank the four tickets from most urgent to least urgent.</p>", "hint": "Active ransomware first. Internet-edge recon next. A lagging replica is unpleasant but redundant. One lockout affects one person.", "ex": "<p><b>1. Ransomware note</b> — active attack spreading by the minute; impact is total and growing. <b>2. Port scan from a single IP</b> — recon at the internet edge: not damaging yet, but often the step before an attack, so review and block. <b>3. Replica 30 minutes behind</b> — a redundancy problem: the main database still works, risk only rises if the primary also fails. <b>4. One locked-out user</b> — one person's productivity; help desk handles it. Urgency = likelihood of growing damage × impact × time pressure.</p>", "seq": ["Ransom note found on the file server, files encrypting", "Port scan across the internet firewall from one IP", "Database replica lag grows past 30 minutes", "A single user cannot log in after forgetting the password"]}, {"t": "fill", "th": "cia", "lbl": "The CIA one-liner", "sc": "<p>End of the induction day. The trainer leaves you with one summary sentence to complete — it must be perfect, it goes on the wall.</p>", "q": "<p>Complete the summary with a word for each blank.</p>", "hint": "Encryption hides, hashing proves, backups keep it running.", "ex": "<p><b>Encryption</b> protects <b>confidentiality</b> — only key holders can read the data. <b>Hashing</b> and digital signatures protect <b>integrity</b> — any change breaks the check. <b>Backups</b> and <b>redundancy</b> protect <b>availability</b> — lost or broken systems can be restored or replaced. Together the three elements form the <b>CIA triad</b>, the classic model for what “secure” means: keep secrets private, keep data true, keep services up.</p>", "pre": ["<p>Encryption protects ", "", ". Hashing and signatures protect ", "", ". Backups and redundancy protect ", "", ". Together they form the ", "", " triad.</p>"], "ans": ["confidentiality", "integrity", "availability", "CIA"], "bank": ["confidentiality", "integrity", "availability", "CIA", "risk", "threat", "exploit", "breach"]}];
</script>
<script>
'use strict';
/* CyberPulseAcademy exam engine — vanilla JS, self-contained. */
var CFG = window.EXAM_CONFIG;
var EX = window.EXERCISES;
var KW = window.EXAM_KEYWORDS;

/* ---------------- utilities ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ var r=a.slice(),i,j,t; for(i=r.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function fmtPts(x){ return (Math.round(x*100)/100).toString(); }
function fmtTime(s){ var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }

/* ---------------- state ---------------- */
var S = null;          /* global state */
var timerId = null;

function blank(){
  return { skipped:false, hinted:false, checked:false, locked:null, sel:null, disp:null };
}
function buildDisp(ex){
  var d = {};
  if(ex.t==='qcm'||ex.t==='multi') d.oOrd = shuffle(ex.opts.map(function(_,i){return i;}));
  if(ex.t==='fill') d.bOrd = shuffle(ex.bank.slice());
  if(ex.t==='ddcat'){ d.iOrd = shuffle(ex.items.map(function(_,i){return i;})); d.place = ex.items.map(function(){return null;}); }
  if(ex.t==='match') d.rOrd = shuffle(ex.right.map(function(_,i){return i;}));
  if(ex.t==='order'||ex.t==='rank') d.cur = shuffle(ex.seq.map(function(_,i){return i;}));
  if(ex.t==='spot') d.sel = [];
  if(ex.t==='triage'){ d.rOrd = ex.rows.map(function(r){ return shuffle(r.opts.map(function(_,i){return i;})); }); d.sel = ex.rows.map(function(){return null;}); }
  if(ex.t==='branch'){ d.sOrd = ex.steps.map(function(st){ return shuffle(st.opts.map(function(_,i){return i;})); }); d.sel = ex.steps.map(function(){return null;}); }
  if(ex.t==='terminal') d.cmds = [];
  if(ex.t==='logview'){
    if(ex.w.k==='qcm'||ex.w.k==='multi') d.oOrd = shuffle(ex.w.opts.map(function(_,i){return i;}));
    if(ex.w.k==='fill') d.bOrd = shuffle(ex.w.bank.slice());
    d.filter = '';
  }
  return d;
}
function freshState(){
  return {
    attempt:1, order:shuffle(EX.map(function(_,i){return i;})), cur:0,
    ans:EX.map(function(ex){ var b=blank(); b.disp=buildDisp(ex); return b; }),
    started:false, finished:false, manual:false, checkPause:false,
    remaining:CFG.totalSeconds, reported:false, candidate:''
  };
}

/* ---------------- scoring ---------------- */
function normCmd(s){ return String(s).trim().toLowerCase().replace(/\s+/g,' '); }

function gradeWidget(w, sel, d){
  if(w.k==='qcm'){
    var ok = sel===w.ans;
    return { earned: ok?1:0, K:1, els:[{ok:ok, msg: ok? 'Correct choice.' : 'You chose a different option; the correct one is: <b>'+w.opts[w.ans]+'</b>'}], your: sel==null?'(no answer)':escStrip(w.opts[sel]), corr: escStrip(w.opts[w.ans]) };
  }
  if(w.k==='multi'){
    var K=w.ans.length, hit=0, els=[];
    w.ans.forEach(function(ai){
      var got = sel && sel.indexOf(ai)>=0;
      if(got) hit++;
      els.push({ok:got, msg:(got?'\u2713 ':'\u2717 ')+'<b>'+escStrip(w.opts[ai])+'</b> '+(got?'was one of the right answers.':'was a right answer you missed.')});
    });
    if(sel) sel.forEach(function(si){
      if(w.ans.indexOf(si)<0) els.push({ok:false, msg:'\u2717 You picked <b>'+escStrip(w.opts[si])+'</b>, but that is not one of the right answers.'});
    });
    return { earned: hit/K, K:K, els:els, your: sel&&sel.length? sel.map(function(i){return escStrip(w.opts[i]);}).join('; '):'(nothing selected)', corr: w.ans.map(function(i){return escStrip(w.opts[i]);}).join('; ') };
  }
  if(w.k==='fill'){
    var K2=w.ans.length, hit2=0, els2=[];
    for(var i=0;i<K2;i++){
      var ok2 = sel && sel[i]===w.ans[i];
      if(ok2) hit2++;
      els2.push({ok:ok2, msg:(ok2?'\u2713':'\u2717')+' Blank '+(i+1)+': correct word is <b>'+esc(w.ans[i])+'</b>'+(ok2?'':', you had <b>'+esc(sel&&sel[i]?sel[i]:'(empty)')+'</b>')});
    }
    return { earned: hit2/K2, K:K2, els:els2, your: w.ans.map(function(_,i){return sel&&sel[i]?sel[i]:'(empty)';}).join(', '), corr: w.ans.join(', ') };
  }
  return { earned:0, K:1, els:[], your:'', corr:'' };
}
function escStrip(h){ var d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); }

function grade(i){
  var ex = EX[i], a = S.ans[i], sel = a.sel, d = a.disp, out;
  switch(ex.t){
    case 'qcm': out = gradeWidget({k:'qcm', opts:ex.opts, ans:ex.ans}, sel, d); break;
    case 'multi': out = gradeWidget({k:'multi', opts:ex.opts, ans:ex.ans}, sel, d); break;
    case 'fill': out = gradeWidget({k:'fill', ans:ex.ans}, sel, d); break;
    case 'logview': out = gradeWidget(ex.w, sel, d); break;
    case 'ddcat': {
      var Kc=ex.items.length, hitc=0, elsc=[];
      d.iOrd.forEach(function(ii){
        var it=ex.items[ii], got=d.place[ii];
        var ok = got===it.c;
        if(ok) hitc++;
        elsc.push({ok:ok, msg:(ok?'\u2713':'\u2717')+' <b>'+escStrip(it.s)+'</b> \u2192 '+esc(ex.cats[it.c])+(ok?'':(got!=null?', you said '+esc(ex.cats[got]):' (not placed)'))});
      });
      out = { earned: hitc/Kc, K:Kc, els:elsc, your: ex.items.map(function(it,ii){ return escStrip(it.s)+'\u2192'+(d.place[ii]!=null?ex.cats[d.place[ii]]:'-'); }).join('; '), corr: ex.items.map(function(it){ return escStrip(it.s)+'\u2192'+ex.cats[it.c]; }).join('; ') };
      break;
    }
    case 'match': {
      var Km=ex.left.length, hitm=0, elsm=[];
      for(var mi=0;mi<Km;mi++){
        var okm = sel && sel[mi]===ex.ans[mi];
        if(okm) hitm++;
        elsm.push({ok:okm, msg:(okm?'\u2713':'\u2717')+' <b>'+escStrip(ex.left[mi])+'</b> \u2192 '+escStrip(ex.right[ex.ans[mi]])+(okm?'':', you said '+((sel&&sel[mi]!=null)?escStrip(ex.right[sel[mi]]):'(empty)'))});
      }
      out = { earned: hitm/Km, K:Km, els:elsm, your: ex.left.map(function(l,li){ return escStrip(l)+'\u2192'+((sel&&sel[li]!=null)?escStrip(ex.right[sel[li]]):'-'); }).join('; '), corr: ex.left.map(function(l,li){ return escStrip(l)+'\u2192'+escStrip(ex.right[ex.ans[li]]); }).join('; ') };
      break;
    }
    case 'order': case 'rank': {
      var Ko=ex.seq.length, hito=0, elso=[];
      for(var oi=0;oi<Ko;oi++){
        var oko = d.cur[oi]===oi;
        if(oko) hito++;
        elso.push({ok:oko, msg:(oko?'\u2713':'\u2717')+' Position '+(oi+1)+': correct is <b>'+escStrip(ex.seq[oi])+'</b>'+(oko?'':', you had <b>'+escStrip(ex.seq[d.cur[oi]])+'</b>')});
      }
      out = { earned: hito/Ko, K:Ko, els:elso, your: d.cur.map(function(ii){return escStrip(ex.seq[ii]);}).join(' \u2192 '), corr: ex.seq.map(function(s){return escStrip(s);}).join(' \u2192 ') };
      break;
    }
    case 'spot': {
      var Kb=0, hits=0, elss=[];
      /* pickGood flips the task: the targets are the BENIGN lines, marking an
         attack line is the error. Default (undefined) keeps the classic task. */
      var target = function(ln){ return ex.pickGood? !ln.bad : ln.bad; };
      ex.lines.forEach(function(ln, li){
        var picked = d.sel.indexOf(li)>=0;
        if(target(ln)){
          Kb++;
          if(picked){ hits++; elss.push({ok:true, msg:'\u2713 You marked '+(ex.pickGood?'the benign line':'the real issue')+': '+esc(ln.s)}); }
          else { elss.push({ok:false, msg:'\u2717 Missed '+(ex.pickGood?'a benign line':'a real issue')+': '+esc(ln.s)}); }
        }
        else if(picked){ elss.push({ok:false, msg:'\u2717 You marked <i>'+esc(ln.s)+'</i>, but '+(ex.pickGood?'this is attack traffic, not normal.':'this line is normal.')}); }
      });
      out = { earned: Kb? hits/Kb : 0, K:Math.max(Kb,1), els:elss, your: (d.sel.length? d.sel.map(function(li){return esc(ex.lines[li].s);}).join('; '):'(nothing marked)'), corr: ex.lines.filter(function(ln){ return target(ln); }).map(function(ln){return esc(ln.s);}).join('; ') };
      break;
    }
    case 'terminal': {
      var Kt=ex.okGroups.length, hitt=0, elst=[], lines=(sel&&sel.cmds? sel.cmds:[]);
      ex.okGroups.forEach(function(g, gi){
        var okt = lines.some(function(c){ return new RegExp(g.re,'i').test(normCmd(c)); });
        if(okt) hitt++;
        elst.push({ok:okt, msg:(okt?'\u2713':'\u2717')+' Required step '+(gi+1)+' of the task '+(okt?'done.':'missing (expected something like: <code>'+esc(g.sample)+'</code>)')});
      });
      out = { earned: Kt? hitt/Kt : 0, K:Math.max(Kt,1), els:elst, your: lines.length? lines.map(esc).join(' ; '):'(no command)', corr: ex.okGroups.map(function(g){return g.sample;}).join(' ; ') };
      break;
    }
    case 'triage': {
      var Kr=ex.rows.length, hitr=0, elsr=[];
      for(var ri=0;ri<Kr;ri++){
        var okr = sel && sel[ri]===ex.rows[ri].ans;
        if(okr) hitr++;
        elsr.push({ok:okr, msg:(okr?'\u2713':'\u2717')+' Alert '+(ri+1)+' \u2192 <b>'+escStrip(ex.rows[ri].opts[ex.rows[ri].ans])+'</b>'+(okr?'':', you said '+((sel&&sel[ri]!=null)?escStrip(ex.rows[ri].opts[sel[ri]]):'(no answer)'))});
      }
      out = { earned: hitr/Kr, K:Kr, els:elsr, your: ex.rows.map(function(r,rx){ return 'Alert '+(rx+1)+': '+((sel&&sel[rx]!=null)?escStrip(r.opts[sel[rx]]):'-'); }).join('; '), corr: ex.rows.map(function(r,rx){ return 'Alert '+(rx+1)+': '+escStrip(r.opts[r.ans]); }).join('; ') };
      break;
    }
    case 'branch': {
      var Kb2=ex.steps.length, hitb=0, elsb=[];
      for(var bi=0;bi<Kb2;bi++){
        var okb = sel && sel[bi]===ex.steps[bi].ans;
        if(okb) hitb++;
        elsb.push({ok:okb, msg:(okb?'\u2713':'\u2717')+' Step '+(bi+1)+': '+ex.steps[bi].why});
      }
      out = { earned: hitb/Kb2, K:Kb2, els:elsb, your: ex.steps.map(function(st,bx){ return 'Step '+(bx+1)+': '+((sel&&sel[bx]!=null)?escStrip(st.opts[sel[bx]]):'-'); }).join('; '), corr: ex.steps.map(function(st){ return escStrip(st.opts[st.ans]); }).join('; ') };
      break;
    }
    default: out = { earned:0, K:1, els:[], your:'', corr:'' };
  }
  var earned = out.earned;
  out.hits = Math.round(out.earned*out.K);   /* elements correct before the hint penalty */
  if(a.hinted) earned = earned*0.9;
  out.earnedFinal = Math.round(earned*10000)/10000;
  return out;
}

/* ---------------- live score & progress ---------------- */
function lockedList(){ return S.ans.filter(function(a){ return a.locked; }); }
function earnedTotal(){ var t=0; lockedList().forEach(function(a){ t+=a.locked.earnedFinal; }); return t; }
function updateHud(){
  var locked = lockedList().length;
  $('scoreChip').innerHTML = '\u25c6 Score: <b>'+fmtPts(earnedTotal())+'</b> pts';
  $('progChip').innerHTML = '\u2713 Answered: <b>'+locked+' / '+EX.length+'</b>';
  $('barIn').style.width = Math.round(locked/EX.length*100)+'%';
  var themes={};
  EX.forEach(function(ex,i){ if(!themes[ex.th]) themes[ex.th]={n:0,d:0}; themes[ex.th].n++; if(S.ans[i].locked) themes[ex.th].d++; });
  $('themes').innerHTML = KW.map(function(t){
    var c = themes[t.id]||{n:0,d:0};
    return '<span class="tchip'+(c.d===c.n&&c.n>0?' done':'')+'">'+esc(t.name)+' '+c.d+'/'+c.n+'</span>';
  }).join('');
  renderNav();
}
function renderNav(){
  var html='';
  S.order.forEach(function(exIdx, pos){
    var a=S.ans[exIdx];
    var cls='nq';
    if(a.locked){ cls += a.locked.earnedFinal>=0.999?' done':(a.locked.earnedFinal<=0.001?' zero':' part'); }
    else if(a.skipped){ cls+=' skip'; }
    if(pos===S.cur) cls+=' cur';
    html+='<button type="button" class="'+cls+'" data-pos="'+pos+'" title="Q'+(pos+1)+': '+esc(EX[exIdx].lbl)+'" aria-label="Question '+(pos+1)+'">'+(pos+1)+'</button>';
  });
  $('navGrid').innerHTML=html;
}

/* ---------------- timer ---------------- */
function tick(){
  if(!S || !S.started || S.finished) return;
  if(!S.manual && !S.checkPause){
    S.remaining--;
    if(S.remaining<=0){ S.remaining=0; renderTimer(); finish('time'); return; }
  }
  renderTimer();
}
function renderTimer(){
  var t=$('timer');
  t.textContent='\u23f1 '+fmtTime(S.remaining);
  t.className = (S.remaining <= CFG.totalSeconds*0.1) ? 'low' : '';
}
function setPauseIndicators(){
  $('pindManual').className = 'pind'+(S.manual?' on':'');
  $('pindCheck').className = 'pind'+(S.checkPause?' on':'');
}
function toggleManual(){
  if(S.finished) return;
  S.manual=!S.manual;
  setPauseIndicators();
  var card=$('exWrap');
  if(card) card.classList.toggle('pausedBlur', S.manual);
}

/* ---------------- rendering ---------------- */
function currentIdx(){ return S.order[S.cur]; }

function optLabel(kind){
  return kind==='multi' ? 'SELECT ALL THAT APPLY' : 'CHOOSE ONE';
}
function renderWidgetAnswer(w, sel, d, prefix){
  /* returns HTML for answer area of widget (qcm/multi/fill) */
  if(w.k==='qcm'||w.k==='multi'){
    var h = '<div class="radios" role="radiogroup" aria-label="Answer choices">';
    d.oOrd.forEach(function(oi){
      var type = w.k==='qcm'?'radio':'checkbox';
      var checked = w.k==='qcm' ? (sel===oi) : (sel && sel.indexOf(oi)>=0);
      h+='<label class="optrow"><input type="'+type+'" name="'+prefix+'" value="'+oi+'" '+(checked?'checked':'')+'><span>'+w.opts[oi]+'</span></label>';
    });
    return h+'</div>';
  }
  var h2='<div class="fillwrap">';
  /* Blank markers: empty string segments in `pre` mark blank positions, so every
     select sits exactly where the sentence needs it. Fallback for arrays without
     markers: one slot after each of the first ans.length segments. */
  var hasMarkers = w.pre.some(function(s){ return s===''; });
  var slotI = 0;
  w.pre.forEach(function(seg){
    h2+=seg;
    var need = hasMarkers ? (seg==='' && slotI<w.ans.length) : (slotI<w.ans.length);
    if(need){
      var cur2 = sel&&sel[slotI]? sel[slotI]:'';
      h2+='<span class="slot"><select class="pick" data-slot="'+slotI+'" aria-label="Blank '+(slotI+1)+'"><option value="">\u2014 pick \u2014</option>';
      d.bOrd.forEach(function(bw){ h2+='<option value="'+esc(bw)+'" '+(cur2===bw?'selected':'')+'>'+esc(bw)+'</option>'; });
      h2+='</select></span>';
      slotI++;
    }
  });
  return h2+'</div>';
}
function bindWidgetEvents(w, root, a, prefix){
  if(w.k==='qcm'||w.k==='multi'){
    root.querySelectorAll('input[name="'+prefix+'"]').forEach(function(inp){
      inp.addEventListener('change', function(){
        if(a.locked) return;
        if(w.k==='qcm'){ a.sel=[parseInt(inp.value,10)]; a.sel=a.sel[0]; }
        else { if(!a.sel) a.sel=[]; var v=parseInt(inp.value,10); if(inp.checked){ if(a.sel.indexOf(v)<0) a.sel.push(v); } else { a.sel=a.sel.filter(function(x){return x!==v;}); } }
      });
    });
  } else if(w.k==='fill'){
    root.querySelectorAll('select.pick').forEach(function(s){
      s.addEventListener('change', function(){
        if(a.locked) return;
        if(!a.sel) a.sel=[];
        a.sel[parseInt(s.getAttribute('data-slot'),10)] = s.value;
      });
    });
  }
}
