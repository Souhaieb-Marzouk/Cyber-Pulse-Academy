<!DOCTYPE html>
<html lang="en">
<head>

<title>5.1 - Troubleshooting methodology</title>
<script type="application/json" id="cm-exercise-meta">{"topicId": "network-plus", "chapter": 5.1, "title": "5.1 - Troubleshooting methodology", "difficulty": "medium", "questionCount": 30, "estimatedMinutes": 75, "passMark": 70}</script>
<style>
:root{
  --bg:#0b0f14;--panel:#121821;--panel2:#0e141c;--line:#243244;--line2:#1a2432;
  --tx:#e4ecf5;--dim:#9fb0c2;--mut:#7d90a3;
  --blue:#4da3ff;--green:#3fd06c;--green2:#123420;--red:#ff6b60;--red2:#3a1512;
  --amber:#ffc043;--amber2:#33270e;--purple:#b48cff;--cyan:#57c7e3;
  --mono:'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--bg);color:var(--tx);font:15px/1.55 'Segoe UI','Noto Sans',Arial,sans-serif;padding:0 0 60px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
h1,h2,h3{line-height:1.25}
button{font:inherit}
a{color:var(--blue)}
.mono,pre,code,input[type=text],textarea{font-family:var(--mono)}
/* ---------- header ---------- */
.hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);margin-bottom:14px}
.hdr .t{font-weight:700;font-size:1.02rem}
.hdr .t small{display:block;color:var(--mut);font-weight:400;font-size:.8rem}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;color:var(--dim);min-height:32px}
.chip b{color:var(--tx)}
#tmr{font-family:var(--mono);font-size:1.05rem;color:var(--cyan);min-width:74px;text-align:center}
#tmr.low{color:var(--red);font-weight:700}
.badge{display:none;border-radius:8px;padding:6px 10px;font-size:.8rem;min-height:32px;align-items:center;gap:6px}
.badge.on{display:inline-flex}
#mpInd{background:var(--amber2);border:1px solid var(--amber);color:var(--amber)}
#cpInd{background:#0d2033;border:1px solid var(--blue);color:var(--blue)}
/* ---------- progress ---------- */
.pbar{height:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-bottom:8px}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .4s}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.thm{font-size:.72rem;color:var(--dim);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
.thm b{color:var(--tx)}
.thm i{display:block;height:4px;border-radius:3px;background:var(--panel);margin-top:3px;overflow:hidden;font-style:normal}
.thm i>u{display:block;height:100%;background:var(--green);text-decoration:none}
/* ---------- navigator ---------- */
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 16px}
.nav button{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-size:.86rem;position:relative}
.nav button small{display:block;font-size:.62rem;line-height:1;color:var(--mut)}
.nav button.cur{outline:2px solid var(--blue);color:var(--tx)}
.nav button.done{border-color:var(--green);color:var(--green)}
.nav button.skip{border-color:var(--amber);color:var(--amber)}
.nav button.dirty{border-color:var(--blue);color:var(--blue)}
/* ---------- blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.blab{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.blab::before{content:'';width:9px;height:9px;border-radius:2px;background:var(--cyan)}
.bq .blab{color:var(--purple)}.bq .blab::before{background:var(--purple)}
.bq{background:#151024;border-color:#3a2a63}
.ba .blab{color:var(--green)}.ba .blab::before{background:var(--green)}
.exmeta{font-size:.8rem;color:var(--mut);margin-bottom:8px}
.exmeta b{color:var(--dim)}
.card p+p{margin-top:8px}
pre.log{background:#07090d;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.6;overflow-x:auto;color:#b7c6d6;white-space:pre-wrap;word-break:break-word}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 18px;border-radius:9px;border:1px solid var(--line);background:#182333;color:var(--tx);cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:#12365c;border-color:var(--blue)}
.btn.ok{background:#123420;border-color:var(--green);color:var(--green)}
.btn.warn{background:#33270e;border-color:var(--amber);color:var(--amber)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* ---------- options ---------- */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;color:var(--tx);cursor:pointer}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;color:var(--dim)}
.opt .mk{margin-left:auto;flex:0 0 auto;font-weight:700}
.opt.sel{border-color:var(--blue);background:#0d2033}
.opt.y{border-color:var(--green);background:var(--green2)}
.opt.n{border-color:var(--red);background:var(--red2)}
.opt.m{border-color:var(--amber);background:var(--amber2)}
.opt .mk.y{color:var(--green)}.opt .mk.n{color:var(--red)}.opt .mk.m{color:var(--amber)}
.opt:disabled{cursor:default}
/* ---------- assign (match/cat/fill) ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;min-height:44px}
.pchip{background:#182333;border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:44px;cursor:grab;color:var(--tx);font-size:.9rem}
.pchip.sel{border-color:var(--blue);background:#0d2033;box-shadow:0 0 0 1px var(--blue)}
.pchip.used{opacity:.35;cursor:default}
.slots,.buckets{display:grid;gap:10px}
.slots{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.buckets{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.slot{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;min-height:72px;cursor:pointer}
.slot.over{border-color:var(--blue)}
.slot .lab{font-size:.8rem;color:var(--dim);margin-bottom:6px}
.slot .fillv{display:inline-flex;align-items:center;gap:6px;background:#182333;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.86rem;min-height:32px}
.slot .fillv .mk{font-weight:700}
.slot.y{border-color:var(--green);border-style:solid;background:var(--green2)}
.slot.n{border-color:var(--red);border-style:solid;background:var(--red2)}
.bucket{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:110px;cursor:pointer}
.bucket.over{border-color:var(--blue)}
.bucket h4{font-size:.86rem;color:var(--cyan);margin-bottom:8px}
.bucket .it{display:flex;gap:6px;align-items:center;background:#182333;border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:.84rem;min-height:44px}
.bucket.y{border-color:var(--green)}
.bucket.n{border-color:var(--red)}
.mk{font-weight:700}
.mk.y{color:var(--green)}.mk.n{color:var(--red)}.mk.m{color:var(--amber)}
/* ---------- fill inline blanks ---------- */
.filltext{font-size:1rem;line-height:2.1}
.blank{display:inline-block;min-width:110px;min-height:44px;border:1px dashed var(--line);border-radius:8px;background:var(--panel2);color:var(--tx);padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:14px;vertical-align:middle}
.blank.over,.blank.sel{border-color:var(--blue)}
.blank.y{border-color:var(--green);background:var(--green2)}
.blank.n{border-color:var(--red);background:var(--red2)}
/* ---------- order ---------- */
.olist{display:grid;gap:8px}
.oitem{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:48px;cursor:grab}
.oitem .num{flex:0 0 auto;width:30px;height:30px;border-radius:7px;background:#182333;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--cyan)}
.oitem .mv{display:flex;gap:4px;margin-left:auto}
.oitem .mv button{width:44px;height:44px;min-height:44px;border-radius:7px;border:1px solid var(--line);background:#182333;color:var(--tx);cursor:pointer}
.oitem.over{border-color:var(--blue)}
.oitem.y{border-color:var(--green)}
.oitem.n{border-color:var(--red)}
/* ---------- terminal ---------- */
.term{background:#07090d;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14px}
.term .pline{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.term .ps1{color:var(--green);font-family:var(--mono)}
.term input{flex:1;min-width:220px;min-height:44px;background:#0d1117;border:1px solid var(--line);border-radius:7px;color:#d7f5df;padding:6px 10px;font-size:14px}
.term .tout{white-space:pre-wrap;color:#9fb0c2;font-size:14px;border-left:2px solid var(--line2);padding:4px 0 4px 10px;margin:6px 0}
.term .plab{color:var(--dim);font-size:.84rem;margin-bottom:4px}
/* ---------- branch ---------- */
.step{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
.step.locked{opacity:.5}
.step .sq{font-weight:600;margin-bottom:8px}
.step .note{font-size:.84rem;color:var(--cyan);margin-top:8px;font-style:italic}
.step.locked .opts .opt{cursor:default}
/* ---------- select-lines (log/spot) ---------- */
.lvhead{font-family:var(--mono);font-size:14px;color:var(--mut);background:#07090d;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.lines{display:grid;gap:3px}
.ln{display:flex;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px;min-height:44px;color:#b7c6d6;cursor:pointer;font-family:var(--mono);font-size:14px;line-height:1.5;align-items:flex-start}
.ln .box{flex:0 0 auto;font-family:var(--mono);color:var(--mut)}
.ln .no{flex:0 0 auto;color:var(--mut);min-width:30px}
.ln:hover{background:#10161f}
.ln.sel{background:#0d2033;border-color:var(--blue)}
.ln.y{border-color:var(--green);background:var(--green2)}
.ln.n{border-color:var(--red);background:var(--red2)}
.ln.m{border-color:var(--amber);background:var(--amber2)}
.ln.err .lv{color:var(--red)}.ln.warn .lv{color:var(--amber)}.ln.ok .lv{color:var(--green)}.ln.info .lv{color:var(--blue)}
.ln .lv{flex:0 0 auto;font-weight:700;min-width:44px}
.lfilter{width:100%;max-width:420px;min-height:44px;background:#07090d;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 12px;font-size:14px;margin-bottom:8px}
/* ---------- feedback / explanation ---------- */
.fdbk{display:none;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.fdbk.show{display:block}
.fdbk .sum{font-weight:700;margin-bottom:6px}
.expl{display:none;border-left:3px solid var(--blue);background:#0d1626;border-radius:0 10px 10px 0;padding:12px 14px;margin-top:10px}
.expl.show{display:block}
.expl h4{color:var(--blue);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.hintbox{display:none;border-left:3px solid var(--amber);background:var(--amber2);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:10px;color:var(--amber);font-size:.92rem}
.hintbox.show{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a1512;border:1px solid var(--red);color:var(--tx);border-radius:10px;padding:10px 18px;display:none;z-index:60;max-width:90vw}
.toast.show{display:block}
/* ---------- pause overlay ---------- */
.pov{display:none;position:fixed;inset:0;background:rgba(7,9,13,.97);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.pov.show{display:flex}
.pov .big{font-size:1.3rem;font-weight:700;color:var(--amber)}
.pov p{color:var(--dim);max-width:440px;text-align:center}
/* ---------- intro / results ---------- */
.hero{background:linear-gradient(160deg,#101a2b,#0d1420 55%);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:16px}
.hero h1{font-size:1.45rem;margin-bottom:6px}
.hero .sev{display:inline-block;background:#33270e;border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.08em;margin-bottom:10px}
.hero p{color:var(--dim)}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.kw{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kw h4{color:var(--cyan);font-size:.85rem;margin-bottom:6px}
.kw ul{list-style:none}
.kw li{font-size:.82rem;color:var(--dim);padding:2px 0 2px 14px;position:relative}
.kw li::before{content:'▸';position:absolute;left:0;color:var(--purple)}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.rules h3{margin-bottom:8px;color:var(--purple)}
.rules ul{list-style:none}
.rules li{padding:5px 0 5px 24px;position:relative;color:var(--dim)}
.rules li::before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:700}
.rules li b{color:var(--tx)}
.score{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:12px 0}
.score .pct{font-size:2.6rem;font-weight:800;font-family:var(--mono)}
.score .pct.pass{color:var(--green)}.score .pct.fail{color:var(--red)}
.cert{border:2px solid var(--green);background:var(--green2);border-radius:14px;padding:18px;text-align:center;margin-bottom:16px}
.cert.f{border-color:var(--red);background:var(--red2)}
.cert h2{font-size:1.4rem}
.cert p{color:var(--dim);margin-top:6px}
table.rep{width:100%;border-collapse:collapse;margin-top:10px;font-size:.86rem}
table.rep th,table.rep td{border:1px solid var(--line2);padding:8px 10px;text-align:left;vertical-align:top}
table.rep th{background:var(--panel2);color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
td .tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700}
.tag.full{background:var(--green2);border:1px solid var(--green);color:var(--green)}
.tag.part{background:var(--amber2);border:1px solid var(--amber);color:var(--amber)}
.tag.zero{background:var(--red2);border:1px solid var(--red);color:var(--red)}
.tag.skip{background:var(--panel2);border:1px solid var(--mut);color:var(--mut)}
details.exd{margin-top:6px}
details.exd summary{cursor:pointer;color:var(--blue);font-size:.82rem;min-height:44px;display:inline-flex;align-items:center;gap:6px}
details.exd .exb{margin-top:6px;color:var(--dim);font-size:.84rem;border-left:2px solid var(--line);padding-left:10px}
.skiplist{background:var(--amber2);border:1px solid var(--amber);color:var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.bigscore{font-family:var(--mono);color:var(--cyan)}
@media (max-width:720px){.hud{width:100%}.hdr{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:no-preference){.pbar>i{transition:width .4s}.opt,.pchip,.slot,.oitem{transition:background .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

{id:"M01",tp:"branch",th:"identify",pt:12,ti:"Ticket NET-4821 — walk the method",
sc:"<p><b>07:58 — Helpdesk ticket NET-4821, priority P3.</b> Dana from Accounting calls: 'The intranet portal will not open on my PC.' She is the only caller so far. Your monitoring queue shows no matching alerts.</p>",
qu:"<p>You take the call. Walk the identification steps of the troubleshooting methodology in the right order.</p>",
hi:"Follow the seven steps: gather information, question users, note symptoms, check for changes, duplicate, then form a theory that matches the evidence.",
st:[
 {q:"Step 1 — The phone call. What is your first move?",

      {t:"Reinstall the browser on her PC straight away",nt:"The install runs for ten minutes; the portal still spins and you know less than before."},
      {t:"Replace her laptop with a spare from the storeroom",nt:"The spare reaches her desk; you still have no idea what the fault is."},
      {t:"Raise a firewall change request to open the portal port",nt:"The request is rejected: no theory, no evidence, no change."}]},
 {q:"Step 2 — Dana says: 'Everything gives the same spinner. My teammate two desks away is fine.' What next?",

      {t:"Order a new access switch for the floor",nt:"Purchasing asks for a business case; her teammate is fine, so the switch is unlikely."},

 {q:"Step 3 — Nothing changed on her PC or port. What does the method tell you to do now?",

 {q:"Step 4 — The portal fails only on her PC; your laptop works on her cable. Which theory fits the evidence best?",

      {t:"An ISP outage",nt:"Her teammate and your laptop use the same uplink — the ISP path is clearly working."},
      {t:"The DHCP server is down",nt:"Your laptop just received an address fine, so DHCP is answering."},

ex:"<p>Identification comes before any fix: gather information, question the user, note the symptoms, ask what changed, and try to duplicate the fault. A working teammate and a working laptop on the same cable rule out the network path, so the theory that fits the evidence is a local fault on her PC.</p>"},

{id:"M02",tp:"order",th:"method",pt:14,ti:"The seven steps in order",

 "Document findings, actions, outcomes and lessons learned"],
ex:"<p>The methodology runs: identify, theorise, test, plan, implement (or escalate), verify (plus prevention), document. Testing comes before planning because you plan a fix for a confirmed cause, and verification comes before documentation because you record what you proved.</p>"},

{id:"M03",tp:"qcm",th:"identify",pt:8,ti:"Determine if anything has changed",
sc:"<p><b>Monday 08:40 — ticket INC-4415.</b> Three people from Finance report that the document management system has felt slow since Friday evening. Nobody else has called yet.</p>",
qu:"<p>Which question serves the methodology step <b>determine if anything has changed</b> best?</p>",
hi:"You are looking for a difference between the working past and the broken present: patches, configs, cabling, hardware.",
ch:[
 {t:"Which patches, config pushes or cabling work were applied to the servers or network over the weekend?",ok:1},
 {t:"Which browser and which browser versions are the Finance users running for the document system?"},
 {t:"What time did each Finance user log in on Monday morning, and from which floor did they connect?"},
 {t:"Who is the site's internet provider, and when was the contract last reviewed or renewed?"}],
ex:"<p>'Determine if anything has changed' hunts for the difference between working and broken: weekend patches, config pushes, cabling work or hardware swaps. Browser versions and start times describe the users, not a change, and the provider contract has nothing to do with a Friday-evening slowdown.</p>"},

{id:"M04",tp:"multi",th:"identify",pt:10,ti:"Actions of the identification phase",
sc:"<p>A trainee is sorting the methodology into phases and asks you to check the first card, labelled <b>Identify the problem</b>.</p>",
qu:"<p>Select <b>all</b> actions that belong to the identification phase.</p>",
hi:"Identification collects facts: who, what, when, what changed, and can I reproduce it. Theories and fixes come later.",
ch:[
 {t:"Gather information from users and monitoring",ok:1},
 {t:"Question the affected users about what exactly they see",ok:1},
 {t:"Identify symptoms: which hosts, apps and users are affected",ok:1},
 {t:"Duplicate the problem on a second device if applicable",ok:1},
 {t:"Establish a theory of probable cause"},
 {t:"Document lessons learned in the knowledge base"},
 {t:"Implement preventive measures after the fix"}],
ex:"<p>Identification collects facts: gather information, question users, identify symptoms, and duplicate the fault if you can. Establishing a theory is the next phase, and documenting lessons and preventive measures belong to the very end of the methodology.</p>"},

{id:"M05",tp:"cat",th:"method",pt:12,ti:"Sort nine actions into phases",
sc:"<p>Your team is building a wall poster of the troubleshooting methodology. Nine action cards must land in the right phase column.</p>",
qu:"<p>Drag each action into the phase where the methodology performs it.</p>",
hi:"Ask first (identify), prove next (test), prepare the change third (plan). Rollback and windows are plan work, not test work.",
bk:[
 {n:"Identify the problem",it:["Question the affected user","Check whether anything changed recently","Duplicate the fault on a second PC"]},
 {n:"Test the theory",it:["Ping the gateway to confirm the suspicion","Read switch logs for the suspected failing port","Swap the suspected cable and watch the result"]},
 {n:"Plan &amp; implement",it:["Write a rollback step for the change","Schedule the work in a maintenance window","Record the potential effects in the ticket"]}],
ex:"<p>Identification gathers facts, testing proves or disproves the cause with hands-on checks, and planning prepares the change: rollback, window and recorded effects. Swapping a cable is a test when it confirms a theory — the poster places it where evidence is produced, not where changes are planned.</p>"},

{id:"M06",tp:"fill",th:"identify",pt:10,ti:"Complete the identification sentences",
sc:"<p>The team wiki page about phase 1 lost four words when it was migrated. Rebuild it from the word bank.</p>",
qu:"<p>Fill the four blanks with the correct methodology terms.</p>",
hi:"Two users, two problems. Before a theory: patches, cabling, configuration. Reproducing proves it is real. Facts come from users, tickets and monitoring.",
sg:["When two users report two different faults at the same time, handle each problem ",["individually"]," before moving on. Before you form a theory, ask whether anything ",["changed"]," recently — patches, cabling, or configuration. If you can ",["duplicate"]," the fault on demand, you rule out a one-off glitch. Good identification starts when you ",["gather"]," information from users, tickets and monitoring."],
dk:["simultaneously","escalated","documented","restart","obvious"],
ex:"<p>Problems are handled individually so one fix does not mask the other fault. Checking what changed finds the trigger; duplication proves the fault is real and repeatable; and identification itself is the collection of facts from users, tickets and monitoring.</p>"},
{id:"M07",tp:"match",th:"theory",pt:10,ti:"Four ways to hunt the layer",
sc:"<p>During the theory phase the methodology offers several structured ways to search the OSI stack. Match each approach to how it searches.</p>",
qu:"<p>Assign each approach to its correct description.</p>",
hi:"Top starts at the application, bottom starts at the cable, divide starts in the middle — and the obvious check is not a stack walk at all.",
pr:[
 ["Top-to-bottom","Start at the application layer and work down toward the cable"],
 ["Bottom-up","Start at the physical layer and work up through the stack"],
 ["Divide and conquer","Start at a middle layer such as the network layer and split the search"],
 ["Question the obvious","Check the simple, likely cause first — an unplugged cable or a powered-off device"]],
ex:"<p>Top-to-bottom walks the stack from layer 7 down, bottom-up climbs from layer 1 up, and divide and conquer starts in the middle and chases whichever half fails. Question the obvious is the parallel habit of testing the simplest likely cause before any long walk.</p>"},

{id:"M08",tp:"term",th:"test",pt:12,ti:"Test the DNS theory on HRP-WS-14",
sc:"<p><b>Theory under test:</b> workstation HRP-WS-14 fails to resolve intranet names. The portal, by IP address, opens fine from the same machine. Your analysis host shares her subnet.</p>",
qu:"<p>Type the two test commands in the sandbox below.</p>",
hi:"Use nslookup or dig for the name test. Use ping for the gateway 10[.]20[.]30[.]1 — any flags are fine.",
pm:[
 {lbl:"Test whether the workstation can resolve the portal name intranet.corp.example (use a name-lookup command: nslookup or dig)",
  re:["nslookup intranet","dig intranet","nslookup.*intranet","dig.*intranet"],
  sm:"nslookup intranet.corp.example",
  out:"*** Can't find intranet.corp.example: DNS request timed out\nServer: 10[.]20[.]30[.]53 (10[.]20[.]30[.]53)"},
 {lbl:"Test whether the workstation still reaches its default gateway 10[.]20[.]30[.]1 (use ping — any flags are fine)",
  re:["ping 10[.]20[.]30[.]1","ping.*10[.]20[.]30[.]1"],
  sm:"ping 10[.]20[.]30[.]1",
  out:"Reply from 10[.]20[.]30[.]1: bytes=32 time=1ms TTL=64 (x4)\nGateway reachable — layer 3 to the LAN is fine."}],
ex:"<p>The name lookup times out while the gateway answers, so the path works and only name resolution fails — the DNS theory is confirmed. Testing each part separately is exactly how a theory earns confidence.</p>"},

{id:"M09",tp:"log",th:"identify",pt:12,ti:"APIPA on the client, DHCP on the server",
sc:"<p><b>Ticket INC-4470.</b> A desktop shows APIPA address 169[.]254[.]117[.]9 (mask 255[.]255[.]0[.]0) and no connectivity. The user insists 'the DHCP server is down'. You pull the DHCP server log.</p>",
lv:"dhcp1 · /var/log/dhcpd.log",
qu:"<p><b>Select every line that shows the client kept requesting and the server kept offering, yet no lease was ever completed.</b></p>",
hi:"A lease completes with a REQUEST and an ACK. Offers alone are half a handshake — and a pool with free addresses rules out exhaustion.",
ln:[
 {t:"Jun 10 08:02:11 dhcp1 dhcpd: DHCPDISCOVER from a4:5e:60:c2:11:0b via 10[.]20[.]40[.]1",l:"info",s:1},
 {t:"Jun 10 08:02:11 dhcp1 dhcpd: DHCPOFFER on 10[.]20[.]40[.]187 to a4:5e:60:c2:11:0b",l:"ok",s:1},
 {t:"Jun 10 08:05:47 dhcp1 dhcpd: DHCPDISCOVER from a4:5e:60:c2:11:0b via 10[.]20[.]40[.]1",l:"info",s:1},
 {t:"Jun 10 08:05:47 dhcp1 dhcpd: DHCPOFFER on 10[.]20[.]40[.]187 to a4:5e:60:c2:11:0b",l:"ok",s:1},
 {t:"Jun 10 09:14:02 dhcp1 dhcpd: pool 10[.]20[.]40[.]0/24: 12 addresses free",l:"info"},
 {t:"Jun 10 11:02:33 dhcp1 dhcpd: DHCPINFORM from 10[.]20[.]40[.]55 via 10[.]20[.]40[.]1",l:"info"}],
ex:"<p>Repeated DISCOVER and OFFER pairs with no REQUEST or ACK mean the offer never completes its journey back — the server is answering, so 'DHCP is down' is wrong. The pool line shows free addresses, ruling out exhaustion, and DHCPINFORM is unrelated traffic. The evidence points at the path between server and client: relay, switch, or a local firewall.</p>"},

{id:"M10",tp:"branch",th:"test",pt:12,ti:"Theory confirmed — and then broken",
sc:"<p>Theory: a bad patch cable between the wall port and PC ACC-07. You swap the cable and the link comes up instantly. Tomorrow morning the same fault is back, and the new cable changes nothing.</p>",
qu:"<p>Handle both moments of the test phase correctly.</p>",
hi:"A confirmed theory leads to planning, not paperwork. A broken theory leads to new evidence work — or to escalation.",
st:[
 {q:"The swap confirms the theory. What does the methodology tell you to do next?",
  ch:[{t:"Determine the next steps to resolve: plan the permanent replacement and note its effects",ok:1,nt:"You move to planning with a confirmed cause in hand."},
      {t:"Write the lessons-learned section of the ticket now",nt:"Lessons come after verification — there is no fix yet."},
      {t:"Replace the user's docking station and monitor as well",nt:"Unrelated swaps waste the confirmed finding."},
      {t:"Reboot the floor switch to be safe",nt:"An unplanned change with a confirmed cause already in hand."}]},
 {q:"While planning the cable replacement, which statement about potential effects is true?",
  ch:[{t:"Only this user's link drops for the seconds the swap takes",ok:1,nt:"Correct — the effect is tiny and local, so the plan is simple."},
      {t:"The whole building loses connectivity during the swap",nt:"One patch cable never carries a building."},
      {t:"DHCP scopes must be rebuilt afterwards",nt:"Cabling has no effect on address leases."},
      {t:"BGP peering with the ISP resets",nt:"That lives on the edge router, not on a desk cable."}]},
 {q:"The fault returns and the cable theory now fails its test. What does the method require?",
  ch:[{t:"Re-open the evidence and test a new theory — dock, port, switch — or escalate",ok:1,nt:"Back to evidence — the cable was only one suspect; the dock and the port stay on the list."},
      {t:"Implement the cable replacement plan anyway, despite the failed test",nt:"Implementing a disproven fix wastes a window."},
      {t:"Close the ticket as resolved by the temporary fix and move to the next case",nt:"The fault is demonstrably back — closing is false reporting."},
      {t:"Ask the user to stop using the affected port until it fails again",nt:"That manages the user, not the fault."}]}],
ex:"<p>A confirmed theory moves you to planning the real fix with its effects in mind. When later evidence breaks the theory, you return to the evidence, form a new theory, or escalate — you never implement a fix you know is disproven.</p>"},

{id:"M11",tp:"spot",th:"plan",pt:12,ti:"Spot the mistakes in the plan",
sc:"<p>A junior technician wrote an action plan for replacing a failing uplink module on switch sw-3. The plan is short. Too short.</p>",
lv:"change plan CHG-2290 (draft)",
qu:"<p><b>Click every line that violates the methodology</b> — the plan must identify effects, include rollback and notification, verify with tests, and document.</p>",
hi:"Judge every line against the duties of its phase: a plan must carry effects, rollback and notification, and verification must prove with tests — documentation is never optional.",
ln:[
 {t:"1. Identify: gather information from the user and check what changed on the floor."},
 {t:"2. Theory: the floor's access switch sw-3 has a failing uplink port."},
 {t:"3. Test: check port counters on sw-3 and try a different uplink cable."},
 {t:"4. Plan: replace the switch tonight; no rollback needed and no user warning required.",b:1,why:"A plan must identify potential effects, include a rollback path and notify affected users."},
 {t:"5. Implement: swap the uplink module during the agreed maintenance window."},
 {t:"6. Verify and document: the port LEDs are green, so it works; documentation is optional for small fixes.",b:1,why:"Verification must prove full functionality with real tests, and every fix must be documented."}],
ex:"<p>Line 4 skips effects, rollback and notification — the core of planning. Line 6 replaces verification with LED-watching and calls documentation optional; both are method violations. The other four lines follow the phases correctly.</p>"},

{id:"M12",tp:"qcm",th:"test",pt:8,ti:"Two theories down",
sc:"<p>You tested two solid theories for the floor-2 outage — a failing uplink and a DHCP scope problem. Both were disproven by evidence. The outage continues, and the distribution layer is outside your access rights.</p>",
qu:"<p>According to the methodology, what is the correct move now?</p>",
hi:"The step says it literally: if the theory is not confirmed, establish a new theory or escalate.",
ch:[
 {t:"Establish a new theory from the remaining evidence, or escalate to a team with deeper access",ok:1},
 {t:"Implement the most popular fix from a search engine and note it in the ticket as temporary"},
 {t:"Mark the ticket resolved and wait for users to confirm that the outage is really over"},
 {t:"Replace every access switch on the floor at once to eliminate the faulty hardware"}],
ex:"<p>When a theory fails its test, you return to the evidence and form a new theory — or you escalate when the next step needs access or expertise you do not have. Guesswork fixes, false closures and mass replacement all break the method.</p>"},
{id:"M13",tp:"order",th:"method",pt:12,ti:"Office B loses the server room",
sc:"<p><b>09:15 — Office B (40 people) reports total loss of access to the server room apps.</b> Phones still work. The shift log shows a maintenance window on the distribution switch last night. Handle the incident in the right order.</p>",
qu:"<p>Order the investigation and resolution steps correctly.</p>",
rlab:"From first call to closure.",
hi:"Map symptoms first, then hunt the change, then reproduce, then theorise, test — and never close without verification and documentation.",
it:[
 "Question users to map the symptoms and the affected scope",
 "Determine whether anything changed — check last night's maintenance",
 "Duplicate the problem from your own workstation",
 "Establish a theory of probable cause from the evidence",
 "Test the theory — check the uplink port and its counters",
 "Verify full functionality, then document findings and actions"],
ex:"<p>The investigation mirrors the methodology: map the symptoms, hunt the change (last night's window), reproduce the fault, theorise, test, and close only after verification and documentation. Each step narrows the search using the previous step's facts.</p>"},

{id:"M14",tp:"match",th:"plan",pt:10,ti:"Potential effects of four changes",
sc:"<p>Four changes are queued for tonight. The change board asks you to pair each change with its most important <b>potential effect</b>, so the notifications are correct.</p>",
qu:"<p>Assign each change to its dominant potential effect.</p>",
hi:"Follow the traffic: who sits behind the device or record that changes?",
pr:[
 ["Reboot the core switch","All wired users at the site lose connectivity for several minutes"],
 ["Add a second VLAN on one access switch","Only the ports of that one switch are affected"],
 ["Change the DNS record of the intranet portal","Clients may keep using the old address until the record's TTL expires"],
 ["Update the firmware of one Wi-Fi access point","Wi-Fi clients on that AP drop and reconnect during the update"]],
ex:"<p>Effects follow the blast radius: a core reboot touches everyone wired, one access switch touches only its own ports, a DNS record survives in caches until its TTL expires, and one AP update drops just that AP's clients. Naming the effect is what makes the plan honest.</p>"},

{id:"M15",tp:"multi",th:"plan",pt:10,ti:"What a plan of action contains",
sc:"<p>A change plan for replacing the site's DHCP server is being reviewed before submission to the change board.</p>",
qu:"<p>Select <b>all</b> elements that a complete plan of action must contain.</p>",
hi:"Think: undo, impact, approval, and the people who will feel it.",
ch:[
 {t:"A rollback step that restores the previous state",ok:1},
 {t:"The potential effects on users and services",ok:1},
 {t:"The approved maintenance window and change approval",ok:1},
 {t:"A notification to the affected users before the work starts",ok:1},
 {t:"A decision to skip testing to move faster"},
 {t:"A bundle of as many unrelated settings as possible, changed at once"},
 {t:"A note that documentation will be skipped because the change is small"}],
ex:"<p>A plan needs a way back (rollback), an honest effects list, the approved window, and a warning to the people affected. Skipping tests, bundling unrelated changes and skipping documentation create the classic self-inflicted outage.</p>"},

{id:"M16",tp:"fill",th:"plan",pt:10,ti:"Complete change ticket CHG-2291",
sc:"<p>The change ticket for the sw3 uplink module replacement is missing four key terms. Fill them from the word bank.</p>",
qu:"<p>Complete the four blanks of the change ticket.</p>",
hi:"When, undo, warn, and the honest size of the risk.",
sg:["<b>Change ticket CHG-2291 — sw3 uplink module replacement</b><br>This change will be performed during a planned ",["maintenance window"]," outside business hours. A ",["rollback"]," step will restore the previous configuration from the saved backup if the change fails. The team will ",["notify"]," all affected staff before the work starts. The ticket records the ",["potential effects"]," of the change, including up to 15 minutes of downtime for pilot users."],
dk:["lessons learned","duplicate the problem","bottom-up","APIPA","divide and conquer"],
ex:"<p>A change ticket names its maintenance window, carries a rollback step, notifies affected users, and records the potential effects. The other bank words belong to other phases — duplication is identification, bottom-up and divide-and-conquer are theory strategies, APIPA is a symptom, and lessons learned arrive after the fix.</p>"},

{id:"M17",tp:"qcm",th:"verify",pt:8,ti:"One happy user is not verification",
sc:"<p>The uplink module was replaced at 02:31. At 08:05 the original reporter says: 'My portal works again, thanks!' and asks you to close the ticket.</p>",
qu:"<p>What does <b>verify full system functionality</b> require before closure?</p>",
hi:"Full means the whole scope of the fault, proven by tests — not one user's mood.",
ch:[
 {t:"Test all services inside the change scope from more than one point, then close",ok:1},
 {t:"Accept the user's confirmation, thank her, and close the ticket immediately"},
 {t:"Restart every server in the rack once to be extra sure everything is fine"},
 {t:"Check one fast page load from your own desk and close the ticket as verified"}],
ex:"<p>'Full system functionality' means every service the fault or the fix could touch, checked from more than one point — not the reporter's mood. Random restarts and single checks prove nothing and can create new faults.</p>"},

{id:"M18",tp:"log",th:"verify",pt:12,ti:"Prove recovery from the logs",
sc:"<p>The maintenance window ended at 03:00. Before closing CHG-2291 you must prove recovery with evidence. Here is the combined log extract.</p>",
lv:"sw-core · dhcp1 · mon — post-change window",
qu:"<p><b>Select the four lines that prove the link and the services behind it are fully functional again.</b></p>",
hi:"Look for: link up, protocol up, successful probes, and successful leases. Unrelated warnings are noise.",
ln:[
 {t:"02:14:03 sw-core: %LINK-3-UPDOWN: Interface Te1/0/1, changed state to down",l:"err"},
 {t:"02:31:40 sw-core: %LINK-3-UPDOWN: Interface Te1/0/1, changed state to up",l:"ok",s:1},
 {t:"02:31:42 sw-core: %LINEPROTO-5-UPDOWN: Line protocol on Interface Te1/0/1, changed state to up",l:"ok",s:1},
 {t:"02:32:05 mon: probe 10[.]20[.]0[.]1 ok — 4/4 replies, 2 ms average",l:"ok",s:1},
 {t:"02:33:12 dhcp1: DHCPACK on 10[.]20[.]40[.]201 to d4:6a:b8:19:cc:02",l:"ok",s:1},
 {t:"03:40:11 backup1: nightly job finished with 2 warnings (unrelated)",l:"info"}],
ex:"<p>Proof of recovery is a chain: link up, then line protocol up, then a clean monitoring probe, then a real DHCPACK to a client. The original down event is history, and the backup job's unrelated warnings say nothing about the network fix.</p>"},
{id:"M19",tp:"term",th:"verify",pt:12,ti:"Check for residual port errors",
sc:"<p>After the sw3 fix you must confirm the new uplink module shows no residual interface errors. The switch log is saved as <b>switch.log</b> on your analysis host.</p>",
qu:"<p>Type the two grep commands in the sandbox.</p>",
hi:"Use grep. Plain grep for the error lines, and the -c flag when you need a count.",
pm:[
 {lbl:"Show every line of switch.log that mentions errors (add -i for case-insensitive matching)",
  re:["grep error","grep -i error","grep.*error"],
  sm:"grep -i error switch.log",
  out:"02:02:11 sw3: %PORT-4-ERRORS: 214 input errors on Te1/0/2\n02:02:12 sw3: %PORT-4-CRC: 198 CRC errors on Te1/0/2\n… (older counter reports omitted)"},
 {lbl:"Count how many lines of switch.log mention CRC (use the count flag)",
  re:["grep.*-c.*crc","grep.*-ci.*crc","grep.*-ic.*crc"],
  sm:"grep -ci crc switch.log",
  out:"96"}],
ex:"<p>grep prints matching lines, and grep -c prints only the count of matching lines — the quickest way to prove a number instead of pasting a wall of text. The nightly counter reports show the CRC totals rising before the fix; after the change the same count should stay flat.</p>"},

{id:"M20",tp:"cat",th:"verify",pt:12,ti:"Verify, prevent, or write it down",
sc:"<p>The fix worked. Nine follow-up cards are on the table — sort them into the three closing phases of the methodology.</p>",
qu:"<p>Drag each card into the correct closing phase.</p>",
hi:"Verify proves the fix, prevention stops the next occurrence, documentation records everything.",
bk:[
 {n:"Verify functionality",it:["Test the fix from a second VLAN","Re-run the failing application end to end","Ask the user to repeat their original task"]},
 {n:"Preventive measures",it:["Add the failed module type to the spares list","Schedule annual cable certification","Create a monitoring alert for link flaps"]},
 {n:"Documentation",it:["Update the ticket with actions and outcome","Write a knowledge-base article for this symptom","Record the lessons learned in the post-incident note"]}],
ex:"<p>Verification re-runs reality: other VLANs, the original application, the user's own task. Prevention changes the future: spares, certification, alerts. Documentation records the past: ticket, article, lessons. All three close the incident properly.</p>"},

{id:"M21",tp:"order",th:"identify",pt:10,ti:"Rank the morning queue",
sc:"<p>Four problems arrive while you are alone on shift. The methodology requires you to approach multiple problems individually — and something has to be first.</p>",
qu:"<p>Rank the four items from 'handle first' (top) to 'handle last' (bottom).</p>",
rlab:"Rank 1 = handle first. Weigh user impact and business criticality.",
hi:"The biggest number of affected users with a hard outage outranks single users and paperwork.",
it:[
 "Site-wide outage: 120 users offline (INC-5501)",
 "Floor-2 Wi-Fi flapping for 40 users (INC-5502)",
 "One vice-president cannot print (INC-5503)",
 "Request to document last week's change (CHG-2270)"],
ex:"<p>Ranking follows impact: 120 users offline first, then 40 users with flapping Wi-Fi, then one affected printer user — and the documentation request, which harms nobody today, goes last. Each of them still gets its own theory, test and plan.</p>"},

{id:"M22",tp:"multi",th:"identify",pt:10,ti:"Why one problem at a time",
sc:"<p>Two faults land at once: the printer queue service errors on the print server, and the VPN gateway is unreachable for remote staff. A colleague proposes to 'handle them as one network ticket'.</p>",
qu:"<p>Select <b>all</b> statements that support the methodology rule: approach multiple problems individually.</p>",
hi:"Think about evidence purity, blame-free scoping, and what a blended fix does to two different causes.",
ch:[
 {t:"Each problem gets its own theory, test and plan",ok:1},
 {t:"One blended fix can mask one fault while trying to solve the other",ok:1},
 {t:"Separate tickets keep scopes, evidence and outcomes clean",ok:1},
 {t:"Combining them halves the documentation effort"},
 {t:"The methodology only allows one open ticket at a time"}],
ex:"<p>Individual handling keeps theories, tests and plans pure per fault, prevents one change from masking the other, and keeps tickets readable. Documentation effort is irrelevant to correctness, and nothing stops a team from owning several open tickets.</p>"},

{id:"M23",tp:"match",th:"identify",pt:10,ti:"Skipped step, real consequence",
sc:"<p>After three messy incidents, the team builds a training slide: 'Skip an identification step — pay this price.' Match each skipped step to its consequence.</p>",
qu:"<p>Assign each skipped step to the consequence it causes.</p>",
hi:"Each consequence is the step's purpose, inverted.",
pr:[
 ["Skipped 'determine if anything has changed'","The team misses last night's firmware patch as the trigger"],
 ["Skipped 'duplicate the problem'","A one-off glitch is treated as a major incident"],
 ["Skipped 'question users'","The scope is wrong: only floor 3 is affected, but the whole building is investigated"],
 ["Skipped 'approach multiple problems individually'","Two different faults receive one blended fix that solves neither"]],
ex:"<p>Every identification step exists to prevent one specific failure: change questions find triggers, duplication separates real faults from flukes, user questions find the true scope, and individual handling stops blended fixes. Skipping a step imports its exact consequence.</p>"},

{id:"M24",tp:"fill",th:"document",pt:10,ti:"Write the resolution note",
sc:"<p>The fix on sw3 is verified. The ticket's resolution note is missing its four section labels — rebuild them from the word bank.</p>",
qu:"<p>Fill the four section labels of the resolution note.</p>",
hi:"What you found, what you did, what happened, and what the next team should learn.",
sg:["<b>Ticket NET-4821 — resolution note</b><br>",["Findings"],": the uplink module in sw3 had failed; port counters showed rising input errors since 01:50.<br>",["Actions"],": replaced the SFP+ module and re-seated the patch cord at 02:31.<br>",["Outcome"],": full connectivity restored and verified from two VLANs and the monitoring probe.<br>",["Lessons learned"],": module type added to the spares list; link-flap alert enabled."],
dk:["theory of probable cause","duplicate the problem","maintenance window","divide and conquer","APIPA"],
ex:"<p>A resolution note records findings (what the fault was), actions (what you did), outcome (proof it is fixed) and lessons learned (what changes tomorrow). The other bank words describe earlier phases of the same methodology, not the documentation of the result.</p>"},

{id:"M25",tp:"multi",th:"document",pt:10,ti:"What lessons learned contain",
sc:"<p>The post-incident note template has a 'lessons learned' section. Review the candidate bullets.</p>",
qu:"<p>Select <b>all</b> bullets that belong in a lessons-learned note.</p>",
hi:"Lessons serve the next incident: causes, friction, prevention, and better runbooks. Never people, never secrets.",
ch:[
 {t:"The root cause and its trigger, in plain words",ok:1},
 {t:"What slowed the response, so the next shift can avoid it",ok:1},
 {t:"Preventive measures with owners and due dates",ok:1},
 {t:"Updates needed for runbooks and the knowledge base",ok:1},
 {t:"The personal phone number of the affected user"},
 {t:"Blame for the named junior technician"},
 {t:"The administrator passwords used during the fix"}],
ex:"<p>Lessons learned capture cause, friction, prevention and knowledge updates — assets for the next incident. Personal data, blame and credentials do not belong in shared documentation; passwords in tickets are a security incident of their own.</p>"},

{id:"M26",tp:"qcm",th:"identify",pt:8,ti:"The fault that will not reproduce",
sc:"<p>A user reports that her VoIP phone drops 'now and then'. You watched her line for 40 minutes and saw nothing. The call-quality monitor shows no errors for her extension in the last 24 hours.</p>",
qu:"<p>What is the best next step?</p>",
hi:"Not reproducible is not the same as not real. Evidence collection continues — smarter.",
ch:[
 {t:"Keep the ticket open, gather more evidence, and set a targeted alert for the next drop",ok:1},
 {t:"Close the ticket for now — the fault does not exist if it will not reproduce"},
 {t:"Replace her phone, cable and switch port immediately to eliminate the hardware"},
 {t:"Ask the user to stop reporting drops until the phone fails completely again"}],
ex:"<p>Duplication applies 'if applicable' — when the fault will not reproduce, you keep the facts flowing: open ticket, monitoring, a targeted alert, and notes from the user about timing. Silent closure and blind hardware swaps both ignore the methodology.</p>"},
{id:"M27",tp:"cat",th:"theory",pt:12,ti:"Symptoms to OSI layers",
sc:"<p>During theory work, the OSI model is your map: each symptom lives at a layer, and each layer has its own tools. Eight symptoms need sorting.</p>",
qu:"<p>Drag each symptom to the layer where it lives.</p>",
hi:"Cable and connector are layer 1, switching and VLANs layer 2, IP addressing layer 3, ports and applications above.",
bk:[
 {n:"Layer 1 — Physical",it:["Cable unplugged under the desk","Dirty fiber connector on the uplink"]},
 {n:"Layer 2 — Data link",it:["Access port in the wrong VLAN","MAC flapping between two switch ports"]},
 {n:"Layer 3 — Network",it:["Wrong default gateway on the host","Duplicate IP address on the subnet"]},
 {n:"Layers 4–7 — Transport &amp; up",it:["Firewall blocks TCP port 443","Expired TLS certificate breaks the HTTPS login"]}],
ex:"<p>Physical symptoms are copper, fiber and power. VLANs and MAC behaviour belong to layer 2, IP addressing to layer 3, and anything about ports, sessions or applications sits at layer 4 and above. Knowing the layer picks the tool: cable tester, switch CLI, ping, or an application log.</p>"},

{id:"M28",tp:"branch",th:"plan",pt:12,ti:"When the window will not wait",
sc:"<p>Your approved plan for the sw-4 module replacement targets Saturday 22:00. Wednesday morning the switch starts failing hard: users drop every few minutes, and 60 people are affected.</p>",
qu:"<p>Steer the plan of action through an emergency.</p>",
hi:"Urgency changes the speed of change control, never its content: impact, rollback, notification.",
st:[
 {q:"The outage is live and the window is days away. What do you do first?",
  ch:[{t:"Assess severity and impact, then request an emergency change with expedited approval",ok:1,nt:"The board approves an emergency change within the hour."},
      {t:"Wait for Saturday — the plan is already approved",nt:"Sixty users keep dropping for days; the business overrides the plan."},
      {t:"Implement right away without telling anyone",nt:"An unapproved production change is discovered in the audit — badly."},
      {t:"Cancel the change request and open a new one next month",nt:"The outage worsens while the paperwork sleeps."}]},
 {q:"The emergency change is approved. What must be ready before you touch the switch?",
  ch:[{t:"Backup of the current config, a rollback step, and notifications to affected users",ok:1,nt:"All three are ready — emergency does not mean unprepared."},
      {t:"Nothing — urgency removes the need for a rollback",nt:"The first failed attempt has no way back; the outage doubles."},
      {t:"A press release for the customers",nt:"Marketing is not part of the methodology."},
      {t:"A new IP addressing plan for the whole site",nt:"Re-addressing during an emergency multiplies the risk."}]},
 {q:"Mid-change, the config upload fails and the switch stops responding. What now?",
  ch:[{t:"Stop, execute the rollback, verify, and escalate with full notes",ok:1,nt:"The rollback restores service; escalation takes over with clean evidence."},
      {t:"Continue and hope the second attempt works",nt:"Hope is not a methodology step."},
      {t:"Leave it and go home — it is late",nt:"The site stays down overnight by choice."},
      {t:"Delete the old configuration to free memory",nt:"The only way back is destroyed."}]}],
ex:"<p>Emergency changes compress the calendar, not the discipline: impact assessment and expedited approval, rollback and notifications before the work, and a stop-rollback-escalate rule when the plan breaks mid-flight.</p>"},

{id:"M29",tp:"order",th:"theory",pt:12,ti:"Bottom-up test sequence",
sc:"<p>A user cannot reach the intranet portal at all. You chose a <b>bottom-up</b> approach through the OSI layers.</p>",
qu:"<p>Order the six checks from layer 1 up to layer 7.</p>",
rlab:"Bottom-up: physical first, application last.",
hi:"Start where the packet starts: cable, switch port, gateway, end-to-end IP, name, application.",
it:[
 "Check the link LEDs and the patch cable (layer 1)",
 "Check the switch port VLAN and port state (layer 2)",
 "Ping the default gateway (layer 3)",
 "Ping the portal server's IP address (layer 3)",
 "Test name resolution with nslookup (layers 3–7)",
 "Open the portal in the browser (layer 7)"],
ex:"<p>Bottom-up climbs the stack in packet order: cable, port, gateway, remote IP, name resolution, and only then the application. Each green check removes a whole layer from suspicion, so the first red check marks the crime scene.</p>"},

{id:"M30",tp:"qcm",th:"theory",pt:8,ti:"Question the obvious",
sc:"<p>A new hire says her brand-new desktop 'has no network at all'. Colleagues on either side of her are fine. A coworker has already blamed a 'DNS apocalypse' and proposed hunting an 'ARP-spoofing ghost'.</p>",
qu:"<p>What does <b>question the obvious</b> tell you to check first?</p>",
hi:"The simplest cause that matches all the facts: one new desk, no connectivity, neighbours fine.",
ch:[
 {t:"That the network cable is fully seated at the desk and at the wall port",ok:1},
 {t:"That the DHCP server scope for her floor was rebuilt correctly overnight"},
 {t:"That the core router has not dropped any routes since her start date"},
 {t:"That her VLAN database carries no duplicate or conflicting entries"}],
ex:"<p>One new desk without connectivity, while both neighbours work, screams simple and local: the cable. Exotic theories are entertaining, but the methodology sends you to the obvious cause first — it is the most likely and the cheapest to test.</p>"}
];
</script>
<script>
'use strict';
/* ===== CyberPulseAcademy exam engine — vanilla JS, no external calls ===== */
var META={};try{META=JSON.parse(document.getElementById('cm-exercise-meta').textContent);}catch(e){}
var TOPIC=String(META.topicId||'network-plus').toLowerCase();
var CFG=window.__CFG||{};
var PASS=Number(CFG.passMark||META.passMark||70);
var THEMES={identify:'1 Identify the problem',theory:'2 Theory of cause',test:'3 Test the theory',plan:'4 Plan &amp; implement',verify:'5 Verify &amp; prevent',document:'6 Document &amp; learn',method:'7 Methodology &amp; OSI'};
var TYPELABEL={qcm:'CHOOSE ONE',multi:'CHOOSE ALL THAT APPLY',order:'DRAG TO ORDER (or use the arrows)',match:'ASSIGN — pick a card, then a slot (or drag)',cat:'ASSIGN — pick an item, then a bucket (or drag)',fill:'PICK A WORD, THEN A BLANK',term:'TYPE THE COMMANDS, THEN CHECK',log:'CLICK THE RELEVANT LOG LINES',branch:'CHOOSE ONE ANSWER PER STEP',spot:'CLICK THE OFFENDING LINES'};
/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function canon(s){return String(s||'').toLowerCase().replace(/\[\.\]/g,'.').replace(/["']/g,'').replace(/\s+/g,' ').trim();}
function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function btn(txt,cls,fn){var b=el('button','btn '+(cls||''));b.type='button';b.textContent=txt;if(fn)b.addEventListener('click',fn);return b;}
function $(id){return document.getElementById(id);}
function frac(n){return Math.round(n*10)/10;}
/* ---------- state ---------- */
var EX=[],cur=0,remaining=0,tickH=null,started=false,finished=false,reported=false,manualPause=false,checkPause=false,user='';
function buildViews(d){
  var v={};
  if(d.tp==='qcm'||d.tp==='multi'){v.ord=shuf(d.ch.map(function(_,i){return i;}));}
  if(d.tp==='order'){v.ord=shuf(d.it.map(function(_,i){return i;}));}
  if(d.tp==='match'){v.lefts=shuf(d.pr.map(function(_,i){return i;}));}
  if(d.tp==='cat'){var flat=[];d.bk.forEach(function(b,bi){b.it.forEach(function(t){flat.push({t:t,b:bi});});});v.items=shuf(flat);}
  if(d.tp==='fill'){var bank=d.sg.filter(function(s){return typeof s!=='string';}).map(function(b){return b[0];}).concat(d.dk||[]);v.bank=shuf(bank);}
  if(d.tp==='branch'){v.sord=d.st.map(function(s){return shuf(s.ch.map(function(_,i){return i;}));});}
  return v;
}
function resetState(){
  EX=shuf(window.__DATA.map(function(d){return{d:d,v:buildViews(d),ans:null,checked:false,earned:0,skip:false,hint:false,dirty:false};}));
  cur=0;started=false;finished=false;reported=false;manualPause=false;checkPause=false;
  remaining=CFG.timerSec||4500;
}
/* ---------- answer helpers ---------- */
function hasAns(s){
  var e=EX[s],st=e.ans;if(!st)return false;
  var tp=EX[s].d.tp;
  if(tp==='qcm')return st.pick!=null;
  if(tp==='multi')return st.pick&&st.pick.some(Boolean);
  if(tp==='order')return st.seq&&st.seq.length>0&&!!e.touched;
  if(tp==='match')return st.assign&&st.assign.some(function(x){return x!=null;});
  if(tp==='cat')return st.bk&&st.bk.some(function(x){return x!=null;});
  if(tp==='fill')return st.pick&&st.pick.some(function(x){return x!=null;});
  if(tp==='term')return st.val&&st.val.some(function(x){return String(x||'').trim()!=='';});
  if(tp==='log'||tp==='spot')return st.sel&&st.sel.some(Boolean);
  if(tp==='branch')return st.pick&&st.pick.some(function(x){return x!=null;});
  return false;
}
/* ---------- chrome ---------- */
function header(){
  var w=document.querySelector('#app .wrap');
  var h=el('div','hdr');
  h.appendChild(el('div','t','<span>'+esc(CFG.examTitle)+'</span><small id="sub">Objective 5.1 · Troubleshooting methodology · '+(user?('Candidate: '+esc(user)):'practice mode')+'</small>'));
  var hud=el('div','hud');
  hud.appendChild(el('span','chip','Score: <b id="scv">0</b> <span id="scp" style="color:var(--mut)"></span>'));
  hud.appendChild(el('span','chip','<b id="tmr">--:--</b>'));
  var mp=el('span','badge','<span aria-hidden="true">⏸</span> Paused (manual)');mp.id='mpInd';hud.appendChild(mp);
  var cp=el('span','badge','<span aria-hidden="true">⏱</span> Timer paused — review mode');cp.id='cpInd';hud.appendChild(cp);
  var pb=btn('Pause','ghost',togglePause);pb.id='pauseBtn';hud.appendChild(pb);
  hud.appendChild(btn('Keywords','ghost',showKeywords));
  h.appendChild(hud);w.appendChild(h);
  w.appendChild(el('div','pbar','<i id="pfill"></i>'));
  var th=el('div','themes');th.id='themes';w.appendChild(th);
  var nv=el('div','nav');nv.id='nav';w.appendChild(nv);
  var eb=el('div',null);eb.id='exbody';w.appendChild(eb);
}
function updClock(){
  if(!$('tmr'))return;
  var t=$('tmr'),m=Math.floor(remaining/60),s=remaining%60;
  t.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  t.classList.toggle('low',remaining<=300);
  $('mpInd').classList.toggle('on',manualPause);
  $('cpInd').classList.toggle('on',checkPause);
}
function updHud(){
  if(!$('tmr'))return;
  var earn=0,poss=0,prog=0;
  EX.forEach(function(e){
    if(e.checked){earn+=e.earned;poss+=e.d.pt;prog++;}
    else if(e.skip)prog++;
  });
  $('scv').textContent=frac(earn);
  $('scp').textContent=poss?('· '+frac(poss)+' pts answered'):'';
  $('pfill').style.width=(EX.length?Math.round(prog/EX.length*100):0)+'%';
  var tw=$('themes');tw.innerHTML='';
  Object.keys(THEMES).forEach(function(k){
    var te=0,tp2=0,tc=0,tt=0;
    EX.forEach(function(e){if(e.d.th!==k)return;tt++;if(e.checked){tc++;te+=e.earned;tp2+=e.d.pt;}});
    var pc=tp2?Math.round(te/tp2*100):0;
    tw.appendChild(el('span','thm','<b>'+THEMES[k]+'</b> '+tc+'/'+tt+' · '+pc+'%<i><u style="width:'+pc+'%"></u></i>'));
  });
  var nv=$('nav');nv.innerHTML='';
  EX.forEach(function(e,i){
    var b=document.createElement('button');b.type='button';
    var st=e.skip?'S':(e.checked?(e.earned>=e.d.pt?'✓':'~'):(hasAns(i)?'+':'·'));
    b.innerHTML=(i+1)+'<small>'+st+'</small>';
    b.setAttribute('aria-label','Exercise '+(i+1)+(e.skip?', skipped':e.checked?', answered':', not answered'));
    if(e.checked)b.classList.add('done');
    if(e.skip)b.classList.add('skip');
    if(e.dirty&&!e.checked)b.classList.add('dirty');
    if(i===cur)b.classList.add('cur');
    b.addEventListener('click',function(){goto(i);});
    nv.appendChild(b);
  });
  updClock();
}
function goto(i){
  if(finished)return;
  cur=Math.max(0,Math.min(EX.length-1,i));
  renderQ();updHud();
  window.scrollTo(0,0);
}
/* ---------- rendering ---------- */
function block(cls,lab,html){var d=el('div','card '+cls);d.appendChild(el('span','blab',lab));d.appendChild(el('div',null,html));return d;}
function renderQ(){
  var e=EX[cur],d=e.d,b=$('exbody');
  b.innerHTML='';dropSel();
  b.appendChild(el('div','exmeta','Exercise <b>'+(cur+1)+' / '+EX.length+'</b> · <b>'+d.pt+' points</b> · theme: '+THEMES[d.th]+(e.hint?' · <span style="color:var(--amber)">hint used (−10% cap)</span>':'')));
  if(d.sc)b.appendChild(block('',d.scLab||'Scenario',d.sc));
  b.appendChild(block('bq',d.tp==='branch'?'What do you do?':'Question',d.qu));
  var a=block('ba',TYPELABEL[d.tp]||'ANSWER','');
  var ans=el('div',null);a.appendChild(ans);b.appendChild(a);
  REN[d.tp](e,ans);
  var acts=el('div','row');
  acts.appendChild(btn('Check','pri',doCheck));
  var rv=btn('Revise','',doRevise);rv.id='revBtn';rv.style.display=e.checked?'':'none';acts.appendChild(rv);
  var sk=btn('Skip','warn',doSkip);if(e.checked)sk.disabled=true;acts.appendChild(sk);
  var hn=btn('Hint','ghost',doHint);if(e.hint)hn.disabled=true;acts.appendChild(hn);
  b.appendChild(acts);
  var hb=el('div','hintbox');hb.id='hintbox';hb.setAttribute('aria-live','polite');b.appendChild(hb);
  if(e.hint){hb.innerHTML='<b>Hint (−10% on this exercise):</b> '+d.hi;hb.classList.add('show');}
  var fb=el('div','fdbk');fb.id='fdbk';fb.setAttribute('aria-live','polite');b.appendChild(fb);
  var xp=el('div','expl');xp.id='expl';xp.innerHTML='<h4>Explanation</h4>'+(d.ex||'');b.appendChild(xp);
  if(e.checked){applyFeedback(e);fb.classList.add('show');xp.classList.add('show');}
  var foot=el('div','row');
  foot.appendChild(btn('← Previous','ghost',function(){goto(cur-1);}));
  foot.appendChild(btn(cur>=EX.length-1?'Finish exam':'Next →','pri',doNext));
  b.appendChild(foot);
  updHud();
}
/* ---------- renderers ---------- */
var REN={};
var selChip=null;
function dropSel(){selChip=null;document.querySelectorAll('.pchip.sel').forEach(function(x){x.classList.remove('sel');});}
REN.qcm=function(e,root){
  var d=e.d;if(!e.ans)e.ans={pick:null};
  var g=el('div','opts');
  e.v.ord.forEach(function(ci,pos){
    var c=d.ch[ci];
    var b=el('button','opt');b.type='button';b.setAttribute('aria-pressed',String(e.ans.pick===pos));
    b.innerHTML='<span class="k">'+String.fromCharCode(65+pos)+'</span><span>'+c.t+'</span><span class="mk"></span>';
    b.addEventListener('click',function(){if(e.checked)return;e.ans.pick=pos;Array.prototype.forEach.call(g.children,function(x,j){x.classList.toggle('sel',j===pos);x.setAttribute('aria-pressed',String(j===pos));});});
    b.dataset.pos=pos;b.dataset.ci=ci;g.appendChild(b);
  });
  root.appendChild(g);
};
REN.multi=function(e,root){
  var d=e.d;if(!e.ans)e.ans={pick:d.ch.map(function(){return false;})};
  var g=el('div','opts');
  e.v.ord.forEach(function(ci,pos){
    var c=d.ch[ci];
    var b=el('button','opt'+(e.ans.pick[pos]?' sel':''));b.type='button';b.setAttribute('aria-pressed',String(!!e.ans.pick[pos]));
    b.innerHTML='<span class="k">'+(e.ans.pick[pos]?'☑':'☐')+'</span><span>'+c.t+'</span><span class="mk"></span>';
    b.addEventListener('click',function(){
      if(e.checked)return;
      e.ans.pick[pos]=!e.ans.pick[pos];
      b.setAttribute('aria-pressed',String(!!e.ans.pick[pos]));
      b.querySelector('.k').textContent=e.ans.pick[pos]?'☑':'☐';
      b.classList.toggle('sel',e.ans.pick[pos]);
    });
    b.dataset.pos=pos;b.dataset.ci=ci;g.appendChild(b);
  });
  root.appendChild(g);
};
REN.order=function(e,root){
  var d=e.d;if(!e.ans)e.ans={seq:e.v.ord.slice()};
  if(d.rlab)root.appendChild(el('p',null,'<small style="color:var(--mut)">'+d.rlab+'</small>'));
  var g=el('div','olist');
  function touch(){e.touched=true;}
  function paint(){
    g.innerHTML='';
    e.ans.seq.forEach(function(ii,pos){
      var it=el('div','oitem');it.draggable=!e.checked;
      it.innerHTML='<span class="num">'+(pos+1)+'</span><span>'+d.it[ii]+'</span>';
      var mv=el('span','mv');
      var up=el('button',null,'▲');up.type='button';up.setAttribute('aria-label','Move item up');
      up.addEventListener('click',function(ev){ev.stopPropagation();if(e.checked)return;var a=e.ans.seq,j=pos-1;if(j<0)return;var t=a[pos];a[pos]=a[j];a[j]=t;touch();paint();});
      var dn=el('button',null,'▼');dn.type='button';dn.setAttribute('aria-label','Move item down');
      dn.addEventListener('click',function(ev){ev.stopPropagation();if(e.checked)return;var a=e.ans.seq,j=pos+1;if(j>=a.length)return;var t=a[pos];a[pos]=a[j];a[j]=t;touch();paint();});
      mv.appendChild(up);mv.appendChild(dn);it.appendChild(mv);
      it.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',String(pos));});
      it.addEventListener('dragover',function(ev){ev.preventDefault();it.classList.add('over');});
      it.addEventListener('dragleave',function(){it.classList.remove('over');});
      it.addEventListener('drop',function(ev){ev.preventDefault();it.classList.remove('over');if(e.checked)return;var fp=Number(ev.dataTransfer.getData('text/plain'));if(isNaN(fp)||fp===pos)return;var a=e.ans.seq,m=a.splice(fp,1)[0];a.splice(pos,0,m);touch();paint();});
      g.appendChild(it);
    });
  }
  paint();root.appendChild(g);
};
REN.match=function(e,root){
  var d=e.d;if(!e.ans)e.ans={assign:d.pr.map(function(){return null;})};
  var pool=el('div','pool'),slots=el('div','slots');
  function paint(){
    pool.innerHTML='';slots.innerHTML='';dropSel();
    e.v.lefts.forEach(function(li){
      var used=e.ans.assign.indexOf(li)>=0;
      var c=el('button','pchip'+(used?' used':''));c.type='button';c.draggable=!used&&!e.checked;c.innerHTML=d.pr[li][0];c.dataset.li=li;
      c.addEventListener('click',function(){if(e.checked||used)return;selChip=(selChip===c)?null:c;document.querySelectorAll('.pchip.sel').forEach(function(x){x.classList.remove('sel');});if(selChip)c.classList.add('sel');});
      c.addEventListener('dragstart',function(ev){if(e.checked||used){ev.preventDefault();return;}ev.dataTransfer.setData('text/plain',String(li));});
      pool.appendChild(c);
    });
    d.pr.forEach(function(p,si){
      var s=el('div','slot');s.dataset.si=si;
      var li=e.ans.assign[si];
      s.innerHTML='<div class="lab">'+p[1]+'</div>'+(li!=null?'<span class="fillv">'+d.pr[li][0]+'</span>':'<span style="color:var(--mut);font-size:.85rem">drop here</span>');
      s.addEventListener('click',function(){
        if(e.checked)return;
        if(selChip){var l=Number(selChip.dataset.li);var prev=e.ans.assign.indexOf(l);if(prev>=0)e.ans.assign[prev]=null;e.ans.assign[si]=l;dropSel();paint();}
        else if(li!=null){e.ans.assign[si]=null;paint();}
      });
      s.addEventListener('dragover',function(ev){ev.preventDefault();s.classList.add('over');});
      s.addEventListener('dragleave',function(){s.classList.remove('over');});
      s.addEventListener('drop',function(ev){ev.preventDefault();s.classList.remove('over');if(e.checked)return;var l=ev.dataTransfer.getData('text/plain');if(l==='')return;var prev=e.ans.assign.indexOf(Number(l));if(prev>=0)e.ans.assign[prev]=null;e.ans.assign[si]=Number(l);paint();});
      slots.appendChild(s);
    });
  }
  paint();root.appendChild(pool);root.appendChild(slots);
};
REN.cat=function(e,root){
  var d=e.d;if(!e.ans)e.ans={bk:e.v.items.map(function(){return null;})};
  var pool=el('div','pool'),buckets=el('div','buckets');
  function paint(){
    pool.innerHTML='';buckets.innerHTML='';dropSel();
    e.v.items.forEach(function(it,ii){
      if(e.ans.bk[ii]!=null)return;
      var c=el('button','pchip');c.type='button';c.draggable=!e.checked;c.innerHTML=it.t;c.dataset.ii=ii;
      c.addEventListener('click',function(){if(e.checked)return;selChip=(selChip===c)?null:c;document.querySelectorAll('.pchip.sel').forEach(function(x){x.classList.remove('sel');});if(selChip)c.classList.add('sel');});
      c.addEventListener('dragstart',function(ev){if(e.checked){ev.preventDefault();return;}ev.dataTransfer.setData('text/plain',String(ii));});
      pool.appendChild(c);
    });
    if(!pool.children.length)pool.appendChild(el('span',null,'<small style="color:var(--mut)">All items placed. Click a placed item to return it to the pool.</small>'));
    d.bk.forEach(function(bk,bi){
      var b=el('div','bucket');b.dataset.bi=bi;
      b.appendChild(el('h4',null,bk.n));
      e.ans.bk.forEach(function(asg,ii){
        if(asg!==bi)return;
        var row=el('div','it');row.innerHTML='<span>'+e.v.items[ii].t+'</span>';
        row.style.cursor='pointer';row.title='Click to remove';
        row.addEventListener('click',function(ev){ev.stopPropagation();if(e.checked)return;e.ans.bk[ii]=null;paint();});
        b.appendChild(row);
      });
      b.addEventListener('click',function(){if(e.checked)return;if(selChip){var ii=Number(selChip.dataset.ii);e.ans.bk[ii]=bi;dropSel();paint();}});
      b.addEventListener('dragover',function(ev){ev.preventDefault();b.classList.add('over');});
      b.addEventListener('dragleave',function(){b.classList.remove('over');});
      b.addEventListener('drop',function(ev){ev.preventDefault();b.classList.remove('over');if(e.checked)return;var l=ev.dataTransfer.getData('text/plain');if(l==='')return;e.ans.bk[Number(l)]=bi;paint();});
      buckets.appendChild(b);
    });
  }

/* ---------- feedback + scoring ---------- */
function applyFeedback(e){
  var d=e.d,body=$('exbody'),fb=$('fdbk');
  fb.innerHTML='';
  function sum(html){fb.appendChild(el('div','sum',html));}
  if(d.tp==='qcm'||d.tp==='multi'){
    var g=body.querySelector('.opts');
    var eCount=0,eOk=0;
    Array.prototype.forEach.call(g.children,function(b,pos){
      var ci=Number(b.dataset.ci),c=d.ch[ci];
      var chosen=d.tp==='qcm'?(e.ans.pick===pos):!!e.ans.pick[pos];
      if(c.ok){eCount++;if(chosen){eOk++;b.classList.add('y');b.querySelector('.mk').textContent='✓';b.querySelector('.mk').className='mk y';}else{b.classList.add('m');b.querySelector('.mk').textContent='○ missed';b.querySelector('.mk').className='mk m';}}
      else if(chosen){b.classList.add('n');b.querySelector('.mk').textContent='✗';b.querySelector('.mk').className='mk n';}
      b.disabled=true;
    });
    if(d.tp==='qcm')sum(eOk===eCount?'<span class="mk y">✓ Correct</span>':'<span class="mk n">✗ Not correct</span>');
    else sum('You earned <b class="bigscore">'+eOk+' / '+eCount+'</b> here. Wrong picks earn nothing but cost nothing.');
  }
  else if(d.tp==='order'){
    var g2=body.querySelector('.olist'),ok=0;
    Array.prototype.forEach.call(g2.children,function(row,pos){
      var shown=e.ans.seq[pos];
      if(shown===pos){ok++;row.classList.add('y');row.querySelector('.num').textContent='✓';}
      else{row.classList.add('n');row.querySelector('.num').textContent='✗';row.insertAdjacentHTML('beforeend','<small style="color:var(--amber)"> item belongs in slot '+(shown+1)+'</small>');}
      row.draggable=false;row.querySelectorAll('.mv button').forEach(function(x){x.disabled=true;});
    });
    sum('You earned <b class="bigscore">'+ok+' / '+d.it.length+'</b>. Correct order: '+d.it.map(function(_,i){return (i+1);}).join(' → '));
  }
  else if(d.tp==='match'){
    var ok2=0;
    body.querySelectorAll('.slot').forEach(function(s){
      var si=Number(s.dataset.si),li=e.ans.assign[si];
      if(li===si){ok2++;s.classList.add('y');var fv=s.querySelector('.fillv');if(fv)fv.insertAdjacentHTML('beforeend',' <span class="mk y">✓</span>');}
      else{s.classList.add('n');var fv2=s.querySelector('.fillv');if(fv2)fv2.insertAdjacentHTML('beforeend',' <span class="mk n">✗ should be: '+esc(d.pr[si][0])+'</span>');}
    });
    sum('You earned <b class="bigscore">'+ok2+' / '+d.pr.length+'</b> correct pairs.');
  }
  else if(d.tp==='cat'){
    var ok3=0;
    body.querySelectorAll('.bucket').forEach(function(b){
      var bi=Number(b.dataset.bi);
      b.querySelectorAll('.it').forEach(function(row){
        var ii=-1;
        e.v.items.forEach(function(it,k){if(e.ans.bk[k]===bi&&it.t===row.textContent)ii=k;});
        if(ii<0)return;
        if(e.v.items[ii].b===bi){ok3++;row.insertAdjacentHTML('beforeend',' <span class="mk y">✓</span>');}
        else row.insertAdjacentHTML('beforeend',' <span class="mk n">✗ belongs to: '+esc(d.bk[e.v.items[ii].b].n)+'</span>');
      });
    });
    sum('You earned <b class="bigscore">'+ok3+' / '+e.v.items.length+'</b> correct placements.');
  }
  else if(d.tp==='fill'){
    var ok4=0,tot=0,idx=0;
    var blanks=body.querySelectorAll('.blank');
    d.sg.forEach(function(seg){
      if(typeof seg==='string')return;
      var bi=idx++,b=blanks[bi];tot++;
      if(e.ans.pick[bi]!=null&&e.ans.bank[e.ans.pick[bi]].w===seg[0]){ok4++;b.classList.add('y');}
      else{b.classList.add('n');b.innerHTML=esc(seg[0])+' <small style="color:var(--red)">← correct</small>';}
    });
    sum('You earned <b class="bigscore">'+ok4+' / '+tot+'</b> correct blanks.');
  }
  else if(d.tp==='term'){
    var ok5=0,rows=body.querySelectorAll('.term');
    d.pm.forEach(function(p,pi){
      var v=canon(e.ans.val[pi]);
      var hit=p.re.some(function(rx){return new RegExp(canon(rx)).test(v);});
      if(hit)ok5++;
      var t=rows[pi];t.style.borderColor=hit?'var(--green)':'var(--red)';
      var inp=t.querySelector('input');if(inp)inp.disabled=true;
      t.insertAdjacentHTML('beforeend','<div style="color:'+(hit?'var(--green)':'var(--red)')+'">'+(hit?'✓ accepted':'✗ not accepted — example: <span class="mono">'+esc(p.sm)+'</span>')+'</div>');
    });
    sum('You earned <b class="bigscore">'+ok5+' / '+d.pm.length+'</b> accepted commands.');
  }
  else if(d.tp==='log'||d.tp==='spot'){
    var need=0,got=0;
    var lns=body.querySelectorAll('.ln');
    d.ln.forEach(function(L,li){
      var b=lns[li];if(!b)return;
      var sel=e.ans.sel[li],want=!!L.s||(d.tp==='spot'&&!!L.b);
      if(want)need++;
      if(sel&&want){got++;b.classList.add('y');}
      else if(sel&&!want){b.classList.add('n');}
      else if(!sel&&want){b.classList.add('m');}
      b.disabled=true;
      if(d.tp==='spot'&&want){var why=L.why?('<small style="display:block;color:var(--dim)">'+esc(L.why)+'</small>'):'';if(why)b.insertAdjacentHTML('beforeend',why);}
    });
    sum('You earned <b class="bigscore">'+got+' / '+need+'</b> on '+(d.tp==='log'?'selected log lines':'marked mistakes')+'.'+(d.tp==='spot'?' Amber lines are mistakes you missed.':''));
  }
  else if(d.tp==='branch'){
    var ok6=0,steps=body.querySelectorAll('.step');
    d.st.forEach(function(s,si){
      var pi=e.ans.pick[si],c=(pi!=null)?s.ch[e.v.sord[si][pi]]:null,st=steps[si];
      if(c&&c.ok){ok6++;st.classList.add('y');}
      else{
        st.classList.add('n');
        var good=-1;s.ch.forEach(function(x,gi){if(x.ok)good=gi;});
        if(good>=0){var disp=e.v.sord[si].indexOf(good);st.insertAdjacentHTML('beforeend','<div style="color:var(--amber);font-size:.85rem">Best answer was '+String.fromCharCode(65+disp)+': '+esc(s.ch[good].t)+'</div>');}
      }
      Array.prototype.forEach.call(st.querySelectorAll('.opt'),function(b){b.disabled=true;});
    });
    sum('You earned <b class="bigscore">'+ok6+' / '+d.st.length+'</b> correct decisions.');
  }
}
function evaluate(i,silent){
  var e=EX[i],d=e.d,earn=0,max=d.pt;
  if(!silent)applyFeedback(e);
  if(d.tp==='qcm'){
    var pos=e.ans.pick;
    if(pos!=null&&d.ch[e.v.ord[pos]].ok)earn=max;
  }else if(d.tp==='multi'){
    var okN=0,gotN=0;
    d.ch.forEach(function(c){if(c.ok)okN++;});
    e.ans.pick.forEach(function(sel,pos){if(sel&&d.ch[e.v.ord[pos]].ok)gotN++;});
    earn=okN?max*gotN/okN:0;
  }else if(d.tp==='order'){
    var ok7=0;e.ans.seq.forEach(function(ii,pos){if(ii===pos)ok7++;});
    earn=max*ok7/d.it.length;
  }else if(d.tp==='match'){
    var ok8=0;e.ans.assign.forEach(function(li,si){if(li===si)ok8++;});
    earn=max*ok8/d.pr.length;
  }else if(d.tp==='cat'){
    var ok9=0;e.ans.bk.forEach(function(bi,ii){if(e.v.items[ii].b===bi)ok9++;});
    earn=max*ok9/e.v.items.length;
  }else if(d.tp==='fill'){
    var idx=0,okF=0,totF=0;
    d.sg.forEach(function(seg){if(typeof seg!=='string'){totF++;if(e.ans.pick[idx]!=null&&e.ans.bank[e.ans.pick[idx]].w===seg[0])okF++;idx++;}});
    earn=totF?max*okF/totF:0;
  }else if(d.tp==='term'){
    var ok11=0;
    d.pm.forEach(function(p){
      var v=canon(e.ans.val[d.pm.indexOf(p)]);
      if(p.re.some(function(rx){return new RegExp(canon(rx)).test(v);}))ok11++;
    });
    earn=max*ok11/d.pm.length;
  }else if(d.tp==='log'||d.tp==='spot'){
    var need=0,got=0;
    d.ln.forEach(function(L,li){
      var want=!!L.s||(d.tp==='spot'&&!!L.b);
      if(want){need++;if(e.ans.sel[li])got++;}
    });
    earn=need?max*got/need:0;
  }else if(d.tp==='branch'){
    var ok13=0;
    d.st.forEach(function(s,si){var pi=e.ans.pick[si];var c=(pi!=null)?s.ch[e.v.sord[si][pi]]:null;if(c&&c.ok)ok13++;});
    earn=max*ok13/d.st.length;
  }
  if(e.hint)earn=Math.min(earn,max*0.9);
  e.earned=earn;e.checked=true;e.skip=false;e.dirty=false;
  return earn;
}
/* ---------- actions ---------- */
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._h);toast._h=setTimeout(function(){t.classList.remove('show');},2800);}
function doCheck(){
  var e=EX[cur];
  if(e.checked){checkPause=true;$('fdbk').classList.add('show');$('expl').classList.add('show');updHud();return;}
  if(!hasAns(cur)){toast('Select an answer first — or press Skip and come back later.');return;}
  evaluate(cur,false);
  $('fdbk').classList.add('show');
  $('expl').classList.add('show');
  $('revBtn').style.display='';
  checkPause=true;
  updHud();
}
function doRevise(){
  var e=EX[cur];
  if(!e.checked)return;
  e.checked=false;e.earned=0;e.dirty=true;
  renderQ();
}
function doSkip(){
  var e=EX[cur];
  e.skip=true;
  if(cur<EX.length-1)goto(cur+1);
  else{updHud();toast('Flagged as skipped. Press "Finish exam" when ready — skipped exercises are not counted.');}
}
function doHint(ev){
  var e=EX[cur];

  e.hint=true;
  if(ev&&ev.currentTarget)ev.currentTarget.disabled=true;

  hb.classList.add('show');

}
function doNext(){
  var e=EX[cur];
  if(e.dirty&&!e.checked)evaluate(cur,true);
  checkPause=false;
  if(cur>=EX.length-1){finish(false);return;}
  goto(cur+1);
}
function togglePause(){
  manualPause=!manualPause;
  var pov=$('pov');if(pov)pov.classList.toggle('show',manualPause);
  var wr=document.querySelector('#app .wrap');if(wr)wr.inert=manualPause;

/* ---------- timer ---------- */
function startTimer(){
  if(tickH)clearInterval(tickH);
  tickH=setInterval(function(){
    if(!started||finished||manualPause||checkPause)return;
    remaining--;
    if(remaining<=0){remaining=0;updClock();finish(true);return;}
    updClock();
  },1000);
}
/* ---------- finish / results ---------- */
function finalTotals(){
  var earn=0,poss=0;
  EX.forEach(function(e){if(e.checked&&!e.skip){earn+=e.earned;poss+=e.d.pt;}});
  var ei=Math.round(earn);
  return{raw:earn,int:ei,poss:poss,pct:poss?Math.round(ei/poss*100):0};
}
function finish(auto){
  if(finished)return;
  var scored=0;
  EX.forEach(function(e,i){
    if(e.checked){scored++;return;}
    if(!e.skip&&hasAns(i)){evaluate(i,true);scored++;}
  });
  if(scored===0){
    if(auto){finished=true;renderResults(true);return;}
    toast('Answer at least one exercise before submitting — skipped exercises are not counted.');
    return;
  }
  finished=true;
  renderResults(false);
  if(!reported){
    reported=true;
    var ft=finalTotals();
    reportScore(ft.int,ft.poss);
  }
}
function reportScore(correct,total){
  var percent=total?Math.round((correct/total)*100):0;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:TOPIC,score:correct,total:total,percent:percent,passed:percent>=PASS},location.origin);
  }catch(e){}
}

  }
