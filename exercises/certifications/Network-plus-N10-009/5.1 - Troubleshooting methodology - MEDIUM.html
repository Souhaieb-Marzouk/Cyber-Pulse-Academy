function strip(h){var x=document.createElement('div');x.innerHTML=h;return (x.textContent||'').replace(/\s+/g,' ').trim();}
function answerSummary(e){
  var d=e.d,st=e.ans;
  try{
    if(d.tp==='qcm')return st.pick==null?'—':strip(d.ch[e.v.ord[st.pick]].t);
    if(d.tp==='multi')return d.ch.filter(function(_,k){return st.pick[e.v.ord.indexOf(k)];}).map(function(c){return strip(c.t);}).join('; ')||'nothing selected';
    if(d.tp==='order')return st.seq.map(function(ii){return strip(d.it[ii]);}).join(' → ');
    if(d.tp==='match')return d.pr.map(function(p,si){return strip(p[1])+' = '+(st.assign[si]!=null?strip(d.pr[st.assign[si]][0]):'—');}).join('; ');
    if(d.tp==='cat')return d.bk.map(function(bk){var bi=d.bk.indexOf(bk),its=[];st.bk.forEach(function(asg,ii){if(asg===bi)its.push(strip(e.v.items[ii].t));});return strip(bk.n)+': '+(its.join(', ')||'—');}).join(' | ');
    if(d.tp==='fill'){var out=[],bi=0;d.sg.forEach(function(seg){if(typeof seg==='string')return;var pi=st.pick[bi++];out.push(pi!=null?st.bank[pi].w:'—');});return out.join('; ');}
    if(d.tp==='term')return st.val.map(function(v){return esc(v||'—');}).join(' ; ');
    if(d.tp==='log'||d.tp==='spot'){var sel=[];d.ln.forEach(function(L,li){if(st.sel[li])sel.push('#'+(li+1)+' '+strip(L.t).slice(0,80));});return sel.join(' · ')||'nothing selected';}
    if(d.tp==='branch')return st.pick.map(function(pi,si){return (pi!=null)?strip(d.st[si].ch[e.v.sord[si][pi]].t):'—';}).join(' | ');
  }catch(err){}
  return '—';
}
function correctSummary(e){
  var d=e.d;
  try{
    if(d.tp==='qcm'||d.tp==='multi')return d.ch.filter(function(c){return c.ok;}).map(function(c){return strip(c.t);}).join('; ');
    if(d.tp==='order')return d.it.map(function(t){return strip(t);}).join(' → ');
    if(d.tp==='match')return d.pr.map(function(p){return strip(p[1])+' = '+strip(p[0]);}).join('; ');
    if(d.tp==='cat')return d.bk.map(function(b){return strip(b.n)+': '+b.it.map(strip).join(', ');}).join(' | ');
    if(d.tp==='fill')return d.sg.filter(function(s){return typeof s!=='string';}).map(function(b){return b[0];}).join('; ');
    if(d.tp==='term')return d.pm.map(function(p){return p.sm;}).join(' ; ');
    if(d.tp==='log'||d.tp==='spot'){var s=[];d.ln.forEach(function(L,li){if(!!L.s||(d.tp==='spot'&&L.b))s.push('#'+(li+1));});return 'lines '+s.join(', ');}
    if(d.tp==='branch')return d.st.map(function(s,si){var g=0;s.ch.forEach(function(c,gi){if(c.ok)g=gi;});return 'Step '+(si+1)+': '+strip(s.ch[g].t);}).join(' | ');
  }catch(err){}
  return '—';
}
/* ---------- retake ---------- */
function retake(){
  var pov=$('pov');if(pov)pov.remove();
  document.querySelector('#app .wrap').innerHTML='';
  resetState();
  started=true;
  renderExamShell();
  goto(0);
}
/* ---------- intro ---------- */
function showKeywords(){
  var old=$('kwmodal');
  if(old){old.remove();return;}
  var m=el('div','pov show');m.id='kwmodal';
  m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Keywords covered');
  var c=el('div','card');c.style.maxWidth='780px';c.style.maxHeight='82vh';c.style.overflow='auto';
  c.appendChild(el('h3',null,'Keywords covered — grouped by theme'));
  var g=el('div','kgrid');
  CFG.keywords.forEach(function(k){
    g.appendChild(el('div','kw','<h4>'+k.h+'</h4><ul>'+k.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'));
  });
  c.appendChild(g);
  var cr=el('div','row');cr.appendChild(btn('Close','',function(){m.remove();}));c.appendChild(cr);
  m.appendChild(c);
  document.body.appendChild(m);
}
function renderIntro(){
  var w=document.querySelector('#app .wrap');
  var r=el('div',null);
  r.appendChild(el('div','hero','<span class="sev">'+esc(CFG.sev)+' SEVERITY</span><h1>'+esc(CFG.examTitle)+'</h1><p>Objective 5.1 — Troubleshooting methodology · CompTIA Network+ (N10-009). '+EX.length+' scenario-based exercises: SOC-style tickets, live-style logs, a command sandbox, drag-and-drop, matching, branching incidents. Every keyword of the objective is exercised at <b>'+esc(CFG.sev)+'</b> level, and the two severity files share no exercise.</p>'));
  var rules=el('div','rules');
  rules.innerHTML='<h3>How this exam works</h3><ul>'
    +'<li><b>Pass mark: '+PASS+'%.</b> The score is computed over non-skipped exercises only. Multi-answer exercises earn partial points per correct element.</li>'
    +'<li><b>Timer: '+fmtSec(CFG.timerSec)+' total</b> ('+fmtSec(CFG.timerSec/EX.length*1)+' per exercise on average). The clock runs unless one of the two pause modes below is active.</li>'
    +'<li><b>Check</b> validates your answer, marks each element (green ✓ / red ✗ / amber missed), shows the explanation, and freezes the timer in <b>review mode</b> — content stays fully visible. Only <b>Next</b> resumes the clock.</li>'
    +'<li><b>Manual Pause</b> hides the exercise behind an overlay while paused. The two pause modes stack; both must clear before the timer runs again.</li>'
    +'<li><b>Skip</b> flags an exercise (amber S in the navigator) and moves on. You can navigate back to skipped or answered exercises at any time before the timer ends. Skipped exercises are excluded from both score and total.</li>'
    +'<li><b>Revise</b> reopens a checked exercise; the new Check re-validates and re-applies the review pause.</li>'
    +'<li><b>Hint</b> costs 10% of that exercise\'s points and reveals a nudge — never the answer. It does not pause the clock.</li>'
    +'<li><b>Partial credit:</b> each slot, pair, blank, line or decision earns its own share of the points. Wrong picks earn nothing but subtract nothing.</li>'
    +'<li>On <b>Retake</b>, exercises and answer choices are reshuffled and all state resets.</li>'
    +'</ul>';
  r.appendChild(rules);
  var kw=el('div','rules');
  kw.innerHTML='<h3>Keywords covered — grouped by theme</h3><div class="kgrid">'+CFG.keywords.map(function(k){return '<div class="kw"><h4>'+k.h+'</h4><ul>'+k.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></div>';}).join('')+'</div>';
  r.appendChild(kw);
  var row=el('div','row');
  row.appendChild(btn('Start the exam','pri',function(){started=true;renderExamShell();goto(0);}));
  r.appendChild(row);
  w.appendChild(r);
}
function fmtSec(s){var m=s/60;return (m%1?m.toFixed(1):m)+' min';}
function renderExamShell(){
  var w=document.querySelector('#app .wrap');
  w.innerHTML='';w.inert=false;
  header();
  var oldp=$('pov');if(oldp)oldp.remove();
  var pov=el('div','pov');pov.id='pov';
  pov.innerHTML='<div class="big">⏸ Paused (manual)</div><p>The exercise is hidden while the exam is paused manually. Resume to continue — the timer runs again only when no pause mode is active.</p>';
  pov.appendChild(btn('Resume','',togglePause));
  document.body.appendChild(pov);
}
/* ---------- boot ---------- */
function boot(){
  resetState();
  var app=$('app');app.innerHTML='<div class="wrap"></div>';
  renderIntro();
  window.addEventListener('message',function(ev){
    if(!ev.data)return;
    if(ev.data.type==='CYBERPULSE_INIT'||ev.data.type==='CYBERMASTERY_INIT'){
      user=ev.data.username||'';
      var sm=$('sub');
      if(sm&&user)sm.textContent='Objective 5.1 · Troubleshooting methodology · Candidate: '+user;
    }
  });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){var m=$('kwmodal');if(m)m.remove();}
  });
  startTimer();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

</script>
