};
var THEMES=[
  {id:'freq',name:'Frequencies & channels',kw:['2.4 GHz band','5 GHz band','6 GHz band (Wi-Fi 6E)','channels 1 / 6 / 11','channel bonding (40/80/160 MHz)','DFS (Dynamic Frequency Selection)','UNII bands','co-channel interference','adjacent-channel interference','channel width trade-off','Wi-Fi 4/5/6/6E/7','OFDMA','AFC (Automated Frequency Coordination)','band steering','microwave / Bluetooth / Zigbee interference','spectrum analyzer']},
  {id:'ssid',name:'SSID & network types',kw:['SSID','BSSID','ESS / ESSID','hidden SSID','infrastructure mode','ad hoc mode','WLAN','WPAN','WWAN','mesh backhaul','point-to-point bridge','roaming','SSID-to-VLAN mapping']},
  {id:'sec',name:'Wi-Fi security',kw:['WEP','WPA / TKIP','WPA2 / AES-CCMP','WPA3 / SAE','GCMP-256','PMF (802.11w)','WPS','KRACK','transition mode']},
  {id:'guest',name:'Guest networks',kw:['guest VLAN','client isolation','captive portal','bandwidth rate limiting']},
  {id:'auth',name:'Authentication',kw:['802.1X','RADIUS','supplicant / authenticator','EAP-TLS','PEAP','EAP-TTLS','EAP-FAST','certificates']},
  {id:'ant',name:'Antennas & RF',kw:['omnidirectional antenna','Yagi','parabolic dish','patch / panel antenna','sector antenna','dBi gain','MIMO / MU-MIMO','beamforming','RSSI / dBm','SNR','EIRP','RF attenuation','site survey','heat map']},
  {id:'ap',name:'Access points & deployment',kw:['autonomous (fat) AP','lightweight (thin) AP','WLC (wireless LAN controller)','CAPWAP','cloud-managed AP','PoE 802.3af/at/bt','PoE budget','RRM','802.11k','802.11v','802.11r','AP placement']}
];
var EXERCISES=[
{id:'M1',type:'row',theme:'ap',title:'Helpdesk shift: four wireless tickets',
 kw:['PoE 802.3af/at/bt','band steering','captive portal','client isolation'],
 scenario:'You are the evening network technician at Meridian College. Four tickets wait in the wireless queue. The shift lead asks you to pick the <b>best first action</b> for each one before you touch anything.',
 question:'For each ticket, choose the best first action.',
 rows:[
  {q:'<b>T-4112</b> — Students on the guest Wi-Fi can see each other\'s laptops and shared folders.',opts:['Enable client isolation on the guest WLAN','Hide the guest SSID from the beacon frames','Change guest encryption from WPA2 to WEP','Raise the guest AP transmit power a notch'],c:0},
  {q:'<b>T-4113</b> — A new 802.11ax AP boots, but some radios stay off. The switch port log says "power below requested".',opts:['Replace the patch cable with a fresh Cat6a run','Check the port PoE standard and switch PoE budget','Disable DFS radar detection on the new AP','Reboot the RADIUS server at the head end'],c:1},
  {q:'<b>T-4114</b> — Warehouse scanners insist on the 2.4 GHz SSID and crawl, even though 5 GHz reaches every shelf.',opts:['Enable band steering toward the 5 GHz radios','Set the beacon interval to 500 milliseconds','Add a second 2.4 GHz AP right next to the first one','Turn off WPA2 on the warehouse WLAN entirely'],c:0},
  {q:'<b>T-4115</b> — A visitor says the guest join page never appears when they open a browser.',opts:['Give the visitor the staff Wi-Fi password to type in','Verify the captive portal redirect is enabled there','Add the visitor\'s laptop MAC to the RADIUS server','Enable WPS pairing on the guest AP instead'],c:1}
 ],
 hint:'One ticket is about power, one about guests seeing each other, one about a slow band choice, one about the login page.',
 expl:'<b>T-4112:</b> client isolation stops client-to-client traffic on the same guest WLAN, so guests only reach the internet. Hiding the SSID is not a security control. <b>T-4113:</b> 802.11ax APs often need 802.3at or 802.3bt power; an 802.3af port or a used-up PoE budget leaves radios off. <b>T-4114:</b> band steering nudges dual-band clients to 5 GHz and frees 2.4 GHz airtime. <b>T-4115:</b> a captive portal must intercept the first browser request and redirect to the login page. <b>Focus on:</b> isolation = guest separation, PoE budget = watts available, steering = band choice.'},
{id:'M2',type:'dd',theme:'freq',title:'Match the band to its trade-off',
 kw:['2.4 GHz band','5 GHz band','6 GHz band (Wi-Fi 6E)','RF attenuation','AFC (Automated Frequency Coordination)','microwave / Bluetooth / Zigbee interference'],
 scenario:'You are preparing a one-page RF cheat sheet for new hires at Northwind IT services. The first section compares the three Wi-Fi bands people actually deploy.',
 question:'Drag each fact to the band it belongs to.',
 buckets:[{id:'b24',label:'2.4 GHz'},{id:'b5',label:'5 GHz'},{id:'b6',label:'6 GHz (Wi-Fi 6E)'}],
 items:[
  {t:'Longest range and best wall penetration',b:'b24'},
  {t:'Only three non-overlapping 20 MHz channels (US)',b:'b24'},
  {t:'Crowded by microwave ovens and Bluetooth',b:'b24'},
  {t:'Many channels; UNII-2 space needs radar checks (DFS)',b:'b5'},
  {t:'Where most 802.11ac clients live',b:'b5'},
  {t:'Needs AFC permission for Standard Power in some regions',b:'b6'},
  {t:'No legacy 802.11n/ac devices allowed; cleanest air',b:'b6'}
 ],
 hint:'Think: old and crowded, middle and busy, new and clean.',
 expl:'2.4 GHz travels far and passes walls best, but it has only channels 1, 6 and 11 and it shares air with microwave ovens, Bluetooth and Zigbee. 5 GHz offers many more channels; part of it (UNII-2 and UNII-2 Extended) uses DFS radar checks. 6 GHz is new spectrum for Wi-Fi 6E: only modern clients may join, the air is clean, and Standard Power APs must ask the AFC database before transmitting. <b>Focus on:</b> range favours lower frequencies; channel count favours higher ones.'},
{id:'M3',type:'fill',theme:'ssid',title:'Complete the WLAN design note',
 kw:['SSID','BSSID','ESS / ESSID','infrastructure mode','ad hoc mode','SSID-to-VLAN mapping'],
 scenario:'A junior admin drafted the warehouse design note but left gaps. You must close them before the change window. The warehouse WLAN spans six APs under one network name, and guest traffic is segregated.',
 question:'Complete the note — place one term from the word bank into each blank.',
 text:'Our warehouse network name "WH-PROD" is one ESSID spread over 6 APs, so clients can roam. Each AP radio also has its own {{0}} (the radio\'s MAC address, seen in captures). All APs run in {{1}} mode with a wired backbone; we never use {{2}} mode (client-to-client, no AP) in production. The staff SSID maps to VLAN 20 and the guest SSID maps to VLAN 60 — this {{3}} mapping keeps the two worlds apart.',
 ans:['BSSID','infrastructure','ad hoc','SSID-to-VLAN'],
 bank:['piconet','WPS','captive portal','mesh backhaul'],
 hint:'Two words name the radio\'s address and the two modes; the last gap is about name-to-VLAN rules.',
 expl:'The <b>BSSID</b> is the MAC of one AP radio; the SSID/ESSID is the network name shared across the whole ESS. Infrastructure mode means every client talks through an AP; ad hoc (IBSS) mode is client-to-client with no AP — not used for managed WLANs. Mapping each SSID to its own VLAN is the standard way to segment staff and guest traffic. The distractors do not fit: WPS is a join method, a captive portal is a login page, and mesh backhaul is wireless AP-to-AP linking.'},
{id:'M4',type:'log',theme:'freq',title:'Why did channel 116 clients drop?',
 kw:['DFS (Dynamic Frequency Selection)','RRM','5 GHz band'],
 scenario:'Monday 08:40. Users on the third floor of the Brookhollow office say Wi-Fi "blipped" for about a minute. You open the WLC log for AP-03.',
 lines:[
  {t:'08:41:02',lv:'warn',m:'AP-03 radio1 (5 GHz): DFS radar detected on channel 116 — starting CAC'},
  {t:'08:41:04',lv:'warn',m:'AP-03 radio1: channel change 116 -> 132 (DFS), quiet period scheduled'},
  {t:'08:41:19',lv:'err',m:'AP-03: 14 clients deauthenticated (reason 4: inactivity) during switch'},
  {t:'08:42:30',lv:'inf',m:'AP-03 radio1: CAC passed on channel 132, beacons resumed'},
  {t:'08:43:11',lv:'inf',m:'RRM: channel re-balance complete, no coverage hole alarms'},
  {t:'08:44:02',lv:'inf',m:'WLC 10[.]10[.]20[.]5: event forwarded to syslog collector'}
 ],
 question:'What caused the brief client drops on AP-03?',
 inner:{type:'qcm',opts:['DFS radar detection forced a channel change','A deauthentication flood launched by an attacker','The AP briefly lost PoE power for a minute','The RADIUS server timed out during peak load'],c:0},
 hint:'Read the first two lines together, then look at the timestamps.',
 expl:'DFS protects radar users (weather and military radar) in parts of the 5 GHz band. When an AP detects radar it must leave the channel, run a Channel Availability Check and pick a new one; clients have to follow, which shows up as a short drop. The log shows the radar event, the switch to channel 132, and a clean re-balance — no attacker, no power loss, and RADIUS is not involved in a channel change. <b>Focus on:</b> "DFS radar detected" in logs always explains unplanned 5 GHz channel moves.'},
{id:'M5',type:'match',theme:'ant',title:'Pick the antenna for the job',
 kw:['omnidirectional antenna','Yagi','parabolic dish','patch / panel antenna','sector antenna','point-to-point bridge'],
 scenario:'You are the RF engineer for a small integrator. Five jobs are on the bench this week and the van carries every antenna type you need.',
 question:'Match each job to the antenna type you would mount.',
 pairs:[
  {l:'Even coverage across a big open office',r:'Omnidirectional'},
  {l:'3 km rooftop-to-rooftop link between two buildings',r:'Parabolic dish'},
  {l:'Stretch coverage down one long warehouse aisle',r:'Yagi'},
  {l:'Cover the waiting-room half of a clinic, wall-mounted',r:'Patch / panel'},
  {l:'Split a stadium bowl into 12 coverage wedges',r:'Sector'}
 ],
 hint:'All directions, one tight beam, one aisle, half a room, one wedge.',
 expl:'An <b>omnidirectional</b> antenna radiates the same power all around — ideal for a ceiling AP in an open office. A <b>parabolic dish</b> has very high gain in one tight beam, made for long point-to-point links. A <b>Yagi</b> is directional with medium gain — good to push signal down an aisle. A <b>patch/panel</b> covers a half-room or a wall side neatly. <b>Sector</b> antennas cover wedges (typically 90 or 120 degrees), so several of them ring a stadium or cell site. <b>Focus on:</b> match the radiation pattern to the shape of the coverage area.'},
{id:'M6',type:'order',theme:'ap',title:'Order the site survey from desk to ladder',
 kw:['site survey','heat map','RSSI / dBm','AP placement'],
 scenario:'FacilityCare hired you to redesign Wi-Fi for their two-floor clinic. You have floor plans, a laptop with survey software, two loan APs, and a lift ladder booked for Friday.',
 question:'Put the survey steps in the order you would actually do them.',
 lab:'Put the steps in order — first on top',
 items:[
  {t:'Review floor plans and coverage goals (predictive design)'},
  {t:'Walk the site and record existing RF, noise and dead spots (passive survey)'},
  {t:'Place temporary APs, associate and test real throughput (active survey)'},
  {t:'Draw heat maps; flag every seat weaker than -67 dBm'},
  {t:'Fix the channel and power plan, then mount the APs for good'}
 ],
 hint:'Desk first, walk second, temporary gear third, maps fourth, ladders last.',
 expl:'A proper survey starts at the desk with the floor plans and requirements (predictive), then measures what the building really does to RF by walking it (passive survey). Temporary APs let you test real client experience (active survey). The measurements become heat maps — anything under about -67 dBm is weak for voice or video. Only then do you fix channels and power and mount hardware. Doing it backwards (mounting first) wastes the survey and the ladder booking. <b>Focus on:</b> predictive → passive → active → heat map → install.'},
{id:'M7',type:'qcm',theme:'freq',title:'Two APs, channels 1 and 5, unhappy users',
 kw:['adjacent-channel interference','co-channel interference','channels 1 / 6 / 11'],
 scenario:'A tenant office has two 2.4 GHz APs ten metres apart. The integrator set one to channel 1 and the other to channel 5 "to keep them different". Users on both APs complain that throughput is far below the plan.',
 question:'What is the most likely explanation?',
 opts:['Channels 1 and 5 overlap, so the APs corrupt each other\'s frames','The APs are co-channel neighbours and must politely share airtime','Channel 5 is a DFS channel that radar reservations keep busy','Channel 1 is a reserved channel for 5 GHz-only devices'],
 c:0,
 sim:false,
 hint:'Non-overlapping 20 MHz channels sit 5 numbers apart.',
 expl:'In 2.4 GHz, 20 MHz channels only fit without overlap as 1, 6 and 11. Channel 5 overlaps both 1 and 6, so two APs on 1 and 5 interfere directly: frames arrive corrupted and must be retransmitted — usually worse than sharing a channel (co-channel), where devices at least take turns cleanly. DFS applies to 5 GHz channels like 52–144, never to 2.4 GHz. <b>Focus on:</b> "different" is not enough — channels must not overlap.'},
{id:'M8',type:'dd',theme:'sec',title:'Sort the Wi-Fi security facts by generation',
 kw:['WEP','WPA / TKIP','WPA2 / AES-CCMP','WPA3 / SAE','GCMP-256','KRACK','PMF (802.11w)'],
 scenario:'A trainee mixed up sticky notes about Wi-Fi security history on the SOC whiteboard. Before the audit, sort each fact into the right generation.',
 question:'Drag each fact to the protocol generation it describes.',
 buckets:[{id:'leg',label:'WEP / WPA (legacy)'},{id:'w2',label:'WPA2'},{id:'w3',label:'WPA3'}],
 items:[
  {t:'Uses TKIP, built on RC4',b:'leg'},
  {t:'24-bit IV reuse makes it crackable in minutes',b:'leg'},
  {t:'AES-CCMP with the 4-way handshake',b:'w2'},
  {t:'KRACK abused key reinstallation in the handshake (patched since)',b:'w2'},
  {t:'SAE replaces the shared PSK handshake; resists offline guessing',b:'w3'},
  {t:'Can use GCMP-256, with a 192-bit suite for enterprise',b:'w3'},
  {t:'Makes PMF (protected management frames) mandatory',b:'w3'}
 ],
 hint:'TKIP and IV reuse are the oldest clues; PMF and GCMP-256 the newest.',
 expl:'WEP is long dead (cracked via IV reuse in minutes) and WPA patched it only with TKIP, which is also deprecated. WPA2 brought AES-CCMP and the 4-way handshake — solid, but KRACK (2017) abused key reinstallation until patches arrived. WPA3 replaces the PSK handshake with SAE, which does not leak material for offline password guessing, can use stronger GCMP-256 ciphers, and requires protected management frames (802.11w) to stop spoofed deauthentications. <b>Focus on:</b> RC4/TKIP = legacy, CCMP = WPA2, SAE/PMF/GCMP-256 = WPA3.'},
{id:'M9',type:'spot',theme:'sec',title:'Spot the mistake — branch AP config',
 kw:['WPA / TKIP','WPA2 / AES-CCMP'],
 scenario:'The new branch AP shipped with this config from a rushed template. Everything else (channel, power, VLAN 20) was verified on site.',
 cfg:['interface wifi0',' ssid CORP-SECURE',' vlan 20',' security wpa2-psk',' cipher tkip',' pmf optional',' beacon-interval 100',' dtim 2',' wmm enabled',' channel 36 width 20'],
 question:'Click the ONE line that seriously weakens this WLAN.',
 need:[4],
 hint:'PSK belongs with AES — something older slipped into the cipher line.',
 expl:'Line 5 sets <b>TKIP</b>, the old RC4-based cipher from WPA, under a WPA2-Personal WLAN. WPA2 means AES-CCMP; TKIP caps throughput at 54 Mbps-era rates and is deprecated and disallowed for high throughput. The other lines are unremarkable: PMF optional is acceptable on a WPA2 WLAN, and beacons, DTIM, WMM and a clean 20 MHz channel 36 are all fine. <b>Focus on:</b> cipher lines — "tkip" under any WPA2/WPA3 WLAN is the red flag.'},
{id:'M10',type:'term',theme:'auth',title:'Grep the authentication failures',
 kw:['RADIUS','WPA2 / AES-CCMP'],
 scenario:'You are on WLC-1 over SSH. Today\'s controller log sits in the file <code>wlans.log</code>. Successful 802.1X joins for SSID CORP-SECURE are tagged <code>AUTH_OK</code>; failures are tagged <code>AUTH_FAIL</code>.',
 question:'Print every line containing authentication failures — ignoring upper/lower case — from <code>wlans.log</code>.<br><small>Guidance: the command family is <code>grep</code>; the <code>-i</code> flag ignores case. Expected output shape: <code>09:12:01 AUTH_FAIL sta=aa:bb:cc:00:11:22 ssid=CORP-SECURE</code></small>',
 intro:'WLC-1 ssh session. Files: wlans.log  raddacct.log  config.txt',
 accepted:[/^(?=[\s\S]*\bgrep\b)(?=[\s\S]*auth[-_]fail)(?=[\s\S]*wlans\.log)/i],
 out:'09:12:01 AUTH_FAIL sta=aa:bb:cc:00:11:22 ssid=CORP-SECURE reason=timeout\n09:47:38 AUTH_FAIL sta=44:11:9c:02:7a:11 ssid=CORP-SECURE reason=reject\n10:02:14 AUTH_FAIL sta=60:33:4b:1e:5c:88 ssid=CORP-SECURE reason=reject',
 err:'command rejected — the task needs grep searching wlans.log for the AUTH_FAIL tag (try: grep -i AUTH_FAIL wlans.log)',
 hint:'One word for the tool, then the failure tag — capitals in the log, -i keeps it safe.',
 example:'grep -i AUTH_FAIL wlans.log',
 expl:'<code>grep -i AUTH_FAIL wlans.log</code> prints exactly the failing lines: -i makes the search case-insensitive, so it matches AUTH_FAIL whatever the case. Successes (AUTH_OK) stay filtered out because the pattern names the failure tag. This is the first triage step before deciding whether rejects (wrong credentials) or timeouts (server or signal trouble) dominate. <b>Focus on:</b> the tag name plus case-insensitive matching.'},
{id:'M11',type:'branch',theme:'guest',title:'Build the lobby guest Wi-Fi — decide as you go',
 kw:['guest VLAN','client isolation','captive portal','bandwidth rate limiting'],
 scenario:'Bramble & Co. wants lobby Wi-Fi for visitors. You are the network admin making the design decisions in the change meeting. Each choice commits and unlocks the next question.',
 question:'Choose the correct option at every step.',
 steps:[
  {q:'How should guest traffic leave the network?',opts:['Its own guest VLAN that only routes to the internet','On the staff VLAN, protected by the portal page','Bridged onto the printer VLAN so guests can print freely'],c:0},
  {q:'Two visitors start sharing files between their laptops. Which setting stops client-to-client traffic?',opts:['Client isolation on the guest WLAN','A hidden SSID that hides the network name','A shorter DHCP lease time for guests'],c:0},
  {q:'What must every visitor pass through before getting internet?',opts:['A captive portal page with the terms of use','The WPS push-button on the lobby AP','A RADIUS certificate prompt on their phone'],c:0},
  {q:'One guest starts a huge backup and the lobby link crawls. What protects business traffic?',opts:['A bandwidth rate limit on the guest WLAN','Disabling the 2.4 GHz radio on the AP','Raising the AP transmit power to maximum'],c:0}
 ],
 hint:'Think in order: separate, isolate, inform, throttle.',
 expl:'Guest Wi-Fi best practice is a chain: put guests in their <b>own guest VLAN</b> with only an internet route, turn on <b>client isolation</b> so guests cannot attack each other, force everyone through a <b>captive portal</b> that presents the terms, and apply a <b>bandwidth rate limit</b> so one user cannot starve the link. Hiding the SSID is cosmetic, WPS is a security liability, and power settings do not fix a bandwidth hog.'},
{id:'M12',type:'multi',theme:'freq',title:'True statements about 5 GHz DFS',
 kw:['DFS (Dynamic Frequency Selection)','UNII bands','5 GHz band'],
 scenario:'A junior operator wrote a summary of DFS for the runbook. You must mark the statements the runbook can keep.',
 question:'Select ALL statements that are true about DFS channels (UNII-2 / UNII-2 Extended).',
 opts:['APs must detect radar and leave the channel when it appears','Weather or military radar can trigger an automatic channel switch','Clients may drop briefly while the AP moves channels','DFS also applies to the crowded 2.4 GHz band','DFS channels are banned from indoor deployments','DFS lets an AP ignore radar detections if users complain loudly'],
 ans:[0,1,2],
 hint:'Radar is the keyword; two statements smuggle in other bands or wishful thinking.',
 expl:'In UNII-2 and UNII-2 Extended, Wi-Fi is a guest of radar systems. The AP must monitor for radar and vacate the channel, which briefly drops clients while they follow the switch. DFS exists only in 5 GHz (and coordination rules like AFC live in 6 GHz) — never in 2.4 GHz. DFS channels are perfectly legal indoors, and there is no "users object" exception. <b>Focus on:</b> radar, vacate, brief client impact.'},
{id:'M13',type:'order',theme:'ap',title:'Rank the morning tickets by urgency',
 kw:['microwave / Bluetooth / Zigbee interference','PoE budget','adjacent-channel interference'],
 scenario:'Tuesday 07:55 at Harborview Clinic. Five wireless tickets arrived overnight. The on-call policy says: patient care first, then shared infrastructure, then single rooms, then cosmetics.',
 question:'Rank the five tickets from most urgent to least urgent — most urgent on top.',
 lab:'Rank the tickets — most urgent on top',
 items:[
  {t:'ER infusion monitors (2.4 GHz) lose link whenever the kitchen microwave runs'},
  {t:'Core switch PoE budget fault has knocked six APs offline building-wide'},
  {t:'Radiology APs on channels 3 and 11 overlap — scan uploads crawl'},
  {t:'Guest portal page loads slowly at lunch rush'},
  {t:'Staff SSID still shows the old clinic name after rebrand'}
 ],
 hint:'Clinical gear first, building-wide second, one department third, comfort fourth, name last.',
 expl:'Ranking: (1) the ER monitors touch <b>patient care</b> — and the kitchen microwave is a classic 2.4 GHz interferer; (2) the <b>PoE budget</b> fault takes out six APs — shared infrastructure for the whole building; (3) channels 3 and 11 <b>overlap</b> in 2.4 GHz and slow one department; (4) the guest portal is a comfort issue; (5) the SSID name is purely cosmetic and changes nothing about service quality. <b>Focus on:</b> clinical impact > blast radius > department > comfort > cosmetics.'},
{id:'M14',type:'match',theme:'auth',title:'Match each EAP type to its signature',
 kw:['EAP-TLS','PEAP','EAP-TTLS','EAP-FAST','certificates'],
 scenario:'You are documenting the 802.1X methods supported by the new RADIUS platform so the service desk can recognise them in logs.',
 question:'Match each EAP method to its deployment signature.',
 pairs:[
  {l:'Certificates on BOTH server and client',r:'EAP-TLS'},
  {l:'Server certificate; username/password inside a TLS tunnel',r:'PEAP'},
  {l:'Server certificate; tunnels almost any inner password method',r:'EAP-TTLS'},
  {l:'Shared secrets (PACs) instead of certificates',r:'EAP-FAST'}
 ],
 hint:'Two need a server certificate; only one needs a certificate on every laptop.',
 expl:'<b>EAP-TLS</b> is the gold standard: mutual certificates on the RADIUS server and every supplicant, so nothing to type and nothing to phish. <b>PEAP</b> first builds a TLS tunnel with the server certificate, then does a password check (usually MSCHAPv2) inside it. <b>EAP-TTLS</b> is similar but happily tunnels older inner methods. <b>EAP-FAST</b> avoids certificates by provisioning PAC shared secrets — rare in new deployments. <b>Focus on:</b> who holds a certificate: both sides (TLS), server only (PEAP/TTLS), or nobody (FAST).'},
{id:'M15',type:'fill',theme:'freq',title:'Complete the channel plan',
 kw:['channels 1 / 6 / 11','channel bonding (40/80/160 MHz)','DFS (Dynamic Frequency Selection)'],
 scenario:'The floor plan below the breaker panel needs the standard 2.4 GHz plan before the APs are mounted. Fill the blanks from the word bank.',
 question:'Place one word or number from the bank into each blank of the channel plan.',
 text:'Ground-floor 2.4 GHz APs use channels {{0}}, {{1}} and {{2}} — the only three 20 MHz channels that do not overlap. Upstairs, the 5 GHz radios combine pairs of 20 MHz channels into {{3}} MHz wide channels for speed. AP-04 sits under the harbour radar\'s path, so its 5 GHz radio must expect to avoid {{4}} channels when the radar sweeps.',
 ans:['1','6','11','40','DFS'],
 bank:['2.4','160','22','TKIP','12'],
 hint:'Three famous numbers, one bonding width, one radar word.',
 expl:'2.4 GHz has room for exactly three non-overlapping 20 MHz channels: <b>1, 6 and 11</b> — any other pick overlaps a neighbour. In 5 GHz, bonding two adjacent 20 MHz channels makes a 40 MHz channel, doubling throughput at the cost of fewer clean channels and more interference exposure. Near radar sites, 5 GHz radios must give way on DFS channels when the radar is active. The other bank words are distractors: channel 12 is outside the US plan, 160 MHz is a bigger (and DFS-heavy) step, and 22 MHz is not a Wi-Fi width.'},
{id:'M16',type:'qcm',theme:'ap',title:'The AP that boots but underperforms',
 kw:['PoE 802.3af/at/bt','PoE budget'],
 scenario:'A new four-radio 802.11ax AP was hung in the annex on an old 802.3af switch port. It powers up and joins the controller, but its dashboards show reduced radio capability, and the port log reads "device power request exceeds allocation".',
 question:'What is the correct fix?',
 opts:['Move the AP to an 802.3bt port or a rated injector','Disable DFS radar detection on the annex AP','Switch the AP into ad hoc mode to shed power load','Upgrade the switch port to 10 Gbps Ethernet links'],
 c:0,
 sim:false,
 hint:'It is about watts, not bits.',
 expl:'Full-capability 802.11ax APs typically need 802.3at (PoE+, 30 W) or 802.3bt (up to 60/90 W); an 802.3af port supplies only about 15 W, so the AP self-throttles radios or features to fit. The healthy fix is a port or injector with the right standard and free PoE budget. DFS is a frequency rule, ad hoc removes your central WLAN, and port speed (10 Gbps) does not change delivered watts. <b>Focus on:</b> af &lt; at &lt; bt, and check the switch PoE budget, not just the port.'},
{id:'M17',type:'dd',theme:'ssid',title:'Sort the devices into network types',
 kw:['WPAN','WLAN','WWAN','60 GHz WiGig'],
 scenario:'Asset management asked you to tag every wireless gadget by network class: personal area, local area, or wide area.',
 question:'Drag each device to its network type.',
 buckets:[{id:'pan',label:'WPAN (personal)'},{id:'lan',label:'WLAN (local)'},{id:'wan',label:'WWAN (wide)'}],
 items:[
  {t:'Bluetooth headset',b:'pan'},
  {t:'Zigbee smart bulb',b:'pan'},
  {t:'60 GHz WiGig docking link',b:'pan'},
  {t:'Laptop on the office SSID',b:'lan'},
  {t:'Tablet on the campus Wi-Fi',b:'lan'},
  {t:'LTE hotspot dongle',b:'wan'},
  {t:'5G router in the field van',b:'wan'}
 ],
 hint:'Personal bubble, building, carrier network.',
 expl:'<b>WPAN</b> covers a person\'s immediate bubble: Bluetooth, Zigbee and 60 GHz WiGig links (802.11ad/ay over very short range). <b>WLAN</b> is your building or campus Wi-Fi — laptops and tablets on SSIDs. <b>WWAN</b> is the carrier world: LTE and 5G. The classes follow reach: metres, a building, kilometres. <b>Focus on:</b> WiGig is still an 802.11 family member, but its range classifies it as personal-area.'},
{id:'M18',type:'spot',theme:'guest',title:'Spot the mistake — guest WLAN config',
 kw:['hidden SSID','guest VLAN','SSID-to-VLAN mapping'],
 scenario:'The catering vendor\'s guests keep seeing staff devices on the network. The guest WLAN config looks like this:',
 cfg:['wlan Guest-Net',' ssid "Guest-Net"',' vlan 1',' security wpa2-psk key "Welcome2026!"',' portal captive enabled',' client-isolation enabled',' rate-limit down 5 mbps',' hide-ssid disabled'],
 question:'Click the ONE line that puts guests on the staff network.',
 need:[2],
 hint:'Look where the traffic lands.',
 expl:'Line 3 maps Guest-Net to <b>VLAN 1</b> — the default staff/native VLAN — so guests share the broadcast domain with staff devices no matter what the portal or isolation settings say. Guest traffic must land in its own guest VLAN with firewall rules to the internet only. The rest is fine: isolation on, a rate limit, and the SSID is intentionally visible (hiding an SSID is not a security control anyway). <b>Focus on:</b> check the VLAN line first on any guest WLAN complaint.'},
{id:'M19',type:'log',theme:'auth',title:'RADIUS log reading',
 kw:['RADIUS','certificates','PEAP'],
 scenario:'Service desk escalated "Wi-Fi broken for half the floor". You pull the last hour of the RADIUS log for the CORP WLAN (PEAP with MSCHAPv2) and one EAP-TLS SSID used by tablets.',
 lines:[
  {t:'21:02:11',lv:'ok',m:'ACCESS-ACCEPT sta=aa:bb:cc:31:05:09 method=PEAP user=r.okafor'},
  {t:'21:03:04',lv:'err',m:'ACCESS-REJECT sta=dd:ee:ff:22:10:31 method=PEAP reason=bad-MSCHAPv2-secret'},
  {t:'21:04:40',lv:'err',m:'TLS-HANDSHAKE-FAIL sta=71:2a:09:33:b1:cd method=EAP-TLS reason=client-cert-untrusted'},
  {t:'21:05:12',lv:'ok',m:'ACCESS-ACCEPT sta=12:9f:3c:80:44:71 method=PEAP user=l.mercier'},
  {t:'21:07:55',lv:'err',m:'ACCESS-REJECT sta=c4:10:77:2e:9b:60 method=PEAP reason=expired-account'},
  {t:'21:09:03',lv:'inf',m:'server 10[.]40[.]2[.]17: policy load 0.31, 6 accepts / 3 rejects'}
 ],
 question:'Select ALL statements the log actually supports.',
 inner:{type:'multi',opts:['One tablet failed — its client certificate is not trusted','Two clients authenticated successfully during the hour','At least one password (secret) was simply wrong','The RADIUS server sat offline for the entire hour','Every single failure came from an expired account'],ans:[0,1,2]},
 hint:'Count the ACCEPTs; read each reason field one by one.',
 expl:'The log shows exactly two <code>ACCESS-ACCEPT</code> lines (success), one <code>TLS-HANDSHAKE-FAIL</code> with reason <b>client-cert-untrusted</b> (the tablet does not trust the certificate chain), a <b>bad-MSCHAPv2-secret</b> reject (wrong password) and an <b>expired-account</b> reject. The server is clearly alive — it answered six times. Failures have three different causes, so "every failure was an expired account" is false. <b>Focus on:</b> reason codes tell you the fix: enrol/trust the cert, reset the password, or renew the account.'},
{id:'M20',type:'qcm',theme:'ant',title:'Place the AP — open-plan office',
 kw:['AP placement','RF attenuation'],
 sim:true,
 scenario:'The floor plan below shows the Cartwright office: a metal server room on the left, an open desk area in the middle, a glass-walled lobby on the right. One AP goes up today. Signal through metal dies quickly; glass costs a little.',
 svg:'<svg viewBox="0 0 560 220" role="img" aria-label="Office floor plan with four candidate AP spots"><rect x="8" y="8" width="120" height="120" fill="#1d2a44" stroke="#41608c"/><text x="18" y="30" class="svglbl">Server room (metal racks)</text><rect x="136" y="8" width="230" height="204" fill="#152238" stroke="#41608c"/><text x="250" y="30" class="svglbl">Open desks</text><rect x="374" y="8" width="178" height="204" fill="#152238" stroke="#41608c"/><text x="400" y="30" class="svglbl">Lobby (glass wall)</text><line x1="374" y1="8" x2="374" y2="212" stroke="#7dd3fc" stroke-dasharray="5 4"/><circle cx="66" cy="150" r="9" fill="#f87171"/><text x="34" y="180" class="svglbl">A</text><circle cx="250" cy="106" r="9" fill="#34d399"/><text x="242" y="92" class="svglbl">B</text><circle cx="452" cy="106" r="9" fill="#fbbf24"/><text x="444" y="92" class="svglbl">C</text><circle cx="150" cy="190" r="9" fill="#60a5fa"/><text x="142" y="180" class="svglbl">D</text></svg>',
 question:'Which marked spot gives the most even coverage for the desks and lobby?',
 opts:['A — inside the server room, near the power','B — ceiling centre of the open desk area','C — middle of the lobby behind the glass wall','D — bottom corner behind the metal cabinet'],
 c:1,
 hint:'Metal kills signal; centre spreads it.',
 expl:'A ceiling position in the middle of the served area (B) radiates to all seats with the fewest walls in the way. A puts the server room\'s metal racks between the AP and everyone — severe <b>RF attenuation</b>. C isolates the AP behind glass and leaves the desks two walls away. D hides the antenna behind metal and pushes coverage into a corner. <b>Focus on:</b> central, high, clear of metal — the usual best AP placement.'},
{id:'M21',type:'order',theme:'auth',title:'Order the 802.1X authentication handshake',
 kw:['802.1X','supplicant / authenticator','RADIUS'],
 scenario:'The security team wants the service desk to understand what actually happens when a laptop joins the 802.1X WLAN. The AP is the authenticator; the RADIUS box is the authentication server.',
 question:'Put the handshake stages in the order they happen.',
 items:[
  {t:'Supplicant (laptop) associates to the AP on the open 802.1X-controlled port'},
  {t:'AP (authenticator) asks the client for its identity'},
  {t:'Client sends its identity'},
  {t:'AP relays the credentials inside EAP to the RADIUS server'},
  {t:'RADIUS checks the credentials and returns Access-Accept'},
  {t:'AP completes the WPA2 4-way handshake and ships the keys'}
 ],
 hint:'Identity first, keys last; the AP only relays.',
 expl:'In <b>802.1X</b> three roles talk: the <b>supplicant</b> (the laptop), the <b>authenticator</b> (AP or switch, which just relays EAP) and the authentication server (<b>RADIUS</b>). The client associates, the authenticator requests identity, the client answers, RADIUS validates, and only after Access-Accept does the AP run the 4-way handshake that distributes encryption keys. The AP never decides access itself — RADIUS does. <b>Focus on:</b> the AP is a middleman, not the judge.'},
{id:'M22',type:'multi',theme:'sec',title:'What WPA3-Enterprise actually requires',
 kw:['WPA3 / SAE','PMF (802.11w)','certificates','transition mode','WPS'],
 scenario:'The auditor asks for the shopping list that makes a WLAN genuinely WPA3-Enterprise. Mark the real requirements; reject the myths.',
 question:'Select ALL items that WPA3-Enterprise genuinely requires or uses.',
 opts:['A RADIUS server reached through 802.1X','An EAP type that presents a server certificate','PMF (802.11w) protected management frames','Per-user or per-device credentials or certificates','SAE handshakes instead of PSK for every single user','WPS left enabled so brand-new devices can join easily'],
 ans:[0,1,2,3],
 hint:'Enterprise means 802.1X family — SAE and WPS belong to other stories.',
 expl:'WPA3-Enterprise is the 802.1X story: a RADIUS server, an EAP method with a server certificate (EAP-TLS is best — mutual certificates), protected management frames, and organisation-issued credentials or certificates per user/device. <b>SAE belongs to WPA3-Personal</b> (home/PSK replacement), not Enterprise. <b>WPS</b> is a weak convenience feature and must stay off. Transition mode (WPA2+WPA3 together) is a compatibility option, not a requirement here. <b>Focus on:</b> Personal = SAE, Enterprise = 802.1X.'},
{id:'M23',type:'qcm',theme:'freq',title:'Why not one 40 MHz channel in 2.4 GHz?',
 kw:['channel width trade-off','channel bonding (40/80/160 MHz)','channels 1 / 6 / 11'],
 scenario:'A site lead wants to "double the speed" by bonding the 2.4 GHz radio to one 40 MHz channel. You have to explain the trade-off in the change ticket.',
 question:'Why is a single 40 MHz cell usually a bad plan in 2.4 GHz?',
 opts:['It overlaps most of the band and raises interference','A 40 MHz channel is not legal for indoor deployments','40 MHz halves the legal outdoor range limit','It forces every client onto DFS channels in the 5 GHz band'],
 c:0,
 sim:false,
 hint:'Only three 20 MHz channels fit — double one and count what is left.',
 expl:'2.4 GHz holds only three non-overlapping 20 MHz channels (1, 6, 11). A 40 MHz channel eats two of them, so it overlaps almost the whole band: your own AP plus every neighbour\'s frames collide, and throughput usually drops instead of rising. 40 MHz indoors is perfectly legal, range rules do not change, and DFS is a 5 GHz concept. <b>Focus on:</b> wider channels trade spectrum efficiency for raw rate — and in 2.4 GHz there is no spare spectrum to trade.'},
{id:'M24',type:'match',theme:'freq',title:'Match the Wi-Fi generation to its claim',

 scenario:'Marketing labels are everywhere. Pin each generation to the one feature it is famous for.',
 question:'Match each generation to its signature feature.',

  {l:'Wi-Fi 5 (802.11ac)',r:'5 GHz only, 80/160 MHz, downlink MU-MIMO'},
  {l:'Wi-Fi 6 (802.11ax)',r:'OFDMA for many small devices; 2.4 + 5 GHz'},
  {l:'Wi-Fi 6E',r:'Opens the 6 GHz band'},

 hint:'Follow the letters: n, ac, ax, be.',
 expl:'<b>802.11n</b> (Wi-Fi 4) introduced MIMO streams on both legacy bands. <b>802.11ac</b> (Wi-Fi 5) went 5 GHz-only with wide 80/160 MHz channels and downlink MU-MIMO. <b>802.11ax</b> (Wi-Fi 6) added OFDMA, slicing channels for many small frames at once — the elevator crowd of protocols — and returned to 2.4 GHz. <b>Wi-Fi 6E</b> is the same 11ax tech opened onto the clean 6 GHz band. <b>802.11be</b> (Wi-Fi 7) pushes 320 MHz channels and MLO (Multi-Link Operation). <b>Focus on:</b> the band + the headline feature together identify the generation.'},
{id:'M25',type:'fill',theme:'ant',title:'Antenna spec sheet blanks',

 scenario:'The warehouse antenna datasheet arrived with blanks where the junior tech spilled coffee. Complete it from the word bank.',
 question:'Complete the datasheet — one term per blank.',
 text:'The default rubber-duck antenna on a ceiling AP is {{0}} — it radiates the same power in every horizontal direction. A typical dipole has about 2 {{1}} of gain. For the 4 km link to the barn we mounted a {{2}} dish at each end. Modern APs also steer energy toward each client instead of spraying it — that trick is called {{3}} — and installers must keep total {{4}} within the legal limit for the band.',
 ans:['omnidirectional','dBi','parabolic','beamforming','EIRP'],
 bank:['dBm','Yagi','sector'],
 hint:'One pattern word, one gain unit, one dish, one steering word, one legal-limit word.',
 expl:'An <b>omnidirectional</b> antenna covers all directions horizontally; its dipole gain is quoted in <b>dBi</b> (about 2.14 for a dipole). <b>dBi</b> compares the antenna to isotropic; dBm measures absolute power — different units. A <b>parabolic dish</b> concentrates everything into one long-reaching beam. <b>Beamforming</b> focuses energy toward specific clients. Finally, <b>EIRP</b> (transmit power + antenna gain − cable loss) must stay inside the regulator\'s cap. Yagi and sector are real antennas but do not fit these blanks.'},
{id:'M26',type:'row',theme:'sec',title:'One lobby, two hats — defend it, then attack it',
 kw:['WPS','PMF (802.11w)'],

  {role:'BLUE',q:'Staff keep joining a fake "Free Lobby WiFi" someone set up. Which control genuinely helps?',opts:['Turn on PMF/WPA3, train staff, and hunt down the rogue AP','Rename the staff SSID to something secret and unguessable','Enable WPS so that joining the network is easier and safer','Move everyone onto channel 13 to escape the rogue'],c:0},
  {role:'RED',q:'As the pentester you see WPS enabled on the lobby AP. What is your next move?',opts:['Run a WPS PIN attack to recover the PSK','Try "12345678" on the captive portal page','Change the AP channel to 1 from outside','Enable client isolation from outside the AP'],c:0}
 ],
 hint:'Blue defends trust and frames; red presses the physical button — remotely.',
 expl:'<b>Blue:</b> an evil twin works because clients cannot tell APs apart and users are trusting. Protected management frames (PMF/802.11w) stop spoofed management traffic, strong WPA3-on-802.1X keeps the real network trustworthy, staff awareness catches the name mismatch, and the rogue AP must be found and removed (controller/spectrum location). Renaming an SSID is security theatre; channel numbers are irrelevant. <b>Red:</b> WPS\'s PIN protocol is brute-forceable (and Pixie Dust cracks many implementations offline) and leads straight to the PSK. <b>Focus on:</b> WPS off everywhere; PMF on for management-frame attacks.'},
{id:'M27',type:'branch',theme:'ap',title:'Roaming troubleshooting on floor 2→3',

  {q:'Handsets still cling to the far AP ("sticky client"). Which feature nudges them at the right moment?',opts:['802.11v BSS Transition Management frames','Hiding the far AP\'s SSID from beacons','Disabling the 5 GHz radio entirely'],c:0},
  {q:'Finally, what keeps weak-edge clients from dragging calls down?',opts:['A minimum-RSSI rule for weak-edge clients','A 500 ms beacon interval on both APs','WEP for lower encryption overhead'],c:0}
 ],

 expl:'Roaming needs <b>overlapping cells</b> (roughly 10–20%) so a client always has a next hop; max power actually worsens stickiness by inflating cells. <b>802.11r</b> moves the key material ahead of the client so the security handoff is fast — vital for voice. <b>802.11v</b> (helped by 802.11k neighbour reports) lets the network suggest "move now, here is a better AP". A <b>minimum-RSSI</b> rule drops or nudges clients before their link decays into retransmissions. Hiding SSIDs or WEP fix nothing here.'},

function buildView(ex){

  else if(ex.type==='branch'){v.rows=ex.steps.map(function(r){return sh(r.opts.map(function(_,k){return k;}));});}

function initAns(ex,v){
  switch(ex.type){

    case 'match':return {sel:null,place:{}};
    case 'order':return {ord:v.items.slice()};
    case 'fill':return {slots:ex.ans.map(function(){return null;})};
    case 'term':return {cmd:''};
    case 'log':return (ex.inner.type==='multi')?[]:null;
    case 'branch':return {picks:ex.steps.map(function(){return null;}),max:0};

function hasAns(ex,lv){
  var a=lv.a;
  if(a===null||a===undefined)return false;
  switch(ex.type){
    case 'multi':return a.length>0;
    case 'dd':return ex.items.some(function(_,k){return a.place[k];});
    case 'match':return ex.pairs.some(function(_,k){return a.place[k]!==undefined&&a.place[k]!==null;});
    case 'order':return true;
    case 'fill':return a.slots.some(function(s){return s!==null;});
    case 'term':return String(a.cmd||'').trim().length>0;
    case 'log':return ex.inner.type==='multi'?a.length>0:a!==null;
    case 'branch':return a.max>=ex.steps.length;
    case 'spot':return a.marked.length>0;
    case 'row':return a.some(function(p){return p!==null;});
  }
  return true;
}
/* validate -> {det:[{i,ok,bad,miss,fix}], corr, el} ; det entry per element (per option/line when marking needs it) */
function validate(ex,lv){
  var a=lv.a,v=lv.view,det=[],corr=0,el=0;
  function d(i,ok,bad,miss,fix){det.push({i:i,ok:ok,bad:bad,miss:miss,fix:fix||null});}
  switch(ex.type){
    case 'qcm':
      el=1;var ok=a===ex.c;
      if(ok)corr=1;
      det.push({i:a,ok:ok,bad:!ok,miss:false,fix:ok?null:ex.opts[ex.c]});
      break;
    case 'multi':
      el=ex.ans.length;
      ex.opts.forEach(function(_,k){
        var picked=a.indexOf(k)>=0,right=ex.ans.indexOf(k)>=0;
        if(right&&picked){corr++;d(k,true,false,false);}
        else if(right&&!picked){d(k,false,false,true);}
        else if(!right&&picked){d(k,false,true,false);}
      });
      break;
    case 'dd':
      el=ex.items.length;
      ex.items.forEach(function(it,k){
        var p=a.place[k];
        if(p===it.b){corr++;d(k,true,false,false);}
        else if(p){d(k,false,true,false,ex.buckets.filter(function(b){return b.id===it.b;})[0].label);}
        else{d(k,false,false,true,ex.buckets.filter(function(b){return b.id===it.b;})[0].label);}
      });
      break;
    case 'match':
      el=ex.pairs.length;
      ex.pairs.forEach(function(pr,k){
        var p=a.place[k];
        if(p!==undefined&&p!==null&&String(p)===String(k)){corr++;d(k,true,false,false);}
        else if(p!==undefined&&p!==null){d(k,false,true,false,pr.r);}
        else{d(k,false,false,true,pr.r);}
      });
      break;
    case 'order':
      el=ex.items.length;
      a.ord.forEach(function(ix,p){
        if(ix===p){corr++;d(p,true,false,false);}
        else{d(p,false,true,false,ex.items[p].t);}
      });
      break;
    case 'fill':
      el=ex.ans.length;
      a.slots.forEach(function(w,i){
        if(w===ex.ans[i]){corr++;d(i,true,false,false);}
        else if(w===null){d(i,false,false,true,ex.ans[i]);}
        else{d(i,false,true,false,ex.ans[i]);}
      });
      break;
    case 'term':
      el=1;var ok=ex.accepted.some(function(rx){return rx.test(String(a.cmd||'').trim());});
      if(ok)corr=1;
      det.push({i:0,ok:ok,bad:!ok,miss:false,fix:null});
      break;
    case 'log':
      return validateInner(ex.inner,a,v);
    case 'branch':
      el=ex.steps.length;
      ex.steps.forEach(function(st,k){
        var p=a.picks[k];
        if(p===st.c){corr++;d(k,true,false,false);}
        else{d(k,false,true,false,st.opts[st.c]);}
      });
      break;
    case 'spot':
      el=ex.need.length;
      ex.cfg.forEach(function(_,k){
        var marked=a.marked.indexOf(k)>=0,needed=ex.need.indexOf(k)>=0;
        if(needed&&marked){corr++;d(k,true,false,false);}
        else if(needed&&!marked){d(k,false,false,true);}
        else if(!needed&&marked){d(k,false,true,false);}
      });
      break;
    case 'row':
      el=ex.rows.length;
      ex.rows.forEach(function(r,k){
        var p=a[k];
        if(p===r.c){corr++;d(k,true,false,false);}
        else{d(k,false,true,false,r.opts[r.c]);}
      });
      break;
  }
  return {det:det,corr:corr,el:el};
}
function validateInner(inner,a,v){
  var det=[],corr=0,el=0;
  if(inner.type==='multi'){
    el=inner.ans.length;
    inner.opts.forEach(function(_,k){
      var picked=a.indexOf(k)>=0,right=inner.ans.indexOf(k)>=0;
      if(right&&picked){corr++;det.push({i:k,ok:true});}
      else if(right&&!picked){det.push({i:k,miss:true});}
      else if(!right&&picked){det.push({i:k,bad:true});}
    });
  }else{
    el=1;var ok=a===inner.c;
    if(ok)corr=1;
    det.push({i:a,ok:ok,bad:!ok,fix:ok?null:inner.opts[inner.c]});
  }
  return {det:det,corr:corr,el:el};
}
function summarize(ex,ans){
  try{
    switch(ex.type){
      case 'qcm':return ans==null?'—':esc(ex.opts[ans]);
      case 'multi':return (!ans||!ans.length)?'—':ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(ex.opts[k]);}).join(' + ');
      case 'dd':return ex.items.map(function(it,k){var p=ans?ans.place[k]:null;return esc(it.t)+' &rarr; '+(p?esc(ex.buckets.filter(function(b){return b.id===p;})[0].label):'(not placed)');}).join(';<br>');
      case 'match':return ex.pairs.map(function(pr,k){var p=ans?ans.place[k]:null;return esc(pr.l)+' &rarr; '+(p!==undefined&&p!==null?esc(pr.r):'(no match)');}).join(';<br>');
      case 'order':return ans?ans.ord.map(function(ix){return esc(ex.items[ix].t);}).join(' &rarr; '):'—';
      case 'fill':return ans?ans.slots.map(function(w){return w?esc(w):'____';}).join(' / '):'—';
      case 'term':return ans&&ans.cmd?esc(String(ans.cmd).trim()):'—';
      case 'log':return summarizeInner(ex.inner,ans);
      case 'branch':return ans?ex.steps.map(function(st,k){return 'Step '+(k+1)+': '+esc(ans.picks[k]!=null?st.opts[ans.picks[k]]:'(no choice)');}).join(';<br>'):'—';
      case 'spot':return ans&&ans.marked.length?ans.marked.map(function(k){return 'line '+(k+1);}).join(', '):'—';
      case 'row':return ans?ex.rows.map(function(r,k){return 'Row '+(k+1)+': '+esc(ans[k]!=null?r.opts[ans[k]]:'(no choice)');}).join(';<br>'):'—';
    }
  }catch(e){return '—';}
  return '—';
}
function summarizeInner(inner,ans){
  if(inner.type==='multi'){return (!ans||!ans.length)?'—':ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(inner.opts[k]);}).join(' + ');}
  return ans==null?'—':esc(inner.opts[ans]);
}
function correctSummary(ex){
  switch(ex.type){
    case 'qcm':return esc(ex.opts[ex.c]);
    case 'multi':return ex.ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(ex.opts[k]);}).join(' + ');
    case 'dd':return ex.items.map(function(it){return esc(it.t)+' &rarr; '+esc(ex.buckets.filter(function(b){return b.id===it.b;})[0].label);}).join(';<br>');
    case 'match':return ex.pairs.map(function(pr){return esc(pr.l)+' &rarr; '+esc(pr.r);}).join(';<br>');
    case 'order':return ex.items.map(function(it){return esc(it.t);}).join(' &rarr; ');
    case 'fill':return ex.ans.map(esc).join(' / ');
    case 'term':return 'Any command matching the task, e.g. <code>'+esc(ex.example)+'</code>';
    case 'log':return ex.inner.type==='multi'?ex.inner.ans.slice().sort(function(x,y){return x-y;}).map(function(k){return esc(ex.inner.opts[k]);}).join(' + '):esc(ex.inner.opts[ex.inner.c]);
    case 'branch':return ex.steps.map(function(st,k){return 'Step '+(k+1)+': '+esc(st.opts[st.c]);}).join(';<br>');
    case 'spot':return 'line '+ex.need.map(function(k){return k+1;}).join(' and line ')+' ('+ex.need.map(function(k){return esc(ex.cfg[k]);}).join(' / ')+')';
    case 'row':return ex.rows.map(function(r,k){return 'Row '+(k+1)+': '+esc(r.opts[r.c]);}).join(';<br>');
  }

}

function exChrome(){

function chipEl(txt,cls,dr){var b=document.createElement('button');b.type='button';b.className='chip '+(cls||'');b.innerHTML=txt;b.draggable=!dr?true:!!dr;return b;}
function placeChip(lv,host,ex,kind,lock,det){
  /* shared by dd & match */
  var isDD=kind==='dd';
  var buckets=isDD?ex.buckets:ex.pairs.map(function(pr,k){return {id:String(k),label:pr.l};});
  var pool=document.createElement('div');pool.className='chips';
  var zones=document.createElement('div');
  function itemText(k){return esc(isDD?ex.items[k].t:ex.pairs[k].r);}
  function bucketLabel(id){return esc(buckets.filter(function(b){return String(b.id)===String(id);})[0].label);}
  function bucketLabelRaw(id){return buckets.filter(function(b){return String(b.id)===String(id);})[0].label;}
  var sel=lv.a.sel;
  buckets.forEach(function(b){
    var z=document.createElement('div');z.className='zone';z.setAttribute('role','button');z.tabIndex=0;
    z.setAttribute('aria-label','Bucket: '+bucketLabelRaw(b.id));
    z.innerHTML='<div class="zh">'+(isDD?bucketLabel(b.id):'&rarr; '+bucketLabel(b.id))+'</div>';
    function put(k){lv.a.place[k]=b.id;lv.a.sel=null;renderEx();}
    z.addEventListener('click',function(){if(lock)return;if(lv.a.sel!==null&&lv.a.sel!==undefined)put(lv.a.sel);});
    z.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!lock){e.preventDefault();if(lv.a.sel!==null&&lv.a.sel!==undefined)put(lv.a.sel);}});
    z.addEventListener('dragover',function(e){if(!lock)e.preventDefault();});
    z.addEventListener('drop',function(e){if(lock)return;e.preventDefault();var k=parseInt(e.dataTransfer.getData('text/plain'),10);if(!isNaN(k))put(k);});
    Object.keys(lv.a.place).forEach(function(kk){
      if(String(lv.a.place[kk])!==String(b.id))return;
      var k=parseInt(kk,10);
      var c=det?detFor(det,k):null;
      var cls=c?(c.ok?'mark-ok':(c.bad?'mark-bad':'')):(lv.a.sel===k?'sel':'');
      var ch=chipEl(itemText(k),cls,!lock);
      if(c)ch.insertAdjacentHTML('beforeend',c.ok?stSpan('ok','&#10003;'):(c.bad?stSpan('bad','&#10007; correct: '+c.fix):stSpan('miss','! belongs in: '+c.fix)));
      ch.addEventListener('click',function(){if(lock)return;delete lv.a.place[k];renderEx();});
      z.appendChild(ch);
    });
    zones.appendChild(z);
  });
  var poolOrder=(isDD?lv.view.items:lv.view.rchips);
  poolOrder.forEach(function(k){
    if(lv.a.place[k]!==undefined&&lv.a.place[k]!==null)return;
    var c=det?detFor(det,k):null;
    var cls=c?(c.ok?'mark-ok':'mark-miss'):(lv.a.sel===k?'sel':'');
    var ch=chipEl(itemText(k),cls,!lock);
    if(c)ch.insertAdjacentHTML('beforeend',c.ok?stSpan('ok','&#10003;'):stSpan('miss','! place in: '+c.fix));
    ch.addEventListener('click',function(){if(lock)return;lv.a.sel=(lv.a.sel===k?null:k);renderEx();});
    ch.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',String(k));});
    pool.appendChild(ch);
  });
  host.appendChild(pool);
  host.appendChild(zones);
}

/* ---------- actions ---------- */
function warn(msg){
  var fb=$('fbPanel');fb.classList.remove('hidden');
  fb.innerHTML='<b style="color:#fbbf24">&#9888; '+esc(msg)+'</b>';
}
function showFb(i,silent){
  var lk=S.lock[i];if(!lk)return;
  var ex=EXERCISES[i];
  var lab=lk.corr>=lk.el?'FULL':(lk.corr<=0?'ZERO':'PARTIAL');
  var col=lab==='FULL'?'#34d399':(lab==='ZERO'?'#f87171':'#fbbf24');
  var fb=$('fbPanel');fb.classList.remove('hidden');
  fb.innerHTML='<b style="color:'+col+'">'+(lab==='FULL'?'&#10003;':(lab==='ZERO'?'&#10007;':'&#177;'))+' You earned '+r2(lk.earned)+' of '+lk.el+' point'+(lk.el>1?'s':'')+' on this exercise ('+lab.toLowerCase()+')'+(S.hint[i]?' — includes hint penalty (−10%)':'')+'</b>';
  var xe=$('exExpl');xe.classList.remove('hidden');
  xe.innerHTML='<div class="eh">Explanation — why</div>'+ex.expl;
  drawNav();updScore();
}
function doCheck(){
  if(S.done)return;
  var i=curIdx(),ex=curEx(),lv=live(i);
  if(S.lock[i]){S.cp=true;updTimer();showFb(i);return;}
  if(!hasAns(ex,lv)){warn('Give an answer first — or press Skip if you want to come back later.');return;}
  if(ex.type==='branch'&&lv.a.max<ex.steps.length){warn('Finish every step of the path first.');return;}
  var v=validate(ex,lv);
  var mult=S.hint[i]?0.9:1;
  var earned=r2(r2(v.corr/v.el)*mult);
  S.lock[i]={det:v.det,corr:v.corr,el:v.el,earned:earned,a:cp(lv.a)};
  S.skp[i]=false;
  S.cp=true;
  renderEx();updTimer();drawNav();
}
function doSkip(){
  if(S.done)return;
  var i=curIdx();
  if(S.lock[i])return;
  S.skp[i]=true;
  if(S.cur<S.ord.length-1){S.cur++;renderEx();drawNav();}
  else openSubmit();
}
function doHint(){
  var i=curIdx();
  if(S.lock[i]||S.hint[i])return;
  S.hint[i]=true;
  var hb=$('hintBox');hb.classList.remove('hidden');
  hb.innerHTML='<b>Hint</b> <span class="small">(costs 10% of this exercise — a nudge, not the answer)</span><br>'+esc(curEx().hint);
  $('btnHint').disabled=true;
}
function doRevise(){
  var i=curIdx();
  if(!S.lock[i])return;
  delete S.lock[i];
  var ex=curEx(),lv=live(i);
  lv.a=initAns(ex,lv.view); /* clear the answer so the exercise can be redone (branch steps reopen) */
  renderEx();drawNav();
}
function doNext(){
  if(S.done)return;
  if(S.cp){S.cp=false;updTimer();}
  if(S.cur<S.ord.length-1){S.cur++;renderEx();drawNav();window.scrollTo(0,0);}
  else openSubmit();
}
function doPrev(){if(S.done)return;if(S.cur>0){S.cur--;renderEx();drawNav();}}
function doPause(){
  if(S.done)return;
  S.mp=!S.mp;
  $('btnPause').innerHTML=S.mp?'Resume':'Pause';
  $('btnPause').setAttribute('aria-pressed',S.mp?'true':'false');
  $('blurBox').classList.toggle('blurred',S.mp);
  $('pauseCover').textContent=S.cp&&S.mp?'Paused (manual) — content hidden. The review pause ends on Next.':'Paused (manual) — press Resume to continue';
  updTimer();
}
function modal(html,btns){
  var h=$('modalHost');
  h.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="modalbox">'+html+'<div class="mbtns" id="mb"></div></div></div>';
  var mb=$('mb');
  btns.forEach(function(b){
    var el=document.createElement('button');el.type='button';el.className='btn '+(b.p?'primary':'');
    el.textContent=b.t;
    el.addEventListener('click',function(){h.innerHTML='';if(b.f)b.f();});
    mb.appendChild(el);
  });
}
function openSubmit(){
  if(S.done)return;
  var n=EXERCISES.length,sk=0,ck=0,un=0;
  for(var i=0;i<n;i++){if(S.skp[i]&&!S.lock[i])sk++;else if(S.lock[i])ck++;else un++;}
  if(sk===n){
    modal('<h2>Nothing to score</h2><p>Every exercise is skipped. The exam needs at least one answered exercise to produce a score. Go back and answer at least one, then submit again.</p>',[{t:'Go back',p:true,f:function(){}}]);
    return;
  }
  modal('<h2>Submit exam?</h2><ul class="tight"><li>Checked: <b>'+ck+'</b></li><li>Unchecked (counts 0 points): <b>'+un+'</b></li><li>Skipped (excluded from score): <b>'+sk+'</b></li></ul><p>Your score is computed over the non-skipped exercises only.</p>',[
    {t:'Keep working',f:function(){}},
    {t:'Submit exam',p:true,f:function(){finish();}}
  ]);
}
/* ---------- results & reporting ---------- */
function reportScore(correct,total){
  var percent=Math.round((correct/total)*100);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EXAM.topicId,
      score:correct,
      total:total,
      percent:percent,
      passed:percent>=EXAM.passMark
    },location.origin);
  }catch(e){/* opened directly, nothing to report to */}
}
function finish(){
  if(S.done)return;
  S.done=true;S.run=false;
  $('modalHost').innerHTML='';
  var n=EXERCISES.length,skipped=[],answered=0,earned=0;
  for(var i=0;i<n;i++){
    if(S.skp[i]&&!S.lock[i])skipped.push(i);
    else{answered++;if(S.lock[i])earned+=S.lock[i].earned;}
  }
  var sc=Math.round(earned);
  var pct=Math.round(sc/answered*100);
  var passed=pct>=EXAM.passMark;
  var rh=$('resHead');
  rh.innerHTML='<div class="bigpct" style="color:'+(passed?'#34d399':'#f87171')+'">'+pct+'%</div>'+
    '<div class="passpanel '+(passed?'pass':'fail')+'"><div class="pt">'+(passed?'&#9989; PASS':'&#10060; FAIL')+'</div>'+
    '<p>'+(passed?'Well done — you reached the pass mark of '+EXAM.passMark+'%.':'You needed '+EXAM.passMark+'%. Review the report below and retake the exam.')+'</p></div>'+
    '<div class="resgrid">'+
    '<div class="meta"><div class="mv">'+r2(earned)+' / '+answered+'</div><div class="mk">points earned / exercises answered</div></div>'+
    '<div class="meta"><div class="mv">'+skipped.length+'</div><div class="mk">skipped (excluded from scoring)</div></div>'+
    '<div class="meta"><div class="mv">'+fmt(EXAM.seconds-S.t)+'</div><div class="mk">time used</div></div>'+
    '</div>'+
    '<p class="small">Score = earned points over non-skipped exercises only, partial credit included. Reported to the site as '+sc+'/'+answered+'.</p>';
  var rs=$('resSkipped');
  if(skipped.length){
    rs.innerHTML='<div class="blk"><span class="lbl">Skipped — not counted</span><p class="small">These exercises were skipped and are excluded from both the points earned and the points possible:</p><ul class="tight">'+skipped.map(function(i){var p=S.ord.indexOf(i);return '<li>#'+(p+1)+' — '+esc(EXERCISES[i].title)+'</li>';}).join('')+'</ul></div>';
  }else rs.innerHTML='';
  var rl=$('resList');rl.innerHTML='';
  S.ord.forEach(function(ix,p){
    var ex=EXERCISES[ix],lk=S.lock[ix],skp=S.skp[ix]&&!lk;
    var lab,max;
    if(skp){lab='skipped';max='—';}
    else if(!lk){lab='zero';max='1';}
    else{lab=lk.corr>=lk.el?'full':(lk.corr<=0?'zero':'partial');max=String(lk.el);}
    var labCol={full:'full',partial:'partial',zero:'zero',skipped:'skipped'}[lab];
    var d=document.createElement('details');d.className='rex';
    var sum=document.createElement('summary');
    sum.innerHTML='<span class="rlab '+labCol+'">'+lab.toUpperCase()+'</span><b>#'+(p+1)+' '+esc(ex.title)+'</b><span class="spacer"></span><span class="small">'+(skp?'not counted':(r2(lk?lk.earned:0)+' / '+max+' pts'))+'</span>';
    d.appendChild(sum);
    var body=document.createElement('div');body.className='rebody';
    body.innerHTML=
      '<div class="sec"><div class="k">YOUR ANSWER</div>'+(skp?'<i>You skipped this one — not counted in the score.</i>':(lk?summarize(ex,lk.a):'<i>Not checked — scored 0.</i>'))+'</div>'+
      (skp?'':'<div class="sec"><div class="k">CORRECT ANSWER</div>'+correctSummary(ex)+'</div>')+
      '<div class="sec"><div class="k">EXPLANATION'+(skp?' (what this tested)':'')+'</div>'+ex.expl+'</div>';
    d.appendChild(body);
    rl.appendChild(d);
  });
  $('scrExam').classList.add('hidden');
  $('scrResults').classList.remove('hidden');
  window.scrollTo(0,0);
  if(!S.reported&&answered>0){S.reported=true;reportScore(sc,answered);}
}
/* ---------- timer ---------- */
var tick=null;
function startTimer(){
  if(tick)clearInterval(tick);
  tick=setInterval(function(){
    if(!S||S.done||!S.run||S.mp||S.cp)return;
    S.t--;
    updTimer();
    if(S.t<=0){S.t=0;updTimer();finish();}
  },1000);
}
/* ---------- lifecycle ---------- */
function start(){
  S={ord:sh(EXERCISES.map(function(_,k){return k;})),cur:0,live:{},lock:{},skp:{},hint:{},t:EXAM.seconds,mp:false,cp:false,run:true,done:false,reported:false};
  $('scrIntro').classList.add('hidden');
  $('scrResults').classList.add('hidden');
  $('scrExam').classList.remove('hidden');
  $('btnPause').innerHTML='Pause';$('btnPause').setAttribute('aria-pressed','false');
  $('blurBox').classList.remove('blurred');
  updTimer();updScore();drawNav();
  renderEx();
  startTimer();
}
function buildIntro(){
  $('introTitle').textContent=EXAM.cert+' — '+EXAM.chapterName+' — practice exam';
  var sb=$('sevBadge');sb.textContent=EXAM.severity+' severity';sb.className='sevbadge sev-'+EXAM.difficulty;
  $('introSub').textContent='Objective 2.3 — wireless devices: channels, frequencies, SSID, network types, encryption, guest networks, authentication, antennas and access points.';
  var mg=$('metaGrid');
  [['30','exercises'],['1 point','per exercise'],[EXAM.estMin+' min','timer'],[EXAM.passMark+'%','pass mark'],['-10%','hint cost']].forEach(function(p){
    var d=document.createElement('div');d.className='meta';d.innerHTML='<div class="mv">'+p[0]+'</div><div class="mk">'+p[1]+'</div>';mg.appendChild(d);
  });
  $('introRules').innerHTML=[
    '<b>'+EXAM.severity+' severity.</b> Every exercise needs real reasoning with realistic artifacts (logs, configs, tickets).',
    'Every exercise has a clearly separated <b>SCENARIO</b>, <b>QUESTION</b> and <b>ANSWER</b> area.',
    '<b>Check</b> validates and locks your answer, shows per-element feedback and the explanation, and <b>pauses the timer in review mode</b>. The pause ends only when you press <b>Next</b>.',
    '<b>Manual Pause</b> (top bar) freezes the timer but hides the content, so it cannot be abused. The two pauses can stack.',
    '<b>Skip</b> moves on and marks the exercise amber. You can return to skipped exercises any time before the timer ends. Skipped exercises are <b>excluded from the score</b> (numerator and denominator).',
    '<b>Multi-answer exercises</b> give partial credit per correct element. Wrong extra picks never subtract points.',
    '<b>Hint</b> costs 10% of that exercise and gives a nudge, never the answer.',
    'Pass mark: '+EXAM.passMark+'%. You may revise any checked answer while time remains. Retake reshuffles everything.'
  ].map(function(s){return '<li>'+s+'</li>';}).join('');
  var kb=$('kwBody');kb.innerHTML='';
  THEMES.forEach(function(t){
    var d=document.createElement('div');d.className='theme';
    d.innerHTML='<div class="tn">'+esc(t.name)+'</div><div class="kws">'+t.kw.map(function(k){return '<span class="kw">'+esc(k)+'</span>';}).join('')+'</div>';
    kb.appendChild(d);
  });
}
function boot(){
  buildIntro();
  $('btnStart').addEventListener('click',start);
  $('btnCheck').addEventListener('click',doCheck);
  $('btnSkip').addEventListener('click',doSkip);
  $('btnHint').addEventListener('click',doHint);
  $('btnRevise').addEventListener('click',doRevise);
  $('btnNext').addEventListener('click',doNext);
  $('btnPrev').addEventListener('click',doPrev);
  $('btnPause').addEventListener('click',doPause);
  $('btnSubmit').addEventListener('click',openSubmit);
  $('btnRetake').addEventListener('click',function(){start();window.scrollTo(0,0);});
  window.addEventListener('message',function(e){
    if(!e.data)return;
    if(e.data.type!=='CYBERPULSE_INIT'&&e.data.type!=='CYBERMASTERY_INIT')return;
    var g=$('greet');
    if(e.data.username)g.textContent='Signed in as '+e.data.username+(e.data.country&&e.data.country!=='ZZ'?' ('+e.data.country+')':'');
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
/* test hooks (harmless in production) */
window.__exam={EXAM:function(){return EXAM;},EXERCISES:function(){return EXERCISES;},THEMES:function(){return THEMES;},S:function(){return S;},finish:function(){finish();},openSubmit:function(){openSubmit();},start:function(){start();}};
})();
</script>
</body>
</html>
