<script>
/* ===== Network+ N10-009 — Chapter 1.4 Ports & Protocols — HARD exam data ===== */
var KW = [
  { theme: "The 13 protocols", kws: ["FTP", "SFTP", "SSH", "Telnet", "SMTP", "DNS", "DHCP", "HTTP", "HTTPS", "SNMP", "LDAP", "RDP", "SIP"] },
  { theme: "Transport methods", kws: ["TCP", "UDP", "connection-oriented", "connectionless", "three-way handshake (SYN / SYN-ACK / ACK)"] },
  { theme: "Port concepts", kws: ["well-known ports 0-1023", "registered ports 1024-49151", "dynamic / ephemeral ports 49152-65535", "default port numbers", "source port vs destination port"] },
  { theme: "Secure vs cleartext", kws: ["SFTP over FTP", "SSH over Telnet", "HTTPS over HTTP", "LDAPS 636 over LDAP 389", "SNMPv3 over v1/v2c", "SIP over TLS 5061", "community strings", "TLS encryption"] },
  { theme: "Protocol behaviour", kws: ["FTP control 21 / data 20", "FTP active vs passive", "DHCP DORA", "DNS zone transfer (AXFR)", "SNMP traps 162", "SMTP relay & submission 587", "RTP voice media", "RDP NLA", "netstat / ss", "dig / nslookup"] }
];

var EX = [
{
  id: "H01", theme: "Ops & troubleshooting", type: "log",
  title: "Night-shift NetFlow: two sessions deserve escalation",
  kw: ["DNS", "UDP 53", "TCP 53", "AXFR", "exfiltration", "TXT records"],
  scenario: "<p>02:00-04:00, you hold the pager. The flow summary for the data-centre DNS pair (10[.]7[.]0[.]53) shows the extract below. The monitoring host is mon01 (10[.]7[.]0[.]99) and printer01 is a known device. Everything else in the log is unremarkable.</p>",
  question: "<p>Filter the log as needed, then select the <b>two</b> sessions that need escalation.</p>",
  data: {
    lines: [
      { t: "03:11:02", m: "QUERY UDP 10[.]7[.]2[.]31:51001 -> 10[.]7[.]0[.]53:53  name: a1.exfil[.]example TXT  (112 bytes)" },
      { t: "03:11:03", m: "QUERY UDP 10[.]7[.]2[.]31:51002 -> 10[.]7[.]0[.]53:53  name: b2.exfil[.]example TXT  (119 bytes)" },
      { t: "03:11:05", m: "QUERY UDP 10[.]7[.]2[.]31:51003 -> 10[.]7[.]0[.]53:53  name: c3.exfil[.]example TXT  (117 bytes)" },
      { t: "03:12:44", m: "QUERY UDP 10[.]7[.]2[.]8:52444 -> 10[.]7[.]0[.]53:53  name: printer01.corp[.]example A  (32 bytes)" },
      { t: "03:20:11", m: "QUERY UDP 10[.]7[.]2[.]31:51004 -> 10[.]7[.]0[.]53:53  name: d4.exfil[.]example TXT  (121 bytes)" },
      { t: "03:22:02", m: "QUERY UDP 10[.]7[.]2[.]9:51110 -> 10[.]7[.]0[.]53:53  name: time.sync[.]example A  (31 bytes)" },
      { t: "03:40:19", m: "AXFR IN TCP 10[.]7[.]0[.]99:49188 -> 10[.]7[.]0[.]53:53  zone: corp[.]example  (transfer started)" },
      { t: "03:41:02", m: "QUERY UDP 10[.]7[.]2[.]31:51005 -> 10[.]7[.]0[.]53:53  name: e5.exfil[.]example TXT  (114 bytes)" }
    ],
    sub: {
      type: "multi",
      choices: [
        "The repeating TXT queries to exfil[.]example from 10[.]7[.]2[.]31 &mdash; encoded payloads leaving through DNS",
        "The TCP 53 AXFR of zone corp[.]example from mon01 &mdash; mon01 is not a DNS server, so this is a zone steal attempt",
        "printer01's A record lookup",
        "The time.sync[.]example A lookups"
      ],
      correct: [0, 1]
    }
  },
  hint: "Normal lookups are small and use real hostnames. Compare the query names, the record types, and who asks for a zone transfer.",
  explain: "<p><b>Escalate both:</b> the TXT queries to a never-seen domain carry 112-121 bytes of data each in the <i>question</i> &mdash; the classic DNS exfiltration shape: chunked data smuggled out over UDP 53 to a domain the attacker owns. And mon01 requesting AXFR over TCP 53 is a zone transfer attempt from a non-DNS host: a full zone hands an attacker every internal hostname. printer01 and NTP-style lookups are normal noise.</p><div class='note'><b>If you missed this:</b> port 53 tells you the protocol, but the pattern (record type, size, name entropy, who asks) tells you the intent. Block the domain, isolate the client, and investigate mon01 separately.</div>"
},
{
  id: "H02", theme: "Secure alternatives", type: "spot",
  title: "The Telnet ban that isn't a ban",
  kw: ["Telnet", "TCP 23", "non-standard ports", "firewall policy", "SSH"],
  scenario: "<p>Policy IT-7 says: <i>no Telnet anywhere</i>. fw01 got rule 10 to prove it. Yet the compliance scan still flags a working cleartext terminal session to a server in the app subnet. You review the full rule base below.</p>",
  question: "<p>Click the one rule that defeats the Telnet ban.</p>",
  data: {
    lines: [
      "rule 10: DENY tcp any any eq 23      // policy IT-7: no Telnet",
      "rule 20: PERMIT tcp 10[.]9[.]0[.]0/16 any eq 22   // SSH admin",
      "rule 30: PERMIT tcp any 10[.]9[.]1[.]50 eq 443    // portal",
      "rule 40: PERMIT tcp any 10[.]9[.]1[.]60 eq 80     // legacy intranet",
      "rule 50: PERMIT tcp any 10[.]9[.]1[.]70 eq 2323   // legacy admin tool",
      "rule 60: DENY ip any any log"
    ],
    bad: 4
  },
  hint: "The ban targets a protocol, but the rule enforces it against one port number. What else can carry the same protocol?",
  explain: "<p><b>Rule 50 is the hole.</b> Telnet is a protocol, not a port &mdash; a server can listen on any port, and 2323 is a common 'hidden' Telnet port. Rule 10 blocks only TCP 23, so the legacy tool on 2323 restores the exact cleartext path IT-7 bans, while making admins believe they are protected. The fix: find the service (banner grab will say 'Telnet'), retire it, and block by protocol identification where the platform supports it.</p><div class='note'><b>If you missed this:</b> port-based bans are one-to-many. For every 'block X' policy, ask 'on which ports could X still run?'</div>"
},
{
  id: "H03", theme: "Ops & troubleshooting", type: "order",
  title: "Order the open-relay response",
  kw: ["SMTP", "TCP 25", "open relay", "mail queue", "blocklist", "incident response"],
  scenario: "<p>mail04 was found relaying spam on TCP 25 for the last six hours (a bad config push). Blocklist alerts are arriving. As incident lead, you must sequence the response so each step actually helps the next.</p>",
  question: "<p>Put the four response steps in the correct order.</p>",
  data: {
    items: [
      "Close the relay: correct the trusted-sender list / require auth on TCP 25",
      "Drain the outbound queue and stop the spam still leaving",
      "Pull the mail logs to scope what was sent and to whom",
      "Start delisting and monitor bounces and reputation"
    ]
  },
  hint: "You cannot investigate usefully while the wound is open, and reputation repair only means something once sending stops.",
  explain: "<p><b>The order:</b> contain first (close the relay &mdash; otherwise every later step happens on a moving target), then stop the bleeding (drain the queue so the attack output ends), then scope (log analysis tells you what was sent, from where, to whom &mdash; evidence for the report and for blocklist appeals), and finally recover reputation (delisting requests succeed only after the abuse stopped, and bounce monitoring confirms it).</p><div class='note'><b>If you missed this:</b> incident response for any protocol abuse follows contain &rarr; stop &rarr; scope &rarr; recover. Jumping to delisting while still relaying wastes the appeals.</div>"
},
{
  id: "H04", theme: "Transport & ports", type: "multi",
  title: "Which services genuinely use both TCP and UDP?",
  kw: ["DNS", "RDP", "SIP", "DHCP", "SFTP", "SNMP", "TCP", "UDP"],
  scenario: "<p>You are hardening a host-based firewall. For services that use <b>both</b> transports you need two rules; for single-transport services, one. The tooling flags wrong assumptions as incidents, so precision matters.</p>",
  question: "<p>Select every statement that is true. There are 3.</p>",
  data: {
    choices: [
      "DNS: queries ride UDP 53, while zone transfers and oversized answers ride TCP 53",
      "RDP: the session is TCP 3389, and modern clients add UDP 3389 for smoother graphics",
      "SIP: signaling can use UDP or TCP 5060 (and TLS uses TCP 5061)",
      "DHCP: servers listen on both TCP 67 and UDP 68",
      "SFTP: data flows over TCP 22 and checksums over UDP 22 in parallel",
      "SNMPv3: polls arrive on TCP 161 and traps leave on UDP 161"
    ],
    correct: [0, 1, 2]
  },
  hint: "Three statements invent a TCP side where the service is UDP-only, or shift ports between roles.",
  explain: "<p><b>True:</b> DNS uses both (UDP 53 queries / TCP 53 transfers and big answers). RDP uses both 3389 (TCP session + UDP for modern remote graphics). SIP signaling may ride UDP or TCP 5060, with TLS on TCP 5061.</p><p><b>False:</b> DHCP is UDP-only (67 server, 68 client). SFTP is TCP 22 only &mdash; SSH provides reliability already. SNMP is UDP-only, and traps go to 162, not 161: polls hit the agent on 161, traps arrive at the manager on 162.</p><div class='note'><b>If you missed this:</b> 'both transports' for this objective means DNS, RDP and SIP &mdash; everything else listed is UDP-only or TCP-only, and the 161/162 split is a favourite trap.</div>"
},
{
  id: "H05", theme: "Ops & troubleshooting", type: "term",
  title: "Terminal: identify the listener on the LDAP port",
  kw: ["LDAP", "TCP 389", "ss", "netstat", "lsof", "listening ports"],
  scenario: "<p>On Linux host ldap01, the vulnerability scanner flagged 'unexpected service on TCP 389'. You have a root shell. The ticket says: <i>record which local process listens on the LDAP port</i>. No tool is prescribed &mdash; choose your own and justify it by the output.</p>",
  question: "<p>Type a command that shows listening TCP sockets <b>with the owning process</b>, run it, then press Check. (Any of the standard tools is accepted.)</p>",
  data: {
    cap: "ldap01 &mdash; simulated Linux root shell",
    prompt: "ldap01#",
    pre: "Goal: list listening TCP sockets with process names. Choose your tool freely.",
    accept: ["ss\\s+-(?=[a-z]*t)(?=[a-z]*l)(?=[a-z]*p)[a-z]+", "netstat\\s+-(?=[a-z]*t)(?=[a-z]*l)(?=[a-z]*p)[a-z]+", "lsof\\s+(?:\\S+\\s+)*-i", "fuser\\s+(?:-n\\s+tcp\\s+389|389/tcp)"],
    out: [
      "State   Recv-Q  Send-Q  Local Address:Port   Peer Address:Port  Process",
      "LISTEN  0       64      0[.]0[.]0[.]0:389    0[.]0[.]0[.]0:*    slamd (pid 2207)",
      "LISTEN  0       64      0[.]0[.]0[.]0:636    0[.]0[.]0[.]0:*    slamd (pid 2207)",
      "LISTEN  0       128     0[.]0[.]0[.]0:22     0[.]0[.]0[.]0:*    sshd (pid 902)"
    ],
    example: "ss -tlnp   (or: lsof -i :389, or: netstat -tlnp)"
  },
  hint: "You need: TCP sockets, only listeners, numeric ports if available, and the process name. The common Linux tools each have a flag combination for exactly that.",
  explain: "<p><b>Accepted answers:</b> <code>ss -tlnp</code> (TCP, listening, numeric, process), <code>netstat -tlnp</code>, <code>lsof -i :389</code>, <code>fuser 389/tcp</code> &mdash; all answer 'which process owns the LDAP port'. The output shows slamd (pid 2207) listening on 389 and on 636 &mdash; that is the LDAP service and its TLS twin LDAPS, so the scanner's flag is the directory service itself, expected on this host. Note the discipline: in the HARD tier you chose the tool and the flags yourself.</p><div class='note'><b>If you missed this:</b> memorize one Linux listener command deeply (ss -tlnp is the modern one): t = tcp, l = listening, n = numeric, p = process.</div>"
},
{
  id: "H06", theme: "Secure alternatives", type: "flow",
  title: "Branching: 'public' everywhere &mdash; the SNMP exposure",
  kw: ["SNMP", "SNMPv2c", "SNMPv3", "community strings", "UDP 161", "UDP 162", "ACL"],
  scenario: "<p>An internal audit finds community string <b>public</b> (read-only, SNMPv2c) on roughly 40 devices across three VLANs. The devices answer polls on UDP 161 and send traps to the collector on UDP 162. Management wants a plan today.</p>",
  question: "<p>Choose the best answer at every stage.</p>",
  data: {
    steps: [
      { q: "First move?",
        choices: [
          { t: "Scan the three VLANs for everything answering on UDP 161 and size the exposure", good: true, note: "You cannot plan a migration for an unknown population; 161 answers map the blast radius." },
          { t: "Change the string on the core router only", good: false, note: "One device out of 40 fixes nothing and gives the plan no scope." },
          { t: "Email all teams asking them to check their own devices", good: false, note: "Awareness without control leaves the cleartext protocol everywhere." }
        ] },
      { q: "Containment while the v3 migration is scheduled?",
        choices: [
          { t: "ACL UDP 161/162 so only the monitoring subnets reach the agents, and rotate the strings", good: true, note: "Shrinks who can talk SNMP and retires the default string immediately." },
          { t: "Rename the community from public to private", good: false, note: "'private' is the classic default for write access &mdash; you may have just widened the door." },
          { t: "Block SNMP everywhere including the collector", good: false, note: "You lose all monitoring and create pressure to reopen holes informally." }
        ] },
      { q: "The durable fix, and why?",
        choices: [
          { t: "Migrate to SNMPv3 with auth+priv: usernames, authentication and encryption replace communities", good: true, note: "v3 authenticates and encrypts; the cleartext community model disappears." },
          { t: "Keep v2c but filter 161 at the internet edge", good: false, note: "Insiders on the LAN can still sniff communities; the edge is not the only boundary." },
          { t: "Move the agents to UDP 1611 so scanners miss them", good: false, note: "Agents and managers must agree on ports; hiding breaks monitoring and stops nothing." }
        ] }
    ]
  },
  hint: "Sequence matters: size it, shrink it, then replace the protocol model &mdash; not just the password.",
  explain: "<p><b>The mature path:</b> scope (161 sweep &rarr; exact device list), contain (ACL 161/162 to monitoring hosts + rotate strings &mdash; cheap, reversible), fix (SNMPv3 authPriv kills cleartext communities with authentication and encryption). Renaming to 'private' is worse than useless: it is the canonical write string. Port games (1611) break the manager-agent contract and add zero security.</p><div class='note'><b>If you missed this:</b> v2c communities are passwords sent on every packet, unencrypted. Only v3 changes that &mdash; everything else is damage control.</div>"
},
{
  id: "H07", theme: "Ops & troubleshooting", type: "match",
  title: "Evidence board: name the protocol behind each artefact",
  kw: ["SNMP", "SMTP", "SIP", "RDP", "FTP", "LDAP", "community strings", "UDP 161", "TCP 25", "TCP 21", "TCP 389", "TCP 3389"],

  },

{

  title: "Flow triage: benign or escalate?",

  question: "<p>Sort every flow into the correct bucket.</p>",
  data: {

      { t: "Inbound TCP 3389 from the internet to an HR laptop", b: 1 },
      { t: "Outbound UDP 162 from 60 servers to collector mon01", b: 0 },
      { t: "Outbound TCP 5061 to the SIP trunk provider", b: 0 },
      { t: "Inbound TCP 23 from the internet to any host", b: 1 },
      { t: "Workstation 49512 -> TCP 443 to the corporate proxy", b: 0 },

{
  id: "H09", theme: "Protocol behaviour", type: "mcq",
  title: "FTP survives despite TCP 20 being blocked",
  kw: ["FTP", "active mode", "passive mode", "TCP 20", "TCP 21", "ephemeral ports"],
  scenario: "<p>fw01 blocks all inbound TCP 20. The file-transfer team reports FTP transfers still work to ftp05, and the control sessions on TCP 21 are visible in the log. The firewall team is confused about the directions.</p>",
  question: "<p>Why do the transfers still succeed?</p>",
  data: {
    choices: [
      "FTP silently falls back to UDP data channels when TCP 20 fails",
      "Passive mode: the server opens a high data port and the client connects out",
      "The control channel on 21 carries the file bytes after the login",
      "The firewall auto-forwards blocked ports once a session is established"
    ],
    correct: [1]
  },
  hint: "The blocked direction is 'inbound to 20'. Which mode avoids that direction entirely?",
  explain: "<p><b>Correct: passive mode.</b> In active FTP the server dials back from TCP 20 to the client &mdash; blocking inbound 20 kills it. In <b>passive</b> mode the server opens an extra listener on a high port (49152-65535) for each transfer and the client connects <i>out</i> to it; the control channel on 21 only carries the command ('connect to port 52123'). So inbound 20 is never needed. FTP does not use UDP, and the control channel does not carry bulk data.</p><div class='note'><b>If you missed this:</b> passive FTP trades the port-20 problem for a range problem: firewalls must allow a high-port range, which is why passive ranges must be pinned and documented.</div>"
},
{
  id: "H10", theme: "Secure alternatives", type: "blank",
  title: "Fill the hardening runbook with the right ports",
  kw: ["Telnet", "SSH", "LDAPS", "LDAP", "RDP", "TCP 23", "TCP 22", "TCP 636", "TCP 389", "TCP 3389"],
  scenario: "<p>The infrastructure runbook 'External exposure &mdash; baseline' is being rewritten after the audit. The template kept the service names but lost the port numbers. One wrong number here becomes a wrong firewall rule next week.</p>",

  data: {
    text: "Runbook baseline: disable Telnet on TCP [[0]]. Standardize admin access on SSH, TCP [[1]]. Publish directory services only via LDAPS on TCP [[2]] &mdash; never plain LDAP on 389 to untrusted networks. Expose RDP TCP [[3]] only through the VPN, never directly.",

  explain: "<p><b>23</b> Telnet (to disable &mdash; cleartext console). <b>22</b> SSH (the encrypted replacement). <b>636</b> LDAPS (directory over TLS; plain 389 stays internal only). <b>3389</b> RDP (VPN-gated; exposed 3389 is the most brute-forced port on the internet). The runbook names a port next to each service so firewall rules can be written without guesswork.</p><div class='note'><b>If you missed this:</b> the secure-variant ports pair up: 389/636 for directory, 5060/5061 for SIP, 80/443 for web &mdash; but console access is 23 to 22, not a +600 jump.</div>"
},
{
  id: "H11", theme: "Secure alternatives", type: "log",
  title: "The login page that never left port 80",
  kw: ["HTTP", "HTTPS", "TCP 80", "TCP 443", "TLS", "session cookie", "redirect"],
  scenario: "<p>app01 serves both 80 and 443. The web team insists 'TLS works &mdash; see, 443 answers'. You pull the access log around a test login. There is no redirect rule and no HSTS on this app.</p>",

      { t: "11:02:14", m: "GET /dashboard HTTP/1.1 200 (80) cookie: sid=0f3a...; HttpOnly" },

    ],

      type: "mcq",

{
  id: "H12", theme: "Protocol behaviour", type: "spot",
  title: "The DHCP scope that half-broke the floor",
  kw: ["DHCP", "DNS", "option 6", "domain-name-servers", "UDP 67"],
  scenario: "<p>VLAN 30 clients got new leases yesterday and internal names stopped resolving; internet sites still work. dhcp01's scope config is below. Clients point their resolvers exactly where DHCP told them.</p>",
  question: "<p>Click the one line that explains the symptom.</p>",
  data: {
    lines: [
      "subnet 10[.]12[.]30[.]0 netmask 255[.]255[.]255[.]0 {",
      "  range 10[.]12[.]30[.]100 10[.]12[.]30[.]200;",
      "  option routers 10[.]12[.]30[.]1;",
      "  option domain-name-servers 198[.]51[.]100[.]53;",
      "  default-lease-time 14400;",
      "  authoritative;",
      "}"
    ],
    bad: 3
  },
  hint: "DHCP hands out more than addresses. One option tells clients where to send name queries.",
  explain: "<p><b><code>option domain-name-servers 198[.]51[.]100[.]53</code> is the fault.</b> DHCP option 6 distributes the DNS resolver list. This scope points clients at an external resolver instead of the internal pair (10[.]12[.]30[.]53). External names resolve (the external server answers), but internal-only names fail &mdash; exactly the symptom. DHCP itself (UDP 67/68) works fine; the DORA exchange succeeded, it just delivered a bad option.</p><div class='note'><b>If you missed this:</b> when 'internet works, internal names don't', check which resolver DHCP handed out before touching the DNS server. The fault is often in the delivery, not the service.</div>"
},
{
  id: "H13", theme: "Protocol behaviour", type: "flow",
  title: "Branching: two servers answer the same Discover",
  kw: ["DHCP", "DORA", "rogue DHCP", "DHCPOFFER", "UDP 67", "DHCP snooping"],
  scenario: "<p>VLAN 20 users report broken name resolution and odd gateways. A capture shows <b>two different MACs</b> answering DHCPOFFER on UDP 67. You are the responder, and the floor is still working &mdash; barely.</p>",
  question: "<p>Choose the best answer at every stage.</p>",
  data: {
    steps: [
      { q: "Two MACs send DHCPOFFER. First move?",
        choices: [
          { t: "Compare both OFFER sources against the approved DHCP server list and the switch port table", good: true, note: "Identify which offer is legitimate before touching anything &mdash; killing the wrong one extends the outage." },
          { t: "Force every client to renew at once", good: false, note: "Renewal may just hand clients another rogue offer faster." },
          { t: "Reboot the core switch", good: false, note: "That drops the whole floor and destroys the evidence you are collecting." }
        ] },
      { q: "One OFFER comes from an unknown MAC learned on port 22 of sw12, offering a different gateway. What is it?",
        choices: [
          { t: "A rogue DHCP server: a device answering on UDP 67 without approval", good: true, note: "Any host can run a DHCP server; only approved ones may answer. The odd gateway is the give-away." },
          { t: "A documented failover peer &mdash; someone will file the paperwork later", good: false, note: "Failover peers are designed, documented and monitored. Verify, never assume." },
          { t: "Normal UDP 68 client chatter", good: false, note: "Clients listen on 68; they never offer addresses on 67." }
        ] },
      { q: "Fix and prevention, in one move each?",
        choices: [
          { t: "Shut the rogue port, then enable DHCP snooping with only the dhcp01 uplinks trusted for OFFERs", good: true, note: "Removes the device and blocks the whole class of attack at the access layer." },
          { t: "Change the scope range and restart dhcp01", good: false, note: "The rogue keeps answering; the range was never the problem." },
          { t: "Set static IPs on every client in the VLAN", good: false, note: "It does not stop the rogue and destroys DHCP's benefit on a busy floor." }
        ] }
    ]
  },
  hint: "The protocol is behaving exactly as designed &mdash; it is the device set that is wrong. Verify, contain, then close the class of attack.",
  explain: "<p><b>The path:</b> verify (approved list + port table &rarr; the unknown MAC is rogue), contain (shut port 22 of sw12), prevent (DHCP snooping: access ports may only send client traffic on 68; OFFERs on 67 are trusted only on uplinks to dhcp01). DORA itself is unauthenticated by design &mdash; anyone can offer &mdash; so the control lives in the switch, not the protocol.</p><div class='note'><b>If you missed this:</b> a rogue DHCP server can hand out a rogue gateway or resolver and own the floor's traffic without touching a single packet afterwards. Snooping is the standard answer.</div>"
},
{

{
  id: "H15", theme: "Secure alternatives", type: "multi",
  title: "Which hardening ideas are safe and actually help?",
  kw: ["LDAPS", "SNMPv3", "SSH", "Telnet", "DNS", "UDP 53", "RDP", "SFTP", "TCP 636", "TCP 22"],
  scenario: "<p>Change board day. Five hardening proposals reached the agenda; some were written by people who do not run the services. You must separate real improvements from breakage and theatre.</p>",
  question: "<p>Select every change that is <b>safe and improves security</b>. There are 3.</p>",
  data: {
    choices: [
      "Publish LDAPS on TCP 636 and retire plain LDAP 389 for untrusted-network queries",
      "Upgrade SNMP to v3 with auth+priv on all monitored devices",
      "Replace Telnet with SSH on TCP 22 for every managed device",
      "Block all UDP 53 to force DNS over TCP",
      "Move SSH from port 22 to port 23 so scanners miss it",
      "Allow RDP 3389 from any source so support stops complaining"
    ],
    correct: [0, 1, 2]
  },
  hint: "One proposal breaks a service, one adds obscurity instead of security, one removes a control.",
  explain: "<p><b>Approve:</b> LDAPS on 636 (TLS for directory queries), SNMPv3 authPriv (encryption + authentication replace cleartext communities), SSH over Telnet (encrypted console on 22).</p><p><b>Reject:</b> blocking all UDP 53 breaks normal lookups &mdash; UDP is DNS's normal transport; TCP 53 is for transfers and big answers. Moving SSH to 23 breaks tooling defaults and only hides from lazy scanners &mdash; and 23 is Telnet's port, inviting confusion. RDP from any source widens the most-brute-forced service on the internet.</p><div class='note'><b>If you missed this:</b> test each proposal against two questions: does it break a legitimate use? does it add encryption/authentication, or just move ports?</div>"
},
{
  id: "H16", theme: "Protocol behaviour", type: "match",
  title: "Nuance pairs: the ports exams always swap",
  kw: ["FTP", "DHCP", "SNMP", "SMTP", "SIP", "TCP 20", "TCP 21", "UDP 67", "UDP 68", "UDP 161", "UDP 162", "TCP 587", "TCP 5061"],
  scenario: "<p>The certification study group asks you to write the definitive 'do not mix these up' card. Each pair below differs by role, not by protocol family.</p>",
  question: "<p>Match every role to its port.</p>",
  data: {
    left: ["FTP data channel (active mode)", "FTP control channel", "DHCP server listens on", "DHCP client sends from", "SNMP agent answers polls on", "SNMP manager receives traps on", "User devices submit mail to", "SIP over TLS listens on"],
    right: ["TCP 20", "TCP 21", "UDP 67", "UDP 68", "UDP 161", "UDP 162", "TCP 587", "TCP 5061"]
  },
  hint: "Control beats data (21 over 20). Servers listen lower than clients speak (67 vs 68). Traps go where the manager waits (162).",
  explain: "<p><b>The nuances:</b> FTP splits control (21) from data (20 in active; negotiated high port in passive). DHCP server listens on 67, clients send from 68 &mdash; swap them and your rule matches nothing. SNMP agents answer on 161, but traps arrive at the manager on 162 &mdash; two different listeners. 587 is mail <i>submission</i> from user devices, distinct from server-to-server relay on 25. 5061 is SIP wrapped in TLS, vs cleartext 5060.</p><div class='note'><b>If you missed this:</b> these five pairs &mdash; 20/21, 67/68, 161/162, 25/587, 5060/5061 &mdash; are the most-swapped ports in this objective. Drill them as pairs, never alone.</div>"
},
{
  id: "H17", theme: "Protocol behaviour", type: "flow",
  title: "Branching: the PBX upgrade that broke the trunk",
  kw: ["SIP", "TCP 5060", "TCP 5061", "TLS", "certificates", "RTP", "ephemeral ports"],
  scenario: "<p>Weekend PBX upgrade done. Phones register fine, but every outside call fails. The trunk log reads: <code>TCP 5061 connect, TLS alert: unknown_ca</code>. The provider requires SIP over TLS; cleartext 5060 was decommissioned on their side years ago.</p>",
  question: "<p>Choose the best answer at every stage.</p>",
  data: {
    steps: [
      { q: "First check?",
        choices: [
          { t: "The trunk certificate chain on pbx01 &mdash; what did the upgrade change?", good: true, note: "unknown_ca means the provider rejected our chain: wrong cert, missing intermediate, or expired." },
          { t: "Whether port 5060 is open at the edge", good: false, note: "5061 is the agreed TLS path; opening cleartext 5060 is not a fix the provider would accept." },
          { t: "The RTP port range on the phones", good: false, note: "Media comes after signaling. The calls never set up, so RTP is not yet involved." }
        ] },
      { q: "The upgrade replaced the certificate and dropped the intermediate CA. Fix?",
        choices: [
          { t: "Install the full renewed chain on pbx01 and keep TLS on 5061", good: true, note: "Restores trust without dropping encryption &mdash; the provider's requirement stands." },
          { t: "Fall back to cleartext 5060 permanently", good: false, note: "Signaling would cross the internet readable: numbers, endpoints, credentials." },
          { t: "Switch the trunk to UDP 5060 without TLS", good: false, note: "Same cleartext problem, different transport &mdash; and the provider rejects it." }
        ] },
      { q: "After the chain fix, calls connect but audio is one-way. Where now?",
        choices: [
          { t: "Media rides RTP on UDP high ports &mdash; check the media ACL between the sites", good: true, note: "Signaling and media are separate paths; the ACL must carry the negotiated RTP range." },
          { t: "Renew the certificate again", good: false, note: "Signaling works; a new cert changes nothing about media." },
          { t: "Move SIP back to 5060", good: false, note: "Changing signaling ports cannot open media ports." }
        ] }
    ]
  },
  hint: "Two layers hide here: signaling (SIP over TLS on 5061) and media (RTP on UDP high ports). Troubleshoot them in that order.",
  explain: "<p><b>The path:</b> signaling first &mdash; TLS alert unknown_ca on 5061 is a certificate chain defect, fixed by installing the full renewed chain. Falling back to 5060 gives up encryption the provider (and policy) demands. Then media: SIP only tells the endpoints which UDP high ports (RTP) to use; one-way audio after signaling works is a media-path ACL problem. Signaling and media fail independently &mdash; that is the lesson.</p><div class='note'><b>If you missed this:</b> for VoIP, diagnose in call order: registration (5060/5061) &rarr; setup (TLS) &rarr; media (RTP range). Each layer has its own ports and its own failures.</div>"
},
{
  id: "H18", theme: "Ops & troubleshooting", type: "log",
  title: "RDP under fire: read the log, pick the actions",
  kw: ["RDP", "TCP 3389", "NLA", "brute force", "three-way handshake", "Event 4625"],
  scenario: "<p>09:00. rds-gw (10[.]9[.]8[.]7) exposes TCP 3389 to a partner subnet. SIEM hands you the extract below &mdash; 214 identical failures in 9 minutes, all Event 4625 (logon failure), Logon Type 10, from one source.</p>",
  question: "<p>Filter the log if useful, then select <b>every</b> correct immediate action. There are 2.</p>",
  data: {
    lines: [
      { t: "01:10:01", m: "TCP 198[.]51[.]100[.]44:51002 -> 10[.]9[.]8[.]7:3389  SYN" },
      { t: "01:10:01", m: "TCP 10[.]9[.]8[.]7:3389 -> 198[.]51[.]100[.]44:51002  SYN-ACK" },
      { t: "01:10:01", m: "TCP 198[.]51[.]100[.]44:51002 -> 10[.]9[.]8[.]7:3389  ACK   (three-way handshake complete)" },
      { t: "01:10:02", m: "AUTH rdp user=administrator FAIL 4625 type 10" },
      { t: "01:10:03", m: "AUTH rdp user=admin FAIL 4625 type 10" },
      { t: "01:10:04", m: "AUTH rdp user=administrator FAIL 4625 type 10  (pattern repeats 214x in 9 min)" },
      { t: "01:19:30", m: "AUTH rdp user=srv-backup FAIL 4625 type 10" }
    ],
    sub: {
      type: "multi",
      choices: [
        "Block 198[.]51[.]100[.]44 at the firewall and check the logs for any successful 4624 in the window",
        "Restrict 3389 to VPN + NLA and enable account lockout for the exposed accounts",
        "Change RDP to listen on 5900 so internet scanners stop finding it",
        "Disable the host firewall so the SIEM can see more packets"
      ],
      correct: [0, 1]
    }
  },
  hint: "The handshake completed, so the service is reachable and the guessing is live. Contain the source, shrink the exposure. What does NOT follow is cosmetics.",
  explain: "<p><b>Correct actions:</b> block the source (the SYN/SYN-ACK/ACK handshake shows real sessions, and 4625 Type 10 = RemoteInteractive logon failures &mdash; a live RDP brute force), then reduce exposure: 3389 behind VPN, Network Level Authentication so unauthenticated clients never reach a login prompt, plus lockout. Also verify no 4624 (success) slipped in.</p><p><b>Wrong:</b> moving to 5900 is obscurity &mdash; scanners find it anyway, and 5900 is VNC's port. Disabling a firewall to 'see more' removes your only containment.</p><div class='note'><b>If you missed this:</b> the three-way handshake lines prove reachability before any login exists &mdash; the attacker only needs the port open. Containment is network-level, not password-level.</div>"
},
{
  id: "H19", theme: "Secure alternatives", type: "spot",
  title: "The DMZ host that listens everywhere",
  kw: ["SNMP", "UDP 161", "binding", "exposure", "SNMPv2c"],
  scenario: "<p>dmz-web01 runs an SNMP agent for monitoring. The host has two interfaces: internal 10[.]9[.]2[.]5 (management) and a partner-facing NIC. Host-level firewalling is not installed on this box, and policy says SNMP must answer only on the management interface. The agent config is below.</p>",
  question: "<p>Click the one line that violates the binding policy.</p>",
  data: {
    lines: [
      "# /etc/snmp/snmpd.conf &mdash; dmz-web01",
      "rocommunity SaFe-Ro-2024",
      "syslocation DMZ-rack4",
      "agentaddress 0[.]0[.]0[.]0:161",
      "view systemonly included system",
      "# monitor: poll from 10[.]4[.]9[.]0/24 only"
    ],
    bad: 3
  },
  hint: "One line decides which interfaces the agent answers on. The comment at the bottom is the policy.",
  explain: "<p><b><code>agentaddress 0[.]0[.]0[.]0:161</code> is the violation.</b> Binding to 0[.]0[.]0[.]0 makes the agent answer on <i>every</i> interface, including the partner-facing NIC &mdash; so UDP 161 is live on a network where policy forbids it, on a box without host-level firewalling. With no host firewall as a backstop, the correct hardening is to bind the agent to the management address only: <code>agentaddress 10[.]9[.]2[.]5:161</code>. The v2c community (still cleartext, v3 migration aside) is at least no longer the default 'public'.</p><div class='note'><b>If you missed this:</b> exposure review has two axes: which port, and on which interface. 0[.]0[.]0[.]0 bindings on multi-homed hosts are a classic audit finding.</div>"
},
{
  id: "H20", theme: "Protocol behaviour", type: "blank",
  title: "DNS hardening runbook: transports and limits",
  kw: ["DNS", "UDP 53", "TCP 53", "AXFR", "zone transfer", "ACL"],
  scenario: "<p>dns01's zone was almost walked by an internal host (the AXFR was caught in time). The post-incident runbook needs its transport facts filled in before the operators sign it.</p>",
  question: "<p>Fill every blank with the correct term from the word bank.</p>",
  data: {
    text: "Runbook DNS-01: normal resolver queries use [[0]] on port [[1]]. Zone transfers ([[2]]) must run over TCP on port 53 and be limited by an [[3]] to the two approved secondaries only. Any other TCP 53 session to dns01 is an alert, not a style choice.",
    bank: ["UDP", "53", "AXFR", "ACL", "TCP", "161"],
    ans: ["UDP", "53", "AXFR", "ACL"]
  },
  hint: "Two transports, one port, one transfer-type name, and one mechanism that limits who may ask.",
  explain: "<p><b>The facts:</b> queries = <b>UDP 53</b> (small, fast, connectionless). Zone transfers = <b>AXFR</b>, which run over <b>TCP</b> 53 because a whole zone is large and ordered. The control is an <b>ACL</b>: only approved secondaries may request AXFR, because a full zone is a map of your network &mdash; hostnames, services, sometimes comments. Any other TCP 53 session deserves scrutiny.</p><div class='note'><b>If you missed this:</b> 'UDP for queries, TCP for transfers, ACL for who' &mdash; three controls, one protocol, and every internal-IP AXFR request is worth an alert.</div>"
},
{
  id: "H21", theme: "Secure alternatives", type: "mcq",
  title: "SFTP or FTPS? The onboarding mix-up",
  kw: ["SFTP", "FTPS", "TCP 22", "TCP 990", "TCP 21", "SSH", "TLS"],
  scenario: "<p>A vendor's onboarding pack offers two secure transfer options: 'SFTP endpoint' and 'FTPS endpoint (implicit TLS on 990)'. The application team must configure the client and asks which ports to open on the egress firewall for the <b>SFTP</b> option.</p>",
  question: "<p>Which port and underlying protocol does the SFTP client actually use?</p>",
  data: {
    choices: [
      "TCP 22 over SSH",
      "TCP 990 over TLS",
      "UDP 22 over SSH",
      "TCP 21 with STARTTLS"
    ],
    correct: [0]
  },
  hint: "Two different protocols hide behind two similar names. One is FTP wrapped in TLS, the other is a subsystem of a remote-shell protocol.",
  explain: "<p><b>Correct: TCP 22 over SSH.</b> SFTP is the file-transfer subsystem of SSH: one encrypted session on 22, no second data channel, no separate daemon. <b>FTPS</b> is classic FTP wrapped in TLS &mdash; implicit FTPS listens on 990, explicit FTPS upgrades a session on 21 &mdash; and keeps FTP's two-channel behaviour. The 990 opening would be opened for the FTPS option, not the SFTP option. And SSH has no UDP variant.</p><div class='note'><b>If you missed this:</b> SFTP = inside SSH (22). FTPS = FTP + TLS (21 explicit / 990 implicit). Similar names, different protocols, different firewalls.</div>"
},
{
  id: "H22", theme: "Secure alternatives", type: "cat",
  title: "The cleartext sweep: 12 protocols, two buckets",
  kw: ["Telnet", "SNMPv2c", "SIP", "FTP", "HTTP", "LDAP", "SFTP", "SSH", "HTTPS", "LDAPS", "SNMPv3", "TLS"],
  scenario: "<p>The external-exposure policy bans cleartext protocols from crossing untrusted networks. Some entries below look 'enterprise' but still carry data unencrypted; others are safe because of TLS or SSH. You get one review pass.</p>",
  question: "<p>Sort all 12 entries into the correct bucket.</p>",
  data: {
    buckets: ["Cleartext &mdash; must not cross untrusted networks", "Encrypted &mdash; acceptable across untrusted networks"],
    items: [
      { t: "Telnet on TCP 23", b: 0 },
      { t: "SNMPv2c with community strings", b: 0 },
      { t: "SIP signaling on 5060, no TLS", b: 0 },
      { t: "FTP on TCP 20/21", b: 0 },
      { t: "HTTP on TCP 80", b: 0 },
      { t: "LDAP on TCP 389, no starttls", b: 0 },
      { t: "SFTP on TCP 22", b: 1 },
      { t: "SSH on TCP 22", b: 1 },
      { t: "HTTPS on TCP 443", b: 1 },
      { t: "LDAPS on TCP 636", b: 1 },
      { t: "SNMPv3 with auth+priv", b: 1 },
      { t: "SIP over TLS on TCP 5061", b: 1 }
    ]
  },
  hint: "v2c communities and starttls-less LDAP look corporate but carry data in the clear. Version numbers and TLS wrappers decide the bucket.",
  explain: "<p><b>Cleartext:</b> Telnet 23, SNMPv2c (communities ride on every packet unencrypted), SIP 5060 without TLS, FTP 20/21, HTTP 80, LDAP 389 without starttls &mdash; all readable end to end.</p><p><b>Encrypted:</b> SFTP and SSH (SSH encryption), HTTPS 443 and LDAPS 636 (TLS), SNMPv3 authPriv (authenticated and encrypted), SIP over TLS 5061. The pattern to trust: which encryption layer &mdash; SSH, TLS, or v3 &mdash; wraps the payload? Version and wrapper, not brand, decide.</p><div class='note'><b>If you missed this:</b> 'secure-sounding name' is not a control. Check the wrapper: TLS, SSH, or v3 authPriv &mdash; or it is cleartext.</div>"
},
{
  id: "H23", theme: "Secure alternatives", type: "order",
  title: "Order the Telnet retirement without an outage",
  kw: ["Telnet", "SSH", "TCP 23", "TCP 22", "ACL", "monitoring", "change management"],
  scenario: "<p>142 managed devices still accept TCP 23. Management approved the retirement with one condition: not a single broken backup job or monitoring poll. You design the sequence.</p>",
  question: "<p>Put the five steps in the correct order.</p>",
  data: {
    items: [
      "Inventory every device and job still using TCP 23",
      "Enable and verify SSH on TCP 22 on each of them",
      "Move management tools, scripts and jump configs to the SSH path",
      "Deny TCP 23 at the edge and on the devices themselves",
      "Monitor for failed jobs and confirm re-scans show 23 filtered"
    ]
  },
  hint: "You cannot disable what you have not inventoried, and you must not cut the old path before the new one is proven.",
  explain: "<p><b>The safe order:</b> inventory (who still needs 23 &mdash; devices, scripts, jump configs), stand up the replacement (enable + verify SSH 22 <i>per device</i>), switch consumers over (tools and scripts), only then deny 23 (edge ACL + device config), and verify (monitoring for breakage, re-scans showing 23 filtered, 22 in use). Cutting the path before the tools migrate is the classic self-inflicted outage.</p><div class='note'><b>If you missed this:</b> retirement of any cleartext protocol follows inventory &rarr; enable replacement &rarr; migrate consumers &rarr; deny &rarr; verify. Every skipped step becomes a ticket.</div>"
},
{
  id: "H24", theme: "Ops & troubleshooting", type: "triage",
  title: "Scan report of a 'hardened' DMZ host: which findings matter?",
  kw: ["Telnet", "SNMP", "SSH", "RDP", "HTTP", "HTTPS", "TCP 3389", "UDP 161", "community strings"],
  scenario: "<p>The weekly scan of web05 (partner DMZ) lands on your desk. The platform owner says 'it is hardened, everything green'. Findings below. Policy: no cleartext management; 3389 only from the jump host subnet; SNMP v3 only.</p>",
  question: "<p>For each finding, choose the correct verdict.</p>",
  data: {
    alerts: [
      { h: "FIND-1 &middot; web05", m: "TCP 23 filtered; TCP 22 open with key-based auth only; TCP 80 answers 301 redirecting to HTTPS.", choices: ["Looks hardened &mdash; no action beyond monitoring", "Telnet is open &mdash; emergency", "The redirect proves DNS is broken"], correct: 0 },
      { h: "FIND-2 &middot; web05", m: "UDP 161 open; SNMPv2c; community 'public' answers system OIDs.", choices: ["Real issue &mdash; v2c cleartext with the default community on a DMZ host", "False alarm &mdash; UDP traffic is harmless", "Informational only &mdash; system OIDs leak nothing"], correct: 0 },
      { h: "FIND-3 &middot; web05", m: "TCP 3389 open and reachable from the entire partner VPN subnet.", choices: ["Real issue &mdash; shrink sources to the jump host subnet per policy", "False alarm &mdash; RDP is encrypted, so exposure does not matter", "Informational only &mdash; 3389 is always open somewhere"], correct: 0 },
      { h: "FIND-4 &middot; web05", m: "TCP 443 open; TLS 1.2+; certificate valid for another 80 days.", choices: ["Good &mdash; keep, renew on schedule", "Real issue &mdash; TLS 1.3 must be mandatory today", "Telnet in disguise &mdash; block it"], correct: 0 }
    ]
  },
  hint: "For each finding ask two questions: is the protocol cleartext? is the exposure wider than policy allows?",
  explain: "<p><b>FIND-1:</b> 23 filtered, key-only 22, 80&rarr;443 redirect &mdash; hardened; keep monitoring. <b>FIND-2:</b> default community on v2c in a DMZ is a real finding &mdash; anyone on the partner path can read device data; migrate to v3 or at minimum rotate and ACL. <b>FIND-3:</b> encryption is not the issue &mdash; exposure is; policy says jump-host subnet only. <b>FIND-4:</b> TLS 1.2+ with a valid cert is acceptable; 80-day validity is normal operations.</p><div class='note'><b>If you missed this:</b> scan verdicts are policy comparisons, not feelings: cleartext? default credentials? exposure wider than the rule? Otherwise it is green.</div>"
},
{
  id: "H25", theme: "Transport & ports", type: "multi",
  title: "Ephemeral ports: separate truth from myth",
  kw: ["ephemeral ports", "dynamic ports", "well-known ports", "FTP passive", "firewall", "source port"],
  scenario: "<p>During a firewall audit, the auditor asks your team to explain ephemeral ports precisely. Five statements are on the whiteboard; you must leave only the true ones.</p>",
  question: "<p>Select every true statement. There are 4.</p>",
  data: {
    choices: [
      "Clients use an ephemeral source port for each new connection",
      "In FTP passive mode, the server's data listener is an ephemeral high port",
      "Stateful firewalls must let return traffic back to the client's ephemeral port",
      "On modern systems the ephemeral range is roughly 49152-65535",
      "Ephemeral ports are the well-known range 0-1023",
      "Every service must run on an ephemeral port so it can be reached"
    ],
    correct: [0, 1, 2, 3]
  },
  hint: "Two statements swap ranges or confuse services with clients.",
  explain: "<p><b>True:</b> every client connection gets an ephemeral source port (the '51998 -> 443' shape). Passive FTP's data listener sits in that high range. Stateful firewalls track the pair and permit replies to that exact port. The IANA dynamic/ephemeral range is 49152-65535 (many OSes use similar ranges by default).</p><p><b>False:</b> 0-1023 is the well-known <i>service</i> range &mdash; the opposite of ephemeral. And services bind fixed ports so clients can find them; only clients grab ephemeral ports.</p><div class='note'><b>If you missed this:</b> services listen on fixed ports; clients speak from ephemeral ones. Firewall rules must account for the return path to ephemeral ports &mdash; that is why stateful inspection exists.</div>"
},
{
  id: "H26", theme: "Ops & troubleshooting", type: "flow",
  title: "Branching: inbound mail, two layered faults",
  kw: ["SMTP", "TCP 25", "MX", "DNS", "relay", "587", "open relay"],
  scenario: "<p>Internet mail to mail03 bounces with 'connection refused'. You have full change visibility: last week's firewall cleanup removed several 'unused' rules. dig on MX records works from outside.</p>",
  question: "<p>Choose the best answer at every stage.</p>",
  data: {
    steps: [
      { q: "MX records resolve correctly. What do you test first?",
        choices: [
          { t: "Confirm the MX with dig/nslookup, then attempt a TCP 25 connection to mail03 from an outside vantage point", good: true, note: "MX only names the host; the pipe on 25 must actually accept connections." },
          { t: "Restart the mail queue on mail03", good: false, note: "Queues matter once connections arrive. Nothing is arriving." },
          { t: "Check the web server's TLS certificate", good: false, note: "Unrelated service; SMTP has its own path and port." }
        ] },
      { q: "TCP 25 is filtered at the edge &mdash; last week's cleanup. You restore the inbound rule. Mail arrives, but outbound replies now sit in the queue. Why?",
        choices: [
          { t: "Outbound 25 needs its own path: the relay permission and the outbound rule/NAT are separate from inbound", good: true, note: "Inbound and outbound mail are different rule sets on the same port." },
          { t: "The MX record is wrong", good: false, note: "MX directs inbound delivery to you; it says nothing about your replies leaving." },
          { t: "UDP 53 must be blocked too", good: false, note: "DNS lookups pass &mdash; the first test proved it." }
        ] },
      { q: "Both directions work. What is the final hardening for the restored port?",
        choices: [
          { t: "Restrict relay to authorized senders only, so TCP 25 can never become an open relay again", good: true, note: "The cleanup almost certainly removed a guard rail with the rule; put the guard rail back." },
          { t: "Permit relay from any source to maximize deliverability", good: false, note: "That is the definition of an open relay &mdash; blocklisted within hours." },
          { t: "Move internet inbound SMTP to port 587", good: false, note: "587 is submission for authenticated users, not server-to-server MX delivery." }
        ] }
    ]
  },
  hint: "One port, two directions, two rule sets &mdash; and one guard rail the cleanup probably removed with them.",
  explain: "<p><b>The path:</b> verify the pipe (MX via dig/nslookup, then an outside TCP 25 test &rarr; filtered). Restore inbound &mdash; then discover the second fault: outbound 25 is its own rule/NAT/relay-permission set. Finish with the control that prevents recurrence: relay restricted to authorized senders. 587 is for authenticated user submission; internet MX delivery is always 25.</p><div class='note'><b>If you missed this:</b> 'port 25' is not one rule. Inbound MX delivery, outbound relay, and relay permission are three separate things on the same port.</div>"
},
{
  id: "H27", theme: "Ops & troubleshooting", type: "match",
  title: "Log fingerprints: label every line",
  kw: ["HTTPS", "DNS", "SNMP", "FTP", "Telnet", "SIP", "RDP", "LDAP", "TCP 53", "UDP 161", "TCP 21", "TCP 23", "TCP 3389", "TCP 389"],
  scenario: "<p>The SIEM spit one line per sensor into the morning digest. Each line carries exactly one protocol fingerprint. Label them all correctly and the on-call queue routes itself.</p>",
  question: "<p>Match every log line to its protocol.</p>",
  data: {
    left: ["POST /owa/auth/logon.aspx 200 on 443", "query: corp[.]example AXFR from 10[.]2[.]0[.]99", "GET system-group OIDs community=public (small UDP packet)", "331 Password required for USER backup", "SYN to 198[.]51[.]100[.]9:23 repeated across the subnet", "INVITE sip:+15550100@pbx01 SIP/2.0", "ERR 3389 NLA: client 203[.]0[.]113[.]51 rejected", "bind: cn=svc-search then search base=ou=people"],
    right: ["HTTPS webmail (443)", "DNS zone transfer over TCP (53)", "SNMP poll (UDP 161)", "FTP login (TCP 21)", "Telnet scan (TCP 23)", "SIP call setup (5060)", "RDP access attempt (3389)", "LDAP directory query (389)"]
  },
  hint: "One token per line decides it: AXFR, community, USER, :23, INVITE, NLA, bind.",
  explain: "<p><b>The fingerprints:</b> an OWA POST on 443 is HTTPS. AXFR is a zone transfer (TCP 53 &mdash; and worth an alert from a non-DNS host). OIDs plus a community string in a small UDP packet is an SNMP poll on 161. '331 Password required' is the FTP login dance on 21. SYNs to :23 are a Telnet sweep. INVITE with a sip: URI is SIP call setup on 5060. 'NLA rejected' on 3389 is an RDP attempt stopped by Network Level Authentication. bind + search on 389 is LDAP.</p><div class='note'><b>If you missed this:</b> build a mental fingerprint table: method names, response codes, URI schemes, and port context. Every line here names itself once you know the tokens.</div>"
},
{
  id: "H28", theme: "Secure alternatives", type: "log",

      if (multi){ var k = sel.indexOf(ci); if (k >= 0) sel.splice(k, 1); else sel.push(ci); }
      else { sel = [ci]; }
      draw();
    });
    btns[ci] = b; root.appendChild(b);
  });
  function draw(){ btns.forEach(function(b, i){ b.classList.toggle('sel', sel.indexOf(i) >= 0); }); }

      else if (!isSel && isCor){ b.classList.add('miss'); m.innerHTML = multi ? '&#9888; missed' : '&#9679; correct'; }
    });
  }
  return {
    root: root,
    max: multi ? d.correct.length : 1,
    get: function(){ return sel.slice(); },
    set: function(a){ sel = (a || []).slice(); draw(); },
    grade: function(){
      marks();
      if (multi){ var e = 0; d.correct.forEach(function(ci){ if (sel.indexOf(ci) >= 0) e++; }); return { earned: e, max: d.correct.length }; }
      return { earned: (sel.length === 1 && d.correct.indexOf(sel[0]) >= 0) ? 1 : 0, max: 1 };

function buildOrder(ex, r){

  function draw(){
    slots.forEach(function(s, si){
      if (fills[si] >= 0){ s.innerHTML = d.bank[fills[si]]; s.classList.add('filled'); }
      else { s.innerHTML = '<span class="ph">______</span>'; s.classList.remove('filled'); }
    });
    chips.forEach(function(c, bi){ c.classList.toggle('sel', selWord === bi); c.classList.toggle('used', fills.indexOf(bi) >= 0); });
  }
  function marks(){
    d.ans.forEach(function(a, si){
      slots[si].classList.remove('ok', 'bad');
      var v = fills[si] >= 0 ? d.bank[fills[si]] : null;
      if (v && v.toLowerCase() === String(a).toLowerCase()){ slots[si].classList.add('ok'); slots[si].innerHTML = '&#10003; ' + v; }
      else { slots[si].classList.add('bad'); slots[si].innerHTML = '&#10007; ' + (v || 'empty') + ' &rarr; ' + a; }
    });
  }
  return {
    root: root, max: d.ans.length,
    get: function(){ return fills.slice(); },
    set: function(a){ if (a){ fills = a.slice(); } draw(); },
    grade: function(){ marks(); var e = 0; d.ans.forEach(function(a, si){ var v = fills[si] >= 0 ? d.bank[fills[si]] : null; if (v && v.toLowerCase() === String(a).toLowerCase()) e++; }); return { earned: e, max: d.ans.length }; },
    lock: function(){ chips.forEach(function(c){ c.disabled = true; }); slots.forEach(function(s){ s.disabled = true; }); },
    unlock: function(){ chips.forEach(function(c){ c.disabled = false; }); slots.forEach(function(s){ s.disabled = false; }); }
  };
}
function buildTerm(ex, r){
  var d = ex.data;
  var root = el('div', 'term');
  root.appendChild(el('div', 'ttl2', d.cap || 'SOC lab shell &mdash; simulated environment'));
  var out = el('div', 'out', d.pre || 'Ready. Type a command and press Run.');
  var input = el('input'); input.type = 'text'; input.spellcheck = false; input.autocomplete = 'off'; input.setAttribute('aria-label', 'Command input');
  var run = el('button', 'btn ghost', 'Run');
  var inline = el('div', 'inline');
  inline.appendChild(el('span', 'ps', d.prompt || 'analyst@soc:~$'));
  inline.appendChild(input); inline.appendChild(run);
  root.appendChild(inline); root.appendChild(out);
  function norm(s){ return s.trim().replace(/\s+/g, ' '); }
  function okCmd(v){ return d.accept.some(function(rx){ try { return new RegExp(rx, 'i').test(v); } catch (e) { return false; } }); }
  run.addEventListener('click', function(){
    if (r.checked) return;
    var v = norm(input.value);
    if (!v) return;
    r.touched = true;
    var safe = v.replace(/</g, '&lt;');
    if (okCmd(v)){
      out.innerHTML = '<div>&#9656; ' + safe + '</div>' + d.out.map(function(l){ return '<div>' + l + '</div>'; }).join('');
    } else {
      out.innerHTML = '<div>&#9656; ' + safe + '</div><div style="color:#ffb0b0">This lab only reproduces the expected command family. Check the hint if you are stuck.</div>';
    }
  });
  input.addEventListener('keydown', function(ev){ if (ev.key === 'Enter'){ ev.preventDefault(); run.click(); } });
  return {
    root: root, max: 1,
    get: function(){ return norm(input.value); },
    set: function(a){ input.value = a || ''; },
    grade: function(){ var okC = okCmd(norm(input.value)); input.classList.remove('ok', 'bad'); input.classList.add(okC ? 'ok' : 'bad'); return { earned: okC ? 1 : 0, max: 1 }; },
    lock: function(){ input.disabled = true; run.disabled = true; },
    unlock: function(){ input.disabled = false; run.disabled = false; }
  };
}
function buildLog(ex, r){
  var d = ex.data;
  var root = el('div');
  var tools = el('div', 'logtools');
  var inp = el('input'); inp.type = 'search'; inp.placeholder = 'Filter lines (try: 23, SNMP, DENY)&hellip;'; inp.setAttribute('aria-label', 'Filter log lines');

    root: root, max: sub.max, get: sub.get, set: sub.set, grade: sub.grade,

function buildSpot(ex, r){
  var d = ex.data;
  var sel = -1, btns = [];
  var root = el('div');
  d.lines.forEach(function(L, i){
    var b = el('button', 'spotline', '<span class="ln">' + (i + 1) + '</span><span class="lm">' + L + '</span><span class="mark" style="margin-left:auto" aria-hidden="true"></span>');
    b.addEventListener('click', function(){ if (r.checked) return; r.touched = true; sel = i; draw(); });
    btns[i] = b; root.appendChild(b);
  });
  function draw(){ btns.forEach(function(b, i){ b.classList.toggle('sel', sel === i); }); }
  function marks(){
    btns.forEach(function(b, i){
      var m = b.querySelector('.mark');
      b.classList.remove('sel');
      if (i === sel && i === d.bad){ b.classList.add('ok'); m.innerHTML = '&#10003; found'; }
      else if (i === sel){ b.classList.add('bad'); m.innerHTML = '&#10007;'; }
      else if (i === d.bad){ b.style.borderColor = '#b97a1e'; m.innerHTML = '&#9888; this line'; }
    });
  }
  return {
    root: root, max: 1,
    get: function(){ return sel; },
    set: function(a){ sel = (typeof a === 'number') ? a : -1; draw(); },
    grade: function(){ marks(); return { earned: (sel === d.bad) ? 1 : 0, max: 1 }; },
    lock: function(){ btns.forEach(function(b){ b.disabled = true; }); },
    unlock: function(){ btns.forEach(function(b){ b.disabled = false; }); }
  };
}
function buildTriage(ex, r){
  var d = ex.data;
  var sel = d.alerts.map(function(){ return -1; }); /* stores ORIGINAL choice indices */
  var perms = []; /* display->original remap so the correct option is not always in the same spot */
  var cards = [], cbtns = [];
  var root = el('div');
  d.alerts.forEach(function(A, ai){
    var perm = shuf(A.choices.map(function(_, i){ return i; }));
    perms[ai] = perm;
    var c = el('div', 'alert', '<div class="ah">' + A.h + '</div><div class="am">' + A.m + '</div>');
    cbtns[ai] = [];
    perm.forEach(function(orig, di){
      var b = el('button', 'opt', '<span class="box" aria-hidden="true"></span><span>' + A.choices[orig] + '</span><span class="mark" aria-hidden="true"></span>');
      b.addEventListener('click', function(){ if (r.checked) return; r.touched = true; sel[ai] = orig; drawA(ai); });
      cbtns[ai][di] = b; c.appendChild(b);
    });
    cards[ai] = c; root.appendChild(c);
  });
  function drawA(ai){ cbtns[ai].forEach(function(b, di){ b.classList.toggle('sel', sel[ai] === perms[ai][di]); }); }
  function marks(){
    d.alerts.forEach(function(A, ai){
      cards[ai].classList.remove('ok', 'bad');
      cbtns[ai].forEach(function(b, di){
        var orig = perms[ai][di];
        var m = b.querySelector('.mark'); m.innerHTML = '';
        b.classList.remove('ok', 'bad', 'miss');
        if (orig === A.correct){ b.classList.add(sel[ai] === orig ? 'ok' : 'miss'); m.innerHTML = sel[ai] === orig ? '&#10003; correct' : '&#9888; correct'; }
        else if (sel[ai] === orig){ b.classList.add('bad'); m.innerHTML = '&#10007; wrong'; }
      });
      cards[ai].classList.add(sel[ai] === A.correct ? 'ok' : 'bad');
    });
  }
  return {
    root: root, max: d.alerts.length,
    get: function(){ return sel.slice(); },
    set: function(a){ if (a){ sel = a.slice(); sel.forEach(function(_, ai){ drawA(ai); }); } },
    grade: function(){ marks(); var e = 0; d.alerts.forEach(function(A, ai){ if (sel[ai] === A.correct) e++; }); return { earned: e, max: d.alerts.length }; },
    lock: function(){ cbtns.forEach(function(row){ row.forEach(function(b){ b.disabled = true; }); }); },
    unlock: function(){ cbtns.forEach(function(row){ row.forEach(function(b){ b.disabled = false; }); }); }
  };
}
function buildFlow(ex, r){
  var d = ex.data;
  var chosen = d.steps.map(function(){ return -1; }); /* stores ORIGINAL choice indices */
  var perms = d.steps.map(function(st){ return shuf(st.choices.map(function(_, i){ return i; })); }); /* display->original remap */
  var body = el('div');
  var root = el('div'); root.appendChild(body);
  function firstOpen(){ for (var i = 0; i < d.steps.length; i++){ if (chosen[i] < 0) return i; } return -1; }
  function render(){
    body.innerHTML = '';
    var upto = firstOpen() === -1 ? d.steps.length - 1 : firstOpen();
    var visible = [];
    for (var x = 0; x <= upto; x++){ visible.push(x); }
    /* forEach gives each iteration its own step index (a plain for-loop var would be
       captured by reference in the click handlers and register answers on the wrong step) */
    visible.forEach(function(i){
      var st = d.steps[i], perm = perms[i];
      var c = el('div', 'alert', '<div class="am"><b>Step ' + (i + 1) + ' of ' + d.steps.length + '.</b> ' + st.q + '</div>');
      perm.forEach(function(orig, di){
        var ch = st.choices[orig];
        var picked = chosen[i] === orig;
        var doneStep = chosen[i] >= 0;
        var cls = 'opt' + (doneStep ? (picked ? (ch.good ? ' ok' : ' bad') : (ch.good ? ' miss' : '')) : '');
        var mk = doneStep ? (picked ? (ch.good ? '&#10003; your pick' : '&#10007; wrong') : (ch.good ? '&#9888; better' : '')) : '';
        var b = el('button', cls, '<span class="box" aria-hidden="true"></span><span>' + ch.t + '</span><span class="mark" aria-hidden="true">' + mk + '</span>');
        b.addEventListener('click', function(){
          if (r.checked || chosen[i] >= 0) return;
          chosen[i] = orig; r.touched = true; render();
        });
        c.appendChild(b);
      });
      if (done(i)) c.appendChild(el('div', 'note', (st.choices[chosen[i]].good ? '&#10003; ' : '&#10007; ') + st.choices[chosen[i]].note));
      body.appendChild(c);
    });
    if (firstOpen() === -1) body.appendChild(el('div', 'note', 'All steps answered. Press Check to lock in your score.'));
    else body.appendChild(el('div', 'note', 'Answer step ' + (firstOpen() + 1) + ' to unlock the next step.'));
  }
  function done(i){ return chosen[i] >= 0; }
  render();
  return {
    root: root, max: d.steps.length,
    get: function(){ return { choices: chosen.slice() }; },
    set: function(a){ if (a && a.choices){ a.choices.forEach(function(v, i){ chosen[i] = v; }); } render(); },
    done: function(){ return firstOpen() === -1; },
    grade: function(){ render(); var e = 0; d.steps.forEach(function(st, i){ if (chosen[i] >= 0 && st.choices[chosen[i]].good) e++; }); return { earned: e, max: d.steps.length }; },
    lock: function(){}, unlock: function(){ chosen = d.steps.map(function(){ return -1; }); render(); }
  };
}

var BUILDERS = { mcq: buildChoice, multi: buildChoice, match: buildMatch, cat: buildCat, order: buildOrder, blank: buildBlank, term: buildTerm, log: buildLog, spot: buildSpot, triage: buildTriage, flow: buildFlow };

/* ---------------- exercise rendering ---------------- */
function buildIf(ei){
  var r = S.R[ei], ex = EX[ei];
  if (r.card) return;
  var card = el('div', 'card');
  card.appendChild(el('div', 'kwrow', ex.kw.map(function(k){ return '<span class="kwc">' + k + '</span>'; }).join('')));
  card.appendChild(el('div', 'blk scn', '<span class="lbl">Scenario</span>' + ex.scenario));
  card.appendChild(el('div', 'blk q', '<span class="lbl">' + (ex.qlbl || 'Question') + '</span>' + ex.question));
  var ans = el('div', 'blk ans');
  ans.appendChild(el('div', '', '<span class="lbl">' + ANSLBL[ex.type] + '</span>'));
  r.api = BUILDERS[ex.type](ex, r);
  ans.appendChild(r.api.root);
  r.hintEl = el('div'); ans.appendChild(r.hintEl);
  card.appendChild(ans);
  var fb = el('div', 'blk fb'); fb.hidden = true;
  card.appendChild(fb);
  r.card = card; r.fb = fb;
  fb.setAttribute('aria-live', 'polite');
  r.hintEl.setAttribute('role', 'status');
  if (r.checked){ r.api.set(r.sel); r.api.grade(); if (r.api.lock) r.api.lock(); }
}
function updateFooter(){
  var ei = S.order[S.idx], r = S.R[ei];
  $('#hintBtn').disabled = r.hint || r.checked;
  $('#reviseBtn').hidden = !r.checked;
  $('#prevBtn').disabled = S.idx === 0;
  $('#skipBtn').disabled = r.checked || r.everChecked;
}
function isEmptyAnswer(v){
  if (v == null) return true;
  if (typeof v === 'string') return v.replace(/\s+/g, '') === '';
  if (Array.isArray(v)) return v.every(function(x){ return x == null || x < 0; });
  if (typeof v === 'object' && v.choices) return v.choices.every(function(x){ return x == null || x < 0; });
  return v < 0;
}
function show(pos){
  var ei = S.order[pos], r = S.R[ei];
  buildIf(ei);
  var st = $('#stage'); st.innerHTML = ''; st.appendChild(r.card);
  updateFooter();
  drawNav(); drawBar(); drawThemes(); drawScore();
}
function goto(pos){
  if (pos < 0 || pos >= EX.length) return;
  S.idx = pos;
  S.checkPause = false; /* leaving the review of a checked exercise resumes the clock */
  drawPause();
  show(pos);
  window.scrollTo({ top: 0 });
}

/* ---------------- check / hint / skip / revise ---------------- */
function doCheck(){
  var ei = S.order[S.idx], r = S.R[ei], ex = EX[ei];
  if (!r.api) return;
  if (r.api.done && !r.api.done()){ flashMsg('Answer every step before pressing Check.'); return; }
  if (isEmptyAnswer(r.api.get())){ flashMsg('Select or type at least one answer before pressing Check.'); return; }
  r.checked = true; r.skipped = false; r.touched = true; r.everChecked = true;
  var g = r.api.grade();
  r.max = g.max;
  r.earned = Math.max(0, g.earned - (r.hint ? 0.1 * g.max : 0));
  r.sel = r.api.get();
  if (r.api.lock) r.api.lock();
  S.checkPause = true; /* review mode: clock frozen, content visible; only Next resumes */
  var ratio = g.max ? r.earned / g.max : 0;
  var badge = ratio >= 0.999 ? '<span class="badge full">&#10003; Full credit</span>' : ratio > 0 ? '<span class="badge part">&#9888; Partial credit</span>' : '<span class="badge zero">&#10007; No credit</span>';
  r.fb.hidden = false;
  r.fb.innerHTML = '<div class="fbline">' + badge + '<span class="pts">You earned ' + (Math.round(r.earned * 100) / 100) + ' / ' + g.max + ' points on this exercise.' + (r.hint ? ' Hint used: &minus;10% applied.' : '') + '</span></div>' +
    '<div class="fbline"><span class="pts">&#9208; Timer paused &mdash; review mode. Study the feedback, then press <b>Next</b> to resume the timer.</span></div>' +
    ex.explain;
  updateFooter(); drawScore(); drawBar(); drawThemes(); drawNav(); drawPause();
  window.scrollTo({ top: 0 });
}
function doHint(){
  var r = cur(), ex = EX[S.order[S.idx]];
  if (r.hint || r.checked) return;
  r.hint = true; r.touched = true;
  r.hintEl.innerHTML = '<div class="hintnote"><b>Hint (&minus;10% for this exercise):</b> ' + ex.hint + '</div>';
  $('#hintBtn').disabled = true;
}
function doSkip(){
  var r = cur();
  if (r.checked || r.everChecked){ flashMsg('This exercise was already checked, so it counts towards your score. Use Revise to re-answer it, or press Next.'); return; }
  r.skipped = true; r.checked = false; r.earned = 0;
  if (S.idx < EX.length - 1){ goto(S.idx + 1); }
  else { drawNav(); flashMsg('Last exercise &mdash; press Finish (twice) to end the exam.'); }
}
function doRevise(){
  var ei = S.order[S.idx], r = S.R[ei];
  if (!r.checked) return;
  r.checked = false; r.earned = 0;
  r.fb.hidden = true;
  if (r.api.unlock) r.api.unlock();
  if (EX[ei].type === 'flow'){ r.sel = null; r.api.set(null); }
  updateFooter(); drawScore(); drawBar(); drawThemes(); drawNav();
}
function flashMsg(t){
  var r = cur();
  r.fb.hidden = false;
  r.fb.innerHTML = '<div class="fbline"><span class="badge na">&#9888; ' + t + '</span></div>';
}

/* ---------------- finish & results ---------------- */
function scoreCalc(){
  var answered = 0, earned = 0;
  EX.forEach(function(_, i){ var r = S.R[i]; if (r.checked){ answered++; earned += r.max ? r.earned / r.max : 0; } });
  return { answered: answered, earned: earned };
}
function finalScore(){
  var s = scoreCalc();
  var sc = Math.round(s.earned); /* the rounded figure that is shown AND reported */
  var pc = s.answered ? Math.round(sc / s.answered * 100) : 0;
  return { answered: s.answered, exact: s.earned, score: sc, percent: pc, passed: pc >= PASS_MARK };
}
function finish(auto){
  if (S.ended) return;
  if (!auto){
    EX.forEach(function(_, i){
      var r = S.R[i];
      if (!r.checked && !r.skipped && r.touched && r.api){
        var g = r.api.grade();
        r.max = g.max;
        r.earned = Math.max(0, g.earned - (r.hint ? 0.1 * g.max : 0));
        r.checked = true; r.sel = r.api.get();
      }
    });
  }
  if (!auto && scoreCalc().answered === 0){ flashMsg('Answer at least one exercise (press Check) before finishing.'); return; }
  S.ended = true;
  buildResults(auto);
}
function report(){
  if (S.reported) return;
  var f = finalScore();
  if (!f.answered) return;
  try {
    parent.postMessage({ type: 'CYBERPULSE_SCORE', topicId: META.topicId, score: f.score, total: f.answered, percent: f.percent, passed: f.passed }, location.origin);
  } catch (e) { /* opened directly in a browser: nothing to report to */ }
  S.reported = true;
}
function ansTextOf(ex, sel){
  var d = ex.data;
  switch (ex.type){
    case 'mcq': case 'multi': return (sel && sel.length) ? sel.map(function(i){ return d.choices[i]; }).join('; ') : '(nothing chosen)';
    case 'match': return d.left.map(function(L, i){ return L + ' &rarr; ' + (sel && sel[i] >= 0 ? d.right[sel[i]] : '(empty)'); }).join('; ');
    case 'cat': var byB = d.buckets.map(function(){ return []; }); (sel || []).forEach(function(bi, ii){ if (bi >= 0) byB[bi].push(d.items[ii].t); }); return d.buckets.map(function(B, bi){ return B + ': ' + (byB[bi].length ? byB[bi].join(', ') : '(empty)'); }).join(' | ');
    case 'order': return (sel && sel.length) ? sel.map(function(ii){ return d.items[ii]; }).join(' &rarr; ') : '(not sorted)';
    case 'blank': return d.ans.map(function(a, si){ return (sel && sel[si] >= 0) ? d.bank[sel[si]] : '(blank)'; }).join(' | ');
    case 'term': return sel || '(no command run)';
    case 'log': return (sel && sel.length) ? sel.map(function(i){ return d.sub.choices[i]; }).join('; ') : '(nothing chosen)';
    case 'spot': return (typeof sel === 'number' && sel >= 0) ? d.lines[sel] : '(nothing clicked)';
    case 'triage': return d.alerts.map(function(A, ai){ return (sel && sel[ai] >= 0) ? A.choices[sel[ai]] : '(no choice)'; }).join(' | ');
    case 'flow': var c = (sel && sel.choices) ? sel.choices : []; return d.steps.map(function(st, si){ return 'S' + (si + 1) + ': ' + (c[si] >= 0 ? st.choices[c[si]].t : '(no choice)'); }).join(' &rarr; ');
  }
  return '';
}
function correctTextOf(ex){
  var d = ex.data;
  switch (ex.type){
    case 'mcq': case 'multi': return d.correct.map(function(i){ return d.choices[i]; }).join('; ');
    case 'match': return d.left.map(function(L, i){ return L + ' &rarr; ' + d.right[i]; }).join('; ');
    case 'cat': return d.buckets.map(function(B, bi){ return B + ': ' + d.items.filter(function(it){ return it.b === bi; }).map(function(it){ return it.t; }).join(', '); }).join(' | ');
    case 'order': return d.items.map(function(t, i){ return (i + 1) + '. ' + t; }).join(' &rarr; ');
    case 'blank': return d.ans.join(' | ');
    case 'term': return d.example;
    case 'log': return d.sub.correct.map(function(i){ return d.sub.choices[i]; }).join('; ');
    case 'spot': return 'Line ' + (d.bad + 1) + ': ' + d.lines[d.bad];
    case 'triage': return d.alerts.map(function(A, ai){ return 'Alert ' + (ai + 1) + ': ' + A.choices[A.correct]; }).join(' | ');
    case 'flow': return d.steps.map(function(st, si){ var g = st.choices.filter(function(c){ return c.good; })[0]; return 'S' + (si + 1) + ': ' + g.t; }).join(' &rarr; ');
  }
  return '';
}
function buildResults(auto){
  var f = finalScore();
  var pass = f.answered > 0 && f.passed;
  $('#ftr').hidden = true; $('#navgrid').hidden = true; $('#barwrap').hidden = true; $('#pausebox').hidden = true;
  var st = $('#stage'); st.innerHTML = '';
  var hero = el('div', 'res-hero ' + (pass ? 'pass' : 'fail'));
  var exactNote = (Math.abs(f.exact - f.score) > 0.001) ? '<div class="pts">Exact partial-credit total before final rounding: ' + (Math.round(f.exact * 100) / 100) + '</div>' : '';
  hero.innerHTML =
    '<div class="verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '&#127942; PASS' : (auto ? '&#9203; TIME OVER &mdash; FAIL' : '&#10007; FAIL')) + '</div>' +
    '<div class="bigscore">' + f.score + ' <small>/ ' + f.answered + ' points &mdash; ' + f.percent + '%</small></div>' + exactNote +
    '<p class="sub">' + (pass ? 'You reached the ' + PASS_MARK + '% pass mark on this chapter. Well done.' : 'You needed ' + PASS_MARK + '%. Read the report below, then retake the exam.') + '</p>' +
    '<p class="sub">' + f.answered + ' of ' + EX.length + ' exercises counted (skipped and untouched exercises are excluded from both points and maximum).</p>' +
    '<button class="btn pri" id="retakeBtn">&#8635; Retake Exam</button>';
  st.appendChild(hero);
  var exc = [];
  EX.forEach(function(ex, i){ var r = S.R[i]; if (!r.checked) exc.push({ t: ex.title, sk: r.skipped }); });
  if (exc.length){
    var box = el('div', 'rules');
    box.innerHTML = '<h3>&#9193; Excluded from scoring (' + exc.length + ')</h3><p>These exercises were skipped or never answered. Their points are left out of your earned points <b>and</b> out of the maximum, so the percentage only covers what you actually answered.</p><ul>' +
      exc.map(function(o){ return '<li>' + o.t + ' ' + (o.sk ? '<span class="badge skip">&#9193; skipped</span>' : '<span class="badge na">&#8226; not answered</span>') + '</li>'; }).join('') + '</ul>';
    st.appendChild(box);
  }
  st.appendChild(el('div', 'subhead', 'Detailed report &mdash; what you answered and why'));
  S.order.forEach(function(ei, pos){
    var ex = EX[ei], r = S.R[ei];
    var rep = el('div', 'rep');
    var badge, lab;
    if (r.checked){
      var ratio = r.max ? r.earned / r.max : 0;
      badge = ratio >= 0.999 ? '<span class="badge full">&#10003; full</span>' : ratio > 0 ? '<span class="badge part">&#9888; partial</span>' : '<span class="badge zero">&#10007; zero</span>';
      lab = (Math.round(r.earned * 100) / 100) + ' / ' + r.max + ' points';
    } else if (r.skipped){ badge = '<span class="badge skip">&#9193; skipped</span>'; lab = 'excluded from scoring'; }
    else { badge = '<span class="badge na">&#8226; not answered</span>'; lab = 'excluded from scoring'; }
    rep.innerHTML = '<h3>Q' + (pos + 1) + '. ' + ex.title + ' ' + badge + '</h3>' +
      '<div class="ra"><b>Your answer:</b> ' + ansTextOf(ex, r.sel) + '</div>' +
      '<div class="rc"><b>Correct answer:</b> ' + correctTextOf(ex) + '</div>' +
      '<div class="pts">Earned: ' + lab + (r.hint ? ' &middot; hint used (&minus;10%)' : '') + '</div>' +
      ex.explain;
    st.appendChild(rep);
  });
  $('#retakeBtn').addEventListener('click', retake);
  window.scrollTo({ top: 0 });
  report();
}
function retake(){
  initState();
  buildIntro();
}

/* ---------------- intro ---------------- */
function buildIntro(){
  $('#hdr').hidden = true; $('#ftr').hidden = true; $('#navgrid').hidden = true; $('#barwrap').hidden = true; $('#pausebox').hidden = true;
  var st = $('#stage'); st.innerHTML = '';
  var hero = el('div', 'hero');
  hero.innerHTML =
    '<div class="metachips"><span>CompTIA Network+ N10-009</span><span>Chapter 1.4 &mdash; Ports &amp; Protocols</span></div>' +
    '<h1>' + META.title + '</h1>' +
    '<p class="sub">Certification-style practice exam &mdash; severity level: <b>' + String(META.difficulty).toUpperCase() + '</b></p>' +
    '<div class="metachips"><span>' + EX.length + ' exercises</span><span>' + META.estimatedMinutes + ' minute timer</span><span>Pass mark: ' + META.passMark + '%</span><span>&asymp; ' + Math.round(META.estimatedMinutes * 60 / EX.length) + ' seconds per exercise</span></div>';
  st.appendChild(hero);
  var kp = el('div', 'kwpanel');
  kp.innerHTML = '<h3>Keywords covered in this exam</h3>' + KW.map(function(g){
    return '<div class="kwgroup"><h4>' + g.theme + '</h4><div>' + g.kws.map(function(k){ return '<span class="kwc">' + k + '</span>'; }).join('') + '</div></div>';
  }).join('');
  st.appendChild(kp);
  var rules = el('div', 'rules');
  rules.innerHTML = '<h3>How this exam works</h3><ul>' +
    '<li><b>Goal:</b> master the ports, protocols and transport methods of this chapter through realistic, on-the-job scenarios &mdash; alert triage, log review, configs, and incident response, not textbook recall.</li>' +
    '<li><b>Exercise types:</b> matching, drag &amp; drop sorting, ordering, fill-in-the-blank word banks, log viewer with filter, spot-the-mistake configs, alert triage, branching incident response, a simulated terminal, and a small number of multiple-choice questions.</li>' +
    '<li><b>Check</b> validates and locks your answer, marks every element (green = correct, red = wrong, amber = missed), shows an explanation, and starts a <b>review pause</b>: the timer freezes but the exercise stays visible so you can learn. Only <b>Next</b> restarts the clock.</li>' +
    '<li><b>Manual Pause</b> is a separate button: while it is on, the exercise is hidden and blurred, so you cannot study during a manual pause. The two pause reasons stack; the clock only runs when both are off.</li>' +
    '<li><b>Partial credit:</b> multi-answer exercises score per correct element. Extra wrong picks never remove points you already earned. Single-answer exercises are all-or-nothing.</li>' +
    '<li><b>Hint</b> costs 10% of that exercise&rsquo;s points and reveals a nudge, never the answer.</li>' +
    '<li><b>Skip</b> jumps ahead and marks the exercise amber. You can return to skipped exercises any time before the timer ends. Skipped exercises are excluded from scoring on both sides of the fraction.</li>' +
    '<li><b>Finish</b> (press twice) ends the exam early. Exercises you touched but never Checked are scored from your current selections; untouched ones are excluded. At zero on the clock the exam ends automatically.</li>' +
    '<li><b>Retake</b> reshuffles every question and every answer choice, and resets skip flags and partial scores.</li></ul>';
  st.appendChild(rules);
  var start = el('div', 'hero');
  var sb = el('button', 'btn pri', '&#9654; Start Exam');
  sb.style.minWidth = '240px';
  sb.addEventListener('click', begin);
  start.appendChild(sb);
  st.appendChild(start);
  window.scrollTo({ top: 0 });
}
function begin(){
  $('#hdr').hidden = false; $('#ftr').hidden = false; $('#navgrid').hidden = false; $('#barwrap').hidden = false;
  drawTimer();
  show(0);
  startTick();
}

/* ---------------- wiring ---------------- */
$('#prevBtn').addEventListener('click', function(){ goto(S.idx - 1); });
$('#nextBtn').addEventListener('click', function(){
  if (S.idx >= EX.length - 1){ flashMsg('This is the last exercise. Press Finish (twice) to end the exam.'); return; }
  goto(S.idx + 1);
});
$('#checkBtn').addEventListener('click', doCheck);
$('#hintBtn').addEventListener('click', doHint);
$('#skipBtn').addEventListener('click', doSkip);
$('#reviseBtn').addEventListener('click', doRevise);
$('#pauseBtn').addEventListener('click', function(){ S.manualPause = !S.manualPause; drawPause(); });
$('#resumeBtn').addEventListener('click', function(){ S.manualPause = false; drawPause(); });
var armT = null;
$('#finishBtn').addEventListener('click', function(){
  var b = $('#finishBtn');
  if (!b.classList.contains('arm')){
    b.classList.add('arm'); b.innerHTML = 'Press again to finish';
    if (armT) clearTimeout(armT);
    armT = setTimeout(function(){ b.classList.remove('arm'); b.innerHTML = 'Finish'; }, 3000);
    return;
  }
  if (armT) clearTimeout(armT);
  b.classList.remove('arm'); b.innerHTML = 'Finish';
  finish(false);
});
window.addEventListener('message', function(ev){
  var d = ev.data; if (!d) return;
  if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT'){
    if (d.username) $('#who').textContent = 'Candidate: ' + d.username;
    /* theme: this exam ships dark only, so no light theme is applied */
  }
});
initState();
buildIntro();

</script>
