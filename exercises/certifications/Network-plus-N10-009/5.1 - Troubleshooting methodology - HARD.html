<style>
:root{
  --bg:#0b0f14;--panel:#121821;--panel2:#0e141c;--line:#243244;--line2:#1a2432;
  --tx:#e4ecf5;--dim:#9fb0c2;--mut:#7d90a3;
  --blue:#4da3ff;--green:#3fd06c;--green2:#123420;--red:#ff6b60;--red2:#3a1512;
  --amber:#ffc043;--amber2:#33270e;--purple:#b48cff;--cyan:#57c7e3;
  --mono:'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{background:var(--bg);color:var(--tx);font:15px/1.55 'Segoe UI','Noto Sans',Arial,sans-serif;padding:0 0 60px}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
h1,h2,h3{line-height:1.25}
button{font:inherit}
a{color:var(--blue)}
.mono,pre,code,input[type=text],textarea{font-family:var(--mono)}
/* ---------- header ---------- */
.hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);margin-bottom:14px}
.hdr .t{font-weight:700;font-size:1.02rem}
.hdr .t small{display:block;color:var(--mut);font-weight:400;font-size:.8rem}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;color:var(--dim);min-height:32px}
.chip b{color:var(--tx)}
#tmr{font-family:var(--mono);font-size:1.05rem;color:var(--cyan);min-width:74px;text-align:center}
#tmr.low{color:var(--red);font-weight:700}
.badge{display:none;border-radius:8px;padding:6px 10px;font-size:.8rem;min-height:32px;align-items:center;gap:6px}
.badge.on{display:inline-flex}
#mpInd{background:var(--amber2);border:1px solid var(--amber);color:var(--amber)}
#cpInd{background:#0d2033;border:1px solid var(--blue);color:var(--blue)}
/* ---------- progress ---------- */
.pbar{height:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-bottom:8px}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .4s}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.thm{font-size:.72rem;color:var(--dim);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
.thm b{color:var(--tx)}
.thm i{display:block;height:4px;border-radius:3px;background:var(--panel);margin-top:3px;overflow:hidden;font-style:normal}
.thm i>u{display:block;height:100%;background:var(--green);text-decoration:none}
/* ---------- navigator ---------- */
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 16px}
.nav button{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-size:.86rem;position:relative}
.nav button small{display:block;font-size:.62rem;line-height:1;color:var(--mut)}
.nav button.cur{outline:2px solid var(--blue);color:var(--tx)}
.nav button.done{border-color:var(--green);color:var(--green)}
.nav button.skip{border-color:var(--amber);color:var(--amber)}
.nav button.dirty{border-color:var(--blue);color:var(--blue)}
/* ---------- blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.blab{display:inline-flex;align-items:center;gap:7px;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.blab::before{content:'';width:9px;height:9px;border-radius:2px;background:var(--cyan)}
.bq .blab{color:var(--purple)}.bq .blab::before{background:var(--purple)}
.bq{background:#151024;border-color:#3a2a63}
.ba .blab{color:var(--green)}.ba .blab::before{background:var(--green)}
.exmeta{font-size:.8rem;color:var(--mut);margin-bottom:8px}
.exmeta b{color:var(--dim)}
.card p+p{margin-top:8px}
pre.log{background:#07090d;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.6;overflow-x:auto;color:#b7c6d6;white-space:pre-wrap;word-break:break-word}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 18px;border-radius:9px;border:1px solid var(--line);background:#182333;color:var(--tx);cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:#12365c;border-color:var(--blue)}
.btn.ok{background:#123420;border-color:var(--green);color:var(--green)}
.btn.warn{background:#33270e;border-color:var(--amber);color:var(--amber)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* ---------- options ---------- */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px;color:var(--tx);cursor:pointer}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;color:var(--dim)}
.opt .mk{margin-left:auto;flex:0 0 auto;font-weight:700}
.opt.sel{border-color:var(--blue);background:#0d2033}
.opt.y{border-color:var(--green);background:var(--green2)}
.opt.n{border-color:var(--red);background:var(--red2)}
.opt.m{border-color:var(--amber);background:var(--amber2)}
.opt .mk.y{color:var(--green)}.opt .mk.n{color:var(--red)}.opt .mk.m{color:var(--amber)}
.opt:disabled{cursor:default}
/* ---------- assign (match/cat/fill) ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;min-height:44px}
.pchip{background:#182333;border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:44px;cursor:grab;color:var(--tx);font-size:.9rem}
.pchip.sel{border-color:var(--blue);background:#0d2033;box-shadow:0 0 0 1px var(--blue)}
.pchip.used{opacity:.35;cursor:default}
.slots,.buckets{display:grid;gap:10px}
.slots{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.buckets{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.slot{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:9px 11px;min-height:72px;cursor:pointer}
.slot.over{border-color:var(--blue)}
.slot .lab{font-size:.8rem;color:var(--dim);margin-bottom:6px}
.slot .fillv{display:inline-flex;align-items:center;gap:6px;background:#182333;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.86rem;min-height:32px}
.slot .fillv .mk{font-weight:700}
.slot.y{border-color:var(--green);border-style:solid;background:var(--green2)}
.slot.n{border-color:var(--red);border-style:solid;background:var(--red2)}
.bucket{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:110px;cursor:pointer}
.bucket.over{border-color:var(--blue)}
.bucket h4{font-size:.86rem;color:var(--cyan);margin-bottom:8px}
.bucket .it{display:flex;gap:6px;align-items:center;background:#182333;border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:.84rem;min-height:44px}
.bucket.y{border-color:var(--green)}
.bucket.n{border-color:var(--red)}
.mk{font-weight:700}
.mk.y{color:var(--green)}.mk.n{color:var(--red)}.mk.m{color:var(--amber)}
/* ---------- fill inline blanks ---------- */
.filltext{font-size:1rem;line-height:2.1}
.blank{display:inline-block;min-width:110px;min-height:44px;border:1px dashed var(--line);border-radius:8px;background:var(--panel2);color:var(--tx);padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:14px;vertical-align:middle}
.blank.over,.blank.sel{border-color:var(--blue)}
.blank.y{border-color:var(--green);background:var(--green2)}
.blank.n{border-color:var(--red);background:var(--red2)}
/* ---------- order ---------- */
.olist{display:grid;gap:8px}
.oitem{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:48px;cursor:grab}
.oitem .num{flex:0 0 auto;width:30px;height:30px;border-radius:7px;background:#182333;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--cyan)}
.oitem .mv{display:flex;gap:4px;margin-left:auto}
.oitem .mv button{width:44px;height:44px;min-height:44px;border-radius:7px;border:1px solid var(--line);background:#182333;color:var(--tx);cursor:pointer}
.oitem.over{border-color:var(--blue)}
.oitem.y{border-color:var(--green)}
.oitem.n{border-color:var(--red)}
/* ---------- terminal ---------- */
.term{background:#07090d;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:14px}
.term .pline{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.term .ps1{color:var(--green);font-family:var(--mono)}
.term input{flex:1;min-width:220px;min-height:44px;background:#0d1117;border:1px solid var(--line);border-radius:7px;color:#d7f5df;padding:6px 10px;font-size:14px}
.term .tout{white-space:pre-wrap;color:#9fb0c2;font-size:14px;border-left:2px solid var(--line2);padding:4px 0 4px 10px;margin:6px 0}
.term .plab{color:var(--dim);font-size:.84rem;margin-bottom:4px}
/* ---------- branch ---------- */
.step{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
.step.locked{opacity:.5}
.step .sq{font-weight:600;margin-bottom:8px}
.step .note{font-size:.84rem;color:var(--cyan);margin-top:8px;font-style:italic}
.step.locked .opts .opt{cursor:default}
/* ---------- select-lines (log/spot) ---------- */
.lvhead{font-family:var(--mono);font-size:14px;color:var(--mut);background:#07090d;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.lines{display:grid;gap:3px}
.ln{display:flex;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px;min-height:44px;color:#b7c6d6;cursor:pointer;font-family:var(--mono);font-size:14px;line-height:1.5;align-items:flex-start}
.ln .box{flex:0 0 auto;font-family:var(--mono);color:var(--mut)}
.ln .no{flex:0 0 auto;color:var(--mut);min-width:30px}
.ln:hover{background:#10161f}
.ln.sel{background:#0d2033;border-color:var(--blue)}
.ln.y{border-color:var(--green);background:var(--green2)}
.ln.n{border-color:var(--red);background:var(--red2)}
.ln.m{border-color:var(--amber);background:var(--amber2)}
.ln.err .lv{color:var(--red)}.ln.warn .lv{color:var(--amber)}.ln.ok .lv{color:var(--green)}.ln.info .lv{color:var(--blue)}
.ln .lv{flex:0 0 auto;font-weight:700;min-width:44px}
.lfilter{width:100%;max-width:420px;min-height:44px;background:#07090d;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:7px 12px;font-size:14px;margin-bottom:8px}
/* ---------- feedback / explanation ---------- */
.fdbk{display:none;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.fdbk.show{display:block}
.fdbk .sum{font-weight:700;margin-bottom:6px}
.expl{display:none;border-left:3px solid var(--blue);background:#0d1626;border-radius:0 10px 10px 0;padding:12px 14px;margin-top:10px}
.expl.show{display:block}
.expl h4{color:var(--blue);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.hintbox{display:none;border-left:3px solid var(--amber);background:var(--amber2);border-radius:0 10px 10px 0;padding:10px 14px;margin-top:10px;color:var(--amber);font-size:.92rem}
.hintbox.show{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a1512;border:1px solid var(--red);color:var(--tx);border-radius:10px;padding:10px 18px;display:none;z-index:60;max-width:90vw}
.toast.show{display:block}
/* ---------- pause overlay ---------- */
.pov{display:none;position:fixed;inset:0;background:rgba(7,9,13,.97);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.pov.show{display:flex}
.pov .big{font-size:1.3rem;font-weight:700;color:var(--amber)}
.pov p{color:var(--dim);max-width:440px;text-align:center}
/* ---------- intro / results ---------- */
.hero{background:linear-gradient(160deg,#101a2b,#0d1420 55%);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:16px}
.hero h1{font-size:1.45rem;margin-bottom:6px}
.hero .sev{display:inline-block;background:#33270e;border:1px solid var(--amber);color:var(--amber);border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.08em;margin-bottom:10px}
.hero p{color:var(--dim)}
.kgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}
.kw{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kw h4{color:var(--cyan);font-size:.85rem;margin-bottom:6px}
.kw ul{list-style:none}
.kw li{font-size:.82rem;color:var(--dim);padding:2px 0 2px 14px;position:relative}
.kw li::before{content:'▸';position:absolute;left:0;color:var(--purple)}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.rules h3{margin-bottom:8px;color:var(--purple)}
.rules ul{list-style:none}
.rules li{padding:5px 0 5px 24px;position:relative;color:var(--dim)}
.rules li::before{content:'✓';position:absolute;left:0;color:var(--green);font-weight:700}
.rules li b{color:var(--tx)}
.score{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:12px 0}
.score .pct{font-size:2.6rem;font-weight:800;font-family:var(--mono)}
.score .pct.pass{color:var(--green)}.score .pct.fail{color:var(--red)}
.cert{border:2px solid var(--green);background:var(--green2);border-radius:14px;padding:18px;text-align:center;margin-bottom:16px}
.cert.f{border-color:var(--red);background:var(--red2)}
.cert h2{font-size:1.4rem}
.cert p{color:var(--dim);margin-top:6px}
table.rep{width:100%;border-collapse:collapse;margin-top:10px;font-size:.86rem}
table.rep th,table.rep td{border:1px solid var(--line2);padding:8px 10px;text-align:left;vertical-align:top}
table.rep th{background:var(--panel2);color:var(--dim);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
td .tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700}
.tag.full{background:var(--green2);border:1px solid var(--green);color:var(--green)}
.tag.part{background:var(--amber2);border:1px solid var(--amber);color:var(--amber)}
.tag.zero{background:var(--red2);border:1px solid var(--red);color:var(--red)}
.tag.skip{background:var(--panel2);border:1px solid var(--mut);color:var(--mut)}
details.exd{margin-top:6px}
details.exd summary{cursor:pointer;color:var(--blue);font-size:.82rem;min-height:44px;display:inline-flex;align-items:center;gap:6px}
details.exd .exb{margin-top:6px;color:var(--dim);font-size:.84rem;border-left:2px solid var(--line);padding-left:10px}
.skiplist{background:var(--amber2);border:1px solid var(--amber);color:var(--amber);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.bigscore{font-family:var(--mono);color:var(--cyan)}
@media (max-width:720px){.hud{width:100%}.hdr{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:no-preference){.pbar>i{transition:width .4s}.opt,.pchip,.slot,.oitem{transition:background .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

  ch:[{t:"Correlate the rack move with the fault: inspect the moved cabling first",ok:1,nt:"'Determine if anything has changed' just found your trigger."},
      {t:"Replace every patch panel on the floor",nt:"Costly guesswork before a single theory is tested."},
      {t:"Upgrade the switch firmware during the outage",nt:"Firmware changes mid-incident stack risk on risk."},
      {t:"Disable spanning tree to stop the flapping",nt:"That invites a switching loop on top of this outage."}]}],
ex:"<p>Under panic, identification still runs on facts: verify the scope yourself, split the fault from the healthy rest, and correlate the timeline with what changed. The rack move three minutes before the flapping is the change the quiet ticket history hid.</p>"},

{id:"H03",tp:"qcm",th:"identify",pt:10,ti:"Two faults, one shift",
sc:"<p>Two tickets arrive together: the mail relay is down (about 200 users, external mail delayed) and one conference-room access point is dead (about 12 people affected occasionally).</p>",
qu:"<p>How do you proceed?</p>",
hi:"Individual handling does not mean random order. Impact decides the queue — and both tickets stay alive.",
ch:[
 {t:"Take the mail relay first — bigger impact — and log the AP as its own problem",ok:1},
 {t:"Take the AP first: the smaller job closes quickly and gives the shift an early win"},
 {t:"Work both tickets in parallel and apply one combined network-wide fix to save time"},
 {t:"Wait an hour to see which of the two problems generates more calls from users"}],
ex:"<p>Individual handling means separate theories, tests and plans — it does not forbid an order. Impact ranks the queue: 200 users and a business-critical relay outrank 12 people and a dead AP, which still gets its own ticket instead of waiting for luck.</p>"},

{id:"H04",tp:"multi",th:"identify",pt:12,ti:"Actions that truly narrow scope",
sc:"<p>The incident channel proposes seven actions for the identification phase of a flaky branch-office link. Some narrow the search; some are noise or risk.</p>",
qu:"<p>Select <b>all</b> actions that genuinely narrow the scope during identification.</p>",
hi:"Narrowing = adding contrast: affected vs unaffected, now vs before, this config vs that config.",
ch:[
 {t:"Test an unaffected host for contrast",ok:1},
 {t:"Compare the affected device's configuration with a known-good one",ok:1},
 {t:"Check device logs around the fault's start time",ok:1},
 {t:"Ask which users and applications are affected — and which are not",ok:1},
 {t:"Apply the first promising forum fix to every device at once"},
 {t:"Reboot all devices in parallel to save time"},
 {t:"Assume the newest patch is always the cause"}],
ex:"<p>Contrast narrows scope: an unaffected host, a config diff, logs around the start time, and a mapped user list all separate signal from noise. Mass fixes, mass reboots and untested assumptions destroy the very contrast identification needs.</p>"},

{id:"H05",tp:"cat",th:"method",pt:12,ti:"Nine cards, four phases, two traps",
sc:"<p>The team deck of methodology actions grew to nine cards — two of them are famous traps because they feel like another phase. Sort them anyway.</p>",
qu:"<p>Drag each action into the phase where the methodology performs it.</p>",
hi:"Two cards feel like they belong to a different phase than the one they serve: one creates facts before any verdict, the other compares state against the fixed system.",
bk:[
 {n:"Identify",it:["Check whether anything changed before the fault started","Reproduce the fault on demand","Map which users and services are affected"]},
 {n:"Test the theory",it:["Trace the path to the suspected hop","Compare the test result against the theory's prediction","Capture packets on the suspected link"]},
 {n:"Plan &amp; implement",it:["Estimate the blast radius of the proposed change","Write the rollback step","Schedule the maintenance window"]},
 {n:"Verify &amp; document",it:["Re-test the original failing action after the fix","Capture a post-fix baseline for comparison","Write the knowledge-base article"]}],
ex:"<p>Duplication sits in identification because it creates facts, not verdicts; the post-fix baseline belongs to verification because it compares against the fixed state. Path tracing and packet capture produce evidence for a theory; blast radius, rollback and windows are plan work; re-testing and articles close the loop.</p>"},

{id:"H06",tp:"spot",th:"method",pt:12,ti:"Audit the incident narrative",
sc:"<p>The incident narrative of INC-8110 will be shown to management as a methodology example. It should not be. Find where the method was violated.</p>",
lv:"INC-8110 · timeline as written",
qu:"<p><b>Click every line that violates the troubleshooting methodology.</b></p>",
hi:"Sort the timeline into method order first; then check that every change was tested and planned, that verification used evidence rather than silence, and that the record is complete.",
ln:[
 {t:"08:59 — INC-8110 opened: users report slow file shares."},
 {t:"09:10 — Theory: the new NAS is overloaded."},
 {t:"09:12 — Implemented: moved 40 users to the old NAS to 'test under real load'.",b:1,why:"A change was implemented before the theory was tested and without a plan or effect analysis."},
 {t:"09:30 — NAS theory not confirmed; escalated to the network team."},
 {t:"09:41 — Network team: duplex mismatch on the uplink confirmed; fix planned with rollback."},
 {t:"09:55 — Change executed; verification skipped because users stopped calling.",b:1,why:"Verification must prove full functionality with tests, not silence from callers."},
 {t:"10:20 — Ticket closed with a one-line note; details remain in chat.",b:1,why:"Findings, actions, outcomes and lessons learned belong in the ticket record."}],
ex:"<p>Line 3 implements a change with no test and no plan; line 6 replaces verification with user silence; line 7 leaves the record in chat. The rest — theory, honest escalation, planned fix with rollback — is exactly how the methodology reads.</p>"},
{id:"H07",tp:"order",th:"theory",pt:10,ti:"Divide and conquer, executed",
sc:"<p>A laptop cannot open the intranet portal. You chose <b>divide and conquer</b> and start at layer 3, the middle of the stack.</p>",
qu:"<p>Order the four checks as the divide-and-conquer path unfolds.</p>",
rlab:"Start in the middle; chase whichever half fails.",
hi:"Middle check first; each success moves you toward the application, each failure toward the cable.",
it:[
 "Ping the default gateway — the middle check (layer 3)",
 "Gateway answers — ping the portal server's IP to move up the path",
 "Server IP answers — test name resolution with nslookup (layer 7)",
 "Name resolves — open the portal in the browser to test the application"],
ex:"<p>Divide and conquer starts mid-stack: a healthy gateway cuts the lower half loose, the server IP pins the path to the host, the name test isolates DNS, and only the browser check can still fail at the application. The first red result tells you which half of the stack to keep.</p>"},

{id:"H08",tp:"term",th:"test",pt:14,ti:"Prove where recursion breaks",
sc:"<p>On workstation FIN-WS-7 some names resolve and others do not. Suspicion: the configured DNS resolver answers only from cache. Nothing is named for you — choose your own tools.</p>",
qu:"<p>Produce the two commands that prove the case. No tool names are given.</p>",
hi:"You need the host's resolver list, and a direct query aimed at that resolver. Windows, Linux and macOS syntaxes are all accepted.",
pm:[
 {lbl:"Show which DNS servers FIN-WS-7 is configured to use (any OS syntax you know)",
  re:["ipconfig.*all","cat /etc/resolv.conf","resolvectl.*status","systemd-resolve.*status","scutil --dns","nmcli.*dns","get-dnsclientserver.*"],
  sm:"ipconfig /all",
  out:"DNS Servers . . . : 10[.]20[.]30[.]53\n                   10[.]20[.]30[.]54"},
 {lbl:"Query the first DNS server directly for any public name to test its recursion (one command)",
  re:["nslookup.*10[.]20[.]30[.]53","dig.*10[.]20[.]30[.]53","host.*10[.]20[.]30[.]53","resolve-dnsname.*10[.]20[.]30[.]53"],
  sm:"nslookup www.example.com 10[.]20[.]30[.]53",
  out:"DNS request timed out.\n    timeout: 2 seconds\nServer: 10[.]20[.]30[.]53 (10[.]20[.]30[.]53)\n*** Can't find www.example.com: Server failed (SERVFAIL)"}],
ex:"<p>ipconfig /all (or resolv.conf / resolvectl) reveals the resolver list; a query aimed directly at 10[.]20[.]30[.]53 proves that the server itself fails recursion. Choosing both tools yourself is the point — the goal was stated in operational terms, not as a command.</p>"},

{id:"H09",tp:"fill",th:"theory",pt:10,ti:"Reason the stack strategies",
sc:"<p>The team's layer-strategy cheat sheet lost its key words. Rebuild it — the words must survive scrutiny by the senior engineer.</p>",
qu:"<p>Fill the four blanks of the cheat sheet.</p>",
hi:"Where does divide and conquer start? And which layer number sits at each end of the stack?",
sg:["Divide and conquer starts at a ",["middle"]," layer, such as layer 3, instead of at an end. If the middle check ",["passes"],", the fault is likely in the higher layers; if it fails, look lower instead. Top-to-bottom begins at layer ",["7"]," and works down toward the cable. Bottom-up begins at layer ",["1"]," and works up toward the application."],
dk:["first","last","fails","obvious","escalate"],
ex:"<p>Divide and conquer starts in the middle and lets each result push you up or down; 'fails' contradicts the second half of that very sentence. The application layer is layer 7, the physical layer is layer 1 — the two ends of every stack walk.</p>"},

{id:"H10",tp:"match",th:"test",pt:10,ti:"Four test outcomes, four moves",
sc:"<p>The test phase has exactly four honest outcomes. The training slide must match each situation to the move the methodology prescribes.</p>",
qu:"<p>Assign each situation to the correct move.</p>",
hi:"Confirmed plans, disproven re-theorises, growing scope escalates, and missing permissions route through change control.",
pr:[
 ["Theory confirmed","Determine the next steps to resolve, then plan the fix"],
 ["Theory disproven once","Re-examine the evidence and form a new theory"],
 ["Two theories disproven and scope growing","Escalate to a team with more access or expertise"],
 ["The theory needs data you may not collect","Request access or hand over through change control"]],
ex:"<p>Confirmation opens planning; a single failure sends you back to the evidence; repeated failure with growing scope demands escalation; and forbidden data is not a wall — it is an escalation path through change control. Every outcome has a lawful next move.</p>"},

{id:"H11",tp:"multi",th:"test",pt:12,ti:"Theory not confirmed — legal moves only",
sc:"<p>The current theory just failed its test after 40 minutes. Pressure is rising and the channel is full of advice. Select the moves the methodology actually allows.</p>",
qu:"<p>Select <b>all</b> valid next moves when a theory is not confirmed.</p>",
hi:"Evidence work, escalation, missed changes, and one-at-a-time testing are legal. Shortcuts are not.",
ch:[
 {t:"Establish a new theory from the evidence you already hold",ok:1},
 {t:"Escalate when the next step needs access or expertise you lack",ok:1},
 {t:"Re-check whether anything changed that identification missed",ok:1},
 {t:"Test the remaining components one at a time",ok:1},
 {t:"Implement the unconfirmed fix anyway — users are waiting"},
 {t:"Mark the ticket resolved to keep the response metrics green"},
 {t:"Blame the last team that touched the device and close"}],
ex:"<p>After a failed test you stay on evidence: new theory, missed-change review, one-by-one testing, or escalation. Fake closures, untested fixes and blame are the three classic ways an outage outlives its welcome.</p>"},

{id:"H12",tp:"log",th:"verify",pt:14,ti:"Green script, amber truth",
sc:"<p>Change CHG-3301 upgraded the firmware of six access switches overnight. The automation script reports full success. The logs tell a longer story.</p>",
lv:"sw-01…sw-05 · mon · CHG-3301 — overnight window",
qu:"<p><b>Select the four lines that show the change is NOT fully verified on sw-05.</b> Reachability and a green script are traps — verification compares state against the plan.</p>",
hi:"The plan's target image is 17[.]9[.]4. What is sw-05 actually running, and who claims it finished?",
ln:[
 {t:"01:02:11 sw-01: firmware install complete — reboot initiated",l:"info"},
 {t:"01:09:26 sw-01: system up — version 17[.]9[.]4 active",l:"ok"},
 {t:"01:12:40 sw-02: system up — version 17[.]9[.]4 active",l:"ok"},
 {t:"01:15:03 sw-03: system up — version 17[.]9[.]4 active",l:"ok"},
 {t:"01:18:55 sw-04: system up — version 17[.]9[.]4 active",l:"ok"},
 {t:"01:24:18 sw-05: boot aborted — image checksum mismatch",l:"err",s:1},
 {t:"01:24:19 sw-05: fallback to previous image 17[.]6[.]3",l:"warn",s:1},
 {t:"01:30:47 mon: sw-05 management reachable — user VLANs up on 17[.]6[.]3",l:"ok",s:1},
 {t:"01:31:02 CHG-3301: step 6 of 6 marked complete by the automation script",l:"info",s:1}],
ex:"<p>The checksum failure and the fallback to 17[.]6[.]3 are the core contradiction; the monitoring line proves the switch is merely reachable on the old image, and the script's 'complete' claim is exactly the trap — automation status is not verification. The other switches in the extract match the plan; sw-05 does not.</p>"},
{id:"H13",tp:"qcm",th:"plan",pt:10,ti:"Emergency change judgment",
sc:"<p>Tuesday 10:20. The core uplink is failing intermittently; users drop every few minutes. The next approved maintenance window is in nine days. Change policy allows emergency changes with expedited approval and a documented impact statement.</p>",
qu:"<p>What is the professionally correct action?</p>",
hi:"The policy exists for exactly this situation — read it again: expedited approval, not no approval.",
ch:[
 {t:"Request an emergency change with expedited approval and documented impact",ok:1},
 {t:"Wait for the scheduled window in nine days and accept the continuing user drops"},
 {t:"Implement immediately tonight and file the approval paperwork afterwards"},
 {t:"Ask the affected users to move to Wi-Fi as a fix until the window opens"}],
ex:"<p>A live, repeating outage justifies the emergency path the policy already provides: expedited approval with documented impact and rollback. Waiting accepts avoidable damage; implementing without approval trades one violation for another; Wi-Fi is a workaround, not a plan.</p>"},

{id:"H14",tp:"fill",th:"document",pt:12,ti:"Complete the post-incident review",
sc:"<p>The review document for INC-8110 needs its five section labels. Management will read exactly this document — make every label count.</p>",
qu:"<p>Fill the five blanks of the post-incident review.</p>",
hi:"Cause, clock, hidden contributor, future-proofing, and the lesson about silence.",
sg:["<b>Post-incident review — INC-8110</b><br>",["Root cause"],": duplex mismatch between the access uplink and the campus router.<br>",["Timeline"],": first symptom 08:59 — cause confirmed 09:41 — resolved 09:58.<br>",["Contributing factor"],": the facilities rack move was never logged as a change.<br>",["Preventive measures"],": uplink error-rate alerts and mandatory move tickets for the wiring closets.<br>",["Lessons learned"],": verification uses monitoring data, not the silence of the phone."],
dk:["blast radius","rollback","escalation","duplicate the problem","maintenance window"],
ex:"<p>A review names the root cause, the timeline, the contributing factor that let it happen, the preventive measures with owners, and the transferable lesson. The distractors are plan-phase words — they describe work done during the change, not the analysis of the incident.</p>"},

{id:"H15",tp:"order",th:"verify",pt:12,ti:"Verification after an uplink swap",
sc:"<p>The core uplink module was replaced at 02:00. The change plan lists six verification steps in a deliberate order: physical, path, routing, application, trend, record.</p>",
qu:"<p>Order the six verification steps as written in the plan.</p>",
rlab:"Physical first — paperwork last.",
hi:"Each step enables the next: counters before pings, pings before routes, routes before apps, apps before trends.",
it:[
 "Confirm the link is up and error counters are zero on both ends",
 "Ping across the uplink from both sides",
 "Confirm routed paths and routing adjacencies are re-established",
 "Test the business applications from a user VLAN",
 "Compare monitoring baselines with the pre-fault week",
 "Update the ticket, then tune the alerts that should have caught this"],
ex:"<p>Verification climbs the same stack the fault broke: physical counters, reachability, routing adjacencies, real applications, then the long view of baselines, and finally the record plus the alerting that should have caught it earlier. Each layer's green light authorises the next test.</p>"},

{id:"H16",tp:"branch",th:"plan",pt:14,ti:"Implement — or stop and escalate?",
sc:"<p>You are mid-window implementing the approved DNS zone change. Then you notice the plan assumed the old zone file — but the zone moved to the new DNS platform last week.</p>",
qu:"<p>Navigate the three decision points of a change gone off-script.</p>",
hi:"A plan is only valid while its assumptions hold. Stopping is a methodology step, not a failure.",
st:[
 {q:"The plan's assumption no longer matches reality. What now?",
  ch:[{t:"Stop and reassess the plan against the new platform before touching anything",ok:1,nt:"Reassessment shows the corrected procedure needs vendor guidance."},
      {t:"Continue exactly as approved — the board signed it",nt:"The change half-applies to the wrong platform; two services now disagree."},
      {t:"Ask the change board to approve a second, unrelated change",nt:"The mismatch you found has nothing to do with the second change."},
      {t:"Reboot both DNS servers to 'clear' the state",nt:"A blind reboot hides the evidence and adds risk."}]},
 {q:"Reassessment shows the corrected procedure needs vendor guidance. The window is still open. What do you do?",
  ch:[{t:"Pause the change, document findings, and escalate to the vendor with your evidence",ok:1,nt:"The vendor replies within the hour with a corrected procedure."},
      {t:"Guess the new syntax in production — the window is closing",nt:"The guessed command deletes the wrong view; rollback is invoked."},
      {t:"Skip the documentation and move on",nt:"The next shift inherits a mystery instead of a note."},
      {t:"Roll back silently without recording why",nt:"The audit trail now ends in the middle of a window."}]},
 {q:"The vendor replies with a corrected procedure. Before implementing it you must:",
  ch:[{t:"Update the plan, re-run the impact analysis, and follow change control for the revised steps",ok:1,nt:"The revised change is approved in time and completes cleanly."},
      {t:"Implement instantly to save the remaining window",nt:"An unapproved revised change is a new change — in disguise."},
      {t:"Let the vendor work unsupervised in production",nt:"Accountability stays with you, not the vendor."},
      {t:"Cancel the original ticket and open nothing — the vendor owns it now",nt:"Ownership and the record remain yours."}]}],
ex:"<p>When reality breaks a plan's assumptions, the methodology says stop, reassess, and escalate if the expertise is missing — then bring the revised plan back through change control. 'Approved' describes a plan built on assumptions that must still hold.</p>"},

{id:"H17",tp:"multi",th:"plan",pt:12,ti:"Effects of a DHCP scope change",
sc:"<p>The change board reviews a plan to move the floor's DHCP scope from 10[.]20[.]40[.]0/24 to 10[.]20[.]44[.]0/24. One board member claims 'everyone must reboot and nothing else happens'. Which effects are actually true?</p>",
qu:"<p>Select <b>all</b> statements that are true potential effects of the scope change.</p>",
hi:"Leases have lifetimes; reservations and static settings ignore the new scope until someone touches them.",
ch:[
 {t:"Existing leases stay valid until renewal, so most clients notice nothing at first",ok:1},
 {t:"New leases come from the new range as soon as clients renew",ok:1},
 {t:"Static reservations pointing into the old range must be recreated or they will conflict",ok:1},
 {t:"Devices with a manually configured old-range address keep it until someone touches them",ok:1},
 {t:"The change instantly re-addresses every device on the VLAN"},
 {t:"Wi-Fi and wired clients follow different DHCP rules on the same scope"},
 {t:"The DHCP change also updates the site's routing policy"}],
ex:"<p>DHCP changes propagate at lease-renewal speed: old leases live on, new leases use the new range, reservations and manual addresses ignore the change until they are recreated or retouched. Instant re-addressing, per-media rules and routing side-effects are mythology.</p>"},

{id:"H18",tp:"qcm",th:"verify",pt:10,ti:"The scope of 'full functionality'",
sc:"<p>Change CHG-3401 replaced the site's DHCP server. The change scope listed three services: DHCP reservations, PXE boot for imaging, and IP phones. The first caller says his PC works and asks you to close.</p>",
qu:"<p>What does <b>verify full system functionality</b> demand here?</p>",
hi:"The word 'full' refers to the change scope, not to the first caller's laptop.",
ch:[
 {t:"Verify all three services in the change scope before closure",ok:1},
 {t:"Close now — one happy user proves the whole change worked"},
 {t:"Close now and reopen the ticket only if someone complains later"},
 {t:"Ask that one happy user to test the phones from his desk too"}],
ex:"<p>Verification is measured against the change scope: reservations, PXE and phones must all be proven — ideally with targeted tests, not with one user's PC. Silent-until-complaint closure is how secondary services die quietly for weeks.</p>"},
{id:"H19",tp:"cat",th:"verify",pt:12,ti:"Corrective, preventive, or written",
sc:"<p>The RCA meeting for the uplink failure produced nine follow-up cards. Sort them so owners can be assigned sensibly.</p>",
qu:"<p>Drag each card into the correct category.</p>",
hi:"Corrective repairs the present, preventive protects the future, documentation preserves the past.",
bk:[
 {n:"Corrective actions",it:["Replace the failed uplink module","Restore the switch from the backup configuration","Re-seat the loose patch cord"]},
 {n:"Preventive measures",it:["Add a redundant second uplink","Enable link-flap alerting","Schedule annual cable certification"]},
 {n:"Documentation",it:["Update the network diagram","Record the RCA in the knowledge base","Attach the switch logs to the ticket"]}],
ex:"<p>Corrective actions end the current fault; preventive measures change the odds of the next one; documentation keeps the knowledge. A second uplink looks corrective but protects the future — that is why it lands with prevention.</p>"},

{id:"H20",tp:"order",th:"document",pt:10,ti:"From ticket to institutional memory",
sc:"<p>A recurring DHCP misconfiguration was finally fixed. The knowledge must now travel — in the right order.</p>",
qu:"<p>Order the five documentation steps.</p>",
rlab:"Record first, review second, change request last.",
hi:"Ticket, article, review, preventive change, and its tracking — each step feeds the next.",
it:[
 "Update the incident ticket with findings, actions and outcome",
 "Publish a knowledge-base article for the recurring symptom",
 "Hold the post-incident review with the whole team",
 "Turn the agreed lessons into a preventive change request",
 "Track that preventive change until it is done and verified"],
ex:"<p>Documentation flows outward: the ticket holds the facts, the article serves the next sufferer, the review extracts lessons, the change request implements them, and tracking makes sure the promise is kept — not just written.</p>"},

{id:"H21",tp:"match",th:"method",pt:10,ti:"Misstep to consequence, harder cut",
sc:"<p>The incident review board wants a sharper training slide: this time the consequences are written in incident language, not dictionary language. Match them.</p>",
qu:"<p>Assign each misstep to the consequence it produced.</p>",
hi:"Each consequence is the misstep's blind spot, described from the incident itself.",
pr:[
 ["No change review during identification","The real trigger — a config push — stays hidden; the team chases ghosts"],
 ["No rollback plan","A failed change becomes an extended outage"],
 ["Two faults fixed as one","Each half-fix masks the other; neither incident closes"],
 ["Verification by user phone calls only","Silent degradation of secondary services goes unnoticed"]],
ex:"<p>Missed change reviews hide triggers; missing rollbacks turn failures into outages; blended fixes hide each other; and phone-call verification only hears the loudest service. Each pair is one methodology step and its shadow.</p>"},

{id:"H22",tp:"spot",th:"plan",pt:14,ti:"Audit the firewall change plan",
sc:"<p>CHG-3418 opens TCP 8443 from the VPN pool to a vendor portal. The plan looks tidy. Audit it against the methodology before it reaches the board.</p>",
lv:"change plan CHG-3418 (draft)",
qu:"<p><b>Click every line that violates the methodology.</b></p>",
hi:"For each line ask three questions: does it test the real path, warn the real people, and leave a real record?",
ln:[
 {t:"Scope: allow TCP 8443 from VPN pool 10[.]44[.]0[.]0/16 to the vendor portal."},
 {t:"Window: Thursday 02:00–03:00, inside the approved maintenance window."},
 {t:"Testing: run a self-ping from the firewall to 10[.]44[.]0[.]1.",b:1,why:"Testing must follow the real path from a real source; a device pinging itself proves nothing about the rule."},
 {t:"Rollback: remove the added rule; previous policy archived as fw-pol-7[.]3[.]zip."},
 {t:"Notifications: none — the rule is invisible to users.",b:1,why:"Service owners and affected users must be notified before every change, even 'invisible' ones."},
 {t:"Verification: open the vendor portal from the VPN pool and confirm all other rule counters unchanged."},
 {t:"Documentation: the firewall GUI history is enough; no ticket update needed.",b:1,why:"Findings, actions and outcomes must be documented in the ticket, not only in a GUI."}],
ex:"<p>The self-ping tests the firewall talking to itself, not the VPN-to-portal path; 'invisible' changes still need notifications; and GUI history is not a ticket. Scope, window, rollback and the real-path verification lines are all sound.</p>"},

{id:"H23",tp:"fill",th:"test",pt:10,ti:"When escalation becomes correct",
sc:"<p>The escalation policy page is being rewritten in plain sentences. Fill the four blanks so a new analyst can quote it.</p>",
qu:"<p>Complete the four escalation criteria.</p>",
hi:"Missing skill, missing authority, stalled clock — and the place where the context must live.",
sg:["Escalate when the problem needs ",["expertise"]," or access your team does not have. Escalate when the ",["impact"]," grows beyond your change authority. Escalate when the agreed ",["timeout"]," for a stalled theory is reached. And record every escalation in the ",["ticket"]," so context is never lost."],
dk:["maintenance window","rollback","duplicate the problem","lessons learned","obvious"],
ex:"<p>Escalation has three triggers — missing expertise, missing authority, and the stall timer — and one duty: the ticket carries the context so the receiving team starts from facts, not from zero. Window, rollback and duplication belong to other phases.</p>"},

{id:"H24",tp:"log",th:"test",pt:14,ti:"APIPA with a healthy DHCP server",
sc:"<p>A brand-new VLAN 90 was created yesterday (CHG-3287). This morning its users sit on APIPA addresses. The DHCP server swears it is healthy — and its pool has space. You collected client, switch, and server evidence.</p>",
lv:"FIN-WS-3 · sw-acc-9 · dhcp1 — 11:02",
qu:"<p><b>Select every line that supports the theory: the new VLAN's DHCP broadcasts never reach the server.</b> Consequences of the missing addresses are not evidence.</p>",
hi:"Broadcasts die at the VLAN border unless a relay forwards them. Find the line that shows the missing relay — and the server-side silence.",
ln:[
 {t:"11:02:10 FIN-WS-3: link up — 1 Gbps, access VLAN 90",l:"info"},
 {t:"11:02:12 FIN-WS-3: DHCPDISCOVER sent (broadcast)",l:"info",s:1},
 {t:"11:02:12 sw-acc-9: VLAN 90 created yesterday by CHG-3287",l:"info",s:1},
 {t:"11:02:35 FIN-WS-3: assigned 169[.]254[.]190[.]7/16 (APIPA)",l:"warn"},
 {t:"11:02:40 dhcp1: no DHCPDISCOVER received from any VLAN 90 relay",l:"warn",s:1},
 {t:"11:02:41 dhcp1: pool vlan30 — 40 addresses free",l:"info"},
 {t:"11:03:02 FIN-WS-3: ping 169[.]254[.]190[.]1 — no reply",l:"err"},
 {t:"11:03:44 sw-acc-9: interface vlan 90 — no ip helper-address configured",l:"warn",s:1}],
ex:"<p>The DISCOVER shows the client asking, the change line dates the new VLAN, the server's 'no relay received' shows the silence, and the missing helper-address is the mechanism. APIPA and the failed ping are consequences; the full pool line even rules out the rival theory.</p>"},
{id:"H25",tp:"qcm",th:"theory",pt:10,ti:"Basics before the hunt",
sc:"<p>Two hours into a 'possible malware exfiltration' hunt on a lab PC that 'lost the network', the team has packet captures, three threat-intel pivots and rising excitement. Nobody has looked behind the PC. Yesterday the room was repainted and the desks were moved.</p>",
qu:"<p>What does the methodology require before the hunt continues?</p>",
hi:"Which theory step was never taken — and what changed in that room?",
ch:[
 {t:"Re-check the basics — link, cable, port state: the room changed, so start simple",ok:1},
 {t:"Reimage the PC immediately so the suspected malware loses its foothold"},
 {t:"Declare a data breach right away and notify the legal department"},
 {t:"Disable the whole lab VLAN until the threat hunt has run its course"}],
ex:"<p>Question the obvious is not optional: a moved desk and an unplugged cable outclass every exotic theory until tested. The elaborate hunt may resume — after the two-minute check that matches the only change anyone can name.</p>"},

{id:"H26",tp:"term",th:"verify",pt:14,ti:"Prove the new link is clean",
sc:"<p>An uplink module was replaced on switch sw-core. The change plan requires physical-layer proof before closure. No tool names are given — you know the platform's CLI.</p>",
qu:"<p>Produce the two commands the plan demands.</p>",
hi:"You need the interface's counters first; then the CLI filter that extracts only the error lines from that output.",
pm:[
 {lbl:"Show the interface status and counters for TenGigabitEthernet1/0/1 (vendor CLI)",
  re:["show interfaces te1/0/1","show interface te1/0/1","show interfaces ten ?1/0/1","show interfaces tengigabitethernet ?1/0/1","show interfaces.*1/0/1"],
  sm:"show interfaces te1/0/1",
  out:"Te1/0/1 is up, line protocol is up\n  0 input errors, 0 CRC, 0 frame, 0 overrun\n  0 output errors, 0 collisions"},
 {lbl:"Show only the lines of that same output that mention errors (use the CLI filter)",
  re:["show interfaces.*\\|.*err","show interfaces.*section.*err","show interfaces.*include.*err"],
  sm:"show interfaces te1/0/1 | include errors",
  out:"  0 input errors, 0 CRC, 0 frame, 0 overrun\n  0 output errors, 0 collisions"}],
ex:"<p>'show interfaces te1/0/1' exposes the counters; piping through 'include errors' compresses the proof to the lines that matter. Choosing tool and flags without being told is the hard part — the goal was stated only in operational terms.</p>"},

{id:"H27",tp:"multi",th:"identify",pt:12,ti:"Duplicate the fault — safely",
sc:"<p>An intermittent VPN authentication fault must be duplicated. The channel proposes seven ways. Some are textbook; others would end up in the next incident report.</p>",
qu:"<p>Select <b>all</b> safe, legitimate ways to duplicate the problem.</p>",
hi:"Isolation (lab, test account), permission (window), or observation (the user). Anything that endangers production or privacy is out.",
ch:[
 {t:"Use a test account on a lab device with the same software build",ok:1},
 {t:"Reproduce during an agreed maintenance window on production",ok:1},
 {t:"Copy the configuration to a lab replica and try there",ok:1},
 {t:"Ask the affected user to repeat the exact steps while you watch",ok:1},
 {t:"Unplug the core uplink mid-morning on the trading floor 'to see it again'"},
 {t:"Copy live customer records to a personal laptop for testing"},
 {t:"Disable MFA for everyone to reproduce an authentication fault"}],
ex:"<p>Safe duplication isolates the fault (lab, test account, replica), uses agreed windows, or observes the real user. Causing production outages, copying private data, or dropping global protections create far worse incidents than the one being studied.</p>"},

{id:"H28",tp:"order",th:"theory",pt:12,ti:"Evidence order for the DNS theory",
sc:"<p>The theory: 'name resolution, not connectivity'. Users reach hosts by IP but fail by name. Order the checks that test this theory with the least guesswork.</p>",
qu:"<p>Order the five checks as the cleanest evidence path.</p>",
rlab:"Each check removes one alternative explanation.",
hi:"Prove the path first, contrast settings second, then aim tests at the suspect server and its rivals, then the suffix details.",
it:[
 "Confirm an IP-only connection still works — rules out layers 1–3",
 "Compare the failing host's DNS settings with a working neighbour",
 "Test the configured DNS server directly from the failing host",
 "Test the same name against another DNS server to isolate host vs server",
 "Check the host's DNS suffix and search list"],
ex:"<p>The sequence builds contrast step by step: IP works (path fine), settings differ or not (host config), direct server test (server behaviour), rival server test (isolates the fault), and finally the suffix list that explains 'some names resolve, others do not'.</p>"},

{id:"H29",tp:"cat",th:"plan",pt:12,ti:"Blast radius of eight changes",

bk:[

{id:"H30",tp:"qcm",th:"document",pt:10,ti:"The strongest answer for documentation",
sc:"<p>During the quarterly review a manager proposes dropping ticket documentation: 'We fix things either way, and writing takes time.'</p>",
