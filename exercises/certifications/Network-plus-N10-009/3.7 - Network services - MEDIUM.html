/* ================= engine — scoring & marks ================= */

function normCmd(c){ return String(c).trim().toLowerCase().replace(/\s+/g, ' '); }

function evaluate(ix, ex, ans){
  var els = [], hits = 0, n = 1;
  switch (ex.ty){
    case 'qcm': case 'logview': {
      if (ex.ctl === 'multi'){ return evalMulti(ex, ans); }
      var okIdx = ex.opts.map(function(o, i){ return o.ok ? i : -1; }).filter(function(i){ return i >= 0; });
      var chosen = ans.k != null ? parseInt(ans.k.slice(1), 10) : null;
      var ok = chosen != null && okIdx.indexOf(chosen) >= 0;
      n = 1;
      els.push({ t: chosen == null ? 'No answer selected' : 'Choice: ' + ex.opts[chosen].t, ok: ok, note: ok ? '' : 'correct: ' + okIdx.map(function(i){ return ex.opts[i].t; }).join(' · ') });
      if (ok) hits = 1;
      break;
    }
    case 'multi': return evalMulti(ex, ans);
    case 'match': {
      n = ex.pairs.length;
      ex.pairs.forEach(function(p, i){
        var got = ans.pairs['L' + i];
        var ok = got === 'R' + i;
        if (ok) hits++;
        els.push({ t: '“' + p[0] + '” → “' + p[1] + '”', ok: ok, note: ok ? '' : (got == null ? 'you left this unmatched' : 'you paired it with “' + ex.pairs[parseInt(got.slice(1),10)][1] + '”') });
      });
      break;
    }
    case 'order': {
      n = ex.items.length;
      (ans.seq || []).forEach(function(key, p){
        var want = 'I' + p;
        var ok = key === want;
        if (ok) hits++;
        els.push({ t: (p+1) + '. ' + ex.items[p], ok: ok, note: ok ? '' : 'you had “' + ex.items[parseInt(key.slice(1),10)] + '” here' });
      });
      break;
    }
    case 'dnd': {
      n = ex.chips.length;
      ex.chips.forEach(function(ch){
        var dest = ans.place[ch.k] || 'bank';
        var slot = ex.slots.filter(function(s){ return s.id === dest; })[0];
        var ok = slot && slot.ks.indexOf(ch.k) >= 0;
        if (ok) hits++;
        els.push({ t: ch.t + ' → ' + (slot ? slot.lb : 'left unplaced'), ok: ok });
      });
      break;
    }
    case 'fill': {
      n = ex.blanks.length;
      ex.blanks.forEach(function(b, bi){
        var v = (ans.vals[bi] || '').trim().toLowerCase();
        var ok = v && b.a.map(function(x){ return String(x).toLowerCase(); }).indexOf(v) >= 0;
        if (ok) hits++;
        els.push({ t: 'Blank ' + (bi+1) + ': ' + b.a[0], ok: ok, note: v ? (ok ? '' : 'you wrote “' + (ans.vals[bi] || '') + '”') : 'left empty' });
      });
      break;
    }
    case 'branch': {
      n = ex.stages.length;
      ex.stages.forEach(function(st, si){
        var pk = ans.pick[si];
        var okOpt = pk != null && st.opts[parseInt(pk.slice(1),10)].ok;
        if (okOpt) hits++;
        els.push({ t: 'Step ' + (si+1) + ': ' + st.okT, ok: !!okOpt, note: pk == null ? 'no choice made' : (okOpt ? '' : 'you chose “' + st.opts[parseInt(pk.slice(1),10)].t + '”') });
      });
      break;
    }
    case 'terminal': {
      n = 1;
      var t = normCmd(ans.cmd);
      var ok = ex.acc.some(function(r){ return new RegExp(r, 'i').test(t); });
      if (ok) hits = 1;
      els.push({ t: 'Command: ' + ans.cmd, ok: ok, note: ok ? '' : 'a working answer would be: ' + ex.accEx });
      break;
    }
    case 'spot': {
      n = 2;
      var lOK = ans.line === ex.wl;
      if (lOK) hits++;
      els.push({ t: 'Mistake is on line ' + (ex.wl+1) + ': ' + ex.code[ex.wl], ok: lOK, note: lOK ? '' : (ans.line == null ? 'no line selected' : 'you picked line ' + (ans.line+1)) });
      var rOK = ans.r != null && rtOf(ix).rs.filter(function(x){ return x.key === ans.r; })[0].ok;
      if (rOK) hits++;
      els.push({ t: 'Reason: ' + ex.rs.filter(function(x){ return x.ok; })[0].t, ok: rOK, note: rOK ? '' : (ans.r == null ? 'no reason selected' : 'you chose: ' + rtOf(ix).rs.filter(function(x){ return x.key === ans.r; })[0].t) });
      break;
    }
  }
  var earned = n ? hits / n * PTS : 0;
  return { els: els, earned: earned, max: PTS };
}
function rtOf(ix){ return S.rt[ix]; }
function evalMulti(ex, ans){
  var els = [], hits = 0;
  var correct = [];
  ex.opts.forEach(function(o, i){ if (o.ok) correct.push(i); });
  var sel = ans.ks.map(function(k){ return parseInt(k.slice(1), 10); });
  correct.forEach(function(ci){
    var ok = sel.indexOf(ci) >= 0;
    if (ok) hits++;
    els.push({ t: ex.opts[ci].t, ok: ok, note: ok ? '' : 'you did not select this correct option' });
  });
  sel.forEach(function(si){
    if (correct.indexOf(si) < 0){
      els.push({ t: ex.opts[si].t + ' — selected, but not a correct answer', ok: false });
    }
  });
  return { els: els, earned: correct.length ? hits / correct.length * PTS : 0, max: PTS };
}

/* ---------- inline marks after check ---------- */
function applyMarks(ix, ex, ans, res){
  var bd = $('ansbd-' + ix);
  if (!bd) return;
  switch (ex.ty){
    case 'qcm': case 'logview': case 'multi': {
      var multi = ex.ty === 'multi' || (ex.ty === 'logview' && ex.ctl === 'multi');
      var chosen = multi ? ans.ks : (ans.k != null ? [ans.k] : []);
      Array.prototype.forEach.call(bd.querySelectorAll('.opt'), function(b){
        var key = b.dataset.key, oIdx = parseInt(key.slice(1), 10);
        var isChosen = chosen.indexOf(key) >= 0;
        var isOk = !!ex.opts[oIdx].ok;
        b.classList.remove('ok','bad');
        if (isOk) b.classList.add('ok');
        else if (isChosen) b.classList.add('bad');
        var sp = b.querySelector('.stateline');
        if (sp){
          if (isOk && isChosen) sp.innerHTML = '&#10003; correct';
          else if (isOk) sp.innerHTML = '&#10003; correct answer (you missed it)';
          else if (isChosen) sp.innerHTML = '&#10007; your pick — wrong';
          else sp.innerHTML = '';
        }
      });
      break;
    }
    case 'match': {
      var cols = bd.querySelectorAll('.mcol');
      var btns = cols[0].querySelectorAll('.mitem');
      Array.prototype.forEach.call(btns, function(b, i){
        var L = S.rt[ix].left[i];
        var ok = L && ans.pairs[L.key] === 'R' + L.key.slice(1);
        b.classList.add(ok ? 'ok' : 'bad');
      });
      break;
    }
    case 'order': {
      Array.prototype.forEach.call(bd.querySelectorAll('.rowitem'), function(row, p){
        var ok = ans.seq[p] === 'I' + p;
        row.classList.add(ok ? 'ok' : 'bad');
      });
      break;
    }
    case 'dnd': {
      Array.prototype.forEach.call(bd.querySelectorAll('.slot'), function(d){
        var id = d.getAttribute('data-drop');
        var slot = ex.slots.filter(function(s){ return s.id === id; })[0];
        var placedKeys = Object.keys(ans.place).filter(function(k){ return ans.place[k] === id; });
        var good = placedKeys.length && placedKeys.every(function(k){ return slot.ks.indexOf(k) >= 0; });
        var cls = good ? 'ok' : (placedKeys.length ? 'bad' : null);
        if (cls) d.classList.add(cls);
        Array.prototype.forEach.call(d.querySelectorAll('.placed'), function(pill){
          var k = pill.dataset.key;
          pill.style.borderColor = slot.ks.indexOf(k) >= 0 ? 'var(--ok)' : 'var(--bad)';
        });
      });
      break;
    }
    case 'fill': {
      Array.prototype.forEach.call(bd.querySelectorAll('select'), function(sel){
        var bi = parseInt(sel.dataset.blank, 10);
        var v = (ans.vals[bi] || '').trim().toLowerCase();
        var ok = v && ex.blanks[bi].a.map(function(x){ return String(x).toLowerCase(); }).indexOf(v) >= 0;
        sel.classList.add(ok ? 'ok' : 'bad');
      });
      break;
    }
    case 'branch': {
      var boxes = bd.querySelectorAll('.stg');
      Array.prototype.forEach.call(boxes, function(box, si){
        var pk = ans.pick[si];
        Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(b){
          var oIdx = parseInt(b.dataset.key.slice(1), 10);
          var isOk = !!ex.stages[si].opts[oIdx].ok;
          var isPicked = pk === b.dataset.key;
          if (isOk) b.classList.add('ok');
          else if (isPicked) b.classList.add('bad');
          var sp = b.querySelector('.stateline');
          if (sp){
            if (isOk && isPicked) sp.innerHTML = '&#10003; correct step';
            else if (isOk) sp.innerHTML = '&#10003; the right step (you missed it)';
            else if (isPicked) sp.innerHTML = '&#10007; your step — wrong';
          }
        });
      });
      break;
    }
    case 'terminal': {
      var ok2 = ex.acc.some(function(r){ return new RegExp(r, 'i').test(normCmd(ans.cmd)); });
      var sh = bd.querySelector('.shell');
      sh.style.borderColor = ok2 ? 'var(--ok)' : 'var(--bad)';
      sh.classList.add(ok2 ? 'ok' : 'bad');
      break;
    }
    case 'spot': {
      var lines = document.querySelectorAll('.codelines button');
      Array.prototype.forEach.call(lines, function(b, li){
        if (li === ex.wl) b.classList.add('ok');
        else if (ans.line === li) b.classList.add('bad');
      });
      Array.prototype.forEach.call(bd.querySelectorAll('.opt'), function(b){
        var key = b.dataset.key;
        var meta = S.rt[ix].rs.filter(function(x){ return x.key === key; })[0];
        if (!meta) return;
        var oIdx = parseInt(key.slice(1), 10);
        if (ex.rs[oIdx].ok) b.classList.add('ok');
        else if (ans.r === key) b.classList.add('bad');
        var sp = b.querySelector('.stateline');
        if (sp){
          if (ex.rs[oIdx].ok) sp.innerHTML = '&#10003; correct reason';
          else if (ans.r === key) sp.innerHTML = '&#10007; your pick — wrong';
        }
      });
      break;
    }
  }
}

/* ---------- report formatting ---------- */
function fmtAns(ix, ans){
  var ex = EXS[ix];
  switch (ex.ty){
    case 'qcm': case 'logview':
      if (ex.ctl === 'multi') return fmtMultiAns(ex, ans);
      return ans.k != null ? '“' + esc(ex.opts[parseInt(ans.k.slice(1),10)].t) + '”' : '—';
    case 'multi': return fmtMultiAns(ex, ans);
    case 'match': {
      var ks = Object.keys(ans.pairs);
      if (!ks.length) return '—';
      return ks.map(function(lk){ return '“' + esc(ex.pairs[parseInt(lk.slice(1),10)][0]) + '” → “' + esc(ex.pairs[parseInt(ans.pairs[lk].slice(1),10)][1]) + '”'; }).join(' · ');
    }
    case 'order':
      return (ans.seq || []).map(function(k){ return esc(ex.items[parseInt(k.slice(1),10)]); }).join(' &#8594; ');
    case 'dnd': {
      var ks2 = Object.keys(ans.place);
      if (!ks2.length) return '—';
      return ks2.map(function(k){
        var dest = ans.place[k]; var sl = ex.slots.filter(function(s){ return s.id === dest; })[0];
        return esc(ex.chips[parseInt(k.slice(1),10)].t) + ' → ' + (sl ? esc(sl.lb) : 'unplaced');
      }).join(' · ');
    }
    case 'fill':
      return ex.blanks.map(function(b, bi){ return 'Blank ' + (bi+1) + ': “' + esc(ans.vals[bi] || '—') + '”'; }).join(' · ');
    case 'branch':
      return ex.stages.map(function(st, si){
        var pk = ans.pick[si];
        return 'Step ' + (si+1) + ': ' + (pk != null ? '“' + esc(st.opts[parseInt(pk.slice(1),10)].t) + '”' : '—');
      }).join(' · ');
    case 'terminal': return '<code>' + esc(ans.cmd || '—') + '</code>';
    case 'spot': {
      var l = ans.line != null ? 'line ' + (ans.line+1) : 'no line';
      var r = ans.r != null ? '“' + esc(ex.rs[parseInt(ans.r.slice(1),10)].t) + '”' : 'no reason';
      return l + ' · ' + r;
    }
  }
  return '—';
}
function fmtMultiAns(ex, ans){
  var sel = ans.ks || [];
  if (!sel.length) return '—';
  return sel.map(function(k){ return '“' + esc(ex.opts[parseInt(k.slice(1),10)].t) + '”'; }).join(' · ');
}
function fmtCorr(ix){
  var ex = EXS[ix];
  switch (ex.ty){
    case 'qcm': case 'logview': {
      if (ex.ctl === 'multi') return fmtMultiCorr(ex);
      return ex.opts.map(function(o, i){ return o.ok ? '“' + esc(o.t) + '”' : null; }).filter(Boolean).join(' · ');
    }
    case 'multi': return fmtMultiCorr(ex);
    case 'match': return ex.pairs.map(function(p){ return '“' + esc(p[0]) + '” → “' + esc(p[1]) + '”'; }).join(' · ');
    case 'order': return ex.items.map(function(t, i){ return (i+1) + '. ' + esc(t); }).join(' &#8594; ');
    case 'dnd': return ex.slots.map(function(s){ return '<b>' + esc(s.lb) + ':</b> ' + s.ks.map(function(k){ return esc(ex.chips[parseInt(k.slice(1),10)].t); }).join(', '); }).join(' · ');
    case 'fill': return ex.blanks.map(function(b, bi){ return 'Blank ' + (bi+1) + ': “' + esc(b.a[0]) + '”'; }).join(' · ');
    case 'branch': return ex.stages.map(function(st, si){ return 'Step ' + (si+1) + ': ' + esc(st.okT); }).join(' · ');
    case 'terminal': return '<code>' + esc(ex.accEx) + '</code>';
    case 'spot': return 'line ' + (ex.wl+1) + ' (' + esc(ex.code[ex.wl]) + ') — ' + esc(ex.rs.filter(function(x){ return x.ok; })[0].t);
  }
  return '—';
}
function fmtMultiCorr(ex){
  return ex.opts.map(function(o){ return o.ok ? '“' + esc(o.t) + '”' : null; }).filter(Boolean).join(' · ');
}

  var t = $('toast');
  t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = '1';
  if (toastTO) clearTimeout(toastTO);
  toastTO = setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.classList.add('hidden'); }, 350); }, 3000);
}
function closeModal(){ var m = document.querySelector('.modal'); if (m) m.parentNode.removeChild(m); }
function modalBox(title, bodyHTML, buttons){
  closeModal();
  var m = el('div','modal');
  var box = el('div','mbox');
  box.setAttribute('role','dialog');
  box.setAttribute('aria-modal','true');
  box.appendChild(el('h3',null,esc(title)));
  var bd = el('div',null,bodyHTML); box.appendChild(bd);
  var row = el('div','mrow');
  buttons.forEach(function(b){
    var bt = el('button','btn ' + (b.cls||'ghost'), esc(b.t));
    bt.addEventListener('click', function(){ closeModal(); if (b.fn) b.fn(); });
    row.appendChild(bt);
  });
  box.appendChild(row); m.appendChild(box); document.body.appendChild(m);
  var fb = box.querySelector('button'); if (fb) fb.focus();
  return box;
}

/* ---------------- views ---------------- */
function showView(id){
  ['view-intro','view-exam','view-results'].forEach(function(v){ $(v).classList.toggle('hidden', v !== id); });
  window.scrollTo(0,0);
}

/* ---------------- timer ---------------- */
function drawTimer(){
  var m = Math.floor(S.timeLeft/60), s = S.timeLeft % 60;
  var txt = m + ':' + (s < 10 ? '0' : '') + s;
  var t = $('timer'); t.textContent = txt;
  t.classList.toggle('warn', S.timeLeft <= 600 && S.timeLeft > 180);
  t.classList.toggle('crit', S.timeLeft <= 180);
}
function updPauseUI(){
  var bar = $('pausebar'); bar.innerHTML = '';
  if (S && S.manual){
    var p1 = el('span','pmsg manual','&#9611;&#8202;Paused (manual) — exercise hidden. Press Pause again to resume.');
    bar.appendChild(p1);
  }
  if (S && S.checkp){
    var p2 = el('span','pmsg','&#9203;&#8202;Timer paused — review mode. Press Next to continue.');
    bar.appendChild(p2);
  }
  $('btn-pause').setAttribute('aria-pressed', S && S.manual ? 'true' : 'false');
  $('btn-pause').innerHTML = S && S.manual ? '&#9654;&#8202;Resume' : '&#9612;&#8202;Pause';
  var st = $('stage'); if (st) st.classList.toggle('blurred', !!(S && S.manual && !S.finished));
}
function tick(){
  if (!S || !S.started || S.finished) return;
  if (S.manual || S.checkp) return;
  S.timeLeft--;
  if (S.timeLeft <= 0){ S.timeLeft = 0; drawTimer(); finish(true); return; }
  drawTimer();
}

/* ---------------- chrome ---------------- */
function checkedCount(){ var n=0; EXS.forEach(function(_,i){ if (S.checked[i]) n++; }); return n; }
function renderChrome(){
  if (!S) return;
  $('qcount').textContent = 'Question ' + (S.cur+1) + ' of ' + EXS.length;
  var e=0, p=0; EXS.forEach(function(_,i){ if (S.checked[i]){ e += S.earned[i]; p += PTS; } });
  $('score').innerHTML = 'Score: <b>' + round1(e) + '</b> / ' + (EXS.length*PTS) + ' pts';
  var tp = $('themeprog'); tp.innerHTML = '';
  THEMES.forEach(function(tn, ti){
    var te=0, tp2=0;
    S.order.forEach(function(ix){ var ex=EXS[ix]; if (ex.th===ti){ tp2 += PTS; if (S.checked[ix]) te += S.earned[ix]; } });
    tp.appendChild(el('span','tchip', esc(tn.split('—')[0].trim()) + ' <b>' + round1(te) + '</b>/' + tp2));
  });
  $('progressbar').style.width = (checkedCount()/EXS.length*100) + '%';
  drawTimer();
  renderNavgrid();
  var last = S.cur === EXS.length - 1;
  var ix = S.order[S.cur];
  $('btn-next').innerHTML = last ? '&#10003;&#8202;Finish' : 'Next &#9654;';
  $('btn-back').disabled = S.cur === 0;
  var ck = $('btn-check');
  ck.disabled = !!S.checked[ix] && !S.revise;
  ck.innerHTML = S.checked[ix] && !S.revise ? '&#10003;&#8202;Checked' : '&#10003;&#8202;Check';
  $('btn-revise').classList.toggle('hidden', !S.checked[ix]);
  var h = $('btn-hint');
  if (S.hint[ix]){ h.disabled = true; h.innerHTML = '&#128161;&#8202;Hint used'; }
  else { h.disabled = false; h.innerHTML = '&#128161;&#8202;Hint (−1 pt)'; }
}
function renderNavgrid(){
  var g = $('navgrid'); g.innerHTML = '';
  S.order.forEach(function(ix, pos){
    var b = el('button','ncell');
    var st = 'not answered', cls = '';
    if (S.skip[ix] && !S.checked[ix]){ cls='s'; st='skipped — excluded from scoring'; }
    else if (S.checked[ix]){
      var e = S.earned[ix];
      if (S.lab[ix]==='full'){ cls='f'; st='correct (full points)'; }
      else if (S.lab[ix]==='partial'){ cls='p'; st='partially correct'; }
      else { cls='z'; st='wrong (zero points)'; }
    }
    if (pos === S.cur) cls += ' cur';
    b.className = 'ncell ' + cls;
    var gl = cls.indexOf('f')>=0 && S.checked[ix] ? '&#10003;' : (S.lab[ix]==='partial'?'~':(S.lab[ix]==='zero'?'&#10007;':(S.skip[ix]&&!S.checked[ix]?'&#187;':'')));
    b.innerHTML = (pos+1) + (gl ? ' <span class="g">' + gl + '</span>' : '');
    b.setAttribute('aria-label', 'Go to question ' + (pos+1) + ' — ' + st);
    b.title = st;
    b.addEventListener('click', function(){ S.cur = pos; renderCurrent(); });
    g.appendChild(b);
  });
}

/* ---------------- navigation ---------------- */
function renderCurrent(){
  if (!S || S.finished) return;
  buildExercise(S.order[S.cur], S.cur);
  renderChrome(); updPauseUI();
  window.scrollTo(0,0);
}
function doBack(){ if (S.cur > 0){ S.cur--; renderCurrent(); } }
function doNext(){
  if (S.checkp){ S.checkp = false; }
  if (S.cur < EXS.length - 1){ S.cur++; renderCurrent(); }
  else askSubmit();
}
function doSkip(){
  var ix = S.order[S.cur];
  if (!S.checked[ix]) S.skip[ix] = true;
  if (S.cur < EXS.length - 1){ S.cur++; renderCurrent(); }
  else { renderChrome(); toast('This is the last exercise — press Finish to hand in the exam.'); }
}
function doPause(){
  S.manual = !S.manual; updPauseUI();
  toast(S.manual ? 'Paused (manual) — the exercise is hidden while paused.' : 'Resumed — timer is running again.');
}

/* ---------------- hint / check / revise ---------------- */
function doHint(){
  var ix = S.order[S.cur];
  if (S.hint[ix]) return;
  S.hint[ix] = true;
  var hb = $('hintbox-' + ix);
  if (hb){ hb.innerHTML = '&#128161;&#8202;<b>Hint (costs 1 pt on this exercise):</b> ' + EXS[ix].hint; hb.classList.remove('hidden'); }
  renderChrome();
}
function doCheck(){
  var ix = S.order[S.cur], ex = EXS[ix];
  var ans = collectAnswer(ix, ex);
  if (!ans){ toast('Nothing to check yet — choose or type an answer first.'); return; }
  var res = evaluate(ix, ex, ans);
  var pen = S.hint[ix] ? 1 : 0;
  var e = Math.max(0, round1(res.earned - pen));
  /* label reflects the points actually banked, so "full" never sits next to 9/10 */
  var lab = e >= res.max - 0.001 ? 'full' : (e <= 0.001 ? 'zero' : 'partial');
  S.ans[ix] = ans; S.snap[ix] = ans;
  S.earned[ix] = e; S.lab[ix] = lab; S.checked[ix] = true;
  delete S.skip[ix]; S.revise = false;
  S.checkp = true; /* review mode: content visible, timer frozen until Next */
  updPauseUI();
  applyMarks(ix, ex, ans, res);
  renderFeedback(ix, ex, res, e, lab);
  lockStage(ix);
  renderChrome();
  window.scrollTo(0,0);
}
function doRevise(){
  var ix = S.order[S.cur];
  S.revise = true; S.checkp = false; updPauseUI();
  unlockStage(ix);
  renderChrome();
  toast('Revise mode — change your answer, then press Check again. A new Check re-grades this exercise.');
}

/* ---------------- submit / finish ---------------- */
function askSubmit(){
  if (!S || S.finished) return;
  var answered = 0, skipped = 0, untouched = 0;
  EXS.forEach(function(_, i){
    if (S.checked[i]) answered++;
    else if (S.skip[i]) skipped++;
    else if (collectAnswer(i, EXS[i])) untouched++;
    else untouched++;
  });
  var body = '<p><b>Answered &amp; checked:</b> ' + answered + ' · <b>Skipped:</b> ' + skipped + ' · <b>Without answer:</b> ' + untouched + '</p>' +
    '<p>Skipped exercises and exercises without any answer are <b>excluded from scoring</b> — they count in neither the points you earned nor the total. Everything you answered is graded, including partial credit.</p>';
  modalBox('Submit the exam?', body, [
    { t:'Keep working', cls:'ghost' },
    { t:'Submit now', cls:'primary', fn:function(){ finish(false); } }
  ]);
}
function autoEvaluateRest(){
  EXS.forEach(function(ex, i){
    if (S.checked[i]) return;
    if (S.skip[i]) return; /* explicitly skipped stays excluded, even with a draft answer */
    var a = collectAnswer(i, ex);
    if (a){
      var res = evaluate(i, ex, a);
      var e = Math.max(0, round1(res.earned - (S.hint[i] ? 1 : 0)));
      S.ans[i] = a; S.snap[i] = a; S.earned[i] = e; S.checked[i] = true;
      S.lab[i] = e >= res.max - 0.001 ? 'full' : (e <= 0.001 ? 'zero' : 'partial');
    } else {
      S.skip[i] = true;
    }
  });
}
function finish(auto){
  if (!S || S.finished) return;
  autoEvaluateRest();
  var scored = 0; EXS.forEach(function(_, i){ if (S.checked[i]) scored++; });
  if (scored === 0){
    modalBox('Nothing to grade', '<p>All ' + EXS.length + ' exercises are skipped or empty. Please answer at least one exercise before submitting — a fully skipped exam cannot be scored.</p>',
      [{ t:'Back to the exam', cls:'primary', fn:function(){ if (auto){ S.finished=false; showView('view-exam'); renderCurrent(); } } }]);
    /* skip flags stay exactly as they are: the student must still see which ones were skipped */
    if (!auto) renderChrome();
    return;
  }
  S.finished = true; S.manual = false; S.checkp = false; S.autoNote = auto ? 'Time ran out — the exam was submitted automatically.' : '';
  updPauseUI();
  var earned = 0, possible = 0, skippedN = 0;
  EXS.forEach(function(_, i){ if (S.checked[i]){ earned += S.earned[i]; possible += PTS; } else skippedN++; });
  earned = round1(earned);
  /* The reported integer score and the on-screen percentage must agree (site contract 6.2):
     both are derived from the same rounded earned figure. */
  var repEarned = Math.round(earned), repTotal = Math.round(possible);
  var pct = repTotal ? Math.round(repEarned / repTotal * 100) : 0;
  var pass = pct >= CFG.passMark;
  renderResults(earned, repTotal, pct, pass, skippedN);
  showView('view-results');
  /* Website contract: one score message per attempt, at the results screen, after final values. */
  if (!S.reported){
    S.reported = true;
    reportScore(repEarned, repTotal);
  }
}
function reportScore(correct, total){
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      score: correct, total: total, percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch (e) { /* Opened directly (file://) — nothing to report to. */ }
}
function retake(){
  closeModal();
  S = freshState();
  $('pausebar').innerHTML = '';
  showView('view-exam');
  renderNavgridAll();
  renderCurrent();
}

/* ---------------- results ---------------- */
function labelChip(lab, skipped){
  var map = { full:['full','&#10003; Full points'], partial:['partial','&#9650; Partial'], zero:['zero','&#10007; Zero'], skipped:['skipped','&#187; Skipped — not counted'] };
  var m = map[skipped ? 'skipped' : lab];
  return '<span class="rlab ' + m[0] + '">' + m[1] + '</span>';
}
function renderResults(earned, possible, pct, pass, skippedN){
  var v = $('res-verdict');
  var uname = window.__uname || '';
  if (pass){
    v.className = 'verdict pass';
    v.innerHTML = '<div class="big">PASS</div>' +
      '<div class="sub">' + esc(CFG.title) + ' — you reached ' + pct + '% (pass mark ' + CFG.passMark + ').' + (S.autoNote ? ' ' + esc(S.autoNote) : '') + '</div>' +
      '<div class="cert"><b>Certificate of completion</b><br>' + (uname ? esc(uname) + ' · ' : '') + 'CompTIA Network+ N10-009 · Objective 3.7 Network services<br>Score: ' + earned + ' / ' + possible + ' pts (' + pct + '%)</div>';
  } else {
    v.className = 'verdict fail';
    v.innerHTML = '<div class="big">FAIL — ' + pct + '%</div>' +
      '<div class="sub">You needed ' + CFG.passMark + '%. ' + (S.autoNote ? esc(S.autoNote) + ' ' : '') + 'Review the report below, then retake the exam — questions and answers will be shuffled again.</div>';
  }
  var sum = $('res-summary');
  sum.innerHTML =
    '<span class="mchip">Points: <b>' + earned + '</b> / ' + possible + '</span>' +
    '<span class="mchip">Percentage: <b>' + pct + '%</b> (pass ' + CFG.passMark + '%)</span>' +
    '<span class="mchip">Graded: <b>' + (EXS.length - skippedN) + '</b> / ' + EXS.length + '</span>' +
    '<span class="mchip">Skipped (excluded): <b>' + skippedN + '</b></span>' +
    '<span class="mchip">Time left: <b>' + Math.floor(S.timeLeft/60) + 'm ' + (S.timeLeft%60) + 's</b></span>' +
    (skippedN ? '<span class="mchip" style="color:var(--warn)">Skipped exercises were removed from both the points earned and the total — they do not lower your percentage.</span>' : '');
  var list = $('res-list'); list.innerHTML = '';
  S.order.forEach(function(ix, pos){
    var ex = EXS[ix];
    var card = el('div','rescard');
    var isSkip = !S.checked[ix];
    var rh = el('div','rh');
    rh.innerHTML = '<b>Q' + (pos+1) + '.</b> <span>' + esc(ex.ttl) + '</span> <span class="extheme">' + esc(THEMES[ex.th].split('—')[0].trim()) + '</span> ' +
      labelChip(S.lab[ix], isSkip) +
      '<span style="margin-left:auto;font-size:13.5px;color:var(--tx3)">' + (isSkip ? 'excluded' : round1(S.earned[ix]) + ' / ' + PTS + ' pts') + '</span>';
    card.appendChild(rh);
    if (isSkip){
      card.appendChild(el('div','rya','<span class="k">You skipped this exercise, so it was not graded and it did not count towards your score.</span>'));
    } else {
      card.appendChild(el('div','rya','<span class="k">Your answer:</span> ' + fmtAns(ix, S.snap[ix])));
      card.appendChild(el('div','rca','<span class="k">Correct answer:</span> ' + fmtCorr(ix)));
    }
    card.appendChild(el('div','explain','<b>Why:</b> ' + ex.xpl));
    card.appendChild(el('div','rtipline','<b>Focus next:</b> ' + ex.tip));
    list.appendChild(card);
  });
}

/* ---------------- handshake & boot ---------------- */
window.addEventListener('message', function(event){
  if (!event.data || typeof event.data.type !== 'string') return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  try {
    var n = event.data.username;
    if (n && typeof n === 'string'){
      window.__uname = n.slice(0, 40);
      var g = $('greet');
      if (g) g.textContent = 'Candidate: ' + window.__uname + ' — good luck.';
    }
  } catch (e) { /* never break the exam on handshake problems */ }
});

function buildIntro(){
  $('hdr-title-intro').textContent = CFG.title;
  $('hdr-title').textContent = CFG.title;
  document.title = CFG.docTitle;
  var b = $('sevbadge');
  b.textContent = CFG.severity + ' severity';
  b.className = 'badge ' + (CFG.severity === 'MEDIUM' ? 'medium' : 'hard');
  $('introgoal').innerHTML = CFG.goal;
  var kw = $('kw');
  KW.forEach(function(g){
    var d = el('div','kwgroup');
    d.appendChild(el('h3',null,esc(g.t)));
    var w = el('div');
    g.k.forEach(function(k){ w.appendChild(el('span','kw',esc(k))); });
    d.appendChild(w); kw.appendChild(d);
  });
  var how = $('howto');
  CFG.howto.forEach(function(h){ how.appendChild(el('li',null,h)); });
  var im = $('intrometa');
  [['Exercises', String(CFG.qcount)], ['Timer', CFG.minutes + ' min — ' + CFG.perEx], ['Pass mark', CFG.passMark + '%'], ['Points', String(CFG.qcount * 10)]].forEach(function(m){
    im.appendChild(el('span','mchip', esc(m[0]) + ': <b>' + esc(m[1]) + '</b>'));
  });
  $('btn-start').addEventListener('click', function(){
    S = freshState();
    showView('view-exam');
    renderNavgridAll();
    renderCurrent();
  });
}
function renderNavgridAll(){ renderNavgrid(); }

function wire(){
  $('btn-pause').addEventListener('click', doPause);
  $('btn-back').addEventListener('click', doBack);
  $('btn-next').addEventListener('click', doNext);
  $('btn-skip').addEventListener('click', doSkip);
  $('btn-check').addEventListener('click', doCheck);
  $('btn-revise').addEventListener('click', doRevise);
  $('btn-hint').addEventListener('click', doHint);
  $('btn-submit').addEventListener('click', askSubmit);
  $('btn-retake').addEventListener('click', retake);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.querySelector('.modal')){ closeModal(); }
  });
  setInterval(tick, 1000);
  buildIntro();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire); else wire();

/* Debug / assist hook (also used by the automated sandbox verification). */
window.__exam = {
  state: function(){ return S; },
  setRemaining: function(s){ if (S){ S.timeLeft = s; drawTimer(); } },
  jump: function(pos){ if (S && !S.finished){ S.cur = pos; renderCurrent(); } },
  types: function(){ return S ? S.order.map(function(ix){ return EXS[ix].ty; }) : []; },
  ids: function(){ return S ? S.order.map(function(ix){ return EXS[ix].id; }) : []; },
  exOf: function(pos){ return EXS[S.order[pos]]; },
  finish: function(){ finish(false); }
};

</script>
</body>
