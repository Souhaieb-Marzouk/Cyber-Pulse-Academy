<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15.5px/1.55 'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ---------- generic controls ---------- */

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;transition:background .15s,border-color .15s,transform .06s}

.btn.warn{background:#7a3b12;border-color:#a35a22}

.btn.ghost{background:transparent}

.btn[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--accbg) inset}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
input[type=text],select,input[type=search]{min-height:44px;padding:8px 12px;border-radius:9px;border:1px solid var(--line2);background:#0e1626;color:var(--tx);font:inherit}
input[type=text],input[type=search]{font-family:var(--mono);font-size:14.5px}

/* ---------- intro ---------- */
.intro-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 4px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.4px;border:1px solid}
.badge.medium{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.badge.hard{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.mchip{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:14px;color:var(--tx2)}
.mchip b{color:var(--tx)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}

.howto{margin:0;padding-left:22px}

#greet{color:var(--ok);font-weight:600;min-height:1em}
.startwrap{display:flex;gap:12px;align-items:center;margin:18px 0}

/* ---------- header ---------- */
#hdr{background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
.hdr-row1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#hdr-title{font-weight:700;font-size:16px}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#timer{font-family:var(--mono);font-size:16px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;min-width:86px;text-align:center}
#timer.warn{color:var(--warn);border-color:var(--warn)}
#timer.crit{color:var(--bad);border-color:var(--bad)}
#pausebar{margin:8px 0 2px;display:flex;gap:8px;flex-wrap:wrap}
.pmsg{display:inline-flex;align-items:center;gap:7px;background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);border-radius:9px;padding:6px 12px;font-size:14px;font-weight:600}
.pmsg.manual{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
.progresswrap{height:10px;background:#0e1626;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 6px}
#progressbar{height:100%;width:0;background:linear-gradient(90deg,#2f6fd1,var(--ok));transition:width .4s ease}
.hdr-row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--tx2)}
#score{font-weight:700;color:var(--tx)}
.tchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
.tchip b{color:var(--tx)}
.kwsub{margin:-4px 0 8px;color:var(--tx2);font-size:14px}

/* ---------- exercise layout ---------- */
.excard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:4px}
.exhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.exnum{font-weight:800;color:var(--acc)}
.extheme{font-size:12.5px;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.expts{margin-left:auto;font-size:13px;color:var(--tx3)}
.block{border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden}
.block .lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:1.1px;color:var(--tx3);background:var(--panel2);padding:7px 12px;border-bottom:1px solid var(--line)}
.block .bd{padding:12px 14px}
.block.scn .lbl{color:var(--acc)}
.block.q .lbl{color:var(--vio)}
.block.ans .lbl{color:var(--ok)}
.block.scn{border-left:4px solid var(--acc)}
.block.q{border-left:4px solid var(--vio)}
.block.ans{border-left:4px solid var(--ok)}
.blurred{filter:blur(9px);pointer-events:none;user-select:none}
.locked{pointer-events:none}

/* ---------- logs / artefacts ---------- */
.logwrap{background:#0a0f1a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.logtitle{font-size:12.5px;color:var(--tx3);font-weight:700;letter-spacing:.6px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filter{min-height:44px;max-width:280px}
.loglines{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:14px;line-height:1.6;max-height:340px;overflow:auto}
.loglines li{white-space:pre-wrap;word-break:break-word;padding:1px 0;border-bottom:1px dotted #1c2740}
.loglines .ln{color:var(--tx3);margin-right:10px;user-select:none}
.loghit{background:#33270f;border-radius:4px}

/* ---------- answers: options ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;min-height:44px;padding:10px 12px;margin:7px 0;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.opt .marker{flex:0 0 auto;font-family:var(--mono);font-weight:700;color:var(--acc)}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt[disabled]{cursor:default}
.stateline{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.ok .stateline{color:var(--ok)}
.opt.bad .stateline{color:var(--bad)}

/* ---------- bank chips / slots (dnd, fill) ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chipbtn{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:14.5px}
.chipbtn.held{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 2px var(--accbg)}
.chipbtn[disabled]{opacity:.5;cursor:default}
.slots{display:grid;gap:10px;margin-top:8px}
.slot{border:2px dashed var(--line2);border-radius:11px;padding:10px 12px;min-height:56px;background:#0e1626;cursor:pointer}
.slot.over{border-color:var(--acc);background:var(--accbg)}
.slot .slbl{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.slot.ok{border-color:var(--ok)}
.slot.bad{border-color:var(--bad)}
.placed{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:4px 6px 4px 12px;margin:3px 5px 3px 0;font-size:14px}
.placed .x{min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--tx2)}
.filltext{font-size:15.5px;line-height:2}
.filltext select{margin:0 3px;font-family:var(--mono);font-size:14px;padding:4px 8px;min-height:44px}
select.ok{border-color:var(--ok);background:var(--okbg)}
select.bad{border-color:var(--bad);background:var(--badbg)}

/* ---------- match ---------- */
.matchwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol .colh{font-size:12.5px;font-weight:700;color:var(--tx3);letter-spacing:1px;margin-bottom:6px}
.mitem{display:block;width:100%;text-align:left;min-height:44px;padding:9px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer}
.mitem.sel{border-color:var(--acc);background:var(--accbg)}
.mitem.ok{border-color:var(--ok);background:var(--okbg)}
.mitem.bad{border-color:var(--bad);background:var(--badbg)}
.mitem[disabled]{cursor:default;opacity:.85}
.pairlist{margin-top:10px}
.pairline{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin:5px 0;font-size:14px;flex-wrap:wrap}
.pairline .x{min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--tx2)}
.pairline .arr{color:var(--acc)}
@media(max-width:720px){.matchwrap{grid-template-columns:1fr}}

/* ---------- ordering ---------- */
.ordlist{list-style:none;margin:8px 0;padding:0}
.rowitem{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;margin:7px 0;cursor:grab;touch-action:none}
.rowitem.dragging{opacity:.55;border-style:dashed}
.rowitem .pos{font-family:var(--mono);font-weight:700;color:var(--acc);min-width:26px;text-align:center}
.rowitem .txt{flex:1}
.rowitem.ok{border-color:var(--ok);background:var(--okbg)}
.rowitem.bad{border-color:var(--bad);background:var(--badbg)}
.mv{min-height:44px;min-width:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer}

/* ---------- terminal ---------- */
.shell{background:#070b13;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:14.5px}
.termhist{margin:0 0 8px;padding:0;list-style:none;white-space:pre-wrap;word-break:break-word;color:var(--tx2)}
.termrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.termrow .pr{color:var(--ok);font-weight:700;white-space:nowrap}
.termrow input{flex:1;min-width:220px}
.helpbox{background:var(--accbg);border:1px solid var(--acc);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:14.5px}
.hintbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:10px 13px;margin:8px 0;font-size:14.5px}

/* ---------- branching ---------- */
.stg{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:#0e1626}
.stg .sth{font-size:12.5px;font-weight:700;letter-spacing:1px;color:var(--vio);margin-bottom:6px}
.outcome{border-left:3px solid var(--acc);background:var(--accbg);border-radius:0 9px 9px 0;padding:8px 12px;margin:8px 0;font-size:14.5px;color:var(--tx2)}

/* ---------- spot the mistake ---------- */
.codelines{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:14px}
.codelines li{margin:4px 0}
.codelines button{display:flex;width:100%;text-align:left;gap:10px;min-height:44px;padding:7px 10px;background:#0a0f1a;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:14px;color:var(--tx)}
.codelines button .ln{color:var(--tx3);min-width:26px}
.codelines button.sel{border-color:var(--acc);background:var(--accbg)}
.codelines button.ok{border-color:var(--ok);background:var(--okbg)}
.codelines button.bad{border-color:var(--bad);background:var(--badbg)}

/* ---------- feedback ---------- */
.fb{margin-top:12px}
.fbline{font-weight:800;font-size:15.5px}
.fbline.good{color:var(--ok)}
.fbline.part{color:var(--warn)}
.fbline.zero{color:var(--bad)}
.elems{margin:8px 0;padding:0;list-style:none}
.elems li{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:14.5px}
.elems .ic{font-weight:800;flex:0 0 auto}
.elems .ic.g{color:var(--ok)} .elems .ic.r{color:var(--bad)}
.explain{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:0 10px 10px 0;padding:11px 14px;margin:10px 0 4px;font-size:15px}
.explain b{color:var(--acc)}
.locknote{font-size:13px;color:var(--tx3);margin-top:6px}

/* ---------- footer nav & navigator ---------- */
#footnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 8px;padding:10px 0 6px}
#footnav .spacer{flex:1}
#navgrid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.ncell{width:44px;height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:13.5px;color:var(--tx2);position:relative}
.ncell.cur{outline:3px solid var(--acc);outline-offset:1px}
.ncell.f{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.ncell.p{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.ncell.z{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.ncell.s{border-style:dashed;border-color:var(--warn);color:var(--warn)}

/* ---------- results ---------- */
.verdict{border-radius:16px;padding:26px 22px;text-align:center;border:1px solid;margin:10px 0}
.verdict.pass{border-color:var(--ok);background:linear-gradient(180deg,#0f2b1a,#0d1a2b)}
.verdict.fail{border-color:var(--bad);background:linear-gradient(180deg,#2b1215,#160f1f)}
.verdict .big{font-size:34px;font-weight:800;letter-spacing:2px}
.verdict.pass .big{color:var(--ok)}
.verdict.fail .big{color:var(--bad)}
.verdict .sub{color:var(--tx2);margin-top:8px}
.verdict .cert{margin:14px auto 0;max-width:460px;background:var(--panel);border:1px dashed var(--ok);border-radius:12px;padding:14px}
.ressum{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.rescard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.rescard .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rlab{font-size:12.5px;font-weight:800;letter-spacing:.8px;border-radius:999px;padding:3px 10px;border:1px solid}
.rlab.full{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.rlab.partial{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.rlab.zero{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.rlab.skipped{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}
.rya,.rca{font-size:14.5px;margin:7px 0}
.rya .k{color:var(--tx3)} .rca .k{color:var(--tx3)}
.rtipline{font-size:14px;color:var(--acc)}

/* ---------- modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(4,7,12,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;max-width:520px;width:100%}
.mbox h3{margin-top:0}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#33270f;border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:11px 18px;z-index:120;max-width:90vw;transition:opacity .3s}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media (max-width:640px){
  #app{padding:10px 10px 40px}
  .excard{padding:12px}
  .hdr-right{margin-left:0}
}

</style>

window.__CFG = {"topicId": "network-plus", "chapter": "3.7", "title": "3.7 Network Services — MEDIUM", "docTitle": "CompTIA Network+ N10-009 — 3.7 Network services — MEDIUM practice exam", "severity": "MEDIUM", "minutes": 80, "passMark": 70, "qcount": 30, "perEx": "≈ 2.7 min per exercise", "goal": "<b>CompTIA Network+ N10-009 — objective 3.7 — network services.</b> This exam drills the whole service set: DHCP (scopes, leases, options, relay, snooping, attacks), SLAAC and IPv6 autoconfiguration, DNS (records, hierarchy, poisoning, DNSSEC, DoT/DoH) and time — NTP strata, PTP precision and NTS security. The MEDIUM and HARD files are two independent exams covering the same keywords from different angles. This file: every exercise is <b>MEDIUM</b> severity.", "howto": ["Each exercise has three separated blocks: <b>SCENARIO</b> (context only), <b>QUESTION</b>, and <b>ANSWERS</b>. Log exercises carry a filter box, like Kibana or Splunk.", "Exercise types: single &amp; multi-choice, matching, ordering, drag-and-drop sorting, fill-in-the-blanks, log analysis, incident walk-throughs and one terminal where you type a real command. Press <b>Check</b> to grade. Multi-answer exercises give <b>partial credit per element</b> — a wrong extra selection does not subtract, but earns nothing.", "Check also <b>pauses the timer in review mode</b>: feedback and the explanation stay fully visible, the clock freezes, and only pressing <b>Next</b> resumes it. The separate <b>Pause</b> button hides/blurs the exercise while paused. The two pauses are independent and can stack.", "<b>Skip</b> moves on and flags the exercise (dashed amber in the navigator). You can return to any exercise until time runs out. At the end, skipped exercises are <b>excluded from scoring</b> — they count in neither the earned points nor the total. A fully skipped exam cannot be submitted.", "<b>Hint</b> costs 1 point on that exercise (10%) and reveals a nudge, never the answer. <b>Revise</b> unlocks a checked exercise window.__MED1 = [
{ id:"M01", th:0, ty:"order", ttl:"Rebuild the DHCPv4 handshake",
  scn:"A junior tech plugs a new laptop into a spare port and starts a packet capture. Four frames flash by in 200 milliseconds — the whole lease negotiation. The capture notes are in the wrong order.",
  q:"Drag the four frames into the order they actually occurred.",
  items:[
    "DHCPDISCOVER — client broadcasts: “any DHCP server out there?” (UDP 68 → 67)",
    "DHCPOFFER — a server proposes an address, mask, lease time and options",
    "DHCPREQUEST — client broadcasts its choice so the losing servers withdraw their offers",
    "DHCPACK — the chosen server confirms; the client may now use the address"
  ],
  hint:"The client always speaks first, and the last word belongs to the server that confirms the lease.",
  tip:"Memorise the four DHCP messages as DORA — and remember REQUEST is a broadcast on purpose, so the losing servers hear it too.",
  xpl:"The DHCPv4 lease exchange is called <b>DORA</b>: Discover, Offer, Request, Acknowledge. The client starts with a broadcast Discover because it has no address yet. Every reachable server answers with an Offer. The client then broadcasts a Request naming the offer it accepted — a broadcast deliberately, so the servers that lost can return their proposed addresses to the pool. Finally the chosen server sends the Ack and the lease is live. Server side listens on UDP <b>67</b>, clients send from UDP <b>68</b>." },

{ id:"M02", th:0, ty:"match", ttl:"Match the DHCP options",
  scn:"You inherit a scope document where the option numbers survived but their meanings were redacted. The helpdesk keeps asking what each number does.",
  q:"Match each DHCP option to its job.",
  pairs:[
    ["Option 3","Default gateway (router) the client should use"],
    ["Option 6","DNS server list for the client"],
    ["Option 15","DNS domain name / search suffix"],
    ["Options 66 / 67","PXE boot server and boot file name"],
    ["Option 150","TFTP server address for Cisco IP phones"],
    ["Option 82","Relay agent information stamped by a switch or relay"]
  ],
  hint:"Two options belong to the phone and PXE world; option 82 is added by the infrastructure, never by the client.",
  tip:"Know options 3, 6, 66/67, 150 and 82 by heart — troubleshooting tickets usually quote the number, not the meaning.",
  xpl:"<b>Option 3</b> hands out the default gateway, <b>option 6</b> the DNS servers and <b>option 15</b> the domain suffix. Network boot rides on <b>options 66 and 67</b> (TFTP server + boot file name), and Cisco VoIP phones learn their TFTP server from <b>option 150</b>. <b>Option 82</b> is different in kind: the relay agent or snooping switch inserts it to say “this request came from this physical port”, which lets the server pick the right pool and lets switch policies work." },

{ id:"M03", th:0, ty:"logview", ctl:"choice", ttl:"The morning the pool ran dry",
  scn:"08:40. The helpdesk queue floods: every new laptop on the staff VLAN gets no address. Old machines still work. You pull the DHCP server log and the lease summary.",
  q:"What is happening, and what is the right first response?",
  logs:[{ src:"dhcpd — lease summary + syslog, Mon 08:40", lines:[
    "pool 10[.]20[.]50[.]0/24: 254 of 254 leases allocated (100% utilisation)",
    "lease 10[.]20[.]50[.]117 { binding state active; hardware ethernet 6e:3f:8a:00:11:22; ends 2026-10-12 08:39; }",
    "lease 10[.]20[.]50[.]118 { binding state active; hardware ethernet 9c:b6:d1:aa:73:0f; ends 2026-10-12 08:39; }",
    "dhcpd: DHCPDISCOVER from 6e:3f:8a:00:11:23 via 10[.]20[.]50[.]1: network 10[.]20[.]50[.]0/24: no free leases",
    "dhcpd: DHCPDISCOVER from 9c:b6:d1:aa:73:10 via 10[.]20[.]50[.]1: network 10[.]20[.]50[.]0/24: no free leases",
    "sw-access-12: %PORTSEC-5-VIOLATION: 43 new MACs learned on Gi1/0/14 within 60 s",
    "dhcpd: total 214 active leases bound to hardware addresses first seen this morning"
  ]}],
  opts:[
    { t:"DHCP starvation — fake MACs drained the pool; find the source port and rate-limit it with snooping", ok:true },
    { t:"Rogue DHCP server: someone plugged in a second server that is now answering clients before the real one", ok:false },
    { t:"Normal growth: the morning shift brought 200 new devices — the pool needs a second scope", ok:false },
    { t:"DHCP relay failure: the ip helper-address on the VLAN interface stopped forwarding requests", ok:false }
  ],
  hint:"Count how many leases belong to hardware addresses nobody has seen before — and read what the switch says about one port.",
  tip:"Starvation is a volume attack with fake MACs; the fix is finding the port and rate-limiting or snooping it, not growing the pool.",
  xpl:"More than 200 leases were grabbed within an hour by MAC addresses that appeared from nowhere, and the switch saw dozens of new MACs per second on a single access port. That is the classic signature of <b>DHCP starvation</b>: a tool requests leases for thousands of invented MACs until the scope is empty and real clients hear “no free leases”. A rogue server would answer offers itself, and honest growth never produces a per-second MAC storm. Enable <b>DHCP snooping</b>, rate-limit DHCP on untrusted ports, and find who is plugged into that port." },

{ id:"M04", th:0, ty:"qcm", ttl:"Read the 169.254 address",
  scn:"A sales laptop shows IPv4 address 169[.]254[.]31[.]9 with mask 255[.]255[.]0[.]0. The user can print to the office printer (same segment) but cannot open the intranet. Yesterday the same laptop worked fine.",
  q:"What does this address tell you?",
  opts:[
    { t:"No DHCP server answered — the laptop gave itself an APIPA address with no gateway", ok:true },
    { t:"The DNS server is down — the laptop cannot resolve any intranet names right now", ok:false },
    { t:"The default gateway is misconfigured and silently drops the laptop's outbound traffic", ok:false },
    { t:"The laptop was moved into the guest VLAN, where only local segment traffic is allowed", ok:false }
  ],
  hint:"The 169.254.x.x range never comes from a server.",
  tip:"See 169.254.x.x → think “DHCP never answered”, then check the server, the relay or the VLAN — not DNS.",
  xpl:"<b>APIPA</b> (Automatic Private IP Addressing) kicks in when a client asks for a lease and no server replies: the host picks a random address in <b>169[.]254[.]0[.]0/16</b> and keeps quietly re-asking for DHCP. An APIPA configuration has no default gateway and no DNS servers, so the intranet is unreachable while same-segment traffic (the printer) still works. DNS or gateway faults would show a normal leased address; the lease itself never arrived, so look at the DHCP path first." },

{ id:"M05", th:0, ty:"branch", ttl:"Walk the “no network” ticket",
  scn:"Monday 08:10. A desktop in the design office is dead to the network — no intranet, no internet. The user swears “it just stopped”. You are at the desk with a console open.",
  q:"Walk the triage. Choose the best action at each step; each step unlocks the next.",
  stages:[
    { p:"First move at the desk?", okT:"Check the physical link and NIC state first",
      opts:[
        { t:"Check the link light / NIC status and run ipconfig", ok:true, out:"Link is up at 1 Gbps. ipconfig shows: IPv4 Address 169[.]254[.]18[.]44, no gateway, no DNS." },
        { t:"Reinstall the network driver from the vendor's website", ok:false, out:"Twenty minutes later the drivers are fresh. Nothing changes — and you still do not know why." },
        { t:"Call the ISP and open a fault ticket for the line", ok:false, out:"The ISP checks their line: fine. The problem is inside your building." },
        { t:"Swap the desk switch for a known-good spare", ok:false, out:"A new switch changes nothing for this one desktop while everyone else on it works." }
      ]},
    { p:"ipconfig shows 169[.]254[.]18[.]44 — an APIPA address. What does that tell you?", okT:"No DHCP offer arrived — the lease request failed",
      opts:[
        { t:"No DHCP offer reached the desktop — the request never got a lease", ok:true, out:"So the DHCP conversation is broken somewhere between this port and the server." },
        { t:"The desktop's DNS cache is poisoned with a bad intranet record", ok:false, out:"DNS cannot matter yet — without a lease there is no resolver configuration at all." },
        { t:"Someone set a static IP that clashes with another device", ok:false, out:"A static configuration would show the configured address, not a 169.254.x.x one." },
        { t:"The default gateway is down and nothing can leave the segment", ok:false, out:"A gateway problem would still leave you with a real, leased address." }
      ]},
    { p:"Best next action?", okT:"Release/renew, then verify the server side (service, scope, relay)",
      opts:[
        { t:"Run ipconfig /release and /renew; if it fails, check the scope, service and relay", ok:true, out:"The renew succeeds once a colleague's disabled test scope is re-enabled — service restored, ticket closed." },
        { t:"Assign a static public IP to bypass DHCP and get the desktop online immediately", ok:false, out:"It half-works for a moment, breaks routing policy — and the real fault stays hidden." },
        { t:"Run ipconfig /flushdns to clear the desktop's resolver cache and retry", ok:false, out:"DNS is not the problem — the desktop has no lease at all." },
        { t:"Disable and re-enable the NIC a few times until a real lease finally appears", ok:false, out:"Busy hands, empty findings — the address comes back as 169.254 every time." }
      ]}
  ],
  hint:"Read which address family the desktop is sitting in before touching anything.",
  tip:"APIPA → walk the DHCP path: renew first, then service, scope, relay, VLAN.",
  xpl:"Good triage goes from cheap to expensive: link state, then address state, then the DHCP path. A <b>169[.]254.x.x</b> APIPA address means <b>no offer ever arrived</b>, so DNS, gateway and driver theories can wait. A release/renew either fixes it or confirms a server-side fault, which you then chase through the DHCP service, the scope for that VLAN and the relay agent (<b>ip helper-address</b>) that carries requests between broadcast domains." },

{ id:"M06", th:0, ty:"fill", ttl:"Read the RA flags",
  scn:"Three VLANs, one router. Each VLAN receives Router Advertisements with a different flag combination. You must explain to the helpdesk how clients get addresses in each one.",
  q:"Complete the three sentences. Every word comes from the bank below (words may look similar).",
  text:"VLAN A: M=0, O=0, A=1 — addresses come from {{0}} alone, built from the advertised prefix. VLAN B: M=1 — addresses now come from {{1}} DHCPv6, where a server keeps state and hands out leases. VLAN C: M=0, O=1 — addresses still come from SLAAC, but {{2}} DHCPv6 supplies the other settings such as DNS servers and the domain name.",
  bank:["SLAAC","stateful","stateless","EUI-64","APIPA","snooping"],
  blanks:[ { a:["SLAAC","slaac"] }, { a:["stateful"] }, { a:["stateless"] } ],
  hint:"M stands for Managed — a server manages the address itself. O only adds the other settings.",
  tip:"M flag = stateful DHCPv6 for addresses; O flag = stateless DHCPv6 for options only; A flag = build an address from this prefix via SLAAC.",
  xpl:"Router Advertisements carry three flags you must read together. <b>A (autonomous)</b> in the Prefix Information option lets hosts build addresses from the prefix themselves — that is <b>SLAAC</b>. <b>M (managed)</b> tells hosts to ask a <b>stateful DHCPv6</b> server for their address, like DHCPv4, with a real lease table on the server. <b>O (other)</b> leaves addressing to SLAAC but sends hosts to DHCPv6 for everything else — DNS, domain — which is called <b>stateless DHCPv6</b>. The M/O/A combination decides, per VLAN, whether you need a full DHCPv6 server or none at all." },

{ id:"M07", th:0, ty:"fill", ttl:"Build a EUI-64 identifier",
  scn:"A host with MAC <code>00:1A:2B:3C:4D:5E</code> uses SLAAC with EUI-64 on prefix <code>2001:db8:1:10::/64</code> (privacy extensions are disabled on this device).",
  q:"Fill in the three missing pieces of the identifier construction.",
  text:"Step 1: split the MAC and insert {{0}} in the middle, giving 00:1A:2B:FF:FE:3C:4D:5E. Step 2: flip the {{1}} bit of the first octet (the U/L bit), so 00 becomes {{2}}. The interface identifier is 021A:2BFF:FE3C:4D5E, so the SLAAC address is 2001:db8:1:10:021a:2bff:fe3c:4d5e.",
  bank:["FF:FE","7th","02","FF:FF","8th","04"],
  blanks:[ { a:["FF:FE","ff:fe","fffe"] }, { a:["7th","seventh","u/l","universal/local"] }, { a:["02","2"] } ],
  hint:"The inserted 16 bits are always the same two bytes, and only one bit — not one byte — gets flipped.",
  tip:"EUI-64 = insert FF:FE in the middle + flip bit 7 of the first octet. To reverse it: un-flip the bit, then remove FF:FE.",
  xpl:"<b>EUI-64</b> stretches a 48-bit MAC into a 64-bit interface identifier in two moves: it inserts the bytes <b>FF:FE</b> in the middle, and it flips the <b>seventh bit</b> of the first octet — the U/L bit that marks vendor-assigned MACs. 00 becomes 02, 01 becomes 03, and so on. The router's RA supplies the /64 prefix and the host glues the two halves together — the same math on the fe80::/10 prefix builds the mandatory link-local address. Because the identifier derives from a stable MAC, modern systems prefer <b>privacy extensions</b> — rotating temporary identifiers — for outbound connections instead." },

{ id:"M08", th:1, ty:"match", ttl:"The record-type zoo",
  scn:"You take over the zone file for corp.example. The previous admin left requirements, not records. Six requirements, six record types.",
  q:"Match each requirement to the record type that fulfils it.",
  pairs:[
    ["Point www.corp.example at IPv4 198[.]51[.]100[.]20","A record"],
    ["Point the same name at IPv6 2001:db8:20::20","AAAA record"],
    ["Make shop.corp.example an alias of www without a second address record","CNAME record"],
    ["Say which server receives mail for the domain, with a priority","MX record"],
    ["Map 198[.]51[.]100[.]25 back to mail.corp.example","PTR record"],
    ["Carry the SPF policy that lists who may send mail for the domain","TXT record"]
  ],
  hint:"Two of the six are about mail, but only one of them lives in the reverse zone.",
  tip:"A/AAAA = address, CNAME = alias, MX = mail exchanger, PTR = reverse, TXT = free text such as SPF/DKIM/DMARC.",
  xpl:"The everyday DNS zoo: <b>A</b> maps a name to an IPv4 address, <b>AAAA</b> to IPv6, <b>CNAME</b> makes one name an alias of another. <b>MX</b> names the mail exchangers, each with a priority number. <b>PTR</b> is the reverse direction — IP back to name — living in the in-addr.arpa (IPv4) or ip6.arpa (IPv6) zones; receiving mail servers love to check it. <b>TXT</b> carries free text, and the anti-spoofing frameworks SPF, DKIM and DMARC are all TXT records at heart." }
];

window.__MED2 = [
{ id:"M09", th:1, ty:"order", ttl:"Follow one lookup down the tree",
  scn:"A laptop asks your corporate resolver for www.example.org. The resolver has an empty cache. You capture everything that follows.",
  q:"Put the five events in the order they happen.",
  items:[
    "The laptop's stub resolver sends a recursive query to the corporate resolver 10[.]20[.]30[.]53",
    "The resolver asks a root server, which answers with a referral to the .org TLD servers",
    "The resolver asks a .org TLD server, which refers it to the authoritative servers for example.org",
    "The resolver asks the authoritative server and finally receives the A record",
    "The resolver caches the answer for its TTL and returns it to the laptop"
  ],
  hint:"The laptop only ever speaks to one server; the tree-walking is done for it, top-down.",
  tip:"Recursive = “bring me the final answer” (client → resolver). Iterative = “best you have now” (resolver → root/TLD/authoritative).",
  xpl:"A client makes one <b>recursive</b> query — “bring me the final answer”. The resolver then walks the hierarchy with <b>iterative</b> queries: the <b>root</b> servers only point at the <b>TLD</b> (.org) servers, the TLD servers only point at the domain's <b>authoritative</b> servers, and the authoritative server finally holds the record. The resolver caches what it learned for the record's <b>TTL</b> — which is why repeat lookups are fast and why a poisoned entry needs a cache flush to heal." },

{ id:"M10", th:1, ty:"logview", ctl:"multi", ttl:"Read the poisoning evidence",
  scn:"A user reports the supplier portal showing a login page with an odd certificate warning. You dump the internal resolver's query log around the incident window.",
  q:"Select every indicator in this log that points to DNS cache poisoning (they feed one incident report — 3 are correct).",
  logs:[{ src:"resolver query log (excerpt)", lines:[
    "11:02:14 query portal.supplier.example A from 10[.]20[.]61[.]7",
    "11:02:14 response portal.supplier.example A 198[.]51[.]100[.]80 ttl 300 (upstream)",
    "11:06:41 query portal.supplier.example A from 10[.]20[.]63[.]2",
    "11:06:41 response portal.supplier.example A 203[.]0[.]113[.]66 ttl 3600 — arrived from source port 53, 9 ms after the query",
    "11:06:41 WARNING: answer for unsent query id 0x3f21 portal.supplier.example accepted into cache",
    "11:07:02 response portal.supplier.example A 198[.]51[.]100[.]80 ttl 300 (upstream) — differs from the cached value",
    "11:09:55 query portal.supplier.example A from 10[.]20[.]61[.]7 (served from cache) 203[.]0[.]113[.]66"
  ]}],
  opts:[
    { t:"Two different answers arrived for the same name within four minutes", ok:true },
    { t:"An answer was accepted for a query the resolver never sent", ok:true },
    { t:"The forged reply came from a fixed source port 53, not a randomised one", ok:true },
    { t:"A TTL of 3600 on one answer is, by itself, proof of poisoning", ok:false },
    { t:"The cache kept serving answers, which shows a SERVFAIL storm is under way", ok:false }
  ],
  hint:"Compare the two answers, look at the source port, and read the warning line about unsent queries.",
  tip:"Poisoning = forged replies that beat the real server: mismatched answers, fixed source ports, replies for unsent queries.",
  xpl:"A poisoning attack races the real server: the attacker floods forged answers hoping one matches the pending query's ID and port before the genuine reply lands. Here the cache silently flipped from 198[.]51[.]100[.]80 to the attacker's 203[.]0[.]113[.]66, the forged packet arrived from source port <b>53</b> (resolvers randomise ports precisely to make guessing hard), and the log explicitly shows an answer accepted for a query that was never sent. A long TTL alone is normal — it just makes a poisoned entry stick longer, which is why flushing the cache and enabling DNSSEC validation are the fixes." },

{ id:"M11", th:1, ty:"fill", ttl:"DoT vs DoH",
  scn:"Management asks why the auditors keep writing about “encrypted DNS” and why the two technologies behave differently at your firewall.",
  q:"Complete the comparison with words from the bank.",
  text:"DoT wraps DNS in a TLS session on TCP port {{0}}, so a firewall can still see and control it as a distinct service. DoH hides DNS inside normal {{1}} traffic on port 443, which is why browsers offering DoH can quietly bypass the internal resolver. Both encrypt the query path; only {{2}} is easy to spot and enforce at the border, because it owns its own port.",
  bank:["853","HTTPS","DoT","443","123","DoH"],
  blanks:[ { a:["853"] }, { a:["https","https/443"] }, { a:["dot"] } ],
  hint:"One port is 443; the other was reserved specifically for DNS over TLS.",
  tip:"DoT = TCP/853, easy to firewall. DoH = HTTPS/443, indistinguishable from web traffic — handle it with browser policy.",
  xpl:"Both <b>DoT</b> (DNS over TLS, TCP <b>853</b>) and <b>DoH</b> (DNS over HTTPS, port <b>443</b>) encrypt DNS between client and resolver, closing the door on casual eavesdropping and on-path tampering. The operational difference is visibility: DoT uses its own port, so you can allow, force or block it cleanly. DoH shares 443 with ordinary web traffic, so a browser can quietly send DNS to a public resolver and bypass your internal controls — a common shadow-IT finding that you handle with browser and endpoint policy rather than firewall rules." },

{ id:"M12", th:2, ty:"logview", ctl:"choice", ttl:"Which peer is the clock using?",
  scn:"Firewall timestamps drifted apart last night and the SOC needs to know which source the border host actually trusts. Wrong time breaks log ordering, Kerberos and TLS certificate checks — this is evidence handling, not clock aesthetics.",
  q:"Which server is the host actually synced to, and why?",
  logs:[{ src:"ntpq -p on border-fw-01", lines:[
    "     remote           refid      st t when poll reach   delay   offset  jitter",
    "==============================================================================",
    "+ntp1.pool.example 172[.]16[.]9[.]5  2 u   45   64  377    0.421    0.512   0.088",
    "*ntp2.pool.example .GPS.            1 u   32   64  377    0.397    0.204   0.113",
    " ntp3.pool.example 172[.]16[.]9[.]9  2 u    -   64    0    0.000    0.000   0.000",
    "-ntp4.pool.example .PPS.            1 u   51   64  177    0.884    1.902   0.401"
  ]}],
  opts:[
    { t:"ntp2 — the starred peer: a GPS stratum 1 source with full reachability (377)", ok:true },
    { t:"ntp3 — the lowest-numbered line in the table is always the system peer", ok:false },
    { t:"ntp1 — a stratum 2 peer wins the election whenever its offset is the smallest", ok:false },
    { t:"ntp4 — a stratum 1 with a PPS refid is always the best source listed", ok:false }
  ],
  hint:"The star marks the peer in use; reach 377 means the last eight polls all worked, and 0 means dead.",
  tip:"In ntpq output: * = current system peer, reach is an octal health bitmap, and a dead stratum 1 loses to a live stratum 2.",
  xpl:"<b>ntpq -p</b> prints the peer table: <b>st</b> is the peer's <b>stratum</b> (distance from the reference clock — 0 is the reference itself, 1 is directly attached, 16 means unsynchronised), <b>reach</b> is a shift register of the last eight polls (377 octal = all eight answered, 0 = no answer), and <b>offset</b> is the clock difference in milliseconds. The <b>*</b> marks the system peer the clock is actually disciplined by — here the GPS-referenced stratum 1 with perfect reach. Time accuracy matters far beyond clocks: certificates, Kerberos tickets and cross-device log correlation all break when offsets grow." },

{ id:"M13", th:0, ty:"dnd", ttl:"Two hats, one rogue server",
  scn:"An attacker on a client VLAN runs a DHCP server on a laptop. Read the same situation from both chairs — what the red team is after, and what the blue team puts in its way.",
  q:"Sort the six statements into the red-team goals and the blue-team controls.",
  slots:[
    { id:"blue", lb:"Blue team — controls that stop it", ks:["c0","c1","c2"] },
    { id:"red",  lb:"Red team — what the attacker is after", ks:["c3","c4","c5"] }
  ],
  chips:[
    { k:"c0", t:"Enable DHCP snooping so OFFER/ACK only pass on the trusted uplink" },
    { k:"c1", t:"Rate-limit DHCP messages on access ports" },
    { k:"c2", t:"Feed the snooping binding table into port security and ARP checks" },
    { k:"c3", t:"Become the default gateway in the offers clients accept" },
    { k:"c4", t:"Exhaust the real pool first, so clients grab the attacker's lease" },
    { k:"c5", t:"Position themselves to read and edit the clients' traffic (machine-in-the-middle)" }
  ],
  hint:"Three chips describe switch defences; three describe the attacker's wish list.",
  tip:"Rogue DHCP = traffic interception. Snooping + rate limits kill the offer path; the binding table powers the follow-on checks.",
  xpl:"A rogue DHCP server wins the race to answer Discover and hands out leases whose <b>option 3 (router)</b> points at the attacker — who can then read and edit everything, a machine-in-the-middle. <b>Starvation</b> is a common opener because an empty pool makes clients grab any offer. The blue-team answer lives on the switch: <b>DHCP snooping</b> marks the port toward the real server as trusted and drops server messages everywhere else, <b>rate limiting</b> blunts the flood, and the <b>binding table</b> snooping builds (MAC ↔ IP ↔ port) feeds downstream checks such as dynamic ARP inspection." },

{ id:"M14", th:0, ty:"branch", ttl:"Day 2 of “Wi-Fi keeps dropping”",
  scn:"The guest Wi-Fi scope 10[.]20[.]70[.]0/24 shows 254/254 leases in use by 09:00 every day this week. The same pool served 90 devices a month ago. The helpdesk has escalated twice.",
  q:"Walk the response. Choose the best action at each step.",
  stages:[
    { p:"What do you confirm first?", okT:"Confirm pool exhaustion and lease ages",
      opts:[
        { t:"Pull the lease table: utilisation, lease ages and unanswered requests", ok:true, out:"All 254 leases are out; 60 requests in the last hour got nothing; most active leases are only hours old." },
        { t:"Reboot both wireless controllers tonight and see whether the drops stop", ok:false, out:"The APs restart, the pool stays empty — the drops continue after lunch." },
        { t:"Add a second /24 pool immediately, before the next complaint wave", ok:false, out:"It would mask the symptom today and double your unknowns tomorrow." },
        { t:"Check the DNS server's load and its average query response time", ok:false, out:"Clients without leases never reach the DNS step." }
      ]},
    { p:"The table shows short-visit phones churning leases. Which knob fixes the cause, not the symptom?", okT:"Shorten the lease time for the guest scope",
      opts:[
        { t:"Shorten the guest scope's lease so abandoned leases return quickly", ok:true, out:"With a 1-hour lease, morning churn returns addresses before noon; utilisation settles near 40%." },
        { t:"Lower the TTL on the guest SSID so its records age out faster", ok:false, out:"TTL is a DNS concept — it has no effect on DHCP leases." },
        { t:"Disable APIPA on the clients so they show real addresses instead", ok:false, out:"APIPA is the symptom of getting nothing, not the cause of the shortage." },
        { t:"Move the whole guest network to static addressing, device by device", ok:false, out:"Unmanageable and insecure for guests — the opposite of the goal." }
      ]},
    { p:"Which long-term guard keeps this from sneaking up again?", okT:"Monitor scope utilisation with alerts",
      opts:[
        { t:"Graph scope utilisation and alert at 80% so you act before users notice", ok:true, out:"A week later the alert fires at 82% during a conference — you add a scope in calm conditions." },
        { t:"Raise every lease time from 8 h to 24 h so clients churn much less", ok:false, out:"Churn was not the enemy — holding dead leases longer makes exhaustion more likely." },
        { t:"Disable DHCP snooping on the guest VLAN to speed up leasing", ok:false, out:"Snooping has nothing to do with pool size, and removing it reopens the rogue-server door." },
        { t:"Track utilisation by hand in a spreadsheet and check it when tickets arrive", ok:false, out:"Until the next conference. Then it will not." }
      ]}
  ],
  hint:"Utilisation hits 100% by 09:00 with short-visit devices — ask how fast addresses come back.",
  tip:"Scope exhaustion → lease time + utilisation monitoring; guest churn or growth is the usual cause, not an attacker.",
  xpl:"<b>Scope exhaustion</b> is a capacity fault, not automatically an attack: short <b>lease times</b> with high churn drain a pool, while long leases with dead devices pin it. The cure matches the cause — shorten leases for guest scopes, grow or add scopes, and watch <b>utilisation with an alert</b> well before 100%. Exclusions and reservations shape the pool; superscopes group scopes on one wire. Reboots and DNS knobs do nothing, because the fault is arithmetic: more requests than free addresses." },

{ id:"M15", th:0, ty:"fill", ttl:"Make the relay work",
  scn:"Clients on VLAN 20 broadcast into a broadcast domain that holds no DHCP server. The server sits at 10[.]20[.]100[.]5, two hops away. You are on the router's CLI.",
  q:"Complete the three blanks.",
  text:"The router's VLAN 20 interface needs {{0}} pointing at 10[.]20[.]100[.]5, so the clients' broadcast becomes a unicast to UDP port {{1}} on the server. The relay also stamps option {{2}} into the request, telling the server which pool should answer.",
  bank:["ip helper-address","67","82","68","snooping","starvation"],
  blanks:[ { a:["ip helper-address","helper-address","ip helper"] }, { a:["67"] }, { a:["82"] } ],
  hint:"The command lives on the router interface; the ports are the classic DHCP pair.",
  tip:"Relay = ip helper-address on the client-facing interface, forwarded to UDP 67, with option 82 identifying the circuit.",
  xpl:"DHCP requests are broadcasts — they die at the router. A <b>DHCP relay agent</b>, configured as <b>ip helper-address</b> on the client-facing interface, converts the broadcast into a unicast aimed at UDP port <b>67</b> on the real server, and the reply rides back the same way. The relay inserts <b>option 82</b> (relay agent information) so the server knows which interface the request came from and can pick the matching scope. Client-side DHCP uses port <b>68</b> — the 67/68 pair is worth memorising." },

{ id:"M16", th:0, ty:"dnd", ttl:"Trusted or untrusted?",
  scn:"You are about to enable DHCP snooping on a production access switch. Before touching it, you must classify every port class on the box.",
  q:"Sort the port classes into the two snooping categories.",
  slots:[
    { id:"t", lb:"Trusted ports", ks:["c0","c1"] },
    { id:"u", lb:"Untrusted ports", ks:["c2","c3","c4","c5"] }
  ],
  chips:[
    { k:"c0", t:"The uplink toward the switch where the real DHCP server connects" },
    { k:"c1", t:"The port toward the router acting as DHCP relay (ip helper)" },
    { k:"c2", t:"An access port where a staff PC connects" },
    { k:"c3", t:"Any port that must never emit OFFER or ACK messages" },
    { k:"c4", t:"A port where a second unknown DHCP device appears — its server messages get dropped" },
    { k:"c5", t:"A conference-room port that guests use" }
  ],
  hint:"Only paths toward genuine DHCP authority are trusted; everything a client touches is untrusted.",
  tip:"Snooping: trusted = toward the server/relay; untrusted = everything else — server messages dropped, clients rate-limited.",
  xpl:"<b>DHCP snooping</b> splits every port into two classes. <b>Trusted</b>: only the links that may carry server traffic — the uplink to the real server or to the relay agent. <b>Untrusted</b>: every port where clients sit; OFFER/ACK arriving there are dropped as rogue behaviour, DISCOVER/REQUEST from clients still pass, and rate limits blunt starvation floods. Snooping also builds the binding table (MAC, IP, lease, port) that other protections such as dynamic ARP inspection rely on — so getting the trust classification right is the foundation of layer-2 hygiene." }
];

{ id:"M17", th:1, ty:"dnd", ttl:"Two views of one zone",
  scn:"corp.example runs split-horizon DNS: staff and the internet see different truths for the same names. The new DNS admin must learn which records belong to which view.",
  q:"Sort the statements into the two views.",
  slots:[
    { id:"in", lb:"Internal view (served to staff)", ks:["c1","c3","c5"] },
    { id:"ex", lb:"External view (served to the internet)", ks:["c0","c2","c4"] }
  ],
  chips:[
    { k:"c0", t:"www.corp.example → 198[.]51[.]100[.]20 (public web server)" },
    { k:"c1", t:"intranet.corp.example → 10[.]20[.]5[.]30 (private, office-only)" },
    { k:"c2", t:"MX → mail-gw.corp.example, a public relay in the DMZ" },
    { k:"c3", t:"vpn.corp.example → 10[.]20[.]0[.]15 (concentrator inside the firewall)" },
    { k:"c4", t:"Only public services exist here; private names are absent entirely" },
    { k:"c5", t:"Includes RFC1918 addresses that must never be visible from outside" }
  ],
  hint:"One view knows private address space; the other must not leak a single byte of it.",
  tip:"Split-horizon DNS = two answers for one name: private maps inside, public maps outside, and the two must never leak into each other.",
  xpl:"<b>Split-horizon (split) DNS</b> runs two views of the same zone: inside, names resolve to <b>private RFC1918 addresses</b> such as 10[.]x; outside, only the public services appear with public addresses, and internal-only names do not exist at all. The payoff is correctness — staff reach intranet apps over short paths — and hygiene: the outside world learns nothing about your internal layout. The classic misconfiguration is a leaked view — an external client receiving a 10[.]x answer — which is why the two views are administered separately and audited on the public interface." },

{ id:"M18", th:1, ty:"multi", ttl:"The mail rollout's DNS bills",
  scn:"corp.example starts sending mail from its own server mail.corp.example (198[.]51[.]100[.]25). Within days, partners complain that messages land in spam folders, and one partner rejects them outright.",
  q:"Select every record the mail rollout genuinely needs (5 are correct).",
  opts:[
    { t:"An MX record for corp.example pointing at the mail.corp.example host", ok:true },
    { t:"TXT record with the SPF policy listing the addresses allowed to send", ok:true },
    { t:"A DKIM public key published as a TXT record under selector._domainkey", ok:true },
    { t:"DMARC TXT record at _dmarc with a policy and a reporting address", ok:true },
    { t:"A PTR record for 198[.]51[.]100[.]25 inside the block's reverse zone", ok:true },
    { t:"A CNAME pointing mail.corp.example at the web host www.corp.example", ok:false },
    { t:"NS records pointing the zone at the partner's nameserver ns1.partner.example", ok:false }
  ],
  hint:"Two distractors are aliases and delegations that do nothing to prove your mail is legitimate.",
  tip:"Mail reputation stack: MX (receive), SPF/DKIM/DMARC (prove senders), PTR (the reverse lookup receivers check).",
  xpl:"Receiving mail needs an <b>MX</b> record. Proving you may send needs the anti-spoofing trio: <b>SPF</b> (a TXT record listing allowed senders), <b>DKIM</b> (a TXT record holding the public key that verifies each message's signature) and <b>DMARC</b> (a TXT record telling receivers what to do when those fail, plus where to send reports). Receivers also run a <b>PTR</b> lookup on your IP and expect it to resolve back to the sending host — forward-confirmed reverse DNS. A CNAME to the web server and foreign NS records contribute nothing to any of this." },

{ id:"M19", th:0, ty:"match", ttl:"Scope vocabulary",
  scn:"A new hire keeps mixing up five DHCP terms in tickets: “I excluded a reservation in the superscope”, they write. Time for vocabulary drills.",
  q:"Match each term to its definition.",
  pairs:[
    ["Scope","The address range a server may hand out on a network"],
    ["Reservation","A fixed address always given to one specific MAC address"],
    ["Exclusion","Addresses inside the range that must never be leased"],
    ["Lease","How long a client may keep the address before renewing"],
    ["Superscope","Bundles several scopes to serve multiple subnets on one physical wire"]
  ],
  hint:"One term is about identity (MAC), one about time, one about packaging.",
  tip:"Scope = the pool, reservation = MAC-bound address, exclusion = a hole in the pool, lease = the time limit, superscope = grouping.",
  xpl:"A <b>scope</b> is the pool of addresses a server can give out on a segment. A <b>reservation</b> pins one address to one client MAC — printers and cameras love it. An <b>exclusion</b> carves addresses out of the scope because other devices hold them statically. The <b>lease</b> is the time limit: at 50% (<b>T1</b>) the client renews with its server, at 87.5% (<b>T2</b>) it broadcast-rebinds to any server, and at expiry it must stop using the address. A <b>superscope</b> is administrative packaging that lets one server serve several scopes on the same physical network." },

{ id:"M20", th:2, ty:"dnd", ttl:"NTP or PTP?",
  scn:"The infrastructure review has one open question: which time protocol belongs where? You must brief the platform team with a clean sorting exercise.",
  q:"Sort the eight statements into the two protocols.",
  slots:[
    { id:"ntp", lb:"NTP fits here", ks:["c0","c1","c2","c3"] },
    { id:"ptp", lb:"PTP fits here", ks:["c4","c5","c6","c7"] }
  ],
  chips:[
    { k:"c0", t:"Millisecond accuracy is plenty for logs and Kerberos" },
    { k:"c1", t:"Runs over UDP port 123 on ordinary servers" },
    { k:"c2", t:"Hierarchy measured in stratum numbers" },
    { k:"c3", t:"The default time service on nearly every OS" },
    { k:"c4", t:"Sub-microsecond accuracy with hardware timestamping" },
    { k:"c5", t:"Defined by IEEE 1588 for industrial and telecom networks" },
    { k:"c6", t:"Elects a grandmaster with the BMCA algorithm" },
    { k:"c7", t:"Needs switches that act as boundary or transparent clocks" }
  ],
  hint:"One side tolerates milliseconds; the other buys precision with special hardware.",
  tip:"NTP = software, strata, UDP 123, good enough for most. PTP (IEEE 1588) = hardware timestamps, grandmaster/BC/TC, sub-microsecond.",
  xpl:"<b>NTP</b> is the internet's clock: hierarchical <b>strata</b>, UDP <b>123</b>, software timestamps — routinely within tens of milliseconds, which is fine for log correlation, Kerberos and scheduling. <b>PTP</b> (Precision Time Protocol, <b>IEEE 1588</b>) targets sub-microsecond: timestamps are taken in the network hardware, and switches participate as <b>boundary clocks</b> (terminate and regenerate) or <b>transparent clocks</b> (correct the residence-time delay). The best clock is elected <b>grandmaster</b> through the <b>BMCA</b> comparison. Telecom 5G fronthaul, trading floors and factory automation buy PTP; everybody else is happy with NTP." },

{ id:"M21", th:1, ty:"logview", ctl:"choice", ttl:"Someone asks for the whole zone",
  scn:"You are skimming the query log of ns1, your public authoritative server, during a routine review. One client catches your eye.",
  q:"What happened, and what is the correct posture?",
  logs:[{ src:"/var/log/named/queries.log — public ns1", lines:[
    "client 198[.]51[.]100[.]14#43110 (corp.example): query: corp.example IN AXFR",
    "client 198[.]51[.]100[.]14#43110 (corp.example): zone transfer (AXFR) denied: not authorized",
    "client 82[.]19[.]44[.]7#52001 (corp.example): query: www.corp.example IN A",
    "client 82[.]19[.]44[.]7#52001 (corp.example): query: shop.corp.example IN A",
    "client 198[.]51[.]100[.]14#43120 (corp.example): query: corp.example IN AXFR denied (repeat, 40 s later)",
    "client 92[.]204[.]11[.]90#33912 (corp.example): query: _dmarc.corp.example IN TXT"
  ]}],
  opts:[
    { t:"An outside host probed for a zone transfer and was denied — keep AXFR restricted to secondaries", ok:true },
    { t:"This is normal secondary replication: the partner server pulls the zone every few minutes", ok:false },
    { t:"Clients are failing to resolve public names — the server is in the middle of a SERVFAIL storm", ok:false },
    { t:"The DMARC record is missing from the public zone, so the partner's mail is rejected", ok:false }
  ],
  hint:"AXFR from a stranger is reconnaissance: one “denied” line decides the verdict.",
  tip:"AXFR dumps an entire zone to anyone allowed — restrict it to real secondaries with ACLs and TSIG keys.",
  xpl:"<b>AXFR</b> is the full <b>zone transfer</b> a secondary uses to copy a zone. In the wrong hands it is a gift: every hostname, every address — a complete map for later attacks. The correct posture is to allow transfers only to your real secondaries, protected by ACLs and ideally <b>TSIG</b> transaction signatures, and to let everything else fail (the incremental <b>IXFR</b> follows the same rule). Here the server did exactly that — denied, twice — so the action is verification and monitoring, not firefighting. On Windows DNS the same check lives in the zone's zone-transfer properties." },

{ id:"M22", th:0, ty:"order", ttl:"The life and death of a lease",
  scn:"A workstation received its lease at 08:00 with a 24-hour lease time. The DHCP server will be taken offline for maintenance this afternoon — for how long, nobody knows yet. You explain the client-side timeline to the intern.",
  q:"Order the five stages of the lease's lifecycle from the client's point of view.",
  items:[
    "T=0 — DHCPACK grants the lease; the client starts using the address",
    "T1 (50% of the lease) — the client unicasts a renewal to its original server",
    "T2 (87.5%) — no answer yet, so the client broadcasts a rebind to any DHCP server",
    "Lease expires with no renewal — the client must stop using the address",
    "Still nothing — the client self-assigns an APIPA 169[.]254.x.x address"
  ],
  hint:"Half the lease, then almost all of it, then the cliff.",
  tip:"T1 = unicast renew (50%), T2 = broadcast rebind (87.5%), expiry → stop using it, then APIPA if the silence continues.",
  xpl:"The lease clock has two checkpoints. At <b>T1 — half the lease</b> — the client politely renews with the server that gave it the address (unicast, cheap). At <b>T2 — 87.5%</b> — it broadcasts to <b>any</b> server (rebind) because the original has not answered. If even that fails, the lease <b>expires</b>: the client must drop the address, and continued silence lands it in <b>APIPA</b>. Long leases mean fewer renewals but slow recovery after changes; short leases recover fast but add traffic — the exact trade-off you tuned in the exhaustion walk-through." },

{ id:"M23", th:2, ty:"match", ttl:"Speak NTP fluently",
  scn:"A consultant's report is full of words you must be able to use precisely: stratum, drift, offset, peer, broadcast, step. The ops team wants one cheat-sheet pairing.",
  q:"Match each term to its meaning.",
  pairs:[
    ["Stratum","Distance from the reference clock: 0 is the reference itself, 16 means unsynchronised"],
    ["Drift","The slow, steady error of a local clock, corrected via a frequency file"],
    ["Offset","The current difference between local time and the source's time"],
    ["Symmetric peer","Two NTP servers that exchange time as equals for mutual backup"],
    ["Broadcast mode","A server pushes time to a whole LAN segment — handy, less accurate"],
    ["Step vs slew","Big corrections jump the clock at once; small ones ease it in gradually"]
  ],
  hint:"Three words describe numbers you see in peer tables; three describe modes and correction behaviour.",
  tip:"Stratum = hierarchy depth, drift = frequency error, offset = time difference; peer/broadcast are NTP modes; step/slew is correction style.",
  xpl:"<b>Stratum</b> counts hops from the reference: atomic/GPS references are stratum 0, servers attached to them are 1, each hop adds one; 15 is the last usable level and 16 means “not synchronised”. <b>Drift</b> is the systematic rate error of your oscillator, compensated via a drift file; <b>offset</b> is how far your clock is from its source right now. NTP speaks in modes: <b>client/server</b>, <b>symmetric peer</b> — equal partners backing each other up — and <b>broadcast</b> for whole segments. Correction style matters too: small offsets are <b>slewed</b> in gently, but past the step threshold (~128 ms) the clock <b>steps</b> abruptly — and stepping can interrupt things that measure time." }
];

{ id:"M24", th:2, ty:"qcm", ttl:"What NTS actually buys you",
  scn:"An auditor asks why the firm's time protocol needs an upgrade from plain NTP, given that “the clocks look fine”.",
  q:"What does NTS add over plain NTP?",
  opts:[
    { t:"Proof that time packets are authentic, unmodified and not replayed", ok:true },
    { t:"Sub-microsecond clock accuracy on par with PTP hardware timestamping", ok:false },
    { t:"A new UDP port that replaces port 123 for all time traffic", ok:false },
    { t:"Automatic stratum renumbering for misconfigured NTP servers", ok:false }
  ],
  hint:"NTS does not chase precision — it chases trust.",
  tip:"NTS = NTP + cryptographic authentication (RFC 8915): TLS key exchange, cookies, replay protection. Accuracy stays NTP-grade.",
  xpl:"Plain NTP trusts its responders; a fake server or an on-path editor can shift your clocks — quietly breaking certificates, Kerberos and log evidence. <b>NTS</b> (Network Time Security, RFC 8915) bolts authentication onto NTP: a TLS key exchange (<b>NTS-KE</b> on TCP <b>4460</b>) hands the client cookies and keys, then normal NTP on port 123 carries extension fields protected with <b>AEAD</b>, and a unique identifier per query defeats <b>replays</b>. Accuracy is unchanged — NTS is about proving who answered and that nobody altered the answer, not about being faster." },

{ id:"M25", th:0, ty:"multi", ttl:"APIPA truths and myths",
  scn:"Two interns blame “a DHCP virus” because several lab machines show 169.254.x.x addresses. You turn the moment into a myth-busting exercise.",
  q:"Select every true statement about APIPA (4 are correct).",
  opts:[
    { t:"Self-assigned from 169[.]254[.]0[.]0/16 when no DHCP answer arrives", ok:true },
    { t:"No gateway or DNS servers are set, so only the local segment works", ok:true },
    { t:"The host keeps quietly retrying DHCP in the background", ok:true },
    { t:"Hosts ARP-probe first to avoid two devices picking the same address", ok:true },
    { t:"APIPA ranges are forbidden by RFC 3927 on production networks", ok:false },
    { t:"APIPA addresses are routed normally across the public internet", ok:false },
    { t:"An APIPA address on a host is proof that the DNS server is broken", ok:false }
  ],
  hint:"Three distractors blame the wrong subsystem or invent routing powers.",
  tip:"APIPA = link-local self-addressing after DHCP silence: local-only, gateway-less, self-probed, and DHCP keeps being retried.",
  xpl:"APIPA is the IPv4 client's fallback after <b>DHCP silence</b>: it picks an address in <b>169[.]254[.]0[.]0/16</b>, first probing with ARP so two hosts do not collide — the same spirit as IPv6's Duplicate Address Detection. The configuration is deliberately crippled: <b>no gateway, no DNS</b>, local segment only, while the client <b>keeps asking for DHCP</b> in the background. It says nothing about drivers or DNS health, and link-local space is never routed — if you see it fleet-wide, suspect the DHCP service, the relay or the VLAN, not the hosts." },

{ id:"M26", th:0, ty:"multi", ttl:"Autoconfiguration mechanics",
  scn:"After a router upgrade, some VLANs changed address behaviour overnight. You rebuild the team's understanding of the RA flag system.",
  q:"Select every true statement about IPv6 address autoconfiguration (4 are correct).",
  opts:[
    { t:"M=1 tells clients to request addresses from a stateful DHCPv6 server", ok:true },
    { t:"O=1 keeps SLAAC addressing but fetches other settings via DHCPv6", ok:true },
    { t:"A=1 in a prefix option lets hosts build addresses from that prefix", ok:true },
    { t:"Privacy extensions rotate temporary addresses so the MAC is not tracked", ok:true },
    { t:"SLAAC requires a stateful DHCPv6 server to hand out the prefix every time", ok:false },
    { t:"EUI-64 interface identifiers rotate automatically every 24 hours", ok:false },
    { t:"DAD proves that the DHCPv6 server is reachable and healthy", ok:false }
  ],
  hint:"Two distractors swap roles: prefixes come from the router, and rotation is the privacy extensions' job.",
  tip:"RA flag rules: A = SLAAC from prefix, M = stateful DHCPv6 address, O = stateless DHCPv6 options; DAD checks neighbours, not servers.",
  xpl:"IPv6 autoconfiguration is a contract written in <b>RA flags</b>. The router advertises prefixes with <b>A=1</b>; hosts build addresses themselves (<b>SLAAC</b>, often EUI-64-based, ideally hidden behind <b>privacy extensions</b> that rotate temporary addresses). <b>M=1</b> switches addressing to <b>stateful DHCPv6</b> — a real server with real leases. <b>O=1</b> is the middle road: SLAAC address, DHCPv6 for options (<b>stateless DHCPv6</b>). <b>DAD</b> — Duplicate Address Detection — is neighbour-level housekeeping done before using any address; it never involves a DHCP server." },

{ id:"M27", th:1, ty:"fill", ttl:"Delegate a subzone",
  scn:"The branch office team gets its own DNS namespace: branch.corp.example, served by their nameserver ns1.branch.corp.example at 10[.]20[.]40[.]11. You own the parent zone.",
  q:"Complete the delegation (one word or record name per blank).",
  text:"In the parent zone you add an {{0}} record naming ns1.branch.corp.example, plus the glue {{1}} record mapping that name to 10[.]20[.]40[.]11. Every time the child team edits its zone it must raise the {{2}} in its SOA, so your secondaries notice and pull the changes.",
  bank:["NS","A","serial","PTR","CNAME","TTL"],
  blanks:[ { a:["ns","ns record"] }, { a:["a","a record"] }, { a:["serial"] } ],
  hint:"Delegation record, its address (the glue), and the SOA counter that says “zone changed”.",
  tip:"Delegation = NS + glue A in the parent; the child bumps the SOA serial so secondaries pull (IXFR/AXFR).",
  xpl:"Delegating a subzone takes two records in the <b>parent</b>: an <b>NS</b> record saying “branch.corp.example is answered by ns1.branch.corp.example” and the matching <b>glue A</b> record so resolvers can reach that nameserver without a chicken-and-egg lookup. Inside the child, every edit bumps the <b>serial</b> in the SOA record — secondaries compare serials and pull a transfer (<b>IXFR</b> incremental, <b>AXFR</b> full) only when it rises. Forget the serial bump and your secondaries serve yesterday's zone while the primary looks perfectly healthy." },

{ id:"M28", th:1, ty:"dnd", ttl:"Three jobs in DNS hardening",
  scn:"An audit report lists six DNS controls in a single unstructured paragraph. The platform team asks you to explain what each one is actually for.",
  q:"Sort the controls into the three buckets.",
  slots:[
    { id:"enc",  lb:"Encrypts the DNS traffic", ks:["c0","c1"] },
    { id:"auth", lb:"Proves records are genuine", ks:["c2","c3"] },
    { id:"ops",  lb:"Protects the resolver / zone service", ks:["c4","c5"] }
  ],
  chips:[
    { k:"c0", t:"DoT — DNS over TLS on TCP 853" },
    { k:"c1", t:"DoH — DNS over HTTPS on TCP 443" },
    { k:"c2", t:"DNSSEC signatures validated up the chain (DS · DNSKEY · RRSIG)" },
    { k:"c3", t:"Signed zones so poisoned answers fail validation" },
    { k:"c4", t:"Response rate limiting against reflection and floods" },
    { k:"c5", t:"AXFR restricted to secondaries with TSIG keys" }
  ],
  hint:"Two chips per bucket; “genuine” is about signatures, not encryption.",
  tip:"Three protections, three jobs: encrypt (DoT/DoH), authenticate (DNSSEC), keep the service safe (RRL, locked-down AXFR).",
  xpl:"DNS hardening comes in three flavours that do not substitute for each other. <b>Encryption</b> (DoT on 853, DoH on 443) hides queries from onlookers but does not prove the answer is true. <b>DNSSEC</b> does the truth part: zones are signed, resolvers validate the <b>DS → DNSKEY → RRSIG</b> chain from the root down, and forged answers fail validation. <b>Service protection</b> keeps DNS itself alive: response rate limiting blunts abuse as an amplifier, and zone transfers locked to known secondaries with <b>TSIG</b> stop zone dumping. Audits find these separately — plan them separately." },

{ id:"M29", th:1, ty:"terminal", ttl:"Terminal: query the MX records",
  scn:"You are on the ops jump host; its resolver is already configured to reach the internal DNS servers.",
  q:"Ask DNS for the mail exchangers of corp.example, in short form (names and priorities only).",
  pr:"analyst@jump",
  help:"Use a <code>dig</code> command. Required: the domain <code>corp.example</code>, the record type <code>MX</code>, and the <code>+short</code> flag. Expected output shape:<br><code>10 mail.corp.example.</code><br><code>20 mail2.corp.example.</code>",
  acc:["^dig\\b(?=[^;\\n]*\\bcorp\\.example\\b)(?=[^;\\n]*\\bmx\\b)(?=[^;\\n]*\\+short)[^\\n]*$"],
  accEx:"dig corp.example MX +short",
  hint:"dig DOMAIN TYPE +short — dig accepts the type and flags in either order.",
  tip:"dig +short MX domain is the daily query; without +short you get the full answer section with headers and extra comments.",

function blockEl(cls, label, extra){
  var b = el('div','block ' + cls);
  var l = el('div','lbl','<span>' + label + '</span>' + (extra ? '<span style="margin-left:auto;font-weight:400;letter-spacing:0">' + extra + '</span>' : ''));
  var bd = el('div','bd');
  b.appendChild(l); b.appendChild(bd);
  return b;
}

function buildRt(ex){
  var ty = ex.ty, rt = {};
  if (ty === 'qcm' || ty === 'multi' || ty === 'logview'){
    rt.opts = sh(ex.opts.map(function(o, i){ return { key:'o'+i, t:o.t, ok:!!o.ok }; }));
  }
  if (ty === 'match'){
    rt.left = sh(ex.pairs.map(function(p, i){ return { key:'L'+i, t:p[0] }; }));
    rt.right = sh(ex.pairs.map(function(p, i){ return { key:'R'+i, t:p[1] }; }));
    rt.selL = null;
  }
  if (ty === 'order'){
    rt.seq = sh(ex.items.map(function(_, i){ return 'I'+i; }));
  }
  if (ty === 'dnd'){ rt.chips = sh(ex.chips.slice()); rt.held = null; }
  if (ty === 'fill'){ rt.words = sh(ex.bank); }
  if (ty === 'branch'){ rt.stageOpts = ex.stages.map(function(st){ return sh(st.opts.map(function(o, i){ return { key:'s'+i, t:o.t, ok:!!o.ok, out:o.out }; })); }); }
  if (ty === 'spot'){ rt.rs = sh(ex.rs.map(function(o, i){ return { key:'r'+i, t:o.t, ok:!!o.ok }; })); }
  return rt;
}

function emptyAns(ex){
  switch (ex.ty){
    case 'qcm': return { k:null };
    case 'multi': return { ks:[] };
    case 'match': return { pairs:{} };
    case 'order': return { seq:null, touched:false };
    case 'dnd': return { place:{} };
    case 'fill': return { vals:{}, touched:false };
    case 'logview': return ex.ctl === 'multi' ? { ks:[] } : { k:null };
    case 'branch': return { pick:{} };
    case 'terminal': return { cmd:'' };
    case 'spot': return { line:null, r:null };
  }
  return {};
}

function collectAnswer(i, ex){
  var a = S.ans[i];
  if (!a) return null;
  switch (ex.ty){
    case 'qcm': return a.k != null ? a : null;
    case 'multi': return a.ks.length ? a : null;
    case 'match': return Object.keys(a.pairs).length ? a : null;
    case 'order': return (a.touched && a.seq) ? a : null;
    case 'dnd': return Object.keys(a.place).length ? a : null;
    case 'fill': return a.touched ? a : null;
    case 'logview': return (ex.ctl === 'multi' ? a.ks.length : a.k != null) ? a : null;
    case 'branch': return Object.keys(a.pick).length ? a : null;
    case 'terminal': {
      /* grade what is actually in the input box right now (typed, run, or edited after run).
         An empty input never overwrites a command that was already Run. */
      var tin = document.getElementById('term-in-' + i);
      if (tin && typeof tin.value === 'string' && tin.value.trim()) a.cmd = tin.value;
      return (a.cmd && String(a.cmd).trim()) ? a : null;
    }
    case 'spot': return (a.line != null || a.r) ? a : null;
  }
  return null;
}

/* ---------- drag helper (pointer events: mouse + touch) ---------- */
function makeDrag(handle, getLabel, onDrop){
  handle.addEventListener('pointerdown', function(ev){
    if (ev.button !== undefined && ev.button !== 0) return;
    if (ev.target.closest('button,select,input,a')) return;
    ev.preventDefault();
    var startX = ev.clientX, startY = ev.clientY, moved = false;
    var g = el('div', null, esc(getLabel()));
    g.style.cssText = 'position:fixed;z-index:200;pointer-events:none;background:#18223a;border:1px solid #5aa7ff;border-radius:10px;padding:6px 12px;font-size:14px;color:#eaeef7;max-width:300px';
    document.body.appendChild(g);
    handle.classList.add('dragging');
    function mv(e){
      g.style.left = (e.clientX + 12) + 'px'; g.style.top = (e.clientY + 10) + 'px';
      if (Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY) > 6) moved = true;
      var t = document.elementFromPoint(e.clientX, e.clientY);
      var d = t && t.closest('.droppable');
      Array.prototype.forEach.call(document.querySelectorAll('.droppable.over'), function(x){ x.classList.remove('over'); });
      if (d) d.classList.add('over');
    }
    function up(e){
      document.removeEventListener('pointermove', mv);
      document.removeEventListener('pointerup', up);
      var t = document.elementFromPoint(e.clientX, e.clientY);
      var d = t && t.closest('.droppable');
      g.remove(); handle.classList.remove('dragging');
      Array.prototype.forEach.call(document.querySelectorAll('.droppable.over'), function(x){ x.classList.remove('over'); });
      if (moved){ handle.__dragged = true; if (d) onDrop(d.getAttribute('data-drop')); }
    }
    document.addEventListener('pointermove', mv);
    document.addEventListener('pointerup', up);
  });
}

/* ---------- per-type answer UIs ---------- */
/* Restore keyboard focus to the same control after a repaint (WCAG focus order). */
function repaintKeepFocus(root, fn){
  var ae = document.activeElement;
  var fk = (ae && root && root.contains(ae) && ae.getAttribute) ? ae.getAttribute('data-fk') : null;
  fn();

    var n = root.querySelector('[data-fk="' + fk.replace(/"/g, '\\"') + '"]');

}
