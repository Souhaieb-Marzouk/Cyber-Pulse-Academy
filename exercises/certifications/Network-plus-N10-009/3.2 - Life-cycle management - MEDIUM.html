  question:`<p>Which statement about the AX-2400 fleet is <b>correct</b>?</p>`,
  options:[
    { k:'A', html:'After 30 Nov 2026 the switches stop receiving security patches.', note:'30 Nov 2026 is the end-of-SALE date. Patches continue until end of support.' },
    { k:'B', html:'The switches still receive security patches until 30 Nov 2028.', note:'Correct — end of support (EOS) is the last day for patches and RMA.' },
    { k:'C', html:'The switches must be powered off on the announcement date in June 2026.', note:'An EOL announcement is a warning, not a shutdown order. You get a planning window.' },
    { k:'D', html:'The vendor will keep adding new features to software 7.2 until 2028.', note:'7.2 is the FINAL release. Only fixes arrive after it — never new features.' }
  ],
  correct:['B'],
  hint:'Separate the two dates: one is about buying, the other one is about patching.',
  explain:`<p>End of life (EOL) starts the warning clock. End of sale is the last day you can buy the product, and end of support (EOS) is the last day the vendor supplies patches, firmware fixes and RMA. Here the fleet keeps receiving security patches until 30 Nov 2028, so a replacement project can be planned calmly until then.</p>`,
  tip:'EOL = the announcement. End of sale = last order day. EOS = last patch day. Learn to tell the three apart in bulletins.' },

/* ── M02 ── order: hardware lifecycle milestones */
{ id:'M02', t:'Order the hardware lifecycle milestones', theme:'Hardware & vendor lifecycle', kw:['EOL','EOS','end of sale','last-time buy','decommissioning','replacement planning'],
  points:5, type:'order',
  scenario:`<p>You are documenting the standard life of a network appliance for your asset-management procedure. Junior staff keep mixing the order of the milestones.</p>`,
  question:`<p>Place the five milestones in the order they normally happen for a hardware product.</p>`,
  items:[
    { k:'a', html:'Vendor publishes the EOL notice', t:'Vendor publishes the EOL notice', why:'The vendor warns customers first so they can plan.' },
    { k:'b', html:'Last-time buy window closes (final orders accepted)', t:'Last-time buy window closes', why:'After the EOL notice there is a final ordering window before end of sale.' },
    { k:'c', html:'End of sale — the product can no longer be purchased', t:'End of sale', why:'Sales stop; existing devices keep working and stay supported.' },
    { k:'d', html:'End of support — final patch and last day of vendor assistance', t:'End of support (EOS)', why:'This is the risk date: after EOS no security fixes arrive at all.' },
    { k:'e', html:'Fleet is decommissioned, sanitised and disposed of', t:'Fleet decommissioned and disposed', why:'Once support ends, planned replacement and disposal close the life.' }
  ],
  hint:'Ask for each step: does it happen in the shop (buying) or after the boxes are already running?',
  explain:`<p>The vendor speaks first: the EOL notice opens the exit path. Then the last-time buy window closes, sales end, and only later does support end. Decommissioning happens on YOUR calendar, ideally before or shortly after EOS. Knowing this order lets you read any vendor bulletin and plan budget, migration and disposal in the right sequence.</p>`,
  tip:'Timeline rule: announce → last buy → last ship → last patch → your disposal.' },

/* ── M03 ── slots bins: disposal decision matrix */
{ id:'M03', t:'Choose the right disposal method for each device', theme:'Decommissioning & sanitisation', kw:['data sanitisation','wiping','purging','degaussing','destruction','recycling','repurposing','media sanitisation'],
  points:6, type:'slots', mode:'bins',
  scenario:`<p>Decommissioning day at <b>Corex Logistics</b>. The change ticket lists six devices and media that must leave the server room today. The data owner requires that no readable company data leaves the building, but working equipment must not be wasted either.</p>`,
  question:`<p>Assign each item to the correct handling method. Every item has exactly one best method.</p>`,
  bank:[
    { k:'t1', html:'Healthy 1 TB HDD from the retired file server, staying inside the company (moves to the training lab)', aria:'Healthy HDD staying in the company', why:'Reused internally, so a verified overwrite (wiping) is enough.' },
    { k:'t2', html:'Self-encrypting drive returned to the vendor under warranty RMA', aria:'Self-encrypting drive for RMA', why:'A cryptographic erase destroys the keys, so the drive leaves without readable data.' },
    { k:'t3', html:'Broken HDD that cannot spin up, holds payroll records', aria:'Broken HDD with payroll data', why:'It cannot be wiped reliably, so physical destruction is the only guarantee.' },
    { k:'t4', html:'Magnetic backup tapes that will be reused for new backups', aria:'Magnetic tapes to be reused', why:'Degaussing purges magnetic media so it can safely start a new life.' },
    { k:'t5', html:'Retired firewall appliance chosen as the router for the Wi-Fi lab', aria:'Firewall to become lab router', why:'The box gets a new internal job — that is repurposing, not disposal.' },
    { k:'t6', html:'USB sticks collected from a conference floor, to be handed out to staff', aria:'Found USB sticks', why:'Never trust found media: no wipe can prove what it carried, so destroy it.' }
  ],
  slots:[
    { label:'Wipe (overwrite + verify)', accept:['t1'], ph:'drop item', aria:'Wipe and reuse' },
    { label:'Purge (degauss / crypto erase)', accept:['t2','t4'], ph:'drop item', aria:'Purge' },
    { label:'Purge (degauss / crypto erase)', accept:['t2','t4'], ph:'drop item', aria:'Purge' },
    { label:'Destroy (shred / incinerate)', accept:['t3','t6'], ph:'drop item', aria:'Destroy' },
    { label:'Destroy (shred / incinerate)', accept:['t3','t6'], ph:'drop item', aria:'Destroy' },
    { label:'Repurpose (new internal role)', accept:['t5'], ph:'drop item', aria:'Repurpose' }
  ],
  hint:'Three items stay in the company, but only one of them may be reused after a simple overwrite. Two items must be destroyed — and one of those never belonged to you.',
  explain:`<p>Media sanitisation has three levels. Wiping (overwriting) suits media that stays inside the company. Purging — degaussing for magnetic media or a cryptographic erase for self-encrypting drives — suits media that leaves your control but stays usable. Destruction (shredding, incineration) is for media that cannot be trusted or cannot be wiped, including found USB sticks. Repurposing is not a sanitisation method; the appliance is still sanitised first, then given a new role.</p>`,
  tip:'Ask two questions: does the media leave the company, and can it still be wiped reliably?' },

/* ── M04 ── slots fill: software management policy */
{ id:'M04', t:'Complete the software change policy', theme:'Software management', kw:['patch','test environment','software validation','rollback','maintenance window','change management'],
  points:5, type:'slots', mode:'fill',
  scenario:`<p>The network team at <b>Brightpath Schools</b> must publish the software management section of their operations handbook. Several words were lost when the document was converted.</p>`,
  question:`<p>Drag the five missing terms into the policy text. Two tiles are decoys.</p>`,
  text:`<p>All software changes follow our change management process. Every {{0}} is first installed in the {{1}} and must pass {{2}} tests before rollout. A tested {{3}} plan must exist before the {{4}} opens, and the whole activity is recorded as a change request in the ticket system.</p>`,
  bank:[
    { k:'w1', html:'patch', aria:'patch', why:'A patch is a regular, tested update — the object of the whole policy.' },
    { k:'w2', html:'test environment', aria:'test environment', why:'Changes are proven outside production first.' },
    { k:'w3', html:'validation', aria:'validation', why:'Validation checks that the service really works after the change.' },
    { k:'w4', html:'rollback', aria:'rollback', why:'A rollback plan is the documented way back if the change fails.' },
    { k:'w5', html:'maintenance window', aria:'maintenance window', why:'The approved time slot when users expect possible disruption.' },
    { k:'d1', html:'hotfix', aria:'hotfix (decoy)', why:'A hotfix is an urgent single-bug fix — not the general word needed here.' },
    { k:'d2', html:'purge', aria:'purge (decoy)', why:'Purging belongs to data sanitisation, not to software rollout.' }
  ],
  slots:[
    { accept:'w1', label:'first blank', aria:'blank 1' },
    { accept:'w2', label:'second blank', aria:'blank 2' },
    { accept:'w3', label:'third blank', aria:'blank 3' },
    { accept:'w4', label:'fourth blank', aria:'blank 4' },
    { accept:'w5', label:'fifth blank', aria:'blank 5' }
  ],
  hint:'The sentence already names the change process. Think: what is installed, where is it installed first, how do we prove it works, how do we undo it, and when may we touch production?',
  explain:`<p>A mature software management policy has a fixed loop: the patch goes to a test environment, passes validation, and only then reaches production inside an approved maintenance window — always with a rollback plan ready. Recording everything as a change request gives the company an audit trail. The two decoys do not fit: a hotfix is a special urgent case, and purging is for media disposal, not software.</p>`,
  tip:'Test → validate → window → rollback. If a policy sentence is missing one of these, it is incomplete.' },

/* ── M06 ── branch: patch rollout workflow */
{ id:'M06', t:'Roll out the switch firmware patch', theme:'Software management', kw:['patch','test environment','validation','rollback','backout plan','maintenance window','change management','firmware'],
  points:5, type:'branch',
  scenario:`<p>You are the network engineer at <b>Verdant Grid Utilities</b>. The vendor released firmware 8.1(4) fixing two security bugs in your 40 access switches. You own the rollout from reading the notes to closing the ticket.</p>`,
  question:`<p>Step through the rollout. Pick the option a disciplined engineer would choose at each step.</p>`,
  steps:[
    { q:'The release notes mention a breaking change to the PoE power budget for cameras. What do you do first?',
      options:[
        { html:'Note the impact, check which switches feed cameras, and plan the change around it.', ok:true, fb:'Reading and acting on release notes is exactly the pre-work that prevents outages.' },
        { html:'Deploy on Friday evening so the weekend acts as a safety buffer.', ok:false, fb:'A PoE change can kill cameras; deploying blindly into a weekend leaves you short-handed to react.' },
        { html:'Skip the notes — the vendor tested the image on their side.', ok:false, fb:'Vendor testing cannot know YOUR camera load. Release notes exist for your environment.' }
      ]},
    { q:'Where does the new image get tested first?',
      options:[
        { html:'In the test environment on the same hardware model, with cameras attached.', ok:true, fb:'Same-model staging with real peripherals catches the PoE surprise safely.' },
        { html:'In production, starting with the quietest switch.', ok:false, fb:'“Quiet” production is still production. One bad image can spread by accident.' },
        { html:'Firmware does not need testing, only operating-system patches do.', ok:false, fb:'Firmware IS software running the hardware — it needs the same test discipline.' }
      ]},
    { q:'What must exist before the maintenance window opens?',
      options:[
        { html:'An approved change request, a config backup, and a tested backout plan with the rollback image ready.', ok:true, fb:'Approval, backup and a way back are the minimum gate before touching production.' },
        { html:'Just a ticket number so the helpdesk can be told.', ok:false, fb:'A number is not an approval, and without a rollback path a failure becomes an outage.' },
        { html:'A verbal ok from whichever colleague answers first.', ok:false, fb:'Change management exists so the right people accept the risk — verbally is not auditable.' }
      ]},
    { q:'During the window, 3 of 40 switches fail to boot the new image. What now?',
      options:[
        { html:'Execute the rollback plan on those three, keep the window on track, then investigate.', ok:true, fb:'Rollback first, diagnose later: the window’s job is a predictable, reversible change.' },
        { html:'Continue with the other 37 and leave the three broken ones for next week.', ok:false, fb:'That leaves the fleet split across images — untestable and unauditable.' },
        { html:'Immediately roll back the entire fleet, including the 37 healthy switches.', ok:false, fb:'Only the failing units need the rollback; a full rollback wastes the validated work.' }
      ]}
  ],
  hint:'Each step asks the same question in disguise: how do we keep this change reversible and observable?',
  explain:`<p>A patch rollout is a controlled loop: read the notes, test in the test environment, gate the window behind change management with a rollback plan, and when something fails, roll back only what failed. This order keeps every step reversible and keeps the fleet on one known-good image, which is also what an auditor will ask to see.</p>`,
  tip:'Never let a change reach production without: notes read, staging proof, approval, backup, rollback.' },

/* ── M07 ── spot: decommissioning runbook mistakes */
{ id:'M07', t:'Spot the mistakes in the decommissioning runbook', theme:'Decommissioning & sanitisation', kw:['decommissioning','documentation','wiping','port activation','decommissioning review','certificate of destruction','CMDB'],
  points:4, type:'spot',
  scenario:`<p>A junior colleague drafted the runbook for decommissioning old core switch <b>core-sw01</b>. Your security policy requires proper documentation, data sanitisation and port hygiene. Three lines break the policy.</p>`,
  question:`<p>Select the <b>3</b> faulty lines.</p>`,
  lines:[
    { html:'Open a change ticket for the decommissioning work.', bad:false, why:'Every decommissioning starts with a ticket — that is correct.' },
    { html:'Migrate all running services to the new core switch and verify traffic.', bad:false, why:'Migration and verification come before touching the old box.' },
    { html:'Delete core-sw01 from the CMDB right now so nobody routes work to it.', bad:true, why:'You UPDATE the record (state, removal date, disposal), never delete history — the audit trail must survive.' },
    { html:'Run a verified three-pass overwrite on the internal drives.', bad:false, why:'A verified overwrite is proper wiping for reusable media.' },
    { html:'Quick-format the drives instead — a format makes the data unrecoverable.', bad:true, why:'A quick format only removes the file table; the data blocks remain readable with simple tools.' },
    { html:'Disable and label the uplinks and unused ports after migration.', bad:false, why:'Good port hygiene: no live, forgotten ports left behind.' },
    { html:'Leave the management port enabled until the recycler collects the switch.', bad:true, why:'A live management port on a queued device is an unmonitored way into the network (port-activation risk).' },
    { html:'Update the network diagrams and IPAM records.', bad:false, why:'Documentation must match reality when the device leaves.' },
    { html:'File the certificate of destruction with the asset record.', bad:false, why:'The certificate is your proof of proper disposal for audits.' }
  ],
  hint:'One mistake destroys history, one only hides data, one leaves a door open.',
  explain:`<p>Deleting the CMDB entry destroys the audit trail — records are updated, not erased. A quick format hides files but does not remove the data; only a real wipe, purge or destruction counts as sanitisation. And an enabled management port on a device waiting for disposal is an unmonitored entry point — the classic port activation risk. Ports are shut and labelled before the device leaves the rack. Everything else in the draft follows the policy.</p>`,
  tip:'For every runbook line ask: does this keep evidence, sanitise data, and close every port?' },

/* ── M08 ── slots pairs: software terms */
{ id:'M08', t:'Match the software terms to their meanings', theme:'Software management', kw:['hotfix','upgrade','patch','rollback','software validation'],
  points:5, type:'slots', mode:'pairs',
  scenario:`<p>New helpdesk staff keep confusing the vocabulary of software maintenance. You build a matching drill for their onboarding.</p>`,
  question:`<p>Match each definition to its term.</p>`,
  bank:[
    { k:'p1', html:'hotfix', aria:'hotfix', why:'A small, urgent fix for one specific defect — shipped outside the normal cycle.' },
    { k:'p2', html:'upgrade', aria:'upgrade', why:'Moving to a newer major version that brings new features.' },
    { k:'p3', html:'patch', aria:'patch', why:'A regular update that fixes bugs or security issues within a version.' },
    { k:'p4', html:'rollback', aria:'rollback', why:'Going back to the previous version after a failed change.' },
    { k:'p5', html:'validation', aria:'validation', why:'Testing that the system behaves correctly after a change.' }
  ],
  slots:[
    { label:'A small, urgent fix for one specific bug', accept:'p1', ph:'drop term' },
    { label:'Moving to a newer major version with new features', accept:'p2', ph:'drop term' },
    { label:'A regular, tested update that fixes bugs or security issues', accept:'p3', ph:'drop term' },
    { label:'Returning to the previous software version after a failure', accept:'p4', ph:'drop term' },
    { label:'Checking that the system works correctly after a change', accept:'p5', ph:'drop term' }
  ],
  hint:'Two of the terms change the software; two of them respond to events; one of them proves the state.',
  explain:`<p>Patch, hotfix and upgrade all change software, but at different speeds and sizes: patches are routine, hotfixes are urgent single-defect fixes, upgrades move major versions. Rollback is the response to a failed change, and validation is the proof that the current state works. Keep the five apart and every change ticket becomes easier to write and to audit.</p>`,
  tip:'Urgent single bug = hotfix. New features = upgrade. Routine fix = patch.' },

/* ── M09 ── QCM: EOS firewall next step */
{ id:'M09', t:'The firewall nobody patched any more', theme:'Hardware & vendor lifecycle', kw:['EOS','replacement planning','third-party support','firmware'],
  points:2, type:'choice', multi:false,
  scenario:`<p>An internal audit finds that perimeter firewall <b>fw-edge01</b> passed end of support eight months ago. It still filters traffic fine, the vendor will ship nothing new, and a third-party support quote was rejected as too expensive. A replacement is in the budget for next quarter.</p>`,
  question:`<p>What is the best <b>next step</b>?</p>`,
  options:[
    { k:'A', html:'Assess exposure, add compensating controls, record a dated risk acceptance.', note:'Correct — you reduce risk now and make the residual risk a formal, visible decision.' },
    { k:'B', html:'Keep it running as is; end of support only means no new features.', note:'EOS means no security fixes at all — an exploitable flaw on the perimeter would stay open for ever.' },
    { k:'C', html:'Wipe and decommission it today so the risk disappears at once.', note:'The perimeter still needs a firewall; removing it creates an outage, not a solution.' },
    { k:'D', html:'Chase the rejected third-party support quote weekly until somebody signs it.', note:'Third-party support can be a legitimate bridge, but nagging is not a control — nothing on the device changes.' }
  ],
  correct:['A'],
  hint:'You cannot patch it and you cannot remove it yet. What CAN you still change this week?',
  explain:`<p>An EOS device on the perimeter is a risk you must manage, not ignore. The professional path is: assess how exposed it is, add compensating controls (strict rules, restricted management, monitoring), and record a formal risk acceptance with an end date that matches the replacement plan. Decommissioning without a successor breaks the network; doing nothing leaves an unpatchable box facing the internet with no paper trail.</p>`,
  tip:'When you cannot fix it: reduce exposure, monitor it, and get the risk signed off with a deadline.' },

/* ── M10 ── slots pairs: sanitisation methods */
{ id:'M10', t:'Match each sanitisation method to its action', theme:'Decommissioning & sanitisation', kw:['wiping','degaussing','cryptographic erase','destruction','media sanitisation','purging'],
  points:5, type:'slots', mode:'pairs',
  scenario:`<p>The disposal team must label their tooling correctly for the upcoming audit. The auditor will check that staff know what each method actually does to the media.</p>`,
  question:`<p>Match each method to what it really does.</p>`,
  bank:[
    { k:'m1', html:'Wiping (overwriting)', aria:'wiping', why:'Writes patterns over every sector so the old files are gone; media stays usable.' },
    { k:'m2', html:'Degaussing', aria:'degaussing', why:'A powerful magnetic field scrambles magnetic media, destroying the data.' },
    { k:'m3', html:'Cryptographic erase', aria:'cryptographic erase', why:'Destroys the encryption keys of an encrypted drive; the ciphertext stays but is unreadable.' },
    { k:'m4', html:'Shredding', aria:'shredding', why:'Cuts the media into pieces — a form of physical destruction.' },
    { k:'m5', html:'Incineration', aria:'incineration', why:'Burns the media at high temperature — also physical destruction.' }
  ],
  slots:[
    { label:'Overwriting every sector with patterns so old files are gone', accept:'m1', ph:'drop method' },
    { label:'Using a strong magnetic field to scramble magnetic media', accept:'m2', ph:'drop method' },
    { label:'Destroying the encryption keys so an encrypted drive is unreadable', accept:'m3', ph:'drop method' },
    { label:'Cutting media into small pieces', accept:'m4', ph:'drop method' },
    { label:'Burning media at high temperature', accept:'m5', ph:'drop method' }
  ],
  hint:'One method leaves the drive perfectly usable, one leaves only ciphertext, two leave nothing at all.',
  explain:`<p>Overwriting keeps the media alive and removes the data — the classic wipe. Degaussing and cryptographic erase are purge methods: the media may survive, but its data is gone either by scrambled magnetism or by destroyed keys. Shredding and incineration are destruction: the media itself ends. Choosing the right level is the heart of media sanitisation — strong enough for the data, sensible for the media.</p>`,
  tip:'Wipe = reuse. Purge = keys or magnetism. Destroy = the media dies.' },

/* ── M11 ── text: two vendor terms */
{ id:'M11', t:'Name the two vendor dates', theme:'Hardware & vendor lifecycle', kw:['end of sale','EOS'],
  points:2, type:'text',
  scenario:`<p>A procurement officer asks you to explain the two lifecycle dates every vendor bulletin uses. She wants the exact standard terms, not paraphrases.</p>`,
  question:`<p>Type the standard terms. Small spelling differences are accepted.</p>`,
  inputs:[
    { label:'The date a vendor stops SELLING a product', accept:['end of sale','end-of-sale','end of sales'], ph:'two words', why:'End of sale is the ordering deadline — after it, no new units.' },
    { label:'The date the vendor stops security patches and support', accept:['end of support','end-of-support','eos'], ph:'three words or acronym', why:'End of support (EOS) is the last day for patches, firmware and help.' }
  ],
  hint:'One is about the shop, one is about the lab. “Sale” versus “support”.',
  explain:`<p>End of sale is a purchasing milestone: the last day to order the product. End of support is the risk milestone: after that date no patches, firmware fixes or vendor help arrive. Bulletins always list both, and confusing them makes you either buy too late or panic too early.</p>`,
  tip:'Sale = money. Support = patches. Never swap them in a ticket.' },

/* ── M12 ── multi: decommissioning review contents */
{ id:'M12', t:'What belongs in the decommissioning review?', theme:'Decommissioning & sanitisation', kw:['decommissioning review','documentation','IPAM','certificate of destruction','audit trail'],
  points:3, type:'choice', multi:true,
  scenario:`<p>The decommissioning of storage array <b>san-old02</b> is finished: data sanitised, device collected, ticket nearly closed. Your lead calls the decommissioning review meeting and asks you to prepare the agenda.</p>`,
  question:`<p>Select the <b>3</b> items that belong on the agenda of a decommissioning review.</p>`,
  options:[
    { k:'A', html:'Order the replacement storage array.', note:'Procurement is a different process with different owners; the review looks back at the decommissioning.' },
    { k:'B', html:'Confirm network diagrams and IPAM match reality after the removal.', note:'Correct — documentation drift after removals is a classic source of future outages.' },
    { k:'C', html:'Wipe all the disks again to be extra safe.', note:'Sanitisation was already done and verified; re-wiping a device that already left is impossible anyway.' },
    { k:'D', html:'Record lessons learned for the next decommissioning project.', note:'Correct — the review exists to improve the process, not just to close the ticket.' },
    { k:'E', html:'Check the certificate of destruction is filed with the asset record.', note:'Correct — the review verifies the evidence chain before final closure.' }
  ],
  correct:['B','D','E'],
  hint:'The review looks backward: what the records say, what was learned, and whether the evidence is filed.',
  explain:`<p>A decommissioning review closes the loop. It verifies that documentation (diagrams, IPAM, CMDB) matches the new reality, that disposal evidence like the certificate of destruction is filed and retrievable, and it collects lessons learned so the next decommissioning runs better. Buying replacements and repeating finished work belong to other meetings.</p>`,
  tip:'Review = records match, evidence filed, lessons written down.' },

/* ── M13 ── slots fill: decommissioning report */
{ id:'M13', t:'Fill the decommissioning report', theme:'Decommissioning & sanitisation', kw:['decommissioning','wiping','recycling','IPAM','decommissioning review'],
  points:5, type:'slots', mode:'fill',
  scenario:`<p>Change <b>CHG-4102</b> removed the old core switch. The report draft below lost five words. Two tiles in the bank are decoys.</p>`,
  question:`<p>Restore the report with the correct terms.</p>`,
  text:`<p>Decommissioning report — CHG-4102: after services migrated and traffic was verified, the old core switch was {{0}}. Its supervisor drives were {{1}} using a verified three-pass overwrite. The appliance was then handed to a certified {{2}} partner for compliant disposal. Inventory, diagrams and {{3}} records were updated the same day, and the {{4}} meeting closed the change.</p>`,
  bank:[
    { k:'r1', html:'decommissioned', aria:'decommissioned', why:'The formal word for taking a device out of production in a controlled way.' },
    { k:'r2', html:'wiped', aria:'wiped', why:'A verified overwrite is wiping — exactly what three passes describe.' },
    { k:'r3', html:'recycling', aria:'recycling', why:'A certified recycling partner disposes of e-waste under environmental rules.' },
    { k:'r4', html:'IPAM', aria:'IPAM', why:'IP address records must match reality once the device is gone.' },
    { k:'r5', html:'review', aria:'review', why:'The decommissioning review is the closing meeting of the process.' },
    { k:'d1', html:'purged', aria:'purged (decoy)', why:'Three overwrite passes on reusable drives is wiping; purging is degaussing or crypto erase.' },
    { k:'d2', html:'repurposed', aria:'repurposed (decoy)', why:'The appliance went to disposal, not to a new internal role.' }
  ],
  slots:[
    { accept:'r1', label:'blank 1', aria:'blank 1' },
    { accept:'r2', label:'blank 2', aria:'blank 2' },
    { accept:'r3', label:'blank 3', aria:'blank 3' },
    { accept:'r4', label:'blank 4', aria:'blank 4' },
    { accept:'r5', label:'blank 5', aria:'blank 5' }
  ],
  hint:'Wiping and purging are different levels. Which one matches “three-pass overwrite”?',
  explain:`<p>The report tells the sanitisation story in the right words: the switch was decommissioned (taken out of service under change control), its drives were wiped (a verified overwrite — purging would mean degaussing or a cryptographic erase), and the hardware went to a certified recycling partner. Updating IPAM and inventory keeps the documentation honest, and the review meeting formally closes the process.</p>`,
  tip:'Overwrite = wiped. Degauss or crypto erase = purged. Shred = destroyed.' },

/* ── M14 ── order: minor software rollout */
{ id:'M14', t:'Order the software rollout steps', theme:'Software management', kw:['change management','test environment','regression testing','pilot','maintenance window','documentation','patch'],
  points:5, type:'order',
  scenario:`<p>The application team will ship a minor update of the internal logistics app to 200 users. Your operations handbook lists six steps, but the new coordinator shuffled the cards.</p>`,
  question:`<p>Put the six steps in the correct order.</p>`,
  items:[
    { k:'s1', html:'Raise the change request (change management / CAB review)', t:'Raise the change request', why:'Approval comes first so the whole effort is authorised and auditable.' },
    { k:'s2', html:'Install and test the package in the test environment', t:'Test in the test environment', why:'The package is proven on non-production systems before any user sees it.' },
    { k:'s3', html:'Run regression tests on the key features', t:'Run regression tests', why:'Regression tests prove the old features still work beside the new ones.' },
    { k:'s4', html:'Deploy to a small pilot group of real users', t:'Deploy to a pilot group', why:'A pilot exposes real-world surprises with only a few people affected.' },
    { k:'s5', html:'Full rollout to everyone inside the maintenance window', t:'Full rollout in the window', why:'With evidence in hand, the mass rollout happens in the agreed window.' },
    { k:'s6', html:'Validate the services and update the documentation', t:'Validate and document', why:'The change is only done when it is verified and the records match.' }
  ],
  hint:'Approval, then lab, then old-features proof, then a small crowd, then everyone, then paperwork.',
  explain:`<p>The order encodes risk control: nothing happens without an approved change request; the package proves itself in the test environment; regression testing protects the features users already depend on; the pilot gives early warning with limited blast radius; the full rollout rides in a maintenance window; and validation plus documentation close the loop. Skipping a step always returns as an outage or an audit finding.</p>`,
  tip:'Ask at every step: if this goes wrong now, how many people notice?' },

{ id:'M15', t:'Count the unsupported assets', theme:'Inventory & governance', kw:['EOS','asset inventory','CMDB','replacement planning'],

  artifacts:[{ label:'CMDB export — network assets', kind:'table', filter:true, body:
`<span class="hl-k">ASSET      TEAM        STATUS                 REPL_DUE</span>
AST-0388   core        <span class="hl-b">EOS 2025-02-28</span>          2027-01-31
AST-0451   edge        <span class="hl-b">EOS 2024-11-30</span>          2026-12-31
AST-0512   branch      current                2028-06-30
AST-0499   branch      <span class="hl-w">EOL notice, EOS 2027-03-31</span>  2027-02-28
AST-0533   edge        <span class="hl-b">EOS 2026-06-30</span>          2027-06-30

  question:`<p>Answer from the register. Both answers are plain text.</p>`,

  explain:`<p>Three rows carry an EOS date in the past: AST-0388, AST-0451 and AST-0533 — these run today with no security patches at all. AST-0499 only has an EOL notice, so support still runs until 2027. Among the three EOS rows, AST-0451 has the earliest replacement-due date (2026-12-31) and the oldest EOS date, which is why it heads the urgency list. Reading a register this way is the daily bread of lifecycle management.</p>`,
  tip:'EOL notice ≠ unsupported. Only a past EOS date means zero patches today.' },

/* ── M16 ── branch: EOL announcement response */
{ id:'M16', t:'Respond to an EOL announcement', theme:'Hardware & vendor lifecycle', kw:['EOL','CMDB','risk acceptance','replacement planning','EOS'],
  points:5, type:'branch',
  scenario:`<p>The vendor email lands at 09:14: the 30 access switches of the <b>Meridian Health</b> branch estate will reach end of support in 22 months. You are the network lead; nothing is broken today.</p>`,
  question:`<p>Choose the professional response at each step.</p>`,
  steps:[
    { q:'The EOL email is open on your screen. First action?',
      options:[
        { html:'Confirm in the CMDB exactly which assets and firmware versions are affected.', ok:true, fb:'You scope the problem from your own records before spending a cent.' },
        { html:'Order 30 replacement switches the same morning.', ok:false, fb:'Maybe only 22 of the 30 are affected, or the estate was refreshed last year — guessing burns budget.' },
        { html:'Archive the email and move on; EOL notices are informational only.', ok:false, fb:'An EOL notice is the starting gun for a 22-month project. Archiving it wastes the whole runway.' }
      ]},
    { q:'Who turns the notice into a plan, and how?',
      options:[
        { html:'You draft a replacement plan with costs and dates and send it to management for budget.', ok:true, fb:'Lifecycle risk is a business decision: management needs numbers to allocate money.' },
        { html:'Swap the switches for spares quietly over the next months.', ok:false, fb:'Spares are a bridge, not a plan — and silent fleet changes break change management.' },
        { html:'Wait until the devices fail, then react.', ok:false, fb:'Waiting turns a planned replacement into emergency outages, typically after EOS.' }
      ]},
    { q:'What keeps the risk low during the 22 months until EOS?',
      options:[
        { html:'Keep applying vendor patches to the final release and restrict unplanned changes.', ok:true, fb:'Supported devices that stay patched and calm are exactly what the vendor promises until EOS.' },
        { html:'Power the switches off now to be safe.', ok:false, fb:'The branch needs its network today; powering off converts risk into a guaranteed outage.' },
        { html:'Turn off logging to reduce load on the aging units.', ok:false, fb:'Reducing visibility on aging devices hides exactly the incidents you fear most.' }
      ]},
    { q:'Where does the residual risk live until replacement day?',
      options:[
        { html:'In the risk register, with a formal risk acceptance and a review date before EOS.', ok:true, fb:'A dated risk acceptance makes the decision visible, owned and reviewable.' },
        { html:'Nowhere — an EOL notice is purely informational.', ok:false, fb:'Unrecorded risk is unmanaged risk; the auditor will ask where it was written down.' },
        { html:'Only inside the vendor portal account.', ok:false, fb:'The vendor portal belongs to the vendor. Your risk lives in your own register.' }
      ]}
  ],
  hint:'Scope it from your records, cost it for management, keep it patched meanwhile, and write the risk down.',
  explain:`<p>A well-run EOL response has four beats: scope from the CMDB, plan and budget with management, keep devices patched until EOS, and record a risk acceptance with a review date. Each beat exists because its alternatives fail in a specific way: guesswork wastes money, silence wastes runway, unpatched aging gear invites exploitation, and unrecorded risk cannot be governed.</p>`,
  tip:'The CMDB tells you WHAT is affected; the risk register tells the company WHY it is acceptable for now.' },

/* ── M17 ── QCM: hotfix */
{ id:'M17', t:'Name that tiny urgent fix', theme:'Software management', kw:['hotfix','patch','upgrade','rollback'],
  points:2, type:'choice', multi:false,
  scenario:`<p>A critical vulnerability in your VPN appliance is being exploited in the wild. At 16:40 the vendor ships a small, targeted fix that addresses exactly this one defect. The vendor’s normal monthly patch train is next week.</p>`,
  question:`<p>What is this small, targeted fix called?</p>`,
  options:[
    { k:'A', html:'A service pack', note:'A service pack bundles many fixes and usually ships on a slow, planned cycle.' },
    { k:'B', html:'A backout plan', note:'A backout plan is documentation for undoing a change — not a software artefact.' },
    { k:'C', html:'An urgent hotfix', note:'Correct — one urgent defect, one small fix, shipped outside the normal cycle.' },
    { k:'D', html:'A firmware upgrade', note:'An upgrade is a larger move to a newer version, not a one-defect emergency fix.' }
  ],
  correct:['C'],
  hint:'The fix is urgent, small and targeted at a single defect.',
  explain:`<p>A hotfix is a minimal, urgent correction for one specific defect, released outside the normal patch cycle because waiting would leave a live hole. A service pack collects many fixes, an upgrade changes the version level, and a backout plan is the documented way to undo a change. Hotfixes still deserve testing and a rollback path — urgency changes the pace, not the discipline.</p>`,
  tip:'One bug, urgent, small = hotfix. Everything bigger has another name.' },

/* ── M18 ── slots bins: maintenance window tasks */
{ id:'M18', t:'Sort the maintenance window tasks', theme:'Software management', kw:['maintenance window','rollback','validation','documentation','change management'],
  points:6, type:'slots', mode:'bins',
  scenario:`<p>Tonight is the monthly maintenance window for the switching stack. The runbook printed its tasks in random order. You sort them before starting.</p>`,
  question:`<p>Place each task in the phase where it belongs.</p>`,
  bank:[
    { k:'b1', html:'Notify users about the outage window', aria:'Notify users', why:'Communication happens before anyone touches a device.' },
    { k:'b2', html:'Take a config backup / snapshot of every node', aria:'Backup configs', why:'The backup is your rollback material — created before the change.' },
    { k:'b3', html:'Apply the patch to the stack members', aria:'Apply patch', why:'The change itself belongs to the window, never before it.' },
    { k:'b4', html:'Run the validation test list and watch the logs', aria:'Validate', why:'Validation runs immediately after the change, still inside the window.' },
    { k:'b5', html:'Execute the rollback plan if a critical test fails', aria:'Rollback if needed', why:'Rollback is a during-the-window activity with its own trigger criteria.' },
    { k:'b6', html:'Update documentation and close the change ticket', aria:'Document and close', why:'Records are finished after services are proven stable.' }
  ],
  slots:[
    { label:'BEFORE the window', accept:['b1','b2'], ph:'drop task', aria:'Before the window' },
    { label:'BEFORE the window', accept:['b1','b2'], ph:'drop task', aria:'Before the window' },
    { label:'DURING the window', accept:['b3','b4','b5'], ph:'drop task', aria:'During the window' },
    { label:'DURING the window', accept:['b3','b4','b5'], ph:'drop task', aria:'During the window' },
    { label:'DURING the window', accept:['b3','b4','b5'], ph:'drop task', aria:'During the window' },
    { label:'AFTER the window', accept:['b6'], ph:'drop task', aria:'After the window' }
  ],
  hint:'Anything that protects the rollback path must happen before the first command touches a device.',
  explain:`<p>Phases exist because each task protects the next: users are warned and backups are taken before the window, so a failure can be undone calmly. The change, the validation and any rollback happen inside the window, where disruption is expected and staff are present. Documentation and ticket closure come after stability is proven — writing “success” before the tests pass is how fiction enters the CMDB.</p>`,
  tip:'Before = protect the way back. During = change and prove. After = record.' },

/* ── M19 ── spot: deployment checklist mistakes */
{ id:'M19', t:'Spot the mistakes in the deployment checklist', theme:'Software management', kw:['staging','rollback','software validation','maintenance window','test environment'],
  points:4, type:'spot',
  scenario:`<p>A contractor wrote this checklist for deploying a new build of the HR portal. Three lines violate your software management policy.</p>`,
  question:`<p>Select the <b>3</b> faulty lines.</p>`,
  lines:[
    { html:'Download the installer from the vendor portal and verify its hash.', bad:false, why:'Hash verification is standard supply-chain hygiene.' },
    { html:'Install directly on production; the change is small enough.', bad:true, why:'“Small” changes fail too — every change is tested in staging first, no exceptions.' },
    { html:'Record the work as a change request in the ticket system.', bad:false, why:'Correct — the audit trail starts with the ticket.' },
    { html:'Test install, login and the main workflows in the staging environment.', bad:false, why:'Staging exists precisely for this.' },
    { html:'No rollback plan needed; uninstalling is always possible later.', bad:true, why:'“Always possible later” is not a plan — a rollback plan is defined, tested and ready BEFORE the change.' },
    { html:'Validate login, payroll export and the org chart after install.', bad:false, why:'Validating the business-critical functions is exactly right.' },
    { html:'Roll out to all 4,000 users at once, Monday 09:00.', bad:true, why:'A mass rollout at peak hour with no pilot and no window multiplies the blast radius; policy requires a window and a staged rollout.' },
    { html:'Document the new version in the asset record when done.', bad:false, why:'Version records keep support and audits honest.' }
  ],
  hint:'One line skips the lab, one line shrugs at the way back, one line maximises the blast radius.',
  explain:`<p>The three faults are the classic trio: skipping the test environment, replacing a rollback plan with optimism, and maximising blast radius with an all-at-once rollout at the worst hour. The correct lines — hash check, ticket, staging tests, validation of key functions, documentation — form the pattern every deployment should follow.</p>`,
  tip:'If a checklist lacks staging, rollback or validation, it is not a checklist — it is a gamble.' },

/* ── M20 ── multi: retention truths */
{ id:'M20', t:'What retention actually means', theme:'Decommissioning & sanitisation', kw:['retention','on-site storage','off-site storage'],
  points:3, type:'choice', multi:true,
  scenario:`<p>During a facilities audit, three statements about keeping old records and media were overheard. Only some of them are true. The auditor expects your team to know the difference between retention, on-site storage and off-site storage.</p>`,
  question:`<p>Select the <b>3</b> true statements.</p>`,
  options:[
    { k:'A', html:'Retention means keeping every retired device powered on for ever.', note:'Retention is about records and media, and “for ever” contradicts any policy.' },
    { k:'B', html:'A retention policy defines how long records or media must be kept before disposal.', note:'Correct — retention is the clock and the rule for how long things are kept.' },
    { k:'C', html:'Retention rules apply only to paper documents.', note:'Retention covers tapes, disks, logs and digital records too.' },
    { k:'D', html:'On-site storage keeps media close for fast access, but a site disaster destroys it too.', note:'Correct — speed is the benefit, shared fate is the weakness.' },
    { k:'E', html:'Off-site storage protects a copy against fire or flood at the main site.', note:'Correct — distance is the whole point of off-site storage.' }
  ],
  correct:['B','D','E'],
  hint:'One statement is about distance, one is about speed, one is about the rule itself.',
  explain:`<p>Retention is the policy that says how long records and media are kept — and it applies to digital and paper alike. On-site storage buys you fast access but shares the site’s fate in a disaster. Off-site storage buys you distance, which is exactly what survives a fire or flood. Retired devices are not kept powered on “for ever”; they are kept until the retention and disposal rules say otherwise.</p>`,
  tip:'Retention = how long. On-site = fast. Off-site = survives the site.' },

/* ── M21 ── terminal (guided): show version */
{ id:'M21', t:'Capture the software version on the console', theme:'Software management', kw:['firmware','patch','EOS'],
  points:3, type:'terminal',
  scenario:`<p>You are on the console of access switch <b>sw-acc-12</b>. Before raising the EOL ticket you must capture the exact software version and uptime, because the vendor’s support tool needs them. Use a <code>show</code> command — the classic one that displays the software version, uptime and hardware identity. The output you are looking for looks like: <code>Software, Version 15.2(...)</code> followed by an uptime line and a serial number.</p>`,
  question:`<p>Type the command on the console and press Enter.</p>`,
  prompt:'sw-acc-12#',
  accepts:[
    { re:'^show ver(s|ion|sion)?(\\s*\\|.*)?$', ok:true, ex:'show version',
      out:'Cisco IOS Software, Version 15.2(7)E3, RELEASE SOFTWARE (fc3)\nsw-acc-12 uptime is 2 years, 41 weeks, 3 days\nSystem serial number            : FJC2418A0QC\nModel number                    : NG-2960X-48',
      why:'show version is the standard command for software version, uptime and hardware identity.' },
    { re:'^show run(ning-config)?$', ok:false, ex:'',
      out:'Building configuration...\n\n! (the running config scrolls past — useful, but it does NOT contain the software version you need)',
      why:'' },
    { re:'^show clock$', ok:false, ex:'',
      out:'*09:41:12.311 UTC Tue Oct 6 2026',
      why:'' }
  ],
  deny:'% Invalid input detected at marker — hint: the classic command that reports the image version.',
  hint:'The command family is “show”. The keyword is what the vendor calls the software “version”.',
  explain:`<p><code>show version</code> is the standard command on network devices for the running software version, uptime and hardware identity. It is the first command of every lifecycle check: you cannot decide EOL or EOS status without knowing exactly what is running. The config and the clock are useful commands, but they simply do not carry the software version.</p>`,
  tip:'show version = what runs, how long, on which box.' },

/* ── M22 ── order: priority ranking */
{ id:'M22', t:'Rank the findings by urgency', theme:'Inventory & governance', kw:['EOS','EOL','replacement planning','documentation'],
  points:5, type:'order',
  scenario:`<p>A quick lifecycle sweep of the estate produced five findings. The steering group asks you to rank them so the roadmap starts with the worst. Exposure and support status drive urgency; housekeeping comes last.</p>`,
  question:`<p>Rank the findings from most urgent to least urgent.</p>`,
  items:[
    { k:'f1', html:'Internet-facing VPN concentrator is past end of support', t:'Internet-facing VPN past EOS', why:'No patches at all plus direct internet exposure — the top risk.' },
    { k:'f2', html:'Internal print server is past end of support', t:'Internal print server past EOS', why:'Unsupported, but buried in an internal VLAN — real risk, lower reach.' },
    { k:'f3', html:'Lab VM is missing the latest security patch', t:'Lab VM missing a patch', why:'A live unpatched flaw, but in an isolated lab with limited value to attackers.' },
    { k:'f4', html:'Access switches: EOL announced, EOS only in three years', t:'EOL announced on switches', why:'Urgent to PLAN, not to fix — patches continue for years.' },
    { k:'f5', html:'Documentation for the new access points is not updated yet', t:'AP documentation outdated', why:'Housekeeping — annoying at audit time, harmless today.' }
  ],
  hint:'Two findings are unsupported devices. Which one can attackers reach from the street?',
  explain:`<p>Urgency follows reach and support: an internet-facing device with no vendor patches is the widest open door, so it ranks first. The unsupported print server inside the network is next — no patches, but limited reach. The unpatched lab VM is a live flaw in a contained environment. An EOL notice with EOS years away is planning work, and stale documentation is housekeeping. This order matches how both attackers and auditors see your estate.</p>`,
  tip:'Rank by: past EOS? exposed? — then everything that is only a plan or paperwork.' },

/* ── M23 ── QCM: repurposing */
{ id:'M23', t:'A second career for the old appliance', theme:'Decommissioning & sanitisation', kw:['repurposing','recycling','decommissioning','data sanitisation'],
  points:2, type:'choice', multi:false,
  scenario:`<p>The retired UTM appliance still runs perfectly. Instead of scrapping it, the team reinstalls it as the firewall for the isolated training lab. Before the move, its drives were wiped and verified, and the asset record was updated with the new role and location.</p>`,
  question:`<p>What is this reuse of the appliance called?</p>`,
  options:[
    { k:'A', html:'Recycling', note:'Recycling breaks the hardware down for materials — the appliance here keeps working.' },
    { k:'B', html:'Repurposing', note:'Correct — a new internal role for existing hardware, after sanitisation.' },
    { k:'C', html:'Decommissioning', note:'Decommissioning is the controlled exit from production — it preceded this reuse, it is not the reuse itself.' },
    { k:'D', html:'Purging', note:'Purging is a sanitisation method for the media, not the fate of the device.' }
  ],
  correct:['B'],
  hint:'The box did not die and was not melted. It got a new job.',
  explain:`<p>Repurposing means giving existing hardware a new internal role — like a retired UTM becoming the training-lab firewall. It is only safe after sanitisation (here: drives wiped and verified) and after the documentation reflects the new role and location. Recycling would end the hardware, decommissioning is the exit process itself, and purging is one sanitisation technique used along the way.</p>`,
  tip:'New job inside the company = repurposing. New raw materials = recycling.' },

/* ── M24 ── slots fill: decommissioning ticket */
{ id:'M24', t:'Complete the decommissioning ticket', theme:'Decommissioning & sanitisation', kw:['data sanitisation','location tracking','documentation','certificate of destruction','decommissioning'],
  points:5, type:'slots', mode:'fill',
  scenario:`<p>Ticket <b>REQ-2230</b> documents the removal of file server <b>fs-old03</b>. Three of the missing tiles are decoys.</p>`,
  question:`<p>Complete the ticket text with the correct terms.</p>`,
  text:`<p>Ticket REQ-2230 — fs-old03: the data owner approved the {{0}} of all disks (wipe plus verification) before removal. The {{1}} team booked the lift for Friday 06:00. Before pickup, the asset tag is scanned so {{2}} in the CMDB shows the storage room for every part. Uplinks will be shut and the {{3}} ports disabled. After the recycler confirms shredding, the {{4}} is attached to the asset record.</p>`,
  bank:[
    { k:'k1', html:'data sanitisation', aria:'data sanitisation', why:'Wipe plus verification is the sanitisation step the data owner must approve.' },
    { k:'k2', html:'facilities', aria:'facilities', why:'The facilities team owns lifts, racks and logistics.' },
    { k:'k3', html:'location tracking', aria:'location tracking', why:'Scans and records that show where each asset physically is, at any moment.' },
    { k:'k4', html:'unused', aria:'unused', why:'Unused ports are disabled so no forgotten door stays open.' },
    { k:'k5', html:'certificate of destruction', aria:'certificate of destruction', why:'The recycler’s certificate is the audit proof of compliant disposal.' },
    { k:'d1', html:'rollback', aria:'rollback (decoy)', why:'Rollback belongs to software changes, not to hardware disposal.' },
    { k:'d2', html:'end of sale', aria:'end of sale (decoy)', why:'A purchasing date — it has no place in this ticket.' },
    { k:'d3', html:'hotfix', aria:'hotfix (decoy)', why:'A software term; nothing here is being patched.' }
  ],
  slots:[
    { accept:'k1', label:'blank 1', aria:'blank 1' },
    { accept:'k2', label:'blank 2', aria:'blank 2' },
    { accept:'k3', label:'blank 3', aria:'blank 3' },
    { accept:'k4', label:'blank 4', aria:'blank 4' },
    { accept:'k5', label:'blank 5', aria:'blank 5' }
  ],
  hint:'One blank is a team, one is a scan, one is a certificate. Only one blank is about data.',
  explain:`<p>The ticket walks the decommissioning chain: the data owner approves sanitisation, facilities moves the hardware, location tracking records every physical move, unused ports are disabled so nothing stays reachable, and the certificate of destruction lands on the asset record as proof. Each decoy belongs to a different process — rollback and hotfixes to software changes, end of sale to procurement.</p>`,
  tip:'A good disposal ticket answers: who approved the wipe, who moved it, where is it, what is shut, and where is the proof?' },

/* ── M25 ── multi: sanitisation methods */
{ id:'M25', t:'Which of these are real sanitisation methods?', theme:'Decommissioning & sanitisation', kw:['data sanitisation','wiping','purging','destruction'],
  points:3, type:'choice', multi:true,
  scenario:`<p>A spreadsheet circulating in the office lists “ways to clean a disk”. Some entries are real sanitisation methods, some are folklore.</p>`,
  question:`<p>Select the <b>3</b> real data-sanitisation methods.</p>`,
  options:[
    { k:'A', html:'Moving the files to the Recycle Bin and emptying it', note:'Emptying the bin only unlinks the files — the data blocks stay on the disk.' },
    { k:'B', html:'Overwriting (wiping) every sector with patterns', note:'Correct — the classic wipe, and the media stays usable.' },
    { k:'C', html:'Renaming the files with a “private” prefix', note:'A rename changes a label, not a single data bit.' },
    { k:'D', html:'Degaussing the media with a strong magnetic field', note:'Correct — a purge method for magnetic media.' },
    { k:'E', html:'Physical destruction such as shredding', note:'Correct — the strongest level: the media itself ends.' }
  ],
  correct:['B','D','E'],
  hint:'A real method changes the data itself — or ends the media.',
  explain:`<p>Real sanitisation either overwrites the data (wiping), purges it (degaussing, cryptographic erase) or destroys the media (shredding, incineration). Emptying the Recycle Bin and renaming files are bookkeeping operations: every original bit is still physically present and trivially recoverable with free tools. If a method cannot survive the question “what happened to the actual bytes?”, it is not sanitisation.</p>`,
  tip:'Bin-emptying and renaming hide files. They never remove data.' },

/* ── M26 ── viewer + multi: disposal manifest */
{ id:'M26', t:'Read the disposal manifest', theme:'Decommissioning & sanitisation', kw:['destruction','recycling','wiping','certificate of destruction','chain of custody'],
  points:3, type:'choice', multi:true,

  artifacts:[{ label:'Disposal manifest — pickup 2026-09-24', kind:'table', filter:true, body:
`<span class="hl-k">SERIAL       MEDIA       ACTION    CERT</span>
WD-88041     HDD 4TB     <span class="hl-b">DESTROY</span>   D-2211
WD-88042     HDD 4TB     WIPE+RESALE   W-0988 (wiped and verified)
SG-33912     SSD 1TB     <span class="hl-b">DESTROY</span>   D-2212
LT-11223     LTO tape    DEGAUSS   P-0451
WD-88077     HDD 4TB     WIPE+RESALE   W-0989 (wiped and verified)
SG-33930     SSD 1TB     <span class="hl-g">RECYCLE</span> (no media)   R-7734
WD-88090     HDD 4TB     <span class="hl-b">DESTROY</span>   D-2213
LT-11224     LTO tape    DEGAUSS   P-0452` }],
  question:`<p>Select the <b>3</b> serials that were physically <b>DESTROYED</b> (not wiped, resold, degaussed or recycled).</p>`,
  options:[
    { k:'A', html:'WD-88041', note:'Row 1: ACTION DESTROY with certificate D-2211 — destroyed.' },
    { k:'B', html:'WD-88042', note:'Wiped and resold — the media survived and left the company as working hardware.' },
    { k:'C', html:'SG-33912', note:'Row 3: ACTION DESTROY with certificate D-2212 — destroyed.' },

  explain:`<p>The manifest is the evidence of what physically happened to each item. WD-88041, SG-33912 and WD-88090 carry the DESTROY action with destruction certificates (D-2211/2212/2213). WD-88042 and WD-88077 were wiped, verified and resold, the tapes were degaussed (purged), and SG-33930 was recycled as chassis without media. Matching serials to actions is exactly what an auditor will ask you to do.</p>`,
  tip:'DESTROY means the media died. Everything else means it lived on somewhere.' },

/* ── M27 ── slots pairs: tracking concepts */
{ id:'M27', t:'Match the tracking concepts', theme:'Decommissioning & sanitisation', kw:['location tracking','asset inventory','CMDB','retention','off-site storage'],
  points:4, type:'slots', mode:'pairs',
  scenario:`<p>The audit report praised your disposal records but criticised “inconsistent vocabulary”. You build a quick matching exercise to align the team.</p>`,
  question:`<p>Match each concept to the sentence that defines it.</p>`,
  bank:[
    { k:'g1', html:'Asset tag', aria:'asset tag', why:'The physical label with a unique ID glued to every device.' },
    { k:'g2', html:'CMDB record', aria:'CMDB record', why:'The database entry holding ownership, configuration and state.' },
    { k:'g3', html:'Off-site vault log', aria:'vault log', why:'The register of media that left the building — what, where, when.' },
    { k:'g4', html:'Barcode scan', aria:'barcode scan', why:'A quick scan that updates the recorded location of an asset.' }
  ],
  slots:[
    { label:'A physical label with a unique ID on every device', accept:'g1', ph:'drop concept' },
    { label:'The database entry with ownership and configuration details', accept:'g2', ph:'drop concept' },
    { label:'The register showing which media left the building, where and when', accept:'g3', ph:'drop concept' },
    { label:'A quick scan at the door that updates an asset’s location', accept:'g4', ph:'drop concept' }
  ],
  hint:'Two concepts are physical-world, two are record-world.',
  explain:`<p>Location tracking rests on four pillars: the asset tag identifies the physical object, the barcode scan records its movement, the CMDB record holds ownership and configuration truth, and the off-site vault log proves where retained media lives while the retention clock runs. Together they answer the audit question “can you show me where this is and who owns it?” for any serial, in minutes.</p>`,
  tip:'Tag = identity. Scan = movement. CMDB = truth. Vault log = media away from home.' },

/* ── M28 ── branch: new application deployment */
{ id:'M28', t:'Deploy the new inventory application', theme:'Software management', kw:['new application deployment','change management','test environment','software validation','pilot','UAT','rollback'],
  points:5, type:'branch',
  scenario:`<p>The warehouse manager wants the new inventory app “live today” for all 120 warehouse staff, and this new application deployment cannot skip the process. You own the deployment decision. The vendor promises it “runs anywhere”.</p>`,
  question:`<p>Choose the professional path at each step.</p>`,
  steps:[
    { q:'The manager asks for a same-day, all-staff rollout. Your first move?',
      options:[
        { html:'Check requirements against our environment and raise a change request.', ok:true, fb:'Even urgent deployments enter through change management — requirements first, ticket second.' },
        { html:'Install it on the busiest server right away to show goodwill.', ok:false, fb:'Installing unvalidated software on the busiest server is how outages and “mystery slowness” stories start.' },
        { html:'Email the installer to all staff and let them install it themselves.', ok:false, fb:'Unguided installs on endpoints mean no version control, no support model and no rollback story.' }
      ]},
    { q:'Where does the app get tested?',
      options:[
        { html:'In the test environment with realistic data and integrations.', ok:true, fb:'A staging run with real-shaped data exposes integration surprises safely.' },
        { html:'Quietly in production after hours.', ok:false, fb:'“Quietly in production” is still production — the blast radius is just unmeasured.' },
        { html:'On the manager’s laptop only.', ok:false, fb:'One laptop proves one laptop works — not the integrations, load or permissions.' }
      ]},
    { q:'Who validates the app before everyone gets it?',
      options:[
        { html:'A pilot group of warehouse users does UAT, plus IT validation tests.', ok:true, fb:'User acceptance testing by real users plus IT checks is the strongest pre-rollout evidence.' },
        { html:'Nobody — the vendor already tested it.', ok:false, fb:'The vendor never tested YOUR scanners, YOUR network or YOUR workflows.' },
        { html:'Only the warehouse manager, in five minutes.', ok:false, fb:'A single opinion in five minutes is not validation — it is a rubber stamp.' }
      ]},
    { q:'What is the safety net for go-live?',
      options:[
        { html:'A rollback plan to the previous workflow, agreed with the manager.', ok:true, fb:'A rehearsed rollback turns a bad go-live into a 30-minute detour.' },
        { html:'None — reinstalling the operating system would also work.', ok:false, fb:'Reinstalling servers and retraining 120 people is not a safety net, it is a disaster plan.' },
        { html:'Delete the old workflow before testing the new one.', ok:false, fb:'Burning the boats removes the return path — the opposite of a rollback plan.' }
      ]}
  ],
  hint:'Requirements, ticket, staging, UAT with real users, and a way back — in that spirit.',
  explain:`<p>A new application deployment earns trust the same way every change does: requirements and change request first, test environment with realistic data, validation by a pilot group (UAT) plus IT checks, and an agreed rollback plan before go-live. The vendor’s promises are inputs, not evidence. This sequence protects the 120 users, the deadline and your credibility.</p>`,
  tip:'Vendor says, staging proves, users confirm, rollback protects.' },

/* ── M29 ── QCM: firmware truth */
{ id:'M29', t:'What is firmware, really?', theme:'Hardware & vendor lifecycle', kw:['firmware','patch','EOS'],
  points:2, type:'choice', multi:false,
  scenario:`<p>During the EOL planning meeting, a project manager asks what firmware actually is and why the lifecycle plan keeps reserving reboot windows for it.</p>`,
  question:`<p>Which statement about firmware is <b>true</b>?</p>`,
  options:[
    { k:'A', html:'Firmware is stored on the administrator’s PC and loads over the network at login.', note:'Firmware lives on the device itself and boots with the hardware — it never comes from your PC.' },
    { k:'B', html:'Firmware updates never require a reboot or a maintenance window.', note:'Firmware usually restarts the device, which is why windows are planned.' },
    { k:'C', html:'Firmware cannot be updated — the device must be replaced instead.', note:'Firmware is updatable; vendors ship firmware fixes through the whole support window.' },
    { k:'D', html:'Firmware is the low-level software that runs the device hardware.', note:'Correct — it boots with the hardware and vendors fix security bugs in it.' }
  ],
  correct:['D'],
  hint:'Think about what “speaks first” when the switch powers on.',
  explain:`<p>Firmware is the low-level software inside a device — switches, firewalls, drives, even drives’ controllers — that makes the hardware work. It is stored on the device and usually loads at power-on. Vendors ship firmware updates through the support window to fix bugs and security holes, and applying them normally restarts the device, hence the maintenance windows. An EOS announcement that freezes firmware also freezes those security fixes.</p>`,
  tip:'Firmware = the software the hardware boots with. Updating it = reboot.' },

/* ── M30 ── order: full decommissioning sequence */
{ id:'M30', t:'Order the decommissioning of core-sw01', theme:'Decommissioning & sanitisation', kw:['decommissioning','wiping','documentation','port activation','recycling','decommissioning review','chain of custody'],
  points:5, type:'order',
  scenario:`<p>Old core switch <b>core-sw01</b> leaves the data centre next week. The runbook’s eight steps arrived from two teams in shuffled order. Data protection rules and clean documentation both depend on getting the sequence right.</p>`,
  question:`<p>Put the eight steps in the correct order.</p>`,
  items:[
    { k:'x1', html:'Migrate all services to the new core and verify traffic', t:'Migrate services and verify', why:'Nothing leaves production until its replacement carries the load.' },
    { k:'x2', html:'Back up the final configuration and export the logs', t:'Back up config and logs', why:'The last good config and logs are records, kept per the retention rules.' },
    { k:'x3', html:'Sanitise the internal media (verified wipe) and record serials', t:'Sanitise media and record serials', why:'Data protection happens while the box is still in your hands.' },
    { k:'x4', html:'Update the CMDB, diagrams and IPAM', t:'Update CMDB, diagrams, IPAM', why:'Documentation moves with the change, not months later.' },
    { k:'x5', html:'Disable uplinks and unused ports, label the cabling', t:'Disable and label ports', why:'No forgotten live port may survive into storage or transit.' },
    { k:'x6', html:'Remove from the rack and transfer with a signed chain of custody form', t:'Remove and transfer with custody form', why:'The signed handover keeps every movement traceable.' },
    { k:'x7', html:'Recycle via the certified partner and collect the certificate', t:'Recycle and collect certificate', why:'A certified recycler plus certificate proves compliant disposal.' },
    { k:'x8', html:'Hold the decommissioning review and file the lessons learned', t:'Review and file lessons', why:'The review closes the loop and improves the next decommissioning.' }
  ],
  hint:'Data protection happens while the box is still yours. The review is always the last meeting.',
  explain:`<p>The sequence protects three things in order: service continuity (migrate and verify first), data (config and logs kept as records, media sanitised while the device is still on your premises), and truth (documentation, ports shut, signed custody, certified recycling). The decommissioning review comes last because it can only judge a finished process — and its lessons learned are what make the next one cheaper and safer.</p>`,
  tip:'Migrate → preserve records → sanitise → document → lock down ports → custody → recycle → review.' }
];
