</script>
<script>
'use strict';
/* Exam engine — driven entirely by window.EXAM (exercise data) and window.EXAM_CFG. */
var CFG = window.EXAM_CFG, DATA = window.EXAM;
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function round2(n){ return Math.round(n*100)/100; }
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim(); }
function fmtTime(s){ s=Math.max(0,s|0); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function byKey(arr,k){ for(var i=0;i<arr.length;i++){ if(arr[i].k===k) return arr[i]; } return null; }
function exById(id){ for(var i=0;i<DATA.length;i++){ if(DATA[i].id===id) return DATA[i]; } return null; }
/* slot accepts may be a single key or a group of equally-correct keys (used by
   duplicate-label bins so any group member can go into any bin of that group) */
function accArr(sl){ return Array.isArray(sl.accept)? sl.accept : [sl.accept]; }
function slotOK(sl,key){ return !!key && accArr(sl).indexOf(key)>=0; }
function accHtml(ex,sl){ return accArr(sl).map(function(k){ return '<b>'+byKey(ex.bank,k).html+'</b>'; }).join(' or '); }

var S = null;

function freshState(){
  var order = shuffle(DATA.map(function(_,i){ return i; }));
  var shuf = {};
  order.forEach(function(i){
    var ex = DATA[i], p = {};
    if(ex.type==='choice') p.opts = shuffle(ex.options.map(function(o){ return o.k; }));
    else if(ex.type==='branch') p.opts = ex.steps.map(function(st){ return shuffle(st.options.map(function(_,oi){ return oi; })); });
    else if(ex.type==='slots') p.bank = shuffle(ex.bank.map(function(b){ return b.k; }));
    else if(ex.type==='order') p.items = shuffle(ex.items.map(function(it){ return it.k; }));
    shuf[ex.id] = p;
  });
  return { order:order, shuf:shuf, cur:0, ans:{}, started:true, finished:false, reported:false,
           t:{ left: CFG.minutes*60, manual:false, check:false } };
}

function rec(id){
  if(!S.ans[id]){
    var ex = exById(id), v = {};
    if(ex.type==='choice') v = { sel:[] };
    else if(ex.type==='slots') v = { put:{} };
    else if(ex.type==='order') v = { seq:null, touched:false };
    else if(ex.type==='text') v = { vals: ex.inputs.map(function(){ return ''; }), touched:false };
    else if(ex.type==='terminal') v = { hist:[], done:[] };
    else if(ex.type==='branch') v = { step:0, picks:[] };
    else if(ex.type==='spot') v = { sel:[] };
    S.ans[id] = { val:v, checked:false, earned:0, got:0, total:0, skipped:false, hints:0, visited:false };
  }
  return S.ans[id];
}

function hasAnswer(ex, r){
  var v = r.val;
  switch(ex.type){
    case 'choice': return v.sel.length>0;
    case 'slots': return Object.keys(v.put).length>0;
    case 'order': return !!v.touched;
    case 'text': return !!v.touched && v.vals.join('')!=='';
    case 'terminal': return v.hist.length>0; /* any typed command = engaged, even if denied */
    case 'branch': return v.picks.length>0;
    case 'spot': return v.sel.length>0;
  }
  return false;
}

/* ---------- artifact renderer (logs / tables with filter box) ---------- */
function rArtifacts(ex){
  if(!ex.artifacts) return '';
  var h = '';
  ex.artifacts.forEach(function(a, ai){
    var id = 'art-'+ex.id+'-'+ai;
    h += '<div class="art"><div class="art-head"><span class="art-label">'+esc(a.label)+'</span>';
    if(a.filter) h += '<input type="search" class="art-filter" data-art="'+id+'" placeholder="Filter lines (text contains…)" aria-label="Filter lines of '+esc(a.label)+'">';
    h += '</div><pre class="art-body" id="'+id+'">'+ a.body.split('\n').map(function(l){ return '<span class="ln">'+l+'</span>'; }).join('\n') +'</pre></div>';
  });
  return h;
}

/* ---------- per-type answer renderers ---------- */
function rChoice(ex, r, locked){
  var perm = S.shuf[ex.id], multi = !!ex.multi;
  var h = '<fieldset class="ansblk" style="border-style:solid"><legend class="ansleg">'+(multi?'SELECT ALL THAT APPLY':'CHOOSE ONE')+'</legend><div class="opts">';
  perm.opts.forEach(function(k){
    var o = byKey(ex.options,k), sel = r.val.sel.indexOf(k)>=0, cls='opt', mk='';
    if(locked){
      if(sel && ex.correct.indexOf(k)>=0){ cls+=' good'; mk='<span class="mk g">✓</span>'; }
      else if(sel){ cls+=' bad'; mk='<span class="mk b">✗</span>'; }
      else if(ex.correct.indexOf(k)>=0){ cls+=' miss'; mk='<span class="mk w">▲ missed</span>'; }
    }
    h += '<label class="'+cls+'"><input type="'+(multi?'checkbox':'radio')+'" name="q_'+ex.id+'" value="'+k+'"'+(sel?' checked':'')+(locked?' disabled':'')+'><span class="opt-t">'+o.html+'</span>'+mk+'</label>';
  });
  return h+'</div></fieldset>';
}

function slotBtnHTML(ex, r, locked, i){
  var key = r.val.put[i], cls='slot', inner;
  if(key){
    var tok = byKey(ex.bank,key);
    inner = '<span class="tok-in">'+tok.html+'</span>';
    cls += ' filled';
    if(locked){
      var ok = slotOK(ex.slots[i], key);
      cls += ok?' good':' bad';
      inner += '<span class="mk '+(ok?'g':'b')+'">'+(ok?'✓':'✗')+'</span>';
    }
  } else {
    inner = '<span class="ph">'+esc(ex.slots[i].ph||'place here')+'</span>';
    if(locked){ cls+=' bad'; inner += '<span class="mk w">▲ empty</span>'; }
  }
  return '<button type="button" class="'+cls+'" data-slot="'+i+'" '+(locked?'disabled':'')+' aria-label="'+esc(ex.slots[i].aria||('Slot '+(i+1)))+'">'+inner+'</button>';
}

function rSlots(ex, r, locked){
  var perm = S.shuf[ex.id], h = '';
  var used = {};
  Object.keys(r.val.put).forEach(function(si){ used[r.val.put[si]] = 1; });
  if(ex.mode==='fill'){
    h += '<div class="ansblk"><span class="ansleg">COMPLETE THE TEXT — pick from the word bank</span><div class="filltext">'+
         ex.text.replace(/\{\{(\d+)\}\}/g, function(_, i){ return slotBtnHTML(ex, r, locked, +i); }) +'</div></div>';
  } else {
    h += '<div class="ansblk"><span class="ansleg">DRAG OR CLICK TO PLACE EACH ITEM</span><div class="bins">';
    ex.slots.forEach(function(sl, i){
      h += '<div class="bin"><div class="binleg">'+esc(sl.label)+'</div>'+slotBtnHTML(ex, r, locked, i)+'</div>';
    });
    h += '</div></div>';
  }
  h += '<div class="bank"><div class="bankleg">Word bank — click a tile, then click a slot (or drag)</div><div class="bankgrid">';
  perm.bank.forEach(function(k){
    var tok = byKey(ex.bank,k), isUsed = !!used[k];
    h += '<button type="button" class="tok'+(isUsed?' used':'')+'" data-key="'+k+'"'+((locked||isUsed)?' disabled':'')+' aria-label="'+esc(tok.aria||'Tile')+'">'+tok.html+'</button>';
  });
  return h+'</div></div>';
}

function rOrder(ex, r, locked){
  var perm = S.shuf[ex.id];
  var seq = r.val.seq || perm.items;
  var h = '<div class="ansblk"><span class="ansleg">ARRANGE IN THE RIGHT ORDER — use the arrow buttons or drag</span><ol class="ordlist">';
  seq.forEach(function(k, i){
    var it = byKey(ex.items,k), cls='ord-item', mk='';
    if(locked){
      if(ex.items[i].k===k){ cls+=' good'; mk='<span class="mk g">✓</span>'; }
      else { cls+=' bad'; mk='<span class="mk b">✗</span>'; }
    }
    h += '<li class="'+cls+'" data-key="'+k+'" draggable="'+(locked?'false':'true')+'"><span class="idx">'+(i+1)+'</span><span class="ord-t">'+it.html+'</span>'+mk+
         (locked?'':'<span class="ordbtns"><button type="button" class="mv" data-dir="-1" aria-label="Move up: '+esc(it.t||'')+'">↑</button><button type="button" class="mv" data-dir="1" aria-label="Move down: '+esc(it.t||'')+'">↓</button></span>')+'</li>';
  });
  return h+'</ol></div>';
}

function rText(ex, r, locked){
  var h = '<div class="ansblk"><span class="ansleg">TYPE YOUR ANSWER(S)</span>';
  ex.inputs.forEach(function(inp, i){
    var val = r.val.vals[i], cls='tin-row', mk='';
    if(locked){
      var n = norm(val), ok = inp.accept.some(function(a){ return norm(a)===n; });
      cls += ok?' good':' bad';
      mk = '<span class="mk '+(ok?'g':'b')+'">'+(ok?'✓':'✗')+'</span>';
    }
    h += '<div class="'+cls+'"><span class="tin-lab">'+inp.label+'</span><input class="tin" type="text" data-tin="'+i+'" value="'+esc(val)+'" autocomplete="off" spellcheck="false" '+(locked?'disabled':'')+' aria-label="'+esc(inp.label)+'">'+mk+'</div>';
  });
  return h+'</div>';
}

function rTerminal(ex, r, locked){
  var h = '<div class="ansblk"><span class="ansleg">INTERACTIVE CONSOLE — TYPE THE COMMAND(S), PRESS ENTER</span>'+
    '<div class="term" role="group" aria-label="Device console"><div class="term-hist" id="term-hist">';
  r.val.hist.forEach(function(l){
    h += '<div class="t-line"><span class="t-p">'+esc(l.p)+'</span> '+esc(l.c)+'</div>'+(l.o?'<div class="t-out">'+l.o+'</div>':'');
  });
  h += '</div><div class="t-row"><span class="t-p">'+esc(ex.prompt)+'</span><input id="term-in" class="t-in" type="text" autocomplete="off" spellcheck="false" aria-label="Console input"'+(locked?' disabled':'')+'></div></div>';
  if(locked){
    h += '<div class="mut" style="margin-top:6px">Console locked after Check. Accepted commands are listed in the feedback below.</div>';
  }
  return h+'</div>';
}

function rBranch(ex, r, locked){
  var perm = S.shuf[ex.id];
  var h = '<div class="ansblk"><span class="ansleg">DECISION WORKFLOW — ONE CHOICE PER STEP</span>';
  r.val.picks.forEach(function(pk, si){
    var st = ex.steps[si], o = st.options[pk.oi];
    h += '<div class="br-done '+(pk.ok?'good':'bad')+'"><div class="br-q">Step '+(si+1)+'. '+st.q+'</div>'+
         '<div class="br-a"><span class="mk '+(pk.ok?'g':'b')+'">'+(pk.ok?'✓':'✗')+'</span> '+o.html+'</div>'+
         '<div class="br-fb">'+o.fb+'</div></div>';
  });
  if(!locked && r.val.step < ex.steps.length){
    var si = r.val.step, st = ex.steps[si];
    h += '<div class="br-cur"><div class="br-q">Step '+(si+1)+' of '+ex.steps.length+'. '+st.q+'</div><div class="opts">';
    perm.opts[si].forEach(function(oi){
      h += '<button type="button" class="opt br-opt" data-oi="'+oi+'"'+(locked?' disabled':'')+'><span class="opt-t">'+st.options[oi].html+'</span></button>';
    });
    h += '</div></div>';
  } else if(!locked){
    h += '<div class="br-ready">All steps answered — press Check to score this workflow.</div>';
  }
  return h+'</div>';
}

function rSpot(ex, r, locked){
  var h = '<div class="ansblk"><span class="ansleg">SELECT EVERY FAULTY LINE — CLICK TO TOGGLE</span><div class="snippet">';
  ex.lines.forEach(function(l, i){
    var sel = r.val.sel.indexOf(i)>=0, cls='sline'+(sel?' sel':''), mk='';
    if(locked){
      if(l.bad && sel){ cls+=' good'; mk='<span class="mk g">✓</span>'; }
      else if(l.bad){ cls+=' miss'; mk='<span class="mk w">▲</span>'; }
      else if(sel){ cls+=' bad'; mk='<span class="mk b">✗</span>'; }
    }
    h += '<button type="button" class="'+cls+'" data-li="'+i+'"'+(locked?' disabled':'')+'><span class="no">'+(i+1)+'</span><span class="sl-t">'+l.html+'</span>'+mk+'</button>';
  });
  return h+'</div></div>';
}

function renderByType(ex, r, locked){
  switch(ex.type){
    case 'choice': return rChoice(ex, r, locked);
    case 'slots': return rSlots(ex, r, locked);
    case 'order': return rOrder(ex, r, locked);
    case 'text': return rText(ex, r, locked);
    case 'terminal': return rTerminal(ex, r, locked);
    case 'branch': return rBranch(ex, r, locked);
    case 'spot': return rSpot(ex, r, locked);
  }
  return '';
}


/* ---------- grading ---------- */
function grade(ex, r){
  var v = r.val, got = 0, total = 0;
  if(ex.type==='choice'){
    if(ex.multi){ total = ex.correct.length; v.sel.forEach(function(k){ if(ex.correct.indexOf(k)>=0) got++; }); }
    else { total = 1; got = (v.sel.length===1 && ex.correct.indexOf(v.sel[0])>=0) ? 1 : 0; }
  } else if(ex.type==='slots'){
    total = ex.slots.length;
    ex.slots.forEach(function(sl,i){ if(slotOK(sl, v.put[i])) got++; });
  } else if(ex.type==='order'){
    total = ex.items.length;
    var seq = v.seq || S.shuf[ex.id].items;
    seq.forEach(function(k,i){ if(ex.items[i].k===k) got++; });
  } else if(ex.type==='text'){
    total = ex.inputs.length;
    ex.inputs.forEach(function(inp,i){ var n=norm(v.vals[i]); if(inp.accept.some(function(a){ return norm(a)===n; })) got++; });
  } else if(ex.type==='terminal'){
    total = ex.accepts.filter(function(a){ return a.ok; }).length;
    got = v.done.length;
  } else if(ex.type==='branch'){
    total = ex.steps.length;
    v.picks.forEach(function(pk){ if(pk.ok) got++; });
  } else if(ex.type==='spot'){
    var bad = ex.lines.map(function(l,i){ return l.bad?i:-1; }).filter(function(i){ return i>=0; });
    total = bad.length;
    v.sel.forEach(function(i){ if(bad.indexOf(i)>=0) got++; });
  }
  var earned = total ? ex.points * (got/total) : 0;
  if(r.hints) earned = Math.max(0, earned - ex.points*0.1*r.hints);
  return { total:total, got:got, earned:round2(earned) };
}

/* ---------- per-element feedback notes ---------- */
function elementNotes(ex, r){
  var v = r.val, out = '';
  function el(cls, ic, html){ out += '<div class="fb-elem '+cls+'"><span class="ic">'+ic+'</span><span>'+html+'</span></div>'; }
  if(ex.type==='choice'){
    var perm = S.shuf[ex.id];
    perm.opts.forEach(function(k){
      var o = byKey(ex.options,k), sel = v.sel.indexOf(k)>=0, cor = ex.correct.indexOf(k)>=0;
      if(o.note && (sel || cor)) el(sel?(cor?'g':'b'):(cor?'w':'m'), sel?(cor?'✓':'✗'):'▲', o.html+' — '+o.note);
    });
  } else if(ex.type==='slots'){
    ex.slots.forEach(function(sl,i){
      var key = v.put[i], tok = key?byKey(ex.bank,key):null, ok = slotOK(sl, key);
      if(key) el(ok?'g':'b', ok?'✓':'✗', '<b>'+esc(sl.label)+'</b>: '+(tok?tok.html:'')+(ok?(tok.why?' — '+tok.why:''):(' — correct: '+accHtml(ex,sl)+(sl.note?' — '+sl.note:''))));
      else el('w','▲','<b>'+esc(sl.label)+'</b>: left empty — correct: '+accHtml(ex,sl)+(sl.note?' — '+sl.note:''));
    });
  } else if(ex.type==='order'){
    var seq = v.seq || S.shuf[ex.id].items;
    ex.items.forEach(function(it,i){
      var placed = seq[i]===it.k;
      el(placed?'g':'b', placed?'✓':'✗', '<b>Position '+(i+1)+'</b>: '+it.html+(placed?' — '+it.why:' — you placed '+byKey(ex.items,seq[i]).html));
    });
  } else if(ex.type==='text'){
    ex.inputs.forEach(function(inp,i){
      var n = norm(v.vals[i]), ok = inp.accept.some(function(a){ return norm(a)===n; });
      el(ok?'g':'b', ok?'✓':'✗', '<b>'+inp.label+'</b>: '+(ok?'correct.':'expected <b>'+esc(inp.accept[0])+'</b>.')+(inp.why?' '+inp.why:''));
    });
  } else if(ex.type==='terminal'){
    ex.accepts.filter(function(a){ return a.ok; }).forEach(function(a,i){
      var ok = v.done.indexOf(i)>=0;
      el(ok?'g':'b', ok?'✓':'✗', '<code>'+esc(a.ex)+'</code>'+(a.why?' — '+a.why:''));
    });
  } else if(ex.type==='branch'){
    v.picks.forEach(function(pk,si){
      var o = ex.steps[si].options[pk.oi];
      el(pk.ok?'g':'b', pk.ok?'✓':'✗', '<b>Step '+(si+1)+'</b>: '+o.html+' — '+o.fb);
    });
  } else if(ex.type==='spot'){
    ex.lines.forEach(function(l,i){
      var sel = v.sel.indexOf(i)>=0;
      if(l.bad) el(sel?'g':'w', sel?'✓':'▲', 'Line '+(i+1)+' is faulty: '+l.why);
      else if(sel) el('b','✗','Line '+(i+1)+' is fine — selecting it was wrong: '+l.why);
    });
  }
  return out;
}

function correctSummary(ex){
  switch(ex.type){
    case 'choice': return ex.correct.map(function(k){ return byKey(ex.options,k).html; }).join(' · ');
    case 'slots': return ex.slots.map(function(sl,i){ return esc(sl.label)+' → '+accHtml(ex,sl); }).join(' · ');
    case 'order': return ex.items.map(function(it,i){ return (i+1)+'. '+it.html; }).join(' · ');
    case 'text': return ex.inputs.map(function(inp){ return esc(inp.label)+': <b>'+esc(inp.accept[0])+'</b>'; }).join(' · ');
    case 'terminal': return ex.accepts.filter(function(a){ return a.ok; }).map(function(a){ return '<code>'+esc(a.ex)+'</code>'; }).join(' then ');
    case 'branch': return ex.steps.map(function(st,i){ return 'Step '+(i+1)+': '+st.options.filter(function(o){ return o.ok; })[0].html; }).join(' · ');
    case 'spot': return ex.lines.map(function(l,i){ return l.bad?('line '+(i+1)):-1; }).filter(function(x){ return x>=0; }).join(', ');
  }
  return '';
}
function studentSummary(ex, r){
  var v = r.val;
  switch(ex.type){
    case 'choice': return v.sel.length? v.sel.map(function(k){ return byKey(ex.options,k).html; }).join(' · ') : '<i>no answer</i>';
    case 'slots': return Object.keys(v.put).length? ex.slots.map(function(sl,i){ var k=v.put[i]; return k?esc(sl.label)+' → '+byKey(ex.bank,k).html:esc(sl.label)+' → <i>empty</i>'; }).join(' · ') : '<i>no answer</i>';
    case 'order': return v.seq? v.seq.map(function(k,i){ return (i+1)+'. '+byKey(ex.items,k).html; }).join(' · ') : '<i>untouched</i>';
    case 'text': return v.vals.join('')? ex.inputs.map(function(inp,i){ return esc(inp.label)+': '+esc(v.vals[i]||'—'); }).join(' · ') : '<i>no answer</i>';
    case 'terminal': return v.hist.length? v.hist.map(function(l){ return '<code>'+esc(l.c)+'</code>'; }).join(' · ') : '<i>no commands</i>';
    case 'branch': return v.picks.length? v.picks.map(function(pk,i){ return 'Step '+(i+1)+': '+ex.steps[i].options[pk.oi].html; }).join(' · ') : '<i>not started</i>';
    case 'spot': return v.sel.length? v.sel.map(function(i){ return 'line '+(i+1); }).join(', ') : '<i>nothing selected</i>';
  }
  return '';
}

/* ---------- main exercise render ---------- */
function renderExercise(){
  var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
  r.visited = true;
  var locked = r.checked;
  $('#ex-meta').innerHTML =
    '<span class="chip">Exercise '+(S.cur+1)+' / '+DATA.length+'</span>'+
    '<span class="chip theme">'+esc(ex.theme)+'</span>'+
    '<span class="chip pts">'+ex.points+' pts</span>'+
    '<span class="kws">'+(ex.kw||[]).map(function(k){ return '<span class="kw">'+esc(k)+'</span>'; }).join('')+'</span>';
  var body = '<div class="scen"><div class="blk-leg">Scenario / context</div><div class="blk-body">'+ex.scenario+'</div></div>';
  body += rArtifacts(ex);
  body += '<div class="quest"><div class="blk-leg">Question</div><div class="blk-body">'+ex.question+'</div></div>';
  body += renderByType(ex, r, locked);
  $('#ex-body').innerHTML = body;
  var hb = $('#hintbox');
  if(r.hints>0 && ex.hint){ hb.innerHTML = '<b>Hint:</b> '+ex.hint+' <span class="mut">(−'+(10*r.hints)+'% penalty applied to this exercise)</span>'; hb.classList.remove('hidden'); }
  else hb.classList.add('hidden');
  if(r.checked) renderFeedback(ex, r);
  else { $('#fb').classList.add('hidden'); $('#fb').innerHTML=''; }
  $('#btn-check').disabled = r.checked;
  $('#btn-revise').disabled = !r.checked;
  $('#btn-prev').disabled = S.cur===0;
  $('#btn-hint').disabled = r.hints>0 || r.checked;
  $('#btn-next').innerHTML = S.cur===DATA.length-1 ? 'Submit exam' : 'Next';
  updatePauseUI(); renderNav(); updateScore(); updateProgress();
  window.scrollTo(0,0);
}

function renderFeedback(ex, r){
  var v = r.val;
  var full = r.got>=r.total && r.total>0;
  var vd = full?['g','✓','Correct']:(r.got>0?['w','▲','Partially correct']:['b','✗','Incorrect']);
  var h = '<div class="fb-verdict '+vd[0]+'"><span class="mkbig">'+vd[1]+'</span> '+vd[2]+' — you earned <b>'+round2(r.earned)+' / '+ex.points+'</b> points on this exercise'+
          (r.hints?' <span class="mut">(includes a −'+(10*r.hints)+'% hint penalty)</span>':'')+'</div>';
  h += '<div class="fb-elems">'+elementNotes(ex,r)+'</div>';
  h += '<div class="fb-explain"><b>Why:</b> '+ex.explain+'</div>';
  if(!full && ex.tip) h += '<div class="fb-tip"><b>Focus on:</b> '+ex.tip+'</div>';
  $('#fb').innerHTML = h;
  $('#fb').classList.remove('hidden');
}

/* ---------- chrome: nav, progress, score, timer, pause ---------- */
function navState(ex, r){
  if(r.skipped) return ['skipped','⏭','skipped'];
  if(r.checked){
    var full = r.got>=r.total && r.total>0;
    if(full) return ['full','✓','correct'];
    if(r.got>0) return ['partial','▲','partial'];
    return ['zero','✗','wrong'];
  }
  if(hasAnswer(ex,r)) return ['answered','●','answered'];
  if(r.visited) return ['','·','viewed'];
  return ['','','not visited'];
}
function renderNav(){
  var h = '';
  S.order.forEach(function(i, pos){
    var ex = DATA[i], r = rec(ex.id), st = navState(ex,r);
    h += '<button type="button" class="navbtn '+st[0]+(pos===S.cur?' current':'')+'" data-pos="'+pos+'" title="Exercise '+(pos+1)+' — '+st[2]+'" aria-label="Go to exercise '+(pos+1)+', '+st[2]+'">'+(pos+1)+'<span class="st" aria-hidden="true">'+st[1]+'</span></button>';
  });
  $('#nav').innerHTML = h;
}
function updateProgress(){
  var done = 0;
  S.order.forEach(function(i){ var r = S.ans[DATA[i].id]; if(r && (r.checked || r.skipped)) done++; });
  $('#progress').style.width = Math.round(100*done/DATA.length)+'%';
}
function liveScore(){
  var s = 0;
  S.order.forEach(function(i){ var r = S.ans[DATA[i].id]; if(r && r.checked && !r.skipped) s += r.earned; });
  return round2(s);
}
function updateScore(){
  var s = liveScore();
  $('#score').textContent = (Math.round(s*10)/10)+' pts';
}
function updateTimer(){
  var el = $('#timer');
  el.textContent = fmtTime(S.t.left);
  el.classList.toggle('low', S.t.left <= 300);
}
function updatePauseUI(){
  var h = '';
  if(S.t.manual) h += '<span class="pi manual">⏸ Paused (manual)</span>';
  if(S.t.check) h += '<span class="pi review">⏸ Timer paused — review mode</span>';
  $('#pause-indicators').innerHTML = h;
  $('#btn-pause').setAttribute('aria-pressed', S.t.manual?'true':'false');
  $('#btn-pause').textContent = S.t.manual?'Resume':'Pause';
  $('#pause-shield').classList.toggle('hidden', !S.t.manual);
  $('#ex-card').classList.toggle('paused', S.t.manual);
  $$('#ex-card .scen, #ex-card .quest, #ex-card .art, #ex-card .ansblk, #ex-card #fb, #ex-card #hintbox, #ex-card .ex-meta').forEach(function(n){
    n.setAttribute('aria-hidden', S.t.manual?'true':'false');
  });
}
var _tick = null;
function startTicker(){
  if(_tick) return;
  _tick = setInterval(function(){
    if(!S || !S.started || S.finished) return;
    if(S.t.manual || S.t.check) return;
    S.t.left--;
    updateTimer();
    if(S.t.left<=0) finish('timeout');
  }, 1000);
}

/* ---------- toast ---------- */
var _toastT = null;
function toast(msg, warn){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('warn', !!warn);
  t.classList.remove('hidden');
  if(_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.classList.add('hidden'); }, 3600);
}

/* ---------- finish + results ---------- */
function finish(reason){
  if(S.finished) return;
  S.finished = true;
  S.t.manual = false; S.t.check = false; updatePauseUI();
  /* auto-grade answered-but-unchecked exercises (they were actually answered); never-answered become skipped */
  S.order.forEach(function(i){
    var ex = DATA[i], r = rec(ex.id);
    if(r.checked) return;
    if(hasAnswer(ex, r)){
      var g = grade(ex, r);
      r.got = g.got; r.total = g.total; r.earned = g.earned; r.checked = true; r.auto = true;
    } else if(!r.skipped){
      r.skipped = true;
    }
  });
  renderResults(reason);
}

function renderResults(reason){
  var possible = 0, earnedSum = 0, skippedCount = 0, answeredCount = 0;
  var themes = {};
  S.order.forEach(function(i){
    var ex = DATA[i], r = rec(ex.id);
    if(r.skipped){ skippedCount++; return; }
    possible += ex.points; earnedSum += r.earned; answeredCount++;
    if(!themes[ex.theme]) themes[ex.theme] = { e:0, m:0, n:0 };
    themes[ex.theme].e += r.earned; themes[ex.theme].m += ex.points; themes[ex.theme].n++;
  });
  var earnedR = Math.round(earnedSum);
  var percent = possible>0 ? Math.round(100*earnedR/possible) : 0;
  var passed = percent >= CFG.passMark;

  var hero = '<div class="chips" style="justify-content:center"><span class="chip">'+esc(CFG.title)+'</span><span class="chip sev">'+CFG.severity+'</span></div>'+
    '<div class="pct" style="color:'+(passed?'var(--good)':'var(--bad)')+'">'+percent+'%</div>'+
    '<div class="mut">Earned <b>'+earnedR+'</b> of <b>'+possible+'</b> points across <b>'+answeredCount+'</b> counted exercise(s) · '+skippedCount+' skipped (not counted) · pass mark '+CFG.passMark+'%</div>';
  hero += passed
    ? '<div class="passband pass">✓ PASS — well done, you mastered this module.</div><div class="certline">Candidate'+(window.__cpName?': '+esc(window.__cpName):'')+' · '+esc(CFG.cert)+' · Objective 3.2 · '+CFG.severity+' · completed '+new Date().toLocaleString()+'</div>'
    : '<div class="passband fail">✗ FAIL — you must retake this exam to pass.</div><div class="certline">Review the report below, then press “Retake exam”. Questions and answers are reshuffled on every attempt.</div>';
  if(reason==='timeout') hero += '<div class="mut" style="margin-top:8px">Time ran out — the exam was scored automatically.</div>';
  $('#res-hero').innerHTML = hero;

  var th = '<h2 class="h2">Progress per theme</h2>';
  Object.keys(themes).forEach(function(name){
    var t = themes[name], pc = t.m? Math.round(100*t.e/t.m) : 0;
    th += '<div class="tbar"><span class="tname">'+esc(name)+'</span><span class="ttrack"><span class="tfill" style="width:'+pc+'%"></span></span><span class="tnum">'+round2(t.e)+' / '+t.m+' pts</span></div>';
  });
  $('#res-themes').innerHTML = th;

  var list = '<h2 class="h2">Per-exercise report</h2>';
  S.order.forEach(function(i, pos){
    var ex = DATA[i], r = rec(ex.id);
    var label = r.skipped?['skipped','⏭ Skipped']:(r.total && r.got>=r.total?['full','✓ Full']:(r.got>0?['partial','▲ Partial']:['zero','✗ Zero']));
    list += '<div class="rep-item"><div class="rep-head"><span class="rep-num">#'+(pos+1)+'</span><span class="rep-title">'+esc(ex.t)+'</span>'+
            '<span class="lab '+label[0]+'">'+label[1]+'</span><span class="rep-pts">'+(r.skipped?'—':(round2(r.earned)+' / '+ex.points))+' pts</span></div>';
    if(r.skipped){
      list += '<div class="rep-body mut">Skipped — excluded from scoring (neither counted in your points nor in the maximum).</div>';
    } else {
      list += '<div class="rep-sec">Your answer</div><div class="rep-body">'+studentSummary(ex,r)+'</div>';
      list += '<div class="rep-sec">Correct answer</div><div class="rep-body">'+correctSummary(ex)+'</div>';
    }
    list += '<div class="fb-explain"><b>Why:</b> '+ex.explain+'</div>';
    if(!r.skipped && r.got<r.total && ex.tip) list += '<div class="fb-tip"><b>Focus on:</b> '+ex.tip+'</div>';
    list += '</div>';
  });
  $('#res-list').innerHTML = list;

  $('#scr-exam').classList.add('hidden');
  $('#scr-results').classList.remove('hidden');
  $('#greet2').textContent = window.__cpName ? ('Candidate: '+window.__cpName) : '';
  window.scrollTo(0,0);
  reportScore(earnedR, possible);
}

/* ---------- website integration (CyberPulseAcademy) ---------- */
function reportScore(correct, total){
  if(S.reported) return;
  S.reported = true;
  var percent = total>0 ? Math.round((correct/total)*100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch(e) { /* opened directly, no parent to report to */ }
}
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  try {
    if(event.data.username){ window.__cpName = String(event.data.username).slice(0,60); }
    var g1 = $('#greet'), g2 = $('#greet2');
    if(window.__cpName && g1) g1.textContent = 'Candidate: '+window.__cpName;
    if(window.__cpName && g2) g2.textContent = 'Candidate: '+window.__cpName;
  } catch(e) {}
});

/* ---------- navigation actions ---------- */
function goNext(){
  S.t.check = false; updatePauseUI();
  if(S.cur < DATA.length-1){ S.cur++; renderExercise(); }
  else trySubmit();
}
function goPrev(){
  S.t.check = false; updatePauseUI();
  if(S.cur > 0){ S.cur--; renderExercise(); }
}
function trySubmit(){
  var answered = 0;
  S.order.forEach(function(i){ var r = S.ans[DATA[i].id]; if(r && !r.skipped && (r.checked || hasAnswer(DATA[i], r))) answered++; });
  if(answered===0){ toast('You must answer at least one exercise before submitting. Nothing was skipped-and-answered yet.', true); return; }
  finish('submit');
}
function doCheck(){
  var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
  if(r.checked) return;
  if(ex.type==='branch' && r.val.step < ex.steps.length){ toast('Answer every step of the workflow first (step '+(r.val.step+1)+' of '+ex.steps.length+' is pending).', true); return; }
  var g = grade(ex, r);
  r.got = g.got; r.total = g.total; r.earned = g.earned; r.checked = true; r.skipped = false;
  S.t.check = true;
  renderExercise();
  var fb = $('#fb');
  if(fb) fb.scrollIntoView({ block:'nearest', behavior:'smooth' });
}
function doRevise(){
  var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
  if(!r.checked) return;
  r.checked = false; r.earned = 0; r.got = 0; r.total = 0; r.auto = false;
  if(ex.type==='branch'){ r.val.step = 0; r.val.picks = []; }
  S.t.check = false;
  renderExercise();
}
function doSkip(){
  var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
  r.skipped = true; r.checked = false; r.earned = 0; r.got = 0; r.total = 0;
  S.t.check = false;
  renderNav(); updateProgress(); updateScore();
  if(S.cur < DATA.length-1){ S.t.check=false; S.cur++; renderExercise(); }
  else toast('Last exercise — press Submit exam when you are ready.', true);
}
function doHint(){
  var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
  if(r.hints>0 || r.checked) return;
  r.hints++;
  var hb = $('#hintbox');
  hb.innerHTML = '<b>Hint:</b> '+ex.hint+' <span class="mut">(−'+(10*r.hints)+'% penalty applied to this exercise at Check)</span>';
  hb.classList.remove('hidden');
  $('#btn-hint').disabled = true;
}
function doPause(){
  S.t.manual = !S.t.manual;
  updatePauseUI();
}

/* ---------- events ---------- */
function wireEvents(){
  $('#btn-start').addEventListener('click', startExam);
  $('#btn-retake').addEventListener('click', startExam);
  $('#btn-check').addEventListener('click', doCheck);
  $('#btn-skip').addEventListener('click', doSkip);
  $('#btn-next').addEventListener('click', goNext);
  $('#btn-prev').addEventListener('click', goPrev);
  $('#btn-pause').addEventListener('click', doPause);
  $('#btn-hint').addEventListener('click', doHint);
  $('#btn-revise').addEventListener('click', doRevise);
  $('#btn-submit').addEventListener('click', trySubmit);

  $('#nav').addEventListener('click', function(ev){
    var b = ev.target.closest('.navbtn'); if(!b) return;
    S.t.check = false; updatePauseUI();
    S.cur = +b.getAttribute('data-pos');
    renderExercise();
  });

  var body = $('#ex-body');
  body.addEventListener('change', function(ev){
    var t = ev.target;
    if(t.matches('input[type=radio],input[type=checkbox]')){
      var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
      if(r.checked) return;
      if(t.type==='radio'){ r.val.sel = [t.value]; }
      else {
        var i = r.val.sel.indexOf(t.value);
        if(t.checked && i<0) r.val.sel.push(t.value);
        if(!t.checked && i>=0) r.val.sel.splice(i,1);
      }
      renderNav();
    }
  });
  body.addEventListener('input', function(ev){
    var t = ev.target;
    if(t.matches('.tin')){
      var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
      r.val.vals[+t.getAttribute('data-tin')] = t.value;
      r.val.touched = true;
      renderNav();
    }
    if(t.matches('.art-filter')){
      var pre = document.getElementById(t.getAttribute('data-art'));
      var q = norm(t.value);
      $$('#'+pre.id+' .ln').forEach(function(ln){
        ln.classList.toggle('off', q!=='' && norm(ln.textContent).indexOf(q)<0);
      });
    }
  });
  body.addEventListener('keydown', function(ev){
    if(ev.target && ev.target.id==='term-in' && ev.key==='Enter'){
      var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
      var cmd = ev.target.value.replace(/\s+/g,' ').trim();
      if(!cmd) return;
      var out = ex.deny || 'Command not recognized.';
      for(var i=0;i<ex.accepts.length;i++){
        var a = ex.accepts[i];
        if(new RegExp(a.re,'i').test(norm(cmd))){
          if(a.ok){
            if(r.val.done.indexOf(i)<0) r.val.done.push(i);
            out = a.out; break;
          }
          out = a.out; break;
        }
      }
      r.val.hist.push({ p: ex.prompt, c: cmd, o: out });
      var hist = $('#term-hist');
      var div = document.createElement('div');
      div.innerHTML = '<div class="t-line"><span class="t-p">'+esc(ex.prompt)+'</span> '+esc(cmd)+'</div>'+(out?'<div class="t-out">'+out+'</div>':'');
      while(div.firstChild) hist.appendChild(div.firstChild);
      ev.target.value = '';
      renderNav();
    }
  });
  body.addEventListener('click', function(ev){
    var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
    var tok = ev.target.closest('.tok');
    var slot = ev.target.closest('.slot');
    var mv = ev.target.closest('.mv');
    var bopt = ev.target.closest('.br-opt');
    var sline = ev.target.closest('.sline');
    if(r.checked) return;
    if(tok && !tok.disabled){
      var already = tok.classList.contains('sel');
      $$('#ex-body .tok').forEach(function(b){ b.classList.remove('sel'); });
      if(!already) tok.classList.add('sel');
      return;
    }
    if(slot){
      var si = +slot.getAttribute('data-slot');
      var selTok = document.querySelector('#ex-body .tok.sel');
      if(selTok){
        var k = selTok.getAttribute('data-key');
        Object.keys(r.val.put).forEach(function(pi){ if(r.val.put[pi]===k) delete r.val.put[pi]; });
        r.val.put[si] = k;
      } else if(r.val.put[si]){
        delete r.val.put[si];
      }
      renderExercise();
      return;
    }
    if(mv){
      var li = mv.closest('.ord-item'), k = li.getAttribute('data-key'), dir = +mv.getAttribute('data-dir');
      var seq = r.val.seq || S.shuf[ex.id].items.slice();
      var i = seq.indexOf(k), j = i+dir;
      if(j>=0 && j<seq.length){ var tmp=seq[i]; seq[i]=seq[j]; seq[j]=tmp; }
      r.val.seq = seq; r.val.touched = true;
      renderExercise();
      return;
    }
    if(bopt){
      var oi = +bopt.getAttribute('data-oi');
      var ok = !!ex.steps[r.val.step].options[oi].ok;
      r.val.picks.push({ oi:oi, ok:ok });
      r.val.step++;
      renderExercise();
      return;
    }
    if(sline){
      var li2 = +sline.getAttribute('data-li');
      var p = r.val.sel.indexOf(li2);
      if(p>=0) r.val.sel.splice(p,1); else r.val.sel.push(li2);
      sline.classList.toggle('sel');
      renderNav();
      return;
    }
  });
  /* HTML5 drag support for tokens and order items */
  body.addEventListener('dragstart', function(ev){
    var tok = ev.target.closest('.tok'), li = ev.target.closest('.ord-item');
    if(tok) ev.dataTransfer.setData('text/plain', 'tok:'+tok.getAttribute('data-key'));
    if(li) ev.dataTransfer.setData('text/plain', 'ord:'+li.getAttribute('data-key'));
  });
  body.addEventListener('dragover', function(ev){
    var slot = ev.target.closest('.slot'), li = ev.target.closest('.ord-item');
    if(slot || li){ ev.preventDefault(); if(li) li.classList.add('dragover'); }
  });
  body.addEventListener('dragleave', function(ev){
    var li = ev.target.closest('.ord-item'); if(li) li.classList.remove('dragover');
  });
  body.addEventListener('drop', function(ev){
    var slot = ev.target.closest('.slot'), li = ev.target.closest('.ord-item');
    if(!slot && !li) return;
    ev.preventDefault();
    var d = ev.dataTransfer.getData('text/plain') || '';
    var idx = S.order[S.cur], ex = DATA[idx], r = rec(ex.id);
    if(slot && d.indexOf('tok:')===0){
      var k = d.slice(4), si = +slot.getAttribute('data-slot');
      Object.keys(r.val.put).forEach(function(pi){ if(r.val.put[pi]===k) delete r.val.put[pi]; });
      r.val.put[si] = k;
      renderExercise();
    }
    if(li && d.indexOf('ord:')===0){
      var kk = d.slice(4), target = li.getAttribute('data-key');
      var seq = r.val.seq || S.shuf[ex.id].items.slice();
      var from = seq.indexOf(kk), to = seq.indexOf(target);
      if(from>=0 && to>=0){ seq.splice(to,0,seq.splice(from,1)[0]); }
      r.val.seq = seq; r.val.touched = true;
      renderExercise();
    }
  });
}

/* ---------- intro + start ---------- */
function renderIntro(){
  document.title = CFG.docTitle;
  $('#intro-title').textContent = CFG.title;
  $('#intro-sub').textContent = CFG.sub;
  $('#intro-chips-top').innerHTML = '<span class="chip">'+esc(CFG.cert)+'</span><span class="chip">Objective 3.2 — Life-cycle management</span><span class="chip sev">Severity: '+CFG.severity+'</span>';
  $('#intro-chips').innerHTML = '<span class="chip">'+DATA.length+' exercises</span><span class="chip">'+CFG.minutes+' minutes</span><span class="chip">Pass mark '+CFG.passMark+'%</span><span class="chip">Hints: −10% each</span><span class="chip">Partial credit on multi-answer items</span>';
  var kw = '';
  CFG.kwGroups.forEach(function(g){ kw += '<div class="kwgroup"><b>'+esc(g[0])+'</b>'+g[1].map(function(k){ return '<span class="kw">'+esc(k)+'</span>'; }).join('')+'</div>'; });
  $('#kw-panel').innerHTML = kw;
  $('#intro-rules').innerHTML =
    '<li>This is a realistic, scenario-based practice exam for <b>objective 3.2 — life-cycle management</b> (EOL, EOS, software management, decommissioning). Severity of every exercise: <b>'+CFG.severity+'</b>.</li>'+
    '<li>Passing score: <b>'+CFG.passMark+'%</b>. The live score counter in the top bar updates every time you press <b>Check</b>.</li>'+
    '<li>Every exercise has three parts: <b>Scenario</b>, <b>Question</b>, and a clearly labelled <b>answer area</b>. Read them in that order.</li>'+
    '<li><b>Check</b> validates your answer, marks each element green/red/amber, shows an explanation, locks the answer for scoring, and <b>pauses the timer for review</b>. The exercise stays visible in review mode. Only pressing <b>Next</b> restarts the clock.</li>'+
    '<li><b>Pause</b> (top bar) is a separate, manual pause: the clock freezes but the exercise is hidden while paused. Both pause reasons can stack — the clock runs again only when both are cleared.</li>'+
    '<li><b>Skip</b> jumps past an exercise (amber marker in the navigator). You can return to skipped exercises until the timer ends or you submit. Skipped exercises are <b>excluded from scoring</b> — they add neither earned nor possible points.</li>'+
    '<li>Multi-answer exercises give <b>partial credit</b>: each correct element earns its share of the points; wrong picks earn nothing extra but do not subtract.</li>'+
    '<li>One <b>hint</b> per exercise: it costs <b>−10%</b> of that exercise’s points and gives a nudge, never the answer.</li>'+
    '<li>When the timer runs out, the exam ends and is scored automatically. On retake, questions and answer choices are reshuffled.</li>';
  $('#intro-types').innerHTML = CFG.types.map(function(t){ return '<li>'+t+'</li>'; }).join('');
}
function startExam(){
  S = freshState();
  $('#scr-intro').classList.add('hidden');
  $('#scr-results').classList.add('hidden');
  $('#scr-exam').classList.remove('hidden');
  $('#tb-title').textContent = CFG.title;
  $('#tb-sev').textContent = CFG.severity;
  updateTimer();
  renderExercise();
  startTicker();
  window.scrollTo(0,0);
}

/* ---------- boot ---------- */
wireEvents();
renderIntro();
/* test hook (harmless in production, used by the sandbox verification run) */
window.__exam = { get S(){ return S; }, CFG: CFG };

</script>
</body>
