}

/* ---------- marks painting ---------- */
function paintOptMarks(root, rec) {
  var g = rec.grade; if (!g) return;
  var m = g.optMarks || g.subMarks; if (!m) return;
  $$('.opt', root).forEach(function (b) {
    var st = m[b.dataset.k]; if (!st) return;
    b.classList.add(st, 'lock');
    b.setAttribute('aria-disabled', 'true');
    var mk = $('.optmark', b); if (mk) mk.textContent = st === 'ok' ? '✓' : st === 'bad' ? '✗' : st === 'miss' ? '✓' : '';
  });
}
function paintSetMarks(wrap, rec) {
  var g = rec.grade; if (!g || !g.cardMarks) return;
  g.cardMarks.forEach(function (cm) {
    var card = $('.setcard[data-card="' + cm.i + '"]', wrap); if (!card) return;
    card.classList.add(cm.state);
    var rtC = rec.rt.cards[cm.i];
    $$('.opt', card).forEach(function (b) {
      var o = null; rtC.opts.forEach(function (x) { if (x.k === b.dataset.k) o = x; });
      if (!o) return;
      var st = null;
      if (o.ok && rec.ans.pick[cm.i] === o.k) st = 'ok';
      else if (o.ok) st = 'miss';
      else if (rec.ans.pick[cm.i] === o.k) st = 'bad';
      if (st) {
        b.classList.add(st, 'lock'); b.setAttribute('aria-disabled', 'true');
        var mk = $('.optmark', b); if (mk) mk.textContent = st === 'ok' ? '✓' : st === 'bad' ? '✗' : '✓';
      }
    });
  });
}
function paintSpotMarks(lines, rec) {
  var g = rec.grade; if (!g || !g.lineMarks) return;
  $$('.cline', lines).forEach(function (b) {
    var i = parseInt(b.dataset.line, 10);
    if (i === g.lineMarks.correct) { b.classList.add('ok'); b.classList.add('lock'); }
    if (g.lineMarks.picked === i && g.lineMarks.picked !== g.lineMarks.correct) { b.classList.add('bad', 'lock'); }
  });
}
function paintMarks(ex, rec) {
  var A = $('#exAnswers');
  if (ex.type === 'place') { A.innerHTML = ''; BUILD.place(ex, rec, A); if (rec.hints) showHint(ex, rec, false); }
  else if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'log') { paintOptMarks(A, rec); }
  else if (ex.type === 'set') { var w = $('.setwrap', A); if (w) paintSetMarks(w, rec); }
  else if (ex.type === 'spot') { var L = $('.codelines', A); if (L) paintSpotMarks(L, rec); }
}

/* ---------- feedback ---------- */
function warnFb(msg) {
  var fb = $('#fb'); fb.hidden = false; fb.innerHTML = '';
  fb.appendChild(h('div', 'part warn', '<span class="pico">⚠</span><span><span class="plab">' + esc(msg) + '</span></span>'));
}
function paintFeedback(ex, rec) {
  var fb = $('#fb'); fb.hidden = false; fb.innerHTML = '';
  var g = rec.grade;
  var lab = g.earned >= PTS - 1e-9 ? 'FULL' : (g.earned > 1e-9 ? 'PARTIAL' : 'ZERO');
  var row = h('div', 'fbrow');
  row.appendChild(h('span', 'fbchip ' + lab.toLowerCase(), (lab === 'FULL' ? '✓ ' : lab === 'PARTIAL' ? '◐ ' : '✗ ') + lab));
  row.appendChild(h('span', 'fbscore', 'You earned <b>' + fmtPts(g.earned) + '</b> / ' + PTS + ' points on this exercise' + (rec.hints ? ' <span class="dim">· hint used (−10%)</span>' : '')));
  fb.appendChild(row);
  paintMarks(ex, rec);
  (g.parts || []).forEach(function (p) {
    fb.appendChild(h('div', 'part ' + p.state, '<span class="pico">' + (p.state === 'ok' ? '✓' : p.state === 'bad' ? '✗' : '⚠') + '</span><span><span class="plab">' + esc(p.label) + '</span>' + (p.note ? ' <span class="pnote">' + esc(p.note) + '</span>' : '') + '</span>'));
  });
  fb.appendChild(h('div', 'fbwhy', '<div class="whytitle">WHY</div>' + ex.explain));
  fb.appendChild(h('div', 'cpnote', '⏸ Timer paused — review mode. The clock restarts when you press Next (or move to another question).'));
}

/* ---------- grading ---------- */
var GRADE = {};
GRADE.qcm = function (ex, rec) {
  if (rec.ans.key == null) { warnFb('Select an option, then press Check.'); return null; }
  var okK = 'o' + ex.ans, ok = rec.ans.key === okK, marks = {};
  rec.rt.opts.forEach(function (o) {
    if (o.k === okK) marks[o.k] = ok ? 'ok' : 'miss';
    else if (rec.ans.key === o.k) marks[o.k] = 'bad';
  });
  return { earned: ok ? PTS : 0, parts: [{ label: ok ? 'Correct.' : 'Wrong.', state: ok ? 'ok' : 'bad', note: ok ? 'That is the right call.' : 'The correct option is now marked with a dashed outline.' }], optMarks: marks };
};
GRADE.multi = function (ex, rec) {
  if (!rec.ans.keys.length) { warnFb('Select at least one option, then press Check.'); return null; }
  var okKeys = rec.rt.opts.filter(function (o) { return o.ok; }).map(function (o) { return o.k; });
  var hit = rec.ans.keys.filter(function (k) { return okKeys.indexOf(k) >= 0; }).length;
  var marks = {};
  rec.rt.opts.forEach(function (o) {
    if (o.ok && rec.ans.keys.indexOf(o.k) >= 0) marks[o.k] = 'ok';
    else if (o.ok) marks[o.k] = 'miss';
    else if (rec.ans.keys.indexOf(o.k) >= 0) marks[o.k] = 'bad';
  });
  return { earned: PTS * hit / okKeys.length, parts: [{ label: hit + ' of ' + okKeys.length + ' correct items selected.', state: hit === okKeys.length ? 'ok' : (hit ? 'warn' : 'bad'), note: 'Wrong picks earn nothing extra, but they never take points away.' }], optMarks: marks };
};
GRADE.log = function (ex, rec) {
  if (ex.sub.kind === 'qcm') {
    if (rec.ans.sub == null) { warnFb('Choose an answer below the log, then press Check.'); return null; }
    var okK = 'o' + ex.sub.ans, ok = rec.ans.sub === okK, marks = {};
    rec.rt.subOpts.forEach(function (o) {
      if (o.k === okK) marks[o.k] = ok ? 'ok' : 'miss';
      else if (rec.ans.sub === o.k) marks[o.k] = 'bad';
    });
    return { earned: ok ? PTS : 0, parts: [{ label: ok ? 'Correct.' : 'Wrong.', state: ok ? 'ok' : 'bad', note: ok ? 'Good read of the log.' : 'The correct choice is marked below.' }], subMarks: marks };
  }
  if (!rec.ans.sub.length) { warnFb('Select at least one answer below the log, then press Check.'); return null; }
  var okKeys = rec.rt.subOpts.filter(function (o) { return o.ok; }).map(function (o) { return o.k; });
  var hit = rec.ans.sub.filter(function (k) { return okKeys.indexOf(k) >= 0; }).length;
  var marks = {};
  rec.rt.subOpts.forEach(function (o) {
    if (o.ok && rec.ans.sub.indexOf(o.k) >= 0) marks[o.k] = 'ok';
    else if (o.ok) marks[o.k] = 'miss';
    else if (rec.ans.sub.indexOf(o.k) >= 0) marks[o.k] = 'bad';
  });
  return { earned: PTS * hit / okKeys.length, parts: [{ label: hit + ' of ' + okKeys.length + ' correct items selected.', state: hit === okKeys.length ? 'ok' : (hit ? 'warn' : 'bad'), note: 'Wrong picks earn nothing extra, but they never take points away.' }], subMarks: marks };
};
GRADE.place = function (ex, rec) {
  var any = rec.rt.items.some(function (it) { return slotOf(rec, it.id) !== -1; });
  if (!any) { warnFb('Place at least one item into a slot, then press Check.'); return null; }
  var okN = 0, itemMarks = {}, parts = [];
  var real = rec.rt.items.filter(function (it) { return it.slot >= 0; });
  real.forEach(function (it) {
    var s = slotOf(rec, it.id);
    if (s === it.slot) { okN++; itemMarks[it.id] = 'ok'; parts.push({ label: it.t + ' → ' + slotLab(ex, it.slot), state: 'ok', note: 'Correct.' }); }
    else if (s === -1) { itemMarks[it.id] = 'warn'; parts.push({ label: it.t, state: 'warn', note: 'Left in the bank — it belongs in “' + slotLab(ex, it.slot) + '”.' }); }
    else { itemMarks[it.id] = 'bad'; parts.push({ label: it.t + ' → ' + slotLab(ex, s), state: 'bad', note: 'Wrong slot — it belongs in “' + slotLab(ex, it.slot) + '”.' }); }
  });
  return { earned: PTS * okN / real.length, parts: parts, itemMarks: itemMarks };
};
GRADE.spot = function (ex, rec) {
  if (rec.ans.line == null) { warnFb('Click the line you think is wrong, then press Check.'); return null; }
  var ok = rec.ans.line === ex.bad;
  return { earned: ok ? PTS : 0, lineMarks: { correct: ex.bad, picked: rec.ans.line },
    parts: [{ label: ok ? 'Correct line.' : 'Wrong line.', state: ok ? 'ok' : 'bad', note: ok ? 'That line is the real problem.' : 'You picked line ' + (rec.ans.line + 1) + '. The mistake is on line ' + (ex.bad + 1) + ', now marked in green.' }] };
};
GRADE.term = function (ex, rec) {
  if (!rec.ans.cmd) { warnFb('Type a command in the terminal and press Enter, then press Check.'); return null; }
  var n = normCmd(rec.ans.cmd);
  var ok = ex.ok.some(function (rs) { return rs.test(n); });
  return { earned: ok ? PTS : 0, parts: [{ label: 'Graded command: ' + rec.ans.cmd, state: ok ? 'ok' : 'bad', note: ok ? 'Right tool and right flags.' : 'The expected command shape is shown in the explanation below.' }] };
};
GRADE.set = function (ex, rec) {
  var n = ex.cards.length, hit = 0, cardMarks = [], parts = [], any = false;
  rec.rt.cards.forEach(function (c, i) {
    var p = rec.ans.pick[i];
    var okT = ex.cards[i].opts[ex.cards[i].ans];
    if (p != null) any = true;
    if (p === 'o' + ex.cards[i].ans) { hit++; cardMarks.push({ i: i, state: 'ok' }); parts.push({ label: c.title + ' — correct.', state: 'ok', note: 'Right action.' }); }
    else if (p == null) { cardMarks.push({ i: i, state: 'warn' }); parts.push({ label: c.title + ' — not answered.', state: 'warn', note: 'The right action: ' + okT + '.' }); }
    else { cardMarks.push({ i: i, state: 'bad' }); parts.push({ label: c.title + ' — wrong action.', state: 'bad', note: 'The right action: ' + okT + '.' }); }
  });
  if (!any) { warnFb('Choose an action for at least one item, then press Check.'); return null; }
  return { earned: PTS * hit / n, parts: parts, cardMarks: cardMarks };
};

/* ---------- branch grading ---------- */
function branchGrade(ex, st) {
  var share = PTS / ex.steps;
  var parts = st.results.map(function (r, i) {
    return { label: 'Step ' + (i + 1) + ' — ' + (r.ok ? 'correct: ' : 'wrong: ') + r.t, state: r.ok ? 'ok' : 'bad', note: r.why || '' };
  });
  return { earned: st.ok * share, parts: parts };
}
function showStepFb(ex, rec, ch, stepNo, canCont) {
  var fb = $('#fb'); fb.hidden = false; fb.innerHTML = '';
  fb.appendChild(h('div', 'part ok', '<span class="pico">✓</span><span><span class="plab">Step ' + stepNo + ' correct — ' + esc(ch.t) + '</span>' + (ch.why ? ' <span class="pnote">' + esc(ch.why) + '</span>' : '') + '</span>'));
  fb.appendChild(h('div', 'cpnote', '⏸ Timer paused — review mode.'));
  if (canCont) {
    var bb = nd('button', 'btn primary'); bb.type = 'button'; bb.id = 'btnCont'; bb.textContent = 'Continue to the next step ▸';
    bb.addEventListener('click', function () {
      var st = rec.ans;
      st.node = st.lastOk.ch.next; st.lastOk = null; st.pick = null;
      renderEx();
      live('Next decision step.');
    });
    fb.appendChild(bb);
    fb.appendChild(h('div', 'pnote', 'To restart the scenario from step 1, press Revise.'));
  }
}
function gradeBranchStep(ex, rec) {
  var st = rec.ans;
  if (st.done) return;
  if (st.lastOk) { showStepFb(ex, rec, st.lastOk.ch, st.results.length, true); return; }
  if (st.pick == null) { warnFb('Select an option for this step, then press Check.'); return; }
  var ch = ex.nodes[st.node].choices[st.pick];
  st.results.push({ t: ch.t, ok: !!ch.ok, why: ch.why || '' });
  rec.cpause = true;
  if (ch.ok) {
    st.ok++;
    if (ch.next) { st.lastOk = { ch: ch }; showStepFb(ex, rec, ch, st.results.length, true); updateInds(); }
    else { st.done = true; lockAndPaint(ex, rec, branchGrade(ex, st)); }
  } else {
    st.done = true; st.failed = true;
    lockAndPaint(ex, rec, branchGrade(ex, st));
  }
}

/* ---------- check / lock ---------- */
function checkEx() {
  if (S.finished) return;
  var exIdx = S.order[S.pos], ex = EX[exIdx], rec = S.recs[exIdx];
  if (rec.status === 'checked') return;
  if (ex.type === 'branch') { gradeBranchStep(ex, rec); return; }
  var g = GRADE[ex.type](ex, rec);
  if (!g) return;
  lockAndPaint(ex, rec, g);
}
function lockAndPaint(ex, rec, g) {
  rec.grade = g; rec.status = 'checked';
  rec.earned = g.earned * (rec.hints ? 0.9 : 1);
  rec.cpause = true;
  if (ex.type === 'branch') { rebuildAnswers(ex, rec); if (rec.hints) showHint(ex, rec, false); }
  paintFeedback(ex, rec);
  updateHud(); updateControls(); updateInds(); paintNavi();
  live('Answer checked: ' + fmtPts(rec.earned) + ' of ' + PTS + ' points. Timer paused for review.');
}

/* ---------- flow ---------- */
function advance() {
  if (S.finished) return;
  if (S.pos < EX.length - 1) { gotoPos(S.pos + 1); }
  else { openSubmit(); }
}
function openSubmit() {
  if (S.finished) return;
  var checked = 0, skipped = 0, pend = 0;
  S.recs.forEach(function (r) { if (r.status === 'checked') checked++; else if (r.status === 'skipped') skipped++; else pend++; });
  if (checked === 0) {
    warnModal('<p>You must <b>Check</b> at least one exercise before submitting.' + (checked + skipped + pend === EX.length && skipped === EX.length ? ' Every exercise is skipped, and a fully skipped exam cannot be submitted.' : '') + '</p><p>Open any exercise, answer it and press Check. Skipped exercises are excluded from scoring.</p>');
    return;
  }
  confirmModal('Submit the exam?',
    '<p>Checked (scored): <b>' + checked + '</b> · Skipped: <b>' + skipped + '</b> · Not checked: <b>' + pend + '</b></p><p>Skipped and unchecked exercises are excluded from the score. After submitting you cannot change answers.</p>',
    'Submit exam', function () { finish('submit'); });
}
function togglePause() {
  if (!S.started || S.finished) return;
  S.manual = !S.manual;
  $('#btnPause').textContent = S.manual ? 'Resume' : 'Pause';
  $('#btnPause').setAttribute('aria-pressed', S.manual ? 'true' : 'false');
  applyPauseVeil(); updateInds(); renderTimer();
  live(S.manual ? 'Exam paused. Content hidden.' : 'Exam resumed.');
}
function finish(reason) {
  if (S.finished) return;
  S.finished = true;
  clearInterval(S.tick);
  closeModal();
  S.manual = false; applyPauseVeil();
  $('#indManual').hidden = true; $('#indCheck').hidden = true;
  var checkedIdx = [], skippedIdx = [], pendIdx = [];
  S.recs.forEach(function (r, i) { if (r.status === 'checked') checkedIdx.push(i); else if (r.status === 'skipped') skippedIdx.push(i); else pendIdx.push(i); });
  var total = checkedIdx.length * PTS, earned = 0;
  checkedIdx.forEach(function (i) { earned += S.recs[i].earned; });
  var score = Math.round(earned);
  var tDen = Math.max(total, 1);
  var percent = Math.round(score / tDen * 100);
  var passed = total > 0 && percent >= CFG.passMark;
  renderResults({ checkedIdx: checkedIdx, skippedIdx: skippedIdx, pendIdx: pendIdx, total: total, earned: earned, score: score, percent: percent, passed: passed, reason: reason });
  updateHud();
  show('scrResults');
  window.scrollTo(0, 0);
  animateScore(percent, function () {
    if (!S.reported) {
      S.reported = true;
      try {
        parent.postMessage({ type: 'CYBERPULSE_SCORE', topicId: CFG.topicId, score: score, total: tDen, percent: percent, passed: passed }, location.origin);
      } catch (e) { /* opened directly — nothing to report to */ }
    }
  });
}
function animateScore(target, done) {
  function set(v) { var e = $('#resPct'); if (e) e.textContent = String(v); }
  if (reducedMotion() || target <= 0) { set(target); done(); return; }
  var v = 0, step = Math.max(1, Math.round(target / 24));
  var iv = setInterval(function () {
    v += step;
    if (v >= target) { v = target; clearInterval(iv); set(v); done(); } else set(v);
  }, 28);
}

/* ---------- answer summaries for the report ---------- */
function optTexts(opts, keys) { return opts.filter(function (o) { return keys.indexOf(o.k) >= 0; }).map(function (o) { return o.t; }).join(' · '); }
function ansSummary(ex, rec, which) {
  if (!rec || rec.status !== 'checked') return '—';
  var o;
  switch (ex.type) {
    case 'qcm':
      if (which === 'mine') { o = null; rec.rt.opts.forEach(function (x) { if (x.k === rec.ans.key) o = x; }); return o ? o.t : '—'; }
      o = null; rec.rt.opts.forEach(function (x) { if (x.k === 'o' + ex.ans) o = x; }); return o ? o.t : '—';
    case 'multi':
      if (which === 'mine') return optTexts(rec.rt.opts, rec.ans.keys);
      return optTexts(rec.rt.opts, rec.rt.opts.filter(function (x) { return x.ok; }).map(function (x) { return x.k; }));
    case 'log':
      if (ex.sub.kind === 'qcm') {
        if (which === 'mine') { o = null; rec.rt.subOpts.forEach(function (x) { if (x.k === rec.ans.sub) o = x; }); return o ? o.t : '—'; }
        o = null; rec.rt.subOpts.forEach(function (x) { if (x.k === 'o' + ex.sub.ans) o = x; }); return o ? o.t : '—';
      }
      if (which === 'mine') return optTexts(rec.rt.subOpts, rec.ans.sub || []);
      return optTexts(rec.rt.subOpts, rec.rt.subOpts.filter(function (x) { return x.ok; }).map(function (x) { return x.k; }));
    case 'set': {
      var arr = [];
      rec.rt.cards.forEach(function (c, i) {
        var okT = ex.cards[i].opts[ex.cards[i].ans];
        if (which === 'mine') {
          var sel = null; c.opts.forEach(function (x) { if (x.k === rec.ans.pick[i]) sel = x.t; });
          arr.push(c.title + ': ' + (sel || 'no answer') + ' (correct: ' + okT + ')');
        } else arr.push(c.title + ': ' + okT);
      });
      return arr.join(' · ');
    }
    case 'place': {
      var arr2 = [];
      rec.rt.items.forEach(function (it) {
        var s = slotOf(rec, it.id);
        if (which === 'mine') {
          if (it.slot < 0 && s < 0) return;
          arr2.push(it.t + ' → ' + (s >= 0 ? slotLab(ex, s) : 'left in the bank'));
        } else {
          if (it.slot < 0) return;
          arr2.push(it.t + ' → ' + slotLab(ex, it.slot));
        }
      });
      return arr2.join(' · ');
    }
    case 'spot':
      if (which === 'mine') return rec.ans.line == null ? '—' : 'Line ' + (rec.ans.line + 1);
      return 'Line ' + (ex.bad + 1);
    case 'term':
      return which === 'mine' ? (rec.ans.cmd || '—') : ex.okSample;
    case 'branch': {
      var steps = rec.ans.results.map(function (r, i) { return 'Step ' + (i + 1) + (r.ok ? ' ✓ ' : ' ✗ ') + r.t; });
      if (which === 'mine') return steps.join(' → ') || '—';
      return ex.chain.join(' → ');
    }
  }
  return '—';
}
function posOf(exIdx) { return S.order.indexOf(exIdx) + 1; }

/* ---------- results ---------- */
function renderResults(o) {
  var R = $('#scrResults'); R.innerHTML = '';
  var card = h('div', 'card rescard');
  var hero = h('div', 'hero ' + (o.passed ? 'pass' : 'fail'));
  hero.appendChild(h('div', 'heroshield', o.passed ? '✓' : '✗'));
  hero.appendChild(h('div', 'herotitle', o.passed ? 'PASSED' : 'NOT PASSED'));
  hero.appendChild(h('div', 'heroscore', '<b id="resPct">' + o.percent + '</b>% — final score'));
  hero.appendChild(h('div', 'herosub', esc((o.reason === 'time' ? 'Time ran out. ' : '') + 'You earned ' + fmtPts(o.earned) + ' of ' + o.total + ' points on the ' + o.checkedIdx.length + ' answered exercise' + (o.checkedIdx.length === 1 ? '' : 's') + ' · pass mark ' + CFG.passMark + '%')));
  card.appendChild(hero);
  var sg = h('div', 'statgrid');
  [['Checked (scored)', o.checkedIdx.length + ''], ['Skipped — excluded', o.skippedIdx.length + ''], ['Never checked — excluded', o.pendIdx.length + ''], ['Hints used', String(S.hintCount)]].forEach(function (f) {
    var d = h('div', 'fact'); d.appendChild(h('b', null, f[1])); d.appendChild(h('span', null, f[0])); sg.appendChild(d);
  });
  card.appendChild(sg);
  card.appendChild(h('p', 'icand', o.passed
    ? '<b>Certificate note:</b> you demonstrated command of deception technologies (' + esc(CFG.title) + ') at ' + CFG.label + ' level. The platform has stored your result.'
    : 'You must retake this exam to reach the ' + CFG.passMark + '% pass mark. The report below shows exactly what to study — amber rows are partially right, red rows are wrong.'));
  var rowc = h('div', 'mrow');
  var rb2 = nd('button', 'btn'); rb2.type = 'button'; rb2.textContent = 'Back to intro';
  rb2.addEventListener('click', function () { S.started = false; S.finished = false; $('#hud').hidden = true; show('scrIntro'); renderIntro(); });
  var rb = nd('button', 'btn primary'); rb.type = 'button'; rb.id = 'btnRetake'; rb.textContent = 'Retake exam ↺';
  rb.addEventListener('click', function () { startExam(); });
  rowc.appendChild(rb2); rowc.appendChild(rb);
  card.appendChild(rowc);
  R.appendChild(card);

  if (o.skippedIdx.length || o.pendIdx.length) {
    var c2 = h('div', 'card');
    c2.appendChild(h('h2', null, 'Excluded from scoring'));
    if (o.skippedIdx.length) {
      c2.appendChild(h('p', 'rline', '<b>Skipped</b> — counted in neither earned nor possible points:'));
      o.skippedIdx.forEach(function (i) { c2.appendChild(h('div', 'rline', '⚠ Question ' + posOf(i) + ' — ' + esc(EX[i].title))); });
    }
    if (o.pendIdx.length) {
      c2.appendChild(h('p', 'rline', '<b>Never checked</b> — not counted:'));
      o.pendIdx.forEach(function (i) { c2.appendChild(h('div', 'rline', '— Question ' + posOf(i) + ' — ' + esc(EX[i].title))); });
    }
    R.appendChild(c2);
  }

  var c3 = h('div', 'card');
  c3.appendChild(h('h2', null, 'Progress per theme'));
  THEMES.forEach(function (th) {
    var poss = 0, earn = 0;
    o.checkedIdx.forEach(function (i) { if (EX[i].theme === th.k) { poss += PTS; earn += S.recs[i].earned; } });
    var pct = poss ? Math.round(earn / poss * 100) : 0;
    var tb = h('div', 'themebar');
    tb.appendChild(h('div', 'tb-row', '<span>' + esc(th.t) + '</span><span>' + (poss ? fmtPts(earn) + ' / ' + poss + ' pts · ' + pct + '%' : 'none answered') + '</span>'));
    tb.appendChild(h('div', 'tb-track', '<div class="tb-fill" style="width:' + pct + '%"></div>'));
    c3.appendChild(tb);
  });
  R.appendChild(c3);

  var c4 = h('div', 'card');
  c4.appendChild(h('h2', null, 'Full report — every exercise'));
  S.order.forEach(function (exIdx, pos) {
    var ex = EX[exIdx], rec = S.recs[exIdx];
    var rr = h('div', 'rrow');
    var lab, cls, ico = '';
    if (rec.status === 'checked') {
      var e = rec.earned;
      lab = e >= PTS - 1e-9 ? 'FULL' : (e > 1e-9 ? 'PARTIAL' : 'ZERO');
      cls = lab.toLowerCase();
      ico = lab === 'FULL' ? '✓ ' : lab === 'PARTIAL' ? '◐ ' : '✗ ';
    } else if (rec.status === 'skipped') { lab = 'SKIPPED — NOT COUNTED'; cls = 'skipped'; ico = '⚠ '; }
    else { lab = 'NOT COUNTED (never checked)'; cls = 'notcounted'; }
    var rh = h('div', 'rhead');
    rh.appendChild(h('span', 'rtitle', 'Q' + (pos + 1) + ' — ' + esc(ex.title)));
    rh.appendChild(h('span', 'rlab ' + cls, ico + lab));
    rr.appendChild(rh);
    rr.appendChild(h('div', 'rline', '<b>Your answer:</b> ' + esc(ansSummary(ex, rec, 'mine'))));
    rr.appendChild(h('div', 'rline', '<b>Correct:</b> ' + esc(ansSummary(ex, rec, 'corr'))));
    if (rec.status === 'checked') rr.appendChild(h('div', 'rline', '<b>Earned:</b> ' + fmtPts(rec.earned) + ' / ' + PTS + (rec.hints ? ' (hint −10%)' : '')));
    if (rec.status === 'skipped') rr.appendChild(h('div', 'rline', 'You skipped this exercise, so it did not count — but the lesson still does: read the explanation.'));
    rr.appendChild(h('div', 'rexpl', ex.explain));
    c4.appendChild(rr);
  });
  R.appendChild(c4);
}

/* ---------- boot ---------- */
function boot() {
  EX.forEach(function (ex) {
    if (ex.type === 'branch') {
      var chain = [], node = ex.nodes[ex.start], guard = 0;
      while (node && guard++ < 14) {
        var ok = null;
        node.choices.forEach(function (c) { if (c.ok && !ok) ok = c; });
        if (!ok) break;
        chain.push(ok.t);
        node = ok.next ? ex.nodes[ok.next] : null;
      }
      ex.chain = chain;
    }
    if (ex.type === 'term' && ex.ok) { ex.ok = ex.ok.map(function (s) { return new RegExp(s, 'i'); }); }
  });
  $('#btnCheck').addEventListener('click', checkEx);
  $('#btnHint').addEventListener('click', function () {
    var exIdx = S.order[S.pos], rec = S.recs[exIdx];
    if (rec.hints || rec.status === 'checked') return;
    showHint(EX[exIdx], rec, true);
  });
  $('#btnRevise').addEventListener('click', function () {
    var exIdx = S.order[S.pos], ex = EX[exIdx], rec = S.recs[exIdx];
    rec.status = 'pending'; rec.earned = 0; rec.grade = null;
    if (ex.type === 'branch') { rec.ans = initAns(ex); }
    updateHud(); renderEx();
    live('Revising — change your answer, then press Check again.');
  });
  $('#btnSkip').addEventListener('click', function () {
    var rec = S.recs[S.order[S.pos]];
    if (rec.status === 'checked') return;
    rec.status = 'skipped'; rec.cpause = false;
    live('Exercise skipped. You can come back to it before you submit.');
    advance();
  });
  $('#btnNext').addEventListener('click', advance);
  $('#btnPrev').addEventListener('click', function () { gotoPos(S.pos - 1); });
  $('#btnPause').addEventListener('click', togglePause);
  $('#btnResume').addEventListener('click', togglePause);
  $('#btnSubmit').addEventListener('click', openSubmit);
  $('#btnKw').addEventListener('click', function () {
    modal('<h3>Keywords covered</h3>', []);
    var m = $('#mbox');
    m.appendChild(keywordsPanel());
    var row = h('div', 'mrow');
    var cl = nd('button', 'btn primary'); cl.type = 'button'; cl.textContent = 'Close';
    cl.addEventListener('click', closeModal);
    row.appendChild(cl); m.appendChild(row);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });
  renderIntro();
  show('scrIntro');
}

window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT') {
    if (d.username) {
      S.user = String(d.username).slice(0, 40);
      var el = $('.icand');
      if (el && !S.started) el.innerHTML = 'Candidate: <b>' + esc(S.user) + '</b>';
    }
  }
});

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

</script>
</body>
</html>
