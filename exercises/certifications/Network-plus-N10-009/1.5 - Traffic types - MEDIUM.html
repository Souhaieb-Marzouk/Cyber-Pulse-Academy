function dndRender(ex, i, area) {
  var ans = ex.answer;
  var items = ans.items.map(function (it, ii) { return { t: it.t, ii: ii }; });
  var dperm = perm(ex, 'dperm', items.map(function (_, k) { return k; }));
  var html = '<div class="chipbank" data-bank="1" aria-label="Item bank"></div><div class="slots">';
  ans.slots.forEach(function (sl, si) {
    html += '<div class="slot" data-slot="' + si + '" role="button" tabindex="0" aria-label="Slot: ' + esc(sl.name) + '"><h4>' + esc(sl.name) + '</h4><div class="dropzone" data-dz="' + si + '"></div></div>';
  });
  html += '</div>';
  area.innerHTML = html;
  var bank = area.querySelector('[data-bank]');
  function chipHtml(ii) {
    var it = ans.items[ii];
    return '<button type="button" class="chip" draggable="true" data-chip="' + ii + '" aria-pressed="false">' + esc(it.t) + '</button>';
  }
  function placeOf(ii) { return S.cur[i].placed[String(ii)]; }
  function redraw() {
    bank.innerHTML = '';
    dperm.forEach(function (ii) { if (placeOf(ii) === undefined || placeOf(ii) === null) bank.insertAdjacentHTML('beforeend', chipHtml(ii)); });
    area.querySelectorAll('[data-dz]').forEach(function (dz) { dz.innerHTML = ''; });
    dperm.forEach(function (ii) {
      var p = placeOf(ii);
      if (p !== undefined && p !== null) {
        var dz = area.querySelector('[data-dz="' + p + '"]');
        if (dz) dz.insertAdjacentHTML('beforeend', chipHtml(ii));
      }
    });
    bindChips();
  }
  var selected = null;
  function bindChips() {
    area.querySelectorAll('.chip').forEach(function (chip) {
      var ii = Number(chip.getAttribute('data-chip'));
      chip.setAttribute('aria-pressed', selected === ii ? 'true' : 'false');
      chip.classList.toggle('selected', selected === ii);
      chip.addEventListener('click', function (ev) {
        ev.stopPropagation();
        selected = (selected === ii) ? null : ii;
        S.touched[i] = true;
        area.querySelectorAll('.chip').forEach(function (c) {
          var cj = Number(c.getAttribute('data-chip'));
          c.classList.toggle('selected', selected === cj);
          c.setAttribute('aria-pressed', selected === cj ? 'true' : 'false');
        });
      });
      chip.addEventListener('pointerdown', function (ev) {
        if (ev.button !== undefined && ev.button !== 0) return;
        var ghost = chip.cloneNode(true); ghost.classList.add('dragging');
        ghost.style.width = chip.offsetWidth + 'px';
        document.body.appendChild(ghost);
        function mv(e) { ghost.style.left = (e.clientX + 8) + 'px'; ghost.style.top = (e.clientY + 6) + 'px'; }
        mv(ev);
        function up(e) {
          document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up);
          ghost.remove();
          var tgt = document.elementFromPoint(e.clientX, e.clientY);
          var slot = tgt ? tgt.closest('.slot') : null;
          if (slot) { dropInto(ii, Number(slot.getAttribute('data-slot'))); }
        }
        document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up);
      });
    });
  }
  function dropInto(ii, si) {
    S.cur[i].placed[String(ii)] = si; S.touched[i] = true; selected = null; redraw();
  }
  area.querySelectorAll('.slot').forEach(function (slot) {
    var si = Number(slot.getAttribute('data-slot'));
    slot.addEventListener('click', function () { if (selected !== null) dropInto(selected, si); });
    slot.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (selected !== null) dropInto(selected, si); } });
  });
  bank.addEventListener('click', function () { if (selected !== null) { S.cur[i].placed[String(selected)] = null; selected = null; redraw(); } });
  redraw();
  PAINT = function (res) {
    var marks = {}; res.els.forEach(function (e) { marks[e.key] = e.ok; });
    area.querySelectorAll('.chip').forEach(function (chip) {
      var ii = Number(chip.getAttribute('data-chip'));
      chip.classList.remove('ok', 'bad');
      chip.classList.add(marks['i' + ii] ? 'ok' : 'bad');
    });
    area.querySelectorAll('.slot').forEach(function (sl) {
      var si = Number(sl.getAttribute('data-slot'));
      var mine = ans.items.filter(function (it) { return it.slot === si; }).map(function (it, _, arr) { return it; });
      var allOk = mine.every(function (it) { return marks['i' + ans.items.indexOf(it)]; });
      sl.classList.remove('ok', 'bad');
      if (mine.length) sl.classList.add(allOk ? 'ok' : 'bad');
    });
  };
}

function ordRender(ex, i, area) {
  var ans = ex.answer, isRank = ex.type === 'rank';
  var seq = ensureSeq(ex, i);
  function paintArea() {
    var html = '';
    seq.forEach(function (ii, pos) {
      html += '<div class="ordrow" data-pos="' + pos + '"><span class="pos">' + (pos + 1) + '</span><span class="otext">' + esc(ans.items[ii].t) + '</span>' +
        '<span class="mv"><button type="button" data-up="' + pos + '" aria-label="Move item ' + (pos + 1) + ' up">&#9650;</button>' +
        '<button type="button" data-down="' + pos + '" aria-label="Move item ' + (pos + 1) + ' down">&#9660;</button></span></div>';
    });
    area.innerHTML = '<p style="font-size:13.5px;color:var(--mut)">' + esc(isRank ? 'Drag or use the arrows to rank. 1 = act first.' : 'Drag or use the arrows to put the steps in order.') + '</p>' + html;
    area.querySelectorAll('[data-up]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = Number(b.getAttribute('data-up'));
        if (p > 0) { var t = seq[p - 1]; seq[p - 1] = seq[p]; seq[p] = t; S.touched[i] = true; paintArea(); }
      });
    });
    area.querySelectorAll('[data-down]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = Number(b.getAttribute('data-down'));
        if (p < seq.length - 1) { var t = seq[p + 1]; seq[p + 1] = seq[p]; seq[p] = t; S.touched[i] = true; paintArea(); }
      });
    });
    var rows = area.querySelectorAll('.ordrow');
    rows.forEach(function (row) {
      row.addEventListener('pointerdown', function (ev) {
        if (ev.target.closest('button')) return;
        var p1 = Number(row.getAttribute('data-pos'));
        function over(e) {
          var tgt = document.elementFromPoint(e.clientX, e.clientY);
          var other = tgt ? tgt.closest('.ordrow') : null;
          if (other && other !== row) {
            var p2 = Number(other.getAttribute('data-pos'));
            var t = seq[p2]; seq[p2] = seq[p1]; seq[p1] = t;
            S.touched[i] = true; paintArea();
            p1 = p2;
          }
        }
        function up() { document.removeEventListener('pointermove', over); document.removeEventListener('pointerup', up); }
        document.addEventListener('pointermove', over); document.addEventListener('pointerup', up);
      });
    });
  }
  paintArea();
  PAINT = function (res) {
    var marks = {}; res.els.forEach(function (e) { marks[e.key] = e.ok; });
    area.querySelectorAll('.ordrow').forEach(function (row) {
      var pos = Number(row.getAttribute('data-pos'));
      row.classList.remove('ok', 'bad');
      row.classList.add(marks['p' + pos] ? 'ok' : 'bad');
    });
  };
}

/* ---------- screens ---------- */
function renderIntro() {
  $('qnav').hidden = true;
  var stage = $('stage');
  var sevName = META.difficulty === 'hard' ? 'HARD' : 'MEDIUM';
  var h = '<div class="intro-hero"><h1>' + esc(META.title) + '</h1>' +
    '<p class="sub">CompTIA Network+ (N10-009) · Objective 1.5 — Traffic types' + (S.username ? ' · <span class="greet">Good luck, ' + esc(S.username) + '!</span>' : '') + '</p>' +
    '<div class="metaGrid">' +
    '<span class="pill">&#127919; Passing score: ' + PASS + '%</span>' +
    '<span class="pill">&#128218; ' + N + ' exercises</span>' +
    '<span class="pill">&#9201; ' + META.estimatedMinutes + ' minutes total</span>' +
    '<span class="pill">&#9878; Severity: ' + sevName + '</span>' +
    '<span class="pill">&#127942; ' + MAXPTS + ' points</span></div>' +
    '<p>This exam is one self-contained exercise set on the four traffic types: <strong>unicast, multicast, anycast, broadcast</strong>. ' +
    'Exercise types include scenario QCM, multi-select, drag-and-drop and matching boards, timeline ordering and ranking, fill-in-the-blank policy and config text, an interactive terminal, alert triage, branching decisions, spot-the-mistake configs, a dual blue/red-team perspective, and a filterable log viewer. ' +
    'Every exercise mirrors real work: SOC alerts, switch logs, captures, configs, tickets and terminals. ' + (sevName === 'MEDIUM' ?
      'This is the MEDIUM set: real reasoning with realistic data, guided where a beginner would need it.' :
      'This is the HARD set: subtle distractors, near-miss answers, and cases where the obvious answer is wrong.') + '</p></div>' +
    '<div class="instr"><h3>How this exam works</h3><ul>' +
    '<li><strong>Check</strong> validates your answer, shows what was right and wrong, and shows the explanation. It also pauses the timer in <em>review mode</em> — the exercise stays visible so you can learn. Only pressing <strong>Next</strong> restarts the clock.</li>' +
    '<li><strong>Manual Pause</strong> (top right) freezes the timer too, but it hides the exercise until you press Resume. The two pauses stack.</li>' +
    '<li><strong>Skip</strong> jumps to the next exercise and marks it amber. You can come back to skipped exercises while time remains. Skipped exercises are <em>excluded from scoring entirely</em> — they count for nothing, in both directions.</li>' +
    '<li><strong>Multi-answer exercises give partial credit</strong>: each correct element earns its share of the points. Wrong picks earn nothing but do not subtract.</li>' +
    '<li><strong>Hint</strong> costs 10% of that exercise\'s points and reveals a nudge, never the answer.</li>' +
    '<li><strong>Revise</strong> unlocks a checked answer so you can change it; a new Check re-grades it (and re-applies the review-mode pause).</li>' +
    '<li>The timer runs for the whole set. When it hits zero, the exam submits itself.</li></ul></div>' +
    '<div class="kwpanel"><h3>KEYWORDS COVERED — grouped by theme</h3>';
  THEMES.forEach(function (t) {
    h += '<div class="theme"><b>' + esc(t.name) + ':</b> <span class="items">' + esc(t.items.join(' · ')) + '</span></div>';
  });
  h += '</div><div class="actionrow"><span class="grow"></span><button id="startBtn" class="btn primary" type="button">Start exam &#9654;</button></div>';
  stage.innerHTML = h;
  $('startBtn').onclick = startExam;
  updateProgress();
}
function startExam() {
  S.started = true;
  $('qnav').hidden = false;
  if (!timerId) {
    timerId = setInterval(function () {
      if (!S.started || S.finished) return;
      if (S.manual || S.checkp) return;
      S.tLeft--;
      if (S.tLeft <= 0) { S.tLeft = 0; syncHUD(); finishExam(true); return; }
      syncHUD();
    }, 1000);
  }
  renderQ(0); syncNav(); syncHUD(); syncScore();
}

function updateProgress() {
  var pct = S.finished ? 100 : Math.round(((S.idx + 1) / N) * 100);
  $('progressBar').style.width = pct + '%';
  $('progressLabel').textContent = S.started ? ('Question ' + (S.idx + 1) + ' of ' + N + (S.finished ? ' — finished' : '')) : (N + ' questions ready');
}
function updateChips() {
  var box = $('chips'); if (!box) return;
  var h = '';
  for (var i = 0; i < N; i++) {
    var cls = '', ic = '·', lbl = 'unanswered';
    if (S.checked[i]) {
      var r = S.earn[i] / (EXS[S.seq[i]].points || 1);
      if (r >= 0.999) { cls = 'full'; ic = '✓'; lbl = 'correct'; }
      else if (r > 0.001) { cls = 'part'; ic = '◐'; lbl = 'partial'; }
      else { cls = 'zero'; ic = '✗'; lbl = 'wrong'; }
    } else if (S.skipped[i]) { cls = 'skipped'; ic = '↷'; lbl = 'skipped'; }
    h += '<button type="button" data-go="' + i + '" class="' + cls + (i === S.idx ? ' current' : '') + '" title="Question ' + (i + 1) + ' — ' + lbl + '" aria-label="Question ' + (i + 1) + ' — ' + lbl + '">' + (i + 1) + '<span class="ic" aria-hidden="true">' + ic + '</span></button>';
  }
  box.innerHTML = h;
  box.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { go(Number(b.getAttribute('data-go'))); });
  });
}
function syncNav() {
  $('prevBtn').disabled = S.idx === 0;
  var nb = $('nextBtn');
  if (S.idx === N - 1) { nb.textContent = 'Finish & Submit ⏹'; nb.classList.add('warn'); }
  else { nb.innerHTML = 'Next &#8250;'; nb.classList.remove('warn'); }
}
function syncHUD() {
  var m = Math.floor(S.tLeft / 60), s = S.tLeft % 60;
  var tp = $('timerPill');
  tp.textContent = '⏱ ' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  tp.className = 'pill mono' + (S.tLeft <= 300 ? ' crit' : (S.tLeft <= TOTAL * 0.2 ? ' low' : ''));
  tp.id = 'timerPill';
}
function syncPauseUI() {
  var ps = $('pauseState'), msgs = [];
  if (S.manual) msgs.push('Paused (manual)');
  if (S.checkp) msgs.push('Timer paused — review mode');
  ps.hidden = msgs.length === 0;
  ps.textContent = msgs.join(' + ');
  var ov = $('pauseOverlay');
  var stage = $('stage');
  if (S.manual && S.started && !S.finished) {
    if (!ov) {
      ov = document.createElement('div'); ov.id = 'pauseOverlay';
      ov.innerHTML = '<div class="box"><h3>⏸ Paused (manual)</h3><p>The exercise is hidden while the clock is frozen. Press Resume to continue.</p>' +
        '<button id="overlayResumeBtn" class="btn primary" type="button">Resume ▶</button></div>';
      $('app').appendChild(ov);
      /* the overlay covers the topbar, so it must carry its own Resume control */
      ov.querySelector('#overlayResumeBtn').addEventListener('click', function () {
        S.manual = false;
        syncPauseUI();
        try { $('pauseBtn').focus(); } catch (e) { }
      });
    }
    ov.style.display = 'flex';
    stage.style.filter = 'blur(8px)';
    try { stage.inert = true; } catch (e) { }
    $('pauseBtn').textContent = 'Resume';
    $('pauseBtn').setAttribute('aria-pressed', 'true');
    try { ov.querySelector('#overlayResumeBtn').focus(); } catch (e) { }
  } else {
    if (ov) ov.style.display = 'none';
    stage.style.filter = '';
    try { stage.inert = false; } catch (e) { }
    $('pauseBtn').textContent = 'Pause';
    $('pauseBtn').setAttribute('aria-pressed', 'false');
  }
}

/* ---------- finish & results ---------- */
function isTouched(i) { return S.touched[i] || S.checked[i] || (S.cur[i] && S.cur[i].sel && S.cur[i].sel.length && S.cur[i].sel.length !== undefined); }
function anyAnswer(i) {
  if (S.checked[i]) return true;
  var c = S.cur[i];
  switch (EXS[S.seq[i]].type) {
    case 'qcm': return c.sel !== null;
    case 'multi': return c.sel.length > 0;
    case 'dnd': case 'match': return Object.keys(c.placed).some(function (k) { return c.placed[k] !== null; });
    case 'order': case 'rank': return !!S.touched[i];
    case 'fib': return c.vals.some(function (v) { return v !== ''; });
    case 'terminal': return c.cmds.some(function (v) { return v !== ''; });
    case 'triage': return c.sel.some(function (v) { return v !== null; });
    case 'branch': return c.sel.some(function (v) { return v !== null; });
    case 'spotbug': return c.sel.length > 0;
    case 'dual': return c.sel.some(function (v) { return v !== null; });
    case 'logview': return EXS[S.seq[i]].answer.kind === 'dualsel' ? c.vals[0] !== null || c.vals[1] !== null : c.sel !== null;
  }
  return false;
}
function finishExam(auto) {
  if (S.finished) return;
  var answered = 0, i;
  for (i = 0; i < N; i++) { if (S.checked[i] || (!S.skipped[i] && anyAnswer(i))) answered++; }
  if (answered === 0 && !auto) {
    var z = $('fbZone'); if (z) z.innerHTML = '<div class="skipnote">⚠ You cannot submit: every exercise is still skipped or empty. Answer at least one exercise first.</div>';
    return;
  }
  for (i = 0; i < N; i++) {
    if (!S.checked[i] && !S.skipped[i] && anyAnswer(i)) {
      var ex = EXS[S.seq[i]];
      var r = grade(ex, S.cur[i]);
      if (S.hint[i]) r.earned = Math.round(r.earned * 0.9 * 100) / 100;
      S.earn[i] = r.earned; S.res[i] = r; S.checked[i] = true;
    }
  }
  S.finished = true;
  renderResults(auto);
}
function renderResults(auto) {
  var stage = $('stage');
  $('qnav').hidden = true;
  var total = 0, earned = 0, skippedList = [];
  var rows = [];
  for (var i = 0; i < N; i++) {
    var ex = EXS[S.seq[i]];
    if (S.checked[i]) { total++; earned += S.earn[i]; }
    else { skippedList.push(i); }
  }
  var score = Math.round(earned);
  var percent = total > 0 ? Math.round((score / total) * 100) : 0;
  var passed = percent >= PASS;
  var h = auto ? '<div class="skipnote">⏱ Time is up — the exam submitted itself. Unfinished exercises were excluded from scoring.</div>' : '';
  h += '<div class="verdict ' + (passed ? 'pass' : 'fail') + '"><div class="vlabel">' + (passed ? '★ PASS — CERTIFICATE THRESHOLD REACHED ★' : '✗ FAIL — BELOW THE ' + PASS + '% THRESHOLD') + '</div>' +
    '<div class="big" id="bigPct">' + percent + '%</div>' +
    '<div class="note" id="scoreLine">Final score: ' + score + ' of ' + total + ' points over ' + total + ' scored exercise(s). ' + (passed ? 'Well done — you showed real command of 1.5 traffic types.' : 'You must retake this exam to reach the ' + PASS + '% pass mark.') + '</div></div>';
  if (skippedList.length) {
    h += '<div class="skipnote">↷ <strong>' + skippedList.length + ' exercise(s) were skipped or left empty and were excluded from scoring</strong> — they added nothing to your total and nothing to the maximum: ' +
      skippedList.map(function (i) { return 'Q' + (i + 1); }).join(', ') + '.</div>';
  }
  h += '<h3 style="margin:18px 0 4px">Detailed report — every exercise explained</h3>';
  for (i = 0; i < N; i++) {
    var ex2 = EXS[S.seq[i]];
    var isSk = !S.checked[i];
    var lab, labCls;
    if (isSk) { lab = '↷ SKIPPED — NOT SCORED'; labCls = 'skipped'; }
    else {
      var rr = S.earn[i] / (ex2.points || 1);
      if (rr >= 0.999) { lab = '✓ FULL'; labCls = 'full'; }
      else if (rr > 0.001) { lab = '◐ PARTIAL'; labCls = 'partial'; }
      else { lab = '✗ ZERO'; labCls = 'zero'; }
    }
    h += '<div class="report"><div class="rhead"><span class="qno">Q' + (i + 1) + ' — ' + esc(ex2.title) + '</span>' +
      '<span class="rlabel ' + labCls + '">' + lab + '</span></div><div class="rbody">' +
      (isSk ? '<div class="kv"><b>Status:</b> skipped — excluded from scoring (no points earned, no points possible).</div>' :
        '<div class="kv"><b>Points:</b> ' + fmt1(S.earn[i]) + ' / ' + (ex2.points || 1) + (S.hint[i] ? ' (hint −10% applied)' : '') + '</div>' +
        '<div class="kv"><b>Your answer:</b> ' + esc(serAns(ex2, S.cur[i])) + '</div>' +
        '<div class="kv"><b>Correct answer:</b> ' + esc(serCorr(ex2)) + '</div>') +
      '<div class="rexplain">' + paras(ex2.explain) + '</div></div></div>';
  }
  h += '<div class="actionrow"><span class="grow"></span><button id="retakeBtn" class="btn primary" type="button">Retake exam</button></div>';
  stage.innerHTML = h;
  $('retakeBtn').onclick = retake;
  window.scrollTo(0, 0);
  updateProgress();
  /* report to the site exactly once per attempt, after the animation settles */
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
  if (reduced) { reportScore(score, total); }
  else {
    var shown = 0, step = Math.max(1, Math.ceil(percent / 24));
    var iv = setInterval(function () {
      shown = Math.min(percent, shown + step);
      var el = document.getElementById('bigPct');
      if (el) el.textContent = shown + '%';
      if (shown >= percent) { clearInterval(iv); reportScore(score, total); }
    }, 34);
    setTimeout(function () { if (!S.reported) { clearInterval(iv); reportScore(score, total); } }, 2200);
  }
}
function reportScore(correct, total) {
  if (S.reported) return;
  S.reported = true;
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function retake() {
  S = freshState();
  S.started = true;
  syncHUD(); syncScore();
  $('qnav').hidden = false;
  renderQ(0); syncNav();
}

/* ---------- chrome events ---------- */
$('pauseBtn').addEventListener('click', function () {
  if (!S.started || S.finished) return;
  S.manual = !S.manual;
  syncPauseUI();
});
$('prevBtn').addEventListener('click', function () { if (S.idx > 0) go(S.idx - 1); });
$('nextBtn').addEventListener('click', function () {
  S.checkp = false; /* only Next ends the Check-pause */
  if (S.idx < N - 1) go(S.idx + 1);
  else finishExam(false);
  syncPauseUI();
});
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  if (event.data.username) {
    S.username = String(event.data.username).slice(0, 40);
    var sub = document.querySelector('.intro-hero .sub');
    if (sub && !sub.querySelector('.greet')) {
      sub.innerHTML += ' · <span class="greet">Good luck, ' + esc(S.username) + '!</span>';
    }
  }
});

renderIntro();
syncHUD();

</script>
</body>
