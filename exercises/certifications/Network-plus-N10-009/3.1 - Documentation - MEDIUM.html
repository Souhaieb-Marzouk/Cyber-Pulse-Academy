<style>
:root{
  --bg:#0b1020; --panel:#141b30; --panel2:#0f1526; --ink:#e9eefb; --mut:#a6b4d4;
  --line:#2a3554; --cy:#5cc8ff; --gn:#4ad695; --rd:#ff8080; --am:#ffc65c;
  --cyd:#12395a; --gnd:#0e3b28; --rdd:#421d24; --amd:#3d2f10; --btn:#1c2848; --btnb:#3a4c7d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
code,.mono,kbd{font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
#app{max-width:1020px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
a{color:var(--cy)}
p{margin:8px 0}
.mut{color:var(--mut)}
.small{font-size:14px}
.hid{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.panel2{background:var(--panel2)}
/* header chrome */
.top{top:0;z-index:40;background:linear-gradient(180deg,#0d1326 0%,#0b1020ee 100%);border-bottom:1px solid var(--line);padding:10px 2px 8px;margin:0 -16px 12px;padding-left:16px;padding-right:16px}
.toprow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.badge{display:inline-block;border:1px solid var(--btnb);border-radius:999px;padding:2px 10px;font-size:14px;color:var(--mut)}
.badge.med{border-color:var(--am);color:var(--am)}
.badge.hard{border-color:var(--rd);color:var(--rd)}
.timer{font-size:20px;font-weight:700;letter-spacing:1px;padding:2px 12px;border:1px solid var(--btnb);border-radius:8px;background:var(--panel2)}
.timer.warn{color:var(--am);border-color:var(--am)}
.timer.crit{color:var(--rd);border-color:var(--rd)}
.score{font-size:16px;font-weight:600}
.score b{color:var(--gn)}
.pbar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1d6fa8,var(--cy));transition:width .5s}
.meta-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{font-size:14px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--panel2)}
.chip b{color:var(--ink)}
/* navigator */
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin:10px 0}
.nav button{min-width:40px;min-height:40px;border-radius:8px;border:1px solid var(--btnb);background:var(--btn);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;padding:2px}
.nav button.cur{outline:2px solid var(--cy);outline-offset:1px}
.nav button.ok{background:var(--gnd);border-color:var(--gn);color:var(--gn)}
.nav button.part{background:var(--amd);border-color:var(--am);color:var(--am)}
.nav button.zero{background:var(--rdd);border-color:var(--rd);color:var(--rd)}
.nav button.skip{background:var(--amd);border-color:var(--am);color:var(--am)}
.nav button .g{font-size:12px;display:block;line-height:1}
/* pause indicators */
.pind{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0;min-height:0}
.pind span{font-size:14px;font-weight:700;border-radius:8px;padding:3px 10px;border:1px solid}
.pind .rev{color:var(--cy);border-color:var(--cy);background:var(--cyd)}
.pind .man{color:var(--am);border-color:var(--am);background:var(--amd)}
/* blocks */
.blk{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.blk .lbl{display:block;font-size:14px;font-weight:800;letter-spacing:1.2px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel2);color:var(--cy)}
.blk .bd{padding:12px 14px;background:var(--panel)}
.blk.q .lbl{color:var(--am)}
.blk.q .bd{background:#181d33}
.blk.ans .lbl{color:var(--gn)}
.pausedwrap{position:relative}
.pausedwrap .shade{position:absolute;inset:0;background:rgba(7,10,20,.82);backdrop-filter:blur(3px);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:30;text-align:center;padding:20px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:8px 18px;border-radius:9px;border:1px solid var(--btnb);background:var(--btn);color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--cy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:#14639e;border-color:#2f86c4}
.btn.pri:hover{background:#1771b4}
.btn.warn{background:#6b4c0e;border-color:var(--am);color:var(--ffd);color:#ffd58a}
.btn.ghost{background:transparent}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.hintbox{border:1px dashed var(--am);background:var(--amd);border-radius:8px;padding:8px 12px;margin:10px 0;color:#ffd58a}
.hintbox .t{font-weight:800;font-size:14px;letter-spacing:1px}
/* choices */
.choices{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.choice{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px;cursor:pointer}
.choice input{margin-top:3px;transform:scale(1.25);accent-color:var(--cy)}
.choice.sel{border-color:var(--cy);background:var(--cyd)}
.choice.okm{border-color:var(--gn);background:var(--gnd)}
.choice.badm{border-color:var(--rd);background:var(--rdd)}
.choice.miss{border-color:var(--am);background:var(--amd)}
.choice .mark{margin-left:auto;font-weight:800;white-space:nowrap}
.cOK{color:var(--gn)}.cBAD{color:var(--rd)}.cMISS{color:var(--am)}
/* mono line lists (spot) */
.mlines{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.mline{display:flex;gap:10px;align-items:center;text-align:left;background:#0a0f1d;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px;color:#cfe3ff;cursor:pointer;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;word-break:break-word}
.mline:hover{border-color:var(--cy)}
.mline.sel{border-color:var(--cy);background:var(--cyd)}
.mline.okm{border-color:var(--gn);background:var(--gnd)}
.mline.badm{border-color:var(--rd);background:var(--rdd)}
.mline .mark{margin-left:auto;font-weight:800;white-space:nowrap}
/* drag chips / banks / zones */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:46px}
.bchip{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:9px;border:1px solid var(--btnb);background:var(--btn);cursor:grab;font-size:15px}
.bchip.sel{outline:2px solid var(--cy);border-color:var(--cy)}
.bchip.used{opacity:.35;cursor:default}
.zone{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px;margin:8px 0;min-height:56px}
.zone h4{margin:0 0 6px;font-size:15px;color:var(--cy)}
.zone.dz{border-style:dashed}
.zone.okm{border-color:var(--gn)}
.zone.badm{border-color:var(--rd)}
.zone .bchip{margin:2px 4px 2px 0}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slotlist{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:8px;min-height:48px;border:1px dashed var(--btnb);border-radius:9px;background:#0a0f1d;padding:6px 10px}
.slot .k{font-weight:700;color:var(--cy)}
.slot .fill{flex:1;font-size:15px}
.slot.okm{border-color:var(--gn)}
.slot.badm{border-color:var(--rd)}
.slot.miss{border-color:var(--am)}
/* order list */
.olist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.oitem{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:48px}
.oitem .n{width:30px;height:30px;border-radius:6px;background:var(--btnb);display:flex;align-items:center;justify-content:center;font-weight:800}
.oitem .t{flex:1}
.oitem .mv{display:flex;gap:4px}
.oitem .mv button{min-width:38px;min-height:38px;border-radius:7px;border:1px solid var(--btnb);background:var(--btn);color:var(--ink);cursor:pointer;font-size:15px}
.oitem.okm{border-color:var(--gn)}
.oitem.badm{border-color:var(--rd)}
/* fill */
.filltext{font-size:16px;line-height:2}
.filltext input{background:#0a0f1d;border:1px solid var(--btnb);border-radius:7px;color:var(--ink);padding:6px 8px;min-width:130px;min-height:38px;font-size:15px;margin:0 4px}
.filltext input.okm{border-color:var(--gn);background:var(--gnd)}
.filltext input.badm{border-color:var(--rd);background:var(--rdd)}
/* queue */
.qtable{width:100%;border-collapse:collapse;margin:6px 0}
.qtable th{font-size:14px;text-align:left;color:var(--mut);border-bottom:1px solid var(--line);padding:6px 8px}
.qtable td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
.qtable select{min-height:44px;min-width:190px;background:#0a0f1d;color:var(--ink);border:1px solid var(--btnb);border-radius:8px;font-size:15px;padding:6px 8px;max-width:100%}
.qtable select.okm{border-color:var(--gn)}
.qtable select.badm{border-color:var(--rd)}
.qtable tr.okm td:first-child{border-left:3px solid var(--gn)}
.qtable tr.badm td:first-child{border-left:3px solid var(--rd)}
/* log viewer */
.logv{background:#070b16;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0}
.logv .lvh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--panel2);border-bottom:1px solid var(--line);padding:8px 10px}
.logv .lvh .t{font-weight:800;font-size:14px;color:var(--cy)}
.logv .lvh input{flex:1;min-width:180px;min-height:38px;background:#0a0f1d;border:1px solid var(--btnb);border-radius:7px;color:var(--ink);padding:6px 10px;font:14px ui-monospace,Menlo,Consolas,monospace}
.logv .lvh .cnt{font-size:14px;color:var(--mut);white-space:nowrap}
.logv .lbody{max-height:300px;overflow:auto;padding:8px 10px}
.logv .ln{white-space:pre-wrap;word-break:break-word;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;color:#c9d7f2;padding:1px 0}
.logv .ln .ip{color:var(--cy)}
.logv .ln .mac{color:#c79bff}
.logv .ln .lv-WARN,.logv .ln .lv-WARNING{color:var(--am);font-weight:700}
.logv .ln .lv-ERROR,.logv .ln .lv-CRIT,.logv .ln .lv-FAILED{color:var(--rd);font-weight:700}
.logv .ln .lv-OK,.logv .ln .lv-ACK,.logv .ln .lv-UP{color:var(--gn)}
.logv .ln .port{color:#8ff0ff}
.logv .ln .num{color:#ffd58a}
/* terminal */
.term{background:#05080f;border:1px solid #233;border-radius:10px;overflow:hidden;margin:10px 0}
.term .th{background:var(--panel2);border-bottom:1px solid var(--line);padding:6px 10px;font-size:14px;color:var(--mut)}
.term .tbody{padding:10px 12px;max-height:340px;overflow:auto}
.term .to{white-space:pre-wrap;word-break:break-word;font:14px/1.6 ui-monospace,Menlo,monospace;color:#9fe0b7;margin:0 0 4px}
.term .tcmd{font:14px/1.6 ui-monospace,Menlo,monospace;color:#7fd0ff}
.term .tp{display:flex;gap:8px;align-items:center;margin:8px 0 2px}
.term .tp .ps{font:14px ui-monospace,Menlo,monospace;color:var(--gn);white-space:nowrap}
.term .tp input{flex:1;min-height:40px;background:#0a101c;border:1px solid var(--btnb);border-radius:7px;color:#dff3ff;padding:6px 10px;font:14px ui-monospace,Menlo,Consolas,monospace}
.term .tp input.okm{border-color:var(--gn)}
.term .tp input.badm{border-color:var(--rd)}
/* tables in scenario */
table.dt{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
table.dt th{background:var(--panel2);color:var(--mut);text-align:left;padding:6px 9px;border:1px solid var(--line);font-size:14px}
table.dt td{border:1px solid var(--line);padding:6px 9px}
table.dt tr td:first-child.mono{white-space:nowrap}
/* feedback */
.fb{border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:12px 14px;margin:12px 0}
.fb .fbt{font-weight:800;letter-spacing:1px;font-size:14px;margin-bottom:6px}
.fb .earn{font-size:16px;font-weight:800;margin:8px 0}
.fb ul{margin:6px 0;padding-left:4px;list-style:none}
.fb li{margin:5px 0;padding-left:2px}
.fb .expl{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
/* dual parts / branch */
.dpart{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px;margin:10px 0}
.dpart h4{margin:0 0 8px;font-size:15px;color:var(--cy)}
.branchPath{font-size:14px;color:var(--mut);margin:6px 0}
.branchOut{border-left:3px solid var(--cy);background:#0a0f1d;padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0;font-size:15px}
/* intro & results */
.hero{text-align:center;padding:26px 10px 6px}
.hero .kicker{color:var(--cy);font-weight:800;letter-spacing:2px;font-size:14px}
.hero h1{font-size:26px;margin:6px 0}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:10px 0}
.kwcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kwcard h4{margin:0 0 8px;color:var(--cy);font-size:15px}
.kwcard .kws{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-size:14px;background:var(--btn);border:1px solid var(--btnb);border-radius:999px;padding:2px 10px;color:#cdd9f2}
.instr{columns:2;column-gap:26px}
.instr div{break-inside:avoid;margin:0 0 10px}
.instr b{color:var(--am)}
@media(max-width:760px){.instr{columns:1}.matchgrid{grid-template-columns:1fr}}
.res-hero{text-align:center;border:1px solid var(--line);border-radius:12px;padding:22px 16px;margin:14px 0}
.res-hero.pass{border-color:var(--gn);background:linear-gradient(180deg,#0f2e22,#0b1020)}
.res-hero.fail{border-color:var(--rd);background:linear-gradient(180deg,#331418,#0b1020)}
.res-hero .big{font-size:40px;font-weight:900}
.certline{color:var(--mut);font-size:14px}
table.rep{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}
table.rep th{background:var(--panel2);text-align:left;padding:8px;border:1px solid var(--line);font-size:14px;color:var(--mut)}
table.rep td{border:1px solid var(--line);padding:8px;vertical-align:top}
.lab{display:inline-block;font-weight:800;font-size:14px;border-radius:6px;padding:2px 8px;border:1px solid;white-space:nowrap}
.lab.full{color:var(--gn);border-color:var(--gn)}
.lab.partial{color:var(--am);border-color:var(--am)}
.lab.zero{color:var(--rd);border-color:var(--rd)}
.lab.skipped{color:var(--am);border-color:var(--am)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(4,7,14,.8);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal .mbox{background:var(--panel);border:1px solid var(--btnb);border-radius:12px;max-width:440px;width:100%;padding:18px}
:focus-visible{outline:2px solid #7cc7ff;outline-offset:2px;border-radius:6px}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

</style>

<script>
window.EXAM = {"meta":{"topicId":"network-plus","chapter":3.1,"title":"3.1 Documentation — MEDIUM","difficulty":"medium","questionCount":30,"estimatedMinutes":45,"passMark":70},"keywords":[{"theme":"Diagrams (physical vs. logical)","items":["physical diagram","logical diagram","network diagram","topology","star","hub-and-spoke","full mesh","partial mesh","spine-leaf","VLAN","subnet","MDF","IDF","as-built diagram","redline markup","floor plan","baseline","cloud / WAN icon"]},{"theme":"Racks & Power","items":["rack diagram","rack elevation","rack unit (U)","PDU","UPS","A/B power feed","power budget","blanking panel","cable manager","rail kit"]},{"theme":"Cabling & Labeling","items":["cable map","cable labeling","TIA-606","patch panel","port mapping","horizontal cabling","backbone (riser) cabling","drop","punch block","demarcation point","certification report","wiring schematic"]},{"theme":"Assets & Lifecycle","items":["asset inventory","CMDB","asset tag","serial number","warranty","EOL","EOSL","refresh cycle","shadow IT"]},{"theme":"IPAM & Addressing","items":["IPAM","DHCP scope","DHCP lease","static reservation","DNS integration","subnet allocation","utilization","overlapping subnet","IP conflict","CIDR mask"]},{"theme":"SLA & Vendors","items":["SLA","availability / uptime","two nines","three nines","four nines","five nines","downtime budget","service credit","maintenance window","MTTR","MTBF","response time","measurement period"]},{"theme":"Wireless Surveys","items":["site survey","predictive survey","passive survey","active survey","validation survey","heat map","AP placement","channel overlap","co-channel interference","signal strength (dBm)","RSSI","dead zone","roaming","coverage target"]}],"exercises":[{"id":"m01","theme":"Diagrams","type":"queue","points":3,"scenario":"You start the late shift at Meridian Health's NOC. Five tickets wait in the queue, and your lead gives one instruction: \u003cb\u003e\"Route every ticket to the document that answers it fastest — before anyone touches a device.\"\u003c/b\u003e The standard artifacts on the wall are: physical diagram, rack diagram, cable map, IPAM, SLA, and the wireless survey.","question":"Assign each ticket to the document that best answers it.","rows":[{"label":"T-4812 — Which rack unit is free in IDF-2 for the new access switch?","choices":["Rack diagram","Cable map","IPAM","SLA"],"correct":0},{"label":"T-4813 — Which patch panel port serves office 118 on floor 2?","choices":["Cable map","Wireless survey","Rack diagram","Asset inventory"],"correct":0},{"label":"T-4814 — Is 10[.]50[.]3[.]0/26 free for the new lab subnet?","choices":["IPAM","SLA","Cable map","Provider contract"],"correct":0},{"label":"T-4815 — The provider missed the uptime promise last month. What do we invoke?","choices":["SLA","Rack diagram","Heat map","Cable map"],"correct":0},{"label":"T-4816 — Wi-Fi is weak in the east wing. Where exactly is the gap?","choices":["Wireless survey heat map","IPAM","Rack diagram","Cable map"],"correct":0}],"hint":"One artifact per job: space in a rack, the path of a cable, address space, a contract promise, radio coverage.","expl":"Each artifact owns one question. The \u003cb\u003erack diagram\u003c/b\u003e shows units and free space in a cabinet. The \u003cb\u003ecable map\u003c/b\u003e follows labels from panel port to room. \u003cb\u003eIPAM\u003c/b\u003e is the address registry where new subnets are planned. The \u003cb\u003eSLA\u003c/b\u003e is the contract — missed uptime means credits. The wireless survey \u003cb\u003eheat map\u003c/b\u003e paints coverage, so it points at weak areas. Knowing which document answers which question is the whole point of Objective 3.1."},{"id":"m02","theme":"Diagrams","type":"qcm","points":1,"scenario":"Meridian Health will move switch SW-9 from IDF-2 to IDF-3 next month. Before the move, the tech must confirm which closets exist, where the racks stand in each room, and which door and aisle the trolley should use.","question":"Which document answers this first?","choices":["The physical diagram, because it shows rooms, racks, and closet locations","The logical diagram, because it shows all of the VLANs that run on SW-9","The SLA, because the move may affect the provider's uptime promise","The IPAM plan, because the move changes the IP subnets that are in use"],"correct":0,"hint":"Ask yourself: does the question start with WHERE or with HOW TRAFFIC FLOWS?","expl":"A move between closets is a \u003cb\u003ewhere\u003c/b\u003e question, and physical diagrams show where things are: rooms, racks, closets, walls and cable paths. The logical diagram stays true even after you roll the cabinet — VLANs and IP settings do not care which room the switch occupies. The SLA and IPAM answer contract and address questions, not location questions."},{"id":"m03","theme":"Diagrams","type":"buckets","points":4,"scenario":"A new hire printed two diagrams and mixed the annotations together. You must sort the eight sticky notes onto the correct drawing so the walls stop getting confused.","question":"Drag each note into the diagram it belongs to.","buckets":["Physical diagram","Logical diagram"],"items":[{"t":"MDF and IDF room locations","b":0},{"t":"Wall, door, and aisle outlines","b":0},{"t":"Rack locations and cabinet numbers","b":0},{"t":"Cable tray and riser routes","b":0},{"t":"VLAN memberships per switch","b":1},{"t":"IP subnets and gateways per link","b":1},{"t":"Routing neighbors and WAN overlays","b":1},{"t":"Spanning-tree root and trunk links","b":1}],"hint":"If the note would survive moving the rack to another room unchanged, it is logical.","expl":"\u003cb\u003ePhysical\u003c/b\u003e diagrams are the geography of the plant: rooms, racks, walls, cable routes. \u003cb\u003eLogical\u003c/b\u003e diagrams describe how data flows: VLANs, subnets, routing adjacencies, trunks. A good test: if the fact stays true when you relocate the hardware, it belongs on the logical diagram; if it pins the hardware to a place, it belongs on the physical one."},{"id":"m04","theme":"Diagrams","type":"qcm","points":1,"scenario":"An auditor asks: \"Show me proof that VLAN 40 (VoIP) is carried between SW-3 and SW-4.\" You open one diagram: it shows both switches, the trunk line between them, and the VLAN 40 tag on that trunk. It shows no rooms, no racks, and no cable numbers.","question":"Which diagram did you open?","choices":["The logical diagram — VLANs describe traffic flow, not device location","The physical diagram — the trunk rides a real cable between closets","The rack diagram — SW-3 and SW-4 are rack-mounted devices in the MDF","The cable map — every trunk between switches needs a labeled cable"],"correct":0,"hint":"The drawing answers WHICH VLANs cross the link — not WHERE the link runs.","expl":"VLAN tags and trunk relationships live on the \u003cb\u003elogical\u003c/b\u003e view. The trunk does ride a real cable, but the drawing that carries VLAN meaning is the logical one. Rack and cable documents answer \u003ci\u003ewhere\u003c/i\u003e and \u003ci\u003ewhich port\u003c/i\u003e — never \u003ci\u003ewhich VLANs\u003c/i\u003e."},{"id":"m05","theme":"Diagrams","type":"match","points":3,"scenario":"You are redrawing the network diagrams and must label each shape with the right topology name so the next engineer reads them correctly.","question":"Match each topology name to the description you would draw.","left":["Star","Hub-and-spoke","Full mesh","Spine-leaf","Partial mesh"],"right":[{"t":"All edge devices connect to one central point","for":0},{"t":"Branch sites all home to one head-office hub over WAN links","for":1},{"t":"Every node links to every other node — maximum redundancy, high cost","for":2},{"t":"Data-center fabric: every leaf switch links to every spine switch","for":3},{"t":"Some, but not all, nodes link to each other — a cost and redundancy balance","for":4}],"hint":"Spine-leaf is the data-center one; hub-and-spoke is the WAN one.","expl":"\u003cb\u003eStar\u003c/b\u003e — many devices, one central switch. \u003cb\u003eHub-and-spoke\u003c/b\u003e — the WAN version: branches home to a hub site. \u003cb\u003eFull mesh\u003c/b\u003e — every node to every node; bullet-proof but expensive. \u003cb\u003eSpine-leaf\u003c/b\u003e — data-center fabric built for predictable server-to-server latency. \u003cb\u003ePartial mesh\u003c/b\u003e — selected redundant links only. Diagrams use these shapes, so naming them correctly keeps documentation readable."},{"id":"m06","theme":"Diagrams","type":"fill","points":2,"scenario":"The data-center team just published the new fabric on the logical diagram. You must complete the design note that goes with it. Fill each blank with a word from the shuffled bank.","question":"Complete the sentence about the fabric design.","text":"The drawing shows four ___1___ switches at the top and eight ___2___ switches at the bottom, with every lower switch linked to every upper switch above it. This shape is built for ___3___ traffic between servers.","blanks":[{"a":["spine"]},{"a":["leaf"]},{"a":["east-west"]}],"bank":["spine","leaf","east-west","north-south","star","ring"],"hint":"Two tiers, full connectivity between tiers; server-to-server traffic in a data center is called east-…","expl":"In a \u003cb\u003espine-leaf\u003c/b\u003e fabric, the four top-tier switches are the \u003cb\u003espines\u003c/b\u003e and the eight bottom-tier switches are the \u003cb\u003eleaves\u003c/b\u003e — every leaf connects to every spine. Server-to-server traffic inside the data center is \u003cb\u003eeast-west\u003c/b\u003e; traffic leaving toward clients is north-south, the near-miss distractor in the bank."},{"id":"m07","theme":"Racks & Power","type":"fill","points":2,"scenario":"IDF-2 cabinet \u003cb\u003eR2\u003c/b\u003e is a 42U rack. Today's elevation: UPS 4U (RU 1–4), patch panel A 1U (RU 8), patch panel B 1U (RU 9), core switch 2U (RU 20–21), access switch 2U (RU 22–23), KVM console 1U (RU 30), shelf 1U (RU 40), one blanking panel 1U (RU 36). The vertical PDUs are 0U devices mounted on the frame.","question":"Change ticket CH-2317 adds one 2U switch and one 1U cable manager to R2. How many rack units (U) remain free afterwards? Type the number.","text":"Rack units still free after the install: ___1___","blanks":[{"a":["26"]}],"bank":["25","26","27","28","29","30"],"hint":"Sum what is used, subtract from 42, then subtract the 3 new units. The PDUs add nothing.","expl":"Used today: 4+1+1+2+2+1+1+1 = \u003cb\u003e13U\u003c/b\u003e. Free: 42 − 13 = \u003cb\u003e29U\u003c/b\u003e. The ticket consumes 2U + 1U = 3U, so 29 − 3 = \u003cb\u003e26U\u003c/b\u003e remain. Vertical PDUs are 0U — they never enter the sum. This arithmetic is exactly how rack diagrams stop oversold cabinets before the truck arrives."},{"id":"m08","theme":"Racks & Power","type":"match","points":3,"scenario":"A delivery pallet arrived for the MDF with unlabeled boxes. The installer must know what each rack component does before mounting anything.","question":"Match each rack component to its purpose.","left":["PDU","UPS","Blanking panel","Cable manager","Rail kit"],"right":[{"t":"Distributes power outlets to the devices inside the rack","for":0},{"t":"Battery backup that keeps gear alive through short power cuts","for":1},{"t":"Fills empty rack units so air flows front-to-back properly","for":2},{"t":"Guides and organizes patch cords between devices","for":3},{"t":"Lets heavy gear like servers slide out for service","for":4}],"hint":"Think power, power protection, airflow, cable tidiness, sliding shelves.","expl":"A \u003cb\u003ePDU\u003c/b\u003e is the rack's power strip — rack diagrams note which PDU feeds each device. A \u003cb\u003eUPS\u003c/b\u003e bridges short outages and clean shutdowns. \u003cb\u003eBlanking panels\u003c/b\u003e close empty units; without them hot air recirculates and gear runs hotter. \u003cb\u003eCable managers\u003c/b\u003e keep patch cords serviceable. \u003cb\u003eRail kits\u003c/b\u003e let heavy equipment slide out without un-racking the cabinet."},{"id":"m09","theme":"Racks & Power","type":"spot","points":2,"scenario":"IDF-2 cabinet R2's elevation, as currently drawn in the rack diagram. Cross-check with the asset inventory: \u003cb\u003eSRV-DB-1 was decommissioned and removed from service last month\u003c/b\u003e, while SW-ACC-2 is live and in use.","question":"Two devices claim the same rack units. Click the line that must be corrected.","lines":["RU 1-4    UPS-1","RU 8      PP-A","RU 20-21  SW-CORE-1","RU 22-23  SW-ACC-2","RU 22-23  SRV-DB-1","RU 30     KVM-CONSOLE","RU 36     BLANK-1U","RU 40     SHELF-1U"],"wrong":[4],"hint":"Look for the same unit range appearing twice — and check which device should no longer be there.","expl":"RU 22-23 cannot hold both SW-ACC-2 and SRV-DB-1, and the inventory says SRV-DB-1 is already decommissioned — so the stale \u003cb\u003eSRV-DB-1\u003c/b\u003e row is the one to correct. A rack diagram must give every live device its own, non-overlapping units, otherwise a tech following the drawing opens the cabinet and finds a surprise. All other lines are single and non-overlapping, so they are fine."},{"id":"m10","theme":"Racks & Power","type":"multi","points":3,"scenario":"The documentation committee is writing the house style guide: \"What belongs on a rack diagram?\" Seven candidates made the shortlist; four of them belong there.","question":"Select every item that belongs on a rack diagram.","choices":["Rack unit (U) position of every device","PDU and power feed information","Front or rear mounting notes","Device model (and serial where useful)","The DHCP scope for each VLAN","The Wi-Fi channel plan","The provider's SLA credit tier"],"correct":[0,1,2,3],"hint":"If it helps a tech physically mount, power, or find a box, it belongs. Settings and contracts do not.","expl":"Rack diagrams are physical records: \u003cb\u003eunits\u003c/b\u003e, \u003cb\u003epower\u003c/b\u003e, \u003cb\u003eorientation\u003c/b\u003e, and \u003cb\u003emodels\u003c/b\u003e — everything a tech needs to mount and trace hardware. DHCP scopes live in IPAM, Wi-Fi channels in the survey/design docs, and SLA tiers in the contract file. Mixing logical settings into a rack drawing makes both views harder to trust."},{"id":"m11","theme":"Cabling & Labeling","type":"match","points":3,"scenario":"Meridian labels cables as \u003cb\u003e&lt;room&gt;-&lt;panel letter&gt;&lt;port&gt;\u003c/b\u003e: \u003ccode\u003e2F-A07\u003c/code\u003e means floor 2, patch panel A, port 07. Closet uplinks start with the closet name (like \u003ccode\u003eIDF2-B03\u003c/code\u003e), and the provider handoff is labeled \u003ccode\u003eDMARC-01\u003c/code\u003e.","question":"Match each label to what it identifies.","left":["2F-A07","1F-C15","IDF2-B03","DMARC-01","3F-B12"],"right":[{"t":"Floor 2, panel A, port 7 — an office run","for":0},{"t":"Floor 1, panel C, port 15","for":1},{"t":"Closet IDF-2, panel B, port 3 — an uplink","for":2},{"t":"Provider handoff at the demarcation point","for":3},{"t":"Floor 3, panel B, port 12","for":4}],"hint":"Room, then panel letter, then two-digit port. DMARC is the provider boundary.","expl":"A good label scheme is self-describing: anyone can decode \u003cb\u003e2F-A07\u003c/b\u003e without a site visit. \u003cb\u003eIDF2-B03\u003c/b\u003e names the closet because it is an uplink between closets. \u003cb\u003eDMARC-01\u003c/b\u003e marks the \u003cb\u003edemarcation point\u003c/b\u003e — the line where the provider's circuit ends and your cabling responsibility begins. Cable maps live or die by this scheme."},{"id":"m12","theme":"Cabling & Labeling","type":"fill","points":2,"scenario":"Meridian is rewriting its cabling standard and you must complete the policy paragraph. Use the shuffled bank.","question":"Complete the labeling policy.","text":"Our labeling follows ___1___ , so every cable, patch panel port, and closet gets a unique ID. Horizontal runs terminate on a ___2___ in each closet, and the provider circuit lands at the ___3___ , where our responsibility begins.","blanks":[{"a":["tia-606","ansi/tia-606","tia-606-c"]},{"a":["patch panel"]},{"a":["demarcation point","demarc"]}],"bank":["TIA-606","patch panel","demarcation point","heat map","three nines","asset tag"],"hint":"The cabling labeling standard, the strip every horizontal run ends on, and the provider boundary.","expl":"\u003cb\u003eTIA-606\u003c/b\u003e is the industry labeling standard for telecom cabling — it defines how to name cables, panels, and closets so records stay consistent for decades. Horizontal cabling terminates on a \u003cb\u003epatch panel\u003c/b\u003e in the closet. The \u003cb\u003edemarcation point\u003c/b\u003e is the handoff line: inside it is your cable plant, outside it is the provider's."},{"id":"m13","theme":"Cabling & Labeling","type":"spot","points":2,"scenario":"Floor 2 cable schedule as printed from the cable map. The as-built notes say \u003cb\u003eoffice 216 was cabled first\u003c/b\u003e; the office 218 entry was added later, in a rush, without pulling the next free label.","question":"Every drop must have a unique label. Click the row that breaks the scheme.","lines":["2F-A07 | SW2 Gi0/12 | office 214","2F-A08 | SW2 Gi0/13 | office 216","2F-A08 | SW2 Gi0/14 | office 218","2F-A09 | SW2 Gi0/15 | office 220","2F-A10 | SW2 Gi0/16 | office 222"],"wrong":[2],"hint":"One label appears on two different rows — and one of those entries was never properly assigned.","expl":"\u003cb\u003e2F-A08\u003c/b\u003e appears twice: panel A port 8 physically cannot serve two offices and two switch ports. Because the as-built notes say office 216 was cabled first, the \u003cb\u003eoffice 218 row is the incorrect entry\u003c/b\u003e — it should have taken the next free label. A duplicated label makes a cable map dangerous: a tech tracing A08 cannot know which run they are touching until they test it."},{"id":"m14","theme":"Cabling & Labeling","type":"branch","points":3,"scenario":"Office 214 reports a dead port — the PC shows no link light at all. You are the on-shift tech and you promised the lead you would work this documentation-first.","question":"Walk the decision path to a clean resolution. Each choice unlocks the next step; the Check button unlocks when you reach an outcome.","tree":{"total":3,"start":"a","nodes":{"a":{"q":"Where do you look first?","opts":[{"t":"Open the cable map and find which panel port and switch port serve office 214","next":"b","ok":true,"out":"Cable map: 2F-A07 → SW2 Gi0/12 → office 214."},{"t":"Reboot access switch SW2 and see what comes back","next":"e1","ok":false,"out":"A reboot drops every user on the floor — and the port stays dead. Reboots are not diagnostics.","why":"Reboots are last resorts, never the first step, and they interrupt everyone."},{"t":"Order a new switch just in case","next":"e2","ok":false,"out":"You ordered hardware before reading any record — budget spent, cause still unknown.","why":"Never buy before you diagnose."}]},"b":{"q":"Cable map says 2F-A07 → SW2 Gi0/12. The PC still has no link. Next?","opts":[{"t":"Check the state of SW2 port Gi0/12 in the switch config and logs","next":"c","ok":true,"out":"Gi0/12: status down, and the port shows admin-down (shutdown)."},{"t":"Replace the user's PC","next":"e3","ok":false,"out":"A new PC on an admin-down port still shows no link — wrong suspect.","why":"No link light usually means cable, port state, or switch — rarely the PC."},{"t":"Move the user to a different VLAN in IPAM","next":"e4","ok":false,"out":"VLAN changes cannot fix a port that is switched off.","why":"Layer-1 first: no link means nothing above it matters yet."}]},"c":{"q":"Gi0/12 is admin-down. What is the right move?","opts":[{"t":"Find the change ticket that shut it, confirm nothing still blocks it, re-enable it, then update the records","next":"e5","ok":true,"out":"Ticket CH-2291 shut the port for a decommissioned printer. You re-enable the port, note the change, and the map stays true."},{"t":"Silently re-enable the port and tell nobody","next":"e6","ok":false,"out":"The port comes up — but every record now lies about who, why, and when. The next tech wastes an hour on it.","why":"Undocumented changes are how documentation rots."},{"t":"Run a new cable from the office to free port Gi0/20","next":"e7","ok":false,"out":"It works, but now cable map, switch config and reality disagree — classic documentation drift.","why":"Fix the cause, do not fork the records."}]},"e1":{"end":true,"out":"The reboot finished; the port is still dead and the floor lost ten minutes."},"e2":{"end":true,"out":"The switch arrives in three days; the user still has no link today."},"e3":{"end":true,"out":"The new PC shows no link either. Now you have two problems."},"e4":{"end":true,"out":"The IPAM record is edited, but a shutdown port carries no VLAN at all."},"e5":{"end":true,"out":"Link up, user happy, ticket closed, records updated. Textbook."},"e6":{"end":true,"out":"It works today. In three months nobody remembers why this port was touched."},"e7":{"end":true,"out":"The user is online — on an undocumented cable. The map is now wrong twice."}}},"hint":"Map first, port state second, change record before you touch anything.","expl":"A dead port is a documentation-first workflow: the \u003cb\u003ecable map\u003c/b\u003e gives the exact path, the switch state gives the cause, and the \u003cb\u003echange ticket\u003c/b\u003e explains why a port was shut on purpose. Admin-down ports are common — decommissioned printers, security holds, pending repairs. Whatever you do, write it back, or the next person inherits lies."},{"id":"m15","theme":"IPAM & Addressing","type":"fill","points":2,"scenario":"You are reconciling the DHCP server against IPAM for VLAN 110. The lease log is below — use the filter box to search it.","log":{"title":"DHCP server — lease activity (excerpt)","lines":["Jun 03 09:12:04 dhcpd: DHCPDISCOVER from b4:2e:99:1a:c3:d1 via vlan110","Jun 03 09:12:04 dhcpd: DHCPACK on 10[.]30[.]7[.]121 to b4:2e:99:1a:c3:d1 (LAP-3F-02) via vlan110","Jun 03 09:14:31 dhcpd: DHCPACK on 10[.]30[.]7[.]134 to 6c:88:19:7f:0e:22 (MES-3F-14) via vlan110","Jun 03 09:20:02 dhcpd: INFO static binding added: 10[.]30[.]7[.]10 -\u003e PRN-3F-01 (aa:11:5c:40:22:8e)","Jun 03 09:20:02 dhcpd: INFO pool 10[.]30[.]7[.]100-10[.]30[.]7[.]200: 87 / 101 leases in use","Jun 03 09:41:55 dhcpd: DHCPREQUEST for 10[.]30[.]7[.]121 from b4:2e:99:1a:c3:d1"]},"question":"One address on this segment must be recorded in IPAM as a static reservation. Type that address (dots or [.] style both accepted).","text":"The address to record as a reservation: ___1___","blanks":[{"a":["10[.]30[.]7[.]10"]}],"bank":["10[.]30[.]7[.]10","10[.]30[.]7[.]121","10[.]30[.]7[.]134","10[.]30[.]7[.]5"],"hint":"Filter the log for the word 'static'.","expl":"The line \u003ccode\u003estatic binding added: 10[.]30[.]7[.]10 -&gt; PRN-3F-01\u003c/code\u003e is the one: printers and other fixed gear get \u003cb\u003estatic bindings\u003c/b\u003e, and IPAM must mirror them as \u003cb\u003ereservations\u003c/b\u003e so nobody plans a scope change that hands the same address to a laptop. The .121 and .134 leases are dynamic — the DHCP–IPAM integration tracks them automatically; .5 is the server itself."},{"id":"m16","theme":"IPAM & Addressing","type":"multi","points":3,"scenario":"Management asks why the team wants budget for an IPAM tool \"when a spreadsheet works fine\". You list what IPAM actually does; four of the seven candidate statements are true IPAM functions.","question":"Select every statement that describes what IPAM does.","choices":["Plans and documents subnet allocation across the whole network","Keeps central records that tie DNS and DHCP to IP addresses","Tracks static reservations so an address is never handed out twice","Reports utilization so you can see when a subnet needs expanding","Measures the provider's uptime against the SLA","Stores rack elevations and PDU feeds","Chooses Wi-Fi channels for the access points"],"correct":[0,1,2,3],"hint":"IPAM manages ADDRESSES. Uptime, racks and radio channels are other documents' jobs.","expl":"\u003cb\u003eIPAM = IP address management\u003c/b\u003e: plan address space, record it, sync it with DNS and DHCP, guard reservations, and report utilization before pools run dry. Measuring provider uptime belongs to SLA reporting and monitoring; rack elevations belong to rack diagrams; channel plans belong to the wireless design. A spreadsheet quietly fails at all four IPAM jobs at once."},{"id":"m17","theme":"IPAM & Addressing","type":"qcm","points":2,"scenario":"The IPAM utilization report for the 10[.]20.x.x block reads:\u003cbr\u003e\u003cbr\u003e\u003ctable class=\"dt\"\u003e\u003ctr\u003e\u003cth\u003eVLAN\u003c/th\u003e\u003cth\u003eSubnet\u003c/th\u003e\u003cth\u003eUsed\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e110\u003c/td\u003e\u003ctd\u003e10[.]20[.]110[.]0/26\u003c/td\u003e\u003ctd\u003e58 of 62\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e120\u003c/td\u003e\u003ctd\u003e10[.]20[.]120[.]0/25\u003c/td\u003e\u003ctd\u003e40 of 126\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e130\u003c/td\u003e\u003ctd\u003e10[.]20[.]130[.]0/26\u003c/td\u003e\u003ctd\u003e12 of 62\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e140\u003c/td\u003e\u003ctd\u003e10[.]20[.]140[.]0/27\u003c/td\u003e\u003ctd\u003e28 of 30\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e","question":"A 40-host lab must live on an existing subnet that keeps a /26 mask. Which VLAN can take it?","choices":["VLAN 130 — 50 addresses free, and it is already a /26","VLAN 110 — it is a /26 with the most used addresses","VLAN 120 — the largest free block of addresses on the report","VLAN 140 — its size is closest to the 40 hosts needed"],"correct":0,"hint":"A /26 holds 62 usable addresses. Check both the mask AND the free count.","expl":"A \u003cb\u003e/26\u003c/b\u003e offers 62 usable hosts. VLAN 130 has 62 − 12 = \u003cb\u003e50 free\u003c/b\u003e — enough for 40 — and it is a /26. VLAN 110 is a /26 but only 4 free. VLAN 120 has room but is a /25, which breaks the mask rule. VLAN 140 is a /27: 30 usable total, smaller than the lab. Reading utilization plus mask size from IPAM is a daily network-engineer task."},{"id":"m18","theme":"IPAM & Addressing","type":"terminal","points":2,"scenario":"Before you update IPAM utilization for VLAN 110, you must confirm which addresses actually answer right now. You are on the Meridian NOC jump host.","question":"Use an \u003cb\u003enmap\u003c/b\u003e ping scan — host discovery only, no port scan — against 10[.]30[.]7[.]0/24. Type the command and press Enter.\u003cbr\u003e\u003cspan class='mut small'\u003eHint: \u003ccode\u003e-sn\u003c/code\u003e means \"ping scan, skip port scan\". Expected output shape: \u003ccode\u003eNmap scan report for 10[.]30[.]7[.]1 … Host is up\u003c/code\u003e.\u003c/span\u003e","termTitle":"student@jump-host:~ — Meridian NOC","intro":"Meridian NOC jump host — acceptable use: discovery scans only during change windows.","tasks":[{"name":"Ping scan of 10[.]30[.]7[.]0/24","re":"^nmap\\s+((-n|-T[0-5])\\s+)*(-sn|-sP)(\\s+(-n|-T[0-5]))*\\s+10[.]30[.]7[.]0/24(\\s+(-n|-T[0-5]))*\\s*$","demo":"nmap -sn 10[.]30[.]7[.]0/24","out":"Starting Nmap 7.94\nNmap scan report for 10[.]30[.]7[.]1\nHost is up (0.0011s latency).\nNmap scan report for 10[.]30[.]7[.]10\nHost is up (0.0024s latency).\nNmap done: 256 IP addresses (2 hosts up) scanned in 2.31 seconds"}],"hint":"The tool is nmap, the flag is -sn, the target is the /24. Nothing else is needed.","expl":"\u003ccode\u003enmap -sn 10[.]30[.]7[.]0/24\u003c/code\u003e answers one question — who is up — and skips the port scan, so it is gentle on the network and safe around fragile gear. \u003ccode\u003e-sP\u003c/code\u003e is the older alias for \u003ccode\u003e-sn\u003c/code\u003e. A full scan (like \u003ccode\u003e-sS\u003c/code\u003e) would probe thousands of ports per host, which is heavier than this goal needs. The result feeds the IPAM utilization figure with reality instead of stale rows."},{"id":"m19","theme":"SLA & Vendors","type":"match","points":3,"scenario":"A vendor slides deck says \"we offer two, three, four, or five nines of availability\". Finance wants the numbers translated into real downtime before anyone signs.","question":"Match each availability level to its yearly downtime budget.","left":["99% ('two nines')","99.9% ('three nines')","99.99% ('four nines')","99.999% ('five nines')"],"right":[{"t":"About 3.65 days of downtime per year","for":0},{"t":"About 8.76 hours per year","for":1},{"t":"About 52.6 minutes per year","for":2},{"t":"About 5.26 minutes per year","for":3}],"hint":"Every extra nine cuts the budget by a factor of ten.","expl":"The ladder is worth memorizing: \u003cb\u003e99%\u003c/b\u003e ≈ 3.65 days/year, \u003cb\u003e99.9%\u003c/b\u003e ≈ 8.76 hours/year, \u003cb\u003e99.99%\u003c/b\u003e ≈ 52.6 minutes/year, \u003cb\u003e99.999%\u003c/b\u003e ≈ 5.26 minutes/year. Each added nine divides the allowed downtime by ten — and multiplies the price of the design (redundant links, A/B power, spare hardware) needed to honor it."},{"id":"m20","theme":"SLA & Vendors","type":"qcm","points":2,"scenario":"The branch office link carries a 99.95% availability SLA, measured per 30-day month. Finance asks how much downtime the contract actually allows per month before credits start.","question":"Which figure is right?","choices":["About 21.6 minutes per 30-day month","About 4.32 minutes per 30-day month","About 52.6 minutes per 30-day month","About 8.76 hours per 30-day month"],"correct":0,"hint":"A 30-day month has 43,200 minutes. Take 0.05% of it?","expl":"43,200 minutes × 0.0005 = \u003cb\u003e21.6 minutes\u003c/b\u003e. The distractors are the classic mix-ups: 4.32 minutes is four nines \u003ci\u003eper month\u003c/i\u003e, 52.6 minutes is four nines \u003ci\u003eper year\u003c/i\u003e, and 8.76 hours is three nines \u003ci\u003eper year\u003c/i\u003e. Always check two things: the percentage and the measurement period."},{"id":"m21","theme":"SLA & Vendors","type":"fill","points":2,"scenario":"Legal asks you to sanity-check the operations paragraphs of the new provider SLA before signature. Fill the blanks from the shuffled bank.","question":"Complete the SLA paragraph.","text":"The SLA promises 99.9% uptime. Planned work must sit inside a published monthly ___1___ . When the provider misses the target, the contract pays a ___2___ , and the provider must also report how fast repairs happen on average — the ___3___ .","blanks":[{"a":["maintenance window"]},{"a":["service credit"]},{"a":["mttr"]}],"bank":["maintenance window","service credit","MTTR","rack diagram","five nines","IPAM"],"hint":"Agreed time for planned work, money back for misses, and the average repair speed.","expl":"A \u003cb\u003emaintenance window\u003c/b\u003e is the agreed slot for planned work — work outside it counts as downtime. A \u003cb\u003eservice credit\u003c/b\u003e is the money remedy when the provider misses the number. \u003cb\u003eMTTR\u003c/b\u003e (mean time to repair) says how long fixes take on average; without it, \"we will fix it fast\" means nothing. These three terms turn an SLA from a slogan into an enforceable contract."},{"id":"m22","theme":"SLA & Vendors","type":"dual","points":3,"scenario":"Meridian signs a DRAFT contract for the new branch link: 200/200 Mbps, 99.5% availability — one page long. The draft names the provider and the speed, and stops there. You read it once as the network lead, and once as the auditor who will inherit the complaints.","question":"Answer from BOTH perspectives.","parts":[{"label":"NETWORK LEAD — Which document IS the promise you just read?","choices":["The SLA — availability numbers and remedies live in the SLA itself","The rack diagram, because the new link terminates in the MDF rack","The cable map, because the link is ultimately just a cable run","The heat map, because the branch also uses a wireless backup link"],"correct":0},{"label":"AUDITOR — Which missing element will cause a fight later?","choices":["The measurement period and the credit remedy for missed uptime","The provider's legal company name, address, and signature block","The fiber connector type used at the demarcation point","The color of the patch cord installed at the handoff"],"correct":0}],"hint":"A percentage without a measurement period and a remedy is unenforceable.","expl":"An \u003cb\u003eSLA\u003c/b\u003e is a contract, not a drawing — it is where availability promises live. And 99.5% means nothing until the contract says: measured how (per month?), what is excluded (maintenance windows?), and what happens on a miss (credits?). The provider name and the demarc details are real contract parts, but they are not the parts that decide who owes whom money after an outage."},{"id":"m23","theme":"Wireless Surveys","type":"queue","points":3,"scenario":"Four wireless jobs landed in the queue, and the crew can only take one survey kit per job. Route each job to the right activity.","question":"Assign each job its correct survey type or artifact.","rows":[{"label":"New clinic build-out — walls not built yet; predict coverage from floor plans","choices":["Predictive survey","Passive survey","Active survey","Physical diagram"],"correct":0},{"label":"Post-install check — walk the floor with a survey app measuring real signals","choices":["Passive survey","Active survey","Predictive survey","Cable map"],"correct":0},{"label":"VoIP roaming test — keep a call alive while walking between wings","choices":["Active survey","Passive survey","Heat map review","Asset inventory"],"correct":0},{"label":"Record exactly where AP-9 is mounted and which way it faces","choices":["Physical diagram / rack-elevation notes","Predictive survey","Passive survey","SLA"],"correct":0}],"hint":"Before walls = predict. Listening walk = passive. Associated client test = active. Mounting points = physical record.","expl":"\u003cb\u003ePredictive\u003c/b\u003e surveys model coverage from floor plans before construction. \u003cb\u003ePassive\u003c/b\u003e surveys only listen: a walk with a measuring app paints the real heat map. \u003cb\u003eActive\u003c/b\u003e surveys keep a client associated — that is how you prove roaming and throughput for voice. AP mount positions are physical facts, so they belong with the physical/rack documentation, not in survey results."},{"id":"m24","theme":"Wireless Surveys","type":"match","points":3,"scenario":"You are briefing helpdesk staff so they can read the wireless survey report without calling you every time.","question":"Match each wireless term to its plain meaning.","left":["Heat map","Dead zone","RSSI / dBm","Channel overlap","Roaming"],"right":[{"t":"Color-overlaid floor plan showing signal strength everywhere","for":0},{"t":"An area below the coverage target — calls drop there","for":1},{"t":"Received signal strength; closer to 0 is stronger (−50 beats −75)","for":2},{"t":"Two APs on the same or overlapping channels fighting for airtime","for":3},{"t":"A client moving between APs without dropping its session","for":4}],"hint":"dBm is negative: −50 is stronger than −75. Overlap means SHARING a channel, not just sharing air.","expl":"The \u003cb\u003eheat map\u003c/b\u003e is the survey's headline picture. A \u003cb\u003edead zone\u003c/b\u003e is any spot under the coverage target. \u003cb\u003eRSSI/dBm\u003c/b\u003e readings are negative numbers, so −50 dBm is a strong signal and −85 dBm is barely alive. \u003cb\u003eChannel overlap\u003c/b\u003e (co-channel interference) happens when neighboring APs share a channel. \u003cb\u003eRoaming\u003c/b\u003e is the client handoff between APs — the thing VoIP cares about most."},{"id":"m25","theme":"Wireless Surveys","type":"multi","points":3,"scenario":"Floor 3 survey export, straight from the tool:\u003cbr\u003e\u003cbr\u003e\u003ctable class=\"dt\"\u003e\u003ctr\u003e\u003cth\u003eAP\u003c/th\u003e\u003cth\u003eChannel\u003c/th\u003e\u003cth\u003eCell center\u003c/th\u003e\u003cth\u003eEdge RSSI\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAP-1\u003c/td\u003e\u003ctd\u003e36 (5 GHz)\u003c/td\u003e\u003ctd\u003elobby\u003c/td\u003e\u003ctd\u003e−48 dBm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAP-2\u003c/td\u003e\u003ctd\u003e36 (5 GHz)\u003c/td\u003e\u003ctd\u003ecafé\u003c/td\u003e\u003ctd\u003e−52 dBm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAP-3\u003c/td\u003e\u003ctd\u003e40 (5 GHz)\u003c/td\u003e\u003ctd\u003eoffice row\u003c/td\u003e\u003ctd\u003e−55 dBm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAP-4\u003c/td\u003e\u003ctd\u003e40 (5 GHz)\u003c/td\u003e\u003ctd\u003eeast wing\u003c/td\u003e\u003ctd\u003e−61 dBm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAP-5\u003c/td\u003e\u003ctd\u003e44 (5 GHz)\u003c/td\u003e\u003ctd\u003eloading dock\u003c/td\u003e\u003ctd\u003e−84 dBm\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAP-6\u003c/td\u003e\u003ctd\u003e1 (2.4 GHz)\u003c/td\u003e\u003ctd\u003estairwell\u003c/td\u003e\u003ctd\u003e−70 dBm\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003cbr\u003eDesign target: \u003cb\u003e−67 dBm or stronger in every work area\u003c/b\u003e. Adjacent cells overlap by design.","question":"Select every TRUE finding from this export.","choices":["AP-1 and AP-2 share channel 36 with overlapping cells — co-channel interference","AP-3 and AP-4 share channel 40 with overlapping cells — co-channel interference","The loading dock reads −84 dBm — far below the −67 dBm target","AP-6 on channel 1 interferes with AP-5 on channel 44","The lobby is below the design target","AP-2 and AP-3 must be moved apart because different channels still interfere badly"],"correct":[0,1,2],"hint":"Same channel + overlapping cells = interference. Compare every edge RSSI with −67.","expl":"AP-1/AP-2 (both ch 36) and AP-3/AP-4 (both ch 40) overlap on the \u003cb\u003esame channel\u003c/b\u003e — that is co-channel interference and it wastes airtime. The dock's −84 dBm fails the −67 dBm target badly — a real dead zone. AP-6 is 2.4 GHz channel 1 and AP-5 is 5 GHz channel 44: different bands cannot interfere. The lobby at −48 dBm is the strongest cell on the floor. Different, non-overlapping channels (36 vs 40) is exactly how you AVOID the problem."},{"id":"m26","theme":"Wireless Surveys","type":"order","points":3,"scenario":"Meridian opens a new wing next quarter and you own the wireless survey from day one. The seven-milestone plan got shuffled in the handover notes.","question":"Put the survey workflow back in order — first step at the top.","steps":["Gather requirements and floor plans","Build the predictive design (AP placement)","Install and cable the APs","Run the passive validation walk and draw the heat map","Run the active tests (roaming, throughput)","Write the report and update the diagrams"],"hint":"Predict before you build; measure after you build; prove roaming before you write the report.","expl":"The workflow is: \u003cb\u003erequirements → predictive design → install → passive validation → active tests → report\u003c/b\u003e. You predict from floor plans before walls exist, then the passive walk checks the prediction against reality, then active tests prove the hard parts (voice roaming). The report and updated diagrams close the loop — a survey that never becomes documentation has to be paid for twice."},{"id":"m27","theme":"Assets & Lifecycle","type":"multi","points":2,"scenario":"The asset inventory template is being rebuilt after an audit finding (\"we could not RMA a failed switch because nobody knew its warranty state\"). Four of the seven proposed fields belong in every hardware row.","question":"Select every field the hardware inventory must carry.","choices":["Serial number","Physical location (site, closet, rack / U)","Warranty end date","Assigned owner or role","The user's password for the device console","The device's DHCP lease time","The provider's SLA credit tier"],"correct":[0,1,2,3],"hint":"Think of the RMA call: what do they ask you for, and what must you know to find the box?","expl":"\u003cb\u003eSerial number\u003c/b\u003e is the device's identity on any RMA or audit. \u003cb\u003eLocation\u003c/b\u003e lets a tech find the box in minutes. \u003cb\u003eWarranty end\u003c/b\u003e decides repair-versus-replace economics before things fail. \u003cb\u003eOwner\u003c/b\u003e gives accountability. Passwords never belong in an inventory (a password vault is the right home), and lease times and SLA tiers live in IPAM and the contract file respectively."},{"id":"m28","theme":"Assets & Lifecycle","type":"match","points":3,"scenario":"New hires keep mixing up lifecycle vocabulary, which caused last year's outage on an EOSL firewall that \"should still have been supported\". Build the glossary card.","question":"Match each lifecycle term to its definition.","left":["EOL (end of life)","EOSL (end of service life)","Warranty","Asset tag","Refresh cycle"],"right":[{"t":"Vendor stops SELLING the product; support usually continues for a while","for":0},{"t":"Vendor stops SUPPORTING it — no parts, no patches, no help","for":1},{"t":"The period in which the vendor repairs or replaces hardware for free","for":2},{"t":"The unique inventory label physically stuck on the device","for":3},{"t":"The planned schedule to replace aging hardware before it fails","for":4}],"hint":"EOL = sales stop. EOSL = support stop — that is the cliff.","expl":"\u003cb\u003eEOL\u003c/b\u003e means you can no longer buy it, but patches and parts continue. \u003cb\u003eEOSL\u003c/b\u003e is the cliff: no support at all, so running past it is unowned risk — the exact mistake with the firewall. \u003cb\u003eWarranty\u003c/b\u003e is the free-repair window you prove from the inventory record. The \u003cb\u003easset tag\u003c/b\u003e ties the physical box to its inventory row. A sane \u003cb\u003erefresh cycle\u003c/b\u003e replaces gear comfortably before EOSL."},{"id":"m29","theme":"Assets & Lifecycle","type":"dual","points":2,"scenario":"SW-5 failed at 08:40 and was replaced under RMA by 11:00. Same model, same ports, new serial number. You look at the change once as the network engineer who must keep records true, and once as the auditor who will sample this change next month.","question":"Answer from BOTH perspectives.","parts":[{"label":"NETWORK ENGINEER — Which record must change first?","choices":["The asset inventory — the old serial must be swapped for the new one","The cable map — all of the patch port labels are now wrong","The heat map — the AP coverage pattern shifted with the swap","The SLA — the provider's uptime tier was reset by the RMA"],"correct":0},{"label":"AUDITOR — What must the record prove after the swap?","choices":["Continuity — same warranty and location under the new serial","That the switch now forwards packets noticeably faster","That the VLAN names were quietly changed during the swap","That the provider paid a credit for the outage window"],"correct":0}],"hint":"Same model, same ports — what is the only thing that actually changed? Identity.","expl":"Same model and same ports mean the cable map, rack diagram and logical diagram do not move. The \u003cb\u003eserial number\u003c/b\u003e is the device's identity: inventory, warranty, CMDB and audits all key on it, so it gets updated the same day. The record must then prove \u003cb\u003econtinuity\u003c/b\u003e — new serial, unchanged warranty and location — so the next RMA or audit reconciles without a mystery."},{"id":"m30","theme":"Assets & Lifecycle","type":"order","points":3,"scenario":"Last night's change window touched five things at once. Policy sets hard deadlines: IPAM edits for the temporary DHCP range must land before Friday's change freeze (\u003cb\u003e5 days\u003c/b\u003e); SLA credit claims must be filed within \u003cb\u003e14 days\u003c/b\u003e of the incident; rack diagram updates are due within \u003cb\u003e30 days\u003c/b\u003e; replaced-switch serials must be in the inventory within \u003cb\u003e60 days\u003c/b\u003e (the audit date); the moved AP re-survey is due within \u003cb\u003e90 days\u003c/b\u003e.","question":"Rank the tasks by deadline — soonest first at the top.","rank":true,"steps":["Reconcile IPAM with the temporary DHCP range (5 days)","File the SLA credit claim for last month's outage (14 days)","Update the rack diagram after the PDU swap (30 days)","Enter the replaced switch serials in the inventory (60 days)","Book the re-survey for the moved AP (90 days)"],"hint":"Pure calendar math: order the five deadlines.","expl":"Rank by deadline: \u003cb\u003e5 → 14 → 30 → 60 → 90 days\u003c/b\u003e. The two deadlines people miss in real life are SLA credit claims (providers love to let them lapse) and change freezes (an edit that misses Friday waits weeks). Good documentation hygiene is really calendar management: every record change gets a due date."}]};
/* CyberPulseAcademy exam engine — framework part A */
'use strict';
var EX = window.EXAM;
var EXBY = {};
EX.exercises.forEach(function(e){ EXBY[e.id] = e; });
var THEMES = [];
EX.keywords.forEach(function(k){ THEMES.push(k.theme); });

function $(s,r){ return (r||document).querySelector(s); }
function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(tag,cls,html){ var d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function fmtT(s){ s=Math.max(0,s); var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
function fmtP(n){ return (Math.round(n*10)/10).toString(); }
function normInp(v){ return String(v==null?'':v).replace(/\[\.\]/g,'.').toLowerCase().replace(/\s+/g,' ').trim(); }
function fx1(n){ return Math.round(n*10)/10; }

var S = null;
function newState(){
  var order = shuffle(EX.exercises.map(function(e){ return e.id; }));
  var by = {};
  order.forEach(function(id){
    var ex = EXBY[id];
    by[id] = { ex: ex, pres: makePres(ex), ans: null, checked:false, skipped:false,
               earned:0, grad:null, hintUsed:false, revising:false };
    initAns(by[id]);
  });
  return { order: order, pos:0, by: by, remaining: EX.meta.estimatedMinutes*60,
           manual:false, checkp:false, finished:false, reported:false,
           username:'', country:'', started:true };
}
function makePres(ex){
  var p = {};
  if(ex.type==='qcm'||ex.type==='multi'){ p.order = shuffle(ex.choices.map(function(_,i){return i;})); }
  if(ex.type==='spot'){ p.order = shuffle(ex.lines.map(function(_,i){return i;})); }
  if(ex.type==='multi'||ex.type==='qcm'){ p.order = shuffle(ex.choices.map(function(_,i){return i;})); }
  if(ex.type==='buckets'){ p.items = shuffle(ex.items.map(function(it,i){ return {t:it.t, b:it.b, i:i}; })); }
  if(ex.type==='match'){ p.chips = shuffle(ex.right.map(function(r,i){ return {t:r.t, for:r.for, i:i}; })); }
  if(ex.type==='order'){ p.seq = shuffle(ex.steps.map(function(_,i){return i;})); }
  if(ex.type==='fill'){ p.bank = shuffle(ex.bank); }
  if(ex.type==='queue'){ p.rows = ex.rows.map(function(r){ var idx = shuffle(r.choices.map(function(_,i){return i;})); return {label:r.label, order:idx, correct:idx.indexOf(r.correct)}; }); }
  if(ex.type==='dual'){ p.parts = ex.parts.map(function(pt){ return {label:pt.label, order:shuffle(pt.choices.map(function(_,i){return i;})), correct:pt.correct}; }); }
  if(ex.type==='branch'){ var no={}; Object.keys(ex.tree.nodes).forEach(function(nid){ var n=ex.tree.nodes[nid]; if(n.opts) no[nid]=shuffle(n.opts.map(function(_,i){return i;})); }); p.nodeOpts=no; }
  return p;
}

/* ---------- scoring helpers ---------- */
function answeredCount(){ var n=0; S.order.forEach(function(id){ if(S.by[id].checked) n++; }); return n; }

/* ---------- INTRO ---------- */
function renderIntro(){
  var root = $('#app');
  var kw = EX.keywords.map(function(k){
    return '<div class="kwcard"><h4>'+esc(k.theme)+'</h4><div class="kws">'+k.items.map(function(w){return '<span class="kw">'+esc(w)+'</span>';}).join('')+'</div></div>';
  }).join('');
  var types = [];
  var seen = {};
  EX.exercises.forEach(function(e){ if(!seen[e.type]){ seen[e.type]=1; types.push(TYPE_LABEL[e.type]||e.type); } });
  var sevBadge = EX.meta.difficulty==='medium' ? '<span class="badge med">MEDIUM severity</span>' : '<span class="badge hard">HARD severity</span>';
