<script>
var EX=
/* ============ 2.2 Switching Technologies — HARD — exercise data ============ */
[
{t:'multi', th:'vlan', short:'Hopping preconditions',
 k:['VLAN hopping (double tagging)','native VLAN','trunk port','802.1Q tagging'],
 sc:'<p>Incident review. An attacker on a plain access port claims he reached a host in VLAN 20 by sending crafted double-tagged frames. The post-mortem must state the exact preconditions so the fix is provable.</p>',
 q:'<p>Select every condition that must be true for the double-tag attack to work.</p>',
 al:'SELECT ALL THAT APPLY',
 ch:[
  {h:'The native VLAN on the trunk is the default VLAN 1 (or at least a VLAN users can reach)', plain:'Native VLAN reachable by attacker', ok:true},
  {h:'The attacker access port sits in that same native VLAN', plain:'Attacker inside the native VLAN', ok:true},
  {h:'The trunk carries the target VLAN, so the surviving inner tag can be switched onward', plain:'Target VLAN rides the trunk', ok:true},
  {h:'The victim host listens to untagged frames only', plain:'Victim accepts untagged frames only', ok:false},
  {h:'The switch has BPDU guard enabled on all user ports', plain:'BPDU guard enabled everywhere', ok:false}
 ],
 hint:'Follow the two tags: which tag must the first switch strip, and what must remain reachable afterwards?',
 at:'The attack needs: attacker in the (default) native VLAN, that native VLAN untagged on an 802.1Q trunk, and the target VLAN carried by the same trunk. BPDU guard is irrelevant to crafted data frames.',
 ex:'<p>The attacker builds a frame with two tags. The first switch strips the outer tag because it matches the native VLAN, and the second switch believes the inner tag — so the target VLAN must exist on that trunk. The attacker must sit in the native VLAN to craft the outer tag correctly. BPDU guard watches control frames, not data frames, so it changes nothing here.</p>'},

{t:'fill', th:'vlan', short:'Native VLAN mismatch',
 k:['native VLAN','trunk port','802.1Q tagging','CDP'],
 sc:'<p>Users on the second floor report that some printers respond and others do not. The logs show one CDP complaint. Both trunk configs and the log are in the artifact; filter it.</p>',
 q:'<p>Fill every blank strictly from the artifacts.</p>',
 al:'TYPE INTO THE BLANKS',
 art:{label:'Configs + log', lines:[
 '--- SW1 ---',
 'interface gi1/0/24',
 ' switchport mode trunk',
 ' switchport trunk allowed vlan 10,20',
 ' (no native vlan line — default applies)',
 '--- SW2 ---',
 'interface gi1/0/24',
 ' switchport mode trunk',
 ' switchport trunk allowed vlan 10,20',
 ' switchport trunk native vlan 99',
 '--- log ---',
 '%CDP-4-NATIVE_VLAN_MISMATCH: native VLAN mismatch discovered on Gi1/0/24 (1), with SW2 Gi1/0/24 (99).'
 ]},
 parts:['SW1 sends its untagged frames for VLAN ', {a:['1']}, ', while SW2 places the same untagged frames into VLAN ', {a:['99']}, '. Untagged traffic can therefore land in a different VLAN on each side, which explains the unreachable printers. The fix is to configure the ', {a:['same','matching','identical']}, ' native VLAN number on both ends of the trunk.'],
 bank:['1','99','same','different','10','tagged'],
 hint:'No native vlan line means the default applies. Compare the two ends line by line.',
 at:'1 · 99 · same',
 ex:'<p>SW1 never sets a native VLAN, so its untagged frames belong to VLAN 1. SW2 expects native VLAN 99. Every untagged frame crossing this trunk is filed under a different VLAN per side — silent breakage that CDP does flag. The rule stands: one native VLAN number, both ends, always.</p>'},

{t:'fill', th:'vlan', short:'Pruned by the allowed list',
 k:['allowed VLAN list','trunk port','VLAN'],
 sc:'<p>VLAN 30 (CLIENTS) exists on both access switches. Users in VLAN 30 on SW-B cannot reach the VLAN 30 server on SW-A, while VLAN 10 and 20 users are fine. The artifacts hold both trunk configs and the VLAN table.</p>',
 q:'<p>Complete the finding for the change ticket.</p>',
 al:'TYPE INTO THE BLANKS',
 art:{label:'Trunk config + VLAN table', lines:[
 '--- SW-A uplink ---',
 'interface gi1/0/1',
 ' switchport mode trunk',
 ' switchport trunk allowed vlan 10,20',
 '--- SW-B uplink ---',
 'interface gi1/0/1',
 ' switchport mode trunk',
 ' switchport trunk allowed vlan 10,20',
 '--- show vlan brief (SW-B) ---',
 '10   IT        active  Gi1/0/2-10',
 '20   PRINT     active  Gi1/0/11-16',
 '30   CLIENTS   active  Gi1/0/17-24'
 ]},
 parts:['The trunk carries only VLANs ', {a:['10']}, ' and ', {a:['20']}, '. Every other VLAN, including 30, is ', {a:['pruned','excluded','filtered']}, ' from the trunk, so VLAN 30 frames never cross between the switches. The fix is to add VLAN 30 to the ', {a:['allowed','trunk','permit']}, ' list on both ends of the uplink.'],
 bank:['10','20','pruned','allowed','native','1'],
 hint:'The allowed list is a whitelist. Ask whether 30 is on it.',
 at:'10 · 20 · pruned · allowed',
 ex:'<p>A trunk allowed list is a whitelist: if the VLAN is not on it, the frames do not cross, no matter how healthy the VLAN looks locally. VLAN 30 is active on both switches but absent from both allowed lists. Both ends need the update — pruning one side only still stops the traffic.</p>'},

{t:'qcm', multi:false, th:'vlan', short:'The DTP fix that keeps the trunk',
 k:['DTP','switchport nonegotiate','switchport mode','trunk port'],
 sc:'<p>Pentest finding: an attacker used DTP frames to negotiate a trunk on an access switch. The core uplink on the same switch must keep working exactly as it does today — it is already a manually configured trunk. You may change exactly one thing per port, and the core trunk must not flap.</p>',
 q:'<p>Which single change satisfies both the finding and the constraint?</p>',
 al:'CHOOSE ONE',
 ch:[
  {h:'User ports: switchport mode access. Core uplink: switchport nonegotiate', plain:'Access on user ports; nonegotiate on the trunk', ok:true},
  {h:'Core uplink: switchport mode dynamic desirable with nonegotiate', plain:'desirable + nonegotiate on uplink', ok:false},
  {h:'User ports: switchport nonegotiate, leaving the mode at dynamic auto', plain:'nonegotiate with dynamic auto on user ports', ok:false},
  {h:'Globally disable DTP so every port on the switch stops negotiating', plain:'Globally disable DTP', ok:false}
 ],
 hint:'User ports must never trunk; the uplink must trunk forever but never negotiate again.',
 at:'User ports forced to access; the existing trunk gets nonegotiate so DTP frames stop while the trunk stays up.',
 ex:'<p>Forcing user ports to access removes the attacker surface. The uplink already trunks manually, so switchport nonegotiate silences DTP without touching the trunk state — the link does not flap. Desirable renegotiates rather than pins, nonegotiate alone does not stop an auto port from becoming a trunk target, and there is no global DTP kill switch that leaves a static trunk healthy.</p>'},

{t:'multi', th:'vlan', short:'Router-on-a-stick outage',
 k:['inter-VLAN routing','router-on-a-stick','subinterface','802.1Q tagging'],
 sc:'<p>After a router reload, PCs in VLAN 20 cannot reach the server in VLAN 10. VLAN 10 works fine. The router config is in the artifact; the switch trunk is verified healthy and carries VLANs 10 and 20.</p>',
 q:'<p>Select every statement that correctly explains the outage or its repair.</p>',
 al:'SELECT ALL THAT APPLY',
 art:{label:'Router config', lines:[
 'interface GigabitEthernet0/0',
 ' no shutdown',
 'interface GigabitEthernet0/0.10',
 ' encapsulation dot1q 10',
 ' ip address 10[.]0[.]10[.]1 255[.]255[.]255[.]0',
 'interface GigabitEthernet0/0.20',
 ' ip address 10[.]0[.]20[.]1 255[.]255[.]255[.]0'
 ]},
 ch:[
  {h:'Subinterface .20 has no encapsulation dot1q 20 line, so it cannot read VLAN 20 frames', plain:'.20 missing encapsulation dot1q', ok:true},
  {h:'PCs in VLAN 20 must use 10[.]0[.]20[.]1 as their default gateway', plain:'Gateway = subinterface IP', ok:true},
  {h:'VLAN 20 must also be created on the router with the vlan command', plain:'Create VLAN 20 on router', ok:false},
  {h:'The switch trunk toward the router must carry VLANs 10 and 20', plain:'Trunk carries both VLANs', ok:true},
  {h:'Both subinterfaces can safely share one IP address', plain:'Subinterfaces share one IP', ok:false}
 ],
 hint:'One line is missing under .20. Then check what each host needs to know and what a router does or does not own.',
 at:'.20 lacks encapsulation dot1q 20 (fatal); VLAN 20 PCs must gateway to 10[.]0[.]20[.]1; the trunk must carry both VLANs. Routers hold no VLAN database, and two subinterfaces can never share an IP.',
 ex:'<p>A subinterface without encapsulation dot1q cannot match a VLAN number, so it never sees the untagged-for-20 traffic arriving on the trunk — that is the outage. The PCs must point at their own subinterface IP as gateway. VLANs live in the switch database, not the router, and each routed interface needs a unique address.</p>'},

{t:'spot', multi:false, th:'vlan', short:'Why the SVI is down',
 k:['SVI','Layer 3 switch','inter-VLAN routing'],
 sc:'<p>The SVI for VLAN 50 reports down/down, so 40 clients have no gateway. show vlan brief lists VLAN 50 as active with several connected, up ports. Something in the SVI block itself is wrong.</p>',
 q:'<p>Click the ONE line that explains the down/down state.</p>',
 al:'CLICK THE FAULTY LINE',
 lines:['interface vlan 50',' description CLIENTS-L3',' ip address 10[.]50[.]0[.]1 255[.]255[.]255[.]0',' no ip redirects',' shutdown'],
 wrong:[4],
 hint:'down/down is not down/down for no reason — read every line, including the last one.',
 at:'shutdown — the SVI is administratively down; no shutdown restores the gateway for VLAN 50.',
 ex:'<p>An SVI needs two things: VLAN 50 active with at least one up member port, and the SVI itself not shut down. The VLAN and its ports are healthy here, so the shutdown line is the whole story. One no shutdown brings 40 gateways back.</p>'},

{t:'term', th:'vlan', short:'Terminal: harden the uplink',
 k:['switchport nonegotiate','trunk port','allowed VLAN list','switchport mode'],
 sc:'<p>Staging console, Switch(config)#. The goal, in operational terms: port Gi1/0/24 must become a fixed trunk that carries only VLANs 10 and 20; the neighbor must never be able to negotiate its role; and the finished trunk must be proven. You choose the tool and the flags.</p>',
 q:'<p>Type the full command sequence that achieves the goal, then the command that proves it.</p>',
 al:'TYPE THE COMMANDS',
 host:'Switch', prompt:'Switch(config)#',
 acc:[
  ['^interface (gi|gigabitethernet) ?1/0/24$','^int (gi|gigabitethernet) ?1/0/24$'],
  ['^switchport mode trunk$'],
  ['^switchport trunk allowed vlan 10(,| )20$','^switchport trunk allowed vlan 10,20$'],
  ['^switchport nonegotiate$'],
  ['^show interfaces? trunk$','^show int trunk$','^sh int trunk$','^sh interfaces trunk$']
 ],
 accOut:[
  ['(now configuring Gi1/0/24)'],
  ['(port pinned to trunk mode — no negotiation possible)'],
  ['(allowed list pruned to 10,20)'],
  ['(DTP frames silenced on this port)'],
  ['Port        Mode  Encapsulation  Status    Native vlan',
   'Gi1/0/24    on    802.1q         trunking  1',
   'Port        Vlans allowed on trunk',
   'Gi1/0/24    10,20']
 ],
 hint:'Four configuration steps (enter the port, pin the mode, prune the list, silence negotiation) plus one verification command.',
 at:'interface gi1/0/24 · switchport mode trunk · switchport trunk allowed vlan 10,20 · switchport nonegotiate · show interfaces trunk',
 ex:'<p>The sequence pins the role (mode trunk), shrinks the surface (allowed list 10,20), removes negotiation entirely (nonegotiate), and proves the result (show interfaces trunk: mode on, trunking, list 10,20). Any order of the four config steps works; the proof comes last.</p>'},

{t:'cat', th:'vlan', short:'Phone port: two VLANs',
 k:['voice VLAN','access port','802.1Q tagging','CDP'],
 sc:'<p>A rollout guide for IP phones must state exactly which setting belongs to which traffic class. One port, one phone, one PC behind the phone.</p>',
 q:'<p>Drag each statement to the VLAN it belongs to.</p>',
 al:'DRAG INTO BUCKETS',
 buckets:['Data VLAN (access side)','Voice VLAN (tagged side)'],
 items:[
  {h:'switchport access vlan 10', plain:'access vlan 10', b:0},
  {h:'untagged frames coming from the PC', plain:'untagged PC frames', b:0},
  {h:'switchport voice vlan 15', plain:'voice vlan 15', b:1},
  {h:'802.1Q-tagged frames from the phone (VLAN 15)', plain:'phone frames tagged VLAN 15', b:1},
  {h:'CDP tells the phone which VLAN ID to tag with', plain:'CDP announces voice VLAN to phone', b:1}
 ],
 hint:'Untagged always means the access VLAN. Anything the phone does with tags belongs to the voice side.',
 at:'Data: access vlan 10, untagged PC frames. Voice: voice vlan 15, phone-tagged frames, CDP voice-VLAN advertisement.',
 ex:'<p>One physical port runs two logical camps: untagged traffic always lands in the access VLAN, while the phone tags its own frames with the voice VLAN it learns through CDP. The voice vlan command reserves that second VLAN for the tagged side only.</p>'},
{t:'multi', th:'intf', short:'Counter forensics',
 k:['duplex mismatch','late collisions','CRC errors','autonegotiation'],
 sc:'<p>Gi1/0/5 (switch side, forced 100/full) feeds a wall port to a PC whose NIC is set to auto. The switch port counts 14,208 CRC and 9,900 alignment errors; the PC side log shows late collisions climbing. Copies across the link crawl.</p>',
 q:'<p>Select every statement that is true.</p>',
 al:'SELECT ALL THAT APPLY',
 ch:[
  {h:'The half-duplex side (the PC) is the one counting late collisions', plain:'Half side counts late collisions', ok:true},
  {h:'The full-duplex side (the switch port) is the one counting CRC and alignment errors', plain:'Full side counts CRC/alignment', ok:true},
  {h:'The fix is to configure both ends identically, or set both to auto', plain:'Match both ends or use auto', ok:true},
  {h:'Output drops on the port prove the duplex mismatch', plain:'Drops prove the mismatch', ok:false},
  {h:'CRC errors always mean a broken cable, never a duplex problem', plain:'CRC = cable only', ok:false}
 ],
 hint:'Each side records the damage the other side causes. Then separate congestion counters from duplex counters.',
 at:'Half side: late collisions. Full side: CRC and alignment errors. Fix: match both ends. Drops are congestion, and CRC has two usual suspects: cable or duplex.',
 ex:'<p>In a mismatch, each end transmits whenever it likes, so the half-duplex side collides late and the full-duplex side receives corrupted bits — hence late collisions on one side and CRC or alignment errors on the other. Output drops belong to buffer congestion, not duplex. CRC errors point at cabling or a mismatch, which is why both ends get checked.</p>'},

{t:'order', th:'intf', short:'PoE budget triage',
 k:['PoE power budget','PoE++ 802.3bt','PoE+ 802.3at'],
 sc:'<p>A 740 W budget switch currently draws 610 W. Tonight two 802.3bt PTZ cameras (51 W each) must land on it; at class-based draw the budget would be exceeded and ports start denying power at boot. Rank your working order.</p>',
 q:'<p>Drag the steps into the order you would perform them.</p>',
 al:'RANK FIRST TO LAST',
 items:[
  {h:'Add up the real draw: every device class in watts, plus the two new cameras (712 W total)', plain:'Sum the real draw (712 W)'},
  {h:'Flag which devices pushed the budget over and which of those are non-critical', plain:'Flag the over-budget devices'},
  {h:'Move the two 51 W PTZ cameras to dedicated injectors or a second switch', plain:'Move the PTZ cameras off'},
  {h:'Re-check the remaining headroom and document the final per-port draw', plain:'Re-check and document'}
 ],
 hint:'Measure first, decide second, move third, prove fourth.',
 at:'Sum the real draw (712 W) → flag the over-budget devices → move the high-draw cameras → re-check headroom and document.',
 ex:'<p>PoE incidents are arithmetic first: 610 W current plus 102 W of cameras is 712 W against 740 W of budget — under, but with class surges at boot the ports can still be denied. The professional order is measure, identify the drivers, relocate the heaviest non-critical loads, then prove the numbers and write them down.</p>'},

{t:'qcm', multi:false, th:'stp', short:'Root by MAC accident',
 k:['root bridge','bridge priority','convergence'],
 sc:'<p>Audit finding: every switch runs default priority 32768. MAC addresses: SW-Core 0000.5e00.539a; SW-A (access switch, floor 1 closet) 0000.5e00.5307; SW-B 0000.5e00.53f1.</p>',
 q:'<p>Who is the root bridge today, and what is the best fix?</p>',
 al:'CHOOSE ONE',
 ch:[
  {h:'SW-Core wins because it is the core; nothing needs changing', plain:'Core wins by role', ok:false},
  {h:'SW-B wins on its MAC; raise its priority to 61440 to fix it', plain:'SW-B root; raise its priority', ok:false},
  {h:'SW-A wins on the lowest MAC; give SW-Core priority 4096 to fix it', plain:'SW-A root; set core priority 4096', ok:true},
  {h:'All priorities tie, so the election fails and the network has no root', plain:'Election fails', ok:false}
 ],
 hint:'When every priority is equal, the smallest MAC address wins the crown.',
 at:'SW-A (lowest MAC ...07) is root; the durable fix is a deliberately lower priority (4096) on SW-Core.',
 ex:'<p>With all priorities tied, the tiebreak is the lowest MAC address — and that is an access switch in a closet, the worst possible root. Root placement steers every path in the network, so the core must win by configuration: a lower priority such as 4096. Elections never fail, and the durable fix is to let the intended root win by configuration instead of trusting MAC order.</p>'},

{t:'order', th:'stp', short:'Root port tiebreak ladder',
 k:['root port','path cost','BPDU','convergence'],
 sc:'<p>You are proving to an auditor why SW4 uses its direct 1 Gbps link (cost 4) to the root rather than the two-hop path via SW3 (19 + 2 = 21) — and what would decide the matter if costs ever tied. STP climbs a fixed ladder.</p>',
 q:'<p>Order the comparison steps a switch walks when choosing its root port.</p>',
 al:'DRAG TO ORDER',
 items:[
  {h:'Lowest root path cost wins', plain:'Lowest root path cost'},
  {h:'Costs equal? Lowest sender bridge ID wins', plain:'Lowest sender bridge ID'},
  {h:'Same sender on both? Lowest sender port ID wins', plain:'Lowest sender port ID'}
 ],
 hint:'Three rungs: what the path costs, who advertised it, through which port.',
 at:'Lowest root path cost → lowest sender bridge ID → lowest sender port ID.',
 ex:'<p>The root port decision is deterministic: first the accumulated cost to the root, then the bridge ID of the advertising neighbor, then the neighbor port number. In this case cost 4 beats 21 at the first rung, so the ladder never needs the deeper rungs — but the audit record now shows the full tiebreak order.</p>'},

{t:'multi', th:'stp', short:'RSTP roles decoded',
 k:['RSTP 802.1w','alternate port','backup port','port states'],
 sc:'<p>After an RSTP migration, show spanning-tree lists port roles that 802.1D never had. The NOC wiki needs the two new roles explained without folklore.</p>',
 q:'<p>Select every statement that is true for RSTP.</p>',
 al:'SELECT ALL THAT APPLY',
 ch:[
  {h:'An alternate port is a discarded path to the root — a hot standby for the root port', plain:'Alternate = hot standby to root', ok:true},
  {h:'A backup port is a second port into the same shared segment, typically via a hub', plain:'Backup = second port, same segment', ok:true},
  {h:'Alternate and backup replace the old blocking state and can reach forwarding quickly', plain:'They replace blocking, fast to forward', ok:true},
  {h:'RSTP keeps the listening state from 802.1D', plain:'RSTP keeps listening', ok:false},
  {h:'Two parallel cables to two different neighbor switches create a backup port', plain:'Parallel to two switches = backup', ok:false}
 ],
 hint:'Alternate = another road home. Backup = the same road twice. And count the states RSTP actually has.',
 at:'Alternate = discarded standby path to the root; backup = second port on the same shared segment. Both replace blocking and move fast. RSTP has no listening state; parallel links to different switches give alternates.',
 ex:'<p>RSTP kept only discarding, learning and forwarding — listening is gone. An alternate port is your second-best road to the root, held hot in discard; a backup port exists only when two of your own ports share one segment (the hub case). Two cables to two different switches give two roads to the root — those are alternates.</p>'},

{t:'cat', th:'stp', short:'Version feature sort',
 k:['STP 802.1D','RSTP 802.1w','MSTP 802.1s','PVST+'],
 sc:'<p>Standards training day. Four versions, seven feature cards, four buckets on the wall. The trainer checks every placement.</p>',
 q:'<p>Drag each feature card to the version it describes.</p>',
 al:'DRAG INTO BUCKETS',
 buckets:['802.1D (STP)','802.1w (RSTP)','802.1s (MSTP)','PVST+'],
 items:[
  {h:'The original standard; 30-50 s convergence', plain:'Original, 30-50 s', b:0},
  {h:'One tree for all VLANs; no per-VLAN load sharing', plain:'One tree for all VLANs', b:0},
  {h:'Proposal and agreement handshake; seconds to converge', plain:'Proposal/agreement, seconds', b:1},
  {h:'Port roles: alternate and backup', plain:'Alternate and backup roles', b:1},
  {h:'Maps many VLANs into a few instances inside a region', plain:'Few instances per region', b:2},
  {h:'Region name and revision number must match on all neighbors', plain:'Region name/revision must match', b:2},
  {h:'Cisco proprietary; one instance per VLAN', plain:'Cisco, one tree per VLAN', b:3}
 ],
 hint:'Split the cards first by era: D is the slow original, w is its fast rewrite, s bundles VLANs, PVST+ multiplies trees.',
 at:'802.1D: original 30-50 s, one tree for all VLANs. 802.1w: proposal/agreement, alternate and backup roles. 802.1s: few instances, matching region name and revision. PVST+: Cisco, one instance per VLAN.',
 ex:'<p>The four versions have clean signatures. 802.1D is the slow original with a single tree. 802.1w rebuilt convergence around proposals and added the alternate and backup roles. 802.1s groups VLANs into instances whose region name and revision must match on every neighbor. PVST+ is the Cisco way: one full tree per VLAN.</p>'},

{t:'fill', th:'stp', short:'TCN and the fast path',
 k:['TCN','CAM / MAC table','RSTP 802.1w','convergence'],
 sc:'<p>After RSTP moved a port to forwarding in under a second, the NOC asks two questions: why did address tables everywhere seem to reset, and how did the port skip the classic waits?</p>',
 q:'<p>Complete the two-paragraph answer.</p>',
 al:'TYPE INTO THE BLANKS',
 parts:['When a port changes state, RSTP floods a ', {a:['tcn','topology change notification','tc']}, ' through the network, and every switch shortens the aging time of its ', {a:['cam','mac','cam/mac','mac address']}, ' table so stale entries are relearned at once. RSTP replaces the slow 802.1D timers with a proposal and ', {a:['agreement','ack','acknowledgement']}, ' handshake on point-to-point links, which is how ports reach forwarding in moments.'],
 bank:['TCN','ARP','CAM','agreement','broadcast','negotiation'],
 hint:'The notification, the table, and the two-word handshake.',
 at:'TCN · CAM/MAC table · agreement',
 ex:'<p>A topology change notification tells every switch to age out MAC entries faster, so traffic re-learns the new paths immediately instead of forwarding to dead ports. The speed itself comes from the proposal and agreement handshake between point-to-point neighbors — RSTP negotiates forwarding instead of waiting timers out.</p>'},

{t:'match', th:'stp', short:'Guards and their triggers',
 k:['BPDU guard','root guard','PortFast','err-disabled'],
 sc:'<p>Hardening review. Four STP protections sit half-configured on the access switches. The reviewer wants each one matched to its exact trigger and behaviour — no folklore.</p>',
 q:'<p>Match each term to its precise behaviour.</p>',
 al:'MATCH PAIRS',
 pairs:[
  {l:'BPDU guard', r:'Err-disables a PortFast port that receives any BPDU'},
  {l:'Root guard', r:'Blocks a port that hears superior BPDUs; recovers by itself when they stop'},
  {l:'PortFast', r:'Moves a single-host access port straight into forwarding'},
  {l:'err-disabled state', r:'Administrative shutdown after a violation; recover with shutdown, no shutdown'}
 ],
 hint:'Two guards, one accelerator, one punishment. Only one of them heals without an admin.',
 at:'BPDU guard: any BPDU on a PortFast port = err-disable. Root guard: superior BPDU = blocked, self-recovers. PortFast: instant forwarding for single hosts. err-disabled: shut until manually or timed recovery.',
 ex:'<p>BPDU guard punishes any BPDU on an edge port by shutting it. Root guard only blocks ports that advertise a better root, and it unblocks automatically once the superior BPDUs disappear — the gentlest of the two guards. PortFast is the accelerator for single-host ports, and err-disabled is the state you must consciously recover with shutdown/no shutdown or a timer.</p>'},
{t:'spot', th:'stp', short:'Loop waiting to happen',
 k:['PortFast','trunk port','native VLAN','redundant links'],
 sc:'<p>Pre-deployment review of SW-FLOOR3 before it joins the production ring. The core uplink uses native VLAN 99; user ports must be locked down; the inter-floor uplink to SW-FLOOR4 is a planned trunk. Several lines in the staging config would cause an outage or a security hole.</p>',
 q:'<p>Click EVERY line that is a fault. Some lines are fine.</p>',
 al:'CLICK THE FAULTY LINES',
 lines:['hostname SW-FLOOR3',' vlan 30','  name MARKETING',' interface gi1/0/1','  description UPLINK-CORE','  switchport mode trunk','  switchport trunk native vlan 99','  switchport nonegotiate',' interface gi1/0/2','  description USER-02','  switchport mode dynamic auto','  switchport access vlan 30','  spanning-tree portfast',' interface gi1/0/24','  description UPLINK-FLOOR4','  switchport mode dynamic desirable','  switchport trunk native vlan 1'],
 wrong:[10,15,16],
 hint:'One line leaves a user port negotiable, one leaves an uplink negotiable, one breaks the native VLAN agreement with the core.',
 at:'User port on dynamic auto (must be access), inter-floor uplink on dynamic desirable (must be fixed trunk, ideally nonegotiate), uplink native VLAN 1 while the core side uses 99 (mismatch).',
 ex:'<p>Three faults: the user port can be talked into trunking because dynamic auto answers negotiators — force access mode. The inter-floor uplink relies on negotiation and stays re-negotiable — pin it to trunk. And its native VLAN 1 disagrees with the core standard of 99, the classic silent mismatch. The trunk settings on gi1/0/1 (fixed trunk, native 99, nonegotiate) are exactly what the other two links should copy.</p>'},

{t:'term', multi:false, th:'stp', short:'Terminal: prove the root',
 k:['root bridge','root port','STP 802.1D','convergence'],

{t:'fill', th:'mtu', short:'PMTUD black hole',
 k:['PMTUD','DF bit','fragmentation','MTU mismatch'],
 sc:'<p>A VPN path with a 1400-byte MTU sits between two sites. Sessions that carry big payloads hang forever, while small ones pass. You suspect a PMTUD failure behind a firewall.</p>',
 q:'<p>Complete the post-mortem paragraph.</p>',
 al:'TYPE INTO THE BLANKS',
 parts:['A host sends packets with the ', {a:['df','dont fragment','do not fragment']}, ' bit set, so routers cannot cut them apart. When a router meets a smaller link, it must return an ICMP ', {a:['frag-needed','fragmentation needed','frag needed']}, ' message so the sender can shrink its packets. If a firewall drops that message, the sender never learns the smaller MTU and the session stalls — the PMTUD ', {a:['black','black hole','blind']}, ' hole.'],
 bank:['DF','frag-needed','black','unreachable','9000','silent'],
 hint:'One flag that forbids cutting, one ICMP message that reports the limit, one word for the hole.',
 at:'DF bit · ICMP fragmentation-needed · black hole',
 ex:'<p>Path MTU Discovery works like sonar: the sender forbids fragmentation (DF bit) and waits for routers to complain with ICMP fragmentation-needed when a link is too small. If a firewall swallows the complaint, the sender keeps retransmitting full-size packets into the void — sessions hang for no visible reason. The fix is to permit that ICMP type or clamp the TCP MSS.</p>'},

{t:'qcm', multi:false, th:'mtu', short:'Overhead economics',
 k:['jumbo frames (9000)','MTU','1500 bytes'],
 sc:'<p>Documentation: every Ethernet frame carries fixed layer 2 overhead — 14 bytes of header plus 4 bytes of FCS, and 4 more bytes across an 802.1Q trunk. Jumbo frames raise the payload from 1500 to 9000 bytes.</p>',
 q:'<p>What happens to that fixed per-frame overhead with jumbo frames?</p>',
 al:'CHOOSE ONE',
 ch:[
  {h:'It grows six times as well, cancelling the entire benefit', plain:'Overhead grows sixfold', ok:false},
  {h:'It stays fixed per frame, so bigger payloads raise efficiency', plain:'Fixed overhead, rising efficiency', ok:true},
  {h:'It disappears entirely on trunk links between switches', plain:'Overhead vanishes on trunks', ok:false},
  {h:'It moves out of the frame into the IP header instead', plain:'Overhead moves to IP', ok:false}
 ],
 hint:'The header does not grow with the cargo.',
 at:'The overhead is fixed per frame; a 9000-byte payload pays the same 18-22 bytes as a 1500-byte one, so efficiency rises.',
 ex:'<p>Frame overhead is a fixed tax per frame: 18 bytes on ordinary Ethernet, 22 across a tagged trunk. Send the tax once per 9000 bytes instead of once per 1500, and the share of wire time spent on headers falls — that is the whole economic argument for jumbo frames in storage networks.</p>'},

  {h:'Small frames between the same hosts keep flowing — size decides everything', plain:'Small frames still flow', ok:true},
  {h:'The switch fragments the big frames to fit the 1500-byte ports', plain:'Switch fragments big frames', ok:false},

'use strict';
/* ================= Exam engine (shared by both severity files) ================= */
var CFG = { topic:'network-plus', pass:70, dur:window.EXAM_CFG.dur, durmin:window.EXAM_CFG.durmin,
            sev:window.EXAM_CFG.sev, sevtxt:window.EXAM_CFG.sevtxt };
var THEMES = [
  {id:'vlan', n:'VLANs & Trunking'},
  {id:'intf', n:'Interface Configuration'},
  {id:'stp',  n:'Spanning Tree'},
  {id:'mtu',  n:'MTU & Frames'}
];
var PT = 10; /* points per exercise */
var USER = '';
var S = null;
var TICK = null;

function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/^ | $/g,''); }
function fmtT(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function curIdx(){ return S.ord[S.cur]; }
function curEx(){ return EX[curIdx()]; }

/* ================= exam lifecycle ================= */
function startExam(){
  var n = EX.length;
  S = { ord: shuffle(EX.map(function(_,i){return i;})), cur:0,
        sav:{}, res:{}, skipped:{}, hint:{}, disp:{},
        tleft:CFG.dur, tick:null, manP:false, chkP:false, done:false, reported:false };
  S.ord.forEach(function(i){
    var e = EX[i]; var d = { };
    if(e.t==='qcm' || e.t==='multi'){ d.ch = shuffle(e.ch.map(function(_,k){return k;})); }
    if(e.t==='order'){ d.ord = shuffle(e.items.map(function(_,k){return k;})); }
    if(e.t==='match'){ d.l = shuffle(e.pairs.map(function(_,k){return k;})); d.r = shuffle(e.pairs.map(function(_,k){return k;})); }
    if(e.t==='cat'){ d.it = shuffle(e.items.map(function(_,k){return k;})); }
    if(e.t==='fill'){ d.bank = shuffle(e.bank.slice()); }
    S.disp[i] = d;
    S.sav[i] = blankAns(e);
  });
  updScore(); renderNav(); show(0);
  if(!TICK){ TICK = setInterval(tick, 1000); }
  updTimer();
}
function blankAns(e){
  var v = {};
  if(e.t==='qcm'){ v.sel = null; }
  if(e.t==='multi'){ v.sel = []; }
  if(e.t==='order'){ v.ord = null; }
  if(e.t==='match'){ v.map = {}; v.selL = null; }
  if(e.t==='cat'){ v.put = {}; v.selI = null; }
  if(e.t==='fill'){ v.txt = []; }
  if(e.t==='spot'){ v.lines = {}; }
  if(e.t==='term'){ v.acc = {}; v.hist = []; }
  if(e.t==='branch'){ v.step = 0; v.chosen = []; }
  return v;
}

/* ================= timer ================= */
function tick(){
  if(!S || S.done) return;
  if(S.manP || S.chkP) return;
  S.tleft--;
  if(S.tleft<=0){ S.tleft=0; updTimer(); finishExam(true); return; }
  updTimer();
}
function updTimer(){
  var t = $('tleft'); if(!t || !S) return;
  t.textContent = fmtT(S.tleft);
  $('timerChip').classList.toggle('urgent', S.tleft <= Math.round(CFG.dur*0.1));
  $('pauseBtn').disabled = S.done || !$('view').querySelector('.qwrap');
}
function setManP(on){
  S.manP = on;
  $('pauseBtn').textContent = on ? '▶ Resume' : '⏸ Pause';
  $('pauseBtn').setAttribute('aria-pressed', on ? 'true':'false');
  applyPause(); updBanner();
}
function setChkP(on){ S.chkP = on; applyPause(); updBanner(); }
function applyPause(){
  var w = $('view').querySelector('.qwrap'); if(!w) return;
  var old = $('view').querySelector('.veil'); if(old) old.remove();
  if(S.manP){
    var v = el('div','veil');
    v.innerHTML = '<div class="vi" aria-hidden="true">⏸</div><div class="vt">Paused (manual)</div>'+
      '<div class="vs">The exercise is hidden so it cannot be studied. Press Resume to continue.</div>';
    w.appendChild(v);
  }
}
function updBanner(){
  var b = $('pauseBanner');
  var parts = [];
  if(S.manP) parts.push('<span class="bman">Paused (manual) — exercise hidden</span>');
  if(S.chkP) parts.push('<span class="bchk">Timer paused — review mode</span>');
  if(!S.manP && !S.chkP){ b.classList.add('hide'); b.innerHTML=''; return; }
  b.classList.remove('hide');
  b.innerHTML = '⏱ Timer frozen: ' + parts.join(' + ');
}

/* ================= navigation ================= */
function show(i){
  if(S.done) return;
  /* Leaving the reviewed exercise by any route (Next, Prev, Skip, navigator) ends its
     Check-pause. In-place review actions (re-Check, reading the explanation) never resume
     the timer — only moving off the checked exercise does. This keeps review time free
     without letting one Check freeze the clock for the rest of the exam. */
  if(S.chkP) setChkP(false);
  S.cur = Math.max(0, Math.min(EX.length-1, i));
  renderQ(); renderNav(); updBar();
  var vw = $('view'); if(vw && vw.firstElementChild) vw.firstElementChild.scrollIntoView({block:'nearest'});
}
function next(){
  if(S.chkP) setChkP(false);
  if(S.cur >= EX.length-1){ confirmFinish(false); return; }
  show(S.cur+1);
}
function prev(){ show(S.cur-1); }
function doSkip(){
  if(S.done) return;
  var i = curIdx();
  S.skipped[i] = 1;
  if(!S.res[i]) S.res[i] = {sk:1, earned:0};
  if(S.chkP) setChkP(false);
  if(S.cur >= EX.length-1){ confirmFinish(false); return; }
  show(S.cur+1);
}
function doHint(){
  if(S.done) return;
  var i = curIdx(), e = curEx();
  if(S.hint[i] || S.res[i]) return;
  S.hint[i] = 1;
  var hb = $('view').querySelector('.hintarea');
  if(hb){ hb.innerHTML = '<div class="hintbox"><span class="ht">HINT (−10% of this exercise)</span><br>'+e.hint+'</div>'; }
  var btn = $('view').querySelector('.hintBtn'); if(btn) btn.disabled = true;
}
function doRevise(){
  if(S.done) return;
  var i = curIdx();
  delete S.res[i];
  setChkP(false);
  renderQ(); renderNav(); updScore();
}
function doCheck(){
  if(S.done) return;
  var i = curIdx(), e = curEx(), v = S.sav[i];
  var g = grade(e, v, i);
  g.yourAns = ansText(e, v);
  S.res[i] = g;
  if(S.skipped[i]) delete S.skipped[i];
  setChkP(true);
  updScore(); renderQ(); renderNav();
}
function updScore(){
  if(!S) return;
  var sum = 0;
  Object.keys(S.res).forEach(function(k){
    var r = S.res[k];
    if(r && !r.sk) sum += r.earned;
  });
  $('scoreVal').textContent = (Math.round(sum*10)/10).toString();
}
function updBar(){
  if(!S) return;
  $('pfill').style.width = (((S.cur+1)/EX.length)*100).toFixed(1) + '%';
}
function renderNav(){
  var g = $('navgrid'); if(!g) return;
  g.innerHTML = '';
  if(!S) return;
  S.ord.forEach(function(exIdx, pos){
    var b = el('button','nbtn'); b.type='button';
    b.textContent = pos+1;
    var r = S.res[exIdx];
    if(S.skipped[exIdx]) b.classList.add('skip');
    else if(r && !r.sk) b.classList.add('ok');
    else if(r && r.sk) b.classList.add('skip');
    else if(hasDraft(exIdx)) b.classList.add('draft');
    if(pos===S.cur) b.classList.add('cur');
    b.setAttribute('aria-label','Exercise '+(pos+1)+(S.skipped[exIdx]?' (skipped)':(r&&!r.sk?' (checked)':'')));
    b.onclick = function(){ if(!S.done) show(pos); };
    g.appendChild(b);
  });
}
function hasDraft(i){
  var v = S.sav[i], e = EX[i]; if(!v) return false;
  if(e.t==='qcm') return v.sel!=null;
  if(e.t==='multi') return v.sel.length>0;
  if(e.t==='order') return v.ord && v.ord.join()!==S.disp[i].ord.join();
  if(e.t==='match') return Object.keys(v.map).length>0;
  if(e.t==='cat') return Object.keys(v.put).length>0;
  if(e.t==='fill') return v.txt.some(function(x){return x;});
  if(e.t==='spot') return Object.keys(v.lines).length>0;
  if(e.t==='term') return Object.keys(v.acc).length>0;
  if(e.t==='branch') return v.chosen.length>0;
  return false;
}

/* ================= grading ================= */
function grade(e, v, exIdx){
  var m = {}, pts = 0, n, c, k;
  if(e.t==='qcm'){
    var okIdx = e.ch.map(function(c2,ci){return c2.ok?ci:-1;}).filter(function(x){return x>=0;});
    if(v.sel!=null && e.ch[v.sel].ok){ pts = PT; m['c'+v.sel] = 1; }
    else {
      if(v.sel!=null) m['c'+v.sel] = 2;
      okIdx.forEach(function(oi){ if(v.sel!==oi) m['c'+oi] = 3; });
    }
  } else if(e.t==='multi'){
    n = e.ch.filter(function(c2){return c2.ok;}).length; c = 0;
    e.ch.forEach(function(c2,ci){
      var s = v.sel.indexOf(ci)>=0;
      if(c2.ok && s){ c++; m['c'+ci]=1; }
      else if(c2.ok && !s){ m['c'+ci]=3; }
      else if(!c2.ok && s){ m['c'+ci]=2; }
    });
    pts = PT*c/n;
  } else if(e.t==='order'){
    n = e.items.length; c = 0;
    v.ord.forEach(function(oi,pos){ if(oi===pos){c++; m['o'+pos]=1;} else m['o'+pos]=2; });
    pts = PT*c/n;
  } else if(e.t==='match'){
    n = e.pairs.length; c = 0;
    e.pairs.forEach(function(p,li){
      var g2 = v.map[li];
      if(g2!=null && e.pairs[g2].r===p.r){ c++; m['m'+li]=1; }
      else if(g2==null){ m['m'+li]=3; }
      else m['m'+li]=2;
    });
    pts = PT*c/n;
  } else if(e.t==='cat'){
    n = e.items.length; c = 0;
    e.items.forEach(function(it,ii){
      var b = v.put[ii];
      if(b===it.b){ c++; m['k'+ii]=1; }
      else if(b==null){ m['k'+ii]=3; }
      else m['k'+ii]=2;
    });
    pts = PT*c/n;
  } else if(e.t==='fill'){
    var blanks = e.parts.filter(function(p){return p && p.a;});
    n = blanks.length; c = 0; k = 0;
    e.parts.forEach(function(p){
      if(p && p.a){
        var val = norm(v.txt[k]);
        if(p.a.some(function(a){return norm(a)===val;})){ c++; m['f'+k]=1; } else m['f'+k]=2;
        k++;
      }
    });
    pts = PT*c/n;
  } else if(e.t==='spot'){
    n = e.wrong.length; c = 0;
    e.lines.forEach(function(_,li){
      var isW = e.wrong.indexOf(li)>=0, isC = v.lines[li];
      if(isW && isC){ c++; m['s'+li]=1; }
      else if(isW && !isC){ m['s'+li]=3; }
      else if(!isW && isC){ m['s'+li]=2; }
    });
    pts = PT*c/n;
  } else if(e.t==='term'){
    n = e.acc.length; c = 0;
    e.acc.forEach(function(a,ai){ if(v.acc[ai]){ c++; m['t'+ai]=1; } else m['t'+ai]=3; });
    pts = PT*c/n;
  } else if(e.t==='branch'){
    n = e.steps.length; c = 0;
    e.steps.forEach(function(st,si){
      var ch = v.chosen[si];
      if(ch==null || ch<0){ m['b'+si]=3; }
      else if(st.ch[ch].ok){ c++; m['b'+si]=1; }
      else m['b'+si]=2;
    });
    pts = PT*c/n;
  }
  if(S.hint[exIdx]) pts = pts*0.9;
  pts = Math.round(pts*10)/10;
  var lab = (pts>=PT-0.001) ? 'full' : (pts<=0.001 ? 'zero' : 'partial');
  return {earned:pts, marks:m, lab:lab};
}
/* ================= answer summaries for the report ================= */
function ansText(e, v){
  function chList(arr){ return arr.map(function(ci){ return e.ch[ci].plain || e.ch[ci].h.replace(/<[^>]+>/g,''); }).join(' | '); }
  if(e.t==='qcm') return v.sel==null ? '(nothing chosen)' : (e.ch[v.sel].plain || e.ch[v.sel].h.replace(/<[^>]+>/g,''));
  if(e.t==='multi') return v.sel.length ? 'Selected: '+chList(v.sel) : '(nothing selected)';
  if(e.t==='order') return v.ord ? 'Order: '+v.ord.map(function(oi,pos){return (pos+1)+') '+e.items[oi].plain;}).join('  ') : '(untouched)';
  if(e.t==='match') return e.pairs.map(function(p,li){ var g=v.map[li]; return p.l+' → '+(g==null?'—':e.pairs[g].r); }).join('  ·  ');
  if(e.t==='cat') return e.buckets.map(function(b,bi){
      var its = e.items.map(function(it,ii){return {it:it,ii:ii};}).filter(function(x){return v.put[x.ii]===bi;});
      return b+': '+(its.length?its.map(function(x){return x.it.plain;}).join(', '):'(empty)');
    }).join('  ·  ');
  if(e.t==='fill'){ var out=[],k=0; e.parts.forEach(function(p){ if(p&&p.a){ out.push('"'+(v.txt[k]||'—')+'"'); k++; } }); return 'Filled: '+out.join(', '); }
  if(e.t==='spot'){ var ls=Object.keys(v.lines).map(Number); return ls.length? 'Clicked lines: '+ls.sort(function(a,b){return a-b;}).join(', ') : '(nothing clicked)'; }
  if(e.t==='term'){ var acc=e.acc.filter(function(a,ai){return v.acc[ai];}).map(function(a){return a.d;}); return acc.length? 'Accepted: '+acc.join(' ; ') : '(no accepted command yet)'; }
  if(e.t==='branch'){ return e.steps.map(function(st,si){ var c=v.chosen[si]; return 'Step '+(si+1)+': '+(c==null||c<0?'(no choice)':st.ch[c].plain); }).join('  ·  '); }
  return '';
}

/* ================= log/config viewer ================= */
function viewer(a){
  var box = el('div','logv');
  var bar = el('div','logvb');
  bar.appendChild(el('span','lt','ARTIFACT — '+a.label));
  var inp = el('input','filter'); inp.type='search'; inp.placeholder='Filter lines (like a Kibana/Splunk search box)…';
  inp.setAttribute('aria-label','Filter artifact lines');
  bar.appendChild(inp);
  box.appendChild(bar);
  var lns = el('div','lns');
  var rows = a.lines.map(function(t,li){
    var r = el('div','ln');
    r.appendChild(el('span','lnum', String(li+1)));
    var tx = el('span','ltx'); tx.textContent = t;
    r.appendChild(tx);
    lns.appendChild(r);
    return r;
  });
  inp.addEventListener('input', function(){
    var q = inp.value.toLowerCase();
    rows.forEach(function(r,li){
      var txt = a.lines[li].toLowerCase();
      r.style.display = (!q || txt.indexOf(q)>=0) ? '' : 'none';
      var tx = r.querySelector('.ltx');
      if(q){ tx.innerHTML = escHtml(a.lines[li]).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }
      else tx.textContent = a.lines[li];
    });
  });
  box.appendChild(lns);
  return box;
}
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function markOf(cls, word){ return '<span class="stat">'+(cls==='m-ok'?'✓ ':cls==='m-bad'?'✗ ':'! ')+word+'</span>'; }

/* ================= question view ================= */
function renderQ(){
  if(!S) return;
  var view = $('view');
  view.innerHTML = '';
  var i = curIdx(), e = curEx(), v = S.sav[i], r = S.res[i], d = S.disp[i];
  var ro = !!r && !r.sk;
  var w = el('div','qwrap');

  /* scenario card */
  var c1 = el('div','card blk-scenario');
  var themeName = (THEMES.filter(function(t){return t.id===e.th;})[0]||{}).n || '';
  c1.appendChild(el('div','tag sc','SCENARIO <small>· '+themeName+'</small>'));
  c1.appendChild(el('div',null,e.sc));
  var kwl = el('div','kwline','<b>Keywords in play:</b> ');
  e.k.forEach(function(k,ki){ kwl.appendChild(el('span','kwchip',k)); });
  c1.appendChild(kwl);
  w.appendChild(c1);

  /* artifact */
  if(e.art){ var cArt = el('div','card'); cArt.appendChild(viewer(e.art)); w.appendChild(cArt); }

  /* question card */
  var c2 = el('div','card blk-question');
  c2.appendChild(el('div','tag q','QUESTION'));
  c2.appendChild(el('div',null,e.q));
  w.appendChild(c2);

  /* answers card */
  var c3 = el('div','card blk-answers');
  c3.appendChild(el('div','tag a', e.al + ' <small>· exercise '+(S.cur+1)+' of '+EX.length+' · '+(e.multi===false?'single answer · '+(PT)+' pts':'partial credit · up to '+PT+' pts')+'</small>'));
  var box = el('div','ansbox');
  c3.appendChild(box);
  var hintarea = el('div','hintarea');
  c3.appendChild(hintarea);
  if(S.hint[i]) hintarea.innerHTML = '<div class="hintbox"><span class="ht">HINT (−10% of this exercise)</span><br>'+e.hint+'</div>';
  w.appendChild(c3);

  /* type renderer */
  if(e.t==='qcm') rQCM(e,v,i,ro,r,box,d);
  else if(e.t==='multi') rQCM(e,v,i,ro,r,box,d);
  else if(e.t==='order') rOrder(e,v,i,ro,r,box,d);
  else if(e.t==='match') rMatch(e,v,i,ro,r,box,d);
  else if(e.t==='cat') rCat(e,v,i,ro,r,box,d);
  else if(e.t==='fill') rFill(e,v,i,ro,r,box,d);
  else if(e.t==='spot') rSpot(e,v,i,ro,r,box,d);
  else if(e.t==='term') rTerm(e,v,i,ro,r,box,d);
  else if(e.t==='branch') rBranch(e,v,i,ro,r,box,d);

  /* feedback */
  if(r && !r.sk){
    var fb = el('div','fb');
    var cls = r.lab==='full'?'good':(r.lab==='zero'?'zero':'part');
    var pct = Math.round((r.earned/PT)*100);
    var labTxt = r.lab==='full'?'FULL':(r.lab==='zero'?'ZERO':'PARTIAL');
    fb.innerHTML = '<div class="fscore '+cls+'">You earned '+r.earned+' / '+PT+' pts ('+pct+'%)<span class="flabel '+r.lab+'">'+labTxt+'</span></div>';
    if(S.hint[i]) fb.innerHTML += '<div style="color:var(--am);font-size:13px;margin-top:2px">Includes −10% hint cost.</div>';
    var xp = el('div','expl','<div class="xt">EXPLANATION — WHY</div>'+e.ex);
    fb.appendChild(xp);
    c3.appendChild(fb);
  }

  /* button bar */
  var bar = el('div','btnrow');
  var bPrev = el('button','btn ghost','← Prev'); bPrev.type='button'; bPrev.disabled = (S.cur===0); bPrev.onclick = prev;
  var bCheck = el('button','btn primary','✓ Check'); bCheck.type='button'; bCheck.id='checkBtn'; bCheck.onclick = doCheck;
  var bSkip = el('button','btn warn','↷ Skip'); bSkip.type='button'; bSkip.id='skipBtn'; bSkip.onclick = doSkip;
  var bHint = el('button','btn ghost hintBtn','💡 Hint (−10%)'); bHint.type='button'; bHint.disabled = !!S.hint[i] || !!r; bHint.onclick = doHint;
  var bRev = el('button','btn ghost','✎ Revise'); bRev.type='button'; bRev.classList.add('revBtn');
  bRev.disabled = !r; bRev.onclick = doRevise;
  var bNext = el('button','btn green', S.cur>=EX.length-1 ? 'Finish ✔' : 'Next →'); bNext.type='button'; bNext.id='nextBtn'; bNext.onclick = next;
  var bFin = el('button','btn danger','Submit exam'); bFin.type='button'; bFin.onclick = function(){ confirmFinish(false); };
  bar.appendChild(bPrev); bar.appendChild(bCheck); bar.appendChild(bSkip); bar.appendChild(bHint); bar.appendChild(bRev);
  bar.appendChild(el('span','spacer'));
  bar.appendChild(bNext); bar.appendChild(bFin);
  w.appendChild(bar);
  view.appendChild(w);
  applyPause(); updTimer();
}
/* ================= type renderers ================= */
function markClass(r, key){
  if(!r || !r.marks || !r.marks[key]) return '';
  var mk = r.marks[key];
  return mk===1 ? ' m-ok' : mk===2 ? ' m-bad' : ' m-miss';
}
function markWord(mk){ return mk===1 ? ['✓ CORRECT'] : mk===2 ? ['✗ WRONG'] : ['! MISSED']; }

function rQCM(e,v,i,ro,r,box,d){
  var isMulti = e.t==='multi';
  var wrap = el('div','opts');
  d.ch.forEach(function(ci,pos){
    var c = e.ch[ci];
    var sel = isMulti ? (v.sel.indexOf(ci)>=0) : (v.sel===ci);
    var b = el('button','opt'+(sel?' sel':'')+markClass(r,'c'+ci));
    b.type='button';
    b.setAttribute('aria-pressed', sel?'true':'false');
    var stat='';
    if(r && r.marks['c'+ci]){ var mk=r.marks['c'+ci]; stat = mk===1?'<span class="stat">✓ CORRECT</span>':mk===2?'<span class="stat">✗ WRONG</span>':'<span class="stat">! MISSED</span>'; }
    b.innerHTML = '<span class="key">'+String.fromCharCode(65+pos)+'</span><span class="txt">'+c.h+'</span>'+stat;
    b.onclick = function(){
      if(ro) return;
      if(isMulti){
        var p = v.sel.indexOf(ci);
        if(p>=0) v.sel.splice(p,1); else v.sel.push(ci);
        b.classList.toggle('sel'); b.setAttribute('aria-pressed', b.classList.contains('sel')?'true':'false');
      } else {
        v.sel = ci;
        Array.prototype.forEach.call(wrap.children,function(x){x.classList.remove('sel');x.setAttribute('aria-pressed','false');});
        b.classList.add('sel'); b.setAttribute('aria-pressed','true');
      }
    };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  if(isMulti) box.appendChild(el('div','kwline','Select every statement that is true. Partial credit: each correct selection earns its share.'));
}

function rOrder(e,v,i,ro,r,box,d){
  if(!v.ord) v.ord = d.ord.slice();
  var list = el('div');
  var dragPos = -1;
  function paint(){
    list.innerHTML='';
    v.ord.forEach(function(oi,pos){
      var row = el('div','ordrow'+markClass(r,'o'+pos));
      if(r && r.marks['o'+pos]){
        var mk=r.marks['o'+pos];
        row.title = mk===1?'Correct position':mk===2?'Wrong position':'Not placed';
      }
      row.setAttribute('draggable', ro?'false':'true');
      row.appendChild(el('span','num', String(pos+1)));
      row.appendChild(el('span','otxt', e.items[oi].h));
      var up = el('button','mv','▲'); up.type='button'; up.setAttribute('aria-label','Move item '+(pos+1)+' up'); up.disabled=ro;
      up.onclick = function(){ if(pos===0) return; var t=v.ord[pos-1]; v.ord[pos-1]=v.ord[pos]; v.ord[pos]=t; paint(); };
      var dn = el('button','mv','▼'); dn.type='button'; dn.setAttribute('aria-label','Move item '+(pos+1)+' down'); dn.disabled=ro;
      dn.onclick = function(){ if(pos>=v.ord.length-1) return; var t=v.ord[pos+1]; v.ord[pos+1]=v.ord[pos]; v.ord[pos]=t; paint(); };
      row.appendChild(up); row.appendChild(dn);
      row.addEventListener('dragstart', function(ev){ dragPos=pos; try{ev.dataTransfer.setData('text/plain',String(pos));}catch(x){} row.classList.add('drag'); });
      row.addEventListener('dragend', function(){ row.classList.remove('drag'); });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', function(){ row.classList.remove('dragover'); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault(); row.classList.remove('dragover');
        if(ro || dragPos<0) return;
        var moved = v.ord.splice(dragPos,1)[0];
        v.ord.splice(pos,0,moved);
        dragPos=-1; paint();
      });
      list.appendChild(row);
    });
  }
  paint();
  box.appendChild(list);
  box.appendChild(el('div','kwline','Drag rows (or use ▲▼) to put the steps in the right order.'));
}

function rMatch(e,v,i,ro,r,box,d){
  var cols = el('div','cols');
  var lc = el('div','col'), rc = el('div','col');
  lc.appendChild(el('div','colh','Item')); rc.appendChild(el('div','colh','Match'));
  var selL = null;
  function paint(){
    lc.innerHTML=''; rc.innerHTML='';
    lc.appendChild(el('div','colh','Item'));
    rc.appendChild(el('div','colh','Match'));
    d.l.forEach(function(li){
      var p = e.pairs[li];
      var mapped = v.map[li];
      var b = el('button','pill'+(selL===li?' sel':'')+markClass(r,'m'+li));
      b.type='button';
      b.innerHTML = p.l + (mapped!=null?'<span class="pair">→ '+e.pairs[mapped].r+'</span>':'') + (r&&r.marks['m'+li]?(r.marks['m'+li]===1?'<span class="pair">✓</span>':r.marks['m'+li]===2?'<span class="pair">✗</span>':'<span class="pair">! missed</span>'):'');
      b.onclick=function(){
        if(ro) return;
        if(v.map[li]!=null){ delete v.map[li]; selL=null; paint(); return; }
        selL = (selL===li)? null : li; paint();
      };
      lc.appendChild(b);
    });
    d.r.forEach(function(ri){
      var p = e.pairs[ri];
      var usedBy = e.pairs.map(function(q,li){return v.map[li]===ri?li:null;}).filter(function(x){return x!=null;});
      var b = el('button','pill'+(usedBy.length?' sel':''));
      b.type='button';
      b.innerHTML = p.r + (usedBy.length?'<span class="pair">← '+e.pairs[usedBy[0]].l+'</span>':'');
      b.onclick=function(){
        if(ro) return;
        if(selL==null) return;
        v.map[selL]=ri; selL=null; paint();
      };
      rc.appendChild(b);
    });
  }
  paint();
  cols.appendChild(lc); cols.appendChild(rc);
  box.appendChild(cols);
  box.appendChild(el('div','kwline','Click an item on the left, then its match on the right. Click a paired item again to unpair.'));
}

function rCat(e,v,i,ro,r,box,d){
  var pool = el('div','pool');
  var buckets = el('div','cols');
  var selI = null;
  var bEls = [];
  e.buckets.forEach(function(bn,bi){
    var bcol = el('div','col');
    var bzone = el('div','bucket');
    bzone.appendChild(el('h4',null,bn));
    var zoneInner = el('div','bz');
    bzone.appendChild(zoneInner);
    bzone.addEventListener('dragover', function(ev){ ev.preventDefault(); bzone.classList.add('over'); });
    bzone.addEventListener('dragleave', function(){ bzone.classList.remove('over'); });
    bzone.addEventListener('drop', function(ev){ ev.preventDefault(); bzone.classList.remove('over'); if(selI!=null && !ro){ v.put[selI]=bi; selI=null; paint(); } });
    bzone.addEventListener('click', function(){ if(selI!=null && !ro){ v.put[selI]=bi; selI=null; paint(); } });
    bcol.appendChild(bzone);
    buckets.appendChild(bcol);
    bEls.push({zone:bzone, inner:zoneInner});
  });
  function paint(){
    bEls.forEach(function(be){ be.inner.innerHTML=''; });
    pool.innerHTML='';
    d.it.forEach(function(ii){
      var it = e.items[ii];
      var placed = v.put[ii];
      var b = el('button','itm'+(selI===ii?' sel':'')+markClass(r,'k'+ii));
      b.type='button';
      b.innerHTML = it.h;
      if(r && r.marks['k'+ii]){ var mk=r.marks['k'+ii]; b.title = mk===1?'Correct bucket':mk===2?'Wrong bucket':'Not placed'; }
      b.setAttribute('draggable', ro?'false':'true');
      b.addEventListener('dragstart', function(ev){ selI=ii; try{ev.dataTransfer.setData('text/plain',String(ii));}catch(x){} });
      b.onclick = function(){
        if(ro) return;
        if(v.put[ii]!=null){ delete v.put[ii]; selI=null; paint(); return; }
        selI = (selI===ii)? null : ii; paint();
      };
      if(placed==null) pool.appendChild(b);
      else bEls[placed].inner.appendChild(b);
    });
  }
  paint();
  box.appendChild(pool);
  box.appendChild(el('div','colh','Drop zones'));
  box.appendChild(buckets);
  box.appendChild(el('div','kwline','Drag each chip into the right bucket — or click a chip, then click a bucket. Click a placed chip to pull it back.'));
}

function rFill(e,v,i,ro,r,box,d){
  var holder = el('div','filltxt');
  var k = 0;
  e.parts.forEach(function(p){
    if(typeof p === 'string'){ holder.appendChild(document.createTextNode(p)); return; }
    var ki = k;
    var inp = el('input','blank'+markClass(r,'f'+ki));
    inp.type='text'; inp.disabled = ro;
    inp.setAttribute('aria-label','Blank '+(ki+1));
    inp.value = v.txt[ki] || '';
    inp.oninput = function(){ v.txt[ki]=inp.value; };
    holder.appendChild(inp);
    k++;
  });
  box.appendChild(holder);
  var bank = el('div','bank');
  bank.appendChild(el('div','colh','Word bank (shuffled — chips are reference only, type into the blanks)'));
  var chips = el('div',null);
  chips.style.cssText='display:flex;flex-wrap:wrap;gap:8px';
  d.bank.forEach(function(w){ chips.appendChild(el('span','bankchip',w)); });
  bank.appendChild(chips);
  box.appendChild(bank);
}

function rSpot(e,v,i,ro,r,box,d){
  var wrap = el('div','spot');
  e.lines.forEach(function(t,li){
    var b = el('button','spotln'+(!ro && v.lines[li]?' sel':'')+markClass(r,'s'+li));
    b.type='button';
    b.setAttribute('aria-pressed', v.lines[li]?'true':'false');
    b.innerHTML = '<span class="lnum">'+String(li+1).padStart(2,'0')+'</span><span>'+escHtml(t)+'</span>';
    b.onclick = function(){
      if(ro) return;
      if(v.lines[li]) delete v.lines[li]; else v.lines[li]=1;
      b.classList.toggle('sel');
      b.classList.remove('m-ok','m-bad','m-miss');
      b.setAttribute('aria-pressed', b.classList.contains('sel')?'true':'false');
    };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  box.appendChild(el('div','kwline','Click every line you believe is a fault. Click again to un-select. The examiner counts only real faults.'));
}

function rTerm(e,v,i,ro,r,box,d){
  var term = el('div','term');
  var tb = el('div','termb');
  tb.innerHTML = '<span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="tt">'+e.host+' — console</span>';
  term.appendChild(tb);
  var body = el('div','termbody');
  var hist = el('div','hist');
  function paintHist(){
    hist.innerHTML = v.hist.map(function(h){
      if(h.k==='c') return '<div class="hcmd">'+escHtml(h.t)+'</div>';
      if(h.k==='b') return '<div class="hbad">'+escHtml(h.t)+'</div>';
      if(h.k==='g') return '<div class="hok">'+escHtml(h.t)+'</div>';
      return '<div>'+escHtml(h.t)+'</div>';
    }).join('');
    body.scrollTop = body.scrollHeight;
  }
  paintHist();
  var row = el('div','termrow');
  var pr = el('span','pr', e.prompt);
  var inp = el('input','term-in'); inp.type='text'; inp.disabled=ro;
  inp.setAttribute('aria-label','Type a command');
  inp.placeholder = e.placeholder || 'type a command and press Enter';
  row.appendChild(pr); row.appendChild(inp);
  body.appendChild(hist); body.appendChild(row);
  term.appendChild(body);
  box.appendChild(term);
  if(e.guide) box.appendChild(el('div','hintbox','<span class="ht">GUIDE</span><br>'+e.guide));
  if(e.sample){
    var smp = el('pre','cfg'); smp.textContent = e.sample;
    box.appendChild(el('div','kwline','Expected output shape:'));
    box.appendChild(smp);
  }
  function run(){
    if(ro) return;
    var val = inp.value.replace(/^\s+|\s+$/g,'');
    if(!val) return;
    v.hist.push({k:'c', t:e.prompt+' '+val});
    var matched = -1;
    for(var ai=0; ai<e.acc.length; ai++){
      if(v.acc[ai]) continue;
      var ok = e.acc[ai].some(function(re){ try{ return new RegExp(re,'i').test(val); }catch(x){ return false; } });
      if(ok){ matched = ai; break; }
    }
    if(matched>=0){
      v.acc[matched]=1;
      (e.accOut[matched]||[]).forEach(function(line){ v.hist.push({k:'g',t:line}); });
      v.hist.push({k:'g', t:'[accepted '+(Object.keys(v.acc).length)+'/'+e.acc.length+']'});
    } else {
      v.hist.push({k:'b', t:'% Invalid or not needed for this task. Read the goal again.'});
    }
    inp.value='';
    paintHist();
  }
  inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); run(); } });
  box.appendChild(el('div','kwline','Type each command and press Enter (Enter acts like Check here). Every accepted command earns its share of the points.'));
  var help = el('button','btn ghost','Run command'); help.type='button'; help.onclick=run; if(ro) help.disabled=true;
  box.appendChild(help);
}

function rBranch(e,v,i,ro,r,box,d){
  var wrap = el('div');
  var total = e.steps.length;
  function paint(){
    wrap.innerHTML='';
    if(ro && r && !r.sk){
      /* post-check review: every decision marked individually */
      var rv = el('div','fb');
      rv.style.margin = '0';
      rv.innerHTML = '<div class="xt">DECISION REVIEW — EVERY CHOICE MARKED</div>';
      e.steps.forEach(function(st,si){
        var mk = r.marks['b'+si];
        var cls = mk===1?'m-ok':mk===2?'m-bad':'m-miss';
        var word = mk===1?'✓ CORRECT':mk===2?'✗ WRONG':'! MISSED';
        var ch = v.chosen[si];
        var line = el('div','brstep '+cls);
        line.innerHTML = '<span class="brstat">'+word+'</span><span class="brq">Decision '+(si+1)+'</span>'+
          '<span class="brc">'+escHtml(ch==null||ch<0?'(no choice made)':st.ch[ch].plain)+'</span>';
        rv.appendChild(line);
      });
      wrap.appendChild(rv);
      wrap.appendChild(el('div','kwline','Press Revise to walk the scenario again, or Next to continue.'));
      return;
    }
    var cur = v.step;
    var prog = el('div','kwline','<b>Decision '+(Math.min(cur+1,total))+' of '+total+'</b> — your choices shape the incident.');
    wrap.appendChild(prog);
    if(cur < total){
      var st = e.steps[cur];
      var q = el('div','fb'); q.style.margin='0 0 10px'; q.innerHTML = st.q;
      wrap.appendChild(q);
      var opts = el('div','opts');
      st.ch.forEach(function(c,ci){
        var chosen = v.chosen[cur]===ci;
        var b = el('button','opt'+(chosen?' sel':''));
        b.type='button';
        b.setAttribute('aria-pressed', chosen?'true':'false');
        b.innerHTML = '<span class="key">'+String.fromCharCode(65+ci)+'</span><span class="txt">'+c.h+'</span>';
        b.onclick = function(){
          if(ro) return;
          v.chosen[cur]=ci;
          paint();
        };
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
      if(v.chosen[cur]!=null){
        var c = st.ch[v.chosen[cur]];
        var outc = el('div','fb'); outc.style.marginTop='10px';
        outc.innerHTML = '<div class="fscore '+(c.ok?'good':'zero')+'">'+(c.ok?'✓ Good call':'✗ That choice has consequences')+'</div><div>'+c.out+'</div>';
        wrap.appendChild(outc);
        var cont = el('button','btn primary'); cont.type='button';
        cont.textContent = cur===total-1 ? 'Finish scenario →' : 'Continue →';
        /* last step advances to the complete state so the button never dead-ends */
        cont.onclick = function(){ if(v.step<total-1){ v.step++; } else { v.step = total; } paint(); };
        wrap.appendChild(el('div','btnrow',null)).appendChild(cont);
      }
    } else {
      var done = el('div','fb');
      done.innerHTML = '<div class="fscore part">Scenario complete — press Check to score all '+total+' decisions.</div>';
      wrap.appendChild(done);
    }
  }
  paint();
  box.appendChild(wrap);
}

    intf:['speed','duplex','autonegotiation','duplex mismatch','late collisions','CRC errors','PoE 802.3af','PoE+ 802.3at','PoE++ 802.3bt','PoE power budget','switchport mode','err-disabled'],

    mtu:['MTU','1500 bytes','jumbo frames (9000)','fragmentation','DF bit','PMTUD','MTU mismatch','black hole','runts','giants']
  };

/* ================= finish + results ================= */
function confirmFinish(auto){
  if(S.done) return;
  var answered = Object.keys(S.res).filter(function(k){ return S.res[k] && !S.res[k].sk; }).length;
  if(!auto && answered===0){
    modal('Nothing to submit','Every exercise is still skipped or unchecked. Answer at least one exercise (press Check) before submitting. Skipped exercises are excluded from scoring, so a fully skipped exam cannot be recorded.', [{t:'Back to the exam', cls:'btn primary', fn:closeModal}]);
    return;
  }
  var skipped = Object.keys(S.skipped).length;
  var left = EX.length - answered;
  if(!auto){
    modal('Submit this attempt?','Answered and checked: <b>'+answered+'</b> of '+EX.length+'. Not counted (skipped/unchecked): <b>'+left+'</b>. The score is computed over the non-skipped exercises only.',
      [{t:'Keep working', cls:'btn ghost', fn:closeModal},
       {t:'Submit ✔', cls:'btn primary', fn:function(){ closeModal(); finishExam(false); }}]);
  } else {
    finishExam(true);
  }
}
function finishExam(auto){
  if(S.done) return;
  S.done = true;
  closeModal();
  setManP(false); setChkP(false);
  $('pauseBtn').disabled = true;
  resultsScreen(auto);
  reportScore();
}
function resultsScreen(auto){
  var view = $('view'); view.innerHTML='';
  var pos=0, earn=0, answered=0, skippedList=[];
  S.ord.forEach(function(exIdx){
    var r = S.res[exIdx];
    if(r && !r.sk){ pos += PT; earn += r.earned; answered++; }
    else skippedList.push(exIdx);
  });
  var scoreU = pos>0 ? Math.round(earn/10) : 0;
  var percent = pos>0 ? Math.round(scoreU/answered*100) : 0;
  var passed = pos>0 && percent>=CFG.pass;
  S.final = {scoreU:scoreU, answered:answered, percent:percent, passed:passed, earn:earn, pos:pos};

  var w = el('div');
  var hero = el('div','res-hero '+(passed?'pass':'fail'));
  hero.innerHTML =
    '<div class="rstate">'+(passed?'✔ PASS':'✘ FAIL')+'</div>'+
    '<div class="rpct">'+percent+'%</div>'+
    '<div class="rpts">You earned <b>'+scoreU+'</b> of <b>'+answered+'</b> points (partial credit applied, rounded once)'+(auto?' — the timer ran out before you submitted':'')+'.</div>'+
    '<div class="rpts" style="margin-top:6px">Pass mark: '+CFG.pass+'% · Raw exercise points: '+earn+' / '+pos+'.</div>'+
    '<div class="rpts" style="margin-top:6px">'+(passed?'Certificate-style success panel: you mastered this objective at '+CFG.sev+' level.':'You must retake this exam to pass. Review the report below, then press Retake Exam.')+'</div>';
  var rt = el('button','btn primary','Retake Exam ↻');
  rt.type='button'; rt.style.cssText='margin-top:16px;min-width:220px';
  rt.onclick = retake;
  hero.appendChild(rt);
  w.appendChild(hero);

  /* per-theme progress */
  var tb = el('div','card');
  tb.appendChild(el('h2',null,'Progress per theme'));
  var trow = el('div','thmrow');
  THEMES.forEach(function(t){
    var tot=0, done=0;
    S.ord.forEach(function(exIdx){
      if(EX[exIdx].th!==t.id) return;
      tot++;
      var r=S.res[exIdx];
      if(r && !r.sk) done++;
    });
    var tr = el('div','thm');
    tr.innerHTML = '<span class="tn">'+t.n+'</span><span class="tb"><div style="width:'+(tot? (done/tot*100):0)+'%"></div></span><span class="tv">'+done+'/'+tot+'</span>';
    trow.appendChild(tr);
  });
  tb.appendChild(trow);
  w.appendChild(tb);

  /* skipped note */
  if(skippedList.length){
    var sn = el('div','card');
    sn.innerHTML = '<h2>Skipped exercises — excluded from scoring</h2><p style="color:var(--mut);font-size:14.5px;margin:0 0 8px">These were not counted in your score or in the total (neither in the numerator nor in the denominator):</p>';
    var ul = el('ul'); ul.style.cssText='margin:0;padding-left:20px';
    skippedList.forEach(function(exIdx){
      var p = S.ord.indexOf(exIdx);
      ul.appendChild(el('li',null,'Exercise '+(p+1)+' — '+EX[exIdx].short));
    });
    sn.appendChild(ul);
    w.appendChild(sn);
  }

  /* per-exercise report */
  var rp = el('div','card');
  rp.appendChild(el('h2',null,'Detailed report — every exercise'));
  S.ord.forEach(function(exIdx,p){
    var e = EX[exIdx], r = S.res[exIdx];
    var card = el('div','rep');
    var lab = r && !r.sk ? r.lab : 'skipped';
    var pts = r && !r.sk ? (r.earned+' / '+PT+' pts') : '0 pts — not counted';
    card.innerHTML = '<div class="rhead"><span class="rnum">Ex '+(p+1)+'</span><span class="rtitle">'+e.short+'</span><span class="rlab '+lab+'">'+lab.toUpperCase()+' · '+pts+'</span></div>';
    card.innerHTML += '<div class="rline"><b>Your answer:</b> '+(r&&!r.sk? escHtml(r.yourAns):'— skipped —')+'</div>';
    card.innerHTML += '<div class="rline"><b>Correct answer:</b> '+e.at+'</div>';
    card.innerHTML += '<div class="rexpl"><b>Why:</b> '+e.ex+'</div>';
    if(r && r.sk===undefined && !r.sk && S.hint[exIdx]) card.innerHTML += '<div class="rline" style="color:var(--am)">Hint used (−10%).</div>';
    rp.appendChild(card);
  });
  w.appendChild(rp);
  view.appendChild(w);
  window.scrollTo(0,0);
}
function retake(){
  S.reported = false;
  startExam();
  window.scrollTo(0,0);
}
/* ================= website integration ================= */
function reportScore(){
  if(!S || S.reported || S.final.answered===0) return;
  S.reported = true;
  var percent = S.final.percent;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topic,
      score:S.final.scoreU,
      total:S.final.answered,
      percent:percent,
      passed:percent>=CFG.pass
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function(event){
  var d = event.data;
  if(!d) return;
  if(d.type!=='CYBERPULSE_INIT' && d.type!=='CYBERMASTERY_INIT') return;
  USER = d.username || '';
  var h = document.querySelector('.hero .lead');
  if(h && USER){ h.innerHTML = h.innerHTML.replace(/\s*·\s*$/, '') + ' · Welcome, <b>'+escHtml(USER)+'</b>'; }
  /* theme: this file ships dark only, so a light request is ignored by design */
});
/* ================= modal ================= */
function modal(title, bodyHtml, btns){
  var old = document.querySelector('.mod'); if(old) old.remove();
  var m = el('div','mod');
  var c = el('div','modcard');
  c.setAttribute('role','dialog'); c.setAttribute('aria-label',title);
  c.appendChild(el('h2',null,title));
  c.appendChild(el('div',null,bodyHtml));
  var row = el('div','modbtns');
  btns.forEach(function(b){
    var x = el('button', b.cls||'btn', b.t); x.type='button'; x.onclick=b.fn; row.appendChild(x);
  });
  c.appendChild(row);
  m.appendChild(c);
  document.body.appendChild(m);
  row.querySelector('button').focus();
}
function closeModal(){ var m=document.querySelector('.mod'); if(m) m.remove(); }
/* ================= boot ================= */
$('pauseBtn').onclick = function(){ if(!S || S.done) return; setManP(!S.manP); };
buildIntro();
