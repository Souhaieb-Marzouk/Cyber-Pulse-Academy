{

{
  id: 'H03', type: 'dd', theme: 'Access methods & attacks', points: 10,
  title: 'Red-team view: which control does each bypass defeat?',
  kw: ['bump key', 'prox cloning', 'tailgating', 'camera blinding', 'multifactor'],
  scenario: '<p>You are the red-team lead writing the findings chapter. Each technique below was used successfully during the physical test. Map every technique to the control it defeated, so each finding gets the right fix.</p>',

    { t: 'Clone of a 125 kHz prox badge', b: 1 },
    { t: 'Walking in behind an employee', b: 2 },
    { t: 'Laser pointed into a PTZ lens', b: 3 },
    { t: 'Badge lifted from a desk + code read over a shoulder', b: 4 }
  ],
  buckets: [
    'Mechanical pin-tumbler lock',
    'Single-factor 125 kHz proximity reader',
    'Single door with no vestibule and no guard',
    'Camera without tamper analytics',
    'Single-factor badge reader (no second factor)'
  ],
  hints: [
    'Each control in the right column failed for exactly one reason — find the reason inside each technique.',
    'The last technique is really TWO credentials used together; which control assumes only ONE is needed?'
  ],
  explain: '<ul>' +
    '<li><b>Bump key &rarr; pin-tumbler lock:</b> bumping rakes the pins of a standard cylinder so the plug jumps free; lock picking, shimming and loiding attack the same mechanism. The control that failed is the cylinder itself; the fix is a bump-resistant cylinder and key control.</li>' +
    '<li><b>Prox clone &rarr; 125 kHz single-factor reader:</b> a prox card is a dumb ID broadcaster; a cheap pocket reader copies it, and the reader cannot tell a copy from the original. Smart cards + OSDP fix the technology.</li>' +
    '<li><b>Tailgating &rarr; single door, no vestibule:</b> one open door and polite employees is all it takes. The interlock/vestibule is the control that removes the gap.</li>' +
    '<li><b>Laser on the lens &rarr; camera without tamper analytics:</b> IR blinding with a laser is lens-level sabotage without lens defacement — the housing stays intact while the picture becomes glare. Tamper/scene-change analytics alarms on exactly this signature.</li>' +
    '<li><b>Badge + shoulder-surfed PIN &rarr; single-factor reader:</b> the reader asked for one factor, so stealing that factor was enough. Adding a second, different factor (code or biometric) means the attacker must steal both — much harder.</li>' +

/* H04 */
{
  id: 'H04', type: 'multi', theme: 'Electronic access control', points: 10,
  title: 'OSDP versus Wiegand — separate myth from fact',
  kw: ['Wiegand', 'OSDP', 'secure channel', 'tamper'],
  scenario: '<p>A vendor claims: "Wiegand is fine, it is encrypted by default, and OSDP forces you to rebuild the whole door." The integrator disagrees. Fact-check for the steering committee.</p>',
  question: '<p>Select every statement that is <b>true</b>.</p>',
  choices: [
    { t: 'Wiegand is one-way (reader to controller) and sends data unencrypted.', ok: true },
    { t: 'OSDP supports an encrypted, authenticated channel (Secure Channel Protocol).', ok: true },
    { t: 'OSDP is bidirectional, so readers can report tamper and receive firmware updates.', ok: true },
    { t: 'Wiegand encrypts badge numbers by default.', ok: false },
    { t: 'OSDP only works with mechanical keys, not cards.', ok: false },
    { t: 'Using OSDP means replacing the door and frame, not just the reader and controller.', ok: false }
  ],
  hints: [
    'One protocol is 40 years old and mute; the other talks both ways with encryption.',
    'Two of the false statements are the vendor’s exact claims inverted.'
  ],
  explain: '<ul>' +
    '<li><b>True — Wiegand is mute and naked:</b> one-way pulses, no encryption, no reader authentication. Any wire tap sees every badge ID; a fake reader can replay them.</li>' +
    '<li><b>True — OSDP SCP:</b> the Secure Channel Protocol encrypts and authenticates reader↔controller traffic after a key exchange.</li>' +
    '<li><b>True — bidirectional:</b> the controller can poll reader health, receive tamper events, push firmware and configuration — impossible on Wiegand.</li>' +
    '<li><b>False — "Wiegand is encrypted":</b> it never is; the vendor confused age with security.</li>' +
    '<li><b>False — "OSDP is keys-only":</b> OSDP is a READER protocol; it carries whatever credential the reader reads — cards, fobs, phones, biometrics.</li>' +
    '<li><b>False — "rebuild the door":</b> OSDP is a two-wire upgrade of the reader-to-controller cabling; the door stays a door.</li>' +
    '</ul>'
},

    { t: 'Keeping footage forever always improves security.', ok: false },

    { t: 'Encrypting exported clips is illegal because police need plain files.', ok: false }

    '<li><b>True — signage:</b> transparent notice (what is recorded, by whom, why) is a core privacy requirement in most frameworks and also deters offenders.</li>' +
    '<li><b>False — forever:</b> endless retention grows breach risk and is exactly what privacy law forbids without a reason. More is not safer; it is liability.</li>' +
    '<li><b>False — neighbours’ property:</b> recording into private property beyond your boundary is a classic complaint and often unlawful. Angle, mask, or move the camera.</li>' +
    '<li><b>False — encryption "illegal":</b> nothing forbids encrypting exports; hashing plus encryption strengthens the chain of custody. Police handling is a process question, not an encryption ban.</li>' +

          '<li><b>Goal.</b> Realistic, on-the-job scenarios about CCTV/IP cameras, video recording and door locks &mdash; at <b>' + META.label + '</b> severity. ' + types + '</li>' +
          '<li><b>Check.</b> Every exercise has a <b>Check</b> button. It marks each part of your answer (green = right, red = wrong, amber = missed or partial), locks the answer for scoring and shows an explanation.</li>' +
          '<li><b>Check-pause.</b> Checking <b>pauses the timer automatically</b> in "review mode": the exercise, your marks and the explanation stay visible so you can learn. The timer stays frozen until you press <b>Next</b>. Checking again, editing or reading does <b>not</b> restart it.</li>' +
          '<li><b>Manual pause.</b> The <b>Pause</b> button also stops the timer, but hides the exercise so you cannot study it. Both pauses can stack; the clock runs again only when both are cleared.</li>' +
          '<li><b>Revise.</b> After a Check you can press <b>Revise</b> to unlock the answer and change it, then Check again (the timer rules apply every time).</li>' +
          '<li><b>Skip.</b> Every exercise has a <b>Skip</b> button. Skipped exercises get an amber marker and are <b>excluded from scoring</b> &mdash; from both your points and the maximum. You can go back and finish them any time before the timer ends.</li>' +
          '<li><b>Partial credit.</b> Multi-part exercises are scored <b>per correct part</b>, not all-or-nothing. One wrong pick does not remove points you already earned.</li>' +
          '<li><b>Hints.</b> A hint reveals a nudge (never the answer) and costs <b>&minus;10%</b> of that exercise&rsquo;s points.</li>' +
          '<li><b>Passing.</b> You need <b>' + META.passMark + '%</b> over the non-skipped exercises. The results screen shows a full report, and you can retake the exam &mdash; questions and answers are reshuffled.</li>' +
        '</ul>' +
        '<p style="text-align:center;margin-top:14px"><button class="btn primary" id="startBtn">Start the exam</button></p>' +
      '</div>' +
      '<div class="card" style="margin:0">' +
        '<h2>Keywords covered</h2>' +
        '<p style="color:var(--muted);font-size:.88rem">Every keyword below is exercised at least once in this file.</p>' +
        '<div class="kwpanel">' + kw + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
  $('#startBtn').addEventListener('click', startExam);
}

function startExam(){
  S.attempt++;
  S.order = shuffle(EXERCISES.map(function(_, i){ return i; }));
  S.idx = 0; S.answers = {}; S.checked = {}; S.skipped = {}; S.unlocked = {}; S.hints = {}; S.render = {};
  S.remaining = META.timerSeconds; S.manualPause = false; S.checkPause = false;
  S.score = 0; S.finished = false; S.reported = false; S.running = true; S.pickedItem = null; S.timeUpWarned = false;
  renderExamShell();
  renderExercise();
}

/* ---------- exam shell ---------- */
function themeChips(){
  var counts = {};
  KEYWORD_THEMES.forEach(function(t){ counts[t.name] = { n: 0, d: 0 }; });
  for(var p = 0; p < S.order.length; p++){
    var e = ex(p);
    if(!counts[e.theme]) counts[e.theme] = { n: 0, d: 0 };
    counts[e.theme].n++;
    if(S.checked[p] || S.skipped[p]) counts[e.theme].d++;
  }
  return Object.keys(counts).map(function(k){
    var c = counts[k];
    var done = c.d >= c.n;
    return '<span class="chip' + (done ? ' done' : '') + '">' + (done ? '&#10003; ' : '') + esc(k) + ' ' + c.d + '/' + c.n + '</span>';
  }).join('');
}
function renderExamShell(){
  $('#app').innerHTML =
    '<div id="toolbar">' +
      '<span id="timerbox" aria-live="off"></span>' +
      '<span id="scorebox">Score: <b id="scoreval">0</b> / <span id="scoremax">0</span> pts</span>' +
      '<button class="btn" id="pauseBtn" aria-pressed="false">&#10074;&#10074; Pause</button>' +
      '<span class="pill" id="pillManual" role="status">&#9208; Paused (manual)</span>' +
      '<span class="pill" id="pillCheck" role="status">&#9203; Timer paused &mdash; review mode</span>' +
      '<span class="spacer"></span>' +
      (S.username ? '<span class="chip">Candidate: <b>' + esc(S.username) + '</b></span>' : '') +
      '<button class="btn ghost small" id="submitBtn">Submit exam</button>' +
    '</div>' +
    '<div id="progresswrap"><div id="progressbar"></div><div id="progresstext"></div></div>' +
    '<div id="themeChips"></div>' +
    '<div id="navgrid" role="navigation" aria-label="Exercise navigator"></div>' +
    '<div id="excard"><div id="veilmsg">&#9208; Paused &mdash; the exercise is hidden.<br>Press Resume to continue.</div><div id="exinner" tabindex="-1"></div></div>';
  $('#pauseBtn').addEventListener('click', toggleManualPause);
  $('#submitBtn').addEventListener('click', function(){ submitExam(true); });
  renderTimer(); renderScore(); renderProgress(); renderNav();
}
function renderScore(){
  var maxPts = 0;
  for(var p = 0; p < S.order.length; p++){ if(!(S.skipped[p] && !S.checked[p])) maxPts += ex(p).points; }
  $('#scoremax').textContent = maxPts;
  $('#scoreval').textContent = (Math.round(S.score * 10) / 10);
}
function renderProgress(){
  $('#progressbar').style.width = Math.round(((S.idx + 1) / S.order.length) * 100) + '%';
  $('#progresstext').textContent = 'Exercise ' + (S.idx + 1) + ' of ' + S.order.length;
  $('#themeChips').innerHTML = themeChips();
}
function navState(p){
  var c = S.checked[p];
  if(c){ return c.label === 'full' ? 'full' : (c.label === 'partial' ? 'partial' : 'zero'); }
  if(S.skipped[p]) return 'skipped';
  if(S.answers[p] && Object.keys(S.answers[p]).length) return 'touched';
  return '';
}
function navIcon(p){
  var st = navState(p);
  return st === 'full' ? '&#10003;' : st === 'partial' ? '&#189;' : st === 'zero' ? '&#10007;' :
         st === 'skipped' ? '&#8674;' : st === 'touched' ? '&#8226;' : '';
}
function renderNav(){
  var g = $('#navgrid'); g.innerHTML = '';
  for(var i = 0; i < S.order.length; i++){
    var b = el('button', 'navq ' + navState(i) + (i === S.idx ? ' cur' : ''), String(i + 1) + (navIcon(i) ? '<span class="st" aria-hidden="true">' + navIcon(i) + '</span>' : ''));
    b.style.fontSize = '0.95rem';
    b.setAttribute('data-p', String(i));
    var st = navState(i);
    b.setAttribute('aria-label', 'Exercise ' + (i + 1) + (st ? ' — ' + st : ' — not started') + (st === 'skipped' ? ', skipped' : ''));
    b.addEventListener('click', function(ev){ go(Number(ev.currentTarget.getAttribute('data-p'))); });
    g.appendChild(b);
  }
}
function updatePauseUI(){
  var pm = $('#pillManual'), pc = $('#pillCheck');
  if(pm) pm.className = 'pill' + (S.manualPause ? ' on' : '');
  if(pc) pc.className = 'pill' + (S.checkPause ? ' on' : '');
  var pb = $('#pauseBtn');
  if(pb){ pb.innerHTML = S.manualPause ? '&#9654; Resume' : '&#10074;&#10074; Pause'; pb.setAttribute('aria-pressed', S.manualPause ? 'true' : 'false'); }
  var card = $('#excard'), veil = $('#veilmsg');
  if(card && veil){ card.className = S.manualPause ? 'veil' : ''; veil.className = S.manualPause ? 'on' : ''; }
  renderTimer();
}
function toggleManualPause(){
  S.manualPause = !S.manualPause;
  updatePauseUI();
}

/* ---------- navigation ---------- */
function go(i){ if(S.finished) return; S.idx = Math.max(0, Math.min(i, S.order.length - 1)); renderExercise(); }
function next(){
  if(S.checkPause){ S.checkPause = false; }
  if(S.idx >= S.order.length - 1){ submitExam(false); return; }
  go(S.idx + 1);
  updatePauseUI();
}
function prev(){ if(S.idx > 0) go(S.idx - 1); }
function doSkip(){
  S.skipped[pos()] = true;
  renderNav(); renderProgress(); renderScore();
  if(S.idx >= S.order.length - 1) return; /* last exercise: stay put — the student keeps control of Submit and can still return */
  go(S.idx + 1);
}

/* ---------- answer storage helpers ---------- */
function ans(){ var p = pos(); if(!S.answers[p]) S.answers[p] = {}; return S.answers[p]; }
function isLocked(p){ p = p == null ? pos() : p; return !!S.checked[p] && !S.unlocked[p]; }

/* ---------- exercise rendering ---------- */
var TYPE_LABEL = {
  qcm: 'Multiple choice — choose one', multi: 'Multi-select — choose all that apply',
  dd: 'Drag each item to the right bucket', match: 'Match each item', order: 'Put in the right order',
  bank: 'Fill the blanks from the word bank', fib: 'Type the missing words', terminal: 'Terminal — type the commands',
  spot: 'Click the faulty line(s)', branch: 'Branching scenario', hotspot: 'Click the right spot on the map',
  sim: 'Alert queue — choose one action per alert', logviewer: 'Log analysis'
};
function renderExercise(){
  var e = ex();
  var inner = $('#exinner');
  inner.innerHTML = '';
  var meta = el('div', 'exmeta');
  meta.innerHTML = '<span class="chip">Exercise <b>' + (S.idx + 1) + '</b>/' + S.order.length + '</span>' +
    '<span class="chip">' + esc(TYPE_LABEL[e.type] || e.type) + '</span>' +
    '<span class="chip">' + esc(e.theme) + '</span>' +
    '<span class="chip">' + e.points + ' pts</span>' +

  inner.appendChild(meta);

  var scn = el('div', 'block scn', '<span class="lbl">SCENARIO</span><div>' + e.scenario + '</div>');
  inner.appendChild(scn);

  if(e.artifact){
    var art = el('div', 'art');
    art.innerHTML = '<div class="ttl">' + esc(e.artifact.title) + '</div>';
    if(e.artifact.filter){
      var fr = el('div', 'filterrow');
      var inp = el('input'); inp.type = 'text'; inp.placeholder = 'Filter lines (like Kibana/Splunk)...';
      inp.setAttribute('aria-label', 'Filter log lines');
      var fc = el('span', 'fcount');
      fr.appendChild(inp); fr.appendChild(fc);
      art.appendChild(fr);
      var linesBox = el('div', 'loglines');
      art.appendChild(linesBox);
      var render = function(){
        var q = norm(inp.value);
        var lines = e.artifact.lines.filter(function(l){ return !q || norm(l).indexOf(q) !== -1; });
        linesBox.innerHTML = lines.map(colorLine).join('');
        fc.textContent = lines.length + ' of ' + e.artifact.lines.length + ' lines';
      };
      inp.addEventListener('input', render);
      render();
    } else if(e.artifact.html){
      art.appendChild(el('div', 'loglines', e.artifact.html));
    } else {
      art.appendChild(el('div', 'loglines', e.artifact.lines.map(colorLine).join('')));
    }
    inner.appendChild(art);
  }

  inner.appendChild(el('div', 'block q', '<span class="lbl">QUESTION</span><div>' + e.question + '</div>'));

  var ansBlock = el('div', 'block ans');
  var ansLbl = e.type === 'logviewer' ? TYPE_LABEL[e.inner.type] : TYPE_LABEL[e.type];
  ansBlock.innerHTML = '<span class="lbl">ANSWERS — ' + esc(ansLbl).toUpperCase() + '</span>';
  var box = el('div', 'ansbox');
  ansBlock.appendChild(box);
  inner.appendChild(ansBlock);
  renderAnswer(e, box);

  var fb = el('div', 'feedback hidden'); fb.id = 'feedback';
  inner.appendChild(fb);

  var acts = el('div', 'actionrow');
  function mkBtn(id, label, cls, fn){ var b = el('button', 'btn ' + (cls || ''), label); b.id = id; b.addEventListener('click', fn); acts.appendChild(b); return b; }
  mkBtn('checkBtn', 'Check', 'primary', doCheck);
  mkBtn('hintBtn', 'Hint (&minus;10%)', 'ghost', doHint);
  mkBtn('reviseBtn', 'Revise', 'ghost', doRevise);
  mkBtn('skipBtn', 'Skip', 'ghost', doSkip);
  mkBtn('prevBtn', '&larr; Back', 'ghost', prev);
  mkBtn('nextBtn', (S.idx >= S.order.length - 1 ? 'Finish &amp; see results' : 'Next &rarr;'), '', next);
  inner.appendChild(acts);
  $('#prevBtn').disabled = (S.idx === 0);
  $('#reviseBtn').disabled = !S.checked[pos()];
  $('#hintBtn').disabled = isLocked();

  if(S.hints[pos()] > 0){ var hb = el('div', 'hintbox'); hb.id = 'hintbox'; inner.insertBefore(hb, fb); showHints(e, hb); }
  applyLock();
  if(S.checked[pos()]) showFeedback(pos(), false);
  renderProgress(); renderNav(); updatePauseUI();
  var card = $('#excard');
  var inner2 = $('#exinner');
  if(card && !S.manualPause && inner2 && inner2.focus){ try { inner2.focus({ preventScroll: true }); } catch(err) { try { inner2.focus(); } catch(err2) {} } }
  try { window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); } catch(err) { window.scrollTo(0, 0); }
}

function applyLock(){
  var box = $('.ansbox'); if(!box) return;
  var lk = isLocked();
  box.className = 'ansbox' + (lk ? ' locked' : '');
  $all('button, input, select', box).forEach(function(c){ c.disabled = lk; });
  var cb = $('#checkBtn'); if(cb) cb.innerHTML = S.checked[pos()] ? 'Check again' : 'Check';
  var hb = $('#hintBtn'); if(hb) hb.disabled = lk;
  var rb = $('#reviseBtn'); if(rb) rb.disabled = !S.checked[pos()];
}

/* ---------- answer renderers ---------- */
function renderAnswer(e, box){
  var a = ans();
  if(e.type === 'qcm' || e.type === 'multi' || (e.type === 'logviewer' && (e.inner.type === 'qcm' || e.inner.type === 'multi'))){
    var src = e.type === 'logviewer' ? e.inner : e;
    var isMulti = e.type === 'multi' || (e.type === 'logviewer' && e.inner.type === 'multi');
    var ord = shuffledOrder(e, 'choiceOrd', src.choices.length);
    var wrap = el('div'); wrap.setAttribute('role', isMulti ? 'group' : 'radiogroup');
    src.choices.forEach(function(ch, ci){
      var row = el('label', 'opt');
      row.innerHTML = '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="ex' + pos() + '" value="' + ci + '">' +
        '<span>' + esc(ch.t) + '</span><span class="stat" aria-hidden="true"></span>';
      var input = row.querySelector('input');
      input.addEventListener('change', function(){
        if(isMulti){
          var picks = a.picks || (a.picks = []);
          if(input.checked){ if(picks.indexOf(ci) === -1) picks.push(ci); }
          else { var k = picks.indexOf(ci); if(k > -1) picks.splice(k, 1); }
        } else { a.pick = ci; }
        $all('.opt', wrap).forEach(function(r){ r.className = 'opt' + (r.querySelector('input').checked ? ' sel' : ''); });
      });
      if((isMulti ? (a.picks || []).indexOf(ci) !== -1 : a.pick === ci)){ input.checked = true; row.className += ' sel'; }
      wrap.appendChild(row);
      row.setAttribute('data-ci', ci);
    });
    box.appendChild(wrap);
  }
  else if(e.type === 'dd'){ renderDD(e, box, a); }
  else if(e.type === 'match'){ renderMatch(e, box, a); }
  else if(e.type === 'order'){ renderOrder(e, box, a); }
  else if(e.type === 'bank'){ renderBank(e, box, a); }
  else if(e.type === 'fib'){ renderFib(e, box, a); }
  else if(e.type === 'terminal'){ renderTerm(e, box, a); }
  else if(e.type === 'spot'){ renderSpot(e, box, a); }
  else if(e.type === 'branch'){ renderBranch(e, box, a); }
  else if(e.type === 'hotspot'){ renderHotspot(e, box, a); }
  else if(e.type === 'sim'){ renderSim(e, box, a); }
  else if(e.type === 'logviewer'){ renderAnswer(Object.assign({}, e.inner, { type: e.inner.type }), box); }
}
function shuffledOrder(e, key, n){
  var p = pos();
  if(!S.render) S.render = {};
  if(!S.render[p]) S.render[p] = {};
  if(!S.render[p][key]) S.render[p][key] = shuffle(Array.apply(null, { length: n }).map(Number.call, Number));
  return S.render[p][key].slice();
}

/* --- drag & drop --- */
function renderDD(e, box, a){
  a.place = a.place || {};
  var wrap = el('div', 'ddwrap');
  var pool = el('div', 'pool'); pool.setAttribute('aria-label', 'Item pool');
  var buckets = el('div', 'buckets');
  var itemOrd = shuffledOrder(e, 'itemOrd', e.items.length);
  itemOrd.forEach(function(ii){
    var chip = el('button', 'itemchip', esc(e.items[ii].t));
    chip.setAttribute('data-i', ii); chip.type = 'button';
    if(a.place[ii] != null && a.place[ii] !== -1) chip.style.display = 'none';
    chip.addEventListener('click', function(ev){
      if(ev.target.tagName === 'BUTTON' && ev.target !== chip) return;
      S.pickedItem = ii; $all('.itemchip', wrap).forEach(function(c){ c.className = 'itemchip'; });
      chip.className = 'itemchip picked';
    });
    attachDrag(chip, ii);
    pool.appendChild(chip);
  });
  e.buckets.forEach(function(b, bi){
    var bk = el('div', 'bucket'); bk.setAttribute('data-b', bi);
    bk.innerHTML = '<span class="bt">' + esc(b) + '</span><span class="placed"></span>';
    var placed = bk.querySelector('.placed');
    bk.setAttribute('tabindex', '0');
    bk.setAttribute('role', 'button');
    bk.setAttribute('aria-label', 'Drop zone: ' + b + ' (pick an item first, then press Enter here)');
    function placePicked(){
      if(S.pickedItem == null) return;
      if(a.place[S.pickedItem] != null && a.place[S.pickedItem] !== -1) return;
      a.place[S.pickedItem] = bi; var ii2 = S.pickedItem; S.pickedItem = null;
      showPoolItem(ii2, true); redraw();
      $all('.itemchip', wrap).forEach(function(c2){ c2.className = 'itemchip'; });
    }
    bk.addEventListener('keydown', function(ev){
      if(ev.key !== 'Enter' && ev.key !== ' ') return;
      ev.preventDefault(); placePicked();
    });
    function redraw(){
      placed.innerHTML = '';
      e.items.forEach(function(it, ii){
        if(a.place[ii] === bi){
          var c = el('span', 'itemchip', esc(it.t) + ' <button class="unplace" aria-label="Return ' + esc(it.t) + ' to the pool" title="Return to pool">&#10005;</button>');
          c.setAttribute('data-ii', String(ii));
          c.querySelector('.unplace').addEventListener('click', function(k){
            k.stopPropagation(); a.place[ii] = -1; redraw(); showPoolItem(ii);
          });
          placed.appendChild(c);
        }
      });
    }
    redraw();
    bk.addEventListener('click', placePicked);
    attachDrop(bk, bi, function(ii){
      a.place[ii] = bi; redraw(); showPoolItem(ii, true);
    });
    buckets.appendChild(bk);
  });
  function showPoolItem(ii, hide){
    var chip = pool.querySelector('[data-i="' + ii + '"]'); if(!chip) return;
    if(hide){ chip.style.display = 'none'; } else { chip.style.display = ''; chip.className = 'itemchip'; }
  }
  function refreshPool(){
    e.items.forEach(function(_, ii){ showPoolItem(ii, a.place[ii] != null && a.place[ii] !== -1); });
  }
  refreshPool();
  wrap.appendChild(pool); wrap.appendChild(buckets);
  box.appendChild(wrap);
}
function attachDrag(chip, ii){
  chip.addEventListener('pointerdown', function(ev){
    if(ev.button && ev.button !== 0) return;
    S.drag = { ii: ii, ghost: null, from: chip };
  });
}
function attachDrop(target, bi, onDrop){
  target.addEventListener('pointerup', function(ev){
    if(S.drag == null) return;
    var ii = S.drag.ii;
    S.drag = null; S.pickedItem = null;
    $all('.itemchip.picked').forEach(function(c){ c.className = 'itemchip'; });
    onDrop(ii);
  });
}
document.addEventListener('pointerup', function(){ if(S.drag){ S.drag = null; $all('.itemchip.picked').forEach(function(c){ c.className = 'itemchip'; }); } });

/* --- matching --- */
function renderMatch(e, box, a){
  a.sel = a.sel || {};
  var rightOrd = shuffledOrder(e, 'rightOrd', e.pairs.length);
  var rights = rightOrd.map(function(i){ return e.pairs[i].r; });
  var wrap = el('div', 'pairs');
  e.pairs.forEach(function(p, pi){
    var row = el('div', 'pair');
    row.innerHTML = '<span class="pl">' + esc(p.l) + '</span>';
    var sel = el('select'); sel.setAttribute('aria-label', 'Match for ' + p.l);
    sel.innerHTML = '<option value="">— choose —</option>' + rights.map(function(r){
      return '<option value="' + esc(r) + '"' + (a.sel[pi] === r ? ' selected' : '') + '>' + esc(r) + '</option>';
    }).join('');
    sel.addEventListener('change', function(){ a.sel[pi] = sel.value || null; });
    row.appendChild(sel);
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
}

/* --- ordering --- */
function renderOrder(e, box, a){
  if(!a.seq || a.seq.length !== e.list.length){
    a.seq = shuffledOrder(e, 'listOrd', e.list.length);
  }
  var wrap = el('div', 'ordlist'); wrap.setAttribute('aria-label', 'Ordered list');
  function redraw(){
    wrap.innerHTML = '';
    a.seq.forEach(function(ii, position){
      var row = el('div', 'ordrow');
      row.setAttribute('data-ii', ii);
      row.innerHTML = '<span class="num">' + (position + 1) + '</span><span class="txt">' + esc(e.list[ii]) + '</span>';
      var mv = el('span', 'mv');
      var up = el('button', '', '&#9650;'); up.type = 'button'; up.setAttribute('aria-label', 'Move up: ' + e.list[ii]);
      var dn = el('button', '', '&#9660;'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move down: ' + e.list[ii]);
      up.addEventListener('click', function(){ if(position > 0){ var t = a.seq[position - 1]; a.seq[position - 1] = a.seq[position]; a.seq[position] = t; redraw(); } });
      dn.addEventListener('click', function(){ if(position < a.seq.length - 1){ var t = a.seq[position + 1]; a.seq[position + 1] = a.seq[position]; a.seq[position] = t; redraw(); } });
      mv.appendChild(up); mv.appendChild(dn);
      row.appendChild(mv);
      attachDrag(row, position);
      row.addEventListener('pointerup', function(ev){
        if(S.drag == null || S.drag.from === row) return;
        var fromPos = S.drag.ii; S.drag = null;
        var toPos = position;
        var item = a.seq.splice(fromPos, 1)[0];
        a.seq.splice(toPos, 0, item);
        redraw();
      });
      wrap.appendChild(row);
    });
  }
  redraw();
  box.appendChild(wrap);
}

/* --- word bank fill --- */
function renderBank(e, box, a){
  a.sel = a.sel || {};
  var bankOrd = shuffledOrder(e, 'bankOrd', e.bank.length);
  var chips = el('div', 'bankchips');
  chips.innerHTML = '<span class="chip" style="background:transparent;border:none;padding-left:0">Word bank (shuffled):</span>' +
    bankOrd.map(function(i){ return '<span class="chip slotword">' + esc(e.bank[i]) + '</span>'; }).join('');

  box.appendChild(sent);
}

/* --- typed fill --- */
function renderFib(e, box, a){
  a.val = a.val || {};
  var wrap = el('div');
  e.parts.forEach(function(part, i){
    if(typeof part === 'string'){ wrap.appendChild(document.createTextNode(part)); }
    else {
      var inp = el('input'); inp.type = 'text'; inp.style.margin = '4px';
      inp.setAttribute('aria-label', 'Blank ' + (i + 1));
      inp.value = a.val[i] || '';
      inp.addEventListener('input', function(){ a.val[i] = inp.value; });
      wrap.appendChild(inp);
    }
  });
  box.appendChild(wrap);
}

/* --- terminal --- */
function renderTerm(e, box, a){
  a.cmds = a.cmds || [];
  var wrap = el('div', 'term');
  wrap.innerHTML = '<div class="thead">' + esc(e.terminal.host || 'analyst@pacs-site: ~') + ' — sandboxed fake shell (nothing here can touch a real system)</div>' +
    '<div class="tout" aria-live="polite"></div>' +
    '<div class="tin"><span class="pr">$</span><input type="text" aria-label="Terminal command input"></div>';
  var out = wrap.querySelector('.tout');
  var inp = wrap.querySelector('input');
  function print(html){ var d = el('div'); d.innerHTML = html; out.appendChild(d); out.scrollTop = out.scrollHeight; }
  function tasks(){
    print('<span class="sys">Tasks:</span>');
    e.terminal.steps.forEach(function(st, i){
      print('<span class="sys"> ' + (i + 1) + '. ' + esc(st.task) + '</span>');
    });
  }
  function solvedSet(){
    return e.terminal.steps.map(function(st, si){
      return (a.cmds || []).some(function(c){ return st.accept.some(function(rx){ return new RegExp(rx, 'i').test(c); }); }) ? si : -1;
    }).filter(function(x){ return x >= 0; });
  }
  print('<span class="sys">' + esc(e.terminal.banner || 'Fake shell ready. Type "tasks" to see your tasks. Press Check to grade.') + '</span>');
  tasks();
  a.cmds.forEach(function(c){ print('<span class="cmd">$ ' + esc(c) + '</span>'); });
  inp.addEventListener('keydown', function(ev){
    if(ev.key !== 'Enter') return;
    var v = inp.value.trim(); if(!v) return;
    inp.value = ''; a.cmds.push(v);
    print('<span class="cmd">$ ' + esc(v) + '</span>');
    var low = norm(v);
    if(low === 'tasks'){ tasks(); return; }
    if(low === 'clear'){ out.innerHTML = ''; return; }
    var solved = solvedSet();
    var hit = null;
    e.terminal.steps.forEach(function(st, si){
      if(hit || solved.indexOf(si) !== -1) return;
      if(st.accept.some(function(rx){ return new RegExp(rx, 'i').test(v); })){ hit = st; }
    });
    if(hit){ print('<span class="okc">' + esc(hit.sample || 'ok') + '</span>'); }
    else if(solved.length >= e.terminal.steps.length){ print('<span class="sys">All tasks already captured. Press Check to grade.</span>'); }
    else { print('<span class="sys">Unknown or incomplete command for the open tasks. Type "tasks" to review them.</span>'); }
  });
  box.appendChild(wrap);
  var note = el('p', 'kv', 'Commands recorded so far are graded when you press <b>Check</b>. The "reset" button clears your command history.');
  box.appendChild(note);
  var rb = el('button', 'btn small ghost', 'Reset terminal history');
  rb.type = 'button';
  rb.addEventListener('click', function(){ a.cmds = []; out.innerHTML = ''; print('<span class="sys">History cleared.</span>'); tasks(); });
  box.appendChild(rb);
}

/* --- spot the mistake --- */
function renderSpot(e, box, a){
  a.picked = a.picked || [];
  var wrap = el('div', 'spotlines');
  e.spot.lines.forEach(function(l, li){
    var b = el('button', 'spotline', '<span class="kick">' + (a.picked.indexOf(li) !== -1 ? '&#9888;' : '&nbsp;') + '</span><span>' + esc(l) + '</span>');
    b.type = 'button';
    if(a.picked.indexOf(li) !== -1) b.className += ' sel';
    b.addEventListener('click', function(){
      var k = a.picked.indexOf(li);
      if(k === -1){ a.picked.push(li); b.className += ' sel'; b.querySelector('.kick').innerHTML = '&#9888;'; }
      else { a.picked.splice(k, 1); b.className = b.className.replace(' sel', ''); b.querySelector('.kick').innerHTML = '&nbsp;'; }
    });
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  box.appendChild(el('p', 'kv', 'Click a line to flag it (the &#9888; marker appears). Click again to unflag.'));
}

/* --- branching --- */
function renderBranch(e, box, a){
  a.decisions = a.decisions || [];
  var nodeId = e.branch.start;
  for(var d = 0; d < a.decisions.length; d++){
    var node = e.branch.nodes[nodeId];
    nodeId = node.opts[a.decisions[d].opt].next;
  }
  if(nodeId){
    var node = e.branch.nodes[nodeId];
    var n = el('div', 'bnode', '<b>Step ' + (a.decisions.length + 1) + ':</b> ' + node.sit);
    box.appendChild(n);
    node.opts.forEach(function(op, oi){
      var b = el('button', 'opt', '<span>' + esc(op.t) + '</span>');
      b.type = 'button'; b.style.width = '100%'; b.style.textAlign = 'left';
      b.addEventListener('click', function(){
        a.decisions.push({ node: nodeId, opt: oi, ok: !!op.ok });
        renderExercise();
      });
      box.appendChild(b);
    });
  } else {
    box.appendChild(el('p', 'kv', '<b>End of the scenario.</b> Press <b>Check</b> to grade your decisions. Use <b>Revise</b> to restart the scenario.'));
  }
}

/* --- hotspot --- */
function renderHotspot(e, box, a){

/* ---------- hints ---------- */
function showHints(e, hb){
  var n = S.hints[pos()] || 0;
  var out = '';
  for(var i = 0; i < n && i < e.hints.length; i++){ out += '<div><b>Hint ' + (i + 1) + ':</b> ' + e.hints[i] + '</div>'; }
  if(n >= e.hints.length){ out += '<div><b>No more hints for this exercise.</b></div>'; }
  hb.innerHTML = out;
}
function doHint(){
  var e = ex();
  if(S.checked[pos()] && !S.unlocked[pos()]) return;
  S.hints[pos()] = (S.hints[pos()] || 0) + 1;
  var hb = $('#hintbox');
  if(!hb){ hb = el('div', 'hintbox'); hb.id = 'hintbox'; $('#exinner').insertBefore(hb, $('#feedback')); }
  showHints(e, hb);
  if(S.checked[pos()]) recomputeChecked(pos());
}

/* ---------- check / revise ---------- */
function doCheck(){
  var p = pos(), e = ex();
  S.unlocked[p] = false;
  S.skipped[p] = false;
  S.checked[p] = grade(e, p);
  S.checkPause = true;
  recomputeScore();
  showFeedback(p, true);
  applyLock();
  renderNav(); renderScore(); renderProgress(); updatePauseUI();
}
function doRevise(){
  var p = pos();
  if(!S.checked[p]) return;
  S.unlocked[p] = true;
  var e = ex(p);
  if(e.type === 'branch' && S.answers[p]){ S.answers[p].decisions = []; }
  renderExercise();
  var fb = $('#feedback'); if(fb) fb.className = 'feedback hidden';
  var inner = $('#exinner');
  var note = el('div', 'hintbox', '<b>Answer unlocked.</b> Change it, then press <b>Check</b> again to re-grade. The timer rules apply on every Check.');
  inner.insertBefore(note, $('#feedback'));
}
function recomputeChecked(p){
  var e = ex(p);
  S.checked[p] = grade(e, p);
  recomputeScore();
  if(p === pos()) showFeedback(p, true);
  renderNav(); renderScore();
}
function recomputeScore(){
  var sum = 0;
  Object.keys(S.checked).forEach(function(p){
    sum += Math.max(0, S.checked[p].rawEarned - 0.1 * ex(Number(p)).points * (S.hints[p] || 0));
  });
  S.score = sum;
}

/* ---------- grading ---------- */
function grade(e, p){
  var a = S.answers[p] || {};
  var r = { elsTotal: 1, elsEarned: 0, rows: [], rawEarned: 0, label: 'zero' };
  var type = e.type === 'logviewer' ? e.inner.type : e.type;
  if(type === 'qcm'){
    var okIdx = e.type === 'logviewer' ? e.inner.choices.map(function(c, i){ return c.ok ? i : -1; }).filter(function(x){ return x >= 0; })
                                     : e.choices.map(function(c, i){ return c.ok ? i : -1; }).filter(function(x){ return x >= 0; });
    var choices = e.type === 'logviewer' ? e.inner.choices : e.choices;
    r.elsTotal = 1;
    if(a.pick != null && okIdx.indexOf(a.pick) !== -1){ r.elsEarned = 1; r.rows.push({ txt: 'You chose: "' + choices[a.pick].t + '" — correct.', st: 'ok' }); }
    else if(a.pick != null){ r.rows.push({ txt: 'You chose: "' + choices[a.pick].t + '" — wrong. Correct: "' + choices[okIdx[0]].t + '".', st: 'bad' }); }
    else { r.rows.push({ txt: 'No answer chosen. Correct: "' + choices[okIdx[0]].t + '".', st: 'miss' }); }
  }
  else if(type === 'multi'){
    var choices = e.type === 'logviewer' ? e.inner.choices : e.choices;
    var okIdx = choices.map(function(c, i){ return c.ok ? i : -1; }).filter(function(x){ return x >= 0; });
    r.elsTotal = okIdx.length;
    var picks = a.picks || [];
    choices.forEach(function(c, i){
      var chosen = picks.indexOf(i) !== -1, isOk = c.ok;
      if(isOk && chosen){ r.elsEarned++; r.rows.push({ txt: 'Correctly selected: "' + c.t + '".', st: 'ok' }); }
      else if(isOk && !chosen){ r.rows.push({ txt: 'Missed: "' + c.t + '" (this was true).', st: 'miss' }); }
      else if(!isOk && chosen){ r.rows.push({ txt: 'Wrongly selected: "' + c.t + '" (this was false). It earns nothing, but your correct picks still count.', st: 'bad' }); }
    });
  }
  else if(type === 'dd'){
    r.elsTotal = e.items.length;
    e.items.forEach(function(it, ii){
      var placed = a.place ? a.place[ii] : null;
      if(placed === it.b){ r.elsEarned++; r.rows.push({ txt: '"' + it.t + '" &rarr; "' + e.buckets[it.b] + '" — correct.', st: 'ok' }); }
      else if(placed == null || placed === -1){ r.rows.push({ txt: '"' + it.t + '" was not placed. It belongs to: "' + e.buckets[it.b] + '".', st: 'miss' }); }
      else { r.rows.push({ txt: '"' + it.t + '" &rarr; "' + e.buckets[placed] + '" — wrong. Correct bucket: "' + e.buckets[it.b] + '".', st: 'bad' }); }
    });
  }
  else if(type === 'match'){
    r.elsTotal = e.pairs.length;
    e.pairs.forEach(function(pr, pi){
      var chosen = a.sel ? a.sel[pi] : null;
      if(chosen === pr.r){ r.elsEarned++; r.rows.push({ txt: '"' + pr.l + '" &rarr; "' + pr.r + '" — correct.', st: 'ok' }); }
      else if(!chosen){ r.rows.push({ txt: '"' + pr.l + '": nothing chosen. Correct: "' + pr.r + '".', st: 'miss' }); }
      else { r.rows.push({ txt: '"' + pr.l + '" &rarr; "' + chosen + '" — wrong. Correct: "' + pr.r + '".', st: 'bad' }); }
    });
  }
  else if(type === 'order'){
    r.elsTotal = e.list.length;
    (a.seq || []).forEach(function(ii, position){
      if(ii === position){ r.elsEarned++; }
      r.rows.push({ txt: (position + 1) + '. You placed: "' + e.list[ii] + '"' + (ii === position ? ' — correct position.' : ' — should be: "' + e.list[position] + '".'), st: ii === position ? 'ok' : 'bad' });
    });
  }
  else if(type === 'bank' || type === 'fib'){
    var partsSrc = e.type === 'logviewer' ? e.inner.parts : e.parts;
    var slots = [];
    partsSrc.forEach(function(part, i){ if(typeof part !== 'string') slots.push({ i: i, accept: part.accept }); });
    r.elsTotal = slots.length;
    slots.forEach(function(sl){
      var given = type === 'bank' ? (a.sel ? a.sel[sl.i] : null) : (a.val ? a.val[sl.i] : null);
      var good = given != null && sl.accept.some(function(w){ return norm(w) === norm(given); });
      if(good){ r.elsEarned++; r.rows.push({ txt: 'Blank ' + (sl.i + 1) + ': "' + given + '" — correct.', st: 'ok' }); }
      else if(!given){ r.rows.push({ txt: 'Blank ' + (sl.i + 1) + ': empty. Accepted: ' + sl.accept.map(function(w){ return '"' + w + '"'; }).join(' or ') + '.', st: 'miss' }); }
      else { r.rows.push({ txt: 'Blank ' + (sl.i + 1) + ': "' + given + '" — not accepted. Accepted: ' + sl.accept.map(function(w){ return '"' + w + '"'; }).join(' or ') + '.', st: 'bad' }); }
    });
  }
  else if(type === 'terminal'){
    r.elsTotal = e.terminal.steps.length;
    e.terminal.steps.forEach(function(st, si){
      var solved = (a.cmds || []).some(function(c){ return st.accept.some(function(rx){ return new RegExp(rx, 'i').test(c); }); });
      if(solved){ r.elsEarned++; r.rows.push({ txt: 'Task ' + (si + 1) + ' solved (' + st.task + '). Example: <code>' + esc(st.example) + '</code>', st: 'ok' }); }
      else { r.rows.push({ txt: 'Task ' + (si + 1) + ' not solved: ' + st.task + ' Example: <code>' + esc(st.example) + '</code>', st: 'miss' }); }
    });
  }
  else if(type === 'spot'){
    r.elsTotal = e.spot.bad.length;
    (a.picked || []).forEach(function(li){
      if(e.spot.bad.indexOf(li) !== -1){ r.elsEarned++; r.rows.push({ txt: 'Correctly flagged: "' + e.spot.lines[li] + '".', st: 'ok' }); }
      else { r.rows.push({ txt: 'Wrongly flagged: "' + e.spot.lines[li] + '" — this line is fine.', st: 'bad' }); }
    });
    e.spot.bad.forEach(function(li){
      if((a.picked || []).indexOf(li) === -1){ r.rows.push({ txt: 'Missed the faulty line: "' + e.spot.lines[li] + '".', st: 'miss' }); }
    });
  }
  else if(type === 'branch'){
    r.elsTotal = e.branch.expected;
    var counted = 0;
    (a.decisions || []).forEach(function(d){
      var node = e.branch.nodes[d.node];
      if(node.opts.length === 1) return; /* forced continuation after a wrong call — not scored */
      counted++;
      var op = node.opts[d.opt];
      if(d.ok){ r.elsEarned++; r.rows.push({ txt: 'Decision ' + counted + ': "' + op.t + '" — good call.', st: 'ok' }); }
      else { r.rows.push({ txt: 'Decision ' + counted + ': "' + op.t + '" — not the best call. Better: "' + (node.opts.filter(function(o){ return o.ok; })[0] || {}).t + '".', st: 'bad' }); }
    });
    for(var missD = counted; missD < e.branch.expected; missD++){ r.rows.push({ txt: 'Decision ' + (missD + 1) + ' was not completed.', st: 'miss' }); }
  }
  else if(type === 'hotspot'){
    r.elsTotal = 1;
    var okz = e.hotspot.zones.filter(function(z){ return z.ok; })[0];
    if(a.zone && a.zone === okz.id){ r.elsEarned = 1; r.rows.push({ txt: 'You picked ' + a.zone + ' (' + okz.label + ') — correct.', st: 'ok' }); }
    else if(a.zone){ var zl = e.hotspot.zones.filter(function(z){ return z.id === a.zone; })[0]; r.rows.push({ txt: 'You picked ' + a.zone + ' (' + (zl ? zl.label : '') + ') — wrong. Correct: ' + okz.id + ' (' + okz.label + ').', st: 'bad' }); }
    else { r.rows.push({ txt: 'Nothing picked. Correct: ' + okz.id + ' (' + okz.label + ').', st: 'miss' }); }
  }
  else if(type === 'sim'){
    r.elsTotal = e.sim.alerts.length;
    e.sim.alerts.forEach(function(al, ai){
      var chosen = a.pick ? a.pick[ai] : null;
      var okOpt = al.opts.map(function(o, i){ return o.ok ? i : -1; }).filter(function(x){ return x >= 0; })[0];
      if(chosen == null){ r.rows.push({ txt: al.title + ': no action chosen. Best: "' + al.opts[okOpt].t + '".', st: 'miss' }); }
      else if(al.opts[chosen].ok){ r.elsEarned++; r.rows.push({ txt: al.title + ': "' + al.opts[chosen].t + '" — correct.', st: 'ok' }); }
      else { r.rows.push({ txt: al.title + ': "' + al.opts[chosen].t + '" — not the best action. Best: "' + al.opts[okOpt].t + '".', st: 'bad' }); }
    });
  }
  r.rawEarned = (Math.min(r.elsEarned, r.elsTotal) / r.elsTotal) * e.points;
  r.label = Math.min(r.elsEarned, r.elsTotal) >= r.elsTotal ? 'full' : (r.elsEarned > 0 ? 'partial' : 'zero');
  return r;
}

/* ---------- feedback ---------- */
function showFeedback(p, animate){
  var e = ex(p), c = S.checked[p]; if(!c) return;
  var fb = $('#feedback');
  if(p !== pos()){ return; }
  fb.className = 'feedback';
  var hintsCost = 0.1 * e.points * (S.hints[p] || 0);
  var earned = Math.max(0, c.rawEarned - hintsCost);
  var lblTxt = c.label === 'full' ? 'FULL' : c.label === 'partial' ? 'PARTIAL' : 'ZERO';
  var lblStyle = c.label === 'full' ? 'background:#143d2b;color:var(--ok);border:1px solid var(--ok)' :
                  (c.label === 'partial' ? 'background:#3a2f10;color:var(--warn);border:1px solid var(--warn)' : 'background:#43202a;color:var(--bad);border:1px solid var(--bad)');
  var html = '<div class="fhead">' +
    '<span class="badge" style="' + lblStyle + '">' + lblTxt + '</span>' +
    '<span class="scoreline">Earned ' + (Math.round(earned * 10) / 10) + ' / ' + e.points + ' points' +
    (hintsCost > 0 ? ' (after &minus;' + (Math.round(hintsCost * 10) / 10) + ' for hints)' : '') + '</span>' +
    '<span class="chip">' + c.elsEarned + ' of ' + c.elsTotal + ' correct parts</span>' +
    '</div>';
  html += '<ul class="elemlist" aria-live="polite">' + c.rows.map(function(rw){
    return '<li class="' + rw.st + '">' + (rw.st === 'ok' ? '&#10003; ' : rw.st === 'bad' ? '&#10007; ' : '&#9888; ') + rw.txt + '</li>';
  }).join('') + '</ul>';
  html += '<div class="explain"><h3>Why — explained simply</h3>' + e.explain + '</div>';
  fb.innerHTML = html;
  markControls(e, p, c);
  fb.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
}
function markControls(e, p, c){
  var box = $('.ansbox'); if(!box || p !== pos()) return;
  var type = e.type === 'logviewer' ? e.inner.type : e.type;
  if(type === 'qcm' || type === 'multi'){
    var choices = e.type === 'logviewer' ? e.inner.choices : e.choices;
    var isQcm = (type === 'qcm');
    $all('.opt', box).forEach(function(row){
      var ci = Number(row.getAttribute('data-ci'));
      var ch = choices[ci]; if(!ch) return;
      var st = row.querySelector('.stat');
      if(ch.ok && row.querySelector('input').checked){ row.className = 'opt mk-ok'; st.textContent = '\u2713 correct'; st.className = 'stat ok'; }
      else if(ch.ok){ row.className = 'opt mk-miss'; st.textContent = isQcm ? 'correct answer' : '! missed'; st.className = 'stat miss'; }
      else if(!ch.ok && row.querySelector('input').checked){ row.className = 'opt mk-bad'; st.textContent = '\u2715 wrong'; st.className = 'stat bad'; }
      else { row.className = 'opt'; st.textContent = ''; st.className = 'stat'; }
    });
  }
  else if(type === 'dd'){
    var a = S.answers[p] || {};
    $all('.bucket', box).forEach(function(bk){
      var bi = Number(bk.getAttribute('data-b'));
      $all('.placed .itemchip', bk).forEach(function(chip){
        var ii = Number(chip.getAttribute('data-ii'));
        var it = e.items[ii]; if(!it) return;
        chip.classList.remove('mk-ok', 'mk-bad');
        chip.classList.add(it.b === bi ? 'mk-ok' : 'mk-bad');
      });
    });
  }
  else if(type === 'order'){
    var a2 = S.answers[p] || {};
    $all('.ordrow', box).forEach(function(row, position){
      var ii = Number(row.getAttribute('data-ii'));
      row.className = 'ordrow ' + (ii === position ? 'mk-ok' : 'mk-bad');
    });
  }
  else if(type === 'spot'){
    $all('.spotline', box).forEach(function(b, li){
      var picked = (S.answers[p].picked || []).indexOf(li) !== -1;
      var isBad = e.spot.bad.indexOf(li) !== -1;
      b.classList.remove('mk-ok', 'mk-bad');
      if(picked && isBad) b.classList.add('mk-ok');
      else if(picked && !isBad) b.classList.add('mk-bad');
    });
  }
  else if(type === 'hotspot'){
    var svg = $('.hs svg', box);
    if(svg){
      var okz = e.hotspot.zones.filter(function(z){ return z.ok; })[0];
      $all('[data-zone]', svg).forEach(function(z){
        z.classList.remove('mk-ok', 'mk-bad');
        var id = z.getAttribute('data-zone');
        if(id === okz.id) z.classList.add('mk-ok');
        else if(id === (S.answers[p].zone)) z.classList.add('mk-bad');
      });
    }
  }
}

/* ---------- results ---------- */
function submitExam(fromButton){
  if(S.finished) return;
  var answered = [];
  for(var i = 0; i < S.order.length; i++){ if(S.checked[i]) answered.push(i); }
  if(answered.length === 0){
    warnAllSkipped();
    return;
  }
  finishExam();
}
function warnAllSkipped(){
  var tb = $('#submitBtn'); if(tb){ tb.className = 'btn ghost small shake'; setTimeout(function(){ tb.className = 'btn ghost small'; }, 400); }
  alert('You have not answered any exercise yet (everything is skipped or untouched). Answer at least one exercise before submitting.');
}
function finishExam(){
  if(S.finished) return;
  var answered0 = [];
  for(var j = 0; j < S.order.length; j++){ if(S.checked[j]) answered0.push(j); }
  if(answered0.length === 0){
    S.timeUpWarned = true;
    warnAllSkipped();
    return;
  }
  S.finished = true; S.running = false; S.manualPause = false; S.checkPause = false;
  var skippedPos = [], notAnswered = [], answered = [];
  for(var k = 0; k < S.order.length; k++){
    if(S.checked[k]) answered.push(k);
    else if(S.skipped[k]) skippedPos.push(k);
    else notAnswered.push(k);
  }
  var earnedPts = 0, totalPts = 0;
  answered.forEach(function(p){
    var c = S.checked[p];
    var e = ex(p);
    totalPts += e.points;
    earnedPts += Math.max(0, c.rawEarned - 0.1 * e.points * (S.hints[p] || 0));
  });
  var sentScore = Math.round(earnedPts / 10);
  var sentTotal = answered.length;
  var percent = sentTotal > 0 ? Math.round((sentScore / sentTotal) * 100) : 0;
  var passed = percent >= META.passMark;
  showResults(skippedPos, notAnswered, answered, earnedPts, totalPts, sentScore, sentTotal, percent, passed);
  if(!S.reported){ reportScore(sentScore, sentTotal); S.reported = true; }
}
function reportScore(correct, total){
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({ type: 'CYBERPULSE_SCORE', topicId: TOPIC_ID, score: correct, total: total, percent: percent, passed: percent >= META.passMark }, location.origin);
  } catch(e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}
function showResults(skippedPos, notAnswered, answered, earnedPts, totalPts, sentScore, sentTotal, percent, passed){
  $('#app').innerHTML = '';
  var app = $('#app');
  var head = el('div', 'card');
  head.innerHTML = '<h1>Results — ' + esc(META.title) + '</h1>' +
    '<div class="bigscore">' + (Math.round(earnedPts * 10) / 10) + ' / ' + totalPts + ' <span style="font-size:1.3rem;color:var(--muted)">pts</span></div>' +
    '<div class="bigscore" style="font-size:2rem">' + percent + '%</div>' +
    '<p style="text-align:center;color:var(--muted)">Computed over the <b>' + answered.length + '</b> answered exercises (skipped or never-answered ones are excluded from points and from the maximum). Reported to the platform as ' + sentScore + '/' + sentTotal + '.</p>';
  app.appendChild(head);
  var verdict = el('div', passed ? 'passpanel' : 'failpanel');
  verdict.innerHTML = passed ?
    '<div class="verdict" style="color:var(--ok)">&#10003; PASS</div>' +
    '<p style="font-size:1.05rem">Well done — you reached the ' + META.passMark + '% pass mark.</p>' +
    '<div class="card" style="display:inline-block;text-align:left;margin-top:10px;border-color:var(--ok)">' +
      '<h2 style="margin-top:0">Module certificate</h2>' +
      '<p style="margin:.2rem 0"><b>Candidate:</b> ' + esc(S.username || 'Anonymous learner') + '</p>' +
      '<p style="margin:.2rem 0"><b>Module:</b> CompTIA Network+ (N10-009) — Objective 4.2<br>Physical security: cameras and locks</p>' +
      '<p style="margin:.2rem 0"><b>Level:</b> ' + META.label + ' &middot; <b>Score:</b> ' + percent + '% &middot; Attempt ' + S.attempt + '</p>' +
    '</div>'
    :
    '<div class="verdict" style="color:var(--bad)">&#10007; FAIL — ' + percent + '%</div>' +
    '<p>You needed ' + META.passMark + '%. Read the report below, then retake the exam — questions and answers will be reshuffled.</p>';
  app.appendChild(verdict);
  var retake = el('p'); retake.style.textAlign = 'center';
  var rb = el('button', 'btn primary', 'Retake exam'); rb.id = 'retakeBtn';
  rb.addEventListener('click', function(){ startExam(); });
  retake.appendChild(rb);
  app.appendChild(retake);
  if(skippedPos.length){
    var sk = el('div', 'card');
    sk.innerHTML = '<h2>Skipped exercises (' + skippedPos.length + ') — not counted</h2>' +
      '<p style="color:var(--warn)">&#9888; These were skipped and are excluded from both your score and the maximum. Their explanations are shown so you can still learn from them.</p>';
    skippedPos.forEach(function(p){ sk.appendChild(reportCard(p, true)); });    app.appendChild(sk);
  }
  if(notAnswered.length){
    var na = el('div', 'card');
    na.innerHTML = '<h2>Never answered (' + notAnswered.length + ') — not counted</h2>' +
      '<p style="color:var(--warn)">&#9888; These were never answered before the exam ended, so they are excluded from both your score and the maximum. Their explanations are shown so you can still learn from them.</p>';
    notAnswered.forEach(function(p){ na.appendChild(reportCard(p, true, true)); });    app.appendChild(na);
  }
  var rep = el('div', 'card');
  rep.innerHTML = '<h2>Full report — every exercise</h2>';
  for(var rp = 0; rp < S.order.length; rp++){ rep.appendChild(reportCard(rp, skippedPos.indexOf(rp) !== -1, !S.checked[rp] && skippedPos.indexOf(rp) === -1)); }
  app.appendChild(rep);
  var retake2 = el('p'); retake2.style.textAlign = 'center';
  var rb2 = el('button', 'btn primary', 'Retake exam');
  rb2.addEventListener('click', function(){ startExam(); });
  retake2.appendChild(rb2);
  app.appendChild(retake2);
  window.scrollTo(0, 0);
}
function givenText(p){
  var e = ex(p), a = S.answers[p] || {};
  var type = e.type === 'logviewer' ? e.inner.type : e.type;
  switch(type){
    case 'qcm': { var ch = e.type === 'logviewer' ? e.inner.choices : e.choices; return a.pick == null ? '—' : '"' + ch[a.pick].t + '"'; }
    case 'multi': { var ch2 = e.type === 'logviewer' ? e.inner.choices : e.choices; return (a.picks || []).length ? a.picks.map(function(i){ return '"' + ch2[i].t + '"'; }).join(', ') : '—'; }
    case 'dd': { if(!a.place) return '—'; return e.items.map(function(it, i){ return '"' + it.t + '" &rarr; ' + (a.place[i] != null && a.place[i] !== -1 ? '"' + e.buckets[a.place[i]] + '"' : '(not placed)'); }).join('; '); }
    case 'match': { if(!a.sel) return '—'; return e.pairs.map(function(pr, i){ return '"' + pr.l + '" &rarr; ' + (a.sel[i] ? '"' + a.sel[i] + '"' : '—'); }).join('; '); }
    case 'order': { return (a.seq || []).map(function(ii, position){ return (position + 1) + '. ' + e.list[ii]; }).join('; ') || '—'; }
    case 'bank': { if(!a.sel) return '—'; return Object.keys(a.sel).map(function(k){ return 'Blank ' + (Number(k) + 1) + ': ' + (a.sel[k] || '—'); }).join(', '); }
    case 'fib': { if(!a.val) return '—'; return Object.keys(a.val).map(function(k){ return 'Blank ' + (Number(k) + 1) + ': ' + (a.val[k] || '—'); }).join(', '); }
    case 'terminal': { return (a.cmds || []).length ? a.cmds.map(function(c){ return '<code>' + esc(c) + '</code>'; }).join('<br>') : '—'; }
    case 'spot': { return (a.picked || []).length ? a.picked.map(function(i){ return '"' + e.spot.lines[i] + '"'; }).join(', ') : '—'; }
    case 'branch': { return (a.decisions || []).length ? a.decisions.map(function(d, i){ return 'Step ' + (i + 1) + ': "' + e.branch.nodes[d.node].opts[d.opt].t + '"'; }).join('; ') : '—'; }
    case 'hotspot': { return a.zone ? e.hotspot.zones.filter(function(z){ return z.id === a.zone; })[0].label : '—'; }
    case 'sim': { if(!a.pick) return '—'; return e.sim.alerts.map(function(al, i){ return al.title + ': ' + (a.pick[i] != null ? '"' + al.opts[a.pick[i]].t + '"' : '—'); }).join('; '); }
    default: return '—';
  }
}
function solutionText(p){
  var e = ex(p);
  var type = e.type === 'logviewer' ? e.inner.type : e.type;
  switch(type){
    case 'qcm': { var ch = e.type === 'logviewer' ? e.inner.choices : e.choices; return '"' + ch.filter(function(c){ return c.ok; })[0].t + '"'; }
    case 'multi': { var ch2 = e.type === 'logviewer' ? e.inner.choices : e.choices; return ch2.filter(function(c){ return c.ok; }).map(function(c){ return '"' + c.t + '"'; }).join(', '); }
    case 'dd': return e.items.map(function(it){ return '"' + it.t + '" &rarr; "' + e.buckets[it.b] + '"'; }).join('; ');
    case 'match': return e.pairs.map(function(pr){ return '"' + pr.l + '" &rarr; "' + pr.r + '"'; }).join('; ');
    case 'order': return e.list.map(function(t, i){ return (i + 1) + '. ' + t; }).join('; ');
    case 'bank': case 'fib': { var partsSrc = e.type === 'logviewer' ? e.inner.parts : e.parts; var out = []; partsSrc.forEach(function(part, i){ if(typeof part !== 'string') out.push('Blank ' + (i + 1) + ': ' + part.accept.join(' / ')); }); return out.join(', '); }
    case 'terminal': return e.terminal.steps.map(function(st, i){ return 'Task ' + (i + 1) + ': <code>' + esc(st.example) + '</code>'; }).join('<br>');
    case 'spot': return e.spot.bad.map(function(li){ return '"' + e.spot.lines[li] + '"'; }).join('; ');
    case 'branch': { var nodeId = e.branch.start, out2 = []; var guard = 0; while(nodeId && guard++ < 20){ var node = e.branch.nodes[nodeId]; var okOpt = node.opts.filter(function(o){ return o.ok; })[0]; out2.push(okOpt.t); nodeId = okOpt.next; } return out2.join(' &rarr; '); }
    case 'hotspot': { var okz = e.hotspot.zones.filter(function(z){ return z.ok; })[0]; return okz.id + ' — ' + okz.label; }
    case 'sim': return e.sim.alerts.map(function(al){ var okI = al.opts.map(function(o, i){ return o.ok ? i : -1; }).filter(function(x){ return x >= 0; })[0]; return al.title + ': "' + al.opts[okI].t + '"'; }).join('; ');
    default: return '—';
  }
}
function reportCard(p, isSkipped, isUnanswered){
  var e = ex(p);
  var idx = p + 1;
  var c = S.checked[p];
  var card = el('div', 'rcard');
  var label = isSkipped ? 'SKIPPED' : (isUnanswered ? 'NOT ANSWERED' : (c ? c.label.toUpperCase() : 'NOT ANSWERED'));
  var lblColor = (isSkipped || isUnanswered) ? 'lb-skipped' : (c ? (c.label === 'full' ? 'lb-full' : c.label === 'partial' ? 'lb-partial' : 'lb-zero') : 'lb-skipped');
  var earnedTxt = '';
  if(!isSkipped && !isUnanswered && c){
    var earned = Math.max(0, c.rawEarned - 0.1 * e.points * (S.hints[p] || 0));
    earnedTxt = (Math.round(earned * 10) / 10) + ' / ' + e.points + ' pts &middot; ';
  }
  if(isSkipped) earnedTxt = 'excluded from scoring &middot; ';
  if(isUnanswered) earnedTxt = '0 / ' + e.points + ' pts &middot; excluded from scoring &middot; ';
  card.innerHTML =
    '<div class="rhead"><span class="rtitle">' + idx + '. ' + esc(e.title) + '</span>' +
    '<span class="' + lblColor + '" style="font-weight:800">' + label + ' — ' + earnedTxt + esc(TYPE_LABEL[e.type]) + '</span></div>' +
    '<div class="kv"><b>Your answer:</b> ' + givenText(p) + '</div>' +
    '<div class="kv"><b>Correct answer:</b> ' + solutionText(p) + '</div>' +
    '<div class="kv"><b>Keywords:</b> ' + e.kw.map(esc).join(', ') + '</div>' +
    '<details><summary>Show the explanation</summary><div class="explain">' + e.explain + '</div></details>';
  return card;
}

/* ---------- site handshake ---------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  try {
    if(event.data.username) S.username = String(event.data.username).slice(0, 40);
    var chip = $('#toolbar .chip');
    if(S.username && $('#toolbar') && !chip){
      var sp = el('span', 'chip', 'Candidate: <b>' + esc(S.username) + '</b>');
      $('#toolbar').insertBefore(sp, $('#submitBtn'));
    }
  } catch(e) { /* ignore handshake problems */ }
});

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded', function(){ screenIntro(); });

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
