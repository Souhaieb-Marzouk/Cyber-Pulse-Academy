function short(nid){ return nid.toUpperCase(); }
function selectChip(btn, oi){ $$('.bchip').forEach(function(b){b.classList.remove('sel');}); btn.classList.add('sel'); S._sel=oi; }
function placeBucket(st, oi, bi){ if(st.checked && !st.revising) return; st.ans[oi]=bi; S._sel=null; renderAns(st); }
function placeMatch(st, li, ci){ if(st.checked && !st.revising) return; if(st.ans.indexOf(ci)>=0){ var old=st.ans.indexOf(ci); st.ans[old]=null; } st.ans[li]=ci; S._sel=null; renderAns(st); }
function termEcho(st, ti, cmd){
  var tbody = $('#termBody'); if(!tbody) return;
  tbody.appendChild(el('div','tcmd', '$ '+esc(cmd)));
  var t = st.ex.tasks[ti];
  var rx = taskRx(t);
  if(cmd && rx && rx.test(cmd.replace(/\[\.\]/g,'.'))){ tbody.appendChild(el('div','to', esc(t.out))); }
  tbody.scrollTop = tbody.scrollHeight;
}
function taskRx(t){
  if(!t.re) return null;
  if(!t._rx){ t._rx = new RegExp(t.re.split('[.]').join('\\.'), 'i'); }
  return t._rx;
}
function pathComplete(st){
  var ex=st.ex, p=st.ans||[];
  if(!p.length) return false;
  var cur=ex.tree.start;
  for(var i=0;i<p.length;i++){
    var n=ex.tree.nodes[p[i].node];
    if(!n || !n.opts) return false;
    var o=n.opts[p[i].opt];
    if(!o || !o.next) return false;
    cur=o.next;
  }
  var last=ex.tree.nodes[cur];
  return !!(last && last.end);
}

/* framework part C — grading, actions, results, reporting */
'use strict';

function gradeEx(st){
  var ex=st.ex, a=st.ans;
  var parts=[], map={};
  var earn=0, total=ex.points;
  function setE(n, d){ earn = total*(n/d); }
  if(ex.type==='qcm'){
    var ok = a===ex.correct;
    if(a!=null) map[a] = ok?'ok':'bad';
    map[ex.correct]= ok?'ok':'miss';
    parts.push({label: a==null?'(no answer)':ex.choices[a], verdict: ok?'ok':'bad', note: ok?'':'The correct choice is: '+ex.choices[ex.correct]});
    earn = ok? total:0;
  }
  else if(ex.type==='multi'){
    var ch = a||[]; var nOk=0;
    ex.correct.forEach(function(ci){
      var got = ch.indexOf(ci)>=0;
      map[ci]= got?'ok':'miss'; if(got)nOk++;
      parts.push({label: ex.choices[ci], verdict: got?'ok':'miss', note: got?'Correct pick':'You missed this correct item'});
    });
    ex.choices.forEach(function(t,ci){ if(ex.correct.indexOf(ci)<0 && ch.indexOf(ci)>=0){ map[ci]='bad'; parts.push({label:t, verdict:'bad', note:'This is a distractor — it does not belong'}); } });
    setE(nOk, ex.correct.length);
  }
  else if(ex.type==='spot'){
    var ch2=a||[], nOk2=0, wrongSet=ex.multi?ex.wrong:[ex.wrong[0]];
    wrongSet.forEach(function(wi){
      var got=ch2.indexOf(wi)>=0; map[wi]=got?'ok':'miss'; if(got)nOk2++;
      parts.push({label:'Line: '+ex.lines[wi].slice(0,80), verdict:got?'ok':'miss', note:got?'That is the mistake':'This line is the mistake you missed'});
    });
    ch2.forEach(function(ci){ if(wrongSet.indexOf(ci)<0){ map[ci]='bad'; parts.push({label:'Line: '+ex.lines[ci].slice(0,80), verdict:'bad', note:'That line is actually fine'}); } });
    setE(nOk2, wrongSet.length);
  }
  else if(ex.type==='buckets'){
    var n=0;
    ex.items.forEach(function(it, i){
      var ok = a[i]===it.b;
      if(ok)n++;
      map[i]= ok?'ok':'bad';
      parts.push({label:it.t, verdict: ok?'ok':'bad', note: ok? '→ '+ex.buckets[it.b] : '→ belongs in "'+ex.buckets[it.b]+'"'});
    });
    setE(n, ex.items.length);
  }
  else if(ex.type==='match'){
    var n2=0;
    ex.left.forEach(function(L, li){
      var want = -1;
      for(var k=0;k<ex.right.length;k++){ if(ex.right[k].for===li){ want=k; break; } }
      var ok = a[li]===want;
      if(ok)n2++;
      map[li]= ok?'ok':'bad';
      parts.push({label:L, verdict: ok?'ok':'bad', note: ok? '→ '+ex.right[want].t : '→ '+ex.right[want].t});
    });
    setE(n2, ex.left.length);
  }
  else if(ex.type==='order'){
    var n3=0;
    ex.steps.forEach(function(s, i){
      var ok = a[i]===i;
      if(ok)n3++;
      map[i]= ok?'ok':'bad';
      parts.push({label:(i+1)+'. '+s, verdict: ok?'ok':'bad', note: ok?'Right position':'You placed it at position '+(a.indexOf(i)+1)+' — it belongs at '+(i+1)});
    });
    setE(n3, ex.steps.length);
  }
  else if(ex.type==='fill'){
    var n4=0;
    ex.blanks.forEach(function(b, i){
      var ok = b.a.map(normInp).indexOf(normInp(a[i]))>=0;
      if(ok)n4++;
      map['b'+i]= ok?'ok':'bad';
      parts.push({label:'Blank '+(i+1), verdict: ok?'ok':'bad', note: ok?'': 'Accepted: '+b.a.join(' / ')});
    });
    setE(n4, ex.blanks.length);
  }
  else if(ex.type==='terminal'){
    var n5=0;
    ex.tasks.forEach(function(t, i){
      var v = (a[i]||'').replace(/\[\.\]/g,'.').trim();
      var rx = taskRx(t); var ok = !!(rx && v && rx.test(v));
      var badHit = false;
      (t.bad||[]).forEach(function(b){ try{ if(new RegExp(b.split('[.]').join('\\.'),'i').test(v)) badHit=true; }catch(e){} });
      if(ok && badHit) ok=false;
      if(ok)n5++;
      map['t'+i]= ok?'ok':'bad';
      parts.push({label:t.name, verdict: ok?'ok':'bad', note: ok?'Accepted command':(badHit?'That command does more than the goal allows — keep it discovery only':'Not the right command for this goal')});
    });
    setE(n5, ex.tasks.length);
  }
  else if(ex.type==='dual'){
    var n6=0;
    ex.parts.forEach(function(pt, pi){
      var ok = a[pi]===pt.correct;
      if(ok)n6++;
      if(a[pi]!=null) map['p'+pi+'o'+a[pi]]= ok?'ok':'bad';
      map['p'+pi+'o'+pt.correct]= ok?'ok':'miss';
      parts.push({label:pt.label.split('—')[0], verdict: ok?'ok':'bad', note: ok?'Correct':'Correct answer: '+pt.choices[pt.correct]});
    });
    setE(n6, ex.parts.length);
  }
  else if(ex.type==='branch'){
    var n7=0, path=a||[];
    path.forEach(function(s, di){
      var o = ex.tree.nodes[s.node].opts[s.opt];
      map['d'+di]= o.ok?'ok':'bad';
      if(o.ok)n7++;
      parts.push({label:'Decision '+(di+1)+' — '+o.t, verdict: o.ok?'ok':'bad', note: o.ok?'Good call':(o.why||'A better option existed')});
    });
    setE(n7, ex.tree.total);
  }
  else if(ex.type==='queue'){
    var n8=0;
    ex.rows.forEach(function(r, ri){
      var ok = a[ri]===r.correct;
      if(ok)n8++;
      map['r'+ri]= ok?'ok':'bad';
      parts.push({label: r.label.length>60? r.label.slice(0,60)+'…' : r.label, verdict: ok?'ok':'bad', note: ok?'': 'Correct: '+r.choices[r.correct]});
    });
    setE(n8, ex.rows.length);
  }
  earn = Math.max(0, Math.min(total, earn));
  return { earn: earn, max: total, parts: parts, map: map };
}

/* ---------- totals: only exercises actually answered count ---------- */
function totals(){
  var earn=0, max=0;
  S.order.forEach(function(id){ var st=S.by[id]; if(st.checked){ earn+=st.earned; max+=st.ex.points; } });
  return {earn:earn, max:max};
}

/* ---------- actions ---------- */
function doCheck(){
  var st = S.by[S.order[S.pos]];
  if(st.checked && !st.revising) return;
  if(st.ex.type==='branch' && !pathComplete(st)) return;
  var g = gradeEx(st);
  if(st.hintUsed){ g.earn = Math.max(0, g.earn - 0.1*st.ex.points); g.hintPenalty = 0.1*st.ex.points; }
  st.grad = g; st.earned = g.earn; st.checked = true; st.revising = false;
  if(st.skipped) st.skipped = false;
  if(!S.finished) S.checkp = true;
  renderCurrent();
  var fb=$('#fbBox'); if(fb) fb.scrollIntoView({block:'nearest', behavior:'smooth'});
}
function doRevise(){
  var st = S.by[S.order[S.pos]];
  st.revising = true;
  renderCurrent();
}
function doSkip(){
  var st = S.by[S.order[S.pos]];
  if(st.checked) return;
  st.skipped = true;
  if(S.pos < S.order.length-1) nextPos();
  else updateNav();
}
function doHint(){
  var st = S.by[S.order[S.pos]];
  if(st.hintUsed || !st.ex.hint) return;
  st.hintUsed = true;
  var hb = el('div','hintbox','<div class="t">HINT — costs 10% of this exercise&#8217;s points</div>'+esc(st.ex.hint));
  var ref = $('#ansBd').closest('.blk');
  ref.parentNode.insertBefore(hb, ref);
  updateActionStates(st);
}
function askSubmit(){
  var ans = answeredCount();
  if(ans===0){
    modal('<h3>Nothing answered yet</h3><p>You must answer at least one exercise before submitting. An attempt with only skipped exercises cannot be scored.</p>', [{t:'OK', pri:true}]);
    return;
  }
  var un = S.order.length - ans;
  var msg = un>0
    ? '<h3>Submit exam?</h3><p>'+un+' exercise'+(un>1?'s are':' is')+' still unanswered. Unanswered exercises are excluded from the score — they count neither for you nor against you.</p>'
    : '<h3>Submit exam?</h3><p>All exercises are answered. Ready to see your results?</p>';
  modal(msg, [{t:'Cancel'},{t:'Submit', pri:true, fn: function(){ finish('submit'); }}]);
}
function finish(reason){
  if(S.finished) return;
  S.order.forEach(function(id){ var st=S.by[id]; if(!st.checked) st.skipped=true; });
  S.finished = true; S.checkp=false; S.manual=false;
  if(timerId){ clearInterval(timerId); timerId=null; }
  renderResults(reason);
  if(!S.reported){ S.reported=true; reportScore(); }
}

/* ---------- results ---------- */
function stripTags(s){ var d=document.createElement('div'); d.innerHTML=s; return (d.textContent||'').replace(/\s+/g,' ').trim(); }
function ansSummary(st, which){
  var ex=st.ex, a = st.ans;
  function cut(s){ s=stripTags(String(s)); return s.length>90? s.slice(0,90)+'…' : s; }
  try{
    if(which==='given' && !st.checked) return '<span class="mut">— (skipped)</span>';
    switch(ex.type){
      case 'qcm': return cut(which==='given'? (a==null?'(no answer)':ex.choices[a]) : ex.choices[ex.correct]);
      case 'multi': {
        var list = which==='given' ? (a||[]) : ex.correct;
        return list.length? list.map(function(i){return cut(ex.choices[i]);}).join('; ') : '(none)';
      }
      case 'spot': {
        var ws = which==='given' ? (a||[]) : (ex.multi?ex.wrong:[ex.wrong[0]]);
        return ws.length? ws.map(function(i){return cut(ex.lines[i]);}).join(' | ') : '(none)';
      }
      case 'buckets': return ex.items.map(function(it,i){ return cut(it.t)+' → '+(which==='given'? (a[i]==null?'(none)':ex.buckets[a[i]]) : ex.buckets[it.b]); }).join('; ');
      case 'match': return ex.left.map(function(L,li){ var want=-1; for(var k=0;k<ex.right.length;k++){ if(ex.right[k].for===li){want=k;break;} } return cut(L)+' → '+(which==='given'? (a[li]==null?'(none)':ex.right[a[li]].t) : ex.right[want].t); }).join('; ');
      case 'order': { var seq = which==='given'? st.ans : ex.steps.map(function(_,i){return i;}); return seq.map(function(oi,i){ return (i+1)+'.'+cut(ex.steps[oi]); }).join(' '); }
      case 'fill': return ex.blanks.map(function(b,i){ return 'Blank '+(i+1)+': '+(which==='given'? (a[i]||'(empty)') : b.a[0]); }).join('; ');
      case 'terminal': return ex.tasks.map(function(t,i){ return t.name+': '+(which==='given'? (a[i]||'(empty)') : t.demo); }).join('; ');
      case 'dual': return ex.parts.map(function(pt,pi){ return cut(pt.label)+': '+(which==='given'? (a[pi]==null?'(no answer)':pt.choices[a[pi]]) : pt.choices[pt.correct]); }).join('; ');
      case 'branch': { var p=st.ans||[]; if(which==='given'){ if(!p.length) return '(no path)'; return p.map(function(s){ return cut(ex.tree.nodes[s.node].opts[s.opt].t); }).join(' > '); } return ex.tree.total+' good decisions needed; best path: '+bestPath(ex).map(cut).join(' > '); }
      case 'queue': return ex.rows.map(function(r,ri){ return cut(r.label)+' → '+(which==='given'? (a[ri]==null?'(none)':r.choices[a[ri]]) : r.choices[r.correct]); }).join('; ');
    }
  }catch(e){ return '(summary error)'; }
  return '';
}
function bestPath(ex){
  var out=[], nid=ex.tree.start, guard=0;
  while(nid && !ex.tree.nodes[nid].end && guard++<20){
    var n=ex.tree.nodes[nid]; var oi=-1;
    for(var k=0;k<n.opts.length;k++){ if(n.opts[k].ok){oi=k;break;} }
    if(oi<0) break; out.push(n.opts[oi].t); nid=n.opts[oi].next;
  }
  return out;
}
function renderFeedback(st){
  var g=st.grad, box=$('#fbBox');
  if(!box || !g) return;
  box.classList.remove('hid');
  var full = g.earn >= st.ex.points-0.001, zero = g.earn<=0.001;
  var word = full ? '<span class="cOK">&#10003; Correct</span>' : zero ? '<span class="cBAD">&#10007; Wrong</span>' : '<span class="cMISS">&#177; Partial</span>';
  var hintNote = g.hintPenalty ? ' (includes hint penalty of −'+fmtP(g.hintPenalty)+')' : '';
  var lis = g.parts.map(function(p){ return '<li>'+ (p.verdict==='ok'?'<span class="cOK">&#10003;</span>':p.verdict==='bad'?'<span class="cBAD">&#10007;</span>':'<span class="cMISS">&#9888;</span>')+' <b>'+esc(p.label)+'</b> — '+esc(p.note)+'</li>'; }).join('');
  box.innerHTML = '<div class="fbt">RESULT — '+word+'</div>'+
  '<div class="earn">You earned '+fmtP(g.earn)+' / '+st.ex.points+' points on this exercise'+hintNote+'</div>'+
  '<ul>'+lis+'</ul>'+
  '<div class="expl"><b>Explanation:</b> '+st.ex.expl+'</div>'+
  '<p class="mut small">Timer paused — review mode. Press Next to resume the clock.</p>';
}
function renderResults(reason){
  var t = totals();
  var total = Math.round(t.max), score = Math.round(t.earn);
  var percent = total>0 ? Math.round(score/total*100) : 0;
  var passed = total>0 && percent >= EX.meta.passMark;
  var skipped = S.order.map(function(id,i){ return {id:id, i:i, st:S.by[id]}; }).filter(function(o){ return o.st.skipped && !o.st.checked; });
  var root = $('#app');
  var when = new Date().toISOString().slice(0,10);
  var hero = passed
    ? '<div class="res-hero pass"><div style="font-size:34px">&#127942;</div><h1 style="margin:4px 0">PASS</h1>'+
      '<div class="certline">CyberPulseAcademy — certificate of completion</div>'+
      '<p style="font-size:17px"><b>'+esc(S.username||'Candidate')+'</b> — '+esc(EX.meta.title)+'</p>'+
      '<p>Score: <b>'+score+' / '+total+'</b> ('+percent+'%) — pass mark '+EX.meta.passMark+'%</p>'+
      '<p class="certline">Completed '+when+' · CompTIA Network+ N10-009 · Objective 3.1 Documentation</p></div>'
    : '<div class="res-hero fail"><div style="font-size:34px">&#10060;</div><h1 style="margin:4px 0">NOT PASSED</h1>'+
      '<p>Score: <b>'+score+' / '+total+'</b> ('+percent+'%) — you need '+EX.meta.passMark+'% to pass. You must retake this exam.</p></div>';
  var skipHtml = skipped.length
    ? '<div class="panel"><h3 style="margin-top:0">Skipped and not counted</h3><p class="mut">These exercises were skipped and never answered, so their points are excluded from both the earned score and the total:</p><p>'+skipped.map(function(o){return 'Exercise '+(o.i+1);}).join(', ')+'</p></div>'
    : '';
  var rows = S.order.map(function(id, i){
    var st = S.by[id], g = st.grad, label, pts;
    if(!st.checked){ label='<span class="lab skipped">&#8630; skipped</span>'; pts='—'; }
    else if(g.earn >= st.ex.points-0.001){ label='<span class="lab full">&#10003; full</span>'; pts=fmtP(g.earn)+' / '+st.ex.points; }
    else if(g.earn <= 0.001){ label='<span class="lab zero">&#10007; zero</span>'; pts='0 / '+st.ex.points; }
    else { label='<span class="lab partial">&#177; partial</span>'; pts=fmtP(g.earn)+' / '+st.ex.points; }
    var expl = stripTags(st.ex.expl);
    if(g && g.hintPenalty) expl = 'Hint used (−'+fmtP(g.hintPenalty)+' pts). '+expl;
    return '<tr><td>'+(i+1)+'</td><td>'+TYPE_LABEL[st.ex.type]+'</td><td>'+ansSummary(st,'given')+'</td><td>'+ansSummary(st,'correct')+'</td><td>'+pts+'</td><td>'+label+'</td><td class="small">'+esc(expl.slice(0,400))+'</td></tr>';
  }).join('');
  var reasonNote = reason==='timeout' ? '<p class="mut">Time ran out — the exam was submitted automatically.</p>' : '';
  root.innerHTML =
  '<h1 style="font-size:20px">'+esc(EX.meta.title)+' — results</h1>'+ reasonNote + hero + skipHtml +
  '<div class="panel"><h3 style="margin-top:0">Per-exercise report</h3>'+
  '<div style="overflow-x:auto"><table class="rep"><thead><tr><th>#</th><th>Type</th><th>Your answer</th><th>Correct answer</th><th>Points</th><th>Result</th><th>What to review</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
  '<div class="btnrow" style="justify-content:center"><button class="btn pri" id="bRetake">Retake exam</button></div>';
  $('#bRetake').addEventListener('click', function(){
    startExam();
  });
}
function reportScore(){
  var t = totals();
  var total = Math.round(t.max), score = Math.round(t.earn);
  if(total<=0) return;
  var percent = Math.round(score/total*100);
  try{
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: EX.meta.topicId,
      score: score,
      total: total,
      percent: percent,
      passed: percent >= EX.meta.passMark
    }, location.origin);
  }catch(e){ /* opened directly — nothing to report to */ }
}

/* ---------- handshake ---------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  try{
    window.__cpUser = event.data.username || window.__cpUser || '';
    if(S) S.username = window.__cpUser;
  }catch(e){}
});

/* ---------- boot ---------- */
/* renderIntro() is invoked once the exam data is present (see end of page script) */
window.__exam = {
  cur: function(){ return S ? S.order[S.pos] : null; },
  remaining: function(){ return S? S.remaining : -1; },
  setRemaining: function(n){ if(S) S.remaining=n; },
  st: function(){ return S; },
  finished: function(){ return S ? S.finished : false; }
};

renderIntro();
</script>
