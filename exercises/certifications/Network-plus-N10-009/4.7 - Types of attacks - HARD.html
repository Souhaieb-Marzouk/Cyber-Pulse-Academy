/* ---- H1 — DDoS mitigation trade-offs (branch) ---- */
EX({id:'H1',th:0,type:'branch',pts:3,kw:['DDoS','reflection','amplification','rate limiting','blackhole / sinkhole','anycast CDN'],
title:'Under fire: mitigation decisions',
scenario:'<p>12:04. The customer portal saturates its 1 Gbit/s uplink. Flows show small UDP queries leaving your network none — instead, thousands of DNS replies from open resolvers arrive at the portal IP, each 40 to 90 times the size of the query that triggered it. Business wants the site back and demands "block everything".</p>',
question:'<p>Make the three calls.</p>',
data:{steps:[
 {t:'The link is drowning in unsolicited DNS replies. Which first move do you authorise?',ch:[
   {t:'Ask the upstream provider to rate-limit inbound UDP/53 toward the portal and start scrubbing the flows',ok:true,out:'Upstream rate limiting plus scrubbing sheds most of the flood before your link. The portal breathes within minutes.'},
   {t:'Blackhole the portal IP at the edge until the attack stops',ok:false,out:'Blackholing drops legitimate customers together with the flood — you have taken your own service offline for the attacker. It is a last resort, not a first move.'},
   {t:'Open the firewall to let the replies drain faster',ok:false,out:'Amplification traffic is not waiting for permission; opening the door just moves the saturation point one hop inward.'}]},
 {t:'The scrubbing centre holds, but the resolvers keep reflecting. What kills the technique at its source?',ch:[
   {t:'Report the open resolvers to their operators and push upstream providers for BCP-38 source-address validation',ok:true,out:'Fixed resolvers stop reflecting; source filtering makes spoofed queries impossible. The technique itself dies — for everyone.'},
   {t:'Block the portal’s own IP at the provider so the replies have nowhere to land',ok:false,out:'That is blackholing your own service again. The attacker wins the moment your site disappears.'},
   {t:'Wait: reflection stops when the botnet gets bored',ok:false,out:'Amplified reflection costs the attacker almost nothing and pays in uptime damage. Waiting is a decision to stay down.'}]},
 {t:'The CIO asks how the next attack gets absorbed. What belongs in the plan?',ch:[
   {t:'Front the portal with an anycast CDN / anti-DDoS service that scrubs before traffic reaches you',ok:true,out:'Anycast spreads any flood across scrubbing centres worldwide; only clean traffic reaches your origin. The next attack becomes someone else’s Tuesday.'},
   {t:'Buy a bigger uplink and hope the attack stays under it',ok:false,out:'Amplification scales to hundreds of Gbit/s; arms races on link size always lose.'},
   {t:'Move DNS and the portal onto one bigger, faster server',ok:false,out:'Concentrating services makes a richer target. Distribution (anycast), not concentration, absorbs volumetric attacks.'}]}
]},
explain:{global:'<p>A <b>reflected, amplified DDoS</b> weaponises third-party DNS servers: spoofed queries in, huge replies onto the victim. Order of operations matters: <b>rate limiting / scrubbing</b> restores service, killing the reflection (resolver takedowns, BCP-38 anti-spoofing) removes the technique, and an <b>anycast CDN</b> absorbs future floods. <b>Blackholing</b> is a break-glass action — it stops the attack by stopping your own service too. The botnet that sent the queries still exists, so blocking "the attacker" is impossible when thousands of resolvers do the sending.</p>',per:{
 b0:'Restore service without punishing customers: scrub, do not blackhole.',
 b1:'Technique-level fixes (resolver hygiene, anti-spoofing) outlast any single attack.',
 b2:'Absorption by distribution beats absorption by wishful thinking.'}},
hints:['Which option stops the flood AND keeps customers online?','A "bigger server" is still one server — one place to drown.']});

/* ---- H2 — artifact cards to attack buckets (drag & drop) ---- */
EX({id:'H2',th:2,type:'dnd',pts:8,kw:['ARP poisoning','double tagging','DNS cache poisoning','evil twin','gratuitous ARP','DAI','pharming','WIPS','rogue devices'],
title:'File every artifact under its attack',
scenario:'<p>Eight artefacts were collected from three incidents. Some lines look alike — the deciding detail is subtle. Two artifacts per family, four families.</p>',
question:'<p>Drag each artifact line into the attack family it proves.</p>',
data:{
 cats:[{id:'c1',t:'ARP / on-path'},{id:'c2',t:'VLAN hopping'},{id:'c3',t:'DNS attacks'},{id:'c4',t:'Rogue wireless'}],
 items:[
  {id:'i1',t:'ARP reply: 10[.]20[.]5[.]1 is-at 00:d9:41:07 — second MAC for this IP within one hour',cat:'c1',note:'Two MACs claiming the gateway IP is forged ARP — the on-path setup move.'},
  {id:'i2',t:'DAI log: 412 replies dropped on Gi0/7, reason "invalid sender MAC vs binding"',cat:'c1',note:'DAI exists to stop ARP poisoning; its drop counter rising proves someone is trying.'},
  {id:'i3',t:'SPAN capture: frames carry [802.1Q VID 1][802.1Q VID 30] — outer tag is the native VLAN',cat:'c2',note:'Double tagging: the outer tag rides the native VLAN, the inner one smuggles the frame elsewhere.'},
  {id:'i4',t:'Config diff: user ports remain "dynamic auto" while a rogue "switch" appeared at Gi0/12',cat:'c2',note:'DTP still negotiating means switch spoofing — the simplest VLAN hop.'},
  {id:'i5',t:'Resolver: bank record cached for 86400s from a non-authoritative source IP',cat:'c3',note:'A long-TTL record nobody authoritative sent — DNS cache poisoning.'},
  {id:'i6',t:'One workstation maps the payroll portal to 198[.]51[.]100[.]23 in its hosts file',cat:'c3',note:'Per-host redirection is pharming through a tampered hosts file.'},
  {id:'i7',t:'Same SSID "CORP-WiFi", different BSSID, channel 6 instead of 11, RSSI -38 in the lobby',cat:'c4',note:'A stronger clone of your SSID is an evil twin hunting for clients.'},
  {id:'i8',t:'WIPS: contained a beaconing device using a corporate-looking OUI at reception',cat:'c4',note:'A contained unauthorised radio is a rogue device — evil twin or not, it never belonged there.'}
 ]},
explain:{global:'<p>Families separate by where the artifact lives: ARP tables and DAI counters expose <b>ARP poisoning</b> (the on-path builder); trunk caps and DTP state expose <b>VLAN hopping</b>; resolver caches and hosts files expose <b>DNS attacks</b> (cache poisoning at scale, pharming per host); BSSIDs, channels and WIPS actions expose <b>rogue wireless</b>. Read every line for its layer before matching — that is what defeats the look-alikes. Unauthorised radios and other rogue devices never belong on the air.</p>',per:{}},
hints:['The deciding question is always: which layer wrote this line — switch, host resolver, or radio?','Two lines each mention: ARP/DAI, 802.1Q/DTP, resolver/hosts, BSSID/WIPS.']});

/* ---- H3 — amplification correlation (logview + filter, single choice) ---- */
EX({id:'H3',th:0,type:'qcm',pts:3,kw:['DNS amplification','reflection','open resolver','DDoS'],
title:'Separate the attack from the noise',
scenario:'<p>The monitoring bus mixes normal traffic with an attack. Use the filter box to isolate the pattern before you answer. The portal IP is 203[.]0[.]113[.]10 and it runs no DNS service of its own.</p>',
logs:[
'12:31:01 flow udp src=8[.]8[.]4[.]4:53 dst=10[.]40[.]2[.]11:51000 bytes=92 (internal query answer)',
'12:31:02 flow udp src=71[.]6[.]33[.]10:53 dst=203[.]0[.]113[.]10:44100 bytes=3,980',
'12:31:02 flow tcp src=88[.]12[.]9[.]211:52210 dst=203[.]0[.]113[.]10:443 bytes=1,204 (customer)',
'<span class="hi">12:31:03 flow udp src=104[.]16[.]44[.]9:53 dst=203[.]0[.]113[.]10:44101 bytes=4,112</span>',
'12:31:03 flow udp src=8[.]8[.]8[.]8:53 dst=10[.]40[.]2[.]11:51002 bytes=118 (internal query answer)',
'<span class="hi">12:31:04 flow udp src=45[.]79[.]12[.]3:53 dst=203[.]0[.]113[.]10:44102 bytes=3,875</span>',
'12:31:04 flow udp src=104[.]16[.]44[.]9:53 dst=203[.]0[.]113[.]10:44103 bytes=4,001',
'12:31:05 flow tcp src=203[.]0[.]113[.]25:38812 dst=203[.]0[.]113[.]10:22 bytes=210 (admin)',
'<span class="hi">12:31:06 flow udp src=71[.]6[.]33[.]10:53 dst=203[.]0[.]113[.]10:44104 bytes=3,990</span>',
'12:31:07 netflow: inbound to portal 90% UDP src-port 53, no matching outbound queries',
'<span class="hi">12:31:08 flow udp src=45[.]79[.]12[.]3:53 dst=203[.]0[.]113[.]10:44105 bytes=4,208</span>',
'12:31:09 flow tcp src=88[.]12[.]9[.]211:52214 dst=203[.]0[.]113[.]10:443 bytes=1,890 (customer)'
],
question:'<p>After filtering, which conclusion is correct?</p>',
data:{opts:[
 {t:'A SYN flood aimed directly at the portal’s HTTPS service',ok:false,note:'The flood is UDP from port 53; TCP 443 lines are real customers with healthy byte counts.'},
 {t:'DNS amplification — resolvers flood a host that never queried',ok:true,note:'Inbound UDP/53 to a host with no matching outbound queries and multi-kilobyte replies is textbook amplification.'},
 {t:'An evil twin access point poisoning the resolver cache',ok:false,note:'No wireless element exists here; the pathology is flow direction and size, not SSIDs.'},
 {t:'Normal DNS traffic misread by the NetFlow exporter',ok:false,note:'The portal never queried anyone — unsolicited multi-KB replies are never normal.'}
]},
explain:{global:'<p>Filter for <span class="mono">:53</span> and the pattern snaps into focus: many different resolver addresses, replies thousands of bytes large, all aimed at 203[.]0[.]113[.]10, which never sent queries. That is <b>DNS amplification</b> in <b>reflection</b> mode — part of a <b>DDoS</b> where third-party servers (often <b>open resolvers</b>) do the sending. The customer TCP flows are noise and must not be blocked while mitigating.</p>',per:{}},
hints:['Filter on "53" and on the portal IP, then compare sizes and directions.','No outbound query ever matched the inbound replies — reflection needs no permission from the victim.']});

/* ---- H4 — two waves (multi-select over logs) ---- */
EX({id:'H4',th:0,type:'qmulti',pts:2,kw:['SYN flood','ICMP flood','DoS','DDoS'],
title:'Two waves, one morning',
scenario:'<p>Edge firewall logs show two distinct bursts within an hour. Wave 1: TCP SYNs to 203[.]0[.]113[.]10:443 from one /24 range, no handshakes completed. Wave 2: 40,000 echo requests per second to 203[.]0[.]113[.]25 from a single compromised hosting server. Neither wave used more than 30 sources.</p>',
question:'<p>Select the two correct assessments.</p>',
data:{opts:[
 {t:'Wave 1 is DNS amplification — block UDP 53',ok:false,note:'Wave 1 is TCP 443 SYNs, not UDP 53 replies; nothing here reflects or amplifies.'},
 {t:'Wave 1 is a SYN flood — half-open connections exhaust the web tier',ok:true,note:'SYNs without completing handshakes is the SYN-flood fingerprint; a DoS from that range.'},
 {t:'Wave 2 is an evil twin harvesting credentials',ok:false,note:'No radio exists in wave 2; ICMP has nothing to do with wireless.'},
 {t:'Wave 2 is an ICMP flood — a basic DoS from one compromised host',ok:true,note:'Echo requests at that rate from one server are an ICMP flood: noisy, direct, easily rate-limited.'},
 {t:'Both waves are one botnet syncing its clocks',ok:false,note:'Sync traffic would be small and orderly; floods with different protocols, targets and sources are separate attacks.'}
]},
explain:{global:'<p>Protocol and handshake state name the attack. TCP SYN with no ACK completion = <b>SYN flood</b> (a <b>DoS</b> that fills the connection table). Raw echo requests at flood rate = <b>ICMP flood</b>. Amplification requires reflection through third parties, which neither wave shows — under 30 sources means this is flooding, not a wide <b>DDoS</b> botnet.</p>',per:{}},
hints:['Look at the transport protocol of each wave first, then at who sends.','Under 30 sources: think targeted floods, not a distributed swarm.']});

/* ---- H5 — sockets + resolver hunt (terminal, HARD: no tool named) ---- */
EX({id:'H5',th:2,type:'terminal',pts:3,kw:['rogue services','DNS spoofing','pharming','ss / netstat'],
title:'Triage the suspicious jump host',
scenario:'<p>An EDR alert flagged process 4821 on this Linux jump host for odd beaconing. You have an interactive shell and no EDR console access. Two facts must be collected for the incident record.</p>',
question:'<p>Produce, in one command line (chained with ; or && is allowed), (1) the active sockets owned by process 4821 with addresses and ports, and (2) the DNS resolver configuration this host actually uses. Choose your own tools.</p>',
data:{ps:'responder@jump-host:~$',ph:'your command(s) here',
 reqAny:[['netstat','ss -','lsof','sockstat'],['4821'],['resolv.conf','resolvectl','systemd-resolve','nmcli','ipconfig /all']],
 accept:'',forbid:[],
 banner:'Fake shell — the command you type is checked, not executed. Type addresses with normal dots.',
 sampleOut:'tcp ESTAB 10[.]20[.]5[.]44:49122 → 198[.]51[.]100[.]66:4444 owners: pid 4821 ("upd")[— unexpected endpoint]\n--- resolver in use ---\nnameserver 10[.]0[.]0[.]53   (corporate)\nnameserver 198[.]51[.]100[.]23  (unexpected external resolver)',
 sol:'ss -tunap | grep 4821 ; cat /etc/resolv.conf'},
explain:{global:'<p>Two artefacts matter on a suspicious host: <b>who it talks to</b> (socket listing by PID — <span class="mono">ss -tunap</span>, <span class="mono">netstat -ano</span> or <span class="mono">lsof -i</span>) and <b>which resolver it trusts</b> (the resolver configuration — <span class="mono">/etc/resolv.conf</span> or its systemd equivalent). The output shows an unexpected external <b>resolver</b>: the host’s name lookups are being steered — a <b>pharming / DNS spoofing</b> setup that pairs with the beaconing process (a likely <b>rogue service</b> — rogue services like this are documented, then killed).</p>',per:{cmd:'Any tool family that lists sockets with PIDs plus any tool that prints resolver settings is accepted; PID 4821 must appear.'}},
hints:['One command lists sockets with owning PIDs; the other prints which name servers the host trusts.','On Linux: ss or netstat for sockets; the resolver lives in a small text file under /etc.']});

/* ---- H6 — native VLAN subtlety (spot, artifact + single choice) ---- */
EX({id:'H6',th:1,type:'qcm',pts:2,kw:['double tagging','native VLAN','DTP','VLAN hopping'],
title:'Hardened trunk, still hop-able',
scenario:'<p>The switch team says: "We already disabled DTP and set the native VLAN to 10 deliberately, it is documented." The pentest report still lists a working double-tag hop into VLAN 10 from any user port.</p>',
artifact:'! trunk to edge switches\ninterface Gi0/24\n <span class="hi">switchport trunk native vlan 10</span>\n switchport mode trunk\n switchport nonegotiate\n switchport trunk allowed vlan 10,20\n!\n! user access ports\ninterface range Gi0/2 - 40\n switchport mode access\n switchport access vlan 10',
question:'<p>DTP is off, so switch spoofing is dead. Why does double tagging still work?</p>',
data:{opts:[
 {t:'The trunk’s native VLAN equals the user access VLAN (10)',ok:true,note:'A double-tagged frame with outer tag 10 rides the native VLAN unwrapped, and the inner tag then lands it in VLAN 10 directly.'},
 {t:'DTP is still enabled somewhere on the switch fabric',ok:false,note:'nonegotiate is configured on the trunk; and the hop in question is double tagging, which needs no negotiation at all.'},
 {t:'The allowed list still includes VLAN 20 for users',ok:false,note:'The allowed list is irrelevant: the inner tag carries VLAN 10, which is allowed everywhere the users are.'},
 {t:'Access ports must be configured as dynamic desirable',ok:false,note:'Access ports must never negotiate; making them dynamic would reintroduce switch spoofing.'}
]},
explain:{global:'<p>Classic <b>double tagging</b> needs the <b>native VLAN</b>: the outer tag is stripped at the first trunk because native VLAN frames are untagged, and the inner tag decides where the frame really goes. When the native VLAN equals the user access VLAN, the hop needs no cleverness — the attacker’s frame lands straight in the user VLAN. Rule: the native VLAN must be an <b>unused</b> VLAN, different from every access VLAN, and never on the allowed list of user traffic.</p>',per:{}},
hints:['Trace one frame with tags [10][10] through the trunk: what survives the strip?','"Documented" is not "safe" — the native VLAN must be unused, not merely written down.']});

/* ---- H7 — detection technique → attack (match) ---- */
EX({id:'H7',th:2,type:'match',pts:6,kw:['ARP poisoning','MAC flooding','rogue AP','double tagging','DNS cache poisoning','rogue DHCP server'],
title:'Pair the check with the attack it exposes',
scenario:'<p>The detection playbook lists six checks. Match each check to the attack it is built to catch — the near-miss pairs are deliberately attractive.</p>',
question:'<p>Match every check to its attack.</p>',
data:{
 pairs:[
  {l:'Compare "show ip arp" output on two different hosts for the same gateway IP',r:'ARP poisoning',note:'If two hosts disagree about the gateway’s MAC, someone forged ARP replies.'},
  {l:'Alert when the CAM table learns more than 50 new MACs per second on one port',r:'MAC flooding',note:'Fake-MAC firehoses are what overflow a CAM table; rate-of-learning is the detector.'},
  {l:'Spectrum and SSID scan of the lobby with a handheld analyser',r:'Rogue AP / evil twin',note:'A physical survey finds radios the controllers never installed — rogue or evil twin.'},
  {l:'SPAN the trunk and flag any frame carrying two 802.1Q headers',r:'VLAN double tagging',note:'Legitimate traffic never double-tags; two headers is the hop itself.'},
  {l:'Re-ask the resolver and compare with the authoritative server’s answer',r:'DNS cache poisoning',note:'A cached answer that disagrees with the authoritative server is a poisoned record.'},
  {l:'Diff the snooping binding table against observed lease offers on user ports',r:'Rogue DHCP server',note:'Offers that never came from the trusted server betray a rogue DHCP device.'}
 ]},
explain:{global:'<p>Detection lives next to its attack: ARP tables disagree under <b>ARP poisoning</b>; the <b>CAM table</b> churns under <b>MAC flooding</b>; the air betrays a <b>rogue AP</b>; the trunk exposes <b>double tagging</b>; authoritative disagreement exposes <b>DNS cache poisoning</b>; and the snooping binding table is the ground truth that convicts a <b>rogue DHCP server</b>.</p>',per:{}},
hints:['Two checks compare two sources of truth — tables and authorities.','Only one attack lives in the air; only one check walks the floor.']});

/* ---- H8 — on-path kill chain (order) ---- */
EX({id:'H8',th:2,type:'order',pts:5,kw:['on-path attack','gratuitous ARP','SSL stripping','ARP poisoning'],
title:'Reconstruct the attacker’s kill chain',
scenario:'<p>Forensics recovered the attacker’s shell history from the on-path incident. Rebuild the sequence from their perspective.</p>',
question:'<p>Put the five recovered steps in execution order.</p>',
data:{items:[
 'Scan the flat VLAN, find live hosts and confirm the default gateway address',
 'Flood gratuitous ARP replies: "gateway IP is-at my MAC" to keep caches poisoned',
 'Wait for victim ARP caches to expire and accept the forged mapping',
 'Relay victim traffic, strip TLS on login pages and capture credentials',
 'Send reverse ARP restores while exfiltrating, to delay detection'
],per:{
 p0:'Reconnaissance first: know the subnet and the gateway before poisoning anything.',
 p1:'The poisoning itself: continuous gratuitous ARP keeps the lie alive.',
 p2:'Poisoning only pays when caches turn over and accept the forged entry.',
 p3:'From the on-path seat: relay traffic and strip TLS for credentials.',
 p4:'Exit tradecraft: mask the trail while the data leaves.'}},
explain:{global:'<p>An on-path attacker on a LAN works in a fixed order: recon → <b>gratuitous ARP</b> flooding (<b>ARP poisoning</b>) → cache acceptance → traffic relay with <b>SSL stripping</b> → quiet exit. The order explains the defence order too: DAI kills step 2, short cache timeouts and HSTS blunt steps 3 and 4, and egress monitoring exposes step 5.</p>',per:{}},
hints:['Nothing is poisoned before the attacker knows where the gateway is.','Stripping TLS requires already sitting in the middle — that seat is earned in an earlier step.']});

/* ---- H9 — Layer-2 runbook cloze (fill) ---- */
EX({id:'H9',th:1,type:'fill',pts:5,kw:['DHCP snooping','Dynamic ARP Inspection','port security','sticky MAC','DTP'],
title:'Complete runbook L2-9',
scenario:'<p>The Layer-2 hardening runbook must be finished word-perfect before the change window. Bank terms: two are distractors.</p>',
question:'<p>Drag the right term into each blank.</p>',
data:{
 text:'Enable {{0}} on every user VLAN and mark only the {{1}} port as trusted, so lease offers from anywhere else are dropped. Enable {{2}} so each ARP reply is validated against the snooping binding table. Apply {{3}} with a three-address limit and {{4}} learning so the legitimate devices are pinned to their ports. Finally, disable DTP on every access port — trunks must never be negotiated.',
 slots:[null,null,null,null,null],
 ans:['DHCP snooping','uplink','Dynamic ARP Inspection','port security','sticky'],
 bank:['DHCP snooping','uplink','Dynamic ARP Inspection','port security','sticky','DNSSEC','BPDU filter']},
explain:{global:'<p>The runbook builds a chain of trust: <b>DHCP snooping</b> creates the binding table (only the <b>uplink</b> is trusted for offers), <b>Dynamic ARP Inspection</b> validates ARP against that table, <b>port security</b> with <b>sticky</b> learning pins MACs to ports, and DTP stays off so trunks are never negotiated. Remove any link and the class of Layer-2 attacks reopens.</p>',per:{
 s0:'Snooping builds the trusted lease table everything else checks against.',
 s1:'Only the path to the real DHCP server may be trusted.',
 s2:'DAI is the ARP referee; the binding table is its rulebook.',
 s3:'Port security caps learned MACs — flooding then trips a violation.',
 s4:'Sticky learning writes learned MACs into the running config. DNSSEC is DNS and BPDU filter guards spanning tree — neither belongs here.'}},
hints:['The runbook moves from leases to ARP to MACs to trunk negotiation — follow the chain.','Two distractors defend DNS and spanning tree, not this chain.']});

/* ---- H10 — CAM flapping vs loop (spot, artifact + single choice) ---- */
EX({id:'H10',th:1,type:'qcm',pts:2,kw:['MAC flooding','CAM table','port security'],
title:'Flapping addresses, quiet spanning tree',
scenario:'<p>The operations channel blames "a switching loop" because MAC addresses flap between two ports. Spanning tree reports no topology change and no BPDU storm. The port-security log tells a different story.</p>',
artifact:'%PORT_SECURITY-2: psecure violation on Gi0/7 — MAC limit 3 exceeded by 1,402 addresses\n%MAC_MOVE-4: CAM entries flap Gi0/7 ↔ Gi0/9 for 00:1a:2b:ff:cf:0d\n%CAM-5: table utilisation 98% (limit approaching)\n%SPANTREE-5: no topology change detected in the last 60 minutes',
question:'<p>What is actually happening, and what does it enable?</p>',
data:{opts:[
 {t:'A genuine Layer-2 loop that spanning tree reacts to slowly',ok:false,note:'A loop storms BPDUs and triggers topology changes; 60 quiet minutes and a 98% CAM utilisation point elsewhere.'},
 {t:'An ARP poisoning campaign against the default gateway',ok:false,note:'ARP poisoning lives in ARP tables, not in CAM-table churn; nothing here claims the gateway IP.'},
 {t:'A rogue DHCP server handing out leases on both ports',ok:false,note:'No DHCP offers appear in the log; flapping CAM entries are a switching-plane event.'},
 {t:'MAC flooding — the CAM overflow floods frames to all ports',ok:true,note:'Thousands of fake MACs fill the table; an overflowing switch forwards unknown frames everywhere, which is the attacker’s goal.'}
]},
explain:{global:'<p>The giveaway pair: a <b>port-security violation</b> counting 1,402 excess addresses on one port plus a <b>CAM table</b> near capacity. That is <b>MAC flooding</b>: as the table fills, unknown unicast frames are flooded out of every port, giving the attacker a sniffing position. A real loop would storm BPDUs and force spanning-tree changes. Fix: keep violation mode at shutdown, cap MACs per port, and find the device on Gi0/7.</p>',per:{}},
hints:['One counter says "1,402 addresses too many" — count what a loop would never do.','Spanning tree silence is evidence, not an accident: loops announce themselves.']});
/* ===== HARD exam — exercises 11-20 ===== */

/* ---- H11 — starvation then rogue server (multi-select over logs) ---- */
EX({id:'H11',th:1,type:'qmulti',pts:3,kw:['DHCP starvation','rogue DHCP server','DHCP snooping'],
title:'The pool that dried up in minutes',
scenario:'<p>The corporate DHCP pool (240 addresses) reports 240 leases at 09:12, most of them to MAC addresses that have never appeared again. At 09:19, several clients receive offers from 10[.]66[.]0[.]5 with gateway 10[.]66[.]0[.]1.</p>',
logs:[
'09:08:01 dhcpd: DISCOVER chaddr=00:00:5e:00:aa:01 (new)',
'09:08:01 dhcpd: DISCOVER chaddr=00:00:5e:00:aa:02 (new)',
'<span class="hi">09:08:02 dhcpd: DISCOVER rate 90/s from Gi0/12 — chaddr randomised</span>',
'09:12:44 dhcpd: pool VLAN10 exhausted (240/240 leases)',
'<span class="hi">09:19:02 relay: OFFER 10[.]66[.]0[.]101 gw 10[.]66[.]0[.]1 dns 198[.]51[.]100[.]23 received on Gi0/12</span>',
'09:19:03 client wks-117 accepted offer 10[.]66[.]0[.]101',
'09:19:10 monitoring: clients report certificate errors on internal sites'
],
question:'<p>Select the three correct assessments.</p>',
data:{opts:[
 {t:'DHCP starvation: randomised DISCOVER storms exhausted the real pool',ok:true,note:'Thousands of fake client identifiers leased every address — the classic starvation prelude.'},
 {t:'The pool exhaustion is a capacity problem — enlarge the scope to /23',ok:false,note:'The leases went to ghost devices; a bigger pool just feeds the attacker longer.'},
 {t:'A rogue DHCP server on Gi0/12 is now handing out attacker-friendly leases',ok:true,note:'The 10[.]66 offers with foreign DNS arrive exactly where the storm came from.'},
 {t:'The certificate errors prove the DHCP server itself is failing',ok:false,note:'Certificate errors follow the attacker DNS server (198[.]51[.]100[.]23) the rogue leases point to.'},
 {t:'Enable DHCP snooping plus DISCOVER rate limiting on user ports',ok:true,note:'Snooping trusts only the real server path; rate limiting caps DISCOVER storms. Both halves matter.'}
]},
explain:{global:'<p>This is the full <b>rogue DHCP</b> playbook: <b>DHCP starvation</b> empties the real pool with randomised fake clients, then the attacker’s server offers leases with attacker DNS — and every client on those leases resolves through the attacker (hence certificate errors). <b>DHCP snooping</b> with only the trusted uplink plus DISCOVER rate limiting stops both halves.</p>',per:{}},
hints:['Ask what the ghost leases achieved: the pool did not merely run out — it was emptied on purpose.','The offer and the storm share one switch port.']});

/* ---- H12 — on-path containment (pure QCM) ---- */
EX({id:'H12',th:2,type:'qcm',pts:2,kw:['on-path attack','ARP poisoning','DAI'],
title:'Containment under capture',
scenario:'<p>Indicators confirmed: several hosts resolve the gateway IP to the attacker’s MAC, full packet capture is running, and the attacker host is live on Gi0/12. Management wants the attacker expelled without losing evidence.</p>',
question:'<p>Which sequence is correct?</p>',
data:{opts:[
 {t:'Clear all ARP tables at once and wait for the attacker to lose position',ok:false,note:'Poisoning re-floods within seconds while the attacker is still connected; you would clean, they would re-paint.'},
 {t:'Reboot every endpoint at once before saving any packet capture',ok:false,note:'Rebooting destroys volatile ARP evidence and the capture pipeline for zero containment gain.'},
 {t:'Shut the attacker’s port, then clear and re-verify ARP tables with DAI',ok:true,note:'Cut the source first, then clean caches under DAI protection — evidence survives on the capture you already run.'},
 {t:'Renumber the gateway onto a brand-new IP to escape the poisoning',ok:false,note:'The attacker’s gratuitous ARP simply claims the new gateway IP next; renumbering is disruption without containment.'}
]},
explain:{global:'<p>Containment removes the attacker, not the symptom: shut the <b>on-path</b> host’s port, then repair <b>ARP</b> state (clear caches) while <b>Dynamic ARP Inspection</b> blocks any re-poisoning attempt. Evidence lives in the packet capture and switch logs, which shutting a port does not disturb. Clearing caches with the attacker still live just re-runs the attack.</p>',per:{}},
hints:['What keeps working after you clear ARP tables? The attacker — unless the port is shut.','Evidence you have not saved yet is evidence you are about to lose.']});

/* ---- H13 — risk prioritization (drag & drop to severity) ---- */
EX({id:'H13',th:1,type:'dnd',pts:8,kw:['prioritization','ARP poisoning','evil twin','DDoS','rogue DHCP server','MAC flooding','tailgating','phishing'],
title:'Triage: rank the eight open incidents',
scenario:'<p>Monday morning queue. Eight findings from the weekend. Sort each into Critical (act now: active theft or outage), High (act today: active foothold or serious exposure) or Medium (contained or historical).</p>',
question:'<p>Drag every finding into the right severity bucket.</p>',
data:{
 cats:[{id:'c1',t:'Critical'},{id:'c2',t:'High'},{id:'c3',t:'Medium'}],
 items:[
  {id:'i1',t:'On-path attacker actively relaying gateway traffic in VLAN 20',cat:'c1',note:'Live credential and session theft — everything stops until this is contained.'},
  {id:'i2',t:'Users are typing credentials into an evil twin portal in the lobby right now',cat:'c1',note:'Active harvesting of real credentials — contain the AP and reset those users immediately.'},
  {id:'i3',t:'DDoS saturating the customer portal’s uplink',cat:'c2',note:'Serious outage, but availability-only: no data is being read. High, not Critical.'},
  {id:'i4',t:'Rogue DHCP server handing out attacker DNS to clients',cat:'c2',note:'Active foothold that steers victims — High; it becomes Critical if it starts harvesting.'},
  {id:'i5',t:'DAI drop counters rising steadily on Gi0/7',cat:'c2',note:'Someone is actively attempting ARP poisoning but DAI is stopping it — High, watch and trace.'},
  {id:'i6',t:'MAC flooding attempt already shut down by port security last night',cat:'c3',note:'The control worked; the attempt failed. Investigate later — Medium.'},
  {id:'i7',t:'Tailgating caught on CCTV a week ago, person already identified',cat:'c3',note:'Historical, identified, no active threat — Medium, handle through HR/process.'},
  {id:'i8',t:'One phishing mail reported by a user, link never clicked',cat:'c3',note:'Reported and unclicked — Medium: block the sender, thank the reporter, move on.'}
 ]},
explain:{global:'<p>Triage weighs <b>active theft or outage</b> over <b>contained attempts</b>. Active interception (on-path, evil twin harvesting) is Critical because data leaves the network right now. Outages and steered clients (DDoS, rogue DHCP, blocked-but-active attempts) are High. Already-stopped attempts and historical events are Medium. Severity follows exposure and momentum, not how scary the attack name sounds.</p>',per:{}},
hints:['Two findings involve credentials leaving the organisation right now.','A control that already stopped an attack downgrades the incident, not the attacker.']});

/* ---- H14 — evil twin credential exposure (branch) ---- */
EX({id:'H14',th:3,type:'branch',pts:3,kw:['evil twin','rogue AP','WIPS','credential harvesting','802.1X'],
title:'Twenty minutes on the fake portal',
scenario:'<p>A user typed her username and password into a captive portal on "CORP-WiFi-Guest" — an SSID your organisation never deployed. WIPS contained the AP twenty minutes after her connection; her password has not yet been changed. Wireless access for staff uses WPA2/WPA3-Enterprise (802.1X) — the fake network never passed it.</p>',
question:'<p>Make the three calls.</p>',
data:{steps:[
 {t:'First action after confirming she authenticated to the fake portal?',ch:[
   {t:'Revoke her active sessions, force a password reset, and review what the account did during those twenty minutes',ok:true,out:'Stolen credentials were usable the moment she typed them; session revocation plus a timeline review bounds the damage.'},
   {t:'Nothing — WIPS already contained the fake AP',ok:false,out:'The AP is gone but the credentials it harvested are still valid. Containment of the radio is not containment of the identity.'},
   {t:'Rename the corporate SSID so future fakes are obvious',ok:false,out:'A cosmetic change that also breaks every configured device — while the stolen password keeps working.'}]},
 {t:'Her mailbox shows a new forwarding rule created during the exposure window, sending invoices to an outside address. Next?',ch:[
   {t:'Delete the rule, purge the outside recipient, and sweep other exposed accounts for the same rule pattern',ok:true,out:'Attacker persistence removed; the sweep catches other victims of the same portal before they notice.'},
   {t:'Leave the rule; it only forwards invoices',ok:false,out:'Invoice forwarding is business email compromise in miniature — the attacker reads and can alter payment flows.'},
   {t:'Delete her mailbox and re-create it from scratch',ok:false,out:'Destructive and unnecessary; rules are removable and mailbox data is evidence.'}]},
 {t:'Which control would have exposed the fake AP fastest — before any login page appeared?',ch:[
   {t:'WIPS rogue detection with scheduled physical site surveys of the lobby area',ok:true,out:'Continuous rogue detection flags the SSID clone within beacon distance; the survey finds the physical box fast.'},
   {t:'Raising corporate AP transmit power to shout louder',ok:false,out:'A power war with an attacker two metres from the client is lost in advance — and adds interference.'},
   {t:'Disabling all guest SSIDs permanently',ok:false,out:'Guest access is a business need; the fake AP cloned a guest name, so removing guests inconveniences everyone without removing the threat.'}]}
]},
explain:{global:'<p>An <b>evil twin</b> is judged by what it captures, not by whether its radio survives: the moment credentials are typed, the incident becomes an identity problem — revoke sessions, reset, and audit the exposure window. Persistence (mailbox rules) must be hunted across all affected accounts. Structurally, 802.1X Enterprise auth means fake networks cannot silently join staff, and <b>WIPS</b> plus site surveys shrink the fake AP’s lifetime.</p>',per:{
 b0:'Credentials were stolen live; identity response outranks radio response.',
 b1:'Persistence mechanisms are the attacker’s next move — sweep, do not cherry-pick.',
 b2:'Detection plus physical search is what shortens a rogue AP’s working life.'}},
hints:['The AP was contained — but what did it already collect?','"Shout louder" rarely wins a radio contest against someone in your lobby.']});

/* ---- H15 — triage details (match) ---- */
EX({id:'H15',th:4,type:'match',pts:5,kw:['whaling','phishing','smishing','vishing','spear phishing'],
title:'Fine-grained triage of five reports',
scenario:'<p>Five reports, five subtle details that decide the label. Match precisely — the near-miss labels are close.</p>',
question:'<p>Match each report to the correct attack name.</p>',
data:{
 pairs:[
  {l:'Mail to the CFO quoting her real travel dates and a "changed" beneficiary bank account',r:'Whaling',note:'Executive target plus researched detail plus financial payload — the whaling trifecta.'},
  {l:'Identical mail with one generic link sent to 8,000 external subscribers',r:'Phishing (mass campaign)',note:'Volume plus zero personalisation — a campaign, not a targeted act.'},
  {l:'SMS to the helpdesk duty phone: "payroll portal closed, verify at this link"',r:'Smishing',note:'The SMS channel defines smishing, whatever the bait says.'},
  {l:'Voicemail from "IT": "read me the MFA push number to unlock your account"',r:'Vishing',note:'Voice channel harvesting an MFA factor — vishing, and the code must be treated as stolen.'},
  {l:'Mail to one platform admin referencing his actual service tickets and requesting his VPN config',r:'Spear phishing',note:'One named technical victim plus true internal detail — spear phishing with a technical payload.'}
 ]},
explain:{global:'<p>Labels follow two axes: <b>channel</b> (mail / SMS / voice) and <b>targeting</b> (mass / researched individual / executive). Executive + finance = <b>whaling</b>; one researched victim = <b>spear phishing</b>; SMS = <b>smishing</b>; voice = <b>vishing</b>; volume with no personalisation = plain <b>phishing</b>. Getting the label right drives the right control: mail rules, phone procedures, or MFA hygiene.</p>',per:{}},
hints:['Two labels differ only by who is targeted — check the job titles.','The channel word is inside the name for two of these: SMS and voice.']});

/* ---- H16 — slowloris vs SYN flood (logview + filter, single choice) ---- */
EX({id:'H16',th:0,type:'qcm',pts:2,kw:['slowloris','SYN flood','application-layer DoS'],
title:'Which layer is being starved?',
scenario:'<p>The front-end shows 100% connection utilisation but only 12% bandwidth. Filter the logs and decide what is being exhausted — and by which layer.</p>',
logs:[
'13:02:01 tcp syn src=91[.]203[.]11[.]7 dst=203[.]0[.]113[.]10:443 — handshake COMPLETED',
'13:02:01 http req src=91[.]203[.]11[.]7 GET / — headers never finished (age 220s)',
'13:02:02 tcp syn src=91[.]203[.]11[.]7 dst=203[.]0[.]113[.]10:443 — handshake COMPLETED',
'13:02:02 http req src=91[.]203[.]11[.]7 GET / — partial header drip "X-keep: 1"',
'13:02:03 firewall: no SYN backlog; all SYNs answered normally',
'<span class="hi">13:02:04 httpd workers 256/256 busy, 241 pinned by unfinished requests</span>',
'13:02:05 bandwidth 12% of uplink — no volumetric pattern',
'13:02:06 http req src=91[.]203[.]11[.]7 GET / — headers never finished (age 180s)'
],
question:'<p>What is starving the service?</p>',
data:{opts:[
 {t:'Slowloris — handshakes finish, headers never do (application layer)',ok:true,note:'Handshakes complete (so it is not a SYN flood) while half-built requests hold every worker: application-layer exhaustion.'},
 {t:'A SYN flood — the kernel SYN backlog is full and refusing SYNs',ok:false,note:'The log says no SYN backlog: handshakes complete fine. The exhaustion happens one layer up.'},
 {t:'A volumetric DDoS saturating the site uplink with packet floods',ok:false,note:'12% bandwidth is incompatible with volumetric attack — the pipe is nearly idle.'},
 {t:'DNS amplification aimed at the web tier from open resolvers',ok:false,note:'No UDP 53 flows appear; the pattern is slow TCP application traffic.'}
]},
explain:{global:'<p>Handshakes completing + workers pinned by unfinished headers = <b>slowloris</b>, an <b>application-layer DoS</b>. A <b>SYN flood</b> would jam the SYN backlog at the kernel layer and handshakes would never complete. The discriminator is always the layer where the queue is full: connection table (network) vs worker pool (application). Header timeouts and per-source connection caps defuse slowloris.</p>',per:{}},
hints:['Read the handshake line: COMPLETED — so which resource is left holding the bag?','241 pinned workers and a calm link: the attack lives in request headers, not packets.']});

/* ---- H17 — control mismatches in policy (flags) ---- */
EX({id:'H17',th:4,type:'flags',pts:3,kw:['privacy screen','shoulder surfing','shredding','dumpster diving','mantrap','tailgating','awareness training'],
title:'Audit the control-technique mappings',
scenario:'<p>Internal audit flagged three sentences in the awareness policy that pair a control with the WRONG technique. Click each mismatched sentence. Correct sentences must be left unflagged.</p>',
question:'<p>Find the three wrong control-technique pairs.</p>',
artifact:'Physical &amp; Awareness Policy v2.1 — excerpt\n\n(a) <span class="fl">Privacy screens are installed at desks to stop tailgating at the lobby door.</span>\n(b) <span class="fl">Locked cross-cut shred bins prevent shoulder surfing in open-plan areas.</span>\n(c) <span class="fl">The reception mantrap exists to stop strangers from reading monitors.</span>\n(d) <span class="fl">The access control vestibule admits one badged person at a time, reducing tailgating.</span>\n(e) <span class="fl">Quarterly phishing drills with reporting statistics keep staff awareness high and reporting fast.</span>\n(f) <span class="fl">Weekly-emptied shred bins deny a dumpster diver readable documents.</span>',
data:{flags:[
 {t:'(a) privacy screens ↔ tailgating',f:true,note:'Mismatch: privacy screens stop shoulder surfing; tailgating is a door problem.'},
 {t:'(b) shred bins ↔ shoulder surfing',f:true,note:'Mismatch: shred bins answer dumpster diving; screens answer shoulder surfing.'},
 {t:'(c) mantrap ↔ monitor reading',f:true,note:'Mismatch: the mantrap stops tailgating; it cannot protect what is on a screen.'},
 {t:'(d) vestibule ↔ tailgating',f:false,note:'Correct pair: one-person-at-a-time entry is the tailgating control.'},
 {t:'(e) drills ↔ phishing awareness',f:false,note:'Correct pair: drills and reporting metrics are core awareness training controls.'},
 {t:'(f) shred bins ↔ dumpster diving',f:false,note:'Correct pair: cross-cut shredding starves the dumpster diver.'}
]},
explain:{global:'<p>Controls and techniques must pair correctly or audits fail and budgets go to the wrong place: <b>privacy screen</b> ↔ <b>shoulder surfing</b>; locked <b>shredding</b> ↔ <b>dumpster diving</b>; <b>mantrap</b>/access control vestibule ↔ <b>tailgating</b>; drills and metrics ↔ <b>phishing awareness</b>. Cross-paired controls look impressive and protect nothing.</p>',per:{}},
hints:['Each wrong sentence borrows a true control and attaches it to a neighbour’s threat.','Ask of each sentence: what does this device physically touch — the screen, the paper, or the door?']});

/* ---- H18 — VLAN hopping containment order (order) ---- */
EX({id:'H18',th:1,type:'order',pts:5,kw:['VLAN hopping','double tagging','DTP','native VLAN'],
title:'Order the VLAN-hopping containment',
scenario:'<p>A double-tag hop from a user port into VLAN 30 was confirmed on trunk Gi0/24. The change window is yours; order the work.</p>',
question:'<p>Put the five actions in the correct order.</p>',
data:{items:[
 'Preserve: export the switch configuration and the SPAN capture of the trunk as evidence',
 'Identify: confirm the ingress port of the double-tagged frames and the exact inner VLAN used',
 'Close the hole: set "switchport nonegotiate", move the native VLAN to an unused VLAN, and prune it from access',
 'Sweep: verify no device now sits in the previously reachable VLAN and check DAI/snooping state',
 'Report: document the path, fix every other trunk against the same standard, and brief the team'
],per:{
 p0:'Forensics before changes: the config and capture are the proof.',
 p1:'Locate the entry point so the fix targets the real path.',
 p2:'Only now change state: DTP off, native VLAN moved and unused.',
 p3:'Sweep for followers — an attacker may hold more than one seat.',
 p4:'Close the loop across all trunks, not just the one that burned.'}},
explain:{global:'<p>Containment follows evidence-first discipline: preserve configs and captures, identify the exact ingress and inner VLAN, then apply the fix (<b>nonegotiate</b> kills DTP negotiation; an <b>unused native VLAN</b> breaks <b>double tagging</b>), sweep for other footholds, and standardise every trunk. Changing the native VLAN before capturing would have destroyed the proof of how the hop worked.</p>',per:{}},
hints:['Which action, done first, would destroy the evidence you need?','The fix lands only after you know where the frames entered.']});

/* ---- H19 — on-path vs other attacks (multi-select QCM) ---- */
EX({id:'H19',th:2,type:'qmulti',pts:3,kw:['on-path attack','ARP poisoning','SSL stripping','DNS cache poisoning'],
title:'Pick the true on-path indicators',
scenario:'<p>Six observations from one shift. Exactly three belong to an on-path attack built with ARP poisoning; three belong to other attacks.</p>',
question:'<p>Select the three observations that indicate an on-path (ARP-based) attack.</p>',
data:{opts:[
 {t:'The resolver cached a bank record from a non-authoritative source',ok:false,note:'That is DNS cache poisoning — a different attack, different artefact.'},
 {t:'ARP tables on several hosts map the gateway IP to one foreign MAC',ok:true,note:'The poisoned-cache pattern — the on-path position is being built.'},
 {t:'NetFlow shows 40 Gbit/s inbound to the portal from 3,000 sources',ok:false,note:'That is volumetric DDoS; nothing here steals data — it drowns a service.'},
 {t:'Browsers on multiple hosts warn of invalid certificates for internal sites',ok:true,note:'Interception re-signs TLS on the fly; warnings are the sound of SSL stripping or relay.'},
 {t:'DHCP offers with foreign gateways arrive on user ports',ok:false,note:'That is a rogue DHCP server; leases steer traffic, but the observed artefact is offers, not relayed sessions.'},
 {t:'Internal HTTPS-only pages appear as plain HTTP in the web proxy logs',ok:true,note:'TLS stripping pushes what should be HTTPS through the proxy in plain text — on-path evidence.'}
]},
explain:{global:'<p>An <b>on-path</b> attacker leaves three artefact families: poisoned ARP tables (via <b>ARP poisoning</b>), downgraded or re-signed TLS — browser warnings or plain-HTTP proxy entries from <b>SSL stripping</b> — and switching oddities such as a MAC claiming two ports. DNS answers, volumetric floods and rogue DHCP offers name their own different attacks — matching artefact to attack is the whole game.</p>',per:{}},
hints:['One family lives in ARP tables, one in browser warnings, one in switch MAC moves.','Each wrong option is the headline artefact of a different attack — name it and rule it out.']});

/* ---- H20 — phishing report with IOCs (fill) ---- */
EX({id:'H20',th:4,type:'fill',pts:4,kw:['phishing','credential harvesting','typosquatting','awareness training'],
title:'Complete incident report PH-2026-118',
scenario:'<p>Eleven users typed passwords into the fake payroll page before takedown. The mail came from payro11-updates[.]com and the page copied the real single sign-on pixel for pixel. Bank terms: two are distractors.</p>',
question:'<p>Drag the right term into each blank.</p>',
data:{
 text:'The sender domain payro11-updates[.]com is a {{0}} of our payroll portal — one character away from the real name. The linked page was a {{1}} site: it mirrored our sign-on and saved every submitted password. We blocked the sender, purged the message with a {{2}} mailbox search, reset all eleven users, and scheduled an {{3}} session using this mail as the live example.',
 slots:[null,null,null,null],
 ans:['typosquat','credential harvesting','compliance (eDiscovery)','awareness refresher'],
 bank:['typosquat','credential harvesting','compliance (eDiscovery)','awareness refresher','wildcard certificate','zone transfer']},
explain:{global:'<p>The report vocabulary matters: a <b>typosquat</b> domain imitates a real name closely enough to survive a glance; a <b>credential harvesting</b> page exists to collect passwords; a <b>compliance (eDiscovery) search</b> finds and purges every copy across mailboxes; and an <b>awareness refresher</b> turns the incident into training. Wildcard certificates and zone transfers are real DNS/TLS concepts but play no role in this incident.</p>',per:{
 s0:'One altered character in the domain is the typosquat signature.',
 s1:'A page whose purpose is stealing submitted passwords is credential harvesting.',
 s2:'The mailbox-wide search-and-purge capability is the compliance/eDiscovery search.',
 s3:'Training built on a real incident is the awareness refresher.'}},
hints:['Two distractors are real technologies from other chapters — certificates and DNS transfers.','The blank about finding every copy of the mail is a mailbox-wide capability.']});
/* ===== HARD exam — exercises 21-30 ===== */

/* ---- H21 — DNS poisoning verification (terminal, HARD: no tool named) ---- */
EX({id:'H21',th:2,type:'terminal',pts:3,kw:['DNS poisoning','DNS spoofing','dig / nslookup'],
title:'Prove the redirection, capture the evidence',
scenario:'<p>Users report the internal payment portal showing an unfamiliar certificate. You suspect forged answers from the corporate resolver (10[.]0[.]0[.]53). The portal’s true address is 10[.]20[.]30[.]44. You are on a Linux jump host with a plain shell.</p>',
question:'<p>In operational terms: resolve the name <b>payment.corp.internal</b> using the corporate resolver and produce output that shows both the answer and which server answered it. Choose your own tools.</p>',
data:{ps:'responder@jump-host:~$',ph:'your command here',
 reqAny:[['dig','nslookup','host ','drill'],['payment']],
 accept:'',forbid:[],
 banner:'Fake shell — the command you type is checked, not executed. Type addresses with normal dots.',
 sampleOut:';; <<>> DiG 9.18.24 <<>> payment.corp.internal\n;; SERVER: 10[.]0[.]0[.]53#53(10[.]0[.]0[.]53)\n;; ANSWER SECTION:\npayment.corp.internal. 120  IN  A  198[.]51[.]100[.]23\n;; expected: 10[.]20[.]30[.]44  → PROOF of forged answer',
 sol:'dig @10[.]0[.]0[.]53 payment.corp.internal   (or: nslookup payment.corp.internal 10[.]0[.]0[.]53)'},
explain:{global:'<p>Verification before remediation: a resolver query that returns an answer outside the portal’s real subnet — together with the server line naming 10[.]0[.]0[.]53 — is documentary proof of <b>DNS cache poisoning</b> (forged <b>DNS</b> answers). The common tools are dig, nslookup, host or drill; what matters operationally is the pair "forged answer + answering server" in one output. Next: flush the cache, enable response validation (DNSSEC), and randomise source ports.</p>',per:{cmd:'Any resolver tool naming the portal is accepted; including the @server form makes the evidence explicit but is optional.'}},
hints:['Every system ships at least one command-line name lookup tool; the output must show the answer AND the server.','dig, nslookup, host or drill — plus the portal name.']});

/* ---- H22 — defense-in-depth layers (drag & drop) ---- */
EX({id:'H22',th:3,type:'dnd',pts:8,kw:['DAI','DHCP snooping','port security','WIPS','WPA3-Enterprise / 802.1X','mantrap','shredding','DNSSEC'],
title:'Hang the controls on the right layer',
scenario:'<p>Architecture review: eight controls, four layers. Two controls per layer. Watch the near-miss: 802.1X exists for wired ports too, but here it arrives as part of the wireless suite.</p>',
question:'<p>Drag each control to the layer it defends.</p>',
data:{
 cats:[{id:'c1',t:'Layer-2 switch plane'},{id:'c2',t:'Wireless plane'},{id:'c3',t:'Physical plane'},{id:'c4',t:'DNS plane'}],
 items:[
  {id:'i1',t:'Dynamic ARP Inspection',cat:'c1',note:'Validates ARP replies on switch ports — pure Layer-2 defence.'},
  {id:'i2',t:'DHCP snooping with trusted uplink',cat:'c1',note:'Lease offers are policed on the switch plane.'},
  {id:'i3',t:'Port security with sticky MAC',cat:'c1',note:'MAC limits live in the switch CAM/port-security engine.'},
  {id:'i4',t:'WIPS rogue containment',cat:'c2',note:'Radio-level detection and containment of unauthorised APs.'},
  {id:'i5',t:'WPA3-Enterprise (802.1X/EAP-TLS) on all SSIDs',cat:'c2',note:'Per-user wireless authentication; the wireless face of 802.1X in this design.'},
  {id:'i6',t:'Access control vestibule (mantrap)',cat:'c3',note:'One badged person at a time — the physical anti-tailgating device.'},
  {id:'i7',t:'Locked cross-cut shred bins',cat:'c3',note:'Paper destruction defeats dumpster diving — a physical control.'},
  {id:'i8',t:'DNSSEC validation on resolvers',cat:'c4',note:'Signed records make forged DNS answers fail — the DNS-plane defence.'}
 ]},
explain:{global:'<p>Defence in depth assigns each control to its layer: the <b>switch plane</b> runs DAI, DHCP snooping and port security; the <b>wireless plane</b> runs WIPS and WPA3-Enterprise (802.1X); the <b>physical plane</b> runs the mantrap and shredding; the <b>DNS plane</b> runs DNSSEC. During design reviews, a control floating on the wrong layer is a finding — it usually means someone mapped a threat to a control they happened to own.</p>',per:{}},
hints:['Ask where each control’s enforcement code actually runs: switch ASIC, radio, door, resolver.','802.1X appears here with EAP-TLS on SSIDs — follow the wording, not the acronym alone.']});

/* ---- H23 — rogue DHCP branch (branch) ---- */
EX({id:'H23',th:1,type:'branch',pts:3,kw:['rogue DHCP server','DHCP snooping','DHCP starvation'],
title:'Certificate errors everywhere',
scenario:'<p>Helpdesk floods with "certificate errors on every internal site". Checking three affected laptops: default gateway 10[.]66[.]0[.]1 — a subnet your organisation does not use. Your real scope is 10[.]20[.]0[.]0/22.</p>',
question:'<p>Make the three calls.</p>',
data:{steps:[
 {t:'Where do you look first for the source of the bad leases?',ch:[
   {t:'The DHCP snooping logs and binding table on the distribution switch',ok:true,out:'Snooping logs show OFFERs from 00:d9:41:07 arriving on Gi0/12 — untrusted port, foreign scope. Source found.'},
   {t:'The corporate DNS server cache',ok:false,out:'The wrong gateways come from lease offers, not from name answers; DNS is downstream of the real problem.'},
   {t:'The wireless controller rogue list',ok:false,out:'No wireless element is involved — the laptops are docked; the offers arrive on wired ports.'}]},
 {t:'Snooping shows the offers entering on Gi0/12. Next move?',ch:[
   {t:'Shut Gi0/12, then verify snooping is active with only the uplink trusted',ok:true,out:'The rogue device loses its mouthpiece; the trust boundary is now correct and verified.'},
   {t:'Temporarily trust Gi0/12 to compare its offers with the real server’s',ok:false,out:'Trusting the attacker’s port legalises the forgery and feeds more bad leases to clients.'},
   {t:'Block UDP 67 at the core firewall',ok:false,out:'The real DHCP server also lives behind that firewall — you would cut legitimate leases for everyone.'}]},
 {t:'Holding clients still carry leases with gateway 10[.]66[.]0[.]1. What clears them fastest and safely?',ch:[
   {t:'Force a release/renew (or bounce the access ports) so clients accept offers from the real server only',ok:true,out:'Fresh leases come from the genuine server; certificate errors vanish as the attacker DNS disappears from clients.'},
   {t:'Change the real scope to match 10[.]66[.]0[.]0/24 so everyone agrees',ok:false,out:'Adopting the attacker’s addressing rewards the attacker and re-plans your network around an intrusion.'},
   {t:'Wait for the leases to expire naturally over hours',ok:false,out:'Every hour on bad leases is an hour of traffic through attacker DNS — unnecessary exposure.'}]}
]},
explain:{global:'<p>A <b>rogue DHCP server</b> is found at the switch, not in the DNS cache: snooping logs name the port, shutting the port silences the offers, and only a forced renewal pulls clients off the poisoned leases. Enlarging the pool would also have fed the <b>DHCP starvation</b> phase if one had occurred. The trust boundary — exactly one trusted uplink — is what keeps offers honest.</p>',per:{
 b0:'Snooping logs and the binding table are the authoritative source for lease origin.',
 b1:'Containment means removing the rogue port, never legitimising it.',
 b2:'Clients keep bad leases until actively renewed — waiting is exposure.'}},
hints:['Bad leases have a paper trail — which component records every offer?','Two of the wrong options help the attacker; one simply cuts off the real server.']});

/* ---- H24 — layered attacker correlation (multi-select over logs) ---- */
EX({id:'H24',th:1,type:'qmulti',pts:3,kw:['correlation','DAI','port security','rogue DHCP server'],
title:'One port, many techniques',
scenario:'<p>Over one hour, three independent logs point at the same port and MAC. Correlate before you act.</p>',
logs:[
'<span class="hi">10:01:12 PORT_SEC-2: violation Gi0/7 — 402 excess MACs, action shutdown-recover</span>',
'<span class="hi">10:22:41 DAI-5: 87 ARP replies dropped on Gi0/7 (sender MAC not in binding table)</span>',
'<span class="hi">10:41:03 DHCP_SNOOP-5: OFFER from 10[.]66[.]0[.]5 dropped on Gi0/7 (untrusted)</span>',
'10:41:20 all three logs share MAC 00:d9:41:07 / port Gi0/7',
'10:41:55 no other port shows violations, drops or offers'
],
question:'<p>Select the three correct conclusions.</p>',
data:{opts:[
 {t:'One device on Gi0/7 is running several Layer-2 attacks in sequence',ok:true,note:'MAC flooding, then ARP poisoning, then rogue DHCP — same MAC, same port: a toolkit, not three attackers.'},
 {t:'The switch is faulty — schedule an RMA with the vendor',ok:false,note:'The switch behaved exactly as configured; hardware replacement is a misdiagnosis.'},
 {t:'Investigate and image the device on Gi0/7 first; treat the port as hostile',ok:true,note:'Correlation before action: one port explains three alerts, so the port is the crime scene.'},
 {t:'Wireless interference is corrupting the frames on that port',ok:false,note:'Wired ports and dropped-for-cause packets show deliberate forgeries, not RF noise.'},
 {t:'Keep DAI, snooping and port security limits enabled everywhere',ok:true,note:'All three attempts died at switch controls; the layered design did its job and must stay.'}
]},
explain:{global:'<p>Correlation turns three alerts into one attacker: identical MAC and port across port-security, DAI and snooping logs. The correct posture is investigative (image the device, treat the port as hostile) and preventive (the three controls that blocked every attempt stay on everywhere). Diagnosing hardware or RF noise ignores the evidence’s most boring fact: everything was dropped for a documented reason.</p>',per:{}},
hints:['What single field appears in all three highlighted lines?','Every highlighted line contains a control action — "dropped", "violation", "shutdown".']});

/* ---- H25 — port security vs DAI gap (pure QCM) ---- */
EX({id:'H25',th:2,type:'qcm',pts:2,kw:['DAI','port security','ARP poisoning'],
title:'The auditor’s question',
scenario:'<p>After an ARP poisoning incident, the external auditor asks: "Every port had port security with sticky MAC and a limit of three. Why did poisoning still succeed?"</p>',
question:'<p>Which answer is technically correct?</p>',
data:{opts:[
 {t:'Port security must be set to allow unlimited MACs for ARP to work',ok:false,note:'Raising limits would make flooding easier and still say nothing about ARP authenticity.'},
 {t:'Port security counts MACs but never validates ARP senders — DAI was missing',ok:true,note:'Port security counts MACs; DAI checks each ARP reply against the trusted binding table. Different jobs.'},
 {t:'DAI only functions on trunk ports, so access ports need something else',ok:false,note:'DAI is precisely for access ports, validating replies against the snooping binding table.'},
 {t:'The ARP packets were encrypted, so no control could inspect them',ok:false,note:'ARP has no encryption; the issue was the absence of validation, not cryptography.'}
]},
explain:{global:'<p><b>Port security</b> answers "how many MACs may this port learn". <b>Dynamic ARP Inspection</b> answers "is this ARP reply true". A poisoned gateway mapping passes port security easily because the attacker uses one legitimate-looking MAC — the count never trips. Only DAI, fed by the DHCP snooping binding table, rejects the forged reply. Layer-2 controls stack; none of them is a substitute for another.</p>',per:{}},
hints:['Ask what each control actually inspects: MAC quantity, or ARP contents?','The missing control shares its acronym with the phrase "Dynamic ARP ___".']});

/* ---- H26 — 802.1X / NAC roles (match) ---- */
EX({id:'H26',th:3,type:'match',pts:5,kw:['802.1X / NAC','supplicant','authenticator','RADIUS','captive portal','WIPS'],
title:'Name the role of each 802.1X actor',
scenario:'<p>The NAC deployment document lists actors without labels. Match each description to its role so the document can ship.</p>',
question:'<p>Match every description to its role.</p>',
data:{
 pairs:[
  {l:'The laptop requesting network access and presenting credentials or a certificate',r:'Supplicant',note:'The client side of 802.1X is the supplicant.'},
  {l:'The switch or AP that relays the exchange and keeps the port closed until success',r:'Authenticator',note:'The door-keeper role: it forwards EAP and opens or holds the port.'},
  {l:'The server that validates credentials and applies policy (RADIUS)',r:'Authentication server',note:'RADIUS decides who may in — the authentication server of the 802.1X trio.'},
  {l:'A web page a guest must complete before any traffic is allowed',r:'Captive portal',note:'Guest networks gate access with a captive portal instead of 802.1X.'},
  {l:'The sensor system that detects and contains unauthorised APs',r:'WIPS',note:'WIPS watches the air for rogues; it is not part of the 802.1X trio but complements it.'}
 ]},
explain:{global:'<p><b>802.1X</b> is a trio: <b>supplicant</b> (client asking), <b>authenticator</b> (switch/AP gating the port), <b>authentication server</b> (RADIUS deciding). Around it sit complements: a <b>captive portal</b> for guests who cannot do 802.1X, and <b>WIPS</b> for the airspace. Knowing who does what explains why "we enabled port security" is not the same as "we deployed NAC".</p>',per:{}},
hints:['Three roles form the 802.1X chain: ask, gate, decide.','Two roles gate access without certificates: one on a web page, one over the air.']});

/* ---- H27 — wireless runbook cloze (fill) ---- */
EX({id:'H27',th:3,type:'fill',pts:4,kw:['WIPS','site survey','WPA3-Enterprise / 802.1X','802.1X / NAC'],
title:'Complete the wireless hardening runbook',
scenario:'<p>The wireless runbook lost four terms. Bank terms: two are distractors.</p>',
question:'<p>Drag the right term into each blank.</p>',
data:{
 text:'Deploy {{0}} sensors so unauthorised APs are detected and contained automatically. Twice a year, walk the site with a {{1}} toolkit to find radios the sensors cannot see. Every corporate SSID must use WPA2/WPA3-{{2}} with 802.1X — pre-shared keys are forbidden beyond the lab. Guest traffic must land in a {{3}} VLAN with no route into internal systems.',
 slots:[null,null,null,null],
 ans:['WIPS','physical (on-site) survey','Enterprise','separated (DMZ-style)'],
 bank:['WIPS','physical (on-site) survey','Enterprise','separated (DMZ-style)','WPA2-Personal','NAT']},
explain:{global:'<p>The wireless runbook layers four defences: <b>WIPS</b> for continuous rogue detection, a periodic <b>physical site survey</b> for what sensors miss, <b>WPA2/WPA3-Enterprise</b> (802.1X) so every user authenticates individually — never a shared PSK — and a <b>separated guest VLAN</b> so visitor traffic cannot reach internal systems. Personal-mode WiFi and NAT are real but belong to labs and home networks, not to this runbook.</p>',per:{
 s0:'Automatic detection and containment of rogue APs is the WIPS job.',
 s1:'Sensors miss what a physical walk finds: the on-site survey.',
 s2:'Individual authentication via 802.1X is the "Enterprise" flavour.',
 s3:'Guests live in a separated, unrouteable-to-inside VLAN.'}},
hints:['Two blanks describe defences against rogue APs: one continuous, one periodic.','"Personal" is the mode with a shared password — the runbook forbids it.']});

/* ---- H28 — DNS remediation order (order) ---- */
EX({id:'H28',th:2,type:'order',pts:5,kw:['DNS cache poisoning','DNSSEC','cache flush'],
title:'Order the DNS remediation properly',
scenario:'<p>Cache poisoning confirmed on both internal resolvers. The team is eager to "just flush everything" — order the work so evidence and stability survive.</p>',
question:'<p>Put the five actions in the correct order.</p>',
data:{items:[
 'Verify with an independent resolver that answers truly differ (proof, not panic)',
 'Flush the poisoned records from both internal resolvers',
 'Audit how the forgery was accepted: source-port randomisation, bailiwick checks, upstream path',
 'Enable DNSSEC validation and response randomisation on the resolvers',
 'Monitor: alert on validation failures and answers landing outside expected subnets'
],per:{
 p0:'Proof first: independent answers establish that poisoning actually happened.',
 p1:'Then clean: purge the forged records.',
 p2:'Understand the entry path or the forgery returns.',
 p3:'Structural fix: signed validation plus randomisation defeat the technique.',
 p4:'Monitoring turns the next attempt into an alert instead of an incident.'}},
explain:{global:'<p>Remediation order for <b>DNS cache poisoning</b>: verify independently → flush → audit the acceptance path → harden with <b>DNSSEC</b> validation and randomisation → monitor. Flushing before verification destroys the evidence; hardening without auditing invites the same forgery back through the same door. Monitoring for validation failures closes the loop.</p>',per:{}},
hints:['Two actions gather knowledge before any change; only then comes the flush.','The last action never stops — it is how you keep the fix honest.']});

/* ---- H29 — SSL strip + ARP combo (spot, artifact + single choice) ---- */
EX({id:'H29',th:2,type:'qcm',pts:2,kw:['SSL stripping','on-path attack','ARP poisoning','HSTS'],
title:'Two techniques, one capture',
scenario:'<p>A capture from a user’s switch port shows the following sequence during a single login attempt to the intranet.</p>',
artifact:'ARP: 10[.]20[.]5[.]1 is-at 00:d9:41:07  (was 00:1b:44:11:3a:b7)\nTLS: client hello → 10[.]20[.]5[.]1:443  — NO server hello follows\n<span class="hi">HTTP: GET hxxp://intranet.corp.example/login  (downgraded, plain text)</span>\n<span class="hi">HTTP: POST /login user=svc-payroll&pass=******** → relayed to 10[.]20[.]5[.]1</span>\nDNS: intranet.corp.example = 10[.]20[.]5[.]1  (authoritative answer unchanged)',
question:'<p>Which combination is the attacker running?</p>',
data:{opts:[
 {t:'ARP poisoning for the on-path seat, then SSL stripping',ok:true,note:'The stolen gateway MAC gives the seat; the HTTPS→HTTP downgrade exposes the credentials.'},
 {t:'DNS poisoning of the authoritative server’s zone',ok:false,note:'The DNS answer is unchanged and authoritative; redirection happened at Layer 2, not in DNS.'},
 {t:'A volumetric DDoS with an opportunistic sniffing botnet',ok:false,note:'No flood exists; the capture shows precise, low-volume interception of one session.'},
 {t:'A rogue DHCP server renumbering the user’s subnet',ok:false,note:'No lease exchange appears; the gateway IP is stable — its MAC was stolen instead.'}
]},
explain:{global:'<p>Two steps, one goal: <b>ARP poisoning</b> (gateway MAC stolen) gives the attacker the <b>on-path</b> position, and <b>SSL stripping</b> downgrades the session to readable HTTP where the login POST can be captured. Defences: DAI to kill the seat, HSTS so browsers refuse the downgrade, and internal TLS with certificate pinning where possible.</p>',per:{}},
hints:['Which line proves the attacker is between the user and the gateway?','The login crossed the network in plain text — ask why the browser allowed that.']});

/* ---- H30 — the channel with no network trace (pure QCM) ---- */
EX({id:'H30',th:4,type:'qcm',pts:2,kw:['vishing','detection limits'],
title:'The attack your sensors never see',
scenario:'<p>The CISO asks: "Which of these attacks would leave no direct trace in our mail gateway, web proxy or DNS logs while it is being executed?"</p>',
question:'<p>Which attack belongs in that blind spot?</p>',
data:{opts:[
 {t:'Spear phishing with a credential-harvesting link',ok:false,note:'The mail transits the gateway and the link later hits the proxy/DNS — two traces.'},
 {t:'Vishing — a voice call harvesting an MFA code',ok:true,note:'A phone call generates no mail, web or DNS event; only the human (or the aftermath) reveals it.'},
 {t:'Whaling mail requesting an urgent wire transfer',ok:false,note:'The mail itself lands in the mail gateway with headers to analyse.'},
 {t:'Smishing with a link to a fake SSO login page',ok:false,note:'The SMS may bypass corporate mail, but any follow-up on managed devices writes proxy and DNS logs.'}
]},
explain:{global:'<p><b>Vishing</b> rides the telephone network: no mail to filter, no link to resolve, no page to proxy. That is why voice attacks are caught by people and process — verification call-backs, MFA hygiene, reporting culture — not by network sensors. Every other listed attack ultimately touches mail, web or DNS infrastructure and leaves log evidence.</p>',per:{}},
hints:['Ask which attack payload never touches an IP address on your network.','Two options arrive by mail, one by SMS-with-link; only one needs nothing but a phone line.']});
