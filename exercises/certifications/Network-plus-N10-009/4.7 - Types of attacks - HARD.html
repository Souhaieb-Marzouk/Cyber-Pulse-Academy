<script>
'use strict';
<!-- CyberPulse Academy exam build v3.0 — chapter 4.7 Types of attacks -->
/* ==================================================================
   CyberPulse Academy exam engine — shared framework (data-driven)
   ================================================================== */
function $(s){return document.querySelector(s);}
function mk(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cutTxt(s,n){s=String(s);if(s.length<=n)return s;s=s.slice(0,n);return s.replace(/&[a-zA-Z#0-9]*$/,'');}
function shuf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
/* runtime helper: turn a defanged indicator (10[.]1[.]2[.]3, hxxp://) into working text for validators only */
function undfg(s){return s.split('[.]').join('.').split('hxxp').join('http');}
function ipRe(defanged){return new RegExp(undfg(defanged).split('.').join('\\.'));}

var S=null;
function freshState(){
  return {
    order:[],idx:0,ans:{},checked:{},skipped:{},hints:{},
    time:CONFIG.timeLimit,manual:false,checkp:false,
    finished:false,reported:false,started:false
  };
}

/* ---------------- scoring ---------------- */
function exMax(i){return DATA[S.order[i]].pts;}
function liveScore(){var t=0;for(var k in S.checked){t+=S.checked[k].earned;}return Math.round(t*10)/10;}

/* ---------------- grading ----------------
   Returns {ok:'full'|'part'|'zero', earned:Number, els:[{key,ok:2|1|0,note}], note}
   ok per element: 2 = correct, 1 = missed (amber), 0 = wrong */
function grade(i){
  var ex=DATA[S.order[i]],a=S.ans[i],out={earned:0,els:[]};
  var elv;
  switch(ex.type){
    case 'qcm':{
      var sel=a.sel;
      ex.data.opts.forEach(function(o,k){
        var picked=(sel===k);
        out.els.push({key:'o'+k,ok:(picked&&o.ok)?2:(picked&&!o.ok)?0:(!picked&&o.ok)?1:2,note:o.note||''});
      });
      out.earned=(sel!=null&&ex.data.opts[sel].ok)?ex.pts:0;
      break;}
    case 'qmulti':{
      var nOk=0;ex.data.opts.forEach(function(o){if(o.ok)nOk++;});
      var hit=0;
      ex.data.opts.forEach(function(o,k){
        var p=a.sel.indexOf(k)>-1;
        if(p&&o.ok){hit++;out.els.push({key:'o'+k,ok:2,note:o.note||''});}
        else if(p&&!o.ok){out.els.push({key:'o'+k,ok:0,note:o.note||''});}
        else if(!p&&o.ok){out.els.push({key:'o'+k,ok:1,note:o.note||''});}
        else{out.els.push({key:'o'+k,ok:2,note:o.note||''});}
      });
      elv=ex.pts/nOk;
      out.earned=Math.round(hit*elv*10)/10;
      break;}
    case 'fill':{
      var n=ex.data.ans.length;elv=ex.pts/n;
      for(var k=0;k<n;k++){
        var w=a.slots[k];
        var okk=(w!=null&&ex.data.bank[w]===ex.data.ans[k]);
        out.els.push({key:'s'+k,ok:okk?2:0,note:ex.data.per&&ex.data.per[k]?ex.data.per[k]:''});
        if(okk)out.earned+=elv;
      }
      out.earned=Math.round(out.earned*10)/10;
      break;}
    case 'dnd':{
      var n=ex.data.items.length;elv=ex.pts/n;
      ex.data.items.forEach(function(it,k){
        var put=a.place[it.id]||'bank';
        var okk=(put===it.cat);
        out.els.push({key:'i'+k,ok:okk?2:0,note:it.note||''});
        if(okk)out.earned+=elv;
      });
      out.earned=Math.round(out.earned*10)/10;
      break;}
    case 'order':{
      var n=ex.data.items.length;elv=ex.pts/n;
      for(var k=0;k<n;k++){
        var okk=(a.seq[k]===k);
        out.els.push({key:'p'+k,ok:okk?2:0,note:ex.data.per&&ex.data.per[k]?ex.data.per[k]:''});
        if(okk)out.earned+=elv;
      }
      out.earned=Math.round(out.earned*10)/10;
      break;}
    case 'match':{
      var n=ex.data.pairs.length;elv=ex.pts/n;
      ex.data.pairs.forEach(function(p,k){
        var okk=(a.pair[k]===k);
        out.els.push({key:'m'+k,ok:okk?2:0,note:p.note||''});
        if(okk)out.earned+=elv;
      });
      out.earned=Math.round(out.earned*10)/10;
      break;}
    case 'terminal':{
      var cmd=(a.cmd||'').trim().replace(/\s+/g,' ');
      var okk=false;
      if(cmd.length>2){
        okk=true;
        var reqs=ex.data.req||[];
        for(var r=0;r<reqs.length;r++){
          var tok=undfg(reqs[r]).toLowerCase(),raw=reqs[r].toLowerCase();
          if(cmd.toLowerCase().indexOf(tok)<0&&cmd.toLowerCase().indexOf(raw)<0)okk=false;
        }
        var groups=ex.data.reqAny||[];
        for(var gI=0;gI<groups.length;gI++){
          var anyHit=false;
          for(var gJ=0;gJ<groups[gI].length;gJ++){
            var gt=undfg(groups[gI][gJ]).toLowerCase(),graw=groups[gI][gJ].toLowerCase();
            if(cmd.toLowerCase().indexOf(gt)>-1||cmd.toLowerCase().indexOf(graw)>-1)anyHit=true;
          }
          if(!anyHit)okk=false;
        }
        if(okk&&ex.data.accept&&!new RegExp(ex.data.accept,'i').test(cmd))okk=false;
        if(okk&&ex.data.forbid){for(var f=0;f<ex.data.forbid.length;f++){if(cmd.toLowerCase().indexOf(ex.data.forbid[f].toLowerCase())>-1)okk=false;}}
      }
      out.els.push({key:'cmd',ok:okk?2:0,note:''});
      out.earned=okk?ex.pts:0;
      break;}
    case 'branch':{
      var n=ex.data.steps.length;elv=ex.pts/n;
      for(var k=0;k<n;k++){
        var ci=a.picks[k];var okk=(ci!=null&&ex.data.steps[k].ch[ci].ok);
        out.els.push({key:'b'+k,ok:okk?2:0,note:ex.data.steps[k].why||''});
        if(okk)out.earned+=elv;
      }
      out.earned=Math.round(out.earned*10)/10;
      break;}
    case 'flags':{
      var fl=ex.data.flags;
      var nTrue=fl.filter(function(x){return x.f;}).length;
      elv=ex.pts/nTrue;
      fl.forEach(function(sp,k){
        var p=a.picked.indexOf(k)>-1;
        if(sp.f){out.els.push({key:'f'+k,ok:p?2:1,note:sp.note||''});if(p)out.earned+=elv;}
        else{out.els.push({key:'f'+k,ok:p?0:2,note:sp.note||''});}
      });
      out.earned=Math.round(out.earned*10)/10;
      break;}
  }
  if(out.earned>=ex.pts-0.001)out.ok='full';
  else if(out.earned>0)out.ok='part';
  else out.ok='zero';
  return out;
}

/* does the student have enough of an answer to allow Check? */
function hasAnswer(i){
  var ex=DATA[S.order[i]],a=S.ans[i];if(!a)return false;
  switch(ex.type){
    case 'qcm':return a.sel!=null;
    case 'qmulti':return a.sel.length>0;
    case 'fill':return a.slots.every(function(v){return v!=null;});
    case 'dnd':return ex.data.items.every(function(it){return a.place[it.id]&&a.place[it.id]!=='bank';});
    case 'order':return true;
    case 'match':return ex.data.pairs.every(function(_,k){return a.pair[k]!=null;});
    case 'terminal':return (a.cmd||'').trim().length>2;
    case 'branch':return a.picks.length===ex.data.steps.length;
    case 'flags':return a.picked.length>0;
  }
  return false;
}

/* plain-text summary of the student's locked answer (for the report) */
function answerSummary(i){
  var ex=DATA[S.order[i]],a=S.ans[i];if(!a)return '(no answer)';
  var out=[];
  switch(ex.type){
    case 'qcm':return a.sel==null?'(no answer)':ex.data.opts[a.sel].t;
    case 'qmulti':return a.sel.length?a.sel.map(function(k){return ex.data.opts[k].t;}).join(' | '):'(nothing selected)';
    case 'fill':return a.slots.map(function(v,k){return ((ex.data.slots&&ex.data.slots[k])?ex.data.slots[k]:'Blank '+(k+1))+' → '+(v!=null?ex.data.bank[v]:'(empty)');}).join(' | ');
    case 'dnd':return ex.data.items.map(function(it){var p=a.place[it.id]||'left in bank';var cl=p==='bank'?'(bank)':(ex.data.cats.find(function(c){return c.id===p;})||{}).t||p;return it.t+' → '+cl;}).join(' | ');
    case 'order':return a.seq.map(function(orig,pos){return (pos+1)+'. '+ex.data.items[orig].replace(/<[^>]*>/g,'');}).join(' | ');
    case 'match':return ex.data.pairs.map(function(p,k){var r=a.pair[k];return p.l+' → '+(r!=null?ex.data.pairs[r].r:'(unpaired)');}).join(' | ');
    case 'terminal':return a.cmd||'(nothing typed)';
    case 'branch':return a.picks.map(function(ci,k){return 'Step '+(k+1)+': '+(ci!=null?ex.data.steps[k].ch[ci].t:'(no choice)');}).join(' | ');
    case 'flags':return a.picked.length?a.picked.map(function(k){return ex.data.flags[k].t;}).join(' | '):'(nothing flagged)';
  }
  return '(no answer)';
}
function correctSummary(i){
  var ex=DATA[S.order[i]];
  switch(ex.type){
    case 'qcm':case 'spot':return ex.data.opts.filter(function(o){return o.ok;}).map(function(o){return o.t;}).join(' | ');
    case 'qmulti':return ex.data.opts.filter(function(o){return o.ok;}).map(function(o){return o.t;}).join(' | ');
    case 'fill':return ex.data.ans.join(' | ');
    case 'dnd':return ex.data.items.map(function(it){var c=ex.data.cats.find(function(c){return c.id===it.cat;});return it.t+' → '+c.t;}).join(' | ');
    case 'order':return ex.data.items.map(function(t,k){return (k+1)+'. '+t.replace(/<[^>]*>/g,'');}).join(' | ');
    case 'match':return ex.data.pairs.map(function(p){return p.l+' → '+p.r;}).join(' | ');
    case 'terminal':return ex.data.sol;
    case 'branch':return ex.data.steps.map(function(s,k){var ok=s.ch.findIndex(function(c){return c.ok;});return 'Step '+(k+1)+': '+s.ch[ok].t;}).join(' | ');
    case 'flags':return ex.data.flags.filter(function(f){return f.f;}).map(function(f){return f.t;}).join(' | ');
  }
  return '';
}

/* per-type answer builders; each keeps S.ans[i] up to date */
function buildAnswer(ex,root,i){
  var a=S.ans[i];
  switch(ex.type){
    case 'qcm':{
      var fs=mk('div');fs.setAttribute('role','radiogroup');fs.setAttribute('aria-label','Answer choices');
      ex.data.opts.forEach(function(o,k){
        var lab=mk('label','opt');
        var inp=mk('input');inp.type='radio';inp.name='q'+i;inp.value=k;
        if(a.sel===k)inp.checked=true;
        inp.addEventListener('change',function(){a.sel=k;});
        lab.appendChild(inp);
        lab.appendChild(mk('span',null,o.t));
        lab.appendChild(mk('span','mark',''));
        fs.appendChild(lab);
      });
      root.appendChild(fs);
      a._marks=fs.querySelectorAll('.opt');
      break;}
    case 'qmulti':{
      var fs=mk('div');fs.setAttribute('role','group');fs.setAttribute('aria-label','Answer choices');
      ex.data.opts.forEach(function(o,k){
        var lab=mk('label','opt');
        var inp=mk('input');inp.type='checkbox';
        if(a.sel.indexOf(k)>-1)inp.checked=true;
        inp.addEventListener('change',function(){
          if(this.checked){if(a.sel.indexOf(k)<0)a.sel.push(k);}else{a.sel=a.sel.filter(function(x){return x!==k;});}
        });
        lab.appendChild(inp);
        lab.appendChild(mk('span',null,o.t));
        lab.appendChild(mk('span','mark',''));
        fs.appendChild(lab);
      });
      root.appendChild(fs);
      a._marks=fs.querySelectorAll('.opt');
      break;}
    case 'fill':{
      var bank=mk('div','bank');bank.setAttribute('aria-label','Word bank');
      var slotsWrap=mk('div',null,ex.data.preface||'');
      root.appendChild(slotsWrap);
      var holder=mk('div');
      holder.innerHTML=ex.data.text;
      /* replace {{k}} with slot buttons */
      (function(){
        var html=ex.data.text;
        for(var k=0;k<ex.data.ans.length;k++){
          html=html.replace(new RegExp('\\{\\{'+k+'\\}\\}'),'<button type="button" class="slot" data-slot="'+k+'" aria-label="Blank '+(k+1)+'">'+(ex.data.slots&&ex.data.slots[k]?'<span class="small">'+esc(ex.data.slots[k])+':</span> ':'')+'____</button>');
        }
        holder.innerHTML=html;
      })();
      root.appendChild(holder);
      var slotBtns=holder.querySelectorAll('.slot');
      var selWord=null;
      function redraw(){
        bank.innerHTML='';
        a.bankOrder.forEach(function(wi,pos){
          var used=a.slots.indexOf(wi)>-1;
          if(used)return;
          var b=mk('button','chip',esc(ex.data.bank[wi]));
          b.type='button';
          if(selWord===wi)b.classList.add('sel');
          b.addEventListener('click',function(){selWord=(selWord===wi?null:wi);redraw();});
          bank.appendChild(b);
        });
        if(!bank.children.length)bank.innerHTML='<span class="small">Word bank empty — click a filled blank to take a word back.</span>';
        for(var k=0;k<a.slots.length;k++){
          var sb=slotBtns[k];
          var v=a.slots[k];
          sb.innerHTML=(ex.data.slots&&ex.data.slots[k]?'<span class="small">'+esc(ex.data.slots[k])+':</span> ':'')+(v!=null?esc(ex.data.bank[v]):'____');
          sb.className='slot'+(v!=null?' filled':'');
        }
      }
      slotBtns.forEach(function(sb){
        sb.addEventListener('click',function(){
          var k=parseInt(sb.getAttribute('data-slot'),10);
          if(a.slots[k]!=null){a.slots[k]=null;redraw();return;}
          if(selWord==null)return;
          a.slots[k]=selWord;selWord=null;redraw();
        });
      });
      root.appendChild(bank);
      redraw();
      break;}
    case 'dnd':{
      var bank=mk('div','zone');bank.setAttribute('data-cat','bank');
      bank.innerHTML='<div class="zt">Items (drag or click, then click a target)</div><div class="dropzone"></div>';
      root.appendChild(bank);
      var bankDz=bank.querySelector('.dropzone');
      var cats={};
      ex.data.cats.forEach(function(c){
        var z=mk('div','zone');z.setAttribute('data-cat',c.id);
        z.innerHTML='<div class="zt">'+c.t+'</div><div class="dropzone" aria-label="'+esc(c.t)+'"></div>';
        z.setAttribute('tabindex','0');z.setAttribute('role','button');
        z.setAttribute('aria-label','Drop zone: '+c.t+' — select an item, then press Enter here to place it');
        z.addEventListener('keydown',function(ev){
          if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();placeInto(z._id);}
        });
        root.appendChild(z);
        cats[c.id]=z.querySelector('.dropzone');z._id=c.id;
      });
      var sel=null;
      var chipEls={};
      function placeInto(catId){
        if(S.checked[i]||sel==null)return;
        a.place[sel]=catId;sel=null;refresh();
      }
      function chipFor(it){
        var b=mk('button','chip',it.t);
        b.type='button';b.setAttribute('data-item',it.id);
        b.addEventListener('pointerdown',function(ev){dragStart(ev,b,it);});
        b.addEventListener('click',function(){
          if(S.checked[i])return;
          if(sel===it.id){sel=null;}else{sel=it.id;}
          refresh();
        });
        chipEls[it.id]=b;
        return b;
      }
      function refresh(){
        bankDz.innerHTML='';Object.keys(cats).forEach(function(k){cats[k].innerHTML='';});
        ex.data.items.forEach(function(it){
          var p=a.place[it.id]||'bank';
          var b=chipFor(it);
          if(sel===it.id)b.classList.add('sel');
          if(p==='bank')bankDz.appendChild(b);else cats[p].appendChild(b);
        });
        if(!bankDz.children.length)bankDz.innerHTML='<span class="small">All items placed — click a placed item to take it back.</span>';
      }
      Object.keys(cats).forEach(function(k){
        var z=cats[k].parentNode;
        z.addEventListener('click',function(ev){
          if(S.checked[i])return;
          if(ev.target.closest('.chip'))return;
          if(sel==null)return;
          placeInto(z._id);
        });
      });
      bank.setAttribute('tabindex','0');bank.setAttribute('role','button');
      bank.setAttribute('aria-label','Item bank — select an item, then press Enter here to return it');
      bank.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();if(S.checked[i]||sel==null)return;a.place[sel]='bank';sel=null;refresh();}
      });
      bank.addEventListener('click',function(ev){
        if(S.checked[i])return;
        if(ev.target.closest('.chip'))return;
        if(sel==null)return;
        a.place[sel]='bank';sel=null;refresh();
      });
      /* pointer drag */
      var ghost=null,curZone=null;
      function zoneAt(x,y){
        var zs=document.querySelectorAll('.zone');
        for(var k=0;k<zs.length;k++){
          var r=zs[k].getBoundingClientRect();
          if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return zs[k];
        }
        return null;
      }
      function dragStart(ev,b,it){
        if(S.checked[i])return;
        ev.preventDefault();
        ghost=b.cloneNode(true);ghost.style.position='fixed';ghost.style.zIndex=99;ghost.style.pointerEvents='none';
        ghost.style.left=(ev.clientX-30)+'px';ghost.style.top=(ev.clientY-20)+'px';
        document.body.appendChild(ghost);
        function move(e){
          if(!ghost)return;
          ghost.style.left=(e.clientX-30)+'px';ghost.style.top=(e.clientY-20)+'px';
          var z=zoneAt(e.clientX,e.clientY);
          if(curZone)curZone.classList.remove('over');
          if(z){z.classList.add('over');curZone=z;}
        }
        function up(e){
          document.removeEventListener('pointermove',move);
          document.removeEventListener('pointerup',up);
          if(ghost){ghost.remove();ghost=null;}
          if(curZone)curZone.classList.remove('over');
          var z=zoneAt(e.clientX,e.clientY);
          if(z){var id=z.getAttribute('data-cat');a.place[it.id]=id;}
          sel=null;refresh();
        }
        document.addEventListener('pointermove',move);
        document.addEventListener('pointerup',up);
      }
      refresh();
      break;}
    case 'order':{
      var list=mk('div');list.setAttribute('aria-label','Ordered steps');
      function refresh(){
        list.innerHTML='';
        a.seq.forEach(function(orig,pos){
          var row=mk('div','ordrow');
          row.innerHTML='<span class="num">'+(pos+1)+'</span><span class="txt">'+ex.data.items[orig]+'</span>';
          var up=mk('button','mv','↑');up.type='button';up.setAttribute('aria-label','Move step '+(pos+1)+' up');
          up.addEventListener('click',function(){if(S.checked[i]||pos===0)return;var t=a.seq[pos-1];a.seq[pos-1]=a.seq[pos];a.seq[pos]=t;refresh();});
          var dn=mk('button','mv','↓');dn.type='button';dn.setAttribute('aria-label','Move step '+(pos+1)+' down');
          dn.addEventListener('click',function(){if(S.checked[i]||pos===a.seq.length-1)return;var t=a.seq[pos+1];a.seq[pos+1]=a.seq[pos];a.seq[pos]=t;refresh();});
          row.appendChild(up);row.appendChild(dn);
          list.appendChild(row);
        });
        a._rows=list.querySelectorAll('.ordrow');
      }
      refresh();
      root.appendChild(list);
      break;}
    case 'match':{
      var cols=mk('div','cols');
      var left=mk('div');var right=mk('div');
      left.innerHTML='<h3>Items</h3>';right.innerHTML='<h3>Matches</h3>';
      var selL=null;
      var lEls={},rEls={};
      ex.data.lOrder.forEach(function(pi,pos){
        var b=mk('button','pairbtn',ex.data.pairs[pi].l);
        b.type='button';
        b.addEventListener('click',function(){
          if(S.checked[i])return;
          selL=(selL===pi?null:pi);refresh();
        });
        lEls[pi]=b;left.appendChild(b);
      });
      ex.data.rOrder.forEach(function(ri,pos){
        var b=mk('button','pairbtn',ex.data.pairs[ri].r);
        b.type='button';
        b.addEventListener('click',function(){
          if(S.checked[i])return;
          if(selL==null)return;
          /* if this right item is already used by another left, free it */
          for(var k in a.pair){if(a.pair[k]===ri&&String(k)!==String(selL))a.pair[k]=null;}
          a.pair[selL]=(a.pair[selL]===ri?null:ri);
          selL=null;refresh();
        });
        rEls[ri]=b;right.appendChild(b);
      });
      function refresh(){
        ex.data.pairs.forEach(function(_,k){
          var rb=a.pair[k];
          lEls[k].className='pairbtn'+(selL===k?' picked':'')+(rb!=null?'':' ');
          lEls[k].innerHTML=ex.data.pairs[k].l+(rb!=null?'<span class="pbadge">'+String.fromCharCode(65+rOrderPos(rb))+'</span>':'');
        });
        ex.data.rOrder.forEach(function(ri){
          var owner=null;
          for(var k in a.pair){if(a.pair[k]===ri)owner=parseInt(k,10);}
          rEls[ri].className='pairbtn'+(owner!=null?' ok':'');
          rEls[ri].innerHTML=ex.data.pairs[ri].r+(owner!=null?'<span class="pbadge">'+String.fromCharCode(65+owner)+'</span>':'');
        });
      }
      function rOrderPos(ri){return ex.data.rOrder.indexOf(ri);}
      cols.appendChild(left);cols.appendChild(right);
      root.appendChild(cols);
      refresh();
      break;}
    case 'terminal':{
      var t=mk('div','term');
      t.innerHTML='<div class="small">'+esc(ex.data.banner)+'</div><div class="hist" id="th_'+i+'"></div>'+
        '<div class="inrow"><span class="ps">'+esc(ex.data.ps)+'</span><input id="ti_'+i+'" type="text" spellcheck="false" autocomplete="off" aria-label="Terminal command input" placeholder="'+esc(ex.data.ph||'type a command…')+'"></div>';
      root.appendChild(t);
      var inp=t.querySelector('input');
      inp.value=a.cmd||'';
      inp.addEventListener('input',function(){a.cmd=this.value;});
      inp.addEventListener('keydown',function(e){if(e.key==='Enter'){a.cmd=this.value;$('#checkBtn').focus();}});
      break;}
    case 'branch':{
      var holder=mk('div');
      root.appendChild(holder);
      function drawStep(){
        holder.innerHTML='';
        var s=ex.data.steps[a.picks.length];
        if(s==null){
          var rec='<p class="small">Path decided — press Check to score the choices you made.</p>';
          for(var k=0;k<a.picks.length;k++){
            rec+='<div class="artifact">Step '+(k+1)+' → '+ex.data.steps[k].ch[a.picks[k]].t+'<br>OUTCOME → '+ex.data.steps[k].ch[a.picks[k]].out+'</div>';
          }
          holder.innerHTML=rec;
          return;
        }
        holder.appendChild(mk('p',null,'<b>Step '+(a.picks.length+1)+' of '+ex.data.steps.length+'.</b> '+s.t));
        s.ch.forEach(function(c,ci){
          var b=mk('button',null,c.t);
          b.type='button';b.style.display='block';b.style.width='100%';b.style.textAlign='left';b.style.margin='6px 0';
          b.addEventListener('click',function(){
            if(S.checked[i])return;
            a.picks.push(ci);
            drawStep();
            window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
          });
          holder.appendChild(b);
        });
      }
      drawStep();
      break;}
    case 'flags':{
      var art=$('#artBox');
      var spans=art.querySelectorAll('.fl');
      spans.forEach(function(sp,k){
        sp.setAttribute('tabindex','0');sp.setAttribute('role','button');
        sp.setAttribute('aria-pressed',a.picked.indexOf(k)>-1?'true':'false');
        if(a.picked.indexOf(k)>-1)sp.classList.add('picked');
        function toggle(){
          if(S.checked[i])return;
          var kk=parseInt(sp.getAttribute('data-k'),10);
          var ix=a.picked.indexOf(kk);
          if(ix>-1){a.picked.splice(ix,1);sp.classList.remove('picked');sp.setAttribute('aria-pressed','false');}
          else{a.picked.push(kk);sp.classList.add('picked');sp.setAttribute('aria-pressed','true');}
        }
        sp.addEventListener('click',toggle);
        sp.addEventListener('keydown',function(ev){
          if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle();}
        });
      });
      if(!spans.length){root.appendChild(mk('p','small','No flags in this artifact.'));}
      else{
        root.appendChild(mk('p','small','Click or keyboard-activate every element you believe is a phishing or fraud indicator. Activate again to un-flag. There are '+ex.data.flags.filter(function(f){return f.f;}).length+' true indicators hidden among clickable items.'));
      }
      break;}
  }
}

/* ---------------- check / skip / revise / hint / next ---------------- */
function lockUI(i,locked){
  var ex=DATA[S.order[i]];var a=S.ans[i];
  var ans=$('#ansBd');if(!ans)return;
  ans.querySelectorAll('input,button:not([data-keep])').forEach(function(e){
    if(e.id==='ti_'+i)return;
    if(ex.type==='dnd'){e.disabled=locked;}else{e.disabled=locked;}
  });
  ans.querySelectorAll('.opt').forEach(function(l){l.classList.toggle('lock',locked);});
  var ti=$('#ti_'+i);if(ti){ti.readOnly=locked;ti.style.opacity=locked?.7:1;}
  if(ex.type==='flags'){
    $('#artBox').querySelectorAll('.fl').forEach(function(sp,k){
      if(!locked){sp.classList.remove('ok','err','miss');}
    });
  }
  $('#checkBtn').disabled=locked;
  $('#revBtn').hidden=!locked;
  $('#hintBtn').disabled=locked||S.hints[i]>=ex.hints.length;
}
function showHints(i){
  var ex=DATA[S.order[i]];var hb=$('#hintBox');
  if(!S.hints[i]){hb.className='';hb.innerHTML='';return;}
  var rows=ex.hints.slice(0,S.hints[i]).map(function(hh,k){return '<div>💡 Hint '+(k+1)+': '+hh+'</div>';}).join('');
  hb.className='on';hb.innerHTML=rows+(ex.hints.length>S.hints[i]?'':'<div class="small">All hints used for this exercise (−'+(S.hints[i]*10)+'%).</div>');
}
function useHint(i){
  if(S.checked[i])return;
  var ex=DATA[S.order[i]];
  S.hints[i]=S.hints[i]||0;
  if(S.hints[i]>=ex.hints.length)return;
  S.hints[i]++;
  showHints(i);
  $('#hintBtn').disabled=S.hints[i]>=ex.hints.length;
}
function doCheck(i){
  if(S.checked[i])return;
  if(!hasAnswer(i)){
    $('#fbWrap').className='on';
    $('#fbSum').className='zero';
    $('#fbSum').textContent='Answer the exercise first — then press Check.';
    return;
  }
  var ex=DATA[S.order[i]];
  var g=grade(i);
  var pen=1-0.1*(S.hints[i]||0);
  g.earned=Math.round(g.earned*pen*10)/10;
  S.checked[i]={earned:g.earned,ok:g.ok,els:g.els};
  delete S.skipped[i];   /* answering an exercise clears its skipped flag */
  paintFeedback(i);
  lockUI(i,true);
  S.checkp=true;            /* Check-pause: content stays visible */
  updateChrome();
  $('#explain').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function elNote(ex,key){
  var k=parseInt(key.slice(1),10);
  switch(ex.type){
    case 'flags':return (ex.data.flags[k]||{}).note||'';
    case 'dnd':return (ex.data.items[k]||{}).note||'';
    case 'match':return (ex.data.pairs[k]||{}).note||'';
    case 'qcm':case 'qmulti':return (ex.data.opts[k]||{}).note||'';
    case 'fill':return (ex.data.per&&ex.data.per[k])||'';
    case 'order':return (ex.data.per&&ex.data.per[k])||'';
    case 'branch':return (ex.data.steps[k]&&ex.data.steps[k].why)||'';
  }
  return (ex.explain.per&&ex.explain.per[key])||'';
}
function paintFeedback(i){
  if(!S.checked[i])return;
  var ex=DATA[S.order[i]];var g=S.checked[i];var a=S.ans[i];
  var ans=$('#ansBd');if(!ans)return;
  switch(ex.type){
    case 'qcm':{
      var labs=ans.querySelectorAll('.opt');
      g.els.forEach(function(e2){
        var k=parseInt(e2.key.slice(1),10);
        var o=ex.data.opts[k];
        if(e2.ok===2&&o.ok)labs[k].classList.add('ok');
        else if(e2.ok===0)labs[k].classList.add('err');
        else if(e2.ok===1)labs[k].classList.add('miss');
        if(e2.ok!==2||o.ok){
          var mk2=labs[k].querySelector('.mark');
          mk2.textContent=e2.ok===2?'✓':e2.ok===0?'✗':'⚠';
          mk2.style.color=e2.ok===2?'var(--ok)':e2.ok===0?'var(--err)':'var(--warn)';
        }
      });
      break;}
    case 'qmulti':{
      var labs=ans.querySelectorAll('.opt');
      g.els.forEach(function(e2,k){
        var o=ex.data.opts[k];
        var picked=a.sel.indexOf(k)>-1;
        if(e2.ok===2&&o.ok)labs[k].classList.add('ok');
        else if(e2.ok===0)labs[k].classList.add('err');
        else if(e2.ok===1)labs[k].classList.add('miss');
        if(!(e2.ok===2&&!o.ok&&!picked)){
          var mk2=labs[k].querySelector('.mark');
          mk2.textContent=e2.ok===2?'✓':e2.ok===0?'✗':'⚠ missed';
          mk2.style.color=e2.ok===2?'var(--ok)':e2.ok===0?'var(--err)':'var(--warn)';
        }
      });
      break;}
    case 'fill':{
      var slots=ans.querySelectorAll('.slot');
      g.els.forEach(function(e2){
        var k=parseInt(e2.key.slice(1),10);
        if(slots[k])slots[k].classList.add(e2.ok===2?'ok':'err');
      });
      break;}
    case 'dnd':{
      ans.querySelectorAll('.chip').forEach(function(ch){
        var id=ch.getAttribute('data-item');
        var idx=ex.data.items.findIndex(function(x){return x.id===id;});
        var e2=g.els[idx];
        if(e2&&e2.ok===2)ch.classList.add('ok');else if(e2&&e2.ok===0)ch.classList.add('err');
      });
      break;}
    case 'order':{
      var rows=ans.querySelectorAll('.ordrow');
      g.els.forEach(function(e2,k){if(rows[k])rows[k].classList.add(e2.ok===2?'ok':'err');});
      break;}
    case 'match':{
      var lbs=ans.querySelectorAll('.pairbtn');
      var lefts=ans.querySelectorAll('.cols div:first-child .pairbtn');
      g.els.forEach(function(e2,k){if(lefts[k])lefts[k].classList.add(e2.ok===2?'ok':'err');});
      break;}
    case 'terminal':{
      var hist=$('#th_'+i);
      if(hist&&!hist.dataset.done){
        hist.dataset.done='1';
        var e2=g.els[0];
        hist.innerHTML+='<div style="color:#e9eefb">'+esc(ex.data.ps)+' '+esc(a.cmd)+'</div>'+(e2.ok===2?'<div>'+esc(ex.data.sampleOut||'command accepted')+'</div>':'<div style="color:var(--err)">command rejected — see feedback below</div>');
      }
      break;}
    case 'flags':{
      var spans=$('#artBox').querySelectorAll('.fl');
      g.els.forEach(function(e2,k){
        var sp=spans[k];if(!sp)return;
        sp.classList.remove('picked');
        var truth=ex.data.flags[k].f;
        if(truth&&e2.ok===2)sp.classList.add('ok');
        else if(truth&&e2.ok===1)sp.classList.add('miss');
        else if(!truth&&e2.ok===0)sp.classList.add('err');
      });
      break;}
  }
  /* summary + explanation */
  $('#fbWrap').className='on';
  var sum=$('#fbSum');
  sum.className=g.ok==='full'?'ok':g.ok==='part'?'part':'zero';
  sum.textContent=(g.ok==='full'?'✓ Correct — ':g.ok==='part'?'⚠ Partially correct — ':'✗ Wrong — ')+g.earned+' / '+ex.pts+' points'+(S.hints[i]?' (includes −'+(S.hints[i]*10)+'% hint cost)':'');
  var xl='<p>'+ex.explain.global+'</p>';
  var per=ex.explain.per||{};
  var lis='';
  g.els.forEach(function(e2){
    var note=per[e2.key]||elNote(ex,e2.key);
    if(note){
      var ico=e2.ok===2?'✓':e2.ok===1?'⚠':'✗';
      lis+='<li><b>'+ico+'</b> '+note+'</li>';
    }
  });
  if(lis)xl+='<ul>'+lis+'</ul>';
  var kws=(ex.kw||[]).map(function(k){return '<span class="tag">'+esc(k)+'</span>';}).join('');
  if(kws)xl+='<p class="small">Keywords: '+kws+'</p>';
  $('#explainBd').innerHTML=xl;
  $('#explain').className='on';
}
function doSkip(i){
  if(S.checked[i]){delete S.checked[i];}
  S.skipped[i]=true;
  nextEx();
}
function doRevise(i){
  if(!S.checked[i])return;
  delete S.checked[i];
  var ex=DATA[S.order[i]];
  if(ex.type==='branch'){S.ans[i].picks=[];renderExercise(i);return;}
  lockUI(i,false);
  $('#fbWrap').className='';
  $('#fbSum').textContent='';
  $('#explain').className='';
  updateChrome();
}
function nextEx(){
  S.checkp=false;      /* only Next resumes the Check-pause */
  if(S.idx>=S.order.length-1){finishExam();return;}
  S.idx++;
  renderExercise(S.idx);
  window.scrollTo({top:0,behavior:'smooth'});
}
function finishExam(){
  var any=false;
  for(var i=0;i<S.order.length;i++){if(S.checked[i]){any=true;break;}}
  if(!any){
    var sum=$('#fbSum');
    if(sum){
      $('#fbWrap').className='on';
      sum.className='zero';
      sum.textContent='⚠ You must answer at least one exercise before finishing — every exercise is still skipped. Go back with the navigator, answer at least one exercise, then finish again.';
      sum.scrollIntoView({block:'nearest'});
    }
    return;
  }
  S.finished=true;
  showResults();
}

/* ---------------- timer ---------------- */
function tick(){
  if(!S||!S.started||S.finished)return;
  if(S.manual||S.checkp)return;
  if(S.time>0){S.time--;updateTimer();}
  if(S.time<=0){timeEnd();}
}
function updateTimer(){
  var t=$('#timer');if(!t)return;
  t.textContent=fmtT(S.time);
  t.className='stat mono'+(S.time<300?' crit':S.time<600?' warn':'');
}
function timeEnd(){
  if(S.finished)return;
  S.finished=true;
  for(var i=0;i<S.order.length;i++){if(!S.checked[i])S.skipped[i]=true;}
  showResults('The time ran out. Everything you had not Checked was not counted.');
}

/* ---------------- results ---------------- */
function reportScore(){
  if(S.reported)return;
  var total=0,earned=0;
  for(var i=0;i<S.order.length;i++){
    if(S.skipped[i])continue;
    total+=exMax(i);
    if(S.checked[i])earned+=S.checked[i].earned;
  }
  if(total<=0)return; /* nothing answered: nothing to report */
  S.reported=true;
  earned=Math.round(earned);
  var percent=Math.round(earned/total*100);
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CONFIG.topicId,score:earned,total:total,percent:percent,passed:percent>=CONFIG.passMark},location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}
function showResults(banner){
  $('#scr-exam').hidden=true;$('#scr-results').hidden=false;
  var total=0,earned=0,nAns=0,nSkip=0;
  for(var i=0;i<S.order.length;i++){
    if(S.skipped[i]){nSkip++;continue;}
    total+=exMax(i);
    if(S.checked[i]){earned+=S.checked[i].earned;nAns++;}
  }
  earned=Math.round(earned*10)/10;
  var percent=total>0?Math.round(earned/total*100):0;
  var pass=percent>=CONFIG.passMark;
  var rows='';
  for(var i=0;i<S.order.length;i++){
    var oi=S.order[i],ex=DATA[oi];
    var lab,pt;
    if(S.skipped[i]&&!S.checked[i]){lab='<span class="lab skip">⏭ skipped — not counted</span>';pt='—';}
    else if(S.checked[i]){
      var c=S.checked[i];
      var l2=c.ok==='full'?'full':c.ok==='part'?'partial':'zero';
      lab='<span class="lab '+(c.ok==='full'?'full':c.ok==='zero'?'zero':'part')+'">'+(c.ok==='full'?'✓ full':c.ok==='part'?'◐ partial':'✗ zero')+'</span>';
      pt=c.earned+' / '+ex.pts;
    } else {lab='<span class="lab skip">⏭ not answered — not counted</span>';pt='—';}
    var det='<details class="rdet"><summary class="small">Your answer &amp; why</summary>'+
      '<p><b>Your answer:</b> '+esc(cutTxt(answerSummary(i),600))+'</p>'+
      '<p><b>Correct answer:</b> '+esc(cutTxt(correctSummary(i),600))+'</p>'+
      '<div>'+ex.explain.global+(ex.explain.perHTML||'')+'</div></details>';
    rows+='<tr><td>'+(i+1)+'</td><td>'+esc(ex.title)+'</td><td>'+lab+'</td><td>'+pt+'</td><td>'+det+'</td></tr>';
  }
  var headCls=pass?'pass':'fail';
  var icon=pass?'✔':'✘';
  $('#scr-results').innerHTML=
    (banner?'<div class="panel">'+esc(banner)+'</div>':'')+
    '<div id="resHead" class="'+headCls+'"><div style="font-size:1.1rem">'+icon+' '+(pass?'PASS':'FAIL')+'</div>'+
    '<div id="resScore">'+percent+'%</div>'+
    '<div>'+earned+' points out of '+total+' (answered exercises only) · pass mark '+CONFIG.passMark+'%</div>'+
    (pass?'<p>Certificate-style well done — you mastered this chapter level.</p>':'<p>You must retake this exam to pass. Review the report below, then try again.</p>')+
    '</div>'+
    '<div class="panel"><b>'+nAns+'</b> answered · <b>'+nSkip+'</b> skipped or unanswered (excluded from both score and total)</div>'+
    '<div class="panel"><h2>Per-exercise report</h2><table class="rtable"><thead><tr><th>#</th><th>Exercise</th><th>Result</th><th>Points</th><th>Review</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div style="margin-top:14px"><button id="retakeBtn" class="btnP">Retake Exam</button></div></div>';
  $('#retakeBtn').addEventListener('click',retake);
  reportScore();
}
function retake(){
  var old=S._tick;
  S=freshState();
  S._tick=old;
  shuffleAll();
  $('#scr-results').hidden=true;$('#scr-exam').hidden=false;
  renderNav();updateChrome();renderExercise(0);
  window.scrollTo({top:0,behavior:'smooth'});
}
function shuffleAll(){
  S.order=shuf(DATA.map(function(_,i){return i;}));
  for(var i=0;i<S.order.length;i++){
    S.hints[i]=0;
    var oi=S.order[i],ex=DATA[oi],d=ex.data;
    if(d.opts)d.opts=shuf(d.opts);            /* reshuffle choices every attempt */
    if(ex.type==='dnd')d.items=shuf(d.items); /* reshuffle drag items */
    var a={};
    if(d.opts)a.sel=ex.type==='qmulti'?[]:null;
    if(ex.type==='fill'){a.slots=d.ans.map(function(){return null;});a.bankOrder=shuf(d.bank.map(function(_,k){return k;}));}
    if(ex.type==='dnd'){a.place={};}
    if(ex.type==='order'){
      do{a.seq=shuf(d.items.map(function(_,k){return k;}));}
      while(a.seq.every(function(v,k){return v===k;}));
    }
    if(ex.type==='match'){a.pair=d.pairs.map(function(){return null;});d.lOrder=shuf(d.pairs.map(function(_,k){return k;}));d.rOrder=shuf(d.pairs.map(function(_,k){return k;}));}
    if(ex.type==='terminal'){a.cmd='';}
    if(ex.type==='branch'){a.picks=[];}
    if(ex.type==='flags'){a.picked=[];}
    S.ans[i]=a;
  }
}
