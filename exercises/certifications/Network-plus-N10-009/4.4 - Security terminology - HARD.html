<style>

/* ---------- nav / buttons ---------- */

.ip{color:#7fd0ff}.kw{color:#ff9db1}.ok2{color:#8fe6a8}.er{color:#ff8f8f}.ts{color:#c9b98a}.num{color:#ffd98a}

.optrow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:var(--bg2);min-height:44px;cursor:pointer}

.optrow input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:#1d7fc4}
.optrow.checkedSel{border-color:#2f8a52;background:#10281a}
.mark{font-weight:800}
.res-ok{color:var(--gn)}.res-no{color:var(--rd)}.res-part{color:var(--am)}
.optrow.m-ok{border-color:#2f8a52;background:var(--gnbg)}
.optrow.m-no{border-color:#a34a5a;background:var(--rdbg)}
.optrow.m-part{border-color:#8a6a2f;background:var(--ambg)}
select.pick{background:#0d1729;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;min-height:44px;max-width:100%}

.radios{display:flex;flex-wrap:wrap;gap:8px}

.lines .ln{display:block;width:100%;text-align:left;background:#0a1120;border:1px solid #1e2c49;border-radius:7px;padding:7px 10px;margin:6px 0;font-family:Consolas,Menlo,monospace;font-size:14px;color:#c8d6ef;min-height:44px}
.lines .ln[aria-pressed="true"]{border-color:var(--am);background:#241d0b}
.lines .ln.m-ok{border-color:#2f8a52;background:var(--gnbg)}
.lines .ln.m-no{border-color:#a34a5a;background:var(--rdbg)}

/* drag & drop */
.tray,.cols{display:flex;flex-wrap:wrap;gap:8px}
.tray{min-height:52px;background:var(--bg2);border:1px dashed #33507e;border-radius:10px;padding:9px}
.col{flex:1 1 200px;min-width:190px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;min-height:120px}
.col h4{margin:0 0 8px;font-size:14px;color:var(--cy);border-bottom:1px solid #24345a;padding-bottom:6px}
.col.over{border-color:var(--cy);background:#122240}
.col.m-ok{border-color:#2f8a52}.col.m-no{border-color:#a34a5a}
.itm{display:inline-block;background:var(--card2);border:1px solid #33507e;border-radius:9px;padding:8px 12px;margin:3px;font-size:14px;min-height:44px}
.itm.sel{outline:2px solid var(--cy)}
.itm.m-ok{border-color:#2f8a52;background:var(--gnbg)}
.itm.m-no{border-color:#a34a5a;background:var(--rdbg)}

.ord{list-style:none;margin:8px 0;padding:0}
.ord li{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin:7px 0}

.term{background:#050a12;border:1px solid #1e2c49;border-radius:10px;padding:10px 12px}

.term .ps{color:var(--tl);font-weight:700}

/* log viewer toolbar */
.ltool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.ltool input{flex:1 1 220px;background:#0d1729;border:1px solid #2a4a77;color:var(--txt);border-radius:8px;padding:9px 12px;font-size:15px;min-height:44px}
.ltool .cnt{font-size:14px;color:var(--dim)}

/* feedback + explanation */
.feed{border-radius:10px;padding:12px 14px;margin:10px 0 0;border:1px solid var(--line)}

.expl .lab{color:var(--cy);font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.hintBox{background:var(--ambg);border:1px solid #8a6a2f;border-radius:10px;padding:10px 12px;margin:10px 0 0;color:#ffe1a6}
ul.els{margin:8px 0 0;padding-left:20px}

.kwPanel{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}

.kw{font-size:14px;background:#0d1729;border:1px solid #2a4a77;border-radius:999px;padding:3px 10px;color:#bcd2f2}
.intro ul{margin:8px 0;padding-left:22px}
.intro li{margin:6px 0}
.badge{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:800;letter-spacing:1px;font-size:14px;border:1px solid}
.badge.med{background:#0f3a2a;border-color:#2f8a52;color:#9fe8bd}
.badge.hard{background:#3a1620;border-color:#a34a5a;color:#ffb3bd}
#results .bigScore{font-size:56px;font-weight:900;text-align:center;margin:6px 0}
#results .passP{border:2px solid #2f8a52;background:linear-gradient(180deg,#0f2f1c,#123522);border-radius:14px;padding:22px;text-align:center}
#results .failP{border:2px solid #a34a5a;background:linear-gradient(180deg,#2f1118,#381722);border-radius:14px;padding:22px;text-align:center}

.statChips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
table.rep{width:100%;border-collapse:collapse;margin-top:10px}
table.rep th,table.rep td{border:1px solid #223252;padding:8px 10px;text-align:left;vertical-align:top;font-size:15px}

.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:800;border:1px solid}
.tag.full{background:var(--gnbg);border-color:#2f8a52;color:#9fe8bd}
.tag.part{background:var(--ambg);border-color:#8a6a2f;color:#ffd98a}
.tag.zero{background:var(--rdbg);border-color:#a34a5a;color:#ffb3bd}

.repDet{margin:6px 0 0}
.center{text-align:center}

/* modal */
#modal{position:fixed;inset:0;background:rgba(3,8,18,.78);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modalBox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:20px}

@media (max-width:760px){
  #hdr .row1{flex-direction:column;align-items:flex-start}
  .col{flex:1 1 100%}
  table.match td{display:block;width:100%;border-bottom:none}
  table.match tr{display:block;border-bottom:1px solid #223252;padding:6px 0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media print{body{background:#fff;color:#000}}

window.EXAM_KEYWORDS = [{"id": "risk", "name": "Risk & Risk Management", "kws": ["risk", "likelihood", "impact", "risk assessment", "risk register", "risk appetite", "risk tolerance", "inherent risk", "residual risk", "risk mitigation", "risk acceptance", "risk avoidance", "risk transference (sharing)", "qualitative analysis", "quantitative analysis", "SLE (single loss expectancy)", "ARO (annualized rate of occurrence)", "ALE (annualized loss expectancy)", "risk owner"]}, {"id": "vuln", "name": "Vulnerability & Weakness", "kws": ["vulnerability", "misconfiguration", "unpatched system", "zero-day vulnerability", "CVE", "CVSS", "vulnerability scan", "patch management", "exposure", "weak/default password", "open port"]}, {"id": "exploit", "name": "Exploit & Attack", "kws": ["exploit", "exploit kit", "proof-of-concept (PoC)", "weaponized exploit", "zero-day exploit", "attack vector", "breach", "command and control (C2)", "SQL injection", "path traversal"]}, {"id": "threat", "name": "Threat & Threat Actors", "kws": ["threat", "threat actor", "insider threat", "script kiddie", "hacktivist", "cybercriminal", "nation-state", "advanced persistent threat (APT)", "threat intelligence", "indicator of compromise (IoC)", "opportunistic attack", "targeted attack"], "alts": {"advanced persistent threat (APT)": ["apt"], "indicator of compromise (IoC)": ["ioc", "indicators of compromise"], "targeted attack": ["targeted"]}}, {"id": "cia", "name": "CIA Triad & Controls", "kws": ["confidentiality", "integrity", "availability", "DAD triad (disclosure, alteration, destruction)", "encryption", "hashing", "digital signature", "multi-factor authentication (MFA)", "access control", "backup", "redundancy", "denial of service (DoS)", "eavesdropping", "data tampering", "data leak / exfiltration"], "alts": {"DAD triad (disclosure, alteration, destruction)": ["dad triad", "dad"], "data tampering": ["tampering"], "data leak / exfiltration": ["exfiltration", "data leak"], "denial of service (DoS)": ["dos", "ddos"], "multi-factor authentication (MFA)": ["mfa"], "hashing": ["hash"]}}];
window.EXERCISES = [{"t": "logview", "th": "threat", "lbl": "Spray then silence", "sc": "<p>04:58. The SIEM summary says “elevated VPN auth failures, auto-closed”. Before the stand-up you open the raw auth log. Your lead wants one number: <i>“How many lines prove the attacker actually got in — and through which pattern?”</i></p>", "q": "<p>Select the TWO lines that prove a successful attacker login (not a normal user).</p>", "hint": "One success comes from the office range on a workstation port. Judge every “accepted” line by its source and its account.", "ex": "<p>The two attacker successes: <code>accepted password for svc-scan from 198[.]51[.]100[.]77</code> (a service account that never logs in interactively, from a hosting provider) and <code>accepted password for j.cole from 198[.]51[.]100[.]77</code> (a real user, at 04:44, from the same address). The <code>accepted publickey for j.cole from 10[.]12[.]8[.]50</code> line is <b>normal</b>: a company IP and key-based auth. The pattern across the failures — few tries against <i>many usernames</i> — is <b>password spraying</b>: one weak/default password tested across accounts to beat lockouts. Mass, untargeted spraying across hundreds of firms is an <b>opportunistic attack</b>, not a targeted one.</p>", "logs": ["04:41:02 sshd failed password admin from 198[.]51[.]100[.]77 port 5518", "04:41:05 sshd failed password root from 198[.]51[.]100[.]77 port 5521", "04:41:09 sshd failed password svc-sql from 198[.]51[.]100[.]77 port 5530", "04:41:12 sshd failed password j.cole from 198[.]51[.]100[.]77 port 5533", "04:41:15 sshd failed password m.reed from 198[.]51[.]100[.]77 port 5539", "04:44:26 sshd accepted password svc-scan from 198[.]51[.]100[.]77 port 6102", "04:44:58 sshd accepted publickey j.cole from 10[.]12[.]8[.]50 port 44912", "04:51:33 sshd accepted password j.cole from 198[.]51[.]100[.]77 port 6711", "05:02:10 sshd failed password backup from 203[.]0[.]113[.]9 port 3381"], "w": {"k": "multi", "opts": ["Line: <code>accepted password svc-scan from 198[.]51[.]100[.]77</code>", "Line: <code>accepted publickey j.cole from 10[.]12[.]8[.]50</code>", "Line: <code>accepted password j.cole from 198[.]51[.]100[.]77</code>", "Line: <code>failed password backup from 203[.]0[.]113[.]9</code>", "Line: <code>failed password admin from 198[.]51[.]100[.]77</code>"], "ans": [0, 2]}}, {"t": "qcm", "th": "vuln", "lbl": "Zero-day or not?", "sc": "<p>Wednesday. A vendor published a patch <i>yesterday</i> for a serious flaw in your internet-facing FTP appliance. Public PoC code appeared the same day. Your scan this morning shows the appliance is <b>still unpatched</b>. Honeydew from the marketing channel is already calling it “our zero-day incident”.</p>", "q": "<p>What is the technically correct description of the CURRENT situation?</p>", "hint": "Zero-day means no patch exists. Here a patch exists — somebody just has not applied it.", "ex": "<p>It is an <b>unpatched vulnerability</b> with a public exploit — the appliance is an <b>unpatched system</b> facing the internet. A <b>zero-day</b> exists only while the vendor knows nothing and no patch exists; the moment a patch ships, the flaw is simply “patched” or “unpatched”. Our exposure is real (the PoC is public), but the term zero-day is wrong — and the fix is ours: apply the <b>patch</b>. “Misconfiguration” would mean a wrong setting, not a software flaw. “Accepted residual risk” needs a signed acceptance note, which nobody wrote.</p>", "opts": ["An unpatched vulnerability with a public exploit available", "A zero-day exploit actively running inside our network", "A harmless misconfiguration with no real impact at all", "An accepted residual risk, formally signed off already"], "ans": 0}, {"t": "ddcat", "th": "risk", "lbl": "The register's fine print", "sc": "<p>The audit found that last year's risk responses were recorded with sloppy wording. You must re-sort ten register entries into the response actually used — the wording hides the truth.</p>", "q": "<p>Sort each register entry into the correct risk response.</p>", "hint": "Wrapping a system in controls = mitigate. A clause that pays = transfer. Doing nothing on purpose with a signature = accept. Ending or refusing the activity = avoid.", "ex": "<p><b>Risk acceptance</b>: the board's signed note to keep the research FTP despite flaws, and the tolerated 2% patch failures — both knowingly live with risk, documented. <b>Risk avoidance</b>: not collecting geolocation data and not launching the risky API, plus selling the unsecurable product line — the risky activity <i>ends or never starts</i>. <b>Risk transference</b>: the 5M insurance and the provider-pays-fines clause — money moves to another party. <b>Risk mitigation</b>: EDR plus monitoring, the strict firewall around the OT machine, DB anomaly alerts — controls <i>reduce</i> the risk. The OT case is the trap: the vendor forbids touching the machine, so people call it “accept” — but adding a compensating control is <b>mitigation</b>.</p>", "cats": ["Mitigate", "Accept", "Avoid", "Transfer"], "items": [{"s": "Board signs: keep the research FTP live despite its flaws", "c": 1}, {"s": "We stop collecting the geolocation data we never used", "c": 2}, {"s": "Cyber insurance now covers 5M USD of breach cost", "c": 3}, {"s": "EDR on all servers plus 24/7 monitored alerts", "c": 0}, {"s": "OT vendor forbids patching; we wrap the machine in a strict firewall", "c": 0}, {"s": "The risky public API launch is cancelled entirely", "c": 2}, {"s": "Cloud contract clause: provider pays fines for their side's breaches", "c": 3}, {"s": "We tolerate the 2% patch failure rate on old lab PCs, reviewed yearly", "c": 1}, {"s": "Database anomaly alerts added for unusual query volumes", "c": 0}, {"s": "We sell the legacy product line we can no longer secure", "c": 2}]}, {"t": "branch", "th": "threat", "lbl": "INC-8841: mixed evidence", "sc": "<p>Ticket INC-8841, 03:14: DLP blocked and flagged a post of 900 customer records to a pastebin-like site from account fin-01. Quick checks: fin-01's workstation missed the April patch; the account logged in at 03:02 from its usual office IP; a new Outlook rule forwards mail to an outside address. The user is on holiday. Evidence points in two directions at once.</p>", "q": "<p>Decide step by step. Each choice unlocks the next step.</p>", "hint": "When evidence is mixed: contain and gather, do not accuse. Missing patch = possible door, not proof. A forwarding rule = data leaving.", "ex": "<p>Step 1: the evidence is <b>mixed</b> — office-IP login argues for the user, the DLP catch and the forwarding rule argue for a stolen session — so <b>contain and gather</b>; firing or clearing the user both jump ahead of the facts. Step 2: containment = disable the account, block the outside site, isolate the workstation while keeping memory — rebooting would destroy volatile evidence. Step 3: the missing April patch is a <b>vulnerability</b> — a possible entry door; without exploit evidence you cannot call it the proven path. Step 4: an auto-forwarding rule means mail leaves the company — <b>exfiltration</b>, a <b>confidentiality</b> breach in progress. This is why the ticket stays “confirmed breach, actor unknown”.</p>", "steps": [{"p": "Opening move for INC-8841?", "opts": ["Contain first: treat it as a suspected breach and gather more evidence", "Close as false positive — the login came from the office IP", "Accuse the user — DLP never lies", "Reset every password in the company immediately"], "ans": 0, "why": "Mixed evidence demands containment plus collection. The office IP alone proves nothing — sessions can be stolen."}, {"p": "Containment plan — which set of actions?", "opts": ["Disable fin-01, block the pastebin domain, isolate the workstation preserving memory", "Reboot the workstation so the malware stops", "Delete the DLP alerts to avoid noise", "Wait for the user to come back from holiday"], "ans": 0, "why": "Disable, block, isolate — and keep memory intact. Rebooting destroys volatile evidence; waiting lets data flow."}, {"p": "The workstation missed the April patch. In report wording, that is …", "opts": ["A vulnerability that may have been the entry point — not yet proof", "Proof that an exploit ran", "A zero-day with no fix available", "The threat actor behind the incident"], "ans": 0, "why": "A missing patch is a vulnerability — a possible door. Calling it proof of exploitation or naming it a threat actor confuses the terms."}, {"p": "The hidden Outlook rule forwards mail outward. That indicates …", "opts": ["Exfiltration — a confidentiality breach in progress", "An availability problem with the mail server", "An integrity fix to the mailbox", "Normal housekeeping by IT"], "ans": 0, "why": "Mail silently leaving the company is exfiltration — confidentiality loss. It also explains the DLP catch."}]}, {"t": "fill", "th": "risk", "lbl": "The board memo in numbers", "sc": "<p>The CFO's memo about moving company email to a cloud provider must survive the audit — every risk term must be exact. Your job: fill the blanks before it goes out.</p>", "q": "<p>Complete the memo with a term for each blank.</p>", "hint": "Raw risk before controls = inherent. One event's cost = SLE. Events per year = ARO. Their product = ALE. What remains after controls = residual.", "ex": "<p>The memo in full: the raw danger of a provider outage is the <b>inherent</b> risk. One lost day costs 120,000 EUR — the <b>SLE</b>. The provider's SLA history puts outages at 0.5 per year — the <b>ARO</b>. Multiply them: <b>ALE</b> = 60,000 EUR per year, the number the board compares against control costs. A second provider cuts the expected loss, leaving a much smaller <b>residual</b> risk — small enough that the board accepts it as within its <b>appetite</b>: the amount of risk it is willing to take for the business benefit. This whole memo is <b>quantitative analysis</b> — the numeric side of a risk assessment; a <b>qualitative analysis</b> would use adjectives instead.</p>", "pre": ["<p>Finance memo: moving email to the cloud carries an ", "", " risk of provider outage. One outage day would cost 120,000 EUR — the ", "", ". Provider history shows 0.5 outages per year — the ", "", " — so the expected yearly loss, the ", "", ", is 60,000 EUR. A second provider lowers the ", "", " risk to a level the board accepts as within its ", "", ".</p>"], "ans": ["inherent", "SLE", "ARO", "ALE", "residual", "appetite"], "bank": ["inherent", "SLE", "ARO", "ALE", "residual", "appetite", "exploit", "qualitative"]}, {"t": "match", "th": "vuln", "lbl": "Read the CVSS vector", "sc": "<p>A pentester's handover includes five CVSS rows and two vector fragments. Before the debrief, the client's PM asks you to check every row — she was burned last year by a vendor that mislabeled severities.</p>", "q": "<p>Match each row to its correct reading.</p>", "hint": "Bands: 0.1–3.9 low, 4.0–6.9 medium, 7.0–8.9 high, 9.0–10 critical. In the vector, C = confidentiality, A = availability.", "ex": "<p><b>9.9, AV:N, PR:N</b> — network-reachable, no privileges: <b>critical</b>. <b>6.5</b> sits in the <b>medium</b> band (4.0–6.9) even though the impact text sounds scary — the number decides the band. <b>3.1, local, low impact</b> — <b>low</b>. <b>8.8 with UI:R</b> (user interaction required) is still <b>high</b> — interaction lowers exploitability but not below 7.0. <b>C:H</b> in a vector names <b>confidentiality</b> impact as high; <b>A:H</b> names <b>availability</b>. The bands are fixed: 0.1–3.9 low, 4.0–6.9 medium, 7.0–8.9 high, 9.0–10 critical — vendors sometimes get this wrong, so check the math.</p>", "left": ["CVSS 9.9 — AV:N, PR:N (network, no privileges)", "CVSS 6.5 — high impact text, requires an authenticated user", "CVSS 3.1 — local access, low impact", "CVSS 8.8 — user interaction required (UI:R)", "Vector fragment: C:H", "Vector fragment: A:H"], "right": ["Critical severity", "Medium severity", "Low severity", "High severity", "Confidentiality impact is High", "Availability impact is High"], "ans": [0, 1, 2, 3, 4, 5]}, {"t": "spot", "th": "vuln", "lbl": "The tenant config review", "sc": "<p>A partner asked you to sanity-check their storage tenant config before an external audit. You have eight lines. The partner insists “it passed the vendor's own wizard” — wizards are not auditors.</p>", "q": "<p>Click the FOUR lines that are real weaknesses. Click again to unmark.</p>", "art": "<pre class='log'># tenant: partner-finance-archive\nbucket_name = hr-payroll-export\npublic_access = allowed\nencryption_at_rest = none\nversioning = enabled\nadmin_accounts = 47   # every manager has full console\naccess_logging = enabled\npassword_policy = min 8 chars, no complexity, rotate 365d</pre>", "hint": "Public access on a payroll bucket, no encryption, 47 admins, and a toothless password policy — the rest is fine.", "ex": "<p>The four weaknesses: <b>public_access = allowed</b> on a payroll export bucket — the <b>exposure</b> is the whole internet; <b>encryption_at_rest = none</b> — a stolen disk or a leaked export is readable (confidentiality); <b>admin_accounts = 47</b> — 47 full admins means 47 stealable keys and no accountability (violates least privilege — the access control principle); the <b>password policy</b> allows 8 simple characters rotated yearly — passwords will fall to guessing. Versioning and access logging are good; the bucket name itself is not a weakness.</p>", "lines": [{"s": "public_access = allowed (on a payroll export bucket)", "bad": true}, {"s": "encryption_at_rest = none", "bad": true}, {"s": "admin_accounts = 47 (every manager full console)", "bad": true}, {"s": "password_policy = min 8 chars, no complexity, rotate 365d", "bad": true}, {"s": "versioning = enabled", "bad": false}, {"s": "access_logging = enabled", "bad": false}, {"s": "bucket_name = hr-payroll-export", "bad": false}]}, {"t": "rank", "th": "vuln", "lbl": "Six patches, one window", "sc": "<p>Change control granted you one patch window tonight. Six findings compete. Raw CVSS does not decide alone: exposure, exploit status and asset value do. The queue: (1) DMZ VPN, CVSS 7.5, active exploitation reported; (2) internal DB, CVSS 9.9, no public exploit, only the app account can reach it; (3) dev laptop, CVSS 10.0, PoC public, usually offline; (4) finance app server, CVSS 8.1, exploit public, reachable by all staff; (5) printer fleet, CVSS 6.1, no exploit, no sensitive data; (6) legacy kiosk, CVSS 9.8, exploit public, air-gapped.</p>", "q": "<p>Rank the six patch targets for tonight — most urgent first.</p>", "hint": "Actively exploited and internet-facing wins every time. A 10.0 on an offline laptop waits. Air-gap beats a public exploit.", "ex": "<p><b>1. DMZ VPN</b> — actively exploited <i>and</i> internet-facing: attackers need no privileges. <b>2. Finance app server</b> — public exploit plus staff-wide reachability on a high-value system. <b>3. Internal DB</b> — CVSS 9.9 but no public exploit and only the app account can reach it: serious, not tonight's emergency. <b>4. Dev laptop</b> — a perfect 10.0 means nothing when the machine is offline most of the week. <b>5. Legacy kiosk</b> — public exploit but air-gapped: the exploit cannot travel. <b>6. Printer fleet</b> — low score, no exploit kit coverage, no crown jewels. Lesson (fed by threat intelligence feeds that track active exploitation): severity × <b>exposure</b> × <b>exploitability</b> × asset value — in that spirit, not by score alone.</p>", "seq": ["DMZ VPN — CVSS 7.5, actively exploited in the wild", "Finance app server — CVSS 8.1, public exploit, all staff reach it", "Internal DB — CVSS 9.9, no public exploit, app account only", "Dev laptop — CVSS 10.0, PoC public, usually offline", "Legacy kiosk — CVSS 9.8, public exploit, air-gapped", "Printer fleet — CVSS 6.1, no exploit, no sensitive data"]}, {"t": "triage", "th": "cia", "lbl": "Which pillar, really?", "sc": "<p>The audit trainees keep labeling incidents by gut feeling. You build a drill with six archived incidents — several have a tempting wrong answer.</p>", "q": "<p>Classify each incident by the CIA element it damages MOST.</p>", "hint": "Missing log entries = records changed. Restored-but-different files = content changed. A leak is confidentiality even when nothing broke.", "ex": "<p>1. Edited IBAN → <b>integrity</b> — money would go to the wrong account. 2. Missing SIEM entries → <b>integrity</b>, not availability: the log system runs fine, its <i>content</i> was altered — the classic log-tampering trap. 3. Shares down for 3 hours → <b>availability</b>. 4. Restored files whose hashes differ → <b>integrity</b> — the restore “works” but the content changed; a hash or <b>digital signature</b> check would have caught it. 5. Org chart on social media → <b>confidentiality</b> — nothing broke, data was disclosed. 6. Power loss stopping everything → <b>availability</b>. If a question feels obvious, check whether the damage is to <i>truth</i> (integrity), <i>reachability</i> (availability) or <i>secrecy</i> (confidentiality).</p>", "rows": [{"s": "Attacker edited the direct-debit IBAN in vendor master data", "opts": ["Confidentiality", "Integrity", "Availability"], "ans": 1}, {"s": "SIEM shows a clean 60-minute gap: log entries for 02:00–03:00 are gone", "opts": ["Confidentiality", "Integrity", "Availability"], "ans": 1}, {"s": "File shares unreachable for 3 hours after a crash", "opts": ["Confidentiality", "Integrity", "Availability"], "ans": 2}, {"s": "Restore test passes, but restored file hashes differ from the source", "opts": ["Confidentiality", "Integrity", "Availability"], "ans": 1}, {"s": "Internal org chart posted on social media", "opts": ["Confidentiality", "Integrity", "Availability"], "ans": 0}, {"s": "Data-centre power loss stops all operations for a day", "opts": ["Confidentiality", "Integrity", "Availability"], "ans": 2}]}, {"t": "qcm", "th": "threat", "lbl": "Timeouts at 20:00", "sc": "<p>20:00. The public shop times out for everyone. Social media shouts “DDoS!”. The packet capture shows 200 Gbps of DNS-reflection traffic. Separately — and quietly — the same night, an account named <code>shopadmin</code> logged in from abroad with a password from a 2023 leak and browsed order exports.</p>", "q": "<p>Which statement classifies the 200 Gbps flood most accurately?</p>", "hint": "The flood itself: no code, no flaw used, no measurement of chance — an event of a certain kind.", "ex": "<p>The flood is a <b>threat event attacking availability</b> — a denial of service (DoS) flood, the volumetric kind: its entire goal is to exhaust capacity. It is not a <b>vulnerability</b> (no flaw inside our code is being used — the weakness is raw link capacity), not an <b>exploit</b> (no code exploiting a flaw), and not a <b>risk</b> (a risk is the measured chance-and-impact, not the event). The separate <code>shopadmin</code> login with a leaked password is a different story: a <b>confidentiality</b> breach via stolen credentials — one incident can carry several classifications at once.</p>", "opts": ["A threat event damaging availability", "An exploit of a code flaw in the shop", "A vulnerability of our network link", "The measured risk of a flood, in numbers"], "ans": 0}, {"t": "multi", "th": "risk", "lbl": "Appetite, tolerance, residue", "sc": "<p>Governance week. The new risk analyst made seven flashcards; your job before the exam is to strike out the wrong ones — four statements are true, three are not.</p>", "q": "<p>Select every TRUE statement (4 of the 7).</p>", "hint": "Appetite is set by leadership, tolerance is the day-to-day deviation band. Insurance moves money, not shame. A flood threatens buildings without any software flaw.", "ex": "<p>True: <b>1</b> — <b>risk appetite</b> is leadership's willingness to take risk for benefit; <b>risk tolerance</b> is the narrower band of acceptable deviation in daily operations. True: <b>3</b> — <b>transference</b> moves the financial pain (insurance pays), but reputational damage stays with you. True: <b>5</b> — a <b>risk</b> needs a threat and impact, not necessarily a software flaw: a flood hits the building with zero vulnerabilities in our code. True: <b>7</b> — removing a vulnerable system removes its risk: that is <b>avoidance</b>. False: <b>2</b> — residual risk can never exceed inherent risk if the controls actually work. False: <b>4</b> — undocumented acceptance is how risks get forgotten; acceptance must be signed. False: <b>6</b> — most vulnerabilities never become incidents; that is exactly why we measure likelihood.</p>", "opts": ["Risk appetite is set by leadership; tolerance is the allowed day-to-day deviation", "Residual risk can be higher than inherent risk", "Transference moves the financial pain, not the reputational harm", "Acceptance is fine without any documentation", "A risk can exist with no vulnerability at all — a flood hits the building, not our code", "Every vulnerability becomes an incident eventually", "Removing a vulnerable system removes the risk it carried — that is avoidance"], "ans": [0, 2, 4, 6]}, {"t": "terminal", "th": "exploit", "lbl": "Handover: port 4444", "sc": "<p>SOC handover note: <i>“jump-01 shows a steady outbound connection to 203[.]0[.]113[.]66 on TCP 4444. Nobody scheduled it. Identify the process behind the connection and fingerprint the binary for the ticket.”</i></p>", "q": "<p>Type the commands you would run — one per line (up to 3 lines), pressing Enter after each. You need: the process and user behind that connection, and a checksum of its binary.</p>", "hint": "First: socket-to-process mapping tools. Then: a checksum command on the binary path.", "ex": "<p>Step 1 — map the connection to a process: <code>ss -tulpn | grep 4444</code>, <code>netstat -tulpn</code>, or <code>lsof -i :4444</code>; these socket tools list every <b>open port</b> and reveal the PID, process name and user behind the socket. Step 2 — fingerprint the binary from the resolved path: <code>md5sum /path/binary</code>. The checksum is a <b>hash</b> — hashing the binary lets responders match the sample against malware databases — turning one suspicious PID into a comparable <b>indicator of compromise (IoC)</b>. A beacon to an external host on an odd port is <b>command and control (C2)</b> behaviour: the machine is likely speaking to its operator.</p>", "maxLines": 3, "okGroups": [{"re": "(ss -t?u?l?n?|netstat|lsof|fuser|/proc/net).*(4444|grep|-[atn])", "sample": "ss -tulpn | grep 4444   (or: lsof -i :4444)"}, {"re": "(md5sum|sha256sum|sha1sum|shasum|openssl dgst)\\b.*(\\/|\\$\\()", "sample": "md5sum /usr/local/bin/beaconx"}]}, {"t": "ddcat", "th": "vuln", "lbl": "One word per story", "sc": "<p>The audit committee wants proof the team can use the core terms precisely. Ten anonymised stories, four labels — the committee chair counts every mistake.</p>", "q": "<p>Sort each story into the single best-fitting term.</p>", "hint": "Listing = vulnerability. Running code or technique = exploit. The damaging event or actor = threat. The measured or felt damage = impact.", "ex": "<p><b>Vulnerability</b>: the CVE listing, the default SNMP community string, the unencrypted laptop — all weaknesses waiting to be used. <b>Exploit</b>: the public PoC for the flaw, the malicious PDF that drops an implant (a weaponized exploit inside a document), the SQL injection run against the orders table — techniques or code <i>in action</i> against a weakness. <b>Threat</b>: the botnet flooding the gateway, the disgruntled admin, the ransom demand — the actor or damaging event itself. <b>Impact</b>: the 300,000 EUR downtime bill and the lost customer trust — the <i>damage</i> the event causes, not the event. Chair's rule: name the weakness, the weapon, the attacker, or the wound — one per story.</p>", "cats": ["Vulnerability", "Exploit", "Threat", "Impact"], "items": [{"s": "A published CVE entry for the JSON-library flaw", "c": 0}, {"s": "A public proof-of-concept that triggers that flaw", "c": 1}, {"s": "A botnet floods the VPN gateway until it drops", "c": 2}, {"s": "300,000 EUR of downtime cost after the outage", "c": 3}, {"s": "Default SNMP community string left on a core switch", "c": 0}, {"s": "A malicious PDF that drops an implant when opened", "c": 1}, {"s": "A disgruntled admin with domain rights", "c": 2}, {"s": "Loss of customer trust after the breach news", "c": 3}, {"s": "A laptop without encryption left in a taxi", "c": 0}, {"s": "SQL injection used to dump the orders table", "c": 1}]}, {"t": "order", "th": "threat", "lbl": "Evidence before erasure", "sc": "<p>A contractor workstation is suspected compromised. The CFO wants it “wiped and back by lunch”. The forensic lead wants order. Seven actions are on the table; some orders destroy the case, others let the attacker keep access.</p>", "q": "<p>Order the seven actions correctly — first step on top.</p>", "hint": "Validate before moving. Isolate before collecting. Collect before changing anything. Verify the attacker is gone at the very end.", "ex": "<p><b>1. Validate the alert</b> — confirm the detection is real (false positives burn hours). <b>2. Isolate the host</b> — cut the attacker's channel while keeping the machine powered (a reboot destroys memory evidence). <b>3. Capture memory and disk image</b> — volatile data dies first, so memory comes before anything that changes the machine. <b>4. Reset exposed credentials</b> — assume passwords on that host are stolen. <b>5. Remove persistence</b> — scheduled tasks, services, accounts the attacker installed; eradicating before collecting would delete your proof. <b>6. Restore or rebuild</b> from clean sources. <b>7. Verify no re-entry</b> — monitor to confirm the attacker does not walk back in. Wiping first (the CFO's plan) erases both evidence and the attacker's trail.</p>", "seq": ["Validate the alert is a true positive", "Isolate the workstation from the network", "Capture memory, then a disk image", "Reset credentials that were exposed on the host", "Remove attacker persistence (tasks, services, accounts)", "Restore or rebuild from clean sources", "Monitor to verify there is no re-entry"]}, {"t": "logview", "th": "exploit", "lbl": "Proof of success", "sc": "<p>The WAF console shows a busy night, but your manager only funds incidents on <i>proof</i>. In the web log you have one job: find the line that proves the attack did not just get attempted — it <b>succeeded</b>.</p>", "q": "<p>Which single line proves the attack succeeded? Use the filter box (try the source IP) to line the story up.</p>", "hint": "A blocked attempt is not success. Success shows a normal status, a big payload out, and the same source as the earlier probes.", "ex": "<p>The proof line is the <code>200</code> on <code>/export?fmt=csv&amp;all=1</code> returning 48,213 bytes from the same IP (198[.]51[.]100[.]42) that ran the encoded SQL-injection probes. That is an <b>exploit</b> followed by <b>exfiltration</b>: the flaw worked and the data went out. The <code>403</code> lines — SQL injection pieces and a <b>path traversal</b> — are <b>blocked attempts</b>: real, but not successful; the WAF did its job. Status 200 with a huge response size right after probing is the classic success signature. This is why raw counts of “attacks blocked” never tell the whole story — only the <i>status and payload</i> lines do.</p>", "logs": ["GET /search?q=laptop 200 4120 from=198[.]51[.]100[.]42", "GET /search?q=laptop%27%20UNION%20SELECT%20user,pass-- 403 121 from=198[.]51[.]100[.]42 WAF", "GET /search?q=laptop%27%20OR%20%271%27%3D%271 403 118 from=198[.]51[.]100[.]42 WAF", "GET /search?q=%27%3BDROP%20TABLE%20users-- 403 119 from=198[.]51[.]100[.]42 WAF", "GET /search?q=%27%20UNION%20SELECT%20NULL,user(),database() 500 45 from=198[.]51[.]100[.]42", "GET /export?fmt=csv&all=1 200 48213 from=198[.]51[.]100[.]42", "GET /favicon.ico 200 1406 from=10[.]12[.]8[.]31", "GET /health 200 12 from=10[.]12[.]8[.]9"], "w": {"k": "qcm", "opts": ["The 200 export line that sent 48213 bytes to the probing IP", "The UNION SELECT probe that the WAF blocked with a 403", "The DROP TABLE probe that the WAF blocked with a 403", "The health check answered 200 to an internal IP"], "ans": 0}}, {"t": "match", "th": "threat", "lbl": "Motive and method", "sc": "<p>The intel briefing table has six anonymised cases. For the exercise you must pair each case with the actor whose motive and method fit best — two cases are hybrids, so read carefully.</p>", "q": "<p>Match each case to the actor type.</p>", "hint": "Access + profit = insider even if they sell to criminals. Bulk scans for money = cybercriminal. Quiet, custom, patient = nation-state.", "ex": "<p><b>Recruited employee exporting for cash</b> — the defining fact is legitimate access betrayed: <b>insider threat</b>, even though the buyer is a cybercriminal. <b>Buying stolen credentials to drain accounts</b> — profit through theft: <b>cybercriminal</b>. <b>University defacement during a tuition protest</b> — political message: <b>hacktivist</b>. <b>Eight quiet months inside a grid vendor with custom tools</b> — patience, stealth, no ransom: <b>nation-state / APT</b>. <b>Downloaded botnet builder flooding a game server for fun</b> — low skill, borrowed tools: <b>script kiddie</b>. <b>State-linked web shell in a telecom for espionage</b> — long-term intelligence access: <b>nation-state / APT</b> again. Hybrids exist in real life; classify by the actor's own motive and access, not the tool.</p>", "left": ["An employee is paid to export client data before quitting", "A crew buys stolen credentials and drains accounts for profit", "A group defaces a university site during a tuition protest", "Eight quiet months inside a grid vendor, custom tools, no ransom demand", "A downloaded botnet builder floods a game server for fun", "A state-linked crew leaves a web shell in a telecom for espionage"], "right": ["Insider threat", "Cybercriminal", "Hacktivist", "Nation-state / APT", "Script kiddie", "Nation-state / APT"], "ans": [0, 1, 2, 3, 4, 5]}, {"t": "qcm", "th": "threat", "lbl": "Three gigabytes a night", "sc": "<p>For six weeks, roughly 3 GB of research documents left the company every night at 03:00 — small, encrypted flows, custom malware, no ransom note, no defacement. The target: one battery-patent programme. Nothing else was touched.</p>", "q": "<p>Who is most likely behind this, and why?</p>", "hint": "Patience, custom tools, one specific prize, no profit attempt — whose playbook is that?", "ex": "<p>A <b>nation-state / APT</b>. The signatures: months of <b>patient dwell time</b>, <b>custom malware</b> (not bought kits), a <b>targeted</b> objective (one patent programme), and no monetisation attempt — the goal is strategic advantage, not quick money. A <b>cybercriminal</b> would push ransomware or steal payment data for profit. A <b>script kiddie</b> lacks the skill and patience for six quiet weeks. An <b>accidental insider leak</b> does not ship custom malware nightly. When motive is espionage and tradecraft is patient, think state-funded.</p>", "opts": ["A nation-state / APT — patient espionage for strategic IP", "A ransomware crew that simply forgot to leave its note", "A script kiddie showing off to a favourite forum", "An intern who misconfigured the nightly backup job"], "ans": 0}, {"t": "fill", "th": "risk", "lbl": "The policy's exact words", "sc": "<p>The risk-policy handbook is in final review. Legal flagged that last year's copy used the response words loosely, and an audit finding followed. Six blanks decide whether this year's copy passes.</p>", "q": "<p>Complete the policy with a term for each blank.</p>", "hint": "Who wants which risk = appetite. Daily band = tolerance. Reduce = mitigate. Stop = avoid. Insure = transfer. Everything gets written down — where?", "ex": "<p>The policy in full: the board sets the company's risk <b>appetite</b> — how much risk it will take for value. Each system owner may accept risk only up to their <b>tolerance</b> — the deviation band they may allow without escalation. Risks above that line must be <b>mitigated</b> with controls or <b>avoided</b> by ending the activity. Financial exposure may be <b>transferred</b> through insurance or contract clauses. And every acceptance, every response, lives in the <b>risk register</b> — reviewed yearly, because undocumented decisions fail audits. The words are strict on purpose: loose wording is how a mitigation gets recorded as an “acceptance” and nobody funds the fix.</p>", "pre": ["<p>Policy 4.1: the company's risk ", "", " is set by the board. Each system owner may accept risk up to their ", "", " level. Risks above that level must be ", "", " with controls or ", "", " by stopping the activity. Financial exposure may be ", "", " via insurance. Every acceptance is recorded in the risk register and reviewed yearly.</p>"], "ans": ["appetite", "tolerance", "mitigated", "avoided", "transferred"], "bank": ["appetite", "tolerance", "mitigated", "avoided", "transferred", "exploited", "disclosed", "qualitative"]}, {"t": "spot", "th": "vuln", "lbl": "The report that mixes its words", "sc": "<p>A junior analyst's incident report reached the client before review. The client's CISO — who teaches terminology at a local university — will mark it. You have one chance to find the three terminology errors.</p>", "q": "<p>Click the THREE sentences that misuse a security term. Click again to unmark.</p>", "hint": "The server was not the threat — it was the weakness. A login-failure flood is not an integrity attack. A patch reduces risk; it never reaches zero.", "ex": "<p>Wrong 1: <i>“The flood of login failures was an integrity attack.”</i> — It is a <b>threat event</b> targeting authentication (and availability of the log view); nothing was <i>changed</i>, so integrity is the wrong pillar. Wrong 2: <i>“Our unpatched server was the threat.”</i> — The unpatched server is the <b>vulnerability</b> (the weakness); the <b>threat</b> is the actor exploiting it. Confusing these two is the classic error. Wrong 3: <i>“Risk went to zero after the patch.”</i> — A patch reduces the risk to a <b>residual</b> level; zero is unreachable (the patch itself can have flaws, and the attacker already had access). The correct sentences use exploit, vulnerability/exploit distinction and confidentiality properly.</p>", "lines": [{"s": "At 03:10 the attacker exploited CVE-2024-1234 on the mail server.", "bad": false}, {"s": "The CVE entry was the vulnerability; the code they used was the exploit.", "bad": false}, {"s": "The flood of login failures was an integrity attack.", "bad": true}, {"s": "Data sent to the attacker's server is a confidentiality breach.", "bad": false}, {"s": "Our unpatched server was the threat.", "bad": true}, {"s": "The incident raised the residual risk noted on the register.", "bad": false}, {"s": "After the patch, the risk went to zero.", "bad": true}]}, {"t": "rank", "th": "risk", "lbl": "Residual after the controls", "sc": "<p>Five register entries, all treated last year. The committee asks: after the controls, which risks still worry us most? Rank the <b>residual</b> risk — highest first.</p>", "q": "<p>Rank the five treated risks by remaining (residual) risk, highest first.</p>", "hint": "Controls that only partly work leave the most residue. Removed or insured risks leave little.", "ex": "<p><b>1. Phishing</b> — filters and training reduce it, but one sincere click still succeeds: high residual. <b>2. OS zero-day</b> — you cannot patch what nobody knows; EDR behaviour blocks help, but the flaw itself remains until a patch exists: high residual. <b>3. Data-centre fire</b> — suppression plus insurance leave a real but managed remainder: medium. <b>4. Internal man-in-the-middle</b> — TLS everywhere plus pinning makes success very unlikely: low residual. <b>5. HQ flood</b> — the operation moved regions; the activity that carried the risk is gone: very low residual. Residual ranking is how committees decide what to treat next — it is never about the original score.</p>", "seq": ["Phishing — filters + training only partly work", "Zero-day in our OS — EDR behaviour blocks, no patch exists", "Fire in the data centre — suppression + insurance remain", "Internal man-in-the-middle — TLS everywhere + pinning", "HQ flood — operations moved to another region"]}, {"t": "triage", "th": "risk", "lbl": "Change board crossfire", "sc": "<p>Five change requests reached the risk break-out group. The chair wants one term per request — and she has rejected two submissions already for calling compensating controls “acceptance”.</p>", "q": "<p>Choose the correct risk response for each request.</p>", "hint": "Launch with controls = mitigate. Ship knowingly with a signature = accept. Stop holding the data = avoid. Vendor carries the liability = transfer.", "ex": "<p>1. Public API with rate limits, auth and WAF before launch → <b>mitigate</b> — controls reduce the risk of the activity you still perform. 2. Shipping on the old framework with the CISO's signed note of known flaws → <b>acceptance</b> — knowing, documented, no new controls. 3. Not storing raw card numbers at all (tokenizing instead) → <b>avoidance</b> — the risky activity never happens; you cannot breach data you do not hold. 4. A payment provider that carries PCI liability → <b>transference</b> — the financial pain moves by contract. 5. Patched auth service with a canary rollout → <b>mitigation</b>. The trap in item 3: tokenization <i>feels</i> like transfer, but not holding the data is avoidance — the strongest possible outcome.</p>", "rows": [{"s": "Launch the public API — with rate limits, auth and a WAF in place first", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 0}, {"s": "Ship on the old framework as-is; the CISO signs the note of known flaws", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 1}, {"s": "Cancel the plan to store raw card numbers; tokenize through the provider instead", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 2}, {"s": "Route all card handling to a provider whose contract carries the PCI liability", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 3}, {"s": "Patch the auth-service flaw behind a canary rollout", "opts": ["Mitigate", "Accept", "Avoid", "Transfer"], "ans": 0}]}, {"t": "branch", "th": "cia", "lbl": "03:40 — .locked", "sc": "<p>03:40. The file server shows 40,000 files renamed to <code>.locked</code> and a note demanding 1.2 BTC — with a threat to publish HR data. EDR shows mass file writes from the account <code>svc-print</code>. Backups are immutable and offline. The CEO is awake and asking for the plan.</p>", "q": "<p>Decide step by step. Each choice unlocks the next step.</p>", "hint": "Isolate and preserve before anything. Restore only after the attacker is out. The service account is the vector. Double extortion hits two pillars.", "ex": "<p>Step 1: <b>isolate and preserve</b> — disconnect affected hosts, keep the ransom note and a malware sample; paying or rebooting destroys options and evidence. Step 2: because backups are immutable and offline, recovery works — but only <b>after eradication</b>: restoring first just re-encrypts clean copies. Step 3: <code>svc-print</code> — a service account used for mass writes — is a <b>compromised identity used as the attack vector</b>; not a zero-day (no new flaw), not a natural threat. Step 4: with the copy threat, the company faces <b>confidentiality AND availability</b> — the classic double extortion: pay-or-publish attacks secrecy, encryption attacks availability. Integrity of the originals is preserved by immutable backups.</p>", "steps": [{"p": "First move?", "opts": ["Isolate affected hosts; preserve the note and a malware sample", "Pay the 1.2 BTC immediately", "Reboot the file server to stop the encryption", "Format the shares to stop the spread"], "ans": 0, "why": "Isolate and preserve first. Paying funds crime and guarantees nothing; rebooting and formatting destroy evidence and clean copies."}, {"p": "Backups are immutable and offline. Recovery plan?", "opts": ["Eradicate first, then restore from the immutable backups", "Restore right now onto the still-connected hosts", "Pay half the ransom for a decryptor", "Type the files again from paper printouts"], "ans": 0, "why": "Restoring before removing the attacker's access gets the clean copies encrypted too. Eradicate, then restore."}, {"p": "EDR shows mass writes from svc-print. That account is best described as …", "opts": ["A compromised identity used as the attack vector", "A zero-day vulnerability in the OS", "A natural threat like a storm", "The residual risk on the register"], "ans": 0, "why": "Stolen service credentials are how the attacker moved — an identity-based attack vector, not a new software flaw."}, {"p": "The note threatens to publish HR data. Which pillars are under attack?", "opts": ["Confidentiality AND availability", "Only availability", "Only integrity", "None — backups exist"], "ans": 0, "why": "Encryption attacks availability; the publish threat attacks confidentiality — double extortion. Immutable backups protect the originals' integrity."}]}, {"t": "logview", "th": "threat", "lbl": "Two hosts, one pattern", "sc": "<p>The DNS log of the last hour is on screen. Most queries are office normal. Your lead wants the hosts that talk to attacker infrastructure — and the correct term for each pattern.</p>", "q": "<p>Select the TWO hosts showing command-and-control style patterns in this log.</p>", "hint": "One host asks the same name like clockwork every 5 minutes. Another asks for long random-looking names that carry data.", "ex": "<p>Host <b>10[.]12[.]8[.]44</b> queries <code>cdn-metrics[.]example</code> every 300 seconds, through the night — machine-timed <b>beaconing</b>: a command and control (C2) channel checking in. Host <b>10[.]12[.]8[.]71</b> asks for very long random labels under one domain — classic <b>DNS tunneling</b>: data (keystrokes, files) encoded into subdomains and exfiltrated through DNS — data exfiltration with no exploit alert at all. The workstation naming queries and the update servers are normal. Both patterns are <b>command-and-control / exfiltration</b> behaviour — threat events that telemetry catches even when no exploit alert fired.</p>", "logs": ["10:01:03 from=10[.]12[.]8[.]31 q=printserver01.corp.local A", "10:01:22 from=10[.]12[.]8[.]31 q=files.corp.local A", "10:01:40 from=10[.]12[.]8[.]44 q=cdn-metrics[.]example A", "10:01:58 from=10[.]12[.]8[.]71 q=k29dhaj19fmc82jfha.tunnel-sync[.]info TXT", "10:06:40 from=10[.]12[.]8[.]44 q=cdn-metrics[.]example A", "10:06:59 from=10[.]12[.]8[.]71 q=x7bc82nfh28sk91mq.tunnel-sync[.]info TXT", "10:11:37 from=10[.]12[.]8[.]31 q=updates.corp.local A", "10:11:41 from=10[.]12[.]8[.]44 q=cdn-metrics[.]example A", "10:12:02 from=10[.]12[.]8[.]71 q=p00zm31n47qq88xa.tunnel-sync[.]info TXT", "10:16:43 from=10[.]12[.]8[.]44 q=cdn-metrics[.]example A"], "w": {"k": "multi", "opts": ["Host 10[.]12[.]8[.]44 — fixed 5-minute queries to one external name (beacon)", "Host 10[.]12[.]8[.]31 — normal print and file server lookups", "Host 10[.]12[.]8[.]71 — long random TXT queries to one domain (tunnel)", "Host 10[.]12[.]8[.]9 — queries the update server twice an hour", "The DNS server itself — it answers every query"], "ans": [0, 2]}}, {"t": "qcm", "th": "risk", "lbl": "Which control pays?", "sc": "<p>Budget hearing. The ALE of a data-centre outage is 400,000 EUR per year. Control A (second site) costs 90,000 EUR per year and would cut the ALE by 75%. Control B (bigger generator) costs 20,000 EUR per year and would cut the ALE by 10%. Budget allows exactly one control.</p>", "q": "<p>Which decision is financially correct?</p>", "hint": "Compare the money the control saves against what it costs.", "ex": "<p>Control A saves 75% of 400,000 = 300,000 EUR and costs 90,000 → net benefit <b>210,000 EUR</b>. Control B saves 10% of 400,000 = 40,000 and costs 20,000 → net benefit <b>20,000 EUR</b>. Financially, <b>Control A</b> wins by a wide margin — the second site is paid <b>redundancy</b>. This is the whole point of <b>quantitative</b> analysis: ALE before, ALE after, control cost per year — three numbers, one decision. Note the trap: B is cheaper, but “cheaper control” is not the goal — <b>net benefit</b> is.</p>", "opts": ["Buy Control A — net benefit 210,000 EUR per year", "Buy Control B — it is the cheaper control", "Buy neither — both cost more than they save", "Both are identical in value — pick either"], "ans": 0}, {"t": "ddcat", "th": "cia", "lbl": "DAD in the wild", "sc": "<p>Nine closed cases, one column each: which part of the DAD triad — Disclosure, Alteration, Destruction — happened in every case? Two cases mix signals; choose the dominant one.</p>", "q": "<p>Sort each case into Disclosure, Alteration or Destruction.</p>", "hint": "Copied or seen = disclosure. Changed = alteration. Gone or unusable = destruction.", "ex": "<p><b>Disclosure</b>: the customers table copied to USB, the hidden mail-forwarding rule (mail silently leaves — the <i>dominant</i> harm is secrecy), and the stolen session token — someone got what should have stayed private. <b>Alteration</b>: the price field multiplied by ten, the edited invoice PDF, the payment amounts changed in transit without TLS (no TLS also invites eavesdropping, but the dominant harm is alteration) — data was <i>modified</i>; even the redirecting mail rule keeps a small alteration flavour, but the data leaving dominates. <b>Destruction</b>: the wiped HR drive, the RAID failure with no backup, and the crypto-locker on the shares — data or service became <i>unavailable</i>, permanently or until restored. The <b>DAD triad</b> — disclosure, alteration, destruction — is the attacker's view of the CIA triad: seen, changed, gone.</p>", "cats": ["Disclosure (Confidentiality)", "Alteration (Integrity)", "Destruction (Availability)"], "items": [{"s": "The customers table copied to a USB drive", "c": 0}, {"s": "The price field multiplied by 10 in the billing job", "c": 1}, {"s": "The HR drive wiped with no backup", "c": 2}, {"s": "A hidden rule forwards every invoice mail to an outside address", "c": 0}, {"s": "The invoice PDF edited before sending to the client", "c": 1}, {"s": "RAID failure with no backup — the archive is gone", "c": 2}, {"s": "A session token stolen from a browser", "c": 0}, {"s": "Payment amounts changed in transit (no TLS)", "c": 1}, {"s": "Crypto-locker rendered every share unusable", "c": 2}]}, {"t": "match", "th": "vuln", "lbl": "Control versus attack", "sc": "<p>The awareness team flips the usual poster: instead of CIA pillars, show which <b>attack</b> each control stops. Six controls, six attacks — get the pairing right and the poster prints.</p>", "q": "<p>Match each control to the attack it primarily stops.</p>", "hint": "Think of the attack each tool was built for: injection, stolen passwords, encryption of files, USB exfiltration, brute force, malware execution.", "ex": "<p>A <b>WAF</b> filters injection payloads before they reach the application → stops <b>SQL injection</b>. <b>MFA</b> makes a stolen password alone useless → stops <b>password reuse / credential stuffing</b>. <b>Immutable offline backups</b> survive encryption attempts → blunt <b>ransomware</b>. <b>DLP</b> watches for sensitive data leaving → stops <b>exfiltration to USB/cloud</b>. <b>Rate limiting</b> caps repeated attempts → slows <b>brute-force logins</b> to a crawl. <b>EDR with behaviour rules</b> catches suspicious process behaviour → stops <b>malware execution</b> even when the file is new. Each control has a “natural enemy” — knowing the pairing makes control selection feel obvious instead of memorised.</p>", "left": ["Web Application Firewall (WAF)", "Multi-factor authentication", "Immutable offline backups", "Data Loss Prevention (DLP)", "Rate limiting on the login form", "EDR with behaviour-based rules"], "right": ["SQL injection", "Stolen-password reuse", "Ransomware encryption", "Exfiltration to USB or cloud", "Brute-force login attempts", "Malware execution"], "ans": [0, 1, 2, 3, 4, 5]}, {"t": "fill", "th": "vuln", "lbl": "Write the CVE summary", "sc": "<p>The scanner row is ugly: <code>CVE-2024-30088 — CVSS 9.8 — AV:N/AC:L/PR:N/UI:N — Windows RCE</code>. Management wants a five-line summary anyone can read. The blanks carry the terminology.</p>", "q": "<p>Complete the summary with a term for each blank.</p>", "hint": "9.8 is the top band. AV:N means the network. RCE = running their code. A patch exists — so the fix is patching, and until then the host is exposed.", "ex": "<p>The summary in full: CVSS 9.8 places the flaw in the <b>critical</b> band (9.0–10). <b>AV:N</b> — attack vector is the <b>network</b>: anyone who can reach the host can try it, no local access needed. <b>PR:N/UI:N</b> — no privileges and no user action required, which is why the score is so high. “RCE” means <b>remote code execution</b> — the attacker's code runs on the machine, the worst class of flaw. Because a patch exists, the fix is <b>patching</b>, delivered through patch management (not a workaround), and until the patch lands, the host carries a high <b>exposure</b> — it is reachable and the flaw is known. This vector reading is exactly what makes one CVE urgent and another one ignorable.</p>", "pre": ["<p>A vulnerability scan produced this row. Summary: the flaw is ", "", " severity. The attack vector is the ", "", ", so anyone on line can try it. No privileges or user action are needed. It allows ", "", ". Because a patch exists, the main fix is ", "", "; until then the host carries a high exposure.</p>"], "ans": ["critical", "network", "remote code execution", "patching"], "bank": ["critical", "network", "remote code execution", "patching", "local", "zero-day", "acceptance", "qualitative"]}, {"t": "spot", "th": "exploit", "lbl": "Three clean lines", "sc": "<p>Flip the exercise: the whole line set is suspicious at first glance — yet three lines are perfectly normal traffic. Your manager wants to know exactly which, so the firewall team does not block the office's morning coffee breaks.</p>", "q": "<p>Click the THREE BENIGN lines. Click again to unmark.</p>", "pickGood": true, "hint": "Static assets like CSS and favicons, and robots.txt — browsers and scanners alike fetch them. Command-style admin URLs, webshell uploads and .env probes are not normal.", "ex": "<p>Benign: <code>GET /style.css 200</code>, <code>GET /favicon.ico 200</code>, and <code>GET /robots.txt 200</code> — static assets every browser fetches; robots.txt is even fetched by polite crawlers. The rest are attacks: <code>/admin.php?cmd=whoami</code> is a <b>webshell-style command probe</b>, the <code>shell.php</code> upload is an <b>exploit</b> succeeding, the <code>UNION SELECT</code> with a huge 200 response is <b>successful SQL injection with data out</b>, and <code>/.env</code> is an attempt to read configuration secrets — a <b>vulnerability</b> in deployment (the file should never be web-reachable). Reading status, path and payload together is what separates morning coffee from intrusion.</p>", "lines": [{"s": "03:12 GET /admin.php?cmd=whoami 200", "bad": true}, {"s": "03:13 GET /style.css 200", "bad": false}, {"s": "03:14 POST /upload.php f=shell.php 200", "bad": true}, {"s": "03:14 GET /favicon.ico 200", "bad": false}, {"s": "03:15 GET /?id=1 UNION SELECT 1,2,3-- 200 size=9999", "bad": true}, {"s": "03:16 GET /robots.txt 200", "bad": false}, {"s": "03:17 GET /.env 200 size=1024", "bad": true}]}, {"t": "rank", "th": "vuln", "lbl": "Four vendors, one patch day", "sc": "<p>Patch day planning. Four vendor advisories, four contexts. Score is a start; exploit status and asset context decide the order.</p>", "q": "<p>Rank the four advisories for patch order — most urgent first.</p>", "hint": "Exploited-in-the-wild on an internet-facing mail server outranks a perfect 10.0 on a test VM. A DC with no public exploit still outranks an isolated kiosk.", "ex": "<p><b>1. CVE-A</b> — CVSS 9.1, <b>exploited in the wild</b>, on the internet-facing mail server: attackers need no setup, the door is open now. <b>2. CVE-C</b> — 7.2, no public exploit, but on a <b>domain controller</b>: the highest-value asset in a Windows estate; a single flaw there is domain takeover potential. <b>3. CVE-B</b> — the perfect 10.0, but PoC-only and on an internal test VM: high score, low stakes. <b>4. CVE-D</b> ― 5.0, exploited, but the kiosk is isolated and holds nothing. Order = exploit status × exposure × asset value. If the committee had ranked by score alone, the test VM would have beaten the domain controller — visibly wrong.</p>", "seq": ["CVE-A — CVSS 9.1, exploited in the wild, internet-facing mail server", "CVE-C — CVSS 7.2, no public exploit, domain controller", "CVE-B — CVSS 10.0, PoC only, internal test VM", "CVE-D — CVSS 5.0, exploited, isolated kiosk with no data"]}, {"t": "qcm", "th": "risk", "lbl": "Who signs the acceptance?", "sc": "<p>After the new controls, the data-warehouse entry on the register shows residual risk 15/25 — medium, within tolerance. The acceptance line is empty. Three people have opinions; only one signature is valid.</p>", "q": "<p>Who should formally accept the residual risk?</p>", "hint": "Acceptance is a management act by someone with authority over that system — the named owner.", "ex": "<p>The <b>named risk owner</b> — the manager with authority and budget over that system — signs the acceptance, ideally countersigned by security governance. A <b>SOC analyst</b> operates controls but has no authority to accept company risk; acceptance by “anyone on the team” is how orphan risks happen. A signature without a named person is worth nothing in an audit: the register demands a <b>person, a date and a review date</b>. Acceptance is a management decision because it spends the company's risk appetite — not an analyst's preference.</p>", "opts": ["The named risk owner, countersigned by security governance", "The SOC analyst who happens to be on shift that night", "Any team member who has reviewed the register entries", "No signature needed — the tool records it automatically"], "ans": 0}];
</script>
<script>
'use strict';
/* Cyber Pulse Academy exam engine — vanilla JS, self-contained. */
var CFG = window.EXAM_CONFIG;
var EX = window.EXERCISES;
var KW = window.EXAM_KEYWORDS;

/* ---------------- utilities ---------------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ var r=a.slice(),i,j,t; for(i=r.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
function fmtPts(x){ return (Math.round(x*100)/100).toString(); }
function fmtTime(s){ var m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; }

/* ---------------- state ---------------- */
var S = null;          /* global state */
var timerId = null;

function blank(){
  return { skipped:false, hinted:false, checked:false, locked:null, sel:null, disp:null };
}
function buildDisp(ex){
  var d = {};
  if(ex.t==='qcm'||ex.t==='multi') d.oOrd = shuffle(ex.opts.map(function(_,i){return i;}));
  if(ex.t==='fill') d.bOrd = shuffle(ex.bank.slice());
  if(ex.t==='ddcat'){ d.iOrd = shuffle(ex.items.map(function(_,i){return i;})); d.place = ex.items.map(function(){return null;}); }
  if(ex.t==='match') d.rOrd = shuffle(ex.right.map(function(_,i){return i;}));
  if(ex.t==='order'||ex.t==='rank') d.cur = shuffle(ex.seq.map(function(_,i){return i;}));
  if(ex.t==='spot') d.sel = [];
  if(ex.t==='triage'){ d.rOrd = ex.rows.map(function(r){ return shuffle(r.opts.map(function(_,i){return i;})); }); d.sel = ex.rows.map(function(){return null;}); }
  if(ex.t==='branch'){ d.sOrd = ex.steps.map(function(st){ return shuffle(st.opts.map(function(_,i){return i;})); }); d.sel = ex.steps.map(function(){return null;}); }
  if(ex.t==='terminal') d.cmds = [];
  if(ex.t==='logview'){
    if(ex.w.k==='qcm'||ex.w.k==='multi') d.oOrd = shuffle(ex.w.opts.map(function(_,i){return i;}));
    if(ex.w.k==='fill') d.bOrd = shuffle(ex.w.bank.slice());
    d.filter = '';
  }
  return d;
}
function freshState(){
  return {
    attempt:1, order:shuffle(EX.map(function(_,i){return i;})), cur:0,
    ans:EX.map(function(ex){ var b=blank(); b.disp=buildDisp(ex); return b; }),
    started:false, finished:false, manual:false, checkPause:false,
    remaining:CFG.totalSeconds, reported:false, candidate:''
  };
}

/* ---------------- scoring ---------------- */
function normCmd(s){ return String(s).trim().toLowerCase().replace(/\s+/g,' '); }

function gradeWidget(w, sel, d){
  if(w.k==='qcm'){
    var ok = sel===w.ans;
    return { earned: ok?1:0, K:1, els:[{ok:ok, msg: ok? 'Correct choice.' : 'You chose a different option; the correct one is: <b>'+w.opts[w.ans]+'</b>'}], your: sel==null?'(no answer)':escStrip(w.opts[sel]), corr: escStrip(w.opts[w.ans]) };
  }
  if(w.k==='multi'){
    var K=w.ans.length, hit=0, els=[];
    w.ans.forEach(function(ai){
      var got = sel && sel.indexOf(ai)>=0;
      if(got) hit++;
      els.push({ok:got, msg:(got?'\u2713 ':'\u2717 ')+'<b>'+escStrip(w.opts[ai])+'</b> '+(got?'was one of the right answers.':'was a right answer you missed.')});
    });
    if(sel) sel.forEach(function(si){
      if(w.ans.indexOf(si)<0) els.push({ok:false, msg:'\u2717 You picked <b>'+escStrip(w.opts[si])+'</b>, but that is not one of the right answers.'});
    });
    return { earned: hit/K, K:K, els:els, your: sel&&sel.length? sel.map(function(i){return escStrip(w.opts[i]);}).join('; '):'(nothing selected)', corr: w.ans.map(function(i){return escStrip(w.opts[i]);}).join('; ') };
  }
  if(w.k==='fill'){
    var K2=w.ans.length, hit2=0, els2=[];
    for(var i=0;i<K2;i++){
      var ok2 = sel && sel[i]===w.ans[i];
      if(ok2) hit2++;
      els2.push({ok:ok2, msg:(ok2?'\u2713':'\u2717')+' Blank '+(i+1)+': correct word is <b>'+esc(w.ans[i])+'</b>'+(ok2?'':', you had <b>'+esc(sel&&sel[i]?sel[i]:'(empty)')+'</b>')});
    }
    return { earned: hit2/K2, K:K2, els:els2, your: w.ans.map(function(_,i){return sel&&sel[i]?sel[i]:'(empty)';}).join(', '), corr: w.ans.join(', ') };
  }
  return { earned:0, K:1, els:[], your:'', corr:'' };
}
function escStrip(h){ var d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); }

function grade(i){
  var ex = EX[i], a = S.ans[i], sel = a.sel, d = a.disp, out;
  switch(ex.t){
    case 'qcm': out = gradeWidget({k:'qcm', opts:ex.opts, ans:ex.ans}, sel, d); break;
    case 'multi': out = gradeWidget({k:'multi', opts:ex.opts, ans:ex.ans}, sel, d); break;
    case 'fill': out = gradeWidget({k:'fill', ans:ex.ans}, sel, d); break;
    case 'logview': out = gradeWidget(ex.w, sel, d); break;
    case 'ddcat': {
      var Kc=ex.items.length, hitc=0, elsc=[];
      d.iOrd.forEach(function(ii){
        var it=ex.items[ii], got=d.place[ii];
        var ok = got===it.c;
        if(ok) hitc++;
        elsc.push({ok:ok, msg:(ok?'\u2713':'\u2717')+' <b>'+escStrip(it.s)+'</b> \u2192 '+esc(ex.cats[it.c])+(ok?'':(got!=null?', you said '+esc(ex.cats[got]):' (not placed)'))});
      });
      out = { earned: hitc/Kc, K:Kc, els:elsc, your: ex.items.map(function(it,ii){ return escStrip(it.s)+'\u2192'+(d.place[ii]!=null?ex.cats[d.place[ii]]:'-'); }).join('; '), corr: ex.items.map(function(it){ return escStrip(it.s)+'\u2192'+ex.cats[it.c]; }).join('; ') };
      break;
    }
    case 'match': {
      var Km=ex.left.length, hitm=0, elsm=[];
      for(var mi=0;mi<Km;mi++){
        var okm = sel && sel[mi]===ex.ans[mi];
        if(okm) hitm++;
        elsm.push({ok:okm, msg:(okm?'\u2713':'\u2717')+' <b>'+escStrip(ex.left[mi])+'</b> \u2192 '+escStrip(ex.right[ex.ans[mi]])+(okm?'':', you said '+((sel&&sel[mi]!=null)?escStrip(ex.right[sel[mi]]):'(empty)'))});
      }
      out = { earned: hitm/Km, K:Km, els:elsm, your: ex.left.map(function(l,li){ return escStrip(l)+'\u2192'+((sel&&sel[li]!=null)?escStrip(ex.right[sel[li]]):'-'); }).join('; '), corr: ex.left.map(function(l,li){ return escStrip(l)+'\u2192'+escStrip(ex.right[ex.ans[li]]); }).join('; ') };
      break;
    }
    case 'order': case 'rank': {
      var Ko=ex.seq.length, hito=0, elso=[];
      for(var oi=0;oi<Ko;oi++){
        var oko = d.cur[oi]===oi;
        if(oko) hito++;
        elso.push({ok:oko, msg:(oko?'\u2713':'\u2717')+' Position '+(oi+1)+': correct is <b>'+escStrip(ex.seq[oi])+'</b>'+(oko?'':', you had <b>'+escStrip(ex.seq[d.cur[oi]])+'</b>')});
      }
      out = { earned: hito/Ko, K:Ko, els:elso, your: d.cur.map(function(ii){return escStrip(ex.seq[ii]);}).join(' \u2192 '), corr: ex.seq.map(function(s){return escStrip(s);}).join(' \u2192 ') };
      break;
    }
    case 'spot': {
      var Kb=0, hits=0, elss=[];
      /* pickGood flips the task: the targets are the BENIGN lines, marking an
         attack line is the error. Default (undefined) keeps the classic task. */
      var target = function(ln){ return ex.pickGood? !ln.bad : ln.bad; };
      ex.lines.forEach(function(ln, li){
        var picked = d.sel.indexOf(li)>=0;
        if(target(ln)){
          Kb++;
          if(picked){ hits++; elss.push({ok:true, msg:'\u2713 You marked '+(ex.pickGood?'the benign line':'the real issue')+': '+esc(ln.s)}); }
          else { elss.push({ok:false, msg:'\u2717 Missed '+(ex.pickGood?'a benign line':'a real issue')+': '+esc(ln.s)}); }
        }
        else if(picked){ elss.push({ok:false, msg:'\u2717 You marked <i>'+esc(ln.s)+'</i>, but '+(ex.pickGood?'this is attack traffic, not normal.':'this line is normal.')}); }
      });
      out = { earned: Kb? hits/Kb : 0, K:Math.max(Kb,1), els:elss, your: (d.sel.length? d.sel.map(function(li){return esc(ex.lines[li].s);}).join('; '):'(nothing marked)'), corr: ex.lines.filter(function(ln){ return target(ln); }).map(function(ln){return esc(ln.s);}).join('; ') };
      break;
    }
    case 'terminal': {
      var Kt=ex.okGroups.length, hitt=0, elst=[], lines=(sel&&sel.cmds? sel.cmds:[]);
      ex.okGroups.forEach(function(g, gi){
        var okt = lines.some(function(c){ return new RegExp(g.re,'i').test(normCmd(c)); });
        if(okt) hitt++;
        elst.push({ok:okt, msg:(okt?'\u2713':'\u2717')+' Required step '+(gi+1)+' of the task '+(okt?'done.':'missing (expected something like: <code>'+esc(g.sample)+'</code>)')});
      });
      out = { earned: Kt? hitt/Kt : 0, K:Math.max(Kt,1), els:elst, your: lines.length? lines.map(esc).join(' ; '):'(no command)', corr: ex.okGroups.map(function(g){return g.sample;}).join(' ; ') };
      break;
    }
    case 'triage': {
      var Kr=ex.rows.length, hitr=0, elsr=[];
      for(var ri=0;ri<Kr;ri++){
        var okr = sel && sel[ri]===ex.rows[ri].ans;
        if(okr) hitr++;
        elsr.push({ok:okr, msg:(okr?'\u2713':'\u2717')+' Alert '+(ri+1)+' \u2192 <b>'+escStrip(ex.rows[ri].opts[ex.rows[ri].ans])+'</b>'+(okr?'':', you said '+((sel&&sel[ri]!=null)?escStrip(ex.rows[ri].opts[sel[ri]]):'(no answer)'))});
      }
      out = { earned: hitr/Kr, K:Kr, els:elsr, your: ex.rows.map(function(r,rx){ return 'Alert '+(rx+1)+': '+((sel&&sel[rx]!=null)?escStrip(r.opts[sel[rx]]):'-'); }).join('; '), corr: ex.rows.map(function(r,rx){ return 'Alert '+(rx+1)+': '+escStrip(r.opts[r.ans]); }).join('; ') };
      break;
    }
    case 'branch': {
      var Kb2=ex.steps.length, hitb=0, elsb=[];
      for(var bi=0;bi<Kb2;bi++){
        var okb = sel && sel[bi]===ex.steps[bi].ans;
        if(okb) hitb++;
        elsb.push({ok:okb, msg:(okb?'\u2713':'\u2717')+' Step '+(bi+1)+': '+ex.steps[bi].why});
      }
      out = { earned: hitb/Kb2, K:Kb2, els:elsb, your: ex.steps.map(function(st,bx){ return 'Step '+(bx+1)+': '+((sel&&sel[bx]!=null)?escStrip(st.opts[sel[bx]]):'-'); }).join('; '), corr: ex.steps.map(function(st){ return escStrip(st.opts[st.ans]); }).join('; ') };
      break;
    }
    default: out = { earned:0, K:1, els:[], your:'', corr:'' };
  }
  var earned = out.earned;
  out.hits = Math.round(out.earned*out.K);   /* elements correct before the hint penalty */
  if(a.hinted) earned = earned*0.9;
  out.earnedFinal = Math.round(earned*10000)/10000;
  return out;
}

/* ---------------- live score & progress ---------------- */
function lockedList(){ return S.ans.filter(function(a){ return a.locked; }); }
function earnedTotal(){ var t=0; lockedList().forEach(function(a){ t+=a.locked.earnedFinal; }); return t; }
function updateHud(){
  var locked = lockedList().length;
  $('scoreChip').innerHTML = '\u25c6 Score: <b>'+fmtPts(earnedTotal())+'</b> pts';
  $('progChip').innerHTML = '\u2713 Answered: <b>'+locked+' / '+EX.length+'</b>';
  $('barIn').style.width = Math.round(locked/EX.length*100)+'%';
  var themes={};
  EX.forEach(function(ex,i){ if(!themes[ex.th]) themes[ex.th]={n:0,d:0}; themes[ex.th].n++; if(S.ans[i].locked) themes[ex.th].d++; });
  $('themes').innerHTML = KW.map(function(t){
    var c = themes[t.id]||{n:0,d:0};
    return '<span class="tchip'+(c.d===c.n&&c.n>0?' done':'')+'">'+esc(t.name)+' '+c.d+'/'+c.n+'</span>';
  }).join('');
  renderNav();
}
function renderNav(){
  var html='';
  S.order.forEach(function(exIdx, pos){
    var a=S.ans[exIdx];
    var cls='nq';
    if(a.locked){ cls += a.locked.earnedFinal>=0.999?' done':(a.locked.earnedFinal<=0.001?' zero':' part'); }
    else if(a.skipped){ cls+=' skip'; }
    if(pos===S.cur) cls+=' cur';
    html+='<button type="button" class="'+cls+'" data-pos="'+pos+'" title="Q'+(pos+1)+': '+esc(EX[exIdx].lbl)+'" aria-label="Question '+(pos+1)+'">'+(pos+1)+'</button>';
  });
  $('navGrid').innerHTML=html;
}

/* ---------------- timer ---------------- */
function tick(){
  if(!S || !S.started || S.finished) return;
  if(!S.manual && !S.checkPause){
    S.remaining--;
    if(S.remaining<=0){ S.remaining=0; renderTimer(); finish('time'); return; }
  }
  renderTimer();
}
function renderTimer(){
  var t=$('timer');
  t.textContent='\u23f1 '+fmtTime(S.remaining);
  t.className = (S.remaining <= CFG.totalSeconds*0.1) ? 'low' : '';
}
function setPauseIndicators(){
  $('pindManual').className = 'pind'+(S.manual?' on':'');
  $('pindCheck').className = 'pind'+(S.checkPause?' on':'');
}
function toggleManual(){
  if(S.finished) return;
  S.manual=!S.manual;
  setPauseIndicators();
  var card=$('exWrap');
  if(card) card.classList.toggle('pausedBlur', S.manual);
}

/* ---------------- rendering ---------------- */
function currentIdx(){ return S.order[S.cur]; }

function optLabel(kind){
  return kind==='multi' ? 'SELECT ALL THAT APPLY' : 'CHOOSE ONE';
}
function renderWidgetAnswer(w, sel, d, prefix){
  /* returns HTML for answer area of widget (qcm/multi/fill) */
  if(w.k==='qcm'||w.k==='multi'){
    var h = '<div class="radios" role="radiogroup" aria-label="Answer choices">';
    d.oOrd.forEach(function(oi){
      var type = w.k==='qcm'?'radio':'checkbox';
      var checked = w.k==='qcm' ? (sel===oi) : (sel && sel.indexOf(oi)>=0);
      h+='<label class="optrow"><input type="'+type+'" name="'+prefix+'" value="'+oi+'" '+(checked?'checked':'')+'><span>'+w.opts[oi]+'</span></label>';
    });
    return h+'</div>';
  }
  var h2='<div class="fillwrap">';
  /* Blank markers: empty string segments in `pre` mark blank positions, so every
     select sits exactly where the sentence needs it. Fallback for arrays without
     markers: one slot after each of the first ans.length segments. */
  var hasMarkers = w.pre.some(function(s){ return s===''; });
  var slotI = 0;
  w.pre.forEach(function(seg){
    h2+=seg;
    var need = hasMarkers ? (seg==='' && slotI<w.ans.length) : (slotI<w.ans.length);
    if(need){
      var cur2 = sel&&sel[slotI]? sel[slotI]:'';
      h2+='<span class="slot"><select class="pick" data-slot="'+slotI+'" aria-label="Blank '+(slotI+1)+'"><option value="">\u2014 pick \u2014</option>';
      d.bOrd.forEach(function(bw){ h2+='<option value="'+esc(bw)+'" '+(cur2===bw?'selected':'')+'>'+esc(bw)+'</option>'; });
      h2+='</select></span>';
      slotI++;
    }
  });
  return h2+'</div>';
}
function bindWidgetEvents(w, root, a, prefix){
  if(w.k==='qcm'||w.k==='multi'){
    root.querySelectorAll('input[name="'+prefix+'"]').forEach(function(inp){
      inp.addEventListener('change', function(){
        if(a.locked) return;
        if(w.k==='qcm'){ a.sel=[parseInt(inp.value,10)]; a.sel=a.sel[0]; }
        else { if(!a.sel) a.sel=[]; var v=parseInt(inp.value,10); if(inp.checked){ if(a.sel.indexOf(v)<0) a.sel.push(v); } else { a.sel=a.sel.filter(function(x){return x!==v;}); } }
      });
    });
  } else if(w.k==='fill'){
    root.querySelectorAll('select.pick').forEach(function(s){
      s.addEventListener('change', function(){
        if(a.locked) return;
        if(!a.sel) a.sel=[];
        a.sel[parseInt(s.getAttribute('data-slot'),10)] = s.value;
      });
    });
  }
}

function renderExercise(){
  var i = currentIdx(), ex=EX[i], a=S.ans[i], d=a.disp;
  var wrap=$('exWrap');
  wrap.className='card qwrap';
  wrap.innerHTML='';
  var posLabel='Exercise '+(S.cur+1)+' of '+EX.length;

  var h = '<div class="qhead"><span class="chip">'+posLabel+'</span> <span class="chip tchip">'+esc(themeName(ex.th))+'</span> <b>'+esc(ex.lbl)+'</b></div>';
  h += '<div class="pauseCover"><span>\u23f8 PAUSED</span><span style="font-size:14px;color:#ffd98a">Press the Pause button again to resume</span></div>';

  if(ex.t==='logview'){
    if(ex.art){ h+='<div class="blk art"><span class="lab">\u2637 ARTEFACTS</span>'+ex.art+'</div>'; }
    h+='<div class="blk art"><span class="lab">\u2630 LOG VIEWER</span>'
      +'<div class="ltool"><label for="lfilter" style="font-size:14px">Filter:</label><input id="lfilter" type="text" placeholder="type to filter lines\u2026" value="'+esc(d.filter)+'" aria-label="Filter log lines"><span class="cnt" id="lcnt"></span></div>'
      +'<pre class="log" id="loglines"></pre></div>';
  } else if(ex.art){
    h+='<div class="blk art"><span class="lab">\u2637 ARTEFACTS</span>'+ex.art+'</div>';

  h+='<div class="blk qtn"><span class="lab">? QUESTION</span>'+ex.q+'</div>';
