  if(ex.t==='qcm'||ex.t==='multi'){
    ansLab.textContent=optLabel(ex.t);
    ansBody.innerHTML='<div id="wroot">'+renderWidgetAnswer({k:ex.t, opts:ex.opts, ans:ex.ans}, a.sel, d, 'ex'+i)+'</div>';
    bindWidgetEvents({k:ex.t, opts:ex.opts, ans:ex.ans}, $('wroot'), a, 'ex'+i);
  }
  else if(ex.t==='fill'){
    ansLab.textContent='FILL THE BLANKS \u2014 PICK FROM THE WORD BANK';
    ansBody.innerHTML='<div id="wroot">'+renderWidgetAnswer({k:'fill', ans:ex.ans, bank:ex.bank, pre:ex.pre}, a.sel, d, 'ex'+i)+'</div>';
    bindWidgetEvents({k:'fill', ans:ex.ans}, $('wroot'), a, 'ex'+i);
  }
  else if(ex.t==='ddcat'){
    ansLab.textContent='DRAG EACH ITEM INTO THE RIGHT CATEGORY (OR CLICK ITEM, THEN CATEGORY)';
    var hz='<div class="tray" id="tray" aria-label="Items to sort"></div><div class="cols" style="margin-top:10px">';
    ex.cats.forEach(function(c,ci){ hz+='<div class="col" data-cat="'+ci+'" role="button" tabindex="0" aria-label="Category: '+esc(c)+'"><h4>'+esc(c)+'</h4><div class="citems" data-catitems="'+ci+'"></div></div>'; });
    hz+='</div><p class="hintline">Keyboard: Tab to an item, press Enter to pick it up, Tab to a category, press Enter to drop.</p>';
    ansBody.innerHTML=hz;
    drawDdcat(a, ex);
    bindDdcat(a, ex, wrap);
  }
  else if(ex.t==='match'){
    ansLab.textContent='MATCH EACH ITEM ON THE LEFT WITH THE RIGHT OPTION';
    var hm='<table class="match"><tbody>';
    ex.left.forEach(function(l,li){
      var cur = a.sel&&a.sel[li]!=null? a.sel[li]:'';
      hm+='<tr><td class="l">'+l+'</td><td><select class="pick msel" data-row="'+li+'" aria-label="Match for item '+(li+1)+'"><option value="">\u2014 pick \u2014</option>';
      d.rOrd.forEach(function(ri){ hm+='<option value="'+ri+'" '+(cur===ri?'selected':'')+'>'+escStrip(ex.right[ri])+'</option>'; });
      hm+='</select></td></tr>';
    });
    ansBody.innerHTML=hm+'</tbody></table>';
    ansBody.querySelectorAll('select.msel').forEach(function(s){
      s.addEventListener('change', function(){
        if(a.locked) return;
        if(!a.sel) a.sel=[];
        a.sel[parseInt(s.getAttribute('data-row'),10)] = s.value===''?null:parseInt(s.value,10);
      });
    });
  }
  else if(ex.t==='order'||ex.t==='rank'){
    ansLab.textContent = ex.t==='order' ? 'PUT THE STEPS IN THE RIGHT ORDER (DRAG, OR USE \u25b2\u25bc)' : 'RANK HIGHEST\u2192LOWEST (DRAG, OR USE \u25b2\u25bc)';
    ansBody.innerHTML='<ul class="ord" id="ordList"></ul>';
    drawOrder(a, ex);
    bindOrder(a, ex);
  }
  else if(ex.t==='spot'){
    ansLab.textContent = ex.pickGood
      ? 'CLICK EVERY LINE THAT IS NORMAL / BENIGN \u2014 CLICK AGAIN TO UNMARK'
      : 'CLICK EVERY LINE THAT IS A REAL PROBLEM \u2014 CLICK AGAIN TO UNMARK';
    var hl2='<div class="lines">';
    ex.lines.forEach(function(ln,li){
      var sel2=d.sel.indexOf(li)>=0;
      hl2+='<button type="button" class="ln" data-li="'+li+'" aria-pressed="'+sel2+'">'+esc(ln.s)+'</button>';
    });
    ansBody.innerHTML=hl2+'</div>';
    ansBody.querySelectorAll('button.ln').forEach(function(b){
      b.addEventListener('click', function(){
        if(a.locked) return;
        var li=parseInt(b.getAttribute('data-li'),10), ix=d.sel.indexOf(li);
        if(ix>=0){ d.sel.splice(ix,1); b.setAttribute('aria-pressed','false'); } else { d.sel.push(li); b.setAttribute('aria-pressed','true'); }
      });
    });
  }
  else if(ex.t==='terminal'){
    ansLab.textContent='TYPE THE COMMAND(S), PRESS ENTER AFTER EACH, THEN CHECK';
    ansBody.innerHTML='<div class="term"><pre class="out" id="tout"></pre><div class="cmdrow"><span class="ps">analyst@soc:~$</span><input id="tin" class="cmd" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal command input" placeholder="type a command and press Enter"></div></div>';
    var tout=$('tout'), tin=$('tin');
    var maxLines = ex.maxLines && ex.maxLines>0 ? ex.maxLines : 0;
    function drawTerm(){
      var o = a.locked ? 'Last check output:\n' : 'Commands entered so far:\n';
      if(!a.sel||!a.sel.cmds||!a.sel.cmds.length) o+='(no command typed yet)\n';
      else a.sel.cmds.forEach(function(c){ o+='analyst@soc:~$ '+esc(c)+'\n'; });
      if(maxLines) o+='(limit: '+maxLines+' command'+(maxLines>1?'s':'')+')\n';
      tout.innerHTML=o;
    }
    drawTerm();
    tin.addEventListener('keydown', function(ev){
      if(ev.key==='Enter'){
        ev.preventDefault();
        if(a.locked) return;
        var v=tin.value.trim(); if(!v) return;
        if(!a.sel) a.sel={cmds:[]};
        if(maxLines && a.sel.cmds.length>=maxLines){
          drawTerm();
          tout.innerHTML+='This exercise accepts at most '+maxLines+' command'+(maxLines>1?'s':'')+'. Review your entries and press Check.\n';
          tin.value='';
          return;
        }
        a.sel.cmds.push(v); tin.value=''; drawTerm();
      }
    });
  }
  else if(ex.t==='triage'){
    ansLab.textContent='CHOOSE ONE CLASSIFICATION PER ALERT';
    var ht='';
    ex.rows.forEach(function(r,ri){
      ht+='<div class="triRow" data-tri="'+ri+'"><p class="al"><b>Alert '+(ri+1)+':</b> '+r.s+'</p><div class="radios" role="radiogroup" aria-label="Classification for alert '+(ri+1)+'">';
      d.rOrd[ri].forEach(function(oi){
        var checked = a.sel && a.sel[ri]===oi;
        ht+='<label class="optrow"><input type="radio" name="tri'+ri+'" value="'+oi+'" '+(checked?'checked':'')+'><span>'+r.opts[oi]+'</span></label>';
      });
      ht+='</div></div>';
    });
    ansBody.innerHTML=ht;
    ansBody.querySelectorAll('input[type="radio"]').forEach(function(inp){
      inp.addEventListener('change', function(){
        if(a.locked) return;
        var row=parseInt(inp.name.replace('tri',''),10);
        if(!a.sel) a.sel=[];
        a.sel[row]=parseInt(inp.value,10);
      });
    });
  }
  else if(ex.t==='branch'){
    ansLab.textContent='DECIDE STEP BY STEP \u2014 EACH CHOICE UNLOCKS THE NEXT STEP';
    ansBody.innerHTML='<div id="brSteps"></div>';
    drawBranch(a, ex);
    bindBranch(a, ex);
  }
  else if(ex.t==='logview'){
    ansLab.textContent = ex.w.k==='qcm'?'CHOOSE ONE':(ex.w.k==='multi'?'SELECT ALL THAT APPLY':'FILL THE BLANKS \u2014 PICK FROM THE WORD BANK');
    ansBody.innerHTML='<div id="wroot">'+renderWidgetAnswer(ex.w, a.sel, d, 'ex'+i)+'</div>';
    bindWidgetEvents(ex.w, $('wroot'), a, 'ex'+i);
    var ll=$('loglines'), lf=$('lfilter'), lc=$('lcnt');
    function drawLog(){
      var f=d.filter.toLowerCase(), vis=0, html='';
      ex.logs.forEach(function(line){
        var show = !f || line.toLowerCase().indexOf(f)>=0;
        if(show) vis++;
        html+='<span class="ll'+(show?'':' hideLn')+'">'+hlLine(line)+'</span>';
      });
      ll.innerHTML=html;
      lc.textContent=vis+' / '+ex.logs.length+' lines shown';
    }
    drawLog();
    lf.addEventListener('input', function(){ if(a.locked){ lf.value=d.filter; return; } d.filter=lf.value; drawLog(); });
  }

  if(a.locked){ applyMarks(i); }
  else if(a.checked===false && a.locked===null){ /* fresh */ }
  renderControls(a, ex);
  if(S.manual) wrap.classList.add('pausedBlur');
}

function themeName(id){ var t=KW.filter(function(x){return x.id===id;})[0]; return t?t.name:id; }

/* --- ddcat --- */
function drawDdcat(a, ex){
  var tray=$('tray'); if(!tray) return;
  tray.innerHTML='';
  ex.cats.forEach(function(_,ci){
    var box=document.querySelector('[data-catitems="'+ci+'"]'); if(box) box.innerHTML='';
  });
  a.disp.iOrd.forEach(function(ii){
    var placed = a.disp.place[ii];
    var b=document.createElement('button');
    b.type='button'; b.className='itm'; b.setAttribute('data-item',ii); b.setAttribute('draggable','true');
    b.setAttribute('aria-label', 'Item: '+escStrip(ex.items[ii].s)+(placed!=null?'. Currently in '+esc(ex.cats[placed]):'. Not placed')+'. Press Enter to pick up or put back.');
    b.innerHTML=ex.items[ii].s;
    if(placed==null) tray.appendChild(b);
    else document.querySelector('[data-catitems="'+placed+'"]').appendChild(b);
  });
  /* fresh column elements each draw \u2014 attach drag listeners here */
  document.querySelectorAll('#exWrap .col').forEach(function(col){
    col.addEventListener('dragover', function(ev){ ev.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('over'); });
    col.addEventListener('drop', function(ev){
      ev.preventDefault(); col.classList.remove('over');
      var i = currentIdx(); if(EX[i].t!=='ddcat') return;
      var aa = S.ans[i], exx = EX[i];
      if(aa.locked || S.finished) return;
      var ii=parseInt(ev.dataTransfer.getData('text/plain'),10);
      if(!isNaN(ii)){ aa.disp.place[ii]=parseInt(col.getAttribute('data-cat'),10); drawDdcat(aa, exx); }
    });
  });
}
function bindDdcat(a, ex, wrap){
  /* delegated listeners bound once per wrap element; state resolved dynamically */
  if(!wrap.__ddBound){
    wrap.__ddBound = true;
    wrap.addEventListener('click', function(ev){
      var i = currentIdx(); if(EX[i].t!=='ddcat') return;
      var aa = S.ans[i], exx = EX[i];
      if(aa.locked || S.finished) return;
      var it = ev.target.closest ? ev.target.closest('.itm') : null;
      if(it){
        var heldCol = it.closest ? it.closest('.col') : null;
        if(wrap.__ddPicked != null && heldCol){
          /* dropping onto a column (or a chip inside it) while holding an item */
          var dci = parseInt(heldCol.getAttribute('data-cat'),10);
          aa.disp.place[wrap.__ddPicked] = dci; wrap.__ddPicked = null;
          drawDdcat(aa, exx);
          return;
        }
        var ii = parseInt(it.getAttribute('data-item'),10);
        if(wrap.__ddPicked === ii){ wrap.__ddPicked = null; it.classList.remove('sel'); }
        else {
          if(wrap.__ddPicked != null){ var p = wrap.querySelector('[data-item="'+wrap.__ddPicked+'"]'); if(p) p.classList.remove('sel'); }
          wrap.__ddPicked = ii; it.classList.add('sel');
        }
        return;
      }
      var col = ev.target.closest ? ev.target.closest('.col') : null;
      if(col && wrap.__ddPicked != null){
        var ci = parseInt(col.getAttribute('data-cat'),10);
        aa.disp.place[wrap.__ddPicked] = ci; wrap.__ddPicked = null;
        drawDdcat(aa, exx);
      }
    });
    wrap.addEventListener('keydown', function(ev){
      var i = currentIdx(); if(EX[i].t!=='ddcat') return;
      var aa = S.ans[i], exx = EX[i];
      if(aa.locked || S.finished || ev.key !== 'Enter') return;
      var t = ev.target;
      if(t.classList && t.classList.contains('itm')){ ev.preventDefault(); t.click(); }
      else if(t.getAttribute && t.getAttribute('data-cat') != null){
        ev.preventDefault();
        if(wrap.__ddPicked != null){ aa.disp.place[wrap.__ddPicked] = parseInt(t.getAttribute('data-cat'),10); wrap.__ddPicked = null; drawDdcat(aa, exx); }
      }
    });
    if(!document.__ddDrag){
      document.__ddDrag = true;
      document.addEventListener('dragstart', function(ev){
        var t = ev.target;
        if(t.classList && t.classList.contains('itm')) ev.dataTransfer.setData('text/plain', t.getAttribute('data-item'));
      });
    }
  }
}

/* --- order/rank --- */
function drawOrder(a, ex){
  var ul=$('ordList'); if(!ul) return;
  ul.innerHTML='';
  a.disp.cur.forEach(function(ii, pos){
    var li=document.createElement('li');
    li.setAttribute('data-item',ii); li.setAttribute('draggable','true');
    li.innerHTML='<span class="num2">'+(pos+1)+'</span><span class="txt">'+ex.seq[ii]+'</span>'
      +'<span class="mv"><button type="button" data-up="'+pos+'" aria-label="Move up">\u25b2</button><button type="button" data-dn="'+pos+'" aria-label="Move down">\u25bc</button></span>';
    ul.appendChild(li);
  });
}
function bindOrder(a, ex){
  var ul=$('ordList'); if(!ul) return;
  if(ul.__ordBound) return;
  ul.__ordBound = true;
  ul.addEventListener('click', function(ev){
    if(a.locked) return;
    var up=ev.target.closest('[data-up]'), dn=ev.target.closest('[data-dn]');
    if(up){ var p=parseInt(up.getAttribute('data-up'),10); if(p>0){ var c=a.disp.cur; var t=c[p-1]; c[p-1]=c[p]; c[p]=t; drawOrder(a,ex); bindOrder(a,ex);} }
    if(dn){ var p2=parseInt(dn.getAttribute('data-dn'),10); var c2=a.disp.cur; if(p2<c2.length-1){ var t2=c2[p2+1]; c2[p2+1]=c2[p2]; c2[p2]=t2; drawOrder(a,ex); bindOrder(a,ex);} }
  });
  var dragIdx=null;
  ul.addEventListener('dragstart', function(ev){ var li=ev.target.closest('li'); if(li){ dragIdx=a.disp.cur.indexOf(parseInt(li.getAttribute('data-item'),10)); ev.dataTransfer.setData('text/plain','o'); } });
  ul.addEventListener('dragover', function(ev){ ev.preventDefault(); });
  ul.addEventListener('drop', function(ev){
    ev.preventDefault(); if(a.locked||dragIdx==null) return;
    var li=ev.target.closest('li');
    if(li){
      var target=a.disp.cur.indexOf(parseInt(li.getAttribute('data-item'),10));
      var it=a.disp.cur.splice(dragIdx,1)[0]; a.disp.cur.splice(target,0,it);
      drawOrder(a,ex); bindOrder(a,ex);
    }
    dragIdx=null;
  });
}

/* --- branch --- */
function drawBranch(a, ex){
  var host=$('brSteps'); if(!host) return;
  var h='', open=true, anyLocked=false;
  ex.steps.forEach(function(st, si){
    if(open){
      h+='<div class="triRow" data-step="'+si+'"><p class="al"><b>Step '+(si+1)+'.</b> '+st.p+'</p><div class="radios" role="radiogroup" aria-label="Step '+(si+1)+' choices">';
      a.disp.sOrd[si].forEach(function(oi){
        var checked=a.disp.sel[si]===oi;
        h+='<label class="optrow"><input type="radio" name="br'+si+'" value="'+oi+'" '+(checked?'checked':'')+'><span>'+st.opts[oi]+'</span></label>';
      });
      h+='</div></div>';
      if(a.disp.sel[si]==null) open=false;
    } else { anyLocked=true; }
  });
  if(anyLocked) h+='<p class="hintline">Answer the visible step to unlock the next one.</p>';
  host.innerHTML=h;
}
function bindBranch(a, ex){
  var host=$('brSteps');
  if(host.__brBound) return;
  host.__brBound = true;
  host.addEventListener('change', function(ev){
    if(a.locked) return;
    var t=ev.target;
    if(t.name && t.name.indexOf('br')===0){
      var si=parseInt(t.name.replace('br',''),10);
      a.disp.sel[si]=parseInt(t.value,10);
      if(!a.sel) a.sel=[];
      a.sel= a.disp.sel.slice();
      drawBranch(a, ex); bindBranch(a, ex);
    }
  });
}

/* ---------------- marks & feedback ---------------- */
function applyMarks(i){
  var ex=EX[i], a=S.ans[i], d=a.disp, r=a.locked;
  var wrap=$('exWrap');
  /* disable inputs */
  wrap.querySelectorAll('input:not(#lfilter),select,button.ln,.itm').forEach(function(el){ el.disabled=true; });
  wrap.classList.add('isLocked');
  wrap.querySelectorAll('.itm,.col,#tray').forEach(function(el){ el.style.pointerEvents='none'; });
  wrap.querySelectorAll('[data-up],[data-dn]').forEach(function(b){ b.disabled=true; });

  if(ex.t==='qcm'||ex.t==='multi'||ex.t==='logview'){
    var w = ex.t==='logview'? ex.w : {k:ex.t, opts:ex.opts, ans:ex.ans};
    var ansArr = Array.isArray(w.ans)? w.ans : [w.ans];
    var body = $('wroot');
    var inputs = body.querySelectorAll('input');
    inputs.forEach(function(inp){
      var v=parseInt(inp.value,10), lab=inp.closest('.optrow');
      if(ansArr.indexOf(v)>=0) lab.classList.add('m-ok');
      else if(inp.checked) lab.classList.add('m-no');
      inp.disabled=true;
    });
  }
  else if(ex.t==='fill'||(ex.t==='logview'&&ex.w.k==='fill')){
    var anss = ex.t==='logview'? ex.w.ans : ex.ans;
    $('ansBody').querySelectorAll('select.pick').forEach(function(s){
      var si=parseInt(s.getAttribute('data-slot'),10);
      s.disabled=true;
      var okv = s.value===anss[si];
      s.style.borderColor = okv? '#2f8a52':'#a34a5a';
      s.insertAdjacentHTML('afterend',' <span class="mark '+(okv?'res-ok':'res-no')+'">'+(okv?'\u2713':'\u2717')+'</span>');
    });
  }
  else if(ex.t==='ddcat'){
    wrap.querySelectorAll('.itm').forEach(function(it){
      var ii=parseInt(it.getAttribute('data-item'),10);
      var ok = d.place[ii]===ex.items[ii].c;
      it.classList.add(ok?'m-ok':'m-no');
      it.insertAdjacentHTML('beforeend',' <span class="mark '+(ok?'res-ok':'res-no')+'">'+(ok?'\u2713':'\u2717')+'</span>');
    });
    wrap.querySelectorAll('.itm,.col').forEach(function(el){ el.setAttribute('draggable','false'); });
  }
  else if(ex.t==='match'){
    $('ansBody').querySelectorAll('select.msel').forEach(function(s){
      var li=parseInt(s.getAttribute('data-row'),10);
      s.disabled=true;
      var ok = a.sel && a.sel[li]===ex.ans[li];
      s.style.borderColor = ok? '#2f8a52':'#a34a5a';
      s.insertAdjacentHTML('afterend',' <span class="mark '+(ok?'res-ok':'res-no')+'">'+(ok?'\u2713':'\u2717')+'</span>');
    });
  }
  else if(ex.t==='order'||ex.t==='rank'){
    $('ordList').querySelectorAll('li').forEach(function(li,pos){
      var ii=parseInt(li.getAttribute('data-item'),10);
      li.classList.add(ii===pos?'m-ok':'m-no');
    });
  }
  else if(ex.t==='spot'){
    var spotTarget = function(ln){ return ex.pickGood? !ln.bad : ln.bad; };
    $('ansBody').querySelectorAll('button.ln').forEach(function(b){
      var li=parseInt(b.getAttribute('data-li'),10), ln=ex.lines[li], picked=d.sel.indexOf(li)>=0;
      b.disabled=true;
      if(spotTarget(ln) && picked){ b.classList.add('m-ok'); }
      else if(spotTarget(ln) && !picked){ b.classList.add('m-no'); }
      else if(picked){ b.classList.add('m-no'); }
      else { b.classList.add('m-idle'); }
    });
  }
  else if(ex.t==='terminal'){
    var lines=(a.sel&&a.sel.cmds)? a.sel.cmds:[];
    var o='\n--- check result ---\n';
    ex.okGroups.forEach(function(g,gi){
      var ok = lines.some(function(c){ return new RegExp(g.re,'i').test(normCmd(c)); });
      o+=(ok?'[PASS] ':'[FAIL] ')+'task step '+(gi+1)+(ok?' complete.':' not completed. expected: '+g.sample)+'\n';
    });
    if(a.hinted) o+='(hint used: -10% on this exercise)\n';
    $('tout').textContent+='\n'+o;
  }
  else if(ex.t==='triage'){
    $('ansBody').querySelectorAll('.triRow').forEach(function(row){
      var ri=parseInt(row.getAttribute('data-tri'),10);
      var ok = a.sel && a.sel[ri]===ex.rows[ri].ans;
      row.style.borderColor = ok? '#2f8a52':'#a34a5a';
      row.querySelectorAll('input').forEach(function(inp){ inp.disabled=true; });
    });
  }
  else if(ex.t==='branch'){
    $('brSteps').querySelectorAll('.triRow').forEach(function(row){
      var si=parseInt(row.getAttribute('data-step'),10);
      var ok = a.sel && a.sel[si]===ex.steps[si].ans;
      row.style.borderColor = ok? '#2f8a52':'#a34a5a';
      row.querySelectorAll('input').forEach(function(inp){ inp.disabled=true; });
    });
  }

  /* feedback + explanation */
  var pct = Math.round(r.earnedFinal*100);
  var cls = r.earnedFinal>=0.999?'okF':(r.earnedFinal<=0.001?'noF':'paF');
  var word = r.earnedFinal>=0.999?'FULL \u2713':(r.earnedFinal<=0.001?'WRONG \u2717':'PARTIAL \u25d0');
  var fz=$('feedZone');
  fz.setAttribute('aria-live','polite');
  var elsHtml = r.els.map(function(e){ return '<li class="'+(e.ok?'res-ok':'res-no')+'">'+e.msg+'</li>'; }).join('');
  var elemNote = (r.K>1 && r.hits!=null) ? ' ('+r.hits+' of '+r.K+' elements correct)' : '';
  fz.innerHTML='<div class="feed '+cls+'"><div class="big">'+word+' &nbsp; You earned '+fmtPts(r.earnedFinal)+' / 1 pt on this exercise'
    + elemNote
    +(a.hinted?' (hint used: \u221210%)':'')+'</div><ul class="els">'+elsHtml+'</ul></div>'
    +'<div class="expl"><span class="lab">\u25c6 WHY</span>'+ex.ex+'</div>';
}

/* ---------------- controls ---------------- */
function renderControls(a, ex){
  var c=$('ctl');
  var last = S.cur===EX.length-1;
  c.innerHTML='';
  var bPrev=mkBtn('\u2190 Prev','btn', !S.finished && S.cur>0);
  bPrev.addEventListener('click', function(){ if(S.cur>0){ S.cur--; renderExercise(); updateHud(); window.scrollTo({top:0}); } });
  var bCheck=mkBtn(a.locked? 'Check again':'Check','btn go');
  bCheck.addEventListener('click', doCheck);
  var bHint=mkBtn('Hint (\u221210%)','btn warn');
  bHint.disabled = a.hinted || !!a.locked;
  bHint.addEventListener('click', function(){ a.hinted=true; renderHint(a, ex); renderControls(a, ex); });
  var bSkip=mkBtn('Skip \u21a6','btn');
  bSkip.addEventListener('click', function(){
    if(S.finished) return;
    S.ans[currentIdx()].skipped=true;
    if(S.cur<EX.length-1){ S.cur++; renderExercise(); updateHud(); }
    else { updateHud(); openModal('<h3>End of exam</h3><p>This is the last exercise. You can go back to skipped ones or submit.</p>', [{t:'Go back', cls:'btn'}]); }
  });
  var bRevise=mkBtn('Revise','btn');
  bRevise.disabled = !a.locked;
  bRevise.addEventListener('click', function(){
    a.locked=null; a.checked=false; a.skipped=false;
    renderExercise(); updateHud();
  });
  var bNext=mkBtn('Next \u2192','btn pri');
  bNext.addEventListener('click', function(){
    if(S.checkPause) S.checkPause=false;
    setPauseIndicators();
    if(S.cur<EX.length-1){ S.cur++; renderExercise(); updateHud(); window.scrollTo({top:0}); }
    else { openModal('<h3>Last exercise</h3><p>Press <b>Submit exam</b> to finish and see your result.</p>', [{t:'OK', cls:'btn pri'}]); }
  });
  c.appendChild(bPrev); c.appendChild(bCheck); c.appendChild(bHint); c.appendChild(bRevise); c.appendChild(bSkip); c.appendChild(bNext);
  var bSub=mkBtn('Submit exam','btn danger');
  bSub.addEventListener('click', confirmSubmit);
  c.appendChild(bSub);
  if(a.hinted) renderHint(a, ex); else { var hb=$('hintBox'); if(hb) hb.remove(); }
  if(a.locked){ $('feedZone').scrollIntoView({block:'nearest'}); }
}
function mkBtn(txt, cls, disabled){
  var b=document.createElement('button');
  b.type='button'; b.className=cls; b.innerHTML=txt;
  if(disabled) b.disabled=true;
  return b;
}
function renderHint(a, ex){
  var hb=$('hintBox');
  if(!hb){ hb=document.createElement('div'); hb.id='hintBox'; hb.className='hintBox'; hb.setAttribute('role','status'); $('exWrap').appendChild(hb); }
  /* hints are authored content and may carry light HTML (e.g. <code>), so no escaping */
  hb.innerHTML='\u25c6 <b>Hint (\u221210% on this exercise):</b> '+ex.hint;
}

function doCheck(){
  if(S.finished) return;
  var i=currentIdx(), a=S.ans[i];
  var r=grade(i);
  a.locked=r; a.checked=true; a.skipped=false;
  renderExercise();
  S.checkPause=true;
  setPauseIndicators();
  updateHud();
}

/* ---------------- modal ---------------- */
var __lastFocus = null;
function openModal(html, buttons){
  var m=$('modal'), box=$('modalBox');
  __lastFocus = document.activeElement;
  box.innerHTML=html+'<div class="center" style="margin-top:14px" id="mBtns"></div>';
  var bb=$('mBtns');
  buttons.forEach(function(b){
    var el=document.createElement('button');
    el.type='button'; el.className=b.cls; el.textContent=b.t;
    el.addEventListener('click', function(){ if(b.fn) b.fn(); closeModal(); });
    bb.appendChild(el);
  });
  m.classList.add('on');
  var fb = bb.querySelector('button'); if(fb) fb.focus();
}
function closeModal(){
  $('modal').classList.remove('on');
  if(__lastFocus && __lastFocus.focus && document.contains(__lastFocus)) { try{ __lastFocus.focus(); }catch(e){} }
  __lastFocus = null;
}

function confirmSubmit(){
  var locked=lockedList().length;
  var skipped=S.ans.filter(function(a){ return a.skipped && !a.locked; }).length;
  var untouched=EX.length-locked-skipped;
  if(locked===0){
    openModal('<h3>\u26a0 Cannot submit</h3><p>You have not answered any exercise yet. Answer at least one exercise before submitting.</p>', [{t:'Go back', cls:'btn pri'}]);
    return;
  }
  var msg='<h3>Submit exam?</h3><p>Answered (checked): <b>'+locked+'</b></p>'
    +(skipped? '<p>Skipped: <b>'+skipped+'</b> \u2014 these will <b>not count</b> in your score.</p>':'')
    +(untouched? '<p>Never checked: <b>'+untouched+'</b> \u2014 these will also <b>not count</b>.</p>':'')
    +'<p>Skipped and unchecked exercises are excluded from both your points and the total.</p>';
  openModal(msg, [
    {t:'Cancel', cls:'btn'},
    {t:'Submit now', cls:'btn danger', fn:function(){ finish('submit'); }}
  ]);
}

/* ---------------- finish & results ---------------- */
function finish(reason){
  if(S.finished) return;
  S.finished=true;
  S.manual=false; S.checkPause=false;
  setPauseIndicators();
  closeModal();
  var total=0, earned=0, skippedIdx=[];
  S.order.forEach(function(exIdx, pos){
    var a=S.ans[exIdx];
    if(a.locked){ total++; earned+=a.locked.earnedFinal; }
    else skippedIdx.push(pos);
  });
  var answeredCount=total;
  var corrInt=Math.round(earned);
  var percent = answeredCount? Math.round(corrInt/answeredCount*100):0;
  var passed = answeredCount>0 && percent>=CFG.passMark;

  var repRows='';
  S.order.forEach(function(exIdx, pos){
    var a=S.ans[exIdx], ex=EX[exIdx];
    var tag, tagCls;
    if(a.locked){
      var r=a.locked;
      tag = r.earnedFinal>=0.999?'full':(r.earnedFinal<=0.001?'zero':'partial');
      tagCls = tag==='partial'?'part':tag;
    } else if(a.skipped){
      tag='skipped'; tagCls='skip';
    } else {
      tag='not counted'; tagCls='nc';
    }
    repRows+='<tr><td>'+(pos+1)+'</td><td>'+esc(ex.lbl)+'</td><td><span class="tag '+tagCls+'">'+tag+'</span></td><td>'+(a.locked? fmtPts(a.locked.earnedFinal)+' / 1':'\u2014')+'</td></tr>';
  });

  var skippedList = skippedIdx.length? '<p><b>Skipped / not counted:</b> '+skippedIdx.map(function(p){return 'Q'+(p+1);}).join(', ')+'. These were excluded from scoring.</p>':'';

  var panel = passed
    ? '<div class="passP"><h2>\u2714 PASS \u2014 Well done'+(S.candidate?', '+esc(S.candidate):'')+'!</h2><p>You reached the passing score of '+CFG.passMark+'%.</p></div>'
    : '<div class="failP"><h2>\u2716 FAIL \u2014 '+percent+'%</h2><p>You need '+CFG.passMark+'% to pass. Review the report below and retake the exam.</p></div>';

  var root=$('results');
  root.innerHTML='<div class="card intro">'
    +'<h2>Results \u2014 '+esc(CFG.title)+'</h2>'
    + panel
    +'<div class="bigScore">'+percent+'%</div>'
    +'<div class="statChips">'
    +'<span class="chip">Raw points: <b>'+fmtPts(earned)+'</b></span>'
    +'<span class="chip">Answered: <b>'+answeredCount+' / '+EX.length+'</b></span>'
    +'<span class="chip">Reported: <b>'+corrInt+' / '+answeredCount+'</b></span>'
    +'<span class="chip">Hints used: <b>'+S.ans.filter(function(a){return a.hinted;}).length+'</b></span>'
    +'</div>'
    + skippedList
    +'<p class="center"><button type="button" class="btn pri" id="retakeBtn">Retake Exam</button></p>'
    +'<h3>Per-exercise report</h3>'
    +'<table class="rep"><thead><tr><th>#</th><th>Exercise</th><th>Result</th><th>Points</th></tr></thead><tbody>'
    + repRows
    +'</tbody></table>'
    +'<h3 style="margin-top:16px">Full explanations</h3>'
    + S.order.map(function(exIdx,pos){
        var a=S.ans[exIdx], ex=EX[exIdx];
        var tag = a.locked? (a.locked.earnedFinal>=0.999?'full':(a.locked.earnedFinal<=0.001?'zero':'partial')) : (a.skipped?'skipped':'not counted');
        var cls = a.locked? (tag==='partial'?'part':tag) : (a.skipped?'skip':'nc');
        return '<details class="card"><summary><b>Q'+(pos+1)+' \u2014 '+esc(ex.lbl)+'</b> <span class="tag '+cls+'">'+tag+'</span></summary>'
          +(a.locked? '<p><b>Your answer:</b> '+(a.locked.your||'(empty)')+'</p><p><b>Correct:</b> '+(a.locked.corr||'')+'</p><p><b>Points: '+fmtPts(a.locked.earnedFinal)+' / 1</b></p>':'<p><b>Not counted in scoring.</b></p>')
          +'<ul class="els">'+(a.locked? a.locked.els.map(function(e){ return '<li class="'+(e.ok?'res-ok':'res-no')+'">'+e.msg+'</li>'; }).join(''):'')+'</ul>'
          +'<p>'+ex.ex+'</p></details>';
      }).join('')
    +'</div>';
  $('examArea').classList.add('hide');
  $('results').classList.remove('hide');
  $('retakeBtn').addEventListener('click', retake);
  window.scrollTo({top:0});
  reportScore(corrInt, answeredCount);
}
function retake(){
  S=freshState();
  S.candidate = window.__examCandidate || '';
  S.started=true;
  $('results').classList.add('hide');
  $('examArea').classList.remove('hide');
  renderTimer(); setPauseIndicators();
  renderExercise(); updateHud();
  window.scrollTo({top:0});
}
function reportScore(correct, total){
  if(S.reported) return;
  if(total<=0) return;
  S.reported=true;
  var percent=Math.round((correct/total)*100);
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topicId,
      score:correct,
      total:total,
      percent:percent,
      passed: percent>=CFG.passMark
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}

/* ---------------- log line highlight ---------------- */
function hlLine(line){
  var e=esc(line);
  e=e.replace(/(\d{1,3}(?:\[\.\]){3}\d{1,3})/g,'<span class="ip">$1</span>');
  e=e.replace(/(\d{1,2}:\d{2}:\d{2})/g,'<span class="ts">$1</span>');
  e=e.replace(/\b(GET|POST|PUT|HEAD|DELETE)\b/g,'<span class="kw">$1</span>');
  e=e.replace(/\s(2\d\d)\s/g,' <span class="ok2">$1</span> ');
  e=e.replace(/\s(4\d\d|5\d\d)\s/g,' <span class="er">$1</span> ');
  e=e.replace(/\b(FAILED|failed|Denied|denied|Accepted|accepted|UNION|SELECT|passwd|shadow|exploit)\b/g,'<span class="kw">$1</span>');
  return e;
}

/* ---------------- boot ---------------- */
function startExam(){
  if(!S) S = freshState();
  S.candidate = window.__examCandidate || '';
  S.started=true;
  $('intro').classList.add('hide');
  $('examArea').classList.remove('hide');
  renderTimer(); setPauseIndicators();
  renderExercise(); updateHud();
  window.scrollTo({top:0});
}
function boot(){
  $('hdrTitle').innerHTML=esc(CFG.title)+' &nbsp;<span class="sev">['+esc(CFG.diffLabel)+']</span>';
  /* intro */
  $('introBody').innerHTML=
    '<div class="card intro">'
    +'<h1>4.4 - Security terminology</h1>'
    +'<p><span class="badge '+CFG.badgeCls+'">'+esc(CFG.diffLabel)+' severity</span> &nbsp; <b>'+EX.length+' exercises</b> &nbsp; \u23f1 Timer: <b>'+fmtTime(CFG.totalSeconds)+'</b> &nbsp; Pass mark: <b>'+CFG.passMark+'%</b></p>'
    +'<h3>How this exam works</h3>'
    +'<ul>'
    +'<li><b>Goal:</b> master the security terms of chapter 4.4 \u2014 risk, vulnerability, exploit, threat, and the CIA triad \u2014 through realistic work scenarios.</li>'
    +'<li><b>Exercise types:</b> scenario triage, drag &amp; drop, log analysis with a filter box, matching, ordering, ranking, fill-in-the-blank word banks, spot-the-mistake, branching decisions, a fake terminal, and a few multiple-choice questions.</li>'
    +'<li><b>Check</b> locks your answer, shows green/red/amber marks with an explanation, and <b>pauses the timer in review mode</b> (content stays visible). The timer resumes only when you press <b>Next</b>.</li>'
    +'<li><b>Manual pause</b> (\u23f8 button) hides/blurs the exercise while the clock is stopped. The two pause types can stack.</li>'
    +'<li><b>Skip</b> moves on and marks the exercise amber. You can return to skipped exercises until time runs out. Skipped or never-checked exercises are <b>excluded from scoring</b> (removed from points AND total).</li>'
    +'<li><b>Partial credit:</b> multi-answer exercises award a share per correct element. Wrong picks do not subtract, they just earn nothing.</li>'
    +'<li><b>Hint</b> (\u221210%) reveals a nudge, never the answer.</li>'
    +'<li><b>Revise</b> unlocks a checked exercise so you can change it, then Check again.</li>'
    +'<li>All IP addresses and URLs in this exam are defanged on purpose (for example <code>10[.]0[.]0[.]1</code>, <code>hxxp://evil[.]example</code>). This is a professional habit.</li>'
    +'</ul>'
    +'<div class="kwPanel"><h3>\u25c6 Keywords covered</h3>'
    + KW.map(function(t){ return '<h3 style="margin:8px 0 2px;font-size:14px">'+esc(t.name)+'</h3><div class="kws">'+t.kws.map(function(k){ return '<span class="kw">'+esc(k)+'</span>'; }).join('')+'</div>'; }).join('')
    +'</div>'
    +'<p class="center"><button type="button" class="btn go" id="startBtn" style="font-size:18px;padding:14px 34px">\u25b6 Start the exam</button></p>'
    +'</div>';
  $('startBtn').addEventListener('click', startExam);
  $('pauseBtn').addEventListener('click', toggleManual);
  $('navGrid').addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('.nq') : null;
    if(!b || S.finished) return;
    var pos = parseInt(b.getAttribute('data-pos'),10);
    if(isNaN(pos)) return;
    S.cur = pos;
    renderExercise(); updateHud();
    window.scrollTo({top:0});
  });
  timerId=setInterval(tick,1000);
  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape' && $('modal').classList.contains('on')) closeModal();
  });
}
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type!=='CYBERPULSE_INIT' && event.data.type!=='CYBERMASTERY_INIT') return;
  try{
    if(event.data.username){
      window.__examCandidate = String(event.data.username).slice(0,40);
      if(S) S.candidate = window.__examCandidate;
    }
  }catch(e){}
});
document.addEventListener('DOMContentLoaded', boot);

</script>
