<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network+ — Chapter 1 — MEDIUM practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "network-plus",
  "chapter": 1,
  "title": "Network+ 1.1 — OSI Model Layers & Encapsulation — Medium",
  "difficulty": "medium",
  "questionCount": 30,
  "estimatedMinutes": 60,
  "passMark": 70
}
</script>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1b2230; --line:#2b3648; --line2:#3a4a63;
  --txt:#e6edf3; --mut:#a5b1c2; --acc:#38bdf8; --accD:#0c4a6e;
  --ok:#22c55e; --okT:#4ade80; --bad:#ef4444; --badT:#f87171; --warn:#f59e0b; --warnT:#fbbf24;
  --purp:#a78bfa; --mono:'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:16px/1.55 'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:14px 16px 60px}
button{font:inherit}
:focus-visible{outline:3px solid #60a5fa;outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:14px}
.defang{color:var(--warnT)}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;position:sticky;top:8px;z-index:40}
.brand{font-weight:700;letter-spacing:.5px}
.sev{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--acc);color:var(--acc)}
.sev.hard{border-color:var(--bad);color:var(--badT)}
.tb-mid{display:flex;align-items:center;gap:10px;margin-left:auto}
#clock{font-family:var(--mono);font-size:20px;font-weight:700;min-width:78px;text-align:center;background:#010409;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#clock.low{color:var(--badT);border-color:var(--bad)}
#pauseFlags{display:flex;gap:6px}
.pflag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:#3b2f0b;color:var(--warnT);border:1px solid var(--warn)}
.tb-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.tb-mid + .tb-right{margin-left:0}
#scoreBox{font-size:14px;color:var(--mut);min-width:170px;text-align:right}
#scoreBox b{color:var(--txt)}

/* ---------- buttons ---------- */
.btn{min-height:44px;min-width:44px;padding:9px 16px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#04222f}
.btn.primary:hover{background:#7dd3fc}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--warn);color:var(--warnT);background:transparent}
.btn.danger{border-color:var(--bad);color:var(--badT)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- intro ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.kicker{color:var(--acc);font-weight:700;letter-spacing:1.5px;font-size:13px;text-transform:uppercase}
h1{font-size:26px;margin:6px 0 4px}
h2{font-size:19px;margin:0 0 8px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:130px}
.stat .v{font-size:22px;font-weight:800;color:var(--acc)}
.stat .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.kwtheme{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.kwtheme h3{margin:0 0 8px;font-size:14px;color:var(--purp)}
.kwtag{display:inline-block;background:#0b1220;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;margin:2px 3px 2px 0;font-size:13px;color:var(--txt)}
.rules li{margin:6px 0}
.rules{margin:8px 0 0;padding-left:22px}

/* ---------- question chrome ---------- */
.block{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}
.blabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:1.5px;padding:7px 12px;background:var(--panel2);color:var(--mut);text-transform:uppercase}
.block.scenario{border-left:4px solid var(--purp)}
.block.scenario .blabel{color:var(--purp)}
.block.question{border-left:4px solid var(--acc)}
.block.question .blabel{color:var(--acc)}
.block.answer{border-left:4px solid var(--warn)}
.block.answer .blabel{color:var(--warnT)}
.bbody{padding:12px 14px}
.artefact{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-family:var(--mono);font-size:14px;white-space:pre-wrap;overflow-x:auto}
.sub{border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:8px 0}
.sub h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.sub.blue{border-left:4px solid var(--acc)}
.sub.blue h4{color:var(--acc)}
.sub.red{border-left:4px solid var(--bad)}
.sub.red h4{color:var(--badT)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.qnum{font-weight:800;font-size:15px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#241a3f;color:var(--purp);border:1px solid var(--purp)}
.pts{font-size:13px;color:var(--mut)}
.qhint{font-size:14px;color:var(--warnT);background:#3b2f0b;border:1px solid var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0}

/* ---------- choices ---------- */
.choice{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:10px 12px;margin:8px 0;cursor:pointer;min-height:44px}
.choice:hover{border-color:var(--acc)}
.choice input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc);flex:none}
.choice .ct{flex:1}
.choice.v-ok{border-color:var(--ok);background:#0d2818}
.choice.v-bad{border-color:var(--bad);background:#2a0d0d}
.vtag{flex:none;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.v-ok .vtag,.vtag.ok{background:#052e16;color:var(--okT);border:1px solid var(--ok)}
.v-bad .vtag,.vtag.bad{background:#2a0d0d;color:var(--badT);border:1px solid var(--bad)}
.vtag.part{background:#3b2f0b;color:var(--warnT);border:1px solid var(--warn)}

/* ---------- drag & drop ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;background:#0b1220;border:1px dashed var(--line2);border-radius:10px;padding:10px;min-height:56px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;min-height:44px;cursor:grab;font-size:14px;user-select:none}
.chip.picked{border-color:var(--acc);background:#0c2d3f}
.chip .grip{color:var(--mut);font-size:12px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.slot{border:1px dashed var(--line2);border-radius:10px;min-height:64px;padding:8px;background:#0e1420}
.slot .slab{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.5px;margin-bottom:6px;display:block}
.slot .dropzone{min-height:46px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;color:var(--mut);font-size:13px;padding:4px}
.slot.over{border-color:var(--acc)}
.slot.v-ok{border-color:var(--ok)} .slot.v-bad{border-color:var(--bad)}
.slot .vtag{margin-top:6px}

/* ---------- order ---------- */
.olist{list-style:none;margin:0;padding:0}
.oitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;margin:7px 0;min-height:48px}
.oitem .onum{font-family:var(--mono);font-size:14px;color:var(--acc);min-width:30px;text-align:center;font-weight:700}
.oitem .ot{flex:1;font-size:15px}
.oitem.dragover{border-color:var(--acc)}
.oitem[draggable=true]{cursor:grab}
.oitem.v-ok{border-color:var(--ok)} .oitem.v-bad{border-color:var(--bad)}
.oitem .fix{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.mv{min-width:38px;min-height:38px;padding:4px 8px}
.corner{display:flex;gap:6px;margin-left:auto}

/* ---------- match / fill ---------- */
.mrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.mrow .ml{flex:1 1 240px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:44px;font-size:15px}
.mrow.v-ok .ml{border-color:var(--ok)} .mrow.v-bad .ml{border-color:var(--bad)}
select.qsel{min-height:44px;background:#0b1220;color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:15px;max-width:280px}
.fsent{font-size:16px;line-height:2.1}
.fsent select.qsel{margin:0 3px;font-family:var(--mono);font-size:14px}
.blank-ok{border-color:var(--ok)!important;background:#0d2818!important}
.blank-bad{border-color:var(--bad)!important;background:#2a0d0d!important}
.fixword{font-size:13px;color:var(--okT);font-family:var(--mono)}

/* ---------- terminal ---------- */
.term{background:#010409;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:14px}
.term .tbar{display:flex;gap:6px;margin-bottom:8px}
.term .tdot{width:12px;height:12px;border-radius:50%;background:#334155;display:inline-block}
.term .thist{white-space:pre-wrap;color:var(--okT);min-height:24px;max-height:220px;overflow-y:auto}
.term .tin{display:flex;align-items:center;gap:8px;margin-top:8px}
.term .pr{color:var(--acc)}
.term input{flex:1;background:transparent;border:none;color:#e2e8f0;font-family:var(--mono);font-size:14px;min-height:34px}
.ttask{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--panel2);font-size:14px}
.ttask .tg{font-weight:700}
.ttask.v-ok{border-color:var(--ok)} .ttask.v-bad{border-color:var(--bad)}
.ttask .exx{font-family:var(--mono);font-size:13px;color:var(--mut);margin-top:4px}

/* ---------- log viewer ---------- */
.logview{background:#010409;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:14px}
.lvbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.lvbar input{flex:1;min-height:38px;background:#0b1220;border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:14px;padding:4px 10px}
.lvcount{font-size:12px;color:var(--mut)}
.logs{max-height:300px;overflow-y:auto;white-space:pre-wrap;line-height:1.5}
.lg-info{color:#a5b1c2}.lg-ok{color:#4ade80}.lg-warn{color:#fbbf24}.lg-err{color:#f87171}.lg-hl{color:#38bdf8}

/* ---------- feedback / explain ---------- */
.fb{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--panel2)}
.fb .fhead{font-weight:800;margin-bottom:6px}
.explain{border:1px solid var(--purp);border-radius:10px;padding:12px 14px;margin:12px 0;background:#191230}
.explain .elabel{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--purp);text-transform:uppercase;margin-bottom:6px}
.explain p{margin:6px 0}
.scoreline{font-size:14px;color:var(--mut);margin-top:8px}
.scoreline b{color:var(--txt)}

/* ---------- nav ---------- */
#qnav{display:flex;align-items:center;gap:10px;margin:16px 0;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
.dot{width:44px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;position:relative;padding:0}
.dot.cur{outline:3px solid var(--acc);outline-offset:1px;color:var(--txt)}
.dot.ok{background:#0d2818;border-color:var(--ok);color:var(--okT)}
.dot.part{background:#3b2f0b;border-color:var(--warn);color:var(--warnT)}
.dot.zero{background:#2a0d0d;border-color:var(--bad);color:var(--badT)}
.dot.skip{background:transparent;border-style:dashed;border-color:var(--warn);color:var(--warnT)}
.legend{font-size:12px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 0}
.pbar{height:10px;background:#0b1220;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 6px}
#pfill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--purp));transition:width .4s}
#themeChips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tchip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);background:var(--panel2)}
.tchip b{color:var(--txt)}

/* ---------- pause overlay ---------- */
#pauseOverlay{position:fixed;inset:0;background:rgba(5,8,14,.86);z-index:80;display:flex;align-items:center;justify-content:center;text-align:center}
.pausecard{background:var(--panel);border:1px solid var(--warn);border-radius:14px;padding:28px;max-width:420px}
.pausecard .big{font-size:22px;font-weight:800;color:var(--warnT)}
#examMain.blurred>*{filter:blur(14px);pointer-events:none;user-select:none}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(5,8,14,.8);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;max-width:480px;width:100%}
.mcard h3{margin-top:0}

/* ---------- results ---------- */
.res-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pct{font-size:54px;font-weight:900;line-height:1}
.verdict{font-size:26px;font-weight:900;letter-spacing:2px;padding:10px 22px;border-radius:12px}
.verdict.pass{color:var(--okT);border:2px solid var(--ok);background:#0d2818}
.verdict.fail{color:var(--badT);border:2px solid var(--bad);background:#2a0d0d}
.cert{border:2px solid var(--ok);border-radius:14px;padding:18px;background:linear-gradient(160deg,#0d2818,#0b1220);margin:14px 0}
.cert.failc{border-color:var(--bad);background:linear-gradient(160deg,#2a0d0d,#0b1220)}
.res-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.res-table th,.res-table td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.res-table th{background:var(--panel2);color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.rlabel{font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.rlabel.full{background:#052e16;color:var(--okT);border:1px solid var(--ok)}
.rlabel.partial{background:#3b2f0b;color:var(--warnT);border:1px solid var(--warn)}
.rlabel.zero{background:#2a0d0d;color:var(--badT);border:1px solid var(--bad)}
.rlabel.skipped{background:transparent;color:var(--warnT);border:1px dashed var(--warn)}
.rlabel.unans{background:transparent;color:var(--mut);border:1px solid var(--line2)}
details.rdetail{margin-top:6px}
details.rdetail summary{cursor:pointer;color:var(--acc);font-weight:600;padding:6px 0;min-height:44px;display:flex;align-items:center}
.note{font-size:14px;color:var(--warnT);border:1px dashed var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0}

@media (max-width:720px){
  #topbar{position:static}
  #scoreBox{min-width:0;text-align:left}
  .stat{flex:1 1 40%}
  .pct{font-size:40px}
  .mrow select.qsel{max-width:100%}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<div class="wrap" id="app">
  <header id="topbar" hidden>
    <div class="tb-left"><span class="brand">NETWORK+ 1.1</span><span class="sev" id="sevBadge">MEDIUM</span></div>
    <div class="tb-mid"><span id="pauseFlags"></span><span id="clock" role="timer">60:00</span></div>
    <div class="tb-right"><span id="scoreBox" aria-live="polite">Score 0 / 0 pts</span><button id="pauseBtn" class="btn ghost" aria-pressed="false">&#10074;&#10074; Pause</button><button id="finishBtn" class="btn ghost danger">Finish</button></div>
  </header>
  <div id="pauseOverlay" hidden>
    <div class="pausecard">
      <p class="big">&#10074;&#10074; Paused (manual)</p>
      <p>Exercise content is hidden while the exam is paused. Press Resume to continue the same exercise.</p>
      <button id="resumeBtn" class="btn primary">&#9654; Resume</button>
    </div>
  </div>
  <section id="intro"></section>
  <main id="examMain" hidden>
    <div id="progRow"><div class="pbar"><div id="pfill"></div></div><div id="themeChips"></div></div>

      <button id="prevBtn" class="btn ghost">&#8592; Prev</button>
      <div id="dots" class="dots"></div>
      <button id="nextBtn" class="btn primary">Next &#8594;</button>
    </nav>
    <div id="legend" class="legend"></div>
  </main>
  <section id="results" hidden></section>
  <div id="modal" hidden></div>
</div>
<script>/* ===== CONFIG ===== */
CONFIG = {
  TOPIC_ID:'network-plus',
  CHAPTER:1,
  SEVERITY:'MEDIUM',
  TITLE_TAG:'Network+ — Chapter 1 — MEDIUM practice exam',
  TIMER_MINUTES:60,
  PASS_MARK:70
};

/* ===== FRAMEWORK ===== */
'use strict';
/* ===== framework: state, timer, navigation, chrome ===== */
var EX = [];                 /* exercise data (pushed by data files) */
var CONFIG;                  /* injected at assembly time, before this line runs */
var S = null;                /* live exam state */
var USER = '';

var THEME_LABEL = {
  seven:'The 7 Layers', l1l2:'Physical & Data Link', l3l4:'Network & Transport',
  l5l7:'Session / Presentation / Application', encap:'Encapsulation & PDUs'
};

function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t;}return r;}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtTime(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s2=sec%60;return (m<10?'0':'')+m+':'+(s2<10?'0':'')+s2;}
function r1(n){return Math.round(n*10)/10;}
function reducedMotion(){try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}}
function cq(){return S.order[S.cur];}          /* original index of current question */
function cex(){return EX[cq()];}
function cqu(){return S.q[cq()];}

/* ---------- per-question state ---------- */
function initQ(ex){
  var q={idx:0,id:ex.id,theme:ex.theme,pts:ex.pts,title:ex.title,
    checked:false,skipped:false,locked:false,hintUsed:false,
    earned:0,elsTotal:0,elsOk:0,sel:[],state:{}};
  if(ex.type==='qcm'||ex.type==='multi'){
    q.state.choiceOrder=shuffle(ex.choices.map(function(c,k){return k;}));
    q.sel=ex.choices.map(function(){return false;});
  }else if(ex.type==='drag'){
    q.state.bankOrder=shuffle(ex.bank.map(function(b){return b.key;}));
    q.state.placed={};       /* slotId -> key or '' */
    q.state.slotVerdict={};
  }else if(ex.type==='order'){
    q.state.disp=shuffle(ex.items.map(function(_,k){return k;}));
    q.state.posVerdict=[];
  }else if(ex.type==='match'){
    q.state.rightOpts=shuffle(ex.pairs.map(function(p){return p.r;}).concat(ex.extra||[]));
    q.state.sel=ex.pairs.map(function(){return '';});
    q.state.pairVerdict=[];
  }else if(ex.type==='fill'){
    var opts=[];
    ex.parts.forEach(function(p){if(typeof p!=='string')opts.push(p.ans);});
    q.state.bank=shuffle(opts.concat(ex.distract||[]));
    q.state.sel=ex.parts.map(function(){return '';});
    q.state.blankVerdict=[];
  }else if(ex.type==='terminal'){
    q.state.typed=ex.tasks.map(function(){return '';});
    q.state.done=ex.tasks.map(function(){return false;});
    q.state.hist=[];
    q.state.taskVerdict=[];
  }else if(ex.type==='sim'){
    q.state.sel=ex.steps.map(function(){return -1;});
    q.state.reveal=1;
    q.state.stepVerdict=[];
    q.state.optsOrder=ex.steps.map(function(st){return shuffle(st.opts.map(function(_,k){return k;}));});

    var it=ex.inner;
    if(it.type==='qcm'||it.type==='multi'){

function newState(){
  var order=[],i;
  for(i=0;i<EX.length;i++)order.push(i);
  return {
    order:shuffle(order), cur:0, started:false, finished:false,
    remaining:CONFIG.TIMER_MINUTES*60, lastTick:null,
    pauseManual:false, pauseCheck:false,
    scoreFired:false,
    q:EX.map(function(ex){return initQ(ex);})
  };
}

/* ---------- timer ---------- */
function timerRunning(){return !S.finished && !S.pauseManual && !S.pauseCheck;}
function tick(){
  if(!S||S.finished)return;
  var now=Date.now();
  if(timerRunning()){
    if(S.lastTick==null)S.lastTick=now;
    S.remaining-=(now-S.lastTick)/1000;
    if(S.remaining<=0){S.remaining=0;updateTimerUI();finishExam(true);return;}
  }
  S.lastTick=now;
  updateTimerUI();
}
var TIMER_STARTED=false;
function startTimer(){if(TIMER_STARTED)return;TIMER_STARTED=true;setInterval(tick,250);}
function updateTimerUI(){
  if(!S)return;
  var c=$('clock');if(!c)return;
  c.textContent=fmtTime(S.remaining);
  c.className=S.remaining<300?'low':'';
  var f=$('pauseFlags'),flags=[];
  if(S.pauseManual)flags.push('<span class="pflag">Paused (manual)</span>');
  if(S.pauseCheck)flags.push('<span class="pflag">Timer paused - review mode</span>');
  f.innerHTML=flags.join('');
}
function setManualPause(on){
  S.pauseManual=on;
  var em=$('examMain'),ov=$('pauseOverlay'),pb=$('pauseBtn');
  if(em){em.classList.toggle('blurred',on);}
  if(ov){ov.hidden=!on;}
  if(pb){pb.innerHTML=on?'&#9654; Resume':'&#10074;&#10074; Pause';pb.setAttribute('aria-pressed',on?'true':'false');}
  updateTimerUI();
}

/* ---------- live score ---------- */
function answeredList(){
  return S.q.filter(function(q){return q.checked&&!q.skipped;});
}
function normEarned(q){return q.pts>0?q.earned/q.pts:0;}
function partFrac(q){return q.elsTotal>0?q.elsOk/q.elsTotal:0;}
function scoreSummary(){
  /* Final percentage = earned points / possible points of the non-skipped
     exercises (spec: skip rule). Partial credit is already inside earned. */
  var a=answeredList(),i,earn=0,max=0;
  for(i=0;i<a.length;i++){earn+=a[i].earned;max+=a[i].pts;}
  var pct=max>0?Math.round(earn/max*100):0;
  return {n:a.length,earn:r1(earn),max:max,pct:pct};
}
function updateScoreUI(){
  var s=scoreSummary(),b=$('scoreBox');
  if(b)b.innerHTML='Score <b>'+s.earn+'</b> / '+s.max+' pts &middot; <b>'+s.pct+'%</b> ('+s.n+' of '+EX.length+' answered)';
}

/* ---------- progress / dots / theme chips ---------- */
function updateProgress(){
  var pf=$('pfill');if(!pf)return;
  pf.style.width=Math.round((S.cur+1)/EX.length*100)+'%';
}
function qDotClass(q,orig){
  if(q.skipped)return 'skip';
  if(q.checked){
    var f=partFrac(q);
    if(f>=0.999)return 'ok';
    if(f>0)return 'part';
    return 'zero';
  }
  return '';
}
function dotGlyph(q){
  if(q.skipped)return '&#187;';
  if(q.checked){
    var f=partFrac(q);
    if(f>=0.999)return '&#10003;';
    if(f>0)return '&#9650;';
    return '&#10005;';
  }
  return '';
}
function updateDots(){
  var d=$('dots');if(!d)return;
  d.innerHTML='';
  S.order.forEach(function(orig,pos){
    var q=S.q[orig],b=document.createElement('button');
    b.className='dot '+qDotClass(q,orig)+(pos===S.cur?' cur':'');
    b.setAttribute('aria-label','Go to exercise '+(pos+1)+': '+esc(q.title)+(q.skipped?' (skipped)':''));
    b.innerHTML=(pos+1)+'<br>'+dotGlyph(q);
    b.addEventListener('click',function(){jumpTo(pos);});
    d.appendChild(b);
  });
}
function updateThemeChips(){
  var tc=$('themeChips');if(!tc)return;
  var counts={};
  Object.keys(THEME_LABEL).forEach(function(t){counts[t]={n:0,c:0};});
  EX.forEach(function(ex,i){
    counts[ex.theme].n++;
    if(S.q[i].checked&&!S.q[i].skipped)counts[ex.theme].c++;
  });
  tc.innerHTML=Object.keys(THEME_LABEL).map(function(t){
    return '<span class="tchip">'+esc(THEME_LABEL[t])+': <b>'+counts[t].c+'/'+counts[t].n+'</b></span>';
  }).join('');
}
function updateAllUI(){updateTimerUI();updateScoreUI();updateProgress();updateDots();updateThemeChips();}

/* ---------- navigation ---------- */
function jumpTo(pos){
  if(S.finished)return;
  S.cur=Math.max(0,Math.min(EX.length-1,pos));
  renderQ();
  updateAllUI();
}
function nextQ(){
  if(S.pauseCheck){S.pauseCheck=false;}          /* only Next ends the Check-pause */
  if(S.cur>=EX.length-1){openFinishModal();return;}
  S.cur++;renderQ();updateAllUI();
}
function prevQ(){
  if(S.pauseCheck){S.pauseCheck=false;}          /* leaving a review also ends the Check-pause */
  if(S.cur<=0)return;
  S.cur--;renderQ();updateAllUI();
}

  hint:'The cheap checks come first, and each green result moves the suspicion exactly one layer up.',
  explain:'<p>Bottom-up is the fastest path here. Link lights up clears Layer 1. Replies from the default gateway 10[.]44[.]1[.]1 clear Layers 2 and 3 on the local path, and a reply from a public IP such as 203[.]0[.]113[.]10 proves routing works end to end. When the name intranet.corp.example still fails, the only thing left is name resolution, which is a Layer 7 service (DNS, riding on UDP 53). Pointing the workstation at the healthy DNS server 10[.]44[.]9[.]5 closes the ticket. Along the way, every router hop rewrote the MAC addresses in the frame while the IP addresses stayed the same, which is why a working ping proves more than one layer.</p>',
  kw:['default gateway','DNS','Layer 7','UDP 53','routing table','hop','ping'],

      {t:'Call the ISP and report a regional outage',ok:false,fb:'One user only: the ISP is the last suspect, not the first.'},

      {t:'Test DNS resolution right away instead',ok:false,fb:'Tempting, but you have not cleared Layer 3 yet.'},
      {t:'Replace the network card of the laptop',ok:false,fb:'The link is up; the NIC is unlikely to be the fault.'},
      {t:'Check the ARP table on the core switch',ok:false,fb:'The core is far away; test the path closest to the user first.'}
    ]},
    {q:'The gateway replies. A ping to 203[.]0[.]113[.]10 (a public IP) also replies, but the portal name still fails. What does this tell you?',opts:[

      {t:'The cable between the desk and the switch is bad',ok:false,fb:'Pings would fail with a bad cable.'},

    {q:'Which fix matches the diagnosis?',opts:[
      {t:'Point the workstation at DNS server 10[.]44[.]9[.]5',ok:true,fb:'The old DNS entry pointed at a decommissioned host.'},

    ]}
  ]

{
  id:'M12', type:'fill', theme:'l1l2', pts:5, title:'Inside one frame',
  scenario:'<p>Your packet class opens the very first lecture with a drawn Ethernet frame. The slide has five blanks and the projector is already on.</p>',
  question:'<p>Complete the frame anatomy paragraph with the shuffled word bank.</p>',
  hint:'One blank names the field that announces the Layer 3 protocol; another names the size limit that causes fragmentation.',
  explain:'<p>An Ethernet frame opens with a preamble, then the destination MAC address, then the source MAC address, so the hardware addresses ride in the frame header. The EtherType field then announces which Layer 3 protocol the payload carries (0x0800 for IPv4, 0x0806 for ARP). After the payload comes the FCS trailer with the CRC checksum, which the receiver uses to drop damaged frames. The standard MTU of 1500 bytes caps the payload; bigger payloads must shrink or be fragmented into several packets.</p>',
  kw:['frame','MAC address','EtherType','FCS','CRC','MTU','fragmentation','payload','preamble'],
  parts:[
    'An Ethernet frame opens with a preamble, then the destination ',

    ', then the source MAC address. The ',
    {opts:['EtherType','TTL','window size','SYN flag'],ans:'EtherType'},
    ' field says which Layer 3 protocol rides inside. The payload follows, and the frame closes with an ',
    {opts:['FCS','ACK','sequence number','FIN'],ans:'FCS'},
    ' trailer that stores the ',
    {opts:['CRC checksum','routing table','session ID'],ans:'CRC checksum'},
    ' for error detection. A payload of 1500 bytes is the standard ',
    {opts:['MTU','TTL','MSS'],ans:'MTU'},
    ' of an Ethernet frame; larger packets must shrink or be sent as fragments.'
  ],
  distract:['ARP table']
},
{
  id:'M13', type:'order', theme:'encap', pts:5, title:'Reverse the journey',
  scenario:'<p>The same file transfer from exercise M02 arrives at server <b>FS-02</b>. The trainee now asks: what happens on the receiving side?</p>',
  question:'<p>Put the five steps of <b>de-encapsulation</b> in the order the server performs them.</p>',
  hint:'The server climbs the stack from the bottom: wire first, application last.',
  explain:'<p>De-encapsulation is the mirror image of encapsulation and runs bottom-up. Bits arrive on the wire and the NIC rebuilds the frame. The NIC checks the FCS and drops damaged frames, because error checking is a Layer 2 job. Then the frame header is stripped and the EtherType field hands the packet up (0x0800 means IPv4). The IP header is stripped and the protocol number and ports hand the segment to TCP or UDP. Finally the transport header is stripped and the pure data reaches the application. Header by header, every layer unwraps exactly what its peer wrapped.</p>',

  items:[

    'The transport header is stripped and the data reaches the application'
  ]
},
{
  id:'M14', type:'qcm', theme:'l3l4', pts:3, title:'Choppy softphone',

  question:'<p>Which transport choice fits this traffic, and why?</p>',
  hint:'One protocol keeps a connection and resends everything it loses. The other just sends and hopes.',
  explain:'<p>Real-time audio takes UDP: it is connectionless and fast, and a lost datagram is simply gone, which beats a retransmission that would arrive too late to be useful. TCP is connection-oriented: the three-way handshake opens the session, sequence numbers order the bytes, and retransmission repairs losses, but that repair adds exactly the delay and jitter that ruin live audio. Windowing is TCP flow control that stops a fast sender from drowning a slow receiver, not a cure for jitter. ICMP does not carry the call at all; it only reports errors like unreachable hosts.</p>',
  kw:['UDP','TCP','datagram','connectionless','connection-oriented','three-way handshake','windowing','flow control','ICMP','retransmission'],

{

  scenario:'<p>A hot-desk laptop shows the address <b>169[.]254[.]22[.]15</b> and users complain that nothing loads. The network team suspects the DHCP service, but you want proof before you page anyone.</p>',

  hint:'That address range is what an operating device picks for itself when no DHCP offer arrives.',
  explain:'<p>Addresses starting 169[.]254 are APIPA (automatic private IP addressing): the laptop asked for a lease, heard nothing, and picked a link-local address for itself. That makes DHCP the prime suspect, and DHCP is an application-layer service that rides on UDP ports 67 (server) and 68 (client), so broadcasts must reach the server across the VLAN. The scope counter showing zero free addresses is the root cause: the pool ran dry. Enlarging the scope or shortening lease times, then releasing and renewing, restores service. DNS, NTP or SNMP changes would not have fixed a missing lease.</p>',
  kw:['DHCP','APIPA','169[.]254','UDP 67','UDP 68','Layer 7','lease','broadcast'],
  steps:[
    {q:'What does the 169[.]254[.]22[.]15 address tell you first?',opts:[
      {t:'No DHCP offer arrived, so the laptop picked its own address',ok:true,fb:'APIPA is the fingerprint of a failed lease.'},
      {t:'The laptop was fully configured by DHCP this morning',ok:false,fb:'DHCP hands out private ranges like 10[.]x or 192[.]168[.]x, not 169[.]254.'},
      {t:'The site DNS server happens to be down',ok:false,fb:'DNS failure would not change the laptop own address.'},
      {t:'The default gateway is misconfigured again',ok:false,fb:'A wrong gateway gives no internet, but the laptop would still have a real lease.'}
    ]},

      {t:'Renew the TLS certificate of the web portal now',ok:false,fb:'Certificates matter after you have an IP, not before.'},
      {t:'Check the ARP table on the core router',ok:false,fb:'No lease means no useful ARP entry yet; the cause is upstream of ARP.'},
      {t:'Change the MTU setting on the laptop',ok:false,fb:'MTU affects big packets, never the absence of an address.'}
    ]},
    {q:'The DHCP scope shows 0 addresses left. What is the fix?',opts:[
      {t:'Enlarge the scope, shorten leases, release and renew',ok:true,fb:'Pool exhaustion is the root cause; the rest follows automatically.'},
      {t:'Add a second DNS server to the mix',ok:false,fb:'DNS was never the problem this morning.'},
      {t:'Enable port security on the access switch port',ok:false,fb:'Port security is a Layer 2 hardening step, unrelated to the empty pool.'},
      {t:'Replace the patch cable at the wall',ok:false,fb:'The laptop reached the network fine; it just got no lease.'}
    ]}

var ANSWER_LABEL={

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function normCmd(c){return String(c).replace(/\s+/g,' ').replace(/\[\.\]/g,'.').trim();}
function taskOk(t,cmdN){
  var words=cmdN.split(' '),first=words[0]==='sudo'?(words[1]||''):(words[0]||'');
  var flags={},m,re=/\s-{1,2}([a-zA-Z]+)/g;
  while((m=re.exec(cmdN))){var s=m[1];for(var i=0;i<s.length;i++)flags[s[i]]=true;}
  var base=true;
  if(t.bin){if(t.bin.indexOf(first)<0)base=false;}
  if(t.need){for(var j=0;j<t.need.length;j++){if(!flags[t.need[j]])base=false;}}
  if(t.has){if(cmdN.toLowerCase().indexOf(String(t.has).toLowerCase())<0)base=false;}
  if(t.has2){if(cmdN.toLowerCase().indexOf(String(t.has2).toLowerCase())<0)base=false;}
  if(t.re){
    var any=false;
    t.re.forEach(function(rs){try{if(new RegExp(rs).test(cmdN))any=true;}catch(e){}});
    if(t.strict)return any&&base;
    if(t.bin||t.need||t.has||t.has2){return any||base;}
    return any;
  }
  return base;
}
function innerOf(ex){return ex.type==='logview'?ex.inner:ex;}

/* ---------- render one question ---------- */
function renderQ(){

function updateActionStates(ex,q){
  var chk=$('checkBtn'),rev=$('reviseBtn'),skip=$('skipBtn'),hint=$('hintBtn');
  if(!chk)return;
  var simBlock=(ex.type==='sim')&&(q.state.sel.indexOf(-1)>=0);
  chk.disabled=q.locked||simBlock;
  chk.title=simBlock&&!q.checked?'Answer every step first, then press Check':'';
  rev.hidden=!q.checked;
  skip.disabled=q.checked;
  hint.disabled=q.hintUsed||q.checked;
}

/* ---------- choice (qcm / multi) ---------- */
function rChoice(ex,q,host,isMulti){
  var list=innerOf(ex),choices=list.choices;
  var wrap=el('div');
  wrap.setAttribute('role',isMulti?'group':'radiogroup');
  wrap.setAttribute('aria-label',isMulti?'Select all that apply':'Choose one answer');
  q.state.choiceOrder.forEach(function(ci){
    var c=choices[ci];
    var lab=el('label','choice');lab.id='ch_'+q.id+'_'+ci;
    var inp=document.createElement('input');
    inp.type=isMulti?'checkbox':'radio';inp.name='grp_'+q.id;inp.value=String(ci);
    inp.checked=!!q.sel[ci];
    inp.addEventListener('change',function(){
      if(q.locked){inp.checked=isMulti?!!q.sel[ci]:isChosen(q,ci);return;}
      if(isMulti){q.sel[ci]=inp.checked;}
      else{
        q.sel=list.choices.map(function(){return false;});q.sel[ci]=true;
        var ins=wrap.querySelectorAll('input');
        for(var k=0;k<ins.length;k++){ins[k].checked=(parseInt(ins[k].value,10)===ci);}
      }
      updateActionStates(cex(),cqu());
    });
    lab.appendChild(inp);
    lab.appendChild(el('span','ct',c.t));
    lab.appendChild(vtag('vtag_'+q.id+'_'+ci));
    wrap.appendChild(lab);
  });
  host.appendChild(wrap);
}
function isChosen(q,ci){return !!q.sel[ci];}
function vtag(id){var t=el('span','vtag','');t.id=id;t.style.display='none';return t;}

function paintChoice(ex,q,host){
  var list=innerOf(ex);
  list.choices.forEach(function(c,ci){
    var row=$('ch_'+q.id+'_'+ci),tag=$('vtag_'+q.id+'_'+ci);
    if(!row)return;
    row.classList.remove('v-ok','v-bad');
    if(c.ok){row.classList.add('v-ok');showTag(tag,'&#10003; CORRECT'+(q.sel[ci]?'':' (missed)'),'ok');}
    else if(q.sel[ci]){row.classList.add('v-bad');showTag(tag,'&#10005; WRONG','bad');}
    else tag.style.display='none';
  });
}
function showTag(t,html,cls){t.style.display='';t.className='vtag '+cls;t.innerHTML=html;}

/* ---------- drag & drop ---------- */
function rDrag(ex,q,host){
  host.appendChild(el('p',null,'Pick a chip (click) or drag it, then drop it on a slot. Click a placed chip to send it back to the bank.'));
  var bankWrap=el('div',null,'<strong>Item bank</strong>');
  host.appendChild(bankWrap);
  var bank=el('div','bank');bank.id='bank_'+q.id;host.appendChild(bank);
  var slots=el('div','slots');host.appendChild(slots);
  ex.slots.forEach(function(s){
    var d=el('div','slot');d.id='slot_'+s.id;
    d.innerHTML='<span class="slab">'+esc(s.label)+'</span>';
    var dz=el('div','dropzone','empty &mdash; drop here');dz.id='dz_'+s.id;
    d.appendChild(dz);
    d.appendChild(vtag('tag_'+s.id));
    d.addEventListener('dragover',function(e){e.preventDefault();d.classList.add('over');});
    d.addEventListener('dragleave',function(){d.classList.remove('over');});
    d.addEventListener('drop',function(e){e.preventDefault();d.classList.remove('over');placeChip(e.dataTransfer.getData('text/plain'),s.id);});
    d.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.chip'))return;placeChip(q.state.picked||'',s.id);});
    slots.appendChild(d);
  });
  function chipEl(key){
    var b=ex.bank.filter(function(x){return x.key===key;})[0];
    var c=el('span','chip','<span class="grip">::</span>'+esc(b.t));
    c.setAttribute('role','button');c.setAttribute('tabindex','0');
    c.setAttribute('aria-label',esc(b.t)+' - press Enter to pick up, then click a slot');
    if(q.state.picked===key)c.classList.add('picked');
    c.setAttribute('draggable','true');
    c.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',key);});
    c.addEventListener('click',function(){
      if(q.locked)return;
      var inSlot=Object.keys(q.state.placed).some(function(sl){return q.state.placed[sl]===key;});
      if(inSlot){Object.keys(q.state.placed).forEach(function(sl){if(q.state.placed[sl]===key)q.state.placed[sl]='';});redraw();return;}
      q.state.picked=(q.state.picked===key?'':key);redraw();
    });
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click();}});
    return c;
  }
  function placeChip(key,slotId){
    if(q.locked||!key)return;
    Object.keys(q.state.placed).forEach(function(sl){if(q.state.placed[sl]===key)q.state.placed[sl]='';});
    q.state.placed[slotId]=key;q.state.picked='';
    redraw();
  }
  function redraw(){
    bank.innerHTML='';
    q.state.bankOrder.forEach(function(key){
      var used=Object.keys(q.state.placed).some(function(sl){return q.state.placed[sl]===key;});
      if(!used)bank.appendChild(chipEl(key));
    });
    ex.slots.forEach(function(s){
      var dz=$('dz_'+s.id);if(!dz)return;
      var k=q.state.placed[s.id];
      dz.innerHTML='';
      if(k)dz.appendChild(chipEl(k));
      else dz.innerHTML='empty &mdash; drop here';
    });
  }
  redraw();
}
function paintDrag(ex,q){
  ex.slots.forEach(function(s){
    var d=$('slot_'+s.id),tag=$('tag_'+s.id);
    if(!d)return;
    d.classList.remove('v-ok','v-bad');
    var got=q.state.placed[s.id];
    if(got===s.accept){d.classList.add('v-ok');showTag(tag,'&#10003; CORRECT','ok');}
    else{
      d.classList.add('v-bad');
      var bk=ex.bank.filter(function(x){return x.key===s.accept;})[0];
      showTag(tag,'&#10005; WRONG &mdash; correct: '+esc(bk.t),'bad');
    }
  });
}

/* ---------- ordering ---------- */
function rOrder(ex,q,host){
  host.appendChild(el('p',null,'Drag the rows or use the arrows. The top row is step 1.'));
  var list=el('ol','olist');list.id='olist_'+q.id;host.appendChild(list);
  function draw(){
    list.innerHTML='';
    q.state.disp.forEach(function(itemIdx,pos){
      var li=el('li','oitem');li.id='oi_'+pos;
      li.setAttribute('draggable','true');
      li.innerHTML='<span class="onum">'+(pos+1)+'</span><span class="ot" id="ot_'+pos+'">'+esc(ex.items[itemIdx])+'</span>';
      var corner=el('span','corner');
      var up=el('button','btn mv','&#8593;');up.setAttribute('aria-label','Move row '+(pos+1)+' up');up.addEventListener('click',function(){moveRow(pos,-1);});
      var dn=el('button','btn mv','&#8595;');dn.setAttribute('aria-label','Move row '+(pos+1)+' down');dn.addEventListener('click',function(){moveRow(pos,1);});
      corner.appendChild(up);corner.appendChild(dn);
      li.appendChild(corner);
      li.appendChild(vtag('otag_'+pos));
      li.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',String(pos));});
      li.addEventListener('dragover',function(e){e.preventDefault();li.classList.add('dragover');});
      li.addEventListener('dragleave',function(){li.classList.remove('dragover');});
      li.addEventListener('drop',function(e){e.preventDefault();li.classList.remove('dragover');var f=parseInt(e.dataTransfer.getData('text/plain'),10);if(!isNaN(f))moveRowTo(f,pos);});
      list.appendChild(li);
    });
  }
  function moveRow(pos,d){var to=pos+d;if(to<0||to>=q.state.disp.length)return;moveRowTo(pos,to);}
  function moveRowTo(from,to){
    if(q.locked)return;
    var a=q.state.disp,x=a.splice(from,1)[0];a.splice(to,0,x);draw();
  }
  draw();
}
function paintOrder(ex,q){
  q.state.disp.forEach(function(itemIdx,pos){
    var li=$('oi_'+pos),tag=$('otag_'+pos),ot=$('ot_'+pos);

/* ---------- terminal ---------- */
function rTerminal(ex,q,host){
  var tt=el('div');
  ex.tasks.forEach(function(t,i){
    var d=el('div','ttask');d.id='tt_'+i;
    d.innerHTML='<div class="tg">Task '+(i+1)+'/'+ex.tasks.length+': '+esc(t.goal)+'</div>';
    if(t.outputHint)d.innerHTML+='<div class="exx">Expected output shape:<br>'+esc(t.outputHint)+'</div>';
    d.appendChild(vtag('ttag_'+i));
    tt.appendChild(d);
  });
  host.appendChild(tt);
  var term=el('div','term');
  term.innerHTML='<div class="tbar"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span><span style="color:#64748b;font-size:12px;margin-left:6px">console</span></div>'+
    '<div class="thist" id="thist"></div>';
  var tin=el('div','tin');
  tin.innerHTML='<span class="pr">'+esc(ex.boot)+'</span>';
  var inp=document.createElement('input');inp.id='cmdin';inp.autocomplete='off';inp.spellcheck=false;
  inp.setAttribute('aria-label','Type a command and press Enter or Run');
  tin.appendChild(inp);
  var run=el('button','btn mv','Run');run.setAttribute('aria-label','Run command');
  run.addEventListener('click',submitCmd);
  tin.appendChild(run);
  term.appendChild(tin);
  host.appendChild(term);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitCmd();}});
  function drawHist(){
    var h=$('thist');if(!h)return;
    h.textContent=q.state.hist.join('\n');
    h.scrollTop=h.scrollHeight;
  }
  function submitCmd(){
    if(q.locked)return;
    var cmd=inp.value.trim();if(!cmd)return;
    q.state.hist.push(ex.boot+cmd);
    inp.value='';
    var n=normCmd(cmd),hit=-1,already=-1;
    ex.tasks.forEach(function(t,i){
      if(!taskOk(t,n))return;
      if(!q.state.done[i]&&hit<0)hit=i;
      else if(q.state.done[i]&&already<0)already=i;
    });
    if(hit>=0){q.state.done[hit]=true;q.state.typed[hit]=cmd;q.state.hist.push(ex.tasks[hit].canned);}
    else if(already>=0){q.state.hist.push('(that task is already completed)');}
    else{q.state.hist.push('--- command not accepted for any open task; re-read the goal and check tool + flags ---');}
    drawHist();
  }
  drawHist();
}
function paintTerminal(ex,q){
  ex.tasks.forEach(function(t,i){
    var d=$('tt_'+i),tag=$('ttag_'+i);
    if(!d)return;
    d.classList.remove('v-ok','v-bad');
    if(q.state.done[i]||taskOk(t,normCmd(q.state.typed[i]||''))){d.classList.add('v-ok');showTag(tag,'&#10003; CORRECT','ok');}
    else{d.classList.add('v-bad');showTag(tag,'&#10005; NOT COMPLETED'+(t.example?' &mdash; e.g. '+esc(t.example):''),'bad');}
  });
}

/* ---------- branching scenario (sim) ---------- */
function rSim(ex,q,host){
  var wrap=el('div');host.appendChild(wrap);
  ex.steps.forEach(function(st,i){
    if(i>=q.state.reveal)return;
    var side=st.side==='blue'?'blue':(st.side==='red'?'red':'');
    var d=el('div','sub '+side);d.id='sim_'+i;
    d.innerHTML='<h4>Step '+(i+1)+' / '+ex.steps.length+(st.side?' &mdash; '+st.side.toUpperCase()+' TEAM':'')+'</h4><p>'+st.q+'</p>';
    (q.state.optsOrder? q.state.optsOrder[i] : st.opts.map(function(_,k){return k;})).forEach(function(j){
      var o=st.opts[j];
      var lab=el('label','choice');lab.id='sopt_'+i+'_'+j;
      var inp=document.createElement('input');
      inp.type='radio';inp.name='sim_'+q.id+'_'+i;inp.checked=(q.state.sel[i]===j);
      inp.addEventListener('change',function(){
        if(q.locked){inp.checked=(q.state.sel[i]===j);return;}
        q.state.sel[i]=j;
        if(i+1===q.state.reveal&&q.state.reveal<ex.steps.length){q.state.reveal++;renderQ();}
        else{updateActionStates(cex(),cqu());}
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','ct',o.t));
      lab.appendChild(vtag('stag_'+i+'_'+j));

    wrap.appendChild(d);
  });
  var pending=q.state.sel.indexOf(-1);
  if(pending>=0&&pending<q.state.reveal){
    host.appendChild(el('p',null,'Answer step '+(pending+1)+' to reveal the next step. Press Check once every step is answered.'));
  }else if(pending<0&&!q.checked){
    host.appendChild(el('p',null,'All steps answered &mdash; press <b>Check</b> to score this scenario.'));
  }

function paintSim(ex,q){

      }else if(cj>=0&&st.opts[cj].fb){

/* ---------- render dispatch ---------- */
function renderAnswer(ex,q,host){
  switch(ex.type){
    case 'qcm':rChoice(ex,q,host,false);break;
    case 'multi':rChoice(ex,q,host,true);break;
    case 'drag':rDrag(ex,q,host);break;
    case 'order':rOrder(ex,q,host);break;
    case 'match':rMatch(ex,q,host);break;
    case 'fill':rFill(ex,q,host,false);break;
    case 'terminal':rTerminal(ex,q,host);break;
    case 'sim':rSim(ex,q,host);break;
    case 'logview':rLogview(ex,q,host);break;
  }
}
function paint(ex,q){
  switch(ex.type){
    case 'qcm':case 'multi':paintChoice(ex,q);break;
    case 'drag':paintDrag(ex,q);break;
    case 'order':paintOrder(ex,q);break;
    case 'match':paintMatch(ex,q);break;
    case 'fill':paintFill(ex,q,false);break;
    case 'terminal':paintTerminal(ex,q);break;
    case 'sim':paintSim(ex,q);break;

      if(ex.inner.type==='qcm'||ex.inner.type==='multi')paintChoice(ex,q);
      else if(ex.inner.type==='fill')paintFill(ex,q,true);
      break;
  }
}

/* ---------- validation ---------- */
function validateEx(ex,q){
  var els=0,ok=0,i;
  if(ex.type==='qcm'||ex.type==='multi'){
    var list=innerOf(ex);
    els=list.choices.filter(function(c){return c.ok;}).length;
    ok=0;
    list.choices.forEach(function(c,ci){if(c.ok&&q.sel[ci])ok++;});
  }else if(ex.type==='drag'){
    els=ex.slots.length;ok=0;q.state.slotVerdict={};
    ex.slots.forEach(function(s){var good=(q.state.placed[s.id]===s.accept);q.state.slotVerdict[s.id]=good;if(good)ok++;});
  }else if(ex.type==='order'){
    els=ex.items.length;ok=0;q.state.posVerdict=[];
    q.state.disp.forEach(function(itemIdx,pos){var good=(itemIdx===pos);q.state.posVerdict.push(good);if(good)ok++;});
  }else if(ex.type==='match'){
    var lm=innerOf(ex);
    els=lm.pairs.length;ok=0;q.state.pairVerdict=[];
    lm.pairs.forEach(function(p,i){var good=(q.state.sel[i]===p.r);q.state.pairVerdict.push(good);if(good)ok++;});
  }else if(ex.type==='fill'){
    var lf=ex.type==='logview'?ex.inner:ex;
    els=0;ok=0;q.state.blankVerdict=[];
    lf.parts.forEach(function(p){
      if(typeof p==='string')return;
      var good=(q.state.sel[els]===p.ans);
      q.state.blankVerdict.push(good);
      if(good)ok++;
      els++;
    });
  }else if(ex.type==='terminal'){
    els=ex.tasks.length;ok=0;q.state.taskVerdict=[];
    ex.tasks.forEach(function(t,i){
      var good=q.state.done[i]||taskOk(t,normCmd(q.state.typed[i]||''));
      q.state.taskVerdict.push(good);
      if(good)ok++;
    });
  }else if(ex.type==='sim'){
    els=ex.steps.length;ok=0;q.state.stepVerdict=[];
    ex.steps.forEach(function(st,i){
      var j=q.state.sel[i],good=(j>=0&&st.opts[j].ok);
      q.state.stepVerdict.push(good);
      if(good)ok++;
    });
  }else if(ex.type==='logview'){
    var it=ex.inner;
    if(it.type==='qcm'||it.type==='multi'){
      els=it.choices.filter(function(c){return c.ok;}).length;
      ok=0;
      it.choices.forEach(function(c,ci){if(c.ok&&q.sel[ci])ok++;});
    }else if(it.type==='fill'){
      els=0;ok=0;q.state.blankVerdict=[];
      it.parts.forEach(function(p){
        if(typeof p==='string')return;
        var good=(q.state.sel[els]===p.ans);
        q.state.blankVerdict.push(good);
        if(good)ok++;els++;
      });
    }
  }
  q.elsTotal=els;q.elsOk=ok;
  var raw=els>0?q.pts*ok/els:0;
  if(q.hintUsed)raw=raw*0.9;
  q.earned=r1(raw);
  return {els:els,ok:ok};
}

/* ---------- answer descriptions for the report ---------- */
function describeEx(ex,q,kind){
  var arr=[],i;
  if(q.skipped)return '<em>Not answered &mdash; skipped.</em>';
  if(!q.checked)return '<em>Not answered before the exam ended.</em>';
  var pick=kind==='user';
  if(ex.type==='qcm'||ex.type==='multi'){
    var list=innerOf(ex);
    list.choices.forEach(function(c,ci){
      var chosen=!!q.sel[ci];
      if(pick&&chosen)arr.push(c.t);
      if(!pick&&c.ok)arr.push(c.t);
    });
    return arr.length?arr.map(function(t){return '&#8226; '+esc(t);}).join('<br>'):'<em>Nothing selected.</em>';
  }
  if(ex.type==='drag'){
    if(pick){
      ex.slots.forEach(function(s){var k=q.state.placed[s.id];arr.push('<b>'+esc(s.label)+':</b> '+(k?esc(ex.bank.filter(function(x){return x.key===k;})[0].t):'<em>empty</em>'));});
    }else{
      ex.slots.forEach(function(s){arr.push('<b>'+esc(s.label)+':</b> '+esc(ex.bank.filter(function(x){return x.key===s.accept;})[0].t));});
    }
    return arr.join('<br>');
  }
  if(ex.type==='order'){
    var src=pick?q.state.disp:ex.items.map(function(_,k){return k;});
    src.forEach(function(itemIdx,pos){arr.push((pos+1)+'. '+esc(ex.items[itemIdx]));});
    return arr.join('<br>');
  }
  if(ex.type==='match'){
    var lm=innerOf(ex);
    lm.pairs.forEach(function(p,i){
      arr.push('<b>'+esc(p.l)+':</b> '+(pick?(q.state.sel[i]?esc(q.state.sel[i]):'<em>empty</em>'):esc(p.r)));
    });
    return arr.join('<br>');
  }
  if(ex.type==='fill'){
    var lf=ex.type==='logview'?ex.inner:ex,bi=0;
    lf.parts.forEach(function(p){
      if(typeof p==='string')return;
      arr.push('Blank '+(bi+1)+': '+(pick?(q.state.sel[bi]?esc(q.state.sel[bi]):'<em>empty</em>'):'<b>'+esc(p.ans)+'</b>'));
      bi++;
    });
    return arr.join('<br>');
  }
  if(ex.type==='terminal'){
    ex.tasks.forEach(function(t,i){
      arr.push('<b>Task '+(i+1)+':</b> '+(pick?(q.state.typed[i]?('<code>'+esc(q.state.typed[i])+'</code>'):'<em>no command</em>'):('<code>'+esc(t.ans||t.example||t.canned.split('\n')[0])+'</code>')));
    });
    return arr.join('<br>');
  }
  if(ex.type==='sim'){
    ex.steps.forEach(function(st,i){
      var j=q.state.sel[i];
      var okOpt=st.opts.filter(function(o){return o.ok;})[0];
      arr.push('<b>Step '+(i+1)+':</b> '+(pick&&j>=0?esc(st.opts[j].t):(pick?'<em>no choice</em>':esc(okOpt.t))));
    });
    return arr.join('<br>');
  }
  if(ex.type==='logview'){
    return describeInner(ex.inner,q,kind);
  }
  return '';
}
function describeInner(it,q,kind){
  var arr=[];
  if(it.type==='qcm'||it.type==='multi'){
    it.choices.forEach(function(c,ci){
      if(kind==='user'&&q.sel[ci])arr.push('&#8226; '+esc(c.t));
      if(kind!=='user'&&c.ok)arr.push('&#8226; '+esc(c.t));
    });
    return arr.length?arr.join('<br>'):'<em>Nothing selected.</em>';
  }
  if(it.type==='fill'){
    var bi=0;
    it.parts.forEach(function(p){
      if(typeof p==='string')return;
      arr.push('Blank '+(bi+1)+': '+(kind==='user'?(q.state.sel[bi]?esc(q.state.sel[bi]):'<em>empty</em>'):'<b>'+esc(p.ans)+'</b>'));
      bi++;
    });
    return arr.join('<br>');
  }
  return '';
}

/* ===== ACTIONS + RESULTS ===== */
'use strict';
/* ===== actions: hint / skip / check / revise ===== */
function onHint(){
  var ex=cex(),q=cqu();
  if(q.hintUsed||q.checked)return;
  q.hintUsed=true;
  var h=el('div','qhint','<b>Hint (costs 10% of this exercise):</b> '+esc(ex.hint));
  var box=$('qbox');
  box.insertBefore(h,$('fbArea'));
  updateActionStates(ex,q);
  var head=box.querySelector('.qhead .pts');
  if(head)head.innerHTML=ex.pts+' pts &middot; hint used (-10%)';
}
function onSkip(){
  var ex=cex(),q=cqu();
  if(q.checked)return;
  q.skipped=true;
  nextQ();
}
function onCheck(){
  var ex=cex(),q=cqu();
  if(q.locked)return;
  validateEx(ex,q);
  q.checked=true;q.skipped=false;q.locked=true;
  S.pauseCheck=true;                      /* Check-pause starts; only Next ends it */
  $('fbArea').style.display='';
  var f=partFrac(q),lbl;
  if(f>=0.999)lbl='FULL';
  else if(f>0)lbl='PARTIAL';
  else lbl='ZERO';
  $('fbArea').innerHTML='<div class="fhead">'+verdictIcon(f)+' '+lbl+' &mdash; '+q.elsOk+' / '+q.elsTotal+' answer parts correct</div>'+
    '<div class="scoreline">You earned <b>'+q.earned+'</b> / '+q.pts+' points on this exercise.'+
    (q.hintUsed?' (includes the -10% hint cost)':'')+
    (S.pauseCheck?' <b>&middot; Timer paused &mdash; review mode. Press Next to continue.</b>':'')+'</div>';
  $('explainArea').hidden=false;
  paint(ex,q);
  updateActionStates(ex,q);
  updateAllUI();
}
function verdictIcon(f){
  if(f>=0.999)return '<span style="color:var(--okT)">&#10003;</span>';
  if(f>0)return '<span style="color:var(--warnT)">&#9650;</span>';
  return '<span style="color:var(--badT)">&#10005;</span>';
}
function onRevise(){
  var q=cqu();
  if(!q.checked)return;
  q.locked=false;
  updateActionStates(cex(),q);
  var fb=$('fbArea');
  if(fb)fb.innerHTML='<div class="fhead">Revise mode</div><div class="scoreline">Change your answer, then press Check again. The timer stays in review mode until you press Next.</div>';
}

/* ===== intro screen ===== */
function renderIntro(){
  var sev=CONFIG.SEVERITY,sevCls=sev==='HARD'?' hard':'';
  var kw=CONFIG.KEYWORDS.map(function(t){
    return '<div class="kwtheme"><h3>'+esc(t.theme)+'</h3>'+t.items.map(function(k){return '<span class="kwtag">'+esc(k)+'</span>';}).join('')+'</div>';
  }).join('');
  $('intro').innerHTML=
    '<div class="card">'+
      '<div class="kicker">CompTIA Network+ &mdash; Objective 1.1</div>'+
      '<h1>OSI Model Layers &amp; Encapsulation &mdash; '+sev+' practice exam</h1>'+
      '<p id="greet" style="color:var(--mut);margin:4px 0 0"></p>'+
      '<div class="stats">'+
        '<div class="stat"><div class="v">'+EX.length+'</div><div class="k">Exercises</div></div>'+
        '<div class="stat"><div class="v">'+CONFIG.TIMER_MINUTES+':00</div><div class="k">Time limit</div></div>'+
        '<div class="stat"><div class="v">'+CONFIG.PASS_MARK+'%</div><div class="k">Pass mark</div></div>'+
        '<div class="stat"><div class="v">'+sev+'</div><div class="k">Severity</div></div>'+
      '</div>'+
      '<p>This exam trains the OSI model layers (Physical, Data Link, Network, Transport, Session, Presentation, Application) and the encapsulation concepts of Network+ objective 1.1. Every exercise mirrors real work: SOC triage, packet analysis, switch and firewall consoles, incident tickets and troubleshooting walks. The severity level of this file is <b>'+sev+'</b>: '+(sev==='MEDIUM'?'real multi-step reasoning with realistic data, solvable by a prepared candidate.':'subtle distractors, near-miss answers and judgement calls that need an experienced analyst.')+'</p>'+
      '<h2>Keywords covered</h2>'+
      '<div class="kwgrid">'+kw+'</div>'+
      '<h2 style="margin-top:16px">How this exam works</h2>'+
      '<ul class="rules">'+
        '<li><b>Scenario, question and answer are always separate blocks.</b> Read the scenario first, then the question, then answer in the third block.</li>'+
        '<li><b>Check</b> validates your answer, marks every part green (correct), red (wrong) or amber (partial), locks the score and <b>pauses the timer in review mode</b>. The exercise stays fully visible so you can study the feedback. The timer resumes only when you press <b>Next</b>.</li>'+
        '<li><b>Pause (manual)</b> hides the exercise content while the clock is frozen. Use it for real breaks. Both pause reasons can stack; the clock runs only when both are cleared.</li>'+
        '<li><b>Skip</b> jumps to the next exercise and flags it with an amber marker. Skipped exercises are <b>excluded from scoring</b> (they count in neither the earned points nor the total). You can return to a skipped exercise and press Check to count it, until the timer ends.</li>'+
        '<li><b>Partial credit:</b> multi-part exercises score per part. A 4-slot drag with 3 correct slots earns 3/4 of the points.</li>'+
        '<li><b>Hint (-10%):</b> one nudge per exercise. It reveals a direction, never the answer, and costs 10% of that exercise.</li>'+
        '<li><b>Timer:</b> '+CONFIG.TIMER_MINUTES+' minutes for '+EX.length+' exercises ('+r1(CONFIG.TIMER_MINUTES/EX.length)+' min per exercise). When time ends, the exam finishes itself; unanswered exercises are excluded from scoring.</li>'+
        '<li>Exercise types: scenario triage boards, drag &amp; drop, log viewer with filter, branching decisions, ordering, matching, fill-in-the-blank, a terminal emulator, spot-the-mistake, dual blue/red team views, and a few multiple choice questions.</li>'+
      '</ul>'+
      '<div class="btnrow" style="margin-top:14px"><button class="btn primary" id="startBtn" style="font-size:17px;padding:12px 26px">Start the '+sev+' exam &#9654;</button></div>'+
    '</div>';
  $('startBtn').addEventListener('click',startExam);
}

function startExam(){
  S=newState();
  S.started=true;
  $('intro').hidden=true;
  $('results').hidden=true;
  $('topbar').hidden=false;
  $('examMain').hidden=false;
  renderQ();
  updateAllUI();
  if(!S.timerId){S.timerId=true;startTimer();}
  window.scrollTo(0,0);
}

/* ===== finish modal ===== */
function openFinishModal(){
  var a=answeredList();
  var skipped=S.q.filter(function(q){return q.skipped&&!q.checked;}).length;
  var unanswered=S.q.filter(function(q){return !q.checked&&!q.skipped;}).length;
  var m=$('modal');
  if(a.length===0){
    m.innerHTML='<div class="mcard"><h3>Nothing answered yet</h3><p>You must answer at least one exercise before finishing. Skipping everything is not allowed: open any exercise, answer it and press Check.</p><div class="btnrow"><button class="btn primary" id="mOk">Back to the exam</button></div></div>';
    m.hidden=false;
    $('mOk').addEventListener('click',function(){m.hidden=true;});
    return;
  }
  m.innerHTML='<div class="mcard"><h3>Finish and see your score?</h3>'+
    '<p>Answered and checked: <b>'+a.length+'</b> of '+EX.length+'<br>Skipped (excluded from scoring): <b>'+skipped+'</b><br>Not reached before finishing (excluded): <b>'+unanswered+'</b></p>'+
    '<p>Exercises still flagged as skipped stay excluded from both the earned points and the total.</p>'+
    '<div class="btnrow"><button class="btn primary" id="mYes">Finish exam</button><button class="btn ghost" id="mNo">Keep working</button></div></div>';
  m.hidden=false;
  $('mYes').addEventListener('click',function(){m.hidden=true;finishExam(false);});
  $('mNo').addEventListener('click',function(){m.hidden=true;});
}

/* ===== results ===== */
function labelFor(q){
  if(q.skipped)return ['skipped','SKIPPED'];
  if(!q.checked)return ['unans','NOT ANSWERED'];
  var f=partFrac(q);
  if(f>=0.999)return ['full','FULL'];
  if(f>0)return ['partial','PARTIAL'];
  return ['zero','ZERO'];
}
function finishExam(byTimer){
  if(S.finished)return;
  S.finished=true;
  if(S.pauseManual)setManualPause(false);
  S.pauseCheck=false;
  var m=$('modal');if(m)m.hidden=true;
  var res=$('results');res.innerHTML='';res.hidden=false;
  $('examMain').hidden=true;
  $('topbar').hidden=true;
  var s=scoreSummary();
  var passed=s.pct>=CONFIG.PASS_MARK;
  var skippedIdx=[],unansIdx=[];
  S.order.forEach(function(orig,pos){
    var q=S.q[orig];
    if(q.skipped&&!q.checked)skippedIdx.push(pos+1);
    else if(!q.checked)unansIdx.push(pos+1);
  });
  var rows='';
  S.order.forEach(function(orig,pos){
    var ex=EX[orig],q=S.q[orig],lb=labelFor(q);
    var verdict = q.checked? (verdictIcon(normEarned(q))+' '+q.elsOk+'/'+q.elsTotal+' parts') : '&#8212;';
    rows+='<tr><td>'+(pos+1)+'</td><td>'+esc(ex.title)+'<br><span style="color:var(--mut);font-size:12px">'+esc(THEME_LABEL[ex.theme])+'</span></td>'+
      '<td><span class="rlabel '+lb[0]+'">'+lb[1]+'</span></td>'+
      '<td>'+(q.checked||q.skipped? q.earned+' / '+q.pts:'&mdash;')+'<br><span style="color:var(--mut);font-size:12px">'+verdict+'</span></td>'+
      '<td><details class="rdetail"><summary>Review this exercise</summary>'+
        '<p><b>Your answer:</b><br>'+describeEx(ex,q,'user')+'</p>'+
        '<p><b>Correct answer:</b><br>'+describeEx(ex,q,'correct')+'</p>'+
        '<p><b>Explanation:</b><br>'+ex.explain+'</p>'+
        (q.skipped?'<p><i>This exercise was skipped and excluded from scoring.</i></p>':'')+
        (!q.checked&&!q.skipped?'<p><i>This exercise was not answered before the end, so it is excluded from scoring.</i></p>':'')+
      '</details></td></tr>';
  });
  res.innerHTML=
    '<div class="card">'+
      '<div class="kicker">'+(byTimer?'Time is up &mdash; ':'')+'Final result</div>'+
      '<div class="res-top">'+
        '<div><div class="pct" id="pctNum">0%</div><div style="color:var(--mut)">'+s.earn+' of '+s.max+' raw points &middot; '+s.n+' of '+EX.length+' exercises counted</div></div>'+
        '<div class="verdict '+(passed?'pass':'fail')+'" id="verdictBox" style="visibility:hidden">'+(passed?'PASS':'FAIL')+'</div>'+
      '</div>'+
      '<div class="cert '+(passed?'':'failc')+'" id="certBox" style="display:none">'+
        (passed?
          '<h2 style="color:var(--okT)">Congratulations &mdash; you passed</h2><p>You reached the '+CONFIG.PASS_MARK+'% pass mark on this '+CONFIG.SEVERITY+' exam for Network+ 1.1 (OSI model layers and encapsulation). You can read the OSI stack, map protocols, devices and PDUs to their layers, and walk an encapsulation chain with confidence. Move on to the HARD file to test the same keywords under analyst-level ambiguity.</p>'
          :
          '<h2 style="color:var(--badT)">Not this time &mdash; retake the exam</h2><p>You needed '+CONFIG.PASS_MARK+'% and scored '+s.pct+'%. Review the per-exercise report below, focusing on the red and amber items, then press <b>Retake exam</b>. Questions and answer choices will be shuffled again.</p>')+
      '</div>'+
      (skippedIdx.length?'<div class="note"><b>Skipped and excluded from scoring:</b> exercises '+skippedIdx.join(', ')+'. They count in neither the earned points nor the total.</div>':'')+
      (unansIdx.length?'<div class="note"><b>Not answered before the end (excluded from scoring):</b> exercises '+unansIdx.join(', ')+'.</div>':'')+
      '<h2>Per-exercise report</h2>'+
      '<table class="res-table"><thead><tr><th>#</th><th>Exercise</th><th>Result</th><th>Points</th><th>Details</th></tr></thead><tbody>'+rows+'</tbody></table>'+
      '<div class="btnrow" style="margin-top:16px"><button class="btn primary" id="retakeBtn">Retake exam</button></div>'+
    '</div>';
  animateResult(s,passed);
  $('retakeBtn').addEventListener('click',function(){
    $('results').hidden=true;
    $('intro').hidden=false;
    renderIntro();
    window.scrollTo(0,0);
  });
}
function animateResult(s,passed){
  var pctEl=$('pctNum');
  var fire=function(){
    if(S.scoreFired)return;
    S.scoreFired=true;
    reportScore(s);
  };
  var show=function(){
    pctEl.textContent=s.pct+'%';
    $('verdictBox').style.visibility='visible';
    $('certBox').style.display='';
    fire();
  };
  if(reducedMotion()){show();return;}
  var cur=0,steps=Math.max(1,s.pct),iv=setInterval(function(){
    cur+=Math.max(1,Math.round(steps/24));
    if(cur>=s.pct){cur=s.pct;clearInterval(iv);pctEl.textContent=cur+'%';setTimeout(show,150);}
    else pctEl.textContent=cur+'%';
  },40);
}

/* ===== website integration ===== */
function reportScore(s){
  var percent=Math.round((s.n>0?s.pct:0));
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CONFIG.TOPIC_ID,
      score:Math.round(s.n>0?s.pct/100*s.n:0),
      total:s.n,
      percent:percent,
      passed:percent>=CONFIG.PASS_MARK
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
window.addEventListener('message',function(event){
  if(!event.data)return;
  var t=event.data.type;
  if(t!=='CYBERPULSE_INIT'&&t!=='CYBERMASTERY_INIT')return;
  try{
    if(event.data.username){
      USER=String(event.data.username);
      var g=$('greet');
      if(g)g.textContent='Candidate: '+USER;
    }
  }catch(e){}
});

/* ===== boot ===== */
function boot(){
  CONFIG.KEYWORDS=(typeof KEYWORDS!=='undefined')?KEYWORDS:[];
  S=newState();
  renderIntro();
  updateAllUI();
  $('pauseBtn').addEventListener('click',function(){setManualPause(!S.pauseManual);});
  $('resumeBtn').addEventListener('click',function(){setManualPause(false);});
  $('prevBtn').addEventListener('click',prevQ);
  $('nextBtn').addEventListener('click',nextQ);
  $('finishBtn').addEventListener('click',openFinishModal);
  $('legend').innerHTML=
    '<span><span class="rlabel full">FULL</span> correct</span>'+
    '<span><span class="rlabel partial">PARTIAL</span> some parts right</span>'+
    '<span><span class="rlabel zero">ZERO</span> wrong</span>'+
    '<span><span class="rlabel skipped">SKIPPED</span> excluded until answered</span>';
  $('sevBadge').textContent=CONFIG.SEVERITY;
  $('sevBadge').className='sev'+(CONFIG.SEVERITY==='HARD'?' hard':'');
}
document.addEventListener('DOMContentLoaded',boot);

</script>
</body>
</html>
