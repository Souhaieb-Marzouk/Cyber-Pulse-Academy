.expl{margin-top:10px;border-top:1px dashed var(--line2);padding-top:10px;font-size:15px}

<script>
var EX=
/* ============ 2.2 Switching Technologies — MEDIUM — exercise data ============ */
[
{t:'qcm', multi:false, th:'vlan', short:'Broadcast containment',
 k:['VLAN','broadcast domain'],
 sc:'<p>You inherit a flat office network: 240 devices in one broadcast domain. Last month one looping cable froze every floor at the same time. The IT manager asks what a VLAN upgrade would actually change before approving the budget.</p>',
 q:'<p>What is the primary benefit of splitting the network into VLANs?</p>',
 al:'CHOOSE ONE',
 ch:[
  {h:'VLANs split the network into smaller broadcast domains', plain:'Smaller broadcast domains per group', ok:true},
  {h:'VLANs add encryption so nobody can read frames on the wire', plain:'VLANs encrypt frames', ok:false},
  {h:'VLANs increase the speed of the uplink ports', plain:'VLANs speed up uplinks', ok:false},
  {h:'VLANs let the switch assign more IP addresses per port', plain:'More IP addresses per port', ok:false}
 ],
 hint:'Think about what actually travelled too far during the incident: broadcast frames.',
 at:'VLANs split one big broadcast domain into smaller per-group domains; inter-group traffic must then be routed.',
 ex:'<p>A VLAN cuts one broadcast domain into several smaller ones. Broadcasts — and a loop storm — stay inside the VLAN they start in, and traffic between groups must be routed. VLANs do not encrypt anything, do not make uplinks faster and do not change how many IP addresses a port can hand out.</p>'},

{t:'match', th:'vlan', short:'Access or trunk',
 k:['access port','trunk port','802.1Q tagging'],
 sc:'<p>You are documenting a new access switch. The intern labelled every port the same way, so you must sort the port descriptions by the correct port type before the doc goes live.</p>',
 q:'<p>Match each description to the port type it belongs to.</p>',
 al:'MATCH PAIRS',
 pairs:[
  {l:'Carries traffic for exactly one VLAN, untagged', r:'Access port'},
  {l:'Carries many VLANs, frames tagged with 802.1Q', r:'Trunk port'},
  {l:'Connects a PC, printer or IP phone', r:'Access port'},
  {l:'Connects switch to switch or switch to router', r:'Trunk port'}
 ],
 hint:'Ask each description two questions: how many VLANs, and tagged or not?',
 at:'One VLAN untagged / end devices = access port. Many VLANs tagged with 802.1Q / switch-to-switch = trunk port.',
 ex:'<p>An access port belongs to a single VLAN and sends its frames untagged — that is where PCs, printers and phones connect. A trunk carries several VLANs over one link and adds a 4-byte 802.1Q tag with the VLAN number to each frame — that is how switches and routers interconnect.</p>'},

{t:'fill', th:'vlan', short:'Native VLAN basics',
 k:['native VLAN','802.1Q tagging','VLAN 1'],
 sc:'<p>During a trunk rollout the junior admin asks why one VLAN never gets a tag, and why the baseline says to move it away from its default.</p>',
 q:'<p>Complete the sentences with words from the bank.</p>',
 al:'TYPE INTO THE BLANKS',
 parts:['On an 802.1Q trunk, frames from the native VLAN cross the link ', {a:['untagged','with no tag','without a tag']}, ', with no tag added. The factory default native VLAN is VLAN ', {a:['1','one']}, '. Best practice: move the native VLAN to an unused VLAN and make sure both ends of every trunk use the ', {a:['same','matching','identical']}, ' number.'],
 bank:['untagged','tagged','1','4094','same','different','trunk','access'],
 hint:'One VLAN is carried without the 802.1Q tag — which one, and what happens if the two ends disagree?',
 at:'untagged · 1 · same',
 ex:'<p>The native VLAN is the one VLAN whose frames cross a trunk untagged. The default native VLAN is VLAN 1, so moving it to an unused VLAN removes the trick attackers use to hop VLANs. Both ends must agree on the native VLAN number, otherwise untagged frames land in different VLANs on each side.</p>'},

{t:'multi', th:'vlan', short:'Phone + PC on one port',
 k:['voice VLAN','access port','PoE power budget','802.1Q tagging'],
 sc:'<p>Floor 3 gets IP phones with a PC daisy-chained behind each phone, one switch port each. The phones must take power from the switch because there are no power sockets at the desks.</p>',
 q:'<p>Select every statement that is true for this design.</p>',
 al:'SELECT ALL THAT APPLY',
 ch:[
  {h:'The phone tags its voice traffic with the voice VLAN ID (802.1Q)', plain:'Phone tags traffic with voice VLAN ID', ok:true},
  {h:'The PC behind the phone sends untagged traffic that lands in the access/data VLAN', plain:'PC untagged traffic lands in data VLAN', ok:true},
  {h:'The same port can deliver PoE to the phone', plain:'Same port delivers PoE', ok:true},
  {h:'The voice VLAN must use the same VLAN ID as the data VLAN', plain:'Voice VLAN must equal data VLAN', ok:false},
  {h:'The phone stops working whenever a PC is plugged into it', plain:'PC presence blocks the phone', ok:false}
 ],
 hint:'One physical port carries two logical VLANs — how does the switch tell the two traffic types apart?',
 at:'Phone traffic is tagged with the voice VLAN; PC traffic is untagged into the access VLAN; the port delivers PoE to the phone. Voice and data VLANs are different VLANs.',
 ex:'<p>The switch separates the two flows on one port: untagged frames belong to the access VLAN, and the phone tags its own frames with the voice VLAN ID so they land in the voice VLAN. PoE powers the phone over the same cable. The voice and data VLANs must be different, and plugging in the PC does not stop the phone.</p>'},

{t:'order', th:'vlan', short:'802.1Q frame journey',
 k:['802.1Q tagging','access port','trunk port'],
 sc:'<p>A NOC trainee asks what physically happens to a frame that travels from one PC to another across a trunk. Draw the pipeline for the trainee.</p>',
 q:'<p>Put the steps in the order the frame experiences them.</p>',
 al:'DRAG TO ORDER',
 items:[
  {h:'The access port receives an untagged frame from the sending PC', plain:'Access port receives untagged frame from PC'},
  {h:'The switch adds a 4-byte 802.1Q tag carrying the VLAN ID', plain:'Switch adds 4-byte 802.1Q tag with VLAN ID'},
  {h:'The tagged frame crosses the trunk link to the next switch', plain:'Tagged frame crosses the trunk link'},
  {h:'The receiving switch reads the tag and removes it', plain:'Receiving switch reads the tag and removes it'},
  {h:'The frame leaves the far access port untagged, toward the other PC', plain:'Frame leaves far access port untagged'}
 ],
 hint:'Tagging happens at the trunk, not at the PC. Where is the tag added, and where is it removed?',
 at:'Access in untagged → add 802.1Q tag → cross trunk → read and remove tag → access out untagged.',
 ex:'<p>PCs never see tags. The switch tags a frame only while it crosses a trunk (unless it is the native VLAN), and the far switch strips the tag before sending the frame out an access port. That add-and-remove cycle is the whole job of 802.1Q.</p>'},

{t:'multi', th:'vlan', short:'Stop VLAN hopping',
 k:['VLAN hopping (double tagging)','native VLAN','DTP','switchport nonegotiate'],
 sc:'<p>A past penetration test showed a successful double-tag VLAN hopping attack launched from a normal user port. You are writing the hardening baseline for all access ports.</p>',
 q:'<p>Select every hardening step that stops double-tag VLAN hopping.</p>',
 al:'SELECT ALL THAT APPLY',
 ch:[
  {h:'Move the native VLAN to an unused VLAN that no user port belongs to', plain:'Native VLAN moved to unused VLAN', ok:true},
  {h:'Force user ports with switchport mode access', plain:'Forced access mode on user ports', ok:true},
  {h:'Add switchport nonegotiate so DTP frames stop flowing', plain:'nonegotiate stops DTP frames', ok:true},
  {h:'Leave DTP in dynamic auto so ports adapt to whatever is plugged in', plain:'Keep DTP auto', ok:false},
  {h:'Use VLAN 1 as the native VLAN on every trunk for consistency', plain:'Keep VLAN 1 as native', ok:false}
 ],
 hint:'The attack needs three things: an untagged native VLAN, the attacker inside that VLAN, and a trunk that can be negotiated.',
 at:'Fixes: unused native VLAN, forced access mode, nonegotiate. DTP auto and VLAN 1 as native both help the attacker.',
 ex:'<p>Double-tag hopping abuses native-VLAN handling: the attacker sends a frame with two tags, the switch strips the outer (native) tag, and the surviving inner tag switches the frame into the target VLAN. If the native VLAN is unused, the inner tag has nowhere useful to land. Forced access mode and nonegotiate stop the port from ever becoming a trunk, while DTP auto actively invites negotiation and VLAN 1 as native is exactly what the attack script expects.</p>'},

{t:'cat', th:'vlan', short:'DTP outcomes',
 k:['DTP','switchport mode','trunk port'],
 sc:'<p>Two ports meet. Side A is a user-facing switch port, side B is the core switch port. For each mode pair, decide whether a trunk actually forms with the factory defaults.</p>',
 q:'<p>Drag each mode pair into the right bucket.</p>',
 al:'DRAG INTO BUCKETS',
 buckets:['Trunk forms','No trunk'],
 items:[
  {h:'dynamic desirable ↔ dynamic auto', plain:'desirable to auto', b:0},
  {h:'dynamic desirable ↔ dynamic desirable', plain:'desirable to desirable', b:0},
  {h:'trunk (mode on) ↔ dynamic auto', plain:'on to auto', b:0},
  {h:'dynamic auto ↔ dynamic auto', plain:'auto to auto', b:1},
  {h:'access ↔ dynamic desirable', plain:'access to desirable', b:1}
 ],
 hint:'Desirable asks loudly, auto only answers, on never asks, access never accepts.',
 at:'Forms: desirable-auto, desirable-desirable, on-auto. No trunk: auto-auto, access-desirable.',
 ex:'<p>Dynamic desirable actively offers a trunk, dynamic auto only accepts an offer — so desirable-auto forms a trunk and auto-auto never does. Mode on always trunks and accepts the auto answer. An access port refuses negotiation no matter how loudly the other side asks, which is why the access-desirable pair stays access.</p>'},

{t:'fill', th:'vlan', short:'Router-on-a-stick',
 k:['inter-VLAN routing','router-on-a-stick','subinterface','802.1Q tagging','trunk port'],
 sc:'<p>A branch site routes between VLAN 10 and VLAN 20 through one router interface because no Layer 3 switch is available yet.</p>',
 q:'<p>Complete the description of the router-on-a-stick setup.</p>',
 al:'TYPE INTO THE BLANKS',
 parts:['With a router-on-a-stick, one physical router interface is divided into logical ', {a:['subinterfaces','sub-interfaces','sub interface']}, ', one per VLAN. Each one is configured with the command encapsulation ', {a:['dot1q','802.1q','802.1Q']}, ' followed by the VLAN number. The switch port facing the router must be a ', {a:['trunk','trunk port']}, ', because frames of several VLANs share that one link.'],
 bank:['subinterfaces','SVIs','dot1q','802.3af','trunk','access','native','port-channel'],
 hint:'One cable, many VLANs: what does the router need on each VLAN, and what must the switch port become?',
 at:'subinterfaces · dot1q · trunk',
 ex:'<p>The router splits its physical port into subinterfaces, one per VLAN, and each subinterface tags with encapsulation dot1q plus the VLAN number. The switch side must be a trunk, since frames from many VLANs share the cable. SVIs would be the switch-based alternative; 802.3af is PoE and has nothing to do with routing.</p>'},
{t:'qcm', multi:false, th:'vlan', short:'SVI vs router-on-a-stick',
 k:['inter-VLAN routing','SVI','Layer 3 switch','router-on-a-stick'],
 sc:'<p>A branch office owns a Layer 3 switch. Today inter-VLAN traffic leaves the switch to a small router and comes back over a single 1 Gbps link that saturates at busy hours.</p>',
 q:'<p>What is the main benefit of replacing router-on-a-stick with SVIs on the Layer 3 switch?</p>',
 al:'CHOOSE ONE',
 ch:[
  {h:'SVIs remove the need for VLANs on the switch entirely', plain:'SVIs remove VLANs', ok:false},
  {h:'SVIs route inside the switch instead of over one router link', plain:'Routing inside the switch', ok:true},
  {h:'SVIs encrypt all traffic between VLANs automatically', plain:'SVIs encrypt inter-VLAN traffic', ok:false},
  {h:'Router subinterfaces cannot route between VLANs at all', plain:'Subinterfaces cannot route', ok:false}
 ],
 hint:'Where does the traffic physically travel today — and could it stay inside one box?',
 at:'SVIs route between VLANs in hardware inside the Layer 3 switch, removing the single router link from the path.',
 ex:'<p>An SVI is a virtual routed interface for one VLAN, living on the Layer 3 switch itself. Traffic between two SVIs is routed by the switch ASIC at line rate, so the one-cable router path disappears. SVIs do not remove VLANs and do not encrypt anything; router subinterfaces do route — just across one shared link.</p>'},

 sample:'Switch(config)# vlan 20\nSwitch(config-vlan)# name SALES\nSwitch(config-vlan)# exit\nSwitch(config)# interface fastethernet 0/5\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan 20',

{t:'fill', th:'vlan', short:'Read the trunk table',
 k:['trunk port','native VLAN','allowed VLAN list','802.1Q tagging'],
 sc:'<p>You are verifying a freshly built trunk pair before signing the change ticket. Read the artifact like a Kibana box: type into the filter to find the rows you need.</p>',

 al:'TYPE INTO THE BLANKS',
 art:{label:'show interfaces trunk', lines:[
 'Port        Mode    Encapsulation  Status    Native vlan',
 'Gi1/0/1     on      802.1q         trunking  99',
 'Gi1/0/2     auto    n-802.1q       trunking  1',

 'Gi1/0/1     10,20,30,99',
 'Gi1/0/2     10,20,99',
 'Port        Vlans allowed and active in the management domain',

 'Gi1/0/2     10,20,99',
 'Port        Vlans in spanning tree forwarding state and not pruned',
 'Gi1/0/1     10,20,99',
 'Gi1/0/2     10,20,99'
 ]},

 bank:['99','1','allowed','blocked','exist','untagged','tagged','shutdown'],

 at:'99 · allowed · exist · untagged',
 ex:'<p>The trunk table answers three questions at once: the native VLAN column (99 on Gi1/0/1), what the trunk may carry (allowed list) and what actually exists locally (active list). VLAN 30 is allowed but not active because this switch has no VLAN 30. Native-VLAN frames travel untagged, so both ends must agree on the number.</p>'},

{t:'spot', multi:false, th:'intf', short:'Find the duplex mismatch',
 k:['duplex mismatch','autonegotiation','late collisions','speed','duplex'],
 sc:'<p>Ticket: PC-07 loses the network for a second several times an hour. Port counters show rising late collisions. The PC NIC is set to auto-negotiate. The port config is on the panel.</p>',
 q:'<p>The switch port is forced while the PC negotiates. Click the ONE line that causes the duplex mismatch.</p>',
 al:'CLICK THE FAULTY LINE',
 lines:['interface GigabitEthernet1/0/7',' description USER-PC-07',' switchport mode access',' switchport access vlan 10',' speed 100',' duplex full',' spanning-tree portfast'],
 wrong:[5],
 hint:'One line hard-codes a value the other side can no longer negotiate.',
 at:'duplex full — the port is forced while the PC is on auto, so the PC settles at 100/half. Fix: duplex auto (or force the PC too).',
 ex:'<p>Forcing duplex on one side while the other negotiates is the textbook duplex mismatch: the auto side falls back to half, late collisions pile up there and CRC errors pile up on the forced side. Setting duplex auto lets both ends agree. The remaining lines are a normal, healthy user-port recipe.</p>'},

{t:'fill', th:'intf', short:'Autonegotiation rules',
 k:['autonegotiation','speed','duplex','duplex mismatch'],
 sc:'<p>You are writing the cabling wiki page about autonegotiation and need the exact rule set for the fallback behaviour.</p>',
 q:'<p>Complete the wiki sentences.</p>',
 al:'TYPE INTO THE BLANKS',
 parts:['When both ends are set to auto, autonegotiation picks the highest common ', {a:['speed']}, ' first, then the best common ', {a:['duplex']}, '. If one end is forced to 100/full and the other end stays on auto, the auto side falls back to ', {a:['half']}, ' duplex — and the link runs mismatched until someone fixes it.'],
 bank:['speed','duplex','half','full','auto','mtu'],
 hint:'Two things are negotiated in order, and the forced-vs-auto case ends in the worse duplex.',
 at:'speed · duplex · half',
 ex:'<p>Autonegotiation first agrees on the highest speed both sides can do, then on duplex. A forced end never negotiates, so the auto end cannot see it properly and settles on half duplex. That half-vs-full combination is the classic duplex mismatch behind CRC errors and late collisions.</p>'},

{t:'qcm', multi:false, th:'intf', short:'PoE budget math',
 k:['PoE power budget','PoE+ 802.3at','PoE 802.3af'],
 sc:'<p>You deploy onto a switch with a 370 W PoE budget: 4 × 802.3at cameras at 30 W each, 8 × 802.3af phones at 15.4 W each, and 2 × Wi-Fi 6 APs at 25 W each.</p>',
 q:'<p>Does the deployment fit the budget?</p>',
 al:'CHOOSE ONE',
 ch:[
  {h:'No — the two APs alone would force an 802.3bt upgrade first', plain:'No: APs need 802.3bt', ok:false},
  {h:'Yes — the worst-case draw is 293.2 W, about 77 W under budget', plain:'Yes: 293.2 W under 370 W', ok:true},
  {h:'No — 14 devices at the PoE+ 30 W rate need 420 W, over budget', plain:'No: 14 × 30 W = 420 W', ok:false},
  {h:'Yes — but only while the eight phones stay unplugged', plain:'Yes, without the phones', ok:false}
 ],

 at:'Yes — 293.2 W total draw against a 370 W budget leaves roughly 77 W spare.',

{t:'match', th:'intf', short:'PoE standards',
 k:['PoE 802.3af','PoE+ 802.3at','PoE++ 802.3bt','PoE power budget'],
 sc:'<p>A procurement officer asks you to translate the PoE alphabet on three quotes before signing the purchase order.</p>',
 q:'<p>Match each PoE term to what it guarantees.</p>',
 al:'MATCH PAIRS',
 pairs:[
  {l:'802.3af (PoE)', r:'Up to 15.4 W per port'},
  {l:'802.3at (PoE+)', r:'Up to 30 W per port'},
  {l:'802.3bt (PoE++)', r:'Up to about 60-90 W per port'},
  {l:'PoE power budget', r:'Total watts the switch can deliver across all ports'}
 ],
 hint:'The letters grow with the watts: af, at, bt.',
 at:'af ≈ 15.4 W, at ≈ 30 W, bt ≈ 60-90 W per port; the budget is the switch-wide total.',
 ex:'<p>The standards climb in power: 802.3af gives up to 15.4 W, 802.3at (PoE+) doubles that to 30 W, and 802.3bt (PoE++) reaches 60-90 W for things like pan-tilt cameras or big APs. The power budget is not per port — it is the total the switch can hand out at one time.</p>'},

{t:'fill', th:'stp', short:'Why STP exists',
 k:['STP 802.1D','broadcast storm','blocked port','redundant links'],
 sc:'<p>Onboarding day one: a new hire asks why the switches deliberately switch off working ports, and what disaster the protocol prevents.</p>',
 q:'<p>Complete the whiteboard explanation.</p>',
 al:'TYPE INTO THE BLANKS',
 parts:['Without STP, one redundant link creates a layer 2 loop: broadcast frames circulate forever and a ', {a:['broadcast','layer 2']}, ' storm can melt the network in seconds. STP prevents this by putting selected ports in a ', {a:['blocking','discarding']}, ' state, so frames stop there. The blocked path stays ready as a ', {a:['backup','redundant','standby']}, ' link and takes over if the main path fails.'],
 bank:['broadcast','blocking','backup','unicast','forwarding','root'],
 hint:'Ethernet has no hop counter — what happens to a broadcast that loops forever?',
 at:'broadcast storm · blocking · backup',
 ex:'<p>Ethernet frames have no TTL, so a layer 2 loop multiplies broadcast frames until every link is saturated — a broadcast storm. STP breaks the loop by keeping some ports in blocking state. The blocked path is not wasted: it is the backup route that starts forwarding if the active path dies.</p>'},

{t:'cat', th:'stp', short:'Root election math',
 k:['root bridge','bridge priority','convergence'],
 sc:'<p>The current root bridge runs priority 8192. A switch refresh gives you five candidate switches with the priorities below. The lowest bridge priority always wins; ties fall to the lowest MAC address.</p>',
 q:'<p>Drag each switch into the right bucket for an election against the 8192 root.</p>',
 al:'DRAG INTO BUCKETS',
 buckets:['Wins the election (beats 8192)','Loses the election'],
 items:[
  {h:'SW-A — priority 4096', plain:'SW-A 4096', b:0},
  {h:'SW-B — priority 6144', plain:'SW-B 6144', b:0},
  {h:'SW-C — priority 16384', plain:'SW-C 16384', b:1},
  {h:'SW-D — priority 32768 (default)', plain:'SW-D 32768 default', b:1},
  {h:'SW-E — priority 61440', plain:'SW-E 61440', b:1}
 ],
 hint:'Lower is better. Which numbers are below 8192?',
 at:'SW-A (4096) and SW-B (6144) beat 8192; SW-C, SW-D and SW-E lose.',
 ex:'<p>The root bridge election is a beauty contest on numbers: the lowest bridge priority wins, and only if priorities tie does the lowest MAC address decide. 4096 and 6144 are lower than the current 8192, so those switches would take over; everything at 16384 or above never wins while the 8192 root lives.</p>'},

{t:'match', th:'stp', short:'STP port roles',
 k:['root port','designated port','blocked port','root bridge'],
 sc:'<p>You are annotating an STP diagram for the network documentation set. The four labels need one-line definitions that survive review.</p>',
 q:'<p>Match each STP role to its definition.</p>',
 al:'MATCH PAIRS',
 pairs:[
  {l:'Root port', r:'On a non-root switch: the port with the best path to the root'},
  {l:'Designated port', r:'The port that forwards on each link or segment'},
  {l:'Blocked port', r:'A port that forwards nothing, breaking the loop'},
  {l:'Root bridge', r:'The switch with the best bridge ID; all its ports are designated'}
 ],
 hint:'One role is a whole switch, three are ports. Which port leads home, which one leads the segment?',
 at:'Root port = best path to root. Designated = forwarding port of a segment. Blocked = loop breaker. Root bridge = best bridge ID, all ports designated.',
 ex:'<p>Every non-root switch picks exactly one root port — its cheapest road to the root. On every link, one end is designated and forwards. Any port that would create a loop goes into blocking. The root bridge is the reference point of the whole topology, so every one of its ports is designated.</p>'},

{t:'order', th:'stp', short:'STP port states',
 k:['port states','convergence','STP 802.1D'],
 sc:'<p>A port on the new trunk just came alive. The trainee watches it pass through the classic 802.1D states and asks you to name them in order.</p>',
 q:'<p>Order the four classic STP port states from first to last.</p>',
 al:'DRAG TO ORDER',
 items:[
  {h:'Blocking — listens to BPDUs only, forwards nothing', plain:'Blocking'},
  {h:'Listening — processes BPDUs, still forwards nothing', plain:'Listening'},
  {h:'Learning — builds the MAC table, still forwards nothing', plain:'Learning'},
  {h:'Forwarding — sends and receives user traffic', plain:'Forwarding'}
 ],
 hint:'B-L-L-F: the port first hears, then listens, then learns addresses, then works.',
 at:'Blocking → Listening → Learning → Forwarding.',
 ex:'<p>The classic 802.1D sequence is blocking, listening, learning, forwarding — about 30 to 50 seconds in total. The port first stays safe and silent, then joins the topology conversation, then fills its MAC table, and only then carries user traffic. RSTP later replaced the middle steps with its faster handshake.</p>'},

{t:'multi', th:'stp', short:'Root path costs',
 k:['path cost','root port','root bridge','convergence'],
 sc:'<p>SW1 is root (priority 4096). SW3 has a direct 1 Gbps link to SW1 (cost 4). SW3 also reaches SW1 through SW2: 100 Mbps link SW3-SW2 (cost 19) plus a 10 Gbps link SW2-SW1 (cost 2).</p>',
 q:'<p>Select every statement that is true.</p>',
 al:'SELECT ALL THAT APPLY',
 ch:[
  {h:'The root port of SW3 is the direct 1 Gbps link, because cost 4 beats 21', plain:'SW3 root port = direct 1 Gbps link', ok:true},

'use strict';
/* ================= Exam engine (shared by both severity files) ================= */
var CFG = { topic:'network-plus', pass:70, dur:window.EXAM_CFG.dur, durmin:window.EXAM_CFG.durmin,
            sev:window.EXAM_CFG.sev, sevtxt:window.EXAM_CFG.sevtxt };
var THEMES = [
  {id:'vlan', n:'VLANs & Trunking'},
  {id:'intf', n:'Interface Configuration'},
  {id:'stp',  n:'Spanning Tree'},
  {id:'mtu',  n:'MTU & Frames'}
];
var PT = 10; /* points per exercise */
var USER = '';
var S = null;
var TICK = null;

function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/^ | $/g,''); }
function fmtT(sec){ var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function curIdx(){ return S.ord[S.cur]; }
function curEx(){ return EX[curIdx()]; }

/* ================= exam lifecycle ================= */
function startExam(){
  var n = EX.length;
  S = { ord: shuffle(EX.map(function(_,i){return i;})), cur:0,
        sav:{}, res:{}, skipped:{}, hint:{}, disp:{},
        tleft:CFG.dur, tick:null, manP:false, chkP:false, done:false, reported:false };
  S.ord.forEach(function(i){
    var e = EX[i]; var d = { };
    if(e.t==='qcm' || e.t==='multi'){ d.ch = shuffle(e.ch.map(function(_,k){return k;})); }
    if(e.t==='order'){ d.ord = shuffle(e.items.map(function(_,k){return k;})); }
    if(e.t==='match'){ d.l = shuffle(e.pairs.map(function(_,k){return k;})); d.r = shuffle(e.pairs.map(function(_,k){return k;})); }
    if(e.t==='cat'){ d.it = shuffle(e.items.map(function(_,k){return k;})); }
    if(e.t==='fill'){ d.bank = shuffle(e.bank.slice()); }
    S.disp[i] = d;
    S.sav[i] = blankAns(e);
  });
  updScore(); renderNav(); show(0);
  if(!TICK){ TICK = setInterval(tick, 1000); }
  updTimer();
}
function blankAns(e){
  var v = {};
  if(e.t==='qcm'){ v.sel = null; }
  if(e.t==='multi'){ v.sel = []; }
  if(e.t==='order'){ v.ord = null; }
  if(e.t==='match'){ v.map = {}; v.selL = null; }
  if(e.t==='cat'){ v.put = {}; v.selI = null; }
  if(e.t==='fill'){ v.txt = []; }
  if(e.t==='spot'){ v.lines = {}; }
  if(e.t==='term'){ v.acc = {}; v.hist = []; }
  if(e.t==='branch'){ v.step = 0; v.chosen = []; }
  return v;
}

/* ================= timer ================= */
function tick(){
  if(!S || S.done) return;
  if(S.manP || S.chkP) return;
  S.tleft--;
  if(S.tleft<=0){ S.tleft=0; updTimer(); finishExam(true); return; }
  updTimer();
}
function updTimer(){
  var t = $('tleft'); if(!t || !S) return;
  t.textContent = fmtT(S.tleft);
  $('timerChip').classList.toggle('urgent', S.tleft <= Math.round(CFG.dur*0.1));
  $('pauseBtn').disabled = S.done || !$('view').querySelector('.qwrap');
}
function setManP(on){
  S.manP = on;
  $('pauseBtn').textContent = on ? '▶ Resume' : '⏸ Pause';
  $('pauseBtn').setAttribute('aria-pressed', on ? 'true':'false');
  applyPause(); updBanner();
}
function setChkP(on){ S.chkP = on; applyPause(); updBanner(); }
function applyPause(){
  var w = $('view').querySelector('.qwrap'); if(!w) return;
  var old = $('view').querySelector('.veil'); if(old) old.remove();
  if(S.manP){
    var v = el('div','veil');
    v.innerHTML = '<div class="vi" aria-hidden="true">⏸</div><div class="vt">Paused (manual)</div>'+
      '<div class="vs">The exercise is hidden so it cannot be studied. Press Resume to continue.</div>';
    w.appendChild(v);
  }
}
function updBanner(){
  var b = $('pauseBanner');
  var parts = [];
  if(S.manP) parts.push('<span class="bman">Paused (manual) — exercise hidden</span>');
  if(S.chkP) parts.push('<span class="bchk">Timer paused — review mode</span>');
  if(!S.manP && !S.chkP){ b.classList.add('hide'); b.innerHTML=''; return; }
  b.classList.remove('hide');
  b.innerHTML = '⏱ Timer frozen: ' + parts.join(' + ');
}

/* ================= navigation ================= */
function show(i){
  if(S.done) return;
  /* Leaving the reviewed exercise by any route (Next, Prev, Skip, navigator) ends its
     Check-pause. In-place review actions (re-Check, reading the explanation) never resume
     the timer — only moving off the checked exercise does. This keeps review time free
     without letting one Check freeze the clock for the rest of the exam. */
  if(S.chkP) setChkP(false);
  S.cur = Math.max(0, Math.min(EX.length-1, i));
  renderQ(); renderNav(); updBar();
  var vw = $('view'); if(vw && vw.firstElementChild) vw.firstElementChild.scrollIntoView({block:'nearest'});
}
function next(){
  if(S.chkP) setChkP(false);
  if(S.cur >= EX.length-1){ confirmFinish(false); return; }
  show(S.cur+1);
}
function prev(){ show(S.cur-1); }
function doSkip(){
  if(S.done) return;
  var i = curIdx();
  S.skipped[i] = 1;
  if(!S.res[i]) S.res[i] = {sk:1, earned:0};
  if(S.chkP) setChkP(false);
  if(S.cur >= EX.length-1){ confirmFinish(false); return; }
  show(S.cur+1);
}
function doHint(){
  if(S.done) return;
  var i = curIdx(), e = curEx();
  if(S.hint[i] || S.res[i]) return;
  S.hint[i] = 1;
  var hb = $('view').querySelector('.hintarea');
  if(hb){ hb.innerHTML = '<div class="hintbox"><span class="ht">HINT (−10% of this exercise)</span><br>'+e.hint+'</div>'; }
  var btn = $('view').querySelector('.hintBtn'); if(btn) btn.disabled = true;
}
function doRevise(){
  if(S.done) return;
  var i = curIdx();
  delete S.res[i];
  setChkP(false);
  renderQ(); renderNav(); updScore();
}
function doCheck(){
  if(S.done) return;
  var i = curIdx(), e = curEx(), v = S.sav[i];
  var g = grade(e, v, i);
  g.yourAns = ansText(e, v);
  S.res[i] = g;
  if(S.skipped[i]) delete S.skipped[i];
  setChkP(true);
  updScore(); renderQ(); renderNav();
}
function updScore(){
  if(!S) return;
  var sum = 0;
  Object.keys(S.res).forEach(function(k){
    var r = S.res[k];
    if(r && !r.sk) sum += r.earned;
  });
  $('scoreVal').textContent = (Math.round(sum*10)/10).toString();
}
function updBar(){
  if(!S) return;
  $('pfill').style.width = (((S.cur+1)/EX.length)*100).toFixed(1) + '%';
}
function renderNav(){
  var g = $('navgrid'); if(!g) return;
  g.innerHTML = '';
  if(!S) return;
  S.ord.forEach(function(exIdx, pos){
    var b = el('button','nbtn'); b.type='button';
    b.textContent = pos+1;
    var r = S.res[exIdx];
    if(S.skipped[exIdx]) b.classList.add('skip');
    else if(r && !r.sk) b.classList.add('ok');
    else if(r && r.sk) b.classList.add('skip');
    else if(hasDraft(exIdx)) b.classList.add('draft');
    if(pos===S.cur) b.classList.add('cur');
    b.setAttribute('aria-label','Exercise '+(pos+1)+(S.skipped[exIdx]?' (skipped)':(r&&!r.sk?' (checked)':'')));
    b.onclick = function(){ if(!S.done) show(pos); };
    g.appendChild(b);
  });
}
function hasDraft(i){
  var v = S.sav[i], e = EX[i]; if(!v) return false;
  if(e.t==='qcm') return v.sel!=null;
  if(e.t==='multi') return v.sel.length>0;
  if(e.t==='order') return v.ord && v.ord.join()!==S.disp[i].ord.join();
  if(e.t==='match') return Object.keys(v.map).length>0;
  if(e.t==='cat') return Object.keys(v.put).length>0;
  if(e.t==='fill') return v.txt.some(function(x){return x;});
  if(e.t==='spot') return Object.keys(v.lines).length>0;
  if(e.t==='term') return Object.keys(v.acc).length>0;
  if(e.t==='branch') return v.chosen.length>0;
  return false;
}

/* ================= grading ================= */
function grade(e, v, exIdx){
  var m = {}, pts = 0, n, c, k;
  if(e.t==='qcm'){
    var okIdx = e.ch.map(function(c2,ci){return c2.ok?ci:-1;}).filter(function(x){return x>=0;});
    if(v.sel!=null && e.ch[v.sel].ok){ pts = PT; m['c'+v.sel] = 1; }
    else {
      if(v.sel!=null) m['c'+v.sel] = 2;
      okIdx.forEach(function(oi){ if(v.sel!==oi) m['c'+oi] = 3; });
    }
  } else if(e.t==='multi'){
    n = e.ch.filter(function(c2){return c2.ok;}).length; c = 0;
    e.ch.forEach(function(c2,ci){
      var s = v.sel.indexOf(ci)>=0;
      if(c2.ok && s){ c++; m['c'+ci]=1; }
      else if(c2.ok && !s){ m['c'+ci]=3; }
      else if(!c2.ok && s){ m['c'+ci]=2; }
    });
    pts = PT*c/n;
  } else if(e.t==='order'){
    n = e.items.length; c = 0;
    v.ord.forEach(function(oi,pos){ if(oi===pos){c++; m['o'+pos]=1;} else m['o'+pos]=2; });
    pts = PT*c/n;
  } else if(e.t==='match'){
    n = e.pairs.length; c = 0;
    e.pairs.forEach(function(p,li){
      var g2 = v.map[li];
      if(g2!=null && e.pairs[g2].r===p.r){ c++; m['m'+li]=1; }
      else if(g2==null){ m['m'+li]=3; }
      else m['m'+li]=2;
    });
    pts = PT*c/n;
  } else if(e.t==='cat'){
    n = e.items.length; c = 0;
    e.items.forEach(function(it,ii){
      var b = v.put[ii];
      if(b===it.b){ c++; m['k'+ii]=1; }
      else if(b==null){ m['k'+ii]=3; }
      else m['k'+ii]=2;
    });
    pts = PT*c/n;
  } else if(e.t==='fill'){
    var blanks = e.parts.filter(function(p){return p && p.a;});
    n = blanks.length; c = 0; k = 0;
    e.parts.forEach(function(p){
      if(p && p.a){
        var val = norm(v.txt[k]);
        if(p.a.some(function(a){return norm(a)===val;})){ c++; m['f'+k]=1; } else m['f'+k]=2;
        k++;
      }
    });
    pts = PT*c/n;
  } else if(e.t==='spot'){
    n = e.wrong.length; c = 0;
    e.lines.forEach(function(_,li){
      var isW = e.wrong.indexOf(li)>=0, isC = v.lines[li];
      if(isW && isC){ c++; m['s'+li]=1; }
      else if(isW && !isC){ m['s'+li]=3; }
      else if(!isW && isC){ m['s'+li]=2; }
    });
    pts = PT*c/n;
  } else if(e.t==='term'){
    n = e.acc.length; c = 0;
    e.acc.forEach(function(a,ai){ if(v.acc[ai]){ c++; m['t'+ai]=1; } else m['t'+ai]=3; });
    pts = PT*c/n;
  } else if(e.t==='branch'){
    n = e.steps.length; c = 0;
    e.steps.forEach(function(st,si){
      var ch = v.chosen[si];
      if(ch==null || ch<0){ m['b'+si]=3; }
      else if(st.ch[ch].ok){ c++; m['b'+si]=1; }
      else m['b'+si]=2;
    });
    pts = PT*c/n;
  }
  if(S.hint[exIdx]) pts = pts*0.9;
  pts = Math.round(pts*10)/10;
  var lab = (pts>=PT-0.001) ? 'full' : (pts<=0.001 ? 'zero' : 'partial');
  return {earned:pts, marks:m, lab:lab};
}
/* ================= answer summaries for the report ================= */
function ansText(e, v){
  function chList(arr){ return arr.map(function(ci){ return e.ch[ci].plain || e.ch[ci].h.replace(/<[^>]+>/g,''); }).join(' | '); }
  if(e.t==='qcm') return v.sel==null ? '(nothing chosen)' : (e.ch[v.sel].plain || e.ch[v.sel].h.replace(/<[^>]+>/g,''));
  if(e.t==='multi') return v.sel.length ? 'Selected: '+chList(v.sel) : '(nothing selected)';
  if(e.t==='order') return v.ord ? 'Order: '+v.ord.map(function(oi,pos){return (pos+1)+') '+e.items[oi].plain;}).join('  ') : '(untouched)';
  if(e.t==='match') return e.pairs.map(function(p,li){ var g=v.map[li]; return p.l+' → '+(g==null?'—':e.pairs[g].r); }).join('  ·  ');
  if(e.t==='cat') return e.buckets.map(function(b,bi){
      var its = e.items.map(function(it,ii){return {it:it,ii:ii};}).filter(function(x){return v.put[x.ii]===bi;});
      return b+': '+(its.length?its.map(function(x){return x.it.plain;}).join(', '):'(empty)');
    }).join('  ·  ');
  if(e.t==='fill'){ var out=[],k=0; e.parts.forEach(function(p){ if(p&&p.a){ out.push('"'+(v.txt[k]||'—')+'"'); k++; } }); return 'Filled: '+out.join(', '); }
  if(e.t==='spot'){ var ls=Object.keys(v.lines).map(Number); return ls.length? 'Clicked lines: '+ls.sort(function(a,b){return a-b;}).join(', ') : '(nothing clicked)'; }
  if(e.t==='term'){ var acc=e.acc.filter(function(a,ai){return v.acc[ai];}).map(function(a){return a.d;}); return acc.length? 'Accepted: '+acc.join(' ; ') : '(no accepted command yet)'; }
  if(e.t==='branch'){ return e.steps.map(function(st,si){ var c=v.chosen[si]; return 'Step '+(si+1)+': '+(c==null||c<0?'(no choice)':st.ch[c].plain); }).join('  ·  '); }
  return '';
}

/* ================= log/config viewer ================= */
function viewer(a){
  var box = el('div','logv');
  var bar = el('div','logvb');
  bar.appendChild(el('span','lt','ARTIFACT — '+a.label));
  var inp = el('input','filter'); inp.type='search'; inp.placeholder='Filter lines (like a Kibana/Splunk search box)…';
  inp.setAttribute('aria-label','Filter artifact lines');
  bar.appendChild(inp);
  box.appendChild(bar);
  var lns = el('div','lns');
  var rows = a.lines.map(function(t,li){
    var r = el('div','ln');
    r.appendChild(el('span','lnum', String(li+1)));
    var tx = el('span','ltx'); tx.textContent = t;
    r.appendChild(tx);
    lns.appendChild(r);
    return r;
  });
  inp.addEventListener('input', function(){
    var q = inp.value.toLowerCase();
    rows.forEach(function(r,li){
      var txt = a.lines[li].toLowerCase();
      r.style.display = (!q || txt.indexOf(q)>=0) ? '' : 'none';
      var tx = r.querySelector('.ltx');
      if(q){ tx.innerHTML = escHtml(a.lines[li]).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); }
      else tx.textContent = a.lines[li];
    });
  });
  box.appendChild(lns);
  return box;
}
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function markOf(cls, word){ return '<span class="stat">'+(cls==='m-ok'?'✓ ':cls==='m-bad'?'✗ ':'! ')+word+'</span>'; }

/* ================= question view ================= */
function renderQ(){
  if(!S) return;
  var view = $('view');
  view.innerHTML = '';

  /* scenario card */

  c1.appendChild(el('div',null,e.sc));

  w.appendChild(c2);

  /* answers card */
  var c3 = el('div','card blk-answers');
  c3.appendChild(el('div','tag a', e.al + ' <small>· exercise '+(S.cur+1)+' of '+EX.length+' · '+(e.multi===false?'single answer · '+(PT)+' pts':'partial credit · up to '+PT+' pts')+'</small>'));
  var box = el('div','ansbox');
  c3.appendChild(box);
  var hintarea = el('div','hintarea');
  c3.appendChild(hintarea);
  if(S.hint[i]) hintarea.innerHTML = '<div class="hintbox"><span class="ht">HINT (−10% of this exercise)</span><br>'+e.hint+'</div>';
  w.appendChild(c3);

  /* type renderer */
  if(e.t==='qcm') rQCM(e,v,i,ro,r,box,d);
  else if(e.t==='multi') rQCM(e,v,i,ro,r,box,d);
  else if(e.t==='order') rOrder(e,v,i,ro,r,box,d);
  else if(e.t==='match') rMatch(e,v,i,ro,r,box,d);
  else if(e.t==='cat') rCat(e,v,i,ro,r,box,d);
  else if(e.t==='fill') rFill(e,v,i,ro,r,box,d);
  else if(e.t==='spot') rSpot(e,v,i,ro,r,box,d);
  else if(e.t==='term') rTerm(e,v,i,ro,r,box,d);
  else if(e.t==='branch') rBranch(e,v,i,ro,r,box,d);

  /* feedback */
  if(r && !r.sk){
    var fb = el('div','fb');
    var cls = r.lab==='full'?'good':(r.lab==='zero'?'zero':'part');
    var pct = Math.round((r.earned/PT)*100);
    var labTxt = r.lab==='full'?'FULL':(r.lab==='zero'?'ZERO':'PARTIAL');
    fb.innerHTML = '<div class="fscore '+cls+'">You earned '+r.earned+' / '+PT+' pts ('+pct+'%)<span class="flabel '+r.lab+'">'+labTxt+'</span></div>';
    if(S.hint[i]) fb.innerHTML += '<div style="color:var(--am);font-size:13px;margin-top:2px">Includes −10% hint cost.</div>';
    var xp = el('div','expl','<div class="xt">EXPLANATION — WHY</div>'+e.ex);
    fb.appendChild(xp);
    c3.appendChild(fb);
  }

  /* button bar */
  var bar = el('div','btnrow');
  var bPrev = el('button','btn ghost','← Prev'); bPrev.type='button'; bPrev.disabled = (S.cur===0); bPrev.onclick = prev;
  var bCheck = el('button','btn primary','✓ Check'); bCheck.type='button'; bCheck.id='checkBtn'; bCheck.onclick = doCheck;
  var bSkip = el('button','btn warn','↷ Skip'); bSkip.type='button'; bSkip.id='skipBtn'; bSkip.onclick = doSkip;
  var bHint = el('button','btn ghost hintBtn','💡 Hint (−10%)'); bHint.type='button'; bHint.disabled = !!S.hint[i] || !!r; bHint.onclick = doHint;
  var bRev = el('button','btn ghost','✎ Revise'); bRev.type='button'; bRev.classList.add('revBtn');
  bRev.disabled = !r; bRev.onclick = doRevise;
  var bNext = el('button','btn green', S.cur>=EX.length-1 ? 'Finish ✔' : 'Next →'); bNext.type='button'; bNext.id='nextBtn'; bNext.onclick = next;
  var bFin = el('button','btn danger','Submit exam'); bFin.type='button'; bFin.onclick = function(){ confirmFinish(false); };
  bar.appendChild(bPrev); bar.appendChild(bCheck); bar.appendChild(bSkip); bar.appendChild(bHint); bar.appendChild(bRev);
  bar.appendChild(el('span','spacer'));
  bar.appendChild(bNext); bar.appendChild(bFin);
  w.appendChild(bar);
  view.appendChild(w);
  applyPause(); updTimer();
}
/* ================= type renderers ================= */
function markClass(r, key){
  if(!r || !r.marks || !r.marks[key]) return '';
  var mk = r.marks[key];
  return mk===1 ? ' m-ok' : mk===2 ? ' m-bad' : ' m-miss';
}
function markWord(mk){ return mk===1 ? ['✓ CORRECT'] : mk===2 ? ['✗ WRONG'] : ['! MISSED']; }

function rQCM(e,v,i,ro,r,box,d){
  var isMulti = e.t==='multi';
  var wrap = el('div','opts');
  d.ch.forEach(function(ci,pos){
    var c = e.ch[ci];
    var sel = isMulti ? (v.sel.indexOf(ci)>=0) : (v.sel===ci);
    var b = el('button','opt'+(sel?' sel':'')+markClass(r,'c'+ci));
    b.type='button';
    b.setAttribute('aria-pressed', sel?'true':'false');
    var stat='';
    if(r && r.marks['c'+ci]){ var mk=r.marks['c'+ci]; stat = mk===1?'<span class="stat">✓ CORRECT</span>':mk===2?'<span class="stat">✗ WRONG</span>':'<span class="stat">! MISSED</span>'; }
    b.innerHTML = '<span class="key">'+String.fromCharCode(65+pos)+'</span><span class="txt">'+c.h+'</span>'+stat;
    b.onclick = function(){
      if(ro) return;
      if(isMulti){
        var p = v.sel.indexOf(ci);
        if(p>=0) v.sel.splice(p,1); else v.sel.push(ci);
        b.classList.toggle('sel'); b.setAttribute('aria-pressed', b.classList.contains('sel')?'true':'false');
      } else {
        v.sel = ci;
        Array.prototype.forEach.call(wrap.children,function(x){x.classList.remove('sel');x.setAttribute('aria-pressed','false');});
        b.classList.add('sel'); b.setAttribute('aria-pressed','true');
      }
    };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  if(isMulti) box.appendChild(el('div','kwline','Select every statement that is true. Partial credit: each correct selection earns its share.'));
}

function rOrder(e,v,i,ro,r,box,d){
  if(!v.ord) v.ord = d.ord.slice();
  var list = el('div');
  var dragPos = -1;
  function paint(){
    list.innerHTML='';
    v.ord.forEach(function(oi,pos){
      var row = el('div','ordrow'+markClass(r,'o'+pos));
      if(r && r.marks['o'+pos]){
        var mk=r.marks['o'+pos];
        row.title = mk===1?'Correct position':mk===2?'Wrong position':'Not placed';
      }
      row.setAttribute('draggable', ro?'false':'true');
      row.appendChild(el('span','num', String(pos+1)));
      row.appendChild(el('span','otxt', e.items[oi].h));
      var up = el('button','mv','▲'); up.type='button'; up.setAttribute('aria-label','Move item '+(pos+1)+' up'); up.disabled=ro;
      up.onclick = function(){ if(pos===0) return; var t=v.ord[pos-1]; v.ord[pos-1]=v.ord[pos]; v.ord[pos]=t; paint(); };
      var dn = el('button','mv','▼'); dn.type='button'; dn.setAttribute('aria-label','Move item '+(pos+1)+' down'); dn.disabled=ro;
      dn.onclick = function(){ if(pos>=v.ord.length-1) return; var t=v.ord[pos+1]; v.ord[pos+1]=v.ord[pos]; v.ord[pos]=t; paint(); };
      row.appendChild(up); row.appendChild(dn);
      row.addEventListener('dragstart', function(ev){ dragPos=pos; try{ev.dataTransfer.setData('text/plain',String(pos));}catch(x){} row.classList.add('drag'); });
      row.addEventListener('dragend', function(){ row.classList.remove('drag'); });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', function(){ row.classList.remove('dragover'); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault(); row.classList.remove('dragover');
        if(ro || dragPos<0) return;
        var moved = v.ord.splice(dragPos,1)[0];
        v.ord.splice(pos,0,moved);
        dragPos=-1; paint();
      });
      list.appendChild(row);
    });
  }
  paint();
  box.appendChild(list);
  box.appendChild(el('div','kwline','Drag rows (or use ▲▼) to put the steps in the right order.'));
}

function rMatch(e,v,i,ro,r,box,d){
  var cols = el('div','cols');
  var lc = el('div','col'), rc = el('div','col');
  lc.appendChild(el('div','colh','Item')); rc.appendChild(el('div','colh','Match'));
  var selL = null;
  function paint(){
    lc.innerHTML=''; rc.innerHTML='';
    lc.appendChild(el('div','colh','Item'));
    rc.appendChild(el('div','colh','Match'));
    d.l.forEach(function(li){
      var p = e.pairs[li];
      var mapped = v.map[li];
      var b = el('button','pill'+(selL===li?' sel':'')+markClass(r,'m'+li));
      b.type='button';
      b.innerHTML = p.l + (mapped!=null?'<span class="pair">→ '+e.pairs[mapped].r+'</span>':'') + (r&&r.marks['m'+li]?(r.marks['m'+li]===1?'<span class="pair">✓</span>':r.marks['m'+li]===2?'<span class="pair">✗</span>':'<span class="pair">! missed</span>'):'');
      b.onclick=function(){
        if(ro) return;
        if(v.map[li]!=null){ delete v.map[li]; selL=null; paint(); return; }
        selL = (selL===li)? null : li; paint();
      };
      lc.appendChild(b);
    });
    d.r.forEach(function(ri){
      var p = e.pairs[ri];
      var usedBy = e.pairs.map(function(q,li){return v.map[li]===ri?li:null;}).filter(function(x){return x!=null;});
      var b = el('button','pill'+(usedBy.length?' sel':''));
      b.type='button';
      b.innerHTML = p.r + (usedBy.length?'<span class="pair">← '+e.pairs[usedBy[0]].l+'</span>':'');
      b.onclick=function(){
        if(ro) return;
        if(selL==null) return;
        v.map[selL]=ri; selL=null; paint();
      };
      rc.appendChild(b);
    });
  }
  paint();
  cols.appendChild(lc); cols.appendChild(rc);
  box.appendChild(cols);
  box.appendChild(el('div','kwline','Click an item on the left, then its match on the right. Click a paired item again to unpair.'));
}

function rCat(e,v,i,ro,r,box,d){
  var pool = el('div','pool');
  var buckets = el('div','cols');
  var selI = null;
  var bEls = [];
  e.buckets.forEach(function(bn,bi){
    var bcol = el('div','col');
    var bzone = el('div','bucket');
    bzone.appendChild(el('h4',null,bn));
    var zoneInner = el('div','bz');
    bzone.appendChild(zoneInner);
    bzone.addEventListener('dragover', function(ev){ ev.preventDefault(); bzone.classList.add('over'); });
    bzone.addEventListener('dragleave', function(){ bzone.classList.remove('over'); });
    bzone.addEventListener('drop', function(ev){ ev.preventDefault(); bzone.classList.remove('over'); if(selI!=null && !ro){ v.put[selI]=bi; selI=null; paint(); } });
    bzone.addEventListener('click', function(){ if(selI!=null && !ro){ v.put[selI]=bi; selI=null; paint(); } });
    bcol.appendChild(bzone);
    buckets.appendChild(bcol);
    bEls.push({zone:bzone, inner:zoneInner});
  });
  function paint(){
    bEls.forEach(function(be){ be.inner.innerHTML=''; });
    pool.innerHTML='';
    d.it.forEach(function(ii){
      var it = e.items[ii];
      var placed = v.put[ii];
      var b = el('button','itm'+(selI===ii?' sel':'')+markClass(r,'k'+ii));
      b.type='button';
      b.innerHTML = it.h;
      if(r && r.marks['k'+ii]){ var mk=r.marks['k'+ii]; b.title = mk===1?'Correct bucket':mk===2?'Wrong bucket':'Not placed'; }
      b.setAttribute('draggable', ro?'false':'true');
      b.addEventListener('dragstart', function(ev){ selI=ii; try{ev.dataTransfer.setData('text/plain',String(ii));}catch(x){} });
      b.onclick = function(){
        if(ro) return;
        if(v.put[ii]!=null){ delete v.put[ii]; selI=null; paint(); return; }
        selI = (selI===ii)? null : ii; paint();
      };
      if(placed==null) pool.appendChild(b);
      else bEls[placed].inner.appendChild(b);
    });
  }
  paint();
  box.appendChild(pool);
  box.appendChild(el('div','colh','Drop zones'));
  box.appendChild(buckets);
  box.appendChild(el('div','kwline','Drag each chip into the right bucket — or click a chip, then click a bucket. Click a placed chip to pull it back.'));
}

function rFill(e,v,i,ro,r,box,d){
  var holder = el('div','filltxt');

  e.parts.forEach(function(p){

  box.appendChild(holder);

  bank.appendChild(el('div','colh','Word bank (shuffled — chips are reference only, type into the blanks)'));
  var chips = el('div',null);
  chips.style.cssText='display:flex;flex-wrap:wrap;gap:8px';
  d.bank.forEach(function(w){ chips.appendChild(el('span','bankchip',w)); });
  bank.appendChild(chips);

function rSpot(e,v,i,ro,r,box,d){
  var wrap = el('div','spot');
  e.lines.forEach(function(t,li){
    var b = el('button','spotln'+(!ro && v.lines[li]?' sel':'')+markClass(r,'s'+li));

function rTerm(e,v,i,ro,r,box,d){
  var term = el('div','term');
  var tb = el('div','termb');
  tb.innerHTML = '<span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="tt">'+e.host+' — console</span>';
  term.appendChild(tb);
  var body = el('div','termbody');
  var hist = el('div','hist');
  function paintHist(){
    hist.innerHTML = v.hist.map(function(h){
      if(h.k==='c') return '<div class="hcmd">'+escHtml(h.t)+'</div>';
      if(h.k==='b') return '<div class="hbad">'+escHtml(h.t)+'</div>';
      if(h.k==='g') return '<div class="hok">'+escHtml(h.t)+'</div>';
      return '<div>'+escHtml(h.t)+'</div>';
    }).join('');
    body.scrollTop = body.scrollHeight;
  }
  paintHist();
  var row = el('div','termrow');
  var pr = el('span','pr', e.prompt);
  var inp = el('input','term-in'); inp.type='text'; inp.disabled=ro;
  inp.setAttribute('aria-label','Type a command');
  inp.placeholder = e.placeholder || 'type a command and press Enter';
  row.appendChild(pr); row.appendChild(inp);
  body.appendChild(hist); body.appendChild(row);
  term.appendChild(body);
  box.appendChild(term);
  if(e.guide) box.appendChild(el('div','hintbox','<span class="ht">GUIDE</span><br>'+e.guide));
  if(e.sample){
    var smp = el('pre','cfg'); smp.textContent = e.sample;
    box.appendChild(el('div','kwline','Expected output shape:'));
    box.appendChild(smp);
  }
  function run(){
    if(ro) return;
    var val = inp.value.replace(/^\s+|\s+$/g,'');
    if(!val) return;
    v.hist.push({k:'c', t:e.prompt+' '+val});
    var matched = -1;
    for(var ai=0; ai<e.acc.length; ai++){
      if(v.acc[ai]) continue;
      var ok = e.acc[ai].some(function(re){ try{ return new RegExp(re,'i').test(val); }catch(x){ return false; } });
      if(ok){ matched = ai; break; }
    }
    if(matched>=0){
      v.acc[matched]=1;
      (e.accOut[matched]||[]).forEach(function(line){ v.hist.push({k:'g',t:line}); });
      v.hist.push({k:'g', t:'[accepted '+(Object.keys(v.acc).length)+'/'+e.acc.length+']'});
    } else {
      v.hist.push({k:'b', t:'% Invalid or not needed for this task. Read the goal again.'});
    }
    inp.value='';
    paintHist();
  }
  inp.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); run(); } });
  box.appendChild(el('div','kwline','Type each command and press Enter (Enter acts like Check here). Every accepted command earns its share of the points.'));
  var help = el('button','btn ghost','Run command'); help.type='button'; help.onclick=run; if(ro) help.disabled=true;
  box.appendChild(help);
}

function rBranch(e,v,i,ro,r,box,d){
  var wrap = el('div');
  var total = e.steps.length;
  function paint(){
    wrap.innerHTML='';
    if(ro && r && !r.sk){
      /* post-check review: every decision marked individually */
      var rv = el('div','fb');
      rv.style.margin = '0';
      rv.innerHTML = '<div class="xt">DECISION REVIEW — EVERY CHOICE MARKED</div>';
      e.steps.forEach(function(st,si){
        var mk = r.marks['b'+si];
        var cls = mk===1?'m-ok':mk===2?'m-bad':'m-miss';
        var word = mk===1?'✓ CORRECT':mk===2?'✗ WRONG':'! MISSED';
        var ch = v.chosen[si];
        var line = el('div','brstep '+cls);
        line.innerHTML = '<span class="brstat">'+word+'</span><span class="brq">Decision '+(si+1)+'</span>'+
          '<span class="brc">'+escHtml(ch==null||ch<0?'(no choice made)':st.ch[ch].plain)+'</span>';
        rv.appendChild(line);
      });
      wrap.appendChild(rv);
      wrap.appendChild(el('div','kwline','Press Revise to walk the scenario again, or Next to continue.'));
      return;
    }
    var cur = v.step;
    var prog = el('div','kwline','<b>Decision '+(Math.min(cur+1,total))+' of '+total+'</b> — your choices shape the incident.');
    wrap.appendChild(prog);
    if(cur < total){
      var st = e.steps[cur];
      var q = el('div','fb'); q.style.margin='0 0 10px'; q.innerHTML = st.q;
      wrap.appendChild(q);
      var opts = el('div','opts');
      st.ch.forEach(function(c,ci){
        var chosen = v.chosen[cur]===ci;
        var b = el('button','opt'+(chosen?' sel':''));
        b.type='button';
        b.setAttribute('aria-pressed', chosen?'true':'false');
        b.innerHTML = '<span class="key">'+String.fromCharCode(65+ci)+'</span><span class="txt">'+c.h+'</span>';
        b.onclick = function(){
          if(ro) return;
          v.chosen[cur]=ci;
          paint();
        };
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
      if(v.chosen[cur]!=null){
        var c = st.ch[v.chosen[cur]];
        var outc = el('div','fb'); outc.style.marginTop='10px';
        outc.innerHTML = '<div class="fscore '+(c.ok?'good':'zero')+'">'+(c.ok?'✓ Good call':'✗ That choice has consequences')+'</div><div>'+c.out+'</div>';
        wrap.appendChild(outc);
        var cont = el('button','btn primary'); cont.type='button';
        cont.textContent = cur===total-1 ? 'Finish scenario →' : 'Continue →';
        /* last step advances to the complete state so the button never dead-ends */
        cont.onclick = function(){ if(v.step<total-1){ v.step++; } else { v.step = total; } paint(); };
        wrap.appendChild(el('div','btnrow',null)).appendChild(cont);
      }
    } else {
      var done = el('div','fb');
      done.innerHTML = '<div class="fscore part">Scenario complete — press Check to score all '+total+' decisions.</div>';
      wrap.appendChild(done);
    }
  }
  paint();
  box.appendChild(wrap);
}
/* ================= intro ================= */
function kwPanel(){
  var KWS = {
    vlan:['VLAN','802.1Q tagging','native VLAN','access port','trunk port','voice VLAN','VLAN hopping (double tagging)','DTP','switchport nonegotiate','allowed VLAN list','inter-VLAN routing','router-on-a-stick','subinterface','SVI','Layer 3 switch'],
    intf:['speed','duplex','autonegotiation','duplex mismatch','late collisions','CRC errors','PoE 802.3af','PoE+ 802.3at','PoE++ 802.3bt','PoE power budget','switchport mode','err-disabled'],
    stp:['STP 802.1D','RSTP 802.1w','MSTP 802.1s','PVST+','root bridge','bridge priority','root port','designated port','alternate port','backup port','blocked port','path cost','BPDU','port states','PortFast','BPDU guard','root guard','TCN','CAM / MAC table','convergence'],
    mtu:['MTU','1500 bytes','jumbo frames (9000)','fragmentation','DF bit','PMTUD','MTU mismatch','black hole','runts','giants']
  };
  var box = el('div','themebox');
  box.appendChild(el('h3',null,'Keywords covered in this exam — every keyword is exercised at least once'));
  Object.keys(KWS).forEach(function(tid){
    var th = THEMES.filter(function(t){return t.id===tid;})[0];
    var h = el('div',null,'<b style="color:var(--cy)">'+th.n+':</b>');
    var ul = el('ul');
    KWS[tid].forEach(function(k){ ul.appendChild(el('span','kwchip',k)); });
    box.appendChild(h); box.appendChild(ul);
  });
  return box;
}

    '<div class="sevchip">'+CFG.sev+'</div>'+

    '<p class="lead">CompTIA Network+ (N10-009) · Objective 2.2 · VLANs, interface configuration, spanning tree, MTU and jumbo frames.'+(USER?' · Welcome, <b>'+escHtml(USER)+'</b>':'')+'</p>'+
    '<div class="factrow">'+
      '<div class="fact"><div class="fv">'+EX.length+'</div><div class="fk">exercises, all '+CFG.sev+' severity</div></div>'+
      '<div class="fact"><div class="fv">70%</div><div class="fk">pass mark</div></div>'+
      '<div class="fact"><div class="fv">'+CFG.durmin+' min</div><div class="fk">exam timer</div></div>'+

    '<div class="rules">'+
      '<div class="rule"><b>Check</b>Press Check to score an exercise. Each part is marked on its own: green = correct, red = wrong, amber = missed. Checking automatically starts a review pause: the timer freezes but everything stays visible, and the timer only resumes when you press Next.</div>'+

      '<div class="rule"><b>Partial credit</b>Multi-answer exercises (multi-select, drag &amp; drop, matching, ordering, fill-in-the-blank, multi-command terminal, branching) are scored per correct element. Wrong selections never subtract.</div>'+
    '</div>'+
    '<div class="rules">'+
      '<div class="rule"><b>Exercise types</b>Single-choice and multi-select questions · matching pairs · drag-to-bucket sorting · timeline ordering &amp; ranking · fill-in-the-blank with a shuffled word bank · spot-the-mistake config review · a Kibana-style log/config viewer with filter · a terminal emulator where you type real commands · branching incident scenarios with consequences per choice.</div>'+
    '</div>';

  var start = el('button','btn primary','Start exam ▶');
  start.type='button'; start.style.cssText='margin-top:14px;min-width:220px;font-size:17px';

/* ================= finish + results ================= */
function confirmFinish(auto){
  if(S.done) return;
  var answered = Object.keys(S.res).filter(function(k){ return S.res[k] && !S.res[k].sk; }).length;
  if(!auto && answered===0){
    modal('Nothing to submit','Every exercise is still skipped or unchecked. Answer at least one exercise (press Check) before submitting. Skipped exercises are excluded from scoring, so a fully skipped exam cannot be recorded.', [{t:'Back to the exam', cls:'btn primary', fn:closeModal}]);
    return;
  }
  var skipped = Object.keys(S.skipped).length;
  var left = EX.length - answered;
  if(!auto){
    modal('Submit this attempt?','Answered and checked: <b>'+answered+'</b> of '+EX.length+'. Not counted (skipped/unchecked): <b>'+left+'</b>. The score is computed over the non-skipped exercises only.',
      [{t:'Keep working', cls:'btn ghost', fn:closeModal},
       {t:'Submit ✔', cls:'btn primary', fn:function(){ closeModal(); finishExam(false); }}]);
  } else {
    finishExam(true);
  }
}
function finishExam(auto){
  if(S.done) return;
  S.done = true;
  closeModal();
  setManP(false); setChkP(false);
  $('pauseBtn').disabled = true;
  resultsScreen(auto);
  reportScore();
}
function resultsScreen(auto){
  var view = $('view'); view.innerHTML='';
  var pos=0, earn=0, answered=0, skippedList=[];
  S.ord.forEach(function(exIdx){
    var r = S.res[exIdx];
    if(r && !r.sk){ pos += PT; earn += r.earned; answered++; }
    else skippedList.push(exIdx);
  });
  var scoreU = pos>0 ? Math.round(earn/10) : 0;
  var percent = pos>0 ? Math.round(scoreU/answered*100) : 0;
  var passed = pos>0 && percent>=CFG.pass;
  S.final = {scoreU:scoreU, answered:answered, percent:percent, passed:passed, earn:earn, pos:pos};

  var w = el('div');
  var hero = el('div','res-hero '+(passed?'pass':'fail'));
  hero.innerHTML =
    '<div class="rstate">'+(passed?'✔ PASS':'✘ FAIL')+'</div>'+
    '<div class="rpct">'+percent+'%</div>'+
    '<div class="rpts">You earned <b>'+scoreU+'</b> of <b>'+answered+'</b> points (partial credit applied, rounded once)'+(auto?' — the timer ran out before you submitted':'')+'.</div>'+
    '<div class="rpts" style="margin-top:6px">Pass mark: '+CFG.pass+'% · Raw exercise points: '+earn+' / '+pos+'.</div>'+
    '<div class="rpts" style="margin-top:6px">'+(passed?'Certificate-style success panel: you mastered this objective at '+CFG.sev+' level.':'You must retake this exam to pass. Review the report below, then press Retake Exam.')+'</div>';
  var rt = el('button','btn primary','Retake Exam ↻');
  rt.type='button'; rt.style.cssText='margin-top:16px;min-width:220px';
  rt.onclick = retake;
  hero.appendChild(rt);
  w.appendChild(hero);

  /* per-theme progress */
  var tb = el('div','card');
  tb.appendChild(el('h2',null,'Progress per theme'));
  var trow = el('div','thmrow');
  THEMES.forEach(function(t){
    var tot=0, done=0;
    S.ord.forEach(function(exIdx){
      if(EX[exIdx].th!==t.id) return;
      tot++;
      var r=S.res[exIdx];
      if(r && !r.sk) done++;
    });
    var tr = el('div','thm');
    tr.innerHTML = '<span class="tn">'+t.n+'</span><span class="tb"><div style="width:'+(tot? (done/tot*100):0)+'%"></div></span><span class="tv">'+done+'/'+tot+'</span>';
    trow.appendChild(tr);
  });
  tb.appendChild(trow);
  w.appendChild(tb);

  /* skipped note */
  if(skippedList.length){
    var sn = el('div','card');
    sn.innerHTML = '<h2>Skipped exercises — excluded from scoring</h2><p style="color:var(--mut);font-size:14.5px;margin:0 0 8px">These were not counted in your score or in the total (neither in the numerator nor in the denominator):</p>';
    var ul = el('ul'); ul.style.cssText='margin:0;padding-left:20px';
    skippedList.forEach(function(exIdx){
      var p = S.ord.indexOf(exIdx);
      ul.appendChild(el('li',null,'Exercise '+(p+1)+' — '+EX[exIdx].short));
    });
    sn.appendChild(ul);
    w.appendChild(sn);
  }

  /* per-exercise report */
  var rp = el('div','card');
  rp.appendChild(el('h2',null,'Detailed report — every exercise'));
  S.ord.forEach(function(exIdx,p){
    var e = EX[exIdx], r = S.res[exIdx];
    var card = el('div','rep');
    var lab = r && !r.sk ? r.lab : 'skipped';
    var pts = r && !r.sk ? (r.earned+' / '+PT+' pts') : '0 pts — not counted';
    card.innerHTML = '<div class="rhead"><span class="rnum">Ex '+(p+1)+'</span><span class="rtitle">'+e.short+'</span><span class="rlab '+lab+'">'+lab.toUpperCase()+' · '+pts+'</span></div>';
    card.innerHTML += '<div class="rline"><b>Your answer:</b> '+(r&&!r.sk? escHtml(r.yourAns):'— skipped —')+'</div>';
    card.innerHTML += '<div class="rline"><b>Correct answer:</b> '+e.at+'</div>';
    card.innerHTML += '<div class="rexpl"><b>Why:</b> '+e.ex+'</div>';
    if(r && r.sk===undefined && !r.sk && S.hint[exIdx]) card.innerHTML += '<div class="rline" style="color:var(--am)">Hint used (−10%).</div>';
    rp.appendChild(card);
  });
  w.appendChild(rp);
  view.appendChild(w);
  window.scrollTo(0,0);
}
function retake(){
  S.reported = false;
  startExam();
  window.scrollTo(0,0);
}
/* ================= website integration ================= */
function reportScore(){
  if(!S || S.reported || S.final.answered===0) return;
  S.reported = true;
  var percent = S.final.percent;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topic,
      score:S.final.scoreU,
      total:S.final.answered,
      percent:percent,
      passed:percent>=CFG.pass
    }, location.origin);
  }catch(e){ /* opened directly, nothing to report to */ }
}
window.addEventListener('message', function(event){
  var d = event.data;
  if(!d) return;
  if(d.type!=='CYBERPULSE_INIT' && d.type!=='CYBERMASTERY_INIT') return;
  USER = d.username || '';
  var h = document.querySelector('.hero .lead');
  if(h && USER){ h.innerHTML = h.innerHTML.replace(/\s*·\s*$/, '') + ' · Welcome, <b>'+escHtml(USER)+'</b>'; }
  /* theme: this file ships dark only, so a light request is ignored by design */
});
/* ================= modal ================= */
function modal(title, bodyHtml, btns){
  var old = document.querySelector('.mod'); if(old) old.remove();
  var m = el('div','mod');
  var c = el('div','modcard');
  c.setAttribute('role','dialog'); c.setAttribute('aria-label',title);
  c.appendChild(el('h2',null,title));
  c.appendChild(el('div',null,bodyHtml));
  var row = el('div','modbtns');
  btns.forEach(function(b){
    var x = el('button', b.cls||'btn', b.t); x.type='button'; x.onclick=b.fn; row.appendChild(x);
  });
  c.appendChild(row);
  m.appendChild(c);
  document.body.appendChild(m);
  row.querySelector('button').focus();
}
function closeModal(){ var m=document.querySelector('.mod'); if(m) m.remove(); }
/* ================= boot ================= */
$('pauseBtn').onclick = function(){ if(!S || S.done) return; setManP(!S.manP); };
buildIntro();




</script>
