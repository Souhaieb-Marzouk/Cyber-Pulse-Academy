var EX = [
{
  id: "M01", theme: "Protocols & ports", type: "match",
  title: "Map each service to its default port",
  kw: ["FTP", "SSH", "Telnet", "SMTP", "DNS", "HTTPS", "RDP", "SIP", "TCP", "UDP"],
  scenario: "<p>You are the help-desk technician on shift. The firewall team opened ticket FW-1102 and asked you for a service list: for each service below, they need the <b>default port and transport</b> it uses, so they can build the rule base.</p>",
  question: "<p>Match every service on the left to its default port and transport on the right. Each item is used once.</p>",
  data: {
    left: ["FTP control channel", "SSH remote admin (also carries SFTP)", "Telnet remote console", "SMTP mail between mail servers", "DNS name lookups (normal queries)", "HTTPS secure web", "RDP remote desktop", "SIP VoIP call setup, cleartext"],
    right: ["TCP 21", "TCP 22", "TCP 23", "TCP 25", "UDP 53", "TCP 443", "TCP 3389", "UDP 5060"]
  },
  hint: "The famous web port is 443 and the famous mail port is 25. RDP ends in 89, and the two VoIP ports here are 5060 (signaling) and 3389 (desktop).",
  explain: "<p><b>Why these pairs:</b> FTP control is TCP 21 (the data channel is TCP 20). SSH and SFTP share TCP 22 because SFTP runs <i>inside</i> SSH. Telnet is TCP 23 and sends everything in cleartext. SMTP between servers is TCP 25. Normal DNS lookups ride UDP 53 (zone transfers and large answers use TCP 53). HTTPS is TLS-protected HTTP on TCP 443. RDP listens on TCP 3389. Cleartext SIP signaling uses UDP or TCP 5060.</p><div class='note'><b>If you missed this:</b> memorize the port as part of the protocol's name: 'SMTP 25', 'HTTPS 443'. Say them together every time.</div>"
},
{

{

  title: "Why does the DNS zone transfer use TCP?",
  kw: ["DNS", "TCP 53", "UDP 53", "zone transfer", "AXFR"],
  scenario: "<p>dns01 syncs a large zone file to a new secondary server. Monitoring shows the first attempt going out over UDP 53 fail, then a successful retry over TCP 53. Both attempts used port 53.</p>",
  question: "<p>Why does a zone transfer use TCP?</p>",
  data: {
    choices: [
      "TCP 53 always arrives faster because it opens a session first",
      "Zone data can be large; TCP handles big, ordered, re-sent transfers",
      "UDP 53 cannot carry queries, only notifications and mail",
      "TCP 53 exists only as a backup path when a firewall blocks UDP"
    ],
    correct: [1]
  },
  hint: "Compare the size of a name lookup answer with the size of a whole zone file.",
  explain: "<p><b>Correct: zone data is large.</b> A whole zone can be thousands of records. UDP answers were capped at 512 bytes in classic DNS, so big transfers must be segmented, ordered and re-sent reliably &mdash; exactly what TCP gives you. Normal single-name queries are small and fast, so they stay on UDP 53; only large responses and zone transfers (AXFR/IXFR) fall back to TCP.</p><div class='note'><b>If you missed this:</b> remember the DNS rule: UDP 53 for normal queries, TCP 53 for zone transfers and oversized answers. And TCP 53 traffic should only ever flow between approved DNS servers.</div>"
},

  title: "Branching: the site that only works by IP",
  kw: ["DNS", "UDP 53", "nslookup", "troubleshooting", "A record"],
  scenario: "<p>Help-desk ticket HD-5521: users can open the internal site by typing its IP address, but not by typing its name. Nothing else on the floor is affected. You take the call.</p>",
  question: "<p>Choose the best next step at every stage of the workflow.</p>",
  data: {
    steps: [
      { q: "Users reach the site by IP but not by name. What do you check first?",
        choices: [
          { t: "Resolve the name with nslookup/dig and compare the answer to the working IP", good: true, note: "When IP works but names fail, name resolution is the suspect." },
          { t: "Replace the user's network cable", good: false, note: "IP traffic already works, so the link and cable are fine." },
          { t: "Restart the web server", good: false, note: "The server answers on its IP &mdash; restarting it cannot fix name lookup." }
        ] },
      { q: "nslookup shows the correct name pointing at an old, wrong IP. Where is the fault?",

          { t: "A stale A record on the DNS server", good: true, note: "The name-to-IP mapping is wrong; fix the record." },
          { t: "The web server's TLS certificate", good: false, note: "Certificates matter for HTTPS trust, not for name-to-IP mapping." },
          { t: "The client's ARP cache", good: false, note: "ARP maps IP-to-MAC on the local segment. The wrong mapping here is name-to-IP." }
        ] },

  explain: "<p><b>The reasoning path:</b> IP reachability proves layers 1&ndash;4 are fine, so start where the two paths differ: DNS. A stale A record is the classic cause after a server move. The fix is confirmed when the lookup (UDP 53) returns the new IP and the browser reaches the site by name. DHCP, ARP, cables and certificates never touch name-to-IP mapping.</p><div class='note'><b>If you missed this:</b> split every 'works by IP, not by name' case into two halves &mdash; transport (proven) and resolution (suspect) &mdash; and test the resolution half with nslookup/dig.</div>"

function buildChoice(ex, r){
  var d = ex.data, multi = ex.type === 'multi';
  var order = shuf(d.choices.map(function(_, i){ return i; }));
  var sel = [], btns = [];
  var root = el('div');
  root.setAttribute('role', 'group');
  root.setAttribute('aria-label', multi ? 'Select all that apply' : 'Choose one answer');
  order.forEach(function(ci){
    var b = el('button', 'opt' + (multi ? ' multi' : ''), '<span class="box" aria-hidden="true"></span><span>' + d.choices[ci] + '</span><span class="mark" aria-hidden="true"></span>');
    b.addEventListener('click', function(){
      if (r.checked) return;
      r.touched = true;
      if (multi){ var k = sel.indexOf(ci); if (k >= 0) sel.splice(k, 1); else sel.push(ci); }
      else { sel = [ci]; }
      draw();
    });
    btns[ci] = b; root.appendChild(b);
  });
  function draw(){ btns.forEach(function(b, i){ b.classList.toggle('sel', sel.indexOf(i) >= 0); }); }
  function marks(){
    btns.forEach(function(b, i){
      var m = b.querySelector('.mark'); m.innerHTML = '';
      b.classList.remove('ok', 'bad', 'miss');
      var isSel = sel.indexOf(i) >= 0, isCor = d.correct.indexOf(i) >= 0;
      if (isSel && isCor){ b.classList.add('ok'); m.innerHTML = '&#10003; correct'; }
      else if (isSel && !isCor){ b.classList.add('bad'); m.innerHTML = '&#10007; wrong'; }
      else if (!isSel && isCor){ b.classList.add('miss'); m.innerHTML = multi ? '&#9888; missed' : '&#9679; correct'; }
    });
  }
  return {
    root: root,
    max: multi ? d.correct.length : 1,
    get: function(){ return sel.slice(); },
    set: function(a){ sel = (a || []).slice(); draw(); },
    grade: function(){
      marks();
      if (multi){ var e = 0; d.correct.forEach(function(ci){ if (sel.indexOf(ci) >= 0) e++; }); return { earned: e, max: d.correct.length }; }
      return { earned: (sel.length === 1 && d.correct.indexOf(sel[0]) >= 0) ? 1 : 0, max: 1 };
    },
    lock: function(){ btns.forEach(function(b){ b.disabled = true; }); },
    unlock: function(){ btns.forEach(function(b){ b.disabled = false; }); }
  };

function buildFlow(ex, r){
  var d = ex.data;
  var chosen = d.steps.map(function(){ return -1; }); /* stores ORIGINAL choice indices */
  var perms = d.steps.map(function(st){ return shuf(st.choices.map(function(_, i){ return i; })); }); /* display->original remap */
  var body = el('div');
  var root = el('div'); root.appendChild(body);
  function firstOpen(){ for (var i = 0; i < d.steps.length; i++){ if (chosen[i] < 0) return i; } return -1; }
  function render(){
    body.innerHTML = '';
    var upto = firstOpen() === -1 ? d.steps.length - 1 : firstOpen();
    var visible = [];
    for (var x = 0; x <= upto; x++){ visible.push(x); }
    /* forEach gives each iteration its own step index (a plain for-loop var would be
       captured by reference in the click handlers and register answers on the wrong step) */
    visible.forEach(function(i){
      var st = d.steps[i], perm = perms[i];
      var c = el('div', 'alert', '<div class="am"><b>Step ' + (i + 1) + ' of ' + d.steps.length + '.</b> ' + st.q + '</div>');
      perm.forEach(function(orig, di){
        var ch = st.choices[orig];
        var picked = chosen[i] === orig;
        var doneStep = chosen[i] >= 0;
        var cls = 'opt' + (doneStep ? (picked ? (ch.good ? ' ok' : ' bad') : (ch.good ? ' miss' : '')) : '');
        var mk = doneStep ? (picked ? (ch.good ? '&#10003; your pick' : '&#10007; wrong') : (ch.good ? '&#9888; better' : '')) : '';
        var b = el('button', cls, '<span class="box" aria-hidden="true"></span><span>' + ch.t + '</span><span class="mark" aria-hidden="true">' + mk + '</span>');
        b.addEventListener('click', function(){
          if (r.checked || chosen[i] >= 0) return;
          chosen[i] = orig; r.touched = true; render();
        });
        c.appendChild(b);
      });
      if (done(i)) c.appendChild(el('div', 'note', (st.choices[chosen[i]].good ? '&#10003; ' : '&#10007; ') + st.choices[chosen[i]].note));
      body.appendChild(c);
    });
    if (firstOpen() === -1) body.appendChild(el('div', 'note', 'All steps answered. Press Check to lock in your score.'));
    else body.appendChild(el('div', 'note', 'Answer step ' + (firstOpen() + 1) + ' to unlock the next step.'));
  }
  function done(i){ return chosen[i] >= 0; }
  render();
  return {
    root: root, max: d.steps.length,
    get: function(){ return { choices: chosen.slice() }; },
    set: function(a){ if (a && a.choices){ a.choices.forEach(function(v, i){ chosen[i] = v; }); } render(); },
    done: function(){ return firstOpen() === -1; },
    grade: function(){ render(); var e = 0; d.steps.forEach(function(st, i){ if (chosen[i] >= 0 && st.choices[chosen[i]].good) e++; }); return { earned: e, max: d.steps.length }; },
    lock: function(){}, unlock: function(){ chosen = d.steps.map(function(){ return -1; }); render(); }
  };
}

var BUILDERS = { mcq: buildChoice, multi: buildChoice, match: buildMatch, cat: buildCat, order: buildOrder, blank: buildBlank, term: buildTerm, log: buildLog, spot: buildSpot, triage: buildTriage, flow: buildFlow };

/* ---------------- exercise rendering ---------------- */
function buildIf(ei){
  var r = S.R[ei], ex = EX[ei];
  if (r.card) return;
  var card = el('div', 'card');
  card.appendChild(el('div', 'kwrow', ex.kw.map(function(k){ return '<span class="kwc">' + k + '</span>'; }).join('')));
  card.appendChild(el('div', 'blk scn', '<span class="lbl">Scenario</span>' + ex.scenario));
  card.appendChild(el('div', 'blk q', '<span class="lbl">' + (ex.qlbl || 'Question') + '</span>' + ex.question));
  var ans = el('div', 'blk ans');
  ans.appendChild(el('div', '', '<span class="lbl">' + ANSLBL[ex.type] + '</span>'));
  r.api = BUILDERS[ex.type](ex, r);
  ans.appendChild(r.api.root);
  r.hintEl = el('div'); ans.appendChild(r.hintEl);
  card.appendChild(ans);
  var fb = el('div', 'blk fb'); fb.hidden = true;
  card.appendChild(fb);
  r.card = card; r.fb = fb;
  fb.setAttribute('aria-live', 'polite');
  r.hintEl.setAttribute('role', 'status');
  if (r.checked){ r.api.set(r.sel); r.api.grade(); if (r.api.lock) r.api.lock(); }
}
function updateFooter(){
  var ei = S.order[S.idx], r = S.R[ei];
  $('#hintBtn').disabled = r.hint || r.checked;
  $('#reviseBtn').hidden = !r.checked;
  $('#prevBtn').disabled = S.idx === 0;
  $('#skipBtn').disabled = r.checked || r.everChecked;
}
function isEmptyAnswer(v){
  if (v == null) return true;
  if (typeof v === 'string') return v.replace(/\s+/g, '') === '';
  if (Array.isArray(v)) return v.every(function(x){ return x == null || x < 0; });
  if (typeof v === 'object' && v.choices) return v.choices.every(function(x){ return x == null || x < 0; });
  return v < 0;
}
function show(pos){
  var ei = S.order[pos], r = S.R[ei];
  buildIf(ei);
  var st = $('#stage'); st.innerHTML = ''; st.appendChild(r.card);
  updateFooter();
  drawNav(); drawBar(); drawThemes(); drawScore();
}
function goto(pos){
  if (pos < 0 || pos >= EX.length) return;
  S.idx = pos;
  S.checkPause = false; /* leaving the review of a checked exercise resumes the clock */
  drawPause();
  show(pos);
  window.scrollTo({ top: 0 });
}

/* ---------------- check / hint / skip / revise ---------------- */
function doCheck(){
  var ei = S.order[S.idx], r = S.R[ei], ex = EX[ei];
  if (!r.api) return;
  if (r.api.done && !r.api.done()){ flashMsg('Answer every step before pressing Check.'); return; }
  if (isEmptyAnswer(r.api.get())){ flashMsg('Select or type at least one answer before pressing Check.'); return; }
  r.checked = true; r.skipped = false; r.touched = true; r.everChecked = true;
  var g = r.api.grade();
  r.max = g.max;
  r.earned = Math.max(0, g.earned - (r.hint ? 0.1 * g.max : 0));
  r.sel = r.api.get();
  if (r.api.lock) r.api.lock();
  S.checkPause = true; /* review mode: clock frozen, content visible; only Next resumes */
  var ratio = g.max ? r.earned / g.max : 0;
  var badge = ratio >= 0.999 ? '<span class="badge full">&#10003; Full credit</span>' : ratio > 0 ? '<span class="badge part">&#9888; Partial credit</span>' : '<span class="badge zero">&#10007; No credit</span>';
  r.fb.hidden = false;
  r.fb.innerHTML = '<div class="fbline">' + badge + '<span class="pts">You earned ' + (Math.round(r.earned * 100) / 100) + ' / ' + g.max + ' points on this exercise.' + (r.hint ? ' Hint used: &minus;10% applied.' : '') + '</span></div>' +
    '<div class="fbline"><span class="pts">&#9208; Timer paused &mdash; review mode. Study the feedback, then press <b>Next</b> to resume the timer.</span></div>' +
    ex.explain;
  updateFooter(); drawScore(); drawBar(); drawThemes(); drawNav(); drawPause();
  window.scrollTo({ top: 0 });
}
function doHint(){
  var r = cur(), ex = EX[S.order[S.idx]];
  if (r.hint || r.checked) return;
  r.hint = true; r.touched = true;
  r.hintEl.innerHTML = '<div class="hintnote"><b>Hint (&minus;10% for this exercise):</b> ' + ex.hint + '</div>';
  $('#hintBtn').disabled = true;
}
function doSkip(){
  var r = cur();
  if (r.checked || r.everChecked){ flashMsg('This exercise was already checked, so it counts towards your score. Use Revise to re-answer it, or press Next.'); return; }
  r.skipped = true; r.checked = false; r.earned = 0;
  if (S.idx < EX.length - 1){ goto(S.idx + 1); }
  else { drawNav(); flashMsg('Last exercise &mdash; press Finish (twice) to end the exam.'); }
}
function doRevise(){
  var ei = S.order[S.idx], r = S.R[ei];
  if (!r.checked) return;
  r.checked = false; r.earned = 0;
  r.fb.hidden = true;
  if (r.api.unlock) r.api.unlock();
  if (EX[ei].type === 'flow'){ r.sel = null; r.api.set(null); }
  updateFooter(); drawScore(); drawBar(); drawThemes(); drawNav();
}
function flashMsg(t){
  var r = cur();
  r.fb.hidden = false;
  r.fb.innerHTML = '<div class="fbline"><span class="badge na">&#9888; ' + t + '</span></div>';
}

/* ---------------- finish & results ---------------- */
function scoreCalc(){
  var answered = 0, earned = 0;
  EX.forEach(function(_, i){ var r = S.R[i]; if (r.checked){ answered++; earned += r.max ? r.earned / r.max : 0; } });
  return { answered: answered, earned: earned };
}
function finalScore(){
  var s = scoreCalc();
  var sc = Math.round(s.earned); /* the rounded figure that is shown AND reported */
  var pc = s.answered ? Math.round(sc / s.answered * 100) : 0;
  return { answered: s.answered, exact: s.earned, score: sc, percent: pc, passed: pc >= PASS_MARK };
}
function finish(auto){
  if (S.ended) return;
  if (!auto){
    EX.forEach(function(_, i){
      var r = S.R[i];
      if (!r.checked && !r.skipped && r.touched && r.api){
        var g = r.api.grade();
        r.max = g.max;
        r.earned = Math.max(0, g.earned - (r.hint ? 0.1 * g.max : 0));
        r.checked = true; r.sel = r.api.get();
      }
    });
  }
  if (!auto && scoreCalc().answered === 0){ flashMsg('Answer at least one exercise (press Check) before finishing.'); return; }
  S.ended = true;
  buildResults(auto);
}
function report(){
  if (S.reported) return;
  var f = finalScore();
  if (!f.answered) return;
  try {
    parent.postMessage({ type: 'CYBERPULSE_SCORE', topicId: META.topicId, score: f.score, total: f.answered, percent: f.percent, passed: f.passed }, location.origin);
  } catch (e) { /* opened directly in a browser: nothing to report to */ }
  S.reported = true;
}
function ansTextOf(ex, sel){
  var d = ex.data;
  switch (ex.type){
    case 'mcq': case 'multi': return (sel && sel.length) ? sel.map(function(i){ return d.choices[i]; }).join('; ') : '(nothing chosen)';
    case 'match': return d.left.map(function(L, i){ return L + ' &rarr; ' + (sel && sel[i] >= 0 ? d.right[sel[i]] : '(empty)'); }).join('; ');
    case 'cat': var byB = d.buckets.map(function(){ return []; }); (sel || []).forEach(function(bi, ii){ if (bi >= 0) byB[bi].push(d.items[ii].t); }); return d.buckets.map(function(B, bi){ return B + ': ' + (byB[bi].length ? byB[bi].join(', ') : '(empty)'); }).join(' | ');
    case 'order': return (sel && sel.length) ? sel.map(function(ii){ return d.items[ii]; }).join(' &rarr; ') : '(not sorted)';
    case 'blank': return d.ans.map(function(a, si){ return (sel && sel[si] >= 0) ? d.bank[sel[si]] : '(blank)'; }).join(' | ');
    case 'term': return sel || '(no command run)';
    case 'log': return (sel && sel.length) ? sel.map(function(i){ return d.sub.choices[i]; }).join('; ') : '(nothing chosen)';
    case 'spot': return (typeof sel === 'number' && sel >= 0) ? d.lines[sel] : '(nothing clicked)';
    case 'triage': return d.alerts.map(function(A, ai){ return (sel && sel[ai] >= 0) ? A.choices[sel[ai]] : '(no choice)'; }).join(' | ');
    case 'flow': var c = (sel && sel.choices) ? sel.choices : []; return d.steps.map(function(st, si){ return 'S' + (si + 1) + ': ' + (c[si] >= 0 ? st.choices[c[si]].t : '(no choice)'); }).join(' &rarr; ');
  }
  return '';
}
function correctTextOf(ex){
  var d = ex.data;
  switch (ex.type){
    case 'mcq': case 'multi': return d.correct.map(function(i){ return d.choices[i]; }).join('; ');
    case 'match': return d.left.map(function(L, i){ return L + ' &rarr; ' + d.right[i]; }).join('; ');
    case 'cat': return d.buckets.map(function(B, bi){ return B + ': ' + d.items.filter(function(it){ return it.b === bi; }).map(function(it){ return it.t; }).join(', '); }).join(' | ');
    case 'order': return d.items.map(function(t, i){ return (i + 1) + '. ' + t; }).join(' &rarr; ');
    case 'blank': return d.ans.join(' | ');
    case 'term': return d.example;
    case 'log': return d.sub.correct.map(function(i){ return d.sub.choices[i]; }).join('; ');
    case 'spot': return 'Line ' + (d.bad + 1) + ': ' + d.lines[d.bad];
    case 'triage': return d.alerts.map(function(A, ai){ return 'Alert ' + (ai + 1) + ': ' + A.choices[A.correct]; }).join(' | ');
    case 'flow': return d.steps.map(function(st, si){ var g = st.choices.filter(function(c){ return c.good; })[0]; return 'S' + (si + 1) + ': ' + g.t; }).join(' &rarr; ');
  }
  return '';
}
function buildResults(auto){
  var f = finalScore();
  var pass = f.answered > 0 && f.passed;
  $('#ftr').hidden = true; $('#navgrid').hidden = true; $('#barwrap').hidden = true; $('#pausebox').hidden = true;
  var st = $('#stage'); st.innerHTML = '';
  var hero = el('div', 'res-hero ' + (pass ? 'pass' : 'fail'));
  var exactNote = (Math.abs(f.exact - f.score) > 0.001) ? '<div class="pts">Exact partial-credit total before final rounding: ' + (Math.round(f.exact * 100) / 100) + '</div>' : '';
  hero.innerHTML =
    '<div class="verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '&#127942; PASS' : (auto ? '&#9203; TIME OVER &mdash; FAIL' : '&#10007; FAIL')) + '</div>' +
    '<div class="bigscore">' + f.score + ' <small>/ ' + f.answered + ' points &mdash; ' + f.percent + '%</small></div>' + exactNote +
    '<p class="sub">' + (pass ? 'You reached the ' + PASS_MARK + '% pass mark on this chapter. Well done.' : 'You needed ' + PASS_MARK + '%. Read the report below, then retake the exam.') + '</p>' +
    '<p class="sub">' + f.answered + ' of ' + EX.length + ' exercises counted (skipped and untouched exercises are excluded from both points and maximum).</p>' +
    '<button class="btn pri" id="retakeBtn">&#8635; Retake Exam</button>';
  st.appendChild(hero);
  var exc = [];
  EX.forEach(function(ex, i){ var r = S.R[i]; if (!r.checked) exc.push({ t: ex.title, sk: r.skipped }); });
  if (exc.length){
    var box = el('div', 'rules');
    box.innerHTML = '<h3>&#9193; Excluded from scoring (' + exc.length + ')</h3><p>These exercises were skipped or never answered. Their points are left out of your earned points <b>and</b> out of the maximum, so the percentage only covers what you actually answered.</p><ul>' +
      exc.map(function(o){ return '<li>' + o.t + ' ' + (o.sk ? '<span class="badge skip">&#9193; skipped</span>' : '<span class="badge na">&#8226; not answered</span>') + '</li>'; }).join('') + '</ul>';
    st.appendChild(box);
  }
  st.appendChild(el('div', 'subhead', 'Detailed report &mdash; what you answered and why'));
  S.order.forEach(function(ei, pos){
    var ex = EX[ei], r = S.R[ei];
    var rep = el('div', 'rep');
    var badge, lab;
    if (r.checked){
      var ratio = r.max ? r.earned / r.max : 0;
      badge = ratio >= 0.999 ? '<span class="badge full">&#10003; full</span>' : ratio > 0 ? '<span class="badge part">&#9888; partial</span>' : '<span class="badge zero">&#10007; zero</span>';
      lab = (Math.round(r.earned * 100) / 100) + ' / ' + r.max + ' points';
    } else if (r.skipped){ badge = '<span class="badge skip">&#9193; skipped</span>'; lab = 'excluded from scoring'; }
    else { badge = '<span class="badge na">&#8226; not answered</span>'; lab = 'excluded from scoring'; }
    rep.innerHTML = '<h3>Q' + (pos + 1) + '. ' + ex.title + ' ' + badge + '</h3>' +
      '<div class="ra"><b>Your answer:</b> ' + ansTextOf(ex, r.sel) + '</div>' +
      '<div class="rc"><b>Correct answer:</b> ' + correctTextOf(ex) + '</div>' +
      '<div class="pts">Earned: ' + lab + (r.hint ? ' &middot; hint used (&minus;10%)' : '') + '</div>' +
      ex.explain;
    st.appendChild(rep);
  });
  $('#retakeBtn').addEventListener('click', retake);
  window.scrollTo({ top: 0 });
  report();
}
function retake(){
  initState();
  buildIntro();
}

/* ---------------- intro ---------------- */
function buildIntro(){
  $('#hdr').hidden = true; $('#ftr').hidden = true; $('#navgrid').hidden = true; $('#barwrap').hidden = true; $('#pausebox').hidden = true;
  var st = $('#stage'); st.innerHTML = '';
  var hero = el('div', 'hero');
  hero.innerHTML =
    '<div class="metachips"><span>CompTIA Network+ N10-009</span><span>Chapter 1.4 &mdash; Ports &amp; Protocols</span></div>' +
    '<h1>' + META.title + '</h1>' +
    '<p class="sub">Certification-style practice exam &mdash; severity level: <b>' + String(META.difficulty).toUpperCase() + '</b></p>' +
    '<div class="metachips"><span>' + EX.length + ' exercises</span><span>' + META.estimatedMinutes + ' minute timer</span><span>Pass mark: ' + META.passMark + '%</span><span>&asymp; ' + Math.round(META.estimatedMinutes * 60 / EX.length) + ' seconds per exercise</span></div>';
  st.appendChild(hero);
  var kp = el('div', 'kwpanel');
  kp.innerHTML = '<h3>Keywords covered in this exam</h3>' + KW.map(function(g){
    return '<div class="kwgroup"><h4>' + g.theme + '</h4><div>' + g.kws.map(function(k){ return '<span class="kwc">' + k + '</span>'; }).join('') + '</div></div>';
  }).join('');
  st.appendChild(kp);
  var rules = el('div', 'rules');
  rules.innerHTML = '<h3>How this exam works</h3><ul>' +
    '<li><b>Goal:</b> master the ports, protocols and transport methods of this chapter through realistic, on-the-job scenarios &mdash; alert triage, log review, configs, and incident response, not textbook recall.</li>' +
    '<li><b>Exercise types:</b> matching, drag &amp; drop sorting, ordering, fill-in-the-blank word banks, log viewer with filter, spot-the-mistake configs, alert triage, branching incident response, a simulated terminal, and a small number of multiple-choice questions.</li>' +
    '<li><b>Check</b> validates and locks your answer, marks every element (green = correct, red = wrong, amber = missed), shows an explanation, and starts a <b>review pause</b>: the timer freezes but the exercise stays visible so you can learn. Only <b>Next</b> restarts the clock.</li>' +
    '<li><b>Manual Pause</b> is a separate button: while it is on, the exercise is hidden and blurred, so you cannot study during a manual pause. The two pause reasons stack; the clock only runs when both are off.</li>' +
    '<li><b>Partial credit:</b> multi-answer exercises score per correct element. Extra wrong picks never remove points you already earned. Single-answer exercises are all-or-nothing.</li>' +
    '<li><b>Hint</b> costs 10% of that exercise&rsquo;s points and reveals a nudge, never the answer.</li>' +
    '<li><b>Skip</b> jumps ahead and marks the exercise amber. You can return to skipped exercises any time before the timer ends. Skipped exercises are excluded from scoring on both sides of the fraction.</li>' +
    '<li><b>Finish</b> (press twice) ends the exam early. Exercises you touched but never Checked are scored from your current selections; untouched ones are excluded. At zero on the clock the exam ends automatically.</li>' +
    '<li><b>Retake</b> reshuffles every question and every answer choice, and resets skip flags and partial scores.</li></ul>';
  st.appendChild(rules);
  var start = el('div', 'hero');
  var sb = el('button', 'btn pri', '&#9654; Start Exam');
  sb.style.minWidth = '240px';
  sb.addEventListener('click', begin);
  start.appendChild(sb);
  st.appendChild(start);
  window.scrollTo({ top: 0 });
}
function begin(){
  $('#hdr').hidden = false; $('#ftr').hidden = false; $('#navgrid').hidden = false; $('#barwrap').hidden = false;
  drawTimer();
  show(0);
  startTick();
}

/* ---------------- wiring ---------------- */
$('#prevBtn').addEventListener('click', function(){ goto(S.idx - 1); });
$('#nextBtn').addEventListener('click', function(){
  if (S.idx >= EX.length - 1){ flashMsg('This is the last exercise. Press Finish (twice) to end the exam.'); return; }
  goto(S.idx + 1);
});
$('#checkBtn').addEventListener('click', doCheck);
$('#hintBtn').addEventListener('click', doHint);
$('#skipBtn').addEventListener('click', doSkip);
$('#reviseBtn').addEventListener('click', doRevise);
$('#pauseBtn').addEventListener('click', function(){ S.manualPause = !S.manualPause; drawPause(); });
$('#resumeBtn').addEventListener('click', function(){ S.manualPause = false; drawPause(); });
var armT = null;
$('#finishBtn').addEventListener('click', function(){
  var b = $('#finishBtn');
  if (!b.classList.contains('arm')){
    b.classList.add('arm'); b.innerHTML = 'Press again to finish';
    if (armT) clearTimeout(armT);
    armT = setTimeout(function(){ b.classList.remove('arm'); b.innerHTML = 'Finish'; }, 3000);
    return;
  }
  if (armT) clearTimeout(armT);
  b.classList.remove('arm'); b.innerHTML = 'Finish';
  finish(false);
});
window.addEventListener('message', function(ev){
  var d = ev.data; if (!d) return;
  if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT'){
    if (d.username) $('#who').textContent = 'Candidate: ' + d.username;
    /* theme: this exam ships dark only, so no light theme is applied */
  }
});
initState();
buildIntro();
