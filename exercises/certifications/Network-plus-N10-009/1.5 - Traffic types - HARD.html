{"secsPerQ":66,"themes":[{"name":"Core traffic types","items":["unicast (one-to-one)","multicast (one-to-many subscribers)","anycast (one-to-nearest)","broadcast (one-to-all on the link, directed and limited)"]},{"name":"Addressing & identifiers","items":["IPv4 multicast 224[.]0[.]0[.]0/4 (Class D)","organization-local 239[.]0[.]0[.]0/8","link-local control block 224[.]0[.]0[.]0/24","limited broadcast 255[.]255[.]255[.]255","directed broadcast (last address of a subnet)","multicast MAC 01:00:5E","broadcast MAC FF:FF:FF:FF:FF:FF","IPv6 multicast ff00::/8","ff02::1 all-nodes","ff02::2 all-routers","solicited-node multicast","no broadcast in IPv6"]},{"name":"Protocols & mechanisms","items":["ARP request/reply","DHCP DORA and DHCP relay (ip helper-address)","IGMP join/leave and querier","IGMP snooping","MLD","PIM multicast routing","mDNS 224[.]0[.]0[.]251","LLMNR 224[.]0[.]0[.]252","SSDP 239[.]255[.]255[.]250","NetBIOS browse","Wake-on-LAN","routing hellos: OSPF 224[.]0[.]0[.]5/.6, RIPv2 224[.]0[.]0[.]9, EIGRP 224[.]0[.]0[.]10, HSRP 224[.]0[.]0[.]2, VRRP 224[.]0[.]0[.]18"]},{"name":"Device behavior","items":["switch flooding (broadcast, unknown unicast, unregistered multicast)","CAM table and unknown-unicast flooding","broadcast domain vs collision domain","VLAN segmentation","storm control","broadcast storm","Wi-Fi multicast at basic rate"]},{"name":"Security & operations angle","items":["smurf (and fraggle) amplification","DDoS absorption via anycast/CDN","rogue DHCP and DHCP snooping","ARP-based recon and poisoning"]}],"exercises":[{"id":"H01","type":"logview","theme":"Protocols & mechanisms","title":"IPTV works at HQ, dies at the branch","points":1,"scenario":"The branch IPTV pilot fails. Branch TVs receive nothing, while the same channel works perfectly at HQ. You capture on the branch relay VLAN. The receiver at 10[.]90[.]4[.]55 joined the group properly. The branch relay (10[.]90[.]4[.]10) re-streams the feed it pulls from HQ. Local test TVs attached to the relay VLAN DO play the stream. The WAN link is healthy and PIM is enabled end to end.","question":"Study the capture. Why do branch viewers fail even though local ones succeed?","hint":"Read the TTL field on the relay's outgoing packets. Local viewers succeed with the same group address — so the group range itself is not the problem.","explain":"The relay re-sends the stream with TTL 1. A packet to 239[.]25[.]1[.]1 with TTL 1 is dropped by the very next router, so the feed never leaves the relay VLAN — local TVs (same VLAN) play fine, everything beyond dies. Multicast groups live and die by their TTL/scoping: 1 means 'this link only'. The tempting wrong answer says 239[.]25[.]1[.]1 is link-local — it is not: 239[.]0[.]0[.]0/8 is organization-local and meant to be routed inside your network; it is 224[.]0[.]0[.]x that stays on the link. IGMPv2 is fine for this kind of stream, and nothing here is anycast. Focus on: TTL and administrative scoping decide how far a multicast packet travels — and the obvious 'wrong address' answer was a decoy.","answer":{"options":["The relay streams with TTL 1, so the first router drops it — raise the TTL","The receivers use IGMPv2, which routers ignore — upgrade everyone to IGMPv3","239[.]25[.]1[.]1 is link-local, routers never forward it — move to 224[.]0[.]0[.]x","The stream is anycast and lands on the wrong relay — pin it with static routes"],"correct":0},"artifacts":[{"kind":"log","label":"BRANCH RELAY VLAN — CAPTURE","lines":["10:02:11.402 IP 10[.]90[.]4[.]10.5004 > 239[.]25[.]1[.]1.5004: UDP, length 1316, TTL 1","10:02:11.514 IGMPv2: Membership Report group 239[.]25[.]1[.]1 from 10[.]90[.]4[.]55","10:02:11.688 IP 10[.]90[.]4[.]10.5004 > 239[.]25[.]1[.]1.5004: UDP, length 1316, TTL 1","10:02:12.001 IP 10[.]90[.]4[.]10.5004 > 239[.]25[.]1[.]1.5004: UDP, length 1316, TTL 1","10:02:12.330 PIM: Join prune received on uplink for 239[.]25[.]1[.]1 — outgoing (uplink ok)","10:02:13.114 IP 10[.]90[.]4[.]10.5004 > 239[.]25[.]1[.]1.5004: UDP, length 1316, TTL 1","10:02:13.502 STAT: WAN healthy — HQ source 10[.]10[.]8[.]20 sending to 239[.]25[.]1[.]1 (TTL 64)"]}]},{"id":"H02","type":"qcm","theme":"Core traffic types","title":"Who answers the anycast client?","points":1,"scenario":"Your login service runs in Frankfurt and Singapore. Both data centers announce the same /24 prefix for the service. A client in Mumbai opens a session. The network architect, the app owner and the SRE each claim a different mechanism picked the site. Only one claim is how anycast actually behaves.","question":"What decides which data center answers the client in Mumbai?","hint":"The app does not measure anything, and DNS does not rotate anything. Which component even knows about the two sites?","explain":"Routing decides. Both sites announce the same prefix; BGP selects the best path by its own metrics (shortest AS path, lowest cost — usually the closest healthy site), and the client's packets simply follow that best route. The client measures nothing; DNS does not rotate between sites (anycast is one address, not several); and there is no load balancer splitting sessions 50/50. If Frankfurt withdraws its announcement, Mumbai clients shift to Singapore automatically. Focus on: anycast's 'nearest' is whatever the routing table believes is nearest — per route, not per application.","answer":{"choices":["BGP path selection — best routing metric wins, usually nearest","DNS round-robin — the resolver alternates clients between the two sites","The client measures its latency to both sites and picks the lower one","A load balancer in each city shares the sessions fifty-fifty"],"correct":0}},{"id":"H03","type":"multi","theme":"Device behavior","title":"What still floods with snooping on?","points":1,"scenario":"You hardened the access layer: IGMP snooping is enabled, storm control is set, and the CAM table is warm. A colleague claims 'snooping stops flooding'. Your counter-training session starts with this exact question — and the truth has a subtlety most engineers miss.","question":"With IGMP snooping enabled, which frames STILL flood all ports of the VLAN by default?","hint":"Snooping only constrains groups the switch has actually heard joins for. Two kinds of traffic never learned a door at all.","explain":"Still flooding by default: broadcast frames (snooping is a multicast feature; it does not touch broadcast), unknown unicast (no CAM entry — flood and learn), and multicast for groups with NO snooped receiver — the switch has no map for an unregistered group, so default behavior floods it within the VLAN unless you enable multicast filtering of unregistered groups. Not flooding: multicast for a snooped group goes only to member ports and multicast-router ports; known unicast follows its CAM entry; and frames like CDP/LLDP to the switch CPU never flood to stations. Focus on: 'unregistered multicast floods by default' is the trap — snooping constrains what it knows, nothing else.","answer":{"choices":["Broadcast frames","Unknown unicast frames — the destination MAC is missing from the CAM table","Multicast for groups with no snooped receiver (unregistered groups)","Multicast for a snooped group, to member ports only","Known unicast to a learned MAC address","Frames addressed to the switch CPU such as CDP and LLDP"],"correct":[0,1,2]}},{"id":"H04","type":"dnd","theme":"Device behavior","title":"Sort the facts under the right boundary","points":1,"scenario":"Two new hires keep mixing up 'broadcast domain', 'collision domain' and 'multicast group'. You print eight fact cards from real incidents and turn it into the sorting drill. The cards must land under the boundary (or group) each fact describes.","question":"Drag each fact card under the boundary it belongs to.","hint":"Two boundaries are about UNWANTED delivery to the wrong ears; the third is about WANTED delivery to subscribers.","explain":"Broadcast domain: its edge is the router (routers do not forward broadcast frames), a VLAN is the classic instance, and its members are exactly 'whoever hears a flooding frame'. Collision domain: the shared-wire concept — a hub puts all its ports in one, and a switch port ENDS one per port. Multicast group: joined with an IGMP report, scoped by addresses like 239[.]10[.]4[.]7, and constrained by IGMP snooping on switches. Focus on: routers bound broadcast domains, switch ports bound collision domains, IGMP bounds multicast groups — three different mechanisms, three different boundaries.","answer":{"slots":[{"name":"Broadcast domain"},{"name":"Collision domain"},{"name":"Multicast group"}],"items":[{"t":"A VLAN is the classic edge of one","slot":0},{"t":"A hub puts every connected port into the same one","slot":1},{"t":"Defined by who hears a flooding frame","slot":0},{"t":"Ended by a switch port — one per port","slot":1},{"t":"Joined by sending an IGMP report","slot":2},{"t":"Scoped by addresses like 239[.]10[.]4[.]7","slot":2},{"t":"Switches with IGMP snooping constrain who receives it","slot":2},{"t":"Routers do not forward its frames across it","slot":0}]}},{"id":"H05","type":"branch","theme":"Security & operations","title":"The amplification incident — decide under pressure","points":1,"scenario":"03:12. Monitoring pages you: 800 Mbps of ICMP echo replies are smashing host 10[.]15[.]0[.]10. The replies arrive from hundreds of different IPs inside 172[.]20[.]8[.]0/24 and 172[.]20[.]9[.]0/24 — subnets your routers touch only at their edges. Your decisions shape the response; each choice has a consequence.","question":"Choose your move at each step.","hint":"Step 2 is one legacy router command. Step 4 is the UDP twin of this attack — it has a name.","explain":"Step 1: replies from entire subnets the victim never contacted = smurf attack — echo requests went to those subnets' DIRECTED BROADCAST addresses with a spoofed source, and every host answered the victim at once. Step 2: the single setting that stops your network amplifying is refusing to forward packets to directed broadcasts — modern default 'no ip directed-broadcast'. Step 3: once floods arrive from the ISP, only the upstream can drop the requests toward your broadcast addresses — request provider filtering or sinkholing. Step 4: the UDP-flavored twin of smurf is fraggle — UDP echo (or chargen) to broadcast addresses instead of ICMP. Focus on: directed broadcast forwarding + echo to whole subnets = amplification; modern defaults close it, providers must drop what still arrives.","answer":{"steps":[{"ctx":"800 Mbps of echo replies from hundreds of hosts in two subnets the victim never touched.","prompt":"What is happening?","options":["A smurf attack using directed broadcast addresses","A multicast stream misrouted into the data center","An ARP storm caused by a fresh switching loop","A DNS reflection attack using open DNS resolvers"],"correct":0,"conseq":"The signature is exact: replies from whole subnets, none of them contacted by the victim. That is smurf."},{"ctx":"You own routers that could be used as amplifiers next.","prompt":"Which single setting makes your network useless as a smurf amplifier?","options":["Refuse to forward packets to directed broadcasts","Block all ICMP echo replies from leaving the network","Disable IGMP snooping on all the edge VLANs","Enable proxy ARP on all router interfaces"],"correct":0,"conseq":"With directed-broadcast forwarding off, one packet can no longer become hundreds of replies from your subnets."},{"ctx":"The flood still arrives — the amplifier is someone else's network.","prompt":"What is the right next move?","options":["Ask the provider to sinkhole requests toward your broadcasts","Change the victim's IP address to 255[.]255[.]255[.]255","Shut down every router interface that faces the ISP","Enable directed-broadcast forwarding on the edge to absorb the flood"],"correct":0,"conseq":"Only the provider sits between the attacker and your edge — upstream filtering is the standard containment for reflection and amplification floods."},{"ctx":"The post-incident report must name the sibling attack.","prompt":"Which attack uses the same broadcast-amplification trick with UDP instead of ICMP?","options":["Fraggle","Land","Teardrop","Slowloris"],"correct":0,"conseq":"Fraggle: UDP echo/chargen to broadcast addresses. Same broadcast abuse, different protocol."}]}},{"id":"H06","type":"fib","theme":"Addressing & identifiers","title":"Fill the IPv6 traffic notes","points":1,"scenario":"You are writing the IPv6 section of the network fundamentals handbook. The reviewer has flagged the four blanks that trainees get wrong every single cohort. Precision matters: one wrong word and the whole paragraph teaches the wrong model.","question":"Complete each blank from the word bank.","hint":"One distractor is the routers-only group — the hosts group is its neighbor. Another distractor is the IPv4 protocol this whole paragraph replaces.","explain":"IPv6 removes broadcast completely — nothing in the protocol shouts to 'every host, every network'. All IPv6 multicast lives in ff00::/8, and ff02::/10 is the link-scoped slice of it. Neighbor Discovery asks 'who has this address?' using solicited-node multicast, so only hosts whose address matches the last bits process the question — a much tighter question than ARP's broadcast. Receivers join multicast groups with MLD, the IPv6 replacement for IGMP. Every node on the link listens to ff02::1, the all-nodes group; ff02::2 is the routers-only group (the trap). ARP is the IPv4 mechanism being replaced, anycast is a different one-to-nearest service, and 224[.]0[.]0[.]1 is IPv4's all-hosts group. Focus on: no broadcast does not mean no groups — IPv6 replaced one blunt instrument with several precise ones.","answer":{"text":"Handbook — IPv6 traffic types: IPv6 removes ___ completely. Neighbor Discovery asks 'who has this address?' using ___ multicast instead of a broadcast. Hosts that want multicast streams join groups with ___ instead of IGMP. Every node on the link listens to ___, the all-nodes group.","bank":["broadcast","solicited-node","MLD","ff02::1","ff02::2","ARP","anycast","224[.]0[.]0[.]1"],"blanks":[{"accept":["broadcast"]},{"accept":["solicited-node"]},{"accept":["mld"]},{"accept":["ff02::1"]}]}},{"id":"H07","type":"terminal","theme":"Protocols & mechanisms","title":"Terminal: prove the multicast path, two ways","points":1,"scenario":"The video app for group 239[.]25[.]1[.]1 (UDP port 5004) should be reaching the jump host when the viewer runs. Management wants PROOF, not guesses. Choose your own tools — the output must make both facts visible.\n\nTask 1: capture exactly 5 packets of that group on UDP port 5004 as they arrive, then stop automatically.\nTask 2: show the multicast groups this host's interfaces have currently joined, so 239[.]25[.]1[.]1 appears in the list.\n\nType one command per task below.","question":"Which two commands prove both facts?","hint":"For task 1, one classic capture tool counts packets with a '-c' flag. For task 2, the command word is 'maddr' or the flag '-g' — or read the kernel table directly.","explain":"Task 1 example: tcpdump -i eth0 -c 5 'udp and dst host 239[.]25[.]1[.]1 and dst port 5004' — five packets, then it stops by itself; tshark with -c 5 and the same capture filter is equally correct. Task 2 example: ip maddr show (or netstat -g, or cat /proc/net/igmp) — the joined groups appear per interface, and 239[.]25[.]1[.]1 must be listed. This is the operating proof of multicast membership: the capture shows the data plane, the group list shows the control plane. Focus on: two independent proofs beat one — packets arriving AND membership held.","answer":{"ps":"analyst@soc-lab:~$","tasks":[{"label":"Capture exactly 5 packets of group 239[.]25[.]1[.]1 on UDP port 5004, then stop","accept":["tcpdump\\s+(-i\\s+\\w+\\s+)?-c\\s*5\\s+.*239@25@1@1.*5004['\\\"]?","tcpdump\\s+.*-c\\s*5\\s+.*5004.*239@25@1@1['\\\"]?","tcpdump\\s+(-i\\s+\\w+\\s+)?-c\\s*5\\s+.*5004.*239@25@1@1['\\\"]?","tshark\\s+(-i\\s+\\w+\\s+)?-c\\s*5\\s+.*239@25@1@1.*5004['\\\"]?","tshark\\s+.*-c\\s*5\\s+.*5004.*239@25@1@1['\\\"]?"],"example":"tcpdump -i eth0 -c 5 udp and dst host 239[.]25[.]1[.]1 and dst port 5004"},{"label":"Show the multicast groups the host's interfaces have joined","accept":["ip\\s+(-d\\s+)?maddr(\\s+show)?(\\s+dev\\s+\\w+)?\\s*$","ip\\s+-4\\s+maddr\\s+show\\s*$","netstat\\s+-g(\\s+-n)?\\s*$","cat\\s+/proc/net/igmp\\s*$","cat\\s+/proc/net/igmp6\\s*$"],"example":"ip maddr show"}]}},{"id":"H08","type":"qcm","theme":"Device behavior","title":"IPTV over Wi-Fi: the stutter nobody fixed","points":1,"scenario":"The IPTV pilot expanded to wireless. Wired viewers are perfect. Wi-Fi viewers with full signal bars see constant stutter, and the AP's radio shows the multicast frames being transmitted again and again at a very low rate. The vendor KB mentions 'multicast-to-unicast conversion' as an option.","question":"Why does multicast video struggle over Wi-Fi even with a strong signal?","hint":"Compare how the AP treats one multicast frame versus one unicast frame: speed, and who confirms reception.","explain":"802.11 multicast frames are sent at one of the lowest basic rates (so even the slowest associated station can hear them) and are NOT acknowledged or retransmitted — there is no per-station confirmation, no rate adaptation per listener, and collisions or interference simply lose frames. Unicast frames, by contrast, are ACKed, retried and sent at each receiver's best rate. That combination makes multicast over the air slow and lossy — exactly the stutter seen here. Many vendors therefore offer multicast-to-unicast conversion at the AP, translating each group frame into individually ACKed unicast copies. Beacons are a different broadcast frame with its own job, and encryption overhead is identical for both frame types. Focus on: wireless multicast trades reliability for reach — video hates that trade.","answer":{"choices":["Multicast frames go at a basic rate and are never ACKed, so they drop","Wi-Fi chips cannot join multicast groups; they need wired IGMP only","Beacon frames from the AP keep colliding with the video frames","Multicast frames carry much heavier encryption overhead than unicast"],"correct":0}},{"id":"H09","type":"triage","theme":"Security & operations","title":"Overnight queue: five verdicts","points":1,"scenario":"You inherit the overnight SOC queue. Five alerts, and the on-call checklist says: judge each one on what the traffic type tells you — expected, contained, or hostile. Mislabeling any of them costs the team either an outage or a breach.","question":"Choose the correct verdict action for each alert.","hint":"One alert is someone doing their job well. Two abuse the broadcast domain. One is a routing protocol knocking on the wrong door. One is a multicast control-plane flapping.","explain":"A1: packets to 255[.]255[.]255[.]255 from outside are pure noise — routers must never forward the limited broadcast, so rate-limit and drop at the edge. A2: EIGRP updates to 224[.]0[.]0[.]10 from an unknown access port can poison routes — quarantine the port; a rogue routing adjacency is a hostile act even if 'just multicast'. A3: anycast root DNS answered in under 5 ms from many sites — that is the anycast design working; expected, no action. A4: IGMP leave/join flapping forces the stream to start and stop repeatedly — investigate the client and the snooping state, not 'normal'. A5: one MAC answering who-has for random IPs is ARP scanning/poisoning recon — isolate and check dynamic ARP inspection. Focus on: the traffic type names the failure mode — broadcast abuse, rogue routing adjacency, healthy anycast, control-plane flapping, ARP recon.","answer":{"alerts":[{"name":"A1 — Flood to the limited broadcast","desc":"Thousands of packets per second to 255[.]255[.]255[.]255 arriving from outside the edge.","options":["Rate-limit and drop it at the edge — never forward it","Forward the packets to the core for some deeper logging","Enable directed-broadcast forwarding to absorb the flood","Open a low ticket and wait for the next shift"],"correct":0},{"name":"A2 — EIGRP from nowhere","desc":"Updates to 224[.]0[.]0[.]10 arriving on an access port from an unknown device.","options":["Quarantine the port — a rogue adjacency poisons routes","Accept it — EIGRP is a normal protocol, so it is routine","Enable anycast mode on the access switch port","Block 224[.]0[.]0[.]18 instead of 224[.]0[.]0[.]10"],"correct":0},{"name":"A3 — Fast root DNS","desc":"Many clients query 192[.]58[.]128[.]30; every answer arrives in under 5 ms.","options":["Expected: the anycast root service works as designed","Escalate it as a DDoS against the resolver","The TTL is wrong — switch clients to unicast resolvers","Block the address — it has to be spoofed"],"correct":0},{"name":"A4 — Flapping multicast group","desc":"Group 239[.]30[.]1[.]9 sees leave/rejoin storms on VLAN 12; uplink load swings 90–110 Mbps.","options":["Investigate the flapping client and snooping state","Normal multicast behavior — just close the ticket","Move the group into 224[.]0[.]0[.]x to stabilize","Disable IGMP snooping to smooth out the swings"],"correct":0},{"name":"A5 — Chatty ARP responder","desc":"One MAC sends answers to dozens of who-has requests per second for random IPs.","options":["Possible ARP scan or poisoning — isolate it","Normal ARP churn for this hour — no action","Enable directed-broadcast forwarding to flush it","Renumber the whole user VLAN this weekend"],"correct":0}]}},{"id":"H10","type":"order","theme":"Protocols & mechanisms","title":"Order the multicast fault-hunt","points":1,"scenario":"A new channel (239[.]44[.]1[.]6) reaches some set-top boxes and not others. You get 30 minutes with the senior network engineer and must run the fault-hunt in the order that isolates the failure fastest — the ticket template fixes this sequence.","question":"Put the five proof steps in the correct order.","hint":"Follow the packet's journey backwards from the TV: wish first, map second, asker third, tree fourth, source last.","explain":"1 — Receiver: did the set-top box actually send the IGMP join? No join, no stream, ever. 2 — Switch: did the access switch learn the receiver's port into the group (snooping state)? 3 — Querier: does something on the VLAN send IGMP general queries to keep memberships alive? Without a querier, groups silently age out. 4 — Routing: does PIM show a working path (an outgoing interface) toward the receiver's subnet? 5 — Source: is the encoder truly sending UDP to the group address? The order mirrors the delivery chain: wish → map → keeper → tree → source; skipping ahead wastes time diagnosing a source that was never asked for. Focus on: multicast fails quietly — each proof step eliminates one layer of the chain.","answer":{"items":[{"t":"Receiver proof: confirm the set-top box sent an IGMP join for 239[.]44[.]1[.]6"},{"t":"Switch proof: confirm the access switch mapped the receiver's port into the group"},{"t":"Querier proof: confirm something on the VLAN sends IGMP general queries"},{"t":"Routing proof: confirm PIM has an outgoing interface toward the receiver's subnet"},{"t":"Source proof: confirm the encoder really sends UDP to the group address"}]}},{"id":"H11","type":"spotbug","theme":"Device behavior","title":"The snooping config that almost works","points":1,"scenario":"VLAN 70 carries a local video source on Gi1/0/3. Viewers' channels die after a few minutes; the symptom matches membership timeouts. Policy says: snooping on, fast-leave on, a live querier, and a generous multicast rate cap. Gi1/0/48 is a decommissioned uplink that connects to nothing. A junior says 'the querier lines are obviously broken' — prove or disprove it. Exactly TWO lines break the design.","question":"Click the TWO faulty lines.","hint":"The querier lines are healthy — read them again. Ask instead: where does the switch THINK multicast routers live, and how much air does the video get?","explain":"Line 5 pins the multicast-router port to Gi1/0/48 — the decommissioned, unplugged uplink. Snooping now believes the only 'multicast router side' is a dead port, so joins and streams are steered toward nothing: memberships form, then starve, and channels die minutes later. Line 7 caps multicast at 0.5% of the interface — far below any video channel — so even delivered streams freeze. The querier lines (3, 4) are correct and the junior's 'obvious' suspect is a decoy; fast-leave on line 6 matches policy. Focus on: static mrouter ports must point at live multicast-router paths, and storm-control levels must be sized against real traffic.","answer":{"label":"DIST-SW-9 RUNNING CONFIG (excerpt)","note":"Click a line to select it. Click again to deselect. Select the 2 faulty lines.","code":["ip igmp snooping","ip igmp snooping vlan 70","ip igmp snooping vlan 70 querier","ip igmp snooping vlan 70 querier address 10[.]17[.]70[.]1","ip igmp snooping vlan 70 mrouter interface GigabitEthernet1/0/48","ip igmp snooping vlan 70 fast-leave","storm-control multicast level 0.50","interface vlan 70"," ip address 10[.]17[.]70[.]1 255[.]255[.]255[.]0"],"bugs":[4,6]}},{"id":"H12","type":"dual","theme":"Protocols & mechanisms","title":"Two hats, one relayed VLAN","points":1,"scenario":"The new branch works: DHCP relay (ip helper-address 10[.]100[.]5[.]10) on the branch gateway, leases flow from the data-center pool. Then Security flags the branch user VLAN in the quarterly review: 'plain broadcast VLAN with DHCP'. You examine the same design twice — once to defend the mechanism, once to demonstrate its weakest point.","question":"Answer both sides.","hint":"Blue side: someone inside the VLAN must pick up the shout and post it onward. Red side: anyone can shout back an answer.","explain":"Blue team: the relay receives the broadcast DISCOVER inside the VLAN and re-sends it as unicast to the server (recording its own interface address as giaddr), and the OFFER travels back the same way — broadcast in the VLAN, unicast across the WAN; nothing 'routes broadcasts'. The whole DORA dance (Discover, Offer, Request, Ack) survives the router hop precisely because the relay speaks both sides. Red team: any host can also answer the DISCOVER — a rogue DHCP server hands out hostile gateways and DNS to the whole VLAN, which is exactly why DHCP snooping (trusted ports for the relay only) is the mandatory companion control. Losing offers, APIPA fallbacks and anycast relays are all decoys for the real mechanism. Focus on: relays bridge broadcast to unicast; snooping decides WHO may answer the shout.","answer":{"parts":[{"label":"BLUE TEAM — why does relayed DHCP work?","prompt":"The DISCOVER starts as a broadcast. Why do leases still arrive from the data center?","choices":["The relay receives the broadcast and forwards it as unicast to the server","Broadcasts are automatically routed to the data center by the WAN router","The server also listens on 255[.]255[.]255[.]255 across the WAN","Clients give up and fall back to APIPA, then to static addresses"],"correct":0},{"label":"RED TEAM — what does the broadcast VLAN enable?","prompt":"Which attack does a plain broadcast DHCP VLAN enable, and what is its control?","choices":["A rogue DHCP server answering with hostile settings — DHCP snooping","Anycast spoofing of the relay address — stop it with BGP filters","MLD flooding aimed at the server — stop it with rate limits","ARP cache poisoning of the printers — stop it with port security"],"correct":0}]}},{"id":"H13","type":"match","theme":"Addressing & identifiers","title":"Read the log lines like an analyst","points":1,"scenario":"The junior SOC handover includes ten unlabeled log lines from yesterday. The requirement: name what each line actually shows — the gateway-redundancy pairs keep being confused with attacks, and one line IS an attack.","question":"Drag each log line onto the correct reading.","hint":"Destination first: hardware broadcast, subnet broadcast, group address, or one host. Two slots hold a pair of lines, one slot holds a trio.","explain":"HSRPv1 hellos (UDP 1985 to 224[.]0[.]0[.]2) and VRRP hellos (to 224[.]0[.]0[.]18) are gateway-redundancy chatter — normal, every 1–3 seconds. ICMP echo to 10[.]9[.]9[.]255 with 60 replies is directed-broadcast traffic — possible smurf recon or amplification, worth investigating. The WoL magic packet to 10[.]9[.]9[.]255 is the same directed-broadcast mechanism used on purpose to wake a sleeping machine — same slot. TCP 443 to one address is plain unicast application traffic. UDP 5353 to ff02::fb and UDP 5353 to 224[.]0[.]0[.]251 are both mDNS — discovery multicast over IPv6 and IPv4; UDP 5355 to 224[.]0[.]0[.]252 is LLMNR, the Windows name-resolution shout — same discovery family, same slot. Frames to FF:FF:FF:FF:FF:FF are broadcast — normal at boot, a storm in volume. One DNS VIP answered from two sites at different times is anycast. Focus on: the destination address classifies the line before any tool does.","answer":{"slots":[{"name":"Multicast: gateway-redundancy hellos (HSRP/VRRP)"},{"name":"Directed broadcast — amplification or wake-up"},{"name":"Unicast application traffic"},{"name":"Multicast: name & device discovery (mDNS / LLMNR)"},{"name":"Broadcast — normal at boot, storm in volume"},{"name":"Anycast service"}],"items":[{"t":"UDP 1985 to 224[.]0[.]0[.]2 — same two MACs every 3 s","slot":0},{"t":"UDP 112 to 224[.]0[.]0[.]18 between two gateways","slot":0},{"t":"ICMP echo to 10[.]9[.]9[.]255 — replies from 60 hosts","slot":1},{"t":"UDP 9 magic packet to 10[.]9[.]9[.]255 wakes a lab PC","slot":1},{"t":"TCP 443 to 151[.]101[.]1[.]140 — single session, one destination","slot":2},{"t":"UDP 5353 to ff02::fb from every Mac at once","slot":3},{"t":"UDP 5353 to 224[.]0[.]0[.]251 from the new printer","slot":3},{"t":"UDP 5355 to 224[.]0[.]0[.]252 from a Windows laptop","slot":3},{"t":"Frames to FF:FF:FF:FF:FF:FF from a booting workstation","slot":4},{"t":"Same DNS VIP answered from two sites, 40 ms apart","slot":5}]}},{"id":"H14","type":"qcm","theme":"Addressing & identifiers","title":"Choose the range for internal IPTV","points":1,"scenario":"The video platform team requests multicast addresses for a company-wide service. Marketing wants 'the range that reaches everywhere'. You have four candidates from an old wiki page — one is right, three are traps with real-sounding justifications.","question":"Which range and justification should you accept?","hint":"The range that must work inside your borders should not collide with anyone else's — and one candidate can never leave a single subnet at all.","explain":"239[.]0[.]0[.]0/8 is the administratively scoped, organization-local range (RFC 2365): private, reusable in every organization, routable inside your borders with multicast routing — the correct home for internal IPTV. 224[.]0[.]0[.]0/24 is link-local control space: routers never forward it, so 'guaranteed to reach every subnet' is exactly backwards. 224[.]0[.]1[.]x is the internetwork control block — globally visible, meant for shared services (like NTP multicast 224[.]0[.]1[.]1), not for your private channels. 232[.]0[.]0[.]0/8 is the Source-Specific Multicast block — routable, but it requires SSM-aware receivers and is not 'the only range routers forward'. Focus on: scope is a design decision — 239 inside, 224[.]0[.]0[.]x only per-link.","answer":{"choices":["239[.]0[.]0[.]0/8 — administratively scoped, private, reusable site by site","224[.]0[.]0[.]0/24 — the reserved control block, guaranteed to reach every subnet","224[.]0[.]1[.]0/24 — globally visible, therefore best for internal streams","232[.]0[.]0[.]0/8 — the only range that routers will forward"],"correct":0}},{"id":"H15","type":"rank","theme":"Security & operations","title":"Rank the findings by risk","points":1,"scenario":"The audit produced five findings. The remediation budget covers the top of the list only, so the ranking must survive management scrutiny: attacker leverage first, redundancy second, noise last.","question":"Rank the five findings — 1 = fix first, 5 = last.","hint":"Two findings can be used by an attacker against people. One only removes redundancy. One is pure noise. The worst gives strangers a weapon made of your own hosts.","explain":"1 — Edge router forwarding packets to directed broadcast addresses: that is a ready-made smurf amplifier aimed at anyone the attacker chooses; attacker leverage is maximal. 2 — Rogue DHCP server on a spare port: it can hand users hostile gateways and DNS — man-in-the-middle at scale. 3 — Missing IGMP snooping on a 500-user VLAN with three video channels: heavy flooding, degraded voice and video, but an availability problem, not a takeover. 4 — One anycast site withdrawn while the other still answers: resilience degraded, service still up — schedule it. 5 — One ARP broadcast every ten minutes: background noise. Focus on: rank by what an attacker can DO with the finding, then by blast radius, then by convenience.","answer":{"items":[{"t":"Edge router forwards packets to directed broadcast addresses"},{"t":"Rogue DHCP server detected on a spare port"},{"t":"IGMP snooping missing on a 500-user VLAN receiving 3 video channels"},{"t":"One anycast site withdrew its DNS announcement; the other still answers"},{"t":"A single host sends one ARP broadcast every 10 minutes"}]}},{"id":"H16","type":"logview","theme":"Security & operations","title":"The day the EU anycast shifted","points":1,"scenario":"At 10:14 the monitoring dashboards show EU login latency rising +38 ms. The platform lead suspects 'a DDoS' and wants the anycast service rolled back. You pull the platform log first. Filter it and read the sequence.","question":"Answer both questions using the log.","hint":"Read the withdrawal and the health-check timestamps together — which event happened first, and what does a withdrawal do to routing?","explain":"The Frankfurt health check failed (HTTP 503), and the platform correctly withdrew Frankfurt's announcement of the anycast prefix; BGP then selected the Singapore path. Result: EU users were still served — with more latency, because 'nearest' now means Singapore. That is anycast doing its job: fail out the unhealthy site, keep the address, no client reconfiguration. It was not a DDoS, there is no loop, and the VIP never changed. The real action item is the failed health check itself: find out why Frankfurt's application failed. The withdrawal proves the safety net works. Focus on: withdrawal = traffic shift, not outage; the impact is latency, and the cure is fixing the failed site, not touching routing design.","answer":{"kind":"dualsel","duals":[{"q":"What triggered the traffic shift?","options":["Frankfurt's health check failed; the site was withdrawn","Singapore advertised a longer and more preferred BGP path","The clients all switched to a different resolver","A DDoS flood simply absorbed the EU site"],"correct":0},{"q":"What was the operational impact?","options":["EU users were still served, with higher latency","EU users were left completely offline","Traffic looped between the two anycast sites","Client addresses changed and sessions dropped permanently"],"correct":0}]},"artifacts":[{"kind":"log","label":"PLATFORM LOG — 10:14","lines":["10:14:01.760 HEALTH: login-vip 185[.]30[.]222[.]7 FRA healthcheck FAILED (HTTP 503)","10:14:02.110 BGP: neighbor 10[.]200[.]0[.]1 (site-FRA) withdrawn prefix 185[.]30[.]222[.]0/24","10:14:02.180 BGP: bestpath changed for 185[.]30[.]222[.]0/24 via 10[.]200[.]0[.]9 (site-SIN)","10:14:02.205 BGP: neighbor 10[.]200[.]0[.]1 (site-FRA) withdraw re-confirmed","10:14:40.880 APP: login-vip SIN load 82 percent — EU clients now +38 ms RTT","10:15:12.540 DASH: no packet loss SIN->EU; no flood seen on either edge"]}]},{"id":"H17","type":"dnd","theme":"Security & operations","title":"Pair each problem with its control","points":1,"scenario":"The hardening workshop needs the controls mapped to the failures they answer. Six problems from real audits, six controls from the standard build. A mismatched pair means a control that cannot possibly work.","question":"Drag each problem onto the control that addresses it.","hint":"Every control name contains the mechanism it watches: storms, snooping, broadcasts, sites, servers, ARP.","explain":"Broadcast storm from a loop → storm control (rate-limit the flood while the loop is removed). Multicast flooding to every port → IGMP snooping (deliver only to joiners). Smurf amplification → disabling directed-broadcast forwarding (the router refuses to multiply one packet into a subnet's worth of replies). Global flood toward your anycast service → spreading the service over more anycast sites (the attack's power is divided by every extra site; that is DDoS absorption by design). Rogue DHCP server → DHCP snooping (only trusted ports may offer leases). ARP poisoning inside the VLAN → dynamic ARP inspection (validates ARP replies against the snooping table). Focus on: each control exists because one traffic type can be abused in one specific way.","answer":{"slots":[{"name":"Storm control"},{"name":"IGMP snooping"},{"name":"Disable directed-broadcast forwarding"},{"name":"Add anycast sites to spread the load"},{"name":"DHCP snooping"},{"name":"Dynamic ARP inspection"}],"items":[{"t":"Broadcast storm from a switching loop","slot":0},{"t":"Multicast flooding to every port in the VLAN","slot":1},{"t":"Our network abused as a smurf amplifier","slot":2},{"t":"Volumetric flood aimed at the login VIP","slot":3},{"t":"Rogue server handing out hostile leases","slot":4},{"t":"False ARP replies steering traffic to an attacker","slot":5}]}},{"id":"H18","type":"multi","theme":"Core traffic types","title":"Anycast claims under oath","points":1,"scenario":"Vendor PPT day. The slide titled 'Our anycast magic' makes six claims. You are the technical witness; the contract clause says the deal dies if two claims are false. Legal needs your marked list.","question":"Select every TRUE claim.","hint":"Think about what routing knows: prefixes and costs. It knows nothing about sessions, rooms, or special MAC addresses.","explain":"True: 'nearest' is decided by routing cost (BGP/IGP metrics), not by geography — a 'near' site with a bad path can lose to a farther one. Root servers and public resolvers really do run anycast. Spreading one address across many sites genuinely helps absorb volumetric attacks — each site absorbs the share that routing hands it. False: anycast gives NO guarantee that a long TCP session keeps hitting the same node — a route change can shift mid-flow to another node that never saw the session (which is why stateless, short-request services love anycast and stateful services fear it). Nodes do not share one LAN — they are usually in different cities and ASes. And there is no special anycast MAC: Layer 2 sees ordinary unicast. Focus on: anycast is a routing trick with a session-continuity caveat.","answer":{"choices":["The 'nearest' node is decided by routing protocol cost, not by geography","DNS root servers and public resolvers run on anycast","Spreading one address over many sites helps absorb volumetric attacks","Every packet of a long TCP session is guaranteed to reach the same node","All anycast nodes must share one physical LAN","Anycast requires a special destination MAC address"],"correct":[0,1,2]}},{"id":"H19","type":"branch","theme":"Security & operations","title":"The anycast trap — four decisions","points":1,"scenario":"Your anycast DNS VIP answers from FRA and SIN. FRA's application health probe fails — but the routing table still shows FRA announcing the /24. The incident bridge is live; each decision you make changes the outage's shape.","question":"Choose your move at each step.","hint":"Routing decides per prefix, not per application. Two of the correct answers are about that exact mismatch.","explain":"Step 1: users near FRA still reach FRA — a BGP announcement advertises reachability of the PREFIX, and it does not check whether the application behind it works. The traffic keeps flowing to a dead app: the classic anycast trap. Step 2: the fix is tying the announcement to the health check — withdraw the prefix when the service fails, so routing stops claiming what the app cannot deliver. Step 3: when FRA finally withdraws and a long TCP session breaks, it stays broken: after the route change, packets follow a different path to a different node that does not own the flow — anycast offers no session continuity. Step 4: for DNS-like traffic, keep responses stateless and short, so a site switch costs at most one retried query. Focus on: announcements advertise prefixes, not application health — automation must bridge that gap.","answer":{"steps":[{"ctx":"FRA's health probe fails; BGP still announces the /24 from FRA.","prompt":"What do users near FRA experience right now?","options":["They still reach FRA — no health check runs","They are automatically moved over to SIN","They get no answer from either site at all","They alternate between the two live sites"],"correct":0,"conseq":"Routing only knows the prefix. A dead app behind a live announcement is the anycast trap."},{"ctx":"The bridge asks how to close the trap permanently.","prompt":"What is the correct design?","options":["Tie the announcement to the health checks","Lower the BGP local preference value at SIN","Advertise a longer prefix from FRA","Switch all the clients to broadcast DNS"],"correct":0,"conseq":"Health-checked withdrawal keeps the routing claim honest: no service, no announcement."},{"ctx":"FRA fails completely and withdraws. A long-lived TCP session to the VIP breaks.","prompt":"Why did the session die?","options":["No session continuity after the route change","TCP cannot cross Autonomous System borders","BGP resets the client sockets by design","The VIP silently changed to 255[.]255[.]255[.]255"],"correct":0,"conseq":"State lives on one node; routing now points elsewhere. Anycast suits stateless, short exchanges."},{"ctx":"The design review asks how to make future failovers painless for this service.","prompt":"Which choice fits an anycast DNS service best?","options":["Keep responses stateless and short","Run just one central site only","Fall back to broadcast delivery again","Pin every client by its MAC address"],"correct":0,"conseq":"Short stateless exchanges tolerate site switches — exactly why DNS is the flagship anycast workload."}]}},{"id":"H20","type":"spotbug","theme":"Security & operations","title":"The ACL that betrays its own policy","points":1,"scenario":"The policy text reads: allow user VLANs to reach the internal anycast DNS VIP 10[.]200[.]12[.]7 on DNS; NEVER allow traffic toward directed broadcast addresses; NEVER forward the link-local multicast control block toward the core. The implementer says the ACL below matches. Exactly TWO lines violate the stated intent.","question":"Click the TWO lines that violate the policy.","hint":"One permit hands a subnet's top address to everyone. The other waves a whole control block that should never leave a link.","explain":"Line 3 permits any traffic to 10[.]90[.]12[.]255 — that is the directed broadcast address of subnet 10[.]90[.]12[.]0/24, the exact pattern the policy forbids (and the smurf door). Line 4 permits the entire 224[.]0[.]0[.]0/24 block toward the core — link-local control traffic (OSPF, HSRP, IGMP, mDNS...) must never leave its link. Lines 2 and 5 correctly allow DNS to the VIP, and the final deny is sound. The subtle trap: the VIP (10[.]200[.]12[.]7) and the broadcast (10[.]90[.]12[.]255) look like siblings — but one is a host address and the other ends in .255 with all host bits set. Focus on: read every permit against the address class it targets, not against its neighbors in the list.","answer":{"label":"CORE-EDGE ACL (named FILTERED)","note":"Click a line to select it. Click again to deselect. Select the 2 violating lines.","code":["access-list FILTERED remark user-vlan egress","access-list FILTERED permit udp 10[.]90[.]0[.]0 0[.]0[.]255[.]255 host 10[.]200[.]12[.]7 eq 53","access-list FILTERED permit ip any 10[.]90[.]12[.]255 0[.]0[.]0[.]0","access-list FILTERED permit ip any 224[.]0[.]0[.]0 0[.]0[.]0[.]255","access-list FILTERED permit udp any host 10[.]200[.]12[.]7 eq 53","access-list FILTERED deny ip any any"],"bugs":[2,3]}},{"id":"H21","type":"qcm","theme":"Device behavior","title":"The 90-second stutter","points":1,"scenario":"Users report: flows to server 10[.]44[.]1[.]9 stutter briefly about 90 seconds after going idle, then recover by themselves. The switch log shows 'CAM table entry aged' right before each stutter. The ARP entry for the server holds for four hours; the CAM entry holds for five minutes.","question":"What is happening, and what is the clean fix?","hint":"One table remembers for five minutes, the other for four hours. The gap between them floods — for exactly as long as it takes to relearn.","explain":"When the CAM entry for the server's MAC ages out but the hosts' ARP entries still point at that MAC, the switch no longer knows the door — frames to the server become UNKNOWN UNICAST and flood the VLAN until any return traffic from the server relearns the MAC. The classic fix is aligning the timers (make ARP and CAM lifetimes match, or shorten/lengthen so they relearn together); a static CAM entry works too. It is not duplex negotiation (that would show CRC and interface errors, not 'entry aged'), not anycast (nothing here moves between sites), and not a broadcast storm (storm control never fired; the traffic is unicast). Focus on: unknown unicast flooding is the quiet sibling of the broadcast storm — caused by knowledge gaps, cured by timer alignment.","answer":{"choices":["Unknown unicast flooding after CAM aging — align timers","The server NIC renegotiated — force 1 Gbps full duplex","The flows are anycast and re-route every 90 seconds","A broadcast storm tripped storm control — raise its thresholds"],"correct":0}},{"id":"H22","type":"fib","theme":"Security & operations","title":"Write the incident report","points":1,"scenario":"INC-2291 is closed; the postmortem is due. A user switch had been bridged to two wall jacks, creating a loop. Management reads only the summary paragraph below — the four blanks carry the whole story, and the auditor checks the terms.","question":"Complete the report from the word bank.","hint":"This incident is broadcast-only: the multicast feature does nothing here. One blank pairs with the word 'storm'.","explain":"The loop made broadcast frames multiply without end; because all users share one VLAN, the broadcast domain saturated. Storm control on the uplinks had been disabled during commissioning — re-enabled at 1%, it would have contained the flood from the first seconds. BPDU guard on user-facing ports prevents exactly this class of accident: a second switch hidden behind a desk would be shut down instead of bridging two jacks. Finally, splitting users into smaller VLANs shrinks each broadcast domain, so any future storm has less room to run. IGMP snooping is the decoy — it constrains multicast, not broadcast; 'storm' pairs with 'control', not with anything else in the bank. Focus on: postmortems must name the domain, the containment, the prevention, and the shrinkage.","answer":{"text":"INC-2291 summary: A user switch bridged two wall jacks, creating a loop. Broadcast frames multiplied until the user ___ was saturated. Storm ___ on the uplinks had been disabled during commissioning; we re-enabled it at 1%. On user-facing ports we enabled ___ so a hidden switch is shut down instead of looping. We also shrank the broadcast ___ by splitting users into smaller VLANs.","bank":["VLAN","control","BPDU guard","domain","IGMP snooping","rate"],"blanks":[{"accept":["vlan"]},{"accept":["control"]},{"accept":["bpdu guard"]},{"accept":["domain"]}]}},{"id":"H23","type":"logview","theme":"Protocols & mechanisms","title":"The group that aged out","points":1,"scenario":"IPTV channel 239[.]18[.]1[.]3 works for four minutes, then freezes for everyone on VLAN 18, then works again — in a loop. You captured the switch's IGMP debug. Read it with the filter.","question":"Answer both questions using the debug log.","hint":"The switch did its job: it joined the port, then it aged the group out. Who was supposed to keep asking 'anyone still there?'","explain":"The client joined, the switch snooped the port into the group — all correct. Then: 'no general query seen for 260s'. IGMP memberships live only while a QUERIER keeps asking who is still listening; with no querier on VLAN 18, no general queries arrive, the membership expires, the switch removes the port, and the (now unregistered) stream floods or stops reaching members properly — hence the freeze. The fix is enabling an IGMP querier for the VLAN (a multicast router, or the switch's own querier function where no router exists). The client never sent a Leave; the group is not in 224[.]0[.]0[.]x; the port number is irrelevant. Disabling snooping would 'fix' the freeze by flooding — the wrong cure. Focus on: snooping without a querier is a clock ticking toward expiry.","answer":{"kind":"dualsel","duals":[{"q":"Root cause of the four-minute freeze loop?","options":["No IGMP querier on VLAN 18 — groups expired","The client sent an IGMP Leave for that group","The group address is inside 224[.]0[.]0[.]x, which routers drop","The stream rides the wrong UDP port number"],"correct":0},{"q":"The correct fix?","options":["Enable an IGMP querier for VLAN 18","Disable IGMP snooping on the VLAN","Move the group address to ff02::1","Lengthen the video buffer in the player"],"correct":0}]},"artifacts":[{"kind":"log","label":"DIST-SW-4 IGMP DEBUG — VLAN 18","lines":["14:02:01.110 IGMP: Received v2 Report from 10[.]18[.]5[.]61 for group 239[.]18[.]1[.]3 on Vl18","14:02:01.125 IGMP_SNOOP: added port Gi1/0/12 to group 239[.]18[.]1[.]3 (Vl18)","14:05:33.400 IGMP: No general query seen on Vl18 for 260s; querier absent","14:06:02.110 IGMP_SNOOP: group 239[.]18[.]1[.]3 membership expired (Vl18)","14:06:02.115 IGMP_SNOOP: removed port Gi1/0/12 from group 239[.]18[.]1[.]3","14:06:10.770 IP 10[.]18[.]5[.]9.5004 > 239[.]18[.]1[.]3.5004: UDP — unregistered, now flooding all ports","14:07:44.900 IGMP: Received v2 Report from 10[.]18[.]5[.]61 for group 239[.]18[.]1[.]3 (client rejoin)"]}]},{"id":"H24","type":"order","theme":"Protocols & mechanisms","title":"Order the life of a multicast packet","points":1,"scenario":"The architecture board wants the multicast delivery chain on one slide, in the order things actually happen — from 'a viewer wishes' to 'pixels on screen'. Six steps, one correct order.","question":"Put the six steps in order.","hint":"Join first, then the switch map, then the source, then the routing tree, then the last hop, then the door.","explain":"1 — The receiver multicasts an IGMP membership report: the wish. 2 — The snooping switch records the receiver's port in the group: the map. 3 — The source sends UDP packets to the group address: the data exists. 4 — PIM on the routers builds the distribution tree from the source toward receiver subnets: the path. 5 — The last-hop router forwards the stream onto the receiver's VLAN: the arrival. 6 — The snooping switch delivers the frames only to member ports and multicast-router ports: the door. Reorder any two steps and the chain breaks exactly where the order is wrong — no join means no map, no map means flooding or nothing, no tree means no routing. Focus on: control plane (join, map, tree) always precedes the data plane delivery you actually see.","answer":{"items":[{"t":"The receiver sends an IGMP membership report for the group"},{"t":"The snooping switch records the receiver's port into the group"},{"t":"The source sends UDP packets to the group address"},{"t":"PIM on the routers builds the distribution tree toward receiver subnets"},{"t":"The last-hop router forwards the stream onto the receiver's VLAN"},{"t":"The switch delivers the frames only to member ports and multicast-router ports"}]}},{"id":"H25","type":"multi","theme":"Addressing & identifiers","title":"TTL and scope: true or false","points":1,"scenario":"The multicast design review has reached the scoping slide. Six statements about TTL and administrative scope are on the table; two of them are the mistakes that caused last year's routing incident. Mark the TRUE ones only.","question":"Select every TRUE statement.","hint":"Two 'by default' claims are false on modern gear. And one range is local by definition — no TTL value changes that.","explain":"True: packets to 224[.]0[.]0[.]x go out with TTL 1 and routers do not forward that block — it is link-local control space by definition. Routers treat 224[.]0[.]0[.]0/24 as link-local regardless of TTL — raising TTL does NOT let 224[.]0[.]0[.]5 cross the WAN (false statement). The whole multicast range 224[.]0[.]0[.]0/4 is the old Class D, and the 239[.]0[.]0[.]0/8 block inside it is organization-local and safely reusable in different organizations. RIPv2 sends its table to 224[.]0[.]0[.]9, which never leaves the link. False: routers do NOT forward broadcast frames between VLANs by default — that is the boundary of the broadcast domain. And modern routers do NOT forward directed broadcasts by default — 'no ip directed-broadcast' is the shipping default since the smurf era. Focus on: scope beats TTL for the 224[.]0[.]0[.]x block; 'forwarding by default' claims deserve suspicion.","answer":{"choices":["Packets to 224[.]0[.]0[.]x are sent with TTL 1 and routers do not forward them","Routers treat 224[.]0[.]0[.]0/24 as link-local control space","The 239[.]0[.]0[.]0/8 block can be reused inside different organizations","Raising the TTL makes packets to 224[.]0[.]0[.]5 cross the WAN","Routers forward broadcast frames between VLANs by default","Routers forward directed broadcasts by default on modern systems"],"correct":[0,1,2]}},{"id":"H26","type":"dnd","theme":"Device behavior","title":"Match the device to its verdict","points":1,"scenario":"The certification bootcamp wants the 'device behavior' wall sorted: six packets arrive, six verdicts must be pinned under them. Two of the verdicts are refusals — devices refusing to forward is itself examinable knowledge.","question":"Drag each arrival onto the behavior it triggers.","hint":"Two rows are about things routers refuse to do by default. One row is the switch's 'one door' behavior.","explain":"Switch + broadcast → floods out all ports in the VLAN except the incoming port (delivery by design). Router + 255[.]255[.]255[.]255 → never forwarded; the limited broadcast stays on the local link, always. Router with PIM + a group with a valid tree → forwards along the multicast distribution tree — multicast routing's whole job. Switch + known unicast → forwards out exactly the one port tied to that MAC in the CAM table. Router + directed broadcast (default modern config) → dropped; forwarding directed broadcasts is disabled by default. Switch with snooping + a snooped group → sends only to member ports and multicast-router ports. Focus on: routers refuse broadcast by principle; switches flood it by principle — the same frame, opposite verdicts.","answer":{"slots":[{"name":"Switch: floods it within the VLAN"},{"name":"Router: never forwards it"},{"name":"Router with PIM: forwards along the tree"},{"name":"Switch: forwards out one CAM port"},{"name":"Router: drops it (default modern config)"},{"name":"Snooping switch: only to member + mrouter ports"}],"items":[{"t":"A switch receives a broadcast frame (FF:FF:FF:FF:FF:FF)","slot":0},{"t":"A router receives a packet addressed to 255[.]255[.]255[.]255","slot":1},{"t":"A router with PIM receives a packet for 239[.]14[.]1[.]1 with a valid tree","slot":2},{"t":"A switch receives a unicast frame for a learned MAC","slot":3},{"t":"A router receives a packet to a subnet's directed broadcast address","slot":4},{"t":"A snooping switch receives a frame for a group with snooped members","slot":5}]}},{"id":"H27","type":"terminal","theme":"Protocols & mechanisms","title":"Terminal: after the gateway failover","points":1,"scenario":"The gateway VIP 10[.]77[.]0[.]1 is anycast; failover just moved it to the new router. This host still holds the OLD link-layer mapping, so your test traffic follows a ghost. Choose your own tools.\n\nTask 1: remove the stale entry for 10[.]77[.]0[.]1 from this host's neighbor (ARP) table.\nTask 2: display the neighbor table so you can see the fresh lookup happen.\n\nType one command per task below.","question":"Which two commands fix and then verify the table?","hint":"Modern Linux: one 'ip' subcommand starts with 'neigh' — it can flush or delete. Old school: the 'arp' command deletes with -d. Showing is a sibling of deleting.","explain":"Task 1 examples: ip neigh flush 10[.]77[.]0[.]1, ip neigh del 10[.]77[.]0[.]1 dev eth0, or the classic arp -d 10[.]77[.]0[.]1 — all remove the stale mapping. Task 2 examples: ip neigh show, ip neigh, arp -n, or arp -a — the table then shows the entry as INCOMPLETE or re-learned at the next packet, exposing the new gateway's MAC. With an anycast VIP, the fresh lookup may resolve to a different router after failover — which is precisely what the relearned entry should reveal. Focus on: the neighbor table is the host-side view of ARP; flushing it is the standard first move after any gateway failover.","answer":{"ps":"analyst@soc-lab:~$","tasks":[{"label":"Remove the stale entry for 10[.]77[.]0[.]1 from the neighbor table","accept":["ip\\s+neigh(bou?r)?\\s+(flush|del(ete)?)\\s+.*10@77@0@1.*","ip\\s+neigh(bou?r)?\\s+flush\\s+(all|\\*)?\\s*$","arp\\s+-d+\\s+.*10@77@0@1.*","arp\\s+-d+n?\\s+-i\\s+\\w+\\s+.*10@77@0@1.*","sudo\\s+(ip\\s+neigh.*10@77@0@1.*|arp\\s+-d.*10@77@0@1.*)"],"example":"ip neigh flush 10[.]77[.]0[.]1"},{"label":"Display the neighbor table","accept":["ip\\s+(-4\\s+)?(-s\\s+)?neigh(bou?r)?\\s*(show)?(\\s+dev\\s+\\w+)?\\s*$","arp\\s+-n+\\s*$","arp(\\s+-a|\\s+-n|-v)*\\s*$","ip\\s+neigh\\s+show\\s+dev\\s+\\w+\\s*$"],"example":"ip neigh show"}]}},{"id":"H28","type":"logview","theme":"Device behavior","title":"The wireless multicast wall","points":1,"scenario":"The 4K digital-signage channel (224[.]24[.]0[.]7) plays perfectly on wired displays. Every Wi-Fi tablet loses frames. You captured the air at the AP. Two data rows in the capture tell the whole story — one is ACKed and fast, one is neither.","question":"Answer both questions using the capture.","hint":"Compare the two data rows: rate, retries, and who confirms reception. Then ask what design sidesteps the whole problem for video.","explain":"The multicast rows crawl at the 6 Mb/s basic rate and show retries-with-no-ACK semantics: 802.11 multicast is sent at a low basic rate so even the weakest station can hear it, and it is never acknowledged — lost frames stay lost. The unicast row runs at 300 Mb/s with per-frame ACKs and rate adaptation. That asymmetry is why Wi-Fi multicast video stutters while wired works. The sound design delivers Wi-Fi video as unicast (individually ACKed, rate-adapted — many APs do multicast-to-unicast conversion), keeping native multicast on the wires. Beacons are a normal broadcast frame at 1 Mb/s — present but irrelevant; 224[.]24[.]0[.]7 is a legitimate multicast group, not a forbidden address; and the client joined fine (the IGMP report is visible). Focus on: over the air, multicast trades reliability for reach — video needs the opposite trade.","answer":{"kind":"dualsel","duals":[{"q":"Why do the multicast frames crawl and drop?","options":["They go at a low basic rate and are never ACKed","The AP cannot encrypt the multicast frames","224[.]24[.]0[.]7 is a broadcast address, which Wi-Fi forbids","The tablet failed to join the group properly"],"correct":0},{"q":"Which design avoids the problem for Wi-Fi video?","options":["Deliver the Wi-Fi video as unicast instead","Disable the beacon frames to free airtime","Move the channel over to 224[.]0[.]0[.]1","Force every tablet onto the oldest Wi-Fi standard"],"correct":0}]},"artifacts":[{"kind":"log","label":"AP-3F-02 — AIR CAPTURE","lines":["12:11:04.010 802.11 beacon (broadcast) SSID=CORP from AP-3F-02, rate 1 Mb/s","12:11:04.220 802.11 data dst 01:00:5e:18:00:07 (224[.]24[.]0[.]7 UDP 5004) — sent at basic rate 6 Mb/s, retry x3, no ACK expected","12:11:05.002 802.11 data dst 10[.]90[.]7[.]31 TCP 443 — sent at 300 Mb/s, ACKed, no retry","12:11:05.510 802.11 data dst 01:00:5e:18:00:07 (224[.]24[.]0[.]7 UDP 5004) — sent at basic rate 6 Mb/s, retry x2","12:11:06.040 IGMPv2: Membership Report group 224[.]24[.]0[.]7 from wireless client W-77","12:11:06.220 STAT: wired display ports receiving 224[.]24[.]0[.]7 at line rate"]}]},{"id":"H29","type":"qcm","theme":"Device behavior","title":"Modern defaults about broadcast forwarding","points":1,"scenario":"A vendor engineer claims: 'our router forwards directed broadcasts out of the box, and the limited broadcast too — you must ACL it all'. The change board wants the sentence verified against modern default behavior before it reaches the risk register. One sentence below is fully correct.","question":"Which sentence matches modern default router behavior?","hint":"One answer hides a second claim about 255[.]255[.]255[.]255 — check both halves of every sentence.","explain":"Correct: forwarding packets to DIRECTED broadcast addresses is disabled by default on modern routers (that default exists because directed-broadcast forwarding powered the smurf attack), and the LIMITED broadcast 255[.]255[.]255[.]255 is never routed — it dies at the first router by definition. The false halves: routers do not forward directed broadcasts by default; there is no automatic conversion of broadcast into multicast; and 'routed one hop' for the limited broadcast is exactly backwards — it is never forwarded, not even once. Focus on: two different broadcast addresses, two different rules, both restrictive by default — the vendor's sentence fails on both halves.","answer":{"choices":["Directed broadcasts are not forwarded by default; limited broadcast never routes","Routers forward directed broadcasts by default; you must block them with ACLs","Routers quietly convert directed broadcasts into multicast groups at the edge","255[.]255[.]255[.]255 is routed exactly one hop by default settings"],"correct":0}},{"id":"H30","type":"match","theme":"Core traffic types","title":"Match the deployment to its traffic type","points":1,"scenario":"Final board review before the platform standards are signed. Seven real deployments from the estate must carry their traffic-type label — the discovery rows keep being mixed up, and two rows are the same type by different mechanisms.","question":"Drag each deployment onto its traffic type.","hint":"The three discovery rows all announce to a group or to everyone — but only one of them shouts to absolutely every host.","explain":"One login address announced from 12 data centers = anycast (routing picks the nearest). BGP hot-potato per region = the same anycast behavior viewed from the routing side — same slot. One 4K channel to 300 subscribed set-top boxes = multicast (one stream, many members). Printers advertising to Macs on 5353/UDP = multicast too — that is mDNS, group-addressed, not shouted to all. UPnP devices searching with SSDP on 239[.]255[.]255[.]250 = multicast discovery as well — same slot. Legacy NetBIOS browse lists = broadcast — the old file-share LAN's every-host chatter. One RTP call between two phones = unicast, a single two-party flow. Focus on: mDNS and SSDP are group-addressed discovery (multicast), NetBIOS browse is link-wide noise (broadcast) — similar purpose, different mechanics, different slots.","answer":{"slots":[{"name":"Anycast"},{"name":"Multicast"},{"name":"Broadcast"},{"name":"Unicast"}],"items":[{"t":"12 data centers announce one address for the login page","slot":0},{"t":"One 4K channel delivered to 300 subscribed set-top boxes","slot":1},{"t":"Printers advertise themselves to Macs on the local subnet (5353/UDP)","slot":1},{"t":"UPnP gear searching with SSDP on 239[.]255[.]255[.]250","slot":1},{"t":"Legacy NetBIOS browse list on an old file-share LAN","slot":2},{"t":"One RTP call between two phones","slot":3},{"t":"BGP hot-potato: clients in each region land on their region's edge","slot":0}]}}]}
