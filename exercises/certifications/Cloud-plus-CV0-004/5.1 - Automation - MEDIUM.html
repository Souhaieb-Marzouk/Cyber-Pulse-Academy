hint:`Automation is one tool doing one task. Orchestration chains several automated steps, often across systems or teams, into one coordinated workflow.`,
exp:`Automation repeats a single task with a tool, like a cron job on one VM. Orchestration is the bigger word: it coordinates several automated steps into one workflow, often across systems or teams. If steps must happen in order across different platforms, that is orchestration.`},

{id:"M2",theme:2,type:"order",title:"Order the CI/CD pipeline",
sc:`Your team is drawing its first continuous delivery pipeline for a web API. The release manager lists the stages on a whiteboard and asks you to put them in a working order.`,
q:`Order the stages from first (position 1) to last (position 7).`,
items:[
{t:`Commit code and push to the shared repository`},
{t:`Build the app and run unit tests (continuous integration)`},
{t:`Package the build into a versioned artifact`},
{t:`Deploy the artifact to a staging environment`},
{t:`Run integration tests against staging`},
{t:`Human approval gate for the production release`},
{t:`Release to production (continuous delivery)`}],
hint:`You cannot test what was never built, and you never release to production before the approval gate.`,
exp:`A pipeline flows: commit, build with unit tests, package a versioned artifact, deploy to staging, run integration tests, pass the approval gate, then release. Each stage uses the output of the one before it. The approval gate sits just before production so a human signs off the change.`},

{id:"M3",theme:1,type:"qcm",title:"Pick the right config tool",
sc:`A company wants configuration management for 300 Linux VMs. The platform team refuses to install an agent on every host and prefers simple YAML files pushed over SSH from one control machine.`,
q:`Which tool fits these requirements best?`,
opts:[
{t:`Puppet — an agent on every node, enforced by a central server`},
{t:`Ansible — agentless, pushes YAML playbooks over SSH`,ok:true},
{t:`Chef — an agent plus chef-client runs driven by cookbooks`},
{t:`Terraform — declarative infrastructure provisioning with a state file`}],
hint:`The two hard requirements are: no agent on the hosts, and YAML playbooks pushed over SSH.`,
exp:`Ansible is agentless: it connects over SSH and pushes YAML playbooks, so nothing is installed on the 300 VMs. Puppet and Chef both need an agent on each node. Terraform is excellent for provisioning infrastructure, but it is not the agentless configuration tool described here.`},

{id:"M4",theme:3,type:"fill",title:"Read the failed deploy output",
sc:`You are on deployment duty. The nightly pipeline ran your deploy script for staging and stopped. Here is the console output:`,
code:{name:"deploy.sh run — staging",lines:[
`$ bash deploy-api.sh --env staging`,
`[1/4] Validating template ... OK`,
`[2/4] Creating change record CHG-2291 ... OK`,
`[3/4] Uploading artifact api-2.14.0.zip to registry.acme.internal ... OK`,
`[4/4] Running migration on db-staging-01 ... FAILED (exit code 2)`,
`Deployment stopped. Production was not touched.`]},
q:`Complete the incident note: the script stopped at step 4 because a non-zero {{0}} code means the step failed. The build had already been stored in the artifact {{1}}. Because staging failed, the pipeline must not continue to {{2}}.`,
slots:[0,1,2],
bank:["exit","registry","production","rollback","staging","cron"],
hint:`Look at the FAILED line: the bracketed number after the word exit is the signal every shell tool leaves behind.`,
exp:`Shell tools report failure with a non-zero exit code, which the pipeline reads to stop early — bash, Python and PowerShell scripts all follow this convention. The artifact was already pushed to the registry, so the build itself was fine. Staging exists to catch exactly this kind of problem, so a staging failure must always block production.`},

{id:"M5",theme:1,type:"dnd",title:"Match the IaC and config tools",
sc:`New hires keep mixing up the automation tools in your stack. You build a quick matching board for the onboarding folder.`,
q:`Drag each description onto the tool it describes.`,
buckets:["Terraform","AWS CloudFormation","Ansible","Puppet"],
items:[
{t:`Multi-cloud provisioning with its own state file`,b:0},
{t:`AWS-native declarative templates managed as stacks`,b:1},
{t:`Agentless YAML playbooks pushed over SSH`,b:2},
{t:`Agent on every node; manifests enforced continuously`,b:3}],
hint:`One tool is AWS-only, one is multi-cloud with a state file, one is agentless push, one keeps agents in check all the time.`,
exp:`Terraform provisions infrastructure on many clouds and keeps a state file. CloudFormation is the AWS-native template service, working with stacks. Ansible is agentless and pushes playbooks over SSH. Puppet installs an agent on each node and continuously enforces manifests.`},

{id:"M6",theme:1,type:"multi",title:"What idempotency really promises",
sc:`A teammate says: "Our Ansible playbook is idempotent, so we can run it whenever we want." Another teammate is not sure what that actually promises.`,
q:`Select ALL the true statements about idempotency.`,
opts:[
{t:`Running the same playbook twice leaves the same end state`,ok:true},
{t:`An idempotent task is safe to retry after a network timeout`,ok:true},
{t:`An idempotent task reports "changed" on every single run`},
{t:`A task that ensures a package is installed is a classic idempotent task`,ok:true},
{t:`A task that appends a line to a file on every run is idempotent`},
{t:`Idempotency means the task always finishes faster`}],
hint:`Think about the second run: does anything change, and is it safe to just run it again?`,
exp:`Idempotent means running it again changes nothing: the second run leaves the same end state, so a retry after a timeout is safe. "Ensure the package is installed" is the classic example — if it is already there, nothing happens. Appending a line on every run is NOT idempotent, and idempotency says nothing about speed.`},

{id:"M7",theme:0,type:"branch",title:"Work the disk-full runbook",
sc:`You are on-call. A monitoring alert says the web VM web-prod-03 is above 90% disk usage. The team keeps a runbook for exactly this alert, and the runbook supports safe auto-remediation.`,
q:`Work through the runbook decisions. Every path has four steps.`,
steps:[
{q:`The alert fires at 03:12. What does the runbook say to do first?`,
opts:[
{t:`Verify the alert is real and current, not stale or duplicated`,ok:true},
{t:`Delete files on the VM immediately to free space`},
{t:`Reboot the VM and see if the alert clears`},
{t:`Ignore it — disk alerts usually fix themselves`}]},
{q:`You confirm the alert is real: /var/log is at 92%. What is the next runbook step?`,
opts:[
{t:`Run the log-rotation and cleanup job listed in the runbook`,ok:true},
{t:`Run a recursive force-delete on /var/log to free everything at once`},
{t:`Expand the disk immediately without investigating the growth`},
{t:`Open a ticket and wait for the morning shift`}]},
{q:`The cleanup frees 30% and the alert clears. What does the runbook say now?`,
opts:[
{t:`Verify service health and record the action and result in the ticket`,ok:true},
{t:`Close the alert silently so nobody asks questions`},
{t:`Delete last week's backups to free even more space`},
{t:`Restart the database just in case`}]},
{q:`Final step: how do you stop this from happening again?`,
opts:[
{t:`Set a rotation policy and ship logs off-box via configuration management`,ok:true},
{t:`Clean the disk by hand every week from now on`},
{t:`Buy a bigger disk and never mention it again`},
{t:`Turn off the disk alert so it stops being noisy`}]}],
hint:`A good runbook starts by confirming the problem, fixes it with the safest listed action, and ends with records and prevention.`,
exp:`Real runbooks confirm before acting, use the safest scripted fix, record everything, and end with prevention. Here the lasting fix is a log-rotation policy plus shipping logs off the VM through configuration management, so the baseline never drifts. Hand cleaning every week and muting the alert only move the problem.`},

{id:"M8",theme:1,type:"twopart",title:"The bucket that came out public",
sc:`Security opened ticket SEC-4471 after the morning scanner run. The app team swears nobody touched permissions. The Terraform snippet from this morning's merge is attached.`,
code:{name:"main.tf — merged this morning",lines:[
`resource "aws_s3_bucket" "exports" {`,
`  bucket = "acme-exports-prod"`,
`  acl    = "public-read"`,
`}`]},
ticket:{id:"SEC-4471",title:"S3 bucket acme-exports-prod is readable by anyone on the internet",body:"Scanner report 09:40: bucket grants READ to AllUsers. App team: 'Terraform created it this morning. We never touched permissions.'"},
p:[
{q:`Why is the new bucket public?`,
opts:[
{t:`The IaC template itself sets the public ACL, so every apply rebuilds the problem`,ok:true},
{t:`Someone logged in by hand and changed the permissions after the merge`},
{t:`The cloud provider makes all new buckets public by default`},
{t:`The scanner is wrong; buckets are private unless explicitly shared`}]},
{q:`Which control catches the NEXT template like this before apply?`,
opts:[
{t:`An IaC security scan on every pull request in the pipeline`,ok:true},
{t:`A monthly manual review of the Terraform folder`},
{t:`Deleting Terraform and building everything in the console`},
{t:`Turning off the scanner because it is noisy`}]}],
hint:`Ask where the bad setting lives — in someone's memory, or in code that will reproduce itself on every apply?`,
exp:`The public setting sits inside the IaC template, so every apply rebuilds it — a textbook case of misconfiguration propagation through code. The durable control is in the pipeline: an IaC scan on each pull request blocks insecure templates before they reach the cloud. Monthly manual reviews are far too slow to stop the next one.`}
);

{id:"M10",theme:4,type:"order",title:"Rank the automation tickets",
sc:`Monday 08:30. Four tickets landed in the automation queue overnight and one engineer can only take them in order. Rank them by urgency for a cloud operations engineer.`,
q:`Rank the tickets from most urgent (position 1) to least urgent (position 4).`,
items:[
{t:`TK-101: the deploy service account's token is being printed in public build logs (credential exposure, prod pipeline)`},
{t:`TK-102: the nightly backup of the production database failed for the second night in a row`},
{t:`TK-103: a single dev VM reports 91% disk usage; no service impact`},
{t:`TK-104: the staging cost dashboard shows a 5% drift in monthly spend`}],
hint:`Exposed credentials and lost production backups beat a slow dev VM and a reporting drift.`,
exp:`Order: exposed token first (anyone reading the logs can act as the pipeline), then the failing prod backup (silent data risk), then the dev VM disk (no service impact), then the spend drift (reporting only). Ranking means customer and security impact first, cosmetic issues last.`},

{id:"M11",theme:2,type:"qcm",title:"Canary at five percent",
sc:`A new checkout service version is running as a canary at 5% of traffic. Aggregate dashboards look green: canary error rate 0.2%, baseline 0.2%. But support has logged 14 login-timeout tickets in 30 minutes, and all affected users were routed to canary pods.`,
q:`What is the correct move?`,
opts:[
{t:`Hold the canary at 5% and compare per-tier latency before promoting`,ok:true},
{t:`Promote to 100% because the aggregate dashboard is green`},
{t:`Skip ahead: move the canary to 50% to gather more data faster`},
{t:`Roll back all of production; the release has clearly failed`}],
hint:`Aggregate metrics can hide a small slice that is having a bad time. Who exactly is hurting?`,
exp:`The canary's whole point is a small blast radius. Aggregate metrics look fine because the canary only serves 5%, but real users on that slice are suffering. Hold at 5%, investigate the per-tier latency, and only promote when the affected group is healthy. Full rollback would be an overreaction; growing the canary would grow the harm.`},

{id:"M12",theme:3,type:"multi",title:"Triage the service-token log",
sc:`The platform audit log for service accounts. Use the filter box to focus on what matters, then answer.`,
logs:[

`Nov 04 03:12:09 audit svc-inventory token=tk_7f2a action=DeleteBucket result=DENIED (policy)`,
`Nov 04 03:13:40 audit svc-report token=tk_9c31 action=GetReport result=OK`,

{id:"M13",theme:0,type:"order",title:"Event-driven remediation flow",
sc:`Your team is designing an event-driven auto-remediation service: a webhook receives monitoring alarms, and a remediation engine acts on them. Put the processing flow in order.`,
q:`Order the steps the service must run, from alarm arrival (position 1) to closure (position 7).`,
items:[
{t:`Webhook receives the alarm event`},
{t:`Validate the event source and its signature`},
{t:`Enrich the event with context: host, owner, service`},
{t:`Match the alarm to a playbook`},
{t:`Execute the remediation with a least-privilege role`},
{t:`Verify the fix worked, or escalate to a human`},
{t:`Write the outcome to the audit log`}],
hint:`Never trust an event before checking who sent it, and never skip writing down what the automation did.`,
exp:`First the webhook receives the event, then the source and signature are validated — untrusted events must not trigger actions. Enrichment adds context, the alarm is matched to a playbook, and the fix runs with a least-privilege role. Verification decides between closing and escalating, and the audit log records the whole chain.`},

{id:"M14",theme:2,type:"multi",title:"Spot the pipeline mistakes",
sc:`A developer proudly shows the team's new CI pipeline file. It works — every push ends up in production. You have been asked to review it before it becomes the standard.`,
code:{name:"build-api.yml",lines:[
`name: build-api`,
`on: push`,
`jobs:`,
`  build:`,
`    runs-on: ubuntu-latest`,
`    steps:`,
`      - uses: actions/checkout@v4`,
`      - name: test`,
`        run: npm test`,
`      - name: build image`,
`        run: docker build -t registry.acme.internal/api:latest .`,
`      - name: push image`,
`        run: docker push registry.acme.internal/api:latest`,
`      - name: deploy prod`,
`        run: bash deploy.sh --env production`]},
q:`Select ALL the real problems you should raise in the review.`,
opts:[
{t:`The deploy-to-production step runs with no staging test or approval gate in front of it`,ok:true},
{t:`The image is tagged "latest", so rolling back to a known good version is hard`,ok:true},
{t:`The image is pushed with no vulnerability scan of the artifact`,ok:true},
{t:`The checkout step is wrong and must be removed`},
{t:`The docker build must run before the unit tests`}],
hint:`Three problems are about safety and traceability; the other two are made-up rules.`,
exp:`Three real issues: production is deployed with no staging or approval gate, the mutable "latest" tag destroys rollback and traceability, and the artifact is pushed unscanned. The checkout step is completely normal, and running tests before the build is intentional — tests fail fast and cheap.`},

{id:"M15",theme:1,type:"terminal",title:"Run the configuration playbook",
sc:`You are on the configuration workstation. The team's Ansible playbook is site.yml and the inventory file is hosts.ini.`,
prompt:`analyst@cfg-mgmt:~/ansible`,
q:`Run the two commands in order. Task 1: a dry-run of site.yml in check mode so nothing changes (--check enables check mode). Task 2: the real run against the inventory hosts.ini (the -i flag chooses the inventory file).`,
cmds:[
{hint:"Dry-run the playbook in check mode — the recap must say nothing was changed.",
accept:["^ansible-playbook(\\s+-i\\s+hosts\\.ini)?\\s+(--check|-C)\\s+site\\.yml$","^ansible-playbook(\\s+-i\\s+hosts\\.ini)?\\s+site\\.yml\\s+(--check|-C)$","^ansible-playbook\\s+(--check|-C)\\s+site\\.yml$"],
sample:"ansible-playbook --check site.yml",
out:`PLAY [configure web servers] ************

TASK [Gathering Facts] ************
ok: [web01]
ok: [web02]

TASK [install nginx] ************
changed: [web01]
changed: [web02]

PLAY RECAP ************
web01 : ok=2 changed=1 unreachable=0 failed=0
web02 : ok=2 changed=1 unreachable=0 failed=0
(dry run — no changes were made)`,
err:`ERROR: this is not an ansible-playbook check-mode run of site.yml. Keep the command family ansible-playbook, name site.yml, and add the --check flag.`},
{hint:"Now the real run against the inventory file.",
accept:["^ansible-playbook(\\s+-i\\s+hosts\\.ini)?\\s+site\\.yml(\\s+-i\\s+hosts\\.ini)?$","^ansible-playbook\\s+-i\\s+hosts\\.ini\\s+\\.\\/site\\.yml$"],
sample:"ansible-playbook -i hosts.ini site.yml",
out:`PLAY [configure web servers] ************

TASK [Gathering Facts] ************
ok: [web01]
ok: [web02]

TASK [install nginx] ************
changed: [web01]
changed: [web02]

PLAY RECAP ************
web01 : ok=2 changed=1 unreachable=0 failed=0
web02 : ok=2 changed=1 unreachable=0 failed=0`,
err:`ERROR: this is not a valid ansible-playbook invocation for this task. The expected shape is: ansible-playbook -i <inventory> <playbook>. Check the task wording and try again.`}],
hint:`Task 1 only adds the --check flag to the plain command. Task 2 is the classic shape: command name, then -i and the inventory, then the playbook file.`,
exp:`ansible-playbook --check site.yml simulates the run and reports what WOULD change without touching a host — the safe first step in production. ansible-playbook -i hosts.ini site.yml then applies the playbook to every host in the inventory: -i points Ansible at the inventory file, and the recap reports ok, changed and failed counts per host — "changed" means the task actually altered the host.`},

{id:"M16",theme:4,type:"fill",title:"Draft the patch policy",
sc:`GRC asked you to finish the draft patching policy. Fill the gaps with the governance keywords so the wording is precise.`,
q:`Complete the policy: 1) All non-production VMs are patched automatically every {{0}} (Saturday 02:00-06:00). 2) Before each run, the automation takes a {{1}} of the VM so a bad patch can be reverted. 3) Every run must record what it changed in the audit {{2}}. 4) Changes to production need an {{3}} before the window opens.`,
slots:[0,1,2,3],

hint:`Four gaps, four governance ideas: when it runs, the safety copy, the record, and the human sign-off.`,
exp:`A maintenance window defines when patching is allowed. A snapshot taken before the run is the rollback path. The audit log records every change for compliance, and an approval gate puts a human sign-off in front of production changes. Together these are the guardrails that make patch automation safe.`}

{id:"M18",theme:4,type:"multi",title:"What did automation actually deliver?",
sc:`Six months ago the platform team automated nightly backups, patching and tag enforcement. The quarterly review packet includes before/after numbers, and a manager asks you to separate real outcomes from wishful thinking.`,
q:`Select ALL the outcomes the ticket data actually supports.`,
opts:[
{t:`Patch compliance rose from 68% to 97% within the window`,ok:true},
{t:`Backup failures are now noticed in minutes instead of days`,ok:true},
{t:`Cloud spend fell 12% after orphaned untagged disks were cleaned up`,ok:true},
{t:`The company will never suffer a security incident again`},
{t:`Monitoring can now be switched off because jobs run themselves`}],
hint:`Real outcomes are measurable and bounded. Beware any claim with "never" or with the word "all" hiding inside.`,
exp:`The three supported outcomes are measurable and bounded: compliance up, detection time down, spend down. Automation never removes the need for monitoring or guarantees zero incidents — those two are overclaims. Automation reduces toil and human error; it does not remove the need to watch the systems.`},

{id:"M19",theme:3,type:"twopart",title:"The script that got 429",
sc:`Your provisioning script calls the cloud REST API. During a busy hour the log shows: "POST /v1/instances returned 429, header Retry-After: 30". A junior asks what to change.`,
p:[
{q:`Part A (blue team view): what does the 429 tell you?`,
opts:[
{t:`Too many requests in a short time — the API rate limit was hit`,ok:true},
{t:`The authentication token was rejected`},
{t:`The server crashed and needs a restart`},
{t:`The requested instance size does not exist`}]},
{q:`Part B (red team / resilience view): what should the script do about it?`,
opts:[
{t:`Retry later with exponential backoff, honoring the Retry-After header`,ok:true},
{t:`Send the requests again immediately in a tight loop`},
{t:`Ask for an administrator token to bypass the limit`},
{t:`Remove the retry logic so failures surface faster`}]}],
hint:`429 is not an error in your logic — it is the API asking you to slow down politely.`,
exp:`HTTP 429 means rate limiting: too many calls in a short window. The correct client behavior is to wait and retry with exponential backoff, respecting the Retry-After header. Hammering the API in a loop makes it worse, and rate limits exist to protect the service — an admin token will not (and should not) bypass them.`},

{id:"M20",theme:1,type:"qcm",title:"Drift and the golden image",
sc:`An audit finds 40 of 200 production VMs no longer match the approved baseline: admins hand-patched packages over months, so configurations now differ from the template in small ways.`,
q:`What is the fastest way to return to a known state AND stop the recurrence?`,
opts:[
{t:`Rebuild the drifted VMs from the updated golden image through IaC and block direct manual changes`,ok:true},
{t:`Ask an engineer to hand-fix each VM one by one to match the template`},
{t:`Delete the golden image so nobody can compare against it anymore`},
{t:`Export all VM configurations to a spreadsheet for the next audit`}],
hint:`Hand-fixing 40 VMs is the slow path, and it recreates the same drift next month.`,
exp:`Configuration drift is fixed by rebuilding from a fresh golden image via IaC — deterministic, fast and repeatable — and then blocking direct manual changes so drift cannot return. Hand-fixing is slow and itself drifts; deleting the reference makes things worse; spreadsheets do not enforce anything.`},

{id:"M21",theme:2,type:"dnd",title:"Deployment strategies",
sc:`The release guild asks you to update the cheat-sheet that explains deployment strategies to product owners.`,
q:`Drag each description onto the strategy it describes.`,
buckets:["Blue-green","Canary","Rolling"],
items:[
{t:`Two complete environments; traffic switches from one to the other at once`,b:0},
{t:`All traffic can move back instantly if the new environment misbehaves`,b:0},
{t:`A small slice of real users (1-5%) sees the new version first`,b:1},
{t:`The blast radius is limited by the share of traffic routed to the new version`,b:1},
{t:`Instances are replaced in small batches inside the same fleet`,b:2},
{t:`Capacity stays roughly constant; old and new mix during the rollout`,b:2}],
hint:`One strategy owns two environments, one owns a traffic percentage, one owns batches inside one fleet.`,
exp:`Blue-green keeps two full environments and switches traffic between them, which also makes rollback instant. Canary sends a small traffic slice first, so risk is capped by that slice. Rolling replaces instances batch by batch inside the same fleet, mixing versions during the rollout with little extra capacity needed.`},

q:`Fill the gaps: 1) The old cron "0 2 * * 1-5" ran {{0}} only, which is why weekend backups never fired. 2) The fixed cron "0 2 * * *" runs every day at {{1}}. 3) After the fix, the team also added a {{2}} alert so a scheduled job that never fires is noticed within minutes.`,
slots:[0,2,4],
bank:["weekdays","weekends","02:00","12:00","heartbeat","golden image"],
hint:`In cron the five fields are minute, hour, day-of-month, month, weekday, and a star means "every".`,
exp:`The old pattern "0 2 * * 1-5" means 02:00 on weekdays 1-5 only — the weekend WARN lines are correct. The fixed pattern "0 2 * * *" means minute 0, hour 2, every day: daily at 02:00. A heartbeat (or watchdog) alert fires when a scheduled job does NOT run, which is how missed backups get noticed in minutes instead of days.`},

{id:"M23",theme:3,type:"branch",title:"Secret in the build log",
sc:`A build log in the CI system printed DB_PASSWORD in clear text. The job ran on a shared runner and the log is visible to the whole engineering org. You lead the response.`,
q:`Work through the response decisions. Every path has four steps.`,
steps:[
{q:`The exposed credential is confirmed. What is the very first action?`,
opts:[
{t:`Revoke the exposed password and issue a new one from the vault`,ok:true},
{t:`Edit the log line so the password is no longer visible`},
{t:`Email the team asking them to please not look at the log`},
{t:`Wait for the next scheduled rotation window in 60 days`}]},
{q:`The password is rotated. What comes next?`,
opts:[
{t:`Purge the job log and add masking so secrets never echo again`,ok:true},
{t:`Nothing — rotated secrets are useless to attackers`},
{t:`Move the password into the YAML file, commented out`},
{t:`Delete the whole CI project and start a new one`}]},
{q:`Now add a guardrail so this class of leak is caught early. Which one?`,
opts:[
{t:`Add secret scanning to the pipeline so masked-but-leaked values trigger a build failure`,ok:true},
{t:`Require longer passwords — 64 characters or more`},
{t:`Rotate secrets once a year to reduce churn`},
{t:`Disable build logs entirely`}]},
{q:`Final step: how do you close this out properly?`,
opts:[
{t:`Verify the old password no longer works anywhere and document the incident in the audit record`,ok:true},
{t:`Assume the rotation worked; documentation slows teams down`},
{t:`Rerun the leaky build to confirm the log still prints`},
{t:`Post the new password in the ops chat channel for visibility`}]}],
hint:`Assume the secret is already in attacker hands the moment it is printed. Rotation first, cleanup second, prevention third.`,
exp:`Once a secret prints in a shared log, treat it as compromised: rotate first, because editing logs does not un-leak anything. Then purge the log and add masking, add secret scanning as a guardrail, and close by verifying the old value is dead and recording the incident. New secrets never go into chat files or commented YAML.`},

{id:"M24",theme:4,type:"multi",title:"Make prod automation safe",
sc:`The team wants a script that auto-remediates full disks in production. The safety review lists candidate controls; some are real, some are traps.`,
q:`Select ALL the controls that genuinely make a production auto-remediation script safe.`,
opts:[
{t:`A dry-run of the script in staging before it ever touches production`,ok:true},
{t:`The script runs under a least-privilege service account, not an admin key`,ok:true},
{t:`Every action the script takes is written to an audit log`,ok:true},
{t:`A change approval gate exists for the remediation policy itself`,ok:true},
{t:`The admin key is hardcoded in the script for reliability`},
{t:`Testing is skipped because the script is only twenty lines long`}],
hint:`Two traps flatter the script: convenience and brevity are not safety controls.`,
exp:`Safe automation means: rehearsed in staging, least privilege, fully audited, and the policy itself behind an approval gate. A hardcoded admin key is the single biggest risk — a leaked script becomes a skeleton key. Script length proves nothing; twenty lines can still delete the wrong volume.`}
);

{id:"M25",theme:1,type:"order",title:"Heal the configuration drift",
sc:`Nightly drift detection reports that prod VM set "web-fleet" no longer matches the Terraform baseline: two VMs have hand-installed packages and one has a firewall rule nobody can source. The team lead asks you to plan the cleanup.`,
q:`Order the remediation steps from first (position 1) to last (position 6).`,
items:[
{t:`Run drift detection and compare the fleet against the IaC baseline`},
{t:`Assess impact and get change approval for the fix`},
{t:`Update the IaC code so it describes the true desired state`},
{t:`Apply the change through the GitOps pipeline`},
{t:`Verify convergence and re-run the drift scan`},
{t:`Document the fix and refresh the golden image if packages changed`}],
hint:`Detect, approve, codify, apply, verify, document — the pipeline is the delivery road, not the decision.`,
exp:`Proper drift remediation runs detection first, gets approval, encodes the desired state in IaC, applies it through the GitOps pipeline (so the repo stays the source of truth), then verifies convergence with a fresh scan. Documentation and golden-image refresh stop the same drift from returning next month.`},

{id:"M26",theme:0,type:"qcm",title:"Deliver VMs in minutes, not days",
sc:`Developer teams currently wait three days for a test VM: they email the platform team, a human builds it by hand, and handover happens by chat message. Leadership wants self-service without losing governance.`,
q:`Which approach delivers this best?`,
opts:[
{t:`A self-service portal with a service catalog of pre-approved, policy-checked templates`,ok:true},
{t:`Give every developer console admin access so they can build whatever they need`},
{t:`A shared mailbox where requests are triaged manually each morning`},
{t:`A bigger ticket queue with three approval layers before any VM is built`}],
hint:`Self-service must keep the guardrails; speed with no governance is just a faster way to drift.`,
exp:`A service catalog behind a self-service portal offers pre-approved, policy-checked templates: developers pick what they need and get it in minutes, while guardrails (size limits, tags, approved images) are built in. Admin access for everyone removes governance, and both ticket approaches keep the human bottleneck.`},

{id:"M27",theme:3,type:"fill",title:"Call the REST API properly",
sc:`The provisioning script talks to the cloud REST API directly. A reviewer left blanks in the documentation for you to complete.`,
q:`Complete the call description: the script sends {{0}} /v1/instances with the header "Authorization: Bearer {{1}}" to prove who it is. The request body is written as {{2}} so every cloud tool can read it.`,
slots:[0,1,2],
bank:["POST","GET","DELETE","token","JSON","YAML","XML","Basic"],
hint:`Creating a resource needs the method for creation, a bearer credential in the header, and the payload format machines share.`,
exp:`Creating a resource uses POST (GET reads, DELETE removes). The Authorization: Bearer header carries the access token that proves the caller's identity. JSON is the standard machine-readable body format for REST APIs. Together these three facts describe an authenticated, well-formed API call.`},

{id:"M28",theme:4,type:"dnd",title:"Match use case to benefit",
sc:`You are preparing a one-slide summary titled "Why we automate". Each automation win supports a different pillar.`,
q:`Drag each use case onto the pillar it mainly serves.`,
buckets:["Cost","Reliability","Security","Speed of delivery"],
items:[
{t:`Scheduled shutdown of dev VMs every night`,b:0},
{t:`Weekly cleanup of orphaned disks and old snapshots`,b:0},
{t:`Auto-scaling adds web servers when CPU stays high`,b:1},
{t:`Failed instances are replaced automatically by the group`,b:1},
{t:`API keys rotate automatically every 30 days`,b:2},
{t:`One-click templates from the service catalog`,b:3}],
hint:`Two pillars get two items each. Ask: does it save money, keep service up, reduce risk, or shorten wait time?`,
exp:`Shutdown schedules and orphan cleanup cut spend (cost). Auto-scaling and self-healing replacements keep the service up (reliability). Automatic key rotation shrinks the window a stolen key is useful (security). Catalog templates collapse delivery time from days to minutes (speed).`},

{id:"M29",theme:4,type:"twopart",title:"Auto-scaling under load",
sc:`Your web tier sits in an auto-scaling group. Policy: add one server when average CPU stays above 80% for 5 minutes; remove one when it drops below 30% for 15 minutes. During a launch campaign the group grew from 4 to 9 servers.`,
p:[
{q:`Part A: what is this mechanism called?`,
opts:[
{t:`Reactive auto-scaling driven by a metric threshold`,ok:true},
{t:`Scheduled scaling driven by a calendar`},
{t:`Manual scaling by an operator`},
{t:`Load balancing across availability zones`}]},
{q:`Part B: why does the policy also define a cooldown between scaling actions?`,
opts:[
{t:`So the group does not add and remove servers in rapid bursts while metrics settle`,ok:true},
{t:`Because every scale event must be reported to finance`},
{t:`To force a full restart of the web tier after scaling`},
{t:`Cooldowns are only needed for databases, not web tiers`}]}],
hint:`Think about what CPU looks like right after new servers join: the average needs time to fall.`,
exp:`This is reactive auto-scaling: a metric crosses a threshold and the group responds. The cooldown exists because right after adding servers, CPU takes minutes to settle — without a pause the group would add more, then remove them, flapping up and down. Cooldowns make scaling cheap, stable and predictable.`},

{id:"M30",theme:2,type:"qcm",title:"Key committed to the repo",
sc:`The pipeline's secret scanner failed a build: commit 4a91f2 added a cloud API secret into application code. The push happened two days ago to a private repository with three active clones.`,
q:`What is the correct first action?`,
opts:[
{t:`Revoke and rotate the exposed secret immediately, then clean the history`,ok:true},
{t:`Revert the commit — once it is gone from the code, the secret is safe`},
{t:`Make the repository private so the secret cannot be seen anymore`},
{t:`Leave it: the repo is private and only three people have clones`}],
hint:`Version control keeps every version forever, and clones already exist outside your control.`,
exp:`In version control, deleting or reverting a file does not remove it from history, and three clones already hold copies. The exposed secret must be treated as compromised: revoke and rotate first, then purge history. Privacy of the repo does not matter once the secret has been pushed and cloned.`}
);

  else if(ex.type==="order")a={rows:null};

  else if(ex.type==="terminal")a={rows:ex.cmds.map(function(){return {cmd:"",ok:false,hist:[]};})};
  else if(ex.type==="match")a={sel:ex.pairs.map(function(){return -1;})};
  else if(ex.type==="spot")a={sel:-1};
  else if(ex.type==="prio")a={ranks:null};
  else if(ex.type==="twopart")a={sel:[-1,-1]};
  else a={pick:[],done:false};
  S.ans[S.idx]=a;return a;
}
function ensureDisp(ex){
  if(S.dispOrder[S.idx])return S.dispOrder[S.idx];
  var d={};
  if(ex.type==="qcm"||ex.type==="multi")d.opt=shuffle(keys(ex.opts.length));
  else if(ex.type==="dnd")d.itm=shuffle(keys(ex.items.length));
  else if(ex.type==="order")d.rows=shuffle(keys(ex.items.length));
  else if(ex.type==="fill")d.bank=shuffle(keys(ex.bank.length));
  else if(ex.type==="match")d.rt=shuffle(keys(ex.pairs.length));
  else if(ex.type==="prio")d.itm=shuffle(keys(ex.items.length));
  else if(ex.type==="twopart")d.opt=ex.p.map(function(p){return shuffle(keys(p.opts.length));});
  else if(ex.type==="branch")d.opt=ex.steps.map(function(s){return shuffle(keys(s.opts.length));});
  S.dispOrder[S.idx]=d;return d;
}

function nextExercise(){
  S.checkPause=false;
  if(S.idx>=EX.length-1){finish(false);return;}
  S.idx++;render();focusQ();
}
function doCheck(){
  var ex=cur(),a=ensureAns(ex);
  if(ex.type==="branch"&&!a.done){toast("Finish the scenario first — answer every step.");return;}
  if(ex.type==="spot"&&a.sel<0){toast("Click the line you think contains the mistake first.");return;}
  if(ex.type==="match"&&a.sel.every(function(s){return s<0;})){toast("Choose a match for at least one item first.");return;}
  var v=validate(ex,a,S.idx);if(v==null)return;
  var hmul=Math.max(0.5,1-0.1*(S.hints[S.idx]||0));
  S.earned[S.idx]=v.frac*hmul;
  S.checked[S.idx]=true;S.skip[S.idx]=false;S.checkPause=true;
  render();
  var fb=$("#fbPanel");if(fb)fb.scrollIntoView({block:"nearest",behavior:reduced()?"auto":"smooth"});
}
function doSkip(){S.skip[S.idx]=true;nextExercise();}
function doHint(){S.hints[S.idx]=(S.hints[S.idx]||0)+1;render();}
function doRevise(){
  S.checked[S.idx]=false;delete S.earned[S.idx];delete S.marks[S.idx];S.checkPause=false;
  if(cur().type==="branch"){var a=S.ans[S.idx];a.pick=[];a.done=false;}
  render();focusQ();
}

/* ---------- answer builders ---------- */
function buildAnswer(ex,host){

      t.appendChild(tt);
      t.appendChild(el("div","thost",esc(ex.prompt||"analyst@jumpbox:~")+" — task "+(ci+1)));
      var hist=el("div","term");
      a.rows[ci].hist.forEach(function(l){hist.appendChild(termLine(l));});
      t.appendChild(hist);
      var row=el("div","trow");
      row.appendChild(el("span","ps1","$"));
      var inp=el("input","tin");inp.type="text";inp.value=a.rows[ci].cmd;inp.autocomplete="off";inp.spellcheck=false;
      inp.setAttribute("aria-label","terminal command input, task "+(ci+1));
      inp.setAttribute("data-ti",ci);
      row.appendChild(inp);
      var run=el("button","btn small","Run");run.type="button";run.setAttribute("data-run",ci);
      row.appendChild(run);
      t.appendChild(row);wall.appendChild(t);
    });

  }else if(ex.type==="match"){

  }else if(ex.type==="spot"){
    var sw=el("div","slines");
    ex.lines.forEach(function(ln,i){
      var st=(m&&m.line&&m.line[i])||"";
      var b=el("button","sline"+(a.sel===i?" sel":"")+(st?" "+st:""),esc(ln));

      cu.appendChild(rs);
      wrap.appendChild(cu);
    }else{
      wrap.appendChild(el("p","mut","Scenario complete — press Check to score all "+ex.steps.length+" decisions."));
    }

  }

function paintFill(ex,idx){

/* ---------- answer events ---------- */
function bindAnswerEvents(ex,card){
  var a=ensureAns(ex);
  card.addEventListener("change",function(ev){
    var t=ev.target;
    if(t.matches("input[type=radio][data-k]")&&!t.hasAttribute("data-p")){a.sel=parseInt(t.getAttribute("data-k"),10);S.touched[S.idx]=true;refreshSel(card);}
    else if(t.matches("input[type=checkbox][data-k]")){var k=parseInt(t.getAttribute("data-k"),10);var i=a.sel.indexOf(k);if(i>=0)a.sel.splice(i,1);else a.sel.push(k);S.touched[S.idx]=true;}
    else if(t.matches("input[type=radio][data-p]")){a.sel[parseInt(t.getAttribute("data-p"),10)]=parseInt(t.getAttribute("data-k"),10);S.touched[S.idx]=true;}
  });
  if(ex.type==="dnd"){
    card.addEventListener("click",function(ev){
      if(S.checked[S.idx])return;
      var it=ev.target.closest(".itm");
      if(it){
        var k=parseInt(it.getAttribute("data-k"),10);
        if(it.closest(".bzone")){a.place[k]=-1;paintDnd(ex,S.idx);S.touched[S.idx]=true;return;}
        S.selItm=(S.selItm===k?null:k);
        card.querySelectorAll(".itm").forEach(function(x){x.classList.remove("sel");});
        if(S.selItm!==null){
          var sc=card.querySelector(".itm[data-k='"+S.selItm+"']");
          if(sc)sc.classList.add("sel");
        }
        S.touched[S.idx]=true;return;
      }
      var bz=ev.target.closest(".bucket");
      if(bz&&S.selItm!==null){
        a.place[S.selItm]=parseInt(bz.getAttribute("data-b"),10);S.selItm=null;
        paintDnd(ex,S.idx);S.touched[S.idx]=true;
      }
    });
    card.addEventListener("dragstart",function(ev){
      var it=ev.target.closest(".itm");if(!it)return;
      S.dragItm=parseInt(it.getAttribute("data-k"),10);
      try{ev.dataTransfer.setData("text/plain","");}catch(e){}
    });
    card.addEventListener("dragover",function(ev){
      var b=ev.target.closest(".bucket");if(b&&S.dragItm!==null){ev.preventDefault();b.classList.add("over");}
    });
    card.addEventListener("dragleave",function(ev){
      var b=ev.target.closest(".bucket");if(b)b.classList.remove("over");
    });
    card.addEventListener("drop",function(ev){
      var b=ev.target.closest(".bucket");if(!b||S.dragItm===null)return;
      ev.preventDefault();b.classList.remove("over");
      a.place[S.dragItm]=parseInt(b.getAttribute("data-b"),10);S.dragItm=null;
      paintDnd(ex,S.idx);S.touched[S.idx]=true;
    });
  }
  if(ex.type==="order"){
    card.addEventListener("click",function(ev){
      var b=ev.target.closest(".arrow");if(!b||S.checked[S.idx])return;
      var p=parseInt(b.getAttribute("data-p"),10),mv=parseInt(b.getAttribute("data-mv"),10);
      var q=p+mv;if(q<0||q>=a.rows.length)return;
      var t=a.rows[p];a.rows[p]=a.rows[q];a.rows[q]=t;
      S.touched[S.idx]=true;render();focusQ();
    });
  }
  if(ex.type==="fill"){
    card.addEventListener("click",function(ev){
      if(S.checked[S.idx])return;
      var bl=ev.target.closest(".blk");
      if(bl){delete a.slots[bl.getAttribute("data-slot")];paintFill(ex,S.idx);S.touched[S.idx]=true;return;}
      var w=ev.target.closest(".word");
      if(w){
        var wk=w.getAttribute("data-w");
        for(var s in a.slots){if(a.slots[s]===wk)return;}
        var target=null;
        document.querySelectorAll(".blk").forEach(function(x){var n=x.getAttribute("data-slot");if(target===null&&a.slots[n]===undefined)target=n;});
        if(target!==null){a.slots[target]=wk;paintFill(ex,S.idx);S.touched[S.idx]=true;}
      }
    });
  }
  if(ex.type==="terminal"){
    card.addEventListener("input",function(ev){
      var t=ev.target;
      if(t.matches("input.tin")&&t.hasAttribute("data-ti")){
        a.rows[parseInt(t.getAttribute("data-ti"),10)].cmd=t.value;
        S.touched[S.idx]=true;
      }
    });
    card.addEventListener("keydown",function(ev){
      if(ev.key!=="Enter")return;
      var t=ev.target;
      if(t.matches&&t.matches("input.tin")&&t.hasAttribute("data-ti")){
        ev.preventDefault();
        var runBtn=card.querySelector("[data-run='"+t.getAttribute("data-ti")+"']");
        if(runBtn)runBtn.click();
      }
    });
    card.addEventListener("click",function(ev){
      var b=ev.target.closest("[data-run]");
      if(!b||S.checked[S.idx])return;
      var ci=parseInt(b.getAttribute("data-run"),10);
      var inp=card.querySelector("input.tin[data-ti='"+ci+"']");
      if(!inp)return;
      var cmd=inp.value.trim();if(!cmd)return;
      var r=a.rows[ci];r.cmd=cmd;S.touched[S.idx]=true;
      var norm=cmd.toLowerCase().replace(/\s+/g," ");
      r.ok=(ex.cmds[ci].accept||[]).some(function(rx){return new RegExp(rx,"i").test(norm);});
      r.hist.push("$ "+cmd);
      var hist=card.querySelectorAll("div.term")[ci];
      hist.appendChild(termLine("$ "+cmd));
      hist.appendChild(termLine(r.ok?ex.cmds[ci].out:ex.cmds[ci].err));
      hist.scrollTop=hist.scrollHeight;
      inp.value="";r.cmd="";inp.focus();
    });
    if(S.checked[S.idx]){
      card.querySelectorAll("input.tin").forEach(function(x){x.disabled=true;});
      card.querySelectorAll("[data-run]").forEach(function(x){x.disabled=true;});
    }
  }
  if(ex.type==="match"){
    card.addEventListener("change",function(ev){
      var t=ev.target;
      if(t.matches&&t.matches("select[data-mi]")&&!S.checked[S.idx]){
        a.sel[parseInt(t.getAttribute("data-mi"),10)]=parseInt(t.value,10);
        S.touched[S.idx]=true;
      }
    });
  }
  if(ex.type==="spot"){
    card.addEventListener("click",function(ev){
      var b=ev.target.closest(".sline");
      if(!b||S.checked[S.idx])return;
      a.sel=parseInt(b.getAttribute("data-li"),10);
      card.querySelectorAll(".sline").forEach(function(x){x.classList.toggle("sel",x===b);});
      S.touched[S.idx]=true;
    });
  }
  if(ex.type==="prio"){
    card.addEventListener("change",function(ev){
      var t=ev.target;
      if(!t.matches||!t.matches("select[data-pi]")||S.checked[S.idx])return;
      var k=parseInt(t.getAttribute("data-pi"),10),v=parseInt(t.value,10);
      if(a.ranks[k]===v)return;
      for(var j=0;j<a.ranks.length;j++){if(j!==k&&a.ranks[j]===v){a.ranks[j]=a.ranks[k];break;}}
      a.ranks[k]=v;
      S.touched[S.idx]=true;
      render();focusQ();
    });
  }
  if(ex.type==="branch"){
    card.addEventListener("click",function(ev){
      var b=ev.target.closest(".optb");
      if(b&&!S.checked[S.idx]){
        var k=parseInt(b.getAttribute("data-k"),10);
        a.pick.push(k);
        if(a.pick.length>=ex.steps.length)a.done=true;
        S.touched[S.idx]=true;render();focusQ();return;
      }
      var r=ev.target.closest("#breset");
      if(r&&!S.checked[S.idx]){a.pick=[];a.done=false;delete S.marks[S.idx];render();focusQ();}
    });
  }
}
function refreshSel(card){
  card.querySelectorAll(".opt").forEach(function(o){
    var inp=o.querySelector("input");
    o.classList.toggle("sel",inp.checked);
  });
}

/* ---------- validation ---------- */
function validate(ex,a,idx){
  var m={};S.marks[idx]=m;
  var i;
  if(ex.type==="qcm"){
    var okk=okKeys(ex.opts);
    m.opt={};
    okk.forEach(function(k){m.opt[k]="miss";});
    if(a.sel>=0)m.opt[a.sel]=okk.indexOf(a.sel)>=0?"ok":"bad";
    return {frac:a.sel>=0&&okk.indexOf(a.sel)>=0?1:0};
  }
  if(ex.type==="multi"){
    var okk2=okKeys(ex.opts);m.opt={};var hit=0;
    okk2.forEach(function(k){m.opt[k]="miss";});
    a.sel.forEach(function(k){m.opt[k]=okk2.indexOf(k)>=0?"ok":"bad";});
    okk2.forEach(function(k){if(a.sel.indexOf(k)>=0){hit++;}});
    return {frac:hit/okk2.length};
  }
  if(ex.type==="dnd"){
    m.item={};var good=0;
    ex.items.forEach(function(it,k){
      var p=a.place[k]===undefined?-1:a.place[k];
      if(p<0)m.item[k]="miss";
      else if(p===it.b){m.item[k]="ok";good++;}
      else m.item[k]="bad";
    });
    return {frac:good/ex.items.length};
  }
  if(ex.type==="order"){
    m.pos=[];var g2=0;
    for(i=0;i<a.rows.length;i++){var ok3=a.rows[i]===i;m.pos.push(ok3?"ok":"bad");if(ok3)g2++;}
    return {frac:g2/a.rows.length};
  }
  if(ex.type==="fill"){
    m.slot={};var g3=0;
    ex.slots.forEach(function(bk,si){
      var v=a.slots[si];
      if(v===undefined||v===null)m.slot[si]="miss";
      else if(String(v)===String(bk)){m.slot[si]="ok";g3++;}
      else m.slot[si]="bad";
    });
    return {frac:g3/ex.slots.length};
  }
  if(ex.type==="terminal"){
    m.term=[];var gt=0;
    ex.cmds.forEach(function(c,ci){
      var r=a.rows[ci];
      if(!r||!r.hist.length)m.term.push("miss");
      else if(r.ok){m.term.push("ok");gt++;}
      else m.term.push("bad");
    });
    return {frac:gt/ex.cmds.length};
  }
  if(ex.type==="match"){
    var rt=S.dispOrder[idx]&&S.dispOrder[idx].rt?S.dispOrder[idx].rt:keys(ex.pairs.length);
    m.row=[];var gm=0;
    ex.pairs.forEach(function(p,pi){
      var s=a.sel[pi];
      if(s<0)m.row.push("miss");
      else if(s===rt.indexOf(pi)){m.row.push("ok");gm++;}
      else m.row.push("bad");
    });
    return {frac:gm/ex.pairs.length};
  }
  if(ex.type==="spot"){
    m.line={};
    var gsp=a.sel===ex.bad?1:0;
    ex.lines.forEach(function(ln,i){
      if(i===a.sel)m.line[i]=gsp?"ok":"bad";
      else if(i===ex.bad&&!gsp)m.line[i]="miss";
    });
    return {frac:gsp};
  }
  if(ex.type==="prio"){
    m.rank=[];var gp=0;
    ex.items.forEach(function(it,k){
      var r=a.ranks? a.ranks[k]:0;
      if(r===k+1){m.rank.push("ok");gp++;}
      else m.rank.push("bad");
    });
    return {frac:gp/ex.items.length};
  }
  if(ex.type==="twopart"){
    m.partMarks=[];var g4=0;
    ex.p.forEach(function(p,pi){
      var okk3=okKeys(p.opts),sel=a.sel[pi];
      if(sel>=0&&okk3.indexOf(sel)>=0){m.partMarks[pi]={k:sel,st:"ok"};g4++;}
      else if(sel>=0)m.partMarks[pi]={k:sel,st:"bad"};
      else m.partMarks[pi]={k:-1,st:"miss"};
    });
    return {frac:g4/2};
  }
  if(ex.type==="branch"){
    m.step=[];var g5=0;
    a.pick.forEach(function(k,si){
      var ok4=ex.steps[si].opts[k].ok;m.step.push(ok4?"ok":"bad");if(ok4)g5++;
    });
    return {frac:g5/ex.steps.length};
  }
  return {frac:0};
}
function okKeys(opts){var r=[];opts.forEach(function(o,k){if(o.ok)r.push(k);});return r;}

/* ---------- reprs ---------- */
function youRepr(ex,pos){
  var a=S.ans[pos];
  if(!a)return "—";
  if(ex.type==="qcm")return a.sel>=0?esc(ex.opts[a.sel].t):"(nothing selected)";
  if(ex.type==="multi")return a.sel.length?a.sel.map(function(k){return esc(ex.opts[k].t);}).join(" · "):"(nothing selected)";
  if(ex.type==="dnd")return ex.items.map(function(it,k){var p=a.place[k];return "Item "+(k+1)+" → "+((p===undefined||p<0)?"not placed":esc(ex.buckets[p]));}).join(" · ");
  if(ex.type==="order")return (a.rows||[]).map(function(k,p){return (p+1)+". "+esc(ex.items[k].t);}).join(" ");
  if(ex.type==="fill")return ex.slots.map(function(bk,si){var v=a.slots[si];return (si+1)+": "+(v===undefined?"—":esc(ex.bank[v]));}).join(" · ");
  if(ex.type==="terminal")return (a.rows||[]).map(function(r,ci){return "Task "+(ci+1)+": "+(r.hist.length?esc(r.hist[0].slice(2)):"not run");}).join(" · ");
  if(ex.type==="match"){var rt2=S.dispOrder[pos]&&S.dispOrder[pos].rt;return ex.pairs.map(function(p,pi){var s=a.sel[pi];var ri=(rt2&&s>=0)?rt2[s]:-1;return esc(p.l)+" → "+(ri>=0?esc(ex.pairs[ri].r):"—");}).join(" · ");}
  if(ex.type==="spot")return a.sel>=0?esc(ex.lines[a.sel]):"(nothing selected)";
  if(ex.type==="prio")return (a.ranks||[]).map(function(r,k){return "P"+r+": "+esc(ex.items[k].t);}).join(" · ");
  if(ex.type==="twopart")return "A: "+(a.sel[0]>=0?esc(ex.p[0].opts[a.sel[0]].t):"—")+" · B: "+(a.sel[1]>=0?esc(ex.p[1].opts[a.sel[1]].t):"—");
  if(ex.type==="branch")return (a.pick||[]).map(function(k,si){return (si+1)+". "+esc(ex.steps[si].opts[k].t);}).join(" ");
  return "—";
}
function correctRepr(ex){
  if(ex.type==="qcm")return esc(ex.opts[okKeys(ex.opts)[0]].t);
  if(ex.type==="multi")return okKeys(ex.opts).map(function(k){return esc(ex.opts[k].t);}).join(" · ");
  if(ex.type==="dnd")return ex.items.map(function(it,k){return "Item "+(k+1)+" → "+esc(ex.buckets[it.b]);}).join(" · ");
  if(ex.type==="order")return ex.items.map(function(it,p){return (p+1)+". "+esc(it.t);}).join(" ");
  if(ex.type==="fill")return ex.slots.map(function(bk,si){return (si+1)+": "+esc(ex.bank[bk]);}).join(" · ");
  if(ex.type==="terminal")return ex.cmds.map(function(c,ci){return "Task "+(ci+1)+": "+esc(c.sample);}).join(" · ");
  if(ex.type==="match")return ex.pairs.map(function(p){return esc(p.l)+" → "+esc(p.r);}).join(" · ");
  if(ex.type==="spot")return esc(ex.lines[ex.bad]);
  if(ex.type==="prio")return ex.items.map(function(it,k){return "P"+(k+1)+": "+esc(it.t);}).join(" · ");
  if(ex.type==="twopart")return "A: "+esc(ex.p[0].opts[okKeys(ex.p[0].opts)[0]].t)+" · B: "+esc(ex.p[1].opts[okKeys(ex.p[1].opts)[0]].t);
  if(ex.type==="branch")return ex.steps.map(function(st,si){return (si+1)+". "+esc(correctOpt(st));}).join(" ");
  return "—";
}

/* ---------- feedback ---------- */
function feedbackPanel(ex){
  var f=S.earned[S.idx]||0,pts=Math.round(f*100)/10;
  var lbl=f>=0.999?"FULL":(f>0?"PARTIAL":"ZERO");
  var p=el("div","fb "+(f>=0.999?"ok":(f>0?"part":"bad")));
  p.id="fbPanel";p.setAttribute("role","status");
  var ic=f>=0.999?"&#10003;":(f>0?"&#9887;":"&#10007;");
  p.appendChild(el("div","fbscore",ic+" You earned <b>"+pts+" / 10 points</b> on this exercise — "+lbl+(S.hints[S.idx]?" (hint cost included)":"")));
  if(f<0.999)p.appendChild(el("div","fbcorr","<b>Correct answer:</b> "+correctRepr(ex)));
  p.appendChild(el("div","fbexp",esc(ex.exp)));
  return p;
}

/* ---------- toast ---------- */
function toast(msg){
  var t=el("div","toast",esc(msg));t.setAttribute("role","alert");
  document.body.appendChild(t);
  setTimeout(function(){t.classList.add("show");},10);
  setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove();},400);},3200);
}

/* ---------- finish & results ---------- */
function hasAnswer(ex,a){
  if(!a)return false;
  if(ex.type==="qcm")return a.sel>=0;
  if(ex.type==="multi")return a.sel.length>0;
  if(ex.type==="dnd")return Object.keys(a.place).some(function(k){return a.place[k]>=0;});
  if(ex.type==="order")return !!a.rows;
  if(ex.type==="fill")return Object.keys(a.slots).length>0;
  if(ex.type==="terminal")return !!(a.rows&&a.rows.some(function(r){return r.hist&&r.hist.length;}));
  if(ex.type==="match")return a.sel.some(function(s){return s>=0;});
  if(ex.type==="spot")return a.sel>=0;
  if(ex.type==="prio")return !!a.ranks;
  if(ex.type==="twopart")return a.sel[0]>=0||a.sel[1]>=0;
  if(ex.type==="branch")return a.done;
  return false;
}
function finish(auto){
  var pos,ex;
  for(pos=0;pos<EX.length;pos++){
    if(S.skip[pos])continue;
    ex=EX[S.order[pos]];
    if(!S.checked[pos]){
      var a=S.ans[pos];
      if(S.touched[pos]&&hasAnswer(ex,a)){
        var v=validate(ex,a,pos);
        var hmul=Math.max(0.5,1-0.1*(S.hints[pos]||0));
        S.earned[pos]=v.frac*hmul;S.checked[pos]=true;
      }else{
        S.skip[pos]=true;
      }
    }
  }
  var answered=[];
  for(pos=0;pos<EX.length;pos++){if(!S.skip[pos])answered.push(pos);}
  if(answered.length===0){
    if(!auto){toast("Answer at least one exercise before finishing — every exercise is skipped.");return;}
    S.phase="results";S.noScore=true;render();return;
  }
  S.phase="results";S.noScore=false;S.answered=answered;
  var sc=Math.round(sumFrac()*100)/100;
  S.pct=Math.round(sc/answered.length*100);
  render();
  reportScore(sc,answered.length,auto);
  animateScore();
}
function sumFrac(){var v=0;S.answered.forEach(function(pos){v+=S.earned[pos]||0;});return v;}
function scoreDetails(){
  return S.order.map(function(ei,pos){
    var ex=EX[ei],er=S.earned[pos],sk=S.skip[pos];
    return {n:pos+1,id:ex.id,title:ex.title,type:ex.type,theme:THEMES[ex.theme],points:10,
      earned:Math.round((sk?0:(er||0))*100)/10,
      status:sk?"skipped":(er>=0.999?"correct":(er>0?"partial":"wrong"))};
  });
}
function reportScore(correct,total,auto){
  if(S.reported)return;
  S.reported=true;
  try{
    if(!(window.parent&&window.parent!==window))return;
    var percent=Math.round((correct/total)*100);
    var p={type:"CYBERPULSE_SCORE",topicId:(S.params&&S.params.topicId)||META.topicId,chapter:META.chapter,
      title:META.title,difficulty:META.difficulty,score:correct,total:total,percent:percent,passed:percent>=CFG.pass,
      attempt:S.attempt||1,finishedBy:auto?"timeout":"submit",durationUsedSec:Math.max(0,CFG.total-Math.max(0,S.remaining)),
      details:scoreDetails()};
    if(S.user)p.username=S.user;
    ["country","locale","theme","batch"].forEach(function(k){
      if(S.params&&S.params[k]!=null)p[k]=S.params[k];
    });
    window.parent.postMessage(p,"*");
  }catch(e){}
}
function animateScore(){
  var pct=S.pct,e1=$("#resPct");
  if(!e1||reduced()){if(e1)e1.textContent=pct+"%";return;}
  var cur1=0,step=Math.max(1,Math.ceil(pct/40));
  var iv=setInterval(function(){
    if(S.phase!=="results"){clearInterval(iv);return;}
    cur1=Math.min(pct,cur1+step);
    e1.textContent=cur1+"%";
    if(cur1>=pct)clearInterval(iv);
  },25);
}
function viewResults(){
  var c=el("div");
  var passed=!S.noScore&&S.pct>=CFG.pass;
  var banner=el("div","resbanner "+(S.noScore?"none":(passed?"pass":"fail")));
  if(S.noScore){
    banner.innerHTML="<h1>No exercises were answered</h1><p>Every exercise was skipped, so there is nothing to score. Retake the exam and answer at least one exercise.</p>";
  }else{
    banner.innerHTML=passed?
      "<h1>&#10003; PASS</h1><p class='bigp'>You reached <b id='resPct'>0%</b> — the pass mark is "+CFG.pass+"%.</p><p class='mut'>Certificate-style credit: "+esc(META.title)+" — "+esc(META.difficulty.toUpperCase())+" attempt completed in "+fmtT(CFG.total-Math.max(0,S.remaining))+" of exam time.</p>":
      "<h1>&#10007; FAIL</h1><p class='bigp'>You reached <b id='resPct'>0%</b> — the pass mark is "+CFG.pass+"%.</p><p class='mut'>You must retake this exam. Study the report below, then press Retake Exam.</p>";
  }
  c.appendChild(banner);
  if(!S.noScore){
    var skipped=[];for(var pos=0;pos<EX.length;pos++){if(S.skip[pos])skipped.push(pos);}
    var stats=el("div","statrow");
    stats.appendChild(el("div","stat","<span class='sv'>"+(Math.round(sumFrac()*10)/10)+"</span><span class='sl'>points earned (max "+(S.answered.length*10)+")</span>"));
    stats.appendChild(el("div","stat","<span class='sv'>"+S.answered.length+"</span><span class='sl'>exercises scored</span>"));
    stats.appendChild(el("div","stat","<span class='sv'>"+skipped.length+"</span><span class='sl'>skipped (excluded)</span>"));
    stats.appendChild(el("div","stat","<span class='sv'>"+fmtT(CFG.total-Math.max(0,S.remaining))+"</span><span class='sl'>time used</span>"));
    c.appendChild(stats);
    var th=el("div","card","<div class='lbl'>Progress per theme</div>");
    THEMES.forEach(function(tn,ti){
      var e=0,n=0;
      S.answered.forEach(function(pos){if(EX[S.order[pos]].theme===ti){e+=S.earned[pos]||0;n++;}});
      if(!n)return;
      var w=Math.round(e/n*100);
      th.appendChild(el("div","themebar","<div class='tl'>"+esc(tn)+" — "+(Math.round(e*10)/10)+" / "+(n*10)+" pts</div><div class='tb'><div class='tbf' style='width:"+w+"%'></div></div>"));
    });
    c.appendChild(th);
    if(skipped.length){
      c.appendChild(el("div","card skipnote","<div class='lbl'>Skipped exercises — not counted</div><p>The following exercises were skipped and are <b>excluded from both score and total</b>: "+skipped.map(function(pos){return "Exercise "+(pos+1);}).join(", ")+". Their explanations still appear in the report below so you can learn from them.</p>"));
    }
    var rep=el("div","card","<div class='lbl'>Detailed report</div>");
    var tab=el("table","rtable");
    tab.innerHTML="<thead><tr><th>#</th><th>Exercise</th><th>Your answer</th><th>Correct answer</th><th>Points</th><th>Result</th><th>Why</th></tr></thead><tbody></tbody>";
    var tb=tab.querySelector("tbody");
    S.order.forEach(function(ei,pos){
      var ex=EX[ei],sk=S.skip[pos],er=S.earned[pos],lb=sk?"SKIPPED":(er>=0.999?"FULL":(er>0?"PARTIAL":"ZERO"));
      var tr=el("tr",sk?"rskip":(er>=0.999?"rok":(er>0?"rpart":"rbad")));
      tr.appendChild(el("td",null,String(pos+1)));
      tr.appendChild(el("td",null,esc(ex.title)+"<br><span class='mut'>"+esc(TYPELBL[ex.type])+" · "+esc(THEMES[ex.theme])+"</span>"));
      tr.appendChild(el("td",null,sk?"<span class='mut'>not answered</span>":youRepr(ex,pos)));
      tr.appendChild(el("td",null,correctRepr(ex)));
      tr.appendChild(el("td",null,sk?"—":(Math.round((er||0)*100)/10)+" / 10"));
      tr.appendChild(el("td","lblcell "+lb.toLowerCase(),lb));
      tr.appendChild(el("td","why",esc(ex.exp)));
      tb.appendChild(tr);
    });
    rep.appendChild(tab);
    c.appendChild(rep);
  }
  var rw=el("div","startrow");
  var rt=el("button","btn primary big","Retake Exam");rt.type="button";
  rt.addEventListener("click",startExam);
  rw.appendChild(rt);
  c.appendChild(rw);
  return c;
}

/* ---------- boot ---------- */
/* Backward-compatible terminal shape: single-command data becomes a one-task multi-command exercise */
EX.forEach(function(ex){
  if(ex.type==="terminal"&&!ex.cmds){
    ex.cmds=[{sample:ex.sample,accept:ex.accept,out:ex.out,err:ex.err,hint:""}];
  }
});
render();
