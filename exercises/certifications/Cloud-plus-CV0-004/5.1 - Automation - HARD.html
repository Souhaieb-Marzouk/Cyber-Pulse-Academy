`Oct 12 02:15:03 audit svc-deploy token=tk_7781 action=DeleteTrail result=OK src=51[.]19[.]8[.]77`,
`Oct 12 02:15:40 audit svc-report token=tk_4411 action=GetObject key=reports/daily.pdf result=OK src=10[.]0[.]4[.]31`,

`Oct 12 02:19:10 audit svc-report token=tk_4411 action=GetObject key=reports/daily.pdf result=OK src=10[.]0[.]4[.]31`],
q:`Select ALL the true statements about this sequence.`,
opts:[

{id:"H2",theme:1,type:"qcm",title:"The state lock that will not move",
sc:`Two engineers ran terraform apply against the same configuration yesterday, and the CI runner crashed mid-apply. Today every apply prints the same output:`,
code:{name:"apply output",lines:[
`Error: Error acquiring the state lock`,
``,
`Lock Info:`,
`  ID:      7f3c9e21-4a10-9f55-8e77-1c2b33aa90e1`,
`  Who:     ci-runner@build-03`,
`  Created: 2025-11-04T09:12:44Z`,
``,
`Terraform acquires a state lock to protect the state from concurrent writes.`]},
q:`What is the correct action?`,
opts:[
{t:`Verify no apply is actually running, remove the stale lock, then run plan before applying again`,ok:true},
{t:`Delete the state file and import every existing resource from scratch`},
{t:`Delete the storage bucket that holds the state and start a new one`},
{t:`Run apply with -refresh=false so the lock is skipped`}],
hint:`The lock protects a file that remembers everything you built. Which option destroys that memory?`,
exp:`A stale lock from the crashed runner is released with force-unlock after confirming nothing is running — then plan previews the real diff. The state file is the record of what Terraform manages: deleting it orphans every resource and forces risky re-imports, and -refresh=false has nothing to do with locking.`},

{id:"H3",theme:2,type:"order",title:"Pipeline with security gates",
sc:`Security engineering joins the release guild to redesign the delivery pipeline. Every gate below must land in the right place; two gates are order-sensitive in a way that trips up senior engineers.`,
q:`Order the pipeline from first (position 1) to last (position 7).`,
items:[
{t:`Commit code and run the secret scan on the push`},
{t:`Build the artifact and run SAST on the source`},
{t:`Scan the artifact for vulnerabilities, then sign and publish it`},
{t:`Deploy the signed artifact to staging`},
{t:`Run DAST and integration tests against staging`},
{t:`Change approval gate for the production release`},
{t:`Release to production with automatic rollback armed`}],
hint:`A scan that runs after publishing is decoration. Nothing unsigned or unscanned may ship.`,
exp:`The scan-before-publish order is the trap: the artifact is scanned for vulnerabilities, and only then signed and published — so a failing artifact never reaches a registry. Secret scan sits at commit, SAST at build, staging hosts DAST and integration tests, the approval gate precedes the continuous delivery release, and rollback is armed before traffic moves.`},

{id:"H4",theme:0,type:"dnd",title:"Automation, orchestration — or neither",
sc:`A governance workshop needs a precise vocabulary. Sort each item into automation, orchestration, or neither.`,
q:`Drag each item to its bucket.`,
buckets:["Automation","Orchestration","Neither"],
items:[
{t:`A script that restarts one stopped VM`,b:0},
{t:`A scheduled job that compacts one database volume`,b:0},
{t:`A workflow that provisions compute, network, database and DNS in strict order`,b:1},
{t:`A release workflow chaining CI, ticketing and cloud changes with approvals`,b:1},
{t:`An engineer typing the same ten commands by hand every morning`,b:2},
{t:`Reading dashboards without acting on them`,b:2}],
hint:`One task by one tool is automation; coordinated multi-step, multi-system workflows are orchestration; humans reading things are neither.`,
exp:`Automation covers single repeatable tasks: one restart script, one compaction job. Orchestration coordinates several automated steps across systems and teams with ordering and approvals. Hand-typing commands and passive dashboard reading involve no tool-driven repetition, so they are neither.`},

{id:"H5",theme:2,type:"branch",title:"Blue-green: the logouts",
sc:`acme-shop ships with blue-green deployments. Last night green (v2.4) took 100% of traffic from blue (v2.3). This morning support reports customers being logged out at random intervals.`,
q:`Work through the incident decisions. Every path has four steps.`,
steps:[
{q:`Before touching anything, what do you check first?`,
opts:[
{t:`Whether both environments share the same session store`,ok:true},
{t:`Roll back to blue immediately, ask questions later`},
{t:`Scale green to twice the size`},
{t:`Blame the users' browsers and close the tickets`}]},
{q:`Confirmed: green keeps sessions in local memory while blue used the shared Redis store. Traffic is 100% on green. What now?`,
opts:[
{t:`Point green at Redis, test session handling in staging, then cut over again in a quiet window`,ok:true},
{t:`Delete the blue environment to avoid confusion`},
{t:`Add more green nodes so sessions spread thinner`},
{t:`Do nothing; users will simply log in again`}]},
{q:`Before the second cutover, which guardrail matters most?`,
opts:[
{t:`Verify Redis connectivity and run a login and session test on the staging copy`,ok:true},
{t:`Increase the canary percentage to 50%`},
{t:`Disable health checks so the switch runs faster`},
{t:`Skip testing — the fix is one config line`}]},
{q:`The second cutover succeeds. How do you close it cleanly?`,
opts:[
{t:`Keep blue warm for a rollback window, then decommission it and write up the lesson`,ok:true},
{t:`Delete blue the moment traffic moves`},
{t:`Keep both environments running forever to be safe`},
{t:`Move the whole platform to rolling deployments tomorrow`}]}],
hint:`The symptom is session state, not compute. The old environment is your instant rollback — until you destroy it.`,
exp:`Blue-green promises instant rollback, but that promise depends on shared state: sessions must live in a store both colors read. The first cutover broke that, so the fix is Redis behind green, tested in staging, with a controlled re-cutover. Keeping blue warm preserves the rollback path; deleting it removes the safety net the strategy exists for.`},

{id:"H6",theme:1,type:"multi",title:"Why is it never unchanged?",
sc:`The team's Ansible playbook has a task that is supposed to keep one line inside /etc/app/env. Every nightly run reports "changed" and restarts the application, even on hosts where nothing should have changed.`,
q:`Select ALL the plausible causes.`,
opts:[
{t:`The task uses a shell append (>>) instead of a state module like lineinfile`,ok:true},
{t:`The template writes a timestamp into the file, so the file differs on every run`,ok:true},
{t:`A command task's random output is redirected into the managed file`,ok:true},
{t:`changed_when is set so the task always reports a change`,ok:true},
{t:`The inventory lists one host twice, which breaks idempotency`},
{t:`Ansible tasks can never be idempotent by design`}],
hint:`Idempotency breaks when the task's result is not a stable function of the desired state — look for randomness, timestamps and raw shell.`,
exp:`Anything non-deterministic defeats idempotency: shell appends always add bytes, timestamps always differ, random command output always differs, and a wrong changed_when merely lies about it. Ansible's agentless state modules exist precisely to compare desired versus actual state. Duplicate inventory entries and the claim that Ansible can never be idempotent do not cause this symptom.`},

{id:"H7",theme:2,type:"twopart",title:"The webhook with no secret",
sc:`The CI server exposes a webhook URL that triggers the build pipeline. The URL is long and unguessable, but there is no shared secret, no request signature, and no source restriction. An attacker discovers the URL.`,
p:[
{q:`Part A (red team): what can the attacker do with it?`,
opts:[
{t:`Trigger crafted builds and inject steps that execute on the build runner`,ok:true},
{t:`Only read the build history`},
{t:`Nothing — webhooks are read-only by definition`},
{t:`Shut down the CI server remotely`}]},
{q:`Part B (blue team): which control combination closes the hole?`,
opts:[
{t:`Require a signed shared secret, restrict sources, and run builds with least privilege`,ok:true},
{t:`Make the webhook URL even longer and rotate it monthly`},
{t:`Delete the webhook and build everything by hand forever`},
{t:`Move the CI server to a different port`}]}],
hint:`A build runner executes code by design. Whoever can wake it can feed it.`,
exp:`A webhook that accepts any POST lets the attacker start arbitrary builds — and since runners execute pipelines, crafted input becomes code execution inside the build network. Authentication via a signed secret, source allowlisting, and least-privilege runners (so a poisoned build cannot reach production) are the real controls. URL length is obscurity, not security.`},

{id:"H8",theme:3,type:"fill",title:"Least privilege for the CI role",
sc:`Security review flags the CI role: it was created by cloning an admin template. The pipeline only ever uploads build artifacts.`,
code:{name:"ci-role-policy.json",lines:[
`{`,
`  "Version": "2012-10-17",`,
`  "Statement": [`,
`    { "Effect": "Allow",`,
`      "Action": ["s3:PutObject"],`,
`      "Resource": "arn:aws:s3:::acme-artifacts/{{0}}" },`,
`    { "Effect": "Allow",`,
`      "Action": ["{{1}}"],`,
`      "Resource": "*" }`,
`  ]`,
`}`]},
q:`Complete the review: 1) The first statement must scope uploads to the artifact folder: {{0}}. 2) The second statement allows one action the pipeline never performs — remove {{1}}. 3) Together, these changes implement {{2}}.`,
slots:[0,2,4],
bank:["builds/*","*","s3:DeleteBucket","s3:PutObject","least privilege","AdministratorAccess","public"],
hint:`A wildcard resource gives the whole store; ask which single action a bucket that only receives artifacts never needs.`,
exp:`Least privilege means each statement allows exactly what the job needs: uploads scoped to arn:aws:s3:::acme-artifacts/builds/* and nothing on * resources. A delete action on every resource turns a leaked CI credential into a data-destruction event, which is why it goes. The principle has a name — least privilege — and it is the review's conclusion.`}
);

{id:"H9",theme:2,type:"qcm",title:"Canary metrics that average away the truth",
sc:`A payment API v2 runs as a canary at 5% of traffic. Aggregate dashboards match the baseline. But p99 latency for premium-tier requests is 1.9s versus 0.4s on baseline — and because premium users are heavy repeat users, they make up nearly all of the canary slice.`,
q:`What is the expert call?`,
opts:[
{t:`Stop the rollout: the aggregate hides a real, tier-specific regression`,ok:true},
{t:`Promote to 100%: aggregate error rate and latency match the baseline`},
{t:`Raise the canary to 50% so the regression shows up in the aggregate`},
{t:`Remove the p99 panel; dashboards should show one clean line`}],
hint:`Ask who is actually inside the canary slice — aggregates average away exactly the people who hurt.`,
exp:`The canary population is nearly all premium users, so aggregate metrics mask a severe regression for that tier. Expert judgment reads segment metrics before promoting and treats "aggregate looks fine" as a warning sign when the slice is skewed. Growing the canary would harm more users; deleting the panel hides the evidence.`},

{id:"H10",theme:3,type:"terminal",title:"Answer the auditor from the log",
sc:`You are on the bastion host in a bash shell. An auditor needs two things from the authentication log, and the bastion has the usual Unix text tools available.`,
prompt:`analyst@bastion:~`,
q:`Task 1: print ONLY the number of failed password attempts recorded for the account svc-deploy — the output must be just that number. Task 2: show the LAST 5 lines of /var/log/auth.log that mention sudo, in their original order.`,
cmds:[
{hint:"Filter the failed-password lines for svc-deploy, then count them.",
accept:["^(?=[\\s\\S]*grep\\s+-c)(?=[\\s\\S]*failed)(?=[\\s\\S]*svc-deploy)(?=[\\s\\S]*auth\\.log)[\\s\\S]*$","^(?=[\\s\\S]*grep)(?=[\\s\\S]*wc\\s+-l)(?=[\\s\\S]*failed)(?=[\\s\\S]*svc-deploy)(?=[\\s\\S]*auth\\.log)[\\s\\S]*$","^(?=[\\s\\S]*awk)(?=[\\s\\S]*failed)(?=[\\s\\S]*svc-deploy)(?=[\\s\\S]*auth\\.log)(?=[\\s\\S]*(END|print|wc))[\\s\\S]*$","^(?=[\\s\\S]*python)(?=[\\s\\S]*failed)(?=[\\s\\S]*svc-deploy)(?=[\\s\\S]*auth\\.log)(?=[\\s\\S]*(print|count|len))[\\s\\S]*$"],

out:`17`,
err:`The command ran, but its output is not the bare count of failed password attempts for svc-deploy. Filter those lines, then count them.`},
{hint:"Select the sudo lines, then trim the list to the last five.",

sample:"grep sudo /var/log/auth.log | tail -n 5",
out:`Mar 03 09:01:11 bastion sudo:   ana : TTY=pts/1 ; COMMAND=/usr/bin/journalctl -u nginx
Mar 03 09:04:37 bastion sudo:   svc-deploy : TTY=pts/0 ; COMMAND=/usr/bin/systemctl restart nginx
Mar 03 09:12:01 bastion sudo:   ana : TTY=pts/1 ; COMMAND=/usr/bin/apt-get upgrade -y
Mar 03 09:31:29 bastion sudo:   sam : TTY=pts/2 ; COMMAND=/usr/bin/tail -n 20 /var/log/syslog
Mar 03 09:47:02 bastion sudo:   svc-deploy : TTY=pts/0 ; COMMAND=/usr/bin/systemctl status nginx`,
err:`The command ran, but it does not print exactly the last five sudo lines of /var/log/auth.log in their original order. Select first, then trim (or trim, then select) with a pipe.`}],
hint:`Task 1: one tool prints matching lines and one of its options prints only the count. Task 2: grep selects the lines, tail -n 5 trims the list — the two stages can be piped in either order.`,
exp:`Task 1 selects the "Failed password" lines belonging to svc-deploy and outputs a single number: grep with its count option, a grep-to-wc pipe, a short awk or Python script all qualify. Task 2 pipes grep's sudo lines into tail -n 5 (or tails the log first and greps after) to keep exactly the last five in order. Composing two text tools through a pipe is the everyday shape of shell triage.`},

{id:"H11",theme:1,type:"dnd",title:"Name the failure mode",
sc:`The post-incident board collects this quarter's automation failures. Classify each by root-cause category so the retrospectives stop repeating themselves.`,
q:`Drag each failure onto its root-cause category.`,
buckets:["Configuration drift","Missing guardrail","Credential problem","Race condition"],
items:[
{t:`A prod VM was hand-patched for months and now differs from the IaC baseline`,b:0},
{t:`The agent enforced a three-week-old manifest because the repo sync silently failed`,b:0},
{t:`A cleanup script ran on production because no confirmation step existed`,b:1},
{t:`The pipeline role can delete any bucket in the account`,b:2},
{t:`Two jobs resized the same VM at the same minute; the last write won`,b:3},
{t:`The deploy job died mid-run with an authentication rejection`,b:2}],
hint:`Drift is state that wandered, guardrails are missing brakes, credentials are identity, races are timing. Agent tools like Puppet or Chef enforce manifests — when their source goes stale, the enforced state drifts too.`,
exp:`Hand-patching and a stale enforced manifest are both configuration drift — the running state left the declared one. A script with no confirmation and an over-broad pipeline role are missing guardrails and credential problems respectively (agent tools like Puppet or Chef make stale manifests dangerous). Two writers on one resource at one time is a race condition.`},

{id:"H12",theme:3,type:"order",title:"Response to the leaked key",
sc:`A public repository just received a pull request that contains a live cloud access key. The repository owner is paged at 22:41. Put the response in the correct order.`,
q:`Order the response steps from first (position 1) to last (position 6).`,
items:[
{t:`Secret scanning flags the cloud key in the public repository`},
{t:`Revoke the exposed key immediately`},
{t:`Search the audit logs for every use of the old key`},
{t:`Rotate to a new secret stored only in the vault`},
{t:`Purge the commit history and require fresh clones`},
{t:`Close out: post-incident review and pre-commit secret scanning`}],
hint:`Stop the bleeding before cleaning the wound. Logs remember past use even after a key is dead.`,
exp:`Revoke first — the key was compromised the second it went public, and history purges do not un-leak anything. Auditing then quantifies the damage, rotation through the vault replaces the credential, and history cleanup plus fresh clones remove copies. The review adds pre-commit scanning so the next key never lands in git at all.`},

{id:"H13",theme:4,type:"multi",title:"Metrics that do not measure error",
sc:`Leadership wants proof that patch automation reduced human error. The dashboard team proposes five metrics, and the audit-minded engineer must reject the vanity ones.`,
q:`Select the TWO metrics that do NOT measure a reduction in human error.`,
opts:[
{t:`Number of automation scripts written last quarter`,ok:true},
{t:`Count of chat messages in the ops channel per week`,ok:true},
{t:`Change-failure rate: automated changes versus manual changes`},
{t:`Configuration drift findings per 100 hosts since automation`},
{t:`Number of emergency fixes caused by hand-edited configs`}],
hint:`Activity and chatter are not outcomes. Which two count effort instead of errors?`,
exp:`Scripts written and chat volume measure activity, not correctness — a team can ship scripts and messages while error rates climb. Change-failure rate compares outcomes by change type, drift findings reflect manual tampering, and emergency fixes from hand-edits are literally human error events. Evidence for auditors must measure outcomes.`},

{id:"H14",theme:1,type:"multi",title:"Reading UPDATE_ROLLBACK_COMPLETE",
sc:`An engineer changed a security group reference in a CloudFormation template and ran an update. The stack now shows:`,
code:{name:"stack events — acme-api-101",lines:[
`Status: UPDATE_ROLLBACK_COMPLETE`,
`  09:14 AWS::EC2::Instance WebServer UPDATE_FAILED Security group sg-7712 does not exist`,
`  09:14 AWS::CloudFormation::Stack ROLLBACK_IN_PROGRESS`,
`  09:15 AWS::EC2::Instance WebServer UPDATE_COMPLETE (previous template restored)`]},
q:`Select ALL the true statements.`,
opts:[
{t:`The update failed and CloudFormation restored the previous template state automatically`,ok:true},
{t:`Fix the template and update the same stack again; nothing needs recreating`,ok:true},
{t:`The stack must be deleted and recreated — reuse is impossible`},
{t:`CloudFormation keeps its state in a local state file like Terraform`},
{t:`The rollback proves an operator manually restored the old version`}],
hint:`UPDATE_ROLLBACK_COMPLETE is the healthy result of a failed UPDATE. Which other status is the scary one?`,
exp:`UPDATE_ROLLBACK_COMPLETE means the update failed and the service rolled the stack back to the last good template on its own — no manual restore happened. The right move is to fix the template (the missing security group) and update the same stack again. Deleting and recreating is the fate of a failed CREATE (ROLLBACK_COMPLETE on a new stack), not this. CloudFormation tracks state in the service, not in a local file.`},

{id:"H15",theme:2,type:"fill",title:"Harden the pipeline file",
sc:`Review of the CI definition file. Three review notes have blanks where the precise word belongs.`,
code:{name:"api-ci.yml",lines:[
`name: api-ci`,
`on: push`,
`jobs:`,
`  build:`,
`    runs-on: ubuntu-latest`,
`    steps:`,
`      - name: checkout`,
`        uses: actions/checkout@v4`,
`      - name: unit tests`,
`        run: npm test`,
`      - name: dependency audit`,
`        run: npm audit --audit-level={{0}}`,
`      - name: build image`,
`        run: docker build -t registry.acme.internal/api:941 .`,
`      - name: push image`,
`        run: docker push registry.acme.internal/api:941`]},
q:`Complete the notes: the pipeline triggers on every {{1}} to the repo, the audit step must fail the build on a {{0}} finding, and the registry password never appears in this file because it arrives as a {{2}} variable.`,
slots:[3,0,6],
bank:["push","pull","merge","critical","low","medium","masked","plaintext"],
hint:`The trigger word is on line 2. Severity levels that fail builds are the strict ones. Secrets travel as variables, not as text.`,
exp:`The YAML "on: push" fires for every push. Setting the audit level to critical makes known-critical dependency issues fail the build before the artifact exists. CI platforms inject registry passwords as masked secret variables — plaintext secrets in pipeline files are how builds leak credentials into logs and forks.`},

{id:"H16",theme:1,type:"twopart",title:"The ensure task that always changes",
sc:`A "ensure config" task in the deploy playbook appends a line with a shell echo and then restarts the application. Every nightly run reports changed and restarts the app, even when the line is already present.`,
p:[
{q:`Part A: which property is the task missing?`,
opts:[
{t:`Idempotency — change nothing when the state is already correct`,ok:true},
{t:`Privilege escalation — the task needs sudo`},
{t:`Vault encryption for the values it writes`},
{t:`A longer execution timeout`}]},
{q:`Part B: how do you verify the fixed task before production?`,
opts:[
{t:`Run it in check mode with diff on a staging host; the second run must show zero changes`,ok:true},
{t:`Run it twice quickly and hope the changes cancel out`},
{t:`Delete the logs from the last run`},
{t:`Disable change reporting so "changed" stops appearing`}]}],
hint:`A state task either converges or does nothing. Preview tools exist to prove it without touching the host.`,
exp:`A shell append changes the file on every execution, so the task can never converge — that is lost idempotency, and the restart amplifies it into an outage risk. The fix uses a state module, and the proof is check mode with diff on staging: the first run shows the planned change, the second shows none.`}
);

{id:"H17",theme:3,type:"fill",title:"Two failures, one token",
sc:`The billing integration failed twice last night for two different reasons. The gateway log is below; the token's exp field was 10:19:59.`,
logs:[
`10:18:31 WARN gw-auth token sub=svc-billing rejected reason=signature-time-window result=401`,
`10:18:32 INFO svc-billing retry 1 -> 401`,
`10:18:35 INFO svc-billing retry 2 -> 401`,
`10:19:00 INFO svc-billing backing off 30s`,
`10:19:59 INFO gw-auth token sub=svc-billing exp reached (exp=10:19:59)`,
`10:20:04 WARN gw-auth token sub=svc-billing rejected reason=expired result=401`,
`10:20:44 INFO svc-billing POST /oauth/token -> new token issued`,
`10:20:45 INFO svc-billing GET /v2/orders -> 200`],
q:`Complete the incident summary: the FIRST rejections at 10:18 happened before the token's exp time, which points to {{0}} between the gateway and the token server. The rejections at 10:20 had a plainer cause: the token had {{1}}. Recovery came only when the service requested a {{2}} token.`,

bank:["clock skew","rate limiting","replayed","expired","revoked","fresh"],
hint:`Compare the first rejection time with the exp time. Same symptom, two different causes — and the service only succeeded after a new credential.`,
exp:`Rejections before expiry with a signature-time-window reason are clock skew: the gateway's clock disagrees with the token server's. The 10:20 rejections are ordinary expiry. The service only recovered by fetching a fresh token at the token endpoint — retrying with the same expired credential would have failed forever.`},

{id:"H18",theme:2,type:"dnd",title:"Controls onto pipeline stages",
sc:`The security architecture board maps controls to the delivery pipeline. A control in the wrong stage is either useless or too late.`,
q:`Drag each control onto the stage where it belongs.`,
buckets:["Commit","Build","Staging deploy","Release"],
items:[
{t:`Secret scanning runs on every push`,b:0},
{t:`SAST scans the source code`,b:1},
{t:`Unit tests gate the merge`,b:1},
{t:`DAST runs against a production-like copy`,b:2},
{t:`Smoke tests confirm the deployment`,b:2},
{t:`Change approval gate before going live`,b:3}],
hint:`Commit-stage controls see only new changes; build-stage controls see code; staging sees a running system; release needs a human.`,
exp:`Secret scanning belongs at commit, where a leaked credential travels furthest if missed. SAST and unit tests check code and belong in the build. A deployed system is needed for DAST and smoke tests, so they live in staging. The approval gate is the human decision immediately before release.`},

{id:"H19",theme:0,type:"qcm",title:"Approving catalog requests",
sc:`The governance team reviews three catalog requests. (1) A "large-gpu" template request for a two-week ML experiment — the catalog allows it and a valid cost code is attached. (2) A request to resize a VM to 16 vCPU — the catalog does not offer that shape. (3) A request to publish a new template that attaches a public IP to every VM it creates.`,
q:`Which request goes through the standard catalog flow right now?`,
opts:[
{t:`Request 1: it matches catalog rules and carries a valid cost code`,ok:true},
{t:`All three: clearing the backlog justifies small policy breaks`},
{t:`Request 2: a resize is just a bigger number, so the catalog can allow it`},
{t:`Request 3: publish now; the guardrail review can happen after launch`}],
hint:`The catalog is for pre-approved shapes. Anything outside it needs the exception path, not a shortcut.`,
exp:`Self-service works only inside its guardrails: pre-approved templates, size limits and cost codes. Request 1 fits exactly. Request 2 needs the exception or change process, and Request 3 needs a security review before the template exists — publishing a public-IP template would bake a dangerous default into everything built from it.`},

{id:"H20",theme:4,type:"multi",title:"Risks of 'automate everything'",
sc:`A new platform lead proposes automating everything at once: one shared template for all VMs, one pipeline service account with admin rights for simplicity, auto-scaling from a single image, and no approvals "because automation is the approval".`,
q:`Select ALL the genuine risks in this plan.`,
opts:[
{t:`One flawed template replicates a misconfiguration to hundreds of VMs in minutes`,ok:true},
{t:`The all-powerful pipeline service account becomes the highest-value credential in the company`,ok:true},
{t:`The auto-scaler can keep launching VMs from an unpatched image`,ok:true},
{t:`Drift spreads silently when nobody re-runs detection against the baseline`,ok:true},
{t:`Automation removes the need for any approval process`},
{t:`Automation always increases the total manual workload`}],
hint:`Automation multiplies whatever is true — including mistakes. The false options promise impossible absolutes in both directions.`,
exp:`Every genuine risk here is amplification: misconfiguration propagation through one template, credential exposure concentrated in one admin service account, an auto-scaler industrializing an unpatched image, and drift that detection would catch. Approvals still matter for what automation is allowed to do, and automation reduces manual work — the two false options are absolutes.`},

{id:"H21",theme:4,type:"order",title:"Rank the four alerts",
sc:`You inherit the queue after a shift change. Four alerts, one engineer. Rank them by response priority.`,
q:`Rank the alerts from highest priority (position 1) to lowest (position 4).`,
items:[
{t:`ALR-1: payment API returning 503 for 12% of requests — customers cannot check out`},
{t:`ALR-2: critical CVE reported against the prod web fleet; no exploit observed, WAF rule available`},
{t:`ALR-3: a dev cluster node reports a full disk; nothing user-facing is affected`},
{t:`ALR-4: canary for an internal admin tool shows a +0.1% error rate`}],
hint:`Live customer harm outranks latent risk; latent production risk outranks non-production; barely-measurable noise on an internal tool ranks last.`,
exp:`Active customer impact first: the payment 503s are losing money every minute. Next the unexploited critical CVE — latent but production-wide, and mitigations exist. Then the dev disk, contained to non-production. The internal canary's +0.1% is statistical noise for now; it gets watched, not worked.`},

{id:"H22",theme:0,type:"twopart",title:"The restart nobody asked for",
sc:`At 04:02 an event-driven auto-remediation playbook restarted the primary database. The database was healthy: its CPU alarm had flapped twice within 90 seconds, and the playbook acted on the first tick without verification. Restarts of this node take the payment path down for four minutes.`,
p:[
{q:`Part A: what was the root cause?`,
opts:[
{t:`The automation acted on an unverified flapping signal, with no dedup or confirmation`,ok:true},
{t:`The database was genuinely broken and needed the restart`},
{t:`A network outage split the cluster in two`},
{t:`An operator picked the wrong VPC during maintenance`}]},
{q:`Part B: which fix prevents a repeat?`,
opts:[
{t:`Require the alarm to stay raised, then verify health before and after acting — with a cooldown`,ok:true},
{t:`Make the restart happen even faster so flaps are caught early`},
{t:`Remove monitoring so alarms cannot flap`},
{t:`Run the remediation manually every night instead`}]}],
hint:`Event-driven automation is only as good as its trust in the event. Flapping is noise — automation that treats noise as signal breaks production.`,
exp:`The playbook trusted a single alarm tick with no dedup, no confirmation and no post-action verification — classic event-driven automation failure. The fix is signal hygiene: require the condition to persist, add a cooldown, and verify health before acting. Removing monitoring or going manual throws away the benefit instead of fixing the design.`},

{id:"H23",theme:4,type:"fill",title:"Backup runbook gaps",
sc:`Compliance flagged the draft backup runbook: four blanks must be precise before sign-off.`,
q:`Complete the runbook: the job triggers on cron {{0}} — every day at 02:30. Snapshots older than 35 days are {{1}} by the retention task. After every run the job performs a {{2}} test: the newest snapshot is restored to a scratch volume and compared by checksum. All results, including failures, are written to the audit {{3}} under the job's service account.`,
slots:[0,3,4,2],
bank:["30 2 * * *","2 30 * * *","log","purged","restore","ticket","encrypted","vault"],
hint:`Cron fields are minute then hour — an hour of 30 never arrives. Retention deletes; a backup is only real if it comes back.`,
exp:`"30 2 * * *" is 02:30 daily; "2 30 * * *" is minute 2 of hour 30, which never exists, so the job would never run. Retention purges old snapshots, and the restore test is what proves a backup is usable — an unverified backup is a hope, not a control. Everything lands in the audit log for compliance.`},

{id:"H24",theme:1,type:"qcm",title:"GitOps vs the manual scaler",
sc:`The GitOps controller keeps fighting an engineer: the repository declares 5 replicas, but the cluster shows 3 because the engineer manually scaled it down during last week's incident. The controller keeps restoring 5; the engineer keeps scaling to 3.`,
q:`What is the correct move per GitOps practice?`,
opts:[
{t:`Agree the desired count with the team, record it in Git via pull request, and let the controller converge`,ok:true},
{t:`Change the repo to 3 immediately so the alerts stop`},
{t:`Scale the cluster by hand back to 5 and close the ticket`},
{t:`Disable the controller so repo and cluster can each keep their own truth`}],
hint:`The repo is the source of truth — but only after humans decide what the truth is.`,
exp:`In GitOps the declared state in Git drives the cluster; a manual change is drift, and fighting drift with more manual changes is a loop. The correct sequence is a human decision (was 3 the safer steady state?), a pull request recording it, and convergence by the controller. Rushing the repo or disabling the controller breaks the declarative model that makes GitOps trustworthy.`}
);
EX.push(
{id:"H25",theme:3,type:"dnd",title:"Read the error like an engineer",
sc:`Your script hits four different cloud tools in one workflow. The morning run died four different ways. Classify each error by its actual cause.`,
q:`Drag each error onto the cause category it belongs to.`,
buckets:["Authentication problem","Permission problem","Rate limiting","Wrong identifier"],
items:[
{t:`HTTP 401: token signature invalid`,b:0},
{t:`Exit code 255 with "Unable to locate credentials"`,b:0},
{t:`HTTP 403: AccessDenied on s3:PutObject`,b:1},
{t:`HTTP 429 with a Retry-After: 30 header`,b:2},
{t:`HTTP 404: no such image tag in the registry`,b:3},
{t:`Az cmdlet error: Get-AzVM — the client has no authorization for this action`,b:1}],
hint:`401 is who you are, 403 is what you may do, 429 is how fast you may ask, 404/400 with names is pointing at the wrong thing.`,
exp:`401 and missing credentials are authentication failures — the caller's identity is missing or unverifiable. 403 AccessDenied and the Az cmdlet (PowerShell) authorization error are permission failures: identity worked, the action is not allowed. 429 is rate limiting — slow down and honor Retry-After. A missing tag or subnet id points at a wrong identifier, not at access.`},

{id:"H26",theme:2,type:"dnd",title:"Operational properties of deployments",
sc:`The SRE handbook chapter on deployments needs its property table rebuilt. Sort each property onto the strategy it describes.`,
q:`Drag each statement onto the strategy it describes.`,
buckets:["Blue-green","Canary","Rolling"],
items:[
{t:`Needs double capacity for a short window during the switch`,b:0},
{t:`Instant full rollback by flipping traffic back`,b:0},
{t:`Blast radius is capped by a traffic percentage`,b:1},
{t:`Aggregate metrics can hide harm inside the small slice`,b:1},
{t:`Old and new versions mix inside the fleet during rollout`,b:2},
{t:`Replaces a few instances at a time with little extra capacity`,b:2}],
hint:`Two properties each. Blue-green pays with capacity, canary pays with blind spots in averages, rolling mixes versions.`,
exp:`Blue-green runs two full environments: it pays in capacity and earns instant rollback. Canary's traffic cap bounds the blast radius, but aggregates can hide a regression inside the slice. Rolling replaces instances in batches inside one fleet — cheap in capacity, but old and new versions serve mixed traffic during the rollout.`},

{id:"H27",theme:4,type:"branch",title:"Patch waves go wrong",
sc:`Monthly patch automation runs in waves: wave 1 dev, wave 2 25% of production, wave 3 the rest. Wave 1 finished clean. Wave 2 has run for 20 minutes when payment API 503s start climbing on the patched hosts.`,
q:`Work through the response decisions. Every path has four steps.`,
steps:[
{q:`Wave 3 is scheduled to start in 10 minutes. First call?`,
opts:[
{t:`Pause wave 3 and investigate wave 2 before the pattern spreads`,ok:true},
{t:`Continue on schedule; the pipeline reported green earlier`},
{t:`Roll back everything, including the clean dev wave`},
{t:`Finish wave 3, then analyze everything at once`}]},
{q:`One service fails right after the kernel patch on every wave-2 host. Next?`,
opts:[
{t:`Roll wave-2 hosts back to their pre-patch snapshots`,ok:true},
{t:`Patch wave 3 anyway to isolate the variable`},
{t:`Silence the payment alerts to reduce noise`},
{t:`Reboot the hosts and hope it clears`}]},
{q:`Wave 2 is stable again. Which guardrail is added before wave 3 ever runs?`,
opts:[
{t:`A canary wave plus an auto-pause when the error-rate guardrail trips`,ok:true},
{t:`Bigger waves so patching finishes in one shot`},
{t:`Remove the health checks that slowed the rollout`},
{t:`Patch only on weekends when nobody is watching`}]},
{q:`Close-out for this patch cycle?`,
opts:[
{t:`Update the golden image and runbook so the fixed baseline ships next cycle`,ok:true},
{t:`Delete the incident ticket; it resolved itself`},
{t:`Blame the kernel vendor in the public channel`},
{t:`Skip documentation to save time`}]}],
hint:`Waves exist so you can stop them. The golden image is where a fix becomes permanent.`,
exp:`Waves are blast-radius control: pause the next wave the moment the current one misbehaves, and restore known-good snapshots when the pattern is proven. The durable guardrail is a canary wave with an auto-pause guardrail, and the permanent fix is a refreshed golden image plus an updated runbook — so the next cycle starts from the corrected baseline.`},

{id:"H28",theme:3,type:"fill",title:"Secrets that expire themselves",
sc:`The security team is rewriting the secrets policy after a long-lived key leaked from a wiki page. Four blanks define the new model.`,
q:`Complete the policy: the pipeline requests a {{0}} credential from the vault at job start. Dynamic credentials {{1}} automatically after their short TTL, so a leaked key has only a brief life. Static keys still in use are {{2}} every 90 days by the rotation job, and nothing sensitive is ever {{3}} in code, wikis or logs.`,
slots:[0,4,6,3],
bank:["dynamic","static","printed","hardcoded","expire","signed","rotated","shared"],
hint:`Short-lived beats long-lived. The two failure words describe where secrets must never live and what static ones must regularly undergo.`,
exp:`Dynamic secrets are minted per job and expire on a short TTL, so leakage self-heals. Static keys that must exist get rotated on a schedule by the rotation job. Hardcoding secrets in code, wikis or logs is exactly the leak pattern that caused the incident — the vault is the only home for them.`},

{id:"H29",theme:4,type:"twopart",title:"The cost job that stopped payments",
sc:`A cost-optimization job shuts down VMs tagged env=dev between 20:00 and 06:00. Monday morning, two production payment VMs are found off. Their tags: env=Dev (capital D) and env=dev-legacy.`,
p:[
{q:`Part A: root cause?`,
opts:[
{t:`Untested tag matching — case sensitivity and prefix matching pulled prod VMs into a dev rule`,ok:true},
{t:`The VMs were genuinely scheduled for shutdown`},
{t:`An attacker stopped the VMs overnight`},
{t:`The hypervisor failed during the night`}]},
{q:`Part B: which prevention actually addresses it?`,
opts:[
{t:`Validate tags at creation in the IaC pipeline and dry-run cost jobs against a report before they act`,ok:true},
{t:`Run the shutdown job more often so mistakes surface sooner`},
{t:`Ban tags entirely and track VMs by name`},
{t:`Grant the job an admin role so it can also correct tags`}]}],
hint:`The job did exactly what its matching told it. Fix the data quality and give automation a rehearsal step.`,
exp:`This is tagging governance failure: "Dev" and "dev-legacy" matched a rule meant for exactly "dev", so the automation faithfully did the wrong thing. The cure is at the source — enforce tag validity in IaC — plus a dry-run report before any bulk action. More frequent runs and admin powers would only speed up the damage.`},

{id:"H30",theme:4,type:"qcm",title:"Evidence the auditor will accept",
sc:`An external auditor asks for evidence that provisioning automation reduced human error over the last two quarters. Four candidates are on the table.`,
q:`Which item is the strongest evidence?`,
opts:[
{t:`Before/after change-failure rates for provisioning, drawn from the audit log of automated runs`,ok:true},
{t:`The team's feeling that errors went down this year`},
{t:`The total number of automation scripts in the repository`},
{t:`A dashboard screenshot with no date range and no numbers`}],
hint:`Auditors trust timestamped, outcome-based records over activity counts and impressions.`,
exp:`Audit-grade evidence is measurable, timestamped and outcome-based: change-failure rates before and after automation, pulled from the audit log, show whether errors actually fell. Feelings are not evidence, script counts measure effort, and an undated screenshot proves nothing. This is why automation must write audit records, not just do work.`}
);

{id:"H31",theme:0,type:"match",title:"Name the concept",
sc:`An auditor walks the platform floor with a checklist of automation concepts. Each row is a one-line definition she reads out; you answer with the exact term the team uses.`,
q:`Match each definition to the concept it describes. Every concept is used exactly once.`,
pairs:[
{l:`A task you can re-run any number of times; the second run changes nothing`,r:`Idempotency`},
{l:`A template that declares the desired end state and lets the engine decide the steps`,r:`Declarative IaC`},
{l:`A pre-built, hardened, versioned machine baseline used as a clone source`,r:`Golden image`},
{l:`The slow divergence of real state from the state the code declares`,r:`Configuration drift`}],
hint:`One term is a property of tasks, one describes how templates express intent, one is an artifact you patch monthly, and one is what happens when reality stops matching the code.`,
exp:`Idempotency is the re-run safety property. Declarative IaC describes end state, not procedure. A golden image is the maintained machine baseline. Configuration drift is what happens when manual changes and aging fleets wander away from the declared state — and detection of drift is why audits ask for the other three.`},

{id:"H32",theme:2,type:"spot",title:"Spot the mistake in the apply pipeline",
sc:`This pipeline applies Terraform to the production estate. The plan stage is healthy, the plan file is written correctly, and the environment pin is present — but the human gate the change board approved is silently gone.`,
q:`Click the ONE line that lets infrastructure changes reach production without any human approval.`,
lines:[
`plan_prod:`,
`  stage: plan`,
`  script: terraform -chdir=envs/prod plan -out=tfplan`,
`apply_prod:`,
`  stage: apply`,
`  script: terraform -chdir=envs/prod apply -auto-approve tfplan`,
`  environment: production`],
bad:5,
hint:`The danger is not what is applied but WHO gets a chance to stop it. One flag on one line answers that question.`,
exp:`-auto-approve on a production apply executes the plan the moment it runs: nobody reviews the plan and nothing can stop it, so a typo or a compromised branch lands directly in production. The approved shape is apply without -auto-approve behind a manual gate (or an equivalent policy check). The plan job, the saved plan file and the environment pin are all correct.`},

{id:"H33",theme:3,type:"prio",title:"Rank the platform queue",
sc:`Three teams ping you at once, and the on-call charter says to rank by blast radius, then by how fast the situation degrades, then by reversibility.`,
q:`Rank the four items from Priority 1 (handle first) to Priority 4 (handle last).`,
items:[
{t:`The Terraform state lock has been stuck for 40 minutes — every apply in the organization is blocked`},
{t:`The canary release error rate is 9% and climbing`},
{t:`Ansible runs report 40 hosts as changed on every execution — suspected drift`},
{t:`The cost dashboard shows a 6% variance from the monthly forecast`}],
hint:`Item one blocks every pipeline in the org right now. Item two harms users and gets worse by the minute. For the other two, ask which one is actively lying to you about your fleet.`,
exp:`Priority 1: the stuck state lock — no team can change infrastructure until it is released. Priority 2: the climbing canary error rate is user-facing and time-sensitive; promote or roll back now. Priority 3: universal "changed" noise means drift — real, but it has been true for weeks and will survive another hour. Priority 4: a 6% forecast variance is a report for business hours.`}
);

/* ---------- answer state ---------- */
function keys(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
function ensureAns(ex){
  if(S.ans[S.idx])return S.ans[S.idx];
  var a;
  if(ex.type==="qcm")a={sel:-1};
  else if(ex.type==="multi")a={sel:[]};
  else if(ex.type==="dnd")a={place:{}};
  else if(ex.type==="order")a={rows:null};
  else if(ex.type==="fill")a={slots:{}};
  else if(ex.type==="terminal")a={rows:ex.cmds.map(function(){return {cmd:"",ok:false,hist:[]};})};
  else if(ex.type==="match")a={sel:ex.pairs.map(function(){return -1;})};
  else if(ex.type==="spot")a={sel:-1};
  else if(ex.type==="prio")a={ranks:null};
  else if(ex.type==="twopart")a={sel:[-1,-1]};
  else a={pick:[],done:false};
  S.ans[S.idx]=a;return a;
}
function ensureDisp(ex){
  if(S.dispOrder[S.idx])return S.dispOrder[S.idx];
  var d={};
  if(ex.type==="qcm"||ex.type==="multi")d.opt=shuffle(keys(ex.opts.length));
  else if(ex.type==="dnd")d.itm=shuffle(keys(ex.items.length));
  else if(ex.type==="order")d.rows=shuffle(keys(ex.items.length));
  else if(ex.type==="fill")d.bank=shuffle(keys(ex.bank.length));
  else if(ex.type==="match")d.rt=shuffle(keys(ex.pairs.length));
  else if(ex.type==="prio")d.itm=shuffle(keys(ex.items.length));
  else if(ex.type==="twopart")d.opt=ex.p.map(function(p){return shuffle(keys(p.opts.length));});
  else if(ex.type==="branch")d.opt=ex.steps.map(function(s){return shuffle(keys(s.opts.length));});
  S.dispOrder[S.idx]=d;return d;
}

function nextExercise(){
  S.checkPause=false;
  if(S.idx>=EX.length-1){finish(false);return;}
  S.idx++;render();focusQ();
}
function doCheck(){
  var ex=cur(),a=ensureAns(ex);
  if(ex.type==="branch"&&!a.done){toast("Finish the scenario first — answer every step.");return;}
  if(ex.type==="spot"&&a.sel<0){toast("Click the line you think contains the mistake first.");return;}
  if(ex.type==="match"&&a.sel.every(function(s){return s<0;})){toast("Choose a match for at least one item first.");return;}
  var v=validate(ex,a,S.idx);if(v==null)return;
  var hmul=Math.max(0.5,1-0.1*(S.hints[S.idx]||0));
  S.earned[S.idx]=v.frac*hmul;
  S.checked[S.idx]=true;S.skip[S.idx]=false;S.checkPause=true;
  render();
  var fb=$("#fbPanel");if(fb)fb.scrollIntoView({block:"nearest",behavior:reduced()?"auto":"smooth"});
}
function doSkip(){S.skip[S.idx]=true;nextExercise();}
function doHint(){S.hints[S.idx]=(S.hints[S.idx]||0)+1;render();}
function doRevise(){
  S.checked[S.idx]=false;delete S.earned[S.idx];delete S.marks[S.idx];S.checkPause=false;
  if(cur().type==="branch"){var a=S.ans[S.idx];a.pick=[];a.done=false;}
  render();focusQ();
}

/* ---------- answer builders ---------- */

      t.appendChild(tt);
      t.appendChild(el("div","thost",esc(ex.prompt||"analyst@jumpbox:~")+" — task "+(ci+1)));
      var hist=el("div","term");

      inp.setAttribute("aria-label","terminal command input, task "+(ci+1));

  }else if(ex.type==="spot"){

/* ---------- answer events ---------- */
function bindAnswerEvents(ex,card){
  var a=ensureAns(ex);
  card.addEventListener("change",function(ev){
    var t=ev.target;
    if(t.matches("input[type=radio][data-k]")&&!t.hasAttribute("data-p")){a.sel=parseInt(t.getAttribute("data-k"),10);S.touched[S.idx]=true;refreshSel(card);}
    else if(t.matches("input[type=checkbox][data-k]")){var k=parseInt(t.getAttribute("data-k"),10);var i=a.sel.indexOf(k);if(i>=0)a.sel.splice(i,1);else a.sel.push(k);S.touched[S.idx]=true;}
    else if(t.matches("input[type=radio][data-p]")){a.sel[parseInt(t.getAttribute("data-p"),10)]=parseInt(t.getAttribute("data-k"),10);S.touched[S.idx]=true;}
  });
  if(ex.type==="dnd"){
    card.addEventListener("click",function(ev){
      if(S.checked[S.idx])return;
      var it=ev.target.closest(".itm");
      if(it){
        var k=parseInt(it.getAttribute("data-k"),10);
        if(it.closest(".bzone")){a.place[k]=-1;paintDnd(ex,S.idx);S.touched[S.idx]=true;return;}
        S.selItm=(S.selItm===k?null:k);
        card.querySelectorAll(".itm").forEach(function(x){x.classList.remove("sel");});
        if(S.selItm!==null){
          var sc=card.querySelector(".itm[data-k='"+S.selItm+"']");
          if(sc)sc.classList.add("sel");
        }
        S.touched[S.idx]=true;return;
      }
      var bz=ev.target.closest(".bucket");
      if(bz&&S.selItm!==null){
        a.place[S.selItm]=parseInt(bz.getAttribute("data-b"),10);S.selItm=null;
        paintDnd(ex,S.idx);S.touched[S.idx]=true;
      }
    });
    card.addEventListener("dragstart",function(ev){
      var it=ev.target.closest(".itm");if(!it)return;
      S.dragItm=parseInt(it.getAttribute("data-k"),10);
      try{ev.dataTransfer.setData("text/plain","");}catch(e){}
    });
    card.addEventListener("dragover",function(ev){
      var b=ev.target.closest(".bucket");if(b&&S.dragItm!==null){ev.preventDefault();b.classList.add("over");}
    });
    card.addEventListener("dragleave",function(ev){
      var b=ev.target.closest(".bucket");if(b)b.classList.remove("over");
    });
    card.addEventListener("drop",function(ev){
      var b=ev.target.closest(".bucket");if(!b||S.dragItm===null)return;
      ev.preventDefault();b.classList.remove("over");
      a.place[S.dragItm]=parseInt(b.getAttribute("data-b"),10);S.dragItm=null;
      paintDnd(ex,S.idx);S.touched[S.idx]=true;
    });
  }
  if(ex.type==="order"){
    card.addEventListener("click",function(ev){
      var b=ev.target.closest(".arrow");if(!b||S.checked[S.idx])return;
      var p=parseInt(b.getAttribute("data-p"),10),mv=parseInt(b.getAttribute("data-mv"),10);
      var q=p+mv;if(q<0||q>=a.rows.length)return;
      var t=a.rows[p];a.rows[p]=a.rows[q];a.rows[q]=t;
      S.touched[S.idx]=true;render();focusQ();
    });
  }
  if(ex.type==="fill"){
    card.addEventListener("click",function(ev){
      if(S.checked[S.idx])return;
      var bl=ev.target.closest(".blk");
      if(bl){delete a.slots[bl.getAttribute("data-slot")];paintFill(ex,S.idx);S.touched[S.idx]=true;return;}
      var w=ev.target.closest(".word");
      if(w){
        var wk=w.getAttribute("data-w");
        for(var s in a.slots){if(a.slots[s]===wk)return;}
        var target=null;
        document.querySelectorAll(".blk").forEach(function(x){var n=x.getAttribute("data-slot");if(target===null&&a.slots[n]===undefined)target=n;});
        if(target!==null){a.slots[target]=wk;paintFill(ex,S.idx);S.touched[S.idx]=true;}
      }
    });
  }
  if(ex.type==="terminal"){
    card.addEventListener("input",function(ev){
      var t=ev.target;
      if(t.matches("input.tin")&&t.hasAttribute("data-ti")){
        a.rows[parseInt(t.getAttribute("data-ti"),10)].cmd=t.value;
        S.touched[S.idx]=true;
      }
    });
    card.addEventListener("keydown",function(ev){
      if(ev.key!=="Enter")return;
      var t=ev.target;
      if(t.matches&&t.matches("input.tin")&&t.hasAttribute("data-ti")){
        ev.preventDefault();
        var runBtn=card.querySelector("[data-run='"+t.getAttribute("data-ti")+"']");
        if(runBtn)runBtn.click();
      }
    });
    card.addEventListener("click",function(ev){
      var b=ev.target.closest("[data-run]");
      if(!b||S.checked[S.idx])return;
      var ci=parseInt(b.getAttribute("data-run"),10);
      var inp=card.querySelector("input.tin[data-ti='"+ci+"']");
      if(!inp)return;
      var cmd=inp.value.trim();if(!cmd)return;
      var r=a.rows[ci];r.cmd=cmd;S.touched[S.idx]=true;
      var norm=cmd.toLowerCase().replace(/\s+/g," ");
      r.ok=(ex.cmds[ci].accept||[]).some(function(rx){return new RegExp(rx,"i").test(norm);});
      r.hist.push("$ "+cmd);
      var hist=card.querySelectorAll("div.term")[ci];
      hist.appendChild(termLine("$ "+cmd));
      hist.appendChild(termLine(r.ok?ex.cmds[ci].out:ex.cmds[ci].err));
      hist.scrollTop=hist.scrollHeight;
      inp.value="";r.cmd="";inp.focus();
    });
    if(S.checked[S.idx]){
      card.querySelectorAll("input.tin").forEach(function(x){x.disabled=true;});
      card.querySelectorAll("[data-run]").forEach(function(x){x.disabled=true;});
    }
  }
  if(ex.type==="match"){
    card.addEventListener("change",function(ev){
      var t=ev.target;
      if(t.matches&&t.matches("select[data-mi]")&&!S.checked[S.idx]){
        a.sel[parseInt(t.getAttribute("data-mi"),10)]=parseInt(t.value,10);
        S.touched[S.idx]=true;
      }
    });
  }
  if(ex.type==="spot"){
    card.addEventListener("click",function(ev){
      var b=ev.target.closest(".sline");
      if(!b||S.checked[S.idx])return;
      a.sel=parseInt(b.getAttribute("data-li"),10);
      card.querySelectorAll(".sline").forEach(function(x){x.classList.toggle("sel",x===b);});
      S.touched[S.idx]=true;
    });
  }
  if(ex.type==="prio"){
    card.addEventListener("change",function(ev){
      var t=ev.target;
      if(!t.matches||!t.matches("select[data-pi]")||S.checked[S.idx])return;
      var k=parseInt(t.getAttribute("data-pi"),10),v=parseInt(t.value,10);
      if(a.ranks[k]===v)return;
      for(var j=0;j<a.ranks.length;j++){if(j!==k&&a.ranks[j]===v){a.ranks[j]=a.ranks[k];break;}}
      a.ranks[k]=v;
      S.touched[S.idx]=true;
      render();focusQ();
    });
  }
  if(ex.type==="branch"){
    card.addEventListener("click",function(ev){
      var b=ev.target.closest(".optb");
      if(b&&!S.checked[S.idx]){
        var k=parseInt(b.getAttribute("data-k"),10);
        a.pick.push(k);
        if(a.pick.length>=ex.steps.length)a.done=true;
        S.touched[S.idx]=true;render();focusQ();return;
      }
      var r=ev.target.closest("#breset");
      if(r&&!S.checked[S.idx]){a.pick=[];a.done=false;delete S.marks[S.idx];render();focusQ();}
    });
  }
}
function refreshSel(card){
  card.querySelectorAll(".opt").forEach(function(o){
    var inp=o.querySelector("input");
    o.classList.toggle("sel",inp.checked);
  });
}

/* ---------- validation ---------- */
function validate(ex,a,idx){
  var m={};S.marks[idx]=m;
  var i;
  if(ex.type==="qcm"){
    var okk=okKeys(ex.opts);
    m.opt={};
    okk.forEach(function(k){m.opt[k]="miss";});
    if(a.sel>=0)m.opt[a.sel]=okk.indexOf(a.sel)>=0?"ok":"bad";
    return {frac:a.sel>=0&&okk.indexOf(a.sel)>=0?1:0};
  }
  if(ex.type==="multi"){
    var okk2=okKeys(ex.opts);m.opt={};var hit=0;
    okk2.forEach(function(k){m.opt[k]="miss";});
    a.sel.forEach(function(k){m.opt[k]=okk2.indexOf(k)>=0?"ok":"bad";});
    okk2.forEach(function(k){if(a.sel.indexOf(k)>=0){hit++;}});
    return {frac:hit/okk2.length};
  }
  if(ex.type==="dnd"){
    m.item={};var good=0;
    ex.items.forEach(function(it,k){
      var p=a.place[k]===undefined?-1:a.place[k];
      if(p<0)m.item[k]="miss";
      else if(p===it.b){m.item[k]="ok";good++;}
      else m.item[k]="bad";
    });
    return {frac:good/ex.items.length};
  }
  if(ex.type==="order"){
    m.pos=[];var g2=0;
    for(i=0;i<a.rows.length;i++){var ok3=a.rows[i]===i;m.pos.push(ok3?"ok":"bad");if(ok3)g2++;}
    return {frac:g2/a.rows.length};
  }
  if(ex.type==="fill"){
    m.slot={};var g3=0;
    ex.slots.forEach(function(bk,si){
      var v=a.slots[si];
      if(v===undefined||v===null)m.slot[si]="miss";
      else if(String(v)===String(bk)){m.slot[si]="ok";g3++;}
      else m.slot[si]="bad";
    });
    return {frac:g3/ex.slots.length};
  }
  if(ex.type==="terminal"){
    m.term=[];var gt=0;
    ex.cmds.forEach(function(c,ci){
      var r=a.rows[ci];
      if(!r||!r.hist.length)m.term.push("miss");
      else if(r.ok){m.term.push("ok");gt++;}
      else m.term.push("bad");
    });
    return {frac:gt/ex.cmds.length};
  }
  if(ex.type==="match"){
    var rt=S.dispOrder[idx]&&S.dispOrder[idx].rt?S.dispOrder[idx].rt:keys(ex.pairs.length);
    m.row=[];var gm=0;
    ex.pairs.forEach(function(p,pi){
      var s=a.sel[pi];
      if(s<0)m.row.push("miss");
      else if(s===rt.indexOf(pi)){m.row.push("ok");gm++;}
      else m.row.push("bad");
    });
    return {frac:gm/ex.pairs.length};
  }
  if(ex.type==="spot"){
    m.line={};
    var gsp=a.sel===ex.bad?1:0;
    ex.lines.forEach(function(ln,i){
      if(i===a.sel)m.line[i]=gsp?"ok":"bad";
      else if(i===ex.bad&&!gsp)m.line[i]="miss";
    });
    return {frac:gsp};
  }
  if(ex.type==="prio"){
    m.rank=[];var gp=0;
    ex.items.forEach(function(it,k){
      var r=a.ranks? a.ranks[k]:0;
      if(r===k+1){m.rank.push("ok");gp++;}
      else m.rank.push("bad");
    });
    return {frac:gp/ex.items.length};
  }
  if(ex.type==="twopart"){
    m.partMarks=[];var g4=0;
    ex.p.forEach(function(p,pi){
      var okk3=okKeys(p.opts),sel=a.sel[pi];
      if(sel>=0&&okk3.indexOf(sel)>=0){m.partMarks[pi]={k:sel,st:"ok"};g4++;}
      else if(sel>=0)m.partMarks[pi]={k:sel,st:"bad"};
      else m.partMarks[pi]={k:-1,st:"miss"};
    });
    return {frac:g4/2};
  }
  if(ex.type==="branch"){
    m.step=[];var g5=0;
    a.pick.forEach(function(k,si){
      var ok4=ex.steps[si].opts[k].ok;m.step.push(ok4?"ok":"bad");if(ok4)g5++;
    });
    return {frac:g5/ex.steps.length};
  }
  return {frac:0};
}
function okKeys(opts){var r=[];opts.forEach(function(o,k){if(o.ok)r.push(k);});return r;}

/* ---------- reprs ---------- */
function youRepr(ex,pos){
  var a=S.ans[pos];
  if(!a)return "—";
  if(ex.type==="qcm")return a.sel>=0?esc(ex.opts[a.sel].t):"(nothing selected)";
  if(ex.type==="multi")return a.sel.length?a.sel.map(function(k){return esc(ex.opts[k].t);}).join(" · "):"(nothing selected)";
  if(ex.type==="dnd")return ex.items.map(function(it,k){var p=a.place[k];return "Item "+(k+1)+" → "+((p===undefined||p<0)?"not placed":esc(ex.buckets[p]));}).join(" · ");
  if(ex.type==="order")return (a.rows||[]).map(function(k,p){return (p+1)+". "+esc(ex.items[k].t);}).join(" ");
  if(ex.type==="fill")return ex.slots.map(function(bk,si){var v=a.slots[si];return (si+1)+": "+(v===undefined?"—":esc(ex.bank[v]));}).join(" · ");
  if(ex.type==="terminal")return (a.rows||[]).map(function(r,ci){return "Task "+(ci+1)+": "+(r.hist.length?esc(r.hist[0].slice(2)):"not run");}).join(" · ");
  if(ex.type==="match"){var rt2=S.dispOrder[pos]&&S.dispOrder[pos].rt;return ex.pairs.map(function(p,pi){var s=a.sel[pi];var ri=(rt2&&s>=0)?rt2[s]:-1;return esc(p.l)+" → "+(ri>=0?esc(ex.pairs[ri].r):"—");}).join(" · ");}
  if(ex.type==="spot")return a.sel>=0?esc(ex.lines[a.sel]):"(nothing selected)";
  if(ex.type==="prio")return (a.ranks||[]).map(function(r,k){return "P"+r+": "+esc(ex.items[k].t);}).join(" · ");
  if(ex.type==="twopart")return "A: "+(a.sel[0]>=0?esc(ex.p[0].opts[a.sel[0]].t):"—")+" · B: "+(a.sel[1]>=0?esc(ex.p[1].opts[a.sel[1]].t):"—");
  if(ex.type==="branch")return (a.pick||[]).map(function(k,si){return (si+1)+". "+esc(ex.steps[si].opts[k].t);}).join(" ");
  return "—";
}
function correctRepr(ex){
  if(ex.type==="qcm")return esc(ex.opts[okKeys(ex.opts)[0]].t);
  if(ex.type==="multi")return okKeys(ex.opts).map(function(k){return esc(ex.opts[k].t);}).join(" · ");
  if(ex.type==="dnd")return ex.items.map(function(it,k){return "Item "+(k+1)+" → "+esc(ex.buckets[it.b]);}).join(" · ");
  if(ex.type==="order")return ex.items.map(function(it,p){return (p+1)+". "+esc(it.t);}).join(" ");
  if(ex.type==="fill")return ex.slots.map(function(bk,si){return (si+1)+": "+esc(ex.bank[bk]);}).join(" · ");
  if(ex.type==="terminal")return ex.cmds.map(function(c,ci){return "Task "+(ci+1)+": "+esc(c.sample);}).join(" · ");
  if(ex.type==="match")return ex.pairs.map(function(p){return esc(p.l)+" → "+esc(p.r);}).join(" · ");
  if(ex.type==="spot")return esc(ex.lines[ex.bad]);
  if(ex.type==="prio")return ex.items.map(function(it,k){return "P"+(k+1)+": "+esc(it.t);}).join(" · ");
  if(ex.type==="twopart")return "A: "+esc(ex.p[0].opts[okKeys(ex.p[0].opts)[0]].t)+" · B: "+esc(ex.p[1].opts[okKeys(ex.p[1].opts)[0]].t);
  if(ex.type==="branch")return ex.steps.map(function(st,si){return (si+1)+". "+esc(correctOpt(st));}).join(" ");
  return "—";
}

/* ---------- feedback ---------- */
function feedbackPanel(ex){
  var f=S.earned[S.idx]||0,pts=Math.round(f*100)/10;
  var lbl=f>=0.999?"FULL":(f>0?"PARTIAL":"ZERO");
  var p=el("div","fb "+(f>=0.999?"ok":(f>0?"part":"bad")));
  p.id="fbPanel";p.setAttribute("role","status");
  var ic=f>=0.999?"&#10003;":(f>0?"&#9887;":"&#10007;");
  p.appendChild(el("div","fbscore",ic+" You earned <b>"+pts+" / 10 points</b> on this exercise — "+lbl+(S.hints[S.idx]?" (hint cost included)":"")));
  if(f<0.999)p.appendChild(el("div","fbcorr","<b>Correct answer:</b> "+correctRepr(ex)));
  p.appendChild(el("div","fbexp",esc(ex.exp)));
  return p;
}

/* ---------- toast ---------- */
function toast(msg){
  var t=el("div","toast",esc(msg));t.setAttribute("role","alert");
  document.body.appendChild(t);
  setTimeout(function(){t.classList.add("show");},10);
  setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove();},400);},3200);
}

/* ---------- finish & results ---------- */
function hasAnswer(ex,a){
  if(!a)return false;
  if(ex.type==="qcm")return a.sel>=0;
  if(ex.type==="multi")return a.sel.length>0;
  if(ex.type==="dnd")return Object.keys(a.place).some(function(k){return a.place[k]>=0;});
  if(ex.type==="order")return !!a.rows;
  if(ex.type==="fill")return Object.keys(a.slots).length>0;
  if(ex.type==="terminal")return !!(a.rows&&a.rows.some(function(r){return r.hist&&r.hist.length;}));
  if(ex.type==="match")return a.sel.some(function(s){return s>=0;});
  if(ex.type==="spot")return a.sel>=0;
  if(ex.type==="prio")return !!a.ranks;
  if(ex.type==="twopart")return a.sel[0]>=0||a.sel[1]>=0;
  if(ex.type==="branch")return a.done;
  return false;
}
function finish(auto){
  var pos,ex;
  for(pos=0;pos<EX.length;pos++){
    if(S.skip[pos])continue;
    ex=EX[S.order[pos]];
    if(!S.checked[pos]){
      var a=S.ans[pos];
      if(S.touched[pos]&&hasAnswer(ex,a)){
        var v=validate(ex,a,pos);
        var hmul=Math.max(0.5,1-0.1*(S.hints[pos]||0));
        S.earned[pos]=v.frac*hmul;S.checked[pos]=true;
      }else{
        S.skip[pos]=true;
      }
    }
  }
  var answered=[];
  for(pos=0;pos<EX.length;pos++){if(!S.skip[pos])answered.push(pos);}
  if(answered.length===0){
    if(!auto){toast("Answer at least one exercise before finishing — every exercise is skipped.");return;}
    S.phase="results";S.noScore=true;render();return;
  }
  S.phase="results";S.noScore=false;S.answered=answered;
  var sc=Math.round(sumFrac()*100)/100;
  S.pct=Math.round(sc/answered.length*100);
  render();
  reportScore(sc,answered.length,auto);
  animateScore();
}
function sumFrac(){var v=0;S.answered.forEach(function(pos){v+=S.earned[pos]||0;});return v;}
function scoreDetails(){
  return S.order.map(function(ei,pos){
    var ex=EX[ei],er=S.earned[pos],sk=S.skip[pos];
    return {n:pos+1,id:ex.id,title:ex.title,type:ex.type,theme:THEMES[ex.theme],points:10,
      earned:Math.round((sk?0:(er||0))*100)/10,
      status:sk?"skipped":(er>=0.999?"correct":(er>0?"partial":"wrong"))};
  });
}
function reportScore(correct,total,auto){
  if(S.reported)return;
  S.reported=true;
  try{
    if(!(window.parent&&window.parent!==window))return;
    var percent=Math.round((correct/total)*100);
    var p={type:"CYBERPULSE_SCORE",topicId:(S.params&&S.params.topicId)||META.topicId,chapter:META.chapter,
      title:META.title,difficulty:META.difficulty,score:correct,total:total,percent:percent,passed:percent>=CFG.pass,
      attempt:S.attempt||1,finishedBy:auto?"timeout":"submit",durationUsedSec:Math.max(0,CFG.total-Math.max(0,S.remaining)),
      details:scoreDetails()};
    if(S.user)p.username=S.user;
    ["country","locale","theme","batch"].forEach(function(k){
      if(S.params&&S.params[k]!=null)p[k]=S.params[k];
    });
    window.parent.postMessage(p,"*");
  }catch(e){}
}
function animateScore(){
  var pct=S.pct,e1=$("#resPct");
  if(!e1||reduced()){if(e1)e1.textContent=pct+"%";return;}
  var cur1=0,step=Math.max(1,Math.ceil(pct/40));
  var iv=setInterval(function(){
    if(S.phase!=="results"){clearInterval(iv);return;}
    cur1=Math.min(pct,cur1+step);
    e1.textContent=cur1+"%";
    if(cur1>=pct)clearInterval(iv);
  },25);
}
function viewResults(){
  var c=el("div");
  var passed=!S.noScore&&S.pct>=CFG.pass;
  var banner=el("div","resbanner "+(S.noScore?"none":(passed?"pass":"fail")));
  if(S.noScore){
    banner.innerHTML="<h1>No exercises were answered</h1><p>Every exercise was skipped, so there is nothing to score. Retake the exam and answer at least one exercise.</p>";
  }else{
    banner.innerHTML=passed?
      "<h1>&#10003; PASS</h1><p class='bigp'>You reached <b id='resPct'>0%</b> — the pass mark is "+CFG.pass+"%.</p><p class='mut'>Certificate-style credit: "+esc(META.title)+" — "+esc(META.difficulty.toUpperCase())+" attempt completed in "+fmtT(CFG.total-Math.max(0,S.remaining))+" of exam time.</p>":
      "<h1>&#10007; FAIL</h1><p class='bigp'>You reached <b id='resPct'>0%</b> — the pass mark is "+CFG.pass+"%.</p><p class='mut'>You must retake this exam. Study the report below, then press Retake Exam.</p>";
  }
  c.appendChild(banner);
  if(!S.noScore){
    var skipped=[];for(var pos=0;pos<EX.length;pos++){if(S.skip[pos])skipped.push(pos);}
    var stats=el("div","statrow");
    stats.appendChild(el("div","stat","<span class='sv'>"+(Math.round(sumFrac()*10)/10)+"</span><span class='sl'>points earned (max "+(S.answered.length*10)+")</span>"));
    stats.appendChild(el("div","stat","<span class='sv'>"+S.answered.length+"</span><span class='sl'>exercises scored</span>"));
    stats.appendChild(el("div","stat","<span class='sv'>"+skipped.length+"</span><span class='sl'>skipped (excluded)</span>"));
    stats.appendChild(el("div","stat","<span class='sv'>"+fmtT(CFG.total-Math.max(0,S.remaining))+"</span><span class='sl'>time used</span>"));
    c.appendChild(stats);
    var th=el("div","card","<div class='lbl'>Progress per theme</div>");
    THEMES.forEach(function(tn,ti){
      var e=0,n=0;
      S.answered.forEach(function(pos){if(EX[S.order[pos]].theme===ti){e+=S.earned[pos]||0;n++;}});
      if(!n)return;
      var w=Math.round(e/n*100);
      th.appendChild(el("div","themebar","<div class='tl'>"+esc(tn)+" — "+(Math.round(e*10)/10)+" / "+(n*10)+" pts</div><div class='tb'><div class='tbf' style='width:"+w+"%'></div></div>"));
    });
    c.appendChild(th);
    if(skipped.length){
      c.appendChild(el("div","card skipnote","<div class='lbl'>Skipped exercises — not counted</div><p>The following exercises were skipped and are <b>excluded from both score and total</b>: "+skipped.map(function(pos){return "Exercise "+(pos+1);}).join(", ")+". Their explanations still appear in the report below so you can learn from them.</p>"));
    }
    var rep=el("div","card","<div class='lbl'>Detailed report</div>");
    var tab=el("table","rtable");
    tab.innerHTML="<thead><tr><th>#</th><th>Exercise</th><th>Your answer</th><th>Correct answer</th><th>Points</th><th>Result</th><th>Why</th></tr></thead><tbody></tbody>";
    var tb=tab.querySelector("tbody");
    S.order.forEach(function(ei,pos){
      var ex=EX[ei],sk=S.skip[pos],er=S.earned[pos],lb=sk?"SKIPPED":(er>=0.999?"FULL":(er>0?"PARTIAL":"ZERO"));
      var tr=el("tr",sk?"rskip":(er>=0.999?"rok":(er>0?"rpart":"rbad")));
      tr.appendChild(el("td",null,String(pos+1)));
      tr.appendChild(el("td",null,esc(ex.title)+"<br><span class='mut'>"+esc(TYPELBL[ex.type])+" · "+esc(THEMES[ex.theme])+"</span>"));
      tr.appendChild(el("td",null,sk?"<span class='mut'>not answered</span>":youRepr(ex,pos)));
      tr.appendChild(el("td",null,correctRepr(ex)));
      tr.appendChild(el("td",null,sk?"—":(Math.round((er||0)*100)/10)+" / 10"));
      tr.appendChild(el("td","lblcell "+lb.toLowerCase(),lb));
      tr.appendChild(el("td","why",esc(ex.exp)));
      tb.appendChild(tr);
    });
    rep.appendChild(tab);
    c.appendChild(rep);
  }
  var rw=el("div","startrow");
  var rt=el("button","btn primary big","Retake Exam");rt.type="button";
  rt.addEventListener("click",startExam);
  rw.appendChild(rt);
  c.appendChild(rw);
  return c;
}

/* ---------- boot ---------- */
/* Backward-compatible terminal shape: single-command data becomes a one-task multi-command exercise */
EX.forEach(function(ex){
  if(ex.type==="terminal"&&!ex.cmds){
    ex.cmds=[{sample:ex.sample,accept:ex.accept,out:ex.out,err:ex.err,hint:""}];
  }
});
render();
