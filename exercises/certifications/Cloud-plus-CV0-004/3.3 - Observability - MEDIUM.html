<style>
:root{
  --bg:#0b111c; --panel:#121a2a; --panel2:#0e1622; --line:#26344b; --line2:#31456280;
  --tx:#e8eef7; --mut:#a9b9cf; --acc:#56d4e8; --acc2:#2b6f80;
  --ok:#63d98f; --bad:#f2807a; --warn:#ffc46b; --okbg:rgba(99,217,143,.12);
  --badbg:rgba(242,128,122,.13); --warnbg:rgba(255,196,107,.13); --accbg:rgba(86,212,232,.12);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
p{margin:.45em 0}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
/* ---------- screens ---------- */
.screen[hidden]{display:none}
/* ---------- intro ---------- */
.intro-hero{background:linear-gradient(160deg,#122036,#0d1523);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:14px}
.intro-hero h1{font-size:24px;margin:0 0 6px}
.sev{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.06em;border:1px solid}
.sev-med{color:#0e1622;background:var(--warn);border-color:var(--warn)}
.sev-hard{color:#fff;background:#c9453c;border-color:#e06a61}
.meta-grid{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.meta-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.meta-cell b{display:block;font-size:19px;color:var(--acc)}
.meta-cell span{color:var(--mut);font-size:13px}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.howto h2{font-size:17px;color:var(--acc);margin-top:2px}
.howto ul{margin:.4em 0;padding-left:1.25em}
.howto li{margin:.32em 0}
.kw-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.kw-wrap h2{font-size:17px;color:var(--acc);margin-top:2px}
.kw-themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.kw-theme{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kw-theme h3{font-size:14px;color:var(--warn);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.kw-theme p{font-size:13.5px;color:var(--mut);margin:0;line-height:1.6}
.start-row{display:flex;gap:12px;align-items:center;margin:16px 0}
/* ---------- buttons ---------- */
.btn{background:#1a2740;border:1px solid #35507c;color:var(--tx);border-radius:9px;padding:10px 18px;min-height:44px;min-width:44px;transition:background .25s,border-color .25s,transform .15s}
.btn:hover{background:#223355;border-color:#4a6ea6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#0e5468;border-color:#2b8aa3;font-weight:600}
.btn.primary:hover{background:#14708c}
.btn.danger{background:#5d2723;border-color:#9c4a42}
.btn.danger:hover{background:#75322c}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:#16223a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hbtn{background:#16223a;border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px;transition:background .25s}
.hbtn:hover{background:#1e2f4f}
.hbtn.warn{border-color:#8a6a3a;color:var(--warn)}
/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0d1523f2,#0d1523e6);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:10px 2px 8px;margin:0 -16px 10px;padding-left:16px;padding-right:16px}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#hdr-title{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap}
.chip b{color:var(--acc);font-variant-numeric:tabular-nums}
#timer-chip.low b{color:var(--warn)}
#timer-chip.crit b{color:var(--bad)}
.chip .pulse{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
#prog{height:9px;background:#0a0f19;border:1px solid var(--line);border-radius:999px;margin-top:9px;overflow:hidden}
#prog-fill{height:100%;width:0;background:linear-gradient(90deg,#1d7f96,var(--acc));transition:width .45s ease;border-radius:999px}
#pause-status{min-height:0;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.pflag{font-size:13px;font-weight:600;border-radius:7px;padding:3px 10px;border:1px solid}
.pflag.manual{color:var(--warn);background:var(--warnbg);border-color:#8a6a3a}
.pflag.review{color:var(--acc);background:var(--accbg);border-color:#2b8aa3}
/* ---------- navigator ---------- */
#nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:8px 0 12px}
.nbtn{min-height:44px;min-width:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px;font-variant-numeric:tabular-nums;position:relative;transition:background .2s}
.nbtn:hover{background:#1b2a45}
.nbtn .st{display:block;font-size:10.5px;line-height:1;margin-top:1px;color:var(--mut)}
.nbtn.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.nbtn.ok{background:rgba(99,217,143,.15);border-color:#2f7a4f}
.nbtn.part{background:var(--warnbg);border-color:#8a6a3a}
.nbtn.zero{background:var(--badbg);border-color:#8a4a44}
.nbtn.skip{background:var(--warnbg);border-color:#8a6a3a;border-style:dashed}
/* ---------- keyword panel ---------- */
#kw-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0 12px}
/* ---------- exercise card ---------- */
#stagewrap{position:relative}
#pause-cover{position:absolute;inset:-6px;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,12,20,.55)}
#pause-cover[hidden]{display:none}
.pause-card{background:#101a2c;border:2px solid var(--warn);border-radius:14px;padding:26px 34px;text-align:center;max-width:420px}
.pause-big{font-size:22px;font-weight:800;color:var(--warn);letter-spacing:.04em;margin:0 0 6px}
#card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:filter .3s}
#card.blurred{filter:blur(7px)}
.ex-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.theme-badge{font-size:12.5px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--panel2)}
.ex-count{margin-left:auto;color:var(--mut);font-size:13.5px;font-variant-numeric:tabular-nums}
.blk{border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden}
.blk-h{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);background:#0d1929;border-bottom:1px solid var(--line);padding:6px 13px}
.blk-b{padding:11px 14px}
.blk.scen{border-left:4px solid var(--acc2)}
.blk.q{border-left:4px solid var(--warn);background:#131e31}
.blk.ans{border-left:4px solid #35507c;background:#101a2c}
.blk-b p{margin:.35em 0}
pre.mono, .mono{font-family:var(--mono);font-size:14px}
/* ---------- log viewer ---------- */
.logbox{background:#0a0f19;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-family:var(--mono);font-size:14px;line-height:1.5;overflow-x:auto;max-height:340px;overflow-y:auto}
.logbox .ln{white-space:pre;display:block}
.tok-ts{color:#7fa3c0}
.lv-ERROR,.lv-ERR,.lv-FATAL,.lv-CRITICAL,.lv-CRIT,.lv-EMERG,.lv-EMERGENCY{color:var(--bad);font-weight:700}
.lv-WARNING,.lv-WARN{color:var(--warn);font-weight:600}
.lv-INFO,.lv-NOTICE{color:#8fd0dd}
.lv-DEBUG{color:var(--mut)}
.logfilter{display:flex;gap:8px;align-items:center;margin:8px 0 6px}
.logfilter input{background:#0a0f19;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px 12px;min-height:44px;flex:1;font-family:var(--mono);font-size:14px}
.logfilter .fcount{color:var(--mut);font-size:13px;white-space:nowrap}
.logline-off{display:none}
/* ---------- config (spot) ---------- */
.cfg{font-family:var(--mono);font-size:14px}
.cfgline{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:7px;padding:8px 9px;min-height:44px;font-family:var(--mono);font-size:14px;color:var(--tx)}
.cfgline:hover{background:#152238;border-color:var(--line)}
.cfgline .no{color:var(--mut);min-width:26px;text-align:right;user-select:none}
.cfgline.mark{background:var(--accbg);border-color:#2b8aa3}
.cfgline.ok{background:var(--okbg);border-color:#2f7a4f}
.cfgline.bad{background:var(--badbg);border-color:#8a4a44}
.cfgline.miss{background:var(--warnbg);border-color:#8a6a3a}
.cfgline .tag{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
/* ---------- table / heatmap / spark ---------- */
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:right;font-size:14px}
.tbl th{background:#0d1929;color:var(--acc);font-size:13px}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-family:var(--mono)}
.heat{display:grid;gap:5px;font-variant-numeric:tabular-nums}
.heat .hcell{border-radius:7px;padding:9px 7px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line2)}
.heat .hcell b{font-size:15px}
.heat .hcell span{font-size:11.5px;color:#0c1420;font-weight:700}
.heat .hlab{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;min-height:44px}
.heat .hcol{color:var(--acc);font-size:12.5px;font-weight:700}
.h0{background:#173348}.h1{background:#7fb3c9}.h2{background:#e8c46b}.h3{background:#e0705f}
.h0 b{color:#cfe4ef}.h1 b,.h2 b,.h3 b{color:#101a2c}
.h0 span{visibility:hidden}
.spark{display:flex;flex-wrap:wrap;gap:12px}
.spark .sch{flex:1 1 240px;background:#0a0f19;border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
.spark .sch h4{margin:0 0 4px;font-size:13px;color:var(--acc);font-weight:600}
.spark .sch .snote{color:var(--mut);font-size:12.5px;margin:4px 0 0;font-family:var(--mono)}
.ticket{background:#101f18;border:1px solid #2f5c44;border-left:4px solid #3f9c6b;border-radius:9px;padding:10px 14px;font-size:14.5px}
.ticket .tid{color:var(--ok);font-weight:700;font-family:var(--mono);font-size:13.5px}
/* ---------- options (qcm/multi) ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:7px 0;min-height:44px;transition:background .2s,border-color .2s}
.opt:hover{border-color:#4a6ea6;background:#152238}
.opt .box{flex:0 0 auto;width:22px;height:22px;border:2px solid #4a6ea6;border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent;background:#0a0f19}
.opt.multi .box{border-radius:5px}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.sel .box{border-color:var(--acc);color:var(--acc)}
.opt.ok{border-color:#2f7a4f;background:var(--okbg)}
.opt.ok .box{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:#8a4a44;background:var(--badbg)}
.opt.bad .box{border-color:var(--bad);color:var(--bad)}
.opt.miss{border-color:#8a6a3a;background:var(--warnbg)}
.opt.miss .box{border-color:var(--warn);color:var(--warn)}
.opt .mark{margin-left:auto;font-weight:700;font-size:13.5px;white-space:nowrap;align-self:center}
.opt.ok .mark{color:var(--ok)}.opt.bad .mark{color:var(--bad)}.opt.miss .mark{color:var(--warn)}
/* ---------- bank ---------- */
.slots{display:inline;flex-wrap:wrap}
.slot{display:inline-block;min-width:96px;min-height:44px;margin:3px 4px;padding:4px 12px;border-radius:8px;border:1px dashed #4a6ea6;background:#0a0f19;color:var(--acc);font-weight:600;text-align:center}
.slot.filled{border-style:solid;color:var(--tx)}
.slot.ok{border-color:#2f7a4f;background:var(--okbg);color:var(--ok)}
.slot.bad{border-color:#8a4a44;background:var(--badbg);color:var(--bad)}
.slot.miss{border-color:#8a6a3a;background:var(--warnbg);color:var(--warn)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wtok{background:#152238;border:1px solid #35507c;border-radius:999px;padding:9px 15px;min-height:44px;font-weight:600;transition:background .2s}
.wtok:hover{background:#1e2f4f}
.wtok.active{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.wtok.used{opacity:.32;cursor:default}
.wtok.ok{border-color:#2f7a4f;background:var(--okbg)}
/* ---------- match ---------- */
.mrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.mlabel{flex:1 1 260px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;min-height:44px}
.mdrop{flex:1 1 220px;min-height:44px;border:1.5px dashed #4a6ea6;border-radius:10px;background:#0a0f19;display:flex;align-items:center;gap:8px;padding:4px 10px}
.mdrop.over{border-color:var(--acc);background:var(--accbg)}
.mdrop.ok{border-color:#2f7a4f;background:var(--okbg)}
.mdrop.bad{border-color:#8a4a44;background:var(--badbg)}
.mdrop .ph{color:#8fa3bd;font-size:13.5px}
.mchip{display:inline-flex;align-items:center;gap:7px;background:#152238;border:1px solid #35507c;border-radius:8px;padding:6px 10px;min-height:44px;font-size:14px}
.mchip .x{background:none;border:none;color:var(--bad);font-weight:800;min-width:44px;min-height:44px;font-size:16px}
.mpool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* ---------- order / rank ---------- */
.orow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;min-height:44px}
.orow.over{border-color:var(--acc);background:var(--accbg)}
.orow .rank{font-weight:800;color:var(--acc);min-width:26px;font-variant-numeric:tabular-nums}
.orow .obody{flex:1}
.orow.ok{border-color:#2f7a4f;background:var(--okbg)}
.orow.bad{border-color:#8a4a44;background:var(--badbg)}
.obtns{display:flex;gap:5px}
.obtn{background:#152238;border:1px solid var(--line);border-radius:7px;min-width:44px;min-height:44px;font-size:15px}
.obtn:hover{background:#1e2f4f}
.orow[draggable=true]{cursor:grab}
/* ---------- categorize ---------- */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.bucket{background:var(--panel2);border:1.5px dashed #4a6ea6;border-radius:11px;padding:10px;min-height:110px}
.bucket.over{border-color:var(--acc);background:var(--accbg)}
.bucket h4{margin:0 0 8px;font-size:13.5px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.bucket.ok{border-color:#2f7a4f}.bucket.bad{border-color:#8a4a44}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;min-height:48px}
/* ---------- terminal ---------- */
.term{background:#05080d;border:1px solid #1f3049;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55}
.term .tout{white-space:pre-wrap;word-break:break-word;color:#b9d7de;min-height:20px}
.term .tcmdline{display:flex;gap:8px;align-items:center;margin-top:6px}
.term .tps{color:var(--ok);font-weight:700;white-space:nowrap}
.term input{flex:1;background:transparent;border:none;color:var(--tx);font-family:var(--mono);font-size:14px;min-height:44px}
.term input:focus-visible{outline:2px solid var(--acc);border-radius:4px}
.term .terr{color:var(--bad)}
.term .tok2{color:var(--ok)}
/* ---------- branch ---------- */
.stage{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:10px 0;background:var(--panel2)}
.stage h4{margin:0 0 6px;font-size:13px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.stage .outc{border-left:3px solid var(--acc2);padding:7px 11px;margin:8px 0 2px;background:#0d1725;border-radius:0 8px 8px 0;color:var(--mut);font-size:14.5px}
.stage .outc.okc{border-color:#2f7a4f;color:#bfe8cf}
.stage .outc.badc{border-color:#8a4a44;color:#f0c3bf}
/* ---------- actions / hint / verdict ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.hintbox{background:var(--warnbg);border:1px solid #8a6a3a;border-radius:10px;padding:10px 14px;margin:10px 0;color:#f3ddb3}
.hintbox .hlab{font-weight:800;font-size:12.5px;letter-spacing:.07em;color:var(--warn)}
.verdict{border-radius:11px;border:1px solid var(--line);padding:13px 16px;margin:12px 0 2px}
.verdict.v-ok{background:var(--okbg);border-color:#2f7a4f}
.verdict.v-part{background:var(--warnbg);border-color:#8a6a3a}
.verdict.v-bad{background:var(--badbg);border-color:#8a4a44}
.verdict .vhead{font-weight:800;font-size:16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.verdict .vscore{font-variant-numeric:tabular-nums}
.verdict .vexp{margin-top:8px;border-top:1px solid var(--line2);padding-top:8px}
.verdict .vexp p{margin:.4em 0;color:#d9e5f2}
.verdict .vtip{margin-top:8px;font-size:14px;color:#f3ddb3;background:rgba(255,196,107,.09);border:1px dashed #8a6a3a;border-radius:8px;padding:8px 12px}
.locknote{color:var(--mut);font-size:13.5px;margin-top:6px}
/* ---------- multi-task terminal ---------- */
.ttasks{margin:0 0 10px;padding-left:24px}
.ttasks li{margin:5px 0;font-size:14.5px}
.ttasks li.tok-ok{color:var(--ok);font-weight:600}
.ttasks li.tok-bad{color:var(--bad);font-weight:600}
.ttasks .tmark{display:inline-block;min-width:20px;font-weight:800}
/* ---------- logv ---------- */
.logpick .cfgline{border-radius:7px}
.logpick .ltxt{flex:1;white-space:pre;overflow-x:auto;text-align:left}
.logpick .cfgline .tagwrap{margin-left:auto}
/* ---------- header extras ---------- */
#theme-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
#theme-strip .tchip{font-size:12.5px;padding:3px 11px}
.tchip.done{border-color:#2f7a4f}
.chip.cand{color:var(--acc);border-color:#2b8aa3}
.ver-line{color:var(--mut);font-size:13.5px;margin:10px 0 0}
.cflag{color:var(--mut)}
/* ---------- foot nav ---------- */
#foot{display:flex;justify-content:space-between;gap:10px;margin:14px 0 6px}
/* ---------- review / results ---------- */
.rev-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:12px 0}
.res-hero{border-radius:16px;padding:26px 24px;text-align:center;border:2px solid;margin-bottom:14px}
.res-hero.pass{background:linear-gradient(165deg,#0f2b1d,#0c1a26);border-color:#3f9c6b}
.res-hero.fail{background:linear-gradient(165deg,#2b1412,#1a0f16);border-color:#9c4a42}
.res-hero .seal{font-size:44px;line-height:1}
.res-hero h2{font-size:26px;margin:8px 0 4px}
.res-hero.pass h2{color:var(--ok)}
.res-hero.fail h2{color:var(--bad)}
.res-hero .bigpct{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx)}
.res-hero .sub{color:var(--mut)}
.res-hero .cert-line{margin-top:10px;font-size:14px;color:var(--mut);border-top:1px dashed var(--line2);padding-top:10px}
.theme-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--mut)}
.tchip b{color:var(--acc)}
.skipnote{background:var(--warnbg);border:1px solid #8a6a3a;border-radius:10px;padding:10px 14px;color:#f3ddb3;font-size:14.5px;margin:10px 0}
.report{margin-top:8px}
.report details{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden}
.report summary{cursor:pointer;padding:11px 15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:44px;list-style:none}
.report summary::-webkit-details-marker{display:none}
.report summary:hover{background:#152238}
.report .rlabel{font-size:12px;font-weight:800;border-radius:6px;padding:2px 9px;letter-spacing:.05em}
.rlabel.full{background:var(--okbg);color:var(--ok);border:1px solid #2f7a4f}
.rlabel.partial{background:var(--warnbg);color:var(--warn);border:1px solid #8a6a3a}
.rlabel.zero{background:var(--badbg);color:var(--bad);border:1px solid #8a4a44}
.rlabel.skipped{background:var(--warnbg);color:var(--warn);border:1px dashed #8a6a3a}
.report .rpts{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px}
.report .rbody{border-top:1px solid var(--line);padding:12px 16px}
.report .rbody h5{margin:.5em 0 .2em;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--acc)}
.report .rbody p{margin:.25em 0;font-size:14.5px;color:#d5e1ef}
.report .rxp{border-top:1px dashed var(--line2);margin-top:9px;padding-top:8px}
.ansline{font-family:var(--mono);font-size:14px;color:var(--mut);word-break:break-word}
/* ---------- responsive ---------- */
@media (max-width:760px){
  #app{padding:10px 10px 50px}
  .hdr-row{gap:6px}
  #hdr{margin:0 -10px 8px;padding-left:10px;padding-right:10px}
  .blk-b{padding:10px 11px}
  .btn{padding:9px 13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<div id="app">
  <section id="scr-intro" class="screen" aria-label="Exam introduction"></section>

    <header id="hdr">
      <div class="hdr-row">
        <div id="hdr-title"></div>
        <div class="hdr-stats">
          <span class="chip cand" id="cand-chip" hidden></span>
          <span class="chip" title="Live score in points">Score <b id="score-val">0</b><span id="score-max"></span></span>
          <span class="chip" id="timer-chip" title="Time remaining">Time <b id="timer-val">--:--</b></span>
          <button class="hbtn" id="btn-kw" type="button" aria-expanded="false">Keywords</button>
          <button class="hbtn warn" id="btn-pause" type="button">Pause</button>
          <button class="hbtn" id="btn-finish" type="button">Finish</button>
        </div>
      </div>
      <div id="prog" role="progressbar" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="prog-fill"></div></div>
      <div id="theme-strip" aria-label="Progress per theme"></div>
      <div id="pause-status" aria-live="polite"></div>
    </header>

    <nav id="nav" aria-label="Question navigator"></nav>
    <div id="kw-panel" hidden></div>

    <div id="stagewrap">
      <div id="pause-cover" hidden>
        <div class="pause-card" role="dialog" aria-label="Manual pause">

          <button class="btn primary" id="btn-resume" type="button">Resume</button>
        </div>
      </div>
      <article id="card" aria-live="polite"></article>

  <section id="scr-review" class="screen" hidden aria-label="Review before submit"></section>
  <section id="scr-results" class="screen" hidden aria-label="Final results"></section>
</div>
<script>
'use strict';
/* ===== Cloud+ 3.3 Observability — extracted keywords, grouped by theme (shown in BOTH files) ===== */
var KW = [
  ['Metrics & Telemetry','CPU utilization, memory utilization, disk IOPS, disk queue depth, storage latency, network throughput, bandwidth, network latency (RTT), packet loss, TCP retransmission, error rate, application response time, saturation, connection count'],
  ['Collection & Tools','agent-based monitoring, agentless monitoring, SNMP (poll vs trap, OID, v2c vs v3), syslog (facility, severity, UDP 514, TLS 6514), NetFlow/sFlow/IPFIX, packet capture, Amazon CloudWatch, Azure Monitor, Google Cloud Operations, pull vs push, polling interval'],
  ['Logging','application log, system log, audit log, VPC flow log, log levels (DEBUG to FATAL), log aggregation / SIEM, retention, log rotation, structured (JSON) logs, NTP time synchronization for correlation'],
  ['Alerting & Baselines','static threshold, dynamic baseline, anomaly detection, alert fatigue, deduplication and suppression, severity levels P1 to P4, escalation policy, on-call rotation, flapping alarms, maintenance window'],
  ['Visualization & Reporting','dashboard, heatmap, time-series graph, trend analysis, p95 / p99 percentiles, capacity report, uptime report'],
  ['Availability & SLA','SLA, SLO, SLI, error budget, the nines (99.9% / 99.99% / 99.999%), downtime math, RTO, RPO, service credits, availability formula'],
  ['Scaling & Optimization','autoscaling, scale-out / scale-in, scale-up / scale-down, horizontal vs vertical scaling, trigger condition, cooldown, right-sizing, scheduled scaling, predictive scaling, load balancer health check'],
  ['Performance Testing & APM','load test, stress test, soak test, synthetic monitoring, real user monitoring (RUM), APM, distributed tracing (trace / span), USE method, RED method']
];
/* ===== per-file constants ===== */
var SEV = 'MEDIUM';
var EXAM_MINUTES = 75;
var EXAM_LABEL = 'Cloud+ 3.3 — Observability (MEDIUM practice exam)';
var EXAM_LABEL_SHORT = 'Cloud+ 3.3 Observability';
var EXAM_SUB = 'CompTIA Cloud+ (CV0-004) · Chapter 3.3 — monitor cloud resources to ensure performance and availability. Every exercise here is MEDIUM severity: real reasoning, multi-step thinking, realistic data — solvable by a prepared candidate without expert-level intuition.';
var PROMPT = 'analyst@jump:~$';

var EXAMS = [
{ id:'M01', th:'Metrics', ty:'multi', ti:'Scale-out decision on the web tier',
  sc:"You monitor the web tier of an online shop. The autoscaling rule adds one instance when CPU is above 80% for 5 minutes.\nCurrent data, all instances: CPU 88% for 12 minutes · memory 54% · disk queue depth 0.3 · p95 response time 1.9 s and rising (baseline 0.4 s) · pending connections 2,400 and growing · packet loss 0.0%.",
  q:"Select all signals that justify a scale-out right now.",
  hint:"Compare each signal with the scaling rule and with the baseline. Two signals describe the same user-facing pain.",
  tip:"A scale-out decision needs signals tied to user-facing demand — a trigger metric plus evidence that users already feel the load.",
  ex:"CPU 88% for 12 minutes breaks the rule's condition (above 80% for 5 minutes), so scaling out is justified. The rising p95 response time and the growing pending connections show users already feel the delay, so do not wait for more proof. Memory is only 54%, so it is not a reason. Packet loss on the management network does not affect shoppers and does not justify web scaling.",
  opts:["CPU above the trigger for longer than 5 minutes","p95 response time far above baseline","Pending connections growing","Memory pressure on the instances","Packet loss on the management network"],
  ok:[0,1,2] },

{ id:'M02', th:'Alerting', ty:'bank', ti:'Write the alerting policy',
  sc:"You write the alerting standard for your team. Fill the missing words from the bank. Two words are distractors that fit nowhere.",
  q:"Complete the policy text.",
  hint:"Three blanks name ways to decide when to alert. One names the human cost of bad alerts. One names what happens when nobody answers a page.",
  tip:"Good alerting mixes fixed thresholds, learned baselines and anomaly detection — and it actively protects people from noise.",
  ex:"A threshold is a fixed limit such as 'CPU > 80%'. A baseline is learned from history, so it knows quiet nights and busy Mondays. Anomaly detection flags values no human rule predicted. Alert fatigue is the numbness caused by too many useless pages — it is dangerous because real alerts get missed. The escalation policy decides who receives an unanswered page next. Related hygiene: silencing alerts during an announced maintenance window is a planned suppression, not a cheat.",
  tpl:"A fixed limit such as 'CPU > 80%' is a {0}. A {1} is learned from past data, so it follows daily and weekly patterns. A system that flags values no human predicted uses {2} detection. Too many low-value alarms cause alert {3}. When nobody answers a page, the {4} policy decides who gets it next.",
  slots:["threshold","baseline","anomaly","fatigue","escalation"],
  bankX:["heatmap","saturation"] },

{ id:'M03', th:'Logging', ty:'multi', ti:'Payment service log review',
  sc:"You are triaging the payment service. Its log for the last two minutes is below. Log retention for this source is 30 days.",
  ar:[{ k:'log', name:'/var/log/app/payment-service.log', lines:[
    "2026-06-10T08:59:01Z INFO  checkout request id=a-1001 status=ok latency_ms=212",
    "2026-06-10T08:59:14Z INFO  checkout request id=a-1002 status=ok latency_ms=198",
    "2026-06-10T09:00:02Z WARN  db pool usage 94% (pool=40)",
    "2026-06-10T09:00:31Z ERROR payment gateway timeout id=a-1003 latency_ms=10012",
    "2026-06-10T09:00:33Z ERROR payment gateway timeout id=a-1004 latency_ms=10009",
    "2026-06-10T09:00:40Z WARN  db pool usage 97% (pool=40)",
    "2026-06-10T09:00:52Z ERROR payment gateway timeout id=a-1005 latency_ms=10015",
    "2026-06-10T09:01:10Z INFO  healthcheck status=ok"]}],
  q:"Select all findings that need action during triage.",
  hint:"Warnings that show a resource close to its hard limit are early signals, not noise.",
  tip:"Warnings near a hard limit (a pool, a quota, a disk) are early signals of the next errors — treat them as action items.",
  ex:"The gateway timeouts are direct failures of real requests, so they need action. The pool warnings show the connection pool at 94% and 97% of 40 connections — a nearly exhausted pool often causes the next timeouts, so act on it too. The INFO lines with status=ok are healthy traffic. Claiming that WARN lines never need action is wrong: a nearly full pool is exactly the kind of early warning logs exist for.",
  opts:["The payment gateway timeout errors","The db pool usage warnings at 94% and 97%","The INFO checkout lines with status=ok","The healthcheck line with status=ok","Nothing — WARN and INFO lines never need action"],
  ok:[0,1] },

{ id:'M04', th:'Metrics', ty:'match', ti:'Name that metric',
  sc:"A new junior analyst keeps mixing up monitoring vocabulary. Build the cheat-sheet with them.",
  q:"Match each metric to what it actually measures. One card is a distractor.",
  hint:"Two metrics are about time. One is about a waiting line.",
  tip:"Queue depth and saturation are often the earliest signs of a storage bottleneck — learn them apart from IOPS.",
  ex:"IOPS counts read/write operations per second. Queue depth counts requests waiting for the disk right now. Throughput is data moved per second. RTT is the round-trip time of a packet. Retransmissions are TCP segments sent again because they were lost. Saturation says how much extra work a resource can still take. The cable type is not a metric at all.",
  pairs:[["IOPS","Number of read/write operations per second on a disk"],["Queue depth","Requests waiting for the disk right now"],["Throughput","Data sent or received per second"],["Latency (RTT)","Time a packet takes to go and come back"],["Retransmissions","TCP segments resent because they were lost"],["Saturation","How much spare work capacity a resource still has"]],
  extra:["Type of cable used in the data center"] },

{ id:'M05', th:'Logging', ty:'terminal', ti:'Count the errors',
  sc:"You are on the jump host. The application log is at /var/log/app/payment-service.log — the service writes JSON-lines logs, one object per line, and grep works on them line by line. Lines carry levels INFO, WARN and ERROR. Last night's on-call handover says there were errors, but nobody counted them.",
  q:"Complete both tasks below in the terminal, then press Check. Each task earns its own share of the points.",
  hint:"Both tasks use grep with the full path /var/log/app/payment-service.log. The -c flag prints only a count instead of the lines themselves; a pipe into tail with a line count trims the list.",
  tip:"grep -c is the quick way to size a problem before you read every line — and tail keeps the newest lines for the handover.",
  ex:"grep -c ERROR /var/log/app/payment-service.log prints 14: the -c flag makes grep print the number of matching lines instead of the lines. For the handover, grep ERROR /var/log/app/payment-service.log | tail -3 prints the three newest errors. Counting first tells you whether you are facing 3 failures or 300; tail keeps the freshest evidence.",
  tasks:[
    { t:"Print how many lines contain the word ERROR in that log file.",
      accept:["^grep\\s+(?=.*-c)(?=.*ERROR)(?=.*payment-service\\.log).*$"],
      out:"14",
      ex:"grep -c ERROR /var/log/app/payment-service.log" },
    { t:"Print the 3 most recent ERROR lines, so you can quote them in the handover.",
      accept:["^grep\\s+(?=.*ERROR)(?=.*payment-service\\.log)(?=.*tail).*$","^tail\\s+(?=.*-n\\s*3|.*\\s-3)(?=.*ERROR)(?=.*payment-service\\.log).*$"],
      out:"2026-06-10T09:01:44Z ERROR payment gateway timeout id=a-1017 latency_ms=9987\n2026-06-10T09:01:58Z ERROR payment gateway timeout id=a-1018 latency_ms=10022\n2026-06-10T09:02:11Z ERROR payment gateway timeout id=a-1019 latency_ms=10005",
      ex:"grep ERROR /var/log/app/payment-service.log | tail -3" }
  ] },

{ id:'M06', th:'Alerting', ty:'order', ti:'Life of an alarm',
  sc:"During a review, the team realizes nobody can describe what happens between 'a metric goes bad' and 'an engineer fixes it'. Rebuild the pipeline.",
  q:"Put the life of an alarm in the right order, from first to last.",
  hint:"Something must break a rule before any person is involved. Grouping happens before any page is sent.",
  tip:"Deduplication before paging is what protects the on-call engineer from alert storms.",
  ex:"First a metric crosses its threshold. The monitoring system then fires the alert. Deduplication groups copies of the same alert so on-call receives one page instead of fifty. The primary on-call engineer is paged. If nobody acknowledges within 15 minutes, the escalation policy pages the secondary. Afterwards the team reviews the incident and tunes the rule so the same noise does not return.",
  items:["A metric crosses its threshold","The monitoring system fires the alert","Duplicate alerts are grouped (deduplication)","The on-call engineer is paged","The escalation policy pages the secondary after 15 minutes without ack","The team reviews the incident and tunes the rule"] },

{ id:'M07', th:'Collection', ty:'qcm', ti:'The dead firewall',
  sc:"Your network management system polls every firewall with SNMP every 5 minutes. At 03:02, right after a poll, firewall fw-02 loses power completely.",
  q:"What is the fastest reliable way for the NMS to learn about this failure?",
  hint:"Think about who starts the conversation: the manager (pull) or the device (push).",
  tip:"Poll = the manager asks. Trap = the device tells. Fast failure detection needs a push mechanism.",
  ex:"With polling, the NMS only learns at the next successful poll — up to 5 minutes later, and shortening the interval to 1 minute still leaves a blind spot while adding load. An SNMP trap is pushed by the device (or the UPS that sees it die) the moment it fails, so it arrives in seconds. A second OID on the same dead device cannot be polled either, and a longer timeout only slows every poll down. When you harden the setup, remember SNMPv3 authPriv — authenticated, encrypted polls and traps — beats v2c community strings.",
  opts:["Enable SNMP traps so the device or its UPS sends an immediate event when it fails","Shorten the polling interval to 1 minute","Poll a second OID on the same device","Increase the SNMP timeout on each poll"],
  ok:0 },

{ id:'M08', th:'Logging', ty:'match', ti:'Log levels',
  sc:"A developer just turned DEBUG logging on in production 'to see more'. Before you discuss costs, make sure the team reads levels correctly.",
  q:"Match each log level to its meaning.",
  hint:"Order the levels from most chatty to least chatty first.",
  ex:"DEBUG is very detailed developer output. INFO shows normal progress. WARNING means something is wrong but the app still works. ERROR means a request or operation failed. FATAL means the application cannot continue and stops. Levels let you filter cheaply: production usually keeps INFO and above. DEBUG in production grows logs fast, which burns storage and retention money.",
  tip:"Levels are a filter contract: production keeps INFO and above, DEBUG belongs on a developer laptop. WARNING means 'still works, but look', ERROR means a request failed, FATAL means the app stopped.",
  pairs:[["DEBUG","Very detailed developer-level output"],["INFO","Normal events that show progress"],["WARNING","Something is wrong but the app still works"],["ERROR","A request or operation failed"],["FATAL","The application cannot continue and stops"]],
  extra:[] },

{ id:'M09', th:'Scaling', ty:'spot', ti:'Find the scaling mistakes',
  sc:"A teammate wrote this autoscaling design for the web tier. The group runs a Java payment service; a fresh instance takes about 3 minutes to boot and warm up. Normal daytime CPU sits between 30% and 60%. Find the two lines that will cause trouble.",
  q:"Click the two faulty lines.",
  hint:"Compare the cooldown and the health-check grace period with how long an instance takes to boot.",
  tip:"Scaling timings — cooldown and health grace period — must always exceed instance startup time.",
  ex:"Instances take about 3 minutes to boot. A 60-second cooldown lets the group add more instances while the first batch is still booting, so it overshoots badly on every spike — the group ends up flapping, adding and removing in a loop. A 60-second health-check grace period marks those same slow-booting instances unhealthy and replaces them in an endless loop. The thresholds themselves (75% scale-out, 10% scale-in) are reasonable for this workload.",
  lines:["asg: web-asg (min 2, max 10)","metric: CPUUtilization (group average)","scale-out: CPU > 75% for 15 min → add 1 instance","scale-in: CPU < 10% for 30 min → remove 1 instance","cooldown: 60 seconds between any two scaling actions","health check: /healthz on port 8080, grace period 60 s","note: instances take about 3 minutes to boot and warm up"],
  wrong:[4,5] },

{ id:'M10', th:'Metrics', ty:'multi', ti:'Storage bottleneck signals',
  sc:"You review db-01 before the morning rush: disk queue depth 14 · storage latency 38 ms (baseline 3 ms) · IOPS 11,900 of a provisioned 12,000 · CPU iowait 35% · NIC throughput 28% of capacity · packet loss 0.0%.",
  q:"Select all findings that point to a storage bottleneck.",
  hint:"iowait is CPU time spent waiting for the disk — follow what the CPU is waiting for.",
  tip:"Queue depth plus latency plus IOPS at the limit together prove a storage bottleneck; one alone can mislead.",
  ex:"A queue depth of 14 means many requests are waiting for the disk. Latency of 38 ms against a 3 ms baseline and IOPS at the 12,000 provisioned limit show the disk cannot keep up with demand. iowait 35% confirms the CPU spends its time waiting on storage. The NIC at 28% and zero packet loss show the network path is healthy, so it is not the bottleneck.",
  opts:["Disk queue depth 14","Storage latency 38 ms far above the 3 ms baseline","IOPS at the provisioned limit (11,900 of 12,000)","CPU iowait 35%","NIC throughput at 28% of capacity","Packet loss 0.0%"],
  ok:[0,1,2,3] },

{ id:'M11', th:'Availability', ty:'bank', ti:'The nines, in real time',
  sc:"The sales team keeps quoting 'four nines' without knowing what it costs in real downtime. You prepare a one-paragraph explainer using a 365-day year.",
  q:"Fill the blanks with words from the bank. Some words are used more than once; two are distractors.",
  hint:"99.9% of a year leaves 8.76 hours down. Every extra nine divides the allowed downtime by ten.",
  tip:"Memorize the ladder: 99% = 3.65 days, 99.9% = 8.76 hours, 99.99% = 52.6 minutes, 99.999% = 5.26 minutes per year.",
  ex:"0.1% of a year is 8.76 hours. 0.01% is 52.6 minutes, and 0.001% is 5.26 minutes. Each extra 'nine' divides the allowed downtime by ten, which is why five nines is extremely expensive to engineer. 'Days' and 'larger' do not fit the math anywhere.",
  tpl:"The availability formula is uptime divided by total time. A 99.9% ('three nines') service may be down about 8.76 {0} per year. Four nines (99.99%) allows about 52.6 {1} per year. Five nines (99.999%) allows about 5.26 {2} per year. Each extra 'nine' makes the allowed downtime ten times {3}.",
  slots:["hours","minutes","minutes","smaller"],
  bankX:["days","larger"] },

{ id:'M12', th:'Visuals', ty:'multi', ti:'Read the heatmap',
  sc:"Your team dashboard shows one utilization heatmap per host (every cell = how busy that resource is, in %). Refresh every 5 minutes. Extra note on the panel: p99 disk latency on db-01 is 84 ms; every other host is under 5 ms.",
  ar:[{ k:'heat', name:'Host utilization (last 5 min)', cols:['CPU','Memory','Disk I/O','Network'],
    rows:[
      ["web-01",[62,71,20,30]],
      ["web-02",[58,69,18,28]],
      ["db-01",[41,55,96,12]],
      ["cache-01",[22,88,10,9]]],
    note:"Cells show utilization in %. Colors are a guide — always read the number." }],
  q:"Select all statements the heatmap supports.",
  hint:"Read across each row and compare cells inside the same host — not against one global number.",
  tip:"On a heatmap, a saturated cell next to idle cells in the same row tells you which resource binds the host.",
  ex:"db-01 shows disk I/O at 96% while its CPU sits at 41% — that is an I/O-bound host, and its CPU is not the problem. cache-01 memory at 88% is a watch item before swapping starts. The two web nodes are balanced: similar numbers on every resource. Calling db-01's CPU the biggest problem or calling cache-01's CPU saturated contradicts the panel.",
  opts:["db-01 is I/O bound — its disk cell is nearly saturated while CPU is idle","cache-01 memory is high and needs a look before it swaps","web-01 and web-02 are balanced and close to each other","db-01 CPU is the biggest problem on this panel","cache-01 CPU proves the cache is saturated"],
  ok:[0,1,2] },

{ id:'M13', th:'Collection', ty:'cat', ti:'Which data type is it?',
  sc:"You are designing the observability stack and need to route each data source to the right storage. Observability has four main data types: metrics, logs, flow records and traces.",
  q:"Sort each item into the monitoring data type it belongs to.",
  hint:"Metrics are numbers over time. Logs are event text. Flows summarize conversations. Traces follow one request across services.",
  tip:"The four pillars: metrics = numbers, logs = events, flows = connections, traces = request journeys.",
  ex:"Metrics are numeric time series — CPU utilization and IOPS series. Logs are event text lines — syslog and audit entries. Flow records summarize conversations between addresses — VPC flow logs and NetFlow records. Traces are spans that follow one request across services — the payment and auth spans. Sorting sources correctly decides where you can query them later.",
  buckets:["Metrics","Logs","Flow records","Traces"],
  citems:["CPU utilization 82%","syslog line: sshd failed password","VPC flow record: 10[.]0[.]4[.]12 → 10[.]0[.]5[.]9 ACCEPT","APM span: payment-service 240 ms","disk IOPS time series","audit log: bucket deleted by user deploy","NetFlow record: 52 KB on port 443","span: auth-service 35 ms"],
  ccorrect:[0,1,2,3,0,1,2,3] },

{ id:'M14', th:'Availability', ty:'qcm', ti:'Which downtime does the SLA allow?',
  sc:"A managed database service promises 99.95% availability per month. The provider's price list gives a 10% service credit of the monthly fee if availability drops below that. Consider one 30-day month (43,200 minutes).",
  q:"How much downtime can the 99.95% target absorb in that month?",
  hint:"0.05% of 43,200 minutes. Do it in two steps: 1% first, then divide by twenty.",
  tip:"Convert the nines into a downtime fraction first, then multiply by the period you are measuring.",
  ex:"1% of 43,200 minutes is 432 minutes. 0.05% is one twentieth of 1%, so 432 ÷ 20 = 21.6 minutes — about 21 minutes. 43.2 minutes would be 99.9%, 432 minutes would be 99%, and 216 minutes would be 99.5%. Knowing this math lets you check a vendor bill's service credits instead of trusting them.",
  opts:["About 43 minutes","About 432 minutes","About 216 minutes","About 21 minutes"],
  ok:3 },

{ id:'M15', th:'Metrics', ty:'order', ti:'The USE method',
  sc:"A host is 'slow' and four engineers are arguing. One of them suggests the USE method to bring order into the discussion.",
  q:"Put the USE method steps in order, from first to last.",
  hint:"USE = Utilization, Saturation, Errors — applied to one resource at a time, then verified.",
  tip:"USE answers 'which resource is hurting?'. Its sibling RED (Rate, Errors, Duration) does the same for services.",
  ex:"USE checks one resource at a time: first pick the resource (disk, CPU, NIC), then measure utilization (how busy it is), then saturation (how much work is queued behind it), then errors (how many operations fail). After a fix, measure again to confirm. This turns a vague 'the server is slow' into a repeatable per-resource checklist.",
  items:["Pick one resource (disk, CPU, NIC…)","Measure utilization — how busy the resource is","Measure saturation — how much work is queued","Measure errors — how many operations fail","Fix the worst resource and measure again"] },

{ id:'M16', th:'Collection', ty:'bank', ti:'Read the syslog line',
  sc:"The central log store received these lines. Answer the questions below by filling the blanks — three bank words are distractors.",
  ar:[{ k:'log', name:'/var/log/auth.log (shipped from web01)', lines:[
    "Jun 10 04:12:33 web01 sshd[2211]: Failed password for admin from 10[.]0[.]9[.]44 port 51444 ssh2",
    "Jun 10 04:12:35 web01 sshd[2211]: Failed password for admin from 10[.]0[.]9[.]44 port 51446 ssh2",
    "Jun 10 04:13:02 web01 sudo: pam_unix(sudo:auth): authentication failure; user=deploy",
    "Jun 10 04:14:55 web01 kernel: [UFW BLOCK] IN=eth0 SRC=203[.]0[.]113[.]77 DPT=22"]}],
  q:"Fill the six blanks.",
  hint:"The facility is the program family that wrote the line. Plain syslog is UDP 514; the TLS variant wraps it on a higher port.",
  tip:"Know 514 (plain UDP syslog) and 6514 (syslog over TLS) — most security policies require the TLS port.",
  ex:"web01 is the host that produced the lines. sshd writes to the auth facility. A burst of failed passwords is a brute-force attack signal. Classic syslog ships over UDP port 514; syslog over TLS uses port 6514. Retention is the policy that says how long logs are kept. 'kernel' and 'mail' are real facilities, but they did not write the sshd lines.",
  tpl:"Each line starts with a timestamp and the {0} name (here: web01). The sshd lines come from the {1} facility. A burst of failed passwords is a brute-force {2} signal. By default syslog ships over UDP port {3}; the encrypted TLS variant uses port {4}. Logs like these must be kept for the {5} period your policy defines.",
  slots:["host","auth","attack","514","6514","retention"],
  bankX:["kernel","mail"] },

{ id:'M18', th:'Metrics', ty:'branch', ti:'Slow checkout',
  sc:"Monday 10:00. Users say checkout is slow. Your dashboard: p95 latency 2.1 s (baseline 0.5 s) · error rate 0.2% · web tier CPU 55% · db-01 connections 198 of 200.",
  q:"Walk the two-step investigation. Each choice shapes what happens next.",
  hint:"Low errors plus high latency means people are waiting, not failing — find the queue that is filling up.",
  tip:"High latency with low errors usually means waiting on a shared resource — find the queue before you touch anything.",
  ex:"Step 1: reading the dashboards first is the right move — errors are low, so requests are waiting rather than failing, and 198/200 database connections point straight at the pool. Rebooting db-01 destroys evidence and adds downtime for nothing; extra web instances waste money because the web tier has headroom; asking the team can wait until you have facts. Step 2: the pool configuration and the slow query log expose the leaking report job — killing it frees connections and latency returns to baseline. Scaling the web tier opens even more connections, raising the limit trades pool exhaustion for memory pressure, and the load balancer is healthy.",
  stages:[
    { p:"What do you look at first?",
      opts:[
        { t:"Open the latency and error dashboards for the checkout path", ok:true, out:"p95 is four times baseline but errors are low — it is slowness, not breakage. db-01 connections sit at 198/200." },
        { t:"Reboot db-01 immediately", ok:false, out:"You restart a production database without evidence. Checkout drops hard for two minutes and the cause is still unknown." },
        { t:"Open a change request to double the web instances", ok:false, out:"Web CPU is 55% — the web tier has headroom. Extra instances will not fix a database-side limit." },
        { t:"Email the team asking if anything changed", ok:false, out:"Useful later, but you skipped the fastest evidence source while users are waiting." } ] },
    { p:"Connections sit at 198/200 and connection-wait events appear. What now?",
      opts:[
        { t:"Inspect the pool config and the slow query log on db-01", ok:true, out:"You find a report job that leaks connections. Killing the job frees the pool and p95 returns to baseline." },
        { t:"Scale the web tier from 4 to 8 instances", ok:false, out:"More web instances open MORE database connections — the pool exhausts faster." },
        { t:"Raise the connection limit from 200 to 500", ok:false, out:"RAM on db-01 cannot hold 500 sessions; you trade pool exhaustion for memory pressure." },
        { t:"Restart the load balancer", ok:false, out:"The LB is healthy — connections reach db-01 fine. Restarting it changes nothing." } ] } ] },

{ id:'M19', th:'Alerting', ty:'multi', ti:'What makes a good baseline',
  sc:"Your team wants CPU alarms that do not fire every Monday morning. Someone suggests 'just take the average of the last 24 hours' as the baseline.",
  q:"Select all statements that are true about building a baseline.",
  hint:"A baseline must learn the rhythm of the workload — and unlearn it when the workload changes.",
  tip:"Baseline = history with the right windows included and the wrong ones removed, refreshed after big changes.",
  ex:"Two weeks of data capture daily and weekly cycles, so weekly peaks stop causing false pages. Maintenance windows and batch jobs would teach the baseline wrong patterns, so exclude or annotate them. Any major architecture change (new instance sizes, new traffic) invalidates old numbers, so re-measure. A single busy hour is far too small a sample, and baselines age as the system grows — they are never valid forever.",
  opts:["Measure at least two weeks so weekly patterns are included","Exclude or annotate maintenance windows and batch jobs you do not want to learn","Re-check the baseline after major architecture changes","One busy hour on one day is enough data","Baselines stay valid forever after the first month"],
  ok:[0,1,2] },

{ id:'M20', th:'Collection', ty:'spot', ti:'Encrypted syslog, please',
  sc:"Security policy: all logs must leave hosts encrypted, shipped to logcollector on the TLS port, covering every message. Here is /etc/rsyslog.d/50-ship.conf. In rsyslog, a single @ sends UDP, @@ sends TCP (use @@ for TLS). Find the two lines that break the policy.",
  q:"Click the two faulty lines.",
  hint:"One line uses the wrong transport for the whole selector. One line encrypts only a piece of the log stream.",
  tip:"In rsyslog: @ = UDP, @@ = TCP/TLS. TLS syslog lives on port 6514, and the selector *.* covers every facility and severity.",
  ex:"Line 2 uses a single @ (UDP, unencrypted) to port 514 — the policy requires encrypted shipping, so it must use @@ and port 6514. Line 5 ships only the mail facility over TLS; every other facility still leaves the host unencrypted, so the selector must be *.*. The queue settings in lines 3 and 4 are good practice: they buffer logs when the collector is unreachable.",
  lines:["# ship everything to the central collector","*.* @10[.]0[.]20[.]10:514","$ActionQueueType LinkedList","$ActionResumeRetryCount -1","mail.* @10[.]0[.]20[.]10:6514","# end of file"],

{ id:'M28', th:'Collection', ty:'multi', ti:'Agent or agentless?',

/* ================= CyberPulseAcademy exercise engine — vanilla JS, self-contained ================= */
var TOPIC_ID = 'cloud-plus';
var PASS_MARK = 70;
var N = EXAMS.length;

function $(id){ return document.getElementById(id); }
function qsa(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function shufNI(a){ if(a.length<2) return a.slice(); var x=shuffle(a); for(var k=0;k<12;k++){ var idn=true; for(var i=0;i<a.length;i++){ if(x[i]!==a[i]){ idn=false; break; } } if(!idn) return x; x=shuffle(a); } return x; }
function range(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return a; }
function r1(n){ return Math.round(n*10)/10; }
function fmt1(n){ var s=n.toFixed(1); return s.replace(/\.0$/,''); }
function para(t){ return String(t).split('\n').map(function(l){ return '<p>'+esc(l)+'</p>'; }).join(''); }
function fmtT(ms){ var s=Math.max(0,Math.ceil(ms/1000)); var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function shortTxt(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }

/* ---------- state ---------- */
var ord=[], S=[], cur=0, started=false, finished=false, reported=false, timeUp=false;
var remainMs=0, tick=null, manualPause=false, checkPause=false, lastTick=Date.now();
var userName='', userCountry='', userLocale='';

function bankWords(e){ return e.slots.concat(e.bankX || []); }
function poolTarget(e, pi){ return pi < e.pairs.length ? e.pairs[pi][1] : e.extra[pi - e.pairs.length]; }

function initState(){
  ord = shufNI(range(N));
  S = ord.map(function(exIdx){
    var e = EXAMS[exIdx];
    var st = { ex:exIdx, checked:false, skipped:false, untouched:false, locked:false, grade:null, earned:null,
               hintUsed:false, touched:false, sel:[], activeRow:-1, activeChip:-1, activeItem:-1,
               assign:null, pool:null, lefts:null, disp:null, bank:null, slotWord:null, marks:{},
               execCmd:'', execOk:false, termLog:'', cmds:[], stageIdx:0, stageAns:[], stageOptMaps:null,
               placed:null, optMap:null };
    arrange(st, e);
    return st;
  });
}
function arrange(st, e){
  var t=e.ty;
  if(t==='qcm' || t==='multi'){ st.optMap = shufNI(range(e.opts.length)); }
  else if(t==='match'){ st.lefts = shufNI(range(e.pairs.length)); st.pool = shufNI(range(e.pairs.length + (e.extra ? e.extra.length : 0))); st.assign = range(e.pairs.length).map(function(){ return -1; }); }
  else if(t==='order'){ st.disp = shufNI(range(e.items.length)); }
  else if(t==='bank'){ st.bank = shufNI(range(e.slots.length + (e.bankX ? e.bankX.length : 0))); st.slotWord = e.slots.map(function(){ return -1; }); }
  else if(t==='spot' || t==='logv'){ st.marks = {}; }
  else if(t==='branch'){ st.stageOptMaps = e.stages.map(function(sg){ return shufNI(range(sg.opts.length)); }); }
  else if(t==='cat'){ st.pool = shufNI(range(e.citems.length)); st.placed = range(e.citems.length).map(function(){ return -1; }); }
}

/* ---------- timer (wall-clock based so it stays accurate under throttling) ---------- */
function startTimer(){ lastTick = Date.now(); if(tick) clearInterval(tick); tick = setInterval(onTick, 500); renderTimer(); }
function onTick(){
  var now = Date.now(), dt = now - lastTick; lastTick = now;
  if(finished || manualPause || checkPause || dt <= 0) return;
  remainMs -= dt;
  if(remainMs <= 0){ remainMs = 0; renderTimer(); timeUp = true; finalize(true); return; }
  renderTimer();
}
function renderTimer(){
  var el = $('timer-val'); if(el) el.textContent = fmtT(remainMs);
  var chip = $('timer-chip');
  if(chip){ var frac = remainMs / (EXAM_MINUTES*60000); chip.classList.toggle('low', frac < 0.2 && frac >= 0.1); chip.classList.toggle('crit', frac < 0.1); }
  var rt = $('rev-timer'); if(rt) rt.textContent = fmtT(remainMs);
}
function renderPauseUI(){
  var ps = $('pause-status'); if(!ps) return;
  var h='';
  if(manualPause) h += '<span class="pflag manual">Paused (manual)</span>';
  if(checkPause) h += '<span class="pflag review">Timer paused — review mode</span>';
  ps.innerHTML = h;
  var cover = $('pause-cover'), card = $('card');
  if(manualPause){
    cover.hidden = false; card.classList.add('blurred');
    card.setAttribute('aria-hidden','true'); card.setAttribute('inert','');
    var rb = $('btn-resume'); if(rb) rb.focus();
  }
  else { cover.hidden = true; card.classList.remove('blurred'); card.removeAttribute('aria-hidden'); card.removeAttribute('inert'); }
  var bp = $('btn-pause'); if(bp) bp.textContent = manualPause ? 'Resume' : 'Pause';
}
function togglePause(){
  if(finished || !started) return;
  manualPause = !manualPause;
  renderPauseUI();
}

/* ---------- screens ---------- */
function show(id){ ['scr-intro','scr-exam','scr-review','scr-results'].forEach(function(s){ $(s).hidden = (s !== id); }); window.scrollTo(0,0); }
function cell(v,l){ return '<div class="meta-cell"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>'; }
function kwHtml(){ return KW.map(function(t){ return '<div class="kw-theme"><h3>'+esc(t[0])+'</h3><p>'+esc(t[1])+'</p></div>'; }).join(''); }
function buildIntro(){
  var sevCls = SEV==='MEDIUM' ? 'sev-med' : 'sev-hard';
  var h = '<div class="intro-hero">'
    + '<h1>'+esc(EXAM_LABEL)+'</h1>'
    + '<span class="sev '+sevCls+'">'+SEV+' severity</span>'
    + '<p style="color:var(--mut)">'+esc(EXAM_SUB)+'</p>'
    + '<p id="intro-cand" hidden></p>'
    + '<div class="meta-grid">'
    + cell(String(N),'exercises') + cell(EXAM_MINUTES+' min','timer') + cell(PASS_MARK+'%','pass mark') + cell('−10%','per hint used') + cell('1 pt','per exercise')
    + '</div>'
    + '<p class="ver-line">v3.0 · single-file exam · score is reported to the chapter page once, when this results screen appears</p>'
    + '<div class="start-row"><button class="btn primary" id="btn-start" type="button">Start exam</button>'
    + '<span style="color:var(--mut);font-size:14px">Questions, options, banks and item order are shuffled on every attempt.</span></div>'
    + '</div>'
    + '<div class="howto"><h2>How this exam works</h2><ul>'
    + '<li><b>Check</b> grades the current exercise: green = correct, red = wrong, amber = partially right or missed. It also pauses the timer in <b>review mode</b> — the exercise, the marks and the explanation stay fully visible so you can learn. The timer resumes only when you press <b>Next</b>.</li>'
    + '<li><b>Manual Pause</b> stops the timer but hides the exercise until you press Resume. The two pauses are independent and can stack; the clock only runs when both are cleared.</li>'
    + '<li><b>Skip</b> jumps forward and marks the exercise amber in the navigator. You can return to any skipped or answered exercise while the timer runs. Skipped exercises are <b>excluded from scoring</b> — removed from both your points and the total.</li>'
    + '<li><b>Partial credit:</b> multi-answer exercises score per correct element. Example: 3 correct choices out of 5, you pick 2 right ones and 1 wrong one — you earn 2/3 of the points. Wrong picks never subtract; they just earn nothing. Single-answer exercises (one choice, one command) are all-or-nothing.</li>'
    + '<li><b>Hint</b> costs 10% of the exercise points and reveals a nudge — never the answer.</li>'
    + '<li><b>Revise:</b> after a Check the answer is locked; press Revise to unlock it, change your answer, and press Check again (the review-mode pause applies again).</li>'
    + '<li>Pass mark: <b>'+PASS_MARK+'%</b>. When you finish you get a full per-exercise report with explanations and focus tips.</li>'
    + '</ul></div>'

  $('scr-intro').innerHTML = h;
  var vl = $('intro-cand');
  if(userName){
    vl.innerHTML = 'Candidate: <b>'+esc(userName)+'</b>'+(userCountry?' <span class="cflag">('+esc(userCountry)+')</span>':'');
    vl.hidden = false;
  }
  $('btn-start').addEventListener('click', startExam);
