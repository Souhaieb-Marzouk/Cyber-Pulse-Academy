{id:"H23",type:"terminal",pts:2,
 title:"Terminal: does the contractor still have keys?",
 tags:["orphaned account","offboarding","audit logging"],
 hint:"Task 1: search authorized_keys files under /home for the contractor's entries. Task 2: the last five SSH records for that user from the sshd log.",
 scenario:"<p>A contractor separated in January. A tip-off says his keys \u201Cmight still work.\u201D On host <code>sec-jump</code>, prove or refute it. No tool is prescribed \u2014 the goal is the evidence.</p>",
 question:"<p><b>Task 1:</b> search every user\u2019s <code>authorized_keys</code> under <code>/home</code> for lines mentioning <code>contractor</code>. <b>Task 2:</b> show the last 5 SSH session records for user <code>contractor</code> from <code>/var/log/sshd.log</code>. Run each as its own command.</p>",
 data:{host:"root@sec-jump",
  tasks:[
   {goal:"Search /home for authorized_keys lines mentioning contractor.",
    accept:["(grep|rg)[\\s\\S]*authorized_keys[\\s\\S]*contractor","(grep|rg)[\\s\\S]*contractor[\\s\\S]*authorized_keys"],
    out:["/home/contractor/.ssh/authorized_keys: ssh-ed25519 AAAAC3NzaC1lZDI1... contractor@oldlaptop",
         "/home/deploy/.ssh/authorized_keys: ssh-rsa AAAAB3NzaC1yc2E... comment: contractor backup key"],
    sol:"grep -r contractor /home/*/.ssh/authorized_keys"},
   {goal:"Show the last 5 SSH records for user contractor from /var/log/sshd.log.",
    accept:["(tail|grep|last|awk|journalctl)[\\s\\S]*sshd\\.log[\\s\\S]*contractor","(tail|grep|last|awk|journalctl)[\\s\\S]*contractor[\\s\\S]*sshd\\.log"],
    out:["Mar 10 22:14:02 sec-jump sshd[8811]: Accepted publickey for contractor from 91[.]203[.]5[.]77 port 40022 ssh2",
         "Mar 10 22:16:44 sec-jump sshd[8819]: pam_unix(sshd:session): session closed for user contractor",
         "Mar 11 01:02:11 sec-jump sshd[9102]: Accepted publickey for contractor from 91[.]203[.]5[.]77 port 40110 ssh2",
         "Mar 11 01:09:56 sec-jump sshd[9117]: pam_unix(sshd:session): session closed for user contractor",
         "Mar 11 03:41:30 sec-jump sshd[9250]: Accepted publickey for contractor from 91[.]203[.]5[.]77 port 40251 ssh2"],
    sol:"grep contractor /var/log/sshd.log | tail -5"}
  ]},
 explain:"<p>Two commands produce the proof: <code>grep -r contractor /home/*/.ssh/authorized_keys</code> finds the departed contractor\u2019s key still trusted \u2014 worse, a second one planted in the <i>deploy</i> user\u2019s authorized_keys \u2014 and <code>grep contractor /var/log/sshd.log | tail -5</code> shows recent successful publickey logins from an external address. Conclusion: the <b>offboarding</b> never swept SSH keys, leaving an <b>orphaned account</b> plus an implanted key on a service identity. Actions: remove both keys, disable the account, snapshot the <b>audit logging</b> for the whole window, and hunt everything the contractor identity touched since January \u2014 then add authorized_keys review to the leaver checklist so this never repeats.</p>"},
{id:"H24",type:"multi",pts:2,
 title:"Which changes actually reduce identity attack surface?",
 tags:["managed identity","phishing-resistant MFA","legacy authentication","federation","TOTP","SMS OTP"],
 hint:"Three changes remove classes of credential or close protocols. Three are theatre, downgrade, or self-sabotage.",
 scenario:"<p>The architecture board asks which proposals genuinely shrink the identity attack surface \u2014 and which just move risk around. Exactly three of the six are real reductions.</p>",
 question:"<p>Select the <b>three</b> proposals that truly reduce attack surface.</p>",
 data:{opts:[
  {t:"Replace static API keys with managed identities and short-lived federated credentials",ok:true},
  {t:"Require phishing-resistant MFA for every administrative role",ok:true},
  {t:"Retire legacy authentication and consolidate apps behind federated SSO",ok:true},
  {t:"Force all users to rotate their passwords every 60 days",ok:false},
  {t:"Swap admins' FIDO2 keys for TOTP apps to cut hardware costs",ok:false},
  {t:"Switch user MFA from authenticator apps to SMS OTP for compatibility",ok:false}
 ]},
 explain:"<p>Real reductions remove attack classes: <b>managed identities</b> and short-lived federated credentials delete the long-lived secrets that can leak at all; <b>phishing-resistant MFA</b> for admins removes the origin-relay attack class against the most targeted identities; retiring <b>legacy authentication</b> and consolidating behind <b>federation</b> collapses thousands of local passwords into one hardened, monitored door. The false economies all widen surface: forced rotation breeds predictable passwords without removing stolen ones; TOTP instead of FIDO2 re-introduces the phishable factor; SMS OTP is worse than the authenticator it replaces (SIM-swap, relayable codes). Reducing attack surface means subtracting capability from attackers \u2014 not subtracting cost from the security budget.</p>"},

{id:"H26",type:"match",pts:3,
 title:"Match each IAM metric to what it really measures",
 tags:["phishing-resistant MFA","deprovisioning","dormant account","managed identity","access review"],
 hint:"Governance metrics answer governance questions: how protected, how fast the door closes, how much nobody watches.",
 scenario:"<p>The GRC team\u2019s dashboard shows six IAM metrics. Before they reach the board, each must carry an honest meaning \u2014 not the marketing gloss. Two glosses are decoys.</p>",
 question:"<p>Match every metric to what it actually tells you. Two glosses are decoys.</p>",
 data:{left:[
  {id:"m1",t:"% of accounts on phishing-resistant MFA"},
  {id:"m2",t:"Mean time to deprovision a leaver"},
  {id:"m3",t:"Count of dormant accounts over 90 days"},
  {id:"m4",t:"Privileged accounts per administrator"},
  {id:"m5",t:"% of service accounts on managed identity"},
  {id:"m6",t:"Access review completion rate"}
 ],
  right:[
   {id:"w1",t:"How much of the workforce is safe from AiTM phishing",pair:"m1"},
   {id:"w2",t:"The window in which a departed worker can still get in",pair:"m2"},
   {id:"w3",t:"How much sign-in surface nobody is watching",pair:"m3"},
   {id:"w4",t:"How much damage one stolen admin identity can do",pair:"m4"},
   {id:"w5",t:"How many long-lived secrets remain available to leak",pair:"m5"},
   {id:"w6",t:"Whether governance actually runs, or only exists on paper",pair:"m6"},
   {id:"w7",t:"Average CPU load of the identity provider",pair:""},
   {id:"w8",t:"Growth rate of the audit log bucket",pair:""}
  ]},
 explain:"<p><b>Phishing-resistant MFA coverage</b> is the share of accounts an AiTM proxy cannot defeat \u2014 the honest phishability number. <b>Mean time to deprovision</b> is the live window a leaver keeps working access; every hour is <b>deprovisioning</b> debt. <b>Dormant accounts over 90 days</b> count the <b>dormant account</b> surface nobody watches \u2014 the ready-made victims of the next spray. <b>Privileged accounts per administrator</b> measures aggregation of power: the more admin identities per human, the more one stolen credential unlocks. <b>Service accounts on <b>managed identity</b></b> is the inverse count of leakable long-lived secrets. And <b>access review</b> completion rate is the pulse check of governance itself \u2014 reviews that never finish protect nothing. IdP CPU load and log-bucket growth are infrastructure trivia, deliberately dressed as identity metrics.</p>"},
{id:"H27",type:"dual",pts:3,
 title:"Two views of the consent-phishing campaign",
 tags:["consent phishing","OAuth 2.0","OIDC","refresh token"],
 hint:"Blue side: separate stopping the bleeding from stopping the repeat. Red side: order the operator\u2019s moves from lure to persistence.",
 scenario:"<p>Four users granted a third-party app called <b>MailHelper</b> the <code>Mail.ReadWrite</code> scope through a consent prompt \u2014 the app arrived in a convincing \u201Cshared invoice viewer\u201D mail. No passwords were typed anywhere.</p>",
 question:"<p><b>BLUE (contain &amp; harden):</b> sort the actions into immediate vs scheduled. <b>RED (attacker view):</b> order the operator\u2019s moves.</p>",
 data:{phases:[
  {side:"BLUE",label:"Contain & harden",pts:1.5,kind:"categorize",intro:"<p>The app is legitimate-looking, registered in a consumer tenant, and holds active grants from four users.</p>",
   data:{zones:[{id:"now",label:"IMMEDIATE (today)"},{id:"later",label:"SCHEDULED (this month)"}],
    items:[
     {id:"b1",t:"Revoke the MailHelper consents and invalidate the issued refresh tokens for the four users",zone:"now"},
     {id:"b2",t:"Block the application tenant-wide so no other user can consent to it",zone:"now"},
     {id:"b3",t:"Review mailbox audit logs of the four users for exfiltration volume and targets",zone:"later"},
     {id:"b4",t:"Tighten the admin-consent workflow and run OAuth grant reviews",zone:"later"}]}},
  {side:"RED",label:"Operator's moves",pts:1.5,kind:"order",intro:"<p>You are the operator who registered MailHelper in your own tenant.</p>",
   data:{items:[
    {id:"r1",t:"Send the look-alike 'invoice viewer' mail with my consent link"},
    {id:"r2",t:"Harvest mail through the granted Mail.ReadWrite scope once a user approves"},
    {id:"r3",t:"Keep the refresh token for silent re-entry even after the user rotates passwords"}
   ]}}
 ]},
 explain:"<p><b>BLUE \u2014 immediate:</b> revoking the consents kills the issued <b>refresh token</b>s (the app\u2019s actual foothold), and blocking the app tenant-wide stops the next victim from approving it in the next mail wave. <b>Scheduled:</b> the mailbox audit review sizes the exfiltration, and the admin-consent workflow plus periodic grant reviews \u2014 the standing defense against <b>consent phishing</b> \u2014 close the process gap. <b>RED:</b> the whole chain is passwordless: register an app, mail the <b>OAuth 2.0</b> consent link (modern <b>OIDC</b> login flows make \u201Csign in with your account\u201D prompts look native), harvest mail through the approved scope, and bank the refresh token \u2014 which survives password resets, because a new password mints new tokens but does not invalidate the ones the attacker already holds. Only consent revocation does that.</p>"},
{id:"H28",type:"qcm",pts:2,
 title:"Two allows and one imperfect device",
 tags:["ABAC","deny-by-default"],
 hint:"Evaluate every policy statement independently. There is no deny anywhere \u2014 what do multiple Allows do?",
 scenario:"<p>Tenant policies for storage:</p>",
 artifacts:{kind:"code",title:"policies in force",lines:[
  "Policy-A: ALLOW storage.read IF user.department == Finance AND device.compliant == true",
  "Policy-B: ALLOW storage.read IF user.memberOf == grp-GridOutage",
  "(no explicit deny statements exist; unmatched requests fall to deny-by-default)",
  "",
  "Request context: user.department=Finance, device.compliant=false, user.memberOf=[grp-GridOutage]"
 ]},
 question:"<p>The user is in Finance, the device is NOT compliant, and she is a member of grp-GridOutage. What is the outcome of her storage.read request?</p>",
 data:{opts:[
  {t:"Allowed \u2014 the request satisfies Policy-B, and matching any single Allow grants access",ok:true},
  {t:"Denied \u2014 because Policy-A failed on the device condition",ok:false},
  {t:"Denied \u2014 non-compliant devices can never read storage, regardless of group membership",ok:false},
  {t:"Allowed only after an explicit-deny evaluation passes \u2014 which is absent here, so it defaults to deny",ok:false}
 ]},
 explain:"<p>Policies evaluate independently: each Allow is an <i>or</i> gate. Policy-A fails (device not compliant), but Policy-B \u2014 written for exactly this grid-outage scenario \u2014 matches on group membership alone. With no explicit deny anywhere, one satisfied Allow is sufficient: access is granted. The traps: \u201CPolicy-A failed, so denied\u201D imports an AND between policies that does not exist, \u201Cnever read storage\u201D invents a rule that is not written, and the last option misstates the model \u2014 deny-by-default applies only when <i>no</i> Allow matches. This is the practical <b>ABAC</b> lesson: conditions bind within a statement, statements combine as alternatives, and the safety property lives in the <b>deny-by-default</b> floor plus disciplined authoring of each statement.</p>"},
{id:"H29",type:"fill",pts:2,
 title:"Complete the JIT elevation policy",
 tags:["JIT access","PIM","standing privilege"],
 hint:"Admins hold zero permanent rights; roles wait as eligible; every activation is bounded and leaves a trail.",
 scenario:"<p>The CISO\u2019s new admin model fits in four sentences, but the paper draft lost its key words. Complete the policy for the <b>PIM</b> rollout.</p>",
 question:"<p>Fill the four blanks. Each blank is scored separately.</p>",
 data:{text:"Administrators hold [[k1]] standing rights. Roles remain [[k2]] until actually needed. Each activation requires an approver and a ticket, lasts a [[k3]] window, and writes an [[k4]] event the SOC can alert on.",
  answers:{
   k1:{accept:["no","zero"],disp:"no"},
   k2:{accept:["eligible"],disp:"eligible"},
   k3:{accept:["short","bounded","time-boxed","limited"],disp:"short"},
   k4:{accept:["audit"],disp:"audit"}},
  bank:["no","all","eligible","permanent","short","audit","alarm"]},
 explain:"<p>The four words are the whole <b>JIT access</b> model: <b>no</b> standing rights (there is no always-on Global Admin to phish), roles stay <b>eligible</b> \u2014 a dormant capability that <b>PIM</b> converts into a real assignment only on demand, with approver and ticket. The activation lives in a <b>short</b>, bounded window, so a forgotten elevation self-expires instead of becoming the next <b>standing privilege</b>. And every activation writes an <b>audit</b> event \u2014 the trail that turns out-of-hours or anomalous elevations into SOC alerts rather than silent facts. \u201CAll\u201D, \u201Cpermanent\u201D and \u201Calarm\u201D are the anti-patterns this policy exists to delete.</p>"},
{id:"H30",type:"qcm",pts:2,
 title:"Whose failure is the over-reading support app?",
 tags:["OAuth 2.0","least privilege","permission scoping"],
 hint:"Two owners, two failures: the tenant owns consent decisions, the vendor owns scope design. Pick the answer that respects both.",
 scenario:"<p>A SaaS vendor\u2019s support application read more mailbox content than its help-desk function needs \u2014 the app requested broad <b>OAuth 2.0</b> scopes, and your tenant\u2019s consent process approved them. The vendor blames your consent; you blame their scope request. The board wants the accountability line before any fix.</p>",
 question:"<p>Which statement correctly assigns responsibility and the fix?</p>",
 data:{opts:[
  {t:"You own tenant consent decisions, the vendor owns app scope design; both sides must fix their half",ok:true},
  {t:"The vendor owns everything \u2014 their application performed the read",ok:false},
  {t:"You own everything \u2014 the consent was clicked inside your tenant",ok:false},
  {t:"The cloud provider owns it \u2014 it hosts the identity platform the app used",ok:false}
 ]},
 explain:"<p>Shared responsibility applies inside identity too. <b>Your side:</b> the tenant owns who gets consent, under which review, with which scope limits \u2014 an admin-consent workflow and OAuth grant reviews are your half, and a broad approval granted without scrutiny is a tenant failure. <b>The vendor\u2019s side:</b> an application should request the narrowest scopes its function needs \u2014 <b>least privilege</b> and honest <b>permission scoping</b> \u2014 so a help-desk app asking for blanket mail read/write is a vendor design failure. Sole blame in either direction is the wrong model: the read happened because both halves failed at once. The fix is two-sided: vendor ships minimal scopes, tenant enforces consent governance \u2014 and neither the code path nor the tenancy path alone would have allowed it.</p>"}
);

function finishExam(auto){
  if(S.ended)return;
  var answered=S.exs.some(function(e,i){return !!S.checked[i]});
  if(!answered){
    var w=$("#warn-slot");
    if(auto&&w&&S.remain<=0&&w.textContent.indexOf("cannot be submitted")>=0)return;
    var msg='<div class="warnbox" role="alert">\u26A0 '+(auto?"Time is over, but every exercise was skipped. ":"")+"All exercises are skipped \u2014 the exam cannot be submitted. Go back and answer at least one exercise (Check or at least an answer), then finish again.</div>";
    if(!w){w=el("div");w.id="warn-slot";$("#stage").appendChild(w)}
    w.innerHTML=msg;
    renderNav();
    try{$("#stage").scrollIntoView({behavior:smoothPref(),block:"end"})}catch(e){}
    return;
  }
  S.ended=true;clearInterval(S.tick);
  renderResults(auto);
}
function renderResults(auto){
  var R=$("#results");R.classList.remove("hid");
  $("#stage").classList.add("hid");$("#fnav").classList.add("hid");
  var totE=0,totM=0,skipped=[],rows="";
  S.exs.forEach(function(ex,i){
    var c=S.checked[i];
    if(!c){skipped.push(i);
      rows+='<div class="rrow"><div class="rrow-h"><b>Q'+(i+1)+" \u2014 "+esc(ex.title)+'</b><span class="badge sk">\u21B7 SKIPPED \u2014 excluded from scoring</span></div>'+
        '<div class="ansline">You left this exercise unanswered, so it added nothing to your points and nothing to the maximum.</div>'+
        '<details class="exp"><summary>Show what the exercise wanted (learn from it)</summary><div class="exp-b">'+ex.explain+"</div></details></div>";
      return}
    totE+=c.earned;totM+=c.max;
    var lab=c.earned>=c.max-0.001?"full":c.earned<=0?"zero":"part";
    var labT=lab==="full"?"FULL":lab==="zero"?"ZERO":"PARTIAL";
    rows+='<div class="rrow"><div class="rrow-h"><b>Q'+(i+1)+" \u2014 "+esc(ex.title)+'</b><span><span class="badge '+lab+'">'+labT+"</span> <span style='font-size:13px;color:var(--mut)'>"+fmtP(c.earned)+" / "+fmtP(c.max)+" pts</span></span></div>"+
      '<div class="ansline"><b>Your answer:</b> '+c.yours+"</div>"+
      '<div class="ansline"><b>Correct:</b> '+c.correct+"</div>"+
      '<details class="exp" open><summary>Why \u2014 explanation &amp; focus tips</summary><div class="exp-b">'+ex.explain+"</div></details></div>";
  });
  var corr=Math.round(totE);
  var pct=totM>0?Math.round(corr/totM*100):0;
  var pass=pct>=META.passMark;
  var hero=pass?
    '<div class="pass-panel"><div style="font-size:40px">\uD83C\uDFC5</div><h2>PASS \u2014 '+pct+"%</h2><p>You reached the "+META.passMark+"% pass mark on this "+esc(META.difficulty.toUpperCase())+" exam. Certificate-style credit earned for chapter "+esc(String(META.chapter))+".</p></div>":
    '<div class="fail-panel"><div style="font-size:40px">\uD83D\uDD04</div><h2>FAIL \u2014 '+pct+"%</h2><p>You needed "+META.passMark+"%. Work through the report below, focus on the red and half-moon items, then retake the exam \u2014 questions and answers will be shuffled.</p></div>";
  var html='<h1>Results \u2014 '+esc(META.title)+"</h1>"+
    (auto?'<p class="drag-hint">Time ran out \u2014 the exam was submitted automatically.</p>':"")+
    '<div class="res-sum">'+
    '<div class="res-card"><div class="big" id="res-pct">'+(S.reducedMotion?String(pct)+"%":"0%")+'</div><div class="lbl">final percentage</div></div>'+
    '<div class="res-card"><div class="big">'+fmtP(corr)+' / '+fmtP(totM)+'</div><div class="lbl">points (skipped excluded)</div></div>'+
    '<div class="res-card"><div class="big">'+(S.exs.length-skipped.length)+' / '+S.exs.length+'</div><div class="lbl">exercises answered</div></div>'+
    '<div class="res-card"><div class="big">'+skipped.length+'</div><div class="lbl">skipped (not counted)</div></div></div>'+
    hero;
  if(skipped.length){
    html+='<div class="sk-list"><b>Skipped exercises:</b> '+skipped.map(function(i){return "Q"+(i+1)}).join(", ")+
      ". They were excluded from scoring \u2014 their points are neither earned nor possible.</div>";
  }
  html+=rows;
  html+='<div style="text-align:center;margin:16px 0"><button id="btn-retake" class="btn btn-primary" style="min-width:220px">\u21BB Retake exam</button></div>';
  R.innerHTML=html;
  $("#btn-retake").onclick=retake;
  S.reducedMotion=false;
  try{S.reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  var pctEl=$("#res-pct");
  var done=false;
  function fire(){
    if(done)return;done=true;
    reportScore(corr,totM);
  }
  if(S.reducedMotion){pctEl.textContent=pct+"%";fire()}
  else{
    var t0=null,D=700;
    function step(ts){
      if(t0==null)t0=ts;
      var k=Math.min(1,(ts-t0)/D);
      pctEl.textContent=Math.round(pct*(1-Math.pow(1-k,3)))+"%";
      if(k<1)requestAnimationFrame(step);else fire();
    }
    requestAnimationFrame(step);
    setTimeout(fire,1400);
  }
  window.scrollTo({top:0,behavior:smoothPref()});
}
function reportScore(correct,total){
  var percent=total>0?Math.round((correct/total)*100):0;
  try{
    parent.postMessage({
      type:"CYBERPULSE_SCORE",
      topicId:META.topicId,
      score:correct,
      total:total,
      percent:percent,
      passed:percent>=META.passMark
    },location.origin);
  }catch(e){/* opened directly \u2014 nothing to report to */}
}
window.addEventListener("message",function(event){
  if(!event.data)return;
  if(event.data.type!=="CYBERPULSE_INIT"&&event.data.type!=="CYBERMASTERY_INIT")return;
  try{
    S.user=event.data.username||"";
    if(!S.started)buildIntro();
  }catch(e){}
});
document.addEventListener("DOMContentLoaded",function(){
  buildAttempt();
  $("#btn-pause").onclick=function(){
    if(S.ended)return;
    S.manualPause=!S.manualPause;
    renderTimer();renderEx();
  };
  $("#btn-prev").onclick=prevEx;
  $("#btn-next").onclick=nextEx;
  $("#btn-fin").onclick=function(){finishExam(false)};
  $("#hdr").classList.add("hid");
  buildIntro();renderTimer();
});

</script>
</body>
</html>
