function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function norm(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim()}
function ICON(st){return st==="good"?"\u2713":st==="bad"?"\u2717":"\u25D0"}
function r1(n){return Math.round(n*100)/100}
function smoothPref(){try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}catch(e){return "smooth"}}

var S={idx:0,exs:[],work:[],checked:{},skipped:{},hints:{},started:false,ended:false,
  remain:0,total:0,manualPause:false,checkPause:false,tick:null,reported:false,user:""};

/* ---------- attempt lifecycle ---------- */
function buildAttempt(){
  S.idx=0;S.checked={};S.skipped={};S.hints={};S.started=false;S.ended=false;
  S.manualPause=false;S.checkPause=false;S.reported=false;
  S.total=META.estimatedMinutes*60;S.remain=S.total;
  S.exs=sh(EX).map(function(e){return e});
  S.work=S.exs.map(function(e,i){return makeWork(e,i)});
  clearInterval(S.tick);
}
function makeWork(ex,i){
  var st={i:i,ex:ex,a:{},refs:{},locked:false};
  var f=W[ex.type];if(f&&f.init)f.init(st);
  return st;
}

/* ---------- timer ---------- */
function tick(){
  if(!S.started||S.ended)return;
  if(S.manualPause||S.checkPause){renderTimer();return}
  S.remain--;
  if(S.remain<=0){S.remain=0;renderTimer();finishExam(true);return}
  renderTimer();
}
function startTimer(){clearInterval(S.tick);S.tick=setInterval(tick,1000)}
function pauseStates(){
  var a=[];if(S.manualPause)a.push("Paused (manual)");if(S.checkPause)a.push("Timer paused \u2014 review mode");
  return a;
}
function renderTimer(){
  var p=$("#pill-time");if(!p)return;
  p.textContent=fmtT(S.remain);
  p.classList.toggle("warn",S.remain>0&&S.remain<=S.total*0.2);
  p.classList.toggle("danger",S.remain>0&&S.remain<=S.total*0.1);
  var ind=$("#ind"),ps=pauseStates();
  if(ps.length){ind.classList.remove("hid");ind.textContent="\u23F8 "+ps.join(" + ")+" \u2014 the clock is frozen"}
  else ind.classList.add("hid");
  var pb=$("#btn-pause");
  if(pb)pb.textContent=S.manualPause?"Resume":"Pause";
}
function fmtT(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}

/* ---------- live score ---------- */
function earnedOf(i){var c=S.checked[i];if(!c)return 0;return c.earned}
function maxOf(i){var c=S.checked[i];return c?c.max:0}
function liveScore(){var t=0;for(var i=0;i<S.exs.length;i++){if(S.checked[i])t+=S.checked[i].earned}return r1(t)}
function updateHeader(){
  var sc=$("#pill-score");if(sc)sc.textContent="Score "+liveScore()+(liveScore()%1?" pts":" pts");
  var done=0;for(var i=0;i<S.exs.length;i++){if(S.checked[i]||S.skipped[i])done++}
  var pf=$("#pfill");if(pf)pf.style.width=Math.round(done/S.exs.length*100)+"%";
  $("#pill-q").textContent="Q "+(S.idx+1)+"/"+S.exs.length;
  var th=$("#themes");if(th){
    th.innerHTML="";
    THEMES.forEach(function(t){
      var got=0,max=0;
      for(var i=0;i<S.exs.length;i++){
        var ex=S.exs[i];if(!ex.tags||!S.checked[i])continue;
        var hit=ex.tags.some(function(g){return t.k.indexOf(g)>=0});
        if(hit){max+=S.checked[i].max;got+=S.checked[i].earned}
      }
      if(max>0)th.appendChild(el("span","th",esc(t.n)+" <b>"+r1(got)+"/"+max+"</b>"));
    });
  }
  renderNav();
}
function navState(i){
  if(S.skipped[i]&&!S.checked[i])return "st-sk";
  var c=S.checked[i];if(!c)return "";
  var m=c.max||1;
  if(c.earned>=m)return "st-ok";
  if(c.earned<=0)return "st-bad";
  return "st-part";
}
function navSym(i){
  if(S.skipped[i]&&!S.checked[i])return "\u21B7";
  var c=S.checked[i];if(!c)return "";
  var m=c.max||1;
  if(c.earned>=m)return "\u2713";
  if(c.earned<=0)return "\u2717";
  return "\u25D0";
}
function renderNav(){
  var nav=$("#nav");if(!nav)return;nav.innerHTML="";
  S.exs.forEach(function(ex,i){
    var b=el("button","nc "+navState(i)+(i===S.idx?" cur":""));
    b.type="button";b.innerHTML=esc(String(i+1))+'<span class="s">'+navSym(i)+"</span>";
    b.setAttribute("aria-label","Question "+(i+1)+": "+(navSym(i)==="\u2713"?"correct":navSym(i)==="\u2717"?"wrong":navSym(i)==="\u25D0"?"partial":navSym(i)==="\u21B7"?"skipped":"not answered")+". Open question "+(i+1));
    b.title="Q"+(i+1)+" \u2014 "+ex.title;
    b.onclick=function(){goTo(i)};
    nav.appendChild(b);
  });
}

/* ---------- navigation ---------- */
function goTo(i){
  if(S.ended)return;
  if(S.checkPause){S.checkPause=false;renderTimer()}
  S.idx=Math.max(0,Math.min(S.exs.length-1,i));
  renderEx();updateHeader();
  window.scrollTo({top:0,behavior:smoothPref()});
}
function nextEx(){
  S.checkPause=false;renderTimer();
  if(S.idx>=S.exs.length-1){showFinish();return}
  goTo(S.idx+1);
}
function prevEx(){goTo(S.idx-1)}
function showFinish(){
  var b=$("#btn-fin");if(b){b.classList.remove("hid")}
  $("#btn-next").classList.add("hid");
}

/* ---------- check / skip / revise / hint ---------- */
function doCheck(){
  var i=S.idx,st=S.work[i],ex=st.ex,f=W[ex.type];
  var res=f.score(st);
  var mult=S.hints[i]?0.9:1;
  var earned=r1(res.earned*mult);
  S.checked[i]={earned:earned,max:res.max,yours:res.yours,correct:res.correct};
  S.skipped[i]=false;
  st.locked=true;if(f.lock)f.lock(st);
  f.paint(st,res);
  var fb=$("#fb");fb.classList.remove("hid","full","part","zero");
  var label=earned>=res.max-0.001?"full":earned<=0?"zero":"partial";
  fb.classList.add(label);
  var note=S.hints[i]?" (includes \u221210% hint cost)":"";
  fb.innerHTML=ICON(label==="full"?"good":label==="zero"?"bad":"part")+
    " <b>You earned "+fmtP(earned)+" / "+fmtP(res.max)+" points</b> on this exercise \u2014 "+label+"."+note+
    (label==="part"?" Each correct element counts; wrong elements earn nothing extra.":"");
  var xp=$("#explain");xp.classList.remove("hid");
  $("#check-pause-note").classList.remove("hid");
  S.checkPause=true;
  renderTimer();updateHeader();
}
function fmtP(n){
  if(Math.abs(n-Math.round(n))<0.005)return String(Math.round(n));
  return String(Math.round(n*100)/100);
}
function doSkip(){
  S.skipped[S.idx]=true;
  if(S.idx>=S.exs.length-1){showFinish();renderNav();return}
  nextEx();
  updateHeader();
}
function doRevise(){
  var i=S.idx,st=S.work[i];
  delete S.checked[i];st.locked=false;
  S.work[i]=makeWork(st.ex,i);
  renderEx();updateHeader();
}
function doHint(){
  var i=S.idx,ex=S.exs[i],hb=$("#hintbox");
  if(S.hints[i]){if(hb)hb.classList.remove("hid");return}
  S.hints[i]=true;
  if(hb){hb.textContent="Hint (\u221210% on this exercise): "+ex.hint;hb.classList.remove("hid")}
  $("#btn-hint").setAttribute("disabled","disabled");
}

/* ---------- exercise rendering ---------- */
var ANS_LABEL={
  qcm:"CHOOSE ONE",multi:"CHOOSE ALL THAT APPLY",categorize:"DRAG OR CLICK TO SORT THE ITEMS",
  match:"MATCH THE PAIRS \u2014 click one item on each side",order:"PUT THE STEPS IN ORDER (drag, or use the arrows)",
  rank:"RANK \u2014 position 1 = handle first (drag, or use the arrows)",fill:"CLICK A WORD, THEN CLICK A BLANK",
  spot:"CLICK THE ONE LINE THAT CONTAINS THE MISTAKE",tree:"WORK THROUGH THE DECISIONS",
  triage:"SET AN ACTION FOR EVERY ROW",terminal:"TYPE THE COMMAND AND PRESS RUN",dual:"TWO VIEWS \u2014 answer both sides"
};
function renderEx(){
  var i=S.idx,st=S.work[i],ex=st.ex;
  var stage=$("#stage");stage.innerHTML="";
  var body=el("div","ex-body");
  var head=el("div","ex-head");
  head.innerHTML='<span class="ex-num">Q'+(i+1)+" of "+S.exs.length+"</span>"+
    '<span class="ex-title">'+esc(ex.title)+"</span>"+
    '<span class="ex-pts">'+fmtP(ex.pts)+" pts \u00B7 severity: "+esc(META.difficulty.toUpperCase())+"</span>";
  body.appendChild(head);
  if(ex.scenario){
    var s=el("div","blk blk-scn",'<span class="bl-label">\uD83D\uDCCB SCENARIO / CONTEXT</span>'+ex.scenario);
    body.appendChild(s);
  }
  if(ex.artifacts){var artEl=renderArtifacts(ex.artifacts);body.appendChild(artEl);
    if(ex.type==="spot"&&W.spot.bind)W.spot.bind(st,artEl);}
  var q=el("div","blk blk-q",'<span class="bl-label">\u2753 QUESTION</span>'+ex.question);
  body.appendChild(q);
  var ans=el("div","blk blk-ans ans-area",'<span class="bl-label">'+(ANS_LABEL[ex.type]||"ANSWER")+"</span>");
  W[ex.type].render(st,ans);
  body.appendChild(ans);
  var act=el("div","ex-actions");
  var bC=el("button","btn btn-primary","\u2611 Check");bC.type="button";bC.id="btn-check";bC.onclick=doCheck;
  var bS=el("button","btn btn-warn","\u21B7 Skip");bS.type="button";bS.onclick=doSkip;
  act.appendChild(bC);act.appendChild(bS);
  if(S.checked[i]){var bR=el("button","btn","\u270E Revise");bR.type="button";bR.onclick=doRevise;act.appendChild(bR)}
  var bH=el("button","btn btn-sm","\uD83D\uDCA1 Hint (\u221210%)");bH.type="button";bH.id="btn-hint";bH.onclick=doHint;
  if(S.hints[i])bH.setAttribute("disabled","disabled");
  act.appendChild(bH);
  act.appendChild(el("span","drag-hint","Check locks your answer, shows what was right or wrong, and pauses the timer for review. Next resumes the clock."));
  body.appendChild(act);
  var hb=el("div","hintbox hid");hb.id="hintbox";body.appendChild(hb);
  if(S.hints[i]){hb.textContent="Hint (\u221210% on this exercise): "+ex.hint;hb.classList.remove("hid")}
  var c=S.checked[i];
  var fb=el("div","fb hid");fb.id="fb";
  if(c){
    var label=c.earned>=c.max-0.001?"full":c.earned<=0?"zero":"partial";
    fb.classList.remove("hid");fb.classList.add(label);
    fb.innerHTML=ICON(label==="full"?"good":label==="zero"?"bad":"part")+" <b>You earned "+fmtP(c.earned)+" / "+fmtP(c.max)+" points</b> on this exercise \u2014 "+label+"."+(S.hints[i]?" (includes \u221210% hint cost)":"");
  }
  body.appendChild(fb);
  var cpn=el("div","ind hid");cpn.id="check-pause-note";
  if(c){cpn.classList.remove("hid");cpn.textContent="\u23F8 Timer paused \u2014 review mode. Press Next when you are done reading."}
  body.appendChild(cpn);
  var xp=el("div","explain hid");xp.id="explain";
  xp.innerHTML="<h4>WHY \u2014 EXPLANATION</h4>"+ex.explain;
  if(c)xp.classList.remove("hid");
  body.appendChild(xp);
  if(st.locked)body.classList.add("locked");
  if(S.manualPause){
    var v=el("div","veil",'<div class="v-in">\u23F8 Paused (manual)<br><span style="font-size:14px;color:var(--mut)">The exercise is hidden while paused. Press Resume to continue.</span></div>');
    body.appendChild(v);
  }
  stage.appendChild(body);
  $("#btn-prev").disabled=S.idx===0;
  $("#btn-next").classList.toggle("hid",S.idx>=S.exs.length-1);
  $("#btn-fin").classList.toggle("hid",!(S.idx>=S.exs.length-1&&!S.ended));
}

/* ---------- artifacts ---------- */
function renderArtifacts(a){
  var w=el("div","blk blk-art");
  w.innerHTML='<span class="bl-label">\uD83E\uDDE9 ARTIFACT'+(a.title?" \u2014 "+esc(a.title):"")+"</span>";
  if(a.kind==="logview"){
    var lv=el("div","lv");
    var top=el("div","lv-top");
    var lab=el("label",null,"Filter");lab.setAttribute("for","lvf"+a.title.length+"-"+(S.idx));
    var inp=el("input","lv-f");inp.type="text";inp.id=lab.htmlFor;inp.placeholder="type to filter lines (e.g. failure)";
    inp.setAttribute("aria-label","Filter log lines");
    var meta=el("span","lv-meta");
    top.appendChild(lab);top.appendChild(inp);top.appendChild(meta);
    var lines=el("div","lv-lines");
    var raw=a.lines;
    raw.forEach(function(l){var d=el("div","lvl",colorize(l));d.setAttribute("data-t",l.toLowerCase());lines.appendChild(d)});
    function applyF(){
      var t=norm(inp.value),n=0;
      [].forEach.call(lines.children,function(ch){
        var show=!t||ch.getAttribute("data-t").indexOf(t)>=0;
        ch.classList.toggle("hid",!show);if(show)n++;
      });
      meta.textContent=n+" / "+raw.length+" lines";
    }
    inp.addEventListener("input",applyF);applyF();
    lv.appendChild(top);lv.appendChild(lines);w.appendChild(lv);
  }else{
    var pre=el("pre","art");
    a.lines.forEach(function(l,idx){
      if(a.kind==="code"&&a.clickable){
        var b=el("button","cl",esc(l));b.type="button";b.setAttribute("data-k","l"+idx);pre.appendChild(b);
      }else{
        var d=el("span","cl",esc(l));d.setAttribute("data-k","l"+idx);pre.appendChild(d);
      }
    });
    w.appendChild(pre);
  }
  return w;
}
function colorize(line){
  var s=esc(line);
  s=s.replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="c-key">$1</span>$2');
  s=s.replace(/\b(true|false|null)\b/g,'<span class="c-num">$1</span>');
  s=s.replace(/\b(FAILED|Failure|failure|denied|DENIED|ERROR|Error|InvalidSignature|401|403)\b/g,'<span class="c-bad">$1</span>');
  s=s.replace(/\b(Success|SUCCESS|accepted|ALLOWED|allowed)\b/g,'<span class="c-ok">$1</span>');
  s=s.replace(/\b(WARN|EXPIRED|warn|risk=RISKY|Risk)\b/g,'<span class="c-warn">$1</span>');
  s=s.replace(/^(\d{4}-\d{2}-\d{2}T[\d:.]+Z?|\w{3}\s+\d{1,2}\s[\d:]{8})/,'<span class="c-dim">$1</span>');
  return s;
}
/* ===== widgets part 1: qcm, multi, categorize, match, order, fill, spot ===== */
function resolveRef(st,k){
  if(k.indexOf(":")>=0){var p=k.split(":");return (st.refs.p&&st.refs.p[+p[0]])?st.refs.p[+p[0]][p[1]]:null}
  return st.refs[k];
}
function paintRows(st,rows){
  (rows||[]).forEach(function(r){
    var elm=resolveRef(st,r.k);if(!elm)return;
    elm.classList.remove("good","bad","part");
    elm.classList.add(r.st);
    if(!elm.querySelector(".st-ic")){
      var ic=el("span","st-ic",ICON(r.st));
      ic.setAttribute("aria-label",r.st==="good"?"correct":r.st==="bad"?"wrong":"partial");
      elm.insertBefore(ic,elm.firstChild);
    }
  });
}
function refCls(st,k){var e=resolveRef(st,k);return e||null}
function lockGuard(st){return st.locked===true}

var W={};

/* ---------- QCM (single choice) ---------- */
W.qcm={
  init:function(st){st.a.pick=-1;st.a.disp=sh(st.ex.data.opts.map(function(o,i){return i}))},
  render:function(st,host){
    var box=el("div","opts");st.refs.box=box;
    st.a.disp.forEach(function(oi){
      var o=st.ex.data.opts[oi];
      var b=el("button","it");b.type="button";b.setAttribute("data-k","o"+oi);
      if(st.a.pick===oi)b.classList.add("sel");
      b.innerHTML='<span class="rad" aria-hidden="true"></span><span>'+o.t+"</span>";
      b.onclick=function(){if(lockGuard(st))return;st.a.pick=oi;
        [].forEach.call(box.children,function(c){c.classList.remove("sel")});b.classList.add("sel")};
      st.refs["o"+oi]=b;box.appendChild(b);
    });
    host.appendChild(box);
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,pk=st.a.pick,rows=[],correct="",yours="(nothing chosen)",earn=0;
    d.opts.forEach(function(o){if(o.ok)correct=o.t});
    if(pk>=0){yours=d.opts[pk].t;rows.push({k:"o"+pk,st:d.opts[pk].ok?"good":"bad"});if(d.opts[pk].ok)earn=pts}
    return {earned:earn,max:pts,rows:rows,yours:esc(yours),correct:esc(correct)};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

/* ---------- MULTI (multi-select) ---------- */
W.multi={
  init:function(st){st.a.picks={};st.a.disp=sh(st.ex.data.opts.map(function(o,i){return i}))},
  render:function(st,host){
    var box=el("div","opts");st.refs.box=box;
    st.a.disp.forEach(function(oi){
      var o=st.ex.data.opts[oi];
      var b=el("button","it");b.type="button";b.setAttribute("data-k","o"+oi);
      b.setAttribute("aria-pressed",st.a.picks[oi]?"true":"false");
      b.innerHTML='<span class="cbx" aria-hidden="true"></span><span>'+o.t+"</span>";
      if(st.a.picks[oi])b.classList.add("sel");
      b.onclick=function(){if(lockGuard(st))return;
        st.a.picks[oi]=!st.a.picks[oi];b.classList.toggle("sel",!!st.a.picks[oi]);
        b.setAttribute("aria-pressed",st.a.picks[oi]?"true":"false")};
      st.refs["o"+oi]=b;box.appendChild(b);
    });
    host.appendChild(box);
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,okI=[],rows=[],yours=[],correct=[];
    d.opts.forEach(function(o,i){if(o.ok){okI.push(i);correct.push(o.t)}});
    d.opts.forEach(function(o,i){if(!o.ok&&st.a.picks[i]){rows.push({k:"o"+i,st:"bad"});yours.push(o.t)}});
    okI.forEach(function(i){rows.push({k:"o"+i,st:st.a.picks[i]?"good":"part"})});
    okI.forEach(function(i){if(st.a.picks[i])yours.push(d.opts[i].t)});
    var earn=pts*(okI.filter(function(i){return st.a.picks[i]}).length)/(okI.length||1);
    if(!yours.length)yours=["(nothing selected)"];
    return {earned:earn,max:pts,rows:rows,yours:esc(yours.join(" | ")),correct:esc(correct.join(" | "))};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

/* ---------- CATEGORIZE (sort items into zones) ---------- */
W.categorize={
  init:function(st){
    var a=st.a;a.place={};a.sel=null;
    a.disp=sh(st.ex.data.items.map(function(x){return x.id}));
    st.ex.data.items.forEach(function(x){a.place[x.id]=null});
  },
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    host.appendChild(el("p","drag-hint","Click an item to pick it up, then click a zone to drop it. Click a placed item to put it back. Drag & drop also works."));
    var bank=el("div","bank");bank.setAttribute("aria-label","Item bank");st.refs.bank=bank;
    var grid=el("div","zones2");
    var zoneEls={};
    d.zones.forEach(function(z){
      var zn=el("div","zone");zn.setAttribute("data-zone",z.id);
      zn.setAttribute("tabindex","0");zn.setAttribute("role","button");
      zn.setAttribute("aria-label","Drop zone: "+z.label+". Pick an item, then press Enter here to drop it.");
      zn.innerHTML="<h5>"+z.label+"</h5>";
      var zb=el("div","zbody");zn.appendChild(zb);
      function tryDrop(ev){
        if(lockGuard(st))return;
        if(ev&&ev.target&&ev.target.closest&&ev.target.closest(".chip"))return;
        if(!a.sel)return;
        if(ev&&ev.preventDefault)ev.preventDefault();
        place(a.sel,z.id);
      }
      zn.onclick=tryDrop;
      zn.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){tryDrop(ev)}};
      zn.addEventListener("dragover",function(ev){ev.preventDefault();zn.classList.add("dragover")});
      zn.addEventListener("dragleave",function(){zn.classList.remove("dragover")});
      zn.addEventListener("drop",function(ev){ev.preventDefault();zn.classList.remove("dragover");
        if(lockGuard(st))return;var id=ev.dataTransfer.getData("text/plain");if(id)place(id,z.id)});
      zoneEls[z.id]=zn;grid.appendChild(zn);
    });
    function place(id,zid){
      a.place[id]=zid;a.sel=null;
      var chip=st.refs["it"+id];if(chip){zoneEls[zid].querySelector(".zbody").appendChild(chip);chip.classList.remove("sel")}
      bank.appendChild(document.createTextNode(""));
    }
    function putBack(id){
      a.place[id]=null;a.sel=null;
      var chip=st.refs["it"+id];if(chip){bank.appendChild(chip);chip.classList.remove("sel")}
    }
    a.disp.forEach(function(id){
      var it=d.items.filter(function(x){return x.id===id})[0];
      var chip=el("button","chip");chip.type="button";chip.setAttribute("data-k","it"+id);
      chip.setAttribute("draggable","true");
      chip.innerHTML=it.t;
      chip.onclick=function(ev){ev.stopPropagation();if(lockGuard(st))return;
        if(a.place[id]){putBack(id);return}
        if(a.sel===id){a.sel=null;chip.classList.remove("sel");return}
        a.sel=id;
        [].forEach.call(bank.children,function(c){if(c.classList)c.classList.remove("sel")});
        chip.classList.add("sel")};

    });
    dispR.forEach(function(id){

      b.innerHTML="<span>"+r.t+"</span>";

        a.selR=id;
        [].forEach.call(R.querySelectorAll(".it"),function(c){c.classList.remove("sel")});
        b.classList.add("sel");
        if(a.selL){var lid=a.selL;a.pair[lid]=id;a.selL=null;a.selR=null;

/* ---------- ORDER / RANK (sequence) ---------- */
function orderInit(st){st.a.seq=sh(st.ex.data.items.map(function(x){return x.id}))}
function orderRender(st,host){
  var d=st.ex.data,a=st.a;
  host.appendChild(el("p","drag-hint","Use the up/down arrows (or drag rows) to build the right sequence."));
  var list=el("div","ord");st.refs.list=list;host.appendChild(list);
  function rowFor(id){
    var it=d.items.filter(function(x){return x.id===id})[0];
    var row=el("div","orow");row.setAttribute("data-k","m"+id);row.setAttribute("draggable","true");
    row.innerHTML='<span class="pos">1</span>';
    var itb=el("div","it","<span>"+it.t+"</span>");row.appendChild(itb);
    var mv=el("div","mv");
    var up=el("button",null,"\u25B2");up.type="button";up.setAttribute("aria-label","Move up");
    var dn=el("button",null,"\u25BC");dn.type="button";dn.setAttribute("aria-label","Move down");
    up.onclick=function(){if(lockGuard(st))return;move(id,-1)};
    dn.onclick=function(){if(lockGuard(st))return;move(id,1)};
    mv.appendChild(up);mv.appendChild(dn);row.appendChild(mv);
    row.addEventListener("dragstart",function(ev){ev.dataTransfer.setData("text/plain",id)});
    row.addEventListener("dragover",function(ev){ev.preventDefault();row.classList.add("dragover")});
    row.addEventListener("dragleave",function(){row.classList.remove("dragover")});
    row.addEventListener("drop",function(ev){ev.preventDefault();row.classList.remove("dragover");
      if(lockGuard(st))return;var src=ev.dataTransfer.getData("text/plain");
      if(src&&src!==id){var si=a.seq.indexOf(src),ti=a.seq.indexOf(id);
        a.seq.splice(si,1);a.seq.splice(ti,0,src);repaint()}});
    st.refs["m"+id]=row;st.refs["row"+id]=row;
    return row;
  }
  function move(id,dir){
    var i=a.seq.indexOf(id),j=i+dir;
    if(j<0||j>=a.seq.length)return;
    var t=a.seq[i];a.seq[i]=a.seq[j];a.seq[j]=t;repaint();
  }
  function repaint(){
    a.seq.forEach(function(id){
      var row=st.refs["row"+id];list.appendChild(row);
      row.querySelector(".pos").textContent=String(a.seq.indexOf(id)+1);
    });
  }
  a.seq.forEach(function(id){list.appendChild(rowFor(id))});
  repaint();
}
function orderScore(st){
  var d=st.ex.data,pts=st.ex.pts,rows=[],yours=[],correct=[],good=0;
  d.items.forEach(function(it,ci){
    var pos=st.a.seq.indexOf(it.id);
    var ok=pos===ci;if(ok)good++;
    rows.push({k:"m"+it.id,st:ok?"good":"bad"});
  });
  st.a.seq.forEach(function(id){
    var it=d.items.filter(function(x){return x.id===id})[0];yours.push((st.a.seq.indexOf(id)+1)+". "+it.t);
  });
  d.items.forEach(function(it,i){correct.push((i+1)+". "+it.t)});
  return {earned:pts*good/d.items.length,max:pts,rows:rows,yours:yours.join(" &nbsp;\u2192&nbsp; "),correct:correct.join(" &nbsp;\u2192&nbsp; ")};
}
W.order={init:orderInit,render:orderRender,score:orderScore,paint:function(st,res){paintRows(st,res.rows)}};
W.rank={init:orderInit,render:orderRender,score:orderScore,paint:function(st,res){paintRows(st,res.rows)}};

/* ---------- FILL (word bank blanks) ---------- */
W.fill={
  init:function(st){
    var a=st.a;a.blanks={};a.selW=null;
    Object.keys(st.ex.data.answers).forEach(function(k){a.blanks[k]=null});
    a.bank=sh(st.ex.data.bank.slice());
  },
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    host.appendChild(el("p","drag-hint","Click a word from the bank, then click the blank where it belongs. Click a filled blank to put the word back."));
    var txt=el("div","filltext");
    function syncAll(key){
      var v=a.blanks[key];
      [].forEach.call(txt.querySelectorAll('.blank[data-k="b'+key+'"]'),function(bb){
        bb.textContent=v?v:"\u00A0".repeat(8);
        bb.classList.toggle("filled",!!v);
      });
    }
    var parts=d.text.split(/\[\[(\w+)\]\]/g);
    for(var i=0;i<parts.length;i++){
      if(i%2===0){txt.appendChild(document.createTextNode(parts[i]))}
      else{(function(key){
        var b=el("button","blank");b.type="button";b.setAttribute("data-k","b"+key);
        b.setAttribute("aria-label","blank "+key);
        b.textContent="\u00A0".repeat(8);
        if(a.blanks[key]){b.textContent=a.blanks[key];b.classList.add("filled")}
        b.onclick=function(){if(lockGuard(st))return;
          if(a.blanks[key]){retWord(key);return}
          if(!a.selW)return;
          a.blanks[key]=a.selW;a.selW=null;
          syncAll(key);renderBank()};
        st.refs["b"+key]=b;txt.appendChild(b);
      })(parts[i])}
    }
    host.appendChild(txt);
    var bank=el("div","wbank");bank.setAttribute("aria-label","Word bank");host.appendChild(bank);
    function retWord(key){
      var w=a.blanks[key];a.blanks[key]=null;
      syncAll(key);
      if(w)a.bank.push(w);renderBank();
    }
    function renderBank(){
      bank.innerHTML="";
      a.bank.forEach(function(w,i){
        var chip=el("button","chip");chip.type="button";
        chip.innerHTML=w;
        if(a.selW===w)chip.classList.add("sel");
        chip.onclick=function(){if(lockGuard(st))return;
          if(a.selW===w){a.selW=null}else{a.selW=w}
          renderBank()};
        bank.appendChild(chip);
      });
      if(!a.bank.length)bank.appendChild(el("span","drag-hint","(bank is empty)"));
    }
    st._retWord=retWord;renderBank();
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,keys=Object.keys(d.answers),rows=[],yours=[],correct=[],good=0;
    keys.forEach(function(k){
      var acc=d.answers[k].accept,v=norm(st.a.blanks[k]);
      var ok=v&&acc.some(function(x){return norm(x)===v});
      if(ok)good++;
      rows.push({k:"b"+k,st:ok?"good":"bad"});
      yours.push(k+": "+esc(st.a.blanks[k]||"\u2014"));
      correct.push(k+": "+esc(d.answers[k].disp||d.answers[k].accept[0]));
    });
    return {earned:pts*good/keys.length,max:pts,rows:rows,yours:yours.join(" \u00B7 "),correct:correct.join(" \u00B7 ")};
  },
  paint:function(st,res){
    (res.rows||[]).forEach(function(r){
      [].forEach.call(document.querySelectorAll('#stage .blank[data-k="'+r.k+'"]'),function(elm){
        elm.classList.remove("good","bad","part");
        elm.classList.add(r.st);
        if(!elm.querySelector(".st-ic")){
          var ic=el("span","st-ic",ICON(r.st));
          ic.setAttribute("aria-label",r.st==="good"?"correct":r.st==="bad"?"wrong":"partial");
          elm.insertBefore(ic,elm.firstChild);
        }
      });
    });
  }
};

/* ---------- TREE (branching decisions) ---------- */
W.tree={
  init:function(st){st.a.steps=[];st.a.cur=0},
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    var box=el("div");host.appendChild(box);st.refs.tbox=box;
    function drawStep(s){
      var step=d.steps[s];

      w.innerHTML="<h3>Decision "+(s+1)+" of "+d.steps.length+"</h3>"+step.p;
      var opts=el("div","opts");
      step.opts.forEach(function(o,oi){
        var b=el("button","it");b.type="button";b.setAttribute("data-k","st"+s+"o"+oi);
        b.innerHTML='<span class="rad" aria-hidden="true"></span><span>'+o.t+"</span>";
        if(a.steps[s]===oi)b.classList.add("sel");
        b.onclick=function(){if(lockGuard(st))return;
          if(a.steps[s]!=null&&a.cur>s+1)return;
          a.steps[s]=oi;if(a.cur===s)a.cur=s+1;
          [].forEach.call(opts.children,function(c){c.classList.remove("sel")});
          b.classList.add("sel");
          var old=w.querySelector(".fb-out");if(old)old.remove();
          w.appendChild(el("div","fb-out","What happens next: "+o.fb));
          if(s+1<d.steps.length&&!box.querySelector('[data-k="st'+(s+1)+'"]'))drawStep(s+1);
        };
        opts.appendChild(b);
      });
      w.appendChild(opts);box.appendChild(w);
    }
    drawStep(0);
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,rows=[],yours=[],correct=[],good=0;
    d.steps.forEach(function(s,i){

      rows.push({k:"st"+i,st:ok?"good":"bad"});
      yours.push("D"+(i+1)+": "+esc(ch!=null?s.opts[ch].t:"(no choice)"));
      var want=s.opts.filter(function(o){return o.ok})[0];
      correct.push("D"+(i+1)+": "+esc(want?want.t:"?"));
    });
    return {earned:pts*good/d.steps.length,max:pts,rows:rows,yours:yours.join("<br>"),correct:correct.join("<br>")};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

/* ---------- TERMINAL (fake shell) ---------- */
W.terminal={
  init:function(st){
    var a=st.a;a.done=st.ex.data.tasks.map(function(){return false});a.lines=[];
  },
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    var tt=el("div","ttasks");
    d.tasks.forEach(function(t,i){
      var row=el("div","tk");row.setAttribute("data-k","t"+i);
      row.innerHTML='<span class="st-ic" aria-hidden="true">'+(a.done[i]?"\u2713":"\u25CB")+"</span><span><b>Task "+(i+1)+":</b> "+t.goal+"</span>";
      tt.appendChild(row);st.refs["t"+i]=row;
    });
    var term=el("div","term");
    term.appendChild(el("div","term-bar",""+esc(d.host)+" \u2014 interactive shell (simulated, read-only)"));
    var out=el("div","term-out");term.appendChild(out);st.refs.out=out;
    var inr=el("div","term-in");
    var ps=el("span","ps",esc(d.host)+"$");
    var inp=el("input");inp.type="text";inp.setAttribute("aria-label","terminal command input");
    inp.setAttribute("autocomplete","off");inp.setAttribute("spellcheck","false");
    var run=el("button","btn btn-sm btn-primary","Run");run.type="button";
    inr.appendChild(ps);inr.appendChild(inp);inr.appendChild(run);term.appendChild(inr);
    host.appendChild(term);
    host.appendChild(tt);
    function exec(){
      if(lockGuard(st))return;
      var cmd=inp.value.trim();if(!cmd)return;
      a.lines.push({cls:"cmdl",t:d.host+"$ "+cmd});
      var hit=false;
      d.tasks.forEach(function(t,i){
        if(a.done[i])return;
        if(t.accept.some(function(re){try{return new RegExp(re,"i").test(cmd)}catch(e){return false}})){
          a.done[i]=true;hit=true;
          (t.out||[]).forEach(function(l){a.lines.push({t:l})});
          a.lines.push({cls:"okl",t:"[OK] Task "+(i+1)+" matched \u2014 the evidence is on screen."});
        }
      });
      if(!hit)a.lines.push({cls:"errl",t:"No outstanding task matched this command. Re-read the task goal: check the tool, the target path and the filter text."});
      inp.value="";drawOut();
      if(a.done.every(Boolean))a.lines.push({cls:"okl",t:"All tasks matched. Press Check to score."});
    }
    function drawOut(){
      out.innerHTML=a.lines.map(function(l){
        return '<div class="'+(l.cls||"")+'">'+esc(l.t)+"</div>";
      }).join("")||'<div class="c-dim">(no output yet \u2014 type a command below)</div>';
      out.scrollTop=out.scrollHeight;
    }
    run.onclick=exec;
    inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")exec()});
    drawOut();
    st._inp=inp;st._run=run;
  },
  lock:function(st){if(st._inp){st._inp.disabled=true;st._run.disabled=true}},
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,rows=[],yours=[],correct=[],good=0;
    d.tasks.forEach(function(t,i){
      if(st.a.done[i])good++;
      rows.push({k:"t"+i,st:st.a.done[i]?"good":"bad"});
      yours.push("Task "+(i+1)+": "+(st.a.done[i]?"matched":"not matched"));
      correct.push("Task "+(i+1)+": "+esc(t.sol||"see explanation"));
    });
    return {earned:pts*good/d.tasks.length,max:pts,rows:rows,yours:yours.join("<br>"),correct:correct.join("<br>")};
  },
  paint:function(st,res){
    (res.rows||[]).forEach(function(r){
      var elm=resolveRef(st,r.k);if(!elm)return;
      var ic=elm.querySelector(".st-ic");if(ic)ic.textContent=ICON(r.st);
      elm.classList.add(r.st);
    });
  }
};

/* ---------- DUAL (blue/red two-phase) ---------- */
W.dual={
  init:function(st){
    st.a.ph=[{},{}];st.a.open=1;
    var d=st.ex.data;
    d.phases.forEach(function(ph,p){if(W[ph.kind].init)W[ph.kind].init({ex:{data:ph.data},a:st.a.ph[p]})});

  render:function(st,host){

    st.refs.p=[{},{}];
    d.phases.forEach(function(ph,p){
      var sec=el("div","phase"+(ph.side==="RED"?" red":""));
      sec.innerHTML='<div class="phase-h"><span class="side">'+esc(ph.side)+"</span><b>"+esc(ph.label)+"</b></div>"+(ph.intro||"");
      var inner=el("div","ans-area");
      sec.appendChild(inner);
      W[ph.kind].render({ex:{data:ph.data},a:a.ph[p],refs:st.refs.p[p],i:st.i,locked:st.locked},inner);
      if(ph.side==="RED"&&a.open<2){
        sec.classList.add("locked-ph");
        inner.style.pointerEvents="none";
        sec.appendChild(el("p","drag-hint","\uD83D\uDD12 Answer the first view to unlock this one."));
        st._redSec=sec;st._redInner=inner;
      }
      host.appendChild(sec);
    });
    var first=host.querySelector(".phase");
    if(first)first.addEventListener("click",function(){
      if(st.a.open<2){st.a.open=2;
        if(st._redSec){st._redSec.classList.remove("locked-ph");st._redInner.style.pointerEvents="auto";
          var n=st._redSec.querySelector(".drag-hint:last-child");if(n&&n.textContent.indexOf("unlock")>=0)n.remove()}}
    },true);
  },
  score:function(st){
    var d=st.ex.data,rows=[],yours=[],correct=[],earn=0,max=0;
    d.phases.forEach(function(ph,p){
      var sub=W[ph.kind].score({ex:{data:ph.data,pts:ph.pts},a:st.a.ph[p]});
      max+=ph.pts;earn+=sub.earned;
      sub.rows.forEach(function(r){rows.push({k:p+":"+r.k,st:r.st})});
      yours.push("<b>"+esc(ph.side)+" \u2014 "+esc(ph.label)+":</b><br>"+sub.yours);
      correct.push("<b>"+esc(ph.side)+" \u2014 "+esc(ph.label)+":</b><br>"+sub.correct);
    });
    return {earned:earn,max:max,rows:rows,yours:yours.join("<br><br>"),correct:correct.join("<br><br>")};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

{id:"H01",type:"fill",pts:2,

{id:"H02",type:"terminal",pts:2,
 title:"Terminal: hunt the leaked deploy key",
 tags:["service account","key rotation","audit logging"],

 scenario:"<p>Six hours ago the static access key of the deploy <b>service account</b> landed in a public repository (id <code>AKIAJ4EXAMPLE7XQ</code>). You are on host <code>deploy-jump</code>. No tool is prescribed \u2014 produce the evidence.</p>",
 question:"<p><b>Task 1:</b> list every file under <code>/home/deploy</code> that still contains that key string. <b>Task 2:</b> print every line from <code>/var/audit/cloud-audit.log</code> that references that key id. Run each as its own command.</p>",

  tasks:[
   {goal:"Find every file under /home/deploy containing the key string AKIAJ4EXAMPLE7XQ.",
    accept:["(sudo\\s+)?(grep|rg)[\\s\\S]*(/home/deploy)","(sudo\\s+)?(grep|rg)[\\s\\S]*~deploy"],
    out:["/home/deploy/.aws/credentials","/home/deploy/scripts/legacy_upload.sh","/home/deploy/.git/config.backup"],
    sol:"grep -rl 'AKIAJ4EXAMPLE7XQ' /home/deploy"},
   {goal:"Print every line of /var/audit/cloud-audit.log that references AKIAJ4EXAMPLE7XQ.",
    accept:["(grep|rg)[\\s\\S]*AKIAJ4EXAMPLE7XQ[\\s\\S]*cloud-audit","(grep|rg)[\\s\\S]*cloud-audit[\\s\\S]*AKIAJ4EXAMPLE7XQ"],
    out:["2026-03-11T07:41:02Z accessKey=AKIAJ4EXAMPLE7XQ event=ListBuckets src=91[.]203[.]5[.]77 result=Success",
         "2026-03-11T07:43:55Z accessKey=AKIAJ4EXAMPLE7XQ event=GetObject key=prod/dump-2026-03.sql src=91[.]203[.]5[.]77 result=Success",
         "2026-03-11T08:02:19Z accessKey=AKIAJ4EXAMPLE7XQ event=PutBucketPolicy bucket=prod-backup src=91[.]203[.]5[.]77 result=Success"],
    sol:"grep 'AKIAJ4EXAMPLE7XQ' /var/audit/cloud-audit.log"}
  ]},
 explain:"<p>Two commands answer the two goals: <code>grep -rl 'AKIAJ4EXAMPLE7XQ' /home/deploy</code> (\u201C-r\u201D walks the tree, \u201C-l\u201D prints only file paths \u2014 three hits, including a git backup) and <code>grep 'AKIAJ4EXAMPLE7XQ' /var/audit/cloud-audit.log</code>. The audit lines are the frightening part: the key listed buckets, pulled a production SQL dump and <i>changed a bucket policy</i> \u2014 so beyond <b>key rotation</b> you now have data exfiltration and a possible persistence change to contain. Order of operations: revoke the key, snapshot the audit log as evidence, review the bucket policy change, then hunt for anything else the identity touched. Leaving copies under <code>~/.aws</code> and legacy scripts is how the next leak happens.</p>"},
{id:"H03",type:"multi",pts:2,
 title:"Which requests does the policy actually allow?",
 tags:["explicit deny","deny-by-default","permission scoping"],
 hint:"Remember the evaluation order: an explicit deny beats everything, a matching Allow grants, and silence denies.",
 scenario:"<p>One role carries the policy below. The audit quiz: for each of the five requests, decide the outcome before you check.</p>",
 artifacts:{kind:"code",title:"role policy \u2014 Auditor",lines:[
  "Statement 1: Allow  s3:GetObject                      Resource=arn:aws:s3:::reports/*",
  "Statement 2: Allow  s3:ListBucket                     Resource=arn:aws:s3:::reports",
  "Statement 3: Deny   s3:DeleteObject                   Resource=arn:aws:s3:::prod-backup/*",
  "(no other statements; unlisted actions are denied by default)"
 ]},
 question:"<p>Select <b>every request that results in Allow</b>. Careful \u2014 two of the five.</p>",
 data:{opts:[
  {t:"A: GetObject on reports/2026/q3.xlsx",ok:true},
  {t:"B: DeleteObject on prod-backup/old.zip",ok:false},
  {t:"C: GetObject on finance/q1.pdf",ok:false},
  {t:"D: ListBucket on reports",ok:true},
  {t:"E: PutObject on reports/notes.txt",ok:false}
 ]},
 explain:"<p><b>A \u2014 allowed:</b> Statement 1 matches the action and the <code>reports/*</code> resource. <b>B \u2014 denied:</b> Statement 3 is an <b>explicit deny</b> on exactly that action and bucket, and explicit deny always wins \u2014 even if some other Allow existed. <b>C \u2014 denied:</b> nothing grants <code>finance/*</code>, and with no matching Allow the <b>deny-by-default</b> verdict applies. <b>D \u2014 allowed:</b> Statement 2 matches (bucket objects use <code>/*</code>, the bucket itself does not \u2014 a classic subtlety this item tests). <b>E \u2014 denied:</b> PutObject appears in no Allow. Scoring follows the elements: A and D earn their shares; the other three earn nothing if picked.</p>"},
{id:"H04",type:"spot",pts:2,
 title:"Spot the mistake in the trust policy",
 tags:["cross-account access","least privilege"],

 scenario:"<p>An integration partner must assume role <code>Ingest-Bot</code> from their account. Security review time. One line is dangerous; the rest is reasonable hygiene.</p>",

  "    \"Action\": \"sts:AssumeRole\",",

 ]},

 data:{lines:[
  "{",
  "  \"Version\": \"2012-10-17\",",
  "  \"Statement\": [{",
  "    \"Effect\": \"Allow\",",
  "    \"Principal\": { \"AWS\": \"*\" },",
  "    \"Action\": \"sts:AssumeRole\",",
  "    \"Condition\": { \"StringEquals\": { \"sts:ExternalId\": \"ax7-2026-proc\" } }",

 explain:"<p><code>\"Principal\": {\"AWS\": \"*\"}</code> means <i>any identity from any account</i> may attempt to assume <code>Ingest-Bot</code>; the only gate left is the external id \u2014 a shared string that routinely leaks through code, tickets and screenshots. Once it leaks, strangers hold a valid door key. The correct pattern pins the principal to the partner account (for example their account ARN) and keeps the external-id condition as the confused-deputy guard \u2014 the condition line here is fine and is deliberately placed as the near-miss distractor. <b>Least privilege</b> applies to trust relationships too: the door should know its visitors by name.</p>"},

{id:"H06",type:"tree",pts:2,
 title:"Decision path: federation broke after cert rotation",
 tags:["SSO","federation","signing certificate","metadata","SAML 2.0","IdP"],
 hint:"Diagnose before fixing; never trade signature validation for convenience; automate the recurrence away.",
 scenario:"<p>Saturday 07:00 \u2014 during the planned IdP maintenance, the <b>signing certificate</b> was rotated. Now every SaaS login fails with <i>Invalid signature</i>. Users queue in the hallway. You are the senior on call.</p>",
 question:"<p>Choose the correct option at each decision point. Each decision is scored separately.</p>",
 data:{steps:[
  {p:"<p><b>Decision 1 \u2014 All SaaS logins fail with Invalid signature after the maintenance window.</b> First move?</p>",
   opts:[
    {t:"Compare the signing certificate thumbprint in the IdP metadata with what each service provider trusts",ok:true,fb:"Two minutes later the picture is clear: the IdP publishes the new cert; every SP still trusts the old one."},
    {t:"Restart the SaaS applications one by one",ok:false,fb:"Twenty minutes spent, zero diagnostic value \u2014 restarts do not refresh trust configuration."},
    {t:"Reset the federated users' passwords",ok:false,fb:"Passwords are not the problem \u2014 the assertion signature cannot be validated; you burned trust and time."}]},
  {p:"<p><b>Decision 2 \u2014 Confirmed: the IdP has the new cert, the SPs still trust the old one.</b> The fix?</p>",
   opts:[
    {t:"Update each SP trust configuration from the IdP's current metadata endpoint",ok:true,fb:"Trust is refreshed; test logins pass within the hour."},
    {t:"Temporarily disable signature validation on the SPs until Monday",ok:false,fb:"Anyone who can craft an assertion now walks in \u2014 an outage must not become an open door."},
    {t:"Issue local passwords to every user as a fallback",ok:false,fb:"You just created shadow accounts outside MFA and federation \u2014 the cleanup will take weeks."}]},
  {p:"<p><b>Decision 3 \u2014 Service restored. What prevents the repeat?</b></p>",
   opts:[
    {t:"Automate metadata refresh on the SPs and alert 30 days before any certificate expiry",ok:true,fb:"Next rotation becomes a non-event: SPs pull the new cert themselves, and expiry alerts arrive early."},
    {t:"Extend the next certificate's validity to ten years",ok:false,fb:"A decade-old key with a decade of exposure \u2014 lifetime length is not a rotation strategy."},
    {t:"Write the manual fix steps into a runbook",ok:false,fb:"A runbook documents the outage; it does not prevent it. Automation prevents it."}]}
 ]},
 explain:"<p><b>Decision 1:</b> compare first \u2014 the mismatch between IdP <b>metadata</b> and SP trust is visible in minutes, while restarts and password resets burn the outage clock and mislead the post-mortem. <b>Decision 2:</b> refresh the SP trust from the IdP\u2019s metadata; disabling <b>signature validation</b> trades a federation outage for an authentication bypass \u2014 the worst trade available \u2014 and local passwords break SSO, MFA and traceability at once. <b>Decision 3:</b> the permanent fix is automation \u2014 SPs that consume <b>federation</b> metadata refresh themselves, plus expiry alerts with lead time; a longer-lived key or a runbook only schedules the next Saturday incident.</p>"},
{id:"H07",type:"rank",pts:3,
 title:"Rank the identity incident queue",
 tags:["token replay","dormant account","MFA","access review","PIM"],
 hint:"Active compromise beats dormant exposure; pending human decisions beat batch cleanups; hygiene beats everything that is not on fire.",
 scenario:"<p>Saturday, 02:15. Six items sit in the identity incident queue. You have two engineers until 06:00. Rank them.</p>",
 question:"<p>Rank from <b>1 = work on it first</b> to <b>6 = last</b>.</p>",
 data:{items:[
  {id:"q1",t:"A stolen OAuth refresh token is being replayed against the production mailbox API right now"},
  {id:"q2",t:"A root-equivalent static key was pasted into a public gist 20 minutes ago"},
  {id:"q3",t:"A PIM activation request for Global Admin is pending, from a new admin's unmanaged device, 03:00 local"},
  {id:"q4",t:"240 dormant accounts from last week's acquisition await disablement"},
  {id:"q5",t:"One legacy app without MFA serves 30 field users"},
  {id:"q6",t:"The quarterly access review is overdue by two weeks"}
 ]},
 explain:"<p><b>1 \u2014 the replayed refresh token:</b> an active intruder with <b>token replay</b> against production mail \u2014 contain now (revoke tokens, kill sessions), before forensics destroys the trail. <b>2 \u2014 the public root-equivalent key:</b> not yet visibly abused but usable by anyone this minute \u2014 revoke and rotate; a public exposure becomes active compromise without warning. <b>3 \u2014 the suspicious <b>PIM</b> request:</b> unmanaged device at 03:00 is the classic pattern of a compromised admin \u2014 deny and investigate, but it is <i>pending</i>, so it holds unless approved carelessly. <b>4 \u2014 240 <b>dormant accounts</b>:</b> real attack surface, but batch work that survives until the fires are out. <b>5 \u2014 the MFA gap</b> on one legacy app: a standing weakness to schedule properly. <b>6 \u2014 the overdue <b>access review</b>:</b> governance hygiene \u2014 important, never urgent.</p>"},
{id:"H08",type:"match",pts:3,
 title:"Match the JWT claims to their meaning",
 tags:["JWT","claims","access token"],
 hint:"Three decoys live in the token\u2019s header or outside it entirely: the algorithm, the HMAC secret, the signature blob.",
 scenario:"<p>Your API gateway team is writing claim-by-claim validation tests. First they must agree what each <b>claim</b> in a <b>JWT</b> actually asserts. Two decoys sneak into the pool.</p>",
 question:"<p>Match every claim to its meaning. Three meanings are decoys.</p>",
 data:{left:[
  {id:"c1",t:"iss"},
  {id:"c2",t:"aud"},
  {id:"c3",t:"exp"},
  {id:"c4",t:"iat"},
  {id:"c5",t:"sub"},
  {id:"c6",t:"scope"}
 ],
  right:[
   {id:"e1",t:"Identifies the principal the token acts for",pair:"c5"},
   {id:"e2",t:"Names the issuer that created and signed the token",pair:"c1"},
   {id:"e3",t:"Names the intended receiving API of the token",pair:"c2"},
   {id:"e4",t:"Unix time after which the token must be rejected",pair:"c3"},
   {id:"e5",t:"Unix time at which the token was issued",pair:"c4"},
   {id:"e6",t:"Lists the permissions delegated to this token",pair:"c6"},
   {id:"e7",t:"The signing algorithm \u2014 it lives in the header, not the claims",pair:""},
   {id:"e8",t:"The shared secret used to sign HMAC tokens",pair:""},
   {id:"e9",t:"The cryptographic signature blob itself",pair:""}
  ]},
 explain:"<p><code>iss</code> answers <i>who minted it</i>, <code>aud</code> answers <i>who may accept it</i> \u2014 a genuine token aimed at another API must be refused on audience mismatch. <code>exp</code> is the rejection deadline for the <b>access token</b>, <code>iat</code> the birth time. <code>sub</code> names the principal the token acts for, and <code>scope</code> carries the delegated permissions your gateway must enforce per request. The three decoys are real JWT parts but not claims: <code>alg</code> lives in the header, the HMAC secret is shared key material that never travels, and the signature is the third dot-separated segment of the token itself.</p>"},
{id:"H09",type:"dual",pts:3,
 title:"Two views of a Golden SAML incident",
 tags:["SAML 2.0","signing certificate","MFA","service provider"],
 hint:"Blue side: what stops forged tokens tonight vs what rebuilds trust this quarter? Red side: fill in why the forgery is invisible.",
 scenario:"<p>Forensics confirm: the AD FS <b>token-signing certificate</b> was exported from the federation server three weeks ago. The attacker can now mint \u201CGolden SAML\u201D assertions for any user \u2014 validly signed.</p>",
 question:"<p><b>BLUE (contain &amp; rebuild):</b> sort the actions into tonight vs this quarter. <b>RED (attacker view):</b> complete the four technical blanks.</p>",
 data:{phases:[
  {side:"BLUE",label:"Contain & rebuild trust",pts:1.5,kind:"categorize",intro:"<p>The SOC lead wants the split decided in the incident bridge, not in a document.</p>",
   data:{zones:[{id:"now",label:"TONIGHT (containment)"},{id:"later",label:"THIS QUARTER (rebuild)"}],
    items:[
     {id:"b1",t:"Rotate the AD FS token-signing certificate",zone:"now"},
     {id:"b2",t:"Invalidate every SAML session and token issued in the exposure window",zone:"now"},
     {id:"b3",t:"Re-image the AD FS server from clean media and restore config from a known-good backup",zone:"later"},
     {id:"b4",t:"Alert on any future token-signing-key export or DPAPI access to its container",zone:"later"}]}},
  {side:"RED",label:"Why the forgery is invisible",pts:1.5,kind:"fill",intro:"<p>You are the operator holding the exported key material.</p>",
   data:{text:"My forged assertion carries a [[k1]] that every [[k2]] accepts, because I sign it with the stolen [[k3]] certificate. I choose any [[k4]] claim, so I become any user \u2014 the real IdP never saw the login, and MFA is never evaluated on my way in.",
    answers:{
     k1:{accept:["signature"],disp:"signature"},
     k2:{accept:["service provider","sp","service providers","sps"],disp:"service provider"},
     k3:{accept:["token-signing","token signing","adfs token-signing","signing"],disp:"token-signing"},
     k4:{accept:["name id","nameid","nameidentifier","identity","user"],disp:"name ID"}},
    bank:["signature","hash","service provider","client app","token-signing","encryption","name ID","session id"]}}
 ]},
 explain:"<p><b>BLUE \u2014 tonight:</b> rotate the <b>token-signing certificate</b> so every forged assertion stops verifying, and invalidate all SAML sessions from the exposure window \u2014 tokens already issued die with their sessions. <b>This quarter:</b> re-image AD FS (the export proves host compromise \u2014 malware may persist), and add detection on signing-key exports so the next theft raises an alarm at 02:00, not three weeks later. <b>RED:</b> the forgery works because the <b>service provider</b> only checks the <b>signature</b> \u2014 validly signed by the stolen <b>token-signing</b> cert, so it must trust it \u2014 while the attacker freely picks the <b>name ID</b> claim to become any user. The IdP is bypassed entirely: no authentication event, therefore <b>MFA</b> never evaluates. That is why Golden SAML is the federation equivalent of a skeleton key.</p>"},
{id:"H10",type:"order",pts:3,

  {id:"x2",t:"Preserve: export the audit logs for the exposure window before retention eats them"},
  {id:"x3",t:"Scope: search every account and region for usage of the revoked key ids"},
  {id:"x4",t:"Eradicate: rotate every secret the account could read (vault entries, tokens, certificates)"},
  {id:"x5",t:"Validate: watch for zero new uses of the revoked ids for 72 hours"},
  {id:"x6",t:"Harden: add secret scanning to CI and move remaining static keys to short-lived credentials"}
 ]},
 explain:"<p><b>Contain</b> first \u2014 the <b>service account</b> stops working and its keys die, ending the bleeding. <b>Preserve</b> second: <b>audit logging</b> exports must exist before anything else, because containment and rotation destroy the very evidence you need to scope the breach. <b>Scope</b> third: query every region and account for the revoked key ids \u2014 attackers rarely use one door once. <b>Eradicate</b> fourth: <b>key rotation</b> on everything the account could read from the <b>secrets manager</b>, on the assumption the attacker listed the vault. <b>Validate</b> fifth: 72 clean hours on revoked ids is the empirical all-clear. <b>Harden</b> last \u2014 secret scanning in CI plus short-lived credentials makes the whole class of incident harder to repeat. Reordering steps 2\u20134 is the classic self-inflicted evidence loss this drill exists to prevent.</p>"}
);

{id:"H11",type:"fill",pts:3,
 title:"Complete the break-glass runbook",
 tags:["break-glass account","password vault","conditional access"],

 question:"<p>Fill the four blanks. Each blank is scored separately.</p>",
 data:{text:"Keep [[k1]] break-glass accounts, credentials sealed in the [[k2]] with split knowledge between two custodians. Exclude them from [[k3]] policies so they work even when those policies misfire \u2014 but page the SOC on every single use. Test them [[k4]], and rotate their credentials after every test or real use.",
  answers:{

   k2:{accept:["vault","password vault","secrets vault"],disp:"vault"},

   k4:{accept:["quarterly","every quarter"],disp:"quarterly"}},
  bank:["two","ten","vault","wiki","conditional access","firewall","quarterly","never"]},
 explain:"<p><b>Two</b> accounts \u2014 one for each custodian, so a single sick person cannot block an emergency and a single compromised custodian cannot act alone. Sealed in a <b>vault</b> with split knowledge: no copy in a wiki, no password on a sticky note. Excluded from <b>conditional access</b> because the scenarios that need break-glass (CA misfire, IdP outage) are exactly the ones where those rules fail \u2014 the price of that exclusion is an alarm on every use, making the exception loud instead of quiet. <b>Quarterly</b> testing proves the accounts actually work; an untested emergency account is a hope, not a control. Rotation after each use keeps the sealed value evergreen.</p>"},

{id:"H13",type:"triage",pts:3,
 title:"SCIM deprovisioning is failing \u2014 triage the findings",
 tags:["SCIM","deprovisioning","provisioning","orphaned account","joiner-mover-leaver"],
 hint:"Match the symptom to the layer: token, scope/mapping rule, or the human process around an account that automation cannot see.",
 scenario:"<p>HR feeds the SaaS through <b>SCIM</b>, but leavers keep surfacing with live accounts. The connector\u2019s week of logs yields six findings. Set the correct action for each \u2014 one fix per finding, no over-reach.</p>",
 question:"<p>Set one action per row. Each row is scored separately.</p>",
 data:{actions:[
  {id:"manual",label:"Deprovision manually now"},
  {id:"token",label:"Replace the SCIM token, then re-run sync"},
  {id:"rule",label:"Fix the scope or matching rule"},
  {id:"none",label:"No action needed"}
 ],
  rows:[
   {id:"f1",t:"HR marked the leaver five days ago; the SaaS account is still active and licensed",ok:"manual",
    why:"Automation already failed for this person - close the gap by hand today."},
   {id:"f2",t:"Every SCIM call since Tuesday returns 401 Unauthorized",ok:"token",
    why:"Expired/revoked credential - replace the token, then let the sync heal the backlog."},
   {id:"f3",t:"The sync filter excludes the contractors OU, so contractor leavers are never processed",ok:"rule",
    why:"The connector was scoped to skip them - widen the scope or map them into it."},
   {id:"f4",t:"HR disabled the user at 09:00; the app shows the account disabled at 09:04 automatically",ok:"none",
    why:"The pipeline worked as designed - no gap, nothing to do."},
   {id:"f5",t:"A guest account exists with no HR record at all and unknown sponsor",ok:"manual",
    why:"Orphaned identity outside HR authority - deprovision, then find who invited it."},
   {id:"f6",t:"A user was renamed in HR; SCIM created a second account instead of updating the first",ok:"rule",
    why:"The matching attribute is misconfigured - fix the rule that binds HR identity to app account."}
  ]},
 explain:"<p><b>f1:</b> when automation has already failed a real leaver, <b>deprovisioning</b> by hand today is the only safe move \u2014 the root cause gets fixed after the gap is closed. <b>f2:</b> a wall of 401s means the <b>SCIM</b> credential died; replace the token and the backlog syncs itself. <b>f3:</b> an OU excluded from scope is a scope bug \u2014 contractor leavers were never in the pipeline\u2019s world. <b>f4:</b> disabled four minutes after HR \u2014 the <b>provisioning</b> loop is healthy; the finding only looks scary. <b>f5:</b> an account with no HR record cannot be fixed by any mapping \u2014 remove this <b>orphaned account</b>, then investigate who invited it. <b>f6:</b> a rename creating a duplicate is the classic <b>joiner-mover-leaver</b> mover bug \u2014 the matching attribute (usually the immutable id, not the e-mail) must be fixed, and the duplicate merged.</p>"},
{id:"H14",type:"categorize",pts:3,
 title:"Authentication failure or authorization failure?",
 tags:["MFA","conditional access","OAuth 2.0"],
 hint:"Was the session ever established (who are you), or was an established session refused an action (what may you do)?",
 scenario:"<p>The incident review asks for precise language: nine log lines, each one either an <b>authentication</b> failure or an <b>authorization</b> failure. Two are deliberately uncomfortable.</p>",
 question:"<p>Sort each event into <b>AUTHENTICATION FAILED</b> or <b>AUTHORIZATION FAILED</b>.</p>",
 data:{zones:[{id:"authn",label:"AUTHENTICATION FAILED"},{id:"authz",label:"AUTHORIZATION FAILED"}],
  items:[
   {id:"e1",t:"Invalid username or password",zone:"authn"},
   {id:"e2",t:"MFA challenge not satisfied",zone:"authn"},
   {id:"e3",t:"Access token expired before the API call",zone:"authn"},
   {id:"e4",t:"Account locked by smart lockout after repeated failures",zone:"authn"},
   {id:"e5",t:"SAML assertion rejected: audience mismatch",zone:"authn"},
   {id:"e6",t:"403 on s3:GetObject \u2014 role lacks the permission",zone:"authz"},
   {id:"e7",t:"OAuth scope is read-only but the call attempts a write",zone:"authz"},
   {id:"e8",t:"Group policy explicitly denies the action",zone:"authz"},
   {id:"e9",t:"Conditional access requires a compliant device; the device is personal",zone:"authn"}
  ]},
 explain:"<p><b>Authentication</b> failures stop the session from existing: wrong password, unsatisfied <b>MFA</b>, an expired token at the door, smart-lockout, the SAML audience mismatch (the assertion is refused <i>as an identity proof</i>), and the <b>conditional access</b> device check, which gates session creation. <b>Authorization</b> failures hit an established identity asking for something it may not do: the role lacks <code>s3:GetObject</code>, the <b>OAuth</b> scope is read-only against a write call, and an explicit group denial. The uncomfortable pair: audience mismatch feels like \u201Cconfiguration\u201D but the failure is at identity-proofing time; and an expired token is authentication \u2014 the identity is no longer proven, even though the user logged in fine minutes ago.</p>"},
{id:"H15",type:"fill",pts:2,
 title:"The near-miss: same city, different device",
 tags:["session hijacking","impossible travel","sign-in risk"],
 hint:"Impossible travel needs two far-apart places. Here the geography is identical \u2014 what changed instead?",
 scenario:"<p>The risk engine flags <code>d.osei</code>. Your first instinct is impossible travel \u2014 then you read the table properly.</p>",
 artifacts:{kind:"logview",title:"sign-in events \u2014 d.osei",lines:[
  "10:02:33Z  d.osei  Paris, FR  IP=82[.]14[.]6[.]31    device=d-41a  agent=Chrome/Win10  result=SUCCESS  risk=none",
  "10:06:51Z  d.osei  Paris, FR  IP=82[.]14[.]6[.]31    device=d-77c  agent=Edge/Win11    result=SUCCESS  risk=medium (unfamiliar device)"
 ]},
 question:"<p>Complete the SOC note. Two blanks, each scored separately.</p>",
 data:{text:"Both successful sign-ins come from the same city and the same IP four minutes apart, so impossible travel is ruled out. What changed is the device and browser between two live sessions \u2014 the pattern that fits is session [[k1]]: someone replayed a stolen [[k2]] on their own machine.",
  answers:{
   k1:{accept:["hijack","hijacking","session hijack","session hijacking"],disp:"hijack"},
   k2:{accept:["cookie","session cookie","cookies"],disp:"session cookie"}},
  bank:["hijack","travel","stuffing","cookie","password","certificate"]},
 explain:"<p><b>Impossible travel</b> needs distance; Paris-to-Paris in four minutes is the opposite \u2014 the geography and the IP are identical, which is exactly why the naive label fails here. The change is in the client: new device, new browser, second live session. That is <b>session hijacking</b> by cookie replay \u2014 the attacker lifted the <b>session cookie</b> (by malware, an infostealer, or an AiTM proxy) and resumed the session without a new login, so no MFA prompt ever fired. Treat it as a live intrusion: revoke the session, investigate the first device, and remember the honest <b>sign-in risk</b> signal here is the unfamiliar-device flag, not travel.</p>"}
);

EX.push(
{id:"H16",type:"match",pts:3,
 title:"Match each identity attack to its real defense",
 tags:["credential stuffing","Kerberoasting","AiTM phishing","consent phishing","OAuth consent","token replay","MFA fatigue","number matching","FIDO2 security key","password spraying","Kerberos"],
 hint:"Pair the mechanism of the attack with the control that breaks that mechanism \u2014 not with a control that merely sounds related.",
 scenario:"<p>The detection engineering team wants the attack-to-defense matrix reviewed before the chapter on identity attacks ships. Seven attacks, seven defenses, one decoy.</p>",
 question:"<p>Match every attack to the defense that actually breaks it. One defense is a decoy.</p>",
 data:{left:[
  {id:"a1",t:"Credential stuffing"},
  {id:"a2",t:"Kerberoasting"},
  {id:"a3",t:"AiTM proxy phishing"},
  {id:"a4",t:"Consent phishing (illicit OAuth grant)"},
  {id:"a5",t:"Token replay"},
  {id:"a6",t:"MFA fatigue (push bombing)"},
  {id:"a7",t:"Password spraying"}
 ],
  right:[
   {id:"s1",t:"Breach-password screening plus MFA on internet sign-ins",pair:"a1"},
   {id:"s2",t:"25+ character random service-account passwords or gMSAs (Kerberos cannot crack what does not exist)",pair:"a2"},
   {id:"s3",t:"FIDO2 keys bound to the origin \u2014 the proxy gains nothing usable",pair:"a3"},
   {id:"s4",t:"Admin consent workflow plus periodic OAuth grant reviews",pair:"a4"},
   {id:"s5",t:"Short session lifetimes and risk-triggered re-authentication",pair:"a5"},
   {id:"s6",t:"Number matching plus rate limits on push challenges",pair:"a6"},
   {id:"s7",t:"Smart lockout plus risk-based blocking of low-and-slow attempts",pair:"a7"},
   {id:"s8",t:"Full-disk encryption on every laptop",pair:""}
  ]},
 explain:"<p>Each defense targets the attack\u2019s mechanism. <b>Credential stuffing</b> reuses breached pairs, so breach screening refuses known-bad passwords and MFA absorbs the rest. <b>Kerberoasting</b> cracks service-account <b>Kerberos</b> tickets offline \u2014 make the password uncrackable (25+ random chars or gMSA auto-rotation). <b>AiTM</b> relays typed factors; only origin-bound <b>FIDO2</b> produces nothing a fake domain can use. <b>Consent phishing</b> abuses the approval flow \u2014 require admin consent and review grants. <b>Token replay</b> dies when sessions are short-lived and risky reuse forces re-auth. <b>MFA fatigue</b> floods pushes \u2014 number matching makes blind approval useless and rate limits cap the flood. <b>Password spraying</b> goes low-and-slow across accounts \u2014 smart lockout tuned for that pattern plus risk-based blocking. Disk encryption is the decoy: valuable, and irrelevant to every row.</p>"},
{id:"H17",type:"tree",pts:2,
 title:"Decision path: the 03:12 PIM activation",
 tags:["PIM","JIT access","PAM","sign-in risk"],
 hint:"Verify the human before the privilege; treat an unreachable admin on an unmanaged device as hostile; then buy the earlier detection.",
 scenario:"<p>03:12 \u2014 a newly-hired administrator requests Global Administrator activation through <b>PIM</b>, justification: \u201Cprod fix\u201D. You hold the approver role in this <b>PAM</b> setup. No pressure \u2014 except production, and the possibility that the requester is not who the request says it is.</p>",
 question:"<p>Choose the correct option at each decision point. Each decision is scored separately.</p>",
 data:{steps:[
  {p:"<p><b>Decision 1 \u2014 Global Admin activation, justification \u201Cprod fix\u201D, 03:12.</b></p>",
   opts:[
    {t:"Call the admin on the number from the HR record and check the change ticket the justification references",ok:true,fb:"No answer. The change system shows no ticket matching 'prod fix'. The request is now formally unverified."},
    {t:"Approve \u2014 the justification mentions production and production is on fire",ok:false,fb:"You granted Global Admin on two words. If the account is compromised, you just handed over the kingdom at 03:12."},
    {t:"Auto-deny every night-time activation",ok:false,fb:"A blunt policy that also blocks real 03:00 incidents \u2014 the answer is verification, not curfews."}]},
  {p:"<p><b>Decision 2 \u2014 He does not answer. The request comes from an unmanaged device in a country he never worked from.</b></p>",
   opts:[
    {t:"Deny the activation and open an identity investigation on the device and location",ok:true,fb:"Denied. The device gets isolated, the sign-in risk deep-dives, and the on-call chain contacts the admin out-of-band."},
    {t:"Approve anyway \u2014 he is an admin, he must know what he is doing",ok:false,fb:"Role identity is not authentication. Compromised admins have roles too \u2014 that is exactly what the attacker wants you to believe."},
    {t:"Extend the approval window so he can reply later",ok:false,fb:"A pending unverified Global Admin request with a longer shelf life is strictly worse."}]},
  {p:"<p><b>Decision 3 \u2014 Which control catches this pattern earlier next time?</b></p>",
   opts:[
    {t:"Require a valid ticket id for activation and block activations from unmanaged devices",ok:true,fb:"Next attempt dies at the gate: no ticket, no elevation \u2014 and unmanaged devices cannot even ask."},
    {t:"Allow longer activation windows to reduce request volume",ok:false,fb:"Longer windows mean longer blast radius per activation \u2014 the opposite direction."},
    {t:"Remove the approval requirement to reduce friction",ok:false,fb:"Friction on Global Admin is the control. Removing it removes <b>JIT access</b>'s last checkpoint."}]}
 ]},
 explain:"<p><b>Decision 1:</b> out-of-band verification of the human \u2014 a call to the HR-registered number and a real ticket check \u2014 is the only thing that separates a legitimate 03:00 firefighter from a compromised account; approving on two words or banning nights both avoid thinking. <b>Decision 2:</b> unreachable requester + unmanaged device + unfamiliar country is an elevated <b>sign-in risk</b> picture \u2014 deny and investigate; seniority is not authentication. <b>Decision 3:</b> the durable control makes bad requests impossible rather than suspicious \u2014 a mandatory ticket id plus blocking activations from unmanaged devices. That is <b>PIM</b> doing its job inside the wider <b>PAM</b> programme: <b>JIT access</b> with verification, bounded windows and an audit trail.</p>"},
{id:"H18",type:"fill",pts:3,
 title:"Write the ABAC rule without the loopholes",
 tags:["ABAC","deny-by-default","least privilege"],
 hint:"Department, device health, resource tag \u2014 and the fate of every request that fails even one check.",
 scenario:"<p>The storage platform moves to attribute-based access. You write the canonical rule for the <b>ABAC</b> documentation. One imprecise word here becomes a finding next audit.</p>",
 question:"<p>Fill the four blanks. Each blank is scored separately.</p>",
 data:{text:"ALLOW storage.read WHEN user.department == [[k1]] AND device.compliant == [[k2]] AND resource.tag == [[k3]]. A request that fails even one check is [[k4]] \u2014 ABAC grants nothing by default, and partial matches are not partial grants.",
  answers:{
   k1:{accept:["finance"],disp:"Finance"},
   k2:{accept:["true"],disp:"true"},
   k3:{accept:["prod","production"],disp:"prod"},
   k4:{accept:["denied","rejected"],disp:"denied"}},
  bank:["Finance","Marketing","true","false","prod","dev","denied","allowed"]},
 explain:"<p>The rule scopes three attributes: the user\u2019s department is <b>Finance</b>, the device health attribute is literally <b>true</b> (a compliant, managed device \u2014 \u201Cfalse\u201D would grant to everything unmanaged), and the resource tag is <b>prod</b>, tying access to the dataset the project actually owns. The last blank carries the lesson: any failed check means the whole request is <b>denied</b> \u2014 attributes combine with AND, and <b>ABAC</b> has no \u201Chalf-access\u201D. Requests that match nothing are refused too, because the model is <b>deny-by-default</b>; that is what makes the finer grain of ABAC safe instead of fragile, and it is the practical face of <b>least privilege</b>.</p>"},
{id:"H19",type:"spot",pts:2,
 title:"Spot the mistake in the rotation code",
 tags:["key rotation","secrets manager","service account"],
 hint:"Read what happens to the OLD key. \u201CGrace period\u201D is doing a lot of unlicensed work in that line.",
 scenario:"<p>The automation team ships this <b>key rotation</b> job for service accounts and asks for a security review before merge.</p>",
 artifacts:{kind:"code",clickable:true,lines:[
  "def rotate_service_key(account):",
  "    old_key = vault.read(account)",
  "    new_key = iam.create_access_key(account)",
  "    vault.update(account, new_key)",
  "    schedule.delete_key(account, old_key, when=now()+90*86400)   # keep old key as 90-day grace period",
  "    metrics.increment(\"key_rotated\", account)"
 ]},
 question:"<p>Click the ONE line that is the mistake.</p>",
 data:{lines:[
  "def rotate_service_key(account):",
  "    old_key = vault.read(account)",
  "    new_key = iam.create_access_key(account)",
  "    vault.update(account, new_key)",
  "    schedule.delete_key(account, old_key, when=now()+90*86400)   # keep old key as 90-day grace period",
  "    metrics.increment(\"key_rotated\", account)"
 ],bad:[4],
  why:"Rotation without revocation: the old key stays valid for 90 more days."},
 explain:"<p>The job creates a new key and updates the vault \u2014 then lets the <b>old key live for 90 more days</b> as a \u201Cgrace period\u201D. That is <b>key rotation</b> in name only: every system that leaked the old key (a repo, a backup, a laptop) keeps full access for a quarter, and the rotation metric even reports success. Real rotation has two moments: the new credential goes live, and the old one is revoked \u2014 cutover happens in the same window, with any stragglers failing loudly and being fixed. The <b>secrets manager</b> should be the only place the current value exists, and the delete should be immediate. The other lines are fine and deliberately boring.</p>"},
{id:"H20",type:"triage",pts:3,
 title:"Recertification exceptions: approve, revoke, demand evidence, or escalate?",
 tags:["access review","recertification","separation of duties","privilege creep","RBAC"],
 hint:"Two rows hide live risk signals; one row is a governance conflict that belongs above your pay grade; evidence beats opinion.",
 scenario:"<p>Your <b>recertification</b> campaign returns six exceptions that the line managers could not decide. As the IAM lead you own the call \u2014 and three of these are traps for the reflexive answer.</p>",
 question:"<p>Set one action per row. Each row is scored separately.</p>",
 data:{actions:[
  {id:"approve",label:"Approve (reconfirm for this cycle)"},
  {id:"revoke",label:"Revoke now"},
  {id:"evidence",label:"Request evidence before deciding"},
  {id:"escalate",label:"Escalate beyond this campaign"}
 ],
  rows:[
   {id:"z1",t:"CFO holds finance-admin since the acquisition; it conflicts with the separation-of-duties matrix",ok:"escalate",
    why:"A SoD conflict on the CFO is a governance decision with business context - above the campaign's authority."},
   {id:"z2",t:"Vendor account, contract renewed last month, sponsor confirmed, expiry date set",ok:"approve",
    why:"Documented need, active contract, bounded lifetime - a clean reconfirmation."},
   {id:"z3",t:"Developer with production write access and no approval trail anywhere",ok:"revoke",
    why:"Privilege without provenance - remove it, then issue it properly through governance."},
   {id:"z4",t:"User on sick leave for five months; the account was used successfully last week from a new device",ok:"escalate",
    why:"Usage during long absence is a live compromise signal - security investigation, not an access decision."},
   {id:"z5",t:"Admin role auto-renewed for the 6th cycle; owner says 'still needed' but shows zero use in 12 months",ok:"revoke",
    why:"Twelve months of zero use beats a feeling - revoke; JIT or re-request covers the rare need."},
   {id:"z6",t:"Data analyst access matches the current project and shows weekly legitimate use",ok:"approve",
    why:"Need, use and role all agree - confirm and move on."}
  ]},
 explain:"<p><b>z1:</b> a <b>separation of duties</b> conflict at CFO level is not a checkbox \u2014 it needs compensating controls and board-level context, so it escalates beyond the campaign. <b>z2:</b> renewed contract, confirmed sponsor, expiry set \u2014 a textbook clean approval. <b>z3:</b> production write with no provenance is unmanaged privilege \u2014 <b>privilege creep</b> in its purest form; revoke, then re-issue through governance if a need exists. <b>z4:</b> activity during a five-month absence is not an access question at all \u2014 it is a likely compromise, so it escalates to security investigation immediately. <b>z5:</b> the owner\u2019s \u201Cstill needed\u201D loses to twelve months of zero usage \u2014 in an <b>RBAC</b> world the role stays defined, the stale assignment goes; <b>access review</b> exists precisely to kill these. <b>z6:</b> need, usage and role agree \u2014 approve. The campaign\u2019s value is the quality of these decisions, not their speed.</p>"}
);

{id:"H21",type:"qcm",pts:2,
 title:"Issuer not recognized",
 tags:["federation","metadata","SAML 2.0","IdP"],
 hint:"The error is about identity of the IdP itself, not about user credentials or certificates.",
 scenario:"<p>After a routine IdP re-deploy on new infrastructure, every SaaS login fails instantly with <i>Issuer not recognized</i>. The old and new endpoints: <code>hxxps://idp.corp.example/sso</code> became <code>hxxps://sso.corp.example/idp</code>. Certificates are unchanged and users authenticate fine at the IdP itself.</p>",
 question:"<p>What happened, and what is the correct fix?</p>",
 data:{opts:[
  {t:"The IdP entityID changed with the redeploy; update the SPs' allowed-issuer list from the fresh metadata",ok:true},
  {t:"The SPs' signing certificates went stale; regenerate them and redistribute to every app",ok:false},
  {t:"Browser caches hold old SAML responses; instruct users to clear cookies and retry",ok:false},
  {t:"The SP clock drifted past the assertion validity window; resync the SP clocks",ok:false}
 ]},
 explain:"<p><i>Issuer not recognized</i> is the SP saying: \u201Cthis assertion names an IdP I do not know.\u201D The entityID \u2014 the <b>IdP</b>\u2019s stable identifier inside <b>SAML 2.0</b> \u2014 changed with the new deployment (the URL moved), so every <b>federation</b> partner\u2019s issuer whitelist no longer matches. The fix is administrative: re-import the current IdP <b>metadata</b> (or update the allowed-issuer list) on each SP. The distractors fail on the facts given: certificates are unchanged, users authenticate fine (so clocks and caches are not it \u2014 clock skew produces <i>not-on-or-after</i> errors anyway), and cookie clearing cannot repair a whitelist.</p>"},
{id:"H22",type:"categorize",pts:3,
 title:"Severity-bucket the identity alerts",
 tags:["dormant account","PIM","conditional access"],
 hint:"SEV1 means an attacker could already be in. SEV2 widens the blast radius this week. SEV3 can wait for a sprint.",
