function tick(){

  refreshHUD();
}
function togglePause(){

}
function syncPauseUI(){
  if (!S) return;

  var im = $('#indMan'); if (im) im.hidden = !S.manualPause;
  var ic = $('#indChk'); if (ic) ic.hidden = !S.checkPause;

  var lock = S.manualPause;
  ['btnPrev', 'btnRevise', 'btnHint', 'btnSkip', 'btnCheck', 'btnNext', 'btnSubmit'].forEach(function(id){ var b = $('#' + id); if (b) b.disabled = lock; });
  var dd = $('#dots'); if (dd) dd.classList.toggle('locked', lock);

function syncNavBtns(){
  if (!S) return;
  var pv = $('#btnPrev'), nx = $('#btnNext'), ck = $('#btnCheck'), hi = $('#btnHint'), rv = $('#btnRevise');
  if (pv) pv.disabled = S.manualPause || S.cur === 0;
  if (nx) nx.disabled = S.manualPause || S.cur >= EX.length - 1;
  var idx = S.order[S.cur], st = S.a[idx];
  if (hi) hi.disabled = S.manualPause || !EX[idx].hints || S.hintShown[idx] >= EX[idx].hints.length;

}

/* ---------- navigation ---------- */
function goto(p){
  if (!S || S.done) return;
  if (p < 0 || p >= EX.length) return;
  S.cur = p; render(); window.scrollTo(0, 0);
}
function onNext(){
  if (!S || S.done) return;
  if (S.checkPause) S.checkPause = false;
  if (S.cur < EX.length - 1){ goto(S.cur + 1); }
  else { syncPauseUI(); refreshHUD(); }
  syncPauseUI(); refreshHUD();
}
function doSkip(){
  if (!S || S.done || S.manualPause) return;
  var idx = S.order[S.cur];
  S.skipFlag[idx] = 1;
  S.checkPause = false;
  if (S.cur < EX.length - 1) goto(S.cur + 1);
  else { render(); }
  refreshHUD();
}
function doHint(){
  if (!S || S.done || S.manualPause) return;
  var idx = S.order[S.cur], ex = EX[idx];
  var shown = S.hintShown[idx] || 0;
  if (shown >= ex.hints.length) return;
  S.hintShown[idx] = shown + 1;
  render(); syncNavBtns();
}

/* ---------- artefacts: log viewer / config ---------- */
function escH(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function hlLog(l){
  var s = escH(l);
  s = s.replace(/(^|\s)(\d{2}:\d{2}:\d{2})/g, '$1<span class="ts">$2</span>');
  s = s.replace(/\b(ERROR|FAIL|CRIT)\b/g, '<span class="lv-err">$1</span>');
  s = s.replace(/\b(WARN|WARNING)\b/g, '<span class="lv-warn">$1</span>');
  s = s.replace(/\b(INFO|NOTICE|OK|DEBUG)\b/g, '<span class="lv-info">$1</span>');
  s = s.replace(/(\d{1,3}(?:\[\.\]){3}\d{1,3})/g, '<span class="ip">$1</span>');
  return s;
}
function artifactNode(art){

    function upd(){

      rows.forEach(function(r){ var show = !q || r.low.indexOf(q) >= 0; r.node.hidden = !show; if (show) n++; });

    }
    fin.addEventListener('input', upd);

  } else if (art.kind === 'cfg'){
    var log2 = el('div', 'log');

/* ---------- shared drag & drop board ---------- */
function dndBoard(st, zones, items, bankLabel){
  st.place = st.place || {};
  st.pick = (st.pick == null) ? null : st.pick;
  var board = el('div', 'dnd');
  var bank = el('div', 'zone bank'); bank.setAttribute('data-z', 'bank');
  bank.setAttribute('tabindex', '0');
  bank.setAttribute('role', 'button');
  bank.setAttribute('aria-label', (bankLabel || 'Item bank') + ' — press Enter to return the picked item here');
  bank.addEventListener('keydown', function(ev){
    if ((ev.key === 'Enter' || ev.key === ' ') && st.pick){ ev.preventDefault(); st.place[st.pick] = 'bank'; st.pick = null; refresh(); }
  });
  bank.appendChild(el('div', 'z-lab', bankLabel || 'Item bank — click an item, then click a zone (or drag it)'));
  zones.forEach(function(z){
    var zn = el('div', 'zone'); zn.setAttribute('data-z', z.id);
    if (z.key) zn.setAttribute('data-key', z.key);
    zn.setAttribute('tabindex', '0');
    zn.setAttribute('role', 'button');
    zn.setAttribute('aria-label', 'Drop zone: ' + z.label + ' — select an item, then press Enter here to place it');
    zn.addEventListener('keydown', function(ev){
      if ((ev.key === 'Enter' || ev.key === ' ') && st.pick){
        ev.preventDefault();
        st.place[st.pick] = z.id; st.pick = null; refresh();
      }
    });
    zn.appendChild(el('div', 'z-lab', z.label));
    board.appendChild(zn);
  });
  board.insertBefore(bank, board.firstChild);
  function zoneEl(id){ return $$('.zone', board).filter(function(z){ return z.getAttribute('data-z') === id; })[0]; }
  function chipNode(it){
    var c = el('button', 'chip', it.t); c.type = 'button';
    c.setAttribute('data-key', it.k);
    c.setAttribute('draggable', 'true');
    c.setAttribute('aria-pressed', st.pick === it.k ? 'true' : 'false');
    if (st.pick === it.k) c.classList.add('picked');
    c.addEventListener('click', function(ev){ ev.stopPropagation(); st.pick = (st.pick === it.k ? null : it.k); refresh(); });
    c.addEventListener('dragstart', function(ev){ st.pick = it.k; try { ev.dataTransfer.setData('text/plain', it.k); } catch(e){} });
    return c;
  }
  function refresh(){
    $$('.zone', board).forEach(function(z){
      var zid = z.getAttribute('data-z');
      $$('.chip', z).forEach(function(ch){
        var k = ch.getAttribute('data-key');
        if ((st.place[k] || 'bank') !== zid) ch.remove();
      });
    });
    items.forEach(function(it){
      var own = st.place[it.k] || 'bank';
      var z = zoneEl(own);
      if (z && !$('.chip[data-key="' + it.k + '"]', z)) z.appendChild(chipNode(it));
    });
    $$('.zone', board).forEach(function(z){ z.classList.remove('dragover'); });
  }
  board.addEventListener('click', function(ev){
    var z = ev.target.closest ? ev.target.closest('.zone') : null;
    if (!z || !st.pick) return;
    st.place[st.pick] = z.getAttribute('data-z');
    st.pick = null; refresh();
  });
  board.addEventListener('dragover', function(ev){
    var z = ev.target.closest ? ev.target.closest('.zone') : null;
    if (z){ ev.preventDefault(); z.classList.add('dragover'); }
  });
  board.addEventListener('dragleave', function(ev){
    var z = ev.target.closest ? ev.target.closest('.zone') : null;
    if (z) z.classList.remove('dragover');
  });
  board.addEventListener('drop', function(ev){
    var z = ev.target.closest ? ev.target.closest('.zone') : null;
    if (!z) return;
    ev.preventDefault();
    var k = st.pick;
    if (!k && ev.dataTransfer){ try { k = ev.dataTransfer.getData('text/plain'); } catch(e){} }
    if (k){ st.place[k] = z.getAttribute('data-z'); st.pick = null; refresh(); }
  });
  refresh();
  return board;
}

/* ---------- renderers, one per exercise type ---------- */
var R = {};

function optList(ex, st, root, multi){
  var sh = st.sh || (st.sh = shuffle(ex.ch.map(function(c, i){ return { t: c[0], ok: !!c[1], i: i }; })));
  st.sel = st.sel || {};
  var box = el('div', 'opts');
  box.setAttribute('role', multi ? 'group' : 'radiogroup');
  sh.forEach(function(c){
    var lab = el('label', 'opt'); lab.setAttribute('data-key', 'c' + c.i);
    var inp = document.createElement('input');
    inp.type = multi ? 'checkbox' : 'radio';
    inp.name = 'q_' + ex.id;
    inp.checked = !!st.sel[c.i];
    var tx = el('span', 'opt-t', c.t);
    inp.addEventListener('change', function(){
      if (multi){ if (inp.checked) st.sel[c.i] = 1; else delete st.sel[c.i]; }
      else { st.sel = {}; st.sel[c.i] = 1; }
    });
    lab.appendChild(inp); lab.appendChild(tx); box.appendChild(lab);
  });
  root.appendChild(box);
  return {
    validate: function(){
      var marks = {}, okSel = 0, okTot = 0, chosen = 0;
      sh.forEach(function(c){
        var sel = !!st.sel[c.i];
        if (c.ok) okTot++;
        if (sel) chosen++;
        if (multi){
          if (sel && c.ok){ marks['c' + c.i] = 'ok'; okSel++; }
          else if (sel && !c.ok) marks['c' + c.i] = 'bad';
          else if (!sel && c.ok) marks['c' + c.i] = 'miss';
        } else if (sel){
          marks['c' + c.i] = c.ok ? 'ok' : 'bad';
          if (c.ok) okSel = 1;
        }
      });
      if (!multi && !chosen){ sh.forEach(function(c){ if (c.ok) marks['c' + c.i] = 'ok'; }); }
      var fr = multi ? (okTot ? okSel / okTot : 0) : (okSel ? 1 : 0);
      return { fr: fr, marks: marks, elOk: multi ? okSel : (okSel ? 1 : 0), elTot: multi ? okTot : 1 };
    },
    snap: function(){ var o = sh.filter(function(c){ return st.sel[c.i]; }).map(function(c){ return c.t; }); return o.length ? o : ['(no answer selected)']; },
    correct: function(){ return sh.filter(function(c){ return c.ok; }).map(function(c){ return c.t; }); }
  };
}
R.qcm = function(ex, st, root){ return optList(ex, st, root, false); };
R.multi = function(ex, st, root){ return optList(ex, st, root, true); };

R.dndB = function(ex, st, root){
  var flat = [];
  ex.bk.forEach(function(b, bi){ b[1].forEach(function(t){ flat.push({ k: 'i' + bi + '_' + flat.length, t: t, bi: bi }); }); });
  var items = st.osh || (st.osh = shuffle(flat));
  var zones = ex.bk.map(function(b, bi){ return { id: 'b' + bi, label: b[0] }; });
  root.appendChild(dndBoard(st, zones, items));
  return {
    validate: function(){
      var marks = {}, ok = 0;
      flat.forEach(function(it){
        var z = st.place[it.k] || 'bank';
        if (z === 'bank') marks[it.k] = 'na';
        else if (z === 'b' + it.bi){ marks[it.k] = 'ok'; ok++; }
        else marks[it.k] = 'bad';
      });
      return { fr: ok / flat.length, marks: marks, elOk: ok, elTot: flat.length };
    },
    snap: function(){ return flat.map(function(it){ var z = st.place[it.k] || 'bank'; return it.t + ' \u2192 ' + (z === 'bank' ? '(not placed)' : ex.bk[Number(z.slice(1))][0]); }); },
    correct: function(){ return flat.map(function(it){ return it.t + ' \u2192 ' + ex.bk[it.bi][0]; }); }
  };
};

R.dndP = function(ex, st, root){
  var slotItems = ex.sl.map(function(s, si){ return { k: 'i' + si, t: s[1] }; });
  var extras = (ex.xs || []).map(function(t, xi){ return { k: 'x' + xi, t: t, extra: true }; });
  var items = st.osh || (st.osh = shuffle(slotItems.concat(extras)));
  var zones = ex.sl.map(function(s, si){ return { id: 's' + si, label: s[0], key: 's' + si }; });
  root.appendChild(dndBoard(st, zones, items));
  return {
    validate: function(){
      var marks = {}, ok = 0;
      ex.sl.forEach(function(s, si){
        var placed = Object.keys(st.place).filter(function(k){ return st.place[k] === 's' + si; })[0];
        var want = 'i' + si;
        if (!placed) marks['s' + si] = 'na';
        else if (placed === want){ marks['s' + si] = 'ok'; ok++; }
        else marks['s' + si] = 'bad';
      });
      return { fr: ok / ex.sl.length, marks: marks, elOk: ok, elTot: ex.sl.length };
    },
    snap: function(){
      return ex.sl.map(function(s, si){
        var placed = Object.keys(st.place).filter(function(k){ return st.place[k] === 's' + si; })[0];
        var it = placed ? items.filter(function(x){ return x.k === placed; })[0] : null;
        return s[0] + ' \u2192 ' + (it ? it.t : '(empty)');
      });
    },
    correct: function(){ return ex.sl.map(function(s){ return s[0] + ' \u2192 ' + s[1]; }); }
  };
};

R.order = R.rank = function(ex, st, root){
  var n = ex.seq.length;
  st.arr = st.arr || shuffle(ex.seq.map(function(_, i){ return i; }));
  st.dragPi = null;
  var list = el('div', 'rows');
  function build(){
    list.innerHTML = '';
    st.arr.forEach(function(itemIdx, pi){
      var row = el('div', 'row'); row.setAttribute('data-key', 'r' + itemIdx); row.setAttribute('draggable', 'true');
      row.appendChild(el('span', 'grip', '\u2261'));
      row.appendChild(el('span', 'row-t mono', (pi + 1) + '. ' + ex.seq[itemIdx]));
      var up = el('button', 'mini', '\u2191'); up.type = 'button'; up.setAttribute('aria-label', 'Move item up');
      var dn = el('button', 'mini', '\u2193'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move item down');
      up.addEventListener('click', function(){ if (pi > 0){ var t = st.arr[pi - 1]; st.arr[pi - 1] = st.arr[pi]; st.arr[pi] = t; build(); } });
      dn.addEventListener('click', function(){ if (pi < n - 1){ var t = st.arr[pi + 1]; st.arr[pi + 1] = st.arr[pi]; st.arr[pi] = t; build(); } });
      row.appendChild(up); row.appendChild(dn);
      row.addEventListener('dragstart', function(){ st.dragPi = pi; });
      row.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      row.addEventListener('drop', function(ev){
        ev.preventDefault();
        if (st.dragPi != null && st.dragPi !== pi){
          var it = st.arr.splice(st.dragPi, 1)[0];
          st.arr.splice(pi, 0, it);
        }
        st.dragPi = null; build();
      });
      list.appendChild(row);
    });
  }
  build();
  root.appendChild(list);
  return {
    validate: function(){
      var marks = {}, ok = 0;
      st.arr.forEach(function(itemIdx, pi){
        if (itemIdx === pi){ marks['r' + itemIdx] = 'ok'; ok++; }
        else marks['r' + itemIdx] = 'bad';
      });
      return { fr: ok / n, marks: marks, elOk: ok, elTot: n };
    },
    snap: function(){ return st.arr.map(function(itemIdx, pi){ return (pi + 1) + '. ' + trunc(ex.seq[itemIdx], 60); }); },
    correct: function(){ return ex.seq.map(function(t, i){ return (i + 1) + '. ' + trunc(t, 60); }); }
  };
};

R.match = function(ex, st, root){

R.fib = function(ex, st, root){
  st.sel = st.sel || {}; st.bo = st.bo || {};
  var box = el('div', 'fib'); var bi = 0; var blanks = [];
  ex.fi.forEach(function(sen){
    var p = el('p', 'fib-p');
    var parts = sen.split(/\{([^}]*)\}/);
    for (var i = 0; i < parts.length; i++){
      if (i % 2 === 0){
        if (parts[i]) p.appendChild(document.createTextNode(parts[i]));
      } else {
        var key = 'b' + bi;
        var opts = st.bo[key] || (st.bo[key] = shuffle(parts[i].split('|').map(function(o){ var ok = o.charAt(0) === '*'; return { t: ok ? o.slice(1) : o, ok: ok }; })));
        blanks.push({ key: key, opts: opts });
        var span = el('span', 'fib-b'); span.setAttribute('data-key', key);
        var s = document.createElement('select');
        s.setAttribute('aria-label', 'Blank ' + (bi + 1));
        s.appendChild(new Option('\u2014 choose \u2014', ''));
        opts.forEach(function(o){ s.appendChild(new Option(o.t, o.t)); });
        s.value = st.sel[key] || '';
        (function(k, sel){ sel.addEventListener('change', function(){ if (sel.value) st.sel[k] = sel.value; else delete st.sel[k]; }); })(key, s);
        span.appendChild(s); p.appendChild(span); bi++;
      }
    }
    box.appendChild(p);
  });
  root.appendChild(box);
  return {
    validate: function(){
      var marks = {}, ok = 0;
      blanks.forEach(function(b){
        var correct = b.opts.filter(function(o){ return o.ok; })[0];
        var v = st.sel[b.key];
        if (!v) marks[b.key] = 'na';
        else if (correct && v === correct.t){ marks[b.key] = 'ok'; ok++; }
        else marks[b.key] = 'bad';
      });
      return { fr: blanks.length ? ok / blanks.length : 0, marks: marks, elOk: ok, elTot: blanks.length };
    },
    snap: function(){ return blanks.map(function(b, i){ return 'blank ' + (i + 1) + ': ' + (st.sel[b.key] || '(empty)'); }); },
    correct: function(){ return blanks.map(function(b, i){ return 'blank ' + (i + 1) + ': ' + b.opts.filter(function(o){ return o.ok; })[0].t; }); }
  };
};

R.terminal = function(ex, st, root){
  st.hist = st.hist || [];
  var box = el('div', 'term'); box.setAttribute('data-key', 'cmd');
  box.appendChild(el('div', 'term-h', ex.tm.title || 'terminal'));
  var out = el('div', 'term-out'); out.setAttribute('role', 'log');
  (ex.tm.banner || []).forEach(function(l){ out.appendChild(el('div', 'term-l', l)); });
  st.hist.forEach(function(hh){ out.appendChild(el('div', 'term-l term-c', hh)); });
  var row = el('div', 'term-row');
  row.appendChild(el('span', 'term-ps', ex.tm.ps));
  var inp = document.createElement('input'); inp.className = 'term-in';
  inp.setAttribute('autocomplete', 'off'); inp.setAttribute('spellcheck', 'false');
  inp.setAttribute('aria-label', 'Type the command here');
  row.appendChild(inp);
  function run(){
    var c = inp.value.trim();
    if (!c) return;
    st.lastCmd = c;
    out.appendChild(el('div', 'term-l term-c', ex.tm.ps + ' ' + c));
    var hitF = ex.tm.full.some(function(r){ return r.test(c); });
    var hitP = (ex.tm.partial || []).some(function(r){ return r.test(c); });
    if (hitF){ st.lastCmd = c; (ex.tm.out || []).forEach(function(l){ out.appendChild(el('div', 'term-l', l)); }); }
    else if (hitP){ st.lastCmd = c; (ex.tm.pout || []).forEach(function(l){ out.appendChild(el('div', 'term-l', l)); }); }
    else {
      var w = c.split(/\s+/)[0];
      out.appendChild(el('div', 'term-l', (ex.tm.shell || 'sh') + ': ' + w + ': command not found'));
    }
    st.hist.push(ex.tm.ps + ' ' + c);
    inp.value = '';
    out.scrollTop = out.scrollHeight;
  }
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') run(); });
  box.appendChild(out); box.appendChild(row);
  root.appendChild(box);
  return {
    validate: function(){
      var c = inp.value.trim() || st.lastCmd || '';
      var ok = !!c && ex.tm.full.some(function(r){ return r.test(c); });
      return {
        fr: ok ? 1 : 0,
        marks: { cmd: c ? (ok ? 'ok' : 'bad') : 'na' },
        elOk: ok ? 1 : 0, elTot: 1,
        note: c ? ('Command checked: ' + c) : 'No command entered'
      };
    },
    snap: function(){ return ['$ ' + (st.lastCmd || '(no command typed)')]; },
    correct: function(){ return [ex.tm.sol || 'the correct command for this goal']; }
  };
};

R.sim = function(ex, st, root){
  st.open = (st.open == null) ? 0 : st.open;

    card.appendChild(el('div', 'sim-q', 'Step ' + (si + 1) + ' of ' + ex.sm.length + ' \u2014 ' + sp.q));
    var sh = st['sh' + si] || (st['sh' + si] = shuffle(sp.ch.map(function(c, ci){ return { t: c[0], ok: !!c[1], fb: c[2], ci: ci }; })));
    var og = el('div', 'opts'); og.setAttribute('role', 'radiogroup');
    sh.forEach(function(c){
      var lab = el('label', 'opt');
      var inp = document.createElement('input'); inp.type = 'radio';
      inp.name = 's_' + ex.id + '_' + si;
      inp.checked = (st.ans[si] === c.ci);
      inp.addEventListener('change', function(){ st.ans[si] = c.ci; st.out[si] = c.fb; render(); });
      lab.appendChild(inp); lab.appendChild(el('span', 'opt-t', c.t)); og.appendChild(lab);
    });
    card.appendChild(og);
    if (st.out[si] != null) card.appendChild(el('div', 'sim-out', st.out[si]));

  });
  root.appendChild(box);
  return {
    validate: function(){
      var marks = {}, ok = 0;
      ex.sm.forEach(function(sp, si){
        var a = st.ans[si];
        if (a == null) marks['st' + si] = 'na';
        else if (sp.ch[a] && sp.ch[a][1]){ marks['st' + si] = 'ok'; ok++; }
        else marks['st' + si] = 'bad';
      });
      return { fr: ok / ex.sm.length, marks: marks, elOk: ok, elTot: ex.sm.length };
    },
    snap: function(){ return ex.sm.map(function(sp, si){ return 'Step ' + (si + 1) + ': ' + (st.ans[si] != null ? trunc(sp.ch[st.ans[si]][0], 60) : '(no choice)'); }); },
    correct: function(){ return ex.sm.map(function(sp, si){ return 'Step ' + (si + 1) + ': ' + trunc(sp.ch.filter(function(c){ return c[1]; })[0][0], 60); }); }
  };
};

R.spot = function(ex, st, root){

    cfg.appendChild(b);
  });

  var crow = el('div', 'row'); crow.setAttribute('data-key', 'cat'); crow.style.marginTop = '10px';
  crow.appendChild(el('span', 'row-t', 'Category of the mistake:'));
  var cats = st.csh || (st.csh = shuffle(ex.sp.cats.map(function(c){ return { t: c[0], ok: !!c[1] }; })));
  var s = document.createElement('select');
  s.setAttribute('aria-label', 'Category of the mistake');
  s.appendChild(new Option('\u2014 choose \u2014', ''));
  cats.forEach(function(c){ s.appendChild(new Option(c.t, c.t)); });

      var fr = (okL ? 0.5 : 0) + (catOk ? 0.5 : 0);
      return { fr: fr, marks: marks, elOk: ok, elTot: 2 };
    },
    snap: function(){ return ['line: ' + (st.line ? st.line : '(none clicked)'), 'category: ' + (st.cat || '(none chosen)')]; },

};

/* ---------- main render ---------- */

  var idx = S.order[S.cur], ex = EX[idx];
  S.visit[idx] = 1;
  var st = S.a[idx] || (S.a[idx] = {});
  var stage = $('#stage'); stage.innerHTML = '';
  var card = el('div', 'card');
  if (ex.scen){
    var sc = el('div', 'blk blk-scen');

  }

  var q = el('div', 'blk blk-q');
  q.appendChild(el('div', 'blk-lab', 'Question'));

  card.appendChild(q);

  }

    ex.why.forEach(function(w){ ep.appendChild(el('p', null, w)); });
    card.appendChild(ep);
  }
  var hs = S.hintShown[idx] || 0;
  if (hs > 0 && ex.hints){
    var hb = el('div', 'hintbox');
    hb.appendChild(el('div', 'blk-lab', 'Hints revealed (' + hs + ' \u00D7 \u221210%)'));
    ex.hints.slice(0, hs).forEach(function(h, i){ hb.appendChild(el('p', null, 'Hint ' + (i + 1) + ': ' + h)); });
    card.appendChild(hb);
  }
  stage.appendChild(card);
  paintMarks(stage, st);
  updateDots(); refreshHUD(); syncNavBtns();
}

/* ---------- check / revise ---------- */
function doCheck(){
  if (!S || S.done || S.manualPause) return;
  var idx = S.order[S.cur], ex = EX[idx], st = S.a[idx], api = S.rend[idx];
  if (!api || !st) return;
  var v = api.validate();
  st.marks = v.marks;
  st.checked = true;
  var hp = Math.min(0.5, 0.1 * (S.hintShown[idx] || 0));
  var earned = Math.max(0, Math.round(v.fr * (1 - hp) * 100) / 100);
  S.earned[idx] = earned;
  S.checkedFlag[idx] = 1;
  delete S.skipFlag[idx];
  try { st.snapV = api.snap(); } catch(e){ st.snapV = []; }
  var pct = Math.round(v.fr * 100);
  var msg = (v.note ? v.note + ' \u2022 ' : '') + 'Elements correct: ' + (v.elOk != null ? v.elOk : '\u2013') + ' / ' + (v.elTot != null ? v.elTot : '\u2013') + ' \u2022 Points: ' + earned.toFixed(2) + ' / 1';
  if (hp > 0) msg += ' \u2022 hint penalty \u2212' + Math.round(hp * 100) + '%';
  st.earnMsg = msg;
  st.earnCls = pct >= 99 ? '' : (pct > 0 ? 'mid' : 'poor');
  st.revise = false;
  S.checkPause = true;
  render();
  syncPauseUI(); refreshHUD();
  window.scrollTo(0, 0);
}
function doRevise(){
  if (!S || S.done || S.manualPause) return;
  var idx = S.order[S.cur], st = S.a[idx];
  if (!st || !st.checked) return;
  st.marks = null;
  st.earnMsg = null;
  st.revise = true;
  render();
}

/* ---------- results & reporting ---------- */
function correctOf(ex){
  switch (ex.type){
    case 'qcm': case 'multi':
      return ex.ch.filter(function(c){ return c[1]; }).map(function(c){ return c[0]; });
    case 'dndB': {
      var o = []; ex.bk.forEach(function(b){ b[1].forEach(function(t){ o.push(t + ' \u2192 ' + b[0]); }); }); return o;
    }
    case 'dndP': return ex.sl.map(function(s){ return s[0] + ' \u2192 ' + s[1]; });
    case 'order': case 'rank': return ex.seq.map(function(t, i){ return (i + 1) + '. ' + trunc(t, 60); });
    case 'match': return ex.pr.map(function(p){ return trunc(p[0], 40) + ' \u2192 ' + p[1]; });
    case 'fib': {
      var out = [];
      ex.fi.forEach(function(sen){
        var parts = sen.split(/\{([^}]*)\}/);
        for (var i = 1; i < parts.length; i += 2){
          var opts = parts[i].split('|');
          var c = opts.filter(function(o){ return o.charAt(0) === '*'; })[0];
          out.push(c ? c.slice(1) : '(missing)');
        }
      });
      return out;
    }
    case 'terminal': return [ex.tm.sol || 'the correct command'];
    case 'sim': return ex.sm.map(function(sp, i){ return 'Step ' + (i + 1) + ': ' + trunc(sp.ch.filter(function(c){ return c[1]; })[0][0], 60); });
    case 'spot': return ['line ' + ex.sp.bad, 'category: ' + ex.sp.cats.filter(function(c){ return c[1]; })[0][0]];
    default: return [];
  }
}
function computeResults(){
  var answered = [], skipped = [];
  S.order.forEach(function(i){ if (S.checkedFlag[i]) answered.push(i); else skipped.push(i); });
  var earned = 0;
  answered.forEach(function(i){ earned += (S.earned[i] || 0); });
  var pts = Math.round(earned);
  var percent = answered.length ? Math.round(pts / answered.length * 100) : 0;
  var passed = answered.length > 0 && percent >= (META.passMark || 70);
  return { answered: answered, skipped: skipped, earned: earned, pts: pts, percent: percent, passed: passed };
}
function reportScore(correct, total){
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId || 'cloud-plus',
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= (META.passMark || 70)
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function renderResults(res, reason){
  var n = $('#scr-results'); n.innerHTML = '';
  var hero = el('div', 'hero ' + (res.passed ? 'pass' : 'fail'));
  hero.appendChild(el('div', 'verdict', res.passed ? 'PASS' : 'FAIL'));
  hero.appendChild(el('div', 'pct', res.percent + '%'));
  var sub = el('p');
  sub.appendChild(document.createTextNode('Final score: ' + res.pts + ' / ' + res.answered.length + ' points (partial credit included, rounded). Pass mark: ' + (META.passMark || 70) + '%. '));
  sub.appendChild(document.createTextNode(reason === 'time' ? 'Time ran out — the exam was submitted automatically. ' : 'Submitted. '));
  sub.appendChild(document.createTextNode(res.passed ? 'Congratulations — you reached the pass mark.' : 'You must retake this exam to pass the chapter.'));
  hero.appendChild(sub);
  if (S.candidate) hero.appendChild(el('p', null, 'Candidate: ' + S.candidate));
  var rb = el('button', 'btn primary', 'Retake exam'); rb.type = 'button';
  rb.addEventListener('click', function(){ newAttempt(); showScreen('scr-intro'); refreshHUD(); });
  hero.appendChild(rb);
  n.appendChild(hero);

  var stats = el('div', 'statrow');
  [['Answered', String(res.answered.length)], ['Skipped (excluded)', String(res.skipped.length)], ['Raw points', res.earned.toFixed(2)], ['Questions', String(EX.length)]].forEach(function(s){
    var d = el('div', 'stat'); d.appendChild(el('div', 'v', s[1])); d.appendChild(el('div', 'k', s[0])); stats.appendChild(d);
  });
  n.appendChild(stats);

  if (res.skipped.length){
    var sn = el('div', 'skipnote');
    sn.appendChild(el('b', null, 'Skipped exercises — excluded from scoring.'));
    sn.appendChild(document.createTextNode(' These were neither added to your points nor to the total: '));
    var ids = res.skipped.map(function(i){ return EX[i].id; }).join(', ');
    sn.appendChild(el('span', 'mono', ids));
    sn.appendChild(document.createTextNode('. Their explanations are still in the report below so you can learn from them.'));
    n.appendChild(sn);
  }

  var cov = el('div', 'card');
  cov.appendChild(el('h2', null, 'Theme coverage (checked exercises)'));
  var chips = el('div', 'themes');
  THEMES.forEach(function(th, ti){
    var tagged = 0, doneT = 0;
    S.order.forEach(function(i){
      var ex = EX[i];
      if (ex.kw.some(function(k){ return KW2T[k] === ti; })){ tagged++; if (S.checkedFlag[i]) doneT++; }
    });
    chips.appendChild(el('span', 'tchip', '').appendChild ? (function(){ var c = el('span', 'tchip'); var b = el('b', null, th[0] + ' '); c.appendChild(b); c.appendChild(document.createTextNode(doneT + '/' + tagged)); return c; })() : null);
  });
  cov.appendChild(chips);
  n.appendChild(cov);

  var rep = el('div', 'card');
  rep.appendChild(el('h2', null, 'Per-exercise report'));
  S.order.forEach(function(idx, p){
    var ex = EX[idx], st = S.a[idx] || {};
    var checked = !!S.checkedFlag[idx];
    var fr = S.earned[idx] || 0;
    var label = checked ? (fr >= 0.999 ? ['full', 'lab-full'] : (fr > 0 ? ['partial', 'lab-part'] : ['zero', 'lab-zero'])) : ['skipped', 'lab-skip'];
    var row = el('div', 'rrow');
    var h = el('div', 'rrow-h');
    h.appendChild(el('span', 'rid', '#' + (p + 1) + ' ' + ex.id));
    h.appendChild(el('span', 'lab ' + label[1], label[0].toUpperCase()));
    h.appendChild(el('span', 'rq', TYPELAB[ex.type] + ' \u2014 ' + trunc(ex.prompt, 90)));
    h.appendChild(el('span', 'rpts', checked ? (fr.toFixed(2) + ' / 1 pt') : 'not counted'));
    row.appendChild(h);
    var det = el('details');
    det.appendChild(el('summary', null, 'Show answers and explanation'));
    var your = el('p'); your.appendChild(el('b', null, 'Your answer: '));
    your.appendChild(document.createTextNode(checked && st.snapV && st.snapV.length ? st.snapV.join(' | ') : '— (not answered)'));
    det.appendChild(your);
    var cor = el('p'); cor.appendChild(el('b', null, 'Correct answer: '));
    cor.appendChild(document.createTextNode(correctOf(ex).join(' | ')));
    det.appendChild(cor);
    ex.why.forEach(function(w){ det.appendChild(el('p', null, w)); });
    row.appendChild(det);
    rep.appendChild(row);
  });
  n.appendChild(rep);
}
function finish(reason){
  if (!S || S.done) return;
  S.done = true;
  S.checkPause = false; S.manualPause = false;
  var res = computeResults();
  renderResults(res, reason);
  showScreen('scr-results');
  if (res.answered.length > 0 && !S.reported){
    S.reported = true;
    reportScore(res.pts, res.answered.length);
  }
}
function openSubmit(){
  if (!S || S.done) return;
  var answered = 0, skipped = 0;
  S.order.forEach(function(i){ if (S.checkedFlag[i]) answered++; else skipped++; });
  var m = $('#modal'); m.innerHTML = ''; m.hidden = false;
  var p = el('div', 'mpanel');
  p.appendChild(el('h2', null, 'Submit exam?'));

{ id: "M20", type: "qcm", kw: ["vram"],
  scen: "kvm-node-04 sits at 96 percent host memory. The ERP guest feels slow. You pull the guest-side log excerpt below.",
  art: { kind: "logview", title: "ubuntu-erp — /var/log/kern.log (excerpt)", lines: [
    "09:10:01 INFO  kernel balloon balloon0: inflate: target 2048 MB",
    "09:10:07 WARN  kernel kswapd0: reclaiming pages, watermark low",
    "09:12:33 WARN  kernel erp-app: latency spike 240 ms during balloon inflate",
    "09:15:40 INFO  qemu-ga: guest reported 1.1 GB page cache freed"
  ]},
  prompt: "Which host mechanism is reclaiming memory from this guest?",
  ch: [
    ["Memory ballooning — the balloon driver inside the guest inflates and takes pages back", true],

    ["Transparent page sharing collapsed duplicate memory pages", false],
    ["A live migration is pre-copying the VM to another host", false]
  ],
  why: [
    "The log says it directly: the balloon driver is inflating. The host asks the in-guest balloon to 'inflate', the guest OS then chooses its own least-useful pages (usually file cache) to hand back. That is why the guest still works — it gave up cache, not active memory — but performance dips while the cache shrinks.",
    "Ballooning is the polite way to reclaim memory under overcommitment. Swapping at the hypervisor level is the impolite way and shows up as vm-swap activity, not balloon messages. Page sharing deduplicates identical pages silently, and live migration copies memory outward rather than taking it away.",
    "The lesson for capacity planning: recurring balloon pressure on one host means overcommitment there — rebalance or add memory before someone blames the application."
  ],
  hints: ["The first log line names the mechanism.", "The guest decides which pages to give back — that is the key property of this mechanism."]
},

{ id: "M31", type: "dndP", kw: ["vxlan", "vlan", "sdn", "nfv"],

  why: [
    "VLANs are the classic Layer 2 separation inside one switched network: a tag in the frame header keeps tenant traffic apart on a trunk. VXLAN goes further — it wraps Layer 2 frames in UDP so the same virtual network can span data centers over a routed underlay, which is why cloud fabrics use it for large multi-tenant overlays.",

{ id: "M33", type: "multi", kw: ["vesc", "mseg", "esxi"],
  scen: "A hypervisor vendor publishes a VM-escape vulnerability advisory: a crafted guest could run code on the host. The CISO at Nordwind asks the platform team for the actions that genuinely reduce the risk.",
  prompt: "Select the THREE actions that actually reduce hypervisor attack surface or blast radius.",
  ch: [
    ["Patch the hypervisor as soon as the fix is released", true],
    ["Disable unneeded shared folders and device passthrough on sensitive VMs", true],
    ["Segment sensitive VMs into their own cluster or trust zone", true],
    ["Install extra guest tools add-ons in every VM for better visibility", false],
    ["Enable SSH on every host to speed up response", false],
    ["Turn off HA cluster-wide to shrink the attack surface", false]
  ],
  why: [
    "A VM escape is an attack from inside a guest through the hypervisor onto the host — the most serious class of virtualization bug because one break-in can reach sibling VMs. The real defenses target the paths in: patch the hypervisor promptly (the escape itself), remove guest-to-host channels you do not need (shared folders, USB and PCI passthrough), and contain the blast radius by separating sensitive workloads into their own clusters or zones.",
    "Extra add-ons inside guests widen, not shrink, the guest-to-host surface. Host SSH enabled everywhere is an administration gift to attackers. Disabling HA does nothing against escapes — it only removes your safety net for host failures.",
    "Micro-segmentation between VMs adds a further layer: even if an escape lands in one zone, policy stops lateral movement from there."
  ],
  hints: ["Think: patch the hole, close the doors, fence the yard.", "Two wrong answers add convenience for admins — and for attackers."]
},
