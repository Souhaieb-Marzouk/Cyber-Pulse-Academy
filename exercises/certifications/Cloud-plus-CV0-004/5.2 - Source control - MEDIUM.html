   {"t":"Revert commit 4f8a2b1 on main and let CI rebuild","ok":true,"o":"A revert creates a new commit that undoes the change. History stays honest and main goes green again without touching anyone's local work."},
   {"t":"Force-push main back to the last green commit","ok":false,"o":"A force push rewrites shared history. Every teammate's local copy now disagrees with the remote — a much bigger incident."},

 ],
 "hint":"Two commands stage and record work without any network. 'Inspect only' is the command that prints state but never edits anything.",
 "explain":"<p><b>Record work locally:</b> <code>git add</code> moves chosen changes into the staging area; <code>git commit</code> records that staged snapshot permanently in your local history. Nothing has touched the network yet. <b>Sync with origin:</b> <code>git clone</code> copies a whole remote repository the first time; <code>git fetch</code> downloads new remote commits <i>without</i> merging them; <code>git pull</code> is fetch + merge in one step; <code>git push</code> uploads your local commits. <b>Inspect only:</b> <code>git status</code> shows modified and staged files and never changes a thing — it is the command you can always run safely. Focus: pull = fetch + merge, and status is always safe.</p>"
},
{
 "id":"M03","type":"order","title":"Life of a feature branch","kw":[19,25,26,35,28,4,9],
 "scen":"Nordwind Labs uses a pull-request workflow: short-lived feature branches, code review, green CI, then a squash merge. A trainee dumped the steps below in random order.",
 "q":"Put the steps of shipping one feature back in the correct order.",
 "steps":[
  "Create a branch from up-to-date main: git switch -c feature/rate-limit",
  "Write the change as small commits, staging files deliberately with git add",
  "Push the branch to origin: git push -u origin feature/rate-limit",
  "Open a pull request describing the change and how to test it",
  "Team-mates review the diff and approve; requested changes are fixed and pushed",
  "CI runs the automated tests on the PR and must be green",
  "Squash-merge the PR into main and delete the feature branch"
 ],
 "hint":"Everything happens on a branch first; the only step after CI is green is the merge itself.",
 "explain":"<p>The order matters because each step protects the next one. <b>1)</b> Branching from a fresh main means fewer conflicts later. <b>2)</b> Small, deliberate commits keep review readable. <b>3)</b> Pushing publishes the branch to origin so others can see it. <b>4)</b> The pull request is where the change is described and discussed. <b>5)</b> Human review catches design issues; <b>6)</b> automated tests catch regressions — both must pass before <b>7)</b> the squash merge folds the branch into one clean commit on main. Deleting the branch afterwards is housekeeping; main already contains the work. Focus: the pull request is opened <i>after</i> the first push, and CI runs <i>before</i> merge.</p>"
},
{
 "id":"M04","type":"fitb","title":"Draft the source-control policy","kw":[25,26,27,30,15,47,1],
 "scen":"Nordwind Labs is writing its first source-control policy for the cloud platform team. You drafted the sentences; now the key words must go back in.",
 "q":"Fill every gap with a word from the bank.",
 "lines":[
  "All production changes travel through a [[1]] — never a direct push.",
  "Every pull request needs at least one [[2]] approval from a teammate.",
  "Pushes straight to [[3]] are blocked for everyone, including leads.",
  "Developers sign their work: every commit must be [[4]] so authorship is provable.",
  "Nobody may ever [[5]] a shared branch — it rewrites history others depend on.",
  "Service teams pick their layout: a [[6]] for shared tooling across services,",
  "or a [[7]] when a service needs its own release rhythm and owners."
 ],
 "ans":["pull request","code review","main","signed","force push","monorepo","polyrepo"],
 "bank":["fork","tag","cherry-pick","rebase","stash","clone"],
 "hint":"Five of the words protect main. The last two are the two opposite repository layouts: one repo versus many.",
 "explain":"<p>The policy words are the daily guard rails. A <b>pull request</b> makes every change visible and discussable before it lands. A <b>code review</b> approval means a second human read the diff. Protecting <b>main</b> means the branch everyone deploys from only changes through that process. <b>Signed</b> commits prove who really made a change — the signature can be verified, a name field cannot. Banning <b>force push</b> protects shared history from being rewritten underneath teammates. Finally the layout choice: a <b>monorepo</b> holds many services in one repository (shared tooling, one CI setup), while a <b>polyrepo</b> gives each service its own repository and release cadence. The distractors are real git words but wrong here: a fork is a copy for outside contributors, tags mark releases, cherry-pick copies single commits, rebase replays commits, stash shelves work.</p>"
},
{
 "id":"M05","type":"qcm","title":"Pick the branching strategy","kw":[20,22,21,23],
 "scen":"A Nordwind Labs product team (8 developers) deploys their web service to production several times a day. Unfinished work is hidden behind feature flags. The team lead asks which branching strategy fits.",
 "q":"Which strategy fits this team best?",
 "ch":[
  {"t":"Trunk-based development with very short-lived branches", "ok":true},
  {"t":"Git Flow with long-lived develop and release branches", "ok":false},
  {"t":"One long-lived branch per feature, merged at the end of the quarter", "ok":false},
  {"t":"No branches at all — everyone commits directly to main", "ok":false}
 ],
 "hint":"The team already deploys many times a day and can hide unfinished work. Which strategy was designed for exactly that rhythm?",
 "explain":"<p><b>Correct: trunk-based development.</b> Developers merge small changes into main (the trunk) at least daily; unfinished features stay hidden behind feature flags. It matches multiple deploys per day perfectly. <b>Why not the others:</b> Git Flow keeps long-lived <code>develop</code>, <code>release</code> and <code>hotfix</code> branches — built for scheduled, versioned releases, and its merge overhead slows a team that ships daily. A branch per feature that lives for weeks produces giant merges and stale code — the opposite of the team's rhythm. Committing straight to main with no branches removes review and breaks main for everyone when a change is wrong. GitHub Flow (branch, pull request, deploy preview, merge) is the simpler cousin also suited to continuous delivery, but the flags-and-daily-merge pattern described here is trunk-based. Focus: matching cadence to strategy — continuous deployment points to trunk-based.</p>"
},
{
 "id":"M06","type":"logview","title":"Why is the pipeline red?","kw":[32,49,62,37,33,39],
 "file":"CI job log — shopfront pipeline (GitLab runner-7)",
 "scen":"The <b>shopfront</b> pipeline on GitLab went red during Monday's build. You are the on-call engineer. The job log is below.",

  "09:58:01 Runner   Job yamlcheck started (runner-7)",

  "09:58:20 Runner   Job build started",
  "09:58:55 npm ERR! missing: lodash@^4.17.20, required by shopfront@1.2.0",

  "09:59:11 policy    job terminated: secret scanning blocked the upload"
 ],
 "ans":{"kind":"multi","ch":[
  {"t":"A YAML syntax error in .gitlab-ci.yml (line 24)","ok":true},
  {"t":"package-lock.json is out of sync with package.json","ok":true},
  {"t":"Secret scanning found an AWS key and blocked the job","ok":true},
  {"t":"A dependency was flagged as vulnerable by dependency scanning","ok":false},

 ]},
 "hint":"Read each failing line. One message is about file format, one about the lockfile, one about a detected secret.",
 "explain":"<p>The log shows three independent failures. <b>1)</b> <code>yamllint</code> reports a mapping error at <code>.gitlab-ci.yml:24</code> — pipeline-as-code is code, so one wrong space breaks the definition; the yamlcheck job fails before anything else runs. <b>2)</b> npm reports the lockfile is not in sync with <code>package.json</code>: someone edited dependencies without regenerating <code>package-lock.json</code>, so the exact pinned versions cannot be resolved — that is a lockfile-integrity failure, <i>not</i> a vulnerability report. <b>3)</b> gitleaks detected an AWS access key pattern in <code>terraform/vars.tf</code> and the policy job blocked the upload — secret scanning doing its job. <b>The distractors:</b> dependency scanning (SCA) never speaks in this log — no CVE is mentioned; there is no disk-space or registry-network message anywhere. Focus: read each error line on its own and match it to the tool that wrote it.</p>"
},
{
 "id":"M07","type":"spot","title":"Spot the committed secrets","kw":[57,59,17,58],
 "scen":"A junior developer opened pull request #231, 'Add payment webhook'. You review the main application file before anything else.",
 "q":"Click the <b>two lines</b> that must never be committed in this form.",
 "file":"services/billing/app.py — PR #231",
 "code":[
  "import os",
  "import requests",
  "",
  "API_KEY = \"sk_live_9f3Kq2Lm8XzR41Tt\"",
  "WEBHOOK_URL = os.environ[\"BILLING_WEBHOOK_URL\"]",
  "DB_PASSWORD = \"Spring2024!\"",
  "",
  "def charge(amount_cents):",
  "    return requests.post(WEBHOOK_URL, headers={\"Authorization\": API_KEY})"
 ],
 "bad":[3,5],
 "hint":"One secret authenticates to the payment provider, the other to the database. Environment variables are the pattern the good line already uses.",
 "explain":"<p><b>Line 4</b> hardcodes a live-looking payment API key and <b>line 6</b> hardcodes a database password. Credentials belong in environment variables or a secret manager — exactly the pattern <code>WEBHOOK_URL</code> on line 5 already follows by reading <code>os.environ</code>. The fix: move both values into the secret store, load them like line 5, and rotate the exposed values, because anything typed into a commit must be treated as leaked. Then add the real secrets file to <code>.gitignore</code> (for example a local <code>.env</code>) so it cannot be staged again, and enable push protection so the next accidental key is rejected before it lands. Focus: one hardcoded credential is a pattern; where there is one, look for more.</p>"
},
{
 "id":"M08","type":"terminal","title":"History detective","kw":[10,4],
 "scen":"You are on call for the <b>shopfront</b> repository. A deployment misbehaved at 09:14 and your lead asks two questions: which commits ever touched the deploy pipeline file, and what exactly did the most recent commit on <code>main</code> change? A small git simulator is wired to this exercise.",
 "q":"Complete <b>both goals</b> in the shell below, then press Check.<br><b>Goal 1 —</b> list the commits that touched <code>deploy/pipeline.yml</code> (a <code>git log</code> command; the file path goes at the end).<br><b>Goal 2 —</b> show the changes introduced by the most recent commit on <code>main</code> (use <code>git show</code>; <code>HEAD</code> names the latest commit).",
 "goals":[
  {"label":"Goal 1: list commits touching deploy/pipeline.yml","eg":"git log deploy/pipeline.yml","pat":["^git log\\b.*pipeline\\.yml"],
   "out":["a1b2c3d 2026-09-30  Priya N.  fix: deploy trigger fired twice on retries","9f8e7d2 2026-09-12  Marco T.  feat: add canary stage to pipeline","4c5b6a1 2026-08-28  Priya N.  chore: initial pipeline for shopfront"]},
  {"label":"Goal 2: show the changes of the latest commit on main","eg":"git show HEAD","pat":["^git show\\b"],
   "out":["commit a1b2c3d (HEAD -> main, origin/main)","Author: Priya N. <priya@nordwind-labs.example>","    fix: deploy trigger fired twice on retries","-    if: $CI_PIPELINE_SOURCE == \"push\"","-    if: $CI_PIPELINE_SOURCE == \"web\"","+    if: $CI_PIPELINE_SOURCE == \"push\" && $CI_COMMIT_BRANCH == \"main\""]}
 ],
 "hint":"Goal 1: 'git log' plus the file path. Goal 2: 'git show' alone already means 'git show HEAD'.",
 "explain":"<p><b>Goal 1:</b> plain <code>git log</code> walks the whole branch. Give it a file path — <code>git log deploy/pipeline.yml</code> — and it shows only commits that touched that file, which answers 'who changed the pipeline and when' in one step. Adding <code>--follow</code> would keep following the file even across a rename. <b>Goal 2:</b> <code>git show</code> prints one commit with its patch; with no argument it uses <code>HEAD</code>, the commit your current branch points at — here the newest commit on main. <code>git log -p -1</code> is a common equivalent. Together these two commands replace most guesswork about what changed. Focus: log filters by path, show prints one commit plus its diff.</p>"
},
{
 "id":"M09","type":"qcm","title":"Semantic versioning drill","kw":[53],
 "scen":"The Nordwind Labs public API gateway is released as <code>v3.4.1</code>. The team ships a new endpoint, <code>GET /v1/quotes</code>. Existing clients keep working untouched; nothing was removed or renamed.",
 "q":"Which version number should the next release get?",
 "ch":[
  {"t":"v3.5.0","ok":true},
  {"t":"v4.0.0","ok":false},
  {"t":"v3.4.2","ok":false},
  {"t":"v3.10.0","ok":false}
 ],
 "hint":"Semantic versioning has three slots: breaking changes, new features, bug fixes. Which slot did this change fill?",
 "explain":"<p>Semantic versioning reads <code>MAJOR.MINOR.PATCH</code>. <b>MINOR</b> goes up when you add functionality in a backward-compatible way — the new <code>/v1/quotes</code> endpoint breaks nobody, so the release is <b>v3.5.0</b>. <b>Why not the others:</b> MAJOR (v4.0.0) is reserved for breaking changes like removing or renaming endpoints; PATCH (v3.4.2) is for bug fixes that add no features; v3.10.0 treats the version like a decimal where 10 follows 4, but SemVer compares each number separately — 3.5.0 is a perfectly valid successor to 3.4.1, and 3.10.0 would be a strange, misleading jump. Focus: feature without breakage = minor bump.</p>"
},
{
 "id":"M10","type":"match","title":"Know your Git platforms","kw":[48,49,50,51,52],
 "scen":"Nordwind Labs is evaluating where to host its repositories after a cloud migration. You shortlist the big hosted platforms and write one honest line about each.",
 "q":"Match each platform to the description that fits it.",
 "zones":[
  {"id":"z1","l":"GitHub"},
  {"id":"z2","l":"GitLab"},
  {"id":"z3","l":"Bitbucket"},
  {"id":"z4","l":"Azure Repos"},
  {"id":"z5","l":"AWS CodeCommit"}
 ],
 "items":[
  {"t":"Hosts the largest open-source community; CI via Actions","z":"z1"},
  {"t":"All-in-one DevOps platform with built-in CI/CD and a self-managed option","z":"z2"},
  {"t":"Atlassian hosting with Pipelines and deep Jira integration","z":"z3"},
  {"t":"Git hosting inside Azure DevOps, pairs with Azure Boards and Pipelines","z":"z4"},
  {"t":"AWS-native Git hosting; AWS has stopped onboarding new customers","z":"z5"}
 ],
 "hint":"Two of the platforms belong to cloud providers (Microsoft, Amazon); two are Atlassian; one is synonymous with open source.",
 "explain":"<p><b>GitHub</b> is the default home of open source and runs CI through GitHub Actions workflows. <b>GitLab</b> ships repository plus issue tracking plus CI/CD as one product and can be self-managed — popular for teams that want everything in one place. <b>Bitbucket</b> is Atlassian's Git host; its Pull requests and Pipelines integrate tightly with Jira. <b>Azure Repos</b> is the Git service inside Azure DevOps, used with Azure Boards (work items) and Azure Pipelines. <b>AWS CodeCommit</b> is the AWS-native Git service, but AWS closed it to new customers in 2024, so greenfield projects pick something else — knowing that stops you recommending it by default. Focus: pick the platform from the ecosystem your team already lives in.</p>"
},
{
 "id":"M11","type":"multi","title":"The atomic commit checklist","kw":[3,2,17,10],
 "scen":"Nordwind Labs adds 'commit hygiene' to its handbook. You must sort candidate rules into keep and discard.",
 "q":"Select <b>every practice</b> that belongs in the handbook.",
 "ch":[
  {"t":"One logical change per commit, so a revert cleanly removes exactly that change","ok":true},
  {"t":"Write the message so it explains why the change was made","ok":true},
  {"t":"Make sure the tests pass before you commit","ok":true},
  {"t":"Stage related files together on purpose instead of 'git add .' on instinct","ok":true},
  {"t":"Commit everything at the end of the day in one big commit","ok":false},
  {"t":"Keep commented-out dead code committed 'just in case'","ok":false},
  {"t":"Commit the generated build output folder so the app 'runs anywhere'","ok":false}
 ],
 "hint":"Ask of each rule: will this make history easier to read, revert and bisect — or harder?",
 "explain":"<p><b>Keep all four:</b> an <b>atomic commit</b> (one logical change) can be reverted or cherry-picked without dragging unrelated edits along. A message that says <i>why</i> is what future readers — including you — actually need; <code>git log</code> and <code>git blame</code> show the what for free. Committing only when tests pass keeps every point in history buildable, which is what makes bisection possible. Deliberate staging (specific <code>git add</code> paths instead of reflexively adding everything) is how atomic commits happen in practice. <b>Discard all three:</b> the end-of-day mega-commit mixes features, fixes and typos so nothing can be reverted cleanly; dead code belongs in version control's history (or a branch), not commented out in the file; and generated output — <code>node_modules</code>, build folders — belongs in <code>.gitignore</code>, because it is reproducible from source and bloats the repository. Focus: good history is easy to read, revert and bisect.</p>"
},
{
 "id":"M12","type":"decision","title":"Reviewing pull request #312","kw":[26,35,27,57],
 "scen":"You are reviewing Nordwind Labs PR #312, 'Add S3 asset bucket'. Work through the review in order. Choose what a good reviewer does at each step.",
 "q":"Pick the right reviewer action at each step.",
 "steps":[
  {"q":"CI on the PR is red: two unit tests fail.","ch":[
   {"t":"Request changes and wait for the author to push fixes","ok":true,"o":"Requesting changes records what must be fixed before approval. The review loop does its job."},
   {"t":"Approve anyway — tests are probably flaky","ok":false,"o":"Approving over red CI defeats the reason status checks are required."},
   {"t":"Merge to unblock the author","ok":false,"o":"Merging with failing tests moves the breakage onto main where everyone inherits it."}]},
  {"q":"The author pushes a fix. Reading the new diff you spot a hardcoded access key used to seed test data.","ch":[
   {"t":"Request changes: load the key from a test fixture or environment variable","ok":true,"o":"Even test code gets committed, copied and leaked. Keys belong outside the source."},
   {"t":"Approve — it is only test code","ok":false,"o":"'Only test code' still lands in history and still gets scraped by secret scanners for a reason."},
   {"t":"Fix it yourself in the author's branch","ok":false,"o":"Reviewers comment; authors commit. Editing someone else's PR unasked hides the lesson and the discussion."}]},
  {"q":"Everything is addressed. One required status check is still running.","ch":[
   {"t":"Wait for the check to finish, then approve the merge","ok":true,"o":"Branch protection exists to be respected — including the boring waiting parts."},
   {"t":"Use admin rights to merge now","ok":false,"o":"Bypassing protection 'just this once' is logged forever and sets the worst example."},
   {"t":"Ask the author to re-run CI until it is green","ok":false,"o":"The check is still running, not failing. Re-running solves nothing and burns minutes."}]}
 ],
 "hint":"A reviewer's tools are: request changes, approve, and wait. Never approve over red CI, and never merge over a running gate.",
 "explain":"<p><b>Step 1:</b> red CI means request changes — approving or merging over failing tests shifts the break onto main. <b>Step 2:</b> a hardcoded key in test code is still a hardcoded key: it lands in history, gets flagged by secret scanning, and must come from a fixture or environment instead. Reviewers record this as a change request. <b>Step 3:</b> required status checks are the merge gate; the correct move is to wait for green, not to bypass with admin rights. The pattern through all three steps: the review process only protects main if reviewers let it finish its job. Focus: 'request changes' for real findings, patience for running checks.</p>"
},
{
 "id":"M13","type":"qcm","title":"Why fetch before pull?","kw":[9],
 "scen":"A Nordwind Labs onboarding slide says: 'Run <code>git fetch</code> before you start work, look at what came in, then decide.' A new developer asks why not just run <code>git pull</code> immediately.",
 "q":"What is the real difference the slide is pointing at?",
 "ch":[
  {"t":"fetch downloads remote updates without merging them, so you can look before your branch changes","ok":true},
  {"t":"fetch uploads your local commits to origin","ok":false},
  {"t":"fetch deletes local commits that are not on origin","ok":false},
  {"t":"fetch and pull are the same command with different names","ok":false}
 ],
 "hint":"One of them never changes your working branch. Which one?",
 "explain":"<p><b>Correct:</b> <code>git fetch</code> contacts origin and downloads new commits, branches and tags, but leaves your working copy and local branches exactly as they are. You can then inspect (<code>git log origin/main</code>, <code>git diff main origin/main</code>) and merge deliberately. <code>git pull</code> is fetch <i>plus</i> an immediate merge (or rebase) into your current branch — convenient, but it changes your branch before you have seen what arrived, which is how surprise merge commits and surprise conflicts happen. <b>The distractors:</b> uploading commits is <code>git push</code>; deleting local commits is not what fetch does (it only adds remote refs); and pull is genuinely a different command — fetch plus merge. Focus: fetch = download only, pull = download + integrate.</p>"
},
{
 "id":"M14","type":"logview","title":"Who raised the timeout?","kw":[10],
 "file":"git blame — src/retry.py",
 "scen":"Requests to the billing service are timing out. Someone changed the client timeout at some point and nobody remembers who or when. You run <code>git blame</code> on the config lines.",
 "q":"Click the blame row that shows <b>who</b> raised the request timeout, and <b>when</b>.",
 "log":[
  "e9d1c02 (Marco T.   2026-08-02 12:14) 1  RETRY_LIMIT  = 3",
  "e9d1c02 (Marco T.   2026-08-02 12:14) 2  RETRY_BACKOFF = 2",
  "77aa912 (Priya N.   2026-09-18 09:41) 3  TIMEOUT_SECS = 300",
  "e9d1c02 (Marco T.   2026-08-02 12:14) 4  CACHE_TTL    = 60"
 ],
 "ans":{"kind":"spot","bad":[2]},
 "hint":"Each row is stamped with the last commit that touched that exact line. You are looking for the line that sets the timeout.",
 "explain":"<p><code>git blame</code> annotates every line with the commit that last changed it — author, date, and hash. <b>Row 3</b> is the answer: <code>TIMEOUT_SECS = 300</code> was last touched by commit <code>77aa912</code>, authored by Priya N. on 2026-09-18. The other rows all trace back to the original commit from August, so they are not the change you are hunting. With the hash in hand the next step is <code>git show 77aa912</code> to see the full change and its commit message — that usually explains <i>why</i> the timeout moved from 30 to 300 seconds. Focus: blame answers 'who touched this line and when'; show answers 'what exactly did that commit do'.</p>"
},
{
 "id":"M15","type":"order","title":"Response to a leaked key","kw":[58,59,37,38,34,61],
 "scen":"Saturday, 16:40. Dana notices a cloud storage access key was committed to the public <b>shopfront-docs</b> repository two hours ago in commit 8c1d9e2. The key is live. Reorder the response plan.",
 "q":"Put the five response steps into the correct order.",
 "steps":[
  "Disable the exposed key at the cloud provider so it stops working",
  "Remove the credential from the code and load it from the secret manager instead",
  "Purge the file from repository history and coordinate the history rewrite with the whole team",
  "Turn on push protection and add secret scanning to the pre-commit hook so this is blocked next time",
  "Check provider audit logs for misuse of the key and write up the incident"
 ],
 "hint":"First make the key worthless, then clean the code, then the history, then the prevention, then the paperwork.",
 "explain":"<p><b>1) Disable the key first</b> — every minute it stays live is exposure; rotation beats cleaning. <b>2) Remove it from the code</b> and load it from the secret manager / environment so the fix is structural, not cosmetic. <b>3) Purge the history</b> with the team coordinated, because a normal delete leaves the credential in old commits for anyone who clones. <b>4) Prevention:</b> push protection rejects pushes that contain detected secrets before they land, and a pre-commit secret-scanning hook catches them even earlier on the developer's machine. <b>5) Audit logs</b> tell you whether anyone used the key while it was exposed — that decides whether this is a close call or a full incident — and the write-up turns it into learning. Focus: stop the bleeding, then clean, then prevent, then verify.</p>"
},
{
 "id":"M16","type":"fitb","title":"Write the .gitignore","kw":[17,62],
 "scen":"The <b>shopfront</b> repository keeps collecting junk: dependencies, local credential files, Terraform runtime state, editor folders. You are fixing the root <code>.gitignore</code>.",
 "q":"Fill the four gaps with the entries that belong in <code>.gitignore</code>.",
 "lines":[
  "# dependencies installed locally",
  "[[1]]/",
  "",
  "# local environment files that hold real credentials",
  "[[2]]",
  "",
  "# Terraform runtime state (may contain secrets)",
  "*.tfstate*",
  "",
  "# editor noise",
  "[[3]]/",
  "",
  "# compiled output",
  "[[4]]/"
 ],
 "ans":["node_modules",".env",".idea","dist"],
 "bank":["src/","package.json","README.md","*.tf"],
 "hint":"Two entries are folders (one of them full of installed packages), one is a hidden credentials file, one is the build output.",
 "explain":"<p><b>node_modules/</b> holds installed packages: reproducible from the lockfile, enormous in diff size, so it never belongs in Git. <b>.env</b> is the classic local credentials file — ignoring it stops real secrets from being staged (it does not remove copies already committed; those need rotation and history cleanup). <b>.idea/</b> is personal editor state; teammates using other editors do not want your IDE settings. <b>dist/</b> is compiled output that the build regenerates. The distractors are wrong on purpose: <code>src/</code> and <code>package.json</code> are the source of truth and must always be tracked, README.md is documentation, and <code>*.tf</code> would ignore the Terraform code itself — only the runtime <code>*.tfstate</code> files are ignored. Focus: ignore what is generated or secret; never ignore what is source.</p>"
},
{
 "id":"M17","type":"multi","title":"Harden the main branch","kw":[27,35,15,29],
 "scen":"Nordwind Labs enables branch protection on <code>main</code> for the first time. You propose the settings.",
 "q":"Select <b>every setting</b> that belongs in a strong branch-protection configuration.",
 "ch":[
  {"t":"Require a pull request before any merge into main","ok":true},
  {"t":"Require status checks (CI) to pass before merging","ok":true},
  {"t":"Dismiss stale approvals when new commits are pushed","ok":true},
  {"t":"Block force pushes and branch deletion","ok":true},
  {"t":"Enable a merge queue so busy hours do not race half-tested merges","ok":true},
  {"t":"Allow admins to push directly when they are in a hurry","ok":false},
  {"t":"Delete the main branch automatically when CI fails","ok":false},
  {"t":"Turn off required checks for documentation-only changes","ok":false}
 ],
 "hint":"Four settings add control; one keeps main green under load. The wrong ones weaken or nonsensify protection.",
 "explain":"<p><b>All five correct settings:</b> requiring a <b>pull request</b> makes every change reviewable; requiring <b>status checks</b> means only green code merges; <b>dismissing stale approvals</b> closes the loophole where a PR is approved and then quietly rewritten with new commits; blocking <b>force pushes and deletion</b> protects history from being rewritten or destroyed on the branch everyone depends on; and a <b>merge queue</b> batches and re-tests pending PRs together so two individually-green changes cannot merge into a red main at the same moment. <b>The distractors:</b> an admin bypass re-opens the hole the setting closed (and every use is an audit event); deleting main on failure is self-sabotage — main is the source of truth; and disabling checks 'for speed' removes the very gate protection exists for. Focus: protection is only as strong as its weakest bypass.</p>"
},
{
 "id":"M18","type":"qcm","title":"What is a fast-forward merge?","kw":[6,5],
 "scen":"You branched <code>feature/labels</code> from main on Monday. Since then, nobody else has merged anything into main. Today your PR merges without a merge commit, and the button said 'fast-forward'.",
 "q":"What actually happened during that fast-forward merge?",
 "ch":[
  {"t":"main simply moved its pointer forward to your latest commit — no merge commit was needed","ok":true},
  {"t":"Git combined both histories with a three-way merge commit","ok":false},
  {"t":"Git rewrote your branch's commits on top of main","ok":false},
  {"t":"Your commits were squashed into one new commit on main","ok":false}
 ],
 "hint":"Nothing had changed on main since you branched. What does Git still have to 'combine' in that case?",
 "explain":"<p>When main has <b>no new commits</b> since your branch was created, your history is a simple continuation of main's. Merging needs no combination work: Git just moves the <code>main</code> pointer to your last commit — a <b>fast-forward</b>. History stays perfectly linear and no merge commit appears. <b>The distractors:</b> a three-way merge with a merge commit is what happens when <i>both</i> sides moved (diverged histories need a join point); rewriting commits on top of main is a <b>rebase</b>; collapsing many commits into one is a <b>squash merge</b>. All three are real operations — they just describe different situations. Focus: fast-forward = 'main did not move, so the pointer slides up'.</p>"
},
{
 "id":"M19","type":"spot","title":"The pipeline definition broke","kw":[32,33],
 "scen":"After a routine merge, every push to <b>shopfront</b> fails instantly with 'invalid pipeline definition'. You open <code>.gitlab-ci.yml</code> as merged.",
 "q":"Click the <b>two lines</b> that break the pipeline definition.",
 "file":".gitlab-ci.yml",
 "code":[
  "stages:",
  "  - build",
  "  - test",
  "  - deploy",
  "",
  "build_job:",
  "  stage: buld",
  "  script:",
  "    - npm ci",
  "deploy_job:",
  "  stage: deploy",
  "  script:",
  "    - ./deploy.sh",
  "  only:",
  "    - mainn"
 ],
 "bad":[6,13],
 "hint":"One job points at a stage that does not exist. One trigger points at a branch that does not exist. Read the defined stages list first.",
 "explain":"<p>Pipeline-as-code is code: a typo here is a broken build for the whole team. <b>Line 7</b> sets <code>stage: buld</code>, but the defined stages are <code>build</code>, <code>test</code>, <code>deploy</code> — the runner refuses a job that references an undeclared stage. <b>Line 14</b> (displayed as the <code>mainn</code> entry) makes the deploy job fire only on a branch named <code>mainn</code> — a typo means the real <code>main</code> never deploys. Both mistakes are silent until push time, which is why teams run a pipeline linter or a validate job before merge. Focus: when a pipeline 'fails instantly', check references — stage names, branch names, image names — against their declarations.</p>"
},
{
 "id":"M20","type":"steps","title":"Two views of one mistake","kw":[38,37,57,64],
 "scen":"A Nordwind Labs developer committed a database password in <code>app.py</code> and opened a pull request. The repository is currently private. You examine the same mistake twice: once as the defender, once thinking like an attacker.",
 "q":"Answer both cards — one defender view, one attacker view.",
 "cards":[
  {"q":"<b>Defender view:</b> which control would have stopped the password from ever entering the repository?","ch":[
   {"t":"Push protection / secret scanning blocking the push at upload time","ok":true,"o":"Push protection checks every push for known secret patterns and rejects it before the commit is accepted — the mistake never lands."},
   {"t":"Relying on the code reviewer to notice it in the diff","ok":false,"o":"Reviewers are a safety net, not a scanner; they miss one string among hundreds of lines."},
   {"t":"Deleting the file after the merge","ok":false,"o":"Deleting a file does not erase its history — the password would remain in older commits."}]},
  {"q":"<b>Attacker view:</b> if the repository had been public, what makes this mistake so dangerous?","ch":[
   {"t":"Bots scrape every public commit within minutes, long before a human reads the PR","ok":true,"o":"Automated crawlers watch public pushes specifically for credential patterns; the exposure window is minutes, not days."},
   {"t":"The attacker would first need to find and read the CI logs","ok":false,"o":"The secret is in the commit itself — no logs or special access are needed on a public repo."},
   {"t":"Nothing happens until a search engine indexes the code, weeks later","ok":false,"o":"Attackers do not wait for search engines; they watch commit streams directly in near real time."}]}
 ],
 "hint":"Defender: the best control acts before the commit is accepted. Attacker: think about how fast automated scraping is.",
 "explain":"<p><b>Defender:</b> push protection (secret scanning at the server) is the control that acts at push time — it rejects commits containing credential patterns before they are stored, which no reviewer speed or vigilance can match. <b>Attacker:</b> public repositories are monitored by scraping bots that alert their owners within minutes of a credential-shaped string appearing; the practical exposure window is tiny, which is why 'we deleted it quickly' is not a recovery plan. The attacker also does not need CI logs or special access — the commit itself is the leak. And deleting the file afterwards helps nothing: the credential lives in history, so rotation is mandatory either way. Focus: prevention at push time beats detection after merge.</p>"
},
{
 "id":"M21","type":"decision","title":"Resolving a real conflict","kw":[7,8,2,3,9],
 "scen":"Your pull request <code>feature/discount</code> conflicts with main in <code>pricing.py</code>. Your branch set the discount to 10; main meanwhile changed it to 15 (the product decision, confirmed in the ticket). Work through the resolution.",
 "q":"Pick the right action at each step.",
 "steps":[
  {"q":"How do you start resolving the conflict?","ch":[
   {"t":"git fetch origin, then rebase or merge main into your branch locally","ok":true,"o":"Conflicts are resolved where you can run and test the code — locally, on an up-to-date branch."},
   {"t":"Edit the file in the web editor until the markers disappear","ok":false,"o":"Web edits can hide markers without testing anything; conflicts deserve a real build and test run."},
   {"t":"Force-push your branch to overwrite main's changes","ok":false,"o":"A force push would destroy the product decision that main already contains."}]},
  {"q":"The file shows conflict markers: HEAD has 10, incoming main has 15. What goes in the final file?","ch":[
   {"t":"Keep 15 — the product decision in main wins; remove all marker lines","ok":true,"o":"A conflict is a human decision, not a merge tool choice: main holds the agreed value, and markers must all go."},
   {"t":"Keep 10 — your branch is newer in time","ok":false,"o":"Newer is not the same as correct; the 15 came from the confirmed product decision."},
   {"t":"Keep both lines so nothing is lost","ok":false,"o":"Two assignments means one silently overwrites the other — and the markers must never survive."}]},
  {"q":"You edited the file. How does the resolution reach the pull request?","ch":[
   {"t":"git add pricing.py, commit the resolution, push to the same branch","ok":true,"o":"Staging marks the conflict as resolved; the commit and push update the open PR automatically."},
   {"t":"Close the editor — Git saves the resolution automatically","ok":false,"o":"Git does not know you finished: until the file is staged and committed, the merge is still in progress."},
   {"t":"Open a new pull request for the resolved file","ok":false,"o":"The resolution belongs to the existing branch; a second PR splits the change and confuses review."}]}
 ],
 "hint":"Local resolve → human decision on content → add + commit + push to the same branch.",
 "explain":"<p><b>Step 1:</b> bring the branch up to date locally — fetch main, then rebase or merge it into your branch. Resolution happens where you can compile and run tests. <b>Step 2:</b> the conflict markers (<code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>) present two versions of the same line; Git cannot know that the ticket settled the value at 15 — resolving is a human decision. You keep 15 and remove every marker line, because leftover markers break the build. <b>Step 3:</b> staging the file (<code>git add</code>) tells Git the conflict is resolved; committing finishes the merge and pushing updates the existing pull request. Focus: conflict = 'Git stopped, human decides, then add + commit + push'.</p>"
},
{
 "id":"M22","type":"qcm","title":"Stage exactly one file","kw":[2,12],
 "scen":"You have edited three files: <code>src/auth.py</code> and <code>src/api.py</code> belong to one fix, but <code>notes.txt</code> is unrelated scratch. You want to commit only the auth file first.",
 "q":"Which command stages just <code>src/auth.py</code>?",
 "ch":[
  {"t":"git add src/auth.py","ok":true},
  {"t":"git commit -a -m \"auth fix\"","ok":false},
  {"t":"git push origin main","ok":false},
  {"t":"git stash","ok":false}
 ],
 "hint":"The staging area is built one path at a time. Which command takes a path?",
 "explain":"<p><b>Correct:</b> <code>git add src/auth.py</code> stages exactly that path; you then commit, leaving the other two files untouched in the working directory. <b>The distractors:</b> <code>git commit -a</code> stages and commits <i>every</i> tracked modified file — including <code>notes.txt</code> and <code>api.py</code>, which is exactly what you wanted to avoid; <code>git push</code> uploads commits and does not build them; and <code>git stash</code> shelves your working changes aside entirely — useful for switching branches, useless for selective staging. The habit this drill builds: build each commit deliberately, path by path, so history stays atomic. Focus: <code>git add &lt;path&gt;</code> is the precision tool; <code>-a</code> is the shotgun.</p>"
},
{
 "id":"M23","type":"match","title":"Infrastructure as Code meets Git","kw":[40,41,42,45,44,43,46],
 "scen":"Nordwind Labs provisions its cloud network with code and deploys with GitOps. New team members keep mixing the vocabulary. You build a matching drill.",
 "q":"Match each item to its correct description.",
 "zones":[
  {"id":"z1","l":"Declarative IaC tool that keeps a state file describing real infrastructure"},
  {"id":"z2","l":"Agentless automation tool driven by playbooks over SSH"},
  {"id":"z3","l":"Operating model: Git holds the desired state; changes land only via pull request"},
  {"id":"z4","l":"GitOps operator (for example Argo CD or Flux) that syncs a cluster with the repo"},
  {"id":"z5","l":"Live configuration that no longer matches what the repository declares"}
 ],
 "items":[
  {"t":"Terraform","z":"z1"},
  {"t":"Ansible","z":"z2"},
  {"t":"GitOps","z":"z3"},
  {"t":"Argo CD / Flux","z":"z4"},
  {"t":"Drift","z":"z5"}
 ],
 "hint":"One tool declares infrastructure and stores what it built; one drives servers over SSH; one is a model, one is the software that enforces it, one is the problem the model prevents.",
 "explain":"<p><b>Terraform</b> is declarative Infrastructure as Code: you describe the desired cloud resources, and its <b>state</b> file maps that code onto what really exists — which is why the state must live in a remote backend, never committed to the repo (it can contain secrets). <b>Ansible</b> automates configuration over SSH with playbooks — no agent installed on targets. <b>GitOps</b> is the operating model where the repository is the single source of truth: every change is a pull request, and the system converges itself onto what Git says. <b>Argo CD and Flux</b> are the operators that make GitOps real: they continuously <b>reconcile</b> the cluster with the repository. <b>Drift</b> is what happens when someone changes live infrastructure by hand — the reality no longer matches the repo, and the next reconcile reverts it. Focus: repo declares, operator reconciles, manual changes = drift.</p>"
},
{
 "id":"M24","type":"logview","title":"Reading the audit trail","kw":[61,15,27,60,37,65,29],
 "file":"audit log — shopfront repository (2026-10-06)",
 "scen":"Monthly review time. You export the repository audit log for <b>shopfront</b> and scan a day of events for anything that needs follow-up.",
 "q":"Select <b>every event</b> that genuinely needs follow-up.",
 "log":[
  "2026-10-06 08:12  login                 dana.t      success (2FA)",
  "2026-10-06 09:03  branch_create         dana.t      feature/sso",
  "2026-10-06 09:40  pull_request_merged   marco       PR #221 into main",
  "2026-10-06 10:15  force_push            svc-bot     branch: main (+3 -12 commits)",
  "2026-10-06 10:41  protection_disabled   admin1      branch: main",
  "2026-10-06 11:02  member_role_granted   hr-bot      role: admin on shopfront",
  "2026-10-06 11:30  secret_alert_dismiss  dana.t      alert #88 (no fix linked)",
  "2026-10-06 23:00  mirror_backup         system      nightly mirror completed"
 ],
 "ans":{"kind":"multi","ch":[
  {"t":"force_push to main by svc-bot","ok":true},
  {"t":"protection_disabled on main","ok":true},
  {"t":"admin role granted to hr-bot","ok":true},
  {"t":"secret alert dismissed without a linked fix","ok":true},
  {"t":"pull_request_merged PR #221","ok":false},
  {"t":"nightly mirror_backup completed","ok":false}
 ]},
 "hint":"Normal life: logins, feature branches, reviewed merges, backups. Follow-up: history rewritten, protection off, power granted, warning silenced.",
 "explain":"<p><b>Needs follow-up — all four:</b> a <b>force push</b> to main rewrote shared history (12 commits disappeared) — who is <code>svc-bot</code> and why could it do that? <b>protection_disabled</b> removed the guard rails from main for a window — that is often how the force push got in. An <b>admin grant to hr-bot</b> breaks least privilege: a human-resources bot has no business administering code — RBAC on repositories should follow the job. A <b>dismissed secret alert with no fix linked</b> means a detected credential was waved through without rotation or removal. <b>Normal events:</b> a reviewed merge, a completed nightly mirror (that one is your backup working — keep it), a feature branch, a 2FA login. Focus: the audit trail is a control only if someone reads it and asks 'why?' about the unusual rows.</p>"
},
{
 "id":"M25","type":"fitb","title":"Complete the pipeline trigger","kw":[33,31,35,36],
 "scen":"The Nordwind Labs CI workflow lost its trigger block in a bad merge. Rebuild it — the pipeline must run the tests and keep the built package for release.",
 "q":"Fill the four gaps in the workflow file.",
 "lines":[
  "name: ci",
  "on:",
  "  [[1]]:",
  "    branches: [ [[2]] ]",
  "jobs:",
  "  test:",
  "    steps:",
  "      - run: npm [[3]]",
  "      - run: npm run build",
  "      - uses: actions/upload-[[4]]@v4",
  "        with: { name: shopfront-package }"
 ],
 "ans":["push","main","test","artifact"],
 "bank":["fetch","dev","lint","container"],
 "hint":"The event that starts the pipeline, the branch it protects, the command that runs the test suite, and the packaged output that gets uploaded.",
 "explain":"<p><b>push</b> is the event that triggers the workflow when commits land (the alternative would be a <code>pull_request</code> trigger — and 'fetch' is a git command, not a CI event). <b>main</b> is the branch whose pushes must always build and test, because main is what releases come from. <b>npm test</b> runs the automated test suite — the gate that keeps broken commits from feeling green. <b>artifact</b> is the packaged output of the build; uploading it means the release process consumes exactly the tested, built bytes instead of rebuilding from scratch (and the build is reproducible). The distractors: 'dev' is the wrong branch to gate releases on, 'lint' does not replace the test suite, 'container' is not what upload-actions packages here. Focus: trigger event → branch → test → artifact is the spine of almost every CI file.</p>"
},
{
 "id":"M26","type":"order","title":"Cutting release v2.3.0","kw":[54,55,16,36,11],
 "scen":"Release day at Nordwind Labs. The <b>shopfront</b> service ships as versioned artifacts. Reorder the release steps.",
 "q":"Put the five release steps into the correct order.",
 "steps":[
  "Update the changelog and bump the version to 2.3.0 in the version file",
  "Open the release pull request, get it reviewed and merge it into main",
  "Create tag v2.3.0 on main and push the tag",
  "CI builds the artifact from the tag and runs the release tests",
  "Publish the artifact from the tag build and record the previous artifact (v2.2.9) as the rollback target"
 ],
 "hint":"The changelog precedes the tag; the artifact must be built from the tag, not from someone's laptop.",
 "explain":"<p><b>1)</b> The changelog and version bump document what is shipping — before anything is cut. <b>2)</b> Even release paperwork goes through a reviewed pull request, keeping main's history honest. <b>3)</b> The <b>tag</b> marks the exact commit that is v2.3.0 — tags are immutable pointers, which is what makes the release auditable. <b>4)</b> CI builds the artifact <i>from the tag</i>, so the shipped bytes correspond to a commit everyone can see — never to an untracked laptop state. <b>5)</b> Publishing records the previous artifact (v2.2.9) as the <b>rollback</b> target: if 2.3.0 misbehaves in production, redeploying the last good artifact is the fastest recovery while the fix is developed. Focus: tag the release, build from the tag, know your rollback before you need it.</p>"
},
{
 "id":"M27","type":"multi","title":"Why sign commits?","kw":[30,27],
 "scen":"After an incident where commits appeared under a lead's name that the lead never made, Nordwind Labs considers requiring signed commits. You brief the team on what signing does and does not do.",
 "q":"Select <b>every true statement</b> about commit signing.",
 "ch":[
  {"t":"A verified signature proves the commit really came from the key's owner","ok":true},
  {"t":"Signed commits display as 'Verified' in the pull request","ok":true},
  {"t":"Branch protection can be configured to accept only signed commits","ok":true},
  {"t":"Signing encrypts the commit so nobody can read the code","ok":false},
  {"t":"Signing replaces the need for code review","ok":false},
  {"t":"Signing makes repository history impossible to rewrite","ok":false}
 ],
 "hint":"Signing is about identity, not secrecy. It proves authorship — nothing more.",
 "explain":"<p><b>True — all three:</b> a GPG/SSH signature is created with the author's private key, so a <b>verified</b> signature ties the commit to that key's owner — exactly the protection missing in the incident. Platforms display signed-and-verified commits with a <b>'Verified'</b> badge, making authorship visible at review time. And protection rules can <b>require signatures</b>, so unsigned pushes are rejected automatically. <b>False — all three:</b> signing is not encryption — the commit content stays fully readable; it proves <i>who</i>, not <i>what is hidden</i>. Signing does not replace review — a correctly signed commit can still be a terrible change. And signatures do not freeze history — anyone with push rights can still rewrite a branch (signatures just stop pretending to be you when they do). Focus: signing proves identity; review judges content; protection rules enforce both.</p>"
},
{
 "id":"M28","type":"spot","title":"The onboarding doc is wrong","kw":[15,2,3],
 "scen":"A well-meaning senior developer wrote a 'git quick tips' section in the onboarding document. A new hire pasted two of the tips into a shared repo yesterday and caused an incident. Find the two dangerous lines.",
 "q":"Click the <b>two lines</b> of advice that are wrong for shared repositories.",
 "file":"docs/onboarding-git.md — 'Quick tips' section",
 "code":[
  "## Quick tips",
  "",
  "3. Made a mistake on main? Just run:",
  "   git push --force origin main",
  "",
  "5. Too lazy to stage files? Use:",
  "   git commit -a -m \"update\"",
  "",
  "8. Review your diff before pushing:",
  "   git diff HEAD~1",
  "",
  "9. Keep local experiments on a branch:",
  "   git switch -c experiment/x"
 ],
 "bad":[3,6],
 "hint":"One tip rewrites shared history. The other stages only part of your work — new files are silently left out.",
 "explain":"<p><b>Tip 3 (line 4, shown as index 3):</b> force-pushing main rewrites the branch everyone shares — teammates' pulls now conflict, commits can vanish, and the audit trail records an incident. On shared branches the fix is a forward-moving <code>git revert</code>, never a force push. <b>Tip 5 (the <code>commit -a</code> line):</b> the <code>-a</code> flag stages only <i>modified tracked</i> files — brand-new files stay untracked and are silently left out of the commit, which is exactly how 'I committed it' turns into 'it was never there'. Stage deliberately with <code>git add &lt;path&gt;</code>. <b>The healthy tips (8 and 9)</b> stay: reviewing your diff before pushing and keeping experiments on branches are genuinely good habits. Focus: two of the most common real-world footguns live in exactly these two commands.</p>"
},
{
 "id":"M29","type":"steps","title":"Repository health clinic","kw":[18,12,13,24,56,4,14,63],
 "scen":"You are auditing the <b>shopfront</b> organisation's repositories for the quarterly review. Eight findings are on your list. For each, choose the correct call.",
 "q":"Choose the right answer for each finding.",
 "cards":[
  {"q":"<b>1.</b> The design repo holds 2 GB of video files; clones take 20 minutes.","ch":[
   {"t":"Migrate the binaries to Git LFS so the repo stores lightweight pointers","ok":true,"o":"Git LFS keeps big binaries outside normal history — clones shrink and text diffs stay fast."},
   {"t":"Compress the videos into one big zip and commit that instead","ok":false,"o":"One giant blob is worse than many: every version of the zip lives in history forever."},
   {"t":"Tell everyone to clone less often","ok":false,"o":"That is a symptom management, not a fix — the repo is unhealthy."}]},
  {"q":"<b>2.</b> A developer must switch branches but has half-finished changes they cannot commit yet.","ch":[
   {"t":"git stash the changes, switch, then stash pop on return","ok":true,"o":"Stash shelves the working directory safely without creating a fake commit."},
   {"t":"Commit the half-work with the message 'wip'","ok":false,"o":"A broken 'wip' commit pollutes shared history if pushed; stash exists for exactly this."},
   {"t":"Add the files to .gitignore until tomorrow","ok":false,"o":"Ignoring them hides the work from Git entirely — a good way to lose it."}]},
  {"q":"<b>3.</b> A crash fix on main must also ship in the old release branch release/2.2 for customers who cannot upgrade.","ch":[
   {"t":"Cherry-pick the fix commit onto release/2.2","ok":true,"o":"Cherry-pick copies exactly that one commit — the minimal, reviewable way to backport a fix."},
   {"t":"Merge all of main into release/2.2","ok":false,"o":"That drags six months of changes into a stable branch — the opposite of a targeted fix."},
   {"t":"Rebase release/2.2 onto main","ok":false,"o":"Rebasing a stable release branch rewrites customer-facing history."}]},
  {"q":"<b>4.</b> Enterprise customers need guaranteed fixes for release 2.2 for the next five years.","ch":[
   {"t":"Maintain an LTS release branch and backport fixes to it","ok":true,"o":"An LTS (long-term support) branch exists precisely so old versions keep receiving reviewed fixes."},
   {"t":"Tag main every week and call it a release","ok":false,"o":"Weekly tags of moving main are snapshots, not support commitments."},
   {"t":"Freeze the whole repository so nothing changes","ok":false,"o":"Freezing everything stops 2.4 development to serve 2.2 customers."}]},
  {"q":"<b>5.</b> CI logs for the tag build show the warning 'detached HEAD'. The build output looks correct.","ch":[
   {"t":"Nothing is wrong — checking out a tag always runs on a detached HEAD","ok":true,"o":"A tag is not a branch, so HEAD points at the commit directly. Builds from tags are supposed to look like this."},
   {"t":"Panic: the repository is corrupt","ok":false,"o":"Detached HEAD is normal checkout behaviour for tags and raw commits."},
   {"t":"Force-push main to fix HEAD","ok":false,"o":"A force push would be destructive and completely unrelated to the warning."}]},
  {"q":"<b>6.</b> A teammate ran a hard reset on their local branch and 'lost' a day of unpushed commits.","ch":[
   {"t":"Recover the commits from the reflog and reset or branch back to them","ok":true,"o":"The reflog records where HEAD has been — unpushed-but-committed work is almost always recoverable."},
   {"t":"The commits are gone; rewrite them from memory","ok":false,"o":"Committed work is rarely gone — the reflog keeps it for weeks."},
   {"t":"Clone the repository again","ok":false,"o":"A fresh clone has never seen those local-only commits."}]},
  {"q":"<b>7.</b> Compliance asks for a machine-readable inventory of every component in the released artifact.","ch":[
   {"t":"Generate an SBOM in the pipeline and publish it with the release","ok":true,"o":"An SBOM is the standard component inventory — generate it where the artifact is built."},
   {"t":"Email a spreadsheet of 'main dependencies we remember'","ok":false,"o":"Hand-maintained lists rot immediately and satisfy nobody in an audit."},
   {"t":"Point compliance at the source code","ok":false,"o":"Auditors want a verified inventory of the shipped artifact, not a code tour."}]},
  {"q":"<b>8.</b> Developers complain they must re-download the whole repository after a new clone because onboarding docs live in a repo with 5 years of history.","ch":[
   {"t":"This is normal Git behaviour — a clone needs the history; use a shallow clone for docs-only work","ok":true,"o":"Clones carry history by design; --depth 1 gives docs writers what they need without the weight."},
   {"t":"Delete old commits from the shared repository to shrink it","ok":false,"o":"You cannot delete history from a shared repo without rewriting it — an incident, not a fix."},
   {"t":"Move the docs into a chat channel instead","ok":false,"o":"Docs outside version control lose review, history and links to code."}]}
 ],
 "hint":"One word per finding: LFS, stash, cherry-pick, LTS, detached, reflog, SBOM, shallow.",
 "explain":"<p><b>1) LFS:</b> large files become pointer files so the repository stays small. <b>2) Stash:</b> shelves uncommitted work cleanly — no fake commits. <b>3) Cherry-pick:</b> copies one commit onto another branch — the surgical backport. <b>4) LTS:</b> a long-term-support release branch exists to receive backported fixes for years. <b>5) Detached HEAD:</b> normal when CI checks out a tag (tags are not branches) — no action needed. <b>6) Reflog:</b> Git's local journal of where HEAD has been; committed-but-unpushed work is recoverable from it. <b>7) SBOM:</b> the machine-readable component inventory generated at build time. <b>8) Shallow clone:</b> full history is the normal clone contract; docs-only consumers can use a shallow clone instead of rewriting shared history. Focus: every real Git pain here has a named, purpose-built tool.</p>"
},
{
 "id":"M30","type":"match","title":"Where does the change go?","kw":[2,3,9,10],
 "scen":"A trainee drew Git's flow on the whiteboard and got the arrows wrong. You turn it into a sorting exercise: each command moves code between two of Git's areas — or only reports.",
 "q":"Place each command in the zone describing what it does.",
 "zones":[
  {"id":"z1","l":"Working directory → Staging area"},
  {"id":"z2","l":"Staging area → Local repository"},
  {"id":"z3","l":"Local repository → Remote (origin)"},
  {"id":"z4","l":"Remote (origin) → Local machine"},
  {"id":"z5","l":"Reports or compares — moves nothing"}

<script>

/* ============ Exam chrome ============ */

function renderChrome(){

function drawTimer(){

function updateNav(){
  var n=$('nav'); if(!n) return;

    var a=S.A[oi], ex=DATA[oi]; var cls='navcell', ttl='Q'+(pos+1)+' — '+TYPELBL[ex.type];
    var glyph='';
    if(a.status==='skipped'){cls+=' skipped'; ttl+=' — skipped (excluded from scoring)'; glyph='⤼ ';}
    else if(a.status==='locked'){
      if(a.earned>=ex._pts-0.001){cls+=' done';ttl+=' — full points';glyph='✓ ';}
      else if(a.earned>0){cls+=' part';ttl+=' — partial points';glyph='! ';}
      else {cls+=' zero';ttl+=' — zero points';glyph='✗ ';}
    } else ttl+=' — not answered yet';
    var cur = (pos===S.cur);
    if(cur){cls+=' cur';ttl+=' — you are here';}
    return '<button class="'+cls+'" data-pos="'+pos+'" title="'+esc(ttl)+'" aria-label="'+esc(ttl)+'"'+(cur?' aria-current="true"':'')+'>'+glyph+(a.status==='skipped'?'':(pos+1))+'</button>';

function updateScore(){

  var done=0, skip=0; S.A.forEach(function(a){ if(a.status==='locked')done++; if(a.status==='skipped')skip++; });
  var sl=$('scoreline');
  if(sl) sl.textContent = 'Question '+(S.cur+1)+' of '+DATA.length+' · Score '+fmt(e)+' pts · Checked '+done+' · Skipped '+skip;
  var f=$('fill'); if(f) f.style.width = ((S.cur+1)/DATA.length*100)+'%';
  var tl=$('themeline');
  if(tl){ tl.innerHTML = THEMES.map(function(t,ti){
    var tot=0, got=0;

    return '<span class="tchip'+(tot&&got===tot?' tdone':'')+'" title="'+esc(t.n)+': '+got+' of '+tot+' exercises checked">'+esc(t.n)+' '+got+'/'+tot+'</span>';
  }).join(''); }
  drawTimer();
}
function goto(pos){
  if(pos<0||pos>=DATA.length) return;
  S.chkP = false; S.cur = pos;
  renderExercise();
  updateNav(); updateScore();
  if($('ex')) window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}

}
function togglePause(){
  if(!S.started||S.over) return;

<script>
"use strict";
/* ============ Renderers ============ */
var R = null;

function exShell(ex){
  var oi = DATA.indexOf(ex);

  }

    '<div class="card scen"><div class="lab">Scenario</div>'+ex.scen+'</div>'+
    artefact+
    '<div class="card quest"><div class="lab">Question</div>'+ex.q+'</div>'+
    '<div class="card ans"><div class="lab">'+(ANSLBL[ex.type]||'ANSWER')+'</div><div id="answrap" class="answrap"></div>'+
    '<div id="fb" class="hidden"></div>'+
    '<div class="actions"><button id="checkBtn" class="btn primary">Check</button><button id="skipBtn" class="btn">Skip</button><button id="hintBtn" class="btn">Hint (−10%)</button><button id="reviseBtn" class="btn hidden">Revise</button></div>'+
    '<div id="hintbox" class="hintbox hidden"></div></div>'+
    '<div class="card expl hidden" id="expl"><div class="lab">Explanation</div>'+ex.explain+'</div>';
}
function renderExercise(){
  var oi = S.order[S.cur], ex = DATA[oi], a = S.A[oi];
  if(S.manP){
    $('ex').innerHTML = '<div class="card pausecover"><div class="pauseoverlay">Paused (manual) — press Resume to continue. The exercise is hidden while the clock is stopped.</div></div>';
    R = null; return;
  }
  $('ex').innerHTML = exShell(ex);
  var cont = $('answrap');
  R = makeRenderer(ex, cont, a, true);
  wireActions(ex, a);
  if(R.sync) R.sync();
  if(a.status==='locked' && a.res){
    R.paint(a.res); R.lock();
    showFb(ex, a); showExpl(true);
    $('checkBtn').disabled = true; $('reviseBtn').classList.remove('hidden');
  }
}
function wireActions(ex, a){
  $('checkBtn').addEventListener('click', doCheck);
  $('skipBtn').addEventListener('click', doSkip);
  $('hintBtn').addEventListener('click', doHint);
  $('reviseBtn').addEventListener('click', doRevise);
  $('checkBtn').disabled = (a.status==='locked');
  if(a.status==='locked' && a.res){ $('reviseBtn').classList.remove('hidden'); }
  if(a.hint){ $('hintBtn').textContent='Hint used'; $('hintBtn').disabled=true; var hb=$('hintbox'); hb.textContent='Hint: '+ex.hint; hb.classList.remove('hidden'); }
}
/* -- per-type renderer factories: each returns {get,paint,lock,unlock,clear} -- */
function choiceList(ex, cont, a, ed, multi){
  var rt = a.rt = a.rt||{};
  rt.disp = rt.disp || sh(ex.ch.map(function(_,i){return i;}));
  var name = 'q'+DATA.indexOf(ex);
  cont.innerHTML = '<div class="choicelist">'+rt.disp.map(function(oi){
    return '<label class="choice"><input type="'+(multi?'checkbox':'radio')+'" name="'+name+'" value="'+oi+'"><span class="ct">'+ex.ch[oi].t+'</span><span class="mk"></span></label>';
  }).join('')+'</div>';
  var inputs = Array.prototype.slice.call(cont.querySelectorAll('input'));
  inputs.forEach(function(inp){
    inp.addEventListener('change', function(){ if(a.status==='locked') return;
      if(multi){ var arr = (a.ans||[]).slice(); var v=parseInt(inp.value,10);
        if(inp.checked){ if(arr.indexOf(v)<0) arr.push(v);} else { arr = arr.filter(function(x){return x!==v;}); }
        a.ans = arr;
      } else a.ans = parseInt(inp.value,10);
    });
  });
  function el(i){ return cont.querySelector('input[value="'+i+'"]').closest('.choice'); }
  return {
    get: function(){ return a.ans; },
    sync: function(){ inputs.forEach(function(inp){ inp.checked = multi ? (a.ans||[]).indexOf(parseInt(inp.value,10))>=0 : (a.ans===parseInt(inp.value,10)); }); },
    paint: function(res, marksByOrig){
      inputs.forEach(function(inp){
        var i = parseInt(inp.value,10); var row = el(i); var mk = row.querySelector('.mk');
        var st = marksByOrig ? marksByOrig[i] : null;
        row.classList.remove('ok','bad','miss');
        if(!multi && st===undefined){ }
        if(multi){ if(st==='ok'){row.classList.add('ok'); mk.innerHTML='<span class="mark ok">✓ correct</span>';}
          else if(st==='bad'){row.classList.add('bad'); mk.innerHTML='<span class="mark bad">✗ wrong</span>';}
          else if(st==='miss'){row.classList.add('miss'); mk.innerHTML='<span class="mark miss">! missed</span>';} }
        else { if(res.ok && i===a.ans){row.classList.add('ok'); mk.innerHTML='<span class="mark ok">✓ correct</span>';}
          else if(!res.ok && i===a.ans){row.classList.add('bad'); mk.innerHTML='<span class="mark bad">✗ wrong</span>';}
          else if(!multi && ex.ch[i].ok){row.classList.add('ok'); mk.innerHTML='<span class="mark ok">✓ this was correct</span>';} }
      });
    },
    lock: function(){ inputs.forEach(function(i){i.disabled=true;}); },
    unlock: function(){ inputs.forEach(function(i){i.disabled=false;}); },
    clear: function(){ cont.querySelectorAll('.choice').forEach(function(r){r.classList.remove('ok','bad','miss'); var m=r.querySelector('.mk'); if(m) m.innerHTML='';}); }
  };
}
function rQCM(ex,cont,a){ return choiceList(ex,cont,a,false,false); }
function rMulti(ex,cont,a){ return choiceList(ex,cont,a,true,true); }
function rMatch(ex,cont,a){
  var rt = a.rt = a.rt||{};
  rt.disp = rt.disp || sh(ex.items.map(function(_,i){return i;}));
  rt.place = rt.place||{}; var sel=null;
  function chip(i){ var it=ex.items[i];
    return '<button class="mitem" draggable="true" data-i="'+i+'">'+it.t+'</button>'; }
  function draw(){
    var pool = rt.disp.filter(function(i){return !rt.place[i];});
    var h = '<div class="pool" id="mpool" aria-label="Items to place">'+pool.map(chip).join('')+'</div><div class="zones">';
    ex.zones.forEach(function(z){
      var inside = rt.disp.filter(function(i){return rt.place[i]===z.id;});
      h += '<div class="zone" data-z="'+z.id+'" tabindex="0" role="group" aria-label="Drop zone: '+esc(z.l)+'. Select an item, then activate this zone to place it."><h3>'+esc(z.l)+'</h3>'+inside.map(chip).join('')+'</div>';
    });
    cont.innerHTML = h+'</div>';
    wire();
  }
  function wire(){
    cont.querySelectorAll('.mitem').forEach(function(b){
      b.addEventListener('click', function(){ if(a.status==='locked')return;
        var i=parseInt(b.getAttribute('data-i'),10);
        if(rt.place[i]){ delete rt.place[i]; sel=null; draw();
          var nb=cont.querySelector('.mitem[data-i="'+i+'"]'); if(nb) nb.focus(); return; }
        if(sel===i){ sel=null; } else sel=i; markSel(); });
      b.addEventListener('dragstart', function(ev){ ev.dataTransfer.setData('text/plain', b.getAttribute('data-i')); });
    });
    cont.querySelectorAll('.zone').forEach(function(z){
      function act(ev){ if(a.status==='locked'||sel===null)return;
        if(ev.target.closest('.mitem')) return;
        var zid=z.getAttribute('data-z'); rt.place[sel]=zid; sel=null; draw();
        var nz=cont.querySelector('.zone[data-z="'+zid+'"]'); if(nz) nz.focus(); }
      z.addEventListener('click', act);
      z.addEventListener('keydown', function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); act(ev); } });
      z.addEventListener('dragover', function(ev){ ev.preventDefault(); });
      z.addEventListener('drop', function(ev){ ev.preventDefault(); if(a.status==='locked')return;
        var i=parseInt(ev.dataTransfer.getData('text/plain'),10); rt.place[i]=z.getAttribute('data-z'); sel=null; draw(); });
    });
    markSel();
  }
  function markSel(){ cont.querySelectorAll('.mitem').forEach(function(b){ b.classList.toggle('sel', parseInt(b.getAttribute('data-i'),10)===sel); }); }
  draw();
  return {
    get: function(){ return rt.place; },
    paint: function(res){ cont.querySelectorAll('.mitem').forEach(function(b){
      var i=parseInt(b.getAttribute('data-i'),10); var st=res.marks[i];
      b.classList.remove('ok','bad','miss');
      if(st==='ok')b.classList.add('ok'); else if(st==='bad')b.classList.add('bad'); else if(st==='miss')b.classList.add('miss'); }); },
    lock: function(){ cont.querySelectorAll('.mitem').forEach(function(b){b.draggable=false;}); },
    unlock: function(){}, clear: function(){ cont.querySelectorAll('.mitem,.zone').forEach(function(x){x.classList.remove('ok','bad','miss');}); }
  };
}
function rOrder(ex,cont,a){
  var rt = a.rt = a.rt||{};
  rt.seq = rt.seq || sh(ex.steps.map(function(_,i){return i;}));
  function draw(fk, fd){
    cont.innerHTML = '<div class="olist">'+rt.seq.map(function(si,k){
      return '<div class="oitem" draggable="true" data-k="'+k+'"><span class="onum">'+(k+1)+'</span><span class="ot">'+ex.steps[si]+'</span>'+

<script>
"use strict";
function kwName(id){
  var n=0;
  for(var t=0;t<THEMES.length;t++){ var ks=THEMES[t].k;
    for(var i=0;i<ks.length;i++){ n++; if(n===id) return ks[i]; } }
  return 'keyword';
}
function compute(ex, ans){
  var i, marks, ok;
  switch(ex.type){
    case 'qcm': {
      ok = typeof ans==='number' && ans>=0 && ans<ex.ch.length && !!ex.ch[ans] && ex.ch[ans].ok;
      return {ok:ok, earned: ok?1:0, correctIdx: ex.ch.findIndex(function(c){return c.ok;})};
    }
    case 'multi': {
      var sel = ans||[];
      marks = ex.ch.map(function(c,idx){ return sel.indexOf(idx)>=0 ? (c.ok?'ok':'bad') : (c.ok?'miss':null); });
      var got = ex.ch.filter(function(c,idx){ return c.ok && sel.indexOf(idx)>=0; }).length;
      return {marks:marks, earned: got/ex._n};
    }
    case 'match': {
      marks = ex.items.map(function(it,idx){
        var z = ans ? ans[idx] : null;
        if(!z) return 'miss';
        return z===it.z ? 'ok':'bad';
      });
      var g=0; marks.forEach(function(m){ if(m==='ok')g++; });
      return {marks:marks, earned: g/ex._n};
    }
    case 'order': {
      marks = ans.map(function(si,p){ return si===p?'ok':'bad'; });
      var h=0; marks.forEach(function(m){ if(m==='ok')h++; });
      return {marks:marks, earned: h/ex._n};
    }
    case 'fitb': {
      marks = ex.ans.map(function(w,s){
        if(!ans[s]) return 'miss';
        return String(ans[s]).toLowerCase()===String(w).toLowerCase() ? 'ok':'bad';
      });
      var f=0; marks.forEach(function(m){ if(m==='ok')f++; });
      return {marks:marks, earned: f/ex._n};
    }
    case 'spot': {
      var rows = ex.code || ex.log;
      var rowMarks = {}; var selr = ans||[];
      rows.forEach(function(_,ri){
        if(ex.bad.indexOf(ri)>=0) rowMarks[ri] = selr.indexOf(ri)>=0 ? 'ok':'miss';
        else rowMarks[ri] = selr.indexOf(ri)>=0 ? 'bad' : null;
      });
      var gb=0; ex.bad.forEach(function(b){ if(selr.indexOf(b)>=0) gb++; });
      return {rowMarks:rowMarks, earned: gb/ex._n};
    }
    case 'terminal': {
      marks = ex.goals.map(function(g,gi){ return ans[gi]?'ok':'miss'; });
      var gt=0; marks.forEach(function(m){ if(m==='ok')gt++; });
      return {marks:marks, earned: gt/ex._n};
    }
    case 'decision': {
      marks = ex.steps.map(function(st,si){
        if(ans[si]===null||ans[si]===undefined) return 'miss';
        return st.ch[ans[si]].ok ? 'ok':'bad';
      });
      var gd=0; marks.forEach(function(m){ if(m==='ok')gd++; });
      return {marks:marks, earned: gd/ex._n};
    }
    case 'steps': {
      marks = ex.cards.map(function(cd,ci){
        if(ans[ci]===null||ans[ci]===undefined) return 'miss';
        return cd.ch[ans[ci]].ok ? 'ok':'bad';
      });
      var gs=0; marks.forEach(function(m){ if(m==='ok')gs++; });
      return {marks:marks, earned: gs/ex._n};
    }
    case 'logview': {
      if(ex.ans.kind==='multi'){
        var sel2 = ans||[];
        var m2 = ex.ans.ch.map(function(c,idx){ return sel2.indexOf(idx)>=0 ? (c.ok?'ok':'bad') : (c.ok?'miss':null); });
        var g2 = ex.ans.ch.filter(function(c,idx){ return c.ok && sel2.indexOf(idx)>=0; }).length;
        return {marks:m2, earned: g2/ex._n};
      }
      return compute({type:'spot', bad:ex.ans.bad, _n:ex._n, code:ex.log}, ans);
    }
  }
  return {marks:[], earned:0};
}
/* ============ Check / Revise / Skip / Hint ============ */
function doCheck(){
  var oi=S.order[S.cur], ex=DATA[oi], a=S.A[oi];
  if(!R) return;
  var ans = R.get();
  var res = compute(ex, ans);
  var cost = 0;
  if(a.hint && !a.hintCharged){ cost = 0.1*ex._pts; a.hintCharged = true; }
  res.earnedFinal = Math.max(0, res.earned*ex._pts - cost);
  a.ans = ans; a.res = res; a.earned = res.earnedFinal; a.status='locked';
  R.paint(res); R.lock();
  showFb(ex, a); showExpl(true);
  $('checkBtn').disabled = true; $('reviseBtn').classList.remove('hidden');
  S.chkP = true; drawTimer(); updateNav(); updateScore();
}
function doRevise(){
  var a=S.A[S.order[S.cur]];
  if(!R || S.over) return;
  a.status='revising';
  R.unlock(); R.clear();

  $('checkBtn').disabled = false; $('reviseBtn').classList.add('hidden');
}
function doSkip(){
  var a=S.A[S.order[S.cur]];

  if(S.cur>=DATA.length-1){ submitFlow(); } else { goto(S.cur+1); }
}
function doHint(){
  var oi=S.order[S.cur], ex=DATA[oi], a=S.A[oi];
  var hb=$('hintbox');

    a.hint=true;
    if(a.status==='locked'){ a.earned=Math.max(0, a.earned-0.1*ex._pts); a.hintCharged=true; updateNav(); updateScore(); }
  }
  hb.textContent = 'Hint: '+ex.hint;
  hb.classList.remove('hidden');
  $('hintBtn').textContent='Hint used'; $('hintBtn').disabled=true;
}
function showFb(ex, a){
