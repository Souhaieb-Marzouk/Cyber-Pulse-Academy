  fb.innerHTML = '<div class="scoreline">You earned '+fmt(a.earned)+' / '+fmt(ex._pts)+' points on this exercise — '+lab+'.'+
    (a.hint?' <span class="skipnote">(includes −'+fmt(0.1*ex._pts)+' hint cost)</span>':'')+
    ' <span class="mark miss">Timer paused — review mode. Press Next to continue.</span></div>';
}
function hideFb(){ var fb=$('fb'); if(fb){ fb.classList.add('hidden'); fb.innerHTML=''; } }
function showExpl(v){ var e=$('expl'); if(e) e.classList.toggle('hidden', !v); }
/* ============ Submit & results ============ */
function submitFlow(){
  var locked=0, skipped=0;
  S.A.forEach(function(a){ if(a.status==='locked')locked++; else skipped++; });
  $('ex').innerHTML = '<div class="card"><h2>Submit the exam?</h2>'+
    '<p>You have checked <b>'+locked+'</b> of '+DATA.length+' exercises.'+(skipped>0?' <b>'+skipped+'</b> are unchecked or skipped and will be <b>excluded from scoring</b> (they count neither for nor against you).':'')+'</p>'+
    (locked===0?'<p class="skipnote">All exercises are skipped or unanswered — answer at least one exercise before submitting.</p>':'')+
    '<div class="actions"><button id="cfYes" class="btn primary" '+(locked===0?'disabled':'')+'>Finish &amp; submit</button><button id="cfNo" class="btn">Keep working</button></div></div>';
  $('cfNo').addEventListener('click', function(){ renderExercise(); });
  if(locked>0) $('cfYes').addEventListener('click', function(){ finishExam(false); });
}
function finishExam(auto){
  if(S.over) return;
  S.over = true; if(tick) clearInterval(tick);
  var answered=0;
  S.A.forEach(function(a){ if(a.status==='locked') answered++; else a.status='skipped'; });
  if(answered===0){
    $('ex').innerHTML = '<div class="card"><h2>Nothing to score</h2><p class="skipnote">Every exercise was skipped. Answer at least one exercise — the exam cannot be submitted empty.'+(auto?' (The timer has ended.)':'')+'</p><div class="actions"><button id="rt2" class="btn primary">Retake exam</button></div></div>';
    $('rt2').addEventListener('click', startExam);
    return;
  }
  var total=0, earned=0, skippedList=[];
  S.order.forEach(function(oi,pos){
    var a=S.A[oi], ex=DATA[oi];
    if(a.status!=='skipped'){ total+=ex._pts; earned+=a.earned; }
    else skippedList.push(pos+1);
  });
  earned = Math.round(earned); /* round the final total once, here */
  var pct = Math.round(earned*100/total);
  var passed = pct>=EM.pass;
  renderResults(earned,total,pct,passed,skippedList,auto);
  if(!S.reported){
    S.reported=true;
    reportScore(earned, total, pct, passed);
  }
}
function reportScore(correct, total, percent, passed){
  try{
    parent.postMessage({ type:'CYBERPULSE_SCORE', topicId:EM.topicId, score:correct, total:total, percent:percent, passed:passed }, location.origin);
  }catch(e){ /* Opened directly rather than inside the site. Nothing to report to. */ }
}
function ansText(ex, a){
  var ans=a.ans;
  switch(ex.type){
    case 'qcm': return (ans>=0&&ans!==undefined&&ans!==null)? ex.ch[ans].t : '(no answer given)';
    case 'multi': return (ans&&ans.length)? ans.map(function(i){return '• '+ex.ch[i].t;}).join('<br>') : '(nothing selected)';
    case 'match': return ex.items.map(function(it,i){ var z=ans?ans[i]:null; var zl=z? (ex.zones.find(function(zn){return zn.id===z;})||{}).l : 'not placed'; return '• '+it.t+' → '+zl; }).join('<br>');
    case 'order': return (ans||[]).map(function(si){return ex.steps[si];}).join(' <span class="mono">→</span>');
    case 'fitb': return (ans||[]).map(function(w,i){ return (i+1)+'. '+(w?w:'(empty)'); }).join('<br>');
    case 'spot': { var rows=ex.code||ex.log; return (ans&&ans.length)? ans.map(function(i){return 'Line '+(i+1)+': <code>'+esc(rows[i])+'</code>';}).join('<br>') : '(nothing clicked)'; }
    case 'terminal': return ex.goals.map(function(g,i){ return (ans&&ans[i])?'✓ '+g.label:'✗ '+g.label; }).join('<br>');
    case 'decision': return ex.steps.map(function(st,i){ var c=(ans&&ans[i]!==null&&ans[i]!==undefined)? st.ch[ans[i]].t : '(not reached)'; return 'Step '+(i+1)+': '+c; }).join('<br>');
    case 'steps': return ex.cards.map(function(cd,i){ var c=(ans&&ans[i]!==null&&ans[i]!==undefined)? cd.ch[ans[i]].t : '(no answer)'; return 'Card '+(i+1)+': '+c; }).join('<br>');
    case 'logview': {
      if(ex.ans.kind==='multi') return (ans&&ans.length)? ans.map(function(i){return '• '+ex.ans.ch[i].t;}).join('<br>') : '(nothing selected)';
      return (ans&&ans.length)? ans.map(function(i){return 'Log line '+(i+1);}).join('<br>') : '(nothing clicked)';
    }
  }
  return '';
}
function correctText(ex){
  switch(ex.type){
    case 'qcm': return ex.ch.find(function(c){return c.ok;}).t;
    case 'multi': return ex.ch.filter(function(c){return c.ok;}).map(function(c){return '• '+c.t;}).join('<br>');
    case 'match': return ex.items.map(function(it){ var zl=ex.zones.find(function(z){return z.id===it.z;}); return '• '+it.t+' → '+zl.l; }).join('<br>');
    case 'order': return ex.steps.map(function(s,i){return (i+1)+'. '+s;}).join('<br>');
    case 'fitb': return ex.ans.map(function(w,i){return (i+1)+'. '+w;}).join('<br>');
    case 'spot': { var rows=ex.code||ex.log; return ex.bad.map(function(b){return 'Line '+(b+1)+': <code>'+esc(rows[b])+'</code>';}).join('<br>'); }
    case 'terminal': return ex.goals.map(function(g,i){return (i+1)+'. '+g.label+(g.eg?' — e.g. <code>'+esc(g.eg)+'</code>':'');}).join('<br>');
    case 'decision': return ex.steps.map(function(st,i){ var c=st.ch.find(function(c){return c.ok;}); return 'Step '+(i+1)+': '+c.t; }).join('<br>');
    case 'steps': return ex.cards.map(function(cd,i){ var c=cd.ch.find(function(c){return c.ok;}); return 'Card '+(i+1)+': '+c.t; }).join('<br>');
    case 'logview': {
      if(ex.ans.kind==='multi') return ex.ans.ch.filter(function(c){return c.ok;}).map(function(c){return '• '+c.t;}).join('<br>');
      return ex.ans.bad.map(function(b){return 'Log line '+(b+1)+': <code>'+esc(ex.log[b])+'</code>';}).join('<br>');
    }
  }
  return '';
}
function renderResults(earned,total,pct,passed,skippedList,auto){
  var used = EM.minutes*60 - S.remain;
  var um = Math.floor(used/60), us = used%60;
  var verdict = passed ?
    '<div class="verdict"><div class="seal">✓</div><div class="big">PASS</div>'+
    '<p><b>'+esc(S.user||'Candidate')+'</b> has completed<br><b>'+esc(EM.cert)+' — 5.2 Source Control — '+EM.sev+'</b><br>with a score of <b>'+pct+'%</b> (pass mark '+EM.pass+'%).</p></div>' :
    '<div class="verdict fail"><div class="seal">✗</div><div class="big">FAIL — '+pct+'%</div><p>You needed '+EM.pass+'%. Retake the exam — the questions and answers reshuffle.</p></div>';
  var skippedHtml = skippedList.length ? '<p class="skipnote">Skipped and excluded from scoring: '+skippedList.map(function(n){return 'Q'+n;}).join(', ')+'. These points were removed from both your score and the maximum.</p>' : '<p class="sub">No skipped exercises.</p>';
  var themeRows = THEMES.map(function(t,ti){
    var sum=0, cnt=0;
    S.order.forEach(function(oi){
      var ex=DATA[oi], a=S.A[oi];
      if(a.status!=='locked') return;
      if(themeOf(ex)===ti){ sum += a.earned/ex._pts; cnt++; }
    });
    return '<tr><td>'+esc(t.n)+'</td><td>'+(cnt? Math.round(sum/cnt*100)+'%':'—')+'</td></tr>';
  }).join('');
  var reps = S.order.map(function(oi,pos){
    var ex=DATA[oi], a=S.A[oi];
    var lab, cls;
    if(a.status==='skipped'){ lab='<span class="badge skip">⤼ SKIPPED — excluded from scoring</span>'; }
    else if(a.earned>=ex._pts-0.001){ lab='<span class="badge posis">✓ FULL</span>'; }
    else if(a.earned>0){ lab='<span class="badge part">! PARTIAL</span>'; }
    else { lab='<span class="badge neg">✗ ZERO</span>'; }
    return '<div class="rep"><div class="rhead"><span class="qnum">Q'+(pos+1)+'</span><span class="rt">'+esc(ex.title)+'</span>'+lab+
      '<span class="rpts">'+(a.status==='skipped'?'—':fmt(a.earned)+' / '+fmt(ex._pts))+'</span></div>'+
      '<p class="yours"><span class="k">Your answer:</span><br>'+ansText(ex,a)+'</p>'+
      (a.status==='skipped'?'':'<p class="correct"><span class="k">Correct answer:</span><br>'+correctText(ex)+'</p>')+
      '<p><span class="k">Explanation:</span></p>'+ex.explain+'</div>';
  }).join('');
  $('app').innerHTML =
    '<div class="exhead"><h1>'+esc(EM.cert)+' — '+esc(EM.title)+' — results</h1></div>'+
    verdict+
    '<div class="statrow">'+
      '<div class="stat"><div class="v">'+fmt(earned)+' / '+total+'</div><div class="k">points (non-skipped)</div></div>'+
      '<div class="stat"><div class="v">'+pct+'%</div><div class="k">final score</div></div>'+
      '<div class="stat"><div class="v">'+um+':'+(us<10?'0':'')+us+'</div><div class="k">time used'+(auto?' (timer ended)':'')+'</div></div>'+
    '</div>'+
    skippedHtml+
    '<section class="card"><h2>Progress per theme</h2><table class="themetbl"><tr><th>Theme</th><th>Average score</th></tr>'+themeRows+'</table></section>'+
    '<section class="card"><h2>Detailed report — every exercise explained</h2>'+reps+'</section>'+
    '<div class="actions"><button id="retake" class="btn primary big">Retake exam</button><button id="again" class="btn">Back to intro</button></div>';
  $('retake').addEventListener('click', startExam);
  $('again').addEventListener('click', renderIntro);
  window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
/* ============ Site handshake (optional; exam works standalone) ============ */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.user = event.data.username || '';
  var u=$('uname'); if(u) u.textContent = S.user||'candidate';
});
/* ============ Init ============ */
renderIntro();
</script>
