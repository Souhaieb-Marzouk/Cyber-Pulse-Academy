<script>
window.__EXAM__ = {"meta": {"docTitle": "CompTIA Cloud+ (CV0-004) — 2.3 Workload Migrations — MEDIUM practice exam", "shortTitle": "Cloud+ 2.3 Workload Migrations — MEDIUM", "sevClass": "medium", "sevLabel": "MEDIUM", "blurb": "This exam drills planning and executing migrations to cloud environments at MEDIUM severity: real reasoning, realistic data, reachable answers.", "typesList": "scenario questions, multi-select, drag &amp; drop sorting, pair matching, timeline ordering, risk prioritization, fill-the-blanks, a terminal exercise, log analysis with a filter box, spot-the-mistake, and branching decision paths.", "secPerQ": 90, "passMark": 70}, "keywords": [["Strategies", ["Rehost (lift and shift)", "Replatform", "Refactor", "Repurchase", "Retire", "Retain", "Relocate", "IaaS / PaaS / SaaS targets"], "strategies"], ["Planning &amp; governance", ["Discovery (agent / agentless)", "Dependency mapping", "CMDB", "TCO / ROI", "Business case", "Migration waves", "Proof of concept / pilot", "Runbook", "Rollback plan", "Change management (CAB)", "Maintenance window", "RTO", "RPO", "SLA", "Baseline"], "planning"], ["Connectivity &amp; data movement", ["Site-to-site VPN", "Direct connection", "SD-WAN", "Bandwidth", "Latency", "Bulk transport appliance", "Online replication", "Hybrid migration", "WAN optimization", "Migration agent", "P2V / V2V", "Schema conversion", "Egress charges"], "movement"], ["Cutover &amp; validation", ["Big bang", "Phased", "Blue-green", "Canary", "Weighted routing", "DNS TTL", "Parallel run", "Freeze / quiesce writes", "Smoke test", "UAT", "Regression test", "Checksum / row count", "Replication lag", "Delta sync"], "cutover"], ["Risks &amp; optimization", ["Compatibility", "Vendor lock-in", "Data residency", "GDPR", "Encryption in transit / at rest", "Hardcoded IPs", "Technical debt", "Right-sizing", "BYOL / licence portability", "Idle resources", "Decommissioning", "Data sanitization", "Retention", "Dual-running", "Cost estimation", "Containerization", "Multi-cloud"], "risks"]], "exercises": [{"id": "M01", "type": "categorize", "theme": "strategies", "title": "Sort the six migration strategies", "scenario": "<p>You are the migration lead at <b>Aurora Retail Group</b>, a store chain moving 60 workloads to a public cloud platform. In the assessment workshop, the architecture board asks you to classify each application into the right migration strategy so the waves can be priced.</p>", "question": "<p>Place each application profile into the strategy it describes. Every zone is used exactly once.</p>", "zones": [["z_rehost", "Rehost (lift and shift)"], ["z_replat", "Replatform"], ["z_refac", "Refactor"], ["z_rebuy", "Repurchase"], ["z_retire", "Retire"], ["z_retain", "Retain"], ["z_reloc", "Relocate"]], "items": [["i1", "Copy the file-server VM to a cloud VM with the same specs, no changes", "z_rehost", "The application is untouched; only the host changes — an IaaS VM swap at heart. That is the definition of rehosting (lift and shift), the fastest and lowest-risk move."], ["i2", "Move the PostgreSQL database to the provider-managed managed-database service; only the connection string changes", "z_replat", "You keep the same engine but swap self-managed parts for a managed platform service (a PaaS-style move). Small change, big operational win — that is replatforming."], ["i3", "Rewrite the monolithic order service into microservices with event queues", "z_refac", "Changing the application architecture itself to gain cloud-native benefits is refactoring (re-architecting). It costs the most and takes the longest."], ["i4", "Cancel the self-hosted CRM licence and move all users to a SaaS CRM", "z_rebuy", "You buy a different product (a SaaS subscription) instead of migrating the old software. That is repurchase."], ["i5", "A reporting app was replaced last quarter; nobody has opened it in six months", "z_retire", "If the business no longer needs the application, the cheapest migration is to not migrate it at all. Retire removes cost and risk."], ["i6", "A licence-restricted app that cannot run on cloud hardware is still needed for 2 more years", "z_retain", "When licensing or hardware rules block a move and the app is still needed, you keep (retain) it on-premises and revisit it later."], ["i7", "Move VMs from the on-prem hypervisor cluster into the provider’s same-hypervisor cloud service, unchanged", "z_reloc", "Relocate moves VMs at the hypervisor layer with no conversion at all — the fastest form of migration when the same hypervisor exists in the cloud."]], "hint": "Ask one question per item: how much does the application itself change, and does the business still need it?", "explain": "<p>The “6 R” strategies describe how much an application changes during migration. Rehost changes nothing but the host. Replatform swaps small parts for managed services. Refactor changes the code architecture. Repurchase replaces the product. Retire stops using it. Retain keeps it on-prem for now. Relocate moves hypervisor VMs without conversion. Picking the right strategy per app is the core planning decision of a migration, because it sets cost, risk and timeline.</p><p><b>Focus on:</b> the difference between replatform (small component swap) and refactor (architecture change) — exams love that pair.</p>"}, {"id": "M02", "type": "single", "theme": "strategies", "title": "Choose the strategy for the licensed app", "scenario": "<p><b>BlueRiver Credit Union</b> runs a licensed fraud-detection application. Facts from the assessment: the vendor contract runs for 2 more years; the licence ties the software to specific hardware; the cloud provider cannot offer an equivalent licensed host; the app works fine and nobody plans to change it.</p>", "question": "<p>What should the migration plan do with this application?</p>", "options": [["o1", "Refactor it into containers so it can run anywhere", 0, "Containers do not remove a hardware-locked licence. Refactoring costs a lot and still breaks the licence terms — the wrong direction."], ["o2", "Rehost it on a cloud VM and accept the licence risk", 0, "Rehosting an app whose licence forbids the target hardware creates a compliance breach on day one. The assessment already ruled this out."], ["o3", "Retain it on-premises and revisit at contract renewal", 1, "When licensing blocks the move and the app is still needed, retain is the correct strategy. Revisit it when the contract renews or the vendor certifies cloud hardware."], ["o4", "Retire it immediately and absorb the risk", 0, "The app detects fraud and its contract is active — the business still needs it. Retiring it now would break a needed service."]], "hint": "The licence, not the technology, is the blocker here.", "explain": "<p>A migration strategy must respect licensing as much as technology. When a licence ties software to specific hardware that the cloud cannot provide, moving the app breaks the contract. The correct plan is to <b>retain</b> the app on-premises and revisit at renewal. Rehost would breach the licence, refactor wastes money on a working app, and retire removes a needed control.</p><p><b>Focus on:</b> licence portability — always check licence terms during assessment before choosing a strategy.</p>"}, {"id": "M03", "type": "order", "theme": "planning", "title": "Order the migration project phases", "scenario": "<p><b>Cedar Logistics</b> approved a program to migrate 60 workloads over 6 months. The PMO pinned the seven phase cards on the wall and then the wind scrambled them.</p>", "question": "<p>Put the high-level migration phases into the correct order, first to last.</p>", "items": [["Current-state assessment and discovery", "Discovery tooling (agent-based or agentless) inventories servers, versions and traffic. Everything downstream depends on knowing what you have."], ["Business case with TCO and ROI", "With inventory data you can model total cost of ownership and return on investment to win approval and a budget."], ["Proof of concept with one simple workload", "A PoC proves the landing zone, tooling and team approach on something cheap before any production risk."], ["Wave planning (group apps by dependency and risk)", "Applications are grouped into waves so tightly coupled systems move together and risk is spread over time."], ["Pilot wave with full validation", "The first real wave acts as a pilot: full runbook, full rollback plan, full validation, lessons captured."], ["Remaining waves with cutover and validation", "After the pilot proves the pattern, the rest of the waves execute with the same discipline, app group by app group."], ["Decommission legacy systems and optimize costs", "Only after everything runs in the cloud do you sanitize and retire old systems and tune costs (right-sizing, idle cleanup)."]], "hint": "You cannot plan waves before you know your dependencies — and you do not decommission anything that still has a rollback job.", "explain": "<p>A migration follows a fixed logical order: discover what you have, build the business case (TCO/ROI), prove the approach with a PoC, group workloads into waves, run a pilot wave, execute the remaining waves, and only then decommission and optimize. Skipping a step causes the classic failures: moving apps nobody mapped, or destroying source systems that were still the rollback path.</p><p><b>Focus on:</b> the PoC always comes before waves, and decommissioning is always last.</p>"}, {"id": "M04", "type": "fill", "theme": "planning", "title": "Complete the wave runbook", "scenario": "<p>This is the mandatory pre-flight paragraph of the <b>Aurora Retail Group</b> wave runbook. The intern deleted five key words while “cleaning it up”.</p>", "question": "<p>Drag the correct terms back into the blanks.</p>", "text": "Before each migration wave, the runbook requires: (1) [[1]] approval from the change advisory board; a confirmed (2) [[2]] window agreed with the business; a tested (3) [[3]] plan that can restore service within the agreed (4) [[4]]; and a (5) [[5]] test right after cutover to prove the basic service is alive.", "blanks": {"1": ["Change", "Any production-affecting move needs change management: the change advisory board (CAB) approves the window, the plan and the rollback."], "2": ["maintenance", "The migration happens inside an agreed maintenance window so the business knows when the service may wobble."], "3": ["rollback", "A rollback plan is your insurance: if cutover fails, you return to the source stack. It must be tested, not just written."], "4": ["RTO", "The recovery time objective is the maximum time to restore service. The rollback must fit inside it."], "5": ["smoke", "A smoke test is a short check of the most critical journeys (login, browse, pay) right after cutover."]}, "bank": ["Change", "maintenance", "rollback", "RTO", "smoke", "RPO", "load", "egress"], "hint": "One blank is a maximum time, not a data point. The CAB grants one of these for every change.", "explain": "<p>Every wave runbook needs CAB change approval, an agreed maintenance window, a tested rollback plan that fits the RTO (the maximum time to restore service), and a smoke test immediately after cutover. These four controls are what make a migration a managed change instead of a gamble. RPO is the distractor here: it limits data loss, not recovery time, and it belongs to the replication design, not the rollback clock.</p><p><b>Focus on:</b> RTO = time to restore; RPO = amount of data loss. Do not swap them.</p>"}, {"id": "M05", "type": "multi", "theme": "planning", "title": "Wave 1 readiness gate", "scenario": "<p>The <b>Aurora Retail Group</b> CAB will not open wave 1 until the readiness review passes. Six items sit on the review list.</p>", "question": "<p>Select every item that must genuinely be complete before the wave can proceed.</p>", "options": [["r1", "Application dependency map for every app in the wave is complete and reviewed", 1, "You cannot move apps safely without knowing what they talk to. The dependency map is the core planning artefact from discovery."], ["r2", "Hardcoded IP addresses inside the wave’s apps are documented with a fix plan", 1, "Hardcoded IPs break silently when workloads change address. They must be found and fixed or they will cause an outage after cutover."], ["r3", "Rollback plan tested successfully during the PoC", 1, "An untested rollback plan is a hope, not a plan. The PoC is where you prove it works."], ["r4", "Target network, security groups and connectivity validated end to end", 1, "Connectivity (VPN/direct connection, firewall rules, DNS) must be proven before any data moves, or wave night becomes a networking class."], ["r5", "Monitoring agents removed from source servers to save licences during transfer", 0, "Removing monitoring blinds you exactly when you need visibility most. Agents stay until decommissioning."], ["r6", "Root and administrator credentials of all servers emailed to the migration vendor", 0, "Credentials are shared through a secrets manager with expiring access — never by email. This is a security failure, not a readiness item."]], "hint": "Two items make the migration safer; two items create risk. Spot which are which.", "explain": "<p>A wave readiness gate checks the planning artefacts that prevent outages: completed dependency maps, documented hardcoded IPs with a fix plan, a rollback plan proven in the PoC, and validated target connectivity. The two distractors actively increase risk: stripping monitoring removes your eyes during the most sensitive hours, and emailing root credentials is a security incident waiting to happen.</p><p><b>Focus on:</b> readiness gates exist to prove control, not to save cost — any item that reduces visibility or security is a red flag.</p>"}, {"id": "M06", "type": "categorize", "theme": "movement", "title": "Pick the data movement method", "scenario": "<p>The <b>Cedar Logistics</b> network team must move six different datasets to the cloud. The available methods are a site-to-site VPN over the internet, a dedicated direct connection, an offline bulk transport appliance, and an online replication tool.</p>", "question": "<p>Match each dataset to the method that fits it best. Each method is used at least once.</p>", "zones": [["z_vpn", "Site-to-site VPN"], ["z_direct", "Direct connection"], ["z_appliance", "Bulk transport appliance"], ["z_replica", "Online replication tool"]], "items": [["i1", "40 TB of archived CCTV footage, no deadline, 50 Mbit/s rural WAN link", "z_appliance", "At 50 Mbit/s, 40 TB takes about 74 days of saturated WAN. Shipping an appliance turns months of transfer into days of courier time, so it is the sensible move even without a deadline."], ["i2", "8 TB warehouse database seed plus continuous delta sync, 1 Gbit/s link, hard go-live date", "z_replica", "8 TB fits on the link (about 18 hours) and the ongoing changes need constant shipping — that is exactly what an online replication tool does."], ["i3", "Steady 5 GB/day sync of user home folders over an existing encrypted tunnel", "z_vpn", "Low daily volume fits easily in an existing site-to-site VPN tunnel; no special tooling or hardware needed."], ["i4", "12 TB initial copy with ongoing changes; business demands predictable low latency and no shared-link congestion", "z_direct", "A dedicated direct connection gives private, predictable bandwidth and latency — the standard answer for large continuous flows that must not fight internet traffic."], ["i5", "60 TB of video files, 3-week deadline, best available link is 100 Mbit/s", "z_appliance", "60 TB over 100 Mbit/s is about 56 days. A three-week deadline makes shipping the only realistic option."], ["i6", "Nightly 2 GB incremental of billing records over an encrypted tunnel that already exists", "z_vpn", "Two gigabytes per night is trivial; the existing VPN tunnel already provides the encryption in transit."]], "hint": "First compute transfer time for the big datasets. If the link cannot win the race, you ship the data.", "explain": "<p>Method choice is arithmetic plus requirements. VPN suits small, steady flows. A direct connection suits large, latency-sensitive, continuous flows. A bulk appliance wins when the dataset is huge and the link is slow (weeks of transfer become days of shipping) — using both appliance seeding and later online sync is a hybrid migration. An online replication tool is required whenever changes must keep flowing until cutover.</p><p><b>Focus on:</b> compute transfer time before promising a date; bandwidth maths decides more migrations than opinions do.</p>"}, {"id": "M07", "type": "terminal", "theme": "cutover", "title": "Prove the copied dataset is intact and complete", "scenario": "<p>Wave 1 of the <b>Aurora Retail</b> migration copied one 40 GB archive, <code>wave1.tar</code>, from the source server to the cloud staging host. A sidecar checksum file <code>wave1.tar.sha256</code> was generated on the source and copied next to the archive, and the archive was extracted into the <code>wave1/</code> folder (137 files expected inside). Your current directory on the staging host is <code>/staging</code>.</p>", "question": "<p>Two checks are required before the wave can be signed off:</p><p>(1) Prove <code>wave1.tar</code> is byte-identical to the source copy using the checksum file. Command family: <code>sha256sum</code> with its check flag (<code>-c</code> or <code>--check</code>). Expected output shape: <code>wave1.tar: OK</code> or a FAILED line.</p><p>(2) Confirm the extracted <code>wave1/</code> tree really contains the expected number of files. Command family: count entries with <code>ls -1</code> piped to <code>wc -l</code>, or <code>find</code> with <code>-type f</code> piped to <code>wc -l</code>. Expected output shape: a single number.</p>", "motd": "Aurora staging host — wave 1 target. Type help for basic commands.", "prompt": "aurora@staging:/staging$", "cwd": "/staging", "lsOut": "wave1  wave1.tar  wave1.tar.sha256  notes.txt", "catMap": {"notes.txt": "Copy finished 02:14. Source archive never modified after export. — J.", "wave1.tar.sha256": "8f4b1c9e2a7d...  wave1.tar"}, "helpOut": "Basic commands: ls, cat, pwd, cd, clear. For this task: sha256sum, find and wc are installed.", "tools": ["sha256sum", "wc", "du"], "tasks": [{"name": "Verify the archive checksum", "accept": ["^sha256sum\\s+(-c|--check)\\s+(\\./)?wave1\\.tar\\.sha256$", "^sha256sum\\s+(-c|--check)\\s+/staging/wave1\\.tar\\.sha256$"], "okOut": "wave1.tar: OK", "solution": "sha256sum -c wave1.tar.sha256", "why": "Recomputes every hash listed in the checksum file and prints OK or FAILED per entry — real proof against silent corruption in transit."}, {"name": "Count the extracted files", "accept": ["^ls\\s+-1\\s+(\\./)?wave1\\s*\\|\\s*wc\\s+-l$", "^find\\s+(\\./)?wave1(\\s+-type\\s+f)?\\s*\\|\\s*wc\\s+-l$", "^find\\s+(\\./)?wave1\\s+-type\\s+f$"], "okOut": "137", "solution": "find wave1 -type f | wc -l", "why": "A checksum proves the archive, not the extract. Counting the files confirms the unpack actually produced the full tree (137 expected)."}], "hint": "Task 1: stay in /staging and let the tool read filenames from inside the checksum file (-c). Task 2: count entries in the wave1 folder and pipe the listing into wc -l.", "explain": "<p>Data integrity is proven, not assumed. <code>sha256sum -c wave1.tar.sha256</code> recomputes each hash listed in the checksum file and compares it to the local file, printing OK or FAILED per entry — this catches silent corruption during transfer. But the checksum only covers the archive; after extraction you also confirm completeness by counting the unpacked files (<code>find wave1 -type f | wc -l</code> → 137). Two different proofs for two different failure modes: corrupted bytes and missing files.</p><p><b>Focus on:</b> checksum files plus the check flag are the standard post-transfer proof, and a row/file count is the cheap second check that catches a bad extract. Both feed the migration evidence log.</p>"}, {"id": "M08", "type": "logview", "theme": "cutover", "title": "Replication lag on cutover morning", "scenario": "<p>It is cutover morning for the <b>Cedar Logistics</b> order database. The sync agent ships changes continuously to the cloud target. Cutover is scheduled in 30 minutes. The RPO for this database is 15 minutes. Use the filter box to inspect the sync log.</p>", "question": "<p>Based on the log, what is the correct call for the 10:45 cutover?</p>", "log": [["09:58:01", "INFO", "sync agent dragonfly-s1: connected to target vpc-db-target, protocol TLS1.3"], ["09:58:02", "INFO", "baseline: 412 tables, 61.4 GB, last committed tx 884219"], ["10:02:17", "INFO", "delta applied: 1,204 rows, lag 12s"], ["10:09:44", "WARN", "source disk io_wait 38% (threshold 25%) on db-src-01"], ["10:15:02", "INFO", "delta applied: 5,881 rows, lag 45s"], ["10:21:30", "WARN", "lag 2m10s — above soft threshold 60s"], ["10:23:05", "ERROR", "source io_wait 61%; storage array retrying writes (4 events)"], ["10:28:12", "INFO", "delta applied: 11,902 rows, lag 3m40s"], ["10:33:51", "WARN", "lag 4m55s — nightly report job competing for source I/O"], ["10:39:02", "ERROR", "lag 6m05s — above hard threshold 300s, alert INC-4471 opened"], ["10:41:15", "INFO", "agent healthy; network 0.2% loss; bottleneck judged source-side I/O"]], "q": {"type": "single", "options": [["a1", "Proceed at 10:45; any remaining changes will sync after go-live", 0, "Cutting over with 6+ minutes of lag and a source I/O problem means the target is missing recent transactions — silent data loss beyond the 15-minute RPO risk if the source keeps failing."], ["a2", "Delay cutover, fix the source I/O bottleneck (stop the competing report job), and resync until lag is inside the RPO", 1, "The log points at source-side I/O starvation (io_wait 61%, competing nightly report). The correct move is to remove the bottleneck, let lag fall inside the RPO, then cut over."], ["a3", "Delete the sync agent and restart the full 61 GB seed from scratch", 0, "The agent is healthy and the network is clean. A full reseed throws away hours of work and does not fix the source I/O cause."], ["a4", "Lower the DNS TTL to 300 to make the lag drop faster", 0, "DNS TTL controls how long resolvers cache the old address. It has no effect on replication lag at all."]]}, "hint": "Filter for WARN and ERROR lines and read what the bottleneck is judged to be. Compare the lag number with the RPO.", "explain": "<p>Replication lag is the delay between a change on the source and the same change landing on the target. Your RPO (maximum tolerable data loss) is 15 minutes, but the trend matters: lag grew from 12 seconds to over 6 minutes because the source disk is starved (io_wait 61%) while a report job competes for I/O. Cutting over now would ship a target that is minutes behind and falling further. The professional call: remove the competing job, let lag recover inside the RPO, then cut over. Reseeding wastes work, and DNS TTL has nothing to do with lag.</p><p><b>Focus on:</b> lag must be inside the RPO at freeze time, and always fix the bottleneck the log names.</p>"}, {"id": "M09", "type": "spot", "theme": "risks", "title": "Find the dangerous firewall lines", "scenario": "<p>This security-group ruleset will guard the <b>Aurora Retail</b> staging subnet during wave 1. The migration agent subnet is 10[.]20[.]31[.]0/24; the bastion subnet is 10[.]20[.]30[.]0/24.</p>", "question": "<p>Click every line that creates an unacceptable risk and must be fixed before the wave.</p>", "lines": ["# sg-migration-staging — wave 1 target subnet", "allow tcp 22   from 10[.]20[.]30[.]0/24   # bastion subnet only", "allow tcp 443  from 10[.]20[.]31[.]0/24   # migration agent subnet", "allow tcp 445  from 0[.]0[.]0[.]0/0       # SMB file copy, opened wide", "allow tcp 3389 from 10[.]20[.]30[.]0/24   # admin RDP via bastion", "deny  all      from any                   # default deny inbound", "# logging: enabled, forwarded to the SIEM", "# outbound: allow all, no inspection"], "bad": [3, 7], "whys": {"3": "SMB (445) open to the entire internet (0[.]0[.]0[.]0/0) is an open invitation — ransomware groups scan for it constantly. Scope it to the migration agent subnet or use a different transfer method.", "7": "Unrestricted uninspected outbound during a migration lets a compromised host exfiltrate data or download tools. Restrict outbound to the needed destinations (update mirrors, agent endpoints) with TLS inspection."}, "okWhys": {"0": "A comment header is harmless.", "1": "SSH from the bastion subnet only is correct admin practice.", "2": "TLS 443 from the migration agent subnet is exactly the intended flow.", "4": "RDP reachable only from the bastion follows the same good pattern.", "5": "Default-deny inbound is the correct baseline.", "6": "Logging to the SIEM gives you the evidence trail you will want during cutover."}, "hint": "One line talks to the whole internet. One line lets anything leave. Both are in the traffic rules.", "explain": "<p>Temporary migration rules are temporary attack surface. Line 4 exposes SMB to the entire internet — the single most scanned Windows service — and line 8 allows uninspected outbound to anywhere, which is how a compromised staging host exfiltrates the very data you are migrating. Everything else follows good practice: admin ports sourced from the bastion subnet, agent traffic scoped to its own subnet, default-deny inbound, and logging. Fix both lines before the wave, and diarize the temporary rules so they die with the migration.</p><p><b>Focus on:</b> 0[.]0[.]0[.]0/0 as a source (or missing outbound control) during transition windows — transition states are attacker-favourite windows.</p>"}, {"id": "M10", "type": "branch", "theme": "cutover", "title": "Cutover night for the customer portal", "scenario": "<p>It is cutover night for the <b>Aurora Retail</b> customer portal. Maintenance window 01:00–05:00. RTO is 2 hours. The plan: weighted DNS routing with a canary step. The approved strategy rejected a big bang flip (all traffic at once) in favour of graduated shifting.</p>", "question": "<p>Work through the four decisions in order. Each wrong choice shows you the consequence it would have caused.</p>", "nodes": [{"q": "00:30 — the final delta sync is about to run. The last sync must capture a stable state. What do you do first?", "opts": [["Freeze writes on the source database, then let the delta finish", 1, "Correct. Freezing (quiescing) writes gives the final delta a stable end state — no transactions in flight, nothing lost."], ["Shut down the source servers immediately to force the sync to finish", 0, "The agent loses its source mid-flight. The delta ends dirty, and restart time burns your window. Data loss risk: high."], ["Cut DNS to the cloud stack now — the sync will catch up", 0, "Users start creating orders on the target while it is still minutes behind. Split-brain and support tickets before midnight."]]}, {"q": "02:10 — delta finished. Before any traffic moves, what proves the target actually works?", "opts": [["Run the smoke test: login, catalogue browse, checkout in sandbox mode", 1, "Correct. The smoke test proves the critical journeys on the real target. It is the cutover gate, not a formality."], ["Skip it — UAT next week will catch problems", 0, "UAT next week does not protect tonight’s customers. You would move real traffic onto an unproven stack."], ["Compare the VM sizes against the sizing sheet", 0, "Identical specs prove nothing about behaviour. A correctly sized stack can still fail its first login."]]}, {"q": "02:40 — smoke tests pass. How do you move the traffic?", "opts": [["Shift 5% of traffic to the cloud stack (canary), watch, then step up 25 / 50 / 100", 1, "Correct. The canary step catches real-user problems on 5% of customers instead of 100%. This is why the plan chose weighted routing."], ["Do a full blue-green flip: point everything at the green stack in one move", 0, "A blue-green flip skips the canary evidence step and puts 100% of users on the new stack at once — the risk profile this plan explicitly rejected. Weighted shifting keeps the ramp controlled."], ["Flip 100% at once — the smoke test passed, so it is safe", 0, "That is the big bang the plan explicitly rejected. One missed defect now hits every customer at once."], ["Email customers a new URL and ask them to switch", 0, "You cannot control when users click an email. You would run two stacks by accident for days."]]}, {"q": "03:15 — checkout error rate on the cloud stack is 8% and climbing. Window closes 05:00, RTO is 2 hours. Decision?", "opts": [["Trigger the rollback plan: shift routing back to the source, unfreeze writes, inform stakeholders", 1, "Correct. 8% checkout failures threaten revenue; the window is too short for open-ended debugging. A rehearsed rollback inside the RTO is the disciplined outcome — and it is why the plan exists."], ["Ignore it — error rates usually settle by morning", 0, "Checkout is revenue. Hoping is not a control, and the RTO clock does not care about optimism."], ["Extend the window quietly and keep debugging without telling anyone", 0, "The CAB owns the window. Extending it unilaterally breaks change management and hides a customer-impacting incident."]]}], "hint": "Two decisions protect data, two decisions protect customers. Freeze and validate before you move anything; measure and roll back when metrics break.", "explain": "<p>A cutover runbook is a chain of gates: freeze writes so the final delta is complete, smoke-test the target before any customer touches it, shift traffic gradually (canary via weighted routing) so defects are contained, and roll back when the error budget breaks — a rehearsed rollback inside the RTO is a success of planning, not a failure of the team. Skipping any gate converts a controlled change into an incident.</p><p><b>Focus on:</b> the gate order (freeze → delta → validate → shift → monitor → rollback trigger) and who owns the decision to roll back.</p>"}, {"id": "M11", "type": "multi", "theme": "risks", "title": "Build the 3-year TCO model", "scenario": "<p>The CFO challenged the <b>Aurora Retail</b> migration business case: “Your cloud quote is missing costs.” You must rebuild the 3-year total cost of ownership (TCO) model properly.</p>", "question": "<p>Select every cost item that genuinely belongs in the 3-year TCO for the migrated estate.</p>", "options": [["c1", "Cloud egress charges for data leaving the cloud (backups pulled on-prem, cross-region copies)", 1, "Egress is the classic forgotten line: every gigabyte leaving the cloud is billed. Reporting tools that pull data back on-prem can dwarf compute costs."], ["c2", "Dual-running costs while source and cloud both run during the migration", 1, "During migration you pay twice — old stack and new stack — often for months. Real programs budget this dual-running premium."], ["c3", "Storage growth over the 3 years, priced at cloud rates", 1, "Cloud storage is billed monthly and grows with the business. A 3-year model must project growth, not just today’s footprint."], ["c4", "Migration labour, tooling licences and third-party help", 1, "People and tooling are real migration costs: assessment, wave execution, validation, staff training."], ["c5", "Licence model change: BYOL versus provider-included licences per workload", 1, "Moving changes licence economics. Some licences port (BYOL), some do not — the delta belongs in the model."], ["c6", "The price of the servers the company bought 4 years ago", 0, "That is a sunk cost — already spent, unchanged by any decision you make now. TCO compares future scenarios; sunk costs never enter it."], ["c7", "The electricity bill of the entire company office building", 0, "Corporate facilities overhead is not a workload cost. Only the marginal data-centre power attributable to the workloads belongs in a TCO comparison."]], "hint": "Two distractors fail basic accounting: one is sunk, one is not attributable to the workloads.", "explain": "<p>An honest TCO includes the forward costs that change with the decision: egress, dual-running during the migration, projected storage growth, migration labour and tooling, and the licence model delta (BYOL vs provider-included). The two distractors are accounting traps: the 4-year-old servers are a sunk cost that no decision can recover, and whole-building electricity is not attributable to the workloads. A model padded with those numbers both overstates and misdirects — and hidden real costs (egress above all) are why migrations overshoot budgets.</p><p><b>Focus on:</b> egress and dual-running — the two costs real programs most often forget.</p>"}, {"id": "M12", "type": "single", "theme": "planning", "title": "Meet the RPO for the order database", "scenario": "<p><b>Cedar Logistics</b> set an RPO of 15 minutes for the order database during migration: after any failure, no more than 15 minutes of transactions may be lost.</p>", "question": "<p>Which data-protection approach during the migration satisfies this RPO?</p>", "options": [["o1", "A weekly full backup copied to the cloud every Sunday", 0, "A weekly copy tolerates losing up to 7 days of data. That is an RPO of 7 days, not 15 minutes."], ["o2", "Asynchronous replication with a measured and alarmed lag of 10 minutes", 1, "With lag held at 10 minutes, a failure loses at most ~10 minutes of transactions — inside the 15-minute RPO. Measuring and alarming the lag is what makes the claim real."], ["o3", "A nightly backup that runs at 23:00", 0, "A failure at 22:59 loses nearly 24 hours. Nightly backups give an RPO of up to 24 hours."], ["o4", "A file-level copy of the data folder every 6 hours", 0, "Six-hour copies tolerate losing up to 6 hours — 24 times the tolerated loss."]], "hint": "RPO is a maximum data-loss budget. Which option’s worst case fits inside 15 minutes?", "explain": "<p>RPO is the maximum acceptable data loss measured in time. The only option whose worst case fits a 15-minute RPO is replication with a measured 10-minute lag — and the measurement plus alerting matter, because unmeasured lag is a guess. Weekly, nightly and 6-hour copies all tolerate far more loss than the business accepted. During migrations the RPO drives the sync design: it is why continuous (or near-continuous) replication is standard for tier-1 databases.</p><p><b>Focus on:</b> pair every RPO with a lag measurement and an alarm; pair every RTO with a tested rollback.</p>"}, {"id": "M13", "type": "order", "theme": "cutover", "title": "Weighted-routing cutover, step by step", "scenario": "<p><b>BlueRiver Credit Union</b> will cut over its internet banking portal using weighted DNS routing with a canary step. The steps were written on cards and dropped.</p>", "question": "<p>Order the cutover steps correctly, first to last.</p>", "items": [["Lower the DNS TTL from 3600 to 300, 24 hours before cutover", "Resolvers cached the old record for up to an hour. Lowering the TTL a full old-TTL period before the switch lets stale caches expire in time."], ["Run the final delta sync and freeze writes on the source", "Traffic cannot switch until the target holds every transaction. Freeze writes so the last delta has a stable end state."], ["Shift 5% of traffic to the cloud stack and watch error rate and latency", "The canary step: a small share of real users exercises the stack while the on-call team watches the dashboards."], ["Step to 25%, then 50% as metrics stay inside the SLA", "Graduated shifting contains defects: a problem at 25% touches a quarter of users, not everyone."], ["Shift 100% and keep the source stack frozen as instant rollback", "Full cutover — but the old stack stays warm until the soak period proves stability."], ["After 48 hours stable, raise the TTL back to 3600 and decommission the old stack", "Restoring the TTL cuts DNS lookup traffic; decommissioning follows only after the agreed soak period with sign-off."]], "hint": "Cache lifetimes must shrink before anyone can switch quickly — and nothing is destroyed while rollback is still possible.", "explain": "<p>Weighted-routing cutovers lean on DNS: caches must be shortened (TTL down one old-TTL period early), data must be complete (freeze plus final delta), and traffic must move in canary steps (5 → 25 → 50 → 100%) so defects are contained while metrics stay inside the SLA. The old stack stays frozen-but-warm as the rollback path, and only a stable soak period earns it the decommission order.</p><p><b>Focus on:</b> why the TTL change happens a day early — cached records ignore your plans until they expire.</p>"}, {"id": "M14", "type": "categorize", "theme": "movement", "title": "Match each migration tool to its job", "scenario": "<p>The <b>Cedar Logistics</b> migration toolbox is being documented for the runbook. New team members keep confusing the tools.</p>", "question": "<p>Place each tool description under the job it performs.</p>", "zones": [["z_schema", "Schema / code conversion"], ["z_sync", "Data sync / replication agent"], ["z_wan", "WAN optimization"], ["z_cost", "Cost estimation / TCO tool"]], "items": [["i1", "Converts Oracle PL/SQL procedures to PostgreSQL-compatible code before a database migration", "z_schema", "Changing database engines is a heterogeneous migration; the schema and procedural code must be converted, and this tool automates that translation."], ["i2", "Installs on source hosts and continuously ships changed blocks to the cloud target", "z_sync", "That is the migration agent’s job: continuous (online) replication of changes so the target stays close behind the source until cutover."], ["i3", "Compresses and deduplicates traffic so a 100 Mbit/s link carries far more usable data", "z_wan", "WAN optimization squeezes more effective throughput out of a limited link — a common helper when bandwidth, not latency, is the constraint."], ["i4", "Models 3-year spend for reserved versus on-demand capacity after migration", "z_cost", "Comparing pricing models over time is exactly what a cost estimation / TCO tool does for the business case and post-migration planning."], ["i5", "Maps MySQL tables and views to the target engine and flags unsupported features", "z_schema", "Feature mapping and unsupported-feature flags are core schema-conversion work — do it before, not during, the load."], ["i6", "Keeps source and target databases consistent during a long window by shipping transaction logs", "z_sync", "Transaction-log shipping is the mechanism behind near-zero-lag online replication; the agent reads and forwards those logs continuously."]], "hint": "Two tools change what the data looks like, one tool moves it, one tool prices it.", "explain": "<p>Migration tooling splits into four jobs. Schema/code conversion supports heterogeneous migrations (engine or platform changes). Sync agents perform online replication — often by shipping transaction logs — keeping the target within the RPO until cutover. WAN optimization raises effective bandwidth on constrained links. Cost tools turn sizing decisions into 3-year TCO numbers. Knowing which job a tool does prevents the classic mistake of fixing a bandwidth problem with a conversion tool.</p><p><b>Focus on:</b> heterogeneous (engine changes) versus homogeneous (same engine) database migration — only the first needs heavy schema conversion.</p>"}, {"id": "M15", "type": "fill", "theme": "risks", "title": "Complete the migration security policy", "scenario": "<p><b>Aurora Retail</b> is writing the security section of its migration policy. Legal marked four sentences as mandatory. The drafting intern left blanks.</p>", "question": "<p>Fill every blank with the correct term from the word bank. Some bank words are decoys.</p>", "text": "Customer PII from EU retail operations must respect data (1) [[1]] rules under (2) [[2]]. While data crosses the public internet during transfer, it must be protected with (3) [[3]] 1.2 or higher (encryption in transit). Staging buckets must be (4) [[4]] at rest with customer-managed keys, and the cloud contract must include a signed data (5) [[5]] agreement.", "blanks": {"1": ["residency", "Data residency rules say where data about a population may physically live. EU PII must stay in approved regions."], "2": ["GDPR", "The GDPR is the EU regulation that drives these residency and processing requirements for personal data."], "3": ["TLS", "TLS is the standard protocol for encryption in transit. Versions below 1.2 are considered unsafe today."], "4": ["encrypted", "Encryption at rest protects the data if a bucket or disk is misconfigured or stolen — a baseline control during migration staging."], "5": ["processing", "A data processing agreement (DPA) formally defines how the cloud provider may handle personal data — required when a processor touches regulated data."]}, "bank": ["residency", "GDPR", "TLS", "encrypted", "processing", "retention", "egress", "anonymous"], "hint": "One blank is a regulation, one is a protocol, one is a contract. Two blanks are nouns describing where data lives and how it is stored.", "explain": "<p>Migration policy must carry compliance into the moving process: EU personal data is governed by the GDPR, so residency rules decide which regions may hold it, TLS 1.2+ protects it in transit, encryption at rest (customer-managed keys) protects staged copies, and a signed data processing agreement makes the provider’s handling lawful. The decoys are real cloud words but wrong slots: retention is about how long data is kept, egress is a cost term, and anonymising production PII mid-migration is not what the contract clause means.</p><p><b>Focus on:</b> residency (where), GDPR (which law), TLS (in transit), encrypted at rest (at rest), DPA (with whom).</p>"}, {"id": "M16", "type": "spot", "theme": "planning", "title": "Spot the mistakes in the migration plan", "scenario": "<p>This is the draft step list for the <b>Cedar Logistics</b> wave-2 plan. A junior author wrote two steps that contradict the runbook.</p>", "question": "<p>Click every step that is wrong and must be corrected before the plan is approved.</p>", "lines": ["1. Discover all applications and build the dependency map", "2. Confirm every app in wave 2 has a tested rollback plan", "3. Raise the DNS TTL to 86400 one hour before cutover", "4. Take a full backup and verify it restores", "5. Notify stakeholders of the maintenance window and freeze schedule", "6. After cutover, wipe the source servers the same night to save a day of dual-running"], "bad": [2, 5], "whys": {"2": "Raising the TTL to 86400 makes things worse, not better: caches would hold the old address for 24 hours. You LOWER the TTL well before cutover (and raise it back afterwards).", "5": "Same-night wiping destroys the rollback path while the ink on the cutover is still wet. Decommission only after the soak period, retention checks and sign-off."}, "okWhys": {"0": "Discovery and dependency mapping are always step one.", "1": "A tested rollback plan is a mandatory pre-flight item.", "3": "Backup plus a restore test is the last-resort safety net; verifying the restore is what makes it real.", "4": "Stakeholder notification and the freeze schedule belong in every cutover plan."}, "hint": "One mistake is about cache timing (which direction should the TTL move?). One mistake destroys your insurance the same night.", "explain": "<p>Two steps would break the cutover. Raising the DNS TTL to 86400 right before cutover locks users to the old address for up to a day — TTL must go DOWN (e.g., to 300) one old-TTL period in advance, then be restored after stability. Wiping source servers the same night deletes the rollback path and any data that should be retained; decommissioning requires the soak period, retention/legal review, sanitization per policy, and sign-off. The other steps — discovery first, tested rollback, verified backup, stakeholder notice — are exactly right.</p><p><b>Focus on:</b> TTL moves down before cutover and up after; decommissioning is a gated process, never a same-night cleanup.</p>"}, {"id": "M17", "type": "single", "theme": "planning", "title": "Choose the wave-1 pilot application", "scenario": "<p>The <b>Cedar Logistics</b> steering group must pick the first application for the pilot wave. Four candidates with their assessment notes:</p>", "question": "<p>Which application should migrate first in wave 1?</p>", "options": [["o1", "Core payments platform — 14 downstream dependencies", 0, "Highest-dependency, highest-impact system. Pilots never start here; if it fails, the whole program loses credibility."], ["o2", "Internal wiki — one dependency, low risk, well-documented rollout", 1, "A pilot should be genuinely representative but low risk: few dependencies, tolerant users, easy rollback. The wiki lets the team rehearse the full runbook safely."], ["o3", "Warehouse scanners — hard real-time requirement of 5 ms", 0, "A hard real-time constraint makes this app a poor first test: any latency surprise stops the warehouse floor."], ["o4", "Legacy mainframe billing — 30-year-old code, no documentation, technical debt everywhere", 0, "Undocumented legacy code with heavy technical debt is the hardest possible move — it belongs in a late wave after tooling and knowledge have matured."]], "hint": "The pilot proves the process, not the program’s courage. Low risk, real representativeness.", "explain": "<p>Wave planning sorts applications by dependency count, risk and business tolerance. The pilot (wave 1) should be a real but forgiving application: the internal wiki has one dependency, tolerant users and an easy rollback, so the team can rehearse the full process and capture lessons. Payments (14 dependencies), real-time scanners (hard latency) and undocumented legacy (technical debt) all carry failure costs no pilot should shoulder.</p><p><b>Focus on:</b> the phased approach exists precisely so risk enters the migration last, not first.</p>"}, {"id": "M18", "type": "logview", "theme": "movement", "title": "The transfer that will not finish in time", "scenario": "<p><b>Cedar Logistics</b> must move 2 TB of image assets in a 1-day window over a 100 Mbit/s WAN link. The migration agent log for the first hours:</p>", "question": "<p>At the measured rate the transfer needs about 2.5 days. What is the correct next step?</p>", "log": [["01:04:11", "INFO", "agent mig-a2 started, source /assets/2024, target oss://wave2-assets"], ["01:04:12", "INFO", "link probe: 100 Mbit/s down / 40 Mbit/s up, rtt 38 ms, loss 0.1%"], ["01:10:33", "INFO", "throughput 9.1 MB/s (72% of link), 148 files done"], ["01:58:20", "WARN", "throughput dropped to 3.2 MB/s — backup window opened at 01:00"], ["02:05:47", "WARN", "packet loss 3.1% during backup window; 412 retransmits"], ["02:44:09", "INFO", "throughput recovered to 8.7 MB/s after backup window closed 02:30"], ["03:15:52", "INFO", "progress: 214 GB of 2048 GB, eta at current mix ≈ 2.4 days"], ["03:16:03", "DEBUG", "cpu on agent 21%, memory 34%, disk queue 0.3 — agent not the bottleneck"], ["03:16:30", "INFO", "note: assets compress at ~3:1 (test sample)"]], "q": {"type": "single", "options": [["o1", "Replace the migration agent VM with a bigger instance", 0, "The log shows the agent idle at 21% CPU — it is not the bottleneck. A bigger agent changes nothing on a saturated 100 Mbit/s link."], ["o2", "Schedule transfers outside the backup window and enable the WAN optimizer’s compression for the asset traffic", 1, "The link is shared with the backup job (loss and slowdown track its window), and the data compresses 3:1. Avoiding the clash and compressing directly raise effective throughput on the same link."], ["o3", "Turn off TLS on the transfer to save encryption overhead", 0, "Encryption overhead is not the constraint (the agent is mostly idle), and disabling TLS removes encryption in transit — a policy violation for any production data."], ["o4", "Split the data across 40 parallel upload tools to multiply the link", 0, "Forty flows still share one 100 Mbit/s pipe and add congestion and retransmits. You cannot out-parallel a fixed physical link."]]}, "hint": "Read the DEBUG line: what is NOT the bottleneck? Then look at what else uses the link between 01:00 and 02:30, and the compression note.", "explain": "<p>Bandwidth problems are diagnosed, not guessed. The log shows the agent healthy (21% CPU), throughput collapsing exactly during the 01:00 backup window (loss 3.1%, heavy retransmits), and a 3:1 compression ratio on the payload. The correct response: stop competing with the backup window and let WAN optimization compress the stream — same link, roughly triple the effective capacity. (An SD-WAN overlay could also shape the competing flows, but it does not fix a shared-window clash on its own.) A bigger agent fixes a compute bottleneck (not present), removing TLS breaks security for no gain, and parallelism cannot exceed the pipe.</p><p><b>Focus on:</b> find the bottleneck in the evidence (link, agent, or source) before spending money.</p>"}, {"id": "M19", "type": "multi", "theme": "cutover", "title": "Define pilot success criteria", "scenario": "<p>The <b>Aurora Retail</b> pilot wave ran for two weeks, with the old and new stacks running in parallel for output comparison. The steering group now argues about what “success” means.</p>", "question": "<p>Select every criterion that legitimately belongs in the pilot success definition.</p>", "options": [["s1", "Smoke tests and UAT scenarios pass on the cloud stack", 1, "Smoke tests prove the critical journeys; UAT proves real users can do real work. Both are baseline success evidence."], ["s2", "Measured latency from the main office stays inside the SLA target", 1, "The SLA is the contract with the business. If latency busts it, the migration has failed regardless of feature parity."], ["s3", "Checksums and row counts prove migrated data matches the source", 1, "Data integrity is provable: checksums (files/tables) plus row counts are the standard evidence that nothing was lost or altered."], ["s4", "The rehearsed rollback never needed more than the agreed RTO during the drill", 1, "You test rollback during the pilot precisely to measure it against the RTO. Passing that test is a success criterion."], ["s5", "The monthly cloud invoice is exactly identical to the old data-centre invoice", 0, "Costs will differ — that is the point of migrating. Success means costs match the forecast (no surprises), not that they are identical."], ["s6", "All 60 applications migrated during the pilot week", 0, "The pilot is a small rehearsal, typically a handful of workloads. Migrating everything in a week is a big bang, not a pilot."], ["s7", "The team used the most expensive instance types to guarantee performance", 0, "Buying performance instead of measuring it hides right-sizing problems and burns budget. Performance must be evidenced against the baseline."]], "hint": "Three criteria are evidence (tests, SLA, integrity, rollback). The rest are either wrong-headed or describe a different strategy.", "explain": "<p>Pilot success is defined by evidence: passing smoke tests and UAT, latency inside the SLA, data integrity proven by checksums and row counts, and a rollback drill that fit the RTO. The two-week parallel run exists to gather exactly this comparison data. The distractors redefine success badly: identical invoices (costs are supposed to change — the forecast is the reference), migrating all 60 apps in a week (that is big bang, the opposite of a pilot), and buying oversized instances (that masks the performance data the pilot exists to collect).</p><p><b>Focus on:</b> every success criterion should be measurable against a baseline or an agreed target.</p>"}, {"id": "M20", "type": "categorize", "theme": "cutover", "title": "Name that validation activity", "scenario": "<p>Post-migration validation at <b>BlueRiver Credit Union</b> uses four named activities. The test schedule lists them by description only.</p>", "question": "<p>Place each description under the activity it defines.</p>", "zones": [["z_smoke", "Smoke test"], ["z_uat", "UAT"], ["z_reg", "Regression test"], ["z_perf", "Performance / baseline test"]], "items": [["i1", "Right after cutover: login, search, one transfer — five minutes, prove the service is alive", "z_smoke", "A smoke test is a short, critical-journey check immediately after cutover. Its only job is to catch a dead service fast."], ["i2", "Business users run the real month-end close in the cloud stack and sign off the numbers", "z_uat", "User acceptance testing puts real users on real scenarios; their sign-off is the business accepting the migration."], ["i3", "Replay the 200 automated interface tests to catch anything the move broke between systems", "z_reg", "Regression tests re-prove existing behaviour. Interfaces are where migrations silently break integrations."], ["i4", "Compare page-load and query times against the numbers captured before the move", "z_perf", "A performance test against the pre-migration baseline answers the only fair question: is it as fast as before?"], ["i5", "Five-minute check: app starts, homepage renders, database accepts writes", "z_smoke", "Start, render, write — the minimal liveness set. Textbook smoke test."], ["i6", "Finance confirms the trial balance matches last month to the cent", "z_uat", "Domain experts validating real outputs (a trial balance) is acceptance testing by the people who own the numbers."]], "hint": "Smoke = alive, UAT = users accept, regression = nothing broke, performance = as fast as the baseline.", "explain": "<p>Validation is a layered suite. Smoke tests give a fast alive/dead verdict right after cutover. UAT lets real users accept the result on real scenarios. Regression suites catch broken interfaces that nobody manually tested. Performance tests compare against the pre-migration baseline, because “the cloud feels slower” is only meaningful next to numbers. Skipping a layer shows up later as an angry user email, a broken integration, or a slow month-end.</p><p><b>Focus on:</b> the baseline must be captured BEFORE migration — you cannot compare against numbers you never took.</p>"}, {"id": "M21", "type": "branch", "theme": "cutover", "title": "Wave 2 sync failure at 04:00", "scenario": "<p>Wave 2 at <b>Cedar Logistics</b> moves three apps tonight. At 04:00, the sync agent for the CMS app (400 GB) stops at 68%. Go-live is 06:00.</p>", "question": "<p>Work the four decisions in order.</p>", "nodes": [{"q": "04:00 — the CMS sync stopped at 68%. What is your first action?", "opts": [["Read the agent logs and check the source host (disk space, I/O, service state)", 1, "Correct. Diagnose before you act: logs plus source health tell you whether this is disk, network or agent — each has a different fix."], ["Delete the partial target copy and restart the full 400 GB from zero", 0, "A 400 GB reseed takes hours you do not have — and you have not even identified the cause yet."], ["Cut over at 68% and sync the rest after go-live", 0, "Go-live on a 68% copy corrupts the app and breaches the RPO. Never."]]}, {"q": "04:20 — cause found: the backup job’s snapshot filled the source disk, starving the agent’s temp space. You free space and resume. What must also happen?", "opts": [["Update the runbook: add a pre-wave check for temp space and backup-snapshot overlap", 1, "Correct. A cause found is a runbook improvement owed to every future wave. That is how migration programs mature."], ["Nothing — the fix itself is enough", 0, "Without the runbook change, wave 3 rediscovers this at 04:00 with the same panic."], ["Relax the RPO to 24 hours so this cannot recur", 0, "The RPO is a business requirement, not a knob for operator convenience."]]}, {"q": "05:00 — resync is running, lag is 4 minutes and falling. Who hears from you?", "opts": [["A status update to stakeholders: on track, lag 4 min, go/no-go decision at 05:45", 1, "Correct. Short, factual, with the decision time. Stakeholders plan around the go/no-go, so give them the data and the moment."], ["Silence until it is done — bad news travels last", 0, "Silence breeds escalation: someone senior will call the CIO, and then you are explaining silence instead of progress."], ["Declare the migration failed and cancel all remaining waves", 0, "One agent stall with a fix in flight is not a failure. Cancelling the program is a decision for evidence, not adrenaline."]]}, {"q": "05:45 — lag is 30 seconds and shrinking. What is the go decision?", "opts": [["Go: freeze writes, run the final delta, smoke test, then switch", 1, "Correct. A shrinking 30-second lag means the final delta at freeze will be tiny. Follow the gates and go."], ["Wait until the lag reads exactly zero for 30 minutes", 0, "The lag only reaches zero when writes freeze — waiting for pre-freeze zero misunderstands how delta sync converges."], ["Go, but skip the smoke test to bank 10 minutes", 0, "The smoke test is the gate that proves the service is alive. Skipping your last checkpoint to save ten minutes is how you buy an outage instead."]]}], "hint": "Diagnose before touching; write the lesson into the runbook; communicate with numbers and a decision time; let the freeze do the converging.", "explain": "<p>Migration nights are managed, not heroic. Diagnose from logs and host health before destructive action; when a root cause is found, it becomes a runbook check so no future wave repeats it; stakeholders get short factual updates anchored to the go/no-go time; and the go decision follows the gates — freeze, final delta, smoke test, switch. A shrinking lag is normal before freeze; the final delta at freeze is what converges the data.</p><p><b>Focus on:</b> runbook feedback loops — every incident should leave the runbook stronger.</p>"}, {"id": "M22", "type": "single", "theme": "risks", "title": "Retire the old file servers properly", "scenario": "<p>Wave 1 at <b>Aurora Retail</b> has run in the cloud for 90 days. Six old file servers must now leave. Corporate policy has a data-retention schedule and a disposal standard.</p>", "question": "<p>What is the correct sequence for retiring these servers?</p>", "options": [["o1", "Wipe all disks immediately, then check the retention schedule", 0, "Wiping first can destroy data the retention schedule still requires — an irreversible compliance breach. Retention is checked BEFORE any sanitization."], ["o2", "Confirm retention and legal-hold requirements are met, sanitize data per the disposal standard, then decommission and dispose", 1, "Retention and legal holds decide what must be kept; policy-grade sanitization protects the data; only then do the servers leave. This is the gated, documented order."], ["o3", "Sell the servers with the disks included to recover budget", 0, "Selling disks without certified sanitization leaks company data. Disposal must follow the standard, with certificates, not the second-hand market."], ["o4", "Move the servers to a storage cupboard and revisit next year", 0, "Undocumented, unsanitized machines still holding data are a growing risk and an audit finding — not a plan."]], "hint": "The order matters: obligations first, destruction second, paperwork always.", "explain": "<p>Decommissioning is a gated process: first confirm the retention schedule and any legal holds (so required data is exported and archived), then sanitize the data per the disposal standard, and only then decommission and dispose — with certificates kept as evidence. Wiping first risks destroying data the law still requires; selling or hoarding unsanitized machines leaks data. Retention, sanitization, disposal: that order is examinable and auditable.</p><p><b>Focus on:</b> never destroy data before checking retention and legal hold — reversibility ends at the first wipe.</p>"}, {"id": "M23", "type": "fill", "theme": "movement", "title": "Complete the migration firewall rule", "scenario": "<p>The security team is writing the exact rule that lets the migration agent subnet (10[.]44[.]7[.]0/24) reach the target PostgreSQL server during wave 3. Policy: least privilege, TLS only, everything logged.</p>", "question": "<p>Complete the rule and its policy sentence with the correct tokens.</p>", "text": "Rule: allow (1) [[1]] from (2) [[2]] to 10[.]44[.]9[.]55 port (3) [[3]]. The connection must use (4) [[4]] encryption, and the firewall must log (5) [[5]] allowed and denied packets for the migration window.", "blanks": {"1": ["tcp", "PostgreSQL uses TCP. UDP would never establish the session, and an “any” protocol violates least privilege."], "2": ["10[.]44[.]7[.]0/24", "The source is exactly the migration agent subnet — nothing broader. This is the whole point of a scoped rule."], "3": ["5432", "5432 is the standard PostgreSQL port. 3306 is MySQL; 443 is HTTPS."], "4": ["TLS 1.2", "Policy requires encryption in transit at TLS 1.2 or higher for all migration traffic."], "5": ["both", "During a migration you want allowed AND denied packets logged: allowed proves the flow worked; denied shows what you still need to open (or what probed you)."]}, "bank": ["tcp", "10[.]44[.]7[.]0/24", "5432", "TLS 1.2", "both", "udp", "3306", "0[.]0[.]0[.]0/0"], "hint": "Think least privilege: exact protocol, exact source, exact port. One bank entry would put the whole internet on the list.", "explain": "<p>A least-privilege migration rule names the protocol (tcp), the narrowest source (the agent subnet 10[.]44[.]7[.]0/24 — never 0[.]0[.]0[.]0/0), the service port (5432 for PostgreSQL), enforces encryption in transit (TLS 1.2+), and logs both permitted and denied traffic so the window is fully evidenced. The decoys are plausible port numbers and a promiscuous source — each one widens the attack surface the policy exists to keep shut.</p><p><b>Focus on:</b> temporary migration rules should be scoped, encrypted, logged — and deleted when the wave ends.</p>"}, {"id": "M24", "type": "order", "theme": "cutover", "title": "The rollback plan, in order", "scenario": "<p>Wave 3 at <b>Aurora Retail</b> carries live writes to the cloud stack during a 2-hour soak. If the error budget breaks, this rollback plan executes. The cards fell on the floor.</p>", "question": "<p>Order the rollback plan correctly, first to last.</p>", "items": [["Declare rollback: the go/no-go owner makes the call and stakeholders are informed", "Rollback is a decision with an owner. Declaring it starts the clock, freezes arguments, and tells the business what happens next."], ["Freeze writes on the cloud stack", "Stopping writes on the target prevents new transactions from being created on a stack you are about to abandon."], ["Reverse-sync the changes made on the cloud back to the source", "Two hours of live writes exist only in the cloud. The reverse delta brings them home — skip this and you silently drop customer activity."], ["Switch routing back to the source stack and verify with smoke tests", "Traffic returns to the source only after its data is current; smoke tests confirm the restored service is actually serving."], ["Unfreeze writes on the source and monitor the restored service", "Customers resume. Monitoring confirms stability and the incident log captures timings for the review."], ["Hold a post-incident review and update the runbook with what failed", "The rollback itself is evidence. The review turns it into a better runbook and a rescheduled cutover plan."]], "hint": "Data made in the cloud must travel home before traffic does. Documentation happens after the service is safe.", "explain": "<p>A rollback plan is a runbook in reverse: declare (owner + stakeholders), stop new writes on the target, reverse-sync the cloud-created data to the source, route traffic back, verify with smoke tests, unfreeze, monitor — and afterwards hold the review that updates the runbook. The reverse-sync step is the one teams forget: any writes accepted in the cloud are lost unless they are explicitly brought back, which is also why rollback decisions come early in an error-budget breach, while the reverse delta is still small.</p><p><b>Focus on:</b> rollback = declare, freeze, reverse-sync, switch, verify, learn.</p>"}, {"id": "M25", "type": "multi", "theme": "risks", "title": "Reduce vendor lock-in without breaking things", "scenario": "<p>The CTO of <b>BlueRiver Credit Union</b> read an analyst note about vendor lock-in and asked for concrete mitigations. Seven proposals reached your desk.</p>", "question": "<p>Select every proposal that genuinely reduces vendor lock-in.</p>", "options": [["p1", "Containerize stateless applications so they run on any provider’s container platform", 1, "Containers wrap the app in a portable unit. A stateless containerized service moves between providers with configuration, not surgery."], ["p2", "Keep data in open formats and standard SQL wherever possible", 1, "Open formats and standard SQL keep the data itself portable. Proprietary formats are the strongest lock there is."], ["p3", "Build integrations through standard APIs rather than provider-proprietary glue services", 1, "Standard APIs are portable contracts; proprietary glue hard-wires the estate to one provider’s ecosystem."], ["p4", "Document an exit plan and test a small workload on a second provider", 1, "A tested exit plan (and evidence it works on a second provider) is the only lock-in metric that matters: how fast could you actually leave?"], ["p5", "Adopt the provider’s proprietary services for every layer because they are cheapest today", 0, "Deepest possible lock. Cheapest today often prices the exit at a fortune tomorrow — the definition of lock-in risk."], ["p6", "Sign a 5-year all-in commitment in exchange for a bigger discount", 0, "A longer commitment deepens dependency; the discount is payment for accepting it."], ["p7", "Store the only copies of critical data in a provider-proprietary format", 0, "Proprietary-only copies mean a migration out requires a rewrite of the data itself — the strongest lock, applied to the crown jewels."]], "hint": "Ask one question of each proposal: does it make leaving easier or harder?", "explain": "<p>Vendor lock-in is the cost and risk of leaving a provider. Mitigations make the estate portable: containerization for stateless apps, open data formats and standard SQL, standard-API integrations, and — decisively — a documented, tested exit plan, ideally proven on a second provider (a light multi-cloud hedge). The distractors all deepen the lock: proprietary services everywhere, long all-in commitments, and sole copies of critical data in proprietary formats. Balance matters: some managed services are worth their lock, but the choice should be conscious and priced.</p><p><b>Focus on:</b> the exit plan is the artefact auditors ask for — if you cannot test it, you do not have it.</p>"}, {"id": "M26", "type": "spot", "theme": "risks", "title": "Right-size the migrated estate", "scenario": "<p>Ninety days after cutover, <b>Aurora Retail</b> reviews the deployment config below against 30 days of telemetry. CPU and memory figures are measured peaks.</p>", "question": "<p>Click every line that wastes money or breaks licensing and must change.</p>", "lines": ["instance_type: m8g-16xlarge    # measured CPU 6%, memory 22%", "storage: 4 TB, 16000 IOPS      # measured peak 380 IOPS", "licence: BYOL Windows, pinned to a 16-vCPU dedicated host", "backups: nightly, kept 35 days, restore tested monthly", "autoscaling: min 4, max 4      # traffic varies 5x daily", "monitoring: agent on, alerts wired to the on-call rota"], "bad": [0, 1, 4], "whys": {"0": "A 16xlarge running at 6% CPU and 22% memory is the poster child for right-sizing: drop several size classes, watch the next baseline, repeat.", "1": "16000 provisioned IOPS against a 380 measured peak is paying roughly 40x for storage performance. Match IOPS to the baseline plus headroom.", "4": "min=max=4 on 5x traffic variation means four idle boxes off-peak and saturation risk on-peak. Set a real range so the fleet follows demand."}, "okWhys": {"0": null, "1": null, "2": "BYOL on a licence-pinned dedicated host is exactly how Windows licensing stays compliant in the cloud.", "3": "Nightly backups, 35-day retention and monthly restore tests are solid, policy-grade practice.", "5": "Monitoring wired to the on-call rota is what made this review possible in the first place."}, "hint": "Two lines are sized from fear, one line forbids the fleet from breathing. Licensing and backups are fine.", "explain": "<p>Right-sizing compares provisioned capacity against measured baselines: a 16xlarge at 6% CPU, 16000 IOPS against a 380 peak, and a fixed fleet on 5x traffic are all paying for capacity the workload never uses — the third quietly creates on-peak risk as well. The compliant lines stay: BYOL on a licence-pinned dedicated host satisfies the licence terms, the backup regime is tested, and monitoring is what produced the telemetry. Right-sizing is a loop: change one variable, re-baseline, repeat.</p><p><b>Focus on:</b> telemetry first, then sizing — never the reverse.</p>"}, {"id": "M27", "type": "single", "theme": "movement", "title": "Identify the conversion type for the billing app", "scenario": "<p>The <b>BlueRiver</b> billing application runs on a 14-year-old <b>physical</b> server. Its licensing dongle driver is kernel-level and hardware-bound. The app cannot be rebuilt and the vendor is gone.</p>", "question": "<p>Which migration conversion applies?</p>", "options": [["o1", "P2V — image the physical server into a VM and validate the driver on the target", 1, "Physical-to-virtual conversion is exactly for bare-metal sources that cannot be rebuilt. The catch is documented: kernel drivers and hardware-bound licensing must be re-validated on the target."], ["o2", "V2V — clone from hypervisor to cloud hypervisor", 0, "V2V assumes a virtual source. This server is physical, so there is no hypervisor to convert from."], ["o3", "Repurchase — adopt a SaaS replacement for billing", 0, "No SaaS equivalent exists for this vendor-less app, and its logic is undocumented. Repurchase is not available."], ["o4", "Retire — the app has served its time", 0, "Billing is a live business function. Retiring it without a replacement stops revenue."]], "hint": "The source platform determines the conversion: physical to virtual has its own acronym.", "explain": "<p>Conversion types follow the source: P2V (physical-to-virtual) images a bare-metal server into a VM; V2V moves VMs between hypervisors; V2P and P2P exist for rarer paths. A 14-year-old physical box with a hardware-bound kernel driver is the classic P2V case — with the explicit caveat that kernel-level and hardware-bound components must be re-validated (or re-armed) on the target, because virtualization changes the hardware identity the licence sees.</p><p><b>Focus on:</b> name the source, then name the conversion — and always flag hardware-bound licensing during assessment.</p>"}, {"id": "M28", "type": "fill", "theme": "risks", "title": "Complete the post-migration report", "scenario": "<p>Thirty days after wave 2, the <b>Aurora Retail</b> optimization report goes to the steering group. Five terms fell out of the draft.</p>", "question": "<p>Restore the five missing terms.</p>", "text": "Measured (1) [[1]] from the Frankfurt office rose 40 ms after cutover; the team will (2) [[2]] two oversized instances, cutting their cost by about 30%. (3) [[3]] resources left over from the old staging network (unattached volumes, forgotten test VMs) were found and deleted. The report recommends tracking (4) [[4]] per workload monthly so drift is visible early. The (5) [[5]] captured before the migration makes all comparisons fair.", "blanks": {"1": ["latency", "The user-facing delay is latency. A 40 ms jump after cutover usually means region distance or path change — measurable against the baseline."], "2": ["right-size", "Right-sizing matches instance size to measured usage. Two oversized instances at 30% saving is a typical first pass."], "3": ["Idle", "Idle resources — unattached volumes, stopped test VMs, spare IPs — bill silently. Finding and deleting them is standard post-migration hygiene."], "4": ["cost", "Cost per workload (unit economics) makes drift visible: without it, a slow creep in spend hides inside the total."], "5": ["baseline", "The pre-migration baseline is the reference for every performance claim. Without it, before/after is opinion."]}, "bank": ["latency", "right-size", "Idle", "cost", "baseline", "egress", "throughput", "TTL"], "hint": "One term is a user-experience measure, one is a verb, one is a noun for forgotten things, one is money, one was captured before cutover.", "explain": "<p>The post-migration report closes the loop with five standard elements: latency compared against the pre-migration baseline, right-sizing actions backed by telemetry, deletion of idle resources that bill silently, cost-per-workload tracking so drift is visible, and the baseline itself as the fairness reference for every comparison. The decoys are real terms from other chapters: egress is a cost component (but not the comparison reference), throughput is a different metric from latency, and TTL belongs to DNS cutover.</p><p><b>Focus on:</b> optimization is a cycle — baseline, measure, right-size, clean up, report, repeat.</p>"}, {"id": "M29", "type": "categorize", "theme": "risks", "title": "Map each finding to its risk family", "scenario": "<p>The <b>Aurora Retail</b> risk workshop produced six findings from the migration logbook. The board wants them grouped by risk family before owners are assigned.</p>", "question": "<p>Place each finding under the risk family it belongs to.</p>", "zones": [["z_compat", "Compatibility risk"], ["z_cost", "Cost risk"], ["z_compliance", "Compliance risk"], ["z_transition", "Security-during-transition risk"]], "items": [["i1", "A 2012-era app fails on the cloud OS images because the vendor never supported that OS version", "z_compat", "The application is not compatible with the target platform. This is the textbook compatibility finding — it needs testing, patching, or a retain decision."], ["i2", "Uncontrolled data growth after migration triples the projected storage bill", "z_cost", "Cost risk: growth beyond the forecast. Needs lifecycle policies, tiering and monthly cost-per-workload tracking."], ["i3", "EU customer records landed in a region outside the approved list during testing", "z_compliance", "Data residency is a compliance matter. Location of personal data is regulated; this needs immediate containment and reporting."], ["i4", "Temporary firewall rules opened for the migration agent were never removed after go-live", "z_transition", "Transition states create security exposure: temporary access that outlives its purpose becomes a permanent hole. Diarize and remove migration rules."], ["i5", "The app runs a deprecated OS version that the cloud provider no longer patches", "z_compat", "Unsupported, unpatched OS on the target platform is a compatibility and supportability failure waiting to be exploited."], ["i6", "Egress charges were never modelled; the monthly bill runs 40% over forecast", "z_cost", "Unmodelled egress is the most common cost surprise in migrations. It belongs to cost estimation and the TCO model."]], "hint": "Two findings are about “can it run / is it supported”, two about money, one about law, one about a door left open.", "explain": "<p>Migration risks cluster into families that need different owners. Compatibility: apps that the target platform cannot run or patch (the 2012 app, the deprecated OS) — answered by testing, replatforming or retain. Cost: growth and forgotten charges (storage tripling, unmodelled egress) — answered by lifecycle policy and honest TCO. Compliance: regulated data in the wrong place — answered by residency controls. Security-during-transition: temporary access that outlives its window — answered by diarized, audited removal. Naming the family correctly is what routes the finding to the person who can fix it.</p><p><b>Focus on:</b> transition-state security — migration windows are temporary by design; make sure they stay temporary.</p>"}, {"id": "M30", "type": "order", "theme": "cutover", "title": "Retire the wave-1 legacy stack", "scenario": "<p>Ninety days after wave 1, the <b>Aurora Retail</b> legacy stack gets its retirement order. The disposal standard defines the gate sequence.</p>", "question": "<p>Order the retirement steps correctly, first to last.</p>", "items": [["Verify the cloud stack has carried full production load for the agreed soak period", "No retirement begins while the old stack is still the safety net. The soak period plus sign-off is the gate."], ["Confirm retention rules and legal holds with the data owners", "Obligations first: the retention schedule and legal holds decide what must be exported before anything is destroyed."], ["Export still-needed data (archives, logs) to the agreed long-term storage", "Whatever retention requires leaves the stack now, into storage that itself meets residency and encryption policy."], ["Take a final backup and store it offline per policy", "The last-resort copy, kept offline per policy, in case the exports missed something."], ["Sanitize disks and decommission the servers per the disposal standard", "Certified data sanitization, then decommissioning, with disposal certificates retained as evidence."], ["Update the CMDB and network diagrams so they stop showing the old stack", "Documentation is last but not optional: a CMDB that still lists ghosts sends the next incident response to empty rooms."]], "hint": "Nothing gets destroyed until obligations are met and copies exist. Documentation is the closing act.", "explain": "<p>Retirement is the mirror of migration discipline: soak period first (the old stack remains the rollback until sign-off), then retention and legal-hold confirmation, then exp
