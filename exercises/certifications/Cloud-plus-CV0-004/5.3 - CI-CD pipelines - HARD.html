<script>
window.__EXAM__ = {"topicId": "cloud-plus", "chapter": 5.3, "title": "5.3 CI/CD Pipelines — HARD", "shortTitle": "Cloud+ 5.3 · CI/CD Pipelines · HARD", "severity": "hard", "sevLabel": "HARD", "examTitle": "CI/CD Pipelines — HARD practice exam", "certName": "Cloud+ 5.3 CI/CD Pipelines — HARD", "minutes": 60, "passMark": 70, "intro": "<p>This exam covers <b>CompTIA Cloud+ (CV0-004) objective 5.3 — CI/CD pipelines<\/b> at <b>HARD severity<\/b>: ambiguous artifacts, near-miss answers, multi-step reasoning across logs, tickets and configs, and cases where the obvious answer is wrong. You are a senior platform engineer at OrbitPay, a payments company — green pipelines that ship the wrong version, canaries that look healthy while the money math drifts, supply-chain traps in dependencies, and GitOps discipline under pressure.<\/p><p>Exercise types: log analysis with filter, multi-select evidence reading, branching incident decisions (including a defender-vs-attacker view), spot-the-mistake reviews, matching, ordering, fill-in policies, triage rows, and <b>two terminal exercises where the tool is NOT named<\/b> — you choose it. Answers reward judgment, not recall.<\/p>", "themes": [{"name": "1. Integration & version control", "kws": [["ci", "Continuous Integration (CI)"], ["cdel", "Continuous Delivery"], ["cdep", "Continuous Deployment"], ["pipe", "Pipeline"], ["build", "Build"], ["artifact", "Artifact"], ["artifrepo", "Artifact repository"], ["vcs", "Version control"], ["pr", "Pull request"], ["trunk", "Trunk-based development"]]}, {"name": "2. Pipeline stages & gates", "kws": [["buildstage", "Build stage"], ["unittest", "Unit test"], ["inttest", "Integration test"], ["smoke", "Smoke test"], ["qgate", "Quality gate"], ["agate", "Approval gate"], ["staging", "Staging environment"], ["rollback", "Rollback"]]}, {"name": "3. Deployment strategies", "kws": [["bluegreen", "Blue-green deployment"], ["canary", "Canary release"], ["rolling", "Rolling deployment"], ["featflag", "Feature flag"], ["health", "Health check"]]}, {"name": "4. Tools & ecosystem", "kws": [["jenkins", "Jenkins"], ["gitlabci", "GitLab CI"], ["ghactions", "GitHub Actions"], ["terraform", "Terraform"], ["ansible", "Ansible"], ["docker", "Docker"], ["k8s", "Kubernetes"], ["helm", "Helm"], ["sonar", "SonarQube"], ["argocd", "Argo CD"]]}, {"name": "5. Pipeline configuration", "kws": [["pascode", "Pipeline as code"], ["webhook", "Webhook trigger"], ["runner", "Runner / agent"], ["secrets", "Secrets management"], ["envvar", "Environment variables"], ["parallel", "Parallel jobs"]]}, {"name": "6. Testing & quality", "kws": [["sast", "SAST"], ["dast", "DAST"], ["sca", "SCA (dependency scanning)"], ["imgscan", "Container image scanning"], ["regression", "Regression testing"], ["coverage", "Test coverage"], ["shiftleft", "Shift-left"]]}, {"name": "7. Environments & IaC", "kws": [["iac", "Infrastructure as Code"], ["drift", "Configuration drift"], ["immutable", "Immutable infrastructure"], ["ephemeral", "Ephemeral environment"], ["gitops", "GitOps"], ["parity", "Environment parity"]]}, {"name": "8. Metrics & governance", "kws": [["depfreq", "Deployment frequency"], ["leadtime", "Lead time for changes"], ["cfr", "Change failure rate"], ["mttr", "MTTR (time to restore)"], ["leastpriv", "Least privilege"], ["signing", "Signed artifacts"]]}], "questions": [{"id": "h01", "type": "logview", "points": 5, "title": "Pipeline green, but staging runs the wrong version", "tags": ["Continuous Integration (CI)", "Build", "Build stage", "Artifact repository", "Pipeline"], "scenario": "<p>OrbitPay, a payments platform, merges MR <code>!884<\/code> for the <code>gateway<\/code> service at 11:40. Pipeline <code>#2213<\/code> finishes green at 11:52. At 12:15 the QA lead reports: &quot;Staging is still answering with the OLD API response shape.&quot; You get both job logs.<\/p>", "question": "<p>Read the logs (filter helps), then select the TWO conclusions that the evidence actually supports.<\/p>", "hint": "Compare the image tag that was BUILT with the image tag that was DEPLOYED. Green pipeline ≠ new code running.", "explain": "<p>The build job built and pushed <code>gateway:2.11.0<\/code> (that is the artifact in the registry, digest <code>sha256:9f2c…<\/code>). But the deploy job pinned <code>2.10.0<\/code> — the previous release's tag, probably a stale variable — and Kubernetes happily rolled that old image out. The rollout completed, so the pipeline was &quot;green&quot; while shipping old code.<\/p><p>A green pipeline only means the defined steps succeeded; it does not prove the intended artifact reached the environment. The fix: make the deploy job consume the tag produced by <i>this<\/i> run (a job output variable, not a hand-maintained value), and consider failing the deploy if the deployed digest does not match the built digest.<\/p><p class='tip'>Focus next on: build-once-promote-that-artifact, and verifying the digest you deployed is the digest you built.<\/p>", "data": {"log": [{"t": "job build-and-test — runner ubuntu-22.04 (10[.]44[.]7[.]12)", "c": "dim"}, {"t": "$ docker build -t registry.orbitpay.internal/gateway:2.11.0 ."}, {"t": "Successfully built sha256:9f2c81ab  (gateway:2.11.0)"}, {"t": "$ docker push registry.orbitpay.internal/gateway:2.11.0"}, {"t": "digest: sha256:9f2c81ab size: 84.2 MB — push complete"}, {"t": "artifact gateway-2.11.0 registered in pipeline #2213", "c": "dim"}, {"t": "job deploy-staging — started 11:51", "c": "dim"}, {"t": "$ kubectl set image deploy/gateway gateway=registry.orbitpay.internal/gateway:2.10.0", "c": "err"}, {"t": "deployment.apps/gateway image updated"}, {"t": "$ kubectl rollout status deploy/gateway -n staging"}, {"t": "deployment \"gateway\" successfully rolled out", "c": "warn"}, {"t": "job deploy-staging succeeded (image tag source: file deploy.env, var IMG_TAG)", "c": "warn"}], "task": {"type": "multi", "options": [{"t": "The deploy job pinned the PREVIOUS release tag (2.10.0) from a stale file variable instead of the tag this pipeline built", "ok": true}, {"t": "The pipeline being green proves the new 2.11.0 code is running in staging", "ok": false}, {"t": "The Docker build failed silently and pushed nothing", "ok": false}, {"t": "The registry refused the push", "ok": false}, {"t": "The rollout never finished", "ok": false}]}}}, {"id": "h02", "type": "order", "points": 5, "title": "Bad money math in production — order the response", "tags": ["Rollback", "Continuous Deployment", "Health check", "MTTR (time to restore)", "Continuous Delivery"], "scenario": "<p>OrbitPay practices <b>continuous deployment<\/b>: green pipeline means production. At 14:02, <code>fee-calculator 3.3.0<\/code> auto-deployed. At 14:09 the reconciliation alert fires: refunds on EU accounts are computed at <b>double the correct amount<\/b>. You are the incident commander.<\/p>", "question": "<p>Put the seven response steps in the order a mature team executes them.<\/p>", "hint": "Stop the bleeding, stop new changes from landing, keep evidence, then fix forward through the full pipeline.", "explain": "<p>Order: <b>1<\/b> page on-call and declare the incident (money correctness = highest severity); <b>2<\/b> freeze the pipeline so no further auto-deploy lands on the broken state; <b>3<\/b> roll <code>fee-calculator<\/code> back to 3.2.2 — with continuous deployment the fastest correct action is rollback, not hotfix-under-pressure; <b>4<\/b> verify recovery with real traffic plus a reconciliation report (amounts, not just health checks); <b>5<\/b> snapshot logs and metrics from 3.3.0 before they rotate away; <b>6<\/b> ship the fix through the FULL pipeline including canary — never hand-patch production pods; <b>7<\/b> post-mortem: add a property-based test for EU refund math so the class of bug dies.<\/p><p>Continuous delivery teams would also have an approval gate here; continuous deployment teams compensate with fast, boring, well-rehearsed rollback.<\/p><p class='tip'>Focus next on: MTTR is driven by how rehearsed steps 1–4 are, not by how fast people type.<\/p>", "data": {"items": [{"id": "p1", "t": "Page on-call and declare a SEV-1 incident"}, {"id": "p2", "t": "Freeze the pipeline: block auto-deploys for fee-calculator"}, {"id": "p3", "t": "Roll fee-calculator back to 3.2.2 (last known good)"}, {"id": "p4", "t": "Verify recovery with reconciliation report on live traffic"}, {"id": "p5", "t": "Snapshot logs and metrics from 3.3.0 for the RCA"}, {"id": "p6", "t": "Ship the fix through the full pipeline with canary — no manual patch"}, {"id": "p7", "t": "Post-mortem: add a property-based test for EU refund math"}]}}, {"id": "h03", "type": "multi", "points": 4, "title": "Read the test matrix log precisely", "tags": ["Parallel jobs", "Runner / agent", "Pipeline as code", "Unit test"], "scenario": "<p>Pipeline for <code>gateway 2.12.0-rc.1<\/code> runs its unit test stage as a <b>matrix<\/b> defined in <code>pipeline.yml<\/code> at the repo root. Three runners share the suite. The job summary:<\/p><pre>matrix (pipeline.yml → stage: unit-tests)\n  runner-a (10[.]44[.]8[.]21): tests 1..340   — PASS (612s)\n  runner-b (10[.]44[.]8[.]22): tests 1..340   — PASS (611s)\n  runner-c (10[.]44[.]8[.]23): tests 341..680 — PASS (613s)\nartifact: gateway-2.12.0-rc.1.jar uploaded (digest 4be1…)\nquality gate: coverage 84% — pass<\/pre>", "question": "<p>Select the THREE conclusions the log actually supports.<\/p>", "hint": "Read each line as evidence. Two runners ran the same range; one ran a different range — what does that tell you about execution and about the suite?", "explain": "<p>Supported: the tests ran <b>in parallel on separate runners<\/b> (three distinct runner hosts, overlapping time); the <b>whole suite (680 tests) passed<\/b> — ranges 1..340 (run twice, by a and b) and 341..680 together cover everything; the <b>coverage gate passed<\/b> at 84%. The matrix is defined in the repo's <code>pipeline.yml<\/code>, i.e. pipeline as code.<\/p><p>Not supported: &quot;one runner failed&quot; — all three say PASS; &quot;sequential on one machine&quot; — three different hosts; &quot;artifact failed to upload&quot; — the log says uploaded.<\/p><p class='tip'>Focus next on: matrix logs reward exact reading — runner ≠ test, and duplicated ranges mean the suite is split with overlap, not missing.<\/p>", "data": {"options": [{"t": "Tests ran in parallel on separate runner hosts", "ok": true}, {"t": "The whole suite of 680 tests passed", "ok": true}, {"t": "The coverage quality gate passed at 84%", "ok": true}, {"t": "One runner failed but the pipeline still went green", "ok": false}, {"t": "The tests ran sequentially on a single machine", "ok": false}, {"t": "The artifact failed to upload", "ok": false}]}}, {"id": "h04", "type": "branch", "points": 5, "title": "Canary looks fine — the money isn't", "tags": ["Canary release", "Health check", "Change failure rate", "Webhook trigger", "Rollback"], "scenario": "<p>OrbitPay deploys <code>ledger 5.1.0<\/code> as a canary (5% of traffic). The rollout was triggered by a registry <b>webhook<\/b> when the image pushed. Dashboards: p99 latency normal, error rate 0.1%, all pods healthy. But OrbitPay's real correctness signal — the nightly reconciliation of balances — only runs at 02:00, long after a full rollout would be done.<\/p>", "question": "<p>Make the three calls in order.<\/p>", "hint": "Green pods prove the process runs — they do not prove the money math is right. Define a business-metric gate before you widen the blast radius.", "explain": "<p><b>Step 1 — do not promote on infra metrics alone.<\/b> Latency and error rate say the service is up; they say nothing about balance correctness. A 5% canary for five minutes with only health checks is a coin toss with extra steps. Add a business-metric gate: run reconciliation against the canary shard before widening.<\/p><p><b>Step 2 — the gate earns its keep.<\/b> The canary reconciliation reports 0.4% of ledgers with rounding drift. The right call is to halt, roll the canary back, and file a data-correctness bug with the affected ledger IDs. &quot;Rounding noise&quot; in a ledger is how banks lose trust — and the nightly job would find the same drift at 02:00, when 100% of traffic is already on the bad version.<\/p><p><b>Step 3 — harden, don't slow down.<\/b> Make business reconciliation a <i>mandatory canary gate<\/i> for every ledger deploy. A longer canary without the right signal just delays the same mistake; removing the webhook trigger makes deploys slower without making them safer. Change failure rate drops when the gate measures the right thing.<\/p><p class='tip'>Focus next on: health checks measure liveness; correctness gates measure business truth. A mature pipeline needs both.<\/p>", "data": {"start": "n1", "nodes": {"n1": {"scene": "All infra signals are green at 5% for 5 minutes. Move to 100%?", "choices": [{"t": "No — define a business-metric gate (reconciliation on the canary shard) before widening", "next": "n2", "ok": true, "fb": "Correct — infra metrics cannot prove money correctness."}, {"t": "Yes — health checks are the source of truth for deployments", "next": "e1", "ok": false, "fb": "Health checks prove the process runs, not that the math is right."}, {"t": "Yes — and shorten canaries next time, 5 minutes is already too long", "next": "e1", "ok": false, "fb": "Shortening the only measurement window makes it worse."}]}, "n2": {"scene": "Reconciliation on the canary shard reports 0.4% of ledgers with rounding drift. Next?", "choices": [{"t": "Halt the rollout, roll the canary back, file a data-correctness bug with ledger IDs", "next": "n3", "ok": true, "fb": "Correct — the gate caught a real money bug at 5% blast radius."}, {"t": "Continue to 25% — 0.4% is rounding noise", "next": "e2", "ok": false, "fb": "In a ledger, drift is never noise. It compounds."}, {"t": "Ignore it; the nightly reconciliation will fix balances at 02:00", "next": "e2", "ok": false, "fb": "By 02:00 the bug would be at 100% — and reconciliation reports, it does not repair."}]}, "n3": {"scene": "Canary rolled back in 9 minutes. What hardens the pipeline for next time?", "choices": [{"t": "Make business reconciliation a mandatory canary gate for every ledger deploy", "next": "e3", "ok": true, "fb": "Correct — promote the check that worked into a gate."}, {"t": "Extend canary time to 2 hours but keep only infra metrics", "next": "e4", "ok": false, "fb": "More time looking at the wrong signals is not more safety."}, {"t": "Remove the webhook trigger so deploys need a manual click", "next": "e4", "ok": false, "fb": "Slower deploys, same blindness. The trigger was never the problem."}]}, "e1": {"end": true, "scene": "Ledger 5.1.0 goes to 100%. At 02:00 the nightly reconciliation reports drift across thousands of ledgers."}, "e2": {"end": true, "scene": "Drift compounds with every transaction on the bad version."}, "e3": {"end": true, "scene": "Next week the gate stops another rounding bug — this time nobody outside the team notices."}, "e4": {"end": true, "scene": "The team is slower and still blind to money correctness."}}}}, {"id": "h05", "type": "spot", "points": 5, "title": "Four smells in the legacy Jenkinsfile", "tags": ["Jenkins", "Secrets management", "Pipeline as code", "Least privilege", "Infrastructure as Code"], "scenario": "<p>OrbitPay still builds one service on a legacy Jenkins agent. An intern &quot;improved&quot; the Jenkinsfile and opened a PR. Before you comment on style, review it like an auditor.<\/p>", "question": "<p>There are <b>exactly 4 problem lines<\/b>. Click each line that contains a problem.<\/p>", "hint": "One line gives away a credential. One line skips infrastructure review. One line skips deployment verification. One line lets the job run anywhere — including runners with broad credentials.", "explain": "<p><b>Line 2<\/b> — <code>agent any<\/code> lets the job run on any available runner, including ones that hold broader credentials. Deploy jobs should be pinned to dedicated, minimally-privileged runners (least privilege).<\/p><p><b>Line 4<\/b> — an AWS access key hard-coded in the Jenkinsfile. Anything in Git is readable by everyone with repo access and stays in history forever. Credentials belong in the secrets store, injected at runtime, rotated.<\/p><p><b>Line 9<\/b> — <code>terraform apply -auto-approve<\/code> applies infrastructure changes with no plan review and no approval gate. Infrastructure is production; changes need a reviewed plan.<\/p><p><b>Line 10<\/b> — <code>kubectl rollout restart<\/code> followed by no <code>rollout status<\/code> verification: the job can go green while pods crash-loop.<\/p><p class='tip'>Focus next on: a pipeline file is production configuration — audit it with the same strictness as infrastructure.<\/p>", "data": {"lines": ["pipeline {", "  agent any", "  environment {", "    AWS_ACCESS_KEY_ID = 'AKIAQ2QT7EXAMPLE'", "  }", "  stages {", "    stage('Deploy') {", "      steps {", "        sh 'terraform apply -auto-approve'", "        sh 'kubectl rollout restart deploy/pay-api'", "      }", "    }", "  }", "}"], "correct": [1, 3, 8, 9]}}, {"id": "h06", "type": "fill", "points": 4, "title": "Write incident report 4021 correctly", "tags": ["Continuous Deployment", "Rollback", "MTTR (time to restore)", "Approval gate", "Change failure rate"], "scenario": "<p>Incident 4021 is closed. The draft report is written, but every technical term in it was replaced by a placeholder before the CTO review. Terminology errors in incident reports are how teams learn the wrong lessons — fill it precisely.<\/p>", "question": "<p>Pick the correct term for each placeholder from the dropdowns.<\/p>", "hint": "Match each blank to the definition: no manual step = continuous deployment; restore time = MTTR; share of failed changes = change failure rate.", "explain": "<p>The deploy was fully automatic, so OrbitPay practices <b>continuous deployment<\/b> (delivery would include a human release decision). Recovery meant <b>shifting traffic back to the last good version<\/b> — a rollback. <b>MTTR<\/b> (time to restore service) for this incident was 14 minutes from alert to recovered service.<\/p><p>The <b>approval gate<\/b> had been disabled &quot;to move faster&quot; — the post-mortem re-enables it as blocking. This was the second failed change out of 38 deployments this month, so the <b>change failure rate<\/b> rises to about 5.3% (2 ÷ 38). Reports that confuse these terms make trends invisible.<\/p><p class='tip'>Focus next on: each DORA term has one definition; incident reports must use it exactly.<\/p>", "data": {"mode": "select", "parts": ["<p>At 14:09 we declared a SEV-1 after fee-calculator 3.3.0 computed duplicate refunds. The pipeline had deployed 3.3.0 automatically with no human click, because OrbitPay practices ", {"a": "continuous deployment", "opts": ["continuous delivery", "continuous deployment", "trunk-based development"]}, ". On-call ", {"a": "shifted traffic back to the last good version", "opts": ["shifted traffic back to the last good version", "increased canary traffic", "disabled the health checks"]}, " within 7 minutes of the alert. ", {"a": "Time to restore service", "opts": ["Time to restore service", "Change failure rate", "Deployment frequency"]}, " for this incident was 14 minutes. The ", {"a": "approval gate", "opts": ["approval gate", "nightly schedule", "quality gate"]}, " for fee-calculator had been disabled temporarily 'to move faster' — the post-mortem re-enables it as blocking. This was the second failed change out of 38 deployments this month, so the ", {"a": "change failure rate", "opts": ["change failure rate", "MTTR", "lead time"]}, " rises to 5.3%.<\/p>"]}}, {"id": "h07", "type": "categorize", "points": 4, "title": "DORA metrics and the levers that move them", "tags": ["Deployment frequency", "Lead time for changes", "Change failure rate", "MTTR (time to restore)"], "scenario": "<p>A platform initiative promises to &quot;move the DORA numbers&quot;. Leadership asks which lever actually moves which metric. Pairing them correctly is what separates a dashboard from a plan.<\/p>", "question": "<p>Place each metric with the statement that describes it.<\/p>", "hint": "Two are speed, one is safety, one is recovery. Distractors are common quality numbers that DORA does not use.", "explain": "<p><b>Deployment frequency<\/b> — how often the team ships to production; small batches and trunk-based development raise it.<\/p><p><b>Lead time for changes<\/b> — the wait from merge to production; automating test and approval stages shortens it.<\/p><p><b>Change failure rate<\/b> — the share of deployments causing failure or rollback; quality gates and canary analysis lower it.<\/p><p><b>Time to restore service (MTTR)<\/b> — how fast service recovers after a failed change; fast automated rollback and good alerting lower it.<\/p><p>Code coverage and story points are useful team-internal numbers, but they are not DORA metrics and moving them proves nothing about delivery performance.<\/p><p class='tip'>Focus next on: if an initiative names a DORA metric, ask which of the four levers it pulls.<\/p>", "data": {"buckets": [{"id": "df", "label": "Deployment frequency"}, {"id": "lt", "label": "Lead time for changes"}, {"id": "cf", "label": "Change failure rate"}, {"id": "mr", "label": "Time to restore (MTTR)"}], "items": [{"id": "p1", "t": "How often a team ships to production", "bucket": "df"}, {"id": "p2", "t": "Raised by smaller batches and trunk-based development", "bucket": "df"}, {"id": "p3", "t": "The wait from merge to production", "bucket": "lt"}, {"id": "p4", "t": "Shortened by automating test and approval stages", "bucket": "lt"}, {"id": "p5", "t": "Share of deployments causing failure or rollback", "bucket": "cf"}, {"id": "p6", "t": "Lowered by quality gates and canary analysis", "bucket": "cf"}, {"id": "p7", "t": "How fast service recovers after a failed change", "bucket": "mr"}, {"id": "p8", "t": "Lowered by automated rollback and good alerts", "bucket": "mr"}]}}, {"id": "h08", "type": "qcm", "points": 3, "title": "Reduce change failure rate — the right way", "tags": ["Change failure rate", "Quality gate", "Approval gate", "Canary release"], "scenario": "<p>OrbitPay's change failure rate is 12%; the target is under 5%. Leadership proposes four plans at the ops review. One of them reduces failures without stopping delivery or gaming the number.<\/p>", "question": "<p>Which plan MOST directly reduces change failure rate, honestly?<\/p>", "hint": "Fix the causes (what reaches production and how it is verified), not the scoreboard and not the pace.", "explain": "<p><b>Mandatory quality gate plus canary analysis with automatic rollback<\/b> attacks the cause: broken changes are stopped at the gate, and subtle ones are caught by real-traffic analysis at 5% instead of 100%. Failure rate drops while delivery continues.<\/p><p>A deploy freeze hides the metric for a month and returns the same code quality. Removing the approval gate raises frequency and usually worsens failures. Counting only SEV-1s redefines the metric until it lies — the classic dashboard game that DORA explicitly warns about.<\/p><p class='tip'>Focus next on: gates + progressive delivery lower CFR; freezes and metric edits only move the chart.<\/p>", "data": {"options": [{"t": "Mandatory quality gate plus canary analysis with automatic rollback for every service", "ok": true}, {"t": "Freeze all deployments for one month and fix code in the meantime", "ok": false}, {"t": "Remove the approval gate so changes ship faster and failures are shorter", "ok": false}, {"t": "Count only SEV-1 incidents in the failure-rate metric", "ok": false}]}}, {"id": "h09", "type": "categorize", "points": 4, "title": "Which controls protect the software supply chain?", "tags": ["Signed artifacts", "SCA (dependency scanning)", "Container image scanning", "SAST", "Environment parity"], "scenario": "<p>After a industry-wide dependency attack made headlines, OrbitPay's CISO asks every team to sort its control list: which controls protect the <b>software supply chain<\/b> (what gets built and shipped), and which are good general pipeline hygiene but not supply-chain controls?<\/p>", "question": "<p>Drag each control into the right bucket.<\/p>", "hint": "Supply chain = anything that can poison WHAT you build or ship: dependencies, base images, build outputs, their proofs.", "explain": "<p><b>Supply chain controls<\/b> guard the ingredients and the proof of the output: signing build artifacts (proves who built it and that it was not altered), checking dependencies against an SBOM / pinning them (SCA), scanning container images for CVEs before promotion, and pinning base images by digest so nothing foreign slips in at build time.<\/p><p><b>General pipeline hygiene<\/b>: SAST on merge requests (finds flaws in your own code, not in what you import), unit tests on push, manual approval before production, and keeping staging similar to production (parity). All valuable — none of them stops a poisoned dependency or an unsigned artifact.<\/p><p class='tip'>Focus next on: supply chain security is about the origin and integrity of everything you did not write yourself.<\/p>", "data": {"buckets": [{"id": "sc", "label": "Software supply chain control"}, {"id": "gen", "label": "General pipeline practice"}], "items": [{"id": "c1", "t": "Sign build artifacts; verify signatures at deploy", "bucket": "sc"}, {"id": "c2", "t": "Check dependencies against an SBOM on every build (SCA)", "bucket": "sc"}, {"id": "c3", "t": "Scan container images for CVEs before promotion", "bucket": "sc"}, {"id": "c4", "t": "Pin base images by digest, not by tag", "bucket": "sc"}, {"id": "c5", "t": "Run SAST on every merge request", "bucket": "gen"}, {"id": "c6", "t": "Run unit tests on every push", "bucket": "gen"}, {"id": "c7", "t": "Manual approval gate before production", "bucket": "gen"}, {"id": "c8", "t": "Keep staging configuration close to production (parity)", "bucket": "gen"}]}}, {"id": "h10", "type": "terminal", "points": 4, "title": "Terminal: find the unhealthy pods", "tags": ["Kubernetes", "Health check", "Rolling deployment"], "scenario": "<p>Last night's deploy of <code>pay-api<\/code> in namespace <code>prod<\/code> finished, but the morning report says &quot;something is not fully healthy&quot;. You are on the ops jump host. No further instructions — choose your own tools.<\/p>", "question": "<p>Work out how many <code>pay-api<\/code> pods are ready and which one is not, using the shell. Any reasonable commands are fine; the graded requirements appear after you Check.<\/p>", "hint": "Readiness shows as 0/1 in pod listings. The pod name you find will help you zoom in with describe or logs.", "explain": "<p>A solid path: <code>kubectl get pods -n prod<\/code> (or <code>kubectl get deploy pay-api -n prod<\/code>) shows READY counts — one pod shows <code>0/1<\/code>, the others <code>1/1<\/code>, so one of five is not ready. Then <code>kubectl describe pod pay-api-5d4f -n prod<\/code> (or <code>kubectl logs<\/code>) reveals the cause: the readiness probe returns HTTP 503 because the new version fails its warm-up.<\/p><p>On-call practice: first establish the state (how many, which ones), then find the reason — in that order, because &quot;how many&quot; decides the severity while the reason decides the fix.<\/p><p class='tip'>Focus next on: 0/1 READY means the pod gets no traffic; describe → Events is usually the fastest &quot;why&quot;.<\/p>", "data": {"banner": ["orbit-jump 9.1 — AKS cluster orbitpay-prod", "Connected. Type commands. 'ls' lists captured output files."], "files": {"morning-report.txt": "deploy of pay-api 7.4.0 finished 02:31\nreport says: something is not fully healthy\n"}, "outputs": [{"re": "^kubectl\\s+get\\s+(pods|po)(\\s|$)", "out": "NAME                    READY   STATUS    RESTARTS   AGE\npay-api-5d4f9-aa1      1/1     Running   0          9h\npay-api-5d4f9-bb2      1/1     Running   0          9h\npay-api-7c2e1-cc3      0/1     Running   0          9h\npay-api-7c2e1-dd4      1/1     Running   0          9h\npay-api-7c2e1-ee5      1/1     Running   0          9h"}, {"re": "^kubectl\\s+get\\s+deploy", "out": "NAME      READY   UP-TO-DATE   AVAILABLE   AGE\npay-api   4/5     5            4           9h"}, {"re": "(describe|logs).*pay-api-7c2e1-cc3", "out": "Events:\n  Warning  Unhealthy  readiness probe failed: HTTP 503 on /healthz (attempt 41)\n  Normal   Started    Started container pay-api"}, {"re": "^kubectl\\s+(describe|logs)", "out": "describe: pod not found — try the full pod name from get pods (pay-api-7c2e1-cc3)"}], "required": [{"re": "^kubectl\\s+get\\s+(pods|po|deploy)(\\s|$)", "ex": "kubectl get pods -n prod", "note": "list pods / deployment to see READY counts"}, {"re": "pay-api-7c2e1-cc3", "ex": "kubectl describe pod pay-api-7c2e1-cc3 -n prod", "note": "zoom into the unhealthy pod by name"}]}}, {"id": "h11", "type": "rowselect", "points": 4, "title": "Triage the pipeline audit findings", "tags": ["Least privilege", "Signed artifacts", "Secrets management", "Quality gate", "Runner / agent"], "scenario": "<p>An external audit of OrbitPay's CI produced six findings with suggested severities. As platform lead you assign the response. Money-path services and credentials get the strictest handling; performance-only gaps can be ticketed.<\/p>", "question": "<p>Choose the correct response for each finding.<\/p>", "hint": "Over-privileged identity, unsigned money artifacts, gate bypass and unpatched runners — order them by blast radius, not by effort.", "explain": "<p><b>Block now<\/b>: the deploy service account that can edit cluster RBAC (a stolen token rewrites your authorizations — least privilege violated at the worst layer); unsigned artifacts on the money-movement service (nobody can prove what runs); admin-token gate bypass (your quality gate becomes decorative); and the money-path unsigned finding again shows the audit pattern — identity, integrity, bypass.<\/p><p><b>Fix this sprint<\/b>: runner images unpatched for 90 days (real exposure, not instantly exploitable) and secrets rotated manually once a year (should be automatic, but rotation exists).<\/p><p><b>Accept with ticket<\/b>: staging on old instance sizes — performance only, no security impact.<\/p><p class='tip'>Focus next on: triage by blast radius; identity and integrity findings usually outrank hygiene findings.<\/p>", "data": {"rows": [{"label": "F-101: Deploy service account can edit cluster RBAC", "ctx": "One compromised token could rewrite the cluster's authorizations.", "options": [{"t": "Block release now; scope the account to its namespace verbs", "ok": true}, {"t": "Fix this sprint", "ok": false}, {"t": "Accept with ticket", "ok": false}]}, {"label": "F-102: Money-movement service ships unsigned artifacts", "ctx": "Registry accepts any image; no signature verification on deploy.", "options": [{"t": "Accept with ticket", "ok": false}, {"t": "Block release now; require signing + verification", "ok": true}, {"t": "Fix this sprint", "ok": false}]}, {"label": "F-103: Runner images unpatched for 90 days", "ctx": "Known CVEs present in runner base images.", "options": [{"t": "Block release now", "ok": false}, {"t": "Fix this sprint; rebuild runner images", "ok": true}, {"t": "Accept with ticket", "ok": false}]}, {"label": "F-104: Secrets rotated manually once a year", "ctx": "No automatic rotation on registry and vault tokens.", "options": [{"t": "Accept with ticket", "ok": false}, {"t": "Block release now", "ok": false}, {"t": "Fix this sprint; enable automatic rotation", "ok": true}]}, {"label": "F-105: Staging runs on three-year-old instance sizes", "ctx": "Performance lower than prod; no security impact.", "options": [{"t": "Fix this sprint", "ok": false}, {"t": "Block release now", "ok": false}, {"t": "Accept with ticket", "ok": true}]}, {"label": "F-106: PRs can bypass the quality gate with an admin token", "ctx": "Gate result can be overwritten by anyone with the token.", "options": [{"t": "Block release now; make gate results immutable", "ok": true}, {"t": "Accept with ticket", "ok": false}, {"t": "Fix this sprint", "ok": false}]}]}}, {"id": "h12", "type": "order", "points": 4, "title": "GitOps rollback — the correct sequence", "tags": ["GitOps", "Argo CD", "Configuration drift", "Infrastructure as Code"], "scenario": "<p>OrbitPay runs <code>pay-api<\/code> with Argo CD. A bad manifest change was auto-synced to production; pods are in <b>CrashLoopBackOff<\/b>. A junior suggests &quot;just kubectl edit the deployment live&quot;. You do it properly.<\/p>", "question": "<p>Put the six steps in the correct GitOps order.<\/p>", "hint": "In GitOps you fix the cause in Git, never hand-edit the cluster. And after recovery, you close the door that let it happen.", "explain": "<p>Correct sequence: <b>1<\/b> confirm the state — cluster unhealthy, last known good commit identified; <b>2<\/b> revert the bad commit in the <i>manifest repo<\/i> (git revert, reviewed like any change); <b>3<\/b> let Argo CD sync the reverted desired state — no <code>kubectl edit<\/code>, because hand-edits are drift and get overwritten by the next sync; <b>4<\/b> watch sync status and health turn Healthy; <b>5<\/b> verify the application with real checks (metrics, reconciliation); <b>6<\/b> harden: require PR review on the manifest repo and enable Argo CD self-heal so manual cluster edits are corrected automatically.<\/p><p>Editing the live cluster might be faster by minutes and costs you the property that makes GitOps trustworthy: Git is the only place state changes are born.<\/p><p class='tip'>Focus next on: GitOps recovery = revert in Git → let the controller converge → then harden.<\/p>", "data": {"items": [{"id": "z1", "t": "Confirm: cluster unhealthy; identify last known good commit"}, {"id": "z2", "t": "Revert the bad commit in the manifest repo"}, {"id": "z3", "t": "Let Argo CD sync the reverted desired state (no kubectl edit)"}, {"id": "z4", "t": "Watch sync status and application health turn Healthy"}, {"id": "z5", "t": "Verify the application with real checks (metrics, reconciliation)"}, {"id": "z6", "t": "Harden: PR review on manifests + Argo CD self-heal on"}]}}, {"id": "h13", "type": "logview", "points": 5, "title": "Rollout stuck at 2/5 — read it to the end", "tags": ["Kubernetes", "Helm", "Docker", "Secrets management", "Health check"], "scenario": "<p>A <code>helm upgrade<\/code> of <code>pay-api<\/code> in <code>prod<\/code> fails mid-rollout. Two engineers already suggested &quot;more replicas&quot; and &quot;reboot the nodes&quot;. Get the cause first.<\/p>", "question": "<p>Read the log and events (filter helps), then select the TWO actions that actually fix this rollout.<\/p>", "hint": "The registry answered 401 Unauthorized — ask who pulls the image and with which credential, and how old that credential is.", "explain": "<p>The events show <b>ImagePullBackOff<\/b> with <code>401 Unauthorized<\/code> from the registry: the image exists and the tag is right, but the <b>pull secret<\/b> used by the service account is stale — it was updated 91 days ago and the registry token has expired since.<\/p><p>The two real fixes: refresh the registry <b>pull secret<\/b> attached to the service account, and verify the image tag exists in the registry with valid credentials (defense against the tag-never-existed variant). More replicas add more failing pods; reboots do not renew credentials; readiness thresholds would only hide the symptom.<\/p><p class='tip'>Focus next on: ImagePullBackOff + 401 = credentials, not capacity. Always read the event line before proposing infra changes.<\/p>", "data": {"log": [{"t": "$ helm upgrade pay-api ./chart -n prod --set image.tag=4.2.0", "c": "dim"}, {"t": "Error: UPGRADE FAILED: pre-upgrade hooks failed: 1 error", "c": "err"}, {"t": "$ kubectl get pods -n prod"}, {"t": "pay-api-7bd9c   2/5   ImagePullBackOff   0   11m", "c": "err"}, {"t": "event: Failed to pull image \"registry.orbitpay.internal/pay-api:4.2.0\": 401 Unauthorized", "c": "err"}, {"t": "event: Back-off pulling image \"registry.orbitpay.internal/pay-api:4.2.0\"", "c": "warn"}, {"t": "secret pay-api-pull-secret — last updated 91 days ago", "c": "warn"}, {"t": "$ curl -sI hxxps://registry[.]orbitpay[.]internal/v2/  (from jump host)", "c": "dim"}, {"t": "registry reachable — tag 4.2.0 exists (pushed 22:14)", "c": "dim"}], "task": {"type": "multi", "options": [{"t": "Refresh the registry pull secret attached to the service account", "ok": true}, {"t": "Verify the image tag exists in the registry with valid credentials", "ok": true}, {"t": "Increase the replica count so more pods pull the image", "ok": false}, {"t": "Reboot the worker nodes", "ok": false}, {"t": "Relax the readiness probe threshold", "ok": false}]}}}, {"id": "h14", "type": "multi", "points": 4, "title": "Prove where this artifact came from", "tags": ["Signed artifacts", "Artifact repository", "Version control", "Pull request"], "scenario": "<p>An auditor asks OrbitPay to prove that the <code>pay-api<\/code> image running in production was built by <b>their<\/b> pipeline from <b>reviewed<\/b> code — not forged or substituted on the way. Which evidence satisfies a real audit?<\/p>", "question": "<p>Select every piece of evidence that actually proves artifact origin and integrity.<\/p>", "hint": "Cryptographic proof plus an unbroken audit trail. Filenames and sticky notes prove nothing.", "explain": "<p>Accepted evidence: a <b>signed artifact<\/b> whose signature verifies against the pipeline's signing key (only the real pipeline could sign it); the <b>build log<\/b> linking commit SHA → pipeline run ID → artifact digest (the audit trail); the <b>digest in the deployment manifest matching the signed one<\/b> (nothing was swapped on the way); and <b>merge request approvals on that exact commit<\/b> (the code was reviewed).<\/p><p>A correct-looking filename proves nothing — filenames are free. A sticky note is not evidence. This chain — sign at build, record the trail, verify at deploy, review before merge — is what supply-chain integrity means in practice.<\/p><p class='tip'>Focus next on: integrity is verified cryptographically (signatures, digests), never by appearance.<\/p>", "data": {"options": [{"t": "Signed artifact whose signature verifies against the pipeline signing key", "ok": true}, {"t": "Build log linking commit SHA, pipeline run ID and artifact digest", "ok": true}, {"t": "Deployment manifest references the exact signed digest", "ok": true}, {"t": "Merge request approvals recorded on the exact commit SHA", "ok": true}, {"t": "A sticky note from the developer on the release board", "ok": false}, {"t": "The artifact filename looks correct", "ok": false}]}}, {"id": "h15", "type": "qcm", "points": 3, "title": "Mystery drift in the production network", "tags": ["Configuration drift", "Infrastructure as Code", "Terraform"], "scenario": "<p>Terraform plan for the prod VPC shows a surprise: reality has CIDR <code>10[.]60[.]0[.]0/16<\/code> but the code says <code>10[.]52[.]0[.]0/16<\/code>. The repo has no change in six months. Chat history shows a network engineer &quot;quickly fixed a firewall in the console&quot; last Tuesday. The plan wants to change the CIDR back.<\/p>", "question": "<p>What is the root cause and the correct response?<\/p>", "hint": "Code says one thing, reality says another, and someone touched the console. That combination has a name.", "explain": "<p>This is <b>configuration drift<\/b>: an out-of-band console change made reality differ from the code. The correct response is to treat the console change as the incident it is: decide with the team whether the new CIDR is actually right; if yes, update the code (or import the real resource state) so code matches reality; then re-plan. Afterwards, prevent it: plan on every PR, drift detection on a schedule, and console write access to prod removed or read-only.<\/p><p>Deleting state and re-creating production is reckless. &quot;Someone hacked us&quot; has no evidence — there is a named engineer and a chat trail. Re-running apply until the plan is empty would &quot;fix&quot; it by reverting a change someone may have needed.<\/p><p class='tip'>Focus next on: drift = reality changed outside the pipeline; fix code and process, not just the resource.<\/p>", "data": {"options": [{"t": "Console change caused drift; reconcile code with reality, then enforce plans and drift detection", "ok": true}, {"t": "The Terraform state file is corrupt; delete it and re-create production", "ok": false}, {"t": "The cloud account was hacked; rotate everything immediately", "ok": false}, {"t": "Re-run apply repeatedly until the plan comes back empty", "ok": false}]}}, {"id": "h16", "type": "fill", "points": 4, "title": "Finish the code-scanning policy", "tags": ["SAST", "SCA (dependency scanning)", "DAST", "Shift-left", "Quality gate", "SonarQube"], "scenario": "<p>OrbitPay's security policy draft describes the three scanner families and when each runs. The scanner names were removed for the CISO review — put them back. The policy mentions that SonarQube raises the SAST findings the team sees today.<\/p>", "question": "<p>Fill each blank with the correct scanner or term from the word bank.<\/p>", "hint": "Source code → SAST. Third-party libraries → SCA. Running app from outside → DAST. Doing all of it earlier → shift-left.", "explain": "<p><b>SAST<\/b> (static analysis) reads your source code and flags unsafe patterns before anything runs — SonarQube's security rules are an example. <b>SCA<\/b> checks the third-party libraries you depend on against vulnerability databases — your code can be clean while a library is broken. <b>DAST<\/b> probes the <i>running<\/i> application from the outside, so it belongs late in the pipeline, against staging.<\/p><p>Moving all three earlier in development is <b>shift-left<\/b>: the earlier a flaw is found, the cheaper the fix. A merge request that fails any scanner is blocked by the <b>quality gate<\/b> until the issue is fixed or formally accepted with a risk ticket.<\/p><p class='tip'>Focus next on: SAST = your code, SCA = your dependencies, DAST = your running app.<\/p>", "data": {"mode": "bank", "parts": ["<p><b>___<\/b> (1) reads our source code and flags unsafe patterns before the app ever runs — our SonarQube instance raises these findings today. <b>___<\/b> (2) checks our third-party libraries against vulnerability databases. <b>___<\/b> (3) probes the running application from the outside, so it belongs late in the pipeline against staging. Moving all three earlier in development is called <b>___<\/b> (4). A merge request that fails any of them is blocked by the <b>___<\/b> (5) until the issue is fixed or formally accepted.<\/p>", {"a": "SAST"}, {"a": "SCA"}, {"a": "DAST"}, {"a": "shift-left"}, {"a": "quality gate"}], "bank": ["SAST", "SCA", "DAST", "shift-left", "quality gate", "uptime probe", "pair review"]}}, {"id": "h17", "type": "branch", "points": 5, "title": "Green pipeline, broken feature", "tags": ["Integration test", "Quality gate", "Pipeline as code", "Regression testing"], "scenario": "<p>OrbitPay's <code>gateway 2.13.0<\/code> pipeline went green in 4 minutes — it normally takes 12. Staging deploys fine. Then QA finds the new auth feature returns HTTP 500 on basic flows. Digging in, you find the pipeline config was edited last week: the integration test stage now has <code>allow_failure: true<\/code>, added &quot;to speed up merges&quot;.<\/p>", "question": "<p>Make the three calls in order.<\/p>", "hint": "Green does not mean 'tests passed'. Check what failure was allowed — then make sure nobody can silence tests silently again.", "explain": "<p><b>Step 1 — read the pipeline, not just the result.<\/b> The integration tests ran and FAILED, but <code>allow_failure: true<\/code> let the pipeline continue and show green. A green result with suppressed failures is a lie the dashboard tells.<\/p><p><b>Step 2 — restore the truth first.<\/b> Remove <code>allow_failure<\/code>, re-run the full pipeline, and fix the real integration failures before any release talk. Deploying anyway moves the discovery to production; marking tests &quot;flaky&quot; in a dashboard fixes nothing.<\/p><p><b>Step 3 — make silencing impossible.<\/b> Pipeline-as-code changes go through merge request review; CI config on main is protected; and a small gate job verifies that no test stage carries <code>allow_failure<\/code>. Adding a regression test for the auth flow closes the loop.<\/p><p class='tip'>Focus next on: who can change the pipeline is as important as what the pipeline checks.<\/p>", "data": {"start": "n1", "nodes": {"n1": {"scene": "Pipeline green in 4 minutes; QA says the new auth feature 500s. Why did the pipeline pass?", "choices": [{"t": "Integration tests ran and FAILED, but allow_failure let the pipeline continue", "next": "n2", "ok": true, "fb": "Correct — the config edit silenced the exact stage that would have caught this."}, {"t": "The tests passed on a different runner", "next": "e1", "ok": false, "fb": "No evidence for that — and the timing change points at the config diff."}, {"t": "QA is testing the wrong environment", "next": "e1", "ok": false, "fb": "Blaming the messenger delays the real fix by a day."}]}, "n2": {"scene": "Confirmed: allow_failure: true on the integration test stage. First move for the release?", "choices": [{"t": "Remove allow_failure, re-run the full pipeline, fix the real failures", "next": "n3", "ok": true, "fb": "Correct — restore the signal, then act on what it says."}, {"t": "Deploy anyway; QA will catch things in production", "next": "e2", "ok": false, "fb": "Customers as canaries without consent — the expensive way to test."}, {"t": "Mark the integration tests as flaky in the dashboard", "next": "e2", "ok": false, "fb": "Renaming the problem is not fixing it."}]}, "n3": {"scene": "Feature fixed and tests green again. How do you stop someone from silencing tests again?", "choices": [{"t": "MR review for pipeline changes, protected CI config, gate job that forbids allow_failure on test stages", "next": "e3", "ok": true, "fb": "Correct — process plus enforcement, and the guard itself lives in the pipeline."}, {"t": "Ask nicely in stand-up that nobody does that again", "next": "e4", "ok": false, "fb": "Social agreements do not survive deadline pressure."}, {"t": "Delete the integration test stage entirely so it cannot be silenced", "next": "e4", "ok": false, "fb": "Removing the alarm instead of the arsonist."}]}, "e1": {"end": true, "scene": "The wrong theory wastes the release window while the config edit sits in main."}, "e2": {"end": true, "scene": "The 500s reach production; the incident runs through the weekend."}, "e3": {"end": true, "scene": "Next month a similar 'speed-up' PR is rejected by the gate job before it can merge."}, "e4": {"end": true, "scene": "Two sprints later, another silent suppression ships a broken release."}}}}, {"id": "h18", "type": "spot", "points": 5, "title": "Three red lines in the Terraform plan", "tags": ["Terraform", "Infrastructure as Code"], "scenario": "<p>You are the approving reviewer for a Terraform plan on the OrbitPay production stack (applied via the pipeline after review). Most lines are routine. Three lines should make you refuse this plan as written.<\/p>", "question": "<p>There are <b>exactly 3 problem lines<\/b>. Click each line that should block the plan.<\/p>", "hint": "One line destroys data. One line creates an empty replacement instead of migrating. One line invites the whole internet to the database.", "explain": "<p><b>Line 2<\/b> — <code>aws_db_instance.billing will be destroyed<\/code>: the production billing database. Destroying a stateful resource is a data-loss event, not a refactor.<\/p><p><b>Line 3<\/b> — <code>aws_db_instance.billing_new will be created<\/code>: creating a <i>new empty<\/i> database while the old one is destroyed means the data is not migrated — this is the classic accidental-replace plan. If a rebuild is truly intended, it needs backups, migration steps and an explicit approval process.<\/p><p><b>Line 5<\/b> — the security group ingress changes to <code>0[.]0[.]0[.]0/0<\/code>: the database would accept connections from the entire internet. That alone blocks a plan.<\/p><p>The load balancer target-group switch (line 4) is a normal traffic shift, and the plan summary (line 6) is just arithmetic.<\/p><p class='tip'>Focus next on: in plans, read for destroy/create pairs on stateful resources and for 0[.]0[.]0[.]0/0 on anything with data.<\/p>", "data": {"lines": ["Terraform will perform the following actions:", "# aws_db_instance.billing will be destroyed", "# aws_db_instance.billing_new will be created", "# aws_lb_rule.pay_api: target_group arn: old -> new", "# aws_security_group.pay_db ingress: 0[.]0[.]0[.]0/0 allowed", "Plan: 2 to create, 1 to destroy, 1 to update."], "correct": [1, 2, 4]}}, {"id": "h19", "type": "categorize", "points": 4, "title": "Stage by stage: how pipelines usually break", "tags": ["Build stage", "Unit test", "Integration test", "Smoke test", "Approval gate", "Artifact repository", "Ansible"], "scenario": "<p>OrbitPay's on-call handbook has a table: &quot;failure symptom → the stage that usually owns it&quot;. Rebuild the table from the incident history below.<\/p>", "question": "<p>Place each symptom with the stage that owns it.<\/p>", "hint": "Match the moment the failure happens: compiling, isolated tests, services together, after deploy, waiting for a human, or fetching the built bits.", "explain": "<p><b>Build stage<\/b> owns dependency downloads — a flaky external repository times out the compile.<\/p><p><b>Unit test stage<\/b> owns the flaky test that fails only on one runner (usually a shared-state or timing bug in the test itself).<\/p><p><b>Integration test stage<\/b> owns schema drift between the test database and production — the contract fails only when pieces meet.<\/p><p><b>Smoke test stage<\/b> owns the moment right after deploy: the health endpoint answering 503 is a smoke failure.<\/p><p><b>Approval gate<\/b> owns the human factor — an approver on vacation with no deputy configured blocks the train.<\/p><p><b>Artifact retrieval<\/b> owns the missing version: the deploy wants an image tag that was never pushed or was cleaned up in the repository.<\/p><p><b>Config apply (Ansible)<\/b> owns partial configuration: a playbook changed one host and failed mid-run, leaving the fleet inconsistent.<\/p><p class='tip'>Focus next on: locating a failure in the pipeline usually tells you the class of fix before you open a single log.<\/p>", "data": {"buckets": [{"id": "b", "label": "Build stage"}, {"id": "u", "label": "Unit test stage"}, {"id": "i", "label": "Integration test stage"}, {"id": "s", "label": "Smoke test stage"}, {"id": "a", "label": "Approval gate"}, {"id": "r", "label": "Artifact retrieval"}, {"id": "c", "label": "Config apply (Ansible)"}], "items": [{"id": "y1", "t": "Dependency download times out against a flaky external repo", "bucket": "b"}, {"id": "y2", "t": "A test fails only on one specific runner", "bucket": "u"}, {"id": "y3", "t": "Test database schema drifted from production schema", "bucket": "i"}, {"id": "y4", "t": "Health endpoint returns 503 right after deploy", "bucket": "s"}, {"id": "y5", "t": "Approver is on vacation with no deputy configured", "bucket": "a"}, {"id": "y6", "t": "Deploy wants image tag 4.1.9 which was never pushed", "bucket": "r"}, {"id": "y7", "t": "Playbook changed one host, then failed mid-run", "bucket": "c"}]}}, {"id": "h20", "type": "qcm", "points": 3, "title": "What exactly reaches production?", "tags": ["Artifact repository", "Artifact", "Immutable infrastructure"], "scenario": "<p>Staging validated image <code>gateway:2.13.1-rc.3<\/code> (digest <code>sha256:11aa…<\/code>) — all gates green. The release is approved. The production deploy job is being written now.<\/p>", "question": "<p>What should production receive?<\/p>", "hint": "Promote the digest you tested. Everything else is a different, untested artifact.", "explain": "<p>Production receives <b>the exact image that was validated — same digest<\/b>, re-tagged or promoted. The digest is the identity of the artifact; if the digest matches, the bits are the bits you tested.<\/p><p>A fresh build from main an hour later has different bits (base image, dependencies may have moved) — you would be deploying something nobody tested. Rebuilding on the prod bastion is worse and untracked. <code>:latest<\/code> is a moving pointer, not an artifact.<\/p><p class='tip'>Focus next on: build once → validate → promote the same digest; that is what immutable artifacts buy you.<\/p>", "data": {"options": [{"t": "The exact validated image, same digest sha256:11aa, re-tagged for prod", "ok": true}, {"t": "A fresh build from main an hour later with the same source", "ok": false}, {"t": "Source code recompiled on the production bastion host", "ok": false}, {"t": "Whatever the registry currently serves as the :latest tag", "ok": false}]}}, {"id": "h21", "type": "multi", "points": 4, "title": "Justified rollback — select the real criteria", "tags": ["Rollback", "Health check", "Blue-green deployment"], "scenario": "<p><code>fee-engine 3.4.0<\/code> is live on 100% of traffic (blue-green switch completed 20 minutes ago; the blue environment is still warm). The on-call channel debates whether to pull the rollback lever. Which observations actually justify it?<\/p>", "question": "<p>Select every observation that justifies an immediate rollback.<\/p>", "hint": "User-visible correctness and business truth justify rollback. Resource noise and aesthetics do not.", "explain": "<p>Justified: refund amount errors <b>10× above baseline<\/b> (correctness), <b>reconciliation drift<\/b> on 0.4% of ledgers (business truth), and support tickets <b>doubled with one stack trace<\/b> (user-visible failure at scale).<\/p><p>Not justified: +12% CPU with SLOs met (a tuning ticket, not an emergency), a deploy that took 8 minutes instead of 6 (nobody's user noticed), and a tweet about the new logo (feedback, not failure). Blue-green keeps the switch-back cheap — but &quot;cheap&quot; must not tempt you into rolling back on noise; every rollback also rolls back real fixes.<\/p><p class='tip'>Focus next on: rollback criteria are written before the deploy — correctness and SLO breaches, not feelings.<\/p>", "data": {"options": [{"t": "Refund amount errors are 10× above baseline", "ok": true}, {"t": "Reconciliation reports balance drift on 0.4% of ledgers", "ok": true}, {"t": "Support tickets doubled, all with the same stack trace", "ok": true}, {"t": "The new version uses 12% more CPU; latency and SLOs unchanged", "ok": false}, {"t": "The deploy took 8 minutes instead of the usual 6", "ok": false}, {"t": "A tweet complains about the new logo", "ok": false}]}}, {"id": "h22", "type": "rowselect", "points": 4, "title": "Four deployment anomalies — first correct action", "tags": ["GitLab CI", "Runner / agent", "Canary release", "Blue-green deployment", "Rolling deployment", "Rollback"], "scenario": "<p>You cover four teams today. Each shows one anomaly. Pick the first correct action for each — the one that addresses the actual layer of the problem.<\/p>", "question": "<p>Choose the correct action for each anomaly.<\/p>", "hint": "Ask for each: is this stuck BEFORE production, limited inside a canary, or already everywhere? And is the problem compute or configuration?", "explain": "<p><b>Stuck job, no runners online<\/b>: the deployment never left the queue — fixing runner availability (the <code>money<\/code> tag) is the fix; rolling back prod does nothing because prod was never touched.<\/p><p><b>Canary at 0.3% vs 0.1% baseline, threshold 1%<\/b>: hold and investigate the trend. It has not met the automatic-rollback threshold, and promoting or ignoring both discard information.<\/p><p><b>Blue-green + shared DB migration broke the old version<\/b>: during a blue-green window BOTH versions run against the same database, so schema changes must stay backward compatible — restore compatibility first.<\/p><p><b>Rolling update stuck with CrashLoopBackOff<\/b>: roll back the deployment first (restore service), then debug the image or config offline.<\/p><p class='tip'>Focus next on: the layer of the failure decides the layer of the fix.<\/p>", "data": {"rows": [{"label": "Deploy job pending for 40 minutes", "ctx": "The money team's repo still builds on the legacy GitLab CI instance: 'no runners with tag money online'. Prod untouched so far.", "options": [{"t": "Fix runner availability/tag — the job never left the queue", "ok": true}, {"t": "Roll back production", "ok": false}, {"t": "Increase replicas to speed up the queue", "ok": false}]}, {"label": "Canary error rate 0.3%", "ctx": "Baseline 0.1%, auto-rollback threshold 1%, canary at 10%.", "options": [{"t": "Promote to 100% — under threshold", "ok": false}, {"t": "Hold canary and investigate the trend", "ok": true}, {"t": "Nothing — thresholds solve themselves", "ok": false}]}, {"label": "Blue-green switch broke the old version", "ctx": "A DB migration ran on the shared database; the blue (old) version now errors.", "options": [{"t": "Restore schema compatibility — both versions must run during the window", "ok": true}, {"t": "Delete the blue environment immediately", "ok": false}, {"t": "Run the migration again on blue", "ok": false}]}, {"label": "Rolling update stuck", "ctx": "1 pod CrashLoopBackOff, deployment progress paused.", "options": [{"t": "Scale to 10 replicas", "ok": false}, {"t": "Roll back the deployment, then debug image/config", "ok": true}, {"t": "Restart the node pool", "ok": false}]}]}}, {"id": "h23", "type": "categorize", "points": 3, "title": "DORA or not DORA?", "tags": ["Deployment frequency", "Lead time for changes", "Change failure rate", "MTTR (time to restore)", "Test coverage"], "scenario": "<p>The platform dashboard has eight widgets. The DORA framework counts exactly four of them as delivery-performance metrics. Sorting them is a classic exam and interview task.<\/p>", "question": "<p>Drag each widget to the right bucket.<\/p>", "hint": "Four specific measures of software delivery. Code quality and planning numbers are useful — but not DORA.", "explain": "<p><b>DORA metrics<\/b>: deployment frequency, lead time for changes, change failure rate, time to restore service (MTTR). These four describe the speed and stability of delivering software.<\/p><p><b>Not DORA<\/b>: code coverage % (code-internal quality), mean open PRs per day (flow noise), uptime SLO (a service reliability target, not a delivery metric), story-point velocity (planning metric).<\/p><p>All eight can be worth tracking — the exam (and DORA research) only claims special status for the four.<\/p><p class='tip'>Focus next on: memorize the four by name; the exam offers plausible near-misses like uptime and coverage.<\/p>", "data": {"buckets": [{"id": "dora", "label": "DORA metric"}, {"id": "not", "label": "Useful but not DORA"}], "items": [{"id": "q1", "t": "Deployment frequency", "bucket": "dora"}, {"id": "q2", "t": "Lead time for changes", "bucket": "dora"}, {"id": "q3", "t": "Change failure rate", "bucket": "dora"}, {"id": "q4", "t": "Time to restore service", "bucket": "dora"}, {"id": "q5", "t": "Code coverage percentage", "bucket": "not"}, {"id": "q6", "t": "Mean open pull requests per day", "bucket": "not"}, {"id": "q7", "t": "Uptime SLO", "bucket": "not"}, {"id": "q8", "t": "Story-point velocity", "bucket": "not"}]}}, {"id": "h24", "type": "terminal", "points": 3, "title": "Terminal: how many replicas, and why", "tags": ["Kubernetes", "Health check", "Rolling deployment"], "scenario": "<p>OrbitPay prod, <code>pay-api<\/code>. The rollout is not fully healthy and you have a shell with kubectl. No hints this time — establish the state (how many replicas are ready), then find the event that explains the rest.<\/p>", "question": "<p>Use the shell: find how many <code>pay-api<\/code> replicas are ready, and which event explains the ones that are not. Any reasonable commands are fine.<\/p>", "hint": "Status first (get deploy/pods/rollout status), then the reason (describe or events).", "explain": "<p><code>kubectl get deploy pay-api -n prod<\/code> (or <code>kubectl rollout status<\/code>) shows <b>2/5 ready<\/b>. <code>kubectl describe pod pay-api-7c2e1-cc3 -n prod<\/code> — or <code>kubectl get events<\/code> — shows the reason: <b>readiness probe failing with HTTP 503 on /healthz<\/b>, so three new pods receive no traffic.<\/p><p>The two-step habit — state, then cause — keeps incidents short: &quot;2/5 ready, readiness probe 503&quot; is a hand-off-able status line that tells the next engineer exactly where to look.<\/p><p class='tip'>Focus next on: READY 2/5 means 3 pods get no traffic; describe/events explains why.<\/p>", "data": {"banner": ["orbit-jump 9.1 — AKS cluster orbitpay-prod", "Connected."], "files": {}, "outputs": [{"re": "^kubectl\\s+get\\s+deploy", "out": "NAME      READY   UP-TO-DATE   AVAILABLE   AGE\npay-api   2/5     5            2           31m"}, {"re": "^kubectl\\s+get\\s+(pods|po)(\\s|$)", "out": "NAME                    READY   STATUS    RESTARTS   AGE\npay-api-5d4f9-aa1      1/1     Running   0          31m\npay-api-5d4f9-bb2      1/1     Running   0          31m\npay-api-7c2e1-cc3      0/1     Running   0          12m\npay-api-7c2e1-dd4      0/1     Running   0          12m\npay-api-7c2e1-ee5      0/1     Running   0          12m"}, {"re": "rollout\\s+status.*pay-api", "out": "Waiting for deployment \"pay-api\" rollout to finish: 2 of 5 updated replicas are available..."}, {"re": "(describe|get events|events).*(7c2e1|pay-api)?", "out": "Events:\n  Warning  Unhealthy  Readiness probe failed: HTTP 503 on /healthz\n  Normal   Pulled     Container image \"pay-api:7.5.0\" already present on machine"}], "required": [{"re": "^kubectl\\s+(get|rollout)(\\s|$)", "ex": "kubectl get deploy pay-api -n prod", "note": "establish how many replicas are ready"}, {"re": "(describe|events)", "ex": "kubectl get events -n prod", "note": "surface the event that explains the unready pods"}]}}, {"id": "h25", "type": "fill", "points": 4, "title": "Complete the secrets & runner policy", "tags": ["Secrets management", "Least privilege", "Runner / agent", "Ephemeral environment", "Environment variables"], "scenario": "<p>The security committee wrote OrbitPay's pipeline secrets policy. The legal-style blanks must be filled with the strict-but-standard wording. Note the parts about runners and about secrets injected as environment variables.<\/p>", "question": "<p>Pick the correct policy wording for each blank.<\/p>", "hint": "Least privilege, short life, no logs, disposable runners.", "explain": "<p>Secrets <b>rotate automatically every 90 days<\/b> (or faster); they live in <b>the vault<\/b>, never in logs or Dockerfiles; the deploy service account gets <b>only the permissions its job needs<\/b> (least privilege — not cluster-admin, not personal keys); when someone leaves, <b>revoke access and rotate shared secrets<\/b>; secrets injected into jobs <b>must never be echoed to logs<\/b> — logs are readable by more people and systems than anyone assumes.<\/p><p>Prod deploy runners run on <b>isolated, ephemeral VMs destroyed after the job<\/b>: a compromised long-lived runner is a standing backdoor into production credentials.<\/p><p class='tip'>Focus next on: secrets = storage, lifetime, permission scope, and output discipline — four different controls.<\/p>", "data": {"mode": "select", "parts": ["<p>Pipeline secrets must ", {"a": "rotate automatically every 90 days", "opts": ["rotate automatically every 90 days", "stay valid forever", "be emailed to new developers"]}, ". They are stored in ", {"a": "the vault", "opts": ["the vault", "build.log", "the Dockerfile"]}, ". The deploy service account receives ", {"a": "only the permissions its job needs", "opts": ["only the permissions its job needs", "cluster-admin", "the team lead's personal keys"]}, ". When a developer leaves the team, we ", {"a": "revoke access and rotate shared secrets", "opts": ["revoke access and rotate shared secrets", "keep their token active", "rename the chat channel"]}, ". Secrets injected as environment variables into jobs ", {"a": "must never be echoed to logs", "opts": ["must never be echoed to logs", "are printed for debugging", "are copied to the analytics queue"]}, ". Runners that deploy to production run on ", {"a": "isolated ephemeral VMs destroyed after the job", "opts": ["isolated ephemeral VMs destroyed after the job", "the intern's laptop", "one shared box holding every team's credentials"]}, ".<\/p>"]}}, {"id": "h26", "type": "order", "points": 3, "title": "Order the shift-left security activities", "tags": ["Shift-left", "SAST", "SCA (dependency scanning)", "DAST", "Container image scanning", "Staging environment"], "scenario": "<p>OrbitPay wants its security activities ordered by where they belong in the delivery flow — earliest first. The rule: the cheapest place to fix a flaw is the earliest place it can be seen.<\/p>", "question": "<p>Put the six security activities in pipeline order (earliest first).<\/p>", "hint": "IDE → pre-commit → merge request → after build → against staging → at runtime.", "explain": "<p>Earliest to latest: <b>1<\/b> IDE/plugin checks while writing code; <b>2<\/b> pre-commit secret scanning (no key ever enters history); <b>3<\/b> SAST + SCA on the merge request (your code and your dependencies, reviewed); <b>4<\/b> container image scan after the build (your artifact); <b>5<\/b> DAST against staging (the running app); <b>6<\/b> runtime policies in production (admission rules, least-privilege enforcement) as the last net.<\/p><p>Each step to the right multiplies the cost of the same flaw: a fix at the IDE is keystrokes; the same fix found by DAST costs a release cycle; found in production it costs an incident.<\/p><p class='tip'>Focus next on: shift-left = move the check as close as possible to the moment the mistake is made.<\/p>", "data": {"items": [{"id": "w1", "t": "IDE/plugin security checks while coding"}, {"id": "w2", "t": "Pre-commit secret scanning"}, {"id": "w3", "t": "SAST + SCA on the merge request"}, {"id": "w4", "t": "Container image scan after the build"}, {"id": "w5", "t": "DAST against the staging environment"}, {"id": "w6", "t": "Runtime policies in production (admission rules)"}]}}, {"id": "h27", "type": "multi", "points": 4, "title": "Blue-green with a shared database", "tags": ["Blue-green deployment", "Rollback", "Environment parity", "Feature flag"], "scenario": "<p>OrbitPay's payments API deploys blue-green, but blue and green share ONE production database. The team lists statements about the pattern before the next release. Some statements are true risks or correct handling; some are wrong and dangerous.<\/p>", "question": "<p>Select every TRUE statement about this setup.<\/p>", "hint": "Two app versions, one database, one migration window — and a rollback that must keep working while both run.", "explain": "<p>True: both versions hit the <b>same database<\/b>, so schema changes must be <b>backward compatible<\/b> (the old code keeps running during the switch window); the safe pattern is <b>expand-migrate-contract<\/b> — add nullable columns first, remove old ones only after blue is retired; deleting the blue environment <b>60 seconds after the switch removes your fastest rollback path<\/b> (keep blue warm for a defined window); and <b>long-running transactions may still be on blue<\/b> — drain or keep it warm briefly so in-flight work finishes.<\/p><p>False: truncating the audit table (that is deleting compliance evidence), and pointing blue and green at two separate empty databases (each version would see different data — correctness chaos). Feature flags complement rollback: turning the feature off via flag is even faster than a traffic switch.<\/p><p class='tip'>Focus next on: with shared state, the database lifetime — not the app deploy — decides what is safe.<\/p>", "data": {"options": [{"t": "Both versions run against the same DB, so schema changes must stay backward compatible", "ok": true}, {"t": "Expand-migrate-contract: add nullable columns first, remove old ones only after blue is gone", "ok": true}, {"t": "Deleting the blue environment 60 seconds after the switch removes the fastest rollback path", "ok": true}, {"t": "Long-running transactions may still hit blue; drain it or keep it warm briefly", "ok": true}, {"t": "Truncating the audit table before the switch speeds up both versions", "ok": false}, {"t": "Pointing blue and green at two separate empty databases isolates risk nicely", "ok": false}]}}, {"id": "h28", "type": "qcm", "points": 3, "title": "Least privilege for the CI deploy credential", "tags": ["Least privilege", "Jenkins", "GitHub Actions", "Secrets management"], "scenario": "<p>One Jenkins job deploys 14 OrbitPay services using a single cluster-admin service account. The same pattern exists in a GitHub Actions workflow. The security committee wants a fix with the smallest possible blast radius per stolen key.<\/p>", "question": "<p>Which fix is correct?<\/p>", "hint": "Blast radius = what one stolen key can do, and for how long.", "explain": "<p><b>One scoped credential per service or purpose, short-lived and audited<\/b>: the token for the billing deploy can only touch the billing namespace and only the verbs it needs; it expires quickly; every use is logged. A stolen key then buys the attacker minutes and one namespace — not the cluster.<\/p><p>Rotating an admin key hourly still gives any stolen copy total power. Base64 is encoding, not encryption — a kubeconfig in the repo is a leaked credential with extra steps. Sharing the deploy credential with every developer multiplies both theft paths and blame ambiguity (no audit trail).<\/p><p class='tip'>Focus next on: scope, lifetime, audit trail — the three knobs of credential blast radius.<\/p>", "data": {"options": [{"t": "One scoped, short-lived, audited credential per service or purpose", "ok": true}, {"t": "Keep the single admin credential but rotate it hourly", "ok": false}, {"t": "Store the admin kubeconfig in the repo, base64-encoded", "ok": false}, {"t": "Give every developer the deploy credential for emergencies", "ok": false}]}}, {"id": "h29", "type": "branch", "points": 5, "title": "The helpful new dependency (defender, then attacker)", "tags": ["SCA (dependency scanning)", "Secrets management", "Runner / agent", "Least privilege"], "scenario": "<p>Merge request <code>!901<\/code> adds npm package <code>fast-json-utils@2.1.0<\/code> — published <b>3 days ago<\/b>, 12 weekly downloads, and its install script downloads a setup script from <code>hxxp://cdn[.]json-utils[.]example/setup[.]sh<\/code> during CI. First you defend; then you think like the attacker to understand the blast radius.<\/p>", "question": "<p>Make the three calls in order — two from the defender's view, one from the attacker's view.<\/p>", "hint": "New package + install script = unreviewed code running with CI's credentials. What could it reach from inside a runner?", "explain": "<p><b>Step 1 (defender)<\/b> — dependency review catches it before merge: package age and download count are red flags, and SCA policy blocks install scripts from unknown packages. The name resembling an official library is exactly how typosquatting works — looks official is not official.<\/p><p><b>Step 2 (attacker view)<\/b> — if it merged, the attacker gains <b>code execution inside CI<\/b>: access to secrets mounted in the job, the source code, and the registry/deploy credentials of the runner. CI runners are production-adjacent: that is the real target of dependency attacks, not developer laptops.<\/p><p><b>Step 3 (contain)<\/b> — revoke and rotate every CI credential the job could touch, purge the built artifacts and images, scan everything built since, remove the package. &quot;Nothing shipped yet&quot; is wrong: the credentials and the poisoned images are already in your systems.<\/p><p class='tip'>Focus next on: the pipeline is production infrastructure; supply-chain attacks target its credentials first.<\/p>", "data": {"start": "n1", "nodes": {"n1": {"scene": "You are the reviewer. What catches this BEFORE merge?", "choices": [{"t": "Dependency review + SCA policy: block install scripts; a 3-day-old package with 12 downloads is a red flag", "next": "n2", "ok": true, "fb": "Correct — age, popularity and postinstall behavior are the first three checks."}, {"t": "Approve it — the package name looks official", "next": "e1", "ok": false, "fb": "Typosquats are named to look official. That is the attack."}, {"t": "Approve it — install scripts are probably just telemetry", "next": "e1", "ok": false, "fb": "An install script is arbitrary code execution on your runner. 'Probably' is not a control."}]}, "n2": {"scene": "Attacker view: suppose it merged. What did the attacker actually gain?", "choices": [{"t": "Code execution inside CI with access to job secrets, source, and registry/deploy credentials", "next": "n3", "ok": true, "fb": "Correct — the runner's credentials are the prize, not the laptop."}, {"t": "Only the developer's laptop was at risk", "next": "e2", "ok": false, "fb": "The script ran on the CI runner — that is where the credentials live."}, {"t": "Nothing — build runners have no network access", "next": "e2", "ok": false, "fb": "The install script itself downloads over the network; runners need registries and clouds."}]}, "n3": {"scene": "Defender again: the merge happened 20 minutes ago. Contain it.", "choices": [{"t": "Revoke and rotate CI credentials, purge built artifacts, scan images built since, remove the package", "next": "e3", "ok": true, "fb": "Correct — credentials first, then everything the poisoned build touched."}, {"t": "Nothing shipped yet, so nothing to do", "next": "e4", "ok": false, "fb": "The credentials and images exist already; 'shipped' is the wrong line to draw."}, {"t": "Rename the package in package.json and redeploy", "next": "e4", "ok": false, "fb": "That leaves every credential the script already read valid and every artifact poisoned."}]}, "e1": {"end": true, "scene": "The script runs on every CI build from now on. It reads secrets quietly and waits."}, "e2": {"end": true, "scene": "You underestimated the blast radius; the attacker moves laterally with CI credentials."}, "e3": {"end": true, "scene": "Rotated credentials, purged artifacts, and a new SCA policy that blocks install scripts — incident closed in 40 minutes."}, "e4": {"end": true, "scene": "The window stays open; the next build re-runs the script."}}}}, {"id": "h30", "type": "qcm", "points": 3, "title": "Compute the lead time for changes", "tags": ["Lead time for changes", "Trunk-based development"], "scenario": "<p>A change to <code>pay-api<\/code> was authored at 09:30, reviewed, and <b>merged to main at 11:00<\/b> (OrbitPay uses trunk-based development with short-lived branches). The pipeline built, tested and packaged until <b>11:45<\/b>. The canary ran with analysis until <b>12:45<\/b>. The full rollout completed at <b>13:30<\/b>.<\/p>", "question": "<p>What is the lead time for this change?<\/p>", "hint": "Lead time starts when the change is accepted (merged), not when typing started, and ends when customers can use it.", "explain": "<p>Lead time for changes = merge to production = 11:00 → 13:30 = <b>2.5 hours<\/b>.<\/p><p>Starting the clock at authoring (09:30) measures review wait, which is a different (also useful) number — 4 hours. 45 minutes is only the pipeline; 30 minutes only the canary window. DORA defines lead time precisely so teams improve the right segment: here, an expert would attack the 60-minute canary window, not the pipeline.<\/p><p class='tip'>Focus next on: lead time = accepted (merged) → running in production.<\/p>", "data": {"options": [{"t": "2.5 hours — from merge (11:00) to production (13:30)", "ok": true}, {"t": "4 hours — from authoring (09:30) to production", "ok": false}, {"t": "45 minutes — the pipeline duration", "ok": false}, {"t": "30 minutes — the canary analysis window", "ok": false}]}}]};
