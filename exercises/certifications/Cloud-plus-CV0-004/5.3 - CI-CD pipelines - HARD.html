<style>
:root{
  --bg:#0b0f14; --panel:#121a24; --panel2:#0e1520; --ink:#05080c;
  --line:#26364a; --line2:#33507a;
  --txt:#e8eef5; --mut:#a7b7c7; --dim:#7f93a6;
  --acc:#5db1ff; --accbg:#0c1e33;
  --ok:#46c06a; --okbg:#0d2a18; --okline:#2f7a4b;
  --bad:#f4695f; --badbg:#321418; --badline:#8f3a37;
  --warn:#d9a52e; --warnbg:#2b2106; --warnline:#8a6c1e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-size-adjust:100%}
code,pre,.mono{font-family:var(--mono);font-size:14px}
h1{font-size:24px;margin:0 0 10px}
h2{font-size:19px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:8px 0}
ul,ol{margin:8px 0;padding-left:22px}
li{margin:4px 0}
button{font:inherit;color:inherit}
a{color:var(--acc)}
#app{max-width:1000px;margin:0 auto;padding:12px 14px 90px}
/* header */
#hdr{position:sticky;top:0;z-index:40;background:#0d131b;border:1px solid var(--line);border-radius:10px;padding:8px 12px 0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.htitle{display:flex;align-items:center;gap:10px;font-weight:600}
.sev{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.06em;border:1px solid var(--warn);color:var(--warn);background:var(--warnbg)}
.sev.hard{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.hctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hud{font-family:var(--mono);font-size:14px;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
#hudtimer.low{color:var(--warn);border-color:var(--warnline)}
#hudtimer.crit{color:var(--bad);border-color:var(--badline)}
.hbtn{min-height:44px;min-width:44px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:#16222f;cursor:pointer}
.hbtn:hover{background:#1b2b3b}
.hbtn.warnb{border-color:var(--warnline);color:var(--warn)}
.pbar{height:5px;background:#1a2532;border-radius:0 0 9px 9px;overflow:hidden;margin-top:8px}
.pfill{height:100%;width:0;background:linear-gradient(90deg,#1f6feb,#46c06a);transition:width .5s ease}
/* pause bar */
#pausebar:empty{display:none}
#pausebar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{padding:8px 14px;border-radius:8px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;gap:8px;border:1px solid}
.pill.rev{border-color:var(--warnline);background:var(--warnbg);color:var(--warn)}
.pill.man{border-color:var(--badline);background:var(--badbg);color:var(--bad)}
/* boxes */
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.box .blabel{display:block;font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--acc);margin-bottom:6px}
.scen{background:var(--panel2);border-left:4px solid var(--acc)}
.quest{background:#101c2c;border-left:4px solid #2f7a4b}
.quest .blabel{color:var(--ok)}
.ansbox{background:var(--panel)}
.fb{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:#101a26}
.fb.fover{display:none}
.fb.good{border-color:var(--okline)}
.fb.part{border-color:var(--warnline)}
.fb.zero{border-color:var(--badline)}
.fbline{font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fbline .ic{font-size:16px}
.exp{color:var(--mut);border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.exp p{margin:6px 0}
.exp ul,.exp ol{margin:6px 0}
.tip{color:var(--warn)}
.hintnote{color:var(--warn);font-size:13.5px;margin-top:8px}
.tagrow{margin:6px 0 2px}
.kwchip{display:inline-block;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin:2px 4px 2px 0;background:#0f1722}
.ptchip{display:inline-block;font-size:12px;color:var(--acc);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;margin-right:6px;background:var(--accbg)}
/* options */
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;margin:7px 0;background:var(--panel2);cursor:pointer}
.opt input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:#1f6feb}
.opt:hover{border-color:var(--line2)}
.opt.ok{border-color:var(--okline);background:var(--okbg)}
.opt.bad{border-color:var(--badline);background:var(--badbg)}
.opt.reveal{border-color:var(--okline);background:var(--okbg);outline:2px dashed var(--okline);outline-offset:2px}
.opt.missed{border-color:var(--warnline);background:var(--warnbg);outline:2px dashed var(--warnline);outline-offset:2px}
.opt.lock{cursor:default}
.markic{font-weight:700;margin-left:auto;flex:none;font-size:13px;padding:1px 8px;border-radius:999px;border:1px solid}
.markic.ok{color:var(--ok);border-color:var(--okline)}
.markic.bad{color:var(--bad);border-color:var(--badline)}
.markic.missed{color:var(--warn);border-color:var(--warnline)}
/* action buttons */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.abtn{min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid var(--line2);background:#16222f;cursor:pointer;font-weight:600}
.abtn:hover{background:#1b2b3b}
.abtn.primary{background:#14416d;border-color:#2f7ec2}
.abtn.primary:hover{background:#17508a}
.abtn.go{background:#123f24;border-color:var(--okline);color:#7ee2a0}
.abtn.warn{background:#3a2c0d;border-color:var(--warnline);color:var(--warn)}
.abtn:disabled{opacity:.45;cursor:not-allowed}
/* navigator */
.navrow{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
#qnav{flex:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tile{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-family:var(--mono);font-size:14px;position:relative}
.tile.cur{outline:2px solid var(--acc);outline-offset:1px}
.tile.full{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.tile.part{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.tile.zero{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.tile.skip{background:var(--warnbg);border-color:var(--warnline);color:var(--warn);border-style:dashed}
.tile .tic{position:absolute;top:-4px;right:-2px;font-size:10px;font-weight:700}
.tile:hover{border-color:var(--line2)}
/* drag & drop */
.pool,.buckets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.buckets{align-items:flex-start}
.chip{min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line2);background:#152333;cursor:grab;touch-action:none;max-width:340px;text-align:left}
.chip.sel{outline:2px solid var(--acc);outline-offset:1px}
.chip.ok{border-color:var(--okline);background:var(--okbg)}
.chip.bad{border-color:var(--badline);background:var(--badbg)}
.chip.missed{border-color:var(--warnline);background:var(--warnbg)}
.chip.lock{cursor:default}
.bucket{flex:1 1 200px;min-height:96px;border:1.5px dashed var(--line2);border-radius:10px;padding:8px 10px;background:#0d1622}
.bucket.hot{border-color:var(--acc);background:var(--accbg)}
.bucket h4{margin:2px 0 8px;font-size:14px;color:var(--acc)}
.bucket .in{display:flex;flex-wrap:wrap;gap:6px;min-height:52px}
.dznote{color:var(--dim);font-size:13px;margin:4px 0}
/* order */
.ordlist{list-style:none;margin:8px 0;padding:0}
.ordrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:6px 8px;min-height:56px;margin:7px 0}
.ordrow .otext{flex:1}
.ordrow .hnd{cursor:grab;touch-action:none;color:var(--dim);font-size:16px;padding:6px;min-width:36px;text-align:center;user-select:none}
.ordrow.ok{border-color:var(--okline);background:var(--okbg)}
.ordrow.bad{border-color:var(--badline);background:var(--badbg)}
.minibtn{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:#16222f;cursor:pointer}
.ordrow.lock .minibtn{display:none}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.85;box-shadow:0 8px 22px rgba(0,0,0,.5)}
/* fill */
.blanktxt{line-height:2.2}
.slot{display:inline-block;min-width:120px;min-height:44px;border:1.5px dashed var(--line2);border-radius:8px;background:#0d1622;padding:4px 10px;margin:0 2px;text-align:center;cursor:pointer;vertical-align:middle;font-family:var(--mono);font-size:14px}
.slot.filled{border-style:solid;background:#152333}
.slot.ok{border-color:var(--okline);background:var(--okbg)}
.slot.bad{border-color:var(--badline);background:var(--badbg)}
.slot.missed{border-color:var(--warnline);background:var(--warnbg)}
.slot select{font:inherit;min-height:44px;background:#0d1622;color:var(--txt);border:1px solid var(--line2);border-radius:8px;padding:6px;max-width:280px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.bank .blabel{width:100%}
/* code / spot / logs */
.codeblk{border:1px solid var(--line);border-radius:10px;background:var(--ink);padding:8px;margin:8px 0;overflow-x:auto}
.codeblk .cl{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:5px 8px;min-height:44px;cursor:pointer;font-family:var(--mono);font-size:14px;color:var(--txt)}
.codeblk .cl .lno{color:var(--dim);flex:none;width:30px;text-align:right}
.codeblk .cl[aria-pressed="true"]{background:var(--accbg);outline:1.5px solid var(--acc)}
.codeblk .cl.ok{background:var(--okbg);outline:1.5px solid var(--okline)}
.codeblk .cl.bad{background:var(--badbg);outline:1.5px solid var(--badline)}
.codeblk .cl.missed{background:var(--warnbg);outline:1.5px dashed var(--warnline)}
.codeblk .cl.plain{cursor:default}
.logblk{border:1px solid var(--line);border-radius:10px;background:var(--ink);padding:10px;margin:8px 0;max-height:380px;overflow:auto}
.logblk .ln{font-family:var(--mono);font-size:14px;white-space:pre-wrap;word-break:break-word;padding:1px 6px}
.logblk .ln.err{color:#ff9b93}
.logblk .ln.warn{color:#e8c06a}
.logblk .ln.dim{color:var(--dim)}
.logtools{display:flex;gap:8px;align-items:center;margin:6px 0}
.logtools input{flex:1;min-height:44px;background:var(--ink);border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:14px;padding:8px 12px}
/* terminal */
.term{border:1px solid var(--line);border-radius:10px;background:var(--ink);padding:10px;font-family:var(--mono);font-size:14px}
.term .thead{color:var(--dim);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:8px}
.term .thist{white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;min-height:120px}
.term .tout{color:#9fe0b0}
.term .terr{color:#ff9b93}
.term .tin{display:flex;gap:8px;align-items:center;margin-top:8px}
.term .tin .ps{color:var(--acc);font-weight:700}
.term .tin input{flex:1;min-height:44px;background:#0a1017;border:1px solid var(--line2);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:14px;padding:8px 12px}
.cmdlist{margin:8px 0}
.cmdline{font-family:var(--mono);font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);margin:5px 0;display:flex;gap:10px;align-items:center;background:var(--panel2)}
.cmdline.ok{border-color:var(--okline);background:var(--okbg)}
.cmdline.bad{border-color:var(--badline);background:var(--badbg)}
/* rows (rowselect) */
.rsrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:9px 0;background:var(--panel2)}
.rsrow .rlab{font-weight:600;margin-bottom:4px}
.rsrow .rctx{color:var(--mut);font-size:13.5px;margin-bottom:6px}
/* branch */
.decisions{margin:8px 0}
.decision{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;background:var(--panel2)}
.decision.ok{border-color:var(--okline);background:var(--okbg)}
.decision.bad{border-color:var(--badline);background:var(--badbg)}
.choices{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.choice{min-height:48px;text-align:left;padding:10px 14px;border-radius:8px;border:1px solid var(--line2);background:#152333;cursor:pointer}
.choice:hover{border-color:var(--acc);background:#1a2c40}
/* results */
.resbanner{border-radius:12px;border:1px solid;padding:18px;margin:12px 0;text-align:center}
.resbanner.pass{border-color:var(--okline);background:var(--okbg)}
.resbanner.fail{border-color:var(--badline);background:var(--badbg)}
.resbanner .big{font-size:44px;font-weight:800;font-family:var(--mono)}
.cert{border:2px solid var(--okline);outline:6px solid var(--okbg);border-radius:14px;padding:26px;margin:16px auto;max-width:560px;text-align:center;background:linear-gradient(180deg,#0e2417,#0b1a12)}
.cert .ct1{font-size:13px;letter-spacing:.28em;color:var(--ok);text-transform:uppercase}
.cert .ct2{font-size:24px;font-weight:800;margin:10px 0}
.cert .ct3{color:var(--mut)}
.repcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.repcard .rhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.repcard .rtitle{font-weight:700}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid}
.badge.full{color:var(--ok);border-color:var(--okline);background:var(--okbg)}
.badge.part{color:var(--warn);border-color:var(--warnline);background:var(--warnbg)}
.badge.zero{color:var(--bad);border-color:var(--badline);background:var(--badbg)}
.badge.skip{color:var(--warn);border-color:var(--warnline);background:var(--warnbg)}
.badge.na{color:var(--dim);border-color:var(--line)}
.rsec{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.rsec .rl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--acc);display:block;margin-bottom:3px}
.skipnote{color:var(--warn);font-size:13.5px}
/* keywords */
.kwtheme{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--panel2)}
.kwtheme h3{margin:0 0 6px;font-size:14.5px;color:var(--acc)}
.kwpill{display:inline-block;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);margin:3px 5px 3px 0;background:#101c2c}
.themebar{height:6px;background:#1a2532;border-radius:4px;margin:8px 0 2px;overflow:hidden}
.themebar .tf{height:100%;background:#2f7ec2;transition:width .4s}
.thstat{font-size:12.5px;color:var(--dim)}
/* intro */
.introcard{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(180deg,#101a26,#0d141d)}
.metastr{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mchip{border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:13px;background:var(--accbg);color:var(--acc)}
.rules{border:1px solid var(--line);border-radius:10px;padding:4px 14px 10px;margin:12px 0;background:var(--panel2)}
.rules li{margin:6px 0}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,6,10,.72);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:760px;width:100%;padding:16px 18px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
/* toast */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#182737;border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:10px 18px;max-width:80vw;display:none;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* paused blur */
#examwrap.paused{filter:blur(12px);pointer-events:none;user-select:none}
pre{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;margin:8px 0;font-family:var(--mono);font-size:14px;white-space:pre-wrap;word-break:break-word;color:var(--txt)}
code{background:#0d1622;border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:14px}
pre code{background:none;padding:0}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:720px){
  .navrow{flex-direction:column}
  #qnav{order:2}
  .htitle span#htext{display:none}
  .buckets{flex-direction:column}
  .bucket{width:100%}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

</style>

      <div class="htitle"><span id="sevbadge" class="sev"></span><span id="htext"></span></div>

        <span id="hudscore" class="hud" title="Points earned so far">0 pts</span>

        <button id="btnpause" class="hbtn" type="button">Pause</button>
        <button id="btnfinish" class="hbtn warnb" type="button">Finish</button>
      </div>
    </div>
    <div class="pbar"><div id="pfill" class="pfill"></div></div>

        </div>
      </div>

</div>

    <div id="kwmbody"></div>
  </div>
