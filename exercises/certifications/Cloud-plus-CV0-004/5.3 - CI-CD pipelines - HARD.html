function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2600); }

/* ---------- state ---------- */
var st = {
  phase: 'intro', order: [], pos: 0,
  ans: {}, dirty: {}, graded: {}, skipped: {}, hint: {}, prep: {},
  manual: false, checkp: false, finished: false, reported: false,
  remaining: CFG.minutes * 60, user: ''
};
function curQ() { return QS[st.order[st.pos]]; }
function curPrep() { return st.prep[curQ().id]; }
function touch(id) { st.dirty[id] = true; }

/* ---------- prepare (shuffle once per attempt) ---------- */
function prepInner(d) {
  d = JSON.parse(JSON.stringify(d));
  if (d.type === 'qcm' || d.type === 'multi') d.options = shuffle(d.options);
  if (d.type === 'rowselect') d.rows.forEach(function (r) { r.options = shuffle(r.options); });
  if (d.type === 'categorize') { d.items = shuffle(d.items); d.buckets = shuffle(d.buckets); }
  if (d.type === 'order') d.order = shuffle(d.items.map(function (_, i) { return i; }));
  if (d.type === 'fill') {
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.mode === 'select') d.parts.forEach(function (p) { if (p && typeof p === 'object' && p.opts) p.opts = shuffle(p.opts); });
  }
  if (d.type === 'branch') Object.keys(d.nodes).forEach(function (k) { if (d.nodes[k].choices) d.nodes[k].choices = shuffle(d.nodes[k].choices); });
  return d;
}
function prepare(q) {
  var d = JSON.parse(JSON.stringify(q.data));
  if (q.type === 'qcm' || q.type === 'multi') d.options = shuffle(d.options);
  if (q.type === 'rowselect') d.rows.forEach(function (r) { r.options = shuffle(r.options); });
  if (q.type === 'categorize') { d.items = shuffle(d.items); d.buckets = shuffle(d.buckets); }
  if (q.type === 'order') d.order = shuffle(d.items.map(function (_, i) { return i; }));
  if (q.type === 'fill') {
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.mode === 'select') d.parts.forEach(function (p) { if (p && typeof p === 'object' && p.opts) p.opts = shuffle(p.opts); });
  }
  if (q.type === 'branch') {
    Object.keys(d.nodes).forEach(function (k) { if (d.nodes[k].choices) d.nodes[k].choices = shuffle(d.nodes[k].choices); });
    d.maxDepth = depth(d.start, d.nodes, {});
  }
  if (q.type === 'logview') {
    d.task = prepInner(d.task);
    d.taskType = d.task.type;
  }
  if (q.type === 'terminal') {
    d.out = (d.outputs || []).map(function (o) { return { re: new RegExp(o.re, 'i'), out: o.out }; });
    d.req = (d.required || []).map(function (r) { return { re: new RegExp(r.re, 'i'), ex: r.ex || '', note: r.note || '' }; });
  }
  return d;
}
function depth(id, nodes, seen) {
  var n = nodes[id]; if (!n || !n.choices || !n.choices.length || seen[id]) return 0;
  seen[id] = 1; var m = 0;
  n.choices.forEach(function (c) { m = Math.max(m, 1 + depth(c.next, nodes, seen)); });
  delete seen[id]; return m;
}

/* ---------- HUD / pause ---------- */
function running() { return st.phase === 'exam' && !st.manual && !st.checkp && !st.finished; }
setInterval(function () {
  if (running()) {
    st.remaining--;
    if (st.remaining <= 0) { st.remaining = 0; updateHUD(); finishExam(true); return; }
    updateHUD();
  }
}, 1000);
function updateHUD() {
  var tm = $('hudtimer');
  tm.textContent = fmt(st.remaining);
  tm.className = 'hud' + (st.remaining < 60 ? ' crit' : st.remaining < 300 ? ' low' : '');
  var earned = 0, gradedN = 0, skipN = 0, maxN = QS.length;
  QS.forEach(function (q) {
    if (st.skipped[q.id]) { skipN++; return; }
    if (st.graded[q.id]) { earned += st.graded[q.id].earned; gradedN++; }
  });
  earned = Math.round(earned * 10) / 10;
  $('hudscore').textContent = earned + ' pts · ' + gradedN + '/' + maxN + ' graded' + (skipN ? ' · ' + skipN + ' skipped' : '');
  $('pfill').style.width = Math.round(((st.pos + (st.phase === 'exam' ? 1 : 0)) / maxN) * 100) + '%';
  var pb = $('pausebar'); pb.innerHTML = '';
  if (st.manual) { var p1 = el('span', 'pill man', '⏸ Paused (manual) — exercise hidden. Press Resume to continue.'); pb.appendChild(p1); }
  if (st.checkp && !st.finished) { var p2 = el('span', 'pill rev', '✓ Timer paused — review mode. Feedback is visible; press Next to resume the clock.'); pb.appendChild(p2); }
  $('btnpause').textContent = st.manual ? 'Resume' : 'Pause';
  var exwrap = $('examwrap');
  if (exwrap) exwrap.classList.toggle('paused', st.manual && !st.finished);
}
function doPause() {
  if (st.phase !== 'exam' || st.finished) return;
  st.manual = !st.manual; updateHUD();
  if (st.manual) toast('Timer stopped. Exercise content is hidden while paused.');
}

/* ---------- rendering one question ---------- */
function renderQuestion(focusHead) {
  var q = curQ(), prep = curPrep();
  var card = $('excard'); card.innerHTML = '';
  var head = el('div', 'box scen');
  var t = el('div'); t.appendChild(el('span', 'ptchip', 'Exercise ' + (st.pos + 1) + ' / ' + QS.length + ' · ' + q.points + ' pt' + (q.points === 1 ? '' : 's')));
  var hd = el('h2', null, q.title); hd.id = 'exhead'; hd.tabIndex = -1; t.appendChild(hd);
  var tr = el('div', 'tagrow');
  q.tags.forEach(function (tg) { tr.appendChild(el('span', 'kwchip', tg)); });
  t.appendChild(tr); head.appendChild(t); card.appendChild(head);

  var s = el('div', 'box scen'); s.appendChild(el('span', 'blabel', 'SCENARIO')); h(s, s.innerHTML + q.scenario); card.appendChild(s);
  var qs = el('div', 'box quest'); qs.appendChild(el('span', 'blabel', 'QUESTION — WHAT DO YOU DO?')); h(qs, qs.innerHTML + q.question); card.appendChild(qs);

  var ans = el('div', 'box ansbox'); ans.appendChild(el('span', 'blabel', answerLabel(q.type)));
  var abox = el('div'); ans.appendChild(abox); card.appendChild(ans);
  var gr = st.graded[q.id];
  R[q.type].render(abox, q, prep, gr ? { mode: 'graded', res: gr.res } : { mode: 'answer' });

  if (st.hint[q.id] && !gr) {
    var hb = el('div', 'fb part');
    var hl = el('div', 'fbline'); hl.appendChild(el('span', 'ic', '?')); hl.appendChild(el('span', null, 'Hint in use (−10% on Check):'));
    hb.appendChild(hl); hb.appendChild(h(el('div', 'exp'), q.hint));
    card.appendChild(hb);
  }

  var fb = el('div', 'fb fover'); fb.id = 'fbbox'; card.appendChild(fb);
  if (gr) showFeedback(fb, q, gr);

  var acts = el('div', 'acts');
  if (!gr) {
    var bc = el('button', 'abtn go', '✓ Check'); bc.type = 'button'; bc.addEventListener('click', doCheck); acts.appendChild(bc);
    var bh = el('button', 'abtn warn', 'Hint (−10%)'); bh.type = 'button'; bh.addEventListener('click', doHint);
    if (st.hint[q.id]) { bh.disabled = true; bh.textContent = 'Hint used'; }
    acts.appendChild(bh);
  } else {
    var br = el('button', 'abtn', '✎ Revise'); br.type = 'button'; br.addEventListener('click', doRevise); acts.appendChild(br);
  }
  var bs = el('button', 'abtn warn', '⤼ Skip'); bs.type = 'button'; bs.addEventListener('click', doSkip); acts.appendChild(bs);
  card.appendChild(acts);
  updateHUD();
  /* Focus management: navigation/check re-renders move focus to the exercise

  var refSel = st._refocusSel; st._refocusSel = null;
  var refNode = refSel ? card.querySelector(refSel) : null;
  if (refNode) { try { refNode.focus(); } catch (e) { } }
  else if (focusHead) { try { hd.focus({ preventScroll: false }); } catch (e) { hd.focus(); } }
}
function answerLabel(t) {
  return { qcm: 'CHOOSE ONE', multi: 'SELECT ALL THAT APPLY', categorize: 'DRAG OR CLICK TO PLACE', order: 'PUT IN THE RIGHT ORDER', fill: 'FILL IN THE BLANKS', terminal: 'TYPE THE COMMAND', logview: 'ANSWER', branch: 'MAKE THE CALLS', rowselect: 'CHOOSE ONE PER ROW', spot: 'CLICK THE PROBLEM LINES' }[t] || 'ANSWER';
}
function showFeedback(fb, q, gr) {
  fb.className = 'fb ' + (gr.earned >= gr.points ? 'good' : gr.earned <= 0 ? 'zero' : 'part');
  fb.innerHTML = '';
  var line = el('div', 'fbline');
  var label = gr.earned >= gr.points ? '✓ Correct' : gr.earned <= 0 ? '✗ Wrong' : '◐ Partially correct';
  line.appendChild(el('span', 'ic', gr.earned >= gr.points ? '✓' : gr.earned <= 0 ? '✗' : '◐'));
  line.appendChild(el('span', null, label + ' — you earned ' + gr.earned + ' / ' + gr.points + ' points (' + gr.ok + ' of ' + gr.n + ' elements right).'));
  fb.appendChild(line);
  if (st.hint[q.id]) fb.appendChild(el('div', 'hintnote', 'Includes the −10% hint penalty (−' + (Math.round(q.points * 0.1 * 10) / 10) + ' pt).'));
  var ca = el('div', 'rsec'); ca.appendChild(el('span', 'rl', 'CORRECT ANSWER'));
  h(ca, ca.innerHTML + R[q.type].correctHtml(q, prep0(q)));
  fb.appendChild(ca);
  var ex = el('div', 'rsec exp'); ex.appendChild(el('span', 'rl', 'WHY'));
  h(ex, ex.innerHTML + q.explain);
  fb.appendChild(ex);
  fb.style.display = 'block';
}
function prep0(q) { return st.prep[q.id]; }

/* ---------- actions ---------- */
function doCheck() {
  var q = curQ(); if (!q || st.graded[q.id] || st.finished) return;
  var res = R[q.type].grade(q, curPrep());
  var n = res.n || 1, ok = res.ok || 0;
  var raw = q.points * ok / n;
  var pen = st.hint[q.id] ? q.points * 0.1 : 0;
  var earned = Math.max(0, Math.round((raw - pen) * 10) / 10);
  st.graded[q.id] = { n: n, ok: ok, earned: earned, points: q.points, res: res };
  delete st.skipped[q.id];
  st.checkp = true;
  renderQuestion(true); buildNav();
  toast('Answer locked. Timer paused in review mode — press Next to resume.');
}
function doRevise() {
  var q = curQ(); if (!q || !st.graded[q.id]) return;
  delete st.graded[q.id];
  renderQuestion(true); buildNav();
  toast('Answer unlocked. Check again when you are ready (timer keeps running).');
}
function doHint() {
  var q = curQ(); if (!q || st.hint[q.id] || st.graded[q.id]) return;
  st.hint[q.id] = true;
  var fb = $('fbbox');
  fb.className = 'fb part'; fb.style.display = 'block'; fb.innerHTML = '';
  var line = el('div', 'fbline'); line.appendChild(el('span', 'ic', '?')); line.appendChild(el('span', null, 'Hint (costs 10% of this exercise\u2019s points if you Check):'));
  fb.appendChild(line); fb.appendChild(h(el('div', 'exp'), q.hint));
  var note = el('div', 'hintnote', 'Using a hint does not pause the timer. The penalty applies when you press Check.');
  fb.appendChild(note);
  renderQuestion._keepfb = true;
  var acts = $('excard').querySelector('.acts');
  if (acts) { var bb = acts.querySelector('.abtn.warn'); if (bb) { bb.disabled = true; bb.textContent = 'Hint used'; } }
  toast('Hint shown \u2014 it will cost 10% of this exercise\u2019s points.');
}
function doSkip() {
  var q = curQ(); if (!q || st.finished) return;
  var go = true;
  if (st.graded[q.id]) go = window.confirm('This exercise is already graded. Skip it and EXCLUDE it from scoring?');
  if (!go) return;
  st.skipped[q.id] = true;
  delete st.graded[q.id];
  delete st.dirty[q.id];
  toast('Skipped — you can come back to it before the timer ends.');
  goNext(true);
}
function goPrev() {
  if (st.pos > 0) {
    /* Leaving the reviewed exercise ends its Check-pause: review mode applies
       only while the checked exercise is on screen, so the clock cannot stay
       frozen over unrelated exercises. */
    st.checkp = false; st.pos--;
    renderQuestion(true); buildNav();
  }
}
function goNext(silent) {
  st.checkp = false;
  if (st.pos < QS.length - 1) { st.pos++; renderQuestion(true); buildNav(); }
  else { updateHUD(); buildNav(); if (!silent) toast('Last exercise. Review anything, then press Finish.'); }
}

/* ---------- navigator ---------- */
function buildNav() {
  var nav = $('qnav'); nav.innerHTML = '';
  st.order.forEach(function (qi, pos) {
    var q = QS[qi];
    var b = el('button', 'tile', String(pos + 1)); b.type = 'button';
    var g = st.graded[q.id];
    var ic = '';
    if (st.skipped[q.id]) { b.classList.add('skip'); ic = 'S'; }
    else if (g) {
      if (g.earned >= g.points) { b.classList.add('full'); ic = '✓'; }
      else if (g.earned <= 0) { b.classList.add('zero'); ic = '✗'; }
      else { b.classList.add('part'); ic = '◐'; }
    }
    if (ic) { var s = el('span', 'tic', ic); b.appendChild(s); b.title = 'Exercise ' + (pos + 1) + (ic === 'S' ? ' — skipped' : '') ; }
    if (pos === st.pos) b.classList.add('cur');
    b.addEventListener('click', function () {
      if (pos !== st.pos) st.checkp = false; /* same rule as Prev */
      st.pos = pos; renderQuestion(true); buildNav();
    });
    nav.appendChild(b);
  });
  $('btnprev').disabled = st.pos === 0;
}

/* ---------- finish / results ---------- */
function isEmptyAns(q) {
  try { return R[q.type].isEmpty(q, st.prep[q.id]); } catch (e) { return true; }
}
function finishExam(auto) {
  if (st.finished) return;
  var unanswered = 0, countable = 0;
  QS.forEach(function (q) {
    if (!st.graded[q.id] && !st.skipped[q.id] && isEmptyAns(q)) unanswered++;
    if (!st.skipped[q.id] && (st.graded[q.id] || !isEmptyAns(q))) countable++;
  });
  if (!auto && countable === 0) { toast('Answer at least one exercise before finishing.'); return; }
  if (!auto && unanswered > 0) {
    if (!window.confirm(unanswered + ' exercise(s) have no validated answer. They will NOT be counted in the score. Finish anyway?')) return;
  }
  st.finished = true; st.phase = 'results'; st.manual = false; st.checkp = false;
  QS.forEach(function (q) {
    var id = q.id;
    if (st.graded[id] || st.skipped[id]) return;
    if (!isEmptyAns(q)) {
      var res = R[q.type].grade(q, st.prep[id]);
      var raw = q.points * (res.ok || 0) / (res.n || 1);
      var pen = st.hint[id] ? q.points * 0.1 : 0;
      st.graded[id] = { n: res.n || 1, ok: res.ok || 0, earned: Math.max(0, Math.round((raw - pen) * 10) / 10), points: q.points, res: res, auto: true };
    }
  });
  var total = 0, earned = 0;
  QS.forEach(function (q) {
    if (st.skipped[q.id]) return;
    /* Never-answered exercises are excluded from BOTH the points earned and
       the total possible (site contract: score/total count only answered
       exercises; the finish dialog and intro say the same). */
    if (!st.graded[q.id] && isEmptyAns(q)) return;
    total += q.points;
    if (st.graded[q.id]) earned += st.graded[q.id].earned;
  });
  earned = Math.round(earned * 10) / 10;
  var reported = Math.round(earned);
  var pct = total > 0 ? Math.round(reported / total * 100) : 0;
  renderResults(earned, total, pct);
  $('hdr').hidden = true; $('exam').hidden = true; $('results').hidden = false;
  updateHUD();
  if (total > 0) reportScore(reported, total, pct);
}
function reportScore(score, total, pct) {
  if (st.reported) return;
  st.reported = true;
  try {
    parent.postMessage({ type: 'CYBERPULSE_SCORE', topicId: CFG.topicId, score: score, total: total, percent: pct, passed: pct >= PASS }, location.origin);
  } catch (e) { /* opened directly, nothing to report to */ }
}
function renderResults(earned, total, pct) {

  ban.appendChild(el('h2', null, pass ? '✓ PASS' : '✗ FAIL'));
  if (pass) {

    box.appendChild(cert);
  } else {
    ban.appendChild(el('p', null, 'You must retake this exam to reach the ' + PASS + '% pass mark. Review the report below, then press Retake Exam.'));
  }
  box.appendChild(ban);

  var skipped = QS.filter(function (q) { return st.skipped[q.id]; });
  var na = QS.filter(function (q) { return !st.skipped[q.id] && !st.graded[q.id]; });
  if (skipped.length || na.length) {
    var sn = el('div', 'box quest');
    sn.appendChild(el('span', 'blabel', 'NOT COUNTED'));
    if (skipped.length) sn.appendChild(h(el('p', 'skipnote'), '<b>Skipped (' + skipped.length + '):</b> ' + skipped.map(function (q) { return q.title; }).join(' · ') + ' — excluded from both the points earned and the total.'));
    if (na.length) sn.appendChild(h(el('p', 'skipnote'), '<b>Never answered (' + na.length + '):</b> ' + na.map(function (q) { return q.title; }).join(' · ') + ' — excluded as well.'));
    box.appendChild(sn);

      sk ? 'SKIPPED — not counted' : !g ? 'NOT ANSWERED — not counted' : g.earned >= g.points ? 'FULL — ' + g.earned + '/' + g.points : g.earned <= 0 ? 'ZERO — 0/' + g.points : 'PARTIAL — ' + g.earned + '/' + g.points);
    rh.appendChild(badge); card.appendChild(rh);
    var tr = el('div', 'tagrow'); q.tags.forEach(function (tg) { tr.appendChild(el('span', 'kwchip', tg)); }); card.appendChild(tr);
    if (g) {
      var ua = el('div', 'rsec'); ua.appendChild(el('span', 'rl', 'YOUR ANSWER'));
      h(ua, ua.innerHTML + R[q.type].userHtml(q, st.prep[q.id]));
      card.appendChild(ua);
    }
    var ca = el('div', 'rsec'); ca.appendChild(el('span', 'rl', 'CORRECT ANSWER'));
    h(ca, ca.innerHTML + R[q.type].correctHtml(q, st.prep[q.id]));
    card.appendChild(ca);
    var ex = el('div', 'rsec exp'); ex.appendChild(el('span', 'rl', 'EXPLANATION' + (sk ? ' (you skipped this one — read it anyway)' : '')));
    h(ex, ex.innerHTML + q.explain);
    card.appendChild(ex);
    box.appendChild(card);
  });
  var acts = el('div', 'acts'); acts.style.justifyContent = 'center';
  var rt = el('button', 'abtn primary', '⟳ Retake Exam'); rt.type = 'button';
  rt.addEventListener('click', retake);
  acts.appendChild(rt); box.appendChild(acts);

          var m = view.res.mark[idx];
          s.classList.add(m === 'ok' ? 'ok' : m === 'bad' ? 'bad' : 'missed');
          s.disabled = true;
          s.appendChild(el('span', 'markic ' + (m === 'ok' ? 'ok' : m === 'bad' ? 'bad' : 'missed'),
            m === 'ok' ? '✓' : m === 'bad' ? '✗' : 'MISSED'));
        } else {
          s.addEventListener('click', function () {
            if (ans[idx]) { ans[idx] = null; touch(q.id); st._refocusSel = '#slot-' + q.id + '-' + idx; renderQuestion(); }
          });
        }
        txt.appendChild(s);
      })(slotN++);
    });
    box.appendChild(txt);
    if (!graded) {
      var bank = el('div', 'bank'); bank.appendChild(el('span', 'blabel', 'WORD BANK (shuffled — click a word to fill the next empty blank)'));
      var used = {};
      ans.forEach(function (w) { if (w) used[w] = (used[w] || 0) + 1; });
      prep.bank.forEach(function (w) {
        if (used[w]) { used[w]--; return; }
        var c = el('button', 'chip', w); c.type = 'button';
        c.addEventListener('click', function () {
          var i = ans.indexOf(null);
          if (i < 0) { toast('All blanks are filled — click a blank to empty it first.'); return; }
          ans[i] = w; touch(q.id); st._refocusSel = '#slot-' + q.id + '-' + i; renderQuestion();
        });
        bank.appendChild(c);
      });
      box.appendChild(bank);
    }
  },
  grade: function (q, prep) {
    var ans = st.ans[q.id] || [];
    var slots = prep.parts.filter(function (p) { return typeof p !== 'string'; });
    var mark = {}, ok = 0;
    slots.forEach(function (p, i) {
      if (ans[i] == null || ans[i] === '') { mark[i] = 'missed'; return; }
      if (norm(ans[i]) === norm(p.a)) { mark[i] = 'ok'; ok++; } else mark[i] = 'bad';
    });
    return { n: slots.length, ok: ok, mark: mark };
  },
  isEmpty: function (q, prep) {
    var ans = st.ans[q.id] || [];
    var slots = prep.parts.filter(function (p) { return typeof p !== 'string'; });
    return slots.every(function (_, i) { return ans[i] == null || ans[i] === ''; });
  },
  userHtml: function (q, prep) {
    var ans = st.ans[q.id] || [];
    return '<ol>' + prep.parts.filter(function (p) { return typeof p !== 'string'; }).map(function (p, i) {
      return '<li><code>' + p.a.replace(/</g, '&lt;') + '</code> → you: <b>' + (ans[i] == null ? '—' : String(ans[i]).replace(/</g, '&lt;')) + '</b></li>';
    }).join('') + '</ol>';
  },
  correctHtml: function (q, prep) {
    return '<ol>' + prep.parts.filter(function (p) { return typeof p !== 'string'; }).map(function (p) { return '<li><code>' + p.a.replace(/</g, '&lt;') + '</code></li>'; }).join('') + '</ol>';
  }
};
function renderFillSelect(box, q, prep, view) {
  var graded = view.mode === 'graded';
  var ans = st.ans[q.id] || (st.ans[q.id] = prep.parts.map(function (p) { return typeof p === 'string' ? null : ''; }));
  var txt = el('div', 'blanktxt');
  var slotN = 0;
  prep.parts.forEach(function (p) {

    (function (idx) {

      var o0 = el('option', null, '— choose —'); o0.value = ''; sel.appendChild(o0);
      p.opts.forEach(function (o) { var op = el('option', null, o); op.value = o; sel.appendChild(op); });
      sel.value = ans[idx] || '';
      if (graded) {
        var m = view.res.mark[idx];
        sel.className = m === 'ok' ? 'ok' : m === 'bad' ? 'bad' : 'missed';
        sel.disabled = true;
        txt.appendChild(sel);
        txt.appendChild(el('span', 'markic ' + (m === 'ok' ? 'ok' : m === 'bad' ? 'bad' : 'missed'),
          m === 'ok' ? '✓' : m === 'bad' ? '✗' : 'MISSED'));
      } else {
        sel.addEventListener('change', function () { st.ans[q.id][idx] = sel.value; touch(q.id); });
        txt.appendChild(sel);
      }

  box.appendChild(txt);
}

/* ============ renderers part B ============ */

/* ---------- terminal emulator ---------- */
function fsSim(d, cmd) {
  var m;
  if (/^\s*ls\b/.test(cmd)) return Object.keys(d.files || {}).join('\n');
  m = cmd.match(/^\s*cat\s+(\S+)\s*$/);
  if (m) return (d.files || {})[m[1]] != null ? d.files[m[1]] : 'cat: ' + m[1] + ': No such file';
  m = cmd.match(/^\s*tail\s+(?:-n\s*(\d+)|-(\d+))\s+(\S+)\s*$/);
  if (m) {
    var f = (d.files || {})[m[3]];
    if (f == null) return 'tail: ' + m[3] + ': No such file';
    var n = parseInt(m[1] || m[2], 10) || 10;
    return f.split('\n').slice(-n).join('\n');
  }
  m = cmd.match(/^\s*grep\s+((?:-[aiv]+\s+)*)(['"]?)(.*?)\2\s+(\S+)\s*$/);
  if (m) {
    var flags = m[1] || '';
    var ci = /i/.test(flags), cnt = /c/.test(flags), num = /n/.test(flags);
    var pat = m[3], file = m[4];
    var txt = (d.files || {})[file];
    if (txt == null) return 'grep: ' + file + ': No such file';
    var re; try { re = new RegExp(pat, ci ? 'i' : ''); } catch (e) { return 'grep: bad pattern'; }
    var lines = txt.split('\n'), out = [], ln = 0;
    lines.forEach(function (L) { ln++; if (re.test(L)) out.push((num ? ln + ':' : '') + L); });
    if (cnt) return String(out.length);
    return out.length ? out.join('\n') : '';
  }
  m = cmd.match(/^\s*wc\s+-l\s+(\S+)\s*$/);
  if (m) { var f2 = (d.files || {})[m[1]]; return f2 == null ? 'wc: no such file' : String(f2.split('\n').length); }
  return null;
}
R.terminal = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = []);
    var graded = view.mode === 'graded';
    var term = el('div', 'term');
    term.appendChild(h(el('div', 'thead'), (prep.banner || []).map(function (l) { return '<div>' + l.replace(/</g, '&lt;') + '</div>'; }).join('')));
    var hist = el('div', 'thist'); term.appendChild(hist);
    function echo(cmd, out, cls) {
      var line = el('div', null, '$ ' + cmd); hist.appendChild(line);
      if (out != null) hist.appendChild(h(el('div', cls || 'tout'), out.replace(/&/g, '&amp;').replace(/</g, '&lt;')));
      hist.scrollTop = hist.scrollHeight;
    }
    ans.forEach(function (c) { echo(c.cmd, c.out, c.cls); });
    if (!graded) {
      var fin = el('div', 'tin');
      fin.appendChild(el('span', 'ps', '$'));
      var inp = el('input'); inp.type = 'text'; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      fin.appendChild(inp);
      var run = el('button', 'minibtn', 'Run'); run.type = 'button';
      fin.appendChild(run); term.appendChild(fin);
      function exec() {
        var cmd = inp.value.trim();
        if (!cmd) return;
        inp.value = '';
        var out = null, cls = 'tout';
        var sim = fsSim(prep, cmd);
        for (var i = 0; i < prep.out.length && sim == null; i++) if (prep.out[i].re.test(cmd)) { sim = prep.out[i].out; break; }
        if (sim == null && /^\s*clear\s*$/i.test(cmd)) { ans.push({ cmd: cmd, out: null }); touch(q.id); hist.innerHTML = ''; return; }
        if (sim == null) { sim = 'sh: command not found: ' + cmd.split(' ')[0]; cls = 'terr'; }
        ans.push({ cmd: cmd, out: sim, cls: cls });
        touch(q.id);
        echo(cmd, sim, cls);
      }
      run.addEventListener('click', exec);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') exec(); });
    }
    box.appendChild(term);
    if (graded) {
      var list = el('div', 'cmdlist');
      prep.req.forEach(function (rq, i) {
        var okCmd = (st.ans[q.id] || []).filter(function (c) { return rq.re.test(c.cmd); })[0];
        var d = el('div', 'cmdline ' + (okCmd ? 'ok' : 'bad'));
        d.appendChild(el('span', 'markic ' + (okCmd ? 'ok' : 'bad'), okCmd ? '✓ MET' : '✗ NOT MET'));
        d.appendChild(el('span', null, 'Requirement ' + (i + 1) + (rq.note ? ': ' + rq.note : '') + (okCmd ? '' : rq.ex ? ' — e.g. ' + rq.ex : '')));
        list.appendChild(d);
      });
      box.appendChild(list);
    }
  },
  grade: function (q, prep) {
    var cmds = (st.ans[q.id] || []).map(function (c) { return c.cmd; });
    var ok = 0;
    prep.req.forEach(function (rq) { if (cmds.some(function (c) { return rq.re.test(c); })) ok++; });
    return { n: prep.req.length, ok: ok, mark: {} };
  },
  isEmpty: function (q) { return !(st.ans[q.id] || []).length; },
  userHtml: function (q) {
    var a = st.ans[q.id] || [];
    return a.length ? '<div class="cmdlist">' + a.map(function (c) { return '<div class="cmdline"><code>' + c.cmd.replace(/</g, '&lt;') + '</code></div>'; }).join('') + '</div>' : '<p>—</p>';
  },
  correctHtml: function (q, prep) {
    return '<ul>' + prep.req.map(function (r) { return '<li>' + (r.note ? r.note + ' — ' : '') + '<code>' + r.ex + '</code></li>'; }).join('') + '</ul>';
  }
};

/* ---------- log viewer ---------- */
function logLines(prep, filter, gradedCls) {
  var f = (filter || '').trim();
  var re = null;
  if (f.length > 1 && f.charAt(0) === '/' && f.charAt(f.length - 1) === '/') {
    try { re = new RegExp(f.slice(1, -1), 'i'); } catch (e) { re = null; }
  }
  var wrap = el('div', 'logblk');
  prep.log.forEach(function (L) {
    var match = !f || (re ? re.test(L.t) : L.t.toLowerCase().indexOf(f.toLowerCase()) >= 0);
    if (!match) return;
    var cls = 'ln ' + (L.c || '') + (gradedCls || '');
    var d = el('div', cls, L.t);
    wrap.appendChild(d);
  });
  return wrap;
}
R.logview = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = { f: '' });
    var tools = el('div', 'logtools');
    tools.appendChild(el('span', 'dznote', 'Filter:'));
    var inp = el('input'); inp.type = 'text'; inp.placeholder = 'text or /regex/  — e.g. error or /probe/i'; inp.value = ans.f;
    inp.setAttribute('aria-label', 'Log filter');
    tools.appendChild(inp); box.appendChild(tools);
    var holder = el('div'); box.appendChild(holder);
    function redraw() { holder.innerHTML = ''; holder.appendChild(logLines(prep, ans.f)); }
    redraw();
    inp.addEventListener('input', function () { ans.f = inp.value; touch(q.id); redraw(); });
    var tbox = el('div'); tbox.appendChild(el('span', 'blabel', 'YOUR ANSWER'));
    box.appendChild(tbox);
    var innerView = view.mode === 'graded' ? { mode: 'graded', res: view.res } : { mode: 'answer' };
    R[prep.taskType].render(tbox, shQ(q), prep.task, innerView);
  },
  grade: function (q, prep) { return R[prep.taskType].grade(shQ(q), prep.task); },
  isEmpty: function (q, prep) { return R[prep.taskType].isEmpty(shQ(q), prep.task); },
  userHtml: function (q, prep) { return R[prep.taskType].userHtml(shQ(q), prep.task); },
  correctHtml: function (q, prep) { return R[prep.taskType].correctHtml(shQ(q), prep.task); }
};
function shQ(q) { return Object.assign({}, q, { id: q.id + '::task' }); }

/* ---------- branching scenario ---------- */
R.branch = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = []);
    var graded = view.mode === 'graded';
    var wrap = el('div');
    if (ans.length) {
      var dl = el('div', 'decisions'); dl.appendChild(el('span', 'blabel', 'YOUR DECISIONS SO FAR'));
      ans.forEach(function (d, i) {
        var dd = el('div', 'decision' + (graded ? (view.res.mark[i] === 'ok' ? ' ok' : ' bad') : ''));
        dd.appendChild(el('b', null, 'Step ' + (i + 1) + ': ' + prep.nodes[d.node].choices[d.ci].t));
        if (graded) {
          var okm = view.res.mark[i] === 'ok';
          dd.appendChild(el('span', 'markic ' + (okm ? 'ok' : 'bad'), okm ? '✓ GOOD CALL' : '✗ NOT THE BEST CALL'));
          var fb = prep.nodes[d.node].choices[d.ci].fb;
          if (fb) dd.appendChild(h(el('div', 'rctx'), fb));
        }
        dl.appendChild(dd);
      });
      wrap.appendChild(dl);
    }
    var node = ans.length ? walkEnd(prep, ans) : prep.start;
    var nd = prep.nodes[node];
    if (nd && nd.end) {
      wrap.appendChild(h(el('div', 'box quest'), '<span class="blabel">END OF SCENARIO</span><p>' + nd.scene + '</p><p class="dznote">Press Check to see how your calls score against the best path.</p>'));
    } else if (nd) {
      var sc = el('div', 'box scen'); sc.appendChild(el('span', 'blabel', 'STEP ' + (ans.length + 1)));
      h(sc, sc.innerHTML + '<p>' + nd.scene + '</p>');
      wrap.appendChild(sc);
      var chs = el('div', 'choices');
      nd.choices.forEach(function (c, ci) {
        var b = el('button', 'choice', c.t); b.type = 'button';
        b.addEventListener('click', function () {
          st.ans[q.id].push({ node: node, ci: ci });
          touch(q.id);
          st._refocusSel = '.choices button.choice';
          renderQuestion();
        });
        chs.appendChild(b);
      });
      wrap.appendChild(chs);
      if (ans.length) {
        var rst = el('button', 'abtn warn', '⟲ Restart this scenario'); rst.type = 'button';
        rst.addEventListener('click', function () { st.ans[q.id] = []; touch(q.id); renderQuestion(); });
        wrap.appendChild(rst);
      }
    }
    box.appendChild(wrap);
  },
  grade: function (q, prep) {
    var ans = st.ans[q.id] || [], mark = {}, ok = 0, n = prep.maxDepth || ans.length || 1;
    ans.forEach(function (d, i) {
      var c = prep.nodes[d.node].choices[d.ci];
      if (c.ok) { mark[i] = 'ok'; ok++; } else mark[i] = 'bad';
    });
    return { n: n, ok: ok, mark: mark };
  },
  isEmpty: function (q) { return !(st.ans[q.id] || []).length; },
  userHtml: function (q, prep) {
    var ans = st.ans[q.id] || [];
    return ans.length ? '<ol>' + ans.map(function (d) { return '<li>' + prep.nodes[d.node].choices[d.ci].t + '</li>'; }).join('') + '</ol>' : '<p>—</p>';
  },
  correctHtml: function (q, prep) {
    var path = bestPath(prep);
    return '<ol>' + path.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>';
  }
};
function walkEnd(prep, ans) {
  var node = prep.start;
  for (var i = 0; i < ans.length; i++) {
    var c = prep.nodes[node].choices[ans[i].ci];
    if (!c || !c.next) return null;
    node = c.next;
  }
  return node;
}
function bestPath(prep) {
  var out = [], node = prep.start, guard = 0;
  while (node && guard++ < 8) {
    var nd = prep.nodes[node];
    if (!nd || !nd.choices) break;
    var good = nd.choices.filter(function (c) { return c.ok; })[0];
    if (!good) break;
    out.push(good.t);
    node = good.next;
  }
  return out;
}

/* ---------- spot the mistake ---------- */
R.spot = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = []);
    var graded = view.mode === 'graded';
    var pre = el('div', 'codeblk');
    pre.setAttribute('role', 'group');
    prep.lines.forEach(function (L, i) {
      var b = el('button', 'cl'); b.type = 'button'; b.id = 'spot-' + q.id + '-' + i;
      b.appendChild(el('span', 'lno', String(i + 1)));
      b.appendChild(el('span', null, L));
      var sel = ans.indexOf(i) >= 0;
      if (graded) {
        var m = view.res.mark[i];
        if (m === 'ok') { b.classList.add('ok'); b.appendChild(el('span', 'markic ok', '✓ PROBLEM')); }
        else if (m === 'bad') { b.classList.add('bad'); b.appendChild(el('span', 'markic bad', '✗ NO PROBLEM HERE')); }
        else if (m === 'missed') { b.classList.add('missed'); b.appendChild(el('span', 'markic missed', 'MISSED PROBLEM')); }
        else b.classList.add('plain');
        b.disabled = m === undefined || m == null ? true : b.disabled;
        if (m == null) b.classList.add('plain');
      } else {
        b.setAttribute('aria-pressed', sel ? 'true' : 'false');
        if (sel) b.setAttribute('aria-pressed', 'true');
        b.addEventListener('click', function () {
          st._refocusSel = '#spot-' + q.id + '-' + i;
          var a = st.ans[q.id], ix = a.indexOf(i);
          if (ix >= 0) a.splice(ix, 1);
          else if (a.length < prep.correct.length) a.push(i);
          else toast('You can select at most ' + prep.correct.length + ' lines — there are exactly that many problems.');
          touch(q.id); renderQuestion();
        });
      }
      pre.appendChild(b);
    });
    box.appendChild(pre);
    if (!graded) {
      var left = prep.correct.length - ans.length;
      box.appendChild(el('p', 'dznote', 'Selected ' + ans.length + ' of ' + prep.correct.length + ' problem lines.' + (left > 0 ? ' ' + left + ' still to find.' : ' All found — Check when ready.')));
    }
  },
  grade: function (q, prep) {
    var ans = st.ans[q.id] || [], mark = {}, ok = 0;
    prep.lines.forEach(function (_, i) { mark[i] = null; });
    prep.correct.forEach(function (i) {
      if (ans.indexOf(i) >= 0) { mark[i] = 'ok'; ok++; } else mark[i] = 'missed';
    });
    ans.forEach(function (i) { if (prep.correct.indexOf(i) < 0) mark[i] = 'bad'; });
    return { n: prep.correct.length, ok: ok, mark: mark };
  },
  isEmpty: function (q) { return !(st.ans[q.id] || []).length; },
  userHtml: function (q, prep) {
    var ans = st.ans[q.id] || [];
    return ans.length ? '<ul>' + ans.map(function (i) { return '<li>line ' + (i + 1) + ': <code>' + prep.lines[i].replace(/</g, '&lt;') + '</code></li>'; }).join('') + '</ul>' : '<p>—</p>';
  },
  correctHtml: function (q, prep) {
    return '<ul>' + prep.correct.map(function (i) { return '<li>line ' + (i + 1) + ': <code>' + prep.lines[i].replace(/</g, '&lt;') + '</code></li>'; }).join('') + '</ul>';
  }
};
