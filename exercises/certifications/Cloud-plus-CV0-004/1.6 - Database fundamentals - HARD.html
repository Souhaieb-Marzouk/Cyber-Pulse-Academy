/* ---- grading ---- */
function reTest(cmd,rx){var c=String(cmd||'').replace(/\s+/g,' ').trim().replace(/;+$/,'');return new RegExp(rx,'i').test(c)}
function gradeEx(ex,gi){
 var a=S.ans[gi],g={hits:0,els:1};
 if(ex.t==='qcm'){g.hits=(a===ex.a)?1:0}
 else if(ex.t==='logv'){
  if(ex.qt==='multi'){g.els=ex.a.length;a.forEach(function(k){if(ex.a.indexOf(k)>-1)g.hits++})}
  else g.hits=(a===ex.a)?1:0;
 }
 else if(ex.t==='multi'){g.els=ex.a.length;a.forEach(function(k){if(ex.a.indexOf(k)>-1)g.hits++})}
 else if(ex.t==='drop'){g.els=ex.items.length;ex.items.forEach(function(it,k){if(a[k]===it.c)g.hits++})}
 else if(ex.t==='order'||ex.t==='rank'){g.els=ex.steps.length;a.forEach(function(si,pos){if(si===pos)g.hits++})}
 else if(ex.t==='match'){g.els=ex.pairs.length;for(var l in a){if(a[l]===+l)g.hits++}}
 else if(ex.t==='fill'){g.els=ex.a.length;for(var n=1;n<=ex.a.length;n++){if(a[n]===ex.a[n-1])g.hits++}}
 else if(ex.t==='spot'){g.els=ex.bad.length;a.forEach(function(i){if(ex.bad.indexOf(i)>-1)g.hits++})}
 else if(ex.t==='term'){g.els=ex.tasks.length;ex.tasks.forEach(function(t,i){if(t.accept.some(function(rx){return reTest(a[i],rx)}))g.hits++})}
 else if(ex.t==='branch'){g.els=ex.nodes.length;a.forEach(function(c,j){if(c===ex.nodes[j].a)g.hits++})}
 else if(ex.t==='dual'){g.els=2;g.hits=(a[0]===ex.A.a?1:0)+(a[1]===ex.B.a?1:0)}
 return g;
}
function readyMsg(ex,gi){
 var a=S.ans[gi];
 if(ex.t==='qcm'){if(a<0)return 'Choose one answer first.'}
 else if(ex.t==='logv'){
  if(ex.qt==='multi'){if(!a.length)return 'Select at least one answer.'}
  else if(a<0)return 'Choose one answer first.';
 }
 else if(ex.t==='multi'){if(!a.length)return 'Select at least one answer.'}
 else if(ex.t==='drop'){var left=ex.items.length-Object.keys(a).length;if(left)return 'Place every item first \u2014 '+left+' left.'}
 else if(ex.t==='match'){var left2=ex.pairs.length-Object.keys(a).length;if(left2)return 'Match every term first \u2014 '+left2+' left.'}
 else if(ex.t==='fill'){for(var n=1;n<=ex.a.length;n++){if(a[n]===undefined)return 'Fill every blank first.'}}
 else if(ex.t==='spot'){if(!a.length)return 'Click at least one line.'}
 else if(ex.t==='term'){var miss=0;ex.tasks.forEach(function(t,i){if(!String(a[i]||'').trim())miss++});if(miss)return 'Run every task first \u2014 '+miss+' command(s) still empty.'}
 else if(ex.t==='branch'){
  if(S.reveal[gi]<ex.nodes.length)return 'Answer the current step to unlock the next one.';
  if(a.length<ex.nodes.length)return 'Choose an option on every step.';
 }
 else if(ex.t==='dual'){if(a[0]<0)return 'Answer the blue-team side first.';if(a[1]<0)return 'Answer the red-team side too.'}
 return null;
}

 +'<li><b>Scenario, question, answers</b> \u2014 every exercise shows the scenario in its own blue block, the question in an amber block, and the answers in a separate area. You never have to guess what is being asked.</li>'
 +'<li><b>Check</b> \u2014 validates your answer, marks every element green (correct), red (wrong) or amber (missed / partial), locks the answer for scoring, and shows an explanation. It also pauses the timer automatically (review mode): the exercise and explanation stay visible, and the clock resumes only when you press <b>Next</b>.</li>'
 +'<li><b>Manual Pause</b> \u2014 a separate button. While you are manually paused, the exercise content is hidden so it cannot be studied; press Resume to continue. The two pauses are independent and can stack.</li>'

CFG={"docTitle": "CompTIA Cloud+ (CV0-004) — 1.6 Database Fundamentals — HARD practice exam", "ttl": "Cloud+ 1.6 Database Fundamentals", "sev": "HARD", "min": 75, "pass": 70};
EX=[
{"t":"logv","h":"P99 spike after Tuesday's deploy","th":"PFM",
"sc":"Quartz Commerce: checkout latency P99 jumped from 120 ms to 2,400 ms right after Tuesday's deploy. The deploy note says: \u201Cdropped unused index idx_orders_customer; bulk-loaded 8M historical rows\u201D. The filtered query log of db-ord-01 (10[.]60[.]3[.]18) is below. Nothing else changed: CPU 35%, disk 40%, cache hit ratio unchanged.",
"src":"query log — db-ord-01",
"logs":[
{"t":"14:02:11","l":"INFO","m":"duration 118 ms  SELECT o.id,o.total FROM orders o WHERE o.customer_id=$1 AND o.status='open'"},
{"t":"14:02:14","l":"INFO","m":"duration 121 ms  SELECT o.id,o.total FROM orders o WHERE o.customer_id=$1 AND o.status='open'"},
{"t":"14:02:17","l":"WARN","m":"duration 2310 ms  SELECT o.id,o.total FROM orders o WHERE o.customer_id=$1 AND o.status='open'"},
{"t":"14:02:18","l":"INFO","m":"duration 109 ms  SELECT id,name FROM products WHERE id=$1"},
{"t":"14:02:20","l":"WARN","m":"duration 2588 ms  SELECT o.id,o.total FROM orders o WHERE o.customer_id=$1 AND o.status='open'"},
{"t":"14:02:23","l":"INFO","m":"duration 99 ms   SELECT id,name FROM products WHERE id=$1"},
{"t":"14:02:25","l":"WARN","m":"duration 2214 ms  SELECT o.id,o.total FROM orders o WHERE o.customer_id=$1 AND o.status='open'"},
{"t":"14:02:28","l":"INFO","m":"autovacuum: done analyzing public.orders (8124000 rows)"}],
"qt":"multi",
"q":"Filter for the slow shape. Which two findings explain the regression and its fix?",
"ch":["The deploy dropped the index the query depended on; the plan fell back to a sequential scan — verify with the execution plan and recreate the index","The 8M-row bulk load left the planner statistics stale, so cost estimates mislead it; refresh statistics and check the plan flipped back","The storage volume lost IOPS quota — provisioned IOPS must be raised","The application servers are oversubscribed — scale the app tier"],
"a":[0,1],
"hint":"CPU and disk are calm — the slowness belongs to one query shape. What did the deploy remove and what did it add?",
"exp":"Filter on <code>duration</code> and one query shape dominates while CPU, disk and cache stay calm — this is a plan regression, not a capacity problem. The <b>slow query log</b> names the guilty shape; the method is <b>query optimization</b> by evidence: filter, plan, fix, re-measure. Two causes stack here: the deploy <b>dropped idx_orders_customer</b>, forcing a sequential <b>full table scan</b> for a customer lookup, and the 8M-row bulk load left <b>planner statistics</b> stale, so the optimizer misjudges row counts and picks bad plans. Fix: confirm with the <b>execution plan</b>, recreate the index, refresh statistics. The IOPS and app-tier distractors contradict the calm CPU/disk/latency evidence — hardware answers to a plan problem are the classic expensive mistake."},
{"t":"qcm","h":"The ledger that must keep writing","th":"TRX",
"sc":"Marble Ledger runs its double-entry ledger on a database replicated across two regions. Compliance says: the service must keep accepting writes even if the inter-region link dies. Finance accepts that a query may briefly show a balance that a second later changes, until both copies converge. The CTO is now writing the risk acceptance line for the design document.",
"q":"Which risk must the business explicitly accept?",
"ch":["During a partition, the two regions may briefly hold different balances for the same account until they converge","During a partition, writes fail in both regions until the link heals","During normal operation, no write is ever acknowledged before it reaches both regions","Backups stop while the system is partitioned"],
"a":0,
"hint":"Keeping writes flowing during a partition has a price. Name the price precisely.",
"exp":"The design chose <b>availability</b> over strict <b>consistency</b> during partitions — the AP side of the <b>CAP theorem</b>. The accepted risk is temporary divergence: different regions can report different balances for the same account until reconciliation converges them (<b>eventual consistency</b>). Option B describes the CP choice the business explicitly rejected. Option C describes synchronous replication — the opposite of the accepted design. Backups are a local, unrelated mechanism. The design still keeps ACID <b>atomicity</b> inside each region — a debit and its credit commit together or not at all; what diverges is the cross-region view. Writing the risk down matters: \u201Ceventual consistency\u201D sounds harmless until finance realizes a refund can be double-spent during a partition — that is the sentence the CTO is signing."},
{"t":"drop","h":"Seven workloads, one line each","th":"NOS",
"sc":"You are reviewing the data platform plan at Beacon Insurance. Seven workloads, seven stores, and the tempting near-miss answer is always one column over. Fraud-ring analysis keeps coming back relational in the drafts — push back where the reasoning demands it.",
"q":"Assign each workload to the store type it actually needs.",
"cats":["Relational (RDBMS)","Document","Key-value","Graph","Time-series / wide-column"],
"items":[
{"x":"Fraud-ring analysis: many-to-many entity links, variable-depth walks, \u201Cwho connects to whom\u201D","c":3},
{"x":"Policy catalog where each product line has different attributes and admins add fields monthly","c":1},
{"x":"API rate-limit counters with expiry, millions of increments per second","c":2},
{"x":"General ledger with strict double-entry balance checks and audit columns","c":0},
{"x":"Sensor readings from 200k vehicles, append-only, queried by vehicle + hour","c":4},
{"x":"Session tokens validated 200k times per second by exact key","c":2},
{"x":"Customer 360 view joining 30 governed tables with strict constraints","c":0}],
"hint":"If the question is about paths and rings, it is a graph. If it is about counters with TTL, it is key-value. Two items share a store.",
"exp":"<b>Graph</b> owns relationship traversal: a <b>graph database</b> walks fraud rings at variable depth over many-to-many edges — a relational recursive JOIN can technically do it, but performance collapses as depth grows, which is why the drafts keep failing review. <b>Document</b> fits the policy catalog: heterogeneous per-product fields without migrations (<b>schema-on-read</b> flexibility). <b>Key-value</b> — the <b>key-value store</b> — owns both counter and session work: single-key operations at extreme rates with TTL. The <b>relational database</b> core keeps the ledger (constraints, ACID, audit) and Customer 360 (governed JOINs across 30 tables). <b>A wide-column / column-family store</b> — a <b>time-series store</b> at heart — eats append-only sensor volume. Near-miss to resist: putting Customer 360 on a document store loses the constraint enforcement the auditors demand."},
{"t":"spot","h":"Does the config match the policy?","th":"SEC",
"sc":"Compliance policy DB-7 for Marble Ledger's payment database says: (1) RPO no worse than 15 minutes, (2) backups encrypted and region-isolated, (3) retention 90 days. The deployed backup configuration is below. Click every line that violates the policy.",
"q":"Which config lines break the policy?",
"code":["backup_schedule = daily at 02:00 UTC","encryption = customer-managed KMS key, rotated yearly","retention_days = 90","copy_to_second_region = disabled","transaction_log_shipping = off"],
"bad":[0,3,4],
"hint":"Compute the RPO that line 1 actually delivers. Then check where the copies live, and how PITR could ever work.",
"exp":"Line 1: a daily <b>backup</b> gives an effective <b>RPO</b> of up to 24 hours — the policy demands 15 minutes, and log shipping is what would deliver that via point-in-time recovery. Line 4: <b>region isolation</b> fails while copies stay in one region — a regional event destroys every copy at once. Line 5: <code>log_shipping = off</code> makes the 15-minute RPO impossible and removes PITR entirely. Lines 2 and 3 are compliant: a customer-managed <b>KMS</b> key with rotation is good practice, and 90-day <b>retention</b> matches. Expired copies should then age into an archive tier — <b>archival tiering</b> keeps old backups cheap. The hard lesson: a backup schedule is a policy claim — always translate it into the RPO it actually delivers."},
{"t":"branch","h":"Two primaries after the network flap","th":"AVL",
"sc":"05:37 — a network flap at Beacon Insurance partitions the database cluster for 9 minutes. Fencing failed. Now db-a and db-b both believe they are primary; the application layer round-robins writes to both. You just joined the bridge.",
"nodes":[
{"s":"Both nodes accept writes; the cluster has no quorum view. What is the first action?",
"ch":["Fence one node immediately — cut it from the application and stop its writes before comparing data","Let both run; merge the data next week","Reboot both nodes at once","Delete the data of one node"],
"a":0,
"w":"Split-brain: every minute of dual writes widens the divergence. Fencing (stop one side) is the first move, before any data discussion."},
{"s":"You fenced db-a. Accounting: db-a took 412 writes while isolated; db-b took 1,906. Both sets touched the same tables. What now?",
"ch":["Export db-a's writes, treat them as suspect, and replay only the non-conflicting ones after review with the business","Auto-merge both sides with last-write-wins and move on","Keep only db-a's writes and discard db-b","Restore both nodes from last week's backup"],
"a":0,
"w":"412 real customer writes exist on db-a. Automatic last-write-wins silently discards or clobbers some of them. Human review of conflicts is slow but correct; weekly restore throws away thousands of good writes."},
{"s":"The incident report asks: which architectural change prevents a repeat?",
"ch":["Enforce quorum-based failover with a witness/tiebreaker and fencing so at most one primary can ever accept writes","Lengthen the network timeouts so the flap is invisible","Upgrade both nodes to bigger instances","Remove automation; make all failovers manual"],
"a":0,
"w":"Split-brain is prevented structurally: quorum + witness means a side that cannot prove majority never promotes, and fencing enforces it. Timeouts hide symptoms, size changes nothing about the logic flaw, and manual failover does not scale or sleep."}],
"q":"Step through the split-brain response: choose the best action at each step.",
"hint":"Classic split-brain flow: stop the bleeding (fence), reconcile by hand, then fix the election logic.",
"exp":"This is a textbook <b>split-brain</b>: two primaries accept writes because fencing and quorum failed. Sequence: fence first (stop one side's writes — divergence grows every minute), then reconcile <b>by review</b>, not by blind last-write-wins, because 412 writes are real customer actions; conflicts need business judgment. Prevention is structural: <b>quorum</b> with a witness/tiebreaker plus fencing (STONITH-style) guarantees a single writer. Related concepts to know: <b>synchronous replication</b> with a single writer avoids divergence entirely at the cost of write latency, and multi-AZ <b>high availability</b> designs must always answer \u201Cwhat happens during a partition?\u201D before the partition answers for them."},
{"t":"fill","h":"Oracle to PostgreSQL runbook","th":"MIG",
"sc":"Beacon Insurance moves its claims database from Oracle to managed PostgreSQL — different engines. The migration lead left four gaps in the runbook. The engine difference is the whole story here.",
"q":"Complete the heterogeneous migration runbook.",
"tx":"Oracle to PostgreSQL is a __1__ migration, so the __2__ conversion tool runs first: PL/SQL becomes PL/pgSQL and object definitions are translated; what cannot convert automatically needs manual rework. Keep the source authoritative and use __3__ to stream ongoing changes until cutover. Before cutover, run __4__ checks: row counts per table, checksums, and a business sampling day.",
"bank":["heterogeneous","schema","change data capture (CDC)","validation","homogeneous","backfill"],
"a":["heterogeneous","schema","change data capture (CDC)","validation"],
"hint":"Same engine would be one of the bank words. This one is not.",
"exp":"Different engines make this a <b>heterogeneous migration</b>, and the engine difference lives in the objects — tables, types, stored procedures — so a <b>schema conversion</b> step runs before any data moves; PL/SQL does not run on PostgreSQL untouched — sequences, <b>primary key</b> and <b>foreign key</b> definitions, and procedure code all need review during conversion. <b>Change data capture</b> keeps the target in sync while the source stays authoritative, so the <b>cutover</b> window shrinks to minutes. <b>Validation</b> (counts, checksums, sampling) is the gate that proves the copy is faithful. A <b>homogeneous</b> migration (same engine) would skip most conversion pain — that is exactly why the decoy word is tempting here."},
{"t":"order","h":"Encrypted files, emptied tables: order the response","th":"SEC",
"sc":"06:12 at Quartz Commerce: an attacker with a stolen DBA credential connected from an unknown host, dumped several tables, then ran destructive DELETE statements. Encryption at rest was on and is unaffected. The on-call engineer's actions arrived shuffled. Order the response — evidence first, panic last.",
"q":"Put the incident response steps in the correct order.",
"steps":["Isolate the affected database from the network to stop the spread","Snapshot the volumes and export the logs for forensics before anything changes","Revoke the compromised credentials and rotate every secret the account could reach","Restore clean copies from immutable backups into a fresh instance","Validate integrity, then reconnect the application and rotate access paths","Write the timeline report: entry point, actions taken, lessons learned"],
"hint":"Contain, preserve evidence, evict, rebuild, verify, then write the story.",
"exp":"Correct order: <b>contain</b> (isolate — every extra minute of access deepens the damage), <b>preserve</b> (snapshots and logs before changes destroy evidence; this is why snapshots are taken even though the data is compromised), <b>eradicate</b> (revoke and rotate the stolen <b>credentials</b> — credential rotation closes the door; otherwise the attacker walks back in), <b>recover</b> (restore from <b>immutable backups</b> — immutable matters, because ransomware tries to delete the backups first), then <b>validate</b> before reconnecting, and finally the report with lessons. Notice what encryption at rest did NOT do here: it protects stolen files, not stolen sessions with a valid credential — that distinction is the entire lesson."},
{"t":"match","h":"Pick the isolation level","th":"TRX",
"sc":"The platform team at Marble Ledger must set isolation levels for three new services and defend each choice. Match the level to the guarantee it actually provides — the near-misses are engineered to sound right.",
"q":"Pair each isolation level with its true guarantee.",
"pairs":[
["Read Uncommitted","Can see another transaction's uncommitted changes — dirty reads are possible"],
["Read Committed","Sees only committed data, but two identical reads inside one transaction may differ"],
["Repeatable Read","Rows read stay stable in the transaction, but new matching rows can still appear (phantoms)"],
["Serializable","Behaves as if transactions ran one after another — the strongest guarantee, the least concurrency"],
["Autocommit","Every single statement is its own transaction — commit happens implicitly per statement"]],
"hint":"Match by what each level forbids, not by what it sounds like.",
"exp":"<b>Read Uncommitted</b> allows <b>dirty reads</b> — you can see uncommitted changes that may roll back. <b>Read Committed</b> blocks dirty reads but a re-read of the same row can differ (non-repeatable read). <b>Repeatable Read</b> locks the rows you read — but range queries can still gain new rows, the <b>phantom read</b>. <b>Serializable</b> emulates sequential execution: no anomalies, worst concurrency — reserved for the ledger-style cases. <b>Autocommit</b> is not an anomaly guard at all: it is a mode where every statement commits immediately. The anomalies these levels fight: dirty reads, <b>lost updates</b>, phantoms — while <b>deadlocks</b> are a locking fact every level must resolve by victim choice. The exam trap: choosing Serializable \u201Cto be safe\u201D everywhere — throughput collapses, and most workloads are fine at Read Committed."},
{"t":"dual","h":"The login filter that accepts everything","th":"SEC",
"sc":"Beacon Insurance's customer portal queries a document store. A WAF alert shows repeated POSTs to /login whose JSON body contains {\"$gt\": \"\"} in the password field, and one account (svc-portal) then performed 400 exports in 6 minutes. The query code concatenates user input straight into the filter object.",
"A":{"s":"Blue team: what is happening, and what is the correct first fix?",
"ch":["NoSQL injection probing authentication: replace string-built filters with parameterized / typed query building and validate input types","A brute-force attack: add a CAPTCHA to the login page","Cache poisoning: flush the cache layer","Replication lag causing duplicate logins: restart the database"],
"a":0,
"hint":"The payload is not guessing passwords — it is changing the shape of the query itself."},
"B":{"s":"Red team: your {\"$gt\": \"\"} payload logged you in, and you hold a valid session as svc-portal. Staying under rate limits, what is the tradecraft next step?",
"ch":["Enumerate collections and fields slowly with injected predicates, mapping the schema before any bulk pull","Dump the largest collection immediately at full speed","Launch a DDoS on the portal to cover tracks","Brute-force other passwords with a rainbow table"],
"a":0,
"hint":"Blue: the payload changes the shape of the query, not the password. Red: quiet mapping before any loud pull."},
"q":"Answer the blue-team (defend) side first; the red-team (attack) side then unlocks.","hint":"Blue: the payload changes the shape of the query, not the password. Red: quiet mapping before any loud pull.",
"exp":"Blue: <code>{\"$gt\": \"\"}</code> means \u201Cgreater than empty string\u201D — true for any non-empty value, so the password predicate always passes: a classic <b>NoSQL injection</b>. The fix is structural: parameterized/typed query building so input can never change the query's shape, plus input validation; a CAPTCHA treats the symptom. The 400 exports mean the session was already weaponized — rotate that credential and review <b>audit logging</b>. Red: after the foothold, real attackers enumerate quietly — collections, field names, user counts — staying under rate limits, before any bulk export. The two sides teach the same keyword from opposite chairs: input that can change query structure is a vulnerability."},
{"t":"multi","h":"Choose the shard key, live with it","th":"NOS",
"sc":"Helios-scale tenant data at Quartz Commerce is outgrowing one node: 30 TB and climbing. The team must shard the orders collection and can never change the shard key without a full rebuild. Four statements made in the design review, two true and two false.",
"q":"Select every TRUE statement about shard key choice.",
"ch":["A monotonically increasing key (like a timestamp) funnels every write to one hot shard","A high-cardinality, evenly distributed key spreads write load across shards","The shard key can be changed later with no downtime on most platforms","Queries that do not include the shard key must fan out to every shard"],
"a":[0,1,3],
"hint":"Sharding has two failure modes: hot spots and scatter-gather. Which statements name them?",
"exp":"True: an ever-increasing key (timestamp, sequence) sends every insert to the \u201Clast\u201D shard — the <b>hot shard</b> problem; high-cardinality, well-distributed keys (customer ID with hashing) spread load; and queries missing the <b>shard key</b> become scatter-gather — every shard is asked, so <b>latency</b> and cost multiply. False: changing a shard key later is a full data rebuild on most engines — that is why the choice is effectively permanent. Design rule: pick the key that matches your most common query pattern AND spreads writes; when those conflict, hash a high-cardinality composite key. Sharding is the most complex form of <b>horizontal scaling</b> — combined with scale-out replicas it is <b>elastic scaling</b> in its strongest form, and it should be the last step after replicas and vertical headroom are exhausted."},
{"t":"term","h":"Five failed sign-ins, newest first","th":"REL",
"sc":"Security triage at Beacon Insurance. The table auth_events exists on the console you are connected to. The analyst needs the five most recent failed sign-in attempts, newest first, to paste into the incident ticket.",
"q":"Two tasks in the security console: first a row count, then the five most recent failed sign-ins for the incident ticket. Run each statement with Enter (or the Run button), then press Check.",
"host":"db-sec-01.internal","ps1":"sec=>",
"banner":"security console — connected as sec_analyst (read only)\nType your SQL statement and press Enter. Type help to see the schema reminder.",
"schema":"auth_events(event_id INT, username TEXT, action TEXT, occurred_at TIMESTAMP, detail TEXT)  -- action values: login_ok, failed_login, logout",
"tasks":[
{"q":"Warm-up: count how many events the auth_events table contains.","accept":["^select\\s+count\\s*\\(\\s*\\*\\s*\\)(\\s+as\\s+\\w+)?\\s+from\\s+auth_events$"],"out":"  count\n---------\n    91457\n(1 row)","ex":"SELECT COUNT(*) FROM auth_events;"},
{"q":"Retrieve the 5 most recent rows where action is exactly failed_login from auth_events, ordered newest first. Columns available: event_id, username, action, occurred_at, detail.","accept":["^select\\s+(\\*|[a-z_\\s,]+)\\s+from\\s+auth_events\\s+where\\s+(action\\s*=\\s*['\"]failed_login['\"]|upper\\s*\\(\\s*action\\s*\\)\\s*=\\s*['\"]FAILED_LOGIN['\"])\\s+order\\s+by\\s+occurred_at\\s+desc(\\s*,\\s*event_id\\s+desc)?\\s+limit\\s+5$"],"out":" event_id |    occurred_at     | username  |    action    |             detail\n----------+--------------------+-----------+--------------+----------------------------------\n    91442 | 2026-03-14 02:41:07| svc.build | failed_login | password mismatch (attempt 5)\n    91441 | 2026-03-14 02:41:03| j.wilde   | failed_login | password mismatch (attempt 2)\n    91439 | 2026-03-14 02:40:58| root      | failed_login | user not found\n    91437 | 2026-03-14 02:40:51| j.wilde   | failed_login | password mismatch (attempt 1)\n    91433 | 2026-03-14 02:40:44| svc.build | failed_login | password mismatch (attempt 4)\n(5 rows)","ex":"SELECT * FROM auth_events WHERE action = 'failed_login' ORDER BY occurred_at DESC LIMIT 5;"}
],
"hint":"Task 1 is COUNT(*) with no other clauses. Task 2 needs three clauses: one filters rows, one sorts newest first, one caps the result at 5.",
"exp":"The three SQL clauses the task demanded: <b>WHERE action = 'failed_login'</b> filters to failed sign-ins (strings need quotes; LIKE would be wrong — the value is exact); <b>ORDER BY occurred_at DESC</b> sorts newest first (DESC is the part people forget, leaving oldest first); <b>LIMIT 5</b> caps the output. Selecting the named columns or * are both correct answers. This filter-sort-cap <b>SQL query</b> pattern is the daily bread of security triage on any SQL-visible audit table."},
{"t":"qcm","h":"TDE was on — why did it not help?","th":"SEC",
"sc":"Incident review at Quartz Commerce: the payments database had transparent data encryption enabled with keys managed in the cloud KMS. An attacker obtained DB superuser rights through a vulnerable admin endpoint and read every row of the card_tokens table with normal SELECT statements. Compliance asks why \u201Cthe database is encrypted\u201D did not prevent the read.",
"q":"Which statement is the correct explanation?",
"ch":["TDE protects the files at rest; an authorized session receives decrypted data by design, so it never stops a query with valid rights","TDE only encrypts metadata, not table data","The KMS keys had been rotated that week, which disabled protection","TLS was not enabled, so TDE switched itself off"],
"a":0,
"hint":"Ask who is asking the question: the disk, or the SQL engine serving a superuser?",
"exp":"<b>Transparent data encryption</b> protects data <b>at rest</b>: stolen volumes, snapshots, files. The engine itself decrypts pages for every authorized session — a superuser SELECTing rows is the intended, legitimate path, so TDE never interferes. Stopping that read takes other controls: least privilege (a superuser should not exist for apps), a <b>parameterized query</b> layer and input validation against <b>SQL injection</b> on the vulnerable endpoint, and <b>audit logging</b> with alerting on bulk reads. The distractors are technically false: TDE encrypts the data files, key rotation never disables it, and TLS is an in-transit control, independent of TDE. Lesson for the compliance answer: encryption at rest defends against disk theft, not against credential compromise."},
{"t":"drop","h":"DBaaS: who patches, who grants?","th":"CLD",
"sc":"The managed database service at Marble Ledger (a DBaaS) just onboarded a new operations team. Their onboarding quiz: sort seven tasks into provider-side or customer-side. The near-misses are the tasks that sound shared but are not.",
"q":"Sort each task onto the side that owns it.",
"cats":["Provider","Customer"],
"items":[
{"x":"Patch the database engine binaries and the OS of the instance","c":0},
{"x":"Create and tune the indexes for the reporting queries","c":1},
{"x":"Replace failed underlying disks and repair the host hardware","c":0},
{"x":"Classify the data and decide retention periods per table","c":1},
{"x":"Run the automated multi-AZ failover when the zone dies","c":0},
{"x":"Grant least-privilege roles to the analyst team","c":1},
{"x":"Guard the physical security of the datacenter floors","c":0}],
"hint":"Provider = the fabric and the platform mechanics. Customer = decisions about your data and your people.",
"exp":"Provider owns the platform mechanics: engine/OS <b>patching</b>, hardware replacement, <b>automated multi-AZ failover</b>, physical security — you cannot touch a disk or patch a hypervisor in a managed service even if you wanted to. Customer owns every decision about its own data and access: <b>index and query tuning</b> (nobody knows your workload better), <b>data classification and data retention</b> (a legal call, not a technical one), and <b>least-privilege grants</b> (the provider cannot know which analyst may see which table). The exam-relevant insight: in DBaaS the customer's security duties concentrate on identity, data governance and configuration — the classic mistakes are assuming the provider \u201Chandles security\u201D or that backups configure themselves."},
{"t":"spot","h":"Review the migration plan","th":"MIG",
"sc":"The migration plan for Beacon Insurance's claims database (Oracle to PostgreSQL, different engines) crossed your desk for review. Three reviewers already approved it. Click every line that will cause a real failure on cutover day.",
"q":"Which plan lines are wrong?",
"code":["1. Provision the target PostgreSQL instance with the same instance class as the source","2. Skip schema assessment — dump and restore will handle the Oracle objects","3. Keep the source authoritative and start CDC replication to the target","4. Cutover: switch the application instantly while replication lag is 15 minutes","5. Validate row counts only after go-live, during business hours"],
"bad":[1,3,4],
"hint":"Different engines, different objects. And what does switching at 15 minutes of lag do to the transactions written in those 15 minutes?",
"exp":"Line 2: this is a <b>heterogeneous migration</b> — a dump/restore does not translate PL/SQL, sequences, or type differences; a <b>schema conversion</b> assessment must run first, and skipping it fails the restore or, worse, silently changes behavior. Line 4: cutting over while lag is 15 minutes abandons every transaction written in that window — the hard gate is lag to zero with writes paused. Line 5: <b>migration validation</b> belongs before cutover (counts, checksums, sampling) plus a repeat after; discovering drift during business hours is a breach of trust. Line 1 is weak practice but not fatal (sizing comes from the target engine's profile), and line 3 is exactly right — source authoritative with CDC streaming."},
{"t":"logv","h":"One IP, forty usernames","th":"SEC",
"sc":"Security review at Quartz Commerce. The auth log of the customer database below covers 22:40–22:47. No alerts fired because each individual failure looks normal. The source IP is defanged documentation range. Use the filter to see the pattern.",
"src":"auth log — db-cust-01",
"logs":[
{"t":"22:40:11","l":"WARN","m":"login failed user=aaron.t  from 203[.]0[.]113[.]66"},
{"t":"22:40:12","l":"WARN","m":"login failed user=b.keller  from 203[.]0[.]113[.]66"},
{"t":"22:40:12","l":"WARN","m":"login failed user=chen.m  from 203[.]0[.]113[.]66"},
{"t":"22:40:13","l":"WARN","m":"login failed user=dana.o  from 203[.]0[.]113[.]66"},
{"t":"22:41:30","l":"WARN","m":"login failed user=j.wilde  from 203[.]0[.]113[.]66"},
{"t":"22:41:31","l":"WARN","m":"login failed user=j.wilde  from 203[.]0[.]113[.]66"},
{"t":"22:41:33","l":"INFO","m":"login ok user=j.wilde  from 203[.]0[.]113[.]66  (MFA: sms)"},
{"t":"22:42:10","l":"WARN","m":"settings changed user=j.wilde: mfa_method disabled"},
{"t":"22:42:44","l":"INFO","m":"GRANT INSERT, UPDATE ON payments TO j.wilde"},
{"t":"22:43:02","l":"ERROR","m":"audit: SELECT count(*) FROM payments user=j.wilde rows=1,204,551"},
{"t":"22:44:15","l":"ERROR","m":"audit: COPY payments TO file 'payments_extract.csv' user=j.wilde rows=1,204,551"}],
"qt":"multi",
"q":"Which two conclusions does the log actually support?",
"ch":["Automated password testing from one source across many usernames, followed by a successful takeover of j.wilde","After the takeover, the attacker disabled MFA, escalated privileges, and bulk-exported the payments table","The failures are a replica-lag artifact that duplicated login attempts","A nightly backup job locked the accounts, causing the failures"],
"a":[0,1],
"hint":"Follow one source IP through time: spraying, then one success, then what the session did next.",
"exp":"Filter on the source: one IP tests dozens of usernames in seconds (<b>credential spraying</b> — low-and-slow so per-user lockouts never fire), then j.wilde fails twice and succeeds — account takeover with the MFA step satisfied, which suggests the SMS factor was also compromised or bypassed. Then the kill chain continues: <b>MFA disabled</b> (persistence), a <b>GRANT</b> (privilege escalation — possible only if the account had excessive rights, a least-privilege failure), a huge SELECT and a bulk <b>COPY out</b> (exfiltration). Replica lag and backup jobs do not produce per-username failures from one external IP. Lesson: per-event logs look innocent; the attack lives in the correlation — which is exactly what the filter box is for."},
{"t":"order","h":"Zero-downtime column change","th":"MIG",
"sc":"Quartz Commerce must add a loyalty_tier column to a 900M-row orders table without downtime. The DBA team uses the expand-contract pattern. The steps arrived shuffled from the RFC.",
"q":"Order the migration steps correctly.",
"steps":["Expand: add the new nullable column — the old path keeps working","Deploy code that writes both the old and the new structure (dual-write)","Backfill historical rows in batches with throttling","Verify parity between old and new values with counts and checksums","Switch reads to the new column behind a feature flag","Contract: stop writing the old path and drop the legacy objects"],
"hint":"Widen the road before rerouting traffic; tear up the old road last.",
"exp":"<b>Expand-contract</b> never breaks the running system: first <b>expand</b> (additive change, nullable, old path untouched), then <b>dual-write</b> so both structures stay current, then <b>backfill</b> the history in throttled batches (a single UPDATE on 900M rows would stall replication and IOPS for hours), then <b>verify parity</b> before trusting the new path, then <b>switch reads</b> behind a flag (instant rollback if metrics disagree), and only last <b>contract</b> — remove old writes and drop legacy objects. Normalization purists would put loyalty_tier in its own table — writing it inline is a deliberate <b>denormalization</b>, acceptable because the read pattern justifies it. Reversing any two steps creates a window where reads see missing or stale data. This pattern generalizes to every risky online <b>schema</b> change on large cloud databases."},
{"t":"multi","h":"Disk at 95 percent, CPU calm","th":"PFM",
"sc":"Monday metrics at Quartz Commerce for db-ord-03: CPU 35%, memory 60%, volume disk utilization 95% and IOPS at the provisioned limit, cache hit ratio 99.8%, and the top queries are random point reads of product rows. Two of the five proposed actions attack the real bottleneck.",
"q":"Select the two actions that address the actual bottleneck.",
"ch":["Move the hot tables to higher-provisioned IOPS storage","Add the index that turns the random point reads into targeted lookups","Add more vCPU to the instance","Enlarge the buffer cache — it clearly needs to hit harder","Reboot the instance during lunch"],
"a":[0,1],
"hint":"CPU is calm and the cache is nearly perfect — the queue is at the disk. Why are there so many disk reads?",
"exp":"The evidence points at <b>IOPS</b> saturation with an almost perfect <b>cache hit ratio</b> (99.8% — the buffer cache has nothing left to give) and calm CPU. Two fixes attack the cause: raise the storage's provisioned IOPS (capacity), and add the missing <b>index</b> so each point read touches a handful of pages instead of scanning (demand). Adding vCPU buys power for a queue that is not CPU-bound; enlarging the cache chases the last 0.2% of hits while misses still cost the same disk IO; a reboot just resets the queue. The general method: identify the saturated resource from metrics, then split the fix into capacity vs query-shape — the best answer is usually one of each, exactly as here."},
{"t":"fill","h":"Write the findings paragraph","th":"PFM",
"sc":"You are the consultant writing the performance findings for Beacon Insurance's slow claims report. The paragraph must be precise; the client's auditors will quote it. Four terms are missing.",
"q":"Complete the findings paragraph.",
"tx":"The execution plan shows a __1__ scan over 40M rows because the predicate wraps the indexed column in a function, so the optimizer cannot use the index. Estimated row counts are off by 100x — the __2__ are stale after the bulk load and must be refreshed. An __3__ index on the expression would restore index use; and rewriting the filter to a plain range predicate keeps it __4__ for every future plan.",
"bank":["sequential","statistics","expression","index-friendly","snapshot","vertical"],
"a":["sequential","statistics","expression","index-friendly"],
"hint":"One scan type, one maintenance artifact, one index type, one property of a predicate.",
"exp":"A <b>sequential scan</b> (full table scan) is what the planner falls back to when no usable index exists — here because a function wraps the column. Stale <b>planner statistics</b> make cost estimates wildly wrong (100x), which alone can flip a good plan to a bad one — refresh them after every bulk load. An <b>expression index</b> (on the function result) makes the original predicate indexable without touching the query. \u201C<b>Index-friendly</b>\u201D (the plain word for a <b>sargable predicate</b>) describes filters the optimizer can match to an index — no leading wildcards, no function on the column. <b>Snapshot</b> and <b>vertical scaling</b> are backup and capacity words, not plan words — and this incident is a plan story."},
{"t":"qcm","h":"The corruption copied itself","th":"AVL",
"sc":"03:40 at Marble Ledger: the primary reports checksum failures on the account_balances table — silent disk corruption. The cross-region asynchronous replica is healthy by monitoring but its checksums show the same corrupted pages (replication shipped the corrupted blocks faithfully). Backups: nightly full, transaction-log shipping every 5 minutes, retention 35 days. Log forensics places the corruption start at approximately 02:10.",
"q":"What is the safest correct recovery?",
"ch":["Restore from the last good full backup and roll the transaction logs forward to a point just before 02:10 (PITR), then re-seed the replica","Promote the replica — it is healthy by its own monitoring","Repair the primary in place with the application still serving traffic","Restore last week's backup and accept the loss of the week's transactions"],
"a":0,
"hint":"The replica received the corruption via replication. Which copy is clean, and how do you get back to 02:09 with it?",
"exp":"The trap: the replica's monitoring is green, but it is <b>logically corrupted</b> — <b>asynchronous replication</b> faithfully shipped the bad pages, so promoting it promotes the corruption (option B is the tempting near-miss and the exam's point). The clean path: last good full <b>backup</b> + <b>point-in-time recovery</b> rolling the transaction logs forward to just before 02:10 — losing only minutes, not a week (option D wastes the retention and log assets you own). In-place repair while serving (C) risks more damage and hides evidence. Afterwards: re-seed the replica from the clean copy, and enable end-to-end checksums so corruption can never replicate silently again."},
{"t":"drop","h":"Which platform for which workload?","th":"ANL",
"sc":"The architecture board at Beacon Insurance must place six workloads. The labels sound similar; the access patterns do not. Place each workload on the platform built for it.",
"q":"Drag each workload to the platform that serves it best.",
"cats":["OLTP database","Data warehouse (OLAP)","Data lake","Cache"],
"items":[
{"x":"Checkout inserts: 5 ms, strict consistency, every row matters","c":0},
{"x":"Five-year sales trends aggregated across all regions","c":1},
{"x":"Raw clickstream and logs dumped first, schema decided later by analysts","c":2},
{"x":"Product detail pages served in microseconds from memory","c":3},
{"x":"Nightly finance reconciliation with strict constraints and audits","c":0},
{"x":"Percentile dashboards computed over billions of stored rows","c":1}],
"hint":"Write-mostly + constraints = transactional. Aggregate-heavy + columnar = warehouse. Schema later = lake. Hot + tiny = cache.",
"exp":"<b>OLTP</b> owns the checkout inserts and the reconciliation: row-oriented, constraint-enforcing, consistent, fast single-row writes (the finance job needs ACID and <b>audit</b> trails, not scan speed). The <b>warehouse (OLAP)</b> owns the trend aggregations and percentile dashboards: <b>columnar storage</b>, massive scans, compression. The <b>data lake</b> owns raw, schema-on-read landings — cheap object storage, structure decided when someone finally queries it. The <b>cache</b> owns the hot product pages: microseconds from an <b>in-memory database</b> (Redis-style), and explicitly not a system of record. Warehouses that load raw first and transform inside the engine are running <b>ELT</b> instead of ETL — same stages, different order. Two workloads per bucket is deliberate: real platforms place workloads by access pattern, never by application mood."},
{"t":"spot","h":"The analytics role that could write","th":"SEC",
"sc":"Onboarding script for the analytics team at Marble Ledger, reviewed by security. The payments schema lives in the public schema next to hr_salaries. Click every line that grants too much.",
"q":"Which lines violate least privilege for a read-only analyst role?",
"code":["CREATE ROLE analytics_ro;","GRANT CONNECT ON DATABASE prod TO analytics_ro;","GRANT SELECT ON ALL TABLES IN SCHEMA public TO analytics_ro;","GRANT INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO analytics_ro;","ALTER ROLE analytics_ro WITH LOGIN;","COMMENT ON ROLE analytics_ro IS 'read-only reporting access';"],
"bad":[2,3],
"hint":"One line grants the whole schema including tables analysts must never see. One line contradicts the role's own name.",
"exp":"Line 3: <code>SELECT ON ALL TABLES IN SCHEMA public</code> includes hr_salaries and payments — an analyst with business need for three reporting tables gets everything; least privilege grants named tables or views (better: a curated <b>view</b> layer that also applies <b>data masking</b> to sensitive columns), and every new table added to the schema is silently readable. Line 4 grants write rights to a role literally named read-only — INSERT/UPDATE/DELETE on payment rows from an analytics credential is the finding auditors write up first. Lines 1, 2, 5 and 6 are standard role plumbing: creating the role, connect rights, login, and a comment. The deeper lesson: <b>stored procedures</b> or views can expose exactly the needed operations without raw table grants."},
{"t":"dual","h":"The snapshot shared with the world","th":"SEC",
"sc":"Asset inventory at Quartz Commerce flags a volume snapshot of the production payments database, shared publicly to the cloud platform's community image list three days ago. It contains customer PII. Ticket INC-5521 just landed in your queue.",
"A":{"s":"Blue team: what is the correct FIRST action?",
"ch":["Remove the public sharing immediately, treat it as a potential data breach, rotate keys and assess what the snapshot exposes","Delete the snapshot right away so nobody can download it","Email the team about it at the end of the week","Rename the snapshot so it is harder to find"],
"a":0,
"hint":"You must both stop the bleeding and keep the evidence. Which option does only one of those?"},
"B":{"s":"Red team: you found the public snapshot three days ago. What did you actually do next?",
"ch":["Downloaded it and searched for weakly protected or unencrypted PII to resell or use for extortion","Reported it to the company's bug bounty program","Left it alone because snapshots are boring","Launched a DDoS to distract the blue team"],
"a":0,
"hint":"Blue: stop the exposure without destroying evidence. Red: three days of public availability means copies exist."},
"q":"Answer the blue-team (defend) side first; the red-team (attack) side then unlocks.","hint":"Blue: stop the exposure without destroying evidence. Red: three days of public availability means copies exist.",
"exp":"Blue: the first action kills the exposure (remove public sharing) WITHOUT destroying evidence — deleting the snapshot (B) erases proof of what was exposed and how long; incident process treats a public PII artifact as a potential breach: rotate <b>KMS</b> keys if the snapshot is unencrypted, inventory who/what downloaded it, and notify per policy. Renaming or emailing later changes nothing. Red: the realistic attacker path is download-and-mine: restore the snapshot privately, extract PII, resell or extort — three days of public availability means you must assume copies exist. This exercise is the storage-side twin of a public database endpoint: <b>public exposure</b> of any data artifact is a breach-class finding, not a hygiene ticket."},
{"t":"rank","h":"Risk ranking with traps","th":"SEC",
"sc":"The risk committee at Beacon Insurance has five findings and one remediation slot this week. Rank by actual risk. The traps: the loudest finding is not the riskiest, and the quietest one is a live attack.",
"q":"Rank the findings from most to least risky.",
"steps":["Production DB has a public endpoint and the logs show active password-guessing bursts against it","A stale dev copy of production PII sits on an unencrypted volume, internal network only","Replica lag of 90 seconds on the reporting cluster (minor user impact)","Backup restore test is 2 weeks overdue (capability risk, no active incident)","A license audit finding must be resolved within 90 days (non-database)"],
"rk":1,
"hint":"Live attacker beats dormant copy. Capability risk beats calendar paperwork.",
"exp":"1st: public endpoint + <b>active</b> password guessing — attacker proximity plus exposure is the textbook highest risk; it combines <b>public exposure</b> with evidence of exploitation attempts. 2nd: unencrypted PII copy — dormant but real: one compromised laptop on the internal network and it is a breach; internal-only lowers exposure, not impact, and missing <b>encryption at rest</b> is the finding. 3rd: 90-second replica lag — a service-quality issue with minor impact. 4th: overdue restore test — you cannot rank a capability risk above a live exposure, but an untested restore plan quietly voids the <b>RTO</b>/<b>RPO</b> promises. 5th: the license audit — calendar work, not database risk. The trap was ranking the PII copy first: emotional severity vs attack probability — committees must score both."},
{"t":"qcm","h":"Five minutes and thirty minutes","th":"AVL",
"sc":"The CTO of Quartz Commerce told the board: \u201CWe can afford to lose at most 5 minutes of data, and checkout must be back within 30 minutes.\u201D The deployed reality: a cross-region asynchronous replica with typical lag of 8 minutes (spikes to 15 under load), and an automated restore-and-promote procedure measured at 45 minutes in the last drill.",
"q":"Which single statement is true?",
"ch":["Both targets are at risk: the 8-minute lag endangers the RPO and the 45-minute drill endangers the RTO","Both targets are met with comfortable margin","Only the RTO is at risk; replication lag has nothing to do with data loss","Only the RPO is at risk; restore drills have nothing to do with recovery time"],
"a":0,
"hint":"Async lag = the window of writes that die with the primary. Drill time = the time to walk back into service. Compare both against the promises.",
"exp":"Both promises fail against measured reality. <b>RPO</b>: with <b>asynchronous replication</b>, writes not yet shipped when the primary dies are lost — an 8-minute typical lag (15 under load) breaks a 5-minute promise; fixing it means synchronous replication or log shipping every ≤5 minutes, both costing commit latency. <b>RTO</b>: the last drill showed 45 minutes to restore and promote against a 30-minute promise — the promise is untested hope; the fix is a faster runbook, standby promotion instead of rebuild, and frequent timed drills. The two distractors each deny half the problem — on the exam, denial dressed as half-truth is still wrong. Governance lesson: RTO/RPO are contracts; every design choice (sync vs async, standby vs restore) either honors or breaks them measurably."},
{"t":"match","h":"Migration vocabulary under audit","th":"MIG",
"sc":"An external auditor at Beacon Insurance reads the migration runbook and asks the team to define its terms exactly. The team's answers must survive a follow-up question each. Match the term to the definition the auditor accepts.",
"q":"Pair each migration term with its precise meaning.",
"pairs":[
["Homogeneous migration","Same engine to same engine — schema and code move with little or no translation"],
["Heterogeneous migration","Different source and target engines — objects and code must be converted"],
["Change data capture","Streams each ongoing change from source to target so both stay in sync until cutover"],
["Backfill","Copy the historical rows that existed before replication started"],
["Cutover","The controlled moment when the application stops writing to the source and starts writing to the target"]],
"hint":"Two words describe the journey type, two describe data movements, one is the moment of switch.",
"exp":"<b>Homogeneous</b> = same engine (MySQL to MySQL): little translation, low risk. <b>Heterogeneous</b> = different engines (Oracle to PostgreSQL): <b>schema conversion</b> and code rework dominate the plan. <b>Change data capture</b> streams the ongoing changes so the target trails the source by seconds; it is what makes a short downtime window possible. <b>Backfill</b> moves the history that predates replication — the first, biggest copy. <b>Cutover</b> is the switch itself: pause writes, drain lag to zero, repoint, resume, validate. The auditor's follow-up that trips teams: \u201Cwhat happens if you cutover while CDC lag is non-zero?\u201D — the answer (you lose those transactions) is why lag-to-zero is a gate, not a suggestion."},
{"t":"logv","h":"The cache that expired all at once","th":"PFM",
"sc":"09:00 at Quartz Commerce: dashboards turn amber, DB CPU jumps from 30% to 95%, and the Redis-style cache log below tells the story. Yesterday, an operator changed key TTLs from 24h to 6h for all product keys loaded during the midnight refresh — which always finishes at 03:00.",
"src":"cache + db — 09:00 window",
"logs":[
{"t":"08:59:58","l":"INFO","m":"cache: expired key=product:8842 remaining_keys 2.1M -> 1.9M"},
{"t":"09:00:01","l":"WARN","m":"cache: expired key=product:9931 remaining_keys 1.9M -> 1.2M"},
{"t":"09:00:03","l":"ERROR","m":"cache: MISS rate 61% (5min avg 9%) key=product:*"},
{"t":"09:00:04","l":"ERROR","m":"db: active queries 412 (avg 60) top: SELECT id,name,price FROM products WHERE id=$1"},
{"t":"09:00:06","l":"ERROR","m":"cache: MISS rate 74% remaining_keys 0.4M"},
{"t":"09:00:09","l":"WARN","m":"app: request queue depth 5800 on storefront pool"},
{"t":"09:00:12","l":"INFO","m":"cache: expired key=product:1102 remaining_keys 0.1M"}],
"qt":"multi",
"q":"Which two findings name the real problem and the right fix?",
"ch":["All keys share one TTL, so they expire in the same second — a cache stampede; fix with jittered TTLs and request coalescing (single-flight)","The database must be shielded while the cache refills: cap concurrent recompute and serve stale-while-revalidate","Disable TTLs entirely so keys never expire","Move the products table into the cache as the system of record"],
"a":[0,1],
"hint":"What happened at 03:00 yesterday, and what does that make 09:00 today? And what protects a database while its shield refills?",
"exp":"Same load time + same TTL = synchronized expiry: at 09:00 (6h after the 03:00 refresh) <b>every product key expires at once</b> — a <b>cache stampede</b>: millions of misses hit the database simultaneously, and CPU 30→95% plus queue depth 5,800 on the storefront <b>connection pool</b> is the shockwave. Fix one: <b>jittered TTLs</b> (add random minutes) and request <b>coalescing</b> so one flight recomputes a key while others wait. Fix two: protect the origin during refill — concurrency caps and stale-while-revalidate serve old values while one request refreshes. Disabling TTLs (C) turns stale prices into a correctness bug; making the cache the <b>system of record</b> (D) deletes your durability — caches are accelerators, not databases. <b>Caching</b> discipline — jittered TTLs, coalescing, stale-while-revalidate — is what keeps the shield from collapsing. The metrics chain (miss rate → db queries → app queue) is the diagnostic path worth memorizing."},
{"t":"fill","h":"Hardening checklist for the new cluster","th":"SEC",
"sc":"Marble Ledger provisions a new PostgreSQL cluster for card tokens. The security checklist lost five words. Each word is a control; the auditor expects all five in place before the first row is inserted.",
"q":"Complete the hardening checklist.",
"tx":"Enable encryption __1__ (TDE) using a customer-managed key from the __2__. Enforce __3__ on every client connection — reject anything unencrypted. Stream __4__ logs to the SIEM with alerts on bulk reads and GRANT changes. __5__ the PII columns in every lower environment, and remove public network access from all endpoints.",
"bank":["at rest","KMS","TLS","audit","mask","rotate"],
"a":["at rest","KMS","TLS","audit","mask"],
"hint":"Where the data sleeps, who holds the key, how the wire is protected, what watches, what hides.",
"exp":"<b>At rest</b> (via TDE) protects files, volumes and snapshots — stolen disks stay unreadable. A customer-managed key lives in the <b>KMS</b>, so you control rotation and revocation, not the provider. <b>TLS</b> on every connection is <b>encryption in transit</b> — the checklist rejects unencrypted sessions rather than allowing them by default. <b>Audit</b> logs streamed to the SIEM make bulk reads and privilege changes alertable events — the earlier \u201Cone IP, forty usernames\u201D exercise is what unwatched logs let happen. <b>Masking</b> PII in lower environments stops the classic leak: prod data copied to a wide-open dev database. Together with removing public access and least-privilege roles, this is the baseline hardening set for any cloud database."},
{"t":"multi","h":"Serverless database: true or false?","th":"CLD",
"sc":"The platform team at Quartz Commerce evaluates a serverless database for three workloads: a dev/test database used weekdays 09:00–18:00, a spike-y campaign storefront, and a steady 24/7 ledger. The vendor claims five things. Separate the claims from the mechanics.",
"q":"Select every TRUE statement about serverless databases.",
"ch":["Billing tracks actual usage (compute-seconds or requests) instead of fixed instance hours","The database can scale down to zero when nobody uses it","After an idle period, the first requests can hit a cold-start delay","It always costs less than a provisioned instance for any workload","It removes the need for backups and recovery planning"],
"a":[0,1,2],
"hint":"What the mechanism actually changes is billing and scaling. What it does not change is physics and duty of care.",
"exp":"True: <b>per-request / usage billing</b> replaces instance-hour billing; <b>scale to zero</b> makes the idle dev/test database nearly free — the killer use case; and <b>cold starts</b> are real — after idle, the first requests pay a resume delay, which matters for latency-sensitive paths. False: \u201Calways cheaper\u201D is a vendor myth — a steady, chatty 24/7 workload (the ledger) is usually cheaper provisioned, because per-request pricing punishes high, constant throughput; and serverless changes nothing about durability — <b>backups</b>, PITR and recovery objectives (RTO/RPO) remain your duty under <b>shared responsibility</b>. Decision rule: variable/idle workloads → serverless; steady hot workloads → provisioned. Match the pricing model to the demand curve, not the brochure."},
{"t":"order","h":"Somebody deleted this month's orders","th":"AVL",
"sc":"11:22 at Quartz Commerce: support reports missing orders. You find a batch DELETE run at 10:58 with a broken WHERE clause — it removed 1.2M rows of this month's orders. The application is still running and periodically re-trying. Backup: nightly full, log shipping every 5 minutes, PITR enabled.",
"q":"Order the recovery steps correctly.",
"steps":["Stop the failing job and pause application writes to prevent further damage","Record the exact corruption time (10:58) and scope the loss","Restore a fresh instance from the last full backup with PITR to just before the DELETE","Validate the restored data: row counts, spot checks, business sign-off","Switch the application to the restored instance and resume writes","Review the change that caused it and add safeguards (confirmations, approvals, row-count limits)"],
"hint":"Stop the bleeding, timestamp the wound, rebuild to one second before, prove it, resume, then prevent.",
"exp":"Order matters here more than anywhere. <b>Stop</b> the job and pause writes first — every second, the running system writes new rows on top of the loss and re-tries amplify damage. <b>Record</b> the exact time: PITR needs a target one second before the mistake, and the scope decides how much to restore. <b>Restore</b> to a fresh instance with <b>point-in-time recovery</b> — never repair the wounded production in place. <b>Validate</b> counts and business spot checks (the earlier restore-drill lesson), then <b>switch</b> — repoint the <b>connection string</b> — and resume. Last, <b>prevent</b>: the broken WHERE clause is a change-management finding — confirmations, approvals, and row-count guards on destructive statements. Skipping the validation step to save 10 minutes is how a 1.2M-row loss becomes a 3M-row loss."},
{"t":"qcm","h":"Consistent profiles on three continents","th":"CLD",
"sc":"Globex Retail serves user profiles from three regions. The hard requirement from legal and product: a profile update must be immediately visible everywhere — no regional divergence is acceptable. Reads and writes come from all three regions. The CFO wants the cheapest option that still meets the letter of the requirement.",
"q":"Which design satisfies the requirement?",
"ch":["A multi-region database service offering strong/global consistency for writes, with regional read paths that honor the same guarantee","One primary region with asynchronous read replicas in every region — cheapest and fastest to deploy","Three independent regional databases, each owning its region's users, with no coordination","A global cache layer in front of one regional database"],

"hint":"The requirement kills any design that lets regions disagree, even briefly. Which option can honestly promise that?",
