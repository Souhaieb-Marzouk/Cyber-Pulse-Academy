{t:"lines",th:3,p:10,k:"secret;image tags;container image;YAML manifest",
 s:"Security review, ticket SEC-881: a Deployment for the billing service is about to merge into prod. Your checklist: no root, no privileged, no host namespaces, pinned images, secrets out of manifests.",
 q:"Click every line that is a security problem for production (5 lines).",

 bad:[7,10,12,13,16],
 x:"Five findings, each one a written-up audit item. hostPID: true lets the container see every process on the node — an attacker's first reconnaissance stop. privileged: true strips away most of the isolation that namespaces and cgroups normally provide. runAsUser: 0 runs the process as root inside the container. The latest tag makes every redeploy a gamble on unknown bytes — prod images must be pinned. And the DB password sits as a plain env value in the manifest: it belongs in a Secret, encrypted at rest and mounted as a file. A tiny CPU request is a tuning issue, not a security one — that line stays.",

{t:"branch",th:1,p:10,k:"cluster;self-healing;node affinity;scheduling & bin packing;taints & tolerations",

  {s:"Drain done. But four pods stay Pending: their specs pin node affinity to kubernetes.io/hostname: worker-3.",q:"Fix?",c:[["Remove or widen the affinity pin so the scheduler can place them anywhere suitable",1],["Add a toleration for worker-3's taint",0],["Raise the HPA maxReplicas",0],["Restart the scheduler on the control plane",0]],a:0},
  {s:"Retro: worker-3's disk died. Leadership asks what makes next time boring.",q:"Pick the prevention.",c:[["Disruption budgets plus topology spread across nodes and zones — no single host strands an app",1],["Only ever buy bigger nodes",0],["Ban drains and wait for cloud auto-repair",0],["Give every pod a hostname affinity pin so it always returns to 'its' node",0]],a:0}],
 x:"A dead node is handled from the outside in: cordon stops new placements, drain moves evictable pods while respecting disruption budgets. A PDB of 100% blocks every voluntary eviction — a design smell; relax it consciously once the app tolerates one missing replica. Pods pinned by hostname affinity to a dead node can never be rescheduled: self-healing only works if the scheduler has somewhere to put the work. The durable fix is spread — budgets plus topology rules across nodes and zones, so one host is never a single point of failure for anything.",
 h:"You cannot fix the node from inside the cluster. You can fix what sits on it."},
{t:"multi",th:0,p:10,k:"image registry;container image;image tags;health checks",
 s:"ImagePullBackOff on payments-9c4d. The on-call channel collects six theories before anyone opens the events.",
 q:"Select every theory that CAN genuinely produce ImagePullBackOff.",
 c:[["The tag in the manifest does not exist in the registry — typo or never pushed",1],["The namespace lacks an imagePullSecret for the private registry",1],["The registry is rate-limiting pulls (HTTP 429 answers)",1],["The image was pushed to a different repository path than the manifest says",1],["The pod's liveness probe returns 500",0],["The node's CPU is fully reserved by other pods' requests",0]],
 x:"ImagePullBackOff is always a fetch problem: the reference (name or tag), the credentials, or the registry itself. A missing tag, a missing pull secret, rate limiting and a wrong repository path all end in the same event — the event's detail line tells you which one it is. Liveness failures happen after the container runs; they produce restarts, never pull errors. And exhausted CPU requests stop the scheduler before any pull is attempted: those pods stay Pending, not ImagePullBackOff.",
 h:"Two theories describe problems that occur at completely different lifecycle stages than pulling."},
{t:"term",th:3,p:10,k:"kubectl;pod;StatefulSet;self-healing;namespace",
 s:"The pod payments-api-0 in namespace prod has been stuck Terminating for 25 minutes after a node failure — its kubelet is unreachable, so deletion never confirms. The StatefulSet cannot start its replacement while the old object lingers.",
 q:"Goal: make the API server forget that pod immediately, without waiting for any kubelet to confirm, so the StatefulSet can recreate it on a healthy node. Choose tool and flags yourself.",
 host:"nortide-jump — bash",
 ac:["^kubectl delete pod payments-api-0( -n prod)? --force --grace-period ?= ?0$","^kubectl delete pod payments-api-0 --grace-period ?= ?0 --force( -n prod)?$","^kubectl -n prod delete pod payments-api-0 --force --grace-period ?= ?0$","^kubectl -n prod delete pod payments-api-0 --grace-period ?= ?0 --force$","^kubectl delete pod\/payments-api-0( -n prod)? --force --grace-period ?= ?0$","^kubectl -n prod delete pod\/payments-api-0 --force --grace-period ?= ?0$","^kubectl delete pod\/payments-api-0 --grace-period ?= ?0 --force( -n prod)?$"],
 out:["pod 'payments-api-0' force deleted","statefulset.apps/payments-api recreated pod payments-api-0 on worker-02"],
 exA:"kubectl delete pod payments-api-0 -n prod --force --grace-period=0",
 x:"Normal deletion politely asks the kubelet to stop containers and confirm. When the node is gone, that confirmation never arrives and the pod object lingers in Terminating forever. The -n prod flag is not decoration either: it names the namespace, because pod names are only unique inside one. --grace-period=0 together with --force tells the API server to remove the object immediately; the StatefulSet controller then sees its pod missing and recreates it on a healthy node — the self-healing loop needed the stale object gone first. Use it surgically: on a live pod it skips graceful shutdown and can lose in-flight work.",
 h:"Two flags travel together for this. One is a number."},
{t:"sort",th:4,p:10,k:"secret;image scanning;image tags;RBAC;cluster;Dockerfile",
 s:"The annual audit returned six findings for the platform. Leadership wants a remediation order: exposure first, hygiene later.",
 q:"Rank the findings — top = fix first.",
 items:["Database passwords committed as plain text in three Git repositories","The public checkout image is built on a base image with a critical CVE","Production manifests pull images by the mutable :latest tag","Every service account is bound to cluster-admin — no RBAC boundaries","The staging cluster runs a Kubernetes version two minor releases old","The internal wiki runs on a single node with no backups"],
 x:"Order by how directly each finding enables a breach today. Plaintext credentials in Git are live secrets that everyone with repo access already owns — rotate and purge history first. A critical CVE in the public checkout base image is a known, reachable exploit path, and it condemns the Dockerfile's base choice too. The mutable latest tag makes prod un-auditable and rollback a coin flip. cluster-admin everywhere means one compromised pod owns the cluster — RBAC boundaries cap the blast radius. The old staging cluster and the single-node wiki are real risks, but with lower exposure and containment paths that buy time.",
 h:"Ask for each: can someone use this against us this afternoon?"}
,{t:"qcm",th:3,p:10,k:"service types;health checks;labels & selectors;service discovery;load balancing",
 s:"prod, 11:05. kubectl get endpoints shop-api answers <none>. The Service selector is app: shop-api. Three pods exist, all Running, all restarted 40 minutes ago after a config change. Diagnostics below — filter them.",
 log:{name:"diagnostics — shop-api (endpoint controller + probes)",f:1,lines:[
 "2026-03-11T11:02:01Z INFO  endpoints sync service shop-api: 0 usable endpoints",
 "2026-03-11T11:02:01Z INFO  pods matching selector app=shop-api: 3 (x1, x2, x3)",
 "2026-03-11T11:01:44Z WARN  readiness httpGet /readyz -> 503 (pod shop-api-5c9d-x1)",
 "2026-03-11T11:01:45Z WARN  readiness httpGet /readyz -> 503 (pod shop-api-5c9d-x2)",
 "2026-03-11T11:01:47Z WARN  readiness httpGet /readyz -> 503 (pod shop-api-5c9d-x3)",
 "2026-03-11T10:22:09Z INFO  deployment shop-api: config change rolled out, 3 -> 3 replicas",
 "2026-03-11T10:22:12Z INFO  app log: config loaded: feature.flags = bad-value"]},
 q:"Endpoints are empty although three pods match the selector. What is the true cause?",
 c:[["All three pods fail readiness, so the endpoint list stays empty by design",1],["The Service selector matches zero pods",0],["The Service port does not match the container port",0],["kube-proxy is broken on one worker node",0]],
 x:"The subtle case: the selector DOES match three pods — yet endpoints are empty because readiness fails on every pod (503 on /readyz after the 10:22 config change). The endpoint controller lists only ready pods, and the Service load-balances across exactly that list — that is what keeps broken pods out of user traffic. A selector typo would report zero matching pods, not three. A port mismatch shows connection refused after traffic flows. kube-proxy trouble surfaces per node, never as a perfectly synchronized global emptiness. Next step: revert or fix the config — the app log already names it.",
 h:"The diagnostics answer two different questions. Do not mix them: matching is one, serving is the other."},
{t:"match",th:1,p:10,k:"autoscaling (HPA);resource requests & limits;namespaces & cgroups;ConfigMap;node affinity;rolling update;kubelet & kube-proxy;container runtime",
 s:"Six signals from last month's incident review, six root causes. The near-misses cost the team hours — match them correctly this time.",
 q:"Match each observed signal to its real root cause.",
 pool:["HPA pinned at maxReplicas for hours, CPU per pod still 95%","Pod restarts with reason OOMKilled although live memory graphs sit near 60%","Minutes after a ConfigMap change the app exits with 'invalid configuration'","50 pods Pending on a 50-node cluster with free capacity","Intermittent 503s only while a deployment is in progress","worker-4 flips NotReady every few hours; logs show kubelet heartbeat loss"],
 slots:["CPU limits set below real need — raise them (vertical) or fix the app","The memory limit is below the true bursts — the kernel's cgroup OOM-kill fires between samples","A bad value shipped in the ConfigMap — validate config before rollout","No node satisfies the pods' node affinity or summed requests","maxUnavailable removes ready pods before the replacements pass readiness","Kubelet or container runtime instability on that host — cordon it and investigate the machine"],
 map:[0,1,2,3,4,5],
 x:"Every signal has a near-miss twin, and the pairs punish pattern-matching. Autoscaling maxed while pods stay saturated is a per-pod ceiling: a vertical problem. OOMKills at '60% memory' are an averaging illusion — the cgroup limit is enforced at the burst instant, between graph samples. A crash right after a ConfigMap change is a config regression; scaling cannot fix a value. Pending with free capacity means constraints: affinity, taints or requests exclude every node. 503s that track deployments point at the rollout removing ready pods too early. A flapping node is the host: cordon and read the machine's logs.",
 h:"Ask of each signal: what ELSE would be true if the obvious cause were right?"},
{t:"order",th:2,p:10,k:"rolling update;kubectl;health checks;GitOps;CI/CD pipeline",
 s:"11:20: checkout 8.4.0 errors at 11%. Worse, the CD pipeline is auto-retrying the deploy every few minutes, each retry adding new bad pods.",
 q:"Order the response from first to last.",
 items:["Declare the incident and freeze the CD pipeline so it cannot push further changes","Roll back: kubectl rollout undo deployment checkout (or revert the GitOps commit)","Watch rollout status until every replica passes readiness on the previous version","Confirm customer metrics: error rate and latency return to baseline","Root-cause with the new version's logs and diffs; write the postmortem","Fix forward via a reviewed pull request; CI redeploys the corrected image"],
 x:"Order is everything under an active pipeline. First stop the bleeding source: freeze CD, or every fix fights a robot. Then roll back to the last good ReplicaSet — the previous revision is your ambulance. Recovery is proven, not assumed: rollout status until readiness is green everywhere, then customer-facing metrics back at baseline. Only with users safe comes the science: logs, diffs, postmortem. The pipeline returns last, carrying the corrected image through review — fix forward is how the incident ends, never how it starts.",
 h:"Something is still deploying. What must happen before anything else can?"},
{t:"triage",th:2,p:10,k:"blue-green deployment;canary deployment;rolling update;Deployment & ReplicaSet;StatefulSet;microservices",
 s:"Quarterly strategy review: four microservices, four constraints, one strategy per service.",
 q:"For each service, pick the deployment strategy that fits its constraint.",
 head:["Service & constraint","Strategy"],
 rows:[
  {a:"Payment service — any restart drops in-flight transactions; needs instant, zero-traffic switchback",o:["Rolling update","Canary","Blue-green","Recreate"],c:2},
  {a:"New recommendation engine — send 1% of real traffic, auto-abort if 5xx rises",o:["Rolling update","Canary","Blue-green","Recreate"],c:1},
  {a:"Stateless API — simple change, no spare capacity for a second environment, brief overlap is fine",o:["Rolling update","Canary","Blue-green","Recreate"],c:0},
  {a:"Legacy batch worker — cannot run two versions side by side; schema upgraded first in a maintenance window",o:["Rolling update","Canary","Blue-green","Recreate"],c:3}],
 x:"Blue-green buys the instant global switchback the payment service needs: both environments stand, traffic flips once, and one more flip returns. The recommendation engine is the textbook canary: a metric-driven tiny slice that grows or aborts. The stateless API fits a plain rolling update: no second environment to pay for, graceful overlap, old pods leave as new ones pass readiness. The batch worker cannot coexist with its successor at all, so recreate is the only honest answer — planned downtime inside the maintenance window. Constraint picks the strategy; there is no universal best.",
 h:"Ask: does the new version need watching (canary), switching (blue-green), coexisting (rolling), or solitude (recreate)?"},
{t:"lines",th:3,p:10,k:"ingress;service types;labels & selectors;secret;YAML manifest",
 s:"The shop ingress was applied an hour ago. Nothing routes. TLS looks fine on paper. One object file, three mistakes, no error messages — the worst kind of bug.",
 q:"Click the 3 broken lines.",
 code:["apiVersion: networking.k8s.io/v1","kind: Ingress","metadata:","  name: shop","spec:","  ingressClassName: nginix","  tls:","  - hosts:","    - shop.nortide.example","    secretName: shop-tls","  rules:","  - host: shop.nortide.example","    http:","      paths:","      - path: /api","        pathType: Prefix","        backend:","          service:","            name: shop-api","            port:","              number: 8443","---","kind: Service","metadata:","  name: shop-api","spec:","  selector:","    app: shop-api","  ports:","  - port: 80","    targetPort: 8443","---","kind: Deployment","metadata:","  name: shop-api","spec:","  template:","    metadata:","      labels:","        app: shopapi"],
 bad:[5,19,36],
 x:"Three silent failures. The ingress class is misspelled (nginix): the object is accepted, but no controller adopts it, so nothing routes — class names are exact strings. The ingress backend must reference the Service's port (80), not the container's targetPort (8443); the Service is the front door and maps 80 to 8443 itself. And the Service selector says app: shop-api while the Deployment's template labels say app: shopapi — one character, zero endpoints, and the ingress is innocent. The TLS block is actually correct: secret shop-tls carries the certificate the controller terminates.",
 h:"One typo no validator catches, one front-door/back-door mix-up, one one-character selector."}
,{t:"buckets",th:1,p:10,k:"resource requests & limits;scheduling & bin packing",
 s:"Node-pressure evictions hit 'random' pods last week. The team learns QoS classes the hard way: sort the four pod specs.",
 q:"Sort each pod spec into its quality-of-service class.",
 buckets:["Guaranteed","Burstable","BestEffort"],
 pool:["limits = requests for cpu AND memory","memory limit set, no cpu limit","no requests, no limits","cpu request 100m, cpu limit 500m"],
 map:[0,1,2,1],
 x:"Guaranteed means every container sets requests equal to limits for both CPU and memory — the strongest scheduling and eviction protection. BestEffort sets nothing at all: cheapest for the cluster, first against the wall. Everything mixed — a memory limit without a CPU limit, or a request below the limit — lands in Burstable. Under node memory pressure the kubelet evicts BestEffort first, then Burstable, and Guaranteed last. Knowing a pod's class tells you exactly who dies first when a node runs dry — usually the real story behind 'random' restarts.",
 h:"One spec is a perfect mirror, one is empty, two are compromises."},
{t:"qcm",th:3,p:10,k:"control plane;cluster",
 s:"03:00 on a Saturday: the disk of the etcd member on control-plane host cp-2 dies completely. The cluster runs three control-plane hosts.",
 q:"What is the true state of the cluster?",
 c:[["It keeps working — 2 of 3 members still form quorum — but restore or replace cp-2 quickly",1],["The whole cluster freezes until cp-2 returns",0],["Reads keep working but every write fails immediately",0],["The scheduler promotes a worker node to the control plane automatically",0]],
 x:"etcd needs a majority of members to agree on changes: with three members, two are enough. One dead member leaves a fully working cluster — reads and writes continue — but you are now one disk away from losing quorum entirely, so restore or replace the member promptly and never treat this state as normal. Losing a second member is what actually freezes the cluster. Nothing promotes a worker automatically: control-plane membership is designed and configured, never improvised by the scheduler.",
 h:"Majority math first. Then ask what one more failure would cost."},
{t:"branch",th:0,p:10,k:"network policy;image scanning;container image;image registry;ephemeral containers;secret",
 s:"02:10: pod orders-7b2 burns 40x its normal CPU and holds a steady outbound TLS connection to 185[.]22[.]4[.]9:4443 — an address no asset list explains. This is not your image's behavior.",
 q:"Work the incident — and once, briefly, from the other side.",
 steps:[
  {s:"The pod is compromised, but it is also the only live crime scene.",q:"First move?",c:[["Isolate: apply a deny-all NetworkPolicy to the pod and label it as evidence",1],["Delete the pod immediately",0],["Scale the deployment to zero",0],["Reboot the worker node",0]],a:0},
  {s:"The pod is cut off from its operators. Containers are ephemeral — evidence dies with the pod.",q:"Collect now:",c:[["Capture logs, image digest, command line, network flows and mounted secrets",1],["Nothing — containers are disposable, move on",0],["Only the pod name; the rest lives in the registry",0],["Delete the logs to save node disk space",0]],a:0},
  {s:"RED SIDE — you are the attacker planning attempt two. Blue now scans every registry path and verifies signatures at admission.",q:"Which move still evades?",c:[["None of them — content scanning does not care about names, baselines catch polite miners, egress rules do not depend on ports",1],["Rename the image to look like a trusted base",0],["Run the miner with lower CPU so alerts stay quiet",0],["Switch to a NodePort to skip the ingress",0]],a:0},
  {s:"Back to blue. Leadership funds one lasting fix.",q:"Pick it.",c:[["Verify signatures at admission and scan every image in CI; block unscanned pushes",1],["Give the namespace more CPU so miners hurt less",0],["Allow all egress so alerts stop firing",0],["Silence the nightly alerts to reduce noise",0]],a:0}],
 x:"Blue's first duty is containment without destruction: a deny-all NetworkPolicy cuts the miner off from its operators while the pod survives as evidence — deleting it destroys the only copy of the crime scene, and containers are ephemeral. Volatile facts come next: logs, image digest, command line, flows, mounted secrets. The red-side answer is 'none of them': content scanning ignores image names, CPU baselines catch polite miners, and egress policy does not care which port you entered by. The durable fix is supply-chain trust: signatures verified at admission plus CI scans that block unscanned pushes.",
 h:"One move preserves evidence, one preserves nothing. Then flip the keyboard."},
{t:"type",th:1,p:10,k:"autoscaling (HPA);kubectl",
 s:"The autoscaler for payments-api has been inert for a day. kubectl describe hpa payments-api gives the output below.",
 log:{name:"kubectl describe hpa payments-api",f:1,lines:[
 "Name:                       payments-api",
 "Namespace:                  prod",
 "Reference:                  Deployment/payments-api",
 "Targets:                    <unknown>/70%",
 "Min replicas:               2   Max: 10",
 "Deployment pods:            4 current / 4 desired",
 "Events:",
 "  Warning  FailedComputeMetricsReplicas",
 "           unable to fetch metrics from resource metrics API:",
 "           the server could not find the requested resource (get pods.metrics.k8s.io)"]},
 q:"Two answers below.",
 fields:[
  {lb:"1) Which component is missing or broken? (one hyphenated word)",ph:"component",ac:["^metrics-server$"],ex:"metrics-server",canon:"metrics-server"},
  {lb:"2) Type the command that lists deployment web's rollout history",ph:"$ kubectl ...",ac:["^kubectl rollout history( deployment)?(\/)? ?web$","^kubectl rollout history deployment\/web$","^kubectl rollout history deployments\/web$","^kubectl rollout history deployment web$","^kubectl rollout history deployments web$"],ex:"kubectl rollout history deployment web",canon:"kubectl rollout history deployment web"}],
 x:"The HPA reads CPU numbers through the metrics.k8s.io API, which is served by the metrics-server. 'Could not find the requested resource' means that API is absent — the metrics-server is not installed or not serving. Without it the autoscaler can compute nothing: targets stay <unknown> and pods never scale, whatever the dashboards say. The history question is one call: rollout history names the ReplicaSets that rollout undo steps through — four revisions means four known-good-or-bad places to return to.",
 h:"One answer is a component that is not built into the cluster by default. The other is a two-word kubectl verb pair."},
{t:"match",th:3,p:10,k:"persistent volumes;StatefulSet",
 s:"Storage chapter, exam-flashcard round: six cards, six definitions, one minute on the clock.",
 q:"Match each storage card to its exact meaning.",
 pool:["PersistentVolumeClaim","StorageClass","PersistentVolume","StatefulSet volumeClaimTemplates","Reclaim policy: Retain","Reclaim policy: Delete"],
 slots:["A pod-shaped request for durable storage","Defines which provisioner and parameters create volumes for claims","The actual volume object backing a claim","Stamps one dedicated claim per StatefulSet replica automatically","Keeps the volume and its data after the claim is deleted","Destroys the volume together with the claim — the common default"],
 map:[0,1,2,3,4,5],
 x:"The claim is what a pod asks for, in pod language. The StorageClass decides who builds it and how — disk type, encryption, zone. The PersistentVolume is the built object that backs the claim. volumeClaimTemplates make the StatefulSet stamp one dedicated claim per replica: web-0 keeps its own disk through rescheduling, which is what makes databases and queues work there. The reclaim policy is the end-of-story switch: Retain keeps the data for a human to decide; Delete wipes the volume with the claim — convenient for scratch disks, dangerous for databases if you did not mean it.",
 h:"One asks, one configures, one exists, one multiplies, two decide the ending."}
,{t:"lines",th:1,p:10,k:"autoscaling (HPA);horizontal vs vertical scaling;YAML manifest",
 s:"The new HPA for checkout was accepted by the API server but behaves insane: pods appear and vanish every two minutes under morning traffic. Three lines explain it.",
 q:"Click the 3 faulty lines.",
 code:["apiVersion: autoscaling/v2","kind: HorizontalPodAutoscaler","metadata:","  name: checkout","spec:","  scaleTargetRef:","    apiVersion: apps/v1","    kind: Pod","    name: checkout","  minReplicas: 5","  maxReplicas: 3","  metrics:","  - type: Resource","    resource:","      name: cpu","      target:","        type: Utilization","        averageUtilization: 65","  behavior:","    scaleDown:","      stabilizationWindowSeconds: 0"],
 bad:[7,9,19],
 x:"Three faults, three symptoms. kind: Pod is wrong — an HPA scales a workload object (Deployment, ReplicaSet, StatefulSet), never a single pod; there is no set to grow or shrink. minReplicas: 5 above maxReplicas: 3 is rejected outright at apply time — fix the floor or the ceiling. And stabilizationWindowSeconds: 0 means every down-scale acts on this instant's metric: spiky traffic makes the autoscaler thrash up and down, each swing costing cold starts and dropped requests — give the window a few hundred seconds so decisions smooth out. The 65% CPU target itself is perfectly sane.",
 h:"What object can be scaled, which numbers must agree, and how fast may the downswing react?"},
{t:"multi",th:4,p:10,k:"GitOps;desired state;reconciliation;secret;CI/CD pipeline",
 s:"A vendor pitches 'GitOps: Git becomes everything'. The platform lead separates the real statements from the sales deck.",
 q:"Select every TRUE statement.",
 c:[["Git holds the desired state; a controller continuously syncs the cluster toward it",1],["Manual kubectl changes are drift — the sync reverts them",1],["Every change travels as a pull request, which is a built-in audit trail",1],["Secrets can be stored encrypted in Git and decrypted in-cluster",1],["GitOps removes the need for any CI pipeline",0],["The cluster pushes its live state back into Git as a monitoring dashboard",0]],
 x:"GitOps makes Git the single source of truth: an agent in the cluster compares live state with the repository and reconciles differences — manual kubectl edits are drift by definition and get reverted, which is the feature, not the bug. Pull requests give review and audit for free. Secrets can live in Git only encrypted (vault- or SOPS-style), decrypted on arrival in the cluster. What GitOps does not do: CI still builds and tests code and images before anything reaches Git. And the state flow is one-way — Git to cluster; the cluster never writes a dashboard back.",
 h:"The pitch confuses a direction of flow with two things Git never does."},
{t:"term",th:1,p:10,k:"kubectl;resource requests & limits;cluster",
 s:"The vendor dashboard says three of twelve nodes run hot, but it lags by minutes. Before deciding what to drain, you want the cluster's own current view of node resource usage.",
 q:"Goal: show live CPU and memory usage of every node in the cluster, from the cluster's metrics. Choose tool and exact command yourself.",
 host:"nortide-jump — bash",
 ac:["^kubectl top nodes$","^kubectl top node$","^kubectl top no$","^kubectl top nodes --sort-by ?= ?cpu$","^kubectl top nodes --sort-by=cpu$"],
 out:["NAME        CPU(cores)   CPU%   MEMORY(bytes)   MEMORY%","worker-03   7205m        90%    11234Mi         71%","worker-07   6410m        81%    9880Mi          62%","worker-01   310m         4%     3210Mi          20%"],
 exA:"kubectl top nodes",
 x:"kubectl top asks the metrics-server for live usage — the cluster's own truth instead of a vendor cache. One screen answers the drain question: worker-03 at 90% CPU is the patient, worker-01 is nearly idle. Remember the difference though: top shows usage, describe nodes shows requests, limits and allocatable. Usage tells you how busy the machine is right now; requests tell you what the scheduler believes is reserved. Reading both is how you tell a genuinely busy node from an overcommitted one whose pods are quiet.",
 h:"One verb, one object type, no arguments needed."},
{t:"qcm",th:3,p:10,k:"StatefulSet;persistent volumes",
 s:"web is a StatefulSet with 5 replicas, every pod created from a volumeClaimTemplate. You run kubectl scale statefulset web --replicas=3.",
 q:"What actually happens?",
 c:[["The highest-ordinal pods (web-4, then web-3) are removed in order; their PVCs remain by default",1],["Random pods are removed and all their PVCs are deleted immediately",0],["The lowest-ordinal pods are removed and every PVC is wiped",0],["The StatefulSet refuses until every PVC is deleted by hand",0]],
 x:"StatefulSets shrink from the top: web-4 first, then web-3, in reverse order of creation — ordered identity is the entire point of the object. The claims created from the volumeClaimTemplate are NOT deleted by default: the data waits on the volume while the pods are gone, which is exactly what you want for databases and queues — scale back up and web-3 reattaches to its old disk. Removing PVCs by hand is a deliberate data-loss action, never an implicit side effect of scaling down.",
 h:"Which end dies first — and what happens to the data that is not part of the pod?"},
{t:"buckets",th:3,p:10,k:"network policy;service mesh (Istio);ingress;RBAC;secret",
 s:"Zero-trust week: six controls on one slide, and the CISO wants them sorted by the layer where they actually act.",
 q:"Sort the six controls into their layer.",
 buckets:["Network traffic","Identity & access","Data & workload hardening"],
 pool:["NetworkPolicy between pods","mTLS sidecars in a service mesh","TLS termination and certs at the ingress","RBAC roles bound to service accounts","Pod Security admission: no root, no privileged","Encryption at rest for etcd secrets"],
 map:[0,0,0,1,2,2],
 x:"Traffic controls decide which packets may flow: NetworkPolicy fences pod-to-pod traffic inside the cluster, the mesh's mTLS gives every service-to-service call an identity, and the ingress terminates TLS for the outside world. Identity and access is RBAC: which identity may do which verb on which object — bound to service accounts, so a compromised pod inherits exactly its own narrow rights. Hardening protects data and workload boundaries: Pod Security admission refuses root and privileged containers before they start, and etcd encryption at rest protects every Secret even when someone steals the datastore disks.",
 h:"Three layers: can the packet flow, may the caller act, and what survives theft?"}
,{t:"blank",th:3,p:10,k:"ingress;service types;secret;YAML manifest",
 s:"The shop ingress template lost five values in a refactor. The Service shop-api listens on port 80 and forwards to the container's 8443.",
 q:"Fill the five gaps: object kind, TLS secret, the required path field, the backend Service, and the port the backend must reference.",
 text:"apiVersion: networking.k8s.io/v1\nkind: {{0}}\nmetadata:\n  name: shop\nspec:\n  tls:\n  - hosts:\n    - shop.nortide.example\n    secretName: {{1}}\n  rules:\n  - host: shop.nortide.example\n    http:\n      paths:\n      - path: /\n        {{2}}: Prefix\n        backend:\n          service:\n            name: {{3}}\n            port:\n              number: {{4}}",
 bank:["Ingress","NetworkPolicy","shop-tls","shop-api","shop-api-svc","pathType","80","443","8443"],
 sol:[0,2,5,3,6],
 x:"The kind is Ingress. The tls block points at a Secret — shop-tls — holding the certificate and key the controller terminates with; without that secret the HTTPS listener never comes up. Every path must carry pathType (Prefix, Exact or ImplementationSpecific) or the API server rejects the object. The backend references the Service by name and by the Service's OWN port — 80 — not the container's targetPort 8443; the Service maps 80 to 8443. Writing 443 or 8443 in the backend is the classic ingress failure: requests land on a listener that does not exist.",
 h:"The backend speaks Service language, not container language. And one field is simply mandatory."},
{t:"triage",th:3,p:10,k:"DaemonSet;Job & CronJob;StatefulSet;Deployment & ReplicaSet;containers vs VMs;OpenShift",
 s:"Architecture intake: seven requirements arrive from seven teams. One object — or one honest 'wrong tool' answer — per requirement.",
 q:"For each requirement, choose the right workload object or place.",
 head:["Requirement","Right object / place"],
 rows:[
  {a:"Collect container logs on every node — exactly one collector per node",o:["DaemonSet","CronJob","StatefulSet","Deployment"],c:0},
  {a:"Run a report every night at 02:00, to completion",o:["DaemonSet","CronJob","StatefulSet","Deployment"],c:1},
  {a:"MySQL: stable identity, ordered startup, one dedicated disk per replica",o:["DaemonSet","CronJob","StatefulSet","Deployment"],c:2},
  {a:"Stateless API, 5 interchangeable replicas",o:["DaemonSet","CronJob","StatefulSet","Deployment"],c:3},
  {a:"One-off database schema migration before a release",o:["Job","DaemonSet","Ingress","HPA"],c:0},
  {a:"Regulated workload needs hard isolation from the host kernel",o:["Run it in a VM, not a bare container","Add a readiness probe","Set a CPU limit","Add a NetworkPolicy"],c:0},
  {a:"Bank subsidiary demands a certified Kubernetes with integrated CI/CD and developer tooling",o:["OpenShift","Docker Swarm","Docker Compose","Nomad"],c:0}],
 x:"One pod per node is a DaemonSet — collectors and node agents live there. Run-to-completion on a schedule is a CronJob; the one-off variant is a plain Job. Stable identity, ordered lifecycle and per-replica storage are the StatefulSet's contract. Interchangeable stateless replicas are the Deployment's. Kernel-grade isolation is not a container property at all — containers share the host kernel by design, so the regulated workload moves to a VM; probes, limits and policies change nothing about that boundary. And a certified distribution with integrated tooling describes OpenShift, not the lightweight options.",
 h:"Four controllers cover four lifecycle shapes. The last two questions are about boundaries and products, not controllers."},
{t:"sort",th:2,p:10,k:"rolling update;health checks;kubectl;CI/CD pipeline;cluster",
 s:"Incident INC-2041 is closed. For the postmortem you must reconstruct the timeline from eight artifacts with conflicting timestamps.",
 q:"Reconstruct the order of events.",
 items:["09:02 — deploy checkout:8.4.0 begins a rolling update (CHG-1187)","09:04 — alert: checkout 5xx rate climbs to 12%","09:05 — rollout marks the new pods Ready; errors continue from the new ReplicaSet","09:11 — on-call picks up the page; sees 5xx only on the new pods","09:16 — kubectl rollout undo deployment checkout","09:18 — rollout status: revision 41 healthy; 5xx falls back to baseline","09:25 — logs show the new version calling the payments endpoint with the wrong path","09:40 — postmortem action: contract test for the payments client added to CI"],
 x:"The artifacts tell one story. The deploy at 09:02 is the change; the alert at 09:04 is the impact. Readiness passing at 09:05 explains why the rollout did not stop itself: the process was alive and answered /readyz — it simply called the wrong path. The on-call confirmed the blast radius (only new pods) before acting, rolled back at 09:16, verified recovery at 09:18, and the log dive at 09:25 found the root cause: a changed payments path with no contract test. The action item at 09:40 turns the finding into a CI gate so this class of bug cannot ship again.",
 h:"Deploy, impact, false comfort, confirmation, rollback, proof, cause, prevention."},
{t:"qcm",th:1,p:10,k:"scheduling & bin packing;resource requests & limits;autoscaling (HPA)",
 s:"Node worker-01 reports 8 CPU allocatable. Five pods each request 1500m; live usage on the node is about 40%. A sixth pod, also requesting 1500m, stays Pending.",
 q:"Why is the sixth pod not scheduled onto worker-01?",
 c:[["The scheduler sums requests, not live usage — 6 x 1500m exceeds the 8000m allocatable",1],["Node CPU is exhausted, as the 40% usage proves",0],["The HPA blocked the scale-up",0],["The image cannot be pulled on that node",0]],
 x:"Requests are the scheduler's accounting units: a pod is placed only where the sum of requests still fits under allocatable. Five pods at 1500m leave 500m — less than the newcomer's request — so worker-01 is out regardless of live usage. The 40% figure only proves the resident pods under-use their reservations at this moment; the entire point of requests is guaranteeing headroom for bursts, not matching average load. The HPA has no say in scheduling, and a pull failure produces ImagePullBackOff, never Pending.",
 h:"Two different ledgers: what is promised, and what is happening right now."},
{t:"match",th:1,p:10,k:"health checks;self-healing",
 s:"Four probe-related outages from the incident library. Each one is a classic; each one has a specific wrong line in a probe config.",
 q:"Match each outage to its probe misconfiguration.",
 pool:["New pods take user traffic while still warming caches — first requests fail","Liveness fails under heavy load — kubelet restarts a busy pod, its load shifts, neighbors cascade","A slow-starting JVM pod is killed before it is ever Ready","A database blip removes every pod of the deployment from rotation at once"],
 slots:["Readiness missing or gating on the wrong thing — users hit cold pods","Liveness thresholds too aggressive for load spikes — restarts amplify load","No startupProbe — the liveness check fires during the slow boot","Readiness wired to a shared dependency — probe the app, not its dependencies"],
 map:[0,1,2,3],
 x:"Four classics, four different lines to fix. Without readiness the Service trusts every started pod — cold pods meet real users. Liveness that fails under load kills the busiest pod precisely when it matters, shifting load to neighbors: restart storms are usually liveness bugs, not app bugs. A startupProbe grants slow starters their boot window before liveness begins — without it, JVMs die mid-boot forever. And readiness that mirrors a shared dependency turns one database blip into a total outage: a probe must answer 'can THIS pod serve?', never 'is the universe healthy?'",
 h:"Two probes, two jobs: protect the user from the pod, and the pod from itself — plus one guard time."}
,{t:"multi",th:3,p:10,k:"ConfigMap;secret;Deployment & ReplicaSet;reconciliation;kubelet & kube-proxy",
 s:"Config day: a teammate edits a ConfigMap, a Secret, a label and an image tag, then expects every change to appear in running containers immediately.",
 q:"Select every TRUE statement about what actually happens.",
 c:[["Editing a ConfigMap does not restart pods; env-var changes need a rollout restart to apply",1],["Changing the image tag in the pod template creates a new ReplicaSet and rolls the pods",1],["Secrets mounted as files are refreshed by the kubelet after its sync delay; env-var secrets are not",1],["Changing a pod-template label triggers a rolling update",1],["Editing a ConfigMap instantly updates environment variables inside running containers",0],["Deployments watch their ConfigMaps and reload the app automatically",0]],
 x:"Environment variables are frozen at container start: an edited ConfigMap changes nothing inside a running container until the pods are restarted — that is why kubectl rollout restart exists. Template changes are different machinery: a new image tag or label rewrites the pod template, which creates a new ReplicaSet — a rollout by definition. Mounted files live on another clock: the kubelet's sync loop refreshes them after a delay, and the application must actually re-read them; env-var secrets never refresh. And nothing in the Deployment watches ConfigMaps for you — reload-on-change is an application feature, not a platform one.",
 h:"Three mechanisms, three clocks: process start, template rollout, kubelet sync."},
{t:"buckets",th:4,p:10,k:"Kubernetes;Docker Swarm;Apache Mesos / Nomad;managed Kubernetes (EKS/AKS/GKE);ECS / Fargate;Helm;Docker Compose;service mesh (Istio);orchestrator",
 s:"Tooling landscape exam question: eight names, four lanes, zero mercy for buzzwords.",
 q:"Sort the eight tools into their lane.",
 buckets:["Cluster orchestrators","Managed cloud services","Packaging & local dev","Traffic control"],
 pool:["Kubernetes","Docker Swarm","Nomad","EKS / AKS / GKE","ECS Fargate","Helm","Docker Compose","Istio service mesh"],
 map:[0,0,0,1,1,2,2,3],
 x:"Cluster orchestrators schedule containers across machines: Kubernetes is the industry default, Swarm is the simple one built into Docker, Nomad the lightweight generalist from the Mesos family. Managed cloud services sell you parts of that stack: EKS, AKS and GKE operate the control plane for you, Fargate runs the containers themselves without any servers to manage. Packaging and local dev: Helm charts bundle Kubernetes manifests for reuse, Compose describes multi-container apps on a single host — a laptop tool, not a cluster one. Traffic control is the mesh's lane: Istio adds identity, mTLS and traffic shaping between services; it schedules nothing.",
 h:"Who schedules, who sells the machinery, who packages, who shapes the traffic."},
{t:"qcm",th:0,p:10,k:"image tags;container image;image scanning;GitOps",
 s:"A regulated release must be exactly reproducible months later, and security patches must arrive deliberately, through review.",
 q:"Which image strategy is correct?",
 c:[["Pin images by immutable digest; automation bumps digests after scanning, via reviewed pull requests",1],["Use :latest everywhere so everyone always gets the newest code",0],["Pin by mutable tag; tags never change once pushed",0],["Trust the registry to keep :latest immutable",0]],
 x:"A digest is the image's content hash — immutable by definition — so a release recorded in digests is reproducible forever. Tags are mutable pointers: 1.4.2 can be re-pushed under the same name, and latest is whatever the registry says today; neither gives reproducibility. The workable pattern pairs digest pinning with automation: a scan approves a new digest, a reviewed pull request records the change, the pipeline applies it. Reproducibility and deliberate patching are two sides of the same supply-chain discipline — the digest is the unit both of them count in.",
 h:"One identifier never lies about its content. The others are nicknames."},
{t:"lines",th:3,p:10,k:"network policy;service discovery",
 s:"The intent: only the checkout callers may reach the api pods on 8080; everything else denied, in both directions. The applied policy below has three lines that betray that intent.",
 q:"Click the 3 lines that break the intent.",
 code:["apiVersion: networking.k8s.io/v1","kind: NetworkPolicy","metadata:","  name: api-protect","  namespace: prod","spec:","  podSelector:","    matchLabels:","      app: api","  policyTypes: [Ingress, Egress]","  ingress:","  - from:","    - namespaceSelector: {team: checkout}","    - podSelector: {}","    ports: [{port: 8080}]","  egress:","  - to:","    - ipBlock: {cidr: 0[.]0[.]0[.]0/0}"],
 bad:[12,13,17],
 x:"The intent is a tight allow-list; three lines turn it into a sieve. The namespaceSelector alone admits every pod of every namespace labelled team=checkout — pin the pods too by combining it with a podSelector in the same from-item. The bare podSelector: {} as its own from-item admits every pod in the prod namespace. And the egress destination 0[.]0[.]0[.]0/0 is the whole internet: it silently cancels the default-deny that policyTypes: Egress promises, so a compromised api may call anywhere. Network policies are allow-lists — every wildcard you did not mean is a door you opened.",
 h:"Two wildcards on the way in, one on the way out."},
{t:"triage",th:1,p:10,k:"resource requests & limits;autoscaling (HPA);scheduling & bin packing;rolling update;health checks;self-healing;ConfigMap",
 s:"Monday meltdown: five alarms fire at once. Each has an obvious wrong answer and one correct first move.",
 q:"For each alarm, pick the correct first move.",
 head:["Concurrent signals","Best first move"],
 rows:[
  {a:"Pod evicted: 'node was low on resource: memory'; its usage ran far above its requests",o:["Set realistic requests/limits and check for a leak","Raise the HPA ceiling","Add another node pool","Mark the pod BestEffort"],c:0},
  {a:"HPA flaps 4 → 14 → 4 pods every 3 minutes during the morning ramp",o:["Add a scaleDown stabilization window and re-check the target","Raise minReplicas to 14","Delete the HPA","Switch to vertical scaling"],c:0},
  {a:"Node under disk pressure: kubelet evicting pods that write unbounded logs to emptyDir",o:["Ship logs off-node and bound the emptyDir size","Restart the kubelet","Add a NetworkPolicy","Scale the deployment"],c:0},
  {a:"CrashLoopBackOff started right after the 09:00 config deploy; last good was 08:40",o:["Roll the config back (revert or undo), then validate before re-applying","Raise the CPU limit","Add replicas","Disable the probes"],c:0},
  {a:"Service 503s appear only while deployments finish",o:["Fix the rollout: maxUnavailable 0 / correct readiness gates","Pin the image to latest","Move to NodePort","Add a CronJob restart"],c:0}],
 x:"Five alarms, five different first moves. An eviction for memory with usage far above requests means the pod lied about its size: fix the requests and limits and hunt the leak — scaling spreads a leak, it never cures one. A flapping HPA needs smoothing: a stabilization window and an honest target, not a higher floor that just makes the thrashing more expensive. Disk-pressure evictions of log-writing pods are hygiene: ship logs out and bound scratch space. CrashLoops right after a config deploy point at the config: revert first, validate second. And 503s that track deploys are rollout mechanics: keep old pods until new ones are ready (maxUnavailable: 0) and let readiness tell the truth.",
 h:"Each alarm asks one question: what changed, and what is the smallest correct reaction to that change?"}

  d.appendChild(el("div",null,"<b>Your answer:</b> "+esc(r.your)));
  d.appendChild(el("div",null,"<b>Correct:</b> "+esc(r.corr)));
  var xp=el("div","expl");xp.appendChild(el("span","tt","Why"));xp.appendChild(el("div",null,esc(ex.x)));
  d.appendChild(xp);fb.appendChild(d);
 }else if(st.hint){
  fb.appendChild(el("div","hintbox","💡 Hint: "+esc(ex.h)));
 }
 var ft=el("div","exfoot");
 var chk=el("button","btn-pri","Check");chk.type="button";chk.disabled=S.ended;chk.title="Validate this answer and pause the timer for review";chk.onclick=doCheck;ft.appendChild(chk);
 var skp=el("button","btn-wrn","Skip");skp.type="button";skp.disabled=st.ck||st.st==="skip"||S.ended;
 skp.title=st.st==="skip"?"Already skipped — answer it and press Check to count it":"Skip and come back later (excluded from scoring until answered)";
 skp.onclick=doSkip;ft.appendChild(skp);
 var hnt=el("button","btn-amb","Hint (−10%)");hnt.type="button";hnt.disabled=st.hint||S.ended;hnt.onclick=doHint;ft.appendChild(hnt);
 if(st.ck){var rv=el("button",null,"Revise");rv.type="button";rv.title="Unlock this answer — your checked score is cleared until you Check again";rv.onclick=doRevise;ft.appendChild(rv);}
 ft.appendChild(el("span","spacer"));
 var pos=S.order.indexOf(i);
 var lockNav=!!S.manual;
 var prv=el("button",null,"◀ Prev");prv.type="button";prv.disabled=pos===0||S.ended||lockNav;
 prv.title=lockNav?"Press Resume first — the exam is paused":"Go to previous question (ends review mode and resumes the timer)";
 prv.onclick=function(){go(S.order[pos-1]);};ft.appendChild(prv);
 var nxt=el("button","btn-pri","Next ▶");nxt.type="button";nxt.disabled=pos===EX.length-1||S.ended||S.manual;
 nxt.title=S.cp?"Go to the next question (resumes the timer)":(S.manual?"Resume first — the exam is paused":"Go to next question");
 nxt.onclick=function(){S.cp=false;go(S.order[pos+1]);};ft.appendChild(nxt);
 w.appendChild(ft);
 w.appendChild(el("div","kwline","Skills in this exercise: "+esc(ex.k.split(";").join(", "))));
 $("exam").classList.toggle("paused",S.manual);
}
function doCheck(){
 if(S.ended)return;
 var i=S.cur,ex=EX[i],st=S.ex[i];
 st.warn="";
 if(ex.t==="term"&&!norm(st.ans.v)){st.warn="Type a command in the terminal before pressing Check.";renderEx();mkNav();return;}
 var r=R[ex.t].check(ex,st.ans);
 st.res=r;st.base=ex.p*r.got/r.n;
 st.earned=Math.max(0,st.base-(st.hint?ex.p*0.1:0));
 st.ck=true;if(st.st==="skip")st.st="done";
 S.cp=true;
 renderEx();mkNav();paintTop();
}
function doSkip(){
 if(S.ended)return;
 var st=S.ex[S.cur];
 st.st="skip";
 var pos=S.order.indexOf(S.cur);
 if(pos<EX.length-1)go(S.order[pos+1]);else{renderEx();mkNav();}
 paintTop();
}
function doHint(){
 var i=S.cur,ex=EX[i],st=S.ex[i];
 st.hint=true;
 if(st.ck)st.earned=Math.max(0,st.base-ex.p*0.1);
 renderEx();mkNav();paintTop();
}
function doRevise(){
 var st=S.ex[S.cur];
 st.ck=false;st.res=null;st.base=null;st.earned=null;
 if(st.ans.hist)st.ans.hist=[];
 renderEx();mkNav();paintTop();
}
function doPause(){
 if(!S.started||S.ended)return;
 S.manual=!S.manual;$("pausebtn").textContent=S.manual?"▶ Resume":"⏸ Pause";
 $("pcover").hidden=!S.manual;
 try{$("exwrap").inert=S.manual;}catch(e){}
 if(S.manual){$("exam").classList.add("paused");}else{$("exam").classList.remove("paused");}
 renderEx();mkNav();paintTop();
}
function tryFinish(){
 var t=scoreTotals();
 if(t.c===0&&t.sk===EX.length){
  window.alert("All exercises are skipped. Answer at least one exercise (press Check) before finishing.");
  return;
 }
 if(S.ended)return;
 if(!window.confirm("Finish the exam and see your results?"))return;
 finishExam(false);
}
function finishExam(auto){
 S.ended=true;S.cp=false;S.manual=false;$("pausebtn").disabled=true;$("pausebtn").textContent="⏸ Pause";
 $("pcover").hidden=true;
 try{$("exwrap").inert=false;}catch(e){}
 buildResults(auto);
 paintTop();
}
function buildResults(auto){
 $("exam").hidden=true;
 var w=$("results");w.hidden=false;w.innerHTML="";
 var t=scoreTotals(),reported=Math.round(t.e),pct=t.m>0?Math.round(100*reported/t.m):0,pass=pct>=CFG.pass;
 var c1=el("div","card");
 if(auto)c1.appendChild(el("p","ambt","⏱ Time is over — the exam was submitted automatically."));
 c1.appendChild(el("div","banner "+(pass?"pass":"fail"),pass?"✔ PASS — "+pct+"%":"✘ FAIL — "+pct+"%  (pass mark: "+CFG.pass+"%)"));
 c1.appendChild(el("p","subline",pass?"Certificate-style result: you reached the passing score on this "+CFG.sev+" exam.":"You must retake this exam to reach the "+CFG.pass+"% pass mark. Review the report below, then press Retake Exam."));
 var g=el("div","resgrid");
 function stat(v,l){var s=el("div","statc");s.appendChild(el("div","v",v));s.appendChild(el("div","l",l));g.appendChild(s);}
 stat(t.e.toFixed(1),"points earned");
 stat(pct+"%","score (non-skipped only)");
 stat(t.m,"points possible (non-skipped)");
 stat(checkedCount()+"/"+EX.length,"checked");
 stat(t.sk,"skipped (not counted)");
 c1.appendChild(g);
 if(t.sk>0){
  var names=[];
  for(var i=0;i<EX.length;i++)if(S.ex[i].st==="skip")names.push("Q"+(S.order.indexOf(i)+1));
  c1.appendChild(el("div","skipbox","⚠ Skipped and excluded from scoring: "+esc(names.join(", "))+". They count in neither your points nor the maximum."));
 }
 w.appendChild(c1);
 var c2=el("div","card");
 c2.appendChild(el("h2",null,"Per-exercise report"));
 var tb=el("table","rtable");
 tb.innerHTML="<thead><tr><th scope=\"col\">Q</th><th scope=\"col\">Type / skills</th><th scope=\"col\">Your answer</th><th scope=\"col\">Correct answer</th><th scope=\"col\">Points</th><th scope=\"col\">Result</th><th scope=\"col\">Explanation</th></tr></thead>";
 var bd=el("tbody");
 for(i=0;i<EX.length;i++){
  (function(i){
   var st=S.ex[i],ex=EX[i],row=el("tr");
   var label,tag;
   if(st.st==="skip"){label="skipped";tag='<span class="tagskip">→ skipped (not counted)</span>';}
   else if(!st.ck||!st.res){label="zero";tag='<span class="tagzero">✗ not checked (0)</span>';}
   else{
    var gp=st.res.got/st.res.n;
    if(gp>=1){label="full";tag='<span class="tagfull">✓ full</span>';}
    else if(gp<=0){label="zero";tag='<span class="tagzero">✗ zero</span>';}
    else{label="partial";tag='<span class="tagpart">⚠ partial</span>';}
   }
   var your="(skipped — not scored)",corr;
   if(st.ck&&st.res){your=st.res.your;corr=st.res.corr;}
   else{var tmp=R[ex.t].check(ex,initAns(ex));corr=tmp.corr;}
   row.appendChild(el("td",null,String(S.order.indexOf(i)+1)));
   row.appendChild(el("div",null,"<b>"+TYPENAMES[ex.t]+"</b><div class='revexp'>Review: "+esc(ex.k.split(";").join(", "))+"</div>"));
   row.appendChild(el("td",null,'<span class="mono">'+esc(your)+"</span>"));
   row.appendChild(el("td",null,'<span class="mono">'+esc(corr)+"</span>"));
   row.appendChild(el("td",null,(st.earned==null?0:st.earned).toFixed(1)+" / "+ex.p));
   row.appendChild(el("div",null,tag));
   row.appendChild(el("td",null,'<span class="revexp">'+esc(ex.x)+"</span>"));
   bd.appendChild(row);
  })(i);
 }
 tb.appendChild(bd);var tsc=el("div","tscroll");tsc.appendChild(tb);c2.appendChild(tsc);
 var rt=el("button","btn-pri","Retake Exam");
 rt.type="button";rt.style.minWidth="220px";rt.style.marginTop="14px";
 rt.onclick=function(){startExam();};
 var wrap=el("div");wrap.style.textAlign="center";wrap.appendChild(rt);c2.appendChild(wrap);
 w.appendChild(c2);
 if(!S.reported){
  S.reported=true;
  reportScore(reported,t.m);
 }
 window.scrollTo({top:0,behavior:"auto"});
}
function boot(){
 S.left=CFG.min*60;
 $("tmr").textContent=fm(S.left);
 $("pausebtn").onclick=doPause;
 $("pcres").onclick=doPause;
 buildIntro();paintTop();
 setInterval(tick,1000);
}
boot();

</script>
</body>
</html>
