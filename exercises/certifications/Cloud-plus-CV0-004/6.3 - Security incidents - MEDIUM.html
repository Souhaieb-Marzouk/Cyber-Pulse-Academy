var EXAMS=[
{ id:'m01', type:'qcm', pts:2, theme:'det', title:'GuardDuty finding on deploy-bot',
  tags:['GuardDuty','alert triage','CloudTrail'],
  scenario:`<p>03:12, your SOC shift. GuardDuty raises a HIGH finding: <em>CredentialAccess:IAMUser/AnomalousBehavior</em> for the IAM user <code>deploy-bot</code>. The user's long-lived access key was just used from a country it has never been used in, with a new user agent. The deployment pipeline itself still looks normal.</p>`,
  question:`<p>What is the best <strong>first</strong> action?</p>`,
  ui:{label:'CHOOSE ONE',options:[
    {t:'Delete the deploy-bot IAM user immediately so the key stops working'},
    {t:'Pull the last 24 hours of CloudTrail for deploy-bot, then disable and rotate the key',correct:true},
    {t:'Wait until the next business day and email the dev team for confirmation'},
    {t:'Add a perimeter rule that blocks the source country at the network layer'}
  ]},
  hint:'Evidence first, then containment. GuardDuty tells you that something happened; CloudTrail tells you exactly what the key did.',
  explain:`<p>Option B is right: you confirm scope with CloudTrail and stop the bleeding by disabling and rotating the key. Deleting the whole user can break production jobs and destroys useful evidence. Waiting a day lets the attacker keep the stolen key. A country block does not help — the attacker can reroute, and the key stays valid.</p>`},

{ id:'m02', type:'multi', pts:3, theme:'det', title:'Which alerts belong to INC-4471?',
  tags:['alert triage','correlation','leaked key'],
  scenario:`<p>Ticket <strong>INC-4471</strong>: a private access key for <code>deploy-bot</code> was pasted into a public GitHub issue 40 minutes ago. You pulled five alerts from the last hour. Link the alerts that are part of the same incident.</p>`,
  question:`<p>Select <strong>all</strong> alerts that are likely part of the leaked-key incident.</p>`,
  ui:{label:'SELECT ALL THAT APPLY',options:[
    {t:'03:01 DHCP renewal recorded on jane-laptop in the Berlin office'},
    {t:'02:14 CreateAccessKey for deploy-bot from an unknown IP in a new country',correct:true},
    {t:'03:12 GuardDuty PortProbe warning on the company NAT gateway'},
    {t:'02:20 ConsoleLogin as deploy-bot with no MFA from that same unknown IP',correct:true},
    {t:'02:26 GetObject ×412 on bucket fin-reports authenticated as deploy-bot',correct:true}
  ]},
  hint:'Follow the identity. What did the deploy-bot identity do right after the leak, and from where?',
  explain:`<p>The three correct alerts all touch the <code>deploy-bot</code> identity right after the leak: a new key was created, a console login followed without MFA, and the identity then read hundreds of objects from a finance bucket. The laptop DHCP renewal is normal office traffic. A port probe on the NAT gateway is background internet noise, not tied to this identity or this timeline.</p>`},

{ id:'m03', type:'bucket', pts:6, theme:'det', title:'Map each behaviour to its ATT&CK tactic',
  tags:['MITRE ATT&CK','IoA','kill chain'],
  scenario:`<p>CloudTrail shows six behaviours during one intrusion. Map each behaviour to the MITRE ATT&CK tactic it represents, so the threat-hunt report uses the right language.</p>`,
  question:`<p>Drag each behaviour onto its tactic.</p>`,
  ui:{label:'DRAG EACH ITEM TO ITS TACTIC',
    items:[
      {id:'a',l:'Use a long-lived access key found in a public repo'},
      {id:'b',l:'Attach AdministratorAccess to the compromised user'},
      {id:'c',l:'Run ListBuckets and ListUsers to map the account'},
      {id:'d',l:'Create a spare IAM user named aws-support-dev'},
      {id:'e',l:'Download objects from the backup bucket'},
      {id:'f',l:'Run a coin-miner on a fresh GPU instance'}
    ],
    buckets:[
      {id:'cred',l:'Credential Access'},
      {id:'esc',l:'Privilege Escalation'},
      {id:'disc',l:'Discovery'},
      {id:'pers',l:'Persistence'},
      {id:'coll',l:'Collection'},
      {id:'imp',l:'Impact'}
    ],
    correct:{a:'cred',b:'esc',c:'disc',d:'pers',e:'coll',f:'imp'}},
  hint:'Ask what the attacker gains from the step: a credential, more power, knowledge, a way back in, data, or money.',
  explain:`<p><strong>Credential Access</strong> = getting a usable key from the repo. <strong>Privilege Escalation</strong> = attaching an admin policy to gain more power. <strong>Discovery</strong> = listing buckets and users to learn the environment. <strong>Persistence</strong> = creating a spare user so access survives key rotation. <strong>Collection</strong> = pulling data from the backup bucket. <strong>Impact</strong> = the coin miner, which costs you compute and money.</p>`},

{ id:'m04', type:'order', pts:5, theme:'proc', title:'Put the NIST IR phases in order',
  tags:['NIST IR phases','runbook','incident response'],
  scenario:`<p>A leaked-key incident is over. Your manager asks you to present the response in the standard NIST incident-response life-cycle order.</p>`,
  question:`<p>Drag the five steps into the correct NIST IR order (first step on top).</p>`,
  ui:{label:'DRAG TO REORDER — FIRST STEP ON TOP',axis:'First step on top, last step at the bottom',
    items:[
      {id:'p1',l:'Post-incident activity — lessons-learned review, runbook update'},
      {id:'p2',l:'Containment — leaked key disabled, active sessions revoked'},
      {id:'p3',l:'Detection & analysis — GuardDuty alert triaged, scope confirmed'},
      {id:'p4',l:'Recovery — rotated credentials issued, service restored and watched'},
      {id:'p5',l:'Eradication — attacker-created IAM user and keys removed'}
    ],
    correct:['p3','p2','p5','p4','p1']},
  hint:'Detect first, then stop the damage, then remove the attacker, then restore, then learn.',
  explain:`<p>The NIST life cycle runs: <strong>Detection &amp; analysis</strong> (find and understand it), <strong>Containment</strong> (stop the damage early), <strong>Eradication</strong> (remove the attacker and their backdoors), <strong>Recovery</strong> (restore service with clean credentials and watch for re-infection), and <strong>Post-incident activity</strong> (lessons learned). Containment comes before eradication because stopping active damage has priority over cleaning up.</p>`},

{ id:'m05', type:'logview', pts:2, theme:'esc', title:'CloudTrail: a quiet 90 seconds',
  tags:['CloudTrail','backdoor user','log analysis'],
  scenario:`<p>02:40. GuardDuty flagged unusual IAM activity on account 444455556666. You open CloudTrail around the detection time. Routine CI traffic from the runner subnet and a normal MFA console login for alice are mixed in.</p>`,
  question:`<p>Filter the log if you like, then complete the incident note below.</p>`,
  ui:{label:'LOG ANALYSIS — FILL THE INCIDENT NOTE',
    lines:[
      '{"ts":"02:14:07","event":"CreateUser","user":"svc-backup2","src":"203[.]0[.]113[.]44","agent":"aws-cli/2.15"}',
      '{"ts":"02:14:31","event":"CreateAccessKey","user":"svc-backup2","src":"203[.]0[.]113[.]44","agent":"aws-cli/2.15"}',
      '{"ts":"02:15:02","event":"AttachUserPolicy","user":"svc-backup2","policy":"AdministratorAccess","src":"203[.]0[.]113[.]44"}',
      '{"ts":"02:15:40","event":"GetBucketLocation","user":"svc-backup2","bucket":"fin-reports"}',
      '{"ts":"02:16:03","event":"PutBucketPolicy","user":"svc-backup2","bucket":"fin-reports","effect":"public-read"}',
      '{"ts":"02:22:11","event":"DescribeInstances","user":"ci-runner","src":"10[.]0[.]8[.]15"}',
      '{"ts":"02:25:44","event":"ListUsers","user":"ci-runner","src":"10[.]0[.]8[.]15"}',
      '{"ts":"02:31:20","event":"ConsoleLogin","user":"alice","mfa":"yes","src":"198[.]51[.]100[.]8"}'
    ],
    inner:{type:'fill',text:'Between 02:14 and 02:15, someone using aws-cli from 203[.]0[.]113[.]44 created a new IAM {0} named svc-backup2, issued it an access key, and attached the {1} policy. Minutes later they made bucket fin-reports public. The ci-runner and alice entries are routine and unrelated.',
      bank:['user','AdministratorAccess','ReadOnlyAccess','bucket','snapshot','instance'],
      correct:['user','AdministratorAccess']}},
  hint:'Filter for 203[.]0[.]113[.]44 to keep only the attacker traffic.',
  explain:`<p>The three events from the external IP are a classic backdoor: <code>CreateUser</code>, <code>CreateAccessKey</code>, and <code>AttachUserPolicy</code> with <code>AdministratorAccess</code>. That is privilege escalation plus persistence — even if the original leaked key is rotated, the new user keeps working. The bucket was then made public, which is why data reporting must include fin-reports. The ci-runner calls come from an internal subnet and alice logged in with MFA, so both are routine.</p>`},

{ id:'m06', type:'fill', pts:4, theme:'con', title:'Complete the containment runbook',
  tags:['containment','key rotation','revocation'],
  scenario:`<p>You are drafting the generic containment runbook for leaked cloud credentials. Each step uses one precise verb — pick them from the word bank.</p>`,
  question:`<p>Fill every blank with the verb that matches the step.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'<strong>Step 1:</strong> {0} the exposed key in IAM so it can no longer authenticate.<br><strong>Step 2:</strong> {1} all sessions and temporary tokens that were issued before containment.<br><strong>Step 3:</strong> {2} the credential in the secret manager so every dependent service picks up a fresh value.<br><strong>Step 4:</strong> if the host is also suspect, {3} it by attaching a quarantine security group that allows only your forensic jump box.',
    bank:['disable','revoke','rotate','isolate','terminate','snapshot'],
    correct:['disable','revoke','rotate','isolate']},
  hint:'You stop the old credential, you cancel sessions, you replace the value, and you cut the host off from the network.',
  explain:`<p><strong>Disable</strong> deactivates the key so it cannot authenticate. <strong>Revoke</strong> ends sessions and tokens already issued — they would otherwise stay valid even after the key is disabled. <strong>Rotate</strong> replaces the credential value in the secret manager so services get a new secret. <strong>Isolate</strong> cuts the host off from normal traffic while keeping it reachable for forensics. Terminate destroys evidence, and a snapshot is evidence collection, not network containment.</p>`},

{ id:'m07', type:'bucket', pts:6, theme:'esc', title:'Leaked credential or privilege escalation?',
  tags:['classification','leaked credentials','privilege escalation'],
  scenario:`<p>Your team keeps mixing up incident types in tickets. Build the classification wall: each item belongs to <em>leaked-credential</em> incidents or to <em>privilege-escalation</em> incidents.</p>`,
  question:`<p>Drag each item into the incident class it defines.</p>`,
  ui:{label:'DRAG EACH ITEM TO ITS CLASS',
    items:[
      {id:'c1',l:'API key pasted into a public GitHub issue'},
      {id:'c2',l:'NOPASSWD:ALL added for a dev user in /etc/sudoers'},
      {id:'c3',l:'STS session token replayed from a new country'},
      {id:'c4',l:'User attaches AdministratorAccess to their own account'},
      {id:'c5',l:'Database password hardcoded in a Jenkinsfile'},
      {id:'c6',l:'Lambda role granted iam:PassRole on an admin role'}
    ],
    buckets:[
      {id:'leak',l:'Leaked / exposed credentials'},
      {id:'esc',l:'Privilege escalation'}
    ],
    correct:{c1:'leak',c2:'esc',c3:'leak',c4:'esc',c5:'leak',c6:'esc'}},
  hint:'Leaked = a secret ends up where strangers can read it. Escalation = an identity gains powers it should never have.',
  explain:`<p>Leaked-credential incidents start with a secret being exposed or reused by a stranger: the key in a public issue, the replayed session token, the password in the Jenkinsfile. Privilege-escalation incidents start with an identity gaining power it should not have: sudo with NOPASSWD for every command, a self-attached admin policy, and a Lambda role that can pass an admin role to any service. One class is about <em>exposure of secrets</em>, the other about <em>growth of power</em>.</p>`},

{ id:'m08', type:'spot', pts:1, theme:'esc', title:'One line makes this policy dangerous',
  tags:['IAM policy','least privilege','over-privileged identity'],
  scenario:`<p>A data-entry user called <code>reporting-ui</code> got the policy below. A reviewer says one line turns it into a privilege-escalation risk even though the Resource looks narrow.</p>`,
  question:`<p>Click the <strong>one</strong> line that creates the risk.</p>`,
  ui:{label:'CLICK THE DANGEROUS LINE',
    lines:[
      '{',
      '  "Version": "2012-10-17",',
      '  "Statement": [{',
      '    "Effect": "Allow",',
      '    "Action": "*",',
      '    "Resource": "arn:aws:iam::444455556666:role/reporting-readonly"',
      '  }]',
      '}'
    ],
    correct:[4]},
  hint:'Which line says "every possible permission" instead of a list of needed ones?',
  explain:`<p><code>"Action": "*"</code> grants every action — including IAM actions like <code>iam:PassRole</code> or <code>sts:AssumeRole</code> — against the role resource. That is how a small reporting user becomes able to take on other roles. The Version line is just the policy-language date and is harmless. The fix is least privilege: list only the exact read actions the UI needs.</p>`},
{ id:'m09', type:'branch', pts:3, theme:'con', title:'Branching: the key in the public issue',
  tags:['leaked credentials','containment','decision making'],
  scenario:`<p>19:55. A junior dev tells you on chat: "I pasted a staging access key into a public GitHub issue to show an error. Is that bad?" The key belongs to <code>stg-pipeline</code>.</p>`,
  question:`<p>Work the branch — each decision changes what happens next.</p>`,
  ui:{label:'BRANCHING SCENARIO — CHOOSE ONE OPTION PER STEP',
    nodes:[
      {q:'What do you do first?',opts:[
        {t:'Check CloudTrail for any use of the key, then decide containment',ok:true,fb:'You open CloudTrail. The key made two ListBuckets calls from an IP you do not recognise 30 minutes ago.'},
        {t:'Ask the dev to delete the GitHub comment first',ok:false,fb:'The comment is deleted. But bots scrape deleted comments within minutes — the key must be treated as burned either way.'},
        {t:'Nothing yet — staging keys are low value',ok:false,fb:'An hour passes. The key is now used from three new IPs. Staging keys often open doors to production data.'}]},
      {q:'CloudTrail shows the key was used from an unknown IP. What now?',opts:[
        {t:'Disable the key and revoke stg-pipeline sessions now',ok:true,fb:'You disable the key and revoke sessions. The unknown traffic stops within two minutes.'},
        {t:'Rotate the key next week in the normal cycle',ok:false,fb:'The key stays valid for days. The attacker keeps reading buckets.'},
        {t:'Only change the GitHub account password',ok:false,fb:'The GitHub password is unrelated. The cloud key itself remains valid and in the wild.'}]},
      {q:'Containment is done. Which follow-up prevents a repeat?',opts:[
        {t:'Enable secret scanning and move the secret into the secrets manager',ok:true,fb:'Secret scanning flags future leaks in minutes; the secrets manager removes the need to paste keys at all.'},
        {t:'Ask the dev to be more careful next time',ok:false,fb:'Friendly, but it changes nothing. The same paste happens again in a month.'},
        {t:'Close the ticket — the key is disabled',ok:false,fb:'The root cause is still open: secrets live in chat and issues, not in a vault.'}]}
    ]},
  hint:'Real order: verify use, contain the credential, then fix the process that let the secret leak.',
  explain:`<p>Three sound decisions: (1) check CloudTrail <em>before</em> acting so you know whether the key was used; (2) when a leaked key shows attacker use, disable it and revoke sessions immediately — rotation alone leaves the old value valid until replaced; (3) prevent repeats with secret scanning and a secrets manager, because telling people to "be careful" is not a control.</p>`},

{ id:'m10', type:'term', pts:2, theme:'det', title:'Terminal: chase the failed logins',
  tags:['auth log','grep','password spraying'],
  scenario:`<p>You are on the forensics jump box for web-01. The auth log is at <code>/var/log/auth.log</code>. Team lead asks for the failed-login evidence in the raw log, and the account that <em>succeeded</em>.</p>`,
  question:`<p>Use <code>grep</code> on <code>/var/log/auth.log</code> to complete both tasks. Expected output shape: <code>Mar 14 02:41:33 web-01 sudo: pam_unix(sudo:auth): authentication failure</code></p>`,
  ui:{label:'TERMINAL — TYPE THE COMMAND AND PRESS ENTER',
    prompt:'analyst@ir:/var/log',
    banner:['IR workbench — web-01 (10[.]0[.]3[.]24)','Type help for available commands.'],
    tasks:[
      {d:'Show every line containing "Failed password" from /var/log/auth.log',rx:/grep\b[^|;&]*Failed\s+password/i,eg:"grep 'Failed password' /var/log/auth.log"},
      {d:'Show every line containing "Accepted password" from the same log',rx:/grep\b[^|;&]*Accepted/i,eg:"grep 'Accepted password' /var/log/auth.log"}
    ],
    fs:{
      '/var/log/auth.log':'Mar 14 02:40:02 web-01 sshd[1181]: Failed password for admin from 203[.]0[.]113[.]77 port 44812 ssh2\nMar 14 02:40:09 web-01 sshd[1183]: Failed password for root from 203[.]0[.]113[.]77 port 44826 ssh2\nMar 14 02:40:15 web-01 sshd[1185]: Failed password for deploy from 203[.]0[.]113[.]77 port 44831 ssh2\nMar 14 02:40:22 web-01 sshd[1188]: Failed password for admin from 203[.]0[.]113[.]77 port 44844 ssh2\nMar 14 02:41:33 web-01 sudo: pam_unix(sudo:auth): authentication failure; user=deploy\nMar 14 02:42:10 web-01 sshd[1201]: Accepted password for deploy from 203[.]0[.]113[.]77 port 44901 ssh2\nMar 14 02:42:12 web-01 sshd[1201]: pam_unix(sshd:session): session opened for user deploy\nMar 14 02:44:51 web-01 sshd[1260]: Failed password for oracle from 198[.]51[.]100[.]9 port 51002 ssh2\nMar 14 06:25:01 web-01 CRON[2210]: pam_unix(cron:session): session opened for user root',
      '/etc/passwd':'root:x:0:0:root:/root:/bin/bash\ndeploy:x:1002:1002::/home/deploy:/bin/bash',
      '/home/deploy/.bash_history':'cd /srv/app\nsudo systemctl restart nginx\ntail -f /var/log/nginx/error.log'
    }},
  hint:"Quotes keep the two words together: grep 'Failed password' /var/log/auth.log. Add -n if you want line numbers.",
  explain:`<p><code>grep 'Failed password' /var/log/auth.log</code> extracts the brute-force attempts — many failures for admin, root and deploy from 203[.]0[.]113[.]77 is password spraying. <code>grep 'Accepted password'</code> shows the one success, for <code>deploy</code>, from the same address: that tells containment to disable or rotate the <code>deploy</code> password and to block the source. Reading both views of the log — failures and successes — is how you turn noise into a story.</p>`},

{ id:'m11', type:'logview', pts:1, theme:'leak', title:'Whose key is the attacker using?',
  tags:['CloudTrail','token replay','filtering'],
  scenario:`<p>04:05. GuardDuty flags <em>UnauthorizedAccess:IAMUser/SecretsUsage</em>. You export CloudTrail lines for the last 40 minutes. Most calls belong to the night backup job from the backup subnet.</p>`,
  question:`<p>Filter out the noise, then name the identity whose key was abused.</p>`,
  ui:{label:'LOG ANALYSIS — NAME THE ABUSED IDENTITY',
    lines:[
      '{"ts":"03:30:01","event":"GetObject","user":"svc-backup","src":"10[.]0[.]9[.]10","bucket":"nightly-backups"}',
      '{"ts":"03:31:44","event":"PutObject","user":"svc-backup","src":"10[.]0[.]9[.]10","bucket":"nightly-backups","key":"db-nightly.tar"}',
      '{"ts":"03:44:12","event":"ListBuckets","user":"deploy-bot","src":"198[.]51[.]100[.]77","agent":"python-requests/2.31"}',
      '{"ts":"03:45:03","event":"GetBucketLocation","user":"deploy-bot","src":"198[.]51[.]100[.]77","agent":"python-requests/2.31"}',
      '{"ts":"03:46:29","event":"GetObject","user":"deploy-bot","src":"198[.]51[.]100[.]77","bucket":"fin-reports","key":"q1-payroll.csv"}',
      '{"ts":"03:47:15","event":"GetObject","user":"deploy-bot","src":"198[.]51[.]100[.]77","bucket":"fin-reports","key":"q1-payroll.csv","note":"range retry"}',
      '{"ts":"03:52:40","event":"DescribeInstances","user":"svc-backup","src":"10[.]0[.]9[.]10"}',
      '{"ts":"03:58:02","event":"ConsoleLogin","user":"bob","mfa":"yes","src":"198[.]51[.]100[.]8"}'
    ],
    inner:{type:'fill',text:'The backup-job calls all come from the internal subnet 10[.]0[.]9[.]10 and are routine. The abuse is the python-requests traffic: the access key of {0} was replayed from external IP 198[.]51[.]100[.]77 to list buckets and download q1-payroll.csv. That key must be disabled and rotated, and the download reported as data exposure.',
      bank:['deploy-bot','svc-backup','bob','root','alice'],
      correct:['deploy-bot']}},
  hint:'Two identities touch storage tonight. Which one comes from inside, and which one speaks python-requests from outside?',
  explain:`<p><code>svc-backup</code> traffic comes from the trusted backup subnet, at backup-job times, so it is normal. The <code>deploy-bot</code> key is being used by <code>python-requests/2.31</code> from an external IP to browse buckets and pull a payroll file — that is leaked-credential abuse, not the deploy tooling, which never calls GetObject on finance data. Bob logged in with MFA and is unrelated. Containment targets the <code>deploy-bot</code> key only.</p>`},

{ id:'m12', type:'match', pts:6, theme:'det', title:'Match the tool to its job',
  tags:['CloudTrail','GuardDuty','Access Analyzer','secrets manager','EDR','SIEM'],
  scenario:`<p>A new hire keeps the detection toolbox on one page. Match each tool to the job it actually does.</p>`,
  question:`<p>Pair each tool with its purpose.</p>`,
  ui:{label:'MATCHING — PAIR LEFT WITH RIGHT',
    pairs:[
      {l:'CloudTrail',r:'Records every API call: who did what, when, from where'},
      {l:'GuardDuty',r:'Managed threat detection that raises findings on odd behaviour'},
      {l:'IAM Access Analyzer',r:'Finds resources and roles shared with outside principals'},
      {l:'Secrets manager',r:'Stores and auto-rotates credentials instead of hardcoding them'},
      {l:'EDR agent',r:'Watches processes and files on the host, can block and isolate'},
      {l:'SIEM',r:'Collects logs from many sources and correlates them into alerts'}
    ]},
  hint:'Cloud: who did what. Host: what ran. Vault: where secrets sleep. Correlator: where alerts are born.',
  explain:`<p>CloudTrail is the audit trail of API activity. GuardDuty turns that telemetry into managed findings like anomalous key use. Access Analyzer answers "what of ours is visible to outsiders?" — a leak detector. The secrets manager removes the root cause of leaked credentials by storing and rotating them. EDR lives on the host and sees processes and files. The SIEM is the correlation layer where timelines across sources become alerts.</p>`},

{ id:'m13', type:'qcm', pts:2, theme:'leak', title:'MFA push storm at 02:00',
  tags:['MFA fatigue','token replay','identity attack'],
  scenario:`<p>02:00–02:07. <code>m.reyes</code> receives 14 MFA push prompts on her phone, then finally taps <strong>Approve</strong> once to stop the noise. Two minutes later there is a sign-in from a new device in another country. She is asleep at home and her laptop is off.</p>`,
  question:`<p>What is the correct reading and response?</p>`,
  ui:{label:'CHOOSE ONE',options:[
    {t:'User approved, so treat the sign-in as legitimate and log it only'},
    {t:'Treat the account as compromised: revoke sessions, reset MFA, reset password',correct:true},
    {t:'Ask the user to change her password next morning and carry on'},
    {t:'Disable MFA for her account so she is not disturbed again'}
  ]},
  hint:'Many pushes until one approve has a name: MFA fatigue. The approval was not really hers — it was worn down.',
  explain:`<p>The push storm is an MFA-fatigue attack: the attacker already has the password and spams approvals until one lands. The later new-device sign-in confirms the account is taken over. The answer is full containment — revoke sessions, reset the password and re-enrol MFA. Removing MFA would make the next theft easier, and waiting until morning gives the attacker a whole night with the session.</p>`},

{ id:'m14', type:'rank', pts:5, theme:'proc', title:'Rank the morning queue',
  tags:['severity','prioritisation','triage'],
  scenario:`<p>08:00 handover leaves five open findings. Rank them so the team works in the right order — most business risk first.</p>`,
  question:`<p>Drag the findings into priority order (highest risk on top).</p>`,
  ui:{label:'DRAG TO RANK — HIGHEST RISK ON TOP',axis:'Rank 1 = work on this first',
    items:[
      {id:'r1',l:'GuardDuty low-severity PortProbe on the NAT gateway'},
      {id:'r2',l:'Root account access key used from a new country 20 minutes ago'},
      {id:'r3',l:'Backup job to fin-archive failed twice overnight (ops ticket)'},
      {id:'r4',l:'Read-only dev API key pasted in a public repo, no use seen yet'},
      {id:'r5',l:'Disabled-but-unrotated key of a leaver still active in config'}
    ],
    correct:['r2','r4','r5','r1','r3']},
  hint:'Root power in attacker hands beats everything. Then live exposure, then latent risk, then noise, then ops.',
  explain:`<p>The root key in use from a new country is maximum power with active attacker use — top. The pasted dev key is live exposure in public; even read-only, it is in the wild now. The leaver's unrotated key is a real but latent risk — no active use. The NAT port probe is low-severity background noise. The failed backup matters, but it is an operations issue, not an active security risk this hour.</p>`},

{ id:'m15', type:'spot', pts:2, theme:'leak', title:'Web log: what did the scanner get?',
  tags:['exposed files','.env leak','WAF'],
  scenario:`<p>Blue-team view. The public web server <code>shop.example</code> returned these access-log lines last night. The WAF had no rule for dotfiles.</p>`,
  question:`<p>Click the <strong>two</strong> lines that prove a credential-exposure attempt succeeded.</p>`,
  ui:{label:'CLICK THE TWO PROOF LINES',
    lines:[
      '203[.]0[.]113[.]201 - - [14/Mar/2026:02:03:11] "GET /products?page=2 HTTP/1.1" 200 8121',
      '203[.]0[.]113[.]201 - - [14/Mar/2026:02:03:40] "GET /.git/config HTTP/1.1" 200 214',
      '203[.]0[.]113[.]201 - - [14/Mar/2026:02:04:02] "GET /.env HTTP/1.1" 200 1024',
      '203[.]0[.]113[.]201 - - [14/Mar/2026:02:04:30] "GET /wp-admin HTTP/1.1" 404 512',
      '203[.]0[.]113[.]201 - - [14/Mar/2026:02:05:01] "GET /backup.zip HTTP/1.1" 404 512'
    ],
    correct:[1,2]},
  hint:'Status 200 means the file was actually served. Which two sensitive files came back with 200?',
  explain:`<p>Lines 2 and 3 show <code>/.git/config</code> and <code>/.env</code> returned with status 200 — the server really handed them over. A <code>.env</code> file typically holds database and API credentials, so the incident here is leaked credentials via a misconfigured web root, and every secret inside must be rotated. The 404 lines are the same scanner failing; they are probes, not exposures. Containment: block dotfile requests, remove the files from the web root, rotate what was inside.</p>`},

{ id:'m16', type:'fill', pts:5, theme:'proc', title:'Complete the incident report',
  tags:['incident report','RCA','MTTR','least privilege'],
  scenario:`<p>INC-4471 is closed. Your report goes to the CISO. Pick the words that make it precise — they come from the word bank.</p>`,
  question:`<p>Fill the five blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'The incident began when a developer pasted a(n) {0} into a public GitHub issue. The identity behind it was over-permissioned, breaching {1} privilege, and the attacker read the fin-reports bucket within 12 minutes. Containment took 22 minutes from first alert; we record this as our {2} for the incident. The root-cause review found no {3} on the repository, so nothing alerted the moment the secret was pushed. As corrective action we moved the credential into the {4} and enabled push-protection.',
    bank:['access key','least','MTTR','secret scanning','secrets manager','firewall','antivirus'],
    correct:['access key','least','MTTR','secret scanning','secrets manager']},
  hint:'MTTR = mean time to respond, measured alert to containment. The tool that shouts "a secret was pushed" is a scanner for secrets.',
  explain:`<p>The leaked item was an <strong>access key</strong>. Because the identity could read a finance bucket, the account violated <strong>least</strong> privilege. <strong>MTTR</strong> (mean time to respond) is the standard number for alert-to-containment time — 22 minutes here. Without <strong>secret scanning</strong>, nothing flagged the pushed secret; that gap is why the leak lived in public. The durable fix is a <strong>secrets manager</strong>, so keys are never pasted anywhere at all.</p>`},
{ id:'m17', type:'spot', pts:1, theme:'leak', title:'Deploy script: one line leaks every night',
  tags:['hardcoded secrets','bash','spot the mistake'],
  scenario:`<p>Code review of the nightly deploy script <code>deploy.sh</code>. The author says "it has always worked". One line is a standing credential-leak risk in the repo.</p>`,
  question:`<p>Click the leaking line.</p>`,
  ui:{label:'CLICK THE LEAKING LINE',
    lines:[
      '#!/bin/bash',
      'set -euo pipefail',
      'DB_PASSWORD="Pr0d!Sn0w2026"',
      'apt-get update -qq',
      'systemctl restart app.service',
      'echo "deploy finished"'
    ],
    correct:[2]},
  hint:'A real password sits in plain text next to ordinary setup commands.',
  explain:`<p>Line 3 hardcodes the production database password inside a file that lives in git. Anyone with repo access — and any future leak of the repo — gets the password, and password changes require a code change. The other lines are normal update, restart and echo commands. The fix is reading the secret at runtime from a secrets manager or environment injection, never storing it in code.</p>`},

{ id:'m18', type:'bucket', pts:7, theme:'con', title:'Sort the actions into IR phases',
  tags:['containment','eradication','recovery','NIST IR phases'],
  scenario:`<p>After the deploy-bot key leak, the whiteboard holds seven actions. File each under the NIST phase where it belongs.</p>`,
  question:`<p>Drag each action into its phase.</p>`,
  ui:{label:'DRAG EACH ACTION TO ITS PHASE',
    items:[
      {id:'a1',l:'Disable the leaked access key'},
      {id:'a2',l:'Attach a quarantine security group to web-01'},
      {id:'a3',l:'Delete the attacker-created IAM user'},
      {id:'a4',l:'Remove the rogue entry from authorized_keys'},
      {id:'a5',l:'Issue new rotated credentials and re-enable the service'},
      {id:'a6',l:'Restore web-01 from a clean pre-incident backup'},
      {id:'a7',l:'Run the lessons-learned review and update the runbook'}
    ],
    buckets:[
      {id:'cont',l:'Containment'},
      {id:'erad',l:'Eradication'},
      {id:'rec',l:'Recovery'},
      {id:'post',l:'Post-incident activity'}
    ],
    correct:{a1:'cont',a2:'cont',a3:'erad',a4:'erad',a5:'rec',a6:'rec',a7:'post'}},
  hint:'Containment stops damage now. Eradication removes the attacker. Recovery restores service. Post-incident makes next time better.',
  explain:`<p><strong>Containment</strong> stops active damage: disabling the key and quarantining web-01. <strong>Eradication</strong> removes attacker assets: the backdoor IAM user and the planted SSH key. <strong>Recovery</strong> brings clean service back: new credentials and a restore from a known-good backup, followed by monitoring for re-compromise. <strong>Post-incident activity</strong> is where the lessons-learned review and the updated runbook live.</p>`},

{ id:'m19', type:'fill', pts:4, theme:'leak', title:'CI/CD secrets policy sentences',
  tags:['CI/CD','OIDC','secrets manager','policy'],
  scenario:`<p>You are writing the pipeline-secrets section of the cloud security policy. Complete the sentences with the bank terms.</p>`,
  question:`<p>Fill the four blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'Policy CI-3: Pipeline jobs must never store long-lived {0} in variables or code. Build-time secrets are read from the {1} at run time and masked in logs. Where the platform supports it, jobs authenticate with {2} federation to receive short-lived tokens that expire with the job. Any secret detected in a commit must be {3} within one hour, and the commit force-removed.',
    bank:['credentials','secrets manager','OIDC','rotated','encrypted','archived'],
    correct:['credentials','secrets manager','OIDC','rotated']},
  hint:'Vault for storage, federation for short-lived auth, rotation for the moment a leak happens anyway.',
  explain:`<p>The policy bans long-lived <strong>credentials</strong> in code or variables — that is exactly how deploy-bot leaked. Secrets are pulled from the <strong>secrets manager</strong> so the value never appears in the repo. <strong>OIDC</strong> federation gives the job a short-lived token that dies with the job, so a stolen token has minutes of value instead of months. And when a leak still happens, the secret must be <strong>rotated</strong> fast, because deleting the commit does not un-leak it.</p>`},

{ id:'m20', type:'qcm', pts:2, theme:'det', title:'Recon alert — or the pentest?',
  tags:['false positive','threat intel','escalation'],
  scenario:`<p>10:40. GuardDuty raises <em>Recon:EC2/PortProbeUnprotectedPort</em> against a public subnet host. The source IP is 198[.]51[.]100[.]44. You remember the ticket queue: TKT-2210, approved by security, says an external penetration test runs all week from a vendor. The vendor page lists 198[.]51[.]100[.]44 as one of its scanner IPs.</p>`,
  question:`<p>What is the correct handling?</p>`,
  ui:{label:'CHOOSE ONE',options:[
    {t:'Escalate as a live intrusion and isolate the host immediately'},
    {t:'Match the IP to TKT-2210, mark it an approved-activity false positive, and document it',correct:true},
    {t:'Delete the finding so it does not clutter the queue'},
    {t:'Silence all future GuardDuty recon findings on that subnet'}
  ]},
  hint:'Authorised testing is still traffic — but only the IPs in the ticket are covered, and only for the ticket window.',
  explain:`<p>The source matches the vendor scanner IP listed in approved ticket TKT-2210, so this is a documented false positive: annotate, link the ticket, and keep the finding for the record. Deleting evidence breaks the audit trail. Silencing all future recon findings on the subnet would blind you to a real attacker arriving next week after the pentest ends. Escalating and isolating would break the authorised test and waste the on-call engineer.</p>`},

{ id:'m21', type:'multi', pts:3, theme:'leak', title:'SSH log: what is happening here?',
  tags:['password spraying','auth log','containment'],
  scenario:`<p>You paste one minute of <code>auth.log</code> from bastion-01 into the ticket. Three colleagues gave three different readings — pick the conclusions the log actually supports.</p>`,
  question:`<p>Select <strong>all</strong> statements that are true.</p>`,
  ui:{label:'SELECT ALL THAT APPLY',options:[
    {t:'Many failed passwords for many users from one IP is password spraying, not one user mistyping',correct:true},
    {t:'The single Accepted line for svc-oracle proves the attacker got a working password',correct:true},
    {t:'Containment must include blocking the source IP and rotating the svc-oracle password',correct:true},
    {t:'The failed lines alone prove data was already stolen'},
    {t:'Failed logins for root prove the root account is enabled on this host'}
  ]},
  hint:'One IP, many usernames, then one success. Careful: failures prove attempts, not theft.',
  explain:`<p>One source IP failing many different usernames in a minute is textbook <strong>password spraying</strong> — distinct from a human who mistypes twice. The <code>Accepted password for svc-oracle</code> from the same IP shows the spray found a working password, so containment means blocking the source and rotating that password (and checking what svc-oracle touched). But failures prove attempts only — nothing here shows data was stolen, and a root failure line does not confirm root login is enabled at all.</p>`},

{ id:'m22', type:'match', pts:6, theme:'det', title:'Which log answers which question?',
  tags:['CloudTrail','VPC Flow Logs','DNS logs','WAF','auth logs','CloudWatch'],
  scenario:`<p>Your SIEM ingests six sources. For each investigation question, pick the source that answers it directly.</p>`,
  question:`<p>Pair each question with its best source.</p>`,
  ui:{label:'MATCHING — PAIR LEFT WITH RIGHT',
    pairs:[
      {l:'Who called this API and from which IP?',r:'CloudTrail'},
      {l:'Did this VM talk to that external address?',r:'VPC Flow Logs'},
      {l:'Did anyone resolve the attacker domain?',r:'DNS logs'},
      {l:'Was this SQL-injection request blocked?',r:'WAF logs'},
      {l:'Who typed a password on this Linux host?',r:'OS auth logs'},
      {l:'Did CPU cross the alert threshold at 03:00?',r:'CloudWatch metrics'}
    ]},
  hint:'API = audit trail. Network = flows. Names = DNS. Web attacks = WAF. Logins = host auth. Numbers = metrics.',
  explain:`<p>CloudTrail answers "who called the API" with identity, time and source. VPC Flow Logs record network conversations, so they show VM-to-external traffic. DNS logs show name lookups — the fastest way to spot contact with a malicious domain. WAF logs record web attacks and whether a rule blocked them. OS auth logs hold login and sudo events on the host. CloudWatch metrics hold the numbers, like the 03:00 CPU spike.</p>`},

{ id:'m23', type:'fill', pts:4, theme:'esc', title:'The escalation chain, in verbs',
  tags:['privilege escalation','IAM','kill chain'],
  scenario:`<p>Your write-up of the svc-backup2 attack needs the four escalation verbs in the right slots.</p>`,
  question:`<p>Fill the four blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'With the leaked key the attacker first {0} the account: ListUsers and GetBucketLocation mapped the terrain. Next they {1} a spare user, svc-backup2, and an access key for it. Then they {2} the AdministratorAccess policy onto that user, turning a normal identity into an admin. Finally they used the new admin rights to {3} a privileged role across the account, keeping access even if the leaked key was disabled.',
    bank:['enumerated','created','attached','assumed','deleted','encrypted'],
    correct:['enumerated','created','attached','assumed']},
  hint:'Look, make, empower, wear: discovery, creation, policy attachment, role takeover.',
  explain:`<p>The chain runs: <strong>enumerate</strong> (ListUsers, GetBucketLocation — discovery), <strong>create</strong> (a spare user plus key — persistence), <strong>attach</strong> (AdministratorAccess — the actual privilege escalation), and <strong>assume</strong> (take on a privileged role with the new power). Each verb is a detection opportunity: CloudTrail alarms exist for all four. Deleting and encrypting do not appear in this chain at all.</p>`},
{ id:'m24', type:'order', pts:6, theme:'det', title:'Order the attacker — then name the detection',
  tags:['kill chain','IoA','detection mapping'],
  scenario:`<p>For the awareness session you replay the deploy-bot attack as six attacker steps. Order them as they actually happened.</p>`,
  question:`<p>Drag the steps into attack order (earliest on top).</p>`,
  ui:{label:'DRAG TO REORDER — EARLIEST STEP ON TOP',axis:'Earliest attacker action on top',
    items:[
      {id:'k1',l:'Read bucket objects and stage the payroll export'},
      {id:'k2',l:'Find the access key in a public GitHub issue'},
      {id:'k3',l:'Create a spare IAM user with admin policy'},
      {id:'k4',l:'Validate the key: ListBuckets succeeds'},
      {id:'k5',l:'Copy the export out through a personal cloud drive'},
      {id:'k6',l:'Register a new MFA device on the account'}
    ],
    correct:['k2','k4','k6','k3','k1','k5']},
  hint:'Harvest, test, lock in, escalate, collect, take the data out.',
  explain:`<p>The chain: harvest the key from the public issue, validate it with a small API call, then register your own MFA device and create the spare admin user to stay inside, collect the payroll data, and finally exfiltrate it. Each step has a control: secret scanning catches step one, GuardDuty anomaly detection catches step two, new-MFA and CreateUser alarms catch steps three and four, and DLP or egress monitoring catches the last step.</p>`},

{ id:'m25', type:'branch', pts:3, theme:'con', title:'Branching: the key was disabled — activity continues',
  tags:['session revocation','containment','persistence'],
  scenario:`<p>You disabled the leaked <code>stg-pipeline</code> key 20 minutes ago and closed the ticket. GuardDuty now fires again: ListBuckets authenticated as <code>stg-pipeline</code>, but the access key shows as inactive.</p>`,
  question:`<p>Work the branch.</p>`,
  ui:{label:'BRANCHING SCENARIO — CHOOSE ONE OPTION PER STEP',
    nodes:[
      {q:'The disabled key cannot authenticate. What explains the calls?',opts:[
        {t:'Sessions or temporary tokens issued before disabling are still valid',ok:true,fb:'CloudTrail shows the caller is using a session token created at 02:12 — before your containment at 02:40.'},
        {t:'Disabling a key does not stop anything, it is cosmetic',ok:false,fb:'Disabling does stop new authentication — but it cannot reach tokens that already exist.'},
        {t:'GuardDuty is double-alerting on the old events',ok:false,fb:'The events carry fresh timestamps. Old events would keep their original times.'}]},
      {q:'What is the correct next containment step?',opts:[
        {t:'Revoke all active sessions and tokens for stg-pipeline',ok:true,fb:'You revoke the sessions; the calls stop within the token-refresh window.'},
        {t:'Delete the whole stg-pipeline role',ok:false,fb:'Deleting production roles breaks the pipeline and skips the smaller, precise step.'},
        {t:'Wait — tokens expire by themselves within a day',ok:false,fb:'Waiting leaves the attacker inside for hours. Active revocation exists for exactly this case.'}]},
      {q:'After revocation, GuardDuty fires a third time: a NEW access key for stg-pipeline exists. What does this mean?',opts:[
        {t:'The attacker created a second key earlier — hunt CloudTrail for other persistence',ok:true,fb:'You find CreateAccessKey at 02:15 for a second key and disable it too. Lesson: search for all attacker-created credentials, not just the leaked one.'},
        {t:'Someone on the team recreated it — ask around tomorrow',ok:false,fb:'Timestamps say 02:15, during the incident window. Assume attacker action until proven otherwise.'},
        {t:'Ignore it — one key at a time is enough',ok:false,fb:'Missed persistence is the classic re-compromise path. You would be back on this ticket tonight.'}]}
    ]},
  hint:'Three layers: old tokens, active revocation, and attacker-made extras. Disable handles only the first.',
  explain:`<p>Disabling a key blocks <em>new</em> logins but does not touch sessions already issued — that is why revocation exists. If a third alert shows yet another key, that is attacker-made persistence: hunt CloudTrail for every credential the attacker created and remove them all. Skipping persistence hunting is the most common reason "contained" incidents come back.</p>`},

{ id:'m26', type:'spot', pts:1, theme:'leak', title:'Terraform: the default that leaks',
  tags:['IaC','hardcoded secret','Terraform'],
  scenario:`<p>Plan review for the database module. The reviewer says one line puts a production secret into the state file and the repo at once.</p>`,
  question:`<p>Click the leaking line.</p>`,
  ui:{label:'CLICK THE LEAKING LINE',
    lines:[
      'variable "db_name" {',
      '  type    = string',
      '  default = "billing"',
      '}',
      'variable "db_password" {',
      '  type    = string',
      '  default = "S3cr3t-Bill!2026"',
      '}'
    ],
    correct:[6]},
  hint:'One default value is a credential. Which one?',
  explain:`<p>Line 7 ships the real database password as a default value: it lands in the repo, in plan output, and in the state file. Line 3 is only a database name — harmless. The correct pattern declares the variable with <code>sensitive = true</code>, sets no default, and injects the value at apply time from a secrets manager or environment variable.</p>`},

{ id:'m27', type:'bucket', pts:6, theme:'proc', title:'Prevent, detect, or respond?',
  tags:['controls','defense in depth','control mapping'],
  scenario:`<p>The CISO wants the incident program mapped to control classes. Sort the six controls.</p>`,
  question:`<p>Drag each control to its class.</p>`,
  ui:{label:'DRAG EACH CONTROL TO ITS CLASS',
    items:[
      {id:'x1',l:'Secret scanning with push protection in the repo'},
      {id:'x2',l:'GuardDuty anomaly alerts on IAM activity'},
      {id:'x3',l:'Key-rotation runbook with tested steps'},
      {id:'x4',l:'MFA enforced on every human account'},
      {id:'x5',l:'SIEM correlation rule: new key + foreign IP'},
      {id:'x6',l:'Break-glass account reviewed after every use'}
    ],
    buckets:[
      {id:'prev',l:'Prevent'},
      {id:'det',l:'Detect'},
      {id:'resp',l:'Respond'}
    ],
    correct:{x1:'prev',x2:'det',x3:'resp',x4:'prev',x5:'det',x6:'resp'}},
  hint:'Prevent = the leak never happens. Detect = an alert fires. Respond = we already know what to do.',
  explain:`<p><strong>Prevent</strong> controls stop the incident class before it starts: push protection blocks secret commits, MFA blocks stolen-password logins. <strong>Detect</strong> controls raise the alarm: GuardDuty anomalies and the SIEM rule pairing new-key creation with a foreign IP. <strong>Respond</strong> controls shape the reaction: the tested rotation runbook and the break-glass review after use. Strong programs hold all three classes — prevention alone always leaks eventually.</p>`},

{ id:'m28', type:'fill', pts:5, theme:'proc', title:'Lessons-learned doc, last mile',
  tags:['RCA','lessons learned','blameless','MTTD'],
  scenario:`<p>The post-incident review is tomorrow. Complete the summary section with the programme terms.</p>`,
  question:`<p>Fill the five blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'Review format: we run this as a(n) {0} session — we examine the system, not the person. Root cause: the repo had no {1}, so the pushed key sat in public for 11 days; our {2} of 11 days shows detection, not response, is the gap. Corrective actions: pre-commit hooks, alerts for new access keys, and a quarterly {3} exercise so the team rehearses key-leak containment. Every action gets an owner and a(n) {4} date.',
    bank:['blameless','secret scanning','MTTD','tabletop','due','bonus'],
    correct:['blameless','secret scanning','MTTD','tabletop','due']},
  hint:'MTTD = mean time to detect. The rehearsal meeting where you talk through an incident is a tabletop.',
  explain:`<p>A <strong>blameless</strong> review keeps people talking — fear hides the facts that fix the system. The missing <strong>secret scanning</strong> is the technical root cause: the key sat in public undetected. <strong>MTTD</strong> (mean time to detect) of 11 days says detection is the weak stage, since containment itself took minutes. A quarterly <strong>tabletop</strong> rehearses the response, and every action needs an owner and a <strong>due</strong> date or it quietly never happens.</p>`},

{ id:'m29', type:'match', pts:5, theme:'proc', title:'Who does what in the response?',
  tags:['roles','incident command','escalation'],
  scenario:`<p>Two minutes into INC-4471 the war room is loud. Assign each role its core duty so handovers stay clean.</p>`,
  question:`<p>Pair each role with its duty.</p>`,
  ui:{label:'MATCHING — PAIR LEFT WITH RIGHT',
    pairs:[
      {l:'Incident commander',r:'Coordinates the response and owns the decisions'},
      {l:'Forensic analyst',r:'Preserves evidence and maintains chain of custody'},
      {l:'Communications lead',r:'Keeps stakeholders and customers informed'},
      {l:'Cloud engineer',r:'Executes containment changes in the account'},
      {l:'Scribe',r:'Maintains the timeline and decision log in real time'}
    ]},
  hint:'One person steers, one collects proof, one talks, one clicks, one writes.',
  explain:`<p>The <strong>incident commander</strong> owns decisions so responders never wait on a group vote. The <strong>forensic analyst</strong> preserves evidence with chain of custody — snapshots before changes, hashes recorded. The <strong>communications lead</strong> owns stakeholder and customer messaging so engineers are not writing press notes. The <strong>cloud engineer</strong> executes the containment actions. The <strong>scribe</strong> keeps the timeline that later makes the report — and the legal case — accurate.</p>`},

{ id:'m30', type:'rank', pts:5, theme:'proc', title:'Risk-rank the audit findings',
  tags:['risk ranking','exposure','prioritisation'],
  scenario:`<p>Quarterly audit returns five findings for the same account. Rank by risk — exploitability and impact together.</p>`,
  question:`<p>Drag the findings into risk order (highest on top).</p>`,
  ui:{label:'DRAG TO RANK — HIGHEST RISK ON TOP',axis:'Rank 1 = highest risk',
    items:[
      {id:'z1',l:'GuardDuty low-severity recon probe hits a NAT gateway'},
      {id:'z2',l:'Public RDS snapshot named billing-snap-2026 with database credentials inside'},
      {id:'z3',l:'Overdue patch on an isolated test VM in a closed subnet'},
      {id:'z4',l:'Leaked root access key confirmed used from a foreign IP'},
      {id:'z5',l:'Disabled-but-unrotated CI key in an old config file'}
    ],
    correct:['z4','z2','z5','z3','z1']},
  hint:'Active root misuse, then a public snapshot holding credentials, then latent issues, then noise.',
  explain:`<p>The leaked, actively used root key is first — maximum power, live attacker. The public snapshot with credentials inside is next: strangers can download it right now, which is effectively another leak. The unrotated CI key is latent risk — real, but not in use. The unpatched test VM is low: isolated and closed to the internet. The NAT probe is background noise. Risk ranking always pairs <em>who can reach it now</em> with <em>how bad if they do</em>.</p>`}
];
/* ================= shared exam engine ================= */
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad2(n){return (n<10?'0':'')+n;}
function fmtT(t){return pad2(Math.floor(t/60))+':'+pad2(t%60);}
function r1(x){return Math.round(x*10)/10;}
function div(cls){var d=document.createElement('div');d.className=cls;return d;}
function fcls(f){return f==='ok'?'is-ok':(f==='bad'?'is-bad':'is-warn');}
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var TOTAL=CFG.minutes*60;
var S=null,TICK=null;

function initAns(q){
  switch(q.type){
    case 'qcm': return {sel:-1};
    case 'multi': return {sel:[]};
    case 'bucket': return {placed:{},selItem:null};
    case 'order': case 'rank': {
      var l,tr=0;
      do{ l=shuf(q.ui.items.map(function(it){return it.id;})); tr++; }
      while(tr<14 && q.ui.items.length>1 && l.join('|')===q.ui.correct.join('|'));
      return {list:l};
    }
    case 'match': return {pairs:{},selLeft:null};
    case 'fill': return {place:{},selWord:null};
    case 'spot': return {sel:[]};
    case 'logview': return {f:'',inner:initAns({type:q.ui.inner.type,ui:q.ui.inner})};
    case 'term': return {out:[],done:[],hist:[],cwd:'/'};
    case 'branch': return {step:0,choices:[]};
  }
  return {};
}
function views(q){
  var v={};
  if(q.type==='qcm'||q.type==='multi'){ v.opts=shuf(q.ui.options.map(function(_,i){return i;})); }
  if(q.type==='bucket'){ v.items=shuf(q.ui.items.map(function(it){return it.id;})); }
  if(q.type==='match'){ v.rights=shuf(q.ui.pairs.map(function(p){return p.r;})); v.lefts=shuf(q.ui.pairs.map(function(p){return p.l;})); }
  if(q.type==='fill'){ v.bank=shuf(q.ui.bank.slice()); }
  if(q.type==='logview'){ v.inner=views({type:q.ui.inner.type,ui:q.ui.inner}); }
  return v;
}
function newAttempt(){
  if(TICK){clearInterval(TICK);TICK=null;}
  S={order:shuf(EXAMS.map(function(_,i){return i;})),cur:0,tLeft:TOTAL,
     pauseManual:false,pauseCheck:false,finished:false,reported:false,finishWarned:false,
     ex:EXAMS.map(function(q){return {answered:false,checked:false,skipped:false,hintUsed:false,scored:null,ans:initAns(q)};}),
     disp:EXAMS.map(function(q){return views(q);})};
  S.cur=S.order[0];
}
/* ---------- timer: two independent pause reasons ---------- */
function startTimer(){
  TICK=setInterval(function(){
    if(!S||S.finished){return;}
    if(S.pauseManual||S.pauseCheck){timerUI();return;}
    if(S.tLeft<=0){S.tLeft=0;timerUI();if(!S.finishWarned){S.finishWarned=true;finishExam(true);}return;}
    S.tLeft--;
    if(S.tLeft<=0){S.tLeft=0;timerUI();finishExam(true);return;}
    timerUI();
  },1000);
}
function timerUI(){
  var t=$('#timer'); if(!t||!S){return;}
  t.textContent=fmtT(S.tLeft);
  t.classList.toggle('low',S.tLeft>0&&S.tLeft<=300);
  t.classList.toggle('frozen',S.pauseManual||S.pauseCheck||S.finished);
  var pf=$('#pause-flag'); if(!pf){return;}
  var msgs=[];
  if(S.pauseManual){msgs.push('Paused (manual)');}
  if(S.pauseCheck){msgs.push('Timer paused — review mode');}
  if(S.finished){msgs.push('Exam finished');}
  pf.hidden=(msgs.length===0);
  pf.textContent=msgs.join(' + ');
}
function togglePause(){
  if(!S||S.finished){return;}
  S.pauseManual=!S.pauseManual;
  var b=$('#btn-pause');
  b.textContent=S.pauseManual?'Resume':'Pause';
  b.setAttribute('aria-pressed',S.pauseManual?'true':'false');
  $('#pause-overlay').hidden=!S.pauseManual;
  var grid=$('#exam-grid');
  if(grid){
    if(S.pauseManual){grid.setAttribute('inert','');grid.setAttribute('aria-hidden','true');var rb=$('#btn-resume2');if(rb){rb.focus();}}
    else{grid.removeAttribute('inert');grid.removeAttribute('aria-hidden');}
  }
  timerUI();
}
/* ---------- navigation ---------- */
function navStatus(i){
  var st=S.ex[i];
  if(st.skipped){return 'skip';}
  if(st.scored){
    var f=st.scored.earned/st.scored.max;
    if(f>=0.999){return 'full';}
    if(f>0){return 'part';}
    return 'zero';
  }
  if(st.answered){return 'touched';}
  return 'idle';
}
function statusWord(i){
  var m={skip:'skipped — excluded from scoring',full:'checked, full credit',part:'checked, partial credit',zero:'checked, no credit',touched:'answered, not checked yet',idle:'not answered'};
  return m[navStatus(i)];
}
function renderNav(){
  var n=$('#navigator'); if(!n||!S){return;}
  var GLYPH={full:'✓',part:'±',zero:'✗',skip:'»',touched:'•'};
  n.innerHTML='';
  EXAMS.forEach(function(q,i){
    var b=document.createElement('button');
    b.type='button';
    var stt=navStatus(i);
    b.className='nav-btn '+stt+(i===S.cur?' cur':'');
    var g=GLYPH[stt];
    b.innerHTML=esc(String(i+1))+(g?'<span class="nav-glyph" aria-hidden="true">'+g+'</span>':'');
    b.setAttribute('aria-label','Exercise '+(i+1)+': '+q.title.replace(/<[^>]*>/g,'')+' — '+statusWord(i));
    b.addEventListener('click',function(){gotoEx(i);});
    n.appendChild(b);
  });
}
function gotoEx(i){ if(!S||S.finished){return;} S.cur=i; renderExercise(); }
function move(d){
  if(!S||S.finished){return;}
  if(d>0){S.pauseCheck=false;} /* only Next ends the Check-pause */
  var k=S.order.indexOf(S.cur),nk=k+d;
  if(nk<0){renderExercise();return;}
  if(nk>=S.order.length){
    if(window.confirm('This is the last exercise. Finish and grade the exam now?')){finishExam(false);}
    return;
  }
  S.cur=S.order[nk];
  renderExercise();
}
function progressUI(){
  if(!S){return;}
  var done=0;
  S.ex.forEach(function(st){ if(st.checked||st.skipped){done++;} });
  $('#progress-in').style.width=Math.round(done/EXAMS.length*100)+'%';
  var e=0,m=0;
  S.ex.forEach(function(st){ if(st.scored){e+=st.scored.earned;m+=st.scored.max;} });
  $('#score-chip').textContent='Score '+r1(e)+' / '+r1(m);
}
/* ---------- Check / Skip / Hint / Revise ---------- */
function onCheck(){
  if(!S||S.finished){return;}
  var i=S.cur,q=EXAMS[i],st=S.ex[i];
  if(q.type==='branch'&&st.ans.step<q.ui.nodes.length){return;}
  if(st.skipped){st.skipped=false;}
  st.answered=true;
  var res=V[q.type](q,st);
  var earned=res.frac*q.pts;
  if(st.hintUsed){earned*=0.9;}
  st.scored={frac:res.frac,earned:earned,max:q.pts,flags:res.flags,correct:res.correct,summary:summarize(q,st.ans)};
  st.checked=true;
  /* clear transient selection state so locked review shows only the answer marks */
  if(st.ans){st.ans.selItem=null;st.ans.selLeft=null;st.ans.selWord=null;}
  S.pauseCheck=true; /* Check-pause: timer frozen, content visible, only Next resumes */
  renderExercise(); progressUI(); renderNav(); timerUI();
}
function onSkip(){
  if(!S||S.finished){return;}
  S.ex[S.cur].skipped=true;
  S.ex[S.cur].answered=true;
  var k=S.order.indexOf(S.cur),nk=k+1;
  if(nk>=S.order.length){
    renderNav(); progressUI();
    if(window.confirm('This is the last exercise. Finish and grade the exam now?')){finishExam(false);}
    return;
  }
  S.cur=S.order[nk];
  renderExercise();
}
function onHint(q,st){
  if(st.hintUsed){return;}
  st.hintUsed=true;
  var h=$('#hintbox');
  h.hidden=false;
  h.innerHTML='<strong>Hint (costs 10% of this exercise):</strong> '+q.hint;
  var b=$('#btn-hint'); b.disabled=true; b.textContent='Hint used';
}
function onRevise(){
  var i=S.cur,q=EXAMS[i],st=S.ex[i];
  st.checked=false;
  if(q.type==='branch'||q.type==='term'){st.ans=initAns(q);}
  st.scored=null;
  renderExercise(); renderNav(); progressUI();
}
/* ---------- exercise rendering ---------- */
function block(label,cls,html){
  var d=div('blk '+cls);
  d.innerHTML='<div class="blk-label">'+label+'</div><div class="blk-body">'+html+'</div>';
  return d;
}
function renderExercise(){
  var i=S.cur,q=EXAMS[i],st=S.ex[i],box=$('#exercise');
  box.innerHTML='';
  var flags=(st.checked&&st.scored)?st.scored.flags:null;
  var head=div('ex-head');
  head.innerHTML='<div class="ex-no">Exercise '+(i+1)+' of '+EXAMS.length+' — '+esc(statusWord(i))+'</div>'+
    '<div class="ex-meta"><span class="theme-chip t-'+q.theme+'">'+THEMES[q.theme]+'</span>'+
    '<span class="type-chip">'+TYPELBL[q.type]+'</span><span class="pts-chip">'+q.pts+' pts</span></div>'+
    '<h2 class="ex-title">'+q.title+'</h2>'+
    '<div class="ex-tags">'+q.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div>';
  box.appendChild(head);
  if(st.skipped){
    var sk=div('notice warn');
    sk.innerHTML='<strong>Skipped — excluded from scoring.</strong> Answer, then press Check to include this exercise in your score.';
    box.appendChild(sk);
  }
  if(q.scenario){box.appendChild(block('SCENARIO','blk-scenario',q.scenario));}
  if(q.artifact){box.appendChild(block('ARTIFACTS','blk-artifact',q.artifact));}
  box.appendChild(block('QUESTION','blk-question',q.question));
  var ans=div('ans-area'+(st.checked?' locked':''));
  ans.innerHTML='<div class="ans-label">'+(q.ui.label||TYPELBL[q.type])+'</div>';
  var ab=div('ans-body'); ans.appendChild(ab);
  R[q.type](ab,q,st,flags,S.disp[i]);
  var hint=div('notice hint'); hint.id='hintbox'; hint.hidden=!st.hintUsed;
  if(st.hintUsed){hint.innerHTML='<strong>Hint (costs 10% of this exercise):</strong> '+q.hint;}
  ans.appendChild(hint);
  box.appendChild(ans);
  var fb=div('fb-area'); fb.hidden=!st.checked; fb.setAttribute('aria-live','polite');
  if(st.checked&&st.scored){fb.innerHTML=feedbackHTML(q,st);}
  box.appendChild(fb);
  var ctr=div('ctrl-row');
  ctr.innerHTML='<button type="button" id="btn-check" class="btn primary">Check</button>'+
    '<button type="button" id="btn-skip" class="btn ghost">Skip</button>'+
    '<button type="button" id="btn-hint" class="btn ghost"'+(st.hintUsed?' disabled':'')+'>Hint −10%</button>'+
    '<span class="spacer"></span>'+
    '<button type="button" id="btn-prev" class="btn ghost">Prev</button>'+
    '<button type="button" id="btn-next" class="btn primary2">Next</button>'+
    (st.checked?'<button type="button" id="btn-revise" class="btn ghost">Revise</button>':'');
  box.appendChild(ctr);
  wireControls(q,st);
  renderNav(); progressUI(); timerUI();
  box.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function wireControls(q,st){
  $('#btn-check').addEventListener('click',onCheck);
  $('#btn-skip').addEventListener('click',onSkip);
  $('#btn-hint').addEventListener('click',function(){onHint(q,st);});
  $('#btn-prev').addEventListener('click',function(){move(-1);});
  $('#btn-next').addEventListener('click',function(){move(1);});
  var rv=$('#btn-revise'); if(rv){rv.addEventListener('click',onRevise);}
  if(st.checked){
    var hb=$('#btn-hint');
    hb.disabled=true; hb.title='Hint is only available before Check';
  }
  if(q.type==='branch'&&st.ans.step<q.ui.nodes.length){
    var bc=$('#btn-check'); bc.disabled=true; bc.title='Finish the scenario first'; bc.setAttribute('aria-disabled','true');
  }
  if(q.type==='term'&&st.checked){var ti=$('#term-in'); if(ti){ti.disabled=true;}}
}
function feedbackHTML(q,st){
  var sc=st.scored;
  var lbl=sc.earned>=sc.max-0.001?'full':(sc.earned>0?'partial':'zero');
  var html='<div class="fb-sum"><span class="badge b-'+lbl+'">'+(lbl==='full'?'Full credit':(lbl==='partial'?'Partial credit':'No credit'))+'</span> '+
    '<strong>You earned '+r1(sc.earned)+' / '+r1(sc.max)+' points</strong>'+
    (st.hintUsed?' <span class="hintnote">(includes −10% hint cost)</span>':'')+'</div>';
  var fl=sc.flags||{},keys=Object.keys(fl);
  if(keys.length){
    html+='<div class="fb-marks">'+keys.map(function(k){
      var f=fl[k];
      var ic=f==='ok'?'✓':(f==='bad'?'✗':'▲');
      var w=f==='ok'?'Correct':(f==='bad'?'Wrong':'Missed');
      return '<span class="mark m-'+f+'">'+ic+' '+esc(k)+' — '+w+'</span>';
    }).join('')+'</div>';
  }
  if(sc.correct){html+='<div class="fb-correct"><div class="fb-correct-h">CORRECT ANSWER</div>'+sc.correct+'</div>';}
  html+='<div class="fb-explain"><div class="fb-explain-h">WHY</div>'+q.explain+'</div>';
  return html;
}
/* ================= renderers (R) and validators (V) ================= */
var R={},V={};

/* ----- single-choice ----- */
R.qcm=function(ab,q,st,flags,d){
  var an=st.ans;
  d.opts.forEach(function(oi,pos){
    var o=q.ui.options[oi];
    var flab=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    var b=document.createElement('button'); b.type='button';
    b.className='opt'+(an.sel===oi?' sel':'');
    b.setAttribute('role','radio'); b.setAttribute('aria-checked',an.sel===oi?'true':'false');
    b.innerHTML='<span class="opt-key">'+String.fromCharCode(65+pos)+'</span><span>'+o.t+'</span>';
    if(flags&&flags[flab]){b.classList.add(flags[flab]==='ok'?'is-ok':'is-bad');}
    b.addEventListener('click',function(){
      if(st.checked){return;}
      an.sel=oi; st.answered=true;
      $$('.opt',ab).forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false');});
      b.classList.add('sel'); b.setAttribute('aria-checked','true');
    });
    ab.appendChild(b);
  });
};
V.qcm=function(q,st){
  var corr=-1,flags={};
  q.ui.options.forEach(function(o,i){ if(o.correct){corr=i;} });
  q.ui.options.forEach(function(o,i){
    var k=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    if(o.correct){flags[k]='ok';}
    else if(i===st.ans.sel){flags[k]='bad';}
  });
  return {frac:st.ans.sel===corr?1:0,flags:flags,
    correct:'<p>'+q.ui.options[corr].t+'</p>'};
};
R.multi=function(ab,q,st,flags,d){
  var an=st.ans;
  function isSel(oi){return an.sel.indexOf(oi)>=0;}
  d.opts.forEach(function(oi,pos){
    var o=q.ui.options[oi];
    var flab=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    var b=document.createElement('button'); b.type='button';
    b.className='opt'+(isSel(oi)?' sel':'');
    b.setAttribute('role','checkbox'); b.setAttribute('aria-checked',isSel(oi)?'true':'false');
    b.innerHTML='<span class="opt-key">'+(isSel(oi)?'✓':String.fromCharCode(65+pos))+'</span><span>'+o.t+'</span>';
    if(flags&&flags[flab]){var f=flags[flab]; if(f){b.classList.add(f==='ok'?'is-ok':(f==='bad'?'is-bad':'is-warn'));}}
    b.addEventListener('click',function(){
      if(st.checked){return;}
      var ix=an.sel.indexOf(oi);
      if(ix>=0){an.sel.splice(ix,1);}else{an.sel.push(oi);}
      st.answered=true;
      b.classList.toggle('sel',an.sel.indexOf(oi)>=0);
      b.setAttribute('aria-checked',an.sel.indexOf(oi)>=0?'true':'false');
      b.querySelector('.opt-key').textContent=an.sel.indexOf(oi)>=0?'✓':String.fromCharCode(65+pos);
    });
    ab.appendChild(b);
  });
};
V.multi=function(q,st){
  var flags={},hits=0,k=0;
  q.ui.options.forEach(function(o,i){
    var sel=st.ans.sel.indexOf(i)>=0;
    var kk=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    if(o.correct){k++; if(sel){hits++;flags[kk]='ok';} else {flags[kk]='warn';}}
    else if(sel){flags[kk]='bad';}
  });
  var corr=q.ui.options.filter(function(o){return o.correct;}).map(function(o){return '<li>'+o.t+'</li>';}).join('');
  return {frac:k?hits/k:0,flags:flags,correct:'<ul>'+corr+'</ul>'};
};

/* ----- drag & drop: items into buckets ----- */
R.bucket=function(ab,q,st,flags,d){
  var ui=q.ui,an=st.ans;
  var bank=div('dd-bank'); bank.dataset.bid='__bank';
  bank.innerHTML='<div class="dd-bank-h">ITEMS — DRAG OR CLICK TO PLACE (click here to send a selected item back)</div>';
  var zones=div('dd-buckets');
  function itemEl(it){
    var b=document.createElement('button'); b.type='button'; b.className='dd-item'; b.draggable=!st.checked;
    b.dataset.iid=it.id; b.textContent=it.l;
    if(flags&&flags[it.l]){b.classList.add(fcls(flags[it.l]));}
    b.addEventListener('click',function(e){
      e.stopPropagation();
      if(st.checked){return;}
      var wasSel=b.classList.contains('sel');
      $$('.dd-item',ab).forEach(function(x){x.classList.remove('sel');});
      if(wasSel){an.selItem=null;}
      else{b.classList.add('sel');an.selItem=it.id;}
      st.answered=true;
    });
    b.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',it.id);});
    return b;
  }
  function place(iid,bid){
    if(bid==='__bank'){delete an.placed[iid];}
    else{an.placed[iid]=bid;}
    an.selItem=null; st.answered=true; draw();
  }
  function draw(){
    $$('.dd-zone',ab).forEach(function(z){z.innerHTML='';});
    $$('.dd-item',ab).forEach(function(x){x.remove();});
    d.items.forEach(function(iid){
      var it=ui.items.filter(function(x){return x.id===iid;})[0];
      var bid=an.placed[iid]||'__bank';
      var host=bid==='__bank'?bank:ab.querySelector('.dd-zone[data-bid="'+bid+'"]');
      host.appendChild(itemEl(it));
    });
    $$('.dd-zone',ab).forEach(function(z){
      if(!z.children.length){z.innerHTML='<span class="dd-hint">drop here</span>';}
    });
  }
  ui.buckets.forEach(function(bu){
    var col=div('dd-bucket');
    col.innerHTML='<div class="dd-bucket-h">'+bu.l+'</div>';
    var z=div('dd-zone'); z.dataset.bid=bu.id;
    z.addEventListener('dragover',function(e){e.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    z.addEventListener('drop',function(e){e.preventDefault();z.classList.remove('over');if(st.checked){return;}place(e.dataTransfer.getData('text/plain'),bu.id);});
    z.addEventListener('click',function(){if(st.checked){return;}if(an.selItem){place(an.selItem,bu.id);}});
    col.appendChild(z); zones.appendChild(col);
  });
  bank.addEventListener('dragover',function(e){e.preventDefault();});
  bank.addEventListener('drop',function(e){e.preventDefault();if(st.checked){return;}place(e.dataTransfer.getData('text/plain'),'__bank');});
  bank.addEventListener('click',function(){if(st.checked){return;}if(an.selItem){place(an.selItem,'__bank');}});
  ab.appendChild(bank); ab.appendChild(zones); draw();
};
V.bucket=function(q,st){
  var flags={},hits=0,n=q.ui.items.length;
  var bl={}; q.ui.buckets.forEach(function(b){bl[b.id]=b.l;});
  q.ui.items.forEach(function(it){
    var p=st.ans.placed[it.id];
    if(p&&p===q.ui.correct[it.id]){hits++;flags[it.l]='ok';}
    else if(p){flags[it.l]='bad';}
    else{flags[it.l]='warn';}
  });
  var corr=q.ui.items.map(function(it){return '<li>'+it.l+' → '+bl[q.ui.correct[it.id]]+'</li>';}).join('');
  return {frac:n?hits/n:0,flags:flags,correct:'<ul>'+corr+'</ul>'};
};

/* ----- ordering / ranking ----- */
R.order=function(ab,q,st,flags,d){
  var ui=q.ui,an=st.ans;
  if(ui.axis){ab.appendChild(function(){var x=div('axis-note');x.textContent=ui.axis;return x;}());}
  var list=div('ord-list');
  function rowEl(iid,pos){
    var it=ui.items.filter(function(x){return x.id===iid;})[0];
    var row=div('ord-row'); row.draggable=!st.checked; row.dataset.pos=pos;
    row.innerHTML='<span class="ord-handle" aria-hidden="true">≡</span><span class="ord-label">'+it.l+'</span>';
    var up=document.createElement('button'); up.type='button'; up.className='ord-up'; up.textContent='▲'; up.setAttribute('aria-label','Move up');
    var dn=document.createElement('button'); dn.type='button'; dn.className='ord-dn'; dn.textContent='▼'; dn.setAttribute('aria-label','Move down');
    up.addEventListener('click',function(){if(st.checked||pos===0){return;}var t=an.list[pos-1];an.list[pos-1]=an.list[pos];an.list[pos]=t;st.answered=true;draw();});
    dn.addEventListener('click',function(){if(st.checked||pos===an.list.length-1){return;}var t=an.list[pos+1];an.list[pos+1]=an.list[pos];an.list[pos]=t;st.answered=true;draw();});
    row.appendChild(up); row.appendChild(dn);
    if(flags&&flags[it.l]){row.classList.add(fcls(flags[it.l]));}
    row.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',String(pos));});
    row.addEventListener('dragover',function(e){e.preventDefault();row.classList.add('over');});
    row.addEventListener('dragleave',function(){row.classList.remove('over');});
    row.addEventListener('drop',function(e){
      e.preventDefault();row.classList.remove('over');
      if(st.checked){return;}
      var from=+e.dataTransfer.getData('text/plain');
      if(isNaN(from)){return;}

/* ----- terminal ----- */
function tOut(an,lines){Array.prototype.push.apply(an.out,lines);if(an.out.length>400){an.out.splice(0,an.out.length-400);}}
function tResolve(cwd,p){
  if(!p){return '/';}
  var full=p.charAt(0)==='/'?p:(cwd==='/'?'':cwd)+'/'+p;
  var st2=[];
  full.split('/').forEach(function(s){if(!s||s==='.'){return;}if(s==='..'){st2.pop();}else{st2.push(s);}});
  return '/'+st2.join('/');
}
function tList(fs,dir){
  var pre=dir==='/'?'/':dir+'/'; var seen={},out=[];
  Object.keys(fs).forEach(function(k){
    if(k.indexOf(pre)!==0){return;}
    var rest=k.slice(pre.length); if(!rest){return;}
    var seg=rest.split('/')[0];
    if(seen[seg]){return;}
    seen[seg]=1;
    out.push(rest.indexOf('/')>=0?seg+'/':seg);
  });
  return out.sort();
}
function tGlobRe(g){g=g.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.');return new RegExp('^'+g+'$');}
function termExec(q,an,raw,echo){
  var fs=q.ui.fs,out=an.out,cwd=an.cwd||'/';
  if(echo!==false){out.push({t:'$ '+raw,c:'t-prompt'});}
  var line=raw.trim(); if(!line){return;}
  an.hist.push(line);
  var redir=null,m=line.match(/\s>\s*(\S+)\s*$/);
  if(m){redir=m[1];line=line.slice(0,m.index).trim();}
  if(line==='clear'){out.length=0;return;}
  var toks=line.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g)||[];
  var cmd=toks[0],args=toks.slice(1);
  if(cmd==='sudo'){if(args.length){cmd=args[0];args=args.slice(1);}else{tOut(an,['usage: sudo &lt;command&gt;']);return;}}
  var flagsStr='';
  while(args.length&&args[0].charAt(0)==='-'&&args[0].length>1){flagsStr+=args[0];args=args.slice(1);}
  function fpath(p){return tResolve(cwd,p);}
  function isDir(p){var pre=p==='/'?'/':p+'/';var any=false;Object.keys(fs).forEach(function(k){if(k.indexOf(pre)===0){any=true;}});return any;}
  function readFile(p){
    if(fs[p]!==undefined){return {ok:true,lines:fs[p].split('\n'),name:p};}
    return {ok:false};
  }
  switch(cmd){
    case 'help':
      tOut(an,['Built-in commands: help, ls, cd, pwd, cat, grep, find, ps, ss, netstat, lsof, last, history, whoami, echo, clear',
               'This host also has the standard inspection tools you would expect on a cloud VM.']);
      break;
    case 'pwd': tOut(an,[cwd]); break;
    case 'whoami': tOut(an,[q.ui.whoami||'ec2-user']); break;
    case 'cd': an.cwd=fpath(args[0]||'/'); break;
    case 'ls': {
      var dir=fpath(args[0]||cwd);
      var l=tList(fs,dir);
      tOut(an,l.length?l:['(empty)']);
      break;
    }
    case 'cat': {
      if(!args.length){tOut(an,['usage: cat FILE']);break;}
      var rf=readFile(fpath(args[0]));
      tOut(an,rf.ok?rf.lines:['cat: '+args[0]+': No such file or directory']);
      break;
    }
    case 'echo': tOut(an,[args.join(' ')]); break;
    case 'history': tOut(an,an.hist.map(function(h,i){return pad2(i+1)+'  '+h;})); break;
    case 'ps': tOut(an,(q.ui.ps||'PID TTY TIME CMD\n1 ? 00:00:01 systemd').split('\n')); break;
    case 'ss': case 'netstat': {
      if(/l/i.test(flagsStr)||/l/i.test(line)){
        tOut(an,(q.ui.netstat||'No listening sockets.').split('\n'));
      } else { tOut(an,['usage: '+cmd+' -tulnp   (try the listening/numeric flags)']); }
      break;
    }
    case 'lsof': {
      if(/i/i.test(flagsStr)){tOut(an,(q.ui.netstat||'No open sockets.').split('\n'));}
      else{tOut(an,['usage: lsof -i']);}
      break;
    }
    case 'last': tOut(an,(q.ui.last||'no login records').split('\n')); break;
    case 'grep': {
      if(!args.length){tOut(an,['usage: grep [-i] [-r] [-n] PATTERN FILE|DIR']);break;}
      var pat=args[0].replace(/^["']|["']$/g,'');
      var targets=args.slice(1);
      var ci=/i/i.test(flagsStr),rec=/r/i.test(flagsStr),num=/n/i.test(flagsStr);
      var res=[];
      try{
        var re=new RegExp(ci?pat:pat,ci?'i':'');
        if(rec){
          targets.forEach(function(t){
            var base=fpath(t); var pre=base==='/'?'/':base+'/';
            Object.keys(fs).forEach(function(k){
              if(k.indexOf(pre)!==0){return;}
              fs[k].split('\n').forEach(function(ln,ix){
                if(re.test(ln)){res.push(k+':'+(num?(ix+1)+':':'')+ln);}
              });
            });
          });
        } else {
          targets.forEach(function(t){
            var rf2=readFile(fpath(t));
            if(rf2.ok){rf2.lines.forEach(function(ln,ix){if(re.test(ln)){res.push((num?(ix+1)+':':'')+ln);}});}
            else{res.push('grep: '+t+': No such file or directory');}
          });
        }
        tOut(an,res.length?res:['(no matches)']);
      }catch(e){tOut(an,['grep: bad pattern']);}
      break;
    }
    case 'find': {
      var di=args[0]?fpath(args[0]):cwd;
      var ni=-1; args.forEach(function(a,i){if(a==='-name'){ni=i;}});
      var pre2=di==='/'?'/':di+'/'; var found=[];
      if(ni>=0&&args[ni+1]){
        var gre=tGlobRe(args[ni+1].replace(/^["']|["']$/g,''));
        Object.keys(fs).forEach(function(k){
          if(k.indexOf(pre2)!==0){return;}
          var base=k.slice(pre2.length).split('/').pop();
          if(gre.test(base)){found.push(k);}
        });
      } else {
        Object.keys(fs).forEach(function(k){if(k.indexOf(pre2)===0&&fs[k]!==undefined){found.push(k);}});
      }
      tOut(an,found.length?found.sort():['(no results)']);
      break;
    }
    default: tOut(an,[{s:cmd}.s+': command not found']);
  }
  if(redir){out.push({t:'[output written to '+redir+']',c:'t-sys'});}
}
