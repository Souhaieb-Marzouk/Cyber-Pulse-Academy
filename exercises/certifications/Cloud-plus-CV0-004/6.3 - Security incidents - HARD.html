<style>
:root{
  --bg:#0b0f14; --panel:#121a26; --panel2:#0e141d; --code:#070b11; --line:#24344d;
  --text:#e6edf3; --muted:#9fb0c3; --blue:#58a6ff; --green:#3fb950; --red:#f85149;
  --amber:#d29922; --violet:#bc8cff; --cyan:#56d4dd;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
code,pre,.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;font-size:14px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#wrap{max-width:1180px;margin:0 auto;padding:0 14px 60px}
/* topbar */
#topbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
 background:rgba(11,15,20,.96);border-bottom:1px solid var(--line);padding:10px 4px}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-brand svg{flex:0 0 auto}
#tb-title{font-weight:700;font-size:16px}
#tb-sub{color:var(--muted);font-size:12.5px}
.sev-badge{padding:4px 10px;border-radius:6px;font-weight:700;font-size:12.5px;letter-spacing:.06em}
.sev-badge.medium{background:rgba(210,153,34,.16);color:var(--amber);border:1px solid var(--amber)}
.sev-badge.hard{background:rgba(248,81,73,.14);color:var(--red);border:1px solid var(--red)}
.tb-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:ui-monospace,Consolas,monospace;font-size:19px;font-weight:700;min-width:72px;text-align:center;
 background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.timer.low{color:var(--red);border-color:var(--red);animation:pulse 1.2s infinite}
.timer.frozen{color:var(--amber);border-color:var(--amber)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.pause-flag{color:var(--amber);font-weight:600;font-size:13.5px;background:rgba(210,153,34,.12);border:1px solid var(--amber);border-radius:6px;padding:6px 10px}
/* statusbar */
#statusbar{display:flex;align-items:center;gap:12px;padding:10px 2px}
#progress-outer{flex:1;height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#progress-in{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .5s ease}
.chip-score{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600;white-space:nowrap}
/* buttons */
.btn{min-height:44px;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);
 cursor:pointer;font-weight:600;transition:transform .08s ease,background .15s ease}
.btn:hover{background:#1a2436}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#1f4fd8;border-color:#3b6dff}
.btn.primary:hover{background:#2a5cf0}
.btn.primary2{background:#123a6b;border-color:var(--blue);color:var(--blue)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.ctrl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 6px}
/* intro */
#scr-intro .intro-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}
#scr-intro h1{margin:0 0 6px;font-size:24px}
.meta-chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.meta-chips span{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.meta-chips span b{color:var(--text)}
.kw-panel{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kw-panel h3{margin:0;padding:10px 14px;background:var(--panel2);font-size:14.5px;letter-spacing:.04em}
.kw-theme{padding:10px 14px;border-top:1px solid var(--line)}
.kw-theme h4{margin:0 0 6px;font-size:13.5px;color:var(--cyan)}
.kw-theme .kw{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:2px 4px 2px 0;font-size:12.5px;color:var(--muted)}
.howto{margin:14px 0 0;padding-left:20px}
.howto li{margin:7px 0}
.howto b{color:var(--blue)}
/* blocks */
.blk{border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden}
.blk-label{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.12em;padding:5px 12px;border-bottom-right-radius:8px}
.blk-body{padding:12px 16px}
.blk-body p{margin:8px 0}
.blk-scenario{background:#101a2b;border-color:#27436e}
.blk-scenario .blk-label{background:#27436e;color:#cfe4ff}
.blk-artifact{background:var(--code);border-color:#1c2b40}
.blk-artifact .blk-label{background:#1c2b40;color:var(--cyan)}
.blk-artifact pre{margin:0;white-space:pre-wrap;word-break:break-word}
.blk-question{background:#1d1430;border-color:#4c3a7a}
.blk-question .blk-label{background:#4c3a7a;color:#eadfff}
code{background:#0a0f16;border:1px solid #1d2a3d;border-radius:4px;padding:1px 5px}
/* options */
.ans-area{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px 16px;margin:14px 0}
.ans-area.locked .ans-body{pointer-events:none;opacity:.92}
.ans-label{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--amber);margin:2px 0 10px}
.opt,.br-opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
 border-radius:8px;padding:11px 13px;margin:7px 0;cursor:pointer;min-height:44px}
.opt:hover,.br-opt:hover{border-color:var(--blue)}
.opt-key{flex:0 0 26px;height:26px;border-radius:50%;background:#0a0f16;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--blue);background:#12233d}
.opt.is-ok{border-color:var(--green);background:rgba(63,185,80,.12)}
.opt.is-bad{border-color:var(--red);background:rgba(248,81,73,.10)}
.opt.is-warn{border-color:var(--amber);background:rgba(210,153,34,.10)}
/* notice */
.notice{border-radius:8px;padding:10px 14px;margin:10px 0;border:1px solid}
.notice.warn{background:rgba(210,153,34,.10);border-color:var(--amber);color:#f0d08a}
.notice.ok{background:rgba(63,185,80,.10);border-color:var(--green);color:#9adfa5}
.notice.hint{background:rgba(88,166,255,.08);border-color:var(--blue);color:#bcd6ff}
/* feedback */
.fb-area{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 16px;margin:14px 0}
.fb-sum{margin:4px 0 10px}
.badge{display:inline-block;padding:4px 10px;border-radius:6px;font-weight:700;font-size:13px}
.b-full{background:rgba(63,185,80,.15);color:var(--green);border:1px solid var(--green)}
.b-partial{background:rgba(210,153,34,.14);color:var(--amber);border:1px solid var(--amber)}
.b-zero{background:rgba(248,81,73,.12);color:var(--red);border:1px solid var(--red)}
.b-skip{background:rgba(210,153,34,.14);color:var(--amber);border:1px dashed var(--amber)}
.hintnote{color:var(--muted);font-size:13px}
.fb-marks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mark{border-radius:6px;padding:4px 9px;font-size:12.5px;border:1px solid}
.m-ok{background:rgba(63,185,80,.12);border-color:var(--green);color:#9adfa5}
.m-bad{background:rgba(248,81,73,.10);border-color:var(--red);color:#ffb3ae}
.m-warn{background:rgba(210,153,34,.10);border-color:var(--amber);color:#f0d08a}
.fb-correct,.fb-explain{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.fb-correct-h,.fb-explain-h{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--cyan);margin-bottom:4px}
/* exercise head */
.ex-head{margin-top:16px}
.ex-no{color:var(--muted);font-size:13px;letter-spacing:.05em}
.ex-meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.theme-chip,.type-chip,.pts-chip{border-radius:6px;padding:3px 9px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.t-leak{border-color:#d29922;color:#f0d08a}.t-esc{border-color:#f85149;color:#ffb3ae}
.t-det{border-color:#58a6ff;color:#bcd6ff}.t-con{border-color:#3fb950;color:#9adfa5}
.t-proc{border-color:#bc8cff;color:#e3d0ff}
.ex-title{margin:6px 0 2px;font-size:20px}
.ex-tags .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:3px 4px 0 0;font-size:12px;color:var(--muted)}
/* navigator */
#exam-grid{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
#navigator{display:flex;flex-direction:column;gap:6px;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto;padding:4px 2px}
.nav-btn{position:relative;flex:0 0 auto;width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
 font-weight:700;cursor:pointer;font-size:14px}
.nav-glyph{position:absolute;top:2px;right:4px;font-size:10px;line-height:1;color:inherit}
.nav-btn.full{background:rgba(63,185,80,.18);border-color:var(--green);color:#9adfa5}
.nav-btn.part{background:rgba(210,153,34,.16);border-color:var(--amber);color:#f0d08a}
.nav-btn.zero{background:rgba(248,81,73,.14);border-color:var(--red);color:#ffb3ae}
.nav-btn.skip{background:repeating-linear-gradient(45deg,rgba(210,153,34,.16),rgba(210,153,34,.16) 6px,transparent 6px,transparent 12px);border-color:var(--amber);color:#f0d08a}
.nav-btn.touched{border-color:var(--blue);color:var(--blue)}
.nav-btn.cur{outline:3px solid var(--cyan);outline-offset:1px}
/* drag & drop */
.dd-bank{background:var(--code);border:1px dashed #2c3f5c;border-radius:10px;padding:10px;margin-bottom:12px;min-height:56px}
.dd-bank-h,.dd-bucket-h{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.dd-item{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:4px 6px 4px 0;cursor:grab;min-height:44px;text-align:left}
.dd-item.sel{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(86,212,221,.35)}
.dd-item.is-ok{border-color:var(--green);background:rgba(63,185,80,.12)}
.dd-item.is-bad{border-color:var(--red);background:rgba(248,81,73,.10)}
.dd-item.is-warn{border-color:var(--amber);background:rgba(210,153,34,.10)}
.dd-buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.dd-bucket{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:96px}
.dd-zone{border:1px dashed #2c3f5c;border-radius:8px;min-height:64px;padding:6px}
.dd-zone.over{border-color:var(--cyan);background:rgba(86,212,221,.06)}
.dd-hint{color:#7f93ad;font-size:12.5px;padding:6px}
/* order / rank */
.ord-row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:7px 0;min-height:48px}
.ord-row.over{border-color:var(--cyan)}
.ord-handle{cursor:grab;color:var(--muted);font-size:18px;padding:6px 8px}
.ord-label{flex:1}
.ord-row.is-ok{border-color:var(--green);background:rgba(63,185,80,.12)}
.ord-row.is-bad{border-color:var(--red);background:rgba(248,81,73,.10)}
.ord-row.is-warn{border-color:var(--amber);background:rgba(210,153,34,.10)}
.ord-up,.ord-dn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px}
.axis-note{color:var(--muted);font-size:13px;margin:4px 0 8px}
/* match */
.mt-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.mt-lab{flex:0 0 46%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;display:flex;align-items:center}
.mt-row.sel .mt-lab{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(86,212,221,.35)}
.mt-row.is-ok .mt-lab{border-color:var(--green);background:rgba(63,185,80,.12)}
.mt-row.is-bad .mt-lab{border-color:var(--red);background:rgba(248,81,73,.10)}
.mt-row.is-warn .mt-lab{border-color:var(--amber);background:rgba(210,153,34,.10)}
.mt-row.is-ok .mt-slot,.mt-row.is-bad .mt-slot,.mt-row.is-warn .mt-slot{opacity:.92}
.mt-conn{color:#7f93ad}
.mt-slot{flex:1;border:1px dashed #2c3f5c;border-radius:8px;padding:8px 10px;min-height:44px;color:var(--muted);display:flex;align-items:center;cursor:pointer;background:rgba(255,255,255,.015)}
.mt-slot.filled{border-style:solid;border-color:var(--blue);color:var(--text)}
.mt-pool{margin-top:12px;background:var(--code);border:1px dashed #2c3f5c;border-radius:10px;padding:10px;min-height:56px}
/* fill */
.fill-text{line-height:2.1}
.blank{background:#0a0f16;border:1px dashed #3b5c86;border-radius:6px;color:var(--amber);padding:4px 10px;min-height:36px;cursor:pointer;margin:0 2px}
.blank.filled{border-style:solid;color:var(--text);border-color:var(--blue);background:#12233d}
.blank.is-ok{border-color:var(--green);background:rgba(63,185,80,.14)}
.blank.is-bad{border-color:var(--red);background:rgba(248,81,73,.12)}
.blank.is-warn{border-color:var(--amber)}
.fill-bank{margin-top:12px;background:var(--code);border:1px dashed #2c3f5c;border-radius:10px;padding:10px;min-height:56px}
.bank-word{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;cursor:pointer;min-height:44px}
.bank-word.sel{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(86,212,221,.35)}
/* spot */
.spot-lines{margin:0}
.spot-line{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--text)}
.spot-line:hover{background:#101827}
.spot-line .ln{color:#7f93ad;flex:0 0 34px;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.spot-line.sel{border-color:var(--cyan);background:#0d2233}
.spot-line.is-ok{border-color:var(--green);background:rgba(63,185,80,.12)}
.spot-line.is-bad{border-color:var(--red);background:rgba(248,81,73,.10)}
.spot-line.is-warn{border-color:var(--amber);background:rgba(210,153,34,.10)}
.spot-line code{background:transparent;border:none;padding:0}
/* log viewer */
.logv-bar{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:8px 10px}
.logv-bar label{font-size:12.5px;font-weight:700;color:var(--muted)}
.logv-bar input{flex:1;background:#0a0f16;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:9px 10px;font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:44px}
.logv-count{color:var(--muted);font-size:12.5px;white-space:nowrap}
.logv-lines{background:var(--code);border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;padding:8px 10px;max-height:340px;overflow:auto}
.log-line{font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:pre-wrap;word-break:break-word;padding:1.5px 0}
.log-line.l-err{color:#ffb3ae}.log-line.l-warn{color:#f0d08a}.log-line.l-ok{color:#9adfa5}
.l-ip{color:var(--violet)}.l-str{color:#a5d6ff}.l-ts{color:#7d8ca1}
.sub-q{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
/* terminal */
.term-tasks{margin-bottom:10px}
.task{padding:6px 10px;border-left:3px solid var(--line);margin:5px 0;color:var(--muted);font-size:14px}
.task.ok{border-left-color:var(--green);color:#9adfa5}
.task.miss{border-left-color:var(--red);color:#ffb3ae}
.term{background:#04070b;border:1px solid #1c2b40;border-radius:8px;padding:10px 12px}
.term-out{max-height:280px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:pre-wrap;word-break:break-word}
.term-out .t-prompt{color:var(--blue)}.term-out .t-sys{color:var(--green)}.term-out .t-err{color:var(--red)}
.term-in-row{display:flex;gap:8px;align-items:center;margin-top:8px;border-top:1px solid #1c2b40;padding-top:8px}
.term-in-row .pr{color:var(--green);font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:nowrap}
.term-in{flex:1;background:transparent;border:none;color:var(--text);font-family:ui-monospace,Consolas,monospace;font-size:14px;min-height:34px}
/* branch */
.br-step{color:var(--muted);font-size:12.5px;letter-spacing:.08em;font-weight:700}
.br-q{margin:8px 0 10px;font-size:16.5px}
.br-opt{width:100%;margin:7px 0}
.br-opt.sel{border-color:var(--blue);background:#12233d}
.br-done{margin-bottom:12px}
.br-line{padding:5px 10px;border-radius:6px;margin:4px 0;font-size:14px}
.br-line.ok{background:rgba(63,185,80,.10);color:#9adfa5}
.br-line.bad{background:rgba(248,81,73,.08);color:#ffb3ae}
.br-fb{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0;color:var(--muted)}
/* pause overlay */
#pause-overlay{position:fixed;inset:0;background:rgba(4,7,11,.82);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center}
#pause-overlay[hidden]{display:none}
.pause-card{background:var(--panel);border:1px solid var(--amber);border-radius:14px;padding:28px 34px;text-align:center;max-width:420px}
.pause-card h2{margin:0 0 8px;color:var(--amber)}
/* results */
.res-hero{border-radius:14px;padding:26px;margin-top:18px;text-align:center;border:1px solid}
.res-hero.pass{background:radial-gradient(1200px 400px at 50% -80px,rgba(63,185,80,.18),transparent),var(--panel);border-color:var(--green)}
.res-hero.fail{background:radial-gradient(1200px 400px at 50% -80px,rgba(248,81,73,.15),transparent),var(--panel);border-color:var(--red)}
.res-pct{font-size:52px;font-weight:800;line-height:1.1}
.res-hero.pass .res-pct{color:var(--green)}
.res-hero.fail .res-pct{color:var(--red)}
.res-sub{color:var(--muted)}
.res-sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:14px 0}
.res-sec h3{margin:0 0 10px;font-size:16px}
.res-row{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel2)}
.res-row summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 14px;cursor:pointer;min-height:44px}
.res-row .rn{color:var(--muted);font-weight:700}
.res-row .rt{flex:1}
.res-row .pts{font-weight:700;white-space:nowrap}
.res-body{border-top:1px solid var(--line);padding:12px 16px}
.res-body h4{margin:10px 0 4px;font-size:12.5px;letter-spacing:.1em;color:var(--cyan)}
.theme-bar{display:flex;align-items:center;gap:10px;margin:6px 0}
.theme-bar .tb-name{flex:0 0 190px;font-size:13.5px;color:var(--muted)}
.theme-bar .tb-track{flex:1;height:8px;background:var(--code);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.theme-bar .tb-fill{height:100%;background:var(--blue)}
.theme-bar .tb-val{flex:0 0 70px;text-align:right;font-size:13px;color:var(--muted)}
@media (max-width:820px){
  #exam-grid{grid-template-columns:1fr}
  #navigator{flex-direction:row;position:static;max-height:none;overflow-x:auto;order:2}
  .mt-lab{flex:0 0 42%}
  .res-pct{font-size:40px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

 {t:'Containment & recovery',k:['disable & rotate keys','revoke sessions','isolate host / SG quarantine','forensic snapshot','eradication','clean restore','re-compromise watch']},
 {t:'IR process & program',k:['NIST IR phases','runbooks','SOAR','severity & priority','escalation','stakeholder comms','chain of custody','RCA / lessons learned','MTTD / MTTR','break-glass & JIT access','shared responsibility']}

var EXAMS=[
{ id:'h01', type:'logview', pts:2, theme:'esc', title:'CloudTrail: find the real escalation',
  tags:['CloudTrail','role chaining','iam:PassRole'],
  scenario:`<p>03:10. Account 444455556666. GuardDuty raised one medium finding hours ago and it was dismissed as CI noise. You are the second reviewer. The trail excerpt mixes routine automation with a slow, quiet escalation.</p>`,
  question:`<p>Use the filter if needed, then complete the analysis note below.</p>`,
  ui:{label:'LOG ANALYSIS — FILL THE ANALYSIS NOTE',
    lines:[
      '{"ts":"02:14:07","event":"CreateRole","role":"fix-agent","trust":"ec2.amazonaws.com","src":"198[.]51[.]100[.]44","agent":"aws-cli/2.15"}',
      '{"ts":"02:15:31","event":"PutRolePolicy","role":"fix-agent","policy":"AdministratorAccess","src":"198[.]51[.]100[.]44"}',
      '{"ts":"02:19:58","event":"CreateFunction","fn":"log-rotator","role":"fix-agent","src":"198[.]51[.]100[.]44"}',
      '{"ts":"02:21:12","event":"InvokeFunction","fn":"log-rotator","principal":"lambda.amazonaws.com"}',
      '{"ts":"02:22:40","event":"AssumeRole","role":"fix-agent","by":"log-rotator","src":"lambda.amazonaws.com"}',
      '{"ts":"02:24:05","event":"CreateAccessKey","user":"fin-admin","by":"fix-agent-session","src":"lambda.amazonaws.com"}',
      '{"ts":"02:22:11","event":"DescribeInstances","user":"ci-runner","src":"10[.]0[.]8[.]15"}',
      '{"ts":"02:26:47","event":"ListUsers","user":"ci-runner","src":"10[.]0[.]8[.]15"}',
      '{"ts":"02:31:20","event":"ConsoleLogin","user":"sam","mfa":"yes","src":"198[.]51[.]100[.]8"}',
      '{"ts":"02:34:02","event":"PutRolePolicy","role":"fix-agent","policyName":"inline-s3-read","src":"lambda.amazonaws.com"}'
    ],
    inner:{type:'fill',text:'The escalation works in three steps: the attacker creates role fix-agent, attaches AdministratorAccess to it, and then uses the dangerous {0} permission at function-creation time so their code runs inside the {1} service with that admin role. The ci-runner events come from the internal subnet and sam logged in with MFA — both are routine.',
      bank:['iam:PassRole','Lambda','s3:GetObject','iam:CreateUser','EC2'],
      correct:['iam:PassRole','Lambda']}},
  hint:'Filter for 198[.]51[.]100[.]44 and follow what fix-agent can do. The permission that hands roles to services is the escalation itself.',
  explain:`<p>The chain is <code>CreateRole</code> (attacker makes a role), <code>PutRolePolicy</code> with <code>AdministratorAccess</code> (the role becomes admin — the escalation itself), and <code>CreateFunction</code> with that role, which is <code>iam:PassRole</code>: the attacker's code now runs with admin rights through the Lambda service. The <code>ci-runner</code> events come from the trusted internal subnet and sam logged in with MFA — both are routine, and the earlier "CI noise" dismissal was exactly this trap.</p>`},

{ id:'h02', type:'qcm', pts:2, theme:'esc', title:'Which chain is true escalation?',
  tags:['privilege escalation','near-miss','log reading'],
  scenario:`<p>Two analysts disagree about four event chains from last night. All four look "cloudy" — only one is genuine privilege escalation.</p>`,
  question:`<p>Which chain is real privilege escalation?</p>`,
  ui:{label:'CHOOSE ONE',options:[
    {t:'Backup role read its own bucket at 02:00, then wrote a log file'},
    {t:'CI job assumed its assigned role, then PutObject into the artifacts bucket'},
    {t:'Developer ran GetCallerIdentity, then changed their own password'},
    {t:'Lambda passed fix-agent role at 02:19; role then attached AdministratorAccess to itself',correct:true}
  ]},
  hint:'Escalation = an identity ends the night with powers it did not start with.',
  explain:`<p>Only the last chain grows power: a role that <em>itself</em> gains <code>AdministratorAccess</code> after being passed to new code. The backup and CI chains act strictly inside their assigned permissions — normal automation. GetCallerIdentity is a read-only "who am I" call, and a self-service password change is routine. The near-miss trap is that all four chains involve roles, buckets or credentials; escalation is about the <em>permission delta</em>, not the vocabulary.</p>`},

{ id:'h03', type:'order', pts:7, theme:'det', title:'Rebuild the timeline from raw lines',
  tags:['timeline reconstruction','CloudTrail','IoC'],
  scenario:`<p>Seven log lines were exported in alphabetical order by an over-eager intern. Rebuild the true chronology of the takeover of <code>m.reyes</code>.</p>`,
  question:`<p>Drag the lines into chronological order (earliest on top).</p>`,
  ui:{label:'DRAG TO REORDER — EARLIEST ON TOP',axis:'Reconstruct what the attacker did, minute by minute',
    items:[
      {id:'t1',l:'02:03 ConsoleLogin m.reyes from 198[.]51[.]100[.]9 — no MFA, new device'},
      {id:'t2',l:'02:05 CreateAccessKey for m.reyes (self-issued)'},
      {id:'t3',l:'02:09 AttachUserPolicy AdministratorAccess on m.reyes'},
      {id:'t4',l:'02:12 CreateRole backdoor-sync trusting external account 999988887777'},
      {id:'t5',l:'02:17 GetObject ×2140 on bucket hr-vault as m.reyes'},
      {id:'t6',l:'02:24 StopLogging on the organisation trail'},
      {id:'t7',l:'02:31 DeleteAccessKey — the original key of m.reyes'}
    ],
    correct:['t1','t2','t3','t4','t5','t6','t7']},
  hint:'Get in, add spare keys, gain power, build the backdoor, take data, blind the cameras, lock the real user out.',
  explain:`<p>The story: stolen-password console login, a self-issued spare key (persistence), admin policy (escalation), a cross-account trusted role (deep persistence), bulk reads from hr-vault (collection), then <code>StopLogging</code> to hide later steps, and finally deleting the victim's original key so recovery is harder. The StopLogging event is the audit alarm to fight for — organisations alert on it precisely because attackers pull it late in an intrusion.</p>`},

{ id:'h04', type:'branch', pts:4, theme:'leak', title:'Branching: impossible travel, new MFA device',
  tags:['impossible travel','MFA','session replay'],
  scenario:`<p>03:14. Identity alerts: <code>j.laurent</code> signed in from Lyon at 02:30 and from another country at 03:10 — impossible travel. At 03:12 a new MFA device was registered, from the Lyon session's token.</p>`,
  question:`<p>Work the branch.</p>`,
  ui:{label:'BRANCHING SCENARIO — CHOOSE ONE OPTION PER STEP',
    nodes:[
      {q:'What do you do first?',opts:[
        {t:'Revoke all j.laurent sessions and review the 03:12 MFA registration',ok:true,fb:'Sessions die. The registration event shows device "iPhone-IR" added by the 02:30 session token — a replayed session.'},
        {t:'Call the user and wait for a reply before touching anything',ok:false,fb:'It is 03:14 and the user is asleep. You lose 20 minutes of attacker freedom per unanswered ring.'},
        {t:'Disable MFA for the account to lock the attacker out',ok:false,fb:'Removing MFA helps nobody — the attacker already holds a valid session.'}]},
      {q:'Sessions are revoked. The new device stays registered. Next?',opts:[
        {t:'Delete the rogue MFA device and hunt for other persistence: new keys, OAuth grants, recovery contacts',ok:true,fb:'You find one spare access key and an unfamiliar OAuth grant with mail.read — all removed.'},
        {t:'Only delete the device; the rest is probably fine',ok:false,fb:'"Probably" is not containment. Attackers who register MFA usually seed more persistence in the same hour.'},
        {t:'Ask the user to re-approve the device when she wakes',ok:false,fb:'You would be asking the victim to re-approve the attacker\'s device.'}]},
      {q:'The user is on approved leave, laptop powered off. What does the self-approved device registration tell you?',opts:[
        {t:'The attacker reused her session token to approve it — treat every identity setting in the window as attacker-owned',ok:true,fb:'You widen the review window: password, recovery email, app grants, delegated rights — all checked from 02:30 onward.'},
        {t:'She must have done it herself from her phone',ok:false,fb:'Her phone shows no travel and her laptop is off. The session token is the fingerprint, not the person.'},
        {t:'It proves the identity provider is broken',ok:false,fb:'The IdP did its job — it recorded who approved what. The session token was the problem.'}]},
      {q:'Containment is done. What is the correct recovery?',opts:[
        {t:'Re-enrol MFA fresh, invalidate all tokens, and review identity-store changes from the last 30 days',ok:true,fb:'Recovery completes with a 30-day identity diff review — one stale guest grant found and removed.'},
        {t:'Restore the account exactly as it was before the incident',ok:false,fb:'"Exactly as before" restores the attacker\'s device and grants with it.'},
        {t:'Close the ticket; MFA is back',ok:false,fb:'MFA alone does not undo seeded persistence. Recovery ends with verification, not a checkbox.'}]}
    ]},
  hint:'Impossible travel plus a self-approved device equals a stolen session, not a broken IdP. Contain tokens first, then persistence, then verify recovery.',
  explain:`<p>Impossible travel with a self-approved MFA registration means the attacker replayed a stolen session token — the approval is theirs. Correct flow: revoke sessions first (they are the attacker's current access), remove the rogue device, then hunt every other persistence type (keys, OAuth grants, recovery contacts). Recovery is not "restore as before" — it is fresh enrolment plus a 30-day identity diff to catch anything seeded earlier.</p>`},

{ id:'h05', type:'term', pts:2, theme:'con', title:'Terminal: document the listeners',
  tags:['live response','triage','evidence'],
  scenario:`<p>Compromised host <code>web-03</code>, still running. Before anything is stopped, the incident commander wants the listening services — with the process behind each — saved as evidence.</p>`,
  question:`<p>Goal only, no tool is named: list every listening network port together with the owning process, and store that output in <code>/tmp/ir_evidence.txt</code>. Two goals: run the right inspection, and capture it to the file.</p>`,
  ui:{label:'TERMINAL — YOU CHOOSE THE TOOL AND FLAGS',
    prompt:'root@web-03:/',
    banner:['Live response console — web-03 (10[.]0[.]3[.]31)','Do not stop services. Evidence first.','Type help for available commands.'],
    tasks:[
      {d:'List listening sockets together with their owning processes',rx:/\b(ss|netstat|lsof)\b[^;;&]*(\s-[a-zA-Z]*p|\s-i)/i,eg:'ss -tulnp'},
      {d:'Save that output to /tmp/ir_evidence.txt',rx:/\b(ss|netstat|lsof)\b[^;;&]*(>|tee)[^;;&]*ir_evidence\.txt/i,eg:'ss -tulnp > /tmp/ir_evidence.txt'}
    ],
    ps:'  PID TTY      STAT   TIME COMMAND\n  912 ?        Ss     0:01 sshd: /usr/sbin/sshd -D [listener]\n 1204 ?        S      4:12 node /srv/app/server.js\n 7721 ?        R    811:33 python3 /tmp/.x/sysupdate.py',
    netstat:'Netid State  Local Address:Port        Peer Address:Port       Process\ntcp   LISTEN 0[.]0[.]0[.]0:22              0[.]0[.]0[.]0:*          users:(("sshd",pid=912,fd=3))\ntcp   LISTEN 127[.]0[.]0[.]1:8080         0[.]0[.]0[.]0:*          users:(("node",pid=1204,fd=19))\ntcp   LISTEN 0[.]0[.]0[.]0:4444           0[.]0[.]0[.]0:*          users:(("python3",pid=7721,fd=7))',
    fs:{
      '/etc/passwd':'root:x:0:0:root:/root:/bin/bash\nwww-data:x:33:33::/var/www:/usr/sbin/nologin',
      '/tmp/.x/sysupdate.py':'#!/usr/bin/env python3\n# miner + reverse shell\ntarget = "185[.]199[.]108[.]153:4444"',
      '/var/log/auth.log':'Mar 14 03:02:11 web-03 sudo: www-data : command not allowed ; TTY=pts/0'
    }},
  hint:'Standard socket-inspection tools all support a "processes" flag and numeric output; the shell\'s > redirect saves stdout.',
  explain:`<p>Any of <code>ss -tulnp</code>, <code>netstat -tulnp</code> or <code>lsof -i</code> reveals listeners with owning PIDs — here they expose a python3 process on port 4444 that belongs to nothing you deployed. Redirecting with <code>&gt;</code> to <code>/tmp/ir_evidence.txt</code> freezes the observation before the host is isolated. The evidence value is the pairing of port, PID and command line; the file also proves what the state was at capture time.</p>`},

{ id:'h06', type:'branch', pts:3, theme:'leak', title:'Branching: the key you force-pushed away',
  tags:['secret leak','dual perspective','secret scanning'],
  scenario:`<p>Dual perspective. As the red team you finished an engagement by accidentally committing a real-looking key <code>AKIA9F3EXAMPLE8KQ2</code> to the public mirror repo — then force-pushed it away. Both sides answer.</p>`,
  question:`<p>Work the branch — red and blue views alternate.</p>`,
  ui:{label:'BRANCHING SCENARIO — RED/BLUE PERSPECTIVES',
    nodes:[
      {q:'RED VIEW. The commit is gone from the history. Is the key safe?',opts:[
        {t:'No — clones, CI caches and scraper bots may already hold it; treat it as burned',ok:true,fb:'Blue team\'s scanner fired 9 minutes after the push. Force-pushing removes the pointer, not the copies.'},
        {t:'Yes — the branch no longer references it',ok:false,fb:'GitHub keeps orphaned commits reachable by SHA for a long time, and public mirrors exist.'},
        {t:'Only if the repo also went private',ok:false,fb:'Privacy stops future scraping, not anything already scraped.'}]},
      {q:'BLUE VIEW. Secret scanning fired 9 minutes after the push. What does the team assume?',opts:[
        {t:'Compromised: rotate immediately and audit CloudTrail for every use of that key',ok:true,fb:'Rotation plus a full use-audit finds zero calls — the fast rotate beat the scraper this time.'},
        {t:'Wait for the owner to confirm it was a test key',ok:false,fb:'Waiting is rotation-in-denial. The cost of rotating a test key is minutes; the cost of being wrong is an incident.'},
        {t:'Auto-close — the secret no longer appears in the repo',ok:false,fb:'The alert is about exposure in time, not presence in history. Closing on "not visible now" is the classic miss.'}]},
      {q:'RED VIEW. To delay detection next time, what would tradecraft suggest?',opts:[
        {t:'Use the key from the same region, user agent and low volume as the legitimate service',ok:true,fb:'Blau team\'s anomaly model keys on deviation — mimicry is the honest answer, and it is why baseline alerts need peer-group context.'},
        {t:'Run wide enumeration immediately while the key is fresh',ok:false,fb:'Volume spikes trip GuardDuty within minutes — the key would die fast.'},
        {t:'Publish the key on a paste site to watch response time',ok:false,fb:'That burns the key to other actors and to the vendor\'s paste-site monitors. Fastest possible detection, worst outcome.'}]}
    ]},
  hint:'Force-push hides the pointer, not the copies. Blue assumes compromised; red assumes detection is behavioural.',
  explain:`<p>Red truth: a pushed secret is burned the moment it is public — clones, caches and scrapers keep it alive after any rewrite. Blue truth: the alert is exposure-in-time, so the only safe reading is "rotate now, audit use after". Red tradecraft is behavioural mimicry — same region, user agent, low volume — which is exactly why blue teams baseline peer groups instead of trusting volume thresholds alone.</p>`},

{ id:'h07', type:'spot', pts:1, theme:'esc', title:'Trust policy: one line opens the role',
  tags:['trust policy','AssumeRole','principal'],
  scenario:`<p>Access review of role <code>vendor-sync</code>. The cloud team says "it only trusts the vendor". The role can be assumed by anyone who knows its ARN.</p>`,
  question:`<p>Click the line that makes that possible.</p>`,
  ui:{label:'CLICK THE OPEN LINE',
    lines:[
      '{',
      '  "Version": "2012-10-17",',
      '  "Statement": [{',
      '    "Effect": "Allow",',
      '    "Principal": "*",',
      '    "Action": "sts:AssumeRole",',
      '    "Condition": {"Bool": {"aws:SecureTransport": "true"}}',
      '  }]',
      '}'
    ],
    correct:[4]},
  hint:'Who is allowed to arrive? Line 5 answers "anyone".',
  explain:`<p><code>"Principal": "*"</code> trusts every identity on the internet — the Condition only requires TLS, which any attacker satisfies. The Version line is just policy-language metadata. The correct pattern pins the principal to the vendor's account (or better, an external-ID condition), so only that account can assume the role. A wildcard principal on a trust policy is one of the most common cross-account leak paths found by Access Analyzer.</p>`},

{ id:'h08', type:'bucket', pts:6, theme:'proc', title:'GuardDuty findings → playbook lanes',
  tags:['GuardDuty','SOAR','playbook'],
  scenario:`<p>Saturday duty. Six GuardDuty findings queued. Your SOAR has three lanes — route each finding so the right playbook fires.</p>`,
  question:`<p>Drag each finding into its lane.</p>`,
  ui:{label:'DRAG EACH FINDING TO ITS LANE',
    items:[
      {id:'g1',l:'Runtime/CryptoMining: miner binary on the prod web node'},
      {id:'g2',l:'IAMUser/NewCredentials: spare key created for finance-admin'},
      {id:'g3',l:'Recon:PortProbe on NAT — source is the pentest vendor IP'},
      {id:'g4',l:'EC2/TorIPCaller: Tor exit talks to the honeypot instance'},
      {id:'g5',l:'IAMUser/ListUsers at 03:40 from a country we do not operate in'},
      {id:'g6',l:'Impact:CostAnomaly — dev account spend up 400% in 6 hours'}
    ],
    buckets:[
      {id:'now',l:'Contain now'},
      {id:'inv',l:'Investigate & enrich'},
      {id:'noise',l:'Approved / expected noise'}
    ],
    correct:{g1:'now',g2:'now',g3:'noise',g4:'noise',g5:'inv',g6:'inv'}},
  hint:'Active damage and new credentials = contain. Unexplained identity behaviour = investigate. Designed or ticketed sources = noise.',
  explain:`<p><strong>Contain now:</strong> a live miner on production and a freshly created admin key are active damage and active access — isolate the node, kill the key. <strong>Investigate:</strong> ListUsers from an unexpected country and a 400% spend spike need enrichment — who, from where, what else changed — before containment targets are clear (the spike is often a leaked key feeding a miner, so it may escalate). <strong>Noise:</strong> the vendor IP is ticketed, and the honeypot is built to be probed — both stay watched, not actioned.</p>`},
{ id:'h09', type:'fill', pts:4, theme:'esc', title:'Golden SAML, in plain steps',
  tags:['golden SAML','federation','token forgery'],
  scenario:`<p>Post-mortem of the federation breach. The comms team needs the mechanism in one paragraph — fill the technical slots.</p>`,
  question:`<p>Fill the four blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'The attacker stole the {0} key of our identity provider and minted their own SAML assertions. Because the cloud side trusted anything signed by that key, the forged tokens granted admin sessions with no password and no MFA prompt anywhere. The assertion carried a custom {1} claim naming our admin role. Recovery is harsh: replace the signing key, break the {2} trust, and {3} every session issued since the first forgery — you cannot list tokens you cannot see.',
    bank:['signing','role','federation','revoke','rotate','public'],
    correct:['signing','role','federation','revoke']},
  hint:'The crown jewel is the signing key. The forged ticket names the role it wants. Trust is the thing being repaired.',
  explain:`<p>A golden-SAML attack forges login assertions with the provider's <strong>signing</strong> key, so the cloud accepts them like genuine logins — no password, no MFA, no failed-login noise. The assertion embeds a <strong>role</strong> claim that names the admin role to receive. Repair means replacing the key, breaking the <strong>federation</strong> trust that honoured it, and <strong>revoking</strong> all sessions since the first forgery, because stolen tokens cannot be individually listed or expired.</p>`},

{ id:'h10', type:'match', pts:5, theme:'det', title:'ATT&CK technique → cloud example',
  tags:['MITRE ATT&CK','mapping','detection'],
  scenario:`<p>Detection-engineering session: tie each ATT&CK technique to the cloud example your detections must catch.</p>`,
  question:`<p>Pair each technique with its example.</p>`,
  ui:{label:'MATCHING — PAIR LEFT WITH RIGHT',
    pairs:[
      {l:'T1078 Valid Accounts',r:'Sign-in with a leaked access key from a new country'},
      {l:'T1098 Account Manipulation',r:'Spare access key plus self-attached admin policy'},
      {l:'T1552 Unsecured Credentials',r:'Credentials file readable inside a public storage bucket'},
      {l:'T1068 Exploitation for Priv. Esc.',r:'Kernel exploit run on the host to become root'},
      {l:'T1530 Data from Cloud Storage',r:'Bulk GetObject calls against the hr-vault bucket'}
    ]},
  hint:'Valid = using what works. Manipulation = changing accounts. Unsecured = secrets lying around. 1530 is storage theft.',
  explain:`<p><strong>T1078</strong> is using an account that already works — the leaked key is the classic cloud case. <strong>T1098</strong> changes accounts to keep access: spare keys, self-granted policies. <strong>T1552</strong> is credentials left exposed — the public-bucket credentials file. <strong>T1068</strong> is exploiting software to gain privilege — on the host, the kernel exploit. <strong>T1530</strong> is theft from cloud storage specifically — the bulk GetObject pattern. Mapping events to techniques is what turns isolated alerts into an attack story.</p>`},

{ id:'h11', type:'qcm', pts:2, theme:'det', title:'Root cause the evidence supports',
  tags:['RCA','infostealer','evidence weighing'],
  scenario:`<p>Evidence: (1) EDR on the finance laptop shows an infostealer alert two days before the incident; (2) the stolen session had the same user agent and browser fingerprint as that laptop's Chrome; (3) no key was ever in a repo; (4) the user was on holiday with MFA device at home; (5) logs show no brute force anywhere.</p>`,
  question:`<p>Which root cause does the evidence actually support?</p>`,
  ui:{label:'CHOOSE ONE',options:[
    {t:'Brute-force attack against the identity provider'},
    {t:'Credentials lifted from the endpoint by an infostealer',correct:true},
    {t:'A malicious insider using their own account'},
    {t:'A supplier-side compromise of the identity provider itself'}
  ]},
  hint:'The session carries the laptop\'s fingerprint. Nothing else fits all five facts.',
  explain:`<p>The infostealer alert plus the matching browser fingerprint in the hijacked session is a direct chain: malware on the endpoint lifted the credentials or cookie, and the holiday detail explains the absence of the MFA device. Brute force contradicts the logs; an insider would not need a foreign fingerprint; a supplier compromise contradicts the endpoint evidence and would show provider-side anomalies. Root-cause statements must be <em>supported</em>, not just plausible.</p>`},

{ id:'h12', type:'rank', pts:5, theme:'proc', title:'Rank with business context',
  tags:['priority','impact','risk ranking'],
  scenario:`<p>Monday board hour. Five findings, same account, but context matters: the company reports revenue this week and the CFO has flagged cost anomalies.</p>`,
  question:`<p>Drag into response order (first on top).</p>`,
  ui:{label:'DRAG TO RANK — RESPOND FIRST TO TOP',axis:'Rank 1 = respond now',
    items:[
      {id:'b1',l:'Leaked read-only marketing API key, in public, unused for 3 days'},
      {id:'b2',l:'Crypto miner running on the billing-cluster node (spend +400%)'},
      {id:'b3',l:'Disabled backdoor user from last week, pending cleanup review'},
      {id:'b4',l:'Expired TLS certificate on the internal reporting dashboard'},
      {id:'b5',l:'GuardDuty low-severity probe hits on a NAT gateway'}
    ],
    correct:['b2','b1','b3','b4','b5']},
  hint:'Active attacker on revenue infrastructure first; then live public exposure; then cleanup; then ops hygiene; then noise.',
  explain:`<p>The miner sits on <em>billing</em> infrastructure during a cost-sensitive week — active compromise plus direct revenue impact, so it is first. The public marketing key is live exposure; read-only is not read-nothing, and three days in public means assume copies exist. The disabled backdoor is contained already — cleanup, not emergency. The expired certificate degrades the internal dashboard only. NAT probes remain background noise.</p>`},

{ id:'h13', type:'spot', pts:2, theme:'det', title:'Windows events: click the two that hurt',
  tags:['Windows event logs','token manipulation','EDR'],
  scenario:`<p>Cloud Windows VM <code>fin-app-02</code>. EDR forwarded these events before the agent was killed. Most of it is a working Monday morning.</p>`,
  question:`<p>Click the <strong>two</strong> lines that show credential theft or suspicious process spawning.</p>`,
  ui:{label:'CLICK THE TWO EVENTS',
    lines:[
      '09:12:01  EID 4624  Logon Type 2  user: a.farrell  source: console',
      '09:12:40  EID 4688  Process Create: outlook.exe (mail start)',
      '09:41:17  EID 4624  Logon Type 9  NewCredentials  user: svc-sql  source: 10[.]0[.]2[.]15',
      '09:41:19  EID 4672  Special privileges assigned to svc-sql in new logon',
      '11:02:55  EID 4688  Process Create: winword.exe -> cmd.exe  user: a.farrell',
      '11:03:10  EID 4688  Process Create: cmd.exe -> powershell.exe -enc SQBFAF...',
      '12:30:04  EID 4634  Logoff  user: a.farrell'
    ],
    correct:[2,4]},
  hint:'Logon Type 9 is runas-style new credentials; an office document spawning a shell is not a Monday morning.',
  explain:`<p>Line 3, <code>Logon Type 9 NewCredentials</code>, is a <code>runas</code>-style logon — someone minted new credentials for <code>svc-sql</code> from a workstation host, followed by privileged assignment (4672). Line 5 shows <code>winword.exe</code> spawning <code>cmd.exe</code> — office documents do not need shells, so this is macro-driven execution, which then feeds the encoded PowerShell on line 6. Console logon, mail, logoff are routine. Together the two clicks say: credentials manipulated, dropper executed.</p>`},

{ id:'h14', type:'bucket', pts:6, theme:'proc', title:'Shared responsibility: whose fix is it?',
  tags:['shared responsibility','cloud model','audit'],
  scenario:`<p>Audit findings arrive from provider scanning and customer review mixed together. Sort them by who must fix each.</p>`,
  question:`<p>Drag each finding to its owner.</p>`,
  ui:{label:'DRAG EACH FINDING TO ITS OWNER',
    items:[
      {id:'s1',l:'Hypervisor vulnerability disclosed by the provider'},
      {id:'s2',l:'S3-style bucket with public read on backup data'},
      {id:'s3',l:'IAM policy with Action:* on the reporting user'},
      {id:'s4',l:'Physical access controls at the provider data centre'},
      {id:'s5',l:'Unpatched guest OS on an IaaS virtual machine'},
      {id:'s6',l:'Regional power redundancy failure at the provider site'}
    ],
    buckets:[
      {id:'cust',l:'Customer fixes'},
      {id:'prov',l:'Provider fixes'}
    ],
    correct:{s1:'prov',s2:'cust',s3:'cust',s4:'prov',s5:'cust',s6:'prov'}},
  hint:'The provider owns the cloud itself; you own what you put in it and who you let use it.',
  explain:`<p>The provider owns everything <em>of</em> the cloud: hypervisor, data-centre physical security, facility power. The customer owns everything <em>in</em> the cloud: a public bucket is the customer's sharing choice, the wildcard IAM policy is the customer's identity design, and on IaaS the guest OS patching is explicitly the customer's job. Blaming the provider for bucket exposure — or patching their hypervisor yourself — is the classic shared-responsibility misread that auditors hunt.</p>`},

{ id:'h15', type:'fill', pts:4, theme:'con', title:'Contain the role-chaining attack',
  tags:['role chaining','revocation','containment'],
  scenario:`<p>The fix-agent chain is confirmed. Write the containment block for the runbook — every blank is one precise move.</p>`,
  question:`<p>Fill the four blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'Containment of the fix-agent chain, in order: (1) {0} the role so nothing new can assume it. (2) {1} the AdministratorAccess inline policy from the role. (3) {2} every active session in the account so running lambda sessions lose their power. (4) {3} the instance profile from any EC2 host the attacker bound the role to, then delete the rogue function.',
    bank:['delete','detach','revoke','remove','rotate','restart'],
    correct:['delete','detach','revoke','remove']},
  hint:'Kill the role, strip its power, kill live sessions, unbind it from everything.',
  explain:`<p>The four moves: <strong>delete</strong> the rogue role itself so no new assumption is possible; <strong>detach</strong> the admin policy so even surviving sessions lose reach (defence in depth while you work); <strong>revoke</strong> account sessions so the already-running lambda execution dies early rather than at natural token expiry; and <strong>remove</strong> the instance-profile binding plus the function, or the attacker's code returns on the next start. Order matters — power first, sessions second, bindings last.</p>`},

{ id:'h16', type:'spot', pts:1, theme:'leak', title:'Lambda config: where the secret sleeps',
  tags:['secrets in env vars','lambda','spot the mistake'],
  scenario:`<p>Serverless review of <code>etl-sync</code>. The function works perfectly. The reviewer says one line converts this repo into a credential leak.</p>`,
  question:`<p>Click the leaking line.</p>`,
  ui:{label:'CLICK THE LEAKING LINE',
    lines:[
      'runtime: python3.12',
      'handler: app.handler',
      'role: arn:aws:iam::444455556666:role/etl-sync-role',
      'env SNOW_API_KEY: "sk-live-9f2c88d1e5b7"',
      'env LOG_LEVEL: INFO',
      'memory: 1024',
      'timeout: 300'
    ],
    correct:[3]},
  hint:'One environment variable holds a live credential in plain text.',
  explain:`<p>Line 4 stores a live SaaS API key as a plain environment variable: anyone with read access to the function config — and every log or crash dump that echoes the environment — sees it. The correct pattern is a secrets-manager reference resolved at runtime with encryption in transit, plus least-privilege read on just that secret. Runtime, handler, log level, memory and timeout are ordinary configuration.</p>`},
{ id:'h17', type:'bucket', pts:6, theme:'proc', title:'Evidence handling, phase by phase',
  tags:['chain of custody','forensics','evidence'],
  scenario:`<p>The forensic lead asks you to file six actions under the evidence-handling phases before the legal team arrives.</p>`,
  question:`<p>Drag each action to its phase.</p>`,
  ui:{label:'DRAG EACH ACTION TO ITS PHASE',
    items:[
      {id:'e1',l:'Take an EBS snapshot of the compromised volume'},
      {id:'e2',l:'Record the snapshot hash and start the custody log'},
      {id:'e3',l:'Parse CloudTrail into an event timeline'},
      {id:'e4',l:'Write the root-cause analysis for legal review'},
      {id:'e5',l:'Photograph the rogue dashboard before shutdown'},
      {id:'e6',l:'Correlate GuardDuty findings with flow logs'}
    ],
    buckets:[
      {id:'acq',l:'Acquire'},
      {id:'pres',l:'Preserve'},
      {id:'ana',l:'Analyse'},
      {id:'rep',l:'Report'}
    ],
    correct:{e1:'acq',e2:'pres',e3:'ana',e4:'rep',e5:'acq',e6:'ana'}},
  hint:'Grab it, guard it, understand it, present it.',
  explain:`<p><strong>Acquire</strong> = collect the raw artefact: the snapshot, the screenshot. <strong>Preserve</strong> = make tampering provable: hashing and the custody log are what make evidence admissible later. <strong>Analyse</strong> = derive meaning: timelines from CloudTrail, correlation between GuardDuty and flow logs. <strong>Report</strong> = present conclusions for decision-makers and legal. Hashing before analysis is the step teams most often skip — and the one that decides whether evidence survives challenge.</p>`},

{ id:'h18', type:'qcm', pts:2, theme:'proc', title:'Breach confirmed: who hears it first?',
  tags:['escalation','stakeholder comms','incident command'],
  scenario:`<p>04:30. Legal-grade breach confirmed: payroll data from hr-vault was exfiltrated. The incident commander must decide the first notification move.</p>`,
  question:`<p>Who is notified first?</p>`,
  ui:{label:'CHOOSE ONE',options:[
    {t:'Affected customers, by status page post'},
    {t:'The data-protection regulator, within the statutory window'},
    {t:'The internal IR team and legal counsel under privilege',correct:true},
    {t:'The whole engineering department, by wide chat channel'}
  ]},
  hint:'The people who own the next decisions — legal duties and facts — hear it before any audience.',
  explain:`<p>Internal escalation to the IR team and legal counsel comes first: they decide statutory windows, privilege, and messaging with the facts in hand. Customers and regulators follow on the timetable legal sets — early public words create liability and are often wrong by morning. A wide chat channel spreads unverified detail and leaks the incident itself. Sequencing comms is an incident-command skill, not an afterthought.</p>`},

{ id:'h19', type:'logview', pts:1, theme:'leak', title:'DNS and flow: the quiet uploader',
  tags:['DNS logs','VPC Flow Logs','exfiltration'],
  scenario:`<p>05:20. DLP raised nothing, but billing flags 8.4 GB of egress from the web tier overnight. You join DNS queries with VPC flow logs.</p>`,
  question:`<p>Filter as needed, then name the host to pull offline.</p>`,
  ui:{label:'LOG ANALYSIS — NAME THE HOST',
    lines:[
      '03:02:11 dns web-01 A cdn-assets[.]example 198[.]51[.]100[.]20',
      '03:02:14 flow web-01 -> 198[.]51[.]100[.]20:443 bytes 2200000 (tls)',
      '03:40:02 dns web-03 A logs-backup[.]example 185[.]199[.]108[.]153 (first seen, NXDOMAIN 02:59 then registered)',
      '03:40:03 flow web-03 -> 185[.]199[.]108[.]153:443 bytes 8410000 (tls)',
      '03:41:00 flow web-03 -> 185[.]199[.]108[.]153:443 bytes 8395000 (tls)',
      '03:52:30 dns web-02 A api-internal[.]example 10[.]0[.]7[.]5',
      '04:01:44 flow web-02 -> 10[.]0[.]7[.]5:5432 bytes 98000 (db)',
      '04:15:09 dns bastion A patch-mirror[.]example 198[.]51[.]100[.]99'
    ],
    inner:{type:'fill',text:'web-01 and web-02 talk only to known endpoints — CDN, internal API, database. The outlier is {0}: it resolved a brand-new domain that did not exist yesterday and pushed ~16.8 MB in two sustained TLS sessions to 185[.]199[.]108[.]153. That domain-host pair goes on the blocklist, the host is isolated with a forensic snapshot, and the egress destination is reported.',
      bank:['web-03','web-01','web-02','bastion','db-01'],
      correct:['web-03']}},
  hint:'One host resolved a domain that did not exist the day before — and then talked to it twice, steadily.',
  explain:`<p>web-01 and web-02 speak to known, expected endpoints. <code>web-03</code> resolved <code>logs-backup[.]example</code> — first-seen yesterday, NXDOMAIN the hour before registration, a fresh-domain signature — then sustained two large TLS uploads. Volume plus novelty plus persistence is exfiltration pattern, not patch traffic. The bastion's patch-mirror lookup is a known mirror. Isolate the host, snapshot before shutdown, and block the domain-host pair.</p>`},

{ id:'h20', type:'branch', pts:4, theme:'esc', title:'Branching: the miner on the billing node',
  tags:['cryptojacking','containment','user data'],
  scenario:`<p>06:00. Finance flags spend. Host <code>bill-node-07</code> runs 98% CPU on a process called <code>kdevtmpfsi</code>. GuardDuty: Runtime/CryptoMining.</p>`,
  question:`<p>Work the branch.</p>`,
  ui:{label:'BRANCHING SCENARIO — CHOOSE ONE OPTION PER STEP',
    nodes:[
      {q:'First physical move on the host?',opts:[
        {t:'Isolate via security group, snapshot memory and disk, then stop the instance',ok:true,fb:'Snapshot before stop keeps volatile evidence; the SG cut stops the miner talking home while you work.'},
        {t:'Terminate the instance immediately',ok:false,fb:'Terminate destroys the evidence trail and the attacker\u2019s footprint analysis in one click.'},
        {t:'Kill the miner process and watch CPU',ok:false,fb:'User-data or cron persistence respawns it in minutes — and you just tipped the attacker.'}]},
      {q:'Snapshot analysis: the miner returns at boot. Where is it hiding?',opts:[
        {t:'EC2 user-data script re-downloads it at every start',ok:true,fb:'User-data holds a curl-pipe-bash line pulling the miner — persistence outside the OS image.'},
        {t:'The AMI itself is infected and must be recalled',ok:false,fb:'The AMI is clean — the payload rides in user-data, which the image never contains.'},
        {t:'A cron job planted by root',ok:false,fb:'No cron entry exists. The respawn stops when user-data is cleared.'}]},
      {q:'How did the attacker get in, given CloudTrail shows no key abuse?',opts:[
        {t:'An exposed management port with a weak credential on the node',ok:true,fb:'SSH on 0[.]0[.]0[.]0 with password auth enabled; auth.log shows the spray-then-success pattern from 03:11.'},
        {t:'A leaked IAM access key',ok:false,fb:'No anomalous API use exists — the entry was at the OS layer, not the control plane.'},
        {t:'The provider\'s hypervisor was breached',ok:false,fb:'No provider-side indicators; the evidence is local. Assume the simple path first.'}]},
      {q:'Eradication and recovery — the right sequence?',opts:[
        {t:'Rebuild from a clean image, fix user-data, close SSH to the bastion path, rotate the host credential',ok:true,fb:'Rebuild removes unknown leftovers; the fixes close the entry path so recovery is not a relaunch of the incident.'},
        {t:'Delete the miner file and restart the node',ok:false,fb:'You never found all persistence mechanisms; the miner returns and the attacker still holds the credential.'},
        {t:'Recover first, investigate root cause next sprint',ok:false,fb:'Recovery without eradication re-opens the same door within hours.'}]}
    ]},
  hint:'Evidence before stop; persistence often lives outside the OS; entry paths are usually the boring exposed one.',
  explain:`<p>Cryptojacking response: isolate and snapshot <em>before</em> stopping, because volatile evidence dies with the VM. If the miner respawns at boot, look at user-data — persistence can live outside the OS entirely. With no control-plane anomalies, the entry is at the host layer, here exposed SSH with a sprayed password. Recovery is rebuild-plus-fix: clean image, corrected user-data, SSH behind the bastion, rotated credentials — otherwise recovery simply relaunches the incident.</p>`},

{ id:'h21', type:'match', pts:5, theme:'det', title:'Log gaps: what each absence hides',
  tags:['log sources','coverage gaps','detection engineering'],
  scenario:`<p>Detection-coverage review. For each missing source, match the attack it would have missed.</p>`,
  question:`<p>Pair each gap with what it hides.</p>`,
  ui:{label:'MATCHING — PAIR LEFT WITH RIGHT',
    pairs:[
      {l:'No CloudTrail data events',r:'Bulk GetObject from hr-vault goes unseen'},
      {l:'No VPC Flow Logs',r:'The quiet TLS uploader to a fresh domain is invisible'},
      {l:'No EDR on the fleet',r:'The macro dropper and miner never appear'},
      {l:'No identity sign-in logs',r:'Impossible travel and MFA-fatigue stay silent'},
      {l:'No billing anomaly alerts',r:'The cryptojacking cost spike surfaces only at invoice time'}
    ]},
  hint:'API theft, network theft, host theft, identity theft, money theft — one source each.',
  explain:`<p>Each gap is a blind spot with a name: management-plane events need <strong>CloudTrail</strong> (its data-event tier is what sees object reads); network paths need <strong>flow logs</strong>; host behaviour needs <strong>EDR</strong>; identity abuse needs <strong>sign-in logs</strong>; and economic impact needs <strong>billing alerts</strong>. Coverage reviews ask exactly this question per source: which attack becomes invisible if this feed dies? That is how you justify the logging bill.</p>`},

{ id:'h22', type:'order', pts:6, theme:'con', title:'Forensic acquisition, volatile first',
  tags:['order of volatility','forensics','acquisition'],
  scenario:`<p>The bill-node-07 disk will be imaged for legal. Order the acquisition by volatility — lose nothing you cannot get back.</p>`,
  question:`<p>Drag into acquisition order (most volatile first).</p>`,
  ui:{label:'DRAG TO REORDER — MOST VOLATILE FIRST',axis:'Order of volatility: what dies first goes first',
    items:[
      {id:'f1',l:'Disk image of the instance store'},
      {id:'f2',l:'Memory capture with a live-response tool'},
      {id:'f3',l:'Archive of application and auth logs'},
      {id:'f4',l:'Snapshot of network state and open sockets'},
      {id:'f5',l:'Export of CloudTrail and provider-side logs'},
      {id:'f6',l:'Final evidence inventory with hashes and custody log'}
    ],
    correct:['f2','f4','f1','f3','f5','f6']},
  hint:'RAM dies at power-off, sockets die at disconnect, disk survives, logs survive longer, exports last.',
  explain:`<p>Order of volatility: <strong>memory</strong> first — it dies at power-off and holds keys, injected code and socket state. <strong>Network state</strong> next — connections vanish on isolation. Then the <strong>disk image</strong>, then <strong>host logs</strong>, then <strong>provider-side logs</strong> which persist independently, and finally the <strong>inventory with hashes</strong> that binds it all into evidence. Capturing disk before memory is the classic irreversible mistake.</p>`},

{ id:'h23', type:'fill', pts:5, theme:'proc', title:'Privileged-access policy sentences',
  tags:['break-glass','JIT access','PAM','policy'],
  scenario:`<p>After the escalation incidents, the CISO wants the privileged-access section written. Complete it.</p>`,
  question:`<p>Fill the five blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'Policy PA-1: Standing admin rights are abolished. Admin access is granted {0} and expires automatically after four hours. A single {1} account exists for platform down-times; its use requires two-person approval, triggers a high-priority alert, and is {2} after every activation. All privileged sessions run through the {3} platform with session recording. Quarterly access reviews {4} every admin entitlement against the current org chart.',
    bank:['just-in-time','break-glass','reviewed','PAM','reconciled','archived'],
    correct:['just-in-time','break-glass','reviewed','PAM','reconciled']},
  hint:'Temporary grants, an emergency account, eyes on every use, a broker in the middle, and audits that compare rights with reality.',
  explain:`<p>Just-in-time grants remove the standing admin power that every escalation incident exploited. The <strong>break-glass</strong> account exists for real emergencies only — two-person approval plus after-use review keeps it honest. Routing sessions through the <strong>PAM</strong> broker adds recording and one place to revoke. Quarterly reviews <strong>reconcile</strong> entitlements against the org chart, catching the leaver accounts and privilege creep that audits keep finding.</p>`},

{ id:'h24', type:'qcm', pts:2, theme:'esc', title:'The control that would have prevented it',
  tags:['preventive control','root cause','least privilege'],
  scenario:`<p>The leaked lambda key was able to attach AdministratorAccess to a role it did not own. Detection worked; GuardDuty fired in 4 minutes. The CISO asks the harder question: which control would have <em>prevented</em> the escalation?</p>`,
  question:`<p>Which one?</p>`,
  ui:{label:'CHOOSE ONE',options:[
    {t:'A GuardDuty finding routed to a faster on-call rota'},
    {t:'A permission boundary denying iam:AttachRolePolicy on the lambda role',correct:true},
    {t:'Daily rotation of the lambda access key'},
    {t:'Hourly CloudTrail exports to the SIEM'}
  ]},
  hint:'Prevention means the harmful API call fails — not that humans react faster to it.',
  explain:`<p>A permission boundary makes the <code>AttachRolePolicy</code> call <em>fail</em>, whatever the key can reach — that is prevention. Faster on-call and hourly exports are detection improvements: the attacker still escalates, you just react sooner. Key rotation narrows the leak window but a stolen key used within minutes still succeeds. The CISO's point: for every incident, name the control that makes the attack impossible, not just the one that makes it visible.</p>`},
{ id:'h25', type:'bucket', pts:6, theme:'det', title:'Signal fidelity: strong, weak, or noise',
  tags:['signal fidelity','alert tuning','triage'],
  scenario:`<p>Detection tuning workshop. Six signals from last week — sort them so analysts trust the queue again.</p>`,
  question:`<p>Drag each signal to its fidelity class.</p>`,
  ui:{label:'DRAG EACH SIGNAL TO ITS CLASS',
    items:[
      {id:'w1',l:'New access key created and used from two countries within 5 minutes'},
      {id:'w2',l:'Single failed login for one user at a normal hour'},
      {id:'w3',l:'Runtime crypto-mining finding with the matching binary hash'},
      {id:'w4',l:'Login from a new city, same country, mobile carrier IP'},
      {id:'w5',l:'Root account sign-in without MFA at 03:30'},
      {id:'w6',l:'CPU spike every Monday 09:00 — weekly backup window'}
    ],
    buckets:[
      {id:'strong',l:'Strong signal — act'},
      {id:'weak',l:'Weak signal — enrich'},
      {id:'noise',l:'Noise — tune away'}
    ],
    correct:{w1:'strong',w2:'noise',w3:'strong',w4:'weak',w5:'strong',w6:'noise'}},
  hint:'Root without MFA and live abuse = act. Travel-ish and new-city = ask questions. Predictable patterns = tune.',
  explain:`<p><strong>Strong:</strong> the two-country key lifecycle is an attack in one sentence; the hash-confirmed miner is proof, not pattern; root without MFA breaches a hard control. <strong>Weak:</strong> the new-city login is plausible travel — enrich with device and behaviour before acting. <strong>Noise:</strong> one failed login at a normal hour, and a CPU spike that repeats exactly on the backup window, are patterns to tune or ticket away. Fidelity sorting keeps the queue credible.</p>`},

{ id:'h26', type:'multi', pts:3, theme:'det', title:'Insider or stolen session?',
  tags:['evidence weighing','compromised account','attribution'],
  scenario:`<p>hr-vault exfiltration, suspect <code>j.moreau</code>. Five evidence items on the table. Which of them point to a <em>compromised account</em> rather than the user acting?</p>`,
  question:`<p>Select <strong>all</strong> items that favour a stolen/compromised account.</p>`,
  ui:{label:'SELECT ALL THAT APPLY',options:[
    {t:'Sign-ins arrive through a Tor exit node the user never used before',correct:true},
    {t:'Files accessed match the user\'s own project scope'},
    {t:'EDR on her laptop reports an infostealer variant',correct:true},
    {t:'A new MFA device was registered at 03:12 while she was asleep',correct:true},
    {t:'She opened the payroll dashboard twice last week for her team report'}
  ]},
  hint:'Infrastructure the person never touches, malware on their endpoint, and identity changes while they sleep.',
  explain:`<p>Tor sign-ins from an identity with no Tor history, an infostealer on the user's own laptop, and an MFA registration at 03:12 while she sleeps all describe an attacker holding her identity — not the person. The two other items cut the other way: accesses matching her project scope and recent legitimate dashboard use fit normal behaviour, which is exactly why attribution needs this weighing instead of a single alert. Containment treats the account as hostile either way; the evidence decides the follow-up.</p>`},

{ id:'h27', type:'term', pts:2, theme:'leak', title:'Terminal: hunt hardcoded credentials',
  tags:['secret hunting','grep','sweep'],
  scenario:`<p>Containment check on <code>web-03</code>: the attacker may have stashed credentials anywhere under <code>/srv/app</code>. The incident commander wants the file list, fast.</p>`,
  question:`<p>Goal only, no tool is named: search the whole <code>/srv/app</code> tree for anything that looks like a hardcoded credential — key identifiers, passwords, tokens, private keys — and make sure the search reaches every subdirectory.</p>`,
  ui:{label:'TERMINAL — YOU CHOOSE THE TOOL AND FLAGS',
    prompt:'root@web-03:/srv',
    banner:['Secret-hunt console — web-03','Target: /srv/app tree, all subdirectories.','Type help for available commands.'],
    tasks:[
      {d:'Run a search that reaches the whole /srv/app tree recursively',rx:/(\bgrep\b[^;;&]*-[a-zA-Z]*r|\brg\b[^;;&]*|\bfind\b[^;;&]*-type\s+f)/i,eg:'grep -ri AKIA /srv/app'},
      {d:'Search for credential-shaped content (key ids, passwords, tokens, private keys)',rx:/AKIA|passw|secret|token|PRIVATE/i,eg:"grep -ri 'password' /srv/app"}
    ],
    fs:{
      '/srv/app/server.py':'import os\nAPI_KEY = os.environ["API_KEY"]\n',
      '/srv/app/deploy.sh':'#!/bin/bash\nAWS_ACCESS_KEY_ID=AKIA9F3EXAMPLE8KQ2\nAWS_SECRET_ACCESS_KEY=wJalrXUtnFEMIexampleKEY\nrsync -a ./dist/ backup@10[.]0[.]9[.]30:/srv/dist',
      '/srv/app/config.yaml':'db_host: 10[.]0[.]9[.]30\ndb_user: billing\ndb_password: "Pr0d!Sn0w2026"\ntimeout: 30',
      '/srv/app/README.md':'# Billing app\nDeploy with deploy.sh. Contact platform team for credentials.',
      '/srv/app/utils/math.py':'def add(a,b):\n    return a+b'
    }},
  hint:'Recursive, case-insensitive, and a pattern that names what credentials look like.',
  explain:`<p>A recursive, case-insensitive sweep such as <code>grep -riE 'AKIA|password|secret|token|PRIVATE KEY' /srv/app</code> walks every subdirectory and surfaces <code>deploy.sh</code> — holding a full AWS key pair in plain text — plus the database password in <code>config.yaml</code>. The env-var read in <code>server.py</code> is the correct pattern and shows up only as context. Every hit is now a rotation item: keys are burned the moment an attacker could read the tree.</p>`},

{ id:'h28', type:'fill', pts:4, theme:'proc', title:'Five whys to the real root cause',
  tags:['RCA','five whys','corrective action'],
  scenario:`<p>The review board rejects "the developer leaked the key" as a root cause. Complete the five-whys chain until it reaches a system truth.</p>`,
  question:`<p>Fill the four blanks.</p>`,
  ui:{label:'FILL THE BLANKS — WORD BANK',
    text:'Why did the attacker get in? A key was in public. Why was a key in public? Developers cannot ship without pasting secrets, because no {0} exists in the pipeline. Why is there no vault path? It was never in the definition of done, and no {1} block secrets at commit time. Why did it live 11 days? No {2} alerts on pushed secrets, and MTTD for leaked credentials was never measured. Corrective action: vault path, commit blocking, detection, and a {3} that tracks detection time for this incident class.',
