/* ================= shared exam engine ================= */
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pad2(n){return (n<10?'0':'')+n;}
function fmtT(t){return pad2(Math.floor(t/60))+':'+pad2(t%60);}
function r1(x){return Math.round(x*10)/10;}
function div(cls){var d=document.createElement('div');d.className=cls;return d;}
function fcls(f){return f==='ok'?'is-ok':(f==='bad'?'is-bad':'is-warn');}
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var TOTAL=CFG.minutes*60;
var S=null,TICK=null;

function initAns(q){
  switch(q.type){
    case 'qcm': return {sel:-1};
    case 'multi': return {sel:[]};
    case 'bucket': return {placed:{},selItem:null};
    case 'order': case 'rank': {
      var l,tr=0;
      do{ l=shuf(q.ui.items.map(function(it){return it.id;})); tr++; }
      while(tr<14 && q.ui.items.length>1 && l.join('|')===q.ui.correct.join('|'));
      return {list:l};
    }
    case 'match': return {pairs:{},selLeft:null};
    case 'fill': return {place:{},selWord:null};
    case 'spot': return {sel:[]};
    case 'logview': return {f:'',inner:initAns({type:q.ui.inner.type,ui:q.ui.inner})};
    case 'term': return {out:[],done:[],hist:[],cwd:'/'};
    case 'branch': return {step:0,choices:[]};
  }
  return {};
}
function views(q){
  var v={};
  if(q.type==='qcm'||q.type==='multi'){ v.opts=shuf(q.ui.options.map(function(_,i){return i;})); }
  if(q.type==='bucket'){ v.items=shuf(q.ui.items.map(function(it){return it.id;})); }
  if(q.type==='match'){ v.rights=shuf(q.ui.pairs.map(function(p){return p.r;})); v.lefts=shuf(q.ui.pairs.map(function(p){return p.l;})); }
  if(q.type==='fill'){ v.bank=shuf(q.ui.bank.slice()); }
  if(q.type==='logview'){ v.inner=views({type:q.ui.inner.type,ui:q.ui.inner}); }
  return v;
}
function newAttempt(){
  if(TICK){clearInterval(TICK);TICK=null;}
  S={order:shuf(EXAMS.map(function(_,i){return i;})),cur:0,tLeft:TOTAL,
     pauseManual:false,pauseCheck:false,finished:false,reported:false,finishWarned:false,
     ex:EXAMS.map(function(q){return {answered:false,checked:false,skipped:false,hintUsed:false,scored:null,ans:initAns(q)};}),
     disp:EXAMS.map(function(q){return views(q);})};
  S.cur=S.order[0];
}
/* ---------- timer: two independent pause reasons ---------- */
function startTimer(){
  TICK=setInterval(function(){
    if(!S||S.finished){return;}
    if(S.pauseManual||S.pauseCheck){timerUI();return;}
    if(S.tLeft<=0){S.tLeft=0;timerUI();if(!S.finishWarned){S.finishWarned=true;finishExam(true);}return;}
    S.tLeft--;
    if(S.tLeft<=0){S.tLeft=0;timerUI();finishExam(true);return;}
    timerUI();
  },1000);
}
function timerUI(){
  var t=$('#timer'); if(!t||!S){return;}
  t.textContent=fmtT(S.tLeft);
  t.classList.toggle('low',S.tLeft>0&&S.tLeft<=300);
  t.classList.toggle('frozen',S.pauseManual||S.pauseCheck||S.finished);
  var pf=$('#pause-flag'); if(!pf){return;}
  var msgs=[];
  if(S.pauseManual){msgs.push('Paused (manual)');}
  if(S.pauseCheck){msgs.push('Timer paused — review mode');}
  if(S.finished){msgs.push('Exam finished');}
  pf.hidden=(msgs.length===0);
  pf.textContent=msgs.join(' + ');
}
function togglePause(){
  if(!S||S.finished){return;}
  S.pauseManual=!S.pauseManual;
  var b=$('#btn-pause');
  b.textContent=S.pauseManual?'Resume':'Pause';
  b.setAttribute('aria-pressed',S.pauseManual?'true':'false');
  $('#pause-overlay').hidden=!S.pauseManual;
  var grid=$('#exam-grid');
  if(grid){
    if(S.pauseManual){grid.setAttribute('inert','');grid.setAttribute('aria-hidden','true');var rb=$('#btn-resume2');if(rb){rb.focus();}}
    else{grid.removeAttribute('inert');grid.removeAttribute('aria-hidden');}
  }
  timerUI();
}
/* ---------- navigation ---------- */
function navStatus(i){
  var st=S.ex[i];
  if(st.skipped){return 'skip';}
  if(st.scored){
    var f=st.scored.earned/st.scored.max;
    if(f>=0.999){return 'full';}
    if(f>0){return 'part';}
    return 'zero';
  }
  if(st.answered){return 'touched';}
  return 'idle';
}
function statusWord(i){
  var m={skip:'skipped — excluded from scoring',full:'checked, full credit',part:'checked, partial credit',zero:'checked, no credit',touched:'answered, not checked yet',idle:'not answered'};
  return m[navStatus(i)];
}
function renderNav(){
  var n=$('#navigator'); if(!n||!S){return;}
  var GLYPH={full:'✓',part:'±',zero:'✗',skip:'»',touched:'•'};
  n.innerHTML='';
  EXAMS.forEach(function(q,i){
    var b=document.createElement('button');
    b.type='button';
    var stt=navStatus(i);
    b.className='nav-btn '+stt+(i===S.cur?' cur':'');
    var g=GLYPH[stt];
    b.innerHTML=esc(String(i+1))+(g?'<span class="nav-glyph" aria-hidden="true">'+g+'</span>':'');
    b.setAttribute('aria-label','Exercise '+(i+1)+': '+q.title.replace(/<[^>]*>/g,'')+' — '+statusWord(i));
    b.addEventListener('click',function(){gotoEx(i);});
    n.appendChild(b);
  });
}
function gotoEx(i){ if(!S||S.finished){return;} S.cur=i; renderExercise(); }
function move(d){
  if(!S||S.finished){return;}
  if(d>0){S.pauseCheck=false;} /* only Next ends the Check-pause */
  var k=S.order.indexOf(S.cur),nk=k+d;
  if(nk<0){renderExercise();return;}
  if(nk>=S.order.length){
    if(window.confirm('This is the last exercise. Finish and grade the exam now?')){finishExam(false);}
    return;
  }
  S.cur=S.order[nk];
  renderExercise();
}
function progressUI(){
  if(!S){return;}
  var done=0;
  S.ex.forEach(function(st){ if(st.checked||st.skipped){done++;} });
  $('#progress-in').style.width=Math.round(done/EXAMS.length*100)+'%';
  var e=0,m=0;
  S.ex.forEach(function(st){ if(st.scored){e+=st.scored.earned;m+=st.scored.max;} });
  $('#score-chip').textContent='Score '+r1(e)+' / '+r1(m);
}
/* ---------- Check / Skip / Hint / Revise ---------- */
function onCheck(){
  if(!S||S.finished){return;}
  var i=S.cur,q=EXAMS[i],st=S.ex[i];
  if(q.type==='branch'&&st.ans.step<q.ui.nodes.length){return;}
  if(st.skipped){st.skipped=false;}
  st.answered=true;
  var res=V[q.type](q,st);
  var earned=res.frac*q.pts;
  if(st.hintUsed){earned*=0.9;}
  st.scored={frac:res.frac,earned:earned,max:q.pts,flags:res.flags,correct:res.correct,summary:summarize(q,st.ans)};
  st.checked=true;
  /* clear transient selection state so locked review shows only the answer marks */
  if(st.ans){st.ans.selItem=null;st.ans.selLeft=null;st.ans.selWord=null;}
  S.pauseCheck=true; /* Check-pause: timer frozen, content visible, only Next resumes */
  renderExercise(); progressUI(); renderNav(); timerUI();
}
function onSkip(){
  if(!S||S.finished){return;}
  S.ex[S.cur].skipped=true;
  S.ex[S.cur].answered=true;
  var k=S.order.indexOf(S.cur),nk=k+1;
  if(nk>=S.order.length){
    renderNav(); progressUI();
    if(window.confirm('This is the last exercise. Finish and grade the exam now?')){finishExam(false);}
    return;
  }
  S.cur=S.order[nk];
  renderExercise();
}
function onHint(q,st){
  if(st.hintUsed){return;}
  st.hintUsed=true;
  var h=$('#hintbox');
  h.hidden=false;
  h.innerHTML='<strong>Hint (costs 10% of this exercise):</strong> '+q.hint;
  var b=$('#btn-hint'); b.disabled=true; b.textContent='Hint used';
}
function onRevise(){
  var i=S.cur,q=EXAMS[i],st=S.ex[i];
  st.checked=false;
  if(q.type==='branch'||q.type==='term'){st.ans=initAns(q);}
  st.scored=null;
  renderExercise(); renderNav(); progressUI();
}
/* ---------- exercise rendering ---------- */
function block(label,cls,html){
  var d=div('blk '+cls);
  d.innerHTML='<div class="blk-label">'+label+'</div><div class="blk-body">'+html+'</div>';
  return d;
}
function renderExercise(){
  var i=S.cur,q=EXAMS[i],st=S.ex[i],box=$('#exercise');
  box.innerHTML='';
  var flags=(st.checked&&st.scored)?st.scored.flags:null;
  var head=div('ex-head');
  head.innerHTML='<div class="ex-no">Exercise '+(i+1)+' of '+EXAMS.length+' — '+esc(statusWord(i))+'</div>'+
    '<div class="ex-meta"><span class="theme-chip t-'+q.theme+'">'+THEMES[q.theme]+'</span>'+
    '<span class="type-chip">'+TYPELBL[q.type]+'</span><span class="pts-chip">'+q.pts+' pts</span></div>'+
    '<h2 class="ex-title">'+q.title+'</h2>'+
    '<div class="ex-tags">'+q.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div>';
  box.appendChild(head);
  if(st.skipped){
    var sk=div('notice warn');
    sk.innerHTML='<strong>Skipped — excluded from scoring.</strong> Answer, then press Check to include this exercise in your score.';
    box.appendChild(sk);
  }
  if(q.scenario){box.appendChild(block('SCENARIO','blk-scenario',q.scenario));}
  if(q.artifact){box.appendChild(block('ARTIFACTS','blk-artifact',q.artifact));}
  box.appendChild(block('QUESTION','blk-question',q.question));
  var ans=div('ans-area'+(st.checked?' locked':''));
  ans.innerHTML='<div class="ans-label">'+(q.ui.label||TYPELBL[q.type])+'</div>';
  var ab=div('ans-body'); ans.appendChild(ab);
  R[q.type](ab,q,st,flags,S.disp[i]);
  var hint=div('notice hint'); hint.id='hintbox'; hint.hidden=!st.hintUsed;
  if(st.hintUsed){hint.innerHTML='<strong>Hint (costs 10% of this exercise):</strong> '+q.hint;}
  ans.appendChild(hint);
  box.appendChild(ans);
  var fb=div('fb-area'); fb.hidden=!st.checked; fb.setAttribute('aria-live','polite');
  if(st.checked&&st.scored){fb.innerHTML=feedbackHTML(q,st);}
  box.appendChild(fb);
  var ctr=div('ctrl-row');
  ctr.innerHTML='<button type="button" id="btn-check" class="btn primary">Check</button>'+
    '<button type="button" id="btn-skip" class="btn ghost">Skip</button>'+
    '<button type="button" id="btn-hint" class="btn ghost"'+(st.hintUsed?' disabled':'')+'>Hint −10%</button>'+
    '<span class="spacer"></span>'+
    '<button type="button" id="btn-prev" class="btn ghost">Prev</button>'+
    '<button type="button" id="btn-next" class="btn primary2">Next</button>'+
    (st.checked?'<button type="button" id="btn-revise" class="btn ghost">Revise</button>':'');
  box.appendChild(ctr);
  wireControls(q,st);
  renderNav(); progressUI(); timerUI();
  box.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function wireControls(q,st){
  $('#btn-check').addEventListener('click',onCheck);
  $('#btn-skip').addEventListener('click',onSkip);
  $('#btn-hint').addEventListener('click',function(){onHint(q,st);});
  $('#btn-prev').addEventListener('click',function(){move(-1);});
  $('#btn-next').addEventListener('click',function(){move(1);});
  var rv=$('#btn-revise'); if(rv){rv.addEventListener('click',onRevise);}
  if(st.checked){
    var hb=$('#btn-hint');
    hb.disabled=true; hb.title='Hint is only available before Check';
  }
  if(q.type==='branch'&&st.ans.step<q.ui.nodes.length){
    var bc=$('#btn-check'); bc.disabled=true; bc.title='Finish the scenario first'; bc.setAttribute('aria-disabled','true');
  }
  if(q.type==='term'&&st.checked){var ti=$('#term-in'); if(ti){ti.disabled=true;}}
}
function feedbackHTML(q,st){
  var sc=st.scored;
  var lbl=sc.earned>=sc.max-0.001?'full':(sc.earned>0?'partial':'zero');
  var html='<div class="fb-sum"><span class="badge b-'+lbl+'">'+(lbl==='full'?'Full credit':(lbl==='partial'?'Partial credit':'No credit'))+'</span> '+
    '<strong>You earned '+r1(sc.earned)+' / '+r1(sc.max)+' points</strong>'+
    (st.hintUsed?' <span class="hintnote">(includes −10% hint cost)</span>':'')+'</div>';
  var fl=sc.flags||{},keys=Object.keys(fl);
  if(keys.length){
    html+='<div class="fb-marks">'+keys.map(function(k){
      var f=fl[k];
      var ic=f==='ok'?'✓':(f==='bad'?'✗':'▲');
      var w=f==='ok'?'Correct':(f==='bad'?'Wrong':'Missed');
      return '<span class="mark m-'+f+'">'+ic+' '+esc(k)+' — '+w+'</span>';
    }).join('')+'</div>';
  }
  if(sc.correct){html+='<div class="fb-correct"><div class="fb-correct-h">CORRECT ANSWER</div>'+sc.correct+'</div>';}
  html+='<div class="fb-explain"><div class="fb-explain-h">WHY</div>'+q.explain+'</div>';
  return html;
}
/* ================= renderers (R) and validators (V) ================= */
var R={},V={};

/* ----- single-choice ----- */
R.qcm=function(ab,q,st,flags,d){
  var an=st.ans;
  d.opts.forEach(function(oi,pos){
    var o=q.ui.options[oi];
    var flab=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    var b=document.createElement('button'); b.type='button';
    b.className='opt'+(an.sel===oi?' sel':'');
    b.setAttribute('role','radio'); b.setAttribute('aria-checked',an.sel===oi?'true':'false');
    b.innerHTML='<span class="opt-key">'+String.fromCharCode(65+pos)+'</span><span>'+o.t+'</span>';
    if(flags&&flags[flab]){b.classList.add(flags[flab]==='ok'?'is-ok':'is-bad');}
    b.addEventListener('click',function(){
      if(st.checked){return;}
      an.sel=oi; st.answered=true;
      $$('.opt',ab).forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false');});
      b.classList.add('sel'); b.setAttribute('aria-checked','true');
    });
    ab.appendChild(b);
  });
};
V.qcm=function(q,st){
  var corr=-1,flags={};
  q.ui.options.forEach(function(o,i){ if(o.correct){corr=i;} });
  q.ui.options.forEach(function(o,i){
    var k=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    if(o.correct){flags[k]='ok';}
    else if(i===st.ans.sel){flags[k]='bad';}
  });
  return {frac:st.ans.sel===corr?1:0,flags:flags,
    correct:'<p>'+q.ui.options[corr].t+'</p>'};
};
R.multi=function(ab,q,st,flags,d){
  var an=st.ans;
  function isSel(oi){return an.sel.indexOf(oi)>=0;}
  d.opts.forEach(function(oi,pos){
    var o=q.ui.options[oi];
    var flab=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    var b=document.createElement('button'); b.type='button';
    b.className='opt'+(isSel(oi)?' sel':'');
    b.setAttribute('role','checkbox'); b.setAttribute('aria-checked',isSel(oi)?'true':'false');
    b.innerHTML='<span class="opt-key">'+(isSel(oi)?'✓':String.fromCharCode(65+pos))+'</span><span>'+o.t+'</span>';
    if(flags&&flags[flab]){var f=flags[flab]; if(f){b.classList.add(f==='ok'?'is-ok':(f==='bad'?'is-bad':'is-warn'));}}
    b.addEventListener('click',function(){
      if(st.checked){return;}
      var ix=an.sel.indexOf(oi);
      if(ix>=0){an.sel.splice(ix,1);}else{an.sel.push(oi);}
      st.answered=true;
      b.classList.toggle('sel',an.sel.indexOf(oi)>=0);
      b.setAttribute('aria-checked',an.sel.indexOf(oi)>=0?'true':'false');
      b.querySelector('.opt-key').textContent=an.sel.indexOf(oi)>=0?'✓':String.fromCharCode(65+pos);
    });
    ab.appendChild(b);
  });
};
V.multi=function(q,st){
  var flags={},hits=0,k=0;
  q.ui.options.forEach(function(o,i){
    var sel=st.ans.sel.indexOf(i)>=0;
    var kk=o.t.replace(/<[^>]*>/g,'').slice(0,34);
    if(o.correct){k++; if(sel){hits++;flags[kk]='ok';} else {flags[kk]='warn';}}
    else if(sel){flags[kk]='bad';}
  });
  var corr=q.ui.options.filter(function(o){return o.correct;}).map(function(o){return '<li>'+o.t+'</li>';}).join('');
  return {frac:k?hits/k:0,flags:flags,correct:'<ul>'+corr+'</ul>'};
};

/* ----- drag & drop: items into buckets ----- */
R.bucket=function(ab,q,st,flags,d){
  var ui=q.ui,an=st.ans;
  var bank=div('dd-bank'); bank.dataset.bid='__bank';
  bank.innerHTML='<div class="dd-bank-h">ITEMS — DRAG OR CLICK TO PLACE (click here to send a selected item back)</div>';
  var zones=div('dd-buckets');
  function itemEl(it){
    var b=document.createElement('button'); b.type='button'; b.className='dd-item'; b.draggable=!st.checked;
    b.dataset.iid=it.id; b.textContent=it.l;
    if(flags&&flags[it.l]){b.classList.add(fcls(flags[it.l]));}
    b.addEventListener('click',function(e){
      e.stopPropagation();
      if(st.checked){return;}
      var wasSel=b.classList.contains('sel');
      $$('.dd-item',ab).forEach(function(x){x.classList.remove('sel');});
      if(wasSel){an.selItem=null;}
      else{b.classList.add('sel');an.selItem=it.id;}
      st.answered=true;
    });
    b.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',it.id);});
    return b;
  }
  function place(iid,bid){
    if(bid==='__bank'){delete an.placed[iid];}
    else{an.placed[iid]=bid;}
    an.selItem=null; st.answered=true; draw();
  }
  function draw(){
    $$('.dd-zone',ab).forEach(function(z){z.innerHTML='';});
    $$('.dd-item',ab).forEach(function(x){x.remove();});
    d.items.forEach(function(iid){
      var it=ui.items.filter(function(x){return x.id===iid;})[0];
      var bid=an.placed[iid]||'__bank';
      var host=bid==='__bank'?bank:ab.querySelector('.dd-zone[data-bid="'+bid+'"]');
      host.appendChild(itemEl(it));
    });
    $$('.dd-zone',ab).forEach(function(z){
      if(!z.children.length){z.innerHTML='<span class="dd-hint">drop here</span>';}
    });
  }
  ui.buckets.forEach(function(bu){
    var col=div('dd-bucket');

function hlLog(s){

  return '<div class="'+cls+'">'+h+'</div>';

/* ----- terminal ----- */
function tOut(an,lines){Array.prototype.push.apply(an.out,lines);if(an.out.length>400){an.out.splice(0,an.out.length-400);}}
function tResolve(cwd,p){
  if(!p){return '/';}
  var full=p.charAt(0)==='/'?p:(cwd==='/'?'':cwd)+'/'+p;
  var st2=[];
  full.split('/').forEach(function(s){if(!s||s==='.'){return;}if(s==='..'){st2.pop();}else{st2.push(s);}});
  return '/'+st2.join('/');
}
function tList(fs,dir){
  var pre=dir==='/'?'/':dir+'/'; var seen={},out=[];
  Object.keys(fs).forEach(function(k){
    if(k.indexOf(pre)!==0){return;}
    var rest=k.slice(pre.length); if(!rest){return;}
    var seg=rest.split('/')[0];
    if(seen[seg]){return;}
    seen[seg]=1;
    out.push(rest.indexOf('/')>=0?seg+'/':seg);
  });
  return out.sort();
}
function tGlobRe(g){g=g.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.');return new RegExp('^'+g+'$');}
function termExec(q,an,raw,echo){
  var fs=q.ui.fs,out=an.out,cwd=an.cwd||'/';
  if(echo!==false){out.push({t:'$ '+raw,c:'t-prompt'});}
  var line=raw.trim(); if(!line){return;}
  an.hist.push(line);
  var redir=null,m=line.match(/\s>\s*(\S+)\s*$/);
  if(m){redir=m[1];line=line.slice(0,m.index).trim();}
  if(line==='clear'){out.length=0;return;}
  var toks=line.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g)||[];
  var cmd=toks[0],args=toks.slice(1);
  if(cmd==='sudo'){if(args.length){cmd=args[0];args=args.slice(1);}else{tOut(an,['usage: sudo &lt;command&gt;']);return;}}
  var flagsStr='';
  while(args.length&&args[0].charAt(0)==='-'&&args[0].length>1){flagsStr+=args[0];args=args.slice(1);}
  function fpath(p){return tResolve(cwd,p);}
  function isDir(p){var pre=p==='/'?'/':p+'/';var any=false;Object.keys(fs).forEach(function(k){if(k.indexOf(pre)===0){any=true;}});return any;}
  function readFile(p){
    if(fs[p]!==undefined){return {ok:true,lines:fs[p].split('\n'),name:p};}
    return {ok:false};
  }
  switch(cmd){
    case 'help':
      tOut(an,['Built-in commands: help, ls, cd, pwd, cat, grep, find, ps, ss, netstat, lsof, last, history, whoami, echo, clear',
               'This host also has the standard inspection tools you would expect on a cloud VM.']);
      break;
    case 'pwd': tOut(an,[cwd]); break;
    case 'whoami': tOut(an,[q.ui.whoami||'ec2-user']); break;
    case 'cd': an.cwd=fpath(args[0]||'/'); break;
    case 'ls': {
      var dir=fpath(args[0]||cwd);
      var l=tList(fs,dir);
      tOut(an,l.length?l:['(empty)']);
      break;
    }
    case 'cat': {
      if(!args.length){tOut(an,['usage: cat FILE']);break;}
      var rf=readFile(fpath(args[0]));
      tOut(an,rf.ok?rf.lines:['cat: '+args[0]+': No such file or directory']);
      break;
    }
    case 'echo': tOut(an,[args.join(' ')]); break;
    case 'history': tOut(an,an.hist.map(function(h,i){return pad2(i+1)+'  '+h;})); break;
    case 'ps': tOut(an,(q.ui.ps||'PID TTY TIME CMD\n1 ? 00:00:01 systemd').split('\n')); break;
    case 'ss': case 'netstat': {
      if(/l/i.test(flagsStr)||/l/i.test(line)){
        tOut(an,(q.ui.netstat||'No listening sockets.').split('\n'));
      } else { tOut(an,['usage: '+cmd+' -tulnp   (try the listening/numeric flags)']); }
      break;
    }
    case 'lsof': {
      if(/i/i.test(flagsStr)){tOut(an,(q.ui.netstat||'No open sockets.').split('\n'));}
      else{tOut(an,['usage: lsof -i']);}
      break;
    }
    case 'last': tOut(an,(q.ui.last||'no login records').split('\n')); break;
    case 'grep': {
      if(!args.length){tOut(an,['usage: grep [-i] [-r] [-n] PATTERN FILE|DIR']);break;}
      var pat=args[0].replace(/^["']|["']$/g,'');
      var targets=args.slice(1);
      var ci=/i/i.test(flagsStr),rec=/r/i.test(flagsStr),num=/n/i.test(flagsStr);
      var res=[];
      try{
        var re=new RegExp(ci?pat:pat,ci?'i':'');
        if(rec){
          targets.forEach(function(t){
            var base=fpath(t); var pre=base==='/'?'/':base+'/';
            Object.keys(fs).forEach(function(k){
              if(k.indexOf(pre)!==0){return;}
              fs[k].split('\n').forEach(function(ln,ix){
                if(re.test(ln)){res.push(k+':'+(num?(ix+1)+':':'')+ln);}
              });
            });
          });
        } else {
          targets.forEach(function(t){
            var rf2=readFile(fpath(t));
            if(rf2.ok){rf2.lines.forEach(function(ln,ix){if(re.test(ln)){res.push((num?(ix+1)+':':'')+ln);}});}
            else{res.push('grep: '+t+': No such file or directory');}
          });
        }
        tOut(an,res.length?res:['(no matches)']);
      }catch(e){tOut(an,['grep: bad pattern']);}
      break;
    }
    case 'find': {
      var di=args[0]?fpath(args[0]):cwd;
      var ni=-1; args.forEach(function(a,i){if(a==='-name'){ni=i;}});
      var pre2=di==='/'?'/':di+'/'; var found=[];
      if(ni>=0&&args[ni+1]){
        var gre=tGlobRe(args[ni+1].replace(/^["']|["']$/g,''));
        Object.keys(fs).forEach(function(k){
          if(k.indexOf(pre2)!==0){return;}
          var base=k.slice(pre2.length).split('/').pop();
          if(gre.test(base)){found.push(k);}
        });
      } else {
        Object.keys(fs).forEach(function(k){if(k.indexOf(pre2)===0&&fs[k]!==undefined){found.push(k);}});
      }
      tOut(an,found.length?found.sort():['(no results)']);
      break;
    }
    default: tOut(an,[{s:cmd}.s+': command not found']);
  }
  if(redir){out.push({t:'[output written to '+redir+']',c:'t-sys'});}
}

  if(!an.out.length){tOut(an,ui.banner||[]);}
  drawOut(); drawTasks();
  inEl.addEventListener('keydown',function(e){
    if(e.key!=='Enter'){return;}
    var raw=inEl.value; if(!raw.trim()){return;}
    inEl.value='';
    if(st.checked){return;}
    termExec(q,an,raw);
    ui.tasks.forEach(function(t,ix){
      if(an.done.indexOf(ix)<0&&t.rx.test(raw)){
        an.done.push(ix);
        an.out.push({t:'[task] ✓ goal met: '+t.d,c:'t-sys'});
      }
    });
    drawOut(); drawTasks();
    st.answered=true;
  });
  term.addEventListener('click',function(){if(!st.checked){inEl.focus();}});
};
V.term=function(q,st){
  var an=st.ans,n=q.ui.tasks.length;
  var flags={},corr=[];
  q.ui.tasks.forEach(function(t,ix){
    if(an.done.indexOf(ix)>=0){flags['Task '+(ix+1)]='ok';}
    else{flags['Task '+(ix+1)]='warn';}
    corr.push('<li>'+t.d+' — e.g. <code>'+t.eg+'</code></li>');
  });
  return {frac:n?an.done.length/n:0,flags:flags,correct:'<ul>'+corr.join('')+'</ul>'};
};

/* ----- branching scenario ----- */
R.branch=function(ab,q,st,flags){
  var ui=q.ui,an=st.ans;
  if(an.choices.length){
    var dl=div('br-done');
    dl.innerHTML=an.choices.map(function(ch,ix){
      var nd=ui.nodes[ix],o=nd.opts[ch];
      var fl=flags?flags['Decision '+(ix+1)]:null;
      var cls=fl?(fl==='ok'?' ok':' bad'):'';
      return '<div class="br-line'+cls+'">'+(fl?(fl==='ok'?'✓':'✗'):'▸')+' Decision '+(ix+1)+': '+esc(o.t)+(an.choices.length>ix+1||st.checked?'':' (current)')+'</div>';
    }).join('');
    ab.appendChild(dl);
  }
  if(an.step>=ui.nodes.length){
    ab.appendChild(function(){var x=div('notice ok');x.innerHTML='Path complete. Press <strong>Check</strong> to review each decision.';return x;}());
    return;
  }
  var nd=ui.nodes[an.step];
  ab.appendChild(function(){var x=div('br-step');x.textContent='DECISION '+(an.step+1)+' OF '+ui.nodes.length;return x;}());
  var qq=div('br-q'); qq.innerHTML=nd.q; ab.appendChild(qq);
  nd.opts.forEach(function(o,oi){
    var b=document.createElement('button'); b.type='button'; b.className='br-opt';
    b.innerHTML='<span>►</span><span>'+o.t+'</span>';
    b.addEventListener('click',function(){
      if(st.checked){return;}
      an.choices[an.step]=oi; an.step++; st.answered=true; renderExercise();
    });
    ab.appendChild(b);
  });
  if(an.step>0&&an.choices[an.step-1]!==undefined){
    var fb=div('br-fb'); fb.innerHTML=ui.nodes[an.step-1].opts[an.choices[an.step-1]].fb;
    ab.appendChild(fb);
  }
};
V.branch=function(q,st){
  var ui=q.ui,flags={},hits=0,n=ui.nodes.length,corr=[];
  ui.nodes.forEach(function(nd,ix){
    var ch=st.ans.choices[ix],ok=nd.opts.filter(function(o){return o.ok;})[0];
    if(ch!==undefined&&nd.opts[ch].ok){hits++;flags['Decision '+(ix+1)]='ok';}
    else if(ch!==undefined){flags['Decision '+(ix+1)]='bad';}
    else{flags['Decision '+(ix+1)]='warn';}
    corr.push('<li>'+ok.t+'</li>');
  });
  return {frac:n?hits/n:0,flags:flags,correct:'<ul>'+corr.join('')+'</ul>'};
};

/* ================= summaries for the report ================= */
function summarize(q,ans){
  function ot(i){return q.ui.options[i].t.replace(/<[^>]*>/g,'');}
  switch(q.type){
    case 'qcm': return ans.sel>=0?ot(ans.sel):'—';
    case 'multi': return ans.sel.length?ans.sel.map(ot).join('; '):'—';
    case 'bucket': {
      var bl={};q.ui.buckets.forEach(function(b){bl[b.id]=b.l;});
      return q.ui.items.filter(function(it){return ans.placed[it.id];}).map(function(it){return it.l+' → '+bl[ans.placed[it.id]];}).join('; ')||'nothing placed';
    }
    case 'order': case 'rank': return ans.list.map(function(iid){return q.ui.items.filter(function(x){return x.id===iid;})[0].l;}).join(' → ');
    case 'match': return Object.keys(ans.pairs).map(function(l){return l+' = '+ans.pairs[l];}).join('; ')||'no pairs';
    case 'fill': return Object.keys(ans.place).map(function(b){return 'blank '+(+b+1)+': '+ans.place[b];}).join('; ')||'blanks left empty';
    case 'spot': return ans.sel.length?ans.sel.map(function(i){return 'line '+(i+1);}).join(', '):'no line clicked';
    case 'logview': return summarize({type:q.ui.inner.type,ui:q.ui.inner},ans.inner);
    case 'term': return ans.done.length+' of '+q.ui.tasks.length+' goals met';
    case 'branch': return ans.choices.map(function(c,ix){return q.ui.nodes[ix].opts[c].t;}).join(' › ')||'path not finished';
  }
  return '—';
}
/* ================= results, grading, reporting ================= */
function gradeSilent(q,st){
  var res=V[q.type](q,st);
  var earned=res.frac*q.pts;
  if(st.hintUsed){earned*=0.9;}
  st.scored={frac:res.frac,earned:earned,max:q.pts,flags:res.flags,correct:res.correct,summary:summarize(q,st.ans)};
  st.checked=true;
}
function finishExam(auto){
  if(!S){return false;}
  if(S.finished){showResults();return true;}
  S.ex.forEach(function(st,i){ if(!st.skipped&&!st.scored){gradeSilent(EXAMS[i],st);} });
  var poss=0,earn=0,skipped=[];
  S.ex.forEach(function(st,i){
    if(st.skipped){skipped.push(i);return;}
    poss+=EXAMS[i].pts; earn+=st.scored.earned;
  });
  if(poss<=0){
    var w=div('notice warn');
    w.innerHTML='<strong>All exercises are skipped.</strong> Answer at least one exercise before finishing — skipped exercises are excluded from scoring.';
    var ex=$('#scr-exam #exercise');
    ex.insertBefore(w,ex.firstChild);
    window.scrollTo(0,0);
    return false;
  }
  S.finished=true;
  if(TICK){clearInterval(TICK);TICK=null;}
  var fe=Math.round(earn),ft=Math.round(poss),pct=Math.round(fe/ft*100);
  S.result={fe:fe,ft:ft,pct:pct,pass:pct>=CFG.passMark,skipped:skipped};
  progressUI(); /* refresh the score chip so the topbar matches the graded result */
  timerUI();
  showResults();
  return true;
}
function labelFor(st){
  if(st.skipped){return '<span class="badge b-skip">Skipped — excluded</span>';}
  var f=st.scored.earned/st.scored.max;
  if(f>=0.999){return '<span class="badge b-full">Full</span>';}
  if(f>0){return '<span class="badge b-partial">Partial</span>';}
  return '<span class="badge b-zero">Zero</span>';
}
function showResults(){
  var r=S.result,box=$('#scr-results');
  $('#scr-exam').hidden=true; $('#scr-intro').hidden=true; box.hidden=false;
  var greet=r.pass?'Well done'+(CFG.username?', '+esc(CFG.username):'')+'!':'Retake needed'+(CFG.username?', '+esc(CFG.username):'')+'.';
  var html='<div class="res-hero '+(r.pass?'pass':'fail')+'">'+
    '<div class="res-sub">'+esc(CFG.certName)+' — '+esc(CFG.chapterName)+' — '+CFG.severity+'</div>'+
    '<div class="res-pct" id="res-pct">0%</div>'+
    '<div class="res-sub"><strong id="res-raw">0 / '+r.ft+' points</strong> — pass mark '+CFG.passMark+'% — graded over '+r.ft+' points of answered exercises</div>'+
    '<h2>'+(r.pass?'PASS — certificate-style result':'FAIL — you must retake this exam')+'</h2>'+
    '<div class="res-sub">'+greet+(r.pass?' You mastered this incident-response drill.':' Review the report below, then press Retake Exam.')+'</div>'+
    '</div>';
  if(r.skipped.length){
    html+='<div class="res-sec"><h3>Skipped exercises — excluded from scoring</h3><p class="res-sub">These were not counted in either the earned points or the total: exercises '+
      r.skipped.map(function(i){return '#'+(i+1);}).join(', ')+'. Their explanations still appear below so you can learn from them.</p></div>';
  }
  /* per-theme progress */
  var tm={};
  EXAMS.forEach(function(q,i){
    var st=S.ex[i];
    if(st.skipped){return;}
    if(!tm[q.theme]){tm[q.theme]={e:0,m:0};}
    tm[q.theme].e+=st.scored.earned; tm[q.theme].m+=q.pts;
  });
  html+='<div class="res-sec"><h3>Progress by theme</h3>';
  Object.keys(tm).forEach(function(t){
    var pc=Math.round(tm[t].e/tm[t].m*100);
    html+='<div class="theme-bar"><div class="tb-name">'+THEMES[t]+'</div><div class="tb-track"><div class="tb-fill" style="width:'+pc+'%"></div></div><div class="tb-val">'+pc+'%</div></div>';
  });
  html+='</div>';
  html+='<div class="res-sec"><h3>Detailed report — every exercise</h3>';
  EXAMS.forEach(function(q,i){
    var st=S.ex[i];
    var pts=st.skipped?'—':r1(st.scored.earned)+' / '+r1(st.scored.max);
    html+='<details class="res-row"><summary><span class="rn">#'+(i+1)+'</span><span class="rt">'+q.title.replace(/<[^>]*>/g,'')+'</span>'+labelFor(st)+'<span class="pts">'+pts+'</span></summary><div class="res-body">';
    if(!st.skipped){
      html+='<h4>YOUR ANSWER</h4><p>'+esc(st.scored.summary)+'</p>';
      html+='<h4>CORRECT ANSWER</h4>'+st.scored.correct;
    }
    html+='<h4>WHY</h4>'+q.explain+'</div></details>';
  });
  html+='</div>';
  html+='<div class="ctrl-row" style="justify-content:center"><button type="button" id="btn-retake" class="btn primary">Retake Exam</button></div>';
  box.innerHTML=html;
  $('#btn-retake').addEventListener('click',retake);
  /* score count-up, then report exactly once (attempt captured so a
     Retake pressed mid-animation can never hijack or swallow the report) */
  var pctEl=$('#res-pct'),rawEl=$('#res-raw'),target=r.pct,attempt=S;
  function fire(){
    if(attempt.reported){return;}
    attempt.reported=true;
    reportScore(r.fe,r.ft);
  }
  if(REDUCED){pctEl.textContent=target+'%';rawEl.textContent=r.fe+' / '+r.ft+' points';fire();}
  else{
    var t0=null,dur=900;
    function step(ts){
      if(!t0){t0=ts;}
      var p=Math.min(1,(ts-t0)/dur);
      var v=Math.round(target*p);
      pctEl.textContent=v+'%';
      rawEl.textContent=Math.round(r.fe*p)+' / '+r.ft+' points';
      if(p<1){requestAnimationFrame(step);}
      else{fire();}
    }
    requestAnimationFrame(step);
  }
  window.scrollTo(0,0);
}
function reportScore(correct,total){
  var percent=Math.round((correct/total)*100);
  if(!parent||parent===window){return;} /* opened directly: no parent site to report to */
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:CFG.topicId,
      score:correct,
      total:total,
      percent:percent,
      passed:percent>=CFG.passMark
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function retake(){
  newAttempt();
  $('#scr-results').hidden=true;
  $('#scr-exam').hidden=true;
  $('#scr-intro').hidden=false;
  $('#btn-pause').textContent='Pause';
  $('#btn-pause').setAttribute('aria-pressed','false');
  $('#pause-overlay').hidden=true;
  $('#timer').textContent=fmtT(TOTAL);
  $('#timer').classList.remove('low');
  $('#timer').classList.remove('frozen');
  $('#pause-flag').hidden=true;
  buildIntro();
  window.scrollTo(0,0);
}
/* ---------- intro ---------- */
function buildIntro(){
  var box=$('#scr-intro');
  var types={};
  EXAMS.forEach(function(q){types[TYPELBL[q.type]]=(types[TYPELBL[q.type]]||0)+1;});
  var html='<div class="intro-card">'+
    '<h1>'+esc(CFG.chapterName)+' — '+CFG.severity+' practice exam</h1>'+
    '<p class="res-sub">'+esc(CFG.certName)+' · chapter '+CFG.chapter+' · <span id="intro-greet"></span></p>'+
    '<p>'+CFG.blurb+'</p>'+
    '<div class="meta-chips">'+
      '<span><b>'+EXAMS.length+'</b> exercises</span>'+
      '<span><b>'+CFG.minutes+' minutes</b> timer ('+CFG.pace+')</span>'+
      '<span>pass mark <b>'+CFG.passMark+'%</b></span>'+
      '<span>severity <b>'+CFG.severity+'</b></span>'+
      '<span>partial credit on multi-answer exercises</span>'+
    '</div>'+
    '<div class="kw-panel"><h3>KEYWORDS COVERED</h3>'+
      KEYW.map(function(th){return '<div class="kw-theme"><h4>'+th.t+'</h4>'+th.k.map(function(k){return '<span class="kw">'+k+'</span>';}).join('')+'</div>';}).join('')+
    '</div>'+
    '<h3 style="margin-top:18px">How this exam works</h3><ul class="howto">'+
    '<li><b>Exercise types:</b> '+Object.keys(types).join(' · ')+'.</li>'+
    '<li><b>Check</b> grades the exercise, marks every element green/red/amber, shows the explanation, and <b>pauses the timer in review mode</b> — content stays fully visible. Only pressing <b>Next</b> resumes the clock.</li>'+
    '<li><b>Manual Pause</b> is different: it hides the exercise while paused. The two pauses can stack; the clock runs only when both are cleared.</li>'+
    '<li><b>Skip</b> moves on without scoring. Skipped exercises are shown in amber; you can return to them before time runs out. At submit, skipped exercises are <b>excluded from both earned and possible points</b>.</li>'+
    '<li><b>Partial credit:</b> multi-answer exercises score per element — each correct element earns its share, wrong picks earn nothing extra. Single-answer exercises are all-or-nothing.</li>'+
    '<li><b>Hint −10%</b> reveals a nudge (never the answer) and costs 10% of that exercise\'s points.</li>'+
    '<li>Answers are <b>locked when checked</b>; press <b>Revise</b> to unlock. Checking again re-applies the review pause.</li>'+
    '<li>On retake, questions and choices are reshuffled and everything resets.</li>'+
    '</ul>'+
    '<div class="ctrl-row"><button type="button" id="btn-start" class="btn primary">Start the exam</button></div>'+
    '</div>';
  box.innerHTML=html;
  $('#btn-start').addEventListener('click',startExam);
  if(CFG.username){$('#intro-greet').textContent='Good luck, '+esc(CFG.username)+'!';}
}
function startExam(){
  newAttempt();
  $('#scr-intro').hidden=true;
  $('#scr-results').hidden=true;
  $('#scr-exam').hidden=false;
  $('#btn-pause').textContent='Pause';
  $('#pause-overlay').hidden=true;
  startTimer(); timerUI(); renderExercise();
}
/* ---------- boot ---------- */
function boot(){
  buildIntro();
  $('#btn-pause').addEventListener('click',togglePause);
  $('#btn-resume2').addEventListener('click',togglePause);
  $('#btn-finish').addEventListener('click',function(){
    if(!S||!S.startedWasShown){}
    if(!S){return;}
    if(S.finished){showResults();return;}
    if(window.confirm('Finish the exam now? Unchecked answers are graded as they are; skipped exercises are excluded.')){finishExam(false);}
  });
  window.addEventListener('message',function(event){
    var d=event.data;
    if(!d){return;}
    if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT'){return;}
    try{
      if(d.username){CFG.username=String(d.username).slice(0,40);buildIntro();}
    }catch(e){}
  });
}
boot();
