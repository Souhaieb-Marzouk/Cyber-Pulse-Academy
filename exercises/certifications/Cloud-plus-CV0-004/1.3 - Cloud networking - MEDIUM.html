<style>
:root {
  --bg: #0b1220;
  --panel: #121b2e;
  --panel2: #0e1524;
  --panel3: #1a2439;
  --line: #26344f;
  --text: #e8eef7;
  --dim: #a9b6cc;
  --accent: #38bdf8;
  --accent-ink: #06202e;
  --ok: #34d399;
  --ok-ink: #05261a;
  --bad: #f87171;
  --bad-ink: #2b0808;
  --warn: #fbbf24;
  --warn-ink: #2a1e02;
  --focus: #7dd3fc;
  --mono: 'Cascadia Mono', 'Consolas', 'DejaVu Sans Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #14213d 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text);
  font: 16px/1.55 'Segoe UI', 'Inter', 'Noto Sans', Arial, sans-serif;
  padding: 14px 14px 60px;
}
.mono, pre, code, .term-out, .log-lines { font-family: var(--mono); font-size: 15px; }
#app { max-width: 1000px; margin: 0 auto; }
button { font: inherit; }
button, select, input[type="text"] { min-height: 44px; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px;
}

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
  background: var(--panel3); color: var(--text); border: 1px solid var(--line);
  padding: 12px 18px; border-radius: 10px; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 60; max-width: 92%; box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- top bar ---------- */
#topbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px;
}
.tb-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#exam-title { font-weight: 700; letter-spacing: .2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; min-height: 30px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel3);
  font-size: 13.5px; font-weight: 600; color: var(--dim); white-space: nowrap;
}
.chip.sev-medium { color: #ffd75e; border-color: #6b5615; background: #241d06; }
.chip.sev-hard { color: #ff9d9d; border-color: #6e2020; background: #240a0a; }
.tb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#timer { font-family: var(--mono); font-size: 20px; font-weight: 700; padding: 4px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel3); min-width: 96px; text-align: center; }
#timer.low { color: var(--warn); border-color: #6b5615; }
#timer.crit { color: var(--bad); border-color: #6e2020; }
#timer-label { font-size: 13px; color: var(--dim); }
#pause-chip { color: var(--warn); border-color: #6b5615; background: #241d06; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--panel3); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 16px; cursor: pointer; min-height: 44px; font-weight: 600;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--warn); border-color: #6b5615; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- progress ---------- */
#progress-wrap { margin-bottom: 12px; }
#progress-track { height: 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
#progress-bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .4s ease; }
#progress-label { font-size: 13.5px; color: var(--dim); margin-top: 5px; }

/* ---------- blocks ---------- */
main { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.block { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
.block > h3 {
  margin: 0; padding: 8px 14px; font-size: 13.5px; letter-spacing: 1.2px; color: var(--dim);
  background: var(--panel3); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
}
.block-body { padding: 14px; }
.block.scenario { border-left: 4px solid var(--accent); }
.block.question { border-left: 4px solid var(--warn); }
.block.answer { border-left: 4px solid var(--ok); }
.block.artefact { border-left: 4px solid #8b5cf6; }
.block.feedback { border-left: 4px solid var(--dim); }
pre.artefact-pre {
  margin: 0; padding: 12px 14px; background: #0a0f1c; color: #cfe3ff; overflow-x: auto;
  font-family: var(--mono); font-size: 14.5px; line-height: 1.5; white-space: pre; border: 0;
}

/* ---------- choices ---------- */
.choice-list { display: flex; flex-direction: column; gap: 8px; }
.choice {
  display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; min-height: 44px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.choice:hover { border-color: var(--accent); }
.choice input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.choice.is-correct { border-color: var(--ok); background: rgba(52, 211, 153, .12); }
.choice.is-correct::after { content: "✓ Correct"; margin-left: auto; color: var(--ok); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.choice.is-wrong { border-color: var(--bad); background: rgba(248, 113, 113, .10); }
.choice.is-wrong::after { content: "✗ Wrong"; margin-left: auto; color: var(--bad); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.choice.is-missed { border-color: var(--warn); background: rgba(251, 191, 36, .10); }
.choice.is-missed::after { content: "⚠ Missed"; margin-left: auto; color: var(--warn); font-weight: 700; font-size: 13.5px; white-space: nowrap; }

/* ---------- pool / buckets / slots ---------- */
.pool { background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
.pool-title, .slot-hint { font-size: 13.5px; color: var(--dim); margin-bottom: 8px; }
.pool-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn {
  background: var(--panel3); border: 1px solid var(--line); color: var(--text);
  border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: grab; font-weight: 600;
}
.chipbtn.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .35); }
.chipbtn.ok { border-color: var(--ok); background: rgba(52, 211, 153, .14); }
.chipbtn.bad { border-color: var(--bad); background: rgba(248, 113, 113, .12); }
.chipbtn.missed { border-color: var(--warn); background: rgba(251, 191, 36, .12); }
.chipbtn .tag { font-size: 12px; font-weight: 700; margin-left: 6px; }
.chipbtn.ok .tag { color: var(--ok); } .chipbtn.bad .tag { color: var(--bad); } .chipbtn.missed .tag { color: var(--warn); }
.buckets, .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.bucket, .slotbox { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 96px; cursor: pointer; }
.bucket.over, .slotbox.over { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .3); }
.bucket-title, .slotbox-title { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; color: var(--accent); }
.bucket-zone, .slot-zone { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.slot-zone:empty::before { content: "empty — click a chip then this slot"; color: #5b6b85; font-size: 13px; }

/* ---------- order / rank ---------- */
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.order-row {
  display: flex; align-items: center; gap: 10px; background: var(--panel2);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px;
}
.order-row.dragging { opacity: .4; }
.order-num {
  flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--panel3);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 700; color: var(--accent);
}
.order-text { flex: 1; }
.order-btns { display: flex; gap: 6px; }
button.mini {
  width: 44px; height: 44px; border-radius: 8px; background: var(--panel3); color: var(--text);
  border: 1px solid var(--line); cursor: pointer; font-size: 18px; padding: 0;
}
.order-row.pos-ok { border-color: var(--ok); }
.order-row.pos-bad { border-color: var(--bad); }
.order-row .mark { margin-left: 6px; font-weight: 700; font-size: 13.5px; }

/* ---------- match / fill ---------- */
.match-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.match-row:last-child { border-bottom: 0; }
.match-left { flex: 1 1 260px; font-weight: 600; }
.match-row select, .fill-blank { background: var(--panel3); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; max-width: 100%; }
.match-row.sel-ok select, .fill-blank.ok { border-color: var(--ok); }
.match-row.sel-bad select, .fill-blank.bad { border-color: var(--bad); }
.fill-text { line-height: 2.2; }
.fill-text select { margin: 0 3px; }

/* ---------- log viewer ---------- */
.log-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; background: var(--panel3); border-bottom: 1px solid var(--line); }
.log-toolbar label { font-size: 13.5px; color: var(--dim); font-weight: 600; }
.log-filter { flex: 1 1 220px; background: #0a0f1c; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.log-count { font-size: 13px; color: var(--dim); font-family: var(--mono); }
.log-lines { margin: 0; padding: 12px 14px; background: #0a0f1c; overflow-x: auto; white-space: pre; line-height: 1.6; }
.log-line { display: block; }
.log-line.hidden { display: none; }
.sev-info { color: #9fb6d8; } .sev-ok { color: var(--ok); } .sev-warn { color: var(--warn); } .sev-err { color: var(--bad); }

/* ---------- terminal ---------- */
.term-tasks { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.term-task { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
.term-task .st { font-weight: 700; color: var(--dim); }
.term-task .st.ok { color: var(--ok); }
.term-note { font-size: 13.5px; color: var(--warn); background: rgba(251, 191, 36, .08); border: 1px solid #57430e; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.term { background: #05080f; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.term-head { padding: 6px 12px; background: var(--panel3); color: var(--dim); font-size: 13px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
.term-out { margin: 0; padding: 12px; max-height: 260px; overflow-y: auto; color: #b7f7c9; white-space: pre-wrap; font-size: 14.5px; line-height: 1.5; }
.term-row { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 6px 10px; }
.term-prompt { color: var(--ok); font-family: var(--mono); font-size: 14.5px; white-space: nowrap; }
.term-in { flex: 1; background: transparent; border: 0; color: var(--text); font-family: var(--mono); font-size: 14.5px; padding: 8px 4px; }
.term-in:focus { outline: none; }
.term-row:focus-within { box-shadow: inset 0 0 0 2px rgba(56, 189, 248, .4); }

/* ---------- branch ---------- */
.branch-step { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.branch-step-head { padding: 8px 14px; background: var(--panel3); font-weight: 700; font-size: 14px; color: var(--accent); border-bottom: 1px solid var(--line); }
.branch-body { padding: 12px 14px; }
.branch-outcome { margin-top: 10px; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.branch-outcome.good { background: rgba(52, 211, 153, .10); border: 1px solid #14532d; }
.branch-outcome.oops { background: rgba(248, 113, 113, .09); border: 1px solid #5f1d1d; }

/* ---------- spot the mistake ---------- */
.spot-lines { display: flex; flex-direction: column; gap: 4px; }
.spot-line {
  display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
  background: #0a0f1c; color: #cfe3ff; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-family: var(--mono); font-size: 14.5px; cursor: pointer; min-height: 44px;
}
.spot-line[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .3); }
.spot-line.ok { border-color: var(--ok); background: rgba(52, 211, 153, .12); }
.spot-line.bad { border-color: var(--bad); background: rgba(248, 113, 113, .10); }
.spot-line .mark { margin-left: auto; font-weight: 700; font-size: 13px; white-space: nowrap; font-family: 'Segoe UI', sans-serif; }
.spot-num { color: #5b6b85; flex: none; width: 30px; }

/* ---------- triage ---------- */
.alert-card { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
.alert-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 14px; background: var(--panel3); border-bottom: 1px solid var(--line); font-weight: 700; }
.alert-log { margin: 0; padding: 10px 14px; background: #0a0f1c; color: #cfe3ff; font-family: var(--mono); font-size: 14.5px; white-space: pre-wrap; border-bottom: 1px solid var(--line); }
.alert-body { padding: 12px 14px; }
.alert-outcome { margin-top: 10px; border-radius: 8px; padding: 10px 12px; display: none; font-size: 15px; }
.alert-outcome.good { display: block; background: rgba(52, 211, 153, .10); border: 1px solid #14532d; }
.alert-outcome.oops { display: block; background: rgba(248, 113, 113, .09); border: 1px solid #5f1d1d; }

/* ---------- feedback ---------- */
.fb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 13.5px; min-height: 30px; }
.pill.ok { background: rgba(52, 211, 153, .16); color: var(--ok); border: 1px solid #14532d; }
.pill.bad { background: rgba(248, 113, 113, .14); color: var(--bad); border: 1px solid #5f1d1d; }
.pill.warn { background: rgba(251, 191, 36, .13); color: var(--warn); border: 1px solid #57430e; }
.pill.dim { background: var(--panel3); color: var(--dim); border: 1px solid var(--line); }
.fb-points { color: var(--text); }
.fb-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.fb-item { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.fb-item .ic { flex: none; font-weight: 700; }
.fb-explain { padding: 12px 14px; color: var(--text); font-size: 15.5px; border-top: 1px dashed var(--line); }
.fb-explain b { color: var(--accent); }
.hintbox { margin: 0 0 12px; border: 1px dashed #57430e; background: rgba(251, 191, 36, .07); color: var(--warn); border-radius: 10px; padding: 10px 14px; }

/* ---------- actions / navigator ---------- */
.q-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
#navigator { margin-top: 8px; }
#nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; margin-top: 10px; }
.navbtn {
  min-width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel2); color: var(--text); font-weight: 700; cursor: pointer; font-family: var(--mono); font-size: 14.5px;
  display: flex; align-items: center; justify-content: center; gap: 3px; flex-direction: column; padding: 2px;
}
.navbtn .st { font-size: 11px; line-height: 1; }
.navbtn.cur { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .35); }
.navbtn.full { border-color: var(--ok); color: var(--ok); }
.navbtn.zero { border-color: var(--bad); color: var(--bad); }
.navbtn.partial { border-color: var(--warn); color: var(--warn); }
.navbtn.skipped { border-style: dashed; border-color: var(--warn); color: var(--warn); }

/* ---------- pause overlay ---------- */
#exam-wrap { position: relative; }
#exam-wrap.blurred #exam-screen { filter: blur(7px); pointer-events: none; user-select: none; }
#pause-overlay {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  z-index: 30; text-align: center; padding: 20px;
}
#exam-wrap.blurred #pause-overlay { display: flex; }
.pause-card { background: var(--panel); border: 1px solid var(--warn); border-radius: 14px; padding: 26px 34px; max-width: 420px; }
.pause-card .big { font-size: 34px; }
.pause-card h2 { margin: 8px 0 6px; }
.pause-card p { color: var(--dim); margin: 0 0 14px; }

/* ---------- intro ---------- */
.intro-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.intro-title { font-size: 26px; font-weight: 800; margin: 0; }
.intro-sub { color: var(--dim); margin: 4px 0 0; }
.kw-theme { margin-bottom: 12px; }
.kw-theme h4 { margin: 0 0 6px; color: var(--accent); font-size: 15px; }
.kw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.kw { background: var(--panel3); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--dim); }
.instructions li { margin-bottom: 8px; }
.instructions { padding-left: 22px; margin: 0; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.meta-box { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: center; }
.meta-box .v { font-size: 21px; font-weight: 800; color: var(--accent); }
.meta-box .k { font-size: 12.5px; color: var(--dim); letter-spacing: .6px; }

/* ---------- results ---------- */
.result-hero { text-align: center; padding: 26px 18px; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--line); }
.result-hero.pass { border-color: var(--ok); background: radial-gradient(600px 200px at 50% 0%, rgba(52, 211, 153, .14), transparent); }
.result-hero.fail { border-color: var(--bad); background: radial-gradient(600px 200px at 50% 0%, rgba(248, 113, 113, .10), transparent); }
.result-hero .verdict { font-size: 40px; font-weight: 900; letter-spacing: 2px; }
.result-hero.pass .verdict { color: var(--ok); }
.result-hero.fail .verdict { color: var(--bad); }
.result-hero .score-line { font-size: 20px; margin-top: 6px; }
.result-hero .cert-note { color: var(--dim); font-size: 14.5px; margin-top: 8px; }
.stat-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.rep-row { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.rep-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; background: var(--panel3); border-bottom: 1px solid var(--line); }
.rep-num { font-family: var(--mono); font-weight: 700; color: var(--accent); }
.rep-title { font-weight: 700; flex: 1; }
.rep-body { padding: 12px 14px; font-size: 15px; }
.rep-line { margin: 0 0 8px; }
.rep-line .lab { color: var(--dim); font-weight: 700; font-size: 13px; letter-spacing: .8px; }
.rep-explain { border-top: 1px dashed var(--line); padding-top: 10px; color: var(--text); }
.rep-skipped-note { color: var(--warn); font-size: 14.5px; margin: 4px 0 12px; }
.theme-progress { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

@media (max-width: 720px) {
  .q-actions .btn { flex: 1 1 44%; }
  body { padding: 8px 8px 40px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- v3.0 additions ---------- */
#confirm-box {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(5, 9, 18, .72); z-index: 60; padding: 20px;
}
[hidden] { display: none !important; }
.confirm-card { background: var(--panel); border: 1px solid var(--warn); border-radius: 14px; padding: 22px 26px; max-width: 460px; }
.confirm-card h2 { margin: 0 0 8px; }
.confirm-card p { color: var(--dim); margin: 0 0 16px; white-space: pre-line; }

<script>
window.__EXAM_DATA__ = window.__EXAM_DATA__ || [];

{ id:"m01", type:"qcm", tags:["VPN"], title:"IPSec — the two negotiation phases", points:10,
  scenario:"You configure a site-to-site VPN between an Azure VPN gateway and the on-premises firewall fw-edge-01. Both sides must use IKEv2. A junior colleague asks you to explain what actually happens during the two negotiation phases before any traffic can cross the tunnel.",
  question:"Which statement about the two IPSec negotiation phases is correct?",
  answerLabel:"CHOOSE ONE",
  choices:[
    {t:"Phase 1 builds an encrypted control channel; Phase 2 negotiates the SAs that protect the real traffic", ok:true},
    {t:"Phase 1 encrypts the user data; Phase 2 only authenticates the two peers", ok:false},
    {t:"Both phases use ESP to carry traffic, only with different keys", ok:false},
    {t:"Phase 2 must complete before Phase 1 can start", ok:false}],
  hint:"Ask yourself which phase protects the negotiation itself, and which phase produces the keys used for the data.",
  explain:"Phase 1 (IKE_SA_INIT plus authentication with a PSK or certificates) builds one secure control channel between the two gateways. Inside that protected channel, Phase 2 (CREATE_CHILD_SA, also called Quick Mode) negotiates the IPSec Security Associations — the agreed encryption, integrity and keys — that the ESP tunnel then uses for the actual traffic. User data never flows through Phase 1 itself, and the order is fixed: without a protected control channel, Phase 2 could not be exchanged safely, so Phase 1 always comes first." },

{ id:"m02", type:"classify", tags:["VPN"], title:"Site-to-site VPN vs remote-access VPN", points:10,
  scenario:"Your company has a head office, a branch office and many remote workers. The network team drew two boxes on the whiteboard: one IPSec tunnel between the two office gateways, and one SSL VPN service for laptops. You must place each property in the right bucket so the new team member understands the difference.",
  question:"Sort each item into the VPN model it belongs to.",
  answerLabel:"DRAG THE ITEMS INTO A BUCKET",
  buckets:[{t:"Site-to-site VPN"},{t:"Remote-access VPN"}],
  items:[
    {t:"Connects two offices permanently", bucket:0},
    {t:"Usually always-on, no per-user login", bucket:0},
    {t:"Uses the corporate client on a laptop", bucket:1},
    {t:"Authenticates individual users, often with MFA", bucket:1},
    {t:"Typically IPSec between two gateways", bucket:0},
    {t:"Often SSL/TLS based for easy access from anywhere", bucket:1},
    {t:"Transparent to end users and their devices", bucket:0},
    {t:"Split tunneling is a common per-user policy choice", bucket:1}],
  hint:"Think about who (or what) authenticates: a gateway pair, or a person with a device.",
  explain:"A site-to-site VPN joins two networks: the gateways authenticate each other (certificates or a PSK), the tunnel is always-on, and users never notice it. A remote-access VPN joins a user to the network: each user authenticates with their own credentials (often plus MFA), a client or browser handles the SSL/TLS connection, and per-user choices like split versus full tunnel are common. Mixing these up usually shows in the authentication design — device-to-device versus user-to-network." },

{ id:"m03", type:"multi", tags:["VPN"], title:"IPSec tunnel mode vs transport mode", points:10,
  scenario:"A vendor proposal for your gateway-to-gateway VPN mentions that their boxes support both IPSec modes. The procurement officer wants a one-paragraph sanity check before signing.",
  question:"Which statements about IPSec tunnel mode and transport mode are TRUE? Select all that apply.",
  answerLabel:"SELECT ALL THAT APPLY",
  choices:[
    {t:"Tunnel mode wraps the whole original IP packet and adds a new IP header", ok:true},
    {t:"Transport mode protects only the payload and keeps the original IP header", ok:true},
    {t:"Gateway-to-gateway VPNs normally use tunnel mode", ok:true},
    {t:"Transport mode is required for site-to-site VPNs", ok:false},
    {t:"AH provides strong encryption for the payload", ok:false}],
  hint:"Two of the wrong options confuse a mode with a protocol job. Remember what AH can and cannot do.",
  explain:"Tunnel mode encloses the entire original packet (headers included) inside a new IP packet — that is what gateway-to-gateway site-to-site VPNs use, because the original internal addresses should stay hidden between the gateways. Transport mode leaves the original IP header visible and protects only the payload, which suits end-to-end host connections. Transport mode is not required for site-to-site VPNs — tunnel mode is the norm there. And AH never encrypts: it authenticates and checks integrity only; encryption is the job of ESP." },

{ id:"m04", type:"order", tags:["VPN"], title:"Put the IPSec tunnel setup in order", points:12,
  scenario:"You are documenting the bring-up sequence of a new IPSec site-to-site tunnel for the onboarding runbook, so the next engineer does it in the right order.",
  question:"Drag the steps into the order in which they happen, from first to last.",
  answerLabel:"ORDER THE STEPS",
  steps:[
    {t:"IKE Phase 1: gateways match ISAKMP policies and authenticate (PSK or certificates)"},
    {t:"Diffie-Hellman exchange creates a shared secret over the untrusted network"},
    {t:"Phase 1 SA is up — the control channel between the gateways is now encrypted"},
    {t:"IKE Phase 2 (Quick Mode) negotiates the IPSec SAs with the ESP transforms"},
    {t:"With PFS enabled, a fresh Diffie-Hellman exchange gives Phase 2 its own keys"},
    {t:"The ESP tunnel carries the production traffic"}],
  hint:"Control channel first, data channel second. PFS happens inside Phase 2, just before traffic flows.",
  explain:"The sequence is fixed by the protocol: the gateways first agree ISAKMP parameters and authenticate (Phase 1); Diffie-Hellman produces the shared secret that protects this negotiation; the Phase 1 SA then encrypts all further IKE messages; Phase 2 negotiates the ESP SAs inside that protected channel; PFS (Perfect Forward Secrecy) optionally runs a new DH exchange so Phase 2 keys are independent of Phase 1 keys; only then does the ESP tunnel carry traffic. If you reverse any of these, the tunnel simply never comes up." },

{ id:"m05", type:"fill", tags:["VPN"], title:"Firewall rules every IPSec gateway needs", points:12,
  scenario:"A new firewall sits in front of your VPN gateway. The change ticket asks you to complete the rule description so the security team can approve it. Every protocol and port must be exact, or the tunnel will silently fail.",
  question:"Complete the rule text by picking the right value for each blank.",
  answerLabel:"PICK A WORD FOR EACH BLANK",
  text:"Allow IKE Phase 1: UDP port {{0}}. Allow NAT-Traversal: UDP port {{1}}. Allow ESP as IP protocol {{2}}. AH is not used here, because an intermediate NAT device would break its integrity checks.",
  blanks:["500","4500","50"],
  bank:["500","4500","50","51","443","GRE","TCP"],
  hint:"Two UDP ports and one protocol number. NAT-T exists precisely because plain ESP cannot pass a NAT device.",
  explain:"IKE Phase 1 listens on UDP 500. When a NAT device is detected in the path, the peers switch to NAT-Traversal and encapsulate ESP inside UDP 4500. ESP is IP protocol 50 (not a port). Protocol 51 is AH, which is deliberately excluded: AH integrity-covers fields that NAT rewrites, so it fails through NAT. 443 is TCP and belongs to HTTPS, GRE is a tunneling protocol that is often combined with IPSec but is not needed for the tunnel itself, and these rules are protocol-level, not TCP-only." },

{ id:"m06", type:"logview", tags:["VPN","Troubleshooting"], title:"Read the gateway log — why will the tunnel not come up?", points:10,
  scenario:"Your new site-to-site tunnel to the branch office never completes. The cloud VPN gateway repeats the same lines every 30 seconds. The branch firewall admin swears the pre-shared key matches yours.",
  question:"What is the most likely cause of this failure?",
  answerLabel:"CHOOSE ONE (filter the log if you like)",
  logs:[
    {s:"info", t:"2026-05-11 02:14:03  gw-vpn-east  IKEv2  Initiating new SA to peer 203[.]0[.]113[.]10 (onprem-fw-01)"},
    {s:"info", t:"2026-05-11 02:14:03  gw-vpn-east  IKEv2  Sending IKE_SA_INIT with proposals: AES256/SHA256/DH14"},
    {s:"err",  t:"2026-05-11 02:14:04  gw-vpn-east  IKEv2  Received NO_PROPOSAL_CHOSEN from peer"},
    {s:"warn", t:"2026-05-11 02:14:04  gw-vpn-east  IKEv2  Retrying in 30 seconds"},
    {s:"info", t:"2026-05-11 02:15:34  gw-vpn-east  IKEv2  Initiating new SA to peer 203[.]0[.]113[.]10 (onprem-fw-01)"},
    {s:"err",  t:"2026-05-11 02:15:35  gw-vpn-east  IKEv2  Received NO_PROPOSAL_CHOSEN from peer"},
    {s:"warn", t:"2026-05-11 02:15:35  gw-vpn-east  IKEv2  Retrying in 30 seconds"},
    {s:"info", t:"2026-05-11 02:16:06  gw-vpn-east  IKEv2  Sending IKE_SA_INIT with proposals: AES256/SHA256/DH14"}],
  answer:{kind:"qcm", choices:[
    {t:"The IKE Phase 1 proposals (encryption, integrity, DH group) do not match on the two gateways", ok:true},
    {t:"The pre-shared key is wrong on one side", ok:false},
    {t:"The BGP session over the tunnel is down", ok:false},
    {t:"The customer gateway's public IP changed", ok:false}]},
  hint:"NO_PROPOSAL_CHOSEN is a specific message — it says the peers reached each other and talked, but could not agree on something they announced.",
  explain:"NO_PROPOSAL_CHOSEN means the two gateways hear each other but their offered parameter sets do not intersect: one side offers AES-256/SHA-256/DH group 14 and the other side simply has no matching Phase 1 proposal. A wrong PSK produces an authentication failure after SA_INIT, not this message. BGP runs later, over the tunnel, and cannot be the reason the tunnel will not start. A changed peer IP would show as no response at all, not a structured refusal. The fix: compare both IKE policy tables line by line." },

{ id:"m07", type:"terminal", tags:["Troubleshooting"], title:"Terminal — trace the path to app-01", points:10,
  scenario:"You are on a jump VM inside the VNet. The web team says app-01 is unreachable from this VM 'sometimes'. Before opening a ticket you want to see the actual network path and where it stops.",
  question:"In the terminal below, show the network path from this VM to the host app-01.",
  answerLabel:"TYPE THE COMMAND, THEN PRESS ENTER",
  terminalHint:"Use the traceroute command family on the host name. The plain command with the target name is enough here (optional flags like -n are accepted).",
  echo:[
    {m:"^traceroute\\s+.*app-01", out:["traceroute to app-01 (10[.]20[.]2[.]10), 30 hops max, 60 byte packets"," 1  10[.]20[.]1[.]1 (10[.]20[.]1[.]1)  0.412 ms  0.388 ms  0.401 ms"," 2  10[.]20[.]0[.]1 (10[.]20[.]0[.]1)  0.871 ms  0.912 ms  0.884 ms"," 3  app-01 (10[.]20[.]2[.]10)  1.204 ms  1.188 ms  1.201 ms"]}],
  goals:[
    {goal:"Show the network path from this VM to app-01", accept:["^\\s*traceroute\\s+(-[a-z0-9]+\\s+)*app-01\\s*$"], reveal:"traceroute app-01"}],
  hint:"The command family is traceroute — it prints every router hop between this VM and the target.",
  explain:"traceroute sends packets with increasing TTL values: the first packet dies at hop 1, the second at hop 2, and so on. Each router that kills a packet reports back, which reveals the path hop by hop. If the path had stopped at hop 2, you would know the VNet router was the problem; here it reaches app-01, so routing is fine and the intermittent issue must be looked for elsewhere (for example in a health probe or a firewall that only drops some flows). ping would only prove reachability, not show where a failure sits." },

{ id:"m08", type:"branch", tags:["VPN"], title:"Contractor access — split or full tunnel?", points:12,
  scenario:"Security engineering must onboard 40 contractors. The policy says: contractor laptops may reach exactly two internal web apps, and ALL other traffic (including the internet) must pass corporate inspection. Your decisions shape the design.",
  question:"Answer each step. Your choices decide the design.",
  answerLabel:"CHOOSE AN OPTION FOR EVERY STEP",
  steps:[
    {prompt:"Which VPN model do you deploy for the contractors?",
     options:[
      {t:"Full tunnel — all contractor traffic goes through the corporate gateway", ok:true, outcome:"Correct. Full tunnel forces every flow through the inspection point, which is what the policy demands."},
      {t:"Split tunnel — internal ranges through the VPN, the rest direct", ok:false, outcome:"Split tunnel would send non-VPN traffic around the inspection point. That breaks the stated policy."},
      {t:"No VPN — publish the two apps to the internet with ACLs", ok:false, outcome:"Exposing internal apps directly to the internet is a much larger attack surface than a VPN."}]},
    {prompt:"After go-live, the CFO complains that contractors' video calls are slow. What do you do?",
     options:[
      {t:"Keep full tunnel; add bandwidth/QoS on the gateway and document why inspection requires it", ok:true, outcome:"Correct. The constraint is real, so you fix capacity and quality of service instead of removing the control."},
      {t:"Switch everyone to split tunnel to offload video traffic", ok:false, outcome:"That silently removes the inspection control the policy requires — a compliance regression for convenience."},
      {t:"Block video-call domains on the gateway", ok:false, outcome:"Blocking the CFO's meetings will not survive the week — and it does not address the capacity problem."}]},
    {prompt:"At the audit, what proves the design actually enforces full tunnel?",
     options:[
      {t:"The VPN policy export showing full-tunnel routing plus gateway flow logs", ok:true, outcome:"Correct. Configuration evidence plus logs showing traffic actually traversing the gateway is audit-grade proof."},
      {t:"A screenshot of the VPN client on one laptop", ok:false, outcome:"One screenshot proves one moment on one device — auditors want the policy source and traffic evidence."},
      {t:"A verbal confirmation from the network lead", ok:false, outcome:"Verbal statements are not evidence. Audits need exports and logs."}]}],
  hint:"The policy sentence 'ALL other traffic must pass corporate inspection' decides step 1 on its own.",
  explain:"Full tunnel vs split tunnel is a risk decision, not a performance switch: split tunneling trades inspection coverage for bandwidth. When a policy demands inspection of all traffic, the correct engineering response is to keep the control and scale the path (bandwidth, QoS). The audit step closes the loop: controls must be provable from configuration (the pushed routes show 0[.]0[.]0[.]0/0 through the tunnel) and from observed behaviour (flow logs on the gateway)." },

{ id:"m09", type:"qcm", tags:["VPN","Troubleshooting"], title:"Big transfers stall over the new tunnel", points:10,
  scenario:"A new IPSec tunnel works fine for pings and small web pages. But file copies fail, and large HTTPS uploads hang forever. Small requests to the same servers still work.",
  question:"What is the most likely cause?",
  answerLabel:"CHOOSE ONE",
  choices:[
    {t:"Tunnel overhead pushes large packets past the path MTU, and dropped fragmentation-needed messages create a black hole — lower the TCP MSS", ok:true},
    {t:"The DNS server used across the tunnel is too slow", ok:false},
    {t:"The VPN gateway CPU is at 100 percent", ok:false},
    {t:"Split tunneling is enabled on the tunnel", ok:false}],
  hint:"The size of the packet is the pattern: small is fine, large is dead. What does an IPSec header add to every packet?",
  explain:"IPSec adds 50–100 bytes of overhead per packet. When a sender emits full-size packets (for example 1500 bytes), the tunneled packet exceeds the path MTU. Routers should reply with ICMP type 3 code 4 (fragmentation needed) so the sender can shrink; when that message is filtered, the sender never learns and the transfer stalls — a PMTUD black hole. The classic fix is MSS clamping (or lowering the interface MTU), which caps TCP segment size below the real path MTU. DNS slowness and CPU exhaustion would also affect small requests, and split tunneling changes routing, not packet size." },

{ id:"m10", type:"classify", tags:["Provider mapping"], title:"AWS or Azure? Map the networking components", points:12,
  scenario:"Your team runs a two-cloud estate. New hires keep confusing the equivalent components. You build a mapping drill for the onboarding quiz.",
  question:"Drag each component to the cloud platform it belongs to.",
  answerLabel:"DRAG THE ITEMS INTO A BUCKET",
  buckets:[{t:"AWS"},{t:"Azure"}],
  items:[
    {t:"VPC", bucket:0},
    {t:"VNet", bucket:1},
    {t:"Direct Connect", bucket:0},
    {t:"ExpressRoute", bucket:1},
    {t:"Security Group (instance level)", bucket:0},
    {t:"Network Security Group (NSG)", bucket:1},
    {t:"Route 53", bucket:0},
    {t:"Azure DNS private zones", bucket:1}],
  hint:"Pair them up: VPC/VNet, Direct Connect/ExpressRoute, SG/NSG, Route 53/Azure DNS.",
  explain:"These are the standard cross-cloud equivalents: the virtual network container (AWS VPC, Azure VNet), the dedicated private line to on-premises (AWS Direct Connect, Azure ExpressRoute), the stateful instance/NIC-level firewall (AWS Security Groups, Azure NSGs), and the DNS service (AWS Route 53, Azure DNS). Learning the pairs lets you translate any architecture from one cloud to the other — the concepts (route tables, gateways, stateful vs stateless filtering) stay the same even when names change." }
);

{ id:"m11", type:"slot", tags:["Virtual networks"], title:"Place the gateways in the hub-spoke design", points:12,
  scenario:"Your hub-spoke design: a hub VNet connects three spokes (web, app, data). Spoke VMs have no public IPs. On-premises connects over IPSec. The architect left four questions on the whiteboard.",
  question:"Drag the component that answers each design question into its slot. Two items are distractors.",
  answerLabel:"DRAG AN ITEM INTO EACH SLOT",
  slots:[
    {t:"Outbound-only internet access for private spokes"},
    {t:"Terminates the IPSec tunnel to on-premises"},
    {t:"Connects the hub VNet to each spoke VNet"},
    {t:"Blocks east-west SMB (445) between spokes by policy"}],
  items:[
    {t:"NAT gateway", slot:0},
    {t:"Virtual private gateway (VPN gateway)", slot:1},
    {t:"VNet peering", slot:2},
    {t:"Network security groups", slot:3},
    {t:"Internet gateway", slot:null},
    {t:"A public IP on every VM", slot:null}],
  hint:"One component gives outbound-only internet; one ends tunnels; one joins networks; one filters traffic.",
  explain:"A NAT gateway translates many private IPs to one public IP for outbound connections only — inbound internet can never reach the spokes. The virtual private gateway is the IPSec endpoint on the cloud side (its peer is the customer gateway on-premises). VNet peering is the private link that joins two VNets. Network security groups are the stateful filters you use to deny east-west ports such as SMB 445 between spokes. An internet gateway would give (not prevent) inbound reachability, and public IPs on every VM destroys the private-subnet design." },

{ id:"m12", type:"multi", tags:["Virtual networks","Security controls"], title:"Keep snet-data private", points:10,
  scenario:"snet-data holds database VMs. The security baseline says: no direct internet in or out, but the VMs must still download OS patches, and only the app subnet may open database connections.",
  question:"Which actions are part of a correct design? Select all that apply.",
  answerLabel:"SELECT ALL THAT APPLY",
  choices:[
    {t:"Do not assign public IPs to the VMs", ok:true},
    {t:"Route the default route 0[.]0[.]0[.]0/0 to a NAT gateway for outbound only", ok:true},
    {t:"Make sure the subnet has no route to an internet gateway", ok:true},
    {t:"In the NSG, allow inbound 1433 only from the app subnet", ok:true},
    {t:"Add a default route to the internet gateway so replies can return", ok:false},
    {t:"Enable IP forwarding on the database VM NICs", ok:false}],
  hint:"Two wrong options each undo one protection you just built. What does a route to an internet gateway enable?",
  explain:"A private subnet is defined by behaviour, not by a name: no public IPs on the NICs, no route to an internet gateway, and outbound traffic via a NAT gateway so replies work for connections the VMs started. The NSG then scopes inbound management and service ports to exactly the subnets that need them. Adding a default route to the internet gateway would re-open direct internet access, and IP forwarding on the VMs turns them into unauthorized routers, bypassing the subnet design." },

{ id:"m13", type:"spot", tags:["Routing"], title:"Spot the wrong route", points:10,
  scenario:"The data subnet (10[.]20[.]4[.]0/24) must reach a peered spoke that uses 10[.]30[.]0[.]0/16. Connectivity to that spoke fails, while internet access and on-premises traffic work. Here is the subnet's route table.",
  question:"Click the one route line that breaks this design.",
  answerLabel:"CLICK THE FAULTY LINE",
  lines:[
    "destination            next hop",
    "10[.]20[.]0[.]0/16     system (VNet local)",
    "0[.]0[.]0[.]0/0        nat-gw-01",
    "10[.]55[.]0[.]0/16     vpn-gw-01   (on-premises)",
    "10[.]30[.]0[.]0/16     internet-gw-01"],
  wrongLines:[4],
  hint:"A peered spoke is reached through peering, never through the internet edge.",
  explain:"The last line sends traffic for the peered spoke 10[.]30[.]0[.]0/16 to the internet gateway. Peered VNet traffic must always stay on the private Microsoft/Google/Amazon backbone via the peering — routing it to the internet edge means the packets leave the design (and are dropped or lost). The fix is a route 10[.]30[.]0[.]0/16 with the peering as next hop. The other lines are correct: VNet-local traffic uses the system route, the default route goes to the NAT gateway for outbound-only internet, and the on-premises prefix points at the VPN gateway." },

{ id:"m14", type:"match", tags:["Virtual networks","Security controls"], title:"Match the concept to its definition", points:10,
  scenario:"A GRC auditor asks you to define five networking terms in plain language before signing off the cloud network baseline.",
  question:"Match each term with the definition that fits.",
  answerLabel:"PICK A DEFINITION FOR EACH TERM",
  pairs:[
    {l:"CIDR block", r:"An IP range written like 10[.]20[.]0[.]0/16"},
    {l:"Route table", r:"Ordered rules that decide where traffic is sent next"},
    {l:"Security group / NSG", r:"Stateful filter attached to a VM NIC or subnet"},
    {l:"Network ACL", r:"Stateless subnet-level filter checked before security groups"},
    {l:"Flow logs", r:"Records of accepted and denied connections, for auditing"}],
  hint:"Stateful means replies are allowed automatically; stateless means the return traffic needs its own rule.",
  explain:"A CIDR block is just an address range with a prefix length. The route table is the ordered next-hop decision list for a subnet. Security groups/NSGs are stateful: if inbound 443 is allowed, the reply traffic is allowed back automatically. Network ACLs are stateless: both directions must be ruled explicitly, including the ephemeral return ports, which is why a broken NACL often shows as 'SYN sent, no reply'. Flow logs are the evidence trail of what was accepted or denied — the first thing to check when a connection mysteriously fails." },

{ id:"m15", type:"branch", tags:["Security controls","Troubleshooting"], title:"Web tier unreachable — triage path", points:12,
  scenario:"Users cannot reach web-01 on 443. The VM is up, and ping from the same subnet works. You are the on-call network engineer. Walk the triage path.",
  question:"Choose the best next action at each step.",
  answerLabel:"CHOOSE AN OPTION FOR EVERY STEP",
  steps:[
    {prompt:"First check — where do you look?",
     options:[
      {t:"The NSG on web-01: is inbound 443 allowed from the needed sources?", ok:true, outcome:"Correct. The stateful filter closest to the NIC is the first and most common blocker."},
      {t:"Reboot the VM", ok:false, outcome:"Rebooting without evidence is guesswork; the VM is up and ping works."},
      {t:"Open all ports temporarily", ok:false, outcome:"Exposing the host to fix an outage creates a security incident on top of an outage."}]},
    {prompt:"The NSG allows 443 in. The connection still times out. Next?",
     options:[
      {t:"Check the subnet network ACL for inbound 443 AND for outbound ephemeral return ports", ok:true, outcome:"Correct. ACLs are stateless: the reply needs its own outbound rule on the high ports."},
      {t:"Change the web server to listen on port 80", ok:false, outcome:"The symptom is network-level, and moving ports does not address a filter mismatch."},
      {t:"Add a public IP to the VM", ok:false, outcome:"Clients reach the VM through the load balancer; a public IP does not fix a filter and widens exposure."}]},
    {prompt:"ACLs are fine too. The web tier is still unreachable. Best next move?",
     options:[
      {t:"Test from inside the subnet (curl from a peer VM) and check the host firewall", ok:true, outcome:"Correct. Isolating layers — test locally, then widen — finds the failing layer with evidence."},
      {t:"Order an ExpressRoute circuit", ok:false, outcome:"A dedicated line to on-premises has nothing to do with intra-VNet reachability."},
      {t:"Delete the route table", ok:false, outcome:"Removing routing destroys the design and probably the subnet's connectivity entirely."}]}],
  hint:"Work from the NIC outward: stateful filter, then stateless filter, then host-level.",
  explain:"Good cloud network triage is layered: NIC/subnet NSG (stateful), then subnet NACL (stateless, remember the ephemeral return ports), then the host firewall and the service itself. Each step either finds the fault or removes one layer from suspicion, with evidence at every stage. This beats random restarts and keeps the blast radius of your troubleshooting zero." },

{ id:"m16", type:"order", tags:["Hybrid","VPN"], title:"Build a site-to-site VPN — step order", points:12,
  scenario:"A change ticket asks you to connect a new branch office to the cloud hub over IPSec. Put the runbook steps in the order you would execute them.",
  question:"Drag the steps into execution order, from first to last.",
  answerLabel:"ORDER THE STEPS",
  steps:[
    {t:"Create the virtual network gateway (VPN type) in the hub VNet"},
    {t:"Create the customer gateway object with the branch firewall's public IP"},
    {t:"Create the connection with a matching IKE policy and the shared credential"},
    {t:"Enable BGP (or add static routes) so prefixes are exchanged"},
    {t:"Advertise the VNet ranges and the branch ranges in both directions"},
    {t:"Verify: tunnel status up, routes learned, a test ping across the tunnel"}],
  hint:"Endpoints first, then the tunnel between them, then routing over it, then proof it works.",
  explain:"You cannot create a connection before both endpoints exist: the virtual network gateway (cloud side) and the customer gateway (a metadata object describing the branch firewall). The connection object then carries the IKE policy and the shared secret. Routing comes after the tunnel exists — BGP learns prefixes dynamically, or static routes are added on both sides. Verification is last and must include an end-to-end test, because 'tunnel up' alone does not prove 'traffic flows': routes and filters can still blackhole it." },

{ id:"m17", type:"qcm", tags:["Hybrid"], title:"Dedicated line or VPN for the bank?", points:10,
  scenario:"A bank must replicate 2 Gbps of database traffic to the cloud continuously. Requirements: predictable latency, no traffic over the public internet, and compliance-certifiable private connectivity. The link will run 24/7.",
  question:"Which connectivity option fits best?",
  answerLabel:"CHOOSE ONE",
  choices:[
    {t:"A dedicated interconnect (ExpressRoute or Direct Connect) with private peering", ok:true},
    {t:"One site-to-site VPN over the internet", ok:false},
    {t:"Two site-to-site VPNs in active/active", ok:false},
    {t:"Client VPNs installed on the database servers", ok:false}],
  hint:"Steady multi-gigabit, deterministic latency, and a no-internet rule — what physically delivers that?",
  explain:"A dedicated interconnect is a private physical circuit into the provider's network: multi-gigabit capacity, stable latency, no internet path, and audit-friendly isolation. An IPSec VPN runs over the internet, so its latency and throughput vary with congestion and encryption overhead — even two active/active VPNs cannot guarantee 2 Gbps steady. Client VPNs are for users, not for backend replication links, and would add per-server complexity for zero benefit." },

{ id:"m18", type:"logview", tags:["Flow logs","Security controls"], title:"Read the flow logs — what do they actually prove?", points:10,
  scenario:"An app VM (10[.]20[.]1[.]5) cannot reach the database VM (10[.]20[.]2[.]10) on 1433, but the app itself seems fine otherwise. You open the flow logs from the window of the incident.",
  question:"Which conclusions are SUPPORTED by the log? Select all that apply.",
  answerLabel:"SELECT ALL THAT APPLY (filter the log if you like)",
  logs:[
    {s:"info", t:"12:02:11  ACCEPT  TCP 10[.]20[.]1[.]5:44310 -> 10[.]20[.]2[.]10:443"},
    {s:"err",  t:"12:02:14  REJECT  TCP 10[.]20[.]1[.]5:51322 -> 10[.]20[.]2[.]10:1433"},
    {s:"err",  t:"12:02:14  REJECT  TCP 10[.]20[.]1[.]5:51323 -> 10[.]20[.]2[.]10:1433"},
    {s:"info", t:"12:02:20  ACCEPT  TCP 10[.]20[.]1[.]5:44315 -> 10[.]20[.]2[.]10:443"},
    {s:"info", t:"12:03:02  ACCEPT  UDP 10[.]20[.]1[.]5:51000 -> 10[.]20[.]0[.]2:53"},
    {s:"info", t:"12:03:44  ACCEPT  TCP 10[.]20[.]1[.]5:44318 -> 10[.]20[.]2[.]10:443"}],
  answer:{kind:"multi", choices:[
    {t:"Web (443) traffic from the app VM to the database VM is allowed", ok:true},
    {t:"Connections to the database port 1433 are being rejected", ok:true},
    {t:"DNS lookups to the VNet resolver succeed", ok:true},
    {t:"The VM has no internet access at all", ok:false},
    {t:"The log proves the NSG (and not the NACL) is blocking 1433", ok:false}]},
  hint:"Stick to what the lines say. Absence of evidence about the internet is not evidence about the internet.",
  explain:"The logs directly show: 443 accepted (so the path and the stateful filter allow it), 1433 rejected twice, and DNS to the resolver accepted. They do NOT show any internet traffic at all — you cannot conclude anything about internet access from this window. And a REJECT line alone does not name which control did it: an NSG, a NACL, or a host firewall could each produce a rejection. Identifying the blocker requires checking the configurations, not just the flow log." },

{ id:"m19", type:"fill", tags:["Routing","Hybrid"], title:"Complete the hub route table", points:12,
  scenario:"You are writing the route table definition for the hub VNet. The reviewer left four blanks. The hub hosts the shared gateways; spokes and on-premises must be reachable, and spokes need outbound internet through the hub.",
  question:"Complete each blank with the right next hop or concept.",
  answerLabel:"PICK A WORD FOR EACH BLANK",
  text:"Default route 0[.]0[.]0[.]0/0 → {{0}} for outbound-only internet. On-premises range 10[.]40[.]0[.]0/16 → {{1}}. Peered spoke range 10[.]50[.]0[.]0/16 → {{2}}. Traffic inside the hub VNet itself uses the {{3}} system route automatically.",
  blanks:["NAT gateway","virtual private gateway","VNet peering","intra-VNet"],
  bank:["NAT gateway","virtual private gateway","VNet peering","internet gateway","intra-VNet","load balancer"],
  hint:"Match each destination with the component that owns that path: internet edge, tunnel endpoint, private inter-VNet link, local.",
  explain:"The default route to a NAT gateway gives spokes controlled outbound internet without inbound reachability. The on-premises prefix must point to the virtual private gateway — the IPSec endpoint inside the cloud. The peered spoke's range points at the peering, keeping spoke traffic on the private backbone. Intra-VNet traffic never needs a user route: the system route handles local ranges automatically. Choosing the internet gateway for the default route would open inbound reachability and break the private-subnet model." },

{ id:"m20", type:"multi", tags:["DNS"], title:"Split-horizon DNS — the needed pieces", points:10,
  scenario:"On-premises servers must resolve db.internal.corp to its private IP, while the public internet must resolve nothing for that name. The app runs in the VNet and the DNS design must work from both sides.",
  question:"Which pieces are part of the correct design? Select all that apply.",
  answerLabel:"SELECT ALL THAT APPLY",
  choices:[
    {t:"A private DNS zone for internal.corp linked to the VNet", ok:true},
    {t:"An A record for db inside that private zone", ok:true},
    {t:"Conditional forwarders on both sides for the corp domains", ok:true},
    {t:"VM NICs using the VNet resolver (via DHCP defaults)", ok:true},
    {t:"A public A record for db.internal.corp", ok:false},
    {t:"Disabling DNS resolution on the VMs and using hosts files", ok:false}],
  hint:"The private name must exist only where it is private, and both sides must know where to ask.",
  explain:"Split-horizon DNS means the same namespace resolves differently depending on where the question is asked. The private zone linked to the VNet holds the internal records; the A record gives db its private address; conditional forwarders make on-premises DNS servers ask the cloud resolver for internal.corp (and vice versa); and VMs must actually use the VNet resolver for any of it to matter. A public record would leak the internal name to the internet, and hosts files are an unmanageable dead end at any real scale." }
);

{ id:"m21", type:"classify", tags:["Segmentation"], title:"East-west or north-south?", points:10,
  scenario:"The security team is sizing its detection rules. Rules that watch flows between VMs are different from rules that watch clients entering or leaving the network. You sort example flows into the right model.",
  question:"Drag each traffic example into the correct direction bucket.",
  answerLabel:"DRAG THE ITEMS INTO A BUCKET",
  buckets:[{t:"East-west (inside the network)"},{t:"North-south (in or out of the network)"}],
  items:[
    {t:"VM-to-VM replication inside one VNet", bucket:0},
    {t:"A user in the office reaching the web tier", bucket:1},
    {t:"Spoke-to-spoke database sync", bucket:0},
    {t:"Site-to-site VPN traffic to on-premises", bucket:1},
    {t:"Pod-to-pod calls inside a cluster subnet", bucket:0},
    {t:"A client downloading from the CDN edge", bucket:1}],
  hint:"Ask: do both endpoints live inside the same network, or does the flow cross its edge?",
  explain:"East-west describes traffic whose endpoints are both inside the network — server-to-server, VM-to-VM, pod-to-pod. It is the highest-volume traffic in most estates and the path attackers use for lateral movement, which is why microsegmentation matters there. North-south crosses the network edge: clients coming in, replication or VPN traffic going out. Different controls apply: north-south is filtered at the edge (firewalls, WAF), east-west inside (NSGs, segmentation policies)." },

{ id:"m22", type:"slot", tags:["Segmentation","Security controls"], title:"Three-tier placement in the VNet", points:12,
  scenario:"You design a classic three-tier application in a VNet with four subnets: snet-web (edge), snet-app, snet-data, snet-mgmt. The security architect wants every tier isolated and every admin path recorded.",
  question:"Drag the right answer into each design slot. Two items are distractors.",
  answerLabel:"DRAG AN ITEM INTO EACH SLOT",
  slots:[
    {t:"Which subnet hosts the internet-facing load balancer and WAF?"},
    {t:"Where do the bastion / jump hosts live?"},
    {t:"Where does the database VM go, with no public IP?"},
    {t:"What enforces web-to-app and app-to-data rules?"}],
  items:[
    {t:"snet-web (edge subnet)", slot:0},
    {t:"snet-mgmt (management subnet)", slot:1},
    {t:"snet-data (data subnet)", slot:2},
    {t:"Separate NSGs per tier, default-deny between tiers", slot:3},
    {t:"One flat subnet for everything", slot:null},
    {t:"A public IP directly on the database VM", slot:null}],
  hint:"Edge faces the internet, management is separate, data is innermost — and the filtering between tiers is a control, not a place.",
  explain:"The three-tier pattern places each layer in its own subnet: the edge subnet holds the load balancer and WAF (the only internet-facing components), the data subnet keeps the database private, and a dedicated management subnet isolates bastion hosts from production traffic. The rules between tiers come from NSGs attached per subnet or NIC — default-deny with narrow allows (web-to-app on the app port only, app-to-data on 1433 only). A flat subnet or a public IP on the database would collapse all the boundaries the design exists to create." },

{ id:"m23", type:"rank", tags:["Prioritization"], title:"Rank the morning tickets", points:15,
  scenario:"Monday 08:30. Five network tickets landed overnight. You can only work them top-down. Rank them by operational risk — most urgent first.",
  question:"Drag the tickets into the order you would work them.",

  steps:[
    {t:"VPN gateway down — all branch offices offline since 03:00"},
    {t:"Database subnet NSG opened 0[.]0[.]0[.]0/0 on 1433 last night"},
    {t:"Web tier latency +15 percent after last night's deploy"},
    {t:"Dev subnet flow logs not enabled (baseline gap)"},
    {t:"Internal DNS alias has a too-long TTL (cosmetic)"}],

  explain:"Order: (1) the VPN gateway outage stops an entire business function — restore service first; (2) the open 0[.]0[.]0[.]0/0 on 1433 is an active exposure of a database to the whole internet — close it right after service is restored (or delegate in parallel); (3) the 15 percent latency regression degrades user experience but has a known change as its likely cause; (4) the flow-log gap removes visibility but is not itself an exposure; (5) the TTL nuance can wait for the next maintenance window. Prioritizing is about impact times urgency, not about the order the tickets arrived." },

{ id:"m24", type:"terminal", tags:["DNS","Troubleshooting"], title:"Terminal — resolve an internal record", points:10,
  scenario:"An app VM reports that db.internal.corp does not resolve. You suspect the private zone or the resolver. Check what the VNet resolver actually answers.",
  question:"In the terminal below, ask the VNet resolver (named vnresolver) for the A record of db.internal.corp.",
  answerLabel:"TYPE THE COMMAND, THEN PRESS ENTER",
  terminalHint:"Use the dig command family. Point it at the resolver with @vnresolver and name the record you want. The plain lookup is enough (flags like +short are accepted).",
  echo:[
    {m:"^dig\\s+@vnresolver", out:["; <<>> DiG 9.18 <<>> @vnresolver db.internal.corp",";; global options: +cmd",";; ANSWER SECTION:","db.internal.corp. 300 IN A 10[.]20[.]3[.]20","",";; Query time: 2 msec",";; SERVER: 10[.]20[.]0[.]2#53(vnresolver)"]}],
  goals:[
    {goal:"Resolve db.internal.corp using the VNet resolver", accept:["^\\s*dig\\s+@vnresolver\\s+([a-z0-9.-]+\\s+)*db\\.internal\\.corp(\\s+\\S+)*\\s*$"], reveal:"dig @vnresolver db.internal.corp"}],
  hint:"The command family is dig — @vnresolver chooses the resolver, then the record name.",
  explain:"dig sends a DNS query to the resolver you name with @. If this returns the A record 10[.]20[.]3[.]20, DNS is fine and the app's problem is elsewhere (maybe its own resolver settings). If it returned NXDOMAIN, the private zone or record is missing; a timeout would point at reachability of the resolver itself. This is the fastest way to split a 'name does not work' ticket into a DNS problem versus a routing problem." },

{ id:"m25", type:"branch", tags:["Segmentation","Flow logs"], title:"Blue team — lateral movement in the flow logs", points:12,
  scenario:"You review flow logs and see spoke VM 10[.]20[.]7[.]9 opening short connections to dozens of other VMs on ports 445 and 3389 within four minutes. Normal servers here never do that. You are the responder; decide the path.",
  question:"Choose the best action at each step.",
  answerLabel:"CHOOSE AN OPTION FOR EVERY STEP",
  steps:[
    {prompt:"What is this pattern?",
     options:[
      {t:"East-west lateral movement — an internal scan spreading across the spoke", ok:true, outcome:"Correct. Sweeping many internal hosts on SMB/RDP ports is the classic lateral-movement signature."},
      {t:"Normal backup traffic", ok:false, outcome:"Backups come from designated backup servers on known ports — not dozens of short sweeps on 445/3389."},
      {t:"A north-south DDoS attack", ok:false, outcome:"DDoS comes from outside toward a target. This traffic is entirely inside the VNet."}]},
    {prompt:"First containment step?",
     options:[
      {t:"Quarantine the VM: an NSG that denies its east-west traffic but keeps management access", ok:true, outcome:"Correct. Cut the spread path while keeping a controlled channel for investigation."},
      {t:"Turn off flow logs to reduce noise", ok:false, outcome:"Blinding yourself during an incident destroys the evidence you need next."},
      {t:"Restart the whole spoke subnet", ok:false, outcome:"Mass restarts destroy volatile evidence and impact every workload for no containment gain."}]},
    {prompt:"After the incident, what hardening prevents a repeat?",
     options:[
      {t:"Microsegmentation: default-deny between tiers, allow only the exact ports each tier needs", ok:true, outcome:"Correct. The scan worked because east-west was open. Default-deny shrinks the blast radius to almost nothing."},
      {t:"One big allow-all NSG for simplicity", ok:false, outcome:"Allow-all is exactly the condition that let the scan run freely."},
      {t:"Move all VMs into one subnet", ok:false, outcome:"Fewer segments means fewer control points, not more."}]}],
  hint:"Read the ports: 445 and 3389 from one host to many hosts is a tool, not an application flow.",
  explain:"Lateral movement travels east-west on management protocols (SMB 445, RDP 3389). The response pattern is contain → investigate → harden: quarantine the source VM with a targeted NSG, preserve and read the logs, then close the structural weakness with microsegmentation. After default-deny between tiers, a scanning VM can only reach the one port its tier is legitimately allowed — the scan dies on the first hop." },

{ id:"m26", type:"qcm", tags:["Addressing"], title:"Add IPv6 without breaking IPv4 apps", points:10,
  scenario:"The platform team must give the VNet IPv6 connectivity. Hundreds of legacy IPv4-only apps run there and cannot break. The change window is tonight.",
  question:"Which approach is correct?",
  answerLabel:"CHOOSE ONE",
  choices:[
    {t:"Enable dual stack on the VNet and subnets so every NIC keeps IPv4 and gains IPv6", ok:true},
    {t:"Replace IPv4 with IPv6 across the VNet in one change", ok:false},
    {t:"Do nothing on the subnets; only add a NAT gateway for IPv6", ok:false},
    {t:"Tunnel IPv6 through the management VPN and leave the VNet IPv4-only forever", ok:false}],
  hint:"The requirement 'legacy apps cannot break' rules out anything that removes IPv4.",
  explain:"Dual stack runs both address families side by side: existing IPv4 apps keep working untouched, while new services can bind IPv6. That is exactly what the objective demands. A forced migration would break the legacy estate tonight. NAT-only tricks do not give the subnets real IPv6 connectivity, and hiding IPv6 behind a management VPN is not a deployment — it is an avoidance that still fails the requirement." },

{ id:"m27", type:"match", tags:["Virtual networks"], title:"Load balancer terms — match them", points:10,
  scenario:"A developer asks why the new API sometimes lands on a warm backend and sometimes on a cold one. You walk them through the four load-balancing terms in the design doc.",
  question:"Match each term with the sentence that defines it.",
  answerLabel:"PICK A DEFINITION FOR EACH TERM",
  pairs:[
    {l:"Layer 4 load balancer", r:"Routes on IP and port only — very fast, content-blind"},
    {l:"Layer 7 load balancer", r:"Routes on HTTP paths, headers or cookies"},
    {l:"Health probe", r:"Removes a backend from the pool when its checks fail"},
    {l:"Session persistence", r:"Keeps one user on the same backend across requests"}],
  hint:"Two terms are about WHERE traffic goes, two about WHICH backend is alive and sticky.",
  explain:"A layer 4 balancer makes decisions on IP and port — fast and cheap, but blind to content. A layer 7 balancer reads the HTTP request itself and can route /api to one pool and /images to another. Health probes continuously test each backend and pull dead ones out of rotation — the reason a flapping probe causes periodic errors. Session persistence (stickiness) pins a user to the backend that holds their in-memory state. Understanding these four explains most 'sometimes it works' load-balancer tickets." },

{ id:"m28", type:"slot", tags:["Troubleshooting"], title:"Match the tool to the symptom", points:15,
  scenario:"You are preparing the troubleshooting cheat-sheet for the network on-call binder. Five situations, five tools. Two distractors are in the pool.",
  question:"Drag the best tool for each situation into its slot.",
  answerLabel:"DRAG AN ITEM INTO EACH SLOT",
  slots:[
    {t:"Confirm a host answers ICMP at all"},
    {t:"See every hop between this VM and on-premises"},
    {t:"Check which address a name resolves to"},
    {t:"Measure real throughput between two VMs"},
    {t:"Capture packets to inspect a handshake"}],
  items:[
    {t:"ping", slot:0},
    {t:"traceroute", slot:1},
    {t:"dig / nslookup", slot:2},
    {t:"iperf", slot:3},
    {t:"tcpdump", slot:4},
    {t:"netstat", slot:null},
    {t:"chmod", slot:null}],
  hint:"One tool per verb: reach, path, name, throughput, capture.",
  explain:"ping answers 'is it alive via ICMP'. traceroute answers 'where does the path break' hop by hop. dig/nslookup answers 'what does this name resolve to' — separating DNS faults from routing faults. iperf measures actual bandwidth between two endpoints, which is how you prove a 1 Gbps link really carries 1 Gbps. tcpdump captures the packets themselves so you can see whether a SYN ever gets a SYN-ACK. netstat shows local sockets (useful, but not for any slot here), and chmod changes file permissions — the classic distractor." },

{ id:"m29", type:"multi", tags:["Routing","Virtual networks"], title:"Why can spoke A not reach spoke B?", points:10,
  scenario:"Spoke-A and Spoke-B are each peered only to the hub. A VM in Spoke-A cannot reach a VM in Spoke-B. The team debates why. Which statements are TRUE? Select all that apply.",
  question:"Select all correct statements.",
  answerLabel:"SELECT ALL THAT APPLY",
  choices:[
    {t:"Peering is non-transitive: A-to-B needs its own peering or a routed hub design", ok:true},
    {t:"In a hub-routed design, spoke route tables must point spoke-to-spoke traffic at the hub appliance", ok:true},
    {t:"Peered networks must not have overlapping CIDR ranges", ok:true},
    {t:"Peering works across regions where the platform supports it", ok:true},
    {t:"Peering is transitive by default in every cloud", ok:false},
    {t:"Overlapping CIDR ranges are fine as long as peering succeeds", ok:false}],
  hint:"Two wrong options say the opposite of the two most basic peering rules.",
  explain:"The classic surprise: VNet/VPC peering connects exactly two networks and is non-transitive — A peered to the hub and B peered to the hub gives you no A-to-B path until you add a peering or route through a hub appliance (NVA or transit gateway), with route tables steering spoke-to-spoke traffic to the hub. Overlapping CIDRs are rejected up front: if two networks both claim 10[.]1[.]0[.]0/16, the platform cannot build unique routes. Cross-region peering is supported by all major clouds, so that statement is true." },

{ id:"m30", type:"fill", tags:["VPN","Reporting"], title:"Draft the outage report", points:15,

function makeInstance(ex) {
  var inst = { type: ex.type };
  var k;
  if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') {
    var src = ex.type === 'logview' ? ex.answer.choices : ex.choices;
    inst.choices = shuffle(src.map(function (c) { return { t: c.t, ok: !!c.ok }; }));
    inst.correctCount = inst.choices.filter(function (c) { return c.ok; }).length;
  }
  if (ex.type === 'classify') {
    inst.buckets = ex.buckets.map(function (b) { return { t: b.t }; });
    inst.items = shuffle(ex.items.map(function (it) { return { t: it.t, bucket: it.bucket }; }));
  }
  if (ex.type === 'slot') {
    inst.slots = ex.slots.map(function (s) { return { t: s.t }; });
    inst.items = shuffle(ex.items.map(function (it) { return { t: it.t, slot: (it.slot === undefined ? null : it.slot) }; }));
  }
  if (ex.type === 'order' || ex.type === 'rank') {
    inst.steps = shuffle(ex.steps.map(function (s, idx) { return { t: s.t, orig: idx }; }));
  }
  if (ex.type === 'match') {
    inst.pairs = ex.pairs.map(function (p) { return { l: p.l, r: p.r }; });
    inst.defs = shuffle(ex.pairs.map(function (p) { return p.r; }));
  }
  if (ex.type === 'fill') {
    inst.bank = shuffle(ex.bank.slice());
    inst.blanks = ex.blanks.slice();
  }
  if (ex.type === 'terminal') {
    inst.goals = ex.goals.map(function (g) { return { goal: g.goal, accept: g.accept || null, acceptFn: g.acceptFn || null, reveal: g.reveal || '' }; });
  }
  if (ex.type === 'branch') {
    inst.steps = ex.steps.map(function (st) {
      return {
        prompt: st.prompt,
        options: shuffle(st.options.map(function (o) { return { t: o.t, ok: !!o.ok, outcome: o.outcome }; }))
      };
    });
    inst.bs = { step: 0, chosen: [] };
  }
  if (ex.type === 'triage') {
    inst.alerts = ex.alerts.map(function (al) {
      return { title: al.title, log: al.log, choices: shuffle(al.choices.map(function (c) { return { t: c.t, ok: !!c.ok, outcome: c.outcome }; })) };

TYPE_IMPL.terminal = {
  build: function (root, ex, inst, ctx) {
    var api = {};
    var tasks = el('div', 'term-tasks');
    var stEls = inst.goals.map(function (g, k) {
      var t = el('div', 'term-task');
      var st = el('span', 'st', '◌ Pending');
      st.dataset.k = String(k);
      t.appendChild(st);
      t.appendChild(document.createTextNode(' — ' + g.goal));
      tasks.appendChild(t);
      return st;
    });
    if (ex.terminalHint) root.appendChild(el('div', 'term-note', '🧭 Lab guidance: ' + esc(ex.terminalHint)));
    root.appendChild(tasks);
    var term = el('div', 'term');
    term.appendChild(el('div', 'term-head', 'lab-shell — sandboxed, read-only network tools'));
    var out = el('pre', 'term-out');
    out.setAttribute('aria-live', 'polite');
    var row = el('div', 'term-row');
    var pr = el('span', 'term-prompt', 'analyst@vm-net:~$');
    var inp = el('input', 'term-in');
    inp.type = 'text';
    inp.placeholder = 'type a command, then Enter (addresses are defanged — type them exactly as shown)';
    inp.setAttribute('aria-label', 'Terminal input');
    row.appendChild(pr); row.appendChild(inp);
    term.appendChild(out); term.appendChild(row);
    root.appendChild(term);
    var hist = [];
    function print(lines) { lines.forEach(function (l) { out.appendChild(document.createTextNode(l + '\n')); }); out.scrollTop = out.scrollHeight; }
    function refresh() {
      inst.goals.forEach(function (g, k) {
        var done = hist.some(function (cmd) { return matchGoal(g, cmd); });
        stEls[k].textContent = done ? '✓ Satisfied' : '◌ Pending';
        stEls[k].className = 'st' + (done ? ' ok' : '');
      });
    }
    function run(cmd) {
      out.appendChild(document.createTextNode('analyst@vm-net:~$ ' + cmd + '\n'));
      hist.push(cmd);
      var done = false;
      (ex.echo || []).forEach(function (ee) {
        if (!done) { try { if (new RegExp(ee.m, 'i').test(cmd)) { print(ee.out); done = true; } } catch (e) {} }
      });
      if (!done) {
        var c = cmd.trim().toLowerCase();
        if (c === 'clear') out.textContent = '';
        else if (c === 'help') print(ex.helpOut || ['Lab shell: a small set of network commands is available.', 'Nothing is pre-named for you — use your own knowledge.', 'Addresses are shown defanged; type them exactly as displayed.']);
        else if (cmd.trim()) print(['-bash: ' + cmd.trim().split(/\s+/)[0] + ': command not found in this lab']);
      }
      refresh();
    }
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        var v = inp.value;
        inp.value = '';
        if (v.trim() && !ctx.locked()) { run(v); ctx.markDirty(); }
      }
    });
    api.collect = function () { return hist.slice(); };
    api.canCheck = function () { return hist.length > 0; };
    api.reveal = function (res) { refresh(); };
    api.lock = function () { inp.disabled = true; };
    api.unlock = function () { inp.disabled = false; };
    api.apply = function (val) { (val || []).forEach(function (c) { run(c); }); };
    return api;
  }
};

TYPE_IMPL.branch = {
  build: function (root, ex, inst, ctx) {
    var api = {};
    var holder = el('div');
    root.appendChild(holder);
    function renderAll() {
      holder.innerHTML = '';
      inst.steps.forEach(function (st, k) {
        if (k > inst.bs.step) return;
        var box = el('div', 'branch-step');
        box.appendChild(el('div', 'branch-step-head', 'Step ' + (k + 1) + ' of ' + inst.steps.length));
        var body = el('div', 'branch-body');
        body.appendChild(el('div', null, esc(st.prompt)));
        var list = el('div', 'choice-list');
        list.style.marginTop = '8px';
        var chosen = inst.bs.chosen[k];
        st.options.forEach(function (o, oi) {
          var b = el('button', 'choice');
          b.type = 'button';
          b.style.width = '100%';
          b.setAttribute('aria-pressed', chosen === oi ? 'true' : 'false');
          if (chosen === oi) b.style.borderColor = 'var(--accent)';
          b.appendChild(el('span', 'choice-text', esc(o.t)));
          b.addEventListener('click', lockWrap(function () {
            inst.bs.chosen[k] = oi;
            inst.bs.step = k + 1;
            ctx.markDirty();
            renderAll();
          }, ctx));
          list.appendChild(b);
        });
        body.appendChild(list);
        if (chosen !== undefined && chosen !== null) {
          var o = st.options[chosen];
          var oc = el('div', 'branch-outcome ' + (o.ok ? 'good' : 'oops'));
          oc.innerHTML = (o.ok ? '✓ ' : '✗ ') + esc(o.outcome);
          body.appendChild(oc);
        }
        box.appendChild(body);
        holder.appendChild(box);
      });
    }
    renderAll();
    api.canCheck = function () { return inst.bs.chosen.length >= inst.steps.length; };
    api.collect = function () { return { chosen: inst.bs.chosen.slice() }; };
    api.reveal = function (res) {
      $all('.branch-outcome', holder).forEach(function (oc) { oc.style.display = 'block'; });
    };
    api.lock = function () {};
    api.unlock = function () {};
    api.apply = function (val) {
      if (val && val.chosen && val.chosen.length) {
        inst.bs.chosen = val.chosen.slice();
        inst.bs.step = Math.max(inst.bs.step, val.chosen.length);
        renderAll();
      }
    };
    return api;
  }
};

TYPE_IMPL.spot = {

    });

TYPE_IMPL.triage = {

    api.apply = function (val) { (val || []).forEach(function (ci, k) { if (ci !== null && ci !== undefined && groups[k]) groups[k].radios[ci].checked = true; }); };

(function () {

function pillClass(a) {

/* ---------- flow ---------- */
var pendingUsername = '';
function startExam() {
  var fresh = C.freshState();

  var st = S();
  st.started = true;
  st.t = CFG.seconds;
  C.resetTimerWarnings();
  DATA.forEach(function (ex, i) {
    st.inst[i] = C.makeInstance(ex);
    st.ans[i] = { checked: false, skipped: false, hintUsed: false, dirty: false, draft: null, val: undefined, res: null, earned: 0, max: ex.points, label: null, sum: '', cor: '' };
  });
  st.seq = C.shuffle(DATA.map(function (ex, i) { return i; }));
  st.cur = 0;
  C.show('#exam-screen');
  $('#exam-title').textContent = CFG.title;
  var sev = $('#sev-chip');
  sev.className = 'chip sev-' + CFG.severity;
  sev.textContent = CFG.severity === 'hard' ? '🔥 HARD' : '🎯 MEDIUM';
  C.renderTimer();
  C.renderPause();
  C.renderScore();
  C.renderNav();
  C.renderQ();
  C.focusQ();
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
window.addEventListener('message', function (event) {
  if (!event.data || (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT')) return;
  pendingUsername = event.data.username || '';
  if (C.S) C.S.username = pendingUsername;
  var slot = $('#intro-candidate');
  if (slot) slot.textContent = pendingUsername ? ('Candidate: ' + pendingUsername) : '';
  /* theme: this file ships a dark theme only, so the site's light theme is deliberately not applied. */
});

document.addEventListener('DOMContentLoaded', function () {
  $('#btn-pause').addEventListener('click', function () {
    var st = S();
    if (st.finished || !st.started) return;
    st.manualPause = !st.manualPause;
    C.renderPause();
  });
  $('#btn-resume').addEventListener('click', function () {
    var st = S();
    if (st.finished || !st.started || !st.manualPause) return;
    st.manualPause = false;
    C.renderPause();
  });
  $('#btn-check').addEventListener('click', C.onCheck);
  $('#btn-hint').addEventListener('click', C.onHint);
  $('#btn-skip').addEventListener('click', C.onSkip);
  $('#btn-revise').addEventListener('click', C.onRevise);
  $('#btn-next').addEventListener('click', C.onNext);
  $('#btn-prev').addEventListener('click', C.onPrev);
  $('#btn-submit').addEventListener('click', C.onSubmit);
  $('#confirm-yes').addEventListener('click', function () { C.closeConfirm(true); });
  $('#confirm-no').addEventListener('click', function () { C.closeConfirm(false); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') C.closeConfirm(false); });
  renderIntro();
  C.show('#intro-screen');
});

window.__ENGINE_RESULTS__ = { renderResults: renderResults };
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
