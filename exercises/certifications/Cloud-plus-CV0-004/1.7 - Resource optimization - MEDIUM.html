<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CompTIA Cloud+ — Chapter 1.7 Resource Optimization — MEDIUM practice exam</title>

  "topicId": "cloud-plus",

  "passMark": 70
}</script>
<style>

:root{
  --bg:#0b1220; --bg2:#101a2e; --panel:#131f37; --panel2:#0f1830;
  --line:#22324f; --line2:#2c3f5f;
  --text:#e6edf6; --muted:#9fb0c8; --muted2:#7689a6;
  --accent:#39d0d8; --accent2:#2bb6c9;
  --ok:#3fd07a; --warn:#f1c84b; --bad:#ff6b6b; --amber:#f4a142;
  --skip:#b48aff; --hint:#7aa2ff;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --radius:10px;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{min-height:100vh}
a{color:var(--accent)}
button{font-family:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:14px}

/* Layout */
#app{max-width:1080px;margin:0 auto;padding:14px 16px 60px}
header.exam-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:8px;z-index:30}
.exam-bar .brand{display:flex;align-items:center;gap:10px;font-weight:600}
.exam-bar .badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge.medium{background:#13314f;color:#6dd5ed;border:1px solid #2b5277}
.badge.hard{background:#3f1530;color:#ff9bb3;border:1px solid #6e2747}
.exam-bar .grow{flex:1 1 auto}
.exam-bar .timer{font-family:var(--mono);font-size:14px;padding:6px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:8px;min-width:96px;text-align:center}
.timer.warn{color:var(--warn);border-color:var(--warn)}
.timer.crit{color:var(--bad);border-color:var(--bad)}
.exam-bar .score{font-family:var(--mono);font-size:14px;padding:6px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:8px}
.progress-track{height:6px;background:#0b1220;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s ease}
.pausetag{margin-left:6px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);background:rgba(241,200,75,.08);display:inline-block}
.pausetag.checkpause{border-color:var(--accent);color:var(--accent);background:rgba(57,208,216,.08)}
.pausetag.both{border-color:var(--amber);color:var(--amber);background:rgba(244,161,66,.08)}

/* Intro */
.intro{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-top:14px}
.intro h1{margin:0 0 4px;font-size:22px}
.intro h2{margin:18px 0 6px;font-size:15px;color:var(--accent)}
.intro ul{margin:6px 0;padding-left:22px}
.intro ul li{margin:3px 0}
.intro .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.intro .meta-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.intro .meta-grid b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kw-panel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px}
.kw-panel h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.kw-grid .kw-block{background:#0b1220;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.kw-grid .kw-block h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kw-grid .kw-block .kw{display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;background:#0f1830;border:1px solid var(--line2);border-radius:6px;font-size:11px;color:var(--text);font-family:var(--mono)}

/* Exercise card */
.ex-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:14px;padding:16px 18px}
.ex-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ex-head .num{font-family:var(--mono);font-size:12px;color:var(--accent);background:#0b1220;border:1px solid var(--line2);padding:3px 8px;border-radius:6px}
.ex-head .type{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2)}
.ex-head .theme{font-size:11px;color:var(--muted);background:#0f1830;border:1px solid var(--line2);padding:2px 8px;border-radius:6px}
.ex-head .pts{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono)}
.ex-head .pts .earned{color:var(--ok)}
.label-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);background:#0b1220}
.label-tag.scenario{color:var(--accent);border-color:var(--accent)}
.label-tag.question{color:var(--warn);border-color:var(--warn)}
.label-tag.answers{color:var(--ok);border-color:var(--ok)}

.scenario-block{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin:6px 0 10px}
.question-block{background:#161f33;border:1px solid var(--line2);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;margin:6px 0 10px;font-weight:500}
.answers-block{background:#0b1220;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:6px 0 10px}

/* QCM */
.qcm-option{display:flex;align-items:flex-start;gap:10px;padding:10px;margin:6px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-height:44px;transition:border-color .15s,background .15s}
.qcm-option:hover{border-color:var(--accent)}
.qcm-option input{margin-top:3px;accent-color:var(--accent)}
.qcm-option .letter{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700;min-width:18px}
.qcm-option.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.qcm-option.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}
.qcm-option.missed{border-color:var(--warn);background:rgba(241,200,75,.08)}
.qcm-option .icon{font-weight:700;margin-left:auto}
.qcm-option.correct .icon{color:var(--ok)}
.qcm-option.wrong .icon{color:var(--bad)}
.qcm-option.missed .icon{color:var(--warn)}

/* Drag and drop */
.dnd-pool{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;margin-bottom:8px;min-height:50px}
.dnd-item{padding:6px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:6px;cursor:grab;font-size:13px;user-select:none;font-family:var(--mono)}
.dnd-item:active{cursor:grabbing}
.dnd-item.dragging{opacity:.4}
.dnd-item.placed{opacity:.35;cursor:default}
.dnd-bucket{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;min-height:60px}
.dnd-bucket .bucket-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.dnd-bucket.dropzone{min-height:50px;padding:8px;border:1px dashed var(--line2);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px}
.dnd-bucket .placed-item{padding:4px 8px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;font-size:12px;font-family:var(--mono);display:flex;align-items:center;gap:6px}
.dnd-bucket .placed-item .rmv{cursor:pointer;color:var(--bad);font-weight:700}
.dnd-bucket.correct .dropzone{border-color:var(--ok);background:rgba(63,208,122,.05)}
.dnd-bucket.wrong .dropzone{border-color:var(--bad);background:rgba(255,107,107,.05)}

/* Ordering */
.order-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.order-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px}
.order-item .pos{font-family:var(--mono);font-size:12px;color:var(--accent);background:#0b1220;border:1px solid var(--line2);padding:2px 8px;border-radius:5px;min-width:28px;text-align:center}
.order-item .content{flex:1}
.order-item .arrows{display:flex;flex-direction:column}
.order-item .arrows button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;line-height:1;font-size:14px;min-width:24px}
.order-item .arrows button:hover{color:var(--accent)}
.order-item.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.order-item.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}

/* Fill blank */
.fb-sentence{font-size:15px;line-height:1.8;padding:8px 4px}
.fb-blank{display:inline-block;min-width:120px;padding:2px 8px;margin:0 2px;border-bottom:2px dashed var(--accent);background:rgba(57,208,216,.06);border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.fb-blank.filled{cursor:pointer}
.fb-blank.correct{border-color:var(--ok);color:var(--ok);background:rgba(63,208,122,.08)}
.fb-blank.wrong{border-color:var(--bad);color:var(--bad);background:rgba(255,107,107,.08);text-decoration:line-through}
.fb-bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;margin-top:8px;min-height:44px}
.fb-chip{padding:5px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:6px;font-size:13px;font-family:var(--mono);cursor:pointer;min-height:30px}
.fb-chip:hover{border-color:var(--accent)}
.fb-chip.used{opacity:.35;cursor:default}

/* Matching */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.match-col{display:flex;flex-direction:column;gap:6px}
.match-row{padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px;display:flex;flex-direction:column;gap:6px}
.match-row .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.match-row select{background:#0b1220;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font-size:13px;min-height:34px;font-family:var(--sans)}
.match-row.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.match-row.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}

/* Terminal */
.term{background:#06090f;border:1px solid var(--line2);border-radius:8px;padding:10px;font-family:var(--mono);font-size:14px;min-height:160px;overflow:auto}
.term .prompt{color:var(--accent)}
.term .out{color:var(--muted);white-space:pre-wrap}
.term .out.err{color:var(--bad)}
.term-input{background:#06090f;border:1px solid var(--line2);color:var(--accent);font-family:var(--mono);font-size:14px;padding:8px;border-radius:6px;width:100%;min-height:38px}
.term-input:focus{border-color:var(--accent);outline:none}
.term-feedback{margin-top:6px;font-size:13px}
.term-feedback.ok{color:var(--ok)}
.term-feedback.bad{color:var(--bad)}

/* Log viewer */
.lv-toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.lv-filter{flex:1;min-width:200px;background:#0b1220;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:13px;min-height:34px;font-family:var(--mono)}
.lv-toolbar button{padding:6px 10px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;color:var(--text);cursor:pointer;min-height:34px}
.lv-toolbar button:hover{border-color:var(--accent)}
.lv-line{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;background:#06090f;border:1px solid var(--line2);border-radius:4px;margin:3px 0;cursor:pointer;min-height:34px;font-family:var(--mono);font-size:13px;line-height:1.4}
.lv-line:hover{border-color:var(--accent)}
.lv-line.sel{border-color:var(--accent);background:rgba(57,208,216,.08)}
.lv-line.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.lv-line.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}
.lv-line .mark{font-weight:700;color:var(--accent);min-width:18px}
.lv-line.correct .mark{color:var(--ok)}
.lv-line.wrong .mark{color:var(--bad)}
.lv-line .ts{color:var(--muted2);min-width:130px}
.lv-line .sev{padding:0 4px;border-radius:3px;font-size:11px;font-weight:700}
.lv-line .sev.info{background:#13314f;color:#6dd5ed}
.lv-line .sev.warn{background:#3f3a14;color:var(--warn)}
.lv-line .sev.err{background:#3f1518;color:var(--bad)}
.lv-line .sev.crit{background:#3f1530;color:#ff9bb3}

/* Spot mistake */
.sm-code{background:#06090f;border:1px solid var(--line2);border-radius:8px;padding:8px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre;overflow:auto}
.sm-line{display:flex;align-items:flex-start;gap:8px;padding:3px 6px;border-radius:3px;cursor:pointer;min-height:28px}
.sm-line:hover{background:rgba(57,208,216,.06)}
.sm-line.sel{background:rgba(57,208,216,.15)}
.sm-line.correct{background:rgba(63,208,122,.15)}
.sm-line.wrong{background:rgba(255,107,107,.15)}
.sm-line .lnum{color:var(--muted2);min-width:32px;text-align:right;user-select:none}
.sm-line .mark{margin-left:auto;font-weight:700}
.sm-line.correct .mark{color:var(--ok)}
.sm-line.wrong .mark{color:var(--bad)}

/* Prioritize */
.prio-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.prio-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px}
.prio-item .rank{font-family:var(--mono);font-weight:700;color:var(--accent);min-width:24px;text-align:center}
.prio-item .content{flex:1;font-size:13px}
.prio-item .arrows{display:flex;flex-direction:column}
.prio-item .arrows button{background:none;border:none;color:var(--muted);cursor:pointer;padding:1px;line-height:1;font-size:14px;min-width:24px}
.prio-item .arrows button:hover{color:var(--accent)}
.prio-item.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.prio-item.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}
.prio-item.partial{border-color:var(--warn);background:rgba(241,200,75,.08)}

/* Scenario branching */
.sb-stage{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:6px 0}
.sb-stage .stage-num{font-family:var(--mono);color:var(--accent);font-size:12px}
.sb-stage .stage-q{margin:6px 0;font-weight:500}
.sb-stage .choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sb-choice{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:6px;cursor:pointer;min-height:44px;font-size:13px}
.sb-choice:hover{border-color:var(--accent)}
.sb-choice.sel{border-color:var(--accent);background:rgba(57,208,216,.08)}
.sb-choice.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.sb-choice.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}

/* Dual perspective */
.dp-tabs{display:flex;gap:6px;margin-bottom:8px}
.dp-tab{padding:6px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;cursor:pointer;font-size:13px;min-height:34px}
.dp-tab.active{background:var(--accent);color:#0b1220;border-color:var(--accent);font-weight:600}
.dp-pane{display:none}
.dp-pane.active{display:block}

/* Hint / feedback / actions */
.hint-block{background:rgba(122,162,255,.06);border:1px dashed #7aa2ff;border-radius:8px;padding:8px 10px;margin:8px 0;color:var(--hint);font-size:13px}
.feedback-block{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.feedback-block .head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.feedback-block .head .pts-earned{font-family:var(--mono);font-size:13px;color:var(--ok)}
.feedback-block .head .pts-lost{font-family:var(--mono);font-size:13px;color:var(--bad)}
.feedback-block .head .pts-partial{font-family:var(--mono);font-size:13px;color:var(--warn)}
.feedback-block .explanation{font-size:14px;color:var(--text);line-height:1.6}
.feedback-block .explanation strong{color:var(--accent)}
.feedback-block .elements{margin-top:6px}
.feedback-block .el{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;font-family:var(--mono)}
.feedback-block .el .st{min-width:20px;font-weight:700}
.feedback-block .el .st.ok{color:var(--ok)}
.feedback-block .el .st.bad{color:var(--bad)}
.feedback-block .el .st.warn{color:var(--warn)}

.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#0b1220;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ok{background:var(--ok);color:#06140c;border-color:var(--ok)}
.btn.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.skip{background:transparent;color:var(--skip);border-color:var(--skip)}
.btn.hint{background:transparent;color:var(--hint);border-color:var(--hint)}
.btn.nav-arrow{min-width:44px;text-align:center}

/* Navigator */
.navigator{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-top:12px}
.navigator h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.nav-grid{display:flex;flex-wrap:wrap;gap:6px}
.nav-cell{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#0b1220;border:1px solid var(--line2);border-radius:5px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted)}
.nav-cell:hover{border-color:var(--accent)}
.nav-cell.current{border-color:var(--accent);color:var(--accent);background:rgba(57,208,216,.1)}
.nav-cell.checked{background:rgba(63,208,122,.12);border-color:var(--ok);color:var(--ok)}
.nav-cell.skipped{background:rgba(180,138,255,.12);border-color:var(--skip);color:var(--skip)}
.nav-cell.partial{background:rgba(241,200,75,.12);border-color:var(--warn);color:var(--warn)}
.nav-cell.wrong{background:rgba(255,107,107,.12);border-color:var(--bad);color:var(--bad)}

/* Results */
.results{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-top:14px}
.results .result-head{text-align:center;padding:14px;border-radius:10px;margin-bottom:14px}
.results .result-head.pass{background:linear-gradient(135deg,rgba(63,208,122,.18),rgba(63,208,122,.06));border:1px solid var(--ok)}
.results .result-head.fail{background:linear-gradient(135deg,rgba(255,107,107,.18),rgba(255,107,107,.06));border:1px solid var(--bad)}
.results .result-head h2{margin:0;font-size:26px;letter-spacing:.05em}
.results .result-head .big{font-family:var(--mono);font-size:42px;margin:6px 0}
.results .result-head.pass h2{color:var(--ok)}
.results .result-head.fail h2{color:var(--bad)}
.results .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}
.results .summary-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.results .summary-grid div b{display:block;font-size:22px;font-family:var(--mono)}
.results .summary-grid div span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.results h3{margin:14px 0 6px;font-size:15px;color:var(--accent)}
.per-exercise{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font-size:13px}
.per-exercise .pe-head{display:flex;align-items:center;gap:8px}
.per-exercise .pe-head .pe-num{font-family:var(--mono);color:var(--accent)}
.per-exercise .pe-head .pe-tag{font-size:10px;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line2)}
.per-exercise .pe-head .pe-tag.full{color:var(--ok);border-color:var(--ok)}
.per-exercise .pe-head .pe-tag.partial{color:var(--warn);border-color:var(--warn)}
.per-exercise .pe-head .pe-tag.zero{color:var(--bad);border-color:var(--bad)}
.per-exercise .pe-head .pe-tag.skipped{color:var(--skip);border-color:var(--skip)}
.per-exercise .pe-head .pe-pts{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.per-exercise .pe-body{margin-top:6px;color:var(--muted);line-height:1.5}
.per-exercise .pe-body .qa{display:block;margin:3px 0;font-family:var(--mono);font-size:12px;color:var(--text)}
.per-exercise .pe-body .qa .key{color:var(--muted2)}
.per-exercise .pe-body .qa .your{color:var(--warn)}
.per-exercise .pe-body .qa .right{color:var(--ok)}
.per-exercise .pe-body .exp{margin-top:6px;color:var(--text)}

/* Responsive */
@media (max-width:720px){
  .match-grid{grid-template-columns:1fr}
  .exam-bar{position:static}
  .results .result-head .big{font-size:34px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

<body>
<main id="app" role="main"></main>
<script>
window.__EXERCISES = [{"type": "qcm-single", "theme": "Idle Resources & Sustainability", "scenario": "You are a FinOps analyst at Northwind Cloud. The monthly AWS bill grew 18% in three months. Your director asks you to flag EC2 instances that look idle so the platform team can right-size or terminate them. You open CloudWatch and look at the last 14 days for instance i-0abcd1234.", "prompt": "Which set of CloudWatch observations is the <strong>strongest</strong> signal that the instance is genuinely idle and a candidate for termination?", "options": [{"id": "A", "text": "CPUUtilization averaged 14% for the last 7 days, with one 90% spike."}, {"id": "B", "text": "CPUUtilization below 5% for 14 days, NetworkIn under 5 MB/day, and no recent API calls."}, {"id": "C", "text": "CPUUtilization below 30% for 48 hours, and the instance has been running for 6 weeks."}, {"id": "D", "text": "CPUUtilization averaged 8% for the last 24 hours, with 2 GB of memory free."}], "correct": "B", "explanation": "An instance is a strong candidate for termination when its CPU stays very low for a sustained period (14 days, not 24 hours), its network activity is near zero, and there are no API calls driving it. Option A shows a real spike (so the instance may serve a periodic load). Option C is too short and 30% is not idle. Option D is too short, and memory is not visible in CloudWatch by default.", "hint": "Look for both a long time window and multiple low-activity signals at the same time."}, {"type": "dragdrop-categorize", "theme": "Pricing & Commitments", "scenario": "Northwind Cloud is reviewing its purchasing strategy. The platform team must match each workload to the most cost-effective purchasing model.", "prompt": "Drag each workload on the left into the purchasing model that fits best.", "buckets": ["Reserved Instances", "Savings Plans", "Spot Instances", "On-Demand"], "correct": {"Reserved Instances": ["24x7 production database (steady, predictable)"], "Savings Plans": ["Microservices on Fargate with steady usage across regions"], "Spot Instances": ["Batch rendering job that can be checkpointed"], "On-Demand": ["Exploratory analytics notebook run by a data scientist for one afternoon"]}, "explanation": "Reserved Instances fit steady 24x7 workloads where you commit to a specific instance family. Savings Plans are flexible across instance family, size, OS, and region (and Fargate). Spot fits interruptible, checkpointable workloads. On-Demand fits short-lived exploratory work where commitment is wasteful.", "hint": "Steady + long = reserve; flexible + steady = savings plan; interruptible = spot; brief + unknown = on-demand."}, {"type": "dragdrop-order", "theme": "Storage Optimization", "scenario": "Audit logs land in S3 Standard. After a few weeks they are rarely read. After 90 days they must move to archive storage, and after 7 years they must be deleted.", "prompt": "Order the storage-class transitions of the S3 lifecycle rule from first to last.", "items": ["S3 Standard (day 0)", "S3 Standard-IA (after 30 days)", "S3 Glacier Flexible Retrieval (after 90 days)", "S3 Glacier Deep Archive (after 180 days)", "Delete (after 2555 days / 7 years)"], "correct": ["S3 Standard (day 0)", "S3 Standard-IA (after 30 days)", "S3 Glacier Flexible Retrieval (after 90 days)", "S3 Glacier Deep Archive (after 180 days)", "Delete (after 2555 days / 7 years)"], "explanation": "Standard is for hot data. Standard-IA cuts cost for data accessed monthly or less. Glacier is for archive with retrieval in minutes to hours. Glacier Deep Archive is the cheapest, for long-term retention. Finally the lifecycle rule deletes the object when retention ends.", "hint": "Hot first, then infrequent, then archive, then delete."}, {"type": "fillblank", "theme": "Monitoring & Observability", "scenario": "Your team owns a billing alarm. You want it to fire when monthly spend crosses 80% of the budget. Complete the policy sentence with the right keywords.", "prompt": "Fill the blanks to describe what the alarm watches and what it triggers.", "sentence": ["The CloudWatch alarm uses the metric ", " and triggers an ", " when the threshold breaches ", "% of the monthly budget."], "correct": ["AWS/Billing EstimatedCharges", "SNS notification", "80"], "alternatives": [["EstimatedCharges"], ["sns", "SNS"], ["eighty"]], "distractors": ["EC2 CPUUtilization", "Lambda Invocations", "auto-scaling policy", "50", "95"], "explanation": "The AWS/Billing namespace exposes EstimatedCharges. The alarm compares it to a threshold expressed as a percentage of the budget, and the most common action is to publish to an SNS topic so the team receives an email or chat message. Auto-scaling is not used for billing alarms.", "hint": "The metric lives in the AWS/Billing namespace. Notifications in AWS usually go through a pub/sub service."}, {"type": "matching", "theme": "Storage Optimization", "scenario": "A junior engineer asks which EBS volume type fits each workload. Match each volume type to its best-fit workload.", "prompt": "Match the EBS volume type on the left to the workload on the right that fits it best.", "pairs": [{"left": "gp3 (general purpose SSD)", "right": "Boot volume of a web server with balanced price/performance"}, {"left": "io2 Block Express", "right": "Mission-critical database needing sub-millisecond latency and 64k IOPS"}, {"left": "st1 (Throughput Optimized HDD)", "right": "Big-data / Hadoop workload that is sequential, not random"}, {"left": "sc1 (Cold HDD)", "right": "Least-cost archival of infrequently-accessed block data"}], "explanation": "gp3 gives a baseline performance you can tune independently of size. io2 Block Express is the highest-performance SSD designed for databases. st1 is optimised for sequential throughput at low cost. sc1 is the cheapest HDD class, for rarely-touched data.", "hint": "Highest perf + cost = io2. Boot/web = gp3. Big sequential = st1. Cheapest cold = sc1."}, {"type": "logviewer", "theme": "Network & Data Transfer", "scenario": "Northwind Cloud saw an unexpected data-transfer charge of $1,240 last month. You pull VPC Flow Logs for the suspected window. Use the filter box to narrow by '10[.]55' or 'ACCEPT' or '443'. Select the log lines that show large outbound transfers to public IPs that likely caused the charge.", "prompt": "Select the lines that represent large outbound transfers to public IPs (potential egress cost culprit).", "lines": [{"id": 1, "ts": "2026-09-12 14:02:11", "sev": "info", "text": "2 123456789010 eni-0a1b 10[.]0[.]1[.]42 10[.]0[.]2[.]88 443 443 6 12 1820 ACCEPT OK"}, {"id": 2, "ts": "2026-09-12 14:02:12", "sev": "info", "text": "2 123456789010 eni-0a1b 10[.]0[.]1[.]42 203[.]0[.]113[.]55 443 51234 6 9802 4294967295 ACCEPT OK"}, {"id": 3, "ts": "2026-09-12 14:02:13", "sev": "info", "text": "2 123456789010 eni-0a1b 10[.]0[.]1[.]42 198[.]51[.]100[.]7 443 51289 6 14203 4294967295 ACCEPT OK"}, {"id": 4, "ts": "2026-09-12 14:02:14", "sev": "info", "text": "2 123456789010 eni-0a1b 10[.]0[.]1[.]42 10[.]0[.]2[.]88 22 22 6 8 1120 ACCEPT OK"}, {"id": 5, "ts": "2026-09-12 14:02:15", "sev": "info", "text": "2 123456789010 eni-0a1b 10[.]0[.]1[.]42 192[.]0[.]2[.]99 443 51301 6 14523 4294967295 ACCEPT OK"}, {"id": 6, "ts": "2026-09-12 14:02:16", "sev": "warn", "text": "2 123456789010 eni-0a1b 10[.]0[.]1[.]42 10[.]0[.]2[.]88 3389 3389 6 4 612 ACCEPT OK"}, {"id": 7, "ts": "2026-09-12 14:02:17", "sev": "info", "text": "2 123456789010 eni-0a1b 10[.]0[.]1[.]42 10[.]0[.]3[.]5 443 443 6 7 980 ACCEPT OK"}], "correct": [2, 3, 5], "explanation": "Lines 2, 3 and 5 show accepted outbound traffic to public IPs (203.0.113.x, 198.51.100.x, 192.0.2.x — TEST-NET ranges that we treat as public destinations) with very large byte counts. The high byte count is what creates the egress charge. Lines 1, 4, 6, 7 are internal (10.0.x.x) traffic, which does not incur public egress fees.", "hint": "Two things matter: a destination outside the VPC (public IP) AND a large byte count."}, {"type": "terminal", "theme": "Idle Resources & Sustainability", "scenario": "You need to list every stopped EC2 instance in your current region so the platform team can review them. Use the AWS CLI. Hint: use a 'describe-instances' command with a filter on the instance state. Expected output shape: a JSON list of instance IDs.", "prompt": "Type the AWS CLI command that lists all currently stopped EC2 instances.", "intro": "$ aws ec2 describe-instances --filters ...", "artefact": "", "accept": ["^aws\\s+ec2\\s+describe-instances\\s+--filters\\s+.*Name=instance-state-name,Values=stopped.*$", "^aws\\s+ec2\\s+describe-instances.*instance-state-name.*stopped.*$"], "explanation": "The describe-instances call accepts a filter on instance-state-name with the value 'stopped'. Without that filter you get all instances, which does not answer the question. The output is a JSON document containing Reservations and Instances, which you can pipe to jq to extract only the IDs.", "hint": "Two pieces: a filter name 'instance-state-name' and a value 'stopped'."}, {"type": "spot-mistake", "theme": "Performance & Caching", "scenario": "A junior SRE wrote this Terraform for an Application Load Balancer target tracking auto-scaling policy. Click each line you think is wrong. There is more than one mistake.", "prompt": "Select the lines that are misconfigured.", "lines": ["resource \"aws_autoscaling_policy\" \"web\" {", "  name                   = \"cpu-target-70\"", "  policy_type            = \"TargetTrackingScaling\"", "  autoscaling_group_name = aws_autoscaling_group.web.name", "  target_tracking_configuration {", "    predefined_metric_specification {", "      predefined_metric_type = \"ALBRequestCountPerTarget\"", "      resource_label         = \"app/my-alb/50dc/TargetGroup/my-tg\"", "    }", "    target_value = 95.0", "    scale_out_cooldown = 60", "    scale_in_cooldown  = 30", "  }", "}"], "correct": [6, 7, 10, 12], "explanation": "Line 6/7: the policy is named 'cpu-target-70' but it tracks ALBRequestCountPerTarget, which counts HTTP requests per target, not CPU. Either rename the policy or change the metric to ASGAverageCPUUtilization. Line 10: target_value of 95.0 is far too aggressive for an ALB request count metric, and 'ALBRequestCountPerTarget' requires a target_value expressed in requests per minute. Line 12: scale_in_cooldown of 30 seconds is too short and will cause flapping.", "hint": "There are 4 lines that look off: the metric choice, the resource_label dependencies, the target value, and one cooldown."}, {"type": "prioritize", "theme": "FinOps & Governance", "scenario": "You have 5 candidate optimization actions. Rank them from highest expected monthly savings to lowest. You can only action them in this order this quarter.", "prompt": "Drag the actions into the correct order, biggest savings first.", "items": ["Terminate 40 zombie EC2 instances that have been idle for 60+ days", "Move 12 TB of audit logs older than 90 days from S3 Standard to Glacier Deep Archive", "Switch 10 steady-state m5.2xlarge instances to a 1-year compute Savings Plan", "Enable S3 Intelligent-Tiering on a bucket with mixed access patterns", "Replace 4 gp2 EBS volumes with gp3 volumes of the same size"], "correct": ["Terminate 40 zombie EC2 instances that have been idle for 60+ days", "Switch 10 steady-state m5.2xlarge instances to a 1-year compute Savings Plan", "Move 12 TB of audit logs older than 90 days from S3 Standard to Glacier Deep Archive", "Replace 4 gp2 EBS volumes with gp3 volumes of the same size", "Enable S3 Intelligent-Tiering on a bucket with mixed access patterns"], "explanation": "Terminating 40 long-idle instances usually saves the most because each instance is a continuous compute charge. Savings Plans reduce hourly rate across many steady instances. Archive migration on a large dataset is meaningful but smaller per TB than compute. gp3 swap saves about 20% on the volume only. Intelligent-Tiering helps when patterns are unknown but the savings are usually small at first.", "hint": "Compute is the biggest bill for most shops; archive is cheaper per GB but adds up; volume swaps and Intelligent-Tiering are smaller."}, {"type": "scenario-branching", "theme": "FinOps & Governance", "scenario": "A billing alarm fires: monthly spend jumped 38% in 5 days. You are the FinOps analyst on call. Work through three decision points to find the cause.", "prompt": "Make the right choice at each stage.", "stages": [{"q": "STAGE 1: Where do you look FIRST to narrow down the source?", "choices": [{"id": "A", "text": "Open CloudTrail event history and review the last 24 hours of API calls."}, {"id": "B", "text": "Open AWS Cost Explorer and group by service, then by region."}, {"id": "C", "text": "Restart the billing-agent pod on the FinOps cluster."}, {"id": "D", "text": "Email every engineering team lead asking who launched what."}], "correct": "B"}, {"q": "STAGE 2: Cost Explorer shows EC2 is the fastest-growing service. What do you do next?", "choices": [{"id": "A", "text": "Immediately terminate the 5 largest instances by instance type."}, {"id": "B", "text": "Group EC2 costs by tag 'team' and by 'instance type' to find the biggest contributors."}, {"id": "C", "text": "Open a support case with AWS and ask them to refund the difference."}, {"id": "D", "text": "Switch the entire account to a Savings Plan."}], "correct": "B"}, {"q": "STAGE 3: The 'data-migration' team tag accounts for 80% of the spike. What is the right action?", "choices": [{"id": "A", "text": "Contact the data-migration team owner, share the Cost Explorer breakdown, and ask for justification or shutdown."}, {"id": "B", "text": "Apply a Service Control Policy that blocks all EC2 RunInstances calls account-wide."}, {"id": "C", "text": "Re-tag every resource in the account to confuse the breakdown."}, {"id": "D", "text": "Ignore it; one-off migrations always spike then drop."}], "correct": "A"}], "explanation": "Stage 1: Cost Explorer is the AWS-native tool that shows where spend actually grew. CloudTrail is useful later for who did it, but it does not aggregate money. Stage 2: tags and instance-type grouping isolate the source. Stage 3: the right response is to surface the data to the team owner and ask for justification, not to block all EC2 globally.", "hint": "First see where the money went, then who spent it, then talk to them."}, {"type": "dual-perspective", "theme": "Containers & Serverless", "scenarioBlue": "Blue team view: A Lambda function writes CloudWatch logs to a log group that is also subscribed by a Lambda-based anomaly detector. The team wants to detect if someone tampers with the log delivery (for example, by repeatedly failing invocations to back up the log queue). Choose the control that most directly detects tampering with log delivery.", "scenarioRed": "Red team view: You have valid AWS credentials for a low-privilege role that can invoke a Lambda function. Your goal is to make the log delivery look broken without tripping the obvious alarm on invocation errors. Which technique is the most subtle way to do that?", "qBlue": "Which control most directly detects tampering with log delivery?", "qRed": "Which technique is the most subtle way to disrupt log delivery without raising the obvious alarm?", "optionsBlue": [{"id": "A", "text": "Enable CloudWatch Logs Insights and run a daily query for abnormal log volume patterns."}, {"id": "B", "text": "Enable metric filters on 'errors' and 'throttles' for the log group, with alarms on each."}, {"id": "C", "text": "Restrict Lambda invoke permissions with a resource-based policy that only allows a known principal."}, {"id": "D", "text": "Enable CloudTrail data-event logging on the Lambda Invoke API."}], "optionsRed": [{"id": "A", "text": "Invoke the Lambda 10,000 times to trigger throttling and bury legitimate errors."}, {"id": "B", "text": "Send crafted events that succeed but cause the destination log group to receive large, structured payloads that exceed ingestion rate limits."}, {"id": "C", "text": "Delete the CloudWatch log group directly."}, {"id": "D", "text": "Disable the Lambda function using UpdateFunctionConfiguration."}], "correct": {"blue": "B", "red": "B"}, "explanation": "Blue: metric filters on errors and throttles are the most direct signal that log delivery itself is degraded, because they fire on the exact failure modes of the log pipeline. Red: the subtle approach is to make the function succeed while overwhelming the log ingestion, which keeps invocation metrics clean while the log group falls behind. The other red options raise obvious alarms.", "hint": "Blue wants the most specific signal of log-pipeline distress. Red wants the function to look healthy while the pipeline suffers."}, {"type": "report-fill", "theme": "FinOps & Governance", "scenario": "You are filling the monthly FinOps report. The CFO wants the right keywords in the right blanks.", "prompt": "Fill each blank with the keyword from the bank that makes the sentence true.", "sentence": ["This month, our biggest saving came from ", " 40 zombie EC2 instances that had not sent CloudWatch metrics in 60 days. Our second biggest saving came from applying a ", " to 8 steady-state m5.2xlarge instances, lowering the effective hourly rate. To prevent regression, we enabled AWS ", " to alert us when daily spend grows by more than 20% week over week."], "correct": ["terminating", "Savings Plan", "Cost Anomaly Detection"], "alternatives": [["delete", "removing"], ["Compute Savings Plan", "savings plan"], ["anomaly detection", "Cost Explorer"]], "distractors": ["over-provisioning", "CloudTrail", "IAM", "burstable", "Spot Fleet"], "explanation": "The report describes the actual FinOps loop: take idle resources off, commit to steady workloads via a Savings Plan, and use Cost Anomaly Detection so the spike you just lived through is caught early next time. None of the distractor keywords describe the actions in the sentence.", "hint": "The three blanks are about (1) what you did to instances, (2) what commitment you bought, (3) what AWS feature detects spend spikes."}, {"type": "qcm-single", "theme": "Right-Sizing & Scaling", "scenario": "A t3.medium web server in your fleet exhausted its CPU credits and now runs at ~10% baseline. Your team wants to recover performance while keeping cost reasonable.", "prompt": "Which action most directly fixes CPU-credit exhaustion on a burstable instance without paying for capacity you do not need?", "options": [{"id": "A", "text": "Switch to a c5.4xlarge so you have plenty of headroom."}, {"id": "B", "text": "Enable Unlimited mode on the t3.medium and let it spend additional credits as needed."}, {"id": "C", "text": "Move the workload to a Spot Instance to lower the price."}, {"id": "D", "text": "Set the instance to hibernate every night."}], "correct": "B", "explanation": "T3 instances support Unlimited mode, where surplus CPU usage is billed as a small extra charge instead of throttling the workload. This keeps the workload responsive when it bursts without committing to a much larger fixed instance. Switching to a 16-vCPU c5.4xlarge is wasteful. Spot does not help because burstable credits are not about price. Hibernate makes the workload unavailable.", "hint": "Burstable instances have a mode that lets you pay for extra bursts instead of throttling."}, {"type": "dragdrop-categorize", "theme": "Containers & Serverless", "scenario": "Your platform team is training new hires on Kubernetes resource management. Drag each concept to what it actually controls.", "prompt": "Drag each K8s concept to the bucket that describes what it controls.", "buckets": ["Per-pod guarantees", "Per-pod ceilings", "Cluster-wide limits", "Horizontal scaling"], "correct": {"Per-pod guarantees": ["resources.requests.cpu", "resources.requests.memory"], "Per-pod ceilings": ["resources.limits.cpu", "resources.limits.memory"], "Cluster-wide limits": ["ResourceQuota", "LimitRange"], "Horizontal scaling": ["HPA (Horizontal Pod Autoscaler)"]}, "explanation": "requests are what the scheduler guarantees the pod. limits are the hard ceiling per pod. ResourceQuota and LimitRange live at namespace level and bound total consumption. HPA scales the number of pod replicas in response to metrics.", "hint": "Two per-pod, two cluster-wide, one for replicas."}, {"type": "fillblank", "theme": "IaC & Automation", "scenario": "You want Terraform to set the EC2 instance type based on the 'env' tag, so dev gets small and prod gets large. Complete the local value expression.", "prompt": "Fill the blanks so the local 'instance_type' returns t3.micro for env=dev, m5.large otherwise.", "sentence": ["locals { instance_type = ", "(var.env == \"dev\" ? \"t3.micro\" : ", "\") }"], "correct": ["terraform", "m5.large"], "alternatives": [["tf"], ["m5.xlarge"]], "distractors": ["CloudFormation", "Ansible", "t2.micro", "c5.2xlarge", "Packer"], "explanation": "The conditional expression is a ternary, valid inside any Terraform locals block. The first blank names the tool whose language we are writing. The second blank picks the prod instance type. CloudFormation uses its own syntax, not this expression.", "hint": "The tool is the most popular IaC for AWS that uses HCL. The default prod size is a common general-purpose m5 instance."}, {"type": "matching", "theme": "Monitoring & Observability", "scenario": "Match each CloudWatch metric to the operational signal it gives you.", "prompt": "Match the metric on the left to what it tells you on the right.", "pairs": [{"left": "CPUUtilization", "right": "How busy the vCPUs of an EC2 instance are"}, {"left": "NetworkIn", "right": "Bytes received by the instance from the network"}, {"left": "DiskReadOps", "right": "Number of read operations on the instance store or EBS"}, {"left": "StatusCheckFailed", "right": "Whether AWS or the instance itself failed a health check"}], "explanation": "These are the four most common EC2 metrics. CPUUtilization reflects vCPU busy time. NetworkIn tracks incoming bytes. DiskReadOps counts read operations on the disk. StatusCheckFailed is 0 when healthy and 1 when AWS (StatusCheckFailed_System) or the instance (StatusCheckFailed_Instance) reports a problem.", "hint": "Each metric name says what it measures pretty literally."}, {"type": "dragdrop-order", "theme": "FinOps & Governance", "scenario": "The FinOps Foundation defines a lifecycle for cloud financial management. Put the three phases in the right order, first to last.", "prompt": "Order the FinOps lifecycle phases from first to last.", "items": ["Inform — visibility and allocation of cloud spend", "Optimize — right-size, commit, and reduce waste", "Operate — embed FinOps into engineering processes and continuous improvement"], "correct": ["Inform — visibility and allocation of cloud spend", "Optimize — right-size, commit, and reduce waste", "Operate — embed FinOps into engineering processes and continuous improvement"], "explanation": "You cannot optimize what you cannot see, so visibility (Inform) comes first. Once spend is allocated to teams and tagged, you can act on it (Optimize). Only when optimization is sustained over time does it become business-as-usual (Operate).", "hint": "See it, then fix it, then make it normal."}, {"type": "qcm-multi", "theme": "Storage Optimization", "scenario": "A bucket has 9 TB of mixed-age log objects. Pick every action that meaningfully reduces S3 cost for this bucket.", "prompt": "Select ALL actions that reduce cost (3 correct).", "options": [{"id": "A", "text": "Enable a lifecycle rule that moves objects older than 30 days to Standard-IA."}, {"id": "B", "text": "Switch the bucket to Intelligent-Tiering for objects with unknown access patterns."}, {"id": "C", "text": "Add a second bucket tag named 'cost-centre'."}], "correct": ["A", "B"], "explanation": "A lifecycle rule that moves cold objects to Standard-IA saves on storage price. Intelligent-Tiering moves objects between access tiers automatically based on access patterns, also saving money for mixed workloads. Adding a tag does not change storage cost on its own; tags are for cost allocation, not for the storage bill itself. Note: only two of the three offered actions reduce cost, so partial credit applies if you selected A and B but missed the trap of C.", "hint": "Two real storage reductions and one that only changes reporting, not price."}, {"type": "logviewer", "theme": "Containers & Serverless", "scenario": "A Lambda function behind an API Gateway endpoint reports high p99 latency. Use the filter to look for 'cold' or 'Duration'. Select the lines that explain the slowness.", "prompt": "Select the log lines that explain the high p99 latency.", "lines": [{"id": 1, "ts": "2026-09-15 10:00:01", "sev": "info", "text": "START RequestId: a1 Version: $LATEST"}, {"id": 2, "ts": "2026-09-15 10:00:01", "sev": "warn", "text": "Initializing runtime (cold start): 2380 ms"}, {"id": 3, "ts": "2026-09-15 10:00:01", "sev": "info", "text": "Memory allocated: 3008 MB"}, {"id": 4, "ts": "2026-09-15 10:00:04", "sev": "info", "text": "END RequestId: a1"}, {"id": 5, "ts": "2026-09-15 10:00:04", "sev": "info", "text": "REPORT RequestId: a1 Duration: 3120 ms Billed Duration: 3120 ms Memory Size: 3008 MB Max Memory Used: 410 MB"}, {"id": 6, "ts": "2026-09-15 10:00:09", "sev": "info", "text": "START RequestId: a2 Version: $LATEST"}, {"id": 7, "ts": "2026-09-15 10:00:09", "sev": "info", "text": "END RequestId: a2"}, {"id": 8, "ts": "2026-09-15 10:00:09", "sev": "info", "text": "REPORT RequestId: a2 Duration: 380 ms Billed Duration: 380 ms Memory Size: 3008 MB Max Memory Used: 410 MB"}], "correct": [2, 5], "explanation": "Line 2 reports a 2,380 ms cold start. Line 5 reports the full request duration was 3,120 ms, but only 410 MB of the 3,008 MB allocated was used. The cold start explains the p99 spike, and the over-allocated memory means the platform team is paying for memory it does not use. Lowering memory would not fix the cold ry of HA pair, 0 days low util"], "explanation": "The most urgent to downsize is the one that is the most under-used AND the most expensive. db.r5.2xlarge is the largest of the low-use set, so downsizing it saves the most money fastest. The t3.medium is smaller but still a candidate. db.r5.large is busier and has a replica, so change carefully. The m5.4xlarge at 85% CPU is healthy and should NOT be downsized.", "hint": "Sort by: low CPU + low connections + bigger instance = more urgent."}, {"type": "scenario-branching", "theme": "Performance & Caching", "scenario": "You operate an e-commerce API. Pick the right autoscaling policy at each stage.", "prompt": "Make the right choice at each stage.", "stages": [{"q": "STAGE 1: The API has predictable traffic: 10x spike every weekday at 09:00 and 19:00. Which policy is cheapest and simplest for the spike?", "choices": [{"id": "A", "text": "Target tracking on ASGAverageCPUUtilization at 50%."}, {"id": "B", "text": "Scheduled scaling action that scales out 5 minutes before each spike."}, {"id": "C", "text": "Step scaling with two CloudWatch alarms."}, {"id": "D", "text": "No autoscaling; just over-provision for peak."}], "correct": "B"}, {"q": "STAGE 2: The weekend traffic is unpredictable. Which policy do you add for that?", "choices": [{"id": "A", "text": "A second scheduled action for weekends."}, {"id": "B", "text": "Target tracking on ALBRequestCountPerTarget at a target value of 1000 requests/min/target."}, {"id": "C", "text": "Manual on-call scaling."}, {"id": "D", "text": "Increase the instance size of every server."}], "correct": "B"}, {"q": "STAGE 3: Predictive scaling becomes available. When is it most useful?", "choices": [{"id": "A", "text": "When the workload follows a recurring pattern you can forecast from past data."}, {"id": "B", "text": "When traffic is purely random."}, {"id": "C", "text": "When you have already replaced all EC2 with Lambda."}, {"id": "D", "text": "When you want to disable CloudWatch ala or S3 routes the traffic through the AWS backbone instead of the NAT Gateway, removing the per-GB NAT data processing charge and keeping the traffic private. It does not change S3 storage price, request price, or throughput.", "hint": "Think about which line item on the bill actually disappears."}, {"type": "dragdrop-categorize", "theme": "Performance & Caching", "scenario": "Match each autoscaling signal to the policy type best suited to it.", "prompt": "Drag each signal to the policy type that fits best.", "buckets": ["Target tracking", "Step scaling", "Scheduled scaling", "Predictive scaling"], "correct": {"Target tracking": ["Keep ASGAverageCPUUtilization at 50%"], "Step scaling": ["Add 2 instances if alarm > 70%, add 4 if > 85%"], "Scheduled scaling": ["Scale out at 09:00 every weekday, scale in at 22:00"], "Predictive scaling": ["Forecast from 14 days of traffic and pre-warm before the spike"]}, "explanation": "Target tracking sets a metric and lets AWS keep it at the target. Step scaling uses thresholds to add different amounts based on alarm severity. Scheduled scaling is for known recurring times. Predictive scaling analyses past traffic and scales out before a forecasted spike.", "hint": "Each signal maps almost literally to the policy name."}, {"type": "fillblank", "theme": "Storage Optimization", "scenario": "You are writing an S3 lifecycle rule. Complete the configuration sentence with the right storage classes.", "prompt": "Fill in the two storage classes that complete the lifecycle rule.", "sentence": ["After 30 days, move objects from Standard to ", ". After 90 days, move them to ", " for long-term archive."], "correct": ["Standard-IA", "Glacier Deep Archive"], "alternatives": [["Standard-Infrequent Access", "S3-IA", "IA"], ["S3 Glacier Deep Archive", "Glacier"]], "distractors": ["Intelligent-Tiering", "Reduced Redundancy", "Outposts", "EBS"], "explanation": "Standard-IA is the standard next-tier class for infrequently accessed objects (>= 30 days). For long-term archive with retrieval in 12 hours, the right destination is S3 Glacier Deep Archive. Intelligent-Tiering is for unknown access patterns, not for a fixed lifecycle rule.", "hint": "Tier 2 = infrequent access. Tier 3 = deep archive."}, {"type": "matching", "theme": "Reliability & DR", "scenario": "Match each placement decision to the goal it serves.", "prompt": "Match the strategy on the left to the goal on the right.", "pairs": [{"left": "Single instance in one AZ", "right": "Lowest cost, no HA"}, {"left": "Multi-AZ within one region", "right": "Survive an AZ failure"}, {"left": "Multi-region active-active", "right": "Survive a full region failure and serve global users with low latency"}, {"left": "Multi-region pilot light", "right": "Cheap DR footprint that can be promoted on failure"}], "explanation": "A single instance has no HA. Multi-AZ protects against AZ failure but not region failure. Multi-region active-active is the strongest resilience pattern and also helps latency for global users. A pilot light keeps a minimal DR environment warm so you can fail over quickly without paying for full capacity in the second region.", "hint": "Each level adds a layer of failure protection."}, {"type": "terminal", "theme": "FinOps & Governance", "scenario": "You need the total AWS spend for last month, grouped by service. Use the AWS CLI Cost Explorer command. Hint: 'aws ce get-cost-and-usage' with a time period and a group by Service. Expected output: a JSON document with ResultsByTime.", "prompt": "Type the AWS CLI command that returns last month's spend grouped by service.", "intro": "$ aws ce get-cost-and-usage ...", "artefact": "", "accept": ["^aws\\s+ce\\s+get-cost-and-usage\\s+.*--time-period.*--granularity\\s+(MONTHLY|DAILY).*--metrics\\s+BlendedCost.*--group-by.*Service.*$", "^aws\\s+ce\\s+get-cost-and-usage.*--time-period.*--granularity.*--metrics.*BlendedCost.*--group-by.*Type=SERVICE.*$"], "explanation": "aws ce get-cost-and-usage requires --time- 'use strict';
(function(){
  var META;
  try { META = JSON.parse(document.getElementById('cm-exercise-meta').textContent); } catch(e){ META = {}; }
  var EX = window.__EXERCISES || [];
  var PASS = (META.passMark || 70);
  var TOTAL_SECONDS = (META.estimatedMinutes || 60) * 60;

  // ---- State ----
  var S = freshState();

  function freshState(){
    var order = [];
    for (var i=0;i<EX.length;i++) order.push(i);
    order = shuffle(order);
    return {
      view: 'intro',
      currentIndex: 0,
      order: order,
      answers: {},
      checked: {},
      skipped: {},
      hintsUsed: {},
      locked: {},
      timeRemaining: TOTAL_SECONDS,
      manualPause: false,
      checkPause: false,
      scoreReported: false,
      attemptId: Date.now()
    };
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function exId(i){ return S.order[i]; }
  function currentEx(){ return EX[exId(S.currentIndex)]; }

  // ---- Handshake ----
  window.addEventListener('message', function(ev){
    if (!ev || !ev.data) return;
    if (ev.data.type !== 'CYBERPULSE_INIT' && ev.data.type !== 'CYBERMASTERY_INIT') return;
    if (ev.data.theme === 'light') {
      // File is dark-only by design; do not invent a light theme.
    }
    // username / country are accepted but not used to surface personalised UI.
  });

  // ---- Score reporting ----
  function reportScore(correct, total){
    var pct = total > 0 ? Math.round((correct/total)*100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: (META.topicId || 'cloud-plus').toLowerCase(),
        score: correct,
        total: total,
        percent: pct,
        passed: pct >= PASS
      }, location.origin);
    } catch(e){ /* opened directly */ }
  }

  // ---- DOM helpers ----
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k === 'text') e.textContent = attrs[k];
      else if (k === 'style') e.setAttribute('style', attrs[k]);
      else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.substring(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    }
    if (children){
      if (!Array.isArray(children)) children = [children];
      children.forEach(function(c){
        if (c == null) return;
        if (typeof c === 'string') e.appendChild(document.createTextNode(c));
        else e.appendChild(c);
      });
    }
    return e;
  }

  // ---- Timer ----
  var timerInterval = null;
  function startTimer(){
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tick, 1000);
  }
  function tick(){
    if (S.view !== 'exam') return;
    if (S.manualPause || S.checkPause) return;
    S.timeRemaining--;
    if (S.timeRemaining <= 0){
      S.timeRemaining = 0;
      updateTimer();
      finishExam(true);
      return;
    }
    updateTimer();
  }
  function fmtTime(s){
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    var p = function(n){ return n<10 ? '0'+n : ''+n; };
    return (h>0? p(h)+':':'') + p(m) + ':' + p(sec);
  }
  function updateTimer(){
    var t = document.getElementById('timer');
    if (!t) return;
    t.textContent = fmtTime(S.timeRemaining);
    t.classList.toggle('warn', S.timeRemaining <= 300 && S.timeRemaining > 60);
    t.classList.toggle('crit', S.timeRemaining <= 60);
    var pauseTag = document.getElementById('pauseTag');
    if (!pauseTag) return;
    var html = '';
    if (S.manualPause && S.checkPause) html = '<span class="pausetag both">Paused (manual) + review mode</span>';
    else if (S.manualPause) html = '<span class="pausetag">Paused (manual)</span>';
    else if (S.checkPause) html = '<span class="pausetag checkpause">Timer paused \u2014 review mode</span>';
    pauseTag.innerHTML = html;
  }

  // ---- Scoring ----
  function exercisePoints(ex){
    // Default 1 point. Hint reduces by 10% (rounded to 2 decimals).
    var base = (typeof ex.points === 'number') ? ex.points : 1;
    if (S.hintsUsed[exId(S.currentIndex)]) {
      base = Math.round(base * 0.90 * 100) / 100;
    }
    return base;
  }

  // Compute earned + max for one exercise, given the current answer.
  function scoreExercise(exIdx, ans){
    var ex = EX[exIdx];
    if (S.skipped[exIdx]) return { earned:0, max:0, skipped:true };
    if (!S.checked[exIdx]) return { earned:0, max:0, skipped:false };
    var base = (typeof ex.points === 'number') ? ex.points : 1;
    if (S.hintsUsed[exIdx]) base = Math.round(base*0.90*100)/100;
    var max = base;
    var r = checkAnswer(ex, ans);
    // r.perElement: [{id, status:'correct'|'wrong'|'missed'}] OR r.correct (bool)
    var earned;
    if (r.multi) {
      var n = r.totalElements;
      var c = r.correctCount;
      earned = Math.round((c/n)*base*100)/100;
    } else {
      earned = r.correct ? base : 0;
    }
    return { earned: earned, max: max, skipped:false, detail:r };
  }

  function totalScore(){
    var earned = 0, max = 0, answered = 0, skipped = 0;
    for (var i=0;i<EX.length;i++){
      var exIdx = i;
      if (S.skipped[exIdx]) { skipped++; continue; }
      if (!S.checked[exIdx]) { continue; }
      answered++;
      var sc = scoreExercise(exIdx, S.answers[exIdx]);
      earned += sc.earned;
      max += sc.max;
    }
    return { earned: earned, max: max, answered: answered, skipped: skipped };
  }

  // ---- Check (per type) ----
  function checkAnswer(ex, ans){
    if (ans == null) ans = {};
    var type = ex.type;
    var multi = false, correctCount = 0, totalElements = 0, perElement = [];
    var correct = false;

    if (type === 'qcm-single' || type === 'qcm'){
      correct = (ans.choice === ex.correct);
      perElement = [{id:'choice', status: correct ? 'correct' : 'wrong'}];
    }
    else if (type === 'qcm-multi'){
      multi = true;
      totalElements = ex.correct.length;
      var sel = ans.choices || [];
      ex.correct.forEach(function(c){
        var ok = sel.indexOf(c) >= 0;
        perElement.push({id:c, status: ok ? 'correct' : 'missed'});
        if (ok) correctCount++;
      });
      sel.forEach(function(c){
        if (ex.correct.indexOf(c) < 0) perElement.push({id:c, status:'wrong'});
      });
    }
    else if (type === 'dragdrop-categorize'){
      multi = true;
      totalElements = 0;
      var placements = ex.correct; // {bucket: [items]}
      for (var b in placements){
        placements[b].forEach(function(it){ totalElements++; });
      }
      var userByBucket = ans.placements || {};
      // For each correct item, check if user placed it in the right bucket
      var allItems = {};
      for (var bk in placements){
        placements[bk].forEach(function(it){
          allItems[it] = bk;
        });
      }
      for (var it in allItems){
        var expected = allItems[it];
        var userBucket = null;
        for (var ub in userByBucket){
          if ((userByBucket[ub] || []).indexOf(it) >= 0) { userBucket = ub; break; }
        }
        var ok = (userBucket === expected);
        perElement.push({id: it+'->'+expected, status: ok ? 'correct' : 'wrong'});
        if (ok) correctCount++;
      }
    }
    else if (type === 'dragdrop-order' || type === 'prioritize'){
      multi = true;
      totalElements = ex.correct.length;
      var userOrder = ans.order || [];
      ex.correct.forEach(function(item, idx){
        var u = userOrder[idx];
        var ok = (u === item);
        perElement.push({id:idx+':'+item, status: ok ? 'correct' : 'wrong'});
        if (ok) correctCount++;
      });
    }
    else if (type === 'fillblank' || type === 'report-fill'){
      multi = true;
      totalElements = ex.correct.length;
      var userBlanks = ans.blanks || [];
      ex.correct.forEach(function(c, idx){
        var u = (userBlanks[idx] || '').trim().toLowerCase();
        var exp = (c || '').trim().toLowerCase();
        // accept alt forms
        var ok = false;
        if (u === exp) ok = true;
        if (ex.alternatives && ex.alternatives[idx]){
          ex.alternatives[idx].forEach(function(alt){
            if (u === alt.trim().toLowerCase()) ok = true;
          });
        }
        perElement.push({id:'blank'+idx, status: ok ? 'correct' : 'wrong'});
        if (ok) correctCount++;
      });
    }
    else if (type === 'matching'){
      multi = true;
      totalElements = 0;
      var pairs = ex.pairs; // [{left, right}]
      pairs.forEach(function(p){ totalElements++; });
      var userPairs = ans.pairs || {};
      pairs.forEach(function(p){
        var u = userPairs[p.left];
        var ok = (u === p.right);
        perElement.push({id:p.left+'->'+p.right, status: ok ? 'correct' : 'wrong'});
        if (ok) correctCount++;
      });
    }
    else if (type === 'terminal'){
      // All-or-nothing (single correct answer with possible alternatives)
      var u = (ans.command || '').trim();
      var ok = false;
      ex.accept.forEach(function(re){
        try { if (new RegExp(re).test(u)) ok = true; } catch(e){}
      });
      correct = ok;
      perElement = [{id:'command', status: ok ? 'correct' : 'wrong'}];
    }
    else if (type === 'logviewer'){
      multi = true;
      totalElements = ex.correct.length;
      var selLines = ans.lines || [];
      ex.correct.forEach(function(ln){
        var ok = selLines.indexOf(ln) >= 0;
        perElement.push({id:'line'+ln, status: ok ? 'correct' : 'missed'});
        if (ok) correctCount++;
      });
      selLines.forEach(function(ln){
        if (ex.correct.indexOf(ln) < 0) perElement.push({id:'line'+ln, status:'wrong'});
      });
    }
    else if (type === 'spot-mistake'){
      multi = true;
      totalElements = ex.correct.length;
      var selLines2 = ans.lines || [];
      ex.correct.forEach(function(ln){
        var ok = selLines2.indexOf(ln) >= 0;
        perElement.push({id:'line'+ln, status: ok ? 'correct' : 'missed'});
        if (ok) correctCount++;
      });
      selLines2.forEach(function(ln){
        if (ex.correct.indexOf(ln) < 0) perElement.push({id:'line'+ln, status:'wrong'});
      });
    }
    else if (type === 'scenario-branching'){
      // Multi-stage decisions: each correct decision earns 1/n
      multi = true;
      var stages = ex.stages;
      totalElements = stages.length;
      var path = ans.path || [];
      stages.forEach(function(st, idx){
        var u = path[idx];
        var ok = (u === st.correct);
        perElement.push({id:'stage'+idx, status: ok ? 'correct' : 'wrong'});
        if (ok) correctCount++;
      });
    }
    else if (type === 'dual-perspective'){
      multi = true;
      totalElements = 2;
      var blue = ans.blue, red = ans.red;
      var okB = (blue === ex.correct.blue);
      var okR = (red === ex.correct.red);
      perElement.push({id:'blue', status: okB ? 'correct' : 'wrong'});
      perElement.push({id:'red', status: okR ? 'correct' : 'wrong'});
      if (okB) correctCount++;
      if (okR) correctCount++;
    }
    else {
      // Unknown type, treat as all-or-nothing
      correct = false;
    }
    return { multi: multi, correctCount: correctCount, totalElements: totalElements, perElement: perElement, correct: correct };
  }

  // ---- Renderers per type ----
  function renderScenarioBlock(ex){
    if (!ex.scenario) return '';
    var s = el('div', {class:'scenario-block'},
      [el('span',{class:'label-tag scenario',text:'SCENARIO / CONTEXT'}), el('div',{html:ex.scenario})]
    );
    return s;
  }
  function renderQuestionBlock(ex){
    return el('div', {class:'question-block'},
      [el('span',{class:'label-tag question',text:'QUESTION'}), el('div',{html:ex.prompt})]
    );
  }
  function renderAnswersWrap(children){
    return el('div',{class:'answers-block'},
      [el('span',{class:'label-tag answers',text:'ANSWER'})].concat(children));
  }

  // Each renderer returns a DOM node that contains the answer area.
  // State: S.answers[exId] holds the user's current answer.

  function ans_get(exIdx, init){
    if (!S.answers[exIdx]) S.answers[exIdx] = init || {};
    return S.answers[exIdx];
  }

  function render_qcm_single(ex, exIdx){
    var opts = shuffleOptions(ex.options, ex.correct, exIdx);
    var container = el('div',{class:'qcm-list'});
    opts.forEach(function(opt, i){
      var ans = ans_get(exIdx, {});
      var radio = el('input',{type:'radio', name:'qcm'+exIdx, value:opt.id});
      if (ans.choice === opt.id) radio.checked = true;
      radio.addEventListener('change', function(){
        ans.choice = opt.id;
        // unlock if previously checked
        if (S.checked[exIdx]) S.checked[exIdx] = false;
        reRender();
      });
      var label = el('label',{class:'qcm-option'},[
        el('span',{class:'letter', text: opt.id}),
        radio,
        el('span',{text: opt.text}),
        el('span',{class:'icon'})
      ]);
      // make whole label clickable
      label.addEventListener('click', function(e){
        if (e.target !== radio) { radio.checked = true; ans.choice = opt.id; if (S.checked[exIdx]) S.checked[exIdx] = false; reRender(); }
      });
      container.appendChild(label);
    });
    return container;
  }

  function render_qcm_multi(ex, exIdx){
    var opts = shuffleOptions(ex.options, ex.correct, exIdx);
    var container = el('div',{class:'qcm-list'});
    opts.forEach(function(opt, i){
      var ans = ans_get(exIdx, {choices:[]});
      if (!ans.choices) ans.choices = [];
      var cb = el('input',{type:'checkbox', value:opt.id});
      if (ans.choices.indexOf(opt.id) >= 0) cb.checked = true;
      cb.addEventListener('change', function(){
        if (cb.checked){
          if (ans.choices.indexOf(opt.id) < 0) ans.choices.push(opt.id);
        } else {
          ans.choices = ans.choices.filter(function(c){ return c !== opt.id; });
        }
        if (S.checked[exIdx]) S.checked[exIdx] = false;
        reRender();
      });
      var label = el('label',{class:'qcm-option'},[
        el('span',{class:'letter', text: opt.id}),
        cb,
        el('span',{text: opt.text}),
        el('span',{class:'icon'})
      ]);
      container.appendChild(label);
    });
    return container;
  }

  // shuffle options deterministically per attempt: use a per-exercise shuffle seed stored in S
  function shuffleOptions(opts, correct, exIdx){
    if (!S._shuffledOptions) S._shuffledOptions = {};
    if (!S._shuffledOptions[exIdx]){
      S._shuffledOptions[exIdx] = shuffle(opts);
    }
    return S._shuffledOptions[exIdx];
  }

  function render_dragdrop_categorize(ex, exIdx){
    var ans = ans_get(exIdx, {placements:{}});
    if (!ans.placements) ans.placements = {};
    var wrap = el('div',{class:'dnd-wrap'});
    // Pool
    var allItems = [];
    for (var b in ex.correct){ ex.correct[b].forEach(function(it){ allItems.push(it); }); }
    // shuffle items once
    if (!S._dndPool) S._dndPool = {};
    if (!S._dndPool[exIdx]) S._dndPool[exIdx] = shuffle(allItems);
    var poolItems = S._dndPool[exIdx];

    var pool = el('div',{class:'dnd-pool'});
    poolItems.forEach(function(it){
      // skip if placed
      var placed = false;
      for (var b in ans.placements){ if (ans.placements[b].indexOf(it) >= 0) placed = true; }
      if (placed) return;
      var chip = el('div',{class:'dnd-item', text: it, draggable:'true', 'data-item':it});
      chip.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', it); chip.classList.add('dragging'); });
      chip.addEventListener('dragend', function(){ chip.classList.remove('dragging'); });
      // click to place in first bucket (fallback)
      pool.appendChild(chip);
    });
    wrap.appendChild(pool);

    var bucketsWrap = el('div',{class:'buckets'});
    ex.buckets.forEach(function(b){
      var items = ans.placements[b] || [];
      var zone = el('div',{class:'dnd-bucket dropzone', 'data-bucket':b});
      items.forEach(function(it){
        var placed = el('div',{class:'placed-item'}, [
          el('span',{text: it}),
          el('span',{class:'rmv', text:'\u00d7', title:'Remove'})
        ]);
        placed.querySelector('.rmv').addEventListener('click', function(){
          ans.placements[b] = ans.placements[b].filter(function(x){ return x !== it; });
          if (S.checked[exIdx]) S.checked[exIdx] = false;
          reRender();
        });
        zone.appendChild(placed);
      });
      zone.addEventListener('dragover', function(e){ e.preventDefault(); });
      zone.addEventListener('drop', function(e){
        e.preventDefault();
        var it = e.dataTransfer.getData('text/plain');
        if (!it) return;
        // remove from other bucket
        for (var bb in ans.placements){ ans.placements[bb] = ans.placements[bb].filter(function(x){ return x !== it; }); }
        if (!ans.placements[b]) ans.placements[b] = [];
        if (ans.placements[b].indexOf(it) < 0) ans.placements[b].push(it);
        if (S.checked[exIdx]) S.checked[exIdx] = false;
        reRender();
      });
      var bucket = el('div',{class:'dnd-bucket'}, [
        el('div',{class:'bucket-head', text: b}),
        zone
      ]);
      bucketsWrap.appendChild(bucket);
    });
    wrap.appendChild(bucketsWrap);
    return wrap;
  }

  function render_dragdrop_order(ex, exIdx){
    var ans = ans_get(exIdx, {order:[]});
    if (!ans.order || ans.order.length === 0){
      if (!S._orderPool) S._orderPool = {};
      if (!S._orderPool[exIdx]) S._orderPool[exIdx] = shuffle(ex.items.slice());
      ans.order = S._orderPool[exIdx].slice();
    }
    var wrap = el('div',{class:'order-list'});
    ans.order.forEach(function(item, idx){
      var row = el('div',{class:'order-item'},[
        el('div',{class:'pos', text: ''+(idx+1)}),
        el('div',{class:'content', text: item}),
        el('div',{class:'arrows'},[
          el('button',{title:'Move up',text:'\u25b2', onclick: function(){
            if (idx>0){ var t=ans.order[idx-1]; ans.order[idx-1]=ans.order[idx]; ans.order[idx]=t; }
            if (S.checked[exIdx]) S.checked[exIdx] = false;
            reRender();
          }}),
          el('button',{title:'Move down',text:'\u25bc', onclick: function(){
            if (idx<ans.order.length-1){ var t=ans.order[idx+1]; ans.order[idx+1]=ans.order[idx]; ans.order[idx]=t; }
            if (S.checked[exIdx]) S.checked[exIdx] = false;
            reRender();
          }})
        ])
      ]);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function render_fillblank(ex, exIdx){
    var ans = ans_get(exIdx, {blanks:[]});
    if (!ans.blanks) ans.blanks = [];
    while (ans.blanks.length < ex.correct.length) ans.blanks.push('');
    // Build word bank (shuffled once)
    if (!S._fbBank) S._fbBank = {};
    if (!S._fbBank[exIdx]){
      // word bank = correct answers + distractors
      var bank = ex.correct.slice();
      if (ex.distractors) bank = bank.concat(ex.distractors);
      S._fbBank[exIdx] = shuffle(bank);
    }
    var bank = S._fbBank[exIdx];

    var wrap = el('div',{});
    // Sentence with blanks
    var sWrap = el('div',{class:'fb-sentence'});
    ex.sentence.forEach(function(part, i){
      sWrap.appendChild(document.createTextNode(part));
      if (i < ex.correct.length){
        var bVal = ans.blanks[i] || '';
        var blank = el('span',{class:'fb-blank'+(bVal?' filled':''), text: bVal || '\u00a0\u00a0\u00a0\u00a0', title:'Click to clear'});
        blank.addEventListener('click', function(){
          if (!bVal) return;
          // remove from blank
          ans.blanks[i] = '';
          if (S.checked[exIdx]) S.checked[exIdx] = false;
          reRender();
        });
        sWrap.appendChild(blank);
      }
    });
    wrap.appendChild(sWrap);

    var bankWrap = el('div',{class:'fb-bank'});
    bank.forEach(function(word){
      var used = ans.blanks.indexOf(word) >= 0;
      var chip = el('div',{class:'fb-chip'+(used?' used':''), text: word});
      if (!used){
        chip.addEventListener('click', function(){
          // fill first empty blank
          for (var i=0;i<ans.blanks.length;i++){
            if (!ans.blanks[i]){ ans.blanks[i] = word; break; }
          }
          if (S.checked[exIdx]) S.checked[exIdx] = false;
          reRender();
        });
      }
      bankWrap.appendChild(chip);
    });
    wrap.appendChild(bankWrap);
    return wrap;
  }

  function render_matching(ex, exIdx){
    var ans = ans_get(exIdx, {pairs:{}});
    if (!ans.pairs) ans.pairs = {};
    var grid = el('div',{class:'match-grid'});
    var leftCol = el('div',{class:'match-col'});
    var rightCol = el('div',{class:'match-col'});
    var rights = shuffle(ex.pairs.map(function(p){ return p.right; }));
    if (!S._matchRight) S._matchRight = {};
    if (!S._matchRight[exIdx]) S._matchRight[exIdx] = shuffle(rights);
    var rightsShuffled = S._matchRight[exIdx];
    ex.pairs.forEach(function(p){
      var sel = el('select', {});
      sel.appendChild(el('option',{value:'',text:'\u2014 choose \u2014'}));
      rightsShuffled.forEach(function(r){
        sel.appendChild(el('option',{value:r, text:r}));
      });
      if (ans.pairs[p.left]) sel.value = ans.pairs[p.left];
      sel.addEventListener('change', function(){
        ans.pairs[p.left] = sel.value;
        if (S.checked[exIdx]) S.checked[exIdx] = false;
        reRender();
      });
      var row = el('div',{class:'match-row'},[
        el('div',{class:'label', text: p.left}),
        sel
      ]);
      leftCol.appendChild(row);
    });
    // Right column: show options as labels
    rightsShuffled.forEach(function(r){
      var row = el('div',{class:'match-row'},[
        el('div',{class:'label', text: 'Option'}),
        el('div',{text: r})
      ]);
      rightCol.appendChild(row);
    });
    grid.appendChild(leftCol);
    grid.appendChild(rightCol);
    return grid;
  }

  function render_terminal(ex, exIdx){
    var ans = ans_get(exIdx, {command:''});
    var wrap = el('div',{});
    var term = el('div',{class:'term'});
    var out = '';
    if (ex.intro) out += ex.intro + '\n';
    if (ex.artefact) out += ex.artefact + '\n';
    term.appendChild(el('div',{class:'out', text: out}));
    var line = el('div',{}, [el('span',{class:'prompt', text:'$ '})]);
    var input = el('input',{class:'term-input', type:'text', value: ans.command || '', placeholder: 'type your command and press Enter', autocomplete:'off', spellcheck:'false'});
    input.addEventListener('input', function(){ ans.command = input.value; });
    input.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        runCheck(exIdx);
      }
    });
    line.appendChild(input);
    term.appendChild(line);
    wrap.appendChild(term);
    return wrap;
  }

  function render_logviewer(ex, exIdx){
    var ans = ans_get(exIdx, {lines:[]});
    if (!ans.lines) ans.lines = [];
    var wrap = el('div',{});
    var toolbar = el('div',{class:'lv-toolbar'});
    var filter = el('input',{class:'lv-filter', type:'text', placeholder:'Filter logs (e.g. ERROR, ip, src=10[.]0[.]0[.]1)'});
    filter.addEventListener('input', function(){
      var q = (filter.value||'').toLowerCase();
      wrap.querySelectorAll('.lv-line').forEach(function(node){
        var t = node.textContent.toLowerCase();
        node.style.display = (q === '' || t.indexOf(q) >= 0) ? '' : 'none';
      });
    });
    toolbar.appendChild(filter);
    var clearBtn = el('button',{text:'Clear selection'});
    clearBtn.addEventListener('click', function(){
      ans.lines = [];
      if (S.checked[exIdx]) S.checked[exIdx] = false;
      reRender();
    });
    toolbar.appendChild(clearBtn);
    wrap.appendChild(toolbar);

    var list = el('div',{class:'lv-list'});
    ex.lines.forEach(function(ln){
      var isSelected = ans.lines.indexOf(ln.id) >= 0;
      var sev = ln.sev || 'info';
      var row = el('div',{class:'lv-line'+(isSelected?' sel':''),'data-id':ln.id},[
        el('span',{class:'mark', text: isSelected ? '\u25a0' : '\u25cb'}),
        el('span',{class:'ts', text: ln.ts || ''}),
        el('span',{class:'sev '+sev, text: sev.toUpperCase()}),
        el('span',{text: ln.text})
      ]);
      row.addEventListener('click', function(){
        var i = ans.lines.indexOf(ln.id);
        if (i >= 0) ans.lines.splice(i,1);
        else ans.lines.push(ln.id);
        if (S.checked[exIdx]) S.checked[exIdx] = false;
        reRender();
      });
      list.appendChild(row);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function render_spot_mistake(ex, exIdx){
    var ans = ans_get(exIdx, {lines:[]});
    if (!ans.lines) ans.lines = [];
    var wrap = el('div',{});
    var code = el('div',{class:'sm-code'});
    ex.lines.forEach(function(ln, i){
      var lineNo = i+1;
      var isSelected = ans.lines.indexOf(lineNo) >= 0;
      var row = el('div',{class:'sm-line'+(isSelected?' sel':''),'data-ln':lineNo},[
        el('span',{class:'lnum', text: ''+lineNo}),
        el('span',{class:'content', text: ln})
      ]);
      row.addEventListener('click', function(){
        var idx = ans.lines.indexOf(lineNo);
        if (idx >= 0) ans.lines.splice(idx,1);
        else ans.lines.push(lineNo);
        if (S.checked[exIdx]) S.checked[exIdx] = false;
        reRender();
      });
      code.appendChild(row);
    });
    wrap.appendChild(code);
    var hint = el('div',{class:'hint-block', html: '<strong>Tip:</strong> Click each line you think is wrong. You can select multiple.'});
    wrap.appendChild(hint);
