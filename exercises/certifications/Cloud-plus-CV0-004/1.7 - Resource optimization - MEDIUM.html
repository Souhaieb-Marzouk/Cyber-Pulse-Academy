  function render_prioritize(ex, exIdx){
    // Same as dragdrop-order visually
    return render_dragdrop_order(ex, exIdx);
  }

  function render_scenario_branching(ex, exIdx){
    var ans = ans_get(exIdx, {path:[]});
    if (!ans.path) ans.path = [];
    var wrap = el('div',{});
    ex.stages.forEach(function(st, idx){
      var stageEl = el('div',{class:'sb-stage'},[
        el('div',{class:'stage-num', text: 'STAGE '+(idx+1)+' / '+ex.stages.length}),
        el('div',{class:'stage-q', html: st.q})
      ]);
      var choicesEl = el('div',{class:'choices'});
      // shuffle choices deterministically per stage
      if (!S._sbChoices) S._sbChoices = {};
      if (!S._sbChoices[exIdx]) S._sbChoices[exIdx] = {};
      if (!S._sbChoices[exIdx][idx]) S._sbChoices[exIdx][idx] = shuffle(st.choices);
      S._sbChoices[exIdx][idx].forEach(function(ch){
        var sel = (ans.path[idx] === ch.id);
        var row = el('div',{class:'sb-choice'+(sel?' sel':'')},[
          el('span',{class:'letter', text: ch.id}),
          el('span',{text: ch.text})
        ]);
        row.addEventListener('click', function(){
          ans.path[idx] = ch.id;
          // truncate subsequent stages (must re-decide)
          ans.path = ans.path.slice(0, idx+1);
          if (S.checked[exIdx]) S.checked[exIdx] = false;
          reRender();
        });
        choicesEl.appendChild(row);
      });
      stageEl.appendChild(choicesEl);
      wrap.appendChild(stageEl);
    });
    return wrap;
  }

  function render_dual_perspective(ex, exIdx){
    var ans = ans_get(exIdx, {});
    if (ans.blue == null) ans.blue = null;
    if (ans.red == null) ans.red = null;
    var wrap = el('div',{});
    var tabs = el('div',{class:'dp-tabs'});
    var tabB = el('div',{class:'dp-tab active', text:'Blue team \u2014 defender'});
    var tabR = el('div',{class:'dp-tab', text:'Red team \u2014 attacker'});

      lbl.addEventListener('click', function(e){ if (e.target !== r){ r.checked = true; ans.blue = opt.id; if (S.checked[exIdx]) S.checked[exIdx] = false; reRender(); } });

    });
    paneB.appendChild(listB);
    wrap.appendChild(paneB);

    var paneR = el('div',{class:'dp-pane'});
    paneR.appendChild(el('div',{class:'scenario-block', html: '<strong>Red team view:</strong> '+ex.scenarioRed}));
    paneR.appendChild(el('div',{class:'question-block', html: ex.qRed}));
    var optsR = shuffleOptions(ex.optionsRed, ex.correct.red, exIdx*1000+2);
    var listR = el('div',{class:'qcm-list'});
    optsR.forEach(function(opt){
      var r = el('input',{type:'radio', name:'dpr'+exIdx, value:opt.id});
      if (ans.red === opt.id) r.checked = true;
      r.addEventListener('change', function(){ ans.red = opt.id; if (S.checked[exIdx]) S.checked[exIdx] = false; reRender(); });
      var lbl = el('label',{class:'qcm-option'},[el('span',{class:'letter',text:opt.id}), r, el('span',{text: opt.text}), el('span',{class:'icon'})]);
      lbl.addEventListener('click', function(e){ if (e.target !== r){ r.checked = true; ans.red = opt.id; if (S.checked[exIdx]) S.checked[exIdx] = false; reRender(); } });
      listR.appendChild(lbl);
    });
    paneR.appendChild(listR);
    wrap.appendChild(paneR);

    tabB.addEventListener('click', function(){
      tabB.classList.add('active'); tabR.classList.remove('active');
      paneB.classList.add('active'); paneR.classList.remove('active');
    });
    tabR.addEventListener('click', function(){
      tabR.classList.add('active'); tabB.classList.remove('active');
      paneR.classList.add('active'); paneB.classList.remove('active');
    });
    return wrap;
  }

  function render_report_fill(ex, exIdx){
    // same as fillblank
    return render_fillblank(ex, exIdx);
  }

  // Dispatch
  function renderAnswerArea(ex, exIdx){
    var type = ex.type;
    if (type === 'qcm-single' || type === 'qcm') return render_qcm_single(ex, exIdx);
    if (type === 'qcm-multi') return render_qcm_multi(ex, exIdx);
    if (type === 'dragdrop-categorize') return render_dragdrop_categorize(ex, exIdx);
    if (type === 'dragdrop-order') return render_dragdrop_order(ex, exIdx);
    if (type === 'fillblank') return render_fillblank(ex, exIdx);
    if (type === 'matching') return render_matching(ex, exIdx);
    if (type === 'terminal') return render_terminal(ex, exIdx);
    if (type === 'logviewer') return render_logviewer(ex, exIdx);
    if (type === 'spot-mistake') return render_spot_mistake(ex, exIdx);
    if (type === 'prioritize') return render_prioritize(ex, exIdx);
    if (type === 'scenario-branching') return render_scenario_branching(ex, exIdx);
    if (type === 'dual-perspective') return render_dual_perspective(ex, exIdx);
    if (type === 'report-fill') return render_report_fill(ex, exIdx);
    return el('div',{text:'[Unknown exercise type: '+type+']'});
  }

  // Apply feedback styling (green/red/amber) to a freshly-Checked exercise.
  function applyFeedback(ex, exIdx, ans, detail){
    var container = document.getElementById('answerArea');
    if (!container) return;
    // QCM single/multi: mark options
    if (ex.type === 'qcm-single' || ex.type === 'qcm'){
      container.querySelectorAll('.qcm-option').forEach(function(opt){
        var letter = opt.querySelector('.letter').textContent;
        var isCorrect = ex.correct === letter;
        var isUserChoice = ans.choice === letter;
        var icon = opt.querySelector('.icon');
        if (isCorrect){
          opt.classList.add('correct'); icon.textContent = '\u2713';
        } else if (isUserChoice && !isCorrect){
          opt.classList.add('wrong'); icon.textContent = '\u2717';
        }
      });
    }
    else if (ex.type === 'qcm-multi'){
      container.querySelectorAll('.qcm-option').forEach(function(opt){
        var letter = opt.querySelector('.letter').textContent;
        var icon = opt.querySelector('.icon');
        if (ex.correct.indexOf(letter) >= 0){
          if (ans.choices && ans.choices.indexOf(letter) >= 0){
            opt.classList.add('correct'); icon.textContent = '\u2713';
          } else {
            opt.classList.add('missed'); icon.textContent = '!';
          }
        } else if (ans.choices && ans.choices.indexOf(letter) >= 0){
          opt.classList.add('wrong'); icon.textContent = '\u2717';
        }
      });
    }
    else if (ex.type === 'dual-perspective'){
      // Mark blue options in the active pane (Blue is the first pane by default;
      // Red pane options get marked when the user switches to it, since only one pane is in the DOM at a time).
      container.querySelectorAll('.dp-pane').forEach(function(pane){
        var isBlue = pane.classList.contains('active');
        var correctId = isBlue ? ex.correct.blue : ex.correct.red;
        var userId = isBlue ? ans.blue : ans.red;
        pane.querySelectorAll('.qcm-option').forEach(function(opt){
          var letter = opt.querySelector('.letter').textContent;
          var icon = opt.querySelector('.icon');
          if (letter === correctId){
            opt.classList.add('correct'); if (icon) icon.textContent = '\u2713';
          } else if (letter === userId){
            opt.classList.add('wrong'); if (icon) icon.textContent = '\u2717';
          }
        });
      });
    }
    else if (ex.type === 'dragdrop-categorize'){
      // for each placed item, check correctness
      container.querySelectorAll('.dnd-bucket').forEach(function(b){
        var bName = b.querySelector('.bucket-head') ? b.querySelector('.bucket-head').textContent : '';
        var zone = b.querySelector('.dropzone');
        if (!zone) return;
        var items = zone.querySelectorAll('.placed-item span:first-child');
        var allRight = true;
        items.forEach(function(it){
          var t = it.textContent;
          var expected = null;
          for (var bb in ex.correct){ if (ex.correct[bb].indexOf(t) >= 0) expected = bb; }
          if (expected !== bName) allRight = false;
        });
        if (allRight && items.length > 0) b.classList.add('correct');
        else if (items.length > 0) b.classList.add('wrong');
      });
    }
    else if (ex.type === 'dragdrop-order' || ex.type === 'prioritize'){
      container.querySelectorAll('.order-item, .prio-item').forEach(function(row, idx){
        if (ex.correct[idx] === ans.order[idx]) row.classList.add('correct');
        else row.classList.add('wrong');
      });
    }
    else if (ex.type === 'fillblank' || ex.type === 'report-fill'){
      container.querySelectorAll('.fb-blank').forEach(function(blank, idx){
        var userVal = (ans.blanks[idx] || '').trim().toLowerCase();
        var exp = (ex.correct[idx] || '').trim().toLowerCase();
        var ok = (userVal === exp);
        if (!ok && ex.alternatives && ex.alternatives[idx]){
          ex.alternatives[idx].forEach(function(alt){
            if (userVal === alt.trim().toLowerCase()) ok = true;
          });
        }
        if (ok) blank.classList.add('correct'); else blank.classList.add('wrong');
      });
    }
    else if (ex.type === 'matching'){
      container.querySelectorAll('.match-row').forEach(function(row, i){
        if (i >= ex.pairs.length) return;
        var p = ex.pairs[i];
        var sel = row.querySelector('select');
        if (sel.value === p.right) row.classList.add('correct');
        else row.classList.add('wrong');
      });
    }
    else if (ex.type === 'terminal'){
      var ok = false;
      var u = (ans.command || '').trim();
      ex.accept.forEach(function(re){ try { if (new RegExp(re).test(u)) ok = true; } catch(e){} });
      var feedback = document.getElementById('termFeedback');
      if (feedback){
        feedback.className = 'term-feedback ' + (ok ? 'ok' : 'bad');
        feedback.textContent = ok ? '\u2713 Correct command accepted.' : '\u2717 Command did not match. Try again or press Revise.';
      }
    }
    else if (ex.type === 'logviewer' || ex.type === 'spot-mistake'){
      container.querySelectorAll('.lv-line, .sm-line').forEach(function(node){
        var id;
        if (ex.type === 'logviewer') id = parseInt(node.getAttribute('data-id'),10);
        else id = parseInt(node.getAttribute('data-ln'),10);
        var sel = (ans.lines || []).indexOf(id) >= 0;
        if (ex.correct.indexOf(id) >= 0){
          if (sel) node.classList.add('correct');
          else node.classList.add('missed');
        } else if (sel){
          node.classList.add('wrong');
        }
      });
    }
    else if (ex.type === 'scenario-branching'){
      container.querySelectorAll('.sb-stage').forEach(function(stage, idx){
        if (idx >= ex.stages.length) return;
        var correctId = ex.stages[idx].correct;
        stage.querySelectorAll('.sb-choice').forEach(function(ch){
          var letter = ch.querySelector('.letter').textContent;
          if (letter === correctId) ch.classList.add('correct');
          else if (ans.path[idx] === letter) ch.classList.add('wrong');
        });
      });
    }
  }

  // ---- Top-level render ----
  function render(){
    var app = document.getElementById('app');
    app.innerHTML = '';
    if (S.view === 'intro') return renderIntro(app);
    if (S.view === 'results') return renderResults(app);
    renderExam(app);
  }

  function renderIntro(app){
    var diff = META.difficulty || 'medium';
    var diffLabel = diff.toUpperCase();
    var total = EX.length;
    var sec = TOTAL_SECONDS;
    var intro = el('section',{class:'intro'},[
      el('span',{class:'badge '+diff, text: diffLabel+' severity'}),
      el('h1',{text: META.title || ('Cloud+ 1.7 Resource Optimization - '+diffLabel)}),
      el('p',{text:'This is a realistic certification-style practice exam. It is designed to feel like real on-the-job work \u2014 SOC shift, FinOps review, capacity planning \u2014 not a school quiz.'}),
      el('div',{class:'meta-grid'},[
        metaCell('Questions', total),
        metaCell('Time limit', Math.floor(sec/60)+' min'),
        metaCell('Pass mark', PASS+'%'),
        metaCell('Severity', diffLabel)
      ]),
      el('h2',{text:'Before you start'}),
      el('ul',{},[
        el('li',{html:'<strong>Check button</strong> \u2014 validates your answer, marks each element green / red / amber, shows the explanation, and pauses the timer so you can study what went wrong. The exercise stays visible during this review mode.'}),
        el('li',{html:'<strong>Skip button</strong> \u2014 skips the exercise and moves to the next one. You can come back to skipped exercises later. Skipped-and-never-answered exercises are excluded from scoring (no penalty, no free points).'}),
        el('li',{html:'<strong>Hint button</strong> \u2014 costs 10% of the current exercise points and reveals a nudge (not the answer).'}),
        el('li',{html:'<strong>Revise button</strong> \u2014 unlocks an already-Checked exercise so you can change your answer. Editing does not resume the timer \u2014 only the Next button does.'}),
        el('li',{html:'<strong>Two pause modes</strong>: (1) Manual pause hides / blurs the exercise so you cannot read it while paused. (2) Check-pause keeps the exercise visible for review. The timer resumes only when neither is active.'}),
        el('li',{html:'<strong>Partial credit</strong>: multi-answer exercises (multi-select, drag & drop, fill-in-the-blank, matching, log analysis, prioritization, branching, dual-perspective, report fill) are scored per element. Each correct element earns its share; wrong selections do not subtract from earned points.'}),
        el('li',{html:'<strong>Navigation</strong>: use the Next / Back buttons and the question navigator at the bottom. You can revisit any exercise while time remains.'}),
        el('li',{html:'<strong>Retake</strong>: on the results screen you can retake the exam \u2014 questions and answer choices are shuffled again.'})
      ]),
      el('div',{class:'btn-row'},[
        el('button',{class:'btn primary', text:'Start exam', onclick: function(){
          S.view = 'exam';
          S.currentIndex = 0;
          startTimer();
          render();
          // focus first interactive element
          setTimeout(function(){ var f = document.querySelector('.ex-card input, .ex-card select, .ex-card button.btn'); if (f) f.focus(); }, 50);
        }})
      ]),
      renderKeywordsPanel()
    ]);
    app.appendChild(intro);
    window.scrollTo(0,0);
  }

  function metaCell(label, val){
    return el('div',{},[el('b',{text:label}), el('div',{text:''+val})]);
  }

  function renderKeywordsPanel(){
    var themes = window.__KEYWORDS || {};
    var wrap = el('div',{class:'kw-panel'},[el('h3',{text:'Keywords covered (grouped by theme)'})]);
    var grid = el('div',{class:'kw-grid'});
    for (var theme in themes){
      var block = el('div',{class:'kw-block'},[el('h4',{text:theme})]);
      themes[theme].forEach(function(kw){
        block.appendChild(el('span',{class:'kw', text:kw}));
      });
      grid.appendChild(block);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  function renderExam(app){
    // Header bar
    var header = el('header',{class:'exam-bar'},[
      el('div',{class:'brand'},[
        el('span',{class:'badge '+(META.difficulty||'medium'), text:(META.difficulty||'medium').toUpperCase()}),
        el('span',{text: META.title || 'Cloud+ 1.7'})
      ]),
      el('div',{class:'grow'}),
      el('div',{class:'score', id:'scoreBox', text:'0 / 0'}),
      el('div',{class:'timer', id:'timer', text: fmtTime(S.timeRemaining)}),
      el('span',{id:'pauseTag'}),
      el('button',{class:'btn '+(S.manualPause?'primary':'warn'), text: S.manualPause?'Resume':'Pause', onclick: function(){
        S.manualPause = !S.manualPause;
        render();
      }})
    ]);
    app.appendChild(header);
    // Progress bar
    var progTrack = el('div',{class:'progress-track'},[el('div',{class:'progress-fill'})]);
    app.appendChild(progTrack);

    var exIdx = exId(S.currentIndex);
    var ex = EX[exIdx];
    // Card
    var card = el('section',{class:'ex-card'});
    var head = el('div',{class:'ex-head'},[
      el('span',{class:'num', text:'Q'+(S.currentIndex+1)+' / '+EX.length}),
      el('span',{class:'type', text: typeLabel(ex.type)}),
      ex.theme ? el('span',{class:'theme', text: ex.theme}) : el('span',{}),
      el('span',{class:'pts', id:'ptsLabel', text: ptsLabel(ex, exIdx)})
    ]);
    card.appendChild(head);

    // If manual pause is on, blur content
    var blurStyle = S.manualPause ? 'filter:blur(7px); pointer-events:none; user-select:none;' : '';
    var contentWrap = el('div',{style:blurStyle});
    if (!S.manualPause){
      if (ex.scenario) contentWrap.appendChild(renderScenarioBlock(ex));
      contentWrap.appendChild(renderQuestionBlock(ex));
      var ansWrap = renderAnswersWrap(renderAnswerArea(ex, exIdx));
      ansWrap.id = 'answerArea';
      contentWrap.appendChild(ansWrap);
      // Hint
      if (S.hintsUsed[exIdx] && ex.hint){
        contentWrap.appendChild(el('div',{class:'hint-block', html:'<strong>Hint (-10%):</strong> '+ex.hint}));
      }
      // Feedback (if checked)
      if (S.checked[exIdx]){
        var sc = scoreExercise(exIdx, S.answers[exIdx]);
        var detail = sc.detail;
        var fb = el('div',{class:'feedback-block'},[
          el('div',{class:'head'},[
            el('span',{class: sc.earned >= sc.max ? 'pts-earned' : (sc.earned>0?'pts-partial':'pts-lost'),
                       text: 'You earned '+formatNum(sc.earned)+' / '+formatNum(sc.max)+' points'})
          ])
        ]);
        if (ex.explanation){
          fb.appendChild(el('div',{class:'explanation', html:'<strong>Explanation:</strong> '+ex.explanation}));
        }
        if (detail && detail.multi && detail.perElement){
          var els = el('div',{class:'elements'});
          detail.perElement.forEach(function(p){
            var cls = p.status === 'correct' ? 'ok' : (p.status === 'missed' ? 'warn' : 'bad');
            var symbol = p.status === 'correct' ? '\u2713' : (p.status === 'missed' ? '!' : '\u2717');
            els.appendChild(el('div',{class:'el'},[
              el('span',{class:'st '+cls, text: symbol}),
              el('span',{text: p.id+' \u2014 '+p.status})
            ]));
          });
          fb.appendChild(els);
        }
        contentWrap.appendChild(fb);
        // Terminal feedback container
        if (ex.type === 'terminal'){
          contentWrap.appendChild(el('div',{class:'term-feedback', id:'termFeedback'}));
        }
      }
    } else {
      contentWrap.appendChild(el('div',{class:'scenario-block', html:'<strong>Paused (manual):</strong> the exercise is hidden while the timer is paused. Press Resume to continue.'}));
    }
    card.appendChild(contentWrap);

    // Actions
    var actions = el('div',{class:'action-row'});
    if (!S.checked[exIdx] && !S.manualPause){
      actions.appendChild(el('button',{class:'btn ok', text:'Check', onclick: function(){ runCheck(exIdx); }}));
    }
    if (S.checked[exIdx]){
      actions.appendChild(el('button',{class:'btn warn', text:'Revise', onclick: function(){
        S.checked[exIdx] = false;
        render();
      }}));
    }
    if (!S.checked[exIdx] && !S.hintsUsed[exIdx] && ex.hint && !S.manualPause){
      actions.appendChild(el('button',{class:'btn hint', text:'Hint (-10%)', onclick: function(){
        S.hintsUsed[exIdx] = true;
        render();
      }}));
    }
    actions.appendChild(el('button',{class:'btn skip', text:'Skip', onclick: function(){
      S.skipped[exIdx] = true;
      goNext();
    }}));
    actions.appendChild(el('div',{style:'flex:1'}));
    if (S.currentIndex > 0) actions.appendChild(el('button',{class:'btn nav-arrow', text:'\u2190', title:'Back', onclick: goPrev}));
    actions.appendChild(el('button',{class:'btn primary', text: (S.currentIndex >= EX.length-1) ? 'Submit exam' : 'Next', onclick: function(){
      if (S.currentIndex >= EX.length-1){ finishExam(false); }
      else { goNext(); }
    }}));
    card.appendChild(actions);
    app.appendChild(card);

    // If checked, apply feedback styling (synchronously — DOM is already attached above)
    if (S.checked[exIdx] && !S.manualPause){
      var ans = S.answers[exIdx] || {};
      var detail = checkAnswer(ex, ans);
      applyFeedback(ex, exIdx, ans, detail);
    }

    // Navigator
    app.appendChild(renderNavigator());

    // Update progress + score
    updateProgress();
    updateScore();
    updateTimer();

    window.scrollTo(0,0);
  }

  function formatNum(n){
    if (Math.abs(n - Math.round(n)) < 0.001) return ''+Math.round(n);
    return ''+Math.round(n*100)/100;
  }

  function typeLabel(t){
    var map = {
      'qcm-single':'Multiple choice',
      'qcm':'Multiple choice',
      'qcm-multi':'Multi-select',
      'dragdrop-categorize':'Drag & drop \u2014 categorize',
      'dragdrop-order':'Drag & drop \u2014 order',
      'fillblank':'Fill in the blank',
      'matching':'Matching',
      'terminal':'Terminal emulator',
      'logviewer':'Log viewer',
      'spot-mistake':'Spot the mistake',
      'prioritize':'Prioritize',
      'scenario-branching':'Branching scenario',
      'dual-perspective':'Dual perspective',
      'report-fill':'Report drafting'
    };
    return map[t] || t;
  }

  function ptsLabel(ex, exIdx){
    var base = (typeof ex.points === 'number') ? ex.points : 1;
    if (S.hintsUsed[exIdx]) base = Math.round(base*0.90*100)/100;
    return 'Worth '+formatNum(base)+' pt'+(base>1?'s':'');
  }

  function renderNavigator(){
    var wrap = el('div',{class:'navigator'},[el('h4',{text:'Question navigator'})]);
    var grid = el('div',{class:'nav-grid'});
    for (var i=0;i<EX.length;i++){
      var exIdx = exId(i);
      var cls = 'nav-cell';
      if (i === S.currentIndex) cls += ' current';
      if (S.checked[exIdx]){
        var sc = scoreExercise(exIdx, S.answers[exIdx]);
        if (sc.earned >= sc.max) cls += ' checked';
        else if (sc.earned > 0) cls += ' partial';
        else cls += ' wrong';
      } else if (S.skipped[exIdx]) cls += ' skipped';
      var cell = el('div',{class:cls, text:''+(i+1), title:'Go to Q'+(i+1), onclick:(function(idx){ return function(){ S.currentIndex = idx; render(); }; })(i)});
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    if (EX.some(function(_,i){ return S.skipped[exId(i)]; })){
      wrap.appendChild(el('div',{style:'margin-top:8px;font-size:12px;color:var(--skip)'},[el('span',{text:'Amber = skipped. You can come back while time remains.'})]));
    }
    return wrap;
  }

  function updateProgress(){
    var checked = 0;
    for (var i=0;i<EX.length;i++){ if (S.checked[exId(i)] || S.skipped[exId(i)]) checked++; }
    var pct = (checked / EX.length) * 100;
    var fill = document.querySelector('.progress-fill');
    if (fill) fill.style.width = pct + '%';
  }
  function updateScore(){
    var s = totalScore();
    var box = document.getElementById('scoreBox');
    if (box) box.textContent = formatNum(s.earned)+' / '+formatNum(s.max);
  }

  function goNext(){
    S.checkPause = false; // Next resumes the timer
    if (S.currentIndex < EX.length-1){
      S.currentIndex++;
      render();
    } else {
      finishExam(false);
    }
  }
  function goPrev(){
    S.checkPause = false;
    if (S.currentIndex > 0){ S.currentIndex--; render(); }
  }

  function runCheck(exIdx){
    S.checked[exIdx] = true;
    S.skipped[exIdx] = false; // unskip on check
    S.checkPause = true; // pause timer for review
    render();
  }

  function finishExam(timeUp){
    // Build score
    var s = totalScore();
    // Count total skipped
    var skippedCount = 0;
    for (var i=0;i<EX.length;i++){ if (S.skipped[i]) skippedCount++; }
    // If all skipped and not time-up, refuse submission per spec:
    // "If all exercises end up skipped, the exam cannot be submitted - show a warning
    // asking the student to answer at least one exercise."
    if (!timeUp && skippedCount === EX.length){
      alert('You have skipped every exercise. Please go back and answer at least one before submitting.');
      return;
    }
    // If nothing answered (no Checked exercises) but not all skipped, ask for confirmation.
    if (!timeUp && s.answered === 0){
      var ok = confirm('You have not Checked any exercise yet. Submit anyway? (Skipped exercises are not counted.)');
      if (!ok) return;
    }
    S.view = 'results';
    render();
    // Fire score report exactly once per attempt
    if (!S.scoreReported){
      var s2 = totalScore();
      var earned = Math.round(s2.earned);
      var max = Math.round(s2.max);
      if (max <= 0) max = 0;
      reportScore(earned, max);
      S.scoreReported = true;
    }
  }

  function renderResults(app){
    var s = totalScore();
    var pct = s.max > 0 ? Math.round((s.earned / s.max) * 100) : 0;
    var passed = pct >= PASS;
    var sec = el('section',{class:'results'});
    var head = el('div',{class:'result-head '+(passed?'pass':'fail')},[
      el('h2',{text: passed ? 'PASS' : 'FAIL'}),
      el('div',{class:'big', text: pct+'%'}),
      el('div',{text: passed ? 'You reached the pass mark of '+PASS+'%. Well done.' : 'You did not reach the pass mark of '+PASS+'%. Use the retake button below.'})
    ]);
    sec.appendChild(head);

    var answered = s.answered;
    var skipped = EX.length - answered - (function(){
      var c = 0; for (var i=0;i<EX.length;i++){ if (S.checked[i]) c++; } return c;
    })();
    var skippedCount = EX.length - s.answered;

    sec.appendChild(el('div',{class:'summary-grid'},[
      summaryCell(formatNum(s.earned), 'Points earned'),
      summaryCell(formatNum(s.max), 'Points possible'),
      summaryCell(answered, 'Exercises answered'),
      summaryCell(skippedCount, 'Exercises skipped'),
      summaryCell(pct+'%', 'Final score'),
      summaryCell(PASS+'%', 'Pass mark')
    ]));

    if (skippedCount > 0){
      sec.appendChild(el('p',{html:'<strong>'+skippedCount+' exercise(s) were skipped and not counted</strong> in the score above. They are listed below with their explanation so you can still learn from them.'}));
    }

    sec.appendChild(el('h3',{text:'Per-exercise report'}));
    for (var i=0;i<EX.length;i++){
      var exIdx = i;
      var ex = EX[exIdx];
      var sc = scoreExercise(exIdx, S.answers[exIdx]);
      var tag;
      if (S.skipped[exIdx]) tag = 'skipped';
      else if (sc.earned >= sc.max) tag = 'full';
      else if (sc.earned > 0) tag = 'partial';
      else tag = 'zero';

      var body = el('div',{class:'pe-body'});
      var ans = S.answers[exIdx] || {};
      // user answer summary
      body.appendChild(buildAnswerSummary(ex, ans, sc));
      if (ex.explanation){
        body.appendChild(el('div',{class:'exp', html:'<strong>Explanation:</strong> '+ex.explanation}));
      }
      var card = el('div',{class:'per-exercise'},[
        el('div',{class:'pe-head'},[
          el('span',{class:'pe-num', text:'Q'+(S.order.indexOf(exIdx)+1)}),
          el('span',{class:'pe-tag '+tag, text: tag.toUpperCase()}),
          el('span',{class:'pe-pts', text: formatNum(sc.earned)+' / '+formatNum(sc.max)+' pt'}),
          el('span',{style:'margin-left:8px;color:var(--muted)', text: ex.theme || ''})
        ]),
        body
      ]);
      sec.appendChild(card);
    }

    // Retake button
    sec.appendChild(el('div',{class:'action-row', style:'margin-top:14px'},[
      el('button',{class:'btn primary', text:'Retake exam', onclick: function(){
        S = freshState();
        S.view = 'intro';
        render();
      }}),
      el('span',{style:'color:var(--muted);font-size:13px', text:'Questions and answer choices will be shuffled again.'})
    ]));

    app.appendChild(sec);
    window.scrollTo(0,0);
  }

  function summaryCell(val, label){
    return el('div',{},[el('b',{text:val}), el('span',{text:label})]);
  }

  function buildAnswerSummary(ex, ans, sc){
    var wrap = el('div',{});
    var yourLine = el('div',{class:'qa'});
    yourLine.appendChild(el('span',{class:'key', text:'Your answer: '}));
    yourLine.appendChild(el('span',{class:'your', html: summariseAnswer(ex, ans)}));
    wrap.appendChild(yourLine);
    var rightLine = el('div',{class:'qa'});
    rightLine.appendChild(el('span',{class:'key', text:'Correct answer: '}));
    rightLine.appendChild(el('span',{class:'right', html: summariseCorrect(ex)}));
    wrap.appendChild(rightLine);
    return wrap;
  }

  function summariseAnswer(ex, ans){
    var t = ex.type;
    if (t === 'qcm-single' || t === 'qcm') return ans.choice ? '['+ans.choice+'] ' + optText(ex, ans.choice) : '(no answer)';
    if (t === 'qcm-multi') return (ans.choices && ans.choices.length) ? ans.choices.map(function(c){return '['+c+'] '+optText(ex,c);}).join('; ') : '(no answer)';
    if (t === 'dragdrop-categorize') {
      var parts = [];
      for (var b in (ans.placements||{})) ans.placements[b].forEach(function(it){ parts.push(it+' -> '+b); });
      return parts.length ? parts.join('; ') : '(no answer)';
    }
    if (t === 'dragdrop-order' || t === 'prioritize') return (ans.order||[]).join(' \u2192 ') || '(no answer)';
    if (t === 'fillblank' || t === 'report-fill') return (ans.blanks||[]).join(' | ') || '(no answer)';
    if (t === 'matching') {
      var ps = [];
      for (var l in (ans.pairs||{})) ps.push(l+' = '+ans.pairs[l]);
      return ps.length ? ps.join('; ') : '(no answer)';
    }
    if (t === 'terminal') return ans.command ? '<code>$ '+escapeHtml(ans.command)+'</code>' : '(no command)';
    if (t === 'logviewer' || t === 'spot-mistake') return (ans.lines&&ans.lines.length) ? ans.lines.join(', ') : '(no selection)';
    if (t === 'scenario-branching') return (ans.path||[]).join(' \u2192 ') || '(no path)';
    if (t === 'dual-perspective') return 'blue=['+(ans.blue||'-')+'] red=['+(ans.red||'-')+']';
    return '(no answer)';
  }
  function summariseCorrect(ex){
    var t = ex.type;
    if (t === 'qcm-single' || t === 'qcm') return '['+ex.correct+'] ' + optText(ex, ex.correct);
    if (t === 'qcm-multi') return ex.correct.map(function(c){return '['+c+'] '+optText(ex,c);}).join('; ');
    if (t === 'dragdrop-categorize') {
      var parts=[];
      for (var b in ex.correct) ex.correct[b].forEach(function(it){ parts.push(it+' -> '+b); });
      return parts.join('; ');
    }
    if (t === 'dragdrop-order' || t === 'prioritize') return ex.correct.join(' \u2192 ');
    if (t === 'fillblank' || t === 'report-fill') return ex.correct.join(' | ');
    if (t === 'matching') return ex.pairs.map(function(p){return p.left+' = '+p.right;}).join('; ');
    if (t === 'terminal') return ex.accept.join(' OR ');
    if (t === 'logviewer' || t === 'spot-mistake') return ex.correct.join(', ');
    if (t === 'scenario-branching') return ex.stages.map(function(s){return s.correct;}).join(' \u2192 ');
    if (t === 'dual-perspective') return 'blue=['+ex.correct.blue+'] red=['+ex.correct.red+']';
    return '';
  }
  function optText(ex, id){
    if (ex.options) { var o = ex.options.find(function(o){return o.id===id;}); return o ? o.text : ''; }
    if (ex.optionsBlue) { var o = ex.optionsBlue.find(function(o){return o.id===id;}); if (o) return o.text; }
    if (ex.optionsRed) { var o = ex.optionsRed.find(function(o){return o.id===id;}); if (o) return o.text; }
    return '';
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function reRender(){
    render();
  }

  // ---- Init ----
  render();
})();

</script>
</body>
</html>
