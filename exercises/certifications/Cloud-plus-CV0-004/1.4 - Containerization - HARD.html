<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>CompTIA Cloud+ (CV0-004) — 1.4 Containerization — HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">{
 "topicId": "cloud-plus",
 "chapter": 1.4,
 "title": "1.4 Containerization — HARD",
 "difficulty": "hard",
 "questionCount": 30,
 "estimatedMinutes": 60,
 "passMark": 70
}</script>
<style>
:root{
  --bg:#0b1220; --bg2:#0e1628; --panel:#131e35; --panel2:#0f1830; --line:#2a3a5e;
  --ink:#eaf1ff; --mut:#a8b8d8; --dim:#7e90b5;
  --acc:#3fc1ff; --acc2:#7dd6ff; --accbg:#0d2436;
  --ok:#41d47f; --okbg:#0c2b1a; --bad:#ff7a7a; --badbg:#2b1113; --warn:#ffb95e; --warnbg:#2b2110;
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace;
}
*{box-sizing:border-box}
.opt,.slot,.chip,.fslot,.lnl,.nbtn,.tin,.lvfilter{scroll-margin-top:96px}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
#app{max-width:1020px;margin:0 auto;padding:14px 14px 60px}
a11y-hidden,.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- top bar ---------- */
#topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin-bottom:14px;position:sticky;top:8px;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#tb-title{font-weight:700;font-size:15px;letter-spacing:.2px;margin-right:auto;display:flex;align-items:center;gap:8px;min-width:200px}
#tb-title .sev{font-size:12px;font-weight:800;letter-spacing:1px;padding:3px 8px;border-radius:999px;border:1px solid var(--warn);color:var(--warn)}
.tbstat{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;min-height:44px;font-size:15px}
.tbstat .lab{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px}
#timer{font-family:var(--mono);font-size:18px;font-weight:700;min-width:74px;text-align:center}
#timer.low{color:var(--bad)}
#timer.paused{color:var(--warn)}
.tbtn{background:var(--accbg);border:1px solid var(--acc);color:var(--acc2);border-radius:9px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:600}
.tbtn:hover{background:#123049}
.tbtn[aria-pressed="true"]{background:var(--acc);color:#04121e}
#chips{display:flex;gap:8px;width:100%}
.pchip{display:none;align-items:center;gap:6px;font-size:13.5px;font-weight:700;border-radius:999px;padding:5px 12px;border:1px solid}
.pchip.on{display:inline-flex}
.pchip.manual{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.pchip.check{border-color:var(--acc);color:var(--acc2);background:var(--accbg)}
#progwrap{width:100%;height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
#progbar{height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .5s ease}

/* ---------- intro ---------- */
.screen{animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{background:radial-gradient(1200px 400px at 20% -10%,rgba(63,193,255,.16),transparent),var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:26px 26px 20px;margin-bottom:16px}
.hero h1{margin:0 0 6px;font-size:26px;line-height:1.25}
.hero .sub{color:var(--mut);margin:0 0 14px;font-size:15.5px}
.metachips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.mchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;color:var(--acc2)}
.mchip b{color:var(--ink)}
.sevbig{display:inline-block;font-weight:800;letter-spacing:1.5px;font-size:13px;color:#04121e;background:var(--warn);
  border-radius:8px;padding:5px 12px;margin-bottom:12px}
.introgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel h2{margin:0 0 10px;font-size:17px;color:var(--acc2)}
.panel ul{margin:8px 0 0;padding-left:20px;color:var(--mut)}
.panel li{margin:7px 0;font-size:15px}
.panel li b{color:var(--ink)}
#kwpanel .ktheme{margin-bottom:12px}
#kwpanel .ktheme h3{margin:0 0 6px;font-size:14px;color:var(--warn);letter-spacing:.4px}
.kwrap{display:flex;flex-wrap:wrap;gap:6px}
.kchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--mut)}
.bigbtn{display:block;width:100%;margin-top:16px;background:linear-gradient(90deg,#0f6fa8,#128a5e);border:2px solid var(--acc);
  color:#fff;font-size:19px;font-weight:800;padding:14px;border-radius:12px;cursor:pointer;letter-spacing:.4px}
.bigbtn:hover{filter:brightness(1.15)}
#hello{color:var(--ok);font-weight:600}

/* ---------- exercise card ---------- */
#excard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#exhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
.qnum{font-weight:800;font-size:15px;color:var(--acc2)}
.echip{font-size:12.5px;font-weight:700;letter-spacing:.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mut)}
.echip.theme{border-color:#4a3a6e;color:#cbb2ff}
#exbody{position:relative;padding:18px}
#exbody.blurred > *:not(#pausemask){filter:blur(12px);pointer-events:none;user-select:none}
#pausemask{display:none;position:absolute;inset:0;align-items:center;justify-content:center;z-index:5}
#pausemask.on{display:flex}
#pausemask div{background:var(--warnbg);border:2px solid var(--warn);color:var(--warn);font-weight:800;
  padding:16px 26px;border-radius:12px;font-size:17px}
.blk{border-radius:12px;padding:14px 16px;margin-bottom:14px}
.blk .btag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:1.2px;margin-bottom:7px;padding:2px 9px;border-radius:6px}
.scn{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--acc)}
.scn .btag{background:var(--accbg);color:var(--acc2)}
.qst{background:#16223f;border:1px solid #33477a;border-left:4px solid var(--warn)}
.qst .btag{background:#2b2110;color:var(--warn)}
.blk p{margin:6px 0}
.blk p:first-of-type{margin-top:0}
.blk p:last-child{margin-bottom:0}
.artifact{background:#0a0f1d;border:1px solid #23304f;border-radius:9px;padding:10px 12px;margin:8px 0;overflow-x:auto}
.artifact .ahead{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
pre.art{margin:0;font-family:var(--mono);font-size:14px;line-height:1.5;color:#cfe3ff;white-space:pre;tab-size:2}
.anslabel{font-size:12.5px;font-weight:800;letter-spacing:1.1px;color:var(--acc2);margin:4px 0 8px}
.pts{color:var(--dim);font-size:13px;margin-left:8px;letter-spacing:.3px}

/* options */
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:7px 0;cursor:pointer;min-height:44px}
.opt:hover{border-color:var(--acc)}
.opt input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--acc);flex:none}
.opt .ot{flex:1}
.opt.picked{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.rev{border-style:dashed;border-color:var(--ok)}
.opt .mk{margin-right:4px}
.anslock{pointer-events:none}
.mk{font-weight:800}
.mk-ok{color:var(--ok)} .mk-bad{color:var(--bad)} .mk-warn{color:var(--warn)}
.vtag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.6px;border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:middle}
.vtag.t-ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.vtag.t-bad{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.vtag.t-rev{background:var(--accbg);color:var(--acc2);border:1px dashed var(--acc)}
.vtag.t-warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}

/* drag & drop */
.dnd{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.slots{display:flex;flex-direction:column;gap:8px}
.zone{border:1px solid var(--line);border-radius:10px;background:var(--panel2);min-height:52px}
.zone .zh{font-size:13.5px;font-weight:700;color:var(--acc2);padding:7px 12px 2px}
.zone .zbody{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 10px;min-height:40px}
.slot{display:flex;align-items:center;gap:8px;justify-content:flex-start;border:1px dashed var(--line);border-radius:10px;
  background:var(--panel2);min-height:48px;padding:6px 12px;cursor:pointer;text-align:left;width:100%}
.slot .sl{color:var(--dim);font-size:13px;font-weight:700;flex:none;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.dragover{border-color:var(--acc);background:var(--accbg)}
.slot.ok{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.slot.bad{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.slot.rev{border-color:var(--ok)}
.slot .ghost{color:var(--ok);font-size:12.5px;font-style:italic}
.slot .plch{background:#0a1022;border:1px solid #3c548c;border-radius:6px;padding:1px 7px;font-size:13px;color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot .plch.ok{border-color:var(--ok);color:var(--ok)}
.slot .plch.bad{border-color:var(--bad);color:var(--bad)}
.slot .plch .vtag{margin-left:5px}
.tray{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:56px;border:1px dashed var(--line);border-radius:10px;padding:10px;background:#0a1022}
.chip{background:#1b2a4d;border:1px solid #3c548c;border-radius:9px;padding:8px 13px;min-height:44px;cursor:grab;font-size:14.5px}
.chip:active{cursor:grabbing}
.chip.picked{border-color:var(--acc);background:var(--accbg);box-shadow:0 0 0 2px rgba(63,193,255,.35)}
.chip.ok{border-color:var(--ok);background:var(--okbg)}
.chip.bad{border-color:var(--bad);background:var(--badbg)}
.chip.rev{border-style:dashed;border-color:var(--warn)}
.chip[draggable="true"]{touch-action:none}
.traylbl,.slotlbl{font-size:12.5px;font-weight:800;letter-spacing:.8px;color:var(--dim);margin:2px 0 6px;text-transform:uppercase}

/* fill */
.ftext{font-size:16px;line-height:2}
.fslot{display:inline-block;min-width:110px;min-height:44px;border:1px dashed var(--acc);border-radius:8px;background:var(--accbg);
  color:var(--acc2);font-family:var(--mono);font-size:14.5px;padding:4px 10px;cursor:pointer;vertical-align:middle;margin:0 3px;text-align:left}
.fslot.dragover{border-style:solid;background:#123049}
.fslot.filled{border-style:solid;color:var(--ink);background:#16223f}
.fslot.ok{border-color:var(--ok);background:var(--okbg)}
.fslot.bad{border-color:var(--bad);background:var(--badbg)}
.fslot .ghost{color:var(--ok);font-size:12px;font-style:italic;margin-left:6px}

/* terminal */
.term{background:#05080f;border:1px solid #1f2c4a;border-radius:10px;overflow:hidden}
.tbar{display:flex;gap:6px;padding:8px 12px;background:#0d1526;border-bottom:1px solid #1f2c4a}
.tdot{width:11px;height:11px;border-radius:99px;background:#2c3c60}
.tdot.r{background:#a34} .tdot.y{background:#b83} .tdot.g{background:#3a5}
.tscr{padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55;color:#bfe0c8;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.tscr .tl-pr{color:#8fb4e8}
.tscr .tl-err{color:var(--bad)}
.tscr .tl-ok{color:var(--ok)}
.tscr .tl-warn{color:var(--warn)}
.trow{display:flex;align-items:center;gap:8px;border-top:1px solid #1f2c4a;padding:9px 12px}
.trow .tpr{font-family:var(--mono);font-size:14px;color:var(--ok)}
.tin{flex:1;background:transparent;border:none;color:#eaf6ff;font-family:var(--mono);font-size:14.5px;min-height:44px}
.termok{border-color:var(--ok)} .termbad{border-color:var(--bad)}

/* log viewer */
.lvbar{display:flex;gap:9px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.lvbar label{font-size:13px;color:var(--mut);font-weight:700}
.lvfilter{flex:1;min-width:180px;background:#0a0f1d;border:1px solid var(--line);border-radius:8px;color:var(--ink);
  font-family:var(--mono);font-size:14px;padding:9px 11px;min-height:44px}
.lwrap{background:#05080f;border:1px solid #1f2c4a;border-radius:10px;max-height:340px;overflow-y:auto;padding:6px}
.lnl{display:flex;gap:9px;width:100%;min-height:44px;text-align:left;background:transparent;border:1px solid transparent;border-radius:7px;
  padding:5px 8px;margin:1px 0;cursor:pointer;font-family:var(--mono);font-size:14px;line-height:1.5;color:#c9dcff;align-items:center}
.lnl:hover{background:#101a30}
.lnl .lno{color:#54658a;min-width:30px;flex:none;text-align:right}
.lnl .selbox{flex:none;color:#54658a;width:16px}
.lnl.sel{background:var(--accbg);border-color:var(--acc)}
.lnl.sel .selbox{color:var(--acc)}
.lnl.ok{border-color:var(--ok);background:var(--okbg)}
.lnl.bad{border-color:var(--bad);background:var(--badbg)}
.lnl.rev{border-style:dashed;border-color:var(--warn)}
.lnl .lvl{flex:none;font-weight:700}
.lvl.W{color:var(--warn)} .lvl.E{color:var(--bad)} .lvl.I{color:#7fa8d9} .lvl.D{color:var(--dim)}
.hl{color:var(--warn);background:rgba(255,185,94,.12);border-radius:3px;padding:0 2px}

/* feedback + explanation */
#fbarea{margin-top:12px}
.fbline{border-radius:10px;padding:11px 14px;margin:8px 0;font-size:15px;border:1px solid}
.fbline.ok{border-color:var(--ok);background:var(--okbg)}
.fbline.bad{border-color:var(--bad);background:var(--badbg)}
.fbline.warn{border-color:var(--warn);background:var(--warnbg)}
.fbscore{font-weight:800}
#hintarea .hint{border:1px dashed var(--warn);background:var(--warnbg);border-radius:10px;padding:10px 14px;margin:8px 0;color:#ffd9a8;font-size:15px}
#expwrap{margin-top:12px;display:none}
#expwrap.on{display:block}
.exp{background:#101a33;border:1px solid #2f4470;border-left:4px solid var(--ok);border-radius:10px;padding:13px 16px;font-size:15.5px;color:#d7e4ff}
.exp h4{margin:0 0 6px;color:var(--ok);font-size:13px;letter-spacing:1px;text-transform:uppercase}
.exp p{margin:7px 0}
.exp code,.blk code{font-family:var(--mono);font-size:13.5px;background:#0a0f1d;border:1px solid #23304f;border-radius:5px;padding:1px 6px;color:#ffd9a8}

/* footer buttons */
#exfoot{display:flex;flex-wrap:wrap;gap:9px;padding:14px 18px;border-top:1px solid var(--line);background:var(--panel2);align-items:center}
.fbtn{border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.fbtn:hover{border-color:var(--acc)}
.fbtn.primary{background:linear-gradient(90deg,#0f6fa8,#128a5e);border-color:var(--acc);color:#fff}
.fbtn.warnb{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.fbtn:disabled{opacity:.45;cursor:not-allowed}
#navhint{margin-left:auto;color:var(--dim);font-size:13px}

/* navigator */
#navigator{display:none;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
#navigator.on{display:grid}
.navtheme{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);
  padding:5px 2px 4px;font-size:13px;font-weight:800;letter-spacing:.4px;color:var(--acc2)}
.navtheme .nt-frac{font-family:var(--mono);font-size:13px;color:var(--mut)}
.nbtn{min-height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);cursor:pointer;font-weight:700;font-size:14px}
.nbtn.cur{outline:3px solid var(--acc)}
.nbtn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.nbtn.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.nbtn.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.nbtn.skip{border-style:dashed;border-color:var(--warn);color:var(--warn)}

/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(4,8,16,.78);z-index:80;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal2{display:none;position:fixed;inset:0;background:rgba(4,8,16,.78);z-index:90;align-items:center;justify-content:center;padding:16px}
#modal2.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:22px 24px}
.mbox h3{margin:0 0 10px}
.mbox p{color:var(--mut);font-size:15px}
.mrow{display:flex;gap:10px;margin-top:16px}
.stat{display:inline-flex;gap:7px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;margin:4px 6px 4px 0;font-size:14.5px}

/* results */
.cert{border:2px solid;border-radius:16px;padding:26px;text-align:center;margin-bottom:16px}
.cert.pass{border-color:var(--ok);background:radial-gradient(600px 200px at 50% -20%,rgba(65,212,127,.18),transparent),var(--panel)}
.cert.fail{border-color:var(--bad);background:radial-gradient(600px 200px at 50% -20%,rgba(255,122,122,.14),transparent),var(--panel)}
.cert .big{font-size:52px;font-weight:900;font-family:var(--mono)}
.cert.pass .big{color:var(--ok)} .cert.fail .big{color:var(--bad)}
.cert .verdict{font-size:21px;font-weight:800;letter-spacing:2px;margin:4px 0 8px}
.cert p{color:var(--mut);margin:4px 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.rcard .rv{font-size:24px;font-weight:800;font-family:var(--mono)}
.rcard .rl{color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.themebar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14.5px}
.themebar .tname{flex:none;width:230px;color:var(--mut)}
.themebar .tbar{flex:1;height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.themebar .tfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--ok))}
.themebar .tnum{flex:none;font-family:var(--mono);font-size:13.5px}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.ritem summary{display:flex;gap:10px;align-items:center;padding:11px 15px;cursor:pointer;min-height:44px;flex-wrap:wrap}
.ritem summary:hover{background:var(--panel2)}
.ritem[open] summary{border-bottom:1px solid var(--line)}
.rq{font-weight:700;margin-right:auto}
.rpts{font-family:var(--mono);font-size:14px}
.rbody{padding:13px 16px;color:var(--mut);font-size:15px}
.rbody h5{margin:10px 0 4px;color:var(--ink);font-size:13px;text-transform:uppercase;letter-spacing:.8px}

{
  id: 'H01', type: 'triage', title: 'Runtime alerts — contain or not?', theme: 'Container security',
  scenario: "<p>02:15, Saturday. <b>Falco</b>, your <b>runtime security</b> engine, pages the on-call rotation with four signals from the payments cluster. Some are attacks; some are Tuesday. Experience says: preserve evidence before you destroy it.</p>",
  question: "<p>Choose the correct response for each signal.</p>",

{
  id: 'H02', type: 'terminal', title: 'Find the listener', theme: 'Fundamentals & architecture',
  scenario: "<p>Hybrid environment: the on-call jump host reaches the Docker Engine host <b>node-14</b>. SOC flagged an unexpected listening TCP port <b>4444</b> on that host. You have a shell on node-14 as an admin user.</p>",
  question: "<p>Identify which PID and process on node-14 is listening on TCP port 4444. Choose your own tools from what the box offers (ss, netstat, lsof are installed) and print the owning process.</p>",
  data: {
    prompt: 'analyst@node-14:~$',
    banner: ['node-14 — Docker Engine host — hybrid office link up'],
    cmds: [
      { re: '^ss\\s+.*4444|^ss\\s+-.*l.*t.*n.*p', out: ['State   Recv-Q  Send-Q  Local Address:Port   Peer Address:Port  Process', 'LISTEN  0       128     0[.]0[.]0[.]0:4444         0[.]0[.]0[.]0:*          users:(("miner-sh",pid=18342,fd=3))'] },
      { re: '^netstat\\s+.*4444|^netstat\\s+-.*l.*t.*n.*p', out: ['tcp   0   0 0[.]0[.]0[.]0:4444   0[.]0[.]0[.]0:*   LISTEN   18342/miner-sh'] },
      { re: '^lsof\\s+-i.*4444', out: ['COMMAND    PID   USER   FD   TYPE  DEVICE SIZE/OFF NODE NAME', 'miner-sh  18342  root   3u   IPv4  91821   0t0      TCP *:4444 (LISTEN)'] },
      { re: '^ps\\s+.*18342', out: ['  PID TTY      STAT   TIME COMMAND', '18342 ?        Sl    402:11 /tmp/.x/miner-sh --pool 185[.]22[.]14[.]9:4444'] },
      { re: '^docker\\s+ps\\b', out: ['CONTAINER ID   IMAGE                        STATUS         NAMES', '4c9f2a1e77b0   registry.acme.cloud/etl:0.8  Up 6 days      etl'] }
    ],
    accepted: ['^ss\\b.*4444', '^netstat\\b.*4444', '^lsof\\s+-i(\\s|.*:)4444'],
    solution: 'ss -ltnp | grep 4444   (or: netstat -tlnp, lsof -i :4444)'
  },
  explanation: "<p>Listing sockets with owning PIDs is the move: <code>ss -ltnp</code> (socket statistics, listening, tcp, numeric, process), <code>netstat -tlnp</code> or <code>lsof -i :4444</code> all reveal the listener. The PID then maps to the rogue <code>miner-sh</code> process — and the <code>/tmp</code> path plus the external pool address confirm a compromised workload. In a hybrid cloud jump-host setup like this, <code>docker ps</code> shows the containers but not a host-side listener, which is why the socket tools matter. The exam goal was operational: <b>find who listens</b>; any of the three tools is a correct expert answer.</p>",
  hints: ['You need listening TCP sockets plus owning process IDs. Three classic tools do exactly that; the flag that prints processes matters.']
},
{
  id: 'H03', type: 'spot', title: 'Multi-stage build, subtle rot', theme: 'Docker & build',
  scenario: "<p>The new multi-stage <b>Dockerfile</b> for pay-api passes CI but the image ships development files, runs as root, and the health check in compose never succeeds. Runtime uses the compose file below.</p>",

      'FROM golang:1.23 AS builder',
      'WORKDIR /src',
      'COPY --from=buildstep /src/app /bin/app',
      'FROM alpine:3.20',
      'COPY --from=builder /src/app /bin/app',
      'EXPOSE 8080',
      'ENTRYPOINT ["/bin/app"]',

  hints: ['One stage name is a ghost. One flag contradicts two other lines. One compose line grants the process maximum power.']

{
  id: 'H05', type: 'cat', title: 'File the incident artefacts', theme: 'Orchestration & cloud integration',

{
  id: 'H06', type: 'map', title: 'Error to root cause — no guessing', theme: 'Kubernetes workloads & services',
  scenario: "<p>Six production symptoms landed on your desk at once. Each has a near-miss trap: the obvious answer is wrong for at least two of them.</p>",
  question: "<p>Match each symptom to its true root cause.</p>",
  data: {
    pairs: [

      ['CrashLoopBackOff, exit 1, log: config key missing', 'ConfigMap not mounted or wrong key name'],
      ['ImagePullBackOff, tag v2.1 in manifest, registry has 2.1', 'Tag mismatch: v-prefixed tag was never pushed'],

{
  id: 'H07', type: 'seq', title: 'Containment sequence under pressure', theme: 'Container security',
  scenario: "<p>Confirmed: attacker code is running inside a pod on the payments cluster and reached the internet. The incident commander asks for your containment sequence — order matters, one wrong step destroys evidence or leaves a door open.</p>",
  question: "<p>Order the six containment and eradication steps correctly.</p>",
  data: {
    steps: [
      'Cordon the node and drain workload (isolate, keep running)',
      'Capture process list, open sockets and container filesystem diffs (evidence)',
      'Export logs and audit records for the window (evidence)',
      'Apply an egress deny network policy around the affected namespace',
      'Rotate every credential the workload could read (secrets, tokens)',
      'Delete affected pods and rebuild the image from a clean, signed base'
    ]
  },
  explanation: "<p>Isolate without killing (cordon/drain keeps memory and sockets alive for forensics), capture volatile evidence, export logs — <code>docker logs</code> or the kubelet copies — before anything restarts, then cut the network with an egress-deny <b>network policy</b>. Only now rotate credentials the attacker may have copied, and finally delete and rebuild from a clean, signed base. No <code>docker exec</code> into the compromised pod after capture, and no <code>docker stop</code> first — on Kubernetes you delete pods, and stopping early destroys the live state. Skipping rotation means the rebuilt cluster is compromised on day one.</p>",
  hints: ['Volatile data dies first, so it is captured first. Credentials are rotated after you can no longer watch, before the rebuild.']

{
  id: 'H08', type: 'multi', title: 'Escape attempt — which findings prove it?', theme: 'Container security',
  scenario: "<p>Legal wants the incident report to say only what evidence supports. From node-14 you collected six findings. Some prove a <b>container escape</b> attempt; others are ordinary or unrelated.</p>",
  question: "<p>Select the findings that genuinely support \"container escape attempt\".</p>",
  data: {

      'A hostPath mount points to /var/run/docker.sock inside the container',
      'New kernel module lunch_add.ko loaded on the host during the window',
      'The image tag in the manifest changed from 1.4.2 to 1.4.3',
      'A bind-mount style host path /srv/backup is mounted read-only into a batch container',

    correct: [0, 1, 2, 5]

  explanation: "<p>Writing to <code>core_pattern</code> is a documented escape trick (the kernel runs your \"handler\" on the host), a <b>docker.sock</b> <b>hostPath</b> hands the container the host daemon, <code>--privileged</b> removes the guards, and a surprise kernel module is host-level change. The namespaces (pid, net, mnt, uts, ipc, user) are the fence around a container, and a privileged container is that fence with the gate open. A routine tag bump and a read-only backup bind mount are ordinary operations — a report that calls them escape evidence loses credibility.</p>",
  hints: ['Ask of each finding: does it break the container boundary, or just normal operations? Two findings are Tuesday.']

{
  id: 'H09', type: 'qcm', title: 'Cross-node traffic fails, same node works', theme: 'Docker & build',
  scenario: "<p>On the new Swarm-style overlay deployment: pods on the same node talk fine. Pods on different nodes cannot reach each other at all. DNS resolves, policies allow, firewalls unchanged for weeks.</p>",
  question: "<p>What is the most probable cause?</p>",
  data: {
    choices: ['The bridge network on one node is misconfigured', 'The overlay data plane (VXLAN/CNI) between nodes is broken', 'Port mapping (-p) was omitted on the pods', 'The cluster DNS server is down'],
    correct: 1
  },
  explanation: "<p>Same-node success uses the local <b>bridge network</b>; cross-node traffic rides the <b>overlay network</b> (VXLAN or the CNI tunnel) between hosts — the data plane that a <b>Docker Swarm</b> overlay or a Kubernetes CNI (chosen at the containerd / CRI-O layer) programs, while <b>kube-proxy</b> rules stay local per node. If the tunnel breaks — MTU mismatch, the VXLAN UDP port blocked, CNI agent down — exactly this split appears; that leg is plain IP over the NICs on bare metal or VMs. <b>host network</b> and <b>macvlan</b> bypass the overlay entirely, <b>port mapping</b> only matters host-to-container entry, and DNS working rules out the resolver. Managed data planes — Amazon ECS or AWS Fargate with <b>serverless containers</b> — configure this same plumbing for you.</p>",
  hints: ['Split the path: inside one node versus between nodes. Which segment does only the failing traffic use?']
},
{
  id: 'H10', type: 'fill', title: 'Default-deny egress with one exception', theme: 'Container security',
  scenario: "<p>After the C2 incident, security baseline EGR-1 demands: this namespace denies <b>all ingress and egress</b>, except DNS lookups. You write the <b>network policy</b> that every CNI understands.</p>",
  question: "<p>Fill the four blanks to implement baseline EGR-1.</p>",
  data: {
    text: "spec:\n  podSelector: {}\n  policyTypes:\n    - {0}\n    - {1}\n  egress:\n    - to:\n        - namespaceSelector: {}\n      ports:\n        - protocol: {2}\n          port: {3}",
    bank: ['Ingress', 'Egress', 'UDP', '53', 'TCP', '443'],
    answers: ['Ingress', 'Egress', 'UDP', '53']
  },
  explanation: "<p>Denying both directions needs <b>policyTypes</b> <code>Ingress</code> and <code>Egress</code> with no ingress rules at all — selection plus type is what denies by default. The YAML manifest above applies to every pod picked by the empty <code>podSelector</code>, and the blast radius of a network policy is exactly the namespace (k8s) it lives in. DNS uses UDP port 53 (cluster DNS), so the single egress rule allows exactly that; TCP 443 would silently re-open the exfiltration path the baseline exists to close.</p>",
  hints: ['Two policy types, one protocol-port pair. Which protocol does name resolution speak?']
}
);

  scenario: "<p>The security steering committee reviews the container control catalogue. To budget honestly, every control must be labelled by when it acts — before, during, or after an attack.</p>",

{

{

{

{

  scenario: "<p>Pod pay-api in namespace <code>pay</code> cannot reach its database by name. You exec into a network-tools pod in the same namespace. The cluster DNS is CoreDNS; the database Service is <code>db.pay.svc.cluster.local</code>.</p>",

  data: {

    cmds: [

  },
  explanation: "<p>The operational goal — <b>service discovery</b> through <b>cluster DNS</b> — is answered by any resolver tool: <code>nslookup</code>, <code>dig</code> or <code>getent hosts</code> return the Service virtual IP (10[.]96[.]44.20), and the DNS server itself is 10[.]96[.]0[.]10. Pinging the VIP proves reachability but never proves what name mapped where; when a name resolves but a connection fails, you have a policy or port problem, not DNS.</p>",

{

{

},
{

  data: {

      {

          { t: 'Kill and restart the pod', outcome: 'The new init container waits on the same broken Job.' },
          { t: 'Lower the init container resources', outcome: 'Wrong component: the init container is idle-waiting; the Job is OOMing.' }

  },
  explanation: "<p>Four stories that look alike in a queue and are not: a flat memory plateau is sizing (not a leak); Running + 503 + empty <b>endpoints</b> is a <b>selector</b> mismatch (not readiness); <b>ImagePullBackOff</b> with a tag that exists elsewhere is a registry-path problem (not a runtime fault); and an init container waiting on a failed upstream <b>Job</b> is healthy by definition. <code>kubectl describe</code> reasoning beats reflexes every shift.</p>",
  hints: ['Each pod is actually healthy except for one external fact: its size, its label, its registry path, or its upstream dependency.']
},
{
  id: 'H30', type: 'qcm', title: 'Immutable deployments at admission', theme: 'Container security',
  scenario: "<p>The new platform rule: deployments must be immutable and traceable end to end, enforced automatically for every team, on every cluster — EKS today, AKS next quarter, plus one GKE cluster for analytics.</p>",
  question: "<p>What must the admission layer require?</p>",
  data: {
    choices: ['Image tags from an approved tag list (latest, stable)', 'Image references pinned by digest with a verified signature', 'Images built only inside the target cluster', 'Registry names from an allowlist, tags free'],
    correct: 1
  },
  explanation: "<p>Immutability means the thing you tested is the thing that runs: a <b>digest</b> reference (<code>@sha256:…</code>) cannot be retagged, and a verified signature (Cosign/<b>image signing</b>) proves who built it — enforced by an <b>admission controller</b> or the <b>trusted registry</b> policy. That one rule is <b>immutable infrastructure</b>, and it is also what makes <b>portability</b> real: enforce it equally on Amazon EKS, Azure AKS and Google GKE, and the same idea extends to serverless targets like Google Cloud Run or Azure Container Apps through their own admission-style controls. A <b>rootless container</b> runtime adds a second layer under this. Tag allowlists are retargetable, allowlisted registries still serve mutable tags, and cluster-local builds solve nothing about trust — which is why the posture travels across a <b>multi-cloud</b> estate.</p>",

  }

var EXM = EXH;
</script>
<script>(function () {
'use strict';
/* ================= helpers ================= */
function $(s, r) { return (r || document).querySelector(s); }
function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function range(n) { var r = []; for (var i = 0; i < n; i++) { r.push(i); } return r; }
function fmtTime(s) { var m = Math.floor(Math.max(0, s) / 60), r = Math.max(0, s) % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function mk(kind, extra) {
  if (kind === 'ok') { return '<span class="mk mk-ok" aria-label="correct">&#10003; correct</span>' + (extra || ''); }
  if (kind === 'bad') { return '<span class="mk mk-bad" aria-label="wrong">&#10007; wrong</span>' + (extra || ''); }
  return '<span class="mk mk-warn" aria-label="attention">&#9888; partial</span>' + (extra || '');
}
function vtag(kind, txt) { return '<span class="vtag t-' + kind + '">' + txt + '</span>'; }

var META = {};
try { META = JSON.parse($('#cm-exercise-meta').textContent); } catch (e) { META = { passMark: 70, topicId: 'cloud-plus' }; }

var TYPE_LABEL = {
  qcm: 'CHOOSE ONE', multi: 'SELECT ALL THAT APPLY',
  cat: 'DRAG EACH ITEM TO A ZONE — or tap an item, then tap a zone',
  map: 'DRAG EACH CHIP TO ITS SLOT — or tap a chip, then tap a slot',
  seq: 'DRAG THE STEPS INTO ORDER — or tap a chip, then tap a slot',
  fill: 'TAP A WORD, THEN TAP A BLANK',
  terminal: 'TYPE THE COMMAND, THEN PRESS ENTER',
  logview: 'SELECT EVERY LINE THAT MATTERS (click to tag)',
  spot: 'CLICK EVERY PROBLEM LINE',
  triage: 'CHOOSE AN ACTION FOR EACH ALERT'
};
var SEVNAME = (SEV === 'medium') ? 'MEDIUM' : 'HARD';

/* ================= state ================= */
var S = {
  started: false, finished: false, order: [], sts: [], idx: 0,
  timeLeft: 0, manual: false, checkPause: false, timerId: null,
  reported: false, user: '', lastTickAt: 0
};

function qi() { return S.order[S.idx]; }
function curEx() { return EXM[qi()]; }
function curSt() { return S.sts[qi()]; }
function penOf(s) { return Math.min(0.1 * s.hints, 1); }

function liveScore() {
  var e = 0, n = 0;
  S.sts.forEach(function (s) { if (s.checked) { e += s.earned; n++; } });
  return { e: e, n: n };
}
function updScore() {
  var sc = liveScore();
  $('#score').textContent = sc.e.toFixed(1).replace(/\.0$/, '') + ' / ' + sc.n;
  $('#score').setAttribute('aria-label', 'Score ' + sc.e.toFixed(1) + ' out of ' + sc.n + ' checked questions');
}
function updProgress() {
  var done = S.sts.filter(function (s) { return s.checked || s.skipped; }).length;
  var pct = Math.round(100 * done / EXM.length);
  $('#progbar').style.width = pct + '%';
  $('#progwrap').setAttribute('aria-valuenow', String(pct));
}
function updTimer() {
  var t = $('#timer');
  t.textContent = fmtTime(S.timeLeft);
  t.className = S.timeLeft <= Math.max(60, Math.round(PER_EX * EXM.length * 0.1)) ? 'low' : '';
}

/* ================= timer ================= */
function startTimer() {
  if (S.timerId) { clearInterval(S.timerId); }
  S.timerId = setInterval(function () {
    if (!S.started || S.finished || S.manual || S.checkPause) { return; }
    S.timeLeft -= 1;
    updTimer();
    if (S.timeLeft <= 0) { S.timeLeft = 0; updTimer(); clearInterval(S.timerId); S.timerId = null; finalize(true); }
  }, 1000);
}
function updPauseUI() {
  $('#chip-manual').className = 'pchip manual' + (S.manual ? ' on' : '');
  $('#chip-check').className = 'pchip check' + (S.checkPause ? ' on' : '');
  var t = $('#timer');
  t.className = (S.manual || S.checkPause) ? 'paused' : (S.timeLeft <= Math.max(60, Math.round(PER_EX * EXM.length * 0.1)) ? 'low' : '');
  var pb = $('#btn-pause');
  pb.setAttribute('aria-pressed', S.manual ? 'true' : 'false');
  pb.innerHTML = S.manual ? '&#9654; Resume' : '&#10074;&#10074; Pause';
  $('#pausemask').className = S.manual ? 'on' : '';
  $('#exbody').className = S.manual ? 'blurred' : '';
}

/* ================= exam lifecycle ================= */
function startExam() {
  S.finished = false; S.reported = false; S.started = true; S.idx = 0;
  S.manual = false; S.checkPause = false; S.order = shuffle(range(EXM.length));
  S.sts = EXM.map(function (ex) {
    var s = { visited: false, touched: false, skipped: false, checked: false, fraction: 0, earned: 0, hints: 0, ans: null, result: null };
    var d = ex.data;
    if (ex.type === 'qcm' || ex.type === 'multi') { s.view = shuffle(range(d.choices.length)); s.ans = (ex.type === 'multi') ? [] : -1; }
    else if (ex.type === 'map') { s.chips = shuffle(range(d.pairs.length)); s.ans = range(d.pairs.length).map(function () { return null; }); }
    else if (ex.type === 'cat') { s.chips = shuffle(range(d.items.length)); s.ans = range(d.items.length).map(function () { return null; }); }
    else if (ex.type === 'seq') { s.chips = shuffle(range(d.steps.length)); s.ans = range(d.steps.length).map(function () { return null; }); }
    else if (ex.type === 'fill') { s.bank = shuffle(range(d.bank.length)); s.ans = range(d.answers.length).map(function () { return null; }); }
    else if (ex.type === 'terminal') { s.lines = []; s.cmds = []; }
    else if (ex.type === 'logview' || ex.type === 'spot') { s.ans = range(d.lines.length).map(function () { return false; }); }
    else if (ex.type === 'triage') { s.ans = range(d.alerts.length).map(function () { return -1; }); }
    return s;
  });
  S.timeLeft = Math.round(PER_EX * EXM.length);
  $('#tb-name').textContent = (META.title || 'Exam');
  $('#tb-sev').textContent = SEVNAME;
  $('#topbar').hidden = false;
  $('#screen-intro').hidden = true;
  $('#screen-results').hidden = true;
  $('#screen-exam').hidden = false;
  buildNavigator();
  updScore(); updProgress(); updTimer(); updPauseUI();
  startTimer();
  renderEx(0);
  window.scrollTo(0, 0);
}

/* ================= navigator ================= */
function buildNavigator() {
  var nav = $('#navigator');
  nav.innerHTML = '';
  var themes = [];
  EXM.forEach(function (ex) { if (themes.indexOf(ex.theme) < 0) { themes.push(ex.theme); } });
  themes.forEach(function (t) {
    var n = EXM.filter(function (ex) { return ex.theme === t; }).length;
    var row = el('div', 'navtheme', '<span class="nt-name">' + esc(t) + '</span><span class="nt-frac" data-theme-frac="' + esc(t) + '">0/' + n + '</span>');
    nav.appendChild(row);
  });
  range(EXM.length).forEach(function (pos) {
    var b = el('button', 'nbtn', String(pos + 1));
    b.setAttribute('aria-label', 'Question ' + (pos + 1) + ': ' + EXM[S.order[pos]].title);
    b.addEventListener('click', function () { gotoEx(pos); });
    nav.appendChild(b);
  });
}
function updNavigator() {
  var done = {};
  $all('#navigator .nbtn').forEach(function (b, pos) {
    var s = S.sts[S.order[pos]];
    var cl = 'nbtn';
    var ic = '';
    if (s.checked) {
      var full = s.fraction >= 0.999, zero = s.fraction <= 0.001;
      cl += full ? ' ok' : (zero ? ' bad' : ' warn');
      ic = full ? '&#10003; ' : (zero ? '&#10007; ' : '&#9888; ');
    } else if (s.skipped) { cl += ' skip'; ic = '&#187; '; }
    if (pos === S.idx) { cl += ' cur'; }
    b.className = cl;
    b.innerHTML = ic + (pos + 1);
    b.setAttribute('aria-label', 'Question ' + (pos + 1) + ': ' + EXM[S.order[pos]].title +
      (s.checked ? ' (checked)' : s.skipped ? ' (skipped)' : ' (not answered)'));
    if (s.checked || s.skipped) {
      var t = EXM[S.order[pos]].theme;
      done[t] = (done[t] || 0) + 1;
    }
  });
  $all('#navigator .nt-frac').forEach(function (sp) {
    var t = sp.getAttribute('data-theme-frac');
    var n = EXM.filter(function (ex) { return ex.theme === t; }).length;
    sp.textContent = (done[t] || 0) + '/' + n;
  });
}

/* ================= navigation ================= */
function gotoEx(pos) {
  if (pos < 0 || pos >= EXM.length || S.finished) { return; }
  S.idx = pos;
  if (S.checkPause) { S.checkPause = false; updPauseUI(); }
  renderEx(pos);
  window.scrollTo(0, 0);
}
function onNext() {
  /* Check-pause ends only when the student actually leaves this exercise (Next/
     navigator). On the last exercise the submit modal may be cancelled, so the
     review pause is kept until a real navigation or a real submit happens. */
  if (S.idx >= EXM.length - 1) { openSubmitModal(); } else { gotoEx(S.idx + 1); }
}
function onPrev() { if (S.idx > 0) { gotoEx(S.idx - 1); } }
function onSkip() {
  var s = curSt();
  if (!s.checked) { s.skipped = true; updProgress(); }
  if (S.idx >= EXM.length - 1) { openSubmitModal(); } else { gotoEx(S.idx + 1); }
}

/* ================= hint ================= */
function onHint() {
  var ex = curEx(), s = curSt();
  if (s.hints >= ex.hints.length) { return; }
  var h = el('div', 'hint');
  h.innerHTML = '<b>Hint ' + (s.hints + 1) + ' of ' + ex.hints.length + '</b> (costs 10% of this question): ' + esc(ex.hints[s.hints]);
  $('#hintarea').appendChild(h);
  s.hints += 1;
  if (s.checked) {
    s.earned = Math.round(Math.max(0, s.fraction * (1 - penOf(s))) * 100) / 100;
    showFeedback(curEx(), s, s.result);
    updNavigator();
    updScore();
  }
  $('#btn-hint').disabled = s.hints >= ex.hints.length;
  $('#btn-hint').setAttribute('aria-label', 'Use hint (' + (ex.hints.length - s.hints) + ' left)');
}

/* ================= check / revise ================= */
function onCheck() {
  var ex = curEx(), s = curSt();
  if (s.checked) { return; }
  var r = RENDER[ex.type].check(ex, s);
  s.result = r;
  RENDER[ex.type].remark(ex, s, $('#abox'));
  s.fraction = r.total ? (r.ok / r.total) : 0;
  s.earned = Math.round(Math.max(0, s.fraction * (1 - penOf(s))) * 100) / 100;
  s.checked = true; s.skipped = false;
  lockAnswer(true);
  showFeedback(ex, s, r);
  showExplanation(true);
  S.checkPause = true;
  updScore(); updProgress(); updNavigator(); updPauseUI(); updFoot();
  /* the pressed Check button was just replaced — keep focus in the flow */
  var fbEl = $('#fbarea');
  fbEl.tabIndex = -1;
  fbEl.focus();
}
function onRevise() {
  var s = curSt();
  s.checked = false;
  lockAnswer(false);
  $('#fbarea').innerHTML = '';
  showExplanation(false);
  updScore(); updProgress(); updNavigator(); updFoot();
  var ansEl = $('#ansarea');
  ansEl.tabIndex = -1;
  ansEl.focus();
}
function lockAnswer(on) {
  var box = $('#ansarea');
  if (!box) { return; }
  box.className = (box.className.replace(/\s*anslock/g, '')) + (on ? ' anslock' : '');
  box.setAttribute('aria-disabled', on ? 'true' : 'false');
}
function showFeedback(ex, s, r) {
  var fb = $('#fbarea');
  fb.innerHTML = '';
  var pts = s.earned.toFixed(1).replace(/\.0$/, '');
  var cls, msg;
  if (s.fraction >= 0.999) { cls = 'ok'; msg = mk('ok') + ' <span class="fbscore">Full credit — ' + pts + ' / 1 pt.</span>'; }
  else if (s.fraction <= 0.001) { cls = 'bad'; msg = mk('bad') + ' <span class="fbscore">0 / 1 pt.</span>'; }
  else { cls = 'warn'; msg = mk('warn') + ' <span class="fbscore">Partial credit — ' + pts + ' / 1 pt (' + r.ok + ' of ' + r.total + ' elements).</span>'; }
  if (s.hints > 0) { msg += ' <span class="pts">(includes a ' + (10 * s.hints) + '% hint cost)</span>'; }
  fb.appendChild(el('div', 'fbline ' + cls, msg));
  (r.lines || []).forEach(function (ln) {
    fb.appendChild(el('div', 'fbline ' + ln.cls, ln.html));
  });
}
function showExplanation(on) {
  var ex = curEx();
  var w = $('#expwrap');
  if (!on) { w.className = ''; w.innerHTML = ''; return; }
  w.className = 'on';
  w.innerHTML = '<div class="exp"><h4>Why — explanation</h4>' + ex.explanation + '</div>';
}

/* ================= render exercise shell ================= */
function renderEx(pos) {
  var ex = EXM[qi()], s = curSt();
  s.visited = true;
  $('#exhead').innerHTML =
    '<span class="qnum">Question ' + (pos + 1) + ' of ' + EXM.length + '</span>' +
    '<span class="echip theme">' + esc(ex.theme) + '</span>' +
    '<span class="echip">' + TYPE_LABEL[ex.type].split('—')[0].trim() + '</span>' +
    '<span class="echip">1 pt &middot; ' + (MULTI_TYPES[ex.type] ? 'partial credit' : 'all or nothing') + '</span>';
  var m = $('#exmain');
  m.innerHTML = '';
  var body = el('div');
  body.id = 'exbody-main';
  body.appendChild(el('h2', null, '<span class="sr">Exercise: </span>' + esc(ex.title)));
  body.appendChild(el('div', 'blk scn', '<span class="btag">SCENARIO</span>' + ex.scenario));
  body.appendChild(el('div', 'blk qst', '<span class="btag">QUESTION</span>' + ex.question));
  var ans = el('div');
  ans.id = 'ansarea';
  ans.setAttribute('aria-label', 'Answer area');
  var lab = el('div', 'anslabel', TYPE_LABEL[ex.type] + '<span class="pts">1 pt</span>');
  ans.appendChild(lab);
  var abox = el('div');
  abox.id = 'abox';
  ans.appendChild(abox);
  body.appendChild(ans);
  body.appendChild(el('div', null, '<div id="fbarea" aria-live="polite"></div><div id="hintarea"></div><div id="expwrap"></div>'));
  m.appendChild(body);
  RENDER[ex.type].build(ex, s, abox);
  if (s.hints > 0) {
    for (var hi = 0; hi < s.hints; hi++) {
      $('#hintarea').appendChild(el('div', 'hint', '<b>Hint ' + (hi + 1) + ':</b> ' + esc(ex.hints[hi])));
    }
  }
  if (s.checked) {
    RENDER[ex.type].remark(ex, s, abox);
    lockAnswer(true);
    showFeedback(ex, s, s.result);
    showExplanation(true);
  } else if (s.skipped && s.touched === false) {
    var sn = el('div', 'fbline warn', mk('warn') + ' You skipped this question. Answer it and press <b>Check</b> to include it in your score before submitting.');
    $('#fbarea').appendChild(sn);
  }
  updFoot();
  updNavigator();
  if (S.manual) { $('#pausemask').className = 'on'; $('#exbody').className = 'blurred'; }
}
function updFoot() {
  var f = $('#exfoot');
  var s = curSt();
  var last = S.idx === EXM.length - 1;
  f.innerHTML = '';
  var prev = el('button', 'fbtn', '&#8592; Previous');
  prev.disabled = S.idx === 0;
  prev.addEventListener('click', onPrev);
  f.appendChild(prev);
  if (!s.checked) {
    var check = el('button', 'fbtn primary', '&#10003; Check');
    check.addEventListener('click', onCheck);
    f.appendChild(check);
    var skip = el('button', 'fbtn warnb', '&#187; Skip');
    skip.addEventListener('click', onSkip);
    f.appendChild(skip);
  } else {
    var rev = el('button', 'fbtn warnb', '&#9998; Revise');
    rev.addEventListener('click', onRevise);
    f.appendChild(rev);
  }
  var hint = el('button', 'fbtn', '? Hint');
  hint.id = 'btn-hint';
  hint.disabled = curEx().hints.length === 0 || s.hints >= curEx().hints.length;
  hint.setAttribute('aria-label', 'Reveal a hint (costs 10 percent of this question)');
  hint.addEventListener('click', onHint);
  f.appendChild(hint);
  var next = el('button', 'fbtn primary', last ? 'Finish &#8594;' : 'Next &#8594;');
  next.addEventListener('click', onNext);
  f.appendChild(next);
  f.appendChild(el('span', null, '<span id="navhint">Check = lock + pause timer for review. Next resumes the clock.</span>'));
}

/* ================= finalize + results ================= */
function collectStats() {
  var checked = 0, skipped = 0, untouched = 0, answeredNoCheck = 0;
  S.sts.forEach(function (s) {
    if (s.checked) { checked++; }
    else if (s.skipped) { skipped++; }
    else if (s.touched) { answeredNoCheck++; }
    else { untouched++; }
  });
  return { checked: checked, skipped: skipped, answeredNoCheck: answeredNoCheck, untouched: untouched };
}
function openSubmitModal() {
  var st2 = collectStats();
  var b = $('#modal-body');
  b.innerHTML = '';
  b.appendChild(el('div', null,
    '<span class="stat">&#10003; Checked: <b>' + st2.checked + '</b></span>' +
    '<span class="stat">&#9998; Answered, not checked: <b>' + st2.answeredNoCheck + '</b> (auto-checked on submit)</span>' +
    '<span class="stat">&#187; Skipped: <b>' + (st2.skipped + st2.untouched) + '</b> (excluded from scoring)</span>' +
    '<p>Skipped questions are not counted in the score. Time left: <b>' + fmtTime(S.timeLeft) + '</b>.</p>'));
  $('#modal').className = 'on';
  $('#modal-cancel').focus();
}
function closeModals() { $('#modal').className = ''; $('#modal2').className = ''; }

function finalize(auto) {
  if (S.finished) { return; }
  var st2 = collectStats();
  if (!auto && st2.checked + st2.answeredNoCheck === 0) {
    $('#modal2-body').innerHTML = '<p>You must answer at least one exercise before the exam can be scored. Skipped-only attempts cannot be submitted.</p>';
    $('#modal2').className = 'on';
    return;
  }
  S.finished = true;
  if (S.timerId) { clearInterval(S.timerId); }
  EXM.forEach(function (ex, i) {
    var s = S.sts[i];
    if (s.checked || s.skipped) { return; }
    if (s.touched) {
      var r = RENDER[ex.type].grade(ex, s);
      s.fraction = r;
      s.earned = Math.round(Math.max(0, r * (1 - penOf(s))) * 100) / 100;
      s.checked = true; s.auto = true;
    } else { s.skipped = true; }
  });
  var total = 0, earned = 0;
  S.sts.forEach(function (s) { if (!s.skipped) { total++; earned += s.earned; } });
  if (total === 0) {
    if (auto) {
      /* Timer ran out with nothing answered: end the exam anyway instead of
         leaving a 00:00 timer that re-opens a dialog every second. */
      renderResults(0, 0, 0, false, true);
      $('#screen-exam').hidden = true;
      $('#screen-results').hidden = false;
      closeModals();
      window.scrollTo(0, 0);
      reportScore(0, 0, 0, false);
      return;
    }
    S.finished = false;
    $('#modal2-body').innerHTML = '<p>All questions are skipped, so the exam cannot be scored. Please answer at least one exercise.</p>';
    $('#modal2').className = 'on';
    return;
  }
  var percent = Math.round(100 * earned / total);
  var passed = percent >= META.passMark;
  renderResults(total, earned, percent, passed);
  $('#screen-exam').hidden = true;
  $('#screen-results').hidden = false;
  closeModals();
  window.scrollTo(0, 0);
  reportScore(Math.round(earned), total, percent, passed);
}

function reportScore(correct, total, percent, passed) {
  if (S.reported) { return; }
  S.reported = true;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      score: correct,
      total: total,
      percent: percent,
      passed: passed
    }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}

function ansTextOf(ex, s) { return RENDER[ex.type].answerText ? RENDER[ex.type].answerText(ex, s) : '(see explanation)'; }
function corrTextOf(ex) { return RENDER[ex.type].correctText ? RENDER[ex.type].correctText(ex) : '(see explanation)'; }

function renderResults(total, earned, percent, passed, allSkipped) {
  var scr = $('#screen-results');
  scr.innerHTML = '';
  var cert = el('div', 'cert ' + (passed ? 'pass' : 'fail'));
  cert.innerHTML =
    '<div class="big">' + percent + '%</div>' +
    '<div class="verdict">' + (passed ? '&#9742; PASS' : '&#10007; FAIL') + '</div>' +
    '<p>' + (allSkipped ?
      'Nothing was scored: every exercise was still skipped when the exam ended. Retake when you are ready — questions and choices are reshuffled.' :
      passed ?
      'Well done. You reached the ' + META.passMark + '% pass mark for this ' + SEVNAME + ' exam.' :
      'You needed ' + META.passMark + '%. Review the report below, then retake the exam — questions and choices are reshuffled.') + '</p>' +
    '<p><b>' + earned.toFixed(1) + '</b> points earned over <b>' + total + '</b> non-skipped exercises' +
    (S.user ? ' &middot; Candidate: <b>' + esc(S.user) + '</b>' : '') + '</p>';
  scr.appendChild(cert);
  var st2 = collectStats();
  var skippedTotal = S.sts.filter(function (s) { return s.skipped; }).length;
  var grid = el('div', 'rgrid');
  [['Score', earned.toFixed(1) + ' / ' + total],
   ['Percentage', percent + '%'],
   ['Pass mark', META.passMark + '%'],
   ['Skipped (excluded)', String(skippedTotal)]].forEach(function (p) {
    grid.appendChild(el('div', 'rcard', '<div class="rv">' + p[1] + '</div><div class="rl">' + p[0] + '</div>'));
  });
  scr.appendChild(grid);
  var themes = {};
  EXM.forEach(function (ex, i) {
    var s = S.sts[i];
    if (!themes[ex.theme]) { themes[ex.theme] = { e: 0, n: 0 }; }
    if (!s.skipped) { themes[ex.theme].n++; themes[ex.theme].e += s.earned; }
  });
  var tp = el('div', 'panel');
  tp.appendChild(el('h2', null, 'Progress by theme'));
  Object.keys(themes).forEach(function (t) {
    var th = themes[t];
    var pct = th.n ? Math.round(100 * th.e / th.n) : 0;
    tp.appendChild(el('div', 'themebar',
      '<span class="tname">' + esc(t) + '</span><span class="tbar"><span class="tfill" style="width:' + pct + '%"></span></span><span class="tnum">' + th.e.toFixed(1) + '/' + th.n + '</span>'));
  });
  scr.appendChild(tp);
  if (skippedTotal > 0) {
    scr.appendChild(el('div', 'skipnote', '&#187; <b>' + skippedTotal + ' exercise(s) were skipped and excluded from scoring</b> — they are neither in the points you earned nor in the total. Their explanations are still listed below so you can learn from them.'));
  }
  var list = el('div', 'rlist');
  S.order.forEach(function (exIdx, pos) {
    var ex = EXM[exIdx], s = S.sts[exIdx];
    var label, cls, pts;
    if (s.skipped) { label = '&#187; skipped'; cls = 'warn'; pts = 'excluded'; }
    else if (s.fraction >= 0.999) { label = '&#10003; full'; cls = 'ok'; pts = s.earned.toFixed(1).replace(/\.0$/, '') + '/1'; }
    else if (s.fraction <= 0.001) { label = '&#10007; zero'; cls = 'bad'; pts = '0/1'; }
    else { label = '&#9888; partial'; cls = 'warn'; pts = s.earned.toFixed(1) + '/1'; }
    var it = el('details', 'ritem');
    it.innerHTML =
      '<summary><span class="vtag t-' + cls + '">' + label + '</span>' +
      '<span class="rq">Q' + (pos + 1) + ' — ' + esc(ex.title) + '</span>' +
      '<span class="rpts">' + pts + ' pt</span></summary>' +
      '<div class="rbody">' +
      (s.skipped ? '<h5>Your answer</h5><p>You skipped this exercise. It was excluded from the score.</p>' :
        '<h5>Your answer</h5><p>' + ansTextOf(ex, s) + '</p>') +
      '<h5>Correct answer</h5><p>' + corrTextOf(ex) + '</p>' +
      '<h5>Explanation</h5>' + ex.explanation +
      '</div>';
    list.appendChild(it);
  });
  scr.appendChild(list);
  var rk = el('button', 'bigbtn', '&#8635; Retake exam');
  rk.addEventListener('click', function () { startExam(); });
  scr.appendChild(rk);
}

/* ================= site handshake ================= */
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  try {
    if (event.data.username) {
      S.user = String(event.data.username);
      var scr = document.getElementById('screen-intro');
      var sub = scr ? scr.querySelector('.sub') : null;
      if (sub && !document.getElementById('hello') && !S.started) {
        var sp = document.createElement('span');
        sp.id = 'hello';
        sp.textContent = S.user;
        sub.insertBefore(document.createTextNode('Good luck, '), sub.firstChild);
        sub.insertBefore(sp, sub.firstChild);
      }
    }
  } catch (e) { /* ignore malformed init */ }
});

/* ================= shared chip-place (drag / tap) ================= */
function placeModel(box, s, cfg, onChange) {
  /* cfg: {slots:[{label}], chips:[{label}], place:[chipIdx -> slotIdx or null]} */
  var picked = -1;
  function chipLbl(i) { return esc(cfg.chips[i]); }
  function render() {
    box.innerHTML = '';
    var sl = el('div', 'dnd');
    var left = el('div');
    left.appendChild(el('div', 'slotlbl', cfg.slotTitle || 'Slots'));
    var slotsWrap = el('div', 'slots');
    cfg.slots.forEach(function (slb, si) {
      var placed = [];
      cfg.place.forEach(function (pi, ci) { if (pi === si) { placed.push(ci); } });
      var slot = el('button', 'slot');
      slot.type = 'button';
      slot.setAttribute('data-si', String(si));
      slot.setAttribute('aria-label', (slb.label || slb) + (placed.length ? ', holds ' + placed.map(chipLbl).join(', ') + ' — press with nothing picked to empty, or press Delete' : ', empty'));
      var html = '<span class="sl">' + esc(slb.label || slb) + '</span><span class="sv">';
      if (placed.length) { html += placed.map(function (ci) { return '<span class="plch" data-pci="' + ci + '">' + esc(cfg.chips[ci]) + '</span>'; }).join(' '); }
      else { html += '<span style="color:var(--dim)">(drop here)</span>'; }
      html += '</span><span class="ghost" data-gh></span>';
      slot.innerHTML = html;
      slot.addEventListener('click', function () { drop(si); });
      slot.addEventListener('keydown', function (ev) {
        if ((ev.key === 'Delete' || ev.key === 'Backspace') && picked < 0) { ev.preventDefault(); drop(si); }
      });
      slot.addEventListener('dragover', function (ev) { ev.preventDefault(); slot.className = 'slot dragover'; });
      slot.addEventListener('dragleave', function () { if (slot.className.indexOf('dragover') >= 0) { slot.className = 'slot'; } });
      slot.addEventListener('drop', function (ev) {
        ev.preventDefault();
        var ci = parseInt(ev.dataTransfer.getData('text/plain'), 10);
        if (!isNaN(ci)) { picked = ci; drop(si); }
      });
      slotsWrap.appendChild(slot);
    });
    left.appendChild(slotsWrap);
    var right = el('div');
    right.appendChild(el('div', 'traylbl', 'Items'));
    var tray = el('div', 'tray');
    tray.setAttribute('aria-label', 'Draggable items');
    cfg.chips.forEach(function (lb, ci) {
      if (cfg.place[ci] != null) { return; }
      var ch = el('button', 'chip' + (picked === ci ? ' picked' : ''), chipLbl(ci));
      ch.type = 'button';
      ch.draggable = true;
      ch.setAttribute('data-ci', String(ci));
      ch.setAttribute('aria-pressed', picked === ci ? 'true' : 'false');
      ch.setAttribute('aria-label', 'Item: ' + cfg.chips[ci] + '. Press to pick, then press a slot to place.');
      ch.addEventListener('click', function () {
        picked = (picked === ci) ? -1 : ci;
        render();
        var nb = box.querySelector('[data-ci="' + ci + '"]');
        if (nb) { nb.focus(); }
      });
      ch.addEventListener('dragstart', function (ev) {
        picked = ci;
        try { ev.dataTransfer.setData('text/plain', String(ci)); } catch (e) { /* older engines */ }
      });
      tray.appendChild(ch);
    });
    right.appendChild(tray);
    sl.appendChild(left); sl.appendChild(right);
    box.appendChild(sl);
    box.appendChild(el('p', 'pts', 'Tap an item, then tap a slot. Tap a filled slot with nothing selected to take its items back out. Keyboard: Enter picks and places, Delete clears a slot.'));
  }
  function drop(si) {
    if (picked < 0) {
      /* nothing picked: tapping an occupied slot takes its items back out */
      var had = false;
      for (var j = 0; j < cfg.place.length; j++) { if (cfg.place[j] === si) { cfg.place[j] = null; had = true; } }
      if (had) { s.touched = true; render(); onChange(); }
      return;
    }
    if (!cfg.multi) {
      /* single-occupant slots (match / order): moving a chip in sends the old
         occupant back to the tray */
      for (var i = 0; i < cfg.place.length; i++) { if (cfg.place[i] === si) { cfg.place[i] = null; } }
    }
    cfg.place[picked] = si;
    picked = -1;
    s.touched = true;
    render();
    onChange();
    var sb = box.querySelectorAll('.slot')[si];
    if (sb) { sb.focus(); }
  }
  render();
  return { render: render };
}

function markChips(box, s, marks) {
  box.querySelectorAll('.chip').forEach(function (ch) {
    var ci = parseInt(ch.getAttribute('data-ci'), 10);
    var m = marks[ci];
    if (m === 'ok') { ch.className = 'chip ok'; ch.insertAdjacentHTML('beforeend', vtag('ok', '&#10003;')); }
    else if (m === 'bad') { ch.className = 'chip bad'; ch.insertAdjacentHTML('beforeend', vtag('bad', '&#10007;')); }
    else if (m === 'miss') { ch.className = 'chip rev'; ch.insertAdjacentHTML('beforeend', vtag('warn', 'you missed this')); }
  });
}
function markSlots(box, rev, marks) {
  box.querySelectorAll('.slot').forEach(function (slot, si) {
    var anyOk = false, anyBad = false;
    slot.querySelectorAll('.plch').forEach(function (sp) {
      var ci = parseInt(sp.getAttribute('data-pci'), 10);
      var m = marks ? marks[ci] : null;
      if (m === 'ok') { anyOk = true; sp.className += ' ok'; sp.insertAdjacentHTML('beforeend', vtag('ok', '&#10003;')); }
      else if (m === 'bad') { anyBad = true; sp.className += ' bad'; sp.insertAdjacentHTML('beforeend', vtag('bad', '&#10007;')); }
    });
    var gh = slot.querySelector('[data-gh]');
    if (anyBad || (!anyOk && rev[si] != null)) {
      slot.className += ' bad rev';
      if (gh && rev[si] != null) { gh.innerHTML = '<span class="ghost">correct: ' + esc(rev[si]) + '</span>'; }
    } else if (anyOk) { slot.className += ' ok'; }
  });
}

/* ================= renderers ================= */
var MULTI_TYPES = { multi: true, cat: true, map: true, seq: true, fill: true, logview: true, spot: true, triage: true };

var RENDER = {};

/* ---- QCM ---- */
RENDER.qcm = {
  build: function (ex, s, box) {
    var d = ex.data;
    box.innerHTML = '';
    s.view.forEach(function (oi) {
      var b = el('button', 'opt' + (s.ans === oi ? ' picked' : ''));
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', s.ans === oi ? 'true' : 'false');
      b.setAttribute('data-oi', String(oi));
      b.innerHTML = '<span class="ot">' + esc(d.choices[oi]) + '</span>';
      b.addEventListener('click', function () {
        if (s.checked) { return; }
        s.ans = oi; s.touched = true;
        box.querySelectorAll('.opt').forEach(function (o) {
          var on = parseInt(o.getAttribute('data-oi'), 10) === oi;
          o.className = 'opt' + (on ? ' picked' : '');
          o.setAttribute('aria-checked', on ? 'true' : 'false');
        });
      });
      box.appendChild(b);
    });
  },
  check: function (ex, s) {
    var d = ex.data;
    var ok = s.ans === d.correct ? 1 : 0;
    var marks = {}; marks[s.ans] = ok ? 'ok' : 'bad';
    return { ok: ok, total: 1, marks: marks, reveal: d.correct };
  },
  remark: function (ex, s, box) {
    var d = ex.data, r = s.result;
    box.querySelectorAll('.opt').forEach(function (o) {
      var oi = parseInt(o.getAttribute('data-oi'), 10);
      o.className = 'opt';
      if (r.marks[oi] === 'ok') { o.className += ' ok'; o.insertAdjacentHTML('beforeend', mk('ok')); }
      if (r.marks[oi] === 'bad') { o.className += ' bad'; o.insertAdjacentHTML('beforeend', mk('bad')); }
      if (oi === r.reveal && r.marks[oi] !== 'ok') { o.className += ' rev'; o.insertAdjacentHTML('beforeend', vtag('rev', 'correct answer')); }
    });
  },
  grade: function (ex, s) { return s.ans === ex.data.correct ? 1 : 0; },
  answerText: function (ex, s) { return s.ans >= 0 ? esc(ex.data.choices[s.ans]) : '(nothing chosen)'; },
  correctText: function (ex) { return esc(ex.data.choices[ex.data.correct]); }
};

/* ---- MULTI ---- */
RENDER.multi = {
  build: function (ex, s, box) {
    var d = ex.data;
    box.innerHTML = '';
    s.view.forEach(function (oi) {
      var sel = s.ans.indexOf(oi) >= 0;
      var b = el('button', 'opt' + (sel ? ' picked' : ''));
      b.type = 'button';
      b.setAttribute('role', 'checkbox');
      b.setAttribute('aria-checked', sel ? 'true' : 'false');
      b.setAttribute('data-oi', String(oi));
      b.innerHTML = '<span class="selbox">' + (sel ? '&#9745;' : '&#9744;') + '</span><span class="ot">' + esc(d.choices[oi]) + '</span>';
      b.addEventListener('click', function () {
        if (s.checked) { return; }
        var p = s.ans.indexOf(oi);
        if (p >= 0) { s.ans.splice(p, 1); } else { s.ans.push(oi); }
        s.touched = true;
        var now = s.ans.indexOf(oi) >= 0;
        b.className = 'opt' + (now ? ' picked' : '');
        b.setAttribute('aria-checked', now ? 'true' : 'false');
        b.querySelector('.selbox').innerHTML = now ? '&#9745;' : '&#9744;';
      });
      box.appendChild(b);
    });
  },
  check: function (ex, s) {
    var d = ex.data, marks = {}, ok = 0;
    d.correct.forEach(function (ci) { if (s.ans.indexOf(ci) >= 0) { ok++; } });
    range(d.choices.length).forEach(function (oi) {
      var sel = s.ans.indexOf(oi) >= 0, isc = d.correct.indexOf(oi) >= 0;
      if (sel && isc) { marks[oi] = 'ok'; }
      else if (sel) { marks[oi] = 'bad'; }
    });
    return { ok: ok, total: d.correct.length, marks: marks, reveal: d.correct.slice() };
  },
  remark: function (ex, s, box) {
    var r = s.result;
    box.querySelectorAll('.opt').forEach(function (o) {
      var oi = parseInt(o.getAttribute('data-oi'), 10);
      o.className = 'opt';
      if (r.marks[oi] === 'ok') { o.className += ' ok'; o.insertAdjacentHTML('beforeend', mk('ok')); }
      else if (r.marks[oi] === 'bad') { o.className += ' bad'; o.insertAdjacentHTML('beforeend', mk('bad')); }
      else if (r.reveal.indexOf(oi) >= 0) { o.className += ' rev'; o.insertAdjacentHTML('beforeend', vtag('rev', 'you missed this')); }
    });
  },
  grade: function (ex, s) {
    var d = ex.data, ok = 0;
    d.correct.forEach(function (ci) { if (s.ans.indexOf(ci) >= 0) { ok++; } });
    return ok / d.correct.length;
  },
  answerText: function (ex, s) {
    if (!s.ans.length) { return '(nothing selected)'; }
    return '<ul>' + s.ans.map(function (oi) { return '<li>' + esc(ex.data.choices[oi]) + '</li>'; }).join('') + '</ul>';
  },
  correctText: function (ex) {
    return '<ul>' + ex.data.correct.map(function (oi) { return '<li>' + esc(ex.data.choices[oi]) + '</li>'; }).join('') + '</ul>';
  }
};

/* ---- CAT (drag to zones) ---- */
RENDER.cat = {
  build: function (ex, s, box) {
    var d = ex.data;
    var cfg = {
      slots: d.zones.map(function (z) { return { label: z }; }),
      chips: d.items.map(function (it) { return it.t; }),
      place: s.ans,
      slotTitle: 'Zones',
      multi: true /* several items can share one zone */
    };
    s._pm = placeModel(box, s, cfg, function () { /* live */ });
  },
  check: function (ex, s) {
    var d = ex.data, marks = {}, ok = 0, rev = {};
    d.items.forEach(function (it, ci) {
      if (s.ans[ci] === it.z) { marks[ci] = 'ok'; ok++; }
      else { marks[ci] = s.ans[ci] == null ? 'miss' : 'bad'; }
    });
    d.items.forEach(function (it, ci) {
      if (marks[ci] !== 'ok') { rev[it.z] = it.t; }
    });
    return { ok: ok, total: d.items.length, marks: marks, rev: rev };
  },
  remark: function (ex, s, box) {
    var r = s.result;
    markChips(box, s, r.marks);
    markSlots(box, r.rev, r.marks);
  },
  grade: function (ex, s) {
    var ok = 0;
    ex.data.items.forEach(function (it, ci) { if (s.ans[ci] === it.z) { ok++; } });
    return ok / ex.data.items.length;
  },
  answerText: function (ex, s) {

RENDER.seq = {

      if (s.ans[ci] === ci) { marks[ci] = 'ok'; ok++; }

    });
    return { ok: ok, total: d.steps.length, marks: marks, rev: rev };
  },
  remark: function (ex, s, box) { markChips(box, s, s.result.marks); markSlots(box, s.result.rev, s.result.marks); },
  grade: function (ex, s) {

RENDER.fill = {
  build: function (ex, s, box) {
    var d = ex.data;

    var ft = el('div', 'ftext');
    parts.forEach(function (p, i) {
      if (i % 2 === 0) { ft.insertAdjacentHTML('beforeend', esc(p)); }
      else {
        var si = parseInt(p, 10);
        var b = el('button', 'fslot' + (s.ans[si] != null ? ' filled' : ''));
        b.type = 'button';
        b.setAttribute('data-si', String(si));
        b.setAttribute('aria-label', 'Blank ' + (si + 1) + (s.ans[si] != null ? ', filled with ' + d.bank[s.ans[si]] : ', empty'));
        b.innerHTML = s.ans[si] != null ? esc(d.bank[s.ans[si]]) : '____';
        b.innerHTML += '<span class="ghost" data-gh></span>';
        function refocusBlank() { var nb = box.querySelector('.fslot[data-si="' + si + '"]'); if (nb) { nb.focus(); } }
        b.addEventListener('click', function () {
          if (s.checked) { return; }
          if (s._pick == null) {
            /* No word picked: tapping a filled blank empties it. */
            if (s.ans[si] != null) { s.ans[si] = null; s.touched = true; RENDER.fill.build(ex, s, box); refocusBlank(); }
            return;
          }
          for (var k = 0; k < s.ans.length; k++) { if (s.ans[k] === s._pick) { s.ans[k] = null; } }
          s.ans[si] = s._pick;
          s._pick = null; s.touched = true;
          RENDER.fill.build(ex, s, box);
          refocusBlank();
        });
        b.addEventListener('dragover', function (ev) { ev.preventDefault(); if (!s.checked) { b.className = 'fslot dragover' + (s.ans[si] != null ? ' filled' : ''); } });
        b.addEventListener('dragleave', function () { b.className = 'fslot' + (s.ans[si] != null ? ' filled' : ''); });
        b.addEventListener('drop', function (ev) {
          ev.preventDefault();
          if (s.checked) { return; }
          var bi = parseInt(ev.dataTransfer.getData('text/plain'), 10);

          refocusBlank();

    box.appendChild(el('div', 'traylbl', 'Word bank (shuffled)'));
    var tray = el('div', 'tray');
    s.bank.forEach(function (bi) {

      var ch = el('button', 'chip' + (used ? ' ok' : '') + (s._pick === bi ? ' picked' : ''), esc(d.bank[bi]));
      ch.type = 'button';
      ch.draggable = true;
      ch.setAttribute('data-bi', String(bi));
      if (used) { ch.disabled = true; }
      ch.addEventListener('click', function () {

        s._pick = (s._pick === bi) ? null : bi;
        RENDER.fill.build(ex, s, box);
        var nb = box.querySelector('[data-bi="' + bi + '"]');
        if (nb) { nb.focus(); }
      });
      ch.addEventListener('dragstart', function (ev) { s._pick = bi; try { ev.dataTransfer.setData('text/plain', String(bi)); } catch (e) { } });
      tray.appendChild(ch);
    });
    box.appendChild(tray);
    var fb = el('div', null, '<p class="pts">Tap a word, then tap the blank where it belongs. Tap a filled blank to empty it.</p>');
    box.appendChild(fb);
  },
  check: function (ex, s) {

      else { marks[si] = placed ? 'bad' : 'miss'; rev[si] = w; }
    });

  },
  remark: function (ex, s, box) {

  },
  grade: function (ex, s) {

  },
  answerText: function (ex, s) {
    var d = ex.data, rows = [];

/* ---- TERMINAL ---- */
RENDER.terminal = {
  build: function (ex, s, box) {
    var d = ex.data;
    box.innerHTML = '';
    var t = el('div', 'term');
    t.innerHTML = '<div class="tbar"><span class="tdot r"></span><span class="tdot y"></span><span class="tdot g"></span></div>';
    var scr = el('div', 'tscr');
    scr.setAttribute('aria-live', 'polite');
    s.lines.forEach(function (ln) { scr.appendChild(el('div', ln.cls ? 'tl-' + ln.cls : null, esc(ln.t))); });
    t.appendChild(scr);
    var row = el('div', 'trow');
    row.innerHTML = '<span class="tpr">' + esc(d.prompt || 'analyst@jump:~$') + '</span>';
    var inp = el('input', 'tin');
    inp.type = 'text';
    inp.setAttribute('aria-label', 'Terminal input');
    inp.autocomplete = 'off';
    inp.spellcheck = false;
    row.appendChild(inp);
    t.appendChild(row);
    box.appendChild(t);
    inp.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter') { return; }
      var cmd = inp.value.replace(/\s+/g, ' ').trim();
      if (!cmd) { return; }
      s.cmds.push(cmd);
      s.touched = true;
      s.lines.push({ t: (d.prompt || 'analyst@jump:~$') + ' ' + cmd, cls: 'pr' });
      var hit = null;
      (d.cmds || []).forEach(function (c) { if (!hit && new RegExp(c.re, 'i').test(cmd)) { hit = c; } });
      if (hit) { hit.out.forEach(function (o) { s.lines.push({ t: o }); }); }
      else { s.lines.push({ t: '[simulator] This lab only responds to the kind of command the task asks for. Check the goal and the tools available on this box.', cls: 'err' }); }
      RENDER.terminal.build(ex, s, box);
      var nb = box.querySelector('.tin');
      if (nb) { nb.focus(); }
      var sc2 = box.querySelector('.tscr');
      if (sc2) { sc2.scrollTop = sc2.scrollHeight; }
    });
    box.appendChild(el('p', 'pts', 'Commands run here are simulated — nothing leaves this page. Press Check when your command is entered.'));
  },
  check: function (ex, s) {
    var d = ex.data;
    var hit = null;
    s.cmds.forEach(function (c) {
      if (hit) { return; }
      d.accepted.forEach(function (re) { if (!hit && new RegExp(re, 'i').test(c)) { hit = c; } });
    });
    if (hit) {
      s.lines.push({ t: 'verdict: accepted — ' + hit, cls: 'ok' });
    } else {
      s.lines.push({ t: 'verdict: none of the entered commands satisfies the task.', cls: 'err' });
      s.lines.push({ t: 'one accepted answer: ' + d.solution, cls: 'warn' });
    }
    return { ok: hit ? 1 : 0, total: 1, marks: {}, lines: [] };
  },
  remark: function (ex, s, box) {
    var sc2 = box.querySelector('.tscr');
    if (sc2) {
      sc2.innerHTML = '';
      s.lines.forEach(function (ln) { sc2.appendChild(el('div', ln.cls ? 'tl-' + ln.cls : null, esc(ln.t))); });
      sc2.scrollTop = sc2.scrollHeight;
    }
    box.querySelector('.term').className = 'term ' + (s.result.ok ? 'termok' : 'termbad');
  },
  grade: function (ex, s) {
    var hit = false;
    s.cmds.forEach(function (c) {
      if (hit) { return; }
      ex.data.accepted.forEach(function (re) { if (!hit && new RegExp(re, 'i').test(c)) { hit = true; } });
    });
    return hit ? 1 : 0;
  },
  answerText: function (ex, s) {
    return s.cmds.length ? '<code>' + esc(s.cmds[s.cmds.length - 1]) + '</code>' : '(no command entered)';
  },
  correctText: function (ex) { return '<code>' + esc(ex.data.solution) + '</code>'; }
};

/* ---- LOGVIEW / SPOT (select lines) ---- */
function lineText(ln) { return (typeof ln === 'string') ? ln : (ln && ln.t ? ln.t : ''); }
function linesBuild(ex, s, box, withFilter) {
  var d = ex.data;
  box.innerHTML = '';
  if (withFilter) {
    var bar = el('div', 'lvbar');
    bar.innerHTML = '<label for="lvf">Filter:</label>';
    var f = el('input', 'lvfilter');
    f.id = 'lvf';
    f.type = 'text';
    f.placeholder = 'type to filter lines, e.g. error or the pod name';
    f.setAttribute('aria-label', 'Filter log lines');
    bar.appendChild(f);
    var clr = el('button', 'fbtn', 'Clear selection');
    clr.type = 'button';
    clr.addEventListener('click', function () {
      if (s.checked) { return; }
      s.ans = s.ans.map(function () { return false; });
      linesBuild(ex, s, box, withFilter);
    });
    bar.appendChild(clr);
    box.appendChild(bar);
    f.addEventListener('input', function () {
      var q = f.value.toLowerCase();
      box.querySelectorAll('.lnl').forEach(function (ln) {
        var i = parseInt(ln.getAttribute('data-li'), 10);
        ln.style.display = lineText(d.lines[i]).toLowerCase().indexOf(q) >= 0 ? '' : 'none';
      });
    });
  }
  var w = el('div', 'lwrap');
  w.setAttribute('role', 'group');
  w.setAttribute('aria-label', withFilter ? 'Log lines' : 'File lines');
  d.lines.forEach(function (ln, i) {
    var b = el('button', 'lnl' + (s.ans[i] ? ' sel' : ''));
    b.type = 'button';
    b.setAttribute('data-li', String(i));
    b.setAttribute('aria-pressed', s.ans[i] ? 'true' : 'false');
    b.setAttribute('aria-label', 'Line ' + (i + 1) + (ln.lvl ? ', level ' + ln.lvl : '') + '. Press to tag.');
    var head = '<span class="lno">' + (i + 1) + '</span><span class="selbox">' + (s.ans[i] ? '&#9745;' : '&#9744;') + '</span>';
    if (ln.lvl) { head += '<span class="lvl ' + ln.lvl + '">' + ln.lvl + '</span>'; }
    b.innerHTML = head + '<span class="lt">' + lineText(ln) + '</span>';
    b.addEventListener('click', function () {
      if (s.checked) { return; }
      s.ans[i] = !s.ans[i];
      s.touched = true;
      b.className = 'lnl' + (s.ans[i] ? ' sel' : '');
      b.setAttribute('aria-pressed', s.ans[i] ? 'true' : 'false');
      b.querySelector('.selbox').innerHTML = s.ans[i] ? '&#9745;' : '&#9744;';
    });
    w.appendChild(b);
  });
  box.appendChild(w);
}
function linesCheck(ex, s) {
  var d = ex.data, marks = {}, ok = 0;
  d.correct.forEach(function (i) { if (s.ans[i]) { ok++; } });
  range(d.lines.length).forEach(function (i) {
    var exp = d.correct.indexOf(i) >= 0;
    if (exp && s.ans[i]) { marks[i] = 'ok'; }
    else if (!exp && s.ans[i]) { marks[i] = 'bad'; }
    else if (exp && !s.ans[i]) { marks[i] = 'miss'; }
  });
  return { ok: ok, total: d.correct.length, marks: marks };
}
function linesRemark(ex, s, box) {
  var r = s.result;
  box.querySelectorAll('.lnl').forEach(function (ln) {
    var i = parseInt(ln.getAttribute('data-li'), 10), m = r.marks[i];
    if (m === 'ok') { ln.className += ' ok'; ln.insertAdjacentHTML('beforeend', vtag('ok', '&#10003;')); }
    else if (m === 'bad') { ln.className += ' bad'; ln.insertAdjacentHTML('beforeend', vtag('bad', '&#10007; not relevant')); }
    else if (m === 'miss') { ln.className += ' rev'; ln.insertAdjacentHTML('beforeend', vtag('warn', 'you missed this line')); }
  });
}
function linesGrade(ex, s) {
  var ok = 0;
  ex.data.correct.forEach(function (i) { if (s.ans[i]) { ok++; } });
  return ok / ex.data.correct.length;
}
function linesAnsText(ex, s) {
  var d = ex.data, sel = [];
  s.ans.forEach(function (v, i) { if (v) { sel.push(i); } });
  if (!sel.length) { return '(no lines selected)'; }
  return '<ul>' + sel.slice(0, 6).map(function (i) { return '<li><code>' + esc(lineText(d.lines[i]).slice(0, 90)) + '</code></li>'; }).join('') +
    (sel.length > 6 ? '<li>… and ' + (sel.length - 6) + ' more</li>' : '') + '</ul>';
}
function linesCorrText(ex) {
  return '<ul>' + ex.data.correct.map(function (i) { return '<li><code>' + esc(lineText(ex.data.lines[i]).slice(0, 110)) + '</code></li>'; }).join('') + '</ul>';
}
RENDER.logview = {
  build: function (ex, s, box) { linesBuild(ex, s, box, true); },
  check: linesCheck, remark: linesRemark, grade: linesGrade,
  answerText: linesAnsText, correctText: linesCorrText
};
RENDER.spot = {
  build: function (ex, s, box) { linesBuild(ex, s, box, false); },
  check: linesCheck, remark: linesRemark, grade: linesGrade,
  answerText: linesAnsText, correctText: linesCorrText
};

RENDER.triage = {
  build: function (ex, s, box) {

        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', sel ? 'true' : 'false');

            var on = parseInt(o2.getAttribute('data-oi'), 10) === oi;

  check: function (ex, s) {

      if (marks[ai] === 'ok') {
        outcomes.push({ cls: 'ok', html: mk('ok') + ' <b>' + esc(a.name) + ':</b> ' + esc(a.options[a.correct].outcome) });
      } else {
        outcomes.push({ cls: marks[ai] === 'bad' ? 'bad' : 'warn', html: (marks[ai] === 'bad' ? mk('bad') : mk('warn')) + ' <b>' + esc(a.name) + ':</b> your choice — "' + esc(chosen ? chosen.t : 'no choice') + '" — ' + esc(chosen ? chosen.outcome : 'left the alert untouched.') + ' Better: <b>' + esc(a.options[a.correct].t) + '</b> — ' + esc(a.options[a.correct].outcome) });
      }
    });
    return { ok: ok, total: d.alerts.length, marks: marks, lines: outcomes };
  },
  remark: function (ex, s, box) {

    box.querySelectorAll('.opt').forEach(function (o) {
      var ai = parseInt(o.getAttribute('data-ai'), 10), oi = parseInt(o.getAttribute('data-oi'), 10);

      if (s.ans[ai] === oi) {

  },
  answerText: function (ex, s) {

    n.className = on ? 'on' : '';
    this.setAttribute('aria-expanded', on ? 'true' : 'false');
    var kl = $('#kwlist');
    if (!kl) {
      kl = el('div', null);
      kl.id = 'kwlist';
      kl.style.gridColumn = '1 / -1';
      KEYWORDS.forEach(function (th) {
        kl.appendChild(el('div', 'ktheme', '<h3>' + esc(th.t) + '</h3><div class="kwrap">' +
          th.k.map(function (k) { return '<span class="kchip">' + esc(k) + '</span>'; }).join('') + '</div>'));
      });
      n.insertBefore(kl, n.firstChild);
    }
  });
  $('#modal-cancel').addEventListener('click', closeModals);
  $('#modal-ok').addEventListener('click', function () { closeModals(); finalize(false); });
  $('#modal2-ok').addEventListener('click', closeModals);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closeModals(); }
  });
}

/* ================= boot ================= */
bindChrome();
buildIntro();
updTimer();

})();
</script>
</body>
</html>
