function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function norm(s){return String(s||"").toLowerCase().replace(/\s+/g," ").trim()}
function ICON(st){return st==="good"?"\u2713":st==="bad"?"\u2717":"\u25D0"}
function r1(n){return Math.round(n*100)/100}
function smoothPref(){try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}catch(e){return "smooth"}}

var S={idx:0,exs:[],work:[],checked:{},skipped:{},hints:{},started:false,ended:false,
  remain:0,total:0,manualPause:false,checkPause:false,tick:null,reported:false,user:""};

/* ---------- attempt lifecycle ---------- */
function buildAttempt(){
  S.idx=0;S.checked={};S.skipped={};S.hints={};S.started=false;S.ended=false;
  S.manualPause=false;S.checkPause=false;S.reported=false;
  S.total=META.estimatedMinutes*60;S.remain=S.total;
  S.exs=sh(EX).map(function(e){return e});
  S.work=S.exs.map(function(e,i){return makeWork(e,i)});
  clearInterval(S.tick);
}
function makeWork(ex,i){
  var st={i:i,ex:ex,a:{},refs:{},locked:false};
  var f=W[ex.type];if(f&&f.init)f.init(st);
  return st;
}

/* ---------- timer ---------- */
function tick(){
  if(!S.started||S.ended)return;
  if(S.manualPause||S.checkPause){renderTimer();return}
  S.remain--;
  if(S.remain<=0){S.remain=0;renderTimer();finishExam(true);return}
  renderTimer();
}
function startTimer(){clearInterval(S.tick);S.tick=setInterval(tick,1000)}
function pauseStates(){
  var a=[];if(S.manualPause)a.push("Paused (manual)");if(S.checkPause)a.push("Timer paused \u2014 review mode");
  return a;
}
function renderTimer(){
  var p=$("#pill-time");if(!p)return;
  p.textContent=fmtT(S.remain);
  p.classList.toggle("warn",S.remain>0&&S.remain<=S.total*0.2);
  p.classList.toggle("danger",S.remain>0&&S.remain<=S.total*0.1);
  var ind=$("#ind"),ps=pauseStates();
  if(ps.length){ind.classList.remove("hid");ind.textContent="\u23F8 "+ps.join(" + ")+" \u2014 the clock is frozen"}
  else ind.classList.add("hid");
  var pb=$("#btn-pause");
  if(pb)pb.textContent=S.manualPause?"Resume":"Pause";
}
function fmtT(s){s=Math.max(0,Math.floor(s));var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}

/* ---------- live score ---------- */
function earnedOf(i){var c=S.checked[i];if(!c)return 0;return c.earned}
function maxOf(i){var c=S.checked[i];return c?c.max:0}
function liveScore(){var t=0;for(var i=0;i<S.exs.length;i++){if(S.checked[i])t+=S.checked[i].earned}return r1(t)}
function updateHeader(){
  var sc=$("#pill-score");if(sc)sc.textContent="Score "+liveScore()+(liveScore()%1?" pts":" pts");
  var done=0;for(var i=0;i<S.exs.length;i++){if(S.checked[i]||S.skipped[i])done++}
  var pf=$("#pfill");if(pf)pf.style.width=Math.round(done/S.exs.length*100)+"%";
  $("#pill-q").textContent="Q "+(S.idx+1)+"/"+S.exs.length;
  var th=$("#themes");if(th){
    th.innerHTML="";
    THEMES.forEach(function(t){
      var got=0,max=0;
      for(var i=0;i<S.exs.length;i++){
        var ex=S.exs[i];if(!ex.tags||!S.checked[i])continue;
        var hit=ex.tags.some(function(g){return t.k.indexOf(g)>=0});
        if(hit){max+=S.checked[i].max;got+=S.checked[i].earned}
      }
      if(max>0)th.appendChild(el("span","th",esc(t.n)+" <b>"+r1(got)+"/"+max+"</b>"));
    });
  }
  renderNav();
}
function navState(i){
  if(S.skipped[i]&&!S.checked[i])return "st-sk";
  var c=S.checked[i];if(!c)return "";
  var m=c.max||1;
  if(c.earned>=m)return "st-ok";
  if(c.earned<=0)return "st-bad";
  return "st-part";
}
function navSym(i){
  if(S.skipped[i]&&!S.checked[i])return "\u21B7";
  var c=S.checked[i];if(!c)return "";
  var m=c.max||1;
  if(c.earned>=m)return "\u2713";
  if(c.earned<=0)return "\u2717";
  return "\u25D0";
}
function renderNav(){
  var nav=$("#nav");if(!nav)return;nav.innerHTML="";
  S.exs.forEach(function(ex,i){
    var b=el("button","nc "+navState(i)+(i===S.idx?" cur":""));
    b.type="button";b.innerHTML=esc(String(i+1))+'<span class="s">'+navSym(i)+"</span>";
    b.setAttribute("aria-label","Question "+(i+1)+": "+(navSym(i)==="\u2713"?"correct":navSym(i)==="\u2717"?"wrong":navSym(i)==="\u25D0"?"partial":navSym(i)==="\u21B7"?"skipped":"not answered")+". Open question "+(i+1));
    b.title="Q"+(i+1)+" \u2014 "+ex.title;
    b.onclick=function(){goTo(i)};
    nav.appendChild(b);
  });
}

/* ---------- navigation ---------- */
function goTo(i){
  if(S.ended)return;
  if(S.checkPause){S.checkPause=false;renderTimer()}
  S.idx=Math.max(0,Math.min(S.exs.length-1,i));
  renderEx();updateHeader();
  window.scrollTo({top:0,behavior:smoothPref()});
}
function nextEx(){
  S.checkPause=false;renderTimer();
  if(S.idx>=S.exs.length-1){showFinish();return}
  goTo(S.idx+1);
}
function prevEx(){goTo(S.idx-1)}
function showFinish(){
  var b=$("#btn-fin");if(b){b.classList.remove("hid")}
  $("#btn-next").classList.add("hid");
}

/* ---------- check / skip / revise / hint ---------- */
function doCheck(){
  var i=S.idx,st=S.work[i],ex=st.ex,f=W[ex.type];
  var res=f.score(st);
  var mult=S.hints[i]?0.9:1;
  var earned=r1(res.earned*mult);
  S.checked[i]={earned:earned,max:res.max,yours:res.yours,correct:res.correct};
  S.skipped[i]=false;
  st.locked=true;if(f.lock)f.lock(st);
  f.paint(st,res);
  var fb=$("#fb");fb.classList.remove("hid","full","part","zero");
  var label=earned>=res.max-0.001?"full":earned<=0?"zero":"partial";
  fb.classList.add(label);
  var note=S.hints[i]?" (includes \u221210% hint cost)":"";
  fb.innerHTML=ICON(label==="full"?"good":label==="zero"?"bad":"part")+
    " <b>You earned "+fmtP(earned)+" / "+fmtP(res.max)+" points</b> on this exercise \u2014 "+label+"."+note+
    (label==="part"?" Each correct element counts; wrong elements earn nothing extra.":"");
  var xp=$("#explain");xp.classList.remove("hid");
  $("#check-pause-note").classList.remove("hid");
  S.checkPause=true;
  renderTimer();updateHeader();
}
function fmtP(n){
  if(Math.abs(n-Math.round(n))<0.005)return String(Math.round(n));
  return String(Math.round(n*100)/100);
}
function doSkip(){
  S.skipped[S.idx]=true;
  if(S.idx>=S.exs.length-1){showFinish();renderNav();return}
  nextEx();
  updateHeader();
}
function doRevise(){
  var i=S.idx,st=S.work[i];
  delete S.checked[i];st.locked=false;
  S.work[i]=makeWork(st.ex,i);
  renderEx();updateHeader();
}
function doHint(){
  var i=S.idx,ex=S.exs[i],hb=$("#hintbox");
  if(S.hints[i]){if(hb)hb.classList.remove("hid");return}
  S.hints[i]=true;
  if(hb){hb.textContent="Hint (\u221210% on this exercise): "+ex.hint;hb.classList.remove("hid")}
  $("#btn-hint").setAttribute("disabled","disabled");
}

/* ---------- exercise rendering ---------- */
var ANS_LABEL={
  qcm:"CHOOSE ONE",multi:"CHOOSE ALL THAT APPLY",categorize:"DRAG OR CLICK TO SORT THE ITEMS",
  match:"MATCH THE PAIRS \u2014 click one item on each side",order:"PUT THE STEPS IN ORDER (drag, or use the arrows)",
  rank:"RANK \u2014 position 1 = handle first (drag, or use the arrows)",fill:"CLICK A WORD, THEN CLICK A BLANK",
  spot:"CLICK THE ONE LINE THAT CONTAINS THE MISTAKE",tree:"WORK THROUGH THE DECISIONS",
  triage:"SET AN ACTION FOR EVERY ROW",terminal:"TYPE THE COMMAND AND PRESS RUN",dual:"TWO VIEWS \u2014 answer both sides"
};
function renderEx(){
  var i=S.idx,st=S.work[i],ex=st.ex;
  var stage=$("#stage");stage.innerHTML="";
  var body=el("div","ex-body");
  var head=el("div","ex-head");
  head.innerHTML='<span class="ex-num">Q'+(i+1)+" of "+S.exs.length+"</span>"+
    '<span class="ex-title">'+esc(ex.title)+"</span>"+
    '<span class="ex-pts">'+fmtP(ex.pts)+" pts \u00B7 severity: "+esc(META.difficulty.toUpperCase())+"</span>";
  body.appendChild(head);
  if(ex.scenario){
    var s=el("div","blk blk-scn",'<span class="bl-label">\uD83D\uDCCB SCENARIO / CONTEXT</span>'+ex.scenario);
    body.appendChild(s);
  }
  if(ex.artifacts){var artEl=renderArtifacts(ex.artifacts);body.appendChild(artEl);
    if(ex.type==="spot"&&W.spot.bind)W.spot.bind(st,artEl);}
  var q=el("div","blk blk-q",'<span class="bl-label">\u2753 QUESTION</span>'+ex.question);
  body.appendChild(q);
  var ans=el("div","blk blk-ans ans-area",'<span class="bl-label">'+(ANS_LABEL[ex.type]||"ANSWER")+"</span>");
  W[ex.type].render(st,ans);
  body.appendChild(ans);
  var act=el("div","ex-actions");
  var bC=el("button","btn btn-primary","\u2611 Check");bC.type="button";bC.id="btn-check";bC.onclick=doCheck;
  var bS=el("button","btn btn-warn","\u21B7 Skip");bS.type="button";bS.onclick=doSkip;
  act.appendChild(bC);act.appendChild(bS);
  if(S.checked[i]){var bR=el("button","btn","\u270E Revise");bR.type="button";bR.onclick=doRevise;act.appendChild(bR)}
  var bH=el("button","btn btn-sm","\uD83D\uDCA1 Hint (\u221210%)");bH.type="button";bH.id="btn-hint";bH.onclick=doHint;
  if(S.hints[i])bH.setAttribute("disabled","disabled");
  act.appendChild(bH);
  act.appendChild(el("span","drag-hint","Check locks your answer, shows what was right or wrong, and pauses the timer for review. Next resumes the clock."));
  body.appendChild(act);
  var hb=el("div","hintbox hid");hb.id="hintbox";body.appendChild(hb);
  if(S.hints[i]){hb.textContent="Hint (\u221210% on this exercise): "+ex.hint;hb.classList.remove("hid")}
  var c=S.checked[i];
  var fb=el("div","fb hid");fb.id="fb";
  if(c){
    var label=c.earned>=c.max-0.001?"full":c.earned<=0?"zero":"partial";
    fb.classList.remove("hid");fb.classList.add(label);
    fb.innerHTML=ICON(label==="full"?"good":label==="zero"?"bad":"part")+" <b>You earned "+fmtP(c.earned)+" / "+fmtP(c.max)+" points</b> on this exercise \u2014 "+label+"."+(S.hints[i]?" (includes \u221210% hint cost)":"");
  }
  body.appendChild(fb);
  var cpn=el("div","ind hid");cpn.id="check-pause-note";
  if(c){cpn.classList.remove("hid");cpn.textContent="\u23F8 Timer paused \u2014 review mode. Press Next when you are done reading."}
  body.appendChild(cpn);
  var xp=el("div","explain hid");xp.id="explain";
  xp.innerHTML="<h4>WHY \u2014 EXPLANATION</h4>"+ex.explain;
  if(c)xp.classList.remove("hid");
  body.appendChild(xp);
  if(st.locked)body.classList.add("locked");
  if(S.manualPause){
    var v=el("div","veil",'<div class="v-in">\u23F8 Paused (manual)<br><span style="font-size:14px;color:var(--mut)">The exercise is hidden while paused. Press Resume to continue.</span></div>');
    body.appendChild(v);
  }
  stage.appendChild(body);
  $("#btn-prev").disabled=S.idx===0;
  $("#btn-next").classList.toggle("hid",S.idx>=S.exs.length-1);
  $("#btn-fin").classList.toggle("hid",!(S.idx>=S.exs.length-1&&!S.ended));
}

/* ---------- artifacts ---------- */
function renderArtifacts(a){
  var w=el("div","blk blk-art");
  w.innerHTML='<span class="bl-label">\uD83E\uDDE9 ARTIFACT'+(a.title?" \u2014 "+esc(a.title):"")+"</span>";
  if(a.kind==="logview"){
    var lv=el("div","lv");
    var top=el("div","lv-top");
    var lab=el("label",null,"Filter");lab.setAttribute("for","lvf"+a.title.length+"-"+(S.idx));
    var inp=el("input","lv-f");inp.type="text";inp.id=lab.htmlFor;inp.placeholder="type to filter lines (e.g. failure)";
    inp.setAttribute("aria-label","Filter log lines");
    var meta=el("span","lv-meta");
    top.appendChild(lab);top.appendChild(inp);top.appendChild(meta);
    var lines=el("div","lv-lines");
    var raw=a.lines;
    raw.forEach(function(l){var d=el("div","lvl",colorize(l));d.setAttribute("data-t",l.toLowerCase());lines.appendChild(d)});
    function applyF(){
      var t=norm(inp.value),n=0;
      [].forEach.call(lines.children,function(ch){
        var show=!t||ch.getAttribute("data-t").indexOf(t)>=0;
        ch.classList.toggle("hid",!show);if(show)n++;
      });
      meta.textContent=n+" / "+raw.length+" lines";
    }
    inp.addEventListener("input",applyF);applyF();
    lv.appendChild(top);lv.appendChild(lines);w.appendChild(lv);
  }else{
    var pre=el("pre","art");
    a.lines.forEach(function(l,idx){
      if(a.kind==="code"&&a.clickable){
        var b=el("button","cl",esc(l));b.type="button";b.setAttribute("data-k","l"+idx);pre.appendChild(b);
      }else{
        var d=el("span","cl",esc(l));d.setAttribute("data-k","l"+idx);pre.appendChild(d);
      }
    });
    w.appendChild(pre);
  }
  return w;
}
function colorize(line){
  var s=esc(line);
  s=s.replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="c-key">$1</span>$2');
  s=s.replace(/\b(true|false|null)\b/g,'<span class="c-num">$1</span>');
  s=s.replace(/\b(FAILED|Failure|failure|denied|DENIED|ERROR|Error|InvalidSignature|401|403)\b/g,'<span class="c-bad">$1</span>');
  s=s.replace(/\b(Success|SUCCESS|accepted|ALLOWED|allowed)\b/g,'<span class="c-ok">$1</span>');
  s=s.replace(/\b(WARN|EXPIRED|warn|risk=RISKY|Risk)\b/g,'<span class="c-warn">$1</span>');
  s=s.replace(/^(\d{4}-\d{2}-\d{2}T[\d:.]+Z?|\w{3}\s+\d{1,2}\s[\d:]{8})/,'<span class="c-dim">$1</span>');
  return s;
}
/* ===== widgets part 1: qcm, multi, categorize, match, order, fill, spot ===== */
function resolveRef(st,k){
  if(k.indexOf(":")>=0){var p=k.split(":");return (st.refs.p&&st.refs.p[+p[0]])?st.refs.p[+p[0]][p[1]]:null}
  return st.refs[k];
}
function paintRows(st,rows){
  (rows||[]).forEach(function(r){
    var elm=resolveRef(st,r.k);if(!elm)return;
    elm.classList.remove("good","bad","part");
    elm.classList.add(r.st);
    if(!elm.querySelector(".st-ic")){
      var ic=el("span","st-ic",ICON(r.st));
      ic.setAttribute("aria-label",r.st==="good"?"correct":r.st==="bad"?"wrong":"partial");
      elm.insertBefore(ic,elm.firstChild);
    }
  });
}
function refCls(st,k){var e=resolveRef(st,k);return e||null}
function lockGuard(st){return st.locked===true}

var W={};

/* ---------- QCM (single choice) ---------- */
W.qcm={
  init:function(st){st.a.pick=-1;st.a.disp=sh(st.ex.data.opts.map(function(o,i){return i}))},
  render:function(st,host){
    var box=el("div","opts");st.refs.box=box;
    st.a.disp.forEach(function(oi){
      var o=st.ex.data.opts[oi];
      var b=el("button","it");b.type="button";b.setAttribute("data-k","o"+oi);
      if(st.a.pick===oi)b.classList.add("sel");
      b.innerHTML='<span class="rad" aria-hidden="true"></span><span>'+o.t+"</span>";
      b.onclick=function(){if(lockGuard(st))return;st.a.pick=oi;
        [].forEach.call(box.children,function(c){c.classList.remove("sel")});b.classList.add("sel")};
      st.refs["o"+oi]=b;box.appendChild(b);
    });
    host.appendChild(box);
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,pk=st.a.pick,rows=[],correct="",yours="(nothing chosen)",earn=0;
    d.opts.forEach(function(o){if(o.ok)correct=o.t});
    if(pk>=0){yours=d.opts[pk].t;rows.push({k:"o"+pk,st:d.opts[pk].ok?"good":"bad"});if(d.opts[pk].ok)earn=pts}
    return {earned:earn,max:pts,rows:rows,yours:esc(yours),correct:esc(correct)};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

/* ---------- MULTI (multi-select) ---------- */
W.multi={
  init:function(st){st.a.picks={};st.a.disp=sh(st.ex.data.opts.map(function(o,i){return i}))},
  render:function(st,host){
    var box=el("div","opts");st.refs.box=box;
    st.a.disp.forEach(function(oi){
      var o=st.ex.data.opts[oi];
      var b=el("button","it");b.type="button";b.setAttribute("data-k","o"+oi);
      b.setAttribute("aria-pressed",st.a.picks[oi]?"true":"false");
      b.innerHTML='<span class="cbx" aria-hidden="true"></span><span>'+o.t+"</span>";
      if(st.a.picks[oi])b.classList.add("sel");
      b.onclick=function(){if(lockGuard(st))return;
        st.a.picks[oi]=!st.a.picks[oi];b.classList.toggle("sel",!!st.a.picks[oi]);
        b.setAttribute("aria-pressed",st.a.picks[oi]?"true":"false")};
      st.refs["o"+oi]=b;box.appendChild(b);
    });
    host.appendChild(box);
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,okI=[],rows=[],yours=[],correct=[];
    d.opts.forEach(function(o,i){if(o.ok){okI.push(i);correct.push(o.t)}});
    d.opts.forEach(function(o,i){if(!o.ok&&st.a.picks[i]){rows.push({k:"o"+i,st:"bad"});yours.push(o.t)}});
    okI.forEach(function(i){rows.push({k:"o"+i,st:st.a.picks[i]?"good":"part"})});
    okI.forEach(function(i){if(st.a.picks[i])yours.push(d.opts[i].t)});
    var earn=pts*(okI.filter(function(i){return st.a.picks[i]}).length)/(okI.length||1);
    if(!yours.length)yours=["(nothing selected)"];
    return {earned:earn,max:pts,rows:rows,yours:esc(yours.join(" | ")),correct:esc(correct.join(" | "))};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

/* ---------- CATEGORIZE (sort items into zones) ---------- */
W.categorize={
  init:function(st){
    var a=st.a;a.place={};a.sel=null;
    a.disp=sh(st.ex.data.items.map(function(x){return x.id}));
    st.ex.data.items.forEach(function(x){a.place[x.id]=null});
  },
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    host.appendChild(el("p","drag-hint","Click an item to pick it up, then click a zone to drop it. Click a placed item to put it back. Drag & drop also works."));
    var bank=el("div","bank");bank.setAttribute("aria-label","Item bank");st.refs.bank=bank;
    var grid=el("div","zones2");
    var zoneEls={};
    d.zones.forEach(function(z){
      var zn=el("div","zone");zn.setAttribute("data-zone",z.id);
      zn.setAttribute("tabindex","0");zn.setAttribute("role","button");
      zn.setAttribute("aria-label","Drop zone: "+z.label+". Pick an item, then press Enter here to drop it.");
      zn.innerHTML="<h5>"+z.label+"</h5>";
      var zb=el("div","zbody");zn.appendChild(zb);
      function tryDrop(ev){
        if(lockGuard(st))return;
        if(ev&&ev.target&&ev.target.closest&&ev.target.closest(".chip"))return;
        if(!a.sel)return;
        if(ev&&ev.preventDefault)ev.preventDefault();
        place(a.sel,z.id);
      }
      zn.onclick=tryDrop;
      zn.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){tryDrop(ev)}};
      zn.addEventListener("dragover",function(ev){ev.preventDefault();zn.classList.add("dragover")});
      zn.addEventListener("dragleave",function(){zn.classList.remove("dragover")});
      zn.addEventListener("drop",function(ev){ev.preventDefault();zn.classList.remove("dragover");
        if(lockGuard(st))return;var id=ev.dataTransfer.getData("text/plain");if(id)place(id,z.id)});
      zoneEls[z.id]=zn;grid.appendChild(zn);
    });
    function place(id,zid){
      a.place[id]=zid;a.sel=null;
      var chip=st.refs["it"+id];if(chip){zoneEls[zid].querySelector(".zbody").appendChild(chip);chip.classList.remove("sel")}
      bank.appendChild(document.createTextNode(""));
    }
    function putBack(id){
      a.place[id]=null;a.sel=null;
      var chip=st.refs["it"+id];if(chip){bank.appendChild(chip);chip.classList.remove("sel")}
    }
    a.disp.forEach(function(id){
      var it=d.items.filter(function(x){return x.id===id})[0];
      var chip=el("button","chip");chip.type="button";chip.setAttribute("data-k","it"+id);
      chip.setAttribute("draggable","true");
      chip.innerHTML=it.t;
      chip.onclick=function(ev){ev.stopPropagation();if(lockGuard(st))return;
        if(a.place[id]){putBack(id);return}
        if(a.sel===id){a.sel=null;chip.classList.remove("sel");return}
        a.sel=id;
        [].forEach.call(bank.children,function(c){if(c.classList)c.classList.remove("sel")});
        chip.classList.add("sel")};

    });
    dispR.forEach(function(id){

      b.innerHTML="<span>"+r.t+"</span>";

        a.selR=id;
        [].forEach.call(R.querySelectorAll(".it"),function(c){c.classList.remove("sel")});
        b.classList.add("sel");
        if(a.selL){var lid=a.selL;a.pair[lid]=id;a.selL=null;a.selR=null;

/* ---------- ORDER / RANK (sequence) ---------- */
function orderInit(st){st.a.seq=sh(st.ex.data.items.map(function(x){return x.id}))}
function orderRender(st,host){
  var d=st.ex.data,a=st.a;
  host.appendChild(el("p","drag-hint","Use the up/down arrows (or drag rows) to build the right sequence."));
  var list=el("div","ord");st.refs.list=list;host.appendChild(list);
  function rowFor(id){
    var it=d.items.filter(function(x){return x.id===id})[0];
    var row=el("div","orow");row.setAttribute("data-k","m"+id);row.setAttribute("draggable","true");
    row.innerHTML='<span class="pos">1</span>';
    var itb=el("div","it","<span>"+it.t+"</span>");row.appendChild(itb);
    var mv=el("div","mv");
    var up=el("button",null,"\u25B2");up.type="button";up.setAttribute("aria-label","Move up");
    var dn=el("button",null,"\u25BC");dn.type="button";dn.setAttribute("aria-label","Move down");
    up.onclick=function(){if(lockGuard(st))return;move(id,-1)};
    dn.onclick=function(){if(lockGuard(st))return;move(id,1)};
    mv.appendChild(up);mv.appendChild(dn);row.appendChild(mv);
    row.addEventListener("dragstart",function(ev){ev.dataTransfer.setData("text/plain",id)});
    row.addEventListener("dragover",function(ev){ev.preventDefault();row.classList.add("dragover")});
    row.addEventListener("dragleave",function(){row.classList.remove("dragover")});
    row.addEventListener("drop",function(ev){ev.preventDefault();row.classList.remove("dragover");
      if(lockGuard(st))return;var src=ev.dataTransfer.getData("text/plain");
      if(src&&src!==id){var si=a.seq.indexOf(src),ti=a.seq.indexOf(id);
        a.seq.splice(si,1);a.seq.splice(ti,0,src);repaint()}});
    st.refs["m"+id]=row;st.refs["row"+id]=row;
    return row;
  }
  function move(id,dir){
    var i=a.seq.indexOf(id),j=i+dir;
    if(j<0||j>=a.seq.length)return;
    var t=a.seq[i];a.seq[i]=a.seq[j];a.seq[j]=t;repaint();
  }
  function repaint(){
    a.seq.forEach(function(id){
      var row=st.refs["row"+id];list.appendChild(row);
      row.querySelector(".pos").textContent=String(a.seq.indexOf(id)+1);
    });
  }
  a.seq.forEach(function(id){list.appendChild(rowFor(id))});
  repaint();
}
function orderScore(st){
  var d=st.ex.data,pts=st.ex.pts,rows=[],yours=[],correct=[],good=0;
  d.items.forEach(function(it,ci){
    var pos=st.a.seq.indexOf(it.id);
    var ok=pos===ci;if(ok)good++;
    rows.push({k:"m"+it.id,st:ok?"good":"bad"});
  });
  st.a.seq.forEach(function(id){
    var it=d.items.filter(function(x){return x.id===id})[0];yours.push((st.a.seq.indexOf(id)+1)+". "+it.t);
  });
  d.items.forEach(function(it,i){correct.push((i+1)+". "+it.t)});
  return {earned:pts*good/d.items.length,max:pts,rows:rows,yours:yours.join(" &nbsp;\u2192&nbsp; "),correct:correct.join(" &nbsp;\u2192&nbsp; ")};
}
W.order={init:orderInit,render:orderRender,score:orderScore,paint:function(st,res){paintRows(st,res.rows)}};
W.rank={init:orderInit,render:orderRender,score:orderScore,paint:function(st,res){paintRows(st,res.rows)}};

/* ---------- FILL (word bank blanks) ---------- */
W.fill={
  init:function(st){
    var a=st.a;a.blanks={};a.selW=null;
    Object.keys(st.ex.data.answers).forEach(function(k){a.blanks[k]=null});
    a.bank=sh(st.ex.data.bank.slice());
  },
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    host.appendChild(el("p","drag-hint","Click a word from the bank, then click the blank where it belongs. Click a filled blank to put the word back."));
    var txt=el("div","filltext");
    function syncAll(key){
      var v=a.blanks[key];
      [].forEach.call(txt.querySelectorAll('.blank[data-k="b'+key+'"]'),function(bb){
        bb.textContent=v?v:"\u00A0".repeat(8);
        bb.classList.toggle("filled",!!v);
      });
    }
    var parts=d.text.split(/\[\[(\w+)\]\]/g);
    for(var i=0;i<parts.length;i++){
      if(i%2===0){txt.appendChild(document.createTextNode(parts[i]))}
      else{(function(key){
        var b=el("button","blank");b.type="button";b.setAttribute("data-k","b"+key);
        b.setAttribute("aria-label","blank "+key);
        b.textContent="\u00A0".repeat(8);
        if(a.blanks[key]){b.textContent=a.blanks[key];b.classList.add("filled")}
        b.onclick=function(){if(lockGuard(st))return;
          if(a.blanks[key]){retWord(key);return}
          if(!a.selW)return;
          a.blanks[key]=a.selW;a.selW=null;
          syncAll(key);renderBank()};
        st.refs["b"+key]=b;txt.appendChild(b);
      })(parts[i])}
    }
    host.appendChild(txt);
    var bank=el("div","wbank");bank.setAttribute("aria-label","Word bank");host.appendChild(bank);
    function retWord(key){
      var w=a.blanks[key];a.blanks[key]=null;
      syncAll(key);
      if(w)a.bank.push(w);renderBank();
    }
    function renderBank(){
      bank.innerHTML="";
      a.bank.forEach(function(w,i){
        var chip=el("button","chip");chip.type="button";
        chip.innerHTML=w;
        if(a.selW===w)chip.classList.add("sel");
        chip.onclick=function(){if(lockGuard(st))return;
          if(a.selW===w){a.selW=null}else{a.selW=w}
          renderBank()};
        bank.appendChild(chip);
      });
      if(!a.bank.length)bank.appendChild(el("span","drag-hint","(bank is empty)"));
    }
    st._retWord=retWord;renderBank();
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,keys=Object.keys(d.answers),rows=[],yours=[],correct=[],good=0;
    keys.forEach(function(k){
      var acc=d.answers[k].accept,v=norm(st.a.blanks[k]);
      var ok=v&&acc.some(function(x){return norm(x)===v});
      if(ok)good++;
      rows.push({k:"b"+k,st:ok?"good":"bad"});
      yours.push(k+": "+esc(st.a.blanks[k]||"\u2014"));
      correct.push(k+": "+esc(d.answers[k].disp||d.answers[k].accept[0]));
    });
    return {earned:pts*good/keys.length,max:pts,rows:rows,yours:yours.join(" \u00B7 "),correct:correct.join(" \u00B7 ")};
  },
  paint:function(st,res){
    (res.rows||[]).forEach(function(r){
      [].forEach.call(document.querySelectorAll('#stage .blank[data-k="'+r.k+'"]'),function(elm){
        elm.classList.remove("good","bad","part");
        elm.classList.add(r.st);
        if(!elm.querySelector(".st-ic")){
          var ic=el("span","st-ic",ICON(r.st));
          ic.setAttribute("aria-label",r.st==="good"?"correct":r.st==="bad"?"wrong":"partial");
          elm.insertBefore(ic,elm.firstChild);
        }
      });
    });
  }
};

/* ---------- TREE (branching decisions) ---------- */
W.tree={
  init:function(st){st.a.steps=[];st.a.cur=0},
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    var box=el("div");host.appendChild(box);st.refs.tbox=box;
    function drawStep(s){
      var step=d.steps[s];

      w.innerHTML="<h3>Decision "+(s+1)+" of "+d.steps.length+"</h3>"+step.p;
      var opts=el("div","opts");
      step.opts.forEach(function(o,oi){
        var b=el("button","it");b.type="button";b.setAttribute("data-k","st"+s+"o"+oi);
        b.innerHTML='<span class="rad" aria-hidden="true"></span><span>'+o.t+"</span>";
        if(a.steps[s]===oi)b.classList.add("sel");
        b.onclick=function(){if(lockGuard(st))return;
          if(a.steps[s]!=null&&a.cur>s+1)return;
          a.steps[s]=oi;if(a.cur===s)a.cur=s+1;
          [].forEach.call(opts.children,function(c){c.classList.remove("sel")});
          b.classList.add("sel");
          var old=w.querySelector(".fb-out");if(old)old.remove();
          w.appendChild(el("div","fb-out","What happens next: "+o.fb));
          if(s+1<d.steps.length&&!box.querySelector('[data-k="st'+(s+1)+'"]'))drawStep(s+1);
        };
        opts.appendChild(b);
      });
      w.appendChild(opts);box.appendChild(w);
    }
    drawStep(0);
  },
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,rows=[],yours=[],correct=[],good=0;
    d.steps.forEach(function(s,i){

      rows.push({k:"st"+i,st:ok?"good":"bad"});
      yours.push("D"+(i+1)+": "+esc(ch!=null?s.opts[ch].t:"(no choice)"));
      var want=s.opts.filter(function(o){return o.ok})[0];
      correct.push("D"+(i+1)+": "+esc(want?want.t:"?"));
    });
    return {earned:pts*good/d.steps.length,max:pts,rows:rows,yours:yours.join("<br>"),correct:correct.join("<br>")};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

/* ---------- TERMINAL (fake shell) ---------- */
W.terminal={
  init:function(st){
    var a=st.a;a.done=st.ex.data.tasks.map(function(){return false});a.lines=[];
  },
  render:function(st,host){
    var d=st.ex.data,a=st.a;
    var tt=el("div","ttasks");
    d.tasks.forEach(function(t,i){
      var row=el("div","tk");row.setAttribute("data-k","t"+i);
      row.innerHTML='<span class="st-ic" aria-hidden="true">'+(a.done[i]?"\u2713":"\u25CB")+"</span><span><b>Task "+(i+1)+":</b> "+t.goal+"</span>";
      tt.appendChild(row);st.refs["t"+i]=row;
    });
    var term=el("div","term");
    term.appendChild(el("div","term-bar",""+esc(d.host)+" \u2014 interactive shell (simulated, read-only)"));
    var out=el("div","term-out");term.appendChild(out);st.refs.out=out;
    var inr=el("div","term-in");
    var ps=el("span","ps",esc(d.host)+"$");
    var inp=el("input");inp.type="text";inp.setAttribute("aria-label","terminal command input");
    inp.setAttribute("autocomplete","off");inp.setAttribute("spellcheck","false");
    var run=el("button","btn btn-sm btn-primary","Run");run.type="button";
    inr.appendChild(ps);inr.appendChild(inp);inr.appendChild(run);term.appendChild(inr);
    host.appendChild(term);
    host.appendChild(tt);
    function exec(){
      if(lockGuard(st))return;
      var cmd=inp.value.trim();if(!cmd)return;
      a.lines.push({cls:"cmdl",t:d.host+"$ "+cmd});
      var hit=false;
      d.tasks.forEach(function(t,i){
        if(a.done[i])return;
        if(t.accept.some(function(re){try{return new RegExp(re,"i").test(cmd)}catch(e){return false}})){
          a.done[i]=true;hit=true;
          (t.out||[]).forEach(function(l){a.lines.push({t:l})});
          a.lines.push({cls:"okl",t:"[OK] Task "+(i+1)+" matched \u2014 the evidence is on screen."});
        }
      });
      if(!hit)a.lines.push({cls:"errl",t:"No outstanding task matched this command. Re-read the task goal: check the tool, the target path and the filter text."});
      inp.value="";drawOut();
      if(a.done.every(Boolean))a.lines.push({cls:"okl",t:"All tasks matched. Press Check to score."});
    }
    function drawOut(){
      out.innerHTML=a.lines.map(function(l){
        return '<div class="'+(l.cls||"")+'">'+esc(l.t)+"</div>";
      }).join("")||'<div class="c-dim">(no output yet \u2014 type a command below)</div>';
      out.scrollTop=out.scrollHeight;
    }
    run.onclick=exec;
    inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")exec()});
    drawOut();
    st._inp=inp;st._run=run;
  },
  lock:function(st){if(st._inp){st._inp.disabled=true;st._run.disabled=true}},
  score:function(st){
    var d=st.ex.data,pts=st.ex.pts,rows=[],yours=[],correct=[],good=0;
    d.tasks.forEach(function(t,i){
      if(st.a.done[i])good++;
      rows.push({k:"t"+i,st:st.a.done[i]?"good":"bad"});
      yours.push("Task "+(i+1)+": "+(st.a.done[i]?"matched":"not matched"));
      correct.push("Task "+(i+1)+": "+esc(t.sol||"see explanation"));
    });
    return {earned:pts*good/d.tasks.length,max:pts,rows:rows,yours:yours.join("<br>"),correct:correct.join("<br>")};
  },
  paint:function(st,res){
    (res.rows||[]).forEach(function(r){
      var elm=resolveRef(st,r.k);if(!elm)return;
      var ic=elm.querySelector(".st-ic");if(ic)ic.textContent=ICON(r.st);
      elm.classList.add(r.st);
    });
  }
};

/* ---------- DUAL (blue/red two-phase) ---------- */
W.dual={
  init:function(st){
    st.a.ph=[{},{}];st.a.open=1;
    var d=st.ex.data;
    d.phases.forEach(function(ph,p){if(W[ph.kind].init)W[ph.kind].init({ex:{data:ph.data},a:st.a.ph[p]})});

  render:function(st,host){

    st.refs.p=[{},{}];
    d.phases.forEach(function(ph,p){
      var sec=el("div","phase"+(ph.side==="RED"?" red":""));
      sec.innerHTML='<div class="phase-h"><span class="side">'+esc(ph.side)+"</span><b>"+esc(ph.label)+"</b></div>"+(ph.intro||"");
      var inner=el("div","ans-area");
      sec.appendChild(inner);
      W[ph.kind].render({ex:{data:ph.data},a:a.ph[p],refs:st.refs.p[p],i:st.i,locked:st.locked},inner);
      if(ph.side==="RED"&&a.open<2){
        sec.classList.add("locked-ph");
        inner.style.pointerEvents="none";
        sec.appendChild(el("p","drag-hint","\uD83D\uDD12 Answer the first view to unlock this one."));
        st._redSec=sec;st._redInner=inner;
      }
      host.appendChild(sec);
    });
    var first=host.querySelector(".phase");
    if(first)first.addEventListener("click",function(){
      if(st.a.open<2){st.a.open=2;
        if(st._redSec){st._redSec.classList.remove("locked-ph");st._redInner.style.pointerEvents="auto";
          var n=st._redSec.querySelector(".drag-hint:last-child");if(n&&n.textContent.indexOf("unlock")>=0)n.remove()}}
    },true);
  },
  score:function(st){
    var d=st.ex.data,rows=[],yours=[],correct=[],earn=0,max=0;
    d.phases.forEach(function(ph,p){
      var sub=W[ph.kind].score({ex:{data:ph.data,pts:ph.pts},a:st.a.ph[p]});
      max+=ph.pts;earn+=sub.earned;
      sub.rows.forEach(function(r){rows.push({k:p+":"+r.k,st:r.st})});
      yours.push("<b>"+esc(ph.side)+" \u2014 "+esc(ph.label)+":</b><br>"+sub.yours);
      correct.push("<b>"+esc(ph.side)+" \u2014 "+esc(ph.label)+":</b><br>"+sub.correct);
    });
    return {earned:earn,max:max,rows:rows,yours:yours.join("<br><br>"),correct:correct.join("<br><br>")};
  },
  paint:function(st,res){paintRows(st,res.rows)}
};

{id:"M01",type:"categorize",pts:3,
 title:"Sort the authentication factors",
 tags:["MFA","FIDO2 security key","biometrics","smart card"],
 hint:"Ask where the factor lives: inside your memory, inside your pocket, or part of your body.",
 scenario:"<p>You are hardening sign-in for a new zero-trust pilot at <b>Northwind Freight</b>. The security lead asks you to sort every factor the pilot could use, so the team can pick strong combinations for MFA.</p>",
 question:"<p>Place each factor into the correct category: <b>something you know</b>, <b>something you have</b>, or <b>something you are</b>.</p>",
 data:{zones:[{id:"know",label:"Something you KNOW"},{id:"have",label:"Something you HAVE"},{id:"are",label:"Something you ARE"}],
  items:[
   {id:"i1",t:"Password",zone:"know"},
   {id:"i2",t:"4-digit PIN",zone:"know"},
   {id:"i3",t:"Security questions",zone:"know"},
   {id:"i4",t:"TOTP code from an authenticator app",zone:"have"},
   {id:"i5",t:"FIDO2 hardware security key",zone:"have"},
   {id:"i6",t:"Smart card",zone:"have"},
   {id:"i7",t:"Fingerprint scan",zone:"are"},
   {id:"i8",t:"Face scan",zone:"are"},
   {id:"i9",t:"Voice pattern",zone:"are"}
  ]},
 explain:"<p><b>Know</b> = information stored in your head (password, PIN, security questions). It is the weakest group because it can be phished, guessed or shared. <b>Have</b> = an object you carry: a phone running a TOTP app, a FIDO2 key or a smart card. <b>Are</b> = a body trait (fingerprint, face, voice). Strong MFA combines two different groups, for example password + FIDO2 key, because one stolen item no longer opens the account.</p>"},
{id:"M02",type:"qcm",pts:2,
 title:"Federation outage at 08:21",

 scenario:"<p>Monday 08:30. The service desk floods with tickets: <i>nobody can reach the SAP portal anymore</i>. Other apps work fine. You open the identity provider log.</p>",
 artifacts:{kind:"logview",title:"idp-auth.log \u2014 Northwind Freight IdP",lines:[

  "2026-03-02T08:22:05Z SSO user=l.haddad app=Salesforce-SP status=Success ip=10[.]20[.]4[.]77",
  "2026-03-02T08:25:44Z SAML user=j.osei app=SAP-Fiori status=Failure reason=InvalidSignature ip=10[.]20[.]4[.]23",
  "2026-03-02T08:26:10Z SAML user=r.kowalski app=SAP-Fiori status=Failure reason=InvalidSignature ip=10[.]20[.]4[.]19",

 ]},
 question:"<p>Only SAP-Fiori logins fail, every failure says <code>InvalidSignature</code>, and the last SYSTEM line stands out. What is the most likely root cause?</p>",

  {t:"The IdP signing certificate expired on 1 March, so the service provider cannot validate the assertion signature",ok:true},

{id:"M03",type:"qcm",pts:2,
 title:"Pick MFA that survives a proxy phishing kit",
 tags:["phishing-resistant MFA","FIDO2 security key","MFA","AiTM phishing","number matching"],
 hint:"Ask one question for each option: does the secret ever get typed into a page an attacker controls?",
 scenario:"<p>Last week the CFO lost <b>both</b> factors to an adversary-in-the-middle (AiTM) kit: the fake site proxied the real login page, captured the password, and relayed the push approval in real time. The SOC must choose a replacement MFA method for the executive team.</p>",
 question:"<p>Which method should the SOC roll out to stop this attack pattern?</p>",
 data:{opts:[
  {t:"FIDO2 security keys that cryptographically bind sign-in to the real domain",ok:true},
  {t:"Push approvals upgraded with number matching on the same authenticator app",ok:false},
  {t:"TOTP six-digit codes generated in the same authenticator app",ok:false},
  {t:"SMS one-time codes sent to the executives' registered phones",ok:false}
 ]},
 explain:"<p>An AiTM proxy steals whatever the user types and relays challenges in real time. TOTP codes, SMS codes and even number-matched pushes are all still <b>entered or approved through the page the attacker controls</b>, so the proxy simply forwards them. <b>FIDO2 keys are phishing-resistant</b>: the key signs a challenge that includes the true domain, and the signature is useless on the fake domain, so the relay attack fails. Number matching is still worth keeping elsewhere \u2014 it stops MFA fatigue blasts \u2014 but it does not stop a proxy.</p>"},
{id:"M04",type:"fill",pts:3,
 title:"Complete the OAuth 2.0 authorization code flow",
 tags:["OAuth 2.0","access token","refresh token","authorization code","client credentials grant","device code grant"],
 hint:"First blank: the app that wants data. Last blank: the long-lived item the client stores to come back without the user.",
 scenario:"<p>A new reporting app must read sales data from the company API. You are documenting the <b>OAuth 2.0 authorization code flow</b> for the architecture review so developers implement it correctly.</p>",
 question:"<p>Fill every blank with a word from the bank. Each blank is scored separately.</p>",
 data:{text:"In the authorization code flow, the [[k1]] sends the user to the [[k2]] to log in and consent. After consent, the authorization server returns a one-time [[k3]] to the redirect URI. The client exchanges that code (together with its client secret or a PKCE verifier) for an [[k4]], and the API checks this on every call. When the [[k4]] expires, the client silently presents the [[k5]] to get a fresh one without troubling the user again.",
  answers:{
   k1:{accept:["client","the client"],disp:"client"},
   k2:{accept:["authorization server","auth server"],disp:"authorization server"},
   k3:{accept:["authorization code","auth code","code"],disp:"authorization code"},
   k4:{accept:["access token"],disp:"access token"},
   k5:{accept:["refresh token"],disp:"refresh token"}},
  bank:["client","authorization server","authorization code","access token","refresh token","resource server","ID token","SAML assertion"]},
 explain:"<p>The <b>client</b> is the app that wants the data; the <b>authorization server</b> authenticates the user and takes consent. The one-time <b>authorization code</b> travels through the browser, then the client swaps it for an <b>access token</b>, which is the short-lived credential the API validates on every request. The <b>refresh token</b> is the long-lived secret the client stores to mint new access tokens silently. A resource server is the API itself (it never appears in those slots), an ID token belongs to OIDC login, and a SAML assertion is a different federation technology entirely.</p>"},
{id:"M05",type:"spot",pts:2,
 title:"Spot the mistake in the IAM policy",
 tags:["least privilege","permission scoping","explicit deny","cross-account access"],
 hint:"Two statements grant permissions. One of them ignores every limit the other one sets.",
 scenario:"<p>A partner account reaches your reporting bucket through the <code>ReportReader</code> role (a <b>cross-account access</b> role assumed with STS). A reviewer asks you to check the role policy before the audit. One statement is carefully scoped; another one quietly undoes all of that work.</p>",
 artifacts:{kind:"code",clickable:true,lines:[
  "{",
  "  \"Version\": \"2012-10-17\",",
  "  \"Statement\": [",
  "    { \"Sid\": \"ReadReports\", \"Effect\": \"Allow\",",
  "      \"Action\": [\"s3:GetObject\", \"s3:ListBucket\"],",
  "      \"Resource\": \"arn:aws:s3:::reports-bucket/*\" },",
  "    { \"Sid\": \"WideOpen\", \"Effect\": \"Allow\",",
  "      \"Action\": \"*\",",
  "      \"Resource\": \"*\" }",
  "  ]",
  "}"
 ]},
 question:"<p>Click the ONE line that breaks least privilege the worst (the mistake lives inside the <code>WideOpen</code> statement \u2014 either of its two definitions counts as the answer).</p>",
 data:{lines:[
  "{",
  "  \"Version\": \"2012-10-17\",",
  "  \"Statement\": [",
  "    { \"Sid\": \"ReadReports\", \"Effect\": \"Allow\",",
  "      \"Action\": [\"s3:GetObject\", \"s3:ListBucket\"],",
  "      \"Resource\": \"arn:aws:s3:::reports-bucket/*\" },",
  "    { \"Sid\": \"WideOpen\", \"Effect\": \"Allow\",",
  "      \"Action\": \"*\",",
  "      \"Resource\": \"*\" }",
  "  ]",
  "}"
 ],bad:[7,8],
  why:"The WideOpen statement allows every action on every resource."},
 explain:"<p>The <code>ReadReports</code> statement is exactly what least privilege looks like: two read actions on one bucket. The <code>WideOpen</code> statement then allows <b>every action on every resource</b>, so the careful scoping is worthless \u2014 the partner identity could delete buckets, change IAM, anything. Clicking <code>\"Action\": \"*\"</code> or <code>\"Resource\": \"*\"</code> are both accepted because together they form the flaw. There is no <b>explicit deny</b> here to rescue the situation, so both Allows simply stand. Fix: delete the WideOpen statement; if you ever need one, remember an explicit deny always beats any Allow.</p>"}
);

{id:"M06",type:"categorize",pts:3,
 title:"Authentication or authorization?",
 tags:["conditional access","RBAC","least privilege"],
 hint:"Authentication proves WHO you are. Authorization decides WHAT that identity may do. Issuing a token happens at login time.",
 scenario:"<p>An intern on the IAM team mixed up two columns on the whiteboard. Before the picture goes into the onboarding deck, you must sort every action into the right half of the diagram.</p>",
 question:"<p>Sort each action into <b>Authentication</b> (proving identity / creating the session) or <b>Authorization</b> (deciding what the session may do).</p>",
 data:{zones:[{id:"authn",label:"AUTHENTICATION"},{id:"authz",label:"AUTHORIZATION"}],
  items:[
   {id:"a1",t:"Verify the password at sign-in",zone:"authn"},
   {id:"a2",t:"Verify the TOTP code at sign-in",zone:"authn"},
   {id:"a3",t:"Scan a fingerprint at device unlock",zone:"authn"},
   {id:"a4",t:"Issue a session token after successful login",zone:"authn"},
   {id:"a5",t:"Evaluate a conditional access rule that requires a compliant device before the session is created",zone:"authn"},
   {id:"a6",t:"Check that the user is in the Billing-Admins group before opening the ledger",zone:"authz"},
   {id:"a7",t:"Evaluate the role policy for s3:PutObject",zone:"authz"},
   {id:"a8",t:"Check the OAuth scope attached to an API call",zone:"authz"}
  ]},
 explain:"<p><b>Authentication</b> answers <i>who are you</i>: password, TOTP, fingerprint, and the moment the session token is issued. A conditional access rule that requires a compliant device is evaluated <b>when the session is created</b>, so it belongs to authentication. <b>Authorization</b> answers <i>what may this identity do</i>: group membership checks (RBAC style), role policy evaluation on each call, and OAuth scope checks. Keeping the two apart matters because you can be fully authenticated and still be denied an action one second later.</p>"},
{id:"M07",type:"order",pts:3,
 title:"Order the onboarding steps",
 tags:["provisioning","joiner-mover-leaver","group-based access","MFA","access review"],
 hint:"The identity must exist before anything else can attach to it. Verification comes after granting, and the paper trail closes the loop.",
 scenario:"<p>HR just raised a joiner ticket for <b>Priya Raman</b>, junior billing analyst. Your runbook has six steps, but a new colleague shuffled the cards. Rebuild the correct order.</p>",
 question:"<p>Put the provisioning steps in the order a solid IAM runbook performs them (1 = first).</p>",
 data:{items:[
  {id:"s1",t:"Create the identity in the directory from the HR feed"},
  {id:"s2",t:"Add the user to role-based groups that match the job profile"},
  {id:"s3",t:"Enrol the user in MFA (register an authenticator)"},
  {id:"s4",t:"Grant role-specific app access through the governance approval"},
  {id:"s5",t:"Test sign-in and check the effective permissions"},
  {id:"s6",t:"Record the access in the register and schedule the first access review"}
 ]},
 explain:"<p>Nothing else can attach to an account before <b>the identity exists</b>. Then <b>group-based access</b> gives the baseline every analyst gets, MFA enrolment protects the new account before it touches real apps, and the <b>governance-approved</b> grant adds role-specific rights on top. Testing sign-in and effective permissions proves the build is right <i>before</i> the user depends on it, and recording the grant plus scheduling the first <b>access review</b> closes the loop so the access is re-checked later instead of living forever.</p>"},
{id:"M08",type:"match",pts:3,
 title:"Match each protocol to its job",
 tags:["SAML 2.0","OIDC","OAuth 2.0","LDAP","SCIM","Kerberos","authorization code","PKCE","client credentials grant","device code grant"],
 hint:"Watch for the key words: XML assertions, JSON identity layer, delegated API access, directory queries, provisioning automation, ticket-based domain auth.",
 scenario:"<p>You are preparing a one-page cheat sheet for the help desk. Each identity protocol must land next to the one-line job it actually does, so first-line support stops mixing them up in tickets.</p>",
 question:"<p>Match every protocol on the left to its correct purpose on the right. Two purposes are decoys.</p>",
 data:{left:[
  {id:"p1",t:"SAML 2.0"},
  {id:"p2",t:"OIDC"},
  {id:"p3",t:"OAuth 2.0"},
  {id:"p4",t:"LDAP"},
  {id:"p5",t:"SCIM"},
  {id:"p6",t:"Kerberos"}
 ],
  right:[
   {id:"r1",t:"Signs XML assertions so an IdP can vouch for a user to a service provider",pair:"p1"},
   {id:"r2",t:"A JSON identity layer on top of OAuth 2.0 for modern app sign-in",pair:"p2"},
   {id:"r3",t:"Delegates access to APIs without sharing the password; the authorization code flow (plus PKCE) and the client credentials grant are its flavours, and a device code grant covers TVs",pair:"p3"},
   {id:"r4",t:"Queries and binds against a directory such as Active Directory",pair:"p4"},
   {id:"r5",t:"Automates user provisioning and deprovisioning between HR and apps",pair:"p5"},
   {id:"r6",t:"Issues tickets for mutual authentication inside an AD domain",pair:"p6"},
   {id:"r7",t:"Compresses traffic between two branch sites",pair:""},
   {id:"r8",t:"Resolves host names into IP addresses",pair:""}
  ]},
 explain:"<p><b>SAML 2.0</b> carries signed XML assertions from IdP to service provider. <b>OIDC</b> is the modern JSON identity layer built on OAuth. <b>OAuth 2.0</b> itself is about delegated API authorization \u2014 its authorization code flow (with PKCE for public apps), its client credentials grant for service-to-service calls, and its device code grant for keyboard-less devices. <b>LDAP</b> is the old but alive protocol for talking to directory services. <b>SCIM</b> is the automation bridge that creates and disables accounts between systems. <b>Kerberos</b> issues tickets for domain-internal mutual authentication. Compression and DNS are pure decoys.</p>"},
{id:"M09",type:"tree",pts:2,
 title:"Decision path: a faster way to the billing database",
 tags:["least privilege","provisioning","access review"],
 hint:"At every fork, ask: does this choice keep the permission scoped, justified and verifiable?",
 scenario:"<p>Marcus, a payment analyst, opens a ticket: <i>\u201CGive me full admin on the billing database, it is faster than raising requests every week.\u201D</i> You are the approver. Walk the path a disciplined IAM analyst would walk.</p>",
 question:"<p>Choose the correct option at each decision point. Each decision is scored separately, and your choice reveals what happens next.</p>",
 data:{steps:[
  {p:"<p><b>Decision 1 \u2014 Marcus wants full admin on the billing database.</b> What do you do with the request?</p>",
   opts:[
    {t:"Check his role profile and request the specific read/write group he needs through the governance tool",ok:true,fb:"The request becomes scoped: two groups that match his daily tasks, nothing more."},
    {t:"Grant the admin role to keep the project moving",ok:false,fb:"He now holds standing admin rights nobody can justify \u2014 the seed of privilege creep."},
    {t:"Share the DBA service account password for the day",ok:false,fb:"Now two humans share one identity: no traceability, and the shared secret is out in a chat."}]},
  {p:"<p><b>Decision 2 \u2014 The governance ticket arrives with an empty justification field.</b></p>",
   opts:[
    {t:"Return the request and ask for the ticket number and the data classes he needs",ok:true,fb:"Marcus adds the real justification: monthly reconciliation needs two tables, read-only."},
    {t:"Approve it \u2014 the manager will notice later anyway",ok:false,fb:"An approval without justification is worthless at audit time and invites copy-paste grants."},
    {t:"Approve it and add a second group just in case",ok:false,fb:"You just amplified a blank request \u2014 the opposite of least privilege."}]},
  {p:"<p><b>Decision 3 \u2014 The scoped access was granted yesterday. What proves the grant is correct?</b></p>",
   opts:[
    {t:"Sign in, run one real reconciliation task, and compare the effective permissions with the role profile",ok:true,fb:"A tested grant with a documented check \u2014 and the register now shows proof, not hope."},
    {t:"Nothing \u2014 the approval itself is the proof",ok:false,fb:"Approvals prove intent, not function. Broken group mapping is found exactly this way, too late."},
    {t:"Give him local admin on the reporting VM so he can verify deeper",ok:false,fb:"Verifying access by widening access is how scope explosions start."}]}
 ]},
 explain:"<p>Each fork protects one pillar of controlled access. <b>Decision 1:</b> the role profile defines what an analyst needs \u2014 granting standing admin or sharing a service account breaks least privilege and traceability. <b>Decision 2:</b> a blank justification cannot be audited; sending it back costs minutes and creates the paper trail. <b>Decision 3:</b> testing the grant against one real task validates both the mapping and the scope, and the register entry schedules the next <b>access review</b> so the rights are re-checked instead of forgotten.</p>"},
{id:"M10",type:"terminal",pts:2,
 title:"Terminal: count the failed SSH attempts",
 tags:["password spraying","audit logging"],
 hint:"One command family is enough: grep the log for the phrase 'Failed password' and for the user svc_backup. Flags are optional; the log path must appear.",
 scenario:"<p> During your shift on the jumphost you spot repeated SSH noise against the backup service account. The log lives at <code>/var/log/auth.log</code>. The file is also shown below for reference.</p>",
 artifacts:{kind:"logview",title:"/var/log/auth.log (excerpt)",lines:[
  "Mar  2 03:11:52 ip-10-20-4-9 sshd[2211]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51022 ssh2",
  "Mar  2 03:11:58 ip-10-20-4-9 sshd[2213]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51094 ssh2",
  "Mar  2 03:12:04 ip-10-20-4-9 sshd[2214]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51140 ssh2",
  "Mar  2 03:12:11 ip-10-20-4-9 sshd[2216]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51202 ssh2",
  "Mar  2 03:12:40 ip-10-20-4-9 sshd[2219]: Accepted publickey for deploy from 10[.]20[.]4[.]9 port 44112 ssh2",
  "Mar  2 03:14:02 ip-10-20-4-9 sshd[2221]: Failed password for root from 198[.]51[.]100[.]7 port 33012 ssh2"
 ]},
 question:"<p><b>Use a <code>grep</code> command</b> that prints every <code>Failed password</code> line for the user <code>svc_backup</code> from <code>/var/log/auth.log</code>. A plausible output shape is the four <code>Mar 2 03:1x</code> lines shown above. Type the command in the terminal and press Run.</p>",
 data:{host:"analyst@nw-jump",
  tasks:[{
   goal:"Print the failed-password lines for svc_backup from /var/log/auth.log using grep.",
   accept:["grep.*(failed password|svc_backup).*auth\\.log","grep.*auth\\.log.*(failed password|svc_backup)","grep.*(failed password|svc_backup).*/var/log"],
   out:["Mar  2 03:11:52 ip-10-20-4-9 sshd[2211]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51022 ssh2",
        "Mar  2 03:11:58 ip-10-20-4-9 sshd[2213]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51094 ssh2",
        "Mar  2 03:12:04 ip-10-20-4-9 sshd[2214]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51140 ssh2",
        "Mar  2 03:12:11 ip-10-20-4-9 sshd[2216]: Failed password for svc_backup from 203[.]0[.]113[.]44 port 51202 ssh2"],
   sol:"grep 'Failed password' /var/log/auth.log | grep svc_backup   (or: grep svc_backup /var/log/auth.log)"
  }]},
 explain:"<p>A working answer combines the three ingredients: the <code>grep</code> tool, the log path <code>/var/log/auth.log</code>, and the filter (<code>Failed password</code> and/or <code>svc_backup</code>) \u2014 for example <code>grep 'Failed password' /var/log/auth.log | grep svc_backup</code>. Reading the result: four failures in twenty seconds from the single source <code>203[.]0[.]113[.]44</code> against one named account is a targeted online guessing attempt (close to <b>password spraying</b>, which spreads tries across many accounts). Next moves: smart lockout, block the source, and keep the <b>audit log</b> evidence before rotating anything.</p>"}
);

 explain:"<p><b>1 \u2014 the public API key:</b> every stranger on the internet can use it right now, so revocation and <b>key rotation</b> come before anything else. <b>2 \u2014 the leaver\u2019s admin account:</b> an <b>orphaned account</b> with standing privileges is a classic insider/backdoor vector, and disabling it takes one minute. <b>3 \u2014 the <b>separation of duties</b> conflict:</b> the same person approves and pays invoices \u2014 real fraud risk, but it needs an internal actor and grows slower than the first two. <b>4 \u2014 the 400-day <b>dormant account</b>:</b> an invisible attack surface to clean this week. <b>5 \u2014 the weak password OU:</b> a policy gap worth fixing properly, but the slowest-burning risk on the list.</p>"},
{id:"M12",type:"multi",pts:2,
 title:"Choose the controls that stop credential stuffing",
 tags:["credential stuffing","MFA","legacy authentication"],
 hint:"Three of the six actually work. Beware the two \u201Cclassic\u201D answers that NIST no longer recommends.",
 scenario:"<p>The perimeter webmail saw 40,000 login attempts last night: pairs of username and password reused from an old third-party breach. This is textbook <b>credential stuffing</b>. The CISO wants three working controls, not folklore.</p>",
 question:"<p>Select <b>all three</b> controls that genuinely reduce credential-stuffing success.</p>",
 data:{opts:[
  {t:"Enforce MFA on all internet-facing sign-ins",ok:true},
  {t:"Block legacy authentication protocols that cannot carry modern auth",ok:true},
  {t:"Screen new passwords against known-breach corpora",ok:true},
  {t:"Force a password change for every user every 30 days",ok:false},
  {t:"Add security questions as the second factor",ok:false},
  {t:"Allow password reuse across apps so users can memorise one phrase",ok:false}
 ]},
 explain:"<p>Stuffing only works with <b>reused passwords</b> and quiet, scriptable logins. <b>MFA</b> makes a stolen pair useless on its own; <b>blocking legacy authentication</b> removes the old mail protocols that stuffing kits love because they bypass modern checks; <b>breach-password screening</b> refuses the exact pairs that circulate from old dumps. The folklore answers fail: periodic expiry makes users pick predictable variants (NIST advises length and breach screening over rotation), security questions are researchable facts, and engineered reuse is what made stuffing possible in the first place.</p>"},
{id:"M13",type:"fill",pts:3,
 title:"Complete the conditional access rule",
 tags:["conditional access","sign-in risk"],
 hint:"The rule fires on the worst risk level, one department, the health of the device \u2014 and the fall-through default is never generous.",
 scenario:"<p>Northwind builds its first <b>conditional access</b> policy for the finance team. The template is printed below, but the words fell out. The intent: risky sign-ins from finance staff on healthy devices get extra checks; everything else falls through to following rules; nothing matches nothing = no entry.</p>",
 question:"<p>Fill the four blanks. Each blank is scored separately.</p>",
 data:{text:"IF sign-in risk is [[k1]] AND the user belongs to group [[k2]] THEN require MFA and a [[k3]] device. Otherwise continue evaluating the next rule. If no rule matches at all, access is [[k4]] \u2014 conditional access never grants by accident.",
  answers:{
   k1:{accept:["high"],disp:"high"},
   k2:{accept:["finance","finance-users","grp-finance"],disp:"Finance"},
   k3:{accept:["compliant","managed","managed or compliant","compliant or managed"],disp:"compliant"},
   k4:{accept:["blocked","denied"],disp:"blocked"}},
  bank:["high","low","Finance","compliant","jailbroken","allowed","blocked","logged out"]},
 explain:"<p>Risk-based rules trigger on the <b>high</b> band \u2014 acting on low risk would challenge half the company for nothing. Scoping to the <b>Finance</b> group keeps the blast radius small. A <b>compliant</b> device means the health state (encryption, patch level, screen lock) is attested by management tooling \u2014 a jailbroken device is the opposite of healthy. And the default outcome of <i>no matching rule</i> is <b>blocked</b>: conditional access is deny-by-default, so access only exists where a rule explicitly allows it.</p>"},
{id:"M14",type:"spot",pts:2,
 title:"Spot the mistake in the group memberships",
 tags:["privilege creep","least privilege","group-based access","standing privilege"],
 hint:"Ana reconciles invoices. One membership on this list cannot be explained by her job.",
 scenario:"<p>Ana Silva is a billing analyst. During a <b>group-based access</b> cleanup you dump her memberships:</p>",
 artifacts:{kind:"code",clickable:true,lines:[
  "id ana.silva --groups:",
  "  billing-read          (role: billing analyst)",
  "  billing-approver      (role: senior billing analyst - documented)",
  "  vpn-users             (standard staff access)",
  "  domain-admins         (added 2025-11-04 by svc-ops, note: 'temp')"
 ]},
 question:"<p>Click the ONE line that is the mistake.</p>",
 data:{lines:[
  "id ana.silva --groups:",
  "  billing-read          (role: billing analyst)",
  "  billing-approver      (role: senior billing analyst - documented)",
  "  vpn-users             (standard staff access)",
  "  domain-admins         (added 2025-11-04 by svc-ops, note: 'temp')"
 ],bad:[4],
  why:"domain-admins on a billing analyst is standing privilege far beyond the role."},
 explain:"<p>Every other line maps to Ana\u2019s documented role. <code>domain-admins</code> gives <b>standing privilege</b> over the whole directory to a billing analyst \u2014 nothing in her job needs it, the \u201Ctemp\u201D note has no expiry, and this is exactly how <b>privilege creep</b> happens: one temporary grant that nobody removes. Fix: remove the membership, ask when and why it was added, and if a temporary elevation is ever genuinely needed, use a time-bound JIT elevation instead of a permanent group.</p>"},
{id:"M15",type:"dual",pts:3,
 title:"Two views of the travelling session token",
 tags:["token replay","session hijacking","AiTM phishing","sign-in risk"],
 hint:"Blue side: which actions stop the bleeding tonight? Red side: order the attack from theft to persistence.",
 scenario:"<p>09:02 \u2014 Lena signs in from Paris, success. 09:06 \u2014 the <b>same session token</b> is used from a Tor exit node, success. The <b>sign-in risk</b> engine flags the pair. Answer as the defender, then as the attacker.</p>",
 question:"<p><b>BLUE (detect &amp; contain):</b> sort each action into immediate containment vs scheduled follow-up. <b>RED (attacker view):</b> put the attack chain in working order.</p>",
 data:{phases:[
  {side:"BLUE",label:"Detect & contain",pts:2,kind:"categorize",intro:"<p>Same token, two countries, six minutes. You have the user on the phone, calm and cooperative.</p>",
   data:{zones:[{id:"now",label:"IMMEDIATE (next 30 minutes)"},{id:"later",label:"SCHEDULED (this week)"}],
    items:[
     {id:"b1",t:"Revoke all active sessions for Lena",zone:"now"},
     {id:"b2",t:"Reset her password and re-register MFA",zone:"now"},
     {id:"b3",t:"Review which mailboxes and files the session touched",zone:"later"},
     {id:"b4",t:"Check for attacker inbox rules created in the window",zone:"later"}]}},
  {side:"RED",label:"Attacker next moves",pts:1,kind:"order",intro:"<p>You are the operator holding Lena\u2019s stolen session cookie.</p>",
   data:{items:[
    {id:"r1",t:"Steal the session cookie through the AiTM proxy while Lena logs in"},
    {id:"r2",t:"Replay the cookie against the real app from my own machine"},
    {id:"r3",t:"Plant a quiet inbox rule forwarding invoices to my dropbox"}
   ]}}
 ]},
 explain:"<p><b>BLUE:</b> containment first \u2014 <b>token replay</b> only works while the token lives, so revoking sessions plus resetting credentials and re-registering MFA kills the stolen <b>session</b> (this is <b>session hijacking</b>: the password never changed, the cookie was stolen). Forensics \u2014 what the session touched, whether forwarding rules exist \u2014 belongs to the scheduled bucket; doing forensics before containment just gives the attacker more time. <b>RED:</b> the chain is steal via the <b>AiTM</b> proxy \u2192 replay the cookie from my machine (no second login, so no MFA prompt) \u2192 persist with a quiet inbox rule that survives even a later password reset if sessions are not revoked.</p>"}
);
