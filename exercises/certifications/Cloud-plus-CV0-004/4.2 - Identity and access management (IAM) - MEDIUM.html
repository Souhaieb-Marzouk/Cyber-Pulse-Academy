EX.push(
{id:"M16",type:"categorize",pts:3,
 title:"Reduce the surface or spot the abuse?",
 tags:["legacy authentication","phishing-resistant MFA","managed identity","JIT access","impossible travel","consent phishing","OAuth consent","dormant account"],
 hint:"Preventive controls change what is possible. Detective controls watch what actually happens.",
 scenario:"<p>The identity hardening backlog has eight items. The CISO wants them sorted into the two families every IAM programme needs: controls that <b>shrink the attack surface</b> and controls that <b>surface abuse</b> when it happens.</p>",
 question:"<p>Sort each item into <b>REDUCE ATTACK SURFACE</b> or <b>SPOT ABUSE</b>.</p>",
 data:{zones:[{id:"prev",label:"REDUCE ATTACK SURFACE"},{id:"det",label:"SPOT ABUSE"}],
  items:[
   {id:"c1",t:"Block legacy authentication protocols tenant-wide",zone:"prev"},
   {id:"c2",t:"Require phishing-resistant MFA for all administrators",zone:"prev"},
   {id:"c3",t:"Convert service accounts from static keys to managed identities",zone:"prev"},
   {id:"c4",t:"Replace standing admin rights with JIT elevation",zone:"prev"},
   {id:"c5",t:"Alert on impossible-travel sign-in patterns",zone:"det"},
   {id:"c6",t:"Alert when users consent to new third-party OAuth apps",zone:"det"},
   {id:"c7",t:"Review dormant accounts every month",zone:"det"},
   {id:"c8",t:"Alert on PIM activations outside business hours",zone:"det"}
  ]},
 explain:"<p>Prevention changes the world the attacker faces: killing <b>legacy authentication</b> removes the protocols that skip modern checks, <b>phishing-resistant MFA</b> for admins removes their favourite initial access, <b>managed identities</b> delete long-lived secrets that can leak, and <b>JIT access</b> means there is no standing admin to steal. Detection assumes something slips through: <b>impossible travel</b> and out-of-hours PIM activations are behaviour anomalies, new <b>OAuth consents</b> are the classic <b>consent phishing</b> tell, and monthly <b>dormant account</b> reviews surface accounts nobody is watching. Mature programmes need both columns \u2014 prevention sets the bar, detection catches the jump over it.</p>"},
{id:"M17",type:"fill",pts:2,
 title:"Name the pattern in the sign-in table",
 tags:["impossible travel","sign-in risk"],
 hint:"No aircraft on earth covers that distance in nine minutes. Then choose the verb that kills a session.",
 scenario:"<p>The risk engine hands you this table for account <code>p.moreau</code>:</p>",
 artifacts:{kind:"logview",title:"sign-in events \u2014 p.moreau",lines:[
  "09:02:11Z  p.moreau  Paris, FR      device=d-41a  IP=82[.]14[.]6[.]31   result=SUCCESS  risk=none",
  "09:11:26Z  p.moreau  Singapore, SG  device=d-77c  IP=103[.]9[.]22[.]8  result=SUCCESS  risk=high (unfamiliar properties)",
  "09:12:40Z  p.moreau  Singapore, SG  device=d-77c  IP=103[.]9[.]22[.]8  result=SUCCESS  risk=medium"
 ]},
 question:"<p>Complete the SOC note. Two blanks, each scored separately.</p>",
 data:{text:"The same account completed successful sign-ins in Paris and Singapore nine minutes apart. No human can fly that fast, so the pattern is called [[k1]]. First action for the on-call analyst: [[k2]] the session and reset the credentials.",
  answers:{
   k1:{accept:["impossible travel"],disp:"impossible travel"},
   k2:{accept:["revoke","terminate","kill"],disp:"revoke"}},
  bank:["impossible travel","token replay","credential stuffing","password spraying","revoke","ignore"]},
 explain:"<p>Two successful logins from continents nine minutes apart is the textbook definition of <b>impossible travel</b> \u2014 the credentials are valid, but they cannot both be the same human, so one of them is the attacker. A <b>sign-in risk</b> of high on the second event confirms unfamiliar properties. The first action is to <b>revoke</b> the session and reset credentials \u2014 investigating before containment leaves the attacker logged in. The decoys do not fit: token replay reuses the same session (the device would not change), stuffing and spraying hammer the login form and would show failures, not clean successes.</p>"},
{id:"M18",type:"match",pts:3,
 title:"Match the privileged-access concepts",
 tags:["PAM","PIM","JIT access","break-glass account","password vault","managed identity","Kerberoasting"],
 hint:"Two concepts are platforms, two are account types, one is a storage box, one is a cloud magic trick with no secret at all.",
 scenario:"<p>For the audit, the assessor wants proof the team understands its own privileged-access tooling. Six concept cards, six definitions, two decoys.</p>",
 question:"<p>Match every concept to its definition. Two definitions are decoys.</p>",
 data:{left:[
  {id:"l1",t:"PAM"},
  {id:"l2",t:"PIM"},
  {id:"l3",t:"JIT access"},
  {id:"l4",t:"Break-glass account"},
  {id:"l5",t:"Password vault"},
  {id:"l6",t:"Managed identity"}
 ],
  right:[
   {id:"d1",t:"Brokers and records privileged sessions, vaulting admin credentials",pair:"l1"},
   {id:"d2",t:"Makes admin roles eligible and time-bound, activated with approval",pair:"l2"},
   {id:"d3",t:"Grants a right only for a short window, then removes it again",pair:"l3"},
   {id:"d4",t:"Emergency-only admin account, excluded from normal rules and alarmed on every use",pair:"l4"},
   {id:"d5",t:"Encrypted store that keeps and rotates shared secrets",pair:"l5"},
   {id:"d6",t:"Cloud-created credential for a service \u2014 nothing to store, nothing to leak",pair:"l6"},
   {id:"d7",t:"Signs documents with a hardware key bound to an employee",pair:""},
   {id:"d8",t:"Scans container images for vulnerable libraries",pair:""}
  ]},
 explain:"<p><b>PAM</b> is the whole platform for admin access: vaulted credentials plus recorded sessions. <b>PIM</b> is the governance layer on top \u2014 roles become <i>eligible</i>, activated for a bounded time with approval and an audit trail. <b>JIT access</b> is the principle those tools implement: rights exist only while needed. A <b>break-glass account</b> is the sealed emergency exit \u2014 usable when automation fails, and every use raises an alert. A <b>password vault</b> stores and rotates shared secrets. A <b>managed identity</b> is cloud-issued for one service, so there is no secret to leak or rotate. As a bonus: auto-rotated managed service passwords (like gMSA in AD) are also what defeat <b>Kerberoasting</b>, because offline cracking has nothing feasible to chew on. Document signing and container scanning are decoys.</p>"},
{id:"M19",type:"order",pts:3,
 title:"Order the offboarding steps",
 tags:["deprovisioning","offboarding","joiner-mover-leaver","key rotation"],
 hint:"Cut the access first, keep the business running second, sweep the secrets the person knew third.",
 scenario:"<p>Tom\u2019s last day was Friday; his exit interview went well, but nobody touched his identity yet. The leaver checklist is on your desk, shuffled. Assemble it.</p>",
 question:"<p>Order the <b>offboarding</b> steps (1 = first).</p>",
 data:{items:[
  {id:"o1",t:"Disable the account and revoke active sessions and tokens"},
  {id:"o2",t:"Transfer ownership of data, mailboxes and pipelines to the team"},
  {id:"o3",t:"Rotate every shared or known credential Tom could reach"},
  {id:"o4",t:"Revoke his API keys, certificates and OAuth consents"},
  {id:"o5",t:"Archive mailbox and files according to policy"},
  {id:"o6",t:"Remove group memberships and licences, close the leaver record"}
 ]},
 explain:"<p><b>Deprovisioning</b> starts with containment: disable and <b>revoke sessions</b> so the departing identity stops working immediately. Then business continuity \u2014 hand over data and pipelines before anything is deleted. Step three is the one teams forget: <b>rotate every shared or known credential</b> (service passwords, keys) the leaver ever saw, because knowledge leaves the building with the person. Then sweep his personal <b>key rotation</b> surface \u2014 API keys, certificates, OAuth consents. Archiving satisfies legal retention, and only after that do the final directory cleanup and the closed leaver record complete the <b>joiner-mover-leaver</b> cycle. Skipping step one is how <b>orphaned accounts</b> are born.</p>"},
{id:"M20",type:"qcm",pts:2,
 title:"The least-privileged way to read production logs",
 tags:["least privilege","permission scoping","RBAC"],
 hint:"The right answer creates exactly the access needed, through the governance door, for exactly the scope needed.",
 scenario:"<p>A DevOps engineer needs to read production logs to debug a failing pipeline. He asks for \u201Cwhatever is fastest.\u201D Four options reach your desk.</p>",
 question:"<p>Which option implements least privilege correctly?</p>",
 data:{opts:[
  {t:"Create a custom read-only log role scoped to the production log store and assign it via governance",ok:true},
  {t:"Add the engineer to the tenant-wide Reader group so nothing is missing later",ok:false},
  {t:"Lend him the on-call admin account until the incident is closed",ok:false},
  {t:"Clone a teammate's permission set, then trim the extras next quarter",ok:false}
 ]},
 explain:"<p>Least privilege means: <b>the smallest set of actions, on the smallest set of resources, for a justified need</b>. A custom role that reads only the production log store delivers exactly that, through an auditable approval. Tenant-wide Reader is far beyond the need (and covers more than logs); borrowing an admin account destroys traceability \u2014 the logs would show the on-call identity, not the engineer; and <b>cloning</b> someone else\u2019s permissions copies their <i>accumulated</i> access, which is how entitlement sprawl starts \u2014 the \u201Ctrim later\u201D never comes. This is <b>RBAC</b> done right: permissions shaped to the role\u2019s real tasks with tight <b>permission scoping</b>.</p>"}
);
/* ===== MEDIUM data: M21-M25 ===== */
EX.push(
{id:"M21",type:"order",pts:2,
 title:"Order the JWT validation checks",
 tags:["JWT","OIDC","access token","claims"],
 hint:"The signature proves the token is genuine before anything inside it can be believed.",
 scenario:"<p>Your new API receives bearer tokens from the company IdP (OIDC). A junior developer wrote the validation stack as sticky notes \u2014 in the wrong order. Sequence them so the API rejects bad tokens as early as possible.</p>",
 question:"<p>Put the validation steps in the order the API must perform them (1 = first).</p>",
 data:{items:[
  {id:"j1",t:"Verify the token signature against the IdP's published public keys"},
  {id:"j2",t:"Check the iss and aud claims match this IdP and this API"},
  {id:"j3",t:"Check exp and nbf timestamps against the current time"},
  {id:"j4",t:"Enforce the scopes or roles claim for the requested action"},
  {id:"j5",t:"Log the decision and serve the request"}
 ]},
 explain:"<p>A <b>JWT</b> is only worth reading once its <b>signature</b> verifies against the IdP\u2019s public keys \u2014 everything else can be forged otherwise. Then the <b>claims</b> identity check: <code>iss</code> proves the right issuer issued it, <code>aud</code> proves it was minted <i>for this API</i> (a token for another app must be refused even if genuine). Freshness follows: <code>exp</code> and <code>nbf</code> keep expired <b>access token</b>s out. Only then does authorization make sense \u2014 enforce the scopes or roles for the action \u2014 and finally the decision is logged. Reordering risks accepting a genuine-but-foreign or stale token.</p>"},
{id:"M22",type:"fill",pts:2,
 title:"Complete the SAML sign-in story",
 tags:["SAML 2.0","IdP","service provider","signing certificate","metadata"],
 hint:"Who vouches for the user, what document do they hand over, and what proves the document is genuine?",
 scenario:"<p>The help desk keeps confusing federation vocabulary. You write the four-sentence story of a SAML login on the training slide \u2014 with four holes.</p>",
 question:"<p>Fill the blanks. Each blank is scored separately.</p>",
 data:{text:"The user asks the [[k1]] for a protected app. The service provider redirects the user to the [[k2]], where authentication happens. The IdP signs a [[k3]] and posts it back to the SP. The SP validates the [[k4]] using the public certificate it imported from the IdP federation metadata, then opens the session.",
  answers:{
   k1:{accept:["service provider","sp"],disp:"service provider"},
   k2:{accept:["identity provider","idp"],disp:"identity provider"},
   k3:{accept:["saml assertion","assertion"],disp:"SAML assertion"},
   k4:{accept:["signature","assertion signature"],disp:"signature"}},
  bank:["service provider","identity provider","SAML assertion","signature","private key","refresh token","session cookie"]},
 explain:"<p>The flow starts at the <b>service provider</b> (the app), which sends the user to the <b>IdP</b> to authenticate. The IdP produces a signed <b>SAML assertion</b> \u2014 a signed statement of \u201Cthis is user X, authenticated at time T\u201D. The SP validates the <b>signature</b> with the IdP\u2019s public certificate from the federation <b>metadata</b>; the private key never leaves the IdP, so its appearance in the bank is the trap. A refresh token belongs to OAuth and a session cookie is what the SP may issue afterwards \u2014 neither is part of the assertion hand-off.</p>"},
{id:"M23",type:"spot",pts:2,
 title:"Spot the mistake in the service account roles",
 tags:["least privilege","service account","permission scoping"],
 hint:"The pipeline uploads artefacts and pushes images. One binding lets it do everything else too.",
 scenario:"<p>The CI service account <code>ci-deploy</code> builds and publishes container images. Terraform manages its role bindings:</p>",
 artifacts:{kind:"code",clickable:true,lines:[
  "resource \"google_service_account\" \"ci_deploy\" { account_id = \"ci-deploy\" }",
  "binding \"artifacts\"  { role = \"roles/artifactregistry.writer\" members = [sa.ci_deploy] }",
  "binding \"images\"     { role = \"roles/storage.objectViewer\"   members = [sa.ci_deploy] }",
  "binding \"everything\" { role = \"roles/owner\"                  members = [sa.ci_deploy] }"
 ]},
 question:"<p>Click the ONE line that is the mistake.</p>",
 data:{lines:[
  "resource \"google_service_account\" \"ci_deploy\" { account_id = \"ci-deploy\" }",
  "binding \"artifacts\"  { role = \"roles/artifactregistry.writer\" members = [sa.ci_deploy] }",
  "binding \"images\"     { role = \"roles/storage.objectViewer\"   members = [sa.ci_deploy] }",
  "binding \"everything\" { role = \"roles/owner\"                  members = [sa.ci_deploy] }"
 ],bad:[3],
  why:"roles/owner on a CI service account is total compromise potential."},
 explain:"<p>A CI publisher needs to write artefacts and read its own image store \u2014 the first two bindings are honest <b>permission scoping</b>. <code>roles/owner</code> hands the pipeline full control of the project, including IAM changes and secret access. CI pipelines run semi-trusted code on every build, so an owner-level <b>service account</b> turns any build compromise into full project takeover \u2014 the exact opposite of <b>least privilege</b>. Fix: drop the owner binding; if a deploy step ever needs more, add the narrowest role that covers that step.</p>"},
{id:"M24",type:"categorize",pts:3,
 title:"Phishable or phishing-resistant?",
 tags:["SMS OTP","push approval","TOTP","FIDO2 security key","phishing-resistant MFA","MFA fatigue"],
 hint:"Ask for each method: could a real-time relay proxy forward this factor to the true site without the user noticing?",
 scenario:"<p>After the executive phishing incident, the deck for the board must split every MFA method the company runs into two honest buckets: methods an AiTM proxy can relay, and methods that fail on a fake domain.</p>",
 question:"<p>Sort each method into <b>PHISHABLE</b> or <b>PHISHING-RESISTANT</b>.</p>",
 data:{zones:[{id:"phish",label:"PHISHABLE (relayable in real time)"},{id:"resist",label:"PHISHING-RESISTANT"}],
  items:[
   {id:"m1",t:"SMS one-time code",zone:"phish"},
   {id:"m2",t:"Push approval prompt",zone:"phish"},
   {id:"m3",t:"TOTP six-digit code",zone:"phish"},
   {id:"m4",t:"Voice-call one-time code",zone:"phish"},
   {id:"m5",t:"FIDO2 security key",zone:"resist"},
   {id:"m6",t:"Smart card + PIN (origin-bound)",zone:"resist"},
   {id:"m7",t:"Platform passkey bound to the true domain",zone:"resist"}
  ]},
 explain:"<p>Anything the user <b>types or taps through the page in front of them</b> can be relayed by an AiTM proxy: SMS codes, push approvals, TOTP codes and voice codes all fall in that bucket \u2014 pushes also suffer <b>MFA fatigue</b> bombing, which number matching only softens. <b>Phishing-resistant</b> methods sign a challenge that contains the real origin: a <b>FIDO2 key</b>, an origin-bound smart card, and a passkey simply refuse to produce a signature for the wrong domain, so the relay has nothing to forward. That origin binding \u2014 not stronger maths \u2014 is what makes the right column fundamentally different.</p>"},
{id:"M25",type:"tree",pts:2,
 title:"Decision path: the leaked pipeline key",
 tags:["key rotation","managed identity","service account","secrets manager","audit logging"],
 hint:"First stop the bleeding, then remove the class of problem, then look for evidence of use.",
 scenario:"<p>16:40 \u2014 a security researcher emails: the static access key of <code>svc-deploy</code> is in a public repository, posted two hours ago. You own the response.</p>",
 question:"<p>Choose the correct option at each decision point. Each decision is scored separately.</p>",
 data:{steps:[
  {p:"<p><b>Decision 1 \u2014 The key is public right now. First action?</b></p>",
   opts:[
    {t:"Revoke the exposed key immediately",ok:true,fb:"The key is dead within minutes \u2014 anyone who found it now finds a 403."},
    {t:"Open a pull request to remove the file from the repository",ok:false,fb:"Removing the file does not erase git history or the researcher's copy \u2014 the key stays live and public."},
    {t:"Email the team to be careful with keys",ok:false,fb:"Awareness is fine, but the live secret is still public \u2014 awareness is not containment."}]},
  {p:"<p><b>Decision 2 \u2014 The pipeline needs credentials again tomorrow. What replaces the key long-term?</b></p>",
   opts:[
    {t:"Switch the pipeline to a managed identity or short-lived federated credentials",ok:true,fb:"The pipeline now mints short-lived credentials per run \u2014 nothing long-lived left to leak."},
    {t:"Create a brand-new long-lived key and store it in a better place",ok:false,fb:"A newer secret is still a static secret \u2014 next quarter the same incident repeats."},
    {t:"Rotate the key monthly and document the process",ok:false,fb:"Rotation on a calendar does not protect the window between leaks \u2014 and leaks do not wait for the calendar."}]},
  {p:"<p><b>Decision 3 \u2014 How do you learn whether the key was abused?</b></p>",
   opts:[
    {t:"Search the audit logs for that key's ID across the full exposure window",ok:true,fb:"The audit trail answers definitively: every API call the key made, from where, doing what."},
    {t:"Ask the developer whether anything feels wrong",ok:false,fb:"Feelings are not evidence \u2014 abuse of a deploy key may be invisible in day-to-day work."},
    {t:"Wait for a billing alert to fire",ok:false,fb:"Financial signals are slow and incomplete \u2014 by the time a bill spikes, the damage is days old."}]}
 ]},
 explain:"<p><b>Decision 1:</b> a public key is an open door \u2014 revocation is minutes of work and closes it; deleting the file or mailing the team leaves the secret live in git history. <b>Decision 2:</b> the durable fix removes the secret entirely \u2014 a <b>managed identity</b> or short-lived federated credentials minted per run leave nothing to steal; a fresh static key (or scheduled <b>key rotation</b>) just resets the clock on the same failure. <b>Decision 3:</b> only the <b>audit log</b> proves whether the key was used \u2014 every call made with it is recorded with source and action; feelings and billing alerts are neither complete nor timely. Storing any remaining secrets belongs in a <b>secrets manager</b>, never in repositories.</p>"}
);

 scenario:"<p>Northwind connects six SaaS apps to its IdP for <b>SSO</b> via SAML. A board member asks what the IdP concretely does for the users now.</p>",

  {t:"It stores a separate password for each SaaS app and fills them in automatically",ok:false},
  {t:"It copies each user account into every app's local database for faster checks",ok:false},
  {t:"It removes the need for MFA because federation is already secure by itself",ok:false}
 ]},
 explain:"<p><b>Federation</b> means the IdP vouches for the user: it authenticates <i>once</i> and hands each app a signed <b>SAML assertion</b> saying \u201Cthis is user X, I verified them at time T\u201D. The apps never see the password \u2014 no vault, no password copying, and the accounts live in the directory, not duplicated into every SaaS. And SSO changes nothing about MFA: strong federation <i>plus</i> MFA is the goal, because the IdP is now the single door every attacker wants to knock on \u2014 that is exactly why it deserves the strongest authentication, not the weakest.</p>"},

/* ===== boot: intro, results, reporting, handshake, global wiring ===== */
function buildIntro(){
  var ex=INTRO_EXTRA;
  var ih='<div class="intro-hero"><div><h1>'+esc(ex.h1)+'</h1><p style="color:var(--mut);margin:4px 0 0">'+esc(ex.sub)+'</p></div>'+
    '<div class="meta">'+
    '<span class="pill">Severity: <b>'+esc(META.difficulty.toUpperCase())+'</b></span>'+
    '<span class="pill">Questions: <b>'+S.exs.length+'</b></span>'+
    '<span class="pill">Timer: <b>'+fmtT(S.total)+'</b></span>'+
    '<span class="pill">Pass mark: <b>'+META.passMark+'%</b></span></div></div>';
  if(S.user)ih+='<p style="color:#9ec1ff">Good luck, '+esc(S.user)+'.</p>';
  ih+='<h2>How this exam works</h2><ul class="info-list">'+
    '<li><b>'+S.exs.length+' scenario-based exercises</b> mix drag &amp; drop, matching, ordering, fill-in-the-blank, log analysis with a filter box, spot-the-mistake, decision trees, triage queues, prioritisation, a terminal simulation and a few classic choices.</li>'+
    '<li><b>Check</b> validates your answer, marks every element (green = correct, red = wrong, half-moon = partial), locks it for scoring and <b>pauses the timer in review mode</b>. The exercise and explanation stay fully visible. Only moving on \u2014 <b>Next</b>, or opening another exercise in the navigator \u2014 resumes the clock.</li>'+
    '<li><b>Skip</b> jumps to the next exercise and flags it (amber \u21B7). You can come back to any skipped or answered exercise while time remains. Skipped exercises are <b>excluded from scoring</b> \u2014 from both your points and the maximum.</li>'+
    '<li><b>Pause</b> (manual) hides the exercise while the clock is frozen. The two pause reasons are independent and can stack; both must be cleared for time to run.</li>'+
    '<li><b>Partial credit:</b> multi-answer exercises earn one share of points per correct element; wrong picks earn nothing extra but never subtract.</li>'+
    '<li><b>Hint:</b> one per exercise, costs 10% of that exercise\u2019s points, and nudges \u2014 it never reveals the answer.</li>'+
    '<li>'+esc(ex.blurb)+'</li>'+
    '<li>At the end you get a full per-question report. <b>Pass: '+META.passMark+'%.</b> Retaking reshuffles questions and answers.</li></ul>';
  ih+='<div class="kw-panel"><h2>Keywords covered</h2><p class="drag-hint">Every keyword below is exercised at least once in this file. Master them and the chapter is yours.</p><div class="kw-grid">';
  THEMES.forEach(function(t){
    ih+='<div class="kw"><h4>'+esc(t.n)+" ("+t.k.length+")</h4><div class='ks'>";
    t.k.forEach(function(k){ih+='<span class="k">'+esc(k)+"</span>"});
    ih+="</div></div>";
  });
  ih+="</div></div>";
  var intro=$("#intro");intro.innerHTML=ih;
  var b=el("button","btn btn-primary","\u25B6 Start exam");b.type="button";b.id="btn-start";
  b.style.marginTop="14px";b.onclick=startExam;
  intro.appendChild(b);
}
function startExam(){
  S.started=true;
  $("#intro").classList.add("hid");
  $("#hdr").classList.remove("hid");$("#stage").classList.remove("hid");$("#fnav").classList.remove("hid");
  renderTimer();goTo(0);startTimer();
}
function retake(){
  buildAttempt();
  $("#results").classList.add("hid");$("#hdr").classList.add("hid");
  $("#stage").classList.add("hid");$("#fnav").classList.add("hid");
  $("#intro").classList.remove("hid");
  $("#btn-next").classList.remove("hid");$("#btn-fin").classList.add("hid");
  buildIntro();updateHeader();renderTimer();
}
function finishExam(auto){
  if(S.ended)return;
  var answered=S.exs.some(function(e,i){return !!S.checked[i]});
  if(!answered){
    var w=$("#warn-slot");
    if(auto&&w&&S.remain<=0&&w.textContent.indexOf("cannot be submitted")>=0)return;
    var msg='<div class="warnbox" role="alert">\u26A0 '+(auto?"Time is over, but every exercise was skipped. ":"")+"All exercises are skipped \u2014 the exam cannot be submitted. Go back and answer at least one exercise (Check or at least an answer), then finish again.</div>";
    if(!w){w=el("div");w.id="warn-slot";$("#stage").appendChild(w)}
    w.innerHTML=msg;
    renderNav();
    try{$("#stage").scrollIntoView({behavior:smoothPref(),block:"end"})}catch(e){}
    return;
  }
  S.ended=true;clearInterval(S.tick);
  renderResults(auto);
}
function renderResults(auto){
  var R=$("#results");R.classList.remove("hid");
  $("#stage").classList.add("hid");$("#fnav").classList.add("hid");
  var totE=0,totM=0,skipped=[],rows="";
  S.exs.forEach(function(ex,i){
    var c=S.checked[i];
    if(!c){skipped.push(i);
      rows+='<div class="rrow"><div class="rrow-h"><b>Q'+(i+1)+" \u2014 "+esc(ex.title)+'</b><span class="badge sk">\u21B7 SKIPPED \u2014 excluded from scoring</span></div>'+
        '<div class="ansline">You left this exercise unanswered, so it added nothing to your points and nothing to the maximum.</div>'+
        '<details class="exp"><summary>Show what the exercise wanted (learn from it)</summary><div class="exp-b">'+ex.explain+"</div></details></div>";
      return}
    totE+=c.earned;totM+=c.max;
    var lab=c.earned>=c.max-0.001?"full":c.earned<=0?"zero":"part";
    var labT=lab==="full"?"FULL":lab==="zero"?"ZERO":"PARTIAL";
    rows+='<div class="rrow"><div class="rrow-h"><b>Q'+(i+1)+" \u2014 "+esc(ex.title)+'</b><span><span class="badge '+lab+'">'+labT+"</span> <span style='font-size:13px;color:var(--mut)'>"+fmtP(c.earned)+" / "+fmtP(c.max)+" pts</span></span></div>"+
      '<div class="ansline"><b>Your answer:</b> '+c.yours+"</div>"+
      '<div class="ansline"><b>Correct:</b> '+c.correct+"</div>"+
      '<details class="exp" open><summary>Why \u2014 explanation &amp; focus tips</summary><div class="exp-b">'+ex.explain+"</div></details></div>";
  });
  var corr=Math.round(totE);
  var pct=totM>0?Math.round(corr/totM*100):0;
  var pass=pct>=META.passMark;
  var hero=pass?
    '<div class="pass-panel"><div style="font-size:40px">\uD83C\uDFC5</div><h2>PASS \u2014 '+pct+"%</h2><p>You reached the "+META.passMark+"% pass mark on this "+esc(META.difficulty.toUpperCase())+" exam. Certificate-style credit earned for chapter "+esc(String(META.chapter))+".</p></div>":
    '<div class="fail-panel"><div style="font-size:40px">\uD83D\uDD04</div><h2>FAIL \u2014 '+pct+"%</h2><p>You needed "+META.passMark+"%. Work through the report below, focus on the red and half-moon items, then retake the exam \u2014 questions and answers will be shuffled.</p></div>";
  var html='<h1>Results \u2014 '+esc(META.title)+"</h1>"+
    (auto?'<p class="drag-hint">Time ran out \u2014 the exam was submitted automatically.</p>':"")+
    '<div class="res-sum">'+
    '<div class="res-card"><div class="big" id="res-pct">'+(S.reducedMotion?String(pct)+"%":"0%")+'</div><div class="lbl">final percentage</div></div>'+
    '<div class="res-card"><div class="big">'+fmtP(corr)+' / '+fmtP(totM)+'</div><div class="lbl">points (skipped excluded)</div></div>'+
    '<div class="res-card"><div class="big">'+(S.exs.length-skipped.length)+' / '+S.exs.length+'</div><div class="lbl">exercises answered</div></div>'+
    '<div class="res-card"><div class="big">'+skipped.length+'</div><div class="lbl">skipped (not counted)</div></div></div>'+
    hero;
  if(skipped.length){
    html+='<div class="sk-list"><b>Skipped exercises:</b> '+skipped.map(function(i){return "Q"+(i+1)}).join(", ")+
      ". They were excluded from scoring \u2014 their points are neither earned nor possible.</div>";
  }
  html+=rows;
  html+='<div style="text-align:center;margin:16px 0"><button id="btn-retake" class="btn btn-primary" style="min-width:220px">\u21BB Retake exam</button></div>';
  R.innerHTML=html;
  $("#btn-retake").onclick=retake;
  S.reducedMotion=false;
  try{S.reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  var pctEl=$("#res-pct");
  var done=false;
  function fire(){
    if(done)return;done=true;
    reportScore(corr,totM);
  }
  if(S.reducedMotion){pctEl.textContent=pct+"%";fire()}
  else{
    var t0=null,D=700;
    function step(ts){
      if(t0==null)t0=ts;
      var k=Math.min(1,(ts-t0)/D);
      pctEl.textContent=Math.round(pct*(1-Math.pow(1-k,3)))+"%";
      if(k<1)requestAnimationFrame(step);else fire();
    }
    requestAnimationFrame(step);
    setTimeout(fire,1400);
  }
  window.scrollTo({top:0,behavior:smoothPref()});
}
function reportScore(correct,total){
  var percent=total>0?Math.round((correct/total)*100):0;
  try{
    parent.postMessage({
      type:"CYBERPULSE_SCORE",
      topicId:META.topicId,
      score:correct,
      total:total,
      percent:percent,
      passed:percent>=META.passMark
    },location.origin);
  }catch(e){/* opened directly \u2014 nothing to report to */}
}
window.addEventListener("message",function(event){
  if(!event.data)return;
  if(event.data.type!=="CYBERPULSE_INIT"&&event.data.type!=="CYBERMASTERY_INIT")return;
  try{
    S.user=event.data.username||"";
    if(!S.started)buildIntro();
  }catch(e){}
});
document.addEventListener("DOMContentLoaded",function(){
  buildAttempt();
  $("#btn-pause").onclick=function(){
    if(S.ended)return;
    S.manualPause=!S.manualPause;
    renderTimer();renderEx();
  };
  $("#btn-prev").onclick=prevEx;
  $("#btn-next").onclick=nextEx;
  $("#btn-fin").onclick=function(){finishExam(false)};
  $("#hdr").classList.add("hid");
  buildIntro();renderTimer();
});

</script>
