   {
    "t": "No DHCP server answered the workstation's DISCOVER request",

   {
    "t": "The DNS server is not resolving names",

    }).join("")+"</div></div>";
  }else if(e.type==="bank"){

    h="<p class='btext'>"+parts[0];
    for(var i=1;i<parts.length;i++){
      var wid=resp.bl[i-1],m=marks?marks[i-1]:"";

    }
    h+="</p><div class='exlbl2'>Term bank</div><div class='bank'>";

      return "<button type='button' class='chipItem' data-w='"+wi+"' draggable='"+(st.checked?"false":"true")+"'"+(st.checked?" disabled":"")+">"+esc(e.answers[wi])+"</button>";
    }).join("");
    h+="</div><p class='faint'>Click a placed term again (on the blank) to pull it back.</p>";
  }else if(e.type==="bucket"){
    h="<div class='exlbl2'>Items to sort</div><div class='bank'>";
    h+=st.shuf.it.filter(function(f){return resp.bk[f]==null}).map(function(f){
      var it=st.shuf.flat[f],bm=marks?marks[f]:"";
      return "<button type='button' class='chipItem"+(bm?" "+bm:"")+"' data-f='"+f+"' draggable='"+(st.checked?"false":"true")+"'"+(st.checked?" disabled":"")+"><span>"+esc(e.buckets[it.b].items[it.i])+"</span><span class='"+mkCls(bm)+"'>"+mkTxt(bm)+"</span></button>";
    }).join("");
    h+="</div><div class='zones'>";
    e.buckets.forEach(function(b,bi){
      h+="<div class='zone bzone' data-bk='"+bi+"' role='button' tabindex='0' aria-label='Queue: "+esc(b.name)+"'><div class='zname'>"+esc(b.name)+"</div><div class='zitems'>"+st.shuf.it.filter(function(f){return resp.bk[f]===bi}).map(function(f){
        var it=st.shuf.flat[f],m=marks?marks[f]:"";
        return "<button type='button' class='chipItem"+(m?" "+m:"")+"' data-f='"+f+"'"+(st.checked?" disabled":"")+"><span>"+esc(e.buckets[it.b].items[it.i])+"</span><span class='"+mkCls(m)+"'>"+mkTxt(m)+"</span></button>";
      }).join("")+"</div></div>";
    });
    h+="</div><p class='faint'>Click a placed item again to pull it back before you press Check.</p>";
  }else if(e.type==="terminal"){
    var m=marks?marks.cmd:"";
    h="<div class='term'><div class='thead'><span>analyst@jump — diagnostic console</span><span class='"+mkCls(m)+"'>"+mkTxt(m)+"</span></div><div class='tout' aria-live='polite'>"+resp.lines.map(function(l){return "<span class='tln'><span class='ps1'>analyst@jump:~$</span> "+esc(l)+"</span>"}).join("")+"</div><div class='tline'><label class='ps1' for='tin'>analyst@jump:~$</label><input id='tin' type='text' autocomplete='off' spellcheck='false' aria-label='Type your command'"+(st.checked?" disabled":"")+"></div></div>";
    if(e.prompt)h+="<p class='faint'>"+e.prompt+"</p>";
  }else if(e.type==="branch"){
    h="<div class='brsteps'>"+e.steps.map(function(stp,si){
      var done=resp.sel[si]!=null;
      return "<button type='button' class='brstep"+(si===resp.cur?" cur":"")+(done?" done":"")+"' data-s='"+si+"' aria-label='Go to step "+(si+1)+"'"+(st.checked?" disabled":"")+">Step "+(si+1)+(done?" \u2713":"")+"</button>";
    }).join("")+"</div>";
    var si2=Math.min(resp.cur,e.steps.length-1),stp=e.steps[si2],sel=resp.sel[si2],bm=marks?marks[si2]:null;
    h+="<p class='brq'>"+stp.q+"</p><div class='bropts'>";
    h+=st.shuf.bo[si2].map(function(oi,di){
      var mk="";
      if(bm){if(sel===oi){mk=(oi===stp.best)?"ok":"bad"}else if(oi===stp.best){mk="miss"}}
      return "<button type='button' class='bropt"+(mk?" "+mk:"")+(sel===oi?" selc":"")+"' data-o='"+oi+"'"+(st.checked?" disabled":"")+"><span class='key'>"+ROM[di]+"</span><span class='txt'>"+stp.opts[oi]+"</span><span class='"+mkCls(mk)+"'>"+mkTxt(mk)+"</span></button>";
    }).join("");
    h+="</div><p class='faint'>Pick an option — you can revisit any step with the step buttons before you press Check.</p>";
  }else if(isSpot(e)){
    h="<p class='faint'>Selected lines are outlined. Everything you need is in the "+(e.art[0].k==="log"?"log":"config")+" above.</p>";
  }
  return h;
}
function evalEx(e,st){
  var r={earned:0,n:1,okc:0,ans:"—",key:"",marks:{}},resp=st.resp,oc;
  if(e.type==="qcm"||e.type==="multi"){
    var okL=[];e.choices.forEach(function(c,j){if(c.ok)okL.push(j)});
    if(e.type==="qcm"){
      var sel=resp.sel;
      r.okc=(sel>=0&&okL.indexOf(sel)>=0)?1:0;
      e.choices.forEach(function(c,j){r.marks[j]=j===okL[0]?"ok":(j===sel&&sel>=0?"bad":"")});
      r.ans=sel>=0?"You chose: "+e.choices[sel].t:"You did not choose an answer";
      r.key="Correct: "+e.choices[okL[0]].t;
      r.earned=r.okc;r.n=1;
    }else{
      r.n=okL.length;oc=0;
      okL.forEach(function(j){var s=resp.sel.indexOf(j)>=0;r.marks[j]=s?"ok":"miss";if(s)oc++});
      resp.sel.forEach(function(j){if(okL.indexOf(j)<0)r.marks[j]="bad"});
      r.okc=oc;r.earned=oc/Math.max(1,r.n);
      r.ans=resp.sel.length?("You selected: "+resp.sel.map(function(j){return e.choices[j].t}).join(" | ")):"You selected nothing";
      r.key="Correct: "+okL.map(function(j){return e.choices[j].t}).join(" | ");
    }
  }else if(isOrd(e)){
    r.n=e.order.length;oc=0;
    resp.arr.forEach(function(oi,p){r.marks[p]=oi===p?"ok":"bad";if(oi===p)oc++});
    r.okc=oc;r.earned=oc/r.n;
    r.ans="Your order: "+resp.arr.map(function(oi){return strip(e.order[oi]).split(" (")[0]}).join(" → ");
    r.key=(e.type==="prio"?"Correct priority, most urgent first: ":"Correct order: ")+e.order.map(function(s){return strip(s).split(" (")[0]}).join(" → ");
  }else if(e.type==="match"){
    r.n=e.pairs.length;oc=0;
    e.pairs.forEach(function(_,si){var ac=resp.m[si];if(ac===si){r.marks[si]="ok";oc++}else r.marks[si]=(ac!=null)?"bad":"miss"});
    r.okc=oc;r.earned=oc/r.n;
    var miss=[];e.pairs.forEach(function(p,si){if(resp.m[si]!==si)miss.push(p[0])});
    r.ans="Correct pairs: "+oc+" of "+r.n+(miss.length?" — not matched: "+miss.join(", "):"");
    r.key=e.pairs.map(function(p){return p[0]+" → "+p[1]}).join(" | ");
  }else if(e.type==="bank"){
    r.n=e.answers.length;oc=0;
    e.answers.forEach(function(_,bi){var w=resp.bl[bi];if(w===bi){r.marks[bi]="ok";oc++}else r.marks[bi]=(w!=null)?"bad":"miss"});
    r.okc=oc;r.earned=oc/r.n;
    r.ans=oc+" of "+r.n+" blanks correct";
    r.key="Correct blanks, in order: "+e.answers.join(", ");
  }else if(e.type==="bucket"){
    r.n=st.shuf.flat.length;oc=0;
    st.shuf.flat.forEach(function(f,fid){var want=f.b,got=resp.bk[fid];if(got===want){r.marks[fid]="ok";oc++}else r.marks[fid]=(got==null)?"miss":"bad"});
    r.okc=oc;r.earned=oc/r.n;
    r.ans=oc+" of "+r.n+" items in the right queue";
    r.key=e.buckets.map(function(b){return b.name+" — "+b.items.join(", ")}).join(" | ");
  }else if(e.type==="terminal"){
    var norm=function(t){return String(t).replace(/\[\.\]/g,".").trim()};
    if(e.mode==="multi"){
      r.n=e.accept.length;oc=0;var pcmd=[];
      e.accept.forEach(function(rx,i){
        var hit=resp.lines.some(function(l){return (new RegExp(rx,"i")).test(norm(l))});
        pcmd.push(hit);r.marks["c"+i]=hit?"ok":"bad";if(hit)oc++;
      });
      r.okc=oc;r.earned=oc/r.n;r.perCmd=pcmd;
      r.marks.cmd=oc===r.n?"ok":"bad";   /* console header shows the overall verdict too */
      r.ans=resp.lines.length?("You typed: "+resp.lines.map(function(l){return esc(l)}).join("  ;  ")):"You typed nothing";
      r.key="One accepted command per part — example: "+e.example;
    }else{
      r.n=1;var txt=resp.lines.map(norm).join("\n");
      var pass=e.mode==="all"?e.accept.every(function(rx){return (new RegExp(rx,"i")).test(txt)}):e.accept.some(function(rx){return (new RegExp(rx,"i")).test(txt)});
      r.okc=pass?1:0;r.earned=pass?1:0;r.marks.cmd=pass?"ok":"bad";
      r.ans=resp.lines.length?("You typed: "+resp.lines.map(function(l){return esc(l)}).join("  ;  ")):"You typed nothing";
      r.key="Example of an accepted command: "+e.example;
    }
  }else if(isSpot(e)){
    r.n=e.wrong.length;oc=0;
    e.art[0].lines.forEach(function(_,li){
      var s=resp.sel.indexOf(li)>=0,w=e.wrong.indexOf(li)>=0;
      if(s&&w){r.marks[li]="ok";oc++}else if(s&&!w)r.marks[li]="bad";else if(!s&&w)r.marks[li]="miss";else r.marks[li]="";
    });
    r.okc=oc;r.earned=oc/r.n;
    r.ans=resp.sel.length?("You flagged line(s): "+resp.sel.map(function(l){return (l+1)+" — "+e.art[0].lines[l]}).join(" | ")):"You flagged nothing";
    r.key="Faulty line(s): "+e.wrong.map(function(l){return (l+1)+" — "+e.art[0].lines[l]}).join(" | ");
  }else if(e.type==="branch"){
    r.n=e.steps.length;oc=0;
    e.steps.forEach(function(stp,si){
      var s2=resp.sel[si];
      if(s2==null){r.marks[si]="miss"}
      else if(s2===stp.best){r.marks[si]="ok";oc++}
      else{r.marks[si]="bad"}
    });
    r.okc=oc;r.earned=oc/r.n;
    var ch=[],be=[];
    e.steps.forEach(function(stp,si){var s3=resp.sel[si];ch.push(s3!=null?strip(stp.opts[s3]):"(no choice)");be.push(strip(stp.opts[stp.best]))});
    r.ans="Your path: "+ch.join(" → ");
    r.key="Best path: "+be.join(" → ");
  }
  return r;
}

function keyFor(e){
  if(e.type==="qcm"||e.type==="multi"){var okL=[];e.choices.forEach(function(c,j){if(c.ok)okL.push(j)});return "Correct: "+okL.map(function(j){return e.choices[j].t}).join(" | ")}
  if(isOrd(e))return (e.type==="prio"?"Correct priority, most urgent first: ":"Correct order: ")+e.order.map(function(s){return strip(s).split(" (")[0]}).join(" → ");
  if(e.type==="match")return e.pairs.map(function(p){return p[0]+" → "+p[1]}).join(" | ");
  if(e.type==="bank")return "Correct blanks, in order: "+e.answers.join(", ");
  if(e.type==="bucket")return e.buckets.map(function(b){return b.name+" — "+b.items.join(", ")}).join(" | ");
  if(e.type==="terminal")return (e.mode==="multi"?"One accepted command per part — example: ":"Example of an accepted command: ")+e.example;
  if(isSpot(e))return "Faulty line(s): "+e.wrong.map(function(l){return (l+1)+" — "+e.art[0].lines[l]}).join(" | ");
  if(e.type==="branch")return "Best path: "+e.steps.map(function(stp){return strip(stp.opts[stp.best])}).join(" → ");
  return "";
}

function bindEx(e,st){
  var selChip=null,selWord=null;
  var area=$("#ansArea");
  function refresh(){area.innerHTML=ansHtml(e,st,st.checked&&st.lastR?st.lastR.marks:null);bindAns()}
  function bindAns(){
    if(e.type==="qcm"||e.type==="multi"){
      eachNl(area.querySelectorAll("input"),function(inp){
        inp.addEventListener("change",function(){
          st.touched=true;
          if(e.type==="qcm")st.resp.sel=Number(inp.value);
          else{var v=Number(inp.value),ix=st.resp.sel.indexOf(v);if(ix>=0)st.resp.sel.splice(ix,1);else st.resp.sel.push(v)}
        });
      });
    }else if(isOrd(e)){
      var dragId=null;
      eachNl(area.querySelectorAll(".mv"),function(b){
        b.addEventListener("click",function(){
          st.touched=true;
          var li=b.closest(".orditem"),id=Number(li.getAttribute("data-id"));
          var p=st.resp.arr.indexOf(id),np=p+Number(b.getAttribute("data-mv"));
          if(np<0||np>=st.resp.arr.length)return;
          st.resp.arr[p]=st.resp.arr[np];st.resp.arr[np]=id;refresh();
        });
      });
      eachNl(area.querySelectorAll(".orditem"),function(li){
        li.addEventListener("dragstart",function(ev){dragId=Number(li.getAttribute("data-id"));ev.dataTransfer.setData("text/plain","")});
        li.addEventListener("dragover",function(ev){ev.preventDefault()});
        li.addEventListener("drop",function(ev){
          ev.preventDefault();if(dragId==null)return;
          st.touched=true;
          var tgt=Number(li.getAttribute("data-id")),a=st.resp.arr;
          var from=a.indexOf(dragId),to=a.indexOf(tgt);
          a.splice(from,1);a.splice(to,0,dragId);dragId=null;refresh();
        });
      });
    }else if(e.type==="match"){
      eachNl(area.querySelectorAll(".chipItem[data-chip]"),function(ch){
        ch.addEventListener("click",function(){
          if(st.checked)return;
          var id=Number(ch.getAttribute("data-chip"));
          if(selChip===id){selChip=null;ch.classList.remove("sel");return}
          var old=area.querySelector(".chipItem.sel");if(old)old.classList.remove("sel");
          selChip=id;ch.classList.add("sel");
        });
        ch.addEventListener("dragstart",function(){selChip=Number(ch.getAttribute("data-chip"))});
      });
      eachNl(area.querySelectorAll(".zone"),function(z){
        z.addEventListener("click",function(ev){
          if(st.checked)return;
          var un=ev.target.closest("[data-unchip]");
          if(un&&selChip==null){st.touched=true;delete st.resp.m[Number(z.getAttribute("data-slot"))];refresh();return}
          if(selChip==null)return;
          st.touched=true;st.resp.m[Number(z.getAttribute("data-slot"))]=selChip;selChip=null;refresh();
        });
        z.addEventListener("dragover",function(ev){ev.preventDefault()});
        z.addEventListener("drop",function(ev){ev.preventDefault();if(selChip==null||st.checked)return;st.touched=true;st.resp.m[Number(z.getAttribute("data-slot"))]=selChip;selChip=null;refresh()});
        z.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();z.click()}});
      });
    }else if(e.type==="bank"){
      eachNl(area.querySelectorAll(".chipItem[data-w]"),function(ch){
        ch.addEventListener("click",function(){
          if(st.checked)return;
          var w=Number(ch.getAttribute("data-w"));
          if(selWord===w){selWord=null;ch.classList.remove("sel");return}
          var old=area.querySelector(".chipItem.sel");if(old)old.classList.remove("sel");
          selWord=w;ch.classList.add("sel");
        });
        ch.addEventListener("dragstart",function(){selWord=Number(ch.getAttribute("data-w"))});
      });
      eachNl(area.querySelectorAll(".blank"),function(bl){
        function place(){
          if(st.checked)return;
          var bi=Number(bl.getAttribute("data-bl"));
          if(st.resp.bl[bi]!=null&&selWord==null){st.touched=true;delete st.resp.bl[bi];refresh();return}
          if(selWord==null)return;
          st.touched=true;st.resp.bl[bi]=selWord;selWord=null;refresh();
        }
        bl.addEventListener("click",place);
        bl.addEventListener("dragover",function(ev){ev.preventDefault()});
        bl.addEventListener("drop",function(ev){ev.preventDefault();place()});
      });
    }else if(e.type==="bucket"){
      eachNl(area.querySelectorAll(".chipItem"),function(ch){
        ch.addEventListener("click",function(){
          if(st.checked)return;
          var f=Number(ch.getAttribute("data-f"));
          if(st.resp.bk[f]!=null){
            /* with a chip armed, this click belongs to the zone (place) — never pull back */
            if(selChip!=null)return;
            st.touched=true;st.resp.bk[f]=null;refresh();return;
          }
          if(selChip===f){selChip=null;ch.classList.remove("sel");return}
          var old=area.querySelector(".chipItem.sel");if(old)old.classList.remove("sel");
          selChip=f;ch.classList.add("sel");
        });
        ch.addEventListener("dragstart",function(){selChip=Number(ch.getAttribute("data-f"))});
      });
      eachNl(area.querySelectorAll(".bzone"),function(z){
        function place(){if(st.checked||selChip==null)return;st.touched=true;st.resp.bk[selChip]=Number(z.getAttribute("data-bk"));selChip=null;refresh()}
        z.addEventListener("click",function(ev){
          /* bare click on a placed chip belongs to that chip (pull back); an armed selection always places */
          if(ev.target.closest(".chipItem")&&selChip==null)return;
          place();
        });
        z.addEventListener("dragover",function(ev){ev.preventDefault()});
        z.addEventListener("drop",function(ev){ev.preventDefault();place()});
        z.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();place()}});
      });
    }else if(e.type==="terminal"){
      var tin=document.getElementById("tin"),tout=area.querySelector(".tout");
      if(tin)tin.addEventListener("keydown",function(ev){
        if(ev.key!=="Enter"||!tin.value.trim())return;
        var v=tin.value.trim();tin.value="";
        if(v==="clear"){st.resp.lines=[];tout.innerHTML="";return}
        st.touched=true;st.resp.lines.push(v);
        tout.insertAdjacentHTML("beforeend","<span class='tln'><span class='ps1'>analyst@jump:~$</span> "+esc(v)+"</span>");
        tout.scrollTop=tout.scrollHeight;
      });
    }else if(e.type==="branch"){
      eachNl(area.querySelectorAll(".brstep"),function(b){
        b.addEventListener("click",function(){
          if(st.checked)return;
          st.resp.cur=Number(b.getAttribute("data-s"));refresh();
        });
      });
      eachNl(area.querySelectorAll(".bropt"),function(b){
        b.addEventListener("click",function(){
          if(st.checked)return;
          st.touched=true;
          st.resp.sel[st.resp.cur]=Number(b.getAttribute("data-o"));
          if(st.resp.cur<e.steps.length-1)st.resp.cur++;
          refresh();
        });
      });
    }
  }
  bindAns();
  if(isSpot(e)){
    eachNl(document.querySelectorAll("#stage .cline[data-l]"),function(b){
      b.addEventListener("click",function(){
        if(st.checked)return;
        var id=Number(b.getAttribute("data-l")),ix=st.resp.sel.indexOf(id);
        if(ix>=0)st.resp.sel.splice(ix,1);else st.resp.sel.push(id);
        st.touched=true;
        b.classList.toggle("selc",st.resp.sel.indexOf(id)>=0);
      });
    });
  }
  var lf=document.querySelector("#stage .lfilter");
  if(lf)lf.addEventListener("input",function(){
    var q=lf.value.toLowerCase();
    eachNl(document.querySelectorAll("#stage .lrow"),function(rw){rw.style.display=rw.textContent.toLowerCase().indexOf(q)>=0?"":"none"});
  });
  $("#bPrev").addEventListener("click",goPrev);
  $("#bCheck").addEventListener("click",doCheck);
  $("#bSkip").addEventListener("click",function(){if(st.checked||finished)return;st.skipped=true;st.vis=true;goNext(true)});
  $("#bHint").addEventListener("click",function(){st.hinted=true;render()});
  $("#bRevise").addEventListener("click",function(){st.checked=false;st.earned=0;st.frac=0;st.lastR=null;st.okc=0;st.n=0;render()});
  $("#bNext").addEventListener("click",function(){goNext(false)});
}
function doCheck(){
  var e=EX[curIx()],st=S[curIx()];
  if(st.checked||finished||pM)return;
  var r=evalEx(e,st);
  st.lastR=r;st.checked=true;st.skipped=false;st.ans=r.ans;st.key=r.key;st.okc=r.okc;st.n=r.n;
  st.frac=r.earned;
  st.earned=Math.round(r.earned*e.pts*(st.hinted?0.9:1)*100)/100;
  pC=true;
  live(fbWord(st.frac)+". "+fmtP(st.earned)+" of "+e.pts+" points. Timer paused in review mode until Next.");
  render();renderBadges();
}
function goNext(fromSkip){
  if(finished)return;
  if(idx>=EX.length-1){confirmSubmit();return}
  pC=false;idx++;navFocus=true;render();renderBadges();
}
function goPrev(){if(idx<=0||finished)return;pC=false;idx--;navFocus=true;render();renderBadges()}
function goDot(i2){if(finished||i2===idx)return;pC=false;idx=i2;navFocus=true;render();renderBadges()}

function renderChrome(){
  var i,resolved=0;
  for(i=0;i<EX.length;i++)if(S[i].checked||S[i].skipped)resolved++;
  $("#pfill").style.width=(resolved/EX.length*100)+"%";
  var pb=$("#pbar");if(pb){pb.setAttribute("aria-valuemax",EX.length);pb.setAttribute("aria-valuenow",resolved)}
  $("#pos").textContent="Question "+(idx+1)+" of "+EX.length+" — "+EX[curIx()].theme;
  var earn=0,maxP=0;
  for(i=0;i<EX.length;i++){var st=S[i];if(!st.skipped&&st.checked){earn+=st.earned;maxP+=EX[i].pts}}
  var pct=maxP>0?Math.round(earn/maxP*100):0;
  $("#score").innerHTML="Score: <b>"+fmtP(earn)+"</b> / "+fmtP(maxP)+" pts"+(maxP>0?" ("+pct+"%)":"");
  $("#themes").innerHTML=THEMES.map(function(t){
    var tot=0,done=0;
    for(var j=0;j<EX.length;j++){if(EX[j].theme===t){tot++;var s2=S[j];if(s2.checked||s2.skipped)done++}}
    return "<span class='tchip'>"+t+" <b>"+done+"/"+tot+"</b></span>";
  }).join("");
  var d="";
  for(i=0;i<EX.length;i++){
    var s=S[seq[i]],ex2=EX[seq[i]],cls="dot",dm="";
    if(i===idx)cls+=" cur";
    if(s.skipped){cls+=" skip";dm="<span class='dm' aria-hidden='true'>S</span>"}
    else if(s.checked){
      if(s.frac>=0.999){cls+=" done";dm="<span class='dm' aria-hidden='true'>\u2713</span>"}
      else if(s.frac<=0.001){cls+=" bad";dm="<span class='dm' aria-hidden='true'>\u2717</span>"}
      else{cls+=" part";dm="<span class='dm' aria-hidden='true'>~</span>"}
    }
    var state2=s.skipped?"skipped":s.checked?(s.frac>=0.999?"checked — correct":(s.frac<=0.001?"checked — wrong":"checked — partial")):"not answered yet";
    d+="<button type='button' class='"+cls+"' data-i='"+i+"' aria-label='Go to question "+(i+1)+", "+esc(ex2.theme)+" — "+state2+"'><span class='dn'>"+(i+1)+"</span>"+dm+"</button>";
  }
  $("#dots").innerHTML=d;
  eachNl($("#dots").children,function(b){
    b.addEventListener("click",function(){goDot(Number(b.getAttribute("data-i")))});
  });
}
function renderBadges(){
  var m=document.getElementById("bdManual"),c=document.getElementById("bdCheck");
  if(m)m.hidden=!pM;if(c)c.hidden=!pC;
}
function drawTimer(){
  var el=document.getElementById("tmr");if(!el)return;
  var m=Math.floor(remaining/60),s=remaining%60;
  el.textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  var tb=document.getElementById("timerbox");
  if(tb)tb.className=remaining<totalSeconds()*0.1?"low":"";
}
function startTimer(){
  if(tick)clearInterval(tick);
  drawTimer();
  tick=setInterval(function(){
    if(finished)return;
    if(pM||pC)return;
    remaining--;
    if(remaining<=0){
      remaining=0;drawTimer();
      if(tick){clearInterval(tick);tick=null}
      timeUp=true;
      submitExam(true);
      return;
    }
    drawTimer();
  },1000);
}
function togglePause(){
  if(finished)return;
  pM=!pM;
  $("#btnPause").textContent=pM?"Resume":"Pause";
  $("#btnPause").setAttribute("aria-pressed",pM?"true":"false");
  var v=document.getElementById("veil");if(v)v.hidden=!pM;
  var sb=document.getElementById("btnSubmitTop");if(sb)sb.disabled=pM;
  live(pM?"Exam paused. Content hidden.":"Exam resumed.");
  renderBadges();
}
function openModal(o){
  currentOnOk=o.onOk||null;
  $("#mtitle").textContent=o.title;
  $("#mbody").innerHTML=o.body;
  $("#mOk").textContent=o.okText||"OK";
  $("#mCancel").hidden=!o.cancel;
  modalReturn=document.activeElement;
  $("#modal").hidden=false;
  $("#mOk").focus();
}
function closeModal(){
  var m=$("#modal");
  if(m.hidden)return;
  m.hidden=true;currentOnOk=null;
  if(modalReturn&&modalReturn.focus)modalReturn.focus();
}
function confirmSubmit(){
  if(finished)return;
  var pend=0,i,ans=0,skip=0;
  for(i=0;i<EX.length;i++){
    var st=S[i];
    if(st.skipped)skip++;
    else if(st.checked)ans++;
    else if(hasResp(EX[i],st)){ans++;pend++}
  }
  if(ans===0){
    openModal({title:"Cannot submit yet",body:"<p>You must answer <b>at least one exercise</b> before submitting — every exercise is still skipped or empty. Answer one exercise, then submit again.</p>",okText:"Back to the exam",cancel:false});
    return;
  }
  openModal({
    title:"Submit the exam?",
    body:"<p><b>"+ans+"</b> answered exercise(s)"+(pend?", including <b>"+pend+"</b> not checked yet — they will be graded from their current answers":"")+".</p><p>"+skip+" skipped exercise(s) will be excluded from the score completely — not counted in earned or possible points.</p>",
    okText:"Submit now",
    cancel:true,
    onOk:function(){closeModal();submitExam(false)}
  });
}
function reportScore(earn,maxP,percent,pass,auto){
  try{
    if(window.parent&&window.parent!==window){
      parent.postMessage({
        type:"CYBERPULSE_SCORE",
        topicId:(cand&&cand.topicId)||"cloud-plus",
        chapter:CFG.chapter,
        difficulty:CFG.difficulty,
        score:earn,
        total:maxP,
        percent:percent,
        passed:pass,
        attempt:attempt,
        timeUp:!!auto,
        username:userName||(cand&&cand.username)||"",
        country:(cand&&cand.country)||"",
        locale:(cand&&cand.locale)||"",
        batch:(cand&&cand.batch)||""
      },"*");
    }
  }catch(e){/* Opened directly rather than inside the site. Nothing to report to. */}
}
function submitExam(auto){
  if(finished)return;
  var i,st;
  for(i=0;i<EX.length;i++){
    st=S[i];
    if(st.skipped)continue;
    if(!st.checked){
      if(hasResp(EX[i],st)){
        var r=evalEx(EX[i],st);
        st.lastR=r;st.checked=true;st.ans=r.ans;st.key=r.key;st.okc=r.okc;st.n=r.n;
        st.frac=r.earned;
        st.earned=Math.round(r.earned*EX[i].pts*(st.hinted?0.9:1)*100)/100;
      }else st.skipped=true;
    }
  }
  var answered=[],skipped=[];
  for(i=0;i<EX.length;i++)(S[i].skipped?skipped:answered).push(i);
  if(answered.length===0&&!auto){
    openModal({title:"Cannot submit yet",body:"<p>You must answer <b>at least one exercise</b> before submitting — every exercise is still skipped or empty. Answer one exercise, then submit again.</p>",okText:"Back to the exam",cancel:false});
    return;
  }
  finished=true;
  var maxP=0,earn=0;
  answered.forEach(function(j){maxP+=EX[j].pts;earn+=S[j].earned});
  earn=Math.round(earn*100)/100;
  var percent=maxP>0?Math.round(earn/maxP*100):0,pass=percent>=70;
  if(!reported){reported=true;reportScore(earn,maxP,percent,pass,auto)}
  live("Exam submitted. Score "+fmtP(earn)+" of "+fmtP(maxP)+" points — "+percent+" percent.");
  renderResults(answered,skipped,maxP,earn,percent,pass,auto);
}
function renderResults(answered,skipped,maxP,earn,percent,pass,auto){
  curScreen="results";
  $("#topbar").hidden=true;$("#statusbar").hidden=true;$("#badges").hidden=true;
  var used=totalSeconds()-remaining;
  var h="<section class='res'>";
  h+="<div class='"+(pass?"bannerPass":"bannerFail")+"'><div class='bgt'>"+(pass?"\u2713 PASS — well done":"\u2717 FAIL — retake required")+"</div><div class='bgscore'>"+percent+"%</div><div class='bgsub'>You earned "+fmtP(earn)+" of "+fmtP(maxP)+" points across "+answered.length+" answered exercise(s). The pass mark is 70%."+(auto?" <b>Time expired — the exam was closed automatically.</b>":"")+(pass?" Your result has been recorded.":" You must retake this exam to pass the chapter.")+"</div></div>";
  h+="<div class='resmeta'>Candidate: "+esc(userName||(cand&&cand.username)||"Guest candidate")+(cand&&cand.country?" • "+esc(cand.country):"")+" • Attempt "+attempt+" • Time used "+fmtClock(used)+" • "+esc(CFG.bigTitle)+" • engine v"+esc(String(CFG.version))+"</div>";
  if(skipped.length){
    h+="<div class='skiplist'><b>Not counted — "+skipped.length+" skipped:</b> "+skipped.map(function(i){return esc(EX[i].title)}).join(", ")+". Skipped exercises are excluded from both the points you earned and the maximum possible.</div>";
  }
  h+="<div class='exlbl'>Per-exercise report</div>";
  seq.forEach(function(i,qn){
    var e=EX[i],st=S[i];
    var lab=st.skipped?"skipped":(st.frac>=0.999?"full":(st.frac<=0.001?"zero":"partial"));
    h+="<details class='rrow'><summary><span class='rq'>"+(qn+1)+"</span><span class='rt'>"+esc(e.title)+" <span class='faint2'>("+esc(e.theme)+")</span></span><span class='pill "+lab+"'>"+lab+"</span><span class='rpts'>"+(st.skipped?"not counted":fmtP(st.earned)+"/"+e.pts)+"</span></summary>";
    h+="<div class='rbody'><p><b>Your answer:</b> "+(st.ans||"not answered")+"</p><p><b>Answer key:</b> "+(st.key||keyFor(e))+"</p><p><b>Why:</b> "+e.explain+"</p>"+(st.skipped?"<p class='faint2'>This exercise was skipped, so it was not counted in your score — but you can still learn from the explanation above.</p>":"")+"</div></details>";
  });
  h+="<div class='cbtns'><button id='bRetake' class='btn primary big' type='button'>Retake exam</button></div></section>";
  $("#stage").innerHTML=h;
  $("#bRetake").addEventListener("click",startExam);
}
function renderIntro(){
  curScreen="intro";
  var h="<section class='hero'><h1>"+CFG.bigTitle+"</h1><p class='sub'>"+CFG.subTitle+"</p>";
  h+="<div class='badgerow'><span class='badge accb'>Severity: "+CFG.diffLabel+"</span><span class='badge warnb'>Pass mark: 70%</span><span class='badge ghostb'>"+EX.length+" exercises</span><span class='badge ghostb'>Time limit: "+fmtDur()+"</span><span class='badge ghostb'>Engine v"+esc(String(CFG.version))+"</span>"+(userName?"<span class='badge ghostb'>Candidate: "+esc(userName)+"</span>":"")+"</div></section>";
  h+="<div class='block'><span class='blab'>Keywords covered</span><div class='kwgrid'>";
  h+=CFG.kw.map(function(t){
    return "<div class='kwcard'><b class='kwt'>"+t[0]+"</b><div>"+t[1].map(function(k){return "<span class='kwtag'>"+esc(k)+"</span>"}).join("")+"</div></div>";
  }).join("");
  h+="</div></div>";
  h+="<div class='block'><span class='blab'>How this exam works</span><ul class='inlist'>";
  h+="<li><b>Answer all "+EX.length+" exercises.</b> Move with Back / Next or the numbered navigator; you can revisit any exercise until the timer ends.</li>";
  h+="<li><b>Check</b> grades the exercise, locks the answer, shows per-element marks plus an explanation, and pauses the timer in <i>review mode</i>. The timer runs again only when you press Next (or Back).</li>";
  h+="<li><b>Pause</b> (top bar) hides the content while paused. Manual pause and review mode can stack; the timer runs only when both are cleared.</li>";
  h+="<li><b>Skip</b> flags the exercise amber. Skipped exercises are excluded from the score completely — neither earned points nor maximum points. You can return to any skipped exercise and finish it before you submit.</li>";
  h+="<li><b>Partial credit:</b> multi-element exercises earn a share per correct element; wrong picks never subtract points. Single-answer exercises are all-or-nothing.</li>";
  h+="<li><b>Hint</b> costs 10% of that exercise's points and reveals a nudge, never the answer.</li>";
  h+="<li><b>Pass at 70%.</b> The final report shows your answer, the key and the explanation for every exercise; a retake reshuffles everything.</li>";
  h+="</ul></div>";
  h+="<div class='cbtns'><button id='bStart' class='btn primary big' type='button'>Start the exam</button></div>";
  $("#stage").innerHTML=h;
  $("#bStart").addEventListener("click",startExam);
}
function show(w){
  curScreen=w;
  $("#topbar").hidden=(w!=="exam");
  $("#statusbar").hidden=(w!=="exam");
  var bd=$("#badges");
  bd.hidden=(w!=="exam");
  if(w==="exam"){bd.innerHTML="<span id='bdManual' class='badge warnb' hidden>Paused (manual)</span><span id='bdCheck' class='badge accb' hidden>Timer paused — review mode</span>";renderBadges()}
  if(w==="intro")renderIntro();
  else if(w==="exam")render();
}
function renderCand(){
  var el=$("#candbar");if(!el)return;
  if(!cand){el.hidden=true;return}
  var bits=[];
  if(userName||cand.username)bits.push("Candidate: <b>"+esc(userName||cand.username)+"</b>");
  if(cand.country)bits.push("Country: "+esc(cand.country));
  if(cand.locale)bits.push("Locale: "+esc(cand.locale));
  if(cand.batch)bits.push("Batch: "+esc(cand.batch));
  if(cand.topicId)bits.push("Topic: "+esc(cand.topicId));
  if(cand.theme)bits.push("Theme: "+esc(cand.theme));
  el.innerHTML=bits.join(" <span class='csep'>•</span> ");
  el.hidden=bits.length===0;
}
window.addEventListener("message",function(ev){
  var d=ev.data;
  if(!d||typeof d!=="object")return;
  if(d.type!=="CYBERPULSE_INIT"&&d.type!=="CYBERMASTERY_INIT")return;
  var p=(d.payload&&typeof d.payload==="object")?d.payload:d;
  cand={
    username:p.username?String(p.username).slice(0,60):"",
    country:p.country?String(p.country).slice(0,60):"",
    theme:p.theme?String(p.theme).slice(0,30):"",
    locale:p.locale?String(p.locale).slice(0,20):"",
    topicId:p.topicId?String(p.topicId).slice(0,40):"cloud-plus",
    batch:p.batch?String(p.batch).slice(0,40):""
  };
  if(cand.username)userName=cand.username;
  renderCand();
  try{
    if(window.parent&&window.parent!==window){
      parent.postMessage({type:"CYBERPULSE_READY",accepted:true,difficulty:CFG.difficulty,topicId:cand.topicId},"*");
    }
  }catch(e){/* nothing to acknowledge to */}
  if(curScreen==="intro")renderIntro();
});
(function boot(){
  $("#tb-title").textContent=CFG.bigTitle+" — "+CFG.diffLabel;
  $("#btnPause").addEventListener("click",togglePause);
  $("#btnSubmitTop").addEventListener("click",confirmSubmit);
  $("#mOk").addEventListener("click",function(){var f=currentOnOk;currentOnOk=null;if(f)f();else closeModal()});
  $("#mCancel").addEventListener("click",closeModal);
  document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!$("#modal").hidden)closeModal()});
  drawTimer();
  show("intro");
})();

</script>
</body>
</html>
