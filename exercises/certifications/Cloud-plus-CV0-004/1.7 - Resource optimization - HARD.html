<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>CompTIA Cloud+ — Chapter 1.7 Resource Optimization — HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">{
  "topicId": "cloud-plus",
  "chapter": 7,
  "title": "Cloud+ 1.7 Resource Optimization - HARD",
  "difficulty": "hard",

  "estimatedMinutes": 55,
  "passMark": 70
}</script>
<style>

:root{
  --bg:#0b1220; --bg2:#101a2e; --panel:#131f37; --panel2:#0f1830;
  --line:#22324f; --line2:#2c3f5f;
  --text:#e6edf6; --muted:#9fb0c8; --muted2:#7689a6;
  --accent:#39d0d8; --accent2:#2bb6c9;
  --ok:#3fd07a; --warn:#f1c84b; --bad:#ff6b6b; --amber:#f4a142;
  --skip:#b48aff; --hint:#7aa2ff;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --radius:10px;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5}
body{min-height:100vh}
a{color:var(--accent)}
button{font-family:inherit;font-size:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:14px}

/* Layout */
#app{max-width:1080px;margin:0 auto;padding:14px 16px 60px}
header.exam-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);position:sticky;top:8px;z-index:30}
.exam-bar .brand{display:flex;align-items:center;gap:10px;font-weight:600}
.exam-bar .badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge.medium{background:#13314f;color:#6dd5ed;border:1px solid #2b5277}
.badge.hard{background:#3f1530;color:#ff9bb3;border:1px solid #6e2747}
.exam-bar .grow{flex:1 1 auto}
.exam-bar .timer{font-family:var(--mono);font-size:14px;padding:6px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:8px;min-width:96px;text-align:center}
.timer.warn{color:var(--warn);border-color:var(--warn)}
.timer.crit{color:var(--bad);border-color:var(--bad)}
.exam-bar .score{font-family:var(--mono);font-size:14px;padding:6px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:8px}
.progress-track{height:6px;background:#0b1220;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s ease}
.pausetag{margin-left:6px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);background:rgba(241,200,75,.08);display:inline-block}
.pausetag.checkpause{border-color:var(--accent);color:var(--accent);background:rgba(57,208,216,.08)}
.pausetag.both{border-color:var(--amber);color:var(--amber);background:rgba(244,161,66,.08)}

/* Intro */
.intro{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-top:14px}
.intro h1{margin:0 0 4px;font-size:22px}
.intro h2{margin:18px 0 6px;font-size:15px;color:var(--accent)}
.intro ul{margin:6px 0;padding-left:22px}
.intro ul li{margin:3px 0}
.intro .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.intro .meta-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.intro .meta-grid b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kw-panel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px}
.kw-panel h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.kw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.kw-grid .kw-block{background:#0b1220;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.kw-grid .kw-block h4{margin:0 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kw-grid .kw-block .kw{display:inline-block;margin:2px 4px 2px 0;padding:2px 6px;background:#0f1830;border:1px solid var(--line2);border-radius:6px;font-size:11px;color:var(--text);font-family:var(--mono)}

/* Exercise card */
.ex-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:14px;padding:16px 18px}
.ex-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ex-head .num{font-family:var(--mono);font-size:12px;color:var(--accent);background:#0b1220;border:1px solid var(--line2);padding:3px 8px;border-radius:6px}
.ex-head .type{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2)}
.ex-head .theme{font-size:11px;color:var(--muted);background:#0f1830;border:1px solid var(--line2);padding:2px 8px;border-radius:6px}
.ex-head .pts{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono)}
.ex-head .pts .earned{color:var(--ok)}
.label-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);background:#0b1220}
.label-tag.scenario{color:var(--accent);border-color:var(--accent)}
.label-tag.question{color:var(--warn);border-color:var(--warn)}
.label-tag.answers{color:var(--ok);border-color:var(--ok)}

.scenario-block{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin:6px 0 10px}
.question-block{background:#161f33;border:1px solid var(--line2);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px;margin:6px 0 10px;font-weight:500}
.answers-block{background:#0b1220;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:6px 0 10px}

/* QCM */
.qcm-option{display:flex;align-items:flex-start;gap:10px;padding:10px;margin:6px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer;min-height:44px;transition:border-color .15s,background .15s}
.qcm-option:hover{border-color:var(--accent)}
.qcm-option input{margin-top:3px;accent-color:var(--accent)}
.qcm-option .letter{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:700;min-width:18px}
.qcm-option.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.qcm-option.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}
.qcm-option.missed{border-color:var(--warn);background:rgba(241,200,75,.08)}
.qcm-option .icon{font-weight:700;margin-left:auto}
.qcm-option.correct .icon{color:var(--ok)}
.qcm-option.wrong .icon{color:var(--bad)}
.qcm-option.missed .icon{color:var(--warn)}

/* Drag and drop */
.dnd-pool{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;margin-bottom:8px;min-height:50px}
.dnd-item{padding:6px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:6px;cursor:grab;font-size:13px;user-select:none;font-family:var(--mono)}
.dnd-item:active{cursor:grabbing}
.dnd-item.dragging{opacity:.4}
.dnd-item.placed{opacity:.35;cursor:default}
.dnd-bucket{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;min-height:60px}
.dnd-bucket .bucket-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.dnd-bucket.dropzone{min-height:50px;padding:8px;border:1px dashed var(--line2);border-radius:6px;display:flex;flex-wrap:wrap;gap:6px}
.dnd-bucket .placed-item{padding:4px 8px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;font-size:12px;font-family:var(--mono);display:flex;align-items:center;gap:6px}
.dnd-bucket .placed-item .rmv{cursor:pointer;color:var(--bad);font-weight:700}
.dnd-bucket.correct .dropzone{border-color:var(--ok);background:rgba(63,208,122,.05)}
.dnd-bucket.wrong .dropzone{border-color:var(--bad);background:rgba(255,107,107,.05)}

/* Ordering */
.order-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.order-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px}
.order-item .pos{font-family:var(--mono);font-size:12px;color:var(--accent);background:#0b1220;border:1px solid var(--line2);padding:2px 8px;border-radius:5px;min-width:28px;text-align:center}
.order-item .content{flex:1}
.order-item .arrows{display:flex;flex-direction:column}
.order-item .arrows button{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;line-height:1;font-size:14px;min-width:24px}
.order-item .arrows button:hover{color:var(--accent)}
.order-item.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.order-item.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}

/* Fill blank */
.fb-sentence{font-size:15px;line-height:1.8;padding:8px 4px}
.fb-blank{display:inline-block;min-width:120px;padding:2px 8px;margin:0 2px;border-bottom:2px dashed var(--accent);background:rgba(57,208,216,.06);border-radius:4px;font-family:var(--mono);font-size:13px;color:var(--accent)}
.fb-blank.filled{cursor:pointer}
.fb-blank.correct{border-color:var(--ok);color:var(--ok);background:rgba(63,208,122,.08)}
.fb-blank.wrong{border-color:var(--bad);color:var(--bad);background:rgba(255,107,107,.08);text-decoration:line-through}
.fb-bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--panel2);border:1px dashed var(--line2);border-radius:8px;margin-top:8px;min-height:44px}
.fb-chip{padding:5px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:6px;font-size:13px;font-family:var(--mono);cursor:pointer;min-height:30px}
.fb-chip:hover{border-color:var(--accent)}
.fb-chip.used{opacity:.35;cursor:default}

/* Matching */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.match-col{display:flex;flex-direction:column;gap:6px}
.match-row{padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px;display:flex;flex-direction:column;gap:6px}
.match-row .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.match-row select{background:#0b1220;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;font-size:13px;min-height:34px;font-family:var(--sans)}
.match-row.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.match-row.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}

/* Terminal */
.term{background:#06090f;border:1px solid var(--line2);border-radius:8px;padding:10px;font-family:var(--mono);font-size:14px;min-height:160px;overflow:auto}
.term .prompt{color:var(--accent)}
.term .out{color:var(--muted);white-space:pre-wrap}
.term .out.err{color:var(--bad)}
.term-input{background:#06090f;border:1px solid var(--line2);color:var(--accent);font-family:var(--mono);font-size:14px;padding:8px;border-radius:6px;width:100%;min-height:38px}
.term-input:focus{border-color:var(--accent);outline:none}
.term-feedback{margin-top:6px;font-size:13px}
.term-feedback.ok{color:var(--ok)}
.term-feedback.bad{color:var(--bad)}

/* Log viewer */
.lv-toolbar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.lv-filter{flex:1;min-width:200px;background:#0b1220;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:13px;min-height:34px;font-family:var(--mono)}
.lv-toolbar button{padding:6px 10px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;color:var(--text);cursor:pointer;min-height:34px}
.lv-toolbar button:hover{border-color:var(--accent)}
.lv-line{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;background:#06090f;border:1px solid var(--line2);border-radius:4px;margin:3px 0;cursor:pointer;min-height:34px;font-family:var(--mono);font-size:13px;line-height:1.4}
.lv-line:hover{border-color:var(--accent)}
.lv-line.sel{border-color:var(--accent);background:rgba(57,208,216,.08)}
.lv-line.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.lv-line.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}
.lv-line .mark{font-weight:700;color:var(--accent);min-width:18px}
.lv-line.correct .mark{color:var(--ok)}
.lv-line.wrong .mark{color:var(--bad)}
.lv-line .ts{color:var(--muted2);min-width:130px}
.lv-line .sev{padding:0 4px;border-radius:3px;font-size:11px;font-weight:700}
.lv-line .sev.info{background:#13314f;color:#6dd5ed}
.lv-line .sev.warn{background:#3f3a14;color:var(--warn)}
.lv-line .sev.err{background:#3f1518;color:var(--bad)}
.lv-line .sev.crit{background:#3f1530;color:#ff9bb3}

/* Spot mistake */
.sm-code{background:#06090f;border:1px solid var(--line2);border-radius:8px;padding:8px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre;overflow:auto}
.sm-line{display:flex;align-items:flex-start;gap:8px;padding:3px 6px;border-radius:3px;cursor:pointer;min-height:28px}
.sm-line:hover{background:rgba(57,208,216,.06)}
.sm-line.sel{background:rgba(57,208,216,.15)}
.sm-line.correct{background:rgba(63,208,122,.15)}
.sm-line.wrong{background:rgba(255,107,107,.15)}
.sm-line .lnum{color:var(--muted2);min-width:32px;text-align:right;user-select:none}
.sm-line .mark{margin-left:auto;font-weight:700}
.sm-line.correct .mark{color:var(--ok)}
.sm-line.wrong .mark{color:var(--bad)}

/* Prioritize */
.prio-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.prio-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px}
.prio-item .rank{font-family:var(--mono);font-weight:700;color:var(--accent);min-width:24px;text-align:center}
.prio-item .content{flex:1;font-size:13px}
.prio-item .arrows{display:flex;flex-direction:column}
.prio-item .arrows button{background:none;border:none;color:var(--muted);cursor:pointer;padding:1px;line-height:1;font-size:14px;min-width:24px}
.prio-item .arrows button:hover{color:var(--accent)}
.prio-item.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.prio-item.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}
.prio-item.partial{border-color:var(--warn);background:rgba(241,200,75,.08)}

/* Scenario branching */
.sb-stage{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin:6px 0}
.sb-stage .stage-num{font-family:var(--mono);color:var(--accent);font-size:12px}
.sb-stage .stage-q{margin:6px 0;font-weight:500}
.sb-stage .choices{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sb-choice{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:#0b1220;border:1px solid var(--line2);border-radius:6px;cursor:pointer;min-height:44px;font-size:13px}
.sb-choice:hover{border-color:var(--accent)}
.sb-choice.sel{border-color:var(--accent);background:rgba(57,208,216,.08)}
.sb-choice.correct{border-color:var(--ok);background:rgba(63,208,122,.08)}
.sb-choice.wrong{border-color:var(--bad);background:rgba(255,107,107,.08)}

/* Dual perspective */
.dp-tabs{display:flex;gap:6px;margin-bottom:8px}
.dp-tab{padding:6px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;cursor:pointer;font-size:13px;min-height:34px}
.dp-tab.active{background:var(--accent);color:#0b1220;border-color:var(--accent);font-weight:600}
.dp-pane{display:none}
.dp-pane.active{display:block}

/* Hint / feedback / actions */
.hint-block{background:rgba(122,162,255,.06);border:1px dashed #7aa2ff;border-radius:8px;padding:8px 10px;margin:8px 0;color:var(--hint);font-size:13px}
.feedback-block{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.feedback-block .head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.feedback-block .head .pts-earned{font-family:var(--mono);font-size:13px;color:var(--ok)}
.feedback-block .head .pts-lost{font-family:var(--mono);font-size:13px;color:var(--bad)}
.feedback-block .head .pts-partial{font-family:var(--mono);font-size:13px;color:var(--warn)}
.feedback-block .explanation{font-size:14px;color:var(--text);line-height:1.6}
.feedback-block .explanation strong{color:var(--accent)}
.feedback-block .elements{margin-top:6px}
.feedback-block .el{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;font-family:var(--mono)}
.feedback-block .el .st{min-width:20px;font-weight:700}
.feedback-block .el .st.ok{color:var(--ok)}
.feedback-block .el .st.bad{color:var(--bad)}
.feedback-block .el .st.warn{color:var(--warn)}

.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:600;min-height:44px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#0b1220;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ok{background:var(--ok);color:#06140c;border-color:var(--ok)}
.btn.warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.skip{background:transparent;color:var(--skip);border-color:var(--skip)}
.btn.hint{background:transparent;color:var(--hint);border-color:var(--hint)}
.btn.nav-arrow{min-width:44px;text-align:center}

/* Navigator */
.navigator{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-top:12px}
.navigator h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.nav-grid{display:flex;flex-wrap:wrap;gap:6px}
.nav-cell{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#0b1220;border:1px solid var(--line2);border-radius:5px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted)}
.nav-cell:hover{border-color:var(--accent)}
.nav-cell.current{border-color:var(--accent);color:var(--accent);background:rgba(57,208,216,.1)}
.nav-cell.checked{background:rgba(63,208,122,.12);border-color:var(--ok);color:var(--ok)}
.nav-cell.skipped{background:rgba(180,138,255,.12);border-color:var(--skip);color:var(--skip)}
.nav-cell.partial{background:rgba(241,200,75,.12);border-color:var(--warn);color:var(--warn)}
.nav-cell.wrong{background:rgba(255,107,107,.12);border-color:var(--bad);color:var(--bad)}

/* Results */
.results{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-top:14px}
.results .result-head{text-align:center;padding:14px;border-radius:10px;margin-bottom:14px}
.results .result-head.pass{background:linear-gradient(135deg,rgba(63,208,122,.18),rgba(63,208,122,.06));border:1px solid var(--ok)}
.results .result-head.fail{background:linear-gradient(135deg,rgba(255,107,107,.18),rgba(255,107,107,.06));border:1px solid var(--bad)}
.results .result-head h2{margin:0;font-size:26px;letter-spacing:.05em}
.results .result-head .big{font-family:var(--mono);font-size:42px;margin:6px 0}
.results .result-head.pass h2{color:var(--ok)}
.results .result-head.fail h2{color:var(--bad)}
.results .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:14px 0}
.results .summary-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.results .summary-grid div b{display:block;font-size:22px;font-family:var(--mono)}
.results .summary-grid div span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.results h3{margin:14px 0 6px;font-size:15px;color:var(--accent)}
.per-exercise{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font-size:13px}
.per-exercise .pe-head{display:flex;align-items:center;gap:8px}
.per-exercise .pe-head .pe-num{font-family:var(--mono);color:var(--accent)}
.per-exercise .pe-head .pe-tag{font-size:10px;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--line2)}
.per-exercise .pe-head .pe-tag.full{color:var(--ok);border-color:var(--ok)}
.per-exercise .pe-head .pe-tag.partial{color:var(--warn);border-color:var(--warn)}
.per-exercise .pe-head .pe-tag.zero{color:var(--bad);border-color:var(--bad)}
.per-exercise .pe-head .pe-tag.skipped{color:var(--skip);border-color:var(--skip)}
.per-exercise .pe-head .pe-pts{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.per-exercise .pe-body{margin-top:6px;color:var(--muted);line-height:1.5}
.per-exercise .pe-body .qa{display:block;margin:3px 0;font-family:var(--mono);font-size:12px;color:var(--text)}
.per-exercise .pe-body .qa .key{color:var(--muted2)}
.per-exercise .pe-body .qa .your{color:var(--warn)}
.per-exercise .pe-body .qa .right{color:var(--ok)}
.per-exercise .pe-body .exp{margin-top:6px;color:var(--text)}

/* Responsive */
@media (max-width:720px){
  .match-grid{grid-template-columns:1fr}
  .exam-bar{position:static}
  .results .result-head .big{font-size:34px}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

<body>

<script>
window.__EXERCISES = [{"type": "qcm-multi", "theme": "Idle Resources & Sustainability", "scenario": "You are reviewing 4 EC2 instances flagged as 'low CPU'. Your manager warns that one of them runs a quarterly batch job. Pick every instance that is genuinely safe to terminate now. Note: today is mid-quarter, and the batch only runs in the last 3 days of each quarter.", "prompt": "Select ALL instances that are genuinely safe to terminate now (3 correct).", "options": [{"id": "A", "text": "i-aaa: CPU <5% for 30 days; CloudTrail shows no RunInstances calls; NetworkIn 0 bytes/day for 30 days."}, {"id": "B", "text": "i-bbb: CPU <5% for 30 days; tag 'role=batch-q-end' present; last invocation was 7 days ago."}, {"id": "C", "text": "i-ccc: CPU <5% for 30 days but is the standby replica of a multi-AZ RDS instance."}, {"id": "D", "text": "i-ddd: CPU <5% for 30 days; last user logon 11 months ago; no scheduled tasks attached."}], "correct": ["A", "D"], "explanation": "A is safe: no traffic, no API calls, sustained low CPU. D is also safe: no recent logon and no scheduled tasks. B is NOT safe despite low CPU: the tag suggests a quarter-end batch role, and 'last invocation 7 days ago' could be a normal idle window between runs. C is NOT safe: a standby replica is part of a multi-AZ RDS cluster and termination breaks the HA contract. Spotting these distinctions is what separates 'low CPU' from 'safe to terminate'.", "hint": "Two are clearly idle AND have no other purpose. Two have a hidden role you must respect."}, {"type": "dragdrop-categorize", "theme": "Pricing & Commitments", "scenario": "A new FinOps hire is sorting workloads into commitment buckets. Some of the workloads are traps: a workload that interrupts every 24 hours cannot use Spot, and a workload that needs a specific instance family fits Reserved Instances better than Savings Plans.", "prompt": "Drag each workload to the purchasing model that best fits it, paying attention to the trap conditions.", "buckets": ["Reserved Instances", "Savings Plans", "Spot Instances", "On-Demand"], "correct": {"Reserved Instances": ["Oracle database pinned to r5.2xlarge for 3 years"], "Savings Plans": ["Mixed microservices on Fargate, usage spread across 3 regions"], "Spot Instances": ["Genomics batch job that checkpoints every 5 minutes and can be re-queued"], "On-Demand": ["CI build agent that interrupts itself every 24 hours by design"]}, "explanation": "The Oracle DB is pinned to a specific family and size for 3 years: Reserved Instances are the best fit. Fargate microservices spread across regions: Savings Plans (which apply across family, size, OS, region, and Fargate) win. Genomics with checkpointing: Spot is ideal. The CI agent that interrupts itself every 24 hours is a trap: it sounds batch-like but its self-interruption could collide with Spot's two-minute warning, making On-Demand safer even though it is more expensive.", "hint": "One bucket is a trap because the workload already interrupts itself."}, {"type": "dragdrop-order", "theme": "Performance & Caching", "scenario": "At 03:00, an autoscaling group for a tier-3 service cascaded into a full outage. Put the incident-response steps in the right order.", "prompt": "Order the response steps from first action to last.", "items": ["Acknowledge the page in the on-call system", "Pull the last 60 minutes of CloudWatch alarms for the ASG", "Identify that the scale-in cooldown was set to 0", "Pause scale-in via the ASG suspend-actions call to stop the bleeding", "Restore capacity by setting the desired count to the pre-incident value", "File a post-incident review with the root cause and a cooldown-configuration change"], "correct": ["Acknowledge the page in the on-call system", "Pull the last 60 minutes of CloudWatch alarms for the ASG", "Identify that the scale-in cooldown was set to 0", "Pause scale-in via the ASG suspend-actions call to stop the bleeding", "Restore capacity by setting the desired count to the pre-incident value", "File a post-incident review with the root cause and a cooldown-configuration change"], "explanation": "Ack first so other responders know someone is on it. Then look at the alarms so you have evidence. Identify the root cause (the missing cooldown). Stop the bleeding by suspending scale-in. Restore capacity. Then write the post-incident review with the fix (set the cooldown) so it cannot recur.", "hint": "Ack, look, find cause, stop bleeding, restore, write up."}, {"type": "fillblank", "theme": "Monitoring & Observability", "scenario": "You are debugging a Lambda function. You need a CloudWatch Logs Insights query that filters for ERROR lines and shows the top 10 by timestamp. Complete the query.", "prompt": "Fill the blanks to complete the Logs Insights query.", "sentence": ["fields @timestamp, @message\n", " | ", " @message like /ERROR/\n", " | ", " 10\n", " | ", " @timestamp desc"], "correct": ["filter", "limit", "sort"], "alternatives": [["where"], ["top"], ["order by", "orderby"]], "distractors": ["grep", "head", "rank", "group", "SELECT"], "explanation": "CloudWatch Logs Insights syntax uses 'filter' (not 'where' or 'grep'), 'limit' (not 'head' or 'top'), and 'sort' (not 'order by'). The query selects fields, filters, limits to 10, and sorts newest first. SQL syntax does not apply here.", "hint": "Three keywords: a SQL-like filter, a count limit, and a sorter."}, {"type": "matching", "theme": "Storage Optimization", "scenario": "A storage architect asks you to match EBS volume types to workloads. Some options are deliberately close to each other; pick the best fit.", "prompt": "Match the volume type on the left to the workload on the right that fits best.", "pairs": [{"left": "io2 Block Express", "right": "Sub-millisecond OLTP database needing 256k IOPS and 99.999% durability"}, {"left": "io2 (standard)", "right": "Mission-critical database needing up to 64k IOPS but at lower cost than Block Express"}, {"left": "gp3", "right": "Boot volume of a stateless web server, baseline 3000 IOPS, tunable independently of size"}, {"left": "st1", "right": "Data-warehouse staging area that is sequential, throughput-bound, and accessed once a day"}], "explanation": "io2 Block Express is the top of the line, with the highest IOPS and durability. Plain io2 has lower IOPS ceiling but is cheaper. gp3 has independent IOPS / throughput tuning and is the default for most general-purpose workloads. st1 is for sequential, throughput-bound, infrequently-accessed data.", "hint": "Block Express > io2 > gp3 > st1 in performance; the reverse in price."}, {"type": "logviewer", "theme": "FinOps & Governance", "scenario": "A billing alarm fired at 14:00. You have three artefacts: VPC Flow Logs, CloudTrail events, and the billing alarm. Use the filter to look for 'RunInstances' or '203[.]0[.]113' or 'ALARM'. Select the lines that together explain the spike.", "prompt": "Select the lines that together explain the cost spike.", "lines": [{"id": 1, "ts": "2026-09-22 13:55:01", "sev": "info", "text": "CloudTrail: RunInstances by user 'data-migration-bot' at 13:55, instanceType=m5.24xlarge, count=4"}, {"id": 2, "ts": "2026-09-22 13:56:10", "sev": "info", "text": "CloudTrail: PutObject by 'data-migration-bot' to bucket 'migration-staging'"}, {"id": 3, "ts": "2026-09-22 13:58:30", "sev": "info", "text": "VPC Flow: 10[.]0[.]1[.]42 -> 203[.]0[.]113[.]55 443 12345678 4294967295 ACCEPT"}, {"id": 4, "ts": "2026-09-22 13:59:45", "sev": "info", "text": "CloudTrail: DetachVolume by 'platform-team' on vol-0abcd"}, {"id": 5, "ts": "2026-09-22 14:00:00", "sev": "crit", "text": "ALARM: billing-anomaly-state-change to ALARM at 14:00 (threshold breach)"}, {"id": 6, "ts": "2026-09-22 14:00:12", "sev": "info", "text": "CloudTrail: CreateBucket by 'data-migration-bot' named 'migration-staging-eu-west-1'"}], "correct": [1, 3, 5], "explanation": "Line 1 shows the data-migration-bot launching four m5.24xlarge instances (large continuous charge). Line 3 shows a large egress transfer from the VPC to a public IP, which is the egress cost driver. Line 5 is the alarm firing, which confirms the spike. The other lines are normal or unrelated operations.", "hint": "Find: who launched big instances, where traffic went, and the alarm trigger itself."}, {"type": "terminal", "theme": "Idle Resources & Sustainability", "scenario": "Operational goal: enumerate every unattached EBS volume in region eu-west-1 and report its size and type. No tool name or example is provided. Pick the right CLI/SDK command for your environment and produce the command.", "prompt": "Type the command that lists unattached EBS volumes in eu-west-1 with their size and type.", "intro": "$ ", "artefact": "", "accept": ["^aws\\s+ec2\\s+describe-volumes\\s+--region\\s+eu-west-1\\s+--filters\\s+Name=status,Values=available.*$", "^aws\\s+ec2\\s+describe-volumes\\s+--filters\\s+Name=status,Values=available.*--region\\s+eu-west-1.*$"], "explanation": "The describe-volumes API accepts a filter on 'status' with the value 'available' (which means not attached). You must also pass --region eu-west-1 to honour the constraint. Without the filter you get all volumes; without --region you get only the default region. Pipe to jq to extract VolumeId, Size, VolumeType.", "hint": "The describe-volumes API has a status filter with the value 'available'. You also need to specify the region."}, {"type": "spot-mistake", "theme": "Containers & Serverless", "scenario": "An HPA does not scale the deployment even though CPU is high. Click every line that is wrong in the manifest.", "prompt": "Select the lines that are wrong.", "lines": ["apiVersion: autoscaling/v2", "kind: HorizontalPodAutoscaler", "metadata:", "  name: web-hpa", "spec:", "  scaleTargetRef:", "    apiVersion: apps/v1", "    kind: Deployment", "    name: web", "  minReplicas: 2", "  maxReplicas: 10", "  metrics:", "  - type: Resource", "    resource:", "      name: cpu", "      target:", "        type: AverageValue", "        averageValue: 70"], "correct": [17, 18], "explanation": "Line 17 says type: AverageValue, but the next line gives averageValue: 70 (a percentage-like number). These two are inconsistent: AverageValue expects a quantity like '700m' (millicores), not a percentage. The intended configuration was type: Utilization with averageUtilization: 70. Without a cpu request on the container spec, even Utilization will not work, but the explicit bug visible in this manifest is the mismatched target type/value pair on lines 17 and 18.", "hint": "Look very carefully at lines 17 and 18. The 'type' and the field that follows it must match."}, {"type": "prioritize", "theme": "FinOps & Governance", "scenario": "You have 6 candidate optimizations. Each has a constraint that affects its safety. Rank them from safest-and-highest-ROI to riskiest-or-lowest-ROI.", "prompt": "Drag the items so the best ROI/safety trade-off is first and the worst is last.", "items": ["Switch 12 steady m5.2xlarge dev boxes to t3.medium (dev only, no SLA, high saving)", "Move 30 TB of audit logs from S3 Standard to Glacier Deep Archive (no SLA on retrieval, high saving)", "Right-size the primary RDS of a tier-3 service from r5.2xlarge to r5.large (CPU peak 60%, can failover to replica)", "Replace 8gp2 volumes with gp3 (drop-in, no SLA impact, medium saving)", "Switch the production database primary from On-Demand to a 1-year No-Upfront RI (commitment risk, high saving)", "Cut production ASG max from 50 to 30 to save capacity (peak observed was 41)"], "correct": ["Switch 12 steady m5.2xlarge dev boxes to t3.medium (dev only, no SLA, high saving)", "Move 30 TB of audit logs from S3 Standard to Glacier Deep Archive (no SLA on retrieval, high saving)", "Replace 8gp2 volumes with gp3 (drop-in, no SLA impact, medium saving)", "Right-size the primary RDS of a tier-3 service from r5.2xlarge to r5.large (CPU peak 60%, can failover to replica)", "Switch the production database primary from On-Demand to a 1-year No-Upfront RI (commitment risk, high saving)", "Cut production ASG max from 50 to 30 to save capacity (peak observed was 41)"], "explanation": "Dev right-sizing is the safest and highest ROI. Archive migration is also safe and high ROI. gp3 swap is safe but lower ROI. Right-sizing a primary with peak 60% is medium risk because the failover to replica adds complexity. Committing to a No-Upfront RI is high saving but locks you in for a year (commitment risk). Cutting ASG max below observed peak is the most dangerous: it will cause throttling the next time traffic spikes.", "hint": "Safest first, commitment and capacity risks last."}, {"type": "scenario-branching", "theme": "FinOps & Governance", "scenario": "You receive an alert: daily spend grew 22% overnight. The 'obvious' first step is misleading.", "prompt": "Make the right choice at each stage.", "stages": [{"q": "STAGE 1: The alert points at the EC2 service. The 'obvious' first step is to look at EC2 instances. What should you actually do FIRST?", "choices": [{"id": "A", "text": "Open Cost Explorer, group by 'Usage Type', and look for any new usage types appearing in the last 7 days."}, {"id": "B", "text": "List all EC2 instances and sort by launch time."}, {"id": "C", "text": "Immediately enable a SCP that blocks RunInstances."}, {"id": "D", "text": "Restart the CloudWatch agent on every host."}], "correct": "A"}, {"q": "STAGE 2: Cost Explorer reveals 'EU-DataTransfer-Out-Bytes' grew 400%. Where do you look next?", "choices": [{"id": "A", "text": "Pull VPC Flow Logs for the suspected window and group by destination IP and bytes-out."}, {"id": "B", "text": "Open a ticket asking every team if they downloaded something big."}, {"id": "C", "text": "Buy a Savings Plan for data transfer."}, {"id": "D", "text": "Disable CloudFront."}], "correct": "A"}, {"q": "STAGE 3: The flow logs show 5 TB transferred to a public IP over 8 hours from one instance. The instance belongs to a data-egress API. What is the right fix?", "choices": [{"id": "A", "text": "Put the API behind CloudFront and configure origin shield to reduce origin egress."}, {"id": "B", "text": "Block the IP in the security group and hope it does not come back."}, {"id": "C", "text": "Delete the API."}, {"id": "D", "text": "Move the instance to a different region."}], "correct": "A"}], "explanation": "Stage 1: the misleading 'obvious' step is to look at EC2 instances; the right first step is to look at usage types because the spike may not be EC2 compute at all. Stage 2: once you know it is data transfer, flow logs are the most direct evidence of where bytes went. Stage 3: the right fix is to put the API behind CloudFront so cache hits do not egress from your origin, dramatically cutting origin egress.", "hint": "First see which usage type grew. Then see where bytes went. Then fix the architecture, not the symptom."}, {"type": "dual-perspective", "theme": "Reliability & DR", "scenarioBlue": "Blue team view (resilience engineer): you operate a tier-3 multi-region service. Your SLO is 99.95% monthly availability. Pick the change that most directly improves resilience without exceeding budget.", "scenarioRed": "Red team view (chaos engineer): you are running a GameDay to break the same tier-3 service. Pick the test that most directly exposes a hidden weakness that an SLO dashboard would miss.", "qBlue": "Which change most directly improves resilience within budget?", "qRed": "Which test most directly exposes a hidden weakness?", "optionsBlue": [{"id": "A", "text": "Add a third AZ to the primary region's ASG and configure health-check-based target tracking."}, {"id": "B", "text": "Replace the Application Load Balancer with a Network Load Balancer."}, {"id": "C", "text": "Switch the database from Multi-AZ to Single-AZ to save cost."}, {"id": "D", "text": "Pre-warm the ASG every morning at 06:00 with a fixed desired count."}], "optionsRed": [{"id": "A", "text": "Disable the standby RDS replica for 10 minutes and verify the application fails over cleanly."}, {"id": "B", "text": "Cut all egress traffic to the internet for 30 seconds."}, {"id": "C", "text": "Inject 500 ms of latency between the application and the database, and watch the connection pool."}, {"id": "D", "text": "Reboot every EC2 instance at the same moment."}], "correct": {"blue": "A", "red": "C"}, "explanation": "Blue: adding a third AZ improves failure isolation and is usually within budget for a tier-3 service. Switching to NLB is rarely the right call for HTTP traffic. Single-AZ reduces resilience. Pre-warming helps with cold-start latency but does not improve steady-state resilience. Red: injecting latency between app and DB is a classic hidden weakness that an availability dashboard will not catch, but it directly tests connection-pool behaviour, retry storms, and backpressure. The other red tests are either destructive or too coarse to reveal a hidden weakness.", "hint": "Blue wants more failure domains without breaking the budget. Red wants a subtle stress that bypasses availability dashboards."}, {"type": "report-fill", "theme": "FinOps & Governance", "scenario": "The CFO's quarterly board report is due. Pick the right keywords for the executive summary.", "prompt": "Fill each blank with the keyword that makes the sentence accurate.", "sentence": ["Our Q3 unit cost dropped because we reduced ", " resources (idle for 60+ days) and committed to a Compute ", " across steady workloads in three regions. Going forward we will use ", " to forecast spend by team and alert on >20% week-over-week growth."], "correct": ["zombie", "Savings Plan", "Cost Anomaly Detection"], "alternatives": [["unused"], ["compute savings plan"], ["anomaly detection"]], "distractors": ["over-provisioned", "Reserved Instance", "Spot Instance", "CloudTrail", "CloudFront"], "explanation": "Zombie resources is the term for resources provisioned but not doing useful work, distinct from merely 'over-provisioned'. A Savings Plan applied to steady workloads across regions matches the commitment vehicle described. Cost Anomaly Detection is the AWS-native feature that alerts on week-over-week growth. Spot is not a commitment vehicle, and CloudTrail is for API activity, not spend forecasting.", "hint": "Pick the zombie word, the savings vehicle, and the AWS feature for spend alerts."}, {"type": "qcm-single", "theme": "Performance & Caching", "scenario": "Your workload has two patterns: predictable 10x spike every weekday at 09:00, AND an unpredictable 5x spike at quarter-end (3 days per quarter). Pick the autoscaling strategy that meets both patterns with the lowest cost and the best latency.", "prompt": "Which strategy is the best fit?", "options": [{"id": "A", "text": "A single target-tracking policy on ASGAverageCPUUtilization at 50%."}, {"id": "B", "text": "A scheduled action for the weekday 09:00 spike, a target-tracking policy for live load, and predictive scaling trained on 30 days of data to cover the quarter-end spike."}, {"id": "C", "text": "A single scheduled action for 09:00 every weekday; ignore quarter-end because it is rare."}, {"id": "D", "text": "A single step-scaling policy with three alarms."}], "correct": "B", "explanation": "B combines all three: scheduled for the known daily spike, target tracking for live load, and predictive scaling trained on enough history to catch the quarter-end spike. A single target-tracking policy reacts too slowly to the 09:00 spike. C ignores the quarter-end spike. D is more complex than needed and does not learn from history.", "hint": "The right answer uses three different mechanisms because the workload has three different patterns."}, {"type": "dragdrop-categorize", "theme": "Containers & Serverless", "scenario": "Drag each Kubernetes concept to what it constrains. Some pairs are very close; pick carefully.", "prompt": "Drag each concept to the bucket that describes what it constrains.", "buckets": ["Per-pod default limits", "Namespace total consumption", "Per-node scheduling", "Cluster node count"], "correct": {"Per-pod default limits": ["LimitRange"], "Namespace total consumption": ["ResourceQuota"], "Per-node scheduling": ["requests.cpu / requests.memory"], "Cluster node count": ["Cluster Autoscaler"]}, "explanation": "LimitRange sets per-pod defaults and min/max per container in a namespace. ResourceQuota bounds total CPU/memory/object counts for a whole namespace. requests are what the scheduler uses to place a pod on a node. Cluster Autoscaler adds or removes nodes from the cluster when pods cannot be scheduled.", "hint": "Two are per-pod/namespace, two are node/cluster level."}, {"type": "fillblank", "theme": "IaC & Automation", "scenario": "An external system (the autoscaler) modifies the desired-capacity of an ASG managed by Terraform. Without intervention, Terraform will revert the change on the next apply. Complete the lifecycle block so Terraform ignores that field.", "prompt": "Fill the two blanks so Terraform no longer drifts on desired_capacity.", "sentence": ["resource \"aws_autoscaling_group\" \"web\" {\n", "  desired_capacity = 4\n", "  ", " {\n", "    ", " = [\"desired_capacity\"]\n", "  }\n", "}"], "correct": ["lifecycle", "ignore_changes"], "alternatives": [["lifecycle_block"], ["ignore"]], "distractors": ["prevent_destroy", "depends_on", "count", "for_each"], "explanation": "The lifecycle block contains ignore_changes, which tells Terraform not to revert changes to listed attributes made outside of Terraform. prevent_destroy protects against deletion. depends_on controls ordering. count and for_each control resource multiplication. None of those solve the drift on desired_capacity.", "hint": "The block name is a Terraform reserved word, and the inner attribute is plural."}, {"type": "matching", "theme": "Reliability & DR", "scenario": "Match each AWS Support plan to its first-response-time SLA for a production-system-down case.", "prompt": "Match the support plan on the left to its first-response SLA on the right.", "pairs": [{"left": "Enterprise Support", "right": "15 minutes for production-down"}, {"left": "Business Support", "right": "1 hour for production-down"}, {"left": "Developer Support", "right": "12-24 hours, business hours only"}, {"left": "Basic Support (free)", "right": "No SLA, general guidance only"}], "explanation": "Enterprise Support commits to 15-minute first response for production-down. Business Support commits to 1 hour. Developer Support is aimed at non-production workloads and offers 12-24 hour response during business hours. Basic (free) has no SLA and provides only general guidance and account/billing support.", "hint": "More money = faster response, with the free tier offering none."}, {"type": "dragdrop-order", "theme": "Monitoring & Observability", "scenario": "A CPUUtilization alarm on an EC2 instance never fires even though you see CPU > 80%. Put the troubleshooting steps in the right order.", "prompt": "Order the steps from first to last.", "items": ["Confirm the metric namespace is AWS/EC2 and the metric name is CPUUtilization", "Verify the alarm period and threshold match the metric you see in the graph", "Check that the EC2 instance's IAM role or CloudWatch agent is actually publishing the metric", "Confirm there are at least N data points in the period (evaluation periods) so the alarm has enough evidence to fire", "Confirm the SNS topic the alarm publishes to has a subscription that has not been deleted"], "correct": ["Confirm the metric namespace is AWS/EC2 and the metric name is CPUUtilization", "Verify the alarm period and threshold match the metric you see in the graph", "Check that the EC2 instance's IAM role or CloudWatch agent is actually publishing the metric", "Confirm there are at least N data points in the period (evaluation periods) so the alarm has enough evidence to fire", "Confirm the SNS topic the alarm publishes to has a subscription that has not been deleted"], "explanation": "Work from the metric outward: first the metric name/namespace, then the period and threshold, then whether the metric is actually arriving, then whether the alarm has enough datapoints to evaluate, then whether the downstream SNS topic still has a live subscription. Skipping a step leads to false fixes.", "hint": "Metric name, threshold, metric arriving, datapoints, then downstream delivery."}, {"type": "qcm-multi", "theme": "Network & Data Transfer", "scenario": "You run a multi-region service with substantial traffic between regions. Pick every action that meaningfully reduces inter-region data transfer cost (3 correct).", "prompt": "Select ALL actions that reduce inter-region data transfer cost (3 correct).", "options": [{"id": "A", "text": "Use VPC endpoints (Gateway or Interface) for traffic to S3 and DynamoDB."}, {"id": "B", "text": "Put CloudFront in front of public-facing APIs and configure caching."}, {"id": "C", "text": "Compress API responses (gzip/brotli) before sending them cross-region."}, {"id": "D", "text": "Replace the Application Load Balancer with a Network Load Balancer."}], "correct": ["A", "B", "C"], "explanation": "A: VPC endpoints route S3/DynamoDB traffic over the AWS backbone, removing per-GB public egress charges. B: CloudFront caches at edge locations, which reduces origin-to-edge traffic. C: compression reduces bytes on the wire, which proportionally reduces transfer cost. D: switching ALB to NLB does not change transfer pricing; it only changes the L4 vs L7 feature set.", "hint": "Three reduce bytes on the wire or move traffic onto the AWS backbone; one does not."}, {"type": "logviewer", "theme": "FinOps & Governance", "scenario": "Cost Explorer shows an unexpected m5.24xlarge launched at 13:55. Use CloudTrail event history to identify who did it. Use the filter to look for 'RunInstances' or 'm5.24xlarge' or the username.", "prompt": "Select the line that shows who launched the oversized instance.", "lines": [{"id": 1, "ts": "2026-09-22 13:54:11", "sev": "info", "text": "EventName:DescribeInstances by user 'platform-team'"}, {"id": 2, "ts": "2026-09-22 13:55:01", "sev": "warn", "text": "EventName:RunInstances by user 'data-migration-bot' instanceType=m5.24xlarge count=4"}, {"id": 3, "ts": "2026-09-22 13:55:45", "sev": "info", "text": "EventName:CreateTags by user 'platform-team' on the new instances"}, {"id": 4, "ts": "2026-09-22 13:56:10", "sev": "info", "text": "EventName:PutObject by user 'data-migration-bot' to bucket 'migration-staging'"}, {"id": 5, "ts": "2026-09-22 13:57:33", "sev": "info", "text": "EventName:DescribeVolumes by user 'platform-team'"}, {"id": 6, "ts": "2026-09-22 13:58:30", "sev": "info", "text": "EventName:StartInstances by user 'data-migration-bot' on the new instances"}], "correct": [2, 6], "explanation": "Line 2 is the RunInstances call that provisions the m5.24xlarge instances, by the 'data-migration-bot' user. Line 6 shows the same user starting the instances shortly after. Together they prove that 'data-migration-bot' both launched and started the oversized instances. DescribeInstances and DescribeVolumes are read-only calls. CreateTags by 'platform-team' is suspicious but is not the provisioning event.", "hint": "Look for the RunInstances line and the user identity that follows it."}, {"type": "spot-mistake", "theme": "FinOps & Governance", "scenario": "An IAM policy is supposed to grant a junior engineer read-only access to Cost Explorer. Click every line that grants too much.", "prompt": "Select the lines that grant more than read-only Cost Explorer access.", "lines": ["{", "  \"Version\": \"2012-10-17\",", "  \"Statement\": [", "    {", "      \"Effect\": \"Allow\",", "      \"Action\": [", "        \"ce:*\",", "        \"aws-portal:*\",", "        \"iam:DeleteRole\"", "      ],", "      \"Resource\": \"*\"", "    }", "  ]", "}"], "correct": [6, 7, 8], "explanation": "Line 6 'ce:*' allows every Cost Explorer action including write actions like creating anomaly monitors. The correct verb would be 'ce:Get*' and 'ce:Describe*'. Line 7 'aws-portal:*' allows full billing console access including modifying payment methods. Line 8 'iam:DeleteRole' is completely unrelated to billing read access and grants destructive IAM permission. None of these belong in a read-only billing policy.", "hint": "Three lines grant more than read access. Look for the * wildcard and unrelated permissions."}, {"type": "prioritize", "theme": "Reliability & DR", "scenario": "You are choosing a DR strategy for a tier-2 service. Rank the options by RTO (Recovery Time Objective) from shortest to longest.", "prompt": "Drag the strategies so the shortest RTO is first and the longest is last.", "items": ["Multi-region active-active", "Warm standby (smaller pre-provisioned environment in second region)", "Pilot light (minimal core running, scale up on failover)", "Backup-and-restore (no running environment, restore from snapshot)"], "correct": ["Multi-region active-active", "Warm standby (smaller pre-provisioned environment in second region)", "Pilot light (minimal core running, scale up on failover)", "Backup-and-restore (no running environment, restore from snapshot)"], "explanation": "Active-active has the shortest RTO because traffic is already served from both regions. Warm standby has a pre-provisioned smaller environment, so failover is mostly a DNS switch and a scale-up. Pilot light has only the core running; you must scale up the rest on failover, which is slower. Backup-and-restore has the longest RTO because you must provision, restore, and configure from scratch.", "hint": "More running capacity in advance = shorter RTO."}, {"type": "scenario-branching", "theme": "Reliability & DR", "scenario": "You are choosing a DR strategy for a tier-2 e-commerce service. Make the right choice at each stage.", "prompt": "Make the right choice at each stage.", "stages": [{"q": "STAGE 1: Your SLO is RTO < 1 hour, RPO < 15 minutes. Which strategy is the cheapest that still meets both?", "choices": [{"id": "A", "text": "Multi-region active-active."}, {"id": "B", "text": "Warm standby in second region with a smaller footprint and continuous replication."}, {"id": "C", "text": "Pilot light with on-demand scale-up on failover."}, {"id": "D", "text": "Backup-and-restore from daily snapshots."}], "correct": "B"}, {"q": "STAGE 2: You pick warm standby. What is the most important thing to verify so that RTO < 1 hour holds in a real failover?", "choices": [{"id": "A", "text": "That the DNS TTL is short and that the standby is reachable from the primary's clients."}, {"id": "B", "text": "That the primary has more CPU than the standby."}, {"id": "C", "text": "That the standby has no IAM roles attached."}, {"id": "D", "text": "That the standby is in a different AWS account."}], "correct": "A"}, {"q": "STAGE 3: Six months later, your team is asked to reduce cost. Which is the safest cost reduction that does not break the DR SLO?", "choices": [{"id": "A", "text": "Switch the warm standby to a pilot light and accept a longer RTO."}, {"id": "B", "text": "Terminate the standby's RDS replica and rely on cross-region automated snapshots."}, {"id": "C", "text": "Use Spot Instances for the warm standby capacity."}, {"id": "D", "text": "Right-size the warm standby's EC2 instances and reduce the replica count, keeping the failover logic intact."}], "correct": "D"}], "explanation": "Stage 1: warm standby is the cheapest that still meets RTO < 1h and RPO < 15m. Active-active is more expensive than needed. Pilot light exceeds RTO. Backup-and-restore far exceeds RTO. Stage 2: DNS TTL and standby reachability are the most direct things to verify; without short TTL the failover cannot complete in 1 hour. Stage 3: right-sizing the standby's EC2 instances while keeping the failover logic is the only safe cost reduction. Switching to pilot light breaks RTO. Terminating the replica breaks RPO. Spot is unsafe for warm standby because interruption during failover is exactly when you cannot tolerate it.", "hint": "Pick the cheapest strategy that meets RTO/RPO, verify the things that actually gate the failover, and reduce cost without breaking either."}, {"type": "dual-perspective", "theme": "FinOps & Governance", "scenarioBlue": "Blue team view (FinOps analyst): someone keeps modifying cost-allocation tags in your AWS account. Pick the control that most directly detects and attributes the tampering.", "scenarioRed": "Red team view (assumed-breach pentester): you have credentials for a developer role that can call iam:PassRole and ec2:RunInstances. Pick the technique that most efficiently uses these to provision expensive resources without immediate tripping of the cost-anomaly alarm.", "qBlue": "Which control most directly detects cost-allocation tag tampering?", "qRed": "Which technique is the most efficient at hiding the spend from the cost-anomaly alarm?", "optionsBlue": [{"id": "A", "text": "Enable CloudTrail data events on S3 to log object-level changes."}, {"id": "B", "text": "Enable CloudTrail management events and create a metric filter on the CreateTags / DeleteTags API calls."}, {"id": "C", "text": "Add a Service Control Policy that blocks all tagging APIs."}, {"id": "D", "text": "Switch the account to a single shared role."}], "optionsRed": [{"id": "A", "text": "Launch many small t3.nano instances so the per-instance cost stays below the alarm threshold."}, {"id": "B", "text": "Use iam:PassRole to attach an admin role to a single EC2 instance, then launch an m5.24xlarge from that instance."}, {"id": "C", "text": "Launch a single m5.24xlarge with the developer's own credentials."}, {"id": "D", "text": "Use IAM users instead of roles to dodge CloudTrail."}], "correct": {"blue": "B", "red": "B"}, "explanation": "Blue: the most direct signal for tag tampering is a CloudTrail management event on CreateTags/DeleteTags, surfaced via a metric filter. CloudTrail data events on S3 detect object changes, not tag changes. Blocking all tagging breaks engineering. A shared role destroys attribution. Red: the most efficient stealth technique is to use iam:PassRole to attach an elevated role to a single EC2 instance, then launch the expensive resource from inside that instance — the expensive RunInstances call appears in CloudTrail as coming from the EC2 instance's role, not the developer role, which can defeat simple attribution.", "hint": "Blue wants the most direct CloudTrail signal on tagging APIs. Red wants to launder the action through a different identity."}, {"type": "report-fill", "theme": "Idle Resources & Sustainability", "scenario": "You are drafting the annual sustainability report. Complete it with the right keywords.", "prompt": "Fill each blank with the keyword that makes the sentence accurate.", "sentence": ["In 2026, we reduced our cloud ", " by 18% by right-sizing 240 EC2 instances and switching to ", " instances for batch workloads that tolerate interruption. We also moved 80 TB of infrequently-accessed data to S3 Glacier Deep ", " to lower the storage carbon footprint."], "correct": ["carbon footprint", "Spot", "Archive"], "alternatives": [["emissions"], ["spot"], ["Archive"]], "distractors": ["On-Demand", "Reserved", "IoT", "Lambda", "EKS"], "explanation": "Cloud carbon footprint is the standard term for the emissions associated with cloud compute, storage, and network. Spot instances enable idle capacity to be reused, which improves resource utilisation. Glacier Deep Archive is the storage class for long-term low-access data. The distractors are unrelated to sustainability.", "hint": "Pick the carbon phrase, the interruptible instance type, and the cold archive storage class."}, {"type": "qcm-single", "theme": "Idle Resources & Sustainability", "scenario": "Your CTO asked you the difference between an 'idle resource' and a 'zombie asset' in the cloud cost report.", "prompt": "Which statement most accurately distinguishes the two?", "options": [{"id": "A", "text": "An idle resource is using less than its allocated capacity; a zombie asset is provisioned but not used at all by any workload."}, {"id": "B", "text": "An idle resource is always an EC2 instance; a zombie asset is always an EBS volume."}, {"id": "C", "text": "An idle resource is the same thing as a zombie asset; the terms are interchangeable."}, {"id": "D", "text": "An idle resource is a misconfigured alert; a zombie asset is an unused IAM role."}], "correct": "A", "explanation": "An idle resource is one that is under-used (running but with low utilisation). A zombie asset is provisioned but not used at all by any workload — e.g. an EBS volume detached for 60 days, an Elastic IP not associated, or an EC2 instance nobody has logged into for a year. The distinction matters because the remediation differs: right-size for idle, terminate or release for zombie.", "hint": "Idle = working below capacity. Zombie = not working for anyone at all."}, {"type": "dragdrop-categorize", "theme": "FinOps & Governance", "scenario": "Map each FinOps Foundation principle to the concrete practice that exemplifies it.", "prompt": "Drag each practice to the FinOps principle it exemplifies.", "buckets": ["Accountability", "Visibility", "Optimization", "Governance"], "correct": {"Accountability": ["Chargeback by team tag to the engineering budget"], "Visibility": ["Real-time dashboards per team and per service"], "Optimization": ["Right-sizing and commitment management"], "Governance": ["Policy-as-code guardrails on spending"]}, "explanation": "Accountability is about engineering teams owning their spend (chargeback). Visibility is about surfacing spend to those teams in real time. Optimization is the act of reducing spend through right-sizing, commitments, and architecture. Governance is the policy layer that prevents regression.", "hint": "Each principle maps to a single verb: own, see, reduce, guard."}, {"type": "fillblank", "theme": "Storage Optimization", "scenario": "A bucket has objects with unknown access patterns. Complete the configuration sentence for Intelligent-Tiering.", "prompt": "Fill the two blanks to describe how Intelligent-Tiering behaves.", "sentence": ["S3 Intelligent-Tiering automatically moves objects that have not been accessed for ", " consecutive days to a lower-cost tier, and back to the frequent-access tier as soon as they are ", "."], "correct": ["30", "accessed"], "alternatives": [["thirty"], ["read", "retrieved"]], "distractors": ["7", "90", "180", "deleted", "encrypted"], "explanation": "Intelligent-Tiering monitors access patterns and moves objects not accessed for 30 consecutive days to the Infrequent Access tier. The moment the object is accessed again, it is moved back to the Frequent Access tier. There is no retrieval fee, only a small monitoring fee. The Archive tiers can also be enabled with longer thresholds (90 and 180 days).", "hint": "30 days without access triggers demotion; any access triggers promotion back."}, {"type": "matching", "theme": "Performance & Caching", "scenario": "Match each resilience pattern to the scenario where it most directly helps.", "prompt": "Match the pattern on the left to the scenario on the right where it most directly helps.", "pairs": [{"left": "Circuit breaker", "right": "Stop calling a failing downstream service until it recovers"}, {"left": "Bulkhead", "right": "Isolate one pool of resources from another so a failure in one does not exhaust the other"}, {"left": "Retry with exponential backoff", "right": "Recover from transient failures like a 503 from a dependency"}, {"left": "Rate limiter", "right": "Protect a downstream API from a traffic spike that would otherwise overload it"}], "explanation": "A circuit breaker stops calls to a failing service so it has time to recover. A bulkhead partitions resources so a failure in one partition does not consume the resources of another. Retry with exponential backoff is for transient errors. A rate limiter caps the rate of incoming requests so the downstream is not overwhelmed.", "hint": "Each pattern name suggests what it does; match the verb to the scenario."}, {"type": "terminal", "theme": "Idle Resources & Sustainability", "scenario": "Operational goal: identify every EC2 instance in the current region that has produced no CloudWatch metrics in the last 7 days, and save their instance IDs to a file. No tool name or example is provided. Produce the command.", "prompt": "Type the command (or pipe) that solves this goal.", "intro": "$ ", "artefact": "", "accept": ["^aws\\s+ec2\\s+describe-instances.*--query.*InstanceId.*$", "^aws\\s+ec2\\s+describe-instances.*--filters.*$", "^.*describe-instances.*--query.*InstanceId.*>\\s*.*\\.txt$", "^.*aws\\s+ec2\\s+describe-instances.*instance-state-name.*running.*\\|.*$"], "explanation": "There is no single AWS CLI flag that returns 'instances with no metrics in 7 days'. The right approach is a script: list running instances with describe-instances and a filter on instance-state-name=running, then query CloudWatch GetMetricStatistics for each over the last 7 days, and write the IDs of those with no data points to a file. The describe-instances call is the entry point; the CloudWatch metric check is the filter. Accepting any pipe that starts with describe-instances and writes to a file is fair because the script shape varies.", "hint": "Start from describe-instances with instance-state-name=running, then check CloudWatch GetMetricStatistics for each, and write to a file."}, {"type": "logviewer", "theme": "Storage Optimization", "scenario": "A $9,800 Glacier retrieval charge appeared in last month's bill. You have S3 access logs and CloudTrail. Use the filter to look for 'RestoreObject' or 'Glacier' or 'DEEP_ARCHIVE'. Select the lines that together explain the charge.", "prompt": "Select the lines that explain the bulk retrieval charge.", "lines": [{"id": 1, "ts": "2026-09-05 02:00:11", "sev": "info", "text": "S3 access: GET bucket='audit-logs' key='2024/09/01.log.gz' from 'backup-svc' IP 10[.]0[.]2[.]33"}, {"id": 2, "ts": "2026-09-05 02:00:30", "sev": "warn", "text": "CloudTrail: RestoreObject by 'backup-svc' on bucket 'audit-logs' key '2024/09/01.log.gz' Tier='Bulk' Days=7"}, {"id": 3, "ts": "2026-09-05 02:01:00", "sev": "info", "text": "S3 access: HEAD bucket='audit-logs' key='2024/09/01.log.gz'"}, {"id": 4, "ts": "2026-09-05 02:01:30", "sev": "warn", "text": "CloudTrail: RestoreObject by 'backup-svc' on bucket 'audit-logs' key='2024/09/02.log.gz' Tier='Bulk' Days=7"}, {"id": 5, "ts": "2026-09-05 02:02:00", "sev": "info", "text": "S3 access: GET bucket='app-config' key='feature-flags.json' from 'web-svc'"}, {"id": 6, "ts": "2026-09-05 02:02:30", "sev": "warn", "text": "CloudTrail: RestoreObject by 'backup-svc' on bucket 'audit-logs' key='2024/09/03.log.gz' Tier='Bulk' Days=7"}], "correct": [2, 4, 6], "explanation": "Lines 2, 4, and 6 are RestoreObject API calls in Bulk tier on objects stored in the audit-logs bucket. Bulk retrieval from Glacier (especially Deep Archive) is priced per-GB plus per-request; hundreds of such calls on multi-GB objects add up to thousands of dollars. The other lines are normal S3 reads of frequently-accessed objects. The remediation is to switch to Standard or Expedited retrieval for one-off needs, or to use S3 Batch Operations to plan bulk restores outside peak windows.", "hint": "Look for RestoreObject events in Bulk tier. There should be three."}];
