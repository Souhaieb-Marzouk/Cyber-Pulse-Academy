        sel.addEventListener('change', function () { st.ans[q.id][idx] = sel.value; touch(q.id); });
        txt.appendChild(sel);
      }
    })(slotN++);
  });
  box.appendChild(txt);
}

/* ============ renderers part B ============ */

/* ---------- terminal emulator ---------- */
function fsSim(d, cmd) {
  var m;
  if (/^\s*ls\b/.test(cmd)) return Object.keys(d.files || {}).join('\n');
  m = cmd.match(/^\s*cat\s+(\S+)\s*$/);
  if (m) return (d.files || {})[m[1]] != null ? d.files[m[1]] : 'cat: ' + m[1] + ': No such file';
  m = cmd.match(/^\s*tail\s+(?:-n\s*(\d+)|-(\d+))\s+(\S+)\s*$/);
  if (m) {
    var f = (d.files || {})[m[3]];
    if (f == null) return 'tail: ' + m[3] + ': No such file';
    var n = parseInt(m[1] || m[2], 10) || 10;
    return f.split('\n').slice(-n).join('\n');
  }
  m = cmd.match(/^\s*grep\s+((?:-[aiv]+\s+)*)(['"]?)(.*?)\2\s+(\S+)\s*$/);
  if (m) {
    var flags = m[1] || '';
    var ci = /i/.test(flags), cnt = /c/.test(flags), num = /n/.test(flags);
    var pat = m[3], file = m[4];
    var txt = (d.files || {})[file];
    if (txt == null) return 'grep: ' + file + ': No such file';
    var re; try { re = new RegExp(pat, ci ? 'i' : ''); } catch (e) { return 'grep: bad pattern'; }
    var lines = txt.split('\n'), out = [], ln = 0;
    lines.forEach(function (L) { ln++; if (re.test(L)) out.push((num ? ln + ':' : '') + L); });
    if (cnt) return String(out.length);
    return out.length ? out.join('\n') : '';
  }
  m = cmd.match(/^\s*wc\s+-l\s+(\S+)\s*$/);
  if (m) { var f2 = (d.files || {})[m[1]]; return f2 == null ? 'wc: no such file' : String(f2.split('\n').length); }
  return null;
}
R.terminal = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = []);
    var graded = view.mode === 'graded';
    var term = el('div', 'term');
    term.appendChild(h(el('div', 'thead'), (prep.banner || []).map(function (l) { return '<div>' + l.replace(/</g, '&lt;') + '</div>'; }).join('')));
    var hist = el('div', 'thist'); term.appendChild(hist);
    function echo(cmd, out, cls) {
      var line = el('div', null, '$ ' + cmd); hist.appendChild(line);
      if (out != null) hist.appendChild(h(el('div', cls || 'tout'), out.replace(/&/g, '&amp;').replace(/</g, '&lt;')));
      hist.scrollTop = hist.scrollHeight;
    }
    ans.forEach(function (c) { echo(c.cmd, c.out, c.cls); });
    if (!graded) {
      var fin = el('div', 'tin');
      fin.appendChild(el('span', 'ps', '$'));
      var inp = el('input'); inp.type = 'text'; inp.setAttribute('aria-label', 'Terminal command input'); inp.autocomplete = 'off'; inp.spellcheck = false;
      fin.appendChild(inp);
      var run = el('button', 'minibtn', 'Run'); run.type = 'button';
      fin.appendChild(run); term.appendChild(fin);
      function exec() {
        var cmd = inp.value.trim();
        if (!cmd) return;
        inp.value = '';
        var out = null, cls = 'tout';
        var sim = fsSim(prep, cmd);
        for (var i = 0; i < prep.out.length && sim == null; i++) if (prep.out[i].re.test(cmd)) { sim = prep.out[i].out; break; }
        if (sim == null && /^\s*clear\s*$/i.test(cmd)) { ans.push({ cmd: cmd, out: null }); touch(q.id); hist.innerHTML = ''; return; }
        if (sim == null) { sim = 'sh: command not found: ' + cmd.split(' ')[0]; cls = 'terr'; }
        ans.push({ cmd: cmd, out: sim, cls: cls });
        touch(q.id);
        echo(cmd, sim, cls);
      }
      run.addEventListener('click', exec);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') exec(); });
    }
    box.appendChild(term);
    if (graded) {
      var list = el('div', 'cmdlist');
      prep.req.forEach(function (rq, i) {
        var okCmd = (st.ans[q.id] || []).filter(function (c) { return rq.re.test(c.cmd); })[0];
        var d = el('div', 'cmdline ' + (okCmd ? 'ok' : 'bad'));
        d.appendChild(el('span', 'markic ' + (okCmd ? 'ok' : 'bad'), okCmd ? '✓ MET' : '✗ NOT MET'));
        d.appendChild(el('span', null, 'Requirement ' + (i + 1) + (rq.note ? ': ' + rq.note : '') + (okCmd ? '' : rq.ex ? ' — e.g. ' + rq.ex : '')));
        list.appendChild(d);
      });
      box.appendChild(list);
    }
  },
  grade: function (q, prep) {
    var cmds = (st.ans[q.id] || []).map(function (c) { return c.cmd; });
    var ok = 0;
    prep.req.forEach(function (rq) { if (cmds.some(function (c) { return rq.re.test(c); })) ok++; });
    return { n: prep.req.length, ok: ok, mark: {} };
  },
  isEmpty: function (q) { return !(st.ans[q.id] || []).length; },
  userHtml: function (q) {
    var a = st.ans[q.id] || [];
    return a.length ? '<div class="cmdlist">' + a.map(function (c) { return '<div class="cmdline"><code>' + c.cmd.replace(/</g, '&lt;') + '</code></div>'; }).join('') + '</div>' : '<p>—</p>';
  },
  correctHtml: function (q, prep) {
    return '<ul>' + prep.req.map(function (r) { return '<li>' + (r.note ? r.note + ' — ' : '') + '<code>' + r.ex + '</code></li>'; }).join('') + '</ul>';
  }
};

/* ---------- log viewer ---------- */
function logLines(prep, filter, gradedCls) {
  var f = (filter || '').trim();
  var re = null;
  if (f.length > 1 && f.charAt(0) === '/' && f.charAt(f.length - 1) === '/') {
    try { re = new RegExp(f.slice(1, -1), 'i'); } catch (e) { re = null; }
  }
  var wrap = el('div', 'logblk');
  prep.log.forEach(function (L) {
    var match = !f || (re ? re.test(L.t) : L.t.toLowerCase().indexOf(f.toLowerCase()) >= 0);
    if (!match) return;
    var cls = 'ln ' + (L.c || '') + (gradedCls || '');
    var d = el('div', cls, L.t);
    wrap.appendChild(d);
  });
  return wrap;
}
R.logview = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = { f: '' });
    var tools = el('div', 'logtools');
    tools.appendChild(el('span', 'dznote', 'Filter:'));
    var inp = el('input'); inp.type = 'text'; inp.placeholder = 'text or /regex/  — e.g. error or /probe/i'; inp.value = ans.f;
    inp.setAttribute('aria-label', 'Log filter');
    tools.appendChild(inp); box.appendChild(tools);
    var holder = el('div'); box.appendChild(holder);
    function redraw() { holder.innerHTML = ''; holder.appendChild(logLines(prep, ans.f)); }
    redraw();
    inp.addEventListener('input', function () { ans.f = inp.value; touch(q.id); redraw(); });
    var tbox = el('div'); tbox.appendChild(el('span', 'blabel', 'YOUR ANSWER'));
    box.appendChild(tbox);
    var innerView = view.mode === 'graded' ? { mode: 'graded', res: view.res } : { mode: 'answer' };
    R[prep.taskType].render(tbox, shQ(q), prep.task, innerView);
  },
  grade: function (q, prep) { return R[prep.taskType].grade(shQ(q), prep.task); },
  isEmpty: function (q, prep) { return R[prep.taskType].isEmpty(shQ(q), prep.task); },
  userHtml: function (q, prep) { return R[prep.taskType].userHtml(shQ(q), prep.task); },
  correctHtml: function (q, prep) { return R[prep.taskType].correctHtml(shQ(q), prep.task); }
};
function shQ(q) { return Object.assign({}, q, { id: q.id + '::task' }); }

/* ---------- branching scenario ---------- */
R.branch = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = []);
    var graded = view.mode === 'graded';
    var wrap = el('div');
    if (ans.length) {
      var dl = el('div', 'decisions'); dl.appendChild(el('span', 'blabel', 'YOUR DECISIONS SO FAR'));
      ans.forEach(function (d, i) {
        var dd = el('div', 'decision' + (graded ? (view.res.mark[i] === 'ok' ? ' ok' : ' bad') : ''));
        dd.appendChild(el('b', null, 'Step ' + (i + 1) + ': ' + prep.nodes[d.node].choices[d.ci].t));
        if (graded) {
          var okm = view.res.mark[i] === 'ok';
          dd.appendChild(el('span', 'markic ' + (okm ? 'ok' : 'bad'), okm ? '✓ GOOD CALL' : '✗ NOT THE BEST CALL'));
          var fb = prep.nodes[d.node].choices[d.ci].fb;
          if (fb) dd.appendChild(h(el('div', 'rctx'), fb));
        }
        dl.appendChild(dd);
      });
      wrap.appendChild(dl);
    }
    var node = ans.length ? walkEnd(prep, ans) : prep.start;
    var nd = prep.nodes[node];
    if (nd && nd.end) {
      wrap.appendChild(h(el('div', 'box quest'), '<span class="blabel">END OF SCENARIO</span><p>' + nd.scene + '</p><p class="dznote">Press Check to see how your calls score against the best path.</p>'));
    } else if (nd) {
      var sc = el('div', 'box scen'); sc.appendChild(el('span', 'blabel', 'STEP ' + (ans.length + 1)));
      h(sc, sc.innerHTML + '<p>' + nd.scene + '</p>');
      wrap.appendChild(sc);
      var chs = el('div', 'choices');
      nd.choices.forEach(function (c, ci) {
        var b = el('button', 'choice', c.t); b.type = 'button';
        b.addEventListener('click', function () {
          st.ans[q.id].push({ node: node, ci: ci });
          touch(q.id);
          st._refocusSel = '.choices button.choice';
          renderQuestion();
        });
        chs.appendChild(b);
      });
      wrap.appendChild(chs);
      if (ans.length) {
        var rst = el('button', 'abtn warn', '⟲ Restart this scenario'); rst.type = 'button';
        rst.addEventListener('click', function () { st.ans[q.id] = []; touch(q.id); renderQuestion(); });
        wrap.appendChild(rst);
      }
    }
    box.appendChild(wrap);
  },
  grade: function (q, prep) {
    var ans = st.ans[q.id] || [], mark = {}, ok = 0, n = prep.maxDepth || ans.length || 1;
    ans.forEach(function (d, i) {
      var c = prep.nodes[d.node].choices[d.ci];
      if (c.ok) { mark[i] = 'ok'; ok++; } else mark[i] = 'bad';
    });
    return { n: n, ok: ok, mark: mark };
  },
  isEmpty: function (q) { return !(st.ans[q.id] || []).length; },
  userHtml: function (q, prep) {
    var ans = st.ans[q.id] || [];
    return ans.length ? '<ol>' + ans.map(function (d) { return '<li>' + prep.nodes[d.node].choices[d.ci].t + '</li>'; }).join('') + '</ol>' : '<p>—</p>';
  },
  correctHtml: function (q, prep) {
    var path = bestPath(prep);
    return '<ol>' + path.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>';
  }
};
function walkEnd(prep, ans) {
  var node = prep.start;
  for (var i = 0; i < ans.length; i++) {
    var c = prep.nodes[node].choices[ans[i].ci];
    if (!c || !c.next) return null;
    node = c.next;
  }
  return node;
}
function bestPath(prep) {
  var out = [], node = prep.start, guard = 0;
  while (node && guard++ < 8) {
    var nd = prep.nodes[node];
    if (!nd || !nd.choices) break;
    var good = nd.choices.filter(function (c) { return c.ok; })[0];
    if (!good) break;
    out.push(good.t);
    node = good.next;
  }
  return out;
}

/* ---------- spot the mistake ---------- */
R.spot = {
  render: function (box, q, prep, view) {
    var ans = st.ans[q.id] || (st.ans[q.id] = []);
    var graded = view.mode === 'graded';
    var pre = el('div', 'codeblk');
    pre.setAttribute('role', 'group');
    prep.lines.forEach(function (L, i) {
      var b = el('button', 'cl'); b.type = 'button'; b.id = 'spot-' + q.id + '-' + i;
      b.appendChild(el('span', 'lno', String(i + 1)));
      b.appendChild(el('span', null, L));
      var sel = ans.indexOf(i) >= 0;
      if (graded) {
        var m = view.res.mark[i];
        if (m === 'ok') { b.classList.add('ok'); b.appendChild(el('span', 'markic ok', '✓ PROBLEM')); }
        else if (m === 'bad') { b.classList.add('bad'); b.appendChild(el('span', 'markic bad', '✗ NO PROBLEM HERE')); }
        else if (m === 'missed') { b.classList.add('missed'); b.appendChild(el('span', 'markic missed', 'MISSED PROBLEM')); }
        else b.classList.add('plain');
        b.disabled = m === undefined || m == null ? true : b.disabled;
        if (m == null) b.classList.add('plain');
      } else {
        b.setAttribute('aria-pressed', sel ? 'true' : 'false');
        if (sel) b.setAttribute('aria-pressed', 'true');
        b.addEventListener('click', function () {
          st._refocusSel = '#spot-' + q.id + '-' + i;
          var a = st.ans[q.id], ix = a.indexOf(i);
          if (ix >= 0) a.splice(ix, 1);
          else if (a.length < prep.correct.length) a.push(i);
          else toast('You can select at most ' + prep.correct.length + ' lines — there are exactly that many problems.');
          touch(q.id); renderQuestion();
        });
      }
      pre.appendChild(b);
    });
    box.appendChild(pre);
    if (!graded) {
      var left = prep.correct.length - ans.length;
      box.appendChild(el('p', 'dznote', 'Selected ' + ans.length + ' of ' + prep.correct.length + ' problem lines.' + (left > 0 ? ' ' + left + ' still to find.' : ' All found — Check when ready.')));
    }
  },
  grade: function (q, prep) {
    var ans = st.ans[q.id] || [], mark = {}, ok = 0;
    prep.lines.forEach(function (_, i) { mark[i] = null; });
    prep.correct.forEach(function (i) {
      if (ans.indexOf(i) >= 0) { mark[i] = 'ok'; ok++; } else mark[i] = 'missed';
    });
    ans.forEach(function (i) { if (prep.correct.indexOf(i) < 0) mark[i] = 'bad'; });
    return { n: prep.correct.length, ok: ok, mark: mark };
  },
  isEmpty: function (q) { return !(st.ans[q.id] || []).length; },
  userHtml: function (q, prep) {
    var ans = st.ans[q.id] || [];
    return ans.length ? '<ul>' + ans.map(function (i) { return '<li>line ' + (i + 1) + ': <code>' + prep.lines[i].replace(/</g, '&lt;') + '</code></li>'; }).join('') + '</ul>' : '<p>—</p>';
  },
  correctHtml: function (q, prep) {
    return '<ul>' + prep.correct.map(function (i) { return '<li>line ' + (i + 1) + ': <code>' + prep.lines[i].replace(/</g, '&lt;') + '</code></li>'; }).join('') + '</ul>';
  }
};

})();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
