<script>
window.__EXAM__ = {"topicId": "cloud-plus", "chapter": 5.3, "title": "5.3 CI/CD Pipelines — MEDIUM", "shortTitle": "Cloud+ 5.3 · CI/CD Pipelines · MEDIUM", "severity": "medium", "sevLabel": "MEDIUM", "examTitle": "CI/CD Pipelines — MEDIUM practice exam", "certName": "Cloud+ 5.3 CI/CD Pipelines — MEDIUM", "minutes": 75, "passMark": 70, "intro": "<p>This exam covers <b>CompTIA Cloud+ (CV0-004) objective 5.3 — CI/CD pipelines<\/b>: building and managing continuous integration / continuous deployment pipelines. You work through 30 realistic exercises at <b>MEDIUM severity<\/b> as a platform engineer at NimbusCart: pipeline ordering, build log triage, deployment strategy decisions, terminal work, pipeline security and delivery metrics. Exercises need real reasoning, but a prepared candidate can solve each one in a few minutes.<\/p><p>Exercise types you will meet: multiple choice, multi-select, per-row choices, drag &amp; drop categories, matching, ordering / ranking, fill-in-the-blank with word bank or dropdowns, a log viewer with filter, branching decision scenarios, spot-the-mistake code review, and two guided terminal exercises (the command family is named for you).<\/p>", "themes": [{"name": "1. Integration & version control", "kws": [["ci", "Continuous Integration (CI)"], ["cdel", "Continuous Delivery"], ["cdep", "Continuous Deployment"], ["pipe", "Pipeline"], ["build", "Build"], ["artifact", "Artifact"], ["artifrepo", "Artifact repository"], ["vcs", "Version control"], ["pr", "Pull request"], ["trunk", "Trunk-based development"]]}, {"name": "2. Pipeline stages & gates", "kws": [["buildstage", "Build stage"], ["unittest", "Unit test"], ["inttest", "Integration test"], ["smoke", "Smoke test"], ["qgate", "Quality gate"], ["agate", "Approval gate"], ["staging", "Staging environment"], ["rollback", "Rollback"]]}, {"name": "3. Deployment strategies", "kws": [["bluegreen", "Blue-green deployment"], ["canary", "Canary release"], ["rolling", "Rolling deployment"], ["featflag", "Feature flag"], ["health", "Health check"]]}, {"name": "4. Tools & ecosystem", "kws": [["jenkins", "Jenkins"], ["gitlabci", "GitLab CI"], ["ghactions", "GitHub Actions"], ["terraform", "Terraform"], ["ansible", "Ansible"], ["docker", "Docker"], ["k8s", "Kubernetes"], ["helm", "Helm"], ["sonar", "SonarQube"], ["argocd", "Argo CD"]]}, {"name": "5. Pipeline configuration", "kws": [["pascode", "Pipeline as code"], ["webhook", "Webhook trigger"], ["runner", "Runner / agent"], ["secrets", "Secrets management"], ["envvar", "Environment variables"], ["parallel", "Parallel jobs"]]}, {"name": "6. Testing & quality", "kws": [["sast", "SAST"], ["dast", "DAST"], ["sca", "SCA (dependency scanning)"], ["imgscan", "Container image scanning"], ["regression", "Regression testing"], ["coverage", "Test coverage"], ["shiftleft", "Shift-left"]]}, {"name": "7. Environments & IaC", "kws": [["iac", "Infrastructure as Code"], ["drift", "Configuration drift"], ["immutable", "Immutable infrastructure"], ["ephemeral", "Ephemeral environment"], ["gitops", "GitOps"], ["parity", "Environment parity"]]}, {"name": "8. Metrics & governance", "kws": [["depfreq", "Deployment frequency"], ["leadtime", "Lead time for changes"], ["cfr", "Change failure rate"], ["mttr", "MTTR (time to restore)"], ["leastpriv", "Least privilege"], ["signing", "Signed artifacts"]]}], "questions": [{"id": "m01", "type": "categorize", "points": 4, "title": "CI, Continuous Delivery or Continuous Deployment?", "tags": ["Continuous Integration (CI)", "Continuous Delivery", "Continuous Deployment", "Pipeline"], "scenario": "<p>You join <b>NimbusCart<\/b>, an online-store company. The platform team keeps a one-page onboarding note that mixes up the three practices. Maya, the platform lead, asks you to sort it out before your first on-call shift.<\/p>", "question": "<p>Drag each statement to the practice it describes. Every statement belongs to exactly one bucket.<\/p>", "hint": "Continuous Delivery still has ONE manual step (the release decision). Continuous Deployment has none. CI is about merging and testing often.", "explain": "<p><b>Continuous Integration (CI)<\/b> means developers merge small changes into a shared main branch often, and every push triggers an automatic build and tests. It finds broken merges in minutes.<\/p><p><b>Continuous Delivery<\/b> keeps the pipeline automatic up to production, but a human decides WHEN to release. Artifacts are always ready.<\/p><p><b>Continuous Deployment<\/b> removes even that click: every change that passes the gates reaches production automatically.<\/p><p class='tip'>Focus next on: the location of the last manual step. That is the whole difference.<\/p>", "data": {"buckets": [{"id": "ci", "label": "Continuous Integration"}, {"id": "cdel", "label": "Continuous Delivery"}, {"id": "cdep", "label": "Continuous Deployment"}], "items": [{"id": "i1", "t": "Every merge to main triggers an automatic build and unit tests", "bucket": "ci"}, {"id": "i2", "t": "Developers merge small changes into main many times a day", "bucket": "ci"}, {"id": "i3", "t": "Broken merges are found within minutes because builds run on every push", "bucket": "ci"}, {"id": "i4", "t": "The pipeline stops before production and waits for a release manager to approve", "bucket": "cdel"}, {"id": "i5", "t": "Artifacts are always ready to release, but a human decides when", "bucket": "cdel"}, {"id": "i6", "t": "Every change that passes the gates is deployed to production automatically", "bucket": "cdep"}, {"id": "i7", "t": "Production releases happen several times a day with no release ticket", "bucket": "cdep"}, {"id": "i8", "t": "The last pipeline stage needs no human click", "bucket": "cdep"}]}}, {"id": "m02", "type": "order", "points": 4, "title": "Put the cart-api pipeline stages in order", "tags": ["Pipeline", "Build stage", "Unit test", "Smoke test", "Quality gate", "Approval gate", "Staging environment", "Artifact repository"], "scenario": "<p>NimbusCart created a new pipeline for the <code>cart-api<\/code> service. A review comment says the stage order in the draft is wrong. The stages must run from commit to production in a safe order.<\/p>", "question": "<p>Put the eight pipeline stages into the order they should run.<\/p>", "hint": "You cannot test a package that does not exist yet. The approval gate sits right before production.", "explain": "<p>A safe order is: <b>Source<\/b> (check out the commit) → <b>Build and unit test<\/b> (fail fast on broken code) → <b>Static analysis quality gate<\/b> (SonarQube checks code quality) → <b>Package<\/b> (build the Docker image and push it to Artifactory) → <b>Deploy to staging<\/b> → <b>Smoke test<\/b> (does the deployed app start and serve?) → <b>Approval gate<\/b> → <b>Deploy to production<\/b>.<\/p><p>Each stage only runs when the previous one passed, so cheap and fast checks come first. Expensive environment work and human time come last.<\/p><p class='tip'>Focus next on: why tests run before packaging — you do not want to spend time packaging code that does not work.<\/p>", "data": {"items": [{"id": "s1", "t": "Source — check out commit 9f3c2e1 from main"}, {"id": "s2", "t": "Build — compile and run unit tests"}, {"id": "s3", "t": "Quality gate — SonarQube static analysis pass"}, {"id": "s4", "t": "Package — build Docker image, push to Artifactory"}, {"id": "s5", "t": "Deploy to staging environment"}, {"id": "s6", "t": "Smoke test — basic flows against staging"}, {"id": "s7", "t": "Approval gate — release manager signs off"}, {"id": "s8", "t": "Deploy to production"}]}}, {"id": "m03", "type": "qcm", "points": 3, "title": "The quality gate blocks the merge request", "tags": ["Quality gate", "SonarQube", "SAST", "Pull request", "Shift-left"], "scenario": "<p>Merge request <code>!221<\/code> for <code>checkout-service<\/code> runs the pipeline. The <b>Quality Gate<\/b> stage fails: SonarQube reports test coverage of <b>41%<\/b> (the gate requires 80%) and <b>2 new blocker issues<\/b> found by static analysis (SAST). The author pings you: &quot;Can we just merge? Staging will catch it.&quot;<\/p>", "question": "<p>What is the correct next step?<\/p>", "hint": "The gate exists to be passed by better code — not to be lowered or skipped.", "explain": "<p>The right move is to <b>add tests and fix the two blocker issues, then re-run the pipeline<\/b>. A quality gate defines the minimum quality a change must reach: coverage of new code and no new critical findings from static analysis (SAST). This is shift-left: catching problems at the merge request, where fixing is cheapest.<\/p><p>Lowering the threshold to 41% destroys the gate's meaning. Skipping the stage hides known problems. Staging tests are not a replacement for the gate — they catch different things, later and more expensively.<\/p><p class='tip'>Focus next on: a gate is a rule, not a suggestion. Fix the code, never the rule.<\/p>", "data": {"options": [{"t": "Lower the coverage threshold to 40% so the gate passes, then merge", "ok": false}, {"t": "Add tests and fix the two blocker issues, then re-run the pipeline", "ok": true}, {"t": "Skip the Quality Gate stage with a flag and merge immediately", "ok": false}, {"t": "Merge anyway and let the staging smoke tests catch the problems", "ok": false}]}}, {"id": "m04", "type": "fill", "points": 4, "title": "Complete the legacy Jenkinsfile", "tags": ["Jenkins", "Pipeline as code", "Runner / agent", "Parallel jobs", "Secrets management"], "scenario": "<p>NimbusCart runs most services on GitLab CI, but the old <code>billing<\/code> service still builds on a Jenkins server. Its <code>Jenkinsfile<\/code> lost four words in a bad merge. You are asked to repair it.<\/p>", "question": "<p>Fill the four blanks from the word bank so the Jenkinsfile makes sense again.<\/p>", "hint": "agent = where the job runs. stages = the list of stages. parallel = at the same time. credentials = where secrets come from.", "explain": "<p>A <code>Jenkinsfile<\/code> stores the pipeline <b>as code<\/b> inside the repository, so the pipeline itself is version-controlled and reviewed. The <code>agent<\/code> block chooses the <b>runner<\/b> (the machine) that executes the job — here the label <code>build-node<\/code>.<\/p><p>The <code>stages<\/code> block holds the ordered stages. A <code>parallel<\/code> block runs child stages at the same time, which shortens the build. Secrets such as API keys must come from Jenkins <code>credentials<\/code> (the built-in secrets store), never from plain text in the file — anything in Git can be read by everyone with repo access.<\/p><p class='tip'>Focus next on: pipeline as code means the pipeline definition gets the same review and history as application code.<\/p>", "data": {"mode": "bank", "parts": ["<pre>pipeline {\n  ___ { label 'build-node' }   // 1. where the job runs\n  ___ {                        // 2. holds all stages\n    stage('Build') { steps { sh 'mvn package' } }\n    stage('Test')  { steps { sh 'mvn test' } }\n    ___ {                        // 3. run Lint and Scan at once\n      parallel {\n        stage('Lint') { steps { sh 'mvn checkstyle:check' } }\n        stage('Scan') { steps { sh 'mvn sonar:sonar' } }\n      }\n    }\n  }\n}<\/pre>", {"a": "agent"}, {"a": "stages"}, {"a": "parallel"}, "<p>One rule for the team: API keys used by this job must come from Jenkins <b>___<\/b> (4. never from text written inside this file).<\/p>", {"a": "credentials"}], "bank": ["agent", "stages", "parallel", "credentials", "deploy", "master"]}}, {"id": "m05", "type": "logview", "points": 4, "title": "Read the failed build log", "tags": ["Unit test", "Build stage", "Pipeline"], "scenario": "<p>Pipeline <code>#847<\/code> for <code>cart-api<\/code> failed on the default branch. Maya forwards you the raw <code>unit_tests<\/code> job log and asks what happened.<\/p>", "question": "<p>Use the filter box if it helps, then select the TWO true statements.<\/p>", "hint": "Read the ERROR lines: one shows expected vs actual values, the summary line counts failures.", "explain": "<p>The job failed in the <b>unit test stage<\/b>. The line <code>expected:&lt;47.50&gt; but was:&lt;52.00&gt;<\/code> means the discount logic produced a wrong total — the code returned a larger amount than the test expects. Two unit tests failed (214 passed), so Maven exited with an error and the job stopped before packaging or deploying.<\/p><p>The log shows nothing about Docker images, disk space or runners failing — those are distractors. Nothing reached staging: the pipeline stopped at the first broken stage.<\/p><p class='tip'>Focus next on: read the assertion message as expected-vs-actual, and always check at which stage the log ends.<\/p>", "data": {"log": [{"t": "Running with gitlab-runner 16.9.1 (runner-4a2, 10[.]20[.]1[.]45)", "c": "dim"}, {"t": "Getting source from Git repository 09:12:04", "c": "dim"}, {"t": "$ mvn test -pl checkout-service"}, {"t": "[INFO] Building checkout-service 2.4.1"}, {"t": "[INFO] --- maven-surefire-plugin:3.2.5:test ---"}, {"t": "[INFO] T E S T S"}, {"t": "[ERROR] CartTotalTest.testDiscountStacking: expected:<47.50> but was:<52.00>", "c": "err"}, {"t": "[ERROR] CartTotalTest.testEmptyCart: expected:<0.00> but was:<null>", "c": "err"}, {"t": "[INFO] Tests run: 216, Failures: 2, Errors: 0, Skipped: 0"}, {"t": "[INFO] 214 tests passed, 2 tests failed", "c": "warn"}, {"t": "[ERROR] Failed to execute goal: There are test failures.", "c": "err"}, {"t": "ERROR: Job failed: exit code 1", "c": "err"}], "task": {"type": "multi", "options": [{"t": "The pipeline failed in the unit test stage of the build", "ok": true}, {"t": "The discount logic returned a wrong total (52.00 instead of 47.50)", "ok": true}, {"t": "A Docker image could not be pulled from the registry", "ok": false}, {"t": "The runner ran out of disk space", "ok": false}, {"t": "All 216 tests passed, so the failure is flaky", "ok": false}]}}}, {"id": "m06", "type": "rowselect", "points": 3, "title": "Which trigger started each pipeline?", "tags": ["Webhook trigger", "Pipeline", "Pipeline as code"], "scenario": "<p>The <code>#deploys<\/code> channel shows five pipeline events from the last day. NimbusCart pipelines are defined as code, and each run was started by a different kind of trigger. As the on-call trainee you must be able to tell them apart.<\/p>", "question": "<p>For each event, pick the trigger type that started the pipeline.<\/p>", "hint": "No push and an exact fixed time (02:00) means a schedule. A run started by a person is manual.", "explain": "<p>Pipelines are started by <b>events<\/b>: a <code>git push<\/code> fires a <b>webhook<\/b> that tells the CI system to run; opening or updating a merge request is also an event; a <b>nightly schedule<\/b> (cron) runs with no push at a fixed time; pushing a <b>tag<\/b> like <code>v2.5.0<\/code> often starts a release pipeline; and a <b>manual<\/b> run starts when a person clicks a button.<\/p><p>Knowing the trigger tells you what changed: a push pipeline means new code, a schedule means the same code re-tested, a manual run means someone chose to run it.<\/p><p class='tip'>Focus next on: time-based vs event-based vs human-based triggers.<\/p>", "data": {"rows": [{"label": "Pipeline #812 started 2 seconds after Maya pushed commit 9f3c2e1 to main", "ctx": "", "options": [{"t": "Push webhook on main", "ok": true}, {"t": "Nightly schedule", "ok": false}, {"t": "Manual run", "ok": false}]}, {"label": "Pipeline #813 started at exactly 02:00 with no new commit since 18:40", "ctx": "", "options": [{"t": "Tag push", "ok": false}, {"t": "Nightly schedule", "ok": true}, {"t": "Merge request opened", "ok": false}]}, {"label": "Pipeline #814 started right after the tag v2.5.0 was pushed", "ctx": "", "options": [{"t": "Tag push", "ok": true}, {"t": "Push webhook on main", "ok": false}, {"t": "Manual run", "ok": false}]}, {"label": "Pipeline #815 started when the release lead clicked Run pipeline in the UI", "ctx": "", "options": [{"t": "Nightly schedule", "ok": false}, {"t": "Merge request opened", "ok": false}, {"t": "Manual run", "ok": true}]}, {"label": "Pipeline #816 started when MR !233 was opened (not merged yet)", "ctx": "", "options": [{"t": "Merge request event", "ok": true}, {"t": "Nightly schedule", "ok": false}, {"t": "Tag push", "ok": false}]}]}}, {"id": "m07", "type": "categorize", "points": 5, "title": "Match each tool to its job", "tags": ["Jenkins", "GitLab CI", "GitHub Actions", "Terraform", "Ansible", "Docker", "Kubernetes", "Helm", "SonarQube", "Argo CD"], "scenario": "<p>Your NimbusCart onboarding quiz. The platform team uses many tools and expects you to know what each one is for before you touch a pipeline.<\/p>", "question": "<p>Place every tool into the bucket that describes its main job.<\/p>", "hint": "Two tools provision or configure infrastructure (one from code files, one over SSH). Two run or package containers. One scans code quality. One syncs clusters from Git. Three are CI systems or package managers.", "explain": "<p><b>Jenkins<\/b>, <b>GitLab CI<\/b> and <b>GitHub Actions<\/b> all run pipelines; Jenkins is a self-hosted automation server, GitLab CI is built into the GitLab platform, GitHub Actions is built into GitHub.<\/p><p><b>Terraform<\/b> provisions cloud infrastructure from code files; <b>Ansible<\/b> configures existing servers using playbooks over SSH. <b>Docker<\/b> packages an application and its runtime into an image; <b>Kubernetes<\/b> runs and scales those images across a cluster. <b>SonarQube<\/b> scans source code for bugs and weak spots. <b>Helm<\/b> packages Kubernetes apps into charts you can install with one command. <b>Argo CD<\/b> is a GitOps controller: it keeps the cluster in sync with what Git says.<\/p><p class='tip'>Focus next on: Terraform creates infrastructure, Ansible configures machines that already exist.<\/p>", "data": {"buckets": [{"id": "b1", "label": "Runs build/pipeline jobs (automation server)"}, {"id": "b2", "label": "CI built into a code platform (Git)"}, {"id": "b3", "label": "Provisions cloud infrastructure from code"}, {"id": "b4", "label": "Configures servers over SSH with playbooks"}, {"id": "b5", "label": "Packages an app + runtime into an image"}, {"id": "b6", "label": "Runs and scales containers in a cluster"}, {"id": "b7", "label": "Installs/packaged Kubernetes apps (charts)"}, {"id": "b8", "label": "Scans code for bugs and weak spots"}, {"id": "b9", "label": "GitOps sync controller for clusters"}, {"id": "b10", "label": "Workflow automation built into GitHub"}], "items": [{"id": "t1", "t": "Jenkins", "bucket": "b1"}, {"id": "t2", "t": "GitLab CI", "bucket": "b2"}, {"id": "t3", "t": "Terraform", "bucket": "b3"}, {"id": "t4", "t": "Ansible", "bucket": "b4"}, {"id": "t5", "t": "Docker", "bucket": "b5"}, {"id": "t6", "t": "Kubernetes", "bucket": "b6"}, {"id": "t7", "t": "Helm", "bucket": "b7"}, {"id": "t8", "t": "SonarQube", "bucket": "b8"}, {"id": "t9", "t": "Argo CD", "bucket": "b9"}, {"id": "t10", "t": "GitHub Actions", "bucket": "b10"}]}}, {"id": "m08", "type": "branch", "points": 5, "title": "Canary goes red at 02:14", "tags": ["Canary release", "Health check", "Rollback", "Continuous Deployment"], "scenario": "<p>02:14. NimbusCart runs <b>continuous deployment<\/b>: after the pipeline turns green, <code>storefront 2.5.0<\/code> was released as a <b>canary<\/b> — 10% of customers hit the new pods, 90% stay on stable. Grafana now shows canary error rate at <b>7%<\/b> (stable: 0.2%) and checkout conversion in the canary group dropped 30%. You are the on-call engineer.<\/p>", "question": "<p>Make the three calls of the incident in order. Choose the best action at each step.<\/p>", "hint": "The canary exists to limit blast radius. Traffic shifting is how you limit it further. Do not touch stable — it is healthy.", "explain": "<p><b>Step 1 — investigate before touching anything.<\/b> Check canary health endpoints and the diff of 2.5.0. Promoting a broken version to 100% would give every customer the bug; rolling back stable would break a healthy version.<\/p><p><b>Step 2 — shift traffic away.<\/b> The diff shows the new discount field treats <code>null<\/code> as 0, so 10% of customers see wrong totals. Health checks pass (the process is alive) but the business logic is wrong. Set canary traffic back to 0% and roll the canary pods back to 2.4.9.<\/p><p><b>Step 3 — stop the same bug from returning.<\/b> Because NimbusCart auto-deploys, tonight's builds would ship the same bug. Add a regression test for a null discount input and fix the field handling before any merge. Deleting the canary stage or switching off auto-deploy for everyone removes your safety nets instead of fixing the code.<\/p><p class='tip'>Focus next on: canary + automatic rollback on error rate is the standard guard rail for continuous deployment.<\/p>", "data": {"start": "n1", "nodes": {"n1": {"scene": "Canary error rate is 7% and climbing. Stable is healthy at 0.2%. What is your FIRST move?", "choices": [{"t": "Check the canary health endpoints and the 2.5.0 diff before touching traffic", "next": "n2", "ok": true, "fb": "Correct — understand before you act. The canary limits the blast radius to 10%."}, {"t": "Promote the canary to 100% immediately so everyone has the same version", "next": "e1", "ok": false, "fb": "That gives the bug to 100% of customers. Never promote a canary that is failing."}, {"t": "Roll back the stable pods too, to be safe", "next": "e2", "ok": false, "fb": "Stable is healthy at 0.2% — touching it only widens the incident."}]}, "n2": {"scene": "Health endpoints return 200 OK. The diff shows a new discount field treats null as 0, so some baskets get wrong totals. 10% of customers are affected. Next?", "choices": [{"t": "Shift canary traffic back to 0% and roll the canary pods back to 2.4.9", "next": "n3", "ok": true, "fb": "Correct — pods being alive is not the same as results being right. Cut the traffic."}, {"t": "Wait 24 hours for more data before deciding", "next": "e3", "ok": false, "fb": "Wrong totals for 24 hours means thousands of bad baskets. Act now."}, {"t": "Promote to 100% — they are only null discounts", "next": "e1", "ok": false, "fb": "Money math bugs are never 'only'. They destroy trust and revenue."}]}, "n3": {"scene": "Canary is rolled back and error rate is back to 0.2%. The same build will auto-deploy again tonight. Last call?", "choices": [{"t": "Add a regression test for a null discount input and fix the field handling before merge", "next": "e4", "ok": true, "fb": "Correct — fix the cause and let the test prove it stays fixed."}, {"t": "Delete the canary stage so this cannot fail again", "next": "e5", "ok": false, "fb": "Removing the alarm does not fix the fire. Canary is your smallest-blast-radius safety net."}, {"t": "Switch off auto-deploy for the whole team until further notice", "next": "e5", "ok": false, "fb": "That slows every team for one service's bug. Fix the code and the test instead."}]}, "e1": {"end": true, "scene": "The bad version is now on 100% of traffic and the error rate climbs with it."}, "e2": {"end": true, "scene": "You broke the healthy stable version. Both groups now see errors."}, "e3": {"end": true, "scene": "Hours pass. Support gets hundreds of 'my total is wrong' tickets."}, "e4": {"end": true, "scene": "The fix merges with the new regression test, the canary passes at 0.2% error rate, and the rollout completes safely."}, "e5": {"end": true, "scene": "The safety net is gone or slowed down, but the bug itself is still in the code."}}}}, {"id": "m09", "type": "spot", "points": 4, "title": "Three problems in the deploy job", "tags": ["Secrets management", "Environment variables", "Pipeline as code", "Docker", "Health check"], "scenario": "<p>Review time. A teammate opened MR <code>!240<\/code> with a new <code>deploy-prod<\/code> job for GitLab CI. You spot several bad practices before it can merge.<\/p>", "question": "<p>There are <b>exactly 3 problem lines<\/b>. Click each line that contains a problem.<\/p>", "hint": "Ask three questions: where does that secret end up? can the image tag change under you? does anything verify the rollout afterwards?", "explain": "<p><b>Line 2<\/b> — <code>alpine:latest<\/code> is an unpinned tag. <code>latest<\/code> can point to a different build tomorrow, so two runs of the same pipeline can behave differently. Pin a version or digest.<\/p><p><b>Line 5<\/b> — echoing <code>$API_TOKEN<\/code> into <code>build.log<\/code> writes the secret into a file that job logs and artifacts can expose. Secrets must be injected at runtime from the secrets store and never printed.<\/p><p><b>Line 6<\/b> — <code>kubectl apply<\/code> with no <code>kubectl rollout status<\/code> check means the job reports success even if the new pods never become ready. A deploy job should verify health before going green.<\/p><p class='tip'>Focus next on: reproducibility (pinned images), secret hygiene (never in logs), and verification (health checks after deploy).<\/p>", "data": {"lines": ["deploy-prod:", "  image: alpine:latest", "  stage: deploy", "  script:", "    - echo \"API_TOKEN=$API_TOKEN\" >> build.log", "    - kubectl apply -f k8s/prod --namespace prod", "  environment:", "    name: production"], "correct": [1, 4, 5]}}, {"id": "m10", "type": "multi", "points": 3, "title": "Which of these are DORA metrics?", "tags": ["Deployment frequency", "Lead time for changes", "Change failure rate", "MTTR (time to restore)", "Test coverage"], "scenario": "<p>Management wants to track &quot;the four key delivery metrics&quot; (the DORA metrics) on a dashboard next quarter. A consultant sent a long list of candidate numbers. Some are DORA metrics, some are not.<\/p>", "question": "<p>Select every item that is one of the four DORA metrics.<\/p>", "hint": "DORA measures how fast and how safely changes reach production: two speed metrics, one safety metric, one recovery metric.", "explain": "<p>The four DORA metrics are: <b>Deployment frequency<\/b> (how often you ship to production), <b>Lead time for changes<\/b> (merge to production), <b>Change failure rate<\/b> (share of deployments that fail or need rollback) and <b>Time to restore service<\/b> (MTTR — how fast you recover from a failed change).<\/p><p>Code coverage is a useful code-quality number, but it is not a DORA metric. Story points measure planning, not delivery. Coverage can even be gamed with weak tests — that is why DORA looks at outcomes instead.<\/p><p class='tip'>Focus next on: DORA = outcomes of the delivery process, not internals of the code.<\/p>", "data": {"options": [{"t": "Deployment frequency", "ok": true}, {"t": "Lead time for changes", "ok": true}, {"t": "Change failure rate", "ok": true}, {"t": "Code coverage percentage", "ok": false}, {"t": "Story points completed per sprint", "ok": false}, {"t": "Time to restore service after a failed change", "ok": true}]}}, {"id": "m11", "type": "fill", "points": 3, "title": "Finish the blue-green runbook", "tags": ["Blue-green deployment", "Smoke test", "Health check", "Rollback", "Environment parity"], "scenario": "<p>NimbusCart keeps two identical production environments for <code>storefront<\/code>: <b>blue<\/b> (live) and <b>green<\/b> (idle). Both have the same configuration and database, so they behave the same — that parity is the point. Maya asks you to finish the runbook sentences before tomorrow's drill.<\/p>", "question": "<p>Pick the correct ending for each sentence from the dropdowns.<\/p>", "hint": "Blue-green switches 100% of traffic in ONE move — that is the difference from canary. The old environment is your instant way back.", "explain": "<p>In a <b>blue-green deployment<\/b> you deploy the new version to the <b>idle<\/b> environment (green), run <b>smoke tests<\/b> against it while it has no customer traffic, then switch the load balancer to send <b>100%<\/b> of traffic to it in one move.<\/p><p>If the <b>health check<\/b> or smoke tests fail after the switch, you shift traffic <b>back to blue<\/b> instantly — blue still runs the old version. Keeping the old environment warm is what makes rollback take seconds instead of minutes. Both environments must stay in parity (same config, same access), otherwise the test on green proves nothing about blue.<\/p><p class='tip'>Focus next on: blue-green trades double capacity during the switch for near-instant rollback.<\/p>", "data": {"mode": "select", "parts": ["<p>1. Right now all customer traffic sits on the ", {"a": "blue", "opts": ["blue", "green", "staging"]}, " environment.<\/p><p>2. We deploy the new version to the ", {"a": "idle", "opts": ["idle", "busy", "crashed"]}, " environment while customers never see it.<\/p><p>3. With zero customer traffic on it, we run ", {"a": "smoke tests", "opts": ["smoke tests", "story planning", "a code review"]}, " against the new version.<\/p><p>4. We then shift the load balancer to send ", {"a": "100%", "opts": ["100%", "50%", "5%"]}, " of traffic to the new environment at once.<\/p><p>5. If the health check fails after the switch, we shift traffic ", {"a": "back to the old environment", "opts": ["back to the old environment", "to the staging environment", "nowhere — we wait"]}, " immediately.<\/p><p>6. The old environment is kept warm because it is our path for ", {"a": "instant rollback", "opts": ["instant rollback", "cost saving", "the quarterly audit"]}, ".<\/p>"]}}, {"id": "m12", "type": "qcm", "points": 3, "title": "Merge conflict on the shared main branch", "tags": ["Version control", "Pull request", "Trunk-based development", "Continuous Integration (CI)"], "scenario": "<p>NimbusCart uses <b>trunk-based development<\/b>: short-lived branches, many merges per day into <code>main<\/code>. Your push of <code>feature/quick-view<\/code> was rejected because a colleague merged an overlapping change an hour ago. The branch is 40 minutes old.<\/p>", "question": "<p>What is the correct way forward?<\/p>", "hint": "Never rewrite history that others already use. Rebuild your change on top of the latest main.", "explain": "<p>Rebase your short-lived branch on the latest <code>main<\/code>, resolve the conflict, and let CI run again before merging. Trunk-based development only works because conflicts are small and fixed immediately — the branch is fresh, so the overlap is tiny.<\/p><p>Force-pushing over <code>main<\/code> destroys a colleague's merged work and breaks every other open branch. Deleting and recreating <code>main<\/code> is worse. Waiting weeks turns a 10-minute rebase into a painful big-bang merge — the exact thing trunk-based development exists to avoid.<\/p><p class='tip'>Focus next on: integrate small and often; conflicts get cheaper the sooner you resolve them.<\/p>", "data": {"options": [{"t": "Rebase the branch on the latest main, resolve the conflict, re-run CI, then merge", "ok": true}, {"t": "Force-push the feature branch over main to keep your version", "ok": false}, {"t": "Delete main and recreate it from your feature branch", "ok": false}, {"t": "Park the branch and merge it in the next release train next month", "ok": false}]}}, {"id": "m13", "type": "categorize", "points": 4, "title": "Which deployment strategy fits each statement?", "tags": ["Blue-green deployment", "Canary release", "Rolling deployment", "Feature flag"], "scenario": "<p>Architecture review. NimbusCart supports four release techniques and the team keeps a poster of one-line facts about each. The poster fell apart — literally.<\/p>", "question": "<p>Drag each statement onto the strategy it describes.<\/p>", "hint": "Ask: how much traffic moves at once, and is the switch controlled by the load balancer or by a code-level switch?", "explain": "<p><b>Blue-green<\/b>: two full environments; traffic switches 100% in one move; rollback is instant (switch back); costs double capacity during the switch.<\/p><p><b>Canary<\/b>: a small slice of traffic (say 5%) tries the new version first and grows only if metrics stay healthy; problems touch only that small group.<\/p><p><b>Rolling<\/b>: pods are replaced a few at a time; old and new versions serve traffic together during the update; no double capacity needed.<\/p><p><b>Feature flag<\/b>: the code is already deployed but hidden behind a switch; product teams can enable or disable it per customer in seconds, with no new deployment.<\/p><p class='tip'>Focus next on: flags control features after deploy; the other three strategies control how versions reach the infrastructure.<\/p>", "data": {"buckets": [{"id": "bg", "label": "Blue-green"}, {"id": "cn", "label": "Canary"}, {"id": "rl", "label": "Rolling"}, {"id": "ff", "label": "Feature flag"}], "items": [{"id": "d1", "t": "Traffic switches 100% in one move between two identical environments", "bucket": "bg"}, {"id": "d2", "t": "Needs double capacity while both environments are up", "bucket": "bg"}, {"id": "d3", "t": "Starts with 5% of traffic and grows only if metrics stay healthy", "bucket": "cn"}, {"id": "d4", "t": "A bad version only hurts the small first user group", "bucket": "cn"}, {"id": "d5", "t": "Pods are replaced a few at a time until all run the new version", "bucket": "rl"}, {"id": "d6", "t": "Old and new pods serve customers at the same time during the update", "bucket": "rl"}, {"id": "d7", "t": "Turn a feature off in seconds without a new deployment", "bucket": "ff"}, {"id": "d8", "t": "Code is already in production but hidden from customers", "bucket": "ff"}]}}, {"id": "m14", "type": "terminal", "points": 3, "title": "Terminal: branch for the hotfix", "tags": ["Version control", "Continuous Integration (CI)"], "scenario": "<p>A payment display bug needs a hotfix. Policy: hotfixes never get committed directly to <code>main<\/code> — they live on a short-lived branch that CI tests first. You are logged into the <code>nimbus-cart<\/code> repository on the jump host.<\/p>", "question": "<p>Use a <code>git<\/code> command to create a new branch named <code>hotfix/login-null<\/code> and switch to it <b>in one single command<\/b>. The command family is <code>git checkout<\/code> or <code>git switch<\/code>; the flag to create-and-switch is <code>-b<\/code> or <code>-c<\/code>.<\/p>", "hint": "One step: git checkout -b NAME (or git switch -c NAME).", "explain": "<p><code>git checkout -b hotfix/login-null<\/code> creates the branch and moves you onto it in one step. The modern equivalent is <code>git switch -c hotfix/login-null<\/code>.<\/p><p>Why a branch: CI builds and tests the branch on its own pipeline, reviewers see only the hotfix changes, and <code>main<\/code> stays green. After the fix merges, the branch is deleted — hotfix branches are born to die.<\/p><p class='tip'>Focus next on: <code>-b<\/code> (checkout) and <code>-c<\/code> (switch) both mean create; without the flag git only switches.<\/p>", "data": {"banner": ["nimbus-jump 4.2 — nimbus-cart repository", "On branch main. Your branch is up to date with origin/main.", "Type your command below."], "files": {"README.md": "NimbusCart storefront monorepo\nSee docs/pipelines.md for CI rules.\n"}, "outputs": [{"re": "^git\\s+(checkout|switch)\\s+-b\\s+hotfix/login-null\\s*$", "out": "Switched to a new branch 'hotfix/login-null'"}, {"re": "^git\\s+(checkout|switch)\\s+hotfix/login-null\\s*$", "out": "error: pathspec 'hotfix/login-null' did not match any file(s) known to git (branch does not exist yet — you must create it)"}], "required": [{"re": "^git\\s+(checkout\\s+-b|switch\\s+-c)\\s+hotfix/login-null\\s*$", "ex": "git checkout -b hotfix/login-null", "note": "create and switch in one command"}]}}, {"id": "m15", "type": "multi", "points": 3, "title": "What can start a pipeline?", "tags": ["Webhook trigger", "Pipeline as code", "Pipeline"], "scenario": "<p>A developer asks in stand-up: &quot;Our pipelines are defined as code — so what actually STARTS a run?&quot; Maya lists candidate events on the whiteboard and asks you to keep only the real trigger types.<\/p>", "question": "<p>Select every event that can start a pipeline run.<\/p>", "hint": "Pipelines start from events in the tools you already use: the repo, the clock, the registry, or a human.", "explain": "<p>Typical pipeline triggers: a <b>push<\/b> (commit event), a <b>merge request being opened or updated<\/b>, a <b>schedule<\/b> (nightly cron), a <b>registry webhook<\/b> (a new image was pushed, so run the deploy part), and a <b>manual click<\/b> by a person with permission.<\/p><p>The length of a source file has no meaning to CI — triggers are events, not file properties. Knowing what starts a run helps you explain why a pipeline fired (or did not) during an incident.<\/p><p class='tip'>Focus next on: triggers are events; everything else is configuration that sits still until an event happens.<\/p>", "data": {"options": [{"t": "A developer pushes a commit", "ok": true}, {"t": "A merge request is opened or updated", "ok": true}, {"t": "A nightly schedule (cron) fires", "ok": true}, {"t": "A new image is pushed to the registry and a webhook fires", "ok": true}, {"t": "A source file reaches 500 lines", "ok": false}, {"t": "The QA lead clicks Run pipeline", "ok": true}]}}, {"id": "m16", "type": "logview", "points": 4, "title": "Nightly staging deploy failed and rolled back", "tags": ["Staging environment", "Health check", "Rollback", "Helm"], "scenario": "<p>At 02:00 the nightly pipeline deployed <code>cart-api 2.5.0-rc.3<\/code> to the <b>staging<\/b> environment with Helm. The deploy job failed. You get the log at 07:30 with your coffee.<\/p>", "question": "<p>Read the log (filter helps), then answer the single question below.<\/p>", "hint": "Search for 'Readiness' and look at what the pipeline did after the deadline was exceeded.", "explain": "<p>The new pods never passed their <b>readiness health check<\/b>: <code>/healthz<\/code> answered HTTP 503, meaning the app inside the pod was not ready to serve. Kubernetes waited until the progress deadline (120 s), then gave up, and the pipeline reacted the way it should: it ran <code>helm rollback<\/code> so staging returned to the last good version.<\/p><p>This is the system working as designed: health checks catch broken deploys, and the pipeline rolls staging back automatically. The next step for the team is to read the application logs of the failed pods to see why the app returned 503 on startup.<\/p><p class='tip'>Focus next on: readiness probes decide when a pod receives traffic; a 503 on /healthz keeps a pod out of service.<\/p>", "data": {"log": [{"t": "$ helm upgrade --install cart-api ./chart -n staging", "c": "dim"}, {"t": "Release cart-api patched. Chart version 1.4.2, app 2.5.0-rc.3"}, {"t": "$ kubectl rollout status deploy/cart-api -n staging --timeout=120s"}, {"t": "Waiting for deployment \"cart-api\" rollout to finish: 1 of 3 updated replicas are available..."}, {"t": "pod cart-api-7f9cb readiness probe failed: HTTP 503 on /healthz (attempt 4)", "c": "err"}, {"t": "pod cart-api-7f9cb readiness probe failed: HTTP 503 on /healthz (attempt 9)", "c": "err"}, {"t": "error: deployment \"cart-api\" exceeded its progress deadline", "c": "err"}, {"t": "Deploy job policy: automatic rollback on failed rollout", "c": "warn"}, {"t": "$ helm rollback cart-api -n staging", "c": "dim"}, {"t": "Rollback was a success! Staging is running app version 2.4.9", "c": "warn"}], "task": {"type": "qcm", "options": [{"t": "The new pods never passed their readiness health check, so the pipeline rolled staging back to the last good version", "ok": true}, {"t": "Helm could not find the chart, so nothing was deployed at all", "ok": false}, {"t": "The staging cluster ran out of nodes", "ok": false}, {"t": "The container image registry was down during the deploy", "ok": false}]}}}, {"id": "m17", "type": "order", "points": 3, "title": "Order the rollback runbook", "tags": ["Rollback", "Health check", "Blue-green deployment"], "scenario": "<p>During last month's incident the team improvised. Now NimbusCart wants a written rollback runbook for <code>storefront<\/code> (which deploys blue-green). You are asked to put the steps in a sensible order.<\/p>", "question": "<p>Put the six runbook steps into the right order.<\/p>", "hint": "Customers first, evidence second, root cause last. Freezing deploys stops new changes from landing on a burning platform.", "explain": "<p>A good rollback runbook: <b>1<\/b> detect (alert shows error rate up), <b>2<\/b> declare the incident and freeze deploys (so nothing new lands while you work), <b>3<\/b> shift traffic back to the last good version — with blue-green this is one load balancer switch, <b>4<\/b> verify health checks and error rate recovered, <b>5<\/b> capture logs and metrics from the failed version <i>before<\/i> it is cleaned up, <b>6<\/b> fix forward: repair the code, run the full pipeline, and deploy again.<\/p><p>Evidence comes before cleanup, because the failed pods may be the only place the bug reproduces.<\/p><p class='tip'>Focus next on: rollback is about restoring service fast, not about finding the bug — RCA comes after recovery.<\/p>", "data": {"items": [{"id": "r1", "t": "Detect — on-call alert: storefront error rate 8%"}, {"id": "r2", "t": "Declare incident and freeze all deploys for the service"}, {"id": "r3", "t": "Shift the load balancer back to the blue (last good) environment"}, {"id": "r4", "t": "Verify health checks and error rate back to baseline"}, {"id": "r5", "t": "Capture logs and metrics from the failed version for the post-mortem"}, {"id": "r6", "t": "Fix forward — repair, run the full pipeline, deploy again"}]}}, {"id": "m18", "type": "rowselect", "points": 3, "title": "Promote or hold? (artifact promotion)", "tags": ["Staging environment", "Quality gate", "Approval gate", "Container image scanning", "Continuous Delivery"], "scenario": "<p>You run the weekly release board for NimbusCart. Five builds of <code>cart-api<\/code> are on the board. For each one you must pick the correct promotion decision. Rules: every artifact must pass the quality gate, image scanning, staging tests and the approval gate before production.<\/p>", "question": "<p>Choose the correct decision for each build.<\/p>", "hint": "A gate is a door: no ticket, no pass. A critical CVE in the base image blocks promotion until it is patched.", "explain": "<p><b>2.5.0<\/b> passed everything except the pending approval gate — it can go to staging now but must wait for the human sign-off before production (that is continuous delivery).<\/p><p><b>2.5.1<\/b> failed the quality gate (coverage 55%): fix and re-run, it cannot move at all.<\/p><p><b>2.5.2<\/b> is green everywhere including staging smoke tests: request the production approval.<\/p><p><b>2.5.3<\/b> has a critical CVE found by container image scanning: block promotion and rebuild on a patched base image.<\/p><p><b>2.5.4<\/b> was built on a runner with no test logs: you cannot trust what you cannot see — rebuild it on a proper runner so evidence exists.<\/p><p class='tip'>Focus next on: promotion is evidence-based; missing evidence is treated like a failure.<\/p>", "data": {"rows": [{"label": "cart-api 2.5.0", "ctx": "Unit, integration, quality gate, staging all green. Approval gate for prod: pending.", "options": [{"t": "Deploy to staging, wait for approval before prod", "ok": true}, {"t": "Deploy straight to prod", "ok": false}, {"t": "Discard the build", "ok": false}]}, {"label": "cart-api 2.5.1", "ctx": "Quality gate failed: coverage 55% (needs 80%).", "options": [{"t": "Promote to staging anyway", "ok": false}, {"t": "Fix and re-run; it cannot move on", "ok": true}, {"t": "Promote to prod behind a flag", "ok": false}]}, {"label": "cart-api 2.5.2", "ctx": "All gates green, staging smoke tests green.", "options": [{"t": "Request production approval from the release manager", "ok": true}, {"t": "Re-run staging for three more days", "ok": false}, {"t": "Delete the artifact", "ok": false}]}, {"label": "cart-api 2.5.3", "ctx": "Image scan found 1 critical CVE in the base image.", "options": [{"t": "Promote now, patch the base image later", "ok": false}, {"t": "Downgrade the scanner to warning", "ok": false}, {"t": "Block promotion; rebuild on the patched base image", "ok": true}]}, {"label": "cart-api 2.5.4", "ctx": "Built on an unregistered runner; no test logs attached.", "options": [{"t": "Promote; logs are optional", "ok": false}, {"t": "Rebuild on a proper runner so evidence exists", "ok": true}, {"t": "Promote and watch production closely", "ok": false}]}]}}, {"id": "m19", "type": "qcm", "points": 3, "title": "Why keep artifacts in a repository?", "tags": ["Artifact", "Artifact repository", "Build", "Immutable infrastructure"], "scenario": "<p>A new hire asks why the pipeline pushes every Docker image to Artifactory instead of building the image again on each environment when needed.<\/p>", "question": "<p>What is the main reason?<\/p>", "hint": "Promote the exact bits you tested — rebuilding can give you different bits.", "explain": "<p>An <b>artifact<\/b> is the immutable output of a build: the exact image that was tested. The <b>artifact repository<\/b> stores every version with its metadata (commit, build time, digest). Promotion then moves the <i>same<\/i> artifact from staging to production.<\/p><p>Rebuilding can produce a different result: a base image moved, a dependency published a new patch — the new build is not what the tests saw. &quot;Git cannot store binaries&quot; is a side note, not the reason; large binaries live poorly in Git, but the core idea is traceability and immutability of the tested build.<\/p><p class='tip'>Focus next on: build once, promote everywhere — never rebuild between environments.<\/p>", "data": {"options": [{"t": "The exact tested build is promoted and traced instead of being rebuilt differently", "ok": true}, {"t": "Git cannot store compiled files, so a second store is required", "ok": false}, {"t": "It makes the pipeline slower but safer on purpose", "ok": false}, {"t": "Each environment should compile its own slightly different version", "ok": false}]}}, {"id": "m20", "type": "fill", "points": 3, "title": "Write the monthly delivery report", "tags": ["Deployment frequency", "Lead time for changes", "Change failure rate", "MTTR (time to restore)", "Quality gate"], "scenario": "<p>October numbers from the delivery dashboard are in. Maya asks you to write the two-paragraph summary for the steering meeting — with the correct metric names, because the CFO reads it.<\/p>", "question": "<p>Fill each blank with the right metric or term from the word bank.<\/p>", "hint": "Two metrics measure speed (how often, how long), two measure safety (how often it breaks, how fast you recover), one is a pipeline door.", "explain": "<p><b>Deployment frequency<\/b> — 62 releases, about 2 per day. <b>Lead time for changes<\/b> — average 4 hours from merge to production. <b>Change failure rate<\/b> — 6% of deployments caused a failure or rollback. <b>MTTR<\/b> (time to restore service) — 25 minutes on average when a deploy failed.<\/p><p>The <b>quality gate<\/b> passed on the first try for 90% of merges, which means less rework looping back through the pipeline. Together these DORA-style numbers tell leadership both speed and safety of delivery.<\/p><p class='tip'>Focus next on: frequency + lead time = speed; failure rate + MTTR = stability.<\/p>", "data": {"mode": "bank", "parts": ["<p>In October NimbusCart completed 62 production releases — our <b>___<\/b> (1) is now about 2 per day. The average time from merge to production dropped to 4 hours, which is our <b>___<\/b> (2). Only 6% of changes caused a failed deploy or a rollback — a healthy <b>___<\/b> (3). When a deploy did fail, on-call restored service in 25 minutes on average — that is our <b>___<\/b> (4). Finally, 90% of merges now pass the <b>___<\/b> (5) on the first try, so fewer fixes loop back through the pipeline.<\/p>", {"a": "deployment frequency"}, {"a": "lead time for changes"}, {"a": "change failure rate"}, {"a": "MTTR"}, {"a": "quality gate"}], "bank": ["deployment frequency", "lead time for changes", "change failure rate", "MTTR", "quality gate", "story points", "uptime"]}}, {"id": "m21", "type": "spot", "points": 4, "title": "Three problems in the Dockerfile", "tags": ["Docker", "Health check", "Least privilege"], "scenario": "<p>MR <code>!247<\/code> ships a new Dockerfile for <code>cart-api<\/code>. The image builds fine and the app starts on your laptop — but &quot;it builds&quot; is not the same as &quot;it is built well&quot;. Review it.<\/p>", "question": "<p>There are <b>exactly 3 problem lines<\/b>. Click each line that contains a problem.<\/p>", "hint": "Who does the container run as? Which base image is that? How would the platform know the app inside is alive?", "explain": "<p><b>Line 1<\/b> — <code>ubuntu:latest<\/code> is unpinned: tomorrow's <code>latest<\/code> can break the build or add risk. Pin a version (or digest) and keep the base image small.<\/p><p><b>Line 5<\/b> — <code>USER root<\/code> makes the app run as root inside the container. If the app is compromised, the attacker is root in the container. Run as a dedicated non-root user instead (least privilege for processes).<\/p><p><b>Line 7<\/b> — <code>HEALTHCHECK NONE<\/code> removes the container health check, so the platform cannot tell a hung app from a healthy one. Define a real health check (or rely on Kubernetes probes configured elsewhere — but then do not disable it here).<\/p><p class='tip'>Focus next on: pinned bases, non-root users, and a live health signal for every container.<\/p>", "data": {"lines": ["FROM ubuntu:latest", "WORKDIR /app", "COPY . .", "RUN ./install-deps.sh", "USER root", "CMD [\"java\", \"-jar\", \"cart-api.jar\"]", "HEALTHCHECK NONE"], "correct": [0, 4, 6]}}, {"id": "m22", "type": "branch", "points": 4, "title": "Staging is red before the Friday release", "tags": ["Staging environment", "Smoke test", "Approval gate", "Integration test"], "scenario": "<p>Friday, 16:30. The 2.6.0 release train leaves today. Staging <b>smoke tests fail<\/b>: checkout returns HTTP 500 on every run. The product manager walks over: &quot;Staging is always flaky — just release to prod, we have customers waiting.&quot; You are the release engineer.<\/p>", "question": "<p>Make the three calls in order.<\/p>", "hint": "A failing staging test is information, not noise. Read it before anyone talks about production.", "explain": "<p><b>Step 1 — pull the staging logs and reproduce.<\/b> Guessing or blind re-runs waste the only thing you cannot buy back: time before the deadline.<\/p><p><b>Step 2 — name the real cause.<\/b> The logs show 2.6.0 calls <code>payments-api v2<\/code> endpoints that staging's mock does not implement. That is an integration problem between services. Blocking the release, fixing the version mismatch, and adding a contract test between the two services is the durable fix. Pointing staging's mock at production would put test traffic on a production payment system — never.<\/p><p><b>Step 3 — same gates, no exceptions.<\/b> When the fix lands at 18:00, the release still goes through staging green plus the approval gate (and a canary given the late hour). Deadlines do not override gates; the approval gate exists exactly for moments like this.<\/p><p class='tip'>Focus next on: staging failures are cheap messages from the future — production failures are the expensive version of the same message.<\/p>", "data": {"start": "n1", "nodes": {"n1": {"scene": "Staging smoke tests fail with HTTP 500 on checkout. The PM wants to ship anyway. First move?", "choices": [{"t": "Pull the staging logs and reproduce the failure before any prod conversation", "next": "n2", "ok": true, "fb": "Correct — diagnose first. The logs will tell you which layer is lying."}, {"t": "Deploy to prod; staging is always flaky anyway", "next": "e1", "ok": false, "fb": "You just shipped an unknown failure to paying customers."}, {"t": "Re-run the staging tests five times and hope one goes green", "next": "e2", "ok": false, "fb": "Re-running without reading logs is guessing with extra steps."}]}, "n2": {"scene": "Logs: 2.6.0 calls payments-api v2 endpoints that the staging mock does not implement. Real decision?", "choices": [{"t": "Block the release, fix the version mismatch, add a contract test between the services", "next": "n3", "ok": true, "fb": "Correct — fix the mismatch and make the pipeline catch it next time."}, {"t": "Point the staging mock at the production payments-api", "next": "e3", "ok": false, "fb": "That sends test traffic at a live payment system. Never."}, {"t": "Ship it — prod will be fine, prod has the real payments-api", "next": "e1", "ok": false, "fb": "Maybe — but 'maybe' is not a release strategy for money paths."}]}, "n3": {"scene": "Fixed Friday 18:00. The PM still wants the release tonight. What protects production?", "choices": [{"t": "Release through the same gates: staging green, approval gate, canary first", "next": "e4", "ok": true, "fb": "Correct — the gates exist for Friday evenings most of all."}, {"t": "Skip the gates; the deadline beats quality this once", "next": "e5", "ok": false, "fb": "The one skipped gate is always the one that fails."}, {"t": "Deploy straight to prod and watch social media for complaints", "next": "e5", "ok": false, "fb": "Customers are not a monitoring system."}]}, "e1": {"end": true, "scene": "Production checkout fails for real customers. The incident channel opens."}, "e2": {"end": true, "scene": "Two hours are gone, nothing is learned, the deadline is closer."}, "e3": {"end": true, "scene": "Test orders hit the production payment provider. Compliance is now involved."}, "e4": {"end": true, "scene": "The canary shows 0.3% errors, the rollout completes, and the PM owes you coffee."}, "e5": {"end": true, "scene": "A silent integration bug reaches customers on the busiest evening of the week."}}}}, {"id": "m23", "type": "categorize", "points": 4, "title": "What does each kind of test prove?", "tags": ["Unit test", "Integration test", "Smoke test", "Regression testing", "DAST"], "scenario": "<p>New team member quiz. NimbusCart's pipeline runs several kinds of tests, and each answers a different question. The cheat sheet needs rebuilding.<\/p>", "question": "<p>Match each test type to the question it answers.<\/p>", "hint": "Ask how big the piece under test is (one function? two services? the deployed app?) and whether it is even running yet.", "explain": "<p><b>Unit test<\/b> — one function or class, in isolation, fast, no network; runs on every push.<\/p><p><b>Integration test<\/b> — two or more pieces together (service + real database or API) to prove their contract works.<\/p><p><b>Smoke test<\/b> — after deploy: does the app start and do its most basic flows work? Shallow but broad.<\/p><p><b>Regression test<\/b> — a test written for a bug from the past, proving the bug stays fixed.<\/p><p><b>Load test<\/b> — can the system survive expected peak traffic (e.g. Black Friday for an e-commerce team)?<\/p><p><b>DAST<\/b> — dynamic analysis: it attacks the <i>running<\/i> application from the outside looking for security holes, unlike SAST which reads the source code.<\/p><p class='tip'>Focus next on: unit = small and offline, integration = pieces together, smoke = deployed and alive, DAST = running and attacked.<\/p>", "data": {"buckets": [{"id": "u", "label": "Unit test"}, {"id": "i", "label": "Integration test"}, {"id": "s", "label": "Smoke test"}, {"id": "g", "label": "Regression test"}, {"id": "l", "label": "Load test"}, {"id": "d", "label": "DAST"}], "items": [{"id": "x1", "t": "One function works alone — fast, no network", "bucket": "u"}, {"id": "x2", "t": "The service and the real database work together", "bucket": "i"}, {"id": "x3", "t": "The deployed build starts and its basic flows work", "bucket": "s"}, {"id": "x4", "t": "The bug fixed last month stays fixed", "bucket": "g"}, {"id": "x5", "t": "The system survives expected Black Friday traffic", "bucket": "l"}, {"id": "x6", "t": "The running app is attacked from outside to find holes", "bucket": "d"}]}}, {"id": "m24", "type": "multi", "points": 4, "title": "Pipeline security controls to adopt", "tags": ["Secrets management", "Least privilege", "Signed artifacts", "Container image scanning", "SCA (dependency scanning)"], "scenario": "<p>The security team reviewed NimbusCart's CI setup and proposes a control list. Some controls are real and valuable; one is a disaster. You must be able to tell them apart — this exact list shows up in the Cloud+ exam.<\/p>", "question": "<p>Select every control that is a genuine, good pipeline security practice.<\/p>", "hint": "One option makes everything easier to steal. Ask what happens if the repo or a runner is compromised.", "explain": "<p>Good controls: store secrets in a <b>vault<\/b> and inject at runtime (never in the repo); give the deploy service account <b>least privilege<\/b> (only the rights that job needs); <b>sign artifacts<\/b> so anyone can verify who built them and that they were not changed; <b>scan container images<\/b> for known CVEs before promotion; <b>pin and scan dependencies<\/b> (SCA) so a poisoned library is caught.<\/p><p>Committing an <code>.env<\/code> file with API keys to the repo is the opposite of secrets management: every reader of the repo, and every copy of it, holds your keys forever (Git history remembers).<\/p><p class='tip'>Focus next on: secrets location, blast radius of credentials, and proving where a build came from.<\/p>", "data": {"options": [{"t": "Store pipeline secrets in the vault, injected at runtime into jobs", "ok": true}, {"t": "Give the deploy service account only the rights its job needs", "ok": true}, {"t": "Sign build artifacts so anyone can verify who built them", "ok": true}, {"t": "Scan container images for CVEs before promotion", "ok": true}, {"t": "Pin and scan third-party dependencies (SCA) on every build", "ok": true}, {"t": "Keep all API keys in one .env file committed to the repo", "ok": false}]}}, {"id": "m25", "type": "qcm", "points": 3, "title": "Pick the strategy for the risky pricing change", "tags": ["Canary release", "Blue-green deployment", "Feature flag", "Rollback"], "scenario": "<p>NimbusCart rewrites its pricing engine. Behavior is hard to predict from tests alone, so the team wants real users involved — but with a small blast radius and an automatic way back if error rates rise.<\/p>", "question": "<p>Which deployment approach fits best?<\/p>", "hint": "You want a small, measurable slice of real traffic with an automatic way back.", "explain": "<p>A <b>canary release<\/b> to 5% of traffic, watched with an automatic rollback rule on error rate, is the best fit: real users, small blast radius, measured outcome, automatic way back.<\/p><p>A big-bang deploy at midnight has no measurement and no guard rail. Blue-green switches 100% at once — fine for instant rollback, but every user is on the new engine the moment it happens. A feature flag ON for all users is also 100% exposure; flags are great for progressive enablement, but as described here they would not limit the blast radius.<\/p><p class='tip'>Focus next on: canary = percentage of traffic; flag = percentage of people you choose; blue-green = everyone at once.<\/p>", "data": {"options": [{"t": "Canary release to 5% of traffic with automatic rollback on error rate", "ok": true}, {"t": "Big-bang deploy to 100% at midnight when traffic is low", "ok": false}, {"t": "Blue-green switch, then delete the old environment after 5 minutes", "ok": false}, {"t": "Deploy with a feature flag that is ON for all customers at launch", "ok": false}]}}, {"id": "m26", "type": "categorize", "points": 4, "title": "Where does each thing live?", "tags": ["Infrastructure as Code", "Artifact repository", "Secrets management", "Version control", "Pipeline as code"], "scenario": "<p>Security audit question: &quot;For each item below, name the system that is its correct home.&quot; Wrong homes are how secrets leak and builds break.<\/p>", "question": "<p>Place every item in its correct home.<\/p>", "hint": "Built binaries are not source code. Credentials are not code. Infrastructure definitions are code — but a special repo of their own.", "explain": "<p><b>Version control (Git)<\/b> holds source code and pipeline definitions like <code>.gitlab-ci.yml<\/code> — pipeline as code lives next to the code it builds.<\/p><p><b>Artifact repository<\/b> holds built, immutable outputs: Docker images and packaged charts.<\/p><p><b>Secrets vault<\/b> holds credentials: API keys and certificates. Nothing secret belongs in Git — Git history keeps copies forever.<\/p><p><b>Infrastructure as Code repo<\/b> holds Terraform files that describe cloud resources, reviewed like application code and applied by the pipeline.<\/p><p class='tip'>Focus next on: the correct home is where the thing can be stored safely AND handed to the right consumer automatically.<\/p>", "data": {"buckets": [{"id": "v", "label": "Version control (Git)"}, {"id": "a", "label": "Artifact repository"}, {"id": "s", "label": "Secrets vault"}, {"id": "i", "label": "IaC repo"}], "items": [{"id": "w1", "t": "Terraform files describing the EKS cluster", "bucket": "i"}, {"id": "w2", "t": "cart-api 2.5.0 Docker image (built and tested)", "bucket": "a"}, {"id": "w3", "t": "Stripe API key used by the deploy job", "bucket": "s"}, {"id": "w4", "t": ".gitlab-ci.yml pipeline definition", "bucket": "v"}, {"id": "w5", "t": "Source code of cart-service", "bucket": "v"}, {"id": "w6", "t": "Payment gateway certificate (PEM)", "bucket": "s"}, {"id": "w7", "t": "Helm chart package chart-1.4.0.tgz", "bucket": "a"}, {"id": "w8", "t": "VPC and subnet definitions", "bucket": "i"}]}}, {"id": "m27", "type": "terminal", "points": 3, "title": "Terminal: is the rollout healthy?", "tags": ["Kubernetes", "Rolling deployment", "Health check"], "scenario": "<p>The platform just rolled out <code>cart-api<\/code> to the <code>prod<\/code> namespace using a rolling update (Kubernetes replaces pods a few at a time). You are on the admin jump host with <code>kubectl<\/code> available.<\/p>", "question": "<p>Use a <code>kubectl<\/code> command to check the rollout status of the <code>cart-api<\/code> deployment in namespace <code>prod<\/code>. The command family is <code>kubectl rollout status<\/code>; add the deployment name and namespace.<\/p>", "hint": "kubectl rollout status deployment/cart-api --namespace prod (or -n prod).", "explain": "<p><code>kubectl rollout status deployment/cart-api -n prod<\/code> watches the rolling update until it finishes — printing &quot;successfully rolled out&quot; or the error that blocks it (for example a failing readiness probe).<\/p><p>A rolling deployment is only done when every new pod passes its readiness check and replaces an old one. Checking rollout status belongs at the end of every deploy job, so the pipeline fails fast if the rollout stalls.<\/p><p class='tip'>Focus next on: rollout status is the Kubernetes way to ask &quot;is the new version fully in place and healthy?&quot;<\/p>", "data": {"banner": ["nimbus-jump 4.2 — EKS cluster nimbus-prod", "user@jump:~$ kubectl config current-context", "nimbus-prod"], "files": {"deploy-notes.md": "cart-api rolling update started 09:40\n"}, "outputs": [{"re": "rollout\\s+status.*cart-api", "out": "Waiting for deployment \"cart-api\" rollout to finish: 2 of 3 updated replicas are available...\ndeployment \"cart-api\" successfully rolled out"}, {"re": "^kubectl\\s+get\\s+pods", "out": "NAME                       READY   STATUS    RESTARTS   AGE\ncart-api-5d4f9-abcde       1/1     Running   0          4m\ncart-api-5d4f9-fghij       1/1     Running   0          3m\ncart-api-7a1b2-klmno       1/1     Running   0          2d"}], "required": [{"re": "^kubectl\\s+rollout\\s+status\\b.*cart-api", "ex": "kubectl rollout status deployment/cart-api -n prod", "note": "check rollout status of cart-api"}]}}, {"id": "m28", "type": "order", "points": 3, "title": "Order the GitOps deploy flow", "tags": ["GitOps", "Argo CD", "Version control"], "scenario": "<p>NimbusCart runs <code>storefront<\/code> with GitOps: an <b>Argo CD<\/b> controller keeps the cluster in sync with a manifest repo. New hires keep asking what happens between &quot;I merged my PR&quot; and &quot;customers see it&quot;. Build the flow.<\/p>", "question": "<p>Put the six steps of the GitOps flow in order.<\/p>", "hint": "Git is the source of truth. The controller only follows Git — it never acts before Git changes.", "explain": "<p>The GitOps loop: <b>1<\/b> developer merges the MR to <code>main<\/code>; <b>2<\/b> CI builds the image, pushes it to the registry, and updates the image tag in the manifest repo (a separate Git repo that describes desired state); <b>3<\/b> Argo CD notices the cluster differs from the manifest repo (drift or a new desired state); <b>4<\/b> Argo CD applies the desired state to the cluster; <b>5<\/b> its health checks report the application Healthy; <b>6<\/b> the dashboard shows which commit is now deployed.<\/p><p>Nobody runs <code>kubectl apply<\/code> by hand — the controller does, and Git remains the single source of truth.<\/p><p class='tip'>Focus next on: in GitOps, every change is a Git commit; the cluster converges toward Git, never the other way around.<\/p>", "data": {"items": [{"id": "g1", "t": "Developer merges the merge request to main"}, {"id": "g2", "t": "CI builds the image and updates the tag in the manifest repo"}, {"id": "g3", "t": "Argo CD detects that the cluster differs from the manifest repo"}, {"id": "g4", "t": "Argo CD applies the new desired state to the cluster"}, {"id": "g5", "t": "Argo CD health checks report the application Healthy"}, {"id": "g6", "t": "The dashboard shows the deployed commit hash as the live version"}]}}, {"id": "m29", "type": "multi", "points": 3, "title": "Why put infrastructure in code?", "tags": ["Infrastructure as Code", "Configuration drift", "Ephemeral environment"], "scenario": "<p>After a 03:00 &quot;snowflake server&quot; rebuild took five hours by hand, NimbusCart decides to move all environment definitions into Terraform. A skeptic asks what the actual benefits are.<\/p>", "question": "<p>Select every real benefit of Infrastructure as Code in a pipeline world.<\/p>", "hint": "Think about the 03:00 rebuild, about surprises found in plan diffs, and about preview environments per merge request.", "explain": "<p>With IaC: environments can be <b>rebuilt identically<\/b> from the repo (the end of snowflake servers); <b>drift<\/b> — manual console changes — shows up in plan diffs before it causes surprises; whole <b>ephemeral test environments<\/b> can be created and deleted per merge request, tested, and thrown away; and infrastructure changes are <b>reviewed in pull requests<\/b> like application code, with CI applying them.<\/p><p>IaC does not remove the need for monitoring, and hand-clicking in the console is exactly what IaC replaces — console clicks are how drift is born.<\/p><p class='tip'>Focus next on: IaC turns environments from pets (hand-built, unique) into cattle (defined, rebuilt, disposable).<\/p>", "data": {"options": [{"t": "Environments can be rebuilt identically from the repo", "ok": true}, {"t": "Drift shows up in plan diffs before it causes surprises", "ok": true}, {"t": "Whole ephemeral test environments can be created and deleted per merge request", "ok": true}, {"t": "Infrastructure changes are reviewed in pull requests like application code", "ok": true}, {"t": "It removes the need for any monitoring", "ok": false}, {"t": "Manual console clicks become faster and safer", "ok": false}]}}, {"id": "m30", "type": "qcm", "points": 3, "title": "Compute the change failure rate", "tags": ["Change failure rate", "Deployment frequency"], "scenario": "<p>October dashboard: <b>62 production deployments<\/b> of NimbusCart services. <b>4<\/b> of them caused a failed deploy or needed a rollback. Separately, engineers shipped <b>2 hotfixes<\/b> that succeeded.<\/p>", "question": "<p>What is the change failure rate for October?<\/p>", "hint": "Only deployments that failed or rolled back count — hotfixes that succeeded are just deployments.", "explain": "<p>Change failure rate = failed-or-rolled-back deployments ÷ total deployments = 4 ÷ 62 ≈ <b>6.5%<\/b>.<\/p><p>Counting the 2 successful hotfixes as failures (9.7%) double-punishes the team for recovering well. 4.3% invents a different denominator. A healthy team usually sits under ~15%; the trend matters more than one month.<\/p><p class='tip'>Focus next on: the denominator is ALL deployments, the numerator is only the failed/rolled-back ones.<\/p>", "data": {"options": [{"t": "6.5% — 4 of 62 deployments failed or rolled back", "ok": true}, {"t": "9.7% — 6 of 62, counting the hotfixes too", "ok": false}, {"t": "4.3% — 4 of 92 including staging runs", "ok": false}, {"t": "33% — 4 failures out of 12 incidents", "ok": false}]}}]};
'use strict';
(function () {
var CFG = window.__EXAM__;
var QS = CFG.questions;
var THEMES = CFG.themes;
var PASS = CFG.passMark;
var R = {}; /* renderer registry, filled by render modules below */

/* ---------- helpers ---------- */
function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function h(node, s) { node.innerHTML = s; return node; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase(); }
function toast(msg, ms) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, ms || 2600); }

/* ---------- state ---------- */
var st = {
  phase: 'intro', order: [], pos: 0,
  ans: {}, dirty: {}, graded: {}, skipped: {}, hint: {}, prep: {},
  manual: false, checkp: false, finished: false, reported: false,
  remaining: CFG.minutes * 60, user: ''
};
function curQ() { return QS[st.order[st.pos]]; }
function curPrep() { return st.prep[curQ().id]; }
function touch(id) { st.dirty[id] = true; }

/* ---------- prepare (shuffle once per attempt) ---------- */
function prepInner(d) {
  d = JSON.parse(JSON.stringify(d));
  if (d.type === 'qcm' || d.type === 'multi') d.options = shuffle(d.options);
  if (d.type === 'rowselect') d.rows.forEach(function (r) { r.options = shuffle(r.options); });
  if (d.type === 'categorize') { d.items = shuffle(d.items); d.buckets = shuffle(d.buckets); }
  if (d.type === 'order') d.order = shuffle(d.items.map(function (_, i) { return i; }));
  if (d.type === 'fill') {
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.mode === 'select') d.parts.forEach(function (p) { if (p && typeof p === 'object' && p.opts) p.opts = shuffle(p.opts); });
  }
  if (d.type === 'branch') Object.keys(d.nodes).forEach(function (k) { if (d.nodes[k].choices) d.nodes[k].choices = shuffle(d.nodes[k].choices); });
  return d;
}
function prepare(q) {
  var d = JSON.parse(JSON.stringify(q.data));
  if (q.type === 'qcm' || q.type === 'multi') d.options = shuffle(d.options);
  if (q.type === 'rowselect') d.rows.forEach(function (r) { r.options = shuffle(r.options); });
  if (q.type === 'categorize') { d.items = shuffle(d.items); d.buckets = shuffle(d.buckets); }
  if (q.type === 'order') d.order = shuffle(d.items.map(function (_, i) { return i; }));
  if (q.type === 'fill') {
    if (d.bank) d.bank = shuffle(d.bank);
    if (d.mode === 'select') d.parts.forEach(function (p) { if (p && typeof p === 'object' && p.opts) p.opts = shuffle(p.opts); });
  }
  if (q.type === 'branch') {
    Object.keys(d.nodes).forEach(function (k) { if (d.nodes[k].choices) d.nodes[k].choices = shuffle(d.nodes[k].choices); });
    d.maxDepth = depth(d.start, d.nodes, {});
  }
  if (q.type === 'logview') {
    d.task = prepInner(d.task);
    d.taskType = d.task.type;
  }
  if (q.type === 'terminal') {
    d.out = (d.outputs || []).map(function (o) { return { re: new RegExp(o.re, 'i'), out: o.out }; });
    d.req = (d.required || []).map(function (r) { return { re: new RegExp(r.re, 'i'), ex: r.ex || '', note: r.note || '' }; });
  }
  return d;
}
function depth(id, nodes, seen) {
  var n = nodes[id]; if (!n || !n.choices || !n.choices.length || seen[id]) return 0;
  seen[id] = 1; var m = 0;
  n.choices.forEach(function (c) { m = Math.max(m, 1 + depth(c.next, nodes, seen)); });
  delete seen[id]; return m;
}

/* ---------- HUD / pause ---------- */
function running() { return st.phase === 'exam' && !st.manual && !st.checkp && !st.finished; }
setInterval(function () {
  if (running()) {
    st.remaining--;
    if (st.remaining <= 0) { st.remaining = 0; updateHUD(); finishExam(true); return; }
    updateHUD();
  }
}, 1000);

/* ---------- actions ---------- */
function doCheck() {

  st.graded[q.id] = { n: n, ok: ok, earned: earned, points: q.points, res: res };
  delete st.skipped[q.id];
  st.checkp = true;
  renderQuestion(true); buildNav();
  toast('Answer locked. Timer paused in review mode — press Next to resume.');
}
function doRevise() {
  var q = curQ(); if (!q || !st.graded[q.id]) return;

}
function doHint() {

/* ---------- finish / results ---------- */
function isEmptyAns(q) {
  try { return R[q.type].isEmpty(q, st.prep[q.id]); } catch (e) { return true; }
}
function finishExam(auto) {
  if (st.finished) return;
  var unanswered = 0, countable = 0;
  QS.forEach(function (q) {
    if (!st.graded[q.id] && !st.skipped[q.id] && isEmptyAns(q)) unanswered++;
    if (!st.skipped[q.id] && (st.graded[q.id] || !isEmptyAns(q))) countable++;
  });
  if (!auto && countable === 0) { toast('Answer at least one exercise before finishing.'); return; }
  if (!auto && unanswered > 0) {
    if (!window.confirm(unanswered + ' exercise(s) have no validated answer. They will NOT be counted in the score. Finish anyway?')) return;
  }
  st.finished = true; st.phase = 'results'; st.manual = false; st.checkp = false;
  QS.forEach(function (q) {
    var id = q.id;
    if (st.graded[id] || st.skipped[id]) return;
    if (!isEmptyAns(q)) {
      var res = R[q.type].grade(q, st.prep[id]);
      var raw = q.points * (res.ok || 0) / (res.n || 1);
      var pen = st.hint[id] ? q.points * 0.1 : 0;
      st.graded[id] = { n: res.n || 1, ok: res.ok || 0, earned: Math.max(0, Math.round((raw - pen) * 10) / 10), points: q.points, res: res, auto: true };
    }
  });
  var total = 0, earned = 0;
  QS.forEach(function (q) {
    if (st.skipped[q.id]) return;
    /* Never-answered exercises are excluded from BOTH the points earned and
       the total possible (site contract: score/total count only answered
       exercises; the finish dialog and intro say the same). */
    if (!st.graded[q.id] && isEmptyAns(q)) return;
    total += q.points;
    if (st.graded[q.id]) earned += st.graded[q.id].earned;
  });
  earned = Math.round(earned * 10) / 10;
  var reported = Math.round(earned);
  var pct = total > 0 ? Math.round(reported / total * 100) : 0;
  renderResults(earned, total, pct);
  $('hdr').hidden = true; $('exam').hidden = true; $('results').hidden = false;
  updateHUD();
  if (total > 0) reportScore(reported, total, pct);
}

/* ---------- handshake ---------- */
window.addEventListener('message', function (ev) {
  var d = ev.data; if (!d) return;
  if (d.type !== 'CYBERPULSE_INIT' && d.type !== 'CYBERMASTERY_INIT') return;
  st.user = d.username || '';
  /* dark-only exam: site theme is intentionally ignored */
  /* The handshake can arrive before or after first paint, and while the intro
     is showing; rebuild the intro so the candidate chip always appears, and
     guard against duplicated chips if the site re-sends the message. */
  if (st.phase === 'intro') renderIntro();
  else {
    var m = document.querySelector('.metastr');
    if (m && st.user && !m.querySelector('.whoami')) {
      m.appendChild(el('span', 'mchip whoami', 'Candidate: ' + st.user));
    }
  }
});

/* ---------- boot ---------- */
function init() {
  $('btnpause').addEventListener('click', doPause);
  $('btnprev').addEventListener('click', goPrev);
  $('btnnext').addEventListener('click', function () { goNext(false); });
  $('btnfinish').addEventListener('click', function () { finishExam(false); });
  $('btnkw').addEventListener('click', openKw);
  $('kwmclose').addEventListener('click', closeKw);
  $('kwmodal').addEventListener('click', function (e) { if (e.target === $('kwmodal')) closeKw(); });
  document.addEventListener('keydown', function (e) {
    if ($('kwmodal').hidden) return;
    if (e.key === 'Escape') { closeKw(); return; }
    if (e.key !== 'Tab') return;
    var f = [];
    Array.prototype.forEach.call($('kwmodal').querySelectorAll('button, input, a[href], [tabindex]'), function (x) {
      if (!x.disabled && x.offsetParent !== null) f.push(x);
    });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  });
  $('sevbadge').textContent = CFG.sevLabel;
  $('htext').textContent = CFG.shortTitle;
  renderIntro();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
