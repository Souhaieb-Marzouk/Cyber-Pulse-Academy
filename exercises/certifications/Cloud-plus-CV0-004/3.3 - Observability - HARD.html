<style>
:root{
  --bg:#0b111c; --panel:#121a2a; --panel2:#0e1622; --line:#26344b; --line2:#31456280;
  --tx:#e8eef7; --mut:#a9b9cf; --acc:#56d4e8; --acc2:#2b6f80;
  --ok:#63d98f; --bad:#f2807a; --warn:#ffc46b; --okbg:rgba(99,217,143,.12);
  --badbg:rgba(242,128,122,.13); --warnbg:rgba(255,196,107,.13); --accbg:rgba(86,212,232,.12);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:1060px;margin:0 auto;padding:14px 16px 60px}
h1,h2,h3{line-height:1.25;margin:.2em 0 .5em}
p{margin:.45em 0}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
/* ---------- screens ---------- */
.screen[hidden]{display:none}
/* ---------- intro ---------- */
.intro-hero{background:linear-gradient(160deg,#122036,#0d1523);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:14px}
.intro-hero h1{font-size:24px;margin:0 0 6px}
.sev{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.06em;border:1px solid}
.sev-med{color:#0e1622;background:var(--warn);border-color:var(--warn)}
.sev-hard{color:#fff;background:#c9453c;border-color:#e06a61}
.meta-grid{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.meta-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
.meta-cell b{display:block;font-size:19px;color:var(--acc)}
.meta-cell span{color:var(--mut);font-size:13px}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.howto h2{font-size:17px;color:var(--acc);margin-top:2px}
.howto ul{margin:.4em 0;padding-left:1.25em}
.howto li{margin:.32em 0}
.kw-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.kw-wrap h2{font-size:17px;color:var(--acc);margin-top:2px}
.kw-themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}
.kw-theme{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kw-theme h3{font-size:14px;color:var(--warn);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.kw-theme p{font-size:13.5px;color:var(--mut);margin:0;line-height:1.6}
.start-row{display:flex;gap:12px;align-items:center;margin:16px 0}
/* ---------- buttons ---------- */
.btn{background:#1a2740;border:1px solid #35507c;color:var(--tx);border-radius:9px;padding:10px 18px;min-height:44px;min-width:44px;transition:background .25s,border-color .25s,transform .15s}
.btn:hover{background:#223355;border-color:#4a6ea6}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#0e5468;border-color:#2b8aa3;font-weight:600}
.btn.primary:hover{background:#14708c}
.btn.danger{background:#5d2723;border-color:#9c4a42}
.btn.danger:hover{background:#75322c}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:#16223a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hbtn{background:#16223a;border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:44px;transition:background .25s}
.hbtn:hover{background:#1e2f4f}
.hbtn.warn{border-color:#8a6a3a;color:var(--warn)}
/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#0d1523f2,#0d1523e6);backdrop-filter:blur(4px);border-bottom:1px solid var(--line);padding:10px 2px 8px;margin:0 -16px 10px;padding-left:16px;padding-right:16px}
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#hdr-title{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hdr-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;white-space:nowrap}
.chip b{color:var(--acc);font-variant-numeric:tabular-nums}
#timer-chip.low b{color:var(--warn)}
#timer-chip.crit b{color:var(--bad)}
.chip .pulse{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
#prog{height:9px;background:#0a0f19;border:1px solid var(--line);border-radius:999px;margin-top:9px;overflow:hidden}
#prog-fill{height:100%;width:0;background:linear-gradient(90deg,#1d7f96,var(--acc));transition:width .45s ease;border-radius:999px}
#pause-status{min-height:0;margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
.pflag{font-size:13px;font-weight:600;border-radius:7px;padding:3px 10px;border:1px solid}
.pflag.manual{color:var(--warn);background:var(--warnbg);border-color:#8a6a3a}
.pflag.review{color:var(--acc);background:var(--accbg);border-color:#2b8aa3}
/* ---------- navigator ---------- */
#nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:8px 0 12px}
.nbtn{min-height:44px;min-width:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px;font-variant-numeric:tabular-nums;position:relative;transition:background .2s}
.nbtn:hover{background:#1b2a45}
.nbtn .st{display:block;font-size:10.5px;line-height:1;margin-top:1px;color:var(--mut)}
.nbtn.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.nbtn.ok{background:rgba(99,217,143,.15);border-color:#2f7a4f}
.nbtn.part{background:var(--warnbg);border-color:#8a6a3a}
.nbtn.zero{background:var(--badbg);border-color:#8a4a44}
.nbtn.skip{background:var(--warnbg);border-color:#8a6a3a;border-style:dashed}
/* ---------- keyword panel ---------- */
#kw-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0 12px}
/* ---------- exercise card ---------- */
#stagewrap{position:relative}
#pause-cover{position:absolute;inset:-6px;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,12,20,.55)}
#pause-cover[hidden]{display:none}
.pause-card{background:#101a2c;border:2px solid var(--warn);border-radius:14px;padding:26px 34px;text-align:center;max-width:420px}
.pause-big{font-size:22px;font-weight:800;color:var(--warn);letter-spacing:.04em;margin:0 0 6px}
#card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:filter .3s}
#card.blurred{filter:blur(7px)}
.ex-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.theme-badge{font-size:12.5px;font-weight:600;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--panel2)}
.ex-count{margin-left:auto;color:var(--mut);font-size:13.5px;font-variant-numeric:tabular-nums}
.blk{border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden}
.blk-h{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);background:#0d1929;border-bottom:1px solid var(--line);padding:6px 13px}
.blk-b{padding:11px 14px}
.blk.scen{border-left:4px solid var(--acc2)}
.blk.q{border-left:4px solid var(--warn);background:#131e31}
.blk.ans{border-left:4px solid #35507c;background:#101a2c}
.blk-b p{margin:.35em 0}
pre.mono, .mono{font-family:var(--mono);font-size:14px}
/* ---------- log viewer ---------- */
.logbox{background:#0a0f19;border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-family:var(--mono);font-size:14px;line-height:1.5;overflow-x:auto;max-height:340px;overflow-y:auto}
.logbox .ln{white-space:pre;display:block}
.tok-ts{color:#7fa3c0}
.lv-ERROR,.lv-ERR,.lv-FATAL,.lv-CRITICAL,.lv-CRIT,.lv-EMERG,.lv-EMERGENCY{color:var(--bad);font-weight:700}
.lv-WARNING,.lv-WARN{color:var(--warn);font-weight:600}
.lv-INFO,.lv-NOTICE{color:#8fd0dd}
.lv-DEBUG{color:var(--mut)}
.logfilter{display:flex;gap:8px;align-items:center;margin:8px 0 6px}
.logfilter input{background:#0a0f19;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px 12px;min-height:44px;flex:1;font-family:var(--mono);font-size:14px}
.logfilter .fcount{color:var(--mut);font-size:13px;white-space:nowrap}
.logline-off{display:none}
/* ---------- config (spot) ---------- */
.cfg{font-family:var(--mono);font-size:14px}
.cfgline{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:7px;padding:8px 9px;min-height:44px;font-family:var(--mono);font-size:14px;color:var(--tx)}
.cfgline:hover{background:#152238;border-color:var(--line)}
.cfgline .no{color:var(--mut);min-width:26px;text-align:right;user-select:none}
.cfgline.mark{background:var(--accbg);border-color:#2b8aa3}
.cfgline.ok{background:var(--okbg);border-color:#2f7a4f}
.cfgline.bad{background:var(--badbg);border-color:#8a4a44}
.cfgline.miss{background:var(--warnbg);border-color:#8a6a3a}
.cfgline .tag{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
/* ---------- table / heatmap / spark ---------- */
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 10px;text-align:right;font-size:14px}
.tbl th{background:#0d1929;color:var(--acc);font-size:13px}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-family:var(--mono)}
.heat{display:grid;gap:5px;font-variant-numeric:tabular-nums}
.heat .hcell{border-radius:7px;padding:9px 7px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line2)}
.heat .hcell b{font-size:15px}
.heat .hcell span{font-size:11.5px;color:#0c1420;font-weight:700}
.heat .hlab{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;min-height:44px}
.heat .hcol{color:var(--acc);font-size:12.5px;font-weight:700}
.h0{background:#173348}.h1{background:#7fb3c9}.h2{background:#e8c46b}.h3{background:#e0705f}
.h0 b{color:#cfe4ef}.h1 b,.h2 b,.h3 b{color:#101a2c}
.h0 span{visibility:hidden}
.spark{display:flex;flex-wrap:wrap;gap:12px}
.spark .sch{flex:1 1 240px;background:#0a0f19;border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
.spark .sch h4{margin:0 0 4px;font-size:13px;color:var(--acc);font-weight:600}
.spark .sch .snote{color:var(--mut);font-size:12.5px;margin:4px 0 0;font-family:var(--mono)}
.ticket{background:#101f18;border:1px solid #2f5c44;border-left:4px solid #3f9c6b;border-radius:9px;padding:10px 14px;font-size:14.5px}
.ticket .tid{color:var(--ok);font-weight:700;font-family:var(--mono);font-size:13.5px}
/* ---------- options (qcm/multi) ---------- */
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:7px 0;min-height:44px;transition:background .2s,border-color .2s}
.opt:hover{border-color:#4a6ea6;background:#152238}
.opt .box{flex:0 0 auto;width:22px;height:22px;border:2px solid #4a6ea6;border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent;background:#0a0f19}
.opt.multi .box{border-radius:5px}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.sel .box{border-color:var(--acc);color:var(--acc)}
.opt.ok{border-color:#2f7a4f;background:var(--okbg)}
.opt.ok .box{border-color:var(--ok);color:var(--ok)}
.opt.bad{border-color:#8a4a44;background:var(--badbg)}
.opt.bad .box{border-color:var(--bad);color:var(--bad)}
.opt.miss{border-color:#8a6a3a;background:var(--warnbg)}
.opt.miss .box{border-color:var(--warn);color:var(--warn)}
.opt .mark{margin-left:auto;font-weight:700;font-size:13.5px;white-space:nowrap;align-self:center}
.opt.ok .mark{color:var(--ok)}.opt.bad .mark{color:var(--bad)}.opt.miss .mark{color:var(--warn)}
/* ---------- bank ---------- */
.slots{display:inline;flex-wrap:wrap}
.slot{display:inline-block;min-width:96px;min-height:44px;margin:3px 4px;padding:4px 12px;border-radius:8px;border:1px dashed #4a6ea6;background:#0a0f19;color:var(--acc);font-weight:600;text-align:center}
.slot.filled{border-style:solid;color:var(--tx)}
.slot.ok{border-color:#2f7a4f;background:var(--okbg);color:var(--ok)}
.slot.bad{border-color:#8a4a44;background:var(--badbg);color:var(--bad)}
.slot.miss{border-color:#8a6a3a;background:var(--warnbg);color:var(--warn)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wtok{background:#152238;border:1px solid #35507c;border-radius:999px;padding:9px 15px;min-height:44px;font-weight:600;transition:background .2s}
.wtok:hover{background:#1e2f4f}
.wtok.active{border-color:var(--acc);background:var(--accbg);color:var(--acc)}
.wtok.used{opacity:.32;cursor:default}
.wtok.ok{border-color:#2f7a4f;background:var(--okbg)}
/* ---------- match ---------- */
.mrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.mlabel{flex:1 1 260px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;min-height:44px}
.mdrop{flex:1 1 220px;min-height:44px;border:1.5px dashed #4a6ea6;border-radius:10px;background:#0a0f19;display:flex;align-items:center;gap:8px;padding:4px 10px}
.mdrop.over{border-color:var(--acc);background:var(--accbg)}
.mdrop.ok{border-color:#2f7a4f;background:var(--okbg)}
.mdrop.bad{border-color:#8a4a44;background:var(--badbg)}
.mdrop .ph{color:#8fa3bd;font-size:13.5px}
.mchip{display:inline-flex;align-items:center;gap:7px;background:#152238;border:1px solid #35507c;border-radius:8px;padding:6px 10px;min-height:44px;font-size:14px}
.mchip .x{background:none;border:none;color:var(--bad);font-weight:800;min-width:44px;min-height:44px;font-size:16px}
.mpool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* ---------- order / rank ---------- */
.orow{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;min-height:44px}
.orow.over{border-color:var(--acc);background:var(--accbg)}
.orow .rank{font-weight:800;color:var(--acc);min-width:26px;font-variant-numeric:tabular-nums}
.orow .obody{flex:1}
.orow.ok{border-color:#2f7a4f;background:var(--okbg)}
.orow.bad{border-color:#8a4a44;background:var(--badbg)}
.obtns{display:flex;gap:5px}
.obtn{background:#152238;border:1px solid var(--line);border-radius:7px;min-width:44px;min-height:44px;font-size:15px}
.obtn:hover{background:#1e2f4f}
.orow[draggable=true]{cursor:grab}
/* ---------- categorize ---------- */
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px}
.bucket{background:var(--panel2);border:1.5px dashed #4a6ea6;border-radius:11px;padding:10px;min-height:110px}
.bucket.over{border-color:var(--acc);background:var(--accbg)}
.bucket h4{margin:0 0 8px;font-size:13.5px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.bucket.ok{border-color:#2f7a4f}.bucket.bad{border-color:#8a4a44}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;min-height:48px}
/* ---------- terminal ---------- */
.term{background:#05080d;border:1px solid #1f3049;border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:14px;line-height:1.55}
.term .tout{white-space:pre-wrap;word-break:break-word;color:#b9d7de;min-height:20px}
.term .tcmdline{display:flex;gap:8px;align-items:center;margin-top:6px}
.term .tps{color:var(--ok);font-weight:700;white-space:nowrap}
.term input{flex:1;background:transparent;border:none;color:var(--tx);font-family:var(--mono);font-size:14px;min-height:44px}
.term input:focus-visible{outline:2px solid var(--acc);border-radius:4px}
.term .terr{color:var(--bad)}
.term .tok2{color:var(--ok)}
/* ---------- branch ---------- */
.stage{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:10px 0;background:var(--panel2)}
.stage h4{margin:0 0 6px;font-size:13px;color:var(--warn);text-transform:uppercase;letter-spacing:.06em}
.stage .outc{border-left:3px solid var(--acc2);padding:7px 11px;margin:8px 0 2px;background:#0d1725;border-radius:0 8px 8px 0;color:var(--mut);font-size:14.5px}
.stage .outc.okc{border-color:#2f7a4f;color:#bfe8cf}
.stage .outc.badc{border-color:#8a4a44;color:#f0c3bf}
/* ---------- actions / hint / verdict ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.hintbox{background:var(--warnbg);border:1px solid #8a6a3a;border-radius:10px;padding:10px 14px;margin:10px 0;color:#f3ddb3}
.hintbox .hlab{font-weight:800;font-size:12.5px;letter-spacing:.07em;color:var(--warn)}
.verdict{border-radius:11px;border:1px solid var(--line);padding:13px 16px;margin:12px 0 2px}
.verdict.v-ok{background:var(--okbg);border-color:#2f7a4f}
.verdict.v-part{background:var(--warnbg);border-color:#8a6a3a}
.verdict.v-bad{background:var(--badbg);border-color:#8a4a44}
.verdict .vhead{font-weight:800;font-size:16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.verdict .vscore{font-variant-numeric:tabular-nums}
.verdict .vexp{margin-top:8px;border-top:1px solid var(--line2);padding-top:8px}
.verdict .vexp p{margin:.4em 0;color:#d9e5f2}
.verdict .vtip{margin-top:8px;font-size:14px;color:#f3ddb3;background:rgba(255,196,107,.09);border:1px dashed #8a6a3a;border-radius:8px;padding:8px 12px}
.locknote{color:var(--mut);font-size:13.5px;margin-top:6px}
/* ---------- multi-task terminal ---------- */
.ttasks{margin:0 0 10px;padding-left:24px}
.ttasks li{margin:5px 0;font-size:14.5px}
.ttasks li.tok-ok{color:var(--ok);font-weight:600}
.ttasks li.tok-bad{color:var(--bad);font-weight:600}
.ttasks .tmark{display:inline-block;min-width:20px;font-weight:800}
/* ---------- logv ---------- */
.logpick .cfgline{border-radius:7px}
.logpick .ltxt{flex:1;white-space:pre;overflow-x:auto;text-align:left}
.logpick .cfgline .tagwrap{margin-left:auto}
/* ---------- header extras ---------- */
#theme-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
#theme-strip .tchip{font-size:12.5px;padding:3px 11px}
.tchip.done{border-color:#2f7a4f}
.chip.cand{color:var(--acc);border-color:#2b8aa3}
.ver-line{color:var(--mut);font-size:13.5px;margin:10px 0 0}
.cflag{color:var(--mut)}
/* ---------- foot nav ---------- */
#foot{display:flex;justify-content:space-between;gap:10px;margin:14px 0 6px}
/* ---------- review / results ---------- */
.rev-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:12px 0}
.res-hero{border-radius:16px;padding:26px 24px;text-align:center;border:2px solid;margin-bottom:14px}
.res-hero.pass{background:linear-gradient(165deg,#0f2b1d,#0c1a26);border-color:#3f9c6b}
.res-hero.fail{background:linear-gradient(165deg,#2b1412,#1a0f16);border-color:#9c4a42}
.res-hero .seal{font-size:44px;line-height:1}
.res-hero h2{font-size:26px;margin:8px 0 4px}
.res-hero.pass h2{color:var(--ok)}
.res-hero.fail h2{color:var(--bad)}
.res-hero .bigpct{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tx)}
.res-hero .sub{color:var(--mut)}
.res-hero .cert-line{margin-top:10px;font-size:14px;color:var(--mut);border-top:1px dashed var(--line2);padding-top:10px}
.theme-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--mut)}
.tchip b{color:var(--acc)}
.skipnote{background:var(--warnbg);border:1px solid #8a6a3a;border-radius:10px;padding:10px 14px;color:#f3ddb3;font-size:14.5px;margin:10px 0}
.report{margin-top:8px}
.report details{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden}
.report summary{cursor:pointer;padding:11px 15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:44px;list-style:none}
.report summary::-webkit-details-marker{display:none}
.report summary:hover{background:#152238}
.report .rlabel{font-size:12px;font-weight:800;border-radius:6px;padding:2px 9px;letter-spacing:.05em}
.rlabel.full{background:var(--okbg);color:var(--ok);border:1px solid #2f7a4f}
.rlabel.partial{background:var(--warnbg);color:var(--warn);border:1px solid #8a6a3a}
.rlabel.zero{background:var(--badbg);color:var(--bad);border:1px solid #8a4a44}
.rlabel.skipped{background:var(--warnbg);color:var(--warn);border:1px dashed #8a6a3a}
.report .rpts{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px}
.report .rbody{border-top:1px solid var(--line);padding:12px 16px}
.report .rbody h5{margin:.5em 0 .2em;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--acc)}
.report .rbody p{margin:.25em 0;font-size:14.5px;color:#d5e1ef}
.report .rxp{border-top:1px dashed var(--line2);margin-top:9px;padding-top:8px}
.ansline{font-family:var(--mono);font-size:14px;color:var(--mut);word-break:break-word}
/* ---------- responsive ---------- */
@media (max-width:760px){
  #app{padding:10px 10px 50px}
  .hdr-row{gap:6px}
  #hdr{margin:0 -10px 8px;padding-left:10px;padding-right:10px}
  .blk-b{padding:10px 11px}
  .btn{padding:9px 13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<body>
<div id="app">
  <section id="scr-intro" class="screen" aria-label="Exam introduction"></section>

  <section id="scr-exam" class="screen" hidden aria-label="Exam">
    <header id="hdr">
      <div class="hdr-row">
        <div id="hdr-title"></div>
        <div class="hdr-stats">
          <span class="chip cand" id="cand-chip" hidden></span>
          <span class="chip" title="Live score in points">Score <b id="score-val">0</b><span id="score-max"></span></span>
          <span class="chip" id="timer-chip" title="Time remaining">Time <b id="timer-val">--:--</b></span>
          <button class="hbtn" id="btn-kw" type="button" aria-expanded="false">Keywords</button>
          <button class="hbtn warn" id="btn-pause" type="button">Pause</button>
          <button class="hbtn" id="btn-finish" type="button">Finish</button>
        </div>
      </div>
      <div id="prog" role="progressbar" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="prog-fill"></div></div>
      <div id="theme-strip" aria-label="Progress per theme"></div>
      <div id="pause-status" aria-live="polite"></div>
    </header>

    <nav id="nav" aria-label="Question navigator"></nav>
    <div id="kw-panel" hidden></div>

    <div id="stagewrap">
      <div id="pause-cover" hidden>
        <div class="pause-card" role="dialog" aria-label="Manual pause">
          <p class="pause-big">PAUSED (manual)</p>
          <p>The exercise is hidden while the timer is stopped.<br>Press Resume to continue working.</p>
          <button class="btn primary" id="btn-resume" type="button">Resume</button>
        </div>
      </div>
      <article id="card" aria-live="polite"></article>
    </div>

    <div id="foot">
      <button class="btn" id="btn-prev" type="button">&#9664; Prev</button>
      <button class="btn primary" id="btn-next" type="button">Next &#9654;</button>
    </div>
  </section>

  <section id="scr-review" class="screen" hidden aria-label="Review before submit"></section>
  <section id="scr-results" class="screen" hidden aria-label="Final results"></section>
</div>
<script>
'use strict';
/* ===== Cloud+ 3.3 Observability — extracted keywords, grouped by theme (shown in BOTH files) ===== */
var KW = [
  ['Metrics & Telemetry','CPU utilization, memory utilization, disk IOPS, disk queue depth, storage latency, network throughput, bandwidth, network latency (RTT), packet loss, TCP retransmission, error rate, application response time, saturation, connection count'],
  ['Collection & Tools','agent-based monitoring, agentless monitoring, SNMP (poll vs trap, OID, v2c vs v3), syslog (facility, severity, UDP 514, TLS 6514), NetFlow/sFlow/IPFIX, packet capture, Amazon CloudWatch, Azure Monitor, Google Cloud Operations, pull vs push, polling interval'],
  ['Logging','application log, system log, audit log, VPC flow log, log levels (DEBUG to FATAL), log aggregation / SIEM, retention, log rotation, structured (JSON) logs, NTP time synchronization for correlation'],
  ['Alerting & Baselines','static threshold, dynamic baseline, anomaly detection, alert fatigue, deduplication and suppression, severity levels P1 to P4, escalation policy, on-call rotation, flapping alarms, maintenance window'],
  ['Visualization & Reporting','dashboard, heatmap, time-series graph, trend analysis, p95 / p99 percentiles, capacity report, uptime report'],
  ['Availability & SLA','SLA, SLO, SLI, error budget, the nines (99.9% / 99.99% / 99.999%), downtime math, RTO, RPO, service credits, availability formula'],
  ['Scaling & Optimization','autoscaling, scale-out / scale-in, scale-up / scale-down, horizontal vs vertical scaling, trigger condition, cooldown, right-sizing, scheduled scaling, predictive scaling, load balancer health check'],
  ['Performance Testing & APM','load test, stress test, soak test, synthetic monitoring, real user monitoring (RUM), APM, distributed tracing (trace / span), USE method, RED method']
];
/* ===== per-file constants ===== */
var SEV = 'HARD';
var EXAM_MINUTES = 60;
var EXAM_LABEL = 'Cloud+ 3.3 — Observability (HARD practice exam)';
var EXAM_LABEL_SHORT = 'Cloud+ 3.3 Observability';
var EXAM_SUB = 'CompTIA Cloud+ (CV0-004) · Chapter 3.3 — monitor cloud resources to ensure performance and availability. Every exercise here is HARD severity: subtle distractors, near-miss answers, multi-step reasoning across artifacts, and cases where the obvious answer is wrong.';
var PROMPT = 'analyst@bastion:~$';

var EXAMS = [
{ id:'H01', th:'Visuals', ty:'multi', ti:'The spike the average hides',
  sc:"An e-learning platform. Users reported slowness between 09:00 and 09:20. The manager shrugs: 'The average latency was around 0.55 s all morning — nothing happened.' You pull the latency heatmap below (5-minute buckets, all in milliseconds) and note the error rate stayed flat at 0.3% — slowness, not breakage.",
  ar:[{ k:'heat', name:'Checkout latency per 5-min bucket (ms)', cols:['08:45','09:00','09:05','09:10','09:15','09:20'],
    rows:[
      ["average",[520,540,610,580,545,530]],
      ["p95",[560,890,2400,1900,575,555]],
      ["p99",[610,1900,9100,6400,620,600]]],
    note:"Values are milliseconds. p95 = 5% of requests were slower than this; p99 = the slowest 1%." }],
  q:"Select all statements this panel supports.",
  hint:"p95 means 5% of requests were even slower. Compare p99 with the average in the same bucket.",
  tip:"Percentiles (p95/p99) reveal pain that averages smooth away — put both on the dashboard, alarm on the percentile.",
  ex:"Averages mix fast and slow requests, so a small slow fraction barely moves them — that is why the manager saw 'nothing'. The p95 of 2.4 s and p99 of 9.1 s in the 09:05 bucket prove a real tail-latency event between 09:00 and 09:15. The panel does not show that every user suffered — many requests stayed fast, which is exactly why the average stayed low. Removing averages entirely is an overreaction: they belong next to percentiles.",
  opts:["The averages hide the spike because only a fraction of requests were slow","The p95 shows real user pain from 09:00 to 09:15","The worst bucket is 09:05 — p99 reaches 9.1 s","The panel proves all users were slow for 20 minutes","Averages are always wrong and should be removed from dashboards"],
  ok:[0,1,2] },

{ id:'H02', th:'Logging', ty:'terminal', ti:'Who talks the most?',
  sc:"You are on the bastion host. In your working directory sits flows.txt, a VPC flow log in the format: src dst proto bytes (space-separated, one conversation per line). The security team wants a ranked list.",
  q:"Complete both goals below in the terminal, then press Check. Each goal earns its own share of the points. Choose your own tools — the goals are the output files.",
  hint:"Both goals write a file in the current directory. Sum per key, order numerically biggest first, keep the head of the list for goal 1. For goal 2 you need the number of distinct values in the destination column — remove duplicates, then count.",
  tip:"Learn one aggregation one-liner by heart — the same per-key sum and the same dedupe-then-count pattern work on flows, logs and billing exports.",
  ex:"Goal 1: awk '{a[$1]+=$4} END{for(i in a) print a[i], i}' flows.txt | sort -rn | head -5 > top5.txt — awk sums the fourth field per first-field key, sort -rn orders numerically, head -5 keeps the top, the redirect writes the file. Goal 2: awk '{print $2}' flows.txt | sort -u | wc -l > dst-count.txt (or cut/sort/uniq) — dedupe the destination column, count the survivors. These two shapes — per-key aggregation and dedupe-then-count — are the standard first steps when hunting a noisy or exfiltrating host.",
  tasks:[
    { t:"Produce a file top5.txt containing the 5 source addresses that sent the most bytes (summed over all their lines), biggest first.",
      accept:["^(?=.*flows\\.txt)(?=.*top5\\.txt)(?=.*awk)(?=.*\\$1).*$","^(?=.*flows\\.txt)(?=.*top5\\.txt)(?=.*sort)(?=.*uniq).*$","^(?=.*flows\\.txt)(?=.*top5\\.txt)(?=.*perl).*$"],
      out:"912400 10[.]0[.]1[.]9\n88412 10[.]0[.]1[.]5\n10240 10[.]0[.]3[.]21\n9000 10[.]0[.]2[.]30\n1500 10[.]0[.]1[.]7",
      ex:"awk '{a[$1]+=$4} END{for(i in a) print a[i], i}' flows.txt | sort -rn | head -5 > top5.txt" },
    { t:"Produce a file dst-count.txt containing one number: how many distinct destination addresses appear in flows.txt.",
      accept:["^(?=.*flows\\.txt)(?=.*dst-count\\.txt)(?=.*sort)(?=.*uniq).*$","^(?=.*flows\\.txt)(?=.*dst-count\\.txt)(?=.*awk).*$"],
      out:"37",
      ex:"awk '{print $2}' flows.txt | sort -u | wc -l > dst-count.txt" }
  ],
  badOut:"That pipeline does not produce the required output file from flows.txt." },

{ id:'H03', th:'Alerting', ty:'branch', ti:'Saturday, 03:04',
  sc:"03:04 Saturday. Alarm: checkout p95 3.8 s (baseline 0.4 s). You are alone on call and the store is running a weekend promo.",
  q:"Walk the three-step incident. Each choice shapes what happens next.",
  hint:"Ask 'what changed?' before 'what broke?'. Then find the queue that is filling. Then prove stability before you sleep.",
  tip:"Most Saturday 3 a.m. spikes are self-inflicted — check the change log next to the graph first.",
  ex:"Step 1: the deploy log is the fastest evidence source — a config push at 02:58 lines up with a 03:01 spike, so the cause is on the table in minutes; rolling back a stable 4-day-old deploy adds an unknown state to an existing incident, and waiting costs SLA budget during a promo. Step 2: the pool sits at 198/200, so you reverse the change and watch the pool — usage drops to 40% and p95 returns to baseline, which confirms the cause by reversal. More replicas open more connections and saturate the pool faster, raising max_connections swaps a pool problem for an OOM risk, and muting the alarm blinds you to the proof. Step 3: stability is a window, not a moment — 15 minutes at baseline, then an honest incident entry naming the push as the cause. The deploy log stays untouched: the postmortem depends on it.",
  stages:[
    { p:"First move?",
      opts:[
        { t:"Open the deploy/change log next to the latency graph for 02:30–03:04", ok:true, out:"A config push to the payment service landed at 02:58. The spike starts at 03:01 — the timing lines up." },
        { t:"Roll back the last deployment right away", ok:false, out:"The last deployment was 4 days ago and stable. You now have an unknown state AND the original spike." },
        { t:"Restart the database cluster", ok:false, out:"A three-node restart turns one slow service into a full outage for six minutes. Nothing points at the database yet." },
        { t:"Wait 10 minutes — Saturday spikes often pass", ok:false, out:"The alarm keeps firing and promo customers are hitting checkout. Waiting has no upside and costs SLA budget." } ] },
    { p:"Config push at 02:58 confirmed. db-01 connection pool at 198/200, p95 still climbing. Next?",
      opts:[
        { t:"Roll back the 02:58 config change and watch p95 plus pool usage", ok:true, out:"Pool usage drops to 40% within 4 minutes; p95 returns to baseline at 03:11. Cause confirmed by reversal." },
        { t:"Scale the payment service from 4 to 12 replicas", ok:false, out:"More replicas open more DB connections — the pool saturates faster. Twelve replicas, same problem, bigger bill." },
        { t:"Raise the DB max_connections to 800", ok:false, out:"Each connection costs real RAM; you swap a pool problem for an OOM risk at 03:15." },
        { t:"Mute the alarm until Monday", ok:false, out:"The alarm is your only proof the fix worked. Muting it is flying blind." } ] },
    { p:"Rollback done, p95 back to baseline. Last step before you go back to sleep?",
      opts:[
        { t:"Confirm p95 stays at baseline for 15 minutes, then file the incident naming the config push as cause", ok:true, out:"Stable for 15 minutes, incident filed with a timeline; a config review is scheduled for Monday." },
        { t:"Close the ticket immediately — p95 looked fine once", ok:false, out:"One good minute after a rollback is not stability. The flap would wake you again at 03:30." },
        { t:"Set all checkout alarms to P4 until Monday", ok:false, out:"Lowering severity hides the next regression instead of fixing the cause." },
        { t:"Delete the 02:58 entry from the deploy log to keep it clean", ok:false, out:"Never touch the audit trail — the postmortem depends on it being honest." } ] } ] },

{ id:'H04', th:'Logging', ty:'multi', ti:'09:14 at app-07',
  sc:"order-service died at 09:14. Three artifacts, one morning. Choose only what the evidence supports.",
  ar:[{ k:'log', name:'order-service application log (app-07)', lines:[
    "09:12:01 INFO  config-reloader applied version 418 (3 keys changed)",
    "09:12:40 WARN  order latency p95 900 ms (baseline 300 ms)",
    "09:14:02 ERROR db connection failed: could not connect to db-02:5432",
    "09:14:03 ERROR db connection failed: could not connect to db-02:5432",
    "09:14:05 FATAL order-service exiting: pool init failed"]},
   { k:'log', name:'/var/log/messages (app-07)', lines:[
    "09:10:55 systemd: Started nightly report job",
    "09:11:58 kernel: blk_update_request: I/O error, dev nvme1n1, sector 8812344",
    "09:12:10 kernel: EXT4-fs warning: read-only remount",
    "09:14:05 systemd: order-service.service: Main process exited, code=exited, status=1"]}],
  q:"Select all statements the artifacts support.",
  hint:"Find the first line that is itself a failure. For every other line, ask: cause or echo?",
  tip:"In a chain of red lines, the earliest failing line is usually the cause; the rest are echoes. Config pushes that correlate in time but log a clean apply are weak leads.",
  ex:"The first real failure is the nvme I/O error at 09:11:58, followed by the read-only remount at 09:12:10 — after that the app cannot write or initialize its pool and exits FATAL at 09:14:05. The config push at 09:12:01 correlates with the latency warning but its own log shows a clean apply — a tempting but weaker lead. The FATAL exit is a consequence, not a separate incident. Nothing in either log implicates the report job or db-02 itself. Both sources agree to the second because the hosts are NTP-synchronized — without that time sync, cross-log correlation like this is guesswork.",
  opts:["The nvme I/O error at 09:11:58 started the chain; the read-only remount then broke the app","The 09:12 config push correlates in time but shows a clean apply — a tempting, weaker lead","The FATAL exit is a consequence of the pool failure, not a separate incident","The nightly report job caused the app crash","The config reloader broke the database on db-02"],
  ok:[0,1,2] },

{ id:'H05', th:'Metrics', ty:'match', ti:'Which resource is hurting?',
  sc:"Five symptom sets from one incident review. Match each to where you would investigate first. One card is a distractor.",
  q:"Match each symptom set to its first investigation target.",
  hint:"Two rows point outside the host. Two rows are about queues that are not CPU. One row is the classic memory signature.",
  tip:"A symptom needs two agreeing signals to point at a resource — one metric alone lies.",
  ex:"Queue depth 30 with 40 ms storage latency, IOPS at the limit and iowait 25% = storage. Retransmit 8% with RTT 220 ms = the network path between regions. Swap in/out with rising GC pauses = memory pressure. High p95 with idle CPU and disk points at a shared dependency — usually the database, not this host. Rising pool waits with healthy hardware = connection pool exhaustion, a software limit. The certificate card belongs to outages, not to slowness.",
  pairs:[["Disk queue depth 30, storage latency 40 ms, IOPS at the provisioned limit, iowait 25%","Storage subsystem"],["Retransmit rate 8% with RTT 220 ms","Network path between regions"],["Swap in/out active with rising GC pauses","Memory pressure"],["p95 high with CPU 30% and disk 5%","Shared dependency — look at the database"],["Connection pool waits rising, host hardware healthy","Database pool exhaustion"]],
  extra:["TLS certificate expiry"] },

{ id:'H06', th:'Availability', ty:'bank', ti:'Error budget math',
  sc:"Your SLO says 99.9% of checkout requests succeed over a 28-day window (40,320 minutes). You are presenting the error budget policy. Three numbers are wrong on the slide — fix them from the bank. Three bank entries are distractors.",
  q:"Fill the three blanks.",
  hint:"0.1% of 40,320 — take 1% first, then divide by ten. Then subtract what is already spent.",
  tip:"Error budget = (1 − SLO) × window. Spend it on purpose, not by accident.",
  ex:"1% of 40,320 minutes is 403.2; 0.1% is 40.32, about 40.3 minutes. Burning 25 minutes leaves 40.3 − 25 = 15.3 minutes. The slide's 0.01 belongs to four nines, 4.03 is a decimal slip, and 403.2 is the classic 1% trap. The error budget turns an SLO into a spending rule: when the budget is gone, risky releases stop. It rests on the availability formula — good events divided by total events — which is also what every SLI you measure feeds.",
  tpl:"The allowed failure share is {0}% — that is the error budget. Over 40,320 minutes it equals about {1} minutes of full downtime. After a bad week you have burned 25 minutes of it. The remaining budget is about {2} minutes. When the budget is empty, the policy freezes risky releases until it recovers.",
  slots:["0.1","40.3","15.3"],
  bankX:["0.01","4.03","403.2"] },

{ id:'H07', th:'Testing', ty:'order', ti:'Rebuild the request from spans',
  sc:"Your APM captured one checkout request with trace id 7f3a. The spans arrived unordered in the export — rebuild the request journey.",
  q:"Order the spans from first to last in this trace.",
  hint:"Follow parent and child: gateway forks to auth first, then goes to order, payment, and finally the DB write.",
  tip:"Tracing turns 'slow' into 'slow where, between which two services' — read spans parent to child.",
  ex:"The trace follows one request: client sends POST /checkout, the edge forwards it, the gateway calls auth (which completes before the order work), then the gateway calls order-service, which calls payment-service, which writes to the database, and the response returns. The payment DB write (120 ms of the 214 ms total) is the fat leaf — the first optimization target.",
  items:["Client sends POST /checkout (trace 7f3a)","Edge/CDN forwards to api-gateway (span 4 ms)","api-gateway calls auth-service (span 22 ms)","auth-service verifies the token (child span 9 ms)","api-gateway calls order-service (span 180 ms)","order-service calls payment-service (span 150 ms)","payment-service writes to the DB (child span 120 ms)","Response returns to client (total 214 ms)"] },

{ id:'H08', th:'Scaling', ty:'spot', ti:'Two lines will hurt tonight',
  sc:"Tonight a TV ad airs at 21:00. Review this design for the checkout autoscaling group: p95 is normally 0.4 s, instances boot in about 3 minutes, app warmup adds 40 s. Find the two lines that will hurt tonight.",
  q:"Click the two faulty lines.",
  hint:"One line removes half the fleet on a two-minute dip. One line health-checks the database instead of the instance.",
  tip:"Health checks must test the instance, not the database — and scale-in is always the dangerous direction: be gentler than scale-out.",
  ex:"Line 3 removes 4 instances after a 2-minute dip below 300 ms — half the fleet in one action — so any small recovery wave finds a too-small fleet and p95 spikes again. Line 5's health path runs a full inventory sync and opens 20 DB connections per check; under load it times out (2 s timeout, 3 strikes) and the load balancer pulls healthy instances. Use a lightweight /health endpoint and a gentler scale-in (fewer instances, longer window).",
  lines:["asg: checkout-asg  min 4  max 40","scale-out: p95 latency > 600 ms for 3 min → add 4 instances","scale-in: p95 < 300 ms for 2 min → remove 4 instances","cooldown: 5 minutes (shared)","health-path: /checkout/health   # full inventory sync, opens 20 DB connections per check","health-timing: interval 10 s, timeout 2 s, unhealthy-threshold 3","alarm: scale events → chat channel"],
  wrong:[2,4] },

{ id:'H09', th:'Availability', ty:'multi', ti:'Maintenance, credits, and blind spots',
  sc:"Your SLA with a vendor: 99.9% monthly availability, excluding maintenance announced 5 days ahead. Last month: 20 min planned maintenance (properly announced), 35 min unplanned outage, and 25 min where the vendor's own monitoring agents failed — the platform was actually up, no data was recorded. Month = 43,200 minutes.",
  q:"Select all correct statements.",
  hint:"Availability math uses billable downtime, not the sum of every bad minute. Compute 35 minutes against the month.",
  tip:"Read SLA exclusions before doing math, then separate platform downtime from monitoring blind spots — both matter, but differently.",
  ex:"Planned maintenance is excluded only when the SLA's notice rule was followed — here it was. The unplanned 35 minutes count: 35 ÷ 43,200 = 0.081%, so the uptime report for the month reads about 99.919% — still above 99.9%, so no credit is due. The 25 agent-outage minutes are not downtime, but a monitoring blind spot that must be fixed — you were flying blind, not down; agentless platform-side API metrics kept recording while the in-guest agents failed. Adding 80 total minutes mixes planned, unplanned and blind-spot time.",
  opts:["The 20 planned minutes can be excluded only if the announcement followed the SLA's rules","The 35 unplanned minutes count against availability — about 99.919% for the month, so no credit","The 25 agent-outage minutes are not downtime, but a monitoring blind spot to fix — the vendor's agentless API metrics kept flowing, only the in-guest agents failed","Availability was exactly 99.9%, so no credit applies","The vendor owes a credit because total bad time was 80 minutes"],
  ok:[0,1,2] },

{ id:'H10', th:'Alerting', ty:'cat', ti:'Noise diet',
  sc:"The on-call rotation is burning out — 60 pages last week, a third of them noise: textbook alert fatigue. The retro produced nine actions. Sort them by what they actually fix.",
  q:"Sort each action into its purpose.",
  hint:"Noise = fewer pages. Detection = catch what you currently miss. Hygiene = the humans and their rules.",
  tip:"A healthy alerting program works all three buckets — most exhausted teams need the noise bucket first.",
  ex:"Noise cutting: deduplicate, group related alarms into one incident, silence the announced maintenance window. Detection: add the missing pool alarm, replace fixed thresholds with baselines, add synthetic checks for the top journeys. Escalation hygiene: acknowledge then escalate after 15 minutes, page the secondary when the primary misses the page, review the on-call schedule monthly.",
  buckets:["Cut alert noise","Improve detection","Escalation hygiene"],
  citems:["Deduplicate repeated identical alarms","Group related alarms into one incident","Silence alerts during the announced maintenance window","Add a missing alarm for connection-pool saturation","Replace the fixed CPU threshold with a dynamic baseline","Add synthetic checks for the top 3 user journeys","Acknowledge, then escalate after 15 min if unresolved","Page the secondary when the primary does not ack","Review the on-call schedule monthly"],
  ccorrect:[0,0,0,1,1,1,2,2,2] },

{ id:'H11', th:'Collection', ty:'qcm', ti:'Community strings are not security',
  sc:"An audit finding: 40 switches still answer SNMPv2c with community 'public' (read-only) and 'private' (read-write), from any source IP.",
  q:"Which single change fixes the finding best?",
  hint:"v2c communities travel in clear text — changing the word does not change the wire.",
  tip:"SNMPv2c = clear text. SNMPv3 authPriv = authenticated and encrypted, with per-user access.",
  ex:"SNMPv2c sends community strings in clear text, so longer random words still leak on the wire and sniffers see everything. Read-only limits damage but the read-write string remains, and a port change hides nothing from a capture. SNMPv3 authPriv adds authentication and encryption with user-based access views — the actual fix — while restricting source IPs and keeping a sane polling interval are the natural companions.",
  opts:["Move to SNMPv3 with auth and encryption (authPriv) and restrict source addresses","Change the community strings to longer random words","Keep v2c but allow only the read-only community","Move SNMP to UDP port 40161 instead of 161"],
  ok:0 },

{ id:'H12', th:'Alerting', ty:'order', rank:true, ti:'Five alarms, one Saturday',
  sc:"19:40 Saturday, five alarms, one engineer. Notes: (a) checkout API returns 502 for all users, 4 min so far; (b) payment webhook latency 12 s, the bank contract penalizes above 15 s; (c) image CDN p95 up 40%, checkout unaffected; (d) admin panel 502, two internal users affected; (e) docs site slow, marketing content only.",
  q:"Rank from first to last: which alarm do you work first?",
  hint:"First: revenue down. Then: money about to leak on a contract. Internal tools before nice-to-haves.",
  tip:"Rank by revenue, contract penalties, and who is blocked — not by which alarm fired first.",
  ex:"Checkout down stops all revenue — first. The webhook is one minute from a contractual penalty and moves money — second. The admin panel blocks staff but not customers — third. CDN slowness degrades the experience without breaking checkout — fourth. Docs slowness affects nobody's transaction — last. This ordering is severity driven by business impact, exactly what P1–P4 labels should encode.",
  items:["(a) checkout API 502 for all users","(b) payment webhook 12 s — penalty at 15 s","(d) admin panel 502 — two internal users","(c) image CDN p95 up 40% — no checkout impact","(e) docs site slow — marketing only"] },

{ id:'H13', th:'Collection', ty:'bank', ti:'Line, severity, facility, port',
  sc:"Three lines from db-01 during an incident, plus your shipping policy. Fill the blanks — three bank words are distractors.",
  ar:[{ k:'log', name:'/var/log/messages (db-01)', lines:[
    "Jun 11 02:14:01 db-01 postgres[910]: FATAL: the database system is in recovery mode",
    "Jun 11 02:15:40 db-01 kernel: TCP: request_sock_TCP: Possible SYN flooding on port 5432. Sending cookies.",
    "Jun 11 02:16:12 db-01 sshd[4412]: Failed password for root from 198[.]51[.]100[.]9 port 41022"]}],
  q:"Fill the six blanks.",
  hint:"Postgres FATAL means a failed session, not a dead system — one step milder than crit. SYN = connection flood. kern = kernel, auth = login programs. TLS syslog is on 6514.",
  tip:"Know the 0–7 severity ladder and the three facilities you meet daily: kern, auth, daemon.",
  ex:"Postgres FATAL means the session or connection died — it maps to syslog err, numeric 3, one step milder than crit (2), which is reserved for system-wide trouble. The SYN-flood line was written by the kernel, so the facility is kern. The sshd line belongs to the auth facility. Your policy ships over TLS to port 6514, so plain UDP 514 is not allowed. Recovery plus a SYN flood on 5432 points at a connection flood as the trigger.",
  tpl:"The postgres FATAL line maps to syslog severity {0} (0=emerg … 7=debug). The SYN-flooding message uses facility {1}. The sshd failed-password line belongs to facility {2}. Your policy ships all logs over TLS to port {3}, so plain UDP {4} is not allowed. The recovery FATAL plus the SYN flood on 5432 suggests the incident started with a connection {5}.",
  slots:["3","kern","auth","6514","514","flood"],
  bankX:["crit","mail","0"] },

{ id:'H14', th:'Visuals', ty:'qcm', ti:'The alarm that never sleeps',
  sc:"An alarm on average latency never fires, yet users complain every day at lunchtime. The dashboard shows: average 380 ms all day; p95 baseline 700 ms, 2.4 s at lunch for about 40 minutes.",
  q:"What is the best fix?",
  hint:"The users who complain ARE the tail. Measure where they live.",
  tip:"Alarm on a percentile plus a duration; averages are for trends, not for paging.",
  ex:"The average hides the lunchtime tail — that is why it never fires. Alarming on p95 with a baseline-aware threshold (for example two times baseline for 10 minutes) measures the experience of the slowest 5% — exactly the complaining users — while avoiding false pages the rest of the day. Lowering the average threshold only makes it noisy, sampling fewer requests hides the problem, and deleting the lunchtime data hides the incident instead of the alarm.",
  opts:["Alarm on p95 with a baseline-aware threshold, e.g. 2× baseline for 10 minutes","Alarm on the average with a lower threshold","Sample fewer requests so the average drops","Remove the lunchtime data as an outlier"],
  ok:0 },

{ id:'H15', th:'Scaling', ty:'branch', ti:'The thrashing group',
  sc:"The orders ASG runs on Amazon CloudWatch alarms (the same design maps 1:1 to Azure Monitor or Google Cloud Operations): CPU oscillates 60 → 92 → 58 every 4 minutes; the group adds 2 instances, removes 2, adds again. The instance-count graph is a perfect sawtooth. Policy: scale-out CPU > 70% for 2 min; scale-in CPU < 55% for 2 min; cooldown 120 s; boot-to-ready about 4 min; request rate is smooth.",
  q:"Walk the three-step diagnosis. Each choice shapes what happens next.",
  hint:"The group lies to itself while instances boot. Fix the reaction speed, then prove stability over a real day.",
  tip:"Scaling policy timing must exceed instance boot time — cooldown, windows, all of it.",
  ex:"Step 1: the group is reacting to its own half-booted instances — new machines need about 4 minutes to carry load, but the policy re-measures after 2, flips direction, and the sawtooth appears. The per-instance CPU graphs and the smooth request rate rule out bad metrics and real traffic swings. Step 2: make the policy slower than reality — wider windows (5 min out, 15 min in), a 10-minute cooldown, and scale-in by 1 so the group cannot overshoot in one step. Disabling scale-in only freezes the bill at a higher level, a lower threshold thrashes sooner, and bigger instances still boot slower than the policy looks. Step 3: verify over a real day — instance count flat through the peak, CPU settling at 60–75%, no sawtooth, and cost per 1k orders flat. Five minutes proves nothing; customers should never be the alarm.",
  stages:[
    { p:"What is actually happening?",
      opts:[
        { t:"Cooldown and windows are shorter than boot time — the group reacts to its own half-booted state", ok:true, out:"New instances need 4 minutes to carry load; the group re-measures at 2 minutes and flips direction. Sawtooth confirmed." },
        { t:"The CPU metric is broken on the instances", ok:false, out:"Per-instance CPU graphs are clean and consistent — the metric is fine, the policy is not." },
        { t:"Traffic is genuinely oscillating that fast", ok:false, out:"The request-rate graph is smooth; only the instance count saws." },
        { t:"Someone is manually resizing the group", ok:false, out:"The activity log shows only autoscaling actions, no human entries." } ] },
    { p:"Which policy change fixes it?",
      opts:[
        { t:"Widen windows (scale-out 5 min, scale-in 15 min), raise cooldown to 10 min, scale in by 1", ok:true, out:"The group stops reacting to its own boot lag; instance count flattens and CPU settles at 62–75%." },
        { t:"Disable scale-in forever", ok:false, out:"The thrash stops but the bill stays inflated every night — a cost bug, not a fix." },
        { t:"Lower the scale-out threshold to 50% for 1 min", ok:false, out:"Now it scales out earlier and more often — thrash with more instances." },
        { t:"Switch the group to a bigger instance type", ok:false, out:"Bigger boxes change nothing about a policy that reacts faster than they can boot." } ] },
    { p:"How do you verify the fix?",
      opts:[
        { t:"Watch for 24 h: stable count, CPU 60–75%, no sawtooth, cost per 1k orders flat", ok:true, out:"Stable across the daily peak; the change is validated with evidence, not hope." },
        { t:"Check once after 5 minutes", ok:false, out:"Five minutes is shorter than the boot window — you would call it fixed while it is not." },
        { t:"Wait for the next outage ticket", ok:false, out:"Customers must not be your monitoring system." },
        { t:"Compare against last month's sawtooth without new data", ok:false, out:"Old graphs cannot prove new behavior." } ] } ] },

{ id:'H16', th:'Testing', ty:'match', ti:'USE and RED',
  sc:"Two 3-letter methods, one for resources and one for services. Pin each word to its question. One card is a distractor.",
  q:"Match each method word to its question.",
  hint:"USE asks about a resource. RED asks about a service. Two words appear in both methods — the context column decides.",
  tip:"USE for infrastructure, RED for endpoints — together they cover both floors of the stack.",
  ex:"USE walks resources (CPU, disk, NIC): utilization asks how busy, saturation asks how much work is queued, errors asks how many operations fail. RED walks services: rate asks requests per second, errors asks which share of requests fail, duration asks how long requests take. The same word 'errors' means a different thing in each method. Replication is a database concept, not part of either method.",
  pairs:[["Utilization (USE)","How busy is the resource, in percent used?"],["Saturation (USE)","How much work is queued and waiting?"],["Errors (USE)","How many resource operations fail?"],["Rate (RED)","How many requests per second reach the service?"],["Errors (RED)","What share of requests to the service fails?"],["Duration (RED)","How long do the service's requests take?"]],
  extra:["Replication (DB)"] },

{ id:'H17', th:'Visuals', ty:'spot', ti:'The lying dashboard',
  sc:"The ops dashboard shows cache-01 memory at 8% — and the host OOM-kills processes daily. Review the panel definition and find the two lines that make it lie.",
  q:"Click the two faulty lines.",
  hint:"One line promises a unit the query does not deliver. One line cuts the drawing above a value the host passed long ago.",
  tip:"A dashboard must state units honestly and must never clip its y-axis below plausible values.",
  ex:"The query returns GiB but the panel labels it percent — 6.5 GiB of 8 GiB renders as '8%', matching the bug. The fixed y-max of 50 would clip real percent spikes too. The OOM alert rule and the 300 s refresh are imperfect hygiene but not why the panel lies today.",
  lines:["panel: cache-01 memory","query: mem_used_gib","unit: percent (0-100)","divide-by: none","chart y-max: fixed 50","legend: show last value","alert rule: OOM events → P2","refresh: every 300 s"],
  wrong:[2,4] },

{ id:'H18', th:'Logging', ty:'terminal', ti:'Time-boxed extraction',
  sc:"You are on the bastion. /var/log/app/orders.log is a JSON-lines log (one JSON object per line, fields: ts, lvl, msg). logrotate archived yesterday's file as /var/log/app/orders.log.1.gz.",
  q:"Complete both goals below in the terminal, then press Check. Each goal earns its own share of the points. Choose your own tools.",
  hint:"The file is gzip-compressed — ordinary text tools see only noise. Think about which reading modes look inside the archive while preserving line order, then redirect each result into its own file.",
  tip:"For anything .gz, reach for the z- tools first; gunzipping production archives by hand invites mistakes. Two extractions from one archive should stay two commands, two files.",
  ex:"zgrep '\"lvl\":\"ERROR\"' /var/log/app/orders.log.1.gz > errors-2026-06-10.txt and zgrep '\"lvl\":\"WARN\"' /var/log/app/orders.log.1.gz > warns-2026-06-10.txt — zgrep (or zcat piped to grep) reads inside gzip archives while keeping line order, and each redirect writes its own target file. Plain grep or cat would read compressed bytes and find nothing. Keeping the two extractions as separate commands keeps both files directly usable in the incident report.",
  tasks:[
    { t:"In one command, extract every line whose lvl is ERROR from yesterday's compressed archive, keep the lines in their original order, and save them to errors-2026-06-10.txt in the current directory.",
      accept:["^(?=.*orders\\.log\\.1\\.gz)(?=.*errors-2026-06-10\\.txt)(?=.*ERROR)(?=.*(zgrep|zcat|gunzip\\s+-c|gzip\\s+-dc)).*$"],
      out:"{\"ts\":\"2026-06-10T09:14:02Z\",\"lvl\":\"ERROR\",\"msg\":\"db connection failed\"}\n{\"ts\":\"2026-06-10T11:40:11Z\",\"lvl\":\"ERROR\",\"msg\":\"payment gateway timeout\"}",
      ex:"zgrep '\"lvl\":\"ERROR\"' /var/log/app/orders.log.1.gz > errors-2026-06-10.txt" },
    { t:"In one command, extract every line whose lvl is WARN from the same archive, keep the original order, and save them to warns-2026-06-10.txt in the current directory.",
      accept:["^(?=.*orders\\.log\\.1\\.gz)(?=.*warns-2026-06-10\\.txt)(?=.*WARN)(?=.*(zgrep|zcat|gunzip\\s+-c|gzip\\s+-dc)).*$"],
      out:"{\"ts\":\"2026-06-10T08:02:41Z\",\"lvl\":\"WARN\",\"msg\":\"retry queue depth 31\"}\n{\"ts\":\"2026-06-10T10:55:03Z\",\"lvl\":\"WARN\",\"msg\":\"db pool usage 97% (pool=40)\"}",
      ex:"zgrep '\"lvl\":\"WARN\"' /var/log/app/orders.log.1.gz > warns-2026-06-10.txt" }
  ],
  badOut:"That command cannot read the .gz archive or does not write the required output file." },

{ id:'H19', th:'Metrics', ty:'multi', ti:'Leak or cache?',
  sc:"cache-01 memory: 20% at 00:00, 34% at 04:00, 49% at 08:00, 63% at 12:00, 78% at 16:00, 91% at 20:00, then OOM kills. Evictions all day: 0. A second cache host shows growth that plateaus at 80% with active evictions and stable latency.",
  q:"Select all statements the data supports.",
  hint:"Ask two questions: does growth ever stop, and is old data ever thrown away?",
  tip:"Leak vs cache = monotonic growth with no eviction vs plateau with eviction.",
  ex:"The first host grows without pause and never evicts — memory is only ever taken, never released: a leak (or a cache with no limit) heading straight into the OOM killer. The second host plateaus and evicts — a cache doing its job. 'Rising memory always means a leak' ignores the plateau evidence on the second host, and OOM kills are a failure mode, not a way caches free memory.",
  opts:["The first host shows unbounded growth with zero evictions — a leak pattern, not a working cache","A healthy cache plateaus and evicts; the second host behaves like one","Zero evictions while memory climbs means old entries are never discarded","Rising memory always means a leak — the second host is also leaking","An OOM kill is the normal way caches free memory"],
  ok:[0,1,2] },

{ id:'H20', th:'Testing', ty:'order', ti:'Test ladder',
  sc:"The platform gets a big marketing push next month. You get one maintenance window to run the full performance test suite. Put the plan in order.",
  q:"Order the performance test plan from first to last.",
  hint:"You need a 'before' picture first; the long slow test comes near the end; the report closes it.",
  tip:"Load proves the promise, stress finds the edge, soak finds the slow rot — and every number needs a baseline.",
  ex:"Capture the baseline first — without it, 'pass' has no reference. Load test at the expected peak and compare with the SLA. Stress beyond the peak finds the breaking point. Soak at peak for hours exposes leaks. Finally, analyze everything and write the capacity report. Running stress before load leaves you with breakage and no expected-peak proof.",
  items:["Capture the current baseline (metrics at normal load)","Load test at the expected peak; compare with the SLA","Stress test beyond peak to find the breaking point","Soak test at peak for hours to expose leaks","Analyze results and write the capacity report"] },

{ id:'H21', th:'Alerting', ty:'bank', ti:'Tune the detector',
  sc:"After a week of alert storms, the team rewrites the detector standard. Fill the five blanks — three bank words are distractors.",
  q:"Fill the five blanks.",
  hint:"One blank is about time patterns, one about the detector's dial, one about missed events, one about storms, one about on-off alarms.",
  tip:"Detector tuning is a balance: too sensitive annoys people, too deaf kills trust.",
  ex:"A dynamic baseline needs about two weeks of history so it learns weekly seasonality. Sensitivity set too high pages on every small wobble — false positives; too low and real incidents slip through. Deduplication collapses identical alarms during storms. Alarms that fire and clear every few minutes are called flapping — widen the 'for' window to calm them. 'Threshold' is the fixed-rule word, not the detector's dial; retention is about keeping data; 'baselines' fits no blank.",
  tpl:"A dynamic baseline needs at least two weeks of history so it learns weekly {0}. If the anomaly detector's {1} is set too high, every small wobble pages someone — false positives. If it is too low, real {2} slip through. During alert storms, {3} collapses identical alarms into one. And alarms that fire and clear every few minutes are called {4} — widen the 'for' window to calm them.",
  slots:["seasonality","sensitivity","incidents","deduplication","flapping"],
  bankX:["threshold","retention","baselines"] },

{ id:'H22', th:'Logging', ty:'multi', ti:'Flow logs at 03:00',
  sc:"You pull the VPC flow log for subnet 10[.]0[.]4[.]0/24 around an alert. The object-store audit log shows a 31 GB archive written to bucket exports-9f2 at 03:00 by the etl-worker role — and that bucket is public. Flow-log retention is 30 days.",
  ar:[{ k:'log', name:'VPC flow log (subnet 10[.]0[.]4[.]0/24)', lines:[
    "03:00:12 10[.]0[.]4[.]19 198[.]51[.]100[.]23 443 8214000 ACCEPT",
    "03:00:14 10[.]0[.]4[.]19 198[.]51[.]100[.]23 443 7940000 ACCEPT",
    "03:00:15 10[.]0[.]4[.]19 198[.]51[.]100[.]23 443 8102000 ACCEPT",
    "03:00:18 10[.]0[.]4[.]19 198[.]51[.]100[.]23 443 8333000 ACCEPT",
    "03:01:02 10[.]0[.]4[.]19 52[.]94[.]76[.]10 443 1540 ACCEPT",
    "03:01:44 203[.]0[.]113[.]9 10[.]0[.]4[.]19 22 220 REJECT",
    "03:01:50 203[.]0[.]113[.]9 10[.]0[.]4[.]19 22 220 REJECT",
    "03:02:03 10[.]0[.]6[.]2 10[.]0[.]4[.]19 9092 33100 ACCEPT"]}],
  q:"Select all statements the artifacts support.",
  hint:"REJECT means it did not get in. Follow the ACCEPTs: where do the bytes go, and who wrote the archive?",
  tip:"Flow logs show who moved how many bytes; audit logs say who did it. Correlate both — and extend retention before an incident, not after.",
  ex:"Four ACCEPTs of roughly 8 MB each to 198[.]51[.]100[.]23 within 15 seconds is a large egress burst from one host — about 32 MB, matching the archive write in the audit log. The port-22 REJECTs are failed probes: REJECT means the connection never happened, so they are noise. Port 9092 carries 33 KB — background chatter, not exfiltration. The audit trail ties the burst to the etl-worker role writing to a public bucket.",
  opts:["Host 10[.]0[.]4[.]19 sent about 32 MB to one external address in 15 seconds — an egress burst","The rejected inbound SSH probes on port 22 are noise, not the incident","The audit log ties the burst to the etl-worker role writing to a public bucket","The REJECT lines prove a brute-force succeeded","Port 9092 traffic is the exfiltration channel"],
  ok:[0,1,2] },

{ id:'H23', th:'Scaling', ty:'qcm', ti:'Health checks during GC',
  sc:"Java checkout nodes pause 2–4 s during garbage collection. Current load balancer health check: interval 5 s, timeout 1 s, unhealthy-threshold 2, endpoint /health (lightweight). During lunch, nodes get pulled while serving fine, then re-added minutes later — a flapping pool.",
  q:"Which change fixes the flapping with the least risk?",
  hint:"The check must outlive the GC pause — but stay cheap.",
  tip:"Tune health checks for the worst NORMAL pause of your application, not the average one.",
  ex:"A 2–4 s pause beats a 1 s timeout twice in a row, so healthy nodes get pulled. Raising the timeout to 5 s, the interval to 10 s, and requiring 5 misses keeps real crashes detected in under a minute while surviving normal GC. A heavier endpoint multiplies the problem, removing health checks turns one bad node into an outage, and faster tighter checks amplify the flapping.",
  opts:["Unhealthy-threshold 5, interval 10 s, timeout 5 s — same lightweight /health endpoint","Timeout 10 s on the inventory-heavy /api/status endpoint","Remove health checks — the LB should never pull nodes","Healthy-threshold 2, interval 2 s — detect failures faster"],
  ok:0 },

{ id:'H24', th:'Scaling', ty:'match', ti:'Scale it — or fix it?',
  sc:"Five findings from one capacity review. Match each to the right first move. One card is a distractor.",
  q:"Match each finding to its correct first move.",
  hint:"Scaling out helps demand problems, not waste problems. Two findings are not scaling problems at all.",
  tip:"Ask 'is demand or waste the problem?' before you touch a scaling rule.",
  ex:"Sustained web CPU at 88% with healthy other tiers = scale out the web tier — horizontal scaling. High DB p95 with idle web CPU and disk means queries stack on one slow query — tune the query first; capacity hides bugs. Constant queue-depth growth = scale out the workers. Swapping memory = right-size to a bigger memory instance (vertical scaling) or fix the leak — scaling out horizontally just replicates the leak onto more nodes. A filling log volume = expand the volume or extend rotation — a vertical fix. Adding DB CPU because the web tier is busy copies the load problem onto the wrong tier.",
  pairs:[["Web CPU 88% for 30 min, NIC throughput 20%, all other tiers healthy","Scale out the web tier"],["DB p95 high, web CPU 30%, disk 5% — one slow query stacks queries","Tune the query before adding anything"],["Worker queue depth growing at a constant rate all morning","Scale out the workers"],["Instance memory 95% with active swapping","Right-size bigger memory or fix the leak — scaling out spreads it"],["Disk 92% and rising on the log volume","Expand the volume or extend rotation — a vertical fix"]],
  extra:["Add CPU to the database because the web tier is busy"] },

{ id:'H25', th:'Availability', ty:'branch', ti:'Growth planning',
  sc:"The orders platform: peak CPU 60% today, traffic grows about 20% per quarter, SLA 99.9%, procurement lead time 6 weeks, next capacity review in 8 weeks.",
  q:"Walk the three planning steps. Each choice shapes the outcome.",
  hint:"Forecast first, act before the line, and keep both a plan and a safety net.",
  tip:"Capacity planning = forecast + lead time + headroom, reviewed on a schedule.",
  ex:"Step 1: build the forecast first — 12 months of peak metrics projected with the 20% quarterly growth says the 70% line is crossed in about two quarters, which turns panic into a scheduled task. Buying double on a guess or copying last year's plan commits budget before the numbers exist. Step 2: act before the line, not at it — right-size the hot tier and land the scale-up two weeks before the crossing, because waiting for 90% puts you inside the SLA breach window with 6-week lead times. Disabling the capacity report blinds the one instrument that saw this coming, and silently weakening the SLA is a business failure. Step 3: combine the mechanisms — quarterly reviews keep the forecast honest, scheduled scaling pre-provisions known peaks, and autoscaling headroom absorbs surprises. Autoscaling with today's max is a ceiling waiting to be hit, one big overbuy drifts idle, and a 3 a.m. page is not a capacity strategy.",
  stages:[
    { p:"What do you build first?",
      opts:[
        { t:"A trend forecast from 12 months of peak metrics, projected with the growth rate", ok:true, out:"The projection crosses 70% peak CPU in about two quarters — inside your planning window." },
        { t:"Buy double capacity now", ok:false, out:"You commit budget on a guess before the numbers are on the table." },
        { t:"Assume the cloud autoscales, so no planning is needed", ok:false, out:"Autoscaling reacts within limits you set — it cannot order quotas, reservations or a bigger DB tier ahead of time." },
        { t:"Copy last year's plan", ok:false, out:"Last year had half the traffic and no SLA penalty clause." } ] },
    { p:"The forecast crosses 70% in two quarters. What now?",
      opts:[
        { t:"Right-size the hot tier and schedule the scale-up before the 70% line", ok:true, out:"The change lands two weeks before the crossing point; peak drops back to 58%." },
        { t:"Wait until CPU hits 90%, then react", ok:false, out:"At 90% you are inside the SLA breach window with 6-week lead times — the math does not close." },
        { t:"Disable the capacity report to save cost", ok:false, out:"The report is the only instrument that saw the crossing coming." },
        { t:"Move the SLA target to 99% silently", ok:false, out:"Changing a customer contract to hide a capacity miss is a business failure, not a plan." } ] },
    { p:"Which combination keeps 99.9% through the growth?",
      opts:[
        { t:"Quarterly capacity reviews + scheduled scaling for known peaks + autoscaling headroom inside limits", ok:true, out:"Known peaks are pre-provisioned, surprises are absorbed by autoscaling, and the review keeps the forecast honest. Predictive scaling can refine the scheduled rules as the forecast improves." },
        { t:"Autoscaling only, with max limits set at today's capacity", ok:false, out:"Max limits are a ceiling — the first real surprise after the ceiling is an outage." },
        { t:"One big yearly overbuy", ok:false, out:"Expensive drift: idle for months, or short when growth beats the guess." },
        { t:"Manual scaling by the on-call engineer", ok:false, out:"A 3 a.m. page is not a capacity strategy." } ] } ] },

{ id:'H26', th:'Availability', ty:'multi', ti:'RPO and RTO do the math',
  sc:"db-02 is corrupted at 13:00. Facts: snapshots every 15 minutes, kept 24 h; nightly backup at 03:00; restoring the last snapshot takes about 20 min; restoring last night's backup takes about 3 h. Business targets: RTO 1 h, RPO 15 min.",
  q:"Select all correct statements.",
  hint:"RPO = how much DATA you lose (time since the last good copy). RTO = how long until you are BACK.",
  tip:"RPO counts minutes of lost data; RTO counts minutes of downtime — different dials, different mechanisms.",
  ex:"Snapshots at 15-minute intervals lose at most 15 minutes of data (RPO) and restore in about 20 minutes (RTO) — both inside target. The nightly backup alone loses up to 10 hours of data — a massive RPO miss — but it covers retention beyond the 24-hour snapshot window, so keep it. RPO measures data loss in time, not restore duration; that is RTO. Yearly archives are a different requirement than intraday recovery.",
  opts:["Snapshot restore meets both targets: RPO 15 min of data loss and RTO about 20 min","The nightly backup alone gives RPO up to 10 h — far beyond the 15 min target","The 03:00 backup is still valuable — snapshots cover 24 h, backups cover longer horizons","RPO measures how long the restore takes","The snapshot chain alone satisfies the yearly archive requirement"],
  ok:[0,1,2] },

{ id:'H27', th:'Alerting', ty:'spot', ti:'Runbook review',
  sc:"Review this alert routing rule set for the payments database. Find the three faulty lines.",
  q:"Click the three faulty lines.",
  hint:"Line 8 tells you how bad lag is. Then look at what happens when nobody reads the email — and how long one alarm can hide its own repeats.",
  tip:"Severity must match consequence, and every page needs a path when the first human misses it.",
  ex:"Replication lag precedes failover problems (line 8), so P4 is a mislabel — it should be P1 or P2 and paged. No escalation means a missed email ends the story. A 24-hour dedup window swallows every repeat of the same lag alarm for a whole day. Lines 6 and 7 are reasonable.",
  lines:["alarm: db-replication-lag > 30 s for 5 min","severity: P4","route: email → billing-oncall","escalation: none","dedup window: 24 h","alarm: db-disk-85%  severity P2  route: pagerduty-primary","quiet hours: 22:00–06:00 suppress P4","note: replication lag often precedes failover problems"],
  wrong:[1,3,4] },

{ id:'H28', th:'Metrics', ty:'qcm', ti:'502s at the edge, green hosts behind',
  sc:"The load balancer reports 5xx at 14% (mostly 502/504) for 10 minutes. Behind it: web hosts serve 200 OK, CPU 35%, and their own p95 view shows 90 ms. The LB's target health log shows alternating healthy/unhealthy for two targets.",
  q:"What is the most likely cause?",
  hint:"The hosts say they are fine; the LB's own view disagrees. Who decides which targets receive traffic?",
  tip:"When tiers disagree, trust the layer that owns the decision — here, the LB's target health log.",
  ex:"The hosts' own metrics are healthy, so overload does not fit; cert expiry would give consistent TLS errors rather than 502/504 bursts; stale DNS is client-side and would not show in the LB log. Alternating healthy/unhealthy for two targets means the load balancer itself is pulling live targets — the classic signature of health checks too strict for the app's normal pauses (GC, warmup) — and clients eat the connection resets as 502/504.",
  opts:["Health-check flapping pulling live targets — the LB drops and re-adds them, and clients eat the resets","The web hosts are overloaded","The clients' DNS is stale","The TLS certificate expired on the targets"],
  ok:0 },

{ id:'H29', th:'Alerting', ty:'order', ti:'Observability from zero',
  sc:"A new platform team inherits 30 microservices and zero dashboards. They get one quarter to build observability properly. Put the plan in order.",
  q:"Order the steps of building observability from zero.",
  hint:"Journeys before tools, data before rules, a fire drill before trust.",
  tip:"Observability is built in this order: meaning → instruments → history → rules → rehearsal → tuning.",
  ex:"First define what 'good' means for users: critical journeys and their SLIs. Then instrument — metrics, logs, traces, plus synthetic checks for the top journeys. Then let baselines form from two weeks of real data. Then define alarms with runbooks and owners. Then run a game day to test alarms and the on-call path before a real incident does. Finally review and tune quarterly — alarms, baselines, coverage.",
  items:["Map the critical user journeys and pick SLI targets for them","Instrument: metrics, logs, traces; add synthetic checks for the top journeys","Collect two weeks of data to build baselines","Define alarms with runbooks and owners","Run a game day to test alarms and the on-call path","Review and tune quarterly (alarms, baselines, coverage)"] },

{ id:'H30', th:'Testing', ty:'qcm', ti:'Anatomy of a trace',
  sc:"In your APM tool, one request shows: api-gateway 214 ms (root span), auth-service 30 ms, order-service 190 ms, payment-service 150 ms (child of order), db-query 120 ms (child of payment).",
