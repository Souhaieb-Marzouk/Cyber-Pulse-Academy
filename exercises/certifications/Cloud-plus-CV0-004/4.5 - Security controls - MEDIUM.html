<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1b2230;--line:#30363d;--txt:#e6edf3;--dim:#9aa7b3;--acc:#58a6ff;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
#app{max-width:1000px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
a{color:var(--acc)}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:14px 0 8px}
p{margin:.4em 0}
.dimtx{color:var(--dim)}
code,.mono{font-family:var(--mono);font-size:14px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
/* header */
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.htl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.htitle{font-weight:700}
.htr{display:flex;gap:10px;align-items:center}
.clock{font-family:var(--mono);font-size:16px;border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:var(--panel2);min-width:96px;text-align:center}
.clock.frozen{color:var(--warn);border-color:var(--warn)}
.who{color:var(--dim);font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:13px;letter-spacing:.5px;border:1px solid}
.badge.med{color:#0d1117;background:#58a6ff;border-color:#58a6ff}
.badge.hard{color:#fff;background:#bc8cff;border-color:#bc8cff}
.pbar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow:hidden}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#1f6feb,#3fb950);transition:width .4s}
.meta-row{font-size:14px;gap:8px}
.score{font-weight:700;color:var(--acc)}
.spacer{flex:1}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.nav{width:44px;min-width:44px;min-height:44px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14px;font-family:var(--mono);cursor:pointer;padding:0 2px}
.nav.td{opacity:.62}
.nav.cur{outline:2px solid var(--acc);outline-offset:1px}
.nav.ok{background:#0f2e1a;border-color:var(--ok);color:var(--ok);opacity:1}
.nav.part{background:#332209;border-color:var(--warn);color:var(--warn);opacity:1}
.nav.bad{background:#3d1214;border-color:var(--bad);color:var(--bad);opacity:1}
.nav.skip{background:#332209;border-color:var(--warn);color:var(--warn);border-style:dashed;opacity:1}
.pausenote{margin-top:10px;border:1px solid var(--warn);color:var(--warn);background:#2a2007;border-radius:6px;padding:8px 12px;font-size:14px}
/* buttons */
.btn{min-height:44px;min-width:44px;padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:15px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:700}
.btn.ok{background:#238636;border-color:#238636;color:#fff;font-weight:700}
.btn.warn{background:#7a4d00;border-color:#9e6a03;color:#fff}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:5px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* stage blocks */
.extitle{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.qnum{font-family:var(--mono);color:var(--acc);font-weight:700}
.kwchip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--dim)}
.banner{border:1px solid #1f4e8c;background:#0e1c33;border-left:5px solid #1f6feb;border-radius:8px;padding:12px 14px;margin:10px 0}
.banner .lab,.qblock .lab,.answers .lab{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--acc);margin-bottom:6px}
.qblock{border:1px solid #6a4c00;background:#2a2007;border-left:5px solid var(--warn);border-radius:8px;padding:12px 14px;margin:10px 0}
.qblock .lab{color:var(--warn)}
.answers{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--panel2)}
.answers .lab{color:var(--ok)}
.art{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:#0a0e14}
.art .ahead{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.art .alab{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--dim)}
.filterbox{font-family:var(--mono);font-size:14px;background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px;width:min(320px,60vw)}
.logbox{font-family:var(--mono);font-size:14px;padding:8px 0;max-height:340px;overflow:auto}
.logline{display:block;width:100%;text-align:left;background:none;border:0;color:#c9d1d9;font-family:var(--mono);font-size:14px;padding:6px 12px;min-height:32px;line-height:1.45;cursor:default}
button.logline{cursor:pointer;min-height:44px}
button.logline:hover{background:#131a24}
.logline .t{color:#79c0ff}
.logline .lvl-err{color:var(--bad);font-weight:700}
.logline .lvl-warn{color:var(--warn);font-weight:700}
.logline .lvl-ok{color:var(--ok)}
.logline .tok{color:#bc8cff}
.codebox{font-family:var(--mono);font-size:14px;padding:10px 0}
.codebox .logline{color:#c9d1d9}
/* options */
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer;min-height:44px;background:var(--panel)}
.opt:hover{border-color:var(--acc)}
.opt input{width:18px;height:18px;margin-top:3px;accent-color:#1f6feb;flex:none}
.opt.mark-ok{border-color:var(--ok);background:#0f2e1a}
.opt.mark-bad{border-color:var(--bad);background:#3d1214}
.opt.mark-miss{border-color:var(--warn);background:#332209}
.optmark{margin-left:auto;font-weight:800;font-size:14px;flex:none}
.optmark.ok{color:var(--ok)}
.optmark.bad{color:var(--bad)}
.optmark.miss{color:var(--warn)}
.locked .opt,.locked .chip,.locked .blank,.locked .linebtn,.locked .orditem button{pointer-events:none}
/* chips / drag & drop */
.ddwrap{display:flex;gap:14px;flex-wrap:wrap}
.bank{flex:1 1 260px;border:1px dashed var(--line);border-radius:8px;padding:8px;min-height:64px}
.bank .zlab{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--dim)}
.chip{display:block;width:100%;text-align:left;min-height:44px;margin:6px 0;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:14px;cursor:grab;font-family:inherit}
.chip.sel{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:1px}
.chip:disabled{cursor:default}
.zones{flex:2 1 320px;display:grid;gap:10px}
.zone{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;min-height:64px}
.zone>.zlab{font-weight:700;color:var(--acc);display:block;margin-bottom:4px}
.zone.mk-ok{border-color:var(--ok)}
.zone.mk-bad{border-color:var(--bad)}
/* ordering */
.ordlist{list-style:none;margin:0;padding:0}
.orditem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:8px 0;padding:6px 10px;min-height:52px}
.orditem .otext{flex:1}
.orditem .opos{font-family:var(--mono);color:var(--warn);font-size:13px;min-width:30px;text-align:right;flex:none}
.mvbtn{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:16px;cursor:pointer}
.orditem.mk-ok{border-color:var(--ok)}
.orditem.mk-bad{border-color:var(--bad)}
/* fill */
.filltext{font-size:15px;line-height:2.1}
.blank{display:inline-block;min-width:110px;min-height:44px;border:1px dashed var(--acc);border-radius:8px;background:#0e1c33;color:var(--txt);font-family:var(--mono);font-size:14px;padding:4px 10px;vertical-align:middle;cursor:pointer;text-align:left}
.blank.filled{border-style:solid;background:var(--panel2)}
.blank.mk-ok{border-color:var(--ok);background:#0f2e1a}
.blank.mk-bad{border-color:var(--bad);background:#3d1214}
.blank.mk-empty{border-color:var(--warn);background:#332209}
.wbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wbank .chip{width:auto;display:inline-block;margin:0}
.wbank .chip.used{opacity:.35}
/* terminal */
.term{background:#010409;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono)}
.termout{font-family:var(--mono);font-size:14px;color:#7ee787;white-space:pre-wrap;word-break:break-word;min-height:60px}
.termout .cmd{color:#e6edf3}
.termout .err{color:var(--bad)}
.termin{display:flex;gap:8px;align-items:center;margin-top:8px}
.termin .pr{color:#7ee787;font-family:var(--mono);font-size:14px}
.termin input{flex:1;background:#0d1117;border:1px solid var(--line);border-radius:6px;color:#e6edf3;font-family:var(--mono);font-size:14px;padding:10px;min-height:44px}
/* click lines */
.lineselect button.logline{border-left:4px solid transparent}
.lineselect button.logline.sel{border-left-color:var(--acc);background:#0e1c33}
.lineselect button.logline.mk-ok{border-left-color:var(--ok);background:#0f2e1a}
.lineselect button.logline.mk-bad{border-left-color:var(--bad);background:#3d1214}
.lineselect button.logline.mk-miss{border-left-color:var(--warn);background:#332209}
/* sim + dual */
.simrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--panel)}
.simrow .slab{font-weight:700;color:var(--acc)}
.simrow select{display:block;margin-top:8px;width:100%;min-height:44px;background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:6px;font-size:15px;padding:8px}
.simrow.mk-ok{border-color:var(--ok)}
.simrow.mk-bad{border-color:var(--bad)}
.dualpart{border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:10px 12px;margin:10px 0;background:var(--panel)}
.dualpart.red{border-left-color:var(--bad)}
.dualpart .dlab{font-size:12px;font-weight:800;letter-spacing:1.2px}
.dualpart.blue .dlab{color:var(--acc)}
.dualpart.red .dlab{color:var(--bad)}
/* branch */
.stepq{font-weight:700;margin:10px 0 4px}
/* actions + feedback */
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.hintbox{border:1px solid var(--warn);background:#2a2007;border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.hintbox b{color:var(--warn)}
.fbpanel{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.fbpanel.full{border-color:var(--ok);background:#0c2113}
.fbpanel.partial{border-color:var(--warn);background:#2a2007}
.fbpanel.zero{border-color:var(--bad);background:#2a0d0f}
.fbscore{font-weight:800;font-size:16px}
.fbscore.full{color:var(--ok)}
.fbscore.partial{color:var(--warn)}
.fbscore.zero{color:var(--bad)}
.fbdetail{list-style:none;padding:0;margin:8px 0}
.fbdetail li{padding:3px 0;font-size:14px}
.fbdetail .ok{color:var(--ok)}
.fbdetail .bad{color:var(--bad)}
.fbdetail .miss{color:var(--warn)}
.expl{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.expl .lab{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--acc)}
.skipnote{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
/* intro / keywords */
.rules li{margin:6px 0}
.kwthemes{display:grid;gap:10px;margin-top:8px}
.kwtheme{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2)}
.kwtheme .tt{font-weight:700;color:var(--acc);display:block;margin-bottom:6px}
.kwtheme .kwchip{margin:2px 4px 2px 0;display:inline-block}
/* results */
.bigpct{font-size:52px;font-weight:800;font-family:var(--mono)}
.bigpct.pass{color:var(--ok)}
.bigpct.fail{color:var(--bad)}
.cert{border:2px solid var(--ok);border-radius:12px;padding:18px;text-align:center;background:#0c2113;margin:12px 0}
.cert.fail{border-color:var(--bad);background:#2a0d0f}
.resstats{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0;font-size:14px}
.resstats .st{border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:var(--panel2)}
.report{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.report th,.report td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.report th{background:var(--panel2)}
.lab-full{color:var(--ok);font-weight:700}
.lab-partial{color:var(--warn);font-weight:700}
.lab-zero{color:var(--bad);font-weight:700}
.lab-skip{color:var(--warn);font-weight:700}
.skiplist{border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin:10px 0;background:#2a2007}
.themebar{margin:8px 0}
.themebar .tlabel{display:flex;justify-content:space-between;font-size:14px}
.themebar .bar{height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.themebar .fill{height:100%;background:var(--acc)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#7a4d00;color:#fff;border:1px solid var(--warn);padding:12px 18px;border-radius:8px;z-index:50;max-width:90vw}
.blurred{filter:blur(7px);pointer-events:none;user-select:none}
.hidden{display:none}
@media (max-width:640px){.ddwrap{flex-direction:column}.clock{min-width:80px}.nav{width:40px;min-width:40px;min-height:40px;font-size:13px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* v3.0: per-element feedback marks for terminal + branch steps */
.term.mk-ok{border-color:var(--ok)}
.term.mk-bad{border-color:var(--bad)}
.term.mk-part{border-color:var(--warn)}
.dualpart.mk-ok{border-color:var(--ok);background:#0f2e1a}
.dualpart.mk-bad{border-color:var(--bad);background:#3d1214}

</style>
</head>

<script>
/* Cloud+ 4.5 Security Controls — MEDIUM exercises 01-06 */
(function () {
  var D = [

  {
    id: 'M01', type: 'sim', title: 'Monday triage — four alerts, one hour',
    kw: ['public access block', 'key rotation', 'patch management', 'data classification', 'CSPM', 'SOAR'],
    scen: '<p>You are the on-duty cloud SOC analyst at Helios Retail. It is Monday 09:00 and the queue holds four alerts from the weekend. You can only work them in queue order, one decision each. Company policy: customer data is classified <b>Confidential</b> and never leaves a private bucket.</p>',
    q: '<p>For each alert, choose the action you take <b>now</b>.</p>',
    rows: [
      {
        label: 'Alert 1 — CSPM critical, 08:58',
        desc: 'Bucket <code>helios-media-prod</code> became readable by everyone overnight. Two CSV exports from the marketing tool sit inside; they contain customer emails and are classified Confidential.',
        opts: [
          'Open a low-priority ticket for next week',
          'Turn on the public access block for the bucket, then check access logs for downloads',
          'Add a monitoring alert and keep the bucket public until marketing confirms',
          'Rename the CSV files so attackers cannot find them'
        ],
        ok: 1,
        fb: 'Right. Public Confidential data is fixed first: close the door, then look for use. Renaming hides nothing and a ticket delays an open door.'
      },
      {
        label: 'Alert 2 — secret detected in code repo, 07:41',
        desc: 'A deploy access key for the CI pipeline was committed to a public repository. The key is still active.',
        opts: [
          'Ask the repository owner to delete the commit when they arrive',
          'Wait for the normal quarterly key rotation window',
          'Disable the key now, issue a replacement, and review the audit log for its use',
          'Change the repository to private only'
        ],
        ok: 2,
        fb: 'Correct. Many teams automate exactly this first step in a SOAR playbook. A leaked key must stop working before anything else; private repo does not remove the copy that was already public.'
      },
      {
        label: 'Alert 3 — patch report, 06:12',
        desc: 'VM <code>vm-web-03</code> in production missed the last three patch cycles. No sign of compromise.',
        opts: [
          'Patch it immediately during business hours, no testing',
          'Do nothing, the host shows no attack signs',
          'Delete the VM and forget about it',
          'Schedule patching in the next maintenance window and update the golden image'
        ],
        ok: 3,
        fb: 'Right. Patch management needs a tested window; refreshing the golden image keeps future builds clean. Ignoring a patched known risk is how old holes stay open.'
      },
      {
        label: 'Alert 4 — network notice, 03:30',
        desc: 'The VPN gateway failed over to the secondary tunnel last night. Traffic flows, no errors, no security signal.',
        opts: [
          'Escalate as a security incident to the response team',
          'Confirm the failover with the network team and close the alert as normal operation',
          'Disable the secondary tunnel until reviewed',
          'Rotate all user passwords because of the failover'
        ],
        ok: 1,
        fb: 'Correct. Redundancy doing its job is not a security event. Closing noise keeps the queue honest.'
      }
    ],
    hint: 'Ask two questions per alert: is data or access exposed right now, and what is the fastest safe action?',
    exp: '<p>Order matters. Public Confidential data and a live leaked key are open doors — you close doors before paperwork. Patching needs a tested window, so it is scheduled, not rushed. A working backup tunnel is normal operation, not an incident. This is triage: spend your hour where exposure is real.</p>'
  },

  {
    id: 'M02', type: 'dd', title: 'Who patches the hypervisor?',

  } else if (ex.type === 'fill') {

    });

  } else if (ex.type === 'branch') {
    ex.steps.forEach(function (st, s) {
      var d = rt.ans.ch[s]; var got = d != null ? st.opts[p.sperm[s][d]] : null;
      var good = d != null && p.sperm[s][d] === st.ok;
      out.push({ s: good ? 'ok' : 'bad', t: 'Step ' + (s + 1) + ' — you: ' + (got ? txtOf(got) : '(no choice)') + ' · best: ' + txtOf(st.opts[st.ok]) + (st.fb ? ' · ' + st.fb : '') });
    });

    ex.rows.forEach(function (r, ri) {

      var good = d != null && p.rperm[ri][d] === r.ok;
      out.push({ s: good ? 'ok' : 'bad', t: txtOf(r.label) + ' — you: ' + (got ? txtOf(got) : '(no choice)') + ' · best: ' + txtOf(r.opts[r.ok]) + (r.fb ? ' · ' + r.fb : '') });
    });
  } else if (ex.type === 'dual') {
    ex.parts.forEach(function (pt, pi) {
      var d = rt.ans[pi]; var got = d != null ? pt.opts[p.pperm[pi][d]] : null;
      var good = d != null && p.pperm[pi][d] === pt.ok;

/* ---------- solution summaries ---------- */
function solCorrect(ex) {
  var p = P(_curIdx);
  switch (ex.type) {
    case 'qcm': return txtOf(ex.opts[ex.ok]);
    case 'multi': return ex.multi.filter(function (o) { return o.ok; }).map(function (o) { return txtOf(o.t); }).join(' + ');
    case 'dd': return ex.items.map(function (it, i) { return txtOf(it.t) + ' → ' + ex.zones[ex.key[i]].label; }).join('; ');
    case 'order': return ex.ord.map(txtOf).join(' → ');
    case 'fill': return ex.key.map(function (k) { return txtOf(ex.bank[k].t); }).join(', ');
    case 'term': return ex.sol;
    case 'click': return ex.bad.map(function (i) { return txtOf(ex.lines[i]); }).join(' + ');
    case 'branch': return ex.steps.map(function (st, s) { return 'Step ' + (s + 1) + ': ' + txtOf(st.opts[st.ok]); }).join(' | ');
    case 'sim': return ex.rows.map(function (r) { return txtOf(r.label) + ': ' + txtOf(r.opts[r.ok]); }).join(' | ');
    case 'dual': return ex.parts.map(function (pt) { return pt.label + ': ' + txtOf(pt.opts[pt.ok]); }).join(' | ');
  }
  return '';
}
function solYour(ex, rt, idx) {
  var p = P(idx != null ? idx : _curIdx);
  if (!rt.checked) return '—';
  var A = rt.ans || {};
  var Arr = rt.ans || [];

    case 'dd': {

      return pairs.length ? pairs.join('; ') : '(nothing placed)';
    }
    case 'order': return Arr.map(function (oi) { return txtOf(ex.ord[oi]); }).join(' → ');
    case 'fill': return ex.key.map(function (k, b) { return A[b] != null ? txtOf(ex.bank[A[b]].t) : '(empty)'; }).join(', ');
    case 'term': return (A.cmds || []).length ? A.cmds.join('  ;  ') : '(no command entered)';
    case 'click': return Arr.length ? Arr.map(function (i) { return txtOf(ex.lines[i]); }).join(' + ') : '(nothing selected)';
    case 'branch': return ex.steps.map(function (st, s) { var d = A.ch ? A.ch[s] : null; return 'S' + (s + 1) + ': ' + (d != null ? txtOf(st.opts[p.sperm[s][d]]) : '(no choice)'); }).join(' | ');
    case 'sim': return ex.rows.map(function (r, ri) { var d = A[ri]; return txtOf(r.label) + ': ' + (d != null ? txtOf(r.opts[p.rperm[ri][d]]) : '(no choice)'); }).join(' | ');
    case 'dual': return ex.parts.map(function (pt, pi) { var d = A[pi]; return pt.label + ': ' + (d != null ? txtOf(pt.opts[p.pperm[pi][d]]) : '(no choice)'); }).join(' | ');
  }

}

  S.ck = true;
  paintPause(); paintHeader();
  renderEx(S.idx, 'fb');
  var fb = $('.fbpanel', stage);
  if (fb) fb.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'nearest' });
}
function doSkip() {
  var rt = RT(_curIdx);
  if (rt.checked || S.done) return;
  rt.status = 'skipped';
  if (S.idx === N - 1) { toast('Skipped. Press “Finish exam” to submit, or go back to it any time before the timer ends.'); paintHeader(); renderEx(S.idx); return; }
  S.ck = false;
  renderEx(S.idx + 1, 'q');
  window.scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' });
}
function doRevise() {
  var rt = RT(_curIdx);
  rt.checked = false; rt.earned = null; rt.status = 'open';
  renderEx(S.idx);
}
function paintFeedback(ex, rt, root) {
  var res = CHECKS[ex.type](ex, rt);
  var lab = res.ok === res.total ? 'full' : res.ok > 0 ? 'partial' : 'zero';
  var word = lab === 'full' ? 'FULL' : lab === 'partial' ? 'PARTIAL' : 'ZERO';
  var panel = mk('div', 'fbpanel ' + lab);
  var shown = Math.max(0, (res.ok / res.total) * (1 - 0.1 * rt.hints));
  panel.appendChild(mk('div', 'fbscore ' + lab, word + ' — You earned ' + fmt1(shown) + ' / 1.00 points (' + res.ok + ' of ' + res.total + ' elements correct' + (rt.hints ? ', hint penalty applied' : '') + ')'));
  var det = fbDetail(ex, rt);
  if (det.length) {
    var ul = mk('ul', 'fbdetail');
    det.forEach(function (d) { ul.appendChild(mk('li', d.s, (d.s === 'ok' ? '✓ ' : d.s === 'bad' ? '✕ ' : '⚠ ') + d.t)); });
    panel.appendChild(ul);
  }
  var exl = mk('div', 'expl', '<span class="lab">WHY — EXPLANATION</span>' + ex.exp);
  panel.appendChild(exl);
  PAINTFB[ex.type](ex, rt, stage);
  root.innerHTML = '';
  root.appendChild(panel);
}

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg) {
  if (!toastEl) return;
  toastEl.textContent = msg; toastEl.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.hidden = true; }, 4000);
}

/* ---------- timer ---------- */
var tickId = null;
function startTimer() {
  if (tickId) clearInterval(tickId);
  tickId = setInterval(function () {
    if (!S.started || S.done || S.manual || S.ck) return;
    S.left -= 1;
    clockEl.textContent = fmtClock(Math.max(0, S.left));
    if (S.left <= 0) { finishExam(true); }
  }, 1000);
}

/* ---------- finish + results ---------- */
function finishExam(auto) {
  if (S.done) return;
  var answered = [], skippedList = [];
  for (var i = 0; i < N; i++) {
    var rt = RT(i);
    if (rt.checked) answered.push(i); else skippedList.push(i);
  }
  if (answered.length === 0) {
    if (!auto) { toast('Answer at least one exercise before submitting.'); return; }
  }
  S.done = true;
  S.manual = false; S.ck = false;
  if (tickId) clearInterval(tickId);
  var earned = 0;
  answered.forEach(function (i) { earned += RT(i).earned; });
  var total = answered.length;
  var scoreR = Math.round(earned);
  var pct = total > 0 ? Math.round((scoreR / total) * 100) : 0;
  var passed = total > 0 && pct >= PASS;
  stage.hidden = true; results.hidden = false;
  pauseNote.hidden = true; pauseBtn.disabled = true; submitBtn.disabled = true;
  paintNav();
  buildResults(results, { earned: earned, total: total, scoreR: scoreR, pct: pct, passed: passed, answered: answered, skippedList: skippedList, auto: auto });
  results.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  var done = false;
  function fire() { if (done) return; done = true; reportScore(scoreR, total); }
  if (reducedMotion() || total === 0) { setPct(pct); fire(); }
  else {
    var t0 = null, dur = 1100;
    function anim(ts) {
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      setPct(Math.round(pct * k));
      if (k < 1) requestAnimationFrame(anim); else fire();
    }
    requestAnimationFrame(anim);
  }
}
function setPct(p) { var e = $('#bigPct', results); if (e) e.textContent = p + '%'; }

function buildResults(root, r) {
  root.innerHTML = '';
  var cert = mk('div', 'cert' + (r.passed ? '' : ' fail'));
  cert.appendChild(mk('div', 'bigpct ' + (r.passed ? 'pass' : 'fail'), '0%')).id = 'bigPct';
  if (r.total === 0) {
    cert.appendChild(mk('p', null, '<b>No exercises were answered.</b> The exam cannot be scored. Press Retake Exam to try again.'));
  } else if (r.passed) {
    cert.appendChild(mk('h2', null, 'PASS — ' + SEV + ' exam passed'));
    cert.appendChild(mk('p', null, 'Congratulations' + (S.user ? ', ' + S.user : '') + '! You reached the pass mark of ' + PASS + '% on “' + (META.title || '') + '”. Keep this momentum and take the ' + (SEV === 'MEDIUM' ? 'HARD' : 'next') + ' exam next.'));
  } else {
    cert.appendChild(mk('h2', null, 'FAIL — below the pass mark'));
    cert.appendChild(mk('p', null, 'You scored ' + r.pct + '% and needed ' + PASS + '%. Review the report below, study the explanations, then press Retake Exam. Questions and choices will be shuffled.'));
  }
  if (r.auto && r.total === 0) { }
  else if (r.auto) cert.appendChild(mk('p', 'dimtx', 'Time ran out — the exam was submitted automatically.'));
  root.appendChild(cert);
  var hints = 0; for (var i = 0; i < N; i++) hints += RT(i).hints;
  var stats = mk('div', 'resstats');
  stats.appendChild(mk('span', 'st', 'Score: <b>' + fmt1(r.earned) + ' / ' + r.total + '</b> pts'));
  stats.appendChild(mk('span', 'st', 'Answered: <b>' + r.answered.length + '</b> of ' + N));
  stats.appendChild(mk('span', 'st', 'Not answered / skipped: <b>' + r.skippedList.length + '</b> (excluded from scoring)'));
  stats.appendChild(mk('span', 'st', 'Hints used: <b>' + hints + '</b>'));
  stats.appendChild(mk('span', 'st', 'Pass mark: <b>' + PASS + '%</b>'));
  root.appendChild(stats);
  /* per-theme progress */
  var tw = mk('h3', null, 'Per-theme progress (earned vs exercises answered)');
  root.appendChild(tw);
  var themeMap = {};
  r.answered.forEach(function (i) {
    exThemes(EXS[i]).forEach(function (t) {
      if (!themeMap[t]) themeMap[t] = { got: 0, n: 0 };
      themeMap[t].got += RT(i).earned; themeMap[t].n += 1;
    });
  });
  Object.keys(themeMap).sort().forEach(function (t) {
    var d = themeMap[t];
    var bar = mk('div', 'themebar');
    bar.innerHTML = '<div class="tlabel"><span>' + t + '</span><span>' + fmt1(d.got) + ' / ' + d.n + '</span></div><div class="bar"><div class="fill" style="width:' + Math.round((d.got / d.n) * 100) + '%"></div></div>';
    root.appendChild(bar);
  });
  /* skipped list */
  if (r.skippedList.length) {
    var sk = mk('div', 'skiplist');
    sk.appendChild(mk('b', null, 'Skipped or not answered — excluded from scoring:'));
    var ol = mk('ul', 'rules');
    r.skippedList.forEach(function (i) {
      var ex = EXS[i];
      ol.appendChild(mk('li', null, '<b>' + ex.title + '</b> — correct answer: ' + solCorrect(ex)));
    });
    sk.appendChild(ol);
    sk.appendChild(mk('p', 'dimtx', 'These exercises were not counted in your score (neither in the points earned nor in the total). Their explanations are still shown in the report below so you can learn from them.'));
    root.appendChild(sk);
  }
  /* report table */
  root.appendChild(mk('h3', null, 'Detailed report — every exercise'));
  var tab = mk('table', 'report');
  tab.innerHTML = '<thead><tr><th>#</th><th>Exercise</th><th>Your answer</th><th>Correct answer</th><th>Points</th><th>Result</th></tr></thead>';
  var tb = mk('tbody');
  for (var p = 0; p < N; p++) {
    var i2 = S.order[p]; var ex2 = EXS[i2]; var rt2 = RT(i2);
    var tr = mk('tr');
    var lab = rt2.checked ? (rt2.earned >= 0.999 ? '<span class="lab-full">full</span>' : rt2.earned > 0.001 ? '<span class="lab-partial">partial</span>' : '<span class="lab-zero">zero</span>') : '<span class="lab-skip">skipped</span>';
    tr.innerHTML = '<td>' + (p + 1) + '</td><td>' + ex2.title + '</td><td>' + solYour(ex2, rt2, i2) + '</td><td>' + solCorrect(ex2) + '</td><td>' + (rt2.checked ? fmt1(rt2.earned) + ' / 1' : 'excluded') + '</td><td>' + lab + '</td>';
    tb.appendChild(tr);
    var tr2 = mk('tr');
    tr2.innerHTML = '<td></td><td colspan="5" class="dimtx"><b>Why:</b> ' + ex2.exp + '</td>';
    tb.appendChild(tr2);
  }
  tab.appendChild(tb);
  root.appendChild(tab);
  var ret = mk('button', 'btn primary'); ret.type = 'button'; ret.textContent = 'Retake Exam';
  ret.style.marginTop = '14px';
  ret.addEventListener('click', retake);
  root.appendChild(ret);
}
function retake() {
  S.rt = {}; S.order = shuf(seq(N)); S.idx = 0; S.done = false; S.manual = false; S.ck = false;
  S.left = MINUTES * 60; S.reported = false;
  results.hidden = true; stage.hidden = false;
  pauseBtn.disabled = false; submitBtn.disabled = false;
  clockEl.textContent = fmtClock(S.left);
  paintPause(); renderEx(0); startTimer();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function reportScore(score, total) {
  if (S.reported || total <= 0) return;
  S.reported = true;
  var percent = Math.round((score / total) * 100);
  try {
    parent.postMessage({ type: 'CYBERPULSE_SCORE', topicId: TOPIC, score: score, total: total, percent: percent, passed: percent >= PASS }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}

/* ---------- keywords panel ---------- */
function buildKWPanel(el) {
  el.innerHTML = '';
  el.appendChild(mk('h2', null, 'Keywords covered — grouped by theme'));
  el.appendChild(mk('p', 'dimtx', 'Every keyword below is exercised at least once in this exam. Use it as a checklist: after the exam, you should know what each term means and when to deploy each control.'));
  var grid = mk('div', 'kwthemes');
  KWTHEMES.forEach(function (th) {
    var d = mk('div', 'kwtheme');
    d.appendChild(mk('span', 'tt', th.t));
    th.k.forEach(function (k) { d.appendChild(mk('span', 'kwchip', k)); });
    grid.appendChild(d);
  });
  el.appendChild(grid);
}

/* ---------- intro ---------- */
function buildIntro() {
  intro.innerHTML = '';
  intro.appendChild(mk('div', 'extitle', '<h1>' + (META.title || 'Practice exam') + '</h1><span class="badge ' + SEVCLS + '">' + SEV + '</span>'));
  intro.appendChild(mk('p', null, 'A certification-style practice exam for <b>CompTIA Cloud+ (CV0-004), chapter 4.5 — Security controls: deploying controls to protect cloud environments</b>. The exam is ' + N + ' realistic, scenario-based exercises. You have <b>' + MINUTES + ' minutes</b> in total. The pass mark is <b>' + PASS + '%</b>.'));
  intro.appendChild(mk('h3', null, 'How this exam works'));
  var ul = mk('ul', 'rules');
  [
    '<b>Exercise types:</b> SOC triage queues, drag & drop, matching, ordering, fill-in-the-blank with a word bank, an interactive terminal, log reading with a filter box, spot-the-mistake, decision paths, blue/red team views, and a few multiple-choice questions.',
    '<b>Check</b> validates your answer, marks each element right or wrong, shows the explanation, and <b>pauses the timer in review mode</b>. The content stays visible so you can study it. Only pressing <b>Next</b> resumes the clock.',
    '<b>Manual pause</b> hides the exercise content while the clock is frozen. The two pause reasons are independent and can stack.',
    '<b>Skip</b> moves you on and flags the exercise as skipped. Skipped exercises are excluded from scoring (from both points earned and the total). You can return to any skipped exercise before the timer ends and complete it.',
    '<b>Partial credit:</b> multi-answer exercises are scored per correct element, not all-or-nothing. Wrong picks do not subtract points — they just do not earn.',
    '<b>Hint:</b> one hint per exercise, costs 10% of that exercise\u2019s points. It nudges, it never gives the answer.',
    'If the timer reaches zero, the exam submits itself automatically with whatever was answered.',
    'On a retake, question order and answer order are shuffled again.'
  ].forEach(function (t) { ul.appendChild(mk('li', null, t)); });
  intro.appendChild(ul);
  var startBtn = mk('button', 'btn primary'); startBtn.type = 'button'; startBtn.textContent = 'Start the exam';
  startBtn.style.fontSize = '17px';
  startBtn.addEventListener('click', startExam);
  intro.appendChild(startBtn);
  var kp = mk('div');
  kp.id = 'introKw';
  intro.appendChild(kp);
  buildKWPanel(kp);
}
function startExam() {
  S.started = true;
  S.order = shuf(seq(N));
  S.rt = {}; S.idx = 0; S.done = false; S.manual = false; S.ck = false; S.reported = false;
  S.left = MINUTES * 60;
  intro.hidden = true; results.hidden = true; stage.hidden = false;
  hdr.hidden = false;
  clockEl.textContent = fmtClock(S.left);
  paintPause(); paintHeader();
  renderEx(0);
  startTimer();
  window.scrollTo({ top: 0, behavior: 'auto' });
}
function toggleKW() {
  var open = kwPanel.hidden;
  kwPanel.hidden = !open;
  kwBtn.setAttribute('aria-expanded', String(open));
}

/* ---------- site handshake ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.user = event.data.username || '';
  var w = $('#who');
  if (w && S.user) { w.textContent = 'Candidate: ' + S.user; w.hidden = false; }
});

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded', function () {
  hdr = $('#hdr'); stage = $('#stage'); intro = $('#intro'); results = $('#results');
  kwPanel = $('#kwPanel'); clockEl = $('#clock'); pfill = $('#pfill'); scoreEl = $('#scoreLive');
  answeredEl = $('#answeredLive'); navEl = $('#nav'); pauseNote = $('#pauseNote'); pauseBtn = $('#pauseBtn');
  submitBtn = $('#submitBtn'); toastEl = $('#toast'); kwBtn = $('#kwBtn');
  $('#htitle').textContent = META.title || 'Practice exam';
  var sb = $('#sev'); sb.textContent = SEV; sb.className = 'badge ' + SEVCLS;
  pauseBtn.addEventListener('click', function () {
    if (!S.started || S.done) return;
    S.manual = !S.manual;
    stage.className = S.manual ? 'blurred' : '';
    stage.setAttribute('aria-hidden', S.manual ? 'true' : 'false');
    try { stage.inert = !!S.manual; } catch (e5) { }
    paintPause();
  });
  submitBtn.addEventListener('click', function () { finishExam(false); });
  kwBtn.addEventListener('click', toggleKW);
  buildIntro();
  buildKWPanel(kwPanel);
});

</script>
</body>
</html>
