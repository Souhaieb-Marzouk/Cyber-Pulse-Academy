<style>
:root {
  --bg: #0b1220;
  --panel: #121b2e;
  --panel2: #0e1524;
  --panel3: #1a2439;
  --line: #26344f;
  --text: #e8eef7;
  --dim: #a9b6cc;
  --accent: #38bdf8;
  --accent-ink: #06202e;
  --ok: #34d399;
  --ok-ink: #05261a;
  --bad: #f87171;
  --bad-ink: #2b0808;
  --warn: #fbbf24;
  --warn-ink: #2a1e02;
  --focus: #7dd3fc;
  --mono: 'Cascadia Mono', 'Consolas', 'DejaVu Sans Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 600px at 80% -10%, #14213d 0%, var(--bg) 55%) fixed, var(--bg);
  color: var(--text);
  font: 16px/1.55 'Segoe UI', 'Inter', 'Noto Sans', Arial, sans-serif;
  padding: 14px 14px 60px;
}
.mono, pre, code, .term-out, .log-lines { font-family: var(--mono); font-size: 15px; }
#app { max-width: 1000px; margin: 0 auto; }
button { font: inherit; }
button, select, input[type="text"] { min-height: 44px; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px;
}

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
  background: var(--panel3); color: var(--text); border: 1px solid var(--line);
  padding: 12px 18px; border-radius: 10px; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 60; max-width: 92%; box-shadow: 0 8px 30px rgba(0,0,0,.5);
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- top bar ---------- */
#topbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px;
}
.tb-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#exam-title { font-weight: 700; letter-spacing: .2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; min-height: 30px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel3);
  font-size: 13.5px; font-weight: 600; color: var(--dim); white-space: nowrap;
}
.chip.sev-medium { color: #ffd75e; border-color: #6b5615; background: #241d06; }
.chip.sev-hard { color: #ff9d9d; border-color: #6e2020; background: #240a0a; }
.tb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#timer { font-family: var(--mono); font-size: 20px; font-weight: 700; padding: 4px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel3); min-width: 96px; text-align: center; }
#timer.low { color: var(--warn); border-color: #6b5615; }
#timer.crit { color: var(--bad); border-color: #6e2020; }
#timer-label { font-size: 13px; color: var(--dim); }
#pause-chip { color: var(--warn); border-color: #6b5615; background: #241d06; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--panel3); color: var(--text); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 16px; cursor: pointer; min-height: 44px; font-weight: 600;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--warn); border-color: #6b5615; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- progress ---------- */
#progress-wrap { margin-bottom: 12px; }
#progress-track { height: 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
#progress-bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .4s ease; }
#progress-label { font-size: 13.5px; color: var(--dim); margin-top: 5px; }

/* ---------- blocks ---------- */
main { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.block { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
.block > h3 {
  margin: 0; padding: 8px 14px; font-size: 13.5px; letter-spacing: 1.2px; color: var(--dim);
  background: var(--panel3); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
}
.block-body { padding: 14px; }
.block.scenario { border-left: 4px solid var(--accent); }
.block.question { border-left: 4px solid var(--warn); }
.block.answer { border-left: 4px solid var(--ok); }
.block.artefact { border-left: 4px solid #8b5cf6; }
.block.feedback { border-left: 4px solid var(--dim); }
pre.artefact-pre {
  margin: 0; padding: 12px 14px; background: #0a0f1c; color: #cfe3ff; overflow-x: auto;
  font-family: var(--mono); font-size: 14.5px; line-height: 1.5; white-space: pre; border: 0;
}

/* ---------- choices ---------- */
.choice-list { display: flex; flex-direction: column; gap: 8px; }
.choice {
  display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; min-height: 44px;
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.choice:hover { border-color: var(--accent); }
.choice input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.choice.is-correct { border-color: var(--ok); background: rgba(52, 211, 153, .12); }
.choice.is-correct::after { content: "✓ Correct"; margin-left: auto; color: var(--ok); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.choice.is-wrong { border-color: var(--bad); background: rgba(248, 113, 113, .10); }
.choice.is-wrong::after { content: "✗ Wrong"; margin-left: auto; color: var(--bad); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.choice.is-missed { border-color: var(--warn); background: rgba(251, 191, 36, .10); }
.choice.is-missed::after { content: "⚠ Missed"; margin-left: auto; color: var(--warn); font-weight: 700; font-size: 13.5px; white-space: nowrap; }

/* ---------- pool / buckets / slots ---------- */
.pool { background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin-bottom: 12px; }
.pool-title, .slot-hint { font-size: 13.5px; color: var(--dim); margin-bottom: 8px; }
.pool-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn {
  background: var(--panel3); border: 1px solid var(--line); color: var(--text);
  border-radius: 999px; padding: 8px 14px; min-height: 44px; cursor: grab; font-weight: 600;
}
.chipbtn.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .35); }
.chipbtn.ok { border-color: var(--ok); background: rgba(52, 211, 153, .14); }
.chipbtn.bad { border-color: var(--bad); background: rgba(248, 113, 113, .12); }
.chipbtn.missed { border-color: var(--warn); background: rgba(251, 191, 36, .12); }
.chipbtn .tag { font-size: 12px; font-weight: 700; margin-left: 6px; }
.chipbtn.ok .tag { color: var(--ok); } .chipbtn.bad .tag { color: var(--bad); } .chipbtn.missed .tag { color: var(--warn); }
.buckets, .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.bucket, .slotbox { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-height: 96px; cursor: pointer; }
.bucket.over, .slotbox.over { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .3); }
.bucket-title, .slotbox-title { font-weight: 700; font-size: 14.5px; margin-bottom: 8px; color: var(--accent); }
.bucket-zone, .slot-zone { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.slot-zone:empty::before { content: "empty — click a chip then this slot"; color: #5b6b85; font-size: 13px; }

/* ---------- order / rank ---------- */
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.order-row {
  display: flex; align-items: center; gap: 10px; background: var(--panel2);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px;
}
.order-row.dragging { opacity: .4; }
.order-num {
  flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--panel3);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 700; color: var(--accent);
}
.order-text { flex: 1; }
.order-btns { display: flex; gap: 6px; }
button.mini {
  width: 44px; height: 44px; border-radius: 8px; background: var(--panel3); color: var(--text);
  border: 1px solid var(--line); cursor: pointer; font-size: 18px; padding: 0;
}
.order-row.pos-ok { border-color: var(--ok); }
.order-row.pos-bad { border-color: var(--bad); }
.order-row .mark { margin-left: 6px; font-weight: 700; font-size: 13.5px; }

/* ---------- match / fill ---------- */
.match-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.match-row:last-child { border-bottom: 0; }
.match-left { flex: 1 1 260px; font-weight: 600; }
.match-row select, .fill-blank { background: var(--panel3); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; max-width: 100%; }
.match-row.sel-ok select, .fill-blank.ok { border-color: var(--ok); }
.match-row.sel-bad select, .fill-blank.bad { border-color: var(--bad); }
.fill-text { line-height: 2.2; }
.fill-text select { margin: 0 3px; }

/* ---------- log viewer ---------- */
.log-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; background: var(--panel3); border-bottom: 1px solid var(--line); }
.log-toolbar label { font-size: 13.5px; color: var(--dim); font-weight: 600; }
.log-filter { flex: 1 1 220px; background: #0a0f1c; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.log-count { font-size: 13px; color: var(--dim); font-family: var(--mono); }
.log-lines { margin: 0; padding: 12px 14px; background: #0a0f1c; overflow-x: auto; white-space: pre; line-height: 1.6; }
.log-line { display: block; }
.log-line.hidden { display: none; }
.sev-info { color: #9fb6d8; } .sev-ok { color: var(--ok); } .sev-warn { color: var(--warn); } .sev-err { color: var(--bad); }

/* ---------- terminal ---------- */
.term-tasks { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.term-task { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
.term-task .st { font-weight: 700; color: var(--dim); }
.term-task .st.ok { color: var(--ok); }
.term-note { font-size: 13.5px; color: var(--warn); background: rgba(251, 191, 36, .08); border: 1px solid #57430e; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; }
.term { background: #05080f; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.term-head { padding: 6px 12px; background: var(--panel3); color: var(--dim); font-size: 13px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
.term-out { margin: 0; padding: 12px; max-height: 260px; overflow-y: auto; color: #b7f7c9; white-space: pre-wrap; font-size: 14.5px; line-height: 1.5; }
.term-row { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 6px 10px; }
.term-prompt { color: var(--ok); font-family: var(--mono); font-size: 14.5px; white-space: nowrap; }
.term-in { flex: 1; background: transparent; border: 0; color: var(--text); font-family: var(--mono); font-size: 14.5px; padding: 8px 4px; }
.term-in:focus { outline: none; }
.term-row:focus-within { box-shadow: inset 0 0 0 2px rgba(56, 189, 248, .4); }

/* ---------- branch ---------- */
.branch-step { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
.branch-step-head { padding: 8px 14px; background: var(--panel3); font-weight: 700; font-size: 14px; color: var(--accent); border-bottom: 1px solid var(--line); }
.branch-body { padding: 12px 14px; }
.branch-outcome { margin-top: 10px; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.branch-outcome.good { background: rgba(52, 211, 153, .10); border: 1px solid #14532d; }
.branch-outcome.oops { background: rgba(248, 113, 113, .09); border: 1px solid #5f1d1d; }

/* ---------- spot the mistake ---------- */
.spot-lines { display: flex; flex-direction: column; gap: 4px; }
.spot-line {
  display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
  background: #0a0f1c; color: #cfe3ff; border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; font-family: var(--mono); font-size: 14.5px; cursor: pointer; min-height: 44px;
}
.spot-line[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .3); }
.spot-line.ok { border-color: var(--ok); background: rgba(52, 211, 153, .12); }
.spot-line.bad { border-color: var(--bad); background: rgba(248, 113, 113, .10); }
.spot-line .mark { margin-left: auto; font-weight: 700; font-size: 13px; white-space: nowrap; font-family: 'Segoe UI', sans-serif; }
.spot-num { color: #5b6b85; flex: none; width: 30px; }

/* ---------- triage ---------- */
.alert-card { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
.alert-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 14px; background: var(--panel3); border-bottom: 1px solid var(--line); font-weight: 700; }
.alert-log { margin: 0; padding: 10px 14px; background: #0a0f1c; color: #cfe3ff; font-family: var(--mono); font-size: 14.5px; white-space: pre-wrap; border-bottom: 1px solid var(--line); }
.alert-body { padding: 12px 14px; }
.alert-outcome { margin-top: 10px; border-radius: 8px; padding: 10px 12px; display: none; font-size: 15px; }
.alert-outcome.good { display: block; background: rgba(52, 211, 153, .10); border: 1px solid #14532d; }
.alert-outcome.oops { display: block; background: rgba(248, 113, 113, .09); border: 1px solid #5f1d1d; }

/* ---------- feedback ---------- */
.fb-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 13.5px; min-height: 30px; }
.pill.ok { background: rgba(52, 211, 153, .16); color: var(--ok); border: 1px solid #14532d; }
.pill.bad { background: rgba(248, 113, 113, .14); color: var(--bad); border: 1px solid #5f1d1d; }
.pill.warn { background: rgba(251, 191, 36, .13); color: var(--warn); border: 1px solid #57430e; }
.pill.dim { background: var(--panel3); color: var(--dim); border: 1px solid var(--line); }
.fb-points { color: var(--text); }
.fb-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.fb-item { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.fb-item .ic { flex: none; font-weight: 700; }
.fb-explain { padding: 12px 14px; color: var(--text); font-size: 15.5px; border-top: 1px dashed var(--line); }
.fb-explain b { color: var(--accent); }
.hintbox { margin: 0 0 12px; border: 1px dashed #57430e; background: rgba(251, 191, 36, .07); color: var(--warn); border-radius: 10px; padding: 10px 14px; }

/* ---------- actions / navigator ---------- */
.q-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
#navigator { margin-top: 8px; }
#nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 8px; margin-top: 10px; }
.navbtn {
  min-width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel2); color: var(--text); font-weight: 700; cursor: pointer; font-family: var(--mono); font-size: 14.5px;
  display: flex; align-items: center; justify-content: center; gap: 3px; flex-direction: column; padding: 2px;
}
.navbtn .st { font-size: 11px; line-height: 1; }
.navbtn.cur { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, .35); }
.navbtn.full { border-color: var(--ok); color: var(--ok); }
.navbtn.zero { border-color: var(--bad); color: var(--bad); }
.navbtn.partial { border-color: var(--warn); color: var(--warn); }
.navbtn.skipped { border-style: dashed; border-color: var(--warn); color: var(--warn); }

/* ---------- pause overlay ---------- */
#exam-wrap { position: relative; }
#exam-wrap.blurred #exam-screen { filter: blur(7px); pointer-events: none; user-select: none; }
#pause-overlay {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  z-index: 30; text-align: center; padding: 20px;
}
#exam-wrap.blurred #pause-overlay { display: flex; }
.pause-card { background: var(--panel); border: 1px solid var(--warn); border-radius: 14px; padding: 26px 34px; max-width: 420px; }
.pause-card .big { font-size: 34px; }
.pause-card h2 { margin: 8px 0 6px; }
.pause-card p { color: var(--dim); margin: 0 0 14px; }

/* ---------- intro ---------- */
.intro-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.intro-title { font-size: 26px; font-weight: 800; margin: 0; }
.intro-sub { color: var(--dim); margin: 4px 0 0; }
.kw-theme { margin-bottom: 12px; }
.kw-theme h4 { margin: 0 0 6px; color: var(--accent); font-size: 15px; }
.kw-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.kw { background: var(--panel3); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--dim); }
.instructions li { margin-bottom: 8px; }
.instructions { padding-left: 22px; margin: 0; }
.meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.meta-box { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: center; }
.meta-box .v { font-size: 21px; font-weight: 800; color: var(--accent); }
.meta-box .k { font-size: 12.5px; color: var(--dim); letter-spacing: .6px; }

/* ---------- results ---------- */
.result-hero { text-align: center; padding: 26px 18px; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--line); }
.result-hero.pass { border-color: var(--ok); background: radial-gradient(600px 200px at 50% 0%, rgba(52, 211, 153, .14), transparent); }
.result-hero.fail { border-color: var(--bad); background: radial-gradient(600px 200px at 50% 0%, rgba(248, 113, 113, .10), transparent); }
.result-hero .verdict { font-size: 40px; font-weight: 900; letter-spacing: 2px; }
.result-hero.pass .verdict { color: var(--ok); }
.result-hero.fail .verdict { color: var(--bad); }
.result-hero .score-line { font-size: 20px; margin-top: 6px; }
.result-hero .cert-note { color: var(--dim); font-size: 14.5px; margin-top: 8px; }
.stat-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.rep-row { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.rep-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; background: var(--panel3); border-bottom: 1px solid var(--line); }
.rep-num { font-family: var(--mono); font-weight: 700; color: var(--accent); }
.rep-title { font-weight: 700; flex: 1; }
.rep-body { padding: 12px 14px; font-size: 15px; }
.rep-line { margin: 0 0 8px; }
.rep-line .lab { color: var(--dim); font-weight: 700; font-size: 13px; letter-spacing: .8px; }
.rep-explain { border-top: 1px dashed var(--line); padding-top: 10px; color: var(--text); }
.rep-skipped-note { color: var(--warn); font-size: 14.5px; margin: 4px 0 12px; }
.theme-progress { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

@media (max-width: 720px) {
  .q-actions .btn { flex: 1 1 44%; }
  body { padding: 8px 8px 40px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- v3.0 additions ---------- */
#confirm-box {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(5, 9, 18, .72); z-index: 60; padding: 20px;
}
[hidden] { display: none !important; }
.confirm-card { background: var(--panel); border: 1px solid var(--warn); border-radius: 14px; padding: 22px 26px; max-width: 460px; }
.confirm-card h2 { margin: 0 0 8px; }
.confirm-card p { color: var(--dim); margin: 0 0 16px; white-space: pre-line; }

<script>
window.__EXAM_DATA__ = window.__EXAM_DATA__ || [];
window.__EXAM_DATA__.push(
{ id:"h01", type:"triage", tags:["VPN","Troubleshooting"], title:"Morning shift — four VPN alerts, one brain", points:12,
  scenario:"You inherit the VPN queue at 06:00. Four alerts, each with a misleading surface reading. Handle each alert with the best immediate action.",
  question:"Choose the best immediate action for every alert.",
  answerLabel:"CHOOSE ONE PER ALERT",
  alerts:[
    {title:"ALERT A — tunnel to branch-07 flaps",
     log:"05:41:12 gw-vpn-west DPD: R_U_THERE timeout, sequence 4412\n05:41:15 gw-vpn-west tunnel DOWN (dpd)\n05:42:30 gw-vpn-west tunnel UP (ike)\n05:43:40 gw-vpn-west DPD: R_U_THERE timeout, sequence 4419",
     choices:[
      {t:"Raise the DPD interval and check packet loss/jitter on the ISP path to the peer", ok:true, outcome:"Correct. Periodic DPD timeouts with clean re-establishment point at a lossy path, not at broken config. Timer tuning plus ISP evidence is the right move."},
      {t:"Change the pre-shared key on both sides", ok:false, outcome:"A PSK mismatch would block authentication entirely — you would never see repeated successful tunnels coming UP."},
      {t:"Reboot the spoke VMs at branch-07", ok:false, outcome:"The tunnel endpoints are the gateways; the VMs are passengers. Rebooting them changes nothing about DPD."}]},
    {title:"ALERT B — new tunnel stuck after Phase 1",
     log:"04:02:11 gw-vpn-east IKEv2 IKE_SA_INIT complete, AUTH complete\n04:02:11 gw-vpn-east IKEv2 CREATE_CHILD_SA: NO_PROPOSAL_CHOSEN\n04:02:11 gw-vpn-east IKEv2 traffic selectors: local 0[.]0[.]0[.]0/0, remote 0[.]0[.]0[.]0/0 (peer sent: local 10[.]90[.]0[.]0/16)",
     choices:[
      {t:"Align the traffic selectors (proxy IDs / interesting-traffic lists) on both sides", ok:true, outcome:"Correct. Phase 1 succeeded; Phase 2 fails because each side proposes a different set of protected subnets."},
      {t:"Lower the DH group to something weaker", ok:false, outcome:"Phase 1 (where DH lives) already completed. Weakening crypto would not fix a Phase 2 selector mismatch."},
      {t:"Enable NAT-Traversal", ok:false, outcome:"Nothing in the log indicates a NAT device in the path; NAT-T would not change traffic selectors."}]},
    {title:"ALERT C — certificate expires in 9 days",
     log:"06:00:01 cert-monitor vpn-gw-east peer certificate 'branch-11-fw' expires in 9 days\n06:00:01 cert-monitor automated renewal job: scheduled in 8 days",
     choices:[
      {t:"Rotate the certificate now and validate the backup tunnel afterwards", ok:true, outcome:"Correct. Rotating early on your own schedule beats an emergency renewal — and validating the backup proves the safety net."},
      {t:"Let it expire; DPD will fail traffic over to the backup tunnel", ok:false, outcome:"An expired certificate kills authentication on the backup too if the chain is shared — and untested failover is not a plan."},
      {t:"Delete the tunnel so alerts stop firing", ok:false, outcome:"Deleting a production path to silence a monitor is how outages are born."}]},
    {title:"ALERT D — SSL VPN users cannot reach one new subnet",
     log:"06:12:00 vpngw-ssl user pool routes: 10[.]20[.]0[.]0/16, 10[.]55[.]0[.]0/16\n06:12:40 user j.novak REJECT 10[.]8[.]4[.]10:443 (subnet 10[.]8[.]0[.]0/16 not in pool routes)",
     choices:[
      {t:"Add the new subnet to the pushed route / split-include list of the VPN pool", ok:true, outcome:"Correct. Remote-access clients only reach subnets the gateway pushes to them — this one was never added."},
      {t:"Reissue client certificates for all laptops", ok:false, outcome:"Authentication works (users are connected); the missing piece is a route, not an identity."},
      {t:"Disable the local firewall on every laptop via script", ok:false, outcome:"Mass-disabling endpoint firewalls is a security regression and does not add the route."}]}],
  hint:"Each alert contains its own evidence: read what succeeded and what failed, and pick the action that addresses exactly that.",
  explain:"Hard triage is pattern matching on partial evidence. A: DPD timeouts with successful re-ups = path quality, not auth. B: AUTH complete then NO_PROPOSAL_CHOSEN on CREATE_CHILD_SA = Phase 2 selectors, not crypto strength. C: certificates rot on a schedule — rotate early and test the fallback. D: remote-access routing is push-based; a subnet missing from the pushed list is unreachable no matter what the client or server firewall says. In every case the wrong answers fix a layer that the log already proved healthy." },

{ id:"h02", type:"logview", tags:["VPN"], title:"Phase 1 is up, Phase 2 refuses — compare the configs", points:10,
  scenario:"A partner tunnel authenticates fine but never passes traffic. You capture the IKE log and both sides' proposals. Everything below is exactly as the gateways report it.",
  question:"What is the root cause?",
  answerLabel:"CHOOSE ONE (filter the log if you like)",
  logs:[
    {s:"info", t:"-- cloud side proposal  (IKEv2, Phase 2 / child SA) --"},
    {s:"info", t:"encryption AES-256-GCM (AEAD), integrity none, DH group 14 for PFS, lifetime 27000s"},
    {s:"info", t:"-- partner side proposal (IKEv2, Phase 2 / child SA) --"},
    {s:"info", t:"encryption AES-256-CBC, integrity SHA-256, DH group 5 for PFS, lifetime 28800s"},
    {s:"info", t:"2026-06-02 03:11:04  gw-hub  IKEv2  IKE_SA_INIT ok"},
    {s:"info", t:"2026-06-02 03:11:04  gw-hub  IKEv2  AUTH ok (certificate)"},
    {s:"err",  t:"2026-06-02 03:11:05  gw-hub  IKEv2  CREATE_CHILD_SA: NO_PROPOSAL_CHOSEN"},
    {s:"warn", t:"2026-06-02 03:11:05  gw-hub  IKEv2  child SA not established"}],
  answer:{kind:"qcm", choices:[
    {t:"Phase 2 (child SA) proposals differ — AEAD vs CBC/SHA and PFS DH 14 vs 5 cannot intersect", ok:true},
    {t:"The certificates have expired on one side", ok:false},
    {t:"The tunnel is actually fine; this is only an MTU warning", ok:false},
    {t:"NAT-Traversal was never enabled", ok:false}]},
  hint:"Read the log order first: which phase completed, which one failed? Then diff the two proposal blocks line by line.",
  explain:"The log gives you the proof sequence: SA_INIT ok, AUTH ok — so identity, certificates and Phase 1 are healthy. The failure is CREATE_CHILD_SA: the Phase 2 proposals cannot intersect. The cloud side offers AES-256-GCM with no separate integrity (AEAD mode), the partner offers AES-256-CBC with SHA-256; their PFS groups differ (DH 14 vs DH 5). Two proposals only match if every component matches. Lifetime mismatch alone would not reject the SA, and NAT-T is irrelevant without a NAT device. The fix is one negotiated transform set that both sides copy exactly." },

{ id:"h03", type:"spot", tags:["Routing","Hybrid"], title:"Asymmetric routing — find the poison line", points:10,
  scenario:"Requests to on-premises leave the cloud over ExpressRoute, but the on-premises core firewall keeps dropping the return traffic with 'state error'. Both route tables are below. One line creates the asymmetry.",
  question:"Click the one route line that causes asymmetric routing.",
  answerLabel:"CLICK THE FAULTY LINE",
  lines:[
    "hub-rt (cloud):",
    "  10[.]60[.]0[.]0/16   -> expressroute-01   (BGP learned, local-pref 200)",
    "  0[.]0[.]0[.]0/0      -> nat-gw-hub",
    "core-rt (on-premises):",
    "  10[.]10[.]0[.]0/16   -> expressroute-ce-01",
    "  10[.]10[.]0[.]0/16   -> vpn-gw-branch     (static, admin distance 1)",
    "  0[.]0[.]0[.]0/0      -> internet-fw"],
  wrongLines:[6],
  hint:"Cloud side picks ExpressRoute by local preference. On the way back, which on-premises route wins for 10[.]10[.]0[.]0/16 — and why does a stateful firewall care?",
  explain:"The cloud sends traffic to 10[.]60[.]0[.]0/16 over ExpressRoute. On-premises, the static route to vpn-gw-branch has admin distance 1, which beats the BGP-learned ExpressRoute route — so replies leave through the VPN instead of the circuit. The two directions now use different paths, and the stateful firewall on the ExpressRoute path never sees both directions of the conversation, so it drops the 'state error' flow. The fix is to make one path clearly preferred in both directions (remove or re-distance the static route, or filter the prefix per path)." },

{ id:"h04", type:"order", tags:["Troubleshooting","VPN"], title:"Defeat the MTU black hole — investigation order", points:15,
  scenario:"Large uploads across the tunnel stall; small ones sail through. You suspect a PMTUD black hole. Order your investigation so each step earns the evidence the next step needs.",
  question:"Drag the steps into the correct investigation order.",
  answerLabel:"ORDER THE STEPS",
  steps:[
    {t:"Reproduce with DF-bit pings at increasing sizes to find the largest size that crosses"},
    {t:"Check whether ICMP type 3 code 4 (fragmentation needed) survives the path"},
    {t:"Compute the usable MSS: path MTU minus TCP/IP headers, minus the IPSec overhead"},
    {t:"Apply MSS clamping on the gateway or lower the interface MTU"},
    {t:"Clear existing flows and re-test a large transfer to confirm PMTUD works"}],
  hint:"You cannot fix what you have not measured: size threshold first, then the blocked message, then the math, then the fix, then proof.",
  explain:"Professional MTU debugging is a measurement chain: first find the breaking size with DF-bit pings (that number IS the path MTU); then verify that ICMP type 3 code 4 — the message that would normally let senders adapt — is being filtered somewhere; then compute the correct MSS from that MTU (accounting for roughly 50–100 bytes of IPSec overhead); only then apply MSS clamping with real numbers instead of folklore; and finally re-test, because a fix without a proof is just a guess with a change ticket." },

{ id:"h05", type:"branch", tags:["DNS","Hybrid"], title:"Hybrid DNS — the resolution chain breaks", points:12,
  scenario:"On-premises app servers cannot resolve db.internal.corp (hosted as a private zone linked to the VNet). Other names resolve. Walk the diagnostic path — each step changes what you know.",
  question:"Choose the best next action at each step.",
  answerLabel:"CHOOSE AN OPTION FOR EVERY STEP",
  steps:[
    {prompt:"Step 1 — from the failing on-premises server, what do you run first?",
     options:[
      {t:"A direct query to the VNet resolver IP for db.internal.corp", ok:true, outcome:"Correct. Querying the resolver directly splits the problem: DNS server behavior vs the forwarder path."},
      {t:"Ping the database VM by IP", ok:false, outcome:"A ping proves IP reachability but tells you nothing about the resolution chain that is actually failing."},
      {t:"Restart the DNS service on the server", ok:false, outcome:"Random restarts destroy the state you are about to diagnose."}]},
    {prompt:"Step 2 — the direct query times out. Other servers resolve the same name fine via their forwarder. What does this tell you?",
     options:[
      {t:"This server's forwarder or path to the VNet resolver is broken — compare its resolver config with a working server", ok:true, outcome:"Correct. A working population plus one failing server localizes the fault to that server's DNS path, not the zone."},
      {t:"The private zone must be deleted and recreated", ok:false, outcome:"A working population disproves a broken zone. Recreating it would break everyone while you debug."},
      {t:"Add a hosts entry on the failing server and close the ticket", ok:false, outcome:"The symptom disappears but the fault stays — and the entry rots the first time the IP changes."}]},
    {prompt:"Step 3 — its forwarder points at 10[.]20[.]0[.]53, an old resolver IP from a decommissioned VNet. The fix is:",
     options:[
      {t:"Update the forwarder to the active VNet resolver and validate from both sides", ok:true, outcome:"Correct. Fix the pointer, then prove resolution from the failing server AND the cloud side."},
      {t:"Delete the private zone so everyone uses public DNS", ok:false, outcome:"That would publish internal names to the internet and break the split-horizon design."},
      {t:"Make the db record public in the internet zone", ok:false, outcome:"Exposing an internal address publicly is a leak, not a fix."}]}],
  hint:"Follow the query's journey: server cache, then forwarder, then resolver, then zone. Break the journey into testable hops.",
  explain:"Hybrid DNS failures are almost always broken handoffs, not broken zones. The professional path: query the authoritative resolver directly (isolates the far end), compare failing vs working clients (isolates the near end), and only then change configuration — here a forwarder still pointing at a decommissioned resolver IP. Notice the trap answers: recreating the zone 'fixes' a healthy zone, and hosts entries hide symptoms while the fault persists." },

{ id:"h06", type:"terminal", tags:["Troubleshooting"], title:"Terminal — prove reachability, then prove the path", points:10,
  scenario:"You are on the VM vm-net (interface eth0). Two facts are needed for the ticket, and no one will tell you which tools to use — that is the point. Addresses are defanged in this lab; type them exactly as displayed.",
  question:"Run one command per task in the terminal below.",
  answerLabel:"TYPE THE COMMANDS, PRESS ENTER AFTER EACH",
  echo:[
    {m:"^(nc|ncat|netcat)", out:["Connection to app-05 port 443 [tcp/https] succeeded!"]},
    {m:"^telnet", out:["Trying 10[.]70[.]3[.]30...","Connected to app-05.","Escape character is '^]'."]},
    {m:"^(test-netconnection|tnc)", out:["ComputerName           : app-05","RemoteAddress          : 10[.]70[.]3[.]30","RemotePort             : 443","TcpTestSucceeded       : True"]},
    {m:"^ip\\s+route\\s+get|^route\\s+get", out:["10[.]70[.]3[.]25 via 10[.]70[.]0[.]1 dev eth0 src 10[.]70[.]1[.]15","    cache"]}],
  goals:[
    {goal:"Confirm whether TCP 443 on host app-05 is open, using a single command", accept:["^\\s*nc\\s+(-\\w+\\s+)*app-05\\s+443\\s*$","^\\s*ncat\\s+(-\\w+\\s+)*app-05\\s+443\\s*$","^\\s*telnet\\s+app-05\\s+443\\s*$","^\\s*(test-netconnection|tnc)\\s+app-05\\s+(-port\\s+)?443\\s*$"], reveal:"nc -vz app-05 443"},
    {goal:"Show which gateway and interface this VM would use to reach 10[.]70[.]3[.]25", accept:["^\\s*ip\\s+route\\s+get\\s+10\\[\\.\\]70\\[\\.\\]3\\[\\.\\]25\\s*$","^\\s*route\\s+get\\s+10\\[\\.\\]70\\[\\.\\]3\\[\\.\\]25\\s*$"], reveal:"ip route get 10[.]70[.]3[.]25"}],
  hint:"Two different questions: one asks about a TCP port, the other about the kernel's routing decision.",
  explain:"Task 1 needs a TCP-level probe — nc -vz, telnet, or the PowerShell Test-NetConnection all prove 'the port answers', which ping cannot (ICMP may be filtered while 443 is fine). Task 2 needs the routing decision itself: 'ip route get' asks the kernel exactly which gateway and interface it would use for that address — the authoritative answer for 'why does traffic leave here'. Choosing the right tool class (port probe vs route lookup) was the real test." },

{ id:"h07", type:"multi", tags:["VPN"], title:"NAT-Traversal — what is actually true?", points:10,
  scenario:"A vendor claims their appliance 'handles NAT in IPSec automatically by double-encrypting with NAT-T'. The team must separate marketing from protocol reality before the purchase.",
  question:"Which statements about NAT-Traversal are TRUE? Select all that apply.",
  answerLabel:"SELECT ALL THAT APPLY",
  choices:[
    {t:"ESP has no port numbers, so a PAT device cannot map it — NAT-T encapsulates ESP in UDP 4500", ok:true},
    {t:"NAT-T is detected and negotiated dynamically during IKE when a NAT device is found in the path", ok:true},
    {t:"AH cannot traverse NAT, because its integrity check covers fields that NAT rewrites", ok:true},
    {t:"NAT-T encrypts the ESP payload a second time for safety", ok:false},
    {t:"NAT-T requires replacing IPSec with SSL on the same tunnel", ok:false}],
  hint:"The vendor claim contains one impossible word. What does NAT-T add — encryption, or a wrapper?",
  explain:"ESP (IP protocol 50) has no ports, so port-address translation has nothing to key on — NAT-T solves this by wrapping ESP inside UDP 4500, giving the NAT device a normal UDP flow to track. The peers discover the NAT device during IKE (NAT-D payloads) and switch automatically. AH is fundamentally NAT-incompatible: its integrity hash covers the IP header fields that NAT rewrites, so verification always fails — which is why AH is avoided on networks with NAT. NAT-T adds a wrapper, not a second layer of encryption, and no SSL is involved." },

{ id:"h08", type:"classify", tags:["Segmentation"], title:"Zero trust or flat network? Sort the evidence", points:10,
  scenario:"An architecture review board asks you to classify design statements as belonging to a zero-trust/microsegmented model or a traditional flat model, so the report can show exactly how far the current estate is from the target.",
  question:"Drag each statement into the model it describes.",
  answerLabel:"DRAG THE ITEMS INTO A BUCKET",
  buckets:[{t:"Zero trust / microsegmented"},{t:"Traditional flat network"}],
  items:[
    {t:"Default-deny between application tiers", bucket:0},
    {t:"One big /16, no internal filters", bucket:1},
    {t:"Identity-aware proxy in front of admin UIs", bucket:0},
    {t:"Security depends on the perimeter firewall only", bucket:1},
    {t:"Per-app NSG rules reviewed every quarter", bucket:0},
    {t:"Any VM can reach any VM on 3389", bucket:1}],
  hint:"Zero trust removes implicit trust between inside components; flat design concentrates all trust at the edge.",
  explain:"The zero-trust model treats every east-west flow as untrusted until explicitly allowed: default-deny between tiers, identity checks for administrative surfaces, and reviewed per-app rules. The flat model spends its entire security budget at the perimeter — one big range, no internal filters, universal RDP reachability — so a single compromised VM inherits the whole network. The review board's real question is: where does a breach stop? In the flat column, the honest answer is 'nowhere'." },

{ id:"h09", type:"slot", tags:["Routing","Hybrid"], title:"Hub-spoke with a transit gateway — route or isolate", points:16,
  scenario:"A hub VNet hosts a transit gateway and a firewall appliance. Spokes A and B ride the transit gateway; Spoke-B holds regulated data. On-premises connects over IPSec. Four routing decisions are on the table.",
  question:"Drag the correct routing decision into each slot. Two items are distractors.",
  answerLabel:"DRAG AN ITEM INTO EACH SLOT",
  slots:[
    {t:"Spoke-to-spoke traffic without per-spoke peering"},
    {t:"Spoke-B must have NO route to on-premises"},
    {t:"All spoke egress must pass the hub firewall"},
    {t:"On-premises must reach the spokes over IPSec"}],
  items:[
    {t:"Point spoke default routes at the hub transit path", slot:2},
    {t:"Do not propagate on-premises prefixes into Spoke-B's route table", slot:1},
    {t:"Advertise spoke prefixes into the IPSec BGP session", slot:3},
    {t:"Route spoke-to-spoke through the transit gateway", slot:0},
    {t:"Give every spoke VM a public IP and let it route itself", slot:null},
    {t:"Disable the hub firewall to reduce latency", slot:null}],
  hint:"Each slot is a route-table decision: who learns what, and who points where.",
  explain:"A transit gateway makes hub routing explicit: spoke-to-spoke flows ride it (slot 1); isolation is achieved by NOT propagating the on-premises prefixes into Spoke-B's table (slot 2) — what a network never learns, it can never reach; centralized inspection works by pointing spoke default routes at the hub firewall (slot 3); and on-premises reaches the spokes because the spoke prefixes are advertised into the IPSec BGP session (slot 4). Public IPs and disabling the firewall are not routing decisions — they are surrendering the design." },

{ id:"h10", type:"qcm", tags:["Hybrid","Routing"], title:"Tunnel up, but no routes learned", points:10,
  scenario:"A BGP-over-VPN tunnel shows both IPSec phases UP on the gateway dashboard. Yet the cloud route table contains none of the on-premises prefixes, and on-premises routers learned nothing either. Everything else on this tunnel is new and unconfigured.",
  question:"What is the most likely cause?",
  answerLabel:"CHOOSE ONE",
  choices:[
    {t:"The BGP session itself is not established — neighbor address, ASN or the BGP enablement on the connection is wrong", ok:true},
    {t:"The Phase 2 proposal mismatch rejects child SAs", ok:false},
    {t:"The PSK is wrong on one side", ok:false},
    {t:"NAT-Traversal is missing in the path", ok:false}],
  hint:"The dashboard already told you which layers succeeded. Cross them off before you look at the rest.",
  explain:"'Both phases UP' eliminates everything IPSec: no proposal mismatch (Phase 2 succeeded), no PSK problem (Phase 1 authenticated), and NAT-T issues would have blocked the phases, not the routing. Routes not appearing means the routing layer above IPSec — the BGP session — never came up: wrong BGP neighbor address, mismatched AS numbers, or BGP never enabled on the connection object. This is the classic layered-read: prove a layer works, then stop suspecting it." }
);

{ id:"h11", type:"match", tags:["Security controls","Virtual networks"], title:"Pick the right control for each job", points:15,
  scenario:"Five real requests from five teams, all phrased as 'block something' or 'allow something'. Only one control fits each request exactly — near-misses included.",
  question:"Match each request with the control that fits best.",
  answerLabel:"PICK A CONTROL FOR EACH REQUEST",
  pairs:[
    {l:"Block ALL traffic to/from a compromised subnet, stateless, at the subnet edge", r:"Network ACL — stateless, subnet-wide, both directions ruled by hand"},
    {l:"Deny 3389 to one VM without touching its neighbors", r:"Security group / NSG on that VM's NIC"},
    {l:"Force every spoke's internet egress through the hub firewall", r:"Route table — default route pointed at the hub appliance"},
    {l:"Find which VM talked to a known-bad address last night", r:"Flow logs, then a targeted packet capture"},
    {l:"Give an app a private path to a managed database service, no public internet", r:"Private endpoint / private service access"}],
  hint:"Stateless vs stateful decides the first two. The third is not a filter at all — it is a routing instruction.",
  explain:"A NACL is the right emergency brake for a whole subnet because it is stateless, applies to everything in it, and takes effect in both directions as explicit rules. A single-VM denial belongs on the NIC-level stateful filter — precise and neighbor-blind. Egress steering is not filtering: only a route table (default route to the hub appliance) decides WHERE packets go. Forensics start from flow logs (who talked to whom) and escalate to packet capture for content. And a private endpoint is what binds a managed service into your VNet address space — no filter does that job." },

{ id:"h12", type:"logview", tags:["Flow logs","Segmentation"], title:"Flow logs at 02:00 — decide with evidence", points:10,
  scenario:"You review the previous night's flow logs for the app subnet and one host stands out. Volume counts are bytes_out as recorded by the platform.",
  question:"Which conclusions are SUPPORTED by the evidence? Select all that apply.",
  answerLabel:"SELECT ALL THAT APPLY (filter the log if you like)",
  logs:[
    {s:"info", t:"01:14:22  ACCEPT  TCP 10[.]20[.]9[.]4:49155 -> 198[.]51[.]100[.]23:443  bytes_out=812340"},
    {s:"info", t:"01:39:40  ACCEPT  TCP 10[.]20[.]9[.]4:49188 -> 198[.]51[.]100[.]23:443  bytes_out=1904322"},
    {s:"info", t:"02:10:05  ACCEPT  TCP 10[.]20[.]9[.]4:49201 -> 198[.]51[.]100[.]23:443  bytes_out=2401551"},
    {s:"info", t:"02:44:51  ACCEPT  TCP 10[.]20[.]9[.]4:49233 -> 198[.]51[.]100[.]23:443  bytes_out=2780102"},
    {s:"info", t:"02:45:10  ACCEPT  TCP 10[.]20[.]9[.]4:49240 -> 10[.]20[.]0[.]2:53"},
    {s:"info", t:"02:51:33  ACCEPT  TCP 10[.]20[.]2[.]7:50110 -> 10[.]20[.]2[.]10:443  bytes_out=21044"},
    {s:"info", t:"03:02:19  ACCEPT  TCP 10[.]20[.]9[.]4:49266 -> 198[.]51[.]100[.]23:443  bytes_out=2955017"}],
  answer:{kind:"multi", choices:[
    {t:"One internal host sends a growing volume of data to the same external address overnight", ok:true},
    {t:"The pattern fits staged data exfiltration and warrants containment plus capture", ok:true},
    {t:"A sensible immediate step is denying egress to that address at the firewall while quarantining the host", ok:true},
    {t:"This is normal CDN traffic because the destination port is 443", ok:false},
    {t:"The logs prove malware is present, so no further verification is needed", ok:false}]},
  hint:"Separate what the lines show from what you infer. Then ask what a responder may do BEFORE attribution is complete.",
  explain:"The evidence: one host, one external address, rising byte counts, quiet hours. That justifies containment (deny egress to the destination, quarantine the host, capture what it is doing) — you do not wait for perfect attribution while data leaves the building. But port 443 alone proves nothing benign (backups and malware both love 443), and flow logs never identify malware — they only show the conversation. The professional line is: act on the pattern, verify with host-level evidence, attribute later." },

{ id:"h13", type:"fill", tags:["Hybrid","Routing"], title:"Complete the dedicated-interconnect design", points:15,
  scenario:"You are writing the connection design for a 2 Gbps dedicated interconnect. The review board wants the BGP mechanics spelled out precisely — fill every blank.",
  question:"Complete the design text with the right keyword in each blank.",
  answerLabel:"PICK A WORD FOR EACH BLANK",
  text:"Each {{0}} peering must advertise the on-premises {{1}} to the cloud over {{2}}, using a private {{3}} for the session. Both the primary and the secondary circuit advertise the same prefixes, so when the primary loses its session the {{4}} path takes over automatically — no manual cutover.",
  blanks:["ExpressRoute","prefixes","BGP","AS number","redundant"],
  bank:["ExpressRoute","prefixes","BGP","AS number","redundant","NAT gateway","SSL VPN"],
  hint:"One blank is the circuit, one is what BGP carries, one identifies your organization to BGP, one describes the spare path.",
  explain:"A dedicated interconnect (here, ExpressRoute) exchanges routes with BGP: you advertise the prefixes you want reachable, from your private AS number, and the platform advertises its ranges back. Redundancy comes from two circuits advertising identical information — when the primary session dies, its advertisements vanish and the secondary's routes win by normal BGP convergence. No NAT gateway or SSL VPN belongs in this design text; both are different connectivity classes entirely." },

{ id:"h14", type:"rank", tags:["Prioritization","Security controls"], title:"Risk-rank the audit findings", points:15,
  scenario:"The quarterly review produced five findings. The remediation budget allows one per week. Rank by risk — exposure times likelihood, most critical first.",
  question:"Drag the findings into risk order, most critical first.",
  answerLabel:"RANK, MOST CRITICAL FIRST",
  steps:[
    {t:"DB subnet: NACL allows 0[.]0[.]0[.]0/0 inbound on 1433, and a public IP exists on the subnet edge"},
    {t:"Site-to-site VPN uses the PSK 'Cloud123!' shared with three different partners"},
    {t:"Bastion subnet has no flow logs enabled"},
    {t:"Dev subnet allows 3389 from the whole VNet instead of the mgmt subnet only"},
    {t:"Internal DNS aliases use longer TTLs than recommended"}],
  hint:"First: internet-reachable data. Second: one credential unlocking three trust boundaries. Visibility gaps come after exposure.",
  explain:"Rank 1: an internet-reachable database port is live exposure — exploitation needs no credentials, no phishing, no luck. Rank 2: a shared PSK means any of three partners (or anyone stealing one partner's config) can authenticate; credential blast radius across trust boundaries is a systemic risk. Rank 3: no flow logs on the bastion removes visibility on the most sensitive access path — serious, but not itself an open door. Rank 4: over-broad internal RDP widens lateral-movement paths but still requires an inside foothold. Rank 5: TTL tuning is a performance nuance. Exposure first, blast radius second, visibility third, hygiene last." },

{ id:"h15", type:"branch", tags:["Segmentation","Routing"], title:"Red team — you own a spoke VM. Now what?", points:12,
  scenario:"Assume the attacker's seat: you have code execution on a VM in the app spoke. The blue team wrote the mitigation after each of your realistic options. Choose what a capable attacker would actually try — and learn the defense.",
  question:"Choose the attacker's most likely move at each step.",
  answerLabel:"CHOOSE AN OPTION FOR EVERY STEP",
  steps:[
    {prompt:"Step 1 — fastest internal recon from this VM?",
     options:[
      {t:"Query the instance metadata service for credentials, and sweep the local subnet", ok:true, outcome:"Correct. The metadata service is the crown jewel (temporary cloud credentials) and the local /24 is the immediate blast radius. Blue-team note: require metadata token access, alert on east-west sweeps."},
      {t:"Start a port scan of the public internet", ok:false, outcome:"Pointless for an intruder — outbound scanning burns your foothold without moving you toward data."},
      {t:"Email-phish the helpdesk from the VM", ok:false, outcome:"Slow, noisy and unnecessary when credentials are one HTTP call away on the host itself."}]},
    {prompt:"Step 2 — you discover the app spoke can reach the data spoke on 1433 directly. Your move?",
     options:[
      {t:"Connect straight to the database east-west and harvest what the app account can see", ok:true, outcome:"Correct. A flat east-west path to data is the whole prize. Blue-team note: default-deny web-to-data, service accounts scoped per tier."},
      {t:"Brute-force the site-to-site VPN gateway", ok:false, outcome:"Gateways are hardened and monitored; the soft interior was the real opening."},
      {t:"Launch a denial of service to cover tracks", ok:false, outcome:"Noise without progress — it brings responders, not data."}]},
    {prompt:"Step 3 — time to move stolen data out. Egress is a central NAT with allow-all outbound. Your path?",
     options:[
      {t:"Plain HTTPS to an external paste/storage service through the allowed egress", ok:true, outcome:"Correct. Allow-all egress means exfiltration rides the same highway as patch downloads. Blue-team note: egress allow-lists, TLS inspection zones, flow-log baselining."},
      {t:"ICMP tunneling because it is never filtered", ok:false, outcome:"Often filtered and slower — HTTPS through an open egress is easier and louder in volume."},
      {t:"DNS queries to the internal resolver", ok:false, outcome:"Internal resolvers are monitored and cannot reach paste sites — the wrong pipe."}]}],
  hint:"Attackers take the cheapest path that already exists. Every correct answer is an existing allowance, not a new hack.",
  explain:"This exercise flips the perspective: every 'attack success' here is an unpatched design decision — metadata access left open, east-west allowed to the data tier, egress allow-all. The dual reading is the point: the blue-team notes under each outcome ARE the microsegmentation, metadata-hardening and egress-controls keywords from this objective. Defending means removing the cheap paths, because a capable attacker never uses the expensive ones." },

{ id:"h16", type:"multi", tags:["Segmentation"], title:"VXLAN — separate protocol fact from fiction", points:10,
  scenario:"A datacenter vendor pitch claims VXLAN 'replaces routing and works only inside a single switch'. The network lead asks you to fact-check before the workshop.",
  question:"Which statements about VXLAN are TRUE? Select all that apply.",
  answerLabel:"SELECT ALL THAT APPLY",
  choices:[
    {t:"VXLAN is an overlay: tunnels ride inside the existing IP underlay network", ok:true},
    {t:"Its 24-bit VNI identifier allows about 16 million segments versus 4096 VLAN IDs", ok:true},
    {t:"VXLAN adds header overhead, so the underlay MTU must allow for it (roughly 50 extra bytes)", ok:true},
    {t:"VXLAN removes the need for IP routing between sites", ok:false},
    {t:"VXLAN only works inside one physical switch", ok:false}],
  hint:"The vendor's two claims are both false — and both false for the same reason: what does VXLAN actually build ON TOP of?",
  explain:"VXLAN encapsulates layer-2 frames inside UDP packets that travel the normal IP network (the underlay) — it is an overlay, which is exactly why it stretches segments between datacenters and why routing is still needed underneath (the encapsulated packets are routed like any other IP traffic). The 24-bit VNI gives roughly 16.7 million segments, solving VLAN ID exhaustion, and the extra encapsulation header means MTU planning matters. It obviously spans far beyond one switch — the whole point is connecting layer-2 segments across a routed fabric." },

{ id:"h17", type:"order", tags:["Segmentation"], title:"Incident response on a compromised subnet — order of operations", points:15,
  scenario:"A VM in the app subnet is confirmed compromised and is talking to an external host. The response plan has five phases. Execute them in the order that preserves evidence while stopping the bleeding.",
  question:"Drag the phases into the correct order.",
  answerLabel:"ORDER THE STEPS",
  steps:[
    {t:"Contain: deny the malicious flow at the NSG/firewall and isolate the host"},
    {t:"Preserve: snapshot flow logs and capture packets before any teardown"},
    {t:"Eradicate: revoke exposed credentials and patch the entry vector"},
    {t:"Recover: rebuild the host from a known-good image and restore routes gradually"},
    {t:"Learn: tighten segmentation rules and detection content, then write the report"}],
  hint:"Stop the damage, keep the evidence, remove the cause, come back clean, never repeat it.",
  explain:"Containment comes first because every minute of attacker dwell time costs more than lost forensics — but containment must be surgical (NSG deny, host isolation) so evidence survives. Preservation immediately after: flow logs, captures, snapshots — teardown destroys volatile truth. Eradication removes the cause (credentials! patches!) so the rebuild is not re-compromised. Recovery restores service from known-good state. The learning phase is where this objective's keywords live: every incident should end with better segmentation and detection than it started with." },

{ id:"h18", type:"spot", tags:["Security controls"], title:"Spot every least-privilege violation", points:10,
  scenario:"An NSG review for two VMs. Two of these rules violate least privilege. Web-vm needs 443 from the internet; db-vm needs 1433 from the app subnet only. Nothing else should be open.",
  question:"Click BOTH rule lines that violate least privilege.",
  answerLabel:"CLICK THE VIOLATING LINES (TWO)",
  lines:[
    "1  Allow TCP 443 from Internet        -> web-vm",
    "2  Allow TCP 22 from 0[.]0[.]0[.]0/0  -> web-vm",
    "3  Allow TCP 1433 from app subnet     -> db-vm",
    "4  Allow ALL ports from whole VNet    -> db-vm",
    "5  (default) Deny all other traffic"],
  wrongLines:[2,4],
  hint:"Ask for every line: does a documented need exist for this exact port from this exact source?",
  explain:"Rule 2 exposes SSH (22) to the entire internet — management ports belong on a bastion path or a narrow management range, never on 0[.]0[.]0[.]0/0. Rule 4 grants db-vm every port from the whole VNet; the documented need is 1433 from the app subnet, so everything beyond that is lateral-movement surface. Rules 1 and 3 match documented needs exactly, and rule 5 is the default-deny that makes the allow-list meaningful. Least privilege is judged per line: exact port, exact source, documented need." },

{ id:"h19", type:"qcm", tags:["VPN"], title:"The concentrator is drowning — leadership wants answers", points:10,
  scenario:"The remote-work full-tunnel user base doubled. At peak, the VPN concentrator sits at 95 percent CPU, VoIP inside the tunnel degrades for everyone, and the helpdesk is flooded. Compliance still requires full-tunnel inspection of all user traffic.",
  question:"What is the correct engineering response?",
  answerLabel:"CHOOSE ONE",
  choices:[
    {t:"Scale out concentrator capacity and rebalance the user pools; keep full tunnel for compliance", ok:true},
    {t:"Switch the whole user base to split tunnel", ok:false},
    {t:"Remove QoS so all traffic is treated equally", ok:false},
    {t:"Reduce DPD timers to lighten gateway CPU load", ok:false}],
  hint:"One option silently cancels a compliance control. One option removes a fairness tool. One is a rounding error.",
  explain:"Capacity problems get capacity answers: more concentrator throughput and balanced pools — the compliance constraint (inspect everything) stays intact. Switching to split tunnel would offload bandwidth precisely by not inspecting traffic, which is the one thing the organization forbade. Removing QoS would let bulk downloads strangle the very VoIP calls users complain about — QoS is the tool that protects them. DPD timers are keep-alive messages: reducing them changes a negligible packet rate, not 95 percent CPU." },

{ id:"h20", type:"match", tags:["Hybrid","Routing"], title:"BGP path selection — steer the traffic", points:12,
  scenario:"You run dual circuits to the cloud and need to steer traffic deliberately: outbound one way, inbound another, with per-router overrides where needed. Match each BGP tool to its job.",
  question:"Match each BGP attribute to the steering job it does.",
  answerLabel:"PICK A JOB FOR EACH ATTRIBUTE",
  pairs:[
    {l:"local preference", r:"Chooses the outbound path — higher wins, shared with internal peers"},
    {l:"AS-path prepend", r:"Makes a path look longer so other ASes avoid it (inbound steering)"},
    {l:"MED", r:"Suggests to the neighboring AS which entry point to use"},
    {l:"weight", r:"Vendor-local override that never leaves the router"}],
  hint:"Two attributes steer outbound, two steer inbound — and one of the four never propagates at all.",
  explain:"BGP steering is symmetric by direction: outbound choice uses local preference (propagated to your whole AS, highest wins) and, as a last-resort per-router override, vendor-local weight that is never advertised. Inbound steering manipulates what others prefer: AS-path prepending makes your route look less attractive by lengthening the path, and MED politely suggests an entry point to the adjacent AS. Confusing outbound with inbound tools is the classic dual-circuit mistake — traffic obeys the attribute that acts on its direction." }
);

{ id:"h21", type:"fill", tags:["Addressing"], title:"Complete the IPv6 dual-stack rollout text", points:12,
  scenario:"The change record for tonight's IPv6 enablement needs exact terms. The reviewer rejects vague wording, so every blank must be the precise keyword.",
  question:"Complete the change record with the right keyword in each blank.",
  answerLabel:"PICK A WORD FOR EACH BLANK",
  text:"Assign each subnet an IPv6 range of {{0}}. Keep IPv4 alongside it — running both families at once is called {{1}}. For IPv6-only hosts that still need to reach IPv4-only internal services, plan translation, but for pure private IPv6 egress the platform offers the {{2}}. Finally, update every {{3}} so the rules cover the new address family too — forgotten rules are how new stacks leak.",
  blanks:["/64","dual stack","egress-only internet gateway","NSG"],
  bank:["/64","/128","dual stack","SLAAC","egress-only internet gateway","NSG","DHCP"],
  hint:"The standard subnet size for IPv6 is a single number; the gateway in the third blank works in one direction only.",
  explain:"IPv6 subnets conventionally use /64 — the standard boundary where autoconfiguration and tooling expect to work. Running IPv4 and IPv6 side by side is dual stack, the only migration path that keeps legacy apps untouched. An egress-only internet gateway lets IPv6 hosts initiate outbound connections while blocking unsolicited inbound — the IPv6 analogue of private-subnet NAT behavior. And security groups/NSGs must be extended to the new family explicitly: a rule set that only mentions IPv4 silently ignores IPv6 traffic, which is the classic rollout leak." },

{ id:"h22", type:"classify", tags:["VPN","Troubleshooting"], title:"Sort the symptoms by failing phase", points:12,
  scenario:"The NOC wants a diagnostic cheat-sheet: for each IPSec symptom, which stage is failing? Sorting these six symptoms correctly ends the 'is it Phase 1 or Phase 2?' debates at 03:00.",
  question:"Drag each symptom into the stage it indicts.",
  answerLabel:"DRAG THE ITEMS INTO A BUCKET",
  buckets:[{t:"Phase 1 fails"},{t:"Phase 2 fails"},{t:"Tunnel up, traffic still fails"}],
  items:[
    {t:"Wrong PSK / authentication timeout", bucket:0},
    {t:"NO_PROPOSAL_CHOSEN on CREATE_CHILD_SA", bucket:1},
    {t:"Traffic selector (proxy ID) mismatch", bucket:1},
    {t:"Missing route for the remote subnet", bucket:2},
    {t:"MTU black hole: big transfers stall, small ones pass", bucket:2},
    {t:"NSG blocks the inner traffic on one side", bucket:2}],
  hint:"Phase 1 is identity and control channel. Phase 2 is the data-SA negotiation. If both SAs are up, suspect routing, MTU or filters.",
  explain:"The layered read: authentication failures (PSK, certificates, timeouts) belong to Phase 1 — nothing above it can succeed. NO_PROPOSAL_CHOSEN on CREATE_CHILD_SA and traffic-selector mismatches are Phase 2 failures: the control channel exists, but the data SAs never get agreed. Once both SAs are up, IPSec is exonerated: missing routes, MTU black holes and NSG filters are all post-tunnel problems. This cheat-sheet cuts diagnosis time because each symptom names exactly one layer to inspect." },

{ id:"h23", type:"terminal", tags:["Troubleshooting"], title:"Terminal — capture and measure, your tooling", points:10,
  scenario:"Two operational goals, no tool names, no flags handed to you. The lab shell supports standard Linux network tooling. Addresses are defanged in this lab; type them exactly as displayed.",
  question:"Run one command per task in the terminal below.",
  answerLabel:"TYPE THE COMMANDS, PRESS ENTER AFTER EACH",
  echo:[
    {m:"^tcpdump", out:["tcpdump: listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes","... 200 packets captured","215 packets received by filter"]},
    {m:"^iperf3?", out:["Connecting to host perf-01, port 5201","[  5]  0.0-10.0 sec  11.2 GBytes  9.6 Gbits/sec  sender","[  5]  0.0-10.0 sec  11.2 GBytes  9.6 Gbits/sec  receiver"]}],
  goals:[
    {goal:"Capture exactly 200 packets on interface eth0 into the file /tmp/cap.pcap, without name resolution",
     acceptFn:function (cmd) {
       var l = ' ' + String(cmd).toLowerCase().replace(/\s+/g, ' ') + ' ';
       return l.indexOf('tcpdump') >= 0
         && /(^|\s|-)i\s*eth0\b/.test(l)
         && /-c\s*200\b/.test(l)
         && /-w\s*=?\s*\/tmp\/cap\.pcap\b/.test(l)
         && /(^|\s)-nn?(\s|$)/.test(l);
     },
     reveal:"tcpdump -i eth0 -c 200 -nn -w /tmp/cap.pcap"},
    {goal:"Measure network throughput to host perf-01 for a 10-second test as the client",
     acceptFn:function (cmd) {
       var l = ' ' + String(cmd).toLowerCase().replace(/\s+/g, ' ') + ' ';
       return /(^|\s)iperf3?(\s|$)/.test(l)
         && /-c\s+perf-01\b/.test(l)
         && /-t\s*10\b/.test(l);
     },
     reveal:"iperf3 -c perf-01 -t 10"}],
  hint:"One goal writes packets to a file (think capture tool with count, interface, output file and no-name-lookup flags); the other measures bandwidth in client mode for a fixed duration.",
  explain:"Goal 1 is tcpdump: -i picks the interface, -c bounds the capture at exactly 200 packets, -w writes the raw capture to /tmp/cap.pcap for later analysis, and -n (or -nn) stops name resolution so the capture starts instantly and shows raw addresses. Goal 2 is iperf/iperf3 in client mode: -c names the server and -t 10 bounds the test to ten seconds — the standard way to measure real, not theoretical, throughput. Choosing capture vs measurement tooling without being told is exactly the expert judgment this file tests." },

{ id:"h24", type:"branch", tags:["Virtual networks","Troubleshooting"], title:"The app that fails 'sometimes' — two real causes", points:12,
  scenario:"Since the migration, the internal app behind the load balancer drops connections for about a minute every few hours. Metrics show the backend pool emptying and, separately, connection storms at peak. Two distinct root causes are hiding here.",
  question:"Choose the correct action at each step.",
  answerLabel:"CHOOSE AN OPTION FOR EVERY STEP",
  steps:[
    {prompt:"Step 1 — where do you look first for a periodic pool-emptying pattern?",
     options:[
      {t:"The load balancer health-probe history aligned with backend logs at the same timestamps", ok:true, outcome:"Correct. 'Sometimes, for a minute' with an emptying pool smells like probe flapping — align the two timelines first."},
      {t:"Restart the load balancer", ok:false, outcome:"A restart destroys the very history you need and fixes nothing periodic."},
      {t:"Upgrade the backend VM sizes", ok:false, outcome:"Sizing is a capacity answer; this is a pattern question with a fixed period."}]},
    {prompt:"Step 2 — the probe checks TCP 80, but the app only serves on 8080. The pool empties whenever the checker loses the port. The fix:",
     options:[
      {t:"Point the probe at the real port/path the app serves", ok:true, outcome:"Correct. A probe must test the actual service; testing a port nobody listens on marks healthy VMs dead."},
      {t:"Open all ports on the NSG so the probe cannot miss", ok:false, outcome:"The probe was not blocked — it was testing the wrong thing. Opening ports widens exposure for no gain."},
      {t:"Remove health checks so the pool never empties", ok:false, outcome:"Unprobed backends receive traffic even when dead — worse failures, discovered by users."}]},
    {prompt:"Step 3 — probes fixed, but at peak the app still drops connections: SNAT ports on the egress path are exhausted. The correct fix:",
     options:[
      {t:"Scale SNAT capacity (add backend IPs / use a NAT gateway for egress) to enlarge the port budget", ok:true, outcome:"Correct. SNAT exhaustion is a capacity problem: more source IPs means more usable port space per destination."},
      {t:"Shorten the health-probe interval", ok:false, outcome:"Probes were already fixed and have nothing to do with outbound port exhaustion."},
      {t:"Disable TCP keepalives on the app", ok:false, outcome:"Keepalives actually help SNAT reuse; disabling them shortens nothing and fixes nothing."}]}],
  hint:"Two diseases, two timelines: one repeats on a probe rhythm, the other on a traffic rhythm.",
  explain:"Periodic failures deserve timeline analysis: health-probe history against backend logs reveals probe misconfiguration (checking a port the app does not serve), which empties the pool in rhythm. The second failure is SNAT port exhaustion: every outbound connection consumes a ephemeral source port per destination IP, and peak storms exhaust the budget, dropping new connections. The fixes are exactly orthogonal: probes must test reality, and port exhaustion needs a bigger port budget (more egress IPs or a NAT gateway)." },

{ id:"h25", type:"multi", tags:["DNS","Security controls"], title:"DNS hardening after a suspicious query pattern", points:10,
  scenario:"The private zone's query logs show thousands of unique subdomain lookups like a1b2c3.internal.corp from one VM — a classic DNS-tunneling fingerprint. Hardening is discussed in the meeting. Which measures are actually effective?",
  question:"Select all measures that genuinely help. ",
  answerLabel:"SELECT ALL THAT APPLY",
  choices:[
    {t:"Enable private-zone query logging and alert on high volumes of unique-name lookups", ok:true},
    {t:"Restrict which VMs may query external resolvers; force internal resolvers via NSG rules", ok:true},
    {t:"Audit conditional forwarders — forgotten forwarders are a quiet path out of the network", ok:true},
    {t:"Deploy DNSSEC, which prevents DNS data exfiltration", ok:false},
    {t:"Disable DNS caching on the VMs to stop the tunneling", ok:false}],
  hint:"DNSSEC proves answers are authentic. Does authenticity stop a machine from encoding stolen data IN its queries?",
  explain:"Detection (query logging with unique-name anomaly alerts), egress control (only approved resolvers reachable, enforced by NSG), and hygiene (auditing conditional forwarders that quietly bridge zones) all directly raise the cost of DNS tunneling. DNSSEC does not help here: it signs and authenticates DNS answers — it says nothing about a client encoding exfiltrated data inside queries. Disabling caching degrades performance and changes nothing: the tunnel lives in the queries, not the cache." },

{ id:"h26", type:"slot", tags:["Segmentation","Security controls"], title:"DMZ and three-tier — place the controls", points:16,
  scenario:"Hardening plan for the production VNet. Four control decisions need the right component in the right slot. Two pool items are traps.",
  question:"Drag the correct control into each slot. Two items are distractors.",
  answerLabel:"DRAG AN ITEM INTO EACH SLOT",
  slots:[
    {t:"Terminate external HTTPS and inspect layer 7"},
    {t:"Give admins recorded, brokered access to servers"},
    {t:"Make the database unreachable from the internet"},
    {t:"Enforce web-to-app and app-to-data flow rules"}],
  items:[
    {t:"WAF / load balancer in the DMZ subnet", slot:0},
    {t:"Bastion service with session recording in the mgmt subnet", slot:1},
    {t:"No public IP plus deny-by-default NSG on the data subnet", slot:2},
    {t:"Separate default-deny NSGs per tier with narrow allows", slot:3},
    {t:"One flat /16 with a strong perimeter firewall", slot:null},
    {t:"RDP open to the internet on the DB for admin speed", slot:null}],
  hint:"Each slot pairs a place with a control. The traps are the two answers that would undo the whole design.",
  explain:"The WAF/LB pair sits in the DMZ subnet — the only internet-facing zone — terminating TLS and inspecting HTTP. Administrative access belongs behind a bastion with session recording: every privileged action attributable, no direct RDP/SSH exposure. The database stays unreachable by construction: no public IP and a deny-by-default NSG. Tier-to-tier flows are governed by per-tier default-deny NSGs with narrow allows. The traps are the flat network (which concentrates all trust at the perimeter this design exists to replace) and internet-exposed RDP on the database — the anti-pattern every audit hunts." },

{ id:"h27", type:"qcm", tags:["Routing"], title:"Transitivity — which statement survives scrutiny?", points:10,
  scenario:"In a design review, four engineers state four 'facts' about hub-and-spoke networking. Only one survives the whiteboard.",
  question:"Which statement is TRUE?",
  answerLabel:"CHOOSE ONE",
  choices:[
    {t:"VNet/VPC peering is non-transitive; spoke-to-spoke via the hub needs a transit gateway or routed appliance", ok:true},
    {t:"Peering becomes transitive when both networks are in the same region", ok:false},
    {t:"Peering becomes transitive once BGP is enabled on the peering", ok:false},
    {t:"A transit gateway makes peering links transitive by definition", ok:false}],
  hint:"Peering is a pairwise contract. What does any pairwise contract guarantee about a third party?",
  explain:"Peering connects exactly two networks — period. Region, BGP or wishful thinking do not change it: A-peered-to-hub and B-peered-to-hub yields no A-to-B path, because hub platforms do not by default forward between peers. Spoke-to-spoke at scale needs a routing construct designed for transitivity: a transit gateway (or a routed hub appliance with explicit route tables). And the last option is backwards: the transit gateway does not make peerings transitive — it replaces them with a hub routing domain where transitivity is configured on purpose." },

{ id:"h28", type:"match", tags:["Troubleshooting"], title:"Error message → failing component", points:15,
  scenario:"Five messages from five different tickets. Match each message to the layer that actually failed — the fastest diagnostic skill in networking.",
  question:"Match each message with its failing component.",
  answerLabel:"PICK A COMPONENT FOR EACH MESSAGE",
  pairs:[
    {l:"IKEv2 NO_PROPOSAL_CHOSEN", r:"IPSec policy mismatch between the two gateways"},
    {l:"Destination host unreachable (from a gateway address)", r:"Routing — no usable route or a dead next hop"},
    {l:"Connection timed out (SYN sent, never answered)", r:"A silent firewall drop or a dead service"},
    {l:"ICMP type 3 code 4: fragmentation needed", r:"Path MTU smaller than the sender's packets"},
