<script>
/* ===== CyberPulse exam engine — core (framework part A) ===== */
(function () {
'use strict';

var CFG = window.__EXAM__;
var DATA = window.__EXAM_DATA__ || [];

/* ---------- tiny helpers ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $all(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html !== undefined) n.innerHTML = html; return n; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { var r = a.slice(), i, j, t; for (i = r.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
function fmtT(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function pts(x) { return (Math.round(x * 10) / 10).toString(); }
var toastH = null;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastH); toastH = setTimeout(function () { t.classList.remove('on'); }, 2800); }

/* ---------- inline confirm dialog (never window.confirm: sandboxed iframes block native modals) ---------- */
var confirmCb = null, confirmReturnFocus = null;
function openConfirm(title, body, cb) {
  confirmCb = cb;
  confirmReturnFocus = document.activeElement;
  $('#confirm-title').textContent = title;
  $('#confirm-text').textContent = body;
  $('#confirm-box').hidden = false;
  $('#confirm-yes').focus();
}
function closeConfirm(yes) {
  var box = $('#confirm-box');
  if (!box || box.hidden) return;
  box.hidden = true;
  var cb = confirmCb;
  confirmCb = null;
  if (confirmReturnFocus && confirmReturnFocus.focus) { try { confirmReturnFocus.focus(); } catch (e) {} }
  confirmReturnFocus = null;
  if (yes && cb) cb();
}

/* per-type pure validators / summaries live in ENGINE_TYPES (part B) */

var KEYWORD_THEMES = [
  ['VPN & IPSec', 'IPSec · IKEv2 · IKE Phase 1 / Phase 2 · Security Association (SA) · ESP · AH · tunnel mode · transport mode · site-to-site VPN · remote-access VPN · SSL/TLS VPN · split tunnel vs full tunnel · NAT-Traversal (UDP 4500) · UDP 500 · pre-shared key (PSK) · certificate auth · PFS · Dead Peer Detection · VPN concentrator · GRE over IPSec · MTU / MSS clamping'],
  ['Virtual networks', 'VPC · VNet · public / private subnet · CIDR block · route table · default route · internet gateway · NAT gateway · egress-only internet gateway · virtual private gateway (VGW) · customer gateway (CGW) · VNet / VPC peering · transit gateway (hub & spoke) · security group / NSG · network ACL · flow logs · vNIC · public vs private IP · L4 / L7 load balancer · health probe · SNAT'],
  ['Hybrid connectivity', 'BGP · static vs dynamic routing · ExpressRoute · Direct Connect · dedicated interconnect · SD-WAN · MPLS · route propagation · AS number · asymmetric routing'],
  ['DNS & traffic management', 'private DNS zone · split-horizon DNS · conditional forwarder · A / CNAME record · latency / weighted / failover / geo routing · CDN'],
  ['Segmentation', 'VLAN · VXLAN · overlay vs underlay · SDN · microsegmentation · east-west vs north-south traffic · DMZ · bastion / jump host · three-tier app · zero trust'],
  ['Addressing', 'IPv4 / IPv6 dual stack · DHCP · reserved IP · link-local addressing · SLAAC'],
  ['Troubleshooting', 'ping · traceroute · mtr · dig / nslookup · iperf · tcpdump · netstat · Test-NetConnection · TTL · ICMP type 3 code 4 · PMTUD'],
  ['Provider mapping', 'VPC ↔ VNet ↔ GCP VPC · Direct Connect ↔ ExpressRoute ↔ Cloud Interconnect · security group ↔ NSG · Route 53 ↔ Azure DNS ↔ Cloud DNS']
];

/* ---------- state ---------- */
var S;
function freshState() {
  return {
    started: false, finished: false,
    seq: [], cur: 0,
    inst: {}, ans: {},
    t: CFG.seconds, manualPause: false, checkPause: false,
    reported: false, username: ''
  };
}

/* ---------- pause helpers ---------- */
function anyPause() { if (!S) return true; return S.manualPause || S.checkPause || S.finished || !S.started; }
function pauseChipText() {
  if (S.manualPause && S.checkPause) return '⏸ Paused (manual) + review mode';
  if (S.manualPause) return '⏸ Paused (manual)';
  if (S.checkPause) return '⏸ Timer paused — review mode';
  return '';
}
function renderPause() {
  var chip = $('#pause-chip');
  var txt = pauseChipText();
  chip.hidden = !txt;
  chip.textContent = txt;
  $('#exam-wrap').classList.toggle('blurred', S.manualPause && !S.finished);
  $('#btn-pause').textContent = S.manualPause ? '▶ Resume' : '⏸ Pause';
  $('#timer').parentElement && ($('#timer').style.opacity = anyPause() ? '.55' : '1');
}

/* ---------- timer ---------- */
var warned5 = false, warned1 = false;
setInterval(function () {
  if (anyPause()) return;
  S.t--;
  if (S.t === 300 && !warned5) { warned5 = true; toast('⚠ 5 minutes left.'); }
  if (S.t === 60 && !warned1) { warned1 = true; toast('⚠ 1 minute left.'); }
  if (S.t <= 0) { S.t = 0; renderTimer(); endExam('time'); return; }
  renderTimer();
}, 1000);

function renderTimer() {
  var t = $('#timer');
  t.textContent = fmtT(S.t);
  t.classList.toggle('low', S.t > 0 && S.t <= 300);
  t.classList.toggle('crit', S.t <= 60);
  t.setAttribute('aria-label', 'Time remaining ' + fmtT(S.t) + (anyPause() ? ' — timer paused' : ''));
}

/* ---------- screens ---------- */
function show(id) {
  ['#intro-screen', '#exam-screen', '#results-screen'].forEach(function (s) { $(s).hidden = (s !== id); });
  $('#topbar').hidden = (id === '#intro-screen');
  $('#progress-wrap').hidden = (id !== '#exam-screen');
}

/* ---------- score / progress ---------- */
function totals() {
  var earned = 0, max = 0, answered = 0;
  DATA.forEach(function (ex, i) {
    var a = S.ans[i];
    if (a.skipped) return;
    max += ex.points;
    earned += (a.checked ? a.earned : 0);
    if (a.checked) answered++;
  });
  return { earned: earned, max: max, answered: answered, pct: max > 0 ? Math.round(earned / max * 100) : 0 };
}
function renderScore() {
  var tt = totals();
  $('#score-chip').textContent = '★ ' + pts(tt.earned) + ' pts · ' + tt.pct + '%';
  $('#score-chip').setAttribute('aria-label', 'Score ' + pts(tt.earned) + ' points, ' + tt.pct + ' percent');
  var done = tt.answered, total = DATA.length;
  $('#progress-bar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  $('#progress-label').textContent = done + ' of ' + total + ' exercises answered · ' + tt.pct + '% score (skipped ones are excluded)';
}

/* ---------- instances ---------- */
function makeInstance(ex) {
  var inst = { type: ex.type };
  var k;
  if (ex.type === 'qcm' || ex.type === 'multi' || ex.type === 'logview') {
    var src = ex.type === 'logview' ? ex.answer.choices : ex.choices;
    inst.choices = shuffle(src.map(function (c) { return { t: c.t, ok: !!c.ok }; }));
    inst.correctCount = inst.choices.filter(function (c) { return c.ok; }).length;
  }
  if (ex.type === 'classify') {
    inst.buckets = ex.buckets.map(function (b) { return { t: b.t }; });
    inst.items = shuffle(ex.items.map(function (it) { return { t: it.t, bucket: it.bucket }; }));
  }
  if (ex.type === 'slot') {
    inst.slots = ex.slots.map(function (s) { return { t: s.t }; });
    inst.items = shuffle(ex.items.map(function (it) { return { t: it.t, slot: (it.slot === undefined ? null : it.slot) }; }));
  }
  if (ex.type === 'order' || ex.type === 'rank') {
    inst.steps = shuffle(ex.steps.map(function (s, idx) { return { t: s.t, orig: idx }; }));
  }
  if (ex.type === 'match') {
    inst.pairs = ex.pairs.map(function (p) { return { l: p.l, r: p.r }; });
    inst.defs = shuffle(ex.pairs.map(function (p) { return p.r; }));
  }
  if (ex.type === 'fill') {
    inst.bank = shuffle(ex.bank.slice());
    inst.blanks = ex.blanks.slice();
  }
  if (ex.type === 'terminal') {
    inst.goals = ex.goals.map(function (g) { return { goal: g.goal, accept: g.accept || null, acceptFn: g.acceptFn || null, reveal: g.reveal || '' }; });
  }
  if (ex.type === 'branch') {
    inst.steps = ex.steps.map(function (st) {
      return {
        prompt: st.prompt,
        options: shuffle(st.options.map(function (o) { return { t: o.t, ok: !!o.ok, outcome: o.outcome }; }))
      };
    });
    inst.bs = { step: 0, chosen: [] };
  }
  if (ex.type === 'triage') {
    inst.alerts = ex.alerts.map(function (al) {
      return { title: al.title, log: al.log, choices: shuffle(al.choices.map(function (c) { return { t: c.t, ok: !!c.ok, outcome: c.outcome }; })) };
    });
  }
  return inst;
}

/* ---------- navigation ---------- */
function currentIdx() { return S.seq[S.cur]; }
function renderNav() {
  var grid = $('#nav-grid');
  grid.innerHTML = '';
  S.seq.forEach(function (idx, pos) {
    var a = S.ans[idx];
    var b = el('button', 'navbtn');
    b.type = 'button';
    var st = '', cls = '', word = 'not answered';
    if (a.skipped) { cls = 'skipped'; st = '↷'; word = 'skipped'; }
    else if (a.checked) {
      if (a.label === 'full') { cls = 'full'; st = '✓'; word = 'correct'; }
      else if (a.label === 'zero') { cls = 'zero'; st = '✗'; word = 'wrong'; }
      else { cls = 'partial'; st = '⚠'; word = 'partial'; }
    }
    if (pos === S.cur) { b.classList.add('cur'); word = 'current, ' + word; }
    b.className += ' ' + cls;
    b.innerHTML = String(pos + 1) + (st ? '<span class="st" aria-hidden="true">' + st + '</span>' : '');
    b.setAttribute('aria-label', 'Go to exercise ' + (pos + 1) + ' — ' + word);
    b.addEventListener('click', function () {
      if (S.finished) return;
      stashDraft();
      S.cur = pos;
      renderQ();
      renderNav();
      focusQ();
    });
    grid.appendChild(b);
  });
}

function focusQ() { var h = $('#q-card h3'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: false }); } }

function stashDraft() {
  if (S.finished) return;
  var idx = currentIdx(), a = S.ans[idx];
  if (!a || a.checked || a.skipped || !curApi) return;
  try { a.draft = a.dirty ? curApi.collect() : null; } catch (e) { /* keep old draft */ }
}

/* ---------- question rendering ---------- */
var curApi = null;
function renderQ() {
  var idx = currentIdx();
  var ex = DATA[idx];
  var inst = S.inst[idx];
  var a = S.ans[idx];
  curApi = null;

  $('#q-num').textContent = 'Exercise ' + (S.cur + 1) + ' of ' + S.seq.length;
  $('#q-type').textContent = (window.__TYPE_LABEL__ || {})[ex.type] || ex.type;
  $('#q-points').textContent = ex.points + ' pts';
  $('#q-scenario-body').innerHTML = ex.scenario;
  $('#q-question-body').innerHTML = ex.question;
  $('#q-answer-label').textContent = ex.answerLabel || 'YOUR ANSWER';

  var art = $('#q-artefacts');
  art.innerHTML = '';
  (ex.artefacts || []).forEach(function (af) {
    var sec = el('section', 'block artefact');
    sec.appendChild(el('h3', null, '🗂 ' + esc(af.label)));
    var pre = el('pre', 'artefact-pre');
    pre.textContent = (af.text || []).join('\n');
    sec.appendChild(pre);
    art.appendChild(sec);
  });

  var ansRoot = $('#q-answer');
  ansRoot.innerHTML = '';
  var hintBox = el('div', 'hintbox');
  hintBox.id = 'hintbox-' + idx;
  hintBox.hidden = true;
  ansRoot.appendChild(hintBox);
  var body = el('div');
  ansRoot.appendChild(body);

  curApi = (window.__TYPE_IMPL__ || {})[ex.type].build(body, ex, inst, {
    idx: idx,
    locked: function () { return S.ans[idx].checked || S.manualPause || S.finished; },
    dirty: function () { return !!S.ans[idx].dirty; },
    markDirty: function () { if (S.ans[idx]) S.ans[idx].dirty = true; }
  });

  /* restore previously checked state (review mode) */
  if (a.checked && a.val !== undefined && curApi.apply) {
    curApi.apply(a.val);
    curApi.reveal(a.res);
    curApi.lock();
    showFeedback(idx, a.res, ex, true);
  } else if (a.hintUsed) {
    hintBox.hidden = false;
    hintBox.innerHTML = '💡 <b>Hint</b> (−10% already applied): ' + esc(ex.hint);
  }

  $('#q-feedback').hidden = !a.checked;
  $('#btn-revise').hidden = !a.checked;
  updateButtons();
  if (!dirtyBound.bound) {
    dirtyBound.bound = true;
    ansRoot.addEventListener('change', markDirtyOnce);
    ansRoot.addEventListener('click', markDirtyOnce);
  }
}

var dirtyBound = {};
function markDirtyOnce(ev) {
  var idx = currentIdx();
  if (S.ans[idx]) S.ans[idx].dirty = true;
}

function updateButtons() {
  var idx = currentIdx(), a = S.ans[idx];
  $('#btn-prev').disabled = (S.cur === 0);
  $('#btn-next').disabled = (S.cur === S.seq.length - 1);
  $('#btn-skip').disabled = false;
  $('#btn-hint').disabled = !!(a && a.hintUsed);
  $('#btn-hint').textContent = a && a.hintUsed ? '💡 Hint used (−10%)' : '💡 Hint (−10%)';
}

/* ---------- check / hint / skip / revise ---------- */
function onCheck() {
  if (S.finished) return;
  var idx = currentIdx();
  var ex = DATA[idx];
  var a = S.ans[idx];
  if (!curApi) return;
  if (!a.dirty && !a.checked) { toast('Nothing to check yet — answer the exercise first (or press Skip).'); return; }
  if (a.checked) {
    /* re-check on a locked exercise: re-apply the Check-pause, same rules */
    S.checkPause = true;
    renderPause();
    toast('Timer paused — review mode. Press Next to resume.');
    return;
  }
  if (curApi.canCheck && !curApi.canCheck()) { toast('Finish every step of this exercise first.'); return; }
  var val = curApi.collect();
  var res = window.__ENGINE_TYPES__.validate(ex, S.inst[idx], val);
  if (res.blank) { toast('Give an answer first (or press Skip).'); return; }
  if (a.hintUsed) res.earned = Math.max(0, res.earned - res.max * 0.1);
  a.checked = true;
  a.skipped = false; /* finishing a previously skipped exercise scores it normally */
  delete a.skippedReason;
  a.val = val;
  a.res = res;
  a.earned = res.earned;
  a.label = labelOf(res);
  a.sum = window.__ENGINE_TYPES__.summary(ex, S.inst[idx], val);
  a.cor = window.__ENGINE_TYPES__.correctSummary(ex, S.inst[idx]);
  curApi.reveal(res);
  curApi.lock();
  showFeedback(idx, res, ex, false);
  $('#btn-revise').hidden = false;
  S.checkPause = true;
  renderPause();
  renderScore();
  renderNav();
  updateButtons();
  var fh = $('#q-feedback .fb-head');
  if (fh) { fh.setAttribute('tabindex', '-1'); fh.focus(); }
  toast('Timer paused — review mode. Press Next to resume.');
}

function labelOf(res) {
  if (res.earned >= res.max - 0.05) return 'full';
  if (res.earned <= 0.05) return 'zero';
  return 'partial';
}

function showFeedback(idx, res, ex, isReview) {
  var fb = $('#q-feedback');
  fb.hidden = false;
  fb.innerHTML = '';
  var lab = labelOf(res);
  var pill = lab === 'full' ? '<span class="pill ok">✓ Correct</span>'
    : lab === 'zero' ? '<span class="pill bad">✗ Wrong</span>'
    : '<span class="pill warn">⚠ Partially correct</span>';
  var head = el('div', 'fb-head');
  head.innerHTML = pill + '<span class="fb-points">You earned ' + pts(res.earned) + ' / ' + res.max + ' points on this exercise' +
    (S.ans[idx].hintUsed ? ' (includes the −10% hint cost)' : '') + '.</span>' +
    (isReview ? '<span class="pill dim">review of a checked answer</span>' : '');
  fb.appendChild(head);
  if (res.per && res.per.length > 1) {
    var list = el('div', 'fb-list');
    res.per.forEach(function (p) {
      var row = el('div', 'fb-item');
      var ic = p.ok ? '<span class="ic" style="color:var(--ok)">✓</span>'
        : (p.warn ? '<span class="ic" style="color:var(--warn)">⚠</span>'
        : '<span class="ic" style="color:var(--bad)">✗</span>');
      row.innerHTML = ic + '<span>' + esc(p.text) + (p.warn ? ' — <b style="color:var(--warn)">missed</b>' : (p.ok ? '' : ' — <b style="color:var(--bad)">wrong</b>')) + '</span>';
      list.appendChild(row);
    });
    fb.appendChild(list);
  }
  var exp = el('div', 'fb-explain');
  exp.innerHTML = '<b>Why:</b> ' + ex.explain;
  fb.appendChild(exp);
}

function onHint() {
  var idx = currentIdx();
  var a = S.ans[idx];
  if (a.hintUsed) return;
  a.hintUsed = true;
  var hb = $('#hintbox-' + idx);
  if (hb) {
    hb.hidden = false;
    hb.innerHTML = '💡 <b>Hint</b> (costs −10% of this exercise): ' + esc(DATA[idx].hint);
  }
  updateButtons();
  renderScore();
}

function onSkip() {
  if (S.finished) return;
  var idx = currentIdx();
  var a = S.ans[idx];
  if (!a.checked) { a.skipped = true; a.draft = null; }
  if (S.cur < S.seq.length - 1) { S.cur++; renderQ(); renderNav(); focusQ(); }
  else { renderNav(); toast('Last exercise — press Submit exam to finish.'); }
  renderScore();
  updateButtons();
}

function onRevise() {
  var idx = currentIdx();
  var a = S.ans[idx];
  if (!a.checked) return;
  openConfirm('Revise this exercise?',
    'Revise clears the checked state of this exercise. Your validated answer is removed and you must press Check again to score it. The timer keeps running while you revise. Continue?',
    function () {
      a.checked = false; a.val = undefined; a.res = null; a.earned = 0; a.label = null; a.dirty = false; a.draft = null;
      renderQ();
      renderScore();
      renderNav();
      updateButtons();
    });
}

function onNext() {
  if (S.finished) return;
  stashDraft();
  if (S.cur < S.seq.length - 1) {
    S.cur++;
    S.checkPause = false; /* only Next resumes the Check-pause */
    renderPause();
    renderQ();
    renderNav();
    focusQ();
  } else {
    toast('This is the last exercise — press Submit exam.');
  }
  updateButtons();
}

function onPrev() {
  if (S.finished) return;
  stashDraft();
  if (S.cur > 0) { S.cur--; renderQ(); renderNav(); focusQ(); }
  updateButtons();
}

/* ---------- submit / time end ---------- */
function endExam(reason) {
  if (S.finished) return;
  S.finished = true;
  stashDraft();
  var skippedList = [], autoChecked = 0;
  DATA.forEach(function (ex, i) {
    var a = S.ans[i];
    if (a.checked) return;
    if (a.skipped) { skippedList.push(i); return; }
    var val = (a.draft === undefined ? null : a.draft);
    var res = window.__ENGINE_TYPES__.validate(ex, S.inst[i], val);
    if (res.blank) { a.skipped = true; a.skippedReason = reason === 'time' ? 'no answer when time ended' : 'no answer at submit'; skippedList.push(i); return; }
    if (a.hintUsed) res.earned = Math.max(0, res.earned - res.max * 0.1);
    a.checked = true; a.val = val; a.res = res; a.earned = res.earned; a.label = labelOf(res);
    a.sum = window.__ENGINE_TYPES__.summary(ex, S.inst[i], val);
    a.cor = window.__ENGINE_TYPES__.correctSummary(ex, S.inst[i]);
    autoChecked++;
  });
  if (window.__ENGINE_RESULTS__) window.__ENGINE_RESULTS__.renderResults(reason);
}

function onSubmit() {
  var tt = totals();
  var skippedCount = DATA.filter(function (ex, i) { return S.ans[i].skipped; }).length;
  var unchecked = DATA.filter(function (ex, i) { return !S.ans[i].checked && !S.ans[i].skipped; }).length;
  if (tt.answered === 0 && skippedCount === DATA.length) {
    toast('You skipped every exercise. Answer at least one exercise before submitting.');
    return;

      if (!themes[t]) themes[t] = { e: 0, m: 0 };
      var a = st.ans[i];
      if (a.skipped) return;
      themes[t].m += ex.points;
      themes[t].e += (a.checked ? a.earned : 0);
    });
  });
  var tp = el('div', 'panel');
  tp.innerHTML = '<h2 style="margin:0 0 6px;font-size:18px">📈 Per-theme progress</h2><p class="intro-sub" style="margin:0 0 8px">Earned points per keyword theme (skipped exercises excluded).</p><div class="theme-progress" id="theme-chips"></div>';
  root.appendChild(tp);
  var tc = $('#theme-chips');
  Object.keys(themes).forEach(function (t) {
    var v = themes[t];
    var p = v.m ? Math.round(v.e / v.m * 100) : 0;
    tc.appendChild(el('span', 'pill ' + (p >= 70 ? 'ok' : p > 0 ? 'warn' : 'bad'), t + ': ' + p + '%'));
  });

  if (skipped) {
    var sn = el('div', 'panel');
    var names = [];
    st.seq.forEach(function (idx, pos) { if (st.ans[idx].skipped) names.push('#' + (pos + 1) + ' ' + DATA[idx].title); });
    sn.innerHTML = '<span class="rep-skipped-note">↷ Skipped exercises (excluded from scoring — their points were removed from the total): ' + esc(names.join(' · ')) + '</span>';
    root.appendChild(sn);
  }

  var rep = el('div', 'panel');
  rep.appendChild(el('h2', null, '📝 Detailed report — every exercise'));
  rep.appendChild(el('p', 'intro-sub', 'Your answer, the correct answer, the points earned, and an explanation for every exercise — including skipped ones.'));
  st.seq.forEach(function (idx, pos) {
    var ex = DATA[idx];
    var a = st.ans[idx];
    var row = el('div', 'rep-row');
    var head = el('div', 'rep-head');
    head.innerHTML = '<span class="rep-num">Q' + (pos + 1) + '</span><span class="rep-title">' + esc(ex.title) + '</span>' +
      '<span class="pill ' + pillClass(a) + '">' + pillText(a) + '</span>' +
      '<span class="chip">' + pts(a.checked ? a.earned : 0) + ' / ' + ex.points + ' pts</span>';
    row.appendChild(head);
    var body = el('div', 'rep-body');
    var ty = el('div', 'rep-line');
    ty.innerHTML = '<span class="lab">TYPE</span> ' + esc(TYPE_LABEL[ex.type] || ex.type) + ' · themes: ' + esc((ex.tags || []).join(', '));
    body.appendChild(ty);
    var ya = el('div', 'rep-line');
    ya.innerHTML = '<span class="lab">YOUR ANSWER</span> ' + esc(a.skipped ? '(skipped — not scored)' : (a.sum || '(no answer)')) +
      (a.skipped && a.skippedReason ? ' — ' + esc(a.skippedReason) : '');
    body.appendChild(ya);
    var ca = el('div', 'rep-line');
    ca.innerHTML = '<span class="lab">CORRECT ANSWER</span> ' + esc(a.cor || '');
    body.appendChild(ca);
    var exl = el('div', 'rep-explain');
    exl.innerHTML = '<span class="lab">WHY</span><br>' + ex.explain;
    body.appendChild(exl);
    row.appendChild(body);
    rep.appendChild(row);
  });
  root.appendChild(rep);

  var actions = el('div', 'panel');
  actions.style.textAlign = 'center';
  var rb = el('button', 'btn primary', '↺ Retake exam');
  rb.style.minWidth = '200px';
  rb.addEventListener('click', function () { startExam(); });
  actions.appendChild(rb);
  root.appendChild(actions);

  /* report exactly once per attempt, after the results render (the score is final here) */
  if (!st.reported) {
    st.reported = true;
    var answeredMax = 0, answeredEarned = 0;
    DATA.forEach(function (ex, i) {
      var a = st.ans[i];
      if (a.skipped || !a.checked) return;
      answeredMax += ex.points;
      answeredEarned += a.earned;
    });
    var pct2 = answeredMax > 0 ? Math.round(answeredEarned / answeredMax * 100) : 0;
    C.reportScore(Math.round(answeredEarned), Math.round(answeredMax), pct2, pct2 >= CFG.passMark);
  }
  window.scrollTo(0, 0);
}

function pillClass(a) {
  if (a.skipped) return 'warn';
  if (a.label === 'full') return 'ok';
  if (a.label === 'zero') return 'bad';
  return 'warn';
}
function pillText(a) {
  if (a.skipped) return '↷ skipped';
  if (a.label === 'full') return '✓ full';
  if (a.label === 'zero') return '✗ zero';
  return '⚠ partial';
}

/* ---------- flow ---------- */
var pendingUsername = '';
function startExam() {
  var fresh = C.freshState();
  fresh.username = pendingUsername;
  C.S = fresh;
  var st = S();
  st.started = true;
  st.t = CFG.seconds;
  C.resetTimerWarnings();
  DATA.forEach(function (ex, i) {
    st.inst[i] = C.makeInstance(ex);
    st.ans[i] = { checked: false, skipped: false, hintUsed: false, dirty: false, draft: null, val: undefined, res: null, earned: 0, max: ex.points, label: null, sum: '', cor: '' };
  });
  st.seq = C.shuffle(DATA.map(function (ex, i) { return i; }));
  st.cur = 0;
  C.show('#exam-screen');
  $('#exam-title').textContent = CFG.title;
  var sev = $('#sev-chip');
  sev.className = 'chip sev-' + CFG.severity;
  sev.textContent = CFG.severity === 'hard' ? '🔥 HARD' : '🎯 MEDIUM';
  C.renderTimer();
  C.renderPause();
  C.renderScore();
  C.renderNav();
  C.renderQ();
  C.focusQ();
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
window.addEventListener('message', function (event) {
  if (!event.data || (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT')) return;
  pendingUsername = event.data.username || '';
  if (C.S) C.S.username = pendingUsername;
  var slot = $('#intro-candidate');
  if (slot) slot.textContent = pendingUsername ? ('Candidate: ' + pendingUsername) : '';
  /* theme: this file ships a dark theme only, so the site's light theme is deliberately not applied. */
});

document.addEventListener('DOMContentLoaded', function () {
  $('#btn-pause').addEventListener('click', function () {
    var st = S();
    if (st.finished || !st.started) return;
    st.manualPause = !st.manualPause;
    C.renderPause();
  });
  $('#btn-resume').addEventListener('click', function () {
    var st = S();
    if (st.finished || !st.started || !st.manualPause) return;
    st.manualPause = false;
    C.renderPause();
  });
  $('#btn-check').addEventListener('click', C.onCheck);
  $('#btn-hint').addEventListener('click', C.onHint);
  $('#btn-skip').addEventListener('click', C.onSkip);
  $('#btn-revise').addEventListener('click', C.onRevise);
  $('#btn-next').addEventListener('click', C.onNext);
  $('#btn-prev').addEventListener('click', C.onPrev);
  $('#btn-submit').addEventListener('click', C.onSubmit);
  $('#confirm-yes').addEventListener('click', function () { C.closeConfirm(true); });
  $('#confirm-no').addEventListener('click', function () { C.closeConfirm(false); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') C.closeConfirm(false); });
  renderIntro();
  C.show('#intro-screen');
});

window.__ENGINE_RESULTS__ = { renderResults: renderResults };
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
