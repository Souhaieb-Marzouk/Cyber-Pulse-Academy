/* ---- grading ---- */
function reTest(cmd,rx){var c=String(cmd||'').replace(/\s+/g,' ').trim().replace(/;+$/,'');return new RegExp(rx,'i').test(c)}
function gradeEx(ex,gi){
 var a=S.ans[gi],g={hits:0,els:1};
 if(ex.t==='qcm'){g.hits=(a===ex.a)?1:0}
 else if(ex.t==='logv'){
  if(ex.qt==='multi'){g.els=ex.a.length;a.forEach(function(k){if(ex.a.indexOf(k)>-1)g.hits++})}
  else g.hits=(a===ex.a)?1:0;
 }
 else if(ex.t==='multi'){g.els=ex.a.length;a.forEach(function(k){if(ex.a.indexOf(k)>-1)g.hits++})}
 else if(ex.t==='drop'){g.els=ex.items.length;ex.items.forEach(function(it,k){if(a[k]===it.c)g.hits++})}
 else if(ex.t==='order'||ex.t==='rank'){g.els=ex.steps.length;a.forEach(function(si,pos){if(si===pos)g.hits++})}
 else if(ex.t==='match'){g.els=ex.pairs.length;for(var l in a){if(a[l]===+l)g.hits++}}
 else if(ex.t==='fill'){g.els=ex.a.length;for(var n=1;n<=ex.a.length;n++){if(a[n]===ex.a[n-1])g.hits++}}
 else if(ex.t==='spot'){g.els=ex.bad.length;a.forEach(function(i){if(ex.bad.indexOf(i)>-1)g.hits++})}
 else if(ex.t==='term'){g.els=ex.tasks.length;ex.tasks.forEach(function(t,i){if(t.accept.some(function(rx){return reTest(a[i],rx)}))g.hits++})}
 else if(ex.t==='branch'){g.els=ex.nodes.length;a.forEach(function(c,j){if(c===ex.nodes[j].a)g.hits++})}
 else if(ex.t==='dual'){g.els=2;g.hits=(a[0]===ex.A.a?1:0)+(a[1]===ex.B.a?1:0)}
 return g;
}
function readyMsg(ex,gi){
 var a=S.ans[gi];
 if(ex.t==='qcm'){if(a<0)return 'Choose one answer first.'}
 else if(ex.t==='logv'){
  if(ex.qt==='multi'){if(!a.length)return 'Select at least one answer.'}
  else if(a<0)return 'Choose one answer first.';
 }
 else if(ex.t==='multi'){if(!a.length)return 'Select at least one answer.'}
 else if(ex.t==='drop'){var left=ex.items.length-Object.keys(a).length;if(left)return 'Place every item first \u2014 '+left+' left.'}
 else if(ex.t==='match'){var left2=ex.pairs.length-Object.keys(a).length;if(left2)return 'Match every term first \u2014 '+left2+' left.'}
 else if(ex.t==='fill'){for(var n=1;n<=ex.a.length;n++){if(a[n]===undefined)return 'Fill every blank first.'}}
 else if(ex.t==='spot'){if(!a.length)return 'Click at least one line.'}
 else if(ex.t==='term'){var miss=0;ex.tasks.forEach(function(t,i){if(!String(a[i]||'').trim())miss++});if(miss)return 'Run every task first \u2014 '+miss+' command(s) still empty.'}
 else if(ex.t==='branch'){
  if(S.reveal[gi]<ex.nodes.length)return 'Answer the current step to unlock the next one.';
  if(a.length<ex.nodes.length)return 'Choose an option on every step.';
 }
 else if(ex.t==='dual'){if(a[0]<0)return 'Answer the blue-team side first.';if(a[1]<0)return 'Answer the red-team side too.'}
 return null;
}

 +'<li><b>Scenario, question, answers</b> \u2014 every exercise shows the scenario in its own blue block, the question in an amber block, and the answers in a separate area. You never have to guess what is being asked.</li>'
 +'<li><b>Check</b> \u2014 validates your answer, marks every element green (correct), red (wrong) or amber (missed / partial), locks the answer for scoring, and shows an explanation. It also pauses the timer automatically (review mode): the exercise and explanation stay visible, and the clock resumes only when you press <b>Next</b>.</li>'
 +'<li><b>Manual Pause</b> \u2014 a separate button. While you are manually paused, the exercise content is hidden so it cannot be studied; press Resume to continue. The two pauses are independent and can stack.</li>'

CFG={"docTitle": "CompTIA Cloud+ (CV0-004) — 1.6 Database Fundamentals — MEDIUM practice exam", "ttl": "Cloud+ 1.6 Database Fundamentals", "sev": "MEDIUM", "min": 90, "pass": 70};
EX=[
{"t":"qcm","h":"Pick the right model for an inventory system","th":"REL",
"sc":"Helios Retail is building an inventory application on a public cloud. The data must follow a fixed structure: products, warehouses, and stock movements. Stock numbers must always balance, so wrong values must be rejected by the database itself. Reports frequently pull data from two or three of these tables at the same time. The team wants the database to enforce these rules, not the application code.",
"q":"Which database type fits this workload best?",
"ch":["A document store that keeps flexible JSON documents","A relational DBMS that enforces constraints between tables","A key-value store tuned for very fast single-key reads","A column-family store built for massive write throughput"],
"a":1,
"hint":"Ask yourself: which model can check relationships between tables and reject bad rows by itself?",
"exp":"<b>A relational database (RDBMS) is correct.</b> The app needs JOINs across products, warehouses and stock moves, a fixed <b>schema</b>, and <b>constraints</b> (like foreign keys and checks) that the database enforces itself. A <b>document store</b> stores flexible JSON, so it will not stop a movement that points to a missing product. A <b>key-value store</b> is a fast lookup of one value by one key — great for sessions, wrong for reports with JOINs. A <b>column-family store</b> shines at huge write volumes and wide rows, not at many small connected tables."},
{"t":"drop","h":"Five database models, five workloads","th":"NOS",
"sc":"You are the platform architect at Vantara Group. Six teams sent you workload descriptions. Your job: put each workload on the database model that matches it. Distractors exist on purpose — read every trait twice.",
"q":"Sort each workload onto the database model it describes.",
"cats":["Relational (RDBMS)","Document","Key-value","Column-family / wide-column","Graph"],
"items":[
{"x":"A shopping cart session kept as one blob under a session ID","c":2},
{"x":"A catalog where each product JSON can have different fields, queried inside the JSON","c":1},
{"x":"Order header rows linked to customer rows with a foreign key","c":0},
{"x":"Billions of sensor rows written fast and scanned by column per device","c":3},
{"x":"Friend-of-friend recommendations that walk relationships","c":4},
{"x":"Sub-millisecond reads of tokens and feature flags by exact key","c":2},
{"x":"Shortest-path queries between people, accounts and devices","c":4},
{"x":"Time-series heartbeats queried by device ID plus hour bucket","c":3}],
"hint":"Two workloads land on the same model — sessions/tokens are the key-value pair; paths and rings are the graph pair.",
"exp":"<b>Key-value</b> = one opaque value per key: the session blob and the token lookups (schema-on-read does not even apply here). <b>Document</b> = self-describing records with different fields queried inside the JSON — the catalog with per-product fields. <b>Relational</b> = foreign keys between order and customer rows. <b>Column-family / wide-column</b> = massive writes and scans keyed by row key — sensor rows and heartbeats by device + hour. <b>Graph</b> = walking relationships: friend-of-friend and shortest-path. Note the difference between <b>schema-on-write</b> (relational: shape fixed before insert) and <b>schema-on-read</b> (document/lake: shape decided when you read). One warning for the catalog team: if you build query filters from raw user input on a document store, you invite <b>NoSQL injection</b> — build filters with typed code and a <b>parameterized query</b> builder instead."},
{"t":"fill","h":"Harden the orders table definition","th":"REL",
"sc":"A junior engineer at Northwind Logistics drafted this SQL for the orders table on the managed cloud database. The DBA left four gaps. The rule: every order belongs to exactly one customer, totals can never be negative, and the table needs a unique row identifier.",
"q":"Complete the CREATE TABLE statement with the four missing keywords.",
"tx":"CREATE TABLE orders (<br>&nbsp;&nbsp;order_id BIGINT __1__,<br>&nbsp;&nbsp;customer_id INT,<br>&nbsp;&nbsp;__2__ (customer_id) REFERENCES customers(customer_id),<br>&nbsp;&nbsp;total NUMERIC(10,2) __3__ (total >= 0),<br>&nbsp;&nbsp;PRIMARY KEY (__4__)<br>);",
"bank":["NOT NULL","FOREIGN KEY","CHECK","order_id","UNIQUE","DEFAULT"],
"a":["NOT NULL","FOREIGN KEY","CHECK","order_id"],
"hint":"Blank 1 stops empty values; blank 2 points at another table; blank 3 rejects rows that break a rule.",
"exp":"Blank 1 is <b>NOT NULL</b>: an order row without an id is garbage, so the column refuses empty values. Blank 2 is a <b>FOREIGN KEY</b>: it makes customer_id point at a real row in customers — the relational way to connect tables and the heart of the <b>schema</b>. Blank 3 is a <b>CHECK</b> constraint: it rejects totals below zero at the database, not in app code. Blank 4 names <b>order_id</b> inside PRIMARY KEY — the unique row identifier that JOINs and indexes rely on (PRIMARY KEY is stronger than UNIQUE: one per table, never NULL). DEFAULT only fills values you do not provide — not a rule. Relational design keeps one fact in one place — that discipline is called <b>normalization</b>; and in production, changes like this ship through an <b>expand-contract</b> migration so the live table never blocks."},
{"t":"order","h":"Regional outage: run the recovery runbook","th":"AVL",
"sc":"02:14 UTC — the cloud region hosting the primary of the orders database reports a full zone failure. You are the on-call DBA at Cobalt Bank. The database runs as a managed service with an asynchronous read replica in a second region. Nobody is writing right now; the incident manager opened the bridge.",
"q":"Put the recovery runbook steps in the correct order.",
"steps":["Declare the incident and open the command channel","Check replica health and replication lag in the secondary region","Promote the read replica to primary","Point the application connection string at the new primary","Validate data integrity and run application smoke tests","Fail back to the original region later, in a planned window"],
"hint":"You cannot promote what you have not checked — and you never point users at data you have not tested.",
"exp":"The safe order is: <b>declare</b> (so people stop improvising), <b>check replica health and lag</b> (promotion with big lag loses transactions — this is the risk of asynchronous replication), <b>promote</b> the replica, <b>repoint the connection string</b> (usually one DNS or secret change), then <b>validate</b> with integrity checks and smoke tests before traffic grows, and finally <b>fail back</b> in a calm, planned window — never during the emergency. The managed platform runs its own <b>quorum</b> check and <b>fencing</b> rules before promotion, so the old primary can never also take writes. Promoting before checking is the classic mistake: you might promote a replica that is minutes behind."},
{"t":"logv","h":"Why is db-prod-02 so slow?","th":"PFM",
"sc":"Helios Retail customers say the order search takes seconds. The slow query log of db-prod-02 (managed PostgreSQL, 10[.]44[.]12[.]7) for the last minutes is below. Normal queries finish in under 50 ms.",
"src":"slow query log — db-prod-02",
"logs":[
{"t":"09:41:02","l":"WARN","m":"duration 4210 ms  exec 2  user=orders_app  SELECT * FROM order_events WHERE LOWER(email)=$1"},
{"t":"09:41:05","l":"INFO","m":"duration 38 ms   exec 1  user=orders_app  SELECT id,status FROM orders WHERE order_id=$1"},
{"t":"09:41:09","l":"WARN","m":"duration 3894 ms  exec 2  user=orders_app  SELECT * FROM order_events WHERE LOWER(email)=$1"},
{"t":"09:41:12","l":"INFO","m":"duration 41 ms   exec 1  user=svc_report  SELECT count(*) FROM orders WHERE created_at>=$1"},
{"t":"09:41:15","l":"WARN","m":"duration 4402 ms  exec 3  user=orders_app  SELECT * FROM order_events WHERE LOWER(email)=$1"},
{"t":"09:41:18","l":"INFO","m":"checkpoint complete: wrote 214 buffers"},
{"t":"09:41:21","l":"WARN","m":"duration 3777 ms  exec 1  user=orders_app  SELECT * FROM order_events WHERE LOWER(email)=$1"}],
"qt":"qcm",
"q":"One query is the outlier. What is the most likely root cause and the right first fix?",
"ch":["The function LOWER() on the column blocks the index, so every run is a full table scan; add an expression index or store a normalized column","A long transaction holds row locks, so the reads must wait for it to commit","The instance is out of connection slots, so queries queue before they start","The WHERE clause matches too many rows, so the fix is pagination in the app"],
"a":0,
"hint":"Compare the shape of the slow query with the fast ones. What does LOWER() do to index use?",
"exp":"<b>The function-wrapped column is the root cause.</b> A standard index on email stores raw values; a predicate like <code>LOWER(email)=$1</code> is not <b>sargable</b> — the planner cannot use that index, so each run is a <b>full table scan</b> of order_events. Fixes: an expression index on LOWER(email), or a normalized email column kept lowercase. Locks would hit many different queries, not one shape; connection-slot problems fail fast with errors, not 4-second waits; and the log shows exec counts of 1–3, so this is not a huge result set. This is classic query optimization: read the <b>slow query log</b>, then read the <b>execution plan</b> before changing anything."},
{"t":"term","h":"Ticket #4821: orders per status","th":"REL",
"sc":"Support ticket #4821 at Northwind Logistics: the ops team needs the number of orders in each status, biggest group first, pasted into the ticket. You are logged into the reporting console of the orders database.",
"q":"Two tasks in the reporting console: first a quick look at the raw table, then the grouped report the ticket asks for. Run each statement with Enter (or the Run button), then press Check.",
"host":"db-report-01.internal","ps1":"orders=>",
"banner":"orders reporting console — connected as analyst (read only)\nType your SQL statement and press Enter. Type help to see the schema reminder.",
"schema":"orders(order_id INT, status TEXT, total NUMERIC, created_at TIMESTAMP)  -- statuses: shipped, delivered, pending, cancelled",
"tasks":[
{"q":"Warm-up: show the first 5 rows of the orders table, every column.","accept":["^select\\s+\\*\\s+from\\s+orders\\s+limit\\s+5$"],"out":" order_id | status  |  total \n----------+-----------+---------\n     1001 | shipped   |  129.90 \n     1002 | pending   |   59.00 \n     1003 | delivered |  249.99 \n     1004 | shipped   |   79.50 \n     1005 | cancelled |   12.25 \n(5 rows)","ex":"SELECT * FROM orders LIMIT 5;"},
{"q":"Use a SQL SELECT with GROUP BY on the orders table (columns: order_id, status, total). Show each status and its count, largest count first. Example of the expected output shape:<br><code>status&nbsp;&nbsp;| count<br>---------+------<br>shipped&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;412</code>","accept":["^select\\s+status\\s*,\\s*count\\s*\\(\\s*\\*\\s*\\)(\\s+as\\s+\\w+)?\\s+from\\s+orders\\s+group\\s+by\\s+status(\\s+having\\s+.+)?\\s+order\\s+by\\s+(count\\s*\\(\\s*\\*\\s*\\)|2)\\s+desc$"],"out":"   status   | count\n------------+-------\n shipped    |   412\n delivered  |   388\n pending    |    96\n cancelled  |    31\n(4 rows)","ex":"SELECT status, COUNT(*) FROM orders GROUP BY status ORDER BY COUNT(*) DESC;"}
],
"hint":"Task 1 is a plain SELECT with LIMIT 5. For task 2: COUNT(*) counts rows, GROUP BY status makes one row per status, ORDER BY ... DESC puts the biggest group first.",
"exp":"The SQL query the ticket needs has three building blocks. <b>COUNT(*)</b> counts rows. <b>GROUP BY status</b> collapses all rows into one row per status value. <b>ORDER BY COUNT(*) DESC</b> (or ORDER BY 2 DESC, which means the second column) sorts biggest first. Without GROUP BY, COUNT(*) returns a single total; without DESC, the smallest group would come first. This is the everyday reporting pattern behind every dashboard chart."},
{"t":"branch","h":"Replica lag alarm during the nightly batch","th":"AVL",
"sc":"You are the database on-call at Helios Retail. The managed database has one primary and one read replica in another zone. At 02:30 the monitor fires: replica_lag_seconds = 480 and climbing on db-orders-r01.",
"nodes":[
{"s":"Dashboards and reports read from the replica. Lag is 8 minutes and climbing during the nightly batch window. What do you do first?",
"ch":["Promote the replica to primary immediately","Check whether the batch is producing a write storm and whether readers tolerate stale data","Delete and recreate the replica","Reboot the primary instance"],
"a":1,
"w":"Lag is a symptom. First find the writer causing it and confirm readers can wait — promoting is a heavy, risky move that does not fix a write storm."},
{"s":"You confirm: the nightly ETL is rewriting 2 million rows, and dashboards on the replica now show stale numbers. Business says dashboards must be current during the batch. Next move?",
"ch":["Temporarily point the dashboards at the primary for the batch window","Leave the dashboards on the replica and accept the staleness","Increase the replica storage size","Cancel the nightly ETL from now on"],
"a":0,
"w":"If stale reads are not acceptable, move the stale-tolerant readers to fresh data — at the price of some primary load. Storage size does not affect replication speed much, and killing the ETL breaks the warehouse."},
{"s":"After the batch, lag drops but settles at 300 seconds every night. The replica has CPU at 95% while replaying writes. What is the durable fix?",
"ch":["Upgrade the primary instance class","Scale up the replica (more CPU/IO) or add a second replica to share the read load","Drop the indexes on the replica","Do nothing; 5 minutes of lag is fine forever"],
"a":1,
"w":"The replica cannot replay writes fast enough — give it resources or spread reads over more replicas. Bigger primary does not speed up replay, and removing indexes makes every dashboard query slower."}],
"q":"Step through the incident: choose the best action at each step.",
"hint":"Treat the three steps as: diagnose the writer, protect the readers, then fix the replay capacity.",
"exp":"Replication lag means the <b>asynchronous replica</b> trails the primary. Step 1: diagnose before acting — a write storm from the ETL is the usual nightly suspect. Step 2: readers that cannot tolerate stale data move to the primary (trade-off: more primary load). Step 3: if the replica cannot keep up even after the storm (high CPU replaying), scale the replay side — a stronger replica or more replicas to divide read traffic. This is the standard playbook for <b>high availability</b> setups where <b>read replicas</b> also serve queries."},
{"t":"spot","h":"Review the connection config","th":"SEC",
"sc":"A developer committed this connection file for the production orders database at Vantara Group. The security team flagged it. Click every line that is a real problem — not style, security.",
"q":"Which lines must be fixed before this file ships? Click every faulty line.",
"code":["db.host = db-prod-02.internal","db.port = 5432","db.sslmode = disable","db.user = orders_app","db.password = Spring2024!","db.name = orders"],
"bad":[2,4],
"hint":"One line lets anyone on the path read the traffic. One line stores a secret where code lives.",
"exp":"Line 3 (<code>sslmode = disable</code>) kills <b>encryption in transit</b> — credentials and customer data cross the network in clear text. Always require TLS for a cloud database. Line 5 hardcodes a password in a file: secrets belong in a secret manager, must support <b>credential rotation</b>, and end up copied into repos and backups. The host, port, app user name and database name are all fine — the app user exists, and least privilege is about its grants, not its name."},
{"t":"match","h":"Recovery terms on the whiteboard","th":"AVL",
"sc":"Monday training at Cobalt Bank: the DR lead drew five terms on the whiteboard and five definitions from the backup policy. New joiners must pair them before touching any console.",
"q":"Match each term to its definition.",
"pairs":[
["RPO","The maximum data loss you accept, for example 5 minutes of lost transactions"],
["RTO","The maximum time to restore the service after an outage"],
["Snapshot","A point-in-time copy of the database volume, fast and cheap to take"],
["Point-in-time recovery","Rebuild the database to any chosen minute using backups plus the transaction log"],
["Replication lag","The delay before a change appears on the replica"]],
"hint":"Two terms are targets (how much / how long), two are mechanisms, one is a delay you measure.",
"exp":"<b>RPO</b> (Recovery Point Objective) is about <b>data loss</b>: how many minutes of transactions you can afford to lose. <b>RTO</b> (Recovery Time Objective) is about <b>downtime</b>: how fast you must be back. A <b>snapshot</b> is a frozen copy of the volume at one moment. <b>Point-in-time recovery (PITR)</b> combines a base backup with archived transaction logs to rebuild any minute — that is how you get a small RPO. <b>Replication lag</b> measures how far an async replica trails; during a failover, the lag window is often exactly the data you lose."},
{"t":"dual","h":"The database that answers on the internet","th":"SEC",
"sc":"Cloud audit at Helios Retail finds db-cust-01 (10[.]201[.]7[.]43) configured with a public IP, its security group allowing 0[.]0[.]0[.]0/0 on port 5432, and TLS not enforced. The database holds customer records.",
"A":{"s":"You lead the blue-team side of the review. What is the correct first action?",
"ch":["Force TLS and move the database behind the private network, allowing only the app tier","Rotate all database passwords first and keep the endpoint public","Enable the query cache and move on","Add a read replica to spread the load"],
"a":0,
"hint":"Fix the exposure and the transport before touching anything cosmetic."},
"B":{"s":"Red-team side: you are the attacker. You just found the public endpoint and one leaked application credential from a code repo. What do you do next?",
"ch":["Connect directly with the leaked credential and start pulling tables","Scan the office Wi-Fi across the street","Phish the CFO to get VPN access","Brute-force the company router"],
"a":0,
"hint":"You already have a key that fits a door — which door?"},
"q":"Answer the blue-team (defend) side first; the red-team (attack) side then unlocks.",
"hint":"Blue: fix the exposure and the transport before anything cosmetic. Red: you already hold a key that fits a door — use it.",
"exp":"Blue side: the risk is the <b>public exposure</b> plus no <b>encryption in transit</b>. Remove both: private subnet, security group limited to the app tier, TLS enforced. Password rotation is good but second — an open endpoint survives rotation. Caches and replicas change nothing about exposure. Red side: with a public endpoint and a working credential, an attacker goes straight in — no phishing or Wi-Fi attacks needed. A quiet direct login beats loud tools: <b>SQL injection</b> or brute force are what attackers use when they do NOT already have a key. This is why auditors treat public database endpoints as critical findings, and why <b>least privilege</b> and network isolation are the first controls for any cloud database."},
{"t":"qcm","h":"Partition night in the two-region cluster","th":"TRX",
"sc":"Ferrum Pay runs a distributed database across two regions for its account service. At 03:00 the inter-region link fails completely — a network partition. The on-call decision: the surviving region must keep accepting writes so payments continue. Engineers accept that the two copies will need reconciliation later.",
"q":"Which property is necessarily sacrificed until the link heals?",
"ch":["Consistency of data across the two regions","Availability of the surviving region","Partition tolerance of the system","Durability of writes saved in the surviving region"],
"a":0,
"hint":"CAP says: during a partition you can keep all reads/writes local, or keep all copies identical. Pick one.",
"exp":"This is the <b>CAP theorem</b>: when a <b>partition</b> happens you choose between <b>consistency</b> (refuse writes that cannot be replicated) and <b>availability</b> (keep serving). Keeping writes flowing in one region while the other is cut means the copies diverge — global consistency is lost until reconciliation, and readers may see stale balances (<b>eventual consistency</b>). Availability of the surviving region is exactly what was chosen, partition tolerance is never optional in a distributed system, and <b>durability</b> (a confirmed write survives a crash) is a local promise that still holds."},
{"t":"drop","h":"Match the scaling move to the symptom","th":"PFM",
"sc":"You run capacity reviews at Helios Retail. For each symptom below, pick the scaling technique that addresses it directly. Beware: two symptoms share a technique, and one tempting answer is a hardware answer to a query problem.",
"q":"Drag each symptom onto the technique that fixes its cause.",
"cats":["Vertical scaling","Read replicas","Sharding","Caching"],
"items":[
{"x":"Reporting queries slow the primary; the reports tolerate slightly stale data","c":1},
{"x":"The DB instance sits at 90% CPU around the clock; a bigger class is the quickest safe step","c":0},
{"x":"The hottest catalog pages are read 50k times a minute but change twice a day","c":3},
{"x":"The data no longer fits on one node; rows must split by customer ID across nodes","c":2},
{"x":"Planned maintenance window used to upgrade vCPU and RAM of the instance","c":0},
{"x":"Session tokens need microsecond reads with an expiry time","c":3}],
"hint":"Vertical = one box gets stronger. Horizontal = data or traffic gets spread.",
"exp":"<b>Vertical scaling</b> (scale up) makes one instance stronger — it buys vCPU, RAM and <b>IOPS</b>, but hits a ceiling and adds no failover. <b>Read replicas</b> (a horizontal scaling move) offload queries that tolerate <b>asynchronous replication</b> delay, like reporting. <b>Caching</b> answers hot, rarely-changing data from an <b>in-memory</b> layer (Redis-style) — page reads and expiring tokens (TTL) are textbook cache workloads; watch the <b>cache hit ratio</b>. <b>Sharding</b> (horizontal partitioning) splits rows by a <b>shard key</b> when one node cannot hold or serve the data. Replicas and sharding are the <b>elastic scaling</b> toolbox of <b>horizontal scaling</b> — pick them when data size or read traffic, not one box, is the wall."},
{"t":"fill","h":"Draft the backup standard","th":"AVL",
"sc":"Vantara Group is writing its database backup standard. The drafter left four gaps. The intent: a full copy weekly, small loss window, proven restores, and cheap long-term storage.",
"q":"Complete the backup standard with the four missing terms.",
"tx":"A full __1__ of every production database is taken every Sunday at 02:00 UTC. Transaction-log backups run every 5 minutes, setting the worst-case data loss, the __2__, at 5 minutes. Restores are tested monthly; the recovery time target, the __3__, is 2 hours. Copies are kept for 35 days, then moved to the archive __4__ for the rest of the retention period.",
"bank":["snapshot","RPO","RTO","tier","TLS","shard"],
"a":["snapshot","RPO","RTO","tier"],
"hint":"Two three-letter terms are objectives; one word is the copy itself; one word is where old copies sleep.",
"exp":"A <b>snapshot</b> is the full point-in-time copy the schedule takes. The 5-minute log interval sets the <b>RPO</b> — the accepted data-loss window, because logs can be replayed to the last 5 minutes (<b>point-in-time recovery</b>). The 2-hour target is the <b>RTO</b> — how fast service must be back; monthly restore tests prove it is reachable. Old copies move to an archive <b>tier</b> (archival tiering) — cheaper storage for the rest of the data retention period. Keep at least one <b>immutable backup</b> copy beyond ransomware reach. TLS and sharding have nothing to do with backups: TLS protects traffic, sharding splits data."},
{"t":"order","h":"Cutover day: order the steps","th":"MIG",
"sc":"Northwind Logistics is moving its orders database (same engine, MySQL to MySQL) from an old self-managed server to a managed cloud instance. The plan is a homogeneous migration with a downtime window under five minutes. The steps arrived shuffled from the ticket.",
"q":"Put the cutover plan in the correct order.",
"steps":["Replicate a full copy of the source database to the target","Start change data capture so ongoing changes flow to the target","Keep the application on the source and watch the replication lag","Pause writes and wait for the lag to reach zero","Point the application at the target and resume writes","Validate row counts and checksums on the target"],
"hint":"Copy first, stream second, and never cut over while the target is still behind.",
"exp":"Correct flow: full copy first (<b>backfill</b>), then <b>change data capture (CDC)</b> streams the ongoing changes so target and source stay in sync, then the app keeps running on the source while you watch the <b>replication lag</b>. The <b>cutover</b> itself: pause writes, let the lag drain to zero (now the target is identical), repoint the application, resume — and validate with row counts and checksums as the final gate. Switching while lag is high silently loses every transaction written in that window, which is why lag-to-zero is the hard gate in every migration validation checklist. If the target ran a different engine, this would be a <b>heterogeneous migration</b> and would add a <b>schema conversion</b> step before any data moves — same engine keeps the cutover simple."},
{"t":"match","h":"Match the service pattern to the job","th":"CLD",
"sc":"Helios Retail asked its cloud team to explain, in plain words, which managed pattern fits which need. Match the five patterns to the five need statements.",
"q":"Pair each service pattern with the need it matches.",
"pairs":[
["Managed relational DBaaS","The provider runs the engine, patching, backups and failover; you own the schema and the data"],
["Key-value NoSQL at scale","Per-request pricing with single-digit millisecond lookups at any volume, like a DynamoDB-style table"],
["In-memory cache service","Sub-millisecond reads of hot data, like a Redis-style store in front of the database"],
["Cloud data warehouse","Columnar analytics over billions of rows for BI dashboards, like a BigQuery-style service"],
["Serverless database","Scales down to zero when idle, good for spiky or dev/test databases"]],
"hint":"One pattern is about who does the ops, the others about data shape, speed, analytics and idle scale.",
"exp":"<b>DBaaS</b> is an operating model: the provider patches, backs up and fails over; you keep the schema, queries and access rules — the core of <b>shared responsibility</b>. <b>Key-value NoSQL</b> (DynamoDB-style) buys predictable speed at any scale with <b>per-request pricing</b>. An <b>in-memory database</b> (Redis-style cache service) protects the database from hot repeated reads. A <b>cloud data warehouse</b> is columnar <b>OLAP</b> built for aggregations, not for order entry. A <b>serverless database</b> pauses when idle and scales on demand — ideal for dev/test, but chatty steady workloads can cost more than a provisioned instance."},
{"t":"logv","h":"Connection slots are full","th":"PFM",
"sc":"At 08:55 the Helios Retail storefront starts failing. The application log and the database log interleave below. Six app servers each run a pool of 100 connections; the database allows 200.",
"src":"app + db-prod-02 interleaved",
"logs":[
{"t":"08:55:01","l":"ERROR","m":"app[store-3] Timeout waiting for idle connection from pool (pool=100, busy=100)"},
{"t":"08:55:02","l":"FATAL","m":"db[10[.]44[.]12[.]7] remaining connection slots are full (max_connections=200)"},
{"t":"08:55:03","l":"ERROR","m":"app[store-1] Timeout waiting for idle connection from pool (pool=100, busy=100)"},
{"t":"08:55:05","l":"WARN","m":"db[10[.]44[.]12[.]7] too many clients already"},
{"t":"08:55:07","l":"ERROR","m":"app[store-5] Timeout waiting for idle connection from pool (pool=100, busy=100)"},
{"t":"08:55:09","l":"FATAL","m":"db[10[.]44[.]12[.]7] remaining connection slots are full (max_connections=200)"}],
"qt":"multi",
"q":"Pick the two actions that fix the root cause (not the symptom).",
"ch":["Shrink the per-instance pool size so the total stays under the database limit","Put a connection pooler / proxy in front that multiplexes many client connections onto few","Raise max_connections to 1000 on the same small instance","Add retry loops in the app that hammer the database until a slot frees up"],
"a":[0,1],
"hint":"Each database connection eats memory. Six pools of one hundred — do the math against two hundred.",
"exp":"Root cause: 6 servers × 100 pool connections = 600 demanded, 200 allowed. <b>Right-sizing the pools</b> fixes the demand; a <b>connection pooler</b> (PgBouncer-style) fixes it by reusing a few real <b>connections</b> for hundreds of clients — every new connection costs memory and setup time, which is why pooling exists. Raising max_connections on a small instance trades an error for memory exhaustion and swap. Retrying harder makes the storm worse. Connection <b>throughput</b> problems are capacity math, not luck."},
{"t":"multi","h":"What ACID really promises","th":"TRX",
"sc":"New engineers at Ferrum Pay keep mixing up the ACID letters in design reviews. The ledger database runs money movements, so the words must be exact.",
"q":"Select every statement that is true about ACID transactions.",
"ch":["Atomicity: either every statement in the transaction applies, or none of it does","Isolation: concurrent transactions do not see each other's half-finished work","Durability: once the database confirms a commit, the change survives a crash","Consistency: every replica answers reads, even far away ones","Atomicity: finished transactions run faster because of the indexes"],
"a":[0,1,2],
"hint":"Three statements describe real ACID letters. Two are look-alikes with the wrong meaning.",
"exp":"True: <b>atomicity</b> is all-or-nothing (the classic transfer: debit and credit together or not at all); <b>isolation</b> hides unfinished work from other transactions (enforced through isolation levels and locking); <b>durability</b> means a confirmed <b>commit</b> survives power loss, via write-ahead logs and flushes. The two traps: CAP-style \u201Cconsistency\u201D (every replica answers with current data) is a distributed-systems property, not the ACID letter — in ACID, consistency means rules like constraints and foreign keys still hold after the transaction. And indexes are a performance topic; they have no role in atomicity."},
{"t":"spot","h":"The report query that takes 4 seconds","th":"PFM",
"sc":"The marketing report below runs every 5 minutes on the customers table (40 million rows) of Helios Retail. There is an index on last_name and one on created_at. The DBA says the query design defeats both.",
"q":"Click every line that hurts performance.",
"code":["-- Campaign report: surnames ending in SON, newest first","SELECT customer_id, last_name, created_at","FROM customers","WHERE UPPER(last_name) LIKE '%SON'","ORDER BY created_at","LIMIT 100000;"],
"bad":[3,5],
"hint":"Line by line: what does the leading % do to the last_name index? And who reads 100,000 rows every 5 minutes?",
"exp":"Line 4 has two problems in one: the leading wildcard (<code>'%SON'</code>) means the predicate is not a <b>sargable predicate</b>, so the last_name index is useless — a <b>full table scan</b> of 40M rows; and <code>UPPER(last_name)</code> wraps the column in a function, which also blocks the plain index (an expression index on UPPER(last_name) would fix that half). Line 6 pulls 100,000 rows every 5 minutes — nobody reads that; paginate or aggregate. Lines 2, 3 and 5 are fine: naming columns, the table, and ordering by the indexed created_at. Query <b>optimization</b> starts with the <b>execution plan</b>, and both bad lines are plan killers."},
{"t":"qcm","h":"Shopping cart consistency","th":"TRX",
"sc":"The Ferrum Pay mobile app keeps shopping carts in a cloud data store. Product research says: if an item takes a few seconds to appear for the customer on another device, nobody complains. The team wants the cheapest store that meets that bar.",
"q":"Which consistency model fits this requirement?",
"ch":["Eventual consistency","Strong (linearizable) consistency on every read","Serializable isolation on a single node","Read-your-writes from every region simultaneously"],
"a":0,
"hint":"The business literally said: a few seconds of delay is fine.",
"exp":"If seconds of delay are acceptable, <b>eventual consistency</b> is enough: every replica converges to the same state when traffic settles (the <b>BASE</b> approach — basically available, soft state, eventual consistency), and it buys lower latency and higher availability. <b>Strong consistency</b> would make every read wait for coordination between copies — you pay latency for freshness the business did not ask for. Serializable isolation is about concurrent transaction ordering on one database, not replica freshness, and global read-your-writes is a stronger promise than the requirement. Nuance worth knowing: the payment step of the same app should use much stronger guarantees than the cart. Also note the cart is a <b>denormalization</b> of catalog data — a deliberate copy for speed, which is exactly why brief staleness is part of its design."},
{"t":"drop","h":"Which control stops which risk?","th":"SEC",
"sc":"The security committee at Vantara Group collected five real risks from past audits. Your job in the workshop: connect each risk to the database security control that directly stops it.",
"q":"Drag each risk onto the control that defeats it.",
"cats":["Encryption at rest","Encryption in transit","Audit logging","Data masking","Least privilege"],
"items":[
{"x":"A stolen cloud volume snapshot is unreadable without the key","c":0},
{"x":"A packet capture on the network shows no usable customer data","c":1},
{"x":"Answer the question: who dropped the report table last Tuesday?","c":2},
{"x":"Support staff see 555-***-1234 instead of real phone numbers","c":3},
{"x":"The reporting service account can only run SELECT statements","c":4}],
"hint":"Two controls are about encrypting (stored vs moving data); one watches, one hides, one narrows rights.",
"exp":"<b>Encryption at rest</b> (often transparent data encryption, TDE, with a <b>KMS</b> key) protects stored files and snapshots — a stolen volume is noise without the key. <b>Encryption in transit</b> (TLS) protects data on the wire, so sniffers capture nothing usable. <b>Audit logging</b> answers who-did-what-when — the only way to investigate the dropped table. <b>Data masking</b> replaces sensitive values with fakes in non-production or support views. <b>Least privilege</b> means an account gets only the rights it needs — a SELECT-only reporting account cannot delete anything even if compromised. Defense in depth means all five run together, not one \u201Cmain\u201D control."},
{"t":"branch","h":"The restore drill that failed","th":"AVL",
"sc":"Cobalt Bank ran a restore drill of the orders database into the staging environment. This morning, staging apps crash with: ERROR: relation \u201Corders\u201D does not exist. You are the DBA on the drill review.",
"nodes":[
{"s":"The staging app points at database staging_core, but the restored tables landed in staging_restore_2024. What actually went wrong?",
"ch":["The restore was loaded into a different database than the app expects; verify the restore target and re-run pointing at the right one","The production table was renamed by accident","The app is broken and needs a redeploy","Nothing — ignore the error"],
"a":0,
"w":"Read the error: the relation does not exist in the database the app queries. Restores land where you point them; check the target first."},
{"s":"Target fixed — the tables exist now. But the newest rows are from yesterday 18:00, and the business wants data up to 22:45. What is the correct move?",
"ch":["The restore stopped at the last full backup; apply the transaction logs up to 22:45 (point-in-time recovery)","Wait 24 hours for the next backup","Ask users to re-enter the missing data","Fail over to the read replica"],
"a":1,
"w":"A full backup is a frozen moment. Transaction logs replay the changes after it — that is point-in-time recovery (PITR), and it is exactly why log archiving exists."},
{"s":"To stop this drill failing again, which control goes into the runbook?",
"ch":["Add a post-restore validation step: row counts, newest-row timestamp and app smoke test, before the environment is handed over","Take backups twice as often","Skip drills to save time","Delete the staging environment"],
"a":0,
"w":"Validation catches wrong-target and stale restores every time. Frequency does not fix pointing at the wrong database, and skipping drills hides the gap until a real disaster."}],
"q":"Step through the drill review: choose the best action at each step.",
"hint":"Track the failure in sequence: wrong place, then wrong time, then the guard that catches both.",
"exp":"This drill exercised three recovery truths. One: a restore lands exactly where the command points — always verify the <b>restore target</b> against what the application connects to. Two: a full <b>backup</b> alone gives you the backup moment; <b>point-in-time recovery (PITR)</b> replays archived transaction logs to reach 22:45 — this is what shrinks the <b>RPO</b>. Three: restore drills exist to find these gaps, so the runbook needs a validation gate (counts, freshest row, smoke test). A backup that has never been restored is a rumor, not a backup."},
{"t":"fill","h":"Finish the DBaaS responsibility sentence","th":"CLD",
"sc":"The Helios Retail platform team is writing its cloud database guide for new joiners. The key sentence about a managed database service lost four words.",
"q":"Complete the sentence with the four missing words.",
"tx":"With a managed __1__, the provider handles the engine binaries, the OS patching and the __2__ failover between zones, while the customer still owns the __3__ design, the query tuning, and the __4__ of data through the backups they configure.",
"bank":["database","automated","schema","protection","physical","manual"],
"a":["database","automated","schema","protection"],
"hint":"Two words describe the service and its failover; two words describe what stays on your side.",
"exp":"A managed <b>database</b> (DBaaS) shifts engine patching, OS work and <b>automated</b> multi-AZ failover to the provider. But <b>shared responsibility</b> does not mean no responsibility: the <b>schema</b> design, the queries and indexes, the access rules, and the <b>protection</b> settings (backup schedule, retention, encryption choices) stay with the customer. Physical datacenter security is always the provider's side in cloud models, and failover in a managed service is never manual — that is the point of buying it."},
{"t":"order","h":"Build the nightly pipeline in order","th":"ANL",
"sc":"The analytics team at Helios Retail describes its nightly data platform: operational databases feed reports at 06:00. The pipeline steps arrived shuffled from the design doc.",
"q":"Put the pipeline stages in the correct order.",
"steps":["Extract the day's changes from the operational OLTP databases","Land the raw files unchanged in object storage (the data lake)","Transform: clean, deduplicate and conform the records","Load the transformed data into the cloud data warehouse","Rebuild the aggregates and refresh the BI dashboards","Validate row counts and alert if any stage drifts"],
"hint":"Raw first, clean second, serve third — and always keep a quality gate.",
"exp":"The classic flow: <b>extract</b> from the <b>OLTP</b> systems that run the business, land raw copies in the <b>data lake</b> (cheap object storage, <b>schema-on-read</b> — nothing is enforced yet), then <b>transform</b> into clean, conformed records and <b>load</b> them into the columnar <b>data warehouse</b> for <b>OLAP</b> — that order makes it an <b>ETL</b> flow; if the warehouse loaded raw first and transformed inside, it would be <b>ELT</b>. Aggregates and dashboards come after load, and a validation gate (counts, alerts) closes the loop. Skipping validation is how silent data drift becomes a wrong executive report."},
{"t":"multi","h":"Columnar storage: true or false?","th":"ANL",
"sc":"Ferrum Pay is choosing storage for its new analytics platform. The vendor deck confuses everyone. The data engineer asks the team to separate fact from marketing.",
"q":"Select every statement that is true about columnar storage.",
"ch":["Aggregations over a few columns across many rows run much faster than in row storage","Columns with repeating values compress extremely well","Fast single-row updates of whole records are its strongest use case","Analytics scans touch only the columns a query needs","It stores every row's fields together on disk, one row after another"],
"a":[0,1,3],
"hint":"Columnar = data arranged by column, not by row. What does that arrangement help, and what does it hurt?",
"exp":"True three times: reading only needed columns slashes IO for aggregations (sum 3 columns of 2 billion rows without touching the other 40); repeated values inside a column (dates, statuses, countries) compress dramatically; and scans become cheap. False two times: <b>columnar</b> storage is poor at whole-row writes and single-row OLTP updates — writing one row means touching every column file, which is why transactional systems use <b>row storage</b>; and \u201Crows together on disk\u201D is literally the definition of the opposite design. This split is why OLTP lives in row-oriented engines and OLAP lives in columnar warehouses."},
{"t":"qcm","h":"How much data can we lose?","th":"AVL",
"sc":"Vantara Group protects its payment database like this: a full backup every 6 hours, plus continuous transaction-log shipping to the second region every 10 minutes. At 11:58 the primary region fails completely and irrecoverably.",
"q":"What is the worst-case data loss for this outage?",
"ch":["About 10 minutes of transactions","About 6 hours of transactions","Zero — nothing can be lost","Up to 24 hours of transactions"],
"a":0,
"hint":"The RPO is set by the most frequent protection, not the biggest.",
"exp":"Worst case: the failure lands one second before the next log ship, so the last ~10 minutes of transactions never made it to the second region. That interval defines the <b>RPO</b> — here roughly 10 minutes. The 6-hour full <b>backup</b> matters only if log shipping were broken; with logs flowing, recovery replays the <b>transaction logs</b> on top of the last full copy (point-in-time recovery). In a multi-region setup like this one, the log-shipping interval is exactly the dial that sets the <b>RPO</b>. Zero loss would require <b>synchronous replication</b> to the second region, which waits for each write — slower commits, but no acknowledged transaction is ever lost. This is exactly the trade-off between async (faster, small RPO) and sync (slower, near-zero RPO) replication."},
{"t":"fill","h":"Performance vocabulary check","th":"PFM",
"sc":"The Helios Retail junior DBA wrote an incident summary with four terms missing. The senior will only accept precise words.",
"q":"Fill the four gaps with the right performance terms.",
"tx":"The __1__ shows which indexes the planner chose and how rows are joined. A missing __2__ on customer_id forces a full scan of the 40M-row table. The __3__ log captures every statement over 500 ms so we can hunt them down. A connection __4__ reuses open connections instead of paying setup cost per request.",
"bank":["execution plan","index","slow query","pool","snapshot","shard"],
"a":["execution plan","index","slow query","pool"],
"hint":"One artifact shows the plan; one structure speeds the lookup; one log finds offenders; one layer reuses connections.",
"exp":"The <b>execution plan</b> is the planner's recipe: scan types, join order, estimated rows — always read it before tuning. A missing <b>index</b> on the filter column turns a targeted lookup into a <b>full table scan</b>. The <b>slow query log</b> is the radar: it records statements above a threshold (500 ms here) with durations. A connection <b>pool</b> keeps connections open and reuses them — building a connection (TLS handshake, auth, backend process) per request burns <b>latency</b> and memory. Snapshots are for backups and shards for distribution — different chapters of the same book. One more trap worth naming: stale <b>planner statistics</b> after a bulk load mislead cost estimates, so refresh them before blaming the hardware."},
{"t":"match","h":"Name the isolation anomaly","th":"TRX",
"sc":"The QA team at Ferrum Pay collected five real bug reports. Each one is a classic transaction anomaly. The lesson for the team: name the anomaly, then the fix is obvious.",
"q":"Match each bug report to the isolation anomaly it describes.",
"pairs":[
["Ticket B shows a payment that Ticket A created — but Ticket A was rolled back minutes ago","Dirty read"],
["The same row is read twice in one transaction and the amount changed between the two reads","Non-repeatable read"],
["A range query returns 12 rows, the same range query seconds later returns 14","Phantom read"],
["Two agents edit the same ticket; the last save silently erases the first agent's change","Lost update"],
["Two batch jobs each hold a lock the other needs; both freeze forever","Deadlock"]],
"hint":"Dirty = saw uncommitted data. Non-repeatable = same row changed. Phantom = new rows in a range. Lost = overwritten write. Deadlock = circular wait.",
"exp":"A <b>dirty read</b> sees data from a transaction that was never committed — QA saw a payment that stopped existing. A <b>non-repeatable read</b> re-reads the same row and finds a different committed value (an UPDATE slipped between the reads). A <b>phantom read</b> re-runs a range query and new matching rows appear (an INSERT slipped in). A <b>lost update</b> is two read-modify-write cycles colliding — the last writer erases the first. A <b>deadlock</b> is a lock cycle; the engine must pick a victim and roll it back. Higher <b>isolation levels</b> trade concurrency for fewer anomalies: that trade is the heart of transaction design. In production, keep money logic inside a <b>stored procedure</b> so it runs under one reviewed, testable path."},
{"t":"rank","h":"Monday 08:00: rank the incidents","th":"AVL",
"sc":"You just took over the queue at Helios Retail. Five tickets, one database team, one hour before the daily standup. Rank them: the item you work on first goes to the top.",
"q":"Order the tickets from most urgent to least urgent.",
"steps":["Production checkout database is unreachable — orders are failing right now","Nightly backup job has failed three nights in a row (RPO risk)","One read replica lags 60 seconds — dashboards slightly stale","Dev database is over-provisioned — costs money but harms nothing","Audit-log retention setting expires in 60 days — a planned task"],
"rk":1,
"hint":"Active production outage first. Then the silent risk that quietly grows. Then the annoyances.",
"exp":"Ranking is risk × impact × time pressure. First: the <b>production outage</b> — revenue is burning now. Second: three failed <b>backups</b> — no alarm yet, but every day without backups widens the potential <b>RPO</b>; silent risks outrank visible annoyances. Third: a lagging <b>read replica</b> — real but tolerated staleness for dashboards. Fourth: the retention expiry — a deadline 60 days out, scheduled work, not a fire. Fifth: the over-provisioned dev database — an optimization, not an incident. Note what did NOT come first: the cost issue looks easy and satisfying, but easy is not the same as urgent."},
{"t":"qcm","h":"Telemetry at 2 million writes per minute","th":"NOS",
"sc":"Helios Retail's fleet of 300,000 devices reports a heartbeat every second: append-only writes, queries always by device ID plus time window, retention of 90 days. The volume: about 2 million writes per minute, steady.",
"q":"Which database type fits this telemetry workload best?",
"ch":["A wide-column / time-series store keyed by device and time","A relational schema with many joined lookup tables","A graph database modeling devices as nodes","An in-memory cache as the system of record"],
"a":0,
"hint":"Append-only + keyed by device + time window + huge write volume — which model eats exactly that?",
"exp":"Telemetry is the poster child for a <b>wide-column / time-series</b> store: rows keyed by device and time bucket, written append-only at extreme rates, scanned in ranges, expired in bulk after retention. A <b>relational</b> design with joins adds cost per write you never use — this workload has no JOINs. A <b>graph database</b> is for relationships between entities, not for time buckets. A cache (in-memory store) is not a <b>system of record</b> — it loses data on restart by design. Picking the model by access pattern, not by fashion, is the skill Cloud+ tests here."},
{"t":"multi","h":"Who is responsible for what in DBaaS?","th":"SEC",
"sc":"The audit at Vantara Group asks the platform team to mark every task as provider-side or customer-side for their managed PostgreSQL service (DBaaS). Mark every task that is a customer responsibility.",
"q":"Select every item that belongs to the customer under shared responsibility.",
"ch":["Creating database user accounts and roles","Designing the schema and tuning the queries","Patching the hypervisor and the hosts under the instance","Configuring backups, retention and encryption choices","Guarding the physical security of the datacenter"],
"a":[0,1,3],
"hint":"If the task needs knowledge of YOUR data or YOUR users, it is yours. If it needs a screwdriver in the datacenter, it is theirs.",
"exp":"The customer keeps everything data- and access-shaped: <b>user accounts and roles</b> (least privilege is your job), <b>schema and query tuning</b>, and the <b>backup, retention and encryption</b> choices. The provider keeps everything fabric-shaped: hypervisor and host <b>patching</b>, physical security, network fabric, hardware. This split is the whole point of <b>shared responsibility</b> in a managed database: the provider can patch an engine, but it cannot know that the intern should not have DELETE on the payments table."}
