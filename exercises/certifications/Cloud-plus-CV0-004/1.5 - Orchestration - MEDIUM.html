KW=[
["Container Foundations",["container image","image registry","Dockerfile","container runtime","microservices","namespaces & cgroups","ephemeral containers","image tags","image scanning","containers vs VMs"]],
["Orchestration Principles",["orchestrator","cluster","desired state","reconciliation","scheduling & bin packing","self-healing","service discovery","load balancing","horizontal vs vertical scaling","autoscaling (HPA)","health checks"]],
["Deployment Strategies",["rolling update","canary deployment","blue-green deployment"]],
["Kubernetes Objects & Architecture",["control plane","kubelet & kube-proxy","pod","Deployment & ReplicaSet","service types","ingress","namespace","ConfigMap","secret","DaemonSet","StatefulSet","Job & CronJob","labels & selectors","taints & tolerations","node affinity","resource requests & limits","persistent volumes","kubectl","YAML manifest","Helm","RBAC","network policy"]],
["Platforms, Tooling & Pipeline",["Kubernetes","Docker Swarm","Apache Mesos / Nomad","managed Kubernetes (EKS/AKS/GKE)","ECS / Fargate","OpenShift","service mesh (Istio)","Docker Compose","GitOps","CI/CD pipeline"]]
];
EX=[
{t:"match",th:3,p:10,k:"kubectl;desired state;YAML manifest",
 s:"You are the on-call platform engineer at Nortide Retail. A junior teammate must take over half of tonight's change window and asks what six common kubectl commands actually do.",
 q:"Match each kubectl command to what it really does.",
 pool:["kubectl apply -f deploy.yaml","kubectl get pods -o wide","kubectl describe pod api-7f9","kubectl logs api-7f9 -f","kubectl rollout undo deploy api","kubectl scale deploy api --replicas=5"],
 slots:["Create or update objects from a manifest (declarative)","List pods with their node and IP","Show events, conditions and container states of one pod","Stream one container's output live","Roll back to the previous ReplicaSet","Change the replica count right now"],
 map:[0,1,2,3,4,5],
 x:"kubectl apply -f sends a manifest to the API server and the cluster makes reality match the file — the declarative, desired-state way. get pods -o wide lists pods and adds node and IP columns. describe pod shows events, conditions and container states in detail. logs -f streams container output like tail -f. rollout undo returns to the previous ReplicaSet after a bad deploy. scale changes the replica count at once, and the controller then creates or deletes pods to match.",
 h:"Two commands only read. One writes desired state from a file. Three act on running workloads."},
{t:"triage",th:3,p:10,k:"pod;self-healing;resource requests & limits;scheduling & bin packing;health checks;image registry",
 s:"Monday 08:30 at Nortide Retail. Five pod alerts arrived overnight in the prod cluster (12 worker nodes). You have the shared platform queue.",
 q:"For each alert, choose the most likely cause and first move.",
 head:["Alert on your queue","Most likely cause / first move"],
 rows:[
  {a:"prod · checkout-7f8c · CrashLoopBackOff — 14 restarts",o:["The image tag does not exist in the registry","The app crashes at startup — read the pod logs first","A node is out of disk","The Service selector is wrong"],c:1},
  {a:"prod · payments-9c4d · ImagePullBackOff",o:["Wrong image name or missing pull secret for the private registry","An application bug after the first request","The CPU limit is too low","The liveness probe keeps failing"],c:0},
  {a:"prod · search-5d1f · OOMKilled — restart loop",o:["Add more replicas behind the Service","Change the Service type to LoadBalancer","Raise the memory limit or fix the leak, then redeploy","Add a toleration to the pod"],c:2},
  {a:"prod · reports-api · Pending — 0/1 nodes available",o:["The ingress path is misconfigured","No node fits its requests — check requests and cluster capacity","A Secret is missing","The HPA hit maxReplicas"],c:1},
  {a:"prod · checkout-web · Running, but users get 503",o:["Endpoints are empty — readiness failing or labels not matching the selector","The image cannot be pulled","The CronJob did not run","The namespace quota is exhausted"],c:0}],
 x:"CrashLoopBackOff means the container starts and dies again — read logs first. ImagePullBackOff is a pull problem: image name, tag or registry credentials. OOMKilled means the kernel killed the container over its memory limit — replicas will not help; fix limit or leak. Pending with 0 nodes available is a scheduling problem: requests too large or no capacity. Running but 503 usually means empty Service endpoints: readiness failing or labels not matching the selector.",
 h:"One alert is about pulling, one about starting, one about memory, one about placement, one about traffic."},
{t:"qcm",th:0,p:10,k:"microservices;containers vs VMs;orchestrator",
 s:"Nortide Retail runs its shop as one 900,000-line monolith. Deploys are slow and one team's bug breaks checkout. The platform team proposes splitting the shop into microservices that each run in containers, managed by an orchestrator.",
 q:"What is the main benefit that containers plus an orchestrator directly provide in this plan?",
 c:[["Each service is isolated, starts fast, and the orchestrator scales or reschedules it independently",1],["Containers make the application code automatically bug-free",0],["Containers remove the need for monitoring and logging",0],["The orchestrator rewrites legacy code into services during deployment",0]],
 x:"A container packages one small service with its dependencies; it starts in milliseconds and is isolated with namespaces and cgroups. The orchestrator then schedules, scales, heals and reschedules those containers across the cluster. That is the direct benefit: independent deploy and scaling per service. The other options are magic — containers do not fix bugs, do not replace monitoring and do not rewrite code.",
 h:"Compare what happens to one small service versus the whole monolith on a bad Tuesday."},
{t:"blank",th:3,p:10,k:"YAML manifest;Deployment & ReplicaSet;labels & selectors;image tags;image registry",
 s:"A teammate pastes a half-finished Deployment manifest for payments-api into the change ticket and asks you to complete it before the window closes.",
 q:"Fill the four gaps so the Deployment runs 3 replicas and its selector matches the pod template labels.",
 text:"apiVersion: apps/{{0}}\nkind: {{1}}\nmetadata:\n  name: payments-api\nspec:\n  replicas: {{2}}\n  selector:\n    {{3}}:\n      app: payments-api\n  template:\n    metadata:\n      labels:\n        app: payments-api\n    spec:\n      containers:\n      - name: api\n        image: registry.nortide.internal/payments/api:1.42.0",
 bank:["v1","Deployment","3","matchLabels","nodeSelector","1"],
 sol:[0,1,2,3],
 x:"apps/v1 is the API group for workload objects like Deployment. selector.matchLabels must equal the template labels — otherwise the controller cannot find its pods and the API server rejects the object. replicas: 3 tells the ReplicaSet to keep three pods. The image points at your private registry with the pinned tag 1.42.0 — always pin a real tag; never let prod float on latest.",
 h:"Selector and template labels must use the same key and value pair."},
{t:"multi",th:1,p:10,k:"desired state;reconciliation;self-healing",
 s:"You apply a Deployment asking for 3 replicas of api:2.1.0. Fifteen minutes later: a node drains and one pod is evicted, a curious teammate runs kubectl delete pod on a second one, and a third container is OOMKilled.",
 q:"Select every event the orchestrator fixes automatically, with no human involved.",
 c:[["The pod deleted by hand is replaced with a new one",1],["The pod evicted from the drained node is rescheduled onto another node",1],["The OOMKilled container is restarted on its node",1],["The image inside a running pod is hot-patched in place",0],["The evicted pod returns to the same drained node",0],["The deployment rolls back to the previous image by itself",0]],
 x:"Controllers constantly compare reality with the desired state (3 healthy replicas) and reconcile the difference — that is self-healing: a new pod for the deleted one, a reschedule for the evicted one, a restart for the dead container. A running pod's image is never patched in place; pods are replaced, not edited. Evicted pods do not go back to the drained node; the scheduler picks wherever fits. Rollback needs a trigger like rollout undo — it does not fire by itself.",
 h:"Pods are cattle: destroyed and recreated, never repaired in place."},
{t:"lines",th:3,p:10,k:"YAML manifest;labels & selectors;secret;resource requests & limits;image tags",
 s:"Reviewing a pull request from an intern: a Deployment manifest for the catalogue service, namespace prod. Your team rules: pinned tags, selectors must match, no secrets in plain text, limits always set.",
 q:"Click every line that breaks one of these rules (3 lines).",
 code:["apiVersion: apps/v1","kind: Deployment","metadata:","  name: catalogue","spec:","  replicas: 3","  selector:","    matchLabels:","      app: catalogue-api","  template:","    metadata:","      labels:","        app: catalogue","    spec:","      containers:","      - name: catalogue","        image: catalogue:latest","        env:","        - name: DB_PASSWORD","          value: 'pr0d-catalogue-pw'","        resources:","          requests:","            cpu: 100m"],
 bad:[9,16,19],
 x:"Three real problems. The template labels (app: catalogue) do not match selector.matchLabels (app: catalogue-api), so the controller can never bind pods to this Deployment and the API server rejects it. The image floats on the latest tag — prod must pin an immutable version so every pod runs the same bytes. The database password sits in plain text in the manifest; it belongs in a Secret object, ideally injected as a mounted file. The tiny CPU request is small but legal, so it is not the failure here.",
 h:"Compare the selector value with the template label value, character by character."},
{t:"order",th:4,p:10,k:"CI/CD pipeline;image registry;image scanning;gitops;rolling update;image tags",
 s:"Nortide's platform team documents how a code change becomes a running container in prod. You must train the new hires on the exact order.",
 q:"Put the pipeline stages in the correct order from first to last.",
 items:["A developer pushes code to Git","The CI server runs build and unit tests","CI builds the container image and tags it 2.7.1","The image is pushed to the registry and scanned for CVEs","A pull request updates the Deployment manifest (GitOps)","The cluster rolls out the new image with a rolling update"],
 x:"The pipeline flows one way: commit, then automated build and tests, then package the app as an image with a real tag, then push it to the registry where it is scanned for vulnerabilities. Only then does the desired state change — through a reviewed pull request on the manifest (the GitOps way) — and finally the orchestrator performs a rolling update, replacing old pods gradually while health checks protect users.",
 h:"You cannot deploy what you have not built, and you should not build what you have not tested."},
{t:"match",th:3,p:10,k:"Deployment & ReplicaSet;service types;namespace;ConfigMap;secret;DaemonSet;persistent volumes",
 s:"New joiner week at Nortide. The mentor leaves seven object names on the whiteboard and seven one-line descriptions, shuffled.",
 q:"Match each Kubernetes object to the job it does in the cluster.",
 pool:["Deployment","Service","Namespace","ConfigMap","Secret","DaemonSet","PersistentVolumeClaim"],
 slots:["Keeps N identical replicas of a stateless app running via ReplicaSets","A stable virtual IP plus DNS name in front of a changing pod set","A virtual cluster inside the cluster: splits teams, quotas and access","Non-sensitive settings like feature flags injected into pods","Holds sensitive values such as tokens and passwords","Runs exactly one pod per node — log shippers, node agents","A request for durable disk space that survives pod restarts"],
 map:[0,1,2,3,4,5,6],
 x:"A Deployment keeps a set number of identical pods alive through its ReplicaSet. A Service gives those pods one stable virtual IP and DNS name even as pods come and go. A Namespace splits one physical cluster into virtual ones for teams and quotas. A ConfigMap injects plain settings; a Secret does the same for sensitive values with tighter access. A DaemonSet guarantees one pod per node — perfect for log shippers. A PersistentVolumeClaim asks for durable storage that outlives any single pod.",
 h:"Three of them are about identity and placement, two about data, one about access, one about storage."},
{t:"term",th:1,p:10,k:"kubectl;horizontal vs vertical scaling;namespace;Deployment & ReplicaSet",
 s:"Black-Friday rehearsal. The orders deployment must serve more traffic tonight. You are on the jump host with cluster-admin on the prod namespace.",
 q:"Use a kubectl command to scale the deployment orders in namespace prod to exactly 5 replicas.",
 fam:"Command family: kubectl scale. Useful flags: -n for the namespace, --replicas for the count. Example of the output shape: deployment.apps/orders scaled",
 host:"nortide-jump — bash",
 ac:["^kubectl( -n prod)? scale deployment(\/)? ?orders( -n prod)? --replicas ?= ?5$","^kubectl scale( deployment)? orders( -n prod)? --replicas ?= ?5$","^kubectl scale --replicas ?= ?5( -n prod)? deployment(\/)? ?orders$","^kubectl -n prod scale --replicas ?= ?5 deployment(\/)? ?orders$","^kubectl scale deployment\/orders( -n prod)? --replicas ?= ?5$"],
 out:["deployment.apps/orders scaled"],
 exA:"kubectl scale deployment orders -n prod --replicas=5",
 x:"kubectl scale changes the desired replica count of the Deployment right now; the ReplicaSet then creates or removes pods until five are running. This is horizontal scaling — more copies of the same small pod — as opposed to vertical scaling, which gives one pod more CPU or memory. -n prod targets the namespace; without it kubectl looks in the default namespace. In GitOps teams the count change is later committed to the manifest so it survives the next apply.",
 h:"Start with kubectl scale, name the deployment, then the --replicas flag."},
{t:"qcm",th:1,p:10,k:"health checks;self-healing",
 s:"After the 2.3.0 deploy, the recommendations pod answers slowly for its first 90 seconds while caches warm up. Users hitting it in that window get errors, even though the pod eventually works fine. The team already has a liveness probe on /healthz that returns 200 once the app is fully up.",
 q:"Which probe should the team add, and where should traffic NOT be sent?",
 c:[["A readiness probe — no traffic until the pod can actually serve",1],["A second liveness probe with a longer timeout — restart the pod harder",0],["Remove all probes so the pod never restarts again",0],["A DaemonSet that pre-heats the pod's cache",0]],
 x:"Readiness answers one question: should the Service send this pod traffic right now? While the pod warms up, readiness fails, the pod is removed from endpoints, and no user hits a cold pod. Liveness is the wrong tool: it answers 'is the process dead?' and restarting a slow-but-alive pod makes things worse. Removing probes throws away self-healing. A DaemonSet is a per-node agent, not a cache warmer.",
 h:"One probe protects users from a pod, the other protects the pod from itself."}
,{t:"triage",th:1,p:10,k:"horizontal vs vertical scaling;autoscaling (HPA);resource requests & limits",
 s:"Capacity review for the payments platform. Every row is a real situation from last quarter. Decide the right scaling move for each.",
 q:"For each situation, choose: scale out (more pods), scale up (bigger pods), or fix something else first.",
 head:["Situation","Right move"],
 rows:[
  {a:"API pods sit at 95% CPU each; the HPA already reached maxReplicas=12; latency still rises",o:["Scale out — add pods (horizontal)","Scale up — bigger pods (vertical)","Neither — fix the real problem first"],c:1},
  {a:"Stateless web tier; traffic doubles every Friday 18:00; pods sit at 55% CPU the rest of the week",o:["Scale out — add pods (horizontal)","Scale up — bigger pods (vertical)","Neither — fix the real problem first"],c:0},
  {a:"One pod must hold a 40 GB in-memory index that cannot be sharded",o:["Scale out — add pods (horizontal)","Scale up — bigger pods (vertical)","Neither — fix the real problem first"],c:1},
  {a:"Search pod is OOMKilled every 20 minutes although CPU stays under 20%",o:["Scale out — add pods (horizontal)","Scale up — bigger pods (vertical)","Neither — fix the real problem first"],c:2},
  {a:"Order-queue depth grows only during the nightly batch window and drains right after",o:["Scale out — add pods (horizontal)","Scale up — bigger pods (vertical)","Neither — fix the real problem first"],c:0}],
 x:"If every pod is saturated and the horizontal autoscaler is maxed, the pods themselves need more resources — scale up. If traffic comes and goes and pods are stateless, scale out with the HPA; it adds pods when a metric (CPU, or queue length) crosses its target. An unshardable 40 GB index needs one bigger pod, not ten small ones. Repeated OOMKills are a memory limit or leak problem — scaling cannot fix a broken pod. A queue that grows only in a known window is the textbook case for autoscaling on queue depth.",
 h:"Autoscaling spreads load across pods; it never fixes a pod that is too small or broken."},
{t:"match",th:1,p:10,k:"service types;ingress;service discovery;load balancing;network policy;service mesh (Istio)",
 s:"Architecture review: six cards from the traffic layer of the platform, shuffled on the table.",
 q:"Match each card to the job it does for cluster traffic.",
 pool:["ClusterIP","NodePort","LoadBalancer","Ingress","NetworkPolicy","Service mesh (Istio)"],
 slots:["Internal-only virtual IP that pods find through cluster DNS","Opens one static port on every node — quick external access for tests","Provisions a cloud load balancer with a single public address","Host- and path-based HTTP routing with TLS through one entry point","Firewall-style rules that allow or deny traffic between pods","Sidecar proxies that add mTLS, retries and traffic shifting between services"],
 map:[0,1,2,3,4,5],
 x:"ClusterIP is the default: an internal virtual IP plus a DNS name — that is service discovery, other pods call orders.prod.svc and never learn pod IPs. NodePort opens the same port on every node, handy for a quick demo, poor for prod. LoadBalancer asks the cloud for a real balancer with one address. Ingress routes many hostnames and paths through one entry and terminates TLS. NetworkPolicy is the pod firewall: which pods may talk to which, on which ports. A service mesh adds sidecars for mTLS, retries, and fine-grained traffic shifting between service versions.",
 h:"Two options are about entering the cluster, one about leaving pods alone, one about east-west trust."},
{t:"multi",th:4,p:10,k:"managed Kubernetes (EKS/AKS/GKE);control plane;RBAC;Helm",
 s:"Nortide's CTO asks whether to keep self-hosting Kubernetes on VMs or move to a managed control plane such as EKS, AKS or GKE.",
 q:"Select every true statement the platform lead can honestly make.",
 c:[["The provider runs, patches and upgrades the control plane",1],["You still secure and patch the worker nodes and your own workloads",1],["You are still responsible for RBAC, namespaces and quotas inside the cluster",1],["The provider takes over responsibility for your application's security context",0],["Helm charts stop working on managed clusters",0],["Choosing managed removes the need for backup and upgrade planning for your apps",0]],
 x:"Managed Kubernetes means the cloud operates the control plane — the API server, etcd, scheduler and controller manager — including its patches and upgrades. Everything above the control plane stays yours: your images, your RBAC roles and namespaces, your quotas, your nodes and workloads. Helm is just packaging; it works on any conformant cluster. Managed moves a boundary, it does not delete your operational duties — backups, upgrades of the apps and workload security remain on your side.",
 h:"Shared responsibility: who owns the machines, and who owns what runs on them?"},
{t:"branch",th:2,p:10,k:"rolling update;health checks;Deployment & ReplicaSet;kubectl",
 s:"Tuesday 10:12. The CD pipeline pushed checkout:5.9.0. Within two minutes the 5xx rate climbs from 0.1% to 9%. The deployment shows 3 of 6 pods Ready and the rollout is stuck progressing.",
 q:"Work the incident, one decision at a time.",
 steps:[
  {s:"Dashboards show errors only on pods from the new ReplicaSet. Old pods are healthy.",q:"What is your first move?",c:[["Confirm with kubectl rollout status and recent events that the new pods are unhealthy",1],["Delete the Service so users stop receiving errors",0],["Scale the deployment to 20 replicas",0],["Edit the code inside the running new pods",0]],a:0},
  {s:"Rollout status: the new pods are in CrashLoopBackOff — a bad config value shipped in 5.9.0. Revision 5.8.4 was healthy.",q:"What now?",c:[["Roll back: kubectl rollout undo deployment checkout (or revert the GitOps commit)",1],["Wait for the new pods to heal themselves",0],["Raise the CPU limits on the new pods",0],["Restart the control plane",0]],a:0},
  {s:"Error rate is back to baseline on 5.8.4. Time for the postmortem action item.",q:"Which prevention is the right one?",c:[["Validate config before rollout: schema checks in CI and readiness gates during the update",1],["Stop using rolling updates — deploy only at night",0],["Remove the probes so pods never fail readiness",0],["Pin the image to latest so fixes arrive automatically",0]],a:0}],
 x:"A rolling update replaces pods a few at a time, and readiness is the gate: a pod that is not ready never receives traffic, so a broken version stalls instead of breaking everything. Confirm the diagnosis with rollout status and events, then go back to the last good ReplicaSet with rollout undo. The real fix happens in the pipeline: validate configuration before it ships and let readiness protect users during every future rollout.",
 h:"The new ReplicaSet is the patient. The old one is your ambulance."},
{t:"type",th:3,p:10,k:"kubectl;container image;image tags;image registry",
 s:"You are diagnosing payments-9c4d in prod. You ran kubectl get events for that pod; the stream is below — use the filter box to hunt.",
 log:{name:"events — payments-9c4d (kubectl get events --for pod/payments-9c4d)",f:1,lines:[
 "2026-03-09T08:41:02Z INFO  Scheduled  pod payments-9c4d successfully assigned to node worker-07 (10[.]244[.]7[.]31)",
 "2026-03-09T08:41:03Z INFO  Pulling   image registry.nortide.internal/payments/api:9.4.1",
 "2026-03-09T08:41:04Z WARN   Failed    Failed to pull image registry.nortide.internal/payments/api:9.4.1: not found",
 "2026-03-09T08:41:06Z ERROR ErrorSync Back-off pulling image registry.nortide.internal/payments/api:9.4.1",
 "2026-03-09T08:41:20Z INFO  Back-off  5s elapsed: ImagePullBackOff",
 "2026-03-09T08:42:11Z INFO  Pulling   image registry.nortide.internal/payments/api:9.4.1",
 "2026-03-09T08:42:12Z WARN   Failed    manifest unknown: tag 9.4.1 does not exist"]},
 q:"Answer both fields below.",
 fields:[
  {lb:"1) The exact kubelet event name describing the current state",ph:"event name",ac:["^imagepullbackoff$"],ex:"ImagePullBackOff",canon:"imagepullbackoff"},
  {lb:"2) The manifest field that must be fixed",ph:"one word",ac:["^image$","^spec.*image$"],ex:"image (tag 9.4.1 was never pushed)",canon:"image"}],
 x:"The events tell one clean story: the pod scheduled fine onto worker-07, then every pull of api:9.4.1 fails with 'not found', and the kubelet backs off into ImagePullBackOff. The pod never started, so probes and resources are irrelevant yet. The broken part is the image reference — tag 9.4.1 does not exist in the payments repository. Push the tag or point the manifest at a tag that exists; then the kubelet pulls, the container runtime starts it, and the rest of the pipeline matters again.",
 h:"Filter the events for 'Failed' and read the last line like a sentence."}
,{t:"match",th:1,p:10,k:"node affinity;taints & tolerations;resource requests & limits;scheduling & bin packing",
 s:"The scheduler config review. Four mechanisms, four everyday situations — the new SRE mixed them up on the whiteboard.",
 q:"Match each scheduling mechanism to the situation it solves.",
 pool:["Node affinity","Taints & tolerations","Resource requests","Bin packing"],
 slots:["GPU pods must land only on nodes labelled gpu=true","Keep noisy batch pods off latency-critical nodes unless they accept the marker","The scheduler reserves 500m CPU on a node before placing the pod","Fill nodes up with many small pods instead of spreading them thin"],
 map:[0,1,2,3],
 x:"Node affinity pulls pods toward (or keeps them away from) nodes by labels — the GPU rule is a textbook affinity. Taints work the other way: the node repels pods that do not tolerate the taint, so batch work stays off the latency-critical nodes unless it carries the matching toleration. Requests are the scheduler's currency: it places a pod only where the requested CPU and memory are still free, which protects both pod and node. Bin packing is the density goal — pack pods tightly so you pay for fewer nodes.",
 h:"One attracts, one repels, one reserves, one packs."},
{t:"qcm",th:2,p:10,k:"canary deployment;rolling update;blue-green deployment",
 s:"Nortide ships a new recommendation engine. Product asks for 5% of real users first, an automatic abort if errors rise, then a step-by-step increase to 100%.",
 q:"Which deployment strategy fits this request best?",
 c:[["Canary — shift a small slice of traffic to the new version and grow it while metrics stay healthy",1],["Recreate — stop the old version completely, then start the new one",0],["Blue-green — switch 100% of traffic to the new environment at once",0],["Rolling update with maxUnavailable=50% — replace half the pods at a time",0]],
 x:"Canary is designed for exactly this request: give the new version a small slice of live traffic, watch error rate and latency, grow the slice step by step, and abort back to the old version if metrics degrade. Blue-green switches everyone at once — there is no 5% stage. Recreate has downtime. An aggressive rolling update replaces pods fast but offers no controlled small-blast-radius stage. The keywords in the request — small slice, watch, abort, grow — spell canary.",
 h:"The request has four parts: a small slice, observation, abort, growth."},
{t:"sort",th:1,p:10,k:"cluster;self-healing;resource requests & limits;image tags;job & cronjob",
 s:"09:00 shift handover at Nortide. Five tickets in the queue, one engineer, and very different business impact.",
 q:"Rank the tickets — top = handle first.",
 items:["prod node worker-07 NotReady — 12 pods evicted, orders failing","payments-api OOMKilled loop in the prod checkout path","staging ImagePullBackOff on catalogue:dev-42 — devs blocked","Last night's CronJob report failed once; yesterday's rerun exists","TLS certificate of the internal wiki expires in 30 days"],
 x:"Rank by customer impact times urgency. A dead worker node evicts many pods and breaks checkout now. An OOMKill loop in the prod payment path bleeds revenue every minute it runs. A staging pull failure hurts developers, not customers — annoying, not burning. The failed nightly report already has a rerun path and zero live damage. A certificate 30 days out is a scheduled task: track it, never spend incident time on it. Many pods are recreated automatically after the eviction — your work is the node, not the pods.",
 h:"Who cannot do their job right now, and how much does each minute cost?"},
{t:"lines",th:3,p:10,k:"YAML manifest",
 s:"A teammate's Deployment manifest refuses to apply. kubectl answers: error converting YAML — parsing failed. Three lines break the structure rules.",
 q:"Click the 3 structurally broken lines.",
 code:["apiVersion: apps/v1","kind: Deployment","metadata:","  name: catalogue","spec:"," replicas: 3","  selector:","    matchLabels:","      app: catalogue","  template:","    metadata:","\t     labels:","        app: catalogue","   spec:","    containers:","    - name: catalogue","      image: catalogue:2.4.1"],
 bad:[5,11,13],
 x:"YAML nests with consistent spaces and never with tabs. Line 6 indents replicas with one space while its siblings (selector, template) use two — the mapping is inconsistent, the parser dies. Line 12 starts with a tab character; tabs are forbidden in YAML indentation. Line 14 indents spec with three spaces while its sibling metadata uses four — same inconsistency again. Fix the indentation to two-space steps everywhere and the manifest parses. This is the single most common YAML failure mode.",
 h:"Count spaces character by character. And remember: tabs are banned in YAML."},
{t:"buckets",th:3,p:10,k:"control plane;kubelet & kube-proxy;container runtime",
 s:"Cert-prep flashcards on the cluster architecture chapter. Seven component cards, two buckets.",
 q:"Sort every component into its plane.",
 buckets:["Control plane","Worker node"],
 pool:["API server","etcd","Scheduler","Controller manager","kubelet","kube-proxy","Container runtime"],
 map:[0,0,0,0,1,1,1],
 x:"The control plane decides; the worker executes. The API server is the front door every client talks to. etcd stores the cluster's desired state. The scheduler assigns pods to nodes. The controller managers run the reconciliation loops that keep reality matching the manifests. On each worker node, the kubelet talks to the API server and manages that node's pods, the container runtime (containerd or CRI-O) pulls images and runs the containers, and kube-proxy wires Service virtual IPs into the node's packet rules.",
 h:"Who decides, and who does the work on the machine?"}
,{t:"blank",th:0,p:10,k:"Dockerfile;container image",
 s:"Hardening sprint: the billing image must become small and non-root before the next release. The Dockerfile lost four instructions during a bad merge.",
 q:"Fill the four gaps. Goal: small base, documented port, non-root user, default process.",
 text:"{{0}} node:20-alpine\nWORKDIR /srv\nCOPY . .\nRUN npm ci --omit=dev\n{{1}} 3000\nUSER {{2}}\n{{3}} [\"node\", \"server.js\"]",
 bank:["FROM","EXPOSE","USER","node","root","CMD","COPY"],
 sol:[0,1,3,5],
 x:"FROM selects the base image — node:20-alpine is small and gets patched upstream. EXPOSE documents which port the container listens on (documentation for humans and tooling). USER node makes the container run as the unprivileged node user — running as root is the anti-pattern, because a container escape from root hurts far more. CMD provides the default process in exec form. The COPY and RUN lines were already right: copy source, install only production dependencies to keep the layer small.",
 h:"The order on the card: base, port, user, default command."},
{t:"multi",th:0,p:10,k:"containers vs VMs;namespaces & cgroups;ephemeral containers;orchestrator",
 s:"A architect candidate repeats four claims about containers and VMs in an interview. Some are true, some are not.",
 q:"Select every TRUE statement.",
 c:[["Containers share the host kernel and isolate processes with namespaces and cgroups",1],["Each VM carries a full guest OS; a container carries only the app and its libraries",1],["Containers are ephemeral — replaced on deploy, not patched in place",1],["A VM starts in milliseconds; containers take minutes to boot",0],["Once you run containers, isolation no longer matters at all",0],["Orchestrators reschedule containers onto healthy nodes automatically",1]],
 x:"Containers virtualize at the OS level: they all share the host kernel while namespaces fence what each container can see and cgroups cap what it may consume. A VM virtualizes hardware and boots an entire guest OS — that is why containers start in milliseconds and VMs in tens of seconds. Containers are ephemeral by design: new image means new container, the old one is destroyed, never edited. Isolation still matters very much — that is why limits, non-root users and security contexts exist. And rescheduling containers onto healthy nodes is exactly the orchestrator's self-healing role.",
 h:"Two claims flip a truth. Two more deny things that still matter."},
{t:"qcm",th:1,p:10,k:"service discovery;pod;service types;load balancing",
 s:"Every time the payments pod restarts it returns with a different pod IP. The orders service must reach it reliably, around the clock.",
 q:"How do callers find payments without chasing pod IPs?",
 c:[["They call the Service's stable DNS name; the Service load-balances to whichever matching pods are ready",1],["Every restart writes the new pod IP into a shared ConfigMap that callers read",0],["Callers scan the node's IP range for open ports on each request",0],["The orchestrator pins the old IP back onto the restarted pod",0]],
 x:"A Service owns one stable virtual IP and a DNS name such as payments.prod.svc.cluster.local. Callers resolve that name once; the Service keeps a live endpoint list of ready matching pods and load-balances across it. When the pod restarts with a new IP, the endpoint list updates and discovery keeps working — that is service discovery doing its job. Storing pod IPs by hand is the pre-orchestrator world, scanning is a port-scan, and pod IPs are never pinned: they are disposable by design.",
 h:"Pods are disposable. What is stable enough to be a phone number?"},
{t:"match",th:4,p:10,k:"Kubernetes;Docker Swarm;Apache Mesos / Nomad;OpenShift;Docker Compose;Helm;ECS / Fargate",
 s:"Vendor fair day: seven platform cards on the table, all claiming to 'orchestrate containers'. The team must know who is who.",
 q:"Match each tool or platform to its honest one-line description.",
 pool:["Kubernetes","Docker Swarm","Apache Mesos / Nomad","OpenShift","Docker Compose","Helm","AWS Fargate"],
 slots:["Declarative container orchestration: pods, controllers and services at cluster scale","Simple orchestration built into Docker itself, for smaller clusters","Lightweight schedulers that also handle non-container workloads","Enterprise Kubernetes distribution with built-in developer and CI/CD tooling","Define and run multi-container apps on one host — mostly local development","The package manager of the Kubernetes world: charts bundle manifests","Run containers without managing servers — the cloud provides compute per task"],
 map:[0,1,2,3,4,5,6],
 x:"Kubernetes is the industry-default declarative orchestrator. Docker Swarm trades scale for simplicity inside the Docker engine. Nomad (from the Mesos family) is a lightweight scheduler that happily runs containers and plain binaries. OpenShift wraps Kubernetes with enterprise tooling, builds and developer workflows. Docker Compose describes multi-container apps for a single host — ideal on a laptop, not a cluster orchestrator. Helm is not a scheduler at all: it packages Kubernetes manifests as charts. Fargate is serverless compute: you bring containers, AWS runs the capacity per task.",
 h:"Two run your laptop, four run clusters, one sells you the machines themselves."},
{t:"term",th:3,p:10,k:"kubectl;pod",
 s:"The payments pod payments-7d9f-x2 in prod runs two containers; you need the one named api. Errors are being reported but the dashboards look fine.",
 q:"Use a kubectl command to show the last 100 lines of that api container's logs and keep following the output live.",
 fam:"Command family: kubectl logs. Flags you need: --tail for the line count, -f to follow, -c to choose the container. Output shape: one raw log line per row, streaming.",
 host:"nortide-jump — bash",

,{t:"order",th:3,p:10,k:"control plane;scheduling & bin packing;container runtime;health checks;service discovery",

 if(t.c===0&&t.sk===EX.length){
  window.alert("All exercises are skipped. Answer at least one exercise (press Check) before finishing.");
  return;
 }
 if(S.ended)return;
 if(!window.confirm("Finish the exam and see your results?"))return;
 finishExam(false);
}
function finishExam(auto){
 S.ended=true;S.cp=false;S.manual=false;$("pausebtn").disabled=true;$("pausebtn").textContent="⏸ Pause";
 $("pcover").hidden=true;
 try{$("exwrap").inert=false;}catch(e){}
 buildResults(auto);
 paintTop();
}
function buildResults(auto){
 $("exam").hidden=true;
 var w=$("results");w.hidden=false;w.innerHTML="";
 var t=scoreTotals(),reported=Math.round(t.e),pct=t.m>0?Math.round(100*reported/t.m):0,pass=pct>=CFG.pass;
 var c1=el("div","card");
 if(auto)c1.appendChild(el("p","ambt","⏱ Time is over — the exam was submitted automatically."));
 c1.appendChild(el("div","banner "+(pass?"pass":"fail"),pass?"✔ PASS — "+pct+"%":"✘ FAIL — "+pct+"%  (pass mark: "+CFG.pass+"%)"));
 c1.appendChild(el("p","subline",pass?"Certificate-style result: you reached the passing score on this "+CFG.sev+" exam.":"You must retake this exam to reach the "+CFG.pass+"% pass mark. Review the report below, then press Retake Exam."));
 var g=el("div","resgrid");
 function stat(v,l){var s=el("div","statc");s.appendChild(el("div","v",v));s.appendChild(el("div","l",l));g.appendChild(s);}
 stat(t.e.toFixed(1),"points earned");
 stat(pct+"%","score (non-skipped only)");
 stat(t.m,"points possible (non-skipped)");
 stat(checkedCount()+"/"+EX.length,"checked");
 stat(t.sk,"skipped (not counted)");
 c1.appendChild(g);
 if(t.sk>0){
  var names=[];
  for(var i=0;i<EX.length;i++)if(S.ex[i].st==="skip")names.push("Q"+(S.order.indexOf(i)+1));
  c1.appendChild(el("div","skipbox","⚠ Skipped and excluded from scoring: "+esc(names.join(", "))+". They count in neither your points nor the maximum."));
 }
 w.appendChild(c1);
 var c2=el("div","card");
 c2.appendChild(el("h2",null,"Per-exercise report"));
 var tb=el("table","rtable");
 tb.innerHTML="<thead><tr><th scope=\"col\">Q</th><th scope=\"col\">Type / skills</th><th scope=\"col\">Your answer</th><th scope=\"col\">Correct answer</th><th scope=\"col\">Points</th><th scope=\"col\">Result</th><th scope=\"col\">Explanation</th></tr></thead>";
 var bd=el("tbody");
 for(i=0;i<EX.length;i++){
  (function(i){
   var st=S.ex[i],ex=EX[i],row=el("tr");
   var label,tag;
   if(st.st==="skip"){label="skipped";tag='<span class="tagskip">→ skipped (not counted)</span>';}
   else if(!st.ck||!st.res){label="zero";tag='<span class="tagzero">✗ not checked (0)</span>';}
   else{
    var gp=st.res.got/st.res.n;
    if(gp>=1){label="full";tag='<span class="tagfull">✓ full</span>';}
    else if(gp<=0){label="zero";tag='<span class="tagzero">✗ zero</span>';}
    else{label="partial";tag='<span class="tagpart">⚠ partial</span>';}
   }
   var your="(skipped — not scored)",corr;
   if(st.ck&&st.res){your=st.res.your;corr=st.res.corr;}
   else{var tmp=R[ex.t].check(ex,initAns(ex));corr=tmp.corr;}
   row.appendChild(el("td",null,String(S.order.indexOf(i)+1)));
   row.appendChild(el("div",null,"<b>"+TYPENAMES[ex.t]+"</b><div class='revexp'>Review: "+esc(ex.k.split(";").join(", "))+"</div>"));
   row.appendChild(el("td",null,'<span class="mono">'+esc(your)+"</span>"));
   row.appendChild(el("td",null,'<span class="mono">'+esc(corr)+"</span>"));
   row.appendChild(el("td",null,(st.earned==null?0:st.earned).toFixed(1)+" / "+ex.p));
   row.appendChild(el("div",null,tag));
   row.appendChild(el("td",null,'<span class="revexp">'+esc(ex.x)+"</span>"));
   bd.appendChild(row);
  })(i);
 }
 tb.appendChild(bd);var tsc=el("div","tscroll");tsc.appendChild(tb);c2.appendChild(tsc);
 var rt=el("button","btn-pri","Retake Exam");
 rt.type="button";rt.style.minWidth="220px";rt.style.marginTop="14px";
 rt.onclick=function(){startExam();};
 var wrap=el("div");wrap.style.textAlign="center";wrap.appendChild(rt);c2.appendChild(wrap);
 w.appendChild(c2);
 if(!S.reported){
  S.reported=true;
  reportScore(reported,t.m);
 }
 window.scrollTo({top:0,behavior:"auto"});
}
function boot(){
 S.left=CFG.min*60;
 $("tmr").textContent=fm(S.left);
 $("pausebtn").onclick=doPause;
 $("pcres").onclick=doPause;
 buildIntro();paintTop();
 setInterval(tick,1000);
}
boot();

</script>
</body>
</html>
