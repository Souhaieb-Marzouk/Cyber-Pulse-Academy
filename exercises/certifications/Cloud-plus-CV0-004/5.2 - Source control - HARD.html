<script>
"use strict";
/* ============ Exam engine — shared by both severity files ============ */
var DATA = JSON.parse(document.getElementById('exam-data').textContent);
var EM = {topicId:'cloud-plus', sev:'HARD', perQ:80, minutes:40, pass:70,
          title:'5.2 Source Control — HARD', cert:'CompTIA Cloud+ (CV0-004)'};

var THEMES = [
 {n:'Git core operations', k:['repository (clone / fork / remote)','working directory & staging area (git add)','atomic commit & commit message','HEAD / switch / detached HEAD','branch','merge / fast-forward','merge conflict & conflict markers','rebase','push / pull / fetch (origin)','git status / log / diff / show / blame','revert / reset / rollback','stash','cherry-pick','reflog','force push / --force-with-lease','tag','.gitignore','Git LFS']},
 {n:'Branching & collaboration', k:['feature branch','trunk-based development','GitHub Flow','Git Flow (develop / release / hotfix)','hotfix branch','release branch / backport','pull request','code review & approval','branch protection rules','squash merge','merge queue','commit signing & verification']},
 {n:'CI/CD & automation', k:['CI/CD pipeline','pipeline-as-code (Jenkinsfile / .gitlab-ci.yml / Actions YAML)','build trigger & webhook','pre-commit hook','automated tests as merge gate','build artifact','secret scanning','push protection','dependency scanning (SCA)']},
 {n:'Cloud & IaC', k:['IaC (Terraform / Ansible)','Terraform state & remote backend','GitOps','single source of truth','drift','GitOps operator (Argo CD / Flux)','reconcile','monorepo vs polyrepo','GitHub','GitLab','Bitbucket','Azure Repos','AWS CodeCommit / CodePipeline']},
 {n:'Versioning & release', k:['semantic versioning (major.minor.patch)','changelog','release','LTS']},
 {n:'Security & governance', k:['secrets in code (.env / API keys)','credential rotation','secrets vault / secret manager','RBAC & least privilege on repos','audit trail','dependency vulnerability & lockfile pinning','SBOM','repo visibility & forks','mirror / backup']}
];

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sh(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmt(n){var v=Math.round(n*10)/10;return (v%1===0)?String(v):v.toFixed(1);}

var S = {order:[], cur:0, A:[], started:false, over:false, remain:0, manP:false, chkP:false, user:'', reported:false};
var tick = null;

function nElems(ex){
  switch(ex.type){
    case 'multi': return ex.ch.filter(function(c){return c.ok;}).length;
    case 'match': return ex.items.length;
    case 'order': return ex.steps.length;
    case 'fitb': return ex.ans.length;
    case 'spot': return ex.bad.length;
    case 'terminal': return ex.goals.length;
    case 'decision': return ex.steps.length;
    case 'steps': return ex.cards.length;
    case 'logview': return ex.ans.kind==='multi' ? ex.ans.ch.filter(function(c){return c.ok;}).length : ex.ans.bad.length;
    default: return 1;
  }
}
DATA.forEach(function(ex){ ex._n = nElems(ex); ex._pts = (ex.type==='qcm') ? 2 : ex._n; });

var TB = (function(){ var b=[],n=0; THEMES.forEach(function(t){ n+=t.k.length; b.push(n); }); return b; })();
function themeOf(ex){ for(var i=0;i<TB.length;i++){ var hit=false;
  for(var j=0;j<ex.kw.length;j++){ if(ex.kw[j]<=TB[i]){ hit=true; break; } }
  if(hit) return i; } return 0; }
var TYPELBL = {qcm:'QCM', multi:'MULTI-SELECT', match:'MATCH', order:'ORDER THE STEPS', fitb:'FILL THE GAPS', spot:'SPOT THE MISTAKE', terminal:'TERMINAL', decision:'BRANCHING SCENARIO', steps:'TRIAGE CARDS', logview:'LOG ANALYSIS'};
var ANSLBL = {qcm:'CHOOSE ONE ANSWER', multi:'SELECT ALL THAT APPLY', match:'PLACE EACH ITEM IN THE RIGHT ZONE (click item, then zone — or drag)', order:'PUT THE STEPS IN ORDER (drag or use the arrows)', fitb:'FILL EVERY GAP FROM THE WORD BANK', spot:'CLICK THE LINE(S) WITH THE MISTAKE', terminal:'TYPE THE COMMANDS, PRESS ENTER', decision:'WORK THROUGH THE STEPS IN ORDER', steps:'ANSWER EVERY CARD'};

/* ============ Intro screen ============ */
function renderIntro(){
  var kw = THEMES.map(function(t){
    return '<div class="kwtheme"><h3>'+esc(t.n)+'</h3><div class="kws">'+t.k.map(function(k){return '<span class="kw">'+esc(k)+'</span>';}).join('')+'</div></div>';
  }).join('');
  $('app').innerHTML =
  '<div class="hero">'+
    '<div class="badgerow"><span class="badge sev">'+EM.sev+' severity</span><span class="badge">'+DATA.length+' exercises</span><span class="badge">Timer: '+EM.minutes+' minutes</span><span class="badge">Pass mark: '+EM.pass+'%</span></div>'+
    '<h1>'+esc(EM.cert)+' — 5.2 Source Control</h1>'+
    '<p class="sub">Scenario-based practice exam on <b>managing code with source control techniques</b>: Git core, branching strategies, pull requests and protection, CI/CD integration, GitOps and IaC, versioning, and secrets governance. Every exercise mirrors real cloud-platform work.</p>'+
    '<p class="sub">Signed in as <b id="uname">'+esc(S.user||'candidate')+'</b> — good luck.</p>'+
    '<div class="badgerow" style="margin-top:14px"><button id="start" class="btn primary big">Start exam</button></div>'+
  '</div>'+
  '<section class="card"><h2>How this exam works</h2><ul class="rules">'+
    '<li><b>'+DATA.length+' exercises, '+EM.minutes+' minutes.</b> The timer counts down for the whole exam. At zero the exam submits itself. '+EM.sev+' severity: realistic data and multi-step reasoning'+(EM.sev==='HARD'?', subtle distractors and near-miss answers':' that a prepared candidate can finish in time')+'.</li>'+
    '<li><b>Check</b> grades the exercise, marks every element <span class="mark ok">✓ correct</span>, <span class="mark bad">✗ wrong</span> or <span class="mark miss">! missed</span>, and locks it. The clock then pauses in <b>review mode</b> — everything stays visible so you can study the explanation. The clock restarts only when you press <b>Next</b> (or navigate to another exercise).</li>'+
    '<li><b>Pause</b> is the manual break button. It hides the exercise until you resume. The two pauses are independent and can stack.</li>'+
    '<li><b>Skip</b> jumps ahead and marks the exercise amber. Skipped exercises are <b>excluded from scoring</b> — they count neither as earned nor as possible points. You can return to any exercise until the timer ends.</li>'+
    '<li><b>Exercise types:</b> QCM, multi-select, matching zones (click or drag), step ordering, fill-the-gaps word bank, spot-the-mistake, an interactive git terminal, a log viewer with a filter box, branching scenarios and triage cards.</li>'+
    '<li><b>Partial credit:</b> multi-answer exercises score per correct element, so 3 of 4 correct earns 3/4 of the points. Single-answer exercises are all or nothing.</li>'+
    '<li><b>Hint</b> costs 10% of that exercise\'s points and gives a nudge — never the answer.</li>'+
    '<li>Pass mark <b>'+EM.pass+'%</b>. The final report explains every answer, including skipped ones, and shows where to focus.</li>'+
  '</ul></section>'+
  '<section class="card"><h2>Keywords covered</h2><div class="kwpanel">'+kw+'</div></section>';
  $('start').addEventListener('click', startExam);
}

/* ============ Exam chrome ============ */
function startExam(){
  S.order = sh(DATA.map(function(_,i){return i;}));
  S.A = DATA.map(function(){return {status:'unanswered', ans:null, res:null, earned:0, hint:false, rt:null};});
  S.cur = 0; S.started = true; S.over = false; S.remain = EM.minutes*60;
  S.manP = false; S.chkP = false; S.reported = false;
  renderChrome(); goto(0);
  if(tick) clearInterval(tick);
  tick = setInterval(function(){
    if(!S.started || S.over || S.manP || S.chkP) return;
    S.remain--; drawTimer();
    if(S.remain <= 0){ S.remain = 0; drawTimer(); finishExam(true); }
  }, 1000);
}
function renderChrome(){
  $('app').innerHTML =
  '<header class="topbar">'+
    '<div><h1>'+esc(EM.cert)+' — '+esc(EM.title)+'</h1><p class="sub" id="scoreline">Question 1 of '+DATA.length+' · Score 0 pts</p></div>'+
    '<div class="timerbox"><div id="timer" class="mono" role="timer">'+EM.minutes+':00</div><div id="pstate" class="pstate" aria-live="polite"></div></div>'+
    '<div class="badgerow"><button id="pauseBtn" class="btn">Pause</button><button id="submitBtn" class="btn">Submit</button></div>'+
  '</header>'+
  '<div class="bar"><div id="fill"></div></div>'+
  '<div id="themeline" class="themeline"></div>'+
  '<nav id="nav" class="navgrid" aria-label="Question navigator"></nav>'+
  '<section id="ex"></section>'+
  '<footer class="foot"><button id="prevBtn" class="btn">← Prev</button><button id="nextBtn" class="btn primary">Next →</button></footer>';
  $('pauseBtn').addEventListener('click', togglePause);
  $('submitBtn').addEventListener('click', submitFlow);
  $('prevBtn').addEventListener('click', function(){ if(S.cur>0) goto(S.cur-1); });
  $('nextBtn').addEventListener('click', next);
  updateNav(); drawTimer(); updateScore();
}
function drawTimer(){
  var t=$('timer'); if(!t) return;
  var m=Math.floor(S.remain/60), s=S.remain%60;
  t.textContent = m+':'+(s<10?'0':'')+s;
  t.className = 'mono' + (S.remain<60?' crit':(S.remain<300?' warn':''));
  var p=$('pstate'); if(!p) return;
  var msgs=[];
  if(S.manP) msgs.push('Paused (manual)');
  if(S.chkP) msgs.push('Timer paused — review mode');
  p.textContent = msgs.join(' · ');
}
function updateNav(){
  var n=$('nav'); if(!n) return;
  n.innerHTML = S.order.map(function(oi,pos){
    var a=S.A[oi], ex=DATA[oi]; var cls='navcell', ttl='Q'+(pos+1)+' — '+TYPELBL[ex.type];
    var glyph='';
    if(a.status==='skipped'){cls+=' skipped'; ttl+=' — skipped (excluded from scoring)'; glyph='⤼ ';}
    else if(a.status==='locked'){
      if(a.earned>=ex._pts-0.001){cls+=' done';ttl+=' — full points';glyph='✓ ';}
      else if(a.earned>0){cls+=' part';ttl+=' — partial points';glyph='! ';}
      else {cls+=' zero';ttl+=' — zero points';glyph='✗ ';}
    } else ttl+=' — not answered yet';
    var cur = (pos===S.cur);
    if(cur){cls+=' cur';ttl+=' — you are here';}
    return '<button class="'+cls+'" data-pos="'+pos+'" title="'+esc(ttl)+'" aria-label="'+esc(ttl)+'"'+(cur?' aria-current="true"':'')+'>'+glyph+(a.status==='skipped'?'':(pos+1))+'</button>';
  }).join('');
  n.querySelectorAll('.navcell').forEach(function(b){
    b.addEventListener('click', function(){ goto(parseInt(b.getAttribute('data-pos'),10)); });
  });
}
function updateScore(){
  var e=0; S.A.forEach(function(a){ if(a.status==='locked') e+=a.earned; });
  var done=0, skip=0; S.A.forEach(function(a){ if(a.status==='locked')done++; if(a.status==='skipped')skip++; });
  var sl=$('scoreline');
  if(sl) sl.textContent = 'Question '+(S.cur+1)+' of '+DATA.length+' · Score '+fmt(e)+' pts · Checked '+done+' · Skipped '+skip;
  var f=$('fill'); if(f) f.style.width = ((S.cur+1)/DATA.length*100)+'%';
  var tl=$('themeline');
  if(tl){ tl.innerHTML = THEMES.map(function(t,ti){
    var tot=0, got=0;
    S.order.forEach(function(oi){ var ex=DATA[oi];
      if(themeOf(ex)===ti){ tot++; if(S.A[oi].status==='locked') got++; } });
    return '<span class="tchip'+(tot&&got===tot?' tdone':'')+'" title="'+esc(t.n)+': '+got+' of '+tot+' exercises checked">'+esc(t.n)+' '+got+'/'+tot+'</span>';
  }).join(''); }
  drawTimer();
}
function goto(pos){
  if(pos<0||pos>=DATA.length) return;
  S.chkP = false; S.cur = pos;
  renderExercise();
  updateNav(); updateScore();
  if($('ex')) window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
function next(){
  S.chkP = false;
  if(S.cur >= DATA.length-1){ submitFlow(); return; }
  goto(S.cur+1);
}
function togglePause(){
  if(!S.started||S.over) return;
  S.manP = !S.manP;
  $('pauseBtn').textContent = S.manP ? 'Resume' : 'Pause';
  drawTimer();
  renderExercise();
}
</script>
<script>
"use strict";
/* ============ Renderers ============ */
var R = null;

function exShell(ex){
  var oi = DATA.indexOf(ex);
  var a = S.A[oi];
  var kw = ex.kw.map(function(id){return '<span class="kw">'+esc(kwName(id))+'</span>';}).join('');
  var artefact = '';
  if(ex.type==='logview'){
    artefact = '<div class="card"><div class="lab">'+esc(ex.file||'ARTIFACT — LOG')+'</div><div id="logwrap"></div></div>';
  } else if(ex.type==='spot'){
    artefact = '<div class="card"><div class="lab">'+esc(ex.file||'ARTIFACT — FILE')+'</div><div id="codewrap" class="codeblk"></div></div>';
  }
  return '<div class="exhead"><span class="qnum">Q'+(S.cur+1)+'</span><span class="badge type">'+TYPELBL[ex.type]+'</span><span class="ptsline">'+(ex.type==='qcm'?'2 points (all or nothing)':ex._n+' × 1 point')+'</span><div class="kwrow">'+kw+'</div></div>'+
    '<div class="card scen"><div class="lab">Scenario</div>'+ex.scen+'</div>'+
    artefact+
    '<div class="card quest"><div class="lab">Question</div>'+ex.q+'</div>'+
    '<div class="card ans"><div class="lab">'+(ANSLBL[ex.type]||'ANSWER')+'</div><div id="answrap" class="answrap"></div>'+
    '<div id="fb" class="hidden"></div>'+
    '<div class="actions"><button id="checkBtn" class="btn primary">Check</button><button id="skipBtn" class="btn">Skip</button><button id="hintBtn" class="btn">Hint (−10%)</button><button id="reviseBtn" class="btn hidden">Revise</button></div>'+
    '<div id="hintbox" class="hintbox hidden"></div></div>'+
    '<div class="card expl hidden" id="expl"><div class="lab">Explanation</div>'+ex.explain+'</div>';
}
function renderExercise(){
  var oi = S.order[S.cur], ex = DATA[oi], a = S.A[oi];
  if(S.manP){
    $('ex').innerHTML = '<div class="card pausecover"><div class="pauseoverlay">Paused (manual) — press Resume to continue. The exercise is hidden while the clock is stopped.</div></div>';
    R = null; return;
  }
  $('ex').innerHTML = exShell(ex);
  var cont = $('answrap');
  R = makeRenderer(ex, cont, a, true);
  wireActions(ex, a);
  if(R.sync) R.sync();
  if(a.status==='locked' && a.res){
    R.paint(a.res); R.lock();
    showFb(ex, a); showExpl(true);
    $('checkBtn').disabled = true; $('reviseBtn').classList.remove('hidden');
  }
}
function wireActions(ex, a){
  $('checkBtn').addEventListener('click', doCheck);
  $('skipBtn').addEventListener('click', doSkip);
  $('hintBtn').addEventListener('click', doHint);
  $('reviseBtn').addEventListener('click', doRevise);
  $('checkBtn').disabled = (a.status==='locked');
  if(a.status==='locked' && a.res){ $('reviseBtn').classList.remove('hidden'); }
  if(a.hint){ $('hintBtn').textContent='Hint used'; $('hintBtn').disabled=true; var hb=$('hintbox'); hb.textContent='Hint: '+ex.hint; hb.classList.remove('hidden'); }
}
/* -- per-type renderer factories: each returns {get,paint,lock,unlock,clear} -- */
function choiceList(ex, cont, a, ed, multi){
  var rt = a.rt = a.rt||{};
  rt.disp = rt.disp || sh(ex.ch.map(function(_,i){return i;}));
  var name = 'q'+DATA.indexOf(ex);
  cont.innerHTML = '<div class="choicelist">'+rt.disp.map(function(oi){
    return '<label class="choice"><input type="'+(multi?'checkbox':'radio')+'" name="'+name+'" value="'+oi+'"><span class="ct">'+ex.ch[oi].t+'</span><span class="mk"></span></label>';
  }).join('')+'</div>';
  var inputs = Array.prototype.slice.call(cont.querySelectorAll('input'));
  inputs.forEach(function(inp){
    inp.addEventListener('change', function(){ if(a.status==='locked') return;
      if(multi){ var arr = (a.ans||[]).slice(); var v=parseInt(inp.value,10);
        if(inp.checked){ if(arr.indexOf(v)<0) arr.push(v);} else { arr = arr.filter(function(x){return x!==v;}); }
        a.ans = arr;
      } else a.ans = parseInt(inp.value,10);
    });
  });
  function el(i){ return cont.querySelector('input[value="'+i+'"]').closest('.choice'); }
  return {
    get: function(){ return a.ans; },
    sync: function(){ inputs.forEach(function(inp){ inp.checked = multi ? (a.ans||[]).indexOf(parseInt(inp.value,10))>=0 : (a.ans===parseInt(inp.value,10)); }); },
    paint: function(res, marksByOrig){
      inputs.forEach(function(inp){
        var i = parseInt(inp.value,10); var row = el(i); var mk = row.querySelector('.mk');
        var st = marksByOrig ? marksByOrig[i] : null;
        row.classList.remove('ok','bad','miss');
        if(!multi && st===undefined){ }
        if(multi){ if(st==='ok'){row.classList.add('ok'); mk.innerHTML='<span class="mark ok">✓ correct</span>';}
          else if(st==='bad'){row.classList.add('bad'); mk.innerHTML='<span class="mark bad">✗ wrong</span>';}
          else if(st==='miss'){row.classList.add('miss'); mk.innerHTML='<span class="mark miss">! missed</span>';} }
        else { if(res.ok && i===a.ans){row.classList.add('ok'); mk.innerHTML='<span class="mark ok">✓ correct</span>';}
          else if(!res.ok && i===a.ans){row.classList.add('bad'); mk.innerHTML='<span class="mark bad">✗ wrong</span>';}
          else if(!multi && ex.ch[i].ok){row.classList.add('ok'); mk.innerHTML='<span class="mark ok">✓ this was correct</span>';} }
      });
    },
    lock: function(){ inputs.forEach(function(i){i.disabled=true;}); },
    unlock: function(){ inputs.forEach(function(i){i.disabled=false;}); },
    clear: function(){ cont.querySelectorAll('.choice').forEach(function(r){r.classList.remove('ok','bad','miss'); var m=r.querySelector('.mk'); if(m) m.innerHTML='';}); }
  };
}
function rQCM(ex,cont,a){ return choiceList(ex,cont,a,false,false); }
function rMulti(ex,cont,a){ return choiceList(ex,cont,a,true,true); }
function rMatch(ex,cont,a){
  var rt = a.rt = a.rt||{};
  rt.disp = rt.disp || sh(ex.items.map(function(_,i){return i;}));
  rt.place = rt.place||{}; var sel=null;
  function chip(i){ var it=ex.items[i];
    return '<button class="mitem" draggable="true" data-i="'+i+'">'+it.t+'</button>'; }

function compute(ex, ans){

    case 'qcm': {
      ok = typeof ans==='number' && ans>=0 && ans<ex.ch.length && !!ex.ch[ans] && ex.ch[ans].ok;
      return {ok:ok, earned: ok?1:0, correctIdx: ex.ch.findIndex(function(c){return c.ok;})};
    }

      var got = ex.ch.filter(function(c,idx){ return c.ok && sel.indexOf(idx)>=0; }).length;

    }

      if(ex.ans.kind==='multi'){
        var sel2 = ans||[];
        var m2 = ex.ans.ch.map(function(c,idx){ return sel2.indexOf(idx)>=0 ? (c.ok?'ok':'bad') : (c.ok?'miss':null); });
        var g2 = ex.ans.ch.filter(function(c,idx){ return c.ok && sel2.indexOf(idx)>=0; }).length;
        return {marks:m2, earned: g2/ex._n};
      }
      return compute({type:'spot', bad:ex.ans.bad, _n:ex._n, code:ex.log}, ans);
    }
  }
  return {marks:[], earned:0};
}
/* ============ Check / Revise / Skip / Hint ============ */
function doCheck(){
  var oi=S.order[S.cur], ex=DATA[oi], a=S.A[oi];
  if(!R) return;
  var ans = R.get();
  var res = compute(ex, ans);
  var cost = 0;
  if(a.hint && !a.hintCharged){ cost = 0.1*ex._pts; a.hintCharged = true; }
  res.earnedFinal = Math.max(0, res.earned*ex._pts - cost);
  a.ans = ans; a.res = res; a.earned = res.earnedFinal; a.status='locked';
  R.paint(res); R.lock();
  showFb(ex, a); showExpl(true);
  $('checkBtn').disabled = true; $('reviseBtn').classList.remove('hidden');
  S.chkP = true; drawTimer(); updateNav(); updateScore();
}
function doRevise(){
  var a=S.A[S.order[S.cur]];
  if(!R || S.over) return;
  a.status='revising';
  R.unlock(); R.clear();
  hideFb(); showExpl(false);
  $('checkBtn').disabled = false; $('reviseBtn').classList.add('hidden');
}
function doSkip(){
  var a=S.A[S.order[S.cur]];
  a.status='skipped'; S.chkP=false; updateNav(); updateScore();
  if(S.cur>=DATA.length-1){ submitFlow(); } else { goto(S.cur+1); }
}
function doHint(){
  var oi=S.order[S.cur], ex=DATA[oi], a=S.A[oi];
  var hb=$('hintbox');
  if(!a.hint){
    a.hint=true;
    if(a.status==='locked'){ a.earned=Math.max(0, a.earned-0.1*ex._pts); a.hintCharged=true; updateNav(); updateScore(); }
  }
  hb.textContent = 'Hint: '+ex.hint;
  hb.classList.remove('hidden');
  $('hintBtn').textContent='Hint used'; $('hintBtn').disabled=true;
}
function showFb(ex, a){
  var fb=$('fb'); if(!fb) return;
  fb.classList.remove('hidden');
  var lab = a.earned>=ex._pts-0.001 ? 'full marks' : (a.earned>0 ? 'partial' : 'zero');
  fb.innerHTML = '<div class="scoreline">You earned '+fmt(a.earned)+' / '+fmt(ex._pts)+' points on this exercise — '+lab+'.'+
    (a.hint?' <span class="skipnote">(includes −'+fmt(0.1*ex._pts)+' hint cost)</span>':'')+
    ' <span class="mark miss">Timer paused — review mode. Press Next to continue.</span></div>';
}
function hideFb(){ var fb=$('fb'); if(fb){ fb.classList.add('hidden'); fb.innerHTML=''; } }
function showExpl(v){ var e=$('expl'); if(e) e.classList.toggle('hidden', !v); }
/* ============ Submit & results ============ */
function submitFlow(){
  var locked=0, skipped=0;
  S.A.forEach(function(a){ if(a.status==='locked')locked++; else skipped++; });
  $('ex').innerHTML = '<div class="card"><h2>Submit the exam?</h2>'+
    '<p>You have checked <b>'+locked+'</b> of '+DATA.length+' exercises.'+(skipped>0?' <b>'+skipped+'</b> are unchecked or skipped and will be <b>excluded from scoring</b> (they count neither for nor against you).':'')+'</p>'+
    (locked===0?'<p class="skipnote">All exercises are skipped or unanswered — answer at least one exercise before submitting.</p>':'')+
    '<div class="actions"><button id="cfYes" class="btn primary" '+(locked===0?'disabled':'')+'>Finish &amp; submit</button><button id="cfNo" class="btn">Keep working</button></div></div>';
  $('cfNo').addEventListener('click', function(){ renderExercise(); });
  if(locked>0) $('cfYes').addEventListener('click', function(){ finishExam(false); });
}
function finishExam(auto){
  if(S.over) return;
  S.over = true; if(tick) clearInterval(tick);
  var answered=0;
  S.A.forEach(function(a){ if(a.status==='locked') answered++; else a.status='skipped'; });
  if(answered===0){
    $('ex').innerHTML = '<div class="card"><h2>Nothing to score</h2><p class="skipnote">Every exercise was skipped. Answer at least one exercise — the exam cannot be submitted empty.'+(auto?' (The timer has ended.)':'')+'</p><div class="actions"><button id="rt2" class="btn primary">Retake exam</button></div></div>';
    $('rt2').addEventListener('click', startExam);
    return;
  }
  var total=0, earned=0, skippedList=[];
  S.order.forEach(function(oi,pos){
    var a=S.A[oi], ex=DATA[oi];
    if(a.status!=='skipped'){ total+=ex._pts; earned+=a.earned; }
    else skippedList.push(pos+1);
  });
  earned = Math.round(earned); /* round the final total once, here */
  var pct = Math.round(earned*100/total);
  var passed = pct>=EM.pass;
  renderResults(earned,total,pct,passed,skippedList,auto);
  if(!S.reported){
    S.reported=true;
    reportScore(earned, total, pct, passed);
  }
}
function reportScore(correct, total, percent, passed){
  try{
    parent.postMessage({ type:'CYBERPULSE_SCORE', topicId:EM.topicId, score:correct, total:total, percent:percent, passed:passed }, location.origin);
  }catch(e){ /* Opened directly rather than inside the site. Nothing to report to. */ }
}
function ansText(ex, a){
  var ans=a.ans;
  switch(ex.type){
    case 'qcm': return (ans>=0&&ans!==undefined&&ans!==null)? ex.ch[ans].t : '(no answer given)';
    case 'multi': return (ans&&ans.length)? ans.map(function(i){return '• '+ex.ch[i].t;}).join('<br>') : '(nothing selected)';
    case 'match': return ex.items.map(function(it,i){ var z=ans?ans[i]:null; var zl=z? (ex.zones.find(function(zn){return zn.id===z;})||{}).l : 'not placed'; return '• '+it.t+' → '+zl; }).join('<br>');
    case 'order': return (ans||[]).map(function(si){return ex.steps[si];}).join(' <span class="mono">→</span>');
    case 'fitb': return (ans||[]).map(function(w,i){ return (i+1)+'. '+(w?w:'(empty)'); }).join('<br>');
    case 'spot': { var rows=ex.code||ex.log; return (ans&&ans.length)? ans.map(function(i){return 'Line '+(i+1)+': <code>'+esc(rows[i])+'</code>';}).join('<br>') : '(nothing clicked)'; }
    case 'terminal': return ex.goals.map(function(g,i){ return (ans&&ans[i])?'✓ '+g.label:'✗ '+g.label; }).join('<br>');
    case 'decision': return ex.steps.map(function(st,i){ var c=(ans&&ans[i]!==null&&ans[i]!==undefined)? st.ch[ans[i]].t : '(not reached)'; return 'Step '+(i+1)+': '+c; }).join('<br>');
    case 'steps': return ex.cards.map(function(cd,i){ var c=(ans&&ans[i]!==null&&ans[i]!==undefined)? cd.ch[ans[i]].t : '(no answer)'; return 'Card '+(i+1)+': '+c; }).join('<br>');
    case 'logview': {
      if(ex.ans.kind==='multi') return (ans&&ans.length)? ans.map(function(i){return '• '+ex.ans.ch[i].t;}).join('<br>') : '(nothing selected)';
      return (ans&&ans.length)? ans.map(function(i){return 'Log line '+(i+1);}).join('<br>') : '(nothing clicked)';
    }
  }
  return '';
}
function correctText(ex){
  switch(ex.type){
    case 'qcm': return ex.ch.find(function(c){return c.ok;}).t;
    case 'multi': return ex.ch.filter(function(c){return c.ok;}).map(function(c){return '• '+c.t;}).join('<br>');
    case 'match': return ex.items.map(function(it){ var zl=ex.zones.find(function(z){return z.id===it.z;}); return '• '+it.t+' → '+zl.l; }).join('<br>');
    case 'order': return ex.steps.map(function(s,i){return (i+1)+'. '+s;}).join('<br>');
    case 'fitb': return ex.ans.map(function(w,i){return (i+1)+'. '+w;}).join('<br>');
    case 'spot': { var rows=ex.code||ex.log; return ex.bad.map(function(b){return 'Line '+(b+1)+': <code>'+esc(rows[b])+'</code>';}).join('<br>'); }
    case 'terminal': return ex.goals.map(function(g,i){return (i+1)+'. '+g.label+(g.eg?' — e.g. <code>'+esc(g.eg)+'</code>':'');}).join('<br>');
    case 'decision': return ex.steps.map(function(st,i){ var c=st.ch.find(function(c){return c.ok;}); return 'Step '+(i+1)+': '+c.t; }).join('<br>');
    case 'steps': return ex.cards.map(function(cd,i){ var c=cd.ch.find(function(c){return c.ok;}); return 'Card '+(i+1)+': '+c.t; }).join('<br>');
    case 'logview': {
      if(ex.ans.kind==='multi') return ex.ans.ch.filter(function(c){return c.ok;}).map(function(c){return '• '+c.t;}).join('<br>');
      return ex.ans.bad.map(function(b){return 'Log line '+(b+1)+': <code>'+esc(ex.log[b])+'</code>';}).join('<br>');
    }
  }
  return '';
}
function renderResults(earned,total,pct,passed,skippedList,auto){
  var used = EM.minutes*60 - S.remain;
  var um = Math.floor(used/60), us = used%60;
  var verdict = passed ?
    '<div class="verdict"><div class="seal">✓</div><div class="big">PASS</div>'+
    '<p><b>'+esc(S.user||'Candidate')+'</b> has completed<br><b>'+esc(EM.cert)+' — 5.2 Source Control — '+EM.sev+'</b><br>with a score of <b>'+pct+'%</b> (pass mark '+EM.pass+'%).</p></div>' :
    '<div class="verdict fail"><div class="seal">✗</div><div class="big">FAIL — '+pct+'%</div><p>You needed '+EM.pass+'%. Retake the exam — the questions and answers reshuffle.</p></div>';
  var skippedHtml = skippedList.length ? '<p class="skipnote">Skipped and excluded from scoring: '+skippedList.map(function(n){return 'Q'+n;}).join(', ')+'. These points were removed from both your score and the maximum.</p>' : '<p class="sub">No skipped exercises.</p>';
  var themeRows = THEMES.map(function(t,ti){
    var sum=0, cnt=0;
    S.order.forEach(function(oi){
      var ex=DATA[oi], a=S.A[oi];
      if(a.status!=='locked') return;
      if(themeOf(ex)===ti){ sum += a.earned/ex._pts; cnt++; }
    });
    return '<tr><td>'+esc(t.n)+'</td><td>'+(cnt? Math.round(sum/cnt*100)+'%':'—')+'</td></tr>';
  }).join('');
  var reps = S.order.map(function(oi,pos){
    var ex=DATA[oi], a=S.A[oi];
    var lab, cls;
    if(a.status==='skipped'){ lab='<span class="badge skip">⤼ SKIPPED — excluded from scoring</span>'; }
    else if(a.earned>=ex._pts-0.001){ lab='<span class="badge posis">✓ FULL</span>'; }
    else if(a.earned>0){ lab='<span class="badge part">! PARTIAL</span>'; }
    else { lab='<span class="badge neg">✗ ZERO</span>'; }
    return '<div class="rep"><div class="rhead"><span class="qnum">Q'+(pos+1)+'</span><span class="rt">'+esc(ex.title)+'</span>'+lab+
      '<span class="rpts">'+(a.status==='skipped'?'—':fmt(a.earned)+' / '+fmt(ex._pts))+'</span></div>'+
      '<p class="yours"><span class="k">Your answer:</span><br>'+ansText(ex,a)+'</p>'+
      (a.status==='skipped'?'':'<p class="correct"><span class="k">Correct answer:</span><br>'+correctText(ex)+'</p>')+
      '<p><span class="k">Explanation:</span></p>'+ex.explain+'</div>';
  }).join('');
  $('app').innerHTML =
    '<div class="exhead"><h1>'+esc(EM.cert)+' — '+esc(EM.title)+' — results</h1></div>'+
    verdict+
    '<div class="statrow">'+
      '<div class="stat"><div class="v">'+fmt(earned)+' / '+total+'</div><div class="k">points (non-skipped)</div></div>'+
      '<div class="stat"><div class="v">'+pct+'%</div><div class="k">final score</div></div>'+
      '<div class="stat"><div class="v">'+um+':'+(us<10?'0':'')+us+'</div><div class="k">time used'+(auto?' (timer ended)':'')+'</div></div>'+
    '</div>'+
    skippedHtml+
    '<section class="card"><h2>Progress per theme</h2><table class="themetbl"><tr><th>Theme</th><th>Average score</th></tr>'+themeRows+'</table></section>'+
    '<section class="card"><h2>Detailed report — every exercise explained</h2>'+reps+'</section>'+
    '<div class="actions"><button id="retake" class="btn primary big">Retake exam</button><button id="again" class="btn">Back to intro</button></div>';
  $('retake').addEventListener('click', startExam);
  $('again').addEventListener('click', renderIntro);
  window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
/* ============ Site handshake (optional; exam works standalone) ============ */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.user = event.data.username || '';
  var u=$('uname'); if(u) u.textContent = S.user||'candidate';
});
/* ============ Init ============ */
renderIntro();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
