<style>

.badge.neg{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.badge.part{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.badge.skip{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}

.pstate{font-size:15px;color:var(--warn);font-weight:600;min-height:20px}
/* progress + nav */

.card{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}

.kwrow{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.kw{font-size:15px;color:var(--mut);background:#101a2d;border:1px solid var(--line2);border-radius:999px;padding:1px 10px}
.themeline{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tchip{font-size:15px;color:var(--mut);background:#101a2d;border:1px solid var(--line2);border-radius:999px;padding:2px 12px}
.tchip.tdone{background:var(--okbg);border-color:var(--good);color:var(--good)}
.ptsline{font-size:15px;color:var(--mut)}

.mark{font-weight:800;margin-right:6px;white-space:nowrap}
.mark.ok{color:var(--good)} .mark.bad{color:var(--bad)} .mark.miss{color:var(--warn)} .mark.neutral{color:var(--mut)}
.scoreline{margin-top:10px;font-weight:700}

.slotrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.slot{min-height:44px;min-width:90px;padding:6px 12px;border-radius:8px;border:2px dashed #46618f;background:#0c1424;color:var(--ink);font-size:15px;cursor:pointer}

.slot.ok{background:var(--okbg);border-color:var(--good)}
.slot.bad{background:var(--badbg);border-color:var(--bad)}
.slot.miss{background:var(--warnbg);border-color:var(--warn)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#16233b;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.chip.sel{outline:3px solid #8fc5ff;background:#1d2d4b}
.chip.used{opacity:.35;text-decoration:line-through;cursor:default}
/* match zones */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.zone{border:2px dashed #46618f;border-radius:10px;padding:10px;min-height:88px;background:#0c1424}
.zone h3{font-size:15px;color:var(--acc);margin-bottom:8px}
.zone.ok{border-color:var(--good);background:var(--okbg)}
.zone.bad{border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px;padding:10px;border:1px solid var(--line2);border-radius:10px;background:#0c1424}
.mitem{min-height:44px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#16233b;color:var(--ink);font-size:15px;cursor:grab}
.mitem.sel{outline:3px solid #8fc5ff}
.mitem.ok{background:var(--okbg);border-color:var(--good)}
.mitem.bad{background:var(--badbg);border-color:var(--bad)}
.mitem.miss{background:var(--warnbg);border-color:var(--warn)}

.oitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#111d33;padding:6px 8px}

.oitem.bad{background:var(--badbg);border-color:var(--bad)}
.oitem .ot{flex:1;font-size:15px}
.oitem .onum{font-family:var(--mono);font-weight:700;color:var(--acc);width:26px;text-align:center}
.arr{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#16233b;color:var(--ink);font-size:18px;cursor:pointer;padding:0}

/* log viewer */
.logview{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.logfilter{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.logfilter label{font-size:15px;color:var(--mut);white-space:nowrap}
.logfilter input{flex:1;min-height:44px;background:#0a111f;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:14px;padding:8px 12px}
.logrows{max-height:340px;overflow:auto;font-family:var(--mono);font-size:14px}
.lrow{padding:4px 8px;border-radius:5px;white-space:pre-wrap;word-break:break-word;color:#c9d7ea}
.lrow:nth-child(odd){background:rgba(255,255,255,.03)}
.lrow.clickable{cursor:pointer;border:1px solid transparent;min-height:44px;padding:10px 8px}

.lrow.sel{border-color:var(--acc);background:#122541}

.lrow.bad{background:var(--badbg);border-color:var(--bad)}

.tok-s{color:var(--teal)}

.termout .err{color:var(--bad)}
.termout .okl{color:var(--good)}

.terminrow .pr{font-family:var(--mono);color:var(--good);font-weight:700}
.terminrow input{flex:1;min-height:44px;background:#0a111f;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:14px;padding:8px 12px}

.cline.sel{border-color:var(--acc);background:#122541}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}

.hintbox{margin-top:10px;padding:10px 12px;border:1px dashed var(--warn);border-radius:8px;background:var(--warnbg);color:var(--ink);font-size:15px}
.pausecover{position:relative}
.pauseoverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,13,24,.86);backdrop-filter:blur(6px);border-radius:12px;z-index:5;text-align:center;padding:20px;font-size:18px;font-weight:700}
/* intro */
.hero{background:linear-gradient(160deg,#12203a,#0d1626);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.badgerow{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.rules li{margin-bottom:9px}
.kwpanel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kwtheme{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:#0e1728}
.kwtheme h3{color:var(--teal);font-size:15px;margin-bottom:6px}
.kwtheme .kws{display:flex;flex-wrap:wrap;gap:6px}
.kwtheme .kw{font-size:15px}
/* results */
.verdict{border:3px double var(--good);border-radius:14px;padding:22px;text-align:center;background:#0f1e18}
.verdict.fail{border-color:var(--bad);background:#1f1113}
.verdict .big{font-size:34px;font-weight:900;letter-spacing:2px;margin:8px 0}
.verdict .seal{font-size:44px}
.statrow{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.stat{flex:1;min-width:130px;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center}
.stat .v{font-size:22px;font-weight:800;font-family:var(--mono)}
.stat .k{font-size:15px;color:var(--mut)}
.rep{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--pan2)}
.rep .rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.rep .rt{font-weight:700}
.rep .rpts{margin-left:auto;font-family:var(--mono);font-weight:700}
.yours,.correct{font-size:15px;margin:4px 0}
.yours .k,.correct .k{color:var(--mut);font-weight:700;margin-right:6px}
.themetbl{width:100%;border-collapse:collapse;margin-top:6px}
.themetbl td,.themetbl th{border:1px solid var(--line2);padding:7px 10px;text-align:left;font-size:15px}
.themetbl th{color:var(--mut);background:#0e1728}
.skipnote{color:var(--warn);font-size:15px}
@media (max-width:760px){
  .navgrid{grid-template-columns:repeat(10,1fr)}
  .kwpanel{grid-template-columns:1fr}
  .topbar{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

 "explain":"<p>The log supports exactly three statements. <b>1)</b> The command line shows <code>git push --force</code>, and the first remote line says force pushes are blocked on protected main — the push never even got to the content check. <b>2)</b> The final hint line says the remote contains work Marco lacks: his local main has diverged, so the correct move is <code>git fetch</code> and then rebase (or merge) onto the real remote state before pushing again. <b>3)</b> The required status check <code>ci/build</code> is expected on every change to main — his commits have not run it, so even a non-force push would wait for green CI or be declined. <b>The distractors are all plausible but absent:</b> no signature or expiry is mentioned, no LFS quota error appears, and a read-only key produces a permission-denied message, not a protected-branch hook decline. Focus: a rejection message lists its reasons — resist adding reasons that feel true but are not in the output.</p>"
},
{
 "id":"H02","type":"terminal","title":"The header that vanished","kw":[10,11],
 "scen":"A security scan flags that <b>shopfront</b> no longer sends the <code>X-Frame-Options</code> header. The header used to be set in <code>config/nginx.conf</code>. The repository is the same <b>shopfront</b> repo you know: the header was removed by some commit, and main is heavily shared. A git simulator is wired to this exercise.",
 "q":"Complete <b>both goals</b> in the shell below, then press Check.<br><b>Goal 1 —</b> find the commit that dropped the header from <code>config/nginx.conf</code> and print the exact change it made.<br><b>Goal 2 —</b> put the header back on <code>main</code> in a way that never rewrites shared history.<br>No command names are given: choose your tool, choose your flags.",
 "goals":[

   "out":["b7e4f01 2026-09-14  Ed K.  refactor: tidy response headers","    config/nginx.conf","-     add_header X-Frame-Options \"SAMEORIGIN\" always;","(1 file changed, 1 deletion)"]},

   "eg":"git revert b7e4f01",

 ],
 "hint":"Git can search every commit's patch for a string that appeared or disappeared (the 'pickaxe' flags take a search string). To undo on a shared branch, add a new commit that inverts the old one.",
 "explain":"<p><b>Goal 1:</b> the header disappeared, so you need commits where that string was <i>removed</i>. The pickaxe search — <code>git log -S 'X-Frame-Options'</code> — lists exactly the commits where the count of that string changed, and <code>git log -p</code> (optionally with <code>-- config/nginx.conf</code>) prints the patches. <code>git log -G</code> accepts a regex instead of a plain string and works too. <code>git blame</code> alone would not have found it: blame shows the <i>current</i> last-toucher of each line, and the line is gone. <b>Goal 2:</b> on a shared branch the only safe undo is <code>git revert</code> — it creates a new commit that inverts the bad one, so nobody's clone breaks and the audit trail shows the fix. Resetting main or force-pushing would rewrite shared history. Focus: pickaxe finds the disappearing-string commit; revert repairs shared branches.</p>"

 ],
 "hint":"Branch from what production actually runs. The step teams forget is feeding the fix back into the development line.",
 "explain":"<p><b>1)</b> The hotfix branches from <code>v1.4.0</code> because that is what production runs — branching from <code>develop</code> would ship 300 unfinished commits to customers. <b>2)</b> The fix lands as a normal reviewed commit on the hotfix branch. <b>3)</b> Version bump to 1.4.1 (a patch: bug fix only, no new features — semantic versioning) plus the changelog entry document the release before it exists. <b>4)</b> The pull request into main keeps review intact even under pressure; the <code>v1.4.1</code> tag marks the exact commit customers run. <b>5)</b> The artifact is built from the tag, so the deployed bytes are traceable. <b>6)</b> The classic Git Flow step everyone forgets: merge the hotfix into <code>develop</code> — otherwise 1.5 ships the bug all over again. <b>7)</b> Delete the branch; main and develop both carry the fix now. Focus: branch from production, tag the release, feed the fix back.</p>"
},
{
 "id":"H04","type":"qcm","title":"The rebased shared branch","kw":[8,15,19],
 "scen":"You pulled <code>feature/search</code> yesterday and added two commits today. Overnight a teammate rebased <code>feature/search</code> onto main and force-pushed it. Your <code>git push</code> is now rejected as non-fast-forward, and half of your local commits duplicate the rewritten remote ones.",
 "q":"What is the correct recovery?",
 "ch":[
  {"t":"Rebase your local commits onto the rewritten remote branch, then push","ok":true},
  {"t":"Force-push your local branch to restore your version of the history","ok":false},
  {"t":"Merge the remote branch into yours and resolve the duplicated commits","ok":false},
  {"t":"Delete your local branch and re-clone the repository","ok":false}
 ],
 "hint":"The remote history was rewritten once already. Which option avoids a second rewrite and drops the duplicates?",
 "explain":"<p><b>Correct:</b> fetch, then <code>git rebase origin/feature/search</code> — Git replays your two local commits on top of the rewritten branch; the duplicated pre-rebase versions are recognised and dropped, and a normal push lands everything. <b>Why not the others:</b> force-pushing your copy would erase the teammate's rebase and start the disaster again — two rewritten histories, two angry developers. Merging 'works' but keeps <i>both</i> copies of every duplicated commit in history forever — it looks fixed and quietly pollutes the branch. Re-cloning is destructive overkill that throws away your unpushed local work (the reflog could have rescued it anyway). Focus: after someone rewrites a shared branch, you rebase onto the new history — you do not fight it with a second rewrite.</p>"
},
{
 "id":"H05","type":"spot","title":"Where the drift comes from","kw":[41,44,40,32,49],
 "scen":"Terraform manages Nordwind Labs' cloud network. Every plan shows random diffs of resources nobody touched, and twice this month a apply from one engineer reverted another engineer's change. You review the pipeline definition.",
 "q":"Click the <b>two lines</b> that explain both symptoms.",
 "file":".gitlab-ci.yml — terraform stages (excerpt)",
 "code":[
  "# terraform pipeline (excerpt)",
  "terraform_init:",
  "  script:",
  "    - terraform init -backend-config=\"path=./terraform.tfstate\"",
  "terraform_plan:",
  "  script:",
  "    - terraform plan -out=plan.bin",
  "terraform_apply:",
  "  script:",
  "    - terraform apply plan.bin",
  "  when: manual",
  "# applies are usually run from the lead's laptop instead"
 ],
 "bad":[3,10],
 "hint":"One line is about where the state lives. One line is about where applies actually happen.",
 "explain":"<p><b>Line 4</b> points the backend at a local file (<code>path=./terraform.tfstate</code>): the state — Terraform's map of what really exists — lives on whatever machine ran init, with no locking and no sharing. Every engineer and every runner sees a different world, which is exactly why plans show ghost diffs and one apply can stomp another. The state belongs in a remote backend with locking. <b>Line 11 (the comment line)</b> admits applies usually run from the lead's laptop: out-of-band applies bypass review, CI and the pipeline record, and they are the second source of <b>drift</b> — live infrastructure diverging from what the repository declares. The fix: remote state backend, applies only from the pipeline, and a scheduled drift-detection job. <code>when: manual</code> itself is fine — a human gate is good practice. Focus: shared locked state + pipeline-only applies = no drift.</p>"
},
{
 "id":"H06","type":"multi","title":"After the force push","kw":[14,15,61,27],
 "scen":"Friday 18:02: contractor Ed ran <code>git push --force origin main</code>. Twelve commits vanished; the audit trail shows branch protection had been disabled an hour earlier ('temporarily, for a migration'). It is Monday 09:00 and you lead the recovery. Several developers fetched main before the rewrite.",
 "q":"Select <b>every action</b> that belongs in the recovery plan.",
 "ch":[
  {"t":"Announce a push freeze on main until the recovery is done","ok":true},
  {"t":"Recover the lost commits from the reflog of any clone that fetched before the rewrite","ok":true},
  {"t":"Rebuild main from the recovered commits and confirm CI is green before unfreezing","ok":true},
  {"t":"Restore branch protection and investigate who disabled it, using the audit trail","ok":true},
  {"t":"Have each developer force-push their local copy in turn until history looks right","ok":false},
  {"t":"Delete all local clones and re-clone the rewritten main — that is now the only truth","ok":false},
  {"t":"Ask the hosting vendor for a restore; that is the only possible recovery path","ok":false}
 ],
 "hint":"Two facts matter: commits existed on clones fetched before the rewrite, and a protection gap made it possible. The reflog is local.",
 "explain":"<p><b>Freeze first</b> — every new push onto broken main makes recovery messier. <b>Reflog recovers the commits:</b> any clone that fetched main before 18:02 still holds the old commits (reachable through its <code>reflog</code> and <code>origin/main</code> ref); from there a branch is rebuilt and main restored. <b>Verify CI green</b> before unfreezing so main is trustworthy again. <b>Close the gap:</b> protection comes back on, and the audit trail answers who disabled it and why a contractor could — that is the control failure to fix. <b>The distractors:</b> serial force-pushes from personal copies would rewrite history a second time and settle nothing; wiping clones destroys the very refs that hold the lost commits (a fresh clone only knows the rewritten history); and a vendor restore is slow and unnecessary when the commits sit in local reflogs. Focus: the commits are not gone — they are merely unreachable from the new main.</p>"
},
{
 "id":"H07","type":"decision","title":"GitOps fights back","kw":[42,46,44,43,60,11],
 "scen":"<b>shopfront-prod</b> runs GitOps: the Argo CD application auto-syncs the cluster to the repository and prunes anything not declared there. Yesterday a PR doubled the API replicas from 2 to 4. This morning the database could not take the load, so an engineer ran <code>kubectl scale</code> back to 2 at the console. Argo CD now shows the application <b>OutOfSync</b> and is scaling it back to 4 — the outage pattern is repeating.",
 "q":"Choose the right move at each step.",
 "steps":[
  {"q":"What stops the loop right now, the correct way?","ch":[
   {"t":"Revert the commit in Git that raised the replica count — the operator then scales back to 2 and stays there","ok":true,"o":"Fixing Git fixes the world: the operator reconciles the cluster to the corrected declared state and the loop ends with an honest history."},
   {"t":"Run kubectl scale to 2 again, but this time faster","ok":false,"o":"The operator will reconcile straight back to 4 — you cannot out-type a controller."},
   {"t":"Suspend auto-sync, fix the count at the console, and remember to fix Git later","ok":false,"o":"It stops the fight but leaves Git lying about production; 'later' becomes drift with a stale source of truth."}]},
  {"q":"Why did the console change refuse to stick?","ch":[
   {"t":"The operator continuously reconciles: Git is the single source of truth, and pruning removed the manual change","ok":true,"o":"Reconcile means 'make reality match the repository' — a manual edit is exactly the difference it exists to erase."},
   {"t":"The cluster ran out of CPU and refused the change","ok":false,"o":"Nothing in the story points at capacity; the symptom is the change being undone, not failing."},
   {"t":"The webhook that triggers syncs was misconfigured","ok":false,"o":"The sync clearly runs — it is actively restoring the declared state."}]},
  {"q":"Which change prevents the whole class of problem?","ch":[
   {"t":"Make the cluster read-only for humans (RBAC): all changes via pull request; alert on drift","ok":true,"o":"If nobody can edit live state, every change is reviewed, recorded in Git, and revertible."},
   {"t":"Turn off auto-sync permanently so console edits survive","ok":false,"o":"That abandons GitOps — the cluster drifts silently and Git stops being true."},
   {"t":"Increase the sync interval to one hour","ok":false,"o":"The loop still exists, just slower — and the console edit still silently reverts."}]}
 ],
 "hint":"The operator's job is to make the cluster match Git. So: fix Git, understand reconcile, then remove humans' write access.",
 "explain":"<p><b>Step 1:</b> in GitOps the repository is the source of truth, so the fix belongs there — reverting the replica-count commit makes the declared state correct, and the operator does the rest. <b>Step 2:</b> <i>reconcile</i> is continuous: the operator compares live state to Git and prunes anything undeclared — a console change is by definition undeclared, so it was always going to be undone. <b>Step 3:</b> the durable fix is governance: RBAC so humans cannot write to the cluster (read-only consoles), everything through reviewed PRs, and drift alerts as the tripwire. Suspending sync or slowing it keeps the same trap with worse visibility. Focus: 'the cluster is wrong' usually means 'Git is wrong' in a GitOps world.</p>"
},
{
 "id":"H08","type":"fitb","title":"The GitOps runbook","kw":[43,46,44,11,25],
 "scen":"After the replica incident, Nordwind Labs writes its first GitOps runbook. The sentences below lost their key words.",
 "q":"Fill all five gaps from the bank.",
 "lines":[
  "1. The repository is the [[1]] of desired state — what Git says is what production must be.",
  "2. The operator continuously [[2]] the cluster toward whatever the repository declares.",
  "3. A manual console change creates [[3]] — the operator undoes it on the next sync.",
  "4. To roll back a bad deploy, [[4]] the commit in Git; never edit the live cluster.",
  "5. Every change reaches production through a [[5]] with review and green CI."
 ],
 "ans":["single source of truth","reconciles","drift","revert","pull request"],
 "bank":["tag","stash","shallow clone","force push"],
 "hint":"One phrase names the model's promise, one verb is what the operator does all day, one noun is the gap between reality and the repo, and two are the Git moves for rollback and change delivery.",
 "explain":"<p>The five slots are the GitOps vocabulary in order. <b>Single source of truth:</b> the repository — not the cluster, not a dashboard — defines what should exist. <b>Reconciles:</b> the operator's continuous loop of comparing live state to the declared state and converging the difference (Argo CD and Flux both do this). <b>Drift:</b> the divergence that appears the moment someone edits the cluster by hand — the operator treats it as an error to erase, which is the desired behaviour. <b>Revert:</b> the rollback is a Git operation; a new commit inverts the bad one and the operator rolls production forward to the corrected state — editing the cluster directly would only fight the controller. <b>Pull request:</b> the delivery vehicle that carries review, CI and audit history with every change. The distractors are real git words in the wrong story: tags mark releases, stash shelves local work, shallow clones speed up checkouts, and force pushes are banned on shared branches.</p>"
},
{
 "id":"H09","type":"qcm","title":"Why is it 'Unverified'?","kw":[30],
 "scen":"Nordwind Labs requires signed commits on <code>main</code>. Dana's pull request shows her commit with an <b>Unverified</b> badge. You inspect the details: the signature itself is valid, the commit's author email is <code>dana.t@nordwind-labs.example</code>, her account has the verified email <code>dana@nordwind-labs.example</code> with an uploaded signing key. She configured signing on her new laptop yesterday.",
 "q":"What is the most likely reason the commit shows 'Unverified'?",
 "ch":[
  {"t":"The GPG key expired yesterday","ok":false},
  {"t":"The commit was signed with an email that does not match any verified email on her account","ok":true},
  {"t":"Signed commits are only verified on protected branches","ok":false},
  {"t":"The commit was pushed over SSH instead of HTTPS","ok":false}
 ],
 "hint":"The signature is valid — so the crypto worked. Verification is the platform linking signature, key and account identity.",
 "explain":"<p>Verification is a three-way match: the commit is signed by a key, the key belongs to an account, and the commit's author email matches an email <b>verified on that account</b>. Dana's git config on the new laptop uses <code>dana.t@</code>, her account verifies <code>dana@</code> — the platform cannot prove the commit is hers, so it shows 'Unverified' even though the signature is cryptographically perfect. <b>Why not the others:</b> an expired key would make the <i>signature</i> invalid, and the scenario says the signature is valid; verification is not branch-dependent; and the transport (SSH vs HTTPS) affects push authentication, never commit verification. The fix is boring and classic: set <code>git config user.email</code> to the verified address and amend or re-commit. Focus: valid signature ≠ verified identity — the email link is where it usually breaks.</p>"
},
{
 "id":"H10","type":"match","title":"Pipeline autopsy","kw":[60,62,37,32,40,33,51],
 "scen":"One Monday, seven different pipelines across Nordwind Labs fail. The on-call queue gives you the seven symptom lines below. Sort them by cause — fast triage, correct buckets.",
 "q":"Match each symptom line to its true cause.",
 "zones":[
  {"id":"z1","l":"The CI token lacks permission to read the repository"},
  {"id":"z2","l":"A dependency version does not exist in the registry or lockfile"},
  {"id":"z3","l":"Secret scanning blocked the push or the job"},
  {"id":"z4","l":"Syntax error inside the pipeline definition"},
  {"id":"z5","l":"Stale inventory — automation cannot reach the target host"},
  {"id":"z6","l":"The build trigger never fired — the webhook is broken"},
  {"id":"z7","l":"The branch policy never required the pipeline to run"}
 ],
 "items":[
  {"t":"fatal: could not read Username — terminal prompts disabled","z":"z1"},
  {"t":"npm ERR! 404 Not Found — @nordwind/ui-kit@2.1.0","z":"z2"},
  {"t":"push rejected: secret scanning detected a private key in deploy/id_rsa","z":"z3"},
  {"t":"yaml: line 18: did not find expected key","z":"z4"},
  {"t":"ansible-playbook: app-03 UNREACHABLE (ssh port 22: no route)","z":"z5"},
  {"t":"push accepted — but no pipeline started (last event: 6 days ago)","z":"z6"},
  {"t":"Azure Repos: the pull request completed without its build validation policy","z":"z7"}
 ],
 "hint":"Ask of each line: who is speaking (git, npm, the scanner, yaml, ssh, the platform)? The speaker names the layer that failed.",
 "explain":"<p><b>1) 'could not read Username':</b> the CI job tried to clone and had no credentials — the pipeline token lacks repository read permission (RBAC on the repo, not a network problem). <b>2) npm 404:</b> the exact package version cannot be found — a typo, an unpublished version, or a lockfile referencing a yanked release; dependency resolution failed before any code ran. <b>3) push rejected by secret scanning:</b> a private key was detected and the protection hook refused it — the system working as designed; rotate and remove. <b>4) yaml line 18:</b> the pipeline definition itself does not parse — pipeline-as-code is code, and a broken definition fails every job before they start. <b>5) ansible UNREACHABLE:</b> the inventory names a host that no longer exists or moved (stale inventory) — the playbook never ran. <b>6) accepted push, no pipeline:</b> nothing is wrong with the definition — the webhook that should notify CI never fired (check the webhook delivery log). <b>7) Azure Repos PR completed without build validation:</b> nobody configured the branch policy that requires the build — the platform was never told to gate the PR. Focus: the error's speaker tells you the failing layer.</p>"
},
{
 "id":"H11","type":"steps","title":"Security dashboard triage","kw":[37,35,26,31,29,63,3,57],
 "scen":"Your turn on the Nordwind Labs security &amp; CI dashboard. Six findings, six decisions — several of them are traps. Choose the response a senior engineer would defend in review.",
 "q":"Choose the right response for each finding.",
 "cards":[
  {"q":"<b>1.</b> Secret scanning flags <code>AWS_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE</code> inside <code>tests/fixtures.py</code>.","ch":[
   {"t":"Dismiss with a written reason: that exact value is AWS's documented example key and cannot be live","ok":true,"o":"Knowing published example values is what keeps the queue honest — documented false positives keep real findings visible."},
   {"t":"Rotate the key at the cloud provider immediately","ok":false,"o":"There is nothing to rotate: the value belongs to nobody and grants access to nothing."},
   {"t":"Delete the test file to silence the alert","ok":false,"o":"Deleting tests to silence a scanner is how real findings get buried later."}]},
  {"q":"<b>2.</b> The same commit passes the full suite on a developer's laptop and fails in CI.","ch":[
   {"t":"Diff the environments first: lockfile versions, env vars, OS, timezones — then fix the difference","ok":true,"o":"'Works on my machine' is an environment delta, and the delta is always nameable."},
   {"t":"Re-run the job until it passes","ok":false,"o":"Deterministic failures do not heal by retrying; you would burn minutes and hide the cause."},
   {"t":"Skip that test file in CI","ok":false,"o":"CI exists to catch exactly what laptops miss."}]},
  {"q":"<b>3.</b> A pull request changes 4,000 lines across 60 files and has sat unreviewed for days.","ch":[
   {"t":"Ask the author to split it into small stacked PRs — atomic commits, reviewable units","ok":true,"o":"Small PRs get real review; a 60-file diff gets a rubber stamp or silence."},
   {"t":"Approve it to unblock the author","ok":false,"o":"An approval nobody could actually read is a signature on an unknown change."},
   {"t":"Push it through the merge queue with extra retries","ok":false,"o":"The queue tests correctness of the merge, not reviewability of the change."}]},
  {"q":"<b>4.</b> The pipeline runs its 25-minute suite on every push to every branch, mostly unchanged code.","ch":[
   {"t":"Add path filters: docs-only and asset-only changes skip the heavy jobs","ok":true,"o":"Trigger on what the change touches — the classic monorepo and mono-pipeline lever."},
   {"t":"Double the runner CPUs","ok":false,"o":"Faster jobs are still 1,000 unnecessary jobs — count first, speed second."},
   {"t":"Run the pipeline only nightly","ok":false,"o":"Feedback collapses; broken commits land all day and surface at night."}]},
  {"q":"<b>5.</b> The merge queue keeps failing two PRs that are each green on their own branches.","ch":[
   {"t":"That is the queue working: it re-tests them as a combined future main — resolve the interaction and re-queue","ok":true,"o":"Two individually-green changes can still break each other; batching is how the queue proves 'green together'."},
   {"t":"Bypass the queue for both PRs","ok":false,"o":"Bypassing is how a red main happens in the first place."},
   {"t":"Close both PRs and reopen next sprint","ok":false,"o":"Nothing is wrong with the changes — they just need to be reconciled with each other."}]},
  {"q":"<b>6.</b> Compliance asks for the third-party component inventory of the released artifact 2.2.0.","ch":[
   {"t":"Publish the SBOM generated by the pipeline during the build","ok":true,"o":"The SBOM is the machine-readable inventory, generated from the exact artifact that shipped."},
   {"t":"Grep the imports and email the resulting list","ok":false,"o":"A hand-built list is stale on arrival and unverified against the artifact."},
   {"t":"Point compliance at the vendored source folder","ok":false,"o":"They asked for an inventory of the release, not a code tour."}]}
 ],
 "hint":"Traps: the AWS example key, 'works on my machine', the 4,000-line PR, and the two-green-PR queue. Know which findings are working as designed.",
 "explain":"<p><b>1)</b> <code>AKIAIOSFODNN7EXAMPLE</code> is AWS's published example key — a documented false positive; dismiss it with the reason in writing so the audit trail stays clean. <b>2)</b> Laptop-green/CI-red is an environment delta: compare lockfiles, versions, env vars — fix the delta, never retry blindly. <b>3)</b> Review quality collapses past a few hundred lines: split into stacked, atomic PRs. <b>4)</b> Path filters remove the work you should never do; faster runners only do unnecessary work faster. <b>5)</b> The merge queue tests PRs <i>as a batch</i> — two green PRs can conflict when combined; the queue catching that is its entire purpose. <b>6)</b> An SBOM is generated at build time from the shipped artifact — that is what auditors want, not a grepped list. Focus: first ask 'is the system working as designed?' — half of dashboard noise is controls succeeding.</p>"
},
{
 "id":"H12","type":"qcm","title":"Backport to the LTS","kw":[13,24,56],
 "scen":"CVE-2026-3187 was fixed on <code>main</code> in commit <code>9c2d1ef</code> (one commit, one file, tests included). Customers run <code>release/2.2</code>, the LTS branch, which is 700 commits behind main. They need the fix now, and nothing else.",
 "q":"What is the cleanest way to deliver the fix to release/2.2?",
 "ch":[
  {"t":"Merge main into release/2.2","ok":false},
  {"t":"Rebase release/2.2 onto main","ok":false},
  {"t":"Cherry-pick commit 9c2d1ef onto release/2.2 and cut a patch release","ok":true},
  {"t":"Wait for the next major release that customers upgrade to","ok":false}
 ],
 "hint":"One commit must travel; 699 others must not.",
 "explain":"<p><b>Correct: cherry-pick.</b> It copies exactly commit <code>9c2d1ef</code> onto <code>release/2.2</code> as a new commit — the surgical backport, followed by a patch release of the LTS branch. Customers get the CVE fix and nothing else. <b>Why not the others:</b> merging main drags 699 unrelated commits — features, refactors, migrations — into a stable branch that exists precisely to not change. Rebasing release/2.2 onto main rewrites the LTS history wholesale: it stops being 2.2 and becomes 'main with an old name', breaking every customer expectation the LTS made. Waiting for the next major ignores the entire point of long-term support: customers on 2.2 cannot upgrade on your schedule. Focus: cherry-pick is the vehicle of every backport; the LTS branch only ever receives reviewed, targeted commits.</p>"
},
{
 "id":"H13","type":"spot","title":"The hook that never blocks","kw":[34,2],
 "scen":"Nordwind Labs installed a pre-commit hook to stop secrets from being committed. Last week a secret was committed anyway — on a machine where the hook was installed and running. You review the hook.",
 "q":"Click the <b>two lines</b> that make the hook useless.",
 "file":".git/hooks/pre-commit",
 "code":[
  "#!/bin/sh",
  "# block secrets from being committed",
  "FILES=$(git diff --name-only)",
  "echo \"scanning: $FILES\"",
  "if grep -rE \"(SECRET|PASSWORD)\" $FILES; then",
  "  echo \"secret found - commit blocked\"",
  "fi",
  "exit 0"
 ],
 "bad":[2,7],
 "hint":"Which files does a pre-commit hook actually need to inspect? And what must a hook exit with to block a commit?",
 "explain":"<p><b>Line 3:</b> <code>git diff --name-only</code> lists <i>unstaged</i> changes — but a pre-commit hook runs when you are committing the <b>staged</b> content. The hook must scan <code>git diff --cached --name-only</code> (or the staged blobs themselves); as written it scans the wrong files and routinely misses whatever is actually about to be committed. <b>Line 8:</b> <code>exit 0</code> runs unconditionally — the hook announces 'secret found - commit blocked' and then approves the commit anyway, because a pre-commit hook blocks only by exiting non-zero. The result is worse than no hook: it manufactures false confidence while blocking nothing. The fix: scan staged files, and <code>exit 1</code> on a finding (or use a maintained scanning tool). Focus: hooks gate through their exit code, and 'what will be committed' always means the staged set.</p>"
},
{
 "id":"H14","type":"logview","title":"Read the graph","kw":[10,6,31],
 "file":"git log --graph --oneline --decorate — branch main",
 "scen":"CI on <code>main</code> went red immediately after the <code>v2.3.0</code> tag was cut. You are staring at the history graph below.",
 "q":"Click the commit that <b>most likely introduced</b> the regression.",
 "log":[
  "* a9f1e22 (tag: v2.3.0, origin/main) fix: bump checkout retry to 3",
  "*   88aa731 Merge branch 'feature/checkout-v2'",
  "|\\",
  "| * c3d4e5f feat: new checkout flow (rebuilds pricing calls)",
  "| * b2c3d4e feat: checkout v2 skeleton",
  "* | 7d6e5f1 docs: update deploy runbook",
  "|/",
  "* 5512acd Merge branch 'feature/search'",
  "* 44f0c99 fix: search timeout handling"
 ],
 "ans":{"kind":"spot","bad":[3]},
 "hint":"The merge itself moves no logic — it transports commits. Find which commit wrote the risky change.",
 "explain":"<p><b>c3d4e5f 'feat: new checkout flow (rebuilds pricing calls)'</b> is the answer: it is the commit that actually <i>authored</i> the new checkout behaviour, and the regression appeared the moment that behaviour reached main. The merge commit <code>88aa731</code> is the tempting wrong answer — a merge transports changes, it does not write them, and blaming merges hides the real author (though it does tell you <i>which batch</i> of commits to suspect). <code>a9f1e22</code> came after and is the fix attempt; <code>7d6e5f1</code> is documentation; the older search merges predate the regression. Reading the graph is a daily skill: first bisect the suspect range, then blame the feature commit, not its vehicle. The next step would be <code>git show c3d4e5f</code> to read the change and <code>git revert 88aa731</code> (or revert c3d4e5f) to undo it safely.</p>"
},
{
 "id":"H15","type":"order","title":"Org-wide leak, six moves","kw":[58,61,59,15,38,34,57],
 "scen":"Sunday 21:14. A public code search shows the Nordwind Labs <b>deployment service-account key</b> inside a public mirror of an internal repository. The key has had access to three cloud accounts for eight months. You run incident command. Six moves, in order.",
 "q":"Put the six response steps into the correct order.",
 "steps":[
  "Disable the leaked service-account key at the cloud provider immediately",
  "Query the provider's audit logs for every use of that key during the exposure window",
  "Replace the key with a vault-managed credential in every service that used it",
  "Purge the credential from repository history and coordinate the history rewrite with every team",
  "Turn on secret scanning with push protection across the whole organisation",
  "Add pre-commit secret scanning for developers and record the whole playbook in the runbook"
 ],
 "hint":"Stop the bleeding, then measure the damage, then replace, then clean, then prevent — org-wide first, laptop-level second.",
 "explain":"<p><b>1) Disable the key</b> — eight months of exposure means assume abuse; nothing else matters until the credential is dead. <b>2) Audit logs</b> tell you whether the exposure was theoretical or an actual intrusion: every API call made with that key, from where, doing what — this determines whether you are rotating a key or declaring a security breach. <b>3) Vault-managed replacement</b> fixes the root cause: credentials that live in a secret manager are never typed into files, so the same leak cannot recur with the new key. <b>4) History purge</b> — coordinated, because rewriting shared history invalidates every clone at once; the key leaves the repository only when the old commits do. <b>5) Push protection org-wide</b> blocks the next secret at upload time, on every repository, before any human review could catch it. <b>6) Pre-commit scanning</b> moves the block even earlier — to the developer's machine — and the runbook entry turns this incident into the next team's checklist. Focus: containment → scoping → remediation → cleanup → prevention, in that order, every time.</p>"
},
{
 "id":"H16","type":"multi","title":"Trunk-based non-negotiables","kw":[20,21,28,29,35,26,22],
 "scen":"Nordwind Labs is moving its 8-team platform group to trunk-based development after years of quarterly release branches. You draft the non-negotiables. A wrong list here means a broken main within a week.",
 "q":"Select <b>every practice</b> that belongs on the list.",
 "ch":[
  {"t":"Branches live for hours or days, never weeks","ok":true},
  {"t":"Unfinished features hide behind feature flags in production","ok":true},
  {"t":"A merge queue plus fast, trustworthy automated tests guard main","ok":true},
  {"t":"Small pull requests, reviewed and merged at least daily","ok":true},
  {"t":"Squash merges keep main's history linear and easy to revert","ok":true},
  {"t":"Long-lived release branches cut weekly from develop","ok":false},
  {"t":"A two-week code freeze before every quarterly release","ok":false},
  {"t":"Manual QA sign-off required on every single deploy","ok":false}
 ],
 "hint":"Trunk-based development trades big-bang integration for constant integration. Every correct item removes a delay; every wrong item adds one back.",
 "explain":"<p><b>All five correct items</b> are what keeps trunk-based development from breaking main: <b>short-lived branches</b> mean nobody's work rots away from main for weeks; <b>feature flags</b> ship incomplete code safely — the code is merged, the feature is dark until enabled; a <b>merge queue with fast tests</b> proves each change is green against the true next state of main, not just against its own branch; <b>small daily PRs</b> keep reviews real and conflicts trivial; and <b>squash merges</b> give main one clean, revertable commit per change. <b>The distractors re-import the old world:</b> weekly release branches and develop lines are Git Flow's machinery — its value, and its overhead, not trunk-based's; a code freeze is the opposite of 'always releasable'; and a manual QA gate per deploy destroys the deployment cadence that flags and automation exist to enable (GitHub Flow's deploy-preview rhythm shows review and automation can carry continuous delivery without it). Focus: every day--scale delay you add back is a step back to big-bang integration.</p>"
},
{
 "id":"H17","type":"decision","title":"The plan that destroys","kw":[41,44,40,27,31],
 "scen":"PR #447, 'rename db module', is green in CI. Before approving, you open the pipeline's terraform plan output and read:<pre class=\"mono\" style=\"white-space:pre-wrap;background:#080d18;border:1px solid #2a3d5e;border-radius:8px;padding:10px;margin:8px 0\">  # aws_db_instance.orders will be destroyed\n- resource \"aws_db_instance\" \"orders\" {}\n+ resource \"aws_db_instance\" \"orders_db\" {}\n\nPlan: 1 to add, 0 to change, 1 to destroy.</pre>The branch protection requires CI green — which it is. The apply stage runs automatically after merge.",
 "q":"Choose the right move at each step.",
 "steps":[
  {"q":"Approve and merge?","ch":[
   {"t":"Block the merge: the plan destroys the production orders database","ok":true,"o":"Green tests test code, not infrastructure intent. A destroy line in the plan is a stop sign regardless of CI."},
   {"t":"Approve: CI is green and the plan is routine noise","ok":false,"o":"'1 to destroy' on a production database is never noise."},
   {"t":"Merge but disable the apply stage for now","ok":false,"o":"The destroy plan stays armed and will run with the next merge that nobody is watching."}]},
  {"q":"Why does Terraform want to destroy the database?","ch":[
   {"t":"The resource address changed in code, and state still maps the old address — Terraform sees 'destroy old, create new'","ok":true,"o":"Terraform tracks resources by address; rename the address without moving the state and it plans exactly this."},
   {"t":"The database failed a health check","ok":false,"o":"Terraform plans from code and state — not from health probes."},
   {"t":"Terraform reorders resources on every rename for safety","ok":false,"o":"Nothing about Terraform requires destruction here; it is a state-address mismatch."}]},
  {"q":"Which guard rails belong in the pipeline after this?","ch":[
   {"t":"Remote state backend with locking, plus a required manual approval on any plan containing a destroy","ok":true,"o":"Shared locked state prevents the mismatch class; an approval gate puts a human between '1 to destroy' and production."},
   {"t":"Delete the old state file so plans come out clean","ok":false,"o":"Destroying state orphans every resource — the next plan would try to create everything again."},
   {"t":"Run applies only from laptops where someone can watch","ok":false,"o":"That is the drift recipe you are supposed to be removing."}]}
 ],
 "hint":"CI green ≠ infrastructure safe. Read the plan's verbs: destroy, add, change — and remember how Terraform identifies a resource.",
 "explain":"<p><b>Step 1:</b> CI validates code; the plan declares infrastructure intent — '1 to destroy' against a production database overrides every green checkmark. Blocking the merge is the whole job. <b>Step 2:</b> Terraform identifies resources by their <b>address</b> in code, mapped through the <b>state</b> file. Renaming <code>aws_db_instance.orders</code> to <code>orders_db</code> changes the address without moving the state entry, so Terraform sees a resource disappear (destroy) and a new one appear (add). The fix is <code>terraform state mv</code> or configuring the rename properly — not a shrug. <b>Step 3:</b> remote state with locking stops two runners from planning against different worlds, and a mandatory human approval on any destroy-bearing plan is the seatbelt that survives the next tired reviewer. Focus: plan verbs are the contract — 'destroy' demands a human decision.</p>"
},
{
 "id":"H18","type":"fitb","title":"Write the incident report","kw":[15,14,27,11],
 "scen":"The force-push recovery is done. Your report draft needs its technical words back before the review meeting.",
 "q":"Fill all five gaps from the bank.",
 "lines":[
  "At 18:02 a contractor ran [[1]] on main, rewriting shared history.",
  "Twelve commits disappeared from origin/main at that moment.",
  "Recovery: we located the lost commits in a teammate's [[2]] and rebuilt main from them.",
  "Protection is re-enabled: direct pushes, [[3]] and branch deletion are blocked for everyone.",
  "The bad change itself was removed with a [[4]] commit, so history stays honest.",
  "A blameless [[5]] is scheduled; the audit trail export is attached."
 ],
 "ans":["force push","reflog","history rewrites","revert","postmortem"],
 "bank":["cherry-pick","stash","tag","shallow clone"],
 "hint":"One command caused it; one local journal rescued it; one class of push is now banned; one forward-moving commit removed the bad change; one meeting prevents the next one.",
 "explain":"<p>The report tells the story with precise words because each word names a control. <b>Force push</b> is what happened — a history rewrite on a shared branch, not a normal push. <b>Reflog</b> is what saved the day: the local journal of where HEAD has been, kept on any clone that fetched before the rewrite, from which the 'lost' commits were read back out. <b>History rewrites</b> are now blocked by branch protection, alongside direct pushes and deletion — closing the exact gap that made the incident possible. <b>Revert</b> is how the offending change was finally removed: a forward commit that inverts it, visible to everyone, no rewrite needed. And the blameless <b>postmortem</b> — with the audit trail attached — targets the process (who could disable protection?) rather than a person. The distractors are git words that do not belong in this narrative: cherry-pick copies single commits, stash shelves local work, tags mark releases, shallow clones just speed up checkouts.</p>"
},
{
 "id":"H19","type":"qcm","title":"Monorepo, monolithic CI","kw":[47,31,33],
 "scen":"A 400-developer monorepo holds 60 services. Every commit triggers a full build and test of all 60 services: two hours per run, thousands of runs per day. Developers stack changes blindly because feedback arrives after lunch.",
 "q":"What is the best <b>first</b> fix?",
 "ch":[
  {"t":"Path-filtered triggers: build and test only the services a commit's paths actually touch","ok":true},
  {"t":"Split the monorepo into 40 repositories immediately","ok":false},
  {"t":"Buy faster runners so the full build finishes quicker","ok":false},
  {"t":"Run the full suite only once per night","ok":false}
 ],
 "hint":"Most commits touch a handful of services. What does the trigger know that the build does not use?",
 "explain":"<p><b>Correct: path filters.</b> The trigger already knows which files changed; a monorepo pipeline that ignores that fact builds everything. Filtering jobs by affected paths gives most commits a pipeline of minutes instead of hours, keeps main protected, and changes nothing about the repository layout — it is a configuration win available this week. <b>Why not the others:</b> splitting into polyrepos is a months-long migration of ownership, tooling and CI — a strategic option, not a first fix, and it trades shared-tooling benefits for coordination costs. Faster runners still build all 60 services for a one-line docs change: you pay to do unnecessary work quicker. Nightly runs destroy the fast-feedback loop that makes CI valuable — broken commits would land all day and surface overnight. Focus: first make the pipeline proportional to the change, then consider the architecture.</p>"
},
{
 "id":"H20","type":"steps","title":"The public .env, six months later","kw":[57,58,17,64,1],
 "scen":"A security researcher emails Nordwind Labs: the public mirror of <code>bluepine-web</code> contained a <code>.env</code> file with a live payment-provider key. The team deleted the file three months ago and added <code>.env</code> to <code>.gitignore</code>. The key was never rotated. Two cards: one attacker view, one defender view.",
 "q":"Answer both cards.",
 "cards":[
  {"q":"<b>Attacker view:</b> where can that key still be found today?","ch":[
   {"t":"In the repository's commit history — the delete commit removed the file from the tip, not from the old commits","ok":true,"o":"Git history is append-only: every version ever committed stays reachable until the history itself is rewritten."},
   {"t":"Nowhere: deleting the file removes it from the repository entirely","ok":false,"o":"A delete commit only changes the current tree; parents still contain the file."},
   {"t":"Only inside CI runner caches, which expire weekly","ok":false,"o":"The durable copy is the public history — no cache required."}]},
  {"q":"<b>Defender view:</b> the file is deleted and .gitignore lists .env. What is still mandatory?","ch":[
   {"t":"Rotate the exposed key and purge the history — .gitignore only stops future staging, and the old commits are still public","ok":true,"o":"The credential was public: rotation makes it worthless, history cleanup removes the copies, and forks keep theirs anyway — hence rotation is non-negotiable."},
   {"t":"Nothing further — .gitignore prevents the file from being committed again","ok":false,"o":"It prevents future staging; it neither rotates the key nor touches the six months of commits already public."},
   {"t":"Make the repository private so attackers lose access to the old commits","ok":false,"o":"The key was already public for months, and forks and clones persist independently of visibility."}]}
 ],
 "hint":"Deleting a file is one commit among many. .gitignore speaks only to the future. What did the public already see?",
 "explain":"<p><b>Attacker view:</b> the key lives in every historical commit that touched <code>.env</code> — reachable with one <code>git log</code> on any clone, months after the 'delete'. Automated scrapers archive public repos continuously; assume the key was captured the day it landed. <b>Defender view:</b> the two steps taken (delete, ignore) are both <i>future-facing</i> and neither touches the exposure. The mandatory pair is: <b>rotate</b> the key at the provider (making every existing copy worthless — this is the only step with a hard time limit) and <b>purge the history</b> (or retire the repository), coordinated like any shared-history rewrite. Visibility flips and .gitignore entries are hygiene, not remediation — and public repos get <b>forked</b>, so copies exist that you cannot delete; that asymmetry is exactly why rotation outranks cleanup. Focus: 'we deleted it' treats the symptom commit; rotation treats the credential.</p>"
},
{
 "id":"H21","type":"order","title":"Rebase a diverged branch, properly","kw":[9,4,8,7,15],
 "scen":"Your <code>feature/rate-limit</code> branch is 4 commits ahead of where main was when you branched. Meanwhile main moved 11 commits forward. You want your branch rebased onto fresh main and pushed — without trampling anyone.",
 "q":"Put the five steps in order.",
 "steps":[
  "git fetch origin — see the true remote state without touching your work",
  "git switch feature/rate-limit — stand on the branch you are about to rewind",
  "git rebase origin/main — replay your 4 commits onto the freshest main",
  "Resolve each conflict, git add the file, then git rebase --continue until done",
  "git push --force-with-lease — update the remote branch; the lease refuses if someone pushed meanwhile"
 ],
 "hint":"Look before you move, stand on the right branch, replay, resolve, and push with the safe variant of force.",
 "explain":"<p><b>1) fetch</b> first: it updates your view of origin without merging anything — you rebase onto reality, not a stale memory. <b>2) switch</b> onto the branch being rebased: rebase moves <i>your current branch's</i> commits. <b>3) rebase origin/main</b> replays your 4 commits one by one onto the new main — each becomes a fresh commit with a new hash. <b>4) conflicts</b> are resolved per replayed commit: edit, <code>git add</code>, <code>git rebase --continue</code>; aborting with <code>--abort</code> is always available. <b>5) --force-with-lease</b> is the safe force push: it succeeds only if the remote branch is still where your last fetch saw it — if a teammate pushed in the meantime, the lease fails and you re-fetch instead of erasing their work. Plain <code>--force</code> would trample blindly. Focus: fetch → switch → rebase → resolve → force-with-lease is the full, safe loop.</p>"
},
{
 "id":"H22","type":"qcm","title":"Undo a local commit","kw":[11,4],
 "scen":"You just committed to your <b>local</b> main — wrong branch, and nothing is pushed. The commit contains good changes that belong on <code>feature/labels</code> instead. You want them back, staged, ready to redo properly.",
 "q":"Which command gives you exactly that?",
 "ch":[
  {"t":"git reset --soft HEAD~1","ok":true},
  {"t":"git reset --hard HEAD~1","ok":false},
  {"t":"git revert HEAD","ok":false},
  {"t":"git push origin main","ok":false}
 ],
 "hint":"You want the commit gone and the changes kept, still staged. Three reset modes differ in exactly what they keep.",
 "explain":"<p><b>Correct: <code>git reset --soft HEAD~1</code>.</b> Soft reset moves the branch pointer back one commit and leaves <i>everything</i> — the changes — staged in the index, exactly what 'redo it on the right branch' needs. <b>Why not the others:</b> <code>--hard</code> moves the pointer <i>and</i> throws the changes away — the work would survive only in the reflog, which is an emergency rope, not a plan. <code>git revert HEAD</code> creates a new commit that inverts yours: the correct tool on <i>shared</i> branches, but here it would burden your local main with an undo commit and leave the changes nowhere near staged. <code>git push</code> publishes the mistake to the shared branch — the opposite of the goal. Then: <code>git switch -c feature/labels</code> and the staged work commits there cleanly. Focus: soft keeps staged, mixed keeps unstaged, hard keeps nothing.</p>"
},
{
 "id":"H23","type":"spot","title":"The workflow that executes pull requests","kw":[32,48,37],
 "scen":"An attacker opens a pull request on <b>shopfront</b> from a fork with two lines changed in the build script. Moments later, the repository's <code>preview</code> workflow runs — and the organisation's <code>DEPLOY_KEY</code> secret is within reach of that job. You review the workflow definition.",
 "q":"Click the <b>two lines</b> that together hand the attacker the keys.",
 "file":".github/workflows/preview.yml",
 "code":[
  "name: preview",
  "on: pull_request_target",
  "jobs:",
  "  build:",
  "    runs-on: ubuntu-latest",
  "    steps:",
  "      - uses: actions/checkout@v4",
  "        with:",
  "          ref: ${{ github.event.pull_request.head.sha }}",
  "       - run: npm install && npm run build"
 ],
 "bad":[1,8],
 "hint":"One line chooses a trigger that runs with repository secrets on foreign code. One line chooses whose code gets checked out into that privileged job.",
 "explain":"<p>The danger is the <b>pair</b>. <b>Line 2</b> — <code>pull_request_target</code> — runs the workflow in the context of the <i>base</i> repository: it carries the repository's secrets and a write token, and it runs automatically for pull requests from forks (that is its purpose: letting workflows comment on PRs). <b>Line 9 (the checkout ref line)</b> then checks out the pull request's <i>head</i> — the attacker's fork commit — into that privileged job. The next <code>run:</code> step therefore executes attacker-chosen code with <code>DEPLOY_KEY</code> in the environment: the two changed lines in their build script are the whole attack. Either half alone is safe — <code>pull_request_target</code> with a checkout of the <i>base</i> branch is fine, and building fork code is fine in a <code>pull_request</code> job with no secrets. The fix: checkout the base ref, or run untrusted builds in a secret-less job, or require maintainer approval before workflows run on first-time forks. Focus: privileged trigger + untrusted checkout = code execution with credentials.</p>"
},
{
 "id":"H24","type":"logview","title":"Secret scanning dashboard","kw":[37,57,59],
 "file":"secret scanning — open findings, shopfront org",
 "scen":"You own the weekly secret-scanning review. Six findings are open. Some are live credentials, some are noise. Classify before anyone rotates anything.",
 "q":"Select <b>every finding</b> that is a real, live credential requiring removal and rotation.",
 "log":[
  "F-101  HIGH    aws_secret_access_key  wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY      docs/examples.md",
  "F-102  HIGH    stripe_live_key        sk_live_51H8xQeKv9mT4zLpWnYq2RbA              services/billing/config.py",
  "F-103  HIGH    private_key            -----BEGIN RSA PRIVATE KEY-----               deploy/old-runner.pem",
  "F-104  LOW     placeholder            YOUR_API_KEY_HERE                             .env.sample",
  "F-105  LOW     test_fixture           token = \"mock-token-not-real\"                 tests/fixtures.py",
  "F-106  MEDIUM  connection_string      postgres://svc_admin:Hunter2!@10[.]0[.]4[.]12:5432/orders   scripts/seed.py"
 ],
 "ans":{"kind":"multi","ch":[
  {"t":"F-102 — the Stripe live key in billing config","ok":true},
  {"t":"F-103 — the RSA private key in deploy/","ok":true},
  {"t":"F-106 — the database connection string with embedded password","ok":true},
  {"t":"F-101 — the AWS key in docs/examples.md","ok":false},
  {"t":"F-104 — the placeholder in .env.sample","ok":false},
  {"t":"F-105 — the mock token in tests/fixtures.py","ok":false}
 ]},
 "hint":"Two values are published documentation examples, one is literally named 'mock', one says YOUR_API_KEY_HERE. Read the value and the location, not just the severity badge.",
 "explain":"<p><b>Real — all three:</b> <b>F-102</b> is a <code>sk_live_</code> Stripe key in application config: live format, live location — rotate at the provider, remove from the file, load from the secret manager. <b>F-103</b> is an RSA private key committed as a file: keys like this authenticate infrastructure (the old CI runner) — treat as compromised, revoke, reissue. <b>F-106</b> is a database URL with the password inline — that is a credential, whatever the scanner's severity says; the 'MEDIUM' badge is the trap that makes this exercise: severity labels are heuristics, content is truth. <b>Noise — all three:</b> <b>F-101</b> is AWS's published documentation example (the name literally ends in EXAMPLEKEY); <b>F-104</b> is a placeholder in the sample env file, whose entire purpose is to be filled with real values <i>outside</i> Git; <b>F-105</b> declares itself a mock in a fixture. Focus: judge the value and the location — live prefix, real host, real key material — then rotate first, clean second.</p>"
},
{
 "id":"H25","type":"match","title":"Advanced Git, one line each","kw":[4,14,12,18,45,10],
 "scen":"The platform guild runs a 'explain it in one line' round. Six concepts, six definitions — match them.",
 "q":"Match each concept to its one-line definition.",
 "zones":[
  {"id":"z1","l":"The pointer to your current commit or branch"},
  {"id":"z2","l":"Working on a raw commit rather than a branch — new commits here can be orphaned"},
  {"id":"z3","l":"Local journal of where HEAD has been; rescues 'lost' commits"},
  {"id":"z4","l":"Shelves uncommitted work without creating a commit"},
  {"id":"z5","l":"Stores large binaries as pointers outside the normal history"},
  {"id":"z6","l":"GitOps operator that keeps a cluster synced with the repository"}
 ],
 "items":[
  {"t":"HEAD","z":"z1"},
  {"t":"detached HEAD","z":"z2"},
  {"t":"reflog","z":"z3"},
  {"t":"stash","z":"z4"},
  {"t":"Git LFS","z":"z5"},
  {"t":"Flux","z":"z6"}
 ],
 "hint":"Two of these are pointers, one is a journal, one is a shelf, one is a warehouse, one is a controller.",
 "explain":"<p><b>HEAD</b> is the pointer Git uses to know where you are — usually a branch, which then points at a commit. <b>Detached HEAD</b> is what you get when HEAD points directly at a commit (checking out a tag or a hash, as CI does with release tags): commits made here belong to no branch and become orphaned when you move away — harmless for builds, dangerous for interactive work. <b>Reflog</b> is HEAD's local history journal: every position HEAD held is recorded for weeks, which is how reset, rebase and 'lost' commits are recovered. <b>Stash</b> shelves the working directory and index without a commit — the tool for 'switch branches, half-finished work in hand'. <b>Git LFS</b> replaces big binaries in history with tiny pointer files and keeps the blobs in separate storage — the cure for 2 GB design folders and 20-minute clones. <b>Flux</b> is the GitOps operator (Argo CD's sibling) that continuously syncs a cluster to a repository. Focus: six names, six distinct jobs — pointer, state, journal, shelf, warehouse, controller.</p>"
},
{
 "id":"H26","type":"decision","title":"Flaky test vs the release train","kw":[29,35,56,26],
 "scen":"Friday 15:00. The merge queue holds PR #502 — a customer-requested fix. The queue has failed it twice on the same integration test, which passes on every local retry and in isolation. The <code>v2.3.0</code> release train is booked for 17:00 and waits on this PR. <code>release/2.2</code> is LTS and unaffected.",
 "q":"Choose the right move at each step.",
 "steps":[
  {"q":"Fastest correct move on the flaky test?","ch":[
   {"t":"Quarantine the flaky test with a tracking ticket, then let the queue re-run the PR","ok":true,"o":"Quarantine removes the false signal immediately while the ticket guarantees the test is fixed — the queue keeps proving every merge."},
   {"t":"Bypass the merge queue for this PR — it is green on its own branch","ok":false,"o":"Individual green is not batch green; bypassing is precisely the hole the queue plugs."},
   {"t":"Mark the PR merged manually and push","ok":false,"o":"A manual merge is a bypass with worse bookkeeping — and unreviewed batch effects."}]},
  {"q":"What is the merge queue actually doing when it 'fails' PR #502?","ch":[
   {"t":"Testing the PR as if it were already merged, together with other queued PRs — two individually-green changes can fail as a pair","ok":true,"o":"The queue's contract is 'main stays green after every batch'; it re-tests combinations, not just single branches."},
   {"t":"Punishing the author for a dirty working tree","ok":false,"o":"The queue tests merge results on CI — it never looks at anyone's laptop."},
   {"t":"Running the release deployment early","ok":false,"o":"The queue is a merge gate; the train deploys tags, which is a separate stage."}]},
  {"q":"What policy keeps the 17:00 train honest?","ch":[
   {"t":"Fix or quarantine flaky tests before the train cuts — never skip gates under time pressure","ok":true,"o":"Time pressure is when gates matter most; a train built on skipped checks ships unknowns."},
   {"t":"Freeze all merges for 24 hours to be safe","ok":false,"o":"A freeze punishes everyone for one flaky test and pushes the problem to next week."},
   {"t":"Cut the release from a developer's laptop where the test passes","ok":false,"o":"Laptop builds have no traceable history, no reproducible artifact, no audit trail."}]}
 ],
 "hint":"The queue's job is combinations, not punishments. Quarantine is a decision with a ticket — not a shrug.",
 "explain":"<p><b>Step 1:</b> a test that fails in the queue but passes in isolation is <i>flaky</i> — quarantine it with a ticket and re-run the PR through the queue. The gate stays up; the false signal goes away. <b>Step 2:</b> the merge queue evaluates each PR as part of the <i>next real state of main</i>, batched with other queued changes — two changes that are green alone can break each other, and catching that is the queue's entire value. <b>Step 3:</b> release pressure is the classic moment gates die — the policy that survives is 'fix or quarantine before the train', because a train built on bypassed gates ships untested combinations, and the LTS customers depending on you cannot see which. Freezes and laptop builds both trade a small delay for a large loss of trust. Focus: gates under pressure are the whole point of gates.</p>"
},
{
 "id":"H27","type":"multi","title":"Repository governance baseline","kw":[60,30,38,37,39,65],
 "scen":"Nordwind Labs grows from 3 to 30 repositories. You define the governance baseline that every repository gets by default. Draft carefully: each item must survive 'why?' in review.",
 "q":"Select <b>every control</b> that belongs in the default baseline.",
 "ch":[
  {"t":"Least-privilege RBAC per team and per repository","ok":true},
  {"t":"Signed commits required organisation-wide","ok":true},
  {"t":"Secret scanning with push protection on every repository","ok":true},
  {"t":"Dependency scanning (SCA) gating merges on known CVEs","ok":true},
  {"t":"Scheduled mirror/backup of every repository","ok":true},
  {"t":"Platform admins get ownership of every repository, 'just in case'","ok":false},
  {"t":"New repositories default to public visibility","ok":false},
  {"t":"Keep shared secrets in the team wiki so everyone can find them","ok":false}
 ],
 "hint":"Four controls add verification or recovery. Three 'defaults' leak access, exposure or credentials.",
 "explain":"<p><b>The five baseline controls:</b> <b>least-privilege RBAC</b> scopes write access to the people doing the work — the audit-trail answer to 'who could have done this?' is a short list; blanket admin ownership makes every investigation start from 'possibly everyone'. <b>Signed commits</b> make authorship verifiable at review and auditable after. <b>Secret scanning with push protection</b> stops credential leaks at upload time on every repo — the cheapest control in the list. <b>Dependency scanning (SCA)</b> gates merges on known vulnerabilities in lockfiles, so a CVE lands as a ticket, not a breach. <b>Scheduled mirrors</b> are the recovery path if the platform or an account is compromised — backups are part of source control governance, not an ops afterthought. <b>The three anti-controls:</b> default-public visibility turns a mistake into an incident; a wiki full of shared secrets is a searchable credential leak with no rotation path; and 'just in case' admin rights are how the least-privilege model dies quietly. Focus: governance = smallest access, verified identity, automated gates, tested recovery.</p>"
},
{
 "id":"H28","type":"spot","title":"The strategy doc, reviewed","kw":[8,19,20],
 "scen":"A draft 'branching strategy' document is circulating for sign-off. Two of its lines would cause incidents within a month. You are the last reviewer before the CTO signs it.",
 "q":"Click the <b>two lines</b> you must reject.",
 "file":"docs/branching-strategy-v1.md",
 "code":[
  "## Our branching strategy (v1)",
  "1. After each release we rebase main onto the release branch to 'clean it up'.",
  "2. Every change opens a pull request with review.",
  "3. CI must be green before merge.",
  "4. All five developers share one long-lived feature branch for the quarter,",
  "5.    merging to main only at the quarterly release."
 ],
 "bad":[1,4],
 "hint":"One line rewrites a shared branch as routine practice. One line is the big-bang integration anti-pattern in its purest form.",
 "explain":"<p><b>Line 2 (the rebase-main line):</b> rebasing <i>main</i> — the branch everyone branches from and deploys — rewrites shared history as scheduled practice. Every clone diverges on release day, tags point at abandoned commits, and audits lie. Rebase is a tool for <i>private or clearly-owned</i> branches (with force-with-lease), never a maintenance routine on main; releases are cut with tags and merges, not history surgery. <b>Lines 5–6 (the quarterly shared branch):</b> one long-lived branch shared by all five developers for a quarter is big-bang integration: conflicts compound silently, reviews of a quarter's diff are fiction, and the quarterly merge to main ships every bug at once. The working alternatives are short-lived feature branches merged through PRs (what lines 3–4 already say — the good lines in this document), or trunk-based development with flags at higher cadence. Focus: reject any rule that either rewrites main routinely or postpones integration by months.</p>"
},
{
