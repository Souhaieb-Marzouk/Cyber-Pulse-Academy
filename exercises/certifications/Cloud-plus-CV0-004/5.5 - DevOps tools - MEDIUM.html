<script>
/* CyberPulse Academy — Cloud+ 5.5 DevOps Tools — self-contained exam engine (vanilla JS) */
'use strict';
if (typeof MODE === 'undefined') { var MODE = 'medium'; }
var SEVCAP = (MODE === 'hard') ? 'HARD' : 'MEDIUM';
var TOPIC = 'cloud-plus', PASSMARK = 70, REPORTED = false, USER = '', COUNTRY = '';
var S = null;

function $(i) { return document.getElementById(i); }
function h(t, c, html) { var e = document.createElement(t); if (c) e.className = c; if (html != null) e.innerHTML = html; return e; }
function shuf(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rng(n) { var r = [], i; for (i = 0; i < n; i++) r.push(i); return r; }
function fr(n) { return Math.round(n * 10) / 10; }
function fr2(n) { var x = Math.round(n * 100) / 100; return (Math.round(x) === x) ? String(x) : String(x); }
function sbeh() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; } catch (e) { return 'auto'; } }
function scrollToTop() { window.scrollTo({ top: 0, behavior: sbeh() }); }
function fmt(s) { s = Math.max(0, s | 0); var m = Math.floor(s / 60), x = s % 60; return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function txtOf(s) { var d = document.createElement('div'); d.innerHTML = s; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
var THEME_COLS = ['#4cc3ff', '#37d17e', '#ffc061', '#b18cff', '#ff8fa3'];
var THEMES = ['Kubernetes &amp; container orchestration', 'Configuration management (Ansible)', 'CI/CD &amp; build automation', 'Infrastructure as Code (Terraform)', 'DevSecOps &amp; governance'];
var ANSLBL = {
  qcm: 'Choose one answer',
  multi: 'Choose all that apply — partial credit per correct choice',
  dd: 'Drag each item into its bucket — or click an item, then click a bucket',
  order: 'Put the steps into the right order — drag rows or use the arrows',
  blank: 'Pick a word from the bank, then click a blank to fill it. Click a placed word to take it back',
  spot: 'Click the faulty line(s) in the snippet, then press Check',
  logview: 'Filter the log if needed, then click the line(s) that answer the question',
  term: 'Type the command, run it with Enter, then press Check',
  branch: 'Choose one action for every step — Check unlocks after the last step',
  triage: 'Choose the best next action for every alert, then press Check'
};

function freshState() {
  return { order: [], cur: 0, earned: {}, checked: {}, skipped: {}, hints: {}, last: {}, res: {}, bsel: {}, brev: {}, bDone: {}, sel: null, dragRow: null, remain: 0, total: 0, pM: false, pC: false, done: false, tick: null };
}
function prepare() {
  EX.forEach(function (e) {
    if (e.o) e._oi = shuf(rng(e.o.length));
    if (e.t === 'branch') e._soi = e.steps.map(function (st) { return shuf(rng(st.o.length)); });
    if (e.it) e._pool = shuf(rng(e.it.length));
    if (e.bank) e._bank = shuf(rng(e.bank.length));
    if (e.t === 'order') e._disp = shuf(rng(e.items.length));
    if (e.t === 'triage') e._aoi = e.a.map(function (al) { return shuf(rng(al.o.length)); });
  });
}
function totalSeconds() { var t = 0; EX.forEach(function (e) { t += e.w; }); return t; }

function showOvl() { $('ovl').hidden = false; var m = $('main'); if (m) { try { m.inert = true; } catch (e) {} } }
function show(name) {
  $('scr-intro').hidden = name !== 'intro';
  $('scr-quiz').hidden = name !== 'quiz';
  $('scr-res').hidden = name !== 'res';
  $('top').hidden = name === 'intro';
}
function startExam() {
  if (S && S.tick) clearInterval(S.tick);
  S = freshState();
  EX = shuf(EX);            /* shuffle question order for this attempt */
  S.order = rng(EX.length); /* report follows the presented order */
  prepare();
  S.total = totalSeconds(); S.remain = S.total;
  buildNav(); updTimer(); updChrome();
  show('quiz'); render(0);
  S.tick = setInterval(tick, 1000);
  window.scrollTo(0, 0);
}
function tick() {
  if (!S || S.done || S.pM || S.pC) return;
  S.remain--;
  updTimer();
  if (S.remain <= 0) { S.remain = 0; updTimer(); finalize(true); }
}
function updTimer() {
  var b = $('timerV'); if (b) b.textContent = fmt(S ? S.remain : 0);
  var box = $('tBox'); if (box && S) box.classList.toggle('low', S.remain < 300);
}
function togglePause() {
