speed and integrity.", "5": "Row counts plus sampled checksums is a reasonable validation posture (full checksums on critical tables would be even stronger)."}, "hint": "Production writes during the move; the engines speak different character sets; and the load inserts every row twice if something re-fires.", "explain": "<p>Three config faults would each corrupt the migration on their own. Full-load-only mode ignores ongoing production writes — change data capture plus a delta phase is what keeps the target current until cutover. Disabled charset mapping on a latin1-to-utf8 move ships mojibake into production text columns. Enabled triggers during bulk load double-fire on every inserted row, silently duplicating child records. The correct parts of the config are equally instructive: foreign keys suspended during load and revalidated after, and a validation posture that tests content, not just counts.</p><p><b>Focus on:</b> live-writing sources need CDC/delta; engine changes need explicit charset mapping; bulk load needs triggers off.</p>"}, {"id": "H27", "type": "multi", "theme": "risks", "title": "The 90-day stabilization review", "scenario": "<p>Ninety days after the final wave, <b>Meridian Health</b> runs the joint FinOps/SecOps stabilization review. Seven actions are proposed.</p>", "question": "<p>Select every action that is justified by good post-migration practice.</p>", "options": [["a1", "Right-size instances using 30 days of utilization telemetry against the baseline", 1, "This is the textbook right-sizing loop: measured telemetry compared to the baseline, one change at a time. 30 days captures weekly and month-end cycles."], ["a2", "Delete idle resources left from test waves: unattached volumes, stale snapshots, unused IPs", 1, "Orphaned resources bill silently forever. Post-migration cleanup is a scheduled task with an owner, not an accident."], ["a3", "Convert steady-state workloads to reserved capacity now that usage has stabilized", 1, "Reservations need a predictable baseline — which exists only after stabilization. Buying them on a wobbling footprint wastes commitment."], ["a4", "Rotate the temporary migration credentials and remove the migration agent subnet rules", 1, "Transition-state access outlives its purpose unless it is explicitly retired. Credential rotation plus rule removal closes the migration’s security debt."], ["a5", "Compare the post-migration baseline against the pre-migration one to catch silent regressions", 1, "The whole point of capturing a baseline before migration is this comparison — latency, throughput, error rates — so regressions surface before users do."], ["a6", "Downsize the production database the day after go-live to show quick savings", 0, "Sizing changes need telemetry windows, not optics. A day-one downsize on the most stateful component gambles the SLA for a screenshot."], ["a7", "Cancel the old data-centre support contracts before the soak period ends", 0, "Support contracts are part of the rollback safety net until the soak period and sign-off complete. Cancelling early deletes the parachute mid-jump."]], "hint": "Telemetry, cleanup, commitment, retirement of temporary access, and baseline comparison are all legitimate. Timing is what damns the other two.", "explain": "<p>The stabilization review converts a finished migration into a governed estate: right-sizing from 30 days of telemetry, deletion of idle/orphaned resources, reserved-capacity conversion now that usage is predictable, retirement of migration-era access (credential rotation, agent-subnet rules removed), and a baseline-vs-baseline comparison that catches silent regressions. The two wrong proposals are timing failures dressed as initiative: day-one downsizing of the production database gambles stability without evidence, and cancelling old support contracts before the soak period ends removes the safety net the rollback plan quietly depends on.</p><p><b>Focus on:</b> same actions, right time — practice is action plus evidence plus sequencing.</p>"}, {"id": "H28", "type": "categorize", "theme": "planning", "title": "File each artefact into its phase", "scenario": "<p>Auditors ask the <b>Meridian Health</b> PMO to show which phase of the migration produced each artefact. Six artefacts, four phases.</p>", "question": "<p>Place each artefact under the phase that owns it.</p>", "zones": [["z_assess", "Assessment"], ["z_cut", "Cutover"], ["z_val", "Validation"], ["z_dec", "Decommission"]], "items": [["i1", "Application dependency map from the agent-based discovery scan", "z_assess", "Discovery output defines what moves and in which order — pure assessment phase."], ["i2", "TCO model with the 3-year forecast and dual-running premium", "z_assess", "The business case is built from assessment data before approval; the TCO belongs to that phase."], ["i3", "Weighted-routing change request with the canary schedule", "z_cut", "Traffic-shift mechanics are cutover-phase artefacts — they execute on the night."], ["i4", "Freeze-writes checklist with the quiesce verification step", "z_cut", "The freeze is a cutover-night control; its checklist travels with the runbook."], ["i5", "Checksum evidence log with data-owner sign-off", "z_val", "Validation produces evidence; sign-off closes it. This log is the validation phase’s product."], ["i6", "Disposal certificates for the sanitized legacy disks", "z_dec", "Sanitization certificates are generated by decommissioning and feed the audit trail."]], "hint": "Ask when each document is WRITTEN, not when it is read: plans before, night-of for the runbook controls, proof after the move, certificates at the end.", "explain": "<p>Artefacts date the phases. Assessment produces the dependency map and the TCO/business case — everything that justifies and shapes the program. Cutover produces night-of controls: the weighted-routing change request and the freeze-writes checklist. Validation produces evidence — the checksum log with data-owner sign-off. Decommissioning produces the disposal certificates that make the end of the story auditable. When artefacts drift across phases (a TCO written after cutover, sign-offs without logs), auditors read it as control failure, not sloppiness.</p><p><b>Focus on:</b> evidence chains — every phase must be able to show its paperwork.</p>"}, {"id": "H29", "type": "order", "theme": "cutover", "title": "After the rolled-back cutover", "scenario": "<p>Tuesday’s cutover at <b>Vantage Trading</b> was rolled back cleanly when checkout errors spiked. The wave team now owes the program a proper follow-up. Six actions, true order.</p>", "question": "<p>Order the post-rollback actions correctly, first to last.</p>", "items": [["Capture evidence while it is fresh: logs, dashboards, timelines, screenshots", "Evidence decays fastest: dashboards roll over, on-call memories blur. The capture window is the first hours, not the review day."], ["Hold a blameless post-incident review with the whole wave team", "Blameless review turns participants into witnesses: the sequence, the decision times, the trigger performance — what happened, not who."], ["Update the runbook with the root cause and the new pre-cutover checks", "The review’s output must land in the runbook while it is fresh: root cause, new checks, amended order — this is the program’s memory."], ["Rehearse the corrected cutover in a full drill (repeat the rehearsal with the fix in place)", "A fix is a hypothesis until rehearsed. The drill re-runs the cutover with the change applied and measures the trigger behaviour again."], ["Obtain CAB approval for the new cutover window with the evidence attached", "Change management re-enters here: the CAB approves the new window because the evidence shows the failure understood and fixed."], ["Communicate the new plan and date to all stakeholders, with the rollback guarantees restated", "The loop closes outward: stakeholders get the new date and the restated safety case, so trust in the program is rebuilt on facts."]], "hint": "Evidence, learning, memory, rehearsal, approval, communication. The runbook update precedes the rehearsal that tests it.", "explain": "<p>A clean rollback is the start of the follow-up, not the end. Evidence first (logs and timelines decay within hours), then a blameless review that converts the night into understanding, then the runbook update that makes the lesson permanent, then a full rehearsal of the corrected cutover (a fix is a hypothesis until drilled), then CAB approval with the evidence attached, and finally stakeholder communication that restates the safety case. Skipping the rehearsal to save a week is how the same failure buys a second cutover.</p><p><b>Focus on:</b> blameless reviews and drilled fixes — the two habits that separate programs that improve from programs that repeat.</p>"}, {"id": "H30", "type": "terminal", "theme": "movement", "title": "Size the target volume and the copy job", "scenario": "<p><b>Vantage Trading</b> will copy the staged dataset tree to a new cloud volume, and the copy tool needs two numbers before it can be requested: how much space the staged tree actually occupies, and how many individual files will move. Your working directory is <code>/staging</code>; the tree is <code>/staging/inbound</code>.</p>", "question": "<p>Two goals, stated operationally: (1) report the total on-disk size of the tree in human-readable form, summarised — no per-file listing; (2) report how many individual files the tree contains, as a single count. No sample command is provided — choose the tools and flags yourself.</p>", "motd": "vantage-staging — pre-sizing check. Type help for basic commands.", "prompt": "vantage@staging:/staging$", "cwd": "/staging", "lsOut": "inbound/  outbound/  temp/", "catMap": {}, "helpOut": "Basic commands: ls, cat, pwd, cd, clear.", "tools": ["du", "df", "wc", "find"], "tasks": [{"name": "Measure the occupied space", "accept": ["^du\\s+(-s\\s+-h|-h\\s+-s|-sh|-hs|--summarize\\s+--human-readable|--human-readable\\s+--summarize)(\\s+(\\./)?inbound|\\s+/staging/inbound)/?$"], "okOut": "42G\tinbound", "solution": "du -sh /staging/inbound", "why": "One summarised, human-readable total for the whole tree — the number the volume request cites, with headroom added for growth."}, {"name": "Count the files to move", "accept": ["^find\\s+(\\./)?(inbound|/staging/inbound)\\s+-type\\s+f\\s*(\\|\\s*wc\\s+-l)?$", "^find\\s+/staging\\s+-type\\s+f\\s*(\\|\\s*wc\\s+-l)?$"], "okOut": "1284", "solution": "find /staging/inbound -type f | wc -l", "why": "The copy job is sized per object: counting regular files in the tree gives the exact object count the tool will iterate over."}], "hint": "Goal 1: one tool summarises disk usage per directory — ask for human units and a summary. Goal 2: walk the tree for regular files and pipe the list into a line counter.", "explain": "<p>Sizing a target volume starts with measuring the source: <code>du -sh</code> walks the tree and prints a single human-readable total (the <code>-s</code> summarise flag suppresses the per-directory listing, <code>-h</code> renders units) — 42G here. The second number is the object count: <code>find /staging/inbound -type f | wc -l</code> → 1284 files, which is what per-object copy tooling and time estimates are built from. <code>df</code> would answer a different question (filesystem free space), and a plain <code>du</code> without <code>-s</code> floods the output with thousands of subdirectory lines nobody sizes from.</p><p><b>Focus on:</b> du measures what the tree occupies, find counts what will move — volume requests cite the first, copy-job sizing cites the second.</p>"}, {"id": "H31", "type": "match", "theme": "cutover", "title": "Match the cutover symptom to its real cause", "scenario": "<p>The <b>Northwind</b> migration war room is reviewing five incidents from recent cutovers. Each symptom has been investigated; the plausible-sounding but wrong explanations have been culled from the evidence. Two extra “causes” from an old brainstorm are still mixed into the pile — they match nothing here.</p>", "question": "<p>Match each symptom to the cause the evidence actually confirmed. Beware: two cards in the pool are decoys and match no symptom.</p>", "pairs": [["The new pool takes 5% of traffic but its error rate is 8× the old pool", "Health checks probe /health, which passes while real payloads fail on the new pool", "Shallow health checks are the classic weighted-routing trap: the pool looks healthy, deep requests fail. The evidence showed 200s on /health and 500s on checkout."], ["Row counts match but checksums differ on the copied tables", "Rows were still being written to the source while the copy ran", "Counts match because no rows were added; checksums differ because values in existing rows changed mid-copy. The fix is quiescing writes or checksumming a consistent snapshot."], ["The TTL was lowered 24 hours ahead, yet some users still hit the old site", "Stubborn resolver chains outside your control cached the record past the low TTL", "You control your own zone, not every resolver in the world. Some operators override TTLs — the evidence traced stuck users to two such resolver chains."], ["Dual-running apps see each other in one direction only", "The security group allows new→old but has no rule for old→new", "Asymmetric firewall rules: sessions initiated one way work, sessions initiated the other time out. The evidence showed SYNs from old→new being dropped."], ["The cutover passed its smoke test, but the 02:00 batch jobs failed", "The batch scheduler still points at the legacy database endpoint", "The smoke test only exercises interactive journeys. The scheduler config was missed in the scan — jobs kept dialling the old endpoint until it was fenced."]], "decoys": ["MTU mismatch between the VPN tunnel and the cloud VPC fragments large packets", "The weighted-routing policy was published with the pool weights swapped"], "hint": "For each symptom ask what th       '<li><b>Skip</b> jumps to the next exercise and flags this one amber. You can return to skipped exercises any time before the timer ends. Skipped (and never-checked) exercises are <b>excluded from scoring entirely</b> — from both your points and the maximum.</li>' +
      '<li><b>Partial credit:</b> multi-answer, drag-and-drop, matching, ordering and fill-blank exercises award a share of the points per correct element. Wrong picks earn nothing but do not subtract.</li>' +
      '<li><b>Hint</b> costs 10% of the exercise’s points and reveals a nudge, never the answer. One hint per exercise.</li>' +
      '<li><b>Revise</b> unlocks a checked exercise so you can change it — you must press Check again (and the review pause applies again).</li>' +
      '<li><b>Pass mark ' + PASS + '%.</b> Score is computed over non-skipped exercises only. At the end you get a full per-exercise report with explanations, and one retake button that reshuffles everything.</li>' +
      '</ul>';
    w.appendChild(ins);
    var act = el('div', 'card');

  function startExam() {

  function tick() {
    if (!S || !S.started || S.submitted) return;
    if (S.manual || S.checkPause) return;
    S.remaining--;
    var t = $('timer');
    if (t) {
      var state = S.remaining <= 60 ? ' <span class="ico b">⚠ final minute</span>'
        : S.remaining <= 300 ? ' <span class="ico w">⚠ running low</span>' : '';
      t.innerHTML = '⏱ <b>' + fmtTime(Math.max(0, S.remaining)) + '</b>' + state;
      t.className = 'pill' + (S.remaining <= 60 ? ' crit' : S.remaining <= 300 ? ' low' : '');
      t.setAttribute('aria-label', 'Time remaining ' + fmtTime(Math.max(0, S.remaining)) +
        (S.remaining <= 60 ? ', final minute' : S.remaining <= 300 ? ', running low' : ''));
    }
    if (S.remaining <= 0) timeUp();
  }
  function updatePauseUI() {
    var b = $('pauseBtn'), ban = $('pausebanner');
    if (b) { b.innerHTML = S.manual ? '▶ Resume' : '⏸ Pause'; }
    if (ban) {
      var msgs = [];
      if (S.manual) msgs.push('⏸ Paused (manual) — exercise hidden until you resume');
      if (S.checkPause) msgs.push('⏸ Timer paused — review mode (press Next to resume)');
      ban.textContent = msgs.join('  •  ');
      ban.className = 'banner' + (msgs.length ? ' show' : '');
    }
  }
  function togglePause() {
    if (S.submitted) return;
    S.manual = !S.manual;
    updatePauseUI();
    renderExercise();
  }

  /* ---------- navigator / themes / score ---------- */
  function renderNav() {
    var g = $('navgrid'); if (!g) return;
    g.innerHTML = '';
    S.order.forEach(function (exIdx, pos) {
      var b = el('button', 'navbtn', String(pos + 1));
      b.type = 'button';
      var ex = D.exercises[exIdx];
      b.title = (pos + 1) + '. ' + ex.title;
      b.setAttribute('aria-label', b.title);
      if (S.checked[exIdx]) { b.classList.add('done'); b.title += ' — checked'; }
      else if (S.skipped[exIdx]) { b.classList.add('skip'); b.title += ' — skipped'; }
      if (pos === S.cur) b.classList.add('cur');
      b.addEventListener('click', function () { goto(pos); });
      g.appendChild(b);
    });
    var done = Object.keys(S.checked).length;
    var f = $('pfill'); if (f) f.style.width = (done / N * 100) + '%';
  }
  function renderThemes() {
    var box = $('themchips'); if (!box) return;
    box.innerHTML = '';
    D.keywords.forEach(function (th) {
      var tot = 0, done = 0;
      D.exercises.forEach(function (ex, i) {
        if (ex.theme === th[2]) { tot++; if (S.checked[i]) done++; }
      });
      var c = el('span', 'tchip', th[0] + ' <b>' + done + '/' + tot + '</b>');
      box.appendChild(c);
    });
  }
  function updateScore() {
    var sc = $('score'); if (!sc) return;
    var sum = 0;
    Object.keys(S.earned).forEach(function (k) { sum += S.earned[k]; });
    sc.innerHTML = 'Score <b>' + r1(sum) + ' / ' + (PTS * N) + '</b>';
  }

  function goto(pos) {
    if (S.submitted) return;
    S.cur = pos;
    S.checkPause = false;   /* leaving the exercise ends the review pause */
    pick = { ex: -1, item: null };
    armedBlank = null;
    mPick = { ex: -1, right: -1 };
    renderNav(); renderExercise();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  function exerciseHead(ex) {
    var head = el('div', 'exhead');
    head.appendChild(el('span', 'badge', typeName(ex.type)));
    head.appendChild(el('span', 'badge th', themeName(ex.theme)));
    head.appendChild(el('span', 'badge pt', PTS + ' pts'));
    head.appendChild(el('span', 'xtitle', 'Q' + (S.cur + 1) + ' — ' + ex.title));
    return head;
  }
  function typeName(t) {
    return {
      single: 'Scenario question', multi: 'Multi-select', categorize: 'Drag & drop sort',
      order: 'Timeline ordering', fill: 'Fill the blanks', terminal: 'Terminal',
      logview: 'Log analysis', spot: 'Spot the mistake', branch: 'Decision path',
      match: 'Match the pairs', prio: 'Risk prioritization'
    }[t] || t;
  }
  function themeName(th) {
    for (var i = 0; i < D.keywords.length; i++) if (D.keywords[i][2] === th) return D.keywords[i][0];
    return th;
  }

  /* ---------- exercise rendering ---------- */
  function renderExercise(scrollMode) {
    updatePauseUI(); updateScore();
    var slot = $('exslot'); if (!slot) return;
    slot.innerHTML = '';
    var ex = curEx(), idx = curIdx();
    var inner = el('div');
    inner.appendChild(exerciseHead(ex));
    /* scenario block */
    if (ex.scenario) {
      var sb = el('div', 'block');
      sb.appendChild(el('div', 'block-label', 'Scenario / context'));
      sb.appendChild(el('div', null, ex.scenario));
      inner.appendChild(sb);
    }
    /* question block */
    var qb = el('div', 'block q');
    qb.appendChild(el('div', 'block-label', 'Question — what do you do?'));
    qb.appendChild(el('div', null, ex.question));
    inner.appendChild(qb);
    /* answers block */
    var ab = el('div', 'block a');
    ab.appendChild(el('div', 'block-label', answerLabel(ex)));
    var ui = el('div'); ui.id = 'aui';
    ab.appendChild(ui);
    /* actions */
    var act = el('div', 'exactions');
    var checked = !!S.checked[idx];
    if (!checked && ex.type !== 'branch') {
      var ck = btn('✓ Check', 'good', doCheck);
      act.appendChild(ck);
    } else if (!checked && ex.type === 'branch') {
      var ckb = btn('✓ Check', 'good', doCheck);
      ckb.id = 'checkbranch';
      act.appendChild(ckb);
      branchCheckState(ckb);
    } else {
      act.appendChild(btn('⟲ Revise', 'warnb', function () { doRevise(idx); }));
    }
    if (!checked) act.appendChild(btn('⇥ Skip', 'ghost', doSkip));
    ab.appendChild(act);
    /* hint */
    if (!checked && ex.hint) {
      var hb = btn('💡 Hint (−10%)', 'ghost hintbtn', function () { doHint(idx); });
      if (S.hint[idx]) hb.disabled = true;
      ab.appendChild(hb);
      if (S.hint[idx]) ab.appendChild(el('div', 'hintbox', '<b>Hint:</b> ' + ex.hint));
    }
    /* feedback */
    if (checked) ab.appendChild(buildFeedback(ex, idx));
    inner.appendChild(ab);
    /* type-specific UI */
    renderAnswerUI(ex, idx, ui, checked);
    /* footer navigation: Prev / Next (Next ends the review pause; on the last exercise it opens the submit dialog) */
    var navrow = el('div', 'exactions');
    var pv = btn('← Previous', 'ghost', function () { if (S.cur > 0) goto(S.cur - 1); }, { 'aria-label': 'Previous exercise' });
    if (S.cur === 0) pv.disabled = true;
    navrow.appendChild(pv);
    navrow.appendChild(btn(S.cur < N - 1 ? 'Next →' : 'Finish ⏎', 'pri', nextOrSubmit, { 'aria-label': 'Next exercise' }));
    navrow.appendChild(el('span', 'small muted', 'Next ends the review pause and restarts the timer.'));
    inner.appendChild(navrow);
    slot.appendChild(inner);
    if (S.manual) {
      inner.setAttribute('inert', '');   /* hidden content cannot be reached or read while paused */
      var cover = el('div', 'pausedcover');
      cover.innerHTML = '<div style="font-size:2rem">⏸</div><h2>Paused (manual)</h2><p class="muted">The exercise is hidden while the clock is stopped.<br>Press Resume to keep working.</p>';
      slot.appendChild(cover);
      inner.classList.add('blurred');
    }
    if (scrollMode === 'top') window.scrollTo({ top: 0, behavior: 'auto' });
    else if (scrollMode === 'feedback') {
      var fbEl = slot.querySelector('.fb');
      if (fbEl) {
        var smooth = true;
        try { smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
        fbEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
      }
    }
  }
  function answerLabel(ex) {
    switch (ex.type) {
      case 'single': return 'Choose one answer';
      case 'multi': return 'Select all that apply';
      case 'logview': return ex.q.type === 'single' ? 'Choose one answer' : 'Select all that apply';
      case 'categorize': return 'Drag the items — or click an item, then a zone (✕ removes a placed item)';
      case 'order': return 'Drag to reorder — or use the arrows';
      case 'fill': return 'Click a chip, then a blank (click a filled blank to clear it)';
      case 'terminal': return 'Type the commands, press Enter after each, then Check';
      case 'spot': return 'Click every faulty line, then Check';
      case 'branch': return 'Work the decisions in order';
      case 'match': return 'Click a match, then its prompt (click an assigned prompt to clear it)';
      case 'prio': return 'Assign a priority rank to every item, then Check';
    }
    return 'Answer';
  }

  /* ----- per-type UI ----- */
  function renderAnswerUI(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var k, i;
    if (ex.type === 'single' || ex.type === 'multi' || ex.type === 'logview') {
      var src = ex.type === 'logview' ? ex.q.options : ex.options;
      if (ex.type === 'logview') ui.appendChild(buildLogViewer(ex, checked));
      var box = el('div', 'opts');
      var ord = cache(ex).optOrder;
      var fbSet = S.fb[idx];
      ord.forEach(function (oi, pos) {
        var o = src[oi];
        var lab = el('label', 'opt');
        var inp = document.createElement('input');
        inp.type = ex.type === 'multi' || (ex.type === 'logview' && ex.q.type === 'multi') ? 'checkbox' : 'radio';
        inp.name = 'q' + idx;
        inp.value = String(oi);
        inp.disabled = checked;
        inp.addEventListener('change', function () { optChanged(ex, idx, oi, inp.checked); });
        if (ex.type === 'single' || (ex.type === 'logview' && ex.q.type === 'single')) {
          if (ans === oi) inp.checked = true;
        } else if ((ans || []).indexOf(oi) !== -1) inp.checked = true;
        lab.appendChild(inp);
        var sp = el('span', 'oi', String.fromCharCode(65 + pos));
        lab.appendChild(sp);
        var txt = el('span', null, o[1]);
        if (checked && fbSet) {
          var isCorr = o[2] === 1;
          var isSel = (ex.type === 'multi' || (ex.type === 'logview' && ex.q.type === 'multi')) ? (getAns(ex) || []).indexOf(oi) !== -1 : (getAns(ex) === oi);
          if (isCorr && isSel) { lab.classList.add('ok'); txt.innerHTML += ' <span class="ico g">✓</span>'; }
          else if (isCorr) { lab.classList.add('miss'); txt.innerHTML += ' <span class="ico w">⚠ correct</span>'; }
          else if (isSel) { lab.classList.add('bad'); txt.innerHTML += ' <span class="ico b">✗</span>'; }
          lab.classList.add('lock');
        }
        lab.appendChild(txt);
        box.appendChild(lab);
      });
      ui.appendChild(box);
      return;
    }
    if (ex.type === 'categorize') { renderCategorize(ex, idx, ui, checked); return; }
    if (ex.type === 'order') { renderOrder(ex, idx, ui, checked); return; }
    if (ex.type === 'fill') { renderFill(ex, idx, ui, checked); return; }
    if (ex.type === 'terminal') { renderTerminal(ex, idx, ui, checked); return; }
    if (ex.type === 'spot') { renderSpot(ex, idx, ui, checked); return; }
    if (ex.type === 'branch') { renderBranch(ex, idx, ui, checked); return; }
    if (ex.type === 'match') { renderMatch(ex, idx, ui, checked); return; }
    if (ex.type === 'prio') { renderPrio(ex, idx, ui, checked); return; }
  }

  function optChanged(ex, idx, oi, on) {
    var ans = getAns(ex);
    if (ex.type === 'single' || (ex.type === 'logview' && ex.q.type === 'single')) {
      S.ans[idx] = oi;
    } else {
      var a = ans || [];
      if (on) { if (a.indexOf(oi) === -1) a.push(oi); }
      else { a = a.filter(function (x) { return x !== oi; }); }
      S.ans[idx] = a;
    }
  }

  /* ----- log viewer ----- */
  function buildLogViewer(ex, checked) {
    var w = el('div');
    var bar = el('div', 'lvbar');
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Filter events (text match, e.g. error or lag)…';
    inp.setAttribute('aria-label', 'Filter log lines');
    var cnt = el('span', 'lvcount');
    bar.appendChild(inp); bar.appendChild(cnt);
    w.appendChild(bar);
    var box = el('div', 'logbox');
    var lines = [];
    ex.log.forEach(function (L) {
      var d = el('div', 'logline');
      d.dataset.raw = (L[0] + ' ' + L[1] + ' ' + L[2]).toLowerCase();
      d.innerHTML = '<span class="ts">' + L[0] + '</span><span class="lv ' + L[1] + '">' + L[1] + '</span><span class="msg">' + L[2] + '</span>';
      box.appendChild(d); lines.push(d);
    });
    function apply() {
      var q = inp.value.trim().toLowerCase(), vis = 0;
      lines.forEach(function (d) {
        var hit = !q || d.dataset.raw.indexOf(q) !== -1;
        d.classList.toggle('hidden', !hit);
        if (hit) vis++;
      });
      cnt.textContent = vis + ' / ' + lines.length + ' lines';
    }
    inp.addEventListener('input', apply);
    w.appendChild(box); apply();
    return w;
  }

  /* ----- categorize ----- */
  function renderCategorize(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var fb = S.fb[idx];
    var bankWrap = el('div');
    bankWrap.appendChild(el('h3', null, 'Item bank'));
    var bank = el('div', 'bank'); bank.id = 'bank' + idx;
    cache(ex).itemOrder.forEach(function (ii) {
      if (ans[ex.items[ii][0]] === undefined || ans[ex.items[ii][0]] === null) {
        bank.appendChild(makeChip(ex, idx, ii, checked));
      }
    });
    if (!bank.children.length) bank.appendChild(el('span', 'zonehint', 'All items placed — press Check when ready.'));
    bankWrap.appendChild(bank);
    ui.appendChild(bankWrap);
    var zwrap = el('div');
    zwrap.appendChild(el('h3', null, 'Zones'));
    var zl = el('div', 'zones');
    cache(ex).zoneOrder.forEach(function (zi) {
      var z = ex.zones[zi];
      var zd = el('div', 'zone');
      zd.dataset.zone = z[0];
      zd.setAttribute('role', 'button');
      zd.setAttribute('tabindex', '0');
      zd.setAttribute('aria-label', 'Zone: ' + z[1] + '. Press Enter to drop the picked item here.');
      var h4 = el('h4', null, z[1]);
      zd.appendChild(h4);
      var drop = el('div', 'drop');
      ex.items.forEach(function (it, ii) {
        if (ans[it[0]] === z[0]) drop.appendChild(makeChip(ex, idx, ii, checked, true));
      });
      if (!drop.children.length) drop.appendChild(el('span', 'zonehint', 'empty'));
      zd.appendChild(drop);
      function dropHere() {
        if (checked) return;
        if (pick.ex === idx && pick.item !== null) {
          ans[ex.items[pick.item][0]] = z[0];
          pick = { ex: -1, item: null };
          refreshCat(ex, idx);
        }
      }
      zd.addEventListener('click', dropHere);
      zd.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dropHere(); } });
      zd.addEventListener('dragover', function (e) { e.preventDefault(); zd.classList.add('over'); });
      zd.addEventListener('dragleave', function () { zd.classList.remove('over'); });
      zd.addEventListener('drop', function (e) {
        e.preventDefault(); zd.classList.remove('over');
        var itId = e.dataTransfer.getData('text/plain');
        if (!checked && itId) { ans[itId] = z[0]; pick = { ex: -1, item: null }; refreshCat(ex, idx); }
      });
      zl.appendChild(zd);
    });
    zwrap.appendChild(zl);
    ui.appendChild(zwrap);
    if (checked && fb) {
      var st = el('div', 'small muted', 'Each chip is marked: green = correct zone, red = wrong zone. Hover the marks in the feedback panel for the “belongs in” reasons.');
      ui.appendChild(st);
    }
  }
  function makeChip(ex, idx, ii, checked, placed) {
    var it = ex.items[ii];
    var fb = S.fb[idx];
    if (placed) {
      /* A chip sitting in a zone is a label, not a click target: the whole zone
         stays the drop target, and a small ✕ button removes the chip. */
      var sc = el('span', 'chip placedchip', it[1]);
      sc.dataset.item = it[0];
      if (fb) {
        var mine = fb.itemStates && fb.itemStates[it[0]];
        if (mine === 'ok') sc.classList.add('ok');
        if (mine === 'bad') sc.classList.add('bad');
      }
      if (!checked) {
        var rm = el('button', 'unplace', '✕');
        rm.type = 'button';
        rm.setAttribute('aria-label', 'Remove ' + it[1] + ' from its zone');
        rm.addEventListener('click', function (e) {
          e.stopPropagation();
          var a = getAns(ex);
          delete a[it[0]];
          refreshCat(ex, idx);
        });
        sc.appendChild(rm);
      }
      return sc;
    }
    var c = el('button', 'chip', it[1]);
    c.type = 'button';
    c.draggable = !checked;
    c.dataset.item = it[0];
    if (fb) {
      var mine2 = fb.itemStates && fb.itemStates[it[0]];
      if (mine2 === 'ok') c.classList.add('ok');
      if (mine2 === 'bad') c.classList.add('bad');
    }
    if (pick.ex === idx && pick.item === ii) c.classList.add('picked');
    if (!checked) {
      c.addEventListener('click', function () {
        if (pick.ex === idx && pick.item === ii) { pick = { ex: -1, item: null }; }
        else { pick = { ex: idx, item: ii }; }
        refreshCat(ex, idx);
      });
      c.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/plain', it[0]);
        c.classList.add('dragging');
      });
      c.addEventListener('dragend', function () { c.classList.remove('dragging'); });
    } else {
      c.disabled = true;
    }
    return c;
  }
  function refreshCat(ex, idx) {
    var ui = $('aui');
    if (ui) { ui.innerHTML = ''; renderCategorize(ex, idx, ui, !!S.checked[idx]); }
  }

  /* ----- ordering ----- */
  function renderOrder(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var fb = S.fb[idx];
    var rows = el('div', 'rows');
    ans.forEach(function (itemIdx, pos) {
      var r = el('div', 'orow');
      if (fb) r.classList.add(fb.posStates && fb.posStates[pos] ? 'ok' : 'bad');
      if (!checked) { r.draggable = true; r.dataset.pos = pos; }
      r.appendChild(el('span', 'pos', String(pos + 1)));
      var lab = el('span', 'olabel', ex.items[itemIdx][0]);
      if (fb) {
        lab.innerHTML += '<span class="owhy">' + (fb.posStates && fb.posStates[pos] ? '✓ right position' : '✗ belongs at position ' + (itemIdx + 1)) + '</span>';
      }
      r.appendChild(lab);
      if (!checked) {
        var mv = el('div', 'mv');
        var up = btn('▲', 'ghost', function () { moveRow(ex, idx, pos, -1); }, { 'aria-label': 'Move up: ' + ex.items[itemIdx][0] });
        var dn = btn('▼', 'ghost', function () { moveRow(ex, idx, pos, 1); }, { 'aria-label': 'Move down: ' + ex.items[itemIdx][0] });
        mv.appendChild(up); mv.appendChild(dn);
        r.appendChild(mv);
        r.addEventListener('dragstart', function (e) {
          e.dataTransfer.setData('text/plain', String(pos));
          r.classList.add('dragging');
        });
        r.addEventListener('dragend', function () { r.classList.remove('dragging'); });
        r.addEventListener('dragover', function (e) { e.preventDefault(); });
        r.addEventListener('drop', function (e) {
          e.preventDefault();
          var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
          if (!isNaN(from) && from !== pos) {
            var a = getAns(ex).slice();
            var it = a.splice(from, 1)[0];
            a.splice(pos, 0, it);
            S.ans[idx] = a;
            refreshOrder(ex, idx);
          }
        });
      }
      rows.appendChild(r);
    });
    ui.appendChild(rows);
  }
  function moveRow(ex, idx, pos, dir) {
    var a = getAns(ex).slice();
    var to = pos + dir;
    if (to < 0 || to >= a.length) return;
    var t = a[pos]; a[pos] = a[to]; a[to] = t;
    S.ans[idx] = a;
    refreshOrder(ex, idx);
  }
  function refreshOrder(ex, idx) {
    var ui = $('aui'); if (ui) { ui.innerHTML = ''; renderOrder(ex, idx, ui, !!S.checked[idx]); }
  }

  /* ----- fill blanks ----- */
  function renderFill(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var fb = S.fb[idx];
    var parts = ex.text.split(/\[\[(\d+)\]\]/);
    var holder = el('div', 'filltext');
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) { holder.appendChild(el('span', null, parts[i])); }
      else {
        var b = parts[i];
        var bb = el('button', 'blank', ans[b] ? ans[b] : '[' + b + ']');
        bb.type = 'button';
        if (ans[b]) bb.classList.add('filled');
        if (armedBlank === b && !checked) bb.classList.add('armed');
        if (fb) {
          var st = fb.blankStates && fb.blankStates[b];
          if (st === 'ok') { bb.classList.add('ok'); bb.innerHTML = ans[b] + ' ✓'; }
          else { bb.classList.add('bad'); bb.innerHTML = (ans[b] || '—') + ' ✗ <span class="blankfix">→ ' + ex.blanks[b][0] + '</span>'; }
        }
        bb.setAttribute('aria-label', 'Blank ' + b + (ans[b] ? ', filled with ' + ans[b] : ', empty'));
        if (!checked) {
          (function (bkey, btnEl) {
            btnEl.addEventListener('click', function () {
              var a2 = getAns(ex);
              if (a2[bkey]) { delete a2[bkey]; armedBlank = null; }
              else { armedBlank = bkey; }
              refreshFill(ex, idx);
            });
          })(b, bb);
        } else { bb.disabled = true; }
        holder.appendChild(bb);

    }
    ui.appendChild(holder);
    if (!checked) {
      var bankWrap = el('div');
      bankWrap.appendChild(el('h3', null, 'Word bank'));
      var bank = el('div', 'bank');
      cache(ex).bankOrder.forEach(function (wi) {
        var w = ex.bank[wi];
        var used = Object.keys(ans).some(function (k) { return ans[k] === w; });
        var c = el('button', 'chip', w);
        c.type = 'button';
        if (used) { c.disabled = true; c.style.opacity = '.45'; }
        (function (word) {
          c.addEventListener('click', function () {
            var a2 = getAns(ex);

            }
            if (target) {
              /* remove word from any other blank */
              Object.keys(a2).forEach(function (k) { if (a2[k] === word) delete a2[k]; });
              a2[target] = word;
            }
            armedBlank = null;
            refreshFill(ex, idx);
          });
        })(w);
        bank.appendChild(c);
      });
      bankWrap.appendChild(bank);
      ui.appendChild(bankWrap);
    }
  }
  function refreshFill(ex, idx) {
    var ui = $('aui'); if (ui) { ui.innerHTML = ''; renderFill(ex, idx, ui, !!S.checked[idx]); }
  }

  /* ----- terminal ----- */
  function renderTerminal(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var box = el('div', 'term');
    var out = el('div', 'term-out');
    out.id = 'tout' + idx;
    var html = '<span class="muted">' + esc(ex.motd) + '</span>\n';
    (ans.hist || []).forEach(function (h) {
      html += '<div><span class="ps1">' + esc(ex.prompt) + '</span> <span class="cmd">' + esc(h.c) + '</span></div>';
      html += h.o;
    });
    out.innerHTML = html;
    out.scrollTop = out.scrollHeight;
    box.appendChild(out);
    var row = el('div', 'term-in');
    row.appendChild(el('span', 'ps1', ex.prompt));
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.disabled = checked;
    inp.setAttribute('aria-label', 'Terminal command input');
    inp.spellcheck = false;
    row.appendChild(inp);
    box.appendChild(row);
    ui.appendChild(box);
    if (!checked) {
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          var c = inp.value.trim();
          if (!c) return;
          var o = runTerm(ex, c);
          inp.value = '';
          if (o.indexOf('clearflag') !== -1) {
            ans.hist = [];
            out.innerHTML = '<span class="muted">' + esc(ex.motd) + '</span>';
            return;
          }
          ans.hist.push({ c: c, o: o });
          ans.last = c;
          S.ans[idx] = ans;
          var d = document.createElement('div');
          d.innerHTML = '<div><span class="ps1">' + esc(ex.prompt) + '</span> <span class="cmd">' + esc(c) + '</span></div>' + o;
          out.appendChild(d);
          out.scrollTop = out.scrollHeight;
        }
      });
    }
    ui.appendChild(el('p', 'small muted', 'Tip: press Enter to run each command. ' + (checked ? '' : 'Check grades every task — run one command per task, then Check.')));
  }
  function runTerm(ex, c) {
    var low = c.toLowerCase();
    function out(s, cls) { return '<div class="' + (cls || '') + '">' + s + '</div>'; }
    if (/^(clear)$/.test(low)) return '<div class="clearflag"></div>';
    /* task commands are recognised first, so pipelines like "ls … | wc -l" are not eaten by built-ins */
    for (var t = 0; t < ex.tasks.length; t++) {
      for (var a = 0; a < ex.tasks[t].accept.length; a++) {
        if (new RegExp(ex.tasks[t].accept[a], 'i').test(c)) return out(esc(ex.tasks[t].okOut));
      }
    }
    if (/^ls\b/.test(low)) return out(esc(ex.lsOut));
    if (/^pwd$/.test(low)) return out(esc(ex.cwd));
    if (/^cat\s+(\S+)$/.test(low)) {
      var f = c.split(/\s+/)[1];
      if (ex.catMap && ex.catMap[f] !== undefined) return out(esc(ex.catMap[f]));
      return out("cat: " + esc(f) + ": No such file or directory", 'err');
    }
    if (/^help$/.test(low)) return out(esc(ex.helpOut));
    if (/^cd\b/.test(low)) return out('');
    var tool = low.split(/\s+/)[0];
    if (ex.tools && ex.tools.indexOf(tool) !== -1) {
      return out(esc(tool + ': wrong usage — check the required arguments.'), 'err');
    }
    return out(esc(ex.shellName) + ": " + esc(tool) + ": command not found", 'err');
  }

  /* ----- spot the mistake ----- */
  function renderSpot(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var fb = S.fb[idx];
    var box = el('div', 'lines');
    ex.lines.forEach(function (L, li) {
      var b = el('button', 'sline');
      b.type = 'button';
      var sel = (ans || []).indexOf(li) !== -1;
      var cls = 'sline';
      if (sel && !fb) cls += ' sel';
      if (fb) {
        if (ex.bad.indexOf(li) !== -1 && sel) cls += ' ok';
        else if (ex.bad.indexOf(li) !== -1) cls += ' miss';
        else if (sel) cls += ' bad';
      }
      b.className = cls;
      b.innerHTML = '<span class="ln">' + (li + 1) + '</span><span>' + esc(L) +
        (fb && ex.bad.indexOf(li) !== -1 ? '<span class="swhy">⚠ ' + esc(ex.whys[li]) + '</span>' : '') +
        (fb && ex.bad.indexOf(li) === -1 && sel ? '<span class="swhy">✓ this line is fine</span>' : '') +
        '</span>';
      b.setAttribute('aria-label', 'Line ' + (li + 1) + (sel ? ', marked' : ''));
      if (!checked) {
        b.addEventListener('click', function () {
          var a = getAns(ex) || [];
          var p = a.indexOf(li);
          if (p === -1) a.push(li); else a.splice(p, 1);
          S.ans[idx] = a;
          renderExercise();
        });
      } else { b.disabled = true; }
      box.appendChild(b);
    });
    ui.appendChild(box);
  }

  /* ----- branch ----- */
  function renderBranch(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var fb = S.fb[idx];
    ex.nodes.forEach(function (nd, ni) {
      var reached = ni === 0 || ans[ni - 1] !== undefined;
      if (!reached) return;
      var nv = el('div', 'node');
      nv.appendChild(el('div', 'nq', 'Step ' + (ni + 1) + ' — ' + nd.q));
      nd.opts.forEach(function (o, oi) {

        b.type = 'button';
        b.style.width = '100%';
        b.innerHTML = o[0];

          b.style.borderColor = o[1] === 1 ? 'var(--good)' : 'var(--bad)';
          b.style.background = o[1] === 1 ? 'var(--good-bg)' : 'var(--bad-bg)';
        }
        if (checked && fb) {
          if (o[1] === 1) { b.style.borderColor = 'var(--good)'; }
          b.disabled = true;
        }
        if (!checked && !fb) {
          b.addEventListener('click', function () {
            var a = getAns(ex);
            a[ni] = oi;
            S.ans[idx] = a;
            renderExercise();
          });

        nv.appendChild(b);
        if (chosen) {
          var oc = el('div', 'outcome ' + (o[1] === 1 ? 'g' : 'b'));
          oc.innerHTML = (o[1] === 1 ? '<span class="ico g">✓</span> ' : '<span class="ico b">✗</span> ') + o[2];
          nv.appendChild(oc);
        }

      ui.appendChild(nv);
    });

    if (ckb) branchCheckState(ckb);
  }
  function branchCheckState(ckb) {
    var ex = curEx(), ans = getAns(ex);
    var complete = ex.nodes.every(function (_, ni) { return ans[ni] !== undefined; });
    ckb.disabled = !complete;
    ckb.title = complete ? '' : 'Answer every step first';
  }

  /* ----- match the pairs ----- */
  function renderMatch(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var fb = S.fb[idx];
    var wrap = el('div', 'matchwrap');

    var left = el('div', 'mcol');
    left.appendChild(el('h3', null, 'Prompts'));
    for (var i = 0; i < ex.pairs.length; i++) {
      (function (pi) {
        var st = fb && fb.pairStates ? fb.pairStates[pi] : null;
        var row = el('div', 'mrow' + (st ? ' ' + st : ''));
        row.appendChild(el('span', 'mlabel', ex.pairs[pi][0]));
        var slot = el('button', 'mslot');
        slot.type = 'button';
        var got = ans[pi];
        slot.innerHTML = (got === undefined || got === null)
          ? '<span class="zonehint">— pick a match —</span>'
          : esc(rightText(ex, got));
        slot.setAttribute('aria-label', 'Match slot for ' + ex.pairs[pi][0] +
          ((got === undefined || got === null) ? ', empty' : ', set to ' + rightText(ex, got)));
        if (st) slot.classList.add(st);
        if (checked) { slot.disabled = true; }
        else {
          slot.addEventListener('click', function () {
            if (mPick.ex === idx && mPick.right >= 0) {
              var a = getAns(ex);
              Object.keys(a).forEach(function (kk) { if (a[kk] === mPick.right) delete a[kk]; });
              a[pi] = mPick.right;

            }
          });
          slot.addEventListener('dragover', function (e) { e.preventDefault(); slot.classList.add('over'); });
          slot.addEventListener('dragleave', function () { slot.classList.remove('over'); });
          slot.addEventListener('drop', function (e) {
            e.preventDefault(); slot.classList.remove('over');
            var d = e.dataTransfer.getData('text/plain');
            if (d && d.indexOf('match:') === 0) {
              var r = parseInt(d.slice(6), 10);
              if (!isNaN(r)) {
                var a2 = getAns(ex);
                Object.keys(a2).forEach(function (kk) { if (a2[kk] === r) delete a2[kk]; });
                a2[pi] = r;
                mPick = { ex: -1, right: -1 };
                refreshMatch(ex, idx);
              }
            }
          });
        }
        row.appendChild(slot);
        left.appendChild(row);
      })(i);
    }
    wrap.appendChild(left);
    /* right column: shuffled pool of answers + decoys */
    var right = el('div', 'mcol');

    var bank = el('div', 'mbank');

      bank.appendChild(c);

    right.appendChild(bank);
    wrap.appendChild(right);
    ui.appendChild(wrap);
  }
  function refreshMatch(ex, idx) {
    var ui = $('aui'); if (ui) { ui.innerHTML = ''; renderMatch(ex, idx, ui, !!S.checked[idx]); }
  }

  /* ----- prioritization ----- */
  function renderPrio(ex, idx, ui, checked) {
    var ans = getAns(ex);
    var fb = S.fb[idx];
    var rows = el('div', 'prorows');
    cache(ex).prioOrder.forEach(function (ii) {
      var it = ex.items[ii];
      var st = fb && fb.rankStates ? fb.rankStates[ii] : null;
      var r = el('div', 'prow' + (st ? ' ' + st : ''));

      for (var p = 1; p <= ex.items.length; p++) {
        var lab = p + ' — ' + (ex.scale && ex.scale[p - 1] ? ex.scale[p - 1] : 'Priority ' + p);
        opts += '<option value="' + p + '"' + (ans[ii] === p ? ' selected' : '') + '>' + esc(lab) + '</option>';
      }

        sel.addEventListener('change', function () {
          var a = getAns(ex);
          var v = sel.value === '' ? null : parseInt(sel.value, 10);
          if (v !== null) {

            a[ii] = v;
          } else { delete a[ii]; }

      }
      r.appendChild(el('span', 'plabel', it[0]));
      r.appendChild(sel);
      rows.appendChild(r);
    });
    ui.appendChild(rows);
    ui.appendChild(el('p', 'small muted', 'Give every item its own priority rank, then Check. Rank 1 is the most urgent.'));
  }
  function refreshPrio(ex, idx) {
    var ui = $('aui'); if (ui) { ui.innerHTML = ''; renderPrio(ex, idx, ui, !!S.checked[idx]); }
  }

  /* ---------- actions ---------- */
  function buildFeedback(ex, idx) {
    var fb = S.fb[idx];
    var f = el('div', 'fb');
    f.setAttribute('tabindex', '-1');
    var frac = fb.frac || 0, v, ic;
    if (frac >= 0.999) { v = 'Correct'; ic = '<span class="ico g">✓</span>'; }
    else if (frac > 0) { v = 'Partially correct'; ic = '<span class="ico w">⚠</span>'; }
    else { v = 'Wrong'; ic = '<span class="ico b">✗</span>'; }
    f.appendChild(el('div', 'verdict', ic + ' <b>' + v + '</b> — <span class="pscore">You earned ' + S.earned[idx] + ' / ' + PTS + ' points</span>' +
      (S.hint[idx] ? ' <span class="muted small">(hint used: −10%)</span>' : '')));
    var ul = el('ul');
    (fb.els || []).forEach(function (e2) {
      var ico = e2.state === 'ok' ? '<span class="ico g">✓</span>'
        : e2.state === 'bad' ? '<span class="ico b">✗</span>'
        : '<span class="ico w">⚠</span>';
      ul.appendChild(el('li', null, ico + ' <b>' + e2.name + '</b> — ' + e2.note));
    });
    f.appendChild(ul);
    var dt = el('details', 'expbox');
    dt.open = true;
    dt.appendChild(el('summary', null, 'Explanation — open or close'));
    dt.appendChild(el('div', 'exp', ex.explain));
    f.appendChild(dt);
    return f;
  }
  function doCheck() {
    var ex = curEx(), idx = curIdx();
    var res = validate(ex, getAns(ex));
    var pts = pointsFor(idx, res.frac);
    S.frac[idx] = res.frac;
    S.earned[idx] = pts;
    S.checked[idx] = true;
    delete S.skipped[idx];
    /* extra per-type fb state for re-render */
    var fbx = { els: res.els, your: res.your, correct: res.correct, frac: res.frac };
    if (ex.type === 'categorize') {
      fbx.itemStates = {};
      ex.items.forEach(function (it) { fbx.itemStates[it[0]] = (getAns(ex)[it[0]] === it[2]) ? 'ok' : 'bad'; });
    }
    if (ex.type === 'order') {
      var a = getAns(ex);
      fbx.posStates = a.map(function (v, p) { return v === p; });
    }
    if (ex.type === 'fill') {
      fbx.blankStates = {};
      Object.keys(ex.blanks).forEach(function (b) { fbx.blankStates[b] = (getAns(ex)[b] === ex.blanks[b][0]) ? 'ok' : 'bad'; });
    }
    if (ex.type === 'match') {
      fbx.pairStates = {};
      var am = getAns(ex);
      for (var pm = 0; pm < ex.pairs.length; pm++) {
        var gm = am[pm];
        fbx.pairStates[pm] = gm === pm ? 'ok' : (gm === undefined || gm === null ? 'miss' : 'bad');
      }
    }
    if (ex.type === 'prio') {
      fbx.rankStates = {};
      var ap = getAns(ex);
      ex.items.forEach(function (it, pi) {
        var gp = ap[pi];
        fbx.rankStates[pi] = gp === it[1] ? 'ok' : (gp === undefined || gp === null ? 'miss' : 'bad');
      });
    }
    S.fb[idx] = fbx;
    S.checkPause = true;   /* review mode: the clock freezes until Next (or leaving the exercise) */
    pick = { ex: -1, item: null };
    armedBlank = null;
    mPick = { ex: -1, right: -1 };
    renderNav(); renderThemes(); renderExercise('feedback');
    var v = res.frac >= 0.999 ? 'Correct' : (res.frac > 0 ? 'Partially correct' : 'Wrong');
    var sr = $('srlive');
    if (sr) sr.textContent = 'Checked: ' + v + '. You earned ' + pts + ' of ' + PTS + ' points on this exercise. Timer paused in review mode until you press Next.';
  }
  function doRevise(idx) {
    /* Unlocks the answer for editing. The review pause is intentionally kept:
       the timer stays frozen through Revise, editing and the next Check —
       only Next (or leaving the exercise) restarts it. */
    delete S.checked[idx]; delete S.earned[idx]; delete S.frac[idx]; delete S.fb[idx];
    renderNav(); renderThemes(); renderExercise();
  }
  function doSkip() {
    var idx = curIdx();
    S.skipped[idx] = true;
    S.checkPause = false;
    if (S.cur < N - 1) { S.cur++; renderNav(); renderExercise('top'); }
    else openSubmit();
  }
  function doHint(idx) {
    S.hint[idx] = true;
    renderExercise();
  }
  function nextOrSubmit() {
    S.checkPause = false;
    if (S.cur < N - 1) { S.cur++; renderNav(); renderExercise('top'); }
    else openSubmit();
  }
  var modalEl = null;
  function openSubmit() {
    if (S.submitted) return;
    if (modalEl) return;   /* never stack submit dialogs */
    var answered = Object.keys(S.checked).length;
    var skippedC = Object.keys(S.skipped).length;
    var ov = el('div', 'overlay');
    modalEl = ov;
    var m = el('div', 'modal');
    m.appendChild(el('h2', null, 'Submit the exam?'));
    m.appendChild(el('p', null, 'Answered & checked: <b>' + answered + '</b> • Skipped: <b class="pt">' + skippedC + '</b> • Never checked: <b>' + (N - answered - skippedC) + '</b>'));
    m.appendChild(el('p', 'small muted', 'Skipped and never-checked exercises are excluded from scoring — from both your points and the maximum. You can still go back and finish them while the timer runs.'));
    if (answered === 0) {
      m.appendChild(el('p', null, '<span class="ico b">✗</span> <b>You must answer at least one exercise before submitting.</b>'));
    }
    var acts = el('div', 'exactions');
    acts.appendChild(btn('↩ Keep working', 'ghost', function () { if (modalEl && modalEl.parentNode) modalEl.parentNode.removeChild(modalEl); modalEl = null; }));
    var firstOpen = -1;
    S.order.forEach(function (exIdx, pos) { if (firstOpen === -1 && !S.checked[exIdx]) firstOpen = pos; });
    if (firstOpen !== -1) {
      acts.appendChild(btn('→ Go to first unfinished', 'warnb', function () { if (modalEl && modalEl.parentNode) modalEl.parentNode.removeChild(modalEl); modalEl = null; goto(firstOpen); }));
    }
    var sb = btn('🏁 Submit final results', 'pri', function () {
      if (modalEl && modalEl.parentNode) modalEl.parentNode.removeChild(modalEl);
      modalEl = null;
      finishExam(false);
    });
    if (answered === 0) sb.disabled = true;
    acts.appendChild(sb);
    m.appendChild(acts);
    ov.appendChild(m);
    document.body.appendChild(ov);
  }

  function timeUp() {
    if (S.submitted) return;
    finishExam(true);
  }
  function finishExam(timeUpFlag) {
    S.submitted = true;
    if (S.tick) clearInterval(S.tick);
    if (modalEl && modalEl.parentNode) modalEl.parentNode.removeChild(modalEl);
    modalEl = null;
    S.checkPause = false; S.manual = false;
    showResults(timeUpFlag);
  }

  /* ---------- results ---------- */
  function showResults(timeUpFlag) {
    root.innerHTML = '';
    var w = el('div', 'wrap');
    var answeredIdx = [];
    S.order.forEach(function (exIdx) { if (S.checked[exIdx]) answeredIdx.push(exIdx); });
    var sumPts = 0, sumFrac = 0;
    answeredIdx.forEach(function (i) { sumPts += S.earned[i]; sumFrac += (S.frac[i] || 0); });
    var rounded = Math.round(sumFrac);
    var total = answeredIdx.length;
    var percent = total ? Math.round((rounded / total) * 100) : 0;
    var passed = total > 0 && percent >= PASS;
    /* header */
    var cp = el('div', 'certpanel' + (passed ? '' : ' failp'));
    cp.appendChild(el('p', null, timeUpFlag ? '<b>Time expired.</b> Here is your result on what you completed:' : 'Final result:'));
    var big = el('div', 'big ' + (passed ? 'pass' : 'fail'));
    big.id = 'bigpct';
    big.textContent = '0%';
    cp.appendChild(big);
    cp.appendChild(el('p', null, '<b>' + r1(sumPts) + '</b> points of ' + (PTS * N) + ' maximum • scored over <b>' + total + '</b> answered exercise' + (total === 1 ? '' : 's') + ' • pass mark ' + PASS + '%'));
    cp.appendChild(el('h2', passed ? 'pass' : 'fail', passed ? '✔ PASS — ' + D.meta.sevLabel + ' exam cleared' : '✘ FAIL — you must retake this exam'));
    cp.appendChild(el('p', 'muted', passed
      ? 'Certificate-style credit: you demonstrated command of the Cloud+ 2.3 workload-migration keywords at ' + D.meta.sevLabel.toLowerCase() + ' severity.'
      : 'Focus on the red rows below, then use Retake — the questions reshuffle.'));
    var acts = el('div', 'exactions');
    acts.style.justifyContent = 'center';
    acts.appendChild(btn('⟲ Retake exam', 'pri', function () { showIntro(); }));
    cp.appendChild(acts);
    w.appendChild(cp);
    /* skipped / excluded list */
    var skippedList = S.order.filter(function (i) { return !S.checked[i]; });
    if (skippedList.length) {
      var skc = el('div', 'card');
      skc.appendChild(el('h2', null, 'Excluded from scoring (' + skippedList.length + ')'));
      skc.appendChild(el('p', 'small muted', 'These were skipped or never checked, so they are not counted: their points are removed from BOTH your score and the maximum. Their explanations are still shown below so you can learn from them.'));
      var chips = el('div', 'skipchips');
      S.order.forEach(function (exIdx, pos) {
        if (!S.checked[exIdx]) chips.appendChild(el('span', 'kw', 'Q' + (pos + 1) + ' — ' + D.exercises[exIdx].title));
      });
      skc.appendChild(chips);
      w.appendChild(skc);
    }
    /* per-exercise report */
    var rep = el('div', 'card');
    rep.appendChild(el('h2', null, 'Full per-exercise report'));
    S.order.forEach(function (exIdx, pos) {
      var ex = D.exercises[exIdx];
      var checked = !!S.checked[exIdx];
      var fb = S.fb[exIdx];
      var d = el('details', 'rrow');
      var sum = el('summary');
      var lbl, cls;
      if (checked) {
        var f = S.frac[exIdx];
        if (f >= 0.999) { lbl = 'Full'; cls = 'full'; }
        else if (f > 0) { lbl = 'Partial'; cls = 'partial'; }
        else { lbl = 'Zero'; cls = 'zero'; }
      } else if (S.skipped[exIdx]) { lbl = 'Skipped'; cls = 'skipped'; }
      else { lbl = 'Not answered'; cls = 'na'; }
      sum.innerHTML = '<span class="tag ' + cls + '">' + lbl + '</span><b>Q' + (pos + 1) + '</b> <span>' + esc(ex.title) + '</span>' +
        (checked ? '<span class="pt">' + S.earned[exIdx] + ' / ' + PTS + ' pts</span>' : '<span class="muted small">not counted</span>');
      d.appendChild(sum);
      var body = el('div', 'rbody');
      if (checked && fb) {
        body.appendChild(el('p', null, '<b>Your answer:</b> ' + fb.your));
        body.appendChild(el('p', null, '<b>Correct:</b> ' + fb.correct));
        var ul = el('ul');
        fb.els.forEach(function (e2) {
          var ico = e2.state === 'ok' ? '<span class="ico g">✓</span>' : e2.state === 'bad' ? '<span class="ico b">✗</span>' : '<span class="ico w">⚠</span>';
          ul.appendChild(el('li', null, ico + ' <b>' + e2.name + '</b> — ' + e2.note));
        });
        body.appendChild(ul);
        if (S.hint[exIdx]) body.appendChild(el('p', 'small pt', 'Hint used: −10% on this exercise.'));
      } else {
        body.appendChild(el('p', 'muted', 'You did not answer this one. Here is what it wanted:'));
      }
      body.appendChild(el('div', 'exp', ex.explain));
      if (ex.type === 'categorize') {
        var ul2 = el('ul');
        ex.items.forEach(function (it) { ul2.appendChild(el('li', null, '<b>' + it[1] + '</b> → <b>' + zoneLabel(ex, it[2]) + '</b>: ' + it[3])); });
        body.appendChild(ul2);
      }
      if (ex.type === 'order') {
        var ol2 = el('ol');
        ex.items.forEach(function (it) { ol2.appendChild(el('li', null, '<b>' + it[0] + '</b> — ' + it[1])); });
        body.appendChild(ol2);
      }
      if (ex.type === 'match') {
        var ulm = el('ul');
        ex.pairs.forEach(function (p) { ulm.appendChild(el('li', null, '<b>' + p[0] + '</b> → <b>' + p[1] + '</b>: ' + p[2])); });
        body.appendChild(ulm);
      }
      if (ex.type === 'prio') {
        var ulp = el('ol');
        ex.items.slice().sort(function (a, b) { return a[1] - b[1]; }).forEach(function (it) {
          ulp.appendChild(el('li', null, '<b>Rank ' + it[1] + ' — ' + it[0] + '</b>: ' + it[2]));
        });
        body.appendChild(ulp);
      }
      if (ex.type === 'terminal') {
        var ult = el('ul');
        ex.tasks.forEach(function (t) { ult.appendChild(el('li', null, '<b>' + t.name + '</b> — example: <code>' + esc(t.solution) + '</code>')); });
        body.appendChild(ult);
      }
      if (!checked && ex.hint) body.appendChild(el('p', 'small', '<b>Hint was:</b> ' + ex.hint));
      d.appendChild(body);
      rep.appendChild(d);
    });
    w.appendChild(rep);
    root.appendChild(w);
    updatePauseUI();
    /* count-up then fire score exactly once */
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
    function fire() {
      if (S.fired) return;
      S.fired = true;
      reportScore(rounded, total);
    }
    if (reduced || !total) { big.textContent = percent + '%'; fire(); }
    else {
      var t0 = null, DUR = 750;
      requestAnimationFrame(function step(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / DUR);
        big.textContent = Math.round(percent * p) + '%';
        if (p < 1) requestAnimationFrame(step);
        else fire();
      });
    }
  }
  function reportScore(correct, total) {
    /* Opened directly (no parent frame): there is nothing to report to. */
    if (window.parent === window) return;
    var percent = total ? Math.round((correct / total) * 100) : 0;
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: 'cloud-plus',
        score: correct,
        total: total,
        percent: percent,
        passed: total > 0 && percent >= PASS
      }, location.origin);
    } catch (e) {
      /* Opened through a parent whose origin cannot be targeted. Nothing to report to. */
    }
  }

  /* Silent test hooks for sandbox verification: no answers, no logging, no network. */
  window.__EXAM_DEBUG__ = {
    state: function () {
      if (!S) return { phase: 'intro' };
      var sum = 0;
      Object.keys(S.earned).forEach(function (k) { sum += S.earned[k]; });
      var cu = S.order[S.cur];
      return {
        phase: S.submitted ? 'results' : (S.started ? 'exam' : 'intro'),
        cur: S.cur, exId: cu !== undefined ? D.exercises[cu].id : null,
        remaining: S.remaining, manual: !!S.manual, checkPause: !!S.checkPause,
        submitted: !!S.submitted, fired: !!S.fired,
        checkedCount: Object.keys(S.checked).length,
        skippedCount: Object.keys(S.skipped).length,
        score: r1(sum), total: PTS * N, order: S.order.slice()
      };
    },
    setTimeLeft: function (s) { if (S && !S.submitted) S.remaining = s; },
    forceTick: function () { tick(); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
