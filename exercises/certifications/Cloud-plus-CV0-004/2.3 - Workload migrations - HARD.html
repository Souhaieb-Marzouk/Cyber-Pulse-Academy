<script>
window.__EXAM__ = {"meta": {"docTitle": "CompTIA Cloud+ (CV0-004) — 2.3 Workload Migrations — HARD practice exam", "shortTitle": "Cloud+ 2.3 Workload Migrations — HARD", "sevClass": "hard", "sevLabel": "HARD", "blurb": "This exam drills planning and executing migrations to cloud environments at HARD severity: ambiguous artefacts, near-miss answers, cross-evidence reasoning and expert judgment calls.", "typesList": "log analysis with a filter box, scenario questions, multi-select, drag &amp; drop sorting, pair matching with decoys, branching decision paths, fill-the-blanks, a terminal exercise, timeline ordering, risk prioritization, and spot-the-mistake.", "secPerQ": 70, "passMark": 70}, "keywords": [["Strategies", ["Rehost (lift and shift)", "Replatform", "Refactor", "Repurchase", "Retire", "Retain", "Relocate", "P2V / V2V", "IaaS / PaaS / SaaS targets"], "strategies"], ["Planning &amp; governance", ["Discovery (agent / agentless)", "Dependency mapping", "CMDB", "TCO / ROI", "Business case", "Migration waves", "Proof of concept / pilot", "Runbook", "Rollback plan", "Change management (CAB)", "Maintenance window", "RTO", "RPO", "SLA", "Baseline"], "planning"], ["Connectivity &amp; data movement", ["Site-to-site VPN", "Direct connection", "SD-WAN", "Bandwidth", "Latency", "Bulk transport appliance", "Online replication", "Hybrid migration", "WAN optimization", "Migration agent", "Chain of custody", "Schema conversion", "Egress charges"], "movement"], ["Cutover &amp; validation", ["Big bang", "Phased", "Blue-green", "Canary", "Weighted routing", "DNS TTL", "Parallel run", "Freeze / quiesce writes", "Smoke test", "UAT", "Regression test", "Checksum / row count", "Replication lag", "Delta sync", "Soak period", "Go/no-go"], "cutover"], ["Risks &amp; optimization", ["Compatibility", "Vendor lock-in", "Data residency", "GDPR", "Encryption in transit / at rest", "Hardcoded IPs", "Technical debt", "Right-sizing", "BYOL / licence portability", "Idle resources", "Decommissioning", "Data sanitization", "Legal hold", "Split-brain", "Orphaned resources", "Dual-running", "Cost estimation", "Containerization", "Multi-cloud"], "risks"]], "exercises": [{"id": "H01", "type": "logview", "theme": "movement", "title": "Only the big chunks fail", "scenario": "<p><b>Vantage Trading</b> is seeding its 9 TB market-data archive to the cloud. The migration agent on <code>src-etl01</code> (interface <code>bond0</code>) sends data through the edge gateway <code>edge-gw02</code> into the cloud VPN endpoint. The transfer keeps failing for some chunks while others sail through. Two artefacts: the agent log below, and the interface configuration:<br><span class=\"mono\" style=\"color:#9ad6ff\">src-etl01 bond0: mtu 9000 &nbsp;|&nbsp; edge-gw02 wan0: mtu 1500 &nbsp;|&nbsp; cloud VPN endpoint: mtu 1500</span></p>", "question": "<p>Why do only the large chunks fail, and what fixes it?</p>", "log": [["21:04:02", "INFO", "seed job start: 9.1 TB, chunk size auto (up to 64 MB), 12 parallel streams"], ["21:04:03", "INFO", "link probe ok: rtt 22 ms, loss 0.0%, path MTU probe: 1500 reported by gateway hop"], ["21:06:41", "OK", "chunk 0001 (8 MB) shipped, ack 810 ms"], ["21:06:44", "OK", "chunk 0002 (8 MB) shipped, ack 795 ms"], ["21:09:12", "ERROR", "chunk 0017 (64 MB) failed: timeout waiting for ack (retry 1/5)"], ["21:09:44", "ERROR", "chunk 0017 failed: timeout (retry 2/5)"], ["21:10:20", "OK", "chunk 0018 (8 MB) shipped"], ["21:12:03", "OK", "chunk 0019 (16 MB) shipped, ack 1.9 s"], ["21:14:57", "ERROR", "chunk 0017 failed: timeout (retry 3/5) — marking slow-path"], ["21:15:30", "WARN", "fragmentation needed events on gateway edge-gw02 wan0 (14 in last 5 min)"], ["21:18:02", "OK", "chunk 0020 (8 MB) shipped"], ["21:23:15", "ERROR", "chunk 0021 (64 MB) failed: timeout (retry 1/5)"], ["21:26:40", "INFO", "agent health: cpu 18%, mem 31%, disk noq 0.2 — agent not saturated"], ["21:27:02", "DEBUG", "payload checksums verified locally before send — data intact at sender"]], "q": {"type": "single", "options": [["o1", "The agent is undersized and times out on large payloads; move to a bigger instance", 0, "The DEBUG and health lines show the agent idle (18% CPU). And the failure pattern follows chunk size, not load — sizing is not the cause."], ["o2", "Path MTU mismatch: the source sends jumbo (9000) frames while the gateway and VPN path carry 1500; large segments get dropped instead of cleanly fragmented. Clamp MSS / set MTU 1500 (or enable path discovery end to end)", 1, "Small chunks fit inside 1500 and succeed; 64 MB chunk streams push full-size segments that die at the 1500-byte hop, and the gateway logs “fragmentation needed”. The evidence across both artefacts — size-dependent failures plus the gateway counter — points exactly there."], ["o3", "Provider egress throttling kicks in after 5 GB and drops only big transfers", 0, "Throttling would show as slowed throughput on everything after a threshold, not size-specific timeouts from minute one. The probe at 21:04 already reported the path."], ["o4", "Clock skew between source and target breaks the TLS handshake for large records", 0, "TLS handshakes are size-independent, and small chunks complete over the same session. Skew would fail everything, not just 64 MB chunks."]]}, "hint": "Correlate the two artefacts: which counter does the gateway log, and what is the only property that separates failing chunks from succeeding ones?", "explain": "<p>The giveaway is the pattern: 8 MB and 16 MB chunks always succeed, 64 MB chunks always time out, the agent is idle, and the gateway reports “fragmentation needed”. That is a path MTU mismatch: the source interface speaks jumbo frames (MTU 9000) while the gateway and VPN path carry 1500-byte frames, so full-size segments are discarded (ICMP “fragmentation needed” often filtered, which makes it worse). The fix is to align MTU (1500) or clamp the TCP MSS / run proper path MTU discovery end to end. This is why seed transfers get a link-acceptance test with production-sized packets before the clock starts.</p><p><b>Focus on:</b> size-dependent failures + a “fragmentation needed” counter = MTU. WAN optimization would not have fixed this; neither would a bigger agent.</p>"}, {"id": "H02", "type": "single", "theme": "strategies", "title": "The obvious answer is wrong", "scenario": "<p><b>Northwind Manufacturing</b> assesses its inventory-analytics workload. Telemetry: CPU 8%, memory 30%, but storage IOPS at 95% of the source system’s provisioned peak, with a stated requirement of 8 ms write latency for the ingest pipeline. The app is a supported, actively developed product.</p>", "question": "<p>What does the assessment actually recommend?</p>", "options": [["o1", "Rehost with identical specs — CPU and memory match the source, so the workload is like-for-like", 0, "This is the trap. Matching CPU and memory ignores the dimension that is actually under stress: IOPS and write latency. A like-for-like VM would arrive undersized where it matters."], ["o2", "Replatform: rehost the app but move the database onto a higher-IOPS managed volume tier sized to the measured IOPS, and shrink the compute part", 1, "The evidence says compute is oversized (8% CPU) while storage is at its ceiling (95% of provisioned IOPS, 8 ms latency requirement). Replatforming the storage layer onto the right performance tier while right-sizing compute follows the telemetry exactly."], ["o3", "Repurchase: buy the vendor’s SaaS analytics edition instead", 0, "No SaaS edition of this product is in evidence, and the ingest pipeline’s latency requirement is custom. Inventing a product change from telemetry alone is not assessment practice."], ["o4", "Retain: telemetry this close to the ceiling means the workload must stay on-prem", 0, "Being near a performance ceiling is a sizing problem, not a blocker. Cloud storage tiers exist precisely for high-IOPS profiles; retaining throws away an otherwise straightforward move."]], "hint": "Which resource dimension is at 95%, and which is at 8%? The strategy must serve the stressed dimension.", "explain": "<p>Assessment is dimensional: CPU 8% and memory 30% say compute is plentiful, while storage at 95% of provisioned IOPS with an 8 ms write-latency requirement says the disk layer is the constraint. The correct recommendation replatforms the storage onto a higher-IOPS managed volume while right-sizing compute down — cost drops, the constraint is solved. The “identical specs” rehost is the classic near-miss: it copies the wrong numbers. Repurchase invents a product swap and retain misreads a sizing problem as a blocker.</p><p><b>Focus on:</b> let the stressed dimension drive the strategy — and expect the obvious like-for-like answer to be the distractor.</p>"}, {"id": "H03", "type": "multi", "theme": "planning", "title": "Wave-1 blockers at Meridian Health", "scenario": "<p><b>Meridian Health Insurance</b> assessed 40 workloads. The wave-1 candidate list contains the claims platform and its surroundings. Eight findings came back from discovery (agent-based and agentless scans plus a manual config review).</p>", "question": "<p>Select every finding that BLOCKS moving that application in wave 1 until it is remediated.</p>", "options": [["b1", "The claims app has two on-prem service IPs hardcoded in its config files", 1, "Hardcoded IPs break the moment the dependency changes address. They must be replaced with DNS names or virtual endpoints before any move — a genuine blocker."], ["b2", "The claims app runs on Windows Server 2008, which the cloud platform does not support and which receives no patches", 1, "An unsupported OS is a compatibility failure first: no cloud image support, no security patching, likely licence non-compliance. It forces replatform/upgrade or retain — a blocker for a straight move."], ["b3", "The pharmacy licensing server binds its licence to the hardware MAC address, and the licence has no mobility rights", 1, "A MAC-bound licence without mobility rights dies on a new virtual NIC. Until the vendor re-arms or grants mobility, the server cannot move."], ["b4", "The claims database is shared by the legacy reporting app, which the program plans to retain on-prem", 1, "A shared database splits the estate: one consumer moves, one stays, so the database cannot move with wave 1 without splitting traffic across the link — an architectural blocker for this wave."], ["b5", "The claims intake API requires 20 ms response times; the measured office-to-cloud path is 45 ms", 1, "A hard latency requirement the target path cannot meet is a blocker until the path (direct connection, region choice, placement) changes. Shipping it anyway would breach the SLA on day one."], ["b6", "The intranet CMS is a standard containerized stateless web app with no special dependencies", 0, "This is the poster child of readiness, not a blocker: stateless, containerized, dependency-free — it could lead the wave."], ["b7", "Monitoring agents on the staging copies report normally", 0, "Normal monitoring is good news, not a blocker. This finding changes nothing about the go decision."], ["b8", "Two developers requested larger dev VMs for build performance", 0, "A capacity request is routine sizing housekeeping — resolved by right-sizing, never a wave blocker."]], "hint": "Five findings stop the wave; three are routine observations. Dependency, platform support, licence, shared data, latency — that is the blocker family.", "explain": "<p>Blockers are findings that make the move fail or break rules if executed: hardcoded IPs (silent breakage), unsupported OS (a compatibility failure as much as a security one), MAC-bound licensing without mobility (licence death on new hardware — that licensing server is a hardware-bound, physical-era app that would need a P2V conversion plus a licence re-arm even after mobility is granted), a shared database straddling the retain/migrate boundary (split estate), and a latency requirement the path cannot meet (SLA breach). The non-blockers are routine: a clean containerized CMS is an ideal early mover, healthy monitoring is reassurance, and dev VM sizing is ordinary housekeeping. Wave gating means every blocker gets an owner and a remediation date before the wave is scheduled — the same evidence discipline the landing-zone PoC proved for the tooling.</p><p><b>Focus on:</b> dependency mapping exists precisely to surface blockers like shared databases and hardcoded IPs before cutover night.</p>"}, {"id": "H04", "type": "categorize", "theme": "strategies", "title": "Strategies with near-misses", "scenario": "<p>The <b>Northwind</b> architecture board reviews nine one-line proposals. Several are deliberately close to their neighbours — read the change each one actually makes.</p>", "question": "<p>Classify each proposal into the strategy it really is.</p>", "zones": [["z_rehost", "Rehost"], ["z_replat", "Replatform"], ["z_refac", "Refactor"], ["z_rebuy", "Repurchase"], ["z_retire", "Retire"], ["z_retain", "Retain"], ["z_reloc", "Relocate"]], "items": [["i1", "Move 300 VMs as-is onto same-size cloud instances", "z_rehost", "No application change, same size — an IaaS-style pure lift and shift (rehost), the fastest path with the least benefit per VM."], ["i2", "Move the app VMs but swap self-managed MySQL for the provider’s managed MySQL; config change only", "z_replat", "Same engine, managed service (a PaaS-style component swap), config-level change. That is replatform — the managed swap is the signature."], ["i3", "Split the monolith into microservices behind an API gateway with event-driven queues", "z_refac", "Architecture rewritten. Refactor, the most expensive and most cloud-native option."], ["i4", "Drop the self-hosted ticketing tool and adopt a SaaS ticketing suite, exporting history", "z_rebuy", "A different product replaces the old one — repurchase."], ["i5", "Decommission the duplicate test environment nobody has logged into for two years", "z_retire", "Nothing needs it. Not migrating is the cheapest strategy: retire."], ["i6", "Keep the payroll engine on certified hardware until 2028, then reassess", "z_retain", "A dated, deliberate keep-on-prem decision with a review point — retain."], ["i7", "Move Oracle to managed PostgreSQL with a full rewrite of 400 SQL procedures", "z_refac", "The near-miss: an engine change PLUS a code rewrite is refactoring. Managed-service alone would be replatform; the 400-procedure rewrite makes it refactor."], ["i8", "Move the file server VM unchanged but attach a managed SMB share instead of the old local disks", "z_replat", "The second near-miss: the VM is untouched, a storage component is swapped for a managed one — a component-level change is replatform, not rehost."], ["i9", "Move VMs from the on-prem VMware cluster into the provider’s VMware Cloud service with zero conversion", "z_reloc", "Same hypervisor on both sides, zero conversion — relocate, the hypervisor-layer move (a V2V-style move with no image work at all)."]], "hint": "Ask: does the application change (refactor), does a component swap (replatform), does nothing change (rehost/relocate), does the product change (repurchase), or does the need change (retire/retain)?", "explain": "<p>The near-misses are the point. Replatform means component-level swaps (managed database, managed file share) with the application logic intact; refactor means the application or its code meaningfully changes (microservice split, 400-procedure rewrite). Rehost changes nothing; relocate changes nothing because the same hypervisor exists in the cloud (zero conversion, a V2V-style move). Repurchase replaces the product; retire and retain are decisions about need, not technology. Pricing follows the same ladder: rehost and relocate are cheapest per workload, refactor the most expensive.</p><p><b>Focus on:</b> where the change happens — code (refactor), component (replatform), platform only (rehost/relocate), product (repurchase).</p>"}, {"id": "H05", "type": "branch", "theme": "cutover", "title": "Blue-green cutover for the order gateway", "scenario": "<p><b>Vantage Trading</b> cuts over its order-routing gateway during the Saturday maintenance window 22:00–02:00. The SLA requires p95 latency under 20 ms from the trading floor; the runbook forbids split-brain order flow (orders must never be split across two active stacks). Blue (on-prem) and green (cloud) stacks are built; blue stays warm throughout.</p>", "question": "<p>Work the four decisions in order.</p>", "nodes": [{"q": "21:30 — before any client traffic, what proves green is ready?", "opts": [["Replay synthetic transactions against green from the trading floor while measuring p95 latency", 1, "Correct. Synthetic replay with latency measurement is the cutover pilot: it proves behaviour AND the SLA dimension under realistic conditions."], ["Confirm the deployment pipeline logged “deploy complete”", 0, "A deploy log proves delivery, not behaviour. Green could boot perfectly and still fail its first FIX session."], ["Check that green’s VMs are idle and healthy", 0, "Idle health proves nothing about order routing. Only transactions measure a transaction system."]]}, {"q": "22:40 — green p95 is 18 ms in synthetic tests. How do you switch?", "opts": [["Blue-green flip: point the gateway VIP at green in one move, blue stays warm for instant fallback", 1, "Correct. The runbook forbids split order flow, so canary percentage-splitting is out; a flip with a warm blue is the pattern that matches both the integrity rule and the instant-rollback need."], ["Canary: route 5% of orders to green and step up gradually", 0, "That splits live order flow across two stacks — exactly the split-brain the runbook forbids. Canary suits read-heavy or idempotent traffic, not order integrity."], ["Big bang: shut blue down and reconfigure every client to green", 0, "No instant fallback, guaranteed downtime window, and client reconfiguration on a Saturday night. The plan exists to avoid precisely this."]]}, {"q": "23:10 — flipped. About 1% of FIX sessions fail to reconnect because of client-side session caching. Call?", "opts": [["Fail back to blue now, fix session persistence on green, reschedule", 1, "Correct. Blue is warm precisely for this moment: instant fallback, then fix the cause calmly instead of debugging live during a revenue-critical window."], ["Phone every affected client and walk them through flushing sessions", 0, "Clients cannot be a mitigation step. You would be shipping the outage to customers and making them the QA team."], ["Declare success and disconnect blue — 99% reconnects is fine", 0, "A 1% failure on order routing is broken orders. And disconnecting blue destroys the rollback path you are about to need."]]}, {"q": "23:30 — failed back cleanly, blue is stable. What closes the night properly?", "opts": [["Root-cause the session persistence, re-run the synthetic suite, and take the evidence to the CAB for a new window", 1, "Correct. Change management closes the loop: cause fixed, tests green, CAB approves the next window with evidence instead of hope."], ["Delete the green stack tonight to stop its cost", 0, "Green is both evidence and the next attempt’s asset. Deleting it also destroys the diagnostic state you need for root cause."], ["Extend the window quietly and retry at 01:00 without approvals", 0, "The CAB owns the window. An unapproved retry of a just-failed cutover is how one incident becomes two."]]}], "hint": "The runbook constraint decides everything: no split order flow, blue stays warm, change management closes the night.", "explain": "<p>Blue-green cutover buys one thing: instant, whole-stack fallback. That is why it fits transactional systems with integrity rules (no split order flow — which also rules out canary percentage-splits) and tight SLAs. The gates: prove green with synthetic latency tests (the pilot), flip at the VIP, fail back instantly on any defect, and close the incident through change management — root cause, re-test, CAB-approved reschedule. The pattern’s cost is dual-running, which the TCO must have carried.</p><p><b>Focus on:</b> matching the cutover pattern to the traffic’s integrity requirements, not to preference.</p>"}, {"id": "H06", "type": "fill", "theme": "risks", "title": "Write the residency exception memo", "scenario": "<p><b>Meridian Health</b> must stage the EU claims dataset for 14 days in a region outside the approved list to complete a tooling migration. The CISO requires a formal exception memo. The draft is missing its key terms.</p>", "question": "<p>Complete the memo with the correct terms. Some bank words are decoys.</p>", "text": "The staging region cannot meet the approved-region list for 14 days. The memo requests a time-boxed exception with (1) [[1]] controls: full encryption at rest with customer-managed keys, restricted access and daily audits. The risk owner signs formal (2) [[2]] acceptance. All transfers remain (3) [[3]] in transit end to end. Access is limited to named (4) [[4]] engineers with session recording. The exception expires automatically and is reviewed by the (5) [[5]] at its next board.", "blanks": {"1": ["compensating", "Compensating controls are the alternative safeguards you deploy when the primary control (approved region) cannot be met. They are what make an exception defensible."], "2": ["risk", "Formal risk acceptance puts a named owner behind the residual risk, in writing, with an expiry — never a silent deviation."], "3": ["encrypted", "Encryption in transit stays mandatory during any exception: the data moving between regions is still regulated personal data."], "4": ["migration", "Access is narrowed to the named migration engineers performing the work — least privilege for the exception window."], "5": ["change", "The exception itself is a change: the change advisory board (CAB) reviews and closes it at its next board, so exceptions cannot quietly become permanent."]}, "bank": ["compensating", "risk", "encrypted", "migration", "change", "public", "egress", "retention"], "hint": "Every blank is a governance word. The five together are: alternative controls, named acceptance, protected transport, narrowed access, and a board that closes it.", "explain": "<p>A defensible residency exception (this is GDPR territory) has five parts: compensating controls that substitute real safeguards for the broken requirement (encryption at rest with customer keys, restricted access, audits); formal risk acceptance by a named owner; continued encryption in transit for every transfer; least-privilege access limited to the named migration engineers; and change-management closure — the CAB reviews the expired exception so it cannot become permanent. The decoys are governance-sounding but wrong: “public” is the opposite of the access model, egress is a cost term, and retention schedules do not authorise anything.</p><p><b>Focus on:</b> exceptions are time-boxed, owned, compensated and reviewed — or they are just violations with paperwork.</p>"}, {"id": "H07", "type": "terminal", "theme": "cutover", "title": "Verify the shipped dataset and isolate the failures", "scenario": "<p><b>Northwind</b> shipped a bulk transport appliance back from the vendor; its 1.8 TB payload was ingested to <code>/staging/inbound</code>. A manifest of per-file SHA-256 hashes, <code>MANIFEST.sha256</code>, was generated on the source before shipping and sits in the same directory. Your working directory is <code>/staging/inbound</code>. One file is known to differ — the handover protocol needs its name on a short re-ship list, not buried in a full listing.</p>", "question": "<p>Two operational goals, in one shell session:</p><p>(1) Batch-check every file listed in the manifest against its recorded hash and surface any mismatch. (2) Produce the short re-ship list: only the entries that did <b>not</b> pass, with the OK lines filtered away. No sample command is provided — choose the tools, flags and filters yourself.</p>", "motd": "northwind-ingest — appliance payload staging. Type help for basic commands.", "prompt": "north@ingest:/staging/inbound$", "cwd": "/staging/inbound", "lsOut": "MANIFEST.sha256  invoices_2025.tar  cad_models.tar  photos.zip  missing.jpg", "catMap": {"MANIFEST.sha256": "(generated on source) 4 entries — batch format, filenames included"}, "helpOut": "Basic commands: ls, cat, pwd, cd, clear.", "tools": ["sha256sum", "md5sum", "sha1sum", "grep", "awk"], "tasks": [{"name": "Batch-verify the manifest", "accept": ["^(sha256sum|sha1sum|md5sum)\\s+(-c|--check|–check)\\s+(MANIFEST\\.sha256|\\./MANIFEST\\.sha256|/staging/inbound/MANIFEST\\.sha256)$"], "okOut": "invoices_2025.tar: OK\ncad_models.tar: OK\nphotos.zip: OK\nmissing.jpg: FAILED open or read\nsha256sum: WARNING: 1 listed file could not be read", "solution": "sha256sum -c MANIFEST.sha256", "why": "The manifest uses the standard batch format: one check flag turns the hashing tool into a batch verifier that prints OK or FAILED per listed file."}, {"name": "Show only the failed entries", "accept": ["\\|\\s*grep\\s+(-v\\s+[^|]*OK|[^|]*FAILED|[^|]*failed)", "\\|\\s*awk\\s+['\"]?/FAILED/"], "okOut": "missing.jpg: FAILED open or read\nsha256sum: WARNING: 1 listed file could not be read", "solution": "sha256sum -c MANIFEST.sha256 | grep -v ': OK'", "why": "Re-running the check through a filter that drops the OK lines leaves exactly the re-ship list the handover protocol wants."}], "hint": "Goal 1: the manifest has filenames inside, so one batch flag is enough. Goal 2: pipe the same verification through a text filter that hides every OK line.", "explain": "<p>Every mainstream hashing tool accepts a manifest with the check flag and verifies each listed file, printing OK or FAILED per entry — exactly the evidence a chain-of-custody handover needs. The second command re-runs that verification through a filter (<code>grep -v ': OK'</code>, or grep for FAILED) so the output is only the failures: the re-ship list. Piping instead of eyeballing matters at scale — a 4-entry manifest is readable, a 40,000-entry one is not, and the filter is the difference between a handover meeting and a log-reading exercise.</p><p><b>Focus on:</b> manifests turn per-file hashing into a batch verification, and a filtered re-run turns a full listing into an action list.</p>"}, {"id": "H08", "type": "spot", "theme": "risks", "title": "Audit the landing-zone IaC", "scenario": "<p>This infrastructure-as-code snippet provisions the production claims database for <b>Meridian Health</b> during wave 1. The security review asks you to mark every line that is wrong for a production, stateful, regulated workload.</p>", "question": "<p>Click every faulty line.</p>", "lines": ["resource \"storage_volume\" \"claims_data\" {", "  size_gb   = 1024", "  encrypted = true", "  kms_key   = var.customer_key", "  backup_plan = \"none\"        # will enable after go-live", "}", "resource \"db_instance\" \"claims_db\" {", "  multi_az = false            # single AZ saves cost in production", "  backup_retention_days = 0", "  depends_on = [storage_volume.claims_data]", "}"], "bad": [4, 7, 8], "whys": {"4": "“No backup plan, enable it after go-live” is technical debt with a launch date: the database accepts writes from day one and is unprotected until someone remembers. Backups are a day-one requirement for stateful regulated data.", "7": "A single-AZ production database has an availability single point of failure — one zone event and the claims platform is down. Multi-AZ (or an accepted, documented exception) is the production baseline.", "8": "Retention of 0 days means the engine keeps no automatic backups at all: any logical corruption (bad migration script, human error) is unrecoverable. Regulated workloads need measured retention plus tested restores."}, "okWhys": {"0": "Resource declaration opening is fine.", "1": "1024 GB matches the sizing sheet.", "2": "Encryption at rest enabled is mandatory and present.", "3": "Customer-managed keys satisfy the key-custody policy.", "5": "Closing brace.", "9": "depends_on correctly orders volume before database.", "10": "Closing brace."}, "hint": "Three lines fail. Two of them are about recoverability, one about availability. The encryption lines are correct.", "explain": "<p>Stateful production workloads are judged on recoverability and availability. Here the snippet fails three ways: no backup plan during the very window when the data first lands (“we will enable it after go-live” is technical debt with a launch date), single-AZ placement for a production database (one zone outage takes the claims platform with it), and zero backup retention (no engine-managed backups means logical corruption is unrecoverable). The encryption posture is correct — at rest, with customer-managed keys — and <code>depends_on</code> correctly sequences the volume. Availability plus recoverability, on day one, is the standard for regulated stateful systems.</p><p><b>Focus on:</b> “temporary” production gaps (backups later, single AZ for now) are how migration estates inherit incidents.</p>"}, {"id": "H09", "type": "order", "theme": "cutover", "title": "The data-integrity validation chain", "scenario": "<p><b>Northwind</b> imported its 1.2 TB inventory database from a bulk appliance. The data owner will not sign off without the full evidence chain. (Business UAT runs separately, after this chain.)</p>", "question": "<p>Order the validation steps correctly, first to last.</p>", "items": [["Compare file-level checksums of the exported dumps against the shipping manifest", "Before anything touches a database, prove the files arrived as sent. This gates the whole chain: corrupted files poison every later step."], ["Load the dumps into the target database", "The load converts files into tables. Any conversion errors (charset, types) start here, so the next checks exist to catch them."], ["Compare table row counts between source and target", "The fast coarse check: missing or duplicated rows show up immediately as count deltas."], ["Run per-table checksum aggregates on key columns on both sides and compare", "Counts can match while values differ (charset corruption, truncation). Content-level aggregates catch what counts cannot."], ["Reconcile sampled financial totals between source and target reports", "The business-meaningful proof: sampled balances and totals agree, so the numbers the business runs on are unchanged."], ["Record every result in the migration evidence log and obtain data-owner sign-off", "Evidence without records does not exist for an auditor. Sign-off closes the chain and authorises cutover planning."]], "hint": "You cannot compare what has not landed — but you also cannot trust what arrived until the files are proven. Evidence is written down at the end, not the start.", "explain": "<p>Data validation is a funnel of increasing refinement: file checksums against the shipping manifest (transport integrity), load, row counts (coarse completeness), per-table content aggregates (value integrity — counts can match while values are corrupted by charset or truncation), business-level reconciliation of sampled financial totals (meaning), and finally the evidence log with data-owner sign-off (accountability). Regression suites on application behaviour ride on top of proven data; UAT happens after this chain, not instead of it. Each step assumes the previous one passed — which is why the order is not negotiable.</p><p><b>Focus on:</b> checksum → count → content → meaning → evidence.</p>"}, {"id": "H10", "type": "multi", "theme": "risks", "title": "Why did the bill double?", "scenario": "<p>The <b>Northwind</b> migration was quoted at 180,000 for six months. Actuals came in at 340,000. The steering group wants every plausible cause checked before the next wave.</p>", "question": "<p>Select every cause that is a legitimate, checkable explanation for the overrun.</p>", "options": [["c1", "Egress charges from repeated test restores and cross-region verification copies", 1, "Every test restore pulled data out of the cloud, and verification copies moved data between regions — all billed. Egress is the first suspect in any overrun."], ["c2", "Dual-running: the source data centre and the cloud estate ran fully powered through the extended migration", 1, "Every slipped week extends the period where both estates run in parallel. Dual-running is the migration’s own interest rate on delay."], ["c3", "Managed-service premiums (managed database, load balancers) absent from the original per-VM estimate", 1, "The quote was built per-VM; the landing zone actually uses managed services whose premiums were never modelled. A classic business-case gap."], ["c4", "Instances sized “to be safe” during migration and never right-sized against the baseline afterwards", 1, "Fear-sized instances run at 10–20% utilisation and bill at 100%. Right-sizing against measured baselines is exactly the cure — and it was skipped."], ["c5", "Idle leftovers from aborted test waves: unattached volumes, stale snapshots, reserved-but-unused IPs", 1, "Aborted waves leave orphaned resources that bill silently. Idle-resource cleanup is a recurring task, not a one-off."], ["c6", "The annual electricity bill of the old data centre, already budgeted", 0, "That cost existed before the migration and belongs to the old estate’s baseline. It explains nothing about the cloud overrun."], ["c7", "Salaries of the finance department processing the invoices", 0, "Shared corporate overhead is not a migration cost driver. Mixing it in obscures the real causes."]], "hint": "Five causes are things the program itself did or failed to model. Two distractors are ordinary business costs wearing a migration hat.", "explain": "<p>Migration overruns have a standard suspect list: egress from test/verification traffic, the dual-running premium for every week of delay, managed-service premiums the per-VM quote never carried, fear-sized instances never right-sized against the baseline, and orphaned resources from aborted waves that bill forever if nobody cleans up. The business case must carry all five — plus contingency — or the TCO (and the promised ROI) loses credibility. The distractors are ordinary operating costs (old DC electricity, shared salaries) that predate or transcend the migration and hide real causes when included.</p><p><b>Focus on:</b> TCO honesty — the costs that overrun are the ones the business case was too optimistic to name.</p>"}, {"id": "H11", "type": "single", "theme": "cutover", "title": "The TTL that was lowered too late", "scenario": "<p><b>Vantage Trading</b> lowered the portal’s DNS record TTL from 86400 (24 h) to 300 at 21:00, one hour before the 22:00 cutover. At 22:05 the weighted routing switched to the cloud stack — yet for most of the next day, a steady share of users kept hitting the old stack, which had already been frozen for writes.</p>", "question": "<p>What actually happened?</p>", "options": [["o1", "The registrar silently refuses TTL changes during business hours", 0, "Registrars do not impose business-hours locks on TTL. Invented mechanism — and the change itself did propagate."], ["o2", "Recursive resolvers that had cached the record at TTL 86400 before 21:00 kept serving the old address until their cached entries expired — the TTL should have been lowered at least one old-TTL period (24 h) before cutover", 1, "Caches honour the TTL they were GIVEN, not the one published later. Users who resolved before 21:00 carry the old address for up to 24 hours. Lowering the TTL one full old-TTL period in advance is the standard cure."], ["o3", "DNS TTL only affects mail servers, not web traffic", 0, "TTL governs every cached DNS record — web traffic included. Fabricated rule."], ["o4", "The weighted routing change was applied to the wrong hosted zone", 0, "Then NOBODY would have reached the new stack. Traffic did arrive at cloud — progressively, as caches expired. Wrong zone does not produce a decaying tail."]], "hint": "The record was correct at the authoritative server. Ask what the caches around the world were still holding, and until when.", "explain": "<p>DNS is a distributed cache with contractual memory: every recursive resolver that fetched the record while the TTL was 86400 is entitled to serve it for 24 hours from ITS fetch time. Lowering the TTL an hour before cutover only affects resolvers that ask AFTER the change — everyone else keeps the old address until their cached copy ages out. The fix is procedural: lower the TTL to 300 at least one old-TTL period (here, 24 h) before cutover, then switch, then raise it back after the soak period. The observed “decaying tail” of users on the old stack is the signature of exactly this mistake.</p><p><b>Focus on:</b> TTL changes are scheduled in old-TTL units before the event — cache expiry, not authority, controls when users actually move.</p>"}, {"id": "H12", "type": "logview", "theme": "cutover", "title": "Counts match, checksums do not", "scenario": "<p>Overnight validation of the <b>Northwind</b> heterogeneous database migration (MySQL to managed PostgreSQL) produced this log. Row counts were compared, then content checksums per table.</p>", "question": "<p>Select every conclusion that is justified by the log right now.</p>", "log": [["03:12:01", "INFO", "validation run start: 118 tables, source mysql 5.7 → target pg 14"], ["03:12:04", "OK", "customers: rows 1,204,558 = 1,204,558 — count MATCH, checksum MATCH"], ["03:14:22", "OK", "products: rows 88,431 = 88,431 — count MATCH, checksum MATCH"], ["03:21:07", "WARN", "orders: rows 6,418,220 = 6,418,220 — count MATCH, checksum DIFFER"], ["03:21:08", "WARN", "order_items: rows 18,921,556 = 18,921,556 — count MATCH, checksum DIFFER"], ["03:21:09", "INFO", "diff sampler engaged on orders (column-level compare, 10k sample)"], ["03:23:40", "INFO", "sampler: timestamp columns differ by +02:00 offset on ~38% of rows"], ["03:23:41", "INFO", "sampler: accented characters render as replacement glyph in names column"], ["03:25:12", "DEBUG", "target created with default encoding; source declared utf8mb4"], ["03:26:02", "WARN", "shipping: rows 214 = 214 — count MATCH, checksum MATCH"], ["03:27:15", "INFO", "validation paused — awaiting analyst decision on orders/order_items"]], "q": {"type": "multi", "options": [["v1", "Row counts alone do not prove correctness: two tables match on counts and fail on content checksums", 1, "The log demonstrates exactly this: 6.4M and 18.9M rows present, content still different. Counts measure completeness, not correctness."], ["v2", "A character-encoding (charset) mismatch is a plausible root cause to investigate, given the utf8mb4 note and the corrupted accents", 1, "The sampler shows replacement glyphs in the names column and the target was created with a default encoding while the source declared utf8mb4. That is textbook charset corruption and must be investigated before sign-off."], ["v3", "The migration is a total failure and must be restarted from zero immediately", 0, "Two of 118 tables are affected, the sampler has already localized two concrete symptoms, and the rest validated clean. A restart would destroy the evidence and the timeline. Investigate first."], ["v4", "The differences are cosmetic; the data owner can sign off and fix display later", 0, "“Cosmetic” is precisely what must be proven, not assumed — accented names and shifted timestamps corrupt business meaning (billing periods, audit trails). Sign-off requires the cause fixed and re-validated."], ["v5", "The evidence log should record the mismatch, and the decision to fix or accept belongs with the data owner once the cause is known", 1, "Validation governance: every mismatch is recorded, causes are investigated, and the data owner decides with evidence in hand. The log already shows the right posture — paused, sampled, awaiting analyst decision."]]}, "hint": "Two conclusions describe what the log proves, one describes governance. Two distractors overreact or underreact.", "explain": "<p>Matched counts with differing checksums mean the data is complete but not identical — completeness and correctness are different properties. The sampler localizes two causes worth investigating: a timezone/offset shift in timestamps and charset corruption of accented names (target default encoding vs source utf8mb4 — a classic heterogeneous migration trap). The justified actions: treat counts as insufficient, investigate the encoding/offset causes, and record everything for a data-owner decision once causes are known. Both extremes are wrong: restarting from zero destroys evidence and time; signing off “cosmetic” differences ships corrupted business data.</p><p><b>Focus on:</b> heterogeneous database migrations need explicit charset/timezone mapping — and validation must test content, not just counts.</p>"}, {"id": "H13", "type": "categorize", "theme": "risks", "title": "Assign each incident to its risk family", "scenario": "<p>Six findings from the <b>Northwind</b> and <b>Vantage</b> migration program reviews need owners. The board uses five risk families.</p>", "question": "<p>Place each finding under the family that must own it.</p>", "zones": [["z_comp", "Compliance"], ["z_perf", "Performance"], ["z_cost", "Cost"], ["z_sec", "Security"], ["z_ops", "Operational"]], "items": [["i1", "An audit finds EU claims data was staged in a non-approved region during a transfer test", "z_comp", "Data residency is regulated territory: location of personal data, GDPR exposure, mandatory reporting. Compliance owns it, full stop."], ["i2", "Analytics jobs run 4x slower post-migration because the source had local NVMe disks the target lacks", "z_perf", "The target platform changed a performance-relevant characteristic. Performance family: re-architect storage, add local NVMe cache, or accept and re-baseline."], ["i3", "The reporting tool pulls 2 TB/day back from the cloud to on-prem users; egress was never modelled", "z_cost", "A recurring data flow at cloud-egress rates is a cost-model failure. Cost family: re-architecture (report in-cloud), caching, or price the flow honestly."], ["i4", "The temporary migration credentials were never rotated after go-live and still work", "z_sec", "Standing credentials from a finished project are an attack path. Security family: rotate, revoke, and add expiry to all migration credentials by policy."], ["i5", "Nobody documented how to restart the sync agent after a failover; the knowledge left with a contractor", "z_ops", "Knowledge and runbook gaps are operational risk. The fix is documentation and drills, not more tooling."], ["i6", "The failover test showed the standby copy runs 45 minutes behind production", "z_ops", "A replication/DR posture gap discovered by testing is operational readiness: RPO measurement, alerting on lag, runbook updates."]], "hint": "Law, speed, money, attack surface, readiness — one finding per family plus one pair.", "explain": "<p>Risk families route findings to the owner who can actually fix them. Compliance takes regulated data in the wrong place (residency/GDPR). Performance takes platform characteristic changes (NVMe to network storage). Cost takes unmodelled recurring flows (egress). Security takes standing access (unrotated migration credentials — the transition-state classic). Operational takes readiness gaps: undocumented recovery paths and a standby 45 minutes behind (an RPO in disguise). The same finding can spark several risks, but ownership must be single and named.</p><p><b>Focus on:</b> standing credentials and forgotten temporary access are the security debt every migration leaves behind unless diarized.</p>"}, {"id": "H14", "type": "fill", "theme": "cutover", "title": "Complete the mid-migration failover plan", "scenario": "<p>The <b>Meridian Health</b> cutover keeps the source stack live until the soak ends. If the target region degrades mid-migration, this failover plan executes. Draft terms are missing.</p>", "question": "<p>Complete the plan with the correct terms. Decoys included.</p>", "text": "If the target region degrades, the plan (1) [[1]] to the source stack, which stayed warm. The (2) [[2]] accumulated since the last sync is replayed from the journal. Writes are (3) [[3]] on both sides before the switch to prevent split-brain. The (4) [[4]] actually experienced is measured and reported to the business. Afterwards, resources created for the aborted attempt are removed so no (5) [[5]] resources keep billing.", "blanks": {"1": ["failback", "Failback is the return path to the original stack after (or instead of) completing the cutover. The warm source stack is what makes it instant."], "2": ["delta", "The delta — changes accumulated since the last completed sync — is replayed from the journal so the restored source is current, not stale."], "3": ["quiesced", "Quiescing (freezing) writes on BOTH sides before a switch is the anti-split-brain measure: two writable stacks diverge, and divergence is data loss."], "4": ["RPO", "The RPO actually experienced (how much data the incident would have lost) is the honest number the business is owed after any failover."], "5": ["orphaned", "Orphaned resources — volumes, IPs, instances from the aborted attempt — bill silently forever unless explicitly hunted and removed."]}, "bank": ["failback", "delta", "quiesced", "RPO", "orphaned", "rollforward", "egress", "cached"], "hint": "One blank is the return word, one is the changes themselves, one is the freeze verb, one is a data-loss measure, one describes abandoned-but-billing things.", "explain": "<p>Mid-migration failover mirrors cutover discipline in reverse: failback to the warm source, replay of the accumulated delta from the journal, quiesced writes on both sides to prevent split-brain (two writable stacks diverging is the worst outcome), an honest report of the RPO actually experienced, and cleanup of orphaned resources from the aborted attempt. The decoys tempt with adjacent vocabulary: rollforward is the opposite direction, egress is a cost, and cached state is not what journals replay.</p><p><b>Focus on:</b> quiesce-both-sides is THE split-brain defence; everything else in the plan follows from it.</p>"}, {"id": "H15", "type": "single", "theme": "movement", "title": "Cutover traffic cannot get replies back", "scenario": "<p>Cutover night at <b>Vantage Trading</b>. The cloud app servers must reach the on-prem payment service. Evidence: cloud → on-prem SYNs leave through the site-to-site VPN and the on-prem firewall logs them as allowed; the payment service itself answers other clients on the LAN normally; but the cloud side never receives replies, and the on-prem firewall shows DROP entries for packets that look like replies, arriving on its internet interface from an external zone.</p>", "question": "<p>What is the most likely cause?</p>", "options": [["o1", "Asymmetric routing: the reply traffic leaves the on-prem network via its default internet path instead of back through the VPN, so the stateful firewall sees unsolicited inbound packets and drops them", 1, "The return path must mirror the forward path. Replies exiting via the internet interface arrive at the firewall from the “external” zone without a matching session — classic stateful drop. The fix is routing (or NAT/forced tunneling) so replies traverse the VPN."], ["o2", "The payment service crashed when the first cloud packet arrived", 0, "The service answers other LAN clients normally. A service that is up and answering is not crashed."], ["o3", "The TLS certificate of the payment service expired at midnight", 0, "Expired certificates produce handshake failures after the connection opens. Here the TCP handshake never completes — replies are dropped before TLS even starts."], ["o4", "DNS in the cloud resolves the payment service to the wrong address", 0, "The SYNs clearly reach the on-prem firewall and are allowed — the cloud side found the right address. Name resolution is not the failing link."]], "hint": "Follow one packet both ways. Where do the replies physically exit, and what does a stateful firewall think of packets that arrive without a session?", "explain": "<p>Stateful firewalls only pass return traffic that belongs to a session they saw begin. The evidence chains perfectly: SYNs arrive and are allowed (forward path via VPN works), the service is healthy (LAN clients are answered), yet replies die on the firewall’s internet interface as unsolicited external-zone packets — the on-prem network is replying through its default route instead of back down the tunnel. That asymmetry breaks every stateful check in the path. The remedy is routing symmetry: advertise the cloud subnets over the VPN (or use forced tunneling/NAT) so replies re-enter the tunnel where the session lives.</p><p><b>Focus on:</b> in hybrid connectivity, a working forward path proves nothing until the return path is proven too.</p>"}, {"id": "H16", "type": "branch", "theme": "movement", "title": "Wave 3 stalls at 40 percent", "scenario": "<p><b>Northwind</b> wave 3: 12 VM migrations run in the 22:00–04:00 window. At 02:00 all twelve agents stall between 40% and 60%.</p>", "question": "<p>Work the four decisions in order.</p>", "nodes": [{"q": "02:00 — all agents stall mid-flight. What is the first diagnostic?", "opts": [["Read agent logs and check source-host health: CPU, disk queue, connection tables, ephemeral port usage", 1, "Correct. Evidence first: agent logs plus host telemetry separate an agent problem from a source problem from a network problem — each has a different fix and only one is cheap at 02:00."], ["Reboot all 12 source servers to clear the state", 0, "Rebooting production mid-migration destroys in-flight state and your evidence. It is the 02:00 version of guessing."], ["Declare a severity-1 outage and page every team", 0, "Nothing user-facing is broken — this is a migration window. Escalation comes after diagnosis says what to escalate."]]}, {"q": "02:15 — logs show tens of thousands of short-lived connections per host; connection tables are exhausted (ephemeral port exhaustion). The agent opens a new connection per file. Fix?", "opts": [["Enable connection reuse / raise the agent’s pool, and cut per-file parallelism", 1, "Correct. The resource is exhausted, so the fix is to consume less of it: reuse sessions, batch files, reduce concurrency. Throughput often rises as a side effect."], ["Migrate the agent to a bigger VM with more CPU", 0, "Port exhaustion is a table/stack limit, not a compute limit. A bigger agent exhausts ports faster."], ["Disable the host firewall to free the connection table", 0, "The firewall is not the table. Disabling it mid-migration removes a control and changes nothing about the 65k-port ceiling."]]}, {"q": "02:40 — fixed; six VMs are migrated, six remain, window ends 04:00. Decision?", "opts": [["Complete the remaining six in a follow-up window per the phased plan; do not rush validation", 1, "Correct. The phased plan exists for nights like this: half a wave delivered and validated beats a whole wave delivered sloppily. Schedule the tail with the CAB."], ["Push the last six through with validation skipped to finish on time", 0, "Unvalidated migrations are not migrations — they are scheduled incidents. The window is not the goal."], ["Cancel the whole wave and roll the six finished VMs back", 0, "Six clean, validated migrations are progress. Cancelling them wastes completed work and misreads the plan."]]}, {"q": "Next day — the CIO asks why wave 3 “did not finish”. Your answer?", "opts": [["Report the facts: root cause fixed, six VMs validated and live, six scheduled with the CAB, runbook updated with the port lesson", 1, "Correct. Evidence-based reporting builds program credibility: what happened, what was fixed, what is scheduled, what was learned."], ["Blame the network team publicly for the stall", 0, "Blame converts an incident into politics. The port-exhaustion cause belonged to the migration design, and the review owns it."], ["Tell the CIO everything finished, and quietly fix the rest later", 0, "Falsifying status is the fastest way to lose the program. It also skips validation for six live-but-unproven VMs."]]}], "hint": "Diagnose from evidence; fix the exhausted resource by consuming less; protect validation above the clock; report with facts.", "explain": "<p>Mid-flight stalls are diagnosed, not felt: agent logs plus host telemetry (CPU, disk queue, connection tables) separate the candidate causes in minutes. Ephemeral port exhaustion — an agent opening a connection per file — is fixed by consuming less of the resource (connection reuse, batching, lower parallelism), which usually improves throughput too. The window then bends to the plan, never the reverse: half a wave validated beats a whole wave unvalidated, and the tail is scheduled through change management. Finally, status is reported with facts and lessons, because program credibility is a migration asset too.</p><p><b>Focus on:</b> resource exhaustion fixes reduce consumption; phased plans absorb partial nights.</p>"}, {"id": "H17", "type": "spot", "theme": "planning", "title": "Audit the cutover runbook", "scenario": "<p>A reviewer walks the <b>Meridian Health</b> cutover runbook top to bottom. Two steps are in the wrong place or wrong order for a safe cutover.</p>", "question": "<p>Click the two faulty steps.</p>", "lines": ["1. Freeze application writes and confirm the freeze took effect", "2. Run the final delta sync and verify checksums on sampled tables", "3. Switch the load balancer to send 100% of traffic to the target stack", "4. Run smoke tests on the target stack", "5. Decommission the source database cluster immediately after switching", "6. Monitor error budgets and latency for 48 hours"], "bad": [2, 4], "whys": {"2": "Traffic moves BEFORE validation here — steps 3 and 4 are inverted. Smoke tests must gate the switch: validate the target first, then send traffic, or the first customers are the test suite.", "4": "Decommissioning the source immediately after switching deletes the rollback path before the soak period proves stability. The source stays warm (frozen) until monitoring and sign-off say otherwise."}, "okWhys": {"0": "Freeze first is correct — the final delta needs a stable end state.", "1": "Final delta plus sampled checksums is the right pre-switch data proof.", "5": "48-hour monitoring of error budgets and latency is exactly the soak-period discipline required before closing a cutover."}, "hint": "One pair of neighbours is in the wrong order. One step happens far too early — think rollback.", "explain": "<p>Two faults make this runbook unsafe. Traffic must not lead validation: smoke tests gate the switch, so step 3 and step 4 are inverted — first prove the target, then move users. And decommissioning the source immediately after switching destroys the rollback path while the 48-hour soak is still pending; the source cluster stays frozen-but-warm until monitoring, error budgets and sign-off close the cutover. The correct sequence is freeze → delta → validate → switch → monitor → (then, days later) decommission.</p><p><b>Focus on:</b> validation gates traffic, and the source stack is the rollback asset until the soak period ends.</p>"}, {"id": "H18", "type": "fill", "theme": "cutover", "title": "Complete the go/no-go report", "scenario": "<p>The wave-4 go/no-go report for <b>Meridian Health</b> goes to the CAB in one hour. Five terms are missing from the summary section.</p>", "question": "<p>Restore the five terms.</p>", "text": "Status: GREEN. (1) [[1]] replication lag is 8 seconds, well inside the RPO. File and table (2) [[2]] checks agree on all sampled datasets. The (3) [[3]] plan was rehearsed Tuesday and fits the 2-hour RTO. The (4) [[4]] trigger is defined: checkout error rate above 2% for 10 minutes. The source stack stays warm through the full 14-day (5) [[5]] period before decommissioning.", "blanks": {"1": ["Replication", "Replication lag is the live measure of how far the target trails the source — the number that must sit inside the RPO before anyone says go."], "2": ["checksum", "Checksum checks (files plus sampled tables) are the content-level proof that the data landed intact, complementing row counts."], "3": ["rollback", "A rehearsed rollback plan that fits the RTO is what makes “go” a controlled bet rather than a leap."], "4": ["rollback trigger", "The rollback trigger is defined BEFORE cutover: an objective, measurable condition (2% checkout errors for 10 minutes) that converts judgment into procedure mid-incident."], "5": ["soak", "The soak period is the agreed time the source stays warm and the new stack is watched before any decommissioning — the exit lane stays open."]}, "bank": ["Replication", "checksum", "rollback", "rollback trigger", "soak", "egress", "baseline", "canary"], "hint": "Four blanks are safety vocabulary and one is a metric. Two of them sound almost identical — order matters.", "explain": "<p>A go/no-go report earns its GREEN with four proofs and one promise: replication lag inside the RPO (live target), checksum validation on sampled data (intact target), a rehearsed rollback fitting the RTO (a way out), a pre-agreed rollback trigger (an objective condition that fires the way out without debate), and a soak period that keeps the source warm before decommissioning. The near-pair is deliberate: the rollback PLAN is the procedure; the rollback TRIGGER is the measurable condition that starts it. Decoys (egress, baseline, canary) belong to other sections of the program.</p><p><b>Focus on:</b> define the trigger before the incident — mid-outage is the wrong time to negotiate thresholds.</p>"}, {"id": "H19", "type": "order", "theme": "movement", "title": "Bring up the hybrid connectivity properly", "scenario": "<p><b>Vantage Trading</b> is building the connectivity that wave 1 will ride on: a dedicated direct connection plus a site-to-site VPN backup, BGP routing, encryption policy, and acceptance tests.</p>", "question": "<p>Order the bring-up steps correctly, first to last.</p>", "items": [["Provision the dedicated circuit at both ends (provider meets, cross-connects into the landing zone)", "Physical first: the direct connection is the primary path, and its delivery lead time is the schedule’s long pole."], ["Establish the site-to-site VPN over the internet as the backup path", "The VPN comes up early precisely because it is independent of the circuit — it is both a backup and a bootstrap path for testing."], ["Configure BGP peering and advertise the routes over the circuit", "BGP turns two endpoints into a routed network and decides which path is preferred and which is standby."], ["Verify route propagation and force a failover test from circuit to VPN and back", "A backup path that has never carried traffic is a rumour. The failover test proves the BGP preference works under failure."], ["Confirm the encryption policy end to end (circuit layer crypto or overlay encryption) and verify with captures", "Connectivity is not trust: the encryption posture is verified where the data actually flows, with captures as evidence."], ["Run throughput and latency acceptance tests against the pre-agreed baseline before any wave uses the link", "The link is accepted the way workloads will be: bandwidth and latency measured against the baseline. Wave 1 rides only on a link that passed its own test."]], "hint": "Hardware, backup, routing, failure test, trust, acceptance. Waves do not ride on untested glass.", "explain": "<p>Hybrid connectivity is built in dependency order: provision the dedicated circuit (the long-lead-time item), stand up the VPN as an independent backup, configure BGP so routing chooses paths deliberately, prove failover by forcing traffic onto the backup and back (an untested backup is a rumour), verify the encryption posture where data actually flows, and close with throughput/latency acceptance tests against the pre-agreed baseline. Only then do migration waves touch the link. (An SD-WAN overlay can later shape branch traffic, but the data-centre pair — circuit plus VPN — is the backbone this program rides on.) Skipping the failover or acceptance step converts the first wave night into the test.</p><p><b>Focus on:</b> the acceptance baseline for the link is captured before the link is declared ready — same discipline as workloads.</p>"}, {"id": "H20", "type": "multi", "theme": "movement", "title": "Ship the archive appliance safely", "scenario": "<p><b>Meridian Health</b> will ship a 35 TB archive to the cloud on a bulk transport appliance (the dataset is EU claims history). Seven proposals circulate about how to do it.</p>", "question": "<p>Select every requirement that genuinely applies to this shipment.</p>", "options": [["r1", "Encrypt the appliance at rest with a customer-managed key; keep the key separate from the device", 1, "If the courier is robbed, the device without the key is just metal. Customer-managed keys held apart from the appliance make loss an incident, not a breach."], ["r2", "Document chain of custody for pickup, transit, border and ingestion", 1, "Regulated data on the move needs a signed custody record at every hop — who held it, when, and where. That is what makes the handover auditable."], ["r3", "Check import/export and customs rules for the destination before shipping", 1, "Hardware carrying encrypted regulated data crosses borders: customs can seize, delay or inspect devices. The pre-shipment check is mandatory planning, not bureaucracy."], ["r4", "After ingestion, run a delta sync to capture the changes made during the shipping days", 1, "The dataset kept changing while the appliance sailed. A post-ingestion delta sync reconciles the gap — otherwise cutover starts days behind."], ["r5", "Ship the appliance with the only existing copy of the dataset to save storage cost", 0, "The only copy leaves the building in a truck. The shipping copy must be made from a retained source (or the source kept intact until ingestion is verified)."], ["r6", "Let the courier set the device admin password in transit", 0, "Credentials are provisioned before dispatch by the owner. A stranger setting the admin password is indistinguishable from handing over the data."], ["r7", "Skip the manifest because the device verifies itself automatically", 0, "Vendor claims are not evidence. The shipping manifest plus post-ingestion checksum verification is what proves the payload — the device’s own lights are not an audit artefact."]], "hint": "Think like the data owner: what protects the payload, what proves it, what reconciles it — and what makes it the only copy?", "explain": "<p>Bulk appliance shipping is physical data governance: encryption at rest with keys held apart from the device, a chain-of-custody record across every handover, customs/import checks before the truck rolls, post-ingestion delta sync to reconcile changes made during transit, and manifest-verified checksums on arrival. The red lines: never ship the only copy, never let a third party hold the credentials, and never accept vendor self-verification as a substitute for your own evidence. On regulated data, the physical transfer inherits every rule the network transfer has.</p><p><b>Focus on:</b> custody + keys + manifest are the tripod; remove one leg and the shipment is unauditable.</p>"}, {"id": "H21", "type": "single", "theme": "risks", "title": "“Just stage it in the US region for ten days”", "scenario": "<p>To shorten a transfer, a <b>Meridian Health</b> engineer proposes staging EU patient claims data for 10 days in a US region “as a transit stop”, arguing it is temporary, the bucket is private, and it will be deleted afterwards. The approved-region list contains only EU regions.</p>", "question": "<p>What is the compliance-correct assessment of the proposal?</p>", "options": [["o1", "Acceptable — the residency rule only applies to data at rest long-term, and 10 days is not long-term", 0, "Residency applies to storing AND processing, however briefly. “Temporary” is exactly how residency violations happen — nobody planned to keep it there."], ["o2", "Not acceptable: storing or processing EU personal data outside the approved regions breaches residency requirements regardless of duration, bucket privacy or deletion plans. Use an approved EU region or a path that never lands data there (e.g., encrypted transfer without staging)", 1, "Duration, ACLs and cleanup intentions do not change the rule: regulated personal data may only live and be processed in approved jurisdictions. The compliant alternatives are an EU-region path or a transfer that never lands the data in a non-approved region at all."], ["o3", "Acceptable if the bucket is private and access-logged", 0, "Privacy of the bucket is irrelevant to where the data physically sits. Access logs document a violation; they do not license it."], ["o4", "Acceptable if the data is deleted right after with a signed attestation", 0, "Deletion after the fact does not undo the unlawful processing that happened during the 10 days. The breach occurs at storage time, not at discovery time."]], "hint": "Ask where the data physically is, and for how long — not who can see it or when it leaves.", "explain": "<p>Data residency constrains WHERE personal data may be stored and processed — full stop. Duration (“only 10 days”), access control (“the bucket is private”) and cleanup promises (“deleted afterwards”) are all irrelevant to that rule: the violation happens the moment the data lands outside an approved jurisdiction, and all three arguments merely document it. Compliant designs keep the data in approved regions (EU staging) or use transfer paths that never land the data elsewhere (encrypted transit, direct connections, appliances whose custody keeps it inside approved territory).</p><p><b>Focus on:</b> the three classic residency rationalisations — temporary, private, deleted-after — are always wrong together.</p>"}, {"id": "H22", "type": "categorize", "theme": "cutover", "title": "Name the cutover pattern", "scenario": "<p>The <b>Vantage</b> program office collected eight cutover descriptions from past projects and wants them filed by pattern, so the next runbook quotes the right one.</p>", "question": "<p>Place each description under the cutover pattern it describes.</p>", "zones": [["z_big", "Big bang"], ["z_phased", "Phased"], ["z_bg", "Blue-green"], ["z_canary", "Canary"], ["z_par", "Parallel run"]], "items": [["i1", "All 40 applications switch during a single weekend window", "z_big", "Everything moves at once: minimal dual-running, maximum blast radius. That is big bang."], ["i2", "CRM moves first, finance next month, HR last", "z_phased", "Groups move in sequence with learning between them — phased (the wave model)."], ["i3", "Two identical stacks stay warm; a load-balancer flip moves all users; the old stack remains for instant fallback", "z_bg", "The two-stack, instant-fallback pattern is blue-green. Its cost is running both stacks."], ["i4", "1% of requests go to the new stack, watched, then 10%, 50%, 100%", "z_canary", "Graduated real-traffic exposure is canary — best for read-heavy or idempotent flows."], ["i5", "Old and new systems both process next month’s payroll; outputs are reconciled line by line before the switch", "z_par", "Running both systems on the same real workload and reconciling results is a parallel run — the gold standard where errors are intolerable."], ["i6", "Retail branches roll one region per week, with a rollback gate after each", "z_phased", "Sequential groups with gates — the phased pattern again, at branch granularity."], ["i7", "A single web service receives 5% of production traffic a week before the platform moves", "z_canary", "One component exposed to a traffic slice — canary, scoped to a service."], ["i8", "Everything must move this weekend because the data-centre lease expires Friday", "z_big", "A forced single-window move with no sequencing — big bang by constraint, the riskiest motivation of all."]], "hint": "Ask how many windows, how many stacks, and whether real outputs are compared. Constraint-driven single windows are still big bang.", "explain": "<p>Five patterns cover most cutovers. Big bang: one window, everything moves — cheapest dual-running, worst blast radius, and deadline-forced big bangs are the riskiest of all. Phased: groups (waves, branches) move in sequence with gates. Blue-green: two warm stacks and a flip, buying instant fallback at double-running cost. Canary: graduated real-traffic slices, ideal for idempotent or read-heavy flows, wrong for strict integrity flows. Parallel run: both systems process the same real workload and outputs are reconciled — the most expensive and the most convincing, reserved for intolerable-error workloads like payroll.</p><p><b>Focus on:</b> the pattern is chosen by blast radius, integrity rules and budget — not by habit.</p>"}, {"id": "H23", "type": "fill", "theme": "cutover", "title": "Complete the weighted-routing change request", "scenario": "<p>The CAB reviews the traffic-shift change request for the <b>Vantage</b> portal cutover. The policy section is missing its numbers and one term.</p>", "question": "<p>Complete the change request.</p>", "text": "DNS weighted routing: set the cloud target weight to (1) [[1]] for the canary hour; the source stack keeps weight (2) [[2]]. Health checks run every (3) [[3]] seconds with a failure threshold of (4) [[4]]; enable (5) [[5]] so any target failing its checks is pulled from rotation automatically.", "blanks": {"1": ["5", "A 5% canary slice exposes the stack to real users while containing the blast radius — the standard first step before graduated increases."], "2": ["95", "Weights are complementary: the source holds 95 while the cloud target holds 5. The pair must sum to 100."], "3": ["30", "A 30-second health-check interval detects a dead target in under a minute while keeping probe load trivial — the common production setting."], "4": ["3", "A threshold of 3 consecutive failures filters a single lost probe (a network blip) from a genuinely dead target — one probe is noise, three is a pattern."], "5": ["health-check failover", "Health-check failover is what turns monitoring into action: a target that fails its checks leaves rotation without a human in the loop."]}, "bank": ["5", "95", "30", "3", "health-check failover", "100", "0", "round robin"], "hint": "Weights sum to 100 and the first slice is small. One blank is a mechanism, not a number.", "explain": "<p>Weighted-routing change requests live or die by their numbers: a 5% canary weight (with the source at 95) contains the first exposure, 30-second health checks with a threshold of 3 failures distinguish real outages from single-probe noise, and health-check failover removes dead targets without waiting for a human. The decoys are the aggressive opposites: 100 (no canary at all), 0 (target effectively disabled), and round robin (a distribution method with no health awareness).</p><p><b>Focus on:</b> failover thresholds trade false positives against detection speed — thresholds of 1 flap on noise; thresholds of 10 miss outages.</p>"}, {"id": "H24", "type": "order", "theme": "risks", "title": "Exit the legacy data centre with a legal hold", "scenario": "<p><b>Meridian Health</b> is vacating its legacy data centre. Some mailboxes are under litigation hold, and the disposal standard requires certificates. The exit runbook needs its true order.</p>", "question": "<p>Order the exit steps correctly, first to last.</p>", "items": [["Identify the litigation-hold scope with legal counsel (which mailboxes and datasets are frozen)", "Legal scope first: the hold defines what may never be touched, moved casually, or destroyed. Every later step depends on this boundary."], ["Export held data into the compliance archive with verified integrity", "Held data moves into a purpose-built archive — with checksums — before anyone goes near the rest of the estate."], ["Verify the cloud stack has carried production through the agreed soak period", "The data centre does not close while the old platform is still the rollback target. Soak period and sign-off gate the exit."], ["Migrate remaining archives to long-term cloud storage in approved regions", "Everything retention requires, but nothing more, moves to approved-region storage with residency and encryption policy satisfied."], ["Sanitize and dispose of hardware per the disposal standard; retain the certificates", "Certified sanitization makes the disks safe to leave the building; the certificates are the audit evidence that it happened."], ["Update CMDB, licence positions and contracts; cancel the network circuits last", "Documentation and commercial closure: CMDB truth, licence reclamation, contract terminations — and circuits last, because they may still carry validation traffic."]], "hint": "Legal scope, held data, soak gate, archives, destruction with proof, paperwork — circuits die last.", "explain": "<p>A data-centre exit with a legal hold is a compliance exercise wearing a logistics costume. Legal first (scope of the hold), then export of held data with verified integrity into the compliance archive, then the soak-period gate proving the cloud stack stands alone, then migration of remaining archives into approved-region storage, then certified hardware sanitization with certificates retained, and finally the documentation/commercial closeout — with network circuits cancelled last, since validation traffic may still depend on them. Order breaks are how organizations destroy evidence or lose their rollback path.</p><p><b>Focus on:</b> holds freeze scope before anything moves; certificates make destruction auditable.</p>"}, {"id": "H25", "type": "single", "theme": "risks", "title": "The BYOL that cannot travel", "scenario": "<p>A proposal at <b>Northwind</b> plans to reuse 40 Windows Server licences under a BYOL model. Licence records show the licences were purchased WITHOUT Software Assurance, and the vendor confirms no licence mobility rights were granted. The proposal’s words: “perpetual licences are ours, so they come with us.”</p>", "question": "<p>What is the correct assessment?</p>", "options": [["o1", "Compliant — perpetual licences never expire, so the BYOL claim holds", 0, "Perpetual means “does not expire”, not “travels anywhere”. Mobility rules are a separate grant, and this estate does not have them."], ["o2", "Not compliant: without licence mobility (or Software Assurance) these licences cannot move to shared multi-tenant cloud hardware. Use provider-included licences or dedicated/eligible hardware that the licence terms allow", 1, "BYOL on shared cloud hardware requires mobility rights (or equivalent licence terms). Without them, the options are provider-included licensing or eligible dedicated hardware — and the TCO must be rebuilt with that reality."], ["o3", "Compliant if hyperthreading is disabled on the hosts", 0, "Host configuration tweaks do not create rights the licence never granted. Licence terms, not firmware settings, decide compliance."], ["o4", "Compliant as long as the VMs are powered off outside business hours", 0, "Power schedules change nothing about where the licence is installed and running. This is a scheduling habit dressed as a licensing argument."]], "hint": "“Perpetual” and “portable” are different rights. Which document grants the right to run on shared cloud hardware?", "explain": "<p>BYOL is a licence-terms question, not a technical one. Perpetual licences that were bought without Software Assurance and without mobility rights are tied to the on-premises hardware model; moving them onto shared multi-tenant cloud hardware breaches the terms regardless of host tweaks or power schedules. The compliant paths are provider-included licences (rebuild the TCO with their cost) or dedicated/eligible hardware if the vendor’s terms allow it — and the same review should note which choices deepen vendor lock-in versus keep a multi-cloud exit realistic. Licence portability must be verified during assessment — it is a wave-blocker class finding, not a billing detail.</p><p><b>Focus on:</b> the three words that decide it: perpetual, Software Assurance, mobility. Missing mobility kills the BYOL claim.</p>"}, {"id": "H26", "type": "spot", "theme": "movement", "title": "Audit the database migration job config", "scenario": "<p>This is the config of the <b>Northwind</b> heterogeneous database migration (MySQL 5.7 to managed PostgreSQL 14). Production keeps writing during the move. Three settings are wrong.</p>", "question": "<p>Click the three faulty settings.</p>", "lines": ["source: mysql 5.7          target: managed postgres 14", "migration_mode: full_load_only     # no ongoing changes captured", "charset_mapping: latin1_to_utf8: disabled", "foreign_keys: disabled_during_load, revalidate_after", "triggers: kept_enabled_during_load", "validation: row_counts_plus_sampled_checksums"], "bad": [1, 2, 4], "whys": {"1": "Production keeps writing: a full-load-only job snapshots the start state and ignores everything after. Without change data capture (online replication) and a delta phase, the target is stale the moment it is built.", "2": "Disabling charset mapping on a latin1-to-utf8 engine change guarantees corrupted accented text — the exact failure the validation log in a real migration flags. Mapping must be explicit.", "4": "Enabled triggers re-fire on every inserted row, doubling child records and corrupting counts. Triggers (and usually foreign-key enforcement) are suspended during bulk load, then re-enabled and validated."}, "okWhys": {"0": "The engine pair is the plan of record — heterogeneous, so schema conversion applies.", "3": "Disabling foreign-key enforcement during bulk load and revalidating after is the standard, correct pattern for load
