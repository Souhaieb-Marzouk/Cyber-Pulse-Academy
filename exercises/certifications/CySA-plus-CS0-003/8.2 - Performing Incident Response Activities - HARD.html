<style>

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;}

:focus-visible{outline:3px solid #7dd3fc;outline-offset:2px;border-radius:6px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#101830f2,#0d1428f2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;backdrop-filter:blur(4px)}

.hdr-title{font-weight:700;font-size:16px}

.hdr-right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipstat{background:var(--chip);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chipstat b{color:var(--accent)}
.timer{font-size:19px;font-weight:700;letter-spacing:1px;padding:6px 14px;border-radius:10px;background:#0a2233;border:1px solid #1c4a63}

.btn{min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line2);background:var(--chip);padding:9px 16px;font-weight:600;transition:background .15s,border-color .15s}

.btn.primary{background:#0c4a6e;border-color:#0284c7}
.btn.primary:hover{background:#075985}
.btn.good{background:#064e3b;border-color:#059669}
.btn.warn{background:#4a3806;border-color:#a16207}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pausechip{display:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.pausechip.on{display:inline-block}
.pausechip.manual{background:var(--warnbg);border:1px solid #a16207;color:var(--warn)}
.pausechip.checkp{background:#26102e;border:1px solid #a855f7;color:#d8b4fe}

.pbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}

.navgrid button.cur{border-color:var(--accent);box-shadow:0 0 0 2px #38bdf855 inset}
.navgrid button.checked{border-color:#0e7490;background:#0a2e3d}

.themestrip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.themestrip .tbar{flex:1 1 140px;min-width:140px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11px;color:var(--dim)}
.themestrip .tbar>i{display:block;height:5px;border-radius:99px;background:#12203a;margin-top:3px;overflow:hidden}
.themestrip .tbar>i>u{display:block;height:100%;background:var(--accent);width:0;text-decoration:none;transition:width .4s}

.exhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.exhead .tag{border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;border:1px solid var(--line2);background:var(--chip2)}
.exhead .tag.theme{color:#93c5fd;border-color:#1e40af;background:#0d1c3a}
.exhead .exnum{margin-left:auto;color:var(--dim);font-size:13px;font-weight:600}
.blk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--panel2)}

.blk.question{border-left:4px solid var(--accent2)}
.blk.question .lbl{background:#251d4a;color:#c4b5fd}
.blk.answers{border-left:4px solid var(--good)}
.blk.answers .lbl{background:#0c2a22;color:#6ee7b7}
.anslabel{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--dim);margin-bottom:8px}

.opt:hover{background:var(--chip2)}
.opt .box{flex:0 0 auto;width:20px;height:20px;border-radius:5px;border:2px solid var(--faint);margin-top:1px}

.opt[aria-pressed=true]{border-color:var(--accent);background:#0d2a44}

.opt.multi .box{border-radius:5px}

.opt .markw{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap}
.markw.ok{color:var(--good)} .markw.bad{color:var(--bad)} .markw.miss{color:var(--warn)}

/* log viewer */
.logwrap{border:1px solid var(--line);border-radius:10px;background:#080d1c;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:#0c1327}

.hl-ts{color:#67e8f9}.hl-ip{color:#c4b5fd}.hl-bad{color:var(--bad);font-weight:700}.hl-good{color:var(--good)}.hl-kw{color:var(--warn);font-weight:600}.hl-str{color:#fda4af}
mark{background:#713f12;color:#fde68a;border-radius:3px;padding:0 2px}

.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mcol h4{margin:0 0 8px;font-size:13px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
.pool,.slotlist{display:flex;flex-direction:column;gap:8px;min-height:60px}
.chipitem{background:var(--chip);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;text-align:left;min-height:44px}
.chipitem.sel{border-color:var(--accent);background:#0d2a44;box-shadow:0 0 0 2px #38bdf855}
.chipitem.ok{border-color:var(--good);background:var(--goodbg)}
.chipitem.bad{border-color:var(--bad);background:var(--badbg)}
.chipitem.miss{border-color:var(--warn);background:var(--warnbg)}
.slot{border:1.5px dashed var(--line2);border-radius:10px;padding:6px;min-height:56px;background:#0a1122}
.slot.over{border-color:var(--accent)}
.slot .slab{font-size:12px;font-weight:800;color:var(--accent);padding:2px 6px;letter-spacing:.4px}
.slot .filled{margin-top:4px}
.slot .emptyhint{color:var(--faint);font-size:12px;padding:6px}

/* order */
.ordlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ordlist li{display:flex;gap:8px;align-items:center;background:var(--chip);border:1px solid var(--line2);border-radius:10px;padding:6px 10px}
.ordlist li.over{border-color:var(--accent)}
.ordlist .idx{flex:0 0 30px;text-align:center;font-weight:800;color:var(--accent)}
.ordlist .otext{flex:1}
.ordlist .mv{display:flex;flex-direction:row;gap:4px}
.ordlist .mv button{min-width:44px;min-height:44px;font-size:14px;padding:1px 8px;border-radius:6px;background:var(--chip2);border:1px solid var(--line2)}
.ordlist li.ok{border-color:var(--good);background:var(--goodbg)}
.ordlist li.bad{border-color:var(--bad);background:var(--badbg)}
.ordlist li.miss{border-color:var(--warn);background:var(--warnbg)}
.dragging{opacity:.45}

/* fill */
.filltext{line-height:2.1}
.filltext select{min-height:44px;min-width:150px;max-width:260px;background:#0d2a44;border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:4px 8px;margin:0 4px;font-size:14px}
.filltext select.ok{border-color:var(--good);background:var(--goodbg)}
.filltext select.bad{border-color:var(--bad);background:var(--badbg)}
.filltext select.miss{border-color:var(--warn);background:var(--warnbg)}

/* spot */
.spotlist{display:flex;flex-direction:column;gap:4px}
.spotline{display:block;width:100%;text-align:left;background:#0a1122;border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
.spotline:hover{border-color:var(--accent)}
.spotline.flag{border-left-color:var(--warn);background:#2a230d}
.spotline .fmark{float:right;font-size:11px;color:var(--warn);font-weight:800}
.spotline.ok{border-left-color:var(--good);background:var(--goodbg)}
.spotline.bad{border-left-color:var(--bad);background:var(--badbg)}
.spotline.miss{border-left-color:var(--warn);background:var(--warnbg)}

/* triage */
.tblwrap{overflow-x:auto}
table.tri{width:100%;border-collapse:collapse;min-width:640px}
table.tri th{font-size:12px;color:var(--dim);text-align:left;padding:8px;border-bottom:1px solid var(--line2);letter-spacing:.5px}
table.tri td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tri select{min-height:44px;background:#0d2a44;border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:4px 8px;min-width:170px}
table.tri select.ok{border-color:var(--good);background:var(--goodbg)}
table.tri select.bad{border-color:var(--bad);background:var(--badbg)}
table.tri select.miss{border-color:var(--warn);background:var(--warnbg)}
.rowmark{font-size:12px;font-weight:800;margin-left:6px}
.rowmark.ok{color:var(--good)}.rowmark.bad{color:var(--bad)}.rowmark.miss{color:var(--warn)}

/* terminal */
.term{background:#050a16;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.termhead{display:flex;gap:6px;padding:8px 10px;background:#0c1327;border-bottom:1px solid var(--line)}
.termhead i{width:11px;height:11px;border-radius:50%;background:#334155;display:inline-block}
.termout{padding:10px;min-height:70px;max-height:260px;overflow:auto}
.termin{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.termin .ps{color:var(--good);font-weight:700;white-space:nowrap}
.termin input{flex:1;min-height:44px;background:transparent;border:none;color:var(--text);font-size:14px}
.termin input:focus{outline:none}

/* branch */
.bstep{border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--panel2)}
.bstep h5{margin:0 0 8px;font-size:13px;color:#c4b5fd;letter-spacing:.6px}
.boutcome{border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.boutcome.neutral{background:var(--panel);border:1px dashed var(--line2);color:var(--dim)}
.boutcome.ok{background:var(--goodbg);border:1px solid var(--good)}
.boutcome.bad{background:var(--badbg);border:1px solid var(--bad)}
.bstep .opt.ok{border-color:var(--good);background:var(--goodbg)}
.bstep .opt.bad{border-color:var(--bad);background:var(--badbg)}

/* feedback + explanation */
.feedback{margin-top:10px}
.frow{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:8px;margin:5px 0;font-size:14px}
.frow.ok{background:var(--goodbg);border:1px solid #065f46}
.frow.bad{background:var(--badbg);border:1px solid #7f1d1d}
.frow.miss{background:var(--warnbg);border:1px solid #78350f}
.frow .ic{font-weight:800}
.frow.ok .ic{color:var(--good)} .frow.bad .ic{color:var(--bad)} .frow.miss .ic{color:var(--warn)}
.fscore{font-weight:800;margin-top:6px;color:var(--accent)}
.expl{margin-top:10px;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:#0d1730}
.expl h4{margin:0 0 6px;font-size:13px;letter-spacing:1px;color:#7dd3fc}
.hintbar{margin-top:8px}
.hintitem{background:var(--warnbg);border:1px dashed #a16207;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px;color:#fde68a}

/* btn row */
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btnrow .spacer{flex:1}

/* intro / review / results */
.hero{background:linear-gradient(160deg,#101c3d,#0c1226 60%);border:1px solid var(--line2);border-radius:16px;padding:26px 26px 20px;margin-top:14px}
.hero h1{margin:0 0 6px;font-size:26px}
.hero .sub{color:var(--dim)}
.metagrid{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.metagrid .m{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.metagrid .m b{display:block;font-size:20px;color:var(--accent)}
.metagrid .m span{font-size:12px;color:var(--dim)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:12px 0}
.rules .r{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.rules .r b{color:#7dd3fc;display:block;margin-bottom:4px;font-size:14px}
.rules .r p{margin:0;font-size:14px;color:var(--dim)}
.kwpanel{margin-top:14px}
.kwpanel details{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.kwpanel summary{cursor:pointer;font-weight:700;color:#7dd3fc}
.kwpanel .kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kwpanel .kws span{background:var(--chip);border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-size:13px}
.bigstart{width:100%;font-size:18px;margin-top:14px}
.banner{border-radius:14px;padding:18px;margin:12px 0;font-weight:700}
.banner.pass{background:linear-gradient(160deg,#052e22,#0a3d2c);border:1px solid var(--good)}
.banner.fail{background:linear-gradient(160deg,#3a0d12,#2b0a0e);border:1px solid var(--bad)}
.banner h2{margin:0 0 4px;font-size:24px}
.banner p{margin:4px 0;font-weight:400;color:var(--dim)}
.scorering{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0}
.ring{width:130px;height:130px;flex:0 0 auto}
.ring .num{font-size:26px;font-weight:800;fill:var(--text)}
.ring .cap{font-size:10px;fill:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.stats .s{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.stats .s b{display:block;font-size:18px}
.stats .s span{font-size:12px;color:var(--dim)}
.reprow{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel2)}
.reprow summary{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.reprow .st{font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;letter-spacing:.5px}
.st.full{background:#064e3b;color:#6ee7b7}.st.partial{background:#3a2c08;color:#fde68a}.st.zero{background:#3a0d12;color:#fca5a5}.st.skipped{background:#2b230c;color:#fbbf24}
.reprow .rtitle{font-weight:600}
.reprow .rpts{margin-left:auto;color:var(--dim);font-size:13px}
.repbody{padding:0 14px 12px;font-size:14px;color:var(--dim)}
.repbody .yes{color:var(--good)} .repbody .no{color:var(--bad)}
.warnbox{background:var(--warnbg);border:1px solid #a16207;border-radius:10px;padding:12px 14px;margin:10px 0}
.pauseveil{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#0b1020cc;flex-direction:column;gap:12px;text-align:center;padding:20px}
.pauseveil.on{display:flex}
body.manual #stage{filter:blur(14px) grayscale(.6);pointer-events:none;user-select:none}
.reviewgrid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.reviewgrid button{min-width:52px;min-height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--chip);font-weight:700}
.reviewgrid button.cur{border-color:var(--accent)}
.reviewgrid button.checked{border-color:#0e7490;background:#0a2e3d}
.reviewgrid button.skipped{border-color:#a16207;background:#3a2c08;color:#fde68a}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}.hdr-title{font-size:14px}.timer{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

     '500107862016 bytes (500 GB) copied, 4021 s, 124 MB/s',
     'hash: 9f2c1a7d4e8b60c3a5d1f7b2e9c40816d3a5b7c9e1f203a4b5c6d7e8f9012345',

    ['1+0 records in', '1+0 records out',
     '500107862016 bytes (500 GB) copied, 4021 s, 124 MB/s',
     'hash: 9f2c1a7d4e8b60c3a5d1f7b2e9c40816d3a5b7c9e1f203a4b5c6d7e8f9012345',
     '(image + rolling SHA-256 recorded \u2014 enter both in the custody form)'],
    ['1+0 records in', '1+0 records out',
     '500107862016 bytes (500 GB) copied, 4021 s, 124 MB/s',
     '(image written \u2014 now compute sha256sum of the image and record that value in the custody form)'],
    ['1+0 records in', '1+0 records out',
     '500107862016 bytes (500 GB) copied, 4021 s, 124 MB/s',
     '9f2c1a7d4e8b60c3a5d1f7b2e9c40816d3a5b7c9e1f203a4b5c6d7e8f9012345  -',
     '(stream hash recorded \u2014 image and hash both go in the custody form)']
  ],
  canon:'dcfldd if=/dev/sdb of=/mnt/evidence/LT214.img hash=sha256 conv=sync,noerror',
  hints:['Imaging tools come in plain and forensic flavours. The forensic variants compute the hash inline; the plain one needs error tolerance added and a hash computed alongside it.'],
  explain:'A forensic acquisition must tolerate read errors and prove integrity. dcfldd or dc3dd do it in one command \u2014 they read the drive, write the image and compute a rolling SHA-256, with conv=sync,noerror padding bad sectors instead of aborting. Plain dd can serve: add conv=sync,noerror for resilience and pipe through sha256sum (or hash the file after) to create the integrity anchor. Anything that stops at the first bad sector, or images without any hash, fails legal review: the first leaves gaps, the second cannot prove the image is the drive. The output\u2019s hash line goes straight into the chain-of-custody form from the previous exercise \u2014 acquisition and custody are one procedure.'

{

    {t:'Data confirmed accessed but not provably exfiltrated, listed with its sensitivity', ok:true},
    {t:'Downtime hours and affected services, from the change and ticket systems', ok:true},

},
{
  id:'h30', type:'spot', theme:'Post-Incident & Program', typeLabel:'Spot the mistake',
  title:'Audit the after-action report',
  scenario:'A contractor delivered the after-action report for the webshell incident. Before it goes to the steering committee, you audit it \u2014 phase discipline and legal sequence included.',
  question:'There are exactly 3 errors in the report. Flag the 3 problematic lines.',
  ansLabel:'FLAG THE MISTAKES \u2014 click a line to flag or unflag it',
  lines:[
    {t:'Detection: the SIEM rule gap for file uploads is documented with the missing log source', bad:false},
    {t:'Containment: we reimaged the production web server within the first hour to stop the spread', bad:true},
    {t:'Eradication: the SQL injection flaw was fixed and the exposed database credentials rotated', bad:false},
    {t:'Notification: customers were emailed before legal reviewed the duty, to get ahead of the story', bad:true},
    {t:'Recovery: services returned after validation testing and 72 hours of clean monitoring', bad:false},
    {t:'Evidence: RAM and network state were noted as handled informally, outside the custody process', bad:true}
  ],
  badCount:3,
  hints:['One line confuses two adjacent phases; one inverts a legal sequence; one admits a custody break as if it were normal.'],
  explain:'Three errors stand out. Containment is not reimaging \u2014 reimage is eradication, and doing it "within the first hour" destroyed volatile evidence while claiming to contain. Notification before legal review inverts the mandatory sequence: the duty assessment defines audience and content, and getting "ahead of the story" is how companies misstate facts they must later correct. Evidence handled "informally, outside the custody process" is an admission that the report\u2019s own basis is unprovable \u2014 in court this poisons everything derived from it. The other three lines are correctly labelled and sequenced: detection gap documented, eradication with credential rotation, recovery with validation and soak time. An after-action report that cannot pass this audit becomes evidence against the organisation instead of for it.'
}
);

</script>
<script>
/* ================= CySA+ 8.2 exam engine (part 1: framework) ================= */
(function(){
'use strict';
var EX = window.EX || [];
var CFG = window.CFG || {};
var KW = window.KW || {};
var META = {};
try { META = JSON.parse(document.getElementById('cm-exercise-meta').textContent); } catch(e){}
var N = EX.length;
var PEREX = CFG.perEx || 180;
var TOTAL = (window.__CM_TEST_FAST__ ? 0 : 0) || PEREX * N;
var fastParam = 0;
try { fastParam = parseInt(new URLSearchParams(location.search).get('fast')||'0',10) || 0; } catch(e){}
if (fastParam > 0) { TOTAL = fastParam; }

var S = {
  order: [], cur: -1, view: 'intro', started: false, ended: false,
  manual: false, checkPause: false, remaining: TOTAL, reported: false,
  ans: [], username: '', tick: null
};

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtTime(sec){ sec=Math.max(0,sec); var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; var mm=(m<10&&h>0?'0':'')+m, ss=(s<10?'0':'')+s; return h>0 ? h+':'+mm+':'+ss : mm+':'+ss; }
function rnd1(x){ return Math.round(x*10)/10; }
function themeOf(ex){ return ex.theme || 'General'; }
function scrollMotion(){ try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; } catch(e){ return 'auto'; } }
function isSkippedState(a){ return !!(a.skipped && !a.checked); } /* checked answers keep their score even if Skip was pressed after Check */
function scrollMotion(){ try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; } catch(e){ return 'auto'; } }
function isSkippedState(a){ return !!(a.skipped && !a.checked); } /* checked answers keep their score even if Skip was pressed after Check */

/* ---------- init answer state ---------- */
function freshAns(){ return { status:'new', checked:false, skipped:false, earned:0, max:10, hints:0, sum:'', ui:{} }; }
function resetAll(){
  S.ended=false; S.started=false; S.manual=false; S.checkPause=false;
  S.remaining=TOTAL; S.reported=false; S.cur=-1;
  S.ans = EX.map(function(){ return freshAns(); });
  S.order = shuf(EX.map(function(_,i){ return i; }));
}

/* ---------- website handshake ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  try {
    S.username = event.data.username || '';
  } catch(e){}
  paintGreeting();
});
function paintGreeting(){
  if (!S.username) return;
  ['greetline','greetsub'].forEach(function(id){
    var g = $(id);
    if (g) g.textContent = 'Good luck, ' + S.username + '.';
  });
}

function reportScore(correct, total){
  if (S.reported) return;
  S.reported = true;
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: 'cysa-plus',
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= 70
    }, location.origin);
  } catch (e) { /* opened directly, nothing to report to */ }
}

/* ---------- timer ---------- */
function anyPause(){ return S.manual || S.checkPause; }
function startTimer(){
  if (S.tick) clearInterval(S.tick);
  S.tick = setInterval(function(){
    if (!S.started || S.ended || anyPause()) return;
    S.remaining--;
    if (S.remaining <= 0) { S.remaining = 0; paintTimer(); endExam('time'); return; }
    paintTimer();
  }, 1000);
  paintTimer();
}
function paintTimer(){
  var t = $('timerbox'); if (!t) return;
  t.textContent = fmtTime(S.remaining);
  t.classList.toggle('low', S.remaining <= 300);
}
function paintPauseChips(){
  var m = $('pausechipManual'), c = $('pausechipCheck');
  if (m) m.classList.toggle('on', S.manual);
  if (c) c.classList.toggle('on', S.checkPause);
  document.body.classList.toggle('manual', S.manual && S.view === 'exam');
  var veil = $('pauseveil');
  if (veil) veil.classList.toggle('on', S.manual && S.view === 'exam');
}
function setManual(v){ S.manual = v; paintPauseChips(); var b=$('pausebtn'); if(b){ b.textContent = S.manual ? 'Resume' : 'Pause'; b.setAttribute('aria-pressed', S.manual?'true':'false'); } }

/* ---------- live score ---------- */
function liveScore(){
  var e=0, a=0;
  S.ans.forEach(function(x,i){ if(x.checked){ e+=x.earned; a++; } });
  return {e:rnd1(e), a:a};
}
function paintScore(){
  var ls = liveScore();
  var sc=$('scorebox'), an=$('ansbox');
  if (sc) sc.innerHTML = 'Score: <b>'+ls.e+'</b> pts';
  if (an) an.textContent = 'Answered: '+ls.a+'/'+N;
  var pb = $('pbarfill');
  if (pb) pb.style.width = Math.round(100*(ls.a/N))+'%';
  paintThemeStrip();
}
function paintThemeStrip(){
  var strip = $('themestrip'); if(!strip) return;
  var acc = {};
  EX.forEach(function(ex,i){ var t=themeOf(ex); acc[t]=acc[t]||{c:0,d:0}; acc[t].d++; if(S.ans[i]&&S.ans[i].checked){ acc[t].c++; acc[t].e=(acc[t].e||0)+S.ans[i].earned; } });
  strip.innerHTML = '';
  Object.keys(acc).forEach(function(t){
    var o=acc[t];
    var b=el('div','tbar'); b.title=t;
    b.innerHTML = esc(t)+' ('+o.c+'/'+o.d+')<i><u style="width:'+Math.round(100*o.c/o.d)+'%"></u></i>';
    strip.appendChild(b);
  });
}
function paintNav(){
  var g = $('navgrid'); if(!g) return;
  g.innerHTML='';
  S.order.forEach(function(ei,pos){
    var a=S.ans[ei];
    var st = a.checked ? 'answered' : (isSkippedState(a) ? 'skipped' : 'not answered yet');
    var mark = a.checked ? '<span class="navstate" aria-hidden="true">\u2713</span>' : (isSkippedState(a) ? '<span class="navstate" aria-hidden="true">\u2026</span>' : '');
    var b=el('button',null, String(pos+1)+mark);
    b.type='button';
    b.title = 'Exercise '+(pos+1)+' — ' + EX[ei].title + ' (' + st + ')';
    b.setAttribute('aria-label','Go to exercise '+(pos+1)+', '+st);
    if (pos===S.cur && S.view==='exam') b.classList.add('cur');
    if (a.checked) b.classList.add('checked');
    if (isSkippedState(a)) b.classList.add('skipped');
    if (pos===S.cur && S.view==='review') b.classList.add('cur');
    b.disabled = S.ended;
    b.addEventListener('click', function(){ if(!S.ended){ gotoQ(pos); } });
    g.appendChild(b);
  });
}

/* ---------- navigation ---------- */
function gotoQ(pos){
  if (pos < 0 || pos >= N) return;
  S.cur = pos; S.view='exam';
  renderExam();
}
function nextQ(){
  S.checkPause = false; paintPauseChips();
  if (S.cur < N-1) { gotoQ(S.cur+1); }
  else { renderReview(); }
}
function prevQ(){ if (S.cur > 0) gotoQ(S.cur-1); }

/* ---------- check / revise / skip / hint ---------- */
function curEx(){ return EX[S.order[S.cur]]; }
function curAns(){ return S.ans[S.order[S.cur]]; }

function doCheck(){
  var ex = curEx(), a = curAns();
  var box = $('answerbox'); if(!box) return;
  var res = grade(ex, a); /* {earned, elements:[{label,state}], complete} */
  var factor = Math.max(0, 1 - 0.10 * a.hints);
  a.earned = Math.round(res.earned * factor * 10) / 10;
  a.status = 'checked'; a.checked = true; a.skipped = false;
  a.sum = summarize(ex, a);
  S.checkPause = true;
  paintPauseChips();
  markAnswers(ex, a, res, box);
  paintFeedback(res, a);
  showExpl();
  paintScore(); paintNav();
  var rb = $('revisebtn'); if (rb) rb.disabled = false;
  var fb = $('feedback'); if (fb) fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function doRevise(){
  var a = curAns();
  a.checked = false; a.status = 'new'; a.earned = 0;
  reviseUI(curEx(), a);
  var fb=$('feedback'); if(fb) fb.innerHTML='';
  var ex_=$('explbox'); if(ex_) ex_.style.display='none';
  paintScore(); paintNav();
}
function doSkip(){
  var a = curAns();
  if (!a.checked) a.skipped = true; /* a checked answer keeps its score; Skip then only moves on */
  nextQ();
}
function doHint(){
  var ex = curEx(), a = curAns();
  var hints = ex.hints || [];
  if (a.hints >= hints.length) return;
  var h = hints[a.hints]; a.hints++;
  var bar = $('hintbar');
  if (bar) {
    var item = el('div','hintitem','<b>Hint '+(a.hints)+' (cost: \u221210% of this exercise):</b> '+h);
    bar.appendChild(item);
  }
  var hb = $('hintbtn');
  if (hb && a.hints >= hints.length) hb.disabled = true;
}

/* ---------- explanation / feedback paint ---------- */
function paintFeedback(res, a){
  var fb = $('feedback'); if(!fb) return;
  fb.innerHTML = '';
  var factor = Math.max(0, 1 - 0.10 * a.hints);
  (res.elements||[]).forEach(function(e2){
    var word = e2.state==='ok' ? '\u2713 Correct' : (e2.state==='bad' ? '\u2715 Wrong' : (e2.state==='miss' ? '\u26a0 Missed' : ''));
    if (!word) return;
    fb.appendChild(el('div','frow '+e2.state, '<span class="ic">'+word+'</span><span>'+e2.label+'</span>'));
  });
  var max = a.max;
  var shown = Math.round(res.earned * factor * 10)/10;
  fb.appendChild(el('div','fscore','You earned '+shown+' / '+max+' points on this exercise.'));
}
function showExpl(){
  var ex = curEx(), a = curAns();
  var b = $('explbox'); if(!b) return;
  b.style.display='block';
  b.innerHTML = '<h4>WHY \u2014 EXPLANATION</h4><div>'+ex.explain+'</div>';
}

/* ---------- views ---------- */
function renderApp(){
  var app = $('app');
  app.innerHTML = '';
  app.appendChild(buildHeader());
  var stage = el('div'); stage.id='stage'; app.appendChild(stage);
  var veil = el('div','pauseveil','<h2>Paused (manual)</h2><p>Exercise content is hidden while the timer is paused this way.</p><button class="btn primary" id="resumebtn" type="button">Resume</button>');
  veil.id='pauseveil';
  app.appendChild(veil);
  veil.querySelector('#resumebtn').addEventListener('click', function(){ setManual(false); });
}
function buildHeader(){
  var h = el('div','hdr');
  h.innerHTML =
    '<div class="hdr-row">'+
      '<div><div class="hdr-title">'+esc(CFG.examTitle)+'</div>'+
      '<div class="hdr-sub">'+esc(CFG.sev)+' severity \u00b7 pass mark 70% \u00b7 <span id="greetline"></span></div></div>'+
      '<div class="hdr-right">'+
        '<span class="pausechip manual" id="pausechipManual">\u23f8 Paused (manual)</span>'+
        '<span class="pausechip checkp" id="pausechipCheck">\u23f1 Timer paused \u2014 review mode</span>'+
        '<span class="timer" id="timerbox" aria-label="Time remaining">'+fmtTime(TOTAL)+'</span>'+
        '<button class="btn" id="pausebtn" type="button" aria-pressed="false">Pause</button>'+
        '<span class="chipstat" id="scorebox">Score: <b>0</b> pts</span>'+
        '<span class="chipstat" id="ansbox">Answered: 0/'+N+'</span>'+
        '<button class="btn ghost" id="reviewbtn" type="button">Review &amp; submit</button>'+
      '</div>'+
    '</div>'+
    '<div class="pbar" aria-hidden="true"><div id="pbarfill"></div></div>'+
    '<div class="navgrid" id="navgrid" role="navigation" aria-label="Exercise navigator"></div>'+
    '<div class="themestrip" id="themestrip"></div>';
  h.querySelector('#pausebtn').addEventListener('click', function(){ setManual(!S.manual); });
  h.querySelector('#reviewbtn').addEventListener('click', function(){ if(!S.ended){ renderReview(); } });
  return h;
}

function showIntro(){
  S.view='intro';
  var st=$('stage');
  st.innerHTML='';
  var hero = el('div','hero');
  var kwHtml = '';
  Object.keys(KW).forEach(function(t){
    kwHtml += '<details><summary>'+esc(t)+'</summary><div class="kws">';
    KW[t].forEach(function(k){ kwHtml += '<span>'+esc(k)+'</span>'; });
    kwHtml += '</div></details>';
  });
  hero.innerHTML =
    '<h1>8.2 - Performing Incident Response Activities</h1>'+
    '<div class="sub" id="greetsub"></div>'+
    '<p>'+CFG.blurb+'</p>'+
    '<div class="metagrid">'+
      '<div class="m"><b>'+N+'</b><span>exercises</span></div>'+
      '<div class="m"><b>'+Math.round(TOTAL/60)+'</b><span>minutes (timer)</span></div>'+
      '<div class="m"><b>70%</b><span>pass mark</span></div>'+
      '<div class="m"><b>'+CFG.sev+'</b><span>severity</span></div>'+
      '<div class="m"><b>10</b><span>points each</span></div>'+
    '</div>'+
    '<div class="rules">'+
      '<div class="r"><b>Check</b><p>Press <b>Check</b> to grade an exercise. Correct parts turn green, wrong parts red, missed parts amber. Checking automatically pauses the timer in <b>review mode</b>: content stays visible, and the timer resumes only when you press <b>Next</b>.</p></div>'+
      '<div class="r"><b>Two kinds of pause</b><p><b>Manual Pause</b> hides the exercise while paused. <b>Check-pause</b> keeps everything visible so you can study the feedback. Both can stack; the clock only runs when neither is active.</p></div>'+
      '<div class="r"><b>Skip &amp; come back</b><p><b>Skip</b> jumps to the next exercise and marks it amber in the navigator. You can return to any skipped exercise while time remains. Skipped exercises are <b>excluded from scoring</b> entirely.</p></div>'+
      '<div class="r"><b>Partial credit</b><p>Multi-answer exercises are scored <b>per correct element</b>. Getting 3 of 4 slots right earns 3/4 of the points. Wrong picks earn nothing extra but do not subtract.</p></div>'+
      '<div class="r"><b>Hints</b><p>Each hint reveals a nudge and costs <b>\u221210%</b> of that exercise\u2019s points. Hints never pause the timer.</p></div>'+
      '<div class="r"><b>'+esc(CFG.termLabel)+'</b><p>'+CFG.termHelp+'</p></div>'+
      '<div class="r"><b>Exercise types</b><p>Alert-triage tables, log analysis with a live filter box, drag-and-drop matching, multi-select, single-choice questions, timeline ordering and priority ranking, fill-in-the-blank reports, spot-the-mistake configs, branching decisions, and the simulated terminal described above.</p></div>'+
    '</div>'+
    '<div class="kwpanel"><h3 style="margin:4px 0 2px">Keywords covered</h3><p style="color:var(--dim);font-size:13px;margin:2px 0 8px">Every keyword below is exercised at least once in this exam.</p>'+kwHtml+'</div>'+
    '<button class="btn primary bigstart" id="startbtn" type="button">Start the '+esc(CFG.sev)+' exam</button>';
  st.appendChild(hero);
  paintGreeting();
  $('startbtn').addEventListener('click', function(){
    resetAll(); S.started=true; startTimer(); S.view='exam'; S.cur=0;
    renderExam();
  });
  paintNav(); paintScore(); paintTimer(); paintPauseChips();
  var pb=$('pausebtn'), rb=$('reviewbtn'); /* re-enable header controls after a Retake (endExam disables them) */
  if (pb) pb.disabled = false;
  if (rb) rb.disabled = false;
}

function renderExam(){
  S.view='exam';
  paintPauseChips();
  var st=$('stage'); st.innerHTML='';
  var ei=S.order[S.cur], ex=EX[ei], a=S.ans[ei];
  var card = el('section','card');
  var head = el('div','exhead');
  head.innerHTML = '<span class="tag">'+esc(ex.typeLabel)+'</span><span class="tag theme">'+esc(ex.theme)+'</span><span class="exnum">Exercise '+(S.cur+1)+' of '+N+' \u00b7 10 pts</span>';
  card.appendChild(head);
  var sc = el('div','blk scenario','<span class="lbl">SCENARIO</span><div>'+ex.scenario+'</div>');
  card.appendChild(sc);
  var q = el('div','blk question','<span class="lbl">QUESTION</span><div>'+ex.question+'</div>');
  card.appendChild(q);
  var ab = el('div','blk answers');
  ab.id='answerbox';
  ab.innerHTML = '<span class="lbl">ANSWERS</span><div class="anslabel">'+esc(ex.ansLabel)+'</div>';
  card.appendChild(ab);
  var hb = el('div','hintbar'); hb.id='hintbar'; card.appendChild(hb);
  var fb = el('div','feedback'); fb.id='feedback'; card.appendChild(fb);
  var eb = el('div','expl'); eb.id='explbox'; eb.style.display='none'; card.appendChild(eb);
  var br = el('div','btnrow');
  function mkbtn(id,txt,cls,fn,dis){ var b=el('button','btn '+(cls||''),txt); b.type='button'; b.id=id; if(dis)b.disabled=true; b.addEventListener('click',fn); return b; }
  br.appendChild(mkbtn('checkbtn','Check','good',doCheck));
  br.appendChild(mkbtn('revisebtn','Revise','',doRevise,'true'));
  br.appendChild(mkbtn('hintbtn','Hint (\u221210%)','warn',doHint, !(ex.hints&&ex.hints.length) || a.hints >= (ex.hints||[]).length));
  br.appendChild(mkbtn('skipbtn','Skip','',doSkip));
  br.appendChild(el('span','spacer'));
  br.appendChild(mkbtn('prevbtn','\u2190 Prev','',prevQ, S.cur===0));
  br.appendChild(mkbtn('nextbtn', S.cur===N-1 ? 'Next \u2192 Review' : 'Next \u2192','primary',nextQ));
  card.appendChild(br);
  st.appendChild(card);
  renderType(ex, a, ab);
  $('revisebtn').disabled = !a.checked;
  if (a.checked) { reMark(ex, a, ab); var res=grade(ex,a); paintFeedback(res,a); showExpl(); }
  try { st.querySelector('.blk.question').setAttribute('tabindex','-1'); } catch(e){}
  paintNav(); paintScore();
  window.scrollTo({top:0,behavior:scrollMotion()});
}

function renderReview(){
  S.view='review';
  /* NOTE: an active Check-pause is intentionally NOT cleared here — only "Next" may resume it */
  paintPauseChips();
  var st=$('stage'); st.innerHTML='';
  var card = el('section','card');
  var skipped=[], unanswered=[];

  if (skipped.length) html += '<div class="warnbox"><b>'+skipped.length+' skipped exercise(s):</b> '+skipped.map(function(p){return '#'+(p+1);}).join(', ')+'. Skipped exercises are excluded from scoring entirely \u2014 neither their points earned nor their possible points count. You can still open them below and finish them before submitting.</div>';
  if (unanswered.length) html += '<div class="warnbox"><b>'+unanswered.length+' unchecked exercise(s):</b> '+unanswered.map(function(p){return '#'+(p+1);}).join(', ')+'. They count as zero points unless you go back and answer them.</div>';
  card.innerHTML = html;
  var grid = el('div','reviewgrid');
  S.order.forEach(function(ei,pos){
    var a=S.ans[ei];
    var mark = a.checked ? '<span class="navstate" aria-hidden="true">\u2713</span>' : (isSkippedState(a) ? '<span class="navstate" aria-hidden="true">\u2026</span>' : '');
    var st = a.checked ? 'answered' : (isSkippedState(a) ? 'skipped' : 'not answered yet');
    var b=el('button',null,(pos+1)+mark);
    b.type='button';
    b.title=EX[ei].title+' ('+st+')';
    b.setAttribute('aria-label','Go to exercise '+(pos+1)+', '+st);
    if(a.checked) b.classList.add('checked');
    if(isSkippedState(a)) b.classList.add('skipped');
    b.addEventListener('click',function(){ gotoQ(pos); });
    grid.appendChild(b);
  });
  card.appendChild(grid);
  var br = el('div','btnrow');
  var back = el('button','btn','\u2190 Back to exercise');
  back.type='button'; back.addEventListener('click', function(){ gotoQ(Math.max(0,S.cur)); });
  var sp=el('span','spacer');
  var sub = el('button','btn good','Submit exam');
  sub.type='button'; sub.id='submitbtn'; sub.setAttribute('aria-label','Submit the exam for scoring');
  sub.addEventListener('click', submitClicked);
  br.appendChild(back); br.appendChild(sp); br.appendChild(sub);
  card.appendChild(br);
  st.appendChild(card);
  paintNav();
  window.scrollTo({top:0,behavior:scrollMotion()});
}
function submitClicked(){
  var anyAnswered = S.ans.some(function(x){ return x.checked; });
  if (!anyAnswered) {
    var st=$('stage');
    var w = el('div','warnbox','<b>Cannot submit:</b> every exercise is skipped or unanswered. Please answer at least one exercise before submitting. No score was reported.');
    st.insertBefore(w, st.firstChild);
    return;
  }
  var skippedCount = S.ans.filter(function(x){ return x.skipped; }).length;
  if (skippedCount > 0) {
    var ok = window.confirm(skippedCount+' exercise(s) are still skipped and will be excluded from scoring. Submit anyway?');
    if (!ok) return;
  }
  endExam('submit');
}

/* ================= engine part 2: results + exercise types ================= */

/* ---------- end of exam & results ---------- */
function endExam(reason){
  if (S.ended) return;
  S.ended = true;
  setManual(false); S.checkPause = false;
  if (S.tick) { clearInterval(S.tick); S.tick = null; }
  var pb=$('pausebtn'), rb=$('reviewbtn');
  if (pb) { pb.disabled = true; }
  if (rb) { rb.disabled = true; }
  renderResults(reason);
}
function computeResults(){
  var possible = 0, earned = 0, full=0, partial=0, zero=0, skipped=0;
  var rows = [];
  S.order.forEach(function(ei,pos){
    var ex=EX[ei], a=S.ans[ei];
    if (a.skipped && !a.checked) { skipped++; rows.push({pos:pos,ex:ex,a:a,label:'skipped'}); return; }
    possible += 10;
    var e = a.checked ? a.earned : 0;
    earned += e;
    var label = e>=9.95 ? 'full' : (e>0.05 ? 'partial' : 'zero');
    if (label==='full') full++; else if (label==='partial') partial++; else zero++;
    rows.push({pos:pos,ex:ex,a:a,label:label});
  });
  earned = Math.round(earned);
  var percent = possible>0 ? Math.round(earned/possible*100) : 0;
  return {possible:possible, earned:earned, percent:percent, full:full, partial:partial, zero:zero, skipped:skipped, rows:rows};
}
function correctSummary(ex){
  try {
    if (ex.type==='qcm' || ex.type==='logview') {
      for (var i=0;i<ex.options.length;i++) if (ex.options[i].ok) return ex.options[i].t;
    }
    if (ex.type==='multi') return ex.options.filter(function(o){return o.ok;}).map(function(o){return o.t;}).join(' \u00b7 ');
    if (ex.type==='match') return ex.slots.map(function(s,i){ var it=ex.items.filter(function(x){return x.s===i;})[0]; return s.label+': '+(it?it.t:''); }).join(' \u00b7 ');
    if (ex.type==='order') return ex.ordered.join(' \u2192 ');
    if (ex.type==='fill') return ex.blanks.map(function(b){return b.a;}).join(' \u00b7 ');
    if (ex.type==='terminal') return ex.canon;
    if (ex.type==='spot') return ex.lines.map(function(l,i){return l.bad?('line '+(i+1)+': '+l.t):null;}).filter(Boolean).join(' \u00b7 ');
    if (ex.type==='triage') return ex.rows.map(function(r,i){return (i+1)+': '+ex.opts[r.a];}).join(' \u00b7 ');
    if (ex.type==='branch') return ex.steps.map(function(s,i){ var c=s.choices.filter(function(x){return x.ok;})[0]; return 'step '+(i+1)+': '+(c?c.t:''); }).join(' \u00b7 ');
  } catch(e){}
  return '(see explanation)';
}
function renderResults(reason){
  var st=$('stage'); st.innerHTML='';

  var pass = R.possible>0 && R.percent>=70;
  var banner = el('div','banner '+(pass?'pass':'fail'));

  } else if (pass) {
    banner.innerHTML = '<h2>\u2713 PASSED'+who+'</h2><p>You reached the 70% pass mark for this '+esc(CFG.sev)+' exam. Certificate panel: <b>'+esc(CFG.examTitle)+'</b> \u2014 8.2 mastered at '+esc(CFG.sev)+' level.</p>';
  } else {
    banner.innerHTML = '<h2>\u2715 FAILED'+who+'</h2><p>You scored below the 70% pass mark. Study the report below, focus on the amber and red topics, then retake the exam.</p>';

  card.appendChild(banner);
  if (R.possible>0) {
    var ringWrap = el('div','scorering');
    var C = 2*Math.PI*52;
    var col = pass ? '#34d399' : '#f87171';
    ringWrap.innerHTML =
      '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Final score '+R.percent+' percent">'+
      '<circle cx="60" cy="60" r="52" fill="none" stroke="#1b2540" stroke-width="12"/>'+
      '<circle cx="60" cy="60" r="52" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-R.percent/100))+'" transform="rotate(-90 60 60)"/>'+
      '<text class="num" x="60" y="58" text-anchor="middle">'+R.percent+'%</text>'+
      '<text class="cap" x="60" y="76" text-anchor="middle">PASS MARK 70%</text></svg>';
    var stats = el('div','stats');
    [['+R.earned+ / '+R.possible,'points (skipped excluded)'],[R.full,'fully correct'],[R.partial,'partially correct'],[R.zero,'zero points'],[R.skipped,'skipped (not counted)']].forEach(function(p){
      var d=el('div','s','<b>'+p[0]+'</b><span>'+p[1]+'</span>'); stats.appendChild(d);
    });
    ringWrap.appendChild(stats);
    card.appendChild(ringWrap);
    if (R.skipped>0) {
      var names=[];
      R.rows.forEach(function(r){ if(r.label==='skipped') names.push('#'+(r.pos+1)+' '+esc(r.ex.title)); });
      card.appendChild(el('div','warnbox','<b>Excluded from scoring:</b> '+names.join(' \u00b7 ')+'. These exercises were skipped, so their points were removed from both the score and the total.'));
    }
    var th = el('h3',null,'Per-exercise report'); card.appendChild(th);
    R.rows.forEach(function(r){
      var a=r.a, ex=r.ex;
      var d = el('details','reprow');

      d.innerHTML = '<summary><span class="st '+lab+'">'+lab.toUpperCase()+'</span><span class="rtitle">#'+(r.pos+1)+' '+esc(ex.title)+'</span><span class="rpts">'+pts+' pts</span></summary>'+
        '<div class="repbody">'+
        (a.checked ? '<div><b>Your answer:</b> '+esc(a.sum||'(empty)')+'</div>'
                   : (a.skipped ? '<div><b>Status:</b> skipped \u2014 not counted in score or total.</div>'
                                : '<div><b>Status:</b> not answered \u2014 counted as zero points.</div>'))+
        '<div style="margin-top:4px"><b>Correct answer:</b> '+esc(correctSummary(ex))+'</div>'+
        '<div style="margin-top:6px">'+ex.explain+'</div>'+
        '</div>';
      card.appendChild(d);
    });
  }
  var br = el('div','btnrow');

  ret.type='button';
  ret.addEventListener('click', function(){ resetAll(); showIntro(); window.scrollTo({top:0,behavior:scrollMotion()}); });
  br.appendChild(ret);
  card.appendChild(br);

  paintNav(); paintScore();
  window.scrollTo({top:0,behavior:scrollMotion()});

}

/* ---------- log syntax highlighting ---------- */
function hl(line){
  var s = esc(line);
  s = s.replace(/\b(?:\d{1,3}\[\.\]){3}\d{1,3}\b/g, '<span class="hl-ip">$&</span>');
  s = s.replace(/\b\d{2}:\d{2}:\d{2}\b/g, '<span class="hl-ts">$&</span>');
  s = s.replace(/\b(Failed|failed|denied|Denied|ERROR|error|refused|Refused|invalid|Invalid|unauthorized)\b/g, '<span class="hl-bad">$&</span>');
  s = s.replace(/\b(Accepted|accepted|success|Success|OK|PASS)\b/g, '<span class="hl-good">$&</span>');
  s = s.replace(/\b(sudo|GET|POST|PUT|DELETE|DELETE|powershell|cmd\.exe|ssh2|sshd|VPN|vpn)\b/g, '<span class="hl-kw">$&</span>');
  s = s.replace(/(&quot;[^&]*?&quot;)/g, '<span class="hl-str">$1</span>');
  return s;
}

/* ---------- type registry ---------- */
var TYPES = {};

function grade(ex,a){ return TYPES[ex.type].grade(ex,a); }
function markAnswers(ex,a,res,box){ if(TYPES[ex.type].mark) TYPES[ex.type].mark(ex,a,res,box); }
function reMark(ex,a,box){ var res=grade(ex,a); markAnswers(ex,a,res,box); }
function reviseUI(ex,a){ if(TYPES[ex.type].revise) TYPES[ex.type].revise(ex,a); else renderExam(); }
function summarize(ex,a){ return TYPES[ex.type].sum ? TYPES[ex.type].sum(ex,a) : '(answered)'; }

/* ---------- option list (qcm / multi / logview) ---------- */
function optionBlock(ex, a, multi){
  var d = el('div');
  a.ui.picked = a.ui.picked || (multi? [] : -1);
  var opts = a.ui.shuffled || (a.ui.shuffled = shuf(ex.options.map(function(o,i){return {t:o.t, ok:o.ok, i:i};})));
  opts.forEach(function(o){
    var b = el('button','opt'+(multi?' multi':''), '<span class="box" aria-hidden="true"></span><span>'+o.t+'</span><span class="markw" aria-hidden="true"></span>');
    b.type='button'; b.dataset.oi = String(o.i);
    var wasPicked = multi ? (a.ui.picked.indexOf(o.i)>=0) : (a.ui.picked===o.i);
    b.setAttribute('aria-pressed', wasPicked ? 'true' : 'false');
    b.addEventListener('click', function(){
      if (a.checked) return;
      if (multi) {
        var k=a.ui.picked.indexOf(o.i);
        if (k>=0) { a.ui.picked.splice(k,1); b.setAttribute('aria-pressed','false'); }
        else { a.ui.picked.push(o.i); b.setAttribute('aria-pressed','true'); }
      } else {
        a.ui.picked = o.i;
        Array.prototype.forEach.call(d.querySelectorAll('.opt'),function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      }
    });
    d.appendChild(b);
  });
  return d;
}
TYPES.qcm = {
  render: function(ex,a){ return optionBlock(ex,a,false); },
  grade: function(ex,a){
    var p = a.ui.picked, ok=false;
    if (p>=0 && ex.options[p] && ex.options[p].ok) ok=true;
    return {earned: ok?10:0, elements:[{label: p>=0 ? 'Your choice: '+ex.options[p].t : 'No answer selected', state: ok?'ok':'bad'}]};
  },
  mark: function(ex,a,res,box){
    Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(b){
      var i=+b.dataset.oi; var w=b.querySelector('.markw');

      else if (i===a.ui.picked) { b.classList.add('mark-bad'); w.textContent='\u2715 your pick'; w.className='markw bad'; }
    });
  },
  revise: function(ex,a){ renderExam(); },
  sum: function(ex,a){ return a.ui.picked>=0 ? ex.options[a.ui.picked].t : '(no answer)'; }
};
TYPES.multi = {
  render: function(ex,a){ return optionBlock(ex,a,true); },
  grade: function(ex,a){
    var picked = a.ui.picked||[];
    var els=[], okCount=0, nOk=0;
    ex.options.forEach(function(o){
      if (o.ok) nOk++;
    });
    ex.options.forEach(function(o,i){
      var sel = picked.indexOf(i)>=0;
      if (o.ok && sel) { okCount++; els.push({label:o.t, state:'ok'}); }
      else if (o.ok && !sel) els.push({label:o.t, state:'miss'});
      else if (!o.ok && sel) els.push({label:o.t, state:'bad'});
    });
    var per = 10/nOk;
    return {earned: per*okCount, elements: els};
  },
  mark: function(ex,a,res,box){
    var picked=a.ui.picked||[];
    Array.prototype.forEach.call(box.querySelectorAll('.opt'),function(b){
      var i=+b.dataset.oi; var o=ex.options[i]; var w=b.querySelector('.markw');
      if (o.ok && picked.indexOf(i)>=0) { b.classList.add('mark-ok'); w.textContent='\u2713 correct'; w.className='markw ok'; }
      else if (o.ok) { b.classList.add('mark-miss'); w.textContent='\u26a0 missed'; w.className='markw miss'; }
      else if (picked.indexOf(i)>=0) { b.classList.add('mark-bad'); w.textContent='\u2715 wrong pick'; w.className='markw bad'; }
    });
  },
  revise: function(ex,a){ renderExam(); },
  sum: function(ex,a){ var p=a.ui.picked||[]; return p.length? p.map(function(i){return ex.options[i].t;}).join(' \u00b7 ') : '(no answer)'; }
};

/* ---------- match (drag & drop) ---------- */
TYPES.match = {
  render: function(ex,a){
    var ui=a.ui;
    if (!ui.placed) {
      ui.placed = ex.slots.map(function(){ return -1; });
      ui.bank = shuf(ex.items.map(function(_,i){return i;}));
      ui.sel = -1;
    }
    var d = el('div');
    var grid = el('div','mgrid');
    var left = el('div','mcol'); left.innerHTML='<h4>Items to place</h4>';
    var pool = el('div','pool'); pool.id='pool_'+a._k; left.appendChild(pool);
    var right = el('div','mcol'); right.innerHTML='<h4>Slots</h4>';
    var slots = el('div','slotlist'); right.appendChild(slots);
    function paintPool(){
      pool.innerHTML='';
      ui.bank.forEach(function(ii){
        var it=ex.items[ii];
        var b=el('button','chipitem'+(ui.sel===ii?' sel':''), it.t);
        b.type='button'; b.draggable = !a.checked;
        b.setAttribute('aria-label','Item: '+it.t+'. Press to select, then choose a slot.');
        b.addEventListener('click', function(){
          if (a.checked) return;
          if (ui.placed.indexOf(ii)>=0) { /* placed chips are not in bank */ }
          ui.sel = (ui.sel===ii? -1 : ii);
          paintPool(); paintSlots();
        });
        b.addEventListener('dragstart', function(ev){ try{ ev.dataTransfer.setData('text/plain', String(ii)); }catch(e){} });
        pool.appendChild(b);
      });
      if (!ui.bank.length) pool.appendChild(el('div','emptyhint','All items placed.'));
    }
    function paintSlots(){
      slots.innerHTML='';
      ex.slots.forEach(function(s,si){
        var sl=el('div','slot');
        sl.dataset.si=String(si);
        sl.innerHTML='<span class="slab">'+s.label+'</span>';
        if (ui.placed[si]>=0) {
          var it=ex.items[ui.placed[si]];
          var fb=el('button','chipitem filled', it.t);
          fb.type='button';
          fb.title='Click to return this item to the pool';
          fb.addEventListener('click', function(){
            if (a.checked) return;
            ui.bank.push(ui.placed[si]);
            ui.placed[si]=-1; paintPool(); paintSlots();
          });
          sl.appendChild(fb);
        } else {
          sl.appendChild(el('div','emptyhint','Drop here or click an item, then click this slot'));
        }
        sl.addEventListener('click', function(ev){
          if (a.checked) return;
          if (ev.target!==sl && ev.target.className && String(ev.target.className).indexOf('emptyhint')<0) return;
          place(si);
        });
        sl.addEventListener('dragover', function(ev){ ev.preventDefault(); sl.classList.add('over'); });
        sl.addEventListener('dragleave', function(){ sl.classList.remove('over'); });
        sl.addEventListener('drop', function(ev){
          ev.preventDefault(); sl.classList.remove('over');
          var ii=parseInt(ev.dataTransfer.getData('text/plain'),10);
          if (isNaN(ii) || a.checked) return;
          var bi=ui.bank.indexOf(ii);

          ui.bank.splice(bi,1);
          if (ui.placed[si]>=0) ui.bank.push(ui.placed[si]);
          ui.placed[si]=ii; ui.sel=-1;
          paintPool(); paintSlots();
        });
        slots.appendChild(sl);
      });
    }
    function place(si){
      if (ui.sel<0) return;
      var bi=ui.bank.indexOf(ui.sel);
      if (bi<0) return;
      ui.bank.splice(bi,1);
      if (ui.placed[si]>=0) ui.bank.push(ui.placed[si]);
      ui.placed[si]=ui.sel; ui.sel=-1;
      paintPool(); paintSlots();

  grade: function(ex,a){

      else els.push({label:s.label+' \u2014 '+ex.items[pi].t, state:'bad'});
    });
    return {earned: 10*okc/ex.slots.length, elements: els};
  },
  mark: function(ex,a,res,box){
    var ui=a.ui;
    var slots = box.querySelectorAll('.slot');
    ex.slots.forEach(function(s,si){
      var sl=slots[si]; if(!sl) return;
      var pi=ui.placed[si];
      sl.classList.remove('over');
      var chip = sl.querySelector('.chipitem');
      var good = pi>=0 && ex.items[pi].s===si;
      var empty = pi<0;
      var cls = good?'ok':(empty?'miss':'bad');
      if (chip) chip.classList.add(cls);
      var old = sl.querySelector('.slotnote'); if (old && old.remove) old.remove();
      var note=document.createElement('span');
      note.className='slotnote markw '+cls;
      note.style.display='block';note.style.fontSize='12px';note.style.fontWeight='800';
      note.textContent = good?'\u2713 correct':(empty?'\u26a0 empty \u2014 missed':'\u2715 wrong item');
      sl.appendChild(note);
    });
  },
  revise: function(ex,a){ renderExam(); },
  sum: function(ex,a){
    var ui=a.ui; var parts=[];
    ex.slots.forEach(function(s,si){ if(ui.placed[si]>=0) parts.push(s.label+': '+ex.items[ui.placed[si]].t); });
    return parts.length?parts.join(' \u00b7 '):'(nothing placed)';
  }
};

        var up=el('button',null,'\u25b2'); up.type='button'; up.title='Move up'; up.setAttribute('aria-label','Move item '+ex.ordered[ii]+' up');
        var dn=el('button',null,'\u25bc'); dn.type='button'; dn.title='Move down'; dn.setAttribute('aria-label','Move item '+ex.ordered[ii]+' down');
        up.addEventListener('click', function(){ if(a.checked)return; if(pos>0){ var t=ui.seq[pos-1]; ui.seq[pos-1]=ui.seq[pos]; ui.seq[pos]=t; paint(); } });
        dn.addEventListener('click', function(){ if(a.checked)return; if(pos<ui.seq.length-1){ var t=ui.seq[pos+1]; ui.seq[pos+1]=ui.seq[pos]; ui.seq[pos]=t; paint(); } });
        mv.appendChild(up); mv.appendChild(dn);
        li.appendChild(mv);
        li.addEventListener('dragstart', function(ev){ try{ev.dataTransfer.setData('text/plain',String(pos));}catch(e){} li.classList.add('dragging'); });
        li.addEventListener('dragend', function(){ li.classList.remove('dragging'); });
        li.addEventListener('dragover', function(ev){ ev.preventDefault(); li.classList.add('over'); });
        li.addEventListener('dragleave', function(){ li.classList.remove('over'); });
        li.addEventListener('drop', function(ev){
          ev.preventDefault(); li.classList.remove('over');
          var from=parseInt(ev.dataTransfer.getData('text/plain'),10);
          if (isNaN(from)||a.checked) return;
          var item=ui.seq.splice(from,1)[0];
          ui.seq.splice(pos,0,item);
          paint();
        });
        ol.appendChild(li);
      });
    }
    paint();
    d.appendChild(ol);
    return d;
  },
  grade: function(ex,a){
    var els=[], okc=0;
    a.ui.seq.forEach(function(ii,pos){
      if (ii===pos) { okc++; els.push({label:'Position '+(pos+1)+': '+ex.ordered[ii], state:'ok'}); }
      else els.push({label:'Position '+(pos+1)+' \u2014 you placed \u201c'+ex.ordered[ii]+'\u201d, expected \u201c'+ex.ordered[pos]+'\u201d', state:'bad'});
    });
    return {earned: 10*okc/ex.ordered.length, elements: els};
  },
  mark: function(ex,a,res,box){
    var lis=box.querySelectorAll('.ordlist li');
    a.ui.seq.forEach(function(ii,pos){
      var li=lis[pos]; if(!li) return;
      li.classList.add(ii===pos?'ok':'bad');
    });
  },
  revise: function(ex,a){ renderExam(); },
  sum: function(ex,a){ return a.ui.seq.map(function(ii){return ex.ordered[ii];}).join(' \u2192 '); }
};

/* ---------- fill ---------- */
TYPES.fill = {
  render: function(ex,a){
    var ui=a.ui;
    if (!ui.bank) ui.bank = shuf(ex.bank);
    var d=el('div','filltext');
    var parts = ex.text.split(/\{\{(\d+)\}\}/);
    var html='';
    parts.forEach(function(p,i){
      if (i%2===1) {
        html += '<select data-b="'+p+'" aria-label="Blank '+(parseInt(p,10)+1)+'"><option value="">\u2014 choose \u2014</option>';
        ui.bank.forEach(function(w){ html += '<option value="'+esc(w)+'">'+esc(w)+'</option>'; });
        html += '</select>';
      } else html += esc(p);
    });
    d.innerHTML = html;
    if (a.ui.vals) {
      Array.prototype.forEach.call(d.querySelectorAll('select'),function(s){
        if (a.ui.vals[s.dataset.b]) s.value=a.ui.vals[s.dataset.b];
      });
    }
    d.addEventListener('change', function(ev){
      var s=ev.target; if(s.tagName!=='SELECT') return;
      a.ui.vals = a.ui.vals||{};
      a.ui.vals[s.dataset.b]=s.value;
    });
    return d;
  },
  grade: function(ex,a){
    var els=[], okc=0;
    ex.blanks.forEach(function(b,n){
      var v=(a.ui.vals&&a.ui.vals[String(n)])||'';
      if (!v) els.push({label:'Blank '+(n+1)+' \u2014 empty (expected: '+b.a+')', state:'miss'});
      else if (v===b.a) { okc++; els.push({label:'Blank '+(n+1)+': '+v, state:'ok'}); }
      else els.push({label:'Blank '+(n+1)+' \u2014 you chose \u201c'+v+'\u201d, expected \u201c'+b.a+'\u201d', state:'bad'});
    });
    return {earned: 10*okc/ex.blanks.length, elements: els};
  },
  mark: function(ex,a,res,box){
    Array.prototype.forEach.call(box.querySelectorAll('select'),function(s){
      var n=+s.dataset.b; var v=s.value; var b=ex.blanks[n];
      s.classList.remove('ok','bad','miss');
      if (!v) s.classList.add('miss');
      else s.classList.add(v===b.a?'ok':'bad');
    });
  },
  revise: function(ex,a){ renderExam(); },
  sum: function(ex,a){ var v=a.ui.vals||{}; return ex.blanks.map(function(b,n){return v[String(n)]||'(empty)';}).join(' \u00b7 '); }
};

/* ---------- spot the mistake ---------- */
TYPES.spot = {
  render: function(ex,a){
    var ui=a.ui;
    if (!ui.flags) ui.flags={};
    var d=el('div');
    d.appendChild(el('div','anslabel','Click a line to flag it as a mistake. Click again to unflag. There are exactly '+ex.badCount+' mistakes.'));
    var list=el('div','spotlist');
    function paint(){
      list.innerHTML='';
      ex.lines.forEach(function(l,i){
        var b=el('button','spotline'+(ui.flags[i]?' flag':''), (l.bad?'':'')+'<span class="mono">'+esc(l.t)+'</span>'+(ui.flags[i]?'<span class="fmark">FLAGGED</span>':''));
        b.type='button';
        b.setAttribute('aria-pressed', ui.flags[i]?'true':'false');
        b.setAttribute('aria-label','Line '+(i+1)+': '+l.t+'. Press to toggle mistake flag.');
        b.addEventListener('click', function(){
          if (a.checked) return;
          if (ui.flags[i]) delete ui.flags[i]; else ui.flags[i]=true;
          paint();
        });
        list.appendChild(b);
      });
    }
    paint();
    d.appendChild(list);
    return d;
  },
  grade: function(ex,a){
    var els=[], okc=0;
    ex.lines.forEach(function(l,i){
      var f=!!a.ui.flags[i];
      if (l.bad && f) { okc++; els.push({label:'Line '+(i+1)+' \u2014 correctly flagged', state:'ok'}); }
      else if (l.bad && !f) els.push({label:'Line '+(i+1)+' \u2014 mistake missed: '+l.t, state:'miss'});
      else if (!l.bad && f) els.push({label:'Line '+(i+1)+' \u2014 flagged but correct: '+l.t, state:'bad'});
    });
    return {earned: 10*okc/ex.badCount, elements: els};
  },
  mark: function(ex,a,res,box){
    var lis=box.querySelectorAll('.spotline');
    ex.lines.forEach(function(l,i){
      var b=lis[i]; if(!b) return;
      b.classList.remove('ok','bad','miss');
      var f=!!a.ui.flags[i];
      if (l.bad && f) b.classList.add('ok');
      else if (l.bad) b.classList.add('miss');
      else if (f) b.classList.add('bad');
    });
  },
  revise: function(ex,a){ renderExam(); },
  sum: function(ex,a){ var f=Object.keys(a.ui.flags||{}); return f.length? ('flagged line(s) '+(f.map(function(x){return +x+1;}).join(', '))) : '(nothing flagged)'; }
};

/* ---------- triage table ---------- */
TYPES.triage = {
  render: function(ex,a){
    var ui=a.ui;
    if (!ui.vals) ui.vals = ex.rows.map(function(){ return ''; });
    var d=el('div');
    var w=el('div','tblwrap');
    var t=el('table','tri');
    var h='<thead><tr><th style="min-width:220px">Alert</th><th style="min-width:150px">Source / time</th><th>Classification or action</th></tr></thead><tbody>';
    ex.rows.forEach(function(r,i){
      h += '<tr><td>'+r.t+'</td><td style="color:var(--dim);font-size:13px">'+r.meta+'</td><td><select data-i="'+i+'" aria-label="Decision for alert '+(i+1)+'"><option value="">\u2014 choose \u2014</option>';
      ex.opts.forEach(function(o,oi){ h+='<option value="'+oi+'">'+esc(o)+'</option>'; });
      h += '</select><span class="rowmark" aria-hidden="true"></span></td></tr>';
    });
    t.innerHTML=h+'</tbody>';
    w.appendChild(t); d.appendChild(w);
    t.addEventListener('change', function(ev){
      if (ev.target.tagName!=='SELECT') return;
      ui.vals[+ev.target.dataset.i]=ev.target.value;
    });
    if (a.checked) {
      var sels=t.querySelectorAll('select');
      ex.rows.forEach(function(r,i){ if(ui.vals[i]!=='') sels[i].value=ui.vals[i]; });
    }
    return d;
  },
  grade: function(ex,a){
    var els=[], okc=0;
    ex.rows.forEach(function(r,i){
      var v=a.ui.vals[i];
      if (v==='') els.push({label:'Alert '+(i+1)+' \u2014 empty (expected: '+ex.opts[r.a]+')', state:'miss'});
      else if (+v===r.a) { okc++; els.push({label:'Alert '+(i+1)+': '+ex.opts[r.a], state:'ok'}); }
      else els.push({label:'Alert '+(i+1)+' \u2014 you chose \u201c'+ex.opts[+v]+'\u201d, expected \u201c'+ex.opts[r.a]+'\u201d', state:'bad'});
    });
    return {earned: 10*okc/ex.rows.length, elements: els};
  },
  mark: function(ex,a,res,box){
    var sels=box.querySelectorAll('select');
    var marks=box.querySelectorAll('.rowmark');
    ex.rows.forEach(function(r,i){
      var v=a.ui.vals[i];
      var s=sels[i], m=marks[i];
      if(!s) return;
      s.classList.remove('ok','bad','miss');
      if (v==='') { s.classList.add('miss'); if(m){m.textContent='\u26a0 empty';m.className='rowmark miss';} }
      else if (+v===r.a) { s.classList.add('ok'); if(m){m.textContent='\u2713';m.className='rowmark ok';} }
      else { s.classList.add('bad'); if(m){m.textContent='\u2715';m.className='rowmark bad';} }
    });
  },
  revise: function(ex,a){ renderExam(); },
  sum: function(ex,a){ return ex.rows.map(function(r,i){ return a.ui.vals[i]===''?'(empty)':ex.opts[+a.ui.vals[i]]; }).join(' \u00b7 '); }
};

/* ---------- terminal ---------- */
TYPES.terminal = {
  render: function(ex,a){
    var ui=a.ui;
    if (!ui.out) { ui.out = (ex.pre||[]).slice(); ui.ran=-1; ui.hist=[]; }
    var d=el('div');
    var t=el('div','term');
    var th=el('div','termhead','<i></i><i></i><i></i><span style="color:var(--dim);font-size:12px;margin-left:6px">'+esc(ex.host||'analyst@ir-lab')+': ~ (training shell \u2014 not a real system)</span>');
    t.appendChild(th);
    var out=el('div','termout');
    out.id='termout';
    t.appendChild(out);
    var row=el('div','termin');
    var ps=el('span','ps','$');
    var inp=el('input'); inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
    inp.setAttribute('aria-label','Type a command and press Enter');
    row.appendChild(ps); row.appendChild(inp);
    t.appendChild(row);
    function paint(){ out.innerHTML = ui.out.map(function(l){ return '<div class="logline">'+hl(l)+'</div>'; }).join(''); out.scrollTop=out.scrollHeight; }
    /* probe: expand combined short flags ("-ano" -> "-a -n -o") so accept patterns can
       check for the presence of each flag regardless of the order the student typed */
    function expandFlags(s){
      var flat = (' '+s.replace(/[\t ]+/g,' ').trim()+' ');
      return flat.replace(/(^|\s)-([a-z]{2,})(?=\s|$)/g, function(m,sp,fl){
        return sp + fl.split('').map(function(c){ return '-'+c; }).join(' ');
      });
    }
    function exec(cmd){
      var line='$ '+cmd;
      ui.out.push(line);
      if (cmd.trim()) {
        ui.hist.push(cmd);
        var raw=cmd.trim(), probe=expandFlags(raw);
        var matched=-1;
        (ex.accept||[]).forEach(function(r,ri){ if(matched<0){ try{ var re=new RegExp(r,'i'); if(re.test(raw) || re.test(probe)) matched=ri; }catch(e){} } });
        if (matched>=0) {
          ui.ran=matched; ui.ranCmd=cmd.trim();
          (ex.simOut&&ex.simOut[matched]||[ '(command executed \u2014 output recorded)' ]).forEach(function(l){ ui.out.push(l); });
        } else {
          var c0=cmd.trim().split(/\s+/)[0];
          if (c0==='help') { ui.out.push('Training shell: type the command the exercise asks for and press Enter.'); }
          else if (c0==='ls') { ui.out.push('logs/  evidence/  notes.txt'); }
          else if (c0==='pwd') { ui.out.push('/home/analyst'); }
          else if (c0==='whoami') { ui.out.push('analyst'); }
          else ui.out.push('sh: '+c0+': command not found \u2014 check the exercise instructions.');
        }
      }
      paint();
    }
    inp.addEventListener('keydown', function(ev){
      if (ev.key==='Enter') { exec(inp.value); inp.value=''; }
    });
    paint();
    d.appendChild(t);
    d.appendChild(el('div','anslabel','Run the command, then press <b>Check</b> to grade it. You can run several commands; the accepted one counts.'));
    return d;
  },
  grade: function(ex,a){
    var ok = a.ui.ran>=0;
    return {earned: ok?10:0, elements:[{label: ok ? 'Executed: '+a.ui.ranCmd : 'No accepted command was executed yet.', state: ok?'ok':'bad'}]};
  },
  mark: function(ex,a,res,box){},
  revise: function(ex,a){},
  sum: function(ex,a){ return a.ui.ranCmd || '(no command executed)'; }
};

/* ---------- branching scenario ---------- */
TYPES.branch = {
  render: function(ex,a){
    var ui=a.ui;
    if (!ui.picks) ui.picks = [];
    var d=el('div','branchwrap');
    function paint(){
      d.innerHTML='';
      ex.steps.forEach(function(s,si){
        if (si>ui.picks.length) return;
        var st=el('div','bstep');
        st.innerHTML='<h5>DECISION '+(si+1)+' OF '+ex.steps.length+'</h5><div>'+s.situation+'</div>';
        s.choices.forEach(function(c,ci){
          var b=el('button','opt','<span class="box" aria-hidden="true"></span><span>'+c.t+'</span><span class="markw" aria-hidden="true"></span>');
          b.type='button';
          var picked = ui.picks[si]===ci;
          b.setAttribute('aria-pressed', picked?'true':'false');
          if (a.checked && ui.picks[si]!==undefined) {
            if (c.ok) { b.classList.add('ok'); b.querySelector('.markw').textContent='\u2713 correct'; }
            else if (picked) { b.classList.add('bad'); b.querySelector('.markw').textContent='\u2715 your pick'; }
          }
          b.addEventListener('click', function(){
            if (a.checked || ui.picks[si]!==undefined) return;
            ui.picks[si]=ci;
            paint();
          });
          st.appendChild(b);
        });
        if (ui.picks[si]!==undefined) {
          var c=s.choices[ui.picks[si]];
          /* outcomes stay neutral until Check — the reveal moment belongs to Check, per spec */
          if (a.checked) st.appendChild(el('div','boutcome '+(c.ok?'ok':'bad'), (c.ok?'\u2713 ':'\u2715 ')+c.outcome));
          else st.appendChild(el('div','boutcome neutral', c.outcome));
        }
        d.appendChild(st);
      });
    }
    paint();
    return d;
  },
  grade: function(ex,a){
    var els=[], okc=0;
    ex.steps.forEach(function(s,si){
      var p=a.ui.picks[si];
      if (p===undefined) els.push({label:'Decision '+(si+1)+' \u2014 not made', state:'miss'});
      else if (s.choices[p].ok) { okc++; els.push({label:'Decision '+(si+1)+': '+s.choices[p].t, state:'ok'}); }
      else els.push({label:'Decision '+(si+1)+' \u2014 '+s.choices[p].t, state:'bad'});
    });
    return {earned: 10*okc/ex.steps.length, elements: els};
  },
  mark: function(ex,a,res,box){
    var old = box.querySelector('.branchwrap');
    if (old && old.remove) old.remove();
    box.appendChild(TYPES.branch.render(ex,a));
  },
  revise: function(ex,a){ a.ui.picks=[]; renderExam(); },
  sum: function(ex,a){ return ex.steps.map(function(s,si){ var p=a.ui.picks[si]; return p===undefined?'(no decision)':s.choices[p].t; }).join(' \u00b7 '); }
};

/* ---------- boot ---------- */
resetAll();
renderApp();
showIntro();
})();

</script>

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
