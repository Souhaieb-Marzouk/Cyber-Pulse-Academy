const DATA = {"meta":{"topicId":"cysa-plus","chapter":4,"title":"Efficiency and Process Improvement in Security Operations — MEDIUM","difficulty":"medium","questionCount":31,"estimatedMinutes":60,"passMark":70},"intro":"This is the MEDIUM tier of objective 1.5. Every exercise joins two or three connected ideas: you read a realistic artefact from a security operations team, decide what is really happening, and choose the improvement that fits. The goal is always stated; the path is not. Every keyword of the objective is exercised in this file, and again in the HARD file with different scenarios, different data and different reasoning.","exercises":[{"id":"med-1","type":"order","theme":"Automation intake","summary":"Service desk backlog — put the six intake steps of one automation project in order","scenario":[{"label":"Artefact 1 — Note from the SOC team lead, 08:40","kind":"text","text":"The team wants to automate the ticket creation for phishing alerts. The lead wrote the six steps on sticky notes last week and dropped them on the floor. She wants to run this project the same way for every future automation, so the order matters."}],"question":"Put the six steps in the order in which the team should do them.","items":["Pick one repeated task and count how often it happens each week","Write the manual steps down as a runbook, including every decision point","Measure the current time and cost of handling one hundred of those tickets","Build the script or playbook in a test tenancy with sample alerts","Pilot it on live alerts behind a human approval step","Review the metrics after thirty days, then tune it or roll it back"],"hint":"Start with a number you can compare against later. Writing code is never step one.","explain":"An automation project starts with a measurement, not with a tool. First the team picks one repeated task and counts it, because a task that happens twice a month will never repay the build time. Then the manual steps are written down as a runbook: you cannot automate a process that nobody has described, and the runbook stays useful when the automation fails. The baseline measurement of time and cost comes next, because without it you cannot prove afterwards that anything improved. Only then is the playbook built, in a test tenancy, so a mistake cannot touch production. The pilot runs on live alerts behind a human approval step, and the loop closes after thirty days with a review of the numbers. This is also the Lean and Kaizen habit: small, repeated improvements instead of one giant rewrite.","study":"Learn the intake order: select and count, document as a runbook, measure the baseline, build in a test area, pilot with approval, review and tune.","keys":["Runbook","Automation candidate selection","Process mapping","Continuous improvement","Return on investment (ROI)","Guardrails and rollback","Lean and Kaizen"]},{"id":"med-2","type":"mcq","theme":"Automation candidate selection","summary":"Four tasks, one automation slot — pick the task that pays back first","scenario":[{"label":"Artefact 1 — Weekly task table, week 12","kind":"kv","rows":[["Task A","Block a file hash that the threat feed already marks as malicious: 900 per week, 2 minutes each, fixed steps, easy to undo"],["Task B","Reverse engineer an unknown malware sample: 3 per week, 4 hours each, different every time"],["Task C","Call the customer to explain a blocked payment: 120 per week, 9 minutes each, needs empathy and judgement"],["Task D","Write the monthly board report from the metrics: 1 per month, 5 hours, needs business context"]]},{"label":"Artefact 2 — Constraint from the team lead","kind":"text","text":"We have one build slot this quarter: five days of an engineer's time. Pick the task that gives the most benefit for those five days."}],"question":"Which task should the team automate first?","options":["Blocking the hash from the feed: high volume, fixed steps, easy to undo","Reverse engineering the sample: the most analyst time saved per case","Calling the customer: the queue is the longest one in the team","Writing the board report: only the lead can do it at the moment"],"answer":0,"hint":"Multiply the volume by the time per case, then ask how predictable the steps are.","explain":"The best first automation is a task that is high volume, short, rule-based and reversible. Blocking a hash is all four: 900 cases a week at two minutes each is about thirty analyst hours, the steps never change, and a wrong block can be undone with one more call. Reverse engineering saves a lot of time per case but only happens three times a week, and the work is different every time, so a playbook would break on the first unusual sample. Calling customers is high volume but needs empathy and judgement, and a wrong automated call damages trust. The board report is once a month, so the build cost would never repay itself.","study":"Score automation candidates on volume, time per case, how fixed the steps are, and how easy the action is to undo.","keys":["Automation candidate selection","SOAR platform","Automated containment","Human-in-the-loop approval","Ticket automation"]},{"id":"med-3","type":"sort","theme":"Guardrails on automation","summary":"Eight routine actions — decide what may run alone, what needs approval, and what stays human","scenario":[{"label":"Artefact 1 — Draft automation policy, section 4","kind":"text","text":"The policy splits automatic actions into three groups. Actions that only add information or close clear noise may run alone. Actions that change the state of a user, a host or a mailbox need a named human approval first. Actions that need legal, financial or commercial judgement stay with a person."}],"question":"Place each action in the group where the policy puts it.","bins":["Runs alone","Human approval first","Stays with a person"],"items":[{"t":"Add the sender reputation and the URL verdict to every phishing alert","bin":0},{"t":"Close alerts whose sender is on the internal allow list","bin":0},{"t":"Open a ticket for every new critical alert and assign it to the on-call queue","bin":0},{"t":"Disable a user account after a confirmed credential-theft alert","bin":1},{"t":"Isolate an endpoint that is talking to a known command-and-control server","bin":1},{"t":"Decide whether a legal hold applies to an employee mailbox","bin":2},{"t":"Draft the customer notification letter for a confirmed breach","bin":2},{"t":"Approve a payment to a new supplier after a business email compromise report","bin":2}],"hint":"Ask what the action changes. Adding facts changes nothing. Disabling, isolating and paying change the business.","explain":"Enrichment, allow-list closure and ticket creation only add information or remove clear noise, so they run alone and they save the most analyst minutes. Disabling an account and isolating an endpoint change the state of a real system, so the policy wants a named human approval first: the analyst keeps the decision, and the rollback step is written next to the action. Legal holds, breach notifications and payment approvals carry legal and commercial consequences, so they stay with a person who is accountable for the wording. The test is not how urgent the action feels, it is what the action changes and who answers for it afterwards.","study":"Classify automatic actions by what they change: nothing, a system state, or a legal and commercial position.","keys":["Alert enrichment","Automated containment","Human-in-the-loop approval","Guardrails and rollback","Ticket automation","Case management","Policy enforcement"]},{"id":"med-4","type":"logq","theme":"Noisy correlation rule","summary":"Rule COR-118 fires 143 times in one day — find the right fix, not the loud one","scenario":[{"label":"Artefact 1 — SIEM rule description","kind":"text","text":"Rule COR-118, name: Possible brute force. Logic: five failed logons from one source inside sixty seconds. Severity: high. Queue: Tier 1."},{"label":"Artefact 2 — Twenty of the 143 alerts, 03:00 to 03:04","kind":"log","lines":[{"t":"03:00:12","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:00:24","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:00:36","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:00:48","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:01:00","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:01:12","s":"auth","m":"COR-118 fired: possible brute force from backup-02"},{"t":"03:01:30","s":"auth","m":"svc_backup logon succeeded on backup-02 after the rotation job updated the stored secret"},{"t":"03:02:12","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:02:24","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:02:36","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:02:48","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:03:00","s":"auth","m":"svc_backup logon failed for user svc_backup on backup-02, reason: password expired"},{"t":"03:03:12","s":"auth","m":"COR-118 fired: possible brute force from backup-02"}]}],"question":"One source, one account, one reason, every night at the same time. What is the correct next step?","options":["Tune COR-118 to exclude the service account and keep the rest","Delete COR-118, because it has only ever produced noise","Raise the threshold to five hundred failures in one minute","Ask the service desk to switch off the nightly backup job"],"answer":0,"hint":"The alert is true but useless. Ask what a human would need to see before the rule is worth waking someone.","explain":"The rule is not wrong: five failures really did happen in sixty seconds. The problem is that all five come from one service account with one known cause, the password rotation, and they repeat every night. The quiet fix is to tune the rule so that service accounts are handled separately, and to keep the human threshold for interactive accounts. Deleting the rule would remove a real detection, and raising the threshold to five hundred would hide a genuine brute force against a user account. Switching off the backup job is not a security control at all. At the same time the team should look at the rotation job, because a service account that fails five times every night is a small risk of its own.","study":"Separate service-account behaviour from user behaviour in a rule instead of raising thresholds for everyone.","keys":["SIEM correlation rule","Rule tuning and threshold","False positive rate","Alert fatigue","Suppression and exception","Signal-to-noise ratio"]},{"id":"med-5","type":"match","theme":"Metrics that matter","summary":"New joiner card — pair each operations metric with the definition that belongs to it","scenario":[{"label":"Artefact 1 — SOC metrics handbook, page 2","kind":"text","text":"A new analyst must be able to read the weekly dashboard without help. The definitions below are the ones the team agreed on with the CISO."}],"question":"Pair each metric with the definition that belongs to it.","pairs":[["Mean time to detect (MTTD)","the average time from the first event to the first alert"],["Mean time to acknowledge (MTTA)","the average time from the alert to an analyst picking it up"],["Mean time to respond (MTTR)","the average time from the alert to the threat being contained"],["Dwell time","how long an attacker stayed inside the network before being found"],["False positive rate","the share of alerts that turn out not to be real"],["Escalation rate","the share of alerts that a Tier 1 analyst passes to Tier 2"]],"hint":"Detect, acknowledge, respond: three different clocks, measured from three different moments.","explain":"Each metric starts its clock at a different moment, and mixing them hides the real problem. MTTD starts at the first event on a host and ends when the alert appears: it measures the detection, not the people. MTTA starts at the alert and ends when a human opens it: it measures the queue and the shift pattern. MTTR starts at the alert and ends when the threat is contained: it measures the whole response. Dwell time starts when the attacker first got in and ends when somebody noticed, so it is the number a board understands best. The false positive rate is the share of alerts that are not real, and the escalation rate shows how much work Tier 1 pushes upward. If MTTA rises while MTTD falls, the detection improved and the queue staff did not: that is a staffing or routing problem, not a tool problem.","study":"Learn where each clock starts and stops. Detect, acknowledge and respond are three different measurements.","keys":["Mean time to detect (MTTD)","Mean time to acknowledge (MTTA)","Mean time to respond (MTTR)","Dwell time","False positive rate","Dashboard and reporting"]},{"id":"med-6","type":"terminal","theme":"Repetitive log work","summary":"Task 88 — count the failed logons for one service account, without reading the file by hand","scenario":[{"label":"Artefact 1 — Ticket INC-4471, assigned to you","kind":"kv","rows":[["Reported by","Service desk, 08:12"],["Symptom","The nightly backup account svc_backup may be locked out every night"],["Request","Give me the number of failed logons for svc_backup in yesterday's authentication log"],["Constraint","Do not change anything on the host; this is a read-only count"]]}],"question":"Type one command that prints only the number of failed logon lines for svc_backup in `/var/log/auth.log`.","prompt":"analyst@soc-ws-02:~$","env":"You are on the analyst workstation. Use a text-search command on the log file. Only the count is needed, not the matching lines.","syntax":{"shape":"grep -c <pattern> <file>","opts":[["-c","print only the number of matching lines, not the lines themselves"],["-i","ignore upper and lower case while matching"],["-w","match the whole word only"]],"example":"grep -c session opened /var/log/auth.log"},"canonical":"grep -c svc_backup /var/log/auth.log","tool":"grep","flags":["c"],"allowFlags":["i","w","E","F","n"],"argsAny":["auth.log"],"target":"auth.log","termIntro":["Practice shell on soc-ws-02. Type the command, then press Run command.","Nothing leaves this page: the shell is not connected to any system."],"termOut":["412","soc-ws-02:/var/log$ "],"parts":[["grep","searches a text file for a pattern and prints the matches"],["-c","changes the output from the matching lines to a single count"],["svc_backup","the account named in the ticket"],["/var/log/auth.log","the file that holds yesterday's authentication events"]],"hint":"You need the count, not the lines. One option turns the matching lines into a number.","explain":"The ticket asks for a number, so the command must count rather than print. The option -c does exactly that: it prints 412 instead of four hundred and twelve lines. That number answers the service desk question at once, and it is also the first measurement of a repetitive task: if this check runs every morning, it is a good candidate for automation. Note what the command does not do. It does not lock the account, it does not edit the log, and it does not need administrator rights, which matches the constraint in the ticket.","study":"A count is a measurement. Turning a repeated manual check into one command is the first step of automation.","keys":["Scripting (Python, Bash, PowerShell)","Automation candidate selection","Case management","Workload balancing"]},{"id":"med-7","type":"fill","theme":"Playbook wording","summary":"Complete the phishing playbook with the right four words","scenario":[{"label":"Artefact 1 — Draft playbook PB-12, phishing alert","kind":"text","text":"The playbook is being moved from a wiki page into the SOAR platform. Four words are missing from the description. The team lead will approve the wording before the build starts."}],"question":"Choose the right word for each blank in the playbook description.","parts":["When the phishing alert fires, the playbook first {{}} the message with the sender reputation and the URL verdicts.","If the verdict is malicious, the playbook {{}} the message from every mailbox and opens a {{}} for the user who reported it.","Nothing is deleted and no mailbox is blocked without a {{}} from the Tier 2 analyst."],"answers":["enriches","quarantines","ticket","human approval"],"bank":["enriches","quarantines","ticket","human approval","deletes","escalates","waiver","closes"],"hint":"The first step only adds facts. The second changes every mailbox. The last blank names the person who says yes.","explain":"Enrichment means adding the facts the analyst would otherwise look up: the sender reputation, the URL verdict, the file hash result. It changes nothing, so it is safe to run automatically and it saves the most time. Quarantine removes the message from every mailbox, which is a change to the business, so it needs the approval step that the last blank names. The ticket records the case for the user and for the audit trail: an action with no case behind it cannot be explained six months later. The word 'deletes' is a trap. A playbook should quarantine and keep the evidence, because a deleted message cannot be examined and a wrong deletion cannot be undone. A waiver is a permanent written acceptance of a risk, which is a different thing from one approval.","study":"Enrichment adds facts, containment changes state, the ticket records the case, and approval names the human who decided.","keys":["Playbook","Alert enrichment","Human-in-the-loop approval","Case management","Ticket automation"]},{"id":"med-8","type":"multi","theme":"Guardrails before go-live","summary":"Four conditions the SOAR platform must meet before it may contain anything by itself","scenario":[{"label":"Artefact 1 — Go-live checklist, containment playbooks","kind":"text","text":"The team wants the platform to isolate endpoints and disable accounts without an analyst pressing a button. The security manager will only sign the checklist if the controls below are in place. Select every control that must be there."}],"question":"Which controls must be in place before automatic containment is switched on? Select every correct one.","options":["A rollback step for every action it can take","A service account with domain administrator rights","A playbook that states who approves what, and when","Secrets kept in a secret store, not inside the script","A rule that no alert may ever be closed by a person","A dashboard that only the vendor is allowed to read"],"answer":[0,2,3],"hint":"Two of these options would make the automation more dangerous, not safer.","explain":"Three controls are essential. A rollback step means every action can be undone, so a wrong isolation costs minutes instead of a day. A written playbook states the approval rule, so nobody has to guess at 03:00 whether the platform or the analyst owns the decision. Secrets in a secret store mean the credential is rotated and audited in one place, and it never lands in a script that gets copied to a share. The other three are traps. Domain administrator rights are exactly what an attacker wants if the automation platform is ever compromised: the service account should hold only the rights the playbook needs. A rule that no human may close an alert removes the judgement that the automation is supposed to support. A dashboard only the vendor can read removes the team's own ability to check what the automation did.","study":"Automatic containment needs a rollback, a written approval rule, least privilege and a secret store.","keys":["SOAR platform","Guardrails and rollback","Secrets management for automation","Human-in-the-loop approval","Playbook","Policy enforcement"]},{"id":"med-9","type":"spot","theme":"Automation code review","summary":"An enrichment script is about to be merged — find the line that must be fixed first","scenario":[{"label":"Artefact 1 — Merge request MR-221, file /opt/soar/enrich.py","kind":"code","lines":["import requests","API_KEY = \"sk_live_9f2c41ab77e0d\"","def enrich(host):","    r = requests.get(API + \"/v1/host/\" + host, headers={\"Authorization\": API_KEY})","    return r.json()"]},{"label":"Artefact 2 — Reviewer comment","kind":"text","text":"This script will run on the production enrichment worker every minute. It is stored in the team's code repository, and the repository is cloned to every analyst laptop."}],"question":"Which line is the mistake that must be fixed before this is merged?","options":["Line 2: the API key is written in the file instead of a secret store","Line 3: the function takes a host name instead of a host object","Line 4: the request sends the key in a header instead of the query","Line 5: the JSON reply is returned without being checked first"],"answer":0,"hint":"Ask where this file will be copied, and who can read it after that.","explain":"The line that matters is line 2. A live API key in a source file is a secret in a place that was never designed to hold one: the repository keeps every version of it forever, every clone has a copy, and rotating the key means editing and re-merging the script. The key belongs in a secret store, and the script should read it at run time, so the credential can be rotated without touching the code. The other three lines are style points at worst. Sending the key in an Authorization header is the normal way to call an API, taking a host name is exactly what this function is for, and validating the reply is a good idea but it is not a leaked credential. Fixing line 2 first also means the key must be rotated, because a committed key is a burned key.","study":"Automation scripts must read secrets at run time from a secret store. A key in a repository is a key that leaked.","keys":["Secrets management for automation","Scripting (Python, Bash, PowerShell)","API integration","Change management and CAB","Infrastructure as code"]},{"id":"med-10","type":"branch","theme":"Triage decision chain","summary":"A command-and-control alert goes three steps — one wrong turn at any step costs the case","scenario":[{"label":"Artefact 1 — Alert queue, 14:22","kind":"kv","rows":[["Alert","COR-204, endpoint talking to a known command-and-control server"],["Host","fin-ws-114, finance department, Windows 11"],["Owner","m.okafor, accounts payable"],["Severity","critical, one of four today"]]}],"question":"Work through the three steps of this alert. Each step locks when you check it.","steps":[{"question":"The alert says the workstation contacted a known command-and-control server. What is your first action?","options":["Open the alert, check the asset owner and the process behind the connection","Isolate the workstation straight away","Close it, because command-and-control alerts are usually proxy noise"],"answer":0,"explain":"Your first action is to look before you touch. The alert tells you a connection happened, not which process made it or whether the destination is really malicious. Reading the process, the user and the destination takes two minutes and decides everything that follows. Isolating first would cut off a finance workstation during payment runs and destroy the live process tree that proves what happened. Closing it because these alerts are usually noise is the habit that alert fatigue creates, and it is how real intrusions get missed."},{"scenarioSummary":"Step 2 — the process behind the connection","scenario":[{"label":"Artefact 2 — EDR process detail, 14:31","kind":"log","lines":[{"t":"14:31:02","s":"edr","m":"process finance-app.exe (signed, publisher Meridian Software) opened TLS to cdn[.]meridian-analytics[.]example"},{"t":"14:31:02","s":"edr","m":"certificate chain valid, issued to Meridian Software Ltd"},{"t":"14:31:05","s":"proxy","m":"destination categorised as command-and-control by an old feed entry from 2019"},{"t":"14:31:09","s":"edr","m":"same domain contacted by 46 other workstations in the last 24 hours"}]}],"question":"The signed finance application contacted the domain, and 46 other workstations did the same. What do you do next?","options":["Suppress this rule for this host with a comment and an end date","Delete the correlation rule because the feed is old","Isolate the workstation and open a major incident"],"answer":0,"explain":"This is a false positive with a real cause: an old feed entry labels a legitimate analytics domain as malicious. The narrow fix is an exception on this rule for this host, written with a comment that names the evidence and an end date, so the exception is reviewed instead of forgotten. Deleting the rule would remove the detection for every host, including the one that is really compromised next week. Isolating a finance workstation and declaring a major incident on this evidence would be expensive and wrong. Notice that the exception is recorded, not hidden: the next analyst must be able to see why this host is quiet."},{"scenarioSummary":"Step 3 — two weeks later, same host","scenario":[{"label":"Artefact 3 — Alert queue, 09:41, fourteen days later","kind":"log","lines":[{"t":"09:41:12","s":"siem","m":"COR-204 fired for fin-ws-114"},{"t":"09:41:12","s":"edr","m":"process powershell.exe (unsigned, parent winword.exe) opened TLS to cdn[.]meridian-analytics[.]example"},{"t":"09:41:13","s":"siem","m":"host fin-ws-114 suppressed for COR-204 until 30 June"}]}],"question":"The same alert fires on the same host, but this time from PowerShell started by Word. What now?","options":["Reopen the case, hunt the process, and check the scope of the exception","Close it, because the exception covers this host until 30 June","Report the analyst who wrote the exception"],"answer":0,"explain":"An exception on a host silences the alert, not the threat. PowerShell started by Word is a classic document attack, and it is not the signed application that justified the exception. The right move is to reopen the case, escalate it, and hunt the same process on other hosts that share the exception. Then the exception must be narrowed so that it matches the process and the certificate, not the whole host. Closing it because a line in the tool says 'suppressed' is exactly the failure mode that exceptions create, and blaming the analyst misses the point: the process allowed a host-wide exception where a process-level one was needed.","note":"This step shows why a suppression must be as narrow as the evidence that justified it."}],"hint":"At every step ask what the tool actually proves, and whether the exception is as narrow as the evidence.","explain":"This chain is the daily work of a Tier 1 analyst. Step 1 shows that looking before touching is the cheapest action available. Step 2 shows a contained false positive: the fix is a narrow, dated exception with a comment, not a deletion. Step 3 shows the cost of a lazy exception, and the recovery path: reopen, hunt, narrow the exception. The wider lesson is that a suppression is a promise to review, and every exception needs an owner, a reason and an end date.","study":"Check before you contain, scope every exception to the evidence, and never let a host-wide suppression cover a different process.","keys":["Tier 1, 2 and 3 triage","Escalation path","Suppression and exception","SIEM correlation rule","False positive rate","Case management"]},{"id":"med-11","type":"order","theme":"Prioritising improvements","summary":"Five improvement ideas, one quarter — rank them by alerts removed per day of effort","scenario":[{"label":"Artefact 1 — Improvement backlog, Q2 planning","kind":"kv","rows":[["Idea 1","Exclude the backup account from COR-118: removes 143 alerts per day, 1 day of effort"],["Idea 2","Auto-close alerts from allow-listed senders: removes 210 alerts per day, 3 days of effort"],["Idea 3","Move the phishing playbook into the SOAR platform: removes 120 alerts per day, 10 days of effort"],["Idea 4","Add the asset owner and the criticality to every alert: removes no alerts, saves 6 hours a week, 5 days of effort"],["Idea 5","Replace three overlapping scanners with one: removes no alerts, saves 2 hours a week, 40 days of effort"]]},{"label":"Artefact 2 — How the team compares ideas","kind":"text","text":"Rank the ideas by alerts removed per day of effort, from best to worst. Ideas that remove no alerts go last, in the order of the time they save."}],"question":"Rank the five ideas from the one to do first to the one to do last, using alerts removed per day of effort.","items":["Exclude the backup account from COR-118: 143 alerts per day for 1 day of effort","Auto-close alerts from allow-listed senders: 210 alerts per day for 3 days of effort","Move the phishing playbook into the SOAR platform: 120 alerts per day for 10 days of effort","Add the asset owner and the criticality to every alert: 6 hours a week for 5 days of effort","Replace three overlapping scanners with one: 2 hours a week for 40 days of effort"],"hint":"Divide the alerts removed by the days of effort. The biggest queue is not always the best value.","explain":"The ratio decides the order. Idea 1 removes 143 alerts for one day of work, about 143 per day of effort, so it is first. Idea 2 removes 210 for three days, about 70 per day of effort, so it is second even though it removes more alerts in total. Idea 3 removes 120 for ten days, about 12 per day of effort. Ideas 4 and 5 remove no alerts at all, so they are ranked by the time they save: idea 4 saves six hours a week for five days, idea 5 saves two hours a week for forty days, which is by far the worst value this quarter. This is exactly why a backlog needs a size estimate as well as a benefit: a good idea with a bad ratio should wait, and a cheap idea with a small total benefit can still be the best next move.","study":"Divide the benefit by the effort. Rank the backlog by value per day of work, not by the size of the benefit.","keys":["Workload balancing","Alert fatigue","Cost-benefit analysis","Risk-based prioritization","Return on investment (ROI)","Suppression and exception"]},{"id":"med-12","type":"mcq","theme":"Reading the dashboard","summary":"The queue is 25 percent smaller — but is the team really faster?","scenario":[{"label":"Artefact 1 — Weekly operations numbers, week 10 against week 14","kind":"kv","rows":[["Alerts received","12,000 in week 10, 9,200 in week 14"],["Alerts opened by an analyst","11,600 in week 10, 8,100 in week 14"],["Alerts still open at 18:00","40 in week 10, 310 in week 14"],["Mean time to respond","4 hours 10 minutes in week 10, 3 hours 05 in week 14"]]},{"label":"Artefact 2 — Manager's summary at the morning meeting","kind":"text","text":"Fewer alerts and a faster response. Whatever the team changed in week 11 is working, so we can raise the target for next quarter."}],"question":"Which reading of the same numbers is the honest one?","options":["The queue looks smaller mainly because more alerts are left unopened","The team is genuinely faster, so a higher target is justified","Alert volume fell, so one log source must have gone silent","The response time improved, so the automation is working as designed"],"answer":0,"hint":"Compare the fall in alerts received with the fall in alerts opened. One of the two fell by more.","explain":"In week 10 the team opened 11,600 of 12,000 alerts. In week 14 it opened 8,100 of 9,200. Alerts received fell by 2,800, but alerts opened fell by 3,500, so the gap between the two grew by about 700 alerts that were never touched. The number of alerts still open at the end of the day rose from 40 to 310, which confirms it. The queue only looks better because work moved out of sight. The drop in mean time to respond is real for the alerts that were handled, but it is measured on a smaller and easier set, so it cannot be compared with week 10. The right next step is to find out what changed in week 11, check whether a log source or a rule was switched off, and report both numbers together.","study":"Never read one number alone. Compare alerts received, alerts worked and alerts left open before you claim an improvement.","keys":["KPI and KRI","Dashboard and reporting","Mean time to respond (MTTR)","Telemetry health and data source","Executive and board reporting","Detection coverage"]},{"id":"med-13","type":"sort","theme":"Indicator types","summary":"Eight measurements — is each one a performance indicator, a risk indicator or a promise?","scenario":[{"label":"Artefact 1 — Measurement framework, agreed with the CISO","kind":"text","text":"The team is cleaning up its measurement list. A performance indicator shows how well the process runs today. A risk indicator shows how much exposure is building up. A promise is an agreed target with a customer of the service."}],"question":"Place each measurement in the correct group.","bins":["Performance indicator","Risk indicator","Agreed promise"],"items":[{"t":"Share of critical alerts acknowledged within fifteen minutes","bin":0},{"t":"Median time to close a phishing case","bin":0},{"t":"Share of alerts that automation closed as false positive","bin":0},{"t":"Endpoints whose agent has not reported for seven days","bin":1},{"t":"Privileged accounts without multi-factor authentication","bin":1},{"t":"Unsupported operating systems still in production","bin":1},{"t":"Contain a confirmed critical incident within four hours","bin":2},{"t":"Answer a customer report of a possible breach within one working day","bin":2}],"hint":"Ask who the number is for: the team's own process, the risk register, or the customer who was promised something.","explain":"Performance indicators describe how the process behaves: how fast alerts are picked up, how long cases take, how much of the queue automation absorbs. They are for the team to manage itself. Risk indicators describe exposure that is building up: silent agents, unprotected privileged accounts, unsupported systems. They belong on the risk register with an owner, and they usually predict next quarter's incidents. Agreed promises are the targets written down for the rest of the business: containment inside four hours, an answer to a customer inside one day. The difference matters because the three groups are used differently. You fix a performance indicator with process work, you fix a risk indicator with a project, and you renegotiate a promise with the business before you break it.","study":"Separate what measures the process, what measures the exposure, and what was promised to the business.","keys":["KPI and KRI","SLA and SLO","Dashboard and reporting","Risk-based prioritization","Detection coverage"]},{"id":"med-14","type":"match","theme":"Platform roles","summary":"Eight components of the security stack — match each one to the job it does","scenario":[{"label":"Artefact 1 — Architecture one-pager for new analysts","kind":"text","text":"The team has eight components. A new joiner keeps asking which one does what, so the architecture page now carries one line per component."}],"question":"Pair each component with the job it does.","pairs":[["SIEM","collects the logs and fires the correlation rules"],["SOAR platform","runs the playbooks and calls the other tools through their APIs"],["Threat intelligence platform","stores, scores and ages the indicators and the reports"],["EDR console","shows the process tree and can isolate a single endpoint"],["Breach and attack simulation tool","safely replays attack steps to test whether the detections fire"],["Ticketing system","holds the case, its history and the handover notes"],["Orchestration","makes several tools run together in the order the playbook sets"],["Machine learning in detection","scores the alerts by learned patterns so the odd one comes first"]],"hint":"One component collects, one decides, one acts, one remembers, and one tests the others.","explain":"Each layer has a different job. The SIEM collects and correlates, and that is where the rule COR-118 lives. The threat intelligence platform holds the indicators and, importantly, ages them: the stale feed entry in the earlier exercise came from a platform that never expires anything. The SOAR platform is not a detector at all: it runs the steps, calls the APIs, and records what it did. Orchestration is the discipline of chaining those calls in a fixed order, which is different from automation, which is one task doing itself. The EDR console is where the process tree lives. The breach and attack simulation tool tests the whole chain by safely replaying an attack. Machine learning is an assistant, not a replacement: it ranks the queue so the analyst reaches the unusual alert sooner, and it still needs the correlation rules for the things that must never be missed.","study":"Learn which layer collects, which decides, which acts, which stores and which tests.","keys":["SOAR platform","API integration","Threat intelligence platform (TIP)","IoC feed","Case management","Breach and attack simulation (BAS)","Automation versus orchestration","Machine learning in detection","Single pane of glass"]},{"id":"med-15","type":"fill","theme":"Post-incident review","summary":"Complete the review note for an incident that took nine hours to notice","scenario":[{"label":"Artefact 1 — Review note, incident INC-4390, mail server compromise","kind":"text","text":"The review meeting is on Friday. The note below is nearly finished; four terms are missing. The rule for the meeting is that no person is named as the cause."}],"question":"Fill each blank in the review note with the right term.","parts":["The alert fired at 02:14, but the first human looked at it at 07:40, so the {{}} for this incident was five and a half hours.","The attacker had been on the mail server since 22:50 the night before, so the {{}} was nearly nine hours.","The cause was not the analyst but the process: every alert went to one shared mailbox. The team wrote the fix into the {{}} and raised a {{}} to change the alert routing."],"answers":["MTTA","dwell time","runbook","change request"],"bank":["MTTA","dwell time","runbook","change request","playbook","MTTR","waiver","ticket"],"hint":"One gap is about picking up the alert, one is about the attacker being inside, and one is the human procedure that changes.","explain":"MTTA is the time between the alert and a person opening it, five and a half hours here. Dwell time is the time the attacker spent inside the network before being found, nearly nine hours. They are different numbers with different fixes: MTTA is fixed by routing, on-call cover and the queue, dwell time is fixed by detection coverage. The runbook is the human procedure that describes how the work is done, and it is the right place to write the new routing rule, because a person follows the runbook when the automation is broken. A change request then carries that modification into production with a review. A playbook would be the automated version of the same steps, and a waiver would be a written acceptance of the risk, which is not what the team wants here.","study":"MTTA is when a person picks it up, dwell time is how long the attacker was inside, and the runbook is the human procedure.","keys":["Mean time to acknowledge (MTTA)","Dwell time","Post-incident review","Runbook","Change management and CAB","Root cause analysis (RCA)","Lessons learned"]},{"id":"med-16","type":"multi","theme":"Alert fatigue","summary":"Five months of tired analysts — which signs show real fatigue","scenario":[{"label":"Artefact 1 — Team review, quarter 1","kind":"text","text":"The SOC manager is worried about the team and wants evidence, not impressions. Select every sign that shows alert fatigue is already damaging the team."}],"question":"Which signs show that alert fatigue is damaging this team? Select every correct one.","options":["Analysts close alerts in under twenty seconds with no comment","The same three people cover every night shift for a month","Tier 1 asks for more context on every alert before closing it","The knowledge base is updated after each incident","Sick leave rises and two analysts resign in one quarter","The team asks for a new detection rule for a technique it saw"],"answer":[0,1,4],"hint":"Three options describe a healthy team doing the right thing. Only three describe damage.","explain":"Twenty-second closures with no comment mean the analyst has stopped reading: the queue is being cleared, not worked. One group covering every night shift for a month is a rota that guarantees mistakes and resignations, whatever the individual effort. Rising sick leave with two resignations is the end of the story, and it costs far more than the alerts the team failed to catch. The other three options are signs of a healthy team: asking for context means the analyst cares about the answer, updating the knowledge base after an incident is the improvement loop working, and asking for a new detection rule means someone is still curious. This is why a manager must not fix fatigue by telling people to work faster: the cure is fewer useless alerts, a fair rota and work that feels worth doing.","study":"Fatigue shows in how alerts are closed, how the rota is built, and whether people stay. Curiosity is not a symptom.","keys":["Alert fatigue","Analyst burnout","Tier 1, 2 and 3 triage","Workload balancing","Shift handover","Knowledge transfer and cross-training"]},{"id":"med-17","type":"logq","theme":"Overnight authentication","summary":"Eleven failed sign-ins and one success at 03:11 — decide what this really is","scenario":[{"label":"Artefact 1 — VPN gateway log, user r.novak, 02:41 to 03:12","kind":"log","lines":[{"t":"02:41:07","s":"vpn","m":"authentication failure for r.novak from 203[.]0[.]113[.]9, reason: wrong password"},{"t":"02:41:39","s":"vpn","m":"authentication failure for r.novak from 203[.]0[.]113[.]9, reason: wrong password"},{"t":"02:43:02","s":"vpn","m":"authentication failure for r.novak from 203[.]0[.]113[.]9, reason: wrong password"},{"t":"02:51:18","s":"vpn","m":"authentication failure for r.novak from 203[.]0[.]113[.]9, reason: wrong password"},{"t":"02:58:44","s":"vpn","m":"multi-factor push sent to r.novak, result: denied by user"},{"t":"02:59:12","s":"vpn","m":"multi-factor push sent to r.novak, result: denied by user"},{"t":"03:09:55","s":"vpn","m":"multi-factor push sent to r.novak, result: denied by user"},{"t":"03:11:20","s":"vpn","m":"multi-factor push sent to r.novak, result: approved"},{"t":"03:11:26","s":"vpn","m":"authentication success for r.novak from 203[.]0[.]113[.]9, session vpn-88213"}]},{"label":"Artefact 2 — Directory information","kind":"kv","rows":[["User","r.novak, finance controller, based in Prague"],["Normal sign-in","weekdays between 07:00 and 19:00, from the corporate range"],["Reported","The user has not reported anything to the service desk"]]}],"question":"What is happening here, and what is the right next step?","options":["Possible multi-factor fatigue: revoke the session and reset the password","A broken VPN client: send the user the setup guide one more time","A failed brute-force attempt: nothing succeeded, so close the ticket","A noisy log source: take the VPN gateway out of the SIEM feed"],"answer":0,"hint":"Count the pushes the user denied, then look at which one was approved at 03:11.","explain":"Three pushes were denied and the fourth was approved, at 03:11, from an address that is not the corporate range, for a user who normally works office hours. That is the classic multi-factor fatigue pattern: the attacker has the password and hopes the user presses Approve to stop the noise. Nothing here says the VPN client is broken, and this is not a failed attempt, because a session was created. The next steps are urgent and specific: revoke that session, reset the password, check what the session did, and call the user on a known number rather than replying to a message. The log source is doing its job perfectly.","study":"Denied pushes followed by one approval at an odd hour is multi-factor fatigue. Revoke, reset, then talk to the user.","keys":["Tier 1, 2 and 3 triage","Escalation path","Case management","Ticket lifecycle","Telemetry health and data source","False negative"]},{"id":"med-18","type":"mcq","theme":"Reporting upward","summary":"The CISO needs one board page — choose the panel that belongs on it","scenario":[{"label":"Artefact 1 — Request from the CISO, Monday 09:05","kind":"text","text":"The board gives me ten minutes next month. They are not technical. They want to know whether the money we spend on security is making the organisation safer, and what could still hurt us. Send me one page. The data team has offered four panels."}],"question":"Which panel belongs on the board page?","options":["Risk trend, response time by severity and the top control gaps","Raw log volume per hour for each of the forty-two log sources","The full alert queue with every analyst comment from the last month","A live list of every indicator the threat feed published today"],"answer":0,"hint":"Ask what a board member can decide with the panel. If the answer is nothing, it does not belong.","explain":"A board decides about money, risk and priorities, so the page must show the trend of risk and the state of the controls, with a small number of numbers that can be compared month to month. Open critical incidents, response time by severity and control gaps answer the questions the board actually asks: are we getting better, and where are we still exposed. Raw log volume, the full alert queue and the live indicator list are operational material. They are important to the team, but a board member cannot take a decision from them, and a page full of them hides the two numbers that matter. The rule for upward reporting is simple: fewer numbers, each one compared with last month, each one linked to a decision.","study":"Report risk trend and control state upward, not operational volume. Every number on the page should support a decision.","keys":["Executive and board reporting","Dashboard and reporting","KPI and KRI","Risk-based prioritization","Mean time to respond (MTTR)"]},{"id":"med-19","type":"branch","theme":"Shift handover","summary":"A single open alert crosses four handovers — trace where the process, not the person, fails","scenario":[{"label":"Artefact 1 — Your situation, 17:55","kind":"text","text":"You are the day analyst. Your shift ends in five minutes. One alert is open: a workstation with a suspicious scheduled task, half investigated. The night analyst starts at 19:00."}],"question":"Work through the three steps of this handover. Each step locks when you check it.","steps":[{"question":"It is 17:55 and one alert is open with no owner. What do you write in the handover note?","options":["The host, the alert id, what you checked, what you found, and your next recommendation","One line: there is an alert open for the night shift","Nothing: the queue shows the alert is still open"],"answer":0,"explain":"A handover note is a work product, not a notification. It must let the next analyst continue without repeating your work: which host, which alert, which checks you already ran, what you found so far, and what you recommend next. A one-line note forces the night analyst to start again from zero, which is the most expensive form of duplicated work in a SOC. Writing nothing assumes the queue explains itself, but a queue shows a status, not the reasoning behind it."},{"scenarioSummary":"Step 2 — 19:30, the night analyst reads the note","scenario":[{"label":"Artefact 2 — Chat message from the night analyst","kind":"text","text":"I can see the host in the ticket but I cannot tell what you already checked or what the scheduled task actually does. I am starting from the beginning. The alert is going to sit here until I get through the queue at about 23:00."}],"question":"What is missing from the process, not from the person?","options":["The exact command and its output were not saved with the case","The handover note was too short to read quickly","The alert should have been closed before the shift ended"],"answer":0,"explain":"The night analyst cannot reproduce the check because the command and its output are not attached to the case. A result without its evidence cannot be trusted or continued, so the work is repeated. The length of the note is not the problem, and closing the alert to clear the queue would be worse than leaving it open. The process fix is a ticket template that has a required field for the check performed and the raw output behind it. That single field turns a handover into a continuation."},{"scenarioSummary":"Step 3 — the same alert, four handovers later","scenario":[{"label":"Artefact 3 — Ticket history","kind":"log","lines":[{"t":"Mon 17:55","s":"handover","m":"alert open, no owner, note: see queue"},{"t":"Tue 07:20","s":"handover","m":"night analyst started from the beginning, ran out of time"},{"t":"Tue 18:02","s":"handover","m":"alert open, note: still investigating"},{"t":"Wed 18:10","s":"handover","m":"alert open, note: who owns this?"},{"t":"Thu 09:00","s":"tabletop","m":"the team rehearsed this exact handover gap last month and wrote action 4: give every alert a named owner at creation"}]}],"question":"The same alert has now crossed four handovers. What should the team lead change?","options":["Give every alert a named owner at creation and apply action 4","Ask the analysts to work faster during the night shift","Close any alert that survives more than one handover"],"answer":0,"explain":"The alert had no owner, so it belonged to nobody and every shift could leave it. The team already knew this: the tabletop exercise last month produced action 4, which was never applied. That gap between a written lesson and a changed process is the real failure, and it is why the improvement loop needs owners and dates. Working faster or closing old alerts would hide the symptom and keep the cause. The fix is an owner field that is mandatory at creation, plus a review of the actions from the exercise to see which ones are still open.","note":"A lesson that is written down and never applied is not a lesson."}],"hint":"In each step ask whether the next person could continue your work without repeating it.","explain":"Handover is a process, and every step here fails for a process reason: a note that carries no evidence, a ticket template with no field for the check performed, and an action from a tabletop exercise with no owner. None of these failures is fixed by asking people to try harder. The pattern to remember is that work in progress must be transferable: an owner, a written state, and the raw evidence attached.","study":"A handover must let the next analyst continue without repeating the work: owner, state and raw evidence.","keys":["Shift handover","Ticket lifecycle","Escalation path","Knowledge base article","Standard operating procedure (SOP)","Process mapping","Tabletop exercise","Lessons learned"]},{"id":"med-20","type":"terminal","theme":"Audit evidence","summary":"Task 91 — the auditor asks where the enrichment script keeps its credentials","scenario":[{"label":"Artefact 1 — Audit request AUD-2026-14, task 91","kind":"kv","rows":[["Auditor","Internal audit, control area 8.2"],["Request","Show every line of the enrichment script that mentions a credential"],["Constraint","Do not modify the script; a hash of the file is recorded before and after your check"],["File","/opt/soar/enrich.sh"]]}],"question":"Type one command that lists every line of `/opt/soar/enrich.sh` that mentions a password, a token or a secret, with the line number shown.","prompt":"analyst@soc-ws-02:~$","env":"The file is on this workstation in the /opt/soar folder. Use a text-search command. You need the line numbers so the auditor can reference them.","syntax":{"shape":"grep -n <pattern> <file>","opts":[["-n","show the line number in front of every matching line"],["-i","ignore upper and lower case"],["-E","treat the pattern as a set of alternatives, separated by the pipe symbol"]],"example":"grep -n -i -E \"timeout|retry\" /opt/soar/enrich.sh"},"canonical":"grep -n -i -E \"password|token|secret\" /opt/soar/enrich.sh","judge":[{"label":"Reads the enrichment script","re":"enrich\\.sh","why":"the command does not read the file named in the audit request"},{"label":"Searches for the credential words","re":"(password|passwd|token|secret|api[_-]?key|credential)","why":"the command does not look for a credential word"},{"label":"Shows the line numbers","re":"(^|\\s)-[a-z]*n|--line-number","why":"the auditor cannot reference a line without its number"}],"forbid":[{"re":"\\bsed\\s+-i|\\btruncate\\b|>\\s*/opt/soar/enrich\\.sh"}],"termIntro":["Practice shell on soc-ws-02. Type the command, then press Run command.","The file is read-only for you, and nothing leaves this page."],"termOut":["3:# credential is read from the environment at run time","17:API_TOKEN=${SOAR_TOKEN}","42:if [ -z \"$API_TOKEN\" ]; then echo \"no token\"; exit 1; fi","soc-ws-02:/opt/soar$ "],"parts":[["grep","searches a text file for a pattern"],["-n","prints the line number with each match, which is what an auditor needs"],["-i","matches Password, password and PASSWORD"],["-E","allows several words to be searched at once with the pipe symbol"],["/opt/soar/enrich.sh","the file named in the audit task"]],"hint":"The auditor needs three things: the file, the credential words, and the line numbers. The command can do all three at once.","explain":"One command answers the whole audit task: search the named file, look for the credential words, and print the line numbers. The output shows that this script does the right thing: it reads the token from the environment and stops if the token is missing, so no secret is stored in the file itself. That is the difference between evidence and an opinion. Instead of telling the auditor that secrets are handled properly, you hand over the line numbers that prove it, and the auditor can check them in seconds. Notice the constraint as well: the command only reads. A command that edited the file would change the evidence you are trying to collect, and the hash recorded before your check would no longer match.","study":"Automated evidence collection means one repeatable command that produces the proof an auditor can check.","keys":["Scripting (Python, Bash, PowerShell)","Secrets management for automation","Evidence collection and audit readiness","Compliance automation","Continuous compliance monitoring"]},{"id":"med-21","type":"spot","theme":"Evidence that disappears","summary":"The quarterly access review cannot be proved for March — find the change that removes the risk","scenario":[{"label":"Artefact 1 — GRC process note, access review","kind":"text","text":"Every Friday the GRC analyst opens the access review spreadsheet, takes screenshots of the changed rows, saves the images in a personal folder, and emails a zip to the external auditor at the end of the quarter. Last quarter two screenshots were missing. March could not be proved, and the auditor raised a finding."}],"question":"Which change removes the real risk?","options":["Collect the records automatically into the dated evidence store","Take the screenshots twice a week and store them in two separate folders","Ask the auditor to accept the spreadsheet export without any screenshots","Move the analyst's personal folder onto the shared team drive"],"answer":0,"hint":"The problem is not how often the evidence is taken. It is that a person is the only thing holding it.","explain":"The finding is not about the auditor being difficult, and it is not about how often the screenshots are taken. The evidence lives in a personal folder, is created by hand, and can be missed without anyone noticing. The durable fix is to collect the review records automatically and write them straight into the evidence store with a timestamp, so the proof is complete whether or not somebody remembered on Friday. Taking the screenshots twice a week doubles the work and doubles the chances of a gap. Two folders and a shared drive do not help either: they move the same fragile manual step somewhere else. Continuous compliance means the evidence is a by-product of the process, not a task next to it.","study":"Evidence should come out of the process automatically. Manual screenshots are a task, and tasks get skipped.","keys":["Evidence collection and audit readiness","Compliance automation","Continuous compliance monitoring","Policy enforcement"]},{"id":"med-22","type":"sort","theme":"Who does what","summary":"Eight tasks from the queue — place each one in the tier that owns it","scenario":[{"label":"Artefact 1 — SOC operating model, v3","kind":"text","text":"Tier 1 triages: enrich, close clear false positives, follow the short playbooks, and hand over with evidence. Tier 2 investigates: timelines, containment, and talking to users. Tier 3 hunts and builds: new rules, tuning, and hunting beyond the original case."},{"label":"Artefact 2 — Extract from the maturity assessment, section 5","kind":"text","text":"The assessor wrote: triage is documented and repeatable, but hunting is not documented at all and the tuning work depends on one person. That gap between a strong process and a weak one is where the next improvement should go."}],"question":"Place each task in the tier that owns it.","bins":["Tier 1","Tier 2","Tier 3"],"items":[{"t":"Enrich the alert with the asset owner and close the clear false positives","bin":0},{"t":"Follow the phishing playbook and quarantine the reported message","bin":0},{"t":"Check the sender reputation and the URL verdict for a reported email","bin":0},{"t":"Rebuild the timeline from the EDR and the proxy logs for one host","bin":1},{"t":"Interview the user and contain the affected mailbox","bin":1},{"t":"Write a new correlation rule for the technique found in the case","bin":2},{"t":"Tune the rule that produced a hundred false alerts this week","bin":2},{"t":"Hunt for the same technique on hosts outside the original case","bin":2}],"hint":"Ask what the task produces: a clean queue, a finished case, or a better detection.","explain":"The tiers are separated by what each one produces, not by difficulty. Tier 1 produces a clean queue: enrichment, short playbooks and clear closes, all of which follow a written step list. Tier 2 produces a finished case: a timeline, a containment action, and a conversation with the person affected. Tier 3 produces better detection: new rules, tuning, and hunting that looks beyond the case that started it. The second artefact adds the improvement angle. The maturity assessment shows a documented triage process next to an undocumented hunting practice that depends on one person, so the next improvement should move knowledge out of one head and into the team. That is a gap analysis doing its job: it names the weak area and points the next effort at it, which is exactly what a maturity model is for.","study":"Tier 1 cleans the queue, Tier 2 finishes the case, Tier 3 improves the detection. A maturity model shows which tier is weak.","keys":["Tier 1, 2 and 3 triage","Escalation path","Rule tuning and threshold","Detection use case","Hypothesis-driven threat hunting","Knowledge transfer and cross-training","Maturity model (SOC-CMM)","Gap analysis"]},{"id":"med-23","type":"match","theme":"Frameworks and their demands","summary":"Five standards and rules — match each one to what it actually demands","scenario":[{"label":"Artefact 1 — Compliance register extract","kind":"text","text":"The team keeps one register of every framework that applies to it. New joiners confuse them constantly, because four of the five are usually shortened to a number and a letter."}],"question":"Pair each framework or obligation with what it demands.","pairs":[["ISO/IEC 27001","a managed, auditable system of information security controls"],["PCI DSS","rules for every system that stores, processes or transmits card data"],["SOC 2","an independent report on the controls a service provider operates"],["NIST Cybersecurity Framework","five functions that organise the whole security programme"],["Regulatory reporting","a fixed schedule and format that a regulator or a law requires"]],"hint":"One is a management system, one is a card rulebook, one is a report, one is a structure, one is a deadline.","explain":"ISO/IEC 27001 asks for a management system: a set of controls that are planned, operated, checked and improved, with an audit trail. PCI DSS is a rulebook with numbered requirements, and it only applies to card data, which is why a scoping decision comes before any control. SOC 2 is a report, not a standard you are certified against: an auditor examines the controls a service provider claims and reports on them. The NIST Cybersecurity Framework is an organising structure, five functions that help a programme describe itself, and it is voluntarily adopted. Regulatory reporting is an obligation with a deadline and a format, usually defined by law. The practical difference shows up in evidence: for ISO 27001 you show the management system working, for PCI DSS you show each requirement met, for SOC 2 you show the controls the customer was promised, and for a regulator you show you reported on time.","study":"Know what each framework actually demands: a system, a rulebook, a report, a structure, or a deadline.","keys":["ISO/IEC 27001","PCI DSS","SOC 2","NIST Cybersecurity Framework","Regulatory reporting","Continuous compliance monitoring"]},{"id":"med-24","type":"multi","theme":"A playbook you can trust","summary":"Which qualities make an automated playbook safe at three in the morning","scenario":[{"label":"Artefact 1 — Review of the first six playbooks","kind":"text","text":"The first six playbooks are live. Two of them have already caused a small outage. The team lead wants a standard before more are written. Select every quality that must be in the standard."}],"question":"Which qualities must a playbook have before it can run unattended? Select every correct one.","options":["Every step has an owner and a clear pass or fail result","The rollback step is written next to the action it undoes","It runs without keeping any log of what it changed","It was tested against a known sample before it went live","It assumes the analyst remembers what the last version did","It is written as one large step that does everything at once"],"answer":[0,1,3],"hint":"Three options would make an overnight failure impossible to diagnose.","explain":"A dependable playbook has three properties. Every step has an owner and a pass or fail result, so a failure stops in a known place instead of leaving the case half-done. The rollback step sits next to the action it undoes, so nobody has to invent an undo at 03:00 while a mailbox is blocked. It was tested against a known sample first, which is the only way to know what it does when the input is slightly different. The three rejected qualities are the classic mistakes: no log means no evidence and no learning, a memory of the last version is not documentation, and one giant step cannot be stopped, checked or reused. Small steps also make the playbook a candidate for the detection regression tests, because each step can be replayed on its own.","study":"Testable steps, a nearby rollback and a real test run. Those three make unattended automation safe.","keys":["Playbook","Runbook","Guardrails and rollback","Detection regression test","Standard operating procedure (SOP)"]},{"id":"med-25","type":"fill","theme":"Change control","summary":"Complete the change request that turns on ticket automation","scenario":[{"label":"Artefact 1 — Change request form, draft","kind":"text","text":"The team wants the phishing playbook to create its own tickets. Because this changes how the production queue is worked, the request needs four more terms before it can be submitted."}],"question":"Choose the missing terms for the change request form.","parts":["This change goes to the {{}} because it alters how the production queue is worked.","The request must attach the {{}} produced in the staging tenancy.","The form must name a {{}} plan, so the manual process can be restored within minutes.","The senior analyst on duty signs an {{}} for every account the playbook may disable."],"answers":["change advisory board","test evidence","rollback","approval record"],"bank":["change advisory board","test evidence","rollback","approval record","exception","waiver","service catalog","risk register"],"hint":"One blank names the group that approves, one names the proof, one names the undo, and one names the written decision.","explain":"The change advisory board is the group that reviews changes to production, and a change that alters how the queue is worked belongs in front of it. Test evidence is required because the board has to see what happened in the staging tenancy, not a promise that it was tested. A rollback plan is the price of touching production: the manual process must be restorable within minutes, and everybody must know who decides that. An approval record is the written decision of the person accountable for disabling an account, and it is what an auditor asks for months later. The distractors matter: an exception is a time-limited written permission to differ from a standard, and a waiver is a longer acceptance of a known risk. Neither is the same as an approval on a specific action, and mixing them up is how a temporary gap becomes permanent.","study":"Change control needs a board, real test evidence, a rollback plan and a written approval for each risky action.","keys":["Change management and CAB","Guardrails and rollback","Exception and waiver","Configuration baseline","Policy enforcement"]},{"id":"med-26","type":"order","theme":"Learning from a miss","summary":"An alert that nobody noticed for six hours — put the analysis steps in order","scenario":[{"label":"Artefact 1 — Incident INC-4402, closed","kind":"text","text":"A real intrusion was detected six hours late. The team has reviewed the case once already, in a bad mood, and learned nothing. The team lead wants a proper root cause analysis this time, in the right order."}],"question":"Put the six root cause analysis steps in the order they should be done.","items":["Keep the evidence: save the alert, the logs and the timestamps before anything is cleaned up","Draw the timeline from the first event to the moment a human finally acted","Ask why at each gap, and write the answers down without blaming a person","Choose one corrective action that changes the process rather than just the ticket","Give that action an owner and a date","After the date has passed, check that the action really removed the cause"],"hint":"Evidence first, then the timeline, then the why. The last step happens weeks later.","explain":"Root cause analysis starts with evidence, because logs rotate and memories fade within days. The timeline comes next: put every event and every human action on one line, and the gaps become visible. Only then ask why at each gap, and write the answers down without naming a person as the cause, because blame stops the flow of information immediately. Choose one corrective action that changes the process, since a list of ten actions closes none of them, and give it an owner and a date so it can be tracked. The final step is the one teams skip: after the date, check that the action actually removed the cause. Without that check, the same incident returns in a quarter and everyone is surprised. Steps six and the earlier definition of the problem are the Check and Act of the improvement loop, and they are what separate a real review from a meeting.","study":"Evidence, timeline, why, one action, owner and date, then verify the action worked. That is the full loop.","keys":["Root cause analysis (RCA)","Post-incident review","Lessons learned","Continuous improvement","PDCA (Plan-Do-Check-Act)"]},{"id":"med-27","type":"mcq","theme":"Business case","summary":"Two automation projects and a limited budget — which one pays back sooner?","scenario":[{"label":"Artefact 1 — Two proposals, same team","kind":"kv","rows":[["Project A","Licences 12,000 per year plus 5 days of build at 600 per day; removes 6 analyst hours per day at 45 per hour"],["Project B","Licences 3,000 per year plus no build time; removes 1 analyst hour per day at 45 per hour"],["Working month","22 working days"]]}],"question":"Which proposal should the team put forward first, and why?","options":["Project A: it pays back its first-year cost in about two and a half months","Project B: it costs less to build, so the payback must be sooner","Project B: fewer licences means less tool sprawl and less training","Neither: analyst hours are a fixed cost and cannot really be saved"],"answer":0,"hint":"Work out the monthly saving of each project, then divide the first-year cost by that saving.","explain":"Project A saves six hours a day at 45 per hour, which is 270 per day, or about 5,940 per month across 22 working days. Its first-year cost is 12,000 in licences plus 3,000 of build time, so 15,000. That is about two and a half months of saving to break even, and the rest of the year is profit. Project B saves one hour a day, about 990 per month, against 3,000 of licences, which takes about three months. So the smaller, cheaper project is not automatically the faster one: what matters is the saving divided by the cost. The idea that analyst hours cannot be saved is also wrong, and it is the excuse that keeps a team doing manual work forever. Hours saved are real when they are spent on hunting, tuning or the improvement backlog instead of copying host names.","study":"Compare projects by saving divided by cost. A cheap project with a tiny saving can be worse value than a large one.","keys":["Return on investment (ROI)","Cost-benefit analysis","Tool sprawl and consolidation","Automation candidate selection","Executive and board reporting"]},{"id":"med-28","type":"spot","theme":"Rule review","summary":"A rule produced nine thousand alerts on Monday — find the line that caused it","scenario":[{"label":"Artefact 1 — Rule file in the detection repository","kind":"code","lines":["title: Many failed logons","status: stable","detection:","  selection:","    EventID: 4625","  condition: selection","  timeframe: 1m","level: critical"]},{"label":"Artefact 2 — Queue impact, Monday","kind":"kv","rows":[["Alerts produced","9,140"],["Real incidents found","0"],["Analyst hours spent","about 30"],["Note from the reviewer","The rule was merged last Thursday. It passed the syntax check."]]}],"question":"Which line is the real mistake in this rule?","options":["`condition: selection` with no count, so a single failure fires","`level: critical` is set too low for a failed logon event","`EventID: 4625` is the wrong identifier for a failed logon","`status: stable` should be marked experimental at first"],"answer":0,"hint":"A rule that fires on one event will fire on every event of that type. Count how many failures happen in a normal minute.","explain":"The condition simply selects every failed logon event, with no threshold at all, so the rule fires on every single one. In a normal minute on a busy estate there are thousands of them, which is exactly why Monday produced 9,140 alerts and no incidents. The fix is a count over a window, for example more than ten failures for one account, and a separate branch for service accounts. The other lines are not the cause. EventID 4625 is the correct failed-logon event, the level is a label rather than a trigger, and the status field only records how mature the rule is considered to be. The deeper lesson is about the pipeline that merged this rule: a syntax check proves the file parses, not that the logic is safe. That is why a detection regression test over a replay of last week's events belongs in the deployment pipeline.","study":"A detection rule needs a threshold and a window. A syntax check is not a safety check.","keys":["Rule tuning and threshold","SIEM correlation rule","False positive rate","Alert fatigue","Detection as code","Detection regression test","CI/CD pipeline for detections"]},{"id":"med-29","type":"multi","theme":"Tool consolidation","summary":"Fourteen consoles for nine analysts — which benefits are real","scenario":[{"label":"Artefact 1 — Tool inventory, before consolidation","kind":"kv","rows":[["Tools in use","14 consoles, 9 analysts, 31 API keys, 4 overlapping network sensors"],["Time lost","Each analyst switches between 6 consoles on an average triage"],["Licences","Three products overlap on endpoint telemetry"]]}],"question":"Which benefits of consolidation are real? Select every correct one.","options":["One console for the analyst, so one host does not need four browser tabs","Fewer API keys and fewer service accounts to rotate and audit","One vendor outage can remove detection and response at the same time","The same telemetry is stored twice, which makes every search faster","Licence cost and training time fall as the number of tools falls","Every tool keeps its own host naming, which keeps the teams independent"],"answer":[0,1,4],"hint":"Two options describe consequences nobody wants. One describes something that was never true.","explain":"Consolidation helps in three concrete ways here. One console means the analyst stops rebuilding the same picture by hand in six windows, which is where the real minutes are lost. Fewer API keys means fewer secrets to rotate, fewer service accounts to review, and a smaller audit surface: thirty-one keys for nine analysts is a governance problem on its own. Fewer tools means less licence cost and less training, and training time is a cost that never appears on an invoice but always appears in a rota. The other three options are not benefits. A single vendor outage that removes both detection and response is a concentration risk that consolidation creates, so it must be planned for rather than celebrated. Storing telemetry twice does not make searches faster; it usually makes them slower, and it doubles the cost. Different host naming across tools is a defect: it is what stops an analyst from joining two logs together.","study":"Consolidation buys time, fewer secrets and lower cost. It also buys concentration risk, which must be planned for.","keys":["Tool sprawl and consolidation","Single pane of glass","Secrets management for automation","API integration","Cost-benefit analysis"]},{"id":"med-30","type":"branch","theme":"Testing the detections","summary":"Nine of ten hosts alerted — decide what the tenth one is telling you","scenario":[{"label":"Artefact 1 — Breach and attack simulation report, run 118","kind":"text","text":"The simulation ran a known credential-dumping technique against ten Windows hosts in the server zone. Nine hosts produced an alert. One did not. All ten hosts are built from the same image."}],"question":"Work through the three steps of this finding. Each step locks when you check it.","steps":[{"question":"Nine hosts alerted and one did not. What is your first move?","options":["Compare the telemetry of the silent host with a host that alerted","Re-run the test until all ten hosts produce an alert","Close the finding, because nine out of ten is acceptable"],"answer":0,"explain":"A silent host is information, not a failure to hide. The fastest way to find the reason is to compare the two hosts: same image, same zone, same test, different outcome, so the difference is in the telemetry, the agent state or the rule scope. Re-running the test does not create data that was never collected, and closing the finding at nine out of ten accepts a blind spot in a production zone. This comparison of what alerted against what should have alerted is a coverage gap analysis, and it is the whole point of running the simulation."},{"scenarioSummary":"Step 2 — why the host stayed silent","scenario":[{"label":"Artefact 2 — Agent report for db-07, the silent host","kind":"log","lines":[{"t":"run 118","s":"bas","m":"technique replayed on db-07, no alert produced"},{"t":"run 118","s":"agent","m":"agent service running, version 7.4.1, last policy applied 11 March"},{"t":"run 118","s":"agent","m":"sensor mode: audit only, set during the failed upgrade on 12 March"},{"t":"run 118","s":"edr","m":"9 of 10 hosts produced alert COR-311 from the same technique"}]}],"question":"The agent is installed and running, but the sensor is in audit-only mode. What now?","options":["Fix the agent configuration, then re-run the same test to prove the detection","Write a new detection rule for the technique in the EDR platform","Accept the risk and record an exception for the database zone"],"answer":0,"explain":"The rule is not broken. The sensor never sent the events, so no rule could fire: this is a telemetry problem, and writing a new rule would change nothing. The right path is to move the sensor out of audit-only mode, apply the current policy, and then re-run exactly the same test. The re-run is the proof: without it, the team has a fix and no evidence that the blind spot is closed. An exception for the whole database zone would accept the gap permanently, which is a large risk for a small configuration change."},{"scenarioSummary":"Step 3 — stopping the same blind spot next month","scenario":[{"label":"Artefact 3 — Two more hosts found in the same state","kind":"text","text":"After the fix, the team searches for the same condition and finds two more hosts in audit-only mode, both set during the same failed upgrade. Nobody had reported the failed upgrade, and no dashboard showed it."}],"question":"Which change stops this class of blind spot from returning?","options":["Show agent health on the daily dashboard and alert when a sensor stops reporting","Run the simulation once a year instead of every month","Ask the vendor to test the agent configuration for the team"],"answer":0,"explain":"Two more hosts in the same state means the failure was silent for weeks, and the reason is that nobody was watching agent health. A daily health view with an alert when a sensor goes quiet catches this class of problem on the day it happens, instead of at the next simulation. Running the test once a year would only delay the discovery, and asking the vendor moves the responsibility away from the team that owns the estate. The general rule is that detection coverage depends on telemetry, and telemetry has to be monitored like any other control.","note":"The simulation did not find a missing rule. It found a missing monitor."}],"hint":"Ask what the tool proves at each step: a missing rule, missing data, or a missing monitor.","explain":"This is the loop that keeps detection coverage honest. A simulation creates a known event; the team compares what alerted with what should have alerted; the difference is either a rule problem or a data problem; the fix is proven by repeating the same test. The final step turns a single finding into a permanent control, which is the difference between fixing an incident and improving a process.","study":"Silence in a test means either a missing rule or missing telemetry. Find out which, fix it, then replay the same test.","keys":["Breach and attack simulation (BAS)","Purple teaming","Telemetry health and data source","Detection coverage","MITRE ATT&CK coverage mapping","Dashboard and reporting","Gap analysis","False negative"]},{"id":"med-31","type":"branch","theme":"Two sides of one rule","summary":"One rule looked at from the blue side, then from the attacker's side","scenario":[{"label":"Artefact 1 — Rule COR-508 in the detection repository","kind":"kv","rows":[["Name","Office document spawns a shell that downloads a file"],[
