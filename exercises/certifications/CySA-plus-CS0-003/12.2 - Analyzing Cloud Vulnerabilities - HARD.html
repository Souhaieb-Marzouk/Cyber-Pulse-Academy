window.__EXAM_DATA__ = {"meta":{"topicId":"cysa-plus","chapter":12.2,"title":"12.2 - Analyzing Cloud Vulnerabilities - HARD","cert":"CompTIA CySA+ (CS0-003)","difficulty":"hard","passMark":70},"timerSeconds":2100,"themes":[{"id":"tools","name":"Cloud assessment tools","short":"Tools"},{"id":"containers","name":"Containers, IaC & serverless scanning","short":"IaC/Containers"},{"id":"misconfig","name":"Cloud misconfigurations","short":"Misconfig"},{"id":"shared","name":"Shared responsibility model","short":"Shared resp."},{"id":"output","name":"Scan output & CVSS","short":"Output/CVSS"},{"id":"cspm","name":"Posture management & compliance","short":"Posture"},{"id":"report","name":"Reporting & remediation","short":"Reporting"}],"keywords":[{"theme":"Cloud assessment tools","items":["ScoutSuite","Prowler","Pacu","CloudSploit","Nessus / Tenable","Qualys Cloud Platform","Prisma Cloud","Wiz","Orca Security","Amazon Inspector","AWS Security Hub","AWS Config","Microsoft Defender for Cloud","Azure Policy","GCP Security Command Center","OpenSCAP / SCAP","CIS Benchmarks / CIS-CAT"]},{"theme":"Containers, IaC & serverless scanning","items":["Trivy","Clair","Kube-bench","Kube-hunter","Checkov","tfsec","IaC scanning (Terraform / CloudFormation)","Image / registry scanning","SBOM & dependency scanning"]},{"theme":"Cloud misconfigurations","items":["Public object storage exposure","Open security groups","Overly permissive IAM","Unencrypted storage at rest","Disabled audit logging","Missing MFA / root account risk","IMDSv1 / metadata SSRF","Public snapshots / AMIs","Exposed management ports","Permissive CORS","Default credentials","Kubernetes RBAC & pod security"]},{"theme":"Shared responsibility model","items":["Security OF the cloud vs IN the cloud","IaaS / PaaS / SaaS split","Customer responsibilities","Provider responsibilities"]},{"theme":"Scan output & CVSS","items":["CVSS v3.1 base score","CVSS vector string","Severity bands","CVE","CWE","False positive","False negative","Credentialed vs non-credentialed scans","Agent-based vs agentless scanning","Scan scope & completeness"]},{"theme":"Posture management & compliance","items":["CSPM","CWPP","CIEM","CASB","Continuous monitoring & drift","Guardrails","Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)"]},{"theme":"Reporting & remediation","items":["Findings report structure","Remediation vs mitigation","Risk-based prioritization (KEV / EPSS)","SLA & ticket tracking","Rescan validation","Exception & compensating control","Asset criticality","Ownership assignment","Trend analysis","Risk acceptance"]}],"exercises":[{"id":"h01","type":"multi","th":"misconfig","ti":"CloudTrail deep dive: stolen key or CI noise?","pts":3,"sc":"Helios FinTech normally: runs terraform and CRM sync from the 10[.]0[.]9[.]x and 10[.]0[.]22[.]x ranges with their usual user agents, and has no presence in ap-south-1. Nothing else is pre-approved.","q":"Select every observation that an experienced analyst would escalate right now. Watch for the near-miss that only looks normal.","d":{"opts":[{"h":"ListBuckets from the CI identity but with curl as user agent and an outside IP","ok":true},{"h":"Root creating an access key named temp-reporter out of hours","ok":true},{"h":"RunInstances by that brand-new identity in an unused region","ok":true},{"h":"GuardDuty Discovery finding tied to the same outside IP and identity","ok":true},{"h":"GetObject by crm-sync-role: source, agent and object all match its 214-night baseline"},{"h":"PutBucketPolicy by secops-automation on the audit bucket"},{"h":"AssumeRole with MFA from the CI subnet"},{"h":"DescribeInstances by terraform-ci from its usual range"}]},"ex":"<b>Why:<\/b> Escalate the chain: a CI identity speaking curl from an outside IP (credential reuse by an attacker), root minting a key out of hours (persistence), instances in a region you never use (staging ground), and GuardDuty confirming discovery. The CRM GetObject is the near-miss: it looks scary but source, user agent, object and cadence all match a 214-night baseline - escalating it wastes the hour. Named automation doing scheduled IaC, MFA'd AssumeRole and baseline terraform are normal. <b>Focus on:<\/b> identity + source + behavior must all match the baseline before you call an event normal.","k":["CloudTrail","Missing MFA / root account risk"],"hint":"One event is a baseline match disguised as a finding. Judge all three signals.","art":[{"kind":"log","title":"CloudTrail + GuardDuty - Helios FinTech production account (defanged)","lines":["2026-10-12T02:14:09Z  ListBuckets  userIdentity=deploy-ci  sourceIP=198[.]51[.]100[.]24  userAgent=curl/7.68.0","2026-10-12T02:14:44Z  CreateAccessKey  userIdentity=root  userName=temp-reporter  accessKey=AKIA...QK7","2026-10-12T02:20:11Z  RunInstances  userIdentity=temp-reporter  region=ap-south-1  image=ami-0f9d (ubuntu 22.04)","2026-10-12T02:31:57Z  GetObject  principal=crm-sync-role  sourceIP=10[.]0[.]22[.]5  userAgent=crm-sync/2.1  object=crm/nightly-sync.csv  (matches 214 previous nights)","2026-10-12T02:47:03Z  PutBucketPolicy  userIdentity=secops-automation  bucket=helios-audit-logs  (scheduled IaC drift fix)","2026-10-12T03:02:36Z  GuardDuty  Discovery:IAMUser-ResourceListing  principal=temp-reporter  sourceIP=198[.]51[.]100[.]24","2026-10-12T03:05:12Z  AssumeRole  principal=jdoe  target=prod-readonly  MFAUsed=true  sourceIP=10[.]0[.]9[.]30","2026-10-12T03:19:48Z  DescribeInstances  userIdentity=terraform-ci  sourceIP=10[.]0[.]9[.]30  userAgent=HashiCorp-TF/1.6"]}]},{"id":"h02","type":"branch","th":"misconfig","ti":"Branching scenario: SSRF to IMDSv1 on the payments app","pts":4,"sc":"Helios FinTech's payments app exposes a 'fetch URL preview' feature. The WAF log shows a POST to /preview?url=hxxp://169[.]254[.]169[.]254/latest/meta-data/iam/security-credentials/ returned HTTP 200 with 1.4 KB. Instance metadata options show HttpTokens=optional (IMDSv1 allowed).","q":"Respond step by step. A wrong call ends the branch.","d":{"stages":[{"ctx":"The WAF allowed a metadata request through and the app answered it.","q":"What do you establish first?","opts":[{"h":"Confirm SSRF (CWE-918): which role the instance carries and whether metadata returned real credentials","ok":true,"why":"You need to know what exactly became reachable before containing."},{"h":"Reboot the instance to clear the sessions","ok":false,"why":"Rebooting destroys forensic state and changes nothing about the flaw."},{"h":"Block the reporter's IP at the WAF and go to lunch","ok":false,"why":"The attacker pivots; the hole stays."}]},{"ctx":"Instance role: payments-prod-role with S3 read on cardholder-bucket. IMDSv1 confirmed.","q":"Contain - what now?","opts":[{"h":"Enforce IMDSv2 (HttpTokens=required, hop limit 1) and block metadata egress from the app subnet","ok":true,"why":"IMDSv2 requires session tokens via PUT, which SSRF GETs cannot satisfy - the standard fix."},{"h":"Delete payments-prod-role","ok":false,"why":"Production depends on it; you would cause an outage, not a containment."},{"h":"Turn off WAF logging to reduce noise","ok":false,"why":"You would blind yourself during an active incident."}]},{"ctx":"CloudTrail shows payments-prod-role credentials used from 209[.]58[.]14[.]2 - not the app's NAT - listing cardholder-bucket.","q":"Credentials are out. What next?","opts":[{"h":"Revoke the role's sessions, rotate long-term secrets it used, and quarantine the instance","ok":true,"why":"Killing the credential window and isolating the host stops continued access."},{"h":"Wait for the next scan cycle to confirm scope","ok":false,"why":"The attacker is live; waiting hands them the data."},{"h":"Only delete the WAF rule that allowed the request","ok":false,"why":"The credentials already work elsewhere; the rule is not the live risk."}]},{"ctx":"Credentials are dead. Leadership asks how far the access reached.","q":"Scope the intrusion - how?","opts":[{"h":"Hunt CloudTrail for the role's API history, S3 data-event logs for reads, and GuardDuty credential-anomaly findings","ok":true,"why":"These three sources answer who-did-what with the stolen identity."},{"h":"Check the instance's CPU graph","ok":false,"why":"Resource graphs do not answer identity questions."},{"h":"Rescan the app for outdated libraries","ok":false,"why":"That is hardening for later, not scoping now."}]}]},"ex":"<b>Why:<\/b> Confirm, contain with IMDSv2 plus credential revocation, then scope with CloudTrail, S3 data events and GuardDuty. IMDSv2's token requirement is specifically designed to break SSRF credential theft. <b>Focus on:<\/b> metadata credential theft = revoke sessions first, patch metadata options second, hunt third.","k":["IMDSv1 / metadata SSRF","CloudTrail","AWS Security Hub","Risk acceptance"],"hint":"Kill the credential, then the vector, then the doubt - in that order."},{"id":"h03","type":"dnd","th":"output","ti":"Vector to band: the subtle ones","pts":4,"sc":"Sort each vector into the band its computed base score falls in. Hint: scope change can push a vector up a whole band.","q":"Sort each vector into the band its computed base score falls in. Hint: scope change can push a vector up a whole band.","d":{"items":[{"k":"rce","h":"AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"},{"k":"log4","h":"AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"},{"k":"tls","h":"AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N"},{"k":"xss","h":"AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"},{"k":"sudo","h":"AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"},{"k":"snmp","h":"AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:N/A:N"}],"slots":[{"h":"<b>CRITICAL<\/b> 9.0-10.0","t":"Critical","accept":["rce","log4"],"why":"9[.]8 and 10[.]0 - the S:C change lifts JNDI to 10[.]0"},{"h":"<b>HIGH<\/b> 7.0-8.9","t":"High","accept":["tls","sudo"],"why":"7[.]4 with high complexity; 7[.]8 local sudo"},{"h":"<b>MEDIUM<\/b> 4.0-6.9","t":"Medium","accept":["xss"],"why":"6[.]1 - UI:R and low C/I hold it down"},{"h":"<b>LOW<\/b> 0.1-3.9","t":"Low","accept":["snmp"],"why":"3[.]7 with high complexity and low impact"}]},"ex":"<b>Why:<\/b> The classic RCE vector computes 9[.]8; adding S:C turns the same impact into 10[.]0 - scope changed is the examiner's favorite trap. High-complexity TLS with high confidentiality and integrity impact lands at 7[.]4, and local sudo escalation at 7[.]8. The reflected XSS reaches only 6[.]1: UI:R plus low C/I hold it down despite S:C. SNMP default string with AC:H and C:L is 3[.]7. <b>Focus on:<\/b> practice reading vectors: scope, then the C/I/A triple, then the exploitability metrics.","k":["CVSS v3.1 base score","CVSS vector string","Severity bands","Nessus / Tenable"],"hint":"S:C is the trap. High complexity and UI:R pull scores down.","art":[{"kind":"table","title":"Tenable scan of the Helios FinTech estate - vectors as reported","head":["Finding","CVSS v3.1 vector"],"rows":[["Unauth RCE in payment gateway","AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"],["Log4Shell-class JNDI lookup","AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"],["Weak TLS cipher accepted","AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:N"],["SSO page reflected XSS","AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"],["Local privilege escalation via sudo","AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"],["SNMP default community string","AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:N/A:N"]]}]},{"id":"h04","type":"spot","th":"containers","ti":"Spot the line that violates the ticket","pts":4,"sc":"The template below implements ticket HEL-4417. Checkov (and tfsec) flagged 2 violations - find them against the ticket.","q":"Click every line of the template that violates an acceptance criterion, then Check.","d":{"title":"terraform/reporting.tf - flagged by Checkov (tfsec agrees)","lines":[{"t":"resource \"aws_s3_bucket\" \"reports\" {","bad":false,"why":"header only"},{"t":"  bucket = \"helios-reports-prod\"","bad":false,"why":"naming only"},{"t":"}","bad":false,"why":"closing brace"},{"t":"resource \"aws_s3_bucket_public_access_block\" \"reports_pab\" {","bad":false,"why":"resource header"},{"t":"  bucket                  = aws_s3_bucket.reports.id","bad":false,"why":"reference wiring"},{"t":"  block_public_acls       = true","bad":false,"why":"satisfies REQ-1"},{"t":"  block_public_policy     = true","bad":false,"why":"satisfies REQ-1"},{"t":"  ignore_public_acls      = true","bad":false,"why":"part of REQ-1"},{"t":"  restrict_public_buckets = true","bad":false,"why":"satisfies REQ-1"},{"t":"}","bad":false,"why":"closing brace"},{"t":"resource \"aws_s3_bucket_server_side_encryption_configuration\" \"reports_enc\" {","bad":false,"why":"resource header"},{"t":"  bucket = aws_s3_bucket.reports.id","bad":false,"why":"reference wiring"},{"t":"  rule {","bad":false,"why":"syntax"},{"t":"    apply_server_side_encryption_by_default {","bad":false,"why":"syntax"},{"t":"      sse_algorithm = \"AES256\"","bad":true,"why":"REQ-2 wants a customer-managed KMS key; AES256 is provider-managed keys - unencrypted-at-rest in policy terms"},{"t":"    }","bad":false,"why":"syntax"},{"t":"  }","bad":false,"why":"syntax"},{"t":"}","bad":false,"why":"closing brace"},{"t":"# versioning: not configured in this template","bad":true,"why":"REQ-3 explicitly requires versioning and it is absent"}]},"ex":"<b>Why:<\/b> The block-public-access settings satisfy REQ-1 fully. The encryption rule uses AES256 (AWS-managed keys) where the ticket demands a customer-managed KMS key - that fails REQ-2. Versioning is simply missing, failing REQ-3. IaC scanning (Checkov, tfsec, trivy config) catches both patterns pre-deploy; the ticket is what tells you they are violations. <b>Focus on:<\/b> a finding is only 'good' or 'bad' relative to the requirement - the config plus the ticket together decide.","k":["IaC scanning (Terraform / CloudFormation)","Checkov","tfsec","Unencrypted storage at rest","Trivy"],"hint":"One line fails the key requirement, one note fails versioning. Public access is actually blocked.","art":[{"kind":"log","title":"Ticket HEL-4417 (change request) - acceptance criteria","lines":["REQ-1: The report bucket must never be publicly readable.","REQ-2: All objects encrypted at rest with a customer-managed key.","REQ-3: Versioning enabled for rollback.","REQ-4: Deployed only via the reviewed Terraform module."]}]},{"id":"h05","type":"qcm","th":"shared","ti":"The EKS patch nobody wants to own","pts":2,"sc":"A kube-bench run flags the outdated kubelet on the worker nodes. The platform vendor says 'AWS manages EKS', the security team says 'that is your node image'.","q":"Who must patch the outdated kubelet on those managed node groups?","d":{"opts":[{"h":"The customer - the node image and its kubelet are customer-side","ok":true,"sub":"security IN the cloud"},{"h":"AWS - EKS is a managed service, control plane and nodes alike"},{"h":"Nobody - version skew between kubelet and control plane is harmless"},{"h":"The Kubernetes project - upstream ships and supports the kubelet"}]},"ex":"<b>Why:<\/b> On EKS, AWS patches and scales the managed control plane and the hypervisor underneath (of the cloud). Worker nodes - even in managed node groups - run an AMI the customer chooses and the kubelet inside it is the customer's patch duty (in the cloud). Managed add-ons published by AWS are updated through the customer's add-on management. Version skew being 'supported' is not the question; the responsibility split is. <b>Focus on:<\/b> managed Kubernetes = managed control plane only.","k":["Shared responsibility model","Security OF the cloud vs IN the cloud","IaaS / PaaS / SaaS split","Provider responsibilities","Kube-bench"],"hint":"Whoever builds the node image owns what runs inside it.","art":[{"kind":"log","title":"Audit extract - Helios FinTech EKS cluster (managed node groups)","lines":["2026-10-11T08:00:01Z  Control plane: AWS-managed, version 1.29, patched 2026-09-30","2026-10-11T08:00:02Z  Node group ng-prod-1: kubelet 1.28.7 - BEHIND control plane (1.29)","2026-10-11T08:00:03Z  AMI on nodes: custom al2023-v3 (customer-built)","2026-10-11T08:00:04Z  Add-ons: vpc-cni 1.18 (managed add-on, AWS-published)"]}]},{"id":"h06","type":"triage","th":"report","ti":"Friday 17:42 - four alerts, one pair of hands","pts":4,"sc":"It is 17:42 on Friday at Helios FinTech. Four alerts queued. You are alone until 19:00. Correct triage means matching urgency to reality - not to the alert's own label.","q":"Choose the best first action per alert.","d":{"alerts":[{"name":"CRITICAL CVE-2023-48795 (Terrapin) on replication host 'vault-sync'","meta":"Qualys | host has no internet route, internal only, custom SSH build","opts":[{"h":"Schedule the vendor patch in the next window and note the compensating network isolation","ok":true},{"h":"Declare a P1 incident and wake the CISO","ok":false},{"h":"Ignore forever - it is internal","ok":false}],"why":"The label says critical, but the context says otherwise: no route to attackers, internal-only, vendor patch pending. SLA scheduling plus documented isolation is proportionate. Panic triage burns the evening on the wrong alert."},{"name":"GuardDuty: CryptoMining:BitcoinTool B! on prod-web-3","meta":"GuardDuty | active process evidence | public subnet","opts":[{"h":"Escalate to IR immediately - isolate the instance","ok":true},{"h":"Add it to Monday's queue","ok":false},{"h":"Ask the instance to stop mining politely via reboot","ok":false}],"why":"Active coin mining means live foothold on an internet-facing host. This is the real P1 of the evening - isolate and escalate."},{"name":"S3 bucket 'hr-analytics' newly shared read-only to a partner account","meta":"AWS Config | bucket policy changed 40 min ago | HR data classification","opts":[{"h":"Verify the change request and data classification now; revert if unauthorized","ok":true},{"h":"Approve silently - sharing is normal","ok":false},{"h":"Delete the partner account","ok":false}],"why":"Recent policy change touching sensitive data within the hour: verify authorization and revert on doubt. Fast, targeted, proportionate."},{"name":"12 IAM roles drifted: Action '*' added by the new deployment pipeline","meta":"CIEM | drift source identified - pipeline v2 rollout today","opts":[{"h":"Roll back via IaC, then fix the pipeline template","ok":true},{"h":"Accept - pipelines need broad rights","ok":false},{"h":"Delete all 12 roles","ok":false}],"why":"Known change, identified blast radius, infrastructure-as-code rollback available. Fix the source and the drift together - no midnight heroics."}]},"ex":"<b>Why:<\/b> Severity labels are the scanner's opinion; context is yours. Active exploitation wins the evening. Sensitive-data changes get immediate verification. Known-source drift gets a same-day fix. The 'critical' CVE on an unreachable host waits for its window - that is mature prioritization, not laziness. <b>Focus on:<\/b> exploitation in progress beats label severity every time.","k":["Risk-based prioritization (KEV / EPSS)","AWS Config","Overly permissive IAM","Qualys Cloud Platform","Continuous monitoring & drift","Asset criticality"],"hint":"Ask: is it live, is it sensitive, is it already understood? Rank by answers."},{"id":"h07","type":"match","th":"cspm","ti":"Map findings to the framework they violate","pts":4,"sc":"The Helios FinTech compliance officer (SOC 2 and ISO 27001 programs, plus OpenSCAP reports from the VM team) asks you to map six CSPM findings to the framework each one primarily violates.","q":"Match each finding to its framework.","d":{"items":[{"k":"pci","h":"Public bucket holding stored cardholder data"},{"k":"hipaa","h":"Database of patient records backed up without encryption"},{"k":"gdpr","h":"Marketing export of EU customer emails left readable by all employees"},{"k":"soc","h":"Audit log bucket lifecycle set to delete logs after 7 days"},{"k":"iso","h":"No documented risk assessment for the new cloud region"},{"k":"nist","h":"Production images not aligned to any published hardening baseline"}],"slots":[{"h":"PCI DSS (cardholder data)","t":"PCI DSS","accept":["pci"],"why":"cardholder data protection requirements"},{"h":"HIPAA (health data)","t":"HIPAA","accept":["hipaa"],"why":"safeguards for protected health information"},{"h":"GDPR (EU personal data)","t":"GDPR","accept":["gdpr"],"why":"data minimization and access control for EU data"},{"h":"SOC 2 (trust services, audit evidence)","t":"SOC 2","accept":["soc"],"why":"log retention supports the security and availability criteria"},{"h":"ISO 27001 (ISMS process)","t":"ISO 27001","accept":["iso"],"why":"risk assessment is a core ISMS requirement"},{"h":"NIST (hardening baselines)","t":"NIST","accept":["nist"],"why":"baseline alignment maps to NIST guidance"}]},"ex":"<b>Why:<\/b> Map by data and process: cardholder data lands in PCI DSS, patient data in HIPAA, EU personal data in GDPR, audit-log handling in SOC 2 evidence, risk-assessment process in ISO 27001, hardening baselines in NIST guidance. One finding can touch several frameworks - answer with the primary driver. <b>Focus on:<\/b> framework mapping is a daily GRC skill; scanners only hand you the rows.","k":["Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)","CSPM","OpenSCAP / SCAP"],"hint":"The data type names the framework. The process type names it too."},{"id":"h08","type":"terminal","th":"tools","ti":"Enumerate and capture - your choice of tool","pts":2,"sc":"The engagement rules artifact above defines the target, the task, the deliverable and the constraints for this authorized test.","q":"No tool names are given - choose the right tool and build the command yourself. Press Enter to run it, then Check.","d":{"prompt":"root@helios-pentest","title":"HEL-PT-2026-11 - authorized lab","cmds":[{"re":"^nmap\\b.*(-o[nNxAG]\\S*|--output|>\\s*\\S*|\\|\\s*tee).*(10\\[?\\.\\]?20\\[?\\.\\]?8\\[?\\.\\]?35)|^nmap\\b.*(10\\[?\\.\\]?20\\[?\\.\\]?8\\[?\\.\\]?35).*(-o[nNxAG]\\S*|--output|>\\s*\\S*|\\|\\s*tee)","ok":true,"out":"Starting Nmap 7.94 ( scan saved to scan.txt )\nPORT     STATE SERVICE VERSION\n22/tcp   open  ssh     OpenSSH 9.6 (protocol 2.0)\n3389/tcp open  ms-wbt-server xrdp\nService detection performed. File scan.txt written."},{"re":"^nmap\\b.*10\\[?\\.\\]?20\\[?\\.\\]?8\\[?\\.\\]?35(\\b|$)","ok":false,"out":"Starting Nmap 7.94... 22/tcp open ssh OpenSSH 9.6, 3389/tcp open ms-wbt-server xrdp\n(result printed to screen only - the deliverable asked for a saved file)"},{"re":"^netcat|^nc\\b|^curl|^wget","ok":false,"out":"Those tools probe one port at a time - the task wants a full enumeration with versions."},{"re":"^scout|^trivy|^pacu","ok":false,"out":"That is not a service enumeration tool for a single host."}],"unknown":"command not found. This box carries the standard enumeration toolkit - check spelling and syntax.","solution":"nmap -sV -p- -oN scan.txt 10[.]20[.]8[.]35"},"ex":"<b>Why:<\/b> The job is service enumeration with versions, saved to disk - the classic tool is nmap with -sV (version detection), a port range such as -p-, and output either with -oN scan.txt or a redirect. Choosing the tool and the flags without being told is the hard-mode skill; the same scan is exactly what an attack-surface review of a cloud instance starts with. <b>Focus on:<\/b> goal in operational terms (enumerate + save) maps to tool + mode + output flags.","k":["Exposed management ports","Open security groups","Image / registry scanning"],"hint":"Two requirements: see the services, keep the result. Pick flags for each.","art":[{"kind":"log","title":"Engagement rules - Helios FinTech pentest (authorized scope)","lines":["Target: lab node 10[.]20[.]8[.]35 (in scope, written approval HEL-PT-2026-11)","Task: enumerate every open TCP service with version detection","Deliverable: results saved to a file on disk named scan.txt","Constraints: no GUI tools on this box; you have root"]}]},{"id":"h09","type":"order","th":"report","ti":"Order the response to a leaked root access key","pts":3,"sc":"A root access key is public AND already used by someone else. Order the response correctly - wrong order leaves windows open.","q":"A root access key is public AND already used by someone else. Order the response correctly - wrong order leaves windows open.","d":{"items":[{"k":"a","h":"Deactivate the exposed key immediately (do not delete yet - preserve evidence)"},{"k":"b","h":"Review CloudTrail for everything done with that key since creation"},{"k":"c","h":"Rotate credentials: create replacement keys only if a root key is truly required"},{"k":"d","h":"Purge the key from the repo and its git history, invalidate any distributed artifacts"},{"k":"e","h":"Rescan the account and verify no persistence (new users, keys, roles) remains"}],"correct":["a","b","c","d","e"]},"ex":"<b>Why:<\/b> Kill the live credential first (deactivate - deletion would also destroy evidence). Then scope with CloudTrail, then rotate deliberately, then clean the repo including git history, and finally rescan to prove no persistence (extra users, keys or roles) survived. Rotating before scoping can miss attacker-created backdoors; deleting evidence first is unforgivable. <b>Focus on:<\/b> contain, scope, evict, clean, verify.","k":["Missing MFA / root account risk","CloudTrail","Rescan validation","Ownership assignment"],"hint":"The key is live and used - seconds matter. Evidence before deletion.","art":[{"kind":"log","title":"Public repo alert - Helios FinTech","lines":["2026-10-12T18:22:03Z  Repo scanner: AWS access key AKIA...X9K found in public commit","2026-10-12T18:22:04Z  Key belongs to: root account (created 2023, never rotated)","2026-10-12T18:22:05Z  Last used: 2026-10-12T17:58:41Z from 205[.]180[.]44[.]12 (not company range)"]}]},{"id":"h10","type":"fib","th":"cspm","ti":"Complete the GCP identity review","pts":3,"sc":"The review note for the GCP platform team is drafted below; the SCC findings above are its source.","q":"Fill every blank from the bank. Place one chip per blank; three bank words stay unused.","d":{"mode":"chips","text":"The {{0}} finding shows 14 members holding roles/editor, a {{1}} role that grants broad rights - the {{2}} principle says each identity gets only what it needs. Tooling such as CloudSploit or ScoutSuite covers GCP too, and the {{3}} benchmark gives the yardstick. The uploaded key in the public repo must be {{4}} immediately.","bank":["CIEM","primitive","least privilege","CIS","rotated","Terraform","drift","guardrails"],"blanks":[{"a":["CIEM"]},{"a":["primitive"]},{"a":["least privilege"]},{"a":["CIS"]},{"a":["rotated"]}]},"ex":"<b>Why:<\/b> CIEM is the category that watches cloud identities; roles/editor is a primitive (basic) role with sweeping rights; least privilege is the principle; the CIS benchmark is the yardstick; and an exposed key is rotated - not deleted-and-forgotten, rotated so copies stop working. <b>Focus on:<\/b> identity findings get identity answers: fewer rights, narrower roles, fresh keys.","k":["CIEM","GCP Security Command Center","Overly permissive IAM","CIS Benchmarks / CIS-CAT","CloudSploit"],"hint":"Broad role, broad rights, one principle, one yardstick, one immediate action.","art":[{"kind":"log","title":"GCP Security Command Center - IAM findings for project helios-prod","lines":["2026-10-12T09:00:01Z  FINDING  Over-privileged service account: 14 members with roles/editor","2026-10-12T09:00:02Z  FINDING  Primitive role usage: 31 of 40 bindings use basic (primitive) roles","2026-10-12T09:00:03Z  FINDING  Service account key uploaded to public code repository","2026-10-12T09:00:04Z  Baseline: CIS Google Cloud Platform Benchmark v2.0"]}]},{"id":"h11","type":"dual","th":"containers","ti":"Dual perspective: the pod spec","pts":4,"sc":"The payments pod runs as written above. kube-bench and K8s hardening guides would fail most of this file.","q":"BLUE TEAM: select every real risk in this spec. RED TEAM: select every move this spec hands the attacker after one container compromise.","d":{"parts":[{"label":"BLUE TEAM - real risks in the spec?","opts":[{"h":"Privileged container with root and privilege escalation allowed","ok":true},{"h":"hostPath mount of / - the whole node filesystem is visible","ok":true},{"h":"hostNetwork - the pod shares the node's network stack","ok":true},{"h":"Default service account instead of a scoped one (broad RBAC)","ok":true},{"h":"The image name has no registry prefix"}]},{"label":"RED TEAM - what does one compromise enable?","opts":[{"h":"Read the node's /var/run/secrets to reuse the pod's service account token","ok":true},{"h":"Reach node-local services and the metadata route via hostNetwork","ok":true},{"h":"Escape to the host and attack sibling pods from the node","ok":true},{"h":"Alter the node's kubelet configuration from inside the container","ok":true},{"h":"Nothing - containers are always isolated by cgroups"}]}]},"ex":"<b>Why:<\/b> Blue: privileged + root + allowPrivilegeEscalation, a hostPath of /, hostNetwork and the default service account are four independent escalations - hardening guides (and kube-bench) reject each one. Red: with the node filesystem, node network and a token-bearing service account, one compromised container becomes node compromise, then cluster movement. <b>Focus on:<\/b> pod security standards (privileged/baseline/restricted) exist exactly to forbid this shape; CIEM then limits what the identity can do anyway.","k":["Kubernetes RBAC & pod security","Kube-bench","Ownership assignment"],"hint":"Four independent risks, one pod. Each one alone would fail a hardening audit.","art":[{"kind":"code","title":"k8s/deployments/payments.yaml - running on the Helios prod cluster","lines":["apiVersion: v1","kind: Pod","metadata:","  name: payments","spec:","  hostNetwork: true","  serviceAccountName: default","  containers:","  - name: pay","    image: helios/pay:7","    securityContext:","      privileged: true","      runAsUser: 0","      allowPrivilegeEscalation: true","    volumeMounts:","    - mountPath: /host","      name: hostroot","  volumes:","  - name: hostroot","    hostPath: { path: / }"]}]},{"id":"h12","type":"qcm","th":"tools","ti":"Agentless or agent-based? Pick with intent","pts":2,"sc":"Helios FinTech's platform lead wants two things for the new estate: (1) fast, agentless posture reviews across thousands of accounts, and (2) runtime process telemetry inside the payment VMs with the ability to block a malicious process. A vendor demo showed Wiz and Orca for (1); the CWPP conversation for (2) is unresolved.","q":"What is the correct engineering choice for requirement 2?","d":{"opts":[{"h":"An agent-based CWPP with an in-host sensor on the payment VMs","ok":true},{"h":"The same agentless scanning tool, polled at a faster interval"},{"h":"A CSPM tool with a much wider configuration rule set"},{"h":"A CASB proxy in front of the payment VMs at all times"}]},"ex":"<b>Why:<\/b> Agentless tools snapshot configuration from outside the OS - superb for breadth, silent about runtime. Process telemetry, file integrity and per-process blocking require an in-host agent; that is exactly the CWPP side of the platform (and why Wiz/Orca-style agentless and Prisma-style agents coexist in real estates). CSPM reads config, CASB watches SaaS. <b>Focus on:<\/b> the sensor's position decides what it can see: outside for config, inside for runtime.","k":["CWPP","Agent-based vs agentless scanning","Wiz","Orca Security","Prisma Cloud","CSPM","CASB"],"hint":"Runtime means inside. No outside tool sees a process."},{"id":"h13","type":"dnd","th":"report","ti":"Route each finding to its owning team","pts":4,"sc":"Helios FinTech runs three lanes: Product Dev (application code and dependencies), Platform (cloud and cluster configuration), and Security & GRC (policy, vendor and data governance). A backlog review assigns each finding an owner.","q":"Drag each finding to the team that owns the fix.","d":{"items":[{"k":"dep","h":"Vulnerable log4j dependency found by SBOM analysis in the payments service"},{"k":"sg","h":"Security group rule 0[.]0[.]0[.]0/0 on port 22 introduced by a Prowler finding"},{"k":"img","h":"Vulnerable base image still used by 9 builds in the registry"},{"k":"saas","h":"CASB report: engineering using an unapproved AI file-sharing SaaS"},{"k":"pod","h":"Pod security standard violations in the payments namespace"},{"k":"cls","h":"Data classification missing on 14 customer-facing buckets"}],"slots":[{"h":"<b>Product Dev<\/b>","t":"Product Dev","accept":["dep","img"],"why":"code and image content"},{"h":"<b>Platform<\/b>","t":"Platform","accept":["sg","pod"],"why":"cloud and cluster configuration"},{"h":"<b>Security & GRC<\/b>","t":"Security & GRC","accept":["saas","cls"],"why":"governance and vendor risk"}]},"ex":"<b>Why:<\/b> Ownership follows the change surface: dependencies and base image content belong to Product Dev; security groups and pod standards to Platform; SaaS governance and data classification to Security & GRC. Findings without owners rot in queues - routing is part of remediation, not bureaucracy. <b>Focus on:<\/b> ask 'who can actually change this?' and route there.","k":["Ownership assignment","SBOM & dependency scanning","Image / registry scanning","Prowler","CASB","Remediation vs mitigation"],"hint":"Who can open a pull request that makes the finding disappear?"},{"id":"h14","type":"multi","th":"output","ti":"Read this vector like an analyst","pts":3,"sc":"A ticket claims the payments API finding is internet-exploitable and must be fixed today; the scanner labelled it HIGH - review required.","q":"The vector is AV:A/AC:H/PR:L/UI:R/S:C/C:H/I:H/A:L. Select every statement a careful analyst would endorse.","d":{"opts":[{"h":"The attack works only from a network adjacent to the target - not from the open internet","ok":true},{"h":"High attack complexity means exploitation is unreliable or condition-dependent","ok":true},{"h":"The attacker needs some privileges, and a user must interact","ok":true},{"h":"S:U in this vector means the impact stays inside the vulnerable component"},{"h":"The ticket's 'internet-exploitable' claim is contradicted by AV:A","ok":true}]},"ex":"<b>Why:<\/b> AV:A (adjacent) kills the 'internet-exploitable' claim - the ticket overstates it. AC:H means conditions must align; PR:L and UI:R add a foothold and a user action. The false statement is the scope one: this vector reads S:C, so impact does spill into other components - S:U would be needed to keep it contained. <b>Focus on:<\/b> vectors let you correct tickets that outsell the real risk.","k":["CVSS vector string","CVSS v3.1 base score","Risk-based prioritization (KEV / EPSS)"],"hint":"AV decides reachability first. AC, PR and UI decide friction. S decides blast radius.","art":[{"kind":"code","title":"Finding under review - payments API","lines":["Vector: AV:A/AC:H/PR:L/UI:R/S:C/C:H/I:H/A:L","Scanner label: 'HIGH - review required'","Asset: internal API reachable only from the office network","Ticket claims: 'internet-exploitable, fix today'"]}]},{"id":"h15","type":"branch","th":"tools","ti":"Branching scenario: Pacu was here","pts":4,"sc":"An engagement review: during an authorized internal test, the red team ran Pacu with a low-privilege developer key they found in a CI variable. Blue team must now detect and shut the equivalent real path.","q":"Work the four response steps.","d":{"stages":[{"ctx":"CloudTrail shows the developer identity suddenly calling iam:ListRoles, s3:ListAllMyBuckets and ec2:DescribeInstances from a new IP.","q":"What is the right interpretation move?","opts":[{"h":"Treat it as probable tool-based enumeration and pull the identity's full activity around that window","ok":true,"why":"Pacu modules look exactly like this: rapid, broad read-only discovery calls."},{"h":"Ask the developer politely whether it was them and wait a week","ok":false,"why":"Enumeration of the whole account is never normal dev behavior; waiting is wrong even if it was them."},{"h":"Disable CloudTrail to reduce log noise","ok":false,"why":"Destroying your own visibility mid-hunt."}]},{"ctx":"Confirmed: the identity's key was exposed in a CI variable and used by the test framework.","q":"Contain the credential path - how?","opts":[{"h":"Revoke the session, rotate the key, and purge it from the CI variable store","ok":true,"why":"Credential lifecycle first: dead key, no source, no reuse."},{"h":"Move the key into a different CI variable","ok":false,"why":"Same exposure, new name."},{"h":"Wait for the scheduled quarterly rotation","ok":false,"why":"The key is burned today, not in three months."}]},{"ctx":"The enumeration mapped 40 buckets and 12 roles before you cut access.","q":"What must be reviewed before declaring the account clean?","opts":[{"h":"CloudTrail for any write or persistence action from the same identity or IP: new users, keys, roles, policies","ok":true,"why":"Enumeration is recon; the danger is what they changed or created afterwards."},{"h":"Only the developer's laptop","ok":false,"why":"The account activity, not the laptop, is the blast radius here."},{"h":"Nothing - read-only calls cannot hurt","ok":false,"why":"Read-only recon is the first half of most cloud attacks."}]},{"ctx":"Post-incident hardening is planned.","q":"Which control set actually breaks this attack path?","opts":[{"h":"Secrets manager for CI variables, least-privilege CI identity, and GuardDuty/API-anomaly alerting on enumeration patterns","ok":true,"why":"Remove the exposure, shrink the blast radius, and detect the behavior next time."},{"h":"A weekly staff reminder about secrets","ok":false,"why":"Awareness alone does not remove a credential from a variable."},{"h":"More buckets","ok":false,"why":"Storage does not fix identity or logging gaps - the exposure stays exactly where it was."}]}]},"ex":"<b>Why:<\/b> Pacu-style enumeration is recognizable: rapid, broad, read-only API calls from a new source. Response is interpret, revoke-and-purge, review writes for persistence, then fix the exposure (secrets management) and add detection. <b>Focus on:<\/b> the CI pipeline is part of the cloud attack surface - CIEM and secrets hygiene included.","k":["Pacu","CloudTrail","CIEM"],"hint":"Read-only recon is step one of every cloud attack. Detect the pattern, kill the key."},{"id":"h16","type":"rank","th":"report","ti":"Re-rank with KEV and exposure data","pts":4,"sc":"Your SLA says rank by: exploitation evidence, then internet exposure, then data sensitivity, then score. EPSS for F-104 and F-105 is under 1 percent.","q":"Rank the six findings from most urgent (1) to least urgent (6).","d":{"items":[{"k":"f101","h":"F-101 edge gateway RCE - KEV + attempts in WAF logs"},{"k":"f102","h":"F-102 public PII snapshot"},{"k":"f104","h":"F-104 bastion OpenSSH - internet-facing, not KEV"},{"k":"f103","h":"F-103 KEV CVE on air-gapped backup server"},{"k":"f105","h":"F-105 marketing site plugin CVE"},{"k":"f106","h":"F-106 EOL runtime on internal CI runner"}],"correct":["f101","f102","f104","f103","f105","f106"]},"ex":"<b>Why:<\/b> F-101 first: KEV plus observed exploitation plus internet exposure. F-102 next: sensitive data already exposed. F-104 beats F-103 despite F-103's KEV status because reachability rules: the bastion is internet-facing while the backup server has no route at all. F-105 then F-106 by exposure and sensitivity. A CVSS-only ordering would put F-103 above F-104 - context fixes it. <b>Focus on:<\/b> KEV and EPSS move findings up only when the attack path exists.","k":["Risk-based prioritization (KEV / EPSS)","SLA & ticket tracking","Asset criticality","public snapshots / AMIs","Qualys Cloud Platform","Amazon Inspector"],"hint":"Reachability first, data second, score last. That is the whole ranking.","art":[{"kind":"table","title":"Qualys + Inspector consolidated output - Helios FinTech (day 0)","head":["ID","Finding","CVSS","Notes"],"rows":[["F-101","RCE in edge gateway, KEV-listed, WAF shows exploitation attempts","9[.]8","internet-facing, CISA KEV"],["F-102","RDS snapshot with PII shared publicly","8[.]6","no exploitation evidence yet"],["F-103","SQLite CVE, KEV-listed, on the air-gapped backup server","7[.]5","no network route"],["F-104","OpenSSH CVE, not in KEV, bastion host","7[.]0","internet-facing, keys-only auth"],["F-105","WordPress plugin CVE, not in KEV, on the marketing site","6[.]4","internet-facing"],["F-106","EOL runtime on an internal CI runner","5[.]0","internal, low data sensitivity"]]}]},{"id":"h17","type":"match","th":"tools","ti":"Match the tool to the output you actually get","pts":4,"sc":"A junior analyst at Helios FinTech collected raw outputs from seven tools into one folder and lost the manifest. You must re-attribute each output to the tool that produced it.","q":"Match each output artifact to its producing tool.","d":{"items":[{"k":"scout","h":"One HTML report covering AWS, Azure and GCP posture findings per service"},{"k":"khunter","h":"A list of Kubernetes cluster attack paths: exposed API server, dashboard without auth"},{"k":"inspector","h":"Package-level CVE findings for an EC2 instance and a Lambda layer"},{"k":"config","h":"A resource configuration timeline showing when an SG rule changed and who"},{"k":"hub","h":"An aggregated compliance score with findings collected from many AWS accounts"},{"k":"clair","h":"A static analysis CVE list for layers of one container image"},{"k":"prisma","h":"A unified alert stream mixing CSPM misconfigurations and runtime workload events"}],"slots":[{"h":"ScoutSuite","t":"ScoutSuite","accept":["scout"]},{"h":"Kube-hunter","t":"kube-hunter","accept":["khunter"]},{"h":"Amazon Inspector","t":"Inspector","accept":["inspector"]},{"h":"AWS Config","t":"AWS Config","accept":["config"]},{"h":"AWS Security Hub","t":"Security Hub","accept":["hub"]},{"h":"Clair","t":"Clair","accept":["clair"]},{"h":"Prisma Cloud","t":"Prisma Cloud","accept":["prisma"]}]},"ex":"<b>Why:<\/b> Each tool has a signature: ScoutSuite's multi-cloud HTML posture report; kube-hunter's cluster attack paths; Inspector's package CVEs for EC2 and Lambda; AWS Config's per-resource timeline; Security Hub's cross-account aggregate with compliance score; Clair's per-image layer analysis; Prisma Cloud mixing CSPM and CWPP in one stream. Reading outputs fluently means you can attribute any screenshot a client sends. <b>Focus on:<\/b> output shape identifies the tool as surely as the logo does.","k":["ScoutSuite","Kube-hunter","Amazon Inspector","AWS Config","AWS Security Hub","Clair","Prisma Cloud"],"hint":"Ask: what layer does it look at - account config, cluster, packages, image layers, or everything?"},{"id":"h18","type":"spot","th":"misconfig","ti":"Spot the trust policy mistakes","pts":4,"sc":"This trust policy belongs to a role that can read the finance reporting bucket. The file has no condition blocks. Review it line by line.","q":"Click every line that makes this role assumable by the wrong parties, then Check.","d":{"title":"iam/trust-reporting-role.json - who can assume this role?","lines":[{"t":"{","bad":false,"why":"syntax"},{"t":"  \"Version\": \"2012-10-17\",","bad":false,"why":"syntax"},{"t":"  \"Statement\": [{","bad":false,"why":"syntax"},{"t":"    \"Effect\": \"Allow\",","bad":false,"why":"Allow is normal in a trust policy"},{"t":"    \"Principal\": \"*\",","bad":true,"why":"any identity in any account may assume the role"},{"t":"    \"Action\": \"sts:AssumeRole\"","bad":true,"why":"combined with Principal *, this grants assumability to everyone"},{"t":"  }]","bad":false,"why":"syntax"},{"t":"}","bad":false,"why":"syntax"}]},"ex":"<b>Why:<\/b> In a trust policy, <code>Principal: \"*\"<\/code> means every identity - including anonymous federated paths - can be allowed to assume the role; with no condition block restricting it, the pair effectively publishes the role. The fix is naming the exact principal (or federated provider) and adding conditions such as an external ID or source restriction. <b>Focus on:<\/b> identity policies say what a role may do; trust policies say who may wear it - both need least privilege.","k":["Overly permissive IAM","Customer responsibilities"],"hint":"The Principal line is the gate; the Action line opens it."},{"id":"h19","type":"fib","th":"cspm","ti":"Complete the identity governance memo","pts":3,"sc":"The Helios FinTech cloud council asks for a short memo on identity risk. Fill it from the bank - three words are decoys.","q":"Place one chip per blank; click a placed chip to send it back to the bank.","d":{"mode":"chips","text":"Our {{0}} platform correlates every human and machine identity with the permissions it actually uses. It flagged one role holding {{1}} permissions on all resources that no identity exercised in 90 days - classic {{2}}. The fix follows {{3}} privilege: grant by role, review quarterly, and treat the {{4}} combination of a public bucket plus wildcard role as a priority-one finding.","bank":["CIEM","unused","toxic","least","over-privileged","CASB","CWPP","drift"],"blanks":[{"a":["CIEM"]},{"a":["unused"]},{"a":["over-privileged","overprivileged"]},{"a":["least"]},{"a":["toxic"]}]},"ex":"<b>Why:<\/b> CIEM answers 'who can do what, and who actually does'; unused wildcard permissions are over-privilege; least privilege shrinks them; and a toxic combination is two rights that are harmless apart but dangerous together - like read access to a public bucket plus broad write. <b>Focus on:<\/b> identity findings are about pairs and paths, not single permissions.","k":["CIEM","Overly permissive IAM"],"hint":"Five blanks: one category, three adjectives, one principle."},{"id":"h20","type":"dnd","th":"tools","ti":"Evidence to source: which log answers it?","pts":4,"sc":"An incident review at Helios FinTech lists six open questions. The account has full logging: CloudTrail, VPC Flow Logs, AWS Config, GuardDuty, S3 server access logs and WAF logs.","q":"Drag each question to the data source that directly answers it.","d":{"items":[{"k":"ct","h":"Which API call changed the bucket policy at 02:14?"},{"k":"fl","h":"Did 8 GB actually leave to 198[.]51[.]100[.]24 on port 443?"},{"k":"cfg","h":"When did the security group rule drift from /32 to 0[.]0[.]0[.]0/0?"},{"k":"gd","h":"Was this credential used from an unusual location or service?"},{"k":"s3","h":"Which anonymous request downloaded the nightly CSV export?"},{"k":"waf","h":"Which exact request payload triggered the SSRF probe?"}],"slots":[{"h":"<b>CloudTrail<\/b>","t":"CloudTrail","accept":["ct"],"why":"control-plane API history"},{"h":"<b>VPC Flow Logs<\/b>","t":"VPC Flow Logs","accept":["fl"],"why":"network flows, no payloads"},{"h":"<b>AWS Config<\/b>","t":"AWS Config","accept":["cfg"],"why":"resource configuration drift over time"},{"h":"<b>GuardDuty<\/b>","t":"GuardDuty","accept":["gd"],"why":"managed threat detection on identities and hosts"},{"h":"<b>S3 server access logs<\/b>","t":"S3 access logs","accept":["s3"],"why":"per-object request records"},{"h":"<b>WAF logs<\/b>","t":"WAF logs","accept":["waf"],"why":"full HTTP requests at the edge"}]},"ex":"<b>Why:<\/b> API actions live in CloudTrail; byte-level egress in Flow Logs (which never show payloads); configuration drift over time in AWS Config; behavioral anomalies in GuardDuty; per-object S3 requests in S3 access logs; and full request payloads in WAF logs. Picking the wrong source is the most common reason investigations stall. <b>Focus on:<\/b> know the data each source records before you hunt in it.","k":["CloudTrail","AWS Config","Continuous monitoring & drift","Open security groups","IMDSv1 / metadata SSRF"],"hint":"Payloads, flows, config, identity behavior - four different log families."},{"id":"h21","type":"qcm","th":"output","ti":"The scan that saw nothing - and why","pts":2,"sc":"The external agentless scan reported a clean subnet; the next day a posture tool found a public database instance inside it.","q":"What happened, and what is the correct program change?","d":{"opts":[{"h":"A false negative from scope limits - extend coverage, reconcile scope","ok":true},{"h":"A false positive by the posture tool - trust the external scan"},{"h":"The subnet is clean; the SCC finding must be a hallucination"},{"h":"The scanner needs a faster scan window next month"}]},"ex":"<b>Why:<\/b> The external scan never reached the database tier (firewall ACL) and without credentials it cannot inspect database configuration at all: a textbook false negative caused by scan scope and method, not by a secure state. 'Clean' must always be read as 'clean within scope and method'. The fix is credentialed or agent coverage for config-class checks plus scope reconciliation in every report. <b>Focus on:<\/b> completeness is part of the finding - a report that cannot say what it did not scan is incomplete.","k":["False negative","Scan scope & completeness","Credentialed vs non-credentialed scans","GCP Security Command Center"],"hint":"Two limits stacked: network reachability and scan method.","art":[{"kind":"log","title":"Scan report - monthly external assessment of the app subnet","lines":["2026-10-10T04:00:00Z  Scan scope: 41 external endpoints, agentless, non-credentialed","2026-10-10T06:12:44Z  Result: 0 findings on subnet 10[.]30[.]0[.]0/16 (46 hosts unresponsive)","2026-10-10T06:13:02Z  Note: database tier 10[.]30[.]7[.]x excluded by firewall ACL","2026-10-11T09:00:00Z  GCP SCC (separate): public Cloud SQL instance found in the same subnet"]}]},{"id":"h22","type":"triage","th":"misconfig","ti":"GCP Security Command Center morning queue","pts":4,"sc":"Monday at Helios FinTech's GCP estate. Four findings queued in Security Command Center. Choose the proportionate response for each.","q":"Choose one action per finding.","d":{"alerts":[{"name":"Public GCS bucket contains service-account token files","meta":"SCC | public IAM allowed | secrets inside objects","opts":[{"h":"Restrict the bucket and rotate the exposed keys today","ok":true},{"h":"Leave it - tokens expire","ok":false},{"h":"Rename the objects to something unguessable","ok":false}],"why":"Exposed service-account keys are long-lived credentials. Rotate immediately; renaming files is obscurity, not containment."},{"name":"Service account key committed to a public repository","meta":"SCC | CWE-798 hardcoded credentials | key active","opts":[{"h":"Rotate the key, purge repo history, and check usage in Cloud Audit Logs","ok":true},{"h":"Delete the commit message only","ok":false},{"h":"Wait for the next key rotation cycle","ok":false}],"why":"CWE-798 in public means strangers hold a key. Rotate, clean history (clones keep old commits), and verify what it was used for."},{"name":"Audit log sink disabled - third time this quarter","meta":"SCC | log router sink deleted | trend: recurring","opts":[{"h":"Restore the sink, review the gap, and lock the sink with policy so it cannot be deleted casually","ok":true},{"h":"Note it in the register and move on","ok":false},{"h":"Enable only error-level logs","ok":false}],"why":"A recurring logging outage is either an attack pattern or a broken process - both need the sink back plus an investigation of the gaps and a structural lock."},{"name":"Jenkins VM on default admin credentials, internet-facing","meta":"SCC | default credentials | weak configuration","opts":[{"h":"Change credentials, restrict access, then patch Jenkins","ok":true},{"h":"Accept the risk until Q3","ok":false},{"h":"Turn off the SCC finding source","ok":false}],"why":"A CI server with default credentials on the internet is a foothold waiting to happen: change the credential first (it takes minutes), then restrict and patch."},{"name":"MFA not enforced on the organization super-admin","meta":"SCC | identity hardening | break-glass account","opts":[{"h":"Enforce MFA and store break-glass credentials in a vault with monitoring","ok":true},{"h":"Super-admins are careful people","ok":false},{"h":"Delete the super-admin account","ok":false}],"why":"Privileged accounts are the highest-value identity in the org. MFA enforcement plus vaulted, monitored break-glass credentials is the standard pattern."}]},"ex":"<b>Why:<\/b> Live secrets and exposed credentials get rotated today; recurring log outages get restored and locked; default-credential services get fixed at the credential layer first; and privileged identities get MFA without debate. The GCP tool names change but the reasoning mirrors AWS and Azure queues. <b>Focus on:<\/b> credentials in public are burned goods - the clock started when the commit landed.","k":["GCP Security Command Center","Default credentials","Disabled audit logging","Missing MFA / root account risk","CWE","public object storage exposure"],"hint":"Rotation, history, restoration, MFA - four different responses for four different gaps."},{"id":"h23","type":"dnd","th":"output","ti":"Vector metrics, second lap","pts":4,"sc":"An internal review produced the four statements above about the finance-report portal flaw.","q":"Drag each description onto the CVSS metric it describes for this finding.","d":{"items":[{"k":"avn","h":"The flaw is reachable over the network"},{"k":"acl","h":"No special conditions - exploitation is straightforward"},{"k":"prl","h":"The attacker must already hold a low-level account"},{"k":"uin","h":"No user interaction is needed at all"},{"k":"su","h":"Damage stays inside the vulnerable component - scope unchanged"},{"k":"al","h":"Availability impact is low"}],"slots":[{"h":"AV:","t":"Attack Vector","accept":["avn"]},{"h":"AC:","t":"Attack Complexity","accept":["acl"]},{"h":"PR:","t":"Privileges Required","accept":["prl"]},{"h":"UI:","t":"User Interaction","accept":["uin"]},{"h":"S:","t":"Scope","accept":["su"]},{"h":"A:","t":"Availability","accept":["al"]}]},"ex":"<b>Why:<\/b> Remote reach is AV:N; straightforward exploitation is AC:L; needing a foothold is PR:L; no user action is UI:N; damage staying put is S:U; minor downtime is A:L. With the high confidentiality impact stated above, the vector reads AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:L/A:L - about 7[.]6, high band, but far less scary than a 9[.]8 unauthenticated RCE. <b>Focus on:<\/b> the exploitability metrics (AV, AC, PR, UI) describe the path; impact metrics (C, I, A) and scope describe the damage.","k":["CVSS vector string","CVSS v3.1 base score","Severity bands"],"hint":"Path metrics first: remote, simple, some privileges, no click.","art":[{"kind":"code","title":"Finding: finance-report portal flaw (internal review at Helios FinTech)","lines":["Remote attackers can reach the flaw; exploitation is straightforward.","The attacker must hold a low-level account, but no user clicks anything.","Damage stays inside the service - no other components are affected.","Confidentiality damage is high; downtime impact is minor."]}]},{"id":"h24","type":"multi","th":"report","ti":"Pick the mitigations - not the fixes","pts":3,"sc":"The payments API has an unpatchable library flaw (vendor fix in 4 months). The CISO asks which proposed actions are mitigations - risk reducers while the flaw lives - rather than true remediations.","q":"Select every action that is a mitigation.","d":{"opts":[{"h":"Adding a WAF rule that blocks the exploit pattern","ok":true},{"h":"Restricting the API's security group to known partner ranges","ok":true},{"h":"Requiring MFA plus step-up authentication for API users","ok":true},{"h":"Restricting permissive CORS so only trusted origins can call the API","ok":true},{"h":"Replacing the vulnerable library with the patched one"},{"h":"Retiring the legacy API version entirely"}]},"ex":"<b>Why:<\/b> Mitigations reduce exposure or exploitability while the flaw remains: WAF filtering, network restriction, stronger authentication, tighter CORS. Replacing the library and retiring the API remove the cause - those are remediations. Both matter; the report must not blur them, because mitigations need review dates and the flaw ticket stays open. <b>Focus on:<\/b> ask 'is the flaw still there afterwards?' - if yes, it is a mitigation.","k":["Remediation vs mitigation","Permissive CORS","Exception & compensating control","Risk acceptance"],"hint":"Four risk reducers, two root-cause fixes. The flaw surviving is the test."},{"id":"h25","type":"order","th":"cspm","ti":"Order the guardrail rollout correctly","pts":3,"sc":"Helios FinTech is rolling out preventive CSPM guardrails (Azure Policy-style deny and audit rules) across 200 accounts. Bad sequencing causes outages or theater.","q":"Put the rollout steps in the right order.","d":{"items":[{"k":"a","h":"Run rules in audit-only mode and collect a week of real-world data"},{"k":"b","h":"Write the policy rules from the agreed baseline (tagging, encryption, public access)"},{"k":"c","h":"Triage the audit findings: fix real violations, tune rules that misfire"},{"k":"d","h":"Switch the rules to deny/enforce mode for new deployments"},{"k":"e","h":"Add the exception process with owners and expiry dates, then report trends monthly"}],"correct":["b","a","c","d","e"]},"ex":"<b>Why:<\/b> Write from baseline, listen before enforcing (audit-only), tune against reality, then enforce on new deployments, and stand up the exception process with trend reporting so enforcement does not create a shadow backlog. Deny-first is how guardrails get switched off by angry engineers. <b>Focus on:<\/b> guardrails earn their enforcement through audit data.","k":["Guardrails","Continuous monitoring & drift","Trend analysis","Exception & compensating control","Azure Policy"],"hint":"Write, listen, tune, enforce, govern. Never start with deny."},{"id":"h26","type":"multi","th":"misconfig","ti":"Corroborate the exfiltration","pts":3,"sc":"Payments VM 10[.]30[.]2[.]15 shows new behavior tonight. Select every observation that genuinely corroborates large-scale data exfiltration.","q":"Payments VM 10[.]30[.]2[.]15 shows new behavior tonight. Select every observation that genuinely corroborates large-scale data exfiltration.","d":{"opts":[{"h":"First-contact flows from the VM to an outside IP moving ~8.5 GB","ok":true},{"h":"GuardDuty flagging the same destination as blackhole/bad traffic","ok":true},{"h":"Anonymous downloads of a 10 GB payments export right before the flows","ok":true},{"h":"The normal NAT-sourced app traffic on port 443"},{"h":"The 8[.]5 GB destination being in the marketing CDN range"}]},"ex":"<b>Why:<\/b> The chain corroborates itself: an anonymous 10 GB object read from the VM itself, followed by first-contact flows carrying ~8.5 GB to an outside address, with GuardDuty independently flagging that destination. Normal NAT traffic is baseline. The 'marketing CDN range' claim is invented context - nothing in the estate defines that destination as a CDN - so a careful analyst rejects it instead of absorbing it. <b>Focus on:<\/b> corroboration means multiple independent sources pointing at the same story.","k":["public object storage exposure"],"hint":"Download, then egress, then a detector - three sources, one story.","art":[{"kind":"log","title":"VPC Flow Logs + GuardDuty + S3 access logs - payments tier (defanged)","lines":["2026-10-12T03:40:01Z  FLOW  accept  10[.]30[.]2[.]15:49152 -> 198[.]51[.]100[.]24:443  bytes=8589934592  duration=541s  (first contact)","2026-10-12T03:41:22Z  FLOW  accept  10[.]30[.]2[.]15:49153 -> 198[.]51[.]100[.]24:443  bytes=2147483648","2026-10-12T03:42:07Z  GuardDuty  Trojan:EC2/BlackholeTraffic!  10[.]30[.]2[.]15 -> 198[.]51[.]100[.]24","2026-10-12T03:39:58Z  S3 ACCESS  anonymous  GetObject exports/payments-2026-10.csv  from 10[.]30[.]2[.]15  bytes=10737418240","2026-10-12T03:35:00Z  S3 ACCESS  anonymous  ListObjects exports/  from 10[.]30[.]2[.]15","2026-10-12T03:20:11Z  FLOW  accept  10[.]30[.]2[.]15:443 <- 10[.]30[.]9[.]8 (NAT) normal app traffic"]}]},{"id":"h27","type":"qcm","th":"output","ti":"The version that lies","pts":2,"sc":"The scanner compares version strings and sees 1.4.2 < 1.5.0, so it fires at 9[.]1. The distribution backported the fix into 1.4.2-distrofix2.","q":"Classify and act.","d":{"opts":[{"h":"False positive - verify the backport, then suppress with evidence","ok":true},{"h":"True positive - emergency-upgrade the library to 1.5.0 tonight"},{"h":"False negative - demand that the scanner find more flaws"},{"h":"Risk acceptance - sign the finding off without any checks"}]},"ex":"<b>Why:<\/b> Version-string scanners cannot see backported fixes; the distro's -distrofix2 suffix means the vulnerability is gone even though the version looks old. That is a false positive by tooling limitation. The response is verification against the vendor advisory, then evidence-backed suppression or exception - not an emergency upgrade that could break API compatibility for nothing. <b>Focus on:<\/b> backports are the classic scanner-vs-reality gap in distro-patched estates.","k":["False positive","Amazon Inspector","Exception & compensating control","CVE"],"hint":"Check the advisory's 'fixed in' list before trusting the version compare.","art":[{"kind":"log","title":"Inspector finding - payments-api container (Helios FinTech)","lines":["PLUGIN: CVE-2023-1234 in libfoo 1.4.2 (vulnerable range: < 1.5.0)  CVSS 9[.]1","Detail: distro patched libfoo to 1.4.2-distrofix2 which backports the 1.5.0 fix","Package manager shows: libfoo 1.4.2-distrofix2 installed, no upgrade pending","Vendor advisory: fix included in 1.5.0 and backported to 1.4.2-distrofix2"]}]},{"id":"h28","type":"fib","th":"tools","ti":"Fill the Azure guardrail rules","pts":3,"sc":"Complete the platform team's guardrail cheat-sheet. Type the words.","q":"Complete the platform team's guardrail cheat-sheet. Type the words.","d":{"mode":"type","text":"Rule 1: storage with public access is blocked at creation time - use effect {{0}}. Rule 2: configurations we only want visibility on for now use effect {{1}}. Rule 3: missing diagnostic settings are auto-remediated with a template - effect {{2}}. These three effects are how a guardrail program expresses block, watch and repair.","blanks":[{"a":["deny"]},{"a":["audit"]},{"a":["deployifnotexists","deployifnotexists","deploy if not exists"]}]},"ex":"<b>Why:<\/b> Azure Policy effects are the vocabulary of guardrails: deny blocks non-compliant resources at creation, audit records them without blocking, and deployIfNotExists repairs missing configuration automatically (like adding diagnostic settings). Defender for Cloud recommendations map onto these assignments. <b>Focus on:<\/b> block, watch, repair - three verbs, three effects.","k":["Azure Policy","Guardrails","Microsoft Defender for Cloud","Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)"],"hint":"One word blocks, one word watches, one compound word repairs.","art":[{"kind":"log","title":"Microsoft Defender for Cloud - policy recommendations excerpt","lines":["2026-10-12T08:00:01Z  Azure Policy assignments: 3 effects available for rules","2026-10-12T08:00:02Z  Recommendation: storage accounts should disallow public access","2026-10-12T08:00:03Z  Recommendation: log analytics workspace audit retention >= 365 days"]}]},{"id":"h29","type":"fib","th":"report","ti":"Draft the executive summary","pts":3,"sc":"Fill the executive summary that opens the quarterly Helios FinTech cloud vulnerability report.","q":"One chip per blank; the bank holds two decoys.","d":{"mode":"chips","text":"This report opens with an {{0}} summary in plain language. The body lists per-finding {{1}} steps with owners and dates, and each fix was proven by an independent {{2}}. The {{3}} over the last four quarters shows the estate improving steadily. Two {{4}} decisions (accepted risks with compensating controls) are documented in the annex. {{5}} in configuration was low after the guardrail rollout.","bank":["executive","remediation","rescan","trend","risk acceptance","drift","false positive","guardrails"],"blanks":[{"a":["executive"]},{"a":["remediation"]},{"a":["rescan"]},{"a":["trend"]},{"a":["risk acceptance"]},{"a":["drift"]}]},"ex":"<b>Why:<\/b> An executive summary states scope and direction in plain language; the body carries remediation detail with owners; the rescan proves each fix; the trend line shows direction over quarters; accepted risks belong in the open with their compensating controls; and low drift means the guardrails are holding. Leadership reads the first page only - it must be honest on its own. <b>Focus on:<\/b> every sentence answers a leadership question: how big, what was done, which direction, what was accepted.","k":["Findings report structure","Trend analysis","Risk acceptance","Remediation vs mitigation"],"hint":"Scope, summary, actions, direction, accepted risks - six blanks, six questions."},{"id":"h30","type":"branch","th":"cspm","ti":"Branching scenario: the exception request","pts":4,"sc":"A business unit at Helios FinTech asks to keep an internet-facing analytics server unencrypted 'just for one quarter' because the vendor SDK fails with encryption on. You are the GRC analyst deciding the process.","q":"Make each call correctly.","d":{"stages":[{"ctx":"The request arrives by chat message: 'we will fix it later, please whitelist the scan finding'.","q":"First response?","opts":[{"h":"Convert it to a formal exception request: risk, asset, duration, proposed controls","ok":true,"why":"Chat approvals are invisible to audits; the process exists to make risk visible and owned."},{"h":"Whitelist it - the business knows its needs","ok":false,"why":"Security decisions without process or ownership are how breaches get explained to boards."},{"h":"Refuse outright and close the topic","ok":false,"why":"Blanket refusal pushes the risk into the shadows instead of managing it."}]},{"ctx":"The formal request lands: asset criticality medium, internet-facing, vendor fix in 4 months.","q":"What must accompany acceptance?","opts":[{"h":"Compensating controls - for example network restriction plus monitoring of the server","ok":true,"why":"Accepting without risk reduction is acceptance of naked exposure; controls bridge the gap."},{"h":"A promise that nobody will attack it","ok":false,"why":"Not a control."},{"h":"Nothing - acceptance is enough","ok":false,"why":"Uncompensated acceptance fails every framework's intent."}]},{"ctx":"Controls agreed: allow-list source ranges, WAF in front, weekly integrity check.","q":"Who signs, and for how long?","opts":[{"h":"The risk owner signs for a fixed term - here, until the vendor fix plus one patch cycle","ok":true,"why":"A named owner and a dated expiry keep the exception alive as a decision, not a habit."},{"h":"Security signs it open-ended - safer forever","ok":false,"why":"Open-ended exceptions become permanent by default."},{"h":"The vendor signs","ok":false,"why":"Vendors do not own your risk."}]},{"ctx":"The quarter ends; the vendor ships the fix.","q":"Close-out?","opts":[{"h":"Verify the fix, rescan, and retire the exception - findings return to normal SLA","ok":true,"why":"Exceptions expire by design; validation closes the loop."},{"h":"Renew automatically to avoid paperwork","ok":false,"why":"Auto-renewal defeats the entire mechanism."},{"h":"Keep the WAF and forget the patch","ok":false,"why":"Mitigations are bridges, not destinations."}]}]},"ex":"<b>Why:<\/b> Exceptions are managed risk: formal request, compensating controls, named owner, fixed expiry, verified close-out. Every framework (PCI DSS, ISO 27001, SOC 2) expects exactly this shape; every breach post-mortem finds the missing version of it. <b>Focus on:<\/b> acceptance is a documented, dated, owned decision - never a shrug.","k":["Risk acceptance","Exception & compensating control","Rescan validation","Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)","Asset criticality"],"hint":"Request, controls, owner and date, close-out. Four steps, zero shrugs."}]};
/* ===== engine part A: exercise-type renderers ===== */
'use strict';
var R = {};
var ALBL = {
  qcm:'CHOOSE ONE', multi:'CHOOSE ALL THAT APPLY', dual:'ANSWER BOTH PERSPECTIVES',
  dnd:'DRAG OR CLICK THE ITEMS INTO PLACE', order:'PUT THE STEPS IN THE RIGHT ORDER',
  rank:'RANK THE ITEMS: 1 = MOST URGENT', fib:'FILL IN THE BLANKS',
  terminal:'TYPE THE COMMAND AND PRESS ENTER', branch:'WORK THE SCENARIO STEP BY STEP',
  spot:'CLICK EVERY LINE THAT CONTAINS THE PROBLEM', triage:'CHOOSE ONE ACTION PER ALERT'
};
function ansLabel(ex){ return ex.albl || ALBL[ex.type] || 'ANSWER'; }

function setDis(root,dis){ $$('.opt,.chipitem,.ordrow button,.blank,.bankchip,.obtn,.linebtn,button',root).forEach(function(b){ try{ b.disabled=dis; }catch(e){} }); }

/* ---------- QCM (single choice) ---------- */
R.qcm = {
  build:function(ex, st, host){
    var d=ex.d;
    if(!st.order){ st.order = shuffle(d.opts.map(function(o,i){return i;})); }
    if(st.sel===undefined){ st.sel=null; }
    var wrap=h('div','opts');
    st.order.forEach(function(oi){
      var o=d.opts[oi];
      var b=h('button','opt');
      b.type='button'; b.dataset.oi=oi;
      b.setAttribute('role','radio'); b.setAttribute('aria-checked', st.sel===oi?'true':'false');
      if(st.sel===oi){ b.classList.add('sel'); }
      b.innerHTML='<span class="optmark" aria-hidden="true"></span><span class="optbody">'+o.h+(o.sub?'<span class="mini">'+o.sub+'</span>':'')+'</span>';
      b.addEventListener('click',function(){
        if(st.done){return;}
        st.sel=oi;
        $$('.opt',wrap).forEach(function(x){ x.setAttribute('aria-checked','false'); x.classList.remove('sel'); });
        b.classList.add('sel'); b.setAttribute('aria-checked','true');
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  },
  marks:function(ex, st){
    var d=ex.d;
    $$('.opt',CUR.ui.ans).forEach(function(n){
      var oi=+n.dataset.oi, o=d.opts[oi];
      n.disabled=true; n.classList.remove('sel');
      if(o.ok){ n.classList.add('mk-ok'); n.querySelector('.optmark').innerHTML=OK; }
      else if(oi===st.sel){ n.classList.add('mk-no'); n.querySelector('.optmark').innerHTML=NO; }
    });
  },
  val:function(ex, st){
    if(st.sel==null){ return null; }
    this.marks(ex,st);
    var d=ex.d, chosen=d.opts[st.sel];
    return { frac: chosen.ok?1:0, elements:1, got:chosen.ok?1:0,
      yours:chosen.h, correct:this.corr(ex) };
  },
  corr:function(ex){
    for(var i=0;i<ex.d.opts.length;i++){ if(ex.d.opts[i].ok){ return ex.d.opts[i].h; } }
    return '';
  }
};

/* ---------- MULTI (multi select) ---------- */
R.multi = {
  build:function(ex, st, host){
    var d=ex.d;
    if(!st.order){ st.order = shuffle(d.opts.map(function(o,i){return i;})); }
    if(!st.sel){ st.sel=[]; }
    var wrap=h('div','opts');
    st.order.forEach(function(oi){
      var o=d.opts[oi];
      var b=h('button','opt');
      b.type='button'; b.dataset.oi=oi;
      b.setAttribute('role','checkbox'); b.setAttribute('aria-checked', st.sel.indexOf(oi)>=0?'true':'false');
      if(st.sel.indexOf(oi)>=0){ b.classList.add('sel'); }
      b.innerHTML='<span class="optmark" aria-hidden="true"></span><span class="optbody">'+o.h+(o.sub?'<span class="mini">'+o.sub+'</span>':'')+'</span>';
      b.addEventListener('click',function(){
        if(st.done){return;}
        var ix=st.sel.indexOf(oi);
        if(ix>=0){ st.sel.splice(ix,1); b.classList.remove('sel'); b.setAttribute('aria-checked','false'); }
        else{ st.sel.push(oi); b.classList.add('sel'); b.setAttribute('aria-checked','true'); }
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  },
  marks:function(ex, st){
    var d=ex.d;
    $$('.opt',CUR.ui.ans).forEach(function(n){
      var oi=+n.dataset.oi, o=d.opts[oi];
      n.disabled=true;
      if(o.ok){ n.classList.add('mk-ok'); n.querySelector('.optmark').innerHTML=(st.sel.indexOf(oi)>=0)?OK:WR; }
      else if(st.sel.indexOf(oi)>=0){ n.classList.add('mk-no'); n.querySelector('.optmark').innerHTML=NO; }
    });
  },
  val:function(ex, st){
    if(!st.sel.length){ return null; }
    this.marks(ex,st);
    var d=ex.d, tot=0, got=0;
    d.opts.forEach(function(o,i){ if(o.ok){ tot++; if(st.sel.indexOf(i)>=0){ got++; } } });
    return { frac: tot? got/tot : 0, elements:tot, got:got,
      yours: st.sel.length? st.sel.map(function(i){return d.opts[i].h;}).join('<br>') : '(nothing selected)',
      correct:this.corr(ex) };
  },
  corr:function(ex){
    return ex.d.opts.filter(function(o){return o.ok;}).map(function(o){return o.h;}).join('<br>');
  }
};

/* ---------- DUAL (two perspectives, multi-select each part) ---------- */
R.dual = {
  build:function(ex, st, host){
    var d=ex.d, self=this;
    if(!st.p){ st.p = d.parts.map(function(){ return {sel:[],order:null}; }); }
    d.parts.forEach(function(pt,pi){
      if(!st.p[pi].order){ st.p[pi].order = shuffle(pt.opts.map(function(o,i){return i;})); }
      var side=h('div','stagecard');
      side.innerHTML='<div class="stagelabel">'+pt.label+'</div>';
      var wrap=h('div','opts');
      st.p[pi].order.forEach(function(oi){
        var o=pt.opts[oi];
        var b=h('button','opt');
        b.type='button'; b.dataset.pi=pi; b.dataset.oi=oi;
        b.setAttribute('role','checkbox'); b.setAttribute('aria-checked', st.p[pi].sel.indexOf(oi)>=0?'true':'false');
        if(st.p[pi].sel.indexOf(oi)>=0){ b.classList.add('sel'); }
        b.innerHTML='<span class="optmark" aria-hidden="true"></span><span class="optbody">'+o.h+'</span>';
        b.addEventListener('click',function(){
          if(st.done){return;}
          var cur=st.p[pi].sel, ix=cur.indexOf(oi);
          if(ix>=0){ cur.splice(ix,1); b.classList.remove('sel'); b.setAttribute('aria-checked','false'); }
          else{ cur.push(oi); b.classList.add('sel'); b.setAttribute('aria-checked','true'); }
        });
        wrap.appendChild(b);
      });
      side.appendChild(wrap);
      host.appendChild(side);
    });
  },
  marks:function(ex, st){
    var d=ex.d;
    $$('.opt',CUR.ui.ans).forEach(function(n){
      var pi=+n.dataset.pi, oi=+n.dataset.oi, o=d.parts[pi].opts[oi];
      n.disabled=true;
      if(o.ok){ n.classList.add('mk-ok'); n.querySelector('.optmark').innerHTML=(st.p[pi].sel.indexOf(oi)>=0)?OK:WR; }
      else if(st.p[pi].sel.indexOf(oi)>=0){ n.classList.add('mk-no'); n.querySelector('.optmark').innerHTML=NO; }
    });
  },
  val:function(ex, st){
    var any=false;
    st.p.forEach(function(p){ if(p.sel.length){ any=true; } });
    if(!any){ return null; }
    this.marks(ex,st);
    var d=ex.d, tot=0, got=0, ys=[], cs=[];
    d.parts.forEach(function(pt,pi){
      var labels={sel:[],ok:[]};
      pt.opts.forEach(function(o,i){
        if(o.ok){ labels.ok.push(o.h); tot++; if(st.p[pi].sel.indexOf(i)>=0){ got++; } }
        if(st.p[pi].sel.indexOf(i)>=0){ labels.sel.push(o.h); }
      });
      ys.push('<b>'+pt.label+'</b><br>'+(labels.sel.length?labels.sel.join('<br>'):'(nothing selected)'));
      cs.push('<b>'+pt.label+'</b><br>'+labels.ok.join('<br>'));
    });
    return { frac: tot? got/tot:0, elements:tot, got:got, yours:ys.join('<br><br>'), correct:cs.join('<br><br>') };
  },
  corr:function(ex){
    var cs=[];
    ex.d.parts.forEach(function(pt){
      cs.push('<b>'+pt.label+'</b><br>'+pt.opts.filter(function(o){return o.ok;}).map(function(o){return o.h;}).join('<br>'));
    });
    return cs.join('<br><br>');
  }
};

/* ---------- DND (chips -> slots; slot.accept = array of item keys) ---------- */
R.dnd = {
  build:function(ex, st, host){
    var d=ex.d, self=this;
    if(!st.assign){ st.assign={}; d.slots.forEach(function(s,i){ st.assign[i]=[]; }); }
    if(!st.bankOrd){ st.bankOrd = shuffle(d.items.map(function(i){return i.k;})); }
    st.selItem = st.selItem||null;
    var bank=h('div','bank');
    bank.innerHTML='<div class="banlabel">ITEMS</div>';
    var zone=h('div','',''); bank.appendChild(zone);
    function findK(key){ for(var i=0;i<d.items.length;i++){ if(d.items[i].k===key){ return d.items[i]; } } return null; }
    function refresh(){
      zone.innerHTML='';
      st.bankOrd.forEach(function(k){
        if(self.placedIn(d,st,k)>=0){ return; }
        var c=h('button','chipitem'); c.type='button'; c.dataset.k=k; c.draggable=true;
        c.innerHTML=findK(k).h;
        c.setAttribute('aria-label','item '+(findK(k).t||k));
        c.addEventListener('click',function(){
          if(st.done){return;}
          if(st.selItem===k){ st.selItem=null; }
          else{ st.selItem=k; }
          $$('.chipitem',host).forEach(function(x){ x.classList.remove('sel'); });
          if(st.selItem===k){ c.classList.add('sel'); }
        });
        c.addEventListener('dragstart',function(ev){ if(st.done){ev.preventDefault();return;} try{ev.dataTransfer.setData('text/plain',k);}catch(e){} });
        zone.appendChild(c);
      });
      d.slots.forEach(function(s,i){
        var dz=host.querySelector('.slot[data-si="'+i+'"] .dropzone');
        dz.innerHTML='';
        st.assign[i].forEach(function(k){
          var c=h('button','chipitem'); c.type='button'; c.dataset.k=k;
          c.innerHTML=findK(k).h;
          c.title='Click to put back';
          c.addEventListener('click',function(){
            if(st.done){return;}
            var a=st.assign[i], ix=a.indexOf(k);
            if(ix>=0){ a.splice(ix,1); }
            refresh();
          });
          dz.appendChild(c);
        });
        if(!st.assign[i].length){ dz.innerHTML='<span class="mini" style="color:var(--tx3)">empty</span>'; }
      });
    }
    host.appendChild(bank);
    var slots=h('div','slots');
    d.slots.forEach(function(s,i){
      var sl=h('div','slot'); sl.dataset.si=i;
      sl.innerHTML='<div class="slab">'+s.h+(s.why?' <span class="swhy">- '+s.why+'</span>':'')+'</div>';
      var dz=h('div','dropzone'); sl.appendChild(dz);
      sl.addEventListener('dragover',function(ev){ if(!st.done){ ev.preventDefault(); sl.classList.add('dropp'); } });
      sl.addEventListener('dragleave',function(){ sl.classList.remove('dropp'); });
      sl.addEventListener('drop',function(ev){
        ev.preventDefault(); sl.classList.remove('dropp');
        if(st.done){return;}
        var k; try{ k=ev.dataTransfer.getData('text/plain'); }catch(e){}
        if(!k){ return; }
        self.place(d,st,i,k); refresh();
      });
      sl.addEventListener('click',function(ev){
        if(st.done){return;}
        if(ev.target.closest('.chipitem')){ return; }
        if(st.selItem){ self.place(d,st,i,st.selItem); st.selItem=null; $$('.chipitem',host).forEach(function(x){x.classList.remove('sel');}); refresh(); }
      });
      slots.appendChild(sl);
    });
    host.appendChild(slots);
    refresh();
  },
  placedIn:function(d,st,k){
    for(var i=0;i<d.slots.length;i++){ if(st.assign[i].indexOf(k)>=0){ return i; } }
    return -1;
  },
  place:function(d,st,si,k){
    var cur=this.placedIn(d,st,k);
    if(cur>=0){ var a=st.assign[cur], ix=a.indexOf(k); if(ix>=0){ a.splice(ix,1); } }
    st.assign[si].push(k);
  },
  marks:function(ex, st){
    var d=ex.d, self=this;
    $$('.chipitem',CUR.ui.ans).forEach(function(c){ c.disabled=true; c.classList.remove('sel'); });
    d.items.forEach(function(it){
      var si=self.placedIn(d,st,it.k);
      var okPos=-1;
      d.slots.forEach(function(s,i){ if(s.accept.indexOf(it.k)>=0){ okPos=i; } });
      var cls = (si===okPos)?'mk-ok':(si>=0?'mk-no':'mk-miss');
      var node=CUR.ui.ans.querySelector('.chipitem[data-k="'+it.k+'"]');
      if(node){ node.classList.add(cls);
        node.insertAdjacentHTML('beforeend','<span class="ic '+(cls==='mk-ok'?'c-ok':cls==='mk-no'?'c-no':'c-wr')+'"> '+(cls==='mk-ok'?'&#10003;':cls==='mk-no'?'&#10007;':'&#9888;')+'</span>');
      }
    });
  },
  val:function(ex, st){
    var d=ex.d, self=this, tot=0, got=0;
    d.items.forEach(function(it){ tot++; var si=self.placedIn(d,st,it.k); var okPos=-1;
      d.slots.forEach(function(s,i){ if(s.accept.indexOf(it.k)>=0){ okPos=i; } });
      if(si===okPos){ got++; } });
    var any=false; d.slots.forEach(function(s,i){ if(st.assign[i].length){ any=true; } });
    if(!any && tot>0){ return null; }
    this.marks(ex,st);
    var ys=[], cs=[];
    d.slots.forEach(function(s,i){
