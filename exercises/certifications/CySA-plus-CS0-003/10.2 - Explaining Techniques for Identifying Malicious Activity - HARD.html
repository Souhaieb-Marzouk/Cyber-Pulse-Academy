<script>
"use strict";
var EX = [{"id":"H01","th":"app","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>01:40, Corvus Health SOC. MER-scanner noise lit up your queue: a blind scanner hammered /admin paths and got 404s all night. During triage you notice a different source did something quieter. Web server CORV-WEB01, requests 01:02–01:20.</p>","q":"<p>The 404 scanning is a false lead — the box returned 404 and moved on. Select every line that instead proves a real compromise (a working upload followed by webshell use).</p>","d":{"filter":true,"sel":true,"correct":[5,6,7],"lines":["198[.]51[.]100[.]77 - [12/Oct/2025:01:02:11] \"GET /admin HTTP/1.1\" 404 0","198[.]51[.]100[.]77 - [12/Oct/2025:01:02:12] \"GET /admin/login.php HTTP/1.1\" 404 0","198[.]51[.]100[.]77 - [12/Oct/2025:01:02:14] \"GET /wp-admin HTTP/1.1\" 404 0","198[.]51[.]100[.]77 - [12/Oct/2025:01:02:20] \"GET /phpmyadmin HTTP/1.1\" 404 0","203[.]0[.]113[.]58 - [12/Oct/2025:01:08:02] \"GET /employee-portal HTTP/1.1\" 200 8410","203[.]0[.]113[.]58 - [12/Oct/2025:01:09:44] \"POST /api/v2/avatar/upload HTTP/1.1\" 200 213 — body field pfile=avatar[.]ph%p","203[.]0[.]113[.]58 - [12/Oct/2025:01:10:03] \"GET /uploads/avatar.php?c=whoami HTTP/1.1\" 200 214","203[.]0[.]113[.]58 - [12/Oct/2025:01:10:41] \"GET /uploads/avatar.php?c=cat%20..%2F..%2F..%2Fetc%2Fpasswd HTTP/1.1\" 200 3902","10[.]10[.]31[.]4 - [12/Oct/2025:01:11:00] \"GET /health HTTP/1.1\" 200 8","198[.]51[.]100[.]77 - [12/Oct/2025:01:12:44] \"GET /index.html HTTP/1.1\" 200 5310","203[.]0[.]113[.]58 - [12/Oct/2025:01:15:09] \"GET /employee-portal/timesheet HTTP/1.1\" 200 9120","10[.]10[.]31[.]9 - [12/Oct/2025:01:16:41] \"GET /favicon.ico HTTP/1.1\" 404 153"]},"ex":"<p>The compromise is a three-line story: a POST to an avatar upload whose filename field hides <span class='mono'>avatar.php</span> behind percent-encoding (decode <span class='mono'>ph%p</span> and the extension reappears — the filter bypass), then GET requests to the uploaded shell running commands (<span class='mono'>c=whoami</span>) and reading files (<span class='mono'>cat ../../../etc/passwd</span>, path-traversal encoded as <span class='mono'>..%2F</span>). Status 200 with growing body sizes shows the commands worked. The 404 noise is a blind scanner against hardened paths — loud, but it proves nothing beyond poor aim. Lesson: severity follows outcome (200 + execution), not volume; the attacker who fails loudly is less interesting than the one who succeeds quietly.</p>","hints":["One request changed server state from 'no shell' to 'shell' — find the POST that wrote it.","A webshell is exercised with commands in a parameter — whoami, cat, ls."]},{"id":"H02","th":"host","t":"term","pts":10,"lab":"TYPE THE COMMANDS","sc":"<p>CORV-WS-2311 shows an unexplained service on TCP 8443. You have an elevated response console on the host. No tool is prescribed — bring your own.</p>","q":"<p>Complete all three objectives in the terminal, choosing your own commands.</p>","d":{"ps":"CORV-WS-2311>","boot":["Corvus Health response console (elevated)","Situation: an unknown service listens on TCP 8443 on this host.","Type help to list objectives."],"tasks":[{"goal":"Enumerate the open (listening) TCP ports together with the process ID (PID) that owns each one.","re":"netstat|\\bss\\b|lsof|get-nettcp","out":"TCP  0[.]0[.]0[.]0:135   0[.]0[.]0[.]0:0  LISTENING  988\nTCP  0[.]0[.]0[.]0:445   0[.]0[.]0[.]0:0  LISTENING  4\nTCP  0[.]0[.]0[.]0:8443  0[.]0[.]0[.]0:0  LISTENING  4712\nTCP  0[.]0[.]0[.]0:49664 0[.]0[.]0[.]0:0  LISTENING  720"},{"goal":"Identify the process name and image path for PID 4712.","re":"tasklist|get-process|\\bps\\b|wmic","out":"4712  svchost.exe  C:\\Users\\Public\\svchost.exe\nNote: the real svchost.exe lives in C:\\Windows\\System32 — this path is wrong."},{"goal":"Produce the SHA-256 digest of C:\\Users\\Public\\svchost.exe so the hash can be shared as an IOC.","re":"sha256sum|certutil|get-filehash|hashfile","out":"SHA256: 9f2c44b71a0d3e5c8f61b9a4d7e2c0f5a8b3d6e9c1f4a7b0d3e6f9a2c5b8d1e4"}]},"ex":"<p>Three steps turn 'odd port' into 'confirmed rogue binary': map the port to its PID (netstat -ano, ss -tulnp, lsof, or Get-NetTCPConnection), resolve the PID to a name and path (tasklist, ps, Get-Process), then hash the file (sha256sum, Get-FileHash, certutil -hashfile). The path is the verdict here: svchost.exe running from C:\\Users\\Public is masquerading — the genuine service host lives in System32 and is spawned by services.exe. The hash becomes the IOC you block and share. Choosing tools yourself under pressure is the real exam this objective tests.</p>","hints":["You need port → PID → process → hash, in that order.","Any standard tool per step is accepted — the grading looks for the right tool family, not one spelling."]},{"id":"H03","th":"host","t":"branch","pts":10,"lab":"CHOOSE YOUR NEXT STEP","sc":"<p>02:10, Corvus Health. EDR flags <span class='mono'>powershell.exe -enc JABzAD0A…</span> on CORV-APP02. A change ticket 'CHG-9931 approved maintenance' appears in the alert notes. Parent process: wscript.exe launched from %APPDATA%.</p>","q":"<p>The obvious reading is 'approved change'. Work the skeptical path.</p>","d":{"stages":[{"sc":"<p><b>Step 1.</b> The notes say a change ticket approves this. First move?</p>","ch":["Verify the ticket and pull the process lineage","Accept the verified ticket and close the alert","Ask the user politely to stop running scripts","Reboot the server to clear the alert"],"a":0,"fb":["Correct — attackers plant fake ticket numbers; verify both halves (paper trail and technical trail).","The ticket reference is unverified text inside an alert — exactly what a false alibi looks like."]},{"sc":"<p><b>Step 2.</b> CHG-9931 does not exist. Lineage: wscript.exe (%APPDATA%) → powershell -enc (decodes to: create local user svc_maint, add to Administrators). Verdict?</p>","ch":["Confirmed malicious — start the incident process","Wait to see if it repeats tomorrow","Only disable PowerShell for all users and move on","Delete the alert from the queue"],"a":0,"fb":["Right — a forged alibi plus account creation is an active intrusion, not policy friction.","'It might be nothing' is how intrusions age badly; the decoded command is decisive."]},{"sc":"<p><b>Step 3.</b> What is the best next hunting step?</p>","ch":["Hunt the estate for the -enc pattern and the account","Wait for the antivirus vendor's weekly opinion","Reimage CORV-APP02 from a golden image","Do nothing — one host is enough scope"],"a":0,"fb":["Correct — hunt the IOCs tenant-wide; encoded PowerShell and rogue accounts rarely stop at one host.","The intruder moves; your search must move first."]},{"sc":"<p><b>Step 4.</b> Containment priority?</p>","ch":["Isolate CORV-APP02, disable svc_maint, and preserve RAM first","Email all staff a general phishing warning","Power off the server immediately without capturing RAM","Ignore the alert if CPU usage stays low"],"a":0,"fb":["Correct — isolate, kill the rogue account, and keep volatile evidence alive (a powered-off host forgets everything).","Pulling the plug destroys the very memory artifacts that prove the case."]}]},"ex":"<p>Encoded PowerShell with a 'helpful' ticket number is a textbook false-alibi pattern: the alibi is the first thing to verify, and here it is forged. The decoded payload (local admin creation) is hands-on-keyboard intrusion behavior. Response: incident process, estate-wide hunt for the -enc pattern and the account, isolation with volatile evidence preserved. Keywords: LOLBins, encoded commands, validation, threat hunting.</p>","hints":["Alert annotations written by 'helpful' insiders are data, not truth — check the change system yourself.","An admin account created by a script is the payload; the encoded text is just delivery."]},{"id":"H04","th":"tools","t":"slots","pts":10,"lab":"DRAG EACH ARTIFACT TO ITS TACTIC","sc":"<p>Case CORV-INC-118 is ready for the ATT&CK-style mapping that goes to the CISO. Six artifacts, six tactics, one artifact per tactic.</p>","q":"<p>Place each artifact under the tactic it best represents.</p>","d":{"mode":"cat","bank":["New Run key pointing to %TEMP%\\update.exe","Windows Defender real-time protection turned off by a script","NTLM logons from one workstation to 14 servers within 5 minutes","Beacon every 90 s to a newly registered domain","1.9 GB of archives uploaded to a personal cloud drive","lsass.exe memory read by an unsigned process"],"slots":[{"lab":"Persistence","acc":[0]},{"lab":"Defense Evasion","acc":[1]},{"lab":"Lateral Movement","acc":[2]},{"lab":"Command and Control","acc":[3]},{"lab":"Exfiltration","acc":[4]},{"lab":"Credential Access","acc":[5]}]},"ex":"<p>Persistence = the Run key that survives reboots. Defense Evasion = killing the protection engine first. Lateral Movement = one identity spraying authenticated NTLM logons across 14 servers — machine-to-machine spread. Command and Control = the 90-second heartbeat to fresh infrastructure. Exfiltration = archives leaving to a personal cloud drive. Credential Access = reading lsass, where Windows caches credentials. The traps are temporal: the same binary can serve several tactics, so you anchor on the artifact's purpose — what did it achieve for the attacker? Reports use these tactic labels so hunting, detection, and executive briefings share one language.</p>","hints":["Ask what each artifact achieves: staying, hiding, spreading, talking home, stealing data, stealing credentials.","Reading lsass is about harvesting credentials, not about staying power."]},{"id":"H05","th":"email","t":"rows","pts":10,"lab":"CHOOSE ONE PER EMAIL","sc":"<p>Thursday. Three messages in the Corvus Health executive-protection queue. Company domain: corvus-health[.]example. Controls: SPF, DKIM, DMARC all enabled; DMARC policy is p=none.</p>","q":"<p>Choose the best action for each message.</p>","d":{"opts":["Escalate — strong phishing/BEC signs","Release — controls all passed","Release but tighten policy first"],"rows":[{"r":"<b>Mail 1</b> — From: 'M. Ferraro, CFO' &lt;m.ferraro@corvus-health[.]example&gt; · SPF pass · DKIM pass but signed by d=vendor-mail[.]example (does not match the From domain) · asks to approve an urgent bank change.","a":0},{"r":"<b>Mail 2</b> — Newsletter from vendor-list[.]example: SPF pass, DKIM pass (aligned), DMARC pass, links land on the vendor's real site.","a":1},{"r":"<b>Mail 3</b> — From: IT-Helpdesk &lt;helpdesk@corvus-hea1th-support[.]example&gt; · domain registered 3 days ago · link goes through a URL shortener · attachment 'portal-update.docm'.","a":0}]},"ex":"<p>Mail 1 is the hard one: SPF and DKIM both 'pass', but DKIM's signing domain (vendor-mail) is unrelated to the visible sender — DMARC alignment fails, so the message effectively impersonates your CFO with passing-looking controls. An urgent bank change on top makes it textbook BEC: escalate. Mail 2 passes with aligned signatures and real links — release. Mail 3 stacks four signals: a lookalike domain with a '1' for an 'l' (typo/homoglyph), 3-day-old registration, a shortener hiding the destination, and a macro document (.docm) — escalate. The lesson: pass is not pass — alignment is the part DMARC actually enforces, and p=none means your gateway will not save you.</p>","hints":["Mail 1: ask which domain the signature really vouches for.","Count the independent red flags in Mail 3 — one would be chance; four is a campaign."]},{"id":"H06","th":"net","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Corvus Health edge flow export, one day. Baselines: CORV-FS03 (file server) sends almost nothing outbound by design; backups run 02:00 to the internal backup net 10[.]18[.]40[.]10 under CHG-8801; replication is server-to-server internal.</p>","q":"<p>The 2.1 GB at 02:00 looks scary but matches the ticketed backup window. Select every line showing the abnormal transfer pattern that is the real finding.</p>","d":{"filter":true,"sel":true,"correct":[5,6,7,9],"lines":["02:00:01  CORV-FS03 → 10[.]18[.]40[.]10:445  TCP 2.1GB  (backup job, CHG-8801)","02:26:44  CORV-FS03 → 10[.]18[.]40[.]10:445  TCP 1.7GB  (backup cont.)","03:00:00  CORV-FS03 → 10[.]18[.]40[.]10:445  TCP 0.9GB  (backup cont.)","08:15:12  CORV-WS-2311 → 198[.]51[.]100[.]8:443  TCP 9MB  (browsing)","09:00:00  CORV-APP02 → 10[.]18[.]40[.]20:1433  TCP 140MB  (DB replication)","10:02:31  CORV-FS03 → 192[.]0[.]2[.]55:443  TCP 61MB","11:02:31  CORV-FS03 → 192[.]0[.]2[.]55:443  TCP 58MB","12:02:31  CORV-FS03 → 192[.]0[.]2[.]55:443  TCP 63MB","12:40:09  CORV-FS03 → 10[.]18[.]40[.]10:445  TCP 85MB  (user-initiated restore)","13:02:31  CORV-FS03 → 192[.]0[.]2[.]55:443  TCP 57MB","14:00:00  CORV-DC01 → 10[.]18[.]40[.]30:53  UDP 2KB  (DNS)","15:10:44  CORV-WS-0814 → 198[.]51[.]100[.]77:443  TCP 4MB  (browsing)"]},"ex":"<p>The real pattern: a file server that should push zero bytes outbound uploads ~60 MB every hour, on the hour, to one external host (192[.]0[.]2[.]55:443) — steady drip exfiltration sized to hide under alert thresholds. No single spike ever fires an alert, which is exactly the point: only the baseline makes the pattern visible. The 2.1 GB backup is bigger but legitimate: internal destination, documented change ticket, one window. Volume alone lies; destination and schedule tell the truth. Follow-ups: capture packets at the egress point, then examine what the archives contained.</p>","hints":["Ask of every large flow: to where, on whose schedule, documented by whom?","Hourly, on the hour, to one never-seen external IP — machines keep appointments."]},{"id":"H07","th":"host","t":"multi","pts":10,"lab":"SELECT ALL THAT APPLY","sc":"<p>Corvus Health, memory triage on CORV-WS-0814. Your senior warns: 'Explorer loads DLLs all day. Bring me proof of injection, not noise.'</p>","q":"<p>Select all artifacts that support a DLL-injection conclusion rather than a false positive.</p>","d":{"ch":["CreateRemoteThread from an unbacked memory region into explorer.exe","An unsigned DLL in %AppData% loaded by a signed application","The same suspicious module listed twice with two different load addresses","A Microsoft-signed DLL loaded from C:\\Windows\\System32","A .NET assembly loaded from the Global Assembly Cache"],"a":[0,1,2]},"ex":"<p>Proof of injection: a thread created remotely from memory no file backs (unbacked region = code that exists only in RAM); an unsigned DLL living in user-writable space (%AppData%) while being loaded by a trusted signed app (the classic sideload trick); and one module mapped twice at different addresses, which real loaders do not do. Signed DLLs from System32 and GAC assemblies are exactly how Windows normally works — the distractors are normal life. Injection verdicts need the writer (thread/create events), the payload (unsigned, wrong path), and the impossible artifact (double mapping) to agree.</p>","hints":["Ask who wrote the memory and where that memory comes from — file-backed or not?","Two load addresses for one module means someone re-mapped it behind the loader's back."]},{"id":"H08","th":"host","t":"slots","pts":10,"lab":"PUT THE STEPS IN ORDER","sc":"<p>Corvus Health IR runbook, memory-forensics branch. One step in the list is sabotage by a well-meaning intern.</p>","q":"<p>Order the memory-forensics workflow. One item belongs nowhere.</p>","d":{"mode":"seq","bank":["Capture RAM with a trusted, external tool before anything else","Hash the memory image to preserve integrity","List processes and network artifacts from the image","Dump the suspicious process memory","Scan the dump with signatures and strings","Defragment the disk"],"slots":[{"lab":"Step 1","acc":[0]},{"lab":"Step 2","acc":[1]},{"lab":"Step 3","acc":[2]},{"lab":"Step 4","acc":[3]},{"lab":"Step 5","acc":[4]}]},"ex":"<p>Order follows volatility and integrity: RAM first (it dies at power-off and malware lives there), then hashing the image so every later claim is provably about the same bytes, then the cheap wide pass (process lists, connections), then the surgical dump of the suspicious process, and finally deep scanning (signatures, strings, injection patterns). Defragmenting rewrites disk data and touches the evidence — it belongs nowhere near a live case. The runbook's order protects both the artifacts and the case's admissibility.</p>","hints":["What disappears forever at power-off? That goes first.","Integrity proof (hashing) happens before analysis, not after."]},{"id":"H09","th":"tools","t":"slots","pts":10,"lab":"COMPLETE THE RULE","sc":"<p>Corvus detection engineering review. The draft signature below must detect webshell probes under /uploads/ on the public web farm, case-insensitively, on established sessions only, and without flooding the console. Three fields are blank.</p>","q":"<p>Fill the three gaps so the rule behaves exactly as the requirement states.</p>","d":{"mode":"seq","seg":["<code>alert http $EXTERNAL_NET any → $HOME_NET [80,443] (msg:'CORV WEB possible webshell probe under /uploads/'; http.uri; content:'/uploads/'; ","; flow:",",to_server; ","; sid:10000231; rev:2;)</code>"],"bank":["nocase","offset","established","stateless","drop","threshold"],"slots":[{"lab":"content modifier","acc":[0]},{"lab":"flow state","acc":[2]},{"lab":"rule option","acc":[5]}]},"ex":"<p><b>nocase</b> makes the URI match case-insensitive — /Uploads/ must trip it too. <b>established</b> restricts matching to sessions that completed the handshake, cutting SYN-noise false positives. <b>threshold</b> limits how often the rule fires per time window — needed on a busy farm so one scanner does not flood the console. The action stays <b>alert</b> (already written): this is a detection rule; turning it into a blocking decision (drop) is a separate IPS policy with its own risk review. offset would narrow where the content may appear (wrong requirement), and stateless would weaken the flow check.</p>","hints":["'Case-insensitively' maps to one content modifier word.","'Established sessions only' is a flow keyword; 'do not flood the console' is a threshold."]},{"id":"H10","th":"net","t":"qcm","pts":10,"lab":"CHOOSE ONE","sc":"<p>03:00, Corvus Health. Flow monitoring flags CORV-FS07 pushing 2 GB outbound to one internal IP. Last month a host was exfiltrating at the same hour. There is a change ticket (CHG-8801) for a backup job to the new backup server, and the same transfer ran every weekday at 02:58–03:05 for three weeks — only after CHG-8801 was implemented.</p>","q":"<p>What is the correct disposition?</p>","d":{"ch":["Document and close as expected activity — it matches the ticketed, scheduled backup","Escalate as data exfiltration — large transfers at night are suspicious","Isolate the host immediately","Reimage the host and restore from backup"],"a":0},"ex":"<p>The obvious answer (night + big = exfil) is wrong because three facts agree on legitimacy: a change ticket names the job and destination, the transfer is internal (backup network), and the pattern started exactly when the change landed and repeats on schedule. Validation beats gut feeling: check the ticket, check the destination against the baseline, check the schedule's history. Documenting the closure with that evidence is what lets the next analyst trust the baseline — and keeps real exfiltration findings credible.</p>","hints":["How many independent sources confirm the job? Ticket, schedule history, destination.","Last month's incident is a bias trap — evidence for this flow is what counts."]},{"id":"H11","th":"tools","t":"rows","pts":10,"lab":"CHOOSE ONE DISPOSITION PER ALERT","sc":"<p>22:50, Corvus Health on-call. Six alerts, and you can feel two of them are the same story. Correlation window: 30 minutes. The canary host CORV-CANARY01 is a honeypot with a fake Finance share.</p>","q":"<p>Choose the best disposition for each alert. One option is for alerts that belong to the same investigation as another alert in this list.</p>","d":{"opts":["Link with another alert here and escalate as one incident","Escalate as a single incident of its own","Close as expected activity"],"rows":[{"r":"<b>A-01</b> — Honeypot share \\\\CORV-CANARY01\\Finance was listed (directory browse) from CORV-WS-0814.","a":0},{"r":"<b>A-02</b> — CORV-FS03: 40 files changed in 3 min (FIM alert); 12 min earlier, CORV-WS-0814 opened an SMB session to CORV-FS03\\Finance (Event 5140-ish network share access).","a":0},{"r":"<b>A-03</b> — svc_report logon from a country where Corvus runs no offices (impossible travel for the service account).","a":1},{"r":"<b>A-04</b> — Rogue device: unregistered MAC appeared on the clinical VLAN, not in the asset inventory.","a":1},{"r":"<b>A-05</b> — User account locked out 3 times after typing an old password (helpdesk confirms user on phone).","a":2},{"r":"<b>A-06</b> — Proxy log hit on a known C2 IP for CORV-WS-1188 (no other Corvus host touched it in 30 days).","a":1}]},"ex":"<p>A-01 + A-02 are one investigation: the same source host browsed the fake Finance share and then appeared at the real Finance server, where files started changing — honeypot reconnaissance followed by suspected staging, so link them and escalate as one case. A-03 (impossible travel on a service account) stands alone: stolen credentials in use. A-04: an unregistered device on the clinical VLAN is a rogue-device incident of its own (unknown provenance, regulated zone). A-05 has a human explanation confirmed by the helpdesk — close. A-06 is a clean, single-host C2 beacon: escalate alone. Correlation multiplies severity when artifacts point the same direction; human-confirmed noise stays noise.</p>","hints":["Which two alerts share a source host and a target within the correlation window?","Deception hits and credential anomalies escalate; helpdesk-confirmed lockouts close."]},{"id":"H12","th":"tools","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Corvus Health SIEM, saved search 'spray hunt — nightly'. It has been silent for weeks even though password spraying is common in the sector. A colleague asks why it never fires.</p>","q":"<p>Select every line of the query that contains a logic bug causing misses (false negatives).</p>","d":{"filter":true,"sel":true,"correct":[2,3,6],"lines":["// nightly hunt — detect password spraying on the domain","search index=main sourcetype=wineventlog EventCode=4625 earliest=-24h","    | stats count by AccountName","    | where count &gt; 100","    | sort -count","    | table TargetUserName count","    | sendalert severity=info","    | top limit=10 TargetUserName","// end of saved search"]},"ex":"<p>Three bugs make the hunt blind. First, <span class='mono'>stats count by AccountName</span> groups on the wrong field — 4625 events carry the tried account in TargetUserName, so AccountName is empty and every group collapses. Second, <span class='mono'>where count &gt; 100</span> demands over a hundred failures per account, but spraying deliberately sends only 2–5 attempts per account to dodge lockouts — the threshold is tuned for brute force, not spraying. Third, filing a hit as <span class='mono'>severity=info</span> buries a confirmed attack under informational noise. The sort/table/top lines are cosmetic. Detection engineering fails quietly: a query that runs without errors can still see nothing.</p>","hints":["Which field name does Event 4625 really use for the account that failed?","Spraying sends few attempts per account — what does that do to a 'more than 100' threshold?"]},{"id":"H13","th":"tools","t":"slots","pts":10,"lab":"DRAG EACH CONTROL TO ITS FAMILY","sc":"<p>Corvus Health is buying deception and analytics tooling. The procurement sheet mixes vendor marketing; you re-sort it by what each control actually is.</p>","q":"<p>Place every control into its family.</p>","d":{"mode":"cat","bank":["Unused /27 subnet monitored for any packet at all","Decoy web server with a fake patient portal on the DMZ","Fake service-account API key committed to a repo, alert on use","Decoy database table of fabricated PII, alert on any SELECT","Flag when an account behaves outside its peer-group baseline","Alert when a server that never uses VPN connects via VPN at 03:00"],"slots":[{"lab":"Darknet / network decoys","acc":[0,1]},{"lab":"Honeytokens (data decoys)","acc":[2,3]},{"lab":"Behavioral analytics (UEBA)","acc":[4,5]}]},"ex":"<p>Network decoys are places nothing legitimate reaches: dead address space (the darknet pattern — every packet is a probe) and a fake portal that only scanners and curious intruders touch. Honeytokens are fake data with zero business use: the planted API key and the fabricated PII table — their only job is to scream when used, which makes them high-fidelity tripwires for stolen secrets. UEBA learns peer-group and time baselines and flags deviation: the HR peer group never scans, the server never VPNs at 03:00. The boundary test: is it a place (network), a piece of data (honeytoken), or a learned pattern of people and accounts (UEBA)?</p>","hints":["'Any packet here is suspicious by definition' describes dead address space.","Fake data that exists only to trigger = honeytoken; learned normal-vs-not = UEBA."]},{"id":"H14","th":"host","t":"branch","pts":10,"lab":"CHOOSE YOUR NEXT STEP","sc":"<p>Corvus Health, 01:30. CORV-FS03 shows a logon type 3 (network) from CORV-WS-0814 using CORV\\svc_backup. Your lead asks the questions below, one at a time.</p>","q":"<p>Answer each decision point.</p>","d":{"stages":[{"sc":"<p><b>Step 1.</b> The 4624 type-3 logon could be routine backup traffic. What turns it into strong evidence of remote admin tooling?</p>","ch":["A port-445 hit plus a net use admin$ command from that host","The same logon repeating once more, two hours later","A 4624 success always proves tooling by itself","Nothing more is needed to confirm the case"],"a":0,"fb":["Correct — connection + command-line artifacts give the logon a method and a motive.","Repetition shows schedule, not capability; a bare 4624 proves access, not tooling."]},{"sc":"<p><b>Step 2.</b> Event 7045 on CORV-FS03: service 'PSEXESVC' created from CORV-WS-0814. Meaning?</p>","ch":["PsExec-style remote execution from the workstation","A Windows update service installing itself","A backup agent reinstalling after an upgrade","A normal printer service being restarted"],"a":0,"fb":["Right — PSEXESVC is the service PsExec installs the moment it runs remotely.","The service name pattern and the remote creation source identify the tool."]},{"sc":"<p><b>Step 3.</b> Containment choice?</p>","ch":["Disable the account, then isolate both hosts","Power off the whole rack at the PDU","Nothing until the morning shift arrives","Unplug the internet line at the edge"],"a":0,"fb":["Correct — kill the identity, cut both ends of the movement, keep hosts up for forensics.","Rack-wide power-off destroys evidence across every machine at once."]},{"sc":"<p><b>Step 4.</b> Scope check before declaring the blast radius?</p>","ch":["Query all hosts for type-3 logons and PSEXESVC","Only re-check CORV-FS03 tonight","Ask users if anything feels slow today","Assume it is just these two hosts"],"a":0,"fb":["Right — hunt the source's reach everywhere; PsExec leaves the same 7045 fingerprint on every target.","Assumptions about blast radius are always too small."]}]},"ex":"<p>Building a lateral-movement case: a bare 4624 shows access, but the corroborating pair — a 445 connection and a net use admin$ command line — proves method (SMB admin shares). PSEXESVC in 7045 names the tool. Containment kills the account and isolates both ends while keeping machines running for evidence. Scoping re-queries the estate for the same fingerprints. Keywords: lateral movement, SMB admin shares, Event 7045, PsExec, scoping.</p>","hints":["Corroboration = at least two independent artifact types pointing the same way.","PsExec installs its own service on every target it touches."]},{"id":"H15","th":"tools","t":"term","pts":10,"lab":"TYPE THE COMMANDS","sc":"<p>Corvus triage console. The suspicious file C:\\triage\\svcupdate.dll came off CORV-FS03. You must ship two artifacts to the intel team. No tool is prescribed.</p>","q":"<p>Complete both objectives in the terminal, choosing your own commands.</p>","d":{"ps":"CORV-SRV-TRIAGE>","boot":["Corvus analysis console","File under analysis: C:\\triage\\svcupdate.dll (suspicious)","Type help to list objectives."],"tasks":[{"goal":"Produce the SHA-256 digest of svcupdate.dll for IOC sharing.","re":"sha256sum|certutil|get-filehash|hashfile","out":"SHA256: 4b1d9ea7c3f2085d6e1a9b4c7f0d2e5a8b3c6f9d1e4a7b0c3f6d9e2a5b8c1f4d"},{"goal":"Extract the printable strings so URLs and config data inside the file become visible.","re":"\\bstrings\\b|select-string","out":"hxxps://cdn-c_[.]example/gate\nSeDebugPrivilege\ncmd.exe /c schtasks /create /tn SysHeal /sc onlogon\nMozilla/4.0 (compatible)\n… (42 more strings)"}]},"ex":"<p>Two static techniques, zero execution risk: hashing (sha256sum, Get-FileHash, certutil -hashfile) produces the fingerprint the team can block and share, and strings (or Select-String on raw bytes) surfaces embedded text — here a C2 URL, a privilege name, and a schtasks command that predicts persistence behavior before you ever detonate anything. Static analysis first is the discipline: cheap, safe, and it aims the dynamic analysis that follows.</p>","hints":["One command family digests files; another prints readable text from binaries.","The intel team wants a hash they can blocklist and indicators they can hunt."]},{"id":"H16","th":"net","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Resolver log for CORV-WS-2311, morning. The environment legitimately uses long CDN hostnames, so length alone proves nothing. The zone dgram-drop[.]example was first seen in passive DNS two days ago.</p>","q":"<p>Select the lines that show real DNS tunneling rather than normal CDN traffic.</p>","d":{"filter":true,"sel":true,"correct":[1,3,5,7],"lines":["09:01:02  10[.]10[.]31[.]4  A     images[.]cdn-partner[.]example → 198[.]51[.]100[.]8","09:01:05  10[.]10[.]31[.]4  TXT   a2f9c1be77d0a4b1e3c5f8a9b2c4d6e7f0a1b3c5d7e9f2a4b6c8d0e2f4a6[.]dgram-drop[.]example","09:01:09  10[.]10[.]31[.]4  A     static[.]vendor[.]example → 198[.]51[.]100[.]9","09:02:44  10[.]10[.]31[.]4  TXT   c4d6e8f0a2b4c6d8e0f2a4c6e8d0b2a4c6e8f0a2c4e6d8f0a2c4e6d8f0a2c4e[.]dgram-drop[.]example","09:03:01  10[.]10[.]31[.]4  A     mail[.]corvus-health[.]example → 10[.]18[.]40[.]5","09:05:17  10[.]10[.]31[.]4  TXT   e6f8a0c2e4a6c8e0f2a4c6e8d0f2a4b6d8f0a2c4e6a8c0e2f4a6c8e0f2a4c6[.]dgram-drop[.]example → NXDOMAIN","09:06:00  10[.]10[.]14[.]9  A     portal[.]corvus-health[.]example → 10[.]18[.]40[.]6","09:07:22  10[.]10[.]31[.]4  TXT   f0a2c4e6a8c0e2f4a6c8e0f2a4c6e8d0f2a4b6d8f0a2c4e6a8c0e2f4a6c8e0f[.]dgram-drop[.]example","09:08:44  10[.]10[.]31[.]4  A     fonts[.]vendor[.]example → 198[.]51[.]100[.]8","09:11:31  10[.]10[.]14[.]23 A     cdn[.]long-name-for-js-library[.]vendor[.]example → 198[.]51[.]100[.]8","09:12:02  10[.]10[.]31[.]4  A     www[.]corvus-health[.]example → 10[.]18[.]40[.]5","09:15:00  10[.]10[.]31[.]9  A     portal[.]corvus-health[.]example → 10[.]18[.]40[.]6"]},"ex":"<p>Four tells separate tunneling from the long-but-legitimate CDN names: the record type is TXT (data channel, not address lookup), the labels are fixed-length base32/hex chunks (encoded payload, not readable hostnames), they all target one never-seen zone, and the sequence is machine-steady with NXDOMAINs when chunks go missing. The CDN lines are long but human-readable and point to real address records. DNS tunneling verdicts need type + shape + destination + rhythm to agree — any one alone is arguable; together they are a tunnel.</p>","hints":["Legitimate resolvers rarely ask for TXT records in bulk.","Compare the label shapes: readable words versus fixed-length encoded blocks."]},{"id":"H17","th":"host","t":"slots","pts":10,"lab":"FILL THE REPORT","sc":"<p>Corvus Health incident report, draft for the regulator. The analysis conclusions are fixed; the wording must be exact, because near-synonyms change the meaning.</p>","q":"<p>Fill the four gaps with the precise terms.</p>","d":{"mode":"seq","seg":["<b>CORV-INC-118 — technical summary.</b> Memory triage shows executable, file-unbacked memory inside a signed system process — strong evidence of code "," rather than process hollowing, because the original image stayed intact. Callbacks repeat every 90 seconds with about 12% ",", which is typical controller behavior. Before upload, documents were "," into 7z archives in %TEMP%. The sample hash was added to the proxy "," and shared with the sector threat-intelligence group."],"bank":["injection","hollowing","jitter","timeout","staged","deleted","blocklist","allowlist"],"slots":[{"lab":"memory technique","acc":[0]},{"lab":"rhythm term","acc":[2]},{"lab":"file handling","acc":[4]},{"lab":"where hashes live","acc":[6]}]},"ex":"<p>Unbacked executable memory with the original image intact is <b>injection</b> (code written into a live process); hollowing would replace the process image — the intact image is the discriminator. The 12% variation around a 90-second callback is <b>jitter</b>, deliberately breaking perfect periodicity to defeat signature detection. Archives created in %TEMP% before upload is <b>staging</b> — data gathered and packaged, not yet exfiltrated. Blocking infrastructure goes on a <b>blocklist</b> (an allowlist is the opposite concept). Reports fail audits on exactly these word choices.</p>","hints":["Hollowing replaces the image; what is it called when new code is added alongside?","Beat frequency that wobbles on purpose has a name in beacon traffic."]},{"id":"H18","th":"host","t":"qcm","pts":10,"lab":"CHOOSE ONE","sc":"<p>Domain controller logs, Corvus Health: 3–5 failed logons (4625) for each of roughly 400 different accounts, spread over 4 business hours, single source IP, zero account lockouts, two successes on weak-password accounts at hour three.</p>","q":"<p>Which technique does this pattern identify?</p>","d":{"ch":["Password spraying — few attempts per many accounts","Brute force against a single privileged account","Credential stuffing with previously breached pairs","A hardware fault flooding the security log"],"a":0},"ex":"<p>The fingerprint is the ratio: few attempts × many accounts × one source = spraying, engineered to stay under lockout policies (hence zero lockouts) and to trade success rate for covertness — the two successes prove the method works. Brute force would hammer one account until lockout. Credential stuffing replays known username/password pairs, which shows as scattered one-attempt successes rather than a uniform spray. Hardware faults do not pick 400 usernames. The response is source blocking, forced resets on the sprayed accounts, and a hunt for those two successful logons' next moves.</p>","hints":["Count attempts per account versus accounts per source.","Zero lockouts is not luck — it is design."]},{"id":"H19","th":"host","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Sysmon export, CORV-FS03. AV software legitimately injects into processes, so not every cross-process thread is hostile. One process here pretends to be something it is not.</p>","q":"<p>Select every line proving the Temp 'svchost' is fake and is injecting into another process.</p>","d":{"filter":true,"sel":true,"correct":[1,3,5],"lines":["01:14:02  EID 1   services.exe → svchost.exe -k netsvcs · Image: C:\\Windows\\System32\\svchost.exe (legitimate)","01:22:31  EID 1   WINWORD.EXE → svchost.exe -k update · Image: C:\\Windows\\Temp\\svchost.exe","01:22:33  EID 7   ImageLoad dwmapi.dll into explorer.exe (graphics, normal)","01:22:40  EID 8   CreateRemoteThread: C:\\Windows\\Temp\\svchost.exe → explorer.exe (thread start outside any image)","01:22:41  EID 8   CreateRemoteThread: MsMpEng.exe → C:\\Windows\\Temp\\svchost.exe (signed AV, documented injection)","01:23:02  EID 3   Network: C:\\Windows\\Temp\\svchost.exe → 192[.]0[.]2[.]55:443 TLS established","01:23:10  EID 1   cmd.exe /c ipconfig /renew","01:25:00  EID 5   Process terminated: notepad.exe","01:26:12  EID 1   chrome.exe → chrome.exe (renderer child, normal)","01:30:44  EID 11  FileWrite %TEMP%\\~df2.tmp","01:31:03  EID 4   Sysmon service state changed (policy update)","01:40:00  EID 1   explorer.exe → notepad.exe"]},"ex":"<p>Line 2 is the masquerade: a 'svchost' whose image path is %Windows%\\Temp and whose parent is a word processor — the genuine one lives in System32 with services.exe as parent. Line 4 is the injection: CreateRemoteThread from that fake binary into explorer.exe with a thread start outside any mapped image. Line 6 closes the case: the same fake process opens its own TLS channel to the beacon infrastructure. The AV line (MsMpEng) is the trap — signed, documented, expected injection. Parent-path-parent triplet plus cross-process thread plus self-initiated network is the hollowing/masquerade triad that memory triage then confirms.</p>","hints":["Compare image path and parent for each 'svchost' against the genuine first line.","CreateRemoteThread from the fake process — and then that process phones home."]},{"id":"H20","th":"host","t":"slots","pts":10,"lab":"DRAG EACH BEHAVIOR TO ITS PHASE","sc":"<p>Corvus Health malware-behavior workshop. One sample's report is cut into behaviors; you map them to the phases analysts use when briefing.</p>","q":"<p>Place every behavior into its phase.</p>","d":{"mode":"cat","bank":["Macro-enabled invoice.docm attached to an email","Drops payload to %APPDATA% and adds a Run key","Creates a scheduled task via schtasks /create","HTTPS check-ins every 60 s to an unknown domain","7z archives staged then uploaded to a file-sharing site","Clears the Windows Security event log"],"slots":[{"lab":"Delivery & execution","acc":[0]},{"lab":"Persistence","acc":[1,2]},{"lab":"Command and Control","acc":[3]},{"lab":"Exfiltration","acc":[4]},{"lab":"Covering tracks","acc":[5]}]},"ex":"<p>The macro document is delivery and execution — the lure that starts everything. Both the Run key and the scheduled task are persistence: two mechanisms, same goal (survive reboot), and mapping both shows the analyst expects redundancy. The 60-second HTTPS rhythm is command and control. Staged archives leaving to a file-sharing site are exfiltration. Log clearing is covering tracks — it usually happens when discovery risk appears, and it is itself a high-value alert (Event 1102). Phase mapping turns a behavior list into a story the CISO and the hunters can both use.</p>","hints":["Two items survive reboots — both are persistence.","Deleting evidence is its own phase, not cleanup."]},{"id":"H21","th":"tools","t":"slots","pts":10,"lab":"RANK BY INVESTIGATION PRIORITY","sc":"<p>Corvus Health risk board, Monday triage. Six hosts, two analysts, one week. Facts only — you decide the order.</p>","q":"<p>Rank the hosts from highest to lowest investigation priority.</p>","d":{"mode":"seq","bank":["CORV-DC01 — domain controller beaconing to 192[.]0[.]2[.]55 every 75 s","CORV-VPN01 — internet-facing VPN appliance, actively exploited vendor CVE, unpatched","CORV-WS-2311 — laptop whose credentials appeared on a paste site 2 days ago","CORV-FS07 — retired file server, still online, holds old HR data, unpatched 8 months","CORV-DEV03 — dev VM with an outdated test stack, isolated lab network"],"slots":[{"lab":"Priority 1","acc":[0]},{"lab":"Priority 2","acc":[1]},{"lab":"Priority 3","acc":[2]},{"lab":"Priority 4","acc":[3]},{"lab":"Priority 5","acc":[4]}]},"ex":"<p>The domain controller beacons — compromise at the credential heart of the domain outranks everything. The VPN appliance is an internet-facing, actively exploited, unpatched edge: probable entry point, so it is next. The paste-site laptop means live credentials to rotate and watch — real but contained to one identity. The retired server holds sensitive data on an unpatched box: data-breach exposure without active-compromise evidence. The isolated dev VM is an outdated lab stack with no path to production data. Ranking weighs exposure × impact × evidence of active compromise; the beacon on a DC beats a patched-later edge device only because compromise is confirmed, not hypothetical.</p>","hints":["Confirmed compromise beats probable compromise; probable beats possible.","Regulated data on a forgotten box is risk, but the DC beacon is an active incident."]},{"id":"H22","th":"net","t":"rows","pts":10,"lab":"CHOOSE ONE TECHNIQUE PER ROW","sc":"<p>Corvus Health weekly protocol-anomaly review. Five findings from different segments; each matches exactly one technique below.</p>","q":"<p>Match each observation to the technique it most likely indicates.</p>","d":{"opts":["DNS-over-HTTPS evasion of monitoring","ICMP covert channel / tunneling","Legacy protocol exposure","Remote-access tunneling to attacker infrastructure","Compromised device sending mail"],"rows":[{"r":"<b>Obs 1</b> — Browser traffic to new domains with no corresponding DNS queries on the corporate resolver.","a":0},{"r":"<b>Obs 2</b> — ICMP echo requests of ~1,400 bytes every 30 s from one host to a single external IP.","a":1},{"r":"<b>Obs 3</b> — SMB1 negotiation attempts from a legacy warehouse terminal.","a":2},{"r":"<b>Obs 4</b> — RDP session from a finance workstation to a personal-VPS provider address range.","a":3},{"r":"<b>Obs 5</b> — SMTP AUTH bursts from the warehouse printer at 02:00.","a":4}]},"ex":"<p>No visible DNS lookups before new-domain browsing means resolution happened inside the HTTPS stream — DoH evasion that blinds the resolver logs you rely on. Large, rhythmic ICMP payloads are a covert channel: ping should carry tens of bytes, not payload-sized packets on a schedule. SMB1 negotiation from an unmaintained terminal is legacy exposure — an obsolete, attackable dialect still speaking on the network. Workstation RDP to a VPS provider is remote-access tunneling — someone built a personal backdoor. A printer authenticating SMTP at volume is a compromised device (printers ship with weak defaults and full network trust). Protocol analysis = knowing each protocol's normal shape and spotting the deviation.</p>","hints":["Where did the DNS go if the browser resolved a name? Ask what encrypts lookups.","Printers do not email; terminals should not speak SMB1 in 2025."]},{"id":"H23","th":"net","t":"branch","pts":10,"lab":"CHOOSE YOUR NEXT STEP","sc":"<p>Corvus Health, 03:40. CORV-FS03: 1.9 GB of 7z archives appeared in %TEMP% over two hours and flowed outbound. A second implant is suspected on the same VLAN. The on-call lead asks the decisions below.</p>","q":"<p>Choose the response path that preserves evidence and avoids tipping off a watching attacker.</p>","d":{"stages":[{"sc":"<p><b>Step 1.</b> First action on the staging discovery?</p>","ch":["Hash the archives; capture the exfil destination","Format %TEMP% to clear the malware now","Tell users to reboot their machines","Wait for the attacker to finish the job"],"a":0,"fb":["Correct — hashes and destinations are the evidence chain and the IOCs you will block.","Deleting or waiting both destroy either the evidence or the window to act."]},{"sc":"<p><b>Step 2.</b> Flow data shows uploads to a personal cloud drive (192[.]0[.]2[.]55) every 20 minutes. Exfil path?</p>","ch":["HTTPS uploads to personal cloud storage","Printer spooling to a local queue","Email attachments to partners","DNS zone transfers to a second site"],"a":0,"fb":["Right — server-to-cloud uploads on a timer are the path; the rest do not match the flows.","The path determines the block: egress filtering to that destination."]},{"sc":"<p><b>Step 3.</b> Containment that keeps evidence and does not alert a possible second implant?</p>","ch":["Block the destination at the proxy, capture RAM, isolate","Post the incident in the general chat channel","Power off the file server right away","Delete the archives from %TEMP% first"],"a":0,"fb":["Correct — cut the exfil path first (no data leaves, no noise), preserve volatile memory, then isolate the host.","A power-off destroys memory evidence; a channel announcement can trigger the second implant to burn and hide."]},{"sc":"<p><b>Step 4.</b> After containment?</p>","ch":["Notify IR and legal, preserve custody, scope the estate","Delete the alert to keep the metrics clean","Reopen the office for a full sweep","Do nothing else until tomorrow morning"],"a":0,"fb":["Right — regulated data + exfiltration = notification duties and formal handover; scoping starts now.","Metric hygiene is not a reason to erase an incident record."]}]},"ex":"<p>Exfiltration response is a sequencing problem: confirm staging (hashes + destination), identify the path (timed HTTPS uploads to personal cloud), then cut the path at the egress point before the host is touched — blocking the destination quiets the transfer without the noise of an isolation action that a second implant might notice. RAM capture before any power change, chain of custody from the first hash, playbook notification, and estate-wide scoping for the suspected second implant. Keywords: containment ordering, exfiltration path, evidence preservation.</p>","hints":["What leaves first: your notification noise, or the attacker's data? Cut the data line quietly.","Once a host powers off, its memory story is gone forever."]},{"id":"H24","th":"tools","t":"qcm","pts":10,"lab":"CHOOSE ONE","sc":"<p>Sandbox report for a Corvus sample: no network activity, no persistence, no file drops; the process exited cleanly after 40 seconds. The submitting analyst marked it 'clean'.</p>","q":"<p>What is the analytically correct next step?</p>","d":{"ch":["Re-detonate with internet, a longer window, and memory capture","Accept the 'clean' verdict and close the ticket","Delete the sample from the sandbox","Restore the affected host from backup"],"a":0},"ex":"<p>Modern malware checks for analysis environments: no network, short clock, sandbox artifacts — and then does nothing, exactly what this report shows. A 40-second clean exit from a suspicious submission is itself a signal of sandbox evasion or a dormant trigger (time-bomb, first-reboot check). The correct move re-runs the experiment with the missing variables: internet egress (for C2), a longer window (for delayed triggers), and memory capture (for unpacked code that never touches disk). Closing as clean validates the attacker's evasion; restore-from-backup answers a problem you do not have yet.</p>","hints":["Ask what the sample did NOT get: internet, time, memory inspection.","'Did nothing' inside a fishbowl is behavior — learn from it."]},{"id":"H25","th":"app","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Corvus Health public portal, HTTP log excerpt. One source (198[.]51[.]100[.]58) mixes probe traffic with one legitimate download it fetched later.</p>","q":"<p>Select every line showing an exploited or malformed request (injection, traversal, or a dangerous method). The benign download of a real file must stay unselected.</p>","d":{"filter":true,"sel":true,"correct":[1,2,4,6],"lines":["03:11:02  198[.]51[.]100[.]23  \"GET /index.html HTTP/1.1\" 200","03:14:44  198[.]51[.]100[.]58  \"POST /api/login HTTP/1.1\" 500  body: {\"u\":\"admin'--\",\"p\":\"x\"}","03:14:47  198[.]51[.]100[.]58  \"POST /api/login HTTP/1.1\" 200  body: {\"u\":\"admin' OR 1=1--\",\"p\":\"x\"}","03:20:02  10[.]10[.]31[.]4  \"GET /portal/home HTTP/1.1\" 200","03:26:19  198[.]51[.]100[.]58  \"GET /download?file=..%2f..%2f..%2fetc%2fpasswd HTTP/1.1\" 200 91102","03:30:00  10[.]10[.]31[.]9  \"GET /assets/app.js HTTP/1.1\" 200","03:34:51  198[.]51[.]100[.]58  \"TRACE / HTTP/1.1\" 200 — response echoes request headers including the session cookie","03:41:12  198[.]51[.]100[.]77  \"GET /wp-admin HTTP/1.1\" 404 0","03:52:08  198[.]51[.]100[.]58  \"GET /download?file=handbook.pdf HTTP/1.1\" 200 240112","04:00:00  10[.]10[.]31[.]4  \"GET /health HTTP/1.1\" 200 8","04:12:33  198[.]51[.]100[.]58  \"GET /search?q=cars HTTP/1.1\" 200 12003","04:30:01  198[.]51[.]100[.]77  \"GET /phpmyadmin HTTP/1.1\" 404 0"]},"ex":"<p>Line 2 injects <span class='mono'>admin'--</span> into a JSON field (500 = the syntax broke the query); line 3 replays it as a tautology and gets 200 — the login bypassed, an input-validation failure in production. Line 5 is path traversal: encoded <span class='mono'>../../../etc/passwd</span> returned 91 KB, so the app served a file outside its web root. Line 7 uses TRACE, a debugging method that should be disabled, and the echoed headers expose the session cookie — credential theft by reflection. The later handbook.pdf download uses the same parameter legitimately (a real file, expected size) — the trap line. Same parameter, different payload: the payload decides guilt.</p>","hints":["Decode the percent-encoding in the download parameter before judging it.","A 500 followed by a 200 on the same login field is probe-then-success."]},{"id":"H26","th":"host","t":"rows","pts":10,"lab":"CHOOSE ONE PER FINDING","sc":"<p>Corvus Health software-inventory review. Change control: all installs need a ticket or the approved Self-Service Portal; WSUS handles vendor updates in maintenance windows.</p>","q":"<p>Decide each finding.</p>","d":{"opts":["Investigate as unauthorized software","Accept as approved change"],"rows":[{"r":"<b>F-1</b> — 7-Zip 24.08 installed with local admin rights on an accounting workstation, 23:47, no ticket, user has no admin role.","a":0},{"r":"<b>F-2</b> — Chrome update installed via WSUS during the documented maintenance window.","a":1},{"r":"<b>F-3</b> — TeamViewer appeared on CORV-APP02 (a server) at 02:10; install log shows a silent install; no ticket.","a":0},{"r":"<b>F-4</b> — VS Code installed through the approved Self-Service Portal on a developer laptop.","a":1}]},"ex":"<p>F-1: a user without admin rights somehow elevated to install software after hours — the finding is less the 7-Zip than the impossible privilege; investigate. F-2: WSUS-pushed vendor updates inside a documented window are the change process working. F-3 is the highest-severity pattern here: silent remote-access tooling appearing on a server at night with no ticket — classic attacker access path, investigate with IR-level urgency. F-4 flows through the sanctioned portal — approved. Unauthorized-software review is really privilege-and-schedule review: who could install, and when did they claim to?</p>","hints":["Ask two questions per row: who had the rights, and does the time fit any approved window?","Remote-access tools on servers after midnight are rarely helpful neighbors."]},{"id":"H27","th":"tools","t":"slots","pts":10,"lab":"PUT THE RESPONSE PHASES IN ORDER","sc":"<p>Corvus Health tabletop after-action item: new analysts kept reordering the incident-response workflow. Fix the wall chart.</p>","q":"<p>Order the workflow. One item belongs nowhere.</p>","d":{"mode":"seq","bank":["Triage and enrich the alert","Scope: find every affected host and account","Contain: isolate systems and block attacker infrastructure","Eradicate: remove persistence and rebuild what cannot be trusted","Recover: restore services and verify against the baseline","Lessons learned: document and improve detections","Pay the ransom and move on"],"slots":[{"lab":"Phase 1","acc":[0]},{"lab":"Phase 2","acc":[1]},{"lab":"Phase 3","acc":[2]},{"lab":"Phase 4","acc":[3]},{"lab":"Phase 5","acc":[4]},{"lab":"Phase 6","acc":[5]}]},"ex":"<p>The workflow enforces logic: triage/enrich (what is true?) → scope (how big is it? — you cannot contain what you have not found) → contain (stop the bleeding: isolation, IOC blocks) → eradicate (remove persistence, rebuild untrusted systems — before recovery, or you re-deploy the attacker) → recover and verify against the baseline (prove normal is normal) → lessons learned, which hardens detections so the same attack dies earlier. 'Pay the ransom' is a business decision that lives outside the technical workflow and belongs nowhere on the wall chart.</p>","hints":["Eradication before recovery — otherwise you rebuild the infection with the system.","What you have not scoped, you cannot contain."]},{"id":"H28","th":"email","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Corvus Health mail-gateway configuration export. Company domain: corvus-health[.]example. An attacker has been testing lookalike domains in your logs for two weeks.</p>","q":"<p>Select every line that is a policy gap an attacker could abuse.</p>","d":{"filter":true,"sel":true,"correct":[2,4,5,6],"lines":["inbound_tls: require (reject plaintext SMTP)","spf_hardfail: reject","spf_softfail: accept and deliver to inbox","dkim: verify signatures","dmarc: p=none; aggregate reports to dmarc-reports@[internal]","attachment_block: *.exe only (macros, scripts, archives allowed)","display_name_check: off — no lookalike-domain screening","url_rewrite: enabled at click time","quarantine_digest: daily to users"]},"ex":"<p>Four gaps chain into one attack path. spf_softfail accepted: softfail is literally 'probably forged' — accepting it hands spoofing a free pass. DMARC p=none: you monitor abuse but enforce nothing, so aligned spoofing of your own domain reaches inboxes. Attachment blocking of .exe only: the entire modern threat kit — macro documents, .js, .lnk, archives — walks past. display_name_check off: no screen catches 'Corvus Hea1th' lookalikes despite two weeks of attacker rehearsal. The other lines are sound controls (required TLS, hardfail rejection, DKIM verification, click-time URL rewriting, user digests). Policy review reads configs as an attacker would: which line is the door?</p>","hints":["Softfail and p=none share a theme: detection without enforcement.","One file-type rule blocks the 1990s threat — what about the 2020s kit?"]},{"id":"H29","th":"tools","t":"rows","pts":10,"lab":"CHOOSE ONE PER ALERT","sc":"<p>Corvus Health deception telemetry, Saturday. Three alerts from planted traps. Baseline: honeytokens have no legitimate use; the darknet watch lists cover paste sites, spam traps, and leak forums.</p>","q":"<p>Choose the correct handling for each alert.</p>","d":{"opts":["Investigate immediately — proves use of a planted secret or bait","Monitor only — reputation signal, not confirmed intrusion","Ignore as noise"],"rows":[{"r":"<b>T-1</b> — The AWS honeykey (planted in a private repo) was used from 198[.]51[.]100[.]9, an unrecognized ASN.","a":0},{"r":"<b>T-2</b> — Decoy file 'Passwords_2026.xlsx' on CORV-FS01 was opened by an internal account.","a":0},{"r":"<b>T-3</b> — Darknet watch: the company mail domain appeared on a spam-trap list.","a":1}]},"ex":"<p>T-1: a planted key that should be impossible to use was used from unknown infrastructure — that is proof the repo leaked and someone tried the loot; investigate immediately and rotate every secret in that repo. T-2: the fake password file has no business value and no legitimate reader — someone is crawling shares for credentials; investigate (the account that opened it is either the intruder or already compromised). T-3: landing on a spam-trap list means some host is sending mail the internet does not like — a reputation and hygiene signal worth monitoring and checking for an internal mailer, but not proof of intrusion. Deception alerts inherit the fidelity of the trap; external reputation signals do not.</p>","hints":["Ask: does legitimate work ever touch this trap? If never, use = intrusion evidence.","A spam-trap listing says something about your sending reputation, not necessarily your crown jewels."]},{"id":"H30","th":"host","t":"multi","pts":10,"lab":"SELECT ALL THAT APPLY","sc":"<p>Corvus Health, crash-dump triage for a COTS service that crashed after a malformed upload. The dump excerpts are below; your lead wants only memory-corruption evidence.</p>","q":"<p>Select all lines that support a buffer-overflow attempt.</p>","d":{"ch":["Access violation 0xC0000005 executing a non-executable (DEP-protected) page","Structured Exception Handling chain overwritten with 0x41414141","Stack security cookie (/GS) corrupted — 0xCCCCCCCC terminator found mid-stack","Printer driver not found (event 1111)","Pagefile smaller than recommended (event 49)"],"a":[0,1,2]},"ex":"<p>Three independent corruption markers: executing a DEP page means code tried to run where only data may live (the overflow landed in the wrong place — DEP stopped it); a SEH chain full of 0x41414141 ('AAAA') means the exception-handler linked list was overwritten by input — the classic pre-DEP exploit path; and a smashed /GS stack cookie means the stack canary that guards return addresses was trampled. Any one is suspicious; all three mean someone deliberately overfilled a buffer. Driver and pagefile events are capacity noise that plagues dumps — ignore them. Memory-corruption evidence lives in violation codes, overwritten structures, and failed canaries.</p>","hints":["0x41414141 is 'AAAA' — attacker-controlled filler, not a system value.","Which events describe memory misuse, and which describe resource sizing?"]}];

function gradeEx(i){
  var ex=EX[i],d=ex.d,a=S.ans[i],L=S.layout[i];
  var els=[],got=[],want=[],refs=[],okc=0,tot=0,den=0,t,j,k;
  function push(st,g,w,ref){els.push({st:st,ref:(ref===undefined?null:ref)});got.push(g);want.push(w);if(st==="ok")okc++;}
  if(ex.t==="qcm"){
    den=1;
    var pos=(typeof a==="number")?a:-1,ok=pos>=0&&L.perm[pos]===d.a;
    push(ok?"ok":(pos>=0?"bad":"miss"),pos>=0?stripHtml(d.ch[L.perm[pos]]):"—",stripHtml(d.ch[d.a]));
  }else if(ex.t==="multi"){
    den=d.a.length;
    var sel={};(a||[]).forEach(function(p){sel[p]=true;});
    L.perm.forEach(function(orig,pos){
      if(d.a.indexOf(orig)>=0){push(sel[pos]?"ok":"miss",sel[pos]?stripHtml(d.ch[orig]):"(not selected)",stripHtml(d.ch[orig]),orig);}
      else if(sel[pos]){push("bad",stripHtml(d.ch[orig]),"(should not be selected)",orig);}
    });
  }else if(ex.t==="rows"){
    den=d.rows.length;
    d.rows.forEach(function(r,k2){
      var p=(a&&a[k2]>=0)?a[k2]:-1,ok=p>=0&&L.perm[p]===r.a;
      push(ok?"ok":(p>=0?"bad":"miss"),p>=0?stripHtml(d.opts[L.perm[p]]):"—",stripHtml(d.opts[r.a]),k2);
    });
  }else if(ex.t==="slots"){
    if(d.mode==="seq"){
      den=d.slots.length;
      d.slots.forEach(function(sl,k2){
        var arr=(a&&a[k2])||[],p=arr.length?arr[0]:-1,orig=p>=0?L.bank[p]:-1,ok=p>=0&&sl.acc.indexOf(orig)>=0;
        push(ok?"ok":(p>=0?"bad":"miss"),p>=0?stripHtml(d.bank[orig]):"—",stripHtml(d.bank[sl.acc[0]]),k2);
      });
    }else{
      den=0;d.slots.forEach(function(sl){den+=sl.acc.length;});
      var where={};
      d.slots.forEach(function(sl,k2){((a&&a[k2])||[]).forEach(function(p){where[L.bank[p]]=k2;});});
      d.slots.forEach(function(sl,k2){
        sl.acc.forEach(function(orig){
          var w=(where[orig]===undefined)?-1:where[orig];
          push(w===k2?"ok":(w>=0?"bad":"miss"),stripHtml(d.bank[orig]),stripHtml(sl.lab),orig);
        });
      });
      d.slots.forEach(function(sl,k2){((a&&a[k2])||[]).forEach(function(p){var orig=L.bank[p];
        if(d.slots.every(function(s2){return s2.acc.indexOf(orig)<0;})&&els.every(function(e){return e.ref!==orig;})){
          push("bad",stripHtml(d.bank[orig]),"(belongs in no slot)",orig);}});});
    }
  }else if(ex.t==="logview"){
    den=d.correct.length;
    var sel2={};(a||[]).forEach(function(x){sel2[x]=true;});
    d.correct.forEach(function(ci){push(sel2[ci]?"ok":"miss",sel2[ci]?("Line "+(ci+1)):("Line "+(ci+1)+" not selected"),shortLine(d.lines[ci]),ci);});
    (a||[]).forEach(function(ci){if(d.correct.indexOf(ci)<0){push("bad","Line "+(ci+1),"(not a target line)",ci);}});
  }else if(ex.t==="term"){
    den=d.tasks.length;
    d.tasks.forEach(function(tk,k2){
      var ok=!!(a&&a.done[k2]);
      var c="—";
      if(ok&&(a&&a.hist)){for(j=a.hist.length-1;j>=0;j--){if(a.hist[j].ti===k2&&a.hist[j].ok){c=a.hist[j].c;break;}}}
      push(ok?"ok":"miss",ok?("command: "+c):"—",tk.goal,null);
    });
  }else if(ex.t==="branch"){
    den=d.stages.length;
    d.stages.forEach(function(sg,k2){
      var p=(a&&a[k2]>=0)?a[k2]:-1,ok=p>=0&&L.stages[k2][p]===sg.a;
      push(ok?"ok":(p>=0?"bad":"miss"),p>=0?stripHtml(sg.ch[L.stages[k2][p]]):"—",stripHtml(sg.ch[sg.a]),k2);
    });
  }
  tot=Math.max(els.length,1);
  return {els:els,got:got,want:want,score:den?ex.pts*okc/den:0,max:ex.pts,okc:okc,den:den};
}

/* log line syntax highlighting — only applied to plain-text lines */
function hlLog(raw){
  if(/[<>]|&/.test(raw))return raw;   /* markup or entities: insert as authored */
  var s=esc(raw);
  s=s.replace(/(^|\s)((?:\d{1,2}:)?\d{2}:\d{2}(?::\d{2})?)(?=\s)/g,'$1<span class="hl-t">$2</span>');
  s=s.replace(/(\d{1,3}(?:\[\.\]\d{1,3}){3})/g,'<span class="hl-ip">$1</span>');
  s=s.replace(/\b(EID|Event|EventCode)\s?(\d{3,4})\b/g,'<span class="hl-eid">$1 $2</span>');
  s=s.replace(/\b(GET|POST|PUT|DELETE|HEAD|OPTIONS|TRACE|PATCH)\b/g,'<span class="hl-verb">$1</span>');
  s=s.replace(/&quot; (\d{3}) /g,'&quot; <span class="hl-s2">$1</span> ');
  s=s.replace(/&quot; (\d{3})$/gm,'&quot; <span class="hl-s2">$1</span>');
  s=s.replace(/\b(4\d\d|5\d\d)\s+\d{1,6}\b/g,'<span class="hl-s4">$1</span>');
  return s;
}

      var st=mark?elState(res,function(e){return e.ref===li;}):"";
      var sel=(a||[]).indexOf(li)>=0;
      h+='<div class="ln '+(mark?st:(sel?"sel":""))+'" data-line="'+li+'" '+(d.filter?'data-s="'+esc(l.toLowerCase())+'"':"")+(d.sel?' role="button" tabindex="0" aria-pressed="'+sel+'" data-act="linepick"':"")+'>'+(d.sel?'<span class="mk">'+(mark?(st==="ok"?"✓":st==="bad"?"✕":"⚠"):(sel?"◉":"○"))+'</span>':"")+'<span>'+hlLog(l)+'</span></div>';
    });
    h+='</div>'+(d.sel&&mark?'<p class="mono" style="color:#94a3b8">✓ selected &amp; correct · ✕ selected &amp; wrong · ⚠ correct line you missed</p>':"");
  }else if(ex.t==="term"){
    h+='<div class="term" id="termout"></div><div class="termrow"><span class="ps">'+esc(d.ps)+'&nbsp;</span><input type="text" id="tmin" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command input" '+(mark?"disabled":"")+'></div>';
  }else if(ex.t==="branch"){
    var arr=a||d.stages.map(function(){return -1;});
    var upto=mark?d.stages.length:Math.min(d.stages.length,arr.some(function(v){return v>=0;})?(firstUnanswered(arr)+1):1);
    for(k=0;k<upto;k++){
      var sg=d.stages[k],st=mark?res.els[k].st:"";
      p=(a&&a[k]>=0)?a[k]:-1;
      var corrPos2=L.stages[k].indexOf(sg.a);
      h+='<div class="stage"><div class="stagelab">STEP '+(k+1)+' OF '+d.stages.length+'</div>'+sg.sc;
      L.stages[k].forEach(function(orig,pos){
        var cls="choice "+(mark?(pos===p?(orig===sg.a?"ok":"bad"):(pos===corrPos2&&p>=0?"miss":"")):(p===pos?"sel":""));
        var dis=(mark||p>=0)?"":" data-act=\"stage\" data-stage=\""+k+"\" data-pos=\""+pos+"\"";
        h+='<div class="'+cls+'"'+dis+' role="button" tabindex="0"><span>'+sg.ch[orig]+'</span></div>';
      });
      if(mark){h+='<div class="outcome '+(st==="ok"?"good":"bad")+'">'+(st==="ok"?"✓ <span>Correct.</span>":"✕ <span>Best next step: <b>"+sg.ch[sg.a]+"</b></span>")+'</div>';}
      else if(p>=0){var o2=L.stages[k][p];h+='<div class="outcome '+(o2===sg.a?"good":"bad")+'">'+(o2===sg.a?"✓":"✕")+' <span>'+(sg.fb&&sg.fb[o2]?sg.fb[o2]:(o2===sg.a?"Good choice — continue.":"Not the best next step."))+'</span></div>';}
      h+='</div>';
    }
    if(!mark&&upto<d.stages.length){h+='<p class="mono" style="color:#94a3b8">'+(d.stages.length-upto)+' more step(s) unlock as you answer.</p>';}
  }
  return h;
}
function firstUnanswered(arr){for(var k=0;k<arr.length;k++){if(arr[k]<0)return k;}return arr.length-1;}
function hintHTML(i){
  var hs=EX[i].hints||[],h="",k;
  for(k=0;k<(S.hints[i]||0)&&k<hs.length;k++){h+='<div class="hintbox">🔔 <b>Hint '+(k+1)+':</b> '+hs[k]+'</div>';}
  return h;
}

/* ---------------- feedback panel ---------------- */
function fbHTML(i){
  var ex=EX[i],r=S.graded[i];
  var hp=Math.round(HINTPCT*ex.pts*(S.hints[i]||0)*10)/10;
  var earned=Math.max(0,r1(r.score-hp));
  var lab=(earned>=r.max-0.001)?"full":(earned>0?"partial":"zero");
  var tag='<span class="tag '+(lab==="full"?"ok":(lab==="partial"?"warn":"bad"))+'">'+(lab==="full"?"✓ full":(lab==="partial"?"◐ partial":"✕ zero"))+'</span>';
  var h='<div class="fb"><div class="sum">'+tag+' You earned <b>'+earned+' / '+r.max+'</b> points on this exercise.'+(hp?' <span class="tag warn">includes −'+hp+' hint cost</span>':"")+'</div><div>';
  r.els.forEach(function(e,k){
    h+='<div class="themeline"><span class="tag '+e.st+'">'+(e.st==="ok"?"✓":(e.st==="bad"?"✕":"⚠"))+" "+STXT[e.st]+'</span> Your answer: <b>'+esc(r.got[k])+'</b>'+(e.st!=="ok"?' — correct: <b>'+esc(r.want[k])+'</b>':"")+'</div>';
  });
  h+='</div><div class="explain">'+ex.ex;
  if(lab!=="full"){h+='<p><b>Focus next:</b> redo this exercise type and revise the keywords listed on the intro screen.</p>';}
  h+='</div></div>';
  return h;
}

/* ---------------- interactions ---------------- */
function ensure(i){if(S.ans[i]===undefined)S.ans[i]=defAns(i);}
function placeItem(i,slot,p){
  var ex=EX[i],arr=S.ans[i];
  for(var k=0;k<arr.length;k++){                 /* an item lives in at most one slot */
    var ix=arr[k].indexOf(p);
    if(ix>=0&&k!==slot)arr[k].splice(ix,1);
  }
  if(ex.d.mode==="seq"){arr[slot]=[p];}
  else{if(arr[slot].indexOf(p)<0)arr[slot].push(p);}
  S.picked=null;
}
function removeItem(i,slot,p){var arr=S.ans[i][slot],ix=arr.indexOf(p);if(ix>=0)arr.splice(ix,1);}
function doCheck(){
  if(!S||S.done)return;
  var i=exAt(S.cur),ex=EX[i];
  ensure(i);
  var res=gradeEx(i);
  S.graded[i]=res;S.checked[i]=true;delete S.skip[i];S.picked=null;
  S.earned[i]=Math.max(0,r1(res.score-HINTPCT*ex.pts*(S.hints[i]||0)));
  S.pauseC=true;
  renderExam();updateHUD();
}
function doSkip(){if(!S||S.done)return;var i=exAt(S.cur);if(!S.checked[i])S.skip[i]=true;goNext();}
function doHint(){
  if(!S||S.done)return;var i=exAt(S.cur),ex=EX[i],hs=ex.hints||[];
  if(S.hints[i]>=hs.length)return;
  S.hints[i]=(S.hints[i]||0)+1;
  if(S.checked[i]){S.earned[i]=Math.max(0,r1((S.graded[i]?S.graded[i].score:0)-HINTPCT*ex.pts*S.hints[i]));}
  renderExam();updateHUD();
}
function doRevise(){if(!S||S.done)return;var i=exAt(S.cur);S.checked[i]=false;delete S.graded[i];delete S.earned[i];renderExam();}
function leaveEx(){/* leaving the current exercise always ends its review pause */
  S.pauseC=false;S.picked=null;
}
function goNext(){if(!S||S.done)return;leaveEx();if(S.cur<EX.length-1){S.cur++;renderExam();updateHUD();}else{askFinish();}}
function goPrev(){if(!S||S.done)return;leaveEx();if(S.cur>0){S.cur--;renderExam();updateHUD();}}
function goTo(k){if(!S||S.done)return;if(k===S.cur)return;leaveEx();S.cur=k;renderExam();updateHUD();}
function doPause(){if(!S||S.done)return;S.pauseM=!S.pauseM;lastTick=Date.now();renderExam();}
function openNav(){var p=$("#navp");if(p)p.hidden=!p.hidden;updateHUD();}
function showConfirm(html){var m=document.createElement("div");m.className="modal";m.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(m);}
function closeModal(){var m=$(".modal");if(m)m.remove();}
function askFinish(){
  var nC=0,nA=0,nS=0;
  EX.forEach(function(_,ix){if(S.checked[ix])nC++;else if(hasAns(ix))nA++;if(S.skip[ix])nS++;});
  showConfirm('<h2>Submit the exam?</h2><p>Checked: <b>'+nC+'</b> · Answered but not checked: <b>'+nA+'</b> (graded as they are now) · Skipped: <b>'+nS+'</b> (excluded from scoring).</p><p class="mono" style="color:#94a3b8">Skipped exercises are removed from both the points and the denominator.</p><div class="actions"><button class="primary" data-act="finish">Submit now</button><button data-act="closeModal">Keep working</button></div>');
}
function doFinish(auto){
  if(S&&S.done)return;
  closeModal();
  var n=EX.length,tot=0,got=0,anyNonSkip=false;
  for(var k=0;k<n;k++){
    var ix=exAt(k),ex=EX[ix];
    var answered=S.checked[ix]||hasAns(ix);
    if(S.skip[ix]||!answered){S.skip[ix]=true;continue;}
    anyNonSkip=true;
    if(!S.checked[ix]){var res=gradeEx(ix);S.graded[ix]=res;S.checked[ix]=true;S.earned[ix]=Math.max(0,r1(res.score-HINTPCT*ex.pts*(S.hints[ix]||0)));}
    tot+=ex.pts;got+=S.earned[ix];
  }
  if(!anyNonSkip||tot===0){
    showConfirm('<h2>Cannot submit yet</h2><p>⚠ All exercises are skipped. Answer at least one exercise before submitting.</p><div class="actions"><button data-act="closeModal">Back to the exam</button></div>');
    return;
  }
  S.done=true;S.auto=!!auto;S.finalGot=r1(got);S.finalTot=tot;S.pauseM=false;S.pauseC=false;
  render();
}
function renderResults(){
  var got=S.finalGot,tot=S.finalTot;
  var scoreI=Math.round(got),totI=Math.round(tot);
  var pct=totI?Math.round(scoreI/totI*100):0,passed=pct>=PASSMARK;
  var nSk=0;EX.forEach(function(_,ix){if(S.skip[ix])nSk++;});
  var rows="";
  for(var k=0;k<EX.length;k++){
    var ix=exAt(k),ex=EX[ix],sk=!!S.skip[ix];
    var lab,max=ex.pts,en=S.checked[ix]?(S.earned[ix]||0):0;
    if(sk){lab='<span class="tag warn">⏭ skipped — not counted</span>';}
    else{lab=(en>=max-0.001)?'<span class="tag ok">✓ full</span>':((en>0)?'<span class="tag warn">◐ partial</span>':'<span class="tag bad">✕ zero</span>');}
    var ansTxt="—";
    if(!sk&&S.graded[ix]){
      var r=S.graded[ix];
      ansTxt=r.els.map(function(e,q){
        var t=STXT[e.st]+": "+r.got[q];
        if(e.st!=="ok")t+=" → correct: "+r.want[q];
        return t;
      }).join(" · ");
    }
    rows+='<tr><td>'+(k+1)+'</td><td>'+esc(THEMES[ex.th])+'</td><td>'+lab+'</td><td>'+(sk?"—":en+" / "+max)+'</td><td>'+esc(ansTxt)+'</td><td><details class="exp"><summary>Explanation</summary><div class="explain">'+ex.ex+'</div></details></td></tr>';
  }
  var panel=passed?'<div class="passpanel"><h2>🎉 PASS — certificate panel</h2><p>Congratulations'+(S.user?", "+esc(S.user):"")+'! You reached <b>'+pct+'%</b> (pass mark '+PASSMARK+'%).</p><p class="mono">CyberPulse Academy · '+esc(META.title)+' · '+new Date().toLocaleDateString()+'</p></div>':'<div class="failpanel"><h2>✕ FAIL — retake needed</h2><p>You reached <b>'+pct+'%</b>, below the '+PASSMARK+'% pass mark. You must retake this exam.</p><div class="actions"><button class="primary" data-act="retake">Retake exam</button></div></div>';
  var h='<div class="hero"><h1>Results — '+esc(META.title)+'</h1><div class="bigres">'+pct+'%</div>'+
  '<p>'+r1(got)+' points earned out of '+r1(tot)+' possible ('+nSk+' skipped and excluded).</p>'+panel+
  '<h2>Per-exercise report</h2><div style="overflow-x:auto"><table class="rep"><thead><tr><th>#</th><th>Theme</th><th>Result</th><th>Points</th><th>Your answers</th><th>Learn</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div class="actions"><button class="primary" data-act="retake">Retake exam</button></div></div>';
  $("#app").innerHTML=h;
  if(!S.fired){S.fired=true;reportScore(scoreI,totI);}
}
function reportScore(correct,total){
  var percent=Math.round((correct/total)*100);
  try{
    parent.postMessage({type:"CYBERPULSE_SCORE",topicId:TOPIC,score:correct,total:total,percent:percent,passed:percent>=PASSMARK},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}

/* ---------------- terminal ---------------- */
function termRender(i){
  var d=EX[i].d,a=S.ans[i],out=$("#termout");
  if(!out)return;
  if(!a){a={hist:[],done:[]};S.ans[i]=a;}
  if(!a.hist)a.hist=[];
  var h="";
  d.boot.forEach(function(b){h+='<div class="tl sys">'+esc(b)+'</div>';});
  (a.hist||[]).forEach(function(m){
    h+='<div class="tl cmd">'+esc(d.ps+" "+m.c)+'</div>';
    if(m.o)h+='<div class="tl '+esc(m.cls||"")+'">'+m.o+'</div>';
  });
  if(a.hist&&a.hist.length&&!a.hist[a.hist.length-1].o){h+='<div class="tl err">'+esc("No pending objective matches that command. Type help to list objectives.")+'</div>';}
  out.innerHTML=h;out.scrollTop=out.scrollHeight;
}
function termExec(i,cmd){
  var d=EX[i].d,a=S.ans[i];
  if(!cmd)return;
  if(cmd==="clear"){a.hist=[];termRender(i);return;}
  a.hist.push({c:cmd,o:null});
  if(cmd==="help"||cmd==="?"){
    var o=d.tasks.map(function(tk,k2){return (a.done[k2]?"[done] ":"[pending] ")+tk.goal;}).join("\n");
    a.hist[a.hist.length-1]={c:cmd,o:esc("Objectives:\n"+o),cls:"sys"};
  }else{
    var doneOne=false;
    for(var k2=0;k2<d.tasks.length;k2++){
      if(a.done[k2])continue;
      if(new RegExp(d.tasks[k2].re,"i").test(cmd)){a.done[k2]=true;a.hist[a.hist.length-1]={c:cmd,o:esc(d.tasks[k2].out)+"\n✓ objective "+(k2+1)+" complete",cls:"sys",ti:k2,ok:true};doneOne=true;break;}
    }
  }
  termRender(i);
}

/* ---------------- wiring ---------------- */
function wireEx(i){
  var ex=EX[i];
  if(ex.t==="term"){
    var inp=$("#tmin");
    termRender(i);
    if(inp&&!inp.disabled){
      inp.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"){var v=inp.value.trim();inp.value="";termExec(i,v);}
      });
      setTimeout(function(){try{inp.focus();}catch(e){}},50);
    }
  }
  if(ex.t==="logview"&&ex.d.filter){
    var fl=$("#flt");
    if(fl)fl.addEventListener("input",function(){
      var q=fl.value.toLowerCase();
      $all("#lns .ln").forEach(function(l){l.hidden=q?!l.getAttribute("data-s").includes(q):false;});
    });
  }
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el)return;
  var act=el.getAttribute("data-act");
  if(!S)return;
  var i=exAt(S.cur);
  /* after Check the answer is locked — only Revise can unlock it */
  if(S.started&&!S.done&&S.checked[i]&&["pick","bpick","unpick","spick","linepick","stage"].indexOf(act)>=0)return;
  FOCUSD=selFromEl(el);
  if(act==="start"){S.started=true;lastTick=Date.now();render();return;}
  if(act==="pick"){
    ensure(i);
    var pos=+el.getAttribute("data-pos");
    if(EX[i].t==="qcm"){S.ans[i]=pos;}
    else{var arr=S.ans[i],ix=arr.indexOf(pos);if(ix>=0)arr.splice(ix,1);else arr.push(pos);}
    renderExam();return;
  }
  if(act==="bpick"){
    ensure(i);
    var p=+el.getAttribute("data-pos");
    if(S.picked&&S.picked.i===i&&S.picked.pos===p){S.picked=null;}else{S.picked={i:i,pos:p};}
    renderExam();return;
  }
  if(act==="unpick"){
    ensure(i);
    var sl=el.closest(".slot");
    if(sl)removeItem(i,+sl.getAttribute("data-slot"),+el.getAttribute("data-pos"));
    renderExam();return;
  }
  if(act==="spick"){
    ensure(i);
    var sl2=+el.getAttribute("data-slot");
    if(S.picked&&S.picked.i===i){placeItem(i,sl2,S.picked.pos);}
    renderExam();return;
  }
  if(act==="linepick"){
    ensure(i);
    var li=+el.getAttribute("data-line"),arr2=S.ans[i],ix2=arr2.indexOf(li);
    if(ix2>=0)arr2.splice(ix2,1);else arr2.push(li);
    renderExam();return;
  }
  if(act==="stage"){
    ensure(i);
    S.ans[i][+el.getAttribute("data-stage")]=+el.getAttribute("data-pos");
    renderExam();return;
  }
  if(act==="check"){doCheck();return;}
  if(act==="skip"){doSkip();return;}
  if(act==="hint"){doHint();return;}
  if(act==="revise"){doRevise();return;}
  if(act==="next"){goNext();return;}
  if(act==="prev"){goPrev();return;}
  if(act==="pause"){doPause();return;}
  if(act==="openNav"){openNav();return;}
  if(act==="navq"){goTo(+el.getAttribute("data-k"));return;}
  if(act==="askFinish"){askFinish();return;}
  if(act==="finish"){doFinish(false);return;}
  if(act==="closeModal"){closeModal();return;}
  if(act==="retake"){S=newState();S.started=true;lastTick=Date.now();render();return;}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(!el.getAttribute)return;
  if(!S||S.done)return;
  var act=el.getAttribute("data-act");
  var i=exAt(S.cur);
  if(act==="opt"&&!S.checked[i]){
    ensure(i);
    S.ans[i][+el.getAttribute("data-row")]=+el.value;
  }
  if(act==="pick"&&!S.checked[i]&&(EX[i].t==="qcm"||EX[i].t==="multi")){
    /* keyboard arrow selection on radios fires change without click */
    ensure(i);
    var pos=+el.getAttribute("data-pos");
    if(EX[i].t==="qcm"){S.ans[i]=pos;}
    else{var arr=S.ans[i],ix=arr.indexOf(pos);if(ix>=0)arr.splice(ix,1);else arr.push(pos);}
    FOCUSD=selFromEl(el);
    renderExam();updateHUD();
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){closeModal();return;}
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.getAttribute){
    var da=ev.target.getAttribute("data-act");
    if(da&&["INPUT","SELECT","TEXTAREA","A"].indexOf(ev.target.tagName)<0&&ev.target.tagName!=="BUTTON"){
      ev.preventDefault();ev.target.click();
    }
  }
});
document.addEventListener("dragstart",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act='bpick'],[data-act='unpick']"):null;
  if(el){ev.dataTransfer.setData("text/plain",el.getAttribute("data-pos"));ev.dataTransfer.effectAllowed="move";}
});
document.addEventListener("dragover",function(ev){
  var s=ev.target.closest?ev.target.closest(".slot"):null;
  if(s){ev.preventDefault();s.classList.add("over");}
});
document.addEventListener("dragleave",function(ev){
  var s=ev.target.closest?ev.target.closest(".slot"):null;
  if(s)s.classList.remove("over");
});
document.addEventListener("drop",function(ev){
  var s=ev.target.closest?ev.target.closest(".slot"):null;
  if(!s)return;
  ev.preventDefault();s.classList.remove("over");
  var i=exAt(S.cur);ensure(i);
  var dp=ev.dataTransfer.getData("text/plain");
  if(!S.picked&&dp!==""){S.picked={i:i,pos:+dp};}
  if(S.picked&&S.picked.i===i){placeItem(i,+s.getAttribute("data-slot"),S.picked.pos);renderExam();}
});

/* ---------------- timer ---------------- */
setInterval(function(){
  var now=Date.now();
  if(!S||!S.started||S.done){lastTick=now;return;}
  if(S.pauseM||S.pauseC){lastTick=now;updateHUD();return;}
  var dt=Math.floor((now-lastTick)/1000);
  if(dt>0){S.left=Math.max(0,S.left-dt);lastTick=now;}
  updateHUD();
  if(S.left<=0){doFinish(true);}
},400);

/* ---------------- site handshake + boot ---------------- */
window.addEventListener("message",function(ev){
  var d=ev.data;
  if(!d)return;
  if(d.type!=="CYBERPULSE_INIT"&&d.type!=="CYBERMASTERY_INIT")return;
  if(S&&d.username){S.user=d.username;}
  var g=$("#greet");
  if(g&&d.username)g.textContent="Ready, "+d.username+" — the score is reported only at the results screen.";
});
S=newState();
var __booted=false;
function __boot(){if(__booted)return;__booted=true;render();}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",__boot);}
else{__boot();}

</script>
</body>
</html>
