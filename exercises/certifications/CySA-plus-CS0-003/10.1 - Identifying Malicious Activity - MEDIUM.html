correct:[0,1,0,2,3],
hint:"Which alert shows a machine already talking to an attacker? That one cannot wait for a ticket.",
exp:"<p><b>AL-4411</b> — a machine beaconing every 60 s is likely already compromised and talking to a C2 server. This is an incident-response case, not a normal ticket.</p><p><b>AL-4412</b> — heavy failed logons from one IP are a brute-force attempt. Block the IP, check if any account gave in, and work a ticket.</p><p><b>AL-4413</b> — the same user signing in from two continents ten minutes apart is impossible travel. The identity is probably stolen, so escalate.</p><p><b>AL-4414</b> — the EPP quarantined the file and nothing executed. Verify with the user and keep watching, but no fire.</p><p><b>AL-4415</b> — a games website is a policy matter, not malicious activity. Dismiss after a note.</p>"},
{"id":"M02","t":"fib","title":"Wireshark — show me the suspect traffic","pts":2,
kw:["Wireshark","Display & BPF filters","Packet capture (pcap)","SPAN port / TAP"],
th:["Network Traffic & Packet Analysis"],
scn:"You have a capture file from the SPAN port on the finance switch. WS-114 talked to a suspect host and you must isolate that conversation in Wireshark.",
art:[{l:"Capture file",h:"<pre class='log'>file: office-span01.pcap (18 min, taken from the SPAN port)\nsuspect peer: 203[.]0[.]113[.]44 (TLS + a few DNS queries)</pre>"}],
q:"Complete the workflow — pick the right term for each blank.",
text:"To see only packets between WS-114 and the suspect host, type the display filter <code>[[0]]</code>. To read the whole conversation in order, right-click a packet and choose <code>[[1]]</code>. To hide noise and see only name lookups, add the filter <code>[[2]]</code>.",
blanks:["ip.addr == 203[.]0[.]113[.]44","Follow &gt; TCP Stream","dns"],
bank:["ip.addr == 203[.]0[.]113[.]44","Follow &gt; TCP Stream","dns","ip.addr != 203[.]0[.]113[.]44","Follow &gt; UDP Stream","http","tcp.port == 21"],
hint:"One filter keeps only that IP. One menu entry rebuilds the stream. One protocol name filters DNS.",
exp:"<p><code>ip.addr == 203[.]0[.]113[.]44</code> keeps packets where that IP is source or destination. The <code>!=</code> version does the opposite.</p><p><b>Follow &gt; TCP Stream</b> rebuilds one connection in order — perfect for reading a session. UDP Stream would not follow a TCP flow.</p><p><code>dns</code> is the display filter for DNS traffic. <code>http</code> would hide the lookups you want.</p><p>Note: in the real tool you type the IP without the [.] marks — they are added here as a safety habit.</p>"},
{"id":"M03","t":"multi","title":"WHOIS says a lot in ten lines","pts":2,
kw:["WHOIS","Domain age & creation date","Registrar & WHOIS privacy","Newly registered domains"],
th:["DNS & Domain Analysis"],
scn:"Phishing mails point users to <code>secure-login-portal[.]example</code>. Before blocking, you pull the registration record.",
art:[{l:"WHOIS output",h:"<pre class='log'>Domain Name: secure-login-portal[.]example\nRegistrar: CheapDomains2Day, LLC\nCreated Date: 2026-09-28T04:11:07Z\nUpdated Date: 2026-09-28T04:11:07Z\nRegistry Expiry Date: 2027-09-28\nName Server: ns1.cloud-host[.]example\nName Server: ns2.cloud-host[.]example\nRegistrant Organization: REDACTED FOR PRIVACY\nRegistrant Country: PA</pre>"}],
q:"Select every real red flag in this record. Today is 2026-10-13.",
opts:["The domain was created 15 days ago","The registrant identity is hidden behind a privacy service","The domain uses two name servers","The registrar is an accredited company"],
correct:[0,1],
hint:"Two of the four lines describe something almost every normal domain has.",
exp:"<p><b>Created 15 days ago</b> — a very young domain age is a classic phishing sign: attackers register, use, and drop domains fast.</p><p><b>REDACTED FOR PRIVACY</b> — privacy redaction is legal and common, but on a fresh domain it hides who is behind the phishing page. Together with the age it is a real flag.</p><p><b>Two name servers</b> — normal. Domains need at least two for reliability.</p><p><b>Accredited registrar</b> — normal. Cheap registrars are popular with criminals, but accreditation itself is not a flag.</p>"},
{"id":"M04","t":"terminal","title":"Ask DNS directly about the suspect domain","pts":2,
kw:["dig","nslookup","DNS record types (A, MX, TXT, NS)","DNS logs"],
th:["DNS & Domain Analysis"],
scn:"DNS logs show WS-231 resolving <code>update-service[.]example</code> every 10 minutes. You want the A record from your jump host.",
art:[{l:"DNS log excerpt",h:"<pre class='log'>09:02:11  WS-231  A    update-service[.]example  →  203[.]0[.]113[.]99\n09:12:11  WS-231  A    update-service[.]example  →  203[.]0[.]113[.]99</pre>"}],
q:"Use a <code>dig</code> command to query the <b>A record</b> of <code>update-service[.]example</code>. Type it in the terminal, press <b>Run</b>, then <b>Check</b>.",
term:{banner:"lab-jump-01 — DNS troubleshooting\nExpected output shape:\n  ;; ANSWER SECTION:\n  update-service[.]example. 300  IN  A  203[.]0[.]113[.]99\n(real consoles use plain dots — the [.] marks are a written safety habit)",
prompt:"analyst@lab-jump-01:~$",placeholder:"dig <domain> <record-type>"},
accept:["^dig\\b.*update-service\\.example","^nslookup\\b.*update-service\\.example","^host\\b.*update-service\\.example"],
acceptShow:"dig update-service.example A\nnslookup update-service.example\nhost update-service.example",
out:";; ANSWER SECTION:\nupdate-service[.]example. 300  IN  A  203[.]0[.]113[.]99\n\n;; Query time: 22 msec\n;; WHEN: Mon Oct 13 09:14:02 2026",
hint:"The family is <code>dig</code>: <code>dig &lt;domain&gt; &lt;record-type&gt;</code>. <code>nslookup</code> or <code>host</code> are accepted too.",
exp:"<p><code>dig update-service.example A</code> asks for the IPv4 address record. The tool name was given, so the reasoning is about the record type: an A record maps a name to an IPv4 address. <code>nslookup</code> and <code>host</code> do the same job and are accepted.</p><p>Why it matters: the answer (203[.]0[.]113[.]99) becomes an IoC you can block, and repeated lookups from one host become a detection.</p>"},
{"id":"M05","t":"multi","title":"Web access log — what do you flag?","pts":2,
kw:["Web server access logs","Log analysis","URL analysis"],
th:["Log Analysis & SIEM"],
scn:"You review last night's access log of the public web server. Filter it to work faster.",
log:{l:"Web server access log (excerpt)",lines:[
'203[.]0[.]113[.]10 - - [13/Oct/2026:01:02:11 +0000] "GET /index.html HTTP/1.1" 200 5312 "-" "Mozilla/5.0"',
'203[.]0[.]113[.]10 - - [13/Oct/2026:01:02:14 +0000] "GET /style.css HTTP/1.1" 200 812 "-" "Mozilla/5.0"',
'198[.]51[.]100[.]23 - - [13/Oct/2026:03:11:01 +0000] "GET /index.php?id=1 HTTP/1.1" 200 4310 "-" "Mozilla/5.0"',
'198[.]51[.]100[.]23 - - [13/Oct/2026:03:11:04 +0000] "GET /index.php?id=1%27%20OR%20%271%27=%271 HTTP/1.1" 200 4310 "-" "Mozilla/5.0"',
'198[.]51[.]100[.]23 - - [13/Oct/2026:03:12:40 +0000] "GET /../../../etc/passwd HTTP/1.1" 400 210 "-" "Mozilla/5.0"',
'198[.]51[.]100[.]23 - - [13/Oct/2026:03:13:02 +0000] "POST /search.php HTTP/1.1" 200 1180 "-" "sqlmap/1.6.12"',
'203[.]0[.]113[.]150 - - [13/Oct/2026:04:40:11 +0000] "POST /upload/avatar.php HTTP/1.1" 200 342 "-" "Mozilla/5.0"',
'203[.]0[.]113[.]10 - - [13/Oct/2026:05:01:09 +0000] "GET /favicon.ico HTTP/1.1" 404 209 "-" "Mozilla/5.0"',
'203[.]0[.]113[.]12 - - [13/Oct/2026:05:03:33 +0000] "GET /products.html HTTP/1.1" 200 7320 "-" "Mozilla/5.0"']},
filter:true,
q:"Select every request pattern you should flag in the incident ticket.",
opts:["The directory traversal attempt for /etc/passwd","The SQL injection probe in the id= parameter (' OR '1'='1)","The sqlmap scanner user agent POSTing to /search.php","A POST that uploaded avatar.php onto the server","One 404 response for /favicon.ico"],
correct:[0,1,2,3],
hint:"Try the filter box with <code>passwd</code>, <code>sqlmap</code> or <code>%27</code> — then think about what a normal 404 means.",
exp:"<p><b>Traversal</b> — <code>/../../../etc/passwd</code> tries to escape the web root and read a system file. Never normal.</p><p><b>SQLi probe</b> — <code>' OR '1'='1</code> is the textbook injection test; a 200 reply means the app answered, so check for data exposure.</p><p><b>sqlmap</b> — that user agent is an automatic injection tool. Its traffic is reconnaissance on its own.</p><p><b>avatar.php upload</b> — a POST that leaves a .php file behind can be a web-shell drop; the source IP differs from the normal users.</p><p><b>favicon 404</b> — browsers ask every site for it; one 404 is daily noise, not an attack.</p>"},

{"id":"M06","t":"order","title":"On the suspected laptop in 30 minutes","pts":2,
kw:["Order of volatility","Memory forensics / RAM capture","Process analysis","Root cause analysis (RCA)"],
th:["Memory & Malware Analysis","Detection Techniques & Response"],
scn:"FIN-WB-17 is suspected infected. The user must keep working, so you have one visit and 30 minutes. Order your collection steps so the most perishable evidence is not lost.",
q:"Put the first-response steps in the correct order (most volatile first).",
items:["Capture RAM with a memory acquisition tool","Record live network connections and open sockets (netstat)","Collect the running process list with full command lines","Copy the security and system event logs","Take a full disk image","Write the root cause analysis report"],
hint:"What disappears when the power goes off comes first. What survives the power-off comes last.",
exp:"<p>This is the <b>order of volatility</b>: RAM is gone the second power dies, so it is captured first. Live sockets and the process list die with the session or the process, so they come next. Event logs and the disk survive a reboot, so they are collected after. The report is written last, from everything above.</p><p>If you image the disk first, you may never get RAM — and many modern implants live only in memory.</p>"},
{"id":"M07","t":"match","title":"Name that tool","pts":3,
kw:["netstat / ss / lsof","tcpdump","Volatility","Sysmon","WHOIS","SIEM"],
th:["Network Traffic & Packet Analysis","Host & Endpoint Analysis","Log Analysis & SIEM"],
scn:"A new analyst mixed up the toolbox on the whiteboard. Reconnect each command or tool to what it is actually for.",
q:"Match each tool or command to its purpose.",
left:["netstat -ano","lsof -i :4444","tcpdump -i eth0 -w cap.pcap","Volatility pslist -f mem.vmem","Sysmon Event ID 1","whois evil-domain[.]example","SIEM correlation dashboard"],
right:["Show open ports and connections on a Windows host","List which Linux process opened a socket or file","Capture packets on an interface into a file","List processes inside a RAM capture, even hidden ones","Record every new process with its full command line","Show who registered a domain and when","Join logs from many sources and alert on patterns"],
pairs:[0,1,2,3,4,5,6],
hint:"Two tools read the network, one reads RAM, one watches processes, one reads registrations, one joins everything.",
exp:"<p><b>netstat -ano</b> is the Windows classic for sockets and PIDs; on modern Linux you would use <code>ss -tulpn</code>. <b>lsof -i :4444</b> maps a port to the Linux process and files behind it.</p><p><b>tcpdump -w</b> writes raw packets to a file for later Wireshark work. <b>Volatility</b> reads RAM captures — pslist there shows processes from memory, including ones hidden on disk.</p><p><b>Sysmon Event ID 1</b> gives every process creation with command line and hashes on Windows. <b>whois</b> answers 'who owns this domain and since when'. The <b>SIEM</b> aggregates logs from everywhere and runs correlation rules over them.</p>"},
{"id":"M08","t":"dnd","title":"Route the evidence to the right log source","pts":2,
kw:["Windows Event logs","syslog / auth.log","Web server access logs","Firewall logs"],
th:["Log Analysis & SIEM"],
scn:"Evidence lines from last night landed in one folder. Before you can query anything, sort each line into the system that produces it.",
q:"Drag each line into the log source that would contain it.",
bins:[{label:"Windows Security event log"},{label:"Linux syslog (auth.log)"},{label:"Web server access log"},{label:"Firewall log"}],
chips:[
{h:"Event 4625: logon failure for user svc-sql",b:0},
{h:"Event 4720: user account 'helpdesk2' created",b:0},
{h:"sshd: Failed password for root from 203[.]0[.]113[.]77",b:1},
{h:"sudo: alice : TTY=pts/0 ; COMMAND=/bin/bash",b:1},
{h:'"GET /admin.php HTTP/1.1" 404',b:2},
{h:'"POST /login.php HTTP/1.1" 200',b:2},
{h:"DENY TCP 198[.]51[.]100[.]9:4444 → 10[.]20[.]4[.]8:3389",b:3},
{h:"ALLOW TCP 10[.]20[.]1[.]5:any → any:443",b:3}],
hint:"Windows events start with 'Event', Linux auth lines talk about sshd or sudo, web lines are HTTP requests, the firewall speaks in DENY/ALLOW.",
exp:"<p><b>Event 4625 / 4720</b> are Windows Security event IDs — failed logons and account creation live there. <b>sshd / sudo</b> lines are written by Linux to syslog, usually auth.log. <b>HTTP request lines</b> with methods and status codes are the web server's access log. <b>DENY / ALLOW</b> rules with IPs and ports are firewall decisions.</p><p>Knowing the source matters because each system has its own query language and its own blind spots.</p>"},
{"id":"M09","t":"multi","title":"Spot the mistakes in the EPP policy","pts":2,
kw:["EPP / antivirus exclusions","File integrity monitoring (FIM)","Persistence mechanisms"],
th:["Host & Endpoint Analysis"],
scn:"A month of 'the antivirus never sees anything' complaints leads you to the endpoint policy. Three settings explain the blindness.",
art:[{l:"EPP policy — prod-desktops-v7",h:"<pre class='log'>1  Real-time protection ............ ON\n2  Behavior monitoring .............. OFF (CPU savings)\n3  Exclusions: C:\\Temp, C:\\Users\\*\\AppData\\*, *psexec*\n4  File integrity monitoring (servers): disabled\n5  Cloud lookup / sample submission . basic\n6  Signature updates ................ daily</pre>"}],
q:"Which three settings make the EPP much more likely to miss real malware?",
opts:["Behavior monitoring is turned off","Broad exclusions cover Temp, AppData and psexec","File integrity monitoring is disabled on servers","Signature updates run daily","Real-time protection is ON"],
correct:[0,1,2],
hint:"Two lines hide the attacker's favourite folders and tools. One line turns off the part that catches brand-new malware.",
exp:"<p><b>Behavior monitoring off</b> — signatures only catch known files. Behavior watching is what catches never-seen malware; without it you get false negatives on new implants.</p><p><b>Exclusions</b> — droppers love Temp and AppData because they are user-writable. Excluding <code>*psexec*</code> ignores a tool attackers reuse. These folders are exactly where malicious activity happens.</p><p><b>FIM disabled</b> — file integrity monitoring is your alarm when system files or startup entries are tampered with.</p><p>Daily signatures are acceptable practice; real-time protection ON is exactly what you want.</p>"},
{"id":"M10","t":"parts","title":"From flow anomaly to finished case","pts":3,"seq":true,
kw:["NetFlow / IPFIX flow analysis","Zeek (Bro) connection logs","Full packet capture (FPC)","Sandbox detonation","IoC extraction & sharing","Containment vs evidence preservation"],
th:["Network Traffic & Packet Analysis","Detection Techniques & Response"],
scn:"A flow anomaly on the finance laptop FIN-WB-17 opens a small case. Walk it like a real responder: each answer shapes the next step.",
art:[{l:"Zeek conn.log / NetFlow export (excerpt)",h:"<pre class='log'>09:00:03  10[.]20[.]4[.]17 → 203[.]0[.]113[.]44:443  tls  402 B\n09:01:02  10[.]20[.]4[.]17 → 203[.]0[.]113[.]44:443  tls  398 B\n09:02:01  10[.]20[.]4[.]17 → 203[.]0[.]113[.]44:443  tls  411 B\n(NetFlow/IPFIX: 540 flows, ~60 s apart, 9 hours, all to one IP)</pre>"}],
parts:[
{q:"The flow pattern is fixed-interval and one-directional. What is the best first move?",
opts:["Pull the full packet capture (FPC) for those flows from the SPAN archive","Reimage the laptop immediately — flows alone are proof enough","Wait 24 hours to see whether the pattern stops by itself"],c:0},
{q:"The FPC shows: every 60 s a TLS session with a 380-byte POST to /api/v2/gate, no referrer, a TLS fingerprint never seen on your estate. Next?",
opts:["Block the IP and close the ticket — the connection is cut","Detonate the likely implant in a sandbox to extract its C2 configuration","Email all staff and ask if their laptops feel slow"],c:1},
{q:"The sandbox returns: C2 domain gate-cdn[.]example, mutex Global\\updsvc, dropped file update32.dll. Which closing set is right?",
opts:["Delete the dropped file and mark the ticket solved","Only reset the user's password — nothing else is needed","Add domain, IP and mutex as IoCs, block them, reimage FIN-WB-17 and escalate to IR for a wider hunt"],c:2}],
hint:"Flows tell you 'there is a pattern'; packets tell you 'what the pattern says'; the sandbox turns one implant into a block-list.",
exp:"<p><b>Step 1</b> — flows prove shape, not content. The full packet capture (FPC) is the cheapest way to see inside before you touch the host. Reimaging destroys the evidence you have not collected yet.</p><p><b>Step 2</b> — a fixed 60-second POST is beaconing: the implant reporting home. Blocking one IP does nothing while the implant holds a domain list. A sandbox detonation gives you the config, safely.</p><p><b>Step 3</b> — real response ends with IoC extraction and sharing: domain, IP and mutex go into every control, the host is rebuilt, and IR hunts for the same IoCs elsewhere. Deleting one file leaves persistence behind.</p>"},

{"id":"M11","t":"dnd","title":"Autoruns — normal startup or persistence?","pts":2,
kw:["Windows Registry Run keys","Autoruns / startup persistence","Scheduled tasks","rundll32 / DLL abuse","Persistence mechanisms"],
th:["Host & Endpoint Analysis"],
scn:"On a suspicious workstation you export the autostart entries. Decide for each one: everyday software, or an attacker keeping a foothold?",
q:"Drag each autostart entry to the right basket.",
bins:[{label:"Normal / expected"},{label:"Suspicious — likely persistence"}],
chips:[
{h:"HKLM ...Run: OneDrive.exe — signed, C:\\Program Files\\Microsoft OneDrive\\",b:0},
{h:"HKCU ...Run: winl0gin.exe — unsigned, C:\\Users\\svc-backup\\AppData\\Roaming\\winl0gin.exe",b:1},
{h:"Startup: SecurityHealthSystray.exe — signed, C:\\Windows\\System32\\",b:0},
{h:"HKCU ...Run: update-checker.vbs — C:\\Windows\\Temp\\update-checker.vbs",b:1},
{h:"Scheduled task \\UpdateLib\\ → rundll32.exe C:\\Users\\Public\\Lib\\svc.dll,Start",b:1},
{h:"Startup: Teams.exe — signed, C:\\Program Files\\",b:0}],
hint:"Ask three questions: signed? expected folder? expected name? 'winl0gin' is not 'winlogin'.",
exp:"<p><b>winl0gin.exe</b> — a zero replacing an l, unsigned, in a user-writable Roaming folder: imitation plus the wrong folder. Classic Run-key persistence.</p><p><b>update-checker.vbs</b> — a script starting from Temp, a folder where nothing should auto-start. Typical dropper behavior.</p><p><b>Task → rundll32.exe ...\\svc.dll</b> — rundll32 is a legitimate Windows tool, which is why attackers abuse it to load their own DLL from a user-writable path. A scheduled task survives reboots — persistence.</p><p>OneDrive, SecurityHealthSystray and Teams are signed Microsoft products in their expected folders — normal.</p>"},
{"id":"M12","t":"classify","title":"Process list — friendly or fake?","pts":2,
kw:["Process analysis","PowerShell script block logging","EDR"],
th:["Host & Endpoint Analysis"],
scn:"EDR shows you the live process table of FIN-WB-11. Judge each line: everyday software, or malicious activity?",
art:[{l:"Process table (EDR live view)",h:"<table class='t'><tr><th>PID</th><th>Name</th><th>Path</th><th>Command line</th><th>Parent</th></tr>"+
"<tr><td>4812</td><td>svchost.exe</td><td>C:\\Windows\\System32\\svchost.exe</td><td>-k netsvcs</td><td>services.exe</td></tr>"+
"<tr><td>2210</td><td>chrome.exe</td><td>C:\\Program Files\\Google\\Chrome\\chrome.exe</td><td>(normal)</td><td>explorer.exe</td></tr>"+
"<tr><td>5150</td><td>scvhost.exe</td><td>C:\\Users\\a.moreau\\AppData\\Local\\Temp\\scvhost.exe</td><td>-b 4444</td><td>cmd.exe</td></tr>"+
"<tr><td>3304</td><td>powershell.exe</td><td>C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\</td><td>-nop -w hidden -enc SQBFAFgA...</td><td>WINWORD.EXE</td></tr>"+
"<tr><td>812</td><td>winlogon.exe</td><td>C:\\Windows\\System32\\winlogon.exe</td><td>winlogon.exe</td><td>smss.exe (system)</td></tr></table>"}],
q:"Classify each process as Benign or Malicious.",
items:[
{h:"svchost.exe from System32, started by services.exe",m:0},
{h:"chrome.exe from Program Files, started by explorer.exe",m:0},
{h:"scvhost.exe (note the spelling) from Temp with -b 4444",m:1},
{h:"powershell.exe with -nop -w hidden -enc, started by WINWORD.EXE",m:1},
{h:"winlogon.exe from System32, system-managed",m:0}],
hint:"Real Windows binaries sit in System32 with correct spelling. Temp folders and hidden encoded commands are not how software updates itself.",
exp:"<p><b>scvhost.exe</b> — misspelled on purpose so it looks like svchost at a glance, running from Temp, listening on 4444. Malicious.</p><p><b>Hidden encoded PowerShell from WINWORD</b> — Office documents never need hidden, encoded PowerShell. This is a macro dropping a stage-2 loader.</p><p>svchost from System32 under services.exe, chrome under explorer, winlogon under the system — these are the normal parents and paths. Their <i>absence</i> of weirdness is the point: in process analysis, path and parent are the fastest tells.</p>"},
{"id":"M13","t":"qcm","title":"netstat — which line bites?","pts":1,
kw:["netstat / ss / lsof","Unusual ports & protocol mismatch","C2 beaconing"],
th:["Host & Endpoint Analysis"],
scn:"You run <code>netstat -ano</code> on FIN-DB01 during a suspected compromise.",
art:[{l:"netstat -ano (excerpt)",h:"<pre class='log'>Proto  Local                 Foreign                State\nTCP    0[.]0[.]0[.]0:445      0[.]0[.]0[.]0:0         LISTENING\nTCP    10[.]20[.]4[.]8:139    0[.]0[.]0[.]0:0         LISTENING\nTCP    10[.]20[.]4[.]8:51344  203[.]0[.]113[.]44:4444 ESTABLISHED\nTCP    10[.]20[.]4[.]8:51360  192[.]0[.]2[.]20:443    ESTABLISHED\nUDP    127[.]0[.]0[.]1:5353   *:*</pre>"}],
q:"Which line do you investigate first, and why?",
opts:["The LISTENING 0[.]0[.]0[.]0:445 — an open listener means the box is serving malware","The ESTABLISHED link to 192[.]0[.]2[.]20:443 — it is encrypted, so it is hiding something","The ESTABLISHED link to 203[.]0[.]113[.]44:4444 — external host, unusual port, live session","The UDP 5353 line — mDNS chatter almost never belongs on a database server"],
c:2,
hint:"Two things make a connection loud: where it goes, and which port it uses. Only one line fails both checks at once.",
exp:"<p><b>203[.]0[.]113[.]44:4444</b> — an active session to an external host on 4444, a port famous for attacker tooling. Unusual port plus established plus external equals first look, every time.</p><p>HTTPS on 443 is how everything works today; encryption alone is not evidence. Port 445 is the normal Windows file-share listener, and a port scan would hit many ports, not one. mDNS on 5353 is ordinary local name chatter.</p><p>A protocol mismatch would be another tell — e.g. TLS-shaped bytes on a port that should carry something else — but 4444 alone already wins.</p>"},
{"id":"M14","t":"match","title":"Event IDs you must know by heart","pts":3,
kw:["Windows Event IDs (4624 / 4625 / 4688 / 4720 / 1102)","Service creation (Event 7045)","Log clearing (Event 1102) / anti-forensics"],
th:["Log Analysis & SIEM"],
scn:"You are writing detection queries for the Windows Security log. Wire each Event ID to its meaning — wrong wiring means missed detections.",
q:"Match each Event ID to what it records.",
left:["Event 4624","Event 4625","Event 4688","Event 4720","Event 7045","Event 1102"],
right:["A logon succeeded","A logon failed","A new process started","A user account was created","A new service was installed","The audit log was cleared"],
pairs:[0,1,2,3,4,5],
hint:"Pairs: 4624/4625 are the logon twins. 1102 is the one attackers trigger on purpose.",
exp:"<p><b>4624 / 4625</b> — success and failure of logons; bursts of 4625 followed by one 4624 are the classic brute-force shape. <b>4688</b> gives you process creation with the command line — the backbone of Windows detection. <b>4720</b> is account creation, often an attacker's persistence step. <b>7045</b> is service installation — malware loves services because they auto-start.</p><p><b>1102</b> — the audit log was cleared. By itself it can be an admin task; on a service account at 02:00 it is anti-forensics, and it must page someone.</p>"},
{"id":"M15","t":"qcm","title":"The TXT queries at 03:00","pts":1,
kw:["DNS tunneling","DNS logs","DNS record types (A, MX, TXT, NS)"],
th:["DNS & Domain Analysis"],
scn:"The DNS resolver log for last night shows two shapes of traffic. One host behaves differently from the rest.",
art:[{l:"DNS resolver log (excerpt)",h:"<pre class='log'>09:00:01  WS-114   A     cdn.example-site[.]example   → 198[.]51[.]100[.]53\n09:00:02  WS-114   AAAA  cdn.example-site[.]example\n09:00:05  MAIL-01  MX    example-site[.]example  → mx1.mailhost[.]example\n03:03:11  DB-02    TXT   a9f3k2m8q7x1t4v.mail-secure[.]example\n03:03:13  DB-02    TXT   p0w5z8c3b6n9r2u.mail-secure[.]example\n03:03:15  DB-02    TXT   h4j7l1o0s5y8e3i.mail-secure[.]example\n(4,180 TXT queries to mail-secure[.]example overnight, all from DB-02)</pre>"}],
q:"What is DB-02 doing?",
opts:["DNS cache poisoning — the resolver returns answers coming from the wrong source","A normal CDN — long random labels are typical for big content hosts","A DNS zone transfer — the log clearly shows one full AXFR request","DNS tunneling — bursts of TXT queries with long random labels to one zone"],
c:3,
hint:"Count the questions, not the answers: who asks, which record type, how often, how random the names are.",
exp:"<p><b>DNS tunneling</b> hides data inside DNS queries. Long, high-entropy labels, TXT record types, one fixed zone, thousands of repeats from one host — that is data moving out in the question field.</p><p>Cache poisoning would look like wrong answers, not weird questions. CDNs do use long labels, but structured and predictable, not random bursts. A zone transfer would show as an AXFR attempt, and resolvers normally refuse it.</p><p>A good follow-up is <code>dig</code> or <code>nslookup</code> of the zone from a lab host — and remember that tunneling over DNS-over-HTTPS would hide the queries from this log entirely.</p>"},

{"id":"M16","t":"fib","title":"Write the SOC report","pts":2,
kw:["C2 beaconing","IoC extraction & sharing","Sandbox detonation","Reporting","Containment vs evidence preservation"],
th:["Detection Techniques & Response"],
scn:"Your shift ends in ten minutes and the case summary must go out. Fill the blanks with the right security terms.",
q:"Complete the report — one word or phrase per blank.",
text:"Case IR-2026-1013: FIN-WB-17 sent a small TLS [[0]] every 60 seconds to one external IP. We extracted the domain, IP and mutex and saved them as [[1]] for detection and blocking. The implant sample was detonated in an isolated [[2]], which confirmed the C2 configuration. We then [[3]] the affected host from the network and handed the case to IR.",
blanks:["beacon","IoCs","sandbox","quarantined"],
bank:["beacon","IoCs","sandbox","quarantined","port scan","phishing","firewall","promoted"],
hint:"First blank: what the host does every 60 seconds. Second: the shared indicators. Third: where samples detonate. Fourth: what you do to a host.",
exp:"<p>A <b>beacon</b> is the repeating check-in of an implant. <b>IoCs</b> (indicators of compromise) are the facts — domain, IP, mutex — you share so every control can hunt them. A <b>sandbox</b> is an isolated VM where malware can be run safely and its config collected. <b>Quarantining</b> cuts the host off the network while keeping it running for evidence.</p><p>A port scan is outgoing probing (not this pattern), phishing was the likely entry (not this sentence), and a firewall is a control, not an action on a host.</p>"},
{"id":"M17","t":"dnd","title":"Build the brute-force correlation rule","pts":3,
kw:["SIEM","Correlation rules","Log aggregation & correlation","Failed-logon bursts / brute force"],
th:["Log Analysis & SIEM"],
scn:"Your SIEM ships without a brute-force rule. Assemble one from the token pool. Two tokens are decoys — leave them in the bank.",
q:"Drag each token into the slot it belongs to. Two tokens belong nowhere — leave them in the bank.",
bins:[{label:"WHEN — the event to watch"},{label:"GROUP BY — what counts as 'the same attacker'"},{label:"THRESHOLD — when it becomes an alert"},{label:"TIME WINDOW — how fast"},{label:"ACTION — what happens"}],
chips:[
{h:"EventID 4625 — failed logon",b:0},
{h:"source IP address",b:1},
{h:"at least 20 failures",b:2},
{h:"within 5 minutes",b:3},
{h:"raise a high alert and page the on-call analyst",b:4},
{h:"EventID 4624 — successful logon",b:-1},
{h:"within 24 hours",b:-1}],
hint:"Brute force = many FAILURES, not successes. A 24-hour window makes noise, not signals.",
exp:"<p>The rule counts <b>4625 failures</b> (not 4624 successes), grouped by <b>source IP</b> — one host trying 40 users is the attacker's footprint. <b>20 failures in 5 minutes</b> is loud enough to be an attack and rare enough to stay a real signal; a 24-hour window would fire on every forgotten password in the building.</p><p>The two decoys teach the two classic mistakes: alerting on successful logons (that is the aftermath, not the attack), and windows so wide they drown you in noise.</p>"},
{"id":"M18","t":"multi","title":"invoice_Q3.pdf.exe — innocent until proven?","pts":3,
kw:["Hash lookup (file reputation)","Sandbox detonation","Prefetch","Double extensions & PE header","Strings analysis","Packing (UPX)","File hashing (MD5 / SHA-256)"],
th:["OSINT, Blocklists & Reputation","Memory & Malware Analysis"],
scn:"FIN-WB-11 received <code>invoice_Q3.pdf.exe</code> by mail. The EPP did not alert. Decide with evidence, not gut feeling.",
q:"Select every piece of evidence or step that genuinely helps you decide whether the file is malicious.",
opts:["Look up the SHA-256 hash in threat-reputation feeds","Detonate a copy in an isolated sandbox and read the behavior report","Check Windows Prefetch: did the file ever actually execute?","The double extension (.pdf.exe) — a PE header check confirms it is really an executable","Strings in the binary reveal hxxp://gate[.]evil-update[.]example and a UPX-packed body","The file icon looks exactly like a real PDF document icon","The attached PDF has exactly three pages of innocent content"],
correct:[0,1,2,3,4],
hint:"Four answers are evidence about the file itself. Two are what the attacker wants you to see.",
exp:"<p><b>Hash lookup</b> — one SHA-256 query can end the case in seconds if someone has seen the sample (prefer SHA-256; MD5 alone is weak against collisions). <b>Sandbox</b> — dynamic analysis shows what it does, not just what it contains. <b>Prefetch</b> — Windows records executions, so it answers 'did it run?'. <b>Double extension</b> — .pdf.exe is an executable wearing a document costume; the PE header (an 'MZ' start) proves what it really is. <b>Strings + UPX</b> — a hidden URL plus packing are strong static-analysis signals.</p><p>The icon and the page count are what the attacker chooses you to see — nothing more.</p>"},
{"id":"M19","t":"multi","title":"OSINT the phishing domain","pts":2,
kw:["OSINT","Search-operator dorking","Passive DNS (pDNS)","WHOIS","Asset-search engines (Shodan-style)","Reverse DNS (PTR)","CVE / NVD lookup","URL analysis"],
th:["OSINT, Blocklists & Reputation","DNS & Domain Analysis"],
scn:"Users received mail pointing to <code>payroll-portal[.]example</code>. You must understand the domain — without touching it from production.",
q:"Select the research steps that are safe and useful.",
opts:["WHOIS history: creation date, registrar, recent nameserver changes","Passive DNS (pDNS): which IPs hosted this name before","Search engines with operators (OSINT dorking) for the domain name","Check the hosting IP in an asset-search engine (Shodan-style): what else runs there?","Open the site in your normal browser and log in with a test account"],
correct:[0,1,2,3],
hint:"Everything that reads about the domain is safe. One option touches it.",
exp:"<p><b>WHOIS history</b> — age, registrar and a recent nameserver change tell you how fresh and how disposable the domain is. <b>Passive DNS</b> shows past hosting without sending the attacker a single packet. <b>Dorking</b> uses search operators to find references, copies of the phishing kit and victim reports. <b>Shodan-style lookup</b> reveals what else lives on that IP — often other phishing domains.</p><p><b>Logging in from production</b> touches the attacker's page from your network and hands over your environment details. Use isolated analysis or a URL-analysis service instead. Cheap extras from the same toolbox: PTR/MX records, and a CVE/NVD check for the spoofed brand's portal software.</p>"},
{"id":"M20","t":"qcm","title":"Your mail server is on a blocklist","pts":1,
kw:["Blocklists & DNSBL","False positives","Escalation"],
th:["OSINT, Blocklists & Reputation"],
scn:"Monday morning: monitoring says MAIL-03 answers 'LISTED' when your scripts query a Spamhaus-style DNS blocklist (DNSBL). Mail logs confirm some outbound messages look like spam.",
q:"What does this finding mean, and what do you do?",
opts:["DNSBL hits are usually false positives — request delisting today and quickly move on","A host on your network is probably sending spam or malware — investigate MAIL-03's outbound mail now","This proves that a hacker has now taken and holds full control of the company domain controller","Reinstall the entire mail server from scratch today, without checking any of the logs first"],
c:1,
hint:"A blocklist is a signal with a cause. The cause is on your side — find it before you clean the reputation.",
exp:"<p>A DNSBL hit means the world has seen spam-like mail from your IP. With confirming mail logs, the next step is finding <b>what</b> sends it: a compromised mailbox, a rogue relay, or malware on the server itself.</p><p>Delisting without fixing the cause gets you listed again — worse, because repeat hits happen faster. The finding says nothing about the domain controller, and reinstalling before you understand the cause destroys the evidence you need for root cause analysis.</p>"},

{"id":"M21","t":"fib","title":"tcpdump on the SPAN port","pts":2,
kw:["tcpdump","Display & BPF filters","SPAN port / TAP","Packet capture (pcap)"],
th:["Network Traffic & Packet Analysis"],
scn:"The switch mirrors the finance VLAN to your capture host's <code>eth1</code> (a SPAN port). You need a pcap of everything touching the file server.",
q:"Complete the tcpdump command — one answer per blank.",
text:"<code>tcpdump -i [[0]] -n [[1]] 10[.]20[.]4[.]8 [[2]] /tmp/fs.pcap</code>",
blanks:["eth1","host","-w"],
bank:["eth1","host","-w","eth0","net","-r","port 443"],
hint:"First blank: the interface that sees the mirror. Second: the BPF keyword that matches 'to or from this IP'. Third: the flag that writes a file.",
exp:"<p><code>-i eth1</code> picks the interface receiving the SPAN mirror — capturing on eth0 would record the wrong network. <code>host 10[.]20[.]4[.]8</code> is the BPF-style filter matching traffic in <i>both</i> directions; <code>net</code> would grab a whole subnet instead of one server. <code>-w /tmp/fs.pcap</code> writes raw packets to a file so Wireshark can open it later; <code>-r</code> is for reading a file back.</p>"},
{"id":"M22","t":"multi","title":"Memory says one thing twice","pts":2,
kw:["Volatility","Hidden processes (pslist vs psscan)","Process hollowing","YARA rules","malfind / RWX injection"],
th:["Memory & Malware Analysis"],
scn:"You image the RAM of ACC-03 and run Volatility. Two plugins disagree — that is the whole story.",
art:[{l:"Volatility output (condensed)",h:"<pre class='log'>pslist:\n  System 4 | smss.exe 308 | csrss.exe 396 308 | services.exe 476\n  lsass.exe 484 476 | WINWORD.EXE 3312 1156 | cmd.exe 3556 3312\npsscan (pool scan):\n  lsass.exe 484   present\n  lsass.exe 2144  present   ← NOT in pslist\nmalfind:\n  lsass.exe 2144  vads with PAGE_EXECUTE_READWRITE, first bytes: MZ…</pre>"}],
q:"Select every suspicious finding or the right follow-up action.",
opts:["Two lsass.exe processes — the second is likely a hollowed or hidden fake","cmd.exe running as a child of WINWORD.EXE — a document spawned a shell","Write a YARA rule and hash of the fake image to sweep every other host","System (PID 4) and smss.exe look completely normal here — that part of the list is fine","csrss.exe running as a child of smss.exe — that parent pair alone proves malware"],
correct:[0,1,2],
hint:"One line is a normal parent-child pair. One line is true but not suspicious. Two lines are the smoke.",
exp:"<p><b>Two lsass.exe</b> — only one real lsass should exist. The copy seen by the pool scan (psscan) but missing from the active list (pslist) is hidden on purpose; malfind flagging RWX (read-write-execute) private memory starting with an MZ header means injected code — the signature of hollowing or injection tricks.</p><p><b>Word → cmd.exe</b> — documents do not need shells; this is the macro chain again.</p><p><b>The YARA sweep</b> — one hash plus a rule finds every other host with the same implant; that is hunting, not just cleaning.</p><p>System and smss being normal is true but is not a finding. csrss under smss is the normal parent — the opposite of proof.</p>"},
{"id":"M23","t":"rank","title":"Four hosts, one analyst — who first?","pts":2,
kw:["Alert triage","Prioritization — see triage","Escalation"],
th:["Detection Techniques & Response"],
scn:"After lunch four tickets wait. You can work them one at a time. Rank them so the business bleeds least.",
q:"Rank the hosts — most urgent investigation first.",
items:["DB-01: beacon every 60 s to a known-bad IP, and a Domain Admin session is currently active","WEB-04: 2,000 failed SSH logons in 10 minutes from one external IP","HR-12: torrent client traffic to a seedbox (policy breach)","ACC-03: one failed logon for user jsmith from the office subnet"],
hint:"Ask two questions per host: is the attacker already inside? and what can they reach from there?",
exp:"<p><b>DB-01</b> — an active beacon plus a Domain Admin session means the attacker may hold the keys to the kingdom right now. Nothing can go before this.</p><p><b>WEB-04</b> — an ongoing brute-force storm is an attack in progress; it may still fail, but it needs blocking and review of the account list.</p><p><b>HR-12</b> — torrents are a policy breach and a risk, but not an intrusion.</p><p><b>ACC-03</b> — one failed logon from the office is daily noise; it earns a glance, not a case.</p>"},
{"id":"M24","t":"qcm","title":"Sysmon wakes up at 02:14","pts":1,
kw:["Sysmon","PowerShell script block logging","URL analysis"],
th:["Host & Endpoint Analysis"],
scn:"Sysmon ships one event to the SIEM from a finance workstation.",
art:[{l:"Sysmon Event ID 1 — Process Create",h:"<pre class='log'>UtcTime:     2026-10-13 02:14:09.221\nImage:       C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\nCommandLine: powershell -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB0AC4AVwBlAGIA…\nParentImage: C:\\Program Files\\Microsoft Office\\root\\Office16\\WINWORD.EXE\nUser:        CORP\\f.neri\n(related)    PowerShell 4104 script block logging captured the decoded text</pre>"}],
q:"What does this alert actually show?",
opts:["A normal Office update task that runs a scheduled macro job nightly","The print spooler service loading a printer driver after an update","A hidden, encoded PowerShell download — spawned by Word at 02:14","A failed logon attempt recorded against PowerShell remoting"],
c:2,
hint:"Read the flags: -nop -w hidden -enc. Then read the parent. Then ask what Office needs at 2 a.m.",
exp:"<p><code>-nop -w hidden -enc</code> means: no profile, no window, encoded command. Word spawning it at night is the classic macro-loader chain — the encoded blob decodes to a downloader that pulls more code from an external URL (script block logging, event 4104, already recorded the decoded text for you).</p><p>Office has no legitimate nightly PowerShell scheduler, the spooler is unrelated, and failed logons are Event 4625 — a completely different record.</p>"},
{"id":"M25","t":"parts","title":"Two sides of the same beacon","pts":2,"seq":false,
kw:["Attacker & defender perspectives","NetFlow / IPFIX flow analysis","Full packet capture (FPC)","DNS logs","C2 beaconing"],
th:["Network Traffic & Packet Analysis","Detection Techniques & Response"],
scn:"WS-77 shows a rhythm: a DNS lookup for <code>cdn-metrics[.]example</code>, then a small TLS session to 203[.]0[.]113[.]77:443, every five minutes, ~400 bytes each way. The EPP is silent. Answer once as the defender, once as the attacker.",
parts:[
{q:"DEFENDER: which data source proves what the host actually does after each lookup?",
opts:["NetFlow/IPFIX or a full packet capture of the TLS sessions","The DHCP lease list — it names the hosts","The print server logs — everything passes through printing"],c:0},
{q:"ATTACKER: you operate cdn-metrics[.]example. Which design choice hides you longest?",
opts:["Front the C2 through a popular CDN so defenders' logs show the CDN, and keep the beacon slow","Beacon every second, straight to a raw IP — speed is safety","Log in to WS-77 yourself with your personal laptop to check on it"],c:0}],
hint:"Defender: DNS proves intent, flow proves action. Attacker: the best hiding place is inside traffic everyone else makes.",
exp:"<p><b>Defender</b> — DNS logs show the host <i>wanted</i> to talk to the domain; flow records or an FPC show that it <i>did</i>, on schedule, at implant scale. DHCP and print logs cannot describe a TLS session.</p><p><b>Attacker</b> — blending with a real CDN (domain fronting) plus a slow beacon defeats simple detectors: volume is low, destinations look legitimate, and one blocklist entry does not kill the channel. Fast raw-IP beacons are exactly what flow baselines catch in minutes — and touching the endpoint yourself is how operators get caught.</p>"},

{"id":"M26","t":"multi","title":"Filter the Security log like an analyst","pts":2,
kw:["Windows Event IDs (4624 / 4625 / 4688 / 4720 / 1102)","Failed-logon bursts / brute force","Threat hunting","Windows Event logs"],
th:["Log Analysis & SIEM"],
scn:"You exported last night's Security log from FIN-DB01. Use the filter box — then read the story the events tell.",
log:{l:"Windows Security log (excerpt)",lines:[
'08:58:02  4625  Logon Type 10  Account: svc-sql        Source: 203[.]0[.]113[.]140',
'08:58:09  4625  Logon Type 10  Account: svc-sql        Source: 203[.]0[.]113[.]140',
'08:58:15  4625  Logon Type 10  Account: svc-sql        Source: 203[.]0[.]113[.]140',
'08:58:22  4625  Logon Type 10  Account: svc-sql        Source: 203[.]0[.]113[.]140',
'08:58:30  4625  Logon Type 10  Account: svc-sql        Source: 203[.]0[.]113[.]140',
'09:03:41  4624  Logon Type 10  Account: svc-sql        Source: 203[.]0[.]113[.]140',
'09:04:12  4688  New process: whoami.exe                 User: svc-sql',
'09:06:55  4720  User account created: svc-backup2       Actor: svc-sql',
'10:02:11  4624  Logon Type 2   Account: f.neri         Source: 10[.]20[.]1[.]55',
'10:04:39  4625  Logon Type 2   Account: jsmith         Source: 10[.]20[.]1[.]99']},
filter:true,
q:"Select every true statement for the incident ticket.",
opts:["Brute force: five 4625 failures for svc-sql from 203[.]0[.]113[.]140, then one 4624 success","The 4624 logon for f.neri from the internal office IP 10[.]20[.]1[.]55 belongs to the attack chain","After the success: whoami.exe plus a new account (4720) — hands-on-keyboard activity","Run a threat hunt for 203[.]0[.]113[.]140 across every log source you own","Logon Type 10 marks a service logon, so all of these events are routine scheduled maintenance"],
correct:[0,2,3],
hint:"Filter for 140. Then ask what a person does in the first five minutes after breaking in.",
exp:"<p>The shape is a textbook brute force: repeated 4625 failures for one account from one external IP, ending in a 4624 success from the same IP three minutes later. Then 4688 shows <code>whoami</code> and 4720 a new account — the attacker exploring and creating persistence.</p><p>f.neri's Type 2 (interactive console) logon from an office IP is a normal workday. And Type 10 is RemoteInteractive — RDP, not a service logon.</p><p>The hunt matters because this IP touched at least one more target in most real cases. If the failures had spread over <i>many</i> accounts instead, you would call it password spraying.</p>"},
{"id":"M27","t":"classify","title":"Baseline — is this normal here?","pts":2,
kw:["Baselines & anomaly detection","False positives","Scheduled tasks","Blocklists & DNSBL","PowerShell script block logging"],
th:["Log Analysis & SIEM"],
scn:"You are tuning detections for the finance VLAN. For each observed line, judge it against a sane enterprise baseline.",
q:"Classify each statement as Benign or Malicious.",
items:[
{h:"svchost.exe sends one DNS TXT query every 5 minutes to an odd external zone",m:1},
{h:"Chrome updates itself over HTTPS from the vendor CDN at 02:00",m:0},
{h:"A scheduled task 'Updater' was created by the Office installer",m:0},
{h:"WINWORD.EXE spawns powershell.exe with an encoded command",m:1},
{h:"The antivirus runs its daily quick scan and finds nothing",m:0},
{h:"An outbound connection goes to an IP that sits on a threat-feed blocklist",m:1}],
hint:"Updates and scans follow schedules and signed binaries. TXT beacons and encoded shells do not.",
exp:"<p><b>TXT beaconing from svchost</b> — the real svchost has no business doing slow TXT queries; that rhythm is tunneling or C2.</p><p><b>Chrome update, Office task, daily AV scan</b> — all expected: vendors push updates at night, installers create tasks, and empty scans are good news. Judging them malicious is how teams drown in false positives.</p><p><b>Word → encoded PowerShell</b> — Office never needs this; it is the macro chain.</p><p><b>Traffic to a blocklisted IP</b> — feeds carry known-bad infrastructure; a hit deserves a look, not an auto-dismiss.</p>"},
{"id":"M28","t":"multi","title":"Which of these domains is lying?","pts":2,
kw:["Typosquatting & homoglyphs","Domain reputation"],
th:["DNS & Domain Analysis"],
scn:"Finance staff got a 'payroll portal re-verification' mail. Your corporate domain is <code>meridian-pay.example</code>. Sort the candidates.",
art:[{l:"Domains seen in the mail and DNS logs",h:"<pre class='log'>meridian-pay.example\nmeridian-pav.example\nmer1dian-pay.example\nmail.meridian-pay.example\nmeridian-pay.example-login[.]net</pre>"}],
q:"Select the lookalike domains you should block.",
opts:["meridian-pav.example — one-letter swap (y→v)","mer1dian-pay.example — homoglyph (i→1)","meridian-pay.example-login[.]net — your real domain embedded in an attacker zone","mail.meridian-pay.example — the company mail host","meridian-pay.example — the real corporate domain"],
correct:[0,1,2],
hint:"Read each name twice, character by character. Subdomains of YOUR domain are yours; zones that merely CONTAIN your domain are not.",
exp:"<p><b>pav / mer1dian</b> — a swapped letter and a digit-for-letter homoglyph are classic typosquats: cheap to register, deadly in a hurry. <b>example-login[.]net</b> — owning the left side of a dot proves nothing; the attacker owns everything right of the last dot, which is their zone.</p><p>Mail subdomains and the real domain are yours. When a domain's reputation matters, check WHOIS age plus blocklist status — fresh registrations wearing your name are the pattern.</p>"},
{"id":"M29","t":"qcm",c:0,"title":"Did the attachment execute?","pts":1,
kw:["EDR","Process analysis","Evidence quality"],
th:["Host & Endpoint Analysis"],
scn:"Compliance asks for proof: did <code>invoice_Q3.pdf.exe</code> actually <i>run</i> on FIN-WB-11? The EPP quarantined nothing.",
q:"Which source gives the strongest direct evidence?",
opts:["Query EDR process telemetry for the file name and its child processes","Check the firewall log for traffic on port 443 from that host","Ask the user whether they remember opening the attachment","Pull the DHCP lease history for the whole office subnet"],
hint:"You need evidence about execution — which tool records programs starting?",
exp:"<p><b>EDR telemetry</b> records process starts with paths, hashes and parent chains: it answers 'did it run, and what did it spawn?' directly. Process analysis from that data is accepted evidence.</p><p>Firewall logs show network flows, not executions. A user's memory is a lead, never proof — and DHCP only says which machine had which address. When the question is 'did it execute', go to the tool that watches execution.</p>"},
{"id":"M30","t":"multi","title":"Assemble the case — and name the root cause","pts":2,
kw:["Root cause analysis (RCA)","Timeline reconstruction","IoC extraction & sharing","Persistence mechanisms","Mutex artifacts"],
th:["Detection Techniques & Response","Log Analysis & SIEM"],
scn:"Six artifacts from one morning, merged into a timeline. Read it once end-to-end before answering.",
log:{l:"Case IR-2026-1013 — merged timeline",lines:[
'09:02:11  MAIL   invoice_Q3.pdf.exe delivered to f.neri (FIN-WB-11)',
'09:04:02  EDR    WINWORD.EXE → powershell.exe -enc (FIN-WB-11)',
'09:07:30  DNS    FIN-WB-11 resolves gate-cdn[.]example',
'09:07:44  FLOW   FIN-WB-11 → 203[.]0[.]113[.]44:443, beacon 1 per 60 s',
'09:09:01  EDR    implant creates mutex Global\\UpdateSvc',
'10:30:02  FILE   1.8 GB read from \\\\fs01\\finance; upload to 203[.]0[.]113[.]44']},
filter:true,
q:"Select every true statement for the RCA summary.",
opts:["Initial access looks like the macro document; the beacon followed within minutes","Block gate-cdn[.]example and 203[.]0[.]113[.]44 as IoCs and hunt for both","The mutex Global\\UpdateSvc is a persistence/check-in artifact worth sharing as an IoC","The database server was fully patched last month, so the whole alert must be a false positive","No exfiltration happened at all, because the EPP never raised a single alert"],
correct:[0,1,2],
hint:"Three statements describe what the artifacts show. Two are wishful thinking.",
exp:"<p>The chain is clean: mail delivers at 09:02, Word spawns encoded PowerShell at 09:04, the beacon starts at 09:07 — a five-minute kill chain, and the mutex plus the C2 pair become IoCs to block and hunt across the estate.</p><p>‘Fully patched’ does not survive the artifacts, and EPP silence has never meant 'nothing happened' — a 1.8 GB upload to the beacon IP is textbook exfiltration staging. The next RCA questions: which servers saw 4624 Type 3 logons from FIN-WB-11 (lateral movement), and where the patching or mail-filtering gap that let the mail through — that gap is the actual root cause.</p>"},

function byId(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffled(a){ return shuffle(a.slice()); }
function fmtT(s){ var m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

var S = { order:[], cur:0, ans:{}, started:false, finished:false, manualPause:false, checkPause:false,
          remaining: EXAM.minutes*60, tid:null, reported:false, initName:"" };

function newRec(q){
  var rec = { status:"un", earned:0, hint:false, marks:null, val:null, permOpt:null, permBank:null, permChips:null, permRows:null, permItems:null, permRight:null };
  if(q.t==="qcm"||q.t==="multi") rec.permOpt = shuffled(q.opts.map(function(o,i){return i;}));
  if(q.t==="fib"){ rec.permBank = shuffled(q.bank); rec.val = q.blanks.map(function(){ return ""; }); }
  if(q.t==="dnd"){ rec.permChips = shuffled(q.chips.map(function(c,i){return i;})); rec.val = { bin:{} }; }
  if(q.t==="match"){ rec.permRight = shuffled(q.right.map(function(r,i){return i;})); rec.val = { pair:{} }; }
  if(q.t==="order"||q.t==="rank"){ var p; var n=q.items.length;
    do { p = shuffled(q.items.map(function(x,i){return i;})); } while(n>1 && p.every(function(v,i){return v===i;}));
    rec.permItems = p; rec.val = { list: p.slice() }; }
  if(q.t==="triage"){ rec.permRows = shuffled(q.rows.map(function(r,i){return i;})); rec.val = q.rows.map(function(){ return null; }); }
  if(q.t==="classify"){ rec.permRows = shuffled(q.items.map(function(r,i){return i;})); rec.val = q.items.map(function(){ return null; }); }
  if(q.t==="parts"){ rec.permParts = q.parts.map(function(p){ return shuffled(p.opts.map(function(o,i){return i;})); });
    rec.val = q.parts.map(function(){ return null; }); }
  if(q.t==="terminal"){ rec.val = { cmd:"", ok:false }; }
  return rec;
}
function buildAttempt(){
  S.order = shuffled(QUESTIONS.map(function(q,i){ return i; }));
  S.ans = {}; S.cur = 0;
  QUESTIONS.forEach(function(q){ S.ans[q.id] = newRec(q); });
  S.manualPause=false; S.checkPause=false; S.reported=false; S.finished=false;
  S.remaining = EXAM.minutes*60;
}

/* ---------- checked-state helpers ---------- */
function answeredCount(){ var n=0; QUESTIONS.forEach(function(q){ if(S.ans[q.id].status==="checked") n++; }); return n; }
function skippedCount(){ var n=0; QUESTIONS.forEach(function(q){ if(S.ans[q.id].status==="skipped") n++; }); return n; }
function livePoints(){ var p=0; QUESTIONS.forEach(function(q){ p+=S.ans[q.id].earned; }); return Math.round(p*100)/100; }
function updateChrome(){
  byId("tval").textContent = fmtT(S.remaining);
  byId("sval").textContent = livePoints();
  var done=answeredCount(), skip=skippedCount(), tot=QUESTIONS.length;
  byId("barOk").style.width = (done/tot*100)+"%";
  byId("barSkip").style.width = (skip/tot*100)+"%";
  byId("barwrap").setAttribute("aria-valuenow", Math.round((done+skip)/tot*100));
  byId("barlbl").textContent = done+" of "+tot+" answered · "+skip+" skipped · "+(tot-done-skip)+" remaining";
  var dots = document.querySelectorAll(".dot");
  S.order.forEach(function(qi,pos){
    var d = dots[pos]; if(!d) return;
    var r = S.ans[QUESTIONS[qi].id];
    d.className = "dot"+(r.status==="checked"?" done":"")+(r.status==="skipped"?" skip":"")+(pos===S.cur?" cur":"");
    d.setAttribute("aria-label","Question "+(pos+1)+(r.status==="checked"?", answered":r.status==="skipped"?", skipped":", not answered"));
  });
  byId("indManual").hidden = !S.manualPause;
  byId("indCheck").hidden = !S.checkPause;
  byId("indwrap").hidden = !(S.manualPause||S.checkPause);
}
function startTimer(){ if(S.tid) clearInterval(S.tid); S.tid = setInterval(tick,1000); }
function tick(){
  if(!S.started||S.finished) return;
  if(S.manualPause||S.checkPause){ updateChrome(); return; }
  S.remaining--;
  if(S.remaining<=0){ S.remaining=0; updateChrome(); finishExam("time"); return; }
  updateChrome();
}

function correctSummaryHTML(q){
  function li(arr){ return '<ul class="clean">'+arr.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>"; }
  if(q.t==="qcm") return "<p>"+q.opts[q.c]+"</p>";
  if(q.t==="multi") return li(q.correct.map(function(i){ return q.opts[i]; }));
  if(q.t==="dnd") return li(q.bins.map(function(b,bi){
      var its=q.chips.map(function(c,ci){return {h:c.h,b:c.b};}).filter(function(c){return c.b===bi;}).map(function(c){return c.h;});
      return "<b>"+b.label+"</b>: "+(its.join(", ")||"—"); }));
  if(q.t==="match") return li(q.left.map(function(L,i){ return "<b>"+L+"</b> &rarr; "+q.right[q.pairs[i]]; }));
  if(q.t==="order"||q.t==="rank") return li(q.items.map(function(x,i){ return "<b>"+(i+1)+".</b> "+x; }));
  if(q.t==="fib") return li(q.blanks.map(function(b,i){ return "<b>Blank "+(i+1)+":</b> "+b; }));
  if(q.t==="terminal") return "<p>Accepted command(s):</p><pre class='log'>"+esc(q.acceptShow)+"</pre>";
  if(q.t==="parts") return li(q.parts.map(function(p,i){ return "<b>Step "+(i+1)+":</b> "+p.opts[p.c]; }));
  if(q.t==="triage") return li(q.rows.map(function(r,i){ return (i+1)+". "+q.acts[q.correct[i]]+" — "+esc(r.short||""); }));
  if(q.t==="classify") return li(q.items.map(function(it,i){ return (i+1)+". <b>"+(it.m===1?"Malicious":"Benign")+"</b> — "+it.h; }));
  return "";
}
function studentSummaryHTML(q,rec){
  if(rec.status==="skipped") return "<p class='sklist'>&#9888; Skipped — not counted in the score.</p>";
  var v=rec.val;
  function li(arr){ return '<ul class="clean">'+arr.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>"; }
  if(q.t==="qcm") return "<p>"+(v===null||v===undefined?"(no answer)":q.opts[v])+"</p>";
  if(q.t==="multi"){ var arr=(v||[]).map(function(i){ return q.opts[i]; }); return arr.length?li(arr):"<p>(no answer)</p>"; }
  if(q.t==="dnd"){ var rows=[]; q.chips.forEach(function(c,ci){ rows.push(c.h+" &rarr; "+(v.bin[ci]!==undefined&&v.bin[ci]>-1 ? esc(q.bins[v.bin[ci]].label) : "left in bank")); }); return li(rows); }
  if(q.t==="match"){ return li(q.left.map(function(L,i){ var r=v.pair[i]; return "<b>"+L+"</b> &rarr; "+(r===undefined||r===null?"(none)":q.right[r]); })); }
  if(q.t==="order"||q.t==="rank"){ return li(v.list.map(function(oi,pos){ return "<b>"+(pos+1)+".</b> "+q.items[oi]; })); }
  if(q.t==="fib"){ return li(q.blanks.map(function(b,i){ return "<b>Blank "+(i+1)+":</b> "+(v[i]||"(none)")+" — correct: "+b; })); }
  if(q.t==="terminal") return "<p>Command: <code>"+esc(v.cmd||"(none)")+"</code></p>";
  if(q.t==="parts"){ return li(q.parts.map(function(p,i){ return "<b>Step "+(i+1)+":</b> "+(v[i]===null?"(no answer)":p.opts[v[i]]); })); }
  if(q.t==="triage"){ return li(q.rows.map(function(r,i){ return (i+1)+". "+(v[i]===null?"(no answer)":q.acts[v[i]]); })); }
  if(q.t==="classify"){ return li(q.items.map(function(it,i){ return (i+1)+". "+(v[i]===null?"(no answer)":(v[i]===1?"Malicious":"Benign"))+" — correct: "+(it.m===1?"Malicious":"Benign"); })); }
  return "";
}

function elementsTotal(q){
  if(q.t==="qcm"||q.t==="terminal") return 1;
  if(q.t==="multi") return q.correct.length;
  if(q.t==="dnd") return q.chips.length;
  if(q.t==="match") return q.left.length;
  if(q.t==="order"||q.t==="rank") return q.items.length;
  if(q.t==="fib") return q.blanks.length;
  if(q.t==="parts") return q.parts.length;
  if(q.t==="triage") return q.rows.length;
  if(q.t==="classify") return q.items.length;
  return 1;
}
function countOK(rec){ var n=0; if(rec.marks) for(var k in rec.marks){ if(rec.marks[k]==="ok") n++; } return n; }
function countBAD(rec){ var n=0; if(rec.marks) for(var k in rec.marks){ if(rec.marks[k]==="bad") n++; } return n; }

/* ===================== capture + check ===================== */
function captureFromDOM(q,rec){
  var root = byId("ansbody"); if(!root) return;
  if(q.t==="qcm"){ var r=root.querySelector('input[type=radio]:checked'); rec.val = r?Number(r.value):null; }
  if(q.t==="multi"){ rec.val = Array.prototype.map.call(root.querySelectorAll('input[type=checkbox]:checked'),function(x){return Number(x.value);}); }
  if(q.t==="parts"){ q.parts.forEach(function(p,pi){ var r=root.querySelector('input[name="a-'+q.id+'-'+pi+'"]:checked'); rec.val[pi]=r?Number(r.value):null; }); }
  if(q.t==="fib"){ root.querySelectorAll(".bsel").forEach(function(s){ rec.val[Number(s.dataset.b)]=s.value; }); }
  if(q.t==="triage"){ root.querySelectorAll(".tsel").forEach(function(s){ var v=s.value; rec.val[Number(s.dataset.r)] = v===""?null:Number(v); }); }
  if(q.t==="terminal"){ var tin=byId("tin-"+q.id); if(tin && tin.value) { rec.val.cmd = tin.value; } }
}
function termNorm(c){ return String(c||"").replace(/\[\.\]/g,".").replace(/\s+/g," ").trim().toLowerCase(); }
function termAccept(q,cmd){
  var c = termNorm(cmd);
  return (q.accept||[]).some(function(re){ try{ return new RegExp(re,"i").test(c); }catch(e){ return false; } });
}

function doCheck(){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(rec.status==="checked") return;
  captureFromDOM(q,rec);
  var marks={}, elOK=0, n=elementsTotal(q), each=q.pts/n, ok=false;
  if(q.t==="qcm"){ ok = rec.val===q.c; marks[q.c]="ok"; if(!ok&&rec.val!==null) marks[rec.val]="bad"; elOK=ok?1:0; }
  else if(q.t==="multi"){ var cs={}; q.correct.forEach(function(i){cs[i]=1;});
    (rec.val||[]).forEach(function(i){ if(cs[i]){marks[i]="ok";elOK++;} else marks[i]="bad"; });
    q.correct.forEach(function(i){ if(!marks[i]) marks[i]="part"; }); }
  else if(q.t==="dnd"){ q.chips.forEach(function(c,ci){ var b=rec.val.bin[ci]; var inBank=(b===undefined||b===-1);
      if(c.b===-1){ if(inBank){marks[ci]="ok";elOK++;} else {marks[ci]="bad"; mbin(marks,b);} }
      else if(b===c.b){marks[ci]="ok";elOK++;}
      else if(inBank){marks[ci]="part";}
      else{marks[ci]="bad"; mbin(marks,b);} });
    function mbin(mm,b){ var k="bin"+b; mm[k]="bad"; } }
  else if(q.t==="match"){ q.left.forEach(function(L,li){ var r=rec.val.pair[li];
      if(r!==undefined&&r!==null&&r===q.pairs[li]){marks["l"+li]="ok";elOK++;}
      else if(r===undefined||r===null){marks["l"+li]="part";}
      else{marks["l"+li]="bad";} }); }
  else if(q.t==="order"||q.t==="rank"){ rec.val.list.forEach(function(oi,pos){ if(oi===pos){marks["p"+oi]="ok";elOK++;}else{marks["p"+oi]="bad";} }); }
  else if(q.t==="fib"){ q.blanks.forEach(function(b,i){ if(rec.val[i]===b){marks["b"+i]="ok";elOK++;}else{marks["b"+i]=rec.val[i]===""?"part":"bad";} }); }
  else if(q.t==="terminal"){ ok = termAccept(q, rec.val.cmd); if(ok) rec.val.ok=true; marks["t"]=ok?"ok":"bad"; elOK=ok?1:0; }
  else if(q.t==="parts"){ q.parts.forEach(function(p,pi){ var v=rec.val[pi];
      if(v===p.c){marks[pi+"_"+v]="ok";elOK++;}
      else if(v===null||v===undefined){marks[pi+"_"+p.c]="part";}
      else{marks[pi+"_"+v]="bad"; marks[pi+"_"+p.c]="ok";} }); }
  else if(q.t==="triage"){ q.rows.forEach(function(r,ri){ var v=rec.val[ri];
      if(v!==null&&v===q.correct[ri]){marks["r"+ri]="ok";elOK++;}
      else{marks["r"+ri]=v===null?"part":"bad";} }); }
  else if(q.t==="classify"){ q.items.forEach(function(it,i){ var v=rec.val[i];
      if(v!==null&&v===it.m){marks["i"+i]="ok";elOK++;}
      else{marks["i"+i]=v===null?"part":"bad";} }); }
  var earned = each*elOK;
  if(rec.hint) earned = Math.max(0, earned - q.pts*0.10);
  earned = Math.round(earned*100)/100;
  rec.marks = marks; rec.earned = Math.min(earned,q.pts); rec.status="checked";
  S.checkPause = true;
  renderQ(); updateChrome();
  var fb = byId("fbpanel"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function doSkip(){
  var qi=S.order[S.cur], rec=S.ans[QUESTIONS[qi].id];
  rec.status="skipped"; updateChrome();
  if(S.cur < QUESTIONS.length-1) gotoQ(S.cur+1);
  else openSubmitModal(true);
}
function doHint(){
  var qi=S.order[S.cur], rec=S.ans[QUESTIONS[qi].id];
  if(rec.hint) return;
  rec.hint=true;
  var t=byId("hinttext"); if(t) t.hidden=false;
  var b=byId("btnHint"); if(b) b.disabled=true;
  updateChrome();
}
function doRevise(){
  var qi=S.order[S.cur], rec=S.ans[QUESTIONS[qi].id];
  if(rec.status!=="checked") return;
  rec.status="un"; rec.earned=0; rec.marks=null;
  renderQ(); updateChrome();
}
function gotoQ(pos){
  /* NOTE: check-pause is intentionally NOT cleared here. Per spec, only the
     "Next" button resumes the timer after a Check-pause. */
  S.cur=Math.max(0,Math.min(QUESTIONS.length-1,pos));
  renderQ();
  window.scrollTo({top:0,behavior:"smooth"});
}
function pauseManual(){
  if(S.finished) return;
  S.manualPause=!S.manualPause;
  byId("pauseOverlay").hidden=!S.manualPause;
  byId("exwrap").classList.toggle("blurred",S.manualPause);
  var b=byId("btnPause"); b.innerHTML = S.manualPause? "&#9654; Resume" : "&#9208; Pause";
  b.setAttribute("aria-pressed",String(S.manualPause));

}

function themeProgress(){
  var th={};

    (q.th||[]).forEach(function(t){

      if(r.status!=="skipped"){ th[t].max+=1; th[t].got+= r.earned/q.pts; }
    });
  });
  return th;
}
function showResults(reason){

      : '<div class="failpanel"><h2>&#10007; FAIL — '+EXAM.passMark+'% needed</h2><p>You did not reach the pass mark. Review the report below, focus on the themes where you lost points, then press <b>Retake Exam</b>. Questions and answers will be reshuffled.</p></div>')+
    '<div class="statrow">'+
    '<div class="stat"><div class="v">'+score+' / '+total+'</div><div class="k">exercises-worth (skipped excluded)</div></div>'+
    '<div class="stat"><div class="v">'+(Math.round(ptsEarn*10)/10)+' / '+(Math.round(ptsMax*10)/10)+'</div><div class="k">raw points (answered)</div></div>'+
    '<div class="stat"><div class="v">'+answered+' / '+QUESTIONS.length+'</div><div class="k">answered</div></div>'+
    '<div class="stat"><div class="v">'+skippedCount()+'</div><div class="k">skipped (not counted)</div></div>'+
    '<div class="stat"><div class="v">'+EXAM.passMark+'%</div><div class="k">pass mark</div></div>'+

  h+='<h2>Per-theme progress</h2>';
  var th=themeProgress();

    h+='<div class="themebar"><div class="tl"><span>'+t+'</span><span>'+pc+'%</span></div><div class="tb"><div style="width:'+pc+'%"></div></div></div>';
  });
  h+='<h2>Detailed report</h2><p class="dim">Open any exercise to compare your answer with the correct one and read the explanation.</p>';

    var hintTxt = r.hint ? ' · hint −10%' : '';
    var lblTxt = r.status==="skipped" ? "SKIPPED · not counted" : (lbl==="full"?"FULL "+r.earned.toFixed(2)+"/"+q.pts : lbl==="partial"?"PARTIAL "+r.earned.toFixed(2)+"/"+q.pts+hintTxt : "ZERO 0/"+q.pts+hintTxt);
    h+='<details class="repex"'+(lbl==="zero"||r.status==="skipped"?" open":"")+'><summary><span class="lbl '+lbl+'">'+lblTxt+'</span><b>Q'+(pos+1)+' — '+esc(q.title)+'</b></summary><div class="repbody">'+
      '<h3>Your answer</h3>'+studentSummaryHTML(q,r)+

      '<div class="expl">'+q.exp+'</div></div></details>';
  });
  h+='<div class="btns"><button type="button" class="btn primary" data-act="retake" id="btnRetake">&#8635; Retake Exam</button></div></div>';
  byId("results").innerHTML=h;

/* ===================== events ===================== */
function handleAction(act,tgt,ev){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(act==="start"){ byId("intro").hidden=true; byId("top").hidden=false; byId("exam").hidden=false; byId("indwrap").hidden=false;
    S.started=true; startTimer(); renderQ(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act==="mclose"){ closeModal(); return; }
  if(act==="msubmit"){ finishExam("submit"); return; }
  if(act==="retake"){ retakeExam(); return; }
  if(act==="check"){ doCheck(); return; }
  if(act==="skip"){ doSkip(); return; }
  if(act==="hint"){ doHint(); return; }
  if(act==="revise"){ doRevise(); return; }
  if(act==="next"){ S.checkPause=false; updateChrome(); if(S.cur<QUESTIONS.length-1) gotoQ(S.cur+1); else openSubmitModal(); return; }
  if(act==="prev"){ if(S.cur>0) gotoQ(S.cur-1); return; }
  if(act==="run"){ var tin=byId("tin-"+q.id); if(tin&&tin.value.trim()){ runTerminal(q,rec,tin.value.trim()); } return; }
  if(act==="chip"){ chipClick(q,rec,tgt); return; }
  if(act==="drop"){ dropTo(q,rec,tgt); return; }
  if(act==="up"||act==="down"){ moveRow(q,rec,act==="up"?-1:1,Number(tgt.dataset.pos)); return; }
  if(act==="cls"){ var ri=Number(tgt.dataset.r); rec.val[ri]=Number(tgt.dataset.v);
    tgt.parentElement.querySelectorAll(".tbtn").forEach(function(b){ b.setAttribute("aria-pressed",String(Number(b.dataset.r)===ri&&Number(b.dataset.v)===rec.val[ri])); }); return; }
}
function handleInput(act,tgt){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(act==="tin"){ rec.val.cmd=tgt.value; return; }
  if(act==="lfilter"){ var f=tgt.value.toLowerCase();
    document.querySelectorAll("#exarea .logline").forEach(function(l){
      l.classList.toggle("off", f!=="" && l.textContent.toLowerCase().indexOf(f)<0); }); return; }
}
function handleChange(act,tgt){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(act==="opt"){ if(q.t==="qcm"){ rec.val=Number(tgt.value);
      document.querySelectorAll('#ansbody input[name="a-'+q.id+'"]').forEach(function(x){ x.closest(".opt").classList.toggle("sel",x.checked); }); }
    else { var set=new Set(rec.val||[]); if(tgt.checked) set.add(Number(tgt.value)); else set.delete(Number(tgt.value)); rec.val=Array.from(set); }
    return; }
  if(act==="popt"){ var pi=Number(tgt.dataset.part); rec.val[pi]=Number(tgt.value);
    document.querySelectorAll('#ansbody input[name="a-'+q.id+'-'+pi+'"]').forEach(function(x){ x.closest(".opt").classList.toggle("sel",x.checked); });
    if(q.seq){ var box=tgt.closest(".partsbox"); var next=box.nextElementSibling;
      if(next&&next.classList.contains("partsbox")) next.classList.remove("hiddenp"); }
    return; }
  if(act==="tsel"){ var r=Number(tgt.dataset.r); rec.val[r]=tgt.value===""?null:Number(tgt.value); return; }
  if(act==="bsel"){ rec.val[Number(tgt.dataset.b)]=tgt.value; return; }
}

/* ---------- drag & drop / click-to-place ---------- */
var selChip=null;
function chipClick(q,rec,tgt){
  if(rec.status==="checked") return;
  var oid=Number(tgt.dataset.oid);
  if(tgt.closest(".slot")){ /* placed chip in a match row: send back */
    var li=Number(tgt.closest(".slot").dataset.l);
    delete rec.val.pair[li]; tgt.closest(".slot").innerHTML=""; clearSel(); return;
  }
  if(tgt.closest(".dropzone")){ rec.val.bin[oid]=-1; tgt.remove(); clearSel(); return; }
  if(selChip===tgt){ clearSel(); return; }
  clearSel(); selChip=tgt; tgt.classList.add("sel"); tgt.setAttribute("aria-pressed","true");
}
function clearSel(){ if(selChip){ selChip.classList.remove("sel"); selChip.removeAttribute("aria-pressed"); selChip=null; } }
function dropTo(q,rec,tgt){
  if(!selChip||rec.status==="checked") return;
  var oid=Number(selChip.dataset.oid);
  var slot=tgt.classList.contains("slot")?tgt:tgt.closest(".slot");
  var zone=tgt.classList.contains("dropzone")?tgt:tgt.closest(".dropzone");
  if(slot&&tgt.closest(".mrow")){ var li=Number(slot.dataset.l);
    for(var k in rec.val.pair){ if(rec.val.pair[k]===oid) delete rec.val.pair[k]; }
    rec.val.pair[li]=oid; slot.appendChild(selChip); clearSel(); return; }
  if(zone){ var bi=Number(zone.dataset.bin); rec.val.bin[oid]=bi; zone.appendChild(selChip); clearSel(); return; }
}
function runTerminal(q,rec,cmd){
  rec.val.cmd=cmd;
  var out=byId("tout-"+q.id); if(!out) return;
  var ok=termAccept(q,cmd);
  out.textContent += "\n"+(q.term.prompt||"$")+" "+cmd+"\n";
  if(ok){ out.textContent += (q.term.out||"ok")+"\n"; rec.val.ok=true; }
  else { out.textContent += "(no output — the command produced nothing useful; check flags and target)\n"; rec.val.ok=false; }
  out.scrollTop=out.scrollHeight;
  var tin=byId("tin-"+q.id); if(tin){ tin.value=""; rec.val.cmd=cmd; }
}
function moveRow(q,rec,delta,pos){
  var list=rec.val.list, j=pos+delta;
  if(j<0||j>=list.length) return;
  var t=list[pos]; list[pos]=list[j]; list[j]=t;
  renderQ();
}

document.addEventListener("click",function(ev){
  var tgt=ev.target.closest("[data-act]");
  if(!tgt) return;
  var act=tgt.dataset.act;
  var passthrough=["opt","popt","tsel","bsel","tin","lfilter"];
  if(passthrough.indexOf(act)>=0) return;
  ev.preventDefault();
  if(act==="pause"){ pauseManual(); return; }
  if(act==="resume"){ pauseManual(); return; }
  if(act==="submit"){ openSubmitModal(); return; }
  if(tgt.closest("#exarea")||tgt.closest("#results")||tgt.closest("#mbox")||tgt.closest("#intro")||tgt.id==="btnResume"){ handleAction(act,tgt,ev); }
});
document.addEventListener("change",function(ev){
  var tgt=ev.target.closest("[data-act]"); if(!tgt) return;
  var act=tgt.dataset.act;
  if(act==="opt"||act==="popt"||act==="tsel"||act==="bsel") handleChange(act,tgt);
});
document.addEventListener("input",function(ev){
  var tgt=ev.target.closest("[data-act]"); if(!tgt) return;
  handleInput(tgt.dataset.act,tgt);
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.classList&&ev.target.classList.contains("tin")){
    ev.preventDefault(); var qi=S.order[S.cur],q=QUESTIONS[qi],rec=S.ans[q.id];

});
document.addEventListener("dragstart",function(ev){
  var c=ev.target.closest(".chip"); if(!c) return;
  ev.dataTransfer.setData("text/plain",c.dataset.oid); selChip=c; c.classList.add("sel");
});
document.addEventListener("dragover",function(ev){
  var z=ev.target.closest("[data-act='drop']"); if(z){ ev.preventDefault(); z.classList.add("over"); }
});
document.addEventListener("dragleave",function(ev){
  var z=ev.target.closest("[data-act='drop']"); if(z) z.classList.remove("over");
});
document.addEventListener("drop",function(ev){
  var z=ev.target.closest("[data-act='drop']"); if(!z) return;
  ev.preventDefault();
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(!selChip){ var oid=Number(ev.dataTransfer.getData("text/plain")); selChip=document.querySelector('#exarea .chip[data-oid="'+oid+'"]'); }
  dropTo(q,rec,z);
  document.querySelectorAll(".over").forEach(function(x){x.classList.remove("over");});
});

byId("btnSubmit").addEventListener("click",function(){ openSubmitModal(); });
byId("btnResume").addEventListener("click",pauseManual);
document.getElementById("nav").addEventListener("click",function(ev){

function renderNavDots(){
  var h="";
  S.order.forEach(function(qi,pos){ h+='<button type="button" class="dot" data-pos="'+pos+'" aria-label="Go to question '+(pos+1)+'" title="Question '+(pos+1)+'">'+(pos+1)+'</button>'; });
  byId("nav").innerHTML=h;
  updateChrome();
}
