<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CySA+ — Chapter 03 — HARD practice exam (v5.0)</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "cysa-plus",
  "chapter": 3,
  "title": "Operational Visibility & Secure Architecture — HARD (v5.0)",
  "difficulty": "hard",
  "questionCount": 36,
  "estimatedMinutes": 63,
  "passMark": 70
}
</script>
<style>
:root{
  --bg:#060a12; --bg2:#0a111c; --panel:#0d1522; --panel2:#111c2c; --panel3:#16243a;
  --line:#1d2c42; --line2:#28405e; --txt:#dbe6f5; --dim:#8ea3bd; --dim2:#63799a;
  --cyan:#22d3ee; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  --violet:#a78bfa; --pink:#f472b6; --lime:#a3e635;
  --mcq:#22d3ee; --dd:#a78bfa; --ord:#f472b6; --log:#a3e635;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, #10233b 0%, transparent 60%),
    radial-gradient(900px 500px at 92% 4%, #1a1230 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--sans); font-size:15px; line-height:1.55;
  min-height:100vh;
}
#app{max-width:1220px;margin:0 auto;padding:18px 16px 70px}
a{color:var(--cyan)}
h1,h2,h3,h4{line-height:1.22;margin:0 0 8px}
h1{font-size:26px;letter-spacing:.2px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:6px 0}
code,kbd{font-family:var(--mono);font-size:13px}
.mono{font-family:var(--mono);font-size:13px}
.dim{color:var(--dim)}
.dim2{color:var(--dim2)}
.small{font-size:12.5px}
.center{text-align:center}
.hidden{display:none !important}

/* ---------- generic panels ---------- */
.card{
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
  border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:14px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.card.tight{padding:12px 14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row.between{justify-content:space-between;align-items:center}
.grow{flex:1 1 320px;min-width:280px}

/* ---------- badges / chips ---------- */
.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);
  background:#0c1a2a;color:var(--cyan);
}
.badge.green{color:var(--green);border-color:#1d5c39;background:#08210f}
.badge.red{color:var(--red);border-color:#6b2026;background:#250a0e}
.badge.amber{color:var(--amber);border-color:#6b4a12;background:#261a05}
.badge.violet{color:var(--violet);border-color:#4b3a78;background:#181233}
.badge.grey{color:var(--dim);border-color:var(--line)}
.badge.pink{color:var(--pink);border-color:#7a2b52;background:#2a0f1e}
.badge.lime{color:var(--lime);border-color:#4c6516;background:#1b2408}

/* ---------- exercise blocks: scenario / artifact / question / answer ---------- */
.blk{border-radius:11px;padding:12px 14px;margin:11px 0;border:1px solid var(--line);position:relative}
.blk>.tag{
  display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;padding:2px 8px;border-radius:6px;
}
.blk .tag .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.blk.scn{background:linear-gradient(180deg,#0c1c2c,#0a1522);border-left:4px solid var(--cyan)}
.blk.scn>.tag{background:#0b2b39;color:var(--cyan)}
.blk.scn>.tag .dot{background:var(--cyan)}
.blk.art{background:#080e17;border-left:4px solid var(--violet)}
.blk.art>.tag{background:#1d1637;color:var(--violet)}
.blk.art>.tag .dot{background:var(--violet)}
.blk.ask{background:linear-gradient(180deg,#241a06,#1a1204);border-left:4px solid var(--amber)}
.blk.ask>.tag{background:#3a2a07;color:var(--amber)}
.blk.ask>.tag .dot{background:var(--amber)}
.blk.ask .qtext{font-size:16px;font-weight:600;color:#ffe9bd}
.blk.ans{background:linear-gradient(180deg,#08210f,#061a0c);border-left:4px solid var(--green)}
.blk.ans>.tag{background:#0d3a1c;color:var(--green)}
.blk.ans>.tag .dot{background:var(--green)}
.blk.fb{border-left:4px solid var(--line2);background:#0b1420}
.blk.fb.ok{border-left-color:var(--green);background:#071c0f}
.blk.fb.no{border-left-color:var(--red);background:#220a0e}
.art pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.6px;color:#c8d8ee}

/* ---------- options (mcq / multi) ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);
  border-radius:9px;background:#0b1524;cursor:pointer;transition:.14s;user-select:none;
}
.opt:hover{border-color:var(--cyan);background:#0d1e2f;transform:translateX(2px)}
.opt .mark{
  flex:0 0 20px;height:20px;border:2px solid var(--dim2);border-radius:50%;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#04121a;
}
.opt.multi .mark{border-radius:5px}
.opt.sel{border-color:var(--cyan);background:#0c2636}
.opt.sel .mark{background:var(--cyan);border-color:var(--cyan)}
.opt.ok{border-color:var(--green);background:#08210f}
.opt.ok .mark{background:var(--green);border-color:var(--green)}
.opt.no{border-color:var(--red);background:#26090d}
.opt.no .mark{background:var(--red);border-color:var(--red)}
.opt.miss{border-color:var(--green);border-style:dashed;background:#07190d}
.opt .lbl{font-weight:800;color:var(--dim2);font-size:12px;min-width:14px}
.opt:focus-visible,.chip:focus-visible,.drop:focus-visible,.mzone:focus-visible,.slot:focus-visible,
.navb:focus-visible,.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- chips (drag sources) ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line2);border-radius:10px;background:#0a1220;min-height:50px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;cursor:grab;
  background:#152539;border:1px solid var(--line2);font-size:13px;color:var(--txt);
  transition:.13s;touch-action:manipulation;
}
.chip:hover{border-color:var(--cyan);background:#1b3049}
.chip.sel{border-color:var(--cyan);background:#0f3247;box-shadow:0 0 0 2px rgba(34,211,238,.25)}
.chip.dragging{opacity:.45}
.chip.used{opacity:.35;cursor:default}
.chip.ok{border-color:var(--green);background:#08210f}
.chip.no{border-color:var(--red);background:#26090d}
.chip .x{font-weight:800;color:var(--red);cursor:pointer;padding:0 2px}
.bucketwrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.bucket{flex:1 1 240px;min-width:210px;border:1px solid var(--line2);border-radius:10px;background:#0b1422;padding:9px}
.bucket .bhead{font-weight:700;font-size:13px;color:var(--violet);margin-bottom:7px;border-bottom:1px solid var(--line);padding-bottom:5px}
.drop{min-height:64px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;border-radius:8px;padding:6px;transition:.13s}
.drop.over{background:#132b3f;outline:2px dashed var(--cyan)}
.drop.right{outline:2px solid rgba(34,197,94,.5)}
.drop.wrong{outline:2px solid rgba(239,68,68,.5)}

/* ---------- order / rank list ---------- */
.olist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.olist li{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line2);
  background:#0b1524;border-radius:9px;cursor:grab;
}
.olist li.over{border-color:var(--cyan);background:#12293c}
.olist li.dragging{opacity:.4}
.olist .num{
  flex:0 0 26px;height:26px;border-radius:7px;background:#16273c;color:var(--cyan);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;
}
.olist .mv{display:flex;flex-direction:column;gap:2px;margin-left:auto}
.olist .mv button{
  background:#16273c;border:1px solid var(--line2);color:var(--txt);border-radius:5px;
  cursor:pointer;font-size:10px;line-height:1;padding:3px 6px;
}
.olist .mv button:hover{border-color:var(--cyan);color:var(--cyan)}
.olist li.ok{border-color:var(--green);background:#08210f}
.olist li.no{border-color:var(--red);background:#26090d}

/* ---------- matching ---------- */
.match{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.mcol{flex:1 1 300px;min-width:260px}
.mcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mzone{
  flex:1;min-height:40px;border:1px dashed var(--line2);border-radius:8px;padding:5px;
  display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim2);transition:.13s
}
.mzone.over{border-color:var(--cyan);background:#12293c}
.mzone.filled{border-style:solid;border-color:var(--line2)}
.mzone.right{border-color:var(--green)}
.mzone.wrong{border-color:var(--red)}
.mlabel{flex:0 0 44%;font-size:13px;color:var(--txt);background:#0b1524;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}

/* ---------- fill in the blank ---------- */
.filltext{
  font-family:var(--mono);font-size:13.4px;line-height:2.15;background:#080e17;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;color:#c8d8ee
}
.slot{
  display:inline-block;min-width:118px;min-height:26px;margin:0 4px;padding:2px 9px;border-radius:7px;
  border:1px dashed var(--cyan);background:#0c2334;text-align:center;color:var(--cyan);font-weight:700;
  cursor:pointer;vertical-align:middle;
}
.slot.over{background:#123c52;border-style:solid}
.slot.filled{border-style:solid;background:#0e3242}
.slot.ok{border-color:var(--green);background:#08210f;color:var(--green)}
.slot.no{border-color:var(--red);background:#26090d;color:var(--red)}

/* ---------- terminal ---------- */
.term{background:#04070c;border:1px solid #1d3a2e;border-radius:10px;padding:0;overflow:hidden;font-family:var(--mono)}
.term .tbar{background:#0a1712;padding:6px 10px;font-size:11.5px;color:var(--green);border-bottom:1px solid #14291f;display:flex;gap:8px;align-items:center}
.term .tbody{padding:12px;font-size:13px;color:#b9f5cf;min-height:110px;white-space:pre-wrap}
.term .tline{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #14291f;background:#060c09}
.term input{
  flex:1;background:#04070c;border:1px solid #1d3a2e;color:#b9f5cf;font-family:var(--mono);
  font-size:13px;padding:8px 10px;border-radius:7px;outline:none
}
.term input:focus{border-color:var(--green)}
.term .ps1{color:var(--lime);font-weight:700}

/* ---------- log viewer ---------- */
.logview{background:#070b11;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0b1220;border-bottom:1px solid var(--line)}
.logbar input{
  flex:1;background:#070d16;border:1px solid var(--line2);border-radius:7px;color:var(--txt);
  padding:6px 9px;font-family:var(--mono);font-size:12.5px;outline:none
}
.logbar input:focus{border-color:var(--lime)}
.loglines{max-height:330px;overflow:auto;padding:8px 4px;font-family:var(--mono);font-size:12.4px}
.loglines .ln{display:flex;gap:9px;padding:2px 8px;border-left:3px solid transparent;white-space:pre-wrap;word-break:break-word}
.loglines .ln .no{color:#3d5170;flex:0 0 30px;text-align:right;user-select:none}
.loglines .ln.info{border-left-color:#1d3a5e}
.loglines .ln.warn{border-left-color:var(--amber);background:rgba(245,158,11,.06)}
.loglines .ln.crit{border-left-color:var(--red);background:rgba(239,68,68,.08)}
.loglines .ln.hit{background:rgba(163,230,53,.10)}
.hitmark{background:rgba(163,230,53,.22);outline:1px solid rgba(163,230,53,.45);border-radius:3px}
.hip{color:var(--cyan)}.hdm{color:var(--pink)}.hts{color:var(--dim2)}.hev{color:var(--violet);font-weight:700}

/* ---------- spot the mistake (clickable lines) ---------- */
.slines{list-style:none;margin:8px 0 0;padding:0;font-family:var(--mono);font-size:12.6px}
.slines li{
  display:flex;gap:10px;padding:5px 9px;border:1px solid transparent;border-radius:6px;cursor:pointer;
  white-space:pre-wrap;word-break:break-word
}
.slines li:hover{background:#101d2e;border-color:var(--line2)}
.slines li .no{color:#3d5170;flex:0 0 26px;text-align:right;user-select:none}
.slines li.pick{background:#3a2a07;border-color:var(--amber)}
.slines li.ok{background:#08210f;border-color:var(--green)}
.slines li.no{background:#26090d;border-color:var(--red)}
.slines li.miss{background:#07190d;border-color:var(--green);border-style:dashed}

/* ---------- queue table ---------- */
.qt{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.qt th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line2);padding:6px 8px}
.qt td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
.qt tr:hover td{background:#0c1725}
.qt select{
  background:#0b1524;color:var(--txt);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12.5px;outline:none;max-width:230px
}
.qt select:focus{border-color:var(--cyan)}
.qt select.ok{border-color:var(--green);background:#08210f}
.qt select.no{border-color:var(--red);background:#26090d}

/* ---------- branch ---------- */
.step{border-left:3px solid var(--violet);padding-left:12px;margin:10px 0}
.step .sq{font-weight:600;color:#e6dcff}
.bfb{font-size:12.6px;padding:7px 9px;border-radius:8px;margin-top:6px}
.bfb.ok{background:#08210f;border:1px solid #1d5c39}
.bfb.no{background:#26090d;border:1px solid #6b2026}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;cursor:pointer;
  font-weight:700;font-size:13.5px;border:1px solid var(--line2);background:#152539;color:var(--txt);
  transition:.14s;font-family:inherit;
}
.btn:hover{border-color:var(--cyan);background:#1b3049;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,#0e7490,#0891b2);border-color:#22d3ee;color:#02141b}
.btn.primary:hover{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.btn.green{background:#0d3a1c;border-color:var(--green);color:#c9f7d8}
.btn.red{background:#3a1015;border-color:var(--red);color:#fbd5d8}
.btn.amber{background:#3a2a07;border-color:var(--amber);color:#fde9c0}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- header / HUD ---------- */
.hud{position:sticky;top:0;z-index:40;background:rgba(6,10,18,.93);backdrop-filter:blur(7px);border-bottom:1px solid var(--line);padding:9px 0;margin:-18px -16px 12px;padding-left:16px;padding-right:16px}
.hudgrid{display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:1220px;margin:0 auto}
.hud .stat{font-size:12px;color:var(--dim)}
.hud .stat b{display:block;font-size:17px;color:var(--txt);font-variant-numeric:tabular-nums}
.hud .stat.timer b{color:var(--cyan)}
.hud .stat.timer.low b{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{height:8px;background:#101c2c;border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:160px;flex:1 1 180px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0891b2,#22d3ee);transition:width .35s}
.bar.score>i{background:linear-gradient(90deg,#15803d,#22c55e)}

/* ---------- navigator ---------- */
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.navb{
  border:1px solid var(--line2);background:#0b1524;color:var(--dim);border-radius:7px;padding:5px 0;
  font-size:12px;font-weight:700;cursor:pointer;transition:.12s;font-family:inherit
}
.navb:hover{border-color:var(--cyan);color:var(--cyan)}
.navb.cur{outline:2px solid var(--cyan);color:var(--cyan)}
.navb.ok{background:#08210f;border-color:#1d5c39;color:var(--green)}
.navb.no{background:#26090d;border-color:#6b2026;color:var(--red)}
.navb.skip{background:#3a2a07;border-color:#6b4a12;color:var(--amber)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);margin-top:10px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}

/* ---------- keywords panel ---------- */
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:10px}
.kwtheme{border:1px solid var(--line);border-radius:10px;background:#0a1220;padding:10px 12px}
.kwtheme h4{font-size:12.5px;color:var(--violet);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.kwtheme .kw{display:inline-block;font-size:11.6px;padding:2px 7px;margin:2px 3px 2px 0;border-radius:6px;background:#132135;color:#bcd2ea;border:1px solid #1d2c42}

/* ---------- progress ring / theme bars ---------- */
.tbar{margin:7px 0}
.tbar .tl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.tbar .tb{height:7px;background:#101c2c;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.tbar .tb>i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .3s}

/* ---------- results ---------- */
.cert{
  border:2px solid var(--green);border-radius:16px;padding:24px;text-align:center;
  background:radial-gradient(600px 200px at 50% 0%,#0d3a1c,#071409);box-shadow:0 0 40px rgba(34,197,94,.18)
}
.cert.fail{border-color:var(--red);background:radial-gradient(600px 200px at 50% 0%,#3a1015,#170709);box-shadow:0 0 40px rgba(239,68,68,.18)}
.cert .big{font-size:52px;font-weight:900;letter-spacing:.02em;margin:6px 0}
.cert .pct{font-size:22px;color:var(--dim)}
.rep{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:#0a1220}
.rep.ok{border-left:4px solid var(--green)}
.rep.no{border-left:4px solid var(--red)}
.rep.skip{border-left:4px solid var(--amber)}
.rep.part{border-left:4px solid var(--amber)}
.rep .rhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.answerbox{background:#080e17;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:7px 0;font-size:13px}
.answerbox b{color:var(--cyan)}
.tip{background:#1b1204;border:1px solid #6b4a12;border-radius:8px;padding:8px 11px;font-size:13px;margin-top:7px;color:#fde9c0}
.kbd{font-family:var(--mono);background:#132135;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:12px}
details summary{cursor:pointer;color:var(--cyan);font-weight:600}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0}
.warnbox{background:#2a1a05;border:1px solid var(--amber);border-radius:10px;padding:10px 13px;margin:10px 0;color:#fde9c0}

/* pause overlay */
.qwrap{position:relative}
.qwrap.blurred .qcontent{filter:blur(11px) saturate(.5);pointer-events:none;user-select:none}
.pauseov{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,8,14,.72);border-radius:12px;z-index:20;gap:10px;text-align:center
}
.pauseov .pz{font-size:34px;font-weight:900;color:var(--amber);letter-spacing:.1em}

@media (max-width:820px){
  body{font-size:14.4px}
  #app{padding:12px 10px 60px}
  .hud{margin:-12px -10px 10px;padding-left:10px;padding-right:10px}
  .hud .stat b{font-size:15px}
  h1{font-size:21px}
  .blk.ask .qtext{font-size:15px}
  .mlabel{flex:0 0 100%}
  .mrow{flex-wrap:wrap}
}

"use strict";
const LEVEL={"name":"HARD","perQuestionSeconds":105,"blurb":"HARD severity. The same objective, but every exercise is built on ambiguous artefacts, conflicting sources, near-miss answers and cases where the obvious answer is wrong: signed tools used during a change window, an IPv6 rule nobody read, packet captures that look like a ping, a legal hold that outranks tidiness, container settings that own the node, and containment that missed a second network path. Each exercise carries a labelled SCENARIO block, a labelled QUESTION block and a labelled answer block."};
const PASS=70;
const MAXHINTS=2;
const EXERCISE_META={"topicId":"cysa-plus","chapter":3,"title":"Operational Visibility & Secure Architecture — HARD (v5.0)","difficulty":"hard","questionCount":36,"estimatedMinutes":63,"passMark":70};
/* Lesson 3.3 - CySA+ CS0-003 Objective 1.1 - HARD - data (v5.0 schema) */
const KEYWORDS=[{"t":"Network Segmentation & Secure Design","w":["Network segmentation","Microsegmentation","VLAN","DMZ / screened subnet","Air gap","East-west traffic","North-south traffic","Zero trust architecture","Defense in depth","Least privilege","Attack surface","SDN (software-defined networking)","Bastion host / jump box","Honeypot","NAC (network access control)","802.1X","Enclave","Threat modeling"]},{"t":"Perimeter, Protocols & Secure Channels","w":["Stateful firewall","NGFW","WAF","Reverse proxy","Forward proxy","Load balancer","VPN","Site-to-site VPN","Split tunneling","IPSec","TLS inspection","DNSSEC","DNS sinkhole","SPAN port","Network TAP","NetFlow","SASE","ZTNA","SD-WAN"]},{"t":"Cloud & Virtualization Architecture","w":["VPC","Public / private subnet","Security group","Network ACL","Cloud IAM","CASB","CSPM","Serverless","Containers","Kubernetes orchestration","Infrastructure as code","Shared responsibility model","Cloud flow logs","Cloud storage permissions","Hypervisor","Snapshots"]},{"t":"Identity, Access & Authentication","w":["AAA","MFA","SSO","PAM (privileged access management)","LDAP","RADIUS","TACACS+","Kerberos","SAML","OAuth","OIDC","RBAC","ABAC","Conditional access","Service accounts","Kerberoasting"]},{"t":"Data Protection & Compliance","w":["Data classification","Encryption at rest","Encryption in transit","Tokenization","Data masking","DLP","Data sovereignty / residency","GDPR","PCI DSS","HIPAA","SOX","NIST CSF","ISO 27001","Data / log retention","PII / PHI"]},{"t":"Resilience, Availability & Recovery","w":["High availability","Clustering","Failover","Redundancy","Backup types","RTO","RPO","MTTR","MTBF","DR site (hot / warm / cold)","Business continuity","Immutable backups","UPS / generator","RAID"]},{"t":"Visibility, Monitoring & Logging","w":["SIEM","Log aggregation","Syslog","NTP time sync","EDR","XDR","NDR","UEBA","SOAR","Full packet capture","Asset inventory / CMDB","SBOM","Telemetry","Alert tuning / false positives","Honeytoken","DNS logs","Authentication logs","HIDS / HIPS"]},{"t":"Endpoint, OT/IoT & Attack Surface","w":["Application allowlisting","Host firewall","Sandboxing","Patching","Secure baseline / configuration management","Change management","IoT","OT / ICS / SCADA","Purdue model","Legacy systems","Shadow IT","Vulnerability scanning vs penetration test"]},{"t":"Email, PKI & Web Security","w":["SPF","DKIM","DMARC","Secure email gateway","HSTS","Certificate pinning","PKI / certificate management","Cipher suites"]}];

const EXERCISES=[{"id":"H01","theme":"Visibility, Monitoring & Logging","pts":3,"title":"02:47 - signed admin tool touching lsass during a change window","kw":["edr","authlogs","changemgmt","alerttuning","leastprivilege"],"scenario":"At 02:47 the EDR console raises a critical alert on domain controller DC-01. A signed Microsoft admin tool (PsExec64.exe, valid signature, timestamped yesterday) opened lsass memory. The parent process is a service account named svc-backup. A change ticket is open: CHG-88112, 'backup software upgrade', window 02:00-04:00, approved, engineer r.okoro. Two analysts want to close the alert as authorised change.","type":"branch","start":"s1","steps":[{"id":"s1","q":"Step 1 - What is the decisive first check, before you trust the change ticket?","options":[{"t":"Compare the source host in the authentication log with the host named in the change plan","ok":true,"fb":"Correct. The ticket authorises work from BK-02 on the management VLAN; the logon came from a marketing laptop, which the ticket does not cover.","next":"s2"},{"t":"Confirm the tool is signed by Microsoft and close the alert as a change activity","ok":false,"fb":"Wrong. Attackers use signed admin tools on purpose so signatures look clean. The signature proves the file, not the intent.","next":"s2"},{"t":"Check whether the engineer r.okoro is on shift tonight","ok":false,"fb":"Wrong. Useful context, but it does not explain why a backup account came from a marketing laptop.","next":"s2"},{"t":"Ask the backup team by email whether they ran the upgrade","ok":false,"fb":"Wrong. Waiting for an email while a privileged account touches lsass gives the attacker time to finish.","next":"s2"}]},{"id":"s2","q":"Step 2 - The account has interactive logon rights, no source restriction and its password is nine years old. What do you do now?","options":[{"t":"Isolate WS-MKT-14 and block interactive logon for svc-backup, while its scheduled backup jobs keep running","ok":true,"fb":"Correct. You cut the attacker path without stopping the backup service, and you preserve both hosts for evidence.","next":"s3"},{"t":"Disable the svc-backup account completely","ok":false,"fb":"Wrong. That stops the backup service and can cause a data protection failure. Block the interactive path instead.","next":"s3"},{"t":"Block the hash of PsExec64.exe across the estate","ok":false,"fb":"Wrong. It is a genuine admin tool used by your own teams, and blocking it will not stop a copy renamed or recompiled.","next":"s3"},{"t":"Reboot DC-01 to clear the suspicious process","ok":false,"fb":"Wrong. A reboot destroys memory evidence and may interrupt authentication for the whole estate.","next":"s3"}]},{"id":"s3","q":"Step 3 - What change to the design prevents this class of event?","options":[{"t":"Restrict where the service account may log on and remove its interactive logon right","ok":true,"fb":"Correct. Least privilege for service accounts: no interactive logon, restricted source hosts, long random secret, monitored."},{"t":"Require the backup team to write more detailed change tickets","ok":false,"fb":"Wrong. Documentation does not stop a credential being used from the wrong host."},{"t":"Add a rule that suppresses lsass alerts during the change window","ok":false,"fb":"Wrong. That is exactly when attackers work. Suppressing by time is how real intrusions get missed."},{"t":"Move the backup software to a cloud service","ok":false,"fb":"Wrong. That may be a good project, but it does not fix who may use the account or from where."}]}],"answerLabel":"Branching scenario - choose at each step","art":{"label":"Evidence pulled before the decision","body":"<pre>EDR: DC-01 process tree: services.exe &gt; svc-backup &gt; PsExec64.exe &gt; lsass access (0x1010)\nEDR: PsExec64.exe signature valid, signed by Microsoft, hash seen on 3 other hosts this year\nTicket: CHG-88112 backup software upgrade, window 02:00-04:00, implemented by r.okoro\nTicket: rollback plan says the work is done from the backup server BK-02 on the management VLAN\nAuth: svc-backup interactive logon type 10 accepted on DC-01 from 10[.]30[.]88[.]131\nAsset: 10[.]30[.]88[.]131 is WS-MKT-14, a marketing laptop, not BK-02\nAuth: svc-backup last used interactively 14 months ago\nChange: no CHG ticket mentions remote administration from a laptop</pre>"},"question":"Decide step by step. Each decision opens the next one.","hint":"A change ticket authorises specific work from specific hosts. Compare the ticket with the log.","explain":"Attackers deliberately use signed administration tools because signature checks pass and the traffic looks like normal admin work. Three things do not fit. The source host is a marketing laptop, not the backup server. The logon type is interactive, which this account has not used for 14 months. And the target is the domain controller itself. The change ticket does not authorise that. Containment must be surgical: cut the interactive path and isolate the workstation, but keep the backup jobs running so you do not create a second incident. The durable fix is least privilege for service accounts - no interactive logon, restricted logon hosts, long random secrets and targeted monitoring.","focus":"Review multi-artefact correlation between EDR, authentication logs and change tickets, and service account least privilege."},
{"id":"H02","theme":"Visibility, Monitoring & Logging","pts":3,"title":"Which flow is the beacon?","kw":["ndr","netflow","eastwest","telemetry","fwdproxy"],"scenario":"The NDR platform ranks five flows from one workstation as unusual. Three of them are normal traffic that looks strange in a short window. Only one is command-and-control. You must point at the single line that is the real beacon - the first outbound contact by any host in the estate to that destination.","type":"spot","answerLabel":"Spot the mistake - click the single wrong line","art":{"label":"Proxy and flow records for 10[.]30[.]44[.]19 (Tuesday)","body":""},"lines":[{"n":1,"t":"10:00:03 10[.]30[.]44[.]19 -&gt; 192[.]0[.]2[.]51:443 bytes=11842204 host=cdn.example.net (single 11 MB update download)","bad":false},{"n":2,"t":"10:04:59 10[.]30[.]44[.]19 -&gt; 91[.]219[.]24[.]11:443 bytes=604 host=a1b2c3d4.sync-node[.]top sni=a1b2c3d4.sync-node[.]top","bad":true},{"n":3,"t":"10:09:57 10[.]30[.]44[.]19 -&gt; 91[.]219[.]24[.]11:443 bytes=611 host=a1b2c3d4.sync-node[.]top sni=a1b2c3d4.sync-node[.]top","bad":false},{"n":4,"t":"10:14:58 10[.]30[.]44[.]19 -&gt; 91[.]219[.]24[.]11:443 bytes=608 host=a1b2c3d4.sync-node[.]top sni=a1b2c3d4.sync-node[.]top","bad":false},{"n":5,"t":"10:19:56 10[.]30[.]44[.]19 -&gt; 91[.]219[.]24[.]11:443 bytes=613 host=a1b2c3d4.sync-node[.]top sni=a1b2c3d4.sync-node[.]top","bad":false},{"n":6,"t":"10:20:01 10[.]30[.]44[.]19 -&gt; 162[.]159[.]200[.]9:123 bytes=76 host=pool.ntp.org (NTP poll, 64 s interval, 214 peers)","bad":false},{"n":7,"t":"10:22:14 10[.]30[.]44[.]19 -&gt; 20[.]190[.]40[.]7:443 bytes=48211 host=updates.microsoft.example (weekly patch check)","bad":false},{"n":8,"t":"10:26:40 10[.]30[.]44[.]19 -&gt; 10[.]30[.]30[.]21:445 bytes=1904 host=fileserver-02 (internal, east-west)","bad":false}],"question":"Click the single line that is the first sign of command-and-control beaconing.","hint":"Jitter, tiny identical payloads and a destination nobody else in the estate contacts - three clues in one line.","explain":"Line 2 starts a run of five contacts to one host at almost exactly five-minute intervals with near-identical small upload sizes and a random-looking subdomain. That pattern is beaconing with jitter. The 11 MB download is a single large transfer, which is the opposite shape. The NTP poll is the most regular traffic in the list, but it is a well-known service used by hundreds of hosts, so it is normal for the estate. The patch check is weekly and expected. The file server line is internal east-west traffic and belongs to the business. Detecting beaconing needs metadata - who talks to whom, how often, how much - which is why flow and proxy telemetry matters even when the traffic is encrypted.","focus":"Review beaconing analysis on flows, jitter, fan-out versus fan-in, and using metadata instead of payload."},
{"id":"H03","theme":"Network Segmentation & Secure Design","pts":3,"title":"Microsegmentation policy for the order platform","kw":["microsegmentation","zerotrust","eastwest","segmentation","sdn","leastprivilege"],"scenario":"The order platform is moving to host-based microsegmentation because the network has no useful internal filtering. The policy tool starts from deny-by-default. The application owner has given you the real dependencies, and one vendor request is still open.","type":"dd","buckets":[{"id":"b0","l":"Allow - the application cannot work without it"},{"id":"b1","l":"Deny by default - not required"},{"id":"b2","l":"Allow only through the API gateway"},{"id":"b3","l":"Temporary exception with an expiry date"}],"items":[{"id":"i1","t":"Web tier to order API on TCP 8443","b":"b0"},{"id":"i2","t":"Web tier to the order database on TCP 5432 (the API already serves this data)","b":"b1"},{"id":"i3","t":"Batch job to the order API on TCP 8443","b":"b0"},{"id":"i4","t":"Marketing workstation to the order database on TCP 5432","b":"b1"},{"id":"i5","t":"Monitoring agent to every node on TCP 9100","b":"b0"},{"id":"i6","t":"Any workload to any workload in the same subnet (legacy catch-all rule)","b":"b1"},{"id":"i7","t":"Vendor support SSH from the internet to a production node, for one week","b":"b3"},{"id":"i8","t":"Data science laptop to a masked read-only replica through the API gateway","b":"b2"}],"answerLabel":"Drag each item into the correct box","question":"Place each proposed flow into the right policy tier.","hint":"Two items are about the same component: one is the API, the other is a direct database path that bypasses it.","explain":"Microsegmentation means every flow is denied unless a policy names it, which is the network half of zero trust. Only real dependencies go in the allow list: the API calls it needs and the monitoring agent. Direct database access from a web tier, from marketing, or a legacy any-to-any rule is removed, because those paths let one compromised workload reach data it never needed. Where a legitimate need exists but not direct reach, you route it through the API gateway so the request is authenticated and audited. Vendor access is never permanent: a time-boxed exception, tied to a ticket, through a bastion, with automatic expiry. The policy is pushed by the SDN controller, and it follows the workload identity rather than the IP address, so it keeps working when hosts move.","focus":"Review deny-by-default policy design, east-west least privilege, time-boxed exceptions and SDN-enforced policy."},
{"id":"H04","theme":"Perimeter, Protocols & Secure Channels","pts":3,"title":"Decision record for TLS inspection","kw":["tlsinspect","certpin","pki","cipher","intransit","hsts"],"scenario":"The architecture board is approving a TLS inspection rollout. You must complete the decision record so that the exceptions and the crypto rules are unambiguous.","type":"fill","text":"The inspection appliance ends the connection, so it must re-sign the traffic with a certificate issued by the corporate {0}. Mobile applications that use certificate {1} will reject the re-signed certificate, so those flows are exempted and inspected on the device instead. Weak {2} such as RC4 and 3DES are refused, along with TLS 1.0 and 1.1, for every inspected and uninspected flow. The {3} response header forces browsers to refuse plain HTTP for the domain and blocks downgrade attacks. Traffic that is exempted from inspection is still protected {4} by the endpoints themselves, which is why the exception list must stay short and reviewed.","slots":[{"a":"certificate authority"},{"a":"pinning"},{"a":"cipher suites"},{"a":"HSTS"},{"a":"in transit"}],"bank":["tokenisation","DNSSEC","SPF","data masking"],"answerLabel":"Fill the blanks - drag a term into each blank","question":"Complete the decision record with the correct terms.","hint":"One answer describes where the encryption happens, not what is used to encrypt.","explain":"TLS inspection is a man-in-the-middle that you own, so it needs its own issuing certificate authority trusted by the clients. Certificate pinning breaks that model, because the app expects one exact certificate. There are two practical answers. Exempt the app and inspect on the device, or give the app a pin set that includes the inspection authority. Weak cipher suites and old protocol versions must be refused on both inspected and uninspected paths, or the strong path is just decoration. HSTS stops downgrade to plain HTTP. Exempted traffic is still encrypted in transit between the two real endpoints; inspection only removes your ability to see inside it.","focus":"Review TLS inspection architecture, pinning conflicts, cipher suite policy, HSTS and the limits of inspection."},
{"id":"H05","theme":"Resilience, Availability & Recovery","pts":3,"title":"Planned failover test for the claims cluster","kw":["clustering","failover","ha","rto","rpo","bc","redundancy","loadbalancer"],"scenario":"The claims database cluster must be failed over during a controlled test. Last year's test corrupted three hours of transactions because the team promoted the standby before the last write was confirmed. The business continuity manager wants the sequence written down correctly this time.","type":"order","items":[{"id":"o1","t":"Confirm the standby node is fully synchronised and record the current RPO"},{"id":"o2","t":"Announce the maintenance window and start the business continuity log"},{"id":"o3","t":"Stop writes on the primary and confirm the last transaction has arrived on the standby"},{"id":"o4","t":"Promote the standby and move the service address on the load balancer to it"},{"id":"o5","t":"Measure the time until the application serves requests and compare it with the RTO"},{"id":"o6","t":"Rebuild the old primary as the new standby and confirm replication has caught up"}],"answerLabel":"Put in order - drag the rows or use the arrows","dirLabel":"First item at the top","question":"Put the failover test steps in the correct order, first step at the top.","hint":"Nothing may be promoted until you know the last write is on the standby.","explain":"The order protects the data. First you prove the standby is current, because that number is your real RPO. Then you open the change and continuity record, so the test is documented for the auditors and for the business. Only then do you stop writes and confirm the final transaction has been replicated - this is the step that failed last year and cost three hours of transactions. Promotion and moving the service address on the load balancer are the failover itself. Immediately after, you measure the actual outage against the RTO, which is the whole point of the test. Rebuilding the old primary restores redundancy; until that is done, the cluster is running with no spare capacity.","focus":"Review cluster failover order, RPO confirmation before promotion, RTO measurement and restoring redundancy."},
{"id":"H06","theme":"Email, PKI & Web Security","pts":3,"title":"Terminal - prove which certificate the service really presents","kw":["pki","cipher","intransit","tlsinspect"],"scenario":"An application team insists their service presents the correct certificate 'because it looks fine in the browser'. Before the audit you must prove, from your own workstation, exactly which certificate chain the service on 10[.]30[.]5[.]14:443 presents. The service is reached by clients as claims-internal.acme.example. Do not install anything and do not change the service.","type":"terminal","accept":["^\\s*openssl\\s+s_client\\b(?=[\\s\\S]*-connect\\s+\\S+:443)(?=[\\s\\S]*-showcerts)"],"host":"soc-ws","prompt":"analyst@soc-ws:~$","expected":"openssl s_client -connect 10[.]30[.]5[.]14:443 -servername claims-internal.acme.example -showcerts","termIntro":"Read the ticket in the scenario, then type the single command that completes the task.","successOutput":"# command accepted - output shape:","failOutput":"# that command does not complete the task. Check the tool, its flags and the target host.","art":{"label":"EXPECTED OUTPUT SHAPE","body":"<pre>Expected output shape:\ndepth=1 C=US, O=Corp Issuing CA 2, CN=Corp Issuing CA 2\ndepth=0 CN=claims-internal.acme.example\n---\nCertificate chain\n 0 s:CN=claims-internal.acme.example\n   i:C=US, O=Corp Issuing CA 2\n 1 s:C=Corp Issuing CA 2\n   i:C=US, O=Corp Root CA\n---\nServer certificate\n-----BEGIN CERTIFICATE-----</pre>"},"answerLabel":"Terminal - type the command","question":"Type the single command that connects to the service and prints the certificate chain it presents.","hint":"You need a tool that speaks TLS directly and can print the whole chain, not just the leaf.","explain":"A browser hides the details: it may show the leaf certificate while the chain is wrong, or it may be trusting a proxy certificate that your laptops have installed. Ask the port for its certificate chain. That shows what the server really sends. You can see whether the intermediate certificate is missing and which authority issued the leaf. This is the classic finding when inspection replaced the real certificate. SNI matters when several sites share one address, because the server chooses the certificate from the name in the handshake. This is a read-only check, so it is safe on a production service and it is the evidence the auditor needs.","focus":"Review certificate chain inspection, PKI trust paths, TLS handshake tools and how inspection changes what a client sees."},
{"id":"H07","theme":"Cloud & Virtualization Architecture","pts":3,"title":"Cloud audit log - three minutes that do not fit","kw":["cloudiam","flowlogs","telemetry","ueba","siem","bucketperm"],"scenario":"The SIEM forwarded a cloud audit log extract for the deployment identity. The nightly pipeline assumes the same roles at 01:00 every day and has done so for 214 days. This extract is from 02:11. Your UEBA baseline has never seen this identity outside 00:55-01:20.","type":"log","logName":"Cloud audit log extract (filtered)","log":[{"t":"01:00:00 user=svc-deploy event=AssumeRole role=ci-runner sourceIp=10[.]31[.]9[.]30 region=eu-west-1 result=Success","lv":"info"},{"t":"02:11:07 user=svc-deploy event=AssumeRole role=ci-runner sourceIp=10[.]31[.]9[.]30 region=eu-west-1 result=Success","lv":"info"},{"t":"02:11:09 role=ci-runner event=AssumeRole role=OrgAdmin sourceIp=10[.]31[.]9[.]30 region=eu-west-1 result=Success","lv":"info"},{"t":"02:11:12 role=OrgAdmin event=PutBucketPolicy bucket=acme-claims-invoices policy=public-read sourceIp=192[.]0[.]2[.]77","lv":"info"},{"t":"02:11:15 role=OrgAdmin event=CreateUser user=svc-reporting sourceIp=192[.]0[.]2[.]77","lv":"info"},{"t":"02:11:20 role=OrgAdmin event=AttachUserPolicy user=svc-reporting policy=AdministratorAccess sourceIp=192[.]0[.]2[.]77","lv":"info"},{"t":"02:11:31 role=OrgAdmin event=CreateAccessKey user=svc-reporting sourceIp=192[.]0[.]2[.]77","lv":"info"},{"t":"02:20:44 user=monitoring event=DescribeInstances region=eu-west-1 sourceIp=10[.]31[.]9[.]31 result=Success (read-only inventory)","lv":"info"},{"t":"03:40:12 user=r.okoro event=ConsoleLogin mfa=true sourceIp=10[.]31[.]9[.]30 result=Success","lv":"info"}],"inner":{"q":"What does this evidence show, and what is the correct first containment step?","options":[{"t":"Role chaining to admin and a backdoor identity: stop the second role and the new user","c":true},{"t":"Normal deployment activity: the pipeline assumed the same role it uses every night","c":false},{"t":"A public bucket misconfiguration: make the bucket private and close the incident","c":false},{"t":"An external attacker working from eu-west-1: block the whole region at the edge","c":false}],"hint":"Follow the chain of identities, and note where the source IP changes inside one session.","explain":"The pipeline normally assumes ci-runner at 01:00. Here the same identity starts again at 02:11. It then assumes a second and much more powerful role. That is role chaining. The calls after that come from a different source IP than the one that started the chain. That mix of unusual time, privilege escalation and a mid-session address change is the shape of a stolen credential being used, not of a deployment. The public bucket policy and the new user are consequences: the attacker opened a path in and created an identity that survives a password reset. Containment therefore targets the chain: cut the ability to assume the admin role and disable the new identity, then check what else the session touched. Blocking a region or closing a bucket ticket leaves the attacker's access key alive.","focus":"Review cloud IAM role chaining, backdoor identities, source-IP change inside a session and cloud audit telemetry.","answerLabel":"Read the log, then choose one"},"answerLabel":"Read the log, then choose one","question":"What does this evidence show, and what is the correct first containment step?","hint":"Follow the chain of identities, and note where the source IP changes inside one session.","explain":"The pipeline normally assumes ci-runner at 01:00. Here the same identity starts again at 02:11. It then assumes a second and much more powerful role. That is role chaining. The calls after that come from a different source IP than the one that started the chain. That mix of unusual time, privilege escalation and a mid-session address change is the shape of a stolen credential being used, not of a deployment. The public bucket policy and the new user are consequences: the attacker opened a path in and created an identity that survives a password reset. Containment therefore targets the chain: cut the ability to assume the admin role and disable the new identity, then check what else the session touched. Blocking a region or closing a bucket ticket leaves the attacker's access key alive.","focus":"Review cloud IAM role chaining, backdoor identities, source-IP change inside a session and cloud audit telemetry."},
{"id":"H08","theme":"Visibility, Monitoring & Logging","pts":3,"title":"The resolver that never saw the query (blue and red view)","kw":["dnssinkhole","dnslogs","dnssec","ndr","zerotrust"],"scenario":"An endpoint protection alert says a workstation ran a loader that resolved a known malicious domain for the first time today. The internal resolver log for that workstation has no entry for the domain. The resolver blocks known bad domains with a sinkhole and validates DNSSEC on every query.","type":"dual","alabel":"Blue team","blabel":"Red team","a":{"q":"Blue team: which single explanation best fits a first-time resolution with no resolver entry?","options":[{"t":"The endpoint sent its query to an external resolver over an encrypted channel","c":true},{"t":"The domain is DNSSEC signed, so the resolver validated it without logging","c":false},{"t":"The sinkhole answered NXDOMAIN and the resolver deleted the log entry","c":false},{"t":"The endpoint used a cached answer, so no query was made today at all","c":false}]},"b":{"q":"Red team: which technique keeps name resolution working while hiding the query from the internal resolver?","options":[{"t":"Send the queries to a public resolver over an encrypted channel","c":true},{"t":"Add the domain to the local hosts file on the workstation","c":false},{"t":"Ask the domain controller to resolve the name instead of the resolver","c":false},{"t":"Set a very long time-to-live so the domain stays cached for weeks","c":false}]},"answerLabel":"Blue team then red team","question":"Answer both parts: what the blue team must understand, and how the red team caused the blind spot.","hint":"The sinkhole and DNSSEC work perfectly. The question is which resolver the packet reached.","explain":"This is the visibility gap that catches experienced analysts: the sinkhole is healthy and DNSSEC validation is on, but both only apply to queries that reach your resolver. An application can send DNS over HTTPS or DNS over TLS. It talks straight to a public resolver on port 443 or 853. The query never reaches your resolver, so it never appears in your DNS logs. The sinkhole never gets a chance to redirect it. A first-time resolution rules out caching, and DNSSEC validation is a security check, not a logging behaviour. Defences: block direct outbound DNS from endpoints so only your resolver answers, control the encrypted-DNS endpoints, inspect or allow-list destinations, and detect hard-coded resolver addresses. Under zero trust, name resolution is a control point, not a background service.","focus":"Review encrypted DNS (DoH/DoT) blind spots, sinkhole and DNSSEC limits, and DNS as a zero trust control point."},
{"id":"H09","theme":"Data Protection & Compliance","pts":3,"title":"One data set, four countries, four rules","kw":["sovereignty","gdpr","tokenization","masking","dlp","retention","dataclass","pii"],"scenario":"A group sells insurance in Germany, Brazil and the United States. The data protection officer lists handling rules; each rule must be matched to the control that implements it. Classifying the data first is what makes the rest of the list possible.","type":"dd","buckets":[{"id":"b0","l":"Tokenise - do not store the value"},{"id":"b1","l":"Mask in the user interface only"},{"id":"b2","l":"Keep processing inside the approved region"},{"id":"b3","l":"Delete when the retention period ends"},{"id":"b4","l":"Alert on export (DLP)"}],"items":[{"id":"i1","t":"The card number is only needed to confirm a payment already taken","b":"b0"},{"id":"i2","t":"A support agent must see the last four digits of the card to verify a caller","b":"b1"},{"id":"i3","t":"German customer health data is analysed by a team based in the United States","b":"b2"},{"id":"i4","t":"Call recordings are kept for quality checks after the complaint is closed","b":"b3"},{"id":"i5","t":"A finance analyst copies 40,000 customer rows to a personal cloud drive","b":"b4"},{"id":"i6","t":"Audit records must be kept intact for seven years under financial rules","b":"b3"},{"id":"i7","t":"An EU subscriber list is shared with a marketing partner in Brazil","b":"b2"}],"answerLabel":"Drag each item into the correct box","question":"Drag each rule to the control that implements it.","hint":"Two rules are about the same idea: where the data may go, and how long it may stay.","explain":"Classification decides everything else. Classify the data first, and the controls follow. Remove what you do not need: that is tokenisation. Show only what the task needs: that is masking. Keep transfers inside approved regions. That is data sovereignty, and it is why cross-border GDPR transfers are hard. Delete the data when the retention period ends. Keeping call recordings forever is itself a breach risk. Financial records have their own legal minimum. DLP is the detective control for movement, and the realistic loss path is a person copying rows to a personal drive rather than a network intruder.","focus":"Review data classification driving handling rules, GDPR transfers, tokenisation versus masking, retention and DLP."},
{"id":"H10","theme":"Endpoint, OT/IoT & Attack Surface","pts":3,"title":"Risk ranking with compensating controls","kw":["vulnscan","attacksurface","patching","baseline","cmdb","sbom","nistcsf"],"scenario":"The vulnerability review board meets with five open findings. Two of them are the same library vulnerability from the same SBOM entry, and one asset has compensating controls that most scanners do not know about. The board wants the fix order, not the CVSS order.","type":"rank","items":[{"id":"o1","t":"1 - VPN appliance: internet-facing RCE with public exploit code and no compensating control"},{"id":"o2","t":"2 - Claims API: vulnerable library, public proof of concept, reachable from the user VLAN"},{"id":"o3","t":"3 - CI build server: same vulnerability, but reachable only from three build hosts"},{"id":"o4","t":"4 - File server: patch missing for a service that is not installed and is blocked by the host firewall"},{"id":"o5","t":"5 - Workstation image: patch missing for a component absent on almost every endpoint"}],"answerLabel":"Rank by priority - drag the rows or use the arrows","dirLabel":"Rank 1 = the item you would act on first","art":{"label":"Findings and context","body":"<pre>1. VPN appliance: remote code execution, exploit code public, reachable from the internet, no compensating control\n2. Claims API: vulnerable library from the SBOM, public proof of concept, reachable from the user VLAN, no WAF rule covers the path\n3. CI build server: same library and CVE, reachable only from the build VLAN, network ACL limits sources to three build hosts\n4. File server: missing patch for a service that the secure baseline shows is not installed and the host firewall blocks\n5. Workstation image: missing patch for a component that the baseline says is absent on 98% of the fleet</pre>"},"question":"Set the fix order for these five findings, the one you would patch first at the top.","hint":"Two findings share a CVE. What separates them is reachability and the controls in the path.","explain":"Ranking by CVSS alone would put the build server above the claims API, because the same library is equally severe on both. Real risk adds exposure and the controls in the path. The claims API is reachable from the whole user VLAN, and a working proof of concept exists. The build server has the same flaw, but an ACL limits it to three hosts. So the build server waits. The VPN appliance goes first because it is internet-facing, has public exploit code and no compensating control - that combination is the definition of an emergency. The last two are the same patch with different real exposure: the baseline shows the affected service is not installed, and the host firewall blocks it, so the practical risk is near zero. This is the NIST CSF idea of understanding the asset and the environment before you prioritise.","focus":"Review risk-based prioritisation with compensating controls, exposure, SBOM component context and baseline facts."},
{"id":"H11","theme":"Network Segmentation & Secure Design","pts":3,"title":"Zero trust migration - fill in the target design","kw":["zerotrust","ztna","conditionalaccess","mfa","microsegmentation","sase"],"scenario":"The board has approved a zero trust programme. You must complete the target architecture paragraph so the delivery teams build the same thing.","type":"fill","text":"Before every request is allowed, the policy engine checks three things: the identity, the device {0} and the context of the request. Instead of placing users on the network with a VPN, {1} grants access to a single application at a time. {2} rules deny traffic between workloads unless a policy names the pair, so a compromised service cannot move sideways. Sign-in risk feeds {3} so that a risky session must satisfy another factor before access is granted. Because the security stack moves into the cloud alongside the network service, the target architecture is described as {4}.","slots":[{"a":"posture"},{"a":"ZTNA"},{"a":"Microsegmentation"},{"a":"conditional access"},{"a":"SASE"}],"bank":["full packet capture","TACACS+","the Purdue model","tokenisation"],"answerLabel":"Fill the blanks - drag a term into each blank","question":"Complete the target design with the correct terms.","hint":"Two answers are about deciding access per request, and one is about the delivery model.","explain":"Zero trust replaces network location with continuous verification. The policy engine needs identity, device posture (is the device patched, encrypted, managed) and context such as location, time and risk. ZTNA then gives the user a path to one application instead of a network segment, which removes the classic VPN problem where one authenticated session reaches everything. Microsegmentation applies the same idea between workloads. Conditional access is the enforcement point that turns risk signals into a requirement for another factor. SASE is the delivery model that puts networking and security together in the cloud, which is how most organisations buy these controls today.","focus":"Review the zero trust components, posture checks, ZTNA versus VPN and how conditional access uses risk signals."},
{"id":"H12","theme":"Endpoint, OT/IoT & Attack Surface","pts":3,"title":"03:20 - the plant historian is talking to the office network","kw":["otics","purdue","airgap","legacy","iot","segmentation"],"scenario":"At a water treatment plant the SOC sees SMB traffic from the enterprise network (Purdue level 4) towards the plant historian at level 3, which is not normal. A legacy Windows XP HMI at level 2 shows a new service listening. The shift operator reports that the process is running normally and nobody is on site. The site manager's first instinct is to shut the line down.","type":"branch","start":"s1","steps":[{"id":"s1","q":"Step 1 - What is your first action?","options":[{"t":"Confirm the physical process state with the operator, then isolate the level 3 to level 4 path","ok":true,"fb":"Correct. In OT you confirm safety with the person watching the process, then contain at the boundary without touching the process.","next":"s2"},{"t":"Shut down the production line immediately","ok":false,"fb":"Wrong. An unnecessary shutdown can damage equipment, interrupt supply and cause a safety incident. That is a last resort, not a first step.","next":"s2"},{"t":"Reboot the XP HMI panel","ok":false,"fb":"Wrong. You would lose the volatile evidence and you may interrupt the operator display.","next":"s2"},{"t":"Copy the HMI disk image to a cloud sandbox for analysis","ok":false,"fb":"Wrong. Sending OT data out over the internet from an affected segment spreads the problem and breaks plant rules.","next":"s2"}]},{"id":"s2","q":"Step 2 - The contractor is not on site and the SMB session is still open. How do you contain it?","options":[{"t":"Block the level 3 to level 4 conduit and keep the process running, then hunt on the office host","ok":true,"fb":"Correct. The controllers are not managed through that path, so cutting it contains the intrusion without stopping production.","next":"s3"},{"t":"Disable the domain account used by plant engineers","ok":false,"fb":"Wrong. That can lock operators out of the plant systems mid-shift and turn a security incident into an availability incident.","next":"s3"},{"t":"Reimage the HMI panel during the shift","ok":false,"fb":"Wrong. You would lose the operator display and the evidence while the process is live.","next":"s3"},{"t":"Turn off the historian to stop the traffic","ok":false,"fb":"Wrong. You lose the process trend data that shows whether anything changed, and the session continues elsewhere.","next":"s3"}]},{"id":"s3","q":"Step 3 - What is the correct long-term fix for the XP panel and the conduit?","options":[{"t":"Isolate the unpatched panel on its own segment with a monitored, allow-listed conduit","ok":true,"fb":"Correct. When you cannot patch, you compensate with strict segmentation and monitoring."},{"t":"Upgrade the panel to the latest Windows release","ok":false,"fb":"Wrong. The vendor no longer supports the application, so an OS upgrade would break the control system."},{"t":"Ask the vendor to release a security patch","ok":false,"fb":"Wrong. That may never happen; you cannot leave an exposed level 2 asset waiting for it."},{"t":"Install antivirus software on the programmable logic controller","ok":false,"fb":"Wrong. Controllers do not run general-purpose operating systems, so an endpoint agent cannot be installed."}]}],"answerLabel":"Branching scenario - choose at each step","art":{"label":"Site status","body":"<pre>Process: all pumps normal, reservoir level stable, no alarms on the control system\nEngineer: one contractor on the change list, expected on site tomorrow at 09:00\nHistorian: SMB session from 10[.]40[.]7[.]22 (office VLAN) started 03:14, still open\nHMI: new service listening on 4444 on the XP panel (vendor no longer supports)\nConduit: firewall between level 3 and level 4 logs show the SMB session allowed by rule any-any\nBackup: plant configuration backup ran at 02:00 and completed</pre>"},"question":"Work the incident one decision at a time. Safety comes first, then containment.","hint":"In OT the first question is never 'how do I kill the malware' - it is 'what is the process doing, and what may I cut?'.","explain":"OT incidents are governed by safety and availability before confidentiality. First you confirm the physical state with the operator. Then you contain the problem at the boundary between levels. Here the real defect is the any-any rule on the level 3 to level 4 conduit. Office traffic should never reach the plant without a controlled, allow-listed path. The unpatched XP panel cannot be fixed, so it is isolated and monitored - a compensating control. Legacy and IoT devices are the norm in these environments, which means segmentation, conduits and protocol-aware firewalls do the work that patching cannot.","focus":"Review the Purdue model boundaries, OT containment order, compensating controls for legacy systems and IT/OT conduits."},
{"id":"H13","theme":"Identity, Access & Authentication","pts":3,"title":"Identity protocol deep dive - near misses only","kw":["radius","tacacs","ldap","kerberos","saml","oauth","oidc","aaa","sso","pam","rbac","abac"],"scenario":"A senior identity engineer is testing you with the awkward cases: the two protocols that look alike, the directory that is not an access decision, and the authorisation models that are easy to confuse.","type":"dd","buckets":[{"id":"b0","l":"RADIUS"},{"id":"b1","l":"TACACS+"},{"id":"b2","l":"LDAP"},{"id":"b3","l":"Kerberos"},{"id":"b4","l":"SAML"},{"id":"b5","l":"OAuth 2.0 / OIDC"},{"id":"b6","l":"Privileged access management (PAM)"},{"id":"b7","l":"Role-based access control (RBAC)"},{"id":"b8","l":"Attribute-based access control (ABAC)"}],"items":[{"id":"i1","t":"Switch administration where the whole session is encrypted and every command is logged per named user","b":"b1"},{"id":"i2","t":"Wi-Fi 802.1X where only the password field is protected inside the access request","b":"b0"},{"id":"i3","t":"Directory query that resolves nested group membership before an access decision is made","b":"b2"},{"id":"i4","t":"Domain logon that issues service tickets, so no password crosses the wire to the web server","b":"b3"},{"id":"i5","t":"Browser single sign-on to a SaaS application using a signed XML assertion from the identity provider","b":"b4"},{"id":"i6","t":"Mobile app receives an ID token after the user approves a scoped consent screen","b":"b5"},{"id":"i7","t":"Administrator password is checked out of a vault with approval and a two hour expiry","b":"b6"},{"id":"i8","t":"Access granted because the job title is nurse, reviewed quarterly - simple but coarse","b":"b7"},{"id":"i9","t":"Access granted only when department is finance, the device is managed and it is business hours","b":"b8"}],"answerLabel":"Drag each item into the correct box","question":"Drag each case to the protocol, vault or model that answers it.","hint":"One protocol is for network access, one is for device administration, one only reads directory data.","explain":"RADIUS and TACACS+ are both AAA protocols, but they behave differently. RADIUS is common for network access. It encrypts only the password inside the request. TACACS+ was built for device administration. It encrypts the whole session and can log every command. That is why network teams prefer it for switches and routers. LDAP is a directory service - it returns user and group data, but the access decision belongs somewhere else. Kerberos issues tickets inside a domain, so a service can trust the ticket instead of seeing a password. SAML sends signed assertions for browser SSO; OAuth 2.0 authorises an application to act for a user and OIDC adds the identity layer with an ID token. PAM vaults privileged credentials with approval and time limits. RBAC grants by role, which is simple but coarse; ABAC adds attributes such as department, device health and time, and is the model conditional access uses.","focus":"Review RADIUS versus TACACS+ detail, LDAP versus access control, Kerberos, SAML versus OIDC and RBAC versus ABAC."},
{"id":"H14","theme":"Cloud & Virtualization Architecture","pts":3,"title":"Immutable infrastructure - the build that nobody patches by hand","kw":["iac","baseline","immutable","changemgmt","cspm","container","serverless"],"scenario":"A platform team keeps having incidents caused by hand-made changes on running servers. They are moving to immutable infrastructure where nothing is ever fixed in place. The security architect must approve the pipeline sequence.","type":"order","items":[{"id":"o1","t":"Scan the infrastructure-as-code template and the container image for misconfigurations and known bad components"},{"id":"o2","t":"Build the image, record its digest and sign it so the artefact cannot be swapped later"},{"id":"o3","t":"Deploy the signed digest and never patch a running instance by hand"},{"id":"o4","t":"Run a configuration check after deployment and compare the result with the secure baseline"},{"id":"o5","t":"Route every change through change management so the template stays the source of truth"},{"id":"o6","t":"Replace the running instance instead of modifying it when a change is needed"}],"answerLabel":"Put in order - drag the rows or use the arrows","dirLabel":"First item at the top","question":"Put the pipeline stages in the correct order, first stage at the top.","hint":"Two stages must happen before anything runs, and one of them is what makes the artefact trustworthy.","explain":"Immutable infrastructure means the running instance is disposable: if it drifts or needs a change, you replace it. That only works if the artefact is trustworthy, so the template and the image are scanned first, and the built image is signed with a recorded digest so nobody can substitute a different one. Deployment then pushes that exact digest. A configuration check after deployment proves the running system matches the secure baseline, which is how you catch drift. Change management keeps the template as the single source of truth, because a console change is invisible to the next deployment and will be overwritten. CSPM watches the deployed cloud resources for the same mistakes, and serverless functions follow the same pattern with a package version instead of an image.","focus":"Review immutable infrastructure, signed artefacts, IaC scanning, baseline verification and why change management matters more, not less."},
{"id":"H15","theme":"Cloud & Virtualization Architecture","pts":3,"title":"The Terraform plan that looks fine","kw":["secgroup","nacl","vpc","pubsubnet","cloudiam","flowlogs","sharedresp","statefulfw","northsouth"],"scenario":"A cloud engineer insists the internet-facing web tier is safe: HTTP and HTTPS are open to the world because that is the product, and administrative access is limited to the corporate range. A flow log review, however, shows RDP sessions accepted from three unrelated countries. You review the plan for the security group.","type":"spot","answerLabel":"Spot the mistake - click the single wrong line","art":{"label":"terraform plan excerpt","body":""},"lines":[{"n":1,"t":"resource &quot;aws_security_group&quot; &quot;web&quot; {","bad":false},{"n":2,"t":"&nbsp;&nbsp;name   = &quot;claims-web&quot;","bad":false},{"n":3,"t":"&nbsp;&nbsp;vpc_id = aws_vpc.claims.id","bad":false},{"n":4,"t":"","bad":false},{"n":5,"t":"&nbsp;&nbsp;ingress {","bad":false},{"n":6,"t":"&nbsp;&nbsp;&nbsp;&nbsp;from_port   = 443","bad":false},{"n":7,"t":"&nbsp;&nbsp;&nbsp;&nbsp;to_port     = 443","bad":false},{"n":8,"t":"&nbsp;&nbsp;&nbsp;&nbsp;protocol    = &quot;tcp&quot;","bad":false},{"n":9,"t":"&nbsp;&nbsp;&nbsp;&nbsp;cidr_blocks = [&quot;0[.]0[.]0[.]0/0&quot;]","bad":false},{"n":10,"t":"&nbsp;&nbsp;}","bad":false},{"n":11,"t":"","bad":false},{"n":12,"t":"&nbsp;&nbsp;ingress {","bad":false},{"n":13,"t":"&nbsp;&nbsp;&nbsp;&nbsp;from_port   = 3389","bad":false},{"n":14,"t":"&nbsp;&nbsp;&nbsp;&nbsp;to_port     = 3389","bad":false},{"n":15,"t":"&nbsp;&nbsp;&nbsp;&nbsp;protocol    = &quot;tcp&quot;","bad":false},{"n":16,"t":"&nbsp;&nbsp;&nbsp;&nbsp;cidr_blocks = [&quot;10[.]30[.]0[.]0/16&quot;]","bad":false},{"n":17,"t":"&nbsp;&nbsp;}","bad":false},{"n":18,"t":"","bad":false},{"n":19,"t":"&nbsp;&nbsp;ingress {","bad":false},{"n":20,"t":"&nbsp;&nbsp;&nbsp;&nbsp;from_port        = 3389","bad":false},{"n":21,"t":"&nbsp;&nbsp;&nbsp;&nbsp;to_port          = 3389","bad":false},{"n":22,"t":"&nbsp;&nbsp;&nbsp;&nbsp;protocol         = &quot;tcp&quot;","bad":false},{"n":23,"t":"&nbsp;&nbsp;&nbsp;&nbsp;ipv6_cidr_blocks = [&quot;::/0&quot;]","bad":true},{"n":24,"t":"&nbsp;&nbsp;}","bad":false},{"n":25,"t":"","bad":false},{"n":26,"t":"&nbsp;&nbsp;egress {","bad":false},{"n":27,"t":"&nbsp;&nbsp;&nbsp;&nbsp;from_port   = 0","bad":false},{"n":28,"t":"&nbsp;&nbsp;&nbsp;&nbsp;to_port     = 0","bad":false},{"n":29,"t":"&nbsp;&nbsp;&nbsp;&nbsp;protocol    = &quot;-1&quot;","bad":false},{"n":30,"t":"&nbsp;&nbsp;&nbsp;&nbsp;cidr_blocks = [&quot;0[.]0[.]0[.]0/0&quot;]","bad":false},{"n":31,"t":"&nbsp;&nbsp;}","bad":false},{"n":32,"t":"}","bad":false}],"code":true,"question":"Click the single line that opens the administrative port to every address in the world.","hint":"Read every ingress block, including the one that does not use IPv4.","explain":"The IPv4 rule for 3389 correctly limits administrative access to the corporate range, so the plan passes a quick look. The third ingress block allows the same port from every IPv6 address. IPv6 is enabled by default in many cloud networks. So the host is reachable from anywhere in the world over IPv6, while the reviewer reads only the IPv4 lines. A security group is stateful, so it allows the return traffic automatically; a network ACL is stateless and would need both directions. The public 443 rule is intentional for a public service - the fix is to remove the IPv6 rule and reach the host through a bastion, then confirm with flow logs that the exposure is gone. Forgetting IPv6 is the classic near-miss in cloud reviews, and it is exactly the kind of gap the shared responsibility model leaves to the customer.","focus":"Review IPv6 exposure in cloud security groups, stateful versus stateless filtering and verifying fixes with flow logs."},
{"id":"H16","theme":"Network Segmentation & Secure Design","pts":3,"title":"The device that authenticated without authenticating (blue and red view)","kw":["dot1x","nac","vlan","shadowit","iot","allowlist"],"scenario":"A branch reports a laptop on the corporate VLAN that nobody recognises. The RADIUS server shows no authentication for it. The network access control (NAC) dashboard shows the port as authorised. Wireless is not in use; the device is plugged into a wall port.","type":"dual","alabel":"Blue team","blabel":"Red team","a":{"q":"Blue team: which artefact proves the device bypassed 802.1X instead of failing it?","options":[{"t":"Switch log showing the same MAC address active on a different port","c":true},{"t":"RADIUS log showing an Access-Reject for that device on the port","c":false},{"t":"DHCP log showing the device received a guest VLAN address","c":false},{"t":"Firewall log showing the device reaching an internet service","c":false}]},"b":{"q":"Red team: which action most reliably gets an unauthorised device onto the corporate VLAN?","options":[{"t":"Clone the MAC address of an authorised device and use another port","c":true},{"t":"Change the device hostname to match an approved asset name","c":false},{"t":"Send repeated authentication attempts until the server accepts one","c":false},{"t":"Use a longer cable to reach an access port in another room","c":false}]},"answerLabel":"Blue team then red team","question":"Answer both parts: what proves a bypass rather than a failure, and how the device got in.","hint":"A rejection is not a bypass. Look for the same identity succeeding somewhere it should not.","explain":"An Access-Reject on the original port would mean the control worked. The bypass shows up when the same MAC address is active on a different port. Either that port is set to a forced-authorised state, or the attacker cloned an authorised MAC address. In the second case the switch accepted the device through MAC authentication bypass instead of 802.1X. Hostname changes do nothing, retrying does not defeat 802.1X, and cable length is irrelevant. Here is how to defend. Use certificate-based 802.1X where you can. Turn on port security and MAC limiting. Watch for the same MAC address on more than one port. Profile IoT devices that cannot run an 802.1X client. Give unknown devices a guest VLAN that reaches nothing internal. Shadow IT devices and unmanaged IoT are the usual source of the unknown MAC in the first place.","focus":"Review 802.1X bypass techniques, MAC authentication bypass, port security and profiling for IoT and shadow IT."},
{"id":"H17","theme":"Network Segmentation & Secure Design","pts":3,"title":"A flat data centre that cannot be re-addressed","kw":["segmentation","microsegmentation","eastwest","sdn","defenseindepth","legacy","statefulfw"],"scenario":"A legacy data centre has one flat /16 for 900 servers. Re-addressing is off the table this year: the applications hold hard-coded IP addresses and the change freeze covers them. Last month one compromised web server scanned the whole estate and reached a database it never needed. You must reduce east-west risk now, within those constraints.","type":"mcq","options":[{"t":"Host-based microsegmentation agents that follow the workload","c":true},{"t":"A stateful firewall between the core and access layers","c":false},{"t":"New VLANs for each application with ACLs between them","c":false},{"t":"A web application firewall in front of the legacy apps","c":false}],"answerLabel":"Choose one","question":"Which control reduces east-west risk most in this situation?","hint":"The constraint is the addressing. Which control does not need the addressing to change?","explain":"Host-based microsegmentation puts the policy on the workload itself. It works with hard-coded addresses. It also enforces rules between two servers in the same subnet. That is exactly where a flat network is most dangerous. A stateful firewall between the core and the access layer cannot filter traffic between two hosts in the same VLAN, and on a flat /16 that is most of the traffic. New VLANs would work architecturally but require re-addressing or complex routing, which the change freeze forbids. A WAF only inspects HTTP arriving from outside; it is blind to server-to-server traffic. Microsegmentation is not a total answer - it needs agent coverage, which legacy systems may lack, so those hosts still need network-level controls as a second layer in the defense-in-depth design.","focus":"Review microsegmentation versus network segmentation, the limits of firewalls inside a subnet and constraints from legacy systems."},
{"id":"H18","theme":"Visibility, Monitoring & Logging","pts":3,"title":"Find the internal relay","kw":["netflow","ndr","eastwest","honeypot","telemetry","ngfw"],"scenario":"An NDR review looks at four hosts with unusual flow patterns from the last 24 hours. One of them is relaying an external attacker into the internal network. Three patterns have innocent explanations that the team has already confirmed.","type":"log","logName":"Flow summary - top unusual hosts","log":[{"t":"10[.]30[.]30[.]41 -> 192[.]0[.]2[.]9:443 612 MB in 1 session - backup-srv job 'nightly-offsite', allowed by policy","lv":"info"},{"t":"10[.]30[.]44[.]19 -> 91[.]219[.]24[.]11:443 288 sessions, 42 KB total, interval about 5 minutes","lv":"info"},{"t":"10[.]30[.]44[.]19 -> 61 internal peers on 445 within 40 minutes","lv":"info"},{"t":"10[.]30[.]30[.]55 -> 140 internal peers on 22 and 3389 within 25 minutes - authorised scanner range 10[.]30[.]9[.]0/24","lv":"info"},{"t":"honeypot 10[.]30[.]30[.]201 <- connection from 10[.]30[.]44[.]19:49712 to 445, session opened, no data sent","lv":"info"},{"t":"10[.]30[.]44[.]19 -> 151[.]101[.]1[.]7:443 180 MB - vendor software update from cdn.example.net","lv":"info"},{"t":"10[.]30[.]30[.]41 -> 10[.]30[.]30[.]12:9100 2.1 MB in 1 session - print server job, allowed by policy","lv":"info"},{"t":"10[.]30[.]44[.]11 -> 151[.]101[.]1[.]7:443 2.0 GB in 1 session - video streaming, user break room","lv":"info"},{"t":"10[.]30[.]30[.]77 -> 10[.]30[.]30[.]5:445 12 KB in 3 sessions - file server backup, nightly window","lv":"info"}],"inner":{"q":"Which host is relaying an external attacker, and what supports that conclusion?","options":[{"t":"10[.]30[.]44[.]19: a honeypot saw it, it fanned out to 61 peers and beacons out","c":true},{"t":"10[.]30[.]30[.]41: it sent 612 MB to a single external address in one session","c":false},{"t":"10[.]30[.]30[.]55: it touched 140 internal hosts on remote access ports in 25 minutes","c":false},{"t":"10[.]30[.]44[.]19: it downloaded 180 MB from a content distribution network","c":false}],"hint":"Evidence becomes conclusive when independent sources agree. Which host appears in more than one line?","explain":"One host appears in three separate observations. It beacons to a single external address at a regular interval, with almost identical small transfers. It also fans out to 61 internal peers on SMB. And it contacted a honeypot, which no legitimate system should ever touch. That combination - external command channel plus internal fan-out plus honeypot contact - is an internal relay. The 612 MB upload is a large one-off transfer from a host with a documented backup policy. The 140-peer scan comes from the authorised scanner range. The 180 MB download is a software update from a content network. Honeypots add value precisely because normal systems have no reason to connect to them, which is why the deployment and monitoring of decoys belongs in the visibility design.","focus":"Review NDR correlation across flow and honeypot telemetry, beaconing versus bulk transfer and authorised scanner context.","answerLabel":"Read the log, then choose one"},"answerLabel":"Read the log, then choose one","question":"Which host is relaying an external attacker, and what supports that conclusion?","hint":"Evidence becomes conclusive when independent sources agree. Which host appears in more than one line?","explain":"One host appears in three separate observations. It beacons to a single external address at a regular interval, with almost identical small transfers. It also fans out to 61 internal peers on SMB. And it contacted a honeypot, which no legitimate system should ever touch. That combination - external command channel plus internal fan-out plus honeypot contact - is an internal relay. The 612 MB upload is a large one-off transfer from a host with a documented backup policy. The 140-peer scan comes from the authorised scanner range. The 180 MB download is a software update from a content network. Honeypots add value precisely because normal systems have no reason to connect to them, which is why the deployment and monitoring of decoys belongs in the visibility design.","focus":"Review NDR correlation across flow and honeypot telemetry, beaconing versus bulk transfer and authorised scanner context."},
