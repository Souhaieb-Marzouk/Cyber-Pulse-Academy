<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CySA+ — Chapter 02 — MEDIUM practice exam (v5.0)</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "cysa-plus",
  "chapter": 2,
  "title": "Threat Hunting, Threat Intelligence & Incident Management — MEDIUM (v5.0)",
  "difficulty": "medium",
  "questionCount": 34,
  "estimatedMinutes": 62,
  "passMark": 70
}
</script>
<style>
:root{
  --bg:#060a12; --bg2:#0a111c; --panel:#0d1522; --panel2:#111c2c; --panel3:#16243a;
  --line:#1d2c42; --line2:#28405e; --txt:#dbe6f5; --dim:#8ea3bd; --dim2:#63799a;
  --cyan:#22d3ee; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  --violet:#a78bfa; --pink:#f472b6; --lime:#a3e635;
  --mcq:#22d3ee; --dd:#a78bfa; --ord:#f472b6; --log:#a3e635;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, #10233b 0%, transparent 60%),
    radial-gradient(900px 500px at 92% 4%, #1a1230 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--sans); font-size:15px; line-height:1.55;
  min-height:100vh;
}
#app{max-width:1220px;margin:0 auto;padding:18px 16px 70px}
a{color:var(--cyan)}
h1,h2,h3,h4{line-height:1.22;margin:0 0 8px}
h1{font-size:26px;letter-spacing:.2px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:6px 0}
code,kbd{font-family:var(--mono);font-size:13px}
.mono{font-family:var(--mono);font-size:13px}
.dim{color:var(--dim)}
.dim2{color:var(--dim2)}
.small{font-size:12.5px}
.center{text-align:center}
.hidden{display:none !important}

/* ---------- generic panels ---------- */
.card{
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
  border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:14px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.card.tight{padding:12px 14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row.between{justify-content:space-between;align-items:center}
.grow{flex:1 1 320px;min-width:280px}

/* ---------- badges / chips ---------- */
.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);
  background:#0c1a2a;color:var(--cyan);
}
.badge.green{color:var(--green);border-color:#1d5c39;background:#08210f}
.badge.red{color:var(--red);border-color:#6b2026;background:#250a0e}
.badge.amber{color:var(--amber);border-color:#6b4a12;background:#261a05}
.badge.violet{color:var(--violet);border-color:#4b3a78;background:#181233}
.badge.grey{color:var(--dim);border-color:var(--line)}
.badge.pink{color:var(--pink);border-color:#7a2b52;background:#2a0f1e}
.badge.lime{color:var(--lime);border-color:#4c6516;background:#1b2408}

/* ---------- exercise blocks: scenario / artifact / question / answer ---------- */
.blk{border-radius:11px;padding:12px 14px;margin:11px 0;border:1px solid var(--line);position:relative}
.blk>.tag{
  display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;padding:2px 8px;border-radius:6px;
}
.blk .tag .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.blk.scn{background:linear-gradient(180deg,#0c1c2c,#0a1522);border-left:4px solid var(--cyan)}
.blk.scn>.tag{background:#0b2b39;color:var(--cyan)}
.blk.scn>.tag .dot{background:var(--cyan)}
.blk.art{background:#080e17;border-left:4px solid var(--violet)}
.blk.art>.tag{background:#1d1637;color:var(--violet)}
.blk.art>.tag .dot{background:var(--violet)}
.blk.ask{background:linear-gradient(180deg,#241a06,#1a1204);border-left:4px solid var(--amber)}
.blk.ask>.tag{background:#3a2a07;color:var(--amber)}
.blk.ask>.tag .dot{background:var(--amber)}
.blk.ask .qtext{font-size:16px;font-weight:600;color:#ffe9bd}
.blk.ans{background:linear-gradient(180deg,#08210f,#061a0c);border-left:4px solid var(--green)}
.blk.ans>.tag{background:#0d3a1c;color:var(--green)}
.blk.ans>.tag .dot{background:var(--green)}
.blk.fb{border-left:4px solid var(--line2);background:#0b1420}
.blk.fb.ok{border-left-color:var(--green);background:#071c0f}
.blk.fb.no{border-left-color:var(--red);background:#220a0e}
.art pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.6px;color:#c8d8ee}

/* ---------- options (mcq / multi) ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);
  border-radius:9px;background:#0b1524;cursor:pointer;transition:.14s;user-select:none;
}
.opt:hover{border-color:var(--cyan);background:#0d1e2f;transform:translateX(2px)}
.opt .mark{
  flex:0 0 20px;height:20px;border:2px solid var(--dim2);border-radius:50%;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#04121a;
}
.opt.multi .mark{border-radius:5px}
.opt.sel{border-color:var(--cyan);background:#0c2636}
.opt.sel .mark{background:var(--cyan);border-color:var(--cyan)}
.opt.ok{border-color:var(--green);background:#08210f}
.opt.ok .mark{background:var(--green);border-color:var(--green)}
.opt.no{border-color:var(--red);background:#26090d}
.opt.no .mark{background:var(--red);border-color:var(--red)}
.opt.miss{border-color:var(--green);border-style:dashed;background:#07190d}
.opt .lbl{font-weight:800;color:var(--dim2);font-size:12px;min-width:14px}
.opt:focus-visible,.chip:focus-visible,.drop:focus-visible,.mzone:focus-visible,.slot:focus-visible,
.navb:focus-visible,.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- chips (drag sources) ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line2);border-radius:10px;background:#0a1220;min-height:50px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;cursor:grab;
  background:#152539;border:1px solid var(--line2);font-size:13px;color:var(--txt);
  transition:.13s;touch-action:manipulation;
}
.chip:hover{border-color:var(--cyan);background:#1b3049}
.chip.sel{border-color:var(--cyan);background:#0f3247;box-shadow:0 0 0 2px rgba(34,211,238,.25)}
.chip.dragging{opacity:.45}
.chip.used{opacity:.35;cursor:default}
.chip.ok{border-color:var(--green);background:#08210f}
.chip.no{border-color:var(--red);background:#26090d}
.chip .x{font-weight:800;color:var(--red);cursor:pointer;padding:0 2px}
.bucketwrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.bucket{flex:1 1 240px;min-width:210px;border:1px solid var(--line2);border-radius:10px;background:#0b1422;padding:9px}
.bucket .bhead{font-weight:700;font-size:13px;color:var(--violet);margin-bottom:7px;border-bottom:1px solid var(--line);padding-bottom:5px}
.drop{min-height:64px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;border-radius:8px;padding:6px;transition:.13s}
.drop.over{background:#132b3f;outline:2px dashed var(--cyan)}
.drop.right{outline:2px solid rgba(34,197,94,.5)}
.drop.wrong{outline:2px solid rgba(239,68,68,.5)}

/* ---------- order / rank list ---------- */
.olist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.olist li{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line2);
  background:#0b1524;border-radius:9px;cursor:grab;
}
.olist li.over{border-color:var(--cyan);background:#12293c}
.olist li.dragging{opacity:.4}
.olist .num{
  flex:0 0 26px;height:26px;border-radius:7px;background:#16273c;color:var(--cyan);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;
}
.olist .mv{display:flex;flex-direction:column;gap:2px;margin-left:auto}
.olist .mv button{
  background:#16273c;border:1px solid var(--line2);color:var(--txt);border-radius:5px;
  cursor:pointer;font-size:10px;line-height:1;padding:3px 6px;
}
.olist .mv button:hover{border-color:var(--cyan);color:var(--cyan)}
.olist li.ok{border-color:var(--green);background:#08210f}
.olist li.no{border-color:var(--red);background:#26090d}

/* ---------- matching ---------- */
.match{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.mcol{flex:1 1 300px;min-width:260px}
.mcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mzone{
  flex:1;min-height:40px;border:1px dashed var(--line2);border-radius:8px;padding:5px;
  display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim2);transition:.13s
}
.mzone.over{border-color:var(--cyan);background:#12293c}
.mzone.filled{border-style:solid;border-color:var(--line2)}
.mzone.right{border-color:var(--green)}
.mzone.wrong{border-color:var(--red)}
.mlabel{flex:0 0 44%;font-size:13px;color:var(--txt);background:#0b1524;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}

/* ---------- fill in the blank ---------- */
.filltext{
  font-family:var(--mono);font-size:13.4px;line-height:2.15;background:#080e17;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;color:#c8d8ee
}
.slot{
  display:inline-block;min-width:118px;min-height:26px;margin:0 4px;padding:2px 9px;border-radius:7px;
  border:1px dashed var(--cyan);background:#0c2334;text-align:center;color:var(--cyan);font-weight:700;
  cursor:pointer;vertical-align:middle;
}
.slot.over{background:#123c52;border-style:solid}
.slot.filled{border-style:solid;background:#0e3242}
.slot.ok{border-color:var(--green);background:#08210f;color:var(--green)}
.slot.no{border-color:var(--red);background:#26090d;color:var(--red)}

/* ---------- terminal ---------- */
.term{background:#04070c;border:1px solid #1d3a2e;border-radius:10px;padding:0;overflow:hidden;font-family:var(--mono)}
.term .tbar{background:#0a1712;padding:6px 10px;font-size:11.5px;color:var(--green);border-bottom:1px solid #14291f;display:flex;gap:8px;align-items:center}
.term .tbody{padding:12px;font-size:13px;color:#b9f5cf;min-height:110px;white-space:pre-wrap}
.term .tline{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #14291f;background:#060c09}
.term input{
  flex:1;background:#04070c;border:1px solid #1d3a2e;color:#b9f5cf;font-family:var(--mono);
  font-size:13px;padding:8px 10px;border-radius:7px;outline:none
}
.term input:focus{border-color:var(--green)}
.term .ps1{color:var(--lime);font-weight:700}

/* ---------- log viewer ---------- */
.logview{background:#070b11;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0b1220;border-bottom:1px solid var(--line)}
.logbar input{
  flex:1;background:#070d16;border:1px solid var(--line2);border-radius:7px;color:var(--txt);
  padding:6px 9px;font-family:var(--mono);font-size:12.5px;outline:none
}
.logbar input:focus{border-color:var(--lime)}
.loglines{max-height:330px;overflow:auto;padding:8px 4px;font-family:var(--mono);font-size:12.4px}
.loglines .ln{display:flex;gap:9px;padding:2px 8px;border-left:3px solid transparent;white-space:pre-wrap;word-break:break-word}
.loglines .ln .no{color:#3d5170;flex:0 0 30px;text-align:right;user-select:none}
.loglines .ln.info{border-left-color:#1d3a5e}
.loglines .ln.warn{border-left-color:var(--amber);background:rgba(245,158,11,.06)}
.loglines .ln.crit{border-left-color:var(--red);background:rgba(239,68,68,.08)}
.loglines .ln.hit{background:rgba(163,230,53,.10)}
.hitmark{background:rgba(163,230,53,.22);outline:1px solid rgba(163,230,53,.45);border-radius:3px}
.hip{color:var(--cyan)}.hdm{color:var(--pink)}.hts{color:var(--dim2)}.hev{color:var(--violet);font-weight:700}

/* ---------- spot the mistake (clickable lines) ---------- */
.slines{list-style:none;margin:8px 0 0;padding:0;font-family:var(--mono);font-size:12.6px}
.slines li{
  display:flex;gap:10px;padding:5px 9px;border:1px solid transparent;border-radius:6px;cursor:pointer;
  white-space:pre-wrap;word-break:break-word
}
.slines li:hover{background:#101d2e;border-color:var(--line2)}
.slines li .no{color:#3d5170;flex:0 0 26px;text-align:right;user-select:none}
.slines li.pick{background:#3a2a07;border-color:var(--amber)}
.slines li.ok{background:#08210f;border-color:var(--green)}
.slines li.no{background:#26090d;border-color:var(--red)}
.slines li.miss{background:#07190d;border-color:var(--green);border-style:dashed}

/* ---------- queue table ---------- */
.qt{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.qt th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line2);padding:6px 8px}
.qt td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
.qt tr:hover td{background:#0c1725}
.qt select{
  background:#0b1524;color:var(--txt);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12.5px;outline:none;max-width:230px
}
.qt select:focus{border-color:var(--cyan)}
.qt select.ok{border-color:var(--green);background:#08210f}
.qt select.no{border-color:var(--red);background:#26090d}

/* ---------- branch ---------- */
.step{border-left:3px solid var(--violet);padding-left:12px;margin:10px 0}
.step .sq{font-weight:600;color:#e6dcff}
.bfb{font-size:12.6px;padding:7px 9px;border-radius:8px;margin-top:6px}
.bfb.ok{background:#08210f;border:1px solid #1d5c39}
.bfb.no{background:#26090d;border:1px solid #6b2026}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;cursor:pointer;
  font-weight:700;font-size:13.5px;border:1px solid var(--line2);background:#152539;color:var(--txt);
  transition:.14s;font-family:inherit;
}
.btn:hover{border-color:var(--cyan);background:#1b3049;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,#0e7490,#0891b2);border-color:#22d3ee;color:#02141b}
.btn.primary:hover{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.btn.green{background:#0d3a1c;border-color:var(--green);color:#c9f7d8}
.btn.red{background:#3a1015;border-color:var(--red);color:#fbd5d8}
.btn.amber{background:#3a2a07;border-color:var(--amber);color:#fde9c0}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- header / HUD ---------- */
.hud{position:sticky;top:0;z-index:40;background:rgba(6,10,18,.93);backdrop-filter:blur(7px);border-bottom:1px solid var(--line);padding:9px 0;margin:-18px -16px 12px;padding-left:16px;padding-right:16px}
.hudgrid{display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:1220px;margin:0 auto}
.hud .stat{font-size:12px;color:var(--dim)}
.hud .stat b{display:block;font-size:17px;color:var(--txt);font-variant-numeric:tabular-nums}
.hud .stat.timer b{color:var(--cyan)}
.hud .stat.timer.low b{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{height:8px;background:#101c2c;border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:160px;flex:1 1 180px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0891b2,#22d3ee);transition:width .35s}
.bar.score>i{background:linear-gradient(90deg,#15803d,#22c55e)}

/* ---------- navigator ---------- */
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.navb{
  border:1px solid var(--line2);background:#0b1524;color:var(--dim);border-radius:7px;padding:5px 0;
  font-size:12px;font-weight:700;cursor:pointer;transition:.12s;font-family:inherit
}
.navb:hover{border-color:var(--cyan);color:var(--cyan)}
.navb.cur{outline:2px solid var(--cyan);color:var(--cyan)}
.navb.ok{background:#08210f;border-color:#1d5c39;color:var(--green)}
.navb.no{background:#26090d;border-color:#6b2026;color:var(--red)}
.navb.skip{background:#3a2a07;border-color:#6b4a12;color:var(--amber)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);margin-top:10px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}

/* ---------- keywords panel ---------- */
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:10px}
.kwtheme{border:1px solid var(--line);border-radius:10px;background:#0a1220;padding:10px 12px}
.kwtheme h4{font-size:12.5px;color:var(--violet);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.kwtheme .kw{display:inline-block;font-size:11.6px;padding:2px 7px;margin:2px 3px 2px 0;border-radius:6px;background:#132135;color:#bcd2ea;border:1px solid #1d2c42}

/* ---------- progress ring / theme bars ---------- */
.tbar{margin:7px 0}
.tbar .tl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.tbar .tb{height:7px;background:#101c2c;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.tbar .tb>i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .3s}

/* ---------- results ---------- */
.cert{
  border:2px solid var(--green);border-radius:16px;padding:24px;text-align:center;
  background:radial-gradient(600px 200px at 50% 0%,#0d3a1c,#071409);box-shadow:0 0 40px rgba(34,197,94,.18)
}
.cert.fail{border-color:var(--red);background:radial-gradient(600px 200px at 50% 0%,#3a1015,#170709);box-shadow:0 0 40px rgba(239,68,68,.18)}
.cert .big{font-size:52px;font-weight:900;letter-spacing:.02em;margin:6px 0}
.cert .pct{font-size:22px;color:var(--dim)}
.rep{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:#0a1220}
.rep.ok{border-left:4px solid var(--green)}
.rep.no{border-left:4px solid var(--red)}
.rep.skip{border-left:4px solid var(--amber)}
.rep.part{border-left:4px solid var(--amber)}
.rep .rhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.answerbox{background:#080e17;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:7px 0;font-size:13px}
.answerbox b{color:var(--cyan)}
.tip{background:#1b1204;border:1px solid #6b4a12;border-radius:8px;padding:8px 11px;font-size:13px;margin-top:7px;color:#fde9c0}
.kbd{font-family:var(--mono);background:#132135;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:12px}
details summary{cursor:pointer;color:var(--cyan);font-weight:600}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0}
.warnbox{background:#2a1a05;border:1px solid var(--amber);border-radius:10px;padding:10px 13px;margin:10px 0;color:#fde9c0}

/* pause overlay */
.qwrap{position:relative}
.qwrap.blurred .qcontent{filter:blur(11px) saturate(.5);pointer-events:none;user-select:none}
.pauseov{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,8,14,.72);border-radius:12px;z-index:20;gap:10px;text-align:center
}
.pauseov .pz{font-size:34px;font-weight:900;color:var(--amber);letter-spacing:.1em}

@media (max-width:820px){
  body{font-size:14.4px}
  #app{padding:12px 10px 60px}
  .hud{margin:-12px -10px 10px;padding-left:10px;padding-right:10px}
  .hud .stat b{font-size:15px}
  h1{font-size:21px}
  .blk.ask .qtext{font-size:15px}
  .mlabel{flex:0 0 100%}
  .mrow{flex-wrap:wrap}
}

const EXERCISES=[
/* ===================== MEDIUM BANK — part 1 (M01-M06) ===================== */
{
 id:"M01",theme:"Threat Hunting",type:"queue",pts:2,
 title:"06:12 shift handover - triage the five open alerts",
 scenario:"You are the triage analyst on the 06:00-14:00 shift at a managed SOC. Five alerts are sitting in the queue with no owner. You must give each one a disposition before you can leave the queue clean for the next analyst.",
 art:{label:"ALERT QUEUE (SIEM + EDR + VPN)",body:
 "<pre>QUEUE 06:12 UTC - analyst: you - SLA: 30 min per alert\n\n"+
 "<b>A-1041</b>  EDR  FIN-WS-07   02:14  powershell.exe opened a handle to lsass.exe\n"+
 "                                  parent process: outlook.exe, user: r.okoro\n"+
 "<b>A-1042</b>  WAF  web-gw-01    06:02  902 requests in 4 min, all from 10[.]20[.]30[.]55\n"+
 "                                  user-agent: Nessus/10.6, target: /admin/*\n"+
 "<b>A-1043</b>  FW   bkp-srv-02   03:31  outbound TLS to 203[.]0[.]113[.]9:443\n"+
 "                                  data: 41 GB, window: nightly backup job\n"+
 "<b>A-1044</b>  IdP  user m.laurent 06:05  sign-in from Paris (corp VPN) then\n"+
 "                                  sign-in from Singapore (mobile carrier) after 22 min\n"+
 "<b>A-1045</b>  AV   kiosk-lobby-3 05:58  detection name: Win32/GenK-External, file\n"+
 "                                  C:\\Windows\\System32\\kernel32.dll, signature rev 4 days old\n</pre>"},
 question:"Set the correct disposition for every alert. One row is a real intrusion, two are alerts that fired correctly but describe allowed activity, one is a broken detection, and one cannot be decided from the data you have.",
 answerLabel:"Dispositions - set one per alert",
 options:["True positive - malicious","Benign true positive - expected activity","False positive - detection is wrong","Needs more data - cannot decide yet"],
 alerts:[
  {id:"a1",short:"A-1041",sev:"02:14 out of hours",t:"Office process spawning PowerShell that touches LSASS on a finance workstation.",answer:"True positive - malicious"},
  {id:"a2",short:"A-1042",sev:"high volume",t:"902 admin-path requests from the internal vulnerability scanner during a scheduled scan window.",answer:"Benign true positive - expected activity"},
  {id:"a3",short:"A-1043",sev:"41 GB egress",t:"Nightly backup server copying 41 GB to the approved cloud backup address inside the backup window.",answer:"Benign true positive - expected activity"},
  {id:"a4",short:"A-1044",sev:"impossible travel",t:"Same user signs in from Paris over the corporate VPN, then from Singapore on a mobile carrier 22 minutes later.",answer:"Needs more data - cannot decide yet"},
  {id:"a5",short:"A-1045",sev:"system file",t:"Antivirus flags kernel32.dll with a week-old signature revision on a lobby kiosk.",answer:"False positive - detection is wrong"}
 ],
 hint:"Ask two separate questions for each alert: did the sensor see real activity (true positive vs false positive), and was that activity allowed (benign) or hostile? Impossible travel is a classic 'needs more data' because VPN and mobile traffic often leave from different countries.",
 explain:"The alarm fired because the sensor saw real activity in A-1041, A-1042, A-1043 and A-1044. In A-1041 the activity is hostile: an email client should never make PowerShell read LSASS memory. In A-1042 and A-1043 the activity really happened and is allowed, so the alarm is a <b>benign true positive</b> - correct detection, harmless cause. A-1044 is a <b>false positive</b> only if the alert logic is wrong; here the data is simply thin, so it is <b>needs more data</b>: a split-tunnel VPN plus a phone on a roaming carrier explains it, and a stolen session explains it too. A-1045 is a <b>false positive</b>: kernel32.dll is a core Windows file and a stale signature revision is a known cause of bad detections.",
 focus:"Learn to separate the two axes of triage: is the event real, and is the event allowed. Also learn when to write 'needs more data' instead of guessing."
},
{
 id:"M02",theme:"Threat Intelligence",type:"dd",pts:2,
 title:"Split the work: which task belongs to intelligence, which to hunting?",
 scenario:"Your company runs a small cyber threat intelligence (CTI) cell and a separate threat hunt team. A new manager keeps mixing the two up and has sent you eight tasks from the backlog. You have to sort them so each team gets the right work.",
 question:"Drag each task into the team that owns it.",
 answerLabel:"Drag and drop - two boxes",
 buckets:[{id:"ti",l:"Threat intelligence work"},{id:"hunt",l:"Threat hunting work"}],
 items:[
  {id:"i1",t:"Rate a new ransomware indicator feed from the sector ISAC",b:"ti"},
  {id:"i2",t:"Write the hypothesis that a phishing crew already has a foothold in the finance VLAN",b:"hunt"},
  {id:"i3",t:"Produce the quarterly report on nation-state activity against your industry",b:"ti"},
  {id:"i4",t:"Search 90 days of EDR telemetry for remote service creation",b:"hunt"},
  {id:"i5",t:"Give an indicator a confidence score before it is blocked",b:"ti"},
  {id:"i6",t:"Baseline normal authentication volume so odd logons stand out",b:"hunt"},
  {id:"i7",t:"Publish STIX objects to the partner sharing group",b:"ti"},
  {id:"i8",t:"Test a hypothesis with queries, then document the negative result",b:"hunt"}
 ],
 hint:"Intelligence produces knowledge about the adversary and pushes it out. Hunting consumes that knowledge, forms a hypothesis and searches your own telemetry for evidence.",
 explain:"Threat intelligence turns raw reporting and indicators into products a defender can use: feeds, confidence scores, sector reports, STIX sharing. Threat hunting starts from a hypothesis about your own environment and searches your telemetry - EDR, network and identity logs - to prove or disprove it. The two teams feed each other: intelligence supplies the TTPs and indicators, hunting supplies new findings back to intelligence. Items that produce or share knowledge are intelligence; items that query your own data to prove a hypothesis are hunting.",
 focus:"Remember the direction of flow: intelligence describes the threat, hunting searches your estate."
},
{
 id:"M03",theme:"Threat Intelligence",type:"match",pts:2,
 title:"Which level of intelligence is this deliverable?",
 scenario:"You have just joined the CTI cell at a European bank. Your team lead gives you five finished products from last month and asks you to label each one with the level of intelligence it represents.",
 question:"Match each finished product or statement to the correct label.",
 answerLabel:"Matching - drag or tap each card onto its match",
 colLeft:"Finished product or statement",colRight:"Correct label",
 left:[
  {id:"l1",t:"Board briefing: which criminal groups will target EU retail banking in the next 12 months",g:"g1"},
  {id:"l2",t:"Campaign report: a crew's intent and timing against your region this quarter, used to set watch themes",g:"g2"},
  {id:"l3",t:"Defender note: the exact TTPs a crew uses for initial access, written so detections can be built",g:"g3"},
  {id:"l4",t:"Machine-readable list of the file hashes and domains seen in yesterday's samples",g:"g4"},
  {id:"l5",t:"A one-page statement from the CISO naming the questions the hunt team must answer first",g:"g5"}
 ],
 right:[
  {id:"r1",t:"Strategic intelligence",g:"g1"},
  {id:"r2",t:"Operational intelligence",g:"g2"},
  {id:"r3",t:"Tactical intelligence",g:"g3"},
  {id:"r4",t:"Technical intelligence",g:"g4"},
  {id:"r5",t:"Priority intelligence requirement",g:"g5"}
 ],
 hint:"Think about who reads it and how long it stays useful: the board, the campaign planners, the detection engineers, the tooling, or the task list itself.",
 explain:"Strategic intelligence is long-horizon and aimed at leaders and budget. Operational intelligence covers campaigns and intent over weeks or months. Tactical intelligence describes the TTPs of an actor so defenders can build detections. Technical intelligence is the raw, machine-readable layer - hashes, domains, IP addresses. A priority intelligence requirement is not a product at all: it is the agreed question that directs collection and hunting in the first place.",
 focus:"Sort intelligence by audience and lifetime, not by how technical the words look."
},
{
 id:"M04",theme:"Threat Intelligence",type:"order",pts:2,
 title:"Rebuild the campaign chain from the finished report",
 scenario:"A partner ISAC sends you a campaign write-up. The section headings were lost in a bad PDF export, so the seven stages are listed in random order. You want to restore the classic attack chain so the report can be used for detection mapping.",
 art:{label:"EXTRACTED HEADINGS (randomised)",body:
 "<pre>1. The loader beacons to 91[.]219[.]84[.]17 every 60 seconds with a jittered sleep\n"+
 "2. A staff member opens an invoice archive and enables the macro\n"+
 "3. The operators collect finance documents and move them to a staging share\n"+

 "5. The macro writes a service and creates a scheduled task for persistence\n"+
 "6. The macro abuses a known Office equation-editor flaw to run code\n"+
 "7. The crew builds a weaponised document with an embedded macro dropper\n</pre>"},
 question:"Put the seven stages into the correct order of the chain, starting with the earliest stage.",
 answerLabel:"Put in order - drag the rows or use the arrows",
 dirLabel:"Earliest stage first",
 items:[
  {id:"p1",t:"Reconnaissance - lookalike domains registered, staff listed from a job board"},
  {id:"p2",t:"Weaponization - document built with an embedded macro dropper"},
  {id:"p3",t:"Delivery - invoice archive reaches the staff member"},
  {id:"p4",t:"Exploitation - Office equation-editor flaw runs the macro code"},
  {id:"p5",t:"Installation - service created and scheduled task set for persistence"},
  {id:"p6",t:"Command and control - loader beacons to a jittered address every 60 seconds"},
  {id:"p7",t:"Actions on objectives - finance documents staged for collection"}
 ],
 hint:"Start with what the crew must do before anything can be delivered, and finish with what they came for. Persistence comes after the code runs but before the beacon needs to survive a reboot.",
 explain:"The Cyber Kill Chain runs reconnaissance, weaponization, delivery, exploitation, installation, command and control, then actions on objectives. It is useful for a linear write-up, but real intrusions loop and skip stages, so defenders also map activity to MITRE ATT&CK techniques and track coverage with the ATT&CK Navigator. The kill chain answers 'where in the attack are we?'; ATT&CK answers 'which behaviours do we detect?'.",
 focus:"Memorise the seven phase names and the order, then remember that ATT&CK, not the kill chain, is the tool for coverage."
},
{
 id:"M05",theme:"Threat Intelligence",type:"mcq",pts:2,
 title:"One detection slot left this sprint",
 scenario:"Your detection engineering sprint has room for exactly one new detection. The CTI cell offers you five indicator types that all appear in current reporting against your sector. Your lead asks which choice hurts the adversary the most when it works.",
 question:"Which indicator type gives the defender the greatest long-term advantage when it is detected and blocked?",
 answerLabel:"Choose one",
 options:[
  {t:"A file hash of the current loader sample",c:false},
  {t:"The IP address of the command-and-control server",c:false},
  {t:"The tools and TTPs the crew reuses on every job",c:true},
  {t:"The registry key the loader creates for persistence",c:false},
  {t:"The lookalike domain used in the phishing wave",c:false}
 ],
 hint:"The Pyramid of Pain ranks indicators by how much work the attacker must do to change them.",
 explain:"The Pyramid of Pain ranks indicator types by the cost they impose on the attacker. Hashes, IP addresses and domains sit at the bottom: change one byte or buy a new domain and the indicator is dead. Registry keys are a little higher but still easy to alter. Tools and TTPs sit near the top, because changing how a crew works - its tooling, its procedures, its habits - costs real time, money and retraining. That is why TTP-based detections survive longer than any single indicator.",
 focus:"Learn the Pyramid of Pain order: hash, IP, domain, host artefact, tool, TTP."
},
{
 id:"M06",theme:"Threat Intelligence",type:"fill",pts:2,
 title:"Complete the intelligence cycle in the team handbook",
 scenario:"Your CTI cell is rewriting its handbook and the description of how the team works has been left with blanks where the stage names should be. Fill each blank with the correct stage of the intelligence cycle.",
 question:"Complete every stage of the intelligence cycle in the handbook text.",
 answerLabel:"Fill the blanks - drag a term into each blank",
 text:"A mature team runs the intelligence cycle in a fixed order. It starts with planning and direction, driven by a {0} agreed with the CISO. Next comes {1}, which pulls OSINT, HUMINT and SIGINT from many sources. {2} turns that raw material into a usable format. {3} adds context, links the pieces and sets a confidence score. {4} pushes the finished product to the ISAC and to the SOC. Finally {5} from the consumers restarts the loop.",
 slots:[{a:"priority intelligence requirement"},{a:"collection"},{a:"processing"},{a:"analysis"},{a:"dissemination"},{a:"feedback"}],
 bank:["containment","enrichment","attribution","remediation"],
 hint:"Planning and direction come first, and the last stage is what the consumers tell you about the product you just sent them.",
 explain:"The intelligence cycle is planning and direction, collection, processing, analysis and production, dissemination, then feedback. The priority intelligence requirement is the question agreed with leadership that tells the team what to collect. OSINT, HUMINT and SIGINT are collection sources - open, human and signals. Enrichment and attribution happen inside analysis and are not stages of the cycle.",
 focus:"Memorise the six stages in order and be able to name the three classic collection sources."
}
,
/* ===================== MEDIUM BANK — part 2 (M07-M12) ===================== */
{
 id:"M07",theme:"Threat Intelligence",type:"spot",pts:2,
 title:"Review the new indicator handling runbook before it is published",
 scenario:"Your CTI cell has drafted a runbook for handling indicators from external feeds. You are the reviewer. Two of the eight lines break good practice and must be corrected before the runbook is signed off.",
 art:{label:"RUNBOOK DRAFT v0.9 - 'Handling partner indicators'",body:"<pre>Document : CTI-RB-014, indicator handling runbook, draft v0.9\nOwner    : Cyber threat intelligence cell\nReview   : awaiting security review before publication\nAction   : the eight numbered lines are listed in the answer block below -\n           click the two that break good practice.\n</pre>"},
 question:"Click every line that is wrong or unsafe. Each correct line earns its share of the points, and a wrong pick earns nothing - it never subtracts.",
 answerLabel:"Spot the mistake - click the bad lines",
 lines:[
  {n:1,t:"Onboarding: each new feed is registered in the threat intelligence platform and given a confidence score.",bad:false},
  {n:2,t:"Normalisation: partner indicators are converted to STIX 2.1 objects and pulled over TAXII.",bad:false},
  {n:3,t:"Enrichment: domains are checked against passive DNS and file hashes are detonated in the sandbox.",bad:false},
  {n:4,t:"Marking: indicators a partner marked Traffic Light Protocol AMBER are re-shared with the public MISP community instance.",bad:true},
  {n:5,t:"Retention: indicators past the feed expiry date are removed from the blocklist automatically.",bad:false},
  {n:6,t:"Alerting: an indicator hit opens a case in the ticketing system for the duty analyst.",bad:false},
  {n:7,t:"Tuning: when an indicator causes a false positive the indicator is deleted from the platform so analysts are not disturbed again.",bad:true},
  {n:8,t:"Review: each quarter the team reports which feeds produced true positives and which produced only noise.",bad:false}
 ],
 hint:"One line breaks the rules of a sharing marking. Another confuses tuning a detection with destroying the intelligence.",
 explain:"Traffic Light Protocol markings are a promise: TLP:AMBER material goes only to the named community, never to a public instance, and TLP:RED goes only to the named recipients. Re-sharing it publicly is a breach of trust that can end a sharing partnership. Line 7 is wrong for a different reason: a false positive means the detection or the blocklist scope is too broad, so you tune, expire or scope the indicator. Deleting the intelligence means you lose the history and will re-import it from the same feed tomorrow. The other lines describe normal practice: STIX over TAXII, enrichment, expiry, case creation and quarterly feed review.",
 focus:"Learn that Traffic Light Protocol controls who may receive intelligence, and that false positives are tuned, not deleted."
},
{
 id:"M08",theme:"Threat Hunting",type:"log",pts:2,
 title:"09:00 hunt - something on this network calls home on a schedule",
 scenario:"You are running a hypothesis-driven hunt for command-and-control beaconing. You have 24 hours of proxy and DNS telemetry in front of you. Use the filter box to narrow the lines, then answer.",
 logName:"proxy-gw-01 + dns-resolver (24 h)",
 log:[
  {t:"2024-03-11T02:00:04Z proxy bkp-srv-02 POST hxxps://eu.backup-vault[.]example/put 41.2 GB status 200",lv:"info"},
  {t:"2024-03-11T09:00:11Z dns WS-1180 A update[.]windowsupdate[.]com 10[.]20[.]4[.]19",lv:"info"},
  {t:"2024-03-11T09:14:02Z dns WS-2214 A a1b2c3[.]sync-node[.]top 91[.]219[.]84[.]17",lv:"info"},
  {t:"2024-03-11T09:14:03Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB out / 1.1 KB in status 200",lv:"warn"},
  {t:"2024-03-11T09:24:01Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB out / 1.1 KB in status 200",lv:"warn"},
  {t:"2024-03-11T09:30:00Z proxy WS-1180 GET hxxp://update[.]windowsupdate[.]com/catalog 88 KB status 200",lv:"info"},
  {t:"2024-03-11T09:34:04Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB out / 1.1 KB in status 200",lv:"warn"},
  {t:"2024-03-11T09:44:02Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB out / 1.1 KB in status 200",lv:"warn"},
  {t:"2024-03-11T09:54:07Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB out / 1.1 KB in status 200",lv:"warn"},
  {t:"2024-03-11T10:04:03Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB out / 1.1 KB in status 200",lv:"warn"},
  {t:"2024-03-11T10:12:00Z dns WS-2214 A a1b2c3[.]sync-node[.]top 91[.]219[.]84[.]17",lv:"info"},
  {t:"2024-03-11T18:30:00Z proxy WS-1180 GET hxxp://update[.]windowsupdate[.]com/catalog 88 KB status 200",lv:"info"}
 ],
 answerLabel:"Choose one - filter the log above with the box, then answer",
 inner:{q:"Which host is beaconing, and what is the strongest evidence for that conclusion?",options:[
  {t:"WS-2214 - identical small POSTs to the same host every 600 seconds",c:true},
  {t:"WS-1180 - repeated GETs to one update address several times a day",c:false},
  {t:"bkp-srv-02 - a very large upload outside working hours",c:false},
  {t:"WS-2214 - the destination domain was resolved from the internal resolver",c:false}
 ]},
 hint:"Compare the gap between each pair of events. Regularity matters more than volume, and the payload size tells you whether data is leaving.",
 explain:"WS-2214 sends an almost identical request to the same destination at 09:14, 09:24, 09:34, 09:44, 09:54 and 10:04 - a near-perfect 600-second interval with small jitter, which is the signature of an automated implant checking in. WS-1180 only repeats a few times a day against a well-known update pattern, and the backup server works inside its nightly window, so both match the baseline. The fact that the domain was resolved internally is not evidence by itself; most beaconing uses the normal resolver. Network detection and response (NDR) platforms automate exactly this interval analysis, but the reasoning is the same whether a tool does it or you do it by hand.",
 focus:"Hunt beaconing with interval analysis: same destination, same size, same gap, small payloads, long duration."
},
{
 id:"M09",theme:"Threat Hunting",type:"multi",pts:2,

 question:"Select every statement that describes an indicator of attack rather than a static indicator of compromise.",
 answerLabel:"Select all that apply",
 options:[
  {t:"PowerShell reads LSASS memory on a finance workstation",c:true},
  {t:"A process started by winword.exe creates a scheduled task",c:true},
  {t:"One account authenticates from two countries in five minutes",c:true},
  {t:"The SHA-256 hash of the loader dropped on the kiosk",c:false},
  {t:"The domain a1b2c3[.]sync-node[.]top resolved by three hosts",c:false},
  {t:"A YARA rule match against a suspicious DLL in the temp folder",c:false}
 ],
 hint:"Ask who has to change something to defeat it: the attacker's behaviour, or just one file and one name.",
 explain:"Indicators of attack describe behaviour and intent - a process touching LSASS, Office spawning a scheduled task, one account in two countries. They are patterns of activity, they are hunted rather than simply blocked, and they are hard for the attacker to change. Hashes, domains and rule matches on a dropped file are indicators of compromise: they are leftovers from something that already happened, and the attacker replaces them cheaply. Good hunts combine both: an indicator of compromise starts the search, and indicators of attack confirm it.",
 focus:"Learn the IoC versus IoA split and why behaviour-based hunting survives attacker retooling."
},
{
 id:"M10",theme:"Threat Hunting",type:"branch",pts:3,

 start:"s1",
 steps:[
  {id:"s1",q:"Step 1 - you have the hypothesis. What do you do first?",options:[
    {t:"Start querying 90 days of identity and EDR data for the behaviours the hypothesis predicts",ok:true,fb:"Correct. A hunt begins by turning the hypothesis into testable behaviours and finding the data source that can prove or disprove it.",next:"s2"},
    {t:"Block all finance accounts and cut the VLAN off, then investigate",ok:false,fb:"Too aggressive. Hunting is discovery; you have not proved anything yet, and you would cause an outage and warn the intruder.",next:"s2"},
    {t:"Wait for the SIEM to raise a lateral-movement alert, then act",ok:false,fb:"That is monitoring, not hunting. A hunt actively searches for activity that no rule has flagged.",next:"s2"}
  ]},
  {id:"s2",q:"Step 2 - your first query returns 4,000 admin logons. What now?",options:[
    {t:"Add asset context: list the accounts that should never touch finance servers, then re-query",ok:true,fb:"Correct. Hunting is hypothesis refinement. Asset and identity context turns 4,000 rows into a short, meaningful list.",next:"s3"},
    {t:"Escalate all 4,000 logons to the incident response team as suspected lateral movement",ok:false,fb:"That floods the IR queue and destroys trust in the hunt. Noise must be reduced before escalation.",next:"s3"},
    {t:"Close the hunt because the volume looks like normal admin behaviour",ok:false,fb:"Volume alone proves nothing. You must still test the hypothesis against context before closing.",next:"s3"}
  ]},
  {id:"s3",q:"Step 3 - one service account logs into 11 servers at 02:00 using a tool that creates remote services. What is your next step?",options:[
    {t:"Document the finding, open an incident and hand the evidence and queries to incident response",ok:true,fb:"Correct. Once a hunt proves malicious activity it becomes an incident. Documented queries and artefacts save the responders hours.",next:null},
    {t:"Keep hunting quietly for a week to gather more evidence before telling anyone",ok:false,fb:"Dangerous. An active intrusion is bleeding data while you investigate; escalation has a time cost.",next:null},
    {t:"Close the case: service accounts are expected to log in at night",ok:false,fb:"The remote-service tool is the problem, not the time of day. Closing here loses the intrusion.",next:null}
  ]}
 ],
 hint:"A hunt moves in a loop: refine the hypothesis, narrow the data, validate, then document. When it proves something real, the hunt ends and incident response begins.",
 explain:"A hunt loop is: form a hypothesis, find the data sources that can test it, query, validate, document, refine. The value comes from refinement - adding identity and asset context until the noise collapses. A hunt never 'finishes' silently: whether the result is positive or negative, the queries and findings are documented as hunt documentation so the next analyst can repeat or extend the work. When a hunt proves malicious activity, it stops being a hunt and becomes an incident with evidence handed to the response team.",
 focus:"Remember the sequence hypothesis, data source, query, validate, document - and that a positive hunt becomes an incident."
},
{
 id:"M11",theme:"Threat Hunting",type:"terminal",pts:2,
 title:"Hunt task 4: look for management ports the firewall forgot",
 scenario:"Your hunt on external attack surface found that three subnets were never scanned after a migration. You must enumerate the services listening on the internal host 10[.]20[.]30[.]40 so the network team can compare it with the approved service list.",
 art:{label:"HUNT TICKET HT-2291",body:"<pre>Host under test : 10[.]20[.]30[.]40 (legacy app server, no ICMP allowed)\nScope          : TCP ports 1-1024 only, no UDP, no exploitation\nOutcome needed  : service list with version banners for the network team\nTip from the lead: use the standard port scanner with version detection,\n                  skip host discovery because ICMP is blocked, and keep the\n                  port range tight so the scan finishes inside the window.\nNote            : addresses are written defanged in this brief (10[.]20[.]30[.]40);\n                  type them normally in the shell.</pre>"},
 question:"Type the command that enumerates the services listening on 10[.]20[.]30[.]40 across TCP ports 1-1024, with version detection and without host discovery.",
 answerLabel:"Terminal - type the command and press Enter",
 host:"soc-hunt-01",prompt:"analyst@soc-hunt-01:~$",
 termIntro:"analyst@soc-hunt-01:~$ # hunt ticket HT-2291 - legacy app server, quiet scan, ports 1-1024\nanalyst@soc-hunt-01:~$ # expected tool: nmap. expected result shape:\n#   PORT     STATE SERVICE  VERSION\n#   22/tcp   open  ssh      OpenSSH 7.4\n#   443/tcp  open  https    nginx 1.18.0\n#   8080/tcp open  http-alt Tomcat 9.0.31",
 accept:["nmap(?=[\\s\\S]*(-sV))(?=[\\s\\S]*(-p\\s*1-1024|-p1-1024))(?=[\\s\\S]*(-Pn|-P0))[\\s\\S]*10\\D{0,3}20\\D{0,3}30\\D{0,3}40"],
 expected:"nmap -sV -Pn -p 1-1024 10[.]20[.]30[.]40",
 successOutput:"Starting Nmap 7.94 ( nmap.org )\nNmap scan report for 10[.]20[.]30[.]40\nPORT     STATE SERVICE  VERSION\n22/tcp   open  ssh      OpenSSH 7.4 (protocol 2.0)\n443/tcp  open  https    nginx 1.18.0\n8009/tcp open  ajp13    Apache JServer 1.3\n8080/tcp open  http-alt Apache Tomcat 9.0.31\nNmap done: 1 IP address (1 host up) scanned in 12.84 seconds\n# command accepted",
 failOutput:"# command not recognised - check the tool, the version flag, the port range and the discovery flag",
 hint:"The scanner is nmap. You need -sV for version banners, -Pn because ICMP is blocked, and -p 1-1024 to stay inside the approved range. Put the target address last.",
 explain:"nmap -sV -Pn -p 1-1024 10[.]20[.]30[.]40 asks for service and version detection (-sV), skips host discovery because the host does not answer ICMP (-Pn), and limits the scan to the low TCP ports (-p 1-1024). The result is the attack surface view the network team needs. Note what the range does: the scan stopped at port 1024, so anything above that is still unknown, and the unapproved AJP connector on 8009 is the finding - a forgotten management or connector port is a favourite entry point and it should not be in the approved service list.",
 focus:"Learn the nmap flags by purpose: -sV version, -Pn no ping, -p ports, -oN save output, and always scan inside the approved window."
},
{
 id:"M12",theme:"Incident Response Preparation",type:"rank",pts:2,
 title:"First 30 minutes: rank the containment actions",
 scenario:"A hunt has just proved that two workstations are beaconing to a1b2c3[.]sync-node[.]top and that a service account was used to create remote services on eleven servers. The incident commander asks you for the order of the first five containment actions.",
 question:"Rank the five actions in the order they should be carried out, with 1 as the first action.",
 answerLabel:"Rank by priority - drag the rows or use the arrows",
 dirLabel:"Rank 1 = do first",
 items:[
  {id:"c1",t:"Block the command-and-control domain and address at the proxy and the DNS resolver"},
  {id:"c2",t:"Isolate the two beaconing workstations from the network"},
  {id:"c3",t:"Disable the abused service account and revoke its active sessions"},
  {id:"c4",t:"Reset the passwords of the users who logged on to the isolated hosts"},
  {id:"c5",t:"Patch the exploited application on the remaining forty servers"}
 ],
 hint:"Cut the channel the attacker uses, then take away the machines, then take away the identity. Rebuilding and patching is recovery work and comes last.",
 explain:"Containment aims to stop the damage while keeping the business running. Cutting the command-and-control channel first stops data leaving and blinds the operator without disturbing users. Isolating the two infected hosts then removes the attacker's foothold. Disabling the service account and revoking its sessions removes the identity they were using for lateral movement. Password resets follow, because credentials seen on a compromised host must be treated as stolen. Patching the remaining servers is eradication and recovery work: it prevents reinfection but does not stop the current intrusion. The same reasoning is used for severity levels and service level agreements - the most damaging, most time-critical action goes first.",
 focus:"Order containment by impact and urgency: channel, then host, then identity, then credentials, then remediation."
}
,

{
 id:"M13",theme:"Threat Intelligence",type:"fill",pts:2,
 title:"Finish the intelligence sharing paragraph in the partner report",
 scenario:"You are drafting the sharing annex of a quarterly report. The paragraph that describes how your team received and handled partner intelligence still has blanks in it.",
 question:"Fill every blank with the correct term from the word bank.",
 answerLabel:"Fill the blanks - drag a term into each blank",
 text:"A partner CERT shared a report with our sector {0} under the marking {1}. Our platform ingested the material as {2} objects pulled over {3}, stored it in {4} alongside our own events, and attached a {5} that reflects how much the source trusts the information.",
 slots:[{a:"ISAC"},{a:"Traffic Light Protocol AMBER"},{a:"STIX"},{a:"TAXII"},{a:"MISP"},{a:"confidence score"}],
 bank:["TLP:RED","OpenIOC","sandbox detonation","disaster recovery"],
 hint:"The sector body is the ISAC. The marking that lets a named community see material is TLP:AMBER. The transport for the objects is TAXII.",
 explain:"An ISAC is the sector-based sharing body; a CERT is the national or vendor response team. Traffic Light Protocol AMBER is limited disclosure: the recipients may share it on a need-to-know basis inside their own organisation and with their clients, but not publish it, and TLP:AMBER+STRICT removes even the client exception. TLP:RED would have restricted it to the named individuals only. STIX is the structured data model for indicators, and TAXII is the transport used to pull those objects. MISP is a common platform for storing and sharing them. A confidence score records how sure the source is, so analysts can rank a low-confidence indicator differently from a proven one. OpenIOC is an older indicator format, not a transport.",
 focus:"Learn the sharing vocabulary as a set: ISAC and CERT for communities, TLP for handling, STIX/TAXII and MISP for exchange, confidence score for trust."
},
{

  {id:"l1",t:"MISP",g:"g1"},

  {id:"l3",t:"OpenIOC",g:"g3"},
  {id:"l4",t:"STIX and TAXII",g:"g4"},
  {id:"l5",t:"Passive DNS",g:"g5"},

 ],
 right:[
  {id:"r1",t:"A sharing platform that stores indicators and events for partner communities",g:"g1"},
  {id:"r2",t:"A rule format that describes patterns in files so scanners can flag matching samples",g:"g2"},
  {id:"r3",t:"An older XML indicator format that also records the evidence behind a finding",g:"g3"},
  {id:"r4",t:"A structured data model for indicators, paired with the transport that moves them",g:"g4"},
  {id:"r5",t:"A history of which domains once resolved to an address, used to enrich an indicator",g:"g5"},
  {id:"r6",t:"Watching criminal forums and markets for your data, brand or credentials",g:"g6"}
 ],
 hint:"One pair is a model plus its transport, one is a file-pattern language, one is an ageing XML format, and one is a historical DNS record store.",
 explain:"MISP is a threat intelligence platform used to store and share events with a community. YARA is a pattern language for files, widely used to classify malware samples. OpenIOC is an older XML format that describes indicators together with the evidence that produced them. STIX is the data model and TAXII the transport, so they belong together. Passive DNS gives history for an address or domain and is a standard enrichment step. Dark web monitoring watches criminal forums for mentions of your organisation, data or credentials. Together these turn raw threat feeds into intelligence a SOC can act on.",
 focus:"Know the purpose of each tool: platform, file pattern language, legacy format, model plus transport, enrichment source, collection source."
},
{
 id:"M15",theme:"Threat Hunting",type:"dual",pts:3,
 title:"Same wave, two chairs: phishing hunt from blue and from red",
 scenario:"A crew is sending invoice lures to your finance team. You will answer the same situation twice: first as the hunter defending the estate, then as the operator planning the next wave.",
 question:"Answer both questions, first from the defending chair and then from the attacking one.",
 answerLabel:"Blue team then red team",
 alabel:"Blue team - what do you hunt with?",
 blabel:"Red team - what do you change?",
 a:{q:"Which telemetry gives you the earliest reliable chance of catching this campaign before a user clicks?",options:[
  {t:"Mail gateway metadata correlated with DNS and proxy logs by recipient and time",c:true},
  {t:"Full packet capture of every user session, retained for thirty days",c:false},
  {t:"The endpoint antivirus log written after the attachment is opened",c:false},
  {t:"The identity provider log written when a stolen password is first used",c:false}
 ]},
 b:{q:"To make the next wave harder to catch, which single change helps the operator most?",options:[
  {t:"Register a fresh lookalike domain for each wave and relay through residential proxies",c:true},
  {t:"Send the wave at 09:00 every weekday so it blends into routine mail",c:false},
  {t:"Increase the number of recipients in the wave to ten times as many",c:false},
  {t:"Copy the wording of the internal IT newsletter in the lure",c:false}
 ]},
 hint:"Blue side: think about which source tells you a mail arrived and a domain was contacted, before any user acts. Red side: think about what defenders build detections on - re-used infrastructure.",
 explain:"From the blue chair, mail metadata plus DNS and proxy records can be joined on recipient and time, so you see the wave arrive, see who resolved the lure domain and see who connected, all before the attachment runs. Packet capture is heavy and arrives too late for triage, antivirus logs only exist after execution, and identity logs show the aftermath of a stolen password. From the red chair, defenders build detections on infrastructure that repeats: domains, addresses and mail headers. Fresh domains per wave and residential relays break those pivots, while bigger volume and familiar wording actually increase the chance of being noticed. This two-chair exercise is the core idea of purple teaming: red team or threat emulation shows what to hunt, and the hunt shows what to change.",
 focus:"Blue: correlate the earliest sources. Red: remove the repeated infrastructure defenders pivot on."
},
{
 id:"M16",theme:"Incident Response Preparation",type:"spot",pts:2,
 title:"Sign-off review of the incident response plan",
 scenario:"The incident response plan is due for its annual sign-off. Two lines in the section on activation and communication are unsafe and must be corrected.",
 art:{label:"INCIDENT RESPONSE PLAN v4.2 - section 3",body:"<pre>Document : IRP-001 incident response plan, version 4.2\nSection 3: activation, escalation and communication\nOwner    : head of security operations\nReview   : annual sign-off, currently pending\nAction   : the eight numbered lines are listed in the answer block below -\n           click the two that are unsafe.\n</pre>"},
 question:"Click every line that is wrong or unsafe. Each correct line earns its share of the points, and a wrong pick earns nothing - it never subtracts.",
 answerLabel:"Spot the mistake - click the bad lines",
 lines:[
  {n:1,t:"The CSIRT is activated by the on-call incident commander using the published escalation path.",bad:false},
  {n:2,t:"During a major incident the team coordinates on the corporate email system because it is always available to everyone.",bad:true},
  {n:3,t:"Out-of-band communication channels are listed, tested and exercised in the quarterly tabletop exercise.",bad:false},
  {n:4,t:"The plan is published in RFC 2350 style so external parties know how to contact the team.",bad:false},
  {n:5,t:"If a manager is unreachable, the analyst escalates using personal mobile numbers kept in the team chat.",bad:true},
  {n:6,t:"Each playbook lists the first three actions for the most likely incident types in this company.",bad:false},
  {n:7,t:"The plan names the legal contact who decides on legal hold and on any external notification.",bad:false},
  {n:8,t:"The MSSP and the forensic retainer are listed in the annex with contract references and 24x7 numbers.",bad:false}
 ],
 hint:"One line assumes an attacked system will still work. Another relies on an undocumented, personal channel instead of the communication plan.",
 explain:"A major incident often involves email first, so assuming the corporate mail system will be available is exactly the assumption that fails. The plan must define out-of-band communication - a separate bridge, chat or phone tree - and test it. Line 5 is unsafe for two reasons: personal mobile numbers are not the documented escalation path, and a plan that depends on details held in a chat message is not a plan. Everything else is normal practice: RFC 2350 style publication, named legal authority for legal hold and notification, playbooks, and vendor contacts with the MSSP and forensic retainer in the annex.",
 focus:"Preparation means deciding in advance how you will talk when the normal channels are the thing that broke."
},
{
 id:"M17",theme:"Incident Response Preparation",type:"order",pts:2,
 title:"Rebuild the incident management life cycle for the new joiner",
 scenario:"A new analyst has joined the CSIRT. You are building a one-page summary of the incident management life cycle based on NIST SP 800-61, and the six cards came back from the printer in random order.",
 question:"Put the six phase cards into the correct life-cycle order.",
 answerLabel:"Put in order - drag the rows or use the arrows",
 dirLabel:"Earliest phase first",
 items:[
  {id:"s1",t:"Preparation - build the playbooks, the jump bag, the contacts and the training before anything happens"},
  {id:"s2",t:"Detection and analysis - validate the alert, scope the incident and classify its severity"},
  {id:"s3",t:"Containment - stop the spread while keeping the critical services running"},
  {id:"s4",t:"Eradication - remove the malware, the persistence and the access the attacker used"},
  {id:"s5",t:"Recovery - restore services, watch closely and confirm normal operation"},
  {id:"s6",t:"Post-incident activity - lessons learned, root cause analysis and corrective actions"}
 ],
 hint:"Nothing can be contained before it is detected, and nothing can be learned until the service is back and stable.",
 explain:"NIST SP 800-61 Revision 2 organises incident handling into four phases: preparation; detection and analysis; containment, eradication and recovery; and post-incident activity. The third phase contains the three stages you just ordered - containment stops the damage, eradication removes the cause, recovery brings the service back under observation - and other models, such as the SANS PICERL list, show them as separate steps instead. Preparation is the only phase you control completely, and it is where playbooks, the jump bag, forensic readiness and training live. Detection and analysis decides whether an event is an incident and how severe it is. Post-incident activity turns the incident into improvement - but only after recovery, because the evidence and the people are still needed during the response.",
 focus:"Memorise the NIST SP 800-61 phases and know which phase owns playbooks and which phase owns lessons learned."
},
{
 id:"M18",theme:"Post-Incident Activity",type:"dd",pts:2,
 title:"Which side of the incident does this task belong to?",
 scenario:"You are mentoring a junior analyst who keeps calling everything 'after the incident'. You hand over a list of eight real tasks from the last ransomware exercise and ask them to sort the tasks into the preparation phase or the post-incident activity phase.",
 question:"Drag each task into the correct phase of the incident management life cycle.",
 answerLabel:"Drag and drop - two boxes",
 buckets:[{id:"prep",l:"Preparation phase"},{id:"post",l:"Post-incident activity phase"}],
 items:[
  {id:"i1",t:"Run a tabletop exercise on a ransomware scenario",b:"prep"},
  {id:"i2",t:"Confirm the forensic workstation and the write blockers still work",b:"prep"},
  {id:"i3",t:"Name a deputy for every response role in the plan",b:"prep"},
  {id:"i4",t:"Test the out-of-band communication channel end to end",b:"prep"},
  {id:"i5",t:"Write the after-action report with the intrusion timeline",b:"post"},
  {id:"i6",t:"Interview the responders and record what slowed them down",b:"post"},
  {id:"i7",t:"Update the detections that missed the initial access",b:"post"},
  {id:"i8",t:"Assign an owner and a due date to every corrective action",b:"post"}
 ],
 hint:"Everything that makes you ready before an incident is preparation. Everything that turns a finished incident into learning and change is post-incident activity.",
 explain:"Preparation happens before an incident: tabletop exercises, tested forensic readiness, named deputies and a working out-of-band channel. Post-incident activity happens after the service is stable again: the after-action report and timeline, the blameless post-mortem where responders say what slowed them down, detection engineering to close the gap that let the attacker in, and corrective actions with owners and dates. The post-incident phase also decides evidence retention and the closure criteria for the case, and it feeds the next risk assessment and the next update of the plan.",
 focus:"Preparation is investment before the event; post-incident activity is learning plus owned, dated change after it."
}
,

{
 id:"M19",theme:"Incident Response Preparation",type:"queue",pts:2,
 title:"Duty commander: classify four live incidents against the severity matrix",
 scenario:"You are the duty incident commander for the afternoon shift. Four situations are on your screen and each one needs a severity level so that the right escalation path and response time are used.",
 art:{label:"SEVERITY MATRIX (extract from the incident response plan)",body:
 "<pre>SEV1  Confirmed compromise of a critical system, data loss or regulatory impact\n"+
 "      Response 15 min  - CSIRT all hands, commander + legal informed\n"+
 "SEV2  Confirmed compromise of a non-critical system, or strong suspicion\n"+
 "      on a critical system.  Response 30 min - CSIRT core team\n"+
 "SEV3  Suspicious activity that needs investigation, no confirmed compromise\n"+
 "      Response 4 hours - duty analyst, escalation if confirmed\n"+
 "SEV4  Policy or hygiene issue with no threat actor involved\n"+
 "      Response next business day - service owner remediation\n"+
 "Service level agreement: response clock starts when the case is opened.\n</pre>"},
 question:"Assign a severity level to each of the four incidents.",
 answerLabel:"Severity - set one per incident",
 options:["SEV1","SEV2","SEV3","SEV4"],
 alerts:[
  {id:"s1",short:"INC-441",sev:"payment platform",t:"Three of twelve production payment gateway nodes are showing files renamed with the .lock7 extension and a ransom note in each folder.",answer:"SEV1"},
  {id:"s2",short:"INC-442",sev:"single laptop",t:"One marketing laptop is beaconing to a known command-and-control address. The user is on leave, the disk holds no customer data and no shared drive was mounted.",answer:"SEV2"},
  {id:"s3",short:"INC-443",sev:"reported phish",t:"Two users report a phishing email. The mail gateway blocked the attachment, the URL was blocked at the proxy and no user opened anything.",answer:"SEV3"},
  {id:"s4",short:"INC-444",sev:"audit finding",t:"An audit finds one internal server running an unsupported operating system with missing patches. No indicators of compromise were found on it.",answer:"SEV4"}
 ],
 hint:"Confirm first, then classify. Critical system plus confirmed compromise is the top level; a non-critical confirmed compromise sits one below; unconfirmed suspicion sits in the middle; a hygiene issue with no attacker sits at the bottom.",
 explain:"Incident classification follows impact and confirmation, not how alarming the alert sounds. A payment platform with encrypted production files is a confirmed compromise of a critical system, so it is SEV1 with a 15-minute service level agreement. A confirmed implant on one laptop with no sensitive data and no spread is a confirmed compromise of a non-critical system, so SEV2. A blocked phishing wave that nobody opened is suspicion that must still be investigated and hunted, so SEV3 - the analyst checks whether anyone else received it. An unpatched server with no compromise evidence is a hygiene finding, so SEV4. Business impact analysis is what tells you which systems are critical in the first place.",
 focus:"Classify by impact multiplied by confirmation, and check the response clock that the service level agreement attaches to each level."
},

 hint:"Separate the person who decides, the person who works the keyboard, the person who talks, the person who protects the evidence, the person who reads the law and the person who writes it all down.",
 explain:"A CSIRT works because the roles are decided before the incident, not during it. The incident commander owns decisions and the escalation path. The handler does the hands-on investigation. Communications controls what is said internally and externally, which is why spokespeople are named in advance. Legal decides whether a legal hold, a regulatory notification or a police report is needed. The forensics lead protects evidence and the chain of custody. The scribe keeps the timeline in the case management system so the after-action report writes itself. One person can hold two roles in a small team, but each role must have an owner and a deputy.",

},
{
 id:"M21",theme:"Incident Response Preparation",type:"fill",pts:2,
 title:"Complete the evidence intake form",
 scenario:"You are filling in the standard evidence intake form for a case that may end up in court. The form is a template with the technical terms left blank.",
 question:"Fill each blank in the evidence intake form.",
 answerLabel:"Fill the blanks - drag a term into each blank",
 text:"Because volatile data disappears first, the team follows the {0} rule and captures memory before touching the disk. The disk is then imaged through a hardware {1} so that nothing is written to the original. A SHA-256 {2} of the image is calculated, recorded and re-verified after every copy. Each transfer of the item is written on the {3} form and signed by both people. Because litigation is likely, legal issues a {4} so that mailboxes and logs cannot be deleted. The sealed images are stored in the evidence locker for the agreed period as part of {5}.",
 slots:[{a:"order of volatility"},{a:"write blocker"},{a:"hashing"},{a:"chain of custody"},{a:"legal hold"},{a:"evidence preservation"}],
 bank:["disaster recovery","breach notification","root cause analysis","forensic readiness"],
 hint:"The rule about what to capture first is about volatility. The device that stops writes is a blocker. The rule that stops deletion is a hold.",
 explain:"The order of volatility says collect the most perishable evidence first: memory and network state before the disk, because they disappear on shutdown. A write blocker prevents any write to the original media, which is what keeps the copy defensible. Hashing proves the image is identical to the original and that it has not changed since. The chain of custody records who held the evidence and when, and a break in it damages the case. A legal hold orders staff and systems to preserve data once litigation or an investigation is likely. Together these are what people mean by evidence preservation, and they are planned in advance as forensic readiness.",
 focus:"Learn the acquisition order and the four forms: write blocker, hash record, chain of custody and legal hold."
},

 hint:"Two items protect the copy of the data, one proves the copy is faithful, two protect the physical item, and one records who held it.",
 explain:"A hardware write blocker keeps the original disk untouched while it is copied, and the blank verified drives are where the copy goes. The hash utility proves the copy matches the original, which is what makes the evidence defensible later. A Faraday bag isolates a mobile device so nobody can wipe it remotely while it waits for analysis. Tamper-evident bags and labels keep the item sealed and identifiable, and the chain of custody forms record every handover. Keeping this bag packed, tested and stored is what forensic readiness means, and it is the difference between evidence and an interesting story.",
 focus:"Learn what each jump bag item protects: the original, the copy, the proof, the device, the seal, the record."
},
{
 id:"M23",theme:"Incident Response Preparation",type:"branch",pts:3,
 title:"03:12 tabletop: activation, escalation and notification",
 scenario:"You are the on-call analyst. This is a live exercise that is scored like the real playbook. The SOAR platform has opened case IR-3388 automatically and the clock is running.",
 question:"Work through the activation decisions one step at a time.",
 answerLabel:"Branching scenario - choose at each step",
 start:"s1",
 steps:[
  {id:"s1",q:"Step 1 - EDR flags a finance workstation for a credential-dumping attempt at 03:12. What is your first action?",options:[
    {t:"Validate and scope the alert in EDR and identity logs before anything else",ok:true,fb:"Correct. Step one of the playbook is always validation: what ran, which account, which hosts, how far did it get. Classification comes after the facts.",next:"s2"},
    {t:"Declare a SEV1 and wake the whole CSIRT immediately",ok:false,fb:"Too early. Waking the whole team before validation burns goodwill and budget, and it makes the next genuine SEV1 harder to sell.",next:"s2"},
    {t:"Email the user to ask whether they installed anything unusual tonight",ok:false,fb:"An unvalidated conversation can warn an intruder, and the user's mailbox may itself be part of the compromise.",next:"s2"}
  ]},
  {id:"s2",q:"Step 2 - you confirm credential dumping, and the account has authenticated to five servers in the last hour. What now?",options:[
    {t:"Classify the severity, activate the CSIRT and start the credential-theft playbook",ok:true,fb:"Correct. Facts now support a severity level, so the documented escalation path and the matching playbook take over.",next:"s3"},
    {t:"Clean the host yourself and tell the manager in the morning",ok:false,fb:"Destroying the implant destroys the evidence and leaves the five other hosts untouched. Never clean before you scope.",next:"s3"},
    {t:"Isolate the workstation and then wait for the user to reply before doing more",ok:false,fb:"Isolation is right, waiting is not. Credentials have already been used on other systems, so the response continues without the user.",next:"s3"}

  {id:"s3",q:"Step 3 - the incident commander asks who decides on notifying the regulator and the cyber insurer. Who owns that decision?",options:[
    {t:"The named legal contact, using the communication plan and the cyber insurance terms",ok:true,fb:"Correct. Notification duty and insurance claims are a legal and contractual decision with a clock attached, so the named contact owns it.",next:null},
    {t:"The duty analyst, by emailing the regulator from the on-call mailbox",ok:false,fb:"Notification wording and timing have legal weight. Ad hoc messages create obligations and can breach the policy terms.",next:null},

 ],
 hint:"Validate, then classify and activate, then let legal own notification. The trap in each step is an action that destroys evidence, wastes the team, or moves a legal decision to the wrong owner.",
 explain:"This is a tabletop exercise in disguise, and it walks the preparation phase: the playbook tells you to validate before you activate, the severity matrix tells you what to activate and how fast, and the communication plan tells you who speaks. Validation first protects the evidence and the team's credibility. Cleaning a host before scoping it is the classic error: the implant is the map of where the attacker is. Notification duties - regulator, insurer, customers - are legal and contractual decisions with deadlines, so the named legal contact owns them and the approved wording lives in the communication plan.",

 title:"EDR review: what actually happened on WS-2214?",

  {t:"2024-03-11T08:42:01Z EDR WS-2214 ProcessCreate: powershell.exe -> schtasks.exe /create /tn OneDriveSync /sc minute /mo 10",lv:"warn"},
  {t:"2024-03-11T08:42:02Z EDR WS-2214 FileCreate: C:\\Users\\r.okoro\\AppData\\Roaming\\OneDriveSync\\svc.dll",lv:"warn"},
  {t:"2024-03-11T08:42:02Z EDR WS-2214 RegistrySet: HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\OneDriveSync",lv:"warn"},
  {t:"2024-03-11T08:52:04Z EDR WS-2214 ProcessCreate: schtasks.exe -> rundll32.exe svc.dll,Start",lv:"warn"},
  {t:"2024-03-11T08:52:06Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB status 200",lv:"crit"},

  {t:"2024-03-11T09:02:05Z proxy WS-2214 POST hxxps://a1b2c3[.]sync-node[.]top/api/v2/up 1.4 KB status 200",lv:"crit"},
  {t:"2024-03-11T09:16:00Z EDR WS-2214 AlertRaised: 'Suspicious scheduled task created by Office process'",lv:"crit"}
 ],
 answerLabel:"Choose one - use the EDR telemetry above as your evidence",
 inner:{q:"Which statement best describes what the telemetry shows?",options:[
  {t:"A loader started by Outlook installed persistence and beacons every ten minutes",c:true},

  {t:"An IT automation task was created and it ran a signed system library",c:false},
  {t:"A phishing email was delivered and the attachment was blocked by policy",c:false}
 ]},

 explain:"Outlook is the parent of a hidden, encoded PowerShell command, which connects out and creates a scheduled task named after a product that is not installed. That task runs a DLL from the user profile every ten minutes, and the proxy sees the same small POST to a1b2c3[.]sync-node[.]top after every run. That is a loader with persistence and command-and-control beaconing. The key details that rule out the other answers: the library sits in the user's AppData folder, not in a signed system path; the parent is a mail client, not a management tool; and the beacon repeats on the scheduled interval. The gap between first execution at 08:41 and the alert at 09:16 is 35 minutes of dwell time on this host before detection.",

 text:"Quarterly metrics for the CSIRT. The {0} for SEV1 cases fell from 62 to 38 minutes, which means we detect intrusions faster. The {1} stayed flat at nine hours from detection to full service restoration. Average host {2} - the time an intruder spends inside before anyone notices - fell to 11 hours. Cases now close only when the {3} are met: eradication verified, no further beaconing, and the evidence retention period recorded. {4} for SEV1 runs for 30 days after recovery, and any case that breaches the {5} triggers a formal review.",

 hint:"Detection speed and repair speed are two different clocks. The third is how long the intruder was inside before you knew.",
 explain:"Mean time to detect (MTTD) measures how long until the good guys notice, and mean time to respond or repair (MTTR) measures how long until service is healthy again. Dwell time is the attacker's clock: how long they were inside undetected. Those three numbers tell the story of a CSIRT better than any single incident report. Closure criteria are the conditions that must be true before a case may be closed - eradication verified, monitoring completed, evidence retained - and post-incident monitoring is the watch period after recovery, because attackers often return. The service level agreement sets the target clock for each severity level, and breaching it triggers a review. Reading these clocks together is dwell time analysis: it shows whether you are slow to see, slow to decide or slow to repair. Sharing finished indicators with the sector through indicator sharing is the last step, because what you learned is worth more to your peers than it costs you.",

 answerLabel:"Fill the blanks - drag a term into each blank",
 text:"The exposure involved {0} - names, addresses and national insurance numbers - for about 4,200 customers. Because the company processes data in the European Union, the {1} requires a {2} to the supervisory authority within 72 hours of becoming aware of the incident. Customer records are retained as part of the agreed {3} so the notification can be proved later. The lessons from the case feed the annual {4} and the {5} cycle that updates the plan, the detections and the training.",

 hint:"Two styles differ by whether the hunt starts with a hypothesis or with a hunch. One starts from a valuable target, one from fresh reporting, and one from spare time.",
 explain:"Structured hunting is hypothesis-driven and methodical, often mapped to ATT&CK techniques and tracked with the ATT&CK Navigator. Unstructured hunting starts from a hunch, a user report or an odd metric and follows the evidence. An entity-driven hunt picks the crown jewels - a critical server, a privileged account, a database - and hunts around that entity. Intelligence-led hunting uses fresh threat intelligence about a named actor or campaign to set priorities, which is the tightest link between the intelligence team and the hunt team. Ad hoc hunting is opportunistic and depends on free time, so it is the least repeatable. Most mature teams use a hybrid hunting team model: a small dedicated core plus analysts from the SOC, all working the same hunt loop of hypothesis, data source, query, validation and documentation.",
