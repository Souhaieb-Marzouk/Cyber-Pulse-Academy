window.__EXAM_DATA__ = {"meta":{"topicId":"cysa-plus","chapter":12.2,"title":"12.2 - Analyzing Cloud Vulnerabilities - MEDIUM","cert":"CompTIA CySA+ (CS0-003)","difficulty":"medium","passMark":70},"timerSeconds":3000,"themes":[{"id":"tools","name":"Cloud assessment tools","short":"Tools"},{"id":"containers","name":"Containers, IaC & serverless scanning","short":"IaC/Containers"},{"id":"misconfig","name":"Cloud misconfigurations","short":"Misconfig"},{"id":"shared","name":"Shared responsibility model","short":"Shared resp."},{"id":"output","name":"Scan output & CVSS","short":"Output/CVSS"},{"id":"cspm","name":"Posture management & compliance","short":"Posture"},{"id":"report","name":"Reporting & remediation","short":"Reporting"}],"keywords":[{"theme":"Cloud assessment tools","items":["ScoutSuite","Prowler","Pacu","CloudSploit","Nessus / Tenable","Qualys Cloud Platform","Prisma Cloud","Wiz","Orca Security","Amazon Inspector","AWS Security Hub","AWS Config","Microsoft Defender for Cloud","Azure Policy","GCP Security Command Center","OpenSCAP / SCAP","CIS Benchmarks / CIS-CAT"]},{"theme":"Containers, IaC & serverless scanning","items":["Trivy","Clair","Kube-bench","Kube-hunter","Checkov","tfsec","IaC scanning (Terraform / CloudFormation)","Image / registry scanning","SBOM & dependency scanning"]},{"theme":"Cloud misconfigurations","items":["Public object storage exposure","Open security groups","Overly permissive IAM","Unencrypted storage at rest","Disabled audit logging","Missing MFA / root account risk","IMDSv1 / metadata SSRF","Public snapshots / AMIs","Exposed management ports","Permissive CORS","Default credentials","Kubernetes RBAC & pod security"]},{"theme":"Shared responsibility model","items":["Security OF the cloud vs IN the cloud","IaaS / PaaS / SaaS split","Customer responsibilities","Provider responsibilities"]},{"theme":"Scan output & CVSS","items":["CVSS v3.1 base score","CVSS vector string","Severity bands","CVE","CWE","False positive","False negative","Credentialed vs non-credentialed scans","Agent-based vs agentless scanning","Scan scope & completeness"]},{"theme":"Posture management & compliance","items":["CSPM","CWPP","CIEM","CASB","Continuous monitoring & drift","Guardrails","Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)"]},{"theme":"Reporting & remediation","items":["Findings report structure","Remediation vs mitigation","Risk-based prioritization (KEV / EPSS)","SLA & ticket tracking","Rescan validation","Exception & compensating control","Asset criticality","Ownership assignment","Trend analysis","Risk acceptance"]}],"exercises":[{"id":"m01","type":"triage","th":"misconfig","ti":"SOC morning queue - four cloud alerts","pts":4,"sc":"You are the on-call SOC analyst at Meridian Retail. Overnight the queue collected four cloud alerts from AWS Security Hub, the external attack-surface scanner and CloudTrail. It is 07:40 and the shift lead asks you to triage in order of risk.","q":"Choose the best first action for each alert. Think about exposure, data risk and evidence.","d":{"alerts":[{"name":"EC2 instance i-0d42: port 3389 open from 0[.]0[.]0[.]0/0","meta":"Security Hub | RDP exposed to internet | us-east-1 | found by port scan","opts":[{"h":"Close it - the port scan is probably wrong"},{"h":"Verify reachability, then raise a HIGH ticket to restrict the rule to the VPN range","ok":true},{"h":"Escalate to incident response as an active breach"}],"why":"An open management port is a real exposure, but there is no evidence of use yet. Verify, then restrict. IR escalation needs signs of exploitation."},{"name":"S3 bucket meridian-backup-2024 is publicly listable","meta":"Security Hub | S3.1 Block Public Access off | 1.2 TB | backups since 2023","opts":[{"h":"Ask the bucket owner to confirm the data is harmless"},{"h":"Raise a CRITICAL ticket: restrict the bucket now and review access logs for downloads","ok":true},{"h":"Low priority - schedule for next quarter"}],"why":"A public backup bucket can expose customer data at scale. Restrict access first, then check logs to see if anyone pulled objects."},{"name":"Root account console login from 203[.]0[.]113[.]9 without MFA","meta":"CloudTrail | ConsoleLogin | userIdentity=root | 03:12 UTC","opts":[{"h":"Wait for the root owner to answer email"},{"h":"Note it for the monthly report"},{"h":"CRITICAL: page IR, review what the session did in CloudTrail and contain","ok":true}],"why":"Root login without MFA from an unknown IP looks like account takeover. Contain first, investigate after."},{"name":"CloudTrail trail stopped logging","meta":"Security Hub | trail not logging | stopped 6 days ago","opts":[{"h":"Restart logging now and find out who stopped it and why","ok":true},{"h":"Ignore - logging costs money"},{"h":"Escalate as a confirmed data breach"}],"why":"Without CloudTrail you have no audit trail. Restart logging, then investigate who stopped it and what happened during the gap."}]},"ex":"<b>Why:<\/b> Triage matches response strength to risk. Public data and account takeover are critical. Exposure without evidence of abuse gets a fast normal ticket. Loss of logging hurts visibility, so it is important but not a breach by itself. <b>Focus on:<\/b> always separating <i>exposure<\/i> (fast ticket) from <i>active misuse<\/i> (IR escalation).","k":["AWS Security Hub","security group","public bucket","MFA","CloudTrail","port scan"],"hint":"Rank data exposure and account takeover above everything else. Logging gaps come next."},{"id":"m02","type":"qcm","th":"shared","ti":"Who owns the public RDS snapshot?","pts":2,"sc":"A quarterly review of the cloud account at Meridian Retail finds an RDS snapshot of the <code>customers<\/code> database (names, emails, hashed passwords) shared publicly. The snapshot was created by a data analyst in 2023.","q":"Under the shared responsibility model, who must fix this and why?","d":{"opts":[{"h":"AWS, because RDS snapshots are part of a managed service","sub":"managed means the provider runs it end to end"},{"h":"The customer, because snapshot sharing and data protection are customer duties","ok":true,"sub":"security IN the cloud is customer work"},{"h":"Nobody, because snapshots are encrypted by default and safe to share"},{"h":"The database vendor, because the data sits in the engine's file format"}]},"ex":"<b>Why:<\/b> AWS protects the infrastructure <i>of<\/i> the cloud: hardware, hypervisor, managed service internals. What customers put in the service - data, snapshot sharing settings, IAM, encryption choices - is <i>in<\/i> the cloud and stays customer work. Snapshots are not encrypted unless you ask for it, and sharing settings are customer config. <b>Focus on:<\/b> managed service does not mean managed responsibility for your data.","k":["public snapshots / AMIs","Security OF the cloud vs IN the cloud","unencrypted storage at rest"],"hint":"Ask yourself: is the failure in the provider platform, or in something the customer configured?"},{"id":"m03","type":"dnd","th":"output","ti":"Sort the scanner findings into severity bands","pts":4,"sc":"Qualys finished a cloud VM scan of the Meridian Retail production account. The report lists six findings with their CVSS v3.1 scores. Your shift lead wants them sorted before the morning stand-up.","q":"Drag each finding into the severity band its CVSS score belongs to. Bands: Critical 9.0-10.0, High 7.0-8.9, Medium 4.0-6.9, Low 0.1-3.9.","d":{"items":[{"k":"a","h":"CVE-2021-44228 in a logging library - CVSS 10[.]0"},{"k":"b","h":"Kubernetes RBAC ClusterRole with '*' on '*' in a dev cluster - CVSS 5[.]3"},{"k":"c","h":"TLS 1.0 still accepted - CVSS 3[.]7"},{"k":"d","h":"Remote code execution in the image library - CVSS 9[.]8"},{"k":"e","h":"Sudo privilege escalation (local only) - CVSS 7[.]8"},{"k":"f","h":"DNS cache snooping - CVSS 4[.]3"}],"slots":[{"h":"<b>CRITICAL<\/b> 9.0-10.0","t":"Critical","accept":["a","d"],"why":"10[.]0 and 9[.]8 land here"},{"h":"<b>HIGH<\/b> 7.0-8.9","t":"High","accept":["e"]},{"h":"<b>MEDIUM<\/b> 4.0-6.9","t":"Medium","accept":["b","f"]},{"h":"<b>LOW<\/b> 0.1-3.9","t":"Low","accept":["c"]}]},"ex":"<b>Why:<\/b> The band comes from the number alone: 9.0-10.0 critical, 7.0-8.9 high, 4.0-6.9 medium, 0.1-3.9 low. 10[.]0 and 9[.]8 are critical; 7[.]8 high; 5[.]3 and 4[.]3 medium; 3[.]7 low. The score describes the flaw - real priority also needs asset exposure and data. <b>Focus on:<\/b> know the band edges by heart; scanners place findings using them.","k":["CVSS v3.1 base score","Severity bands","CVE","Qualys Cloud Platform"],"hint":"Only the number decides the band. Context decides the order of work, not the band."},{"id":"m04","type":"match","th":"tools","ti":"Match each cloud assessment tool to its job","pts":3,"sc":"A new cloud security engineer joined Meridian Retail. She keeps mixing up the tools in the runbooks. You are preparing her onboarding card.","q":"Match every tool to the job it is actually built for. One job per tool.","d":{"items":[{"k":"scout","h":"Multi-cloud posture audit of AWS, Azure and GCP configurations"},{"k":"prowler","h":"AWS-focused CIS benchmark and security best-practice auditing"},{"k":"pacu","h":"AWS exploitation framework used to simulate attacker post-exploitation"},{"k":"inspector","h":"AWS-native vulnerability scanning of EC2 instances and Lambda functions"},{"k":"kbench","h":"Checks a Kubernetes cluster against the CIS Kubernetes Benchmark"},{"k":"trivy","h":"Scans container images and IaC templates for CVEs and misconfigurations"},{"k":"khunter","h":"Kubernetes-focused penetration testing: finds exposed control planes and weak settings"}],"slots":[{"h":"ScoutSuite","t":"ScoutSuite","accept":["scout"]},{"h":"Prowler","t":"Prowler","accept":["prowler"]},{"h":"Pacu","t":"Pacu","accept":["pacu"]},{"h":"Amazon Inspector","t":"Inspector","accept":["inspector"]},{"h":"Kube-bench","t":"kube-bench","accept":["kbench"]},{"h":"Trivy","t":"Trivy","accept":["trivy"]},{"h":"Kube-hunter","t":"kube-hunter","accept":["khunter"]}]},"ex":"<b>Why:<\/b> ScoutSuite audits posture across the big three clouds. Prowler is the AWS best-practice auditor. Pacu is offensive - it abuses AWS permissions like an attacker. Inspector scans instances and serverless for CVEs. Kube-bench checks CIS compliance of a cluster, while Kube-hunter attacks it. Trivy scans images and templates. <b>Focus on:<\/b> audit vs attack vs image scan - three different jobs that beginners merge.","k":["ScoutSuite","Prowler","Pacu","Amazon Inspector","Kube-bench","Kube-hunter","Trivy"],"hint":"Two of these tools are offensive-style. The rest only audit or scan."},{"id":"m05","type":"fib","th":"output","ti":"Complete the finding summary for the ticket","pts":3,"sc":"Fill the ticket summary with the right keywords. The word bank has more words than blanks.","q":"Read the finding extract, then fill the five blanks from the word bank. Extra chips are decoys.","d":{"mode":"chips","text":"The scan ran in {{0}} mode because the Inspector agent collected a full package list, so its inventory is trustworthy. The worst finding is {{1}} with a CVSS of {{2}}, which puts it in the {{3}} band. The {{4}} id links the flaw to a public catalog entry.","bank":["critical","CVE","10[.]0","credentialed","CWE","agentless","7[.]8","false positive","CVE-2021-44228"],"blanks":[{"a":["credentialed"]},{"a":["CVE-2021-44228","cve-2021-44228"]},{"a":["10[.]0"]},{"a":["critical"]},{"a":["CVE"]}]},"ex":"<b>Why:<\/b> An agent reporting a package inventory is the <i>credentialed<\/i> (in-host) way to scan, and its inventory is accurate. Log4Shell scores 10[.]0, which is the critical band, and the catalog identifier is the CVE. <b>Focus on:<\/b> credentialed scans see installed packages; agentless outside scans guess from the network and miss more.","k":["Credentialed vs non-credentialed scans","CVE","CVSS v3.1 base score","Severity bands","Amazon Inspector"],"hint":"The agent collected packages - that word describes the scan mode.","art":[{"kind":"log","title":"Inspector finding INS-F-2211 - ec2-user@web-prod-04","lines":["2026-10-12T05:14:02Z INFO  Inspector agent heartbeat: host web-prod-04 (10[.]0[.]14[.]7) reachable","2026-10-12T05:14:31Z INFO  Package inventory collected: 214 packages (credentialed mode)","2026-10-12T05:15:09Z CRIT   CVE-2021-44228 log4j-core 2.14.1  CVSS 10[.]0  AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H","2026-10-12T05:15:10Z HIGH   CVE-2022-22965 spring-beans 5.2.3  CVSS 9[.]8"]}]},{"id":"m06","type":"spot","th":"misconfig","ti":"Spot the bad lines in the IAM policy","pts":3,"sc":"The pipeline role only needs to push images and update two services. The full policy document is opened in the review board below.","q":"Click every line that makes this policy dangerous, then Check.","d":{"title":"iam/policy/ops-deploy.json - opened in the review board","lines":[{"t":"{","bad":false,"why":"syntax only"},{"t":"  \"Version\": \"2012-10-17\",","bad":false,"why":"current policy language version"},{"t":"  \"Statement\": [{","bad":false,"why":"syntax only"},{"t":"    \"Sid\": \"DeployFromPipeline\",","bad":false,"why":"just a label"},{"t":"    \"Effect\": \"Allow\",","bad":false,"why":"Allow is fine when scoped"},{"t":"    \"Action\": \"*\",","bad":true,"why":"grants every action - not least privilege"},{"t":"    \"Resource\": \"*\"","bad":true,"why":"grants access to every resource in the account"},{"t":"  }]","bad":false,"why":"syntax only"},{"t":"}","bad":false,"why":"syntax only"}]},"ex":"<b>Why:<\/b> <code>\"Action\": \"*\"<\/code> plus <code>\"Resource\": \"*\"<\/code> is the classic over-permissive IAM pair: any action on anything, including deleting logs or creating users. Least privilege means naming the few actions (push, update service) and the exact ARNs. <b>Focus on:<\/b> one wildcard <i>may<\/i> be defensible during migration; the pair together never is.","k":["Overly permissive IAM","Ownership assignment"],"hint":"Two lines carry the risk. Look for wildcards in Action and Resource."},{"id":"m07","type":"order","th":"report","ti":"Order the fix workflow for the public bucket","pts":3,"sc":"Ticket MER-2841: a CSPM tool flagged bucket <code>meridian-receipts-prod<\/code> as publicly readable. It contains customer receipts. You confirmed the finding in the console.","q":"Put the response steps in the order a disciplined analyst works them.","d":{"items":[{"k":"a","h":"Confirm real exposure: read the bucket policy and ACL, test public access"},{"k":"b","h":"Contain: turn on Block Public Access and fix the policy"},{"k":"c","h":"Assess impact: check access logs and CloudTrail data events for outside downloads"},{"k":"d","h":"Rescan with the CSPM tool and verify the finding cleared"},{"k":"e","h":"Close the ticket with evidence and note the owner for follow-up"}],"correct":["a","b","c","d","e"]},"ex":"<b>Why:<\/b> The order is confirm, contain, assess impact, rescan, close with evidence. Containment always beats investigation - stop the bleeding, then look at logs. An AWS Config timeline on the bucket also proves when the policy changed. Closing without a rescan leaves the finding half-trusted, and closing without evidence leaves no record. <b>Focus on:<\/b> rescan validation is what proves the fix, not the ticket status.","k":["Rescan validation","public object storage exposure","Findings report structure","CSPM"],"hint":"First make sure it is real. Last make sure it is gone."},{"id":"m08","type":"multi","th":"shared","ti":"Which duties stay with the customer on IaaS?","pts":3,"sc":"Meridian Retail runs a mix of EC2 virtual machines, RDS databases and S3 storage. A new GRC auditor asks which duties the customer keeps when the service is plain IaaS.","q":"Select every duty that stays with the customer on an IaaS virtual machine.","d":{"opts":[{"h":"Patching the guest operating system","ok":true,"sub":"you own the OS on IaaS"},{"h":"Patching the hypervisor under the VM","sub":"provider work - security of the cloud"},{"h":"Configuring security groups and network ACLs","ok":true,"sub":"customer network config"},{"h":"Physically replacing failed disks in the datacenter","sub":"provider work"},{"h":"Encrypting the application data and managing keys","ok":true,"sub":"customer data duty"},{"h":"Maintaining the physical building security","sub":"provider work"}]},"ex":"<b>Why:<\/b> On IaaS the provider covers physical security, hardware and hypervisor; the customer keeps the guest OS, network config, IAM, data and encryption. Convergence is the classic exam trap: the hypervisor is <i>of<\/i> the cloud; the OS inside your VM is <i>in<\/i> it. <b>Focus on:<\/b> moving up to PaaS (RDS) removes OS patching from your list; SaaS removes almost everything but data and access.","k":["Customer responsibilities","Provider responsibilities","Security OF the cloud vs IN the cloud","IaaS / PaaS / SaaS split"],"hint":"If the customer can log into it or configure it, it is the customer's duty."},{"id":"m09","type":"terminal","th":"tools","ti":"Run the posture audit","pts":2,"sc":"You are the cloud security engineer for the Meridian AWS account. Your manager asks for a full posture audit of the account configuration using the multi-cloud open-source auditor installed on this box. Output must land in the default report folder.","q":"Use the `scout` posture-audit command to audit the AWS account with its default profile. Type the command, press Enter, then Check.","d":{"prompt":"analyst@cloudbox","title":"MER-CLOUDBOX - assessment tooling","cmds":[{"re":"^scout\\s+aws(\\s|$)","ok":true,"out":"Scout Suite v5.14 - launching cloud provider AWS...\nUsing cloud provider: aws | profile: default\nReport written to scoutsuite-report/scoutsuite-report.html\nSummary: 27 services assessed - 132 findings - 9 critical, 38 high, 61 warning, 24 info"},{"re":"^scout(\\s|$)","ok":false,"out":"usage: scout <provider> [options]\nproviders: aws, azure, gcp, alibaba, oci\nexample: scout aws --session-token ... --report-dir ./reports"},{"re":"^(aws\\s|aws$)","ok":false,"out":"[aws cli] that runs single API calls - it does not audit account posture."},{"re":"^nmap","ok":false,"out":"Starting Nmap... this is a port scanner, not a posture audit tool."}],"unknown":"command not found - this box has: scout, aws, trivy, nmap","solution":"scout aws"},"ex":"<b>Why:<\/b> ScoutSuite is the multi-cloud auditor; its CLI pattern is <code>scout &lt;provider&gt;<\/code>, so <code>scout aws<\/code> is the whole job. It reads configuration across services and writes an HTML posture report with counts per severity. <b>Focus on:<\/b> posture tools audit configuration - they do not attack workloads like Pacu or scan ports like nmap.","k":["ScoutSuite","CSPM"],"hint":"One short command: tool name plus the provider word. For OS-level compliance you would use OpenSCAP instead - posture tools cover cloud config."},{"id":"m10","type":"multi","th":"misconfig","ti":"Select the CloudTrail events that need investigation","pts":3,"sc":"The account normally runs automation from known CI addresses and one CRM sync job. Select every event an analyst must investigate.","q":"The account normally runs automation from known CI addresses and one CRM sync job. Select every event an analyst must investigate.","d":{"opts":[{"h":"Root console login without MFA from an outside IP","ok":true},{"h":"Root creating an access key for svc-backup","ok":true},{"h":"GetObject by crm-sync-role from the internal NAT with its usual user agent"},{"h":"RunInstances by deploy-ci in ap-south-1, a region Meridian never uses","ok":true},{"h":"DescribeInstances by terraform from the CI subnet"},{"h":"StopLogging on the audit trail by root","ok":true},{"h":"PutBucketPolicy on the audit log bucket by a named security engineer"},{"h":"AssumeRole with MFA used"}]},"ex":"<b>Why:<\/b> Investigate: root without MFA from outside; root minting a new key (persistence); instances in an unused region (hidden infrastructure); and StopLogging, which kills your audit trail - a classic cover-your-tracks move. The CRM GetObject matches its normal job and source. Terraform DescribeInstances is routine CI. A named engineer adjusting the log bucket policy is visible and attributable; AssumeRole with MFA is expected. <b>Focus on:<\/b> judge events against baseline behavior, not against scariness.","k":["CloudTrail","Missing MFA / root account risk","Disabled audit logging"],"hint":"Three events are normal automation. Root actions and region anomalies are not.","art":[{"kind":"log","title":"CloudTrail extract - Meridian production account (defanged)","lines":["2026-10-11T21:04:11Z  ConsoleLogin  userIdentity=root  sourceIPAddress=203[.]0[.]113[.]9  MFAUsed=false","2026-10-11T21:07:58Z  CreateAccessKey  userIdentity=root  userName=svc-backup","2026-10-11T21:31:02Z  GetObject  principal=crm-sync-role  sourceIP=10[.]0[.]22[.]5  userAgent=crm-sync/2.1  object=exports/daily-2026-10-11.csv","2026-10-11T22:02:44Z  RunInstances  userIdentity=deploy-ci  region=ap-south-1  instanceType=t3.micro","2026-10-11T22:40:15Z  DescribeInstances  userIdentity=terraform  sourceIP=10[.]0[.]9[.]30  userAgent=HashiCorp-TF/1.5","2026-10-11T23:12:36Z  StopLogging  userIdentity=root  trailName=meridian-audit","2026-10-12T00:02:19Z  PutBucketPolicy  userIdentity=secops-jdoe  bucket=meridian-audit-logs","2026-10-12T01:44:50Z  AssumeRole  principal=dev-role  target=prod-readonly  MFAUsed=true"]}]},{"id":"m11","type":"dnd","th":"output","ti":"Assemble the CVSS vector parts","pts":3,"sc":"Drag each description onto the CVSS v3.1 metric it defines for this finding.","q":"Drag each description onto the CVSS v3.1 metric it defines for this finding.","d":{"items":[{"k":"avn","h":"The flaw is reached over the network"},{"k":"acl","h":"No specialized conditions - low attack complexity"},{"k":"prn","h":"No privileges are required"},{"k":"uir","h":"No user interaction is needed"},{"k":"su","h":"Impact stays on the vulnerable component - scope unchanged"},{"k":"cha","h":"Confidentiality impact is high"}],"slots":[{"h":"AV:","t":"Attack Vector","accept":["avn"]},{"h":"AC:","t":"Attack Complexity","accept":["acl"]},{"h":"PR:","t":"Privileges Required","accept":["prn"]},{"h":"UI:","t":"User Interaction","accept":["uir"]},{"h":"S:","t":"Scope","accept":["su"]},{"h":"C:","t":"Confidentiality","accept":["cha"]}]},"ex":"<b>Why:<\/b> AV:N remote network, AC:L low complexity, PR:N no privileges, UI:N no interaction, S:U unchanged scope, C:H high confidentiality impact. Together with I:H and A:H that vector reads AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H - the well-known 9.8 shape. <b>Focus on:<\/b> learn what each metric letter stands for; report readers expect you to parse vectors on sight.","k":["CVSS vector string","CVSS v3.1 base score"],"hint":"Each slot takes exactly one metric value. Read the description, not the letter.","art":[{"kind":"code","title":"Finding: unauthenticated RCE in the public file-upload service (pre-deployment scan)","lines":["Impact: complete system compromise, no user interaction needed.","The flaw is reachable over the network by anyone without an account.","Exploitation is straightforward - a public exploit exists."]}]},{"id":"m12","type":"qcm","th":"output","ti":"Classify the suspicious finding","pts":2,"sc":"Configuration management confirms CentOS was fully removed from the payments AMI two weeks ago, and logging into the host shows no CentOS packages. The scanner still reports the EOL plugin every run.","q":"What is this finding, and what is the correct next step?","d":{"opts":[{"h":"A true positive - file a change request to replace the OS"},{"h":"A false positive - verify on the host, then have the plugin tuned","ok":true},{"h":"A false negative - the scanner missed worse problems"},{"h":"A critical vulnerability - isolate the host immediately"}]},"ex":"<b>Why:<\/b> The host no longer contains the flagged software, yet the plugin keeps firing: that is a false positive. The fix is verification (you did log in) then scanner tuning, not OS replacement. Isolation would waste incident capacity. A false negative would be a missed real flaw - not this case. <b>Focus on:<\/b> false positive handling always ends in verification plus tuning, never in patching something that is not there.","k":["False positive","Nessus / Tenable","Scan scope & completeness"],"hint":"Compare the finding against the real state of the host before acting on it.","art":[{"kind":"log","title":"Nessus scan report extract - hardened payments AMI","lines":["2026-10-12T02:11:04Z  PLUGIN 154202 (High): Unsupported OS - CentOS 7 EOL detected on pay-prod-07","2026-10-12T02:11:05Z  PLUGIN 10394 (Low): SSH version banner collected: OpenSSH_8.8","2026-10-12T02:11:09Z  INFO    Scan completeness: 4 of 41 hosts responded - 37 hosts firewalled","2026-10-12T02:11:11Z  NOTE    pay-prod-07 image rebuilt 2026-10-02 from golden-base-v12"]}]},{"id":"m13","type":"branch","th":"misconfig","ti":"Branching scenario: the public receipts bucket","pts":4,"sc":"Alert at 09:12: CSPM flagged bucket <code>meridian-receipts-prod<\/code> (customer receipts, about 300 GB) as publicly readable. You are the responding analyst. Make each call; a wrong move ends the branch.","q":"Work the five steps of the response in order.","d":{"stages":[{"ctx":"The alert arrived. The ticket queue is quiet and your manager says 'handle it'.","q":"What is your very first move?","opts":[{"h":"Open the bucket in the console and verify the finding is real","ok":true,"why":"Validate before acting - the alert could be stale or scoped wrong."},{"h":"Delete the bucket to stop the exposure","ok":false,"why":"Deleting data destroys evidence and the business - never the first move."},{"h":"Email the whole company asking who owns the bucket","ok":false,"why":"Slow and noisy; verification is an analyst task."}]},{"ctx":"Confirmed: bucket policy allows public reads, and it holds customer receipts.","q":"Contain it - what now?","opts":[{"h":"Enable Block Public Access and replace the policy with a scoped one","ok":true,"why":"Stops the exposure in seconds without touching the data."},{"h":"Leave it and add a ticket for next sprint","ok":false,"why":"A known public data store stays exposed while it waits."},{"h":"Make the bucket name unguessable","ok":false,"why":"Security by obscurity - the objects are already listed publicly."}]},{"ctx":"Bucket is private again. Leadership asks: did anyone take data?","q":"Assess the impact - how?","opts":[{"h":"Review S3 server access logs and CloudTrail data events for anonymous GetObject calls","ok":true,"why":"Logs show who listed or downloaded objects and when."},{"h":"Check the bucket's free space","ok":false,"why":"Tells you nothing about access."},{"h":"Assume nobody found it because it was never linked","ok":false,"why":"Assumptions are not evidence; public buckets are crawled constantly."}]},{"ctx":"Logs show three GetObject calls from 198[.]51[.]100[.]24, an IP in no Meridian range.","q":"What is the right response to that evidence?","opts":[{"h":"Start IR: preserve logs, rotate any credentials stored in the bucket, notify per policy","ok":true,"why":"Confirmed outside access to customer data is a breach path - IR handles notification and evidence."},{"h":"Delete the old log files so the attacker cannot see them","ok":false,"why":"Destroying logs destroys your evidence."},{"h":"Only add a firewall rule and move on","ok":false,"why":"Data already left; exposure rules do not undo it."}]},{"ctx":"IR closed the case. The bucket is private and monitored.","q":"Close the loop - final step?","opts":[{"h":"Rescan with CSPM, verify the finding cleared, and write the incident note with lessons","ok":true,"why":"Validation plus documentation closes the loop properly."},{"h":"Close the ticket quietly to keep metrics clean","ok":false,"why":"Closing without validation or record invites the same incident."},{"h":"Wait a month to see if it happens again","ok":false,"why":"No feedback loop, no learning."}]}]},"ex":"<b>Why:<\/b> The flow is verify, contain, assess with logs, escalate on evidence, then validate and document. Each step builds on the last one; skipping containment or destroying evidence is how small incidents become big ones. <b>Focus on:<\/b> containment always precedes investigation; rescans prove closure.","k":["public object storage exposure","Rescan validation","CloudTrail","CSPM"],"hint":"One sentence per step: verify, contain, assess, escalate, validate."},{"id":"m14","type":"dual","th":"misconfig","ti":"Dual perspective: the metadata service","pts":3,"sc":"Your app has a URL-fetch feature. Someone pointed it at the instance metadata address and the role credentials walked out the door.","q":"BLUE TEAM view: select every true statement about what the artifacts show. RED TEAM view: select every move that makes this attack work.","d":{"parts":[{"label":"BLUE TEAM - what do you detect?","opts":[{"h":"The WAF allowed a request that made the app fetch the metadata service","ok":true},{"h":"GuardDuty saw the role's credentials used from an IP outside AWS","ok":true},{"h":"The instance still allows IMDSv1, which needs no session token","ok":true},{"h":"The database was encrypted with a weak cipher"},{"h":"The attack required stolen SSH keys"}]},{"label":"RED TEAM - what makes the attack work?","opts":[{"h":"Server-side request forgery in the fetch feature","ok":true,"sub":"SSRF: the app fetches attacker-chosen URLs"},{"h":"IMDSv1 answering without a token","ok":true},{"h":"A role attached to the instance with wide permissions","ok":true},{"h":"The WAF rule set having no SSRF filter for link-local addresses","ok":true},{"h":"Brute-forcing the ALB TLS certificate"}]}]},"ex":"<b>Why:<\/b> Blue side: the three signals chain together - SSRF request allowed (CWE-918), credentials exfiltrated, IMDSv1 enabled. Red side: the attack needs SSRF, tokenless IMDSv1, an over-privileged role and a blind WAF; remove any one and the chain breaks. There is no evidence of weak database ciphers or SSH key theft. <b>Focus on:<\/b> IMDSv2 (tokens, hop limit) plus least-privilege roles kills this attack class.","k":["IMDSv1 / metadata SSRF","Overly permissive IAM","CWE"],"hint":"Every 'true' statement maps to a line in the artifacts.","art":[{"kind":"log","title":"GuardDuty finding + WAF log - app tier behind a public ALB","lines":["2026-10-12T10:22:31Z  WAF  ALLOW  POST /fetch?url=hxxp://169[.]254[.]169[.]254/latest/meta-data/iam/security-credentials/  src=198[.]51[.]100[.]7  rule=none","2026-10-12T10:22:32Z  APP  200  /fetch  upstream=app-prod-11 (10[.]0[.]31[.]18)  bytes_out=1430","2026-10-12T10:22:40Z  GuardDuty  CredentialAccess:InstanceCredentialExfiltration  role=app-prod-role  evidence=API calls from new external IP 209[.]58[.]14[.]2","2026-10-12T10:23:02Z  CONFIG  instance app-prod-11 metadataOptions: HttpTokens=optional (IMDSv1 allowed)"]}]},{"id":"m15","type":"fib","th":"cspm","ti":"Complete the posture program policy","pts":3,"sc":"Meridian Retail is writing its first cloud posture standard. Draft below; fill the gaps from the word bank.","q":"Fill every blank with a word from the bank. Three bank words do not fit anywhere. Click a blank, then a chip.","d":{"mode":"chips","text":"The platform team will run a {{0}} tool such as CloudSploit, Wiz or Orca to continuously compare configurations against the {{1}} benchmark. Any {{2}} from the approved baseline opens a ticket automatically. Preventive rules act as {{3}} so risky resources are rejected at deploy time, and the same rules map findings to {{4}} controls for the yearly audit.","bank":["CSPM","drift","CIS","guardrails","HIPAA","ScoutSuite","false positive","rescan"],"blanks":[{"a":["CSPM"]},{"a":["CIS"]},{"a":["drift"]},{"a":["guardrails"]},{"a":["HIPAA"]}]},"ex":"<b>Why:<\/b> A CSPM (cloud security posture management) tool watches configuration continuously, the CIS benchmark is the baseline most programs start from, unwanted change is drift, guardrails are preventive policy checks, and mapping findings to frameworks like HIPAA makes audits cheap. <b>Focus on:<\/b> CSPM is about configuration state, not runtime processes.","k":["CSPM","Continuous monitoring & drift","Guardrails","CIS Benchmarks / CIS-CAT","CloudSploit","Wiz","Orca Security","Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)"],"hint":"One word per blank; three bank words are decoys, and one of those is a tool name."},{"id":"m16","type":"rank","th":"report","ti":"Rank the morning findings by urgency","pts":3,"sc":"Six findings landed at Meridian Retail this morning. The risk policy ranks by: active exploitation, then exposure to internet, then data sensitivity, then asset criticality. Everything else waits its turn.","q":"Rank the findings from most urgent (1) to least urgent (6).","d":{"items":[{"k":"a","h":"Ransomware crew is actively exploiting the KEV-listed RCE on the internet-facing storefront"},{"k":"b","h":"Public RDS snapshot containing customer PII"},{"k":"c","h":"Bastion security group open on port 3389 from anywhere, no evidence of use"},{"k":"d","h":"Unencrypted internal S3 bucket holding anonymized test data"},{"k":"e","h":"TLS 1.0 still accepted on an internal reporting tool"},{"k":"f","h":"Missing cost tags on 40 development VMs"}],"correct":["a","b","c","d","e","f"]},"ex":"<b>Why:<\/b> Active exploitation on a critical internet asset outranks everything. Then exposed sensitive data (public PII snapshot). Then plain internet exposure without misuse (open 3389). Then weak encryption on internal test data, then an outdated protocol, then hygiene items like tags. CVSS alone would misorder this list - context reorders it. <b>Focus on:<\/b> KEV-listed plus in-the-wild exploitation always jumps the queue.","k":["Risk-based prioritization (KEV / EPSS)","Asset criticality","public snapshots / AMIs","Exposed management ports"],"hint":"Two questions per item: is anyone using it now, and how big is the blast radius?"},{"id":"m17","type":"match","th":"misconfig","ti":"Match each misconfiguration to its primary risk","pts":3,"sc":"The Meridian cloud baseline review found six classic misconfigurations. New analysts must connect each one to the risk it creates before they can remediate sensibly.","q":"Match every misconfiguration to the primary risk it creates.","d":{"items":[{"k":"pub","h":"Customer data leaves the company without any credential"},{"k":"sg","h":"Internet-wide brute force and exploit attempts reach the host"},{"k":"mfa","h":"One stolen password is enough to own the whole account"},{"k":"log","h":"Investigators cannot answer who did what after an incident"},{"k":"enc","h":"Data is readable if the physical media or snapshot leaks"},{"k":"def","h":"Anyone typing the manual's password becomes admin"}],"slots":[{"h":"Public S3 bucket","t":"Public S3 bucket","accept":["pub"]},{"h":"Security group allowing 22 from 0[.]0[.]0[.]0/0","t":"Open security group","accept":["sg"]},{"h":"Root account without MFA","t":"Root without MFA","accept":["mfa"]},{"h":"CloudTrail disabled","t":"CloudTrail disabled","accept":["log"]},{"h":"Unencrypted RDS volume","t":"Unencrypted RDS volume","accept":["enc"]},{"h":"Default admin credentials on a management console","t":"Default credentials","accept":["def"]}]},"ex":"<b>Why:<\/b> Each misconfig maps to one dominant risk: public storage leaks data; open management ports invite brute force; missing MFA turns phishing into takeover; disabled logging blinds response; unencrypted volumes leak on media loss; default credentials hand over admin access. Knowing the risk picks the fix order. <b>Focus on:<\/b> risk first, tool second.","k":["public object storage exposure","Open security groups","Missing MFA / root account risk","Disabled audit logging","Unencrypted storage at rest","Default credentials"],"hint":"Think: what becomes possible the second this misconfig exists?"},{"id":"m18","type":"qcm","th":"tools","ti":"Pick the right assessment approach","pts":2,"sc":"Meridian Retail needs a configuration audit across AWS, Azure and GCP accounts. Security wants no agents installed, no cloud credentials with write rights, and one combined report of misconfigurations per framework.","q":"Which tool and mode fits best?","d":{"opts":[{"h":"ScoutSuite run agentless with read-only credentials","ok":true,"sub":"multi-cloud posture audit, no agents"},{"h":"Amazon Inspector with SSM agents on every EC2"},{"h":"Pacu with a compromised developer account"},{"h":"Kube-hunter against the office Wi-Fi network"}]},"ex":"<b>Why:<\/b> ScoutSuite is agentless and multi-cloud: read-only credentials are enough, and it emits one report across providers. Inspector is AWS-only and agent-based. Pacu is an offensive exploitation framework - wrong job and wrong risk. Kube-hunter targets Kubernetes clusters, not three cloud estates. <b>Focus on:<\/b> match scope (multi-cloud), mode (agentless) and safety (read-only) to the requirement.","k":["ScoutSuite","Agent-based vs agentless scanning","Amazon Inspector","Pacu","Kube-hunter"],"hint":"Three requirements in the scenario: multi-cloud, no agents, read-only."},{"id":"m19","type":"multi","th":"report","ti":"Which SLAs are already breached?","pts":3,"sc":"The quarterly scan closed seven days ago. The SLA table and the scanner coverage note are shown above; the findings below come from that scan and the previous one.","q":"Today is day 7 after the scan. Select every finding whose fix window has already expired and must be closed or escalated today.","d":{"opts":[{"h":"Critical RCE on the storefront, found on day 1","ok":true},{"h":"High S3 exposure, found on day 2"},{"h":"High open security group, found 20 days ago (carried over from the previous scan)","ok":true},{"h":"Medium PCI DSS evidence gap, found 45 days ago","ok":true,"sub":"30-day window"},{"h":"Medium permissive CORS on the customer API, found on day 6"},{"h":"Low TLS 1.0 on an internal tool, found 10 days ago"}]},"ex":"<b>Why:<\/b> Critical found on day 1 blew its 48-hour window days ago. High found on day 2 still has five days. The high open security group is 20 days old - long past its 7-day window. Medium at 45 days passed 30. CORS at day 6 has 24 days left, and low at day 10 has 80. Also note the scope gap: 46 unreachable assets mean findings may be missing - completeness is part of honest reporting. <b>Focus on:<\/b> SLA math is found-date plus window, not report date.","k":["SLA & ticket tracking","Scan scope & completeness","Permissive CORS","Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)"],"hint":"Work out the deadline for each row before you look at today.","art":[{"kind":"table","title":"Remediation SLA - Meridian risk policy (scan ran 7 days ago)","head":["Severity","Fix window"],"rows":[["Critical","48 hours"],["High","7 days"],["Medium","30 days"],["Low","90 days"]]},{"kind":"log","title":"Coverage note from the scanner (scan scope)","lines":["2026-10-06T06:00:00Z  Scan window started: 260 assets in scope","2026-10-06T09:41:12Z  214 assets scanned - 46 unreachable (no route / agent off)","2026-10-06T09:41:13Z  Completeness 82% - see scan scope gap report"]}]},{"id":"m20","type":"dnd","th":"shared","ti":"Sort the duties: provider or customer?","pts":3,"sc":"A workshop slide at Meridian Retail lists six duties. The trainer wants them sorted under the shared responsibility model before the quiz.","q":"Drag each duty to the side that owns it.","d":{"items":[{"k":"cam","h":"Cameras and guards at the datacenter"},{"k":"hyp","h":"Patching the hypervisor that runs customer VMs"},{"k":"pol","h":"S3 bucket policy allowing only the app role"},{"k":"iam","h":"Creating IAM users, roles and access keys"},{"k":"os","h":"Patching the guest OS inside an EC2 instance"},{"k":"keys","h":"Encrypting data and managing the keys"}],"slots":[{"h":"<b>Security OF the cloud<\/b> - the provider","t":"Provider (of the cloud)","accept":["cam","hyp"],"why":"physical plant and the platform itself"},{"h":"<b>Security IN the cloud<\/b> - the customer","t":"Customer (in the cloud)","accept":["pol","iam","os","keys"],"why":"what the customer builds and configures"}]},"ex":"<b>Why:<\/b> Of-the-cloud duties are the physical plant, hardware and hypervisor - the provider never delegates those. In-the-cloud duties are everything the customer configures: bucket policies, IAM, guest OS on IaaS, data encryption. One memory hook: if the customer can see and change it from their console, it is theirs. <b>Focus on:<\/b> the split shifts toward the provider as services move from IaaS to SaaS.","k":["Security OF the cloud vs IN the cloud","Customer responsibilities","Provider responsibilities"],"hint":"Console-visible configuration is customer work. Concrete and hypervisor are provider work."},{"id":"m21","type":"triage","th":"misconfig","ti":"Defender for Cloud queue - Azure edition","pts":4,"sc":"Afternoon shift at Meridian: the Azure queue in Microsoft Defender for Cloud has four findings. The lead asks you to pick the correct first response for each before the 15:00 change-freeze.","q":"Choose one action per finding.","d":{"alerts":[{"name":"Storage account 'meridian-fin' allows public access","meta":"Defender for Cloud | public containers | finance exports","opts":[{"h":"Turn off public access now, then classify what was exposed","ok":true},{"h":"Migrate the data first, access can stay public","ok":false},{"h":"Add it to next year's audit plan","ok":false}],"why":"Cut the exposure first; classification and history come after. Moving data leaves the hole open during the move."},{"name":"NSG allows SSH 22 from the internet on prod-db-vm","meta":"Defender for Cloud | NSG rule 0[.]0[.]0[.]0/0 | management port","opts":[{"h":"Restrict the NSG rule to the jump-box range and confirm access still works","ok":true},{"h":"Delete the database to remove the risk","ok":false},{"h":"Nothing - SSH keys are strong","ok":false}],"why":"A management port open to the world is an exposure even with strong keys. Restrict the source range; strong keys reduce but do not remove the risk."},{"name":"Azure Policy audit shows MFA disabled for a finance admin","meta":"Defender for Cloud | identity finding | conditional access gap","opts":[{"h":"Re-enable MFA via Conditional Access and review recent sign-ins","ok":true},{"h":"Wait for the user to notice","ok":false},{"h":"Lower the finding severity because the user is senior","ok":false}],"why":"Privileged identity without MFA is a top takeover path. Fix the control, then check what happened while it was off."},{"name":"VM has no backup configured","meta":"Defender for Cloud | resilience recommendation","opts":[{"h":"Schedule backup enablement in the normal change flow","ok":true},{"h":"Escalate to IR as a breach","ok":false},{"h":"Delete the VM - unbacked VMs are dangerous","ok":false}],"why":"Missing backup is a resilience gap, not an active threat. Normal change process, not emergency response."}]},"ex":"<b>Why:<\/b> Match response to risk class: data exposure and identity gaps are urgent; network exposure is high but planned; resilience gaps follow normal change. The tool names change (Defender for Cloud, NSG, Azure Policy) but the reasoning is the same as AWS. <b>Focus on:<\/b> recognize the same misconfig classes across clouds.","k":["Microsoft Defender for Cloud","public object storage exposure","Open security groups","Missing MFA / root account risk","Azure Policy"],"hint":"Two are urgent (data, identity), one is high-planned (network), one is routine (backup)."},{"id":"m22","type":"fib","th":"report","ti":"Complete the exception policy","pts":3,"sc":"Meridian's vulnerability management standard has a section on exceptions. Fill it in - type the words (they appear in the chapter).","q":"Type one word per blank, then Check. Spelling counts, capitalization does not.","d":{"mode":"type","text":"A risk {{0}} is a formal, signed decision to live with a finding for a limited time. It must name a risk {{1}} who owns the decision. A {{2}} control reduces the risk while the flaw stays - for example a WAF rule in front of an unpatchable server. Every exception carries an {{3}} date, after which the finding returns to the normal queue automatically.","blanks":[{"a":["acceptance","accept"]},{"a":["owner"]},{"a":["compensating"]},{"a":["expiry","expiration","expire"]}]},"ex":"<b>Why:<\/b> Exception paperwork has four moving parts: acceptance (the decision), owner (who signs), compensating control (risk reduced without fixing the cause) and expiry (exceptions die on schedule, or they become permanent by accident). <b>Focus on:<\/b> an exception without an expiry date is just a hidden permanent risk.","k":["Risk acceptance","Exception & compensating control","Ownership assignment"],"hint":"Four blanks, four nouns: decision, person, control, date."},{"id":"m23","type":"spot","th":"containers","ti":"Spot the misconfigurations in the Terraform SG","pts":3,"sc":"The template below passed the pipeline. The app is a Linux service behind a public load balancer. Review it line by line.","q":"Click every line that belongs to a rule that is a genuine misconfiguration (not just unusual), then Check.","d":{"title":"terraform/networking.tf - Checkov (or tfsec) flags this template","lines":[{"t":"resource \"aws_security_group\" \"app\" {","bad":false,"why":"resource header"},{"t":"  name        = \"app-sg\"","bad":false,"why":"naming only"},{"t":"  description = \"Office only access\"","bad":false,"why":"a description does not enforce anything; it is stale, not dangerous"},{"t":"  ingress {","bad":false,"why":"syntax"},{"t":"    from_port   = 22","bad":true,"why":"opens the SSH management port beyond the office"},{"t":"    to_port     = 22","bad":true,"why":"completes the SSH range offered to the world"},{"t":"    protocol    = \"tcp\"","bad":false,"why":"transport is neutral - the exposure is port plus source"},{"t":"    cidr_blocks = [\"0[.]0[.]0[.]0/0\"]","bad":true,"why":"internet-wide source for SSH - the core of the misconfig"},{"t":"  }","bad":false,"why":"syntax"},{"t":"  ingress {","bad":false,"why":"syntax"},{"t":"    from_port   = 3389","bad":true,"why":"RDP on a Linux service makes no sense and is open to the world"},{"t":"    to_port     = 3389","bad":true,"why":"completes the RDP range offered to the world"},{"t":"    protocol    = \"tcp\"","bad":false,"why":"transport is neutral here too"},{"t":"    cidr_blocks = [\"0[.]0[.]0[.]0/0\"]","bad":true,"why":"internet-wide source for RDP"},{"t":"  }","bad":false,"why":"syntax"},{"t":"  ingress {","bad":false,"why":"syntax"},{"t":"    from_port   = 443","bad":false,"why":"public HTTPS on a public app is intended"},{"t":"    to_port     = 443","bad":false,"why":"same intended rule"},{"t":"    protocol    = \"tcp\"","bad":false,"why":"transport for the intended rule"},{"t":"    cidr_blocks = [\"0[.]0[.]0[.]0/0\"]","bad":false,"why":"expected for a public load-balanced service"},{"t":"  }","bad":false,"why":"syntax"},{"t":"}","bad":false,"why":"closing brace"}]},"ex":"<b>Why:<\/b> The two management-port rules are the misconfiguration: SSH (22) and RDP (3389) offered to 0[.]0[.]0[.]0/0 - six lines in total. RDP on a Linux service doubly makes no sense. Public 443 on a public app is intended, and the stale description is sloppy, not a vulnerability. <b>Focus on:<\/b> judge each rule by port plus source, and remember IaC scanning (Checkov, tfsec) catches these before deploy.","k":["Open security groups","Exposed management ports","Checkov","tfsec","IaC scanning (Terraform / CloudFormation)"],"hint":"Six lines carry the risk: the port pair and the source of each management-port rule. Public 443 is fine."},{"id":"m24","type":"qcm","th":"report","ti":"What proves the finding is fixed?","pts":2,"sc":"Ticket MER-2903 (open S3 bucket) is marked 'Resolved' by the platform team. No evidence is attached. The risk register shows the finding still open from the last CSPM scan two weeks ago.","q":"As the vulnerability manager, what do you accept as proof of closure?","d":{"opts":[{"h":"A rescan shows the finding cleared, with evidence on the ticket","ok":true,"sub":"evidence beats promises"},{"h":"The developer's comment 'fixed, trust me' on the ticket"},{"h":"The ticket status field says Resolved since this morning"},{"h":"The team lead's verbal confirmation in the stand-up"}]},"ex":"<b>Why:<\/b> Closure is a data event, not a status event: a rescan or continuous monitoring must show the finding gone, and that evidence belongs on the ticket. Words and workflow states do not re-run the check. <b>Focus on:<\/b> rescan validation closes findings; everything else is intent.","k":["Rescan validation","Continuous monitoring & drift","SLA & ticket tracking"],"hint":"Which option re-runs the actual check on the real resource?"},{"id":"m25","type":"multi","th":"report","ti":"What belongs in the findings report?","pts":3,"sc":"The quarterly cloud vulnerability report goes to the CISO and platform leads at Meridian Retail. You are reviewing a draft.","q":"Select every element that belongs in the report.","d":{"opts":[{"h":"An executive summary with business impact in plain language","ok":true},{"h":"Affected assets with owners and asset criticality","ok":true},{"h":"Remediation steps with effort estimates per finding","ok":true},{"h":"Trend charts of finding counts over the last four scans","ok":true},{"h":"Raw debug output of the scanner engine"},{"h":"The analyst's personal opinions about the platform team"}]},"ex":"<b>Why:<\/b> A findings report carries the executive summary, scoped asset lists with owners and criticality, concrete remediation with effort, and trends over time - those four let leaders decide. Raw debug output belongs in an appendix of the scan tool, and personal opinions poison governance documents. <b>Focus on:<\/b> every section should help someone make a decision.","k":["Findings report structure","Ownership assignment","Trend analysis","Asset criticality","Remediation vs mitigation"],"hint":"Ask of each item: does it help the CISO decide something?"},{"id":"m26","type":"terminal","th":"containers","ti":"Scan the image before it ships","pts":2,"sc":"The pipeline stopped: image <code>nginx:1.24-alpine<\/code> needs a vulnerability scan with the CLI scanner installed on this box (it is Trivy) before it can enter the internal registry.","q":"Type the Trivy command that scans that image, press Enter, then Check.","d":{"prompt":"analyst@buildnode","title":"MER-BUILDNODE - image scanning","cmds":[{"re":"^trivy(\\s+image)?\\s+nginx:1\\.24-alpine\\s*$","ok":true,"out":"nginx:1.24-alpine (alpine 3.18.4)\nTotal: 3 (UNKNOWN: 0, LOW: 1, MEDIUM: 1, HIGH: 1, CRITICAL: 0)\n+----------+------------------+----------+-----------+---------------+\n| LIBRARY  | VULNERABILITY    | SEVERITY | INSTALLED | FIXED VERSION |\n+----------+------------------+----------+-----------+---------------+\n| openssl  | CVE-2023-5363    | HIGH     | 3.0.9-r0  | 3.0.12-r0     |\n| zlib     | CVE-2022-37434   | MEDIUM   | 1.2.13-r1 | 1.2.13-r2     |\n| busybox  | CVE-2022-28391   | LOW      | 1.35.0-r0 | 1.36.1-r0     |\n+----------+------------------+----------+-----------+---------------+\nSBOM: 14 packages inventoried (alternatives: Clair, Grype)"},{"re":"^trivy\\s","ok":false,"out":"usage: trivy image <image> | trivy fs <dir> | trivy config <dir>"},{"re":"^clair","ok":false,"out":"Clair is a registry-side analyzer service - on this box the CLI scanner is Trivy."},{"re":"^docker\\s+scan","ok":false,"out":"docker scan is not installed on this build node."}],"unknown":"command not found - installed here: trivy, docker, clairctl","solution":"trivy image nginx:1.24-alpine"},"ex":"<b>Why:<\/b> Trivy's image scan is <code>trivy image &lt;image&gt;<\/code>. It inventories the packages (an SBOM), matches them against CVE feeds and prints a severity table with fixed versions. Scanning at the registry gate stops vulnerable images before deploy. <b>Focus on:<\/b> image scanning is CVE scanning for packages inside the image; posture scanning is different.","k":["Trivy","Clair","SBOM & dependency scanning","Image / registry scanning","CVE"],"hint":"Scanner name, subcommand for images, then the image reference."},{"id":"m27","type":"dnd","th":"shared","ti":"Sort the services by service model","pts":3,"sc":"Onboarding quiz: the Meridian estate uses six services. Sort each into IaaS, PaaS or SaaS so the shared responsibility split is clear.","q":"Drag each service to its service model.","d":{"items":[{"k":"ec2","h":"EC2 virtual machine (you manage the OS)"},{"k":"ebs","h":"EBS raw block volume attached to EC2"},{"k":"rds","h":"RDS managed MySQL database"},{"k":"lambda","h":"AWS Lambda function"},{"k":"exch","h":"Exchange Online mailboxes"},{"k":"drive","h":"Google Workspace Drive files"}],"slots":[{"h":"<b>IaaS<\/b> - customer manages OS and up","t":"IaaS","accept":["ec2","ebs"],"why":"raw compute and storage"},{"h":"<b>PaaS<\/b> - customer manages data and config","t":"PaaS","accept":["rds","lambda"],"why":"managed runtime or database"},{"h":"<b>SaaS<\/b> - customer manages data and access","t":"SaaS","accept":["exch","drive"],"why":"finished application"}]},"ex":"<b>Why:<\/b> IaaS is raw compute and storage - OS stays yours (EC2, EBS). PaaS is a managed runtime or database - you bring code and data, not patching (RDS, Lambda). SaaS is a finished application - you bring data and users (Exchange Online, Drive). The higher the layer, the fewer duties stay with you. <b>Focus on:<\/b> service model decides who patches, so it decides who the scanner finding belongs to.","k":["IaaS / PaaS / SaaS split","Shared responsibility model","Security OF the cloud vs IN the cloud"],"hint":"Who patches the operating system or runtime? That answers the slot."},{"id":"m28","type":"branch","th":"report","ti":"Branching scenario: the 'default credentials' that weren't","pts":3,"sc":"A scanner flags 'default credentials in use' on a vendor appliance in the DMZ at Meridian Retail. The appliance team says they changed the passwords two years ago. Work the validation path.","q":"Make the right call at each step.","d":{"stages":[{"ctx":"The finding claims default credentials are live on the DMZ appliance.","q":"First move?","opts":[{"h":"Verify on the device: check the credential policy and log in with the defaults","ok":true,"why":"Verification before anything else - findings can be stale or wrong."},{"h":"Open a critical ticket to replace the appliance","ok":false,"why":"You would spend budget on an unverified finding."},{"h":"Close the ticket because the team is trustworthy","ok":false,"why":"Trust is not verification."}]},{"ctx":"You confirm from the device log that defaults were changed in 2024 and the default login fails.","q":"What makes the evidence solid?","opts":[{"h":"A credentialed re-test of the exact plugin against the device, archived with the ticket","ok":true,"why":"A controlled re-test is reproducible evidence."},{"h":"A screenshot from the vendor website","ok":false,"why":"Marketing pages are not device evidence."},{"h":"The team lead's memory","ok":false,"why":"Memory is not testable evidence."}]},{"ctx":"Evidence is archived; the plugin fires because the scanner only checks the banner version, which the vendor did not update.","q":"How do you stop the noise?","opts":[{"h":"Ask the scanner team to tune the rule with your evidence, and document the case","ok":true,"why":"Fix the detection, keep the record - the next analyst needs it."},{"h":"Exclude the whole appliance from all future scans","ok":false,"why":"Blind spots hide real findings."},{"h":"Reboot the appliance daily","ok":false,"why":"Theater, not validation."}]},{"ctx":"The tuned rule still needs a review cycle of one month.","q":"What bridges the gap?","opts":[{"h":"A documented exception with an owner, an expiry date and a compensating check","ok":true,"why":"Formal exception handling keeps the risk visible and temporary."},{"h":"Permanent suppression of the plugin","ok":false,"why":"Suppression without expiry is a hidden permanent risk."},{"h":"Nothing - let it fire","ok":false,"why":"Alert fatigue erodes the whole program."}]}]},"ex":"<b>Why:<\/b> False positives are handled with verify, evidence, tune, and a documented exception with owner and expiry - never with blind suppression or ignored tickets. <b>Focus on:<\/b> tuning plus documentation beats both panic and silence.","k":["False positive","Exception & compensating control","Credentialed vs non-credentialed scans","Default credentials"],"hint":"Verify, prove, tune, then bridge with a dated exception."},{"id":"m29","type":"fib","th":"report","ti":"Draft the remediation note","pts":3,"sc":"Fill the remediation note that goes on ticket MER-2955 (vulnerable logging library on the storefront).","q":"Complete the note with one word per blank. Three bank words do not fit.","d":{"mode":"chips","text":"This note proposes {{0}} of the flaw by upgrading the library to the vendor-fixed version. Until the patch ships, the WAF rule gives short-term {{1}}. The work carries a 7-day {{2}} for this High finding. After deploy, a {{3}} must confirm the finding cleared, and the closure feeds the {{4}} chart for the quarterly review.","bank":["remediation","mitigation","SLA","rescan","trend","drift","guardrails","CSPM"],"blanks":[{"a":["remediation"]},{"a":["mitigation"]},{"a":["SLA"]},{"a":["rescan"]},{"a":["trend"]}]},"ex":"<b>Why:<\/b> Remediation removes the cause (upgrade); mitigation reduces risk without removing it (WAF rule); the SLA sets the deadline; the rescan proves success; and closure feeds the trend so leadership sees direction, not single numbers. <b>Focus on:<\/b> remediation and mitigation are different promises - reports must not mix them up.","k":["Remediation vs mitigation","SLA & ticket tracking","Rescan validation","Trend analysis"],"hint":"Upgrade removes; WAF shields. Two different words for two different things."},{"id":"m30","type":"match","th":"cspm","ti":"Match the tool category to its example finding","pts":3,"sc":"Meridian's tooling covers four categories. The GRC team lists example findings from Prisma Cloud, AWS, Azure and even GCP Security Command Center outputs - but mixed up the categories.","q":"Match each example finding to the tool category that surfaces it.","d":{"items":[{"k":"cspm","h":"A public bucket that drifted away from the approved baseline"},{"k":"cwpp","h":"A cryptominer process running inside a production VM"},{"k":"ciem","h":"An IAM role with wildcard permissions that no identity ever used"},{"k":"casb","h":"Marketing shares customer decks on an unapproved file-sharing SaaS"}],"slots":[{"h":"CSPM","t":"CSPM","accept":["cspm"],"why":"cloud security posture management - configuration"},{"h":"CWPP","t":"CWPP","accept":["cwpp"],"why":"cloud workload protection platform - runtime"},{"h":"CIEM","t":"CIEM","accept":["ciem"],"why":"cloud infrastructure entitlement management - identities"},{"h":"CASB","t":"CASB","accept":["casb"],"why":"cloud access security broker - SaaS usage"}]},"ex":"<b>Why:<\/b> CSPM watches cloud configuration (public buckets, drift). CWPP watches runtime inside workloads (cryptominers, suspicious processes). CIEM watches identities and permissions (wildcard roles). CASB watches SaaS usage by people (shadow IT). SOC 2 and ISO 27001 audits lean on all four data sources. <b>Focus on:<\/b> config vs runtime vs identity vs SaaS - four different questions.","k":["CSPM","CWPP","CIEM","CASB","Continuous monitoring & drift","GCP Security Command Center","Compliance frameworks (PCI DSS, HIPAA, GDPR, ISO 27001, SOC 2, NIST)"],"hint":"Ask for each finding: configuration, process, permission, or SaaS app?"}]};
/* ===== engine part A: exercise-type renderers ===== */
'use strict';
var R = {};
var ALBL = {
  qcm:'CHOOSE ONE', multi:'CHOOSE ALL THAT APPLY', dual:'ANSWER BOTH PERSPECTIVES',
  dnd:'DRAG OR CLICK THE ITEMS INTO PLACE', order:'PUT THE STEPS IN THE RIGHT ORDER',
  rank:'RANK THE ITEMS: 1 = MOST URGENT', fib:'FILL IN THE BLANKS',
  terminal:'TYPE THE COMMAND AND PRESS ENTER', branch:'WORK THE SCENARIO STEP BY STEP',
  spot:'CLICK EVERY LINE THAT CONTAINS THE PROBLEM', triage:'CHOOSE ONE ACTION PER ALERT'
};
function ansLabel(ex){ return ex.albl || ALBL[ex.type] || 'ANSWER'; }

function setDis(root,dis){ $$('.opt,.chipitem,.ordrow button,.blank,.bankchip,.obtn,.linebtn,button',root).forEach(function(b){ try{ b.disabled=dis; }catch(e){} }); }

/* ---------- QCM (single choice) ---------- */
R.qcm = {
  build:function(ex, st, host){
    var d=ex.d;
    if(!st.order){ st.order = shuffle(d.opts.map(function(o,i){return i;})); }
    if(st.sel===undefined){ st.sel=null; }
    var wrap=h('div','opts');
    st.order.forEach(function(oi){
      var o=d.opts[oi];
      var b=h('button','opt');
      b.type='button'; b.dataset.oi=oi;
      b.setAttribute('role','radio'); b.setAttribute('aria-checked', st.sel===oi?'true':'false');
      if(st.sel===oi){ b.classList.add('sel'); }
      b.innerHTML='<span class="optmark" aria-hidden="true"></span><span class="optbody">'+o.h+(o.sub?'<span class="mini">'+o.sub+'</span>':'')+'</span>';
      b.addEventListener('click',function(){
        if(st.done){return;}
        st.sel=oi;
        $$('.opt',wrap).forEach(function(x){ x.setAttribute('aria-checked','false'); x.classList.remove('sel'); });
        b.classList.add('sel'); b.setAttribute('aria-checked','true');
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  },
  marks:function(ex, st){
    var d=ex.d;
    $$('.opt',CUR.ui.ans).forEach(function(n){
      var oi=+n.dataset.oi, o=d.opts[oi];
      n.disabled=true; n.classList.remove('sel');
      if(o.ok){ n.classList.add('mk-ok'); n.querySelector('.optmark').innerHTML=OK; }
      else if(oi===st.sel){ n.classList.add('mk-no'); n.querySelector('.optmark').innerHTML=NO; }
    });
  },
  val:function(ex, st){
    if(st.sel==null){ return null; }
    this.marks(ex,st);
    var d=ex.d, chosen=d.opts[st.sel];
    return { frac: chosen.ok?1:0, elements:1, got:chosen.ok?1:0,
      yours:chosen.h, correct:this.corr(ex) };
  },
  corr:function(ex){
    for(var i=0;i<ex.d.opts.length;i++){ if(ex.d.opts[i].ok){ return ex.d.opts[i].h; } }
    return '';
  }
};

/* ---------- MULTI (multi select) ---------- */
R.multi = {
  build:function(ex, st, host){
    var d=ex.d;
    if(!st.order){ st.order = shuffle(d.opts.map(function(o,i){return i;})); }
    if(!st.sel){ st.sel=[]; }
    var wrap=h('div','opts');
    st.order.forEach(function(oi){
      var o=d.opts[oi];
      var b=h('button','opt');
      b.type='button'; b.dataset.oi=oi;
      b.setAttribute('role','checkbox'); b.setAttribute('aria-checked', st.sel.indexOf(oi)>=0?'true':'false');
      if(st.sel.indexOf(oi)>=0){ b.classList.add('sel'); }
      b.innerHTML='<span class="optmark" aria-hidden="true"></span><span class="optbody">'+o.h+(o.sub?'<span class="mini">'+o.sub+'</span>':'')+'</span>';
      b.addEventListener('click',function(){
        if(st.done){return;}
        var ix=st.sel.indexOf(oi);
        if(ix>=0){ st.sel.splice(ix,1); b.classList.remove('sel'); b.setAttribute('aria-checked','false'); }
        else{ st.sel.push(oi); b.classList.add('sel'); b.setAttribute('aria-checked','true'); }
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  },
  marks:function(ex, st){
    var d=ex.d;
    $$('.opt',CUR.ui.ans).forEach(function(n){
      var oi=+n.dataset.oi, o=d.opts[oi];
      n.disabled=true;
      if(o.ok){ n.classList.add('mk-ok'); n.querySelector('.optmark').innerHTML=(st.sel.indexOf(oi)>=0)?OK:WR; }
      else if(st.sel.indexOf(oi)>=0){ n.classList.add('mk-no'); n.querySelector('.optmark').innerHTML=NO; }
    });
  },
  val:function(ex, st){
    if(!st.sel.length){ return null; }
    this.marks(ex,st);
    var d=ex.d, tot=0, got=0;
    d.opts.forEach(function(o,i){ if(o.ok){ tot++; if(st.sel.indexOf(i)>=0){ got++; } } });
    return { frac: tot? got/tot : 0, elements:tot, got:got,
      yours: st.sel.length? st.sel.map(function(i){return d.opts[i].h;}).join('<br>') : '(nothing selected)',
      correct:this.corr(ex) };
  },
  corr:function(ex){
    return ex.d.opts.filter(function(o){return o.ok;}).map(function(o){return o.h;}).join('<br>');
  }
};

/* ---------- DUAL (two perspectives, multi-select each part) ---------- */
R.dual = {
  build:function(ex, st, host){
    var d=ex.d, self=this;
    if(!st.p){ st.p = d.parts.map(function(){ return {sel:[],order:null}; }); }
    d.parts.forEach(function(pt,pi){
      if(!st.p[pi].order){ st.p[pi].order = shuffle(pt.opts.map(function(o,i){return i;})); }
      var side=h('div','stagecard');
      side.innerHTML='<div class="stagelabel">'+pt.label+'</div>';
      var wrap=h('div','opts');
      st.p[pi].order.forEach(function(oi){
        var o=pt.opts[oi];
        var b=h('button','opt');
        b.type='button'; b.dataset.pi=pi; b.dataset.oi=oi;
        b.setAttribute('role','checkbox'); b.setAttribute('aria-checked', st.p[pi].sel.indexOf(oi)>=0?'true':'false');
        if(st.p[pi].sel.indexOf(oi)>=0){ b.classList.add('sel'); }
        b.innerHTML='<span class="optmark" aria-hidden="true"></span><span class="optbody">'+o.h+'</span>';
        b.addEventListener('click',function(){
          if(st.done){return;}
          var cur=st.p[pi].sel, ix=cur.indexOf(oi);
          if(ix>=0){ cur.splice(ix,1); b.classList.remove('sel'); b.setAttribute('aria-checked','false'); }
          else{ cur.push(oi); b.classList.add('sel'); b.setAttribute('aria-checked','true'); }
        });
        wrap.appendChild(b);
      });
      side.appendChild(wrap);
      host.appendChild(side);
    });
  },
  marks:function(ex, st){
    var d=ex.d;
    $$('.opt',CUR.ui.ans).forEach(function(n){
      var pi=+n.dataset.pi, oi=+n.dataset.oi, o=d.parts[pi].opts[oi];
      n.disabled=true;
      if(o.ok){ n.classList.add('mk-ok'); n.querySelector('.optmark').innerHTML=(st.p[pi].sel.indexOf(oi)>=0)?OK:WR; }
      else if(st.p[pi].sel.indexOf(oi)>=0){ n.classList.add('mk-no'); n.querySelector('.optmark').innerHTML=NO; }
    });
  },
  val:function(ex, st){
    var any=false;
    st.p.forEach(function(p){ if(p.sel.length){ any=true; } });
    if(!any){ return null; }
    this.marks(ex,st);
    var d=ex.d, tot=0, got=0, ys=[], cs=[];
    d.parts.forEach(function(pt,pi){
      var labels={sel:[],ok:[]};
      pt.opts.forEach(function(o,i){
        if(o.ok){ labels.ok.push(o.h); tot++; if(st.p[pi].sel.indexOf(i)>=0){ got++; } }
        if(st.p[pi].sel.indexOf(i)>=0){ labels.sel.push(o.h); }
      });
      ys.push('<b>'+pt.label+'</b><br>'+(labels.sel.length?labels.sel.join('<br>'):'(nothing selected)'));
      cs.push('<b>'+pt.label+'</b><br>'+labels.ok.join('<br>'));
    });
    return { frac: tot? got/tot:0, elements:tot, got:got, yours:ys.join('<br><br>'), correct:cs.join('<br><br>') };
  },
  corr:function(ex){
    var cs=[];
    ex.d.parts.forEach(function(pt){
      cs.push('<b>'+pt.label+'</b><br>'+pt.opts.filter(function(o){return o.ok;}).map(function(o){return o.h;}).join('<br>'));
    });
    return cs.join('<br><br>');
  }
};

/* ---------- DND (chips -> slots; slot.accept = array of item keys) ---------- */
R.dnd = {
  build:function(ex, st, host){
    var d=ex.d, self=this;
    if(!st.assign){ st.assign={}; d.slots.forEach(function(s,i){ st.assign[i]=[]; }); }
    if(!st.bankOrd){ st.bankOrd = shuffle(d.items.map(function(i){return i.k;})); }
    st.selItem = st.selItem||null;
    var bank=h('div','bank');
    bank.innerHTML='<div class="banlabel">ITEMS</div>';
    var zone=h('div','',''); bank.appendChild(zone);
    function findK(key){ for(var i=0;i<d.items.length;i++){ if(d.items[i].k===key){ return d.items[i]; } } return null; }
    function refresh(){
      zone.innerHTML='';
      st.bankOrd.forEach(function(k){
        if(self.placedIn(d,st,k)>=0){ return; }
        var c=h('button','chipitem'); c.type='button'; c.dataset.k=k; c.draggable=true;
        c.innerHTML=findK(k).h;
        c.setAttribute('aria-label','item '+(findK(k).t||k));
        c.addEventListener('click',function(){
          if(st.done){return;}
          if(st.selItem===k){ st.selItem=null; }
          else{ st.selItem=k; }
          $$('.chipitem',host).forEach(function(x){ x.classList.remove('sel'); });
          if(st.selItem===k){ c.classList.add('sel'); }
        });
        c.addEventListener('dragstart',function(ev){ if(st.done){ev.preventDefault();return;} try{ev.dataTransfer.setData('text/plain',k);}catch(e){} });
        zone.appendChild(c);
      });
      d.slots.forEach(function(s,i){
        var dz=host.querySelector('.slot[data-si="'+i+'"] .dropzone');
        dz.innerHTML='';
        st.assign[i].forEach(function(k){
          var c=h('button','chipitem'); c.type='button'; c.dataset.k=k;
          c.innerHTML=findK(k).h;
          c.title='Click to put back';
          c.addEventListener('click',function(){
            if(st.done){return;}
            var a=st.assign[i], ix=a.indexOf(k);
            if(ix>=0){ a.splice(ix,1); }
            refresh();
          });
          dz.appendChild(c);
        });
        if(!st.assign[i].length){ dz.innerHTML='<span class="mini" style="color:var(--tx3)">empty</span>'; }
      });
    }
    host.appendChild(bank);
    var slots=h('div','slots');
    d.slots.forEach(function(s,i){
      var sl=h('div','slot'); sl.dataset.si=i;
      sl.innerHTML='<div class="slab">'+s.h+(s.why?' <span class="swhy">- '+s.why+'</span>':'')+'</div>';
      var dz=h('div','dropzone'); sl.appendChild(dz);
      sl.addEventListener('dragover',function(ev){ if(!st.done){ ev.preventDefault(); sl.classList.add('dropp'); } });
      sl.addEventListener('dragleave',function(){ sl.classList.remove('dropp'); });
      sl.addEventListener('drop',function(ev){
        ev.preventDefault(); sl.classList.remove('dropp');
        if(st.done){return;}
        var k; try{ k=ev.dataTransfer.getData('text/plain'); }catch(e){}
        if(!k){ return; }
        self.place(d,st,i,k); refresh();
      });
      sl.addEventListener('click',function(ev){
        if(st.done){return;}
        if(ev.target.closest('.chipitem')){ return; }
        if(st.selItem){ self.place(d,st,i,st.selItem); st.selItem=null; $$('.chipitem',host).forEach(function(x){x.classList.remove('sel');}); refresh(); }
      });
      slots.appendChild(sl);
    });
    host.appendChild(slots);
    refresh();
  },
  placedIn:function(d,st,k){
    for(var i=0;i<d.slots.length;i++){ if(st.assign[i].indexOf(k)>=0){ return i; } }
    return -1;
  },
  place:function(d,st,si,k){
    var cur=this.placedIn(d,st,k);
    if(cur>=0){ var a=st.assign[cur], ix=a.indexOf(k); if(ix>=0){ a.splice(ix,1); } }
    st.assign[si].push(k);
  },
  marks:function(ex, st){
    var d=ex.d, self=this;
    $$('.chipitem',CUR.ui.ans).forEach(function(c){ c.disabled=true; c.classList.remove('sel'); });
    d.items.forEach(function(it){
      var si=self.placedIn(d,st,it.k);
      var okPos=-1;
      d.slots.forEach(function(s,i){ if(s.accept.indexOf(it.k)>=0){ okPos=i; } });
      var cls = (si===okPos)?'mk-ok':(si>=0?'mk-no':'mk-miss');
      var node=CUR.ui.ans.querySelector('.chipitem[data-k="'+it.k+'"]');
      if(node){ node.classList.add(cls);
        node.insertAdjacentHTML('beforeend','<span class="ic '+(cls==='mk-ok'?'c-ok':cls==='mk-no'?'c-no':'c-wr')+'"> '+(cls==='mk-ok'?'&#10003;':cls==='mk-no'?'&#10007;':'&#9888;')+'</span>');
      }
    });
  },
  val:function(ex, st){
    var d=ex.d, self=this, tot=0, got=0;
    d.items.forEach(function(it){ tot++; var si=self.placedIn(d,st,it.k); var okPos=-1;
      d.slots.forEach(function(s,i){ if(s.accept.indexOf(it.k)>=0){ okPos=i; } });
      if(si===okPos){ got++; } });
    var any=false; d.slots.forEach(function(s,i){ if(st.assign[i].length){ any=true; } });
    if(!any && tot>0){ return null; }
    this.marks(ex,st);
    var ys=[], cs=[];
    d.slots.forEach(function(s,i){
      ys.push('<b>'+s.t+':</b> '+(st.assign[i].length? st.assign[i].map(function(k){return self.itemH(d,k);}).join(', ') : '(empty)'));
      cs.push('<b>'+s.t+':</b> '+s.accept.map(function(k){return self.itemH(d,k);}).join(', '));
    });
    return { frac: tot? got/tot:0, elements:tot, got:got, yours:ys.join('<br>'), correct:cs.join('<br>') };
  },
  itemH:function(d,k){ for(var i=0;i<d.items.length;i++){ if(d.items[i].k===k){ return d.items[i].h; } } return k; },
  corr:function(ex){
    var d=ex.d, cs=[];
    d.slots.forEach(function(s){ cs.push('<b>'+s.t+':</b> '+s.accept.map(function(k){return R.dnd.itemH(d,k);}).join(', ')); });
    return cs.join('<br>');
  }
};
R.match = R.dnd;

/* ---------- ORDER / RANK ---------- */
R.order = {
  build:function(ex, st, host){
    var d=ex.d, self=this;
    if(!st.seq){ st.seq = shuffle(d.items.map(function(i){return i.k;})); }
    var list=h('div','ordlist');
    function row(k, idx){
      var it=null; d.items.forEach(function(x){ if(x.k===k){ it=x; } });
      var r=h('div','ordrow'); r.draggable=true; r.dataset.k=k;
      r.innerHTML='<span class="rankno">'+(idx+1)+'</span><span class="obody">'+it.h+'</span>';
      var mv=h('div','mv');
      var up=h('button','','&#9650;'); up.type='button'; up.setAttribute('aria-label','move up');
      var dn=h('button','','&#9660;'); dn.type='button'; dn.setAttribute('aria-label','move down');
      up.addEventListener('click',function(){ if(st.done){return;} self.swap(st,idx,idx-1); rerender(); });
      dn.addEventListener('click',function(){ if(st.done){return;} self.swap(st,idx,idx+1); rerender(); });
      mv.appendChild(up); mv.appendChild(dn); r.appendChild(mv);
      r.addEventListener('dragstart',function(ev){ if(st.done){ev.preventDefault();return;} st._drag=k; r.classList.add('dragging'); try{ev.dataTransfer.setData('text/plain',k);}catch(e){} });
      r.addEventListener('dragend',function(){ r.classList.remove('dragging'); });
      r.addEventListener('dragover',function(ev){ ev.preventDefault(); });
      r.addEventListener('drop',function(ev){
        ev.preventDefault(); if(st.done){return;}
        var fk = st._drag || (function(){ try{return ev.dataTransfer.getData('text/plain');}catch(e){return null;} })();
        if(!fk || fk===k){ return; }
        var from=st.seq.indexOf(fk), to=st.seq.indexOf(k);
        st.seq.splice(from,1); st.seq.splice(to,0,fk);
        rerender();
      });
      return r;
    }
    function rerender(){
      list.innerHTML='';
      st.seq.forEach(function(k,i){ list.appendChild(row(k,i)); });
    }
    rerender();
    host.appendChild(list);
  },
  swap:function(st,a,b){
    if(b<0||b>=st.seq.length){ return; }
    var t=st.seq[a]; st.seq[a]=st.seq[b]; st.seq[b]=t;
  },
  marks:function(ex, st){
    var d=ex.d;
    $$('.ordrow',CUR.ui.ans).forEach(function(n,i){
      n.querySelector('button').disabled=true; n.draggable=false;
      var cls = (d.correct[i]===n.dataset.k)?'mk-ok':'mk-no';
      n.classList.add(cls);
      n.querySelector('.rankno').style.color = (cls==='mk-ok')?'var(--ok)':'var(--no)';
      n.querySelector('.obody').insertAdjacentHTML('beforeend',' '+(cls==='mk-ok'?OK:NO));
    });
    $$('.ordrow',CUR.ui.ans).forEach(function(n){ n.querySelectorAll('button').forEach(function(b){b.disabled=true;}); });
  },
  val:function(ex, st){
    if(!st.seq){ return null; }
    this.marks(ex,st);
    var d=ex.d, got=0;
    st.seq.forEach(function(k,i){ if(d.correct[i]===k){ got++; } });
    var yl=st.seq.map(function(k,i){ return (i+1)+'. '+R.order.itemH(d,k); }).join('<br>');
    var cl=d.correct.map(function(k,i){ return (i+1)+'. '+R.order.itemH(d,k); }).join('<br>');
    return { frac: got/d.correct.length, elements:d.correct.length, got:got, yours:yl, correct:cl };
  },
  itemH:function(d,k){ for(var i=0;i<d.items.length;i++){ if(d.items[i].k===k){ return d.items[i].h; } } return k; },
  corr:function(ex){
    return ex.d.correct.map(function(k,i){ return (i+1)+'. '+R.order.itemH(ex.d,k); }).join('<br>');
  }
};
R.rank = R.order;

/* ---------- FIB ---------- */
R.fib = {
  build:function(ex, st, host){
    var d=ex.d, self=this;
    var twrap=h('div','fibtext');
    if(d.mode==='type'){
      if(!st.vals){ st.vals=d.blanks.map(function(){return '';}); }
      var parts=d.text.split(/\{\{(\d+)\}\}/);
      var html='';
      for(var i=0;i<parts.length;i++){
        if(i%2===1){ html+='<input class="fibinput" data-b="'+parts[i]+'" type="text" spellcheck="false" aria-label="blank '+(+parts[i]+1)+'">'; }
        else{ html+=parts[i]; }
      }
      twrap.innerHTML=html;
      $$('.fibinput',twrap).forEach(function(inp){
        inp.value = st.vals[+inp.dataset.b]||'';
        inp.addEventListener('input',function(){ if(st.done){ inp.value=st.vals[+inp.dataset.b]||''; return; } st.vals[+inp.dataset.b]=inp.value; });
      });
    }else{
      if(!st.fill){ st.fill=d.blanks.map(function(){return null;}); }
      if(!st.bankOrd){ st.bankOrd=shuffle(d.bank.map(function(w,i){return i;})); }
      if(st.active===undefined){ st.active=null; }
      var html='';
      var parts=d.text.split(/\{\{(\d+)\}\}/);
      for(var i=0;i<parts.length;i++){
        if(i%2===1){ html+='<button type="button" class="blank" data-b="'+parts[i]+'">____</button>'; }
        else{ html+=parts[i]; }
      }
      twrap.innerHTML=html;
      var bank=h('div','bank');
      bank.innerHTML='<div class="banlabel">WORD BANK</div>';
      var bzone=h('div','',''); bank.appendChild(bzone);
      function refresh(){
        bzone.innerHTML='';
        st.bankOrd.forEach(function(wi){
          if(st.fill.indexOf(wi)>=0){ return; }
          var c=h('button','chipitem'); c.type='button'; c.dataset.w=wi; c.innerHTML=d.bank[wi];
          c.addEventListener('click',function(){
            if(st.done){return;}
            var target = st.active;
            if(target==null){ for(var q=0;q<st.fill.length;q++){ if(st.fill[q]==null){ target=q; break; } } }
            if(target==null){ return; }
            st.fill[target]=wi; st.active=null; refresh(); paint();
          });
          bzone.appendChild(c);
        });
      }
      function paint(){
        $$('.blank',twrap).forEach(function(b){
          var bi=+b.dataset.b;
          b.textContent = (st.fill[bi]==null)?'____':d.bank[st.fill[bi]];
          b.classList.toggle('active', st.active===bi);
        });
      }
      $$('.blank',twrap).forEach(function(b){
        b.addEventListener('click',function(){
          if(st.done){return;}
          var bi=+b.dataset.b;
          if(st.fill[bi]!=null){ st.fill[bi]=null; st.active=null; refresh(); paint(); return; }
          st.active=bi; paint();
        });
      });
      host.appendChild(twrap);
      host.appendChild(bank);
      refresh(); paint();
      return;
    }
    host.appendChild(twrap);
  },
  marks:function(ex, st){
    var d=ex.d;
    if(d.mode==='type'){
      $$('.fibinput',CUR.ui.ans).forEach(function(inp){
        var bi=+inp.dataset.b; inp.disabled=true;
        inp.value=st.vals[bi];
        var ok=this.okVal(d.blanks[bi].a, st.vals[bi]);
        inp.classList.add(ok?'mk-ok':'mk-no');
        inp.insertAdjacentHTML('afterend', ok?OK:NO);
      },this);
    }else{
      $$('.blank',CUR.ui.ans).forEach(function(b){
        var bi=+b.dataset.b; b.disabled=true;
        var ok = (st.fill[bi]!=null) && this.okVal(d.blanks[bi].a, d.bank[st.fill[bi]]);
        if(st.fill[bi]==null){ b.classList.add('mk-miss'); b.insertAdjacentHTML('beforeend',' '+WR); }
        else{ b.classList.add(ok?'mk-ok':'mk-no'); b.insertAdjacentHTML('beforeend',' '+(ok?OK:NO)); }
      },this);
      $$('.chipitem',CUR.ui.ans).forEach(function(c){ c.disabled=true; });
    }
  },
  okVal:function(accepts, v){
    var n=String(v||'').toLowerCase().replace(/\s+/g,' ').trim();
    return accepts.some(function(a){ return a.toLowerCase().replace(/\s+/g,' ').trim()===n; });
  },
  val:function(ex, st){
    var d=ex.d, self=this;
    var got=0, tot=d.blanks.length, ys=[], any=false;
