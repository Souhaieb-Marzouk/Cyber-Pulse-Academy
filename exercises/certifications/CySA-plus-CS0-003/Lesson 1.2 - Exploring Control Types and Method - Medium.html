const DATA = {"meta":{"topicId":"cysa-plus","chapter":1,"title":"Vulnerability Response, Handling and Management — MEDIUM (v5.0)","difficulty":"medium","questionCount":34,"estimatedMinutes":85,"passMark":70},"intro":"This is the MEDIUM tier of objective 2.5. Every exercise joins two or three connected ideas: you read a realistic artefact, decide what is happening, and then choose what to do about it. The goal is always stated; the path is not. Every keyword of the objective is exercised in this file, and again in the HARD file with different scenarios, different data and different reasoning.","exercises":[{"id":"med-1","type":"sort","theme":"Life cycle phases","summary":"Monday triage notebook — place eight real activities on the right life-cycle phase","scenario":[{"label":"Artefact 1 — Vulnerability management notebook, Monday 09:12","kind":"text","text":"The team wrote down eight things it did this week. Each one belongs to exactly one phase of the life cycle."}],"question":"Drag each activity into the life-cycle phase it belongs to.","bins":["Identify","Analyze and prioritize","Remediate or mitigate","Verify","Report"],"items":[{"t":"Import the CMDB export so the scanner knows every asset","bin":0},{"t":"Add the new data-centre subnet to the discovery scan scope","bin":0},{"t":"Check the new CVE against the CISA KEV catalog and the vendor advisory","bin":1},{"t":"Give the finding a 14-day deadline because the host faces the internet","bin":1},{"t":"Deploy the WAF virtual patch rule while the vendor fix is still in test","bin":2},{"t":"Install the vendor hotfix on the pilot server","bin":2},{"t":"Rescan the host with credentials and compare the installed version","bin":3},{"t":"Publish the aging, coverage and SLA figures for the security board","bin":4}],"hint":"Ask what each activity produces: a list of assets, a decision, a change, a proof, or a document.","explain":"Each activity produces one kind of output. Importing the CMDB export and widening the discovery scope build the picture of what exists, so they are Identify. Reading the advisory with the KEV catalog and setting a deadline are decisions about danger and time, so they are Analyze and prioritize. A WAF rule and a hotfix change the risk itself, so they are Remediate or mitigate. A credentialed rescan produces evidence that the change worked, so it is Verify. The aging report leaves the team, so it is Report. Keeping the phases apart matters, because a finding is only closed when Verify has produced proof, not when the change was made.","study":"Learn the five phases and the output of each one: inventory, decision, change, proof, document.","keys":["Identify","Analyze and prioritize","Remediate or mitigate","Verify","Report","Asset inventory and asset criticality","Discovery scan","CISA KEV catalog","Remediation SLA and deadline","Virtual patching and WAF rule","Rescan and regression test","Executive and board reporting","Metrics and KPIs"]},{"id":"med-2","type":"logq","theme":"Classification of scan results","summary":"Plugin 38795 fires on a host that carries its own patched library — decide the classification","scenario":[{"label":"Artefact 1 — Authenticated scan export, host erp-web-02, 09:41","kind":"log","lines":[{"t":"09:41:02","s":"nessus","m":"plugin 38795 OpenSSL 1.0.2 detected on port 443"},{"t":"09:41:03","s":"nessus","m":"evidence: version read from the TLS handshake banner OpenSSL/1.0.2k"},{"t":"09:41:03","s":"nessus","m":"local package audit: os libssl replaced by the application bundle"}]},{"label":"Artefact 2 — Change record CHG-2291 and the vendor note","kind":"text","text":"CHG-2291 replaced the system OpenSSL with the application-bundled build 3.0.13 on 11 March. The vendor note says the web server links its own libssl, and the operating system library is no longer used."}],"question":"The scanner reports OpenSSL 1.0.2 on this host. Which classification is correct?","options":["False negative: the plugin missed the real library that is on the host","True negative: the host has no OpenSSL at all, so no finding is needed","False positive: the plugin read a banner, not the library in use","True positive: any host that shows OpenSSL 1.0.2 is genuinely exposed"],"answer":2,"hint":"Ask where the scanner got its evidence. A handshake string is not the same thing as the installed library.","explain":"A false positive is a finding that is not true. Here the plugin read the version from the TLS handshake banner. The change record and the vendor note show that the app uses its own OpenSSL 3.0.13. The old banner was never updated, so the weakness is not there. A true positive would be a real weakness. A false negative is one the scanner missed. A true negative is a clean host. Write down the reason and use CHG-2291 as evidence. Then the team can suppress this plugin safely.","study":"For every finding ask what the scanner actually read: a banner, a file version, a registry key, or a full check with credentials.","keys":["False positive, false negative, true positive, true negative","Authenticated (credentialed) scan","NVD and vendor advisories","Analyze and prioritize","Configuration change and hardening"]},{"id":"med-3","type":"match","theme":"Scanning methods","summary":"New joiner card — pair each scanning method with what it really does","scenario":[{"label":"Artefact 1 — Team handbook, scanning section","kind":"text","text":"A new analyst must understand how each scanning method works before touching the console. Pair every method with its true description."}],"question":"Pair each scanning method with the description that belongs to it.","pairs":[["Authenticated scan","Logs in to the host, so it can list installed software and patches"],["Unauthenticated scan","Sees only what the network answers, so local detail stays hidden"],["Agent-based scan","A small program on the host sends its own results to the console"],["Agentless scan","The scanner reaches in from the network with nothing installed"],["Passive scan","Reads copied traffic and never sends a packet to the host"],["Intrusive scan","May crash a fragile device, so it needs written approval first"]],"hint":"Focus on where the scanner stands: inside the host, on the network, or to the side reading copied traffic.","explain":"Each method changes what the scan can see and what it can break. An authenticated scan logs in and reads the local truth, so it finds missing patches that a network view cannot show. An unauthenticated scan only reads the answers the services give. An agent sends results from the host itself, while an agentless scan needs no software there. A passive scan reads a copy of the traffic and touches nothing, which is why it is the safe choice for fragile equipment. An intrusive scan sends real attacks, so it can stop a device and must be approved in writing before it runs.","study":"Learn the trade-off in one line: deeper visibility costs more access and more risk of disruption.","keys":["Authenticated (credentialed) scan","Unauthenticated (non-credentialed) scan","Agent-based and agentless scanning","Active and passive scanning","Intrusive and non-intrusive scan","Special handling: ICS and OT, medical devices, legacy systems"]},{"id":"med-4","type":"order","theme":"Remediation path for an exploited flaw","summary":"Ticket VM-4471 — the flaw is in the KEV catalog and the fix needs a reboot","scenario":[{"label":"Artefact 1 — Ticket VM-4471","kind":"kv","rows":[["Asset","vpn-edge-01, internet-facing, 4 100 remote workers depend on it"],["Finding","command injection, CVSS 10.0, now listed in the CISA KEV catalog"],["Vendor fix","available, needs a 25-minute reboot"],["Change policy","this case fits the emergency change path with a rollback plan"]]}],"question":"Put the six steps in the order the team must run them.","items":["Confirm exploitability: the flaw is in the KEV catalog and the asset faces the internet","Apply the compensating control at the edge: block the attack pattern and raise logging","Raise an emergency change and get the duty manager to approve it","Install the vendor fix inside the approved emergency window","Rescan the appliance with credentials and confirm the installed version","Attach the evidence and record the 25-minute outage in the risk register entry"],"hint":"The clock starts with one question: is this really being used? A reboot comes only after the edge is protected.","explain":"Two rules set the order when a flaw is already being used. First, cut the exposure fast, because one working attempt is enough. That is the edge control. Second, do not leave the door open while you wait for a change board. The emergency path exists for exactly this case. The fix itself comes after the control and the approval. Then a credentialed rescan proves the new version is running. The evidence and the outage record close the ticket. This order also keeps the business online, because the edge rule covers the users during the reboot.","study":"For an exploited flaw remember five words in order: contain, approve, fix, verify, document.","keys":["Actively exploited, zero-day and n-day","CISA KEV catalog","Exploitability, proof of concept and weaponized exploit","Compensating control","Emergency change and the change advisory board","Rollback plan","Rescan and regression test","Risk register","Verify","Remediate or mitigate","Authenticated (credentialed) scan","Vulnerability response versus incident response"]},{"id":"med-5","type":"fill","theme":"Exception and risk acceptance","summary":"Exception form EXC-118 — four blanks before the CISO can sign","scenario":[{"label":"Artefact 1 — Exception request EXC-118 (draft)","kind":"text","text":"The plant controller cannot take a patch: the vendor supports the firmware only until the line is rebuilt next year. Four words are missing from the draft form."}],"question":"Complete the exception request with the four missing words.","parts":["The owner asks for an ","{{}}"," for finding VULN-2201. The request must name the ","{{}}"," that lowers the risk today, the date when the exception ","{{}}",", and the manager who signs off the ","{{}}"," risk."],"answers":["exception","compensating control","expires","residual"],"bank":["residual","exception","hardening","compensating control","coverage","expires","escalation","appetite"],"hint":"One word names the paper, one names the workaround, one names a date, and one names what is left over.","explain":"An exception lets a known finding stay open for a fixed time. It is only defensible if it states three things. It must name the control that lowers the risk today. It must give a date when the paper stops being valid. It must name the person who accepts what is left, which is the residual risk. The risk owner signs, not the analyst, because accepting risk is a business decision. Without an expiry date the exception becomes permanent, and nobody looks at the finding again.","study":"Every exception needs four things: a reason, a compensating control, an expiry date and a named owner who accepts the residual risk.","keys":["Exception and waiver","Compensating control","Risk acceptance sign-off","Vulnerability aging","Special handling: ICS and OT, medical devices, legacy systems","Risk register"]},{"id":"med-6","type":"sort","theme":"Risk response choices","summary":"Portfolio review — six real decisions, four ways to answer a risk","scenario":[{"label":"Artefact 1 — Risk review agenda","kind":"text","text":"Six decisions are on the agenda. Each one is an example of avoiding, mitigating, transferring or accepting a risk."}],"question":"Drag each decision into the risk response it uses.","bins":["Avoid","Mitigate","Transfer","Accept"],"items":[{"t":"Retire the legacy reporting server before the next audit","bin":0},{"t":"Remove the old file transfer feature from the product","bin":0},{"t":"Install the vendor firmware that removes the flaw","bin":1},{"t":"Put the service behind a WAF rule and split its subnet","bin":1},{"t":"Buy cyber insurance that covers the remaining exposure","bin":2},{"t":"Move the payment service to a provider that carries the risk","bin":2},{"t":"Sign a time-limited exception because the vendor has no fix","bin":3},{"t":"Keep the risk and fund monitoring instead of a fix","bin":3}],"hint":"Ask what happens to the activity: it stops, it gets smaller, somebody else carries it, or it stays as it is.","explain":"Risk can be answered in four ways. Avoid means the activity that creates the risk is stopped, for example by retiring the server. Mitigate means the risk is made smaller, for example with a firmware fix or a WAF rule. Transfer means another party carries it, such as an insurer or a provider. Accept means the organisation keeps the risk and records the decision. A mitigating control makes the risk smaller. A compensating control stands in for a fix that does not exist yet. Both appear in this list, and both are written down. A wrong label hides the real decision from the board.","study":"Learn the four responses with one example each, and remember that accepting a risk must always be written down and signed.","keys":["Risk response: avoid, mitigate, transfer, accept","Compensating control","Mitigating control","Exception and waiver","Virtual patching and WAF rule","Network segmentation and ACL","Risk acceptance sign-off","Decommissioning"]},{"id":"med-7","type":"mcq","theme":"Reading a CVSS vector","summary":"Scoreboard card — one vector, one correct reading","scenario":[{"label":"Artefact 1 — Finding card, public booking site","kind":"code","lines":["CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H","base score 9.8     exploit in the wild: none reported","asset: booking.corp, reachable from the internet"]}],"question":"Which statement about this vector is correct?","options":["Reachable over the network, but the attacker must already hold an account","Local access only, with no account needed and no user action at all","Reachable over the network, and the victim must open a file or a link","Reachable over the network, with no account needed and no user action"],"answer":3,"hint":"Read the vector from the left: AV, AC, PR, UI. Each pair of letters answers one question.","explain":"AV:N means the flaw can be reached over the network, so no local seat is needed. PR:N means no privileges are required, so the attacker needs no account. UI:N means no user interaction is required, so nobody has to open a file or follow a link. One choice matches all three of those facts. The choice that demands an account is ruled out by PR:N. The choice that says local access is ruled out by AV:N. The choice that needs the victim to act is ruled out by UI:N. C:H, I:H and A:H then say that a successful attack badly damages confidentiality, integrity and availability.","study":"Memorise the base metrics and their letters: AV, AC, PR, UI, S, C, I, A.","keys":["CVSS vector string","CVSS base score","Exploitability, proof of concept and weaponized exploit","Analyze and prioritize","Attack surface (external, internal, physical)"]},{"id":"med-8","type":"order","theme":"Prioritization with real feeds","summary":"Four findings, one work queue — rank by what this company must fix first","scenario":[{"label":"Artefact 1 — Prioritization board, columns from the scanner and the feeds","kind":"code","lines":["F-1 vpn-edge-01  CVSS 9.8  EPSS 0.61  KEV yes  VPR 9.1  SSVC Act    criticality high","F-2 hr-portal    CVSS 8.1  EPSS 0.04  KEV no   VPR 6.2  SSVC Track  criticality high","F-3 lab-jump-07  CVSS 7.5  EPSS 0.02  KEV no   VPR 4.0  SSVC Track  criticality low","F-4 fin-files-02 CVSS 7.5  EPSS 0.31  KEV no   VPR 7.4  SSVC Act    criticality high"]},{"label":"Artefact 2 — Note from the risk analyst","kind":"text","text":"Exposure factor for the file server is high: it holds four years of finance records. Likelihood is taken from EPSS. The decision column is what the business says it will do."}],"question":"Rank the four findings in the order the team should work them, highest priority first.","items":["F-1 vpn-edge-01 — CVSS 9.8, listed in the KEV catalog, decision Act","F-4 fin-files-02 — CVSS 7.5, EPSS 0.31, VPR 7.4, decision Act","F-2 hr-portal — CVSS 8.1, EPSS 0.04, VPR 6.2, decision Track","F-3 lab-jump-07 — CVSS 7.5, EPSS 0.02, VPR 4.0, low criticality"],"hint":"A base score says how bad the flaw is. The feeds say whether anybody is using it. The asset says what it costs you.","explain":"F-1 comes first without argument. It is listed in the KEV catalog, so real attacks exist, and its base score is the highest. F-4 comes next. Its base score is lower than F-2's, but its exploitation probability and its vendor score are much higher. The decision for F-4 is also Act, so somebody must move. F-2 keeps a high base score, yet it has almost no exploitation activity and a Track decision. So it waits behind F-4. F-3 is last, because the host is a lab machine with low criticality and very low likelihood. A base score alone would place F-2 second, which is the mistake this exercise is about.","study":"Base score for how bad, EPSS for how likely, KEV for how real, VPR and SSVC for what to do, asset criticality for what it costs.","keys":["CVSS base score","EPSS","CISA KEV catalog","VPR and SSVC","Asset inventory and asset criticality","Analyze and prioritize","Exposure factor and likelihood","Industry and organizational impact","Exploitability, proof of concept and weaponized exploit","Data classification"]},{"id":"med-9","type":"logq","theme":"Scan quality and data trust","summary":"Nightly job 4122 fell back to network mode — read what that does to the results","scenario":[{"label":"Artefact 1 — Scanner job 4122 (nightly, data-centre application subnet)","kind":"log","lines":[{"t":"02:00:11","s":"scanner","m":"job 4122 start, policy Linux-CIS-L1, 180 hosts, authenticated"},{"t":"02:04:52","s":"scanner","m":"SMB authentication failed on 63 hosts, retrying without credentials"},{"t":"02:31:07","s":"scanner","m":"notice: 63 hosts scanned in network mode, patch audit plugins skipped"},{"t":"02:31:07","s":"scanner","m":"job 4122 end: 41 findings (12 high, 29 medium), 0 unreachable"}]}],"question":"The morning report is built from this job. What is the correct reading and next step?","options":["The scan should be repeated at once in network mode on all 180 hosts","Those 63 hosts hide local detail, so repair the credentials first","The 41 findings are complete, so publish the report and open the tickets","The job proves the 63 hosts are clean, so they can leave the queue"],"answer":1,"hint":"Find the line that says which plugins were skipped, then ask what those plugins can see.","explain":"An authenticated scan reads the local software list, so it can see a missing patch even when nothing on the network gives it away. When SMB authentication fails, the scanner falls back to a network view and quietly skips the patch audit plugins. The 63 hosts are therefore neither clean nor dirty: they are simply not measured, and an agent installed on the host would have avoided the gap. The next step is to repair the service account, which has probably expired or lost its rights, and run the job again before the report leaves the team. Publishing the numbers as they are, or treating the hosts as clean, would hide real missing patches and mislead management.","study":"Read the authentication line of every scan job before you read the findings. A fallback to network mode is a data-quality alarm.","keys":["Authenticated (credentialed) scan","Unauthenticated (non-credentialed) scan","Agent-based and agentless scanning","False positive, false negative, true positive, true negative","Rescan and regression test","Verify","Metrics and KPIs"]},{"id":"med-10","type":"multi","theme":"Scan configuration and safety","summary":"The ERP database slowed down during last night's scan — change the policy before Friday","scenario":[{"label":"Artefact 1 — scan-policy-erp.ini","kind":"code","lines":["schedule     = daily 09:00","safe_checks  = false","targets      = 10[.]40[.]0[.]0/24","max_parallel = 40","exclusions   = none"]},{"label":"Artefact 2 — Service desk note, this morning","kind":"text","text":"Users reported slow screens on the ERP application from 09:05 to 09:40. The database team saw a high number of open connections from the scanner address during the same window."}],"question":"Which two changes belong in this policy before the next run? (Select two.)","options":["Raise max_parallel so the job ends before the morning shift","Remove the exclusions list so the scanner has more freedom","Move the scan window to 01:00 and lower max_parallel to 4","Turn safe_checks on so a fragile service is not pushed over","Add every office subnet to the target list to save time later"],"answer":[2,3],"hint":"Ask who else uses the ERP database at 09:00, and which setting decides whether a weak service survives the scan.","explain":"The database slowed down because the scan ran during office hours with a high number of parallel checks. Moving the window to the night and reducing parallelism lowers the load on both the network and the database. Safe checks matter for a service that cannot be restarted: with them on, the scanner avoids the tests that can knock over a fragile daemon. Adding more subnets, raising parallelism or deleting the exclusions all increase load and risk, which is the opposite of what the service desk reported. A scan that breaks the business is a self-inflicted incident, and the fix is a policy change, not a faster scanner.","study":"Before you change a scan policy, ask three questions: when does it run, how hard does it hit, and what can it break?","keys":["Scan window and scheduling","Performance impact","Safe checks","Intrusive and non-intrusive scan","Scan scope and authorization","Configuration change and hardening"]},{"id":"med-11","type":"terminal","theme":"Discovery and service enumeration","summary":"Task 27 — enumerate the services and versions on one in-scope host","scenario":[{"label":"Artefact 1 — Assignment TASK-27","kind":"kv","rows":[["Scope","change CHG-3120 authorises one host only: erp-db-01"],["Goal","list every open port with the service and the version behind it"],["Rule","read-only checks, no exploitation, no password guessing"],["Environment","the analyst workstation resolves erp-db-01 through internal DNS"]]}],"question":"Type one command that lists the open services and their versions on erp-db-01.","prompt":"analyst@soc-ws-03:~$","env":"Use a port-scanner command. `erp-db-01` resolves through internal DNS. Only the host inside the change record may be touched.","syntax":{"shape":"nmap -sV <host>","opts":[["-sV","probe each open port and print the service and version"],["-p","limit the ports, for example -p 1-1024"],["-oN","write the output to a text file"]],"example":"nmap -sV -p 1-1024 intranet-wiki-02"},"canonical":"nmap -sV erp-db-01","tool":"nmap","flags":["sV"],"allowFlags":["p","o","n","T","A","v","s","N","X"],"argsAny":["erp-db-01"],"target":"erp-db-01","termIntro":["nmap 7.94 on analyst-ws-03. Type the command, then press Run command.","Nothing leaves this page: the shell is a practice shell."],"termOut":["Starting Nmap 7.94","Nmap scan report for erp-db-01 (10[.]40[.]7[.]21)","PORT     STATE SERVICE     VERSION","22/tcp   open  ssh         OpenSSH 8.9p1 Ubuntu","443/tcp  open  ssl/http    nginx 1.24.0","5432/tcp open  postgresql  PostgreSQL 14.9","5433/tcp open  postgresql  PostgreSQL 9.6.24  <-- old major version","Service detection performed. 1 host up."],"sampleOut":["PORT     STATE SERVICE     VERSION","22/tcp   open  ssh         OpenSSH 8.9p1 Ubuntu","5432/tcp open  postgresql  PostgreSQL 14.9"],"parts":[["nmap","the tool that maps hosts, ports and services"],["-sV","asks each open port what it is and which version it runs"],["erp-db-01","the single host inside the authorised scope"]],"hint":"You need a port scanner. Add the version flag, then the host name. The change record authorises one host only.","explain":"The task is service enumeration, and nmap is the tool for it. The -sV option makes nmap talk to each open port and learn the product and version. The host name comes last and stays inside the authorised scope. Pointing the command at the whole subnet would break the change record and could disturb systems nobody approved. The output already gives a finding. Port 5433 runs PostgreSQL 9.6.24, and that old major version no longer receives security fixes. So it becomes the opening finding of the scan window.","study":"Learn the shape nmap -sV -p <ports> <host>, plus -oN for normal output, -oX for XML and --script for extra checks.","keys":["Discovery scan","Scan scope and authorization","Scan window and scheduling","Active and passive scanning","Unsupported, legacy and end-of-life software","Identify"]},{"id":"med-12","type":"branch","theme":"Branching case: exploited edge appliance","summary":"Three decisions on an internet-facing appliance that is under attack right now","scenario":[{"label":"Artefact 1 — Edge appliance vpn-edge-01, 14:02","kind":"log","lines":[{"t":"14:02:11","s":"edge","m":"request to /global-protect/login.esp with a path traversal in the template"},{"t":"14:02:12","s":"edge","m":"same source 203[.]0[.]113[.]9, 47 attempts in 4 minutes, none succeeded"},{"t":"14:03:40","s":"intel","m":"vendor advisory: command injection, exploitation observed in the wild, KEV listed"},{"t":"14:04:02","s":"ir","m":"integrity check of the admin partition: no unexpected files found"}]}],"question":"This exercise runs as a chain of decisions. Read each step, choose one option, and the next step follows from your choice.","steps":[{"title":"First action","question":"The appliance is still online, the attempts continue and no compromise is confirmed. What do you do first?","options":["Wait for the monthly patch window and keep watching the log lines","Reboot the appliance to clear any session the attacker may have opened","Block the attack pattern at the edge and open an incident","Take the appliance offline now and send all 4 100 remote users home"],"answer":2,"explain":"The appliance gives 4 100 people their remote access, so shutting it down would stop the business before any damage is proven. The fastest safe move cuts the attack path and gives the case an owner: a blocked attempt still needs somebody to follow it. Waiting leaves the door open for days. A reboot is not a fix, it does not remove a web shell, and it destroys the memory evidence that would tell you whether the attacker got in."},{"title":"Getting it approved","scenario":[{"label":"Artefact 1 — Incident bridge, 14:31","kind":"log","lines":[{"t":"14:31:02","s":"ir","m":"vendor fix available, needs a 25-minute reboot of the appliance"},{"t":"14:31:40","s":"chg","m":"the next scheduled change board meets in 6 days"},{"t":"14:32:10","s":"ir","m":"the edge control is holding, but the attempts never stop"}]}],"question":"The fix needs a 25-minute reboot. How do you get it approved?","options":["Deploy the fix in the standing monthly window and note it afterwards","Ask the vendor to apply the fix under their own maintenance contract","Skip the change record because an incident is already open on it","Raise an emergency change with a rollback plan and a named approver"],"answer":3,"explain":"A flaw that is being used in real attacks is exactly what the emergency change path exists for: a short record, a named approver, a rollback plan and a small window that the business agrees to. Using the monthly window means days of exposure on a live door. A vendor contract never transfers your own change control. Working without a record means the rollback and the outage are undocumented, so nobody can rebuild the case later."},{"title":"Closing the case","question":"The reboot is finished and the appliance is back online. What closes this case?","options":["Rescan with credentials, confirm the version, and hunt for a shell","Confirm that the users can connect again and close the ticket at once","Delete the noisy attack log lines so the incident report stays short","Add the appliance to next year's patch plan and stop watching it"],"answer":0,"explain":"A change is not a verified fix. A credentialed rescan proves that the new version is installed and that the edge rule can be removed, and the log review answers the question the incident opened: did the attacker get in before the block? Only then can the ticket close with evidence. Deleting log lines destroys the proof, and moving the appliance to next year's plan repeats the mistake that created this case."}],"hint":"At every step ask three things: what protects the users right now, what the change policy allows, and what proof a closer needs.","explain":"This case follows the real order of an exploited-flaw response. Contain the attack path first. Then get a small change approved on the emergency path. Then prove the fix and look for damage. Each step has a wrong answer that looks reasonable, such as shutting the service, waiting for the board, or trusting a reboot. Speed and evidence are not opposites. The fastest correct action is also the one that keeps the evidence usable.","study":"For an exploited edge flaw: block, escalate, emergency change, patch, verify, hunt.","keys":["Actively exploited, zero-day and n-day","Compensating control","Emergency change and the change advisory board","Rollback plan","Rescan and regression test","Vulnerability response versus incident response","Exploitability, proof of concept and weaponized exploit","CISA KEV catalog","Virtual patching and WAF rule"]},{"id":"med-13","type":"sort","theme":"Dual view: blue team and red team on one finding","summary":"Pentest finding on the booking site — what you detect, and what the attacker tries next","scenario":[{"label":"Artefact 1 — Pentest report, booking site, finding 3","kind":"text","text":"Injection in the search parameter (OWASP Top 10 A03). Rating: high. The tester proved it with a harmless proof-of-concept string and warns that the same input reaches the reporting query, which reads files as the web service account."}],"question":"Drag each item into the team that would do it.","bins":["Blue team — what you detect","Red team — what the attacker does next"],"items":[{"t":"Watch for a spike of 500 errors and long database response times","bin":0},{"t":"Alert when one session sends thousands of requests in a minute","bin":0},{"t":"Baseline the normal response size and flag unusually large replies","bin":0},{"t":"Send a harmless proof-of-concept string and watch the reply","bin":1},{"t":"Encode the payload so the input filter no longer matches it","bin":1},{"t":"Reuse a valid session to reach the admin page without logging in","bin":1}],"hint":"Blue items produce evidence after the fact. Red items change what the attacker sends or uses.","explain":"The blue column is about visibility. Error rates, slow queries, request volume and response size all change when somebody abuses an injection flaw. Each of those signals can be alerted on before data leaves. The red column is about the next move. A proof of concept proves the flaw is real. Encoding defeats a naive filter. A reused session turns a small bug into account takeover. Reading the same finding from both sides makes the virtual patch rule and the detection rule better. Both are then written against a real attacker step, not a guess.","study":"Take any finding and write two lines: what would I see, and what would the attacker do next?","keys":["OWASP Top 10","Exploitability, proof of concept and weaponized exploit","Virtual patching and WAF rule","Penetration test, red team and bug bounty","Intrusive and non-intrusive scan","Vulnerability chaining"]},{"id":"med-14","type":"order","theme":"Verify stage and proof","summary":"Ticket VULN-3110 — the fix is deployed, now order the proof","scenario":[{"label":"Artefact 1 — Ticket VULN-3110","kind":"kv","rows":[["Finding","outdated TLS library on pay-api-03, CVSS 7.4"],["Change","CHG-2988 deployed the patched package last night"],["Rule","the ticket may only be closed with evidence attached"]]}],"question":"Order the five steps that close this ticket.","items":["Rescan pay-api-03 with credentials using the same policy as the original scan","Compare the installed package version with the fixed version in the vendor note","Re-test the compensating control to see whether it is still needed","Attach the scan export and the version output to the ticket","Close the finding and update the risk register entry"],"hint":"Proof comes from a second measurement, not from the change record.","explain":"Verification is a measurement, not a promise. The rescan must use the same authenticated policy as the first scan, otherwise you compare two different things. The version check then answers the direct question: is the patched package really installed? The compensating control is re-tested so that it can be removed if it is no longer needed, or kept with a written reason. Finally the evidence is attached and the register is updated, so the next analyst can see why the finding is closed. Closing before the rescan is the most common mistake, and it lets a failed change look like a fixed finding.","study":"Verify means: measure again with the same method, compare versions, re-test the workaround, attach the proof, update the record.","keys":["Verify","Rescan and regression test","Authenticated (credentialed) scan","Compensating control","Risk register","NVD and vendor advisories"]},{"id":"med-15","type":"fill","theme":"Patch management policy","summary":"Patch standard v4 — five words missing before the board can ratify it","scenario":[{"label":"Artefact 1 — Auditor note on patch standard v3","kind":"text","text":"The old standard never said where a patch is tested first, when it may reach production, how it is undone, and which path a critical flaw takes. Five words are missing from v4."}],"question":"Complete the patch standard with the five missing words.","parts":["Every patch is first deployed to the ","{{}}"," ring. Production changes happen inside the monthly ","{{}}",". A ","{{}}"," plan is written before the change. A flaw that is being exploited follows the ","{{}}"," path, and the vendor release day, ","{{}}",", is treated as a planning date and not as a deadline."],"answers":["pilot","maintenance window","rollback","emergency change","Patch Tuesday"],"bank":["backlog","rollback","Patch Tuesday","pilot","coverage","maintenance window","freeze","emergency change","exception","escalation"],"hint":"One word is a small test group, one is a time slot, one undoes a change, one is a fast path, one is a day of the week.","explain":"A patch programme works because it has four habits. It tests on a small group first, the pilot ring. It changes production in a fixed slot, the maintenance window. It writes a way back, the rollback plan. It keeps a short fast path for danger, the emergency change. Patch Tuesday is the day many vendors publish fixes. The old standard treated that day as a deadline, and it is not one. The deadline comes from the risk of the flaw in your own estate. So a fix published on Tuesday is tested before it reaches a production ring.","study":"Patch flow: test ring, approved window, rollback ready, emergency path for exploited flaws, and a deadline driven by risk.","keys":["Patch management","Patch Tuesday and vendor release cycle","Patch testing and staged rollout","Maintenance window","Rollback plan","Emergency change and the change advisory board","Remediate or mitigate"]},{"id":"med-16","type":"match","theme":"Frameworks and standards","summary":"Audit evidence map — pair each standard with the duty it creates","scenario":[{"label":"Artefact 1 — Audit request list","kind":"text","text":"The external auditor asked which document creates each duty. Pair every standard with its purpose."}],"question":"Pair each standard with the duty it creates.","pairs":[["NIST SP 800-40","How to run a patch and vulnerability management programme"],["NIST SP 800-115","How to plan and perform technical security assessments"],["ISO/IEC 27001 A.8.8","Find technical vulnerabilities and evaluate the exposure"],["PCI DSS requirement 11","Scan the network internally and externally on a schedule"],["CIS Benchmarks","Consensus hardening settings for each platform"],["CWE Top 25","The most dangerous classes of software weakness"]],"hint":"Two are NIST documents, one is a management standard, one is a payment rule, one is a hardening list, one is a weakness list.","explain":"Each document answers a different question. NIST SP 800-40 tells you how to run a patch and vulnerability management programme. NIST SP 800-115 tells you how to plan and perform the testing itself. ISO/IEC 27001 A.8.8 is the management-system duty: know your technical vulnerabilities and judge the exposure. PCI DSS requirement 11 is the payment card rule with its internal and external scan schedule. CIS Benchmarks give the concrete hardening settings per platform, which is a configuration change rather than a scan. The CWE Top 25 lists weakness classes, which is what you look for in code and in design.","study":"Keep one line per document: 800-40 programme, 800-115 testing, 27001 duty, PCI schedule, CIS settings, CWE weakness classes.","keys":["NIST SP 800-40 patch management","NIST SP 800-115 technical testing","ISO/IEC 27001 A.8.8 technical vulnerabilities","PCI DSS requirements 6 and 11","CIS Benchmarks","CVE and CWE","Configuration change and hardening","Internal and external scan"]},{"id":"med-17","type":"logq","theme":"Patch deployment failure","summary":"Deployment KB5034123 — four hosts did not take the patch, read the job log","scenario":[{"label":"Artefact 1 — Patch job, ring 2, KB5034123","kind":"log","lines":[{"t":"23:10:02","s":"ansible","m":"ring 2 start, 64 hosts, task install KB5034123"},{"t":"23:14:55","s":"ansible","m":"app-07 failed: pending reboot blocks the installer"},{"t":"23:15:01","s":"ansible","m":"app-08 failed: pending reboot blocks the installer"},{"t":"23:18:20","s":"ansible","m":"db-04 failed: only 1.1 GB free on C:, the package needs 6 GB"},{"t":"23:19:44","s":"ansible","m":"file-11 unreachable: host offline"},{"t":"23:22:00","s":"ansible","m":"job end: 60 changed, 3 failed, 1 unreachable"}]}],"question":"It is 07:40 and the change window is over. What is the correct next step?","options":["Reboot both hosts, free space on db-04, then rescan before the report","Rerun the same job tonight and include file-11 in the same ring","Mark the four hosts as patched in the register with an explanatory note","Raise the severity of the finding and wait for the next patch release"],"answer":0,"hint":"Every failure line names its own cause. Fix the cause, not the symptom.","explain":"The log names three different causes and one missing host. Two hosts have a restart pending, which blocks the installer. They need the reboot, and then the patch again. One host is out of disk space, and no rerun can fix that. One host was simply offline. Repeating the same job tonight would fail for the same reasons. Marking the hosts as patched would put false data into the register. The right move is to remove each cause, deploy again, and rescan to prove the state.","study":"Read a deployment log line by line: the failure string tells you the fix, and the failed set always needs a rescan.","keys":["Patch management","Patch testing and staged rollout","Rollback plan","Rescan and regression test","Verify","Remediate or mitigate","Metrics and KPIs"]},{"id":"med-18","type":"spot","theme":"Spot the mistake in a priority decision","summary":"The board pack ranks two chainable findings as low — find the wrong line","scenario":[{"label":"Artefact 1 — Board pack, section 3, top findings","kind":"code","lines":["1. web-srv-01  CVE-2024-1111  CVSS 9.8  plugin: fix available now","2. web-srv-01  CVE-2024-2222  CVSS 5.3  plugin: information leak","3. db-srv-02   CVE-2024-3333  CVSS 6.1  plugin: local attacker only","4. ws-114      CVE-2024-4444  CVSS 7.2  plugin: needs a user to open a file"]},{"label":"Artefact 2 — Analyst notes on the same ticket","kind":"log","lines":[{"t":"note","s":"vm","m":"finding 2 is rated low because 5.3 is under our 7.0 threshold"},{"t":"note","s":"vm","m":"the search service on web-srv-01 reads files as root and finding 2 reaches it"},{"t":"note","s":"vm","m":"no patch for finding 1 yet, exploit code is public: temporal E:H"},{"t":"note","s":"vm","m":"web-srv-01 faces the internet and holds card data: environmental MAV:N CR:H"}]}],"question":"Which line of the pack makes the ranking wrong?","options":["Line 1: a 9.8 finding needs no fix while the plugin shows one available","Line 3: a 6.1 finding must always be fixed before a 7.2 finding","Line 4: a 7.2 finding is never urgent because a user must act first","Line 2: the low finding is the step that reaches a root-run service"],"answer":3,"hint":"Read the analyst notes. Two findings on one host can add up to something that neither one is alone.","explain":"A base score describes one flaw on its own. Finding 2 looks small by itself. But the analyst note says it is the step that reaches the search service. That service reads files as root, on the same host where a 9.8 already exists. Together they form a chain that ends in full control of the host. So a 5.3 must not be parked under a threshold. The other options turn rules of thumb into absolute laws, which is just as wrong. A threshold is a filter, not a decision. Any finding that completes a chain is judged by the chain.","study":"Before you park a low finding, ask whether it is a step in a chain, whether exploit code exists, and what the host is worth.","keys":["Vulnerability chaining","CVSS base score","CVSS temporal score","CVSS environmental score","Analyze and prioritize","Industry and organizational impact","Data classification","Exploitability, proof of concept and weaponized exploit"]},{"id":"med-19","type":"sort","theme":"Special handling and asset criticality","summary":"Scan plan for six very different assets — choose how each one may be scanned","scenario":[{"label":"Artefact 1 — Scan plan request, this week","kind":"text","text":"The team must cover six assets. The plan must choose a handling tier for each one, based on what the asset does and what happens if it stops."}],"question":"Drag each asset into the handling tier it needs.","bins":["Credentialed scan in business hours","Maintenance window, safe checks on","No active scan: passive monitoring only"],"items":[{"t":"Internal build VM on the dev VLAN with no data on it","bin":0},{"t":"Public web front end that serves only static pages","bin":0},{"t":"Production ERP database that holds payroll records","bin":1},{"t":"Legacy file server that must not restart before the audit","bin":1},{"t":"MRI scanner on the clinical network","bin":2},{"t":"Plant controller that runs the filling line","bin":2}],"hint":"Three questions for each asset: how bad is a false step, who depends on it, and can it survive a real check?","explain":"The handling tier follows the asset, not the scanner. A dev VM and a static web front end can take a credentialed scan during the day. A slow response there costs nothing. The ERP database and the legacy file server hold critical data or must stay up. They are scanned in a maintenance window with safe checks on. The MRI scanner and the plant controller are special cases. An active scan can stop a medical device or a production line. So the team watches their traffic passively and asks the vendor before any active test.","study":"Match the scan method to the asset's tolerance: routine for lab systems, a window for production, passive for fragile devices.","keys":["Special handling: ICS and OT, medical devices, legacy systems","Safe checks","Scan window and scheduling","Active and passive scanning","Asset inventory and asset criticality","Data classification","Performance impact","Intrusive and non-intrusive scan"]},{"id":"med-20","type":"mcq","theme":"End-of-life system","summary":"The vendor stopped supporting the reporting database six months ago","scenario":[{"label":"Artefact 1 — Asset review note","kind":"kv","rows":[["Asset","report-db-01, finance reporting, holds three years of records"],["Vendor","support ended last November, last security fix the month before"],["Plan","the finance team moves to a new platform next year"],["Findings","four unpatched flaws, two of them rated high"]]}],"question":"What is the correct way to handle this risk?","options":["Install the unofficial community build that carries the old fixes","Keep the system reachable from the internet until the new platform is ready","Compensating controls plus a documented exception with a retirement date","No action: an unsupported system cannot be scanned or fixed at all"],"answer":2,"hint":"No vendor fix does not mean no action. Ask what lowers the risk and who signs for what is left.","explain":"End of support removes the easy answer, not every answer. The system still runs, holds data and has findings. So the organisation lowers the risk with compensating controls. Examples are segmentation, a strict firewall rule, no internet access and extra monitoring. Then it records an exception with a retirement date tied to the migration. The owner signs for the residual risk. Doing nothing is not a control and cannot be defended in an audit. An unofficial build is untested code of unknown origin. Internet exposure would turn a medium risk into a critical one.","study":"For an unsupported system: segment it, restrict it, watch it, document the exception, and put a retirement date on it.","keys":["Unsupported, legacy and end-of-life software","Decommissioning","Compensating control","Network segmentation and ACL","Exception and waiver","Risk acceptance sign-off","Asset inventory and asset criticality"]},{"id":"med-21","type":"fill","theme":"Reporting metrics","summary":"Quarterly vulnerability report — four measures missing from the summary","scenario":[{"label":"Artefact 1 — Draft, first paragraph for the CISO","kind":"text","text":"The CISO wants four numbers in the opening paragraph. The draft has the numbers but lost the words that explain them."}],"question":"Complete the report summary with the four missing words.","parts":["In Q3 the team closed 412 findings. The average time to remediate, or ","{{}}",", fell from 31 to 19 days. High findings were closed inside the 30-day ","{{}}"," in 94 per cent of cases. Scan ","{{}}"," reached 98 per cent of the estate. One old item is covered by a time-limited ","{{}}"," on a plant controller."],"answers":["MTTR","SLA","coverage","exception"],"bank":["EPSS","coverage","MTTR","backlog","SLA","freeze","exception","CVSS"],"hint":"One is an average time, one is a promise with a deadline, one is how much of the estate you can see, one is a signed paper.","explain":"A management report needs measures a manager can act on. MTTR is the average time from finding to fix. A fall from 31 to 19 days shows the programme is getting faster. The SLA is the promise the team made for each severity band. So 94 per cent inside 30 days is the compliance figure. Coverage shows how much of the estate the scanner can see. It protects against false comfort, because 98 per cent coverage means 2 per cent was never measured. The exception explains the one old item, and naming it stops the reader from thinking the team forgot it.","study":"Know the four reporting measures: speed (MTTR), promise (SLA), visibility (coverage), and forgiven risk (exception).","keys":["Mean time to remediate (MTTR)","Remediation SLA and deadline","Metrics and KPIs","Exception and waiver","Report","Vulnerability aging","Executive and board reporting"]},{"id":"med-22","type":"sort","theme":"Where findings come from","summary":"New finding intake — six sources, which ones can become findings today?","scenario":[{"label":"Artefact 1 — Intake queue, 08:00","kind":"text","text":"Six items arrived overnight. Some can be opened as findings with a deadline straight away. Others must be corroborated first."}],"question":"Drag each source into the right column.","bins":["Accepted source: open a finding","Needs corroboration first"],"items":[{"t":"The NVD entry for the CVE that the scanner reported","bin":0},{"t":"The vendor security advisory for the product you run","bin":0},{"t":"A CISA KEV catalog addition for a flaw you already track","bin":0},{"t":"A bug bounty report that includes a working proof of concept","bin":0},{"t":"A criminal forum post offering an exploit for sale","bin":1},{"t":"A social network screenshot about a breach at a competitor","bin":1}],"hint":"Ask who is accountable for the statement: a national body, the vendor, a reporter with steps, or an anonymous seller.","explain":"A finding needs a source that can be checked and quoted in an audit. The NVD and the vendor advisory describe the flaw and the fixed version. The CISA KEV catalog adds that it is exploited in real attacks. A bug bounty report arrives with steps to reproduce it, so the team can confirm it. Forum posts and social media screenshots are threat intelligence. They can tell you where to look, but they must be corroborated first. Treating a rumour as fact wastes a week. Ignoring a rumour throws away an early warning.","study":"Accepted sources are attributable and checkable. Everything else is a lead, not a finding.","keys":["NVD and vendor advisories","CVE and CWE","CISA KEV catalog","Penetration test, red team and bug bounty","Threat intelligence and dark web","Analyze and prioritize","Identify"]},{"id":"med-23","type":"spot","theme":"Spot the mistake in the scope","summary":"The scan that left the authorised range — find the line that breaks the rules","scenario":[{"label":"Artefact 1 — Change CHG-3310, scan authorisation","kind":"code","lines":["authorised range : 10[.]60[.]12[.]0/24 and 10[.]60[.]13[.]0/24","window           : Saturday 22:00 to Sunday 04:00","excluded hosts   : plc-fill-01, mri-02","checks allowed   : safe checks only, no denial of service plugins","operator command : nmap -sV -p- 10[.]60[.]0[.]0/16"]}],"question":"Which line of the authorisation must be corrected before the scan runs?","options":["The check set: safe checks slow a scan down and should be removed","The operator command: the /16 sweeps outside the two /24 ranges","The window: a Saturday night is not allowed for a range of this size","The excluded hosts: a scan never needs an exclusion list at all"],"answer":1,"hint":"Compare the size of the range in the command with the size of the ranges that were authorised.","explain":"The change authorises two /24 ranges. The command points at a /16, which is two hundred and fifty-six times larger. It would sweep thousands of hosts that nobody approved, and each one belongs to another owner. Unauthorised scanning is not a technical accident. It is a policy breach that can break a service or a contract. The other three lines are right. A large scan at the weekend is normal for a maintenance window. An exclusion list protects fragile devices. Safe checks are what a change record should demand.","study":"Read the command in an authorisation against the range it names. One wrong octet is thousands of hosts.","keys":["Scan scope and authorization","Scan window and scheduling","Safe checks","Special handling: ICS and OT, medical devices, legacy systems","Internal and external scan","Intrusive and non-intrusive scan"]},{"id":"med-24","type":"branch","theme":"Branching case: zero-day disclosure","summary":"A researcher reports a critical flaw in the customer portal and asks for credit","scenario":[{"label":"Artefact 1 — Mail to security@, 08:11","kind":"log","lines":[{"t":"08:11","s":"mail","m":"I found an authentication bypass in your customer portal"},{"t":"08:11","s":"mail","m":"proof attached, I plan to publish in 90 days and to ask for a CVE"},{"t":"08:11","s":"mail","m":"please tell me whether your bug bounty covers this report"}]}],"question":"This case is a chain of disclosure decisions. Each step has one question, and the next step depends on what you chose before.","steps":[{"title":"First response","question":"What is the correct first response to this report?","options":["Forward the mail to the marketing team for a public statement","Acknowledge it, open a restricted ticket, reproduce it, agree a date","Ask the researcher to delete the proof and say nothing until it is fixed","Publish the report so customers can protect themselves this week"],"answer":1,"explain":"A coordinated disclosure starts with contact. Acknowledge the report, move it into a restricted ticket so the details do not spread, reproduce it, then agree the timeline and the credit in writing. Deleting the proof loses the evidence and insults the reporter. Publishing before a fix exists turns a private report into a public weapon. Marketing has no role until a fix is ready and credit is agreed."},{"title":"Six weeks without a fix","scenario":[{"label":"Artefact 1 — Portal team update, day 4","kind":"log","lines":[{"t":"day 4","s":"dev","m":"the vendor needs six weeks to ship the corrected component"},{"t":"day 4","s":"soc","m":"no attempt against the bypass path seen in the portal logs so far"}]}],"question":"The vendor needs six weeks. What do you do in the meantime?","options":["Add a compensating control in front of the service and watch the pattern","Close the ticket as accepted risk until the vendor patch finally arrives","Turn the portal off for six weeks and explain the reason to customers","Buy a second penetration test to look for other flaws in the portal"],"answer":0,"explain":"A zero-day with no fix is a containment problem. A compensating control, such as a virtual patch rule, an extra authentication check or a narrower network rule, lowers the chance of use, and monitoring gives warning if somebody tries. Closing the ticket hides a live risk. Taking the portal down for six weeks is a large business cost that a temporary control can avoid. Another test may find other flaws, but it protects nothing today."},{"title":"After the fix","question":"The vendor patch is installed and verified. What finishes the process?","options":["Close the ticket quietly, because public attention attracts more attackers","Ask the reporter to sign a non-disclosure agreement before any credit","Report the researcher to the authorities for testing the live service","Confirm the fix with the reporter, request a CVE, and publish the credit"],"answer":3,"explain":"Coordinated disclosure ends when both sides agree it ends: the fix is verified, the reporter confirms it, a CVE identifier is requested so other users can track the flaw, and credit is published if the reporter wants it. Silence breaks the agreement and pushes the next reporter to go public first. An NDA before credit contradicts the deal you already made, and the disclosure policy usually offers safe harbor for good-faith research. Reporting the researcher punishes the person who did the right thing and ends the flow of future reports."}],"hint":"Think about what keeps the details private, what protects users while no fix exists, and what closes the loop with the reporter.","explain":"The disclosure path protects three things at once: the users, the company and the relationship with the reporter. You acknowledge and control the information, you lower the risk while no fix exists, and you finish with a verified fix, a CVE identifier and credit. Each step has a tempting shortcut, such as silence, an accepted-risk ticket or a quiet close, and each shortcut costs more later than it saves now.","study":"Know the disclosure steps: acknowledge, restrict, reproduce, mitigate, fix, verify, request the CVE, credit the reporter.","keys":["Responsible and coordinated disclosure","Vulnerability disclosure policy and safe harbor","CVE assignment","Compensating control","Virtual patching and WAF rule","Verify","Penetration test, red team and bug bounty","Actively exploited, zero-day and n-day"]},{"id":"med-25","type":"match","theme":"Control types and timing","summary":"Control register review — pair each control with its type","scenario":[{"label":"Artefact 1 — Control register, extract","kind":"text","text":"The register lists six controls without their categories. Pair each control with the type it belongs to."}],"question":"Pair each control with its type.","pairs":[["A WAF rule that blocks the attack pattern","Technical control, compensating"],["A quarterly access review by the line manager","Administrative control, preventive"],["A locked rack with a badge reader","Physical control, preventive"],["A nightly scan that reports new findings","Technical control, detective"],["A written rule that critical patches ship in 7 days","Administrative control, directive"],["A restore of the service from last night's backup","Technical control, corrective"]],"hint":"First decide what the control is made of: a machine, a document, or a building. Then decide when it acts.","explain":"Controls are grouped by what they are made of and by when they act. A WAF rule is technical and it compensates for a flaw that is not fixed yet. An access review is administrative and prevents an old account from being used. A badge reader is a physical control that stops a person at the door. A nightly scan is technical and detective, because it produces evidence instead of blocking anything. A written seven-day rule is administrative and directive: it tells people what to do. A restore is technical and corrective, because it repairs damage after the event. Defence in depth needs all of these at once, because each type fails in a different way.","study":"Label every control twice: what it is made of (technical, administrative, physical) and when it acts (preventive, detective, corrective).","keys":["Security controls: technical, administrative, physical","Compensating control","Defense in depth","Virtual patching and WAF rule","Active and passive scanning","Mitigating control"]},{"id":"med-26","type":"logq","theme":"Compliance scanning versus security scanning","summary":"ASV report and a missing internal scan — read the compliance note","scenario":[{"label":"Artefact 1 — Quarterly ASV scan, report 2024-Q3","kind":"log","lines":[{"t":"09:10","s":"asv","m":"external scan of 14 internet-facing addresses completed"},{"t":"09:10","s":"asv","m":"2 findings: TLS 1.0 enabled on pay-gw-01 (high), missing HSTS (low)"},{"t":"09:10","s":"asv","m":"result FAIL: a clean rescan is required inside the allowed period"}]},{"label":"Artefact 2 — Internal audit note, same week","kind":"log","lines":[{"t":"11:40","s":"audit","m":"no evidence of the quarterly internal vulnerability scan for Q2 or Q3"},{"t":"11:41","s":"audit","m":"the last authenticated internal scan ran 11 months ago"}]}],"question":"What must the team do to satisfy the standard and to be genuinely safer?","options":["Fix the TLS finding, book the rescan, and restart the internal scans","Dispute both findings as false positives and request a later ASV scan date","Run one external scan next year and keep the internal scanning as it is","Move the payment gateway behind the firewall so the ASV has nothing to scan"],"answer":0,"hint":"The external report fails, but the audit note describes a second and different gap.","explain":"Two duties are in play, and they are not the same duty. The external quarterly scan by an approved vendor is a compliance duty. A failed report must be fixed and rescanned inside the allowed period. The internal quarterly scan is a security duty. It looks inside the network with credentials, where most real findings live. The audit note shows that duty was missed for two quarters. So the team is both non-compliant and blind. Disputing a real finding wastes the window. Hiding the gateway removes a service the business needs, and the internal duty stays exactly where it was.","study":"Compliance scanning proves a standard is met. Security scanning finds the risk. A programme needs both, on their own schedules.","keys":["Compliance scan and PCI ASV quarterly external scan","PCI DSS requirements 6 and 11","Internal and external scan","Authenticated (credentialed) scan","False positive, false negative, true positive, true negative","Report"]},{"id":"med-27","type":"order","theme":"Queue ranking by SLA and aging","summary":"Monday queue, five tickets, one analyst — rank by what the deadlines say","scenario":[{"label":"Artefact 1 — Open queue, 07:55 (SLA: critical 7 days, high 30 days, medium 90 days)","kind":"code","lines":["VM-5501 critical  opened 8 days ago   KEV listed     internet-facing","VM-5502 high      opened 47 days ago  public PoC     internal","VM-5503 medium    opened 121 days ago no exploit     internal","VM-5504 critical  opened 3 days ago   no known exploit internal","VM-5505 high      opened 8 days ago   no exploit     internet-facing"]}],"question":"Rank the tickets in the order they must be worked today, most urgent first.","items":["VM-5501 — critical, 8 days old, past its 7-day SLA, KEV listed, internet-facing","VM-5502 — high, 47 days old, past its 30-day SLA, public exploit code","VM-5504 — critical, 3 days old, four days of slack left, no known exploit","VM-5505 — high, 8 days old, inside its SLA, internet-facing, no exploit","VM-5503 — medium, 121 days old, past its 90-day SLA, internal, no exploit"],"hint":"Work out the days left for every ticket, then ask which ones are already late.","explain":"The queue is decided by two questions: is it already late, and how much time is left? VM-5501 comes first because it is late and listed as exploited in the wild on an internet-facing host, so it is both a live risk and a breach. VM-5502 follows, seventeen days past its own deadline with public exploit code. VM-5504 is next: a critical finding with only four days left before its deadline. VM-5505 is inside its window and has no known exploit, so it waits even though it faces the internet. VM-5503 is late but medium, internal and without an exploit, so it is worked after the critical items. Compute the remaining days before you decide what feels worst, and remember that aging is a measure of how long the organisation has carried a known risk.","study":"Pair severity with the clock: days left, days late, exploit status, exposure. That is a queue, not a feeling.","keys":["Remediation SLA and deadline","Vulnerability aging","Mean time to remediate (MTTR)","Analyze and prioritize","CISA KEV catalog","Exploitability, proof of concept and weaponized exploit","Internal and external scan","Metrics and KPIs"]},{"id":"med-28","type":"sort","theme":"Vulnerability response versus incident response","summary":"Two teams, one list — separate the routine programme work from the live case","scenario":[{"label":"Artefact 1 — Joint stand-up list, 09:00","kind":"text","text":"The vulnerability team and the incident response team share one board. Separate the programme work from the live case."}],"question":"Drag each item onto the team that owns it.","bins":["Vulnerability management","Incident response"],"items":[{"t":"Track a finding until a rescan proves that it is fixed","bin":0},{"t":"Report the aging and coverage figures every month","bin":0},{"t":"Rate a new CVE against the estate and set a deadline","bin":0},{"t":"Preserve the disk image and keep the chain of custody","bin":1},{"t":"Contain the host that is beaconing to a known command server","bin":1},{"t":"Eradicate the implant and recover the service from backup","bin":1}],"hint":"One column measures and schedules risk. The other one is happening right now.","explain":"The two jobs share a vocabulary, which is why people mix them up. Vulnerability management is a programme: it finds, rates, schedules and verifies weaknesses, and most of its work happens before any attacker appears. Incident response starts when a weakness is used, and it contains hosts, preserves evidence with a chain of custody, removes implants and recovers services. A finding can become an incident when exploitation is suspected, and an incident always creates findings, so the teams hand work to each other. Keeping the two lists apart keeps the response clock and the remediation clock honest.","study":"Programme work is planned and repeatable. Incident work is urgent and evidence-bound. Know which clock you are on.","keys":["Vulnerability response versus incident response","Verify","Metrics and KPIs","Vulnerability aging","Analyze and prioritize","Remediation SLA and deadline","Report"]},{"id":"med-29","type":"fill","theme":"Virtual patching","summary":"Rule VP-88 is missing five fields and the change window closes in an hour","scenario":[{"label":"Artefact 1 — Draft rule and the note from the reviewer","kind":"code","lines":["SecRule ARGS \"@contains ../../\" \"id:9001,phase:2,deny,status:403\"","reviewer note: this blocks one exact string in one place only","reviewer note: it must not lock out normal customers"]}],"question":"Complete the rule description with the five missing words.","parts":["A ","{{}}"," patch closes the attack path while the vendor fix is still in test. This rule inspects the request ","{{}}",". When the pattern matches, the action is to ","{{}}"," the request. The rule must be written narrowly so that it does not create a false ","{{}}",", and every match is logged to the WAF ","{{}}"," for the detection team."],"answers":["virtual","URI","block","positive","index"],"bank":["index","virtual","quarantine","URI","segment","block","backlog","positive"],"hint":"One word means the patch is not a real code change. One names the part of the request. One is the action. One is a wrong alert. One is where the logs land.","explain":"A virtual patch is a rule in front of the application. It closes the attack path while no code change is possible. It inspects the request URI and its arguments, then blocks the request when the pattern matches. Precision is the hard part. A rule that is too broad blocks normal customers, and the business reports that as a false positive. A rule that is switched off protects nobody. That is why every match is logged to an index the detection team can search. Virtual patching buys time. It never replaces the real fix.","study":"A virtual patch is a compensating control: narrow pattern, blocking action, logged matches, and a date when the real patch lands.","keys":["Virtual patching and WAF rule","Compensating control","Mitigating control","False positive, false negative, true positive, true negative","Remediate or mitigate","Configuration change and hardening"]},{"id":"med-30","type":"multi","theme":"Compensating controls for an unpatchable device","summary":"The filling line controller has no update path until the plant is rebuilt","scenario":[{"label":"Artefact 1 — Plant asset note, plc-fill-01","kind":"kv","rows":[["Asset","plc-fill-01, controls the filling line, 12 years old"],["Vendor","firmware frozen, no security updates, replacement in 14 months"],["Constraint","the line runs 16 hours a day, a stop costs about 40 000 per hour"],["Findings","three known flaws, remote configuration without authentication"]]}],"question":"Which three controls genuinely reduce this risk? (Select three.)","options":["Run a weekly intrusive scan of the controller to catch new flaws","Give the controller internet access so the vendor can support it faster","Add a firewall rule that only the historian may reach the controller","Copy the plant traffic to a passive sensor and alert on new talkers","Turn off the unused web and telnet services on the controller"],"answer":[2,3,4],"hint":"Three of these lower the exposure without touching the running line. Two of them would make the plant less safe.","explain":"An unpatchable device is protected by what surrounds it. A strict firewall rule that allows only the one system that must talk to the controller removes every other path, which is network segmentation in its smallest form. A passive sensor copies traffic and alerts when a new device starts a conversation, without sending a single packet to the controller. Disabling the unused web and telnet services is a configuration change that removes two doors nobody needs. An intrusive scan can stop a fragile controller, which is why active testing on a live line needs vendor approval and a maintenance window. Internet access would expose the whole plant to make support slightly easier.","study":"For a device that cannot be patched: restrict who can reach it, watch what talks to it, switch off what it does not need.","keys":["Special handling: ICS and OT, medical devices, legacy systems","Compensating control","Network segmentation and ACL","Disable unnecessary services","Active and passive scanning","Intrusive and non-intrusive scan","Safe checks","Mitigating control","Unsupported, legacy and end-of-life software","Configuration change and hardening"]},{"id":"med-31","type":"mcq","theme":"Unknown asset on the network","summary":"The scan found a host that nobody owns — what happens first","scenario":[{"label":"Artefact 1 — Discovery scan and inventory lookup","kind":"log","lines":[{"t":"02:15:40","s":"scanner","m":"new host 10[.]70[.]4[.]88, ports 22, 80, 3306, hostname wiki-plant"},{"t":"02:15:41","s":"scanner","m":"host is not in the CMDB and not in the authorised scan scope"},{"t":"09:02:00","s":"cmdb","m":"no owner found for 10[.]70[.]4[.]88"}]}],"question":"What is the correct first step?","options":["Find the owner and the purpose, then agree how the host may be assessed","Scan the host at once with the full intrusive profile to see what it runs","Block the host at the switch and close the finding as an unknown device","Add the host to the CMDB as plant equipment and close the ticket today"],"answer":0,"hint":"An unowned host is an information problem before it is a technical problem.","explain":"The host is not in the inventory and not in the authorised scope. So nobody has agreed to test it. The first job is to find out who owns it and what it does. A factory wiki may be critical to the line, and it may hold production data. Only then can the team agree a safe way to assess it. Scanning it intrusively without an agreement can break a service. It is also an unauthorised test. Blocking it first can stop a business service. Registering it as plant equipment invents a fact and corrupts the inventory.","study":"Shadow IT is closed with three moves: find the owner, bring the host into the inventory, then assess it with permission.","keys":["Shadow IT","Asset inventory and asset criticality","Scan scope and authorization","Attack surface (external, internal, physical)","Discovery scan","Intrusive and non-intrusive scan","Identify"]},{"id":"med-32","type":"terminal","theme":"Reading a scan export","summary":"Task 31 — count the critical findings in the export before the stand-up","scenario":[{"label":"Artefact 1 — /evidence/scan-q3.csv (first lines)","kind":"code","lines":["host,plugin,severity,port,title","erp-db-01,38795,CRITICAL,5433,old PostgreSQL version","erp-web-02,51192,MEDIUM,443,certificate expires soon","vpn-edge-01,71049,CRITICAL,443,command injection","hr-portal,42873,LOW,80,server banner leak","fin-files-02,90211,CRITICAL,445,missing SMB signing"]}],"question":"Type one command that prints the number of CRITICAL lines in /evidence/scan-q3.csv.","prompt":"analyst@soc-ws-03:~$","env":"Use a text-search command that counts matching lines. The export sits in /evidence.","syntax":{"shape":"grep -c <pattern> <file>","opts":[["-c","count the matching lines instead of printing them"],["-i","ignore upper and lower case"],["-r","search inside a directory tree"]],"example":"grep -c MEDIUM /evidence/scan-q2.csv"},"canonical":"grep -c CRITICAL /evidence/scan-q3.csv","tool":"grep","flags":["c"],"allowFlags":["i","n","E","w"],"argsAny":["critical"],"target":"/evidence/scan-q3.csv","termIntro":["Shell on analyst-ws-03. The export is in /evidence.","Type the command, then press Run command."],"termOut":["3"],"sampleOut":["3"],"parts":[["grep","searches a file line by line"],["-c","prints only the number of matching lines"],["CRITICAL","the exact severity word used in the export"],["/evidence/scan-q3.csv","the file to read"]],"hint":"You want a count, not a list. The counting option of grep saves you a second command.","explain":"grep reads a file line by line and prints the lines that match. The -c option changes the output from the matching lines to a single number, which is exactly what a stand-up needs. The pattern is the severity word as it is written in the export, and the file path comes last. Counting is the first step of triage: three critical findings in one export tells the team how much work the week holds. The same trick works for any severity word, host name or plugin number, so it is worth remembering before the next stand-up.","study":"Learn the counting habit: filter first, then count, then look at the few lines that matter.","keys":["Metrics and KPIs","Report","Analyze and prioritize","Executive and board reporting","Mean time to remediate (MTTR)"]},{"id":"med-33","type":"sort","theme":"Threat modeling methods","summary":"Design review card — put each item under the method it belongs to","scenario":[{"label":"Artefact 1 — Design review cards","kind":"text","text":"The architecture team runs a threat modeling session. Each card must go under STRIDE, PASTA or DREAD."}],"question":"Drag each card under the method it belongs to.","bins":["STRIDE","PASTA","DREAD"],"items":[{"t":"Spoofing another user's identity","bin":0},{"t":"Tampering with data while it is in transit","bin":0},{"t":"Repudiation: denying that an action ever happened","bin":0},{"t":"Elevation of privilege up to administrator","bin":0},{"t":"Damage, reproducibility, exploitability, affected users, discoverability","bin":2},{"t":"Ranks a named threat with five simple questions","bin":2},{"t":"A seven-stage, attacker-centric process that starts from business objectives","bin":1}],"hint":"One method is a checklist of single words, one is a scoring model with five letters, one is a process with seven stages.","explain":"Threat modeling finds design problems before code exists. STRIDE is a checklist of six threat types. They are spoofing, tampering, repudiation, information disclosure, denial of service and elevation of privilege. Four cards belong there. DREAD scores a threat that has already been named. It uses damage, reproducibility, exploitability, affected users and discoverability. So it is a ranking tool, not a checklist. PASTA is the process. Its seven stages start from business objectives and end with a test plan, which is why the business can follow it.","study":"STRIDE names threats, DREAD ranks them, PASTA organises the whole review around business objectives.","keys":["Threat modeling: STRIDE, PASTA, DREAD","Analyze and prioritize","Industry and organizational impact"]},{"id":"med-34","type":"fill","theme":"Risk appetite, attack surface and defense in depth","summary":"Security strategy paper — five keywords missing from the opening paragraph","scenario":[{"label":"Artefact 1 — Draft strategy paper, section 1","kind":"text","text":"The paper opens with the board's risk position, the three surfaces the programme must cover, and one promise about how the controls are stacked. The risk tolerance for internal tooling is higher than for customer systems."}],"question":"Complete the strategy paragraph with the five missing words.","parts":["The board has set a low risk ","{{}}"," for patient-facing systems, so a critical finding there is never accepted. The ","{{}}"," attack surface is the internet-facing range, the ","{{}}"," surface is the clinical network, and the ","{{}}"," surface covers the data-centre doors and the badge readers. Because no single control works alone, the paper also promises defence in ","{{}}","."],"answers":["appetite","external","internal","physical","depth"],"bank":["internal","governance","appetite","depth","hybrid","external","offset","physical","transfer"],"hint":"One word is how much risk the board will carry. Three words name the three surfaces. One word finishes a well-known phrase.","explain":"Risk appetite is the amount of risk the organisation will carry to reach its goals. It is a board decision, not a technical one. The board says patient-facing systems carry almost none. The risk tolerance for internal tooling may be higher. The vulnerability programme follows that line when it sets deadlines. The attack surface has three parts. External is what the internet can reach. Internal is what a user or a compromised host can reach inside. Physical is the doors, racks and ports a person can touch.","study":"Link the three ideas: appetite decides the deadline, the surface decides the exposure, and depth decides how many controls must fail.","keys":["Risk tolerance and risk appetite","Attack surface (external, internal, physical)","Defense in depth","Security controls: technical, administrative, physical","Internal and external scan","Data classification","Remediation SLA and deadline"]}]};
