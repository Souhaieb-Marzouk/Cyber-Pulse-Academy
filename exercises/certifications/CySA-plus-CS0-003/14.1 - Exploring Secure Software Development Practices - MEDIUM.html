,"probe":"false positive"},{"k":"Remediation validation (re-scan)","probe":"re-scan"},{"k":"Watchlist (KEV)","probe":"kev"},{"k":"Vulnerability exception","probe":"exception"}]},{"theme":"Attack Frameworks (obj 3.1)","items":[{"k":"MITRE ATT&CK","probe":"att&ck"},{"k":"TTP","probe":"ttp"},{"k":"Cyber Kill Chain","probe":"kill chain"},{"k":"Kill chain phases (7)","probe":"reconnaissance"},{"k":"Diamond Model","probe":"diamond"},{"k":"IOC","probe":"ioc"},{"k":"IOA","probe":"ioa"},{"k":"Break the chain early","probe":"the chain"}]}],"exercises":[{"id":"M01","t":"Anchor security to the SDLC","type":"order","pts":3,"themes":["SDLC & Process"],"kw":["SDLC phases","Secure SDLC","Security requirements"],"scenario":"Brightline Retail is building a customer portal. The security lead wants security activities anchored to every phase of the secure software development life cycle (secure SDLC), so nothing depends on memory or goodwill.","question":"Put the six software development life cycle phases into the correct order.","items":["Requirements \u2014 capture functional needs and the security requirements","Design \u2014 architecture plus threat modeling of the new features","Development \u2014 secure coding, peer code review, unit tests","Testing \u2014 SAST, DAST and vulnerability scanning on the build","Deployment \u2014 signed release, hardened configuration, monitoring hooks","Maintenance \u2014 patching, incident feedback, decommission plan"],"hint":"Follow the life of a feature: idea, blueprint, build, test, ship, keep it healthy.","expl":"The secure SDLC walks a feature from idea to retirement, and each phase owns specific security work. Security requirements are written down at the start, threat modeling happens in design, secure coding and review happen during development, SAST, DAST and scanning happen in testing, hardening and signing happen at deployment, and patching plus incident feedback happen in maintenance. Fixing a flaw early costs a conversation; fixing it in production costs an incident.","focus":"Memorize the six phases in order and attach one security activity to each phase."},{"id":"M02","t":"Late security at NovaBank","type":"qcm","pts":3,"themes":["SDLC & Process"],"kw":["Shift-left","Security requirements","Waterfall model","Agile"],"scenario":"NovaBank ships a customer portal every two weeks on an Agile cadence. InfoSec joins only during user acceptance testing, two weeks before each release. Late findings force emergency rework, and two releases slipped last quarter. The CISO asks how to fix the process, not just add tools.","question":"Which change best fixes the root cause?","choices":["Run security reviews and threat modeling from requirements onward","Add one more penetration test during the acceptance phase","Contract extra testers for the acceptance phase","Move back to a waterfall model with one big sign-off at the end"],"correct":[0],"hint":"The cost of a fix grows the later you find the flaw. Where is the earliest possible point to involve security?","expl":"This is a shift-left problem: security work that starts at acceptance testing finds flaws when they are most expensive to remove. Embedding reviews and threat modeling at requirements and design catches design flaws before code exists, which is exactly what a secure SDLC means. The two-week Agile cadence itself is fine \u2014 the problem is when security joins, not how often you ship. More testers or one more test at the same late stage do not change the timing, and a waterfall return would slow delivery and still test late.","focus":"Shift-left means moving security activities earlier in the life cycle, not adding more activity at the end."},{"id":"M03","t":"Rebuild the delivery pipeline","type":"fill","pts":3,"themes":["CI/CD & Supply Chain"],"kw":["DevSecOps","DevOps","CI/CD pipeline","SAST","Container image scanning","Security gates","Code signing","Waterfall model"],"scenario":"After a string of late-stage audit findings, the platform team rebuilds software delivery around automated security. Complete the engineering blog draft for the rollout.","question":"Fill every gap with a word from the bank.","text":"The platform team rebuilt delivery around {{b1}}: security engineers now sit inside the developers' workflow instead of a separate gate at the end. Every commit pushed to the shared {{b2}} triggers the pipeline. The build runs {{b3}} on the source code, scans the new {{b4}} for known CVEs, and only artifacts that pass all security {{b5}} are code-signed and deployed.","bank":["DevSecOps","code repository","SAST","container image","gates","Waterfall","DAST","firewall","code review"],"blanks":{"b1":"DevSecOps","b2":"code repository","b3":"SAST","b4":"container image","b5":"gates"},"hint":"SAST reads source without running it. The image scan and the gates come later in the same pipeline.","expl":"DevSecOps extends DevOps by embedding security into the CI/CD pipeline instead of bolting on a late gate. Commits to the code repository trigger builds; SAST analyzes the source code while it is still cheap to change, the container image is scanned for known CVEs before it ships, and security gates decide whether an artifact may be code-signed and deployed. Waterfall, firewalls and manual code review do not fit: the sentence describes an automated pipeline, not a document or a network box.","focus":"Know what runs at each pipeline stage: SAST on source, image scanning on the artifact, gates before signing and deploy."},{"id":"M04","t":"Pair the attack with its defense","type":"dragdrop","pts":4,"themes":["Secure Coding","Web Attack Classes"],"kw":["SQL injection","XSS","CSRF","Command injection","Path traversal","SSRF","Parameterized queries","Output encoding","Input validation","Secure headers"],"scenario":"You are writing the secure-coding cheat sheet for Brightline's developers. Each attack class gets exactly one first-line coding defense.","question":"Drag each defense into the slot of the attack it prevents.","slots":[{"k":"sqli","t":"SQL injection"},{"k":"xss","t":"Reflected XSS"},{"k":"csrf","t":"CSRF"},{"k":"cmdi","t":"OS command injection"},{"k":"trav","t":"Path traversal"},{"k":"ssrf","t":"SSRF"},{"k":"frame","t":"Clickjacking"}],"items":[{"k":"sqli","t":"Parameterized queries (prepared statements)"},{"k":"xss","t":"Output encoding on render"},{"k":"csrf","t":"Anti-forgery token + SameSite cookies"},{"k":"cmdi","t":"Strict input validation allowlist, no shell calls"},{"k":"trav","t":"Canonicalize path, pin a base directory"},{"k":"ssrf","t":"Allowlist of outbound destinations"},{"k":"frame","t":"X-Frame-Options: DENY"}],"hint":"Ask what the attack abuses: a query, the DOM, a cross-site request, a shell, a file path, an outbound fetch, or an iframe.","expl":"Every attack class has a matching coding defense. SQL injection dies with parameterized queries, because the query and the data travel separately. XSS dies with output encoding, because the browser renders data as text instead of markup. CSRF dies with anti-forgery tokens and SameSite cookies. Command injection dies when input validation keeps user data away from shells entirely. Path traversal dies with canonicalized paths pinned to a base directory. SSRF dies with an allowlist of outbound destinations. Clickjacking dies with X-Frame-Options, which forbids your page from being framed.","focus":"Learn the defense next to each attack name \u2014 exams pair them constantly."},{"id":"M05","t":"Audit the ping endpoint","type":"spot","pts":3,"themes":["Secure Coding"],"kw":["Command injection","SQL injection","Parameterized queries","ORM","CWE"],"scenario":"A junior developer's new endpoint passed functional review. Before it merges, you run your injection checklist over the code.","question":"Click every line that contains an injection flaw.","code":[{"t":"import os, sqlite3"},{"t":"@app.route(\"/ping\")"},{"t":"def ping():"},{"t":"    host = request.args.get(\"host\", \"\")"},{"t":"    os.system(\"ping -c1 \" + host)","bad":true,"why":"User input is glued into a shell command \u2014 OS command injection."},{"t":"    db = sqlite3.connect(\"app.db\")"},{"t":"    q = \"SELECT * FROM users WHERE name = '\" + request.args[\"u\"] + \"'\"","bad":true,"why":"User input is glued into SQL \u2014 classic SQL injection (CWE-89)."},{"t":"    rows = db.execute(q).fetchall()"},{"t":"    return str(len(rows))"}],"hint":"Look for user input being glued into a string that is then executed \u2014 it happens twice.","expl":"Two lines glue untrusted input into something an interpreter runs. Line 5 concatenates the host parameter into a shell command, so an attacker can append arbitrary shell syntax \u2014 OS command injection. Line 7 concatenates a request parameter into SQL, so input like ' OR '1'='1 rewrites the query \u2014 SQL injection, tracked as CWE-89. Line 8 only executes the already-built string; the fix belongs where the string is built: a parameterized query with placeholders, or an ORM that binds parameters for you.","focus":"Injection lives where input meets an interpreter string: shell, SQL, LDAP. Parameterize; never concatenate."},{"id":"M06","t":"Read the access log","type":"logviewer","pts":3,"themes":["Attack Frameworks","Secure Coding"],"kw":["SQL injection","IOC","Log analysis"],"scenario":"You are the on-call analyst. The WAF is in monitor-only mode, so the raw access log is your ground truth this morning.","question":"Use the filter box, read the payloads and statuses, then complete the incident note.","logs":[{"t":"203[.]0[.]113[.]7 - - [12/May/2026:09:14:02 +0000] \"GET /product?id=105 HTTP/1.1\" 200 4312","lvl":"info"},{"t":"203[.]0[.]113[.]7 - - [12/May/2026:09:14:19 +0000] \"GET /product?id=105%27 HTTP/1.1\" 500 1218","lvl":"info"},{"t":"203[.]0[.]113[.]7 - - [12/May/2026:09:14:31 +0000] \"GET /product?id=105%27%20OR%20%271%27%3D%271 HTTP/1.1\" 200 8871","lvl":"warn"},{"t":"198[.]51[.]100[.]9 - - [12/May/2026:09:15:02 +0000] \"GET /product?id=88 HTTP/1.1\" 200 4210","lvl":"info"},{"t":"203[.]0[.]113[.]7 - - [12/May/2026:09:15:40 +0000] \"GET /search?q=vacuum HTTP/1.1\" 200 3900","lvl":"info"},{"t":"203[.]0[.]113[.]7 - - [12/May/2026:09:16:05 +0000] \"GET /product?id=105%20UNION%20SELECT%20user%2Cpass%20FROM%20users HTTP/1.1\" 200 15602","lvl":"err"},{"t":"198[.]51[.]100[.]9 - - [12/May/2026:09:16:44 +0000] \"GET /login HTTP/1.1\" 200 2100","lvl":"info"},{"t":"203[.]0[.]113[.]7 - - [12/May/2026:09:17:12 +0000] \"GET /product?id=105%27-- HTTP/1.1\" 200 8860","lvl":"warn"}],"sub":{"type":"fill","text":"The source IP {{b1}} is probing the {{b2}} endpoint with SQL payloads. The request that most likely succeeded in extracting data is the one using {{b3}}.","bank":["203[.]0[.]113[.]7","198[.]51[.]100[.]9","/product","/search","/login","UNION SELECT","%27%20OR%20%271%27%3D%271","--"],"blanks":{"b1":"203[.]0[.]113[.]7","b2":"/product","b3":"UNION SELECT"}},"hint":"Filter on the suspicious IP, then look at which payloads returned 200 with an unusually large response size.","expl":"One source, 203[.]0[.]113[.]7, browses normally first, then probes /product with URL-encoded quotes (%27 is a single quote) and earns a 500 error \u2014 the classic signature of SQL injection testing. The UNION SELECT request returns 200 with a body more than three times larger than a normal page, which suggests attacker rows were appended to a real result set and data was extracted. The second IP only browses and is not part of the incident. These payload lines become your indicators of compromise for blocking and for hunting across other logs.","focus":"URL-decode payloads in your head: %27 = quote, %20 = space. A 200 with a huge size after an injection probe is the smoking gun."},{"id":"M07","t":"Sort the SAST report","type":"multi","pts":4,"themes":["Security Testing","Web Attack Classes"],"kw":["OWASP Top 10","Injection","XSS","Command injection","Insecure deserialization","Race condition"],"scenario":"A SAST report on your Java ordering app lists six findings. Your lead asks which ones belong to OWASP 2021 category A03:2021 \u2013 Injection.","question":"Select every finding that is an Injection category issue.","choices":["SQL built by concatenating the search field","Runtime.exec() called with a user-supplied filename","User comment stored and later rendered without output encoding","LDAP filter built from the login field","Cookie deserialized with readObject() from user input","Balance check and withdraw run as two unsynchronized steps"],"correct":[0,1,2,3],"hint":"In the 2021 list, XSS lives inside the Injection category. Deserialization moved to the integrity category.","expl":"A03:2021 \u2013 Injection covers SQL, LDAP and OS command injection, and also cross-site scripting, because the browser interprets injected markup \u2014 so the first four findings are all A03. The deserialization finding is not injection: in the 2021 list insecure deserialization belongs to A08, Software and Data Integrity Failures. The two-step balance operation is a race condition (a time-of-check to time-of-use logic flaw), which is not an injection at all.","focus":"Learn the OWASP 2021 borders: XSS is A03, insecure deserialization is A08, race conditions are not a Top-10 item."},{"id":"M08","t":"Name the tester","type":"match","pts":4,"themes":["Security Testing"],"kw":["SAST","DAST","SCA","IAST","Fuzzing","Security testing"],"scenario":"New security engineer onboarding. Before you hand over the pipeline, they must know which tool does what.","question":"Match each behavior to the testing technology it describes.","left":[{"k":"t1","t":"Reads source code without running the app"},{"k":"t2","t":"Attacks the running application from outside, like a real attacker"},{"k":"t3","t":"Inventories third-party libraries and flags known CVEs in them"},{"k":"t4","t":"Sensors inside the running app report which lines the test inputs reached"},{"k":"t5","t":"Feeds thousands of random and mutated inputs to find crashes"}],"right":[{"k":"t1","t":"SAST"},{"k":"t2","t":"DAST"},{"k":"t3","t":"SCA"},{"k":"t4","t":"IAST"},{"k":"t5","t":"Fuzzing"}],"hint":"Static = without running. Dynamic = running. Composition = dependencies. Interactive = inside. Random input = crash hunting.","expl":"SAST is static: it reads your source without executing it, early in the pipeline where fixes are cheap. DAST is dynamic: it probes the running application from the outside, like an attacker would. SCA reads your software composition \u2014 the open-source libraries \u2014 and matches versions against known CVE databases. IAST instruments the application from the inside and can say exactly which line a test input reached. Fuzzing throws large volumes of random and mutated input at parsers to find crashes. Each finds bug classes the others cannot.","focus":"Pair each tester with its blind spot: SAST misses runtime behavior, DAST misses unauthenticated flows, SCA only knows published CVEs."},{"id":"M09","t":"Sweep config.py for secrets","type":"terminal","pts":3,"themes":["Secure Coding","CI/CD & Supply Chain"],"kw":["Hard-coded credentials","Secrets management"],"scenario":"An intern pushed config.py straight to main. A teammate says a production password is sitting in it. Review the file before the next build runs.","question":"In the lab shell, list every line of config.py that contains the word password \u2014 case does not matter, and you want line numbers for the review.","fs":{"config.py":"DB_USER = \"orders_app\"\nDB_PASSWORD = \"Pr0d-Sup3r!\"\nAPI_PASSWORD_HINT = \"see vault\"\nSMTP_PASSWORD = \"mail-2026!\"\nDEBUG = True\n"},"demoCmd":"grep -in password config.py","checks":[{"re":"\\bgrep\\b","label":"Uses the grep command"},{"re":"password","label":"Searches for the word password"},{"re":"config\\.py","label":"Targets config.py"},{"re":"(^|\\s)-\\w*i","label":"Ignores case with the -i flag"},{"re":"(^|\\s)-\\w*n","label":"Shows line numbers (-n)"}],"success":[{"re":"grep\\s+[^\\n]*password[^\\n]*config\\.py","out":"2:DB_PASSWORD = \"Pr0d-Sup3r!\"\n3:API_PASSWORD_HINT = \"see vault\"\n4:SMTP_PASSWORD = \"mail-2026!\""}],"hint":"Use a grep command. The -i flag ignores case and -n prints line numbers, like: grep -in WORD FILE.","expl":"grep -in password config.py prints every matching line with its number, and -i makes the match case-insensitive so PASSWORD_HINT is not missed. The file hard-codes a production database password plus two more secrets in plain text \u2014 hard-coded credentials are forbidden because every reader of the repository owns your production access. Secrets belong in a vault or the CI secret store, and after a leak like this the passwords must be rotated, not just deleted, because they already sit in the repository history.","focus":"grep -i ignores case, -n shows line numbers. Hard-coded secrets always end with rotation plus a vault."},{"id":"M10","t":"Order the kill chain","type":"order","pts":3,"themes":["Attack Frameworks"],"kw":["Cyber Kill Chain","Reconnaissance","Weaponization","Exploitation","Command and Control"],"scenario":"Your SOC is adopting the Lockheed Martin Cyber Kill Chain for incident reports. New analysts must know the chain cold.","question":"Drag the seven phases into the correct order.","items":["Reconnaissance \u2014 harvest targets, staff, exposed services","Weaponization \u2014 couple an exploit into a deliverable payload","Delivery \u2014 transmit the payload by email, web or USB","Exploitation \u2014 the payload triggers the vulnerability","Installation \u2014 persist malware on the victim","Command and Control \u2014 open the remote channel","Actions on Objectives \u2014 steal, encrypt, destroy"],"hint":"Seven steps from first look to final goal; the payload travels between step 2 and step 5.","expl":"The Cyber Kill Chain models an intrusion as seven phases: Reconnaissance, Weaponization, Delivery, Exploitation, Installation, Command and Control, and Actions on Objectives. The attacker needs every link, so breaking any single one stops the intrusion. Defenders map their controls to phases and try to break the chain as early as possible, because reconnaissance-phase defenses cost the least and post-compromise defenses cost the most.","focus":"Reproduce the seven names from memory \u2014 exams ask for the order and for the phase where a control applies."},{"id":"M11","t":"Break the chain early","type":"dragdrop","pts":4,"themes":["Attack Frameworks","Threat Modeling & Architecture"],"kw":["Cyber Kill Chain","Defense in depth","ASLR","Stack canaries","Software diversification","Sandboxing","DLP","Egress filtering","Attack surface"],"scenario":"You are mapping Brightline's controls onto the kill chain for the board pack. Each control acts at one specific phase.","question":"Drag each control onto the kill-chain phase where it does its work.","slots":[{"k":"recon","t":"Phase: Reconnaissance"},{"k":"delivery","t":"Phase: Delivery"},{"k":"exploit","t":"Phase: Exploitation"},{"k":"c2","t":"Phase: Command and Control"},{"k":"actions","t":"Phase: Actions on Objectives"}],"items":[{"k":"recon","t":"Limit public info and watch OSINT exposure"},{"k":"delivery","t":"Email gateway with attachment sandboxing"},{"k":"exploit","t":"Patch fast; enable ASLR and stack canaries"},{"k":"c2","t":"Egress filtering and DNS monitoring"},{"k":"actions","t":"DLP alerts on bulk data movement"}],"hint":"Match the control to the moment it acts: before delivery, at code execution, at beaconing, at exfiltration.","expl":"Each control breaks the chain at a specific phase, and reducing public information also shrinks your attack surface before reconnaissance even starts. Sandboxing attachments at the email gateway catches weaponized documents during delivery. Fast patching plus memory protections such as ASLR and stack canaries \u2014 cheap forms of software diversification \u2014 stop exploitation from succeeding. Egress filtering and DNS monitoring reveal command-and-control beacons. Data loss prevention watches the actions-on-objectives stage, when data tries to leave. Layered controls like this are defense in depth, and breaking the chain early is always cheaper than cleaning up afterwards.","focus":"For each control ask: which phase does it detect or stop? ASLR and canaries belong to the exploitation defenses."},{"id":"M12","t":"Diamond Model vertex","type":"qcm","pts":3,"themes":["Attack Frameworks"],"kw":["Diamond Model","IOC"],"scenario":"While documenting an incident you fill a Diamond Model entry. So far: adversary = intrusion set TAG-704; capability = their credential-phishing kit; victim = a finance team lead. A colleague adds the phishing mail's sender domain, mail-secure-update[.]com, registered last week and used only for this campaign.","question":"Which Diamond Model vertex does the newly registered sender domain belong to?","choices":["Capability","Victim","Infrastructure","Adversary"],"correct":[2],"hint":"The four vertices are Adversary, Capability, Infrastructure, Victim. Ask what role the domain played: it carried the attack, it did not think or act.","expl":"The Diamond Model has four vertices: Adversary (who), Capability (what they used, like the phishing kit), Victim (who was targeted) and Infrastructure (the paths and resources the attack travelled over). A sender domain is infrastructure: it delivered the capability to the victim. Domains, IP addresses and hosting accounts all sit on that vertex. Tagging artifacts to the right vertex keeps incident records comparable and makes pivoting \u2014 finding other victims of the same infrastructure \u2014 fast and systematic.","focus":"Domain names and IP addresses are almost always the Infrastructure vertex."},{"id":"M13","t":"Map behaviors to ATT&CK","type":"match","pts":4,"themes":["Attack Frameworks"],"kw":["MITRE ATT&CK","TTP","Techniques"],"scenario":"You are writing the weekly threat report and want every observation tagged with the right MITRE ATT&CK technique.","question":"Match each observed behavior to its ATT&CK technique.","left":[{"k":"a1","t":"Emails a weaponized invoice attachment to accounting staff"},{"k":"a2","t":"Tries the same weak password across 400 VPN accounts"},{"k":"a3","t":"Launches an encoded PowerShell one-liner on a beachhead host"},{"k":"a4","t":"Checks in to hxxp://cdn-telemetry[.]example every 60 seconds"},{"k":"a5","t":"Registers a scheduled task to survive reboots"}],"right":[{"k":"a1","t":"Phishing (T1566)"},{"k":"a2","t":"Brute Force / Password Guessing (T1110)"},{"k":"a3","t":"Command and Scripting Interpreter (T1059)"},{"k":"a4","t":"Application Layer Protocol (T1071)"},{"k":"a5","t":"Scheduled Task/Job (T1053)"}],"hint":"ATT&CK names the how: the technique is the verb of the behavior, not the tool name.","expl":"MITRE ATT&CK catalogs adversary behavior as techniques grouped under tactics. Sending the weaponized attachment is Phishing (T1566). Trying one password across many accounts is Password Guessing under Brute Force (T1110). Running an encoded PowerShell command is Command and Scripting Interpreter (T1059). Regular HTTP check-ins are Application Layer Protocol (T1071), web traffic. A registered task that survives reboots is Scheduled Task/Job (T1053). Mapping observations to technique IDs turns messy logs into comparable TTPs that you can hunt for, report and share.","focus":"Learn the top 15\u201320 technique IDs that recur in reports; they repeat in nearly every exam question."},{"id":"M14","t":"Triage Monday's queue","type":"order","pts":4,"themes":["Vulnerability Response"],"kw":["CVSS","Prioritization","Watchlist","Compensating controls","Exposure","SLA","KEV"],"scenario":"It is Monday morning and you must schedule this week's fixes. Facts on the desk: (A) CVSS 9.8 RCE on the internet-facing shop, listed in the KEV catalog; (B) CVSS 9.1 deserialization flaw on an internal build server, no exploit seen; (C) CVSS 7.5 SQLi on an internal reporting app, a WAF rule already blocks the payload; (D) CVSS 5.3 information disclosure on an internal wiki; (E) CVSS 8.6 auth bypass on the customer-facing API, no public exploit.","question":"Drag the five findings into remediation order \u2014 fix first at the top.","items":["A \u2014 internet-facing RCE, actively exploited (KEV)","E \u2014 customer-facing auth bypass, high exposure","B \u2014 internal build server, severe but not exposed","C \u2014 internal SQLi, WAF rule as compensating control","D \u2014 internal info disclosure, lowest risk"],"hint":"Base severity is not enough: exposure, active exploitation and existing compensating controls reorder the queue.","expl":"Prioritization weighs CVSS against context. The internet-facing RCE with a KEV listing goes first: actively exploited and fully exposed. The customer-facing auth bypass follows: high reach, no public exploit yet. The internal build server is severe but closed to the internet. The internal SQLi already has a compensating control \u2014 the WAF virtual patch \u2014 so it can wait one slot. The internal info disclosure is lowest. A raw CVSS sort would have put B before E; context is what makes the order defensible and the remediation SLA realistic.","focus":"Exposure + active exploitation + available mitigation beat the raw score. Write the why into the ticket."},{"id":"M15","t":"Respond to the 9.8","type":"branch","pts":4,"themes":["Vulnerability Response"],"kw":["Remediation","Mitigation","Compensating controls","Virtual patching","SLA","Remediation validation","Change management","Risk acceptance"],"scenario":"Friday, 16:40. A scan confirms CVE-2026-1234, CVSS 9.8 RCE, on the public helpdesk application. Your SLA for critical internet-facing findings is 72 hours. Walk the response.","question":"Choose the right action at every step of the response.","steps":[{"text":"What is the first response action for this confirmed critical finding?","opts":[{"t":"Log the finding, open an emergency change-management record, plan the patch within the 72-hour SLA","ok":true,"note":"Right: a confirmed critical finding starts the response process and the clock."},{"t":"Wait for the monthly patch cycle like every other finding","ok":false,"note":"A 9.8 on a public app cannot wait a month \u2014 that breaks the SLA and the risk appetite."},{"t":"Mark it accepted risk because patching is disruptive","ok":false,"note":"Acceptance needs a signed exception from the risk owner, and critical public RCEs normally never qualify."}]},{"text":"The vendor publishes the fix Monday, but regression testing needs five days. What now?","opts":[{"t":"Apply a WAF virtual patch and restrict access while the real fix is tested","ok":true,"note":"Good: mitigation buys safe time while remediation is prepared."},{"t":"Do nothing until the tested patch arrives","ok":false,"note":"Leaving a public 9.8 open with no compensating control is indefensible."},{"t":"Unplug the helpdesk app for a week","ok":false,"note":"That is risk avoidance at maximum business cost \u2014 mitigation achieves the same safety for far less damage."}]},{"text":"The patch is deployed on Tuesday. How do you close the finding?","opts":[{"t":"Re-scan the host and verify the version banner shows the fixed release","ok":true,"note":"Correct: validation proves the remediation actually worked."},{"t":"Close the ticket because change management said the deploy succeeded","ok":false,"note":"Deployment success is not vulnerability validation \u2014 always re-scan."},{"t":"Wait for the next quarterly scan","ok":false,"note":"Quarterly scans do not validate this fix within the SLA."}]}],"hint":"Respond, mitigate if you cannot remediate yet, then always validate before closing.","expl":"The response flow for a confirmed critical finding is: record it and start the SLA clock, mitigate when the full fix is not ready \u2014 a WAF virtual patch is a compensating control that blocks the known exploit pattern \u2014 then remediate with the real patch, and validate with a re-scan before closing. Skipping validation is the most common audit finding in vulnerability management programs. Risk acceptance is a documented, signed decision by the risk owner, never a silent default.","focus":"Response = record, mitigate if needed, remediate, validate, close. Name the control type at each step."},{"id":"M16","t":"The patched Apache alert","type":"fill","pts":3,"themes":["Vulnerability Response"],"kw":["False positive","Remediation validation","CVE","Path traversal","Evidence"],"scenario":"Tuesday's scan flags 'Apache 2.4.49 \u2014 Path Traversal (CVE-2021-41773)', CVSS 9.8, on shop-web-03. The last successful patch window was Friday. The live response headers read: Server: Apache/2.4.52. No exploitation attempts appear in the WAF logs.","question":"Complete the triage note with the right terms.","text":"The banner proves the host runs the patched release, so the finding is most likely a {{b1}}. The correct next step is a targeted {{b2}} of shop-web-03 to confirm, and the ticket should record the banner output as {{b3}} for the closing decision.","bank":["false positive","false negative","re-scan","exploit attempt","evidence","risk acceptance","upgrade"],"blanks":{"b1":"false positive","b2":"re-scan","b3":"evidence"},"hint":"The scanner sees an old version pattern; the banner shows the truth. What do you call a wrong alert, and what proves the truth?","expl":"The scanner matched a version pattern from before the Friday patch, so this is a false positive \u2014 the tool reports a vulnerability that is not present. The proof is the Server: Apache/2.4.52 banner, which belongs in the ticket as evidence for the closing decision. A targeted re-scan makes the tool agree and stops the alert from reappearing every cycle. A false negative is the opposite failure \u2014 a real flaw the scanner missed. Closing findings with attached evidence, not vibes, is what auditors check first.","focus":"False positive = alert without the flaw. Attach the proof (banner, re-scan ID) to the ticket."},{"id":"M17","t":"The unpatchable print server","type":"fill","pts":3,"themes":["Vulnerability Response"],"kw":["Vulnerability exception","Risk acceptance","Compensating controls","Risk owner","IaC","Remediation","Risk transfer"],"scenario":"The legacy print server PRN-01 runs an OS the vendor no longer supports, so critical finding CVE-2026-8801 can never be patched normally. You draft the exception request that the security review will accept.","question":"Fill every gap so the memo survives review. Two bank words are traps.","text":"This memo requests a formal {{b1}} for CVE-2026-8801 on PRN-01 for 90 days. Because the vendor ended support, we cannot {{b2}} the finding; instead a {{b3}} limits the host to one print-queue port from the print VLAN only. The change was rolled out through our {{b4}} pipeline, not by hand in the console. The {{b5}} (head of facilities IT) has signed, and the exception expires on 30 June with a mandatory review.","bank":["vulnerability exception","remediate","compensating control","infrastructure-as-code","risk owner","risk transfer","indefinitely"],"blanks":{"b1":"vulnerability exception","b2":"remediate","b3":"compensating control","b4":"infrastructure-as-code","b5":"risk owner"},"hint":"Two bank words are traps: insurance-style wording and 'forever' wording never survive a security review.","expl":"An exception is the documented, signed acceptance of a risk you cannot remove. You remediate with a patch \u2014 impossible here because the vendor ended support \u2014 so the risk is held down by a compensating control: tight network restriction to one port. Rolling the change out through infrastructure-as-code keeps it reviewable and repeatable instead of a hand-edit that drifts. The risk owner signs, and the 90-day expiry forces re-review; indefinite exceptions are refused in every mature program. Risk transfer would mean moving the financial risk to another party such as an insurer \u2014 it removes no vulnerability at all.","focus":"Exception = signed acceptance + compensating control + expiry date. Learn the three parts as a set."},{"id":"M18","t":"Review the session config","type":"spot","pts":3,"themes":["Secure Coding"],"kw":["Session management","Secure cookie flags","Secure defaults","Default credentials disallowed","Information disclosure"],"scenario":"Brightline's application ships with this configuration file. The audit checklist covers cookie hygiene, session lifetime and secure defaults.","question":"Click every configuration line that contains a security flaw.","code":[{"t":"[session]"},{"t":"session.cookie_secure = 0","bad":true,"why":"The session cookie travels over plain HTTP \u2014 network attackers can read it."},{"t":"session.cookie_httponly = 0","bad":true,"why":"JavaScript can read the cookie \u2014 one XSS bug becomes full session theft."},{"t":"session.gc_maxlifetime = 86400","bad":true,"why":"Sessions live 24 hours \u2014 steal once, reuse all day."},{"t":"session.use_strict_mode = 1"},{"t":"session.save_path = \"/var/lib/php/sessions\""},{"t":"[app]"},{"t":"app.admin_default_password = \"ChangeMe123\"","bad":true,"why":"A default admin password ships enabled \u2014 default credentials must be disallowed."},{"t":"app.verbose_errors = false"}],"hint":"Three session lines break the cookie and lifetime rules, and one admin line breaks the defaults rule.","expl":"cookie_secure = 0 lets the session ID travel over plain HTTP, where anyone on the network can read it. cookie_httponly = 0 lets JavaScript read the cookie, so a single XSS bug becomes full session theft. A 86400-second (24-hour) lifetime multiplies the replay window enormously. use_strict_mode = 1 is correct \u2014 it rejects session IDs the server never issued. And shipping a default admin password violates the secure-defaults rule: default credentials must be disallowed, forcing a unique password at setup. Four lines carry the flaws; verbose_errors = false is the right setting and keeps information disclosure down.","focus":"Cookie flags: Secure, HttpOnly, SameSite \u2014 plus a short lifetime and no default passwords anywhere."},{"id":"M19","t":"Explain the security headers","type":"dragdrop","pts":4,"themes":["Secure Coding"],"kw":["Secure headers","CSP","HSTS","Clickjacking","XSS","CSRF","nosniff"],"scenario":"Brightline's new gateway sends response headers, but nobody on the team can say which header stops which trick. You draw the wall chart.","question":"Drag each header onto the description of what it does.","slots":[{"k":"csp","t":"Blocks scripts from untrusted sources"},{"k":"hsts","t":"Forces HTTPS, blocks protocol downgrade"},{"k":"frame","t":"Stops page framing, kills clickjacking"},{"k":"mime","t":"Stops browsers guessing file types"},{"k":"samesite","t":"Limits cookies on cross-site requests"}],"items":[{"k":"csp","t":"Content-Security-Policy"},{"k":"hsts","t":"Strict-Transport-Security"},{"k":"frame","t":"X-Frame-Options: DENY"},{"k":"mime","t":"X-Content-Type-Options: nosniff"},{"k":"samesite","t":"SameSite=Lax/Strict"}],"hint":"Two headers start with X-; one fights scripts, one fights downgrade, one fights framing, one fights guessing, one fights cookie sharing.","expl":"Security headers are cheap, powerful secure defaults. Content-Security-Policy restricts which scripts may run and is the strongest single defense against XSS. Strict-Transport-Security forces HTTPS and blocks downgrade attacks. X-Frame-Options: DENY forbids your page from being framed, which kills clickjacking. X-Content-Type-Options: nosniff stops the browser from guessing content types. SameSite controls whether cookies ride along on cross-site requests, which cuts most CSRF risk. Missing headers are a security misconfiguration finding in every scanner worth the name.","focus":"Five headers, five tricks: script injection, downgrade, framing, MIME guessing, cross-site cookie use."},{"id":"M20","t":"Score with DREAD","type":"match","pts":3,"themes":["Threat Modeling & Architecture"],"kw":["DREAD","Risk scoring","Threat modeling"],"scenario":"The architecture board wants threats ranked with a repeatable scheme instead of gut feeling. You teach DREAD with five one-liners.","question":"Match each one-liner to the DREAD dimension it measures.","left":[{"k":"d1","t":"If exploited, all customer records are destroyed"},{"k":"d2","t":"The same request reproduces the crash every time"},{"k":"d3","t":"Only a five-line script and no credentials are needed"},{"k":"d4","t":"400,000 accounts sit in the blast radius"},{"k":"d5","t":"The admin URL shows up in a public directory listing"}],"right":[{"k":"d1","t":"Damage"},{"k":"d2","t":"Reproducibility"},{"k":"d3","t":"Exploitability"},{"k":"d4","t":"Affected users"},{"k":"d5","t":"Discoverability"}],"hint":"D-R-E-A-D: destruction, repeatability, work needed, blast radius, how easy to find.","expl":"DREAD is a classic threat-modeling scoring scheme: Damage, Reproducibility, Exploitability, Affected users, Discoverability. Each dimension gets a score, often 1 to 10, and the sum or average ranks threats against each other. Destroyed records is Damage. A crash that repeats on every attempt scores high Reproducibility. A five-line unauthenticated script is maximal Exploitability. 400,000 accounts is the Affected-users number. A publicly listed admin URL is high Discoverability. DREAD makes risk arguments concrete: instead of 'it feels bad', you argue over five measurable questions.","focus":"Spell DREAD out and attach one measurable question to each letter."},{"id":"M21","t":"Order the test pyramid","type":"order","pts":3,"themes":["Security Testing"],"kw":["Unit testing","Integration testing","Regression testing","UAT","Security testing"],"scenario":"Brightline's release train runs a fixed testing sequence for every build. The new QA hire shuffled the wall chart; put it right.","question":"Drag the five test levels into the order they run for a release.","items":["Unit testing \u2014 single functions, mocked inputs, in the developer's IDE","Integration testing \u2014 modules talk to each other and to the test database","System and security testing \u2014 the whole build: SAST, DAST, fuzz cases","User acceptance testing \u2014 business users validate real workflows","Regression testing \u2014 rerun the suites after the final patch to catch breakage"],"hint":"From one function up to the whole system, then the business, then the safety net.","expl":"Testing climbs the pyramid. Unit tests check single functions cheaply and fast. Integration tests prove the modules work together against a test database. System and security testing exercises the whole build, including SAST, DAST and fuzz cases. User acceptance testing confirms the business workflows with real users. Regression testing reruns everything after the final change so a hotfix does not silently break last month's feature \u2014 skipping regression after hotfixes is one of the most common causes of self-inflicted outages.","focus":"Order: unit, integration, system/security, UAT, regression. Know what each level catches."},{"id":"M22","t":"The contractor's key","type":"multi","pts":3,"themes":["CI/CD & Supply Chain","Secure Coding"],"kw":["Hard-coded credentials","Secrets management","Code repository","Branch protection","Commit signing","Least privilege","Rotation"],"scenario":"You find an AWS access key hard-coded in a Python file committed to the internal Git server two days ago by a contractor. The repository is internal-only but synced to three developer laptops, and the key had admin-level scopes.","question":"Select every action you must take.","choices":["Revoke the key in AWS now and re-issue with least-privilege scopes","Rewrite the repository history to purge the secret and force-push","Move the secret into the secrets-management vault and reference it at runtime","Enable protected branches and require signed commits with a pre-commit secret scanner","Open a support ticket to suspend the affected AWS account","Leave the key in place but add a comment marking it deprecated","Rename the variable in the code from API_KEY to TOKEN"],"correct":[0,1,2,3],"hint":"The key is already burned: think revoke, purge, relocate, prevent.","expl":"A committed credential must be treated as compromised. Revoke and rotate first \u2014 deleting the file is not enough, because Git history keeps every version forever. Rewrite the history and force-push, move the value into the secrets-management vault so source code never carries it, and prevent recurrence with protected branches, signed commits and a pre-commit secret scanner. Scoping the new key with least privilege caps the blast radius if it leaks again. Opening a support ticket, leaving the key with a deprecation comment, or renaming the variable changes nothing about the exposed, powerful key.","focus":"Leaked secret = rotate + purge history + vault + pipeline guardrails, in that order of urgency."},{"id":"M23","t":"Headline CVE night","type":"fill","pts":3,"themes":["CI/CD & Supply Chain"],"kw":["SBOM","SCA","Dependency management","Container image","CI/CD pipeline"],"scenario":"A headline CVE drops: remote code execution in the logging library json-logkit 2.7.1 and below. Nobody knows which of the 40 services use it \u2014 but the pipeline has generated an SBOM for every build since last year.","question":"Complete the incident note.","text":"The {{b1}} for each build lists exact component versions, so we can {{b2}} every affected service within minutes instead of grepping 40 codebases. The {{b3}} tool matches the component against the CVE feed and opens tickets automatically. We bump the pinned version and rebuild each {{b4}}, then confirm closure with a re-scan.","bank":["SBOM","identify","SCA","container image","SAST","DAST","fuzzing","manual review"],"blanks":{"b1":"SBOM","b2":"identify","b3":"SCA","b4":"container image"},"hint":"One artifact lists the ingredients; one tool matches them against CVE feeds.","expl":"An SBOM \u2014 software bill of materials \u2014 is the ingredient list of a build: every library with its exact version. When a headline CVE drops, the SBOM lets you identify affected services in minutes, which is the entire point of dependency management. The SCA tool automates the matching between components and CVE feeds, and tickets flow out of the pipeline. Fixing means bumping the pinned version and rebuilding each container image, then a re-scan validates the remediation. SAST and DAST test code behavior, not ingredients \u2014 they cannot tell you which services ship the vulnerable library.","focus":"SBOM = what is inside. SCA = which of it is vulnerable. Both live in the pipeline."},{"id":"M24","t":"STRIDE on the ordering app","type":"match","pts":4,"themes":["Threat Modeling & Architecture"],"kw":["STRIDE","Threat modeling","Error handling","Access control"],"scenario":"Threat modeling session for the ordering app. The whiteboard lists six observed abuse cases from last year's pentest.","question":"Match each abuse case to its STRIDE category.","left":[{"k":"s1","t":"Logs in as the CFO with a stolen session cookie"},{"k":"s2","t":"Changes the amount field in transit and the signature still passes"},{"k":"s3","t":"Denies placing the order; the app kept no audit trail"},{"k":"s4","t":"A stack trace on the error page reveals database names"},{"k":"s5","t":"Floods the export endpoint until the service falls over"},{"k":"s6","t":"An ordinary user calls /admin/deleteUser and it works"}],"right":[{"k":"s1","t":"Spoofing"},{"k":"s2","t":"Tampering"},{"k":"s3","t":"Repudiation"},{"k":"s4","t":"Information disclosure"},{"k":"s5","t":"Denial of service"},{"k":"s6","t":"Elevation of privilege"}],"hint":"S-T-R-I-D-E: pretend to be someone, change data, deny it, leak it, break it, climb higher.","expl":"STRIDE is the threat-modeling alphabet. Spoofing means faking an identity \u2014 the stolen session cookie. Tampering means unauthorized changes \u2014 the amount field. Repudiation means denying an action when no logs exist. Information disclosure is the stack trace leaking internals, a verbose error-handling failure. Denial of service is the flooded endpoint. Elevation of privilege is a normal user reaching admin functions, a broken access check. Threat modeling walks each data flow across trust boundaries, asks which STRIDE threats apply, and picks a control for each.","focus":"Attach one concrete example to each STRIDE letter; exams give you the example, you give the letter."},{"id":"M25","t":"Book the threat modeling slot","type":"qcm","pts":3,"themes":["Threat Modeling & Architecture","SDLC & Process"],"kw":["Threat modeling","SDLC phases","Security champion","Shift-left"],"scenario":"Your squad's security champion wants to book the threat modeling session for the new payments feature. Architecture is approved next Tuesday; coding starts Wednesday; UAT is in five weeks; go-live in eight.","question":"When should the threat modeling session run?","choices":["In the design phase, before the first line of code","During UAT, when the feature can be probed live","After go-live, using production traffic logs as input","Right before the first scheduled penetration test"],"correct":[0],"hint":"Threat modeling changes design decisions. When is changing a design still cheap?","expl":"Threat modeling pays when its findings can still change the design: at design time, before code exists. Finding 'this flow trusts client-side price calculation' in a whiteboard session costs a conversation; finding it in production costs re-architecture and an incident. The security champion's job is to book that slot and bring the data-flow diagram. UAT, go-live or waiting for the pentest all lock the design in first \u2014 exactly what a shift-left secure SDLC avoids.","focus":"Threat modeling is a design-phase activity whose output drives security requirements and tests."},{"id":"M26","t":"Set the patch clock","type":"fill","pts":3,"themes":["Vulnerability Response"],"kw":["SLA","Patch management","CVSS","Compensating controls","Exception"],"scenario":"Your patch-management policy sets remediation SLAs: Critical (CVSS 9.0+) internet-facing = 7 days; Critical elsewhere = 30 days; High (7.0\u20138.9) = 15 days internet-facing, 60 days otherwise. A scan dated 3 March finds CVSS 9.8 on the internet-facing customer portal.","question":"Fill the ticket fields.","text":"Severity class: {{b1}}. Remediation deadline: {{b2}}. If the fix cannot ship in time, apply a {{b3}} such as a WAF rule and open a formal exception with a new target date.","bank":["Critical","High","Medium","10 March","18 March","2 April","compensating control","risk transfer","extension"],"blanks":{"b1":"Critical","b2":"10 March","b3":"compensating control"},"hint":"3 March plus the internet-facing critical window \u2014 count the days.","expl":"CVSS 9.8 lands in the Critical class, and the portal is internet-facing, so the 7-day SLA applies: 3 March + 7 days = 10 March. When a fix cannot land inside the window you do not silently extend \u2014 you mitigate with a compensating control such as a WAF virtual patch and open a documented exception with a new date. That keeps the patch management program measurable: every finding has a class, a clock, and a named fallback.","focus":"SLA math: severity class + exposure gives the deadline. No fix in time = mitigation + exception."},{"id":"M27","t":"Gate blocks the release","type":"branch","pts":4,"themes":["CI/CD & Supply Chain"],"kw":["Security gates","SCA","Dependency management","Escalation","Watchlist","Mitigation","Exception"],"scenario":"During a routine build, the pipeline's dependency scanner flags zipstream 1.6 with a critical CVE, CVSS 9.1, exploitable in your configuration. The release train leaves in two hours. Work the decisions.","question":"Choose the right move at every step.","steps":[{"text":"The build hits the failing security gate. What happens?","opts":[{"t":"The gate blocks the build; the release cannot ship with the vulnerable library","ok":true,"note":"Right: gates fail closed \u2014 that is their entire job."},{"t":"Override the gate this once; the release is important","ok":false,"note":"Overrides must be rare, signed, time-boxed exceptions \u2014 'important release' is how vulnerable builds reach production."},{"t":"Remove the scanner so builds pass again","ok":false,"note":"Deleting the control hides the risk; auditors call that a critical process failure."}]},{"text":"No fixed version of zipstream exists yet. What is the move?","opts":[{"t":"Apply the vendor workaround, restrict the affected code path, and track the CVE on the watchlist","ok":true,"note":"Good: mitigate, monitor, and keep the ticket open until the fixed release lands."},{"t":"Accept the risk silently and move on","ok":false,"note":"Undocumented acceptance fails review, and nobody remembers why the library is vulnerable."},{"t":"Downgrade to zipstream 1.2","ok":false,"note":"Downgrades can import older, worse flaws \u2014 that is not remediation."}]},{"text":"Who must know before the release train leaves?","opts":[{"t":"Escalate to the security team and the product owner; the exception gets an owner and a review date","ok":true,"note":"Correct: escalation makes the risk visible and owned."},{"t":"Nobody; the pipeline already logged it","ok":false,"note":"A log line is not risk management \u2014 people must own the decision."},{"t":"Only the intern who added the dependency","ok":false,"note":"Wrong level: risk decisions belong with security and the product owner."}]}],"hint":"Gates fail closed; mitigation and escalation fill the gap until a real fix exists.","expl":"A security gate that can be clicked away is decoration: it must block the build. With no fixed version available, the response is mitigation \u2014 the vendor workaround and a restricted code path \u2014 plus tracking on the watchlist until the fixed release lands. Escalation gives the risk an owner and a review date, because an exception is only valid when someone senior owns it. Removing the scanner or downgrading the library hides or worsens the problem instead of managing it.","focus":"Gate fails, then mitigate, escalate, track. Never silence the control."},{"id":"M28","t":"IOC or noise?","type":"multi","pts":3,"themes":["Attack Frameworks"],"kw":["IOC","IOA","Log analysis","Watchlist"],"scenario":"Morning hunt on a finance workstation. Six observations from last night's logs are on your desk.","question":"Select the entries that are true indicators of compromise (IOCs).","choices":["Outbound TLS to 198[.]51[.]100[.]23:4444, an IP on no known service list","DNS query for j78f2k9[.]example \u2014 domain first seen today, no business match","User-Agent python-requests/2.1 on a finance user's workstation at 02:40","Nightly backup job ran at 02:00 as scheduled","Vulnerability scanner 10[.]0[.]5[.]20 swept the subnet (approved change 4471)","An office document spawning PowerShell with an encoded command"],"correct":[0,1,2],"hint":"IOC = a what (artifact: IP, domain, hash). IOA = a how (behavior). Three of the six are not IOCs: two are business-as-usual, and one describes behavior rather than an artifact.","expl":"An IOC is a concrete artifact linked to malicious activity \u2014 an IP address, a domain, a file hash. The unknown 198[.]51[.]100[.]23:4444 connection, the never-seen domain and a scripting user-agent on a finance workstation at 02:40 are all IOCs worth adding to the watchlist and hunting across the estate. The backup job and the approved vulnerability scan are expected activity. The document-spawning-PowerShell pattern is an IOA \u2014 an indicator of attack describing behavior, not an artifact: behaviors are hunted with detection rules, artifacts are matched with watchlists.","focus":"IOC = artifact (blocklist). IOA = behavior (detection rule). Learn to sort observations into the two buckets."},{"id":"M29","t":"Sweep the source tree","type":"terminal","pts":3,"themes":["Secure Coding","CI/CD & Supply Chain"],"kw":["Hard-coded credentials","Code review","Secrets management"],"scenario":"Secrets can hide anywhere in the source tree, not just config.py. The team wants a manual sweep before the customer audit.","question":"In the lab shell: search the whole src/ directory recursively and show line numbers for every line containing api_key.","fs":{"src/app.py":"import os\nkey = os.environ[\"API_KEY\"]\n","src/legacy/backup.py":"api_key = \"sk-live-8812\"\nprint(api_key)\n","notes.txt":"the api_key rotation is due in June\n"},"demoCmd":"grep -rn api_key src/","checks":[{"re":"\\bgrep\\b","label":"Uses the grep command"},{"re":"(^|\\s)-\\w*r","label":"Searches recursively (-r)"},{"re":"(^|\\s)-\\w*n","label":"Shows line numbers (-n)"},{"re":"src\\b","label":"Targets the src/ directory"}],"success":[{"re":"grep\\s+[^\\n]*api_key[^\\n]*src\\b","out":"src/legacy/backup.py:1:api_key = \"sk-live-8812\"\nsrc/legacy/backup.py:2:print(api_key)"}],"hint":"grep -rn PATTERN DIR sweeps a whole tree with line numbers. The target directory is src/.","expl":"grep -rn api_key src/ walks every file under src/ and prints matches with file name and line number \u2014 the fastest manual secret sweep before an audit. It exposes the hard-coded key in the legacy backup script, while app.py reads the key from an environment variable, which is the correct pattern. A sweep like this complements the automated secret scanner: the scanner catches new commits, you catch what already sits in the tree, and every hit ends the same way \u2014 rotate the secret, move it to the vault, and add a pre-commit scanner.","focus":"-r recurses, -n numbers lines. After a secret sweep: rotate and vault \u2014 never just delete the line."},{"id":"M30","t":"Four assurance activities","type":"match","pts":3,"themes":["Security Testing"],"kw":["Penetration testing","Bug bounty","Vulnerability scanning","Code review"],"scenario":"The CFO asks why the company pays for four different activities that all 'find security bugs'. You draw the comparison table.","question":"Match each activity to its defining shape.","left":[{"k":"e1","t":"Contracted team attacks a defined scope for two weeks and reports findings privately"},{"k":"e2","t":"Anyone can submit a flaw and earn a reward; runs continuously"},{"k":"e3","t":"Automated checks of hosts for known CVEs on a schedule"},{"k":"e4","t":"A developer reads a colleague's merge request line by line before merge"}],"right":[{"k":"e1","t":"Penetration test"},{"k":"e2","t":"Bug bounty program"},{"k":"e3","t":"Vulnerability scanning"},{"k":"e4","t":"Code review"}],"hint":"Who does it, when, and how broad: a team with a scope, a crowd with a reward, a scanner with a schedule, a colleague with a diff.","expl":"Four assurance activities, four shapes. A penetration test is a time-boxed, scoped engagement by contracted professionals who report privately. A bug bounty program is continuous and open to external researchers, paying per valid finding. Vulnerability scanning is automated and looks for known CVEs on hosts on a schedule. Code review is a human colleague reading the diff before merge, catching logic and injection flaws the author is blind to. They complement each other: scanning runs daily, review runs per change, the pentest runs per release cycle, the bounty runs always.","focus":"Scope, actors, cadence \u2014 that is how you tell the four apart in exam wording."}]};
</script>
<script>
/* ===== CyberPulse exam engine — part A: core, intro, timer, navigation ===== */
'use strict';
var DATA = window.__EXAM_DATA__;
var META = DATA.meta, EXS = DATA.exercises, KW = DATA.keywords;
var PTS_TOTAL = EXS.reduce(function (a, e) { return a + e.pts; }, 0);
var MIN_ELS_HINT_PENALTY = 0.9;

function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function idxArr(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
function clamp1(x) { return Math.round(x * 10) / 10; }

var S = {
  phase: 'intro', order: [], cur: 0, st: [], V: [],
  manualPause: false, checkPause: false,
  remain: 0, timerId: null, reported: false, user: '', theme: 'dark'
};
var RES = null;

function freshState() {
  return { status: 'new', ans: null, touched: false, checked: false, explSeen: false,
           earned: 0, els: null, sumS: '', sumC: '', hints: 0, termLog: [], path: [] };
}

/* ---------- shuffled per-attempt view state ---------- */
function buildViews() {
  S.V = EXS.map(function (ex) {
    var v = {};
    if (ex.type === 'qcm' || ex.type === 'multi') { v.ord = shuffle(idxArr(ex.choices.length)); }
    else if (ex.type === 'fill') { v.ord = shuffle(idxArr(ex.bank.length)); }
    else if (ex.type === 'match') { v.ord = shuffle(idxArr(ex.right.length)); }
    else if (ex.type === 'dragdrop') { v.iord = shuffle(idxArr(ex.items.length)); }
    else if (ex.type === 'order') {
      var o = shuffle(idxArr(ex.items.length));
      var same = true;
      for (var k = 0; k < o.length; k++) { if (o[k] !== k) { same = false; break; } }
      if (same && o.length > 1) o = shuffle(o);
      v.ord = o;
    } else if (ex.type === 'logviewer') {
      v.sub = {};
      var sb = ex.sub;
      if (sb.type === 'qcm' || sb.type === 'multi') v.sub.ord = shuffle(idxArr(sb.choices.length));
      else if (sb.type === 'fill') v.sub.ord = shuffle(idxArr(sb.bank.length));
    }
    else if (ex.type === 'branch') {
      v.bord = ex.steps.map(function (s) { return shuffle(idxArr(s.opts.length)); });
    }
    return v;
  });
}

/* ---------- screens ---------- */
function show(id) { ['scr-intro', 'scr-exam', 'scr-results'].forEach(function (s) { $(s).hidden = (s !== id); }); }

function renderIntro() {
  var w = $('intro-body'); w.textContent = '';
  var greet = el('div', 'dimtxt'); greet.id = 'greet';
  greet.textContent = S.user ? ('Candidate: ' + S.user) : 'Standalone mode — you can start right away.';
  w.appendChild(greet);
  var h = el('h1', 'h1', META.docTitle); w.appendChild(h);
  var sub = el('div', 'sub', META.docSub); w.appendChild(sub);

  var chips = el('div'); chips.className = 'btnrow';
  [{ t: EXS.length + ' exercises' }, { t: META.difficulty.toUpperCase() + ' severity' },
   { t: META.minutes + ' minutes' }, { t: 'Pass mark: ' + META.passMark + '%' },
   { t: PTS_TOTAL + ' points' }].forEach(function (c) { chips.appendChild(el('span', 'chip acc', c.t)); });
  w.appendChild(chips);

  var kp = el('div', 'panel'); kp.appendChild(el('div', 'blabel', 'Keywords covered — grouped by theme'));
  var grid = el('div', 'kwgrid');
  KW.forEach(function (k) {
    var c = el('div', 'kwcard');
    c.appendChild(el('div', 'kt', k.theme));
    var ul = el('ul');
    k.items.forEach(function (i) { ul.appendChild(el('li', null, i.k)); });
    c.appendChild(ul); grid.appendChild(c);
  });
  kp.appendChild(grid); w.appendChild(kp);

  var how = el('div', 'panel'); how.appendChild(el('div', 'blabel', 'How this exam works'));
  var ul = el('ul', 'rules');
  [
    'Realistic, scenario-based exercises: incident work, code review, logs, terminals, pipelines — not textbook quizzes.',
    'Every exercise has SCENARIO, QUESTION and ANSWERS blocks, so you always know what is being asked.',
    'Press Check to validate. It shows what was right (green), wrong (red) or missed (amber), locks the answer for scoring, and freezes the timer in review mode. The exercise stays fully visible. Press Next to resume the timer.',
    'Press Skip to jump to the next exercise. Skipped exercises are marked amber and excluded from both score points and total points at the end. You can go back to them while the timer runs.',
    'Multi-answer exercises give partial credit: each correct element earns its share. A wrong selection earns nothing but does not subtract.',
    'Hint button: reveals a nudge, never the answer. One hint costs 10% of that exercise\u2019s points.',
    'Two independent pauses: the manual Pause button hides the exercise, while the Check-pause (review mode) keeps everything visible. The timer runs only when both are cleared.',
    'After Check you can press Revise to change your answer, then Check again — each new Check freezes the timer again.',
    'Final score = earned points / points of the exercises you actually answered. ' + META.passMark + '% is a pass.'
  ].forEach(function (t) { ul.appendChild(el('li', null, t)); });
  how.appendChild(ul); w.appendChild(how);

  var b = el('button', 'btn primary'); b.id = 'b-start'; b.textContent = 'Start exam';
  b.addEventListener('click', startExam);
  w.appendChild(b);
}

/* ---------- exam lifecycle ---------- */
function startExam() {
  S.order = shuffle(idxArr(EXS.length));
  S.st = EXS.map(function () { return freshState(); });
  buildViews();
  S.cur = 0; S.remain = META.minutes * 60;
  S.manualPause = false; S.checkPause = false; S.reported = false; RES = null;
  S.phase = 'exam';
  show('scr-exam');
  renderTimer(); renderScore(); renderTheme();
  renderCur(); updatePauseUI(); startTimer();
}

function curI() { return S.order[S.cur]; }

function gotoPos(p) {
  S.checkPause = false;
  S.cur = p;
  renderCur(); updatePauseUI(); renderNav();
}

/* ---------- header rendering ---------- */
function renderTimer() {
  var m = Math.floor(S.remain / 60), s = S.remain % 60;
  var t = $('t-timer');
  t.textContent = 'Time ' + m + ':' + (s < 10 ? '0' : '') + s;
  t.classList.remove('warn', 'bad');
  if (S.remain <= 300) t.classList.add('bad');
  else if (S.remain <= 600) t.classList.add('warn');
}
function renderScore() {
  var e = 0; S.st.forEach(function (st) { if (st.checked) e += st.earned; });
  $('t-score').textContent = 'Score ' + clamp1(e) + ' / ' + PTS_TOTAL;
}
function renderProgress() {
  var done = 0; S.st.forEach(function (st) { if (st.checked) done++; });
  $('progfill').style.width = Math.round(done / EXS.length * 100) + '%';
  $('progtxt').textContent = done + ' of ' + EXS.length + ' checked';
}
function renderTheme() {
  var row = $('themerow'); row.textContent = '';
  KW.forEach(function (k) {
    var tot = 0, done = 0;
    EXS.forEach(function (ex, i) {
      if (ex.themes.indexOf(k.theme) >= 0) { tot++; if (S.st[i].checked) done++; }
    });
    row.appendChild(el('span', 'themechip', k.theme + ' '));
    var last = row.lastChild; var b = el('b', null, done + '/' + tot); last.appendChild(b);
  });
}

/* ---------- navigator ---------- */
function renderNav() {
  var g = $('navgrid'); g.textContent = '';
  S.order.forEach(function (ei, pos) {
    var st = S.st[ei];
    var b = el('button', 'nchip');
    b.textContent = String(pos + 1);
    b.setAttribute('aria-label', 'Go to exercise ' + (pos + 1) +
      (st.checked ? ', answered' : st.status === 'skipped' ? ', skipped' : ''));
    if (st.checked) { b.classList.add('checked'); b.appendChild(el('span', 'tag sr', 'done')); }
    else if (st.status === 'skipped') { b.classList.add('skipped'); b.appendChild(el('span', 'tag', 'S')); }
    else if (st.touched) { b.classList.add('seen'); }
    if (pos === S.cur) b.classList.add('cur');
    b.addEventListener('click', function () { gotoPos(pos); });
    g.appendChild(b);
  });
}

/* ---------- timer & pause ---------- */
function startTimer() {
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function () {
    if (S.phase !== 'exam' || S.manualPause || S.checkPause) return;
    S.remain--;
    if (S.remain <= 0) { S.remain = 0; renderTimer(); finishExam('time'); return; }
    renderTimer();
  }, 1000);
}
function updatePauseUI() {
  var parts = [];
  if (S.manualPause) parts.push('Paused (manual)');
  if (S.checkPause) parts.push('Timer paused \u2014 review mode');
  var t = $('t-status');
  t.textContent = ''; t.hidden = parts.length === 0;
  if (parts.length) {
    t.appendChild(el('span', 'dot', ''));
    t.appendChild(document.createTextNode(parts.join('  \u00b7  ')));
  }
  document.body.classList.toggle('manpause', S.manualPause);
}
function toggleManualPause() {
  if (S.phase !== 'exam') return;
  S.manualPause = !S.manualPause;
  $('b-pause').textContent = S.manualPause ? 'Resume' : 'Pause';
  $('b-pause').setAttribute('aria-pressed', String(S.manualPause));
  updatePauseUI();
}

/* ===== engine part B: exercise renderers ===== */
var TYPE_LABEL = {
  qcm: 'CHOOSE ONE ANSWER', multi: 'SELECT ALL THAT APPLY',
  fill: 'FILL IN THE BLANKS — pick a word for each gap',
  match: 'MATCH EACH ITEM — pick the partner for each row',
  dragdrop: 'DRAG THE ITEMS INTO THE RIGHT SLOT — or click a chip, then a slot',
  order: 'PUT THE STEPS IN THE RIGHT ORDER — use the arrows or drag',
  spot: 'CLICK EVERY LINE THAT CONTAINS THE FLAW, then Check',
  terminal: 'TYPE THE COMMAND IN THE TERMINAL, then Check',
  logviewer: 'ANALYZE THE LOGS (filter box above), THEN ANSWER BELOW',
  branch: 'WORK THE INCIDENT — choose one action at each step'
};

function blockInto(parent, labelCls, label, body) {
  var b = el('section', 'block ' + labelCls);
  b.appendChild(el('div', 'blabel', label));
  if (body) b.appendChild(body);
  parent.appendChild(b);
  return b;
}

function renderCur() {
  var i = curI(), ex = EXS[i], st = S.st[i];
  $('ex-num').textContent = 'Exercise ' + (S.cur + 1) + ' of ' + EXS.length;
  $('ex-title').textContent = ex.t;
  $('ex-kw').textContent = 'Theme: ' + ex.themes.join(' \u00b7 ') + '  |  Keywords: ' + ex.kw.join(', ') + '  |  ' + ex.pts + ' pts';
  var body = $('exbody'); body.textContent = '';
  blockInto(body, 'scenario', 'SCENARIO', null).appendChild(mkText(ex.scenario));
  blockInto(body, 'qb', 'QUESTION', null).appendChild(mkText(ex.question));
  var ansB = blockInto(body, 'ab', TYPE_LABEL[ex.type] || 'ANSWER', null);
  var holder = el('div', 'answrap'); ansB.appendChild(holder);
  RENDER[ex.type](ex, st, holder, S.V[i]);
  if (st.checked) { holder.classList.add('locked'); applyMarks(ex, st, holder); }
  buildFeedback(body, ex, st);
  if (st.checked) fillFeedback(ex, st);
  buildExpl(body, ex, st);
  if (st.hints > 0 && !st.checked) {
    var hz = el('div', 'hintp'); hz.id = 'hintzone';
    hz.appendChild(el('div', 't', 'Hint (\u221210% on this exercise)'));
    hz.appendChild(mkText(ex.hint));
    body.appendChild(hz);
  }
  syncButtons(); renderNav(); renderProgress();
}

function mkText(t) { var d = el('div', null, null); d.textContent = t; return d; }
function noticeBox(msg) { var n = el('div', 'notice'); n.textContent = msg; return n; }

/* ================= renderers ================= */
var RENDER = {};

RENDER.qcm = function (ex, st, box, v) {
  if (!st.ans) st.ans = null;
  v.ord.forEach(function (ci) {
    var lab = el('label', 'opt');
    var r = el('input'); r.type = 'radio'; r.name = 'q' + curI(); r.checked = (st.ans === ci);
    r.dataset.ci = ci;
    r.addEventListener('change', function () { st.ans = ci; st.touched = true; });
    lab.appendChild(r);
    lab.appendChild(el('span', null, ex.choices[ci]));
    box.appendChild(lab);
  });
};

RENDER.multi = function (ex, st, box, v) {
  if (!st.ans) st.ans = ex.choices.map(function () { return false; });
  v.ord.forEach(function (ci) {
    var lab = el('label', 'opt');
    var r = el('input'); r.type = 'checkbox'; r.checked = st.ans[ci];
    r.dataset.ci = ci;
    r.addEventListener('change', function () { st.ans[ci] = r.checked; st.touched = true; });
    lab.appendChild(r);
    lab.appendChild(el('span', null, ex.choices[ci]));
    box.appendChild(lab);
  });
};

RENDER.fill = function (ex, st, box, v) {
  if (!st.ans) { st.ans = {}; Object.keys(ex.blanks).forEach(function (b) { st.ans[b] = null; }); }
  var p = el('div', 'fillp');
  var parts = ex.text.split(/(\{\{b\d+\}\})/);
  parts.forEach(function (pt) {
    var m = pt.match(/^\{\{(b\d+)\}\}$/);
    if (m) {
      var sel = el('select'); sel.setAttribute('aria-label', 'gap ' + m[1]);
      var o0 = el('option'); o0.value = ''; o0.textContent = '\u2014 choose \u2014'; sel.appendChild(o0);
      v.ord.forEach(function (bi) {
        var o = el('option'); o.value = ex.bank[bi]; o.textContent = ex.bank[bi]; sel.appendChild(o);
      });
      sel.value = st.ans[m[1]] || '';
      sel.addEventListener('change', function () { st.ans[m[1]] = sel.value || null; st.touched = true; });
      sel.dataset.blank = m[1];
      p.appendChild(sel);
    } else if (pt) { p.appendChild(document.createTextNode(pt)); }
  });
  box.appendChild(p);
};

RENDER.match = function (ex, st, box, v) {
  if (!st.ans) { st.ans = {}; ex.left.forEach(function (l) { st.ans[l.k] = null; }); }
  ex.left.forEach(function (l) {
    var row = el('div', 'matchrow');
    row.appendChild(el('span', 'lt', l.t));
    var sel = el('select'); sel.setAttribute('aria-label', 'match for: ' + l.t);
    var o0 = el('option'); o0.value = ''; o0.textContent = '\u2014 pick partner \u2014'; sel.appendChild(o0);
    v.ord.forEach(function (ri) {
      var o = el('option'); o.value = ex.right[ri].t; o.textContent = ex.right[ri].t; sel.appendChild(o);
    });
    sel.value = st.ans[l.k] || '';
    sel.addEventListener('change', function () { st.ans[l.k] = sel.value || null; st.touched = true; });
    sel.dataset.leftk = l.k;
    row.appendChild(sel);
    box.appendChild(row);
  });
};

RENDER.dragdrop = function (ex, st, box, v) {
  if (!st.ans) { st.ans = {}; ex.slots.forEach(function (s) { st.ans[s.k] = null; }); }
  var pool = el('div', 'pool'); pool.id = 'pool' + curI();
  box.appendChild(el('div', 'dimtxt', 'Item bank:'));
  box.appendChild(pool);
  var slots = el('div', 'slots');
  ex.slots.forEach(function (s) {
    var sd = el('div', 'slot'); sd.dataset.slotk = s.k;
    sd.appendChild(el('div', 'slabel', s.t));
    sd.addEventListener('click', function () { placeItem(ex, st, s.k); });
    sd.addEventListener('dragover', function (e) { e.preventDefault(); sd.classList.add('over'); });
    sd.addEventListener('dragleave', function () { sd.classList.remove('over'); });
    sd.addEventListener('drop', function (e) {
      e.preventDefault(); sd.classList.remove('over');
      var k = e.dataTransfer.getData('text/plain');
      if (k) { selItem = k; placeItem(ex, st, s.k); }
    });
    slots.appendChild(sd);
  });
  box.appendChild(slots);
  drawDD(ex, st, pool, slots);
  box._redraw = function () { drawDD(ex, st, pool, slots); };
};
var selItem = null;
function drawDD(ex, st, pool, slots) {
  pool.textContent = '';
  var placed = Object.keys(st.ans).map(function (k) { return st.ans[k]; });
  v_iord(ex).forEach(function (ii) {
    var it = ex.items[ii];
    if (placed.indexOf(it.t) >= 0) return;
    var b = el('button', 'item'); b.textContent = it.t; b.draggable = true;
    if (selItem === it.t) b.classList.add('sel');
    b.addEventListener('click', function () { selItem = (selItem === it.t ? null : it.t); drawAll(ex, st); });
    b.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', it.t); });
    pool.appendChild(b);
  });
  if (!pool.children.length) pool.appendChild(el('span', 'ph', 'All items placed.'));
  Array.prototype.forEach.call(slots.children, function (sd) {
    var k = sd.dataset.slotk;
    Array.prototype.forEach.call(sd.querySelectorAll('.item'), function (n) { n.remove(); });
    var ph = sd.querySelector('.ph');
    if (st.ans[k]) {
      if (ph) ph.remove();
      var b = el('button', 'item'); b.textContent = st.ans[k];
      b.title = 'Click to remove back to bank';
      b.addEventListener('click', function (e) { e.stopPropagation(); st.ans[k] = null; st.touched = true; selItem = null; drawAll(ex, st); });
      sd.appendChild(b);
    } else if (!ph) { sd.appendChild(el('span', 'ph', 'Drop here')); }
  });
}
function drawAll(ex, st) {
  var h = $('exbody').querySelector('.answrap');
  if (h && h._redraw) h._redraw(); else if (h) { /* rebuild */ renderCur(); }
}
function v_iord(ex) { return S.V[curI()].iord; }
function placeItem(ex, st, slotK) {
  if (!selItem) { selItem = null; return; }
  Object.keys(st.ans).forEach(function (k) { if (st.ans[k] === selItem) st.ans[k] = null; });
  st.ans[slotK] = selItem; st.touched = true; selItem = null; drawAll(ex, st);
}

RENDER.order = function (ex, st, box, v) {
  if (!st.ans) st.ans = v.ord.slice();
  var ul = el('ul', 'olist');
  function redraw() {
    ul.textContent = '';
    st.ans.forEach(function (ii, pos) {
      var li = el('li'); li.draggable = true; li.dataset.pos = pos;
      li.appendChild(el('span', 'pos', String(pos + 1)));
      var mv = el('span', 'mv');
      var up = el('button', null, '\u2191'); up.setAttribute('aria-label', 'move up');
      up.addEventListener('click', function () { if (pos > 0) { var t = st.ans[pos - 1]; st.ans[pos - 1] = st.ans[pos]; st.ans[pos] = t; st.touched = true; redraw(); } });
      var dn = el('button', null, '\u2193'); dn.setAttribute('aria-label', 'move down');
      dn.addEventListener('click', function () { if (pos < st.ans.length - 1) { var t2 = st.ans[pos + 1]; st.ans[pos + 1] = st.ans[pos]; st.ans[pos] = t2; st.touched = true; redraw(); } });
      mv.appendChild(up); mv.appendChild(dn);
      li.appendChild(mv);
      li.appendChild(el('span', 'txt', ex.items[ii]));
      li.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(pos)); });
      li.addEventListener('dragover', function (e) { e.preventDefault(); });
      li.addEventListener('drop', function (e) {
        e.preventDefault();
        var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(from) || from === pos) return;
        var it = st.ans.splice(from, 1)[0]; st.ans.splice(pos, 0, it); st.touched = true; redraw();
      });
      ul.appendChild(li);
    });
  }
  redraw();
  box.appendChild(ul);
};

RENDER.spot = function (ex, st, box) {
  if (!st.ans) st.ans = ex.code.map(function () { return false; });
  var pre = el('div', 'code');
  ex.code.forEach(function (ln, li) {
    var b = el('button', 'linebtn');
    b.setAttribute('role', 'checkbox');
    b.setAttribute('aria-checked', String(st.ans[li]));
    b.appendChild(el('span', 'ln', String(li + 1)));
    b.appendChild(el('span', null, ln.t));
    if (st.ans[li]) b.classList.add('marked');
    var mk = el('span', 'mk', st.ans[li] ? '\u2691' : ''); b.appendChild(mk);
    b.addEventListener('click', function () {
      st.ans[li] = !st.ans[li]; st.touched = true;
      b.classList.toggle('marked', st.ans[li]);
      b.setAttribute('aria-checked', String(st.ans[li]));
      mk.textContent = st.ans[li] ? '\u2691' : '';
    });
    b.dataset.line = li;
    pre.appendChild(b);
  });
  box.appendChild(pre);
};

RENDER.terminal = function (ex, st, box) {
  if (!st.ans) st.ans = { cmd: null };
  var t = el('div', 'term');
  var out = el('div', 'termout'); out.id = 'tout' + curI();
  t.appendChild(out);
  var row = el('div', 'termin');
  row.appendChild(el('span', 'ps', 'analyst@lab:~$'));
  var inp = el('input'); inp.type = 'text'; inp.setAttribute('aria-label', 'terminal input');
  inp.placeholder = 'type a command, Enter to run (help lists commands)';
  row.appendChild(inp); t.appendChild(row);
  box.appendChild(t);
  if (!st.termLog.length) {
    termPrint(out, 'Lab shell \u2014 training sandbox. Files: ' + Object.keys(ex.fs).join(', '));
    termPrint(out, 'Type "help" for the command list.');
  } else { st.termLog.forEach(function (l) { termPrint(out, l); }); }
  function run() {
    var c = inp.value.trim();
    if (!c) return;
    inp.value = '';
    termPrint(out, 'analyst@lab:~$ ' + c);
    st.termLog.push('analyst@lab:~$ ' + c);
    st.ans.cmd = c; st.touched = true;
    var lo = c.toLowerCase();
    if (lo === 'clear') { st.termLog = []; out.textContent = ''; return; }
    if (lo === 'help') {
      var h = 'Commands: ls, cat FILE, grep PATTERN FILE, grep -r PATTERN DIR, clear';
      termPrint(out, h); st.termLog.push(h); return;
    }
    if (lo === 'ls') {
      var o = Object.keys(ex.fs).join('  ');
      termPrint(out, o); st.termLog.push(o); return;
    }
    if (/^cat\s+\S+/.test(lo)) {
      var f = c.split(/\s+/)[1];
      if (ex.fs[f]) { termPrint(out, ex.fs[f]); st.termLog.push(ex.fs[f]); }
      else { var e1 = 'cat: ' + f + ': No such file'; termPrint(out, e1); st.termLog.push(e1); }
      return;
    }
    if (/^grep\b/.test(lo)) {
      var hit = null;
      for (var i = 0; i < ex.success.length; i++) { if (new RegExp(ex.success[i].re, 'i').test(c)) { hit = ex.success[i]; break; } }
      if (hit) { termPrint(out, hit.out); st.termLog.push(hit.out); }
      else { var e2 = 'grep: no output for that syntax \u2014 check the pattern and the file name'; termPrint(out, e2); st.termLog.push(e2); }
      return;
    }
    var e3 = c.split(/\s+/)[0] + ': command not found (try help)';
    termPrint(out, e3); st.termLog.push(e3);
  }
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
};
function termPrint(out, s) { out.appendChild(document.createTextNode(s + '\n')); out.scrollTop = out.scrollHeight; }

RENDER.logviewer = function (ex, st, box, v) {
  if (!st.ans) st.ans = null;
  var bar = el('div', 'lvbar');
  var f = el('input'); f.type = 'search'; f.setAttribute('aria-label', 'filter log lines');
  f.placeholder = 'Filter\u2026 e.g. 500, /api, 203[.]0';
  bar.appendChild(f);
