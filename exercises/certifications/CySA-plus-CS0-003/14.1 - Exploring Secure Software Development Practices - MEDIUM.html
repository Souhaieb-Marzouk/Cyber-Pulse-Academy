RENDER.branch = function (ex, st, box) {
  if (!st.ans) st.ans = {};
  var wrap = el('div');
  box.appendChild(wrap);
  drawBranch(ex, st, wrap);
};

function drawBranch(ex, st, wrap) {
  wrap.textContent = '';
  var cur = 0, open = -1;
  for (var i = 0; i < ex.steps.length; i++) {
    if (st.ans[i] == null) { open = i; break; }
    var opt = ex.steps[i].opts[st.ans[i]];
    var doneStep = el('div', 'step');
    doneStep.appendChild(el('div', 'snum', 'Step ' + (i + 1)));
    doneStep.appendChild(mkText(ex.steps[i].text));
    var nv = el('div', 'note ' + (opt.ok ? 'note-good' : 'note-bad'));
    nv.textContent = (opt.ok ? '\u2713 ' : '\u2717 ') + opt.note;
    doneStep.appendChild(nv);
    wrap.appendChild(doneStep);
    cur = i + 1;
  }
  if (open >= 0 && ex.steps[open]) {
    var s = el('div', 'step');
    s.appendChild(el('div', 'snum', 'Step ' + (open + 1) + ' \u2014 your decision'));
    s.appendChild(mkText(ex.steps[open].text));
    var bo = el('div', 'bopts');
    var vv = S.V[curI()];
    var bord = (vv && vv.bord && vv.bord[open]) ? vv.bord[open] : idxArr(ex.steps[open].opts.length);
    bord.forEach(function (dataIdx) {
      var o = ex.steps[open].opts[dataIdx];
      var b = el('button', 'btn ghost'); b.textContent = o.t; b.style.textAlign = 'left';
      b.addEventListener('click', function () {
        st.ans[open] = dataIdx; st.touched = true;
        Object.keys(st.ans).forEach(function (k) { if (parseInt(k, 10) > open) delete st.ans[k]; });
        drawBranch(ex, st, wrap);
      });
      bo.appendChild(b);
    });
    s.appendChild(bo);
    wrap.appendChild(s);
  } else {
    wrap.appendChild(noticeBox('All decisions made. Press Check to score the incident response.'));
  }
}

/* ================= answer-state helpers ================= */
function hasAnyAnswer(ex, st) {
  if (!st.ans) return false;
  var a = st.ans;
  switch (ex.type) {
    case 'qcm': return a !== null;
    case 'multi': return a.some(Boolean);
    case 'fill': return Object.keys(a).some(function (k) { return a[k]; });
    case 'match': return Object.keys(a).some(function (k) { return a[k]; });
    case 'dragdrop': return Object.keys(a).some(function (k) { return a[k]; });
    case 'order': return st.touched;
    case 'spot': return a.some(Boolean);
    case 'terminal': return !!a.cmd;
    case 'branch': return Object.keys(a).length > 0;
    case 'logviewer': return hasAnyAnswer(ex.sub, st);
  }
  return false;
}

/* ===== engine part C: scoring, results, reporting, init ===== */

/* ---------- scoring ---------- */
function scoreEx(ex, st) {
  var a = st.ans, els = [], hits = 0, denom = 1, sumS = '', sumC = '';
  function row(state, label, note) { els.push({ state: state, label: label, note: note || '' }); }

  switch (ex.type) {
    case 'qcm': {
      denom = 1;
      var ok = a === ex.correct[0];
      if (ok) hits = 1;
      row(ok ? 'good' : 'bad', 'Your answer: ' + (a == null ? '(none)' : ex.choices[a]),
          'Correct: ' + ex.choices[ex.correct[0]]);
      sumS = a == null ? '(no answer)' : ex.choices[a];
      sumC = ex.choices[ex.correct[0]];
      break;
    }
    case 'multi': {
      denom = ex.correct.length;
      var picked = [], missed = [];
      ex.choices.forEach(function (c, ci) {
        var isC = ex.correct.indexOf(ci) >= 0, sel = a[ci];
        if (isC && sel) { hits++; row('good', c, 'Needed and selected.'); }
        else if (!isC && sel) { row('bad', c, 'Not needed \u2014 earns nothing, does not subtract.'); }
        else if (isC && !sel) { row('miss', c, 'Needed but missed.'); missed.push(c); }
        if (sel) picked.push(c);
      });
      sumS = picked.length ? picked.join(' | ') : '(nothing selected)';
      sumC = ex.correct.map(function (ci) { return ex.choices[ci]; }).join(' | ');
      break;
    }
    case 'fill': {
      var ks = Object.keys(ex.blanks);
      denom = ks.length;
      ks.forEach(function (b) {
        var good = a[b] === ex.blanks[b];
        if (good) hits++;
        row(good ? 'good' : (a[b] ? 'bad' : 'miss'), 'Gap ' + b.replace('b', '') + ': ' + (a[b] || '(empty)'),
            'Correct: ' + ex.blanks[b]);
        sumS += b.replace('b', '') + '=' + (a[b] || '\u2014') + '  ';
        sumC += b.replace('b', '') + '=' + ex.blanks[b] + '  ';
      });
      break;
    }
    case 'match': {
      denom = ex.left.length;
      ex.left.forEach(function (l) {
        var want = (ex.right.filter(function (r) { return r.k === l.k; })[0] || {}).t;
        var good = a[l.k] === want;
        if (good) hits++;
        row(good ? 'good' : (a[l.k] ? 'bad' : 'miss'), l.t + ' \u2192 ' + (a[l.k] || '(empty)'), 'Correct: ' + want);
        sumS += l.t + '\u2192' + (a[l.k] || '\u2014') + '  ';
        sumC += l.t + '\u2192' + want + '  ';
      });
      break;
    }
    case 'dragdrop': {
      denom = ex.slots.length;
      ex.slots.forEach(function (s) {
        var want = (ex.items.filter(function (it) { return it.k === s.k; })[0] || {}).t;
        var got = a[s.k];
        var good = got === want;
        if (good) hits++;
        row(good ? 'good' : (got ? 'bad' : 'miss'), s.t + ' \u2190 ' + (got || '(empty)'), 'Correct: ' + want);
        sumS += '[' + s.t + ': ' + (got || '\u2014') + ']  ';
        sumC += '[' + s.t + ': ' + want + ']  ';
      });
      break;
    }
    case 'order': {
      denom = a.length;
      a.forEach(function (ii, pos) {
        var good = ii === pos;
        if (good) hits++;
        row(good ? 'good' : 'bad', 'Position ' + (pos + 1) + ': ' + ex.items[ii], good ? '' : 'Correct here: ' + ex.items[pos]);
        sumS += (pos + 1) + '.' + ex.items[ii] + '  ';
      });
      sumC = ex.items.map(function (t, p) { return (p + 1) + '.' + t; }).join('  ');
      break;
    }
    case 'spot': {
      var badIdx = [];
      ex.code.forEach(function (ln, li) { if (ln.bad) badIdx.push(li); });
      denom = badIdx.length;
      badIdx.forEach(function (li) {
        var good = a[li];
        if (good) hits++;
        row(good ? 'good' : 'miss', 'Line ' + (li + 1) + (good ? ' (you flagged it)' : ' (you missed it)'), ex.code[li].why || '');
      });
      ex.code.forEach(function (ln, li) {
        if (!ln.bad && a[li]) row('bad', 'Line ' + (li + 1) + ' is not a flaw', 'This line is fine \u2014 flagging it earns nothing.');
      });
      sumS = 'Flagged lines: ' + (a.map(function (m, li) { return m ? (li + 1) : null; }).filter(Boolean).join(', ') || 'none');
      sumC = 'Flawed lines: ' + badIdx.map(function (li) { return li + 1; }).join(', ');
      break;
    }
    case 'terminal': {
      denom = ex.checks.length;
      var cmd = a.cmd || '';
      ex.checks.forEach(function (c) {
        var good = new RegExp(c.re, 'i').test(cmd);
        if (good) hits++;
        row(good ? 'good' : 'bad', c.label, good ? 'Requirement met.' : 'Not met by: ' + (cmd || '(no command run)'));
      });
      sumS = cmd || '(no command run)';
      sumC = ex.demoCmd;
      break;
    }
    case 'branch': {
      denom = ex.steps.length;
      for (var i = 0; i < ex.steps.length; i++) {
        if (a[i] == null) return { incomplete: true, msg: 'Finish the incident walkthrough first \u2014 choose an action for every step, then press Check.' };
        var goodOpt = ex.steps[i].opts[a[i]].ok;
        if (goodOpt) hits++;
        row(goodOpt ? 'good' : 'bad', 'Step ' + (i + 1) + ': ' + ex.steps[i].opts[a[i]].t,
            goodOpt ? 'Good call.' : 'Better: ' + (ex.steps[i].opts.filter(function (o) { return o.ok; })[0] || {}).t);
        sumS += 'S' + (i + 1) + ':' + ex.steps[i].opts[a[i]].t + '  ';
      }
      sumC = ex.steps.map(function (s2, p) { return 'S' + (p + 1) + ':' + (s2.opts.filter(function (o) { return o.ok; })[0] || {}).t; }).join('  ');
      break;
    }
    case 'logviewer': {
      var r = scoreEx(ex.sub, st);
      return r;
    }
  }
  return { hits: hits, denom: denom, els: els, sumS: sumS, sumC: sumC };
}

/* ---------- marks on DOM ---------- */
function applyMarks(ex, st, holder) {
  var a = st.ans;
  if (ex.type === 'qcm' || ex.type === 'multi') {
    Array.prototype.forEach.call(holder.querySelectorAll('input[data-ci]'), function (inp) {
      var ci = parseInt(inp.dataset.ci, 10);
      var lab = inp.closest('.opt');
      var isC = ex.type === 'qcm' ? ex.correct.indexOf(ci) >= 0 : ex.correct.indexOf(ci) >= 0;
      var sel = ex.type === 'qcm' ? (a === ci) : a[ci];
      lab.classList.remove('m-good', 'm-bad', 'm-miss');
      var tag = lab.querySelector('.st');
      if (!tag) { tag = el('span', 'st'); lab.appendChild(tag); }
      if (isC && sel) { lab.classList.add('m-good'); tag.textContent = '\u2713'; tag.className = 'st ic-good'; }
      else if (sel) { lab.classList.add('m-bad'); tag.textContent = '\u2717'; tag.className = 'st ic-bad'; }
      else if (isC) { lab.classList.add('m-miss'); tag.textContent = '\u26a0'; tag.className = 'st ic-miss'; }
    });
  } else if (ex.type === 'fill' || ex.type === 'match') {
    var selz = holder.querySelectorAll('select');
    Array.prototype.forEach.call(selz, function (sel) {
      var key = ex.type === 'fill' ? sel.dataset.blank : sel.dataset.leftk;
      var want = ex.type === 'fill' ? ex.blanks[key] :
        (ex.right.filter(function (r) { return r.k === key; })[0] || {}).t;
      sel.classList.remove('m-good', 'm-bad');
      sel.classList.add(a[key] === want ? 'm-good' : 'm-bad');
    });
  } else if (ex.type === 'dragdrop') {
    Array.prototype.forEach.call(holder.querySelectorAll('.slot'), function (sd) {
      var k = sd.dataset.slotk;
      var want = (ex.items.filter(function (it) { return it.k === k; })[0] || {}).t;
      sd.classList.remove('m-good', 'm-bad');
      sd.classList.add(a[k] === want ? 'm-good' : 'm-bad');
      var it2 = sd.querySelector('.item');
      if (it2) it2.classList.add(a[k] === want ? 'm-good' : 'm-bad');
    });
  } else if (ex.type === 'order') {
    Array.prototype.forEach.call(holder.querySelectorAll('.olist li'), function (li) {
      var pos = parseInt(li.dataset.pos, 10);
      li.classList.remove('m-good', 'm-bad');
      li.classList.add(a[pos] === pos ? 'm-good' : 'm-bad');
    });
  } else if (ex.type === 'spot') {
    Array.prototype.forEach.call(holder.querySelectorAll('.linebtn'), function (b) {
      var li = parseInt(b.dataset.line, 10);
      b.classList.remove('m-good', 'm-bad', 'm-miss');
      var mk = b.querySelector('.mk');
      if (ex.code[li].bad && a[li]) { b.classList.add('m-good'); mk.textContent = '\u2713'; mk.className = 'mk ic-good'; }
      else if (ex.code[li].bad) { b.classList.add('m-miss'); mk.textContent = '\u26a0'; mk.className = 'mk ic-miss'; }
      else if (a[li]) { b.classList.add('m-bad'); mk.textContent = '\u2717'; mk.className = 'mk ic-bad'; }
    });
  }
}

/* ---------- feedback & explanation panels ---------- */
function buildFeedback(body, ex, st) {
  var d = el('div', 'fb'); d.id = 'fbpanel'; d.hidden = true; d.setAttribute('aria-live', 'polite');
  body.appendChild(d);
}
function fillFeedback(ex, st) {
  var d = $('fbpanel'); d.textContent = ''; d.hidden = false;
  d.appendChild(el('div', 'blabel', 'Result \u2014 per element'));
  st.els.forEach(function (r) {
    var row = el('div', 'fbrow');
    var ic = r.state === 'good' ? ['\u2713', 'ic ic-good'] : r.state === 'bad' ? ['\u2717', 'ic ic-bad'] : ['\u26a0', 'ic ic-miss'];
    row.appendChild(el('span', ic[1], ic[0]));
    var t = el('span'); t.appendChild(document.createTextNode(r.label + (r.note ? ' \u2014 ' + r.note : '')));
    row.appendChild(t);
    d.appendChild(row);
  });
  var sc = el('div', 'fbscore');
  var earned = st.earned, max = ex.pts;
  var label = earned >= max ? 'full' : earned <= 0 ? 'zero' : 'partial';
  sc.textContent = 'You earned ' + clamp1(earned) + ' / ' + max + ' points on this exercise (' + label +
    (st.hints ? ', includes \u221210% hint cost' : '') + ').';
  d.appendChild(sc);
}
function buildExpl(body, ex, st) {
  var old = document.getElementById('explzone'); if (old) old.remove();
  var d = el('div'); d.id = 'explzone';
  if (st.explSeen || st.checked) {
    var e1 = el('div', 'expl');
    e1.appendChild(el('div', 't', 'Why \u2014 explanation'));
    e1.appendChild(mkText(ex.expl));
    d.appendChild(e1);
    if (st.checked && st.earned < ex.pts && ex.focus) {
      var e2 = el('div', 'focus');
      e2.appendChild(el('div', 't', 'What to focus on'));
      e2.appendChild(mkText(ex.focus));
      d.appendChild(e2);
    }
  }
  body.appendChild(d);
}

/* ---------- footer / buttons ---------- */
function syncButtons() {
  var i = curI(), st = S.st[i];
  $('b-prev').disabled = S.cur === 0;
  $('b-hint').disabled = st.checked || st.hints > 0;
  $('b-check').disabled = st.checked;
  $('b-skip').disabled = st.checked;
  $('b-revise').disabled = !st.checked;
  $('b-next').textContent = S.cur === EXS.length - 1 ? 'Next (last)' : 'Next';
}
function showHint() {
  var i = curI(), st = S.st[i], ex = EXS[i];
  if (st.hints > 0 || st.checked) return;
  st.hints = 1;
  var old = $('hintzone'); if (old) old.remove();
  var h = el('div', 'hintp'); h.id = 'hintzone';
  h.appendChild(el('div', 't', 'Hint (\u221210% on this exercise)'));
  h.appendChild(mkText(ex.hint));
  $('exbody').appendChild(h);
  syncButtons();
}
function onCheck() {
  if (S.phase !== 'exam') return;
  var i = curI(), ex = EXS[i], st = S.st[i];
  if (st.checked) return;
  var res = scoreEx(ex, st);
  if (res.incomplete) {
    var oldn = $('chknotice'); if (oldn) oldn.remove();
    var n = noticeBox(res.msg); n.id = 'chknotice';
    $('exbody').appendChild(n);
    return;
  }
  st.checked = true; st.status = 'checked';
  st.els = res.els; st.sumS = res.sumS; st.sumC = res.sumC;
  st.earned = clamp1(ex.pts * res.hits / res.denom * (st.hints ? MIN_ELS_HINT_PENALTY : 1));
  fillFeedback(ex, st);
  var holder = $('exbody').querySelector('.answrap');
  holder.classList.add('locked');
  applyMarks(ex, st, holder);
  buildExpl($('exbody'), ex, st);
  var hz = $('hintzone'); if (hz) hz.remove();
  var nn = $('chknotice'); if (nn) nn.remove();
  renderScore(); renderTheme(); renderNav(); renderProgress();
  S.checkPause = true; updatePauseUI();
  syncButtons();
}
function onRevise() {
  var i = curI(), st = S.st[i];
  if (!st.checked) return;
  st.checked = false; st.explSeen = true; st.status = st.status === 'skipped' ? 'skipped' : 'new';
  renderScore(); renderCur();
}
function onSkip() {
  var i = curI(), st = S.st[i];
  if (!st.checked) { st.status = 'skipped'; }
  renderNav();
  if (S.cur < EXS.length - 1) gotoPos(S.cur + 1); else openSubmitModal();
}

/* ---------- submit & finish ---------- */
function openSubmitModal() {
  var checked = 0, answeredU = 0, excluded = [];
  S.st.forEach(function (st, i) {
    if (st.checked) checked++;
    else if (st.status !== 'skipped' && hasAnyAnswer(EXS[i], st)) answeredU++;
    else excluded.push(i + 1);
  });
  var m = $('modal'); m.classList.add('open');
  var b = $('modal-body'); b.textContent = '';
  if (checked + answeredU === 0) {
    b.appendChild(el('h3', null, 'Nothing to submit yet'));
    b.appendChild(mkText('You answered at least one exercise? No \u2014 every exercise is still empty or skipped. Answer at least one exercise before submitting.'));
    var ok1 = $('modal-ok'); ok1.textContent = 'Back to the exam'; ok1.dataset.mode = 'close';
    return;
  }
  b.appendChild(el('h3', null, 'Submit the exam?'));
  b.appendChild(mkText('Checked and scored: ' + checked + '. Answered but not yet checked: ' + answeredU +
    ' (they will be checked automatically now). Not answered / skipped: ' + excluded.length +
    (excluded.length ? ' \u2014 exercises ' + excluded.join(', ') + ' will be excluded from both score and total.' : '')));
  var ok = $('modal-ok'); ok.textContent = 'Submit final answers'; ok.dataset.mode = 'submit';
}
function closeModal() { $('modal').classList.remove('open'); }

function finishExam(reason) {
  if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
  S.manualPause = false; S.checkPause = false;
  document.body.classList.remove('manpause'); updatePauseUI();
  EXS.forEach(function (ex, i) {
    var st = S.st[i];
    if (!st.checked && st.status !== 'skipped' && hasAnyAnswer(ex, st)) {
      var r = scoreEx(ex, st);
      if (!r.incomplete) {
        st.checked = true; st.status = 'checked'; st.els = r.els; st.sumS = r.sumS; st.sumC = r.sumC;
        st.earned = clamp1(ex.pts * r.hits / r.denom * (st.hints ? MIN_ELS_HINT_PENALTY : 1));
      }
    }
  });
  var inc = [], skip = [];
  EXS.forEach(function (ex, i) { (S.st[i].checked ? inc : skip).push(i); });
  var earned = 0, max = 0;
  inc.forEach(function (i) { earned += S.st[i].earned; max += EXS[i].pts; });
  var eR = Math.round(earned);
  var percent = max ? Math.round(eR / max * 100) : 0;
  RES = { inc: inc, skip: skip, earned: earned, earnedR: eR, max: max, percent: percent,
          passed: percent >= META.passMark, reason: reason };
  S.phase = 'results';
  renderResults();
  show('scr-results');
}

/* ---------- results ---------- */
function renderResults() {
  var w = $('res-body'); w.textContent = '';
  var head = el('div', 'panel bigscore');
  var big = el('div', 'scorebig', '0%'); big.id = 'bigscore';
  head.appendChild(big);
  var v = el('div', 'verdict ' + (RES.passed ? 'pass' : 'fail'),
    RES.passed ? '\u2713 PASS' : '\u2717 FAIL \u2014 retake required');
  v.id = 'verdict';
  head.appendChild(v);
  w.appendChild(head);
  var line = el('div', 'dimtxt');
  line.style.textAlign = 'center';
  line.textContent = 'Scored over answered exercises only: ' + RES.earnedR + ' of ' + RES.max +
    ' points \u00b7 ' + RES.percent + '% \u00b7 pass mark ' + META.passMark + '%' +
    (RES.reason === 'time' ? ' \u00b7 time ran out \u2014 the exam closed automatically.' : '');
  w.appendChild(line);
  var cert = el('div', 'panel');
  if (RES.passed) {
    cert.appendChild(el('div', 'blabel', 'Certificate of chapter mastery'));
    cert.appendChild(mkText('Well done, ' + (S.user || 'analyst') + '. You reached ' + RES.percent + '% on \u201c' +
      META.docTitle + '\u201d (' + META.difficulty + '). This chapter\u2019s keywords are yours: keep the report below for revision.'));
  } else {
    cert.appendChild(el('div', 'blabel', 'Not this time'));
    cert.appendChild(mkText('You needed ' + META.passMark + '% and scored ' + RES.percent + '%. Retake the exam \u2014 questions and choices are reshuffled, so practice the weak themes in the report below first.'));
  }
  w.appendChild(cert);

  if (RES.skip.length) {
    var sp = el('div', 'panel');
    sp.appendChild(el('div', 'blabel', 'Skipped \u2014 excluded from scoring'));
    sp.appendChild(mkText('Exercises ' + RES.skip.map(function (i) { return S.order.indexOf(i) + 1; }).join(', ') +
      ' were skipped and never answered. Their points are in neither the numerator nor the denominator of your score.'));
    w.appendChild(sp);
  }

  w.appendChild(el('h2', null, 'Per-exercise report'));
  RES.inc.concat(RES.skip).forEach(function (i) {
    var st = S.st[i], ex = EXS[i];
    var row = el('div', 'resrow');
    var rh = el('div', 'rhead');
    rh.appendChild(el('span', null, '#' + (S.order.indexOf(i) + 1) + ' ' + ex.t));
    var lab, labCls;
    if (!st.checked) { lab = 'skipped \u2014 not counted'; labCls = 'skipped'; }
    else if (st.earned >= ex.pts) { lab = 'full'; labCls = 'full'; }
    else if (st.earned <= 0) { lab = 'zero'; labCls = 'zero'; }
    else { lab = 'partial'; labCls = 'partial'; }
    rh.appendChild(el('span', 'lab ' + labCls, lab));
    rh.appendChild(el('span', 'chip', clamp1(st.earned) + ' / ' + ex.pts + ' pts'));
    row.appendChild(rh);
    if (st.checked) {
      row.appendChild(rline('Your answer', st.sumS));
      row.appendChild(rline('Correct', st.sumC));
    } else {
      row.appendChild(rline('Status', 'Skipped without answering \u2014 excluded from score and total.'));
    }
    row.appendChild(rline('Why', ex.expl));
    if (st.checked && st.earned < ex.pts && ex.focus) row.appendChild(rline('Focus', ex.focus));
    w.appendChild(row);
  });
  var b = el('button', 'btn primary'); b.id = 'b-retake'; b.textContent = 'Retake exam';
  b.addEventListener('click', function () { startExam(); });
  w.appendChild(b);

  /* count-up, then report exactly once */
  var target = RES.percent, cur = 0, t0 = null, dur = 900;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    cur = Math.round(target * p);
    big.textContent = cur + '%';
    if (p < 1) requestAnimationFrame(function (ts2) { step(ts2, big, target); });
    else { big.textContent = target + '%'; reportScore(RES.earnedR, RES.max); }
  }
  if (reduced) { big.textContent = target + '%'; reportScore(RES.earnedR, RES.max); }
  else requestAnimationFrame(function (ts) { step(ts, big, target); });
}
function rline(k, v) {
  var d = el('div', 'rline');
  var b = el('b', null, k + ': ');
  d.appendChild(b); d.appendChild(document.createTextNode(v));
  return d;
}

/* ---------- score reporting (site contract) ---------- */
function reportScore(correct, total) {
  if (S.reported) return;
  S.reported = true;
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= META.passMark
    }, location.origin);
  } catch (e) { /* opened directly \u2014 nothing to report to */ }
}

/* ---------- site handshake ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  S.user = event.data.username || '';
  var g = $('greet');
  if (g) g.textContent = S.user ? ('Candidate: ' + S.user) : g.textContent;
});

/* ---------- boot ---------- */
function boot() {
  $('b-pause').addEventListener('click', toggleManualPause);
  $('b-submit').addEventListener('click', openSubmitModal);
  $('b-prev').addEventListener('click', function () { if (S.cur > 0) gotoPos(S.cur - 1); });
  $('b-next').addEventListener('click', function () {
    if (S.cur < EXS.length - 1) gotoPos(S.cur + 1); else openSubmitModal();
  });
  $('b-hint').addEventListener('click', showHint);
  $('b-check').addEventListener('click', onCheck);
  $('b-skip').addEventListener('click', onSkip);
  $('b-revise').addEventListener('click', onRevise);
  $('modal-cancel').addEventListener('click', closeModal);
  $('modal-ok').addEventListener('click', function () {
    var mode = $('modal-ok').dataset.mode;
    closeModal();
    if (mode === 'submit') finishExam('submit');
  });
  renderIntro(); show('scr-intro');
}

/* ---------- debug / test driver ---------- */
window.__exam = {
  start: startExam,
  goto: function (i) { gotoPos(Math.max(0, Math.min(i, EXS.length - 1))); },
  check: onCheck, skip: onSkip, revise: onRevise,
  submit: openSubmitModal, finish: finishExam,
  answer: applyAnswer,
  state: function () {
    return {
      phase: S.phase, cur: S.cur, order: S.order.slice(), remain: S.remain,
      checkPause: S.checkPause, manualPause: S.manualPause, reported: S.reported,
      res: RES ? { earnedR: RES.earnedR, max: RES.max, percent: RES.percent, passed: RES.passed,
                   incN: RES.inc.length, skipN: RES.skip.length } : null,
      st: S.st.map(function (st) { return { status: st.status, checked: st.checked, earned: st.earned, hints: st.hints }; })
    };
  },
  ex: function (i) { return EXS[i]; },
  setRemain: function (s) { S.remain = s; renderTimer(); }
};

function applyAnswer(i, mode) {
  var ex = EXS[i], st = S.st[i], v = S.V[i];
  function pickWrong(n) { return shuffle(idxArr(n).filter(function (x) { return ex.correct.indexOf(x) < 0; }))[0]; }
  switch (ex.type) {
    case 'qcm':
      st.ans = mode === 'correct' ? ex.correct[0] : pickWrong(ex.choices.length); break;
    case 'multi':
      st.ans = ex.choices.map(function (_, ci) {
        var isC = ex.correct.indexOf(ci) >= 0;
        if (mode === 'correct') return isC;
        if (mode === 'partial') return (isC && ci === ex.correct[0]) || (!isC && ci === (ex.correct[ex.correct.length - 1] + 1) % ex.choices.length);
        return !isC && ci < 2;
      }); break;
    case 'fill':
      st.ans = {};
      Object.keys(ex.blanks).forEach(function (b, bi) {
        var vals = Object.keys(ex.blanks).map(function (k) { return ex.blanks[k]; });
        var wrongs = ex.bank.filter(function (w) { return ex.blanks[b] !== w; });
        st.ans[b] = mode === 'correct' ? ex.blanks[b] : (mode === 'partial' && bi % 2 === 0 ? ex.blanks[b] : wrongs[0]);
      }); break;
    case 'match':
      st.ans = {};
      ex.left.forEach(function (l, li) {
        var want = (ex.right.filter(function (r) { return r.k === l.k; })[0] || {}).t;
        var wrong = ex.right[(li + 1) % ex.right.length].t;
        st.ans[l.k] = mode === 'correct' ? want : (mode === 'partial' && li % 2 === 0 ? want : wrong);
      }); break;
    case 'dragdrop':
      st.ans = {};
      ex.slots.forEach(function (s, si) {
        var want = (ex.items.filter(function (it) { return it.k === s.k; })[0] || {}).t;
        var wrong = ex.items[(si + 1) % ex.items.length].t;
        st.ans[s.k] = mode === 'correct' ? want : (mode === 'partial' && si % 2 === 0 ? want : wrong);
      }); break;
    case 'order':
      st.ans = idxArr(ex.items.length);
      if (mode !== 'correct') { var t = st.ans[0]; st.ans[0] = st.ans[1]; st.ans[1] = t; }
      break;
    case 'spot':
      st.ans = ex.code.map(function (ln) { return mode === 'correct' ? !!ln.bad : false; }); break;
    case 'terminal':
      st.ans = { cmd: mode === 'correct' ? ex.demoCmd : 'echo hello' }; break;
    case 'branch':
      st.ans = {};
      ex.steps.forEach(function (s2, si) {
        var okI = s2.opts.findIndex(function (o) { return o.ok; });
        st.ans[si] = mode === 'correct' ? okI : (okI + 1) % s2.opts.length;
      }); break;
    case 'logviewer': applyAnswerSub(ex.sub, st, mode, v.sub); break;
  }
  st.touched = true;
}
function applyAnswerSub(sb, st, mode, v) {
  if (sb.type === 'qcm') { st.ans = mode === 'correct' ? sb.correct[0] : (sb.correct[0] + 1) % sb.choices.length; }
  else if (sb.type === 'multi') {
    st.ans = sb.choices.map(function (_, ci) {
      var isC = sb.correct.indexOf(ci) >= 0;
      return mode === 'correct' ? isC : (isC && ci === sb.correct[0]);
    });
  } else if (sb.type === 'fill') {
    st.ans = {};
    Object.keys(sb.blanks).forEach(function (b) { st.ans[b] = mode === 'correct' ? sb.blanks[b] : sb.bank[0]; });
  }
  st.touched = true;
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
