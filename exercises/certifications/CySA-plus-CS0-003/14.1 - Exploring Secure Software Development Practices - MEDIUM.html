*{box-sizing:border-box}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.blabel{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:#0a1120;background:var(--acc);border-radius:6px;padding:3px 10px;margin-bottom:8px;text-transform:uppercase}
.qb .blabel{background:var(--warn)}
.ab .blabel{background:var(--good)}
.scenario{border-left:4px solid var(--acc)}
.qb{border-left:4px solid var(--warn)}
.ab{border-left:4px solid var(--good)}
.dimtxt{color:var(--dim)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#182647;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s,background .12s}
.btn:hover{background:#1e3075}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#04121f}
.btn.primary:hover{background:var(--acc)}
.btn.good{background:#0b3b2d;border-color:var(--good);color:#c9ffe9}
.btn.warnb{background:#3b2f0b;border-color:var(--warn);color:#ffe9b3}
.btn.ghost{background:transparent}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.chip.bad{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.chip.acc{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
.chip.good{border-color:var(--good);color:var(--good);background:var(--goodbg)}
.spacer{flex:1}
.progwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
.prog{height:10px;border-radius:99px;background:#0b1424;overflow:hidden;border:1px solid var(--line)}
.prog>div{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--good));transition:width .4s}
.themerow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.themechip{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim)}
.themechip b{color:var(--ink)}
.pstatus{margin-top:8px;font-weight:700;color:var(--warn)}
.pstatus .dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--warn);margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- navigator ---------- */
nav.nav{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px}
nav.nav summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;gap:8px}
.navgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nchip{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:#0b1424;color:var(--dim);font-weight:700;font-size:14px;cursor:pointer;position:relative}
.nchip.seen{color:var(--acc);border-color:var(--acc);background:var(--accbg)}
.nchip.checked{color:#052e1f;background:var(--good);border-color:var(--good)}
.nchip.skipped{color:#3a2b00;background:var(--warn);border-color:var(--warn)}
.nchip.cur{box-shadow:0 0 0 3px var(--acc)}
.nchip .tag{position:absolute;bottom:1px;right:3px;font-size:9px}

.exhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-top:14px}
.exhead h2{margin:0;font-size:19px}
.kwline{font-size:13px;color:var(--dim)}

/* ---------- choices ---------- */
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:7px 0;cursor:pointer;font-size:15.5px;color:var(--ink);min-height:44px}
.opt:hover{border-color:var(--acc)}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--acc2);flex:none}
.opt .st{margin-left:auto;font-weight:800;flex:none}
.m-good{border-color:var(--good)!important;background:var(--goodbg)!important}
.m-bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.m-miss{border-color:var(--warn)!important;background:var(--warnbg)!important}
.locked{pointer-events:none}
.locked .opt,.locked select,.locked .linebtn,.locked .item,.locked .slot,.locked .mv{cursor:default}

/* ---------- fill / match selects ---------- */
.fillp{font-size:16px;line-height:2.1}
.fillp select,.matchrow select{font:inherit;background:#0b1424;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:44px;max-width:100%;margin:0 2px}
.fillp select.m-good,.matchrow select.m-good{border-color:var(--good);background:var(--goodbg)}
.fillp select.m-bad,.matchrow select.m-bad{border-color:var(--bad);background:var(--badbg)}
.matchrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.matchrow .lt{flex:1 1 240px;font-weight:600}

/* ---------- drag & drop ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px;min-height:56px;margin-bottom:10px}
.item{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:9px;border:1px solid var(--acc2);background:#0e2a44;color:var(--ink);font-weight:600;cursor:grab;font-size:14.5px}
.item.sel{box-shadow:0 0 0 3px var(--acc)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.slot{background:var(--panel2);border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:64px}
.slot.over{border-color:var(--acc);background:var(--accbg)}
.slot .slabel{font-size:13px;font-weight:800;color:var(--acc);letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase}
.slot .ph{color:#5b6b8c;font-size:14px}

/* ---------- order ---------- */
.olist{list-style:none;margin:0;padding:0}
.olist li{display:flex;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:7px 0}
.olist .mv{display:flex;gap:4px}
.olist .mv button{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:#182647;color:var(--ink);font-size:16px;cursor:pointer}
.olist .txt{flex:1}
.olist .pos{font-weight:800;color:var(--acc);width:26px;text-align:center;flex:none}
.olist li[draggable=true]{cursor:grab}

.code{background:#060c18;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:14px}
.linebtn{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;color:#cfe0ff;padding:4px 6px;margin:1px 0;cursor:pointer;font-family:var(--mono);font-size:14px;min-height:44px;align-items:flex-start}
.linebtn:hover{border-color:var(--acc)}
.linebtn .ln{color:#57708f;min-width:30px;flex:none}
.linebtn.marked{border-color:var(--warn);background:var(--warnbg)}
.linebtn .mk{margin-left:auto;font-weight:800;flex:none}

.term{background:#04080f;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:14px}
.termout{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;color:#c9e3d4;margin:0 0 8px}
.termin{display:flex;gap:8px;align-items:center}
.termin .ps{color:var(--good);font-weight:700;flex:none}
.termin input{flex:1;background:#0a1424;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:14px;padding:9px 10px;min-height:44px}
.treq{margin-top:8px}
.treq .reqrow{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:14.5px}

/* ---------- log viewer ---------- */
.lvbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.lvbar input{flex:1;min-width:200px;background:#0a1424;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:14px;padding:9px 10px;min-height:44px}
.lvcount{font-size:13px;color:var(--dim)}
.logs{background:#04080f;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:14px;max-height:340px;overflow:auto}
.logline{white-space:pre-wrap;word-break:break-word;padding:1px 0;color:#b9c9e6}
.logline .lnum{color:#44587a;margin-right:8px}
.lvl-err{color:#ff9d9d}.lvl-warn{color:#ffd479}.lvl-ok{color:#7ce7b6}.lvl-req{color:#8fd3ff}

/* ---------- branch ---------- */
.step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.step .snum{font-size:12.5px;font-weight:800;color:var(--acc);letter-spacing:.06em;text-transform:uppercase}

.note-bad{background:var(--badbg);border:1px solid var(--bad)}
.bopts{display:flex;flex-direction:column;gap:8px;margin-top:10px}

.fb{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2)}
.fb .fbrow{display:flex;gap:8px;margin:4px 0;font-size:14.5px;align-items:flex-start}

.ic-good{color:var(--good)}.ic-bad{color:var(--bad)}.ic-miss{color:var(--warn)}
.fbscore{font-weight:800;margin-top:8px}

.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.kwcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

.rules{padding-left:20px;color:var(--dim)}
.rules li{margin:5px 0}

.bigscore{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;padding:18px}
.scorebig{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums}
.verdict{font-size:22px;font-weight:900;padding:10px 22px;border-radius:12px}

.verdict.fail{background:var(--badbg);border:2px solid var(--bad);color:var(--bad)}
.resrow{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.resrow .rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.lab{font-size:12px;font-weight:800;letter-spacing:.05em;border-radius:6px;padding:2px 8px;text-transform:uppercase}
.lab.full{background:var(--good);color:#04231a}
.lab.partial{background:var(--warn);color:#332600}
.lab.zero{background:var(--bad);color:#3d0a0a}
.lab.skipped{background:#33415e;color:#cdd9f2}
.rline{margin:5px 0;font-size:14.5px;color:var(--dim)}
.rline b{color:var(--ink)}

#exwrap{position:relative}
body.manpause #exbody{filter:blur(7px);pointer-events:none;user-select:none}

.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:560px;width:100%}

@media (max-width:640px){
  .wrap{padding:10px 8px 30px}
  .scorebig{font-size:40px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
