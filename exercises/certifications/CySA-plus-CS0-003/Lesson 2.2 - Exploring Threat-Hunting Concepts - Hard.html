    case "terminal":{
      h+='<div class="small dim" style="margin-bottom:6px">Type the command in the terminal below and press <span class="kbd">Enter</span> (or click away and press Check my answer).</div>';
      h+='<div class="btnrow" style="margin-top:0"><span class="badge lime">terminal input is the answer</span></div>';
      break;
    }
    case "log":{
      h+=innerOpts({options:e.inner.options,multi:!!e.multi},r,locked,"");
      break;
    }
    case "dual":{
      h+='<div class="blk" style="background:#0b1a2c;border-left:4px solid var(--blue);margin:8px 0">'+
         '<span class="tag" style="background:#12283f;color:#7dd3fc"><i class="dot" style="background:#7dd3fc"></i>'+esc(e.alabel||"Blue team")+'</span>'+
         '<div class="qtext" style="font-size:15px">'+e.a.q+'</div>'+innerOpts({options:e.a.options,multi:e.a.multi,id:e.id+"_a"},(r?r.a:null),locked,"a")+'</div>';
      h+='<div class="blk" style="background:#2a0f16;border-left:4px solid var(--pink);margin:8px 0">'+
         '<span class="tag" style="background:#3d1220;color:#f9a8d4"><i class="dot" style="background:#f9a8d4"></i>'+esc(e.blabel||"Red team")+'</span>'+
         '<div class="qtext" style="font-size:15px">'+e.b.q+'</div>'+innerOpts({options:e.b.options,multi:e.b.multi,id:e.id+"_b"},(r?r.b:null),locked,"b")+'</div>';
      break;
    }
    case "queue":{
      h+='<div class="small dim" style="margin-bottom:4px">Set the correct disposition for every alert. All rows are graded (partial credit per row).</div>';
      h+='<table class="qt"><thead><tr><th style="width:70px">Alert</th><th>What the sensor saw</th><th style="width:240px">Your disposition</th></tr></thead><tbody>';
      e.alerts.forEach(function(a){
        var val=(r&&r[a.id])||"";
        var cls="";
        if(locked)cls=(val===a.answer)?"ok":"no";
        var list=a.opts||e.options;
        h+='<tr><td><b>'+esc(a.short)+'</b><div class="dim2 small">'+esc(a.sev||"")+'</div></td><td>'+a.t+'</td><td>'+
           '<select data-alert="'+a.id+'" class="'+cls+'"><option value="">-- choose --</option>';
        list.forEach(function(o){h+='<option'+(val===o?" selected":"")+'>'+esc(o)+'</option>';});
        h+='</select>'+(locked&&val!==a.answer?'<div class="small" style="color:var(--red);margin-top:4px">correct: '+esc(a.answer)+'</div>':'')+'</td></tr>';
      });
      h+='</tbody></table>';
      break;
    }
    case "spot":{
      h+='<div class="small dim" style="margin-bottom:6px">Click every line that is wrong or missing. Click again to unselect. Each correct line earns its share of the points; a wrong pick earns nothing and never subtracts.</div>';
      h+='<ul class="slines" id="slines">';
      e.lines.forEach(function(l,ix){
        var picked=Array.isArray(r)&&r.indexOf(ix)>=0;
        var cls="";
        if(locked){
          if(l.bad&&picked)cls="ok";else if(!l.bad&&picked)cls="no";else if(l.bad&&!picked)cls="miss";
        }else if(picked)cls="pick";
        h+='<li class="'+cls+'" data-line="'+ix+'"><span class="no">'+l.n+'</span>'+(locked?'<span class="stg" aria-hidden="true">'+stateGlyph(cls)+'</span>':'')+'<span>'+l.t+'</span></li>';
      });
      h+='</ul>';
      break;
    }
    case "branch":{
      h+=branchArea(e,locked);
      break;
    }
  }
  return h;
}

function innerOpts(e,r,locked,tag){
  var multi=!!e.multi,h='<div class="opts'+(multi?" multi":"")+'" data-inner="'+tag+'" role="group" aria-label="'+(multi?"Select every correct statement":"Choose one answer")+'">';
  e.options.forEach(function(o,ix){
    var sel=multi?(Array.isArray(r)&&r.indexOf(ix)>=0):(r===ix);
    var cls="opt"+(multi?" multi":"")+(sel?" sel":"");
    if(locked){if(o.c)cls+=" ok";else if(sel)cls+=" no";}
    var mk2=locked?(o.c?"&#10003;":(sel?"&#10007;":"&#183;")):(sel?"&#10003;":"");
    h+='<div class="'+cls+'" data-i="'+ix+'" data-inneropt="'+tag+'" tabindex="0" role="'+(multi?"checkbox":"radio")+'" aria-checked="'+(sel?"true":"false")+'"><span class="mark" aria-hidden="true">'+mk2+'</span><span class="lbl">'+String.fromCharCode(65+ix)+'.</span><span>'+o.t+'</span></div>';
  });
  h+='</div>';
  return h;
}

function logBlock(e){
  var h='<div class="blk art" style="border-left-color:var(--lime)"><span class="tag" style="background:#1b2408;color:var(--lime)"><i class="dot" style="background:var(--lime)"></i>Log viewer &mdash; '+esc(e.logName||"search results")+'</span>';
  h+='<div class="logview"><div class="logbar"><span class="dim2 small">filter</span><input id="logfilter" placeholder="type to filter lines (substring match, e.g. 4624, beacon)">&nbsp;<span class="dim2 small" id="logcount"></span></div><div class="loglines" id="loglines">';
  e.log.forEach(function(l,ix){
    h+='<div class="ln '+(l.lv||"info")+'" data-raw="'+esc(l.t).replace(/"/g,"&quot;")+'"><span class="no">'+(ix+1)+'</span><span>'+hl(l.t)+'</span></div>';
  });
  h+='</div></div></div>';
  return h;
}

function termBlock(e,locked){
  var r=S.resp[e.id]||"";
  var h='<div class="blk art" style="border-left-color:var(--green)"><span class="tag" style="background:#0d3a1c;color:var(--green)"><i class="dot" style="background:var(--green)"></i>Terminal &mdash; '+esc(e.host||"soc-hunt-01")+'</span>';
  h+='<div class="term"><div class="tbar"><span>&#9679;</span><span>'+esc(e.host||"soc-hunt-01")+'</span><span class="dim2">'+esc(e.shellUser||"analyst")+'@'+esc(e.shellHost||"soc-hunt-01")+'</span></div>';
  h+='<div class="tbody" id="termbody">'+e.termIntro+'</div>';
  if(!locked){
    h+='<div class="tline"><span class="ps1">'+esc(e.prompt||"analyst@soc-hunt-01:~$")+'</span><input id="terminput" autocomplete="off" spellcheck="false" value="'+esc(r)+'"></div>';
  }else{
    h+='<div class="tline"><span class="ps1">'+esc(e.prompt||"analyst@soc-hunt-01:~$")+'</span><span class="mono">'+esc(r)+'</span></div>';
  }
  h+='</div></div>';
  return h;
}

function branchArea(e,locked){
  var cur=branchCursor(e);
  var chosen=S.resp[e.id]||{};
  var h='<div class="small dim" style="margin-bottom:6px">Follow the incident workflow. Every decision is scored and earns its share of the points, and feedback appears right away.</div>';
  var done=false;
  e.steps.forEach(function(st){
    var pick=chosen[st.id];
    if(pick===undefined)return;
    var o=st.options[pick];
    h+='<div class="step"><div class="sq">'+esc(st.q)+'</div>';
    h+='<div class="small" style="margin-top:5px">Your choice: <b>'+esc(o.t)+'</b></div>';
    h+='<div class="bfb '+(o.ok?"ok":"no")+'">'+(o.ok?"&#10004; ":"&#10008; ")+o.fb+'</div></div>';
  });
  var st=cur?byId(e.steps,cur):null;
  if(!st){
    h+='<div class="step"><div class="sq" style="color:var(--green)">Scenario complete &mdash; all decisions recorded.</div><div class="small dim">Press Check my answer to score the workflow.</div></div>';
    done=true;
  }else{
    h+='<div class="step"><div class="sq">'+esc(st.q)+'</div><div class="opts" style="margin-top:8px">';
    st.options.forEach(function(o,ix){
      h+='<div class="opt" data-bstep="'+st.id+'" data-bopt="'+ix+'" tabindex="0" role="button"><span class="mark">&#9656;</span><span>'+o.t+'</span></div>';
    });
    h+='</div></div>';
  }
  h+='<div class="small dim">'+(done?"":"Decisions recorded: "+Object.keys(chosen).length+" / "+e.steps.length)+'</div>';
  return h;
}
function nextStep(e,stepId,pick){
  var st=byId(e.steps,stepId);
  if(!st)return null;
  var o=st.options[pick];
  if(!o||!o.next)return null;
  return o.next;
}
/* where the learner is in a branching scenario: undefined = not started, null/id = current step */
function branchCursor(e){
  var chosen=S.resp[e.id]||{};
  var cur=S.branch[e.id];
  if(cur===undefined)cur=e.start;
  var guard=0;
  while(cur&&chosen[cur]!==undefined&&guard++<100){cur=nextStep(e,cur,chosen[cur]);}
  return cur||null;
}

/* ------------------------------ binding ------------------------------ */
function setR(e,val){S.resp[e.id]=val;updateHud();renderNav();}

function bindQuestion(e,locked){
  var r=S.resp[e.id];
  $("btn-prev").onclick=function(){goto(S.idx-1);};
  $("btn-next").onclick=function(){S.pauseCheck=false;goto(S.idx+1);};
  $("btn-skip").onclick=function(){doSkip(e);};
  var hb=$("btn-hint");
  if(hb)hb.onclick=function(){
    if((S.hints[e.id]||0)>=MAXHINTS)return;
    S.hints[e.id]=(S.hints[e.id]||0)+1;
    renderQuestion();updateHud();
  };
  var cb=$("btn-check");
  if(cb)cb.onclick=function(){
    if(e.type==="branch"&&branchCursor(e)){flash("Finish the workflow first: keep choosing until the scenario is complete.");return;}
    if(!hasAnswer(e,S.resp[e.id])){flash("Give an answer first, or press Skip.");return;}
    S.skipped[e.id]=false;S.autoSkipped[e.id]=false;S.locked[e.id]=true;S.pauseCheck=true;
    renderQuestion();renderNav();updateHud();
  };
  var rb=$("btn-revise");
  if(rb)rb.onclick=function(){S.locked[e.id]=false;renderQuestion();};
  /* ---- log filter ---- */
  var lf=$("logfilter");
  if(lf){
    var upd=function(){
      var q=lf.value.trim(),rg=null,n=0;
      if(q){try{rg=new RegExp(regEsc(q),"i");}catch(err){rg=null;}}
      var lines=document.querySelectorAll("#loglines .ln");
      Array.prototype.forEach.call(lines,function(x){
        var raw=x.getAttribute("data-raw")||"",span=x.querySelector("span:last-child");
        var show=!rg||rg.test(raw);
        x.style.display=show?"flex":"none";
        x.classList.toggle("hit",!!rg&&show);
        if(show){
          n++;
          span.innerHTML=(rg&&show)?hl(raw).replace(new RegExp("("+regEsc(esc(q))+")","gi"),'<span class="hitmark">$1</span>'):hl(raw);
        }
      });
      var c=$("logcount");if(c)c.textContent=n+" line(s)";
    };
    lf.oninput=upd;lf.onkeyup=upd;upd();
  }
  /* ---- terminal ---- */
  var ti=$("terminput");
  if(ti){
    ti.onkeydown=function(ev){
      if(ev.key==="Enter"){
        ev.preventDefault();
        setR(e,ti.value);
        var cmd=ti.value.trim();
        var ok=false;
        (e.accept||[]).forEach(function(rx){try{if(new RegExp(rx,"i").test(cmd))ok=true;}catch(err){}});
        var tb=$("termbody");
        if(tb){
          tb.innerHTML+= "\n"+esc((e.prompt||"$")+" "+cmd)+"\n"+(ok?(e.successOutput||"# command accepted"):(e.failOutput||"# command not recognised \u2014 check the tool and its flags"))+"\n";
        }
        ti.value="";
        ti.focus();
      }
    };
  }
  /* ---- generic option clicking (mcq, multi, log, dual, branch) ---- */
  document.querySelectorAll(".opt[data-bopt]").forEach(function(node){
    var open=function(){
      if(S.locked[e.id])return;
      var step=node.getAttribute("data-bstep"),ix=parseInt(node.getAttribute("data-bopt"),10);
      var rr=S.resp[e.id]||{};rr[step]=ix;S.resp[e.id]=rr;
      S.branch[e.id]=nextStep(e,step,ix);
      renderQuestion();updateHud();renderNav();
    };
    node.onclick=open;
    node.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "||ev.key==="Spacebar"){ev.preventDefault();open();}};
  });
  document.querySelectorAll(".opt[data-inneropt]").forEach(function(node){
    if(locked)return;
    var choose=function(){
      var tag=node.getAttribute("data-inneropt"),ix=parseInt(node.getAttribute("data-i"),10);
      if(e.type==="dual"){
        var rr=S.resp[e.id]||{a:null,b:null};
        var sub=(tag==="a")?e.a:e.b;
        if(sub.multi){
          var arr=Array.isArray(rr[tag])?rr[tag].slice():[];
          var p=arr.indexOf(ix);if(p>=0)arr.splice(p,1);else arr.push(ix);
          rr[tag]=arr;
        }else rr[tag]=ix;
        setR(e,rr);
      }else{
        if(e.multi){
          var a2=Array.isArray(S.resp[e.id])?S.resp[e.id].slice():[];
          var q=a2.indexOf(ix);if(q>=0)a2.splice(q,1);else a2.push(ix);
          setR(e,a2);
        }else setR(e,ix);
      }
      renderQuestion();
    };
    node.onclick=choose;
    node.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "||ev.key==="Spacebar"){ev.preventDefault();choose();}};
  });
  var opts=$("opts");
  if(opts&&!locked&&(e.type==="mcq"||e.type==="multi")){
    Array.prototype.forEach.call(opts.querySelectorAll(".opt"),function(node){
      if(node.getAttribute("data-inneropt"))return;
      var pick=function(){
        var ix=parseInt(node.getAttribute("data-i"),10);
        if(e.type==="multi"){
          var a=Array.isArray(S.resp[e.id])?S.resp[e.id].slice():[];
          var p=a.indexOf(ix);if(p>=0)a.splice(p,1);else a.push(ix);
          setR(e,a);
        }else setR(e,ix);
        renderQuestion();
      };
      node.onclick=pick;
      node.onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "||ev.key==="Spacebar"){ev.preventDefault();pick();}};
    });
  }
  /* ---- drag & drop / tap-to-place for dd, match, fill ---- */
  bindDrag(e,locked);
  /* ---- order / rank ---- */
  var ol=$("olist");
  if(ol&&!locked){
    var getOrder=function(){return Array.prototype.map.call(ol.querySelectorAll("li"),function(li){return li.getAttribute("data-id");});};
    var commit=function(){S.touched[e.id]=true;setR(e,getOrder());renderQuestion();};
    ol.querySelectorAll("li .mv button").forEach(function(b){
      b.onclick=function(ev){
        ev.stopPropagation();
        var arr=getOrder(),up=b.getAttribute("data-up"),dn=b.getAttribute("data-down");
        if(up!==null){var i=parseInt(up,10);if(i>0){var t=arr[i-1];arr[i-1]=arr[i];arr[i]=t;}}
        else{var j=parseInt(dn,10);if(j<arr.length-1){var t2=arr[j+1];arr[j+1]=arr[j];arr[j]=t2;}}
        S.touched[e.id]=true;setR(e,arr);renderQuestion();
      };
    });
    var dragIx=null;
    ol.querySelectorAll("li").forEach(function(li){
      li.addEventListener("dragstart",function(ev){dragIx=li;li.classList.add("dragging");ev.dataTransfer.setData("text/plain","x");});
      li.addEventListener("dragend",function(){if(dragIx)dragIx.classList.remove("dragging");dragIx=null;});
      li.addEventListener("dragover",function(ev){ev.preventDefault();li.classList.add("over");});
      li.addEventListener("dragleave",function(){li.classList.remove("over");});
      li.addEventListener("drop",function(ev){
        ev.preventDefault();li.classList.remove("over");
        if(!dragIx||dragIx===li)return;
        var arr=getOrder(),from=arr.indexOf(dragIx.getAttribute("data-id")),to=arr.indexOf(li.getAttribute("data-id"));
        arr.splice(to,0,arr.splice(from,1)[0]);
        S.touched[e.id]=true;setR(e,arr);renderQuestion();
      });
    });
  }
  /* ---- spot the mistake ---- */
  var sl=$("slines");
  if(sl&&!locked){
    sl.querySelectorAll("li").forEach(function(li){
      li.onclick=function(){
        var ix=parseInt(li.getAttribute("data-line"),10);
        var a=Array.isArray(S.resp[e.id])?S.resp[e.id].slice():[];
        var p=a.indexOf(ix);if(p>=0)a.splice(p,1);else a.push(ix);
        setR(e,a);renderQuestion();
      };
    });
  }
  /* ---- queue selects ---- */
  document.querySelectorAll("select[data-alert]").forEach(function(sel){
    if(locked)return;
    sel.onchange=function(){
      var rr=S.resp[e.id]||{};rr[sel.getAttribute("data-alert")]=sel.value;setR(e,rr);
    };
  });
}

function doSkip(e){
  S.skipped[e.id]=true;
  S.locked[e.id]=false;
  if(S.idx<S.order.length-1)goto(S.idx+1);else{renderQuestion();renderNav();updateHud();}
}

/* generic drag + tap placement */
var SEL={chip:null};
function bindDrag(e,locked){
  SEL.chip=null;
  if(locked){return;}
  var chips=document.querySelectorAll('.chip[draggable="true"]');
  Array.prototype.forEach.call(chips,function(c){
    c.addEventListener("dragstart",function(ev){
      SEL.chip=c;c.classList.add("dragging");
      try{ev.dataTransfer.setData("text/plain",c.getAttribute("data-item")||c.getAttribute("data-left")||c.getAttribute("data-word"));}catch(err){}
    });
    c.addEventListener("dragend",function(){c.classList.remove("dragging");});
    c.addEventListener("click",function(ev){
      if(ev.target.getAttribute&&ev.target.getAttribute("data-remove"))return;
      document.querySelectorAll(".chip.sel").forEach(function(x){x.classList.remove("sel");});
      if(SEL.chip===c){SEL.chip=null;c.classList.remove("sel");}
      else{SEL.chip=c;c.classList.add("sel");}
    });
    c.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"||ev.key===" "||ev.key==="Spacebar"){ev.preventDefault();c.click();}
    });
  });
  document.querySelectorAll("[data-remove]").forEach(function(x){
    x.onclick=function(ev){
      ev.stopPropagation();
      var id=x.getAttribute("data-remove");
      var rr=S.resp[e.id]||{};delete rr[id];S.touched[e.id]=true;setR(e,rr);renderQuestion();
    };
  });
  document.querySelectorAll("[data-unmatch]").forEach(function(x){
    x.onclick=function(ev){
      ev.stopPropagation();
      var id=x.getAttribute("data-unmatch");
      var rr=S.resp[e.id]||{};delete rr[id];S.touched[e.id]=true;setR(e,rr);renderQuestion();
    };
  });
  var zones=[].slice.call(document.querySelectorAll('[data-drop]')).concat([].slice.call(document.querySelectorAll('[data-kind="slot"]')));
  zones.forEach(function(z){
    var place=function(){
      if(!SEL.chip)return;
      var kind=SEL.chip.getAttribute("data-kind"),target=z.getAttribute("data-drop")||z.getAttribute("data-slot");
      var rr=S.resp[e.id]||{};
      if(kind==="dd"){
        rr[SEL.chip.getAttribute("data-item")]=target;
      }else if(kind==="match"){
        /* if target already taken, free it */
        Object.keys(rr).forEach(function(k){if(rr[k]===target)delete rr[k];});
        rr[SEL.chip.getAttribute("data-left")]=target;
      }else if(kind==="word"){
        Object.keys(rr).forEach(function(k){if(rr[k]===SEL.chip.getAttribute("data-word"))delete rr[k];});
        rr[target]=SEL.chip.getAttribute("data-word");
      }
      S.touched[e.id]=true;SEL.chip=null;setR(e,rr);renderQuestion();
    };
    z.addEventListener("dragover",function(ev){ev.preventDefault();z.classList.add("over");});
    z.addEventListener("dragleave",function(){z.classList.remove("over");});
    z.addEventListener("drop",function(ev){ev.preventDefault();z.classList.remove("over");place();});
    z.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "||ev.key==="Spacebar"){ev.preventDefault();z.click();}});
    z.addEventListener("click",function(ev){
      if(ev.target.classList&&(ev.target.classList.contains("x")))return;
      if(SEL.chip)place();
      else{
        /* emptying a slot or bucket by tapping it */
        var rr=S.resp[e.id]||{},changed=false;
        if(z.getAttribute("data-kind")==="slot"){
          var k=z.getAttribute("data-slot");if(rr[k]){delete rr[k];changed=true;}
        }else if(z.getAttribute("data-drop")){
          var t=z.getAttribute("data-drop");
          Object.keys(rr).forEach(function(kk){if(rr[kk]===t){delete rr[kk];changed=true;}});
        }
        if(changed){S.touched[e.id]=true;setR(e,rr);renderQuestion();}
      }
    });
  });
}

/* ------------------------------ feedback ------------------------------ */
function showFeedback(e,quiet){
  var g=grade(e,S.resp[e.id]);
  var allRight=g.f>=0.999, part=!allRight&&g.f>0;
  var pts=e.pts||1, hf=hintFactor(e), earned=pts*g.f*hf;
  var h='<div class="blk fb '+(allRight?"ok":"no")+'"><span class="tag" style="background:'+(allRight?"#0d3a1c":"#3a1015")+';color:'+(allRight?"var(--green)":"var(--red)")+'">'+
        (allRight?"&#10004; Full credit":(part?"&#9680; Partial credit":"&#10008; No credit"))+'</span>';
  h+='<div class="answerbox"><b>Points on this exercise:</b> '+earned.toFixed(1)+' / '+pts+' &nbsp;'+(allRight?"(every element correct)":(part?"(partly correct - wrong picks earn nothing but do not subtract)":"(no correct element)"))+'</div>';
  if(g.lines.length){
    h+='<div style="margin-top:6px">';
    g.lines.forEach(function(l){h+='<div class="small" style="margin:3px 0;color:'+(l.ok?"var(--green)":(l.no?"var(--red)":"var(--dim)"))+'">'+(l.ok?"&#10004; ":l.no?"&#10008; ":"&#8226; ")+l.t+'</div>';});
    h+='</div>';
  }
  h+='<div style="margin-top:10px"><b>Why:</b> '+e.explain+'</div>';
  if(!allRight&&e.focus)h+='<div class="tip"><b>Focus on:</b> '+e.focus+'</div>';
  if(S.hints[e.id])h+='<div class="small dim" style="margin-top:6px">Hint penalty applied: &minus;'+pct(1-hf)+'% of this exercise&rsquo;s points.</div>';
  if(S.pauseCheck&&!S.submitted)h+='<div class="warnbox"><b>&#10073;&#10073; Timer paused - review mode.</b> The clock is stopped and this exercise stays visible. Press <b>Next</b> when you are ready to restart the timer.</div>';
  h+='</div>';
  var fb=$("fb");
  if(fb)fb.innerHTML=h;
  if(!quiet&&fb&&fb.scrollIntoView)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
/* ------------------------------ finish / results ------------------------------ */
function finish(auto){
  if(!S||S.submitted)return;
  var un=0;
  S.order.forEach(function(e){if(!S.skipped[e.id]&&!hasAnswer(e,S.resp[e.id]))un++;});
  if(!auto&&un>0){showSubmitConfirm(un);return;}
  doFinish(auto);
}
function doFinish(auto){
  if(!S||S.submitted)return;
  S.order.forEach(function(e){
    if(!hasAnswer(e,S.resp[e.id])){S.skipped[e.id]=true;S.autoSkipped[e.id]=true;}
  });
  var sc=calcScore();
  if(sc.max<=0&&!auto){flash("You skipped every exercise, or left them all blank. Answer at least one exercise before submitting.");return;}
  S.submitted=true;S.pauseCheck=false;S.pauseManual=false;clearInterval(S.timer);
  renderResults(auto);
}function renderResults(auto){
  var sc=calcScore();
  var total=Math.round(sc.max), score=Math.round(sc.earned);
  var percent=total>0?Math.round((score/total)*100):0;
  var pass=total>0&&percent>=PASS;
  var skippedList=S.order.filter(function(e){return S.skipped[e.id];});
  var groups={full:[],partial:[],zero:[]};
  S.order.forEach(function(e){
    if(S.skipped[e.id])return;
    if(!hasAnswer(e,S.resp[e.id]))return;
    var g=grade(e,S.resp[e.id]);
    if(g.f>=0.999)groups.full.push({e:e,g:g});
    else if(g.f>0)groups.partial.push({e:e,g:g});
    else groups.zero.push({e:e,g:g});
  });
  var h="";
  h+='<div class="cert '+(pass?"":"fail")+'">'+
     '<div class="badge '+(pass?"green":"red")+'">'+LEVEL.name+' severity - standalone exam</div>'+
     '<div class="big" style="color:'+(pass?"var(--green)":"var(--red)")+'">'+(pass?"PASS":"FAIL")+'</div>'+
     '<div class="pct">'+score+' / '+total+' points &nbsp;&bull;&nbsp; '+percent+'% (pass mark '+PASS+'%)</div>'+
     (auto?'<div class="badge amber" style="margin-top:10px">TIME EXPIRED - exam submitted automatically</div>':'')+
     '<div class="row" style="justify-content:center;margin-top:14px">'+
       '<div class="stat center"><b>'+groups.full.length+'</b><span class="dim small">full credit</span></div>'+
       '<div class="stat center"><b>'+groups.partial.length+'</b><span class="dim small">partial credit</span></div>'+
       '<div class="stat center"><b>'+groups.zero.length+'</b><span class="dim small">zero credit</span></div>'+
       '<div class="stat center"><b>'+skippedList.length+'</b><span class="dim small">skipped - not scored</span></div>'+
       '<div class="stat center"><b>'+(sc.hintLoss>0?"&minus;":"")+sc.hintLoss.toFixed(1)+'</b><span class="dim small">points lost to hints</span></div>'+
     '</div>'+
     '<div class="small dim" style="margin-top:10px">Partial points are kept in the per-exercise report. The figures above are the rounded ones reported to the site: '+score+' / '+total+' points, '+percent+'%, passed: '+(pass?"yes":"no")+'.</div>';
  if(pass){
    h+='<div style="margin-top:16px;border-top:1px dashed var(--line2);padding-top:12px">'+
       '<div class="mono small dim">CERTIFICATE OF COMPLETION &mdash; PRACTICE EXAM</div>'+
       '<h2 style="margin:6px 0">CySA+ CS0-003 &mdash; Objectives 1.4 &amp; 3.3</h2>'+
       '<div class="small">Threat intelligence and threat-hunting concepts &bull; preparation and post-incident activity phases of the incident management life cycle</div>'+
       (LEARNER.username?'<div class="small" style="margin-top:6px">Awarded to <b>'+esc(LEARNER.username)+'</b></div>':'')+
       '<div class="mono small" style="margin-top:10px">Level: '+LEVEL.name+' &nbsp;|&nbsp; Score: '+percent+'% &nbsp;|&nbsp; Result: PASS</div></div>';
  }else{
    h+='<div class="warnbox" style="margin-top:14px"><b>You must retake this exam.</b> You need '+PASS+'% and you scored '+percent+'%. '+
       'Read the detailed report below, then press <b>Retake exam</b>. Questions and answer choices are reshuffled every attempt.</div>';
  }
  h+='</div>';
  if(total<=0){
    h+='<div class="warnbox"><b>Nothing was scored.</b> Every exercise was skipped or left blank, and those exercises are removed from both the points earned and the maximum, so there is no percentage to compute. Answer at least one exercise on your next attempt.</div>';
  }
  if(skippedList.length){
    h+='<div class="card"><h3>Skipped exercises &mdash; excluded from scoring</h3>'+
       '<div class="small dim">These exercises are marked skipped or were left blank, so their points were removed from <i>both</i> the earned total and the maximum total. Your percentage is points earned &divide; points of the <b>'+sc.answered+'</b> exercise'+(sc.answered===1?'':'s')+' you answered. Read their explanations anyway &mdash; that is where the easy marks usually are.</div><ul class="tight small">';
    skippedList.forEach(function(e){
      h+='<li><b>'+esc(e.title||e.id)+'</b> <span class="dim">('+esc(e.theme||"")+', '+TYPE_LABEL[e.type]+') &mdash; '+(S.autoSkipped[e.id]?"left blank when you submitted":"you pressed Skip")+' &mdash; not counted</span></li>';
    });
    h+='</ul></div>';
  }
  h+='<div class="card"><h3>Theme results</h3>';
  var tm=themeStats(),keys=Object.keys(tm);
  if(!keys.length)h+='<div class="small dim">Nothing scored yet.</div>';
  keys.forEach(function(t){
    var v=tm[t].m>0?tm[t].p/tm[t].m:0;
    h+='<div class="tbar"><div class="tl"><span>'+esc(t)+'</span><span>'+pct(v)+'% ('+tm[t].p.toFixed(1)+'/'+tm[t].m+' pts, skipped excluded)</span></div><div class="tb"><i style="width:'+pct(v)+'%"></i></div></div>';
  });
  h+='</div>';
  h+='<div class="card"><h3>Detailed report &mdash; every exercise</h3>'+
     '<div class="small dim">Every exercise is explained, including the ones you skipped. Each entry shows the points you earned out of the maximum, with the label full credit, partial credit, zero credit or skipped.</div>';
  var n=0;
  S.order.forEach(function(e){
    n++;
    var skipped=!!S.skipped[e.id], ans=hasAnswer(e,S.resp[e.id]), g=grade(e,S.resp[e.id]);
    var pts=e.pts||1, ear=(skipped||!ans)?0:pts*g.f*hintFactor(e);
    var label=skipped?(S.autoSkipped[e.id]?"LEFT BLANK - NOT SCORED":"SKIPPED - NOT SCORED"):(!ans?"NOT ANSWERED - NOT SCORED":(g.f>=0.999?"FULL CREDIT":(g.f>0?"PARTIAL CREDIT":"ZERO CREDIT")));
    var cls=skipped?"skip":(g.f>=0.999?"ok":(g.f>0?"part":"no"));
    var badge=skipped?"amber":(g.f>=0.999?"green":(g.f>0?"amber":"red"));
    h+='<div class="rep '+cls+'"><div class="rhead"><span class="badge grey">Q'+n+'</span>'+
       '<span class="badge '+badge+'">'+label+'</span>'+
       '<span class="badge violet">'+esc(e.theme||"")+'</span><span class="badge lime">'+TYPE_LABEL[e.type]+'</span>'+
       '<span class="badge grey">'+ear.toFixed(1)+' / '+pts+' points</span>'+
       (S.hints[e.id]?'<span class="badge amber">'+S.hints[e.id]+' hint (-'+pct(1-hintFactor(e))+'%)</span>':'')+
       (isMulti(e)?'<span class="badge grey">multi-answer - partial credit</span>':'')+
       '</div>';
    h+='<div><b>'+esc(e.title||e.id)+'</b></div>';
    h+='<div class="answerbox"><b>Correct answer:</b> '+correctText(e)+'</div>';
    if(!skipped)h+='<div class="answerbox"><b>Your answer:</b> '+givenText(e,S.resp[e.id])+'</div>';
    h+='<div class="small" style="margin-top:6px"><b>Why:</b> '+e.explain+'</div>';
    if(!skipped&&g.f<0.999)h+='<div class="tip"><b>Focus on:</b> '+(e.focus||"Re-read the scenario artefacts and link each clue to the concept being tested.")+'</div>';
    if(skipped)h+='<div class="tip"><b>This one did not count.</b> Learn it now: '+(e.focus||"Review the related keywords in the panel at the top of the exam.")+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="card center"><button class="btn primary" id="btn-retake">Retake exam (questions and choices reshuffled)</button>'+
     ' <button class="btn ghost" id="btn-top">Back to the top</button></div>';
  $("app").innerHTML='<div id="screen-results">'+h+'</div>';
  $("btn-retake").onclick=function(){startExam();};
  $("btn-top").onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};
  reportScore();   /* exactly one message per completed attempt */
  window.scrollTo(0,0);
}
/* ------------------------------ site integration ------------------------------ */
/* The site assigns the exercise number itself from the button the learner pressed, so
   no batch number is ever sent. Only the certificate topicId identifies this score. */
function reportScore(){
  if(REPORTED)return;
  REPORTED=true;
  var sc=calcScore();
  var total=Math.round(sc.max);
  var score=Math.round(sc.earned);
  var percent=total>0?Math.round((score/total)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:META.topicId,
      score:score,
      total:total,
      percent:percent,
      passed:percent>=PASS
    },location.origin);
  }catch(e){
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}

function applyHandshake(d){
  if(typeof d.username==="string")LEARNER.username=d.username.slice(0,40);
  if(typeof d.country==="string")LEARNER.country=d.country.slice(0,2).toUpperCase();
  if(typeof d.locale==="string")LEARNER.locale=d.locale.slice(0,8);
  /* This file ships a single dark theme, so a light request is recorded but not applied. */
  if(d.theme==="light"||d.theme==="dark")LEARNER.theme=d.theme;
  if(!S)renderIntro();
}
window.addEventListener("message",function(event){
  var d=event.data;
  if(!d||typeof d!=="object")return;
  if(d.type!=="CYBERPULSE_INIT"&&d.type!=="CYBERMASTERY_INIT")return;
  applyHandshake(d);
});

/* ------------------------------ boot ------------------------------ */
(function boot(){
  renderIntro();
  window.scrollTo(0,0);
})();

</script>
