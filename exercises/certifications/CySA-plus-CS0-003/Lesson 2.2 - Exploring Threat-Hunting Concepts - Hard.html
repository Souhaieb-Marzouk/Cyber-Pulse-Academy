<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CySA+ — Chapter 02 — HARD practice exam (v5.0)</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "cysa-plus",
  "chapter": 2,
  "title": "Threat Hunting, Threat Intelligence & Incident Management — HARD (v5.0)",
  "difficulty": "hard",
  "questionCount": 37,
  "estimatedMinutes": 57,
  "passMark": 70
}
</script>
<style>
:root{
  --bg:#060a12; --bg2:#0a111c; --panel:#0d1522; --panel2:#111c2c; --panel3:#16243a;
  --line:#1d2c42; --line2:#28405e; --txt:#dbe6f5; --dim:#8ea3bd; --dim2:#63799a;
  --cyan:#22d3ee; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  --violet:#a78bfa; --pink:#f472b6; --lime:#a3e635;
  --mcq:#22d3ee; --dd:#a78bfa; --ord:#f472b6; --log:#a3e635;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 12% -8%, #10233b 0%, transparent 60%),
    radial-gradient(900px 500px at 92% 4%, #1a1230 0%, transparent 55%),
    var(--bg);
  color:var(--txt); font-family:var(--sans); font-size:15px; line-height:1.55;
  min-height:100vh;
}
#app{max-width:1220px;margin:0 auto;padding:18px 16px 70px}
a{color:var(--cyan)}
h1,h2,h3,h4{line-height:1.22;margin:0 0 8px}
h1{font-size:26px;letter-spacing:.2px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:6px 0}
code,kbd{font-family:var(--mono);font-size:13px}
.mono{font-family:var(--mono);font-size:13px}
.dim{color:var(--dim)}
.dim2{color:var(--dim2)}
.small{font-size:12.5px}
.center{text-align:center}
.hidden{display:none !important}

/* ---------- generic panels ---------- */
.card{
  background:linear-gradient(180deg,var(--panel) 0%,var(--bg2) 100%);
  border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:14px 0;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.card.tight{padding:12px 14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row.between{justify-content:space-between;align-items:center}
.grow{flex:1 1 320px;min-width:280px}

/* ---------- badges / chips ---------- */
.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line2);
  background:#0c1a2a;color:var(--cyan);
}
.badge.green{color:var(--green);border-color:#1d5c39;background:#08210f}
.badge.red{color:var(--red);border-color:#6b2026;background:#250a0e}
.badge.amber{color:var(--amber);border-color:#6b4a12;background:#261a05}
.badge.violet{color:var(--violet);border-color:#4b3a78;background:#181233}
.badge.grey{color:var(--dim);border-color:var(--line)}
.badge.pink{color:var(--pink);border-color:#7a2b52;background:#2a0f1e}
.badge.lime{color:var(--lime);border-color:#4c6516;background:#1b2408}

/* ---------- exercise blocks: scenario / artifact / question / answer ---------- */
.blk{border-radius:11px;padding:12px 14px;margin:11px 0;border:1px solid var(--line);position:relative}
.blk>.tag{
  display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;padding:2px 8px;border-radius:6px;
}
.blk .tag .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.blk.scn{background:linear-gradient(180deg,#0c1c2c,#0a1522);border-left:4px solid var(--cyan)}
.blk.scn>.tag{background:#0b2b39;color:var(--cyan)}
.blk.scn>.tag .dot{background:var(--cyan)}
.blk.art{background:#080e17;border-left:4px solid var(--violet)}
.blk.art>.tag{background:#1d1637;color:var(--violet)}
.blk.art>.tag .dot{background:var(--violet)}
.blk.ask{background:linear-gradient(180deg,#241a06,#1a1204);border-left:4px solid var(--amber)}
.blk.ask>.tag{background:#3a2a07;color:var(--amber)}
.blk.ask>.tag .dot{background:var(--amber)}
.blk.ask .qtext{font-size:16px;font-weight:600;color:#ffe9bd}
.blk.ans{background:linear-gradient(180deg,#08210f,#061a0c);border-left:4px solid var(--green)}
.blk.ans>.tag{background:#0d3a1c;color:var(--green)}
.blk.ans>.tag .dot{background:var(--green)}
.blk.fb{border-left:4px solid var(--line2);background:#0b1420}
.blk.fb.ok{border-left-color:var(--green);background:#071c0f}
.blk.fb.no{border-left-color:var(--red);background:#220a0e}
.art pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.6px;color:#c8d8ee}

/* ---------- options (mcq / multi) ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line2);
  border-radius:9px;background:#0b1524;cursor:pointer;transition:.14s;user-select:none;
}
.opt:hover{border-color:var(--cyan);background:#0d1e2f;transform:translateX(2px)}
.opt .mark{
  flex:0 0 20px;height:20px;border:2px solid var(--dim2);border-radius:50%;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#04121a;
}
.opt.multi .mark{border-radius:5px}
.opt.sel{border-color:var(--cyan);background:#0c2636}
.opt.sel .mark{background:var(--cyan);border-color:var(--cyan)}
.opt.ok{border-color:var(--green);background:#08210f}
.opt.ok .mark{background:var(--green);border-color:var(--green)}
.opt.no{border-color:var(--red);background:#26090d}
.opt.no .mark{background:var(--red);border-color:var(--red)}
.opt.miss{border-color:var(--green);border-style:dashed;background:#07190d}
.opt .lbl{font-weight:800;color:var(--dim2);font-size:12px;min-width:14px}
.opt:focus-visible,.chip:focus-visible,.drop:focus-visible,.mzone:focus-visible,.slot:focus-visible,
.navb:focus-visible,.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ---------- chips (drag sources) ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px dashed var(--line2);border-radius:10px;background:#0a1220;min-height:50px}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:8px;cursor:grab;
  background:#152539;border:1px solid var(--line2);font-size:13px;color:var(--txt);
  transition:.13s;touch-action:manipulation;
}
.chip:hover{border-color:var(--cyan);background:#1b3049}
.chip.sel{border-color:var(--cyan);background:#0f3247;box-shadow:0 0 0 2px rgba(34,211,238,.25)}
.chip.dragging{opacity:.45}
.chip.used{opacity:.35;cursor:default}
.chip.ok{border-color:var(--green);background:#08210f}
.chip.no{border-color:var(--red);background:#26090d}
.chip .x{font-weight:800;color:var(--red);cursor:pointer;padding:0 2px}
.bucketwrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.bucket{flex:1 1 240px;min-width:210px;border:1px solid var(--line2);border-radius:10px;background:#0b1422;padding:9px}
.bucket .bhead{font-weight:700;font-size:13px;color:var(--violet);margin-bottom:7px;border-bottom:1px solid var(--line);padding-bottom:5px}
.drop{min-height:64px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;border-radius:8px;padding:6px;transition:.13s}
.drop.over{background:#132b3f;outline:2px dashed var(--cyan)}
.drop.right{outline:2px solid rgba(34,197,94,.5)}
.drop.wrong{outline:2px solid rgba(239,68,68,.5)}

/* ---------- order / rank list ---------- */
.olist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.olist li{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line2);
  background:#0b1524;border-radius:9px;cursor:grab;
}
.olist li.over{border-color:var(--cyan);background:#12293c}
.olist li.dragging{opacity:.4}
.olist .num{
  flex:0 0 26px;height:26px;border-radius:7px;background:#16273c;color:var(--cyan);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;
}
.olist .mv{display:flex;flex-direction:column;gap:2px;margin-left:auto}
.olist .mv button{
  background:#16273c;border:1px solid var(--line2);color:var(--txt);border-radius:5px;
  cursor:pointer;font-size:10px;line-height:1;padding:3px 6px;
}
.olist .mv button:hover{border-color:var(--cyan);color:var(--cyan)}
.olist li.ok{border-color:var(--green);background:#08210f}
.olist li.no{border-color:var(--red);background:#26090d}

/* ---------- matching ---------- */
.match{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px}
.mcol{flex:1 1 300px;min-width:260px}
.mcol h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mzone{
  flex:1;min-height:40px;border:1px dashed var(--line2);border-radius:8px;padding:5px;
  display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim2);transition:.13s
}
.mzone.over{border-color:var(--cyan);background:#12293c}
.mzone.filled{border-style:solid;border-color:var(--line2)}
.mzone.right{border-color:var(--green)}
.mzone.wrong{border-color:var(--red)}
.mlabel{flex:0 0 44%;font-size:13px;color:var(--txt);background:#0b1524;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}

/* ---------- fill in the blank ---------- */
.filltext{
  font-family:var(--mono);font-size:13.4px;line-height:2.15;background:#080e17;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;color:#c8d8ee
}
.slot{
  display:inline-block;min-width:118px;min-height:26px;margin:0 4px;padding:2px 9px;border-radius:7px;
  border:1px dashed var(--cyan);background:#0c2334;text-align:center;color:var(--cyan);font-weight:700;
  cursor:pointer;vertical-align:middle;
}
.slot.over{background:#123c52;border-style:solid}
.slot.filled{border-style:solid;background:#0e3242}
.slot.ok{border-color:var(--green);background:#08210f;color:var(--green)}
.slot.no{border-color:var(--red);background:#26090d;color:var(--red)}

/* ---------- terminal ---------- */
.term{background:#04070c;border:1px solid #1d3a2e;border-radius:10px;padding:0;overflow:hidden;font-family:var(--mono)}
.term .tbar{background:#0a1712;padding:6px 10px;font-size:11.5px;color:var(--green);border-bottom:1px solid #14291f;display:flex;gap:8px;align-items:center}
.term .tbody{padding:12px;font-size:13px;color:#b9f5cf;min-height:110px;white-space:pre-wrap}
.term .tline{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #14291f;background:#060c09}
.term input{
  flex:1;background:#04070c;border:1px solid #1d3a2e;color:#b9f5cf;font-family:var(--mono);
  font-size:13px;padding:8px 10px;border-radius:7px;outline:none
}
.term input:focus{border-color:var(--green)}
.term .ps1{color:var(--lime);font-weight:700}

/* ---------- log viewer ---------- */
.logview{background:#070b11;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.logbar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0b1220;border-bottom:1px solid var(--line)}
.logbar input{
  flex:1;background:#070d16;border:1px solid var(--line2);border-radius:7px;color:var(--txt);
  padding:6px 9px;font-family:var(--mono);font-size:12.5px;outline:none
}
.logbar input:focus{border-color:var(--lime)}
.loglines{max-height:330px;overflow:auto;padding:8px 4px;font-family:var(--mono);font-size:12.4px}
.loglines .ln{display:flex;gap:9px;padding:2px 8px;border-left:3px solid transparent;white-space:pre-wrap;word-break:break-word}
.loglines .ln .no{color:#3d5170;flex:0 0 30px;text-align:right;user-select:none}
.loglines .ln.info{border-left-color:#1d3a5e}
.loglines .ln.warn{border-left-color:var(--amber);background:rgba(245,158,11,.06)}
.loglines .ln.crit{border-left-color:var(--red);background:rgba(239,68,68,.08)}
.loglines .ln.hit{background:rgba(163,230,53,.10)}
.hitmark{background:rgba(163,230,53,.22);outline:1px solid rgba(163,230,53,.45);border-radius:3px}
.hip{color:var(--cyan)}.hdm{color:var(--pink)}.hts{color:var(--dim2)}.hev{color:var(--violet);font-weight:700}

/* ---------- spot the mistake (clickable lines) ---------- */
.slines{list-style:none;margin:8px 0 0;padding:0;font-family:var(--mono);font-size:12.6px}
.slines li{
  display:flex;gap:10px;padding:5px 9px;border:1px solid transparent;border-radius:6px;cursor:pointer;
  white-space:pre-wrap;word-break:break-word
}
.slines li:hover{background:#101d2e;border-color:var(--line2)}
.slines li .no{color:#3d5170;flex:0 0 26px;text-align:right;user-select:none}
.slines li.pick{background:#3a2a07;border-color:var(--amber)}
.slines li.ok{background:#08210f;border-color:var(--green)}
.slines li.no{background:#26090d;border-color:var(--red)}
.slines li.miss{background:#07190d;border-color:var(--green);border-style:dashed}

/* ---------- queue table ---------- */
.qt{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.qt th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line2);padding:6px 8px}
.qt td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
.qt tr:hover td{background:#0c1725}
.qt select{
  background:#0b1524;color:var(--txt);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;font-size:12.5px;outline:none;max-width:230px
}
.qt select:focus{border-color:var(--cyan)}
.qt select.ok{border-color:var(--green);background:#08210f}
.qt select.no{border-color:var(--red);background:#26090d}

/* ---------- branch ---------- */
.step{border-left:3px solid var(--violet);padding-left:12px;margin:10px 0}
.step .sq{font-weight:600;color:#e6dcff}
.bfb{font-size:12.6px;padding:7px 9px;border-radius:8px;margin-top:6px}
.bfb.ok{background:#08210f;border:1px solid #1d5c39}
.bfb.no{background:#26090d;border:1px solid #6b2026}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;cursor:pointer;
  font-weight:700;font-size:13.5px;border:1px solid var(--line2);background:#152539;color:var(--txt);
  transition:.14s;font-family:inherit;
}
.btn:hover{border-color:var(--cyan);background:#1b3049;transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,#0e7490,#0891b2);border-color:#22d3ee;color:#02141b}
.btn.primary:hover{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.btn.green{background:#0d3a1c;border-color:var(--green);color:#c9f7d8}
.btn.red{background:#3a1015;border-color:var(--red);color:#fbd5d8}
.btn.amber{background:#3a2a07;border-color:var(--amber);color:#fde9c0}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- header / HUD ---------- */
.hud{position:sticky;top:0;z-index:40;background:rgba(6,10,18,.93);backdrop-filter:blur(7px);border-bottom:1px solid var(--line);padding:9px 0;margin:-18px -16px 12px;padding-left:16px;padding-right:16px}
.hudgrid{display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:1220px;margin:0 auto}
.hud .stat{font-size:12px;color:var(--dim)}
.hud .stat b{display:block;font-size:17px;color:var(--txt);font-variant-numeric:tabular-nums}
.hud .stat.timer b{color:var(--cyan)}
.hud .stat.timer.low b{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{height:8px;background:#101c2c;border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:160px;flex:1 1 180px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0891b2,#22d3ee);transition:width .35s}
.bar.score>i{background:linear-gradient(90deg,#15803d,#22c55e)}

/* ---------- navigator ---------- */
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-top:8px}
.navb{
  border:1px solid var(--line2);background:#0b1524;color:var(--dim);border-radius:7px;padding:5px 0;
  font-size:12px;font-weight:700;cursor:pointer;transition:.12s;font-family:inherit
}
.navb:hover{border-color:var(--cyan);color:var(--cyan)}
.navb.cur{outline:2px solid var(--cyan);color:var(--cyan)}
.navb.ok{background:#08210f;border-color:#1d5c39;color:var(--green)}
.navb.no{background:#26090d;border-color:#6b2026;color:var(--red)}
.navb.skip{background:#3a2a07;border-color:#6b4a12;color:var(--amber)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--dim);margin-top:10px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}

/* ---------- keywords panel ---------- */
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:10px}
.kwtheme{border:1px solid var(--line);border-radius:10px;background:#0a1220;padding:10px 12px}
.kwtheme h4{font-size:12.5px;color:var(--violet);letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
.kwtheme .kw{display:inline-block;font-size:11.6px;padding:2px 7px;margin:2px 3px 2px 0;border-radius:6px;background:#132135;color:#bcd2ea;border:1px solid #1d2c42}

/* ---------- progress ring / theme bars ---------- */
.tbar{margin:7px 0}
.tbar .tl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
.tbar .tb{height:7px;background:#101c2c;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.tbar .tb>i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);transition:width .3s}

/* ---------- results ---------- */
.cert{
  border:2px solid var(--green);border-radius:16px;padding:24px;text-align:center;
  background:radial-gradient(600px 200px at 50% 0%,#0d3a1c,#071409);box-shadow:0 0 40px rgba(34,197,94,.18)
}
.cert.fail{border-color:var(--red);background:radial-gradient(600px 200px at 50% 0%,#3a1015,#170709);box-shadow:0 0 40px rgba(239,68,68,.18)}
.cert .big{font-size:52px;font-weight:900;letter-spacing:.02em;margin:6px 0}
.cert .pct{font-size:22px;color:var(--dim)}
.rep{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin:10px 0;background:#0a1220}
.rep.ok{border-left:4px solid var(--green)}
.rep.no{border-left:4px solid var(--red)}
.rep.skip{border-left:4px solid var(--amber)}
.rep.part{border-left:4px solid var(--amber)}
.rep .rhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.answerbox{background:#080e17;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:7px 0;font-size:13px}
.answerbox b{color:var(--cyan)}
.tip{background:#1b1204;border:1px solid #6b4a12;border-radius:8px;padding:8px 11px;font-size:13px;margin-top:7px;color:#fde9c0}
.kbd{font-family:var(--mono);background:#132135;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:12px}
details summary{cursor:pointer;color:var(--cyan);font-weight:600}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0}
.warnbox{background:#2a1a05;border:1px solid var(--amber);border-radius:10px;padding:10px 13px;margin:10px 0;color:#fde9c0}

/* pause overlay */
.qwrap{position:relative}
.qwrap.blurred .qcontent{filter:blur(11px) saturate(.5);pointer-events:none;user-select:none}
.pauseov{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,8,14,.72);border-radius:12px;z-index:20;gap:10px;text-align:center
}
.pauseov .pz{font-size:34px;font-weight:900;color:var(--amber);letter-spacing:.1em}

@media (max-width:820px){
  body{font-size:14.4px}
  #app{padding:12px 10px 60px}
  .hud{margin:-12px -10px 10px;padding-left:10px;padding-right:10px}
  .hud .stat b{font-size:15px}
  h1{font-size:21px}
  .blk.ask .qtext{font-size:15px}
  .mlabel{flex:0 0 100%}
  .mrow{flex-wrap:wrap}
}

{
 id:"H02",theme:"Incident Response Preparation",type:"branch",pts:4,
 title:"02:10 - ransomware across forty servers, and the obvious move is wrong",
 scenario:"You are the incident commander on call. Encryption is spreading. Every step below has one option that looks decisive and is actually a mistake. The workflow is scored on the decisions, not on speed.",
 question:"Work through the four decisions of this ransomware response.",
 answerLabel:"Branching scenario - choose at each step",
 start:"s1",
 steps:[
  {id:"s1",q:"Step 1 - EDR shows a file-encryption process on forty servers and ransom notes on the finance share. What comes first?",options:[
    {t:"Scope the spread and preserve EDR telemetry, memory and the ransom note before touching hosts",ok:true,fb:"Correct. Scope and preserve first. You cannot contain what you have not mapped, and the telemetry is the only record of how they got in and where they went.",next:"s2"},
    {t:"Power off every domain controller immediately to stop replication",ok:false,fb:"Cutting authentication breaks every recovery path and loses volatile evidence. Domain controllers are usually the last systems to touch, not the first.",next:"s2"},
    {t:"Start restoring the newest backup over the affected servers",ok:false,fb:"That destroys the evidence and can restore straight into a still-active intruder. Recovery comes after containment and eradication.",next:"s2"}
  ]},
  {id:"s2",q:"Step 2 - the newest backup is six hours old and its catalogue was deleted, but the immutable vault copy from last night is intact. Which do you restore from?",options:[
    {t:"Verify the immutable vault copy, then restore it into an isolated network first",ok:true,fb:"Correct. The immutable copy cannot have been tampered with, and restoring into isolation lets you prove it is clean before it touches production.",next:"s3"},
    {t:"Restore from the six-hour-old copy because it means less lost work",ok:false,fb:"Its catalogue was deleted by the attacker, so you cannot prove the data or the backup chain is clean. Age is not the deciding factor here.",next:"s3"},
    {t:"Restore nothing and start negotiating, because recovery is too risky",ok:false,fb:"Recovery is the plan. Negotiation is a separate, controlled decision with legal and insurance, not a substitute for restoring service.",next:"s3"}
  ]},
  {id:"s3",q:"Step 3 - the note demands contact by email and threatens to publish 200 GB of stolen data. Who handles the demand?",options:[
    {t:"The incident commander with legal, the insurer and a sanctions check before any contact",ok:true,fb:"Correct. Extortion decisions carry legal, sanctions and insurance consequences, and the policy almost always forbids direct contact by an analyst.",next:"s4"},
    {t:"The duty analyst replies to buy time and ask for proof of the data",ok:false,fb:"Direct contact can breach policy and sanctions rules, and it tells the operator they have your attention. All contact goes through the approved channel.",next:"s4"},
    {t:"The MSSP's threat intelligence team replies on our behalf",ok:false,fb:"A supplier cannot accept legal or sanctions risk for you, and the master service agreement will not cover it.",next:"s4"}
  ]},
  {id:"s4",q:"Step 4 - services are restored and stable. What must be true before the case can be closed?",options:[
    {t:"Every access path the attacker used is removed and monitoring shows no beaconing or new persistence",ok:true,fb:"Correct. Closure criteria means proved eradication plus a clean monitoring period. Ransomware crews routinely return through the same door.",next:null},
    {t:"All ransom note files have been deleted from the shares and the desktops",ok:false,fb:"Cleaning up the notes is cosmetic. It proves nothing about whether the attacker still has access.",next:null},
    {t:"The count of encrypted files is recorded for the insurance claim",ok:false,fb:"That is a claims task, not a closure criterion. The insurance figure does not tell you whether the intruder is gone.",next:null}

 hint:"In each step, the option that feels most decisive is the one that destroys evidence, breaks recovery or moves a legal decision to the wrong owner.",
 explain:"Ransomware response has a fixed internal order even when it feels chaotic: scope and preserve, contain, eradicate, recover, verify, then close. Powering off domain controllers and restoring over live systems are the two classic self-inflicted wounds because they destroy the evidence you need to prove eradication. Backups must be verified and immutable before use, because a deleted catalogue means the attacker had access to the backup infrastructure. Extortion contact is a legal and sanctions decision owned by the commander with legal and the insurer. And a case closes on closure criteria - proved eradication plus a documented clean monitoring period - never on tidiness or paperwork. The whole workflow comes from the preparation phase: a playbook for ransomware, incident classification rules, a communication plan and a tested out-of-band communication channel. NIST SP 800-61 Revision 2 groups the response into four phases - preparation; detection and analysis; containment, eradication and recovery; and post-incident activity - and the order is not negotiable.",
 focus:"Learn the ransomware order of operations and the three traps: touching domain controllers early, restoring before containment, and answering the extortion note."

 id:"H03",theme:"Threat Hunting",type:"dd",pts:3,

 scenario:"Your hunt produced nine pieces of behaviour that a junior analyst could not classify. For each one you must decide whether it is benign, malicious, or whether you genuinely need more data. Guessing malicious on benign activity destroys trust; guessing benign on a real intrusion ends careers.",
 question:"Drag each signal into the correct judgement.",
 answerLabel:"Drag and drop - three boxes",
 buckets:[{id:"ben",l:"Benign - expected activity"},{id:"mal",l:"Malicious - escalate now"},{id:"unk",l:"Needs more data - cannot judge yet"}],
 items:[

  {id:"i2",t:"Service account creates remote services on 11 servers at 02:00 with no change ticket and no automation owner",b:"mal"},
  {id:"i3",t:"An administrator logs into 6 servers in 4 minutes at 02:00 from a laptop that is not in the asset register",b:"unk"},
  {id:"i4",t:"DNS TXT queries with 240-byte names to one domain every 30 seconds from a finance workstation",b:"mal"},
  {id:"i5",t:"A documented password-recovery utility is flagged by antivirus on an IT technician's laptop",b:"ben"},

  {id:"i7",t:"A workstation downloads a tool from a paste site, runs it, then clears the Windows event log",b:"mal"},
  {id:"i8",t:"A branch printer opens SMB connections to the print server every few minutes all day",b:"ben"},
  {id:"i9",t:"A CI runner resolves 300 random-looking domains in two minutes as part of a build referenced in the ticket",b:"ben"}
 ],
 hint:"Three of these have documentary proof that the activity is planned. Three have a technical pattern that has no innocent explanation. Three need a human to answer a question first.",
 explain:"Benign judgements rest on evidence that the activity was planned and owned: a change ticket for the scan, a documented tool in the software inventory, a build reference for the fuzz test, and a printer behaving like a printer. Malicious judgements rest on patterns with no innocent story: a service account creating remote services with no owner or ticket, DNS tunnelling, and a download from a paste site followed by event log clearing - that last combination is anti-forensics. The middle three need one more question: was the unregistered laptop a legitimate emergency change, and is the personal cloud copy part of an approved process or a data theft? Confirming with the owner takes minutes and turns a guess into a fact. Notice which signals were decisive: the behaviours, not the leftovers. An indicator of attack such as remote service creation survives the crew changing its tools, while an indicator of compromise such as a file hash or a domain expires within days - that ranking is the Pyramid of Pain in daily use.",
 focus:"Decide in three buckets and be honest about the third. Ask what evidence would have to be true for the activity to be benign."
},
{
 id:"H04",theme:"Threat Intelligence",type:"match",pts:3,
 title:"Build the detection coverage map: technique to the data source that actually shows it",
 scenario:"Your purple team exercise produced six techniques that are currently undetected. For each one you must name the data source that would really show the behaviour - several of the obvious choices only show the aftermath.",
 question:"Match each ATT&CK technique to the data source that best detects it.",
 answerLabel:"Matching - drag or tap each card onto its match",
 colLeft:"Technique observed",colRight:"Best detection data source",
 left:[
  {id:"l1",t:"PowerShell used to run an encoded loader in memory",g:"g1"},
  {id:"l2",t:"Application-layer command and control over HTTPS",g:"g2"},
  {id:"l3",t:"A new local administrator account created on a server",g:"g3"},
  {id:"l4",t:"A scheduled task created by an Office process",g:"g4"},
  {id:"l5",t:"A registry Run key set by a script",g:"g5"},
  {id:"l6",t:"Valid accounts used to log on to servers at unusual hours",g:"g6"}
 ],
 right:[
  {id:"r1",t:"Script block logging plus process creation records carrying the full command line",g:"g1"},
  {id:"r2",t:"Proxy and TLS metadata with request size, interval and certificate analysis",g:"g2"},
  {id:"r3",t:"Directory service change events with account auditing enabled",g:"g3"},
  {id:"r4",t:"Task scheduler operational log correlated with parent-child process chains",g:"g4"},
  {id:"r5",t:"Registry auditing and registry change events from the endpoint sensor",g:"g5"},
  {id:"r6",t:"Identity provider logon logs with device, location and time context",g:"g6"}
 ],
 hint:"Four of these need endpoint telemetry, one needs network metadata, and one lives entirely in the identity service. Ask which source sees the behaviour itself rather than the result.",
 explain:"Detection coverage fails when the data source does not actually contain the behaviour. Encoded PowerShell is visible in script block logging and in the process command line, not in antivirus alerts that only fire on known files. HTTPS command and control is not visible in packet contents because the traffic is encrypted, so you judge it by request size, interval, certificate and destination reputation. A new admin account is a directory change event. A scheduled task created by Office needs the task scheduler log joined to the process tree, because the task log alone does not say who created it. A Run key needs registry auditing. Valid-account abuse lives in identity logs, and it is the hardest of the six because the credentials are real, so context - device, time, location, baseline - is the only thing that makes it stand out. This mapping is exactly what an ATT&CK Navigator coverage layer records after a purple team exercise. It is also a bridge between two models: the Cyber Kill Chain tells you which stage of the attack you are looking at, and MITRE ATT&CK names the technique inside that stage so you can say which data source proves it.",
 focus:"For each technique, name the source that contains the behaviour itself: endpoint, network metadata or identity."
},
{
 id:"H05",theme:"Incident Response Preparation",type:"order",pts:3,
 title:"Acquisition plan for a live cloud server - six artefacts, different clocks",
 scenario:"A production cloud server is compromised but must stay online for another two hours. Six evidence sources are available, and they have very different lifespans. Legal has already been asked to issue the hold. You must give the acquisition order.",
 question:"Put the six collection steps into the correct order, starting with the most perishable evidence.",
 answerLabel:"Put in order - drag the rows or use the arrows",
 dirLabel:"Most perishable first",
 items:[
  {id:"t1",t:"Capture volatile memory and the live network connections from the running server"},
  {id:"t2",t:"Take a snapshot of the running cloud instance while it is still powered on"},
  {id:"t3",t:"Image the attached disk through a write blocker once the service is drained"},
  {id:"t4",t:"Export the provider's control-plane audit logs, which expire after 90 days"},
  {id:"t5",t:"Pull the authentication and application history from the central log platform, retained 12 months"},
  {id:"t6",t:"Recover the archived backup tapes from the offsite vault"}
 ],
 hint:"Rank by how fast each source disappears if you do nothing: memory and connections, then the machine state, then the disk, then logs by their retention clocks, then offline archives.",
 explain:"This is the order of volatility applied to a real plan. Memory and live network state vanish the moment the machine stops, so they go first. A powered-on snapshot preserves the running state and cannot be taken after the service is drained. The disk image comes next, through a write blocker so the original is untouched. Then come remote logs in order of how soon they rotate away: provider control-plane audit logs with a 90-day life before the central platform's 12-month history. Archived tapes are the least perishable and the slowest to retrieve. The legal hold issued beforehand is what stops the log platforms from rotating the very evidence you are about to collect. Writing this plan and rehearsing it before you need it is what forensic readiness means, and the collection itself is evidence preservation: an unmodified original, a verified copy and a documented trail from the moment of seizure.",
 focus:"Apply the order of volatility, then break ties between remote sources by their retention clock."
}
,

{
 id:"H06",theme:"Incident Response Preparation",type:"spot",pts:3,
 title:"Court-proof review: three defects in the evidence log",

 art:{label:"EVIDENCE LOG - case INC-459 - item A-01 (laptop disk)",body:"<pre>Case     : INC-459, litigation anticipated, defence request received\nItem     : A-01 laptop disk, seized 2024-03-11 02:40\nCustody  : maintained by the CSIRT forensics lead\nAction   : the eight numbered entries are listed in the answer block below -\n           click the three that would damage admissibility.\n</pre>"},
 question:"Click every line that would damage the admissibility of the evidence. Each correct line earns its share of the points, and a wrong pick earns nothing - it never subtracts.",
 answerLabel:"Spot the mistake - click the bad lines",
 lines:[
  {n:1,t:"Item A-01: laptop disk, serial WD-88213, seized 2024-03-11 02:40 by analyst R. Okoro, device powered on and unlocked.",bad:false},
  {n:2,t:"Acquisition: the original disk was connected directly to the analyst workstation SATA port to make the copy faster.",bad:true},
  {n:3,t:"Hash: MD5 and SHA-256 of the resulting image were recorded on the intake form at 03:12.",bad:false},
  {n:4,t:"Custody: the item moved from R. Okoro to the evidence locker on 2024-03-12; the entry was written up the following week from memory.",bad:true},
  {n:5,t:"Storage: the disk was sealed in tamper-evident bag A-01 and placed in the locked evidence locker.",bad:false},
  {n:6,t:"Analysis: the analyst opened the image, worked on it, and added review notes inside the image file so the next reviewer could follow the steps.",bad:true},
  {n:7,t:"Copy: a working copy was created and all analysis was performed on the copy, never on the original image.",bad:false},
  {n:8,t:"Retention: images are held for 12 months after the legal hold is released, in line with the evidence retention policy.",bad:false}
 ],
 hint:"Look for the three ideas that break defensibility: writing to the original, a custody record created after the fact, and modifying the image you are supposed to protect.",
 explain:"Line 2 breaks the first rule of acquisition: the original media must never be attached in a way that can write to it, which is why a hardware write blocker exists. Line 4 is a chain of custody gap - a record written a week later from memory cannot be relied on, and the defence will say the item could have been handled by anyone in that week. Line 6 destroys the integrity of the image: notes must be written in a separate case file, never inside the evidence container. Line 7 shows the correct pattern - keep the original image as the master and work only on verified copies. Hashing, sealing and retention are all handled correctly in this log - recording a legacy MD5 alongside a SHA-256 is not a defect, because the modern hash is present - which is why the three defects are easy to miss.",
 focus:"Learn the three admissibility killers: writing to the original, late custody entries and modifying the image."
},
{
 id:"H07",theme:"Threat Hunting",type:"queue",pts:3,
 title:"MSSP handover: five alerts where the asset context changes the answer",

 "Backup product    : migrated to agentless mode on 2024-02-26; legacy service account should no longer authenticate\n"+
 "Scanner config    : SMB sweep profile 445/tcp is disabled in the scanner policy since 2024-01-09\n"+
 "Contractor record : access key AKIA-****4471 belonged to a contractor who left on 2024-01-31\n"+
 "Clock now         : Tuesday 14:02\n</pre>"},
 question:"Give each alert its correct disposition, and be ready to justify it from the context panel.",
 answerLabel:"Dispositions - set one per alert",
 options:["Escalate to incident response now","Keep investigating - not enough proof either way","Close as benign with a note in the case"],
 alerts:[
  {id:"q1",short:"ALT-901",sev:"EDR",t:"A credential-dumping tool signature was blocked on HR-WS-22 at 14:01; the parent process was an unsigned binary in a temp folder.",answer:"Close as benign with a note in the case"},
  {id:"q2",short:"ALT-902",sev:"DLP",t:"FIN-WS-04 uploaded 400 MB as a ZIP archive to a personal cloud-sync service at 11:20, user: finance director.",answer:"Keep investigating - not enough proof either way"},
  {id:"q3",short:"ALT-903",sev:"Identity",t:"The backup service account authenticated to 9 servers between 01:00 and 01:20 over a legacy protocol.",answer:"Escalate to incident response now"},
  {id:"q4",short:"ALT-904",sev:"Network",t:"An internal host swept three /24 subnets for open 445/tcp in four minutes; the source is the approved scanner appliance.",answer:"Keep investigating - not enough proof either way"},
  {id:"q5",short:"ALT-905",sev:"Cloud",t:"A new administrator role was created at 03:00 by access key AKIA-****4471.",answer:"Escalate to incident response now"}
 ],
 hint:"Each row has one piece of context that either resolves it or makes it worse. Watch which ways the context cuts: an approval that does not cover what was actually done is not an approval.",
 explain:"ALT-901 falls inside an approved red-team validation window on that specific host, so it is benign - and the note must record that the approval was checked. ALT-902 looks approved too, but the DLP exception covers PDF board packs only and the upload was a ZIP, so the approval does not cover the activity: that is a genuine data movement question, not a closure. ALT-903 is the strongest case: the account is a legacy credential that should no longer exist, and it authenticated to nine servers at 01:00, which means either dormant access was never revoked or an attacker is using it. ALT-904 is the reverse of what it looks like: the source host is the approved scanner, but that scan profile is disabled by policy, so the appliance performing it is unexpected - investigate whether someone changed the configuration or is abusing that host. ALT-905 is a stale key belonging to a former contractor creating an admin role at 03:00, which is a clear escalation. Handovers like this are also where mean time to detect (MTTD) and mean time to respond (MTTR) are won or lost: context that lives in a case management tool and a change calendar is what turns an undecidable alert into a decision.",
 focus:"Read the context both ways: an approval only covers exactly what it names, and a trusted source host doing a disabled action is still suspicious."
},
{
 id:"H08",theme:"Threat Hunting",type:"dual",pts:3,
 title:"Two chairs on the same lateral-movement technique",
 scenario:"Your team is studying remote execution against servers using the built-in management interface. Answer the same technique twice: once as the hunter who must catch it, once as the operator who must avoid being caught.",
 question:"Answer the same technique twice: detection first, then evasion.",
 answerLabel:"Blue team then red team",
 alabel:"Blue team - how do you detect it?",
 blabel:"Red team - how do you reduce detection?",
 a:{q:"Which combination gives the earliest reliable detection of remote execution through the built-in management interface?",options:[
  {t:"A management process as the parent of a new process, joined with a remote logon",c:true},
  {t:"Netflow records showing SMB and RPC traffic between servers after hours",c:false},
  {t:"Endpoint alerts for known post-exploitation tools on the target server",c:false},
  {t:"A weekly report of accounts that gained local administrator rights",c:false}
 ]},
 b:{q:"Which change most reduces the chance that this remote execution is detected at all?",options:[
  {t:"Use the account that already administers that host and run only binaries already signed on it",c:true},
  {t:"Clear the security event log on the target immediately after each command",c:false},
  {t:"Increase the delay between remote commands from seconds to more than an hour",c:false},
  {t:"Create a fresh administrator account on each target for the operation",c:false}
 ]},
 hint:"Blue side: the technique inherits a parent process, and it always leaves a remote logon on the target. Red side: think about blending into the activity that host already produces, not about destroying evidence.",
 explain:"Remote management execution shows up as a process whose parent is the management service, and the target always records a network logon by some account - joining those two sources is the earliest reliable detection. Flow records are too coarse, tool signatures miss built-in binaries, and a weekly rights report is far too slow. From the red chair, the strongest evasion is blending: use the account that already administers that host, and run binaries that are already signed and present, so neither the identity nor the file looks new. Clearing the event log is anti-forensic behaviour that is itself a high-fidelity alert, a longer delay changes nothing about parent-child relationships, and a fresh administrator account creates directory change events that defenders hunt for directly.",
 focus:"Detect the parent process plus the remote logon; evade by blending with the host's existing administration, not by deleting logs."
},
{
 id:"H09",theme:"Threat Hunting",type:"rank",pts:3,
 title:"Purple team backlog: rank five detection gaps by what to build first",
 scenario:"A purple team exercise produced five coverage gaps. Detection engineering can deliver one per sprint. Rank them so the first sprint removes the most risk.",
 question:"Rank the five detection gaps from the one to build first to the one that can wait.",
 answerLabel:"Rank by priority - drag the rows or use the arrows",
 dirLabel:"Rank 1 = build first",
 items:[
  {id:"d1",t:"Detect the initial access technique that three real engagements used to get in this year"},
  {id:"d2",t:"Detect credential dumping on the servers that hold privileged service credentials"},
  {id:"d3",t:"Detect remote service creation from hosts that are not management servers"},
  {id:"d4",t:"Detect reverse tunnels over DNS to domains registered in the last 30 days"},
  {id:"d5",t:"Detect the use of unsigned administration tools in the finance VLAN only"}
 ],
 hint:"Rank by likelihood multiplied by impact, then sanity-check by asking how close each gap is to full domain compromise.",
 explain:"The initial access technique comes first because it was used successfully against you three times: the likelihood is proven, not theoretical. Credential dumping on servers that hold privileged credentials comes next, because that gap leads directly to domain-wide compromise and it is the step attackers take to make the intrusion survivable. Remote service creation is a common, high-fidelity lateral-movement signal with low noise. DNS tunnelling detection is genuinely useful but has a higher false-positive rate, because new domains include marketing and short-lived legitimate services. The narrow finance-VLAN tool detection is last: it covers a small slice of the estate and duplicates part of the broader coverage. Ranking is a risk assessment - likelihood multiplied by impact, adjusted for how much of the estate the detection actually covers. What the exercise produced is a threat emulation result, and turning it into a coverage layer in the ATT&CK Navigator is what stops the same gap being rediscovered next quarter.",
 focus:"Prioritise gaps by proven likelihood, blast radius and coverage, not by how interesting the technique sounds."
},
{
 id:"H10",theme:"Post-Incident Activity",type:"fill",pts:3,
 title:"Write the board summary: choose each term precisely",
 scenario:"The board summary of INC-459 is written except for six places where a precise term is needed. Several words in the bank are close but wrong, and the board will read the difference.",
 question:"Fill every blank with the term that is technically correct.",
 answerLabel:"Fill the blanks - drag a term into each blank",
 text:"The review concluded that the {0} was an unpatched remote-access service exposed to the internet, not the phishing email that delivered the loader. Detection took 38 minutes from first execution, but the {1} on the file server reached nine hours because the incident was not scoped until the second alert arrived. The {2} listed four control failures, and each one now has a {3} with a named owner and a due date. Because litigation is possible, the disk images stay under {4}, and the review itself was run as a {5} so that responders reported what really went wrong.",
 slots:[{a:"root cause"},{a:"dwell time"},{a:"gap analysis"},{a:"corrective action"},{a:"legal hold"},{a:"blameless post-mortem"}],
 bank:["attack surface","risk assessment","evidence retention","tabletop exercise","service level agreement"],
 hint:"One blank is about why the attacker succeeded, one is about how long they were inside, two are about the findings and the fixes, and two are about legal protection and the style of the review.",
 explain:"Root cause is the condition that allowed the intrusion, which is the exposed service - the phishing email is only the delivery method. Dwell time measures how long the intruder was inside before anyone noticed, and it is usually longer than the detection time because it starts at first access. A gap analysis lists the controls that failed, and each failure becomes a corrective action with an owner and a date. A legal hold keeps evidence and data from being deleted while litigation is possible. A blameless post-mortem is a review where people describe what actually happened without fear of punishment, which is the only way to get honest findings. Attack surface, risk assessment, evidence retention, tabletop exercise and service level agreement are all real terms, but none of them fit the sentences above.",
 focus:"Use post-incident terms precisely: root cause versus delivery method, dwell time versus detection time, gap analysis versus corrective action."
}
,

{
 id:"H11",theme:"Threat Hunting",type:"log",pts:3,
 title:"Authentication review: the service account logged on from three places at once",
 scenario:"A hunt for credential theft has reached a file server. You have the security log extract and the change ticket that was raised the same night. The service account is legitimate - the question is whether the logons are.",
 logName:"DC-01 and FS-03 security log - 02:00-02:30",
 log:[
  {t:"2024-03-10T23:50:11Z CHG-9120 password for svc_backup rotated by helpdesk; scheduled task owner updated to run from FS-03",lv:"info"},
  {t:"2024-03-11T02:11:04Z DC-01 EventID 4624 logon type 3 (network) account svc_backup source WS-3320 auth NTLM package NTLM",lv:"warn"},
  {t:"2024-03-11T02:11:19Z FS-03 EventID 4624 logon type 3 (network) account svc_backup source WS-3320 auth NTLM package NTLM",lv:"warn"},
  {t:"2024-03-11T02:12:40Z DC-01 EventID 4624 logon type 3 (network) account svc_backup source WS-4412 auth NTLM package NTLM",lv:"warn"},
  {t:"2024-03-11T02:13:55Z FS-03 EventID 4624 logon type 3 (network) account svc_backup source WS-5501 auth NTLM package NTLM",lv:"warn"},
  {t:"2024-03-11T02:14:02Z FS-03 EventID 4672 special privileges assigned to svc_backup (SeBackupPrivilege, SeDebugPrivilege)",lv:"crit"},
  {t:"2024-03-11T02:15:30Z FS-03 EventID 4648 logon with explicit credentials, account a.kowalski, target svc_backup",lv:"crit"},
  {t:"2024-03-11T02:20:07Z DC-01 EventID 4624 logon type 10 (remote interactive) account a.kowalski source JMP-01 auth Kerberos",lv:"info"},
  {t:"2024-03-11T02:21:02Z DC-01 EventID 4672 special privileges assigned to a.kowalski (SeDebugPrivilege)",lv:"info"},
  {t:"2024-03-11T02:41:00Z hunt note: svc_backup is a service account, it should never be used interactively and its source host should be FS-03",lv:"warn"}
 ],
 answerLabel:"Choose one - read the events, then pick the strongest finding",
 inner:{q:"Which finding best supports credential theft rather than normal service account use?",options:[
  {t:"NTLM network logons for svc_backup from three workstations, none of them the host named in the change ticket",c:true},
  {t:"An administrator opened a remote interactive session with Kerberos and received special privileges",c:false},
  {t:"The service account password was rotated twelve minutes before the first logon",c:false},
  {t:"An explicit-credential logon was recorded on the file server for another account",c:false}
 ]},
 hint:"Compare where the account authenticated from with where the ticket says it should run, then look at which authentication package was used and whether the account is supposed to be interactive at all.",
 explain:"A service account should authenticate from one host, the one that runs its scheduled task, and the ticket says that host is FS-03. The log instead shows network logons from WS-3320, WS-4412 and WS-5501 within three minutes, all using NTLM rather than Kerberos. NTLM network logons without an interactive session are the classic trace of a stolen password hash being replayed, and the 4648 explicit-credential event followed by special privileges shows someone using that identity deliberately. The administrator's Kerberos remote session from the jump host is normal privileged work and matches the documented pattern; the password rotation is normal maintenance; the 4648 event is only interesting because of who it targeted. None of those three alternatives shows the impossible source-host pattern.",
 focus:"For service accounts, compare the source host with the documented owner host and treat NTLM network logons from elsewhere as credential theft until proved otherwise."
},
{
 id:"H12",theme:"Threat Hunting",type:"branch",pts:4,
 title:"Insider hunt with HR in the room: three decisions where privacy and evidence collide",
 scenario:"A senior engineer copied design documents to removable media the week after being passed over for promotion. You are running the insider-threat process with HR and legal watching every step.",
 question:"Work through the insider-threat decisions in order.",
 answerLabel:"Branching scenario - choose at each step",
 start:"s1",
 steps:[
  {id:"s1",q:"Step 1 - you see the copies on the endpoint agent. What is your first action?",options:[
    {t:"Check with the data owner and HR whether the copies fit the engineer's normal role, and write the hypothesis down",ok:true,fb:"Correct. Confirm the legitimate explanation before you build a case, and keep the hypothesis documented so the hunt stays accountable.",next:"s2"},
    {t:"Confront the engineer and ask him to hand over the removable media",ok:false,fb:"That tips off the subject, contaminates the investigation and takes a decision that belongs to HR and legal.",next:"s2"},
    {t:"Start monitoring his personal email and personal phone to gather more evidence",ok:false,fb:"That is almost certainly unlawful and it destroys the case. The insider process defines exactly which company systems may be monitored.",next:"s2"}
  ]},
  {id:"s2",q:"Step 2 - the files are outside his role and the copying continued after hours. What now?",options:[
    {t:"Report through the insider threat process so HR and legal decide on interviews and device preservation",ok:true,fb:"Correct. Insider cases are governed, not improvised: HR leads on people, legal leads on evidence and employment law, and you supply the technical facts.",next:"s3"},
    {t:"Disable his account and tell his line manager straight away",ok:false,fb:"This warns the subject, hands the decision to the wrong owner and can breach the policy that protects the company legally.",next:"s3"},
    {t:"Keep collecting for a month so the case is stronger before anyone is told",ok:false,fb:"Long silent collection increases the damage and the legal risk, and it ignores the escalation path in the insider-threat policy.",next:"s3"}
  ]},
  {id:"s3",q:"Step 3 - HR asks whether the engineer's laptop may be imaged tonight. What governs that decision?",options:[
    {t:"The insider threat policy and local employment law, with legal hold and HR approval recorded first",ok:true,fb:"Correct. Ownership of the hardware is not the test. Policy, privacy law and an issued legal hold are what make the acquisition lawful and the evidence usable.",next:null},
    {t:"Nothing special, because the company owns the laptop and the agent is already installed",ok:false,fb:"Ownership is not consent. Without policy cover, HR approval and a legal hold you risk an unlawful search and unusable evidence.",next:null},
    {t:"The managed security provider's contract, because they run the endpoint agent",ok:false,fb:"A supplier can collect telemetry, but it cannot authorise an intrusive search of an employee's device.",next:null}
  ]}
 ],
 hint:"In every step, the wrong option either tips off the subject, over-collects, or moves a people-and-legal decision into the analyst's hands.",
 explain:"Insider threat hunting is the discipline where technical skill matters least and governance matters most. The first step is always to test the innocent explanation with the data owner, because most suspicious copying is legitimate work. Then the case moves through the documented insider-threat process, where HR owns the human decisions and legal owns evidence, notification and employment-law questions. Covert collection on personal devices is out of scope and usually illegal. Imaging an employee device is governed by policy, privacy law and a legal hold, not by who owns the hardware - and the legal hold is what stops logs and mailboxes from being deleted while the case is open.",
 focus:"In insider cases, confirm the innocent explanation first, then follow the governed process - never improvise collection or confrontation."
},
{
 id:"H13",theme:"Incident Response Preparation",type:"terminal",pts:3,
 title:"Volatile capture: the host reboots in ten minutes",
 scenario:"You are on a compromised Linux server that must be rebooted by the application team in ten minutes. You must record the current TCP connections together with the process that owns each one, and write the result into the evidence folder before the host goes down. Nothing else about the host may be changed.",
 art:{label:"FREEZE ORDER - case INC-447",body:
 "<pre>Host        : app-srv-07 (must be rebooted at 04:00 by the application team)\nRequirement : record current listening and established TCP connections WITH the owning process\nDestination : /evidence/vol-net-01.txt (folder already exists and is mounted read-write)\nConstraint  : read-only collection - no installation, no configuration change\nNote        : the operating system is a modern Linux distribution and you already have root\nNote        : addresses in this brief are written defanged (10[.]20[.]7[.]14) - type\n              them normally in the shell.\n</pre>"},
 question:"Type the single command that records the TCP connections with their owning processes into /evidence/vol-net-01.txt.",
 answerLabel:"Terminal - type the command and press Enter",
 host:"app-srv-07",prompt:"root@app-srv-07:~#",
 termIntro:"root@app-srv-07:~# # case INC-447 - volatile capture before the 04:00 reboot\nroot@app-srv-07:~# # the evidence folder exists. Use a tool that is already installed.\nroot@app-srv-07:~# # the file must hold one line per socket: its state, its addresses and the\nroot@app-srv-07:~# # process that owns it. No sample command and no tool name are given.",
 accept:["^(sudo\\s+)?(ss|netstat)\\b[\\s\\S]*(>[^|\\n]*evidence[^|\\n]*|\\|\\s*tee[^|\\n]*evidence)"],
 expected:"ss -antp > /evidence/vol-net-01.txt   (netstat -antp > /evidence/vol-net-01.txt is also correct)",
 successOutput:"root@app-srv-07:~# ss -antp > /evidence/vol-net-01.txt\nroot@app-srv-07:~# wc -l /evidence/vol-net-01.txt\n142 /evidence/vol-net-01.txt\n# command accepted - connections and owning processes preserved",
 failOutput:"# command not recognised - you need a connection listing with process owners, redirected into the evidence file",
 hint:"The requirement has three parts: TCP connections, the owning process, and output into the evidence file. On Linux the two tools that can do this are ss and netstat, and the process column needs one extra flag.",
 explain:"ss -antp - or netstat -antp on older systems - lists all TCP sockets (-a), shows numeric ports instead of names (-n), includes the owning process for each socket (-p), and prints the state column (-t for TCP). Redirecting with > writes it into the evidence file without changing the host. This is a volatile capture: if the server reboots in ten minutes, the connection list and the process names are gone forever, which is why the order of volatility puts live network state above the disk. Working read-only matters too, because installing a tool or restarting a service on an evidence host gives the other side something to argue about.",
 focus:"Remember which flags give you process ownership, and remember that volatile state must be written out before anything restarts."
},
{
 id:"H14",theme:"Threat Intelligence",type:"mcq",pts:3,
 title:"Two feeds disagree about the same address",
 scenario:"Feed A rates 193[.]32[.]44[.]18 as command and control with a confidence score of 70 and first seen yesterday. Feed B, from a different vendor, lists the same address as shared content-delivery egress. A third report says the crew behind the campaign in your sector is known for planting indicators that point at other people's infrastructure. You have one hour to decide whether to block the address at the perimeter.",
 question:"Which action gives the most reliable decision about this address?",
 answerLabel:"Choose one",
 options:[
  {t:"Enrich it with passive DNS, certificate history and first-seen data, then judge the infrastructure it shares",c:true},
  {t:"Block it, because blocking one content-delivery address costs very little if feed A is right",c:false},
  {t:"Trust the vendor with the higher confidence score and block the address at the perimeter",c:false},
  {t:"Wait until a third feed lists the same address before making any decision",c:false}
 ],
 hint:"Confidence scores tell you how sure a source is, not whether it is right. Think about what evidence would separate a real drop site from shared hosting.",
 explain:"Passive DNS, certificate history and first-seen data let you test the indicator against reality: a real drop site usually shares certificates or name servers with other known-bad infrastructure and appears at the same time as the campaign, while content-delivery egress is shared by thousands of benign customers. Blocking is not cheap when the address serves content for many unrelated sites, and a blocking decision made without evidence is a false positive waiting to happen. Confidence scores describe the source's own certainty, so they cannot settle a disagreement between two sources. Waiting for a third feed is passive: the address stays reachable while you wait. The third report is the reason to slow down rather than speed up: a crew that plants indicators on other people's infrastructure is deliberately trying to make you block an innocent third party.",
 focus:"Resolve indicator conflicts with enrichment and infrastructure pivoting, and be alert to deliberate false flags."
},
{
 id:"H15",theme:"Threat Hunting",type:"spot",pts:3,
 title:"Detection rule review: three defects before this ships to production",
 scenario:"A detection engineer has written a rule for the technique your last hunt found. Three lines will make the rule either useless or unbearable in production. Find all three.",
 art:{label:"RULE DRAFT - Sigma style, mapped to T1053.005",body:"<pre>Rule     : DT-2201, scheduled task created by an Office process\nStatus   : pre-production, awaiting detection engineering review\nSource   : hunt 24-07 findings and case INC-459\nAction   : the nine numbered rule lines are listed in the answer block below -\n           click the three that must be fixed before release.\n</pre>"},
 question:"Click every line that is wrong. Each correct line earns its share of the points, and a wrong pick earns nothing - it never subtracts.",
 answerLabel:"Spot the mistake - click the bad lines",
 lines:[
  {n:1,t:"title: Scheduled task created by an Office process",bad:false},
  {n:2,t:"logsource: category: process_creation, product: windows",bad:false},
  {n:3,t:"selection_task: Image|endswith: '\\schtasks.exe'",bad:false},
  {n:4,t:"selection_parent: ParentImage|endswith: '\\winword.exe'",bad:false},
  {n:5,t:"condition: selection_task or selection_parent",bad:true},
  {n:6,t:"CommandLine|contains: 'OneDriveSync'",bad:true},
  {n:7,t:"level: high",bad:false},
  {n:8,t:"falsepositives: none",bad:true},
  {n:9,t:"references: hunt 24-07 and case INC-459",bad:false}
 ],
 hint:"One line joins the two selections with the wrong operator, one line names a value taken from a single incident, and one line claims something no rule can honestly claim.",
 explain:"With 'or', the rule fires on every scheduled task creation anywhere and on every Word process - two enormous populations that have nothing to do with the technique. It needs 'and', so both conditions must be true in the same process tree. Line 6 hardcodes a task name copied from one incident: the attacker renames it next week and the rule only generates noise for the one name everyone already knows. Line 8 claims there are no false positives, which is never true and, worse, tells the next analyst not to bother tuning. A good rule states the expected false positives - software deployment tools, updaters, installer scripts - so the SOC knows what to expect. Level and references are fine: mapping to T1053.005 and citing the hunt and case are exactly what a production rule should carry.",
 focus:"Check rule logic operators, avoid single-incident IOC values, and always document expected false positives."
}

{
 id:"H16",theme:"Threat Intelligence",type:"dd",pts:3,
 title:"Sharing review: what does each marking actually allow?",
 scenario:"Your team is about to send material to partners, a conference and a public sandbox. The compliance officer wants each action checked against the Traffic Light Protocol before anything leaves the building.",
 question:"Drag each action into the correct box.",
 answerLabel:"Drag and drop - two boxes",
 buckets:[{id:"ok",l:"Allowed under that marking"},{id:"no",l:"Not allowed under that marking"}],
 items:[
  {id:"i1",t:"Publishing TLP:CLEAR material on a public forum",b:"ok"},
  {id:"i2",t:"Forwarding TLP:GREEN material to a peer inside your sector ISAC",b:"ok"},
  {id:"i3",t:"Using TLP:RED material inside the named recipient team to fix the vulnerability",b:"ok"},
  {id:"i4",t:"Sending TLP:CLEAR indicators to your own customers",b:"ok"},
  {id:"i5",t:"Putting TLP:AMBER material into a conference slide deck",b:"no"},
  {id:"i6",t:"Sharing TLP:AMBER+STRICT material with a subsidiary that was not named as a recipient",b:"no"},
  {id:"i7",t:"Publishing a sanitised version of TLP:AMBER material with the source name removed",b:"no"},
  {id:"i8",t:"Uploading TLP:AMBER material to a public malware sandbox",b:"no"}
 ],
 hint:"Read each marking as an instruction about the audience: clear means anyone, green means the community, amber means the named community only, red means the named individuals only. Removing a name does not remove the marking.",
 explain:"TLP:CLEAR has no restriction, so it can be published or sent to customers. TLP:GREEN may be shared inside the wider community, such as your sector ISAC. TLP:AMBER is limited to the named organisation and its clients who need it, so a conference deck is out. TLP:AMBER+STRICT removes even the client exception and stays inside the named organisation. TLP:RED is for the named recipients only, and using it inside that team is exactly what it is for. Two traps catch people: a sanitised derivative stays TLP:AMBER unless the source says otherwise, and a public sandbox is a public disclosure no matter how useful the analysis would be. A breach of a marking ends the sharing relationship, which costs far more than the analysis was worth.",
 focus:"Learn the four markings as audience rules, and remember that derivatives keep the original marking."
},
{
 id:"H17",theme:"Incident Response Preparation",type:"match",pts:3,
 title:"Phase discipline: which stage of the life cycle owns this work?",
 scenario:"A new incident coordinator keeps mixing up the stages of the life cycle. You give them six pieces of work from recent cases and ask which phase owns each one.", question:"Match each piece of work to the phase of the incident management life cycle that owns it.",
 answerLabel:"Matching - drag or tap each card onto its match",
 colLeft:"Piece of work",colRight:"Phase that owns it",
 left:[
  {id:"l1",t:"Testing the playbooks, the jump bag and the out-of-band channel",g:"g1"},
  {id:"l2",t:"Deciding whether the alert is a real incident and how severe it is",g:"g2"},
  {id:"l3",t:"Stopping the spread while the critical service stays up",g:"g3"},
  {id:"l4",t:"Removing the persistence and the access path the attacker used",g:"g4"},
  {id:"l5",t:"Restoring the service and watching for the attacker's return",g:"g5"},
  {id:"l6",t:"Proving the root cause and giving every fix an owner and a date",g:"g6"}
 ],
 right:[
  {id:"r1",t:"Preparation",g:"g1"},
  {id:"r2",t:"Detection and analysis",g:"g2"},
  {id:"r3",t:"Containment",g:"g3"},
  {id:"r4",t:"Eradication",g:"g4"},
  {id:"r5",t:"Recovery",g:"g5"},
  {id:"r6",t:"Post-incident activity",g:"g6"}
 ],
 hint:"Three of these are easy to confuse: keeping the service up while you stop the spread, deleting the attacker's way back in, and bringing the service back under watch.",
 explain:"Containment limits the damage with the least disruption - isolating hosts, blocking a channel - while services stay up. Eradication removes the cause: the implant, the persistence, the account and the path the attacker used. Recovery brings services back under close monitoring, because a returning attacker is common. Detection and analysis owns validation and classification; post-incident activity owns root cause, gaps and corrective actions. NIST SP 800-61 Revision 2 puts containment, eradication and recovery together in one phase, while the SANS PICERL model lists them as three separate steps - the work is the same, only the packaging differs. Keeping the phases separate matters in real incidents because a team that starts eradicating before it finishes scoping usually misses the second foothold, and a team that declares recovery before it verifies eradication usually gets hit twice.",
 focus:"Separate containment from eradication from recovery, and know which phase owns validation and which owns root cause."
},
{
 id:"H18",theme:"Threat Intelligence",type:"log",pts:3,
 title:"Mail header triage: authentication passed, and that is the problem",
 scenario:"A finance user reported an unusual invoice email. The mail gateway did not block it. You have the full header extract and must decide what actually happened before you write the case note.",
 logName:"Message header extract - MSG-2214",
 log:[
  {t:"Return-Path: <bounce@mailer.partner-crm[.]example>",lv:"info"},
  {t:"From: \"Finance Director\" <director@yourcorp[.]example>",lv:"warn"},
  {t:"Reply-To: accounts@secure-pay[.]top",lv:"crit"},
  {t:"Subject: URGENT - supplier payment details changed",lv:"warn"},
  {t:"Authentication-Results: mx.yourcorp[.]example; spf=pass smtp.mailfrom=mailer.partner-crm[.]example; dkim=pass header.d=mailer.partner-crm[.]example; dmarc=fail header.from=yourcorp[.]example",lv:"crit"},
  {t:"Received: from relay7.partner-crm[.]example (198[.]51[.]100[.]24) by mx.yourcorp[.]example",lv:"info"},
  {t:"X-Campaign-ID: crmerp-spring-batch-14 (bulk sender, 41,000 recipients)",lv:"warn"},
  {t:"Hunt note: secure-pay[.]top registered 9 days ago, mail only, no web content, MX only",lv:"crit"}
 ],
 answerLabel:"Choose one - read every header line before deciding",
 inner:{q:"What does this header extract actually prove?",options:[
  {t:"A legitimate bulk sender was abused, and its mail impersonated yourcorp[.]example, so DMARC failed on alignment",c:true},
  {t:"The partner's SPF record is misconfigured, which is why the message was not blocked",c:false},
  {t:"The message is authentic because SPF and DKIM both passed for the sending domain",c:false},
  {t:"The finance director's own mailbox was compromised and the Reply-To is a redirect",c:false}
 ]},
 hint:"SPF and DKIM are checked against the sending domain. DMARC is checked against the domain your users see in the From line. Ask which domain each result belongs to.",
 explain:"SPF passed for mailer.partner-crm[.]example, the envelope sender, and DKIM passed for the same third-party domain. Both are true statements about that domain. DMARC failed because the visible From domain is yourcorp[.]example, and neither SPF nor DKIM aligned with it. That is the signature of a compromised or abused bulk mail platform being used to impersonate your own domain - a display-name and domain spoof that your DMARC policy should have rejected if it were set to quarantine or reject. The misconfigured-SPF answer is wrong because SPF did pass. The 'authentic message' answer is wrong because authentication of the sending domain says nothing about the From domain. The compromised-mailbox answer is wrong because nothing here comes from your own mail infrastructure, and the Reply-To points at a nine-day-old mail-only domain used for invoice fraud replies.",
 focus:"Read each authentication result against the domain it covers: SPF and DKIM for the sender, DMARC alignment for the From domain."
},
{
 id:"H19",theme:"Threat Hunting",type:"dd",pts:3,
 title:"Hypothesis triage: only some of these can be tested today",
 scenario:"The hunt team has eight candidate hypotheses on the board and two analysts for the week. Before anything is scheduled, each hypothesis must be marked as testable with the data you hold today, or not testable yet.",
 question:"Drag each hypothesis into the correct box.",
 answerLabel:"Drag and drop - two boxes",
 buckets:[{id:"yes",l:"Testable with data we hold today"},{id:"no",l:"Not testable yet - data source missing"}],
 items:[
  {id:"i1",t:"An attacker is using a service account from a host that is not its documented owner",b:"yes"},
  {id:"i2",t:"An intruder is exfiltrating data through the corporate DNS resolver",b:"yes"},
  {id:"i3",t:"An implant is beaconing with jitter from the developer VLAN",b:"yes"},
  {id:"i4",t:"Cloud credentials are being used outside working hours from new addresses",b:"yes"},
  {id:"i5",t:"A new administrator account was created without a change record",b:"yes"},
  {id:"i6",t:"An employee is photographing documents at their desk",b:"no"},
  {id:"i7",t:"An attacker is hiding in the firmware of the conference room video units",b:"no"},
  {id:"i8",t:"An attacker is reading messages on an employee's personal phone",b:"no"}
 ],
 hint:"A testable hypothesis needs an existing source that would record the behaviour. If the behaviour would leave no trace in anything you collect, you cannot hunt it today - you can only ask for a new data source.",
 explain:"The five testable hypotheses each map to telemetry you already collect: identity logs plus the asset inventory, DNS resolver logs, proxy and TLS metadata, cloud audit logs, and directory change events. The three that are not testable are not impossible - they are invisible to your current sensors. Photographing a document leaves no endpoint trace, firmware in a video unit needs a different inspection capability, and a personal phone is outside your monitoring scope entirely. The honest answer for the last three is to record them as coverage gaps and feed them into detection engineering or a risk assessment, rather than to schedule a hunt that cannot produce evidence. A hunt that cannot produce evidence is a waste of two analysts, and worse, it produces a false sense of assurance.",
 focus:"Test a hypothesis against the data source that would record the behaviour before scheduling the hunt."
},
{
 id:"H20",theme:"Threat Hunting",type:"log",pts:3,
 title:"Cloud hunt: the instance role started creating users",
 scenario:"A hunt for cloud persistence has reached the audit trail of your production account. Instance roles are used by application servers and should only read a small set of resources. Read the trail and decide what is really going on.",
 logName:"Cloud audit trail - production account - 02:40 to 03:20",
 log:[
  {t:"2024-03-12T02:41:11Z GetCallerIdentity role/app-prod-ec2-role source 10[.]20[.]7[.]14 (instance private address)",lv:"info"},
  {t:"2024-03-12T02:52:03Z CreateUser userName=svc-ops-temp role/app-prod-ec2-role source 185[.]199[.]44[.]61",lv:"crit"},
  {t:"2024-03-12T02:52:40Z AttachUserPolicy userName=svc-ops-temp policy=AdministratorAccess role/app-prod-ec2-role source 185[.]199[.]44[.]61",lv:"crit"},
  {t:"2024-03-12T02:53:19Z CreateAccessKey userName=svc-ops-temp source 185[.]199[.]44[.]61",lv:"crit"},
  {t:"2024-03-12T03:02:07Z ListBuckets user=svc-ops-temp source 185[.]199[.]44[.]61",lv:"warn"},
  {t:"2024-03-12T03:04:44Z GetObject bucket=prod-customer-exports key=2024-q1.csv user=svc-ops-temp source 185[.]199[.]44[.]61",lv:"crit"},
  {t:"2024-03-12T03:11:00Z AssumeRole role=OpsAdmin user=deploy-bot source 10[.]20[.]8[.]30 (build host) MFA not required",lv:"info"},
  {t:"2024-03-12T03:15:22Z CreateAccessKey userName=deploy-bot user=deploy-bot source 10[.]20[.]8[.]30",lv:"info"},
  {t:"2024-03-12T03:19:02Z hunt note: the application on 10[.]20[.]7[.]14 calls only S3 GetObject on one bucket prefix",lv:"warn"},
  {t:"2024-03-12T03:19:30Z hunt note: 185[.]199[.]44[.]61 has never appeared in the account before, no VPN or office range matches",lv:"crit"}
 ],
 answerLabel:"Choose one - separate normal automation from abuse",
 inner:{q:"Which sequence shows that the instance role credentials were stolen and used from outside the instance?",options:[
  {t:"The instance role created a user and attached admin rights at 02:52 from an address that is not the instance",c:true},
  {t:"The instance role called GetCallerIdentity from its own private address at 02:41",c:false},
  {t:"A build account assumed an operations role and created a new access key for itself",c:false},
  {t:"The new user listed buckets and downloaded an export file three minutes later",c:false}
 ]},
 hint:"Compare the source of every action with the network position the identity should be in. Then ask which of the four options is a real contradiction rather than normal behaviour.",
 explain:"GetCallerIdentity from the instance's own private address is normal. A build account assuming a role and rotating its own key is normal automation. The download by the new user is the consequence, not the proof of theft. The proof is the contradiction: an EC2 instance role, which never leaves the instance, created an IAM user and granted it AdministratorAccess from a public address that has never appeared in the account and matches no office or VPN range. Roles on instances are temporary credentials fetched from the instance metadata service, so any use of them from outside the instance means the credentials were extracted and replayed. That is why the response is to disable the created user and its keys, rotate the instance role, and check the instance for a server-side request forgery or an exposed metadata endpoint.",
 focus:"Spot stolen cloud credentials by comparing the identity's expected network position with the source address of the action."
}
