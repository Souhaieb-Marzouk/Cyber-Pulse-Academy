/* ===================== HARD BANK — part 5 (H21-H26) ===================== */
{
 id:"H21",theme:"Threat Hunting",type:"dual",pts:3,
 title:"Two chairs on a signed-update supply chain compromise",
 scenario:"A software vendor whose product you run has confirmed that its build pipeline was abused and that a malicious version was shipped and signed. Your estate updated automatically last week. Answer as the hunter, then as the operator who planned it.",
 question:"Answer both chairs on the same technique: what you would hunt for, then what you would hide.",
 answerLabel:"Blue team then red team",
 alabel:"Blue team - what shows it running?",
 blabel:"Red team - what makes it hardest to attribute?",
 a:{q:"Which telemetry gives the earliest evidence that a customer environment actually executed the malicious update?",options:[
  {t:"Process lineage showing the update service write and start a new binary",c:true},
  {t:"The vendor's public advisory page and its status feed",c:false},
  {t:"Customer support tickets describing unusual application behaviour",c:false},
  {t:"The next scheduled vulnerability scan results for the estate",c:false}
 ]},
 b:{q:"Which choice makes the malicious update hardest to separate from legitimate vendor activity?",options:[
  {t:"Sign the payload with the vendor's real build certificate so the signature validates",c:true},
  {t:"Ship the payload only to customers outside your own region",c:false},
  {t:"Delay the payload until thirty days after the update is installed",c:false},
  {t:"Give the payload a process name that looks like a system service",c:false}
 ]},
 hint:"Blue side: the update is signed, so signature checks and reputation will not help - you need behaviour around the update process. Red side: think about what defenders trust by default.",
 explain:"When a supply chain compromise arrives signed by the real vendor certificate, allowlisting and signature checks are useless. The earliest usable evidence is the update mechanism's behaviour: the service writing a file and then starting it under the vendor's signed parent, which is a pattern you can baseline and alert on. The advisory tells you what to hunt but arrives after the fact; support tickets and vulnerability scans are far too slow. From the red chair, the strongest move is to keep the trusted signature, because defenders, allowlists and reputation services all treat it as legitimate. Region filtering and process naming change almost nothing, and a delayed payload usually increases the chance of being caught by later monitoring. This is why purple teaming matters here: the exercise tells the hunt team exactly which vendor behaviours are worth baselining before the next update.",
 focus:"Hunt supply chain compromise through the behaviour of the update mechanism, because trust signals will not help."
},
{
 id:"H22",theme:"Post-Incident Activity",type:"fill",pts:3,
 title:"Board note: severity, notification clocks and impact order",
 scenario:"You are completing a one-page board note about INC-459. Six terms are missing and each one changes the meaning of the sentence it sits in.",
 question:"Fill every blank with the correct term.",
 answerLabel:"Fill the blanks - drag a term into each blank",
 text:"The severity matrix attaches a {0} to each level, so a SEV1 must be answered within 15 minutes of the case being opened. Legal confirmed that the exposed extracts contained {1}, which starts the {2} clock and gives the regulator 72 hours from the moment we became aware. The company's {3} covers the forensic and notification costs, so the insurer must be told inside the same window. The {4} told the recovery team to restore the payment platform before the marketing site, because the revenue impact is far greater. The board also asked for the {5} figure, the time the attacker spent inside before anyone noticed, which this case put at nine hours.",
 slots:[{a:"service level agreement"},{a:"PII"},{a:"breach notification"},{a:"cyber insurance"},{a:"business impact analysis"},{a:"dwell time"}],
 bank:["root cause analysis","evidence retention","tabletop exercise","gap analysis"],
 hint:"One blank is the response-time target, one is the type of data, one is the message to the regulator, one is the policy, one drives the restore order, and one is the attacker's clock.",
 explain:"The service level agreement sets the response time target per severity level, and breaching it triggers a review. PII is personally identifiable information, and a breach involving it starts the breach notification duty - 72 hours under GDPR, counted from awareness, not from the end of the investigation. Cyber insurance is the policy that covers response costs, and insurers usually want notification in the same window as the regulator. The business impact analysis is what tells the recovery team which service to restore first, based on revenue and customer impact rather than on technical convenience. Dwell time measures the attacker's time inside, which is different from detection time and from repair time. Root cause analysis, evidence retention, tabletop exercise and gap analysis are all real terms, but none of them fits these sentences.",
 focus:"Know which clock each term starts: SLA for response, GDPR for notification, dwell time for the intruder, BIA for restore order."
},
{
 id:"H23",theme:"Post-Incident Activity",type:"branch",pts:4,
 title:"After the encryption: notification, police, and the extortion deadline",
 scenario:"Four thousand two hundred customer records left the network before the encryption started. The extortion deadline is 48 hours away. Work through the decisions that follow.",
 question:"Work through the post-incident decisions in order.",
 answerLabel:"Branching scenario - choose at each step",
 start:"s1",
 steps:[
  {id:"s1",q:"Step 1 - the exfiltration is confirmed and the data includes national insurance numbers. Who decides what is said, and when?",options:[
    {t:"Legal owns the timing and the wording: regulator inside 72 hours, then affected customers, using approved text",ok:true,fb:"Correct. Notification is a legal duty with a clock and a defined audience, and the wording is controlled so the company does not create new obligations by accident.",next:"s2"},
    {t:"The incident commander emails every customer immediately, because transparency always wins",ok:false,fb:"Speed without wording control causes panic, support overload and legal exposure. The duty is real, but it is owned and worded by legal.",next:"s2"},
    {t:"Nobody is told until the forensic report is finished in three weeks",ok:false,fb:"The 72-hour clock runs from awareness. Waiting for a perfect report breaches the duty and makes the eventual penalty worse.",next:"s2"}
  ]},
  {id:"s2",q:"Step 2 - the national cybercrime unit offers to investigate, but the operator is in a country with no extradition treaty. What do you do?",options:[
    {t:"Report it through the national unit and keep the police report option open, without delaying your own duties",ok:true,fb:"Correct. Reporting helps sector intelligence and preserves options. It never replaces your containment, recovery or notification duties.",next:"s3"},
    {t:"Refuse to involve the police, since extradition is impossible and it would only slow the recovery",ok:false,fb:"Attribution and prosecution are separate from recovery. Refusing costs you intelligence sharing and evidence handling support.",next:"s3"},
    {t:"Hand the investigation to the police and pause containment until they respond",ok:false,fb:"Pausing containment hands the initiative to the attacker. Your duties continue in parallel with any investigation.",next:"s3"}
  ]},
  {id:"s3",q:"Step 3 - the note threatens to publish the data in 48 hours. What guides the company's public position?",options:[
    {t:"A holding statement prepared from the communication plan and approved by legal and the insurer",ok:true,fb:"Correct. Approved words, one spokesperson and no promises you cannot keep. Contact with the operator stays with the commander and legal.",next:null},
    {t:"A public promise that no customer data will ever be published",ok:false,fb:"You cannot promise something the attacker controls. A broken promise becomes the story and damages trust far more than the breach.",next:null},
    {t:"A denial of the incident until the data actually appears online",ok:false,fb:"A denial that is later contradicted destroys credibility with customers, regulators and the insurer, and may itself be a breach of duty.",next:null}
  ]}
 ],
 hint:"Every step has an option that feels honest or decisive and is actually a legal, credibility or evidence mistake.",
 explain:"After exfiltration the case splits into two tracks that run at the same time: the technical response and the legal and communication response. Notification duties run on a clock measured from awareness, not from completion of the investigation, and the wording is controlled because a careless sentence can create new obligations. Reporting to law enforcement is worthwhile even when prosecution is unlikely, because it feeds sector intelligence and preserves options, but it never pauses your own response. Public communication is a controlled exercise: one approved holding statement, one spokesperson, no promises about what an attacker will do, and no denials that the evidence can contradict. Contact with the extortion operator stays with the incident commander, legal and the insurer, because sanctions and policy rules apply to that contact.",
 focus:"Run the technical and the legal tracks in parallel, and never let honesty become an uncontrolled promise."
},
{
 id:"H24",theme:"Post-Incident Activity",type:"mcq",pts:3,
 title:"The metrics say the problem is not where the board thinks it is",
 scenario:"The board reads the quarterly metrics and asks for one change that will shorten the time attackers spend inside undetected. The numbers are: 4,000 alerts a day, 62% closed automatically, median analyst first-touch 3 h 20 m, mean time to detect 38 minutes for SEV1, dwell time 11 hours, endpoint agent coverage 92%.",
 question:"Using these numbers, which single change is most likely to shorten dwell time?",
 answerLabel:"Choose one",
 options:[
  {t:"Cut the analyst first-touch time from 3 h 20 m to under one hour",c:false},
  {t:"Raise the automatic closure rate from 62% to 80% of alerts",c:false},
  {t:"Add detection coverage for techniques that currently have no rule at all",c:true},
  {t:"Deploy the endpoint agent to the last 8% of unprotected devices",c:false}
 ],
 hint:"Compare the three clocks: the alert exists at some point, an analyst touches it at another, and the attacker entered much earlier. Which clock is really late?",
 explain:"Dwell time is 11 hours, while mean time to detect for SEV1 is 38 minutes once an alert exists and an analyst first touches it after 3 h 20 m. The gap between 11 hours and 38 minutes is the signature of missing detection coverage: nothing fired for the first ten hours because no rule described the behaviour. So the leverage is in detection engineering for the uncovered techniques. Faster analyst triage helps, but it only shortens the time after a rule fires. A higher auto-close rate reduces workload without changing coverage, and the remaining 8% of endpoints is a genuine gap but far smaller in effect than the techniques with no rule at all.",
 focus:"Read metrics as clocks: coverage decides whether a signal exists at all, triage decides how fast it is handled."
},
{
 id:"H25",theme:"Post-Incident Activity",type:"multi",pts:3,
 title:"Root causes, not symptoms: read the timeline",
 scenario:"You are writing the findings section of the after-action report. The timeline of INC-459 is in the artefact. Your reviewer will reject the report if you list effects as root causes.",
 art:{label:"INC-459 TIMELINE",body:
 "<pre>2024-02-02  Contractor VPN account created for project Vela; project closed 29 Feb\n"+
 "2024-03-08  02:03  Attacker authenticates over VPN with the contract account - no MFA on this profile\n"+
 "2024-03-08  03:40  Endpoint rule for remote service creation is in audit mode, so it never alerts\n"+
 "2024-03-09  01:15  Lateral movement to 11 servers using remote service creation\n"+
 "2024-03-11  02:03  Data staged and exfiltrated from three file servers\n"+
 "2024-03-11  02:41  Encryption starts on 40 servers; SOC detects at 02:41 from the first EDR alert\n"+
 "2024-03-11  03:10  Containment begins; 04:20 recovery from the immutable backup copy\n</pre>"},
 question:"Select every statement that is a true root cause rather than a symptom or an effect.",
 answerLabel:"Select all that apply",
 options:[
  {t:"A dormant contractor account was never disabled after its project ended",c:true},
  {t:"The VPN profile used by that account did not require multi-factor authentication",c:true},
  {t:"The endpoint detection rule for remote service creation was left in audit mode",c:true},
  {t:"Forty servers were encrypted before containment started",c:false},
  {t:"Data was staged and exfiltrated from three file servers",c:false},
  {t:"The SOC detected the intrusion at 02:41 from an EDR alert",c:false}
 ],
 hint:"A root cause is a condition that existed before the attack and made it possible or invisible. An effect is something the attack produced.",
 explain:"Root causes are the conditions that let the intrusion succeed or stay hidden: an account that should have been disabled, a remote-access profile without multi-factor authentication, and a detection rule left in audit mode that should have been alerting. Those three are all things the organisation controlled and could have fixed. Encryption, exfiltration and the detection time are effects of the attack - they describe what happened, not why it was possible. Writing effects as root causes produces corrective actions that fix nothing: 'improve detection at 02:41' is not an action, while 'enable the audit-mode rule and remove the audit-mode exception process' is.",
 focus:"Separate conditions that allowed the attack from consequences that followed it."
},
{
 id:"H26",theme:"Post-Incident Activity",type:"spot",pts:3,
 title:"Tabletop report review: three lines the exercise sponsor will reject",
 scenario:"The after-action report for tabletop exercise TT-14 is ready for the exercise sponsor. Three lines contradict the purpose of a tabletop report and must be fixed before it is circulated.",
 art:{label:"TT-14 AFTER-ACTION REPORT - draft",body:"<pre>Exercise : TT-14, ransomware against the payment platform, 4 hours, 14 participants\nSponsor  : chief information security officer\nAction   : the eight numbered lines are listed in the answer block below -\n           click the three the sponsor will reject.\n</pre>"},
 question:"Click every line that is wrong. Each correct line earns its share of the points, and a wrong pick earns nothing - it never subtracts.",
 answerLabel:"Spot the mistake - click the bad lines",
 lines:[
  {n:1,t:"Exercise TT-14 simulated a ransomware attack on the payment platform and ran for four hours with 14 participants.",bad:false},
  {n:2,t:"Objective met: the CSIRT was activated within the 15-minute service level agreement for a SEV1.",bad:false},
  {n:3,t:"Finding: the team performed well because no responder made any mistake during the exercise.",bad:true},
  {n:4,t:"Gap: the out-of-band bridge was never tested and two responders had no dial-in details.",bad:false},
  {n:5,t:"Corrective action: run the same tabletop again next quarter so the team gets more practice.",bad:true},
  {n:6,t:"Gap: the legal contact was unreachable and the notification decision slipped by 90 minutes.",bad:false},
  {n:7,t:"Conclusion: the incident response plan needs no change because the exercise was completed.",bad:true},
  {n:8,t:"Next review: the plan is revised after the corrective actions are verified as closed.",bad:false}
 ],
 hint:"A tabletop exists to find gaps. Look for a line that denies any mistake, a line whose action does not fix the gap it follows, and a conclusion that contradicts the gaps above it.",
 explain:"Line 3 treats 'nobody made a mistake' as a finding, which is both implausible and useless: an exercise where nothing went wrong produced no learning, and a blameless report still has to name the weaknesses it exposed. Line 5 does not fix the gap it follows - the fix for missing dial-in details is to publish and test them, not to repeat the exercise and hope. Line 7 contradicts everything above it: two gaps were found, so the plan does need change. The rest of the report is sound: quantified objectives, named gaps, an ownerless-but-specific corrective action set, and a review point tied to verification. A tabletop report that lists no gaps or closes with 'no change needed' tells the sponsor the exercise was not taken seriously.",
 focus:"A tabletop report must name gaps and convert each one into a specific, verifiable change - never conclude that nothing needs to change."
}
,

{
 id:"H27",theme:"Threat Intelligence",type:"match",pts:3,
 title:"Enrichment pivots: the right source for each artefact",
 scenario:"You have six artefacts from three different cases and one hour with the enrichment tooling. Choosing the wrong source wastes the hour, so each artefact must be paired with the pivot that actually answers the question.",
 question:"Match each artefact to the enrichment source that answers the question fastest.",
 answerLabel:"Matching - drag or tap each card onto its match",
 colLeft:"Artefact in hand",colRight:"Best enrichment pivot",
 left:[
  {id:"l1",t:"An address seen in a firewall log at 03:00",g:"g1"},
  {id:"l2",t:"A suspicious file with no detections anywhere",g:"g2"},
  {id:"l3",t:"A domain from a phishing email",g:"g3"},
  {id:"l4",t:"A malware sample recovered from one customer host",g:"g4"},
  {id:"l5",t:"One of your internal hosts named in a partner report",g:"g5"},
  {id:"l6",t:"The email persona the operator used in the ransom note",g:"g6"}
 ],
 right:[
  {id:"r1",t:"Passive DNS and WHOIS to find the hosting and the other domains that share it",g:"g1"},
  {id:"r2",t:"Run it in a sandbox and compare its behaviour with families already known",g:"g2"},
  {id:"r3",t:"Certificate transparency logs to find every other name issued on the same certificate",g:"g3"},
  {id:"r4",t:"A YARA scan across the estate to find other copies of the same file",g:"g4"},
  {id:"r5",t:"Your own asset inventory and flow records to see what it actually talked to",g:"g5"},
  {id:"r6",t:"Dark web monitoring to find the same persona on criminal forums and markets",g:"g6"}
 ],
 hint:"Two pivots are about infrastructure history, one is about behaviour, one is about finding more copies, one is about your own estate, and one is about the person behind the keyboard.",
 explain:"Enrichment is only useful if the source can answer the question you have. Passive DNS and WHOIS turn one address into a hosting history and a set of related domains, which is how you decide whether an address is dedicated criminal infrastructure or shared hosting. A file with no detections needs behaviour, so a sandbox run and family comparison come first. Certificate transparency finds sibling domains from the same certificate, the fastest way to scope a phishing wave. YARA finds other copies of a sample anywhere you can scan. When a partner report names one of your hosts, the question is internal: what did that host actually talk to, and does the timing fit? And an operator persona is a person-level question, so breach and forum data is the pivot that adds value. Chasing the wrong source produces interesting facts that do not answer the question.",
 focus:"Match the pivot to the question: infrastructure, behaviour, copies, internal footprint, or persona."
},
{
 id:"H28",theme:"Threat Hunting",type:"queue",pts:3,
 title:"Asset context queue: four of these five are not what they look like",
 scenario:"You are covering the queue alone overnight. Every alert below looks obvious at first glance, and in four cases the asset context changes the answer. The context panel is on your screen.",
 art:{label:"CONTEXT PANEL",body:
 "<pre>Patch runbook     : Sunday 01:00-05:00, remote service creation by the patching account is expected\n"+
 "Backup server     : bkp-eu-01 was rebuilt last night from a golden image; services not yet re-baselined\n"+
 "Travel calendar   : CEO speaks in Singapore today; registered laptop, MFA satisfied\n"+
 "Open ticket       : DEV-3311 approved a database performance test on the staging cluster only\n"+
 "Red team exercise : RT-22 ran 13-15 March, scope: red-lab VLAN only, authorisation on file\n"+
 "Clock now         : Sunday 17 March, 02:12\n</pre>"},
 question:"Decide what to do with each alert, using the context panel to settle it.",
 answerLabel:"Dispositions - set one per alert",
 options:["Escalate to incident response now","Keep investigating - not enough proof either way","Close as benign with a note in the case"],
 alerts:[
  {id:"r1",short:"AL-501",sev:"EDR",t:"The patching account created remote services on 14 servers at 01:40, matching the patch runbook window.",answer:"Close as benign with a note in the case"},
  {id:"r2",short:"AL-502",sev:"IDS",t:"An internal host is sweeping the R&D lab /24 for open SMB ports; the source address belongs to bkp-eu-01.",answer:"Keep investigating - not enough proof either way"},
  {id:"r3",short:"AL-503",sev:"Identity",t:"The CEO's account authenticated from Singapore, 12 minutes after a helpdesk password reset.",answer:"Close as benign with a note in the case"},
  {id:"r4",short:"AL-504",sev:"Cloud",t:"A production database snapshot was copied to a personal storage account by a developer who holds ticket DEV-3311.",answer:"Keep investigating - not enough proof either way"},
  {id:"r5",short:"AL-505",sev:"Network",t:"A finance VLAN host contacted an address used as command and control during exercise RT-22, which ended yesterday.",answer:"Escalate to incident response now"}
 ],
 hint:"Check every piece of context against what was actually done. A ticket that names a different system, or an exercise that ended yesterday, does not cover what you are looking at.",
 explain:"AL-501 matches the documented patch runbook window and account exactly, so it is expected - with a note recording that the runbook was checked. AL-502 looks safe because it comes from the backup server, but that server was rebuilt last night and has not been re-baselined, so its behaviour is unknown: scan from a freshly rebuilt host needs investigation. AL-503 lines up with the travel calendar on a registered device with MFA satisfied. AL-504 has a ticket, but DEV-3311 covers the staging cluster, not a production snapshot and not a personal storage destination - the ticket does not authorise the activity. AL-505 is the escalation: the address is a known command-and-control address, the host is in a VLAN that was never in scope, and the exercise is over, so the timing and the scope both exclude the innocent explanation.",
 focus:"Check that approvals cover the exact system and action, and treat a freshly rebuilt host as unknown rather than trusted."
},
{
 id:"H29",theme:"Threat Hunting",type:"order",pts:3,
 title:"Rebuild the hunt loop for the team handbook",

 question:"Put the six steps of the hunt loop into the correct order.",
 answerLabel:"Put in order - drag the rows or use the arrows",
 dirLabel:"First step first",
 items:[
  {id:"h1",t:"Form a hypothesis from intelligence, a previous incident or a coverage gap"},
  {id:"h2",t:"Identify the data sources and confirm they are collected and retained long enough"},
  {id:"h3",t:"Write and run the queries, then judge the result size against the hypothesis"},
  {id:"h4",t:"Validate the hits with context: asset role, identity, change records, timing"},
  {id:"h5",t:"Escalate anything proved malicious through the incident response process"},
  {id:"h6",t:"Document the outcome, including negative results, and refine the hypothesis"}
 ],
 hint:"An idea becomes a question, the question needs data, the data needs queries, the hits need context, real findings need escalation, and everything needs writing down.",
 explain:"The hunt loop starts with a hypothesis, because an untargeted search is just browsing. Before writing queries you must confirm the data exists and is retained for the window you need - many hunts die because the telemetry only goes back seven days. Queries then test the hypothesis, and the size of the result tells you whether to narrow the hypothesis or move on. Validation is where context turns hits into findings: who owns the asset, which account, was there a change ticket, does the timing fit. A proved finding escalates into the incident process immediately, because a hunt is discovery, not response. Finally the outcome is documented - and negative results are as valuable as positive ones, because they tell the next analyst which hypothesis has already been tested and how, which is what hunt documentation is for.",
 focus:"Memorise the loop as hypothesis, data, query, validate, escalate, document."
},

  {t:"Exposing it to the internet as well, so it collects more attackers over time",c:false}
 ],
 hint:"Deception inside a company monitors people as well as intruders. Ask which approval makes that lawful and safe.",
 explain:"A deception server inside the corporate network will record anyone who touches it, including curious employees, so it needs written approval from legal and HR, and it needs to stay inside an agreed scope with a documented purpose. Real customer documents must never be used - the lure must be fake data, otherwise a successful intrusion leaks the very thing you are protecting. Telling the entire SOC destroys the value, because the fewer people who know, the more reliable any contact becomes; the need-to-know list is deliberate. Exposing it to the internet changes the mission: you are hunting a specific intruder already inside, and an internet-facing honeypot is a different project with different risks. Done properly, deception gives a hunt team situational awareness with very high signal, because nothing legitimate should ever touch it.",

 hint:"Match each product to its reader: the board gets the long view, security leadership gets the campaign, detection engineers get the TTPs, tooling gets the raw artefacts. The three collection sources are the classic trio.",
 explain:"A question becomes useful intelligence only when it is written as a priority intelligence requirement. A good requirement names the decision, the deadline, and the evidence that would settle it. The intelligence cycle then drives the work. Its stages are planning and direction, collection, processing, analysis, dissemination, and feedback. Collection splits into three sources. OSINT comes from public material, HUMINT comes from people such as partners and vendors, and SIGINT comes from signals or commercial feeds. The products are graded by audience. The board gets strategic intelligence, which looks a year ahead. Security leadership gets operational intelligence about the campaign in front of them. Detection engineers get tactical intelligence about tools and TTPs. The tooling team gets technical intelligence, which is the raw artefacts. Two words look similar but are not the same. A threat feed is the delivery stream, not a product level. An indicator of compromise is one artefact inside technical intelligence, not the whole category. A sinkhole and a honeypot are hunting and deception tools, not intelligence products at all. Finally, the actor list is what makes the requirement concrete. A nation-state group wants intelligence. An organized crime crew wants money through ransomware. A hacktivist wants attention. A script kiddie scans whatever answers. The insider threat needs no exploit at all. Those are five problems, so they need five different answers.",

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function shuffle(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t;}return x;}
function byId(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
function pct(n){return Math.round(n*100);}
function mmss(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function regEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function isMulti(e){
  switch(e.type){
    case "multi":case "dd":case "match":case "fill":case "queue":case "order":case "rank":case "branch":case "spot":case "dual":return true;
    case "log":return !!e.multi;
    default:return false;
  }
}
function elementCount(e){

    case "dual":return 2;

  t=t.replace(/\b(EventID[= ]?\d+|event_?id[=:]\s?\d+|EID\s?\d+)\b/gi,'<span class="hev">$1</span>');

function prepare(ex){
  var e=clone(ex);
  if(e.options)e.options=shuffle(e.options);
  if(e.buckets)e.buckets=shuffle(e.buckets);
  if(e.type==="order"||e.type==="rank"){e.shown=shuffle(e.items.map(function(x){return x.id;}));}
  else if(e.items)e.items=shuffle(e.items);
  if(e.left)e.left=shuffle(e.left);
  if(e.right)e.right=shuffle(e.right);

  if(e.inner&&e.inner.options)e.inner.options=shuffle(e.inner.options);

  if(e.steps)e.steps.forEach(function(s){s.options=shuffle(s.options);});
  if(e.lines)e.lines=clone(e.lines);
  return e;
}

function tick(){

function togglePause(){

function goto(i){

function renderNav(){
  var h="";

      var f=grade(e,S.resp[e.id]).f;
      if(f>=0.999){cls+=" ok";state="answered, fully correct";glyph="&#10003;";}
      else if(f>0){cls+=" part";state="answered, partly correct";glyph="&#9680;";}
      else{cls+=" no";state="answered, incorrect";glyph="&#10007;";}

    h+='<button class="'+cls+'" data-i="'+i+'" aria-label="Exercise '+(i+1)+': '+state+'" title="'+esc(e.title||"")+'"><span aria-hidden="true">'+glyph+'</span>'+(i+1)+'</button>';
  });

    n.innerHTML=h;
    Array.prototype.forEach.call(n.querySelectorAll(".navb"),function(b){b.onclick=function(){goto(parseInt(b.getAttribute("data-i"),10));};});

function themeStats(){
  var map={};
  S.order.forEach(function(e){
    if(S.skipped[e.id])return;
    var r=S.resp[e.id];
    if(!hasAnswer(e,r))return;              /* blanks are excluded, exactly as in calcScore */
    var t=e.theme||"Other";
    if(!map[t])map[t]={p:0,m:0};
    var p=e.pts||1;
    map[t].m+=p;
    map[t].p+=p*grade(e,r).f*hintFactor(e);
  });
  return map;

function updateHud(){
  var sc=calcScore();
  var el=$("hud-score");if(el)el.textContent=(sc.max>0?Math.round(sc.earned/sc.max*100):0)+"%";
  var q=$("hud-q");if(q)q.textContent=(S.idx+1)+"/"+S.order.length;
  var bar=document.querySelector("#hud-bar>i");if(bar)bar.style.width=(sc.max>0?(sc.earned/sc.max*100):0)+"%";
  var ps=$("hud-pause");
  if(ps){var ptxt=pauseStateText();ps.textContent=ptxt?(ptxt==="Paused (manual)"?"\u23F8 ":"\u23F8 ")+ptxt:"";ps.style.display=ptxt?"inline-block":"none";}
  var th=$("themes");
  if(th){
    var m=themeStats(),k=Object.keys(m),h="";
    if(!k.length)h='<div class="small dim">Nothing scored yet.</div>';
    k.forEach(function(t){
      var v=m[t].m>0?m[t].p/m[t].m:0;
      h+='<div class="tbar"><div class="tl"><span>'+esc(t)+'</span><span>'+pct(v)+'%</span></div><div class="tb"><i style="width:'+pct(v)+'%"></i></div></div>';
    });

}

/* ------------------------------ answer model ------------------------------ */
function hintFactor(e){
  var n=Math.min(MAXHINTS,S.hints[e.id]||0);
  return Math.max(0.5,1-0.10*n);
}
function hasAnswer(e,r){
  var ar=function(x){return (Array.isArray(x)&&x.length>0)||typeof x==="number";};
  if(r===undefined||r===null)return false;
  switch(e.type){
    case "mcq":case "log0":return typeof r==="number";
    case "multi":return Array.isArray(r)&&r.length>0;
    case "log":return e.multi?(Array.isArray(r)&&r.length>0):(typeof r==="number");
    case "dual":return !!(r&&ar(r.a)&&ar(r.b));
    case "dd":case "match":case "queue":case "fill":return r&&typeof r==="object"&&Object.keys(r).length>0;
    case "order":case "rank":return !!S.touched[e.id];
    case "terminal":return typeof r==="string"&&r.trim().length>0;
    case "branch":return r&&Object.keys(r).length>0;
    case "spot":return Array.isArray(r)&&r.length>0;
  }
  return false;
}

function calcScore(){
  var earned=0,max=0,answered=0,skipped=0,hintLoss=0,full=0,partial=0,zero=0;
  S.order.forEach(function(e){
    if(S.skipped[e.id]){skipped++;return;}
    var r=S.resp[e.id];
    if(!hasAnswer(e,r))return;                 /* blank: excluded like a skip, never in the denominator */
    var p=e.pts||1;
    max+=p;answered++;
    var f=grade(e,r).f;
    var hf=hintFactor(e);
    earned+=p*f*hf;
    hintLoss+=p*f*(1-hf);
    if(f>=0.999)full++;else if(f>0)partial++;else zero++;
  });
  return {earned:earned,max:max,answered:answered,skipped:skipped,hintLoss:hintLoss,full:full,partial:partial,zero:zero,correct:full};
}
/* ------------------------------ grading ------------------------------ */
function grade(e,r){
  /* an unanswered exercise still has to be graded (score 0) without crashing */
  if(r===undefined||r===null){r=((e.type==="multi"||e.type==="spot")?[]:{});}
  var lines=[],f=0,i;
  switch(e.type){
    case "mcq":{
      for(i=0;i<e.options.length;i++){
        var isC=!!e.options[i].c, picked=(i===r);
        if(isC||picked)lines.push({ok:isC&&picked, no:picked&&!isC, t:(isC?"CORRECT: ":"")+e.options[i].t});
      }
      f=(e.options[r]&&e.options[r].c)?1:0;break;
    }
    case "multi":{
      var sel=Array.isArray(r)?r:[], good=0,total=0,wrong=0;
      e.options.forEach(function(o,ix){
        var isC=!!o.c,picked=sel.indexOf(ix)>=0;
        if(isC)total++;if(isC&&picked)good++;if(!isC&&picked)wrong++;
        if(isC||picked)lines.push({ok:isC&&picked,no:picked&&!isC,t:(isC?"CORRECT: ":"")+o.t});
      });
      f=good/Math.max(1,total);break;
    }
    case "dd":{
      var okC=0;
      e.items.forEach(function(it){
        var put=r[it.id],b=byId(e.buckets,it.b),good=(put===it.b);
        if(good)okC++;
        lines.push({ok:good,no:!good,t:"&ldquo;"+esc(it.t)+"&rdquo; &rarr; <b>"+esc(put?byId(e.buckets,put).l:"(not placed)")+"</b>"+(good?"":" &nbsp;(correct: "+esc(b?b.l:"")+")")});
      });
      f=okC/Math.max(1,e.items.length);break;
    }
    case "order":case "rank":{
      var want=e.items.map(function(x){return x.id;}),got=Array.isArray(r)?r:[];
      var hits=0;
      want.forEach(function(id,ix){var good=got[ix]===id;if(good)hits++;lines.push({ok:good,no:!good,t:(ix+1)+". "+esc(byId(e.items,id).t)+(good?"":" &nbsp;(you put: "+esc(got[ix]?byId(e.items,got[ix]).t:"-")+")")});});
      f=hits/Math.max(1,want.length);break;
    }
    case "match":{
      var ok2=0;
      e.left.forEach(function(L){
        var R=r[L.id],want=(function(){for(var k=0;k<e.right.length;k++){if(e.right[k].g===L.g)return e.right[k];}return null;})();
        var good=R&&want&&R===want.id;if(good)ok2++;
        lines.push({ok:good,no:!good,t:"<b>"+esc(L.t)+"</b> &rarr; "+esc(R&&byId(e.right,R)?byId(e.right,R).t:"(not matched)")+(good?"":" &nbsp;(correct: "+esc(want?want.t:"")+")")});
      });
      f=ok2/Math.max(1,e.left.length);break;
    }
    case "fill":{
      var okf=0;
      e.slots.forEach(function(s,ix){
        var put=(r[ix]||"").toString(),good=put.trim().toLowerCase()===s.a.trim().toLowerCase();
        if(good)okf++;
        lines.push({ok:good,no:!good,t:"blank "+(ix+1)+": <b>"+esc(put||"(empty)")+"</b>"+(good?"":" &nbsp;(correct: "+esc(s.a)+")")});
      });
      f=okf/Math.max(1,e.slots.length);break;
    }
    case "terminal":{
      var cmd=String(r===null||r===undefined?"":r).trim(),hit=false;
      (e.accept||[]).forEach(function(rx){try{if(new RegExp(rx,"i").test(cmd))hit=true;}catch(err){}});
      f=hit?1:0;
      lines.push({ok:hit,no:!hit,t:"<b>"+esc(cmd||"(no command)")+"</b>"+(hit?"":" &nbsp;(expected shape: "+esc(e.expected)+")")});
      break;
    }
    case "log":case "dual":{
      var sub=[];
      if(e.type==="log")sub.push({q:e.inner.q,options:e.inner.options,r:r,multi:!!e.multi,tag:"LOG QUESTION"});
      else{sub.push({q:e.a.q,options:e.a.options,r:r?r.a:null,multi:!!e.a.multi,tag:e.alabel||"BLUE TEAM"});
           sub.push({q:e.b.q,options:e.b.options,r:r?r.b:null,multi:!!e.b.multi,tag:e.blabel||"RED TEAM"});}
      var tot=0,sum=0;
      sub.forEach(function(s){
        var good=0,bad=0,cnt=0;
        s.options.forEach(function(o,ix){
          var isC=!!o.c,picked=(s.multi?(Array.isArray(s.r)&&s.r.indexOf(ix)>=0):(s.r===ix));
          if(isC)cnt++;if(isC&&picked)good++;if(!isC&&picked)bad++;
          if(isC||picked)lines.push({ok:isC&&picked,no:picked&&!isC,t:"["+s.tag+"] "+(isC?"CORRECT: ":"")+o.t});
        });
        var ff=s.multi?(good/Math.max(1,cnt)):(good?1:0);
        sum+=ff;tot++;
      });
      f=sum/Math.max(1,tot);break;
    }
    case "queue":{
      var okq=0;
      e.alerts.forEach(function(a){
        var put=r[a.id],good=(put===a.answer);if(good)okq++;
        lines.push({ok:good,no:!good,t:"<b>"+esc(a.short||a.id)+"</b> &rarr; "+esc(put||"(not set)")+(good?"":" &nbsp;(correct: "+esc(a.answer)+")")});
      });
      f=okq/Math.max(1,e.alerts.length);break;
    }
    case "spot":{
      var bads=[],picks=Array.isArray(r)?r:[];
      e.lines.forEach(function(l,ix){if(l.bad)bads.push(ix);});
      var hits=0,miss=0;
      picks.forEach(function(ix){var ln=e.lines[ix];if(ln&&ln.bad)hits++;else miss++;});
      e.lines.forEach(function(l,ix){
        if(l.bad||picks.indexOf(ix)>=0)lines.push({ok:!!l.bad&&picks.indexOf(ix)>=0,no:!l.bad&&picks.indexOf(ix)>=0,t:"line "+l.n+": "+esc(l.t)});
      });
      f=hits/Math.max(1,bads.length);break;
    }
    case "branch":{
      var okb=0,totb=0;
      e.steps.forEach(function(st){
        var pick=r[st.id];
        if(pick===undefined)return;
        totb++;
        var o=st.options[pick],good=!!(o&&o.ok);
        if(good)okb++;
        lines.push({ok:good,no:!good,t:"<b>"+esc(st.q)+"</b> &rarr; "+esc(o?o.t:"")+(good?"":" &nbsp;(best: "+esc((st.options.filter(function(x){return x.ok;})[0]||{}).t||"")+")")});
      });
      f=totb?okb/totb:0;break;
    }
  }
  return {f:Math.max(0,Math.min(1,f)),lines:lines};
}

/* ------------------------------ correct / given answer text ------------------------------ */
function correctText(e){
  var i;
  switch(e.type){
    case "mcq":return e.options.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(" | ");
    case "multi":return e.options.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(" | ");
    case "dd":return e.items.map(function(it){var b=byId(e.buckets,it.b);return it.t+" -> "+(b?b.l:"");}).join(" ; ");
    case "order":case "rank":return e.items.map(function(x,n){return (n+1)+". "+x.t;}).join(" ; ");
    case "match":return e.left.map(function(L){var R=null;e.right.forEach(function(r){if(r.g===L.g)R=r;});return L.t+" <-> "+(R?R.t:"");}).join(" ; ");
    case "fill":return e.slots.map(function(s,n){(n+1)+") "+s.a;}).join(" ; ");
    case "terminal":return e.expected;
    case "log":return e.inner.options.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(" | ");
    case "dual":return "[BLUE] "+e.a.options.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(" | ")+"  ||  [RED] "+e.b.options.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(" | ");
    case "queue":return e.alerts.map(function(a){return (a.short||a.id)+": "+a.answer;}).join(" ; ");
    case "spot":return e.lines.filter(function(l){return l.bad;}).map(function(l){return "line "+l.n;}).join(", ")+" &mdash; "+e.lines.filter(function(l){return l.bad;}).map(function(l){return l.t;}).join(" / ");
    case "branch":return e.steps.map(function(st){var o=st.options.filter(function(x){return x.ok;})[0];return st.q+" -> "+(o?o.t:"");}).join(" ; ");
  }
  return "";
}
function givenText(e,r){
  if(!hasAnswer(e,r))return "<i class='dim'>no answer given</i>";
  var i;
  switch(e.type){
    case "mcq":return esc(e.options[r]?e.options[r].t:"");
    case "multi":return (r||[]).map(function(ix){return esc(e.options[ix]?e.options[ix].t:"");}).join(" | ");
    case "dd":return e.items.map(function(it){var b=byId(e.buckets,r[it.id]);return esc(it.t)+" -> "+esc(b?b.l:"(not placed)");}).join(" ; ");
    case "order":case "rank":return (r||[]).map(function(id,n){var it=byId(e.items,id);return (n+1)+". "+esc(it?it.t:"");}).join(" ; ");
    case "match":return e.left.map(function(L){var R=byId(e.right,r[L.id]);return esc(L.t)+" <-> "+esc(R?R.t:"(not matched)");}).join(" ; ");
    case "fill":return e.slots.map(function(s,n){return (n+1)+") "+esc(r[n]||"(empty)");}).join(" ; ");
    case "terminal":return esc(String(r===null||r===undefined?"":r).trim());
    case "log":return e.multi?(r||[]).map(function(ix){return esc(e.inner.options[ix].t);}).join(" | "):esc(e.inner.options[r]?e.inner.options[r].t:"");
    case "dual":return "[BLUE] "+esc(r.a!==null&&e.a.options[r.a]?e.a.options[r.a].t:"-")+" &nbsp;||&nbsp; [RED] "+esc(r.b!==null&&e.b.options[r.b]?e.b.options[r.b].t:"-");
    case "queue":return e.alerts.map(function(a){return esc(a.short||a.id)+": "+esc(r[a.id]||"(not set)");}).join(" ; ");
    case "spot":return (r||[]).map(function(ix){return "line "+e.lines[ix].n;}).join(", ");
    case "branch":return e.steps.map(function(st){var p=r[st.id];if(p===undefined)return esc(st.q)+" -> (not reached)";return esc(st.q)+" -> "+esc(st.options[p]?st.options[p].t:"");}).join(" ; ");
  }
  return "";
}

/* ------------------------------ render question ------------------------------ */
function renderQuestion(){
  var e=S.order[S.idx],r=S.resp[e.id],locked=!!S.locked[e.id],box=$("qbox");
  var h="";
  h+='<div class="card">';
  h+='<div class="row between" style="margin-bottom:8px"><div class="row" style="gap:7px;align-items:center">'+
      '<span class="badge">Q'+(S.idx+1)+' / '+S.order.length+'</span>'+
      '<span class="badge violet">'+esc(e.theme||"General")+'</span>'+
      '<span class="badge lime">'+TYPE_LABEL[e.type]+'</span>'+
      '<span class="badge '+(LEVEL.name==="HARD"?"red":"green")+'">'+LEVEL.name+'</span>'+
      '<span class="badge grey">'+(e.pts||1)+' pt'+((e.pts||1)>1?"s":"")+'</span>'+
      (S.skipped[e.id]?'<span class="badge amber">SKIPPED</span>':'')+
      (S.hints[e.id]?'<span class="badge amber">'+S.hints[e.id]+' hint used</span>':'')+
      '</div><div class="dim2 small">'+(e.id)+'</div></div>';
  if(e.title)h+='<h2 style="margin-bottom:4px">'+e.title+'</h2>';
  if(e.scenario)h+='<div class="blk scn"><span class="tag"><i class="dot"></i>Scenario</span><div>'+e.scenario+'</div></div>';
  if(e.art)h+='<div class="blk art"><span class="tag"><i class="dot"></i>Artifact &mdash; '+esc(e.art.label||"data")+'</span>'+(e.art.body?e.art.body:'')+'</div>';
  if(e.type==="log")h+=logBlock(e);
  if(e.type==="terminal")h+=termBlock(e,locked);
  var qtext=(e.type==="log"&&e.inner&&e.inner.q)?e.inner.q:(e.question||"");
  h+='<div class="blk ask"><span class="tag"><i class="dot"></i>Question</span><div class="qtext">'+qtext+'</div></div>';
  h+='<div class="blk ans"><span class="tag"><i class="dot"></i>'+(e.answerLabel||"Your answer")+'</span>';
  if(isMulti(e)){
    var ec=elementCount(e);
    h+='<div class="small" style="margin:2px 0 8px;color:var(--txt)">This exercise has <b>'+ec+'</b> correct element'+(ec>1?'s':'')+'. Each one is worth '+((e.pts||1)/ec).toFixed(2)+' of the '+(e.pts||1)+' point'+((e.pts||1)>1?'s':'')+'. A wrong pick earns nothing and never subtracts.</div>';
  }
  h+=answerArea(e,r,locked);
  h+='<div class="btnrow">';
  if(!locked)h+='<button class="btn primary" id="btn-check">Check my answer</button>';
  else h+='<button class="btn ghost" id="btn-revise">Revise my answer</button>';
  h+='<button class="btn amber" id="btn-skip">Skip this exercise</button>';
  if(!S.hints[e.id]||S.hints[e.id]<MAXHINTS)h+='<button class="btn ghost" id="btn-hint">Hint (&minus;10%)</button>';
  h+='</div>';
  h+='<div id="hintbox">'+(S.hints[e.id]?'<div class="tip"><b>Hint ('+S.hints[e.id]+' used, &minus;'+pct(1-hintFactor(e))+'% of this question):</b> '+e.hint+'</div>':'')+'</div>';
  h+='</div>';
  h+='<div id="fb" aria-live="polite"></div>';
  h+='<div class="btnrow" style="justify-content:space-between">'+
     '<button class="btn" id="btn-prev"'+(S.idx===0?" disabled":"")+'>&#9664; Previous</button>'+
     '<button class="btn" id="btn-next"'+(S.idx===S.order.length-1?" disabled":"")+'>Next &#9654;</button></div>';
  h+='</div>';
  box.innerHTML=h;
  bindQuestion(e,locked);
  if(locked)showFeedback(e,true);
}

/* ------------------------------ per-type rendering ------------------------------ */
function answerArea(e,r,locked){
  var i,h="";
  switch(e.type){
    case "mcq":case "multi":{
      var multi=(e.type==="multi");
      h+='<div class="opts'+(multi?" multi":"")+'" id="opts" role="group" aria-label="'+(multi?"Select every correct statement":"Choose one answer")+'">';
      e.options.forEach(function(o,ix){
        var sel=multi?(Array.isArray(r)&&r.indexOf(ix)>=0):(r===ix);
        var cls="opt"+(multi?" multi":"")+(sel?" sel":"");
        if(locked){
          if(o.c)cls+=" ok";else if(sel)cls+=" no";
        }
        var mk=locked?(o.c?"&#10003;":(sel?"&#10007;":"&#183;")):(sel?"&#10003;":"");
        h+='<div class="'+cls+'" data-i="'+ix+'" tabindex="0" role="'+(multi?"checkbox":"radio")+'" aria-checked="'+(sel?"true":"false")+'"><span class="mark" aria-hidden="true">'+mk+'</span><span class="lbl">'+String.fromCharCode(65+ix)+'.</span><span>'+o.t+'</span></div>';
      });
      h+='</div>';
      if(multi)h+='<div class="small dim" style="margin-top:6px">Select every correct statement. Each correct pick earns its share of the points; a wrong pick earns nothing and never subtracts.</div>';
      break;
    }
    case "dd":{
      h+='<div class="small dim" style="margin-bottom:6px">Drag each item into the correct box &mdash; or tap the item, then tap the box. Click an item inside a box to take it back.</div>';
      h+='<div class="bank" id="bank">';
      e.items.forEach(function(it){
        var placed=r&&r[it.id];
        h+='<div class="chip'+(placed?" used":"")+'" draggable="true" tabindex="0" role="button" data-item="'+it.id+'" data-kind="dd">'+it.t+'</div>';
      });
      h+='</div><div class="bucketwrap">';
      e.buckets.forEach(function(b){
        var inside=e.items.filter(function(it){return r&&r[it.id]===b.id;});
        var cls="drop";
        if(locked){
          var allGood=inside.length>0&&inside.every(function(it){return it.b===b.id;});
          cls+=allGood?" right":"";
        }
        h+='<div class="bucket"><div class="bhead">'+b.l+'</div><div class="'+cls+'" data-drop="'+b.id+'" tabindex="0" role="group" aria-label="Drop zone: '+esc(b.l)+'">';
        inside.forEach(function(it){
          var good=(it.b===b.id);
          h+='<div class="chip '+(locked?(good?"ok":"no"):"")+'" data-item="'+it.id+'" data-inbucket="1">'+(locked?(good?"&#10003; ":"&#10007; "):"")+it.t+(locked?"":" <span class='x' data-remove='"+it.id+"'>&times;</span>")+'</div>';

      });

      h+='<ul class="olist" id="olist">';
      ids.forEach(function(id,ix){
        var it=byId(e.items,id);
        var cls="";
        if(locked){
          var want=e.items[ix].id;
          cls=(want===id)?" ok":" no";
        }
        h+='<li draggable="true" data-id="'+id+'" class="'+cls.trim()+'"><span class="num">'+(ix+1)+'</span>'+(locked?'<span class="stg" aria-hidden="true">'+stateGlyph(cls)+'</span>':'')+'<span>'+it.t+'</span>'+
           '<span class="mv"><button data-up="'+ix+'" type="button">&#9650;</button><button data-down="'+ix+'" type="button">&#9660;</button></span></li>';
      });
      h+='</ul>';
      break;
    }
    case "match":{
      h+='<div class="small dim" style="margin-bottom:6px">Drag a card from the left onto its match on the right &mdash; or tap the card, then tap the target.</div>';
      h+='<div class="match"><div class="mcol"><h4>'+esc(e.colLeft||"Item")+'</h4>';
      e.left.forEach(function(L){
        var placed=r&&r[L.id];
        if(!placed)h+='<div class="chip" draggable="true" tabindex="0" role="button" data-left="'+L.id+'" data-kind="match" style="margin-bottom:8px">'+L.t+'</div>';
        else{
          var R=byId(e.right,r[L.id]);
          var good=locked&&R&&R.g===L.g;
          h+='<div class="chip '+(locked?(good?"ok":"no"):"")+'" data-left="'+L.id+'" draggable="false" style="margin-bottom:8px">'+L.t+' &rarr; '+esc(R?R.t:"")+(locked?"":" <span class=\'x\' data-unmatch=\'"+L.id+"\'>&times;</span>")+'</div>';

      });
      h+='</div><div class="mcol"><h4>'+esc(e.colRight||"Match")+'</h4>';
      e.right.forEach(function(R){
        var taken=null;
        e.left.forEach(function(L){if(r&&r[L.id]===R.id)taken=L;});

        h+='<div class="mzone'+(taken?" filled":"")+(locked?(good?" right":" wrong"):"")+'" data-drop="'+R.id+'" data-kind="matchzone" tabindex="0" role="group" aria-label="Drop zone" style="margin-bottom:8px">'+(taken?'<span class="chip '+(locked?(good?"ok":"no"):"")+'">'+(locked?(good?"&#10003; ":"&#10007; "):"")+taken.t+'</span>':'<span class="dim2">drop here</span>')+'</div>';
      });

    }
    case "fill":{
      var bank=S.fillBank[e.id];
      if(!bank){

        bank=shuffle(words);S.fillBank[e.id]=bank;
      }
      var txt=e.text;
      e.slots.forEach(function(s,ix){
        var val=r&&r[ix]?r[ix]:"";
        var cls="slot"+(val?" filled":"");
        if(locked)cls+=(val&&val.trim().toLowerCase()===s.a.trim().toLowerCase())?" ok":" no";
        var pre=locked?(val&&val.trim().toLowerCase()===s.a.trim().toLowerCase()?"&#10003; ":"&#10007; "):"";
        txt=txt.replace("{"+ix+"}",'<span class="'+cls+'" data-slot="'+ix+'" data-kind="slot" tabindex="0" role="button">'+pre+(val?esc(val):"drop / tap")+'</span>');
      });
      h+='<div class="filltext">'+txt+'</div>';
      h+='<div class="small dim" style="margin:8px 0 6px">Word bank (drag onto a blank, or tap a word then tap a blank):</div>';
      h+='<div class="bank" id="bank">';
      bank.forEach(function(w,ix){
        var used=false;
        if(r)Object.keys(r).forEach(function(k){if(r[k]===w)used=true;});
        h+='<div class="chip'+(used?" used":"")+'" draggable="true" tabindex="0" role="button" data-word="'+esc(w)+'" data-kind="word" data-wix="'+ix+'">'+esc(w)+'</div>';
      });
      h+='</div>';
