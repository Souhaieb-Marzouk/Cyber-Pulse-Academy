const DATA = {"meta":{"topicId":"cysa-plus","chapter":4,"title":"Efficiency and Process Improvement in Security Operations — HARD","difficulty":"hard","questionCount":31,"estimatedMinutes":48,"passMark":70},"intro":"This is the HARD tier of objective 1.5. Every exercise expects you to hold several artefacts together — a log, a ticket, a config, a metric — and to notice when the obvious answer is the wrong one. The keywords of objective 1.5 are exercised here through ambiguous evidence, attacker tradecraft and policy judgement, and they are exercised again in the MEDIUM file with different scenarios and different data. Nothing in this file repeats an exercise from the other file.","exercises":[{"id":"hard-1","type":"logq","theme":"When the automation breaks","summary":"The enrichment playbook failed on a third of the overnight queue — find the true cause","scenario":[{"label":"Artefact 1 — SOAR playbook run log, 01:00 to 05:00","kind":"log","lines":[{"t":"01:02:11","s":"soar","m":"playbook PB-04 enrich-alert started for alert 88213"},{"t":"01:02:12","s":"soar","m":"step 2 call enrichment API: HTTP 429 too many requests"},{"t":"01:02:12","s":"soar","m":"step 2 retry immediately (attempt 2 of 3)"},{"t":"01:02:13","s":"soar","m":"step 2 call enrichment API: HTTP 429 too many requests"},{"t":"01:02:13","s":"soar","m":"step 2 retry immediately (attempt 3 of 3)"},{"t":"01:02:14","s":"soar","m":"step 2 failed after 3 attempts, playbook aborted"},{"t":"01:02:14","s":"soar","m":"alert 88213 continues with no enrichment, ticket created without owner data"},{"t":"01:07:44","s":"soar","m":"playbook PB-04 started for alert 88251, same result"}]},{"label":"Artefact 2 — Two more facts","kind":"kv","rows":[["Playbook","PB-04 is started once per alert, up to 40 alerts in the same minute"],["Vendor note","The enrichment API at 10[.]60[.]9[.]14 allows 600 calls per minute per tenant, measured per second"],["Change","CHG-5012 moved the alert source from hourly polling to streaming at 00:30 today"]]}],"question":"The vendor limit is 600 calls a minute and the team sent about 40. What actually caused the failures?","options":["Calls arriving in one second, with retries that made it worse","The vendor lowered the rate limit without telling the customer","The playbook is missing the enrichment step for most alert types","The enrichment API is broken and every call returns an error"],"answer":0,"hint":"The limit is per minute but it is measured per second. Read the retry timing.","explain":"Forty alerts arriving in the same second from a streaming source turn into forty simultaneous API calls, and the limit is measured per second, so the burst breaks it even though the minute total looks safe. The retries make it worse: they fire immediately, inside the same second, so attempts two and three land on an API that is already refusing. The result is that the playbook aborts and the alert continues unenriched, quietly arriving in the queue with no owner information. The fix is throttling rather than more retries: put the calls on a queue with a rate limiter, spread them over the minute, and use exponential back-off with jitter for the retries. The change record is the clue that matters. The polling to streaming change at 00:30 increased the burst, and nobody checked what it would do to the enrichment step.","study":"Rate limits are enforced per second, not only per minute. Queue the calls and back off instead of retrying at once.","keys":["SOAR platform","API integration","Playbook","Automation versus orchestration","False negative","Telemetry health and data source","Change management and CAB","Alert enrichment"]},{"id":"hard-2","type":"sort","theme":"Automation audit","summary":"Eight findings from an automation audit — is each one a control gap, wasted effort, or both?","scenario":[{"label":"Artefact 1 — Audit scope note","kind":"text","text":"An internal reviewer looked at the SOC's automation for two weeks. Each finding must be classified. A control gap is a risk. Wasted effort is time lost. Some findings are both, and those are the ones to fix first."}],"question":"Classify each finding.","bins":["Control gap (risk)","Efficiency waste (time)","Both"],"items":[{"t":"The containment playbook disables accounts with no approval record kept anywhere","bin":0},{"t":"Two network sensors store the same flow data and both are paid for","bin":1},{"t":"The rule that fires 143 times a night has no owner and has never been tuned","bin":2},{"t":"Analysts retype the same host name into four different consoles","bin":1},{"t":"The automation service account reads its token from a script on a shared drive","bin":0},{"t":"The daily report is assembled by hand and takes ninety minutes","bin":1},{"t":"The endpoint agent on the database zone has been in audit-only mode since March","bin":2},{"t":"Cases are closed with the evidence field left empty because the template has no such field","bin":2}],"hint":"Ask two questions of every finding: does it create risk, and does it consume time? Some do both.","explain":"Four findings are single-sided. The playbook that disables accounts without an approval record is a pure control gap: nothing is slower, but a mistake cannot be explained or reversed. The duplicate sensors, the retyping and the ninety-minute manual report are pure wasted effort: no risk is created, but analysts spend hours on work a machine should do. Four findings are both, and that is why they come first. An untuned rule with no owner burns thirty analyst hours a week and hides the real attack in the noise. An agent stuck in audit-only mode costs nothing in time, but it takes a whole database zone off the detection map. Secrets in a script on a share are both a leak waiting to happen and a rotation task that eats an afternoon every time it is done by hand. A template with no evidence field produces useless audit material and forces the same investigation to be repeated later. Classifying findings this way is how a small team decides what to fix first without a long debate.","study":"Score every finding twice: the risk it creates and the time it consumes. Fix the ones that score on both.","keys":["Secrets management for automation","Human-in-the-loop approval","Tool sprawl and consolidation","Telemetry health and data source","Rule tuning and threshold","Evidence collection and audit readiness","Workload balancing","Detection coverage"]},{"id":"hard-3","type":"multi","theme":"Metrics that lie","summary":"Response time fell by two thirds — decide which statements the data really supports","scenario":[{"label":"Artefact 1 — Quarter comparison, before and after automation","kind":"kv","rows":[["Mean time to respond","6 hours 05 before, 1 hour 58 after"],["Cases reopened within seven days","3 before, 61 after"],["Cases closed by automation without a human","10 percent before, 70 percent after"],["Confirmed intrusions found","4 before, 4 after"]]},{"label":"Artefact 2 — Note from the analyst who runs the queue","kind":"text","text":"The playbook closes a case once the host is isolated. It does not wait for the root cause, and it does not check whether the isolation actually stopped the activity."}],"question":"Which statements does this data actually support? Select every correct one.","options":["Part of the fall in response time comes from closing cases earlier","The automation is faster than a human at every single step","The reopen rate is the number to watch before trusting the new figure","A lower response time always means a better security outcome","The team should report response time next to the reopen rate","The seventy percent figure proves the licence cost is justified"],"answer":[0,2,4],"hint":"Look at the reopen rate. Sixty-one cases came back.","explain":"Three statements are supported. The reopen rate rose from three to sixty-one while response time fell by two thirds and the automation closes most cases, so a large part of the improvement is cases being closed before the work is finished. That makes the reopen rate the number to watch: it is the correction to the headline figure. And the honest way to report the improvement is response time next to the reopen rate, so nobody can quote one number without the other. The other three statements are not supported. Nothing here says the automation is faster at every step, and the confirmed intrusion count is unchanged at four, which is the outcome that matters most. The licence argument needs a cost calculation, not an automation percentage.","study":"A metric that improves while the reopen rate rises is measuring a change in the definition, not a change in the outcome.","keys":["Mean time to respond (MTTR)","KPI and KRI","Dashboard and reporting","Automation candidate selection","Executive and board reporting","Ticket lifecycle"]},{"id":"hard-4","type":"order","theme":"Detection as code","summary":"Six stages from a written rule to a production deployment — put the pipeline in order","scenario":[{"label":"Artefact 1 — Detection pipeline documentation, unfinished","kind":"text","text":"The team stores every detection rule as a file in a repository. The pipeline stages were listed in a design document but never put in order, and a rule reached production last month with no test at all."}],"question":"Put the six pipeline stages in the correct order.","items":["Write the rule on a branch and add a test file with one matching and one non-matching event","Open a pull request so a detection engineer reviews the logic and the metadata","Let the pipeline replay last week's stored events and report the expected alert volume","Deploy to the staging SIEM and let the hunting team use the rule for two days","Merge and deploy to production inside the agreed change window","Watch the real alert volume for a week, then tune the threshold or roll the rule back"],"hint":"Nothing reaches the production SIEM before a review, a replay and a live pilot have all happened.","explain":"The order matters because each stage removes a different kind of failure. Writing the rule together with a matching and a non-matching event makes the rule testable, which is the whole point of keeping detections as code. The pull request brings a second pair of eyes onto the logic and the metadata before anything runs. The replay against last week's stored events is the stage that catches a missing threshold: it turns a silent logic error into a number, for example nine thousand expected alerts. The staging deployment lets the hunting team use the rule against real behaviour for two days and report what breaks. Only then does the change window open and the rule reach production. The last stage is not optional either: the real volume a week later is what proves the estimate, and it is the trigger to tune or roll back. The rule that reached production with no test last month skipped the first three stages and produced the nine thousand alerts this file already covered.","study":"Rule and test, review, replay, staged pilot, change window, then measure and tune. Every stage removes a different failure.","keys":["Detection as code","CI/CD pipeline for detections","Detection regression test","Change management and CAB","Rule tuning and threshold","Guardrails and rollback"]},{"id":"hard-5","type":"spot","theme":"Automation with a blunt weapon","summary":"A playbook blocked four thousand addresses in one night, including the corporate gateway","scenario":[{"label":"Artefact 1 — Containment playbook PB-09, as deployed","kind":"code","lines":["trigger: tip_feed_match","for indicator in feed.new_indicators:","    if indicator.seen:","        firewall.block(indicator.ip)","        ticket.create(summary=\"auto block \" + indicator.ip)","        notify.send(\"soc@\", \"blocked \" + indicator.ip)","retries: 3","confidence_field: ignored"]},{"label":"Artefact 2 — Overnight result","kind":"kv","rows":[["Addresses blocked","4,100"],["Addresses later found malicious","12"],["Notable blocked address","the corporate web gateway used by every remote worker"],["Recovery","The gateway block was found at 07:40 by a user who could not work"]]}],"question":"Which line turned one bad feed entry into a business outage?","options":["Line 3: every indicator is blocked with no confidence check","Line 1: matching a feed directly is the wrong trigger for a playbook","Line 6: notifying the team adds load to the mail system today","Line 7: three retries is too few for a firewall API"],"answer":0,"hint":"Ask what makes an indicator worth blocking: its score, its age, its context, or the fact that it exists.","explain":"The condition on line 3 is true for every indicator that has ever been observed, whatever its confidence, its age or its context. That is why 4,100 addresses were blocked and only twelve were malicious. The corporate gateway was in a feed because it once hosted something suspicious, and a gateway address is shared by thousands of legitimate users, so blocking it stops the business rather than the attacker. A hardened version scores the indicator first, requires a confidence above a threshold, excludes shared infrastructure such as gateways and resolvers, and holds the block for human approval when the indicator is new or the target is critical. It also refuses to block an address that carries production traffic. The retry count and the notification are not the cause. The clue is the last line of the file: the confidence field was available and ignored.","study":"Score indicators before blocking them, exclude shared infrastructure, and keep a human approval for new or critical blocks.","keys":["Automated containment","Guardrails and rollback","IoC feed","Threat intelligence platform (TIP)","False positive rate","Risk-based prioritization","Human-in-the-loop approval"]},{"id":"hard-6","type":"match","theme":"Coverage you cannot see","summary":"Six telemetry gaps — match each one to the technique it blinds you to","scenario":[{"label":"Artefact 1 — Telemetry review, server and identity zones","kind":"text","text":"The team mapped its detection coverage against the techniques its sector faces. Six data sources are missing or incomplete. Each gap hides a specific technique."}],"question":"Pair each telemetry gap with the technique it blinds the team to.","pairs":[["No PowerShell script-block logging","encoded commands run through a signed system binary"],["No DNS query logging on the internal resolvers","beaconing to a domain built by an algorithm"],["No command-line arguments in process events","living-off-the-land tools called with switches"],["No audit trail from the identity provider","token theft and impossible-travel sign-ins"],["No registry change events on the servers","persistence written into a start-up key"],["No address-to-user mapping for the wireless range","an unknown device joined to the corporate network"]],"hint":"Ask which record would have to exist for the alert to fire at all.","explain":"Each gap removes the raw material a detection needs, so no rule can help. Without script-block logging, an encoded command run through a signed binary leaves almost no trace, and that is one of the most common techniques in real intrusions. Without DNS logging, algorithm-generated domains are invisible, because the queries never reach a sensor. Without command-line arguments, every living-off-the-land tool looks like a normal process and the switches that reveal it are lost. Without identity-provider logs, a stolen token looks like a normal user, and impossible travel can never be calculated. Without registry events, a start-up key written by an attacker is a silent change. Without address-to-user mapping, an unknown device on the wireless network has no owner, so nobody can be asked about it. The value of this exercise is the direction of the fix: these are data source problems, not rule-writing problems, and no amount of tuning solves them.","study":"Detection coverage is limited by telemetry. A missing data source is a blind technique, whatever the rules say.","keys":["MITRE ATT&CK coverage mapping","Telemetry health and data source","Detection coverage","Gap analysis","Hypothesis-driven threat hunting","Detection use case"]},{"id":"hard-7","type":"mcq","theme":"Maturity and priority","summary":"Five maturity scores and twenty days of effort — decide where the effort goes first","scenario":[{"label":"Artefact 1 — Assessment scores, scale of one to five","kind":"kv","rows":[["Incident response","4 of 5, documented and rehearsed"],["Detection engineering","2 of 5, rules written by request with no coverage map"],["Threat hunting","1 of 5, no documented practice at all"],["Metrics and reporting","3 of 5, manual monthly pack"],["Automation","1 of 5, two scripts that one person maintains"]]},{"label":"Artefact 2 — Sector threat report, top three techniques","kind":"text","text":"The three techniques used most against organisations in this sector are credential dumping, valid-account use, and living-off-the-land binaries. The team has no validated detection for credential dumping or valid-account use."}],"question":"Where should the twenty days of effort go first?","options":["Detection engineering: the two blind techniques are the ones being used","Threat hunting: it has the lowest score on the whole assessment","Automation: the lowest score, and one person is a single point of failure","Incident response: already mature, so a small push would finish it"],"answer":0,"hint":"The lowest score is not automatically the biggest risk. Read the threat report again.","explain":"The scores alone point at hunting and automation, because both sit at one out of five. The threat report changes the answer. Two of the three techniques actually used against this sector have no validated detection, which means the organisation cannot see the attacks that are most likely to arrive, and no amount of hunting skill fixes that: a hunter cannot find what the telemetry never recorded. Detection engineering is the constraint, so it goes first, and the two techniques give the work a precise scope. Hunting is the next candidate and automation after it, but both are less urgent than a blind spot on the main attack path. Improving the most mature area, incident response, is the classic mistake of polishing what is already comfortable. This is risk-based prioritisation: the score says where you are weak, the threat report says what it costs you.","study":"Prioritise by the gap that matches the threats you actually face, not by the lowest score on a maturity chart.","keys":["Maturity model (SOC-CMM)","Gap analysis","Risk-based prioritization","MITRE ATT&CK coverage mapping","Detection coverage","Executive and board reporting","Hypothesis-driven threat hunting","Automation candidate selection"]},{"id":"hard-8","type":"fill","theme":"The business case","summary":"Complete the two sentences a board actually remembers","scenario":[{"label":"Artefact 1 — Draft of the one-page business case","kind":"text","text":"The CISO has one page and ten minutes. The draft below is missing four terms. An advisor said the board will remember the first sentence and the last one."}],"question":"Complete the business case by choosing the right term for each gap.","parts":["The proposal lowers {{}}, so an attacker has less time inside the network before we act.","The last two incidents had the same {{}}: a mistyped host name in a step that a person performed by hand.","The team will show the {{}} to the board every month, so the benefit is visible and can be challenged.","If the numbers do not move after two quarters, the contract allows the team to stop paying; that is the {{}}."],"answers":["dwell time","root cause","return on investment","exit clause"],"bank":["dwell time","root cause","return on investment","exit clause","threat hunting","service catalog","false positive","maturity level"],"hint":"One blank is about how long an attacker stays hidden, one about why the incidents happened, one about the money, and one about the way out.","explain":"Dwell time is the term a board understands: how long an attacker is inside before anyone notices, and every hour removed is real risk removed. Root cause is the honest explanation of why the last two incidents happened, and here it was a human step that automation removes, which is a stronger argument than any tool feature. Return on investment is the number the board will ask for, and it must be shown monthly so the claim can be tested rather than trusted. An exit clause is what makes the proposal safe to approve: if the benefit does not appear in two quarters, the organisation can stop paying, which turns a leap of faith into a decision with a review date. The distractors are the words people reach for when they have no numbers: threat hunting sounds impressive but says nothing about value, a service catalog is an inventory artefact, and a maturity level is an internal score.","study":"Boards fund reduced dwell time, proven root causes, a visible return and a way out. Give them all four.","keys":["Return on investment (ROI)","Cost-benefit analysis","Executive and board reporting","Dwell time","Root cause analysis (RCA)","Exception and waiver"]},{"id":"hard-9","type":"branch","theme":"Ransomware, first hour","summary":"Two hosts are encrypting and one is a domain controller — the obvious first move is the wrong one","scenario":[{"label":"Artefact 1 — 02:10, on-call laptop","kind":"kv","rows":[["Alert 1","EDR: file server fs-02 writing encrypted files, 4,000 files in 90 seconds"],["Alert 2","EDR: new service installed on domain controller dc-01"],["Context","dc-01 is also the only DNS server for the site, and the backup target for the ERP system is mounted on fs-02"],["Time","02:10, you are alone until 06:00"]]}],"question":"Work through the first hour of this incident. Each step locks when you check it.","steps":[{"question":"Encryption is running on fs-02 and a new service appeared on dc-01. What is your first action?","options":["Declare the incident, page the incident lead, and preserve the state of both hosts","Isolate every host in the server zone and the domain controller at once","Shut the file server down immediately to stop the encryption"],"answer":0,"explain":"The first action in a ransomware case is to declare it and bring the responders in, while preserving what the hosts can still tell you. Isolating the whole zone and the domain controller at once would take the site offline, including the ERP, and it would destroy the live evidence before anyone recorded it. Shutting down the file server feels decisive but it erases the memory, the open handles and the process tree that show how the attacker got in and what else was touched. Containment is still urgent, and it happens next, in a controlled order that the incident lead can see. The one thing you must not do alone at 02:10 is make an irreversible move on a domain controller.","note":"Containment is a decision about order, not a reflex."},{"scenarioSummary":"Step 2 — 02:40, the encryption is contained","scenario":[{"label":"Artefact 2 — First observations","kind":"log","lines":[{"t":"02:41","s":"ir","m":"fs-02 isolated from the network, encryption stopped, backup target untouched"},{"t":"02:44","s":"ir","m":"new service on dc-01 runs as svc_deploy, a service account used by the build pipeline"},{"t":"02:47","s":"ir","m":"svc_deploy authenticated from build-runner-03 and from a workstation in the same hour"},{"t":"02:52","s":"ir","m":"build pipeline has stored credentials in a plain file on a share since 2024"}]}],"question":"The attacker is still active. Where do you look first?","options":["The identity: the service account, its logon sources and where its credentials are stored","The malware: the encrypted file pattern on the file server","The perimeter: the firewall logs for the last hour"],"answer":0,"explain":"The evidence points at an identity, not at a piece of malware. A service account used by a build pipeline installed a service on the domain controller, and the credentials for that pipeline have been sitting in a plain file on a shared drive. That is how the attacker moved from a build runner to the domain controller, and it is also how they will come back. The hunt therefore starts with the identity: where it authenticated from, what it created, which tokens were issued, and who else can read that credential file. Chasing the encrypted file pattern tells you what the ransomware did, not how it arrived. The firewall logs are worth reading later to find the first foothold, but the immediate question is how far the service account reached.","note":"Follow the identity before you follow the malware."},{"scenarioSummary":"Step 3 — thirty days later","scenario":[{"label":"Artefact 3 — Post-incident actions","kind":"kv","rows":[["Action 1","Move pipeline credentials into the secret store, rotate every one of them"],["Action 2","Alert when a service account authenticates from a new host"],["Action 3","Rebuild the playbook for service-account abuse"],["Question from the CISO","How do I know any of this worked?"]]}],"question":"What proves that the improvement actually worked?","options":["A purple-team replay of the same path, plus the ticket metrics for the new playbook","A slide in the management pack that says all three actions are complete","The vendor's newest detection content, installed on the sensors"],"answer":0,"explain":"Only a replay proves the path is closed. The purple team repeats the same movement, from the build runner to a service account on a domain controller, and the team measures whether the new alert fires and how quickly it is handled. That produces two kinds of evidence: whether the detection works, and whether the process responds. A slide that lists completed actions records effort, not effect. New vendor content is welcome, but it says nothing about whether this organisation's path is closed, because it was never written for this path. When the replay produces an alert within the target time, and the playbook ticket shows the right owner and outcome, the loop is closed.","note":"Completed actions are not results. Replay the attack and read the ticket."}],"hint":"At each step ask what you would be able to prove afterwards, not what feels most decisive right now.","explain":"This chain runs the full improvement loop on a live incident. First, declare and preserve rather than improvise an irreversible containment. Second, follow the identity, because that is how the attacker moved and how they would return. Third, prove the fix with a replay and the response metrics, because a list of completed actions is not evidence. The same three habits — preserve, follow the identity, prove the fix — are what turn one bad night into a permanently better process.","study":"Declare and preserve first, follow the identity second, and prove the fix by replaying the same attack afterwards.","keys":["Post-incident review","Purple teaming","Detection regression test","Guardrails and rollback","Escalation path","Lessons learned"]},{"id":"hard-10","type":"logq","theme":"The alert that never came","summary":"A feed stopped shipping six days ago and nobody noticed — find the control that failed first","scenario":[{"label":"Artefact 1 — Data-source health, printed at 09:00 today","kind":"kv","rows":[["db-01 security events","last event 6 days ago, expected 40,000 per day"],["db-02 security events","last event 2 minutes ago"],["Endpoint agents reporting","1,842 of 1,844"],["Health alert configured for the feed","none"]]},{"label":"Artefact 2 — What the team was doing instead","kind":"log","lines":[{"t":"Mon","s":"tier1","m":"queue cleared early, analysts used the time for the improvement backlog"},{"t":"Tue","s":"tier1","m":"MTTD dashboard shows a healthy 6 minutes, no alerts for the db zone"},{"t":"Wed","s":"manager","m":"weekly pack reports 'no database incidents this week', read as good news"},{"t":"Thu","s":"tier3","m":"hunting hypothesis about database credentials produced no events to search"},{"t":"Fri","s":"audit","m":"control test failed: no evidence that database activity was monitored this week"}]}],"question":"The database zone had no events for six days. Which control failed first?","options":["Data-source health monitoring: nobody watched whether the feed was alive","The correlation rules: their logic cannot fire without events to read","The endpoint agent on db-01: it stopped sending its own events","The ticket queue: no ticket was raised for the missing activity"],"answer":0,"hint":"One failure caused all the others, and it is the one that appears in the health row as 'none configured'.","explain":"Every other failure follows from the first one. The health row says that no alert was ever configured for the feed, so a source that stopped six days ago stayed silent and the silence looked like good news: a healthy mean time to detect, a quiet database, no incidents to report. The correlation rules were fine and had nothing to read. The agent is only the messenger: it reported its own last event six days ago, which is exactly the evidence that was never watched. No ticket was raised because nothing generated one. The fix is a data-source health control with an alert on the expected volume per source, reviewed daily, and a control test that asks for evidence of monitoring rather than absence of incidents. This is also why the weekly pack was dangerous: 'no incidents' and 'no data' must never look the same.","study":"Monitor data-source liveness and volume. Absence of alerts is not evidence of absence of attacks.","keys":["Telemetry health and data source","Detection coverage","Continuous compliance monitoring","Dashboard and reporting","False negative","SIEM correlation rule","Mean time to detect (MTTD)"]},{"id":"hard-11","type":"order","theme":"Spending the budget","summary":"Six projects, 60,000 of budget — rank them by loss prevented per unit of cost","scenario":[{"label":"Artefact 1 — Project list with cost and estimated annual loss prevented","kind":"kv","rows":[["P1 Close the two blind techniques the sector faces","cost 15,000, prevents 480,000 per year"],["P2 Multi-factor authentication for every privileged account","cost 20,000, prevents 900,000 per year"],["P3 Retire the unsupported file servers","cost 5,000, prevents 90,000 per year"],["P4 Immutable backups with a quarterly restore test","cost 12,000, prevents 300,000 per year"],["P5 Replace the three overlapping network sensors","cost 40,000, prevents 700,000 per year"],["P6 Rewrite the security awareness training","cost 8,000, prevents 60,000 per year"]]},{"label":"Artefact 2 — Instruction from the finance director","kind":"text","text":"Rank the projects by value for money, best first. Value for money means the loss prevented for each unit of cost, not the total loss prevented."}],"question":"Rank the six projects from the best value for money to the worst.","items":["P2 Multi-factor authentication for privileged accounts","P1 Close the two blind techniques the sector faces","P4 Immutable backups with a quarterly restore test","P3 Retire the unsupported file servers","P5 Replace the three overlapping network sensors","P6 Rewrite the security awareness training"],"hint":"Divide the loss prevented by the cost. Two projects are very close, and the more expensive one loses.","explain":"The ratio decides the ranking. P2 prevents 900,000 for 20,000, which is 45 of loss prevented per unit of cost. P1 prevents 480,000 for 15,000, which is 32. P4 prevents 300,000 for 12,000, which is 25. P3 prevents 90,000 for 5,000, which is 18. P5 prevents 700,000 for 40,000, which is 17.5, and P6 prevents 60,000 for 8,000, which is 7.5. The interesting comparison is P5 against P3: P5 prevents almost eight times as much loss in absolute terms, but it costs eight times as much, so it is slightly worse value, and it loses the argument. That is the trap in this kind of ranking: the biggest number on the page is not the best use of the money. Note also what the ratios do not capture, and say so out loud: P5 removes a duplicate tool, so it also saves licence and training time, and P2 protects the accounts that lead to everything else. A ranking is a starting point for a conversation, not a decision on its own.","study":"Rank by prevented loss divided by cost, then discuss the strategic effects the ratio cannot see.","keys":["Risk-based prioritization","Cost-benefit analysis","Return on investment (ROI)","MITRE ATT&CK coverage mapping","Executive and board reporting","Tool sprawl and consolidation"]},{"id":"hard-12","type":"multi","theme":"Audit-ready automation","summary":"An auditor asks how the automated containment is proved — which artefacts answer the question","scenario":[{"label":"Artefact 1 — Auditor's request, control 8.4","kind":"text","text":"Show me that the automated containment works as designed, that a person is accountable for each action, and that a wrong action can be reversed. Select every artefact that answers the request."}],"question":"Which artefacts prove that the automated containment is under control? Select every correct one.","options":["An immutable action log that ties every containment to a case identifier","A screenshot of the playbook editor taken by the analyst who wrote it","The approval record naming who allowed the containment and when","The rollback that was executed and recorded during the last test","A note in the analyst's personal notebook saying the test passed","The vendor's product sheet describing the containment feature"],"answer":[0,2,3],"hint":"An auditor needs evidence that a third party can verify without trusting a person's memory.","explain":"Three artefacts answer the request. An immutable action log ties each containment to a case, so an auditor can take one action and follow it back to the decision that caused it, and forward to what happened next. The approval record names the human who allowed the action, which is the accountability the control promises. The recorded rollback proves the claim that a wrong action can be reversed, because it shows one that actually was. The other three fail the auditor's test for the same reason: they cannot be verified independently. A screenshot proves that a screen existed, not that the playbook behaved. A personal notebook is not a record, and it disappears when the person leaves. A vendor sheet describes what the product could do for anybody, not what this organisation did. The general rule is that audit evidence must be produced by the process, stored where it cannot be edited, and readable by someone who was not there.","study":"Audit-ready automation produces its own evidence: action log, approval record and a tested rollback.","keys":["Evidence collection and audit readiness","Compliance automation","Guardrails and rollback","Human-in-the-loop approval","Policy enforcement","Change management and CAB"]},{"id":"hard-13","type":"match","theme":"One piece of evidence, four frameworks","summary":"Match each obligation with the evidence that actually satisfies it","scenario":[{"label":"Artefact 1 — Evidence register, cross-framework view","kind":"text","text":"The team keeps one evidence register and maps each item to the obligations it satisfies. Two of the five items are often confused, because they both concern access and both use the word review."}],"question":"Pair each obligation with the evidence that satisfies it.","pairs":[["ISO/IEC 27001 access control","the quarterly review record showing leavers lost access on their last day"],["PCI DSS log retention","twelve months of retained logs with a daily review sign-off"],["SOC 2 change management","the ticket showing a test, an approval and a different person deploying"],["NIST Cybersecurity Framework detect function","the use case that maps to a technique and has a named owner"],["Regulatory breach notification","the record proving the regulator was told inside the legal deadline"]],"hint":"Ask who reads the evidence: an auditor of the management system, a card acquirer, a customer, the board, or a regulator.","explain":"Each obligation is satisfied by a different kind of record, even when the control sounds similar. ISO/IEC 27001 asks whether the access control is managed and reviewed, so the evidence is the review record itself, and the date of the leaver's last day is what makes it meaningful. PCI DSS is prescriptive about logs: a defined retention period plus proof that somebody looks at them daily. SOC 2 asks whether the change control operates as described, so the evidence is the separation of duties inside one ticket: test, approval, and a different person deploying. The NIST Cybersecurity Framework is not audited against directly; its detect function is satisfied by showing that a use case exists, maps to a technique and has an owner, which is the same coverage map the team uses internally. Regulatory breach notification is about the clock: a record proving the notification happened inside the legal deadline. The lesson is that one control can satisfy several frameworks, but each framework asks for it in a different form, so the register must map evidence to obligation rather than keep two parallel sets of paperwork.","study":"Map each piece of evidence to the obligation it satisfies. Frameworks ask for the same control in different forms.","keys":["ISO/IEC 27001","PCI DSS","SOC 2","NIST Cybersecurity Framework","Regulatory reporting","Evidence collection and audit readiness","Continuous compliance monitoring","Policy enforcement"]},{"id":"hard-14","type":"spot","theme":"Least privilege for a robot","summary":"A connector configuration a reviewer must reject — find the flaw that matters most","scenario":[{"label":"Artefact 1 — Connector configuration, submitted for review","kind":"code","lines":["connector: edr_api","auth:","  account: svc_soar","  role: global_administrator","scopes: [\"*\"]","actions: [isolate_host, read_all, remove_user, delete_file]","logging: disabled"]},{"label":"Artefact 2 — Purpose of the connector","kind":"text","text":"The playbook using this connector isolates a single endpoint and reads basic host information. Nothing else."}],"question":"Which flaw must a reviewer reject first?","options":["The role is global administrator where two named actions were needed","Logging is disabled, which is untidy but not a security control","The account name does not follow the service naming standard","The connector should point at the ticketing system, not the EDR API"],"answer":0,"hint":"Compare the rights granted with the two actions the playbook actually performs.","explain":"The purpose is to isolate one endpoint and read basic information, and the configuration grants the whole tenant plus every scope. That is the flaw that must be rejected: if the SOAR platform or its credential is ever compromised, the attacker inherits global administrator on the endpoint estate, which is the same as handing over the fleet. The fix is a role limited to isolation and read, scoped to the groups the playbook serves, with remove_user and delete_file taken out completely, because a destructive action nobody uses is only a future accident. Disabled logging is a real problem too, and it belongs second on the list: an action with no log cannot be investigated. The naming point is cosmetic. The connector direction is correct, because the EDR API is exactly what the playbook must call.","study":"Give an automation account the rights its playbook uses and nothing else. Delete unused destructive actions.","keys":["Secrets management for automation","API integration","Policy enforcement","Guardrails and rollback","Risk-based prioritization","Configuration baseline"]},{"id":"hard-15","type":"branch","theme":"Three days before the audit","summary":"Forty servers were never given a hardening baseline — choose the path that stays honest and controlled","scenario":[{"label":"Artefact 1 — Finding, 08:00 Monday","kind":"kv","rows":[["Audit","ISO/IEC 27001 surveillance audit starts Thursday"],["Finding","40 of 260 production servers have no hardening baseline assigned"],["Reality","Most are recently built application servers, three are internet facing"],["Change window","The next scheduled window is Saturday night; an emergency window exists for critical changes"]]}],"question":"Work through the three steps of this audit finding, in order.","steps":[{"question":"You find the gap on Monday and the audit starts on Thursday. What do you do first?","options":["Measure the real exposure, then tell the auditor early with a plan and a date","Assign and apply the baseline profile to all forty servers tonight","Leave the forty servers out of the audit sample and fix them afterwards"],"answer":0,"explain":"Two of these options are dishonest and one is dangerous. Applying a hardening profile to forty production servers in one night breaks the change process and will cause an outage, which is a worse finding than the original gap. Hiding the servers from the sample is worse still: an auditor who discovers a concealed gap turns a small finding into a finding about integrity. The defensible path is to measure what the gap actually means, starting with the three internet-facing hosts, and to tell the auditor before they find it, with a plan and a date. Auditors respond to a known gap with a plan very differently from a gap they discover, because the first shows a working management system and the second suggests the system does not work."},{"scenarioSummary":"Step 2 — the plan meets the change process","scenario":[{"label":"Artefact 2 — Constraints","kind":"text","text":"The baseline profile changes thirty-one settings, including the TLS configuration and the audit policy. Two of the forty servers run a vendor application that the vendor says must not be changed without their approval. The application team can support an emergency change for the three internet-facing hosts only."}],"question":"How should the forty servers be handled?","options":["Split it: emergency change for the internet-facing three, planned changes for the rest","Apply the full baseline to all forty tonight, since the audit comes first","Do nothing until the audit is over, then schedule everything in one window"],"answer":0,"explain":"The risk is not spread evenly across the forty, so the response should not be either. The three internet-facing servers carry the real exposure and the application team can support an emergency change for them, so they go first. The remaining servers are handled through planned changes grouped by application owner, with the two vendor-locked systems deferred until the vendor confirms the settings, which is a documented exception with a date. Applying everything at once ignores both the change process and the vendor constraint, and it is how a compliance fix becomes an outage. Doing nothing until after the audit leaves the internet-facing risk open for a week for no reason. Splitting the work is how a small team stays honest and in control at the same time."},{"scenarioSummary":"Step 3 — the audit closes with one finding","scenario":[{"label":"Artefact 3 — Closing meeting","kind":"text","text":"The auditor accepts the plan and raises one finding: new servers can enter production without a baseline assignment, and nothing detects it. The build team says they will remember to check the baseline from now on."}],"question":"What stops the same gap appearing next quarter?","options":["Alert when a new server appears without a baseline assignment","Add a manual baseline check to the quarterly access review","Ask the build team to remember the baseline step every time"],"answer":0,"explain":"Nothing about this gap was a knowledge problem: the build team knew the rule, and forty servers still arrived without a baseline. The fix has to be a detection, not a reminder. An alert when a new server appears without a baseline assignment closes the gap on the day it opens, and it produces its own evidence for the next audit. A manual check in a quarterly review would find the gap up to three months late, which is exactly how it was found this time. Asking people to remember is a control that depends on a busy human being, which is the definition of a control that will fail. The general principle is that a process gap discovered by an audit should be converted into a monitor, and the monitor belongs to the team that builds the servers.","note":"Turn every audit finding into a monitor, not a reminder."}],"hint":"At each step choose the option that a reasonable auditor would accept as evidence of a working process.","explain":"This is compliance work done properly. Measure the exposure, disclose early with a plan, respect the change process by splitting the work, and turn the finding into an automated monitor so it cannot return. The tempting shortcuts — a mass change at night, a hidden sample, a promise to remember — all produce a worse outcome than the original gap.","study":"Disclose early with a plan, fix the highest exposure first through the change process, then convert the finding into a monitor.","keys":["Configuration baseline","Change management and CAB","Evidence collection and audit readiness","Continuous compliance monitoring","Compliance automation","Gap analysis","Exception and waiver"]},{"id":"hard-16","type":"mcq","theme":"A number that moved by itself","summary":"SLA compliance rose from 82 to 99 percent — decide what actually changed","scenario":[{"label":"Artefact 1 — Service report, two quarters","kind":"kv","rows":[["SLA compliance","82 percent in quarter 2, 99 percent in quarter 3"],["Change made in quarter 3","Alerts raised after 17:00 are now created with a due date of the next working day"],["Alerts raised after 17:00","31 percent of all alerts, unchanged between quarters"],["Analyst hours per day","unchanged"]]}],"question":"What do you report to the service owner?","options":["The target definition changed, so the quarters are not comparable","The team fixed the real cause of the late tickets in quarter 3","SLA compliance is the strongest available measure of SOC quality","The service owner should raise the other targets to match this one"],"answer":0,"hint":"Nothing about the work changed. Something about the clock changed.","explain":"The only change between the quarters is the due date calculation, and it applies to almost a third of all alerts. Moving the due date to the next working day means those tickets cannot be late by definition, so the 99 percent figure is arithmetic rather than improvement. The work itself is identical: the same share of alerts arrives after 17:00, and the same number of analyst hours is spent. The honest report names the redefinition, shows both quarters calculated on the old definition, and then discusses whether the new target is the one the business wants. This is the most common way an operations metric is gamed without anybody intending to cheat, and it is why any change to a metric definition needs to be recorded next to the number.","study":"Record when a target's definition changes. A metric that improves because the clock moved has not improved.","keys":["SLA and SLO","KPI and KRI","Dashboard and reporting","Ticket lifecycle","Executive and board reporting","Mean time to acknowledge (MTTA)","Ticket automation"]},{"id":"hard-17","type":"terminal","theme":"Evidence for the network team","summary":"Task 140 — produce the list of blocked destinations the network team asked for","scenario":[{"label":"Artefact 1 — Task TASK-140, raised by the network team","kind":"kv","rows":[["Input","/evidence/proxy.log, one line per request: timestamp, source host, destination host, method, action"],["Deliverable","/evidence/denied-hosts.txt, holding each denied destination once, in alphabetical order"],["Reason","The network team reviews the blocked destinations every morning before they change the rules"],["Constraint","Read-only work. Do not modify or delete the proxy log"]]}],"question":"Type one command that produces the deliverable exactly as described.","prompt":"analyst@soc-ws-04:~$","env":"Practice shell on soc-ws-04. /evidence exists and is writable. Build the file with one command line, then press Run command.","canonical":"grep DENY /evidence/proxy.log | awk '{print $3}' | sort -u > /evidence/denied-hosts.txt","judge":[{"label":"Reads the proxy log","re":"proxy\\.log","why":"the command does not read the log named in the task"},{"label":"Keeps only the denied requests","re":"deny|denied|block","why":"the command does not select the denied requests"},{"label":"Reduces the destinations to one line each","re":"sort\\s+-u|uniq|awk.*!seen","why":"the command does not remove the duplicate destinations"},{"label":"Writes the named evidence file","re":"/evidence/denied-hosts\\.txt","why":"the command does not write the file the network team asked for"}],"forbid":[{"re":"rm\\s+-rf|>\\s*/evidence/proxy\\.log|\\bsed\\s+-i"}],"termIntro":["Practice shell on soc-ws-04. The evidence folder is /evidence.","Type the command, then press Run command."],"termOut":["denied-hosts.txt created","cdn[.]ads-partner[.]example","drop[.]fileshare-upload[.]example","paste[.]note-drop[.]example","soc-ws-04:/evidence$ "],"parts":[["grep DENY","selects only the request lines whose action is DENY"],["awk '{print $3}'","prints the third field of each line, which is the destination host"],["sort -u","sorts the hosts and removes the duplicates in one step"],["> /evidence/denied-hosts.txt","writes the result into the file the task names"]],"hint":"Four things must be true of the result: only denied lines, one line per destination, sorted, and written to the named file.","explain":"The task has four requirements and the command line answers each one. Selection comes first, because the network team only cares about the blocked requests. Field extraction comes next: the destination is the third column, and taking it is what turns request lines into host names. Sorting with unique removal does two jobs at once and produces the alphabetical list the task asks for. Finally the redirect writes the deliverable rather than printing it on the screen, which matters because the network team reviews a file, not your terminal. Any tool set that achieves those four things is acceptable: a different extraction tool or a two-stage unique step is equally correct if the output is the same file. What is not acceptable is touching the source log, which is the evidence base for every other task this week.","study":"Read the deliverable as a specification: which lines, which field, one each, sorted, written where it was asked for.","keys":["Scripting (Python, Bash, PowerShell)","Automation candidate selection","Evidence collection and audit readiness","Continuous improvement","Workload balancing"]},{"id":"hard-18","type":"multi","theme":"Tuning without going blind","summary":"Which statements about thresholds and suppressions are actually true","scenario":[{"label":"Artefact 1 — Tuning policy debate, Thursday meeting","kind":"text","text":"The team is arguing about a rule that produced 1,900 alerts this week, of which four were real. Select every statement that is true, not the ones that sound reassuring."}],"question":"Which statements are true? Select every correct one.","options":["Raising a threshold lowers noise and can hide a slow attack","A suppression without an end date quietly becomes permanent","Adding every new detection improves coverage at no cost","An exception signed by the risk owner is the same as ignoring the rule","Reviewing suppressions on a schedule keeps coverage honest","A rule that produces no alerts is proof that the technique never happens"],"answer":[0,1,4],"hint":"Four of these statements are comfortable. Three of them are true.","explain":"Three statements are true. Raising a threshold trades one failure for another: fewer false positives, and a slow attack that stays under the new bar becomes a false negative, which is why a threshold change needs a test against real history. A suppression with no end date is a permanent change that nobody remembers making, and it is how a detection quietly disappears. Reviewing suppressions on a schedule, with an owner and a reason for each one, is what keeps coverage honest. The other three are false. Adding detections has real costs: more queue, more tuning, more analyst attention, and overlapping rules produce the same alert three times. An exception signed by the risk owner is a managed, time-limited decision with accountability, which is the opposite of ignoring a rule. And a rule that produces no alerts proves nothing at all: it may be working, or its data source may have stopped six days ago.","study":"Every tuning decision trades false positives against false negatives. Write down the trade and give it an expiry date.","keys":["Suppression and exception","Rule tuning and threshold","False positive rate","False negative","Detection coverage","Exception and waiver","Signal-to-noise ratio"]},{"id":"hard-19","type":"order","theme":"Cloud incident, partial permissions","summary":"An access key was used to change production storage — order the response when your automation can only do half the job","scenario":[{"label":"Artefact 1 — Situation","kind":"kv","rows":[["Alert","A cloud storage bucket holding customer exports was made public for 22 minutes"],["Identity","A long-lived access key belonging to a deployment identity"],["Constraint","The SOAR playbook can read the audit trail and disable the key, but it cannot change bucket policy"],["Constraint","A pipeline depends on the same identity and runs every hour"]]}],"question":"Put the six response steps in the right order.","items":["Read the cloud audit trail and name the identity that changed the bucket policy","Disable the access key the identity is using, so the pipeline cannot use it again","List every resource that identity touched in the last 24 hours","Snapshot the affected storage and record who could have read it while it was public","Rebuild the identity with only the permissions the pipeline needs, then re-enable the pipeline","Add a guardrail so a new deployment identity cannot be created without an owner tag"],"hint":"Stop the bleeding, then find out how far it went, then rebuild properly. The last step is the one that lasts.","explain":"Order matters because the automation can only do part of the work, so the parts it can do must come first. Naming the identity from the audit trail is what makes every later step possible, and disabling its key stops the pipeline from being used again within the minute. Listing everything the identity touched comes next, because it decides how big the incident is, and only then is the affected storage snapshotted along with the record of who could read it while it was public, which is what a notification decision depends on. Rebuilding the identity with least privilege and re-enabling the pipeline is recovery, and it is deliberately late: re-enabling before the scope is known would let the same path reopen. The final guardrail is the improvement step, and it is the one that keeps the incident from repeating, because a deployment identity that must carry an owner tag can always be traced back to a person.","study":"Identify, stop, scope, preserve, rebuild, then add the guardrail that stops the repeat.","keys":["Escalation path","Case management","Infrastructure as code","Policy enforcement","Guardrails and rollback","Evidence collection and audit readiness","Automation versus orchestration"]},{"id":"hard-20","type":"logq","theme":"A hunt with two explanations","summary":"One developer workstation, one unfamiliar domain, low and slow traffic — pick the hypothesis to test first","scenario":[{"label":"Artefact 1 — DNS and proxy records, dev-ws-31, last 24 hours","kind":"log","lines":[{"t":"01:12:44","s":"dns","m":"query cdn[.]meridian-analytics[.]example from dev-ws-31, answer cached 60s"},{"t":"01:12:45","s":"proxy","m":"TLS session to cdn[.]meridian-analytics[.]example, 412 bytes up, 41.2 MB down"},{"t":"02:40:03","s":"dns","m":"query cdn[.]meridian-analytics[.]example from dev-ws-31"},{"t":"02:40:05","s":"proxy","m":"TLS session to cdn[.]meridian-analytics[.]example, 398 bytes up, 38.9 MB down"},{"t":"04:05:19","s":"dns","m":"query cdn[.]meridian-analytics[.]example from dev-ws-31"},{"t":"04:05:21","s":"proxy","m":"TLS session to cdn[.]meridian-analytics[.]example, 421 bytes up, 40.1 MB down"}]},{"label":"Artefact 2 — Context that changes the picture","kind":"kv","rows":[["Host owner","dev-ws-31, a build workstation in the engineering team"],["Certificate","the TLS session used a certificate issued to Meridian Package Registry"],["Other hosts","39 other engineering workstations query the same domain daily"],["Timing","each transfer is about forty megabytes and matches the size of a published dependency"]]}],"question":"Which hypothesis should the hunt test first?","options":["A routine dependency download: verify the publisher and the digest","Command-and-control beaconing: isolate the workstation now","An algorithm-generated domain: block the domain at the resolver","Data exfiltration: measure the upload volume for the day"],"answer":0,"hint":"The traffic pattern looks like the textbook example. Check what else fits the same pattern before you contain.","explain":"The traffic does look like beaconing: regular intervals, small uploads, large downloads, one host, one domain. Three facts point the other way, and together they are decisive. The certificate was issued to a package registry, which a command-and-control server would not obtain. Thirty-nine other build workstations query the same domain, which a targeted intrusion would not need. Each transfer is about forty megabytes, which matches the size of a published dependency and is far too large to be a command channel. The cheapest next step is therefore to verify the package, the publisher and the digest, which takes minutes and either closes the case with evidence or opens a much more serious one. Isolating a build workstation first would stop the engineering team's work on a hypothesis that three artefacts already weaken. A hunt must test the cheap benign explanation before it takes an expensive action; that is what makes hunting different from alert chasing.","study":"Before you contain, test the benign explanation that fits the evidence. Certificate, peer hosts and volume all speak.","keys":["Hypothesis-driven threat hunting","False positive rate","Threat intelligence platform (TIP)","IoC feed","Escalation path","Risk-based prioritization"]},{"id":"hard-21","type":"fill","theme":"The written procedure","summary":"Complete the procedure a new joiner will follow at 03:00 without help","scenario":[{"label":"Artefact 1 — Procedure SOP-07, section 4, in review","kind":"text","text":"The new joiner follows this document alone on the night shift. Four terms are missing. The reviewer's rule is that every missing term must be something the joiner can look up or check."}],"question":"Complete the procedure so a new joiner can follow it alone on the night shift.","parts":["Step 4 of the {{}} says: if the enrichment API does not answer within ten seconds, continue without it.","The same step is explained with a screenshot in the {{}}, so a new joiner can follow it on the first night.","When the step changes, the {{}} number in the ticket template is updated too, so the two never disagree.","If the rule has to stay switched off, the team records a time-limited {{}} signed by the risk owner."],"answers":["standard operating procedure","knowledge base","version","exception"],"bank":["standard operating procedure","knowledge base","version","exception","waiver","service catalog","maturity level","benchmark"],"hint":"One blank is the formal procedure, one is the friendly explanation, one keeps documents in step, and one is temporary and signed.","explain":"The standard operating procedure is the formal document that says what must be done, and it must survive a night shift without anyone to ask. The knowledge base article is the same content written for a person who has never done it before, with a screenshot and the reason behind the step, which is why new joiners can work alone sooner. The version number ties the document to the ticket template: when one changes and the other does not, an analyst follows a step that no longer exists. The time-limited exception is the right instrument for a rule that must stay off for a while, because it is signed by the risk owner and it expires. A waiver is the wrong instrument here: it records a decision to live with a risk for the long term, usually with no automatic end date, and reaching for it in a temporary situation is how a temporary gap becomes permanent. Notice that all four terms are things a joiner can look up, which was the reviewer's rule.","study":"The SOP says what must be done, the knowledge base explains why, the version keeps them in step, and an exception expires.","keys":["Standard operating procedure (SOP)","Knowledge base article","Exception and waiver","Knowledge transfer and cross-training","Policy enforcement","Process mapping"]},{"id":"hard-22","type":"multi","theme":"Keeping the people","summary":"Attrition is rising — which changes reduce burnout without reducing coverage","scenario":[{"label":"Artefact 1 — Exit interviews, last six months","kind":"kv","rows":[["Leavers","4 of 11 analysts"],["Reasons given","always tired, no time to improve anything, night shifts falling on the same people"],["Coverage","unchanged detection rules, unchanged log sources"],["Budget","small, but a new console was offered"]]}],"question":"Which changes reduce burnout without reducing detection coverage? Select every correct one.","options":["Rotate the on-call week and cap consecutive night shifts","Give every analyst two hours a week to tune a detection","Raise the alert threshold everywhere so that fewer alerts arrive","Buy a second console so each analyst can arrange their own windows","Automate enrichment and ticket creation for the top three types","Ask the team to work through lunch during the busy weeks"],"answer":[0,1,4],"hint":"Two options reduce the work by reducing what the team can see. One option adds nothing but a screen.","explain":"Three changes attack the actual causes. A fair rota with a cap on consecutive night shifts removes the unfairness the leavers named, and it costs nothing. Two protected hours a week for detection work answers the second complaint directly: people who never get to improve anything eventually stop caring about the queue. Automating enrichment and ticket creation for the three highest-volume alert types removes the dullest part of the job, which is where alert fatigue starts, and it is the same work the team would otherwise do by hand. The other three options fail. Raising thresholds everywhere reduces what the team can see, so it trades analyst comfort for blindness and creates false negatives. A second console changes nothing about the workload and adds another tool to learn. Asking people to skip lunch during busy weeks increases the pressure that is already causing resignations. The lesson is that burnout is fixed by removing useless work and giving back meaningful work, not by adding screens or pressure.","study":"Reduce the dull volume, share the nights fairly, and protect time for work that feels worth doing.","keys":["Analyst burnout","Workload balancing","Shift handover","Automation candidate selection","Alert fatigue","Knowledge transfer and cross-training","Tier 1, 2 and 3 triage"]},{"id":"hard-23","type":"spot","theme":"The handover that lost a day","summary":"A priority incident waited nine hours — find the process flaw, not the person","scenario":[{"label":"Artefact 1 — What happened","kind":"text","text":"At 21:50 the day analyst posted the handover in the team chat channel: one priority incident open, with the host and the checks already done. At 23:10 a night analyst started a new thread in the same channel about a different alert. The priority incident stayed open, in the older thread, until 07:20 the next morning."},{"label":"Artefact 2 — Team context","kind":"kv","rows":[["Handover method","chat channel, no required format"],["Ticket","the priority incident had no owner field filled in"],["Similar events","this is the fourth incident in a year that crossed a handover unnoticed"],["Team size","six analysts, two per shift"]]}],"question":"Which flaw should the team lead fix?","options":["Handover lives in chat, so it needs one owned queue with a named owner","The night analyst should have read the whole chat channel first","The incident was probably a false positive, so nothing was lost","The day analyst should have stayed at work until the case was closed"],"answer":0,"hint":"This is the fourth time in a year. Ask what makes an item impossible to lose.","explain":"The fourth occurrence in a year tells you the problem is structural, not personal. Handover material in a chat channel is a stream: it moves down the screen, threads split, and there is no state that says who owns what. The fix is a handover queue where every open item has a named owner, a state and a next action, and where an item without an owner cannot be left at the end of a shift. Reading the whole channel more carefully is a control that depends on a tired human at 23:00, which is exactly the condition that produced the incident. Closing the case as a false positive is a guess made with no evidence. Staying late is not a process: it moves the problem onto the day analyst, who will eventually leave, and the team already knows what that costs.","study":"Handover needs a state and an owner per item. A chat stream cannot hold work in progress.","keys":["Shift handover","Ticket lifecycle","Escalation path","Standard operating procedure (SOP)","Process mapping","Analyst burnout"]},{"id":"hard-24","type":"order","theme":"From lesson to deployed rule","summary":"Six stages from a written lesson to a rule that is measured in production","scenario":[{"label":"Artefact 1 — Improvement board, week 14","kind":"text","text":"Five lessons from the last quarter are written on the improvement board. Every one of them says the same thing at the end: nothing changed. The team lead wants a standard path from a lesson to a rule that is actually running, and measured."}],"question":"Put the six stages of that path in order.","items":["Write the lesson as one sentence with the evidence attached to the case","Turn the lesson into a detection use case with a named data source","Write the rule and a test event, then replay a week of stored events","Have the hunting team try to beat the rule in a purple-team session","Take it through change management and deploy it in the window","Measure the real alert volume and the missed cases after thirty days"],"hint":"The evidence comes first and the measurement comes last, thirty days later.","explain":"A lesson that stays a sentence changes nothing, and the board proves it. The path starts by attaching the evidence to the case, because a lesson without its evidence cannot be turned into logic. The use case comes next: which behaviour, from which data source, at what cost in alerts. The rule and its test event are written together, and the replay against a week of stored events turns the expected volume into a number before anyone is woken at night. The purple-team session is where the hunting team tries to achieve the same objective in a way the rule does not see, which is the only honest test of coverage. Then change management, then production. The last stage is the one the five stalled lessons never reached: thirty days of real volume and a review of what was missed. That measurement is also what feeds the next lesson, which is how the loop keeps turning.","study":"Evidence, use case, rule with a test, purple-team challenge, change window, thirty-day measurement. That path is the loop.","keys":["Lessons learned","Detection use case","Detection regression test","Purple teaming","CI/CD pipeline for detections","Change management and CAB","Continuous improvement","PDCA (Plan-Do-Check-Act)","Lean and Kaizen"]},{"id":"hard-25","type":"mcq","theme":"The honest first year","summary":"An automation proposal with a one-off build cost — what figure belongs in the business case","scenario":[{"label":"Artefact 1 — Proposal from the automation team","kind":"kv","rows":[["Licences","24,000 per year"],["Build","10 days of an engineer at 700 per day, one-off"],["Saving","3 analyst hours per day at 48 per hour"],["Working year","250 working days"]]}],"question":"Which first-year figure should go into the business case?","options":["About 5,000 saved in year one, then about 12,000 a year after that","About 36,000 saved in year one, because the build time is internal","About 29,000 saved in year one, after only the build cost is added","About 12,000 saved in year one, because the build is a one-off"],"answer":0,"hint":"Three hours a day for 250 days, then subtract both the licence and the build.","explain":"Three analyst hours a day at 48 per hour is 144 per day, and 250 working days gives 36,000 of saving in a year. Year one also carries the licence of 24,000 and the one-off build of 7,000, so the honest first-year figure is 5,000, and from year two onwards it is 12,000. The other three answers are the three standard ways this calculation is flattered. Calling the build time internal pretends a skilled engineer's days are free. Counting the build but not the licence reports a figure that no invoice will support. Forgetting the build cost in year one reports the steady state as if it started on day one. None of these is a small difference: the first-year figure decides whether the proposal looks marginal or attractive, so it is exactly the number a finance director will check.","study":"A first-year figure carries every cost that falls in that year. Steady-state savings are a different, later number.","keys":["Cost-benefit analysis","Return on investment (ROI)","Executive and board reporting","Automation candidate selection","Workload balancing"]},{"id":"hard-26","type":"terminal","theme":"The dashboard that costs a server","summary":"Task 152 — produce the list of users the search platform is spending its time on","scenario":[{"label":"Artefact 1 — Task TASK-152, raised after the platform team complained","kind":"kv","rows":[["Background","A dashboard re-runs the same heavy search every five minutes for thirty analysts"],["Input","/evidence/siem-search.log, one line per search: timestamp, user, search id, runtime in seconds, events scanned"],["Deliverable","/evidence/search-users.txt, holding each user name once, in alphabetical order"],["Purpose","The team will start with the heaviest users when it replaces the dashboard with a scheduled report"]]}],"question":"Type one command that writes /evidence/search-users.txt with exactly those contents.","prompt":"analyst@soc-ws-04:~$","env":"Practice shell on soc-ws-04. The evidence folder is writable. One command line is enough, then press Run command.","canonical":"awk '{print $2}' /evidence/siem-search.log | sort -u > /evidence/search-users.txt","judge":[{"label":"Reads the search log","re":"siem-search\\.log","why":"the command does not read the log named in the task"},{"label":"Takes the user field","re":"\\$2|user=|cut\\s+-[df]","why":"the command does not take the second field, which holds the user name"},{"label":"Keeps one line per user","re":"sort\\s+-u|uniq","why":"the command does not remove the repeated user names"},{"label":"Writes the named evidence file","re":"/evidence/search-users\\.txt","why":"the command does not write the file the task asked for"}],"forbid":[{"re":"rm\\s+-rf|>\\s*/evidence/siem-search\\.log|\\bsed\\s+-i"}],"termIntro":["Practice shell on soc-ws-04. The evidence folder is /evidence.","Type the command, then press Run command."],"termOut":["search-users.txt created","a.okafor","j.mendes","l.ferreira","s.novak","soc-ws-04:/evidence$ "],"parts":[["awk '{print $2}'","prints the second field of each line, which is the user name"],["sort -u","sorts the names and keeps one copy of each"],["> /evidence/search-users.txt","writes the result into the named file"],["/evidence/siem-search.log","the input file described in the task"]],"hint":"The task names the input, the field, the reduction and the output file. Check all four before you type.","explain":"This task is the first step of an efficiency project: before you replace a wasteful dashboard you find out who is using it and how. The command reads the search log, takes the second field where the user name sits, removes the duplicates and writes the list. The deliverable is deliberately small, because the platform team only needs the names to start a conversation about which searches are worth scheduling as reports. The four criteria in the feedback are the four things the task asked for, and any tool set that produces the same file is accepted: a different field extractor or a two-step deduplication is just as correct. The one thing the command must not do is touch the log itself, because it is the only record of how the platform was used.","study":"Measure before you rebuild. A three-field extract and a sorted unique list is often the whole investigation.","keys":["Dashboard and reporting","Workload balancing","Single pane of glass","Cost-benefit analysis","Scripting (Python, Bash, PowerShell)"]},{"id":"hard-27","type":"sort","theme":"Three kinds of change","summary":"Eight improvement actions — is each one a change to the process, the technology or the people?","scenario":[{"label":"Artefact 1 — Improvement board, classified","kind":"text","text":"The board groups actions by what has to change for them to work. A process action changes how work flows. A technology action changes a tool. A people action changes what someone knows or does. One action looks like a technology change but the tool is already installed."}],"question":"Place each action in the correct group.","bins":["Process change","Technology change","People change"],"items":[{"t":"Add evidence fields to the incident ticket template","bin":0},{"t":"Agree one escalation path with the service desk and publish it","bin":0},{"t":"Write the procedure for the nightly backup account checks","bin":0},{"t":"Deploy the phishing playbook in the platform that is already licensed","bin":1},{"t":"Replace three overlapping sensors with one","bin":1},{"t":"Connect the SIEM to the ticketing system through its API","bin":1},{"t":"Give two analysts a rotation in threat hunting","bin":2},{"t":"Train a Tier 1 analyst to write and test detection rules","bin":2}],"hint":"Ask what has to change for the action to work: a document and a habit, a system, or a person's skill.","explain":"The classification matters because each group is fixed by different work. Process actions change how work flows, and they cost almost nothing except agreement: evidence fields in the template, one published escalation path, and a written procedure for the backup account. Technology actions change a system, and they need build time, testing and change control: deploying a playbook, consolidating three sensors into one, and connecting two platforms through an API. People actions change what somebody knows or does, and they need time, mentoring and permission to fail while learning: a hunting rotation and detection-rule training. The last action is the interesting one. Deploying the phishing playbook is a technology change, but only because the platform was already licensed and installed; if the team had to buy the platform first, the same action would begin as a procurement and process project. Classify by what has to change, not by what the action is called.","study":"Classify improvement actions by what must change: a process, a system, or a person's skill.","keys":["Process mapping","Standard operating procedure (SOP)","Tool sprawl and consolidation","Knowledge transfer and cross-training","API integration","Workload balancing"]},{"id":"hard-28","type":"multi","theme":"Risk that automation creates","summary":"Which statements about automating security work are true","scenario":[{"label":"Artefact 1 — Design review, new automation programme","kind":"text","text":"The team is about to automate more than it ever has. The design review asks for the statements the team will actually hold to. Select every statement that is true."}],"question":"Which statements are true? Select every correct one.","options":["Automation that cannot be rolled back is a risk, not a control","Automation removes the need to keep a runbook for the manual path","An automation account must hold only the rights its playbook uses","Machine learning can replace the correlation rules from the first day","Every automated action must be traceable to a case and a decision","If the automation is fast enough, the audit trail can be added later"],"answer":[0,2,4],"hint":"Two statements describe shortcuts, and one describes a replacement that is not available yet.","explain":"Three statements survive the review. An action that cannot be undone converts a small mistake into an outage, so it is a risk until a rollback exists. An automation account with only the rights its playbook uses limits the damage if the platform or the credential is ever stolen, which is the same least-privilege rule the team applies to people. Traceability to a case and a decision is what makes an automated action explainable six months later, and it is the first thing an external reviewer will ask to see. The other three are the shortcuts that cause incidents. Automation does not remove the manual runbook: it makes the runbook more important, because automation fails and the fallback has to be written down. Machine learning ranks and assists, but it does not replace deterministic rules for behaviour that must never be missed. And a record added after the event cannot show what happened during it, which is exactly when you need it.","study":"Rollback, least privilege and traceability are the price of automation. Without them it is an uncontrolled change.","keys":["Guardrails and rollback","Runbook","Machine learning in detection","Policy enforcement","Case management","Automation versus orchestration","Secrets management for automation"]},{"id":"hard-29","type":"branch","theme":"The rule that stopped seeing","summary":"A tuned rule missed the technique it was written for — trace the regression to its cause","scenario":[{"label":"Artefact 1 — Purple-team finding, replay 44","kind":"kv","rows":[["Rule","COR-311, credential access from an unexpected process"],["Change","Tuned four weeks ago to reduce 600 daily false alerts"],["Result","The replay of the original technique produced no alert"],["Stored events","The original test event is still in the archive"]]}],"question":"Work through the three steps of this regression. Each step locks when you check it.","steps":[{"question":"The purple team replayed the original technique and the rule stayed silent. What is your first step?","options":["Compare the tuned rule with the original and replay both on the stored events","Untune the rule and accept the false alerts coming back","Tell the purple team that the technique has changed since the rule was written"],"answer":0,"explain":"The archive still holds the exact event the rule was written for, so the comparison costs nothing and answers the question in minutes. Diffing the two versions of the rule shows what the tuning changed, and replaying both against the stored event shows which change removed the detection. Reverting the tuning restores the detection and also restores six hundred false alerts a day, which is not a fix. Telling the purple team the technique changed is a guess made to close the conversation, and it is the kin
