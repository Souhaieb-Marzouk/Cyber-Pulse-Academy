const DATA = {"meta":{"topicId":"cysa-plus","chapter":1,"title":"Vulnerability Response, Handling and Management — HARD (v5.0)","difficulty":"hard","questionCount":34,"estimatedMinutes":76,"passMark":70},"intro":"This is the HARD tier of objective 2.5. Every exercise asks for a judgement, not a definition: near-miss answers, artefacts that disagree with each other, and cases where the obvious answer is wrong. The same keywords as the MEDIUM file are exercised here, but with different scenarios, different data and harder reasoning.","exercises":[{"id":"hard-1","type":"mcq","theme":"Two close findings, one engineer","summary":"Base scores 7.5 and 7.3 — decide which one an experienced analyst touches first","scenario":[{"label":"Artefact 1 — Two findings that arrived in the same hour","kind":"code","lines":["CVE-2024-7712  CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:H  base 7.5","  asset vpn-edge-01, internet facing · KEV listed yesterday · EPSS 0.74","CVE-2024-8130  CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:L  base 7.3","  asset hr-portal, internal, single sign-on in front · EPSS 0.03 · no exploit seen"]}],"question":"Only one engineer is on shift. Which decision is correct?","options":["Both wait, because the base scores are close and neither reaches 9.0","The edge flaw waits, because AC:H means the attacker needs rare conditions","The harder-to-exploit edge flaw goes first, because it is KEV listed","The easier internal flaw goes first, because its attack complexity is low"],"answer":2,"hint":"Attack complexity describes the work the attacker must do. The KEV catalog describes what attackers are already doing.","explain":"The tempting choice is the one about the internal flaw. Its AC:L with PR:N and UI:N looks worse than AC:H with PR:L. But complexity describes the attacker's work, not the probability that somebody is doing it today. The edge flaw is listed in the KEV catalog, so real attacks exist. Its exploitation probability is high and the asset faces the internet. The internal flaw sits behind single sign-on and has no known exploit. Two close base scores do not make two findings equal, and waiting for a 9.0 is not a policy. The environmental view of your own estate finishes the argument.","study":"When base scores are close, decide with the feeds (KEV, EPSS), the exposure of the asset, and what the asset is worth.","keys":["CVSS vector string","CVSS base score","CVSS environmental score","CISA KEV catalog","EPSS","Analyze and prioritize","Exploitability, proof of concept and weaponized exploit"]},{"id":"hard-2","type":"multi","theme":"Two scans of one host disagree","summary":"A network scan says clean, a credentialed scan says six findings — decide what is true","scenario":[{"label":"Artefact 1 — Scan A, unauthenticated, 02:10","kind":"log","lines":[{"t":"02:11","s":"scanA","m":"host web-07: 0 findings, open ports 80 443 8443"},{"t":"02:11","s":"scanA","m":"plugin set: network and service checks only"}]},{"label":"Artefact 2 — Scan B, authenticated, 03:40, same plugin set","kind":"log","lines":[{"t":"03:41","s":"scanB","m":"host web-07: 6 findings (3 high), 4 packages behind"},{"t":"03:42","s":"scanB","m":"local inventory: tomcat 9.0.54, openssl 1.1.1k, log4j 2.14.1"}]}],"question":"Which two statements are correct? (Select two.)","options":["Scan B is credible because it read the local package inventory","Scan A is more trustworthy because it never touched the host at all","Scan B must be wrong, because an authenticated scan cannot find more","Both are wrong, because log4j 2.14.1 is not a version with known flaws","Scan A produced a false negative because a network view is blind"],"answer":[0,4],"hint":"Ask what each scan could physically see, not which one ran more quietly.","explain":"A network scan can only read what the services announce. A host that answers on three ports looks clean, even when four packages are months behind. That is a false negative, and it is the normal result of unauthenticated scans on hosts you own. Scan B read the local inventory and named exact versions, so it is the credible result. An agent on the host would give the same visibility without a service account. Saying that Scan A is more trustworthy confuses quietness with accuracy. Saying that log4j 2.14.1 has no known flaws is simply untrue, because it is one of the most exploited versions in recent years.","study":"Compare scans by what they could see. A clean unauthenticated report on a host you own is a warning, not a result.","keys":["Authenticated (credentialed) scan","Unauthenticated (non-credentialed) scan","Agent-based and agentless scanning","False positive, false negative, true positive, true negative","CVE and CWE","NVD and vendor advisories"]},{"id":"hard-3","type":"order","theme":"The SSVC decision tree","summary":"Rebuild the decision path a stakeholder-specific score follows","scenario":[{"label":"Artefact 1 — Note from the vulnerability board","kind":"text","text":"The board wants one page that explains why two findings with the same base score produced different decisions. Rebuild the order of the questions the method asks."}],"question":"Put the six decision points in the order the method asks them.","items":["Exploitation: none, proof of concept, or active exploitation","Automatable: can one attacker repeat this across many targets?","Technical impact: partial or total loss of the system","Mission prevalence: how much of our own mission depends on it?","Public well-being: how many people outside the mission are hurt?","Read the decision: Track, Track*, Attend, or Act"],"hint":"The method is a tree, not a list: every answer decides which question is worth asking next.","explain":"This method is a decision tree, so the order of the questions is the method. It starts with exploitation status. A flaw used in the wild sits in a different class from one with only a proof of concept. Automatability comes next, and asks whether one attacker can turn the flaw into a campaign. Technical impact asks whether the system loses partial or total control. Mission prevalence asks how much of your own mission depends on that system, and a base score cannot know that. Public well-being asks how many people outside the mission are hurt. The answers lead to four possible decisions, and Act means a fix now.","study":"Learn the order: exploitation, automatability, technical impact, mission prevalence, decision.","keys":["VPR and SSVC","CISA KEV catalog","Exploitability, proof of concept and weaponized exploit","Analyze and prioritize","Industry and organizational impact","Asset inventory and asset criticality"]},{"id":"hard-4","type":"terminal","theme":"Evidence for the change record","summary":"Task 44 — a saved deliverable is required, not just a screen of output","scenario":[{"label":"Artefact 1 — Change CHG-3402, task 44","kind":"kv","rows":[["Permitted target","vpn-edge-01 only, no other host in the range"],["Deliverable","a saved list of listening ports with the product behind each one"],["Storage","write it to /evidence/vpn-edge-services.txt"],["Limits","read-only probes, nothing that changes the state of the host"]]}],"question":"Produce the evidence the change record asks for. Type one command.","prompt":"analyst@soc-ws-03:~$","env":"You are on analyst-ws-03. The folder /evidence exists and is writable. vpn-edge-01 resolves through internal DNS.","canonical":"nmap -sV vpn-edge-01 -oN /evidence/vpn-edge-services.txt","tool":"nmap","flags":["sV"],"allowFlags":["p","o","n","T","v","N","X"],"argsAny":["/evidence/"],"target":"vpn-edge-01","termIntro":["Shell on analyst-ws-03. The evidence folder is /evidence.","Type the command, then press Run command."],"termOut":["Starting Nmap 7.94","Nmap scan report for vpn-edge-01 (10[.]20[.]4[.]9)","PORT      STATE SERVICE   VERSION","9443/tcp  open  ssl/http  nginx 1.21.0","10443/tcp open  ssl/http  nginx 1.21.0   <-- management console exposed","Nmap done: 1 host up, output written to /evidence/vpn-edge-services.txt"],"parts":[["nmap","maps hosts, ports and the services behind them"],["-sV","asks each open port for the product and the version"],["-oN","writes the normal output into the named file"],["vpn-edge-01","the only host the change record allows"]],"hint":"The goal has three parts: find the services, learn the versions, and leave the result in the evidence folder. One command can do all three.","explain":"The deliverable asks for three things, and one command delivers all of them. Service detection needs the version-probing option. The same tool can write its output straight into a file, which turns a screen of text into evidence. The host stays inside the permitted target, because an unapproved range is a policy breach whatever the result shows. This habit makes a finding defensible. The command, the output and the file name are all recorded, so the next analyst can repeat it. The exposed management console is the most interesting line of the output.","study":"Write scans to files from the start. A finding without a saved artefact is a story, not evidence.","keys":["Discovery scan","Scan scope and authorization","Active and passive scanning","Intrusive and non-intrusive scan","Report","Configuration change and hardening"]},{"id":"hard-5","type":"fill","theme":"Remediation from a software bill of materials","summary":"The image ships a library nobody installed on purpose — complete the plan","scenario":[{"label":"Artefact 1 — Image manifest, extracted from the build","kind":"code","lines":["component com.acme:payments-api:3.8.0          direct","component org.apache.logging.log4j:log4j-core:2.14.1  transitive","vex note: no statement supplied by the maintainer","pipeline: image is rebuilt from the dependency lock file on every merge"]}],"question":"Complete the remediation plan with the four missing words.","parts":["The image carries log4j-core 2.14.1. The library is a ","{{}}"," dependency, so it arrived through another package. The flaw is tracked as ","{{}}",". The fix is to rebuild the image with version ","{{}}"," or later from the lock file, then run the image ","{{}}"," again in the pipeline."],"answers":["transitive","CVE-2021-44228","2.17.1","scan"],"bank":["scan","direct","2.14.1","transitive","rollback","CVE-2021-44228","2.17.1","coverage"],"hint":"One word says where the library came from. One is the identifier of the flaw. One is the fixed version. One is what the pipeline does after the rebuild.","explain":"The manifest tells you what is inside the image, including libraries nobody installed on purpose. log4j-core is a transitive dependency, so another package pulled it in. The fix must be applied where it is declared, which is the dependency lock file. The flaw carries a CVE identifier, and that is what makes it trackable across teams and tools. The fixed version is 2.17.1, so anything below that stays exposed. Pinning the direct package is not enough on its own. Rebuild the image and scan it again, because a rebuild can pull in a new transitive version.","study":"For any built artefact: know your transitive dependencies, track them by CVE, fix them in the lock file, then scan the new build.","keys":["CVE and CWE","NVD and vendor advisories","Patch management","Verify","Rescan and regression test","Configuration change and hardening"]},{"id":"hard-6","type":"match","theme":"What each score really answers","summary":"The board asked why five numbers disagree — pair each one with its question","scenario":[{"label":"Artefact 1 — Board question sheet","kind":"text","text":"Five numbers appear in the pack. Pair each number with the single question it answers, then be ready to explain why none of them replaces the others."}],"question":"Pair each score or label with the question it answers.","pairs":[["EPSS 0.41","How likely is this flaw to be used within 30 days?"],["A CISA KEV listing","Is this flaw being used in real attacks right now?"],["CVSS environmental score","How bad is this flaw inside our own network?"],["SSVC decision: Act","What does our mission say we should do about it?"],["VPR 8.9","How does the vendor weigh the risk to its customers?"],["Exposure factor","How much of the asset value would a successful attack destroy?"]],"hint":"Five of these come from somebody else. One of them comes from your own asset data.","explain":"Each number answers one question and none of them can answer all of them. EPSS is a probability of exploitation within the next month, so it says how likely, not how bad. The KEV listing is a statement of fact about attacks that already happened, which is why it usually wins an argument. The CVSS environmental score re-weights the flaw using your own network, so it carries your exposure into the base metrics. The SSVC decision is a process output: it says what the organisation intends to do. VPR is the vendor's own ranking for its whole customer base, which is useful when you have no better information and dangerous when you have. Exposure factor is the only one that comes from your asset data: it estimates how much of the asset's value a successful attack would take with it.","study":"Keep the questions apart: likelihood, reality, severity in our estate, decision, vendor view, asset value.","keys":["EPSS","CISA KEV catalog","CVSS environmental score","VPR and SSVC","Exposure factor and likelihood","Industry and organizational impact","Analyze and prioritize"]},{"id":"hard-7","type":"branch","theme":"Branching case: exploited edge appliance to ransomware","summary":"Four decisions between an exploited appliance and a network-wide encryption event","scenario":[{"label":"Artefact 1 — SOC timeline, 03:10 to 03:40","kind":"log","lines":[{"t":"03:10","s":"edge","m":"exploitation attempt against the published path, this time the reply is 200"},{"t":"03:14","s":"edr","m":"host fin-ws-22 started a scheduled task that beacons every 60 seconds"},{"t":"03:22","s":"proxy","m":"fin-ws-22 to 45[.]133[.]9[.]21 over TLS on port 8443, 2.1 MB out"},{"t":"03:38","s":"intel","m":"the same appliance model appears in a vendor alert about ransomware crews"}]}],"question":"This incident runs as a chain of decisions. Each step carries its own evidence and its own question, and your choice opens the next step.","steps":[{"title":"The first hour","question":"The appliance shows one successful exploitation and one internal host is beaconing. What do you do first?","options":["Patch and reboot the appliance first, then look at the internal hosts","Block the outbound address only and keep watching the beacon closely","Restore the file servers from backup before anything gets encrypted","Isolate the beaconing host and the appliance, then begin forensics"],"answer":3,"explain":"Two things are true at once: the entry point is compromised and at least one host is already talking to infrastructure that is not yours. Containment means cutting both paths now, then collecting evidence while it still exists. Patching the appliance is necessary but does not remove the attacker who is already inside, and a reboot may destroy memory evidence. Blocking one address is a partial control that the crew can bypass with a new address in minutes. Restoring from backup before the encryption starts destroys the evidence of how they got in, and the restore will be encrypted again by the same access."},{"title":"A web shell appears","scenario":[{"label":"Artefact 1 — Appliance admin partition","kind":"log","lines":[{"t":"04:02","s":"ir","m":"unexpected script in the admin partition, listens on port 4443"},{"t":"04:03","s":"ir","m":"the appliance cannot be patched while the shell is present"}]}],"question":"A web shell is confirmed on the appliance. How do you handle it?","options":["Reboot the appliance so the script is cleared out of memory and disk","Change the admin password and keep using the same appliance image","Take a forensic copy, then rebuild the appliance from a clean image","Delete the script and keep the appliance running to avoid downtime"],"answer":2,"explain":"Once a device is confirmed compromised, the clean path is evidence first, then rebuild from a known-good image. A copy preserves what the crew did, which is what the report and the timeline need. Deleting the script removes your own evidence while the attacker's other access methods stay in place. A reboot is not a clean-up: persistence usually survives it, and the memory evidence is lost. Changing one password leaves the shell, the extra accounts and the modified configuration exactly where they were. Downtime is a cost, but a compromised edge device is a bigger one."},{"title":"Keeping the business online","question":"The rebuild takes four hours and 4 100 people need remote access. What do you do?","options":["Cancel the rebuild and monitor the appliance more closely instead","Bring up the prepared alternative path and tell users what to expect","Leave the compromised appliance online until the rebuild is finished","Ask users to work from home without any remote access for four hours"],"answer":1,"explain":"A tested alternative path is the reason the rebuild can happen at all, and telling users first prevents a flood of tickets. Leaving the compromised appliance online means the attacker keeps a foothold through the whole rebuild, which defeats the purpose. Removing remote access entirely may stop work, and it is a business decision that the incident commander may not be allowed to take alone. Cancelling the rebuild to watch the appliance more closely keeps the attacker in place: monitoring is what you do while the fix is happening, not instead of it."},{"title":"The day after","question":"The appliance is rebuilt and clean. What change stops this from happening again?","options":["Add edge devices to the KEV-driven emergency patch rule","Add more logging to the appliance and keep the patch windows unchanged","Wait for the next scheduled penetration test to review the edge design","Move the remote access service to a new vendor and close the incident"],"answer":0,"explain":"The root cause was a published, actively exploited flaw on an internet-facing appliance that waited for a monthly window. The fix is a policy change: when a flaw on an edge device is listed as exploited, the emergency path with a tested rollback applies automatically. More logging improves detection but leaves the window open. A penetration test months away reviews design, not this failure. Changing vendor is a large project that answers nothing about the process that let a KEV-listed flaw wait."}],"hint":"At each step ask what removes the attacker's access, what keeps the evidence, and what keeps the business running.","explain":"This case shows why an exploited edge device is a chain of decisions, not one action. Containment must cover the entry point and the internal host. A confirmed compromise moves the appliance from patch to rebuild. The business needs a planned alternative before the rebuild starts. The closing action is a policy change, so the next exploited edge flaw cannot wait for a monthly window. Each step has a tempting shortcut: patch first, delete the shell, stay online, add logging. Every shortcut leaves the attacker, or the process, in place.","study":"For an exploited edge device: contain both ends, preserve then rebuild, use the alternative path, and change the rule that allowed the delay.","keys":["Actively exploited, zero-day and n-day","Vulnerability response versus incident response","Compensating control","Emergency change and the change advisory board","Rollback plan","CISA KEV catalog","Network segmentation and ACL","Special handling: ICS and OT, medical devices, legacy systems","Virtual patching and WAF rule"]},{"id":"hard-8","type":"spot","theme":"Spot the mistake in the rollout","summary":"One line in the patch playbook breaks the promise made in the change record","scenario":[{"label":"Artefact 1 — patch-erp.yml, reviewed before the change window","kind":"code","lines":["1  - hosts: erp_cluster","2    serial: 1","3    tasks:","4      - name: apply approved security updates","5        ansible.builtin.dnf:","6          name: '*'","7          security: true","8          state: latest","9        ignore_errors: true","10     - name: reboot when the kernel changed","11       ansible.builtin.reboot:","12       when: kernel_changed"]},{"label":"Artefact 2 — Change record CHG-3550","kind":"text","text":"The record promises a controlled rollout with a clear per-host result, and a rollback point before the first node changes."}],"question":"Which single line breaks the promise made in the change record?","options":["Line 2: one node at a time makes the rollout slower than it needs","Line 7: the security flag limits the update to the approved set","Line 12: the reboot waits for a kernel change instead of always running","Line 9: a failed patch is ignored, so the host is reported as patched"],"answer":3,"hint":"The promise is about the result of each host, not about the speed of the job.","explain":"ignore_errors tells the run to continue when a task fails. With no later check, the play finishes green while a node is still unpatched. That is how a register starts to lie, and it breaks the promise of a clear per-host result. The other lines are good practice, not faults. Patching one node at a time keeps the service available. The security flag keeps the update inside the approved set. A conditional reboot avoids restarts nobody needs. The job also runs the week after the vendor release day, which is when most fixes appear. That is why a pilot ring and a rollback point exist.","study":"In any automation, hunt for the line that turns a failure into a success message. Silent failure is the enemy of a patch register.","keys":["Patch management","Patch Tuesday and vendor release cycle","Patch testing and staged rollout","Rollback plan","Maintenance window","Verify","Configuration change and hardening"]},{"id":"hard-9","type":"sort","theme":"Classification of six findings","summary":"Six scan results, four classifications — two of them are the ones people mislabel","scenario":[{"label":"Artefact 1 — Morning review sheet","kind":"text","text":"Six results are waiting for a label. Two facts decide the label: is the weakness really there, and did the scanner report it correctly?"}],"question":"Drag each result into the classification it deserves.","bins":["True positive","False positive","False negative","True negative"],"items":[{"t":"Credentialed scan reports a missing patch that the package manager confirms","bin":0},{"t":"Finding is real, but a firewall rule blocks the port from every network","bin":0},{"t":"Plugin reads a banner version while the application links its own patched build","bin":1},{"t":"Agent reports a package that configuration management removed three days ago","bin":1},{"t":"Unauthenticated scan reports nothing on a host that runs four outdated packages","bin":2},{"t":"Authenticated scan of a rebuilt, fully updated host returns no findings","bin":3}],"hint":"Do not read only the report. Ask two questions: does the weakness exist, and did the report match reality?","explain":"Two facts decide a label, and both matter. A credentialed report that the package manager confirms is a true positive. The blocked-port case catches most analysts. The weakness exists, so the report is a true positive too. The firewall rule is a mitigating control. It lowers the risk but does not change the classification. A banner that disagrees with the linked library, and a package that was already removed, are false positives. A clean unauthenticated report on a host with old packages is a false negative. That label is the most dangerous of the four, because it creates comfort.","study":"Separate existence from reporting, and remember that a blocked port is a control, not a reclassification.","keys":["False positive, false negative, true positive, true negative","Mitigating control","Compensating control","Agent-based and agentless scanning","Unauthenticated (non-credentialed) scan","Authenticated (credentialed) scan","Analyze and prioritize"]},{"id":"hard-10","type":"logq","theme":"Advisory against inventory","summary":"The scanner flags two patched hosts and ignores one that is out of support","scenario":[{"label":"Artefact 1 — Vendor advisory text","kind":"text","text":"Affected versions: 4.2.0 through 4.2.6 inclusive. Fixed in 4.2.7. The 4.1 branch left support last year and receives no fixes."},{"label":"Artefact 2 — Inventory sync and last night's scan","kind":"log","lines":[{"t":"06:00","s":"cmdb","m":"api-gw-01 version 4.2.9, upgraded last month"},{"t":"06:00","s":"cmdb","m":"api-gw-02 version 4.2.9, upgraded last month"},{"t":"06:00","s":"cmdb","m":"api-gw-03 version 4.1.4, out-of-support branch"},{"t":"02:12","s":"scanner","m":"CVE flagged on api-gw-01 and api-gw-02, plugin 66021"}]}],"question":"What is the correct reading of this set?","options":["All three hosts are false positives because none of them runs version 4.2.6","api-gw-03 alone is a false positive because 4.1.4 is older than version 4.2.0","api-gw-01 and 02 are false positives; api-gw-03 is unsupported","All three hosts are true positives because the scanner produced the finding"],"answer":2,"hint":"Check each host against the version range in the advisory, then look again at the host on the older branch.","explain":"The advisory gives a range and a fixed version, so each host can be checked on its own. api-gw-01 and api-gw-02 already run 4.2.9, which is above the fixed version. The scanner matched something else, likely a stale banner or an old library copy. Those are false positives, and the inventory line is the evidence to suppress them. api-gw-03 runs 4.1.4, which is outside the affected range, so it is not part of this CVE. The scanner was right not to flag it. But the same advisory says the 4.1 branch left support, so that host carries a lifecycle finding of its own.","study":"For every CVE, compare installed version to the affected range, then ask separately whether the branch is still supported.","keys":["False positive, false negative, true positive, true negative","NVD and vendor advisories","CVE and CWE","Unsupported, legacy and end-of-life software","Asset inventory and asset criticality","Analyze and prioritize","Decommissioning"]},{"id":"hard-11","type":"multi","theme":"Emergency change for a live flaw","summary":"The change policy is on the screen and the fix must go out tonight","scenario":[{"label":"Artefact 1 — Change policy extract, sections 4 and 5","kind":"code","lines":["Emergency changes need one named on-call approver and a rollback plan.","Emergency changes are reviewed at the next ordinary change board meeting.","The monthly window is preferred unless a flaw is being exploited in the wild.","An exception longer than 30 days needs the asset owner's signature."]},{"label":"Artefact 2 — The case in front of you","kind":"text","text":"A flaw on the internet-facing mail gateway was added to the KEV catalog this afternoon. The vendor fix exists and takes about 40 minutes to install."}],"question":"Which two statements are true for tonight's change? (Select two.)","options":["It must wait for the next ordinary change board meeting before it may ship","It needs no rollback plan because a vendor patch can always be reversed","It must be logged as a 30-day exception until the change board reviews it","It may leave the monthly window because the flaw is exploited in the wild","It needs a named approver and a written rollback plan before it starts"],"answer":[3,4],"hint":"Read the policy as a set of conditions: one line about timing, one about approval, one about review, one about exceptions.","explain":"The policy allows the emergency path exactly for this case: a flaw that is being exploited in the wild does not have to wait for the monthly window. The same policy asks for one named on-call approver and a rollback plan, and both are cheap compared with a 40-minute window on a gateway. The ordinary board reviews the change afterwards, which is a review and not a gate, so waiting for it would leave a KEV-listed flaw open for days. A vendor patch is not automatically reversible: some updates cannot be uninstalled cleanly, so the rollback plan is written from the appliance snapshot or the configuration backup. Nothing here is an exception, because the policy already covers the case.","study":"Read change policy as conditions, not as preferences. Every emergency path has a named approver and a way back.","keys":["Emergency change and the change advisory board","Rollback plan","Maintenance window","Exception and waiver","Risk acceptance sign-off","Remediation SLA and deadline","CISA KEV catalog"]},{"id":"hard-12","type":"order","theme":"Ranking without CVSS scores","summary":"Five findings arrived with no base score at all — rank them by the risk they carry here","scenario":[{"label":"Artefact 1 — Intake list, no base scores available yet","kind":"code","lines":["A partner-api      vendor: important  EPSS 0.38  internet facing  holds customer data","B internal-wiki    vendor: moderate   EPSS 0.05  internal only    no sensitive data","C domain-ctrl-01   vendor: important  EPSS 0.12  internal only    controls authentication","D build-agent-04   vendor: low        EPSS 0.31  internet facing  holds a production deploy key","E hr-portal        vendor: critical   EPSS 0.02  behind SSO with MFA  holds HR records"]}],"question":"Rank the five findings by the risk they carry for this company, highest first.","items":["A partner-api — important, EPSS 0.38, internet facing, holds customer data","C domain-ctrl-01 — important, EPSS 0.12, internal but it controls authentication","D build-agent-04 — low vendor severity, EPSS 0.31, internet facing, holds a deploy key","E hr-portal — critical vendor severity, EPSS 0.02, behind SSO with MFA, holds HR records","B internal-wiki — moderate, EPSS 0.05, internal only, no sensitive data"],"hint":"With no base score, the ranking comes from likelihood, exposure and what the asset would give away.","explain":"With no base score, three inputs carry the decision. They are likelihood, exposure, and what an attacker gains. A combines the highest likelihood with internet exposure and customer data, so it leads. C is internal, but a domain controller that controls authentication means total loss if it falls. D looks small by vendor severity, and that is the trap. The host faces the internet, exploitation is likely, and a production deploy key turns one build agent into the whole delivery pipeline. E carries the highest vendor severity, but its exposure and its likelihood are low.","study":"Rank by likelihood times exposure times value. A severity label on its own is one input, never the ranking.","keys":["Exposure factor and likelihood","Industry and organizational impact","EPSS","Asset inventory and asset criticality","Data classification","Analyze and prioritize","NVD and vendor advisories","Exploitability, proof of concept and weaponized exploit"]},{"id":"hard-13","type":"fill","theme":"Risk register entry","summary":"The register entry must survive a board question — five fields are missing","scenario":[{"label":"Artefact 1 — Draft register line for VULN-7781","kind":"text","text":"The finding is a flaw in the local administration interface of a building controller. The fix needs a vendor visit that is booked for next quarter. The draft line is written but the field names are missing."}],"question":"Complete the register entry with the five missing words.","parts":["The entry names the risk ","{{}}"," who signs for the decision, the ","{{}}"," that reduces the exposure until the vendor visit, the ","{{}}"," of exploitation in our environment, the business ","{{}}"," if the flaw is used, and the ","{{}}"," date when the entry must be looked at again."],"answers":["owner","compensating control","likelihood","impact","review"],"bank":["review","coverage","owner","appetite","likelihood","impact","escalation","compensating control"],"hint":"One is a person, one is a control that stands in for a fix, one is a probability, one is a business consequence, one is a date.","explain":"A register entry has to answer five questions or it becomes a note that nobody can audit. The owner is the person accountable for the decision, which is a name and not a team. The compensating control describes what lowers the exposure meanwhile, such as a firewall rule or local monitoring, which is why the entry can be signed at all. The likelihood states how probable exploitation is in this estate, using EPSS and exposure rather than feelings. The impact states what the business loses if the flaw is used, in the language of the business. The review date forces a new decision later, so the entry cannot quietly become permanent.","study":"Five fields make a register line defensible: owner, compensating control, likelihood, impact, review date.","keys":["Risk register","Compensating control","Exposure factor and likelihood","Industry and organizational impact","Risk acceptance sign-off","Exception and waiver","Mitigating control","Vulnerability aging"]},{"id":"hard-14","type":"multi","theme":"Compliance scan dispute","summary":"The ASV report failed on TLS and the internal scans are up to date","scenario":[{"label":"Artefact 1 — ASV report and audit note","kind":"log","lines":[{"t":"09:12","s":"asv","m":"TLS 1.0 supported on 3 of 14 external addresses, rated high"},{"t":"09:12","s":"asv","m":"dispute window 10 days: a dispute must be supported by evidence"},{"t":"10:05","s":"note","m":"the load balancer keeps TLS 1.0 for one legacy partner, agreed by the business"},{"t":"11:20","s":"audit","m":"internal scans: all four quarters present, latest authenticated scan 3 weeks ago"}]}],"question":"Which two statements are true? (Select two.)","options":["A dispute removes the finding, so a failed report becomes a pass at once","TLS 1.0 is acceptable when only one partner requires it, so nothing is due","The internal scans must also be performed by the approved scanning vendor","The TLS finding needs evidence that the risk is already mitigated","The internal scan duty is met, so the focus now is the external report"],"answer":[3,4],"hint":"Separate the two duties in the note, then check what a dispute actually changes.","explain":"The dispute process exists for findings that are wrong or already mitigated. It asks for evidence, such as a compensating control on the load balancer. A dispute does not erase a finding by itself. It starts a review, and the report stays failed until the review or a clean rescan changes it. The second duty is separate and already satisfied here. Four quarters of internal scans are present, with a recent authenticated run. Those scans do not have to be done by the approved scanning vendor. Only the quarterly external scans carry that requirement.","study":"Know which scan duty belongs to which rule: external quarterly scans by an approved vendor, internal scans by the team.","keys":["Compliance scan and PCI ASV quarterly external scan","PCI DSS requirements 6 and 11","Internal and external scan","False positive, false negative, true positive, true negative","Compensating control","Risk acceptance sign-off","Authenticated (credentialed) scan"]},{"id":"hard-15","type":"spot","theme":"Spot the weakness in a virtual patch","summary":"The attacker got a 200 on Tuesday — find the line that let the request through","scenario":[{"label":"Artefact 1 — WAF rule VP-104, protecting the reporting path","kind":"code","lines":["1  SecRule REQUEST_URI \"@contains /report/export\" \"id:9104,phase:1,pass,log\"","2  SecRule ARGS:path \"@streq ../../etc/passwd\" \"id:9105,phase:2,deny,status:403\"","3  SecRule REQUEST_METHOD \"@streq GET\" \"id:9106,phase:1,pass,log\"","Tuesday: GET /report/export?path=..%2f..%2f..%2fetc%2fshadow  ->  200 with file content"]}],"question":"Which line explains why this request reached the file?","options":["Line 1: a URI rule never sees a request that carries a parameter","Line 3: a phase one rule stops the later phases from running","The status code: a denial should return 404 so the attacker learns less","Line 2: the exact string match covers one file name and one depth"],"answer":3,"hint":"Compare the value in the rule with the value in the request, character by character.","explain":"A virtual patch is only as good as the pattern it matches. Line 2 compares one argument with one exact string. So the rule covers one file name and one depth. Any other path, or any other file, walks straight past it. Line 1 is doing its job: it logs the export path, and as a detect rule it does not stop the later phases. Line 3 only logs the method, which is normal in phase one. The status code is a cosmetic choice, because the attacker learns success from the outcome and not from the number. The durable fix is to normalise the value and then match a pattern.","study":"For every virtual patch, ask how many ways the same attack can be spelled. Exact string matches protect one spelling.","keys":["Virtual patching and WAF rule","Compensating control","Exploitability, proof of concept and weaponized exploit","False positive, false negative, true positive, true negative","Configuration change and hardening","Mitigating control"]},{"id":"hard-16","type":"match","theme":"STRIDE applied to a design","summary":"Six threats taken from a design review — name the category of each","scenario":[{"label":"Artefact 1 — Design review notes, card payment flow","kind":"text","text":"The review produced six threat cards. Each one must be labelled with the STRIDE category it belongs to before the control discussion starts."}],"question":"Pair each threat card with its STRIDE category.","pairs":[["A stolen session cookie is replayed from another browser","Spoofing"],["A user edits the price field in the request body","Tampering"],["An administrator denies deleting a record and no log proves it","Repudiation"],["An error page shows internal database paths","Information disclosure"],["One tenant floods the shared job queue","Denial of service"],["A normal user reaches the admin interface and gains admin rights","Elevation of privilege"]],"hint":"Six cards, six letters. Name the failure, not the control you would add.","explain":"STRIDE is a design checklist and each letter names one way a design can fail. A replayed session is spoofing, because the system cannot tell that this is not the real user. Editing a field the client should never control is tampering. A missing audit trail that lets somebody deny an action is repudiation. Internal paths in an error page are information disclosure, which is often the first step of an attack rather than a small bug. One tenant starving the others is denial of service. Reaching admin rights from a normal account is elevation of privilege. Naming the category is what tells the team which control family to reach for, and stacking several families is what defence in depth means. Two other methods sit beside the checklist: DREAD ranks the threats that were named, and PASTA organises the whole review around business objectives. In code review the same weaknesses are tracked as CWE classes.","study":"Learn the six letters with one concrete example each, then explain how DREAD ranks the result and PASTA frames the review.","keys":["Threat modeling: STRIDE, PASTA, DREAD","Security controls: technical, administrative, physical","Defense in depth","CVE and CWE","Analyze and prioritize","Data classification"]},{"id":"hard-17","type":"mcq","theme":"Residual risk on an unsupported system","summary":"The replica is locked down and the migration is booked — write the honest sentence","scenario":[{"label":"Artefact 1 — Claims platform note","kind":"kv","rows":[["System","claims-db-01, operating system left vendor support 14 months ago"],["Exposure","read-only replica, reachable only from the claim application tier"],["Controls","host firewall, local agent, weekly triage, change freeze"],["Migration","booked in five months, funded and staffed"]]}],"question":"Which residual risk statement belongs in the report?","options":["The risk is transferred: the migration project has already accepted the asset","Some risk remains: no vendor fixes, so a new flaw stays open until migration","No risk remains: the replica is read-only and the firewall limits the source","No risk remains: the change freeze means nothing on the host can change"],"answer":1,"hint":"Residual risk is what remains after the controls are counted, and it is rarely nothing.","explain":"Residual risk is what is left once the controls are counted. It is never nothing while the vendor has stopped shipping fixes. Read-only access and one allowed source lower the likelihood. The agent and the weekly triage lower the time to detect. But a flaw found next month stays unfixed until the migration completes. So the honest sentence says the exposure continues, and it is time-boxed by a funded migration. A read-only posture does not remove the risk of data disclosure. A change freeze reduces drift, not vulnerability.","study":"Write residual risk as what is still true after the controls. Then say who accepted it and until when.","keys":["Unsupported, legacy and end-of-life software","Decommissioning","Compensating control","Risk acceptance sign-off","Risk register","Mitigating control","Configuration change and hardening","Vulnerability aging"]},{"id":"hard-18","type":"order","theme":"Triage of a brand-new CVE","summary":"The advisory landed ten minutes ago — order the triage work","scenario":[{"label":"Artefact 1 — Alert from the threat feed","kind":"text","text":"A critical advisory covers a library used across the estate. The feed says exploitation is likely and the vendor has published a fixed version. Order the five triage steps the team runs before any ticket is opened."}],"question":"Put the five triage steps in the correct order.","items":["Read the advisory and record the affected version range and the fixed version","Match that range against the asset inventory to find the real population","Check exploitation: KEV listing, EPSS score, and any public proof of concept","Set the deadline from the severity band and the exposure of each asset group","Notify the owners, open the tickets, and record the decision in the register"],"hint":"Nothing can be decided before you know what is affected and whether anybody is using it.","explain":"Triage of a new CVE is a small pipeline and the order carries the logic. The advisory first, because the affected range and the fixed version are the only facts that let you match anything at all. The inventory second, because a flaw in a package nobody runs is a note rather than a ticket. Exploitation third, because a KEV listing or a public proof of concept moves the whole workload into a different queue. The deadline fourth, from the severity band combined with the exposure of each group of assets. Notification and recording last, so every ticket carries the reason it was opened and the decision can be defended later.","study":"Advisory, inventory, exploitation, deadline, notify and record. In that order, every time.","keys":["NVD and vendor advisories","CVE and CWE","CISA KEV catalog","EPSS","Asset inventory and asset criticality","Remediation SLA and deadline","Risk register","Analyze and prioritize","Report"]},{"id":"hard-19","type":"logq","theme":"When a finding becomes an incident","summary":"The exploit attempt succeeded — decide what this is before you decide what to do","scenario":[{"label":"Artefact 1 — Correlated events, host web-02, 21:04","kind":"log","lines":[{"t":"21:04:02","s":"hids","m":"web-02: /bin/sh spawned by the web process, parent nginx"},{"t":"21:04:05","s":"hids","m":"web-02: new file /tmp/.cache/tomcat9 written and then executed"},{"t":"21:04:40","s":"proxy","m":"web-02 outbound to 45[.]133[.]9[.]21 on port 8443, 1.8 MB"},{"t":"21:06:00","s":"waf","m":"rule 930120 fired in detect-only mode on /upload, never blocked"},{"t":"21:07:10","s":"scan","m":"last authenticated scan of web-02 was 9 days ago: upload flaw open"}]}],"question":"Which reading of this evidence drives the correct next action?","options":["A patch is overdue, so deploy the fix this evening and close the finding","The WAF was only detecting, so this is a configuration task and no more","The last scan was nine days old, so the finding may no longer be valid","A finding has become an incident: contain the host, then fix it"],"answer":3,"hint":"Look for the event that proves the flaw was used, not the event that proves the flaw exists.","explain":"A shell spawned by the web service is proof that the flaw was used. A dropped file that ran, and an outbound connection, confirm it. That moves the case out of the vulnerability programme and into incident response. The order flips with it. Contain the host before you patch the application, because the attacker already has a foothold and a patch does not remove it. Deploying the fix and closing the ticket is right when the log shows attempts only. The detect-only WAF mode needs its own ticket, but it is not the next action.","study":"Read logs for two different things: proof that a flaw exists, and proof that a flaw was used. The second one changes the team.","keys":["Vulnerability response versus incident response","Actively exploited, zero-day and n-day","Virtual patching and WAF rule","Patch management","Verify","Analyze and prioritize","Compensating control"]},{"id":"hard-20","type":"fill","theme":"Disclosure policy wording","summary":"The policy must protect the reporter without promising a reward — four words missing","scenario":[{"label":"Artefact 1 — Draft vulnerability disclosure policy, section 2","kind":"text","text":"Legal has reviewed the draft. It promises protection for good-faith research, asks for time before publication, and explains how the company tracks a reported flaw."}],"question":"Complete the policy wording with the four missing terms.","parts":["The policy promises ","{{}}"," for researchers who act in good faith and stay inside the agreed scope. It asks for a ","{{}}"," period before publication, and explains how the company requests a ","{{}}"," so that the flaw can be tracked by everybody. Reports that arrive through the ","{{}}"," programme are triaged within five working days."],"answers":["safe harbor","90-day","CVE","bug bounty"],"bank":["bug bounty","30-day","CVE","coverage","safe harbor","exception","90-day","escalation"],"hint":"One phrase protects the researcher, one is a length of time, one is a public identifier, one is the reward programme.","explain":"Each term does one job. Safe harbor promises that good-faith research inside the agreed scope will not meet legal action. Without it, most researchers stay silent. The 90-day period is the industry norm for coordinated disclosure. Stating it in advance removes the argument later. The CVE identifier makes the flaw trackable across vendors, feeds and scanners. Requesting it is the company's job, not the reporter's. The bug bounty programme is the route that pays for reports. The policy also says that a report is triaged even when no reward applies, so nobody is discouraged.","study":"A disclosure policy needs four promises: protection, a timeline, an identifier, and a clear intake route.","keys":["Vulnerability disclosure policy and safe harbor","Responsible and coordinated disclosure","CVE assignment","Penetration test, red team and bug bounty","Remediation SLA and deadline"]},{"id":"hard-21","type":"sort","theme":"Terse life-cycle lines","summary":"Six short notes from one ticket history — place each one on its phase","scenario":[{"label":"Artefact 1 — Ticket history, six lines only","kind":"text","text":"The notes were written quickly and carry no labels. Place each one on the phase it belongs to."}],"question":"Drag each note onto the life-cycle phase it belongs to.","bins":["Identify","Analyze and prioritize","Remediate or mitigate","Verify","Report"],"items":[{"t":"Nightly sync added 12 hosts the CMDB had never listed","bin":0},{"t":"Owner asked for a 60-day extension during the plant change freeze","bin":1},{"t":"Finding was rescored after the host moved to a public subnet","bin":1},{"t":"Vendor workaround turns off the affected feature until the fix ships","bin":2},{"t":"Ticket reopened after the rescan still showed version 4.1.0","bin":3},{"t":"Board pack shows the exception count falling for three quarters","bin":4}],"hint":"Two of these notes change a date or a score rather than the system itself.","explain":"Busy notes are short, so read what each one actually changes. A sync that finds unlisted hosts changes the inventory, which is Identify. A request for an extension and a rescore after a move change the decision and the deadline, not the system, so both are Analyze and prioritize. A workaround that removes the reachable feature changes the risk, so it is Remediate or mitigate. A reopened ticket that still shows the old version is a failed verification, which is exactly what Verify exists to catch. A falling exception count is a number leaving the team, so it is Report. The trap in this exercise is treating every note about a ticket as remediation, when half of them are decisions.","study":"Ask what the note changes: the inventory, the decision, the risk, the proof, or the message.","keys":["Identify","Analyze and prioritize","Remediate or mitigate","Verify","Report","Exception and waiver","Vulnerability aging","Asset inventory and asset criticality","Rescan and regression test","Metrics and KPIs"]},{"id":"hard-22","type":"sort","theme":"Dual view on a container image","summary":"The release candidate carries a vulnerable base image — split the work by team","scenario":[{"label":"Artefact 1 — Release gate note","kind":"text","text":"The payments image is built on a base layer that carries a flawed library. The platform team and the offensive team both have work to do on the same finding."}],"question":"Drag each action onto the team that would take it.","bins":["Blue team — hardening and detection","Red team — how the flaw is used"],"items":[{"t":"Rebuild the image on a minimal base and scan it in the pipeline","bin":0},{"t":"Alert on a container that starts a shell or writes outside its volume","bin":0},{"t":"Restrict the workload identity so a stolen token reaches very little","bin":0},{"t":"Pull the registry token out of a build log on a public repository","bin":1},{"t":"Use the flawed library inside the image to run code as the app user","bin":1},{"t":"Move from the app container to the node through the mounted socket","bin":1}],"hint":"One column removes the weakness or notices it. The other one turns it into the next step of an attack.","explain":"The blue column is about shrinking and watching. A smaller base image has fewer libraries, and it removes unused services nobody would remember to patch. A runtime alert catches a shell that should never spawn. A narrow workload identity means a stolen token opens few doors. The red column is the attack path. A registry token in a public build log is the way in for supply chain attacks. The flawed library gives code execution. The mounted container socket is the step from one container to the whole node. Together the two columns become an attack story, and the story says which step to cut first.","study":"For every container finding, write the attack path: how they get in, what they run, and where they go next.","keys":["Attack surface (external, internal, physical)","Vulnerability chaining","Configuration change and hardening","Disable unnecessary services","Exploitability, proof of concept and weaponized exploit","Network segmentation and ACL","CVE and CWE","Agent-based and agentless scanning"]},{"id":"hard-23","type":"terminal","theme":"Evidence for the release gate","summary":"Task 51 — the gate wants a machine-readable report about one image","scenario":[{"label":"Artefact 1 — Release gate REQ-9081, task 51","kind":"kv","rows":[["Image","payments-api:1.4.2-rc3, present in the local registry"],["Goal","produce a vulnerability report for that image before promotion"],["Evidence","the report must be written as JSON to /evidence/payments-api-image.json"],["Note","the pipeline reads the file, so the screen output is not enough"]]}],"question":"Produce the evidence the release gate asks for. Type one command.","prompt":"builder@ci-runner-02:~$","env":"You are on the CI runner. The registry is local, /evidence is writable, and the image tag is exactly as written above.","canonical":"trivy image -f json -o /evidence/payments-api-image.json payments-api:1.4.2-rc3","tool":"trivy","flags":["f"],"allowFlags":["o","q","s","f"],"longMap":{"--format":"f","--output":"o"},"argsAny":["payments-api"],"target":"payments-api","termIntro":["Shell on ci-runner-02. /evidence is writable.","Type the command, then press Run command."],"termOut":["INFO  Need to update the vulnerability database","payments-api:1.4.2-rc3 (alpine 3.18.4)","Total: 14 (LOW: 4, MEDIUM: 7, HIGH: 3, CRITICAL: 0)","Report written to /evidence/payments-api-image.json"],"parts":[["trivy","scans container images and filesystems for known flaws"],["image","tells the tool that the target is a container image"],["-f json","writes the report as JSON so the pipeline can read it"],["-o","sends the report into a file instead of the screen"],["payments-api:1.4.2-rc3","the exact release candidate under review"]],"hint":"The gate wants machine-readable evidence about one image. Choose the tool, then the format, then the destination.","explain":"The gate is a pipeline, not a person. So the evidence has to be a file in a format the pipeline can read. That decides three parts of the command. Choose the scanner for images, choose the JSON format, and send the output into the evidence folder. The image tag must match exactly. A report about the wrong tag approves the wrong artefact. A tag like latest would make the evidence meaningless in a week. The screen output is deliberately not enough. Anything a gate or an auditor relies on belongs in a file with a name and a date.","study":"Release evidence needs three things: the right target, a machine-readable format, and a file that outlives the terminal session.","keys":["Patch management","CVE and CWE","Verify","Rescan and regression test","Report","Configuration change and hardening","NVD and vendor advisories"]},{"id":"hard-24","type":"sort","theme":"Audit findings and the duty they break","summary":"Seven audit findings — name the duty that each one breaks","scenario":[{"label":"Artefact 1 — Internal audit working papers","kind":"text","text":"The auditor wrote findings without naming the duty behind them. Place each finding under the duty it breaks."}],"question":"Drag each audit finding under the duty it breaks.","bins":["Patch critical flaws in time","Scan and test on a schedule","Harden the build to a baseline","Know your assets and vulnerabilities","Test before go-live"],"items":[{"t":"A critical fix was installed 74 days after the vendor released it","bin":0},{"t":"No internal scan evidence exists for two quarters of the year","bin":1},{"t":"The last external scan of the payment range was 14 months ago","bin":1},{"t":"Servers were installed with the vendor's default settings in place","bin":2},{"t":"A new build image arrived with no hardening checklist attached","bin":2},{"t":"The register lists hosts that nobody can find in the inventory","bin":3},{"t":"The payment page was never tested before it went live","bin":4}],"hint":"Each finding is missing evidence of one duty, not of several. Ask what the missing document would have proved.","explain":"Each duty leaves its own evidence, and the finding names the evidence that is missing. A critical fix installed 74 days late breaks the timing duty of a patch programme. Two missing quarters of internal scans, and a 14-month gap on the external range, break the scanning duty. The card rules split that duty into internal and external schedules. Default settings and a missing hardening checklist break the configuration duty, which a baseline catalogue defines. A register full of hosts the inventory cannot confirm breaks the duty to know your own estate. An untested payment page breaks the duty to test before go-live.","study":"For each finding ask which document would have prevented it: a standard, a schedule, a baseline, an inventory, or a test report.","keys":["PCI DSS requirements 6 and 11","NIST SP 800-40 patch management","NIST SP 800-115 technical testing","ISO/IEC 27001 A.8.8 technical vulnerabilities","CIS Benchmarks","OWASP Top 10","Configuration change and hardening","Compliance scan and PCI ASV quarterly external scan","Internal and external scan"]},{"id":"hard-25","type":"spot","theme":"Spot the flaw in an exception","summary":"The CISO read the form once and asked a single question — find the line that answers it","scenario":[{"label":"Artefact 1 — Exception request EXC-4410","kind":"code","lines":["1 asset            : plc-fill-01, plant controller on the filling line","2 finding          : remote configuration without authentication, CVSS 8.6","3 compensating     : none at this time","4 expiry           : none, review when the plant is rebuilt","5 approver         : the vulnerability analyst on duty","6 business impact  : a line stop costs about 40 000 per hour"]}],"question":"The CISO asked which line lets this exception stay open forever without a new decision. Which line is it?","options":["Line 5: the approver is the analyst who prepared the request","Line 6: the business impact is written as a cost per hour of downtime","Line 4: the expiry says none and the rebuild has no date","Line 3: the compensating control field was left empty on the form"],"answer":2,"hint":"Look for the field that decides when somebody must look at this again, and check whether it has a date.","explain":"An exception is a decision with a life span. The field that gives it a life span is the expiry. Writing none, with a review tied to an event that has no date or owner, means the finding can stay open for years. The same risk is then re-accepted by default every quarter. The empty compensating control is the next most serious problem. Without a control that lowers the exposure, the form is hard to sign at all. The wrong approver breaks two rules. Acceptance belongs to the risk owner, and the analyst who wrote the request cannot accept it.","study":"Every exception needs a date, a control and a business owner. If one of those is missing, the paper is not a decision, it is a delay.","keys":["Exception and waiver","Compensating control","Risk acceptance sign-off","Risk tolerance and risk appetite","Risk register","Vulnerability aging","Mitigating control","Configuration change and hardening","Special handling: ICS and OT, medical devices, legacy systems"]},{"id":"hard-26","type":"order","theme":"Assessing a plant network safely","summary":"The new plant segment must be assessed without stopping the line","scenario":[{"label":"Artefact 1 — Plant security request","kind":"text","text":"The plant is being connected to the corporate network for the first time. Nothing there has ever been scanned, and a line stop costs about 40 000 per hour. Order the assessment."}],"question":"Put the five assessment steps in the order that keeps the line running.","items":["Ask the plant engineer which controllers may be touched and when","Deploy a passive sensor and collect traffic for two weeks","Agree a maintenance window and a written rollback with the line owner","Run a non-intrusive scan from the plant VLAN with safe checks enabled","Review the results with the plant engineer and record the accepted risks"],"hint":"You cannot scan a production line before you know what it runs and who says yes.","explain":"An industrial network is assessed from the outside in. First you ask, because the plant engineer knows which devices survive a probe. Second, a passive sensor collects traffic without sending a packet. It usually finds more than a scan would: the devices, the protocols they speak, and the systems that talk to them. Third, the maintenance window and the rollback are agreed in writing. Only then does the non-intrusive scan run, with safe checks on and low parallelism. Performance impact on a controller is a production risk, not an inconvenience. The review with the plant engineer last is where findings become accepted risks.","study":"For OT: ask first, watch second, agree a window third, scan fourth with a light footprint, and decide together last.","keys":["Special handling: ICS and OT, medical devices, legacy systems","Active and passive scanning","Intrusive and non-intrusive scan","Safe checks","Performance impact","Maintenance window","Scan window and scheduling","Risk acceptance sign-off","Scan scope and authorization","Rollback plan","Asset inventory and asset criticality"]},{"id":"hard-27","type":"order","theme":"Ranking risk responses by what is left","summary":"One imaging flaw, four ways to answer it — rank by residual risk","scenario":[{"label":"Artefact 1 — Imaging service note","kind":"kv","rows":[["Finding","remote viewing interface accepts unauthenticated requests, CVSS 8.1"],["Constraint","the modality firmware cannot be patched before the vendor visit in Q4"],["Business","the department stopped using the remote viewing feature last year"]]}],"question":"Rank the four responses from the lowest residual risk to the highest.","items":["Remove the remote viewing feature, which the department no longer uses","Segment the modality network and put a virtual patch rule in front of the viewer","Move the viewing service to a provider whose contract carries the liability","Keep the flaw open under a signed exception with monitoring and a review date"],"hint":"Ask what remains after each option: does the exposure disappear, shrink, move elsewhere, or stay exactly as it is?","explain":"Residual risk is what is left after the option is in place. Removing a feature nobody uses makes the exposure disappear. That is the cleanest answer, and teams forget it because it is not a technical fix. Segmenting the network and adding a virtual patch rule shrinks the exposure. The flaw still exists, but reaching it becomes hard and every attempt is visible. Moving the service to a provider transfers the consequence. The system still runs, and a breach is still your incident. That is why transfer sits above mitigation. A signed exception changes only the paperwork, so the full exposure stays.","study":"Order the options: remove the exposure, shrink it, move the consequence, or write it down. Residual risk falls in that order.","keys":["Risk response: avoid, mitigate, transfer, accept","Compensating control","Virtual patching and WAF rule","Network segmentation and ACL","Exception and waiver","Risk acceptance sign-off","Special handling: ICS and OT, medical devices, legacy systems","Mitigating control"]},{"id":"hard-28","type":"fill","theme":"The measures on the dashboard","summary":"Four measures drive the whole programme — five words are missing from the definitions","scenario":[{"label":"Artefact 1 — Dashboard definition sheet","kind":"text","text":"The dashboard has five panels. The definitions below lost their names, and an unclear definition is how a programme starts arguing about its own numbers."}],"question":"Complete the definitions with the five missing measures.","parts":["The first panel shows ","{{}}",", the average age of an open finding, so a rising line means the programme is falling behind. The second shows ","{{}}"," compliance for each severity band, and the third shows the ","{{}}"," rate, which counts findings that come back after a fix fails. Above them sits ","{{}}",", the share of the estate the scanner can actually see, and beside it the average time from finding to fix, ","{{}}","."],"answers":["aging","SLA","reopen","coverage","MTTR"],"bank":["coverage","reopen","appetite","MTTR","aging","likelihood","SLA","escalation"],"hint":"One measure grows with time, one compares a promise, one counts repeat work, one counts visibility, one is an average duration.","explain":"Each measure answers a different management question, and mixing them up hides the real problem. Aging asks how long the open work has waited. It catches a queue that grows quietly even when plenty of tickets close. SLA compliance asks whether the promises for each band were kept. A promise met ninety-four per cent of the time still leaves six per cent late. The reopen rate catches fixes that did not hold, which is the clearest sign of weak verification. Coverage measures visibility, and it makes every other number honest. MTTR is the average duration from finding to fix.","study":"Know what each measure protects you from: a growing queue, a missed promise, a bad fix, a blind spot, and slow work.","keys":["Vulnerability aging","Remediation SLA and deadline","Metrics and KPIs","Mean time to remediate (MTTR)","Report","Executive and board reporting"]},{"id":"hard-29","type":"sort","theme":"Naming the attack surface","summary":"Eight exposures, four surfaces — including the ones no inventory lists","scenario":[{"label":"Artefact 1 — Exposure workshop cards","kind":"text","text":"The workshop produced eight cards. Each one belongs to one part of the attack surface, and one group of cards is the one that never appears in an inventory."}],"question":"Drag each card onto the part of the attack surface it belongs to.","bins":["External","Internal","Physical","Shadow IT"],"items":[{"t":"The customer portal that answers on a public address","bin":0},{"t":"The API endpoint that a partner company calls from the internet","bin":0},{"t":"The build VLAN that every developer laptop can reach","bin":1},{"t":"The service account that can read the whole file share","bin":1},{"t":"The server room door that opens with a shared code","bin":2},{"t":"The USB port on the lobby kiosk","bin":2},{"t":"A Raspberry Pi running an unregistered wiki under a desk","bin":3},{"t":"A team's own cloud bucket created with a personal account","bin":3}],"hint":"Ask who or what can reach the thing: the internet, somebody inside, a person with hands, or nobody official at all.","explain":"The attack surface is everything an attacker can reach, and it is easier to reason about in parts. External means what the internet can touch, including a service that only a partner uses. Internal means what a user, a service account or a compromised host can reach from inside, and that includes permissions. Physical means doors, racks and ports a person can handle. The last group hurts programmes most. A wiki under a desk and a personal cloud bucket exist outside the inventory. The scanner never sees them and nobody owns them. That is why discovery scans and asset reconciliation matter as much as the findings.","study":"Walk the four surfaces every quarter: what the internet reaches, what an insider reaches, what a hand can touch, and what nobody registered.","keys":["Attack surface (external, internal, physical)","Shadow IT","Asset inventory and asset criticality","Internal and external scan","Discovery scan","Data classification","Identify"]},{"id":"hard-30","type":"sort","theme":"Proving existence versus proving use","summary":"Six pieces of evidence — split proof that the flaw exists from proof that it was used","scenario":[{"label":"Artefact 1 — Evidence pack for the incident review","kind":"text","text":"The review asks one question: was the flaw merely present, or was it used? Sort the evidence before the meeting, because the two answers lead to different work."}],"question":"Drag each piece of evidence into the question it answers.","bins":["Proves the weakness exists","Proves somebody exercised it"],"items":[{"t":"Scanner plugin output naming the installed version as 1.4.1","bin":0},{"t":"Vendor advisory text listing the affected version range","bin":0},{"t":"Baseline check showing the service runs as root","bin":0},{"t":"Web log line with a percent-encoded traversal in the path","bin":1},{"t":"EDR alert for a child process started by the web service","bin":1},{"t":"Outbound TLS session from the service account to an unknown host","bin":1}],"hint":"One column describes the system as it is. The other describes events with a time on them.","explain":"Two facts decide a label, and the two are not the same question. Existence evidence is about the system: a version number, an affected range, a configuration state. It says a weakness is present, and it belongs to the vulnerability programme. Use evidence is about events: a request with a traversal in it, a process that should never have started, a connection nobody can explain. An attempt in a log shows that somebody exercised the flaw. Whether it worked is a separate question, and the child-process alert plus the unexplained outbound connection are the closest thing to proof that it did. Mixing the two columns produces a sentence nobody can defend.","study":"Separate the two evidence types on every case. Existence gives a deadline; use gives an incident.","keys":["Exploitability, proof of concept and weaponized exploit","Actively exploited, zero-day and n-day","Vulnerability response versus incident response","Verify","Analyze and prioritize","False positive, false negative, true positive, true negative"]},{"id":"hard-31","type":"branch","theme":"Branching case: a reporter who threatens to publish","summary":"Ninety days became sixty-five, and a copy of the proof is already on a forum","scenario":[{"label":"Artefact 1 — Bounty platform thread and the intel feed, day 62","kind":"log","lines":[{"t":"day 62","s":"reporter","m":"your own policy promises a 90-day window, I counted 62 days"},{"t":"day 62","s":"reporter","m":"a copy of my proof is on a forum, so I publish in three days"},{"t":"day 63","s":"intel","m":"a working exploit for the same component is offered on a criminal forum"},{"t":"day 63","s":"dev","m":"the vendor patch is in test, we can ship it in ten days"}]}],"question":"This dispute runs as a chain of decisions. Read the thread at each step, choose one option, and the next step follows from your choice.","steps":[{"title":"Today","question":"A working exploit is circulating and the reporter will publish in three days. What is the correct first action?","options":["Publish the flaw yourself first so the reporter loses the advantage","Ask the platform to ban the reporter for breaking the agreed timeline","Treat the flaw as exploited: apply a control and watch for use","Pay the reporter to buy three more days of silence for the test team"],"answer":2,"explain":"An exploit offered on a criminal forum changes the risk class, whatever the reporter does next. So the immediate action is the same one you would take for any exploited flaw: put a control in front of the door and watch for attempts. Paying for silence turns a disclosure into a market and rewards the threat, and it does not remove the circulating exploit. Publishing first spreads the attack knowledge to everyone while your patch is still in test. Banning the reporter punishes the messenger and ends the flow of reports, while the exploit stays where it is."},{"title":"The ten days","scenario":[{"label":"Artefact 1 — Release note, day 63","kind":"log","lines":[{"t":"day 63","s":"dev","m":"the integration suite needs ten days before release"},{"t":"day 63","s":"soc","m":"no attempt against our instance in the last 24 hours"}]}],"question":"The tested patch needs ten more days. What do you do with those days?","options":["Ship the untested patch at once, because the exploit is already public","Wait out the ten days with the system unprotected to keep the release clean","Roll the portal back a month and stop every release until the patch is ready","Keep the control and the monitoring on while the tests run in parallel"],"answer":3,"explain":"The compensating control is what makes it safe to keep testing, and the monitoring is what tells you if the risk changes. Shipping untested changes to a payment path swaps a security risk for an outage risk you cannot predict. Waiting with no protection leaves the door open for ten days on a flaw with a public exploit. Rolling back a month and freezing the release train damages the business and still leaves the flaw in production, because the flaw is in the component, not in the last release."},{"title":"After the publication","question":"The reporter published the technical details at day 65. What is the right response now?","options":["Hunt for use of the published technique, then finish the tested patch","Close the ticket, because the information is public and nothing is left to protect","Issue a statement saying that the reported impact was exaggerated","Withdraw the safe harbor promise and report the researcher to the platform"],"answer":0,"explain":"Publication raises the value of detection, because every attacker now knows the technique, so the correct move is to search for it in the logs while the tested patch finishes its run. Closing the ticket because the news is public confuses secrecy with safety: the flaw is still open. Attacking the reporter's credibility is a public fight that gains nothing and costs the relationship. Withdrawing safe harbor and reporting the researcher breaks your own published policy, which is the document that keeps future reporters talking to you."}],"hint":"At each step ask what changes the real risk, what keeps the fix safe, and what keeps the reporting relationship workable.","explain":"A dispute with a reporter never changes the attacker's behaviour. So the case is managed like any other exploited flaw. Control the exposure, keep testing the real fix, watch for use, and close only when the patch is verified. The human side matters too, because the next reporter is watching how this one was treated. Every step has a tempting shortcut: paying for silence, shipping untested code, or punishing the reporter. Each shortcut trades a small comfort today for a larger problem later.","study":"When a disclosure turns hostile, fall back on the process: control, test, detect, patch, verify, and keep your published promises.","keys":["Responsible and coordinated disclosure","Vulnerability disclosure policy and safe harbor","Exploitability, proof of concept and weaponized exploit","Threat intelligence and dark web","Actively exploited, zero-day and n-day","Compensating control","Virtual patching and WAF rule","Penetration test, red team and bug bounty","Verify"]},{"id":"hard-32","type":"logq","theme":"Exploited flaw against a thirty-day test cycle","summary":"The catalog says exploited, the change calendar says thirty days — both are true","scenario":[{"label":"Artefact 1 — Four messages, Thursday afternoon","kind":"log","lines":[{"t":"16:20","s":"feed","m":"KEV catalog update: CVE-2024-6621 added, exploitation confirmed in the wild"},{"t":"16:31","s":"vendor","m":"patch released on the usual monthly release day for the 3.4 and 3.5 branches"},{"t":"16:45","s":"change","m":"the integration suite needs 30 days before a change reaches production"},{"t":"16:52","s":"soc","m":"no attempt against our instance seen in the last 24 hours"}]}],"question":"Which action set is correct for tonight?","options":["Force the patch into production tonight and skip the integration tests","Take the service offline for 30 days until the tested patch is ready","Apply the vendor workaround now, test in parallel, review daily","Wait the full 30 days, because no attempt has reached our instance yet"],"answer":2,"hint":"The catalog is a statement about the world. The SOC entry is a statement about your instance so far. They do not cancel each other.","explain":"Two different statements are on the screen. The KEV entry is about the world, because exploitation is confirmed. That moves the temporal side of the assessment, since exploit code is public and functional. The SOC line is about your instance up to now, and silence today is not protection tomorrow. A confirmed exploited flaw with a released vendor fix is the case the emergency path exists for. A workaround tonight holds the door while the integration suite runs its 30 days. Daily review keeps the decision honest. Waiting with no control, skipping the tests, or taking the service down all trade a manageable risk for a worse one.","study":"For an exploited flaw, use three clocks at once: the world (KEV), your instance (logs), and your release train (tests). Control the gap between them.","keys":["Actively exploited, zero-day and n-day","CISA KEV catalog","CVSS temporal score","Exploitability, proof of concept and weaponized exploit","Compensating control","Patch testing and staged rollout","Maintenance window","Emergency change and the change advisory board","Virtual patching and WAF rule","Mitigating control"]},{"id":"hard-33","type":"order","theme":"Rebuilding the timeline from a chat","summary":"The ticket history is a chat with no dates — rebuild the order from the causal words","scenario":[{"label":"Artefact 1 — Team chat about VULN-6612, in the order people spoke","kind":"log","lines":[{"t":"mon","s":"dev","m":"I removed rule VP-118 right after the vendor fix went in"},{"t":"mon","s":"vm","m":"the rescan came back clean, so I could close the ticket"},{"t":"mon","s":"owner","m":"I signed the 45-day exception because the vendor fix was months away"},{"t":"mon","s":"vm","m":"plugin 66021 opened it as high, the morning after the asset sync found the box"},{"t":"mon","s":"dev","m":"I put VP-118 in place the morning after the exception was signed"},{"t":"mon","s":"vm","m":"the September aging report counted the item at 52 days"}]}],"question":"Rebuild the true order of the events, earliest first.","items":["Asset sync added api-gw-04 to the inventory","Plugin 66021 opened the finding as high severity","Service owner signed a 45-day exception with a review date","Virtual patch rule VP-118 was deployed in front of the gateway","Vendor fix installed and rule VP-118 removed","Credentialed rescan came back clean and the ticket closed","Aging report counted the item at 52 days"],"hint":"Follow the causal words in the chat: the morning after, right after, so I could, because.","explain":"The chat has no dates, but it has causality, and causality is enough. The asset sync found the box, and the plugin opened the finding the next morning. The exception was signed while the vendor fix was months away. The virtual patch arrived the morning after the exception, which put a control in place before any fix existed. The vendor fix came later, and the rule was removed right after it, because a control that is no longer needed is a change to be documented. The clean rescan is what allowed the ticket to close. The aging report came last. This is the same skill you use when a log has no timestamps.","study":"Rebuild timelines from causality when timestamps are missing or unreliable, and remember that verification precedes closure.","keys":["Identify","Analyze and prioritize","Remediate or mitigate","Verify","Report","Exception and waiver","Virtual patching and WAF rule","Rescan and regression test","Vulnerability aging","Risk register","Metrics and KPIs"]},{"id":"hard-34","type":"sort","theme":"One library, forty microservices","summary":"A shared base layer carries the flaw — split the platform work by team","scenario":[{"label":"Artefact 1 — Platform note, shared base layer release 9","kind":"text","text":"Forty services build from one base layer that carries a flawed library. Some services are rebuilt weekly, others twice a year, and all of them share one service mesh and one workload identity model."}],"question":"Drag each action onto the team that would take it.","bins":["Blue team — find every instance and prove the fix","Red team — how one foothold is used at scale"],"items":[{"
