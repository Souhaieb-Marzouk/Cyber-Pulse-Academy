var USER = { name:'', country:'', locale:'en' };
var CERT = 'CompTIA CySA+';

/* ---------------- keyword panel (Step 1 extraction) ---------------- */
const KEYWORDS = [
 { theme:'Vulnerability Management Fundamentals', terms:['vulnerability','exposure','threat','risk','attack surface','attack surface management','asset inventory','CVE','CVSS base score','EPSS','CWE','zero-day','vulnerability scanner','authenticated scan','unauthenticated scan','agent-based scan','agentless scan','internal scan','external scan','scan credentials','false positive','false negative','true positive','true negative','vulnerability validation','configuration baseline','CIS Benchmarks','STIG','configuration drift','hardening','least functionality','legacy system','end-of-life software','shadow IT','golden image'] },
 { theme:'Scanning, Testing & Attack Surface', terms:['vulnerability assessment','penetration test','black box','white box','gray box','rules of engagement','scoping','proof of exploitation','Nessus','OpenVAS','Qualys','Metasploit','Burp Suite','BloodHound','bug bounty','responsible disclosure','vulnerability disclosure program','safe harbour','exploit code maturity','PoC'] },
 { theme:'Prioritization & Response Workflow', terms:['risk-based prioritization','CVSS temporal score','CVSS environmental score','CISA KEV','exploited in the wild','asset criticality','business impact','patch management','patch Tuesday','remediation','mitigation','compensating control','workaround','virtual patch','SLA','maintenance window','emergency change','rollback','verification rescan','ticket workflow','vulnerability aging','MTTD','MTTR','MTTP','patch compliance rate','risk register','risk heat map','prioritization matrix','remediation deadline','exception request','risk acceptance','risk deferral','residual risk','risk treatment'] },
 { theme:'Governance, Risk & Compliance', terms:['PCI DSS','HIPAA','GDPR','SOX','72-hour breach notification','regulatory reporting','data classification','due care','due diligence','third-party risk','supply chain risk','SBOM','vendor management','service level agreement','MOU','NDA','security policy','exception expiry','risk owner','audit trail','CISO','asset owner','system administrator','legal counsel','third-party risk manager'] },
 { theme:'Leadership & Communication', terms:['vision','mission','strategy','goal setting','security roadmap','KPI','KRI','metrics reporting','executive brief','board reporting','business case','budget justification','ROI','stakeholder management','non-technical communication','risk communication','security awareness','team development','mentoring','delegation','decision making under pressure','incident command','ethics','security culture','risk appetite','risk tolerance','security governance','business alignment','technical advice','legal advice','interpersonal skills','appropriate levels of protection'] }
];

/* -----------------------------------------------------------------------
   STEP 2 — exercises (32, all MEDIUM severity)
   ----------------------------------------------------------------------- */


/* ---------------- exercises (Step 2) ---------------- */
const EXERCISES = [

/* ---------------- M01 ---------------- */
{
 id:'M01', elements:1, theme:'Prioritization & Response Workflow', type:'mcq', title:'Nightly scan triage at Northwind Health',
 context:'You are the vulnerability management analyst on the 07:00 shift. The nightly authenticated scan has finished and the findings are already correlated with the CISA Known Exploited Vulnerabilities (KEV) list and with the asset inventory.',
 art:{ kind:'table', title:'findings from scan run 2024-06-11-0300', head:['CVE','CVSS base','EPSS','Known exploited?','Asset'],
   rows:[
    ['CVE-2024-3400','10.0','0.94','Yes — on the KEV list','VPN gateway, internet-facing, production'],
    ['CVE-2023-44487','7.5','0.62','No','Internal web server, behind the WAF'],
    ['CVE-2022-22965','9.8','0.03','No','Developer build server, no internet route'],
    ['CVE-2021-44228','10.0','0.02','No','Decommissioned server, powered off, still in inventory']]},
 prompt:'Which finding do you work on first?',
 options:[
  'The Log4Shell finding, because 10.0 is the highest possible CVSS base score.',
  'The PAN-OS finding, because attackers already use it and the host is exposed.',
  'The Spring4Shell finding, because developers run untrusted code on that host.',
  'The rapid reset finding, because a denial of service stops staff from working.'],
 correct:'The PAN-OS finding, because attackers already use it and the host is exposed.',
 explain:'A CVSS score alone is not risk. Risk grows when a flaw is easy to exploit, when attackers already use it in real attacks, and when the asset is important and reachable. The PAN-OS flaw is on the KEV list, its EPSS is 0.94, and the device faces the internet. The Log4Shell host is switched off, so nobody can attack it. The other two findings have much weaker evidence of real attacks.',
 focus:'Review how CVSS + EPSS + the KEV list + asset exposure are combined. A 10.0 score on a powered-off host is not urgent.',
 hint1:'Look for the row where attackers already use the flaw AND the device can be reached from the internet.',
 hint2:'Exploited-in-the-wild evidence plus internet exposure beats a high score on a machine that is switched off.'},

/* ---------------- M02 ---------------- */
{
 id:'M02', elements:10, theme:'Scanning, Testing & Attack Surface', type:'dnd', title:'Two different services, two different jobs',
 context:'Northwind Health buys two services this year: a scheduled vulnerability assessment and an annual penetration test. Your manager asks you to sort the statements so the purchase makes sense to the finance team.',
 prompt:'Place every statement in the correct box.',
 zones:[{id:'va',label:'Vulnerability assessment'},{id:'pt',label:'Penetration test'}],
 items:[
  {id:'i1',text:'Runs automatically on a repeating schedule',zone:'va'},
  {id:'i2',text:'Mostly automated checks against known flaws',zone:'va'},
  {id:'i3',text:'Lists every detected weakness in a long report',zone:'va'},
  {id:'i4',text:'Can be run by the internal operations team',zone:'va'},
  {id:'i5',text:'Uses a tester who chains flaws to reach a goal',zone:'pt'},
  {id:'i6',text:'Produces a proof that a real breach is possible',zone:'pt'},
  {id:'i7',text:'Needs a signed rules of engagement document',zone:'pt'},
  {id:'i8',text:'Answers the question: can we actually be breached?',zone:'pt'},
  {id:'i9',text:'Limited to an agreed scope and a short time window',zone:'pt'},
  {id:'i10',text:'Coverage is measured in assets scanned per week',zone:'va'}],
 explain:'A vulnerability assessment is wide and repeatable: it checks many assets against known weaknesses and produces a list. A penetration test is deep and goal-driven: a human tries to combine weaknesses and proves whether a real break-in is possible. Both are useful, but they answer different questions.',
 focus:'Learn the difference between scanning everything often and testing a few things deeply. Also learn why a rules of engagement document exists.',
 hint1:'One service is a scheduled, mostly automated list. The other uses human skill to prove a break-in.',
 hint2:'Words like "schedule", "list" and "coverage" belong to scanning; words like "chain", "proof" and "goal" belong to testing.'},

/* ---------------- M03 ---------------- */
{
 id:'M03', elements:6, theme:'Vulnerability Management Fundamentals', type:'match', title:'Read the jargon from the report header',
 context:'You joined the team last week. Your mentor gives you the header of a real vulnerability report and asks you to explain each term in one line.',
 prompt:'Match each term on the left to the correct meaning.',
 zones:[
  {id:'d1',label:'A unique ID for one known software flaw'},
  {id:'d2',label:'A 0 to 10 score that says how severe a flaw is'},
  {id:'d3',label:'A daily chance that a flaw will be used in real attacks'},
  {id:'d4',label:'A category name for a type of coding weakness'},
  {id:'d5',label:'An inventory of every part inside a software product'},
  {id:'d6',label:'A flaw that attackers use but the vendor has not fixed yet'}],
 items:[
  {id:'t1',text:'CVE',zone:'d1'},
  {id:'t2',text:'CVSS base score',zone:'d2'},
  {id:'t3',text:'EPSS',zone:'d3'},
  {id:'t4',text:'CWE',zone:'d4'},
  {id:'t5',text:'SBOM',zone:'d5'},
  {id:'t6',text:'Zero-day',zone:'d6'}],
 explain:'CVE names one specific flaw, like a serial number. CVSS scores how bad that flaw is when it is used. EPSS is different: it predicts the chance that the flaw will really be attacked in the next 30 days. CWE describes the type of mistake in the code, for example improper input validation. An SBOM lists the parts inside a product, which is how you find out that you use a vulnerable library. A zero-day is a flaw with no vendor fix yet.',
 focus:'Be able to say which of these measures severity (CVSS) and which measures real-world likelihood (EPSS).',
 hint1:'One of these is a prediction about attackers, not a score about the code.',
 hint2:'CWE is a category, CVE is one instance. SBOM is about parts, not about flaws.'},

/* ---------------- M04 ---------------- */
{
 id:'M04', elements:6, theme:'Vulnerability Management Fundamentals', type:'order', title:'Build the vulnerability management lifecycle',
 context:'You are writing the one-page process that the new junior analysts must learn. The six steps of the lifecycle are on the left in the wrong order.',
 prompt:'Put the six steps of the vulnerability management lifecycle in the correct order.',
 items:[
  {id:'s1',text:'Know what you own: build and maintain the asset inventory'},
  {id:'s2',text:'Scan the assets to find weaknesses'},
  {id:'s3',text:'Validate the findings and prioritize them by risk'},
  {id:'s4',text:'Remediate or mitigate the accepted findings'},
  {id:'s5',text:'Verify the fix with a rescan of the same asset'},
  {id:'s6',text:'Report the remaining risk and the metrics to management'}],
 correctOrder:['s1','s2','s3','s4','s5','s6'],
 explain:'You cannot protect what you do not know you own, so the inventory comes first. Scanning finds weaknesses on those assets. Validation removes false positives and prioritization decides what to fix first. Then you fix or reduce the risk. A rescan proves the fix really worked, because a closed ticket is not proof. Finally you report the remaining risk, because leadership must know what is still open.',
 focus:'Remember that verification by rescan sits between fixing and reporting. "Patch installed" is not the same as "flaw gone".',
 hint1:'Security starts with knowing your assets. The last step is something you do for management, not for the server.',
 hint2:'A ticket being closed is not evidence. Something must happen after the fix and before the report.'},

/* ---------------- M05 ---------------- */
{
 id:'M05', elements:4, theme:'Prioritization & Response Workflow', type:'fill', title:'Finish the patch policy sentence',
 context:'The GRC analyst sends you the draft patch management policy. Four words are missing and the bank of words is at the bottom.',
 prompt:'Complete the four gaps in the patch policy with the correct policy words.',
 sentence:'A ______ severity finding on an internet-facing system must be fixed within 15 days. If the fix is not possible, the asset owner must record a ______ that names a ______ control and an ______ date on which the risk will be reviewed again.',
 blanks:['critical','risk exception','compensating','expiry'],
 bank:['expiry','low','compensating','budget','critical','vendor','risk exception','NDA'],
 explain:'The policy needs a severity word first, because the 15-day clock only applies to the worst findings. When a fix is impossible, the owner does not simply ignore it: they file a formal risk exception, they describe the compensating control that reduces the risk in the meantime, and they set an expiry date so the exception is reviewed instead of living forever.',
 focus:'Learn the three parts of a good exception: a named compensating control, an owner and an expiry date.',
 hint1:'The first blank is the highest severity label used in patch policies.',
 hint2:'The exception must end one day — that is the last blank.'},

/* ---------------- M06 ---------------- */
{
 id:'M06', elements:1, theme:'Vulnerability Management Fundamentals', type:'terminal', title:'Pull the critical rows out of the scan export',
 context:'The scanner exported a CSV file called scan_results.csv to your Linux jump host. Your manager only wants the rows marked Critical before the 08:30 stand-up, and she wants to see the command you used in the ticket.',
 prompt:'Write the command that prints only the lines of scan_results.csv that contain the word Critical.',
 guide:'Use a <code>grep</code> command on the file <code>scan_results.csv</code>. A short hint: you do not need extra flags, but <code>-i</code> also works. Expected output shape: <code>10[.]20[.]4[.]19,CVE-2024-3400,Critical,10.0</code>',
 accept:['^grep\\b.*critical.*scan_results\\.csv','^grep\\b.*scan_results\\.csv.*critical','^cat\\s+scan_results\\.csv\\s*\\|\\s*grep\\b.*critical'],
 sample:'grep -i critical scan_results.csv',
 explain:'grep reads a file line by line and prints the lines that match your pattern. Naming the file and the word Critical is enough. Adding -i makes the search ignore upper and lower case, which protects you when one export writes CRITICAL and the next writes Critical.',
 focus:'Practise the shape: command + pattern + file. Learn that -i removes case problems in log and CSV work.',
 hint1:'The command family is grep. You need the search word and the file name.',
 hint2:'Order does not matter much, but the file name must be scan_results.csv and the word must be Critical.'},

/* ---------------- M07 ---------------- */
{
 id:'M07', elements:1, theme:'Scanning, Testing & Attack Surface', type:'logpick', title:'Why did one host return so few findings?',
 context:'The authenticated scan of the finance subnet finished, but one host reported only three findings while its twin reported sixty-one. You open the scanner log and filter it.',
 prompt:'Click the line that explains why that host returned so few findings.',
 lines:[
  '2024-06-11 02:00:02 INFO  scanmgr: job SC-4471 started policy="Internal-Audit" targets=42',
  '2024-06-11 02:00:05 INFO  scanmgr: plugin feed version 2024061018 loaded (184,221 checks)',
  '2024-06-11 02:01:10 INFO  scanmgr: host 10[.]20[.]4[.]19 is alive (icmp echo reply)',
  '2024-06-11 02:01:44 INFO  scanmgr: host 10[.]20[.]4[.]19 open ports: 445, 3389, 5985',
  '2024-06-11 02:02:03 WARN  scanmgr: host 10[.]20[.]4[.]19 SMB login FAILED for account svc_scan (account locked out)',
  '2024-06-11 02:02:04 WARN  scanmgr: host 10[.]20[.]4[.]19 falling back to unauthenticated checks only',
  '2024-06-11 02:09:51 INFO  scanmgr: host 10[.]20[.]4[.]19 scan complete: 3 findings',
  '2024-06-11 02:14:20 INFO  scanmgr: host 10[.]20[.]4[.]20 scan complete: 61 findings',
  '2024-06-11 02:20:00 INFO  scanmgr: job SC-4471 finished hosts=42 errors=0'],
 answerLines:[5],
 explain:'An authenticated scan logs into the host, so it can read the installed software and the patch level from the inside. When the login fails, the scanner falls back to unauthenticated checks and only sees what the network shows. The result looks clean but it is blind: the local checks that would have found missing patches were never run. Fix the service account, then rescan before you trust the number.',
 focus:'Learn the words credentialed (authenticated) and uncredentialed (unauthenticated) scanning, and learn that a locked service account silently reduces coverage.',
 hint1:'Look for a line where the scanner could not log in as a real user.',
 hint2:'Authentication failure changes how deep the scan can go. That is the warning line.'},

/* ---------------- M08 ---------------- */
{
 id:'M08', elements:1, theme:'Prioritization & Response Workflow', type:'hotspot', title:'Spot the mistake in the patching profile',
 context:'A junior engineer wrote this patching profile for the production Linux fleet. It was merged last night. You review it this morning.',
 prompt:'Click the single line that creates the biggest security risk.',
 lines:[
  'patch_profile:',
  '  scan_schedule: "daily 02:00"',
  '  target_group: "prod-linux"',
  '  auto_approve: ["security", "critical"]',
  '  install_window: "sun 03:00-05:00"',
  '  reboot_after_install: true',
  '  exclude_packages: ["kernel-*"]   # keeps the reboot short',
  '  rollback_plan: "snapshot-before-patch"',
  '  verify_after: "rescan"'],
 answerLine:6,
 explain:'Excluding kernel packages means the most important security fixes never land, because kernel flaws are the ones attackers use to take over a whole machine. Everything else in this profile is sound: the window is out of hours, auto-approval is limited to security and critical updates, and there is a rollback plan and a verification step. The comment shows the engineer optimised for a short reboot instead of for security.',
 focus:'Learn that an exclusion list is a silent risk acceptance. Always ask which packages are excluded and who approved it.',
 hint1:'Four lines are good practice. One line quietly removes the protection you need most.',
 hint2:'Think about which component, when unpatched, gives an attacker control of the whole host.'},

/* ---------------- M09 ---------------- */
{
 id:'M09', elements:3, theme:'Prioritization & Response Workflow', type:'branch', title:'Zero-day in the remote access appliance',
 context:'Northwind Health runs one internet-facing VPN appliance for 900 remote staff. At 09:12 the vendor publishes an advisory: a critical flaw allows an unauthenticated attacker to run code on the device. There is no patch yet and the first fix will take about six days. You are the vulnerability manager on call. Work through the response step by step.',
 prompt:'Choose the best action at each step of the response.',
 stages:[
  {prompt:'The advisory is 20 minutes old. What is your FIRST action?',
   options:[
    {id:'a',text:'Take the appliance offline at once and stop all remote work.',ok:false,why:'This is the safest technical move but it stops 900 people from working. You do not yet know whether the device is even reachable from the internet, so this may be a large business outage for no reason.'},
    {id:'b',text:'Confirm how the device is exposed and read the vendor mitigations.',ok:true,why:'Correct. First you establish the facts: is the vulnerable service reachable from the internet, and what temporary controls does the vendor offer? Facts come before drastic action.'},
    {id:'c',text:'Wait for the patch and keep watching the usual dashboards.',ok:false,why:'A flaw that attackers use within hours does not wait six days. Doing nothing leaves the door open.'},
    {id:'d',text:'Escalate to legal and ask the vendor for a written guarantee.',ok:false,why:'Legal and the vendor matter, but neither reduces the risk today. Escalation is not a control.'}]},
  {prompt:'The device must stay online. The vendor offers a temporary mitigation and a detection rule is available. What next?',
   options:[
    {id:'a',text:'Apply the mitigation, add the detection rule, and raise logging.',ok:true,why:'Correct. A temporary mitigation plus detection and extra logging is the standard answer when you cannot patch yet. This is a compensating control: it does not remove the flaw, it makes the flaw much harder to use and much easier to see.'},
    {id:'b',text:'Do nothing, because a mitigation is not a real fix.',ok:false,why:'A mitigation that blocks the attack path is worth a great deal for six days. Rejecting it leaves you exposed.'},
    {id:'c',text:'Publish the device to all source addresses so monitoring is simpler.',ok:false,why:'This widens the attack surface on purpose. It is the opposite of what you need.'},
    {id:'d',text:'Ask the vendor for a refund and delay any change.',ok:false,why:'This reduces nothing technical and costs time.'}]},
  {prompt:'The next morning the monitoring rule fires. A service account logs in successfully from a country where Northwind has no staff. What do you do?',
   options:[
    {id:'a',text:'Treat it as a compromise: isolate the device and keep the logs.',ok:true,why:'Correct. A successful login from an unexpected place fits the known attack pattern, so you assume the worst and protect the evidence. Isolation stops the attacker from moving deeper and preserved logs are what the investigation needs.'},
    {id:'b',text:'Block that single source address and then carry on as usual.',ok:false,why:'The attacker is already inside. Blocking one address does not remove them and may destroy the trace you need.'},
    {id:'c',text:'Change the service account password and close the ticket.',ok:false,why:'Changing a password does not remove an attacker who already has a foothold on the device.'},
    {id:'d',text:'Wait for two more alerts before you escalate to a manager.',ok:false,why:'Waiting is how small incidents become breaches. One confirmed suspicious success is enough.'}]}],
 explain:'This is the standard shape of a zero-day response: confirm the exposure, apply the strongest available compensating control, watch hard, and treat any sign of success as a real compromise. The tempting wrong answers are the dramatic ones (switch everything off) and the lazy ones (wait for the patch).',
 focus:'Learn the order: facts → compensating control → detection → assume breach on evidence. And remember that isolation plus evidence preservation come before cleanup.',
 hint1:'Start with facts, not with shutdowns. Then use what the vendor gives you while you cannot patch.',
 hint2:'A successful login that matches the attack pattern is a compromise, not a nuisance alert.'},

/* ---------------- M10 ---------------- */
{
 id:'M10', elements:2, theme:'Scanning, Testing & Attack Surface', type:'dual', title:'Same server, two chairs',
 context:'An old Apache web server at 10[.]20[.]8[.]31 runs a version with a known remote code execution flaw. You answer the same situation twice: once as the blue team analyst who runs the SOC, and once as the red team tester who is allowed to attack it.',
 prompt:'Choose one answer in each part.',
 parts:[
  {label:'BLUE TEAM — which detection gives you the earliest useful warning?',
   correct:'An alert when a request matches the known exploit path on that host.',
   options:[
    'An alert when a request matches the known exploit path on that host.',
    'A weekly disk usage report from the server monitoring agent.',
    'The next scheduled monthly vulnerability scan of the same server.',
    'A firewall rule that blocks all traffic to port 80 on the server.']},
  {label:'RED TEAM — you confirmed the version from the banner. What is the next step?',
   correct:'Send one crafted request to the known path and check the reply.',
   options:[
    'Send one crafted request to the known path and check the reply.',
    'Scan every port of the whole /16 network to map the environment.',
    'Send a phishing email to the server administrator to get a login.',
    'Restart the service to see whether the version banner changes.']}],
 explain:'The blue team wins with a narrow, specific detection: a rule that knows the exploit path for this CVE on this host. Generic reports and monthly scans are far too slow, and blocking port 80 breaks the service. The red team wins by moving from evidence to a controlled proof, using the known path once and checking the result. Broad scanning and phishing are different techniques that do not confirm this flaw.',
 focus:'Learn that detection quality beats detection quantity, and that a tester confirms a flaw with a controlled proof, not a noisy sweep.',
 hint1:'Blue: think about which signal is specific to this flaw. Red: think about the smallest step that proves the flaw is real.',
 hint2:'A month-old scan cannot warn you about an attack happening now, and a wide port scan does not test one web flaw.'},

/* ---------------- M11 ---------------- */
{
 id:'M11', elements:1, theme:'Vulnerability Management Fundamentals', type:'mcq', title:'The finding you cannot reproduce',
 context:'The scan reports CVE-2023-1234 inside OpenSSL 1.1.1 on host APP-07. You log in to APP-07 and run the version check yourself. It prints <code>OpenSSL 3.0.13</code>. The scanner used a cached banner from a service that was upgraded four months ago, and the plugin has not been updated since.',
 prompt:'How do you classify this finding and what do you do next?',
 options:[
  'True positive — patch OpenSSL again on APP-07 and close the ticket.',
  'False positive — keep the evidence and ask for a fresh rescan.',
  'False negative — reopen the old ticket and raise the severity level.',
  'True negative — close the ticket and write no note in the system.'],
 correct:'False positive — keep the evidence and ask for a fresh rescan.',
 explain:'A false positive is a report of a weakness that is not really there. You proved the installed version is not vulnerable, so the finding is a false positive. The right response is to record your evidence, correct the plugin or the cached data, and rescan so the report is honest. A false negative is the opposite case: a real weakness that the scanner missed. Closing without a note hides the reason and the same wrong finding will come back next week.',
 focus:'Learn the four boxes: true positive, false positive, true negative and false negative. Only a false positive is "reported but not real".',
 hint1:'A report about something that is not there has a specific name that starts with "false".',
 hint2:'The version you read by hand is newer than the version the scanner thought it saw.'},

/* ---------------- M12 ---------------- */
{
 id:'M12', elements:10, theme:'Prioritization & Response Workflow', type:'dnd', title:'Fix it or reduce it?',
 context:'Your team must clear 10 findings before the quarterly audit. Some of them can be fixed properly. Others cannot be fixed yet, so the team must reduce the risk in another way.',
 prompt:'Sort the actions: does the action remove the flaw, or does it only reduce the risk?',
 zones:[{id:'rem',label:'Remediation — removes the flaw'},{id:'mit',label:'Mitigation — reduces the risk'}],
 items:[
  {id:'i1',text:'Install the vendor patch for the flawed library',zone:'rem'},
  {id:'i2',text:'Upgrade the application to a supported version',zone:'rem'},
  {id:'i3',text:'Add a virtual patch rule on the web application firewall',zone:'mit'},
  {id:'i4',text:'Turn off the service that nobody uses any more',zone:'rem'},
  {id:'i5',text:'Block the management port at the network firewall',zone:'mit'},
  {id:'i6',text:'Remove the vulnerable plugin from the web server',zone:'rem'},
  {id:'i7',text:'Disable the vulnerable feature in the product settings',zone:'mit'},
  {id:'i8',text:'Move the old device to its own isolated VLAN',zone:'mit'},
  {id:'i9',text:'Apply the missing operating system update',zone:'rem'},
  {id:'i10',text:'Put multi-factor authentication in front of the admin page',zone:'mit'}],
 explain:'Remediation removes the root cause: the flaw is gone when the patch is installed, the version is upgraded, the unused service is switched off or the vulnerable plugin is deleted. Mitigation leaves the flaw in place but makes it much harder to reach or to use, for example a firewall rule, a WAF virtual patch, an isolated network segment or an extra authentication step. Mitigation is normal and correct when a fix does not exist yet, but it must be recorded as a compensating control and reviewed.',
 focus:'Learn to separate "the flaw is gone" from "the flaw is still there but hard to use".',
 hint1:'If the vulnerable code is no longer present or no longer running, the action removed the flaw.',
 hint2:'Anything that only blocks a path to the flaw (a firewall, a WAF, a segment, an extra login) is a mitigation.'},

/* ---------------- M13 ---------------- */
{
 id:'M13', elements:4, theme:'Governance, Risk & Compliance', type:'match', title:'Which rule applies to which data?',
 context:'Northwind Health stores patient records, takes card payments and has an office in Ireland. The compliance officer asks you, the vulnerability manager, which obligations drive the scan and patch calendar.',
 prompt:'Match each framework to the obligation it creates.',
 zones:[
  {id:'d1',label:'Card data: quarterly external scans by an approved vendor'},
  {id:'d2',label:'US health data: a written risk analysis and safeguards'},
  {id:'d3',label:'EU personal data: breach reported to the regulator within 72 hours'},
  {id:'d4',label:'US financial reporting: change control and audit trails'}],
 items:[
  {id:'t1',text:'PCI DSS',zone:'d1'},
  {id:'t2',text:'HIPAA',zone:'d2'},
  {id:'t3',text:'GDPR',zone:'d3'},
  {id:'t4',text:'SOX',zone:'d4'}],
 explain:'PCI DSS governs card data and forces regular external scanning and patching of systems in the card path. HIPAA governs US health information and requires a documented risk analysis plus technical safeguards. GDPR is the EU privacy law; it sets a 72-hour deadline to tell the supervisory authority about a personal data breach. SOX covers the controls behind financial reporting, so change control and audit trails matter most there.',
 focus:'Learn one memorable trigger per framework: card data, health data, EU personal data, financial reporting.',
 hint1:'Two of the four are about privacy and health, two are about money.',
 hint2:'The 72-hour clock belongs to the EU privacy law, and the audit trail belongs to the financial reporting law.'},

/* ---------------- M14 ---------------- */
{
 id:'M14', elements:5, theme:'Prioritization & Response Workflow', type:'rank', title:'Rank the queue before the change board',
 context:'Five open findings go to the change board at 15:00. You must present them in the order the board should approve work, most urgent first.',
 prompt:'Drag or use the arrows to rank the five findings, most urgent first.',
 items:[
  {id:'v1',text:'VPN appliance — CVSS 9.8, EPSS 0.75, on the KEV list, internet-facing'},
  {id:'v2',text:'Customer portal — CVSS 8.8, EPSS 0.30, internet-facing, no other control'},
  {id:'v3',text:'Domain controller — CVSS 8.1, EPSS 0.10, internal only, high value asset'},
  {id:'v4',text:'File server — CVSS 6.5, EPSS 0.05, internal only, normal business data'},
  {id:'v5',text:'Test lab host — CVSS 5.3, EPSS 0.01, isolated network, no business data'}],
 correctOrder:['v1','v2','v3','v4','v5'],
 explain:'The queue is ranked by exposure, then by evidence that attackers really use the flaw, then by how much the asset matters. The VPN appliance is first because it is exploited in the wild and reachable from the internet. The customer portal is next: also exposed, with a moderate chance of attack. The domain controller is very valuable but internal and much less likely to be attacked, so it comes third. The file server and the isolated lab host come last.',
 focus:'Practise ranking with three questions in this order: can attackers reach it, do they actually use the flaw, and how much would it hurt? That is exactly what a prioritization matrix is for.',
 hint1:'Internet exposure plus real attacks beats an important internal host.',
 hint2:'A domain controller is valuable, but a flaw that attackers do not use on a host they cannot reach is not the top of the queue.'},

/* ---------------- M15 ---------------- */
{
 id:'M15', elements:4, theme:'Governance, Risk & Compliance', type:'fill', title:'Complete the exception form',
 context:'The imaging vendor will not fix a flaw in the MRI control workstation before Q4. The change board agreed to an exception, and you must finish the form so the auditor can read it.',
 prompt:'Complete the four gaps in the exception form with the correct governance words.',
 sentence:'Exception EX-2214. The asset owner is ______. The flaw affects a ______ system that the vendor will not update. As a compensating control the workstation is placed in an ______ network with no route to the internet. After the control, the ______ risk is rated low. The exception expires on 2024-12-01.',
 blanks:['the system owner','legacy','isolated','residual'],
 bank:['residual','cloud','legacy','the vendor','encrypted','isolated','the system owner','accepted'],
 explain:'An exception form must name a person, not a team, because someone must be accountable for the risk. That person is the risk owner. A system the vendor will not update is called legacy. The control is network isolation, which removes the path an attacker would use. Residual risk is the risk that is left after the control is applied, and it is the number the board actually accepts. The exception expiry date is what forces the same people to look at the decision again instead of letting it live forever.',
 focus:'Learn the phrase residual risk: it is what remains after your control, not the original risk.',
 hint1:'The first blank must be a person who is accountable, not a company or a tool.',
 hint2:'The last blank describes the risk that is left over once the control works.'},

/* ---------------- M16 ---------------- */
{
 id:'M16', elements:1, theme:'Prioritization & Response Workflow', type:'logpick', title:'One host did not get the patch',
 context:'The monthly patch job ran overnight. The compliance dashboard shows 118 of 120 servers compliant. You open the deployment log to find the host that failed and the host that was only deferred.',
 prompt:'Click the log line that proves a host failed because the patch could not be installed with the account it used.',
 lines:[
  '2024-06-11 02:00:01 INFO  patchd: job PD-8871 started, targets=120, policy="Monthly-Security"',
  '2024-06-11 02:02:14 INFO  patchd: web-01 installed 14 updates (reboot required)',
  '2024-06-11 02:03:12 INFO  patchd: app-03 installed 9 updates',
  '2024-06-11 02:04:44 ERROR patchd: db-02 install failed: 0x80070005 access denied for account svc_patch',
  '2024-06-11 02:06:00 WARN  patchd: web-04 has a reboot pending from a previous job, install deferred',
  '2024-06-11 02:09:31 INFO  patchd: deployment finished, success=118 failed=1 deferred=1'],
 answerLines:[3],
 explain:'Error 0x80070005 means access denied: the account used by the patch tool does not have the rights it needs on db-02, so nothing was installed there. The web-04 line is a different problem: the patch was deferred because the host must restart first. Reading the error codes tells you which team to call — here it is the team that manages service account permissions.',
 focus:'Learn to separate "permission denied", "reboot pending" and "install failed" in patch logs. Each one has a different owner.',
 hint1:'Two lines are not successes. One is a permission problem and one is only a delay.',
 hint2:'0x80070005 is the Windows code for access denied.'},

/* ---------------- M17 ---------------- */
{
 id:'M17', elements:1, theme:'Scanning, Testing & Attack Surface', type:'hotspot', title:'Review the scan scope document',
 context:'The quarterly external scan of the DMZ starts tomorrow. A new team member drafted the scope document and asks you to approve it.',
 prompt:'Click the single line that must be changed before the scan starts.',
 lines:[
  'Scan scope document — Q3 external scan',
  '1  Target range: 203[.]0[.]113[.]0/24 (DMZ hosts only)',
  '2  Schedule: Sunday 01:00-04:00, low-traffic window',
  '3  Credentials: DOMAIN\\svc_admin (shared domain admin, no expiry)',
  '4  Out of scope: production databases and the OT network',
  '5  Emergency contact: soc@northwind.example, extension 4411',
  '6  Approval: signed by the CISO on 2024-07-01'],
 answerLine:2,
 explain:'A scanner should never use a shared domain administrator account with no expiry. The scanner stores those credentials and uses them on every target, so one compromised scan server would hand an attacker the keys to the whole domain. Use a dedicated scan account with the minimum rights it needs, a long random password and a regular rotation. The window, the target list and the emergency contact are all reasonable.',
 focus:'Learn the principle of least privilege for scan accounts, and learn why shared credentials are a finding on their own.',
 hint1:'Look at the credentials line and ask what an attacker would gain by stealing them.',
 hint2:'A scan account does not need to be a domain administrator.'},

/* ---------------- M18 ---------------- */
{
 id:'M18', elements:6, theme:'Prioritization & Response Workflow', type:'order', title:'A flaw that is being exploited right now',
 context:'At 11:04 the threat intelligence feed confirms that attackers are exploiting a flaw in your internet-facing file transfer service. You must write the response steps in the order the team will follow them.',
 prompt:'Put the six response steps in the correct order.',
 items:[
  {id:'s1',text:'Validate the finding and confirm which of our assets are affected'},
  {id:'s2',text:'Work out the exposure and the business impact with the asset owner'},
  {id:'s3',text:'Contain the affected hosts if any sign of exploitation is present'},
  {id:'s4',text:'Remediate with the vendor patch, or mitigate if no patch exists'},
  {id:'s5',text:'Verify the fix with a rescan and a check of the logs'},
  {id:'s6',text:'Report the outcome and close the ticket with the evidence'}],
 correctOrder:['s1','s2','s3','s4','s5','s6'],
 explain:'You confirm the facts before you touch anything, because a wrong asset list wastes the team. Then you measure the exposure and the business impact so the right people are involved. If there is any sign of a real break-in you contain first: stop the attacker before you repair the hole. Then you fix or mitigate. You verify with a rescan and with the logs, because a patch that does not apply is a common surprise. Finally you report and close with evidence.',
 focus:'Learn that containment comes before remediation when exploitation is confirmed or likely.',
 hint1:'Facts first, then impact, then stopping the attacker, then repairing.',
 hint2:'You never close a ticket without proof that the flaw is gone.'},

/* ---------------- M19 ---------------- */
{
 id:'M19', elements:1, host:'10[.]20[.]30[.]12', theme:'Scanning, Testing & Attack Surface', type:'terminal', title:'Identify the service on the new DMZ host',
 context:'A new host appears at 10[.]20[.]30[.]12 in the DMZ. Change management has no record of it. Before you escalate, you must show the team which service is listening on TCP port 443 and which version it is.',
 prompt:'Write the command that finds the service name and the version running on TCP 443 of 10.20[.]30[.]12.',
 guide:'Use an <code>nmap</code> command. Short hint: one flag asks nmap to detect service versions, another flag selects the port. Expected output shape: <code>443/tcp open  https  nginx 1.18.0</code>',
 accept:['^nmap\\b(?=.*-sv)(?=.*(-p\\s*)?443)(?=.*{HOST})','^nmap\\b(?=.*-sv)(?=.*{HOST})(?=.*443)'],
 sample:'nmap -sV -p 443 10[.]20[.]30[.]12',
 explain:'The -sV flag makes nmap probe the open port and report the service and its version instead of just calling it "https". The -p flag limits the scan to the port you care about, which is faster and quieter. Version information is exactly what you need to match the host against known flaws and to prove to change management that an unknown service is running.',
 focus:'Learn the nmap flags -sV for versions and -p for ports. These two flags cover most first-look tasks.',
 hint1:'Two flags matter here: one for version detection and one for the port.',
 hint2:'-sV detects the version. -p selects the port. The host address goes last.'},

/* ---------------- M20 ---------------- */
{
 id:'M20', elements:4, theme:'Leadership & Communication', type:'fill', title:'Write the line your CISO will read to the board',
 context:'The CISO has two minutes at the board meeting. She asks you for one sentence about the VPN flaw the team handled last month. She wants the sentence to be true, calm and useful.',
 prompt:'Complete the four gaps in the board sentence with the words a CISO would use.',
 sentence:'Our highest ______ this month was an internet-facing VPN flaw with working exploit code in the wild. The team applied the vendor ______ within 36 hours of the advisory. There was no measurable ______ for our patients and partners. We will report the patch ______ rate for internet-facing systems every month.',
 blanks:['risk','mitigation','business impact','compliance'],
 bank:['budget','risk','headcount','compliance','mitigation','downtime','business impact','licence'],
 explain:'A board sentence works when it names the risk, says what was done, states the effect on the business and commits to a number that will be reported again. Words like budget and headcount do not fit because the sentence is about a security event. Writing this way shows that you can move between technical detail and business meaning, which is the core leadership skill in this objective.',
 focus:'Practise turning a technical fact into a business sentence: risk, action, impact, and a metric you will report again.',
 hint1:'The last blank belongs with the word "rate" and describes whether systems meet the patch deadline.',
 hint2:'One blank is about what our patients and partners actually felt.'},

/* ---------------- M21 ---------------- */
{
 id:'M21', elements:1, theme:'Leadership & Communication', type:'mcq', title:'Briefing the finance director',
 context:'A critical flaw is open on a system that handles invoices. The finance director has no technical background and controls the budget for the fix. You have ten minutes with her.',
 prompt:'Which briefing approach is best?',
 options:[
  'Explain the CVE number, the CVSS vector and the exploit maturity score.',
  'Explain the business impact, the cost of the fix and the remaining risk.',
  'Send the full scanner export with all 412 findings and ask her to prioritise.',
  'Say that the situation is very serious and ask for an open-ended budget.'],
 correct:'Explain the business impact, the cost of the fix and the remaining risk.',
 explain:'A non-technical decision maker makes good decisions when she hears three things: what could happen to the business, what the fix costs, and what risk remains after the fix. CVSS vectors and CVE numbers do not help her decide. A raw export of 412 findings pushes your job onto her, and an open-ended budget request without numbers cannot be approved.',
 focus:'Learn the three-part structure for an executive brief: impact, cost, remaining risk.',
 hint1:'What does a budget holder need in order to make a decision?',
 hint2:'Technical identifiers are for your team, not for the finance director.'},

/* ---------------- M22 ---------------- */
{
 id:'M22', elements:6, theme:'Leadership & Communication', type:'match', title:'Put a number on the programme',
 context:'The new CISO wants a monthly one-page report. She asks you to match each metric name to the question it answers, because she does not want vanity numbers on her dashboard.',
 prompt:'Match each metric to the question it answers.',
 zones:[
  {id:'d1',label:'How long does it take us to notice a security event?'},
  {id:'d2',label:'How long does it take us to fix an incident once it starts?'},
  {id:'d3',label:'How long from a patch being released to it being installed?'},
  {id:'d4',label:'What share of assets meet the patching deadline?'},
  {id:'d5',label:'How long have our open findings been waiting?'},
  {id:'d6',label:'Are we answering tickets inside the promised time?'}],
 items:[
  {id:'t1',text:'MTTD',zone:'d1'},
  {id:'t2',text:'MTTR',zone:'d2'},
  {id:'t3',text:'MTTP',zone:'d3'},
  {id:'t4',text:'Patch compliance rate',zone:'d4'},
  {id:'t5',text:'Vulnerability aging',zone:'d5'},
  {id:'t6',text:'SLA adherence',zone:'d6'}],
 explain:'MTTD is mean time to detect: the clock stops when you notice. MTTR is mean time to repair: how long the incident lasted. MTTP is mean time to patch: from the vendor releasing a fix to the fix being installed on your estate. Patch compliance rate is the percentage of assets inside the deadline. Vulnerability aging shows how long findings have been open, which exposes a growing backlog. SLA adherence shows whether the team keeps its promises.',
 focus:'Learn what each clock starts and stops. MTTD is about noticing, MTTR about fixing, MTTP about deploying patches.',
 hint1:'Three metrics are clocks, but they start at different moments.',
 hint2:'The only percentage in the list measures whether assets meet the deadline.'},

/* ---------------- M23 ---------------- */
{
 id:'M23', elements:8, theme:'Vulnerability Management Fundamentals', type:'dnd', title:'Prevent, detect or correct?',
 context:'The security architecture team is classifying the controls in the new vulnerability response plan. You are asked to place each control in the right group.',
 prompt:'Sort each control into the correct group.',
 zones:[{id:'prev',label:'Preventive'},{id:'det',label:'Detective'},{id:'cor',label:'Corrective'}],
 items:[
  {id:'i1',text:'A firewall rule that blocks the vulnerable port',zone:'prev'},
  {id:'i2',text:'An IDS signature that alerts on the exploit attempt',zone:'det'},
  {id:'i3',text:'A virtual patch rule on the web application firewall',zone:'prev'},
  {id:'i4',text:'A SIEM rule that correlates the exploit with a login',zone:'det'},
  {id:'i5',text:'Restoring the host from a clean backup taken last night',zone:'cor'},
  {id:'i6',text:'Deleting the vulnerable plugin from the server',zone:'prev'},
  {id:'i7',text:'A weekly review of the authentication logs',zone:'det'},
  {id:'i8',text:'Rebuilding the compromised host from the golden image',zone:'cor'}],
 explain:'Preventive controls stop the event from happening: blocking a port, removing vulnerable code, or adding a rule that rejects the exploit. Detective controls tell you it is happening or happened: IDS signatures, SIEM correlation and log review. Corrective controls put things back: restoring a backup or rebuilding a host from a trusted image. A strong programme needs all three, because detection without prevention means constant firefighting and prevention without detection means you never learn about the gaps.',
 focus:'Learn to ask "does this stop it, see it, or fix it?" for any control you meet.',
 hint1:'Two controls only produce alerts and reports. Two controls only repair damage after the fact.',
 hint2:'Anything that rejects traffic or removes code is preventive, even if it does not fix the root cause.'},

/* ---------------- M24 ---------------- */
{
 id:'M24', elements:3, theme:'Governance, Risk & Compliance', type:'branch', title:'The vendor library flaw in the payment path',
 context:'Your main payment software vendor emails you: a library inside their product has a critical flaw. They will not release a fixed version for three weeks. The product sits in the payment path and handles card data. You are the vulnerability manager coordinating the response.',
 prompt:'Choose the best action at each step.',
 stages:[
  {prompt:'The vendor email is two hours old. What is your FIRST action?',
   options:[
    {id:'a',text:'Ask which versions are affected and for a firm fix date.',ok:true,why:'Correct. You need the affected version list and a firm date before you can size the problem. This is third-party risk work: get the facts in writing so the commitment can be tracked.'},
    {id:'b',text:'Remove the payment product from every server today.',ok:false,why:'Removing a payment system without planning stops revenue and may itself break card data handling. Facts first.'},
    {id:'c',text:'Post the flaw publicly to put pressure on the vendor.',ok:false,why:'This can break your agreement with the vendor and can warn attackers before you have a fix.'},
    {id:'d',text:'Do nothing, because the flaw sits in a vendor product.',ok:false,why:'The vendor owns the code, but your organisation owns the risk and the card data.'}]},
  {prompt:'You learn the affected product is in the card payment path and cannot be removed. What next?',
   options:[
    {id:'a',text:'Apply the vendor workaround and monitor the exploit path.',ok:true,why:'Correct. Apply the compensating control the vendor offers and add detection, because you cannot patch for three weeks. Every decision here must protect card data now.'},
    {id:'b',text:'Accept the risk, because the vendor caused the flaw.',ok:false,why:'Customers and the card scheme will not accept that argument. The risk is yours to manage.'},
    {id:'c',text:'Wait quietly for the vendor to release the fix.',ok:false,why:'Three weeks is a long window for a critical flaw in a payment path.'},
    {id:'d',text:'Turn off logging on the payment servers to reduce the alert noise.',ok:false,why:'This removes the evidence you would need to prove whether an attack happened.'}]},
  {prompt:'The fixed version is released. What do you do before you close the ticket?',
   options:[
    {id:'a',text:'Upgrade, rescan to verify, and attach the evidence.',ok:true,why:'Correct. Verification with a rescan and stored evidence is what turns "we think it is fixed" into "we can prove it is fixed". The auditor will ask for exactly this.'},
    {id:'b',text:'Upgrade the product and close the ticket straight away.',ok:false,why:'An upgrade can silently fail or be rolled back. Without verification you do not know your state.'},
    {id:'c',text:'Ask the vendor for compensation for the three lost weeks.',ok:false,why:'That is a commercial discussion and it does not verify the fix.'},
    {id:'d',text:'File a risk exception with no expiry date at all.',ok:false,why:'You are fixing the flaw, so an exception is not needed at all.'}]}],
 explain:'Third-party and supply chain flaws are still your risk. The pattern is: get the facts in writing, apply the strongest available control while you wait, protect the sensitive data path, and verify the fix with evidence before closing.',
 focus:'Learn the third-party risk response: written facts, compensating control, data protection, verified closure.',
 hint1:'You cannot fix what the vendor has not released, so you reduce the risk and you watch.',
 hint2:'The last step in every vulnerability ticket is proof, not hope.'},

/* ---------------- M25 ---------------- */
{
 id:'M25', elements:3, theme:'Scanning, Testing & Attack Surface', type:'multi', title:'What a false negative really means',
 context:'After a real incident on a host that had been scanned twice that month, the CISO asks the team whether the scanner can be trusted. Your team lead asks you to select every statement that is true about false negatives.',
 prompt:'Select all statements that are true. There is more than one correct answer.',
 options:[
  'A false negative means the scanner missed a real weakness.',
  'A false negative usually means the asset is safe to leave alone.',
  'An unauthenticated scan can hide weaknesses on the host.',
  'A false negative makes every coverage metric look better.',
  'A false negative can be removed by deleting the finding.'],
 correct:[
  'A false negative means the scanner missed a real weakness.',
  'An unauthenticated scan can hide weaknesses on the host.',
  'A false negative makes every coverage metric look better.'],
 explain:'A false negative is a real weakness that the scan did not report. It is the most dangerous type of error because it creates false confidence: the dashboard is green while the flaw is wide open. Unauthenticated scans cause many false negatives, because without a login the scanner cannot read the installed software. Deleting a finding changes the report, not the host, and "the asset is safe" is exactly the wrong conclusion.',
 focus:'Remember the direction of the two errors: a false positive wastes your time, a false negative costs you the breach.',
 hint1:'Three statements are true. Two are comfortable lies.',
 hint2:'Coverage metrics and scanning depth both connect to missed findings.'},

/* ---------------- M26 ---------------- */
{
 id:'M26', elements:4, theme:'Governance, Risk & Compliance', type:'fill', title:'Write the compensating control for the MRI workstation',
 context:'The MRI control workstation runs an operating system the vendor no longer supports. There is no patch path at all. The change board approves a compensating control, and you must write the sentence into the risk register.',
 prompt:'Complete the four gaps in the risk register entry for the MRI workstation.',
 sentence:'We cannot patch the MRI workstation because the vendor does not support the new release. To reduce the risk we put the device on its own network ______, allow only the ______ and ports the scanner needs, watch its traffic in the ______, and review the risk ______ every 90 days.',
 blanks:['segment','protocols','SIEM','exception'],
 bank:['backup','segment','hash','vendor','SIEM','protocols','exception','cloud'],
 explain:'The control has four parts and each one reduces the risk in a different way. A separate network segment removes the easy path from the workstation to the rest of the hospital. An allow-list of protocols and ports means only the traffic the device truly needs can flow. Central logging in the SIEM gives you detection, because an isolated system is only safe if you can still see it. And the exception must be reviewed, or the control quietly rots.',
 focus:'Learn the anatomy of a compensating control: isolate, restrict, monitor, review.',
 hint1:'One blank is a network place, one is a technical detail of traffic, one is a monitoring platform, one is a paperwork item.',
 hint2:'Restricting traffic means naming the protocols and ports that are allowed.'},

/* ---------------- M27 ---------------- */
{
 id:'M27', elements:8, theme:'Scanning, Testing & Attack Surface', type:'dnd', title:'Which change really shrinks the attack surface?',
 context:'The infrastructure team proposes eight changes for next quarter. The attack surface management review asked for the attack surface to shrink, so you must separate the changes that remove an entry point from the changes that only improve your view.',
 prompt:'Sort each change into the correct box.',
 zones:[{id:'red',label:'Reduces the attack surface'},{id:'no',label:'Does not reduce the attack surface'}],
 items:[
  {id:'i1',text:'Close the unused RDP port on the jump host',zone:'red'},
  {id:'i2',text:'Install an endpoint detection agent on every laptop',zone:'no'},
  {id:'i3',text:'Remove the sample application from the web server',zone:'red'},
  {id:'i4',text:'Create a second firewall administrator account',zone:'no'},
  {id:'i5',text:'Disable the guest SMB share on all file servers',zone:'red'},
  {id:'i6',text:'Turn on full packet capture at the core switch',zone:'no'},
  {id:'i7',text:'Retire the unused server and remove its DNS record',zone:'red'},
  {id:'i8',text:'Raise the minimum password length from 8 to 14',zone:'no'}],
 explain:'The attack surface is the set of ways an attacker can get in: open ports, running services, sample code, shares, forgotten hosts. Closing a port, deleting a sample app, disabling a share or retiring a server removes an entry point. Detection agents, extra admin accounts, packet capture and longer passwords do not remove entries; they improve visibility or make abuse harder, which is still useful, but the surface is the same size.',
 focus:'Learn the definition of attack surface as entry points, and learn that detection is not reduction.',
 hint1:'Ask "can an attacker still reach something new here?" Four of these leave the entry points unchanged.',
 hint2:'Anything that starts with "install", "turn on" or "create" rarely removes an entry point.'},

/* ---------------- M28 ---------------- */
{
 id:'M28', elements:6, theme:'Leadership & Communication', type:'match', title:'Who owns which decision?',
 context:'A finding on the billing system needs four different people. The new analyst asks you who does what, because last time the ticket sat for two weeks with nobody responsible.',
 prompt:'Match each role to the action it owns.',
 zones:[
  {id:'d1',label:'Owns the risk of the asset and signs the exception'},
  {id:'d2',label:'Runs the programme, tracks the deadline and reports it'},
  {id:'d3',label:'Applies the patch on the server during the window'},
  {id:'d4',label:'Reviews the contract and the notification duties'},
  {id:'d5',label:'Approves the security strategy and accepts risk to the business'},
  {id:'d6',label:'Checks the vendor contract, the security schedule and the right to audit'}],
 items:[
  {id:'t1',text:'Asset owner',zone:'d1'},
  {id:'t2',text:'Vulnerability manager',zone:'d2'},
  {id:'t3',text:'System administrator',zone:'d3'},
  {id:'t4',text:'Legal counsel',zone:'d4'},
  {id:'t5',text:'CISO',zone:'d5'},
  {id:'t6',text:'Third-party risk manager',zone:'d6'}],
 explain:'The asset owner is accountable for the business system and signs exceptions, because they own the consequence; this is the risk owner role. The vulnerability manager runs the process, chases deadlines and produces the numbers. The system administrator does the hands-on work in the maintenance window. Legal counsel reads contracts, notification duties and disclosure questions, while the third-party risk manager owns the vendor relationship: the security schedule, the right to audit and the contract clauses you rely on when a vendor is slow. The CISO sets the strategy and carries the enterprise risk to the board.',
 focus:'Learn the difference between being accountable for a risk and doing the technical work.',
 hint1:'One role touches the server, one role touches the contract, one role runs the process.',
 hint2:'The person who signs an exception owns the risk, not the person who applies the fix.'},

/* ---------------- M29 ---------------- */
{
 id:'M29', elements:1, theme:'Governance, Risk & Compliance', type:'hotspot', title:'Draft vulnerability disclosure policy',
 context:'Northwind Health wants researchers to report flaws in its public portal. The legal team drafted a policy and asks you to review it before it is published.',
 prompt:'Click the single line that should be changed before publication.',
 lines:[
  'Northwind Vulnerability Disclosure Policy (draft 0.9)',
  '1  In scope: any Northwind website reachable from the public internet',
  '2  Report to: security@northwind.example (monitored 24x7)',
  '3  We aim to acknowledge every report within 5 business days',
  '4  Researchers must not access, copy or modify patient data',
  '5  Testing production systems during business hours is allowed if it is quick',
  '6  Northwind will not take legal action against researchers who follow this policy',
  '7  We will credit the reporter when the fix is released'],
 answerLine:4,
 explain:'A disclosure policy must keep testing predictable and safe. Allowing unannounced testing of production systems during business hours risks outages, corrupted data and noisy alerts, and it removes your ability to correlate the activity with change records. Real policies ask researchers to test a staging environment, or to agree a time window, and they set rate limits. The safe harbour line, the acknowledgement promise and the credit line are all good practice.',
 focus:'Learn that a good disclosure policy protects the business as well as the researcher: scope, safe harbour, no patient data, agreed windows.',
 hint1:'Look for the line that gives researchers freedom in a place where an accident hits patients.',
 hint2:'Testing production at busy times is the problem, not the reward for reporting.'},

/* ---------------- M30 ---------------- */
{
 id:'M30', elements:10, theme:'Leadership & Communication', type:'dnd', title:'Two kinds of work in one team',
 context:'You are the new vulnerability management lead. Your team has five analysts and a limited budget. You must sort the work items so that each one is owned by the right activity.',
 prompt:'Sort each work item into the correct box.',
 zones:[{id:'lead',label:'Leadership and communication'},{id:'ops',label:'Vulnerability management operations'}],
 items:[
  {id:'i1',text:'Agree a two-year vision and goals with the team',zone:'lead'},
  {id:'i2',text:'Define the patch SLA for each severity level',zone:'ops'},
  {id:'i3',text:'Present the quarterly risk picture to the board',zone:'lead'},
  {id:'i4',text:'Run the weekly authenticated scan and triage the results',zone:'ops'},
  {id:'i5',text:'Coach a junior analyst through their first incident',zone:'lead'},
  {id:'i6',text:'Record a risk exception with an expiry date',zone:'ops'},
  {id:'i7',text:'Negotiate the maintenance window with the business',zone:'lead'},
  {id:'i8',text:'Sign the rules of engagement with the test provider',zone:'ops'},
  {id:'i9',text:'Choose the three metrics for the monthly report',zone:'lead'},
  {id:'i10',text:'Verify a closed finding with a rescan',zone:'ops'}],
 explain:'A vulnerability management lead does two jobs. The operational job runs the machine: scanning, prioritising, exceptions, engagements and verification. The leadership job builds the conditions for that work: a vision, coaching, metrics that mean something, negotiation with the business about windows, and clear reporting upward. Confusing the two is why many programmes drown in tickets and never change anything.',
 focus:'Learn to recognise the leadership half of the job: vision, people, negotiation, reporting and metrics.',
 hint1:'Five items involve another human being or the direction of the team. The other five are process steps.',
 hint2:'Anything you could put in a runbook is operational. Anything that needs a conversation is leadership.'},

/* ---------------- M31 ---------------- */
{
 id:'M31', elements:6, theme:'Scanning, Testing & Attack Surface', type:'match', title:'Which tool for which job?',
 context:'The team is choosing tools for next year. Your manager hands you a list of jobs and a list of tools and asks you to justify each purchase.',
 prompt:'Match each tool to the job it does best.',
 zones:[
  {id:'d1',label:'Commercial scanner commonly run from a laptop or a server'},
  {id:'d2',label:'Open-source scanner maintained by the Greenbone project'},
  {id:'d3',label:'Cloud platform that uses lightweight agents on the assets'},
  {id:'d4',label:'Framework used to build and launch exploit code'},
  {id:'d5',label:'Intercepting proxy used for testing web applications'},
  {id:'d6',label:'Graph tool that maps attack paths in Active Directory'}],
 items:[
  {id:'t1',text:'Nessus',zone:'d1'},
  {id:'t2',text:'OpenVAS',zone:'d2'},
  {id:'t3',text:'Qualys',zone:'d3'},
  {id:'t4',text:'Metasploit',zone:'d4'},
  {id:'t5',text:'Burp Suite',zone:'d5'},
  {id:'t6',text:'BloodHound',zone:'d6'}],
 explain:'All six tools touch vulnerabilities but in different ways. Nessus and OpenVAS scan hosts for known flaws, one commercial and one open source. Qualys is a cloud platform that often uses agents so assets report their own state. Metasploit builds and launches exploit code, which is why it belongs to a controlled test and needs a rules of engagement. Burp Suite sits between your browser and a web app so you can see and change every request. BloodHound collects directory data and draws the shortest path an attacker could take to become a domain administrator.',
 focus:'Know which tools scan, which tools exploit, and which tools test web applications or directory paths.',
 hint1:'Two of these are vulnerability scanners, but only one is open source.',
 hint2:'The tool that draws graphs is about directory attack paths, not about patches.'},

/* ---------------- M32 ---------------- */
{
 id:'M32', elements:2, theme:'Governance, Risk & Compliance', type:'dual', title:'A researcher reports a flaw in your portal',
 context:'A security researcher emails your team: they found a serious flaw in the patient portal. They tested it on a test account they created themselves. They have not published anything yet. Answer the situation from both sides.',
 prompt:'Choose one answer in each part.',
 parts:[
  {label:'BLUE TEAM — what is the right first response to the report?',
   correct:'Acknowledge it, open a private ticket, reproduce it, and agree a disclosure timeline.',
   options:[
    'Acknowledge it, open a private ticket, reproduce it, and agree a disclosure timeline.',
    'Ask the researcher to publish the full details to speed up the internal fix.',
    'Ignore it, because the researcher used a test account and took no real data.',
    'Send a legal warning, because the researcher tested without written permission.']},
  {label:'RED TEAM PERSPECTIVE — what makes a report genuinely useful to the vendor?',
   correct:'Clear steps to reproduce, the impact, and a private contact.',
   options:[
    'Clear steps to reproduce, the impact, and a private contact.',
    'A payment demand within 24 hours before any technical detail.',
    'A copy of live customer records proving the flaw is serious.',
    'A public post with the exploit first, before the vendor can hide it.']}],
 explain:'A vulnerability disclosure programme turns an unknown report into a controlled process. The blue team acknowledges, keeps the details private, reproduces the flaw and agrees when the fix will be public. The researcher\'s part is to make the flaw reproducible and to keep the details private until the fix ships. Demands for money, copies of real patient data and public exploits all turn a helpful report into an incident.',
 focus:'Learn the responsible disclosure path: private report, acknowledgement, reproduction, agreed timeline, public credit after the fix.',
 hint1:'Blue: keep it private and reproducible. Red: the best reports are clear and safe to act on.',
 hint2:'Publishing first and asking later is what responsible disclosure is designed to avoid.'},

/* ---------------- M33 ---------------- */
{
 id:'M33', elements:6, theme:'Vulnerability Management Fundamentals', type:'match', title:'The build nobody is supposed to change',
 context:'The platform team rebuilds the web tier from the image security approved last year. Hardening was done once, on that image: unnecessary services were removed and only the functions the service needs were enabled. Since then two engineers installed tools by hand, and a marketing team runs a server that nobody in IT has recorded — classic shadow IT. A payroll application is a legacy system that runs on end-of-life software: the vendor stopped supporting the operating system in 2022. You must explain the terms the review keeps using.',
 prompt:'Match each term to the correct meaning.',
 zones:[
  {id:'d1',label:'The documented approved settings that every server of this type must match'},
  {id:'d2',label:'A published set of secure configuration rules covering many products'},
  {id:'d3',label:'A secure configuration guide published by a government defence agency'},
  {id:'d4',label:'The slow movement of a server away from its approved settings'},
  {id:'d5',label:'The clean master image used to rebuild a server'},
  {id:'d6',label:'The principle that a service runs only the functions it needs'}],
 items:[
  {id:'t1',text:'Configuration baseline',zone:'d1'},
  {id:'t2',text:'CIS Benchmarks',zone:'d2'},
  {id:'t3',text:'STIG',zone:'d3'},
  {id:'t4',text:'Configuration drift',zone:'d4'},
  {id:'t5',text:'Golden image',zone:'d5'},
  {id:'t6',text:'Least functionality',zone:'d6'}],
 explain:'A configuration baseline is your own approved set of settings. CIS Benchmarks are a widely used published catalogue of secure settings, and a STIG is the equivalent published by a government defence agency. Configuration drift is what happens when people change a machine by hand until it no longer matches the baseline, which is exactly what the two engineers caused. The golden image is the trusted master used to rebuild, and least functionality means every service runs only what it needs, which is the idea behind removing unnecessary parts during hardening. Shadow IT and a legacy end-of-life system both fall outside this control completely, which is why an inventory matters.',
 focus:'Learn the difference between a baseline you own, a published benchmark you borrow, and drift that erodes both.',
 hint1:'Two of these are published catalogues from outside your company; one of those comes from a defence agency.',
 hint2:'Drift is a change over time. Least functionality is a design rule.'},

/* ---------------- M34 ---------------- */
{
 id:'M34', elements:6, theme:'Scanning, Testing & Attack Surface', type:'match', title:'Six ways to look at one server',
 context:'The scan team is asked why the same server produces different results on different days. The answer is that six different scan modes are in use, and each one sees a different part of the truth. Your job is to name each mode correctly so the reports can be labelled. Remember that a scan without valid scan credentials becomes an unauthenticated scan, which is also why vulnerability validation by hand is still needed before a finding is closed as a false positive.',
 prompt:'Match each scan mode to the correct description.',
 zones:[
  {id:'d1',label:'Software on the asset reports its own patch level to a server'},
  {id:'d2',label:'The scanner reaches the asset over the network with nothing installed on it'},
  {id:'d3',label:'The scan starts from inside the corporate network'},
  {id:'d4',label:'The scan starts from the internet, as an outsider would see you'},
  {id:'d5',label:'The scanner logs in as a user, so it can read installed software'},
  {id:'d6',label:'The scanner sees only what the network exposes to it'}],
 items:[
  {id:'t1',text:'Agent-based scan',zone:'d1'},
  {id:'t2',text:'Agentless scan',zone:'d2'},
  {id:'t3',text:'Internal scan',zone:'d3'},
  {id:'t4',text:'External scan',zone:'d4'},
  {id:'t5',text:'Credentialed scan',zone:'d5'},
  {id:'t6',text:'Uncredentialed scan',zone:'d6'}],
 explain:'An agent-based scan puts small software on the asset, which then reports upwards, so it still works when the asset is off the corporate network. An agentless scan reaches the asset over the network and installs nothing, which is why a host firewall can block it. Internal and external describe where the scan starts: inside the network or from the internet. Credentialed and uncredentialed describe whether the scanner can log in. Only a credentialed scan can read the installed software list, so an uncredentialed scan misses most missing-patch findings and produces false negatives.',
 focus:'Learn the two axes: where the scan starts, and whether it can log in. The login decides how deep the result goes.',
 hint1:'Two of these describe where the scan runs from, two describe how it talks to the asset, two describe whether it logs in.',
 hint2:'The mode with software on the asset is the one that still works when the laptop is at home.'},

/* ---------------- M35 ---------------- */
{
 id:'M35', elements:6, theme:'Scanning, Testing & Attack Surface', type:'dnd', title:'How much does the tester know?',
 context:'Northwind buys three tests this year. The scoping document and the rules of engagement are already signed for each one, and each test must end with a proof of exploitation, not just a list of findings. The only difference between the three engagements is how much information the testers receive at the start.',
 prompt:'Place each statement in the correct box.',
 zones:[{id:'bb',label:'Black box'},{id:'wb',label:'White box'},{id:'gb',label:'Gray box'}],
 items:[
  {id:'i1',text:'The tester starts with nothing but the company name and a public web address',zone:'bb'},
  {id:'i2',text:'The tester is given the source code and an administrator account',zone:'wb'},
  {id:'i3',text:'The tester receives one low-privilege account and part of the documentation',zone:'gb'},
  {id:'i4',text:'The tester must discover the internal network from the outside',zone:'bb'},
  {id:'i5',text:'The tester can read the architecture diagrams but receives no credentials',zone:'gb'},
  {id:'i6',text:'The tester reviews the code side by side with the developers',zone:'wb'}],
 explain:'A black box test copies what a real outsider sees, so it takes the longest and finds the fewest issues but proves real reachability. A white box test gives everything, including code and admin access, so it is the fastest and the most thorough because the tester is not wasting time on discovery. A gray box test sits between the two and is the most common commercial choice: some knowledge, some credentials, realistic conditions. The decisions about which one to buy belong in scoping, and the limits on what the tester may do belong in the rules of engagement.',
 focus:'Learn the trade-off: more information to the tester means more coverage per day, but less realism about what an outsider could reach.',
 hint1:'Two statements give the tester almost nothing or almost everything. The other four sit in between or describe the two extremes.',
 hint2:'Reading code with the developers is the most open engagement; starting from a company name alone is the most closed.'},

/* ---------------- M36 ---------------- */
{
 id:'M36', elements:5, theme:'Governance, Risk & Compliance', type:'fill', title:'Writing the disclosure programme page',
 context:'Northwind is publishing its external-facing page for security researchers. Responsible disclosure already works informally, but the CISO wants it written down so that researchers trust the process.',
 prompt:'Complete the five gaps on the disclosure policy page.',
 sentence:'We run a ______, so any researcher may report a flaw in our portal and receive a reward. The ______ explains what is in scope for testing and how to contact the security team. Our ______ statement means we will not take legal action against a researcher who follows those rules. We will not pay for a report that contains no ______, because a written description alone does not prove the flaw is real. When we rate the risk we also look at ______, which is how mature and usable the public exploit code has become.',
 blanks:['bug bounty','vulnerability disclosure program','safe harbour','proof of exploitation','exploit code maturity'],
 bank:['safe harbour','proof of exploitation','patch Tuesday','bug bounty','exploit code maturity','vulnerability disclosure program','penetration test','risk appetite'],
 explain:'A bug bounty is the reward scheme. The vulnerability disclosure program is the wider policy that says what may be tested and how to report it. The safe harbour statement is the promise that a researcher who follows the rules will not be sued, which is what makes people report instead of selling. A proof of exploitation is the working evidence that lets your team reproduce the flaw — many teams call it a PoC — and exploit code maturity describes how reliable the public exploit code already is, which changes how fast you must act.',
 focus:'Learn the four parts of a disclosure programme: reward, published rules, safe harbour, and real evidence of exploitation.',
 hint1:'One blank is the whole policy, one is the reward scheme inside it, one is a legal promise, one is technical proof.',
 hint2:'The last blank is about how usable the public exploit code is, not about how severe the flaw is.'},

/* ---------------- M37 ---------------- */
{
 id:'M37', elements:16, theme:'Leadership & Communication', type:'dnd', title:'Two kinds of work on one whiteboard',
 context:'You are the new head of security. The CISO asks you to sort next quarter\'s whiteboard into two piles: work that reports upward to the business, and work that leads the team. Your wider strategy for the year, the goal setting you agreed with the CISO, the stakeholder management plan, the security awareness course and the ethics code review all sit behind these items.',
 prompt:'Sort each work item into the correct box.',
 zones:[{id:'biz',label:'Reporting to the business'},{id:'team',label:'Leading the team'}],
 items:[
  {id:'i1',text:'Prepare the quarterly board reporting pack',zone:'biz'},
  {id:'i2',text:'Write a one-page executive brief on the VPN finding',zone:'biz'},
  {id:'i3',text:'Build the business case for the new scanning platform',zone:'biz'},
  {id:'i4',text:'Show the ROI of the patching programme in avoided downtime',zone:'biz'},
  {id:'i5',text:'Write the budget justification for two more analysts',zone:'biz'},
  {id:'i6',text:'Agree the KPI for patch compliance with the CISO',zone:'biz'},
  {id:'i7',text:'Choose the KRI that will warn us before an SLA is broken',zone:'biz'},
  {id:'i8',text:'Produce the monthly metrics reporting one-pager',zone:'biz'},
  {id:'i9',text:'Write down the three-year vision for the security team',zone:'team'},
  {id:'i10',text:'Rewrite the mission statement so it means something',zone:'team'},
  {id:'i11',text:'Set the goal setting cycle for each analyst',zone:'team'},
  {id:'i12',text:'Publish the security roadmap for the next four quarters',zone:'team'},
  {id:'i13',text:'Start a mentoring pair for the newest analyst',zone:'team'},
  {id:'i14',text:'Practise delegation instead of doing every triage yourself',zone:'team'},
  {id:'i15',text:'Run an incident command exercise for the whole team',zone:'team'},
  {id:'i16',text:'Review how the team talks about security culture',zone:'team'}],
 explain:'The business side is about turning security into decisions other people can make: board reporting, an executive brief, a business case with ROI, a budget justification, and metrics reporting built on a KPI and a KRI. The team side is about building people and direction: vision, mission, goal setting, the security roadmap, mentoring, delegation, incident command and security culture. Strategy is the bridge between the two, risk communication and non-technical communication are the skills that carry the business half, stakeholder management is the discipline of keeping the people who care informed, and team development is the wider programme that mentoring sits inside. Decision making under pressure is what incident command demands, and ethics is what makes any of it trustworthy.',
 focus:'Learn that the leadership half of security work is reporting upward in business language and building the team downward.',
 hint1:'Eight items end in a document or a number for somebody outside the team. Eight items change how the team works.',
 hint2:'A business case and a roadmap look similar but one asks for money and the other sets direction.'},

/* ---------------- M38 ---------------- */
{
 id:'M38', elements:6, theme:'Governance, Risk & Compliance', type:'match', title:'The auditor\'s request list',
 context:'The internal auditor sends her request list before the annual review. She wants to see how the vulnerability programme fits the governance structure, and she is explicit that she will check the security policy, the service level agreement with the scanning vendor, the MOU with the shared service centre and the NDA signed by the test team.',
 art:{kind:'text',title:'auditor request list',body:'<ul style="margin:6px 0 0 18px"><li>Show me the risk register and the risk heat map for the last two quarters.</li><li>Show me your due care and your due diligence for the top five findings.</li><li>Show me how data classification decides which assets are scanned weekly.</li><li>Show me the audit trail of who changed each affected server.</li><li>Show me the regulatory reporting log, including the 72-hour breach notification duty for EU personal data.</li><li>Show me your vendor management file and the supply chain risk assessment for the scanning platform.</li></ul>'},
 prompt:'Match each governance term to the correct meaning.',
 zones:[
  {id:'d1',label:'The list of every accepted risk, with an owner and a review date'},
