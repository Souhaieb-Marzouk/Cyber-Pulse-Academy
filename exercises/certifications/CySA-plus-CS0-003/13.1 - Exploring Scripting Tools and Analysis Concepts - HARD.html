/* ---------- chips into bins (dragdrop + match) ---------- */
function chipsBins(area,ex,match){
  var itemIdx=shuf(ex.items.map(function(x,i){return i;}));
  var state=ex.items.map(function(){return -1;});
  var sel=-1;
  var pool=el('div','pool');
  var binsWrap=el('div','bins');
  area.appendChild(el('p','ansnote',match?'Each target takes one item.':'Bins can take several items.'));
  area.appendChild(pool);area.appendChild(binsWrap);
  var binEls=[];
  ex.bins.forEach(function(bn,bi){
    var b=el('div','bin');
    b.appendChild(el('h4',null,esc(bn)));
    var dz=el('div','dropzone');
    var btn=el('button','binbtn');
    btn.type='button';btn.setAttribute('aria-label','Place the selected item into '+bn);
    btn.appendChild(dz);
    b.appendChild(btn);
    binsWrap.appendChild(b);binEls.push({b:b,dz:dz,btn:btn,bi:bi});
  });
  function redraw(){
    pool.innerHTML='';binEls.forEach(function(be){be.dz.innerHTML='';be.b.classList.remove('over');});
    itemIdx.forEach(function(ii){
      var it=ex.items[ii];var target=state[ii];
      var chip=el('button','chip'+(sel===ii?' sel':''),esc(it.t));
      chip.type='button';
      chip.setAttribute('aria-pressed',sel===ii?'true':'false');
      chip.setAttribute('aria-label',it.t+(target>=0?' (placed in '+ex.bins[target]+')':' (in pool)'));
      if(target>=0)chip.classList.add(it.__m);
      chip.addEventListener('click',function(ev){
        ev.stopPropagation();
        if(target>=0){state[ii]=-1;it.__m=null;sel=-1;redraw();}
        else{sel=(sel===ii?-1:ii);redraw();}
      });
      chip.draggable=true;
      chip.addEventListener('dragstart',function(ev){try{ev.dataTransfer.setData('text/plain',String(ii));}catch(e){}sel=ii;});
      if(target>=0){
        binEls[target].dz.appendChild(chip);
        var rm=el('button','unplace','\u00d7');
        rm.type='button';rm.setAttribute('aria-label','Move '+it.t+' back to the pool');
        rm.addEventListener('click',function(ev){ev.stopPropagation();state[ii]=-1;it.__m=null;redraw();});
        binEls[target].dz.appendChild(rm);
      }else{
        if(it.__m)chip.classList.add(it.__m);
        pool.appendChild(chip);
      }
    });
    binEls.forEach(function(be){
      be.btn.addEventListener('click',function(){
        if(sel>=0){
          if(match){for(var k=0;k<state.length;k++){if(state[k]===be.bi&&k!==sel)state[k]=-1;}}
          state[sel]=be.bi;sel=-1;redraw();
        }
      });
      be.b.addEventListener('dragover',function(ev){ev.preventDefault();be.b.classList.add('over');});
      be.b.addEventListener('dragleave',function(){be.b.classList.remove('over');});
      be.b.addEventListener('drop',function(ev){
        ev.preventDefault();be.b.classList.remove('over');
        var ii=parseInt(ev.dataTransfer.getData('text/plain'),10);
        if(isNaN(ii))return;
        if(match){for(var k=0;k<state.length;k++){if(state[k]===be.bi&&k!==ii)state[k]=-1;}}
        state[ii]=be.bi;sel=-1;redraw();
      });
    });
  }
  redraw();
  return {
    live:function(){return {p:state.slice()};},
    restore:function(s){if(s&&s.p){state=s.p.slice();sel=-1;redraw();}},
    grade:function(){
      var earned=0,tips=[],aSum=[],cSum=[];
      ex.items.forEach(function(it,ii){
        var placed=state[ii];
        var good=(placed===it.bin);
        it.__m=good?'m-ok':(placed>=0?'m-bad':'m-warn');
        if(good)earned+=1/ex.items.length;
        else if(it.fb)tips.push(plain(it.t,40)+': '+plain(it.fb,140));
        aSum.push(plain(it.t,40)+' \u2192 '+(placed>=0?ex.bins[placed]:'(not placed)'));
        cSum.push(plain(it.t,40)+' \u2192 '+ex.bins[it.bin]);
      });
      sel=-1;redraw();
      return {earned:earned,answerSummary:aSum.join(' \u00b7 '),correctSummary:cSum.join(' \u00b7 '),tips:tips};
    },
    clearMarks:function(){
      $all('.chip',area).forEach(function(c){c.classList.remove('m-ok','m-bad','m-warn');});
      ex.items.forEach(function(it){it.__m=null;});
    }
  };
}
RENDER.dragdrop=function(area,ex){return chipsBins(area,ex,false);};
RENDER.match=function(area,ex){return chipsBins(area,ex,true);};
/* ---------- fill ---------- */
RENDER.fill=function(area,ex){
  var bank=shuf(ex.bank.slice());
  var sel=null;
  var slotWords=ex.slots.map(function(){return null;});
  var slotEls=[],bankEls={};
  var bankBox=el('div','bank');
  bankBox.setAttribute('role','listbox');bankBox.setAttribute('aria-label','Word bank');
  bank.forEach(function(w){
    var chip=el('button','chip',esc(w));
    chip.type='button';chip.setAttribute('aria-label','Word: '+w);
    chip.addEventListener('click',function(){sel=(sel===w?null:w);paint();});
    bankEls[w]=chip;bankBox.appendChild(chip);
  });
  area.appendChild(el('p','ansnote','Click a word from the bank, then click a blank. Click a filled blank to put the word back.'));
  area.appendChild(bankBox);
  var parts=String(ex.text).split(/\{\{(\d+)\}\}/);
  var line=el('div','slotline');
  parts.forEach(function(p,i){
    if(i%2===1){
      var si=parseInt(p,10);
      var s=el('button','slot','\u00a0');
      s.type='button';s.setAttribute('aria-label','Blank '+(si+1));
      s.addEventListener('click',function(){
        if(slotWords[si]!=null&&sel==null){slotWords[si]=null;paint();return;}
        if(sel==null)return;
        slotWords[si]=sel;sel=null;paint();
      });
      slotEls[si]=s;line.appendChild(s);
    }else{
      line.appendChild(document.createTextNode(p));
    }
  });
  area.appendChild(line);
  function paint(){
    slotEls.forEach(function(s,si){
      var w=slotWords[si];
      s.textContent=w!=null?w:'\u00a0';
      s.classList.toggle('filled',w!=null);
    });
    bank.forEach(function(w){
      var used=(slotWords.indexOf(w)>=0);
      bankEls[w].disabled=used;
      bankEls[w].classList.toggle('sel',sel===w);
      bankEls[w].setAttribute('aria-pressed',sel===w?'true':'false');
    });
  }
  paint();
  return {
    live:function(){return {w:slotWords.slice()};},
    restore:function(s){if(s&&s.w){slotWords=s.w.slice();sel=null;paint();}},
    grade:function(){
      var earned=0,tips=[],aSum=[],cSum=[];
      ex.slots.forEach(function(cor,si){
        var w=slotWords[si];
        var got=(w!=null)&&String(w).toLowerCase().trim()===String(cor).toLowerCase().trim();
        var s=slotEls[si];
        s.classList.remove('m-ok','m-bad','m-warn');
        if(got){s.classList.add('m-ok');earned+=1/ex.slots.length;}
        else if(w!=null){s.classList.add('m-bad');tips.push('Blank '+(si+1)+': the right word is "'+cor+'".');}
        else{s.classList.add('m-warn');tips.push('Blank '+(si+1)+' was empty \u2014 the right word is "'+cor+'".');}
        aSum.push('Blank '+(si+1)+': '+(w!=null?w:'(empty)'));
        cSum.push('Blank '+(si+1)+': '+cor);
      });
      return {earned:earned,answerSummary:aSum.join(' \u00b7 '),correctSummary:cSum.join(' \u00b7 '),tips:tips};
    },
    clearMarks:function(){slotEls.forEach(function(s){s.classList.remove('m-ok','m-bad','m-warn');});}
  };
};
/* ---------- order / rank ---------- */
function reorder(area,ex){
  var cur=shuf(ex.items.map(function(t,i){return {t:t,i:i};}));
  var list=el('ul','relist');
  area.appendChild(el('p','ansnote','Drag with the handle \u21c5 or use the \u25b2/\u25bc buttons.'));
  area.appendChild(list);
  function redraw(){
    list.innerHTML='';
    cur.forEach(function(it,pos){
      var li=el('li','reitem');
      li.draggable=true;
      li.appendChild(el('span','grab','\u21c5'));
      li.appendChild(el('span','pos',String(pos+1)));
      li.appendChild(el('span','rtxt',esc(it.t)));
      var up=el('button','mv','\u25b2');up.type='button';up.setAttribute('aria-label','Move item '+(pos+1)+' up');
      var dn=el('button','mv','\u25bc');dn.type='button';dn.setAttribute('aria-label','Move item '+(pos+1)+' down');
      up.addEventListener('click',function(){if(pos>0){var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;redraw();}});
      dn.addEventListener('click',function(){if(pos<cur.length-1){var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;redraw();}});
      li.appendChild(up);li.appendChild(dn);
      li.addEventListener('dragstart',function(ev){dragging=pos;li.classList.add('dragging');try{ev.dataTransfer.setData('text/plain','x');}catch(e){}});
      li.addEventListener('dragend',function(){li.classList.remove('dragging');dragging=-1;});
      li.addEventListener('dragover',function(ev){
        ev.preventDefault();
        if(dragging<0||dragging===pos)return;
        var moved=cur.splice(dragging,1)[0];
        cur.splice(pos,0,moved);
        dragging=pos;redraw();
      });
      list.appendChild(li);
      li.__i=it.i;
    });
  }
  var dragging=-1;
  redraw();
  return {
    live:function(){return {o:cur.map(function(it){return it.i;})};},
    restore:function(s){
      if(s&&s.o){
        cur=s.o.map(function(i){return {t:ex.items[i],i:i};});
        redraw();
      }
    },
    grade:function(){
      var earned=0,aSum=[],cSum=[];
      var rows=$all('.reitem',list);
      rows.forEach(function(li,pos){
        var good=(li.__i===pos);
        li.classList.remove('m-ok','m-bad');
        li.classList.add(good?'m-ok':'m-bad');
        if(good)earned+=1/ex.items.length;
        aSum.push((pos+1)+'. '+plain(ex.items[li.__i],55));
        cSum.push((pos+1)+'. '+plain(ex.items[pos],55));
      });
      return {earned:earned,answerSummary:aSum.join(' \u00b7 '),correctSummary:cSum.join(' \u00b7 '),tips:[ex.tip||''].filter(Boolean)};
    },
    clearMarks:function(){$all('.reitem',list).forEach(function(li){li.classList.remove('m-ok','m-bad');});}
  };
}
RENDER.order=function(area,ex){return reorder(area,ex);};
RENDER.rank=function(area,ex){return reorder(area,ex);};
/* ---------- spot ---------- */
RENDER.spot=function(area,ex){
  var wrap=el('div','spotwrap');
  var rows=[];
  ex.lines.forEach(function(L,li){
    var d=el('div','spotline');
    d.setAttribute('role','checkbox');d.setAttribute('aria-checked','false');
    d.setAttribute('tabindex','0');
    d.appendChild(el('span','ln',String(li+1)));
    d.appendChild(el('span','code',esc(L.t)));
    var selState={on:false};
    function toggle(){
      selState.on=!selState.on;
      d.classList.toggle('sel',selState.on);
      d.setAttribute('aria-checked',selState.on?'true':'false');
    }
    d.addEventListener('click',toggle);
    d.addEventListener('keydown',function(ev){if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();toggle();}});
    wrap.appendChild(d);
    rows.push({d:d,L:L,s:selState});
  });
  area.appendChild(wrap);
  area.appendChild(el('p','ansnote','Click a line to select it. Click again to unselect.'));
  return {
    live:function(){return {s:rows.map(function(r){return r.s.on;})};},
    restore:function(s){if(s&&s.s){rows.forEach(function(r,i){r.s.on=!!s.s[i];r.d.classList.toggle('sel',r.s.on);r.d.setAttribute('aria-checked',r.s.on?'true':'false');});}},
    grade:function(){
      var badTotal=0,found=0,aSum=[],cSum=[],tips=[];
      rows.forEach(function(r){
        var isBad=!!r.L.bad;
        r.d.classList.remove('m-ok','m-bad','m-warn');
        if(isBad){
          badTotal++;
          if(r.s.on){r.d.classList.add('m-ok');found++;}
          else{r.d.classList.add('m-warn');}
        }else if(r.s.on){r.d.classList.add('m-bad');tips.push('Line is fine: '+plain(r.L.why||'this line does not change or break anything.',120));}
      });
      rows.forEach(function(r){
        if(r.L.bad){aSum.push('Line '+plain(r.L.t,45));cSum.push('Line '+plain(r.L.t,45));}
      });
      rows.forEach(function(r){if(r.L.bad&&!r.s.on&&r.L.why)tips.push('Missed: '+plain(r.L.why,140));});
      if(ex.tip)tips.push(ex.tip);
      var earned=badTotal?found/badTotal:0;
      return {earned:earned,answerSummary:found+' of '+badTotal+' bad lines found',correctSummary:cSum.join(' \u00b7 '),tips:tips};
    },
    clearMarks:function(){rows.forEach(function(r){r.d.classList.remove('m-ok','m-bad','m-warn');});}
  };
};
/* ---------- terminal ---------- */
RENDER.terminal=function(area,ex){
  var term=el('div','term');

  hist.appendChild(el('div','tl to','# '+esc(ex.note||'Sandbox shell \u2014 your command is checked when you press Check.')));

  return {

      var v=(inp.value||'').trim();
      hist.appendChild(el('div','tl tp',esc(ex.prompt||'analyst@lab:~$')+' '+esc(v)));
      var tips=[];
      if(!v){
        return {earned:0,answerSummary:'(nothing typed)',correctSummary:ex.canon,tips:['Type a command before pressing Check.']};
      }
      var hit=null;
      for(var i=0;i<ex.accept.length;i++){if(new RegExp(ex.accept[i].re,ex.accept[i].flags!=null?ex.accept[i].flags:'i').test(v)){hit=ex.accept[i];break;}}
      if(hit){
        (hit.out||[]).forEach(function(l){hist.appendChild(el('div','tl to',esc(l)));});
        return {earned:1,answerSummary:v,correctSummary:ex.canon,tips:[]};
      }
      hist.appendChild(el('div','tl to','# not the expected result in this sandbox \u2014 see the explanation.'));
      if(ex.tip)tips.push(ex.tip);
      return {earned:0,answerSummary:v,correctSummary:ex.canon,tips:tips};
    },
    clearMarks:function(){}
  };
};
/* ---------- exam flow ---------- */
function onCheck(){
  if(S.phase!=='run'||!stageApi)return;
  var _bc=$('#btn-check');if(_bc&&_bc.disabled)return;
  var res=stageApi.grade();
  var a=ansOf(S.idx);
  var hintPenalty=a.hint?0.9:1;
  var earned=res.earned*hintPenalty;
  a.committed={live:stageApi.live(),earned:earned,answerSummary:res.answerSummary,correctSummary:res.correctSummary,tips:res.tips,hintUsed:!!a.hint};
  a.status='answered';
  a.label=earned>=0.999?'full':(earned>0?'partial':'zero');
  showExplanation(curEx(),res,a,earned);
  var bCheck=$('#btn-check'),bRev=$('#btn-revise');
  if(bCheck){bCheck.disabled=true;}
  if(bRev){bRev.hidden=false;}
  var bHint=$('#btn-hint');if(bHint){bHint.disabled=true;}
  S.pauseC=true;
  renderPauseState();renderScore();renderNav();renderProgress();
}
function showExplanation(ex,res,a,earned){
  var expl=$('#stage .expl');
  if(!expl)return;
  var h='<span class="lbl lbl-exp">Explanation</span>';
  h+='<p class="scoreline">You earned '+r1(earned)+' / 1 point on this exercise'+(a.hintUsed?' (hint used: \u221210%)':'')+'.</p>';
  h+='<div>'+ex.expl+'</div>';
  if(res.tips&&res.tips.length){
    h+='<p><b>Focus next on:</b></p><ul>';
    res.tips.forEach(function(t){h+='<li>'+esc(t)+'</li>';});
    h+='</ul>';
  }
  expl.innerHTML=h;expl.hidden=false;
}
function onSkip(){
  if(S.phase!=='run')return;
  var a=ansOf(S.idx);
  if(!a.committed){a.status='skipped';}
  goNext();
}
function goNext(){
  if(S.phase!=='run')return;
  S.pauseC=false;
  if(S.idx>=NQ-1){openSubmit();}
  else{showEx(S.idx+1);}
  renderPauseState();
}
function countStates(){
  var answered=0,skipped=0,fresh=0;
  for(var p=0;p<NQ;p++){
    var a=S.ans[S.order[p]];
    if(a&&a.committed)answered++;
    else if(a&&a.status==='skipped')skipped++;
    else fresh++;
  }
  return {answered:answered,skipped:skipped,fresh:fresh};
}
function openSubmit(){
  var st=$('#stage');st.innerHTML='';
  var c=countStates();
  var card=el('div','card intro');
  card.appendChild(el('h2',null,'Ready to submit?'));
  card.appendChild(el('p',null,'Answered (checked): <b>'+c.answered+'</b> \u00b7 Skipped: <b>'+c.skipped+'</b> \u00b7 Never answered: <b>'+c.fresh+'</b>'));
  card.appendChild(el('p',null,'Exercises that are skipped or never answered are <b>excluded from scoring</b>: your percentage is computed only over the exercises you actually answered. The timer keeps running until you submit.'));
  if(c.answered===0){
    var w=el('div','skiplist','<b>\u26a0 You must answer at least one exercise before submitting.</b> Go back, answer an exercise, and press Finish again.');
    card.appendChild(w);
    var back=el('button','btn primary','Go back to the exercises');
    back.addEventListener('click',function(){showEx(S.idx);});
    card.appendChild(back);
  }else{
    var ok=el('button','btn good','Submit exam');
    var no=el('button','btn','Keep working');
    no.addEventListener('click',function(){showEx(S.idx);});
    card.appendChild(ok);card.appendChild(document.createTextNode(' '));card.appendChild(no);
    ok.addEventListener('click',function(){finish(false);});
  }
  st.appendChild(card);
  window.scrollTo(0,0);
}
function finish(auto){
  if(S.phase==='done')return;
  S.phase='done';
  if(S.tid){clearInterval(S.tid);S.tid=null;}
  for(var p=0;p<NQ;p++){
    var a=ansOf(p);
    if(!a.committed){a.status='skipped';}
  }
  renderPauseState();
  renderResults(auto);
}
function computeTotals(){
  var earned=0,total=0;
  for(var i=0;i<EXERCISES.length;i++){
    var a=S.ans[i];
    if(a&&a.committed){earned+=a.committed.earned;total+=1;}
  }
  return {earned:earned,total:total};
}
function reportScore(correct,total,percent,passed){
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,score:correct,total:total,percent:percent,passed:passed},location.origin);
  }catch(e){/* opened directly: nothing to report to */}
}
function renderResults(auto){
  var st=$('#stage');st.innerHTML='';
  var t=computeTotals();
  /* Report the ROUNDED points so the percent the learner sees, the percent
     sent to the site and the score/total triple all agree (spec 6.2 r5-r6). */
  var roundedEarned=Math.round(t.earned);
  var percent=t.total?Math.round(roundedEarned/t.total*100):0;
  var passed=t.total>0&&percent>=passMark;
  var card=el('div','card');
  card.appendChild(el('div','hero','<div class="big">'+percent+'%</div><div>'+r1(t.earned)+' points earned \u00b7 scored over '+t.total+' answered exercise'+(t.total===1?'':'s')+' \u00b7 pass mark '+passMark+'%</div>'+(auto?'<p class="ansnote">Time ran out \u2014 the exam was submitted automatically.</p>':'')));
  if(t.total===0){
    card.appendChild(el('div','skiplist','<b>\u26a0 No exercise was answered, so there is nothing to score and nothing was reported.</b>'));
  }else if(passed){
    card.appendChild(el('div','passpanel','<h2>\u2713 PASS \u2014 well done!</h2><p>You reached the pass mark of '+passMark+'%. Certificate-style credit for <b>'+esc(META.title)+'</b> ('+SEV+'). Review the report below to lock in what you learned.</p>'));
  }else{
    card.appendChild(el('div','failpanel','<h2>\u2717 FAIL \u2014 retake needed</h2><p>You scored '+percent+'%, below the '+passMark+'% pass mark. Read the report below, focus on the tips, then retake the exam.</p>'));
  }
  var skipped=[];
  for(var p=0;p<NQ;p++){var a=S.ans[S.order[p]];if(!a||!a.committed){skipped.push((p+1)+'. '+EXERCISES[S.order[p]].title);}}
  if(skipped.length){
    var sk=el('div','skiplist','<b>\u26a0 '+skipped.length+' exercise(s) were skipped or unfinished and were excluded from scoring:</b><ul style="margin:6px 0 0 18px"><li>'+skipped.map(esc).join('</li><li>')+'</li></ul><p style="margin:6px 0 0">Their explanations are still shown below so you can learn from them.</p>');
    card.appendChild(sk);
  }
  var bt=el('div','btnbar');
  var ret=el('button','btn primary','Retake Exam');ret.id='btn-retake';
  ret.addEventListener('click',function(){S.reported=false;startExam();});
  bt.appendChild(ret);
  card.appendChild(bt);
  st.appendChild(card);
  for(var q=0;q<NQ;q++){
    var idx=S.order[q],ex=EXERCISES[idx],a=S.ans[idx];
    var rc=el('div','repcard');
    var lab=a&&a.committed?a.label:'skipped';
    var tagCls={full:'tag-full',partial:'tag-partial',zero:'tag-zero'}[lab]||'tag-skipped';
    var labWord={full:'full credit',partial:'partial',zero:'zero',skipped:'skipped \u2014 not counted'}[lab];
    rc.appendChild(el('div','rh','<b>'+(q+1)+'. '+esc(ex.title)+'</b><span class="taglab '+tagCls+'">'+labWord+'</span><span class="pt">'+(a&&a.committed?r1(a.committed.earned):'0')+' / 1 pt</span>'));
    var body='<div class="rb"><b>Theme:</b> '+esc(ex.theme)+'</div>';
    if(a&&a.committed){
      body+='<div class="rb"><b>Your answer:</b> '+esc(a.answerSummary)+'</div>';
      body+='<div class="rb"><b>Correct answer:</b> '+esc(a.correctSummary)+'</div>';
    }else{
      body+='<div class="rb"><b>You did not answer this exercise. It was excluded from the score.</b></div>';
      var tmp={};
      var saved=stageApi;stageApi=null;
      tmp=correctSummaryFor(ex);
      stageApi=saved;
      body+='<div class="rb"><b>Correct answer was:</b> '+esc(tmp)+'</div>';
    }
    body+='<div class="rb" style="margin-top:6px"><b>Why:</b> '+ex.expl+'</div>';
    if(a&&a.committed&&a.tips&&a.tips.length){
      body+='<div class="rb"><b>Focus next on:</b> '+a.tips.map(esc).join(' \u00b7 ')+'</div>';
    }
    rc.appendChild(el('div',null,body));
    st.appendChild(rc);
  }
  renderThemeProgress();
  var tp=$('#themeprog');if(tp)tp.open=true;
  if(t.total>0&&!S.reported){
    S.reported=true;
    reportScore(roundedEarned,t.total,percent,passed);
  }
  window.scrollTo(0,0);
}
function correctSummaryFor(ex){
  var out='';
  try{
    var holder=el('div');
    document.body.appendChild(holder);
    var api=RENDER[ex.type](holder,ex);
    var g=null;
    if(ex.type==='qcm'||ex.type==='multi'||ex.type==='logview'){g=sumCorrect(ex);}
    else if(ex.type==='scenario'||ex.type==='branch'){
      g=ex.parts.map(function(p,pi){var okCi=0;p.choices.forEach(function(c,ci){if(c.ok)okCi=ci;});return((ex.type==='branch'?'Step ':'Item ')+(pi+1)+': '+plain(p.choices[okCi].t,60));}).join(' \u00b7 ');
    }
    else if(ex.type==='dragdrop'||ex.type==='match'){g=ex.items.map(function(it){return plain(it.t,40)+' \u2192 '+ex.bins[it.bin];}).join(' \u00b7 ');}
    else if(ex.type==='fill'){g=ex.slots.map(function(s,i){return 'Blank '+(i+1)+': '+s;}).join(' \u00b7 ');}
    else if(ex.type==='order'||ex.type==='rank'){g=ex.items.map(function(s,i){return (i+1)+'. '+plain(s,55);}).join(' \u00b7 ');}
    else if(ex.type==='spot'){g=ex.lines.filter(function(L){return L.bad;}).map(function(L){return 'Line: '+plain(L.t,45);}).join(' \u00b7 ');}
    else if(ex.type==='terminal'){g=ex.canon;}
    holder.remove();
    out=g||'';
  }catch(e){out='';}
  return out;
}
/* ---------- intro ---------- */
var TYPE_NAMES={qcm:'multiple choice',multi:'multi-select',scenario:'SOC alert triage',branch:'branching incident decisions',dragdrop:'drag & drop into bins',match:'matching pairs',fill:'fill-in-the-blank',order:'timeline ordering',rank:'priority ranking',spot:'spot-the-mistake',logview:'log viewer with filter',terminal:'terminal command'};
function renderIntro(){
  S.phase='intro';
  $('#topbar').hidden=true;
  var st=$('#stage');st.innerHTML='';
  var card=el('div','card intro');
  card.appendChild(el('h1',null,esc(META.title)));
  card.appendChild(el('p',null,(S.user?'Welcome back, <b>'+esc(S.user)+'</b>. ':'')+'This is a standalone, certification-style practice exam for <b>CompTIA CySA+ (CS0-003), objective 13.1 \u2014 Exploring Scripting Tools and Analysis Concepts</b>. It feels like real SOC work: you triage alerts, read logs, write commands, and fix broken scripts.'));
  var mg=el('div','metagrid');
  mg.appendChild(el('div','stat','<span class="tb-label">Severity</span><b><span class="sevchip '+SEVCLS+'">'+SEV+'</span></b>'));
  mg.appendChild(el('div','stat','<span class="tb-label">Exercises</span><b>'+NQ+'</b>'));
  mg.appendChild(el('div','stat','<span class="tb-label">Time limit</span><b>'+Math.round(TIMER_TOTAL/60)+' min</b>'));
  mg.appendChild(el('div','stat','<span class="tb-label">Pass mark</span><b>'+passMark+'%</b>'));
  card.appendChild(mg);
  var types={};
  EXERCISES.forEach(function(e){types[e.type]=(types[e.type]||0)+1;});
  var tl=Object.keys(types).map(function(k){return TYPE_NAMES[k]+' \u00d7'+types[k];}).join(', ');
  card.appendChild(el('p',null,'<b>Exercise types in this file:</b> '+esc(tl)+'.'));
  card.appendChild(el('h2',null,'How this exam works'));
  var ul=el('ul');
  ['<b>Check</b> grades your answer: each part turns green (correct), red (wrong) or amber (missed / partial), and the explanation opens. Checking also <b>pauses the timer in review mode</b> \u2014 the content stays visible so you can learn; the timer restarts only when you press <b>Next</b>.',
   '<b>Skip</b> jumps to the next exercise without grading. Skipped exercises are marked amber in the navigator; you can return to them while time remains. At the end they are <b>excluded from scoring</b> (not counted as wrong).',
   'Multi-part exercises earn <b>partial credit</b>: each correct element pays its share, wrong elements do not subtract. Single-answer exercises are all-or-nothing.',
   '<b>Hint (\u221210%)</b> reveals a nudge \u2014 never the answer \u2014 and costs 10% of that exercise\u2019s points.',
   '<b>Pause</b> (manual) freezes the timer but hides the exercise, so you cannot study while paused. The Check-pause and the manual pause are independent and can stack.',
   'You can navigate back to any exercise with the number buttons while time remains, revise, and re-Check. Your last checked answer is the one that counts.',
   'The final report shows, per exercise: your answer, the correct answer, earned points and what to focus on next. If you pass, you get a certificate-style panel; if not, retake with reshuffled questions.'
  ].forEach(function(t){ul.appendChild(el('li',null,t));});
  card.appendChild(ul);
  var kw=el('div','kwpanel');
  kw.appendChild(el('h3',null,'Keywords covered (grouped by theme)'));
  KEYWORDS.forEach(function(th){
    kw.appendChild(el('div','kwtheme','<b>'+esc(th.theme)+':</b> <span class="kws">'+esc(th.items.join(', '))+'</span>'));
  });
  card.appendChild(kw);
  card.appendChild(el('p','ansnote','All indicators in this exam are defanged (for example 10[.]0[.]0[.]1 and hxxp://) \u2014 a safe, professional reporting habit.'));
  var start=el('button','btn primary','Start the exam');
  start.id='btn-start';
  start.addEventListener('click',function(){startExam();});
  var center=el('div','center');center.appendChild(start);
  card.appendChild(center);
  st.appendChild(card);
  window.scrollTo(0,0);
}
function startExam(){
  S.phase='run';S.order=shuf(EXERCISES.map(function(e,i){return i;}));
  S.idx=0;S.ans={};S.remaining=TIMER_TOTAL;S.pauseM=false;S.pauseC=false;S.reported=false;
  $('#topbar').hidden=false;
  $('#subline').textContent='Objective '+META.chapter+' \u00b7 '+SEV+' \u00b7 pass mark '+passMark+'% \u00b7 '+NQ+' exercises';
  renderTimer();renderScore();renderProgress();
  showEx(0);
  startTimer();
}
/* ---------- handshake ---------- */
window.addEventListener('message',function(event){
  var d=event.data;
  if(!d)return;
  if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
  if(d.username){S.user=d.username;var g=$('#stage h1');if(g&&S.phase==='intro'){g.innerHTML=esc(META.title);}}
});
/* ---------- boot ---------- */
(function(){
  $('#btn-pause').addEventListener('click',function(){
    if(S.phase!=='run')return;
    S.pauseM=!S.pauseM;
    renderPauseState();
  });
  renderIntro();
})();
</script>
