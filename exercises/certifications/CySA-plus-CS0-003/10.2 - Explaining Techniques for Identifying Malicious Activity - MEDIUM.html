<script>
"use strict";
var EX = [{"id":"M01","th":"tools","t":"rows","pts":10,"lab":"CHOOSE ONE DISPOSITION PER ALERT","sc":"<p>Tuesday, 09:40. You are the Tier 1 analyst at Meridian Logistics. Five alerts are waiting in the SIEM queue. Company baseline: nightly backups run to an internal server, the guest Wi-Fi uses a self-service portal, and EICAR test files are used monthly by the AV team.</p>","q":"<p>Choose the best disposition for every alert.</p>","d":{"opts":["Escalate to Tier 2 now","Monitor for now","Close as expected activity"],"rows":[{"r":"<b>ALERT-881 · Beacon</b> — MER-WS-0142 (finance workstation) connects to 203[.]0[.]113[.]44:443 every 60 s (±4 s) for the last 3 hours. Destination domain cdn-metrics[.]example was never seen before.","a":0},{"r":"<b>ALERT-882 · AV</b> — EICAR test file quarantined on MER-WS-0088. Hash matches the standard antivirus test string.","a":2},{"r":"<b>ALERT-883 · Logons</b> — 214 failed logons (Event 4625) against 30+ different accounts in 12 minutes, all from 10[.]10[.]7[.]44.","a":0},{"r":"<b>ALERT-884 · NetFlow</b> — nightly 2 GB transfer from MER-SRV-FS02 to backup server 10[.]10[.]30[.]10, matching the documented backup window (CHG-2214).","a":2},{"r":"<b>ALERT-885 · Accounts</b> — new local admin account <span class='mono'>svc_patch</span> created at 02:14 on MER-WS-0171. No change ticket found.","a":0},{"r":"<b>ALERT-886 · DHCP</b> — unregistered laptop joined the guest Wi-Fi through the self-service portal (standard guest flow, isolated VLAN).","a":1}]},"ex":"<p><b>881:</b> a fixed 60-second rhythm to a never-seen domain is machine-to-controller traffic — a C2 beacon. Escalate. <b>882:</b> EICAR is an inert test string; the control worked, so close. <b>883:</b> few attempts against many accounts is password spraying, not a typo — escalate. <b>884:</b> matches the scheduled, ticketed backup — expected. <b>885:</b> a new admin account with no ticket is a classic rogue foothold — escalate. <b>886:</b> the guest portal is designed for unregistered devices, and the VLAN is isolated — monitor only. Triage weighs impact and certainty against the baseline, not raw alert count.</p>","hints":["Scheduled jobs, guest flows, and test files are normal; new admin accounts and steady call-back rhythms are not.","For 881, ask: who else talks to that domain at exactly that interval? Humans browse; beacons keep time."]},{"id":"M02","th":"app","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Morning shift, Meridian Logistics. The web server MER-SRV-WEB01 logged the requests below between 03:11 and 03:13. Your queue shows a spike alert from this host.</p>","q":"<p>Select every line that shows an SQL-injection probe against <span class='mono'>/products.php</span> — a quote test, a tautology test, or a UNION attempt. Benign lines must stay unselected.</p>","d":{"filter":true,"sel":true,"correct":[2,3,4],"lines":["198[.]51[.]100[.]23 - - [07/Oct/2025:03:11:02] \"GET /index.html HTTP/1.1\" 200 5312","198[.]51[.]100[.]23 - - [07/Oct/2025:03:11:04] \"GET /products.php?id=2 HTTP/1.1\" 200 8110","198[.]51[.]100[.]23 - - [07/Oct/2025:03:11:09] \"GET /products.php?id=2%27 HTTP/1.1\" 500 1721","198[.]51[.]100[.]23 - - [07/Oct/2025:03:11:11] \"GET /products.php?id=2%27+OR+1%3D1-- HTTP/1.1\" 200 9402","198[.]51[.]100[.]23 - - [07/Oct/2025:03:11:15] \"GET /products.php?id=1+UNION+SELECT+name%2Cpass+FROM+customers-- HTTP/1.1\" 200 12043","198[.]51[.]100[.]23 - - [07/Oct/2025:03:11:18] \"TRACE /products.php HTTP/1.1\" 200 880","198[.]51[.]100[.]23 - - [07/Oct/2025:03:11:20] \"GET /styles/main.css HTTP/1.1\" 200 421","192[.]0[.]2[.]44 - - [07/Oct/2025:03:12:01] \"GET /robots.txt HTTP/1.1\" 200 68","192[.]0[.]2[.]44 - - [07/Oct/2025:03:12:03] \"GET /favicon.ico HTTP/1.1\" 404 209","198[.]51[.]100[.]23 - - [07/Oct/2025:03:12:40] \"GET /products.php?id=3 HTTP/1.1\" 200 8095","10[.]10[.]4[.]9 - - [07/Oct/2025:03:13:02] \"GET /health.php HTTP/1.1\" 200 12"]},"ex":"<p>Line 3 sends a single quote (<span class='mono'>%27</span>) and the app answers 500 — an input-validation failure that leaks an error. Line 4 appends <span class='mono'>OR 1=1</span>, a tautology that forces the query to match everything. Line 5 uses <span class='mono'>UNION SELECT</span> to pull other tables, and the bigger response size (12,043 bytes) shows extra data came back. The benign lines are normal browsing: the same IP later visits id=3 without tricks, robots.txt and favicon are routine crawler traffic, and health.php is an internal check. The TRACE line is a dangerous HTTP method worth its own ticket (it can echo session cookies), but it is not an SQLi test, so it stays unselected here. This is the classic web-log triangle: abnormal parameter, error or size change, and repeated probing.</p>","hints":["%27 is a URL-encoded single quote — the fastest SQLi probe there is.","Look for OR+1%3D1 (OR 1=1) and UNION+SELECT in the decoded query string."]},{"id":"M03","th":"net","t":"qcm","pts":10,"lab":"CHOOSE ONE","sc":"<p>NetFlow on the Meridian edge shows a steady pattern all afternoon: MER-WS-0142 sends about 140 bytes to 203[.]0[.]113[.]44:443 every 60 seconds, ±4 seconds of jitter, for 6 hours — including during lunch. The destination domain was registered last week.</p>","q":"<p>What does this pattern most likely show?</p>","d":{"ch":["Command-and-control beaconing","A port scan of the workstation","Bulk data exfiltration","A denial-of-service reflection attack"],"a":0},"ex":"<p>A compromised host checking in with its controller sends small, fixed-size messages on a steady rhythm, with a little jitter to look human. Hours of regularity — even at lunch — is the fingerprint of C2 beaconing. A port scan touches many ports or many hosts in a burst, not one port every minute. Exfiltration moves large volumes, not 140 bytes. A denial-of-service flood aims at overwhelming a target, which looks nothing like polite 60-second check-ins.</p>","hints":["Ask how much data moves and how regularly. Tiny amounts + perfect rhythm = a heartbeat, not a download.","Scans are loud and wide; beacons are quiet and patient."]},{"id":"M04","th":"tools","t":"rows","pts":10,"lab":"MATCH EACH TOOL TO ITS BEST PURPOSE","sc":"<p>You are preparing the Meridian SOC toolbox talk. New analysts keep mixing up the analysis tools.</p>","q":"<p>Match each tool to the job it is actually built for.</p>","d":{"opts":["Inspect individual packets and rebuild sessions","Show top talkers and volume trends between hosts","Recover artifacts from a suspect machine's RAM","Quickly pull readable text out of a binary","Detonate a sample safely and record its behavior"],"rows":[{"r":"<b>Wireshark</b> (packet capture)","a":0},{"r":"<b>NetFlow / IPFIX reporter</b>","a":1},{"r":"<b>Volatility</b> (memory framework)","a":2},{"r":"<b>strings</b> (command-line utility)","a":3},{"r":"<b>Detonation sandbox</b>","a":4}]},"ex":"<p>Wireshark works at packet level — you see handshakes, payloads, and can rebuild a session. NetFlow/IPFIX summarizes who talked to whom and how much — perfect for trends and top talkers, useless for payload detail. Volatility reads RAM of a suspect host: hidden processes, injected code, network artifacts that died at power-off. strings dumps readable text from a binary — URLs, commands, passwords in seconds, no execution needed. A sandbox runs the sample in a safe box and records what it does: drops, registry edits, call-backs. Choosing the right altitude — packet, flow, memory, file, behavior — is half the analysis.</p>","hints":["Flow data answers 'how much and between whom'; packet data answers 'what exactly was said'.","strings never runs the file — it just reads it."]},{"id":"M05","th":"tools","t":"slots","pts":10,"lab":"COMPLETE THE RULE","sc":"<p>After this week's 4444-port beacon, Meridian's detection team drafts a new IDS signature (Snort/Suricata style). Two fields were left blank for the review meeting.</p>","q":"<p>Fill both blanks so the rule detects (but does not block) inbound C2 traffic to the uncommon port seen in the incident.</p>","d":{"mode":"seq","seg":["<code>"," tcp $EXTERNAL_NET any -&gt; $HOME_NET "," (msg:'SUSPECT inbound C2 listener on uncommon port'; flow:established; sid:10000123; rev:1;)</code>"],"bank":["alert","drop","pass","4444","3389","53","$DNS_NET"],"slots":[{"lab":"action","acc":[0]},{"lab":"destination port","acc":[3]}]},"ex":"<p><b>alert</b> is the detect-only action — this is a detection rule, and blocking belongs to an IPS policy decision (drop would cut traffic, pass would ignore it). <b>4444</b> is the uncommon port seen in the incident; 3389 (RDP) and 53 (DNS) are normal services that would flood the rule with noise, and $DNS_NET is a variable for DNS servers, not a port. IDS rules read as: ACTION PROTOCOL SRC → DST PORT (options).</p>","hints":["The rule should watch and warn — which action word does that?","The incident port was the classic C2 listener, not a well-known service port."]},{"id":"M06","th":"net","t":"slots","pts":10,"lab":"DRAG EACH INDICATOR TO ITS CATEGORY","sc":"<p>Meridian's detection lead asks you to sort this week's raw findings so each team gets the right homework. The three buckets are the classic indicator families.</p>","q":"<p>Place every indicator into its natural category.</p>","d":{"mode":"cat","bank":["Outbound traffic spike to one external IP at 03:00","TXT-record flood to a single unknown domain","Beaconing every 60 s to a newly seen domain","New Windows service installed on a member server","Run key added for svch0st.exe (zero, not the letter o)","lsass.exe opening lsass.exe memory","SQL error text echoed back in a web page","Burst of HTTP 500 errors with stack traces","Oversized POST body with an encoded payload"],"slots":[{"lab":"Network traffic","acc":[0,1,2]},{"lab":"Host / endpoint","acc":[3,4,5]},{"lab":"Application","acc":[6,7,8]}]},"ex":"<p><b>Network:</b> volume spikes, DNS floods, and timed beacons all live on the wire. <b>Host:</b> a new service, a Run key named after the real svchost but with a zero (a typosquat you only catch by reading), and a process reading its own high-value memory (lsass holds credentials) are machine-state events. <b>Application:</b> leaked SQL errors, 500-bursts, and oversized encoded requests are the app misbehaving under attack. The same event can touch several buckets — what matters is where the evidence is collected: flow data, endpoint telemetry, or app logs. These categories later feed ATT&CK-style tactic mapping.</p>","hints":["Ask first: would you find this in a flow record, an endpoint console, or a web server log?","svch0st with a zero is pretending to be svchost — that is a host story, not a network story."]},{"id":"M07","th":"email","t":"branch","pts":10,"lab":"CHOOSE YOUR NEXT STEP","sc":"<p>09:55. Meridian user m.okafor reports an email: display name 'IT Support', text 'your password expires today — re-validate here', one button link. He did not click.</p>","q":"<p>Work the phishing playbook. Each choice moves the case forward.</p>","d":{"stages":[{"sc":"<p><b>Step 1.</b> The mail client preview hides the real sender. What first?</p>","ch":["Pull the full email headers and authentication results first","Click the link yourself to see where it goes","Reply to the sender asking if the mail is real","Forward it to the whole team so everyone sees it"],"a":0,"fb":["Correct — headers show the true path and SPF/DKIM/DMARC verdicts without touching the link.","Never click or reply: clicking confirms a live target, replying tells the attacker the mailbox is read, and mass forwarding spreads the lure."]},{"sc":"<p><b>Step 2.</b> Headers: SPF fail (sending IP 198[.]51[.]100[.]201 is not authorized), display name 'IT Support', and Reply-To points to helpdesk-recover[.]example while From claims meridian-log[.]example. Verdict?</p>","ch":["Phishing — a credential-harvesting attempt","A legitimate mail routed through a relay","Normal marketing mail with failed alignment","A harmless bounce from a full mailbox"],"a":0,"fb":["Right — failed SPF plus a Reply-To on a foreign domain is textbook harvesting setup.","Legitimate relays pass alignment; a failed SPF with a foreign Reply-To does not happen by accident.","Marketing mail passes its checks; here SPF failed and the reply address belongs to nobody at Meridian.","Bounces quote a delivery failure — this mail asks the user to re-validate a password."]},{"sc":"<p><b>Step 3.</b> The verdict is phishing. Tenant-wide action?</p>","ch":["Search every mailbox for the campaign and purge all copies","Delete only the reported copy and close the case","Keep monitoring — a single email is not a campaign","Archive the message in the monthly report"],"a":0,"fb":["Correct — one report means many recipients; hunt the whole tenant.","Attackers rarely send a single copy; scoping by artifacts (sender, subject, URL) finds the rest.","Waiting grows the victim pool; the campaign artifacts are already in hand.","Filing is not containment — every unopened copy is still a live lure."]},{"sc":"<p><b>Step 4.</b> Close-out actions?</p>","ch":["Block the domain, warn users; resets are not needed","Force a company-wide password reset for everyone","Escalate to the mail vendor for a new server","Nothing further — the mail was deleted"],"a":0,"fb":["Right — blocklist the infrastructure and warn users; resets are for people who typed credentials in.","Response effort follows exposure: a non-clicked phish needs containment of the lure, not credential rotation.","The mail platform is healthy — the problem is the attacker's infrastructure, not yours.","Deleted from one mailbox does not mean deleted from the tenant."]}]},"ex":"<p>The playbook: read headers first (they prove SPF failure and the Reply-To trick without touching the lure), classify the campaign, then scope it tenant-wide and purge every copy. Blocking the sending domain stops the rest of the wave; credential resets are reserved for users who actually typed into the fake page. The keywords here: header analysis, SPF, display-name spoofing, credential harvesting, purge.</p>","hints":["Headers are evidence you can read safely; the link and the reply button are attacker-controlled surfaces.","One report almost always means a campaign, not an incident of one."]},{"id":"M08","th":"host","t":"term","pts":10,"lab":"TYPE THE COMMANDS","sc":"<p>Overnight, the SSH gateway mer-srv-ssh (Ubuntu) wrote the log below. You have shell access to the log host and the file auth.log is in your working directory.</p>","q":"<p>Complete both objectives in the terminal. The command family is given: use <span class='mono'>grep</span>.</p>","d":{"ps":"analyst@mer-soc:~$","boot":["Meridian SOC triage shell","Working file: auth.log (SSH service, last night)","Type help to list objectives."],"tasks":[{"goal":"Use a grep command on auth.log to show every line containing a failed password attempt.","re":"grep[^\n]*failed","out":"Oct 07 03:12:01 mer-srv-ssh sshd[2210]: Failed password for admin from 10[.]10[.]7[.]44 port 51022 ssh2\nOct 07 03:12:09 mer-srv-ssh sshd[2214]: Failed password for admin from 10[.]10[.]7[.]44 port 51038 ssh2\nOct 07 03:12:18 mer-srv-ssh sshd[2218]: Failed password for root from 10[.]10[.]7[.]44 port 51052 ssh2\n… (29 more matching lines)"},{"goal":"Count the failed-password lines. Two common ways: grep -c, or pipe grep into wc -l.","re":"(grep.*-c)|(grep.*wc)|(wc[^\n]*-l)|(wc)","out":"32"}]},"ex":"<p><span class='mono'>grep \"Failed password\" auth.log</span> prints every matching line — you see the accounts targeted and the source IP 10[.]10[.]7[.]44 repeating. Adding <span class='mono'>-c</span> (or piping into <span class='mono'>wc -l</span>) gives the count: 32 failures in a short window. Counts turn 'some noise' into 'a pattern worth a ticket' — password-guessing shows as many failures from one source, and the next thing to check is whether any attempt succeeded.</p>","hints":["The grep tool takes the words to find in quotes, then the file name: grep \"Failed password\" auth.log","Count with grep -c \"Failed password\" auth.log — or keep the output flowing: grep … | wc -l"]},{"id":"M09","th":"app","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Meridian's accounting application server MER-SRV-APP01 crashed twice last night, minutes after a new 'invoice template' upload. The application log follows.</p>","q":"<p>Select every line that shows a possible buffer overflow or a service interruption.</p>","d":{"filter":true,"sel":true,"correct":[1,2,4,5],"lines":["01:14:02  INFO  AcctSrv service started (pid 2210)","01:22:41  ERROR AcctSrv: access violation 0xC0000005 at 0x0054a1b7 (module AcctSrv.exe)","01:22:41  WARN  Faulting application: AcctSrv.exe, exception code 0xC0000005","01:22:45  INFO  Watchdog restarting AcctSrv","01:31:09  ERROR AcctSrv: access violation 0xC0000005 writing address 0x41414141","01:31:09  WARN  Service stopped unexpectedly — AcctSrv down for 90 s (service interruption)","01:32:40  INFO  AcctSrv started","02:10:00  INFO  Nightly billing job completed (12,402 invoices)","02:44:17  ERROR AcctSrv: login failed for user svc_report (bad password)","03:00:00  INFO  Backup checkpoint written"]},"ex":"<p>0xC0000005 is an access violation — the process touched memory it may not touch, the signature of memory corruption such as a buffer overflow. The second crash writes to 0x41414141, which is 'AAAA' in hex: the classic marker of input filled with 'A' overrunning a buffer. The 90-second outage is the service interruption. Normal lines: starts, restarts, the billing job, a plain bad password, and checkpoints. Timeline matters too — crashes right after a file upload deserve a ticket with that file attached (safely) as evidence.</p>","hints":["0xC0000005 is Windows' access-violation code — memory misused.","0x41414141 is 'AAAA' in hex — input overfilled a buffer and ate the address space."]},{"id":"M10","th":"host","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>EDR telemetry from MER-WS-0142 (the finance workstation from ALERT-881) arrived in your queue. Sysmon-style process, file, and network events follow, in time order.</p>","q":"<p>Select every line that proves suspicious execution, persistence, a privilege change, or an unusual outbound connection.</p>","d":{"filter":true,"sel":true,"correct":[1,3,4,7,8,10],"lines":["02:13:58  EID 1    explorer.exe → WINWORD.EXE · file: Q3_forecast.docx (user opened a document)","02:14:02  EID 1    WINWORD.EXE → wscript.exe · cmd: wscript.exe %APPDATA%\\sync.vbs","02:14:05  EID 11   FileWrite %TEMP%\\~df1A2.tmp (Office temp file)","02:15:11  EID 1    wscript.exe → cmd.exe · cmd: cmd.exe /c sc create SyncHelper binPath= %APPDATA%\\helper.dll start= auto","02:15:12  EID 7045 Service installed: SyncHelper · %APPDATA%\\helper.dll","02:15:13  EID 7036 Service SyncHelper entered the running state","02:15:40  EID 1    splwow64.exe started (normal printer process)","02:16:02  EID 1    cmd.exe · cmd: net localgroup administrators r.smith /add","02:16:05  EID 4732 Member added to local group Administrators: r.smith","02:16:30  EID 3    Network 10[.]10[.]14[.]42 → 10[.]10[.]20[.]5:389 (LDAP to the domain controller)","02:17:11  EID 3    Network 10[.]10[.]14[.]42 → 203[.]0[.]113[.]44:4444 (ESTABLISHED)","02:18:00  EID 1    chrome.exe (user browsing)"]},"ex":"<p>The kill chain is readable in parent-child lines: Word should never spawn wscript.exe — that is a document dropper using a LOLBin (living-off-the-land binary). <span class='mono'>sc create</span> plus Event 7045 (service installed) is service persistence pointing into %APPDATA%, where no service belongs. <span class='mono'>net localgroup administrators /add</span> plus 4732 (member added to Administrators) is privilege escalation. The outbound connection to 203[.]0[.]113[.]44:4444 is the C2 link on a classic attacker port. Benign: the Office temp file, the printer process, LDAP to the DC, and browsing. Parent-child anomalies are the fastest tell on endpoint logs.</p>","hints":["Ask of every line: should this parent ever produce this child? Word → wscript should not.","Event 7045 means 'a new service was installed' — persistence in one line."]},{"id":"M11","th":"net","t":"multi","pts":10,"lab":"SELECT ALL THAT APPLY","sc":"<p>The DNS team hands you a day of resolver logs from Meridian. One workstation, MER-WS-0203, generated 4,100 DNS queries overnight while its user was off-shift. Passive DNS history shows the target zone first appeared 3 days ago.</p>","q":"<p>Which observations in the logs support DNS tunneling? Select all that apply.</p>","d":{"ch":["Subdomains longer than 60 characters made of hex/base32","Hundreds of TXT queries in one hour to a single never-seen zone","One host with a steady NXDOMAIN burst across many random subdomains","One large FTP upload to an internal file server","HTTPS browsing to a popular CDN with normal query counts"],"a":[0,1,2]},"ex":"<p>DNS tunneling smuggles data inside DNS messages, so the logs betray it three ways: huge encoded labels (the payload rides in the subdomain), TXT queries in bulk (TXT carries chunks of data), and NXDOMAIN storms (the malware guesses subdomains faster than the zone answers). Passive DNS — who queried what, when — makes the never-seen zone and the volume easy to confirm. The distractors are volume without encoding: one FTP upload is a file transfer, and CDN browsing generates many normal lookups.</p>","hints":["Tunneling hides data in the questions themselves — look for data-shaped labels and record types.","TXT and very long names are the workhorses of DNS tunnels."]},{"id":"M12","th":"host","t":"slots","pts":10,"lab":"FILL THE REPORT","sc":"<p>You validated ALERT-885 further: MER-WS-0142 reached MER-SRV-FS02 with admin shares and dropped a job. Your ticket notes need the right terminology before Tier 2 reads them.</p>","q":"<p>Fill the four gaps in the incident note with the correct terms.</p>","d":{"mode":"seq","seg":["<b>INC-4471 — analyst notes.</b> We confirmed "," movement from MER-WS-0142 to MER-SRV-FS02 over SMB admin shares (C$ / ADMIN$). A new "," was created on the server with schtasks, giving the attacker ",", because it relaunches at every logon. The compromised service account is on the watchlist and the file hashes were shared with our "," feed."],"bank":["lateral","horizontal","scheduled task","firewall rule","persistence","exfiltration","threat intelligence","sandbox escape"],"slots":[{"lab":"movement type","acc":[0]},{"lab":"artifact created","acc":[2]},{"lab":"why it matters","acc":[4]},{"lab":"where hashes went","acc":[6]}]},"ex":"<p>Machine-to-machine movement with admin shares is <b>lateral movement</b> (the term tickets use — 'horizontal' is not standard). schtasks creates a <b>scheduled task</b>, and its purpose here is <b>persistence</b>: the malware survives logoffs and reboots. Hashes and IOCs go to the <b>threat intelligence</b> feed so other teams and tools can hunt them. Exfiltration would mean data left the company — nothing did here — and firewall rules and sandbox escapes are unrelated artifacts.</p>","hints":["The attacker is moving between machines — what do we call that?","Sharing hashes and IOCs externally is the intelligence-sharing step."]},{"id":"M13","th":"email","t":"rows","pts":10,"lab":"CHOOSE ONE PER EMAIL","sc":"<p>You run the Meridian mail-gateway review queue. Four messages await a disposition. Baseline: the company domain is meridian-log[.]example, and the CEO is E. Okafor.</p>","q":"<p>Decide each message.</p>","d":{"opts":["Quarantine and investigate","Release to the inbox"],"rows":[{"r":"<b>Mail 1</b> — From: billing@vendor-part[.]example · Attachment: <span class='mono'>Invoice_2941.pdf.js</span> · DKIM: fail · Sender not on the approved partner list.","a":0},{"r":"<b>Mail 2</b> — Monthly newsletter from a known vendor. SPF pass, DKIM pass (aligned), DMARC pass, links point to the vendor's real site.","a":1},{"r":"<b>Mail 3</b> — Display name 'E. Okafor (CEO)' but the real From domain is meridian-ceo[.]example — a lookalike of meridian-log[.]example registered 2 days ago. Asks for gift cards.","a":0},{"r":"<b>Mail 4</b> — Password-reset mail from the identity team, matching the official reset URL, DKIM-signed by the identity provider.","a":1}]},"ex":"<p>Mail 1: a <span class='mono'>.pdf.js</span> double extension is a script wearing a document costume, and DKIM failure plus an unknown sender seals it — quarantine. Mail 2 passes every control with aligned signatures — release. Mail 3 is business email compromise (BEC): the display name is borrowed, the domain is a lookalike registered days ago, and gift cards are the payload; BEC needs no malware, only trust. Mail 4 matches the official URL and is signed by the IdP — release. Always read the actual From domain, not the friendly display name.</p>","hints":["A file named .pdf.js is a script that wants to look like a PDF.","For the 'CEO' mail, compare the display name with the real From domain character by character."]},{"id":"M14","th":"tools","t":"slots","pts":10,"lab":"DRAG EACH TECHNIQUE TO ITS FAMILY","sc":"<p>Meridian is standing up deception and behavior tooling. The vendor deck mixes everything together; you sort it for the architecture review.</p>","q":"<p>Place every technique into its family.</p>","d":{"mode":"cat","bank":["Decoy web server with fake file shares on the DMZ","Watched range of unused IP space — any packet to it is suspicious","Fake AWS key planted in a code repo, alert on use","Decoy file 'Passwords_2025.xlsx' on a file share","UEBA flags an executive logging in at 03:00 from a new country","Alert when an HR account suddenly runs a port scanner"],"slots":[{"lab":"Network decoys","acc":[0,1]},{"lab":"Data decoys (honeytokens)","acc":[2,3]},{"lab":"Behavioral analytics (UEBA)","acc":[4,5]}]},"ex":"<p>Network decoys bait scans: a fake server with nothing real on it, and darknet-style unused address space where legitimate traffic never goes. Data decoys are honeytokens — fake secrets and files with zero business use, so any use is a signal (the planted AWS key, the Passwords spreadsheet). Behavioral analytics learns a baseline and flags deviations: the 03:00 login from a new country, or an HR identity running a scanner. Deception gives high-fidelity alerts because nobody should touch it; UEBA gives coverage where no signature exists.</p>","hints":["If the item is a place or a service that should never be touched, it is a network decoy.","If the item is a piece of fake data, it is a honeytoken."]},{"id":"M15","th":"net","t":"qcm","pts":10,"lab":"CHOOSE ONE","sc":"<p>Baselines for Meridian: finance workstations never use RDP; servers run SMB and RDP; the jump host runs RDP; workstations browse HTTPS and query the internal DNS.</p>","q":"<p>Which single finding on MER-FIN-WS-044 (a finance workstation) is most suspicious?</p>","d":{"ch":["Outbound HTTPS to a vendor update server","RDP (3389) reachable from a non-IT subnet","DNS queries to the internal domain controller","SMB access to the department file share"],"a":1},"ex":"<p>Judge every service against what this machine normally does. HTTPS updates, internal DNS, and department SMB are ordinary workstation behavior. RDP accepting connections on a finance box is already off-baseline — finance staff never remote in — and a session arriving from a non-IT subnet means someone is driving the machine remotely: a takeover attempt or an attacker staging lateral access. Suspicious protocol use is less about the protocol and more about who, where, and whether the baseline allows it at all.</p>","hints":["Three of the four findings appear on every healthy workstation in this company.","The dangerous one is a remote-control protocol this user group never uses — from a stranger's subnet."]},{"id":"M16","th":"tools","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Audit time. You review Meridian's EDR exclusions and SIEM filters, shown below exactly as configured.</p>","q":"<p>Select every line that creates a blind spot an attacker could abuse.</p>","d":{"filter":true,"sel":true,"correct":[1,3],"lines":["EDR exclusion: C:\\Program Files\\MeridianAgent\\* (signed agent folder, ticket CHG-2214)","EDR exclusion: C:\\Temp\\* — applies to every process","EDR policy 'Standard endpoints': tamper protection ON","SIEM filter: drop EventCode=4688 (process creation) to save license volume","SIEM filter: drop EventCode=4662 (directory object access) — high volume, low value","SIEM retention: 30 days hot, 1 year cold","SIEM alert 'new local admin added' enabled","EDR exclusion: C:\\ProgramData\\MeridianBackup\\* (backup vendor, ticket CHG-2214)"]},"ex":"<p>Excluding <span class='mono'>C:\\Temp\\*</span> for every process turns Temp — malware's favorite drop zone — into a free-attack zone: anything landing there runs unwatched (a false-negative factory). Dropping Event 4688 removes process-creation evidence entirely, blinding detections that key on command lines and parent-child chains. The other lines are scoped to documented vendor folders with change tickets, or drop genuinely low-value events, or add coverage (the new-admin alert, tamper protection, retention). The rule for exclusions: narrow paths, named processes, and a ticket for every line.</p>","hints":["Ask what an attacker could run or change inside each excluded path.","Which dropped event type feeds most endpoint detections?"]},{"id":"M17","th":"tools","t":"slots","pts":10,"lab":"RANK BY INVESTIGATION PRIORITY","sc":"<p>10:30. Five open findings and two analysts. The SOC lead wants your ordering and your reasoning.</p>","q":"<p>Rank the findings from highest to lowest investigation priority.</p>","d":{"mode":"seq","bank":["Ransomware canary file modified on MER-SRV-FS02","Beaconing from MER-DC01 to an unknown external host","New local admin account on MER-WS-0171, no ticket","One phishing email reported by a user, no click","Torrent client installed on an isolated lab VM"],"slots":[{"lab":"Priority 1","acc":[0]},{"lab":"Priority 2","acc":[1]},{"lab":"Priority 3","acc":[2]},{"lab":"Priority 4","acc":[3]},{"lab":"Priority 5","acc":[4]}]},"ex":"<p>Priority = impact × certainty. The canary file changing means encryption is happening right now — minutes matter. A beacon on a domain controller threatens every credential in the domain, so it is next. The rogue admin account is a confirmed foothold but on one workstation. The reported phish with no click is containment work, not an emergency. The torrent client on an isolated lab VM is a policy violation with little breach potential. Higher impact plus higher certainty always moves up the queue.</p>","hints":["Which finding means damage is occurring during your shift?","A domain controller is worth more than a workstation; a lab VM is worth least."]},{"id":"M18","th":"net","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>NetFlow summary for the Meridian edge, compressed into one table. Normal outbound per workstation: under 60 MB/day. MER-WS-0203 is a standard office workstation.</p>","q":"<p>Select every flow line that shows abnormal behavior for MER-WS-0203.</p>","d":{"filter":true,"sel":true,"correct":[3,4,5],"lines":["06:00:01  MER-SRV-FS02 → 10[.]10[.]30[.]10:445   TCP 2.1GB  (nightly backup job)","06:03:44  MER-SRV-FS02 → 10[.]10[.]30[.]10:445   TCP 1.9GB  (backup job cont.)","09:12:10  MER-WS-0142 → 10[.]10[.]20[.]5:389     TCP 84KB   (LDAP to DC)","10:44:51  MER-WS-0203 → 203[.]0[.]113[.]77:8443  TCP 310MB","11:02:07  MER-WS-0203 → 203[.]0[.]113[.]77:8443  TCP 295MB","11:22:33  MER-WS-0203 → 203[.]0[.]113[.]77:8443  TCP 305MB","12:10:02  MER-WS-0142 → 198[.]51[.]100[.]8:443   TCP 12MB   (browsing)","13:41:19  MER-SRV-WEB01 ← 198[.]51[.]100[.]23:443 TCP 40MB   (inbound web traffic)","14:05:55  MER-WS-0311 → 10[.]10[.]20[.]5:53      UDP 3KB    (DNS)","15:00:00  MER-SRV-APP01 → 10[.]10[.]30[.]20:1433 TCP 220MB  (database replication)"]},"ex":"<p>A workstation pushing ~910 MB in three chunks to one external IP on port 8443 — 15× its daily baseline — is staged data exfiltration: large transfers spaced out to look like uploads. Everything else sits on the baseline: backups flow to the internal backup server, LDAP and DNS are small by design, browsing is megabytes, replication is a server talking to its replica. Flow analysis shines here: you do not need packet contents when the volumes and endpoints already break the pattern.</p>","hints":["Compare each row with the stated 60 MB/day workstation baseline.","Same external IP, same port, repeated large chunks = scheduled uploads, not browsing."]},{"id":"M19","th":"tools","t":"multi","pts":10,"lab":"SELECT ALL THAT APPLY","sc":"<p>23:00. You are the on-call analyst. Five notifications sit in the queue; the duty manager asks which ones justify opening an incident tonight.</p>","q":"<p>Select all findings that justify opening an incident now.</p>","d":{"ch":["A honeypot file share was opened by an internal host","Service-account logon from a country with no offices (impossible travel)","Proxy logs show a workstation fetching a known webshell URL","One failed logon for one account at 08:59 (user mistyped twice)","The nightly AV signature update finished on all endpoints"],"a":[0,1,2]},"ex":"<p>A honeypot share has no business purpose — any touch is a high-fidelity signal. Impossible travel on a service account means its credentials are in someone else's hands: open an incident and disable the account. Fetching a known webshell URL from a workstation means code execution has likely already happened. A mistyped password is human noise, and a successful AV update is the control working. Incident triggers need attacker intent plus potential impact — not just 'something happened'.</p>","hints":["Deception hits (honeypots) and credential anomalies are near-automatic incident triggers.","Ask whether each finding could be produced by a normal user doing normal work."]},{"id":"M20","th":"host","t":"branch","pts":10,"lab":"CHOOSE YOUR NEXT STEP","sc":"<p>11:12. EDR raises a high alert on MER-WS-0155 (finance): WINWORD.EXE spawned certutil.exe with the command line <span class='mono'>certutil.exe -urlcache -f hxxps://files-meridian[.]example/pa[.]exe %TEMP%\\pa[.]exe</span>.</p>","q":"<p>Drive the response, one decision at a time.</p>","d":{"stages":[{"sc":"<p><b>Step 1.</b> The alert just fired. First move?</p>","ch":["Verify first — pull the command line, hash, and parent chain","Email the user an apology for the alert noise","Approve the alert because certutil is a signed Windows tool","Shut down the whole office network"],"a":0,"fb":["Correct — validate before acting; Word spawning certutil is the classic document-dropper chain.","Signed tools are exactly what attackers abuse (LOLBins); 'it is a Windows tool' is not an approval."]},{"sc":"<p><b>Step 2.</b> The hash is unknown, the URL domain was registered yesterday, and the host is a finance workstation. Next?</p>","ch":["Isolate the workstation from the network through the EDR console","Open Excel on your own machine to check the macros","Wait 24 hours to see if it repeats","Rename the host so the attacker loses track"],"a":0,"fb":["Right — isolation stops C2 and any follow-on payload while you investigate.","Waiting gives the attacker a free day; renaming helps nobody."]},{"sc":"<p><b>Step 3.</b> Host is isolated. Contain the campaign artifacts.</p>","ch":["Block the IOCs at the proxy, then detonate the sample","Order more RAM for the isolated host","Turn off EDR to see if behavior changes","Reply to the email that delivered the file"],"a":0,"fb":["Correct — IOC blocking cuts off other hosts; the sandbox shows the payload's behavior safely.","Disabling your own EDR during an incident is exactly what the attacker wants."]},{"sc":"<p><b>Step 4.</b> Artifacts are blocked. Scope the blast radius.</p>","ch":["Hunt all hosts for the hash, the URL, and the pattern","Re-check this one host and close the case","Assume the incident is unique and close it","Ask users to report any slow computers"],"a":0,"fb":["Right — one dropper is rarely alone; hunt the IOCs everywhere and tag the case with its ATT&CK-style tactics (Execution, Command and Control) for the report.","Assuming uniqueness is how small incidents become big ones."]}]},"ex":"<p>The chain — document spawns certutil to fetch a payload — is LOLBin abuse: certutil is legitimate, signed, and routinely weaponized as a downloader. Response order: verify the artifact, isolate the host (cut C2), block IOCs and detonate in a sandbox for behavior, then scope tenant-wide by hash, URL, and the parent-child pattern. Map the case to tactics (Execution → Command and Control) so reporting and hunting stay consistent.</p>","hints":["'Signed Windows tool' answers 'is the binary genuine?', not 'is this behavior normal?'","Before deep analysis, cut the cord: isolation beats curiosity."]},{"id":"M21","th":"net","t":"term","pts":10,"lab":"TYPE THE COMMANDS","sc":"<p>Change-approved scanning window (CHG-2230). The lab host 10[.]10[.]7[.]66 behaved oddly in the flow data this week. Your scanning shell is ready.</p>","q":"<p>Complete both objectives in the terminal. The command family is given: use <span class='mono'>nmap</span>.</p>","d":{"ps":"analyst@mer-soc:~$","boot":["Meridian SOC scanning shell — approved window","Target: lab host 10[.]10[.]7[.]66","Type help to list objectives."],"tasks":[{"goal":"Run an nmap scan against 10[.]10[.]7[.]66 to list its open TCP ports.","re":"nmap[^\n]*10(\\[?\\.\\]?)10(\\[?\\.\\]?)7(\\[?\\.\\]?)66","out":"Starting Nmap against 10[.]10[.]7[.]66\nPORT     STATE  SERVICE\n22/tcp   open   ssh\n80/tcp   open   http\n4444/tcp open   unknown\nScan complete: 3 open TCP ports."},{"goal":"Run nmap again with version detection (-sV) so the service on 4444 is identified.","re":"nmap[^\n]*-s[vV][^\n]*10","out":"PORT     STATE  SERVICE  VERSION\n22/tcp   open   ssh      OpenSSH 8.4\n80/tcp   open   http     nginx 1.24\n4444/tcp open   unknown  unidentified listener (commonly abused by C2 frameworks)\nScan complete."}]},"ex":"<p><span class='mono'>nmap 10[.]10[.]7[.]66</span> maps open ports — here 22, 80, and an unidentified 4444. Adding <span class='mono'>-sV</span> probes each service for a version banner; when even version detection returns 'unidentified listener' on a port famous for C2 frameworks, the next step is a process check on the host itself. Port scanning (with authorization) finds the exposed surface; service enumeration tells you what is really listening. An accepted command may be typed with or without brackets around the dots.</p>","hints":["Basic form: nmap &lt;target&gt; — the tool lists open ports on its own.","Add the -sV flag before the target for version detection."]},{"id":"M22","th":"email","t":"slots","pts":10,"lab":"FILL THE ANALYSIS","sc":"<p>You are writing up message 8f31c for the ticket. The header analysis is done; the write-up needs the right words.</p>","q":"<p>Fill the four gaps in the header-analysis note.</p>","d":{"mode":"seq","seg":["<b>Header review — msg 8f31c.</b> The Received chain shows the message entered our gateway from an "," relay with no link to the claimed sender. SPF evaluated to ",", because the sending IP is not listed in the sender's SPF record. A DKIM signature is present, but its d= domain does not "," with the From domain — a strong spoofing sign. Our DMARC policy is p=",", so a message failing both checks is rejected at the gateway."],"bank":["unknown","internal","fail","pass","align","sign","reject","quarantine"],"slots":[{"lab":"relay","acc":[0]},{"lab":"SPF result","acc":[2]},{"lab":"d= must…","acc":[4]},{"lab":"policy value","acc":[6]}]},"ex":"<p>An <b>unknown</b> relay means the message entered from infrastructure the real sender never uses — the Received chain is the path evidence. If the sending IP is not in the SPF record, SPF = <b>fail</b>. DKIM only helps when its d= domain <b>aligns</b> with the visible From domain; a valid signature from the wrong domain still fails DMARC. Policy p=<b>reject</b> instructs receivers to drop such mail outright (quarantine would only isolate it, and signing is what senders do, not receivers). Reading headers in this order — path, SPF, DKIM alignment, DMARC policy — settles most spoofing questions in one minute.</p>","hints":["Not-in-the-record means the check failed — which verdict word?","DMARC asks whether the signed domain matches the visible one — match is called alignment."]},{"id":"M23","th":"net","t":"rows","pts":10,"lab":"MATCH PROTOCOL TO SUSPICIOUS BEHAVIOR","sc":"<p>Meridian's junior analysts know the protocols but not their abuse patterns. You build the quick-reference card for the wall.</p>","q":"<p>Match each protocol to the suspicious behavior most typical of it.</p>","d":{"opts":["Long TXT queries with random subdomains","Repeated SMB admin-share access between servers","Outbound RDP from a workstation to the internet","Mass outbound mail from an internal host","Oversized ICMP payloads at fixed intervals"],"rows":[{"r":"<b>DNS (53)</b>","a":0},{"r":"<b>SMB (445)</b>","a":1},{"r":"<b>RDP (3389)</b>","a":2},{"r":"<b>SMTP (25)</b>","a":3},{"r":"<b>ICMP</b>","a":4}]},"ex":"<p>DNS: tunnels hide stolen data inside TXT records and long encoded names, because DNS is almost never blocked. SMB: admin shares (C$, ADMIN$) are how attackers copy tools and pull data between machines — lateral movement. RDP: workstations should not remote-desktop outward; that is a pivot or a tunnel to attacker infrastructure. SMTP: an internal host mailing the world is a compromised device becoming a phishing cannon. ICMP: ping traffic should carry small payloads — oversized echo requests at a fixed rhythm are a covert channel. Each protocol has a 'normal shape'; abuse is shape-breaking.</p>","hints":["Think which data each protocol can smuggle: DNS carries names, ICMP carries payload bytes.","Admin shares belong to the protocol Windows uses for file sharing and remote admin."]},{"id":"M24","th":"host","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>The sandbox finished detonating a sample that arrived as an 'invoice' on MER-WS-0155. Its behavior report follows.</p>","q":"<p>Select every line that shows persistence, command-and-control behavior, or suspicious file staging.</p>","d":{"filter":true,"sel":true,"correct":[2,3,5,7,8],"lines":["[FILE] Drops %APPDATA%\\SyncHelper.dll (unsigned, 84 KB)","[PROC] Runs with the same token as its parent (no elevation)","[REG] Adds HKCU\\…\\CurrentVersion\\Run key 'OneDriveSyncHelper'","[PROC] Creates scheduled task 'SyncMaintenance' (trigger: at logon)","[NET] DNS query os-update[.]vendor[.]example (A record)","[NET] Connects to hxxps://203[.]0[.]113[.]44:443/checkin every 45 s (±5 s)","[FILE] Reads %TEMP%\\cache.dat (its own file)","[NET] TLS certificate on 203[.]0[.]113[.]44 is registered to 'cloud-mail[.]example' (domain mismatch)","[FILE] Writes 214 files to %APPDATA%\\Roaming\\SyncHelper\\ (staging area)"]},"ex":"<p>Persistence: the Run key relaunches the malware at logon, and the scheduled task does it from the task scheduler — two independent survival mechanisms. Command and control: the fixed 45-second check-in is a beacon, and the TLS certificate belonging to a different domain is classic hosted-infrastructure camouflage. File staging: 214 files written into a fresh folder is collection behavior that usually precedes archiving and exfiltration. Dropping one DLL is context (execution), reading its own cache is neutral, and a vendor DNS lookup is normal. Sandbox reports are read exactly like this — by phase: execute, persist, call home, collect.</p>","hints":["Persistence = 'survives a reboot'. Which lines come back after a restart?","A fixed call-home rhythm plus mismatched certificate is controller traffic."]},{"id":"M25","th":"host","t":"logview","pts":10,"lab":"SELECT THE LINES","sc":"<p>Domain controller log export, 03:00–06:30. You are looking for the source of last night's login anomalies on the Meridian domain.</p>","q":"<p>Select every line that belongs to the password-spraying pattern (same source IP, many different account names).</p>","d":{"filter":true,"sel":true,"correct":[0,1,2,3,6,7],"lines":["03:02:11  Event 4625  Logon failed — account: ajones — src 10[.]10[.]7[.]99","03:02:14  Event 4625  Logon failed — account: bhughes — src 10[.]10[.]7[.]99","03:02:19  Event 4625  Logon failed — account: cdelgado — src 10[.]10[.]7[.]99","03:02:24  Event 4625  Logon failed — account: dfernandes — src 10[.]10[.]7[.]99","03:02:31  Event 4625  Logon failed — account: ajones — src 10[.]10[.]14[.]8 (own workstation)","03:05:47  Event 4624  Logon success — svc_backup — src 10[.]10[.]30[.]10 (backup server)","03:12:02  Event 4625  Logon failed — account: emorales — src 10[.]10[.]7[.]99","03:12:09  Event 4625  Logon failed — account: fkowalski — src 10[.]10[.]7[.]99","04:01:33  Event 4624  Logon success — j.rivera — src 10[.]10[.]14[.]23","05:20:18  Event 4672  Special privileges assigned — j.rivera","05:21:02  Event 4625  Logon failed — account: j.rivera — src 10[.]10[.]14[.]23 (own workstation)","06:15:00  Event 4688  New process created — chrome.exe"]},"ex":"<p>Spraying tries a few common passwords against many accounts from one source — here six different names from 10[.]10[.]7[.]99 in ten minutes, few attempts per account to stay under lockout rules. The 4625s from users' own workstations are typos, and the 4624 successes from the backup server and a normal user are routine — source context separates an attack from noise. Follow-ups: block the source, alert on 'many accounts, few attempts', and check whether any 4625 turned into a 4624 from that IP.</p>","hints":["Group the failures by source IP first; the attacking host will stand out immediately.","Spraying = few attempts × many accounts. Brute force = many attempts × one account."]},{"id":"M26","th":"tools","t":"slots","pts":10,"lab":"PUT THE HUNTING CYCLE IN ORDER","sc":"<p>Meridian launches its first formal threat-hunting program. You are asked to put the methodology steps in order for the team wiki.</p>","q":"<p>Order the threat-hunting cycle. One item belongs nowhere.</p>","d":{"mode":"seq","bank":["Form a hypothesis from a threat report","Collect the relevant logs and telemetry","Search for anomalies and pivot on findings","Escalate confirmed findings to incident response","Document lessons and tune detections","Skip documentation to save time"],"slots":[{"lab":"Hunt step 1","acc":[0]},{"lab":"Hunt step 2","acc":[1]},{"lab":"Hunt step 3","acc":[2]},{"lab":"Hunt step 4","acc":[3]},{"lab":"Hunt step 5","acc":[4]}]},"ex":"<p>The cycle runs: hypothesis (from intel: 'attackers abuse wscript in our sector') → data collection (the logs that could prove it) → search and pivot (anomalies lead to neighboring hosts and accounts) → escalation to IR when a hunt confirms reality → documentation and detection tuning, which converts a one-off hunt into permanent coverage. Skipping documentation breaks the loop — next quarter the same gap is still open. Hunts are hypothesis-driven; they complement, not replace, automated alerts.</p>","hints":["You cannot search before you have data, and you cannot hunt without an idea worth testing.","The last step feeds tomorrow's alerts — what closes the loop?"]},{"id":"M27","th":"host","t":"multi","pts":10,"lab":"SELECT ALL THAT APPLY","sc":"<p>Memory and process telemetry from MER-WS-0142 arrives after the C2 finding. Your senior asks which artifacts actually prove code injection into a legitimate process.</p>","q":"<p>Select all findings that point to code injection (or a faked system process).</p>","d":{"ch":["A writable AND executable memory region inside a signed Windows process","CreateRemoteThread called from a word processor into explorer.exe","svchost.exe whose parent process is not services.exe","A new TLS certificate installed on a web server","A USB storage device attached and safely blocked"],"a":[0,1,2]},"ex":"<p>Injection means foreign code runs inside someone else's process: an RWX (writable + executable) region in a signed binary is where it lives, and CreateRemoteThread is how it often gets started across process boundaries. Legitimate svchost.exe is always born from services.exe — a different parent means either a fake copy or a hollowed process (real binary on disk, swapped memory inside). TLS certificates and blocked USB devices are routine events. These three artifacts together would be tagged under defense evasion and execution in an ATT&CK-style report.</p>","hints":["Injection lives in memory: look for permissions that should not coexist (write + execute).","System processes have famous parents — svchost must come from services.exe."]},{"id":"M28","th":"tools","t":"branch","pts":10,"lab":"CHOOSE YOUR NEXT STEP","sc":"<p>14:40. Alert: the account <span class='mono'>svc_archive_bak</span> logged on successfully on MER-JMP01. This account is a honeytoken: it exists only inside a decoy 'password document' planted on the file share, and it is disabled for real use.</p>","q":"<p>Work the deception-alert playbook.</p>","d":{"stages":[{"sc":"<p><b>Step 1.</b> What does this alert mean?</p>","ch":["A true positive — only a decoy reader could know it","A normal service logon with a stored password","Monitoring noise from a chatty host","A scheduled quarterly account test"],"a":0,"fb":["Correct — honeytokens have no legitimate use; any use means someone took the bait.","Deception alerts carry near-zero false positives precisely because nothing real ever touches them."]},{"sc":"<p><b>Step 2.</b> Next action?</p>","ch":["Pull the 4624 details and isolate the source host","Ignore it because honeytokens are fake accounts","Delete the honeytoken account to stop the alerts","Reboot the jump host during business hours"],"a":0,"fb":["Right — the logon record names the intruder's position; isolate and investigate from there.","The fake account is evidence — deleting it destroys the trail."]},{"sc":"<p><b>Step 3.</b> Wider action?</p>","ch":["Hunt the host's activity and check the other traps","Do nothing more — one trap is enough","Rename the honeytoken and hope for the best","Send a company-wide survey about password hygiene"],"a":0,"fb":["Correct — what else did the intruder read? Other traps tell you how far they got.","Deception data is reconnaissance about the attacker — use it."]}]},"ex":"<p>Deception flips the usual problem: there are no false positives, because legitimate work never touches bait. The flow: confirm what the trap proves (the intruder read the decoy document), use the logon event (4624) to locate their foothold and contain it, then sweep the other honeytokens and the source host's history — traps are telemetry about the attacker's path. Deleting traps or ignoring them throws away your best signal source.</p>","hints":["Ask: who could possibly know this account exists? The decoy document is the only source.","The alert is the start of a trail, not the whole trail."]},{"id":"M29","th":"tools","t":"slots","pts":10,"lab":"FILL THE SUMMARY","sc":"<p>Friday, 16:00. You write the SOC weekly summary for Meridian's CISO. The numbers: 1,240 alerts reviewed, the new vulnerability scanner caused most of the noise, two findings escalated, one host validated with a capture.</p>","q":"<p>Fill the four gaps with the correct terms.</p>","d":{"mode":"seq","seg":["<b>SOC weekly summary (Oct 1–7).</b> Analysts reviewed 1,240 alerts; 86% were closed as "," after tuning the port-scan rule. The new vulnerability scanner was missing from the network ",", so its scheduled scans kept tripping detections. Two alerts were confirmed as "," and escalated to incident response; for the busiest host, analysts validated the finding with a full "," capture."],"bank":["false positives","baseline","true positives","packet","zero-days","honeypot","sandbox","heuristics"],"slots":[{"lab":"disposition","acc":[0]},{"lab":"missing registration","acc":[1]},{"lab":"confirmed findings","acc":[2]},{"lab":"capture type","acc":[3]}]},"ex":"<p>Alerts disproved by review are <b>false positives</b> — here caused by a scanner absent from the <b>baseline</b> (the record of what normal traffic looks like). Once registered, the noise stops. Confirmed attacks are <b>true positives</b> and go to incident response, and a <b>packet capture</b> is the ground-truth evidence that settles what actually crossed the wire. Zero-days, honeypots, sandboxes, and heuristics are real words but do not fit these sentences — vocabulary precision is what makes reports actionable.</p>","hints":["Alerts that review disproves have a standard two-word name.","The evidence file that records actual network traffic is called a what?"]},{"id":"M30","th":"email","t":"branch","pts":10,"lab":"CHOOSE YOUR NEXT STEP","sc":"<p>15:20. Fifteen Meridian users received 'Your document is ready — sign here' emails imitating DocuSign, sent from docuslgn[.]example (note the lowercase L). Two users replied asking if it was real.</p>","q":"<p>Run the campaign response, step by step.</p>","d":{"stages":[{"sc":"<p><b>Step 1.</b> Two reports so far. First move?</p>","ch":["Cluster all copies by sender, subject, and link","Wait for more users to report the same mail","Reply to the sender to ask who they are","Update the company mail disclaimer text"],"a":0,"fb":["Correct — pivot on campaign artifacts; fifteen sends mean the search will find dozens more.","Waiting grows the victim pool; replying exposes live mailboxes."]},{"sc":"<p><b>Step 2.</b> The link redirects twice and lands on a page copying the company SSO login.</p>","ch":["Identify a credential-harvesting kit behind the redirects","Report the page as a slow document service","Classify the page as legitimate marketing","Open a low-priority DNS troubleshooting ticket"],"a":0,"fb":["Right — redirect chains hide the final host, and the SSO copy exists to capture passwords.","The redirect layer exists to survive blocklists — always follow it to the end."]},{"sc":"<p><b>Step 3.</b> How do you find who is affected?</p>","ch":["Correlate proxy logs for clicks and credential POSTs","Ask around the office who remembers the email","Check the printers for queued documents","Assume nobody clicked and file the report"],"a":0,"fb":["Correct — logs identify clickers and, more importantly, who typed credentials into the fake page.","A POST to the harvest page is the moment exposure becomes compromise."]},{"sc":"<p><b>Step 4.</b> For users who submitted credentials?</p>","ch":["Force resets, revoke sessions, and blocklist the domain","Nothing — the page looked real but was safe","Email them the link again to test it","Reset the printer firmware tonight"],"a":0,"fb":["Right — stolen credentials must die: reset, revoke sessions, block the infrastructure.","Assumed-safe is not a state; credentials on a harvest page are compromised credentials."]}]},"ex":"<p>Campaign response pivots on artifacts: cluster by sender/subject/URL, purge tenant-wide, then follow the redirect chain to the harvest kit. Proxy and URL logs separate clickers from submitters — submitters need immediate credential death (reset + session revocation), everyone else needs awareness. Blocklist the domains at the gateway and proxy. The keywords: phishing URL, redirect chain, credential harvesting, scoping by logs.</p>","hints":["One report is a campaign sample — search for its twins.","Who actually typed a password? That answer is in the POST requests, not in opinions."]}];

function newState(){

/* ---------------- grading (per-element, partial credit) ---------------- */
function gradeEx(i){
  var ex=EX[i],d=ex.d,a=S.ans[i],L=S.layout[i];
  var els=[],got=[],want=[],refs=[],okc=0,tot=0,den=0,t,j,k;
  function push(st,g,w,ref){els.push({st:st,ref:(ref===undefined?null:ref)});got.push(g);want.push(w);if(st==="ok")okc++;}
  if(ex.t==="qcm"){
    den=1;
    var pos=(typeof a==="number")?a:-1,ok=pos>=0&&L.perm[pos]===d.a;
    push(ok?"ok":(pos>=0?"bad":"miss"),pos>=0?stripHtml(d.ch[L.perm[pos]]):"—",stripHtml(d.ch[d.a]));
  }else if(ex.t==="multi"){
    den=d.a.length;
    var sel={};(a||[]).forEach(function(p){sel[p]=true;});
    L.perm.forEach(function(orig,pos){
      if(d.a.indexOf(orig)>=0){push(sel[pos]?"ok":"miss",sel[pos]?stripHtml(d.ch[orig]):"(not selected)",stripHtml(d.ch[orig]),orig);}
      else if(sel[pos]){push("bad",stripHtml(d.ch[orig]),"(should not be selected)",orig);}
    });
  }else if(ex.t==="rows"){
    den=d.rows.length;
    d.rows.forEach(function(r,k2){
      var p=(a&&a[k2]>=0)?a[k2]:-1,ok=p>=0&&L.perm[p]===r.a;
      push(ok?"ok":(p>=0?"bad":"miss"),p>=0?stripHtml(d.opts[L.perm[p]]):"—",stripHtml(d.opts[r.a]),k2);
    });
  }else if(ex.t==="slots"){
    if(d.mode==="seq"){
      den=d.slots.length;
      d.slots.forEach(function(sl,k2){
        var arr=(a&&a[k2])||[],p=arr.length?arr[0]:-1,orig=p>=0?L.bank[p]:-1,ok=p>=0&&sl.acc.indexOf(orig)>=0;
        push(ok?"ok":(p>=0?"bad":"miss"),p>=0?stripHtml(d.bank[orig]):"—",stripHtml(d.bank[sl.acc[0]]),k2);
      });
    }else{
      den=0;d.slots.forEach(function(sl){den+=sl.acc.length;});
      var where={};
      d.slots.forEach(function(sl,k2){((a&&a[k2])||[]).forEach(function(p){where[L.bank[p]]=k2;});});
      d.slots.forEach(function(sl,k2){
        sl.acc.forEach(function(orig){
          var w=(where[orig]===undefined)?-1:where[orig];
          push(w===k2?"ok":(w>=0?"bad":"miss"),stripHtml(d.bank[orig]),stripHtml(sl.lab),orig);
        });
      });
      d.slots.forEach(function(sl,k2){((a&&a[k2])||[]).forEach(function(p){var orig=L.bank[p];
        if(d.slots.every(function(s2){return s2.acc.indexOf(orig)<0;})&&els.every(function(e){return e.ref!==orig;})){
          push("bad",stripHtml(d.bank[orig]),"(belongs in no slot)",orig);}});});
    }
  }else if(ex.t==="logview"){
    den=d.correct.length;
    var sel2={};(a||[]).forEach(function(x){sel2[x]=true;});
    d.correct.forEach(function(ci){push(sel2[ci]?"ok":"miss",sel2[ci]?("Line "+(ci+1)):("Line "+(ci+1)+" not selected"),shortLine(d.lines[ci]),ci);});
    (a||[]).forEach(function(ci){if(d.correct.indexOf(ci)<0){push("bad","Line "+(ci+1),"(not a target line)",ci);}});
  }else if(ex.t==="term"){
    den=d.tasks.length;
    d.tasks.forEach(function(tk,k2){
      var ok=!!(a&&a.done[k2]);
      var c="—";
      if(ok&&(a&&a.hist)){for(j=a.hist.length-1;j>=0;j--){if(a.hist[j].ti===k2&&a.hist[j].ok){c=a.hist[j].c;break;}}}
      push(ok?"ok":"miss",ok?("command: "+c):"—",tk.goal,null);
    });
  }else if(ex.t==="branch"){
    den=d.stages.length;
    d.stages.forEach(function(sg,k2){
      var p=(a&&a[k2]>=0)?a[k2]:-1,ok=p>=0&&L.stages[k2][p]===sg.a;
      push(ok?"ok":(p>=0?"bad":"miss"),p>=0?stripHtml(sg.ch[L.stages[k2][p]]):"—",stripHtml(sg.ch[sg.a]),k2);
    });
  }
  tot=Math.max(els.length,1);
  return {els:els,got:got,want:want,score:den?ex.pts*okc/den:0,max:ex.pts,okc:okc,den:den};
}

/* log line syntax highlighting — only applied to plain-text lines */
function hlLog(raw){
  if(/[<>]|&/.test(raw))return raw;   /* markup or entities: insert as authored */
  var s=esc(raw);
  s=s.replace(/(^|\s)((?:\d{1,2}:)?\d{2}:\d{2}(?::\d{2})?)(?=\s)/g,'$1<span class="hl-t">$2</span>');
  s=s.replace(/(\d{1,3}(?:\[\.\]\d{1,3}){3})/g,'<span class="hl-ip">$1</span>');
  s=s.replace(/\b(EID|Event|EventCode)\s?(\d{3,4})\b/g,'<span class="hl-eid">$1 $2</span>');
  s=s.replace(/\b(GET|POST|PUT|DELETE|HEAD|OPTIONS|TRACE|PATCH)\b/g,'<span class="hl-verb">$1</span>');
  s=s.replace(/&quot; (\d{3}) /g,'&quot; <span class="hl-s2">$1</span> ');
  s=s.replace(/&quot; (\d{3})$/gm,'&quot; <span class="hl-s2">$1</span>');
  s=s.replace(/\b(4\d\d|5\d\d)\s+\d{1,6}\b/g,'<span class="hl-s4">$1</span>');
  return s;
}

        var cls="choice "+(mark?(pos===p?(orig===sg.a?"ok":"bad"):(pos===corrPos2&&p>=0?"miss":"")):(p===pos?"sel":""));
        var dis=(mark||p>=0)?"":" data-act=\"stage\" data-stage=\""+k+"\" data-pos=\""+pos+"\"";
        h+='<div class="'+cls+'"'+dis+' role="button" tabindex="0"><span>'+sg.ch[orig]+'</span></div>';
      });
      if(mark){h+='<div class="outcome '+(st==="ok"?"good":"bad")+'">'+(st==="ok"?"✓ <span>Correct.</span>":"✕ <span>Best next step: <b>"+sg.ch[sg.a]+"</b></span>")+'</div>';}
      else if(p>=0){var o2=L.stages[k][p];h+='<div class="outcome '+(o2===sg.a?"good":"bad")+'">'+(o2===sg.a?"✓":"✕")+' <span>'+(sg.fb&&sg.fb[o2]?sg.fb[o2]:(o2===sg.a?"Good choice — continue.":"Not the best next step."))+'</span></div>';}
      h+='</div>';
    }
    if(!mark&&upto<d.stages.length){h+='<p class="mono" style="color:#94a3b8">'+(d.stages.length-upto)+' more step(s) unlock as you answer.</p>';}
  }
  return h;
}
function firstUnanswered(arr){for(var k=0;k<arr.length;k++){if(arr[k]<0)return k;}return arr.length-1;}
function hintHTML(i){
  var hs=EX[i].hints||[],h="",k;
  for(k=0;k<(S.hints[i]||0)&&k<hs.length;k++){h+='<div class="hintbox">🔔 <b>Hint '+(k+1)+':</b> '+hs[k]+'</div>';}
  return h;
}

/* ---------------- feedback panel ---------------- */
function fbHTML(i){
  var ex=EX[i],r=S.graded[i];
  var hp=Math.round(HINTPCT*ex.pts*(S.hints[i]||0)*10)/10;
  var earned=Math.max(0,r1(r.score-hp));
  var lab=(earned>=r.max-0.001)?"full":(earned>0?"partial":"zero");
  var tag='<span class="tag '+(lab==="full"?"ok":(lab==="partial"?"warn":"bad"))+'">'+(lab==="full"?"✓ full":(lab==="partial"?"◐ partial":"✕ zero"))+'</span>';
  var h='<div class="fb"><div class="sum">'+tag+' You earned <b>'+earned+' / '+r.max+'</b> points on this exercise.'+(hp?' <span class="tag warn">includes −'+hp+' hint cost</span>':"")+'</div><div>';
  r.els.forEach(function(e,k){
    h+='<div class="themeline"><span class="tag '+e.st+'">'+(e.st==="ok"?"✓":(e.st==="bad"?"✕":"⚠"))+" "+STXT[e.st]+'</span> Your answer: <b>'+esc(r.got[k])+'</b>'+(e.st!=="ok"?' — correct: <b>'+esc(r.want[k])+'</b>':"")+'</div>';
  });
  h+='</div><div class="explain">'+ex.ex;
  if(lab!=="full"){h+='<p><b>Focus next:</b> redo this exercise type and revise the keywords listed on the intro screen.</p>';}
  h+='</div></div>';
  return h;
}

/* ---------------- interactions ---------------- */
function ensure(i){if(S.ans[i]===undefined)S.ans[i]=defAns(i);}
function placeItem(i,slot,p){
  var ex=EX[i],arr=S.ans[i];
  for(var k=0;k<arr.length;k++){                 /* an item lives in at most one slot */
    var ix=arr[k].indexOf(p);
    if(ix>=0&&k!==slot)arr[k].splice(ix,1);
  }
  if(ex.d.mode==="seq"){arr[slot]=[p];}
  else{if(arr[slot].indexOf(p)<0)arr[slot].push(p);}
  S.picked=null;
}
function removeItem(i,slot,p){var arr=S.ans[i][slot],ix=arr.indexOf(p);if(ix>=0)arr.splice(ix,1);}
function doCheck(){
  if(!S||S.done)return;
  var i=exAt(S.cur),ex=EX[i];
  ensure(i);
  var res=gradeEx(i);
  S.graded[i]=res;S.checked[i]=true;delete S.skip[i];S.picked=null;
  S.earned[i]=Math.max(0,r1(res.score-HINTPCT*ex.pts*(S.hints[i]||0)));
  S.pauseC=true;
  renderExam();updateHUD();
}
function doSkip(){if(!S||S.done)return;var i=exAt(S.cur);if(!S.checked[i])S.skip[i]=true;goNext();}
function doHint(){
  if(!S||S.done)return;var i=exAt(S.cur),ex=EX[i],hs=ex.hints||[];
  if(S.hints[i]>=hs.length)return;
  S.hints[i]=(S.hints[i]||0)+1;
  if(S.checked[i]){S.earned[i]=Math.max(0,r1((S.graded[i]?S.graded[i].score:0)-HINTPCT*ex.pts*S.hints[i]));}
  renderExam();updateHUD();
}
function doRevise(){if(!S||S.done)return;var i=exAt(S.cur);S.checked[i]=false;delete S.graded[i];delete S.earned[i];renderExam();}
function leaveEx(){/* leaving the current exercise always ends its review pause */
  S.pauseC=false;S.picked=null;
}
function goNext(){if(!S||S.done)return;leaveEx();if(S.cur<EX.length-1){S.cur++;renderExam();updateHUD();}else{askFinish();}}
function goPrev(){if(!S||S.done)return;leaveEx();if(S.cur>0){S.cur--;renderExam();updateHUD();}}
function goTo(k){if(!S||S.done)return;if(k===S.cur)return;leaveEx();S.cur=k;renderExam();updateHUD();}
function doPause(){if(!S||S.done)return;S.pauseM=!S.pauseM;lastTick=Date.now();renderExam();}
function openNav(){var p=$("#navp");if(p)p.hidden=!p.hidden;updateHUD();}
function showConfirm(html){var m=document.createElement("div");m.className="modal";m.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(m);}
function closeModal(){var m=$(".modal");if(m)m.remove();}
function askFinish(){
  var nC=0,nA=0,nS=0;
  EX.forEach(function(_,ix){if(S.checked[ix])nC++;else if(hasAns(ix))nA++;if(S.skip[ix])nS++;});
  showConfirm('<h2>Submit the exam?</h2><p>Checked: <b>'+nC+'</b> · Answered but not checked: <b>'+nA+'</b> (graded as they are now) · Skipped: <b>'+nS+'</b> (excluded from scoring).</p><p class="mono" style="color:#94a3b8">Skipped exercises are removed from both the points and the denominator.</p><div class="actions"><button class="primary" data-act="finish">Submit now</button><button data-act="closeModal">Keep working</button></div>');
}
function doFinish(auto){
  if(S&&S.done)return;
  closeModal();
  var n=EX.length,tot=0,got=0,anyNonSkip=false;
  for(var k=0;k<n;k++){
    var ix=exAt(k),ex=EX[ix];
    var answered=S.checked[ix]||hasAns(ix);
    if(S.skip[ix]||!answered){S.skip[ix]=true;continue;}
    anyNonSkip=true;
    if(!S.checked[ix]){var res=gradeEx(ix);S.graded[ix]=res;S.checked[ix]=true;S.earned[ix]=Math.max(0,r1(res.score-HINTPCT*ex.pts*(S.hints[ix]||0)));}
    tot+=ex.pts;got+=S.earned[ix];
  }
  if(!anyNonSkip||tot===0){
    showConfirm('<h2>Cannot submit yet</h2><p>⚠ All exercises are skipped. Answer at least one exercise before submitting.</p><div class="actions"><button data-act="closeModal">Back to the exam</button></div>');
    return;
  }
  S.done=true;S.auto=!!auto;S.finalGot=r1(got);S.finalTot=tot;S.pauseM=false;S.pauseC=false;
  render();
}
function renderResults(){
  var got=S.finalGot,tot=S.finalTot;
  var scoreI=Math.round(got),totI=Math.round(tot);
  var pct=totI?Math.round(scoreI/totI*100):0,passed=pct>=PASSMARK;
  var nSk=0;EX.forEach(function(_,ix){if(S.skip[ix])nSk++;});
  var rows="";
  for(var k=0;k<EX.length;k++){
    var ix=exAt(k),ex=EX[ix],sk=!!S.skip[ix];
    var lab,max=ex.pts,en=S.checked[ix]?(S.earned[ix]||0):0;
    if(sk){lab='<span class="tag warn">⏭ skipped — not counted</span>';}
    else{lab=(en>=max-0.001)?'<span class="tag ok">✓ full</span>':((en>0)?'<span class="tag warn">◐ partial</span>':'<span class="tag bad">✕ zero</span>');}
    var ansTxt="—";
    if(!sk&&S.graded[ix]){
      var r=S.graded[ix];
      ansTxt=r.els.map(function(e,q){
        var t=STXT[e.st]+": "+r.got[q];
        if(e.st!=="ok")t+=" → correct: "+r.want[q];
        return t;
      }).join(" · ");
    }
    rows+='<tr><td>'+(k+1)+'</td><td>'+esc(THEMES[ex.th])+'</td><td>'+lab+'</td><td>'+(sk?"—":en+" / "+max)+'</td><td>'+esc(ansTxt)+'</td><td><details class="exp"><summary>Explanation</summary><div class="explain">'+ex.ex+'</div></details></td></tr>';
  }
  var panel=passed?'<div class="passpanel"><h2>🎉 PASS — certificate panel</h2><p>Congratulations'+(S.user?", "+esc(S.user):"")+'! You reached <b>'+pct+'%</b> (pass mark '+PASSMARK+'%).</p><p class="mono">CyberPulse Academy · '+esc(META.title)+' · '+new Date().toLocaleDateString()+'</p></div>':'<div class="failpanel"><h2>✕ FAIL — retake needed</h2><p>You reached <b>'+pct+'%</b>, below the '+PASSMARK+'% pass mark. You must retake this exam.</p><div class="actions"><button class="primary" data-act="retake">Retake exam</button></div></div>';
  var h='<div class="hero"><h1>Results — '+esc(META.title)+'</h1><div class="bigres">'+pct+'%</div>'+
  '<p>'+r1(got)+' points earned out of '+r1(tot)+' possible ('+nSk+' skipped and excluded).</p>'+panel+
  '<h2>Per-exercise report</h2><div style="overflow-x:auto"><table class="rep"><thead><tr><th>#</th><th>Theme</th><th>Result</th><th>Points</th><th>Your answers</th><th>Learn</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div class="actions"><button class="primary" data-act="retake">Retake exam</button></div></div>';
  $("#app").innerHTML=h;
  if(!S.fired){S.fired=true;reportScore(scoreI,totI);}
}
function reportScore(correct,total){
  var percent=Math.round((correct/total)*100);
  try{
    parent.postMessage({type:"CYBERPULSE_SCORE",topicId:TOPIC,score:correct,total:total,percent:percent,passed:percent>=PASSMARK},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}

/* ---------------- terminal ---------------- */
function termRender(i){
  var d=EX[i].d,a=S.ans[i],out=$("#termout");
  if(!out)return;
  if(!a){a={hist:[],done:[]};S.ans[i]=a;}
  if(!a.hist)a.hist=[];
  var h="";
  d.boot.forEach(function(b){h+='<div class="tl sys">'+esc(b)+'</div>';});
  (a.hist||[]).forEach(function(m){
    h+='<div class="tl cmd">'+esc(d.ps+" "+m.c)+'</div>';
    if(m.o)h+='<div class="tl '+esc(m.cls||"")+'">'+m.o+'</div>';
  });
  if(a.hist&&a.hist.length&&!a.hist[a.hist.length-1].o){h+='<div class="tl err">'+esc("No pending objective matches that command. Type help to list objectives.")+'</div>';}
  out.innerHTML=h;out.scrollTop=out.scrollHeight;
}
function termExec(i,cmd){
  var d=EX[i].d,a=S.ans[i];
  if(!cmd)return;
  if(cmd==="clear"){a.hist=[];termRender(i);return;}
  a.hist.push({c:cmd,o:null});
  if(cmd==="help"||cmd==="?"){
    var o=d.tasks.map(function(tk,k2){return (a.done[k2]?"[done] ":"[pending] ")+tk.goal;}).join("\n");
    a.hist[a.hist.length-1]={c:cmd,o:esc("Objectives:\n"+o),cls:"sys"};
  }else{
    var doneOne=false;
    for(var k2=0;k2<d.tasks.length;k2++){
      if(a.done[k2])continue;
      if(new RegExp(d.tasks[k2].re,"i").test(cmd)){a.done[k2]=true;a.hist[a.hist.length-1]={c:cmd,o:esc(d.tasks[k2].out)+"\n✓ objective "+(k2+1)+" complete",cls:"sys",ti:k2,ok:true};doneOne=true;break;}
    }
  }
  termRender(i);
}

/* ---------------- wiring ---------------- */
function wireEx(i){
  var ex=EX[i];
  if(ex.t==="term"){
    var inp=$("#tmin");
    termRender(i);
    if(inp&&!inp.disabled){
      inp.addEventListener("keydown",function(ev){
        if(ev.key==="Enter"){var v=inp.value.trim();inp.value="";termExec(i,v);}
      });
      setTimeout(function(){try{inp.focus();}catch(e){}},50);
    }
  }
  if(ex.t==="logview"&&ex.d.filter){
    var fl=$("#flt");
    if(fl)fl.addEventListener("input",function(){
      var q=fl.value.toLowerCase();
      $all("#lns .ln").forEach(function(l){l.hidden=q?!l.getAttribute("data-s").includes(q):false;});
    });
  }
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el)return;
  var act=el.getAttribute("data-act");
  if(!S)return;
  var i=exAt(S.cur);
  /* after Check the answer is locked — only Revise can unlock it */
  if(S.started&&!S.done&&S.checked[i]&&["pick","bpick","unpick","spick","linepick","stage"].indexOf(act)>=0)return;
  FOCUSD=selFromEl(el);
  if(act==="start"){S.started=true;lastTick=Date.now();render();return;}
  if(act==="pick"){
    ensure(i);
    var pos=+el.getAttribute("data-pos");
    if(EX[i].t==="qcm"){S.ans[i]=pos;}
    else{var arr=S.ans[i],ix=arr.indexOf(pos);if(ix>=0)arr.splice(ix,1);else arr.push(pos);}
    renderExam();return;
  }
  if(act==="bpick"){
    ensure(i);
    var p=+el.getAttribute("data-pos");
    if(S.picked&&S.picked.i===i&&S.picked.pos===p){S.picked=null;}else{S.picked={i:i,pos:p};}
    renderExam();return;
  }
  if(act==="unpick"){
    ensure(i);
    var sl=el.closest(".slot");
    if(sl)removeItem(i,+sl.getAttribute("data-slot"),+el.getAttribute("data-pos"));
    renderExam();return;
  }
  if(act==="spick"){
    ensure(i);
    var sl2=+el.getAttribute("data-slot");
    if(S.picked&&S.picked.i===i){placeItem(i,sl2,S.picked.pos);}
    renderExam();return;
  }
  if(act==="linepick"){
    ensure(i);
    var li=+el.getAttribute("data-line"),arr2=S.ans[i],ix2=arr2.indexOf(li);
    if(ix2>=0)arr2.splice(ix2,1);else arr2.push(li);
    renderExam();return;
  }
  if(act==="stage"){
    ensure(i);
    S.ans[i][+el.getAttribute("data-stage")]=+el.getAttribute("data-pos");
    renderExam();return;
  }
  if(act==="check"){doCheck();return;}
  if(act==="skip"){doSkip();return;}
  if(act==="hint"){doHint();return;}
  if(act==="revise"){doRevise();return;}
  if(act==="next"){goNext();return;}
  if(act==="prev"){goPrev();return;}
  if(act==="pause"){doPause();return;}
  if(act==="openNav"){openNav();return;}
  if(act==="navq"){goTo(+el.getAttribute("data-k"));return;}
  if(act==="askFinish"){askFinish();return;}
  if(act==="finish"){doFinish(false);return;}
  if(act==="closeModal"){closeModal();return;}
  if(act==="retake"){S=newState();S.started=true;lastTick=Date.now();render();return;}
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(!el.getAttribute)return;
  if(!S||S.done)return;
  var act=el.getAttribute("data-act");
  var i=exAt(S.cur);
  if(act==="opt"&&!S.checked[i]){
    ensure(i);
    S.ans[i][+el.getAttribute("data-row")]=+el.value;
  }
  if(act==="pick"&&!S.checked[i]&&(EX[i].t==="qcm"||EX[i].t==="multi")){
    /* keyboard arrow selection on radios fires change without click */
    ensure(i);
    var pos=+el.getAttribute("data-pos");
    if(EX[i].t==="qcm"){S.ans[i]=pos;}
    else{var arr=S.ans[i],ix=arr.indexOf(pos);if(ix>=0)arr.splice(ix,1);else arr.push(pos);}
    FOCUSD=selFromEl(el);
    renderExam();updateHUD();
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){closeModal();return;}
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.getAttribute){
    var da=ev.target.getAttribute("data-act");
    if(da&&["INPUT","SELECT","TEXTAREA","A"].indexOf(ev.target.tagName)<0&&ev.target.tagName!=="BUTTON"){
      ev.preventDefault();ev.target.click();
    }
  }
});
document.addEventListener("dragstart",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act='bpick'],[data-act='unpick']"):null;
  if(el){ev.dataTransfer.setData("text/plain",el.getAttribute("data-pos"));ev.dataTransfer.effectAllowed="move";}
});
document.addEventListener("dragover",function(ev){
  var s=ev.target.closest?ev.target.closest(".slot"):null;
  if(s){ev.preventDefault();s.classList.add("over");}
});
document.addEventListener("dragleave",function(ev){
  var s=ev.target.closest?ev.target.closest(".slot"):null;
  if(s)s.classList.remove("over");
});
document.addEventListener("drop",function(ev){
  var s=ev.target.closest?ev.target.closest(".slot"):null;
  if(!s)return;
  ev.preventDefault();s.classList.remove("over");
  var i=exAt(S.cur);ensure(i);
  var dp=ev.dataTransfer.getData("text/plain");
  if(!S.picked&&dp!==""){S.picked={i:i,pos:+dp};}
  if(S.picked&&S.picked.i===i){placeItem(i,+s.getAttribute("data-slot"),S.picked.pos);renderExam();}
});

/* ---------------- timer ---------------- */
setInterval(function(){
  var now=Date.now();
  if(!S||!S.started||S.done){lastTick=now;return;}
  if(S.pauseM||S.pauseC){lastTick=now;updateHUD();return;}
  var dt=Math.floor((now-lastTick)/1000);
  if(dt>0){S.left=Math.max(0,S.left-dt);lastTick=now;}
  updateHUD();
  if(S.left<=0){doFinish(true);}
},400);

/* ---------------- site handshake + boot ---------------- */
window.addEventListener("message",function(ev){
  var d=ev.data;
  if(!d)return;
  if(d.type!=="CYBERPULSE_INIT"&&d.type!=="CYBERMASTERY_INIT")return;
  if(S&&d.username){S.user=d.username;}
  var g=$("#greet");
  if(g&&d.username)g.textContent="Ready, "+d.username+" — the score is reported only at the results screen.";
});
S=newState();
var __booted=false;
function __boot(){if(__booted)return;__booted=true;render();}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",__boot);}
else{__boot();}

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
