<script>
/* ===========================================================================

   =========================================================================== */

/* ---------------- site metadata (single source of truth) ---------------- */
var META = (function () {
  try {
    return JSON.parse(document.getElementById('cm-exercise-meta').textContent);
  } catch (e) {

             questionCount:0, estimatedMinutes:60, passMark:70 };

var USER = { name:'', country:'', locale:'en' };
var CERT = 'CompTIA CySA+';
var PTS = 10;                                  /* points per exercise, before hints */
var SECONDS = META.estimatedMinutes * 60;      /* the metadata drives the real timer */

/* ---------------- keyword panel (Step 1 extraction) ---------------- */
const KEYWORDS = [
 { theme:'Vulnerability Management Fundamentals', terms:['vulnerability','exposure','threat','risk','attack surface','attack surface management','asset inventory','CVE','CVSS base score','EPSS','CWE','zero-day','vulnerability scanner','authenticated scan','unauthenticated scan','agent-based scan','agentless scan','internal scan','external scan','scan credentials','false positive','false negative','true positive','true negative','vulnerability validation','configuration baseline','CIS Benchmarks','STIG','configuration drift','hardening','least functionality','legacy system','end-of-life software','shadow IT','golden image'] },
 { theme:'Scanning, Testing & Attack Surface', terms:['vulnerability assessment','penetration test','black box','white box','gray box','rules of engagement','scoping','proof of exploitation','Nessus','OpenVAS','Qualys','Metasploit','Burp Suite','BloodHound','bug bounty','responsible disclosure','vulnerability disclosure program','safe harbour','exploit code maturity','PoC'] },
 { theme:'Prioritization & Response Workflow', terms:['risk-based prioritization','CVSS temporal score','CVSS environmental score','CISA KEV','exploited in the wild','asset criticality','business impact','patch management','patch Tuesday','remediation','mitigation','compensating control','workaround','virtual patch','SLA','maintenance window','emergency change','rollback','verification rescan','ticket workflow','vulnerability aging','MTTD','MTTR','MTTP','patch compliance rate','risk register','risk heat map','prioritization matrix','remediation deadline','exception request','risk acceptance','risk deferral','residual risk','risk treatment'] },
 { theme:'Governance, Risk & Compliance', terms:['PCI DSS','HIPAA','GDPR','SOX','72-hour breach notification','regulatory reporting','data classification','due care','due diligence','third-party risk','supply chain risk','SBOM','vendor management','service level agreement','MOU','NDA','security policy','exception expiry','risk owner','audit trail','CISO','asset owner','system administrator','legal counsel','third-party risk manager'] },
 { theme:'Leadership & Communication', terms:['vision','mission','strategy','goal setting','security roadmap','KPI','KRI','metrics reporting','executive brief','board reporting','business case','budget justification','ROI','stakeholder management','non-technical communication','risk communication','security awareness','team development','mentoring','delegation','decision making under pressure','incident command','ethics','security culture','risk appetite','risk tolerance','security governance','business alignment','technical advice','legal advice','interpersonal skills','appropriate levels of protection'] }
];

/* -----------------------------------------------------------------------
   STEP 2 — exercises (32, all MEDIUM severity)
   ----------------------------------------------------------------------- */


/* ---------------- exercises (Step 2) ---------------- */
const EXERCISES = [

/* ---------------- H01 ---------------- */
{
 id:'H01', elements:1, theme:'Prioritization & Response Workflow', type:'hotspot', title:'The playbook that never fails',
 context:'You review a merge request against the production patching playbook. The author explains in the description: "the pipeline kept going red when a server was unreachable, so I made the run tolerant." The change is already merged and ran twice last night.',
 prompt:'Click the single line that turns a failed patch run into a false success.',
 lines:[
  '- name: Patch production fleet',
  '  hosts: prod_linux',
  '  become: true',
  '  serial: 1',
  '  tasks:',
  '    - name: Upgrade all packages',
  '      ignore_errors: true     # keep the play from stopping',
  '      ansible.builtin.dnf:',
  '        name: "*"',
  '        state: latest',
  '    - name: Restart services',
  '      ansible.builtin.service:',
  '        name: "{{ item }}"',
  '        state: restarted',
  '      loop: "{{ restart_list }}"',
  '    - name: Record the run in the compliance log',
  '      ansible.builtin.copy:',
  '        content: "{{ ansible_date_time.iso8601 }} run complete"',
  '        dest: /var/log/patching.log'],
 answerLine:6,
 explain:'With ignore_errors set on the task, a failed package upgrade no longer stops the play. The host is skipped, the run finishes green, and the last task writes "run complete" into the compliance log. The dashboard now says the fleet is patched while some servers were never touched. The tempting wrong answer is state: latest, but pinning every package version is not how patching works — using the latest security release is exactly the point. The real fault is the error handling, not the version policy.',
 focus:'Look for controls that convert failure into silence: ignore_errors, continue on error, || true, and success messages written unconditionally.',
 hint1:'One line is about how the play reacts when a task fails, not about which packages are installed.',
 hint2:'The compliance log message is written whether or not the upgrade worked — find the line that made that possible.'},

/* ---------------- H02 ---------------- */
{
 id:'H02', elements:1, theme:'Scanning, Testing & Attack Surface', type:'logpick', title:'Scanner noise or a real extraction?',
 context:'The patient portal sends a burst of requests at 03:15. The WAF is in monitor-only mode, so nothing was blocked. Baseline response size for /portal/report is about 8.8 KB. Your job is to separate automated noise from a successful attack.',
 prompt:'Click the line that shows an attacker successfully pulling data out of the database.',
 lines:[
  '198[.]51[.]100[.]23 - - [12/Jun/2024:03:14:02] "GET /health HTTP/1.1" 200 3 "-" "curl/7.81.0"',
  '198[.]51[.]100[.]23 - - [12/Jun/2024:03:14:03] "GET /robots.txt HTTP/1.1" 200 41 "-" "curl/7.81.0"',
  '203[.]0[.]113[.]9 - - [12/Jun/2024:03:15:11] "GET /portal/login HTTP/1.1" 200 5120 "-" "Mozilla/5.0"',
  '203[.]0[.]113[.]9 - - [12/Jun/2024:03:15:12] "GET /portal/../../../../etc/passwd HTTP/1.1" 400 162 "-" "Mozilla/5.0"',
  '198[.]51[.]100[.]23 - - [12/Jun/2024:03:16:40] "GET /portal/report?id=1%20AND%201=1 HTTP/1.1" 200 8842 "-" "sqlmap/1.7"',
  '198[.]51[.]100[.]23 - - [12/Jun/2024:03:17:02] "GET /portal/report?id=1%20AND%20SLEEP(5) HTTP/1.1" 200 8842 "-" "sqlmap/1.7"',
  '198[.]51[.]100[.]23 - - [12/Jun/2024:03:17:08] "GET /portal/report?id=1%20UNION%20SELECT%20username,password%20FROM%20users HTTP/1.1" 200 21114 "-" "sqlmap/1.7"',
  '10[.]20[.]4[.]7 - - [12/Jun/2024:03:18:00] "GET /portal/patients/4471 HTTP/1.1" 200 9921 "-" "Mozilla/5.0"'],
 answerLines:[6],
 explain:'The SQL injection probe with AND 1=1 returns the normal page size, so it proves nothing. The AND SLEEP(5) line is a blind test: it shows the parameter is injectable but returns no data. The UNION SELECT returns 21 KB instead of the usual 8.8 KB, which is the shape of rows of usernames and password hashes being appended to the page. The traversal attempt got a 400, so it failed, and the last line is a legitimate staff request. Size and status are often the fastest way to spot a successful extraction.',
 focus:'Compare status codes AND response sizes. A block returns 400 or a small body; a successful extraction returns 200 with an unusually large body.',
 hint1:'Two lines were blocked or proved nothing. Look for the response that is far larger than the 8.8 KB baseline.',
 hint2:'A timing test proves the flaw exists. The line that returns 21 KB proves the data left the database.'},

/* ---------------- H03 ---------------- */
{
 id:'H03', elements:6, theme:'Prioritization & Response Workflow', type:'rank', title:'The queue where the worst score comes fourth',
 context:'Six findings go to the weekly vulnerability board. The board chair opens by saying "we start with the highest CVSS". The attack surface management review produced this list, and you have the EPSS feed, the CISA KEV list, the asset inventory, the risk heat map and the control register in front of you. The chair is wrong.',
 prompt:'Rank the six findings from the one you act on first to the one you act on last.',
 items:[
  {id:'a',text:'Marketing site — CVSS 9.8, EPSS 0.05, internet-facing, WAF virtual patch already blocks the exploit path'},
  {id:'b',text:'Email gateway — CVSS 7.4, EPSS 0.38, internet-facing, no compensating control'},
  {id:'c',text:'File transfer service — CVSS 8.2, EPSS 0.62, on the KEV list, internet-facing, no control'},
  {id:'d',text:'VPN concentrator — CVSS 7.0, EPSS 0.21, internal only, reachable from the whole corporate LAN'},
  {id:'e',text:'OT engineering workstation — CVSS 9.1, EPSS 0.04, isolated network with an allow-list, physical access needed'},
  {id:'f',text:'Old database host — CVSS 9.0, EPSS 0.02, powered off, still listed in the asset inventory'}],
 correctOrder:['c','b','d','a','e','f'],
 explain:'The order follows evidence of real attacks first, then reachability, then the controls you already have, and only then the raw score. The file transfer service leads because it is on the KEV list, its EPSS is the highest and nothing reduces the risk. The email gateway is next: exposed with a solid chance of attack. The VPN concentrator is internal but reachable across the whole LAN. The marketing site drops to fourth even with CVSS 9.8, because the WAF already blocks the attack path. The OT workstation is fifth: a very high score, but isolated and hard to reach. The powered-off host is last. The highest base score in this list belongs to a site that is already protected. A prioritization matrix is how you make that judgement repeatable instead of personal.',
 focus:'Learn that a compensating control in place, physical isolation and a powered-off host all push a finding down the queue regardless of the score.',
 hint1:'Four items have higher CVSS than the first one you should fix. Start from what attackers actually do.',
 hint2:'Items a, e and f are all heavily reduced by something other than the score. Only one item has real attack evidence and no control at all.'},

/* ---------------- H04 ---------------- */
{
 id:'H04', elements:4, theme:'Governance, Risk & Compliance', type:'branch', title:'A poisoned dependency in the SBOM',
 context:'Your build pipeline reads an SBOM on every release. Early this morning the feed marks a transitive npm dependency, three levels deep, as malicious: the maintainer account was taken over and a backdoored version 4.2.1 was published five days ago. Your customer-facing API downloaded that version four days ago. The API reads its database password and signing key from environment variables at start-up. Work through the response.',
 prompt:'Choose the best action at each step of the response.',
 stages:[
  {prompt:'The alert is 15 minutes old. What is your FIRST action?',
   options:[
    {id:'a',text:'Find which builds contain version 4.2.1 and freeze the pipeline.',ok:true,why:'Correct. Until you know which artefacts are poisoned you cannot scope anything, and freezing the pipeline stops more contaminated builds from shipping while you work.'},
    {id:'b',text:'Email every customer to warn them that they may be breached.',ok:false,why:'You do not yet know the impact or even which customers are affected. A panic notification with no facts damages trust and may be inaccurate.'},
    {id:'c',text:'Wait for the registry to remove the package and take no other action.',ok:false,why:'Removal at the registry does not change the code already inside your images and running in production.'},
    {id:'d',text:'Rebuild the API with the same dependency to see whether the build fails.',ok:false,why:'This adds another contaminated artefact and answers nothing.'}]},
  {prompt:'Build #8811 contains 4.2.1 and was deployed to production two days ago. The backdoor opens an outbound connection to a rare domain and reads process environment variables. What next?',
   options:[
    {id:'a',text:'Treat it as compromised: rotate the secrets and keep the logs.',ok:true,why:'Correct. The backdoor targets exactly what sits in those environment variables, so you must assume the database password and signing key are in someone else\'s hands. Isolation stops further use and the logs are the only record of what was read.'},
    {id:'b',text:'Roll back the deployment and nothing else, because the build is now gone.',ok:false,why:'A rollback removes the code but not the knowledge the attacker already copied. The secrets must be changed.'},
    {id:'c',text:'Delete the image from the registry and continue with the sprint.',ok:false,why:'This destroys evidence and leaves live credentials in the attacker\'s hands.'},
    {id:'d',text:'Block the rare domain at the DNS resolver and close the ticket.',ok:false,why:'The attacker can change the domain in minutes. Blocking one name is not containment.'}]},
  {prompt:'The database password and the API key have been rotated. What else must be in scope, and why?',
   options:[
    {id:'a',text:'Every secret those hosts held, including the signing key and tokens.',ok:true,why:'Correct. The backdoor read the whole environment, not one variable. The signing key lets an attacker forge tokens and the CI tokens reach your supply chain, so both must be replaced.'},
    {id:'b',text:'Only the single API key that appears in the application logs.',ok:false,why:'The logs show how the key was used, not what was exposed. The backdoor read the complete environment.'},
    {id:'c',text:'Nothing else, because the outbound connection is now blocked.',ok:false,why:'Blocking the channel does not un-steal what was already read.'},
    {id:'d',text:'Only the CI/CD runner, because production hosts are isolated.',ok:false,why:'The production hosts are exactly where the secrets lived. Excluding them misses the main exposure.'}]},
  {prompt:'The next morning the customer team asks what they may tell affected customers. What is the right move?',
   options:[
    {id:'a',text:'Give legal the verified facts and let them decide the notification duty.',ok:true,why:'Correct. Notification deadlines and wording are legal decisions built on verified facts. Your job is to hand over a timeline, an impact statement and the evidence, not to guess the deadline.'},
    {id:'b',text:'Publish a statement saying there is no impact, before the investigation ends.',ok:false,why:'You cannot yet prove there was no impact. A wrong public statement is worse than a short delay.'},
    {id:'c',text:'Wait 30 days to see whether the rare domain is contacted again.',ok:false,why:'Regulatory clocks do not pause while you watch. Some duties start as soon as you become aware.'},
    {id:'d',text:'Tell customers to rotate their own keys and say nothing more.',ok:false,why:'This pushes your incident onto customers and gives them nothing to act on.'}]}],
 explain:'A supply chain compromise is an incident, not a patching task. You scope the poisoned artefacts first, then assume that everything the malicious code could read has been taken, then you replace those secrets, and finally you hand verified facts to the people who own the legal and customer message.',
 focus:'Learn the supply chain pattern: which artefacts are contaminated → what could the code reach → replace every secret it could read → hand facts to legal and communications.',
 hint1:'Scope first, then assume the secrets are stolen, then reach every secret the process could read.',
 hint2:'Rolling back code never returns a stolen credential. And notification timing is a legal decision, not an engineering one.'},

/* ---------------- H05 ---------------- */
{
 id:'H05', elements:4, theme:'Governance, Risk & Compliance', type:'fill', title:'Four findings, four different risk treatments',
 context:'The risk committee asks you to describe, in one sentence, how each of the four findings will be handled. Each blank needs the correct risk treatment word.',
 prompt:'Complete the four gaps with the correct risk treatment word for each finding.',
 sentence:'For the payment gateway flaw we will ______ the risk by moving card processing to the hosted provider, so it sits with a third party under contract. For the MRI workstation we can only ______ the risk, because no patch exists and the device must keep working. For the retired database host we will ______ the risk completely by switching the machine off and removing the DNS record. For the marketing site we will ______ the risk for 30 days, because the WAF rule already blocks the attack path and the business needs the site live.',
 blanks:['transfer','mitigate','avoid','accept'],
 bank:['accept','avoid','insure','transfer','monitor','mitigate','remediate','delegate'],
 explain:'Transfer means another party carries the risk, usually through a contract or insurance. Mitigate means you reduce it while keeping the activity. Avoid means you remove the activity that creates the risk, so the risk disappears. Accept means you decide to live with it knowingly, with an owner and an expiry date. Insure and delegate are near misses: insurance is one way to transfer a financial loss, but it does not move the operational risk, and delegation is not a treatment at all.',
 focus:'Learn the four treatments with one example each: transfer to a contract, mitigate with a control, avoid by stopping the activity, accept with an expiry.',
 hint1:'Two of these words sound similar but only one means another company now carries the risk.',
 hint2:'Switching a machine off removes the activity, so it is not mitigation.'},

/* ---------------- H06 ---------------- */
{
 id:'H06', elements:8, theme:'Vulnerability Management Fundamentals', type:'dnd', title:'Which group does this sentence belong to?',
 context:'A board paper contains the sentence "the flaw scores 9.8". The CISO asks you to sort the statements in the appendix into the three CVSS groups, because the board keeps treating a score that we can change as if it were fixed forever. EPSS, the CISA KEV list and the SSVC decision tree appear in the same appendix.',
 prompt:'Sort each statement into the CVSS group it describes.',
 zones:[
  {id:'base',label:'Base — published and fixed'},
  {id:'temp',label:'Temporal — changes with the world'},
  {id:'env',label:'Environmental — changes with our own context'}],
 items:[
  {id:'i1',text:'Assumes the worst case and never changes after publication',zone:'base'},
  {id:'i2',text:'The attack needs no authentication and no action from a user',zone:'base'},
  {id:'i3',text:'A reliable exploit appears on the internet and anyone can use it',zone:'temp'},
  {id:'i4',text:'The vendor releases an official fix that customers can install',zone:'temp'},
  {id:'i5',text:'The vendor disputes the report and confidence in it drops',zone:'temp'},
  {id:'i6',text:'The host sits behind a firewall that blocks the attack path',zone:'env'},
  {id:'i7',text:'The asset holds no patient data, so the consequence is smaller for us',zone:'env'},
  {id:'i8',text:'The service is only reachable from one internal management subnet',zone:'env'}],
 explain:'The base group describes the flaw itself and is frozen when the flaw is published: how it is attacked and what an attacker needs. The temporal group follows the world as it changes, so maturing exploit code makes it worse while an official fix or a disputed report makes it better. The environmental group is the only one you adjust for your own estate: a firewall in the path, a host with no sensitive data or a service reachable from one subnet all change the number you act on. EPSS is not part of any CVSS group, because it is a probability rather than a severity, and the CISA KEV list is a record of what attackers have already done. SSVC is different again: it is a decision tree that takes these inputs and produces an action, such as Track, Track*, Attend or Act.',
 focus:'Learn which group you are allowed to change: only the environmental group reflects your own estate, and the base group never moves.',
 hint1:'Four statements are about the flaw itself or about the world changing; four are about your own environment.',
 hint2:'A disputed report and a released fix are both world events, not things about your network.'},

/* ---------------- H07 ---------------- */
{
 id:'H07', elements:1, host:'10[.]20[.]0[.]0/24', theme:'Scanning, Testing & Attack Surface', type:'terminal', title:'Find the shadow admin ports',
 context:'Change management says only three hosts in 10[.]20[.]0[.]0/24 should expose a management interface on TCP 8443. You must prove or disprove that statement tonight, and the evidence must be stored as a file called open8443.txt in the current directory. The jump host has the usual assessment toolkit installed. No tool name is given to you here: choose the tool and the flags yourself.',
 prompt:'Write the command that finds every host in 10[.]20[.]0[.]0/24 with TCP 8443 open and writes the result to open8443.txt.',
 guide:'You are not told which tool to use. Think about which class of tool maps open ports across a whole subnet, which option hides the closed ports so the output is short, and which flag writes the report to a file. The output file must be named <code>open8443.txt</code> in the current directory.',
 accept:['^nmap\\b(?=.*(-p\\s*8443|-p\\s*t?:?8443))(?=.*--open)(?=.*{HOST})(?=.*-o[angx]\\s*open8443)'],
 sample:'nmap -p 8443 --open -oN open8443.txt 10[.]20[.]0[.]0/24',
 explain:'A port scanner is the right class of tool here. The port filter keeps the scan short, the option that shows only open ports makes the evidence readable for the change board, the CIDR target covers all 254 addresses in one run, and the output flag writes the result to a file that can be attached to the ticket. Choosing the tool, the port, the visibility filter and the output flag from the goal alone is the skill being tested.',
 focus:'Practise building a command from a goal: what am I scanning, which ports, how do I want the output, and where does the evidence go?',
 hint1:'Start from the job: one port, many hosts, and evidence written to a file. Then think about how to keep the report short.',
 hint2:'Four things must appear: the port 8443, the whole /24 target, an option that hides closed ports, and an output flag that writes to open8443.txt.'},

/* ---------------- H08 ---------------- */
{
 id:'H08', elements:1, theme:'Prioritization & Response Workflow', type:'logpick', title:'The patch that reported success but is not in force',
 context:'The compliance dashboard says 239 of 240 servers are patched. A threat feed now reports active exploitation of the flaw that KB5034441 fixes. You open the overnight agent log to find out why one server may still be vulnerable.',
 prompt:'Click the line that explains WHY the fix is not actually in force on that host.',
 lines:[
  '2024-06-12 01:00:02 INFO  wuagent: job WU-2291 started, targets=240, policy="Monthly-Security"',
  '2024-06-12 01:04:11 INFO  wuagent: srv-app-14 installed KB5034441 (reboot required to complete)',
  '2024-06-12 01:05:02 INFO  wuagent: srv-db-07 installed KB5034123',
  '2024-06-12 01:06:44 WARN  wuagent: srv-web-02 KB5034441 superseded by KB5035853, skipped',
  '2024-06-12 01:08:02 INFO  wuagent: srv-app-14 reboot scheduled for the next window',
  '2024-06-12 02:30:00 WARN  wuagent: srv-app-14 reboot cancelled by change CH-7781 (business freeze)',
  '2024-06-12 06:00:00 INFO  wuagent: compliance scan: srv-app-14 reports KB5034441 pending',
  '2024-06-12 01:09:40 INFO  wuagent: job WU-2291 finished success=239 failed=1'],
 answerLines:[5],
 explain:'The install line and the "reboot required" note are both normal: for this class of update the code is on disk but not active until the machine restarts. The line that explains the current state is the cancelled reboot, because the business freeze blocked the only step that would have made the fix effective. The compliance scan line is the evidence that the host is still pending, but it shows the symptom, not the reason. The superseded line is also normal: a newer update replaced the old one, which is not a failure.',
 focus:'Learn that "installed" and "in force" are different states, and that a cancelled or deferred reboot keeps a host vulnerable while the dashboard stays green.',
 hint1:'One line is the evidence that the host is still pending. You are asked for the reason, which is a different line.',
 hint2:'Superseded and reboot-pending are both normal states. Look for an action that was stopped by another team.'},

/* ---------------- H09 ---------------- */
{
 id:'H09', elements:7, theme:'Governance, Risk & Compliance', type:'order', title:'Coordinated disclosure from first email to credit',
 context:'A researcher has found a serious flaw in a product your company sells, and your legal team agreed to coordinated disclosure. You must write the seven steps in the order they will happen.',
 prompt:'Put the seven steps of a coordinated disclosure in the correct order.',
 items:[
  {id:'s1',text:'The researcher reports the flaw privately to the vendor'},
  {id:'s2',text:'The vendor acknowledges the report and opens a private case'},
  {id:'s3',text:'The vendor validates and reproduces the flaw'},
  {id:'s4',text:'The vendor develops and tests the fix inside the agreed window'},
  {id:'s5',text:'A CVE ID is assigned and the advisory is prepared'},
  {id:'s6',text:'The fixed version is released and customers begin to install it'},
  {id:'s7',text:'The technical details are published and the reporter is credited'}],
 correctOrder:['s1','s2','s3','s4','s5','s6','s7'],
 explain:'Coordinated disclosure protects users while the fix is built. The report arrives privately, the vendor confirms it received the report, then proves the flaw is real by reproducing it. Only then does engineering develop and test a fix inside the agreed window, which is usually 90 days. A CVE ID and the advisory text are prepared so everyone describes the flaw the same way. The fix is released first so customers can protect themselves, and only then are the details made public with credit for the reporter. Publishing before the fix exists is what this process is designed to prevent.',
 focus:'Learn the rule behind the order: users get protection before attackers get details, so the release always comes before publication.',
 hint1:'Reproduction comes before development, and the advisory is written before the release so it can ship on the same day.',
 hint2:'Public details are always the last step, never the first.'},

/* ---------------- H10 ---------------- */
{
 id:'H10', elements:2, theme:'Prioritization & Response Workflow', type:'dual', title:'Eleven days of queue time',
 context:'An internet-facing backup appliance was running a version with an authentication bypass. The vendor released a fix 11 days ago. The patch was sitting in the normal change queue when the appliance was used to reach three file servers overnight, and the files on those servers are now encrypted. Answer the same night from both sides.',
 prompt:'Choose one answer in each part.',
 parts:[
  {label:'BLUE TEAM — which detection would have caught this first?',
   correct:'An alert when the appliance talks to a file server at 02:00.',
   options:[
    'An alert when the appliance talks to a file server at 02:00.',
    'A monthly patch compliance report showing the appliance as behind.',
    'A weekly unauthenticated scan of the DMZ subnet.',
    'An alert when free disk space on the appliance falls below 20 percent.']},
  {label:'RED TEAM — after getting a foothold on the appliance, what makes recovery hardest?',
   correct:'Destroying the backups and the shadow copies before encrypting anything.',
   options:[
    'Destroying the backups and the shadow copies before encrypting anything.',
    'Rebooting the appliance to clear its memory and temporary files.',
    'Sending a phishing email to the IT director to gain more access.',
    'Scanning the internal network for additional open ports and hosts.']}],
 explain:'The appliance normally talks outward to servers it protects, but the timing and the direction of a burst at 02:00 is what a detection rule should notice: new outbound behaviour from a security device itself. A monthly report and a weekly scan are far too slow, and disk space is unrelated. On the attacker side, the tradecraft that hurts most is removing recovery before demanding payment, because an organisation that can restore from backup does not need to pay. Phishing and port scanning help an attacker move, but they do not remove the victim\'s ability to recover.',
 focus:'Learn to write detections for the behaviour of infrastructure devices, and learn that backup destruction is the step that turns a ransomware incident into a crisis.',
 hint1:'Blue: the appliance doing something new is the signal. Red: think about what an attacker removes so you cannot recover.',
 hint2:'A compliance report tells you about the past. Backups are what let you refuse to pay.'},

/* ---------------- H11 ---------------- */
{
 id:'H11', elements:10, theme:'Vulnerability Management Fundamentals', type:'dnd', title:'Five stages, ten artefacts',
 context:'An auditor asks how you can show that the vulnerability management process is real and not a slide. You collect ten artefacts from the last quarter and must place each one in the stage of the lifecycle it proves.',
 prompt:'Place every artefact in the correct stage of the lifecycle.',
 zones:[
  {id:'disc',label:'Discover'},
  {id:'assess',label:'Assess'},
  {id:'prio',label:'Prioritize'},
  {id:'rem',label:'Respond — fix it, or accept it in writing'},
  {id:'ver',label:'Verify'}],
 items:[
  {id:'i1',text:'Asset inventory export with an owner and a business value for each host',zone:'disc'},
  {id:'i2',text:'SBOM produced by the build pipeline for the customer portal',zone:'disc'},
  {id:'i3',text:'Authenticated scan result for the finance subnet, dated last week',zone:'assess'},
  {id:'i4',text:'Vendor advisory listing the affected product versions',zone:'assess'},
  {id:'i5',text:'EPSS value and KEV flag recorded next to every finding',zone:'prio'},
  {id:'i6',text:'Business criticality rating agreed with the asset owner',zone:'prio'},
  {id:'i7',text:'Change ticket for Sunday 03:00 with the rollback steps',zone:'rem'},
  {id:'i8',text:'Signed risk exception for the legacy imaging device',zone:'rem'},
  {id:'i9',text:'Rescan report showing the plugin no longer fires on the host',zone:'ver'},
  {id:'i10',text:'Screenshot and hash of the fixed package attached to the closed ticket',zone:'ver'}],
 explain:'Discover is about knowing what you own: the inventory and the SBOM are both discovery artefacts. Assess is where you learn what is wrong, from scans and from vendor advisories. Prioritize is where judgement enters: EPSS, the KEV flag and business criticality decide the queue. The response stage is where the decision is executed: a change ticket when you fix the flaw, and a signed risk exception when a fix is impossible, because formally accepting a risk is still a decision with an owner and an expiry date. Verify is the proof: a rescan that no longer fires plus evidence stored on the ticket. An auditor wants to see all five stages, because a programme that stops after assessment never reduces risk.',
 focus:'Learn to place any artefact by asking: does it tell me what I own, what is wrong, what matters most, what I decided to do, or whether it worked?',
 hint1:'Two artefacts only prove that you know what exists. Two prove that you looked for weaknesses.',
 hint2:'A ticket for the change and a signed exception both belong to the stage where the decision is carried out, and a rescan belongs to the proof stage.'},

/* ---------------- H12 ---------------- */
{
 id:'H12', elements:1, theme:'Vulnerability Management Fundamentals', type:'mcq', title:'Correcting the shift report',
 context:'A junior analyst writes in the handover note: "CVE-2024-9999 has a CVSS base score of 9.8, so it is our biggest risk and we must fix it before anything else." The service is internal, holds no data, and no exploit code exists. The vulnerability assessment that produced the line reported severity only.',
 prompt:'Which correction belongs in the handover note?',
 options:[
  'The score shows how severe the flaw is, not how much risk it brings to us.',
  'The score is only valid for internet-facing hosts, so it does not apply here.',
  'The score already includes our environment, so the service must be fixed first.',
  'The score estimates how likely attackers are to use the flaw within 30 days.'],
 correct:'The score shows how severe the flaw is, not how much risk it brings to us.',
 explain:'The CVSS base score describes the technical severity of the flaw under worst-case assumptions. It does not know that this service is internal, that it holds no data, or that nobody has published exploit code, so it cannot rank it against your other findings. The second option is wrong because the base score applies to any deployment. The third is wrong because the environmental metric group is what you use to adjust for your own context. The fourth confuses CVSS with EPSS, which is the probability estimate. A CWE would describe the type of coding mistake behind the flaw, but it does not change the score either.',
 focus:'Learn the sentence that fixes most scoring mistakes: CVSS measures severity, our context turns severity into risk.',
 hint1:'Three of these statements mix CVSS up with something else.',
 hint2:'One option confuses the score with the probability of exploitation.'},

/* ---------------- H13 ---------------- */
{
 id:'H13', elements:4, theme:'Governance, Risk & Compliance', type:'fill', title:'Escalation memo for a flaw with no patch',
 context:'A flaw in your card payment switch is on the KEV list, so attackers are using it now. The vendor has no patch and will not have one for at least a month. You must write the escalation memo for tonight.',
 prompt:'Complete the four gaps in the escalation memo with the correct governance words.',
 sentence:'Escalation VULN-3391. The flaw is on the KEV list, so we must apply a ______ control tonight rather than wait for a patch. Because that control is temporary, the asset owner must sign a ______ that records the decision. Since the switch processes card data, we must also inform the ______ team about possible notification duties. The ______ of the control will be proven by a targeted detection rule and a weekly review of its alerts.',
 blanks:['compensating','risk acceptance','legal','effectiveness'],
 bank:['legal','budget','effectiveness','compensating','audit','risk acceptance','severity','vendor'],
 explain:'A compensating control is the temporary measure that reduces the risk while no fix exists. A risk acceptance is the signed decision that the organisation knows about the remaining risk, and it must have an owner and a date. Legal must be involved early because card data brings contractual and regulatory notification duties with their own clocks. Finally, any control must be proven to work: effectiveness is shown by a detection rule that fires and by someone reviewing the alerts, not by the fact that a document was signed.',
 focus:'Learn the four elements of a no-patch escalation: compensating control, signed acceptance with an owner, legal awareness, and proof that the control works.',
 hint1:'One blank is about the temporary technical measure, one is about the signed decision, one is a department, one is about proof.',
 hint2:'A control that nobody watches and that nobody can show working is not a control.'},

/* ---------------- H14 ---------------- */
{
 id:'H14', elements:1, theme:'Prioritization & Response Workflow', type:'logpick', title:'The queue sorted by the wrong number',
 context:'Your ticket queue is sorted by CVSS base score today, because the board chair likes one number. You have the EPSS feed, the KEV list and the control register beside you. One finding must be moved to the top even though it has the lowest CVSS score in the whole list.',
 prompt:'Click the line that must be moved to the top of the queue.',
 lines:[
  'A-114 VPN gateway (internet-facing) CVE-2024-3400 cvss=10.0 epss=0.94 kev=YES control=none',
  'A-330 records server (internal) CVE-2024-21412 cvss=8.8 epss=0.68 kev=YES control=none',
  'A-512 isolated lab (no route) CVE-2024-23897 cvss=9.8 epss=0.44 kev=YES control=network isolated',
  'A-118 VDI broker (internal) CVE-2024-1708 cvss=7.5 epss=0.52 kev=NO control=none',
  'A-207 developer laptops CVE-2023-4966 cvss=9.4 epss=0.71 kev=YES control=patched 2024-06-01',
  'A-640 public API (internet-facing) CVE-2024-4577 cvss=6.5 epss=0.61 kev=YES control=none'],
 answerLines:[5],
 explain:'The public API line has the lowest CVSS in the list, but it is on the KEV list, its EPSS is 0.61, it faces the internet and nothing reduces the risk: that combination is what puts it first. The VPN gateway is already at the top by score and is equally urgent, which is why the question points at the one that the current sort hides. The isolated lab and the patched laptops are on the KEV list too, but a control already removes or blocks the attack path. The VDI broker has a decent EPSS but is not known to be exploited and is internal.',
 focus:'Learn to read a queue line as four facts: exposure, exploit evidence, control in place, asset value. A low score with the first two present beats a high score with a control.',
 hint1:'Look for the lowest cvss value in the list, then check its kev and control fields.',
 hint2:'Two lines have control=network isolated or control=patched. Those are already handled.'},

/* ---------------- H15 ---------------- */
{
 id:'H15', elements:1, theme:'Governance, Risk & Compliance', type:'hotspot', title:'Reading the policy the auditors will read',
 context:'Northwind has rewritten its vulnerability management policy after last year\'s audit findings. You are the reviewer. The audit committee will ask who is accountable when a finding stays open.',
 prompt:'Click the single line that will cause findings to stay open with nobody accountable.',
 lines:[
  'Northwind Vulnerability Management Policy v3.1',
  '1. All in-scope assets are scanned every 30 days with authenticated checks.',
  '2. Critical findings on internet-facing assets are remediated within 15 days.',
  '3. High findings are remediated within 30 days; medium and low sit on the monthly backlog.',
  '4. Every finding is tracked in the ticketing system with the asset name attached.',
  '5. The vulnerability management team owns every finding and is accountable for closing it.',
  '6. Exceptions are approved by the CISO with an expiry date and reviewed monthly.',
  '7. Compliance is reported as the share of assets inside the patch SLA and the age of the backlog.'],
 answerLine:5,
 explain:'The vulnerability management team can own the process, the queue and the reporting, but it does not operate the servers and cannot spend another team\'s budget. If it is also accountable for closing every finding, the asset owner has no reason to act and the queue becomes a list of grievances. Accountability must sit with the asset owner, who pays for the fix and accepts the residual risk. The tempting wrong answer is line 4, which sounds weak, but tracking medium and low findings on a backlog is normal practice when the critical and high work is done inside the SLAs.',
 focus:'Learn the split: the vulnerability team owns the process and the numbers, the asset owner owns the risk and the fix.',
 hint1:'Look for the line that puts responsibility for other teams\' systems in the wrong place.',
 hint2:'Backlog tracking is normal. Assigning accountability to a team that does not operate the asset is not.'},

/* ---------------- H16 ---------------- */
{
 id:'H16', elements:6, theme:'Prioritization & Response Workflow', type:'rank', title:'Patch first, or contain first?',
 context:'At 04:20 you confirm that attackers are exploiting the file transfer appliance in front of you. Two appliances show the exploitation indicator and one has an active session to an unknown host. The vendor patch is available. Rank the six response actions in the order an experienced responder performs them.',
 prompt:'Rank the six actions from first to last.',
 items:[
  {id:'a',text:'Contain: block external access to the appliance and stop the scheduled transfer jobs'},
  {id:'b',text:'Scope: check the other appliances and search the logs for the same indicator'},
  {id:'c',text:'Preserve: capture the appliance logs and memory before anything is rebuilt'},
  {id:'d',text:'Eradicate: apply the vendor patch and rebuild the configuration from the baseline'},
  {id:'e',text:'Recover: replace every credential that was stored on the appliance and restore service'},
  {id:'f',text:'Verify and report: rescan the appliances, then brief the CISO and the asset owner'}],
 correctOrder:['a','b','c','d','e','f'],
 explain:'When exploitation is confirmed, the attacker\'s path is closed first, because every minute of access can be used to move deeper or to steal more. Only then do you find out how far the attacker reached, which is scoping. Evidence is captured before the rebuild, because eradicating the flaw destroys the very artefacts the investigation needs. With the attacker out and the evidence safe, you patch and rebuild from the known-good baseline. Recovery means replacing the credentials the attacker could have taken, not just restarting the service. Finally you verify with a rescan and report. Patching first feels productive but leaves the attacker inside while you work.',
 focus:'Learn the order containment → scoping → evidence → eradication → recovery → verification, and why each step sits where it does.',
 hint1:'The instinct is to patch immediately. Ask yourself what the attacker is doing while the patch installs.',
 hint2:'A rebuild destroys memory and logs, so evidence collection must happen before it.'},

/* ---------------- H17 ---------------- */
{
 id:'H17', elements:3, theme:'Scanning, Testing & Attack Surface', type:'branch', title:'The flaw the scanner never reported',
 context:'An attacker used a flaw in the internet-facing VPN appliance. The asset had been scanned twice in that month and the reports were clean. The incident is contained and the CISO asks you, the vulnerability manager, why the scanner missed it and what changes. Work through the answer.',
 prompt:'Choose the best action at each step.',
 stages:[
  {prompt:'What is your FIRST step?',
   options:[
    {id:'a',text:'Reproduce the miss with a targeted scan of that host.',ok:true,why:'Correct. Until you can reproduce the gap you are guessing. A targeted scan with credentials tells you whether the plugin ran, whether the checks were skipped and what the scanner actually saw.'},
    {id:'b',text:'Open a case with the scanner vendor and ask for a refund.',ok:false,why:'A commercial discussion does not tell you how many other hosts have the same blind spot.'},
    {id:'c',text:'Change the scan frequency from every 30 days to every 7 days.',ok:false,why:'Scanning more often with the same blind spot just produces the same clean report more frequently.'},
    {id:'d',text:'Add the CVE to the exception list so the report stays clean.',ok:false,why:'This hides the problem and is exactly the behaviour that created the false confidence.'}]},
  {prompt:'You find the scan of that host ran unauthenticated because the service account had been locked for six weeks, and no report ever flagged it. What is the root cause to fix?',
   options:[
    {id:'a',text:'No monitoring of scan coverage when credentialed checks fail.',ok:true,why:'Correct. The scanner quietly degraded to unauthenticated checks and the coverage number stayed green. Monitoring coverage per asset is what turns a silent degradation into a visible event.'},
    {id:'b',text:'The scanner plugin feed was three days out of date again.',ok:false,why:'A slightly older feed is normal and does not explain a host that was never checked from the inside.'},
    {id:'c',text:'Too few assets were included in the scope of the scan.',ok:false,why:'The host was in scope. The problem is depth, not breadth.'},
    {id:'d',text:'The network link was too slow to finish the scan in time.',ok:false,why:'The scan completed. It completed in the wrong mode.'}]},
  {prompt:'What must change in the monthly leadership report so this false confidence cannot repeat?',
   options:[
    {id:'a',text:'Report scan coverage and MTTD beside the findings.',ok:true,why:'Correct. A findings number without a coverage number is meaningless: you cannot tell a clean estate from a blind one. Showing unauthenticated assets separately, and reporting MTTD and MTTR next to them, makes the gap visible to the people who can fund the fix.'},
    {id:'b',text:'Report only the total number of findings each month.',ok:false,why:'This is the report that hid the problem. It says nothing about what was actually checked.'},
    {id:'c',text:'Stop reporting metrics until the scanning tool is replaced.',ok:false,why:'Stopping the numbers removes the only way to show improvement.'},
    {id:'d',text:'Report the number of tickets the team closed.',ok:false,why:'Ticket throughput measures activity, not coverage or risk reduction.'}]}],
 explain:'A false negative that survives two scan cycles is a process failure, not a tool failure. You reproduce the gap, you find the silent degradation of credentialed scanning, you add monitoring so coverage is a first-class number, and you change what leadership sees so that a clean report can no longer mean an unchecked estate. The same report should carry MTTP for the patch pipeline, because a flaw that is found early but patched late is still a breach waiting to happen.',
 focus:'Learn the link between false negatives and coverage metrics: findings without coverage is a vanity number.',
 hint1:'You cannot fix a blind spot you cannot reproduce, and the blind spot is about depth, not frequency.',
 hint2:'The leadership fix is to publish coverage next to findings so an unauthenticated asset is visible.'},

/* ---------------- H18 ---------------- */
{
 id:'H18', elements:5, theme:'Governance, Risk & Compliance', type:'order', title:'One incident, five clocks, one timeline',
 context:'A breach is confirmed at 09:00 on a Tuesday. Northwind is a US public company, treats patients in the US, has customers in the EU and takes card payments. Legal asks you to put the notification duties in the order they will fall due, from the one that cannot wait to the one with the longest window. SOX adds a separate duty about financial reporting controls, but it is not a breach notification clock.',
 prompt:'Put the five notification duties in order, from the one that falls due first to the one that falls due last.',
 items:[
  {id:'s1',text:'Inform the acquiring bank and the card brands at once under the PCI DSS contract'},
  {id:'s2',text:'Notify the EU supervisory authority within 72 hours under GDPR'},
  {id:'s3',text:'File the material incident report within 4 business days under the SEC rules'},
  {id:'s4',text:'Notify affected residents within 30 days under the US state breach laws'},
  {id:'s5',text:'Notify affected individuals within 60 days under HIPAA'}],
 correctOrder:['s1','s2','s3','s4','s5'],
 explain:'The card brand duty is first because it is contractual and immediate: you call the acquiring bank as soon as you know, with no statutory clock to wait for. The GDPR duty is next at 72 hours and starts when you become aware of a personal data breach. The SEC duty gives four business days, but the clock starts when you decide the incident is material, which is why it sits behind GDPR in this timeline. The state laws commonly allow 30 days, and HIPAA allows the longest window, requiring notice without unreasonable delay and no later than 60 days. SOX is not on this timeline at all: it governs financial reporting controls, so it drives change control and audit trails instead. The practical lesson is that the shortest duty here comes from a contract, not from a law: the 72-hour breach notification duty under GDPR is only the second clock to start.',
 focus:'Learn each clock and, more importantly, learn that a contractual duty can be faster than any regulation.',
 hint1:'The first duty belongs to the card brands and it has no statute behind it.',
 hint2:'Compare 72 hours with 4 business days, then compare 30 days with 60 days.'},

/* ---------------- H19 ---------------- */
{
 id:'H19', elements:7, theme:'Scanning, Testing & Attack Surface', type:'order', title:'Running the engagement properly',
 context:'Northwind signed off an external penetration test of the customer portal. The engagement manager asks you to put the seven phases in the order the test team will work through them.',
 prompt:'Put the seven phases of the engagement in the correct order.',
 items:[
  {id:'s1',text:'Sign the contract and the rules of engagement, with the scope and the window'},
  {id:'s2',text:'Reconnaissance: map the estate and collect public information about it'},
  {id:'s3',text:'Discover and validate weaknesses on the in-scope targets'},
  {id:'s4',text:'Exploit the validated weaknesses to prove the impact, inside the agreed window'},
  {id:'s5',text:'Write the report with findings, risk ratings and evidence'},
  {id:'s6',text:'Present the results to the asset owners and agree the remediation plan'},
  {id:'s7',text:'Retest after the fixes to confirm the findings are closed'}],
 correctOrder:['s1','s2','s3','s4','s5','s6','s7'],
 explain:'Nothing happens before the rules of engagement are signed, because that document names the targets, the time window and the limits on what a tester may do. Reconnaissance comes next so the team knows what it is facing. Weaknesses are found and validated before any exploitation, otherwise a tester wastes the window chasing false positives. Exploitation proves impact. Then the written report, because a finding nobody can reproduce is worthless, followed by the read-out so that owners accept the work. The retest closes the loop and is the only thing that proves the fixes worked.',
 focus:'Learn that the rules of engagement are step one and the retest is the last step. Both are what separate a professional engagement from an attack.',
 hint1:'Two documents matter most: one is signed before anything begins, the other proves the fixes afterwards.',
 hint2:'Validation always comes before exploitation, or the tester wastes time on flaws that do not exist.'},

/* ---------------- H20 ---------------- */
{
 id:'H20', elements:4, theme:'Governance, Risk & Compliance', type:'fill', title:'Four bounty reports, four decisions',
 context:'The bug bounty triage queue has four reports on Northwind\'s programme. You must pick the correct triage word for each one so the researchers receive an honest answer.',
 prompt:'Complete the four gaps in the triage decisions with the correct triage word.',
 sentence:'Report 1 is a ______ because the same flaw was submitted last Tuesday by another researcher. Report 2 is ______ because the clickjacking issue is on a marketing domain that the programme rules exclude. Report 3 is ______ because a missing security header on its own does not demonstrate a security impact. Report 4 is ______ and will be paid at the top tier, because the SQL injection reaches patient records.',
 blanks:['duplicate','out of scope','informational','accepted'],
 bank:['accepted','informational','duplicate','out of scope','rejected','critical','deferred','spam'],
 explain:'Triage words are a promise to the researcher. Duplicate means the same issue is already in the programme, so no second reward is due. Out of scope means the affected asset is excluded by the published rules, which is why the rules must be published and precise. Informational means the report is true but shows no real impact, so it earns thanks rather than money. Accepted means the report qualifies and a reward follows. Using "rejected" or "spam" for a genuine but out-of-scope or low-impact report is what drives researchers away from your programme.',
 focus:'Learn the triage vocabulary: duplicate, out of scope, informational, accepted. Each one has a different effect on the researcher relationship.',
 hint1:'Two of these words are about the report itself and two are about its value.',
 hint2:'A true report with no impact is not a duplicate and not out of scope.'},

/* ---------------- H21 ---------------- */
{
 id:'H21', elements:1, theme:'Governance, Risk & Compliance', type:'mcq', title:'Three levels deep in the dependency tree',
 context:'The SBOM for the customer portal lists 1,840 components. A library that is pulled in by another library, three levels below anything your team chose, has a critical flaw. Your direct vendor replies in writing: "this flaw is not exploitable in our configuration" and offers no evidence.',
 prompt:'What is the best next step?',
 options:[
  'Ask for written evidence, and keep a compensating control until it arrives.',
  'Accept the vendor statement, because they wrote and support the product.',
  'Remove the component from the SBOM so the report stops flagging it.',
  'Replace the whole product with a competitor as soon as it can be tested.'],
 correct:'Ask for written evidence, and keep a compensating control until it arrives.',
 explain:'A vendor statement is a claim, not evidence. You ask for the technical reasoning in writing, and in the meantime the control stays in place, because the risk has not changed while you wait. Accepting the claim without proof transfers a risk you still own. Removing a line from the SBOM is falsifying your own inventory and would hide the flaw the next time someone asks. Replacing a product is a large, slow change that may not even remove the transitive dependency.',
 focus:'Learn that third-party risk is managed with documented evidence, not with assurances, and that the SBOM exists precisely to show transitive dependencies.',
 hint1:'A written claim with no reasoning is not proof, and the risk does not pause while you wait.',
 hint2:'Deleting a component from an SBOM changes the document, not the software.'},

/* ---------------- H22 ---------------- */
{
 id:'H22', elements:1, theme:'Vulnerability Management Fundamentals', type:'terminal', title:'Prove the fix to the auditor',
 context:'The auditor asks for evidence that the OpenSSL package on this RHEL 9 server has been updated to the fixed release. The version must come from the package database on the host itself, not from a network probe. No tool name and no flags are given to you: choose the correct command for this operating system.',
 prompt:'Write the command that shows the exact installed version of the OpenSSL package on this host.',
 guide:'You are not told which command to use. Think about which tool reads the package database on a Red Hat family system, which option asks a question about a single package, and what the answer will look like. Expected output shape: <code>openssl-3.0.7-27.el9.x86_64</code>',
 accept:['^rpm\\s+(-q[a-z]*|--query)\\b.*openssl','^rpm\\s+-qa\\b.*\\|\\s*grep\\b.*openssl','^dnf\\s+(info|list)\\s+(installed\\s+)?openssl','^yum\\s+(info|list)\\s+(installed\\s+)?openssl','^openssl\\s+version'],
 sample:'rpm -q openssl',
 explain:'On a Red Hat family system the package database is the source of truth, and the RPM query tool reads it. Asking about one package by name returns the full version and release string, which is exactly what an auditor wants attached to the ticket. Listing every package and filtering the output works too but is slower and noisier. Asking the binary for its own version is a weaker answer here, because it reports the library the shell finds rather than the installed package, and the two can differ after a partial upgrade.',
 focus:'Learn which tool owns the truth on each platform: RPM and DNF on Red Hat family systems, dpkg and apt on Debian family systems.',
 hint1:'On RHEL the package database is queried with one specific tool, and it has a short option for "tell me about this package".',
 hint2:'You want one package by name, not a list of every installed package.'},

/* ---------------- H23 ---------------- */
{
 id:'H23', elements:8, theme:'Vulnerability Management Fundamentals', type:'dnd', title:'True, false, missed or clean?',
 context:'Six months of scan results and one incident are on the table. The CISO wants to know how often the vulnerability scanner was right, so you must classify eight short cases into the four possible outcomes.',
 prompt:'Classify each case: is it a true positive, a false positive, a true negative or a false negative?',
 zones:[
  {id:'tp',label:'True positive'},
  {id:'fp',label:'False positive'},
  {id:'tn',label:'True negative'},
  {id:'fn',label:'False negative'}],
 items:[
  {id:'i1',text:'The scan reports a flaw and you reproduce it on the host.',zone:'tp'},
  {id:'i2',text:'The scan reports a flaw in a service that was removed last month.',zone:'fp'},
  {id:'i3',text:'The scan reports nothing and the host really is fully patched.',zone:'tn'},
  {id:'i4',text:'The scan reports nothing and the attacker used a flaw on that same host.',zone:'fn'},
  {id:'i5',text:'The scan flags a missing patch, but the patch is installed and only the registry marker is stale.',zone:'fp'},
  {id:'i6',text:'The host firewall blocks the scanner, so it reports no open ports on a host that serves the web.',zone:'fn'},
  {id:'i7',text:'The scan flags a weak cipher on a service that is running and reachable from the LAN.',zone:'tp'},
  {id:'i8',text:'The scan reports no findings on a host that was decommissioned and switched off.',zone:'tn'}],
 explain:'A true positive is a real weakness that was reported. A false positive is a report about something that is not there, and the stale registry marker is the classic example: the software is patched but the check reads a marker that was never updated. A true negative is a report of nothing on an asset that really is clean, including a host that no longer runs. A false negative is a real weakness that was not reported, and the blocked scanner is a common cause: no open ports found on a host that serves web traffic means the scan never reached it.',
 focus:'Learn the two axes: is the weakness real, and did the report match reality? Then any case falls into one of the four boxes.',
 hint1:'Two cases are about something that is not really there, and two are about something real that the scan did not see.',
 hint2:'The stale registry marker and the removed service are both reports about code that is no longer in the state described.'},

/* ---------------- H24 ---------------- */
{
 id:'H24', elements:1, theme:'Scanning, Testing & Attack Surface', type:'logpick', title:'The password guesses that were only a distraction',
 context:'At 02:05 an identity provider administrator notices a large number of failed logins for one account. The user later reports that their mail looked different that morning. You pull the authentication log for the period.',
 prompt:'Click the line that proves the attacker obtained access, even though every guess from the first address failed.',
 lines:[
  '02:01:11 authn src=198[.]51[.]100[.]77 user=akhan result=FAIL reason=bad_password mfa=none',
  '02:02:03 authn src=198[.]51[.]100[.]77 user=akhan result=FAIL reason=bad_password mfa=none',
  '02:03:44 authn src=198[.]51[.]100[.]77 user=akhan result=FAIL reason=bad_password mfa=none',
  '02:04:10 authn src=203[.]0[.]113[.]9 user=akhan result=FAIL reason=bad_password mfa=none',
  '02:04:55 authn src=203[.]0[.]113[.]9 user=akhan result=SUCCESS mfa=push_approved device=new',
  '02:05:02 authz src=203[.]0[.]113[.]9 user=akhan action=read_mailbox result=ALLOW',
  '02:05:40 authn src=10[.]20[.]4[.]55 user=akhan result=SUCCESS mfa=push_approved device=known',
  '02:06:12 authz src=203[.]0[.]113[.]9 user=akhan action=mfa_register_new_device result=ALLOW'],
 answerLines:[4],
 explain:'Three failed attempts from one address look like the whole story, but they are only the noise. The same account then authenticates successfully from a completely different address and the provider records a new device, which is the moment access was obtained. The mailbox read that follows confirms the impact, and the later registration of a new MFA device is persistence: the attacker is making sure they can come back. The final success from an internal address is the real user. Separating the entry point from the follow-up actions is what turns a log into a timeline.',
 focus:'Learn that a successful login from a new address and a new device is the entry point, while mailbox reads and new MFA registrations are what happens after.',
 hint1:'Three of these lines are failures. One of the successes is the real user on a known device.',
 hint2:'The proof of access is the success line that also records a new device.'},

/* ---------------- H25 ---------------- */
{
 id:'H25', elements:1, theme:'Prioritization & Response Workflow', type:'hotspot', title:'The runbook that closes itself too early',
 context:'You inherit the monthly patch runbook from the previous team. The system administrator follows it exactly as written, and last month three servers were recorded as patched while they were not.',
 prompt:'Click the single step that must be moved or removed before the next patch window.',
 lines:[
  'Monthly patch runbook — production Linux fleet',
  'Step 1: Notify the business and open the change record.',
  'Step 2: Take a snapshot of every server in this run.',
  'Step 3: Apply the patches to the servers in this run.',
  'Step 4: Mark the change record as complete.',
  'Step 5: Verify the package version with the package manager.',
  'Step 6: Reboot the servers that need it and watch the services come back.',
  'Step 7: Rescan those servers and attach the evidence to the ticket.'],
 answerLine:3,
 explain:'Step 4 closes the change record before the verification, the reboot and the evidence collection have happened. Once a change is marked complete in most systems, the record is locked, nobody expects further work, and any later failure belongs to nobody. The verification and the reboot must come first, because a package can be upgraded yet inactive until the service restarts. The other steps are all in a sensible place: notify, snapshot, patch, verify, reboot, rescan and attach evidence.',
 focus:'Learn that closing the record is a statement that the work is finished and proven, so it can never sit before verification and evidence.',
 hint1:'Look for a step that declares success before the checks that would prove it.',
 hint2:'A reboot still has to happen after this step, which means the work is not complete yet.'},

/* ---------------- H26 ---------------- */
{
 id:'H26', elements:6, theme:'Leadership & Communication', type:'order', title:'Building the reporting the board will trust',
 context:'You have just taken over the vulnerability programme and there is no reporting at all. The CISO wants a one-page monthly report that survives scrutiny. You must put the six steps in the order you will do them.',
 prompt:'Put the six steps in the order you will actually do them.',
 items:[
  {id:'s1',text:'Define what each metric means and who owns the number'},
  {id:'s2',text:'Collect the raw data from the scanner, the ticketing system and the inventory'},
  {id:'s3',text:'Baseline the current state for one month before publishing anything'},
  {id:'s4',text:'Publish one page with a small set of metrics and the trend'},
  {id:'s5',text:'Agree targets with the asset owners, not only with the security team'},
  {id:'s6',text:'Review the targets each quarter and change them when the business changes'}],
 correctOrder:['s1','s2','s3','s4','s5','s6'],
 explain:'A number nobody defined is a number nobody can defend, so the definitions and the owners come first. Then you collect the data from the three systems that hold it, because scan data alone cannot show whether anything was fixed. You baseline for a month before publishing, so that the first published trend is honest and not a spike caused by a new collection method. Then you publish one page: a small set of metrics beats a dashboard nobody reads. Targets are agreed with the asset owners, because they are the people who must hit them. The quarterly review keeps the targets matching the business instead of the tool.',
 focus:'Learn the order: define, collect, baseline, publish, agree targets, review. Publishing before baselining creates a number you cannot explain.',
 hint1:'Definitions come before data, and data comes before the first published report.',
 hint2:'A target that the asset owners never agreed to is not a target, it is a wish.'},

/* ---------------- H27 ---------------- */
{
 id:'H27', elements:2, theme:'Scanning, Testing & Attack Surface', type:'dual', title:'No patch, 300 partners',
 context:'A critical flaw in a widely used managed file transfer product is being exploited in the wild. The vendor has no patch and says one is at least three weeks away, so this is a real zero-day window. Northwind uses the product so that 300 hospital partners can send you files. Answer from both sides.',
 prompt:'Choose one answer in each part.',
 parts:[
  {label:'BLUE TEAM — what is your best immediate move?',
   correct:'Disable the vulnerable upload feature and use the managed portal.',
   options:[
    'Disable the vulnerable upload feature and use the managed portal.',
    'Leave the service running and add more staff to watch the dashboard.',
    'Switch the server off completely and stop all partner file transfers.',
    'Ask partners to send patient files as email attachments instead.']},
  {label:'RED TEAM — the vendor publishes a mitigation guide. What does an attacker try next?',
   correct:'Another feature of the product that the guide did not cover.',
   options:[
    'Another feature of the product that the guide did not cover.',
    'Send phishing emails that mention the flaw in the subject line.',
    'Reboot the target to see whether the mitigation is still active.',
    'Scan the target for open ports to find the service version.']}],
 explain:'When no patch exists, the best workaround removes the vulnerable function rather than the whole service: partners keep sending files, and the exploitable feature is gone from the internet. Watching a dashboard does not stop the exploitation, switching everything off breaks patient care, and email attachments are not a safe channel for clinical data. On the attacker side, a mitigation is a partial fix, so the next step is always to look for a neighbouring path that the guide forgot, which is why you keep detection running after applying it.',
 focus:'Learn that the best compensating control removes the vulnerable function while keeping the business running, and that every mitigation invites a bypass attempt.',
 hint1:'Blue: keep the business working while removing the exploitable feature. Red: a guide covers one path, not all of them.',
 hint2:'Patient files must not travel as email attachments, and turning the service off stops care.'},

/* ---------------- H28 ---------------- */
{
 id:'H28', elements:1, theme:'Leadership & Communication', type:'mcq', title:'The December freeze',
 context:'The billing system has a critical flaw. The fix needs a four-hour outage. The business wants to stay live through the December peak, which is three weeks away. The flaw is internal-only, there is no exploit code in the wild, and the system holds no card data.',
 prompt:'What is the correct leadership action?',
 options:[
  'Escalate the trade-off with the residual risk, require an owner and an expiry.',
  'Refuse the request, because a critical flaw must always be fixed immediately.',
  'Approve the delay quietly, because the host is internal and not exploited.',
  'Ask the vendor for a discount on support and take no further action.'],
 correct:'Escalate the trade-off with the residual risk, require an owner and an expiry.',
 explain:'Leadership in security means making a trade-off visible and putting it in front of the person who owns the consequence, with numbers attached. That means stating the residual risk after any compensating control, naming the asset owner who accepts it, and setting an expiry date right after the peak so the fix cannot drift forever. Refusing outright ignores the business impact of a four-hour outage in the busiest week. Approving it quietly leaves a critical flaw with no owner and no review date, which is how a three-week delay becomes a permanent one.',
 focus:'Learn that accepting risk is a legitimate decision when it is documented, owned, controlled and time-limited.',
 hint1:'The business cost is real, but so is the risk. Which answer records both?',
 hint2:'A silent approval and a flat refusal both remove the decision from the person who owns the consequence.'},

/* ---------------- H29 ---------------- */
{
 id:'H29', elements:8, theme:'Leadership & Communication', type:'dnd', title:'Accountable or just responsible?',
 context:'A critical finding on the billing platform needs a decision by Friday. The ticket names the CISO, the asset owner, the vulnerability manager, the platform engineer, the system administrator, legal counsel and the third-party risk manager. Your new analyst keeps writing "the team owns it" in the notes, so you explain the difference between being accountable for a risk and being the person who does the work.',
 prompt:'Sort each action: is the person accountable for the outcome, or responsible for carrying out the work?',
 zones:[
  {id:'acc',label:'Accountable — owns the outcome and the consequence'},
  {id:'res',label:'Responsible — does the work'}],
 items:[
  {id:'i1',text:'Signs the exception that leaves the flaw open until the December freeze',zone:'acc'},
  {id:'i2',text:'Applies the patch on the billing server in the Sunday window',zone:'res'},
  {id:'i3',text:'Pays for the fix from the business budget for that platform',zone:'acc'},
  {id:'i4',text:'Rebuilds the failed host from the approved golden image',zone:'res'},
  {id:'i5',text:'Accepts the residual risk in writing with an expiry date',zone:'acc'},
  {id:'i6',text:'Runs the verification rescan and attaches the evidence to the ticket',zone:'res'},
  {id:'i7',text:'Answers to the board when the risk is realised',zone:'acc'},
  {id:'i8',text:'Writes the change record and updates the asset inventory entry',zone:'res'}],
 explain:'Accountability is about the consequence: the person who signs the exception, funds the fix, accepts the residual risk and answers to the board owns the outcome. Responsibility is about the work: applying the patch, rebuilding the host, running the rescan and keeping the records are tasks, and they can be delegated to a platform engineer or a system administrator without moving the accountability. The CISO sets the risk appetite and carries the enterprise picture, legal counsel and the third-party risk manager contribute their own judgements, but none of them takes the consequence away from the asset owner. This is why a ticket that says "the team owns it" stalls: nobody is accountable.',
 focus:'Learn the RACI distinction: several people can be responsible for tasks, but only one person is accountable for the outcome.',
 hint1:'Four items end with somebody signing, paying or answering for it. Four end with a task being performed.',
 hint2:'Anyone can be told to run a rescan. Only the risk owner can accept the risk.'},

/* ---------------- H30 ---------------- */
{
 id:'H30', elements:4, theme:'Leadership & Communication', type:'fill', title:'Four numbers on one dashboard',
 context:'The CISO wants a dashboard with exactly four numbers and no vanity metrics. Each caption must be filled with the metric that matches it.',
 prompt:'Complete the four gaps on the CISO dashboard with the metric each caption describes.',
 sentence:'The first number is the ______, which shows the share of assets that met the patching deadline. The second is the ______, which shows how long our open findings have been waiting. The third is the ______, which measures the time from a patch being released to it being installed here. The fourth is ______, which shows the share of internet-facing assets we can actually check with credentials.',
 blanks:['patch compliance rate','vulnerability aging','mean time to patch','scan coverage'],
 bank:['mean time to detect','scan coverage','patch compliance rate','risk appetite','vulnerability aging','mean time to patch','exception count','backlog velocity'],
 explain:'Patch compliance rate is the percentage of assets inside the deadline, so it measures the promise you made to the business. Vulnerability aging shows how long open findings have waited, which exposes a backlog that a compliance percentage can hide. Mean time to patch starts when the vendor releases the fix and stops when it is installed on your estate. Scan coverage is the quiet one: without it, a low findings count may simply mean that half the estate was never really checked. Mean time to detect and risk appetite measure different things, and an exception count is a supporting detail rather than a headline.',
 focus:'Learn what starts and stops each clock, and remember that coverage must sit next to findings or the findings number means nothing.',
 hint1:'One number is a percentage of assets, one is a duration, one is an age, one is a share of scanning reach.',
 hint2:'The last caption is about how much of your estate you can actually check, not about how long something took.'},

/* ---------------- H31 ---------------- */
{
 id:'H31', elements:5, theme:'Prioritization & Response Workflow', type:'rank', title:'Five controls for a device you cannot patch',
 context:'A production control device runs an operating system the vendor will never update again. It must stay on the factory floor and it must keep working. Five compensating controls are on the table. Rank them from the most effective at reducing the risk to the least effective.',
 prompt:'Rank the five controls from the most effective to the least effective.',
 items:[
  {id:'a',text:'Firewall in front of the device that permits all traffic but logs every packet'},
  {id:'b',text:'Jump host with multi-factor authentication for every administrative session'},
  {id:'c',text:'Allow-list VLAN that permits only the one engineering protocol the device needs'},
  {id:'d',text:'Unsupported antivirus agent installed on the device against vendor advice'},
  {id:'e',text:'Full packet capture of the device segment with a daily review of the alerts'}],
 correctOrder:['c','b','e','a','d'],
 explain:'An allow-list segment is the strongest control because it removes reachability: most attacks simply cannot get to the device. MFA on a jump host is second, because it protects the administrative path that an attacker would use to take the device over. Packet capture with a daily review is third: it detects but does not prevent, and it depends on somebody actually looking. A firewall that permits everything and only logs is fourth, because it produces data without reducing reachability. The unsupported antivirus agent is last: it may destabilise a control device that must not fail, and it creates a false sense of protection because the vendor will not support it.',
 focus:'Rank controls by what they remove: reachability first, then access to privileged functions, then detection, then visibility alone, and finally unsupported tools that may break the asset.',
 hint1:'Two controls only produce data. One of those two also stops nothing at all.',
 hint2:'The control that removes reachability beats everything else, and the one the vendor refuses to support is the weakest.'},

/* ---------------- H32 ---------------- */
{
 id:'H32', elements:8, theme:'Vulnerability Management Fundamentals', type:'dnd', title:'Which half of the risk does this change?',
 context:'Risk is likelihood multiplied by impact. The architecture team is proposing eight changes and wants to know which half of the risk each one reduces, because the board asked for the difference.',
 prompt:'Sort each change: does it reduce the likelihood of a successful attack, or does it reduce the impact if the attack succeeds?',
 zones:[
  {id:'lik',label:'Reduces the likelihood'},
  {id:'imp',label:'Reduces the impact'}],
 items:[
  {id:'i1',text:'Install the vendor patch for the vulnerable library',zone:'lik'},
  {id:'i2',text:'Block the vulnerable management port at the firewall',zone:'lik'},
  {id:'i3',text:'Segment the device so an attacker cannot reach the rest of the estate',zone:'imp'},
  {id:'i4',text:'Keep hourly backups and test a restore every month',zone:'imp'},
  {id:'i5',text:'Turn on multi-factor authentication for the admin console',zone:'lik'},
  {id:'i6',text:'Delete the vulnerable plugin from the web server',zone:'lik'},
  {id:'i7',text:'Buy cyber insurance that covers the loss',zone:'imp'},
  {id:'i8',text:'Write and rehearse an incident response plan for the payment system',zone:'imp'}],
 explain:'Likelihood changes when you make a successful attack harder: patching, removing vulnerable code, blocking the path and adding an authentication step all do that. Impact changes when you make the consequences smaller: segmenting limits how far an attacker can spread, backups and rehearsed response plans shorten the outage and reduce the loss, and insurance moves part of the financial cost. A good programme needs both halves, because some attacks will always get through.',
 focus:'Learn to sort any control by asking whether it makes the attack less likely or the damage smaller.',
 hint1:'Two pairs of these are clearly about recovery and containment after the fact.',
 hint2:'MFA and segmenting sound similar but one blocks the entry and the other limits the spread.'},

/* ---------------- H33 ---------------- */
{
 id:'H33', elements:1, theme:'Vulnerability Management Fundamentals', type:'hotspot', title:'The host that was rebuilt three weeks ago',
 context:'WEB-06 was rebuilt from the approved golden image on 22 May, after the hardening standard for the web tier was applied. A CIS Benchmarks based compliance report now compares the live host with the configuration baseline. The report lists one failure. Change records show a maintenance ticket and a marketing pilot on that host, and the platform team mentions a legacy reporting agent that is end-of-life software since 2023: the vendor stopped supporting it, so the whole host is now a legacy system that nobody wants to touch.',
 prompt:'Click the line that proves this host has drifted away from the approved baseline since it was rebuilt.',
 lines:[
  'CIS compliance report — host WEB-06 — baseline web-tier-v4 — evaluated 12 Jun 2024',
  'PASS 1.1.1 Ensure mounting of cramfs filesystems is disabled',
  'PASS 1.4.1 Ensure permissions on bootloader config are configured',
  'PASS 2.2.15 Ensure the telnet server is not installed',
