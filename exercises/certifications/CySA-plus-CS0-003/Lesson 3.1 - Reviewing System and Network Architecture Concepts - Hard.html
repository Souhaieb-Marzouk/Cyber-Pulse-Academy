/* ---------------- H29 ---------------- */
{
  id:"H29", theme:"Data Protection & Cryptography", type:"fill", pts:5,
  scenario:"The analytics platform will receive customer data from four source systems. Card numbers are already replaced by tokenization and hidden by masking in the support tool, so the data protection officer is happy with those two controls. Her new questions are different. She wants to know where the data may live, who may move it, and how long it stays. You must complete the decision record before the build starts.",
  question:"Which term completes the data handling decision record?",
  text:"Every data set must carry a [[1]] so that the handling rules follow the data wherever it goes. Card numbers leaving the analytics platform by email must be stopped by a [[2]] rule. The health records of German customers must stay inside the European Union, which is a [[3]] requirement. Records older than seven years must be deleted, which is a [[4]] requirement. When that period ends, the data must be removed in a way that cannot be reversed, which is [[5]].",
  answers:[["classification","data classification","label"],["DLP","data loss prevention"],["data residency"],["data retention","retention"],["secure destruction","secure deletion","crypto-shredding"]],
  bank:["classification","DLP","data residency","data retention","secure destruction","tokenization","masking","failover","sharding","key rotation"],
  hint:"One gap is the label that decides handling, one is the control that stops data leaving, one is about where data may live, one is about how long it stays, and one is about how it is removed.",
  exp:"A classification label is what makes handling rules follow the data. It tells every system whether the data is public, internal, confidential or restricted. A DLP rule stops sensitive values leaving through a channel such as email, and it records the attempt. Data residency is a legal rule about where data may be stored and processed, so it decides which regions and providers are allowed. Data retention says how long you may keep the data. Secure destruction says how it must be removed once that period ends. Encryption at rest and encryption in transit protect the stored copy and the wire, and key management decides who can unlock them. A hash gives you integrity, not secrecy, which is why hashing is not a substitute for any of these controls.",
  focus:"Learn which control answers which legal question: label for handling, DLP for movement, residency for location, retention for time, destruction for removal.",
  aLabel:"PUT A TERM IN EACH SLOT"
},

/* ---------------- H30 ---------------- */
{
  id:"H30", theme:"Visibility, Monitoring & Frameworks", type:"drop", pts:5,
  tname:"FRAMEWORK MAPPING",
  scenario:"The board asks how the security programme is organised and how the team describes threats and defenses. The current report mixes attacker behaviour, defensive countermeasures, programme functions and configuration settings in one list, which makes it impossible to see gaps. You must sort the entries by the framework layer each one belongs to.",
  question:"Drag every entry into the correct framework layer. Every entry must be placed.",
  buckets:[
    {name:"MITRE ATT&CK - attacker behaviour", items:[
      "T1021 Remote Services used to move from a workstation to a file server",
      "T1071 Application Layer Protocol used for command and control",
      "T1567 Exfiltration Over Web Service"
    ]},
    {name:"MITRE D3FEND - countermeasure", items:[
      "Network isolation of a workload from its peers",
      "Credential hardening that makes a stolen password much less useful",
      "File analysis that checks a binary or a document before it is opened"
    ]},
    {name:"NIST CSF - programme function", items:[
      "Identify: the asset inventory and data classification",
      "Respond: the incident playbook that contains and eradicates",
      "Recover: restore from the immutable backup and validate the service"
    ]},
    {name:"CIS Benchmarks - configuration setting", items:[
      "The rule that sets root login to no on every Linux server",
      "The Windows setting that disables the legacy SMB version one protocol",
      "The container admission rule that blocks privileged pods"
    ]}
  ],
  hint:"One layer describes what the attacker does, one describes what the defender does, one organises the programme, and one is a list of settings.",
  exp:"Each framework answers a different question, and mixing them hides the gaps. MITRE ATT&CK describes attacker behaviour as tactics and techniques. It is used to measure detection coverage and to describe an incident in a shared language. MITRE D3FEND describes defensive countermeasures and maps them against those techniques. The NIST CSF organises the programme into functions, which is what a board needs to see. CIS Benchmarks, and the CIS Controls behind them, give the configuration settings and prioritised safeguards. When one list contains a technique, a countermeasure, a function and a setting, nobody can tell what is missing. Regulatory obligations are a separate axis. ISO 27001, SOC 2, PCI DSS and HIPAA say what you must prove. The four layers above say what you must build.",
  focus:"Ask what question the framework answers before you file anything under it: attacker, defender, programme or setting.",
  aLabel:"DRAG EACH ENTRY INTO ITS FRAMEWORK LAYER"
},

/* ---------------- H31 ---------------- */
{
  id:"H31", theme:"Perimeter, Proxy & Cloud Edge", type:"multi", pts:5,
  tname:"INCIDENT RESPONSIBILITY REVIEW",
  scenario:"Customer records were read from a managed database service. The provider's status page says the platform was not compromised and that the managed engine was patched. The customer side shows a public database endpoint that was enabled for a migration, a firewall rule that allowed any source, one database user with full rights shared by three services, and audit logging enabled with a three day retention. The provider's console keeps thirty days of platform logs.",
  question:"Select every conclusion that the evidence supports.",
  options:[
    {t:"The exposure is on the customer side of the shared responsibility model: a public endpoint and an open source rule are customer settings", ok:true},
    {t:"One shared database user with full rights removes attribution, so no one can say which service or person read the records", ok:true},
    {t:"The provider patches the managed engine, while the customer decides who may reach the data and what they may do with it", ok:true},
    {t:"The three day customer retention is an evidence problem, so the platform logs must be exported and preserved now", ok:true},
    {t:"The audit report must document both sides of the model, because the contract and the service model decide where the line sits", ok:true},
    {t:"The provider is responsible, because the records were stored on the provider platform", ok:false},
    {t:"The customer is responsible for patching the managed database engine, because the records belong to the customer", ok:false},
    {t:"No conclusion is possible, because the customer logs only cover three days", ok:false}
  ],
  hint:"Separate three things: who owns the platform, who owns the configuration, and who can still prove what happened.",
  exp:"The shared responsibility model says the provider secures the cloud and the customer secures what is in the cloud. In a managed database service the provider patches the engine and runs the hardware. The customer owns the endpoint settings, the firewall rules, the database users and the data. Here the customer side is where the exposure lives. A public endpoint left on after a migration, plus a rule that allows any source, would expose the service even on a perfectly patched platform. The single shared database user with full rights is the second failure. Without separate identities you cannot say which application or person read the records. The third issue is evidence. A three day log retention window destroys the customer's own record, while the provider still holds thirty days.",
  focus:"Learn to answer three questions in order: who owns the platform, who owns the configuration, and who can still prove what happened?",
  aLabel:"CHOOSE ALL THAT APPLY"
},

/* ---------------- H32 ---------------- */
{
  id:"H32", theme:"System & Endpoint Architecture", type:"order", pts:5,
  scenario:"A new jump host will be the only administration path into the DMZ. The audit finding from the last build was that the host was reachable from the internet for eleven hours before it was hardened. This time the build must be sequenced so that the host is never reachable before it is ready, and the evidence must be attached to the change record.",
  question:"Put the build steps in the correct order. The first step goes at the top.",
  items:[
    "Build the host from the approved hardened image with the baseline applied, in a build VLAN that has no route to the DMZ",
    "Install the EDR agent, the host based firewall and the logging agent, and confirm that events arrive in the SIEM",
    "Enrol the host in the configuration management and patch system so that drift and missing patches are reported",
    "Apply the firewall policy: administration only from the admin VLAN addresses, all other inbound traffic denied, and egress limited to the managed servers",
    "Move the host into the DMZ management segment and confirm with a scan that only the approved administration ports are reachable",
    "Issue the host certificate from the internal PKI, add the host to the privileged access inventory, and turn on session recording",
    "Run the acceptance test: an access review of the host, a restore test of its logs, and an alert test for a failed administrator logon"
  ],
  hint:"The host must never be reachable before it is hardened, instrumented and managed. Exposure and acceptance come last.",
  exp:"The order is the control. Build from the approved image inside a build VLAN with no route to the target network, so a half built host is not exposed. Then instrument it with EDR, a host-based firewall and log forwarding. A host you cannot see is not ready to be trusted. Enrol it in patch and configuration management, so drift is reported rather than discovered later. Only then apply the restrictive firewall policy that limits administration to the admin VLAN. Only after that move the host into its segment, and prove with a scan that nothing else is reachable. Identity comes next: an internal certificate, entry in the privileged access inventory (PAM) and session recording. The acceptance test closes the loop with an access review, a log restore test and an alert test. This is defense in depth in one build, and it is attack surface reduction in practice: the host is exposed last. The jump host is also a bastion host, a single named and monitored path, and least functionality applies to its service list as well.",
  focus:"Remember the sequence: build isolated, instrument, manage, restrict, expose, identify, then prove it with tests.",
  aLabel:"PUT THE BUILD STEPS IN ORDER"
},

/* ---------------- H33 ---------------- */
{
  id:"H33", theme:"System & Endpoint Architecture", type:"match", pts:5,
  tname:"AIR GAP TRANSFER DESIGN",
  scenario:"The control network at the plant has no routed connection to the corporate network. Four kinds of data must still cross the boundary in one direction or the other, and the plant manager wants a method for each one that a regulator will accept.",

  pairs:[
    ["Daily production figures from the OT historian to corporate reporting","A unidirectional gateway or data diode that only allows data out of the control zone"],
    ["Vendor firmware for a controller, arriving from the corporate network","A reviewed, scanned and signed transfer through a controlled kiosk with two person approval"],
    ["A quick one-off text note for the plant manager","The same controlled kiosk process, because convenience must not create a new path"],
    ["Threat intelligence into the OT monitoring sensor","A one way feed into the passive monitoring sensor, never into the controller network"],
    ["An emergency change during an unplanned plant outage","A documented break glass procedure with approval, logging, and a review afterwards"]
  ],
  hint:"Boundary crossing is a process, not a device. Decide the direction first, then ask who approves it.",
  exp:"A real air gap is a process, not a missing cable. When data has to move out of the control zone, a unidirectional gateway or data diode enforces the direction in hardware. Production figures reach corporate reporting, and nothing can travel back. When something must come in, such as vendor firmware, the route is a controlled kiosk. The file is reviewed, scanned and signature checked, and two people approve the release. That is the same dual control idea used for key material. The temptation to make an exception for a small convenience is how air gaps fail. A one-off note uses the same path as a firmware release, because every exception creates a route an attacker can study. Threat intelligence flows into the passive monitoring sensor, never into the controller network.",
  focus:"Learn the phrase one way or approved: every crossing is either enforced in hardware or approved by two people. Everything else is a gap.",

/* ---------------- H34 ---------------- */
{
  id:"H34", theme:"Visibility, Monitoring & Frameworks", type:"drop", pts:5,
  tname:"THREAT MODEL - STRIDE",
  scenario:"The driver portal is being threat modelled before development starts. It is internet facing, it authenticates drivers through the corporate identity provider using OIDC, it reads payroll data for verification, it stores uploaded documents in object storage, and it calls an external address verification service that bills per call.",

  hint:"Six categories, six threats. Ask what the attacker gains: someone else's identity, changed data, a denied action, data they should not see, a stopped service, or more rights.",
  exp:"Threat modeling asks six questions, and STRIDE is the memory aid for them: six ways a design can fail. Spoofing is pretending to be someone else. A replayed token is a design problem, not just a stolen secret, so short sessions and token binding are the countermeasures. Tampering is changing data, and an anonymous write to the document bucket is the classic case. Repudiation is denying an action, which is why application level audit records matter. Information disclosure is seeing what you should not, such as a query without row level authorisation. Denial of service is stopping the service, and an external paid API adds a quota an attacker can burn for you. Elevation of privilege is gaining more rights, and a service account with wide database rights turns one parameter flaw into full data access.",

},

{

  tname:"ATT&CK TACTIC MAPPING",
  scenario:"You are writing the timeline of a completed intrusion for the lessons learned report. The report must describe the attack in a shared language, so each observed action has to be placed under the MITRE ATT&CK tactic it belongs to. An auditor will compare your mapping with the detection rules that exist today.",

  hint:"Order the actions by what the attacker needed first: get in, get credentials, look around, move, keep contact, take data out.",
  exp:"ATT&CK gives you one vocabulary for the whole case. Using valid accounts is an initial access technique. Account takeover through a phishing page or a reused password often looks like a normal login, so rules that only look for exploits miss it. Credential access comes next. Requesting service tickets for cracking and reading authentication memory are two different techniques with two different detections. Discovery is the scan, which is usually loud and therefore useful. Lateral movement covers the stolen ticket session and the network logon to a remote service. Both need host level telemetry, because the network path looks legitimate. Command and control is the beacon, where detection is periodicity and jitter rather than content. A tactic with no detection rule is a visible gap.",
