  scenario:"You are writing the first microsegmentation policy for the payments namespace. The application design document says the web tier calls the API on 8443, the API calls the database on 1521, and the monitoring platform scrapes metrics on 9100 from every workload. The flow export covers a full week, and the security team wants a policy that is written from the design, not from what happens to be running.",
  question:"Drag each observed flow into the right decision bucket. Every flow must be placed.",
  buckets:[
    {name:"Allow: documented and needed", items:[
      "web-01 -> api-02 tcp/8443, matches the designed call path",
      "api-02 -> db-01 tcp/1521, matches the designed call path",
      "monitoring-01 -> every workload tcp/9100, the metrics scrape"
    ]},
    {name:"Deny: not part of the design", items:[
      "api-02 -> db-01 tcp/22, SSH from the application to the database",
      "marketing-laptop-27 -> db-01 tcp/1521, a user device reaching the payments database",
      "staging-web-05 -> prod-db-01 tcp/1521, staging reaching production data"
    ]},
    {name:"Investigate before writing a rule", items:[
      "api-02 -> 10[.]60[.]7[.]9 tcp/443 outbound every 300 seconds with a fixed 512 byte payload",
      "backup-01 -> db-01 tcp/1521 at 02:00 nightly, no owner recorded for the job"
    ]}
  ],
  hint:"Three questions in order: is it in the design document, is it obviously outside the design, or do you not yet know what it is?",
  exp:"Microsegmentation starts from the documented design, not from the traffic that happens to exist. Existing traffic may already contain the attacker or a shadow process. Flows that match the design are allowed, as narrowly as possible: named source, named destination, one port. Flows clearly outside the design are denied. The two best examples here are a user laptop reaching the payments database and staging reaching production data. Both remove a path that attackers use after a first compromise. Flows you cannot explain are neither allowed nor denied on the spot. They are investigated. An outbound connection every 300 seconds with a fixed payload size has the shape of C2 beaconing. East-west traffic between servers never appears at the perimeter, because the edge firewall only sees north-south traffic.",
  focus:"Learn the three buckets by heart: designed, clearly wrong, and unexplained. Only the first and second can be decided immediately.",
  aLabel:"DRAG EACH FLOW INTO ITS DECISION"
},

/* ---------------- H4 ---------------- */
{
  id:"H4", theme:"Perimeter, Proxy & Cloud Edge", type:"mcq", pts:5,
  scenario:"The SOC sinkholes known malicious domains at the internal resolvers, so blocked clients receive 10[.]0[.]0[.]250 and raise an alert. The threat feed adds a new command and control domain. Over the next day the proxy logs show an internal workstation opening TLS sessions to a hard coded address with a random looking server name in the SNI field, but no internal resolver ever logs a query for that domain. Several browsers on the estate are configured to use DNS over HTTPS against a public resolver, and the mobile application uses DNS over TLS.",
  question:"What is the most likely explanation, and what is the correct design response?",
  options:[
    {t:"DNSSEC validation failed, so the sinkhole answered with the real address instead of the blocked one", ok:false},
    {t:"Clients use DNS over HTTPS or DNS over TLS to a public resolver, so the sinkhole never sees the query at all", ok:true},
    {t:"The threat feed is wrong, because no internal resolver logged a query for the domain at any time", ok:false},
    {t:"The proxy must listen on the DNS port so that it can capture the queries as they pass through it", ok:false}
  ],
  hint:"Ask yourself who answered the name lookup, and whether your own resolver was ever in the conversation.",
  exp:"DNS over HTTPS and DNS over TLS encrypt the lookup. That is good for privacy and bad for a sinkhole that depends on seeing queries. A client configured to use a public resolver never asks your resolver. Your block list, your DNSSEC validation and your logging are all bypassed. The workstation can then reach a domain you already know is malicious. The design response is to control name resolution at the egress. Block direct external DNS from client networks, and force the managed resolvers. DNSSEC proves authenticity, it does not block anything, so it cannot be the explanation. No query in your logs is not evidence of safety. It is evidence that your resolver was not used.",
  focus:"Learn that encrypted DNS and sinkholes conflict. If the design relies on a sinkhole, the design must also control which resolver clients may use.",
  aLabel:"CHOOSE ONE"
},

/* ---------------- H5 ---------------- */
{
  id:"H5", theme:"Perimeter, Proxy & Cloud Edge", type:"drop", pts:5,
  tname:"POLICY REVIEW",
  scenario:"The secure web gateway has an inspection exclusion list that has not been reviewed for three years. Every entry on that list is traffic nobody can see. Legal and the CISO ask you to keep only the exclusions that are still justified by the recorded reason and by current use.",
  artefact:{label:"TLS inspection exclusion list (extract)", kind:"table", head:["Entry","Recorded reason","Current status"],
    rows:[
      ["Banking and healthcare categories","Privacy and legal advice from 2021","Still in policy"],
      ["Government tax portal domain","Legal obligation, submissions must not be intercepted","Still in policy"],
      ["Payments partner mobile app","Certificate pinning, app breaks if inspected","In daily use"],
      ["Legacy SCADA vendor support portal","Client certificate pinning, maintenance contract to 2027","In daily use"],
      ["Warehouse IoT sensor update server","Pinned firmware certificate, no other endpoint","In daily use"],
      ["Old HR portal domain","Excluded for slow inspection in 2022","Service retired in 2022"],
      ["Marketing analytics SaaS","Excluded for performance during a campaign in 2021","No recorded owner, still used by one team"],
      ["Guest wireless subnet","Excluded because guest traffic is not corporate","Guest users also reach the partner portal"]
    ]},
  question:"Drag every entry into the right decision column. Every entry must be placed.",
  buckets:[
    {name:"Must stay excluded", items:[
      "Banking and healthcare categories, for privacy and legal reasons",
      "The government tax portal, where interception would break a legal duty",
      "The payments partner mobile app and the legacy SCADA vendor portal, both pinned",
      "The warehouse IoT sensor update server, with a pinned firmware certificate"
    ]},
    {name:"Remove from the list", items:[
      "The old HR portal domain, retired in 2022 but still on the list",
      "The marketing analytics service, excluded for speed in 2021 and owned by nobody"
    ]},
    {name:"Needs a decision with a named owner", items:[
      "The guest wireless subnet, because guests also reach the partner portal"
    ]}
  ],
  hint:"Keep an exclusion for a legal duty or a pinned certificate you cannot change. Remove it when the reason was speed or the service is gone.",
  exp:"An exclusion list is a blind spot, so every entry must earn its place. A legal duty justifies an exclusion, such as banking and healthcare privacy rules or a tax portal that must not be intercepted. A pinned certificate also justifies one, because inspection would break the application, and the payments app, the SCADA portal and the IoT update server all pin. The retired HR portal must go, and the performance-only exclusion has no owner, so it must go too unless the team can justify it. The guest subnet is the opposite of safe, because guests can reach the partner portal, so it needs a decision and an owner. Naming helps too: the gateway is a forward proxy for outbound traffic, and a reverse proxy stands in front of the servers.",
  focus:"Two reasons justify a bypass: a legal duty, or a certificate pin you cannot change. Everything else needs a reason, an owner and a date.",
},

/* ---------------- H6 ---------------- */
{
  id:"H6", theme:"Visibility, Monitoring & Frameworks", type:"branch", pts:5,
  scenario:"An attacker enters through a compromised VPN account. You watch them enumerate the network for 40 minutes. They touch FS-ARCHIVE-02, a decoy file server on a separate VLAN that has no user activity, no patch traffic and no business role. The attacker stops for a while, then restarts with a slow scan that uses long delays and random ports. The team lead asks whether the deception programme is still useful.",
  question:"Work through the deception decision step by step.",
  steps:[
    {s:"The attacker touched the decoy, then stopped immediately.",
     q:"What is the right interpretation?",
     options:[
       {t:"Treat it as possible detection: assume the attacker may have recognised a host with no traffic and no role, so the decoy is burned as a reliable signal", ok:true, fb:"Correct. A careful operator looks for hosts that are too quiet. Assume detection and keep the value you still have."},
       {t:"It proves the attacker found nothing and moved on", ok:false, fb:"A short pause is not proof. It is at least as likely to be the attacker changing behaviour after recognising a trap."},
       {t:"It means the decoy worked perfectly, so the case can be closed as contained", ok:false, fb:"Nothing was contained. The attacker still holds a valid account and freedom to move."}
     ]},
    {s:"The deception team asks what to do with the decoy network.",
     q:"What is the best immediate action?",
     options:[
       {t:"Keep the decoy running but stop treating it as a trusted detection source, and place fresh canary tokens in places the attacker has not yet touched", ok:true, fb:"Correct. You preserve the observation value while you rebuild the signals the attacker has not seen."},
       {t:"Turn off every decoy so that the attacker cannot learn anything from them", ok:false, fb:"You lose all future visibility, and the attacker learns from your network either way."},
       {t:"Record in the ticket that the attacker has detected the deception and leave the design unchanged", ok:false, fb:"Documenting a burned signal without replacing it leaves the programme blind."}
     ]},
    {s:"The attacker restarts with a slow scan, long delays and random ports.",
     q:"What does this pattern indicate, and what should you prioritise?",
     options:[
       {t:"A live operator using evasion; slow your analysis windows, and prioritise the entry account and the attacker infrastructure", ok:true, fb:"Correct. Slow, low volume behaviour is a human decision. You need long window hunting and you must cut the account that let them in."},
       {t:"An automated worm that is failing to spread; block the source address and close the case", ok:false, fb:"Worms do not pause and then slow down deliberately. This is a person adapting."},
       {t:"Broken tooling on the attacker side; wait for the next stage before acting", ok:false, fb:"Waiting is a decision to give the attacker more time inside the network."}
     ]}
  ],
  hint:"A decoy that stops being touched is not a failure, but it is no longer proof. Rebuild your signals somewhere the attacker has not looked.",
  exp:"Deception works because a honeypot and a canary token have no legitimate reason to be touched. A careful attacker checks whether a host is too quiet. So a decoy that is touched and then abandoned may be burned. The professional response is not to switch everything off, and not to declare victory. You keep the decoy for observation and stop trusting it as a clean signal. Then you deploy fresh honeytokens in places the attacker has not seen. The slower, low volume scan that follows is the signature of a human operator. Extend your analysis windows and shift priority to the account used for initial access and to the attacker infrastructure.",
  focus:"Learn to say burned signal instead of failed control. Detection sources age, and the design must assume they will.",
  aLabel:"CHOOSE YOUR PATH, STEP BY STEP"
},

/* ---------------- H7 ---------------- */
{
  id:"H7", theme:"Network Architecture & Segmentation", type:"drop", pts:5,
  tname:"LAYER 2 EVIDENCE REVIEW",
  scenario:"Three sites sent their switch logs after a security review found that access ports were not hardened. Some records show real attacks, some show misconfiguration that enables an attack, and some are ordinary traffic that a junior analyst reported as suspicious. The report must not mix them.",
  question:"Drag every observation into the right bucket. Every observation must be placed.",
  buckets:[
    {name:"VLAN hopping", items:[
      "Frames with two 802.1Q tags arrive on an access port and the inner tag names a protected VLAN",
      "An access port receives DTP frames asking to negotiate a trunk",
      "The native VLAN on the two ends of a trunk does not match, so frames leave untagged and land in the other VLAN"
    ]},
    {name:"ARP spoofing / MITM", items:[
      "ARP replies claim the gateway address for a MAC that belongs to a workstation",
      "The same MAC address appears on two different access ports one second apart, with a MAC that belongs to the gateway"
    ]},
    {name:"Normal or benign", items:[
      "Gratuitous ARP from a new server announcing its own address after a failover",
      "A workstation sends a DHCP request and receives a lease in the user VLAN"
    ]}
  ],
  hint:"Ask what the attacker gains: a frame in a VLAN they should not reach, a false mapping between an address and a MAC, or nothing at all.",
  exp:"VLAN hopping is about reaching a VLAN you are not entitled to use. Double tagging sends frames with two 802.1Q headers, so the outer tag is stripped and the inner tag lands the frame elsewhere. DTP negotiation turns an access port into a trunk. A native VLAN mismatch on a trunk sends untagged frames into the wrong VLAN. All three are fixed the same way: disable DTP, use an unused native VLAN, and never put an access port in the native VLAN. ARP spoofing is a different attack. The attacker answers ARP requests so victims send their traffic to the attacker, which is man in the middle. The giveaway is a gateway address mapped to a workstation MAC. A gratuitous ARP after a failover and a normal DHCP lease are ordinary behaviour.",
  focus:"Separate the attack goal before you name the technique: reaching another VLAN, poisoning an address mapping, or neither.",
  aLabel:"DRAG EACH OBSERVATION INTO ITS BUCKET"
}

);

<script>
EXERCISES.push(

/* ---------------- H8 ---------------- */
{
  id:"H8", theme:"System & Endpoint Architecture", type:"terminal", pts:5,
  scenario:"You are closing the DMZ build audit for change CHG-4471 on host 10.10.20[.]14. The auditor refused your summary and asked for the raw evidence file, produced by a reproducible command, because the finding may go to the external assessor. You are working from the analyst workstation ws-ana-04 and you must leave the output on disk at /tmp/dmz-audit.txt.",
  question:"Type the single command that enumerates the open TCP ports and the service versions of 10[.]10[.]20[.]14 and writes the raw result to /tmp/dmz-audit.txt.",
  accept:[
    /^(?=[\s\S]*-sV)(?=[\s\S]*10\[\.\]10\[\.\]20\[\.\]14)(?=[\s\S]*-o[NAXG][\s\S]*\/tmp\/dmz-audit\.txt)[\s\S]*$/i,
    /^(?=[\s\S]*-A\b)(?=[\s\S]*10\[\.\]10\[\.\]20\[\.\]14)(?=[\s\S]*-o[NAXG][\s\S]*\/tmp\/dmz-audit\.txt)[\s\S]*$/i
  ],
  answerCmd:"nmap -sV -oN /tmp/dmz-audit.txt 10[.]10[.]20[.]14",
  hint:"The auditor needs two things you have not been asked for yet: the version behind each port, and a file on disk instead of text on a screen.",
  exp:"The evidence has to prove two things at once: which ports are open, and which software is behind them. Version detection is what turns a list of ports into a finding, because only then can you match a port against a known vulnerable version. The second requirement is the output file. An auditor, and later a court or a regulator, wants the raw artefact with a timestamp. A paragraph that you typed is not evidence. Writing the result to a file also makes the check reproducible, so the next analyst can repeat the exact command and compare. A pass without a saved file is an opinion; a pass with a saved file is evidence.",
  focus:"When the question says audit or evidence, the answer always includes saving the raw output. Summaries are not evidence.",
  aLabel:"TYPE THE COMMAND"
},

/* ---------------- H9 ---------------- */
{
  id:"H9", theme:"Visibility, Monitoring & Frameworks", type:"terminal", pts:5,
  scenario:"Web-03 is behind a suspected application layer flood. The access log /var/log/nginx/access.log has grown to 1.2 GB in one day, and the incident manager does not want to open it by hand. She asks for the ten client addresses that made the most requests, from most to least, written to /tmp/top10.txt for the incident ticket.",
  question:"Type the command that produces the ten client addresses with the most requests, from most to least, and writes them to /tmp/top10.txt.",
  accept:[
    /^(?=[\s\S]*access\.log)(?=[\s\S]*uniq\s+-c)(?=[\s\S]*sort\s+-[nr]{2})(?=[\s\S]*\/tmp\/top10\.txt)[\s\S]*$/i,
    /^(?=[\s\S]*access\.log)(?=[\s\S]*sort\s+-[nr]{2})(?=[\s\S]*uniq\s+-c)(?=[\s\S]*\/tmp\/top10\.txt)[\s\S]*$/i
  ],
  answerCmd:"awk '{print $1}' /var/log/nginx/access.log | sort | uniq -c | sort -rn | head -10 > /tmp/top10.txt",
  hint:"You need four stages: take one field from every line, group identical values and count them, sort the counts as numbers in reverse, then keep only the first ten.",
  exp:"The pipeline is the standard shape for this question. Take the first field of every line, which is the client address. Sort the addresses so identical values sit together, because uniq only collapses neighbours. Count with uniq -c to turn each group into a number and a value. Sort again with a numeric reverse sort, because a text sort would put 9 above 100. Then take the first ten into the file. Two warnings matter for the analysis. The busiest address is not automatically the attacker, because a shared proxy or a content delivery network can dominate the count. The log line also holds the user agent and the path, which you need to separate a real layer 7 flood from a scanner.",
  focus:"Remember that uniq only works on sorted input and that counts must be sorted numerically. Those two details decide whether your answer is right.",
  aLabel:"TYPE THE COMMAND"
},

/* ---------------- H10 ---------------- */
{
  id:"H10", theme:"Identity & Access Architecture", type:"mcq", pts:5,
  tname:"EVENT LOG ANALYSIS",
  scenario:"You are reviewing domain controller events after an endpoint detection alert on a finance workstation. The workstation is logged on by a user who is not a domain administrator. The events cover a three minute window.",
  artefact:{label:"Domain controller security events (filtered)", kind:"log", filter:true, lines:[
    "2024-04-02 02:11:04 DC-01 Security 4768 A Kerberos authentication ticket (TGT) was requested Account: FIN\\m.horvat EncryptionType: 0x12",
    "2024-04-02 02:11:29 DC-01 Security 4769 A Kerberos service ticket was requested Account: FIN\\m.horvat ServiceName: MSSQLSvc/sql-01.fin.northwind.local:1433 EncryptionType: 0x17",
    "2024-04-02 02:11:31 DC-01 Security 4769 A Kerberos service ticket was requested Account: FIN\\m.horvat ServiceName: MSSQLSvc/sql-02.fin.northwind.local:1433 EncryptionType: 0x17",
    "2024-04-02 02:12:02 DC-01 Security 4769 A Kerberos service ticket was requested Account: FIN\\m.horvat ServiceName: http/portal.fin.northwind.local EncryptionType: 0x17",
    "2024-04-02 02:13:41 DC-01 Security 4769 Repeated 1,400 service ticket requests in 180 seconds, 46 distinct service names, EncryptionType: 0x17",
    "2024-04-02 02:14:07 DC-01 Security 4624 Logon Type 3 Account: FIN\\m.horvat Source: WS-FIN-114 Target: 12 file servers"
  ]},
  question:"Which conclusion is best supported by this evidence?",
  options:[
    {t:"A forged ticket granting ticket, because the encryption type of the initial TGT request is weak", ok:false},
    {t:"A time skew between the workstation and the domain controller, causing repeated ticket requests", ok:false},
    {t:"Bulk service ticket requests for many service names with weak ticket encryption, the Kerberoasting pattern", ok:true},
    {t:"An account lockout policy forcing the workstation to request new tickets again and again", ok:false}
  ],
  hint:"Ask what an attacker can do offline with a service ticket, and why the encryption type in those events matters so much.",
  exp:"The pattern is bulk service ticket requests across many service names, in a short time. The weaker RC4 encryption type makes it worse. Any domain user can ask for a service ticket for a service principal name. The ticket is encrypted with the service account password hash. The attacker takes the tickets away and cracks them offline. That is Kerberoasting, and it ends with a service account password. Such accounts often have high privilege and never rotate. The initial ticket granting ticket request uses a stronger encryption type here, which argues against a forged ticket. A time skew produces a specific Kerberos clock error, not a burst of successful requests.",
  focus:"Learn the shape of Kerberoasting: many 4769 events, many service names, weak encryption, one ordinary account. Then remember the fix is a managed service account with a long random password.",
  aLabel:"CHOOSE ONE"
},

/* ---------------- H11 ---------------- */
{
  id:"H11", theme:"Identity & Access Architecture", type:"mcq", pts:5,
  tname:"POLICY CONFLICT ANALYSIS",
  scenario:"The access review covers two policy sets that were written by different teams and never tested together. Set A is role based and grants the role finance-analyst read access to the invoices share. Set B is attribute based and denies read when the device is not compliant or when the request does not come from the Netherlands or Germany. Two analysts are reviewed today. Analyst one is in the finance-analyst role, works from France and uses a compliant laptop. Analyst two is in the same role, works from the Netherlands and uses a laptop whose disk encryption is not enabled.",
  question:"What is the effective access for the two analysts, and why?",
  options:[
    {t:"Both may read, because the role grants read access and role grants take precedence over conditions", ok:false},
    {t:"The Dutch analyst may read because only his device fails, and the French analyst may read because his device passes", ok:false},
    {t:"Both are denied: the country attribute fails for one and the device posture attribute fails for the other, and deny wins", ok:true},
    {t:"Both may read after a break glass approval, because finance staff need the data to close the month", ok:false}
  ],
  hint:"Decide two things in order: does the role allow it, and does any attribute rule explicitly deny it?",
  exp:"Role based access control, or RBAC, answers who you are in the organisation. Attribute based access control, or ABAC, adds conditions about the request itself, such as device posture, location and time. When both apply, an explicit deny beats an allow. That is the only safe way to write policy, because a later condition may only restrict access, never widen it. Here the role grants read, but the country attribute denies one analyst. The device compliance attribute denies the other. Country conditions usually exist for data residency reasons, so they are a legal control, not a preference. A break glass process exists for genuine emergencies, and it does not turn a denied condition into an allowed one.",
  focus:"Say the sentence in your head: allow plus explicit deny equals deny. Then check each attribute against each user.",
  aLabel:"CHOOSE ONE"
},

/* ---------------- H12 ---------------- */
{
  id:"H12", theme:"Identity & Access Architecture", type:"fill", pts:5,
  scenario:"Northwind Freight is turning on single sign on with a new identity provider. A penetration test of the staging tenant found that an assertion captured from one session could be replayed, and that an assertion issued for one application was accepted by another. You must write the hardening list for the service provider before production.",
  question:"Which term completes the service provider hardening list?",
  text:"The service provider must reject any assertion that is not signed, and must validate [[1]] so that a captured response cannot be replayed. The assertion must be checked against [[2]] to prove that it was issued for this application and not for another. The clock must be used to enforce [[3]] on the assertion. Identity provider initiated single sign on with unsigned responses must be [[4]]. Signing certificates are rotated before they expire and the metadata is always fetched over [[5]].",
  answers:[["InResponseTo","the InResponseTo value"],["AudienceRestriction","the AudienceRestriction element"],["NotOnOrAfter","the NotOnOrAfter condition"],["disabled","blocked"],["TLS","HTTPS"]],
  bank:["InResponseTo","AudienceRestriction","NotOnOrAfter","disabled","TLS","OAuth","OIDC","enabled","plain HTTP","Kerberos"],
  hint:"Two slots are XML element names inside the assertion, one is a time condition, one is a switch you turn off, and one is the way metadata must travel.",
  exp:"A SAML assertion is a signed XML document, and every field in it is a security check. The InResponseTo value ties a response to the request that caused it. That defeats replay of a captured assertion. The AudienceRestriction names the service the assertion is meant for. It stops an assertion issued for one application from being used at another. The NotOnOrAfter condition bounds how long the assertion is valid, so a stolen assertion expires. Identity provider initiated single sign on without a signature should be disabled. There is no request to match and no protection against a forged response. Metadata must travel over TLS, and signing certificates must be rotated before expiry. This is the difference between SSO, the goal of one login for many applications, and SAML, one way to carry the assertion.",
  focus:"Learn the three checks a service provider must always make: signature, audience, and time. Miss one and the assertion becomes a skeleton key.",
  aLabel:"PUT A TERM IN EACH SLOT"
},

/* ---------------- H13 ---------------- */
{
  id:"H13", theme:"Identity & Access Architecture", type:"multi", pts:5,
  scenario:"The build pipeline that deploys the customer portal uses one cloud service account. Its access key has been stored in the pipeline as a plain secret for four years, it carries administrator rights, and 60 developers can read the pipeline configuration. Last week a token was printed into a build log and the log was readable by the whole engineering team.",
  question:"A developer found the leaked key in a build log. Which changes close that gap?",
  options:[
    {t:"Replace the static access key with short lived credentials that the pipeline obtains at run time", ok:true},
    {t:"Reduce the role to the permissions the pipeline needs, scoped to the named resources it deploys", ok:true},
    {t:"Mask secrets in build logs and fail the build when a secret pattern appears in the output", ok:true},
    {t:"Restrict who may read and change the pipeline configuration, and alert on every change", ok:true},
    {t:"Rotate any remaining credential and alert when it is used from outside the pipeline's known addresses", ok:true},
    {t:"Increase the key length and keep the four year rotation cycle", ok:false},
    {t:"Store the key as an encrypted file in the repository so developers can find it when needed", ok:false},
    {t:"Add a second static key as a backup so that builds never fail during rotation", ok:false}
  ],
  hint:"Ask of each option: does it remove the secret, shrink what the secret can do, or make misuse visible?",
  exp:"A long lived administrator credential that 60 people can read is a standing invitation. The real fixes remove the standing secret by issuing short lived credentials at run time. They shrink the role to the named resources the pipeline touches. They stop secrets from reaching logs, and they cut how many people can change the pipeline. Rotation and location alerts make misuse visible. The wrong options keep the problem. A longer key is still a static key that never rotates. An encrypted file in the repository just moves the secret closer to the developers. A second static backup key doubles what an attacker can steal and removes the pressure to rotate. The same reasoning applies to serverless (FaaS) code, where the risk lives in the execution role.",
  focus:"Three verbs answer most secret management questions: remove the standing secret, scope it down, and make its use visible.",
  aLabel:"CHOOSE ALL THAT APPLY"
},

/* ---------------- H14 ---------------- */
{
  id:"H14", theme:"System & Endpoint Architecture", type:"branch", pts:5,
  scenario:"02:47. The runtime security sensor raises a critical alert in the shop Kubernetes cluster. A pod in namespace shop started a process that read the directory /var/lib/kubelet and then opened a connection to the kubelet API on the node at port 10250. The pod spec shows one container running with privileged: true and a hostPath mount of /var/lib/kubelet. The node kernel is patched to the current level.",
  question:"Work through the container incident step by step.",
  steps:[
    {s:"The pod reached a node level interface.",
     q:"How do you classify the event?",
     options:[
       {t:"A container escape into the node, because the pod used a host path and privileged mode to reach the kubelet API", ok:true, fb:"Correct. Containers share the host kernel, so privileged mode plus a host path is a route to the node itself."},
       {t:"A virtual machine escape, because the container reached the hypervisor below the node", ok:false, fb:"There is no hypervisor hop here. A virtual machine escape is guest to host on the hypervisor, which is a different boundary and a different evidence set."},
       {t:"Normal behaviour, because pods commonly mount the kubelet directory to read metrics", ok:false, fb:"Metrics are collected through the API server or a metrics component. Mounting the kubelet directory with privileged mode is not normal."}
     ]},
    {s:"The shop must stay online, and the node runs several other customer workloads.",
     q:"What is the correct containment?",
     options:[
       {t:"Cordon the node, capture the pod spec and the node logs, delete the workload, rebuild the node from a clean image, and rotate the credentials that ran on it", ok:true, fb:"Correct. You preserve the evidence, remove the workload, and treat the node as untrusted because the boundary was crossed."},
       {t:"Restart the pod so that it starts again with a clean file system", ok:false, fb:"A restart keeps the compromised node and the same privilege. Nothing is contained."},
       {t:"Delete the namespace and restore the cluster from last month's backup", ok:false, fb:"That loses a month of data and destroys the evidence that explains how the pod was created."}
     ]},
    {s:"The root cause turns out to be a deployment template that allowed privileged pods, with a role binding that let the workload read secrets cluster wide.",
     q:"Which design fix do you propose?",
     options:[
       {t:"Enforce admission policy that blocks privileged pods and host path mounts, remove the cluster wide binding, and alert on host namespace use", ok:true, fb:"Correct. You stop the pattern at admission time and remove the wide permission, then add detection for the next attempt."},
       {t:"Run an antivirus agent inside every container image", ok:false, fb:"Agents inside containers do not see host level abuse and cannot block a node escape."},
       {t:"Replace every container workload with a virtual machine, because containers are not secure", ok:false, fb:"That is a large cost for no reason. The problem is the privileged configuration, not the container model."}
     ]}
  ],
  hint:"Name the boundary that was crossed, then treat anything the crossed boundary touched as untrusted.",
  exp:"Containers share the node kernel. Privileged mode with a host path is a path from the workload to the node. That is a container escape. It is not the same as a virtual machine escape, where a guest breaks out to the hypervisor through the virtualisation layer. The two need different evidence and different fixes. In containment, the node is no longer trustworthy. Cordon it, capture the spec and logs, remove the workload, and rebuild the node from a clean image. Rotate the credentials that ran there. In design, you prevent the pattern instead of detecting it later. Admission policy blocks privileged pods and host path mounts, and you alert on host namespace use. This is containerization done properly, and sandboxing adds a second boundary for untrusted code.",
  focus:"Learn to name the boundary: workload to kernel is a container escape, guest to hypervisor is a VM escape. The name decides your containment.",
  aLabel:"CHOOSE YOUR PATH, STEP BY STEP"
}

);

/* ---------------- H16 ---------------- */
{
  id:"H16", theme:"System & Endpoint Architecture", type:"branch", pts:5,
  tname:"BOOT INTEGRITY REVIEW",
  scenario:"A firmware maintenance window was applied to 40 laptops on Saturday. On Monday the attestation report shows that on 38 devices the TPM measurements in PCR 0 and PCR 7 differ from the golden baseline, and on 12 of those devices BitLocker asked for the recovery key at boot. The maintenance record lists a signed firmware update from the manufacturer for exactly those 40 models, and no other configuration change.",
  artefact:{label:"tpm attestation summary - Monday 07:00", kind:"table", head:["Device group","PCR changed","BitLocker prompt","Firmware event"],
    rows:[
      ["38 of 40 laptops","PCR 0, PCR 7","12 devices","Signed vendor update, Saturday"],
      ["2 of 40 laptops","no change","none","Signed vendor update, Saturday"],
      ["Domain controllers (20)","no change","none","none"]
    ]},
  question:"Work through the boot integrity review step by step.",
  steps:[
    {s:"PCR 0 and PCR 7 changed on 38 of the 40 laptops after the signed firmware update, and 12 devices asked for the BitLocker recovery key.",
     q:"What is your first conclusion?",
     options:[
       {t:"The 38 laptops are compromised, because any PCR change means boot code was changed by an attacker", ok:false, fb:"A measurement change is a fact, not a verdict. First learn what each register measures and what happened in the window."},
       {t:"PCR 0 and PCR 7 cover firmware and boot policy, this change matches the approved update, so treat the update as the likely cause and verify it", ok:true, fb:"Correct. The change fits the approved maintenance, so the first job is to confirm it, not to declare a breach."},
       {t:"The TPM chips are failing, because a mismatch always means the chip lost its measurements", ok:false, fb:"A failing chip would not produce the same new values across 38 machines of one model."}
     ]},
    {s:"You must now prove whether the new measurements are legitimate.",
     q:"Which evidence do you collect?",
     options:[
       {t:"The firmware hash and signature from the vendor record, the full PCR set from each device, and the golden baseline for every register", ok:true, fb:"Correct. A real boot attack usually moves other registers too, so the whole set matters, not only the two that changed."},
       {t:"Reimage all 40 laptops from the golden image and restore the user data afterwards", ok:false, fb:"That destroys the evidence and costs days of work before you know whether anything is wrong."},
       {t:"Nothing, because BitLocker still protects the disk on the 28 devices that did not ask for a key", ok:false, fb:"Disk encryption protects data at rest. It says nothing about whether the boot chain still matches the baseline."}
     ]},
    {s:"The firmware update is confirmed as genuine and signed by the vendor.",
     q:"What is the right follow up?",
     options:[
       {t:"Re-baseline the golden values with a change record, and alert when a register moves without an approved change", ok:true, fb:"Correct. A baseline that is never updated becomes noise, and a baseline with no monitoring has no value."},
       {t:"Disable measured boot, because attestation creates support tickets after every update", ok:false, fb:"You would remove the control that detects real boot tampering, to avoid a process problem."},
       {t:"Turn off TPM attestation and rely on the EDR agent alone", ok:false, fb:"The EDR agent starts after the boot chain. It cannot tell you whether the firmware or boot loader was replaced."}
     ]}
  ],
  hint:"Start from what each register measures, then compare the timing of the measurement change with the timing of the approved maintenance.",
  exp:"PCR 0 measures the firmware and PCR 7 measures the secure boot policy and its keys, so a real firmware update changes exactly those two. The evidence fits that story: the change appears only on the devices that received the signed update, at the right time, with no other register involved. The recovery prompts appear because the sealed disk key is bound to the measured state, which is the design working, not failing. You still verify rather than assume, so you check the firmware hash against the vendor value and confirm that no other register moved. Then you re-baseline with a change record and monitor for the next drift.",
  focus:"Know which register measures what, then compare the change against the change record. Context decides whether it is an attack.",
},

/* ---------------- H17 ---------------- */
{
  id:"H17", theme:"Data Protection & Cryptography", type:"order", pts:5,
  scenario:"Northwind Freight is commissioning a hardware security module for the internal certificate authority that will issue every server certificate in the company. The key ceremony will be attended by an external auditor, and the company must be able to prove that no single person could ever use the root key alone.",
  question:"Put the ceremony steps in the correct order. The first step goes at the top.",
  items:[
    "Approve the ceremony plan and the participant list, and confirm that no single person will hold a complete secret or a complete credential",
    "Verify the hardware state and the firmware hash of the new module against the vendor record, and initialise it in an offline room with recorded video",
    "Split the administrator credential into shares and distribute them so that at least two holders are needed for every operation",
    "Generate the root key inside the module so it never exists in clear outside the device, then make a backup under the same split controls",
    "Issue and publish the root certificate, and record the ceremony in the audit log with the signature of every share holder and witness",
    "Destroy the temporary material, store the shares in separate safes, and schedule the annual review and rotation plan"
  ],
  hint:"Plan first, verify the device, split the control, generate, publish, then clean up and review. Generation must never happen before the split is in place.",
  exp:"A key ceremony exists so that trust in the root key is provable. Start with an approved plan and a participant list. Dual control and split knowledge are decided before anyone touches the device. Then verify the hardware and the firmware hash. A device tampered with in transit cannot be trusted to generate your root key. Then split the administrator credential into shares, so every later action needs two people. Only then generate the key inside the hardware security module (HSM). The key never exists in clear on a laptop or a USB stick. The backup follows the same split rules. Publish the root certificate and record the ceremony with signatures. Finally destroy temporary material, store the shares separately, and schedule the review. The ceremony is separation of duties made physical.",
  focus:"Remember the two phrases that describe this design: dual control means two people, split knowledge means nobody holds the whole secret.",
  aLabel:"PUT THE CEREMONY STEPS IN ORDER"
},

/* ---------------- H18 ---------------- */
{
  id:"H18", theme:"Data Protection & Cryptography", type:"branch", pts:5,
  scenario:"The mobile banking app pins the public key of the leaf certificate used by api.northwind[.]example. Operations reports that this leaf certificate expires in five days, and the renewal team already generated a brand new key pair for the replacement. The app release cycle through the stores is ten days at best, and 400,000 customers have the current version installed.",
  question:"Work through the certificate problem step by step.",
  steps:[
    {s:"The pinned certificate expires before any new app version can reach the stores.",
     q:"What is the first decision?",
     options:[
       {t:"Ask the certificate authority to reissue the certificate with the same key pair, so the pinned public key hash does not change", ok:true, fb:"Correct. Pinning is on the key, so keeping the same key pair keeps every installed app working."},
       {t:"Deploy the new key pair immediately and accept that installed apps stop connecting", ok:false, fb:"That is an instant outage for every customer, chosen to avoid asking the certificate authority one question."},
       {t:"Ask the vendor to remove certificate pinning from the app so this cannot happen again", ok:false, fb:"Removing pinning weakens the app against man in the middle attacks and does not solve the five day deadline."}
     ]},
    {s:"The authority answers that it cannot reissue with the same key pair under its current policy, and the old certificate cannot be extended.",
     q:"What is the best next step?",
     options:[
       {t:"Serve both chains in parallel, release an emergency app build with a pin set for the new key, add a forced upgrade gate for old versions, and watch the client version spread", ok:true, fb:"Correct. You migrate the client population deliberately, with a deadline you control and measurement while you do it."},
       {t:"Switch the gateway to the new chain and wait for customers to open the app and complain", ok:false, fb:"That converts a planned migration into an unmanaged outage with no data on how many users are affected."},
       {t:"Leave the old certificate in place after it expires and suppress the certificate warning", ok:false, fb:"An expired certificate plus a suppressed warning trains users to ignore the exact signal that protects them."}
     ]},
    {s:"The migration is over. Management asks how to avoid the same situation next year.",
     q:"Which design decision do you propose?",
     options:[
       {t:"Ship a pin set with a current key and a backup key, and put certificate expiry into the application release calendar with renewal monitoring", ok:true, fb:"Correct. A backup pin means a future rotation is a normal change, and the calendar keeps the date visible to the app team."},
       {t:"Switch the app to certificate transparency checks instead of pinning", ok:false, fb:"Transparency monitoring detects mis-issued certificates, but it does not replace the protection pinning gives the app."},
       {t:"Move all API traffic to a third party content delivery network so the certificate is theirs", ok:false, fb:"You cannot delegate trust away. The certificate is still yours and the pin still has to change when it rotates."}
     ]}
  ],
  hint:"Pinning is a property of the key, not of the printed expiry date. Ask which change keeps the key the same.",
  exp:"Pinning ties the app to a specific key. The cheapest migration keeps the key and changes only the paperwork. A reissue with the same key pair renews the validity dates, and the pin stays valid. When that is impossible, you move the client population on purpose. Publish both chains, ship a new build whose pin set accepts the new key, and force the upgrade for old versions. Measure how many clients still use the old version, because you cannot migrate a fleet you cannot count. The design fix is a pin set that already contains a backup key. Expiry dates belong in the release calendar. Revocation checking is part of the same design: confirm the new chain is published to the OCSP responder and the CRL.",
  focus:"Ask which artefact the pin actually covers: leaf public key, whole leaf certificate, or the chain. The answer decides how much you can change without breaking clients.",
  aLabel:"CHOOSE YOUR PATH, STEP BY STEP"
},

/* ---------------- H19 ---------------- */
{
  id:"H19", theme:"Resilience & Availability", type:"rank", pts:5,
  tname:"RECOVERY SEQUENCING",
  scenario:"06:00 Monday. Ransomware encrypted the file servers, the trading database and the archive server. The immutable backup of the database ran at 23:00 on Sunday and the transaction log is intact. The offline copy of the file share in the second site is four hours old. The domain controllers were on the same hypervisor cluster and their system state backups are from Sunday. 40 workstation images are encrypted. The archive server nobody is waiting for holds engineering drawings on monthly tapes.",
  question:"Rank the recovery actions in the order they must be performed to bring the business back safely. The first action goes at the top.",
  items:[
    "Rebuild the domain controllers from clean media and rotate the krbtgt account twice before any other system joins the domain",
    "Restore the trading database from the immutable backup and replay the transaction log, giving a five minute recovery point",
    "Restore the file share from the offline copy in the second site, with a four hour recovery point",
    "Rebuild the 40 workstations from the golden image instead of cleaning the encrypted machines",
    "Restore the archive server from the monthly tape, because no business process is waiting for those drawings"
  ],
  hint:"Ask what every other system has to trust before it can be used, then order the rest by the business process that is blocked.",
  exp:"Identity comes first, because every other recovery trusts the domain. Until the domain controllers are rebuilt from clean media, an attacker who stole the directory database can authenticate anywhere. Rotate the krbtgt account twice. Then follow the business dependency chain. The trading database carries the revenue. The immutable backup plus an intact transaction log gives a five minute recovery point, which is why immutability is worth paying for. The file share follows with a four hour recovery point. Workstation rebuilds come after the servers. The archive server is last, because no business process is blocked. The 3-2-1 backup rule meant a copy existed that the attacker could not reach, and the second site acted as a warm site rather than a cold site. RAID, the UPS and the generator gave redundancy (high availability, HA), but they restored nothing. The business set the recovery time objective (RTO) for the outage and the recovery point objective (RPO) for the data. The review also records the MTTR of each service, so the next plan is based on evidence.",
  focus:"In recovery, always ask two questions: what do the others trust, and which business process is blocked right now?",
  aLabel:"RANK THE RECOVERY ACTIONS IN ORDER"
},

/* ---------------- H20 ---------------- */
{
  id:"H20", theme:"System & Endpoint Architecture", type:"branch", pts:5,
  scenario:"A safety advisory and a security patch for the warehouse PLC firmware arrive on the same morning. The flash procedure has bricked controllers twice in the industry, and the vendor is on site only once a month. The line runs six days a week with a four hour window on Sunday. The control zone has no route to the office network, and the cabinet needs a physical key. The engineering workstation that programs the PLC is on the same zone and is used daily.",
  question:"Work through the operational technology decision step by step.",
  steps:[
    {s:"The patch is available but the flash carries a real bricking risk.",
     q:"What is the correct decision for this week?",
     options:[
       {t:"Do not flash in a production window: schedule it in the next planned shutdown with the vendor present and a spare controller on site, and keep the existing compensating controls until then", ok:true, fb:"Correct. In OT you patch on a planned stop with the vendor and a spare, not on a hope."},
       {t:"Flash on Sunday at 03:00 because the window is four hours and the line is stopped", ok:false, fb:"If the controller bricks, the line stops on Monday with no vendor on site and no spare. That is how a security action becomes an availability incident."},
       {t:"Ignore the advisory, because the zone is isolated and the cabinet is locked", ok:false, fb:"Isolation and a lock reduce likelihood, they do not remove the flaw. You still need a plan with a date."}
     ]},
    {s:"The advisory adds that the flaw is triggered from the engineering workstation that programs the controllers.",
     q:"What do you do now?",
     options:[
       {t:"Treat the engineering workstation as the attack path: harden and monitor it, remove its internet access, control removable media, and require a change record for every program download to a controller", ok:true, fb:"Correct. The workstation is the bridge from the IT world to the control world, so it gets the tightest control."},
       {t:"Take no further action, because the zone has no route to the office network", ok:false, fb:"The workstation is used daily and portable media and vendor laptops are normal in a plant. The route exists, it is just not a network route."},
       {t:"Block the programming protocol on the zone firewall to stop any download", ok:false, fb:"That stops production engineering work as well. You control the path, you do not remove the function."}
     ]},
    {s:"The flash succeeds during the planned shutdown. Management asks what to change in the process.",
     q:"Which design decision do you propose?",
     options:[
       {t:"Run a joint safety and security patch calendar with vendor presence, a spare controller, a written test procedure and a rollback step for every flash", ok:true, fb:"Correct. That is how OT patching becomes a repeatable change instead of a gamble."},
       {t:"Patch every controller as soon as a vendor release appears, to reduce exposure time", ok:false, fb:"Speed without a window, a spare and a rollback is how you get the third bricking incident."},
       {t:"Write a permanent risk acceptance for all PLC firmware and stop tracking advisories", ok:false, fb:"A permanent acceptance with no review date means the plant never patches again. Acceptances need dates."}
     ]}
  ],
  hint:"In operational technology the order of priorities is safety, availability, then security. Every answer must respect that order.",
  exp:"Operational technology cannot be treated like an office server. A controller that bricks stops production and can create a safety issue. So a firmware flash happens in a planned stop, with the vendor present and a spare controller on the shelf. Until then the compensating controls carry the risk. That is how a risk acceptance should work: specific, dated and reviewed. The advisory also tells you where the attack really comes from, and it is almost never the internet. The engineering workstation, a vendor laptop and a USB stick are the paths into a control zone. The workstation gets hardening, monitoring, no internet access, controlled media and a change record for every download. The process fix is a calendar that combines safety and security patching. The whole decision sits inside an ICS and SCADA zone model such as the Purdue model.",
  focus:"Remember the OT priority order and the phrase planned stop. Any answer that patches a running controller without a spare is wrong.",
  aLabel:"CHOOSE YOUR PATH, STEP BY STEP"
},

/* ---------------- H21 ---------------- */
{
  id:"H21", theme:"Perimeter, Proxy & Cloud Edge", type:"drop", pts:5,
  tname:"SD-WAN DESIGN REVIEW",
  scenario:"Northwind Freight is replacing a private wide area network with SD-WAN at 60 branches. Branches will use direct internet breakout for cloud applications instead of sending all traffic to headquarters. The design team must decide what stays where, and the risk register must be updated for anything that assumed the old path.",
  question:"Drag every item into the right bucket. Every item must be placed.",
  buckets:[
    {name:"Enforce at the branch edge", items:[
      "A local firewall and intrusion prevention policy for branch internet traffic",
      "The cloud delivered security service that inspects SaaS traffic at the breakout",
      "Local break out for Microsoft 365 with branch egress addresses"
    ]},
    {name:"Keep centralised", items:[
      "Identity and conditional access decisions for cloud applications",
      "Forwarding all branch and edge logs into the central SIEM for correlation"
    ]},
    {name:"Must be redesigned: it assumed HQ backhaul", items:[
      "The data centre firewall rule set that assumed every branch flow passes headquarters",
      "The DNS sinkhole that only existed on the headquarters resolvers",
      "TLS inspection performed at headquarters for all branch internet traffic",
      "The risk register entry that states all branch traffic is inspected at headquarters"
    ]}
  ],
  hint:"Separate the control from the place it was implemented. A control that needs to see the traffic must move; a control that only needs a signal can stay.",
  exp:"Direct internet breakout is a path change. Every control that depended on traffic passing headquarters must move or be rebuilt. Local inspection moves to the branch edge, usually as a cloud security service at the breakout. That is the SASE pattern. Name resolution must be controlled locally too, because a DNS sinkhole on headquarters resolvers is blind once branches resolve names themselves. The same applies to TLS inspection and to firewall rules written for one central path. Controls that work from a signal rather than from the path can stay central. Identity and conditional access decisions follow the user, so they stay. Log forwarding stays centralised so correlation happens in one place. Software defined networking (SDN) makes this possible: the SD-WAN controller programs policy at the branch, the way a central SDN controller programs a data centre. A cloud access security broker (CASB) is how shadow IT at a branch becomes visible. One physical risk grows at the same time: a rogue AP at a branch now has a direct path to the internet that no longer passes headquarters inspection.",
  focus:"Ask of each control: does it need to see the packet, or only the event? Packets move to the edge, events stay in the centre.",
  aLabel:"DRAG EACH ITEM INTO ITS BUCKET"
}

);

EXERCISES.push(

/* ---------------- H22 ---------------- */
{
  id:"H22", theme:"Visibility, Monitoring & Frameworks", type:"drop", pts:5,
  tname:"THREAT HUNT - FLOW ANALYSIS",
  scenario:"You are hunting in the egress flow data for the finance subnet after an unrelated alert. Flow records carry no payload, only metadata: source, destination, port, bytes, duration and packet count. The workstation 10[.]20[.]31[.]44 is a finance analyst laptop.",
  artefact:{label:"NetFlow records - finance subnet (extract)", kind:"log", filter:true, lines:[
    "2024-04-03 01:00:12 10[.]20[.]31[.]44 -> 45[.]148[.]12[.]9:443 bytes=12.4K pkts=14 dur=0.9s",
    "2024-04-03 01:05:41 10[.]20[.]31[.]44 -> 91[.]203[.]44[.]7:8443 bytes=11.8K pkts=13 dur=0.8s",

    "2024-04-03 02:10:03 10[.]20[.]31[.]44 -> 10[.]20[.]4[.]6:1521 bytes=3.2M pkts=2400 dur=41s",
    "2024-04-03 02:15:44 10[.]20[.]31[.]44 -> 52[.]96[.]0[.]0:443 bytes=88M pkts=61000 dur=1800s",
    "2024-04-03 02:40:11 10[.]20[.]31[.]90 -> 10[.]20[.]31[.]44:445 bytes=940K pkts=830 dur=12s"

  question:"Decide what the flow records really support, then place every statement.",
  buckets:[
    {name:"Supported by the flow evidence", items:[
      "The regular five minute flows with a nearly constant payload size to two addresses look like command and control beaconing",

    ]},

  exp:"Two addresses receive a similar volume every five minutes with a small variation. That is the signature of C2 beaconing, from an implant that sleeps with jitter between check ins. The ports 443 and 8443 make it look like web traffic, which is why destination reputation matters more than the port number. The internal SMB connection from one workstation to another is worth hunting, because a workstation that suddenly serves file shares is often a staging point. The large Microsoft 365 flow and the database flow are ordinary. Flow records carry no content, so they can show that something moved, never which files.",

/* ---------------- H23 ---------------- */
{
  id:"H23", theme:"Visibility, Monitoring & Frameworks", type:"branch", pts:5,
  scenario:"Monday morning. The impossible travel rule fires 30 times, and one real case cannot be reconstructed at all: the VPN concentrator shows a finance user logging in from Amsterdam at 09:12, while the branch firewall in Rotterdam shows the same user authenticating at 09:04. The SOC lead says the rule is broken and wants it disabled.",
  question:"Work through the timeline problem step by step.",
  steps:[
    {s:"Two devices disagree about the order of events.",
     q:"What is your first check?",
     options:[
       {t:"Compare the clock offset on the VPN concentrator, the branch firewall and the collector, and confirm which time sources each one uses", ok:true, fb:"Correct. Before you question the rule, question the timestamps it consumes."},
       {t:"Disable the impossible travel rule, because it clearly produces false positives", ok:false, fb:"You would silence a working detection and leave the root cause in place for every other rule."},
       {t:"Rewrite the correlation rule with a wider time window so the events fall in order", ok:false, fb:"Widening the window hides the problem and weakens the detection for genuine cases."}
     ]},
    {s:"You find that the VPN concentrator syncs to a public time pool and is 372 seconds ahead, while the branch and the collector use the corporate source.",
     q:"What is the correct next step?",
     options:[
       {t:"Fix the time source on the device, correct the affected events with a documented offset, re-run the affected hunts over that window, and add drift alerting", ok:true, fb:"Correct. You repair the clock, record how you adjusted past events, and re-check everything that depended on those timestamps."},
       {t:"Delete the affected events so the database stays consistent", ok:false, fb:"Deleting evidence hides a real finding and destroys the audit trail."},
       {t:"Accept the offset, because the sequence of events is still roughly correct", ok:false, fb:"Roughly correct is not a timeline. A 372 second offset changes the order of events in an incident."}
     ]},
    {s:"The case is closed and the auditor asks how you will prove the timeline of a future incident.",
     q:"Which design decision do you document?",
     options:[
       {t:"Use authenticated internal time sources everywhere, block external time protocols on egress, alert on drift beyond a threshold, and record the offset with the evidence", ok:true, fb:"Correct. Time becomes a controlled service with monitoring, and the evidence carries the reasoning."},
       {t:"Let the SIEM rescale timestamps automatically, without keeping a record of the change", ok:false, fb:"An unrecorded adjustment to evidence cannot be defended in a legal or audit process."},
       {t:"Give each site its own local time zone so that local logs look natural to local staff", ok:false, fb:"Local time zones make cross site correlation worse and are a common source of wrong conclusions."}
     ]}
  ],
  hint:"When two sources disagree, fix the measurement before you change the rule. Then make time a monitored service.",
  exp:"Correlation is built on timestamps, so a clock problem looks like a detection problem. First compare offsets and time sources across the devices that produced the events. Then repair the drifting device. Past events are handled with a documented correction, not by deletion. Other hunts used the same data, and the audit trail must survive. The design answer is to make time a controlled service. Use authenticated internal sources. Block external time protocols at the egress, so a device cannot drift to a public pool. Alert on drift before the offset is large. Record the offset with the evidence, so an auditor or a court can follow the reasoning. The underlying service is NTP. Every device that writes a syslog line into the SIEM must use it, because syslog forwarding, storage and correlation inherit whatever the clock said.",
  focus:"Remember the order: fix the clock, document the correction, re-run the hunt. Never fix a timeline by widening the window.",
  aLabel:"CHOOSE YOUR PATH, STEP BY STEP"
},

{
  id:"H24", theme:"Visibility, Monitoring & Frameworks", type:"match", pts:5,
  scenario:"A 40 Gbps internet link must be monitored. The design team has four technical options and one bypass concept on the table, and the operations manager has one hard requirement: the link must not go down because of the monitoring device.",
  question:"Match each option with the property that decides the design.",

    ["Switch SPAN port","Copies traffic in software and can silently drop packets when the port is oversubscribed"],
    ["NetFlow export","Gives conversation metadata with no payload, and scales to very high rates"],
    ["Fail open bypass","Keeps the link up when the inspection device fails, and blinds the control at that same moment"]
  ],
  hint:"Separate the options into three groups: those that can block, those that copy in hardware, and those that only describe traffic.",
  exp:"Choose by requirement, not by preference. If you must block, the device sits inline and becomes part of the availability path. A bypass and a spare unit then matter. If you must not risk the link, a network TAP copies in hardware and cannot drop the link. A SPAN port copies in software and can lose packets under load without telling you. That turns a monitoring gap into false confidence. If you only need to know who talked to whom at very high rate, flow export is enough, and it carries no payload at all. The bypass concept is the one to watch. A fail open bypass protects availability and removes visibility at the same moment, so it must be monitored and counted. That is the fail-safe versus fail-secure question, and the same logic drives the inline vs passive monitoring decision.",
  focus:"Learn the phrase silent packet loss for SPAN ports, and remember that a bypass protects availability by giving up visibility.",
  aLabel:"MATCH EACH OPTION TO ITS DECIDING PROPERTY"
},

/* ---------------- H25 ---------------- */
{
  id:"H25", theme:"Perimeter, Proxy & Cloud Edge", type:"multi", pts:5,
  tname:"APPLICATION LAYER ATTACK REVIEW",
  scenario:"The partner API is slow and the origin is at 95% CPU with 400 ms of added latency. The gateway team pulled the traffic profile for the last hour. There is no network saturation on the internet link; the attack, if there is one, is at layer 7.",
  artefact:{label:"API gateway profile - last 60 minutes", kind:"table", head:["Source group","Requests / min","Distinct keys","Result","Notes"],
    rows:[
      ["ASN A","18,000","40,000","92% 404 on /login","keys never repeat"],
      ["ASN B","4,200","12","99% 200 OK","sequential IDs in the path, no user agent"],
      ["ASN C","900","3","100% 200 OK","official partner agent, contract on file"],
      ["All","23,100","40,015","latency +400 ms","origin CPU 95%"]
    ]},
  question:"Mark every conclusion the profile supports, and the response it points to.",
  options:[
    {t:"The 404 storm from tens of thousands of never repeating keys on the login path is consistent with credential stuffing or account enumeration", ok:true},
    {t:"The sequential identifier pattern from twelve keys is consistent with scraping or business logic abuse, which needs object level authorisation and rate limits", ok:true},
    {t:"The response belongs at two layers: bot management and rate limiting at the edge, plus per object authorisation and load shedding at the origin", ok:true},
    {t:"Capacity is part of the problem, so scale or shed load before the origin reaches saturation", ok:true},
    {t:"The partner traffic is the attack, because it is the group with the highest success rate", ok:false},
    {t:"A larger internet link is the complete fix, because the origin is overloaded", ok:false},
    {t:"The scraper traffic is legitimate because almost every request returns 200 OK", ok:false}
  ],
  hint:"A success code tells you about the request, not about the intent, and the biggest source is not automatically the guilty one.",
  exp:"Layer 7 attacks look like ordinary application use. Read them like a product manager, then like an attacker. Tens of thousands of distinct keys hitting the login path and failing is credential stuffing or account enumeration. The number of distinct keys separates it from a password spray from one source. Sequential identifiers returned with a success code from a few keys is scraping or business logic abuse. The data is taken legitimately by the rules of the API, one object at a time. So the fix is object level authorisation and rate limiting, not a bigger pipe. The partner traffic with a contract on file is the control group in this data. Treating it as the attacker, because it has the best success rate, is the wrong conclusion. The response is layered. Bot management and rate limiting sit at the edge, in front of the load balancer. A WAF rule covers the login path. Load shedding protects the origin. That is what DDoS mitigation at layer 7 means.",
  focus:"Separate volume from intent. Success codes describe responses, and only the request pattern describes the attacker.",
  aLabel:"CHOOSE ALL THAT APPLY"
},

/* ---------------- H26 ---------------- */
{
  id:"H26", theme:"Visibility, Monitoring & Frameworks", type:"fill", pts:5,
  scenario:"A vendor appliance firmware update arrives with a valid signature, and the file hash matches the value published by the vendor. The version string is older than the version currently installed, and the software bill of materials lists an older TLS library than the previous release. The vendor explains that a build pipeline error caused an old build to be signed and published.",
  question:"Which term completes the vendor response note?",
  text:"A valid signature proves [[1]] of the file, not that the build is the one the vendor intended. A version that moves [[2]] is a warning sign that a rollback or an old artefact is being delivered. The component list that lets you answer which library is inside is the [[3]]. Until the vendor confirms the correct build, keep the appliance on the current version and compare that component list against [[4]] for the affected library. The long term control is a contract clause that requires [[5]] about vulnerable components.",
  answers:[["authenticity","integrity and authenticity"],["backwards","backward"],["SBOM","software bill of materials"],["vulnerability feeds","CVE feeds","advisories"],["notification","disclosure"]],
  bank:["authenticity","backwards","SBOM","vulnerability feeds","notification","availability","tokenization","rotation","federation","at rest"],
  hint:"One slot is what a signature really promises, one is the direction of a version change, one is the component list, one is where you look up the library, one is what the contract must require.",
  exp:"A signature answers one question: did this exact file come from the key holder, unchanged. It says nothing about whether the build is new or intended. A signed old build is exactly the supply chain risk that a hash check cannot catch. A version number that moves backwards is a strong warning. Either an old artefact was published by mistake, or someone is attempting a rollback to a version with a known flaw. The software bill of materials (SBOM) lets you answer do we have that library, and where, in minutes. Compare it against the vulnerability feeds, and rank what you find with CVSS and EPSS. The durable control is contractual: notification about vulnerable components and an agreed patch timeline.",
  focus:"Remember the difference between integrity and intent. A valid signature proves integrity, and the version and component list are what tell you about intent.",
  aLabel:"PUT A TERM IN EACH SLOT"
},

/* ---------------- H27 ---------------- */
{
  id:"H27", theme:"Data Protection & Cryptography", type:"match", pts:5,
  scenario:"The insider risk programme is being built from the findings of three past cases. Each case had a different behaviour, and in each case the team that should have seen it was looking at the wrong control. Your job is to connect each behaviour with the control that can actually detect it.",
  question:"Match each insider behaviour with the control that is most likely to detect it.",
  pairs:[
    ["Bulk download of files shortly before a resignation, through an approved channel","Behaviour analytics that compares access volume with that person's own baseline"],
    ["Copies written into an encrypted archive that content inspection cannot read","Endpoint data movement telemetry and archive creation events instead of content rules"],
    ["Slow, small transfers of source code to a personal cloud account","Egress volume and destination reputation analytics on the proxy"],
    ["Access to records that the person does not need for the role","Entitlement review and least privilege, backed by access request logs"],
    ["Printing documents and carrying them out of the building","Physical security, badge and print auditing, plus a clean desk policy"],
    ["A service account used at unusual hours by a human","Privileged access monitoring that alerts on interactive use of service accounts"]
  ],
  hint:"For each behaviour, ask which control can physically see it. If a control needs to read content it cannot see, it is the wrong answer.",
  exp:"Every insider case is found by the control that can observe the behaviour. Bulk access before a resignation is invisible to a static rule and obvious to behaviour analytics. Analytics compares a person with their own history, not with a global threshold. An encrypted archive defeats content inspection, so the signal must come from endpoint telemetry about data movement. Slow small transfers to a personal cloud account need egress and destination analytics, because each file is too small for a size rule. Access to records that are not needed is an entitlement problem. The cheapest fix is least privilege plus a regular entitlement review. Paper needs physical controls, and a service account used interactively at unusual hours means a human is wearing a machine identity.",
  focus:"Match the behaviour to the sensor that can see it. Content inspection, entitlement review and physical security each cover a different part of the problem, and that is the whole point of an insider threat programme: there is no single control that catches every case.",
  aLabel:"MATCH EACH BEHAVIOUR TO ITS DETECTING CONTROL"
},

/* ---------------- H28 ---------------- */
{
  id:"H28", theme:"Identity & Access Architecture", type:"branch", pts:5,
  scenario:"200 external contractors work for Northwind Freight. They connect with a full tunnel VPN that places them on the same address pool as the servers, and the contracting company shares one account between its staff. The audit finding says the company cannot tell which contractor accessed which application, and cannot revoke one person without cutting off the whole company.",
  question:"Work through the contractor access redesign step by step.",
  steps:[
    {s:"The audit finding is about accountability and the ability to revoke.",
     q:"What is the first design change?",
     options:[
       {t:"Create a named identity for every contractor with MFA, and publish each application through a brokered service instead of giving network level access", ok:true, fb:"Correct. Named identities give accountability, and per application access removes the network level trust that contractors never needed."},
       {t:"Keep the shared account but rotate its password every month and log the VPN sessions", ok:false, fb:"A shared account cannot be attributed to a person, so the audit finding is untouched."},
       {t:"Give each contractor a personal VPN account but keep the same address pool on the server VLAN", ok:false, fb:"You fix attribution but leave the far bigger problem: contractors sit next to the servers."}
     ]},
    {s:"One contractor laptop is unmanaged and cannot be inspected under the contract, but the finance application must still be reachable for month end.",
     q:"What is the best design decision?",
     options:[
       {t:"Require a managed virtual desktop for the finance application, and restrict the other two applications to lower sensitivity with session recording", ok:true, fb:"Correct. You match the control to the sensitivity: the highest risk application gets an environment you control."},
       {t:"Allow all three applications, because the contract forbids checking the contractor device", ok:false, fb:"The contract constraint applies to that device, not to which applications you publish. You choose the safer delivery method."},
       {t:"Ask the contractor to confirm in writing that the laptop is patched, and record the declaration", ok:false, fb:"A self declaration is not device posture. It is a document, not a control."}
     ]},
    {s:"The design works for the next two years. Management asks what keeps it healthy.",
     q:"Which design decision do you propose?",
     options:[
       {t:"Publish every contractor application through the access broker with short sessions, log each session against the named identity, and review entitlements every quarter with the business owner", ok:true, fb:"Correct. Access that is reviewed and logged stays small; access that is never reviewed grows."},
       {t:"Move all contractors to one shared jump host with a single account and screen recording", ok:false, fb:"That recreates the original finding: one account, no attribution."},
       {t:"Keep the full tunnel VPN but add a quarterly review, because the audit finding was about logging", ok:false, fb:"The finding is about identity and least privilege. Adding reviews to the wrong architecture does not fix it."}
     ]}
  ],
  hint:"Every fix must answer two audit questions: who did it, and can I remove exactly that person without breaking anyone else?",
  exp:"Contractor access fails audits for two reasons: shared accounts and network level trust. The fix is a named identity for each person, authenticated with MFA. Per application access is published through a broker, which is ZTNA in practice: the user reaches one application without joining the network. The old design was a full tunnel IPsec VPN that placed contractors on the server pool. It shows why AAA matters, because authentication, authorisation and accounting must be done per person. Where the device cannot be trusted, change the delivery. A managed virtual desktop carries the most sensitive application, with lower privilege and stricter recording elsewhere. Add conditional access conditions and just in time (JIT) elevation for rare administrative needs. If a device must be on site, 802.1X with a quarantine VLAN keeps unknown devices off the production network.",
  focus:"Learn the two audit questions and answer them in that order. Named identity first, then the smallest access that still does the job.",
  aLabel:"CHOOSE YOUR PATH, STEP BY STEP"
}

);
