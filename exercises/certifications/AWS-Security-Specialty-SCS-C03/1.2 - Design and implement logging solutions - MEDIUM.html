 else if(e.type==='order'||e.type==='rank'){v.arr=ans?v.arr.slice():v.arr;if(ans){v.arr=ans.slice();v.touched=true;}}

bins:["CloudTrail","VPC Flow Logs","S3 server access logs","ELB access logs","Route 53 Resolver query logs","AWS WAF logs"],
items:[
["{ \"eventSource\":\"sts.amazonaws.com\", \"eventName\":\"AssumeRole\", \"userIdentity\":{ \"arn\":\"arn:aws:iam::123456789012:user/ci-bot\" } }",0],
["2 123456789012 eni-0ff11bb3 10[.]0[.]3[.]88 203[.]0[.]113[.]9 445 51337 6 8 4200 1760000450 1760000510 REJECT OK",1],
["b1f2c3d4 prod-data-bucket [17/Oct/2026:02:14:11 +0000] 198[.]51[.]100[.]7 arn:aws:sts::123456789012:assumed-role/etl ROLE GET /reports/q3.pdf 200 - - 12 245 - -",2],
["https 2026-10-17T02:14:12.101Z app/prod-api/88c1 198[.]51[.]100[.]7:49312 10[.]0[.]4[.]15:8443 0.001 0.042 200 200 200 21 \"GET /orders\" \"curl/8.1\" - -",3],
["{ \"query_timestamp\":\"2026-10-17T02:14:13Z\", \"query_name\":\"backup[.]evil-cdn[.]example.\", \"query_type\":\"TXT\", \"srcaddr\":\"10[.]0[.]6[.]12\", \"transport\":\"UDP\" }",4],

ex:"CloudTrail JSON records always carry <b>eventName</b> and <b>eventSource</b>. Flow log lines are 14 space-separated fields starting with a version number and an ENI, and end with ACCEPT/REJECT. S3 server access lines contain the bucket name, a bracketed timestamp and an object path with an HTTP verb. ALB lines start with the listener type (https/http) and carry elb and target status codes. Resolver query logs carry <b>query_name</b> and <b>query_type</b>. WAF logs carry <b>webaclId</b> and a terminating rule.",

{id:'M07',th:5,type:'spot',
sc:"This is the bucket policy of the central log bucket <code>acme-security-logs</code> (CloudTrail and flow log archive) for account 123456789012.",
code:"L1: { \"Effect\": \"Allow\", \"Principal\": \"*\",\n     \"Action\": \"s3:GetObject\",\n     \"Resource\": \"arn:aws:s3:::acme-security-logs/*\" }\nL2: { \"Effect\": \"Deny\", \"Principal\": \"*\",\n     \"Action\": \"s3:*\",\n     \"Resource\": [\"arn:aws:s3:::acme-security-logs\", \"arn:aws:s3:::acme-security-logs/*\"],\n     \"Condition\": { \"Bool\": { \"aws:SecureTransport\": \"false\" } } }\nL3: { \"Effect\": \"Allow\", \"Principal\": { \"Service\": \"cloudtrail.amazonaws.com\" },\n     \"Action\": \"s3:PutObject\",\n     \"Resource\": \"arn:aws:s3:::acme-security-logs/AWSLogs/123456789012/*\",\n     \"Condition\": { \"StringEquals\": { \"aws:SourceAccount\": \"123456789012\" } } }\nL4: { \"Effect\": \"Allow\", \"Principal\": \"*\",\n     \"Action\": \"s3:PutObject\",\n     \"Resource\": \"arn:aws:s3:::acme-security-logs/*\" }\nL5: { \"Effect\": \"Allow\", \"Principal\": \"*\",\n     \"Action\": \"s3:ListBucket\",\n     \"Resource\": \"arn:aws:s3:::acme-security-logs\" }\nL6: { \"Effect\": \"Deny\", \"Principal\": \"*\",\n     \"Action\": \"s3:DeleteObject\",\n     \"Resource\": \"arn:aws:s3:::acme-security-logs/*\",\n     \"Condition\": { \"Bool\": { \"aws:MultiFactorAuthPresent\": \"false\" } } }\nL7: { \"Effect\": \"Allow\", \"Principal\": { \"Service\": \"delivery.logs.amazonaws.com\" },\n     \"Action\": \"s3:PutObject\",\n     \"Resource\": \"arn:aws:s3:::acme-security-logs/AWSLogs/123456789012/*\",\n     \"Condition\": { \"StringEquals\": { \"aws:SourceAccount\": \"123456789012\" } } }\nL8: { \"Effect\": \"Allow\", \"Principal\": { \"AWS\": \"arn:aws:iam::999900001111:root\" },\n     \"Action\": \"s3:PutObject\",\n     \"Resource\": \"arn:aws:s3:::acme-security-logs/*\" }",
q:"Select EVERY line that is a security mistake in this log-bucket policy.",
c:["L1 — anonymous principals get s3:GetObject on all logs","L2 — the SecureTransport deny","L3 — the CloudTrail delivery statement with aws:SourceAccount","L4 — anonymous principals get s3:PutObject on all logs","L5 — anonymous principals can list the bucket contents","L6 — the MFA-protected delete deny","L7 — the flow-log delivery statement with aws:SourceAccount","L8 — an outside account gets unscoped s3:PutObject on the whole bucket"],
a:[0,3,4,7],
hint:"Three mistakes give away or open writes on the log data. Delivery statements that pin the service AND the account are correct.",
ex:"<b>L1</b> makes every log object publicly readable — a direct leak. <b>L4</b> lets anyone write objects, so log delivery cannot be trusted. <b>L5</b> exposes the object listing (bucket names, log prefixes). <b>L8</b> hands a write to a foreign account with no scoping. Correct lines: <b>L2</b> forces TLS, <b>L3</b> and <b>L7</b> pin the delivering service to one account (anti confused-deputy), <b>L6</b> protects deletes with MFA.",
ca:"Mistakes: L1, L4, L5, L8 (L2, L3, L6, L7 are good controls)"},
{id:'M08',th:5,type:'order',
sc:"GuardDuty just raised a Severity-8 finding on a production account. Your incident runbook defines the evidence-collection procedure for the logging team.",
q:"Put the six steps into the correct first-response order (1 = first).",
items:["Confirm the scope: affected accounts and the time window from the finding","Export the relevant CloudTrail events and note the digest files for the window","Capture the VPC Flow Logs queries for the window and save the query outputs","Copy the artefacts into the S3 evidence bucket that has Object Lock enabled","Record what was collected, by whom and when in the chain-of-custody ticket","Escalate to the incident lead with references to the preserved evidence"],
hint:"You cannot collect before you know the scope, and you escalate last — after the evidence is locked.",
ex:"Scope comes first, otherwise you collect the wrong window. Then you capture the volatile and queryable outputs (CloudTrail exports, digest files, flow log queries). The artefacts are preserved in an immutable bucket before anything else can change them. Documentation of who collected what makes the evidence usable, and escalation comes once the case package exists.",
ca:"Scope → CloudTrail export + digests → flow log queries → immutable copy → custody record → escalate"},

q:"Complete the description with the words from the bank.",
text:"Security Lake centralizes security data from AWS and on-premises sources into your {0} buckets. It normalizes everything to the {1} standard and stores it as compressed {2} files, which keeps query costs low. Each Region has its own bucket, for example s3://aws-security-data-lake-region-account. To let your SIEM consume new data, create a {3} that is notified through SQS. To ingest your own application logs, register a {4} log source.",

);

{id:'M14',th:1,type:'branch',

q:"Pick the right design decision at each step.",
steps:[
{p:"Where should the organization trail deliver logs?",o:["Each member account keeps its own bucket","A dedicated log-archive account owned by the security team","The management account root volume"],a:1,good:"A separate archive account gives one place to protect with a small blast radius.",w:"Scattered buckets are hard to lock down and monitor; log storage is not a compute concern."},
{p:"How do you make the archive tamper-proof for 7 years?",o:["S3 Object Lock in COMPLIANCE mode with versioning enabled","A strict IAM password policy","Turn off versioning to keep it simple"],a:0,good:"COMPLIANCE mode cannot be shortened by anyone while the retention runs; it needs versioning.",w:"Passwords do not protect stored objects, and versioning is a prerequisite for Object Lock."},

{p:"Which guardrail stops member accounts from tampering with logging?",o:["An SCP that denies cloudtrail:StopLogging, cloudtrail:DeleteTrail and changes to the log bucket","A new VPC for the log bucket","Disabling member account root access"],a:0,good:"Service control policies preventively block trail tampering across the organization.",w:"Networks do not protect the trail API, and root access is already constrained by the org design."}],

{id:'M15',th:4,type:'terminal',
sc:"A flow log file from the app subnet landed in your case folder. The attacker IP 203[.]0[.]113[.]50 appears several times.",
intro:"GOAL: count how many REJECT records in vpc-flow.log involve the address 203[.]0[.]113[.]50.\nThis lab accepts a grep command. Combine the IP and the REJECT marker; add a count flag (or pipe to wc -l) to produce a single number.",
files:{"vpc-flow.log":[
"2 123456789012 eni-0aa22bb3 10[.]0[.]3[.]14 10[.]0[.]3[.]99 22 49711 6 9 1330 1760000300 1760000360 ACCEPT OK",
"2 123456789012 eni-0aa22bb3 203[.]0[.]113[.]50 10[.]0[.]3[.]14 51022 22 6 1 40 1760000310 1760000370 REJECT OK",
"2 123456789012 eni-0aa22bb3 198[.]51[.]100[.]8 10[.]0[.]3[.]14 443 49310 6 20 9000 1760000312 1760000372 ACCEPT OK",
"2 123456789012 eni-0aa22bb3 203[.]0[.]113[.]50 10[.]0[.]3[.]14 51044 22 6 1 40 1760000315 1760000375 REJECT OK",
"2 123456789012 eni-0aa22bb3 10[.]0[.]3[.]14 10[.]0[.]3[.]99 49711 22 6 7 900 1760000320 1760000380 ACCEPT OK",
"2 123456789012 eni-0aa22bb3 203[.]0[.]113[.]50 10[.]0[.]3[.]14 51067 22 6 1 40 1760000321 1760000381 REJECT OK",
"2 123456789012 eni-0aa22bb3 203[.]0[.]113[.]50 10[.]0[.]3[.]14 51090 22 6 4 210 1760000330 1760000390 ACCEPT OK",
"2 123456789012 eni-0aa22bb3 10[.]0[.]3[.]77 10[.]0[.]3[.]99 8443 52201 6 15 6100 1760000335 1760000395 ACCEPT OK",
"2 123456789012 eni-0aa22bb3 198[.]51[.]100[.]19 10[.]0[.]3[.]14 443 49400 6 12 5400 1760000340 1760000400 ACCEPT OK",
"2 123456789012 eni-0aa22bb3 10[.]0[.]3[.]14 198[.]51[.]100[.]8 443 49310 6 20 8800 1760000350 1760000410 ACCEPT OK",
"2 123456789012 eni-0aa22bb3 10[.]0[.]3[.]99 10[.]0[.]3[.]14 22 49711 6 8 700 1760000355 1760000415 ACCEPT OK"]},
q:"Type the grep command in the terminal and press Run, then press Check.",

hint:"Use grep on the file with the IP and the word REJECT; a single number comes from grep -c or a pipe to wc -l.",
ex:"A count needs <b>grep -c</b> (or a pipe to <b>wc -l</b>) plus a pattern that requires BOTH the address and REJECT on the same line, for example: grep -c \"203[.]0[.]113[.]50.*REJECT\" vpc-flow.log — or the two greps piped: grep \"203[.]0[.]113[.]50\" vpc-flow.log | grep -c REJECT. The file contains four lines with that address: three REJECT records (repeated SSH probes) and one ACCEPT record — so the correct count is 3. If you only grep the address you see all four lines, which is why the REJECT filter matters.",

{id:'M16',th:5,type:'fill',
sc:"You are wiring the delivery of an organization trail to the archive bucket in another account. The bucket policy statement below must let CloudTrail deliver logs while blocking the confused-deputy problem.",
q:"Complete the bucket policy statement.",
text:"{ \"Effect\": \"Allow\",\n  \"Principal\": { \"Service\": \"{0}\" },\n  \"Action\": \"{1}\",\n  \"Resource\": \"arn:aws:s3:::acme-security-logs/AWSLogs/123456789012/*\",\n  \"Condition\": { \"StringEquals\": { \"{2}\": \"123456789012\" } } }\n\nThis lets {3} deliver log objects while the {4} condition stops another tenant from tricking the service into writing into this bucket.",
bank:["cloudtrail.amazonaws.com","s3:PutObject","aws:SourceAccount","s3:GetObject","aws:PrincipalOrgID","logs.amazonaws.com","CloudTrail","aws:SourceArn"],
sol:["cloudtrail.amazonaws.com","s3:PutObject","aws:SourceAccount","CloudTrail","aws:SourceAccount"],
hint:"The service writes (puts) the log objects; the condition key pins the delivering account.",
ex:"CloudTrail is the writing service, so the principal is <b>cloudtrail.amazonaws.com</b> and the action is <b>s3:PutObject</b>. Without a condition, the service principal is usable by any customer (the confused-deputy problem) — pinning <b>aws:SourceAccount</b> to your account id makes the grant safe. aws:PrincipalOrgID would not help here because the caller is an AWS service, not a principal in your organization.",
ca:"Principal cloudtrail.amazonaws.com · s3:PutObject · Condition aws:SourceAccount"},
{id:'M17',th:2,type:'qcm',
sc:"The security operations team wants an alarm within one to two minutes whenever REJECT traffic towards the database subnet spikes. Flow log records are aggregated at a one-minute interval.",
q:"Which logging design meets the requirement?",
c:["Send flow logs to S3 and run an Athena query on a schedule every 15 minutes","Send flow logs to CloudWatch Logs, add a metric filter for REJECT records to the subnet, and alarm on the metric","Store flow logs in the central S3 archive and email a weekly summary","Enable CloudTrail data events for the database subnet"],
a:1,
hint:"Which destination evaluates new records in near real time and supports metric filters and alarms?",
ex:"CloudWatch Logs receives flow log records within minutes and <b>metric filters</b> turn matching records (for example REJECT plus the subnet CIDR) into a metric that a <b>CloudWatch alarm</b> evaluates continuously. S3 plus Athena is a batch pattern — even on a schedule, it cannot alarm in one to two minutes. Weekly email is far too slow, and CloudTrail data events record API calls, not network traffic.",
ca:"Flow logs → CloudWatch Logs → metric filter → CloudWatch alarm"},
{id:'M18',th:4,type:'dual',
sc:"A credential-stuffing crew is testing your public application. The blue team sees many failed ConsoleLogin events, then one success, then object downloads from a private S3 bucket. Current logging: management events only — no S3 data events.",
q:"Answer once as the blue team, once as the red team.",
parts:[
{label:"BLUE TEAM — what do you detect with?",q:"Which source proves which objects were downloaded from the bucket?",o:["S3 server access logs or CloudTrail S3 data events","VPC Flow Logs alone","Route 53 Resolver query logs","AWS Config rules"],a:0},
{label:"RED TEAM — what stays invisible?",q:"With only management events logged, which next action is LEAST likely to leave a trace?",o:["RunInstances in a staging account","Download more objects with the stolen console session","CreateAccessKey for the compromised user","AssumeRole on another role"],a:1}],
hint:"Object downloads are not management events. Everything else in the list changes account state and is logged.",
ex:"<b>Blue:</b> object-level requests (who fetched which object) appear in S3 server access logs or in CloudTrail S3 data events; flow logs know IPs and ports but not object paths, and Resolver logs are about DNS. <b>Red:</b> without S3 data events, more downloads leave no CloudTrail trace — while RunInstances, CreateAccessKey and AssumeRole are management events that are always recorded.",
ca:"Blue: S3 access logs / S3 data events · Red: more object downloads stay invisible"},
{id:'M19',th:2,type:'fill',code:1,
sc:"You are hardening detection for console sign-in failures on the CloudTrail log group. The CLI snippet below publishes a metric and wires an alarm.",
q:"Complete the metric filter pattern and the alarm.",
text:"aws logs put-metric-filter \\\n  --log-group-name CloudTrail/prod \\\n  --filter-name ConsoleLoginFailures \\\n  --filter-pattern '{ ($.eventName = {0}) && ($.errorMessage = {1}) }' \\\n  --metric-transformations metricName=LoginFailures,metricNamespace=Security,metricValue={2}\naws cloudwatch put-metric-alarm --alarm-name LoginFailures-High \\\n  --metric-name LoginFailures --namespace Security --statistic {3} \\\n  --threshold 10 --comparison-operator {4} --period 300 --evaluation-periods 1",
bank:["\"ConsoleLogin\"","\"Failed authentication\"","1","Sum","GreaterThanOrEqualToThreshold","Average","\"Login\"","0"],
sol:["\"ConsoleLogin\"","\"Failed authentication\"","1","Sum","GreaterThanOrEqualToThreshold"],
hint:"The pattern is JSON: field names use $. and string values need quotes. Each matching event should add one to the metric.",
ex:"Metric filter patterns are JSON: <b>$.eventName</b> equals \"ConsoleLogin\" and <b>$.errorMessage</b> equals \"Failed authentication\". Every matching event publishes <b>metricValue 1</b>, so the alarm statistic must be <b>Sum</b> (10 or more failures in five minutes) with <b>GreaterThanOrEqualToThreshold</b>. Average would dilute the signal, and 0 as a value would publish nothing useful.",
ca:"\"ConsoleLogin\" && \"Failed authentication\" · value 1 · Sum · GreaterThanOrEqualToThreshold"},
{id:'M20',th:2,type:'rank',
sc:"Friday, 17:40. Five items are sitting in the SOC queue. You have time to work them in severity order before the weekend handover.",
q:"Rank the items from most urgent (1) to least urgent (5).",
items:["GuardDuty CRITICAL: a new IAM access key was created for the root-equivalent admin user and used from a new country","Config rule NON_COMPLIANT: the payroll bucket policy was just changed to allow public reads","GuardDuty MEDIUM: a single external IP is port-scanning the app subnet; every probe shows REJECT","Twelve failed console sign-ins for user jdoe from the office IP range in five minutes","The CloudWatch agent stopped on one developer workstation (no logs since 09:00)"],

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
