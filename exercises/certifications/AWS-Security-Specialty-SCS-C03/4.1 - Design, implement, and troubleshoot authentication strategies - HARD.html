 fields:[{l:'Type the compromised principal',accept:['payroll-adm','payrolladm','payroll adm']},
  {l:'Type the event that shows intent to persist or expand access',accept:['ListAccessKeys','listaccesskeys','list access keys']}],filt:'Filter rows'},
ex:'hr-broker is a human being human: same known IP, same user agent, MFA on, two typos then success. payroll-adm is the compromise: a script user agent, no MFA, a foreign address, and then a recon chain — ListUsers, ListAccessKeys, GetRole. Listing access keys is the tell: the attacker is looking for keys to copy or for a place to create persistence. Baseline comparison plus user-agent analysis separates the typo from the intrusion. Next step: deactivate payroll-adm keys and search for anything created during that session.'},

{id:32,type:'qcm',th:'Identity & federation',t:'The nested group that lost everyone',
hint:'SCIM is a sync protocol. Ask what it actually sends when membership is nested.',
sc:'Users in the AD group AWS-Admins report they can reach the IAM Identity Center access portal but see NO accounts. Assignment: AWS-Admins group → AdministratorAccess permission set → prod-core account. The IdP provisions with SCIM. AWS-Admins is a NESTED group — it sits inside the parent group All-IT. Individual admins ARE direct members of AWS-Admins in AD.',
q:'Why do the admins see no accounts?',
a:{choices:['SCIM does not sync nested group membership, so AWS never sees those users inside AWS-Admins','The permission set session duration is set to one hour','The access portal URL changed last week','The management account SCP now denies sts:AssumeRole'],correct:0},
ex:'Most SCIM implementations sync DIRECT members of a group only. Nested membership — being a member via a parent group — is silently dropped during provisioning, so AWS never learns that these admins belong to AWS-Admins. The assignment is correct on paper but empty in practice. Session duration cannot hide accounts, a changed portal URL would break sign-in itself, and a management-account SCP has nothing to do with member-account assignments. The same nested-group rule bites the External IdP setup, because its SCIM sync behaves the same way. The fix: assign a group whose members are direct, or flatten the nesting for the synced group.'},

{id:33,type:'multi',th:'Identity & federation',t:'Intermittent trust authentication',
hint:'Four causes are real trust killers. Two are myths about how AD trusts work.',
sc:'On-prem users authenticate to AWS workloads through a trust with your Managed Microsoft AD in AWS. Some logins fail intermittently, mostly at 09:00 and after backups. Evaluate each statement as a possible root cause.',
q:'Select ALL plausible root causes.',
a:{choices:['Missing conditional forwarders, so the AWS-side domain cannot resolve on-prem names',
 'Kerberos clock skew of more than 5 minutes between the domain controllers',
 'Firewall rules that block Kerberos and LDAP ports (88, 389, 445, 464) on the trust path',
 'A one-way trust that points the wrong way for this authentication flow',
 'Because it is a cross-forest trust, SID filtering blocks every login',
 'Managed Microsoft AD needs no network ports because AWS encrypts everything'],
 correct:[0,1,2,3],
 w:['Broken name resolution is the classic intermittent trust failure — the DC cannot be found.','Kerberos rejects authentication when clocks drift beyond 5 minutes; backup jobs often trigger time sync issues.','Trusts ride on standard AD ports — Kerberos 88/464, LDAP 389/636, SMB 445. Block them and authentication dies partly or fully.','A one-way trust in the wrong direction means the wrong side can authenticate — some flows break.','SID filtering removes specific SIDs from tickets. It never blocks all authentication.','Encryption does not remove ports. AD still needs its standard connectivity.']},
ex:'Trusts fail on the boring things: DNS (conditional forwarders or delegation so each side resolves the other), time (Kerberos refuses skew beyond 5 minutes), ports (88, 389, 445, 464 and friends on the trust path) and direction (one-way trust oriented against the flow). The two myths: SID filtering trims SIDs from tokens, it does not deny everyone; and encryption never replaces connectivity. Intermittency usually means DNS or time — resources that work until a specific job or traffic path hits the broken hop.'},

{id:34,type:'blank',th:'Temporary credentials',t:'Trust policy with session tags',
hint:'The action that allows passing tags, the tag value, what the tag is called, the attribution field, and what kills tags.',
sc:'The vendor role builder must assume pay-audit only when it carries team=audit. Complete the trust policy and the explanation.',
q:'Fill blanks 1 to 5.',
a:{mono:true,text:'{\n  "Effect": "Allow",\n  "Principal": {"AWS": "arn:aws:iam::222233334444:role/builder"},\n  "Action": ["sts:AssumeRole", "[[1]]"],\n  "Condition": {"StringEquals": {"aws:PrincipalTag/team": "[[2]]"}}\n}\nThe calling code must set a [[3]] named team=audit at assume time. The extra action in the list is what grants the right to pass tags at all. To also record WHO the session really is, the caller passes a [[4]] value, which CloudTrail stores with every event. Without transitive tags, a tag would disappear after [[5]] — using the session to assume yet another role.',
 slots:[{accept:['sts:TagSession','stagtagsession'],why:'the permission to pass session tags'},
  {accept:['audit'],why:'the required tag value'},
  {accept:['session tag','sessiontag','session tag '],why:'tags set at assume time'},
  {accept:['sourceIdentity','sourceidentity','source identity'],why:'the attribution field in CloudTrail'},
  {accept:['role chaining','rolechaining','chaining'],why:'assuming again from the session'}],
 bank:['sts:TagSession','audit','session tag','sourceIdentity','role chaining','sts:ExternalId','GetSessionToken']},
ex:'Passing session tags needs sts:TagSession in the trust policy Action list — without it the assume-role call fails even when everything else is right. The condition then checks the tag as aws:PrincipalTag/team against audit. A session tag is set by the caller at assume time. sourceIdentity is the attribution field: set it once and every CloudTrail event from that session names the real user. Tags are not transitive by default, so they vanish after role chaining unless listed in sts:TransitiveTagKeys. ExternalId and GetSessionToken solve different problems.'},

{id:35,type:'terminal',th:'Temporary credentials',t:'Identify the found credentials',
hint:'The goal: a read-only call that answers who am I and in which account. Choose the tool and the flags yourself.',
sc:'A credentials file was found on a build server. Before containment you must prove, from this shell, exactly which principal these credentials resolve to and in which account — the read-only identity check every responder runs first.',
q:'Type the command. Nothing about the tool or flags is given; the shell output will confirm your choice.',
a:{steps:[{accept:'(?=[\\s\\S]*aws\\s+sts)(?=[\\s\\S]*get-caller-identity)[\\s\\S]*',
 ex:'aws sts get-caller-identity',
 out:'{\n  "UserId": "AROAXMPBEG2X7C3EXAMPLE:build-4711",\n  "Account": "222233334444",\n  "Arn": "arn:aws:sts::222233334444:assumed-role/BuildRole/build-4711"\n}'}
 ]},
ex:'The responder move is aws sts get-caller-identity — the GetCallerIdentity API. It answers three questions in one shot: which principal (UserId and Arn), which account, and whether the credentials are a role session (an sts ARN with an assumed-role path). It needs no special permission, so it works for any valid credentials — that is what makes it the first diagnostic. The Arn also reveals the session name (here build-4711), which is the thread you pull in CloudTrail next.'},

{id:36,type:'classify',th:'Troubleshooting & detection',t:'Send the failure to the right owner',
hint:'Sort by WHERE the broken check lives: the sign-in box, the credential exchange, the trust, or the IdP.',
sc:'Five failed authentication reports landed in one queue. As the IAM engineer, route each failure to the component that actually owns the fix.',
q:'Sort each failure into the component to investigate.',
a:{buckets:[{id:'up',label:'Cognito user pool'},{id:'ip',label:'Cognito identity pool'},{id:'trust',label:'IAM / STS trust'},{id:'idp',label:'Corporate IdP'}],
 items:[{t:'NotAuthorizedException from GetUser although the password is correct',b:'up'},
  {t:'GetCredentialsForIdentity fails although the ID token is fresh',b:'ip'},
  {t:'AssumeRole returns AccessDenied although the caller holds sts:AssumeRole',b:'trust'},
  {t:'SAML assertion rejected right after the IdP rotated its signing certificate',b:'idp'},
  {t:'TokenExpiredException raised at the API Gateway authorizer',b:'up'}]},
ex:'NotAuthorizedException from a user pool API is the pool rejecting the caller — check the app client and the token. GetCredentialsForIdentity belongs to the identity pool: a fresh ID token that still fails means the pool does not trust that provider or the role mapping is broken. AccessDenied on AssumeRole with caller permission present is a TRUST problem: the trust policy or its condition said no. A rejection right after a certificate rotation points at the IdP — the metadata with the new signing certificate never reached AWS. And TokenExpired at the authorizer is a user pool token lifecycle issue.'},

{id:37,type:'order',th:'Temporary credentials',t:'ExpiredToken in the middle of a run',
hint:'Diagnose, classify, replace the credentials the right way, then verify before restarting.',
sc:'The nightly data job died halfway with ExpiredToken. The runbook was never written. Write it by ordering the steps.',
q:'Put the recovery steps in order.',
a:{items:['Read the error: ExpiredToken means the credentials passed their lifetime',
 'Work out what kind of credentials the job used (assumed role session or IAM user session)',
 'If it was an assumed role session, run assume-role again from the base credentials — a session cannot be extended',
 'Export the fresh keys into the job environment',
 'Confirm the new session with a read-only identity call, then restart the job']},
ex:'ExpiredToken is not an outage — it is a lifetime doing its job. First classify the credentials: an IAM user GetSessionToken session can be re-minted, but an ASSUMED ROLE session can never be extended; the only path is to assume the role again from the base credentials. Then load the fresh keys and verify with get-caller-identity before restarting, so the job does not die again after twenty minutes. The durable fix is a credential refresh inside the job, plus a session duration that covers the whole run.'},

{id:38,type:'qcm',th:'Temporary credentials',t:'The link that died early',
hint:'The URL asked for 7 days. Something else decided when it would die.',
sc:'A developer assumed a role, then created a presigned URL with Expires=604800 (7 days). At that moment the role session had exactly 6 hours of life left. Nothing else changed — no policy updates. The link worked for 6 hours and then returned AccessDenied for everyone.',
q:'Why did the link die after 6 hours?',
a:{choices:['A presigned URL can never outlive the credentials that signed it — the role session ended','SigV4 caps role-signed URLs at one hour','The bucket policy was silently updated at the same time','Presigned URLs always die at UTC midnight'],correct:0},
ex:'The signature is computed from the signing credentials, and the request runs WITH those credentials. When the role session ends, its temporary keys are dead, so the signed request can no longer authenticate — regardless of the 7 days printed in the URL. SigV4 has no 1-hour rule for roles, and no midnight fairy exists; the scenario explicitly says no policy changed. The fix: sign with credentials whose lifetime covers the intended window (long-term keys allow up to 7 days), and treat every URL as dying at credential expiry.'},

{id:39,type:'match',th:'MFA & credential policy',t:'Condition keys for trust and sessions',
hint:'Two are MFA checks, one is the partner secret, one is the attribution label, one controls tag survival, one is a hardware method.',
sc:'You are reviewing a hardening pull request full of policy conditions. Match each key to what it actually does before you approve.',
q:'Match each key with its job.',
a:{pairs:[['aws:MultiFactorAuthPresent','True only when the session was issued right after an MFA check'],
 ['aws:MultiFactorAuthAge','Seconds since the MFA check happened'],
 ['sts:ExternalId','Secret value the trusted third party must send to assume the role'],
 ['aws:SourceIdentity','Label set at assume time that names the real user in CloudTrail'],
 ['sts:TransitiveTagKeys','Lists session tags that survive one more role-chaining hop'],
 ['FIDO2 / WebAuthn','Hardware security key MFA supported by the Identity Center directory']]},
ex:'aws:MultiFactorAuthPresent is a boolean about MFA at session issue; aws:MultiFactorAuthAge adds time-awareness — require a FRESH MFA check, not one from yesterday. sts:ExternalId is the shared secret against the confused deputy problem. aws:SourceIdentity is the attribution label set by the caller at assume time and written into CloudTrail. sts:TransitiveTagKeys declares which session tags survive role chaining. FIDO2/WebAuthn is not a policy key at all — it is the hardware MFA method Identity Center supports. Knowing which keys exist, and what each one measures, is the difference between a policy that works and one that blocks everyone.'},

{id:40,type:'spot',th:'App & machine identity',t:'Identity pool role mapping failure',
hint:'The chosen role comes from a claim. Ask when that claim exists.',
sc:'A mobile app uses a Cognito identity pool. GetCredentialsForIdentity fails for one specific user while others succeed. The identity pool is configured as below.',
q:'Click the line that explains the failure.',
a:{lines:['Identity pool: app-prod-pool',
 'Cognito provider: mapped to user pool euwest1_ABCDEF',
 'Role mapping mode: Choose role from token (cognito:preferred_role)',
 'User pool groups: this user belongs to no groups',
 'Default authenticated role: (not configured)'],bad:3},
ex:'In choose-role-from-token mode, AWS reads the role from the cognito:preferred_role claim. That claim only exists for users who are in at least one user pool group that has a role attached. This user belongs to no groups, so there is no claim — and with the default role not configured either, the identity pool has nothing to hand out and fails. Other users work because their group membership provides the claim. Fix: put the user in a group with a role, or configure the default authenticated role as a floor.'},

{id:41,type:'logview',th:'Troubleshooting & detection',t:'The MFA gap in the session chain',
hint:'Policy: humans need MFA. Service accounts may skip it ONLY for the low-privilege Reader role. Filter, then correlate two events.',
sc:'You are auditing session hygiene. Policy says: human admins must sign in with MFA; service accounts may skip MFA only for the low-privilege Reader role.',
q:'Which principal skipped MFA AND then reached a sensitive role — and which role? (Two answers, half a point each.)',
a:{cols:['Time','Event','Principal','Role used','MFA in session','Result'],
 rows:[['09:02:10Z','GetSessionToken','fin-mgr','—','true','Success'],
  ['09:05:41Z','AssumeRole','fin-mgr','role/Reader','true','Success'],
  ['09:40:02Z','GetSessionToken','svc-archive','—','false','Success'],
  ['09:41:19Z','AssumeRole','svc-archive','role/AdminRole','false','Success'],
  ['10:10:33Z','GetSessionToken','dev-sam','—','true','Success'],
  ['10:11:07Z','AssumeRole','dev-sam','role/Reader','true','Success'],
  ['10:30:44Z','GetSessionToken','svc-report','—','false','Success'],
  ['10:31:02Z','AssumeRole','svc-report','role/Reader','false','Success']],
 fields:[{l:'Type the principal that broke the policy',accept:['svc-archive','svcarchive','svc archive']},
  {l:'Type the sensitive role it reached',accept:['adminrole','role/adminrole','adminrole']}],filt:'Filter rows'},
ex:'svc-report is the decoy: it skips MFA but only touches Reader — allowed by policy. svc-archive breaks both rules at once: a no-MFA session that then assumed AdminRole. The audit finding is a policy gap, not just a one-off: the trust policy of AdminRole should carry a condition like aws:MultiFactorAuthPresent = true so that NO session, service or human, can reach it without a fresh MFA check. Correlating the GetSessionToken MFA flag with the following AssumeRole is exactly how session chains are reviewed.'},

{id:42,type:'multi',th:'App & machine identity',t:'Three audiences, one architecture',
hint:'Workforce, customers and a vendor need three different patterns. Two options are traps.',
sc:'A company has three audiences: workforce SSO through the corporate IdP, a customer mobile app that uploads photos to S3, and a third-party vendor that needs cross-account read-only access. Evaluate the design statements.',
q:'Select ALL statements that are TRUE.',
a:{choices:['Cognito identity pools can give the mobile app users temporary AWS credentials',
 'IAM Identity Center permission sets are for the workforce, not for app customers',
 'The vendor should assume a dedicated role whose trust policy checks an ExternalId',
 'Each app customer should get an IAM user with a console password',
 'Identity pool guest access should stay enabled for the vendor integration',
 'An expired access token is replaced using the refresh token, not by reusing the ID token'],
 correct:[0,1,2,5],
 w:['Identity pools exist exactly for this: token in, temporary AWS keys out.','Permission sets serve workforce SSO; app customers live in user pools and identity pools.','A dedicated role with an ExternalId condition is the standard safe vendor pattern.','Never give end customers IAM users — they scale badly and bypass your app controls.','Guest access is for unauthenticated app users, not for vendors, and leaving it on widens the attack surface.','The refresh token exists to mint new access tokens; the ID token is an identity statement, not a renewal mechanism.']},
ex:'Three audiences, three patterns. Customers: user pool for sign-in, identity pool for temporary AWS credentials — and the refresh token keeps their access tokens fresh. The workforce: IAM Identity Center with permission sets. The vendor: a dedicated cross-account role with an ExternalId in the trust policy to defeat the confused deputy. The traps are the old habits: per-customer IAM users do not scale and are unmanageable, and identity pool guest access has nothing to do with vendors — it is for unauthenticated app users and should stay off unless truly needed.'},

{id:43,type:'triage',th:'Troubleshooting & detection',t:'CI role session gone rogue',
hint:'Temporary credentials cannot be revoked — cut the source, fence the role, then clean up what it created.',
sc:'CloudTrail at 03:00: role/deploy-prod assumed with session name gh-runner from an IP range your CI never uses. The session then called CreateAccessKey on IAM user backup-sync. Temporary credentials cannot be revoked directly. You own the org.',
q:'Take the three decisions in order.',
a:{steps:[
 {p:'FIRST move?',c:0,ch:[
  {t:'Rotate the CI credentials that mint these sessions and add an SCP denying unused regions for deploy-prod',o:'Correct: you cut the source of new sessions and fence the live one without breaking everything.'},
  {t:'Delete role deploy-prod',o:'This breaks every deploy AND the live session keeps working until it expires anyway.'},
  {t:'Wait for the session to expire',o:'The attacker gets the full session window. Never wait with an active IAM write.'}]},
 {p:'Now scope the incident. How do you find everything the session did?',c:0,ch:[
  {t:'Search CloudTrail by session name, source IP and the new access key id, across all accounts',o:'The session name and IP give you the full action list — the blast radius.'},
  {t:'Only check the S3 bucket listings',o:'The session touched IAM. Scoping to S3 hides the real damage.'},
  {t:'Open a ticket with the CI vendor and wait for their answer',o:'Vendor support is not a scoping tool. Your own trail has the answers.'}]},
 {p:'The session created an access key for backup-sync. What now?',c:0,ch:[
  {t:'Deactivate and delete that key, then review what it touched while it existed',o:'Persistence removed, impact measured, evidence kept.'},
  {t:'Rename the user backup-sync',o:'The key keeps working after a rename. Renaming is not containment.'},
  {t:'Increase the role session duration so audits are easier',o:'Longer sessions make attackers happier, not auditors.'}]}]},
ex:'This is the role-session incident playbook. You cannot revoke a live temporary session, so containment means: kill the source (rotate the CI credentials) and fence the role (an SCP deny for regions or actions it should never touch). Scoping works because CloudTrail tags everything with the session name and source IP. The CreateAccessKey call is persistence — deactivate and delete the key, then measure what it did. Deleting the role is the reflex that breaks production while leaving the live session alive. Renaming a user does not disable its keys.'},

{id:44,type:'blank',th:'Identity & federation',t:'Anatomy of a permission set',
hint:'Template, session length, the attached policies, the portal users open, and the tighter limit type.',
sc:'A new platform engineer asks how IAM Identity Center actually applies permissions. Complete the explanation.',
q:'Fill blanks 1 to 5.',
a:{text:'A permission set is a [[1]] that IAM Identity Center turns into a role in every assigned account. Its [[2]] controls how long each console session lasts. Attached [[3]] policies define what the role may do. Users reach their assignments through the AWS [[4]] portal. If one task needs tighter limits than the permission set gives, attach a permissions [[5]] to it.',
 slots:[{accept:['template'],why:'the reusable definition'},
  {accept:['session duration','sessionduration','session duration '],why:'how long sessions live'},
  {accept:['managed','aws managed','customer managed'],why:'managed or inline policies define permissions'},
  {accept:['access'],why:'the AWS access portal'},
  {accept:['boundary','boundaries','permission boundary'],why:'the cap on the maximum permissions'}],
 bank:['template','session duration','managed','access','boundary','inline','federation']},
ex:'A permission set is a template: assign it to three accounts and three roles appear, one per account. Session duration caps each console visit — one hour by default. Permissions come from attached managed policies (AWS managed or customer managed) plus optional inline policies. The access portal is the single URL where users pick account and role. A permissions boundary caps the maximum any policy can grant — the right tool when a task needs a hard ceiling below the permission set. Inline and federation are decoys here.'},

{id:45,type:'rank',th:'Temporary credentials',t:'Rank the exposure incidents',
hint:'Think: live admin keys in public, then long-lived write access, then read access, then attribution debt, then password hygiene.',
sc:'Five incidents arrived overnight, all involving temporary or shared credentials. Rank them for the response queue.',
q:'Rank from MOST to LEAST critical.',
a:{items:['Administrator role session keys pasted into a public GitHub issue',
 '7-day presigned PUT URL for the payroll bucket shared in a public channel',
 '24-hour presigned GET URL for a KMS-encrypted report, sent to a partner',
 'Role sessions created without any source identity, so attribution is hard',
 'IAM password policy that allows 6-character passwords']},
ex:'Public admin session keys are the fire: full power, zero conditions, usable right now until expiry. The public 7-day PUT URL comes next — a week-long open write window into payroll data. The 24-hour GET to one encrypted report is a real but bounded read exposure to a known partner. Missing source identity is not an exposure by itself; it is detective debt — you cannot attribute sessions cleanly. The weak password policy is standing hygiene risk that requires an attacker to guess first. Rank by immediacy and blast radius, not by how scary the words sound.'}

,

{id:46,type:'spot',th:'Identity & federation',t:'Assignment that misses the ticket',
hint:'Cross-reference the TargetId with the account table. Similar numbers, different accounts.',
sc:'Ticket IAM-2841 says: give group sec-incident the SecurityAuditor permission set on prod-core. The engineer applied this change. Cross-check it against the account list.',
q:'Click the line that does NOT match the ticket.',
a:{lines:['Assignment:',
 '  PermissionSet: SecurityAuditor',
 '  Principal: group sec-incident',
 '  TargetId: "444455556666"   # staging',
 '  TargetType: AWS_ACCOUNT'],bad:3,
 art:'Account list (from the org):\n111122223333 → prod-core\n444455556666 → stg-core\n999900001111 → old-sandbox (closed last month)'},
ex:'The ticket asks for prod-core, which is 111122223333. The TargetId says 444455556666 — stg-core. The permission set name is right, the group is right, the type is right, and the account is wrong: the classic wrong-environment assignment. It looks plausible because every line contains a real value; only the cross-reference with the account list exposes it. Fix: TargetId 111122223333. Always read assignment changes next to an account inventory — twelve-digit IDs are hard to eyeball.'},

{id:47,type:'terminal',th:'Temporary credentials',t:'Credential report from the CLI',
hint:'The goal: produce the report first, then fetch its contents. Two commands, in order. Choose the service and commands yourself.',
sc:'IAM users on this account have not been reviewed for a year. The review needs the credential report: produce it, then fetch its contents so the team can read when each key was last rotated.',
q:'Run the two commands in order. The shell will confirm each step.',
a:{steps:[{accept:'(?=[\\s\\S]*aws\\s+iam)(?=[\\s\\S]*generate-credential-report)[\\s\\S]*',
  ex:'aws iam generate-credential-report',
  out:'{"State": "STARTED"} — a moment later the report is ready.'},
 {accept:'(?=[\\s\\S]*aws\\s+iam)(?=[\\s\\S]*get-credential-report)[\\s\\S]*',
  ex:'aws iam get-credential-report',
  out:'{"Content": "user,arn,creation,password_enabled,password_last_used,mfa_active,access_key_1_last_rotated…\\nfin-mgr,…,2026-09-30,…,false,…\\npayroll-adm,…,2024-11-02,…,true,2024-11-02"}'}]},
ex:'The report flow is two steps: aws iam generate-credential-report asks AWS to build it, then aws iam get-credential-report fetches the base64 content. Reading the generated report instantly may return InProgress — generation takes a moment. In the sample output, payroll-adm holds an access key untouched since 2024 with MFA inactive: exactly the kind of finding the review exists to catch. Rotation staleness plus missing MFA is the classic remediation shortlist.'},

{id:48,type:'qcm',th:'Identity & federation',t:'Identity source under network limits',
hint:'One option needs inbound LDAP from AWS to on-prem — which is blocked. Which option still uses the SAME on-prem passwords?',
sc:'IAM Identity Center must authenticate users against the EXISTING on-prem Active Directory, and the same passwords must keep working. A fast VPN to the data center exists, BUT the security team blocks every inbound LDAP connection from AWS toward the on-prem domain controllers.',
q:'Which identity source still satisfies both requirements?',
a:{choices:['Managed Microsoft AD in AWS with a two-way trust to the on-prem domain','AD Connector proxying sign-ins to the on-prem domain controllers','Simple AD, because it needs no connectivity to the data center','The built-in Identity Center directory with imported users'],correct:0},
ex:'AD Connector is a proxy: it forwards authentication FROM AWS TO your domain controllers, which is exactly the blocked inbound LDAP flow — so it is dead on arrival. Simple AD and the built-in directory both hold their OWN passwords, breaking the same-password requirement. Managed Microsoft AD in AWS with a two-way trust flips the model: authentication requests travel ACROSS THE TRUST from the AWS-side domain to the on-prem domain, and AWS never needs to open inbound LDAP to the DCs. Users keep typing their familiar passwords. Direction of the connection is the whole question.'},

{id:49,type:'match',th:'Troubleshooting & detection',t:'CloudTrail signatures to root causes',
hint:'One is a device, one is directory reachability, one is a policy gap, one is lifetime, one is pool trust, one is a decoder.',
sc:'Six CloudTrail signatures were pulled from the security queue. Match each with its most likely root cause.',
q:'Match each signature with its cause.',
a:{pairs:[['ConsoleLogin failure: "MFA challenge returned a failure"','The MFA device is out of sync or the code is wrong'],
 ['AssumeRole AccessDenied: "Identity source configuration error"','IAM Identity Center cannot reach its identity source'],
 ['GetSessionToken with mfaAuthenticated = false for a human admin','MFA was skipped — a policy gap for privileged users'],
 ['ExpiredToken on an S3 GET late in the day','The session reached its duration limit — re-assume for fresh keys'],
 ['NotAuthorizedException on GetId with a fresh user pool token','The identity pool does not trust that user pool provider'],
 ['DecodeAuthorizationMessage call','Translate the encoded IAM denial into plain text']]},
ex:'A failing MFA challenge means device or code trouble — an admin reset fixes it. Identity source configuration error is Identity Center saying it cannot reach or read its directory. GetSessionToken with mfaAuthenticated false for a human is not an error at all — it is a gap you can only see by reading the field. ExpiredToken late in the day is a session that lived its whole duration; re-assume. GetId rejected with a fresh token means the identity pool provider mapping is missing or wrong. And DecodeAuthorizationMessage is the tool that turns an encoded denial into readable policy text.'},

{id:50,type:'multi',th:'Temporary credentials',t:'Advanced STS controls',
hint:'Three statements describe real controls. Two are myths about where ExternalId lives and what sourceIdentity can do.',
sc:'The platform team proposed these claims in a design doc about assume-role hardening. Fact-check each one.',
q:'Select ALL statements that are TRUE.',
a:{choices:['aws:SourceIdentity is set by the caller at assume time and cannot be changed during the session',
 'An ExternalId in the trust policy is the classic fix for the confused deputy problem',
 'Session tags can be tested in policies as aws:PrincipalTag values',
 'Tags listed in sts:TransitiveTagKeys survive one more hop of role chaining',
 'The ExternalId must be stored encrypted in Secrets Manager by AWS',
 'Using sourceIdentity removes the need for CloudTrail'],
 correct:[0,1,2,3],
 w:['The caller sets it once at assume time; it is fixed for the whole session and lands in CloudTrail.','ExternalId proves the caller is the intended partner — the standard confused-deputy defense.','A session tag set at assume time is visible as aws:PrincipalTag/key to downstream policy evaluation.','Transitive tags are the exception: listed tags ride along into the next chained session.','AWS stores nothing for you. The ExternalId is a plain string agreed with the partner out of band.','sourceIdentity is a field INSIDE CloudTrail events. It attributes sessions; it does not replace the trail.']},
ex:'sourceIdentity is set once at assume time, survives the session unchanged, and shows up in every CloudTrail event — clean attribution. ExternalId is the confused-deputy classic: the third party must prove it is the intended caller. Session tags become aws:PrincipalTag conditions downstream, and the transitive list defines which tags survive chaining. The myths: AWS does not store ExternalId anywhere for you — it is an agreed string — and sourceIdentity lives inside CloudTrail, so the trail remains essential.'},

{id:51,type:'classify',th:'MFA & credential policy',t:'Which layer enforces the control?',
hint:'Ask WHERE the check lives: at the IdP, inside a policy condition, at the organization edge, or on the resource.',
sc:'A defense-in-depth plan lists six controls. Each belongs to a different enforcement layer. Sort them.',
q:'Sort each control into its enforcement layer.',
a:{buckets:[{id:'idp',label:'IdP / directory level'},{id:'cond',label:'Trust or IAM policy condition'},{id:'scp',label:'Organization guardrail (SCP)'},{id:'res',label:'Resource policy'}],
 items:[{t:'Enforce TOTP for every portal sign-in',b:'idp'},
  {t:'Re-prompt for MFA when a sign-in looks risky (context-aware MFA)',b:'idp'},
  {t:'Require aws:MultiFactorAuthPresent = true for DeleteBucket',b:'cond'},
  {t:'Check sts:ExternalId before trusting a vendor principal',b:'cond'},
  {t:'Deny iam:CreateUser in every account of the organization',b:'scp'},
  {t:'Deny s3:GetObject when aws:SecureTransport is false',b:'res'}]},
ex:'Authentication questions live at the IdP: TOTP for everyone, context-aware re-prompts for risky sign-ins. Policy conditions live inside trust or identity policies: the MFA Bool check on a sensitive action, the ExternalId test on a vendor trust. Organization-wide guardrails are SCPs — denying IAM user creation everywhere is a textbook SCP. Resource-level questions, like forcing TLS on an S3 bucket, belong in the resource policy with aws:SecureTransport. Defense in depth means every layer gets the controls that fit it.'},

{id:52,type:'order',th:'App & machine identity',t:'What the authorizer really checks',
hint:'Parse, verify the signature, then the standard claims, then the app claims, then forward.',
sc:'An API backed by API Gateway rejects a request. Before touching code, the team must understand the exact JWT validation sequence an authorizer performs.',
q:'Put the validation steps in order.',
a:{items:['Parse the JWT header and payload',
 'Fetch the issuer JWKS and verify the signature',
 'Check the standard claims: exp, iss and aud',
 'Check the app claims: scope or cognito:groups for this action',
 'Forward the verified claims to the backend logic']},
ex:'Validation has a strict order. Parse first — a malformed token stops here. Then the signature against the issuer JWKS: an unsigned or forged token dies before any claim matters. Only then do the standard claims matter: exp (not expired), iss (right issuer), aud (meant for this audience). App-level claims like scope or cognito:groups decide what the caller may do. Last, the verified claims are forwarded so the backend never re-verifies. The OIDC discovery document is where the JWKS URL comes from — that is the fetch in step two.'},

{id:53,type:'qcm',th:'Identity & federation',t:'Intermittent InvalidIdentityToken at peak',
hint:'Same failure, same clock, same certificate — supposedly. What varies between IdP nodes?',
sc:'AssumeRoleWithSAML works most of the day. During the 09:00 and 13:00 login bursts, a share of assertions fail with InvalidIdentityToken. The IdP team swears the signing certificate is unchanged, clocks are synced, and load is normal. STS reports no throttling.',
q:'What is the most likely cause?',
a:{choices:['One IdP node still serves the old signing certificate after the rotation','STS throttling rejects assertions during traffic bursts','The role session duration expired for those users','A permissions boundary now blocks the console role'],correct:0},
ex:'InvalidIdentityToken means AWS could not validate the assertion — usually a signature problem. A certificate ROTATION that reached some IdP nodes but not all produces exactly this fingerprint: each burst routes some users to the stale node, whose assertions fail, while others succeed. The scenario rules out throttling (STS reports none, and throttling errors look different), session expiry (irrelevant at sign-in) and boundaries (they act after the role is assumed, not on the assertion). The fix: complete the metadata/certificate rollout across every IdP node.'},

{id:54,type:'blank',th:'Troubleshooting & detection',t:'Reading a role session in CloudTrail',
hint:'The who-object, the issuer inside it, the principal id suffix, the MFA flag, and the block holding tags.',
sc:'The incident review needs precise CloudTrail vocabulary. Complete the paragraph about reading an AssumedRole event.',
q:'Fill blanks 1 to 5.',
a:{text:'You are reading a CloudTrail event for a call made with assumed-role credentials. The [[1]] object tells you who made the call. Inside sessionContext, [[2]] gives you the role that the session used, and the part of the [[3]] after the colon is the session name chosen at assume time. The attribute [[4]] is "true" only when the session passed an MFA check. Any session tags the caller passed appear inside the same [[5]] block.',
 slots:[{accept:['userIdentity','useridentity'],why:'the who of the event'},
  {accept:['sessionIssuer','sessionissuer'],why:'the role behind the session'},
  {accept:['principalId','principalid'],why:'role-id:session-name'},
  {accept:['mfaAuthenticated','mfaauthenticated'],why:'the MFA flag'},
  {accept:['sessionContext','sessioncontext'],why:'the block holding session details and tags'}],
 bank:['userIdentity','sessionIssuer','principalId','mfaAuthenticated','sessionContext','responseElements','eventSource']},
ex:'userIdentity is the who-object of every event. For role sessions, sessionContext.sessionIssuer names the role that granted the permissions, and principalId looks like role-id:session-name — the part after the colon is the session name, your best search key. mfaAuthenticated is the honest MFA flag for the session. Session tags ride inside sessionContext, next to those attributes. responseElements and eventSource are real fields but answer different questions — what came back, and which service was called.'},

{id:55,type:'spot',th:'Temporary credentials',t:'Code versus trust policy',
hint:'Compare the tag VALUE in the code with the condition VALUE in the trust policy. One character of meaning differs.',
sc:'A Lambda function assumes pay-audit in another account. The trust policy demands a specific session tag. Read the policy, then the code.',
q:'Click the line in the code that will cause AccessDenied.',
a:{lines:['resp = sts.assume_role(',
 '    RoleArn="arn:aws:iam::333344445555:role/pay-audit",',
 '    RoleSessionName="pay-audit-1",',
 '    Tags=[{"Key": "owner", "Value": "payroll"}],',
 '    SourceIdentity="lambda-etl"',
 ')'],bad:3,
 art:'Trust policy of role pay-audit (account 333344445555):\n{\n  "Effect": "Allow",\n  "Principal": {"AWS": "arn:aws:iam::222233334444:role/lambda-etl"},\n  "Action": ["sts:AssumeRole", "sts:TagSession"],\n  "Condition": {"StringEquals": {"aws:PrincipalTag/owner": "payments"}}\n}'},
ex:'The trust policy demands a session tag owner=payments. The code sends owner=payroll — a different team — so the StringEquals condition fails and the assume-role call is denied, even though sts:TagSession is granted and the principal matches. This is the subtlest class of assume-role bug: every structural element is right, only one VALUE is wrong. Reading the trust policy next to the calling code, key by key and value by value, is the only reliable way to catch it.'},

{id:56,type:'multi',th:'Troubleshooting & detection',t:'Attribution fields for federated sessions',
hint:'Two statements are plain wrong about what CloudTrail records and hides.',
sc:'After an incident, the team must map role activity back to real people who signed in via federation. Fact-check these claims about CloudTrail attribution.',
q:'Select ALL statements that are TRUE.',
a:{choices:['userIdentity.sessionContext.sessionIssuer.userName shows the role the session used',
 'The part of principalId after the colon is the session name',
 'sourceIdentity appears in the event when the caller set it at assume time',
 'CloudTrail hides session tags for privacy',
 'Console sign-ins of federated users are recorded as IAMUser events'],
 correct:[0,1,2],
 w:['sessionIssuer.userName is the role that granted the permissions — always present for role sessions.','principalId has the form role-id:session-name; the suffix is your search key for the session.','Callers who set sourceIdentity at assume time get it written into the events — the strongest attribution.','Session tags are recorded in the event sessionContext. Nothing is hidden.','Federated sign-ins appear as FederatedUser or AssumedRole — never as IAMUser, which is only for real IAM users.']},
ex:'Attribution rests on three fields: sessionIssuer.userName (which role), the principalId suffix (which session name — for Identity Center that is the user email), and sourceIdentity when callers set it. Session tags are recorded too, inside sessionContext — CloudTrail hides nothing here. The last claim is backwards: federated users are precisely the ones recorded as FederatedUser or AssumedRole; IAMUser is reserved for real IAM users. Knowing these fields cold is what makes federation auditable.'},

{id:57,type:'qcm',th:'App & machine identity',t:'Record-level authorization from token claims',
hint:'The requirement is per-record decisions computed from user pool tokens, with no backend policy code.',
sc:'An app must let a user edit ONLY the records that belong to their team, where team comes from the Cognito user pool token claims. The product team wants the rules written as policy, not as backend if-statements.',
q:'Which service fits?',
a:{choices:['Amazon Verified Permissions with Cedar policies driven by user pool tokens','A Cognito identity pool that maps groups to IAM roles','IAM session policies attached at assume time','AWS Firewall Manager rules in front of the API'],correct:0},
ex:'Verified Permissions is built for exactly this: you write Cedar policies like the editor may edit records where the record team equals the token team claim, and it evaluates them per request against the user pool token. An identity pool maps tokens to AWS roles for AWS resources — it cannot decide access to application records. Session policies scope AWS actions, not app objects. Firewall Manager guards networks. The pattern: AWS resource permissions and application permissions are different problems, and Verified Permissions owns the second one.'},

{id:58,type:'match',th:'App & machine identity',t:'Machine identities done right',
hint:'No keys on boxes, roles on functions, secrets rotated, requests signed, vendors fenced.',
sc:'A legacy system audit found five machine-access patterns, some good and some bad. Match each workload with the correct pattern it should use.',
q:'Match each workload with its correct credential pattern.',
a:{pairs:[['EC2 workload needs to read one S3 bucket','Instance profile role behind IMDSv2 — no keys on the box'],
 ['Lambda function writes to DynamoDB','Execution role attached to the function'],
 ['Legacy app needs a database password','Secrets Manager secret with automatic rotation'],
 ['Internal service calls an API Gateway endpoint','SigV4-signed request with the caller role credentials'],
 ['Third-party audit tool needs cross-account read-only access','Dedicated role whose trust policy checks an ExternalId']]},
ex:'Machines use roles, not users. On EC2 the instance profile hands credentials to the box at runtime through the metadata service — and with IMDSv2 enforced, every metadata call needs a token, so nothing is stored and nothing leaks. Lambda gets its execution role attached to the function itself. Real secrets like database passwords go to Secrets Manager, which rotates them on schedule. One AWS service calling another through API Gateway signs requests with SigV4 using the caller role — IAM authentication without shared keys. And the external vendor is the cross-account role with an ExternalId, the confused-deputy fence. Five patterns, zero hardcoded credentials.'},

{id:59,type:'rank',th:'Troubleshooting & detection',t:'Rank the CloudTrail findings during a live incident',
hint:'Active control-plane compromise outranks brute force, anomalies, and a failed nightly job.',
sc:'Mid-incident, the CloudTrail sweep returns five findings. The response team can only work them top-down. Rank them.',
q:'Rank from MOST to LEAST urgent.',
a:{items:['Root user console login with MFAUsed = No from a new IP',
 'AttachRolePolicy putting AdministratorAccess on a developer role, by the same session',
 '50 failed ConsoleLogin events for fin-mgr from one IP in ten minutes',
 'GetSessionToken from svc-report at 03:00, an unusual hour',
 'ExpiredToken errors from the nightly ETL job']},
ex:'Root login without MFA is the emergency: total control, no second factor. The AttachRolePolicy finding rides right behind it — it is the persistence move that turns one session into lasting admin access. The fin-mgr failure burst is a brute-force attempt: contain before it succeeds, but nobody is in yet. The svc-report odd-hour session is an anomaly worth a look, not a breach by itself. And the ETL ExpiredToken errors are an availability bug — annoying, not malicious. During incidents, rank by attacker capability gained, not by event volume.'},

{id:60,type:'blank',th:'Temporary credentials',t:'Presigned URL internals',
hint:'Scope, expiry, the session token, the KMS permission, and the query parameter that carries the signature.',
sc:'Final exercise: a junior asks what really lives inside a presigned URL. Complete the paragraph.',
q:'Fill blanks 1 to 5.',
a:{text:'A SigV4 presigned URL carries the credential [[1]] — the date, the region and the service — plus an [[2]] timestamp. When you sign with a role session, the URL also embeds that session token. If the object is encrypted with SSE-KMS, the request still needs [[3]] rights on the key, or it fails. The signature itself travels in the [[4]] query parameter, and the whole URL stops working at its [[5]] time, even when that is much earlier than the seven days it advertises.',
 slots:[{accept:['scope'],why:'date, region and service form the scope'},
  {accept:['expiration','expiry','expire'],why:'when the URL dies'},
  {accept:['kms:Decrypt','kmsdecrypt'],why:'the permission the request needs on the key'},
  {accept:['X-Amz-Signature','x-amz-signature'],why:'the signature parameter'},
  {accept:['expiration','expiry','expire'],why:'credential expiry binds the URL'}],
 bank:['scope','expiration','session','kms:Decrypt','X-Amz-Signature','X-Amz-Date','presign','expiry']},
ex:'Inside the URL: the credential scope (date, region, service), an expiration timestamp, and — for role-signed URLs — the session token of the signing session. SSE-KMS objects add a requirement at request time: the request must be allowed kms:Decrypt on the key, which the SIGNER grants by having it. The signature rides in X-Amz-Signature; X-Amz-Date is only the signing date. And the fatal detail from earlier in this exam: the URL dies at the credentials expiration, whatever the advertised window says. Seven words, one rule: temporary credentials bound everything they sign.'}
]
/* ================= exam engine (shared) ================= */
var TL={qcm:'QCM',multi:'Multi-select',order:'Order the steps',rank:'Rank by risk',match:'Matching',classify:'Sort into buckets',blank:'Fill the blanks',spot:'Spot the mistake',terminal:'Terminal task',logview:'Log analysis',triage:'Branching scenario'};
var AL={qcm:'CHOOSE ONE',multi:'SELECT ALL THAT APPLY',order:'PUT IN THE RIGHT ORDER',rank:'RANK — MOST CRITICAL FIRST',match:'MATCH EACH ITEM WITH ITS PARTNER',classify:'SORT EVERY ITEM INTO A BUCKET',blank:'FILL THE BLANKS FROM THE WORD BANK',spot:'CLICK THE LINE THAT HAS THE MISTAKE',terminal:'TYPE THE COMMAND',logview:'ANSWER FROM THE LOGS',triage:'CHOOSE THE NEXT ACTION'};

var S={cur:0,order:[],rt:[],left:0,running:false,started:false,done:false,pm:false,pc:false,sent:false,sel:null,drag:null,themes:[]};

function byId(i){return document.getElementById(i)}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t}return r}
function fmt(s){var m=Math.floor(s/60),x=s%60;return(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function p2(n){var x=(Math.round(n*100)/100).toFixed(2);return x.replace(/\.00$/,'')}
function curEx(){return DATA[S.order[S.cur]]}
function curRt(){return S.rt[S.order[S.cur]]}
function newRt(){return{checked:false,skipped:false,hint:false,earned:0,fb:'',snap:'',parts:[],pick:null,picks:[],ord:[],slots:{},bank:[],spot:-1,filter:'',typed:{},hist:[],outs:[],cons:0,tri:0,triPick:{},view:[]}}

function btn(act,label,cls,dis){var b=el('button','btn'+(cls?' '+cls:''),label);b.type='button';b.setAttribute('data-act',act);if(dis)b.disabled=true;return b}
function block(label,cls,html){var d=el('section','blk '+cls);d.innerHTML='<div class="bl">'+label+'</div><div class="bc">'+html+'</div>';return d}

function newRuntime(){S.rt=DATA.map(function(){return newRt()});
 DATA.forEach(function(ex,i){var rt=S.rt[i];
  if(ex.type==='qcm'||ex.type==='multi'){rt.view=shuffle(ex.a.choices.map(function(_,k){return k}))}
  else if(ex.type==='spot'){rt.view=shuffle(ex.a.lines.map(function(_,k){return k}))}
  else if(ex.type==='order'||ex.type==='rank'){rt.ord=shuffle(ex.a.items.map(function(_,k){return k}))}
  else if(ex.type==='match'){rt.bank=shuffle(ex.a.pairs.map(function(_,k){return k}))}
  else if(ex.type==='classify'){rt.bank=shuffle(ex.a.items.map(function(_,k){return k}))}
  else if(ex.type==='blank'){rt.bank=shuffle(ex.a.bank.map(function(_,k){return k}))}
 });
}

function startExam(){
 S.order=shuffle(DATA.map(function(_,i){return i}));
 newRuntime();
 S.cur=0;S.left=CFG.minutes*60;S.running=true;S.started=true;S.done=false;S.pm=false;S.pc=false;S.sent=false;S.sel=null;S.drag=null;
 byId('topbar').style.display='block';
 byId('sevtag').textContent=CFG.severity;
 byId('pausebtn').innerHTML='Pause';
 buildNav();buildThemes();
 renderAll();
 renderClock();updatePauseUI();
 window.scrollTo(0,0);
}

function themeList(){var out=[],seen={};DATA.forEach(function(ex){if(!seen[ex.th]){seen[ex.th]=1;out.push(ex.th)}});return out}
function buildThemes(){S.themes=themeList();var t=byId('themes');
 t.innerHTML=S.themes.map(function(th,ix){
  var m=0;DATA.forEach(function(ex){if(ex.th===th)m++});
  return '<div class="trow"><span class="tname">'+esc(th)+'</span><div class="tbar"><div class="tfill" id="tf'+ix+'"></div></div><span class="tscore" id="ts'+ix+'">0/'+m+'</span></div>';
 }).join('');
 updateThemes();
}
function updateThemes(){if(!S.themes.length)return;S.themes.forEach(function(th,ix){
 var e=0,m=0;DATA.forEach(function(ex,i){if(ex.th!==th)return;var rt=S.rt[i];if(rt.skipped)return;m++;if(rt.checked)e+=rt.earned});
 var f=byId('tf'+ix),s=byId('ts'+ix);if(!f)return;
 f.style.width=(m?Math.round(e/m*100):0)+'%';s.textContent=p2(e)+'/'+m;
})}

function buildNav(){var n=byId('nav');n.innerHTML='';DATA.forEach(function(_,i){var b=el('button','nq',String(i+1));b.type='button';b.setAttribute('data-act','navq');b.setAttribute('data-i',String(i));n.appendChild(b)})}
function refreshNav(){var bs=byId('nav').children;if(!bs.length)return;
 for(var i=0;i<bs.length;i++){var rt=S.rt[S.order[i]];var c='nq';
  if(rt.skipped)c+=' nskip';else if(rt.checked)c+=' ndone';
  if(i===S.cur)c+=' ncur';
  bs[i].className=c;
  var st=rt.skipped?' — skipped':rt.checked?' — answered':' — not answered yet';
  bs[i].setAttribute('title','Exercise '+(i+1)+st);
  bs[i].setAttribute('aria-label','Go to exercise '+(i+1)+st);
 }
}

function renderClock(){var c=byId('clock');c.textContent=fmt(S.left);c.className='clock'+(S.left<=60?' crit':S.left<=300?' lowc':'')}
function updatePauseUI(){var p=byId('pind'),txt=[];
 if(S.pm)txt.push('Paused (manual) — content hidden');
 if(S.pc)txt.push('Timer paused — review mode');
 if(txt.length){p.hidden=false;p.textContent=txt.join(' + ')}else p.hidden=true;
 renderClock();
}
function togglePause(){if(!S.started||S.done)return;S.pm=!S.pm;byId('pausebtn').innerHTML=S.pm?'Resume':'Pause';updatePauseUI();renderQ()}

function tick(){if(!S.running)return;if(S.pm||S.pc)return;S.left--;
 if(S.left<=0){S.left=0;renderClock();finish();return}
 renderClock();
}

function renderTop(){
 var done=0,pts=0,skip=0;
 DATA.forEach(function(_,i){var rt=S.rt[i];if(rt.checked&&!rt.skipped){done++;pts+=rt.earned}if(rt.skipped)skip++});
 byId('score').textContent=p2(pts)+' / '+DATA.length+' pts';
 byId('qpos').textContent='Question '+(S.cur+1)+' of '+DATA.length+(skip?' · '+skip+' skipped':'');
 byId('pfill').style.width=Math.round(done/DATA.length*100)+'%';
 updateThemes();refreshNav();
}
function renderAll(){renderTop();renderQ()}

/* ================= intro screen ================= */
function renderIntro(){
 S.started=false;S.running=false;S.done=false;
 byId('topbar').style.display='none';
 var w=byId('stage');w.innerHTML='';
 var counts={};DATA.forEach(function(ex){counts[ex.type]=(counts[ex.type]||0)+1});
 var typeList=Object.keys(counts).map(function(k){return '<span class="ichip">'+TL[k]+' × '+counts[k]+'</span>'}).join('');
 var khtml=KEYWORDS.map(function(g){return '<div class="kgroup"><h3>'+esc(g.g)+'</h3><div class="kwrap">'+g.k.map(function(x){return '<span class="k">'+esc(x)+'</span>'}).join('')+'</div></div>'}).join('');
 var h='';
 h+='<div class="card intro">';
 h+='<div class="ibadge '+CFG.severity.toLowerCase()+'">'+CFG.severity+' practice exam</div>';
 h+='<h1>'+esc(CFG.title)+'</h1>';
 h+='<p class="ilead">'+esc(CFG.cert)+' · Domain 4 — Identity and Access Management · Task 4.1 — Design, implement, and troubleshoot authentication strategies (Skills 4.1.1 identity solutions, 4.1.2 temporary credentials, 4.1.3 troubleshooting).</p>';
 h+='<div class="ichips">'
   +'<span class="ichip">'+DATA.length+' exercises</span>'
   +'<span class="ichip">'+CFG.minutes+'-minute timer</span>'
   +'<span class="ichip">Pass mark '+CFG.passMark+'%</span>'
   +'<span class="ichip">1 point per exercise</span>'
   +'<span class="ichip">Hint costs 10% of the exercise</span>'
   +'<span class="ichip">Build v3.0</span>'
   +'</div>';
 h+='<h2>'+esc(CFG.severity)+' severity</h2><p>'+esc(CFG.sevText)+'</p>';
 h+='<h2>How this exam works</h2><ul class="howto">'
   +'<li><b>Check</b> validates and locks your answer, shows per-element marks (green ✓ correct, red ✗ wrong, amber ⚠ partial) plus an explanation, and <b>pauses the timer in review mode</b>. The exercise stays visible so you can learn from it. The timer resumes only when you move on with <b>Next</b> or <b>Skip</b>.</li>'
   +'<li><b>Pause</b> is the second, manual pause. It <b>hides the content</b> until you press Resume. Both pause types can stack; the clock only runs when both are cleared.</li>'
   +'<li><b>Skip</b> flags an exercise (amber marker) and moves on. Skipped exercises are <b>excluded from scoring</b> — out of both the points you earn and the total. You can return to them any time before the timer ends.</li>'
   +'<li><b>Partial credit</b>: multi-answer exercises score per correct element. One correct item out of four earns a quarter of the point.</li>'
   +'<li><b>Hint</b> reveals a nudge (never the answer) and costs 10% of that exercise.</li>'
   +'<li>You may navigate back, revise and re-Check any exercise while time remains. When the timer reaches zero the exam submits itself.</li>'
   +'<li>Indicators in this exam are written defanged (for example 10[.]0[.]0[.]1) — a professional habit.</li>'
   +'</ul>';
 h+='<h2>Exercise types in this file</h2><div class="ichips">'+typeList+'</div>';
 h+='<h2>Keywords covered</h2>'+khtml;
 h+='<div class="btnrow"><button class="btn primary" data-act="start" type="button">Start the exam ▶</button></div>';
 h+='</div>';
 w.innerHTML=h;
}
/* ================= question rendering ================= */
var RENDER={};

function renderQ(){
 var ex=curEx(),rt=curRt();
 var w=byId('stage');w.innerHTML='';
 var card=el('div','card');
 card.innerHTML='<div class="chead"><span class="cnum">Exercise '+(S.cur+1)+' / '+DATA.length+'</span><span class="ctags"><span class="tag th">'+esc(ex.th)+'</span><span class="tag tp">'+TL[ex.type]+'</span><span class="tag pt">1 pt'+(rt.hint?' · hint used':'')+'</span></span></div>';
 card.appendChild(block('SCENARIO','scen',ex.sc));
 if(ex.art)card.appendChild(block('ARTIFACT','art','<pre>'+ex.art+'</pre>'));
 if(ex.type==='logview')card.appendChild(logBlock(ex,rt));
 card.appendChild(block('QUESTION','quest',ex.q));
 var ans=el('div','ans');
 ans.innerHTML='<div class="alabel">'+AL[ex.type]+'</div>';
 var ab=el('div','ansbody');ab.id='ansbody';ab.className='ansbody';
 ans.appendChild(ab);
 card.appendChild(ans);
 var br=el('div','btnrow');
 br.appendChild(btn('check','Check','primary'));
 br.appendChild(btn('skip','Skip',''));
 br.appendChild(btn('hint','Hint (-10%)','',rt.hint||rt.checked));
 if(rt.checked)br.appendChild(btn('revise','Revise',''));
 card.appendChild(br);
 var fb=el('div','fb');fb.id='fb';fb.setAttribute('aria-live','polite');
 if(rt.checked)fb.innerHTML=rt.fb;
 card.appendChild(fb);
 var xp=el('div','expl');xp.id='expl';
 if(rt.checked){xp.innerHTML='<div class="eh">EXPLANATION</div>'+ex.ex}else xp.hidden=true;
 card.appendChild(xp);
 var nr=el('div','btnrow');nr.appendChild(btn('next',S.cur===DATA.length-1?'Finish & review ▶':'Next ▶','ghost'));
 card.appendChild(nr);
 if(S.pm){card.classList.add('frozen');card.appendChild(el('div','freeze','<div class="fz"><b>Paused (manual)</b><br>Content is hidden while the exam is paused.<br>Press Resume in the top bar to continue.</div>'))}
 w.appendChild(card);
 rerenderAns();

function rerenderAns(){
 var ex=curEx(),rt=curRt();var ab=byId('ansbody');if(!ab)return;
 ab.className='ansbody'+(rt.checked?' locked':'');
 ab.innerHTML='';
