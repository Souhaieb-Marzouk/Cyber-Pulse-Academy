/* ---- interactions ---- */
function clearSel(){S.sel=null}
function selectChip(chipStr){S.sel=(S.sel&&S.sel.k==='chip'&&S.sel.v===chipStr)?null:{k:'chip',v:chipStr}}
function chipClick(chipElm){
 var ex=curEx(),rt=curRt();
 var v=chipElm.getAttribute('data-chip');
 if(rt.checked)return;
 if(ex.type==='classify'){
  // chip inside a bucket: return to bank
  var i=parseInt(v,10);
  if(rt.slots.hasOwnProperty(i)){delete rt.slots[i];rerenderAns();return}
 }
 selectChip(v);rerenderAns();
}
function placeChipToSlot(chipStr,slotStr){
 var ex=curEx(),rt=curRt();if(rt.checked)return;
 var c=parseInt(chipStr,10),s=parseInt(slotStr,10);
 Object.keys(rt.slots).forEach(function(k){if(rt.slots[k]===c)delete rt.slots[k]});
 rt.slots[s]=c;clearSel();rerenderAns();
}
function placeChipToBucket(chipStr,bucketId){
 var ex=curEx(),rt=curRt();if(rt.checked)return;
 var c=parseInt(chipStr,10);
 rt.slots[c]=bucketId;clearSel();rerenderAns();
}
function slotClick(slotElm){
 var ex=curEx(),rt=curRt();if(rt.checked)return;
 var s=parseInt(slotElm.getAttribute('data-slot'),10);
 if(rt.slots.hasOwnProperty(s)){delete rt.slots[s];rerenderAns();return}
 if(S.sel&&S.sel.k==='chip')placeChipToSlot(S.sel.v,slotElm.getAttribute('data-slot'));
}
function bucketClick(bucketElm){
 var rt=curRt();if(rt.checked)return;
 if(S.sel&&S.sel.k==='chip')placeChipToBucket(S.sel.v,bucketElm.getAttribute('data-bucket'));
}
function lineClick(lineElm){
 var rt=curRt();if(rt.checked)return;
 var v=lineElm.getAttribute('data-line');
 rt.spot=(rt.spot===parseInt(v,10))?null:parseInt(v,10);
 rerenderAns();
}
function moveOrd(mvElm){
 var rt=curRt();if(rt.checked)return;
 var pos=parseInt(mvElm.getAttribute('data-pos'),10);
 var dir=mvElm.getAttribute('data-mv');
 var to=dir==='up'?pos-1:pos+1;
 if(to<0||to>=rt.ord.length)return;
 var t=rt.ord[pos];rt.ord[pos]=rt.ord[to];rt.ord[to]=t;
 rerenderAns();
}
function reordTo(from,to){
 var rt=curRt();if(rt.checked)return;
 if(from===to||isNaN(from)||isNaN(to))return;
 var x=rt.ord.splice(from,1)[0];rt.ord.splice(to,0,x);
 rerenderAns();
}

function runTerm(){
 var ex=curEx(),rt=curRt();if(rt.checked)return;
 var inp=document.querySelector('[data-cmd]');
 if(!inp)return;
 var cmd=(inp.value||'').trim();
 if(!cmd)return;
 rt.typed.cmd='';
 var out='(shell) command recorded — press Check to have it graded.';
 for(var i=rt.cons;i<ex.a.steps.length;i++){
  if(new RegExp(ex.a.steps[i].accept,'i').test(cmd)){out=ex.a.steps[i].out;rt.cons=i+1;break}
 }
 rt.hist.push(cmd);rt.outs.push(out);
 rerenderAns();
 var h=byId('thist');if(h)h.scrollTop=h.scrollHeight;
}
/* ================= validation, scoring, results ================= */
function norm(s){return String(s).toLowerCase().replace(/[\s.\-()\[\]]/g,'')}
function strip(s){return String(s).replace(/<[^>]*>/g,'')}
function bucketLabel(ex,id){var b=null;ex.a.buckets.forEach(function(x){if(x.id===id)b=x});return b?b.label:String(id)}
function termMatch(ex,rt){var ptr=0,res=[];
 ex.a.steps.forEach(function(st){var found=-1;
  for(var j=ptr;j<rt.hist.length;j++){if(new RegExp(st.accept,'i').test(rt.hist[j])){found=j;break}}
  if(found>=0){res.push(found);ptr=found+1}else res.push(-1);
 });
 return res;
}

var CHECK={
 qcm:function(ex,rt){var c=ex.a.correct,pick=rt.pick,ok=pick===c;
  return{e:ok?1:0,parts:[{s:ok?'ok':'bad',n:'Your answer: '+(pick==null?'(nothing selected)':strip(ex.a.choices[pick])),t:ok?'Correct.':'Correct answer: '+strip(ex.a.choices[c])}],snap:pick==null?'(nothing selected)':strip(ex.a.choices[pick])}},
 multi:function(ex,rt){var c=ex.a.correct,parts=[],got=0;
  c.forEach(function(i){var p=rt.picks.indexOf(i)>=0;if(p)got++;
   parts.push({s:p?'ok':'warn',n:(p?'You selected: ':'You missed: ')+strip(ex.a.choices[i]),t:p?'Correct.':'This one was also correct.'})});
  rt.picks.forEach(function(i){if(c.indexOf(i)<0)parts.push({s:'bad',n:'Wrong pick: '+strip(ex.a.choices[i]),t:'A wrong pick earns nothing here, but it does not subtract.'})});
  return{e:c.length?got/c.length:0,parts:parts,snap:rt.picks.length?rt.picks.map(function(i){return strip(ex.a.choices[i])}).join('; '):'(nothing selected)'}},
 order:function(ex,rt){var parts=[],got=0;
  rt.ord.forEach(function(ii,pos){var ok=ii===pos;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Position '+(pos+1)+': '+strip(ex.a.items[ii]),t:ok?'Correct placement.':'Correct: '+strip(ex.a.items[pos])})});
  return{e:got/rt.ord.length,parts:parts,snap:rt.ord.map(function(i){return strip(ex.a.items[i])}).join(' → ')}},
 match:function(ex,rt){var parts=[],got=0;
  ex.a.pairs.forEach(function(p,l){var placed=rt.slots.hasOwnProperty(l)?rt.slots[l]:null,ok=placed===l;if(ok)got++;
   parts.push({s:ok?'ok':(placed==null?'warn':'bad'),n:strip(p[0]),t:ok?'→ '+strip(p[1]):(placed==null?'No partner chosen. Correct: ':'You paired: '+strip(ex.a.pairs[placed][1])+' — correct: ')+strip(p[1])})});
  return{e:got/ex.a.pairs.length,parts:parts,snap:ex.a.pairs.map(function(p,l){return strip(p[0])+' → '+(rt.slots.hasOwnProperty(l)?strip(ex.a.pairs[rt.slots[l]][1]):'—')}).join(' ; ')}},
 classify:function(ex,rt){var parts=[],got=0;
  ex.a.items.forEach(function(it,i){var b=rt.slots[i],ok=b===it.b;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:strip(it.t),t:ok?'→ '+bucketLabel(ex,it.b):(b==null?'Left unsorted. Correct: ':'You sorted into "'+(b!=null?bucketLabel(ex,b):'?')+'" — correct: ')+bucketLabel(ex,it.b)})});
  return{e:got/ex.a.items.length,parts:parts,snap:ex.a.items.map(function(it,i){return strip(it.t)+' → '+(rt.slots[i]!=null?bucketLabel(ex,rt.slots[i]):'—')}).join(' ; ')}},
 blank:function(ex,rt){var parts=[],got=0;
  ex.a.slots.forEach(function(sl,k){var bi=rt.slots[k+1],w=bi!=null?ex.a.bank[bi]:null,ok=false;
   if(w!=null){var nw=norm(w);sl.accept.forEach(function(ac){if(norm(ac)===nw)ok=true})}
   if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Blank '+(k+1)+(w!=null?': '+w:': (empty)'),t:ok?'Correct.':'Correct: '+sl.accept[0]+(sl.why?' — '+sl.why:'')})});
  return{e:got/ex.a.slots.length,parts:parts,snap:ex.a.slots.map(function(_,k){var bi=rt.slots[k+1];return bi!=null?ex.a.bank[bi]:'—'}).join(' | ')}},
 spot:function(ex,rt){var ok=rt.spot===ex.a.bad;
  return{e:ok?1:0,parts:[{s:ok?'ok':'bad',n:rt.spot==null?'You did not click a line.':'You clicked: '+strip(ex.a.lines[rt.spot]),t:ok?'That is the faulty line.':'The faulty line was: '+strip(ex.a.lines[ex.a.bad])}],snap:rt.spot==null?'(nothing selected)':strip(ex.a.lines[rt.spot])}},
 terminal:function(ex,rt){var m=termMatch(ex,rt),parts=[],got=0;
  ex.a.steps.forEach(function(st,i){var ok=m[i]>=0;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Step '+(i+1)+(ok?': accepted.':': not found in your commands.'),t:ok?'':'Expected something like: '+st.ex})});
  return{e:ex.a.steps.length?got/ex.a.steps.length:0,parts:parts,snap:rt.hist.length?rt.hist.join(' ; '):'(no command run)'}},
 logview:function(ex,rt){var parts=[],got=0;
  ex.a.fields.forEach(function(f,k){var v=rt.typed[k]||'',nv=norm(v),ok=false;
   f.accept.forEach(function(ac){var na=norm(ac);if(nv&&nv.indexOf(na)>=0)ok=true});
   if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:f.l,t:ok?'Correct.':'Correct: '+f.accept[0]})});
  return{e:got/ex.a.fields.length,parts:parts,snap:ex.a.fields.map(function(f,k){return rt.typed[k]||'—'}).join(' | ')}},
 triage:function(ex,rt){var parts=[],got=0;
  ex.a.steps.forEach(function(st,k){var p=rt.triPick[k],ok=p===st.c;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Decision '+(k+1)+': '+(p==null?'(no choice)':strip(st.ch[p].t)),t:ok?st.ch[p].o:'Best move: '+strip(st.ch[st.c].t)+' — '+st.ch[st.c].o})});
  return{e:got/ex.a.steps.length,parts:parts,snap:ex.a.steps.map(function(st,k){var p=rt.triPick[k];return p==null?'—':strip(st.ch[p].t)}).join(' | ')}}
};
CHECK.rank=CHECK.order; /* rank shares the positional grader with order */

function applyMarks(ex,rt,ab){
 if(!rt.checked)return;
 var m;
 if(ex.type==='qcm'||ex.type==='multi'){var c=ex.a.correct,multi=ex.type==='multi';
  ab.querySelectorAll('.choice').forEach(function(elm){var ci=parseInt(elm.getAttribute('data-ci'),10);
   var isC=multi?c.indexOf(ci)>=0:ci===c,picked=multi?rt.picks.indexOf(ci)>=0:rt.pick===ci;
   var cls=(isC&&picked)?'ok':(isC&&!picked)?'warn':(!isC&&picked)?'bad':null;
   if(cls){elm.classList.add(cls);var mk=elm.querySelector('.mk');if(mk)mk.textContent=cls==='ok'?'✓':cls==='bad'?'✗':'⚠'}})}
 else if(ex.type==='order'||ex.type==='rank'){
  ab.querySelectorAll('.ord').forEach(function(o){var pos=parseInt(o.getAttribute('data-pos'),10),ok=rt.ord[pos]===pos;
   o.classList.add(ok?'ok':'bad');var mk=o.querySelector('.mk');if(mk)mk.textContent=ok?'✓':'✗'})}
 else if(ex.type==='match'){
  ab.querySelectorAll('.slotbtn').forEach(function(sp){var l=parseInt(sp.getAttribute('data-slot'),10),placed=rt.slots.hasOwnProperty(l),ok=rt.slots[l]===l;
   sp.classList.add(ok?'ok':(placed?'bad':'warn'));sp.innerHTML+='<span class="mk">'+(ok?'✓':(placed?'✗':'⚠'))+'</span>'})}
 else if(ex.type==='classify'){
  ab.querySelectorAll('.bdrop .chip').forEach(function(chEl){var i=parseInt(chEl.getAttribute('data-chip'),10),ok=rt.slots[i]===ex.a.items[i].b;
   chEl.classList.add(ok?'ok':'bad');chEl.innerHTML+=(ok?' ✓':' ✗')});
  ab.querySelectorAll('.chips .chip').forEach(function(chEl){var i=parseInt(chEl.getAttribute('data-chip'),10);
   if(rt.slots[i]!==ex.a.items[i].b){chEl.classList.add('warn');chEl.innerHTML+=' ⚠'}})}
 else if(ex.type==='blank'){
  ab.querySelectorAll('.slotbtn').forEach(function(sp){var k=parseInt(sp.getAttribute('data-slot'),10),bi=rt.slots[k],w=bi!=null?ex.a.bank[bi]:null,ok=false;
   if(w!=null){var nw=norm(w);ex.a.slots[k-1].accept.forEach(function(ac){if(norm(ac)===nw)ok=true})}
   sp.classList.add(ok?'ok':'bad');sp.innerHTML+=(ok?' ✓':' ✗')})}
 else if(ex.type==='spot'){
  ab.querySelectorAll('.sline').forEach(function(sEl){var li=parseInt(sEl.getAttribute('data-line'),10);
   if(rt.spot===li&&li!==ex.a.bad){sEl.classList.add('bad');var mk=sEl.querySelector('.mk');if(mk)mk.textContent='✗'}
   if(li===ex.a.bad){sEl.classList.add('ok');var mk2=sEl.querySelector('.mk');if(mk2)mk2.textContent='✓'}})}
 else if(ex.type==='logview'){
  ab.querySelectorAll('.tf').forEach(function(d,k){var f=ex.a.fields[k],v=rt.typed[k]||'',nv=norm(v),ok=false;
   f.accept.forEach(function(ac){if(nv&&nv.indexOf(norm(ac))>=0)ok=true});
   d.classList.add(ok?'ok':'bad');var mk=d.querySelector('.mk');if(mk)mk.textContent=ok?'✓':'✗'})}
 else if(ex.type==='triage'){
  ab.querySelectorAll('.tristep').forEach(function(d,k){var st=ex.a.steps[k],p=rt.triPick[k];
   d.querySelectorAll('.choice').forEach(function(elm){var inp=elm.querySelector('input');if(!inp)return;var ci=parseInt(inp.value,10);
    var isC=ci===st.c,picked=p===ci;
    var cls=(isC&&picked)?'ok':(isC&&!picked)?'warn':(!isC&&picked)?'bad':null;
    if(cls){elm.classList.add(cls);var mk=elm.querySelector('.mk');if(mk)mk.textContent=cls==='ok'?'✓':cls==='bad'?'✗':'⚠'}})})}
 else if(ex.type==='terminal'){m=termMatch(ex,rt);
  var w=ab.querySelector('.term'),st=el('div');st.style.padding='10px 12px';
  st.innerHTML=ex.a.steps.map(function(sp2,i){var ok=m[i]>=0;
   return '<div class="fp '+(ok?'ok':'bad')+'"><span class="ico">'+(ok?'✓':'✗')+'</span><span>Step '+(i+1)+(ok?' accepted.':' not found. Expected something like: '+esc(sp2.ex))+'</span></div>'}).join('');
  if(w)w.appendChild(st)}
}

function fbHtml(res){
 var h='<div class="fbs">You earned <b>'+p2(res.e)+' / 1</b> points on this exercise.</div>';
 res.parts.forEach(function(p){h+='<div class="fp '+p.s+'"><span class="ico">'+(p.s==='ok'?'✓':p.s==='bad'?'✗':'⚠')+'</span><span><b>'+p.n+'</b>'+(p.t?'<br>'+p.t:'')+'</span></div>'});
 return h;
}

function doCheck(){
 var ex=curEx(),rt=curRt();
 if(rt.checked)return; /* Check validates once — timer stays frozen; use Revise to answer again */
 var res=CHECK[ex.type](ex,rt);
 if(rt.hint)res.e=Math.round(res.e*90)/100;
 rt.earned=res.e;rt.checked=true;rt.skipped=false;rt.parts=res.parts;rt.snap=res.snap;rt.fb=fbHtml(res);
 byId('fb').innerHTML=rt.fb;
 var xp=byId('expl');xp.hidden=false;xp.innerHTML='<div class="eh">EXPLANATION</div>'+ex.ex;
 rerenderAns();
 applyMarks(curEx(),curRt(),byId('ansbody'));
 var abx=byId('ansbody');
 if(abx){abx.querySelectorAll('input,button').forEach(function(x){x.disabled=true});} /* real lock: no keyboard edits in review mode */
 var br=document.querySelector('.btnrow');
 if(br&&!br.querySelector('[data-act="revise"]'))br.appendChild(btn('revise','Revise',''));
 else{var rb=br&&br.querySelector('[data-act="revise"]');if(rb)rb.disabled=false;}
 var hb=document.querySelector('[data-act="hint"]');if(hb)hb.disabled=true;
 S.pc=true;updatePauseUI();renderTop();
 var nb=document.querySelector('[data-act="next"]');if(nb)nb.focus();
}
function doRevise(){
 var rt=curRt();rt.checked=false;rt.earned=0;rt.fb='';rt.snap='';rt.parts=[];
 byId('fb').innerHTML='';byId('expl').hidden=true;
 var rb=document.querySelector('[data-act="revise"]');if(rb)rb.disabled=true;
 var hb=document.querySelector('[data-act="hint"]');if(hb&&!rt.hint)hb.disabled=false;
 rerenderAns();
}
function doHint(){
 var ex=curEx(),rt=curRt();if(rt.hint||rt.checked)return;
 rt.hint=true;
 var h=el('div','hintbox','<b>⚠ Hint — costs 10% of this exercise</b><br>'+esc(ex.hint));
 var fb=byId('fb');fb.parentNode.insertBefore(h,fb);
 var hb=document.querySelector('[data-act="hint"]');if(hb)hb.disabled=true;
}
function doNext(){advance()}
function doSkip(){var rt=curRt();rt.skipped=true;rt.checked=false;advance()}
function advance(){S.pc=false;S.sel=null;
 if(S.cur<DATA.length-1){S.cur++;renderAll();window.scrollTo(0,0)}
 else{renderTop();openConfirm()}
}

function openConfirm(){
 var ans=0,skip=0,un=0;
 S.rt.forEach(function(rt){if(rt.checked&&!rt.skipped)ans++;else if(rt.skipped)skip++;else un++});
 var mb=byId('mbody'),go=byId('mgo');
 if(ans===0){mb.innerHTML='<p class="skipnote">You must answer at least one exercise before submitting. Right now everything is skipped or unanswered.</p>';go.hidden=true}
 else{go.hidden=false;
  mb.innerHTML='<p>Answered: <b>'+ans+' / '+DATA.length+'</b></p>'
  +'<p>Skipped: <b>'+skip+'</b>'+(un?' · Visited but never Checked: <b>'+un+'</b>':'')+'</p>'
  +'<p class="skipnote">Skipped and never-Checked exercises are removed from scoring — from your points AND from the total. You can still go back and Check them first.</p>'}
 byId('modal').hidden=false;
}

function finish(){
 if(S.done)return;S.done=true;S.running=false;S.pm=false;S.pc=false;updatePauseUI();
 var earned=0,ans=0;
 S.rt.forEach(function(rt){if(rt.checked&&!rt.skipped){ans++;earned+=rt.earned}});
 var shown=Math.round(earned*100)/100;
 var rounded=Math.round(earned);
 var percent=ans?Math.round(rounded/ans*100):0;
 var pass=percent>=CFG.passMark;
 renderResults(shown,ans,rounded,percent,pass);
 reportScore(rounded,ans);
}

function renderResults(shown,ans,rounded,percent,pass){
 byId('topbar').style.display='block';byId('pind').hidden=true;
 var w=byId('stage'),h='<div class="card results">';
 h+='<div class="bigpanel '+(pass?'pass':'fail')+'"><div class="pct">'+percent+'%</div>';
 h+='<div class="pverdict">'+(pass?'PASS — well done!':'NOT PASSED — retake required')+'</div>';
 h+='<div class="pnote">'+p2(shown)+' / '+ans+' points · pass mark '+CFG.passMark+'% · '+esc(CFG.severity)+' practice exam</div>';
 h+='<div class="pnote">'+esc(CFG.title)+' — score reported to the site as '+rounded+' / '+ans+'.</div>';
 h+=(pass?'<div class="pnote" style="margin-top:8px">Certificate-style success: you mastered Task 4.1 authentication strategies at '+esc(CFG.severity)+' level.</div>':'<div class="pnote" style="margin-top:8px">Work through the report below, focus on every red and amber item, then press Retake Exam.</div>');
 h+='</div>';
 var full=0,part=0,zero=0,skip=0,un=0;
 S.rt.forEach(function(rt){if(rt.skipped)skip++;else if(!rt.checked)un++;else if(rt.earned>=0.999)full++;else if(rt.earned>0)part++;else zero++});
 h+='<div class="rstats"><span class="rstat">Answered: '+ans+'/'+DATA.length+'</span><span class="rstat">Full: '+full+'</span><span class="rstat">Partial: '+part+'</span><span class="rstat">Zero: '+zero+'</span><span class="rstat">Skipped: '+skip+'</span><span class="rstat">Unanswered: '+un+'</span></div>';
 h+='<h2>Per-theme progress</h2>';
 S.themes.forEach(function(th){
  var e=0,m=0;DATA.forEach(function(ex,i){if(ex.th!==th)return;var rt=S.rt[i];if(rt.skipped)return;m++;if(rt.checked)e+=rt.earned});
  h+='<div class="trow"><span class="tname">'+esc(th)+'</span><div class="tbar"><div class="tfill" style="width:'+(m?Math.round(e/m*100):0)+'%"></div></div><span class="tscore">'+p2(e)+'/'+m+'</span></div>';
 });
 var skiplist=[];S.rt.forEach(function(rt,i){if(rt.skipped||!rt.checked)skiplist.push('#'+(i+1)+' '+esc(DATA[i].t))});
 h+='<h2>Excluded from scoring (skipped or never Checked)</h2>';
 h+=skiplist.length?'<div class="skipnote">Not counted: '+skiplist.join(' · ')+'. Skipped exercises show no score and are left out of the percentage.</div>':'<p class="ilead">None — every exercise was answered.</p>';
 h+='<h2>Detailed report</h2>';
 S.rt.forEach(function(rt,i){
  var ex=DATA[i],lab,pill;
  if(rt.skipped){lab='skipped — excluded';pill='lskip'}
  else if(!rt.checked){lab='not answered — excluded';pill='lmiss'}
  else if(rt.earned>=0.999){lab='full';pill='lfull'}
  else if(rt.earned>0){lab='partial';pill='lpart'}
  else{lab='zero';pill='lzero'}
  h+='<div class="rrow"><details><summary><span class="rnum">#'+(i+1)+'</span><span class="rt1">'+esc(ex.t)+'</span><span class="lab '+pill+'">'+lab+'</span><span class="rp">'+((rt.skipped||!rt.checked)?'excluded':p2(rt.earned)+' / 1')+'</span></summary><div class="rbody">';
  h+='<div class="blk scen"><div class="bl">YOUR ANSWER</div><div class="bc">'+(rt.snap?esc(rt.snap):'—')+'</div></div>';
  h+='<div class="blk quest"><div class="bl">CORRECT ANSWER</div><div class="bc">'+esc(correctText(ex))+'</div></div>';
  h+='<div class="blk"><div class="bl">WHY — READ THIS EVEN FOR SKIPPED ITEMS</div><div class="bc">'+ex.ex+'</div></div>';
  h+='</div></details></div>';
 });
 h+='<div class="btnrow"><button class="btn primary" data-act="retake" type="button">Retake exam (questions and choices are reshuffled)</button></div></div>';
 w.innerHTML=h;window.scrollTo(0,0);
}

function correctText(ex){
 var a=ex.a;
 switch(ex.type){
  case 'qcm':return a.choices[a.correct];
  case 'multi':return a.correct.map(function(i){return a.choices[i]}).join(' ; ');
  case 'order':case 'rank':return a.items.map(function(t,i){return (i+1)+'. '+strip(t)}).join(' | ');
  case 'match':return a.pairs.map(function(p){return strip(p[0])+' → '+strip(p[1])}).join(' | ');
  case 'classify':return a.items.map(function(it){return strip(it.t)+' → '+bucketLabel(ex,it.b)}).join(' | ');
  case 'blank':return a.slots.map(function(s,i){return (i+1)+': '+s.accept[0]}).join(' | ');
  case 'spot':return a.lines[a.bad];
  case 'terminal':return a.steps.map(function(s,i){return (i+1)+': '+s.ex}).join(' then ');
  case 'logview':return a.fields.map(function(f){return f.accept[0]}).join(' | ');
  case 'triage':return a.steps.map(function(s){return strip(s.ch[s.c].t)}).join(' | ');
 }
 return '';
}

/* ================= website integration ================= */
function reportScore(correct,total){
 if(!window.parent||window.parent===window)return; /* opened directly — no site frame to report to */
 var percent=Math.round((correct/Math.max(total,1))*100);
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CFG.topicId,score:correct,total:total,percent:percent,passed:percent>=CFG.passMark},location.origin);
 }catch(e){/* parent unreachable, nothing to report to */}
}
window.addEventListener('message',function(event){
 if(!event.data)return;
 if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
 try{
  var bits=[];
  if(event.data.username)bits.push('Candidate: '+String(event.data.username).slice(0,40));
  if(event.data.country)bits.push(String(event.data.country).slice(0,32));
  if(event.data.batch)bits.push('Batch: '+String(event.data.batch).slice(0,32));
  if(event.data.topicId&&typeof event.data.topicId==='string')S.topicId=event.data.topicId.slice(0,64);
  if(event.data.locale&&typeof event.data.locale==='string')S.locale=event.data.locale.slice(0,32);
  if(bits.length){var e=byId('cand');if(e){e.hidden=false;e.textContent=bits.join(' · ')}}
 }catch(err){}
});

/* ================= event wiring ================= */
document.addEventListener('click',function(ev){
 var t=ev.target;if(!t||!t.closest)return;
 var act=t.closest('[data-act]');
 if(act){var a=act.getAttribute('data-act');
  if(a==='start'){startExam();return}
  if(a==='check'){doCheck();return}
  if(a==='skip'){doSkip();return}
  if(a==='next'){doNext();return}
  if(a==='hint'){doHint();return}
  if(a==='revise'){doRevise();return}
  if(a==='pause'){togglePause();return}
  if(a==='submit'){if(S.started&&!S.done)openConfirm();return}
  if(a==='closeconf'){byId('modal').hidden=true;return}
  if(a==='confirmgo'){byId('modal').hidden=true;finish();return}
  if(a==='retake'){startExam();return}
  if(a==='navq'){if(!S.started||S.done)return;S.cur=parseInt(act.getAttribute('data-i'),10);S.pc=false;S.sel=null;renderAll();window.scrollTo(0,0);return}
  if(a==='run'){runTerm();return}
  return;
 }
 var ch=t.closest('[data-chip]');if(ch){chipClick(ch);return}
 var sl=t.closest('[data-slot]');if(sl){slotClick(sl);return}
 var bu=t.closest('[data-bucket]');if(bu){bucketClick(bu);return}
 var ln=t.closest('[data-line]');if(ln){lineClick(ln);return}
 var mv=t.closest('[data-mv]');if(mv){moveOrd(mv);return}
});
document.addEventListener('change',function(ev){
 var t=ev.target;if(!t||!t.matches)return;
 var ex=curEx(),rt=curRt();if(!rt)return;
 if(t.matches('#ansbody input[type=radio][name^="qc"]')){
  rt.pick=parseInt(t.value,10);
  var lab=t.closest('.choice');
  if(lab){lab.parentNode.querySelectorAll('.choice').forEach(function(e2){e2.classList.remove('selc')});lab.classList.add('selc')}
 }else if(t.matches('#ansbody input[type=checkbox][data-mi]')){
  var v=parseInt(t.getAttribute('data-mi'),10),ix=rt.picks.indexOf(v);
  if(t.checked&&ix<0)rt.picks.push(v);
  if(!t.checked&&ix>=0)rt.picks.splice(ix,1);
  var lb=t.closest('.choice');if(lb)lb.classList.toggle('selc',t.checked);
 }else if(t.matches('input[name^="tri"]')){
  var k=parseInt(t.name.slice(3),10),val=parseInt(t.value,10);
  rt.triPick[k]=val;
  var lb2=t.closest('.choice');
  if(lb2){lb2.parentNode.querySelectorAll('.choice').forEach(function(e2){e2.classList.remove('selc')});lb2.classList.add('selc')}
  if(k===rt.tri&&rt.tri<ex.a.steps.length){rt.tri++;rerenderAns()}
 }
});
document.addEventListener('input',function(ev){
 var t=ev.target;if(!t||!t.matches)return;
 var rt=curRt();if(!rt)return;
 if(t.hasAttribute('data-filt')){rt.filter=t.value;renderLogRows()}
 else if(t.hasAttribute('data-tf')){rt.typed[t.getAttribute('data-tf')]=t.value}
 else if(t.hasAttribute('data-cmd')){rt.typed.cmd=t.value}
});
document.addEventListener('keydown',function(ev){
 var t=ev.target;
 if(t&&t.matches&&t.matches('[data-cmd]')&&ev.key==='Enter'){ev.preventDefault();runTerm()}
});
document.addEventListener('dragstart',function(ev){
 var c=ev.target&&ev.target.closest?ev.target.closest('[data-chip],.ord'):null;if(!c)return;
 if(c.hasAttribute('data-chip'))S.drag={k:'chip',v:c.getAttribute('data-chip')};
 else S.drag={k:'ord',v:c.getAttribute('data-pos')};
 if(ev.dataTransfer){ev.dataTransfer.setData('text/plain','x');ev.dataTransfer.effectAllowed='move'}
});
document.addEventListener('dragover',function(ev){
 if(!S.drag)return;
 if(ev.target&&ev.target.closest&&ev.target.closest('[data-slot],[data-bucket],.ord'))ev.preventDefault();
});
document.addEventListener('drop',function(ev){
 if(!S.drag)return;
 var t=ev.target&&ev.target.closest?ev.target.closest('[data-slot],[data-bucket],.ord'):null;
 if(!t)return;
 ev.preventDefault();
 if(S.drag.k==='chip'){
  if(t.hasAttribute('data-slot'))placeChipToSlot(S.drag.v,t.getAttribute('data-slot'));
  else if(t.hasAttribute('data-bucket'))placeChipToBucket(S.drag.v,t.getAttribute('data-bucket'));
 }else{
  reordTo(parseInt(S.drag.v,10),parseInt(t.getAttribute('data-pos'),10));
 }
 S.drag=null;
});

document.addEventListener('DOMContentLoaded',function(){
 renderIntro();
 setInterval(tick,1000);
});

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
