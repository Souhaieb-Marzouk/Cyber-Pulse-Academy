{id:1,type:'classify',th:'Identity & federation',t:'Who authenticates with what',

 items:[{t:'Operations engineers sign in to the AWS access portal through IAM Identity Center',b:'work'},

q:'What should you check first?',
a:{choices:['The console passwords of the federated IAM users','The SAML audience condition in the role trust policy','The SCP attached to the organization management account','The MFA settings of the IAM users'],correct:1},
ex:'The portal step works, so the IdP, the certificates and the user passwords are all fine. The failure happens at the next hop: AWS uses the assertion to call AssumeRoleWithSAML, and the role trust policy decides if that is allowed. A mismatch in the SAML audience (the SAML:aud condition) or the provider ARN is the classic cause. Federated users have no console passwords, so option one is a dead end. A management-account SCP would not deny member-account role assumptions like this, and MFA settings of IAM users are unrelated to SAML federation.'},

{id:3,type:'match',th:'Identity & federation',t:'IdP integration building blocks',
hint:'One of these is a sync protocol, one is an XML standard, one is a token standard.',
sc:'You are writing the onboarding wiki page for IAM Identity Center at your company. New colleagues keep mixing up the federation terms.',
q:'Match each building block with the sentence that describes it.',
a:{pairs:[['SAML 2.0','XML-based federation standard that corporate IdPs speak'],
 ['OIDC','Token-based federation built on OAuth 2.0, common for apps'],
 ['SCIM','Protocol that syncs users and groups from the IdP into AWS'],
 ['External IdP','System that holds the workforce passwords when you federate'],
 ['Just-in-time provisioning','Creates the IAM Identity Center user on first sign-in'],
 ['Permission set','Template that becomes an IAM role in each assigned account']]},
ex:'SAML 2.0 is the XML standard most corporate identity providers use for single sign-on. OIDC does the same job with tokens and is common for web and mobile apps. SCIM is not about login at all — it keeps users and groups in sync. The external IdP is wherever the workforce password actually lives. Just-in-time provisioning creates the user record on first sign-in so nobody types users in by hand. A permission set is the IAM Identity Center template that turns into a real IAM role in every account you assign it to.'},

{id:4,type:'blank',th:'Identity & federation',t:'Complete the Identity Center setup note',
hint:'Two blanks are about assigning access, one about the directory, one about user sync, one about the URL users open.',
sc:'A colleague documented the IAM Identity Center rollout but left the key terms out. Fill them from the word bank.',
q:'Fill blanks 1 to 5.',
a:{text:'Our identity source is the corporate [[1]], connected to IAM Identity Center. We created a [[2]] called SecurityAuditor that defines what the role can do in each account. We granted access with [[3]] that map the security team to every account where they need to work. User and group objects arrive automatically through [[4]] provisioning from the IdP. Everyone starts at the AWS [[5]] portal URL.',
 slots:[{accept:['Active Directory','ad','managed microsoft ad','activedirectory'],why:'the corporate directory is the identity source'},
  {accept:['permission set','permissionset'],why:'the template of permissions'},
  {accept:['account assignments','accountassignments','assignments'],why:'they map users or groups to accounts'},
  {accept:['SCIM','scim'],why:'the sync protocol'},
  {accept:['access','access'],why:'the AWS access portal is the entry URL'}],
 bank:['Active Directory','permission set','account assignments','SCIM','access','session policy','MFA code']},
ex:'The identity source is where users come from — here the corporate Active Directory. A permission set is the reusable template of permissions; IAM Identity Center turns it into a role inside each account. Account assignments connect a user or group with a permission set and an account. SCIM is the standard that keeps users and groups flowing in from the IdP without manual work. The access portal is the URL where federated users pick an account and role. Session policy and MFA code do not fit any blank here.'},

{id:5,type:'logview',th:'Troubleshooting & detection',t:'Failed console logins last night',
hint:'Count the failures per user and look at where they came from and how they ended.',
sc:'You are the on-call analyst. CloudTrail recorded these ConsoleLogin events overnight. Policy says: internal users sign in with MFA from internal addresses; failures happen, but bursts do not.',
q:'One internal user made a one-off typo. Another account is being attacked — and the last line shows the attack worked. Type the name of the attacked account.',
a:{cols:['Time','Event','User','Source IP','User agent','MFA','Result'],
 rows:[['02:01:11Z','ConsoleLogin','fin-mgr','203[.]0[.]113[.]7','Mozilla/5.0 (Windows NT 10.0) Chrome','No','Failure'],
  ['02:01:29Z','ConsoleLogin','fin-mgr','203[.]0[.]113[.]7','Mozilla/5.0 (Windows NT 10.0) Chrome','No','Failure'],
  ['02:02:04Z','ConsoleLogin','fin-mgr','203[.]0[.]113[.]7','Mozilla/5.0 (Windows NT 10.0) Chrome','No','Failure'],
  ['02:02:40Z','ConsoleLogin','fin-mgr','203[.]0[.]113[.]7','Mozilla/5.0 (Windows NT 10.0) Chrome','No','Failure'],
  ['02:03:18Z','ConsoleLogin','fin-mgr','203[.]0[.]113[.]7','Mozilla/5.0 (Windows NT 10.0) Chrome','No','Failure'],
  ['02:04:02Z','ConsoleLogin','fin-mgr','203[.]0[.]113[.]7','Mozilla/5.0 (Windows NT 10.0) Chrome','No','Success'],
  ['07:59:12Z','ConsoleLogin','dev-sam','10[.]0[.]1[.]44','Mozilla/5.0 (Macintosh) Safari','Yes','Failure'],
  ['07:59:40Z','ConsoleLogin','dev-sam','10[.]0[.]1[.]44','Mozilla/5.0 (Macintosh) Safari','Yes','Success']],
 fields:[{l:'Type the name of the attacked account',accept:['fin-mgr','finmgr']}],filt:'Filter rows'},
ex:'fin-mgr took six guesses from one external address in three minutes and then got in, all without MFA — that is a password guessing attack that succeeded. dev-sam failed once from an internal address with MFA on and succeeded right after: a normal typo. The lesson: a failure burst followed by a success means credentials are now stolen, so treat the account as compromised, force a credential reset and require MFA. Filtering by user or result makes patterns like this easy to see in real log tools.'},

{id:6,type:'multi',th:'MFA & credential policy',t:'MFA facts for IAM Identity Center',
hint:'Think about which MFA methods the built-in directory offers, and what MFA can and cannot change.',
sc:'Your team is writing the MFA policy for IAM Identity Center with its built-in directory. Before publishing, you must separate facts from myths.',
q:'Select ALL statements that are true.',
a:{choices:['The built-in Identity Center directory supports TOTP authenticator apps',
 'It also supports FIDO2 hardware security keys',
 'MFA can be required at every sign-in, or only for new and untrusted devices',
 'SMS text codes are the strongest MFA method available here',
 'When users federate from an external IdP, MFA should be enforced by that IdP',
 'Turning on MFA changes which permissions a user receives'],
 correct:[0,1,2,4],
 w:['TOTP apps are fully supported by the built-in directory.','FIDO2/WebAuthn security keys are the strongest supported option.','Identity Center offers always-on MFA and context-aware MFA (only for new or risky devices).','SMS is the weakest method and is not offered for Identity Center MFA; use TOTP or security keys.','Authentication, including its MFA step, happens at the external IdP; Identity Center only trusts the result.','MFA proves identity. Permissions come from permission sets and policies, never from MFA.']},
ex:'The built-in Identity Center directory supports TOTP apps and FIDO2 security keys, and you can choose always-on or context-aware MFA. SMS is not the strong option — it is the weak one, and it is not part of Identity Center MFA. When the identity source is an external IdP, the MFA check happens there, so the policy belongs on the IdP. MFA never changes permissions; it only proves who is signing in. So the true statements are TOTP, security keys, context-aware MFA, and IdP-side enforcement.'},

{id:7,type:'order',th:'Troubleshooting & detection',t:'Federated user sees no accounts',
hint:'Start with the identity itself, then the assignment, then the permissions, then the org guardrails, then the evidence.',
sc:'A user from the sales team signs in to the IAM Identity Center portal fine, but the account list is empty. Everyone else in the same group is unaffected. You have portal admin rights and a CloudTrail search ready.',
q:'Put the troubleshooting steps in the right order.',
a:{items:['Confirm the user exists and is enabled in the identity source',
 'Confirm an account assignment exists for the user or their group',
 'Confirm the permission set still exists and still has policies attached',
 'Check the SCPs on the target account for a deny',
 'Open CloudTrail and read the exact error event for the failed call']},
ex:'Work from the user outward. First confirm the identity exists in the identity source — if the user was renamed or disabled, nothing else matters. Next check the account assignment, because an empty portal almost always means the user or group is not assigned to the account. Then confirm the permission set is intact, since a deleted permission set breaks assignments. Only then look at SCPs, which deny at organization level. CloudTrail comes last here as confirmation, not first, because the earlier checks take seconds and often solve it.'},

{id:8,type:'spot',th:'Identity & federation',t:'Over-broad cross-account trust',
hint:'Compare the Principal line with what the requirement says.',
sc:'An auditor asked for a role in account 222233334444 that EXACTLY ONE identity can assume: arn:aws:iam::111122223333:user/audit-bot. The ExternalId condition is wanted and correct. Read the trust policy as written.',
q:'Click the line that lets MORE identities than intended assume the role.',
a:{lines:['{',
 '  "Version": "2012-10-17",',
 '  "Statement": [{',
 '    "Effect": "Allow",',
 '    "Principal": {"AWS": "arn:aws:iam::111122223333:root"},',
 '    "Action": "sts:AssumeRole",',
 '    "Condition": {"StringEquals": {"sts:ExternalId": "audit-4f7k"}}',
 '  }]',
 '}'],bad:4},
ex:'The Principal named with :root means the WHOLE account 111122223333, not one user. Any principal in that account that holds sts:AssumeRole permission can take this role, as long as it knows the ExternalId. The requirement was a single user, so the Principal must be the full user ARN. The ExternalId line is fine — it protects against the confused deputy problem. The Version and Action lines are standard. When a trust policy is broader than the requirement, narrow the Principal, not the condition.'},

{id:9,type:'terminal',th:'Temporary credentials',t:'Assume the audit role from the CLI',
hint:'The command family is aws sts assume-role. You need --role-arn, --role-session-name and --duration-seconds. Duration is in seconds.',
sc:'You are on the security jump box. The AWS CLI is configured with your admin profile. The scanning job needs read-only access to account 444455556666 for EXACTLY 15 minutes, under the session name audit-batch, using role ReadOnlyOps.',
q:'Use an aws sts command to assume arn:aws:iam::444455556666:role/ReadOnlyOps with session name audit-batch and a 900-second duration. Expected output shape: Credentials with AccessKeyId, SecretAccessKey, SessionToken and Expiration, plus AssumedRoleUser.',
a:{steps:[{accept:'(?=[\\s\\S]*aws\\s+sts)(?=[\\s\\S]*assume-role)(?=[\\s\\S]*ReadOnlyOps)(?=[\\s\\S]*audit-batch)(?=[\\s\\S]*900)[\\s\\S]*',
 ex:'aws sts assume-role --role-arn arn:aws:iam::444455556666:role/ReadOnlyOps --role-session-name audit-batch --duration-seconds 900',
 out:'{\n  "Credentials": { "AccessKeyId": "ASIA…", "SecretAccessKey": "wJalr…", "SessionToken": "FwoGZXIv…", "Expiration": "2026-10-16T14:15:00Z" },\n  "AssumedRoleUser": { "Arn": "arn:aws:sts::444455556666:assumed-role/ReadOnlyOps/audit-batch" }\n}'}
 ]},
ex:'aws sts assume-role is the command family for taking a role. The three flags that matter are --role-arn (which role), --role-session-name (who the session is, visible in CloudTrail) and --duration-seconds (900 seconds is 15 minutes, and the minimum allowed is 900). The response carries temporary keys: an access key, a secret key and a session token. Those keys expire on their own — that is the point of temporary credentials. A wrong session name would not break access, but it would ruin attribution in CloudTrail later.'},

{id:10,type:'qcm',th:'Temporary credentials',t:'Presigned URL denied on a KMS object',
hint:'Presigning signs a request with existing permissions. It never grants new ones.',
sc:'A data analyst shares a presigned URL for an object in a bucket encrypted with SSE-KMS using a customer managed key. The analyst can download the object fine in the console. Every external recipient of the URL gets 403 AccessDenied.',
q:'What is the most likely cause?',
a:{choices:['The URL was signed in the wrong Region','The signer lacks kms:Decrypt on the customer managed key','Presigned URLs never work with KMS-encrypted objects','KMS shortens every presigned URL to one hour'],correct:1},
ex:'A presigned URL is a request signed with the credentials of the person who created it. At request time, the object needs decrypting, so the SIGNER needs kms:Decrypt on the customer managed key — granting it via the key policy fixes the 403. KMS-encrypted objects work fine with presigned URLs. Region matters for signing, but the analyst downloads fine, so the URL itself is well formed. KMS does not shorten URLs; lifetime is controlled by the signature and the credentials.'},

{id:11,type:'multi',th:'Temporary credentials',t:'STS temporary credential facts',
hint:'Two statements are about what happens when sessions end or tags are passed. Read each verb carefully.',
sc:'You are coaching a junior engineer who keeps getting confused about STS. Quiz time: only true statements survive.',
q:'Select ALL statements that are true.',
a:{choices:['AssumeRoleWithSAML is called without any existing AWS credentials',
 'Temporary credentials can be extended by calling the same API again',
 'A role maximum session duration defaults to 1 hour and can be raised to 12 hours',
 'Passing session tags requires sts:TagSession in the trust policy',
 'GetFederationToken needs an existing role session as its base',
 'GetCallerIdentity only works for principals with admin permissions'],
 correct:[0,2,3],
 w:['The SAML assertion is the proof — no AWS keys are needed for this single call.','Sessions cannot be extended. You assume the role again from trusted credentials; that is role chaining.','The role setting caps every session: 1 hour by default, up to 12 hours if raised.','Without sts:TagSession in the trust policy, an assume-role call that carries tags fails.','GetFederationToken is called with long-term IAM user credentials, not with a role session.','GetCallerIdentity works for any valid credentials — that is exactly why it is great for debugging.']},
ex:'AssumeRoleWithSAML needs no AWS credentials because the signed SAML assertion is the proof of identity. Sessions have a hard lifetime: 1 hour by default, up to 12 hours on the role, and they can never be extended — you chain a new session instead. Passing session tags needs sts:TagSession in the trust policy, or the call is denied. GetFederationToken is a broker API that runs on long-term IAM user credentials. GetCallerIdentity is special: it works for every valid caller, which is why support engineers love it.'},

{id:12,type:'classify',th:'Temporary credentials',t:'Pick the right STS API',
hint:'Match on WHO is calling: another account, a federated employee, an app user, or you debugging your own session.',
sc:'Four help-desk tickets arrived this morning. Each one needs a different STS call. Sort each API into the situation where it belongs.',
q:'Sort the six STS calls into the correct situation buckets.',
a:{buckets:[{id:'role',label:'Role / cross-account use'},{id:'saml',label:'Workforce federation (SAML)'},{id:'web',label:'App or mobile federation (web identity)'},{id:'self',label:'Your own current session'}],
 items:[{t:'AssumeRole',b:'role'},
  {t:'AssumeRoleWithSAML',b:'saml'},
  {t:'AssumeRoleWithWebIdentity',b:'web'},
  {t:'GetSessionToken',b:'self'},
  {t:'GetCallerIdentity',b:'self'},
  {t:'DecodeAuthorizationMessage',b:'self'}]},
ex:'AssumeRole is the workhorse for taking a role from existing credentials — including cross-account. AssumeRoleWithSAML is for workforce federation: the IdP assertion does the authenticating. AssumeRoleWithWebIdentity is the same idea for app users with OIDC tokens from public providers. The self bucket holds the session helpers: GetSessionToken issues MFA-protected credentials for your own IAM user, GetCallerIdentity shows exactly who the current credentials are, and DecodeAuthorizationMessage turns a cryptic AccessDenied into readable text. Choosing the right API starts with asking who is calling.'},

{id:13,type:'blank',th:'MFA & credential policy',t:'Build the MFA-conditioned policy',
hint:'The Effect allows, the condition key checks MFA, the value is the boolean true, the mechanism is MFA, the failure is an AccessDenied.',
sc:'Security wants s3:DeleteBucket to be possible ONLY right after an MFA login. Complete the policy from the word bank.',
q:'Fill blanks 1 to 5 in the policy.',
a:{mono:true,text:'{\n  "Effect": [[1]],\n  "Action": "s3:DeleteBucket",\n  "Resource": "*",\n  "Condition": { "Bool": { "[[2]]": "[[3]]" } }\n}\nThe Bool test is true only when the session was issued right after [[4]] authentication. If the check fails, AWS answers [[5]] and the action is refused.',
 slots:[{accept:['Allow'],why:'this statement grants, with a condition'},
  {accept:['aws:MultiFactorAuthPresent','multifactorauthpresent'],why:'the condition key that tests for MFA'},
  {accept:['true'],why:'the required boolean value'},
  {accept:['MFA','mfa','multi-factor'],why:'multi-factor authentication'},
  {accept:['AccessDenied','accessdenied','access denied'],why:'the error for a denied call'}],
 bank:['true','Allow','aws:MultiFactorAuthPresent','MFA','AccessDenied','false','Deny']},
ex:'The Effect is Allow: the statement grants the action, but only when the Condition passes. The condition key aws:MultiFactorAuthPresent is tested with Bool against true, which means the session must have been created right after an MFA check. When the condition fails, the caller gets AccessDenied — the action is simply refused. Choosing false or Deny here would invert or break the intent. This pattern is the standard way to guard sensitive actions behind MFA.'},

{id:14,type:'triage',th:'Troubleshooting & detection',t:'1 a.m. alert: console login without MFA',
hint:'Verify, scope, contain — in that order. Never destroy evidence while containing.',
sc:'Your SIEM page fires at 01:14: ConsoleLogin Success for IAM user fin-mgr from an unusual country, MFAUsed = No. You have CloudTrail access, IAM admin rights, and a chat channel with the finance team.',
q:'Take the three decisions in order. The next decision unlocks after each choice.',
a:{steps:[
 {p:'What do you do FIRST?',c:0,ch:[
  {t:'Open the CloudTrail ConsoleLogin event and read the full record (IP, user agent, time)',o:'Good move. The raw event confirms whether this is a real sign-in before you act.'},
  {t:'Delete the fin-mgr user immediately',o:'Deleting the user destroys evidence and may break production jobs. Verify first.'},
  {t:'Ask the whole finance team in chat if someone is travelling',o:'Slow. While you wait, a live session keeps working. Verify first.'}]},
 {p:'The event is real: new country, MFAUsed = No, and the session then called ListBuckets. What next?',c:0,ch:[
  {t:'Search CloudTrail for everything that session did, by user, IP and time window',o:'You now know the blast radius before touching anything.'},
  {t:'Enable MFA for fin-mgr and stop there',o:'MFA stops the NEXT login. It tells you nothing about what already happened.'},
  {t:'Rotate the AWS account root password',o:'The root account was not involved. That does not contain this incident.'}]},
 {p:'Containment time. Which action contains best WITHOUT destroying evidence?',c:0,ch:[
  {t:'Deactivate the access keys, force a password reset, attach a deny policy to the user, keep all logs',o:'Access is cut, credentials are rotated, and CloudTrail keeps the full story.'},
  {t:'Delete the CloudTrail trail',o:'That deletes your best evidence. Never do this during an incident.'},
  {t:'Do nothing and wait for the user to answer your email',o:'Delay hands the attacker the whole session window. Contain now.'}]}]},
ex:'The rhythm of incident response is verify, scope, contain. Reading the raw CloudTrail event first stops you from containing a typo. Searching what the session did turns a scary alert into a known blast radius. Containment should cut access — deactivate keys, reset the password, deny the principal — while keeping every log intact. Deleting the user or the trail destroys evidence, and waiting leaves a live session in attacker hands. After containment, MFA gets re-enabled and the review starts.'},

{id:15,type:'match',th:'Troubleshooting & detection',t:'Read the error like an engineer',
hint:'Group them: expired, wrong key, wrong signature, policy deny, user-pool rejection, lost device.',
sc:'The support queue has six authentication errors. Match each error with its real meaning so the team can answer tickets faster.',
q:'Match each error to what it actually means.',
a:{pairs:[['ExpiredToken','The temporary credentials are too old — get fresh ones'],
 ['SignatureDoesNotMatch','The request was signed with the wrong secret key'],
 ['InvalidClientTokenId','The access key id does not exist — typo or deleted key'],
 ['AccessDenied (explicit deny in the message)','An SCP or an explicit deny policy blocked the call'],
 ['NotAuthorizedException (from Cognito)','The user pool rejected the token or credentials'],
 ['MFA challenge keeps failing at the console','The MFA device is out of sync — an admin must reset it']]},
ex:'ExpiredToken is about lifetime: temporary credentials died and new ones are needed. SignatureDoesNotMatch means the signing secret is wrong for that access key. InvalidClientTokenId means the access key id itself does not exist. When a denial message mentions an explicit deny, an SCP or a deny policy is the blocker — look there, not at the role policies. Cognito speaks its own language: NotAuthorizedException means the user pool rejected the credential or token. And a repeating MFA challenge almost always means a lost or desynced device, which only an admin reset fixes.'}

,

{id:16,type:'qcm',th:'Identity & federation',t:'Customers sign in three ways',
hint:'One component handles sign-up, sign-in and federation for app end users.',
sc:'A customer web app must let people sign in with Google, with Facebook, with a corporate SAML IdP, and with locally created accounts. You must pick the component that owns sign-in.',
q:'Which component fits?',
a:{choices:['A Cognito user pool with Google, Facebook and SAML federation enabled','A Cognito identity pool with guest access enabled','IAM Identity Center connected to the corporate IdP','A Simple AD directory with cross-account trust'],correct:0},
ex:'A Cognito user pool is the sign-in box for applications: it holds local accounts AND federates social and SAML providers, then issues tokens. An identity pool does not sign anybody in — it exchanges an existing token for AWS credentials. IAM Identity Center is for the workforce, not for customers. Simple AD is a small directory service and has nothing to do with web federation. The pattern to remember: user pool = who the app users are; identity pool = what AWS they can touch.'},

{id:17,type:'order',th:'App & machine identity',t:'From sign-in to API call',
hint:'Follow one token: issued first, attached second, validated third, claims last.',
sc:'Your team is documenting how a single-page app calls an API behind API Gateway with a Cognito user pool authorizer.',
q:'Put the flow in order.',
a:{items:['User submits credentials (or an IdP code) to the user pool',
 'The user pool verifies them and issues ID, access and refresh tokens',
 'The app attaches the access token to each API call',
 'The API Gateway authorizer checks the token signature (JWKS) and the standard claims',
 'The backend receives verified claims such as sub and cognito:groups']},
ex:'The user pool is the issuer: it verifies the credentials or IdP code and mints three tokens — ID token (who the user is), access token (what they may call), refresh token (how to renew). The app sends the access token with every API call. The authorizer validates the signature using the JWKS public keys and checks expiry, issuer and audience before the request moves on. The backend then trusts the verified claims and never re-checks passwords. When the access token expires, the app silently uses the refresh token to get a new one.'},

{id:18,type:'blank',th:'Temporary credentials',t:'How a presigned URL works',
hint:'The signature is cryptographic, it carries an expiry, the cap is 7 days, credentials can die first, and the signature lives in a query parameter.',
sc:'You are reviewing a runbook paragraph about presigned URLs. Some key words fell out.',
q:'Fill blanks 1 to 5.',
a:{text:'A presigned URL is just a normal object URL plus a [[1]] signature made from the signer credentials and an [[2]] time. With SigV4, the longest allowed lifetime is [[3]] days (604800 seconds). If you sign with temporary role credentials, the URL dies the moment those [[4]] expire — even if the URL looks valid for longer. The signature travels in the [[5]] query parameter; change one character of the URL and it stops working.',
 slots:[{accept:['cryptographic','crypto'],why:'the signature is cryptographic'},
  {accept:['expiration','expiry','expire'],why:'when the URL stops working'},
  {accept:['7','seven'],why:'604800 seconds is 7 days'},
  {accept:['credentials','credential','keys'],why:'the signing credentials bound the URL'},
  {accept:['X-Amz-Signature','x-amz-signature'],why:'the signature query parameter'}],
 bank:['cryptographic','expiration','7','credentials','X-Amz-Signature','30','region']},
ex:'A presigned URL embeds a cryptographic signature computed from the signer credentials and an expiration time. SigV4 caps the lifetime at 7 days — 604800 seconds. The hidden trap: with temporary credentials the URL dies when the credentials die, even if you asked for more days. The signature is carried in X-Amz-Signature, and the URL is brittle: any change breaks it. 30 and region are decoys — there is no 30-day cap, and the region appears in the scope, not as a cap.'},

{id:19,type:'spot',th:'App & machine identity',t:'Unsafe app client settings',
hint:'Where must a client secret never live for a browser app?',
sc:'A security review of a Cognito user pool app client used by a public single-page app produced these findings. One setting is a real problem.',
q:'Click the line with the mistake.',
a:{lines:['App client: shop-web-prod',
 'Auth flows: ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH',
 'Token validity: access 60 min, ID 60 min, refresh 30 days',
 'Client secret: embedded in the browser JavaScript bundle',
 'Allowed callback URLs: hxxps://shop[.]example[.]com/callback'],bad:3},
ex:'A browser app ships its code to every visitor, so anything inside the bundle is public — including a client secret. Public clients must not hold secrets; they use flows designed for it (like SRP or PKCE) instead. The SRP and refresh token flows are fine, the token validity numbers are reasonable, and the callback URL correctly uses hxxps. The fix is to remove the secret from the app client for browser use, or move the exchange to a backend. Secrets in client-side code are effectively published.'},

{id:20,type:'multi',th:'Identity & federation',t:'Directory choice for Identity Center',
hint:'Two options connect to an existing AD; one option cannot; one statement is about how passwords are handled.',
sc:'IAM Identity Center must authenticate the on-prem Active Directory users. The network team refuses to open any new connectivity to AWS. Evaluate each statement as pure fact.',
q:'Select ALL statements that are TRUE.',
a:{choices:['AD Connector proxies sign-ins to the on-prem domain controllers and needs network line of sight to them',
 'Managed Microsoft AD in AWS with a two-way trust to on-prem AD can serve as the identity source',
 'Simple AD is the best identity source when you already run on-prem AD',
 'With the external IdP option, SCIM keeps users and groups synced automatically',
 'When the identity source is Active Directory, AWS stores copies of the passwords'],
 correct:[0,1,3],
 w:['AD Connector is a proxy — it forwards authentication over the network, so ports to the domain controllers must be open.','A Managed Microsoft AD running in AWS with a two-way trust is a valid Identity Center identity source for on-prem users.','Simple AD is a cheap standalone directory and is NOT supported as an Identity Center identity source for your existing domain.','The external IdP path comes with SCIM so users and groups stay synced.','AD never hands out password copies — authentication is forwarded to the domain controllers.']},
ex:'AD Connector is only a proxy: it needs real network line of sight to the domain controllers, which matters here because connectivity is refused. Managed Microsoft AD in AWS with a two-way trust to the on-prem domain is a supported identity source. Simple AD is a standalone budget directory and cannot serve as the identity source for your existing domain. The external IdP option includes SCIM for automatic user and group sync. And AD keeps the passwords — AWS never stores copies when the identity source is Active Directory.'},

{id:21,type:'rank',th:'MFA & credential policy',t:'Rank the auth findings',
hint:'Weigh: live public credentials first, then broad trust, then missing MFA on admins, then exposure windows, then hygiene.',
sc:'An audit of the authentication estate produced six findings. The change window opens tonight and you can only fix things in order.',
q:'Rank the findings from MOST critical to LEAST critical.',
a:{items:['IAM user access keys pasted into a public code repository',
 'Role trust policy that trusts an account root principal with no condition',
 'Admin console users with no MFA',
 '7-day presigned PUT URL to a finance bucket, posted in a public chat',
 'Admin session where the MFA check is 11 hours old (aws:MultiFactorAuthAge 39600)',
 'Password policy that allows 6-character passwords']},
ex:'Live keys in a public repo top the list: anyone can use them right now, no conditions attached. A root-principal trust policy is next — it hands the role to every capable principal in the trusted account. Admins without MFA follow: one phished password from full control. The public 7-day PUT URL is a long open window, but scoped to one action on one bucket. An 11-hour-old MFA check weakens assurance for sensitive work. The short password policy is real hygiene debt, but it needs a password guess first, so it ranks last.'},

{id:22,type:'logview',th:'Troubleshooting & detection',t:'Who keeps failing to assume the role?',
hint:'Filter for AccessDenied, then count per principal. One person failed once and then succeeded.',
sc:'CloudTrail shows AssumeRole events against role DeployOps in account 222233334444. The trust policy has not changed in months.',
q:'One principal failed once and moved on; another KEEPS failing. Type the name of the principal that keeps failing.',
a:{cols:['Time','Event','Principal','Target role','Session name','Result'],
 rows:[['11:02:10Z','AssumeRole','deploy-pipeline','arn:aws:iam::222233334444:role/DeployOps','deploy-881','Success'],
  ['11:05:33Z','AssumeRole','ci-runner','arn:aws:iam::222233334444:role/DeployOps','ci-1','AccessDenied'],
  ['11:06:01Z','AssumeRole','ci-runner','arn:aws:iam::222233334444:role/DeployOps','ci-1','AccessDenied'],
  ['11:09:47Z','AssumeRole','auditor-jane','arn:aws:iam::222233334444:role/DeployOps','audit-7','AccessDenied'],
  ['11:10:12Z','AssumeRole','auditor-jane','arn:aws:iam::222233334444:role/DeployOps','audit-7','Success'],
  ['11:12:29Z','AssumeRole','ci-runner','arn:aws:iam::222233334444:role/DeployOps','ci-1','AccessDenied'],
  ['11:15:50Z','AssumeRole','deploy-pipeline','arn:aws:iam::222233334444:role/DeployOps','deploy-882','Success'],
  ['11:18:03Z','AssumeRole','ci-runner','arn:aws:iam::222233334444:role/DeployOps','ci-2','AccessDenied']],
 fields:[{l:'Type the principal that keeps failing',accept:['ci-runner','cirunner','ci runner']}],filt:'Filter rows'},
ex:'Filter the table for AccessDenied and count: ci-runner fails four times across two session names, while auditor-jane fails once and immediately succeeds — a typo, nothing more. deploy-pipeline only succeeds. A repeating AccessDenied for one caller against an unchanged trust policy points at a mismatch: wrong ExternalId, missing tag permission, or a condition that no longer fits the caller. Attribution tip: if callers set a sourceIdentity at assume time, that field appears in the event and names the true user — here only session names exist. The fix is on the CALLER side config, and the evidence trail is the session name plus timestamps.'},

{id:23,type:'qcm',th:'App & machine identity',t:'The 401 that appears after an hour',
hint:'Access tokens are short on purpose. There is a token designed exactly for this.',
sc:'A single-page app calls API Gateway with a Cognito access token. After roughly one hour, every call returns 401 until the user signs in again. Users are furious.',
q:'What is the right fix?',
a:{choices:['Raise the access token validity to 24 hours','Use the refresh token to mint new access tokens before they expire','Sign users out every 30 minutes on purpose','Send the refresh token instead of the access token'],correct:1},
ex:'Access tokens are short-lived by design — an hour is the Cognito default. The refresh token exists precisely to renew access tokens without bothering the user: the app calls the token endpoint with it before expiry. Stretching the access token to 24 hours breaks the security model: a stolen token stays useful all day. Scheduled sign-outs just move the pain. And the refresh token is not an API credential — the authorizer would reject it. Fix the app flow, not the token lifetime.'},

{id:24,type:'match',th:'App & machine identity',t:'Match the component to its job',
hint:'Two Cognito parts, one EC2 role, one secrets store, one fine-grained authorizer, one workforce SSO.',
sc:'New joiners keep confusing the six identity components. Build the cheat sheet.',
q:'Match each component with its job.',
a:{pairs:[['Cognito user pool','Sign-up and sign-in for app end users; issues JWTs'],
 ['Cognito identity pool','Exchanges app tokens for temporary AWS credentials'],
 ['Instance profile role on EC2','Credentials for code on the instance — no keys stored'],
 ['Secrets Manager','Stores and rotates database credentials for applications'],
 ['Verified Permissions','Fine-grained application decisions from token claims (Cedar)'],
 ['IAM Identity Center','Workforce single sign-on into accounts and business apps']]},
ex:'The user pool is the front door for app users and mints the JWTs. The identity pool sits behind it and turns those tokens into temporary AWS credentials. On EC2, code gets credentials from the instance profile role — never store keys on the box. Secrets Manager holds and rotates things like database passwords. Verified Permissions answers application questions like can this user edit this record using Cedar policies and token claims. IAM Identity Center is the workforce SSO into AWS accounts and business apps. Six components, six different jobs.'},

{id:25,type:'blank',th:'Identity & federation',t:'The SAML console login path',
hint:'The IdP issues an assertion; IAM keeps a provider record; the role trusts it; STS does the exchange.',
sc:'The runbook explains how a federated user reaches the AWS console. Complete the missing words.',
q:'Fill blanks 1 to 4.',
a:{text:'The user signs in at the corporate [[1]] first. The IdP returns a signed SAML [[2]] that names the role the user may take. The browser posts that assertion to the AWS sign-in endpoint. AWS checks the signature against the SAML provider record in IAM, and the role [[3]] policy must trust that provider. When everything matches, AWS runs [[4]] under the hood and the console opens.',
 slots:[{accept:['IdP','idp','identity provider'],why:'where the user authenticates'},
  {accept:['assertion'],why:'the signed SAML document'},
  {accept:['trust'],why:'the trust policy must trust the provider'},
  {accept:['AssumeRoleWithSAML','assumerolewithsaml'],why:'the STS call behind console federation'}],
 bank:['IdP','assertion','trust','AssumeRoleWithSAML','OIDC','Cognito','GetSessionToken']},
ex:'The flow starts at the IdP, where the user types the corporate password. The IdP returns a signed SAML assertion naming the role. AWS validates the assertion against the SAML provider record and the role trust policy must trust that provider — otherwise AccessDenied. Behind the scenes the exchange is the AssumeRoleWithSAML call, which returns the temporary credentials the console uses. OIDC, Cognito and GetSessionToken belong to other flows entirely.'},

{id:26,type:'multi',th:'Temporary credentials',t:'Presigned URL truths and traps',
hint:'Two traps: extending URLs, and policies still applying.',
sc:'Before you approve a data-sharing design that leans on presigned URLs, sanity-check the claims the vendor made.',
q:'Select ALL statements that are TRUE.',
a:{choices:['With SigV4 and long-term credentials, a presigned URL can last up to 7 days',
 'Signed with role credentials, the URL cannot outlive those credentials',
 'You can extend a presigned URL after creating it',
 'An SSE-KMS object needs the signer to hold kms:Decrypt for the URL to work',
 'Presigned URLs bypass bucket policies',
 'You can presign uploads (PUT), not only downloads (GET)'],
 correct:[0,1,3,5],
 w:['604800 seconds — 7 days — is the SigV4 maximum with long-term credentials.','Temporary credentials bound the URL: when they expire, the URL dies with them.','There is no extend operation. You create a NEW URL with fresh credentials.','The request executes with the signer credentials, so kms:Decrypt on the key is required.','Bucket policies are still evaluated at request time; a deny wins.','Presigning works for any action the signer may do, including PUT uploads.']},
ex:'With long-term credentials SigV4 allows up to 7 days; with role credentials the hard rule is that the URL can never outlive the signing credentials. There is no way to extend or renew an existing URL — you mint a new one. For SSE-KMS objects the signer needs kms:Decrypt, because the request runs with signer permissions. Policies still apply at request time, so a bucket policy deny beats the URL. And presigning is not just for GET: PUT uploads are presigned all the time for browser uploads.'},

{id:27,type:'spot',th:'Temporary credentials',t:'Metadata call that fails',
hint:'IMDSv2 wants a token first, then the token on EVERY request that follows.',
sc:'An EC2 instance has IMDSv2 enforced (token required). The startup script below fetches role credentials from instance metadata.',
q:'Click the line that will fail.',
a:{lines:['#!/bin/bash',
 'TOKEN=$(curl -s -X PUT hxxp://169[.]254[.]169[.]254/latest/api/token \\',
 '  -H "X-aws-ec2-metadata-token-ttl-seconds: 300")',
 'ROLE=$(curl -s hxxp://169[.]254[.]169[.]254/latest/meta-data/iam/security-credentials/)',
 'CREDS=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" "hxxp://169[.]254[.]169[.]254/latest/meta-data/iam/security-credentials/$ROLE")'],bad:3},
ex:'With IMDSv2 you first PUT to the token endpoint with a TTL header — line 2 does that correctly. Every following GET must carry the token in the X-aws-ec2-metadata-token header. Line 4 sends no header, so the metadata service answers with 401 and the role name never arrives. Line 5 correctly passes the token. The fix is one -H flag on line 4. This is why scripts written for IMDSv1 break the moment the instance enforces tokens.'},

{id:28,type:'qcm',th:'Troubleshooting & detection',t:'Attributing a federated session',
hint:'The session name is chosen at assume time. For Identity Center, guess what is convenient and unique per user.',
sc:'Users sign in through IAM Identity Center. CloudTrail shows events with userIdentity type AssumedRole and a session name like jane.doe@corp.example.com.',
q:'What does that session name tell you?',
a:{choices:['The session name chosen at assume time — with Identity Center it is the user email','The name of the IAM role that owns the permissions','The access key id of the session','Proof that the session used MFA'],correct:0},
ex:'The session name is whatever the caller passed at assume time. For IAM Identity Center sessions that is the user email, which makes attribution to a human easy: search CloudTrail for the email and you see that person activity. The session name is also the suffix of the principalId after the colon, so both routes find the same events. The role name lives in sessionContext.sessionIssuer, not here. An access key id looks completely different. And MFA facts are in the mfaAuthenticated attribute — never infer them from a name. Attribution starts with knowing which field holds which truth.'},

{id:29,type:'multi',th:'App & machine identity',t:'Cognito NotAuthorizedException after a deploy',
hint:'Two options are config mismatches from the new build; one is about a user that no longer exists; two are nonsense.',
sc:'After a front-end deploy, some users get NotAuthorizedException from the user pool. Others work fine. The backend did not change.',
q:'Select ALL plausible causes.',
a:{choices:['The app client id or secret sent by the new build is wrong',
 'The app now points at a different user pool (for example staging)',
 'The user was deleted from the pool, and an old token is still in use',
 'Cognito user pools require IAM access keys for every sign-in',
 'The user pool was moved into a private VPC subnet'],
 correct:[0,1,2],
 w:['A wrong client id or secret makes the pool reject the app — classic after a deploy.','Pointing the build at another pool (staging instead of production) gives exactly this error for everyone in the wrong environment.','Deleted users with still-cached tokens get rejected on the next authenticated call.','User pools issue their own tokens; IAM access keys play no part in user pool sign-in.','User pools are a managed multi-tenant service — there is no such setting as moving one into your VPC.']},
ex:'A wrong app client id or secret and a build aimed at the wrong pool are the two classic deploy mistakes — both produce NotAuthorizedException. A deleted user whose app still presents an old token is also rejected. IAM access keys are irrelevant to user pool sign-in; the pool issues its own JWTs. And you cannot move a user pool into a VPC subnet — it is a managed service. Troubleshooting order: compare the pool id and client id in the build with production first.'},

{id:30,type:'order',th:'Troubleshooting & detection',t:'Stolen temporary credentials: full chain',
hint:'The story runs: leak, use, limited blast radius, evidence, block, and let time finish the job.',
sc:'Dual-perspective exercise. Walk the whole life of one stolen role session — first the attacker steps, then the blue-team answers.',
q:'Put the six events in the order they happen.',
a:{items:['Attacker reads temporary keys from a leaked CI build log',
 'Attacker calls STS with the stolen session from a new network',
 'The role permissions limit what the attacker can reach',
 'CloudTrail records every call under the same role session name',
 'Blue team notices the new source IP and blocks the role with an SCP deny',
 'Blue team rotates the source credentials; the session dies at its expiry time']},
ex:'The chain starts with the leak: temporary keys echoed into a public build log. The attacker uses them via STS from their own network. Whatever the role may do bounds the damage — permissions are the real blast radius. Every call lands in CloudTrail under one session name, which is the thread blue team pulls. A temporary session cannot be revoked directly, so the practical containment is an SCP deny for the role, then rotating the source credentials. Finally, time finishes the job: the session expires by itself. Lesson: never echo credentials into logs, and always give CI roles minimum permissions.'}
]

var TL={qcm:'QCM',multi:'Multi-select',order:'Order the steps',rank:'Rank by risk',match:'Matching',classify:'Sort into buckets',blank:'Fill the blanks',spot:'Spot the mistake',terminal:'Terminal task',logview:'Log analysis',triage:'Branching scenario'};
var AL={qcm:'CHOOSE ONE',multi:'SELECT ALL THAT APPLY',order:'PUT IN THE RIGHT ORDER',rank:'RANK — MOST CRITICAL FIRST',match:'MATCH EACH ITEM WITH ITS PARTNER',classify:'SORT EVERY ITEM INTO A BUCKET',blank:'FILL THE BLANKS FROM THE WORD BANK',spot:'CLICK THE LINE THAT HAS THE MISTAKE',terminal:'TYPE THE COMMAND',logview:'ANSWER FROM THE LOGS',triage:'CHOOSE THE NEXT ACTION'};

var S={cur:0,order:[],rt:[],left:0,running:false,started:false,done:false,pm:false,pc:false,sent:false,sel:null,drag:null,themes:[]};

function byId(i){return document.getElementById(i)}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function shuffle(a){var r=a.slice(),i,j,t;for(i=r.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=r[i];r[i]=r[j];r[j]=t}return r}
function fmt(s){var m=Math.floor(s/60),x=s%60;return(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function p2(n){var x=(Math.round(n*100)/100).toFixed(2);return x.replace(/\.00$/,'')}
function curEx(){return DATA[S.order[S.cur]]}
function curRt(){return S.rt[S.order[S.cur]]}
function newRt(){return{checked:false,skipped:false,hint:false,earned:0,fb:'',snap:'',parts:[],pick:null,picks:[],ord:[],slots:{},bank:[],spot:-1,filter:'',typed:{},hist:[],outs:[],cons:0,tri:0,triPick:{},view:[]}}

function btn(act,label,cls,dis){var b=el('button','btn'+(cls?' '+cls:''),label);b.type='button';b.setAttribute('data-act',act);if(dis)b.disabled=true;return b}
function block(label,cls,html){var d=el('section','blk '+cls);d.innerHTML='<div class="bl">'+label+'</div><div class="bc">'+html+'</div>';return d}

function newRuntime(){S.rt=DATA.map(function(){return newRt()});
 DATA.forEach(function(ex,i){var rt=S.rt[i];
  if(ex.type==='qcm'||ex.type==='multi'){rt.view=shuffle(ex.a.choices.map(function(_,k){return k}))}
  else if(ex.type==='spot'){rt.view=shuffle(ex.a.lines.map(function(_,k){return k}))}
  else if(ex.type==='order'||ex.type==='rank'){rt.ord=shuffle(ex.a.items.map(function(_,k){return k}))}
  else if(ex.type==='match'){rt.bank=shuffle(ex.a.pairs.map(function(_,k){return k}))}
  else if(ex.type==='classify'){rt.bank=shuffle(ex.a.items.map(function(_,k){return k}))}
  else if(ex.type==='blank'){rt.bank=shuffle(ex.a.bank.map(function(_,k){return k}))}
 });
}

function startExam(){
 S.order=shuffle(DATA.map(function(_,i){return i}));
 newRuntime();
 S.cur=0;S.left=CFG.minutes*60;S.running=true;S.started=true;S.done=false;S.pm=false;S.pc=false;S.sent=false;S.sel=null;S.drag=null;
 byId('topbar').style.display='block';
 byId('sevtag').textContent=CFG.severity;
 byId('pausebtn').innerHTML='Pause';
 buildNav();buildThemes();
 renderAll();
 renderClock();updatePauseUI();
 window.scrollTo(0,0);
}

function themeList(){var out=[],seen={};DATA.forEach(function(ex){if(!seen[ex.th]){seen[ex.th]=1;out.push(ex.th)}});return out}
function buildThemes(){S.themes=themeList();var t=byId('themes');
 t.innerHTML=S.themes.map(function(th,ix){
  var m=0;DATA.forEach(function(ex){if(ex.th===th)m++});
  return '<div class="trow"><span class="tname">'+esc(th)+'</span><div class="tbar"><div class="tfill" id="tf'+ix+'"></div></div><span class="tscore" id="ts'+ix+'">0/'+m+'</span></div>';
 }).join('');
 updateThemes();
}
function updateThemes(){if(!S.themes.length)return;S.themes.forEach(function(th,ix){
 var e=0,m=0;DATA.forEach(function(ex,i){if(ex.th!==th)return;var rt=S.rt[i];if(rt.skipped)return;m++;if(rt.checked)e+=rt.earned});
 var f=byId('tf'+ix),s=byId('ts'+ix);if(!f)return;
 f.style.width=(m?Math.round(e/m*100):0)+'%';s.textContent=p2(e)+'/'+m;
})}

function buildNav(){var n=byId('nav');n.innerHTML='';DATA.forEach(function(_,i){var b=el('button','nq',String(i+1));b.type='button';b.setAttribute('data-act','navq');b.setAttribute('data-i',String(i));n.appendChild(b)})}
function refreshNav(){var bs=byId('nav').children;if(!bs.length)return;
 for(var i=0;i<bs.length;i++){var rt=S.rt[S.order[i]];var c='nq';
  if(rt.skipped)c+=' nskip';else if(rt.checked)c+=' ndone';
  if(i===S.cur)c+=' ncur';
  bs[i].className=c;
  var st=rt.skipped?' — skipped':rt.checked?' — answered':' — not answered yet';
  bs[i].setAttribute('title','Exercise '+(i+1)+st);
  bs[i].setAttribute('aria-label','Go to exercise '+(i+1)+st);
 }
}

function renderClock(){var c=byId('clock');c.textContent=fmt(S.left);c.className='clock'+(S.left<=60?' crit':S.left<=300?' lowc':'')}
function updatePauseUI(){var p=byId('pind'),txt=[];
 if(S.pm)txt.push('Paused (manual) — content hidden');
 if(S.pc)txt.push('Timer paused — review mode');
 if(txt.length){p.hidden=false;p.textContent=txt.join(' + ')}else p.hidden=true;
 renderClock();
}
function togglePause(){if(!S.started||S.done)return;S.pm=!S.pm;byId('pausebtn').innerHTML=S.pm?'Resume':'Pause';updatePauseUI();renderQ()}

function tick(){if(!S.running)return;if(S.pm||S.pc)return;S.left--;
 if(S.left<=0){S.left=0;renderClock();finish();return}
 renderClock();
}

function renderTop(){
 var done=0,pts=0,skip=0;
 DATA.forEach(function(_,i){var rt=S.rt[i];if(rt.checked&&!rt.skipped){done++;pts+=rt.earned}if(rt.skipped)skip++});
 byId('score').textContent=p2(pts)+' / '+DATA.length+' pts';
 byId('qpos').textContent='Question '+(S.cur+1)+' of '+DATA.length+(skip?' · '+skip+' skipped':'');
 byId('pfill').style.width=Math.round(done/DATA.length*100)+'%';
 updateThemes();refreshNav();
}
function renderAll(){renderTop();renderQ()}

/* ================= intro screen ================= */

 S.started=false;S.running=false;S.done=false;
 byId('topbar').style.display='none';
 var w=byId('stage');w.innerHTML='';
 var counts={};DATA.forEach(function(ex){counts[ex.type]=(counts[ex.type]||0)+1});
 var typeList=Object.keys(counts).map(function(k){return '<span class="ichip">'+TL[k]+' × '+counts[k]+'</span>'}).join('');
 var khtml=KEYWORDS.map(function(g){return '<div class="kgroup"><h3>'+esc(g.g)+'</h3><div class="kwrap">'+g.k.map(function(x){return '<span class="k">'+esc(x)+'</span>'}).join('')+'</div></div>'}).join('');
 var h='';
 h+='<div class="card intro">';
 h+='<div class="ibadge '+CFG.severity.toLowerCase()+'">'+CFG.severity+' practice exam</div>';
 h+='<h1>'+esc(CFG.title)+'</h1>';
 h+='<p class="ilead">'+esc(CFG.cert)+' · Domain 4 — Identity and Access Management · Task 4.1 — Design, implement, and troubleshoot authentication strategies (Skills 4.1.1 identity solutions, 4.1.2 temporary credentials, 4.1.3 troubleshooting).</p>';
 h+='<div class="ichips">'
   +'<span class="ichip">'+DATA.length+' exercises</span>'
   +'<span class="ichip">'+CFG.minutes+'-minute timer</span>'
   +'<span class="ichip">Pass mark '+CFG.passMark+'%</span>'
   +'<span class="ichip">1 point per exercise</span>'
   +'<span class="ichip">Hint costs 10% of the exercise</span>'
   +'<span class="ichip">Build v3.0</span>'
   +'</div>';
 h+='<h2>'+esc(CFG.severity)+' severity</h2><p>'+esc(CFG.sevText)+'</p>';
 h+='<h2>How this exam works</h2><ul class="howto">'
   +'<li><b>Check</b> validates and locks your answer, shows per-element marks (green ✓ correct, red ✗ wrong, amber ⚠ partial) plus an explanation, and <b>pauses the timer in review mode</b>. The exercise stays visible so you can learn from it. The timer resumes only when you move on with <b>Next</b> or <b>Skip</b>.</li>'

   +'<li><b>Skip</b> flags an exercise (amber marker) and moves on. Skipped exercises are <b>excluded from scoring</b> — out of both the points you earn and the total. You can return to them any time before the timer ends.</li>'
   +'<li><b>Partial credit</b>: multi-answer exercises score per correct element. One correct item out of four earns a quarter of the point.</li>'
   +'<li><b>Hint</b> reveals a nudge (never the answer) and costs 10% of that exercise.</li>'
   +'<li>You may navigate back, revise and re-Check any exercise while time remains. When the timer reaches zero the exam submits itself.</li>'
   +'<li>Indicators in this exam are written defanged (for example 10[.]0[.]0[.]1) — a professional habit.</li>'
   +'</ul>';
 h+='<h2>Exercise types in this file</h2><div class="ichips">'+typeList+'</div>';
 h+='<h2>Keywords covered</h2>'+khtml;
 h+='<div class="btnrow"><button class="btn primary" data-act="start" type="button">Start the exam ▶</button></div>';

 w.innerHTML=h;
}

var RENDER={};

function renderQ(){
 var ex=curEx(),rt=curRt();
 var w=byId('stage');w.innerHTML='';
 var card=el('div','card');
 card.innerHTML='<div class="chead"><span class="cnum">Exercise '+(S.cur+1)+' / '+DATA.length+'</span><span class="ctags"><span class="tag th">'+esc(ex.th)+'</span><span class="tag tp">'+TL[ex.type]+'</span><span class="tag pt">1 pt'+(rt.hint?' · hint used':'')+'</span></span></div>';
 card.appendChild(block('SCENARIO','scen',ex.sc));
 if(ex.art)card.appendChild(block('ARTIFACT','art','<pre>'+ex.art+'</pre>'));
 if(ex.type==='logview')card.appendChild(logBlock(ex,rt));
 card.appendChild(block('QUESTION','quest',ex.q));
 var ans=el('div','ans');
 ans.innerHTML='<div class="alabel">'+AL[ex.type]+'</div>';
 var ab=el('div','ansbody');ab.id='ansbody';ab.className='ansbody';
 ans.appendChild(ab);
 card.appendChild(ans);
 var br=el('div','btnrow');
 br.appendChild(btn('check','Check','primary'));
 br.appendChild(btn('skip','Skip',''));
 br.appendChild(btn('hint','Hint (-10%)','',rt.hint||rt.checked));
 if(rt.checked)br.appendChild(btn('revise','Revise',''));
 card.appendChild(br);
 var fb=el('div','fb');fb.id='fb';fb.setAttribute('aria-live','polite');
 if(rt.checked)fb.innerHTML=rt.fb;

 if(rt.checked){xp.innerHTML='<div class="eh">EXPLANATION</div>'+ex.ex}else xp.hidden=true;

 var nr=el('div','btnrow');nr.appendChild(btn('next',S.cur===DATA.length-1?'Finish & review ▶':'Next ▶','ghost'));

 w.appendChild(card);

function rerenderAns(){
 var ex=curEx(),rt=curRt();var ab=byId('ansbody');if(!ab)return;

function logBlock(ex,rt){
 var d=el('section','blk logblk');
 d.innerHTML='<div class="bl">LOG DATA — filter box works like a search bar</div>'
  +'<div class="logtools"><input type="text" data-filt="1" value="'+esc(rt.filter)+'" placeholder="Type to filter rows (text contains)…" aria-label="Filter log rows"><span class="logcount" id="logcount"></span></div>'
  +'<div class="tscroll"><table class="log" aria-label="Log events"><thead><tr>'+ex.a.cols.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody id="logbody"></tbody></table></div>';
 renderLogRowsInto(d.querySelector('#logbody'),d.querySelector('#logcount'),ex,rt);

function clearSel(){S.sel=null}

function chipClick(chipElm){
 var ex=curEx(),rt=curRt();

 if(rt.checked)return;
 if(ex.type==='classify'){
  // chip inside a bucket: return to bank
  var i=parseInt(v,10);

}
function placeChipToSlot(chipStr,slotStr){
 var ex=curEx(),rt=curRt();if(rt.checked)return;

}

function runTerm(){
 var ex=curEx(),rt=curRt();if(rt.checked)return;
 var inp=document.querySelector('[data-cmd]');
 if(!inp)return;
 var cmd=(inp.value||'').trim();
 if(!cmd)return;
 rt.typed.cmd='';
 var out='(shell) command recorded — press Check to have it graded.';
 for(var i=rt.cons;i<ex.a.steps.length;i++){
  if(new RegExp(ex.a.steps[i].accept,'i').test(cmd)){out=ex.a.steps[i].out;rt.cons=i+1;break}
 }
 rt.hist.push(cmd);rt.outs.push(out);
 rerenderAns();
 var h=byId('thist');if(h)h.scrollTop=h.scrollHeight;
}
/* ================= validation, scoring, results ================= */
function norm(s){return String(s).toLowerCase().replace(/[\s.\-()\[\]]/g,'')}
function strip(s){return String(s).replace(/<[^>]*>/g,'')}
function bucketLabel(ex,id){var b=null;ex.a.buckets.forEach(function(x){if(x.id===id)b=x});return b?b.label:String(id)}
function termMatch(ex,rt){var ptr=0,res=[];
 ex.a.steps.forEach(function(st){var found=-1;
  for(var j=ptr;j<rt.hist.length;j++){if(new RegExp(st.accept,'i').test(rt.hist[j])){found=j;break}}
  if(found>=0){res.push(found);ptr=found+1}else res.push(-1);
 });
 return res;
}

var CHECK={
 qcm:function(ex,rt){var c=ex.a.correct,pick=rt.pick,ok=pick===c;
  return{e:ok?1:0,parts:[{s:ok?'ok':'bad',n:'Your answer: '+(pick==null?'(nothing selected)':strip(ex.a.choices[pick])),t:ok?'Correct.':'Correct answer: '+strip(ex.a.choices[c])}],snap:pick==null?'(nothing selected)':strip(ex.a.choices[pick])}},
 multi:function(ex,rt){var c=ex.a.correct,parts=[],got=0;
  c.forEach(function(i){var p=rt.picks.indexOf(i)>=0;if(p)got++;
   parts.push({s:p?'ok':'warn',n:(p?'You selected: ':'You missed: ')+strip(ex.a.choices[i]),t:p?'Correct.':'This one was also correct.'})});
  rt.picks.forEach(function(i){if(c.indexOf(i)<0)parts.push({s:'bad',n:'Wrong pick: '+strip(ex.a.choices[i]),t:'A wrong pick earns nothing here, but it does not subtract.'})});
  return{e:c.length?got/c.length:0,parts:parts,snap:rt.picks.length?rt.picks.map(function(i){return strip(ex.a.choices[i])}).join('; '):'(nothing selected)'}},
 order:function(ex,rt){var parts=[],got=0;
  rt.ord.forEach(function(ii,pos){var ok=ii===pos;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Position '+(pos+1)+': '+strip(ex.a.items[ii]),t:ok?'Correct placement.':'Correct: '+strip(ex.a.items[pos])})});
  return{e:got/rt.ord.length,parts:parts,snap:rt.ord.map(function(i){return strip(ex.a.items[i])}).join(' → ')}},
 match:function(ex,rt){var parts=[],got=0;
  ex.a.pairs.forEach(function(p,l){var placed=rt.slots.hasOwnProperty(l)?rt.slots[l]:null,ok=placed===l;if(ok)got++;
   parts.push({s:ok?'ok':(placed==null?'warn':'bad'),n:strip(p[0]),t:ok?'→ '+strip(p[1]):(placed==null?'No partner chosen. Correct: ':'You paired: '+strip(ex.a.pairs[placed][1])+' — correct: ')+strip(p[1])})});
  return{e:got/ex.a.pairs.length,parts:parts,snap:ex.a.pairs.map(function(p,l){return strip(p[0])+' → '+(rt.slots.hasOwnProperty(l)?strip(ex.a.pairs[rt.slots[l]][1]):'—')}).join(' ; ')}},
 classify:function(ex,rt){var parts=[],got=0;
  ex.a.items.forEach(function(it,i){var b=rt.slots[i],ok=b===it.b;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:strip(it.t),t:ok?'→ '+bucketLabel(ex,it.b):(b==null?'Left unsorted. Correct: ':'You sorted into "'+(b!=null?bucketLabel(ex,b):'?')+'" — correct: ')+bucketLabel(ex,it.b)})});
  return{e:got/ex.a.items.length,parts:parts,snap:ex.a.items.map(function(it,i){return strip(it.t)+' → '+(rt.slots[i]!=null?bucketLabel(ex,rt.slots[i]):'—')}).join(' ; ')}},
 blank:function(ex,rt){var parts=[],got=0;
  ex.a.slots.forEach(function(sl,k){var bi=rt.slots[k+1],w=bi!=null?ex.a.bank[bi]:null,ok=false;
   if(w!=null){var nw=norm(w);sl.accept.forEach(function(ac){if(norm(ac)===nw)ok=true})}
   if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Blank '+(k+1)+(w!=null?': '+w:': (empty)'),t:ok?'Correct.':'Correct: '+sl.accept[0]+(sl.why?' — '+sl.why:'')})});
  return{e:got/ex.a.slots.length,parts:parts,snap:ex.a.slots.map(function(_,k){var bi=rt.slots[k+1];return bi!=null?ex.a.bank[bi]:'—'}).join(' | ')}},
 spot:function(ex,rt){var ok=rt.spot===ex.a.bad;
  return{e:ok?1:0,parts:[{s:ok?'ok':'bad',n:rt.spot==null?'You did not click a line.':'You clicked: '+strip(ex.a.lines[rt.spot]),t:ok?'That is the faulty line.':'The faulty line was: '+strip(ex.a.lines[ex.a.bad])}],snap:rt.spot==null?'(nothing selected)':strip(ex.a.lines[rt.spot])}},
 terminal:function(ex,rt){var m=termMatch(ex,rt),parts=[],got=0;
  ex.a.steps.forEach(function(st,i){var ok=m[i]>=0;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Step '+(i+1)+(ok?': accepted.':': not found in your commands.'),t:ok?'':'Expected something like: '+st.ex})});
  return{e:ex.a.steps.length?got/ex.a.steps.length:0,parts:parts,snap:rt.hist.length?rt.hist.join(' ; '):'(no command run)'}},
 logview:function(ex,rt){var parts=[],got=0;
  ex.a.fields.forEach(function(f,k){var v=rt.typed[k]||'',nv=norm(v),ok=false;
   f.accept.forEach(function(ac){var na=norm(ac);if(nv&&nv.indexOf(na)>=0)ok=true});
   if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:f.l,t:ok?'Correct.':'Correct: '+f.accept[0]})});
  return{e:got/ex.a.fields.length,parts:parts,snap:ex.a.fields.map(function(f,k){return rt.typed[k]||'—'}).join(' | ')}},
 triage:function(ex,rt){var parts=[],got=0;
  ex.a.steps.forEach(function(st,k){var p=rt.triPick[k],ok=p===st.c;if(ok)got++;
   parts.push({s:ok?'ok':'bad',n:'Decision '+(k+1)+': '+(p==null?'(no choice)':strip(st.ch[p].t)),t:ok?st.ch[p].o:'Best move: '+strip(st.ch[st.c].t)+' — '+st.ch[st.c].o})});
  return{e:got/ex.a.steps.length,parts:parts,snap:ex.a.steps.map(function(st,k){var p=rt.triPick[k];return p==null?'—':strip(st.ch[p].t)}).join(' | ')}}
};
CHECK.rank=CHECK.order; /* rank shares the positional grader with order */

function applyMarks(ex,rt,ab){
 if(!rt.checked)return;
 var m;
 if(ex.type==='qcm'||ex.type==='multi'){var c=ex.a.correct,multi=ex.type==='multi';
  ab.querySelectorAll('.choice').forEach(function(elm){var ci=parseInt(elm.getAttribute('data-ci'),10);
   var isC=multi?c.indexOf(ci)>=0:ci===c,picked=multi?rt.picks.indexOf(ci)>=0:rt.pick===ci;
   var cls=(isC&&picked)?'ok':(isC&&!picked)?'warn':(!isC&&picked)?'bad':null;
   if(cls){elm.classList.add(cls);var mk=elm.querySelector('.mk');if(mk)mk.textContent=cls==='ok'?'✓':cls==='bad'?'✗':'⚠'}})}
 else if(ex.type==='order'||ex.type==='rank'){
  ab.querySelectorAll('.ord').forEach(function(o){var pos=parseInt(o.getAttribute('data-pos'),10),ok=rt.ord[pos]===pos;
   o.classList.add(ok?'ok':'bad');var mk=o.querySelector('.mk');if(mk)mk.textContent=ok?'✓':'✗'})}
 else if(ex.type==='match'){
  ab.querySelectorAll('.slotbtn').forEach(function(sp){var l=parseInt(sp.getAttribute('data-slot'),10),placed=rt.slots.hasOwnProperty(l),ok=rt.slots[l]===l;
   sp.classList.add(ok?'ok':(placed?'bad':'warn'));sp.innerHTML+='<span class="mk">'+(ok?'✓':(placed?'✗':'⚠'))+'</span>'})}
 else if(ex.type==='classify'){
  ab.querySelectorAll('.bdrop .chip').forEach(function(chEl){var i=parseInt(chEl.getAttribute('data-chip'),10),ok=rt.slots[i]===ex.a.items[i].b;
   chEl.classList.add(ok?'ok':'bad');chEl.innerHTML+=(ok?' ✓':' ✗')});
  ab.querySelectorAll('.chips .chip').forEach(function(chEl){var i=parseInt(chEl.getAttribute('data-chip'),10);
   if(rt.slots[i]!==ex.a.items[i].b){chEl.classList.add('warn');chEl.innerHTML+=' ⚠'}})}
 else if(ex.type==='blank'){
  ab.querySelectorAll('.slotbtn').forEach(function(sp){var k=parseInt(sp.getAttribute('data-slot'),10),bi=rt.slots[k],w=bi!=null?ex.a.bank[bi]:null,ok=false;
   if(w!=null){var nw=norm(w);ex.a.slots[k-1].accept.forEach(function(ac){if(norm(ac)===nw)ok=true})}
   sp.classList.add(ok?'ok':'bad');sp.innerHTML+=(ok?' ✓':' ✗')})}
 else if(ex.type==='spot'){
  ab.querySelectorAll('.sline').forEach(function(sEl){var li=parseInt(sEl.getAttribute('data-line'),10);
   if(rt.spot===li&&li!==ex.a.bad){sEl.classList.add('bad');var mk=sEl.querySelector('.mk');if(mk)mk.textContent='✗'}
   if(li===ex.a.bad){sEl.classList.add('ok');var mk2=sEl.querySelector('.mk');if(mk2)mk2.textContent='✓'}})}
 else if(ex.type==='logview'){
  ab.querySelectorAll('.tf').forEach(function(d,k){var f=ex.a.fields[k],v=rt.typed[k]||'',nv=norm(v),ok=false;
   f.accept.forEach(function(ac){if(nv&&nv.indexOf(norm(ac))>=0)ok=true});
   d.classList.add(ok?'ok':'bad');var mk=d.querySelector('.mk');if(mk)mk.textContent=ok?'✓':'✗'})}
 else if(ex.type==='triage'){
  ab.querySelectorAll('.tristep').forEach(function(d,k){var st=ex.a.steps[k],p=rt.triPick[k];
   d.querySelectorAll('.choice').forEach(function(elm){var inp=elm.querySelector('input');if(!inp)return;var ci=parseInt(inp.value,10);
    var isC=ci===st.c,picked=p===ci;
    var cls=(isC&&picked)?'ok':(isC&&!picked)?'warn':(!isC&&picked)?'bad':null;
    if(cls){elm.classList.add(cls);var mk=elm.querySelector('.mk');if(mk)mk.textContent=cls==='ok'?'✓':cls==='bad'?'✗':'⚠'}})})}
 else if(ex.type==='terminal'){m=termMatch(ex,rt);
  var w=ab.querySelector('.term'),st=el('div');st.style.padding='10px 12px';
  st.innerHTML=ex.a.steps.map(function(sp2,i){var ok=m[i]>=0;
   return '<div class="fp '+(ok?'ok':'bad')+'"><span class="ico">'+(ok?'✓':'✗')+'</span><span>Step '+(i+1)+(ok?' accepted.':' not found. Expected something like: '+esc(sp2.ex))+'</span></div>'}).join('');
  if(w)w.appendChild(st)}
}

function fbHtml(res){
 var h='<div class="fbs">You earned <b>'+p2(res.e)+' / 1</b> points on this exercise.</div>';
 res.parts.forEach(function(p){h+='<div class="fp '+p.s+'"><span class="ico">'+(p.s==='ok'?'✓':p.s==='bad'?'✗':'⚠')+'</span><span><b>'+p.n+'</b>'+(p.t?'<br>'+p.t:'')+'</span></div>'});
 return h;
}

function doCheck(){
 var ex=curEx(),rt=curRt();
 if(rt.checked)return; /* Check validates once — timer stays frozen; use Revise to answer again */
 var res=CHECK[ex.type](ex,rt);
 if(rt.hint)res.e=Math.round(res.e*90)/100;
 rt.earned=res.e;rt.checked=true;rt.skipped=false;rt.parts=res.parts;rt.snap=res.snap;rt.fb=fbHtml(res);
 byId('fb').innerHTML=rt.fb;
 var xp=byId('expl');xp.hidden=false;xp.innerHTML='<div class="eh">EXPLANATION</div>'+ex.ex;
 rerenderAns();
 applyMarks(curEx(),curRt(),byId('ansbody'));
 var abx=byId('ansbody');
 if(abx){abx.querySelectorAll('input,button').forEach(function(x){x.disabled=true});} /* real lock: no keyboard edits in review mode */
 var br=document.querySelector('.btnrow');
 if(br&&!br.querySelector('[data-act="revise"]'))br.appendChild(btn('revise','Revise',''));
 else{var rb=br&&br.querySelector('[data-act="revise"]');if(rb)rb.disabled=false;}
 var hb=document.querySelector('[data-act="hint"]');if(hb)hb.disabled=true;
 S.pc=true;updatePauseUI();renderTop();
 var nb=document.querySelector('[data-act="next"]');if(nb)nb.focus();
}
function doRevise(){
 var rt=curRt();rt.checked=false;rt.earned=0;rt.fb='';rt.snap='';rt.parts=[];
 byId('fb').innerHTML='';byId('expl').hidden=true;
 var rb=document.querySelector('[data-act="revise"]');if(rb)rb.disabled=true;
 var hb=document.querySelector('[data-act="hint"]');if(hb&&!rt.hint)hb.disabled=false;
 rerenderAns();
}
function doHint(){
 var ex=curEx(),rt=curRt();if(rt.hint||rt.checked)return;
 rt.hint=true;
 var h=el('div','hintbox','<b>⚠ Hint — costs 10% of this exercise</b><br>'+esc(ex.hint));
 var fb=byId('fb');fb.parentNode.insertBefore(h,fb);
 var hb=document.querySelector('[data-act="hint"]');if(hb)hb.disabled=true;
}
function doNext(){advance()}
function doSkip(){var rt=curRt();rt.skipped=true;rt.checked=false;advance()}
function advance(){S.pc=false;S.sel=null;
 if(S.cur<DATA.length-1){S.cur++;renderAll();window.scrollTo(0,0)}
 else{renderTop();openConfirm()}
}

function openConfirm(){
 var ans=0,skip=0,un=0;
 S.rt.forEach(function(rt){if(rt.checked&&!rt.skipped)ans++;else if(rt.skipped)skip++;else un++});
 var mb=byId('mbody'),go=byId('mgo');
 if(ans===0){mb.innerHTML='<p class="skipnote">You must answer at least one exercise before submitting. Right now everything is skipped or unanswered.</p>';go.hidden=true}
 else{go.hidden=false;
  mb.innerHTML='<p>Answered: <b>'+ans+' / '+DATA.length+'</b></p>'
  +'<p>Skipped: <b>'+skip+'</b>'+(un?' · Visited but never Checked: <b>'+un+'</b>':'')+'</p>'
  +'<p class="skipnote">Skipped and never-Checked exercises are removed from scoring — from your points AND from the total. You can still go back and Check them first.</p>'}
 byId('modal').hidden=false;
}

function finish(){
 if(S.done)return;S.done=true;S.running=false;S.pm=false;S.pc=false;updatePauseUI();
 var earned=0,ans=0;
 S.rt.forEach(function(rt){if(rt.checked&&!rt.skipped){ans++;earned+=rt.earned}});
 var shown=Math.round(earned*100)/100;
 var rounded=Math.round(earned);
 var percent=ans?Math.round(rounded/ans*100):0;
 var pass=percent>=CFG.passMark;
 renderResults(shown,ans,rounded,percent,pass);
 reportScore(rounded,ans);
}

function renderResults(shown,ans,rounded,percent,pass){
 byId('topbar').style.display='block';byId('pind').hidden=true;
 var w=byId('stage'),h='<div class="card results">';
 h+='<div class="bigpanel '+(pass?'pass':'fail')+'"><div class="pct">'+percent+'%</div>';
 h+='<div class="pverdict">'+(pass?'PASS — well done!':'NOT PASSED — retake required')+'</div>';
 h+='<div class="pnote">'+p2(shown)+' / '+ans+' points · pass mark '+CFG.passMark+'% · '+esc(CFG.severity)+' practice exam</div>';
 h+='<div class="pnote">'+esc(CFG.title)+' — score reported to the site as '+rounded+' / '+ans+'.</div>';
 h+=(pass?'<div class="pnote" style="margin-top:8px">Certificate-style success: you mastered Task 4.1 authentication strategies at '+esc(CFG.severity)+' level.</div>':'<div class="pnote" style="margin-top:8px">Work through the report below, focus on every red and amber item, then press Retake Exam.</div>');
 h+='</div>';
 var full=0,part=0,zero=0,skip=0,un=0;
 S.rt.forEach(function(rt){if(rt.skipped)skip++;else if(!rt.checked)un++;else if(rt.earned>=0.999)full++;else if(rt.earned>0)part++;else zero++});
 h+='<div class="rstats"><span class="rstat">Answered: '+ans+'/'+DATA.length+'</span><span class="rstat">Full: '+full+'</span><span class="rstat">Partial: '+part+'</span><span class="rstat">Zero: '+zero+'</span><span class="rstat">Skipped: '+skip+'</span><span class="rstat">Unanswered: '+un+'</span></div>';
 h+='<h2>Per-theme progress</h2>';
 S.themes.forEach(function(th){
  var e=0,m=0;DATA.forEach(function(ex,i){if(ex.th!==th)return;var rt=S.rt[i];if(rt.skipped)return;m++;if(rt.checked)e+=rt.earned});
  h+='<div class="trow"><span class="tname">'+esc(th)+'</span><div class="tbar"><div class="tfill" style="width:'+(m?Math.round(e/m*100):0)+'%"></div></div><span class="tscore">'+p2(e)+'/'+m+'</span></div>';
 });
 var skiplist=[];S.rt.forEach(function(rt,i){if(rt.skipped||!rt.checked)skiplist.push('#'+(i+1)+' '+esc(DATA[i].t))});
 h+='<h2>Excluded from scoring (skipped or never Checked)</h2>';
 h+=skiplist.length?'<div class="skipnote">Not counted: '+skiplist.join(' · ')+'. Skipped exercises show no score and are left out of the percentage.</div>':'<p class="ilead">None — every exercise was answered.</p>';
 h+='<h2>Detailed report</h2>';
 S.rt.forEach(function(rt,i){
  var ex=DATA[i],lab,pill;
  if(rt.skipped){lab='skipped — excluded';pill='lskip'}
  else if(!rt.checked){lab='not answered — excluded';pill='lmiss'}
  else if(rt.earned>=0.999){lab='full';pill='lfull'}
  else if(rt.earned>0){lab='partial';pill='lpart'}
  else{lab='zero';pill='lzero'}
  h+='<div class="rrow"><details><summary><span class="rnum">#'+(i+1)+'</span><span class="rt1">'+esc(ex.t)+'</span><span class="lab '+pill+'">'+lab+'</span><span class="rp">'+((rt.skipped||!rt.checked)?'excluded':p2(rt.earned)+' / 1')+'</span></summary><div class="rbody">';
  h+='<div class="blk scen"><div class="bl">YOUR ANSWER</div><div class="bc">'+(rt.snap?esc(rt.snap):'—')+'</div></div>';
  h+='<div class="blk quest"><div class="bl">CORRECT ANSWER</div><div class="bc">'+esc(correctText(ex))+'</div></div>';
  h+='<div class="blk"><div class="bl">WHY — READ THIS EVEN FOR SKIPPED ITEMS</div><div class="bc">'+ex.ex+'</div></div>';
  h+='</div></details></div>';
 });
 h+='<div class="btnrow"><button class="btn primary" data-act="retake" type="button">Retake exam (questions and choices are reshuffled)</button></div></div>';
 w.innerHTML=h;window.scrollTo(0,0);
}

function correctText(ex){
 var a=ex.a;
 switch(ex.type){
  case 'qcm':return a.choices[a.correct];
  case 'multi':return a.correct.map(function(i){return a.choices[i]}).join(' ; ');
  case 'order':case 'rank':return a.items.map(function(t,i){return (i+1)+'. '+strip(t)}).join(' | ');
  case 'match':return a.pairs.map(function(p){return strip(p[0])+' → '+strip(p[1])}).join(' | ');
  case 'classify':return a.items.map(function(it){return strip(it.t)+' → '+bucketLabel(ex,it.b)}).join(' | ');
  case 'blank':return a.slots.map(function(s,i){return (i+1)+': '+s.accept[0]}).join(' | ');
  case 'spot':return a.lines[a.bad];
  case 'terminal':return a.steps.map(function(s,i){return (i+1)+': '+s.ex}).join(' then ');
  case 'logview':return a.fields.map(function(f){return f.accept[0]}).join(' | ');
  case 'triage':return a.steps.map(function(s){return strip(s.ch[s.c].t)}).join(' | ');
 }
 return '';
}

/* ================= website integration ================= */
function reportScore(correct,total){
 if(!window.parent||window.parent===window)return; /* opened directly — no site frame to report to */
 var percent=Math.round((correct/Math.max(total,1))*100);
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CFG.topicId,score:correct,total:total,percent:percent,passed:percent>=CFG.passMark},location.origin);
 }catch(e){/* parent unreachable, nothing to report to */}
}
window.addEventListener('message',function(event){
 if(!event.data)return;
 if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
 try{
  var bits=[];
  if(event.data.username)bits.push('Candidate: '+String(event.data.username).slice(0,40));
  if(event.data.country)bits.push(String(event.data.country).slice(0,32));
  if(event.data.batch)bits.push('Batch: '+String(event.data.batch).slice(0,32));
  if(event.data.topicId&&typeof event.data.topicId==='string')S.topicId=event.data.topicId.slice(0,64);
  if(event.data.locale&&typeof event.data.locale==='string')S.locale=event.data.locale.slice(0,32);
  if(bits.length){var e=byId('cand');if(e){e.hidden=false;e.textContent=bits.join(' · ')}}
 }catch(err){}
});

/* ================= event wiring ================= */
document.addEventListener('click',function(ev){
 var t=ev.target;if(!t||!t.closest)return;
 var act=t.closest('[data-act]');
 if(act){var a=act.getAttribute('data-act');
  if(a==='start'){startExam();return}
  if(a==='check'){doCheck();return}
  if(a==='skip'){doSkip();return}
  if(a==='next'){doNext();return}
  if(a==='hint'){doHint();return}
  if(a==='revise'){doRevise();return}
  if(a==='pause'){togglePause();return}
  if(a==='submit'){if(S.started&&!S.done)openConfirm();return}
  if(a==='closeconf'){byId('modal').hidden=true;return}
  if(a==='confirmgo'){byId('modal').hidden=true;finish();return}
  if(a==='retake'){startExam();return}
  if(a==='navq'){if(!S.started||S.done)return;S.cur=parseInt(act.getAttribute('data-i'),10);S.pc=false;S.sel=null;renderAll();window.scrollTo(0,0);return}
  if(a==='run'){runTerm();return}
  return;
 }
 var ch=t.closest('[data-chip]');if(ch){chipClick(ch);return}
 var sl=t.closest('[data-slot]');if(sl){slotClick(sl);return}
 var bu=t.closest('[data-bucket]');if(bu){bucketClick(bu);return}
 var ln=t.closest('[data-line]');if(ln){lineClick(ln);return}
 var mv=t.closest('[data-mv]');if(mv){moveOrd(mv);return}
});
document.addEventListener('change',function(ev){
 var t=ev.target;if(!t||!t.matches)return;
 var ex=curEx(),rt=curRt();if(!rt)return;
 if(t.matches('#ansbody input[type=radio][name^="qc"]')){
  rt.pick=parseInt(t.value,10);
  var lab=t.closest('.choice');
  if(lab){lab.parentNode.querySelectorAll('.choice').forEach(function(e2){e2.classList.remove('selc')});lab.classList.add('selc')}
 }else if(t.matches('#ansbody input[type=checkbox][data-mi]')){
  var v=parseInt(t.getAttribute('data-mi'),10),ix=rt.picks.indexOf(v);
  if(t.checked&&ix<0)rt.picks.push(v);
  if(!t.checked&&ix>=0)rt.picks.splice(ix,1);
  var lb=t.closest('.choice');if(lb)lb.classList.toggle('selc',t.checked);
 }else if(t.matches('input[name^="tri"]')){
  var k=parseInt(t.name.slice(3),10),val=parseInt(t.value,10);
  rt.triPick[k]=val;
  var lb2=t.closest('.choice');
  if(lb2){lb2.parentNode.querySelectorAll('.choice').forEach(function(e2){e2.classList.remove('selc')});lb2.classList.add('selc')}
  if(k===rt.tri&&rt.tri<ex.a.steps.length){rt.tri++;rerenderAns()}
 }
});
document.addEventListener('input',function(ev){
 var t=ev.target;if(!t||!t.matches)return;
 var rt=curRt();if(!rt)return;
 if(t.hasAttribute('data-filt')){rt.filter=t.value;renderLogRows()}
 else if(t.hasAttribute('data-tf')){rt.typed[t.getAttribute('data-tf')]=t.value}
 else if(t.hasAttribute('data-cmd')){rt.typed.cmd=t.value}
});
document.addEventListener('keydown',function(ev){
 var t=ev.target;
 if(t&&t.matches&&t.matches('[data-cmd]')&&ev.key==='Enter'){ev.preventDefault();runTerm()}
});
document.addEventListener('dragstart',function(ev){
 var c=ev.target&&ev.target.closest?ev.target.closest('[data-chip],.ord'):null;if(!c)return;
 if(c.hasAttribute('data-chip'))S.drag={k:'chip',v:c.getAttribute('data-chip')};
 else S.drag={k:'ord',v:c.getAttribute('data-pos')};
 if(ev.dataTransfer){ev.dataTransfer.setData('text/plain','x');ev.dataTransfer.effectAllowed='move'}
});
document.addEventListener('dragover',function(ev){
 if(!S.drag)return;
 if(ev.target&&ev.target.closest&&ev.target.closest('[data-slot],[data-bucket],.ord'))ev.preventDefault();
});
document.addEventListener('drop',function(ev){
 if(!S.drag)return;
 var t=ev.target&&ev.target.closest?ev.target.closest('[data-slot],[data-bucket],.ord'):null;
 if(!t)return;
 ev.preventDefault();
 if(S.drag.k==='chip'){
  if(t.hasAttribute('data-slot'))placeChipToSlot(S.drag.v,t.getAttribute('data-slot'));
  else if(t.hasAttribute('data-bucket'))placeChipToBucket(S.drag.v,t.getAttribute('data-bucket'));
 }else{
  reordTo(parseInt(S.drag.v,10),parseInt(t.getAttribute('data-pos'),10));
 }
 S.drag=null;
});

document.addEventListener('DOMContentLoaded',function(){
 renderIntro();
 setInterval(tick,1000);
});

</script>
</body>
