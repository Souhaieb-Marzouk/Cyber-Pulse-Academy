 else if(e.type==='match'){v.sel={};for(var k2 in ans)v.sel[k2]=ans[k2];v.touched=true;}
 else if(e.type==='order'||e.type==='rank'){v.arr=ans?v.arr.slice():v.arr;if(ans){v.arr=ans.slice();v.touched=true;}}
 else if(e.type==='fill'){for(var s=0;s<(ans||[]).length;s++)v['s'+s]=ans[s];v.touched=true;}
 else if(e.type==='logview'){v.ans={};for(var k3 in ans)v.ans[k3]=ans[k3];v.touched=true;}
 else if(e.type==='branch'){v.step=(ans||[]).length;v.picks=(ans||[]).slice();}

code:"L1: TrailName: org-audit-trail   IsOrganizationTrail: true\nL2: IsMultiRegionTrail: false    # keeps cost down, we log home Region only\nL3: EnableLogFileValidation: false   # S3 versioning already protects us\nL4: KmsKeyId: arn:aws:kms:eu-west-1:123456789012:key/9a1b\nL5: Key policy grants kms:GenerateDataKey to cloudtrail.amazonaws.com\n    scoped to the org and the trail ARN\nL6: EventSelectors: management events, Read+Write\nL7: Comment: S3 object-level calls on the data-lake bucket are\n    captured by this trail (no extra selector added)\nL8: Bucket policy: Allow cloudtrail.amazonaws.com s3:PutObject\n    with Condition aws:SourceAccount = 123456789012\nL9: Bucket policy: Deny s3:* when aws:SecureTransport = false\nL10: Block Public Access enabled on the archive account",
q:"Select EVERY line that is a mistake in this trail definition.",
c:["L2 — a single-Region trail misses events in the other Regions","L3 — turning off log file validation removes tamper evidence","L7 — the trail will NOT capture S3 object-level calls without a data-event selector","L5 — the KMS key policy grants GenerateDataKey to CloudTrail","L8 — the bucket policy pins service and source account","L10 — Block Public Access is enabled","L4 — using a customer managed KMS key"],
a:[0,1,2],
hint:"Two lines quietly reduce coverage or evidence; one line claims something the selector list does not do.",
ex:"<b>L2</b>: a single-Region trail only records the Region it runs in — use a multi-region trail (or one trail per Region) so nothing is missed. <b>L3</b>: S3 versioning protects against overwrite, not against a forged or deleted file plus its version — digest files from <b>log file validation</b> are the tamper evidence. <b>L7</b>: S3 data events must be added with an explicit event selector; a management-event trail never records GetObject. L4, L5, L8 and L10 are correct, good practice.",
ca:"Mistakes: L2 (single Region), L3 (no validation), L7 (claims data events)"},
{id:'H05',th:4,type:'branch',
sc:"02:40 UTC. Resolver query logs show, every 15 to 60 seconds, TXT lookups for 30-character random labels under updates[.]cdn-sync[.]example from srcaddr 10[.]0[.]5[.]20 — the production ETL host. Responses are NXDOMAIN. Rough estimate: 180 KB per day encoded in the labels.",
q:"Drive the response, step by step.",
steps:[
{p:"First analytical step?",o:["Quantify: aggregate Resolver logs per hour, label entropy and byte estimate for the window","Block the domain immediately and investigate later","Delete the ETL role so it cannot talk"],a:0,good:"You size the leak and the window first — that drives containment and the report.",w:"Blocking first loses nothing of the past logs but you still cannot say how much left or since when; and deleting the role destroys session evidence."},
{p:"Which second source corroborates the volume?",o:["VPC Flow Logs: port 53 flows from 10[.]0[.]5[.]20 with byte counts per interval","CloudFront standard logs","AWS Config timeline of the host"],a:0,good:"Flow logs independently confirm destination, cadence and byte volume.",w:"CloudFront never sees host-originated DNS; Config records configuration, not traffic."},
{p:"Containment that stops the bleed AND preserves evidence?",o:["Add a Resolver DNS Firewall rule blocking the domain, keep query logging on, keep the host for forensics, rotate its credentials","Terminate the instance instantly and snapshot nothing","Remove the VPC from the internet"],a:0,good:"DNS Firewall kills the channel while logs keep accumulating; the host stays for forensics.",w:"Termination with no snapshot destroys volatile evidence; pulling the whole VPC offline is business damage."},
{p:"Which design gap allowed this?",o:["Unrestricted egress with no DNS Firewall and resolver forwarding straight to public DNS","An oversized KMS key policy","S3 versioning being enabled"],a:0,good:"No DNS egress control meant any domain was resolvable from prod.",w:"Key policies and versioning have no role in DNS exfiltration."},
{p:"Org-wide prevention?",o:["Deploy a DNS Firewall rule group through Firewall Manager to the organization VPCs, with logging enabled","Buy bigger instances","Disable TXT records at the registrar"],a:0,good:"Firewall Manager pushes the same protective rule group everywhere, consistently.",w:"Instance size is irrelevant; registrar TXT settings do not govern what your VPC resolves."}],
hint:"Quantify → corroborate → contain without destroying evidence → close the design gap → prevent org-wide.",
ex:"DNS exfiltration hides in plain queries: quantify first (how much, since when), corroborate with flow logs (independent bytes), then block the channel with a <b>DNS Firewall</b> rule while keeping logging — never destroy evidence. The gap was unrestricted DNS egress; the durable fix is a Firewall Manager-managed DNS Firewall rule group across the organization.",
ca:"quantify → flow-log corroboration → DNS Firewall containment → egress gap → Firewall Manager roll-out"}
);

{id:'H07',th:3,type:'dd',
sc:"You are aligning the lake taxonomy. Security Lake maps each AWS source to an OCSF class, and your dashboards must use those class names.",
q:"Drag each Security Lake source onto its OCSF activity class.",
bins:["Network Activity","DNS Activity","API Activity (Cloud API)","Security Finding","HTTP Activity","Kubernetes Activity"],
items:[
["VPC_FLOW",0],
["ROUTE53",1],
["CLOUD_TRAIL_MGMT",2],
["SH_FINDINGS",3],
["S3_DATA",4],
["EKS_AUDIT",5]],
hint:"Flow records are network; resolver records are DNS; CloudTrail is API; Security Hub findings are findings; S3 server access is HTTP; the cluster control plane speaks Kubernetes.",
ex:"<b>VPC_FLOW</b> normalizes to Network Activity (connection metadata). <b>ROUTE53</b> becomes DNS Activity. <b>CLOUD_TRAIL_MGMT</b> and other CloudTrail sources map to API Activity. <b>SH_FINDINGS</b> (Security Hub) map to the Security Finding class. <b>S3_DATA</b> (S3 server access logs) map to HTTP Activity. <b>EKS_AUDIT</b> maps to Kubernetes Activity. Using the right class keeps cross-source dashboards coherent.",
ca:"VPC_FLOW→Network · ROUTE53→DNS · CLOUD_TRAIL_MGMT→API · SH_FINDINGS→Finding · S3_DATA→HTTP · EKS_AUDIT→Kubernetes"},
{id:'H08',th:2,type:'fill',code:1,
sc:"The monthly Athena bill exploded: a colleague's query scans 4.2 TB because it filters with a function on the timestamp instead of using the partition column. The table is partitioned by <code>eventdate</code>.",
q:"Fix the query and explain the bill.",
text:"SELECT useridentity.arn, count(*) AS hits\nFROM \"security\".\"cloudtrail_parquet\"\nWHERE {0} = '2026-10-16'   -- partition column, not extract() on eventTime\n  AND eventname = 'AssumeRole'\nGROUP BY useridentity.arn\nORDER BY {1} DESC\nLIMIT {2}\n\nWhy was the bill huge? Because the old predicate wrapped eventTime in a function, so Athena could not do {3} and read {4} partition(s) instead of one.",
bank:["eventdate","hits","10","partition pruning","every","only the matching","projection","sum"],
sol:["eventdate","hits","10","partition pruning","every"],
hint:"One column name, one alias, one limit, one optimization term, one scope word.",
ex:"Filter on the raw partition column <b>eventdate</b> so Athena can apply <b>partition pruning</b> and scan exactly one day's objects. Wrapping the timestamp in a function defeats pruning and makes Athena read <b>every</b> partition — that is where the 4.2 TB came from. <b>ORDER BY hits DESC</b> ranks the counts and <b>LIMIT 10</b> trims the result.",
ca:"WHERE eventdate → partition pruning (otherwise every partition is scanned) · order by hits · limit 10"},
{id:'H09',th:0,type:'multi',
sc:"You enabled a CloudTrail data-event selector for ONE Lambda function ARN (the payment function). The team argues about what the trail will now contain.",
q:"Select every statement that is true.",
c:["Invoke calls on the payment function now appear in the trail (data events)","CreateFunction / DeleteFunction calls appear regardless, because they are management events","Data-event logging is off by default and adds cost at high invoke volume","Data events on Lambda are free because they are already management events","With data events enabled, CloudTrail records the request parameters of each Invoke","Invoke events can be limited to specific function ARNs in the event selector"],
a:[0,1,2,4,5],
hint:"Three true facts, one pricing myth, one classification error, one scope claim — decide each.",
ex:"<b>True:</b> Invoke is a data event and now shows up with its request parameters; CreateFunction/DeleteFunction are management events that were always recorded; data events are off by default and billable at volume; the selector supports include lists of specific function ARNs. <b>False:</b> data events are not free, and Invoke is never a management event.",
ca:"True: Invoke visible with parameters · mgmt events always logged · cost + off by default · ARN-scoped selectors"},
{id:'H10',th:5,type:'order',
sc:"Legal just declared a preservation order for a security investigation covering 7 years. You must build the evidence store correctly — some steps cannot be done later or out of order.",
q:"Put the six preservation steps in the correct order (1 = first).",
items:["Confirm the retention requirement and mode with legal (7 years, COMPLIANCE)","Create the evidence bucket WITH versioning and Object Lock enabled — this is only possible at creation","Copy the log objects (trail logs, digests, exports) into the evidence bucket","Apply the COMPLIANCE-mode retention period (2555 days) to the copied object versions","Record checksums of the copied objects and of the CloudTrail digest files","Document the chain of custody and reference the locked versions in the case ticket"],
hint:"You cannot retrofit Object Lock on an existing bucket, and retention is applied to versions after they exist.",
ex:"Decide the legal parameters first. <b>Object Lock must be enabled at bucket creation</b> (with versioning) — it cannot be added to an existing bucket without a support request. Then copy the evidence, and only then apply the <b>COMPLIANCE</b> retention to the stored versions. Checksums (and CloudTrail digest files) prove integrity; the custody record ties artefacts to the case. Doing retention before the copy, or Lock after creation, breaks the design.",
ca:"legal sign-off → create bucket with Lock+versioning → copy → apply retention → checksums → custody record"}
);

{id:'H12',th:1,type:'branch',
sc:"Architecture review: the company operates in five Regions and 80 accounts. Requirements: one pane for findings, org-wide tamper-proof trail, a unified queryable lake, and investigation support.",
q:"Choose the design at each decision point.",
steps:[
{p:"How do you get a single pane for findings across Regions?",o:["Enable Security Hub in every Region and set one aggregation Region","Export each Region's findings to CSV weekly","Only enable Security Hub in one Region and ignore the rest"],a:0,good:"Cross-Region aggregation mirrors findings into the aggregation Region — one console.",w:"CSV is not real time and single-Region leaves four Regions blind."},
{p:"How should the organization trail be shaped?",o:["One multi-region organization trail delivering to the log-archive account","One trail per account per Region, all in the account itself","No trail — rely on Service history"],a:0,good:"A single multi-region org trail in the archive account covers every account and Region once.",w:"Per-account trails multiply cost and can be modified by the accounts themselves; Service history is not an audit log."},
{p:"How do you build the unified lake with one Region to query?",o:["Enable Security Lake organization-wide with a delegated admin account and a rollup Region","Copy every account's logs with a nightly Lambda into one bucket","Store nothing central; query account by account"],a:0,good:"Delegated administration plus a rollup Region aggregates all Regions into one queryable place.",w:"Nightly copies lag and break OCSF normalization; per-account querying defeats the purpose."},
{p:"How do analysts investigate at scale?",o:["Athena over the rollup Region for SQL, Control Tower guardrails to prevent trail tampering, and Amazon Detective for behavior graphs","RDP into each account and read files","Ask each account team for screenshots"],a:0,good:"Query in place, prevent tampering org-wide, and use Detective's linked graphs for the who-did-what.",w:"Manual account hopping does not scale and screenshots are not evidence."}],
hint:"Aggregate findings, centralize the trail, roll up the lake, then query+prevent+graph.",
ex:"Security Hub cross-Region <b>aggregation</b> gives one pane. One <b>multi-region organization trail</b> in the archive account is the audit backbone. <b>Security Lake</b> with a <b>delegated admin</b> and a <b>rollup Region</b> unifies storage in OCSF. Analysts query with <b>Athena</b>, the platform is protected by <b>Control Tower guardrails</b> (SCPs), and <b>Detective</b> builds the behavior graph.",
ca:"aggregation Region · multi-region org trail · Security Lake rollup + delegated admin · Athena + guardrails + Detective"},
{id:'H13',th:4,type:'dual',
sc:"An attacker holds valid console credentials of a developer. Current logging: management events only — no S3 data events, no S3 server access logs. The blue team is about to be surprised.",
q:"Answer once as the red team, once as the blue team.",
parts:[
{label:"RED TEAM — move quietly",q:"Which action is LEAST likely to leave a trace in the current logging?",o:["Download S3 objects with the stolen session","StopLogging on the org trail","RunInstances in a production account","CreateUser in IAM"],a:0},
{label:"BLUE TEAM — close the gap",q:"Which single change makes object downloads visible?",o:["Enable CloudTrail S3 data events (or parse S3 server access logs)","Increase CloudWatch Logs retention to 30 days","Add a second trail for management events","Disable MFA for service accounts"],a:0}],
hint:"Object-level reads are not management events. Stopping logging or creating infrastructure IS loud.",
ex:"<b>Red:</b> with only management events recorded, object downloads produce no CloudTrail record at all — quiet exfiltration. In contrast, StopLogging, RunInstances and CreateUser are management events that light up the trail (and GuardDuty). <b>Blue:</b> S3 <b>data events</b> (or S3 server access logs) are the control that exposes object-level activity; longer retention, more trails and weaker MFA change nothing about visibility.",
ca:"Red: silent S3 downloads · Blue: enable S3 data events / access logs"},
{id:'H14',th:2,type:'fill',code:1,
sc:"A Lambda function writes auth lines like <code>2026-10-17T02:11:03Z ERROR auth token=abc123 user=jdoe ip=203[.]0[.]113[.]77</code> to a CloudWatch Logs group. You need a top-talkers query.",
q:"Complete the Logs Insights query that extracts the fields from the raw message.",
text:"fields @timestamp, @message\n| {0} @message \"user={1}\" as user\n| parse @message \"ip=*\" as ip\n| {2} @message like /ERROR/\n| stats {3} by ip, user\n| sort count(*) {4}\n| {5} 10",
bank:["parse","*","filter","count(*)","desc","limit","stats","asc"],
sol:["parse","*","filter","count(*)","desc","limit"],
hint:"parse extracts from the raw message with a glob; the wildcard char is *, then filter, aggregate, sort, cap.",
ex:"<b>parse</b> pulls fields out of unstructured text — the glob <b>*</b> captures everything between <code>user=</code> and the next space. <b>filter</b> keeps ERROR lines. <b>stats count(*)</b> aggregates per ip and user, <b>sort … desc</b> ranks them, and <b>limit</b> caps the output. This is the standard pattern for logs that are not JSON.",
ca:"parse user=* · filter ERROR · stats count(*) by ip,user · sort desc · limit 10"},
{id:'H15',th:1,type:'qcm',
sc:"The legal team asks: are S3 server access log records guaranteed to be complete and on time, since we use them as the compliance record for object downloads?",
q:"Which statement about S3 server access log delivery is correct?",
c:["Delivery is best effort: completeness and timeliness are not guaranteed","Delivery is guaranteed within 15 minutes of every request","Delivery is guaranteed only when bucket versioning is enabled","Records are delivered to the same bucket by default"],
a:0,
hint:"AWS is explicit about the guarantee level of this log type — it is not a compliance-grade record.",
ex:"S3 server access log delivery is documented as <b>best effort</b> — every request is logged with best effort, so completeness and timeliness are not guaranteed. For compliance-grade object-level audit you should use <b>CloudTrail S3 data events</b> instead, which are delivered as part of the trail. Versioning has no effect on delivery guarantees, and access logs always go to a separate bucket you choose.",
ca:"Best effort — use CloudTrail S3 data events when completeness matters"}
);

{id:'H16',th:3,type:'spot',
sc:"Design review of the new OpenSearch domain that will hold 90 days of security logs (about 5 GB/day) for the SOC.",
code:"L1: Deployment: VPC, two Availability Zones\nL2: Network: publicly accessible, open to 0[.]0[.]0[.]0/0 for partner access\nL3: Fine-grained access control: disabled (simpler IAM)\nL4: Encryption at rest: enabled (KMS)\nL5: Node-to-node encryption: enabled\nL6: UltraWarm enabled for indices older than 30 days\nL7: ISM policy: delete indices after 7 days (the requirement is 90)\nL8: Audit to OpenSearch: enabled",
q:"Select EVERY line that is a mistake in this domain design.",
c:["L2 — a public domain open to the internet","L3 — fine-grained access control disabled","L7 — ISM deletes indices at 7 days instead of the required 90","L4 — encryption at rest with KMS","L6 — UltraWarm for indices older than 30 days","L1 — a VPC deployment across two AZs","L8 — audit logging enabled"],
a:[0,1,2],
hint:"Two lines destroy security boundaries, one line destroys retention compliance. The rest is textbook good practice.",
ex:"<b>L2</b> exposes the whole log store to the internet — VPC-only access is the design. <b>L3</b>: fine-grained access control is what enforces per-index, per-user permissions; without it IAM alone is too coarse. <b>L7</b>: deleting after 7 days violates the 90-day requirement — the ISM policy must match retention law. L4, L5, L6, L1 and L8 are all correct controls.",
ca:"Mistakes: public domain, no FGAC, ISM deletes at 7d"},
{id:'H17',th:4,type:'fill',
sc:"WAF and ALB logs, same source IP 198[.]51[.]100[.]71, one minute apart:<pre>02:10:04 WAF  action=BLOCK terminatingRuleId=AWS-AWSManagedRulesSQLiRuleSet\n        path=/login      query=q=' OR 1=1--\n02:10:51 ALB  elb=200 target=200 path=/login/  (trailing slash)\n        user-agent=sqlmap/1.7</pre>The managed rule group matched the first request but the second reached the target and returned 200.",
q:"Complete the analyst conclusion.",
text:"The {0} rule set blocked the first attempt, but the second request used a path {1} that the rule matching did not normalize, so it reached the target with status {2}. This is a rule {3}, not a false positive. Recommended: verify rule coverage against case and encoding variants, and add a {4} rule as a backstop against tooling like sqlmap.",
bank:["SQLi","/login/ (trailing-slash variant)","200","bypass","rate-based","403","allow","IPSet"],
sol:["SQLi","/login/ (trailing-slash variant)","200","bypass","rate-based"],
hint:"Same path, one byte different. The target answered successfully. What do you call that, and which rule type throttles regardless of signature?",
ex:"The managed <b>SQLi</b> rules fired on the first request; the trailing-slash variant slipped past that signature and the target answered <b>200</b> — a <b>bypass</b>, not a false positive. Hardening: test normalization variants (case, encoding, trailing characters) and add a <b>rate-based</b> rule so automated tooling gets throttled even when signatures miss. A 403 would have meant the WAF blocked it, which did not happen.",
ca:"SQLi rules → trailing-slash bypass → 200 → add rate-based rule"},
{id:'H18',th:2,type:'rank',
sc:"Monday 08:30. Six-hour backlog, four analysts. Rank the queue so the team starts with the right case.",
q:"Rank from highest (1) to lowest (5) investigation priority.",
items:["GuardDuty CRITICAL: new access key for an admin role created and used from a new country (RecordState ACTIVE)","Config: the payroll bucket policy was changed to public read 40 minutes ago and no one has reverted it","GuardDuty HIGH: single external IP scanning the app subnet; every probe shows REJECT","11 failed console sign-ins for jdoe from the office range, no success yet","A CloudWatch agent stopped on one developer workstation overnight"],
hint:"Active compromise first, active exposure second, blocked noise after, hygiene last.",
ex:"1 — active <b>admin key abuse</b> from a new country: contain now. 2 — the <b>public payroll bucket</b> is leaking right now; revert while investigating who changed it (CloudTrail + Config). 3 — the scan is <b>fully blocked</b> (all REJECT): recon worth a note, not a fire. 4 — failed sign-ins with no success are likely user error. 5 — one stopped agent is <b>hygiene</b>. Priority follows live impact, not finding labels alone.",
ca:"1 key abuse · 2 public bucket · 3 blocked scan · 4 failed logins · 5 agent hygiene"},
{id:'H19',th:5,type:'fill',
sc:"You are writing the log-preservation clause of the Severity-1 incident runbook. Compliance reviewed the wording once; now it must be exact.",
q:"Insert the missing terms.",
text:"Upon a Severity-1 declaration: (1) {0} any lifecycle rule that could delete logs; (2) copy evidence to the {1} bucket configured in {2} mode; (3) collect the CloudTrail {3} files for the window and validate them against the public key; (4) grant responders query access through the {4} account role, read-only; (5) record every artefact hash in the {5} ticket.",
bank:["suspend","evidence","COMPLIANCE","digest","delegated admin","chain-of-custody","delete","GOVERNANCE","root"],
sol:["suspend","evidence","COMPLIANCE","digest","delegated admin","chain-of-custody"],
hint:"Stop deletion, lock evidence the strong way, prove integrity with the signature files, access via the right account, document everything.",
ex:"You <b>suspend</b> deletion rules so nothing quietly expires mid-case. Evidence lands in the <b>evidence</b> bucket in <b>COMPLIANCE</b> mode — GOVERNANCE can be bypassed by privileged users, which is not acceptable for a case. CloudTrail <b>digest</b> files (validated against the public key) prove the logs were not altered. Access flows through the <b>delegated admin</b> account with read-only roles, and hashes go into the <b>chain-of-custody</b> ticket.",
ca:"suspend lifecycle · evidence bucket · COMPLIANCE · digest files · delegated admin · chain-of-custody"},
{id:'H20',th:5,type:'multi',
sc:"An auditor asks precisely what CloudTrail log file integrity validation does and does not guarantee.",
q:"Select every statement that is TRUE.",
c:["Digest files are delivered about every hour","Digest files are signed by CloudTrail; you validate them with the public key","Validation detects modification or deletion of log files after their digest was delivered","Digest files are stored in the same S3 bucket, in a separate prefix","Enabling validation retroactively covers logs delivered before you enabled it","Validation requires CloudTrail Lake","Enabling validation also encrypts the log files"],
a:[0,1,2,3],
hint:"Think about the hourly cadence, the signing key pair, what tampering it can prove, and where digests land.",
ex:"<b>True:</b> digests arrive roughly hourly; they are signed with CloudTrail's private key and validated with the public key (validate-logs CLI); they prove that delivered files were not altered or deleted afterwards; and they are delivered to the same bucket under a separate prefix. <b>False:</b> validation starts with logs delivered after enabling — no retroactive coverage; it does not need CloudTrail Lake; and it validates integrity, it does not encrypt anything.",
ca:"True: hourly digests · signed, validated with public key · detects post-delivery tampering · same bucket, separate prefix"}
);

sc:"EKS control-plane audit log (CloudWatch Logs), cluster <code>prod-eks</code>, night window. Normal activity comes from the CI service accounts in the cluster CIDR.",

{id:'H22',th:2,type:'fill',code:1,
sc:"The team's metric filter for trail tampering is broken — it never matched anything. Here is the working version; complete it.",
q:"Complete the corrected metric filter and alarm statistic.",
text:"aws logs put-metric-filter \\\n  --log-group-name CloudTrail/org \\\n  --filter-name TrailTampering \\\n  --filter-pattern '{ ( ($.eventName = {0}) || ($.eventName = {1}) ) }' \\\n  --metric-transformations metricName=TrailTampering,metricNamespace=Security,metricValue={2}\naws cloudwatch put-metric-alarm --alarm-name TrailTampering-Page \\\n  --metric-name TrailTampering --namespace Security --statistic {3} \\\n  --threshold 1 --period 60 --evaluation-periods 1 \\\n  --comparison-operator GreaterThanOrEqualToThreshold",
bank:["\"StopLogging\"","\"DeleteTrail\"","1","Sum","Average","CreateTrail","0","Minimum"],
sol:["\"StopLogging\"","\"DeleteTrail\"","1","Sum"],
hint:"Two event names end logging; each match must count once; one event is enough to page.",
ex:"The two events that blind you are <b>StopLogging</b> and <b>DeleteTrail</b> (both quoted — the pattern is JSON). Every match publishes <b>metricValue 1</b>, and the alarm statistic is <b>Sum</b> with threshold 1 so a single event pages. GuardDuty also flags trail changes, but a metric filter gives you an org-specific, sub-minute page. The broken version omitted quotes and the OR branch, so it matched nothing.",
ca:"\"StopLogging\" || \"DeleteTrail\" · value 1 · Sum, threshold 1"},
{id:'H23',th:4,type:'fill',
sc:"Transit Gateway flow logs (attachment-level). Attachment map: <code>tgw-attach-prod</code> = prod spoke, <code>tgw-attach-insp</code> = inspection VPC (east-west firewall), <code>tgw-attach-shared</code> = shared services. One record:<pre>2 tgw tgw-0a1b2c3d 123456789012 tgw-attach-prod tgw-attach-insp\n  vpc-prod vpc-insp inter-vpc 10[.]0[.]8[.]31 10[.]0[.]100[.]40\n  49200 8443 6 4 3000 1760001200 1760001260 REJECT OK</pre>",
q:"Complete the interpretation.",
text:"The record describes traffic from {0} in the {1} spoke towards {2} in the inspection VPC. The {3} action at the inspection boundary means the inspection path denied it — security groups are {4}, so a reject on the reply would hint at a NACL; here the initial flow itself was denied. Attachment-level records matter because per-VPC ENI flow logs cannot see the {5} hop through the gateway.",
bank:["10[.]0[.]8[.]31","prod","10[.]0[.]100[.]40","REJECT","stateful","transit","ACCEPT","inspection"],
sol:["10[.]0[.]8[.]31","prod","10[.]0[.]100[.]40","REJECT","stateful","transit"],
hint:"The packet source is in the record; the spoke name comes from the attachment map; the deny is explicit; SGs never block the first denied packet of a flow.",
ex:"The source <b>10[.]0[.]8[.]31</b> sits in the <b>prod</b> spoke; the destination <b>10[.]0[.]100[.]40</b> is in the inspection VPC. <b>REJECT</b> on the initial flow means the inspection path denied it outright (an SG is <b>stateful</b> and would only matter for replies of allowed flows). TGW flow logs are recorded at the attachment level, which is why the <b>transit</b> hop is invisible to per-VPC ENI flow logs.",
ca:"prod spoke → inspection VPC · REJECT on initial flow · TGW hop invisible to ENI logs"},
{id:'H24',th:2,type:'qcm',
sc:"Requirements: ad-hoc SQL over six months of JSON/Parquet logs already in S3, queries run a few times per week, no steady infrastructure budget, and the storage must stay in the existing archive bucket.",
q:"Which analysis service fits best?",
c:["Amazon OpenSearch Service with three always-on data nodes","Amazon Athena over a partitioned Glue table on the existing bucket","CloudWatch Logs Insights on logs you re-ingest into CloudWatch","CloudTrail Lake with a partner integration ingesting all sources"],
a:1,
hint:"Serverless per-query cost over data that is already in S3, with infrequent queries, decides it.",
ex:"<b>Athena</b> is serverless SQL over S3 — you pay per query, the data never moves, and partitioning keeps scans small; ideal for infrequent ad-hoc analysis. OpenSearch needs <b>always-on nodes</b> you pay for 24/7. CloudWatch Logs Insights only queries logs stored in CloudWatch — re-ingesting six months is costly and moves the data. CloudTrail Lake shines for CloudTrail-native SQL retention, not for arbitrary six-month JSON at the lowest cost.",
ca:"Athena over a partitioned Glue table on the existing bucket"},
{id:'H25',th:0,type:'branch',
sc:"CloudTrail shows user contractor-mike assumed Role-Developer, and 40 minutes later the SAME session assumed Role-OpsAdmin (production admin). Role-Developer's trust policy contains an unreviewed entry allowing it to assume Role-OpsAdmin.",
q:"Work the investigation decisions.",
steps:[
{p:"Which evidence chain proves the abuse?",o:["The two AssumeRole events with userIdentity.sessionContext showing the session chain, plus the trust policy entry","VPC Flow Logs of the API server","The S3 access logs of the archive bucket"],a:0,good:"sessionContext links the two events to one session; the trust policy explains how it was possible.",w:"Flow logs and S3 access logs cannot show role assumption chains."},
{p:"Why is this chaining dangerous?",o:["A low-privilege role quietly inherited production admin through an unreviewed trust relationship","Roles cannot be chained in AWS","AssumeRole events are not logged"],a:0,good:"Role chaining without review is a classic privilege escalation path.",w:"Chaining is absolutely possible — that is the point — and AssumeRole is always a logged management event."},
{p:"Preventive fix?",o:["Remove the unreviewed trust entry or add conditions (external ID / sourceIdentity), plus an SCP denying prod admin roles outside break-glass","Rotate contractor-mike's password only","Make Role-OpsAdmin a managed policy"],a:0,good:"Fix the trust graph and add a preventive org guardrail — not just one credential.",w:"A password rotation does not remove the escalation path; converting to a managed policy changes nothing here."},
{p:"Detective control for next time?",o:["A metric filter + alarm on AssumeRole into Role-OpsAdmin, and GuardDuty anomalous behavior findings","Disable CloudTrail during contractor hours","A bigger KMS key policy"],a:0,good:"Alerting on the sensitive assumption plus GuardDuty behavior catches the next chain attempt.",w:"Disabling logging is self-sabotage; KMS policies are unrelated."}],
hint:"Session context is the proof, the trust graph is the cause, conditions + SCP are the fix, alerting is the detection.",
ex:"<b>sessionContext</b> in the AssumeRole events ties both calls to one session — proof of chaining. The unreviewed trust entry is the escalation path: fix it (remove or add conditions such as external ID or sourceIdentity) and back it with an <b>SCP</b> that denies production admin assumptions outside break-glass. Detection: a metric filter on AssumeRole into the admin role plus GuardDuty anomalies.",
ca:"sessionContext proof · unreviewed trust entry · conditions + SCP · metric filter + GuardDuty"}

{id:'H28',th:4,type:'fill',
sc:"API Gateway access logs and the payment Lambda's logs, two seconds apart:<pre>02:14:01 GET /orders      auth=sub:alice  src 10[.]0[.]2[.]8    200\n02:14:02 POST /payouts    auth=sub:alice  src 198[.]51[.]100[.]93  200\n02:14:02 LAMBDA token validated OK (signature valid, not expired)</pre>",
q:"Complete the fraud-analysis note.",
text:"The red flag: the same token {0} was used from two different {1} one second apart — impossible for one human. The app only {2} the signature and expiry, so a stolen token keeps working until it expires. Fix: shorten token {3}, add refresh-token rotation, and bind a stable {4} between API Gateway access logs and Lambda logs so sessions can be reconstructed end to end.",
bank:["subject","source addresses","validates","expiry","request ID","signature","usernames","IPset"],
sol:["subject","source addresses","validates","expiry","request ID"],
hint:"What field is shared by both calls? What did the Lambda actually check? What makes a stolen token short-lived? What joins the two log streams?",
ex:"Both calls carry the same token <b>subject</b> (sub:alice) from two <b>source addresses</b> — a replay. The Lambda only <b>validates</b> signature and expiry, so replay is undetectable at the app layer; shorter token <b>expiry</b> plus refresh rotation shrinks the window. A stable <b>request ID</b> correlation between API Gateway and Lambda logs is what lets you reconstruct the full session later.",
ca:"same subject from two sources · signature-only validation · shorter expiry + rotation · request ID correlation"},
{id:'H29',th:5,type:'spot',
sc:"Cross-account log shipping: this destination policy lets the SIEM account put subscription filters against your log groups. Review it.",
code:"L1: aws logs put-destination-policy --destination-name to-siem \\\nL2:   --access-policy '{\nL3:     \"Effect\": \"Allow\",\nL4:     \"Principal\": { \"AWS\": \"*\" },\nL5:     \"Action\": \"logs:PutSubscriptionFilter\",\nL6:     \"Resource\": \"arn:aws:logs:eu-west-1:123456789012:destination:to-siem\",\nL7:     (no Condition block present)\nL8:   }'\nL9: # note from the author: no aws:SourceAccount condition,\nL10:# so partner accounts can send filters too — convenient",
q:"Select EVERY line that is a security mistake.",
c:["L4 — Principal * allows ANY account to attach subscription filters","L7 — the missing Condition block means no aws:SourceAccount scoping","L10 — the documented justification confirms the open grant is intentional","L3 — Effect Allow","L6 — the Resource line names the destination ARN","L5 — Action logs:PutSubscriptionFilter"],
a:[0,1,2],
hint:"One open principal, one missing condition, and a comment that admits it. The mechanical parts of the policy are fine.",
ex:"<b>L4</b> opens the destination to every AWS account; <b>L7</b> shows the missing <b>aws:SourceAccount</b> condition; <b>L10</b> admits the open grant is deliberate — any tenant could push filters into your log groups (log injection into the SIEM). L3, L5 and L6 are the mechanical parts of a correct, scoped policy: the fix is Principal = the SIEM account root plus a SourceAccount condition.",
ca:"Mistakes: Principal *, missing SourceAccount condition, the comment confirming it"},
