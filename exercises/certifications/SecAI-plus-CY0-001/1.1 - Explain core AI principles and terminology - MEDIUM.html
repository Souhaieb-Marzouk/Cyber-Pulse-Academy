slots:[{n:'CNN',x:'Excels on images and grid-like data.'},{n:'RNN / LSTM',x:'Reads sequences step by step and remembers short context.'},{n:'Transformer',x:'Uses attention, so it tracks long-range links in long text.'},{n:'GAN',x:'Two networks compete: one generates, one judges.'}],
items:['Classify malware families from byte-heatmap images','Score odd chains in API-call sequences','Summarize a 40-page threat report with long context','Generate synthetic phishing samples for safe training'],
c:[0,1,2,3]});

EX.push({id:'M8',type:'fill',th:1,t:'Inside the neural network',
sc:'Explain the phishing detector neural network to a new analyst. Fill the gaps.',
q:'Pick the correct term for each gap.',
alab:'PICK THE WORD FOR EACH GAP',hint:'Follow the flow: sum inputs, activate, send error back, step weights, repeat per full pass.',
expl:'Each neuron weights and squashes its inputs. Backpropagation works out how each weight caused the error, and gradient descent nudges the weights. An epoch is one complete pass through the data. The learning rate sets the step size and a batch is a small group of rows per update; a GPU simply does the math faster.',
text:'Each {0} adds up its inputs multiplied by {1} and passes the sum through an {2}. Training uses {3} to send the error backwards and {4} to update the weights. One full pass over all training rows is an {5}.',
bank:['neuron','weights','activation function','backpropagation','gradient descent','epoch','learning rate','batch size','GPU'],
correct:['neuron','weights','activation function','backpropagation','gradient descent','epoch'],
why:['A neuron is one unit that sums its inputs.','Weights are the learned multipliers.','The activation function adds non-linearity.','Backpropagation carries the error backwards.','Gradient descent updates weights downhill.','An epoch is one full pass over the data.']});

EX.push({id:'M9',type:'order',th:2,t:'Order the NLP pipeline',
sc:'Building a phishing-text classifier: the preprocessing steps lost their order.',
q:'Put the steps back into working order.',
alab:'DRAG TO ORDER',hint:'Clean first, cut into pieces, drop junk words, shorten words, then turn into numbers.',
expl:'Text must be cleaned, cut into tokens, stripped of stop words, and reduced to base forms before it becomes numbers. Vectorizing too early would freeze the noise into the features.',
items:['Lowercase and clean the raw email text','Split the text into tokens','Remove stop words such as the and and','Stem or lemmatize words to a base form','Vectorize with TF-IDF or word embeddings']});

EX.push({id:'M10',type:'match',th:2,t:'NLP technique or term',
sc:'New analysts keep mixing NLP words. Build the reference card for them.',
q:'Drag each description onto the term it defines.',
alab:'DRAG THE ITEMS',hint:'Four work on single words, one weighs words by rarity, one finds named things.',
expl:'Tokenization cuts, stemming chops by rule, lemmatization uses the dictionary. Stop words get dropped, TF-IDF weighs rarity, and NER finds named things such as domains and CVE IDs. A simple bag of words count works, but TF-IDF does better, and many mail models also count n-grams, short word sequences.',
slots:[{n:'Tokenization',x:'Cuts text into words or sub-word pieces.'},{n:'Stemming',x:'Chops endings by rule; can give odd forms like studi.'},{n:'Lemmatization',x:'Maps a word to its dictionary form, ran to run.'},{n:'Stop words',x:'Very common small words that add little meaning.'},{n:'TF-IDF',x:'Weighs words high when rare overall but frequent in one text.'},{n:'Named entity recognition (NER)',x:'Pulls things like IPs, domains and CVE IDs out of text.'}],
items:['Cuts text into words or sub-word pieces','Chops endings by rule; can give odd forms like studi','Maps ran to the dictionary word run','Filters tiny common words like the and of','Counts words and weighs rare ones higher','Finds domains, IPs and CVE IDs inside free text'],
c:[0,1,2,3,4,5]});

EX.push({id:'M12',type:'branch',th:3,t:'Triage the AI alert',
sc:'UEBA raises: user j.diaz copied 4.2 GB to a personal cloud drive, anomaly score 87 of 100. It is 14:40 on a Tuesday.',
q:'Work the alert the way the playbook intends: one decision at a time.',
alab:'ANSWER STEP BY STEP',hint:'Enrich first, escalate on the pattern, contain with a case and notification.',
expl:'Good AI-assisted alert triage runs enrich, decide, act. Enrichment turns a score into context. A notice-period user copying data out is a leak pattern. Containment then follows the playbook, with a case documented.',
steps:[
{p:'The alert lands in the queue. What do you do first?',o:['Open the ticket and enrich: user role, HR status, destination reputation','Delete the files on the personal drive at once','Ignore it; scores below 90 are noise','Disable every account in the finance team'],c:0,w:'Enrichment before action: context decides if this is a leak, a backup job, or a false alarm.'},
{p:'Enrichment: the destination is a known personal drive, DLP policy forbids it, and the user is in a notice period. Next?',o:['Escalate to IR as suspected exfiltration and preserve evidence','Wipe the laptop remotely','Email the user, ask if it was them, and close the ticket','Raise the alert threshold to 90'],c:0,w:'Notice period plus policy breach plus bulk copy is a classic exfiltration pattern; IR and evidence come next.'},
{p:'IR confirms attempted exfiltration. What does the SOAR playbook do now?',o:['Block the destination, quarantine the device, open a case, notify the data owner','Retrain the UEBA model immediately','Silence similar alerts for 24 hours','Do nothing until management meets'],c:0,w:'Containment, case creation and owner notification are the automated steps; retraining is not an incident action.'}]});

EX.push({id:'M13',type:'qcm',th:0,t:'Which learning builds the baseline?',
sc:'UEBA must learn what is normal for each user, but nobody has labeled any day as normal or malicious.',
q:'Which learning style fits building this baseline?',
alab:'CHOOSE ONE',hint:'The key sentence is: nobody has labeled anything.',
expl:'With zero labels, the model must find structure on its own. That is unsupervised learning, and it is how behavior baselines are built before any labels exist.',
o:['Unsupervised — find structure without labels','Supervised — train on labeled attack rows','Reinforcement — learn from a reward signal','Semi-supervised — lean on a big labeled core'],
c:0,
w:['Correct. Clustering and profiling from unlabeled behavior is unsupervised learning.','There are no labels to supervise with.','There is no environment handing out rewards here.','Semi-supervised still needs a labeled core, which does not exist.']});

EX.push({id:'M18',type:'fill',th:3,t:'Automation policy blanks',
sc:'Draft the AI-driven response standard for Meridian. The key words are missing from the policy sentences.',
q:'Pick the correct word for each gap.',
alab:'PICK THE WORD FOR EACH GAP',hint:'Approval, learning from verdicts, slow decay, the cure, fairness, and seeing reasons.',
expl:'Human-in-the-loop keeps risky actions supervised. Feedback loops and retraining fight drift. Bias testing and explainability keep the model fair and trusted by analysts and regulators.',
text:'Containment actions above risk level 3 require {0} approval. Analyst verdicts feed a {1} loop that improves detection. Accuracy sagging over months signals model {2}, fixed by scheduled {3}. The model must be tested for {4} so no user group is flagged unfairly, and analysts must be able to see why a model decided, which vendors call {5}.',
bank:['human-in-the-loop','feedback','drift','retraining','bias','explainability','orchestration','RPA','baseline'],
correct:['human-in-the-loop','feedback','drift','retraining','bias','explainability'],
why:['High-impact actions need a human approval step.','Verdicts returning to the model form a feedback loop.','Slow accuracy loss is called model drift.','Retraining on fresh data counters drift.','Bias means unequal treatment of groups.','Seeing why a model decided is explainability.']});

EX.push({id:'M19',type:'dual',th:4,t:'Same alert, two hats',
sc:'Proxy log: six 401 failures from one external IP, then one success, then a quiet GET to cdn-stats[.]example every 60 seconds with an identical User-Agent string.',
q:'Read it once as the defender, once as the attacker.',
alab:'CHOOSE ONE PER VIEW',hint:'Blue: read the pattern shape. Red: change what the detector keys on.',
expl:'Blue sees credential guessing followed by beacon-like callbacks to a fixed domain. Red knows the log model keys on identical fingerprints and fixed intervals, so an evasion attack means varying both. This cat-and-mouse is the heart of adversarial thinking, and a tiny crafted change to inputs is called an adversarial example.',
parts:[
{t:'BLUE TEAM VIEW',p:'What is the most likely read of this traffic?',o:['Password spray success plus a beacon to a C2-like domain','A patch scan from the IT team','Load balancer health checks','A backup job to cloud storage'],c:0,w:'Failures then success is credential guessing; the fixed 60-second GET to a look-alike domain looks like beaconing.'},
{t:'RED TEAM VIEW',p:'The SOC NLP log model flags identical User-Agent strings. As the attacker, what do you change next?',o:['Vary the User-Agent and jitter the beacon intervals','Send beacons every second to look busy','Keep the exact same User-Agent','Move all beacons to exactly 00:00'],c:0,w:'The detector keys on sameness; vary the fingerprint and the timing to evade it.'}]});

EX.push({id:'M20',type:'multi',th:3,t:'What automation really gives a SOC',
sc:'The SOC lead is writing the automation business case for the budget meeting.',
q:'Select every benefit that is actually true.',
alab:'SELECT ALL THAT APPLY',hint:'Four are real; three oversell.',
expl:'Automation buys speed, consistency, coverage and analyst time. It does not remove humans, false positives, or the chance of misses.',
o:['Faster handling of repetitive, high-volume alerts','Consistent, repeatable process on every shift','Frees analysts for hunting and complex cases','Works around the clock without fatigue','Removes the need for human analysts','Eliminates all false positives','Guarantees that no attack is ever missed'],
c:[0,1,2,3],
w:['Speed on volume is the core automation win.','Bots run the same steps every time.','Humans move to judgment work.','Automation does not sleep.','Automation assists analysts; it does not replace judgment.','Bots inherit false positives from their rules and models.','Detection quality limits automation, not the other way round.']});

EX.push({id:'M21',type:'spot',th:2,t:'Broken preprocessing code',
sc:'A trainee preprocessed the email corpus for the spam model. Two lines leak data and will fake the offline score.',
q:'Click the two wrong lines.',
alab:'CLICK THE WRONG LINES',hint:'Test data must touch nothing before final evaluation.',
expl:'The vectorizer must learn vocabulary from training rows only, and test labels must stay out of training. Both lines leak test information into training, which is data leakage, and the score will collapse in production.',
lines:["tokens = tokenize(lower(raw_emails))","stems = lemmatize(tokens)","vec.fit(train_rows + test_rows)  # fit on everything","clean = drop_stopwords(stems)","labels = labels + test_labels        # merge test labels in","model.fit(vec, clean, labels)"],
bad:[2,4],
why:['Fitting the vectorizer on test rows leaks test vocabulary into training.','Merging test labels into training labels corrupts evaluation.']});

EX.push({id:'M22',type:'qcm',th:4,t:'The deepfake call',
sc:'The CFO joins a video call; face and voice match, and an urgent wire to a new supplier account is requested. There is a slight lip-sync lag, and the change request also arrived by email from supp1iers-pay[.]example.',
q:'What is the best immediate action?',
alab:'CHOOSE ONE',hint:'Never verify inside the channel the attacker controls.',
expl:'Cloned voice and face are cheap GAN tricks, so a match proves nothing. Verification must leave the attacker channel: call the saved internal number and freeze the payment first.',
o:['Freeze the transfer and call the CFO back on the saved internal number','Approve it: face and voice both matched','Reply to that email asking whether it is really them','Announce the fraud risk on social media'],
c:0,
w:['Correct. Out-of-band verification on a known channel is the core deepfake defense.','Voice and face can both be cloned; matches prove nothing.','The email channel is attacker-controlled; replies go straight to the fraudster.','Social media leaks the incident and helps nobody.']});

alab:'ANSWER STEP BY STEP',hint:'Measure, retrain fresh, and rule out poisoning.',

{p:'Confirmed: new lure kits changed the input distribution. Choose the fix path.',o:['Retrain on fresh labeled data, then re-validate on the hold-out set','Retrain on the same old dataset','Switch the model off until next quarter','Ignore it and hope'],c:0,w:'A new distribution needs new examples; the hold-out re-check proves the fix.'},

{p:'What should the playbook have used?',o:['Tiered response: auto-collect evidence, human approval before quarantine','More automation with no gates','No automation at all, ever','Random actions to confuse attackers'],c:0,w:'A tiered design automates safe steps and gates risky ones behind approval; the model inventory entry should define these limits.'},

var S=null,TID=null,TOTAL=CONF.minutes*60,DSI=-1,MB=null,UNAME='';
function el(x){return document.getElementById(x)}
function idx(n){var a=[],i;for(i=0;i<n;i++)a.push(i);return a}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}
function fmtT(s){var m=Math.floor(s/60),x=s%60;return(m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function LET(i){return 'ABCDEFGHIJ'.charAt(i)}
function card(c,l,b){return '<div class="card '+c+'"><div class="lab">'+l+'</div>'+b+'</div>'}
function nl(s){return esc(s).replace(/\n/g,'<br>')}
function newS(){return{order:shuf(idx(EX.length)),cur:0,ans:{},perm:{},res:{},chk:{},skp:{},hnt:{},cp:false,mp:false,left:TOTAL,done:false,rep:false}}
function curO(){return S.order[S.cur]}
function exEarned(o){if(!S.chk[o]||!S.res[o])return 0;var e=S.res[o].earned;if(S.hnt[o])e*=0.9;return Math.max(0,e)}
function scoreSum(){var s=0,i;for(i=0;i<EX.length;i++)s+=exEarned(i);return s}

 buildNav();goto(0);hud();
 if(TID)clearInterval(TID);TID=setInterval(tick,1000);}
function tick(){if(!S||S.done)return;if(S.cp||S.mp)return;S.left--;if(S.left<=0){S.left=0;paintTimer();finish();return}paintTimer()}

function next(){if(!S)return;S.cp=false;
 if(S.cur<EX.length-1){goto(S.cur+1)}
 else{showModal('Last exercise','<p>That was the final exercise.</p><p>You can still go back to skipped exercises, or submit the exam.</p>',[['Stay here',closeModal],['Submit exam',function(){closeModal();askSubmit()}]])}
 hud()}

function hud(){if(!S)return;

/* ============ renderers, grading, feedback, results ============ */
function initAns(o){var ex=EX[o],a={},P={p:[]},i;
 if(ex.type==='qcm'||ex.type==='multi'){a.sel=(ex.type==='multi')?[]:null;P.p=shuf(idx(ex.o.length))}
 else if(ex.type==='match'){a.pick=null;a.place={};P.p=shuf(idx(ex.items.length))}
 else if(ex.type==='fill'){a.vals={};P.p=[];for(i=0;i<ex.correct.length;i++)P.p.push(shuf(idx(ex.bank.length)))}
 else if(ex.type==='order'){a.seq=shuf(idx(ex.items.length))}
 else if(ex.type==='spot'){a.fl={}}
 else if(ex.type==='terminal'){a.cmd='';a.ok=false;a.out=''}
 else if(ex.type==='logview'){a.f='';a.sel=(ex.q.k==='multi')?[]:null;P.p=shuf(idx(ex.q.o.length))}
 else if(ex.type==='branch'){a.steps={};P.p=[];for(i=0;i<ex.steps.length;i++)P.p.push(shuf(idx(ex.steps[i].o.length)))}
 else if(ex.type==='dual'){a.parts={};P.p=[];for(i=0;i<ex.parts.length;i++)P.p.push(shuf(idx(ex.parts[i].o.length)))}
 S.ans[o]=a;S.perm[o]=P;return a}

function optsRender(src,perm,sel,isMulti,name,lk){var h='',i;
 for(i=0;i<perm.length;i++){var j=perm[i],ck=isMulti?(sel.indexOf(j)>=0):(sel===j);
  h+='<label class="opt" data-o="'+j+'"><input type="'+(isMulti?'checkbox':'radio')+'" name="'+name+'" value="'+j+'"'+(ck?' checked':'')+(lk?' disabled':'')+'><span class="ol">'+LET(i)+'</span><span class="otx">'+esc(src.o[j])+'</span><span class="mark" data-m="'+j+'"></span></label>'}
 return h}

function hl(l){var s=esc(l);
 s=s.replace(/^(\[[^\]]+\]|\d{2}:\d{2}(:\d{2})?)/,'<span class="tk-t">$1</span>');
 s=s.replace(/\b(INFO|WARN|ERROR|DEBUG)\b/g,'<span class="tk-l">$1</span>');
 s=s.replace(/\b(PHISH|CLEAN|MALICIOUS|HIGH|LOW|BLOCKED)\b/g,'<span class="tk-w">$1</span>');
 return s}

function logBody(ex,o,a,P,lk){
 var h='<input class="flt" data-t="lf" placeholder="Filter events (plain text or /regex/)" value="'+esc(a.f)+'" aria-label="Filter log events">';
 h+='<div class="logbox" id="logbox">';
 for(var i=0;i<ex.logs.length;i++)h+='<div class="lg" data-ln="'+i+'">'+hl(ex.logs[i])+'</div>';
 h+='</div><div class="qin">'+optsRender(ex.q,P.p,a.sel,ex.q.k==='multi','q'+o,lk)+'</div>';
 return h}

function matchBody(ex,o,a,P,lk){var placed={},k;
 for(k in a.place)placed[a.place[k]]=1;
 var h='<p class="dim">Drag an item into a zone, or click an item then click a zone. Click a placed item to send it back.</p><div class="items">';
 for(var i=0;i<P.p.length;i++){var j=P.p[i];if(placed[j])continue;
  h+='<span class="item'+(a.pick===j?' sel':'')+'" data-t="itm" data-v="'+j+'" draggable="'+(!lk)+'" tabindex="0" role="button" aria-label="Item: '+esc(trunc(ex.items[j],60))+'">'+esc(ex.items[j])+'</span>'}
 h+='</div><div class="slgrid">';
 for(i=0;i<ex.slots.length;i++){
  var inner=(a.place[i]==null)?'<span class="dim">drop zone</span>':'<span class="item in" data-t="rm" data-v="'+i+'" role="button" tabindex="0" aria-label="Remove this item">'+esc(trunc(ex.items[a.place[i]],56))+' ✕</span>';
  h+='<div class="slot" data-t="slt" data-v="'+i+'" tabindex="0" role="button" aria-label="Drop zone: '+esc(ex.slots[i].n)+'"><div class="slab">'+esc(ex.slots[i].n)+'</div><div class="sbody">'+inner+'</div><span class="mark" data-m="s'+i+'"></span></div>'}
 h+='</div>';return h}

function fillBody(ex,o,a,P,lk){var t=esc(ex.text),i;
 t=t.replace(/\{(\d)\}/g,function(m,d){var b=+d,k,val=a.vals[b]||'';
  var opts='<option value=""'+(val===''?' selected':'')+'">— choose —</option>';
  for(k=0;k<P.p[b].length;k++){var w=ex.bank[P.p[b][k]];opts+='<option value="'+esc(w)+'"'+(val===w?' selected':'')+'>'+esc(w)+'</option>'}
  return '<span class="selwrap"><select data-t="fb" data-v="'+b+'" aria-label="Gap '+(b+1)+'"'+(lk?' disabled':'')+'>'+opts+'</select><span class="mark" data-m="f'+b+'"></span></span>'});
 var bank='<div class="lab" style="margin-top:10px">Word bank (shuffled)</div><div class="kw">';
 for(i=0;i<ex.bank.length;i++)bank+='<span>'+esc(ex.bank[i])+'</span>';
 bank+='</div>';
 return '<div class="filltx">'+t+'</div>'+bank}

function orderBody(ex,o,a,lk){var h='<p class="dim">Drag rows, or use the arrow buttons, then Check.</p>';
 for(var i=0;i<a.seq.length;i++){var j=a.seq[i];
  h+='<div class="rw" draggable="'+(!lk)+'" data-t="row" data-v="'+i+'"><span class="hnd">⠿</span><span class="posn">'+(i+1)+'</span><span class="rtx">'+esc(ex.items[j])+'</span><span class="mbtns"><button class="btn sm" data-t="up" data-v="'+i+'" aria-label="Move up"'+(lk?' disabled':'')+'>▲</button><button class="btn sm" data-t="dn" data-v="'+i+'" aria-label="Move down"'+(lk?' disabled':'')+'>▼</button></span><span class="mark" data-m="o'+i+'"></span></div>'}
 return h}

function spotBody(ex,o,a,lk){var h='<p class="dim">Click every line you believe is wrong. You may flag several.</p>';
 for(var i=0;i<ex.lines.length;i++){var f=!!a.fl[i];
  h+='<div class="lg row'+(f?' flg':'')+'" data-t="line" data-v="'+i+'" role="button" tabindex="0" aria-pressed="'+f+'"><span class="box">'+(f?'☑':'☐')+'</span><code>'+esc(ex.lines[i])+'</code><span class="mark" data-m="p'+i+'"></span></div>'}
 return h}

function termBody(ex,o,a,lk){
 var h='<div class="term"><div class="tt">— '+esc(ex.file)+' —</div><pre class="cat">'+esc(ex.content.join('\n'))+'</pre>';
 h+='<div class="tt">— your session —</div><div class="tout" id="tout" aria-live="polite">'+a.out+'</div>';
 h+='<div class="crow"><span class="ps1">analyst@soc:~$</span><input class="cin" data-t="cmd" value="'+esc(a.cmd)+'" '+(lk?'disabled':'')+' aria-label="Type your command" spellcheck="false"></div>';
 h+='<button class="btn sm" data-t="run"'+(lk?' disabled':'')+'>Run</button></div>';

function branchBody(ex,o,a,P,lk){var h='',i;
 for(i=0;i<ex.steps.length;i++){if(i>0&&a.steps[i-1]==null)break;
  var st=ex.steps[i];
  h+='<div class="step"><div class="slab">STEP '+(i+1)+' OF '+ex.steps.length+'</div><p>'+esc(st.p)+'</p>'+optsRender(st,P.p[i],a.steps[i],false,'q'+o+'s'+i,lk)+'<span class="mark" data-m="t'+i+'"></span></div>'}
 h+='<p class="dim">Each answer reveals the next step, like a real response workflow.</p>';
 return h}

function dualBody(ex,o,a,P,lk){var h='',i;
 for(i=0;i<ex.parts.length;i++){var pt=ex.parts[i];
  h+='<div class="step '+(i===0?'pblue':'pred')+'"><div class="slab">'+esc(pt.t)+'</div><p>'+esc(pt.p)+'</p>'+optsRender(pt,P.p[i],a.parts[i],false,'q'+o+'p'+i,lk)+'<span class="mark" data-m="t'+i+'"></span></div>'}

function bodyHTML(ex,o,a,P,lk){switch(ex.type){
 case 'qcm':return optsRender(ex,P.p,a.sel,false,'q'+o,lk);
 case 'multi':return optsRender(ex,P.p,a.sel,true,'q'+o,lk);
 case 'logview':return logBody(ex,o,a,P,lk);
 case 'match':return matchBody(ex,o,a,P,lk);
 case 'fill':return fillBody(ex,o,a,P,lk);
 case 'order':return orderBody(ex,o,a,lk);
 case 'spot':return spotBody(ex,o,a,lk);
 case 'terminal':return termBody(ex,o,a,lk);
 case 'branch':return branchBody(ex,o,a,P,lk);
 case 'dual':return dualBody(ex,o,a,P,lk)}
 return ''}

function renderEx(){var pos=S.cur,o=curO(),ex=EX[o],lk=!!S.chk[o];
 var a=S.ans[o]||initAns(o),P=S.perm[o],h='';
 h+='<div class="exh"><span class="chip">Exercise '+(pos+1)+' of '+EX.length+'</span><span class="chip tt2">'+esc(ex.t)+'</span><span class="chip dim2">'+esc(themeName(ex.th))+'</span></div>';
 h+=card('scen','SCENARIO',nl(ex.sc));
 h+=card('quest','QUESTION',nl(typeof ex.q==='string'?ex.q:ex.qt));
 h+='<div class="card ans"><div class="lab">'+esc(ex.alab)+'</div>'+bodyHTML(ex,o,a,P,lk)+'</div>';
 if(S.hnt[o])h+=card('hintbox','HINT — COSTS 10% OF THIS EXERCISE','<p>'+esc(ex.hint)+'</p>');
 if(lk&&S.res[o])h+=fbHTML(ex,o,a,P,S.res[o]);

function compute(o){var ex=EX[o],a=S.ans[o],els=[],hits=0,n=0,i,g,cs,sel,acc,rx,q;
 if(ex.type==='qcm'){n=1;g=a.sel===ex.c;els=[{s:g?'ok':'bad',v:a.sel}];hits=g?1:0}
 else if(ex.type==='multi'){cs={};for(i=0;i<ex.c.length;i++)cs[ex.c[i]]=1;n=ex.c.length;
  for(i=0;i<ex.o.length;i++){sel=a.sel.indexOf(i)>=0;
   if(sel&&cs[i]){els.push({s:'ok',v:i});hits++}else if(sel)els.push({s:'bad',v:i});else if(cs[i])els.push({s:'miss',v:i})}}
 else if(ex.type==='match'){n=ex.slots.length;
  for(i=0;i<n;i++){g=a.place[i]===ex.c[i];els.push({s:g?'ok':'bad',v:i});if(g)hits++}}
 else if(ex.type==='fill'){n=ex.correct.length;
  for(i=0;i<n;i++){g=a.vals[i]===ex.correct[i];els.push({s:g?'ok':'bad',v:i});if(g)hits++}}
 else if(ex.type==='order'){n=a.seq.length;
  for(i=0;i<n;i++){g=a.seq[i]===i;els.push({s:g?'ok':'bad',v:i});if(g)hits++}}
 else if(ex.type==='spot'){cs={};for(i=0;i<ex.bad.length;i++)cs[ex.bad[i]]=1;n=ex.bad.length;
  for(i=0;i<ex.lines.length;i++){
   if(a.fl[i]&&cs[i]){els.push({s:'ok',v:i});hits++}
   else if(a.fl[i])els.push({s:'bad',v:i});
   else if(cs[i])els.push({s:'miss',v:i})}}
 else if(ex.type==='terminal'){n=1;acc=false;
  for(i=0;i<ex.a.length;i++){try{rx=new RegExp(ex.a[i],'i')}catch(e){continue}if(rx.test(a.cmd)){acc=true;break}}
  a.ok=acc;els=[{s:acc?'ok':'bad',v:null}];hits=acc?1:0}
 else if(ex.type==='logview'){q=ex.q;
  if(q.k==='qcm'){n=1;g=a.sel===q.c;els=[{s:g?'ok':'bad',v:a.sel}];hits=g?1:0}
  else{cs={};for(i=0;i<q.c.length;i++)cs[q.c[i]]=1;n=q.c.length;
   for(i=0;i<q.o.length;i++){sel=a.sel.indexOf(i)>=0;
    if(sel&&cs[i]){els.push({s:'ok',v:i});hits++}else if(sel)els.push({s:'bad',v:i});else if(cs[i])els.push({s:'miss',v:i})}}}
 else if(ex.type==='branch'){n=ex.steps.length;
  for(i=0;i<n;i++){g=a.steps[i]===ex.steps[i].c;els.push({s:g?'ok':'bad',v:i});if(g)hits++}}
 else if(ex.type==='dual'){n=ex.parts.length;
  for(i=0;i<n;i++){g=a.parts[i]===ex.parts[i].c;els.push({s:g?'ok':'bad',v:i});if(g)hits++}}
 return{els:els,earned:n?(hits/n):0,n:n}}

function multiSummary(sel,perm,src){return sel.map(function(j){return LET(perm.indexOf(j))+' '+trunc(src[j],22)}).join(', ')}
function ansSummary(ex,o){var a=S.ans[o],P=S.perm[o],i,s;
 if(ex.type==='qcm')return a.sel==null?'—':LET(P.p.indexOf(a.sel))+'. '+trunc(ex.o[a.sel],36);
 if(ex.type==='multi')return a.sel.length?multiSummary(a.sel,P.p,ex.o):'—';
 if(ex.type==='logview')return (a.sel&&a.sel.length)?multiSummary(a.sel,P.p,ex.q.o):'—';
 if(ex.type==='match'){s=[];for(i=0;i<ex.slots.length;i++)s.push(trunc(ex.slots[i].n,16)+'→'+(a.place[i]==null?'∅':trunc(ex.items[a.place[i]],18)));return s.join('; ')}
 if(ex.type==='fill'){s=[];for(i=0;i<ex.correct.length;i++)s.push(a.vals[i]||'∅');return s.join(', ')}
 if(ex.type==='order')return a.seq.map(function(x){return x+1}).join('→');
 if(ex.type==='spot'){s=[];for(i=0;i<ex.lines.length;i++)if(a.fl[i])s.push(i+1);return s.length?('lines '+s.join(', ')):'—'}
 if(ex.type==='terminal')return a.cmd?trunc(a.cmd,44):'—';
 if(ex.type==='branch'){s=[];for(i=0;i<ex.steps.length;i++)s.push((i+1)+LET(P.p[i].indexOf(a.steps[i])));return s.join(' ')}
 if(ex.type==='dual'){var d=[];for(i=0;i<ex.parts.length;i++)d.push(LET(P.p[i].indexOf(a.parts[i])));return 'Blue '+d[0]+' / Red '+d[1]}
 return '—'}
function corrSummary(ex,o){var P=S.perm[o],i,s;
 if(ex.type==='qcm')return LET(P.p.indexOf(ex.c))+'. '+trunc(ex.o[ex.c],36);
 if(ex.type==='multi')return multiSummary(ex.c,P.p,ex.o);
 if(ex.type==='logview')return multiSummary(ex.q.c,P.p,ex.q.o);
 if(ex.type==='match'){s=[];for(i=0;i<ex.slots.length;i++)s.push(trunc(ex.slots[i].n,16)+'→'+trunc(ex.items[ex.c[i]],18));return s.join('; ')}
 if(ex.type==='fill')return ex.correct.join(', ');
 if(ex.type==='order')return ex.items.map(function(x,k){return (k+1)+'='+trunc(x,18)}).join('; ');
 if(ex.type==='spot')return 'lines '+ex.bad.map(function(b){return b+1}).join(', ');
 if(ex.type==='terminal')return ex.canon;
 if(ex.type==='branch'){s=[];for(i=0;i<ex.steps.length;i++)s.push((i+1)+LET(P.p[i].indexOf(ex.steps[i].c)));return s.join(' ')}
 if(ex.type==='dual'){var d=[];for(i=0;i<ex.parts.length;i++)d.push(LET(P.p[i].indexOf(ex.parts[i].c)));return 'Blue '+d[0]+' / Red '+d[1]}
 return '—'}

 if(ex.type==='qcm'||ex.type==='multi'){var arr=(ex.type==='qcm')?[ex.c]:ex.c;

 else if(ex.type==='match')for(i=0;i<ex.slots.length;i++)li+='<p><b>✓ '+esc(ex.slots[i].n)+'</b> → '+esc(trunc(ex.items[ex.c[i]],50))+' — '+esc(ex.slots[i].x)+'</p>';
 else if(ex.type==='fill')for(i=0;i<ex.correct.length;i++)li+='<p><b>✓ Gap '+(i+1)+' = '+esc(ex.correct[i])+'</b> — '+esc(ex.why[i])+'</p>';
 else if(ex.type==='order')for(i=0;i<ex.items.length;i++)li+='<p><b>'+(i+1)+'.</b> '+esc(ex.items[i])+'</p>';
 else if(ex.type==='spot')for(i=0;i<ex.bad.length;i++)li+='<p><b>✗ Line '+(ex.bad[i]+1)+':</b> '+esc(ex.why[i])+'</p>';
 else if(ex.type==='branch')for(i=0;i<ex.steps.length;i++)li+='<p><b>Step '+(i+1)+':</b> '+esc(ex.steps[i].w)+'</p>';

 return li}

function buildResults(){var i,ansd=[],skl=[];
 for(i=0;i<EX.length;i++)if(!S.ans[i])initAns(i);
 for(i=0;i<EX.length;i++){if(S.chk[i])ansd.push(i);else if(S.skp[i])skl.push(i)}
 var a=ansd.length,sum=0;

 var sc=Math.round(sum),pct=a?Math.round(sc/a*100):0,ok=pct>=CONF.pass;
 var thE={},thP={};

 var tk='';
 for(i=0;i<THEMES.length;i++){var e2=thE[i]||0,p2=thP[i]||0;tk+='<span class="chip">'+esc(THEMES[i].n)+': '+(Math.round(e2*10)/10)+' / '+p2+'</span>'}
 h+=card('scen','Score by theme (answered exercises only)','<div class="kw">'+tk+'</div>');
 h+='<h3>Per-exercise report</h3><table class="rep"><thead><tr><th>#</th><th>Exercise</th><th>Your answer</th><th>Correct</th><th>Points</th><th>Verdict</th></tr></thead><tbody>';
 for(i=0;i<EX.length;i++){var pos=S.order.indexOf(i),ex=EX[i],e3=exEarned(i),lab;

  h+='<tr class="explrow"><td colspan="6"><details><summary>Explanation</summary><div class="exd"><p>'+esc(ex.expl)+'</p>'+detailEls(ex,i)+'</div></details></td></tr>'}
 h+='</tbody></table>';
 el('res').innerHTML=h;
 el('retakeB').addEventListener('click',retake)}

function bindStage(){var st=el('stage');
 st.addEventListener('click',function(e){if(!S||S.done)return;var o=curO(),ex=EX[o];if(S.chk[o])return;
  var t=e.target.closest('[data-t]');if(!t)return;
  var k=t.getAttribute('data-t'),v=t.getAttribute('data-v'),a=S.ans[o],i,rx,acc,p,q,tmp;
  if(k==='itm'){a.pick=(a.pick===+v)?null:+v;renderEx();
   var ni=st.querySelector('.item[data-t="itm"][data-v="'+v+'"]');if(ni)ni.focus()}
  else if(k==='slt'){if(a.pick!=null){a.place[+v]=a.pick;a.pick=null;renderEx();
   var pi=st.querySelector('.slot[data-v="'+v+'"] .item.in');if(pi)pi.focus()}}
  else if(k==='rm'){var wasIdx=a.place[+v];delete a.place[+v];renderEx();
   var ri=st.querySelector('.item[data-t="itm"][data-v="'+wasIdx+'"]');if(ri)ri.focus()}
  else if(k==='up'||k==='dn'){p=+v;q=(k==='up')?p-1:p+1;if(q<0||q>=a.seq.length)return;tmp=a.seq[p];a.seq[p]=a.seq[q];a.seq[q]=tmp;renderEx();
   var nb=st.querySelector('button[data-t="'+k+'"][data-v="'+q+'"]');if(nb)nb.focus()}
  else if(k==='line'){a.fl[+v]=!a.fl[+v];renderEx();
   var li2=st.querySelector('[data-t="line"][data-v="'+v+'"]');if(li2)li2.focus()}
  else if(k==='run'){var cmd=(a.cmd||'').trim();acc=false;
   for(i=0;i<ex.a.length;i++){try{rx=new RegExp(ex.a[i],'i')}catch(e2){continue}if(rx.test(cmd)){acc=true;break}}
   a.ok=acc;
   a.out='<div class="tl">$ '+esc(cmd)+'</div>'+(acc?ex.out.map(function(l){return '<div class="tl okl">'+esc(l)+'</div>'}).join(''):'<div class="tl err">no output — the command does not match the task wording</div>');
   renderEx()}});
 st.addEventListener('change',function(e){if(!S||S.done)return;var o=curO(),ex=EX[o];if(S.chk[o])return;
  var g=e.target,a=S.ans[o],j2,ix;
  if(g.matches('select[data-t=fb]')){a.vals[+g.getAttribute('data-v')]=g.value;return}
  if(!g.name)return;
  if(g.name==='q'+o){
   var isM=(ex.type==='multi')||(ex.type==='logview'&&ex.q.k==='multi');
   if(isM){j2=+g.value;ix=a.sel.indexOf(j2);if(g.checked&&ix<0)a.sel.push(j2);if(!g.checked&&ix>=0)a.sel.splice(ix,1)}
   else{a.sel=+g.value}
   return}
  var mS=/^q\d+s(\d+)$/.exec(g.name);
  if(mS){a.steps[+mS[1]]=+g.value;renderEx();return}
  var mP=/^q\d+p(\d+)$/.exec(g.name);
  if(mP)a.parts[+mP[1]]=+g.value});
 st.addEventListener('input',function(e){if(!S||S.done)return;var o=curO();if(S.chk[o])return;var g=e.target;
  if(g.matches('[data-t=lf]')){var a=S.ans[o];a.f=g.value;filterLogs(EX[o],a.f)}
  else if(g.matches('[data-t=cmd]')){S.ans[o].cmd=g.value}});
 st.addEventListener('dragstart',function(e){if(!S||S.done)return;var t=e.target.closest('[data-t]');if(!t)return;var o=curO();if(S.chk[o])return;
  var k=t.getAttribute('data-t');
  if(k==='itm'||k==='row'){DSI=+t.getAttribute('data-v');try{e.dataTransfer.setData('text/plain',String(DSI))}catch(x){}}});
 st.addEventListener('dragover',function(e){if(!S||S.done)return;var t=e.target.closest('[data-t]');if(!t)return;
  var k=t.getAttribute('data-t');if(k==='slt'||k==='row')e.preventDefault()});
 st.addEventListener('drop',function(e){if(!S||S.done)return;var t=e.target.closest('[data-t]');if(!t)return;
  var o=curO();if(S.chk[o])return;var k=t.getAttribute('data-t'),a=S.ans[o];
  if(k==='slt'&&DSI>=0){a.place[+t.getAttribute('data-v')]=DSI;DSI=-1;a.pick=null;renderEx()}
  else if(k==='row'&&DSI>=0){var from=DSI,to=+t.getAttribute('data-v');
   if(from!==to){var x=a.seq.splice(from,1)[0];a.seq.splice(to,0,x)}
   DSI=-1;renderEx()}});
 st.addEventListener('keydown',function(e){if(!S||S.done)return;
  if(e.key!=='Enter'&&e.key!==' ')return;
  var t=e.target.closest('[data-t]');if(!t)return;
  var k=t.getAttribute('data-t');
  if(k==='itm'||k==='slt'||k==='line'||k==='rm'){e.preventDefault();t.click()}})}

function filterLogs(ex,f){var box=el('logbox');if(!box)return;var rx=null,i;
 if(f&&f.length>2&&f.charAt(0)==='/'&&f.charAt(f.length-1)==='/'){try{rx=new RegExp(f.slice(1,-1),'i')}catch(e){rx=null}}
 var ls=box.querySelectorAll('.lg');
 for(i=0;i<ls.length;i++){var txt=ex.logs[i]||'';
  var show=!f||(rx?rx.test(txt):(txt.toLowerCase().indexOf(f.toLowerCase())>=0));
  ls[i].style.display=show?'':'none'}}
initStatic();

  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
