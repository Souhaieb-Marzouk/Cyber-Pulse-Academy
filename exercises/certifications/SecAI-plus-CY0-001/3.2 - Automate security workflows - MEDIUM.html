var EXAM={"themes":[{"id":"A","name":"AI event triage","kws":["Event/alert triage","True / false / benign positive","Alert fatigue & noise reduction","Deduplication & aggregation","Confidence & risk scoring","Precision, recall & F1","Threshold tuning","Alert prioritization (P1–P4)","IOC & context enrichment","UEBA baselines & peer groups","LLM-assisted triage & hallucination risk"]},{"id":"B","name":"Alert correlation","kws":["Alert correlation","Multi-stage attack chains","Entity linking","Time-window correlation","Correlation rule logic (AND/sequence)","ATT&CK tactics & techniques","Anomaly detection","Beaconing & jitter detection","Suppression & rule tuning","Case building","TIP / STIX / TAXII intel matching"]},{"id":"C","name":"Response orchestration (SOAR)","kws":["SOAR platforms","Playbooks vs runbooks","Human-in-the-loop approval","Containment actions","Eradication & recovery","Rollback & guardrails","Break-glass procedures","Case management & ticketing","Webhook / API integration","Forensic-safe evidence handling"]},{"id":"D","name":"Metrics, governance & automation safety","kws":["MTTD & MTTR","FPR & confusion matrix","Feedback loops & retraining","Model drift","Least privilege for automation","Secrets management","Audit trails","Change control & shadow mode","Explainability & over-reliance","Prompt injection & PII care","Defanged IOC reporting"]}],"blurb":"You are on shift as a SOC analyst. This MEDIUM exam trains objective 3.2 of CompTIA SecAI+ (CY0-001): integrating AI for event triage, alert correlation, and response orchestration. Expect guided multi-step exercises with realistic vendor-neutral and AWS-native artefacts — GuardDuty findings, CloudTrail events, VPC flow logs, SOAR playbooks, Athena and terminal work — plus AI-triage judgement calls. Distractors are tricky, but every correct path is reachable with careful reasoning.","howto":["Press <b>Check</b> to grade and lock your answer. The timer pauses in <b>review mode</b> until you press <b>Next</b> — feedback marks and the explanation stay fully visible while paused.","<b>Revise</b> unlocks a checked exercise for editing; your last validated score stands until you press Check again.","<b>Skip</b> moves on without scoring. You can return to any skipped exercise before the exam ends; skipped exercises are excluded from the score (removed from both numerator and denominator).","<b>Pause</b> (manual) hides the exercise and freezes the clock. The Check-pause is separate: it shows feedback and only ends with Next. The two pause reasons can stack.","Multi-answer exercises earn <b>partial credit per correct element</b>. Wrong picks never subtract — they simply earn nothing.","A <b>hint</b> reveals a nudge, never the answer, and costs 10% of that exercise's points per use.","Pass mark is <b>70%</b>. Final score = earned points ÷ points of non-skipped exercises, rounded once.","On retake, the exercise order and all answer choices reshuffle."],"exercises":[{"id":"m01","type":"classify","theme":"A","timeSec":150,"title":"Morning queue: disposition eight overnight alerts","scenario":"<p>You are Tier 1 on the 06:00 shift. The SIEM collected eight alerts overnight. Your triage decision feeds the AI scoring model, so wrong labels train it badly. Work each alert against its context.</p>","question":"<p>Place every alert into the correct bucket. Definitions: <b>false positive</b> = the detection fired on something that was never a threat; <b>benign positive</b> = the activity really happened and matches the rule, but it is approved or expected; <b>true positive</b> = malicious activity.</p>","buckets":[{"id":"tp","label":"True positive"},{"id":"fp","label":"False positive"},{"id":"bp","label":"Benign positive"}],"items":[{"t":"GuardDuty: crypto-miner binary executed by svc_jenkins; outbound call to 203[.]0[.]113.9:8443","b":"tp"},{"t":"CloudWatch anomaly: CPU 92% for 40 min on fin-report-01 during the scheduled month-end batch window","b":"bp"},{"t":"Root user console sign-in from a new country, no MFA, at 02:13 local","b":"tp"},{"t":"Impossible travel: m.chen signed in from NYC then Lisbon 12 minutes apart, new device","b":"tp"},{"t":"WAF blocked SQLi patterns on the marketing site; source is the approved scanner vendor","b":"bp"},{"t":"SIEM 'C2 beacon' rule fired: host synced its clock with time[.]windows[.]com over NTP","b":"fp"},{"t":"Macie: S3 bucket customer-export became public; 41,000 objects exposed","b":"tp"},{"t":"UnusualAPICall model fired on a CI/CD runner added last week; baseline was not retrained after the change","b":"fp"}],"explain":"<p><b>True positives</b> combine an attacker pattern with risky context: the miner calling out to 203[.]0[.]113.9, a root login without MFA from a new country, impossible travel with a new device, and a bucket that went public. <b>Benign positives</b> are real events that match the rule but are approved: the month-end batch window and the approved scanner (a real attack tool, used with permission — that is why it is not a false positive). <b>False positives</b> are broken detections: NTP clock sync is normal traffic, and the new CI/CD runner only tripped a stale baseline. Feed every disposition back to the model, and put the benign positives on an allowlist with an owner and an expiry date.</p>","hints":["Two alerts are allowed activity that genuinely matches the rule (benign positive). Two are detections on things that were never a threat (false positive).","For each alert ask: did the activity happen, and was it approved?"],"tip":"Re-learn the three dispositions: FP = bad detection, benign positive = real but approved activity, TP = malicious."},{"id":"m02","type":"fillblank","theme":"A","timeSec":130,"title":"Complete the AI triage pipeline description","scenario":"<p>Your SOC is wiring a new triage pipeline: SIEM events flow through a deduplication stage, a scoring model, a Bedrock-powered summarizer, and finally a threshold gate before anything reaches a human.</p>","question":"<p>Type the missing term into each blank, then press Check. Case does not matter; each blank takes one exact term.</p>","slotLabels":["1. First, <b>___</b> merges repeated alerts for the same host into one event before anyone reads them.","2. The model gives every alert a <b>___</b> from 0 to 100 so the riskiest alerts are worked first.","3. Before a human reads the alert, the pipeline <b>___</b> it with IP reputation, WHOIS age, and asset owner.","4. An LLM writes a short <b>___</b> of the alert chain.","5. An analyst validates that summary, because models can <b>___</b> facts that were never in the data.","6. Alerts below the tuned <b>___</b> are auto-closed, and the reason is written to the audit log."],"blanks":[{"answer":"deduplication","accepts":["deduplications?"]},{"answer":"confidence score","accepts":["confidence scores?"]},{"answer":"enriches","accepts":["enrich(es)?"]},{"answer":"summary","accepts":["summaries|summary"]},{"answer":"hallucinate","accepts":["hallucinat(e|es|ion)"]},{"answer":"threshold","accepts":["thresholds?"]}],"explain":"<p><b>Deduplication</b> collapses repeats so analysts see one event, not forty. The <b>confidence score</b> ranks the queue by risk. <b>Enrichment</b> adds context (reputation, ownership) before a human reads anything. The LLM <b>summary</b> saves time, but a model can <b>hallucinate</b> — state facts that were never in the logs — so a person validates it. The <b>threshold</b> decides what auto-closes, and that decision must be logged. Keep the triage stages (merge, score, enrich, summarize, gate) separate from response actions such as sandboxing and quarantine — those belong to the response pipeline, not triage.</p>","hints":["Blank 3 is a verb: what the pipeline does to the alert with reputation and owner data.","Blank 5 is the failure mode where a model states facts that were never in the data."],"tip":"Separate the triage stages (merge, score, enrich, summarize, gate) from response actions (isolate, quarantine) — they belong to different pipeline phases."},{"id":"m03","type":"qcm","theme":"A","timeSec":90,"title":"Precision vs recall on the triage model","scenario":"<p>Last week the triage model pushed 500 alerts to analysts. Review confirmed 400 were truly malicious and 100 were not. The sample contained 450 truly malicious events in total, so 50 were never alerted at all.</p>","question":"<p>Which statement is correct?</p>","options":["Precision is 80%; the model misses 50 of the 450 truly malicious events.","Precision is 89%; recall is 100% because the queue held 500 alerts.","Precision is 80%; recall is 89%, so lowering the threshold will fix the false positives.","Recall is 80%; precision is 89%, so the model is missing 100 events."],"correct":[0],"explain":"<p>Precision = TP ÷ (TP + FP) = 400 ÷ 500 = <b>80%</b> — how much of the queue was real. Recall = TP ÷ (TP + FN) = 400 ÷ 450 ≈ <b>89%</b> — how much of the real threat the model caught. The 50 missed events are false negatives. The wrong options swap the two formulas, and lowering the threshold would raise recall but make precision worse — more false positives, not fewer. Know both formulas cold: triage metrics always come back to them.</p>","hints":["Precision looks at what the model flagged. Recall looks at everything that was actually malicious.","FP = 100, TP = 400, FN = 50. Put the numbers into the two formulas."],"tip":"Drill the formulas: precision = TP/(TP+FP), recall = TP/(TP+FN). Lowering a threshold trades precision away to gain recall."},{"id":"m04","type":"multi","theme":"A","timeSec":120,"title":"Enrichment steps — not response steps","scenario":"<p>A phishing alert: the user received mail from billing@supplier-mail[.]example with a link to hxxp://invoice-portal[.]example[.]top/login, and the user clicked it. The playbook has a context-gathering phase before any action.</p>","question":"<p>Select <b>all</b> steps that are enrichment (gathering context without changing anything in the environment). Wrong picks earn nothing but never subtract.</p>","options":["Detonate the URL in an isolated sandbox and capture the payload behaviour.","Look the sending domain up in the TIP feed and check the WHOIS registration age.","Query proxy logs for other users who visited the same URL in 30 days.","Disable the attacker-created mailbox forwarding rule.","Force a password reset for the affected user.","Search CloudTrail for S3 API calls made by this user's session in the last 24 hours."],"correct":[0,1,2,5],"explain":"<p>Enrichment only collects facts: sandboxing shows what the link does, TIP/WHOIS shows domain reputation and age, proxy searches show the blast radius of the URL, and the CloudTrail search shows what the session touched in AWS. Disabling the forwarding rule and resetting the password are <i>response</i> actions — they change the environment, so they belong to containment after enrichment, and they also tell the attacker that you are onto them if done too early.</p>","hints":["If the step changes a password, a rule, or a mailbox, it is not enrichment.","Three enrichment steps touch the URL and domain; one touches the user's cloud session."],"tip":"Sort candidate actions into 'reads' (enrichment) and 'writes' (response) before designing a playbook phase."},{"id":"m05","type":"logviewer","theme":"B","timeSec":150,"title":"Beaconing in the VPC flow logs","scenario":"<p>02:00–02:15 on app-01 (10[.]0[.]20.14). The on-call analyst flagged 'lots of outbound traffic'. You pulled the VPC flow logs for the window.</p>","question":"<p>What does the pattern show, and what is the right first move?</p>","logs":["ts=02:00:12 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1247 pkts=14 ACCEPT","ts=02:01:13 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1211 pkts=13 ACCEPT","ts=02:02:12 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1259 pkts=14 ACCEPT","ts=02:03:12 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1205 pkts=13 ACCEPT","ts=02:04:13 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1263 pkts=14 ACCEPT","ts=02:05:12 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1218 pkts=13 ACCEPT","ts=02:05:40 src=10[.]0[.]20.14 dst=10[.]0[.]20.9 port=2049 bytes=53000000 pkts=41210 ACCEPT","ts=02:06:12 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1241 pkts=14 ACCEPT","ts=02:07:13 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1226 pkts=13 ACCEPT","ts=02:09:02 src=10[.]0[.]20.14 dst=203[.]0[.]113.201 port=80 bytes=88000 pkts=90 ACCEPT","ts=02:09:40 src=10[.]0[.]20.9 dst=10[.]0[.]20.14 port=111 bytes=210 pkts=4 ACCEPT","ts=02:10:12 src=10[.]0[.]20.14 dst=198[.]51[.]100.77 port=443 bytes=1252 pkts=14 ACCEPT"],"sub":{"type":"qcm","options":["App-01 beacons to 198[.]51[.]100.77:443 roughly every 60 s with near-constant size — treat as C2 and isolate the host.","The repeating traffic is DNS, so open a firewall rule and allow it.","The 10[.]0[.]20.9 backup transfer explains the pattern; close the alert as a false positive.","Beaconing every 60 s is normal for NTP; correlate with the NTP server before acting."],"correct":[0]},"explain":"<p>The filter on 198[.]51[.]100.77 shows one flow every ~60 seconds with a near-constant size (~1.2 KB). Regular interval + fixed small payload + one external destination is the classic C2 beacon signature: malware checking in for tasking. The NFS transfer to 10[.]0[.]20.9 is a one-off 53 MB bulk flow on port 2049 — a different destination, port, and size profile, so it does not explain the beacons. The 203[.]0[.]113.201 hit is a single 88 KB pull, not a repeating pattern. First move: isolate app-01 and block the destination, then pull process-level telemetry to find the implant.</p>","hints":["Filter for one destination and look at the timestamp gaps and byte counts.","Constant size + fixed interval + external IP = checking in. Bulk transfer = moving data. They look different."],"tip":"Beacon = repeat + rhythm + small constant payload. Judge each destination profile separately before you merge or close an alert."},{"id":"m06","type":"match","theme":"B","timeSec":130,"title":"Match observed techniques to their ATT&CK tactic","scenario":"<p>The correlation case contains five observed behaviours. Before escalation, the case must be tagged with the correct ATT&CK tactic per behaviour so the trend dashboards stay honest. Three tactics in the list are decoys.</p>","question":"<p>Click a technique on the left, then the tactic it belongs to. Not every tactic is used.</p>","pairs":[{"l":"Password spraying and dumping credentials from memory","r":"Credential Access"},{"l":"Disabling the EDR agent on a compromised host","r":"Defense Evasion"},{"l":"Compressing files from a file share into an archive","r":"Collection"},{"l":"Sending the archive to a paste site","r":"Exfiltration"},{"l":"Scanning the perimeter and harvesting employee names from search engines","r":"Reconnaissance"}],"extras":["Initial Access","Persistence","Execution"],"explain":"<p><b>Credential Access</b> is about stealing logins (spraying, dumping). <b>Defense Evasion</b> is about disabling protections — killing the EDR agent. <b>Collection</b> is gathering data (compressing files is staged gathering). <b>Exfiltration</b> is data leaving to attacker-controlled infrastructure (the paste site). <b>Reconnaissance</b> happens before intrusion — scanning and name harvesting. <i>Decoys:</i> <b>Initial Access</b> is the first foothold (phish, exploit), <b>Execution</b> is running code, <b>Persistence</b> is surviving reboots and logouts — none of the five behaviours described those stages. Tactic = the goal (the 'why'); technique = the method (the 'how').</p>","hints":["Think about what the attacker is trying to achieve at that moment, not the tool they use.","Archive-then-send is two tactics: gathering is one, the send is the other."],"tip":"Tactic = the goal (the 'why'), technique = the method (the 'how'). Tag cases by goal."},{"id":"m07","type":"branch","theme":"B","timeSec":150,"title":"Correlate the mailbox compromise","scenario":"<p>Alert: a new inbox forwarding rule named 'RSS Feeds' was created on the fin-ops mailbox, forwarding to an external address. The alert alone proves nothing yet — correlation decides whether this is noise or a takeover.</p>","question":"<p>Work the scenario. Each choice shows its consequence before you learn whether it was right.</p>","branch":[{"q":"The forwarding-rule alert arrives. What do you correlate first?","opts":[{"t":"Sign-in logs for that mailbox over 30 days: new IPs, new devices, impossible travel.","after":"You find a ConsoleLogin from a new ASN two days ago — and a second forwarding rule created 20 minutes after the first."},{"t":"The mailbox quota and storage statistics for the last month.","after":"Quota data shows nothing useful. Time passed while the attacker kept working."},{"t":"Delete the rule immediately and close the alert as resolved.","after":"You removed one persistence mechanism but never learned how deep the access went — and the case closed itself."}],"c":0},{"q":"Two forwarding rules plus a first-time ASN sign-in. What is the correct correlated view?","opts":[{"t":"One case: account takeover — sign-in, persistence via rules, and mailbox access as one chain.","after":"The case now shows a full chain with entity links and goes to Tier 2 with high confidence."},{"t":"Three separate tickets; every alert stands on its own.","after":"Splitting the case hides the chain. Correlation exists exactly to prevent this."},{"t":"One spam case: forwarding rules are usually user noise.","after":"Two rules plus a new ASN is a takeover pattern, not spam noise."}],"c":0},{"q":"What goes into the case before you escalate it?","opts":[{"t":"Defanged IOC list, ATT&CK tag T1114 (email collection), timeline, affected identity, and the HITL request to reset credentials.","after":"Tier 2 accepts the case in minutes — everything needed is inside it."},{"t":"Only the alert ID; Tier 2 will find the rest themselves.","after":"Tier 2 has to redo your work. Handover quality is part of triage quality."},{"t":"A screenshot of the forwarding rule, nothing else.","after":"A screenshot is not a case. No IOCs, no timeline, no identity context."}],"c":0}],"explain":"<p>Correlation starts at the identity: sign-in history is the fastest way to prove or disprove a takeover around a mailbox rule. Two persistence rules plus a first-time ASN form one chain, so one case is correct — linking by <b>entity</b> and <b>time window</b>. A good case carries defanged IOCs, the ATT&CK tag (T1114 covers email forwarding rules), a timeline, and the next decision point (HITL credential reset). Deleting the rule early destroys evidence and hides the breach.</p>","hints":["Step 1: what data proves somebody else is using the mailbox?","Step 3: a case is a handover document — what would a Tier 2 analyst need?"],"tip":"Correlate on identity first, keep one case per chain, and always hand over IOCs + timeline + next action."},{"id":"m08","type":"order","theme":"B","timeSec":120,"title":"Order the enrichment-to-escalation pipeline","scenario":"<p>Fourteen identical GuardDuty findings for one host arrived overnight, plus related alerts. Put the pipeline stages in the order they should run.</p>","question":"<p>Order the six stages from first (top) to last (bottom).</p>","steps":["GuardDuty finding lands in the SIEM alert queue","Deduplicate: merge the 14 repeat findings for the same host into one event","Enrich: attach asset owner, IP reputation, and the last 24 h of CloudTrail for the role","Score: the model sets confidence 87 and priority P2","Correlate: link to two other alerts for the same role within the last hour","Case built and routed to Tier 2 with ATT&CK tags and defanged IOCs"],"explain":"<p>The pipeline order is fixed: ingest, then <b>deduplicate</b> (nothing else matters until repeats are merged), then <b>enrich</b> (context feeds both the model and the analyst), then <b>score</b> (confidence and priority drive the queue), then <b>correlate</b> (join related alerts into one story), and finally case building and escalation. Scoring before enrichment wastes the model's best signal; correlating before dedup chains duplicates into false patterns.</p>","hints":["You cannot score what you have not enriched, and you cannot enrich what is still 14 duplicates.","The last two stages both produce artefacts: one is a linked story, one is the handover."],"tip":"Pipeline order: dedup → enrich → score → correlate → case. Each stage feeds the next."},{"id":"m09","type":"linepick","theme":"C","timeSec":120,"title":"Spot the dangerous playbook lines","scenario":"<p>Detection engineering reviewed this auto-isolation playbook before deployment. Several lines are unsafe as written.</p>","question":"<p>Click every line that is dangerous or missing a required control. There is more than one.</p>","lines":["playbook: guardduty-auto-isolate","trigger:","  source: GuardDuty","  severity: \">= 2\"","approval_required: false","actions:","  - action: isolate_instance","    target: \"{{ finding.resource.instanceId }}\"","  - action: notify","    channel: soc-chat","on_failure: ignore","audit_logging: disabled"],"expected":[3,4,10,11],"explain":"<p>Line 4 isolates on severity ≥ 2 — that includes low-information findings, so the playbook would isolate hosts for noise. Line 5 removes the human from an impact-heavy action: host isolation must sit behind HITL approval (or an extremely well-tested narrow trigger). Line 11 hides failures — an isolation that silently fails leaves the attacker in place. Line 12 disables the audit trail, so nobody can later prove what the automation did. Safe lines: the trigger source, the templated target, and the notification step.</p>","hints":["Ask three questions: does the trigger fire too easily, can a machine isolate without a person, and what happens when the action fails?","Two lines are about knowing what happened: one hides failures, one hides history."],"tip":"A production playbook needs a narrow trigger, HITL for high-impact actions, visible failures, and a full audit trail."},{"id":"m10","type":"terminal","theme":"A","timeSec":200,"title":"Terminal: count failed sign-ins per user (Athena)","scenario":"<p>CloudTrail is exported to the Athena table <b>cloudtrail_logs</b>. A brute-force pattern is suspected against the console. Failed sign-in events carry <b>errorCode = 'AccessDenied'</b>.</p>","question":"<p>Write an <b>Athena SQL query</b> that returns each userName and the count of failed events, highest count first. A <code>SELECT … FROM … WHERE … GROUP BY</code> shape is expected.</p>","artifacts":[{"label":"EXPECTED OUTPUT SHAPE (MEDIUM AID)","html":"userName        failed_count\nsvc_backup      412\nm.chen          8\nr.ibarra        3"}],"goal":"Return each userName with its count of failed events (errorCode = 'AccessDenied') from cloudtrail_logs, highest count first.","prompt":"$ ","accepts":["select","count\\s*\\(","cloudtrail_logs","errorcode","accessdenied","group\\s+by"],"sampleOut":"userName        failed_count\nsvc_backup      412\nm.chen          8\nr.ibarra        3","acceptNote":"Example: SELECT useridentity.username, count(*) AS fails FROM cloudtrail_logs WHERE errorcode = 'AccessDenied' GROUP BY useridentity.username ORDER BY fails DESC","explain":"<p>The query needs five parts: <b>SELECT</b> the identity plus <b>count(*)</b>, <b>FROM cloudtrail_logs</b>, a <b>WHERE</b> on <b>errorCode = 'AccessDenied'</b>, and a <b>GROUP BY</b> on the identity so the count is per user. Adding <code>eventname = 'ConsoleLogin'</code> tightens it to console failures, and <code>ORDER BY … DESC</code> puts the brute-forced account — svc_backup with 412 — on top. Next step after this query: revoke and rotate svc_backup credentials and check what that key did.</p>","hints":["SELECT the user column and count(*), then WHERE on errorCode, then GROUP BY the user column.","ORDER BY the count descending puts the attacked account first."],"tip":"Count-per-group questions always resolve to SELECT + COUNT + WHERE + GROUP BY (+ ORDER BY for ranking)."},{"id":"m11","type":"classify","theme":"A","timeSec":150,"title":"Confidence scores to action buckets","scenario":"<p>The triage model outputs a confidence score per alert. Your policy defines three actions. The score alone does not decide — the asset class and context decide with it.</p>","question":"<p>Place each alert into the correct action bucket. Policy: <b>auto-close</b> only low-confidence alerts on allowlisted patterns; <b>escalate P1</b> for high-confidence hits on crown-jewel or identity assets; everything else goes to <b>analyst review</b>.</p>","buckets":[{"id":"auto","label":"Auto-close"},{"id":"rev","label":"Analyst review"},{"id":"p1","label":"Escalate P1"}],"items":[{"t":"Conf 97 — root user API call from an unknown ASN (GuardDuty severity critical)","b":"p1"},{"t":"Conf 88 — beacon to a known-bad IP from the production database tier","b":"p1"},{"t":"Conf 74 — first-time large S3 download by a data-science user","b":"rev"},{"t":"Conf 22 — snapshot job from the trusted backup role (allowlisted pattern)","b":"auto"},{"t":"Conf 35 — port scan from the internal scanner IP; calendar matches the weekly vuln scan","b":"auto"},{"t":"Conf 61 — unusual ConsoleLogin from a new country for a contractor (travel unconfirmed)","b":"rev"}],"explain":"<p>Crown-jewel and identity events at high confidence (97 on root, 88 on the production DB) escalate — automation must never quietly close those. Mid-band alerts (74, 61) go to human review: the model is unsure and the context is not obviously benign. Low confidence on allowlisted, owned patterns (22 backup role, 35 internal scanner) auto-closes with the reason logged. Tuning uses the false-positive rate: if auto-closed items keep being reopened, the threshold is wrong. Note that confidence 74 is <i>not</i> 'more than halfway to escalate' — thresholds are set per asset class, not by one global number.</p>","hints":["Auto-close needs both a low score and an allowlisted, owned pattern.","High confidence on root or the production DB never auto-closes, whatever the score."],"tip":"Disposition = confidence × asset class × allowlist state. Never a single threshold for everything."},{"id":"m12","type":"branch","theme":"B","timeSec":150,"title":"UEBA: the peer-group decision","scenario":"<p>The UEBA engine raises 'unusual data transfer' on a finance analyst. UEBA learns baselines: per-user history and per-peer-group norms. Your job is to judge the deviation properly.</p>","question":"<p>Work the scenario. Each choice shows its consequence.</p>","branch":[{"q":"UEBA flags an unusual transfer for a finance user. What do you compare first?","opts":[{"t":"The user's own 30-day baseline and their peer group (other finance analysts).","after":"The peer group uploads ~50 MB nightly to internal reports; this user did one 4 GB push at 02:00 to a personal file-share domain."},{"t":"The company-wide average across all departments.","after":"Mixing engineers and finance makes the 'average' meaningless — the flag drowns and you learned nothing."},{"t":"The vendor's default threshold documentation.","after":"Defaults are a starting point for tuning, not evidence about this user."}],"c":0},{"q":"Peers upload ~50 MB nightly; the user pushed 4 GB once at 02:00 to a personal file-share domain. Best classification?","opts":[{"t":"True-positive candidate — escalate for a data-exfiltration review.","after":"The case opens with the deviation quantified: 80× the peer norm, off-hours, personal destination."},{"t":"Benign — finance users sometimes work late.","after":"80× the peer norm to a personal domain is not 'working late'. The alert would have been right."},{"t":"False positive — one event can never be a real detection.","after":"Single-event detections are normal for UEBA; volume alone does not make it false."}],"c":0},{"q":"Before calling it exfiltration, what closes the loop?","opts":[{"t":"Check what the files were (DLP labels), where they went, and whether any change ticket covers the transfer.","after":"DLP shows 300 files labelled 'customer-PII', no ticket. Exfiltration confirmed; containment starts."},{"t":"Press auto-isolate with no approval — deviation equals compromise.","after":"You isolated an innocent user's twin sister who was migrating files. Over-reliance on the model, no human check."},{"t":"Ignore it; UEBA has false positives, so this is noise.","after":"UEBA noise is real, but so are deviations. Ignoring the highest-scored flag of the month is how breaches age quietly."}],"c":0}],"explain":"<p>UEBA judgement is a three-step loop: compare against the user's own baseline <b>and</b> the peer group (not the company average), classify the deviation honestly (this one is a strong true-positive candidate), then close the loop with context — file labels, destination ownership, change tickets. Both extremes fail: blindly trusting the model (auto-isolate) and blindly distrusting it (ignore). The analyst's job is exactly this middle path.</p>","hints":["Peer group means people in the same role, not the whole company.","Deviation is a reason to look, not a verdict. What makes it a verdict?"],"tip":"UEBA workflow: baseline → peer comparison → context check → decision. Never skip the context check."},{"id":"m13","type":"bank","theme":"B","timeSec":130,"title":"Build the multi-stage correlation rule","scenario":"<p>You are writing a SIEM correlation rule for a three-stage chain: suspicious sign-in → new access key → outbound call to fresh infrastructure.</p>","question":"<p>Fill every blank from the word bank. Each word is used at most once.</p>","bank":["identity","time window","AND","sequence","severity","suppression","OR","threshold","baseline"],"slots":["identity","time window","AND","sequence","severity","suppression"],"slotLabels":["1. Link the three stages only if they share the same <b>___</b> (user or host) — this is entity linking.","2. All stages must fall inside one <b>___</b> — here, 30 minutes.","3. Combine the stages with <b>___</b>, not OR: a single event alone must not raise the case.","4. The rule must check the stages in <b>___</b> — sign-in happens before the key is created, which happens before the callout.","5. A P1 <b>___</b> is raised only when all three stages match.","6. Add <b>___</b> so repeated findings for the same identity do not flood the queue for 24 hours."],"explain":"<p>A correlation rule needs five decisions: the <b>identity</b> that links events (entity linking), the <b>time window</b> that bounds the chain, the boolean logic (<b>AND</b> — OR would raise a case for any lone event), the <b>sequence</b> of stages (order proves causality), and the resulting <b>severity</b>. <b>Suppression</b> then stops duplicate cases for the same identity within a period. <i>Distractors:</i> OR breaks the logic; a <b>threshold</b> is a count-based trigger, not a chain; a <b>baseline</b> is what UEBA learns, not what a rule asserts.</p>","hints":["Two blanks are about shape: whose events, and within how long.","One word is what UEBA computes, not what a rule states — it does not belong here."],"tip":"Rule anatomy: identity + window + AND + sequence → severity, then suppression to stop duplicates."},{"id":"m14","type":"multi","theme":"C","timeSec":120,"title":"Containment actions only","scenario":"<p>Ransomware behaviour is confirmed on three EC2 hosts. The incident manager asks for the containment list before the next status call. Containment = stop the spread and cut attacker access, while preserving evidence.</p>","question":"<p>Select <b>all</b> containment actions. Eradication, recovery, and destructive steps do not count.</p>","options":["Isolate the three instances with security groups that allow only the forensics host.","Revoke the compromised role's temporary sessions through STS.","Delete the attacker-created IAM user immediately.","Snapshot the EBS volumes before any reimaging.","Restore the encrypted files from last night's backup.","Rotate the access keys that were exposed.","Patch the vulnerable service on the golden image."],"correct":[0,1,3,5],"explain":"<p>Containment stops access and spread while keeping evidence: isolating with a forensics-only security group, revoking live STS sessions (the role stays usable for later analysis, but the attacker is out), rotating exposed keys, and snapshotting volumes so nothing is destroyed before analysis. Deleting the IAM user is <i>eradication</i> and destroys evidence about the attacker. Restoring files is <i>recovery</i>. Patching the golden image is <i>eradication</i> — it prevents re-entry but does not stop the current spread.</p>","hints":["Four actions cut access or preserve evidence. Three change the environment's state permanently or restore it.","Ask for each: does this stop the attacker right now without destroying evidence?"],"tip":"Containment = cut access + stop spread + preserve evidence. Everything else is a later phase."},{"id":"m15","type":"logviewer","theme":"B","timeSec":150,"title":"Privilege escalation in CloudTrail","scenario":"<p>02:14–02:20. The correlation engine linked several CloudTrail events for the deployment role. You have the raw events.</p>","question":"<p>Which case summary matches the evidence?</p>","logs":["{\"ts\":\"02:14:07\",\"event\":\"CreateUser\",\"actor\":\"svc_deploy\",\"new\":\"tmp-ops-01\",\"src\":\"10[.]0[.]40.12\"}","{\"ts\":\"02:14:31\",\"event\":\"AttachUserPolicy\",\"actor\":\"svc_deploy\",\"target\":\"tmp-ops-01\",\"policy\":\"AdministratorAccess\",\"src\":\"10[.]0[.]40.12\"}","{\"ts\":\"02:15:02\",\"event\":\"CreateAccessKey\",\"actor\":\"svc_deploy\",\"target\":\"tmp-ops-01\",\"src\":\"10[.]0[.]40.12\"}","{\"ts\":\"02:16:40\",\"event\":\"ConsoleLogin\",\"user\":\"tmp-ops-01\",\"mfa\":\"false\",\"src\":\"198[.]51[.]100.24\"}","{\"ts\":\"02:17:19\",\"event\":\"ListBuckets\",\"user\":\"tmp-ops-01\",\"src\":\"198[.]51[.]100.24\"}","{\"ts\":\"02:18:03\",\"event\":\"GetObject\",\"user\":\"tmp-ops-01\",\"bucket\":\"hr-backups-eu\",\"key\":\"payroll-2026-02.csv\",\"src\":\"198[.]51[.]100.24\"}","{\"ts\":\"02:18:44\",\"event\":\"DescribeInstances\",\"user\":\"tmp-ops-01\",\"src\":\"198[.]51[.]100.24\"}","{\"ts\":\"02:11:15\",\"event\":\"DescribeInstances\",\"user\":\"svc_deploy\",\"src\":\"10[.]0[.]40.12\"}","{\"ts\":\"02:19:30\",\"event\":\"DescribeInstances\",\"user\":\"mon-02\",\"src\":\"10[.]0[.]30.5\"}"],"sub":{"type":"qcm","options":["New key path: svc_deploy created tmp-ops-01, attached AdministratorAccess, minted keys, then an external no-MFA login read HR payroll data — privilege escalation followed by collection.","Normal deployment activity — svc_deploy creates users and keys every night.","A single IAM misconfiguration; nothing escalated because the new user had MFA.","A completed data breach — skip containment and move straight to recovery."],"correct":[0]},"explain":"<p>The chain is a textbook escalation: the deployment role (never meant to mint admins) created a new user, gave it <b>AdministratorAccess</b>, created keys for it, and that user then logged in <b>from an external IP without MFA</b> and read HR payroll data. The DescribeInstances noise before and after does not change the story. Calling it 'normal deployment' ignores the external login and the policy attachment; MFA was off; and you never skip containment — the escalation path (svc_deploy's permissions) is still open.</p>","hints":["Filter on tmp-ops-01 and read the events in timestamp order.","The login source changes from 10[.]0[.]40.12 to an external address halfway through."],"tip":"Read IAM events as a story: who created what, which policy landed, and who then logged in from where."},{"id":"m16","type":"order","theme":"C","timeSec":120,"title":"Order the containment playbook with HITL","scenario":"<p>Host fin-ws-07 shows confirmed C2 at confidence 95. The SOAR playbook must run in the correct order — one step out of place either loses evidence or leaves access open.</p>","question":"<p>Order the six playbook steps from first (top) to last (bottom).</p>","steps":["Alert verified: confidence 95, host fin-ws-07, user m.ibarra","HITL approval requested from the incident manager (15-minute auto-escalation timer)","Isolate the host through SSM; keep the forensics channel open","Revoke the user's active sessions and rotate the exposed local credentials","Collect volatile evidence from the isolated host: memory and running processes","Hand over to Tier 2 for eradication and recovery; case stays open"],"explain":"<p>Approval comes before action — automating a destructive step without HITL is the classic orchestration failure, and the 15-minute timer keeps speed under control. Isolation happens next so the attacker cannot pivot, then sessions are revoked and credentials rotated so stolen tokens die. Memory and process data is collected <i>after</i> isolation but <i>before</i> any reboot or wipe, because volatile evidence dies first. Handover last, with the case open until eradication and recovery finish.</p>","hints":["Two steps protect people and process, two protect evidence, and one cuts access.","Whatever dies first in a reboot must be collected before any wipe — and after the host cannot talk out."],"tip":"Verify → approve → isolate → revoke access → preserve volatile evidence → hand over."},{"id":"m17","type":"branch","theme":"C","timeSec":150,"title":"HITL with a 200-account blast radius","scenario":"<p>The AI playbook proposes disabling 200 accounts whose names fuzzy-match an IOC ('asmith'-like patterns). The match list includes 3 executives and 6 service accounts. Payroll sync depends on two of those service accounts.</p>","question":"<p>Work the scenario. Each choice shows its consequence.</p>","branch":[{"q":"The playbook is ready to disable 200 accounts. What happens first?","opts":[{"t":"Pause and review the match list with the incident manager before any action (HITL).","after":"The review removes 40 false matches — the list shrinks to 160 and the executives stay untouched."},{"t":"Approve the bulk action; speed beats precision during a P1.","after":"Payroll breaks mid-run, three executives lose access in a board meeting, and the rollback queue is 200 items deep."},{"t":"Let the playbook run but only for the executives.","after":"Attacker accounts stay enabled while the most-watched users lose access — worst of both worlds."}],"c":0},{"q":"Six service accounts are on the list and two feed payroll. Best control?","opts":[{"t":"Exclude service accounts from bulk actions; handle each with its owner, with break-glass steps documented.","after":"Payroll keeps running; each service account gets a scoped, owner-approved decision."},{"t":"Disable everything including service accounts and restore later.","after":"Restoring later means explaining a payroll outage to the whole company."},{"t":"Skip the service accounts silently and delete that audit entry.","after":"Silent exceptions with deleted logs are how audit findings become incidents."}],"c":0},{"q":"After containment, what proves what the automation did?","opts":[{"t":"The audit trail: every automated action with actor, timestamp, input, and approval ID.","after":"The audit trail reconstructs the whole response in minutes for the post-incident review."},{"t":"A verbal debrief in the war room.","after":"Memory fades; auditors and regulators want records, not recollections."},{"t":"Nothing — the playbook is trusted code.","after":"Trusted code still needs records. 'Trust me' is not a control."}],"c":0}],"explain":"<p>Bulk identity actions are exactly where automation overreaches: fuzzy matching multiplies false positives, so HITL review of the match list comes first. Service accounts need owner-scoped handling with documented <b>break-glass</b> steps — never silent exceptions. Afterward, the <b>audit trail</b> (actor, time, input, approval ID) is what makes automated response defensible. Note the design lesson: the playbook should have capped its own blast radius and required dual approval above a size threshold.</p>","hints":["Step 1: who must agree before 200 identities change state?","Step 3: what artefact survives after everyone forgets the war room?"],"tip":"Bulk automation = HITL review + service-account carve-outs + complete audit trail."},{"id":"m18","type":"bank","theme":"C","timeSec":130,"title":"Complete the phishing playbook YAML","scenario":"<p>Detection engineering drafted a SOAR playbook for user-reported phishing. The YAML skeleton is missing six keys.</p>","question":"<p>Fill every blank from the word bank. Each word is used at most once.</p>","bank":["trigger","approval_required","block","case","webhook","failure","runbook","sandbox","escalation"],"slots":["trigger","approval_required","block","case","webhook","failure"],"slotLabels":["1. <b>___</b>: GuardDuty-type phishing finding AND siem_tag = phish","2. <b>___</b>: true   # a human must approve the mailbox purge","3. - <b>___</b> the sender domain at the mail gateway","4. - open a <b>___</b> in the ticketing system","5. - via <b>___</b> to the ticketing API","6. on_<b>___</b>: restore purged items if the false-positive rate exceeds 20%"],"explain":"<p>The <b>trigger</b> defines when the playbook fires (detection + tag). <b>approval_required: true</b> puts a human behind the purge — a destructive mailbox action. The gateway action is to <b>block</b> the sender domain. Every automated response opens a <b>case</b> in the ticketing system, connected through a <b>webhook</b> (API integration). The <b>on_failure</b> key defines the rollback: if the purge was wrong, items come back. <i>Distractors:</i> a <b>runbook</b> is the manual procedure document for people, not the machine-playbook key; <b>sandbox</b> is for detonating attachments; <b>escalation</b> is a routing concept, not this YAML key.</p>","hints":["Blank 2 is the human-control switch; blank 6 is what happens when the automation goes wrong.","Two blanks are the integration pair: the record you open and the way you call the API."],"tip":"Playbook keys: trigger, condition, approval_required, actions, on_failure (rollback). 'Runbook' names the human procedure."},{"id":"m19","type":"qcm","theme":"D","timeSec":90,"title":"MTTR on the dashboard","scenario":"<p>Your SOC counts MTTR from alert open to containment. One incident: opened 09:12, auto-triaged 09:19, analyst engaged 09:41, contained 10:26, closed 11:05.</p>","question":"<p>What MTTR value goes on the dashboard?</p>","options":["1 h 14 min","1 h 53 min","29 min","1 h 7 min"],"correct":[0],"explain":"<p>With the stated definition (open → containment): 09:12 → 10:26 = <b>1 h 14 min</b>. The other numbers are real but measure different things: 1 h 53 min is open → closed (full lifecycle), 29 min is open → engaged (detection-to-human lag), and 1 h 7 min is triage → contained. Every MTTR dispute in real SOCs comes from mixing definitions — pick one, print the definition on the dashboard, and never change it mid-quarter.</p>","hints":["The definition names the two endpoints: open and containment.","Ignore 'closed' — closure is lifecycle time, not response time."],"tip":"MTTR is definition-dependent: open→contain here. State the endpoints or the number is meaningless."},{"id":"m20","type":"linepick","theme":"D","timeSec":120,"title":"Audit the automation role's policy","scenario":"<p>The SOAR automation role's IAM policy and a deployment note. The role invokes playbooks that isolate hosts and read context.</p>","question":"<p>Click every line that violates least privilege or secret-handling good practice.</p>","lines":["{","  \"Version\": \"2012-10-17\",","  \"Statement\": [","    { \"Sid\": \"AllActions\", \"Effect\": \"Allow\", \"Action\": \"*\", \"Resource\": \"*\" },","    { \"Sid\": \"Secrets\", \"Effect\": \"Allow\", \"Action\": [\"secretsmanager:GetSecretValue\"], \"Resource\": \"*\" },","    { \"Sid\": \"Logs\", \"Effect\": \"Allow\", \"Action\": [\"logs:CreateLogStream\",\"logs:PutLogEvents\"], \"Resource\": \"arn:aws:logs:eu-west-1:111122223333:log-group:/soar/*\" }","  ],","  \"Comment\": \"soar-automation role\"","}","# deployment note: static access key stored as a plaintext Lambda environment variable"],"expected":[3,4,9],"explain":"<p>Line 4 grants <b>Action * on Resource *</b> — the automation can do anything, so one playbook bug or one stolen key becomes a full compromise. Line 5 can read <b>every secret</b> in the account; secret reads must be scoped to the specific secret ARNs the playbooks need. Line 9 stores a static key in plaintext — use a role (or Secrets Manager with rotation) instead. Line 6 is the counter-example: named actions on a specific log-group ARN. Least privilege means named actions, specific resources, and no long-lived plaintext keys.</p>","hints":["Two lines allow too much; one line leaks a credential outside any secret store.","Line 6 is done correctly — compare the others against it."],"tip":"Good policy: named actions, exact resource ARNs, secrets via roles or Secrets Manager with rotation."},{"id":"m21","type":"bank","theme":"B","timeSec":130,"title":"Match each platform to its job","scenario":"<p>A new analyst keeps mixing up the SOC's tooling. You write the one-paragraph primer for the team wiki.</p>","question":"<p>Fill every blank from the word bank. Each term is used at most once.</p>","bank":["SIEM","SOAR","UEBA","TIP","sandbox","case management","EDR","WAF","CMDB"],"slots":["SIEM","SOAR","UEBA","TIP","sandbox","case management"],"slotLabels":["1. The <b>___</b> collects and keeps logs, runs detection rules, and raises alerts.","2. The <b>___</b> executes response playbooks across tools through APIs and webhooks.","3. The <b>___</b> builds behaviour baselines for users and hosts, and flags deviations from them.","4. The <b>___</b> stores threat-intel feeds and matches IOCs against events, using formats like STIX and transport like TAXII.","5. The <b>___</b> runs suspicious files in an isolated environment to observe what they really do.","6. The <b>___</b> joins related alerts into one investigation with notes, tasks, and a timeline."],"explain":"<p><b>SIEM</b> = log collection + detection rules + alerting. <b>SOAR</b> = orchestration: playbooks executing across other tools via APIs and webhooks. <b>UEBA</b> = behaviour baselines and deviation flags for users and entities. <b>TIP</b> = threat-intelligence platform: stores feeds, matches IOCs, speaks STIX (format) and TAXII (transport). <b>Sandbox</b> = safe detonation to observe behaviour. <b>Case management</b> = one investigation object per incident. <i>Distractors:</i> <b>EDR</b> is endpoint telemetry and agent actions, <b>WAF</b> is a web firewall, <b>CMDB</b> is the asset inventory (useful for enrichment, not a detector).</p>","hints":["Two distractors are protection/telemetry tools (endpoint, web); one is just an asset list.","The intel formats STIX and TAXII only ever belong to one platform."],"tip":"SIEM detects, SOAR orchestrates, UEBA baselines, TIP enriches with intel, sandbox detonates, case tool investigates."},{"id":"m22","type":"logviewer","theme":"A","timeSec":150,"title":"GuardDuty triage: act, watch, or allowlist","scenario":"<p>Eight GuardDuty findings from the night shift, listed oldest first. Your queue policy: act within minutes on active compromise, allowlist approved testing, and do not chase scanners.</p>","question":"<p>Which summary matches the correct dispositions?</p>","logs":["{\"finding\":\"Recon:EC2/PortProbeUnprotectedPort\",\"severity\":2,\"resource\":\"i-0a11\",\"src\":\"185[.]199[.]110.153\",\"note\":\"single internet scan\"}","{\"finding\":\"UnauthorizedAccess:EC2/TorClient\",\"severity\":5,\"resource\":\"i-0a11\",\"note\":\"outbound Tor circuit attempted\"}","{\"finding\":\"PenTest:IAMUser/KaliLinux\",\"severity\":7,\"user\":\"pentest-01\",\"note\":\"matches approved red-team window 10–14 Mar, ticket RT-441\"}","{\"finding\":\"CredentialAccess:IAMUser/AnomalousAPICall\",\"severity\":8,\"user\":\"root\",\"src\":\"203[.]0[.]113.9\",\"note\":\"unusual API sequence from unknown ASN\"}","{\"finding\":\"Behavior:EC2/NetworkPortUnusual\",\"severity\":4,\"resource\":\"i-0b22\",\"note\":\"matches new nightly backup job, change CHG-1907\"}","{\"finding\":\"Trojan:EC2/DNSDataExfiltration\",\"severity\":9,\"resource\":\"i-0c33\",\"note\":\"queries tunneling encoded payloads\"}","{\"finding\":\"Recon:EC2/PortProbeUnprotectedPort\",\"severity\":2,\"resource\":\"i-0d44\",\"src\":\"45[.]33[.]32.156\",\"note\":\"single internet scan, unmanaged range\"}","{\"finding\":\"Stealth:IAMUser/CloudTrailLoggingDisabled\",\"severity\":3,\"user\":\"deploy-ci\",\"note\":\"resolved as CI schema test, change CHG-1866\"}"],"sub":{"type":"qcm","options":["Act now on TorClient, the root anomaly, and DNSDataExfiltration; the PenTest finding is benign positive per ticket RT-441; the backup behaviour matches change CHG-1907; the port probe is a low-value scan.","Only the severity 9 needs action — low severities are never real.","The PenTest finding first, because severity 7 is the highest-impact item.","The severity 2 port probe first — recon always means compromise."],"correct":[0]},"explain":"<p>Severity ranks suspicion, not truth — context decides. The KaliLinux finding is a <b>benign positive</b>: a real tool, but the ticket RT-441 proves it is approved testing (allowlist it). The backup job matches a change ticket (CHG-1907) — also expected. The single port probe is noise from an internet scanner. The three that need action share active-compromise evidence: Tor egress, root-level anomalous API calls from an unknown ASN, and DNS exfiltration with encoded payloads — highest first (DNSDataExfiltration, then root, then Tor).</p>","hints":["Two findings can be matched to a ticket or a change record — those are not incidents.","Rank the three real ones by evidence of active compromise, not by severity alone."],"tip":"Tickets and change records turn findings into benign positives. Absent context + high severity + active behaviour = act."},{"id":"m23","type":"branch","theme":"B","timeSec":150,"title":"Dual perspective: the phishing chain","scenario":"<p>You will see the same phishing incident twice: first as the blue team defending, then as the attacker who ran it. Understanding both sides is the point of the exercise. Note: the phish contained hidden text trying to manipulate AI mail filters — text inside a message is untrusted input, never a command.</p>","question":"<p>Work all four steps: two blue, two red.</p>","branch":[{"q":"BLUE — a user clicked the link and submitted credentials at hxxp://vpn-portal[.]example[.]top/login. What do you correlate next?","opts":[{"t":"Auth logs for that user, plus proxy logs for everyone else who hit the domain.","after":"Three more users hit the domain, and one of them authenticated successfully from 198[.]51[.]100.88."},{"t":"Only run a full antivirus scan on the one laptop.","after":"The scan finds nothing — the compromise is credential-based. Meanwhile three more victims stay unknown."},{"t":"Nothing; a single click without malware is not an incident.","after":"Credential phishing is an incident on click. Four users are now exposed while you decided it was nothing."}],"c":0},{"q":"BLUE — one successful login from 198[.]51[.]100.88. Next move?","opts":[{"t":"Kill the sessions, reset credentials, check mailbox rules — then hunt the domain across all mail flow.","after":"You find one attacker rule, three more victims, and a second domain from the same campaign."},{"t":"Wait for the user to confirm whether it was them.","after":"The attacker adds persistence while you wait for a reply that arrives at lunchtime."},{"t":"Block the user's account permanently and close the case.","after":"The account is handled, but the attacker's other victims and second domain stay invisible."}],"c":0},{"q":"RED — your phish worked, but blue killed your sessions. What keeps you inside?","opts":[{"t":"A second persistence path created earlier — an inbox rule plus an application password.","after":"Your rule quietly forwards new mail; the analyst missed it because they only rotated credentials."},{"t":"Re-phish the same user immediately with the same lure.","after":"The user just sat through awareness training; a repeat of the same lure burns your infrastructure."},{"t":"Nothing — once sessions die, access is gone forever.","after":"Correct responders also hunt persistence. You assumed a lazy defender and lost the foothold."}],"c":0},{"q":"RED — blue blocked your IP 198[.]51[.]100.88. How do you keep operating?","opts":[{"t":"Move to a residential proxy and slow, low-volume access that mimics the user's normal hours.","after":"Low-and-slow from a residential ASN hides you for another week before analytics catch the pattern."},{"t":"Send ten times more traffic to finish before they look again.","after":"Volume is exactly what the correlation rules catch — the beacon model lights up within minutes."},{"t":"Log in again from the same blocked IP; blocks are often forgotten.","after":"Blocks are tracked and reviewed now. You are flagged on the first attempt."}],"c":0}],"explain":"<p>Blue side: correlate outward from the first click — other victims and other infrastructure — then evict (sessions, credentials, persistence) and hunt the campaign. Red side: attackers pre-build persistence (rules, app passwords) so eviction is incomplete without it, and they answer blocking with slower, quieter, rotating access. The hidden text in the phish is a prompt-injection attempt: log and mail content is data, never instructions for your AI tooling. Both perspectives teach the same lesson: eviction without persistence-hunting is incomplete, and detection without victim-hunting is too.</p>","hints":["Blue: what does one click tell you about others? Red: what survives a session kill?","Red: after a block, what traffic pattern avoids the beacon model?"],"tip":"Pair every eviction with a persistence sweep, and pair every victim with a campaign hunt."},{"id":"m24","type":"logviewer","theme":"A","timeSec":150,"title":"Tune the noisy PowerShell rule","scenario":"<p>Rule 'suspicious-powershell' fired 9 times overnight. Seven are the IT deployment host and helpdesk inventory; two are different. The queue is drowning — tuning must fix noise without hiding the real thing.</p>","question":"<p>Which tuning decision is correct?</p>","logs":["01:59:01 susp-powershell host=IT-DEPLOY-01 user=svc_sccm  cmd=\"powershell -EncodedCommand SQBFAF…\" ancestry=it-baseline","02:00:12 susp-powershell host=IT-DEPLOY-01 user=svc_sccm  cmd=\"powershell -EncodedCommand SQBFAF…\" ancestry=it-baseline","02:14:44 susp-powershell host=IT-DEPLOY-01 user=svc_sccm  cmd=\"powershell -EncodedCommand SQBFAF…\" ancestry=it-baseline","02:30:09 susp-powershell host=HR-LT-22    user=a.diallo   cmd=\"powershell -Command Get-HotFix\" ancestry=helpdesk-inventory","02:44:51 susp-powershell host=IT-DEPLOY-01 user=svc_sccm  cmd=\"powershell -EncodedCommand SQBFAF…\" ancestry=it-baseline","03:12:02 susp-powershell host=FIN-WS-11   user=m.ibarra   cmd=\"powershell -EncodedCommand <74 chars>\" ancestry=usb-drop; no change ticket","03:18:40 susp-powershell host=FIN-WS-11   user=m.ibarra   cmd=\"powershell -EncodedCommand <68 chars>\" ancestry=usb-drop; no change ticket","03:40:18 susp-powershell host=HR-LT-22    user=a.diallo   cmd=\"powershell -Command Get-HotFix\" ancestry=helpdesk-inventory","03:52:07 susp-powershell host=HR-LT-09    user=a.diallo   cmd=\"powershell -Command Get-HotFix\" ancestry=helpdesk-inventory"],"sub":{"type":"qcm","options":["Suppress only the IT-DEPLOY-01 service-account matches (owned, documented), keep everything else alerting — the FIN-WS-11 hit keeps its alert.","Turn the rule off entirely; it only makes noise.","Raise the rule to critical severity so it finally gets attention.","Suppress all PowerShell alerts for a week to empty the queue."],"correct":[0]},"explain":"<p>Good tuning is narrow and documented: suppress the specific noise source (the IT deployment host's service account, with an owner and an expiry), and leave the rest of the rule live — that is why the FIN-WS-11 encoded command from an unmanaged USB ancestry keeps its alert and becomes the real detection. Killing the rule (b), raising severity so noise pages people (c), or suppressing all PowerShell (d) all trade coverage for quiet. Every suppression needs an owner, a reason, and an expiry date, and it goes into the change record.</p>","hints":["Only one suppression can be described with an owner, a host, and a reason.","The real alert shares a field with the noise (EncodedCommand) but differs in host, user, and ancestry."],"tip":"Suppress narrowly (source + owner + expiry). Never silence the whole rule or the whole technique."},{"id":"m25","type":"terminal","theme":"A","timeSec":200,"title":"Terminal: grep the C2 domain in the proxy log","scenario":"<p>You have <b>proxy.log</b> in the current directory. The C2 domain is <b>c2[.]malware-example[.]net</b> (defanged exactly like this in the log).</p>","question":"<p>Use <b>grep</b> on proxy.log to print every request line that mentions the C2 domain. Quotes around the domain are fine.</p>","artifacts":[{"label":"EXPECTED OUTPUT SHAPE (MEDIUM AID)","html":"2026-03-11 03:14:22 GET hxxp://c2[.]malware-example[.]net/gate user=m.ibarra bytes=4211\n2026-03-11 03:34:22 GET hxxp://c2[.]malware-example[.]net/gate user=m.ibarra bytes=4218\n2026-03-11 04:14:22 GET hxxp://c2[.]malware-example[.]net/gate user=m.ibarra bytes=4211"}],"goal":"Print every line of proxy.log that mentions the C2 domain c2[.]malware-example[.]net.","prompt":"$ ","accepts":["grep","proxy\\.log","malware-example"],"sampleOut":"2026-03-11 03:14:22 GET hxxp://c2[.]malware-example[.]net/gate user=m.ibarra bytes=4211\n2026-03-11 03:34:22 GET hxxp://c2[.]malware-example[.]net/gate user=m.ibarra bytes=4218\n2026-03-11 04:14:22 GET hxxp://c2[.]malware-example[.]net/gate user=m.ibarra bytes=4211","acceptNote":"Example: grep \"c2[.]malware-example[.]net\" proxy.log","explain":"<p><code>grep \"c2[.]malware-example[.]net\" proxy.log</code> prints every matching request line; <code>grep -c</code> would give the count, and piping to <code>sort | uniq -c</code> would summarise. Three beacon requests from m.ibarra at ~20–40 minute spacing confirm the beacon you saw in the flow logs — the artefact list for the case now has the domain, the timestamps, and the user. Keep IOCs defanged exactly as the log shows them; a live link in a ticket is a click risk.</p>","hints":["The command is grep, then the string to search, then the file name.","The domain appears in the log exactly as c2[.]malware-example[.]net — search for that (or just malware-example)."],"tip":"grep PATTERN FILE is the workhorse of log triage. Quote patterns, keep IOCs defanged."},{"id":"m26","type":"order","theme":"A","timeSec":120,"title":"Order the alert lifecycle","scenario":"<p>From detection to closure, one alert's full life in a SOC that uses AI triage and SOAR. The last step is the one most teams forget.</p>","question":"<p>Order the six lifecycle stages from first (top) to last (bottom).</p>","steps":["New alert opened by the detection rule","Tier 1 triages using the AI summary, enrichment, and the confidence score","Correlated into a case with two related alerts on the same identity","Containment playbook runs after HITL approval","Eradication and recovery by Tier 2","Feedback: the disposition is labelled and fed back to retrain the model; the alert closes"],"explain":"<p>Detection, AI-assisted triage, correlation into a case, containment behind HITL, then eradication and recovery — and finally the <b>feedback loop</b>: the analyst's confirmed disposition becomes a training label so the model improves, and the alert closes. Skipping the feedback step is how the same false positive returns every night for a year; the label is the cheapest data the team owns.</p>","hints":["Triage before correlation; approval before automated action.","The final stage produces training data, not status changes."],"tip":"Lifecycle: detect → triage → correlate → contain (HITL) → eradicate/recover → feedback & close."},{"id":"m27","type":"qcm","theme":"D","timeSec":90,"title":"Model drift after the migration","scenario":"<p>Three weeks ago the company migrated to a new EDR agent and a new log schema. The triage model's precision fell from 84% to 61% and alerts are piling up. The team's data arrived on time — the world changed under the model.</p>","question":"<p>What is the correct response?</p>","options":["Retrain and recalibrate on the new schema using analyst feedback labels, then re-tune thresholds before trusting auto-closes again.","Turn off the feedback loop; analyst labels are confusing the model.","Lower the confidence threshold so the alert pile drains faster.","The model is fine; tell the analysts to work faster."],"correct":[0],"explain":"<p>This is <b>model drift</b>: the input data changed (new agent, new schema), so the patterns the model learned no longer match production. The fix is to retrain on the new schema with fresh analyst labels, recalibrate scores, and re-tune the auto-close thresholds — under close monitoring. Lowering the threshold (c) pushes more low-quality alerts at humans; disabling feedback (b) removes the only mechanism that would fix this; and blaming analysts (d) ignores the cause. Auto-closing stays off until the retrained model proves itself.</p>","hints":["The model did not get worse at learning — the data it sees changed shape.","Which option uses the analyst labels instead of discarding them?"],"tip":"Drift = world changed under the model. Respond with retrain + recalibrate + re-tune, and keep auto-closed off meanwhile."},{"id":"m28","type":"bank","theme":"D","timeSec":130,"title":"Draft the shift report","scenario":"<p>The 06:00–14:00 shift ended. You are writing the handover report; the blanks are the terms a reader needs to trust the numbers.</p>","question":"<p>Fill every blank from the word bank. Each term is used at most once.</p>","bank":["deduplication","correlation","SOAR","human-in-the-loop","MTTR","defanged","MTTD","firewall","RACI"],"slots":["deduplication","correlation","SOAR","human-in-the-loop","MTTR","defanged"],"slotLabels":["1. The pipeline's <b>___</b> step merged 38 duplicate alerts into 9 events.","2. A multi-stage <b>___</b> rule linked sign-in → new key → outbound call into one case.","3. The <b>___</b> executed the isolation playbook after <b>___</b> approval in 4 minutes.","4. (same sentence as above — the approval type)","5. <b>___</b> for P1 incidents dropped from 51 to 22 minutes week-over-week.","6. All IOCs, already <b>___</b>, were shared with the TIP over TAXII as STIX objects."],"explain":"<p>The report reads: <b>deduplication</b> merged 38 into 9; a <b>correlation</b> rule built the chain; the <b>SOAR</b> executed isolation after <b>human-in-the-loop</b> approval (a person behind a destructive action); <b>MTTR</b> — open-to-containment for P1s — improved from 51 to 22 minutes; and IOCs went out <b>defanged</b> (hxxp:// and [.] notation) so nobody clicks a live indicator, shared over TAXII as STIX objects. <i>Distractors:</i> <b>MTTD</b> would measure detection time, not response; a <b>firewall</b> is not in this story; <b>RACI</b> is a responsibility matrix, not a metric.</p>","hints":["Blank 3 names the platform, blank 4 names the human control.","The improvement from 51 to 22 minutes is a response metric, not a detection metric."],"tip":"Reports need: pipeline terms, the human control, honest metrics with definitions, and defanged IOCs."},{"id":"m29","type":"prio","theme":"C","timeSec":120,"title":"Rank the response actions","scenario":"<p>One compromised workstation, two IR engineers, limited time. Rank the six candidate actions by priority: the top item is what you do in the first minutes.</p>","question":"<p>Rank the six actions from highest priority (top) to lowest priority (bottom).</p>","steps":["Revoke the stolen session tokens (cuts attacker access everywhere at once)","Isolate the workstation (stops lateral movement from that host)","Block the C2 domain at the DNS firewall","Snapshot the EBS volume for forensics","Patch the vulnerable service (prevents re-entry later)","Draft the customer notification (deadline is hours away)"],"explain":"<p>Priority follows attacker access: revoking live session tokens cuts every path the stolen identity has, instantly and reversibly — with valid tokens the attacker can simply log in elsewhere, which is why it outranks isolation. Isolating the host stops lateral movement next, then blocking the C2 domain starves the implant. The snapshot preserves evidence once the bleeding is stopped. Patching prevents re-entry but is not urgent while access is cut, and the customer notification — externally required — still comes after the technical bleeding stops.</p>","hints":["Valid stolen tokens work from any host — what kills them everywhere at once?","External communication has a deadline, but deadlines do not stop active access."],"tip":"Rank by: cut access → stop spread → deny C2 → preserve evidence → harden → communicate."},{"id":"m30","type":"classify","theme":"C","timeSec":150,"title":"What may the automation do alone?","scenario":"<p>The automation council is setting the permission matrix for the SOAR platform: which actions run fully automatic, which need a human click, and which must never be automated at all.</p>","question":"<p>Place each action into the correct bucket. Policy: full-auto only for low-risk, reversible, well-tested actions; HITL for anything impact-heavy; never-automate for wide-blast-radius or unreviewed destructive steps.</p>","buckets":[{"id":"fa","label":"Safe to fully automate"},{"id":"hitl","label":"Requires human approval"},{"id":"never","label":"Never automate"}],"items":[{"t":"Auto-close alerts with confidence under 20 on an allowlisted pattern","b":"fa"},{"t":"Isolate a single workstation with repeated C2 hits at confidence 96","b":"hitl"},{"t":"Disable 1,200 accounts in bulk on a fuzzy name match","b":"never"},{"t":"Purge a phishing email from all mailboxes after dual approval","b":"hitl"},{"t":"Rotate a service account key that appeared in a public repository, and notify the owner","b":"hitl"},{"t":"Add an IOC to the DNS blocklist with an automatic 24-hour expiry","b":"fa"},{"t":"Enrich every new alert with asset owner and IP reputation","b":"fa"},{"t":"Run delete-volume cleanup commands proposed by an LLM, without review","b":"never"}],"explain":"<p>Full-auto fits read-only or bounded, reversible actions: low-confidence auto-close on allowlisted patterns, time-expiring DNS blocks, and enrichment (it changes nothing). HITL fits impact-heavy but legitimate actions: single-host isolation, mailbox-wide purge, and key rotation that can break a production service (the owner is notified precisely because a human owns that risk). Never-automate covers the two classic disasters: bulk fuzzy identity actions with a 1,200-account blast radius, and unreviewed <b>LLM-proposed destructive commands</b> — a model can misread intent, so generated commands need review exactly like intern code.</p>","hints":["Ask three questions per item: reversible? bounded blast radius? reviewed?","Both never-items destroy things at scale — one by quantity, one by being unreviewed."],"tip":"Automation risk = blast radius × reversibility × review. High on any axis means a human approves."}]};
var META=JSON.parse(document.getElementById("cm-exercise-meta").textContent);

var S=null;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}

/* ---------- session ---------- */
function newSession(){
  var perm=shuffle(range(EXS.length));

    var e=EXS[ei];
    var o={pos:pos,e:e,checked:false,locked:false,skipped:false,auto:false,earned:null,gres:null,rows:null,disp:null,hintsUsed:0,hintList:[],touched:false};
    if(e.type==="qcm"||e.type==="multi"){o.opts=shuffle(range(e.options.length));o.sel=(e.type==="multi")?[]:null;}
    else if(e.type==="bank"){o.bank=shuffle(e.bank.slice());o.slots=range(e.slots.length).map(function(){return null;});o.selWord=null;}
    else if(e.type==="classify"){o.items=shuffle(range(e.items.length));o.asg={};o.selItem=null;}
    else if(e.type==="order"){var ord;do{ord=shuffle(range(e.steps.length));}while(ord.every(function(v,i){return v===i;})&&e.steps.length>1);o.ord=ord;}
    else if(e.type==="branch"){o.steps=e.branch.map(function(s){return{q:s.q,opts:shuffle(range(s.opts.length))};});o.chosen=range(e.branch.length).map(function(){return null;});o.stepOpen=0;}
    else if(e.type==="linepick"){o.pick=[];}
    else if(e.type==="terminal"){o.cmd="";o.hist=[];}
    else if(e.type==="logviewer"){var sb=e.sub;o.subOpts=shuffle(range(sb.options.length));o.subSel=(sb.type==="multi")?[]:null;o.filt="";}
    else if(e.type==="fillblank"){o.fb=range(e.slotLabels.length).map(function(){return "";});}
    else if(e.type==="match"){o.rgt=shuffle(e.pairs.map(function(p){return p.r;}).concat(e.extras||[]));o.pair=range(e.pairs.length).map(function(){return null;});o.selL=null;}
    else if(e.type==="prio"){var or2;do{or2=shuffle(range(e.steps.length));}while(or2.every(function(v,i){return v===i;})&&e.steps.length>1);o.ord=or2;}
    return o;
  });
  S={st:st,pos:0,remaining:TOTAL,manual:false,checkPause:false,running:false,done:false,reported:false,attempt:(S&&S.attempt?S.attempt+1:1)};
}
function cur(){return S.st[S.pos];}
function hasAnswer(st){
  if(st.checked)return true;var e=st.e;
  switch(e.type){
    case "qcm":return st.sel!=null;
    case "multi":return st.sel&&st.sel.length>0;
    case "bank":return st.slots.some(function(w){return w;});
    case "classify":return Object.keys(st.asg).length>0;
    case "order":return !!st.touched;
    case "branch":return st.chosen.every(function(c){return c!=null;});
    case "linepick":return st.pick.length>0;
    case "terminal":return st.cmd.trim().length>0;
    case "logviewer":return st.subSel!=null&&(typeof st.subSel==="number"||st.subSel.length>0);
    case "fillblank":return st.fb.some(function(v){return v.trim().length>0;});
    case "match":return st.pair.some(function(j){return j!=null;});
    case "prio":return !!st.touched;
  }return false;
}

/* ---------- grading ---------- */
function grade(st){
  var e=st.e,rows=[],frac=0,disp={};
  var pen=Math.pow(0.9,st.hintsUsed);
  function pct(f){return Math.max(0,Math.min(1,f*pen));}
  if(e.type==="qcm"){
    var dC=st.opts.indexOf(e.correct[0]);var ok=(st.opts[st.sel]===e.correct[0]);frac=pct(ok?1:0);
    disp={picked:st.sel,correct:dC};
    rows=[{t:(ok?"Your pick is the correct answer.":"Correct answer: "+e.options[e.correct[0]]+"."),s:ok?"ok":"bad"}];
  }else if(e.type==="multi"){
    var selO=st.sel.map(function(d){return st.opts[d];});
    var hits=selO.filter(function(o){return e.correct.indexOf(o)>=0;}).length;
    frac=pct(hits/e.correct.length);
    disp={correctD:e.correct.map(function(o){return st.opts.indexOf(o);}),picked:st.sel.slice()};
    e.correct.forEach(function(o){var d=st.opts.indexOf(o);var was=st.sel.indexOf(d)>=0;
      rows.push({t:(was?"Correctly selected: ":"Missed (correct but not selected): ")+e.options[o],s:was?"ok":"miss"});});
    st.sel.forEach(function(d){var o=st.opts[d];if(e.correct.indexOf(o)<0)rows.push({t:"Selected but not correct: "+e.options[o],s:"bad"});});
  }else if(e.type==="bank"){
    var hits=0;disp={slotState:[]};
    st.slots.forEach(function(w,i){var ok=w===e.slots[i];var s2=!w?"miss":(ok?"ok":"bad");disp.slotState[i]=s2;if(ok)hits++;
      rows.push({t:(ok?"Slot "+(i+1)+" correct.":(w?"Slot "+(i+1)+": you placed \""+w+"\" — correct: \""+e.slots[i]+"\".":"Slot "+(i+1)+" left empty — correct: \""+e.slots[i]+"\".")),s:s2});});
    frac=pct(hits/e.slots.length);
  }else if(e.type==="classify"){
    var hits=0;disp={itemState:{}};
    st.items.forEach(function(oi,d){var item=e.items[oi];var b=st.asg[d];var ok=b===item.b;var s2=b?(ok?"ok":"bad"):"miss";disp.itemState[d]=s2;if(ok)hits++;
      rows.push({t:(ok?"Correct: ":(b?"Wrong: ":"Not placed: "))+trunc(item.t,80)+(b?(" — you said "+bucketLabel(e,b)+", correct: "+bucketLabel(e,item.b)):" (correct: "+bucketLabel(e,item.b)+")"),s:s2});});
    frac=pct(hits/e.items.length);
  }else if(e.type==="order"||e.type==="prio"){
    var hits=0;disp={posState:[]};
    st.ord.forEach(function(oi,i){var ok=oi===i;disp.posState[i]=ok?"ok":"bad";if(ok)hits++;});
    frac=pct(hits/e.steps.length);
    for(var i=0;i<e.steps.length;i++){var okP=st.ord[i]===i;
      rows.push({t:(okP?"Position "+(i+1)+" correct.":"Position "+(i+1)+": you had \""+trunc(e.steps[st.ord[i]],60)+"\" — correct: \""+trunc(e.steps[i],60)+"\"."),s:okP?"ok":"bad"});}
  }else if(e.type==="fillblank"){
    var hitsF=0;disp={fbState:[]};
    e.blanks.forEach(function(b,i){var v=(st.fb[i]||"").trim().replace(/\s+/g," ").toLowerCase();var s2;
      if(!v){s2="miss";}else{s2=b.accepts.some(function(rx){return new RegExp("^(?:"+rx+")$","i").test(v);})?"ok":"bad";}
      disp.fbState[i]=s2;if(s2==="ok")hitsF++;
      rows.push({t:(s2==="ok"?"Blank "+(i+1)+" correct.":"Blank "+(i+1)+": "+(s2==="miss"?"left empty":"you typed \""+((st.fb[i]||"").replace(/\s+/g," ").trim())+"\"")+" — expected: "+b.answer+"."),s:s2});});
    frac=pct(hitsF/e.blanks.length);
  }else if(e.type==="match"){
    var hitsM=0;disp={pairState:[]};
    e.pairs.forEach(function(p,i){var j=st.pair[i];var ok=j!=null&&st.rgt[j]===p.r;var s2=j!=null?(ok?"ok":"bad"):"miss";disp.pairState[i]=s2;if(ok)hitsM++;
      rows.push({t:(ok?"Correct pair: ":(j!=null?"Wrong: ":"Not paired: "))+trunc(p.l,60)+(j!=null&&!ok?(" — you said \""+st.rgt[j]+"\"; "):" → ")+"correct: \""+p.r+"\"",s:s2});});
    frac=pct(hitsM/e.pairs.length);
  }else if(e.type==="branch"){
    var hits=0;disp={stepState:[],correctD:[]};
    e.branch.forEach(function(bs,si){var d=st.chosen[si];var orig=d==null?null:st.steps[si].opts[d];var ok=orig===bs.c;disp.stepState[si]=ok?"ok":"bad";disp.correctD[si]=st.steps[si].opts.indexOf(bs.c);if(ok)hits++;
      rows.push({t:(ok?"Step "+(si+1)+" correct.":"Step "+(si+1)+": correct choice was \""+bs.opts[bs.c].t+"\"."),s:ok?"ok":"bad"});});
    frac=pct(hits/e.branch.length);
  }else if(e.type==="linepick"){
    if(e.single){
      var ok=st.pick.length===1&&st.pick[0]===e.expected[0];frac=pct(ok?1:0);
      disp={lineState:{}};disp.lineState[e.expected[0]]=ok?"ok":"miss";
      st.pick.forEach(function(i){if(i!==e.expected[0])disp.lineState[i]="bad";});
      rows=[{t:(ok?"Correct line.":"The problem is line "+(e.expected[0]+1)+": "+trunc(e.lines[e.expected[0]],90)),s:ok?"ok":"bad"}];
    }else{
      var hits=0;disp={lineState:{}};
      e.expected.forEach(function(i){var was=st.pick.indexOf(i)>=0;disp.lineState[i]=was?"ok":"miss";if(was)hits++;
        rows.push({t:(was?"Correct: ":"Missed problem line "+(i+1)+": ")+trunc(e.lines[i],90),s:was?"ok":"miss"});});
      st.pick.forEach(function(i){if(e.expected.indexOf(i)<0){disp.lineState[i]="bad";rows.push({t:"Not a real problem: line "+(i+1),s:"bad"});}});
      frac=pct(hits/e.expected.length);
    }
  }else if(e.type==="terminal"){
    var norm=st.cmd.trim().replace(/\s+/g," ");
    var ok=e.accepts.every(function(rx){return new RegExp(rx,"i").test(norm);});frac=pct(ok?1:0);
    disp={ok:ok};
    st.hist=[{cmd:st.cmd,ok:ok}];
    rows=[{t:(ok?"Command accepted.":"Command not accepted — compare it with the accepted approach in the explanation."),s:ok?"ok":"bad"}];
  }else if(e.type==="logviewer"){
    var sb=e.sub;
    if(sb.type==="qcm"){
      var dC=st.subOpts.indexOf(sb.correct[0]);var ok=(st.subOpts[st.subSel]===sb.correct[0]);frac=pct(ok?1:0);
      disp={picked:st.subSel,correct:dC};
      rows=[{t:(ok?"Your pick is the correct answer.":"Correct answer: "+sb.options[sb.correct[0]]+"."),s:ok?"ok":"bad"}];
    }else{
      var selO=st.subSel.map(function(d){return st.subOpts[d];});
      var hits=selO.filter(function(o){return sb.correct.indexOf(o)>=0;}).length;
      frac=pct(hits/sb.correct.length);
      disp={correctD:sb.correct.map(function(o){return st.subOpts.indexOf(o);}),picked:st.subSel.slice()};
      sb.correct.forEach(function(o){var d=st.subOpts.indexOf(o);var was=st.subSel.indexOf(d)>=0;
        rows.push({t:(was?"Correctly selected: ":"Missed (correct but not selected): ")+sb.options[o],s:was?"ok":"miss"});});
      st.subSel.forEach(function(d){var o=st.subOpts[d];if(sb.correct.indexOf(o)<0)rows.push({t:"Selected but not correct: "+sb.options[o],s:"bad"});});
    }
  }
  st.disp=disp;
  return {frac:Math.round(frac*1000)/1000,rows:rows};
}
function bucketLabel(e,id){for(var i=0;i<e.buckets.length;i++){if(e.buckets[i].id===id)return e.buckets[i].label;}return id;}

function stateIcon(s){return s==="ok"?"✔":(s==="bad"?"✘":"± ");}

function answerHTML(st){
  var e=st.e,dis=st.locked,h="";
  if(e.type==="qcm"){
    h="<div role=\"group\" aria-label=\"Choose one answer\">";

    e.buckets.forEach(function(b){
      var inner="";st.items.forEach(function(oi,d){if(st.asg[d]===b.id){
        var m=st.checked&&st.locked&&st.disp?" "+st.disp.itemState[d]:"";
        inner+="<button class=\"chip"+m+"\" draggable=\"true\" data-act=\"item\" data-d=\""+d+"\" data-fk=\"i"+d+"\""+(dis?" disabled":"")+">"+esc(e.items[oi].t)+(m?"<span class=\"stic\">"+stateIcon(m.trim())+"</span>":"")+"</button>";}});
      h+="<div class=\"bkt\" data-act=\"bkt\" data-b=\""+b.id+"\" data-fk=\"b"+b.id+"\" role=\"group\" aria-label=\"Bucket: "+esc(b.label)+"\"><h4>"+esc(b.label)+"</h4>"+inner+"</div>";
    });

  }else if(e.type==="order"||e.type==="prio"){

  }else if(e.type==="linepick"){
    h="<div class=\"cfg\">";var D=st.checked&&st.locked?st.disp:null;

      if(st.checked&&st.locked){var D2=st.disp;
        if(sb.type==="multi"&&D2.correctD){var isC=D2.correctD.indexOf(d)>=0;if(isC&&picked)m=" ok";else if(isC&&!picked)m=" miss";else if(!isC&&picked)m=" bad";}
        else{if(d===D2.correct)m=" ok";else if(d===D2.picked)m=" bad";}}
      h+="<button class=\"opt"+(picked?" sel":"")+m+"\" data-act=\"subsel\" data-d=\""+d+"\" data-fk=\"so"+d+"\" aria-pressed=\""+picked+"\""+(dis?" disabled":"")+">"+esc(sb.options[oi])+(m?"<span class=\"stic\">"+stateIcon(m.trim())+"</span>":"")+"</button>";
    });
    h+="</div>";
  }
  return h;

function feedbackHTML(st){
  var g=st.gres;var cls=g.frac>=0.999?"fb ok":(g.frac>0?"fb pt":"fb bd");
  var head=g.frac>=0.999?"✔ Full credit":(g.frac>0?"▲ Partial credit":"✘ Not correct");
  var li="";g.rows.forEach(function(r){li+="<li>"+stateIcon(r.s)+" "+r.t+"</li>";});
  var pts="<div class=\"pts\">You earned "+g.frac.toFixed(2).replace(/\.?0+$/,"")+" / 1 point on this exercise.";
  if(st.hintsUsed>0)pts+=" (includes hint penalty −10% × "+st.hintsUsed+")";
  pts+="</div>";
  var tip=st.e.tip&&g.frac<0.999?"<div class=\"tip\"><span class=\"lb\">Focus on:</span> "+st.e.tip+"</div>":"";
  return "<div class=\""+cls+"\"><div class=\"fbh\">"+head+"</div><ul>"+li+"</ul>"+pts+"</div>"+

}

}
