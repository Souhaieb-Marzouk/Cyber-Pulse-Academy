function wireExercise(st){
  var cmdin=$("#cmdin");
  if(cmdin)cmdin.addEventListener("input",function(){st.cmd=cmdin.value;});
  var fbs=document.querySelectorAll("input[data-act=fb]");
  for(var fi=0;fi<fbs.length;fi++){(function(inp){var ix=parseInt(inp.dataset.i,10);inp.addEventListener("input",function(){st.fb[ix]=inp.value;st.touched=true;});})(fbs[fi]);}
  var fbox=$("[data-act=filter]");
  if(fbox)fbox.addEventListener("input",function(){st.filt=fbox.value;var lb=$("#logbox");if(lb){var shown=0,lg="";st.e.logs.forEach(function(l){var ok=!st.filt||l.toLowerCase().indexOf(st.filt.toLowerCase())>=0;if(ok){shown++;lg+="<div class=\"lg\">"+hl(l)+"</div>";}});lb.innerHTML=lg;$("#lcount").textContent=shown+" / "+st.e.logs.length+" lines shown";}});
  $("#btnPause").addEventListener("click",function(){S.manual=!S.manual;render();});
}
function flash(msg){var f=$("#flash");if(f)f.textContent=msg;}

/* ---------- actions ---------- */
function focusKey(){var a=document.activeElement;return a&&a.dataset&&a.dataset.fk?a.dataset.fk:null;}
function restoreFocus(k){if(!k)return;var n=document.querySelector("[data-fk=\""+k+"\"]");if(n)n.focus();}
function rerender(){var k=focusKey();render();restoreFocus(k);}
function onCheck(){
  var st=cur();
  if(S.manual){flash("Resume first — the exercise is hidden while paused.");return;}
  if(!hasAnswer(st)){flash("Give an answer first (all steps for branching scenarios).");return;}
  var g=grade(st);
  st.checked=true;st.locked=true;st.skipped=false;st.earned=g.frac;st.gres=g;
  S.checkPause=true;
  rerender();
}
function onHint(){
  var st=cur();var hs=st.e.hints||[];
  if(st.hintsUsed>=hs.length)return;
  st.hintsUsed++;st.hintList.push(hs[st.hintsUsed-1]);
  rerender();
  var f=$("#flash");if(f)f.textContent="Hint used: −10% of this exercise's points. "+hs[st.hintsUsed-1];
}
function goNext(){
  if(S.pos<S.st.length-1){S.pos++;S.checkPause=false;NAVF=true;render();}
  else submit(false);
}
function goPrev(){if(S.pos>0){S.pos--;NAVF=true;render();}}
function onSubmitWarn(){flash("Almost every exercise is skipped — answer at least one before finishing.");}
function submit(auto){
  var possible=0,earned=0,skipped=[];
  S.st.forEach(function(st){
    if(!st.checked&&hasAnswer(st)){var g=grade(st);st.checked=true;st.locked=true;st.earned=g.frac;st.gres=g;st.auto=true;st.skipped=false;}
    if(st.checked&&st.earned!=null){possible++;earned+=st.earned;}
    else{st.skipped=true;skipped.push(st);}
  });
  if(possible===0){
    if(auto){S.done=true;renderEmptyResults();}
    else onSubmitWarn();
    return;
  }
  S.done=true;S.checkPause=false;S.manual=false;
  var raw=Math.round(earned*100)/100;
  var rs=Math.round(raw);
  var pct=Math.round(rs/possible*100);
  var passed=pct>=META.passMark;
  renderResults(raw,rs,possible,pct,passed,skipped);
  if(!S.reported){S.reported=true;reportScore(rs,possible,passed);}
}
function reportScore(score,total,passed){
  var percent=Math.round((score/total)*100);
  try{parent.postMessage({type:"CYBERPULSE_SCORE",topicId:META.topicId,score:score,total:total,percent:percent,passed:percent>=META.passMark},location.origin);}catch(e){}
}
function renderEmptyResults(){
  $("#app").innerHTML="<div class=\"panel center\"><div class=\"verdict vfail\">NO SCORE</div><p>Every exercise was left unanswered, so there is nothing to score.</p><button class=\"btn primary\" data-act=\"retake\">Retake exam</button></div>";
}
function summarizeAnswer(st){
  var e=st.e;
  try{
    if(e.type==="qcm")return st.sel==null?"—":e.options[st.opts[st.sel]];
    if(e.type==="multi")return st.sel.map(function(d){return e.options[st.opts[d]];}).join(" | ")||"—";
    if(e.type==="bank")return st.slots.map(function(w,i){return (i+1)+": "+(w||"—");}).join(" | ");
    if(e.type==="classify")return st.items.map(function(oi,d){return trunc(e.items[oi].t,40)+" → "+(st.asg[d]?bucketLabel(e,st.asg[d]):"(not placed)");}).join(" | ");
    if(e.type==="order")return st.ord.map(function(oi,i){return (i+1)+". "+trunc(e.steps[oi],44);}).join(" | ");
    if(e.type==="prio")return st.ord.map(function(oi,i){return (i+1)+". "+trunc(e.steps[oi],44);}).join(" | ");
    if(e.type==="fillblank")return st.fb.map(function(v,i){return (i+1)+": "+(v.trim()||"—");}).join(" | ");
    if(e.type==="match")return e.pairs.map(function(p,i){var j=st.pair[i];return trunc(p.l,40)+" → "+(j!=null?st.rgt[j]:"(unpaired)");}).join(" | ");
    if(e.type==="branch")return st.chosen.map(function(c,s){return "S"+(s+1)+": "+(c==null?"—":trunc(e.branch[s].opts[st.steps[s].opts[c]].t,40));}).join(" | ");
    if(e.type==="linepick")return st.pick.length?st.pick.sort(function(a,b){return a-b;}).map(function(i){return "line "+(i+1);}).join(", "):"—";
    if(e.type==="terminal")return st.cmd||"—";
    if(e.type==="logviewer"){var sb=e.sub;return sb.type==="multi"?st.subSel.map(function(d){return sb.options[st.subOpts[d]];}).join(" | "):(st.subSel==null?"—":sb.options[st.subOpts[st.subSel]]);}
  }catch(err){return "—";}
  return "—";
}
function correctAnswerText(st){
  var e=st.e;
  try{
    if(e.type==="qcm")return e.options[e.correct[0]];
    if(e.type==="multi")return e.correct.map(function(o){return e.options[o];}).join(" | ");
    if(e.type==="bank")return e.slots.map(function(w,i){return (i+1)+": "+w;}).join(" | ");
    if(e.type==="classify")return e.items.map(function(it){return trunc(it.t,40)+" → "+bucketLabel(e,it.b);}).join(" | ");
    if(e.type==="order")return e.steps.map(function(s,i){return (i+1)+". "+trunc(s,44);}).join(" | ");
    if(e.type==="prio")return e.steps.map(function(s,i){return (i+1)+". "+trunc(s,44);}).join(" | ");
    if(e.type==="fillblank")return e.blanks.map(function(b,i){return (i+1)+": "+b.answer;}).join(" | ");
    if(e.type==="match")return e.pairs.map(function(p){return trunc(p.l,40)+" → "+p.r;}).join(" | ");
    if(e.type==="branch")return e.branch.map(function(b,s){return "S"+(s+1)+": "+b.opts[b.c].t;}).join(" | ");
    if(e.type==="linepick")return e.expected.map(function(i){return "line "+(i+1)+": "+trunc(e.lines[i],60);}).join(" | ");
    if(e.type==="terminal")return e.acceptNote||e.goal;
    if(e.type==="logviewer"){var sb=e.sub;return sb.type==="multi"?sb.correct.map(function(o){return sb.options[o];}).join(" | "):sb.options[sb.correct[0]];}
  }catch(err){return "—";}
  return "—";
}
function renderResults(raw,rs,possible,pct,passed,skipped){
  var rows="";
  S.st.forEach(function(st,i){
    var lbl,max=(st.e.points||1);
    if(st.skipped&&!st.checked)lbl="<span class=\"lbl skipped\">SKIPPED — excluded</span>";
    else{var f=st.earned;lbl=f>=0.999?"<span class=\"lbl full\">FULL</span>":(f>0?"<span class=\"lbl partial\">PARTIAL</span>":"<span class=\"lbl zero\">ZERO</span>");}
    rows+="<div class=\"rrow\"><div class=\"rhead\"><b>"+(i+1)+". "+esc(st.e.title)+"</b>"+lbl+"<span class=\"rpts\">"+(st.checked?st.earned.toFixed(2).replace(/\.?0+$/,""):"0")+" / "+max+"</span></div>"+
      "<div class=\"you\"><b>Your answer:</b> "+esc(trunc(summarizeAnswer(st),300))+"</div>"+
      (st.checked?"<div class=\"corr\"><b>Correct:</b> "+esc(trunc(correctAnswerText(st),300))+"</div>":"")+
      (st.auto?"<div class=\"badge-note\">Graded automatically when the exam ended (you answered but never pressed Check).</div>":"")+
      "<details><summary>Show explanation</summary><div class=\"expl\"><span class=\"lb\">Why:</span>"+st.e.explain+"</div>"+(st.e.tip&&(!st.checked||st.earned<0.999)?"<div class=\"tip\"><span class=\"lb\">Focus on:</span> "+st.e.tip+"</div>":"")+"</details></div>";
  });
  var skList=skipped.length?"<div class=\"panel\"><b>Skipped and excluded from scoring ("+skipped.length+"):</b><ul>"+skipped.map(function(s){var i=S.st.indexOf(s)+1;return "<li>"+i+". "+esc(s.e.title)+"</li>";}).join("")+"</ul><p class=\"badge-note\">These points were removed from both the numerator and the denominator.</p></div>":"";
  var seal=passed?
    "<div class=\"panel center\" style=\"border:2px solid var(--ok)\"><div class=\"verdict vpass\">✔ PASSED</div><div class=\"big\">"+pct+"%</div><p><b>"+esc(WHO||"Candidate")+"</b>"+(WHOCC?" ("+esc(WHOCC)+")":"")+" — you reached the "+META.passMark+"% pass mark on "+esc(META.title)+".</p><p class=\"badge-note\">"+new Date().toLocaleDateString()+" · attempt "+(S.attempt||1)+" · reported score "+rs+" / "+possible+"</p></div>":
    "<div class=\"panel center\" style=\"border:2px solid var(--bad)\"><div class=\"verdict vfail\">✘ NOT PASSED</div><div class=\"big\">"+pct+"%</div><p>You need "+META.passMark+"% to pass. Review the explanations below, then retake the exam — questions and answers reshuffle.</p></div>";
  $("#app").innerHTML="<h1>Results — "+esc(META.title)+"</h1>"+
    seal+
    "<div class=\"panel center\"><div class=\"statrow\" style=\"justify-content:center\"><div class=\"stat\">raw points <b>"+raw+"</b> / "+possible+"</div><div class=\"stat\">reported score <b>"+rs+"</b> / "+possible+"</div><div class=\"stat\">pass mark <b>"+META.passMark+"%</b></div><div class=\"stat\">skipped & excluded <b>"+skipped.length+"</b></div></div></div>"+
    skList+
    "<h2>Per-exercise report</h2>"+rows+
    "<div class=\"center\" style=\"margin:16px 0\"><button class=\"btn primary\" data-act=\"retake\" style=\"font-size:17px;padding:12px 34px\">↻ Retake exam</button></div>";
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  if(S&&!S.done&&!S.running)return;
  var act=b.dataset.act;var st=cur();
  var dis=st&&st.locked;
  if(act==="retake"){newSession();S.running=true;render();return;}
  if(!S||!S.running||S.done)return;
  if(act==="nav"){var i=parseInt(b.dataset.i,10);if(i!==S.pos){S.pos=i;NAVF=true;render();}return;}
  if(act==="prev"){goPrev();return;}
  if(act==="next"){goNext();return;}
  if(act==="hint"){if(S.manual){flash("Resume first — hints are hidden with the exercise.");return;}onHint();return;}
  if(act==="check"){onCheck();return;}
  if(act==="revise"){st.locked=false;rerender();return;}
  if(act==="skip"){if(!st.checked){st.skipped=true;
    if(S.pos<S.st.length-1){goNext();}
    else{flash("Skipped — it stays excluded unless you answer and Check it before finishing. Press Finish to submit.");rerender();}}
    else{flash("Already checked — use Revise to edit it, or Next to continue.");}return;}
  if(act==="onoop")return;
  if(dis)return;
  if(act==="sel"){st.touched=true;
    if(st.e.type==="multi"){var d=parseInt(b.dataset.d,10);var ix=st.sel.indexOf(d);if(ix>=0)st.sel.splice(ix,1);else st.sel.push(d);}
    else st.sel=parseInt(b.dataset.d,10);
    rerender();}
  else if(act==="bank"){var w=b.dataset.w;st.touched=true;st.selWord=(st.selWord===w?null:w);rerender();}
  else if(act==="slot"){var i2=parseInt(b.dataset.i,10);st.touched=true;
    if(st.slots[i2]){st.slots[i2]=null;}
    else if(st.selWord){var old=st.slots.indexOf(st.selWord);if(old>=0)st.slots[old]=null;st.slots[i2]=st.selWord;st.selWord=null;}
    rerender();}
  else if(act==="item"){var d2=parseInt(b.dataset.d,10);st.touched=true;
    if(st.asg[d2]!=null){delete st.asg[d2];st.selItem=null;}
    else st.selItem=(st.selItem===d2?null:d2);
    rerender();}
  else if(act==="bkt"){if(st.selItem!=null){st.touched=true;st.asg[st.selItem]=b.dataset.b;st.selItem=null;rerender();}}
  else if(act==="up"||act==="down"){var j=parseInt(b.dataset.i,10);var k=act==="up"?j-1:j+1;
    if(k>=0&&k<st.ord.length){st.touched=true;var t=st.ord[j];st.ord[j]=st.ord[k];st.ord[k]=t;rerender();}}
  else if(act==="orow"){st.selRow=parseInt(b.dataset.i,10);rerender();}
  else if(act==="ln"){var i3=parseInt(b.dataset.i,10);st.touched=true;var ix3=st.pick.indexOf(i3);if(ix3>=0)st.pick.splice(ix3,1);else st.pick.push(i3);rerender();}
  else if(act==="mpair"){var mi=parseInt(b.dataset.i,10);st.touched=true;
    if(st.pair[mi]!=null){st.pair[mi]=null;st.selL=null;}
    else st.selL=(st.selL===mi?null:mi);
    rerender();}
  else if(act==="mright"){if(st.selL==null){flash("Click a left item first, then click its partner.");return;}
    var mj=parseInt(b.dataset.j,10);st.touched=true;
    for(var pk=0;pk<st.pair.length;pk++){if(st.pair[pk]===mj)st.pair[pk]=null;}
    st.pair[st.selL]=mj;st.selL=null;rerender();}
  else if(act==="bstep"){var s=parseInt(b.dataset.s,10),d3=parseInt(b.dataset.d,10);st.touched=true;
    st.chosen[s]=d3;st.stepOpen=Math.max(st.stepOpen,s+1);
    for(var z=s+1;z<st.chosen.length;z++)st.chosen[z]=null;
    rerender();}
  else if(act==="subsel"){st.touched=true;
    if(st.e.sub.type==="multi"){var d4=parseInt(b.dataset.d,10);var ix4=st.subSel.indexOf(d4);if(ix4>=0)st.subSel.splice(ix4,1);else st.subSel.push(d4);}
    else st.subSel=parseInt(b.dataset.d,10);
    rerender();}
});
document.addEventListener("dragstart",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var st=cur();if(st.locked){ev.preventDefault();return;}
  if(b.dataset.act==="bank"){DRAG={kind:"bank",w:b.dataset.w};}
  else if(b.dataset.act==="item"){DRAG={kind:"item",d:parseInt(b.dataset.d,10)};}
  else if(b.dataset.act==="orow"){DRAG={kind:"orow",i:parseInt(b.dataset.i,10)};}
  else return;
  try{ev.dataTransfer.setData("text/plain",JSON.stringify(DRAG));}catch(e){}
});
document.addEventListener("dragover",function(ev){
  var t=ev.target.closest("[data-act=slot],[data-act=bkt],[data-act=orow]");if(!t||!DRAG)return;
  ev.preventDefault();t.classList.add("over");
});
document.addEventListener("dragleave",function(ev){var t=ev.target.closest(".over");if(t)t.classList.remove("over");});
document.addEventListener("drop",function(ev){
  var t=ev.target.closest("[data-act=slot],[data-act=bkt],[data-act=orow]");if(!t||!DRAG)return;
  ev.preventDefault();t.classList.remove("over");
  var st=cur();if(st.locked){DRAG=null;return;}
  if(t.dataset.act==="slot"&&DRAG.kind==="bank"){var i=parseInt(t.dataset.i,10);var old=st.slots.indexOf(DRAG.w);if(old>=0)st.slots[old]=null;st.slots[i]=DRAG.w;st.touched=true;}
  else if(t.dataset.act==="bkt"&&DRAG.kind==="item"){st.asg[DRAG.d]=t.dataset.b;st.selItem=null;st.touched=true;}
  else if(t.dataset.act==="orow"&&DRAG.kind==="orow"){var j=parseInt(t.dataset.i,10);var from=DRAG.i;var it=st.ord.splice(from,1)[0];st.ord.splice(j,0,it);st.touched=true;}
  DRAG=null;rerender();
});
var DRAG=null;
window.addEventListener("message",function(ev){
  var d=ev.data;if(!d||typeof d!=="object")return;
  if(d.type==="CYBERPULSE_INIT"||d.type==="CYBERMASTERY_INIT"){
    if(d.username){WHO=String(d.username).slice(0,60);}
    if(d.country){WHOCC=String(d.country).slice(0,2).toUpperCase();}
    /* d.theme is ignored on purpose: this file ships dark-only (site rule: do not invent a light theme).
       d.locale, d.topicId and d.batch are accepted but deliberately unused — the file must not send a batch. */
    if(!S.done)render();
  }
});
/* QA / self-test hook: read-only snapshot of visible state, plus a timer fast-forward that can only
   shorten the clock (never extend it, never touch scoring) — equivalent to pressing Finish early. */
window.SecAIQA={
  snapshot:function(){
    var c=cur();
    return {running:S.running,done:S.done,remaining:S.remaining,manual:S.manual,checkPause:S.checkPause,
      pos:S.pos,attempt:S.attempt,reported:S.reported,who:WHO,cc:WHOCC,total:EXS.length,
      ids:S.st.map(function(x){return x.e.id;}),
      checked:S.st.filter(function(x){return x.checked&&x.earned!=null;}).length,
      earned:S.st.reduce(function(a,x){return a+(x.checked&&x.earned!=null?x.earned:0);},0),
      skipped:S.st.filter(function(x){return x.skipped&&!x.checked;}).length,
      cur:{id:c.e.id,type:c.e.type,locked:c.locked,checked:c.checked,skipped:c.skipped,
        rows:(c.e.type==="order"||c.e.type==="prio")?c.ord.map(function(oi){return c.e.steps[oi];}):null,
        fbvals:c.e.type==="fillblank"?c.fb.slice():null,
        pairIdx:c.e.type==="match"?c.pair.slice():null}};
  },
  ffw:function(n){if(S&&S.running&&!S.done){S.remaining=Math.max(1,(S.remaining||0)-Math.max(0,n|0));var c2=$("#clock");if(c2)c2.textContent="⏱ "+fmt(S.remaining);}}
};
newSession();
render();
setInterval(function(){
  if(S&&S.running&&!S.done&&!S.manual&&!S.checkPause){
    S.remaining--;
    var c=$("#clock");
    if(c){c.textContent="⏱ "+fmt(Math.max(0,S.remaining));
      if(S.remaining<60)c.className=" clock danger";else if(S.remaining<300)c.className=" clock warn";}
    if(S.remaining<=0){submit(true);}
  }
},1000);
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
