intro:`<div class="card"><h4>What this exam is</h4><p>Thirty MEDIUM-severity exercises on the rules that govern AI: the EU AI Act and its risk tiers, global privacy laws, NIST and ISO frameworks, sector rules, governance controls and data-protection techniques. Scenarios use realistic tickets, logs and configs. The reasoning is multi-step, but a prepared candidate can always find the correct path.</p></div>
<div class="card"><h4>How to answer</h4><p>Every exercise has three blocks: SCENARIO (the setup), QUESTION (what you must decide) and ANSWERS (how to interact). You will triage tickets, drag items into buckets, reorder steps, match and complete policy text, click mistakes in configs, read logs with a filter, work through decision steps and type two terminal commands. Up to five classic multiple-choice items appear.</p></div>
<div class="card"><h4>Check, Skip and returning</h4><p>Press <b>Check</b> to validate: green = correct, red = wrong, amber = missed, with an explanation. Check also locks the answer and pauses the timer in <b>review mode</b> — everything stays visible while you study it; only <b>Next</b> restarts the clock. Press <b>Skip</b> to move on (amber flag in the navigator). Until the timer ends you can return to any exercise, including skipped ones, and finish it.</p></div>
<div class="card"><h4>Two different pauses</h4><p>1) <b>Manual pause</b> (top bar) blurs the exercise while the clock is stopped, so you cannot study while paused this way. 2) <b>Check-pause</b> (after Check) keeps everything visible; the clock stays frozen until you press Next. They stack: both must be cleared for the timer to run. A hint costs 10% of the exercise points and never pauses the timer.</p></div>
<div class="card"><h4>Partial credit and scoring</h4><p>Multi-answer exercises are scored per correct element — wrong picks earn nothing but never subtract. Each exercise is worth 1 point; the pass mark is <b>70%</b>, computed only over the exercises you did not skip. Skipped exercises are excluded from both the points earned and the maximum.</p></div>
<div class="card"><h4>Timer</h4><p>80 minutes for 30 exercises — about 2 minutes 40 seconds each. The clock turns amber under 5 minutes and red under 1 minute. At zero the exam is submitted automatically and everything answered but not checked is scored as-is.</p></div>`,

h:`Think about what each artefact is for: disclosure to users, data protection, a certifiable management system, a four-function risk framework, cloud PII, and an attestation report.`,
x:`<p>Chatbot disclosure is a transparency duty of the <b>EU AI Act</b> (limited-risk tier). Training on customer emails is personal-data processing, so <b>GDPR</b> owns lawful basis and the DPIA. A certifiable AI management system is exactly <b>ISO/IEC 42001</b>. Govern–Map–Measure–Manage are the four functions of the <b>NIST AI RMF</b>. PII in the public cloud is the subject of <b>ISO/IEC 27018</b>. An independent report over a period of time is a <b>SOC 2 Type II</b>.</p><p><b>Tip:</b> sort requests by their artefact (law, certificate, report, framework) and the routing becomes mechanical.</p>`},

{t:'Difficulty-scaling logic in a video game',b:3}]},
h:`Banned practices are about social scoring, manipulation and certain biometric uses — not ordinary business tools. Employment, credit and essential services are the classic high-risk areas.`,
x:`<p>Social scoring and real-time remote biometric identification in public spaces are <b>banned practices</b>. CV screening and credit scoring sit in <b>Annex III high-risk</b> (employment, financial decisions). Chatbots and synthetic media carry <b>transparency duties</b> — people must know they talk to an AI or watch generated content. Spam filters and game logic are <b>minimal risk</b> with no specific duties.</p><p><b>Tip:</b> ask two questions — “does the law ban this?” and “does it make a consequential decision about a person?”</p>`},
{id:'M03',th:1,T:'Which law applies where?',t:'match',
s:`<p>Your SaaS company is headquartered in Frankfurt but sells everywhere. Legal asks you to prepare a one-page map of which privacy law binds the team in each market.</p>`,
q:`Match each privacy law to the jurisdiction or people it covers.`,
d:{rows:[
{k:'GDPR',a:0},
{k:'CCPA / CPRA',a:1},
{k:'PIPL',a:2},
{k:'LGPD',a:3},
{k:'UK GDPR + Data Protection Act 2018',a:4},
{k:'DPDP Act 2023',a:5}],
opts:['EU / EEA — plus any organisation targeting the EU','California consumers','China','Brazil','United Kingdom','India']},
h:`Three of these are national laws named after places; one is named after a language. Match the names first, then the scope notes.`,
x:`<p><b>GDPR</b> covers the EU/EEA and reaches any company that offers goods to or monitors people in the EU — that is why a US firm can be bound. <b>CCPA/CPRA</b> protects California residents. <b>PIPL</b> is China’s personal-information law. <b>LGPD</b> is Brazil’s general data-protection law. The <b>UK GDPR</b> with the DPA 2018 is the post-Brexit UK regime. India’s law is the <b>DPDP Act 2023</b>.</p><p><b>Tip:</b> extraterritorial scope is the key word — several of these laws follow the users, not the office address.</p>`},
{id:'M04',th:0,T:'Chatbot launch — minimum duty',t:'qcm',
s:`<p>Cobalt Logistics plans to put a customer-support chatbot on its German claims portal. The model is a small assistant with no consequential decisions. Legal wants to know the minimum EU AI Act duty before launch.</p>`,
q:`What is the minimum obligation the EU AI Act places on this chatbot?`,
d:{c:[
'Run a full conformity assessment and affix CE marking before launch',
'Tell users clearly that they are talking to an AI system',
'Register the chatbot in the EU public database for high-risk systems',
'Appoint an accredited notified body to review every release'],a:1},
h:`No consequential decision about a person is made. Which tier discloses rather than restricts?`,
x:`<p>A plain support chatbot is <b>limited risk</b>: the Act only requires that people are told they are interacting with AI. Conformity assessment, CE marking, registration and notified bodies belong to the <b>high-risk</b> regime, which does not apply here.</p><p><b>Tip:</b> the tiers map to duty intensity — banned, high-risk, transparency-only, then minimal risk with nothing required.</p>`},
{id:'M05',th:4,T:'Complete the acceptable-use policy',t:'fill',
s:`<p>Lumina Energy is writing its first AI acceptable-use policy. The draft below came from a template, but the key governance terms are missing. You hold the word bank.</p>`,
q:`Complete each blank with the correct term from the bank. Every blank uses the same bank; terms may not all be used.`,
d:{text:`All AI systems that process personal data must have a documented {{0}} before development starts. We collect only the fields we truly need — {{1}} is the rule. Every dataset must carry a {{2}} so its origin and permissions are known. Decisions with legal or similar effects on people always keep a {{3}} in the loop. We publish plain-language notices about our models, because {{4}} is not optional.`,
bank:['lawful basis','data minimisation','data lineage','human oversight','transparency','load balancing','bug bounty','disk encryption'],
keys:[0,1,2,3,4]},
h:`The five governance terms are: why you may process, taking less, knowing where data came from, a person in the loop, and telling people.`,
x:`<p><b>Lawful basis</b> is your documented reason to process personal data. <b>Data minimisation</b> means collecting fewer fields. <b>Data lineage</b> records where each dataset came from and what it may be used for. <b>Human oversight</b> keeps a person in the loop for consequential decisions. <b>Transparency</b> means honest notices. Load balancing, bug bounty and disk encryption are security measures, not the governance terms this policy needs.</p><p><b>Tip:</b> governance words answer “why, how much, from where, who checks, who is told” — security words answer “how it is protected”.</p>`},
{id:'M06',th:1,T:'Spot the pipeline mistakes',t:'spot',
s:`<p>A data engineer shares the manifest of a new training pipeline at AtlasRetail. You review it against GDPR before the data flows. Three lines are problems.</p>`,
q:`Click the three lines that breach GDPR expectations. Click again to un-flag.`,
d:{mono:true,lines:[
{t:'source=crm_export  dataset=eu_contacts  lawful_basis=consent  optin_log=kept',bad:false},
{t:'source=mailbox_scrape  dataset=eu_emails  lawful_basis=none  note="found publicly"',bad:true},
{t:'dataset=eu_emails  special_category=health_flag  explicit_consent=not_collected',bad:true},
{t:'purpose=train_churn_model  purpose_recorded=yes  ropa_entry=updated',bad:false},
{t:'retention=keep_forever  note="useful for future models"',bad:true},
{t:'dsr_flow=deletion_requests_forwarded_to_training_team  sla=30d',bad:false}]},
h:`Look for: a missing lawful basis, sensitive data without explicit consent, and a retention setting no privacy officer would sign.`,
x:`<p>Line 2 has <b>no lawful basis</b> — “found publicly” is not one; scraping emails for training still needs a basis like legitimate interest with a balancing test. Line 3 treats a <b>health flag</b> as special-category data without <b>explicit consent</b> or another Art. 9 condition. Line 5 sets <b>retention to forever</b>, breaking storage limitation. The other lines are healthy: consent logged, purpose recorded with a RoPA entry, and deletion requests forwarded.</p><p><b>Tip:</b> in every pipeline review, check basis, sensitivity, and retention first.</p>`},
{id:'M07',th:1,T:'Audit the region transfers',t:'logview',
s:`<p>Meridian Health keeps EU customer data in eu-central-1. Policy says any copy outside the EU needs an approved transfer safeguard (SCCs plus a transfer risk assessment). The file below is a day of S3 data-movement audit entries.</p>`,
q:`Use the filter if you like, then select the <b>two</b> entries that move EU data outside the EU without a recorded safeguard.`,
d:{lines:[
'2026-03-11T08:02:19Z actor=svc-etl action=s3:GetObject bucket=eu-customers region=eu-central-1 result=allowed',
'2026-03-11T08:05:40Z actor=p.novak action=s3:ReplicateObject bucket=eu-customers dest-bucket=ml-central dest-region=us-east-1 result=allowed',
'2026-03-11T08:11:02Z actor=svc-etl action=s3:GetObject bucket=eu-clicks region=eu-west-1 result=allowed',
'2026-03-11T08:14:55Z actor=m.chen action=s3:ListBucket bucket=eu-customers region=eu-central-1 result=allowed',
'2026-03-11T08:22:31Z actor=svc-etl action=s3:CopyObject bucket=eu-customers dest-bucket=analytics-us dest-region=us-east-1 result=allowed',
'2026-03-11T08:29:18Z actor=svc-etl action=s3:GetObject bucket=eu-vendors region=eu-central-1 result=denied reason=macie_alert',
'2026-03-11T08:36:07Z actor=svc-etl action=s3:GetObject bucket=eu-orders region=eu-central-1 result=allowed',
'2026-03-11T08:41:12Z actor=p.novak action=s3:PutBucketPolicy bucket=ml-central region=us-east-1 result=allowed',
'2026-03-11T08:47:59Z actor=svc-etl action=s3:GetObject bucket=eu-support region=eu-central-1 result=allowed',
'2026-03-11T08:52:26Z actor=r.silva action=macie:ListFindings result=allowed'],
sub:{t:'multi',c:[
'The ReplicateObject entry copying eu-customers to ml-central in us-east-1',
'The ListBucket read on eu-customers inside eu-central-1',
'The CopyObject entry sending eu-customers to analytics-us in us-east-1',
'The GetObject that Macie blocked on eu-vendors inside the EU',
'The GetObject reads on eu-orders inside the EU',
'The PutBucketPolicy entry on ml-central in us-east-1'],a:[0,2]}},
h:`Filter for dest-region and us-east. Replication and copy both move data; a bucket-policy write does not move customer records.`,
x:`<p>Two entries physically copy EU customer records across the Atlantic: <b>ReplicateObject</b> to ml-central and <b>CopyObject</b> to analytics-us, both into <b>us-east-1</b>. Without SCCs and a transfer risk assessment on record, that is a GDPR Chapter V problem. The EU-internal reads are fine, and the blocked GetObject never leaked anything. The PutBucketPolicy on ml-central is a configuration write in the US — it should raise an eyebrow, but it does not move customer data.</p><p><b>Tip:</b> in residency reviews, follow the data plane (copy, replicate) and treat control-plane events as context.</p>`},

{id:'M08',th:1,T:'First hours of a training-data breach',t:'order',
s:`<p>Saturday, 21:40. M. Chen discovers that a misconfigured sync pushed EU customer records from AtlasRetail into a public storage bucket. It may have been exposed since Wednesday. The DPO is reachable, and the clock matters.</p>`,
q:`Put the first six response steps into the correct order.`,
d:{items:[
'Disable the syncing pipeline so nothing else leaks',
'Work out whose data was exposed and which fields',
'Loop in the DPO and open the incident record',
'Notify the data-protection authority within 72 hours — the exposure risks people’s rights',
'Tell the affected customers without undue delay because the risk is high',
'Fix the root cause and update the DPIA and controls']},
h:`Stop the bleeding, size the problem, involve the right people, then notify on the legal clock, then close the loop.`,
x:`<p>Correct order: <b>contain</b> first (disable the pipeline), then <b>assess scope</b> (whose data, which fields), then <b>loop in the DPO</b> and record the incident, then notify the <b>authority within 72 hours</b> of becoming aware if there is a risk to rights, then <b>inform the people</b> affected if the risk is high, and finally fix the root cause and refresh the DPIA. Notifying authorities before you know the scope wastes their time; fixing code before assessment destroys evidence of scope.</p><p><b>Tip:</b> the GDPR sequence is contain → assess → record → notify authority → notify subjects → remediate.</p>`},
{id:'M09',th:0,T:'Deploy a CV-screening tool in the EU',t:'branch',
s:`<p>Veritas Insurance wants to buy “TalentSort”, a CV-ranking system, for its HR team in Germany. The vendor is the provider; Veritas is the deployer. Work the intake questions in order — each answer reveals the next step.</p>`,
q:`Answer all four steps. A choice reveals the following step.`,
d:{steps:[
{q:'Does the EU AI Act classify a CV-screening tool as high-risk?',
c:['Yes — employment selection is listed in Annex III','No — only medical devices are high-risk','No — high-risk rules apply only to public authorities','Only if it runs on-premises'],a:0},
{q:'As the provider, what must be in place before TalentSort goes on the EU market?',
c:['A penetration test report','A conformity assessment and CE marking','A published API dump','Nothing — deployer duties only'],a:1},
{q:'The HR director (deployer, 400 recruiters) asks what else is required before go-live.',
c:['Only a press release','An ISO 9001 certificate','A DPIA with the DPO and informing the workers’ representatives','A new VPC'],a:2},
{q:'Which operational safeguard keeps the system lawful day to day?',
c:['Full automation with annual spot checks','Silent scoring with no candidate notice','Deleting the logs weekly','Human review of every rejection; candidates can contest'],a:3}]},
h:`Annex III names employment. The provider proves conformity; the deployer assesses impact and informs people. Humans stay in the loop.`,
x:`<p><b>Step 1:</b> Annex III lists recruitment and selection as high-risk, so yes. <b>Step 2:</b> the provider must run a <b>conformity assessment</b> and affix <b>CE marking</b>. <b>Step 3:</b> the deployer runs a <b>DPIA</b> with the DPO and informs workers’ representatives — using AI at work triggers worker-information duties. <b>Step 4:</b> rejections with legal effect on candidates need <b>human review</b> and a way to contest; silent full automation is exactly what the Act and GDPR Art. 22 forbid.</p><p><b>Tip:</b> high-risk AI is lawful — with proof, oversight and honest notices.</p>`},
{id:'M10',th:4,T:'Two views of a biased model',t:'dual',
s:`<p>Quarterly metrics at Cobalt Logistics show the CV-screening model rejects candidates over 50 at twice the rate of younger ones. A complaint has just arrived. You will look at the same event twice — first as governance, then as the engineer in the hot seat.</p>`,
q:`Pick one answer in each view.`,
d:{blue:{q:'BLUE VIEW — which governance control failed first?',
c:['Periodic bias and fairness testing with documented results','The encryption key rotation schedule','The CDN caching policy','The GPU utilisation dashboard'],a:0},
red:{q:'RED VIEW — you are the MLOps engineer. Fastest defensible next move?',
c:['Delete the evaluation spreadsheet','Retrain with rebalanced data and document the new fairness metrics in the model card','Lower the model temperature setting','Ship the same model with a disclaimer'],a:1}},
h:`Governance asks what check was missing. Engineering asks what fix leaves evidence behind.`,
x:`<p><b>Blue:</b> the failure is the missing <b>bias and fairness testing</b> cadence — a protected-group gap this size should have been caught between releases, not by a complaint. Encryption, caching and dashboards are controls, but none of them would have surfaced discrimination. <b>Red:</b> the defensible fix is <b>retrain with rebalanced data</b> and write the new fairness metrics into the <b>model card</b> so the correction is auditable. Deleting the evaluation spreadsheet would look like evidence tampering, and a disclaimer does not change outcomes.</p><p><b>Tip:</b> fairness controls live in the measurement layer (tests, metrics, model cards) — not in infrastructure.</p>`},
{id:'M11',th:5,T:'Find the PII datasets',t:'terminal',
s:`<p>You are on the Nordwind Bank GRC VM. The file <code>data_manifest.csv</code> in the home directory lists every candidate training dataset with its classification tag and lawful basis. The privacy team needs the personal-data rows.</p>`,
q:`Use a <code>grep</code> command on <code>data_manifest.csv</code> that prints every line containing the tag <code>PII</code>. A plain pattern is enough — no flags needed. The output should look like:<br><code>crm_contacts,crm_export,tag=PII,consent</code>`,
d:{host:'grc-vm — data inventory shell',
fs:{'data_manifest.csv':'dataset,source,tag,lawful_basis\ncrm_contacts,crm_export,tag=PII,consent\nclickstream,webapp,tag=PUBLIC,legitimate_interest\nsupport_emails,mailbox,tag=PII,legitimate_interest\nhr_files,hris,tag=PII,contract\nproduct_images,studio,tag=PUBLIC,contract'},
goals:[{name:'grep lists the PII lines from data_manifest.csv',
all:['^\\s*(grep|rg|findstr)','pii','data_manifest\\.csv']}],
out:'crm_contacts,crm_export,tag=PII,consent\nsupport_emails,mailbox,tag=PII,legitimate_interest\nhr_files,hris,tag=PII,contract',
answerTxt:'grep "PII" data_manifest.csv'},
h:`Type <code>ls</code> to see the file, <code>cat data_manifest.csv</code> to read it, then grep for the tag. The pattern is one word.`,
x:`<p><code>grep "PII" data_manifest.csv</code> prints the three personal-data rows: CRM contacts, support emails and HR files. The other two rows are tagged PUBLIC and stay out of scope. This tiny habit — asking the manifest instead of trusting memory — is how data inventories stay honest, and it is the first thing an auditor asks you to demonstrate.</p><p><b>Tip:</b> grep PATTERN FILE prints matching lines; quotes around the pattern are optional here.</p>`},
{id:'M12',th:2,T:'What does each certificate prove?',t:'match',
s:`<p>Polaris Credit Union is filling out a vendor-security questionnaire. Each row is a claim a supplier made. You must link each certificate or report to what it actually demonstrates.</p>`,
q:`Match each artefact to what it proves.`,
d:{rows:[
{k:'ISO/IEC 42001 certificate',a:0},
{k:'SOC 2 Type II report',a:1},
{k:'ISO/IEC 27018 evidence',a:2},
{k:'FedRAMP authorisation',a:3},
{k:'PCI DSS attestation',a:4},
{k:'ISO/IEC 27701 extension',a:5}],
opts:['A managed, auditable AI management system runs (plan-do-check-act)','Controls operated effectively over a period of time','Extra controls for personal data in public cloud','The US federal government accepts this cloud service','Payment card data is handled safely','Privacy information management sits on top of the ISMS']},
h:`Two are ISO certificates, one is an AICPA report, one is a US federal authorisation, one is card-data specific, and one extends 27001 with privacy.`,
x:`<p><b>ISO/IEC 42001</b> is the certifiable AI management-system standard — it proves a governed, improving AI programme. <b>SOC 2 Type II</b> is an auditor opinion that controls <b>operated over time</b> (Type I is only a point-in-time design check). <b>ISO/IEC 27018</b> adds PII protections for public-cloud processors. <b>FedRAMP</b> is the US federal cloud authorisation. <b>PCI DSS</b> covers payment-card data. <b>ISO/IEC 27701</b> extends 27001 with privacy information management.</p><p><b>Tip:</b> in questionnaires, read the Type — “Type I” answers design, “Type II” answers operation.</p>`},
{id:'M13',th:1,T:'The transfer package',t:'qcm',
s:`<p>After Schrems II, Helvetia Health still sends EU patient-survey data to a US analytics vendor. The vendor is not certified under the EU-US Data Privacy Framework. Legal asks what the transfer package must contain.</p>`,
q:`Which answer makes the transfer defensible?`,
d:{c:[
'Verbal assurance from the vendor that data is safe',
'Standard Contractual Clauses alone, signed and filed away',
'Standard Contractual Clauses plus a transfer impact assessment of US access risks',
'Nothing — US privacy law is adequate everywhere by default'],a:2},
h:`Schrems II added a step on top of the clauses: evaluate the destination country’s access laws.`,
x:`<p>Signed <b>SCCs</b> are the transfer tool, but <b>Schrems II</b> requires a <b>transfer impact assessment</b> — asking whether government access laws in the destination can undermine the clauses, and what supplementary measures are needed. A verbal promise protects nobody, and “adequate by default” is wrong: adequacy is a formal EU decision, and the US is only adequate for organisations in the Data Privacy Framework. Filing clauses away without the assessment was exactly the gap the court criticised.</p><p><b>Tip:</b> SCC + TIA is the default pairing for transfers to non-adequate countries.</p>`},
{id:'M14',th:0,T:'GPAI provider obligations',t:'multi',
s:`<p>Your company fine-tunes and releases a general-purpose AI model on the EU market from August 2025 onward. The compliance lead asks which duties from the EU AI Act apply to you as a GPAI provider.</p>`,
q:`Select the <b>four</b> obligations that genuinely apply to a GPAI provider.`,
d:{c:[
'Produce and keep technical documentation of the model',
'Affix CE marking to the model weights file',
'Maintain a policy to respect EU copyright law',
'Publish a sufficiently detailed summary of the training content',
'Order an annual bias audit of every customer chat widget',
'Provide a ISO 9001 certificate for the training cluster',
'Evaluate systemic risk — mandatory if the model crosses the 10^25 FLOPs threshold'],a:[0,2,3,6]},
h:`Documentation, copyright, a training-content summary, and systemic-risk duties when the compute threshold is crossed. Marketing-site features are not GPAI duties.`,
x:`<p>GPAI providers must keep <b>technical documentation</b>, run a <b>copyright policy</b>, publish a <b>summary of training content</b>, and — if the model crosses the <b>10^25 FLOPs</b> presumption or is designated — carry <b>systemic-risk evaluation</b> duties. CE marking attaches to <b>high-risk systems</b>, not to model weights. Bias audits of customer chat widgets and ISO 9001 for the cluster are obligations someone invented for this question — they come from other regimes or nothing at all.</p><p><b>Tip:</b> separate the model layer (GPAI duties) from the system layer (high-risk duties) — the Act regulates both, differently.</p>`},
{id:'M15',th:2,T:'Sort the AI RMF actions',t:'dd',
s:`<p>The board of Lumina Energy adopted the NIST AI Risk Management Framework. Each team wrote its favourite activity on a card. You must file each card under the function it belongs to.</p>`,
q:`Drag each action into its NIST AI RMF function.`,
d:{buckets:['GOVERN','MAP','MEASURE','MANAGE'],
items:[
{t:'Set accountability roles and the risk-appetite statement',b:0},
{t:'Document intended use and context of each AI system',b:1},
{t:'Run fairness and accuracy evaluations on models',b:2},
{t:'Prioritise risks and fund treatments',b:3},
{t:'Build the risk culture, training and policies',b:0},
{t:'Inventory the systems and third-party dependencies',b:1},
{t:'Track metrics, test robustness, monitor drift',b:2},
{t:'Respond to incidents and keep monitoring after release',b:3}]},
h:`Govern decides and cultures, Map knows the context, Measure tests, Manage treats and watches.`,
x:`<p><b>GOVERN</b> is the umbrella: accountability, risk appetite, culture, policies, training. <b>MAP</b> is understanding: intended use, context, inventories, dependencies. <b>MEASURE</b> is evidence: fairness and accuracy evaluations, robustness tests, drift metrics. <b>MANAGE</b> is action: prioritising risks, funding treatment, incident response, post-release monitoring. If a card sounds like “decide”, it is Govern; “understand” is Map; “test” is Measure; “act and watch” is Manage.</p><p><b>Tip:</b> Govern was the function CSF 2.0 later added too — governance is the anchor of both frameworks.</p>`},

{id:'M16',th:4,T:'Vendor due-diligence questionnaire',t:'fill',
s:`<p>Bluepeak SaaS wants to process Nordwind Bank customer data with its new AI summarisation service. Procurement hands you the checklist half-written. Complete it.</p>`,
q:`Fill each blank with the correct term from the bank. Every blank draws from the same bank.`,
d:{text:`Before any data flows: the vendor must show a current {{0}} report — not just a Type I design check. The contract needs a {{1}} naming every fourth party that will touch our data. We run our own {{2}} because the new purpose raises privacy risk. The contract must grant us {{3}} so we can verify controls ourselves. Security incidents must reach us within {{4}}.`,
bank:['SOC 2 Type II','sub-processor list','DPIA','audit rights','72 hours','firewall appliance','penetration test','load-balancer config'],
keys:[0,1,2,3,4]},
h:`Five terms: the operational report, the fourth parties, our impact assessment, our right to verify, and the incident clock.`,
x:`<p>A <b>SOC 2 Type II</b> shows controls actually operated over months. A <b>sub-processor list</b> exposes every fourth party so you can object. The new processing purpose triggers your own <b>DPIA</b>. <b>Audit rights</b> let you verify rather than trust. Notification within <b>72 hours</b> keeps you able to meet GDPR’s own 72-hour duty to the authority. Firewall, pen-test and load balancer are real security items but do not answer these five blanks.</p><p><b>Tip:</b> vendor AI checklists mirror your own duties — every duty you have, the vendor must help you meet.</p>`},
{id:'M17',th:5,T:'Spot the residency mistakes',t:'spot',
s:`<p>Below is part of the storage configuration for the AtlasRetail EU training environment. Internal policy (backed by GDPR Chapter V) says EU personal data and the keys that protect it must stay in EU regions. Three lines break that.</p>`,
q:`Click the three lines that break the residency policy.`,
d:{mono:true,lines:[
{t:'resource "s3_bucket" "eu_training" { region = "eu-central-1" }',bad:false},
{t:'resource "s3_bucket_policy" "eu_training" { block_public_access = true }',bad:false},
{t:'replication_configuration { dest_bucket = "us-east-1/ml-mirror"  scc_review = "pending" }',bad:true},
{t:'resource "kms_key" "training_kek" { region = "us-east-1"  note = "cheaper" }',bad:true},
{t:'logging { cloudtrail = "all-regions"  macie = "enabled" }',bad:false},
{t:'lifecycle_rule { expire_incomplete_uploads_days = 7 }',bad:false},
{t:'retention { object_lock = "none"  legal_hold = "unsupported"  note = "records bucket" }',bad:true}]},
h:`One line moves data, one moves the key, one removes the ability to preserve records. The rest are good hygiene.`,
x:`<p><b>Line 3</b> replicates EU training data to <b>us-east-1</b> with the SCC review still pending — an unapproved transfer. <b>Line 4</b> puts the <b>encryption key in a US region</b>; whoever holds the key region holds the sovereignty story, and the policy (and many clients’ contracts) forbid it. <b>Line 7</b> disables <b>object lock / legal hold</b> on a records bucket — when a regulator or litigation hold arrives, deletion jobs will destroy evidence. Block-public-access, all-region logging and upload cleanup are all good practice.</p><p><b>Tip:</b> residency reviews chase three artefacts: the data path, the key path, and the retention controls.</p>`},
{id:'M18',th:0,T:'The compliance calendar',t:'order',
s:`<p>Your AI Act readiness plan at Veritas Insurance needs realistic dates. Put the five milestones of the EU AI Act in the order their obligations start applying.</p>`,
q:`Order the milestones from earliest to latest.`,
d:{items:[
'1 August 2024 — the Act enters into force',
'2 February 2025 — prohibited practices apply; staff AI-literacy duty begins',
'2 August 2025 — obligations for general-purpose AI models start',
'2 August 2026 — most high-risk obligations apply',
'2 August 2027 — high-risk AI embedded in regulated products must comply']},
h:`Entry into force, then bans, then GPAI, then high-risk systems, then embedded high-risk products.`,
x:`<p>The Act <b>entered into force</b> on 1 August 2024, but its duties phase in: <b>prohibited practices and AI literacy</b> first (2 February 2025), then <b>GPAI model</b> obligations (2 August 2025), then <b>most high-risk</b> system duties (2 August 2026), and finally high-risk AI <b>embedded in regulated products</b> such as machinery (2 August 2027).</p><p><b>Tip:</b> remember 2024 → 2025 → 2026 → 2027: force, bans, models, systems, products.</p>`},
{id:'M19',th:3,T:'The New York hiring rule',t:'qcm',
s:`<p>Meridian HR runs an automated employment decision tool (AEDT) that ranks applicants for New York City roles. City law 144 applies. The hiring director asks what the law actually requires before the tool may be used.</p>`,
q:`What does NYC Local Law 144 require before and while using the AEDT?`,
d:{c:[
'Annual independent bias audit with published results, plus candidate notice',
'A HIPAA assessment of the recruitment database',
'FedRAMP authorisation for the hiring platform',
'Prior approval from the US Department of Labor'],a:0},
h:`One local law, three artefacts: an audit, a public posting, and notices to candidates.`,
x:`<p>NYC <b>Local Law 144</b> requires an <b>annual independent bias audit</b> of the AEDT, <b>publication</b> of a results summary, and <b>notice to candidates</b> (at least ten business days before use) including the job attributes and the chance to request an alternative process. HIPAA, FedRAMP and federal pre-approval have nothing to do with it.</p><p><b>Tip:</b> hiring-AI rules cluster around three ideas: measure bias, publish proof, tell the candidates.</p>`},
{id:'M20',th:5,T:'Match the privacy tech',t:'match',
s:`<p>The privacy engineering guild at Helvetia Health keeps a glossary wall. A contractor shuffled it. Put it back: link each technique to what it actually does.</p>`,
q:`Match each privacy-enhancing technology to its definition.`,
d:{rows:[
{k:'Differential privacy',a:0},
{k:'Federated learning',a:1},
{k:'Synthetic data',a:2},
{k:'Tokenisation',a:3},
{k:'Homomorphic encryption',a:4},
{k:'k-anonymity',a:5}],
opts:['Adds statistical noise so single records cannot be re-identified in aggregates','Trains models across sites without moving the raw data','Realistic fake records that keep statistical shape','Replaces identifiers with stand-in values held in a vault','Computes on data while it stays encrypted','Generalises data until each combination matches k or more people']},
h:`Two techniques touch math on hidden values (noise, encrypted compute), two change the records (fake, stand-in), one moves nothing, one blurs groups.`,
x:`<p><b>Differential privacy</b> adds calibrated noise so aggregate answers stay useful while individuals disappear. <b>Federated learning</b> sends the model to the data, not the data to the model. <b>Synthetic data</b> is generated fake data that mimics real distributions. <b>Tokenisation</b> swaps identifiers for tokens, with the mapping locked in a vault. <b>Homomorphic encryption</b> computes on ciphertext. <b>k-anonymity</b> generalises attributes so every person hides in a group of at least k.</p><p><b>Tip:</b> match by the verb: noise, move, generate, replace, compute, blur.</p>`},
{id:'M21',th:4,T:'Shadow AI in the proxy logs',t:'logview',

sub:{t:'multi',c:[
'Block the unapproved AI domain at the proxy and add it to the AI-use inventory as a violation',

h:`Two logs show several megabytes heading to an unapproved AI service. Contain the leak; keep the evidence; involve privacy.`,
x:`<p>The uploads to <b>free-ai-tools[.]example</b> (4.2 MB, then more) are classic <b>shadow AI</b>: unapproved services receiving possibly personal data. The right first moves are to <b>block the domain</b> (contain) and to <b>preserve the logs and alert the DPO</b> — if customer or employee data was pasted, GDPR breach assessment starts now. Deleting records destroys evidence and breaks accountability. Waiting a year ignores an active leak. Covert keylogging without sign-off creates a bigger privacy violation than the one you are investigating.</p><p><b>Tip:</b> incident recipe: contain, preserve, involve — in that order.</p>`},
{id:'M22',th:3,T:'Clinical model, PHI rules',t:'branch',
s:`<p>Helvetia Health wants to train a readmission-prediction model on patient records. The dataset still contains medical record numbers. Work the privacy questions in order.</p>`,
q:`Answer all four steps. A choice reveals the following step.`,
d:{steps:[
{q:'Is the current dataset regulated health data?',
c:['Yes — with MRNs present it is PHI under HIPAA','No — hospital data is always public','Only if the model is sold','Only outside business hours'],a:0},
{q:'What must happen before the data can be used for model development?',
c:['Rename the columns and continue','De-identify per Safe Harbor / Expert Determination — or work in a compliant environment','Email the dataset to a personal laptop for safekeeping','Publish the dataset for transparency'],a:1},
{q:'The training runs on a cloud vendor’s platform. What must be signed first?',
c:['A marketing co-branding agreement','A Business Associate Agreement with the vendor','A non-disclosure with the model provider’s CEO','Nothing — cloud vendors are exempt'],a:1},
{q:'Which principle limits how much PHI the project may use?',
c:['Minimum necessary','Maximum accuracy','Open data by default','Cheapest storage'],a:0}]},
h:`PHI is identifiable health data. Strip identifiers or work inside a covered arrangement, sign the vendor agreement, take the least data.`,
x:`<p><b>Step 1:</b> records with MRNs are <b>PHI</b> — HIPAA applies. <b>Step 2:</b> use <b>Safe Harbor de-identification</b> (remove 18 identifier types) or Expert Determination, or keep the environment compliant; renaming columns changes nothing. <b>Step 3:</b> a vendor handling PHI on your behalf needs a <b>Business Associate Agreement</b> — cloud vendors are not exempt. <b>Step 4:</b> the <b>minimum necessary</b> principle caps scope: use the fewest fields and records that still answer the question.</p><p><b>Tip:</b> PHI thinking = identify → de-identify or cover → contract → minimise.</p>`},
{id:'M23',th:1,T:'The rejected applicant asks why',t:'qcm',
s:`<p>Polaris Credit Union auto-rejects small-business loan applications below an internal score, with no human look. A rejected applicant invokes GDPR Article 22 and asks what the bank must provide.</p>`,
q:`Which response meets GDPR Article 22?`,
d:{c:[
'Send the full source code of the scoring model',
'Explain the model is a trade secret, so nothing is owed',
'Offer to re-run the same model once more',
'Provide meaningful information about the logic plus the chance to obtain human intervention and to contest'],a:3},
h:'The Article lists safeguards, not the source code. Trade secrets limit how, not whether.',
x:`<p>Article 22 gives people the right not to face <b>solely automated</b> decisions with legal or similarly significant effects — and grants safeguards: <b>meaningful information about the logic</b> involved, the right to <b>express a point of view</b>, to obtain <b>human intervention</b>, and to <b>contest</b> the decision. The source code itself is not owed, and trade secrets only shape how you explain, they never cancel the duty. Re-running the same model is not human intervention.</p><p><b>Tip:</b> for automated decisions remember the four safeguards: inform, be heard, human review, contest.</p>`},

{id:'M24',th:4,T:'Who owns what in the AI programme',t:'dd',
s:`<p>After an internal-audit finding, Lumina Energy drew its AI governance chart on sticky notes — then the wind scattered them. Reattach each duty to the body that owns it under the three-lines model.</p>`,
q:`Drag each duty to the owning body.`,
d:{buckets:['AI ethics committee','Data Protection Officer','CISO','Internal audit'],
items:[
{t:'Approve and risk-rank new AI use cases against the principles',b:0},
{t:'Sign off DPIAs and own privacy advice',b:1},
{t:'Own the security controls of the AI platform',b:2},
{t:'Give independent assurance over the whole AI programme',b:3},
{t:'Set the risk appetite and receive quarterly AI reporting',b:0},
{t:'Handle data-subject requests touching model outputs',b:1}]},
h:`The committee decides use cases, the DPO owns privacy work, the CISO owns security controls, audit checks everyone.`,
x:`<p>The <b>AI ethics committee</b> approves and ranks use cases and carries the risk-appetite conversation upward (the board formally sets appetite and receives reporting). The <b>DPO</b> signs off DPIAs, advises, and handles data-subject requests. The <b>CISO</b> owns security controls for the platform. <b>Internal audit</b> — the third line — gives <b>independent assurance</b> over all of it and reports outside the lines it audits.</p><p><b>Tip:</b> three lines: business owns and manages risk, oversight functions advise and challenge, audit verifies independently.</p>`},
{id:'M25',th:1,T:'Complete the DPIA',t:'fill',
s:`<p>The DPIA for AtlasRetail’s new dynamic-pricing model is 80% written. Finish the template so the DPO can review it.</p>`,
q:`Fill each blank with the correct term from the bank.`,
d:{text:`A DPIA must state the {{0}} of the processing — why it is needed and what less invasive options were rejected. It must show the plan is necessary and {{1}}. It must list the {{2}} to the rights and freedoms of the people whose data we use. It must define {{3}} and be honest about the {{4}} that remains after them. When doubt remains, we {{5}} the DPO before sign-off.`,
bank:['purpose and lawful basis','proportionate','risks','mitigation measures','residual risk','consult','encryption keys','load balancer','hotfix'],
keys:[0,1,2,3,4,5]},
h:`Purpose, proportionality, risks, mitigations, what remains, and who to involve.`,
x:`<p>A DPIA describes the <b>purpose and lawful basis</b>, proves necessity and <b>proportionality</b>, analyses <b>risks</b> to people’s rights, sets <b>mitigation measures</b>, and records the <b>residual risk</b> after them. When residual risk stays high or doubt remains, you <b>consult the DPO</b> (and under GDPR Art. 36 possibly the regulator) before processing starts. Encryption keys, load balancers and hotfixes are engineering artefacts, not DPIA sections.</p><p><b>Tip:</b> a DPIA is a decision document, not a form — every blank above is a judgement someone must own.</p>`},
{id:'M26',th:4,T:'Spot the bad contract clauses',t:'spot',
s:`<p>Bluepeak SaaS sends its standard AI-service contract for the Nordwind Bank summarisation pilot. Legal asks you to pre-mark the clauses that break your vendor policy. Three are unacceptable.</p>`,
q:`Click the three unacceptable clauses.`,
d:{mono:false,lines:[
{t:'1. Vendor processes Customer Data only per the signed DPA, which incorporates Standard Contractual Clauses.',bad:false},
{t:'2. Vendor may use Customer Data to improve its models for the benefit of all clients.',bad:true},
{t:'3. Vendor maintains a sub-processor list and gives Customer 30 days to object to additions.',bad:false},
{t:'4. Customer receives no audit rights; vendor self-certifies annually.',bad:true},
{t:'5. Vendor deletes or returns Customer Data within 30 days of termination, with written confirmation.',bad:false},
{t:'6. Vendor notifies Customer of security incidents within 90 days of confirming them.',bad:true}]},
h:`One clause repurposes your data, one removes verification, one makes the breach clock slower than your legal duty.`,
x:`<p><b>Clause 2</b> lets the vendor train on your customers’ data for everyone’s benefit — that is a new purpose without your lawful basis, and a shadow transfer. <b>Clause 4</b> removes <b>audit rights</b>: without verification you cannot evidence the controls you rely on. <b>Clause 6</b> sets a <b>90-day</b> notice window — you cannot meet a 72-hour GDPR duty if your vendor may stay silent for three months. The DPA/SCC, sub-processor objection and deletion clauses are the good parts of the contract.</p><p><b>Tip:</b> in AI contracts the fight is always about purpose, verification, and clocks.</p>`},
{id:'M27',th:0,T:'Practices the Act bans outright',t:'multi',
s:`<p>During AI-literacy training at Cobalt Logistics, employees propose new features. The compliance lead asks which of these the EU AI Act prohibits outright (since February 2025).</p>`,
q:`Select the <b>three</b> practices that are banned.`,
d:{c:[
'A public-app feature scoring citizens’ social behaviour for trusted-citizen discounts',
'An ad engine using subliminal techniques that materially distort decisions and cause harm',
'Scraping facial images from the internet without targeting to build a recognition database',
'A fraud-detection model that flags unusual card transactions',
'An FAQ chatbot answering delivery questions',
'A warehouse model forecasting demand for the next quarter'],a:[0,1,2]},
h:`Banned = social scoring, manipulation that harms, untargeted face scraping. The other three are ordinary, lawful uses.`,
x:`<p>The Act prohibits <b>social scoring</b> that treats people unfavourably, <b>manipulative techniques</b> that distort behaviour and cause harm, and <b>untargeted scraping of facial images</b> for recognition databases. Fraud detection, FAQ chatbots and demand forecasting are normal tools — they may carry other duties (transparency, privacy) but are not banned. Note the harm element: influence alone is not enough; the ban targets techniques that materially distort decisions and injure people.</p><p><b>Tip:</b> when a proposal smells like “ranking humans” or “hidden persuasion”, stop and escalate.</p>`},
{id:'M28',th:4,T:'Stand up the governance programme',t:'order',
s:`<p>Lumina Energy’s board approved an AI governance programme. You hold the six workstreams; sequencing matters — later steps depend on earlier outputs.</p>`,
q:`Order the six steps from first to last.`,
d:{items:[
'Build the inventory of AI use cases, including shadow AI',
'Classify each use case by risk tier and assign an owner',
'Run a gap assessment against ISO/IEC 42001 and the NIST AI RMF',
'Write policies, roles and the three lines of defence',
'Train staff and stand up controls: DPIAs, vendor clauses, model cards',
'Monitor with KRIs, audits and the model registry']},
h:`Know what exists, grade it, measure the gap, write the rules, enable the people, then watch forever.`,
x:`<p>You cannot classify what you have not found — so <b>inventory</b> (with shadow-AI discovery) comes first, then <b>risk classification</b> per use case. With tiers and owners set, a <b>gap assessment</b> against ISO/IEC 42001 and the NIST AI RMF shows what to build. Policies and the <b>three lines of defence</b> codify the answer; <b>training and controls</b> make it real; and <b>monitoring</b> (KRIs, audits, the model registry) keeps it true over time.</p><p><b>Tip:</b> governance rollouts fail when written before discovery — rules nobody’s system fits get ignored.</p>`},
{id:'M29',th:1,T:'Erasure versus the trained model',t:'qcm',
s:`<p>A customer invokes GDPR erasure rights after leaving AtlasRetail. Her records sit in datasets that already trained the churn model. Engineering warns that removing rows from weights is not yet reliably possible at scale.</p>`,
q:`Which response is the defensible compliance position?`,
d:{c:[
'Declare models exempt from GDPR because weights are not personal data',
'Promise to delete the weights within 24 hours or pay a fine',
'Email the customer a copy of the model checkpoint',
'Remove her records from source datasets and future training refreshes, document the machine-unlearning limits, and confirm the steps taken'],a:3},
h:'You cannot rewrite history, but you can stop carrying it forward — and prove it.',
x:`<p>The workable position: honour erasure going forward — <b>purge the records from source datasets</b>, exclude them from <b>future training</b>, and document honestly that trained weights cannot yet be surgically edited (the machine-unlearning problem), with a dated plan. “Models are exempt” is wishful thinking — regulators treat unlawful training data as a live issue. Promising a 24-hour weight deletion is technically empty; sending a checkpoint is nonsense. What matters is a truthful, evidenced process.</p><p><b>Tip:</b> when a right cannot be fully executed, execute everything you can and document the boundary.</p>`},

    rt.perm.forEach(function(oo){h+='<option value="'+oo+'"'+(a[k]===oo?' selected':'')+'>'+esc(d.bank[oo])+'</option>';});
    h+='</select>'+fb+'</span> ';
  }
  h+=(parts[d.keys.length]||'');
  return h+'</div><p class="hint-uitext">Every blank draws from the same shuffled word bank. Wrong picks earn nothing but do not subtract.</p>';
}
function rDD(ex,g){

}
function rOrder(ex,g){

function rSpot(ex,g){

function rTerminal(ex,g){

  if(g&&g.marks){h+='<div class="subq"><div class="sublab">GOAL CHECK</div>';
    d.goals.forEach(function(gd,gi){var st=g.marks.goal[gi];

function rLogview(ex,g){

  var shown=d.lines.filter(function(l){return !f||l.toLowerCase().indexOf(f)>=0;});
  var h='<div class="logpanel"><div class="logtop"><label for="logfilter" style="font-weight:700">Filter</label><input id="logfilter" value="'+esc(rt.filter)+'" placeholder="type to filter, e.g. us-east or deny"'+(lk?' disabled':'')+'><span id="logcount">'+shown.length+' of '+d.lines.length+' lines</span></div><pre id="loglines" tabindex="0">'+shown.map(hi).join('\n')+'</pre></div>';
