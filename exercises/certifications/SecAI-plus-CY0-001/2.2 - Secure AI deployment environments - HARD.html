<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>CompTIA SecAI+ — Secure AI deployment environments — HARD practice exam</title>
<script type="application/json" id="cm-exercise-meta">
{
  "topicId": "secai-plus",
  "chapter": 2.2,
  "title": "Secure AI deployment environments — HARD",
  "difficulty": "hard",
  "questionCount": 30,
  "estimatedMinutes": 40,
  "passMark": 70,
  "version": "3.0"
}
</script>
<style>
:root{
  --bg:#0b1220; --bg2:#0e1729; --panel:#121d33; --panel2:#0f1930; --line:#24365b;
  --text:#e8eef9; --mut:#a7b6cf; --dim:#8496b4;
  --acc:#22d3ee; --acc2:#38bdf8; --ok:#4ade80; --okd:#14532d;
  --bad:#f87171; --badd:#7f1d1d; --warn:#fbbf24; --warnd:#78350f;
  --mono:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,Menlo,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Inter',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:linear-gradient(160deg,var(--bg) 0%,#0a101f 55%,#0b1526 100%);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;min-height:100vh}
.wrap{max-width:1060px;margin:0 auto;padding:14px 16px 90px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--panel2));position:sticky;top:8px;z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.brand{display:flex;flex-direction:column;min-width:200px;flex:1}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{color:var(--mut);font-size:12.5px}
.tstats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chipstat{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:#0c1526;border-radius:999px;padding:7px 13px;font-size:14.5px;font-variant-numeric:tabular-nums;min-height:38px}
.chipstat .ic{font-size:15px}
#time.low{border-color:var(--warn);color:var(--warn)}
#time.crit{border-color:var(--bad);color:var(--bad)}
.pibar{height:8px;border-radius:99px;background:#0a1322;border:1px solid var(--line);overflow:hidden;margin:10px 2px}
.pibar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s ease}
.pauseind{display:flex;gap:8px;flex-wrap:wrap;margin:8px 2px}
.pi{display:none;align-items:center;gap:7px;font-size:13.5px;font-weight:600;border-radius:9px;padding:6px 11px}
.pi.manual{background:var(--badd);border:1px solid var(--bad);color:#fecaca}
.pi.review{background:var(--warnd);border:1px solid var(--warn);color:#fde68a}
.pi.show{display:inline-flex}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:9px 16px;border-radius:11px;border:1px solid var(--line);background:#152342;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;transition:transform .12s ease,background .15s ease,box-shadow .15s ease}
.btn:hover{background:#1b2c52}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#0e7490,#155e75);border-color:#0891b2}
.btn.primary:hover{background:linear-gradient(180deg,#0891b2,#0e7490)}
.btn.go{background:linear-gradient(180deg,#15803d,#166534);border-color:#22c55e}
.btn.go:hover{background:linear-gradient(180deg,#16a34a,#15803d)}
.btn.warn{background:#4a3407;border-color:var(--warn);color:#fde68a}
.btn.danger{background:#5f1d1d;border-color:var(--bad);color:#fecaca}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn .em{font-size:15px}
/* ---------- intro ---------- */
.hero{border:1px solid var(--line);border-radius:16px;background:radial-gradient(1200px 400px at 20% -10%,rgba(34,211,238,.12),transparent),linear-gradient(180deg,var(--panel),var(--panel2));padding:22px;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:24px;letter-spacing:.2px}
.hero .sub{color:var(--mut);margin:0 0 12px}
.sev{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;letter-spacing:.6px}
.sev.medium{background:#332a08;border:1px solid var(--warn);color:#fde68a}
.sev.hard{background:#3d1111;border:1px solid var(--bad);color:#fecaca}
.metagrid{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.mg{border:1px solid var(--line);background:#0c1526;border-radius:12px;padding:10px 14px;min-width:130px}
.mg b{display:block;font-size:20px;color:var(--acc)}
.mg span{color:var(--mut);font-size:13px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.rules{grid-template-columns:1fr}}
.rulecard{border:1px solid var(--line);border-radius:12px;background:#0c1526;padding:12px 14px}
.rulecard h3{margin:0 0 6px;font-size:15px;color:var(--acc2)}
.rulecard p{margin:0;font-size:14px;color:var(--mut)}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.kwcard{border:1px solid var(--line);border-radius:12px;background:#0c1526;padding:12px}
.kwcard h4{margin:0 0 8px;font-size:14px;color:var(--acc)}
.kwcard p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.7}
.typelist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.typechip{border:1px dashed #33507e;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut);background:#0c1526}
/* ---------- question card ---------- */
.qcard{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:16px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#0c1526;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mut)}
.mchip.t{border-color:#155e75;color:#67e8f9}
.mchip.k{border-color:#1e3a5f;color:#93c5fd}
.block{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#0c1526}
.block.scenario{border-left:4px solid var(--acc2)}
.block.question{border-left:4px solid var(--warn);background:#101830}
.block.answers{border-left:4px solid var(--ok);background:#0d1730}
.blabel{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--dim);margin-bottom:6px}
.block.scenario .blabel{color:var(--acc2)}
.block.question .blabel{color:var(--warn)}
.block.answers .blabel{color:var(--ok)}
.btext{font-size:15.5px}
.btext code{font-family:var(--mono);font-size:14px;background:#081120;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
/* ---------- artifacts ---------- */
.logview{border:1px solid #1d2f52;border-radius:12px;overflow:hidden;margin:10px 0;background:#070d1a}
.loghead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:#0b1424;border-bottom:1px solid #1d2f52}
.loghead b{font-size:13.5px;color:#9fd8e8}
.loghead .fl{margin-left:auto;display:flex;gap:7px;align-items:center}
.loghead input{background:#081120;border:1px solid #24466e;color:var(--text);border-radius:8px;padding:8px 11px;font-family:var(--mono);font-size:14px;min-width:190px;min-height:38px}
.logcount{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.logbody{max-height:420px;overflow:auto;padding:6px 0}
.logline{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;border-bottom:1px solid #0e1830;color:#c9d7ee;font-family:var(--mono);font-size:14px;line-height:1.5;padding:9px 12px;min-height:44px;cursor:default}
.logline .ln{color:#5c7195;min-width:26px;text-align:right;flex-shrink:0}
button.logline{cursor:pointer}
button.logline:hover{background:#0d1830}
button.logline.sel{border-left-color:var(--acc);background:#0c2233}
.logline.mk-ok{border-left-color:var(--ok);background:rgba(74,222,128,.12)}
.logline.mk-bad{border-left-color:var(--bad);background:rgba(248,113,113,.12)}
.logline.mk-miss{border-left-color:var(--warn);background:rgba(251,191,36,.10)}
.mktag{margin-left:auto;font-family:var(--sans);font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
.mk-ok .mktag,.tag-ok{background:var(--okd);color:#bbf7d0}
.mk-bad .mktag,.tag-bad{background:var(--badd);color:#fecaca}
.mk-miss .mktag,.tag-warn{background:var(--warnd);color:#fde68a}
/* ---------- choice / multi ---------- */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#0a1426;border:1px solid #22375f;border-radius:11px;color:var(--text);padding:11px 13px;min-height:44px;font-size:15px;cursor:pointer}
.opt:hover{background:#0e1d38}
.opt.on{border-color:var(--acc);background:#0c2233;box-shadow:inset 0 0 0 1px var(--acc)}
.opt .okey{flex-shrink:0;width:26px;height:26px;border-radius:8px;border:1px solid #2c4a77;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--acc);background:#081120}
.opt .otext{flex:1}
.opt .mktag{margin-left:auto;align-self:center}
.opt.mk-ok{border-color:var(--ok);background:rgba(74,222,128,.10)}
.opt.mk-bad{border-color:var(--bad);background:rgba(248,113,113,.10)}
.opt.mk-miss{border-color:var(--warn);border-style:dashed;background:rgba(251,191,36,.08)}
/* ---------- drag & drop ---------- */
.dnd{display:flex;flex-direction:column;gap:10px}
.bank{border:1px dashed #2c4a77;border-radius:12px;padding:10px;background:#0a1322}
.blabel2{font-size:11.5px;font-weight:800;letter-spacing:1.2px;color:var(--dim);margin-bottom:7px}
.banklist{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.bankempty{color:var(--dim);font-size:13.5px;align-self:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:#10203c;border:1px solid #2c4a77;color:var(--text);border-radius:10px;padding:9px 13px;min-height:44px;font-size:14.5px;cursor:grab;user-select:none;max-width:100%}
.chip:active{cursor:grabbing}
.chip.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:#0c2233}
.chip .sub{font-size:12px;color:var(--dim)}
.chip .mktag{margin-left:2px}
.chip.mk-ok{border-color:var(--ok);background:rgba(74,222,128,.12)}
.chip.mk-bad{border-color:var(--bad);background:rgba(248,113,113,.12)}
.chip.mk-miss{border-color:var(--warn);border-style:dashed;background:rgba(251,191,36,.10)}
.chipmiss{display:block;font-size:11.5px;color:var(--warn);font-weight:700}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cat{border:1.5px solid #2c4a77;border-radius:12px;background:#0a1426;min-height:110px;padding:9px;transition:border-color .12s,background .12s}
.cat.over{border-color:var(--acc);background:#0c2033}
.catname{font-weight:700;font-size:14px;color:var(--acc2);margin-bottom:8px;display:flex;gap:7px;align-items:center}
.catslot{display:flex;flex-direction:column;gap:7px;min-height:56px}
.catslot:empty::after{content:'Drop items here';color:#41597f;font-size:13px;text-align:center;padding:14px 0;border:1px dashed #24466e;border-radius:9px}
.match .cat{display:flex;flex-direction:column}
.match .catslot:empty::after{content:'Pair goes here'}
/* ---------- order ---------- */
.olist{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:10px;align-items:center;background:#0a1426;border:1px solid #22375f;border-radius:11px;padding:8px 10px;min-height:52px}
.orow.over{border-color:var(--acc);background:#0c2033}
.orow .grab{cursor:grab;color:var(--dim);font-size:17px;padding:6px;min-width:32px;text-align:center}
.orow .onum{flex-shrink:0;width:28px;height:28px;border-radius:8px;background:#081120;border:1px solid #2c4a77;color:var(--acc);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.orow .otext{flex:1;font-size:15px}
.orow .mv{display:flex;gap:5px}
.orow .mv button{min-width:44px;min-height:40px;border-radius:9px;background:#0c1a33;border:1px solid #24466e;color:var(--text);font-size:16px;cursor:pointer}
.orow .mv button:hover{background:#122647}
.orow.mk-ok{border-color:var(--ok)}
.orow.mk-bad{border-color:var(--bad)}
.orow .mktag{flex-shrink:0}
/* ---------- fib ---------- */
.fib-sent{font-size:15.5px;line-height:2.1;background:#0a1426;border:1px solid #22375f;border-radius:12px;padding:12px 14px}
.fibb{display:inline-block;min-width:96px;min-height:34px;border-radius:8px;border:1.5px dashed #33507e;background:#081120;color:var(--acc);font-family:var(--mono);font-size:14px;padding:3px 10px;cursor:pointer;vertical-align:middle;text-align:center}
.fibb.filled{border-style:solid;border-color:var(--acc);color:var(--text)}
.fibb.target{box-shadow:0 0 0 2px var(--warn)}
.fibb.mk-ok{border-color:var(--ok);color:#bbf7d0}
.fibb.mk-bad{border-color:var(--bad);color:#fecaca}
.fibans{display:block;font-size:11.5px;color:var(--warn);font-family:var(--sans);font-weight:700}
.bankwords{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.wchip{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid #2c4a77;background:#10203c;color:var(--text);font-family:var(--mono);font-size:14px;cursor:pointer}
.wchip:hover{border-color:var(--acc)}
.wchip:disabled{opacity:.35;cursor:default}
.wchip.mk-ok{border-color:var(--ok)}
.wchip.mk-bad{border-color:var(--bad)}
/* ---------- terminal ---------- */
.term{border:1px solid #1d3357;border-radius:12px;overflow:hidden;background:#050a14}
.termhead{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#0b1424;border-bottom:1px solid #1d3357}
.termhead .dot{width:11px;height:11px;border-radius:99px;background:#334155}
.termhead .dot:nth-child(1){background:#ef4444}.termhead .dot:nth-child(2){background:#eab308}.termhead .dot:nth-child(3){background:#22c55e}
.termhead b{margin-left:8px;font-size:12.5px;color:var(--dim);font-family:var(--mono);font-weight:400}
.termbody{padding:13px;font-family:var(--mono);font-size:14px}
.tline{color:#9fd8e8;margin-bottom:8px;white-space:pre-wrap}
.trow{display:flex;gap:8px;align-items:center}
.tps1{color:#4ade80;flex-shrink:0}
.tin{flex:1;background:transparent;border:0;border-bottom:1.5px solid #2c4a77;color:#e8eef9;font-family:var(--mono);font-size:14px;padding:9px 4px;min-height:44px}
.tin:focus{outline:none;border-bottom-color:var(--acc)}
.termout{margin-top:9px;font-size:14.5px;font-weight:600}
/* ---------- branch ---------- */
.steps{display:flex;flex-direction:column;gap:10px}
.step{border:1px solid #22375f;border-radius:12px;background:#0a1426;padding:12px}
.step .slabel{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--acc2);margin-bottom:6px}
.step .sq{font-size:15.5px;margin-bottom:10px}
.step .sopts{display:flex;flex-direction:column;gap:8px}
.stepfb{margin-top:9px;border-radius:9px;padding:9px 12px;font-size:14px}
.stepfb.good{background:rgba(74,222,128,.12);border:1px solid var(--ok)}
.stepfb.badf{background:rgba(248,113,113,.12);border:1px solid var(--bad)}
/* ---------- hint / feedback ---------- */
.hintbox{border:1px solid var(--warn);background:rgba(251,191,36,.08);border-radius:12px;padding:11px 14px;margin:10px 0;font-size:14.5px}
.hintbox b{color:var(--warn)}
.fbp{border-radius:12px;padding:13px 15px;margin:12px 0 0;border:1px solid}
.fbp.f-ok{border-color:var(--ok);background:rgba(74,222,128,.09)}
.fbp.f-part{border-color:var(--warn);background:rgba(251,191,36,.08)}
.fbp.f-bad{border-color:var(--bad);background:rgba(248,113,113,.09)}
.fbp .fhead{display:flex;gap:9px;align-items:center;font-weight:800;font-size:16px;flex-wrap:wrap}
.fbp .fpts{font-variant-numeric:tabular-nums}
.fbp .fline{font-size:14px;color:var(--mut);margin-top:6px}
.fbp .fline b{color:var(--text)}
details.expl{margin-top:10px;border-top:1px dashed #2c4a77;padding-top:10px}
details.expl summary{cursor:pointer;font-weight:700;color:var(--acc2);min-height:34px;display:flex;align-items:center;gap:8px}
details.expl .xbody{font-size:14.5px;color:#cbd8ee}
details.expl .xbody p{margin:6px 0}
details.expl .xbody .focus{color:var(--warn);font-weight:600}
/* ---------- footer / nav ---------- */
.qfoot{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:11px 12px;position:sticky;bottom:8px;z-index:40;box-shadow:0 -6px 24px rgba(0,0,0,.3)}
.qfoot .grp{display:flex;gap:8px;flex-wrap:wrap}
.navwrap{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:11px 12px;margin-bottom:14px}
.navgrid{display:flex;flex-wrap:wrap;gap:7px}
.nbtn{width:44px;height:40px;border-radius:9px;border:1px solid #24466e;background:#0c1a33;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.nbtn:hover{background:#13274a}
.nbtn.cur{box-shadow:0 0 0 2px var(--acc);border-color:var(--acc)}
.nbtn.st-ok{background:#14532d;border-color:var(--ok)}
.nbtn.st-part{background:#78350f;border-color:var(--warn)}
.nbtn.st-bad{background:#7f1d1d;border-color:var(--bad)}
.nbtn.st-skip{background:#3f3206;border-color:var(--warn);border-style:dashed;color:#fde68a}
.navlegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--mut)}
.navlegend span{display:inline-flex;gap:6px;align-items:center}
.navlegend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
/* ---------- blurred / paused ---------- */
.blurred{filter:blur(9px) saturate(.6);pointer-events:none;user-select:none}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(4,8,16,.78);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.show{display:flex}
.mbox{max-width:520px;width:100%;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:20px}
.mbox h3{margin:0 0 8px}
.mbox ul{margin:8px 0 14px;padding-left:20px;color:var(--mut);font-size:14.5px}
.mbox .grp{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
/* ---------- results ---------- */
.res{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--panel2));padding:20px;margin-bottom:14px}
.ringrow{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-size:34px;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:12px;color:var(--mut)}
.verdict{flex:1;min-width:260px}
.verdict h2{margin:0 0 6px;font-size:23px;display:flex;gap:10px;align-items:center}
.v-pass{color:var(--ok)}
.v-fail{color:var(--bad)}
.verdict p{color:var(--mut);margin:0 0 12px}
.certpanel{border:1px dashed var(--ok);background:rgba(74,222,128,.07);border-radius:12px;padding:12px 15px;font-size:14.5px;margin-top:10px}
.themebars{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media(max-width:760px){.themebars{grid-template-columns:1fr}}
.tbar .trow1{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}

<script>
window.EXAM_DATA = {"meta":{"topicId":"secai-plus","examName":"Secure AI deployment environments","title":"Secure AI deployment environments — HARD","chapterLabel":"2.2 Secure AI deployment environments","severity":"hard","passMark":70,"perQuestionSeconds":80,"introTag":"Chapter 2.2 · Apply best practices across on-premises, cloud, and hybrid AI infrastructures · CompTIA SecAI+ (CY0-001)","introSev":"This HARD file holds 30 exercises built for deep judgement: subtle distractors, near-miss answers, ambiguous artifacts where the obvious choice is wrong, and multi-step reasoning across logs, tickets, and configs. The terminal exercise names no tool — you must bring your own. Every exercise is worth 10 points and shows its explanation after Check."},"keywords":[{"name":"On-premises AI infrastructure","items":["air-gapped training enclave","GPU cluster hardening","secure boot","TPM & measured boot","attestation","bastion / jump host","privileged access workstation","physical access controls","out-of-band management (iDRAC/iLO)","firmware & driver patching","media sanitization (NIST SP 800-88)","VLAN segmentation","dedicated HSM"]},{"name":"Cloud AI platform security","items":["SageMaker AI VPC mode","private subnet isolation","NAT egress control","VPC endpoints (gateway & interface)","endpoint policies","security groups & NACLs","AWS Network Firewall","AWS WAF","IAM roles & least privilege","service control policies (SCPs)","AWS KMS customer-managed keys","envelope encryption","key rotation","CloudTrail","GuardDuty","Security Hub","Inspector","Macie","Secrets Manager","STS & federation","EC2 Image Builder","API Gateway","Lambda"]},{"name":"Hybrid connectivity & data movement","items":["Direct Connect & MACsec","Site-to-Site VPN","Client VPN","Transit Gateway segmentation","Route 53 Resolver & DNS Firewall","VPC Flow Logs","DataSync","Amazon EFS","FSx for Lustre","S3 Block Public Access","S3 bucket policies","AWS Backup","data residency"]},{"name":"Containers & orchestration","items":["EKS hardening","pod security standards","network policies","IRSA (IAM Roles for Service Accounts)","container image scanning","immutable infrastructure"]},{"name":"Data protection for AI","items":["data classification","PII detection & redaction","tokenization","TLS in transit","encryption at rest","S3 versioning & Object Lock","presigned URL risk","training-data validation"]},{"name":"Monitoring, detection & response","items":["CloudWatch alarms","CloudTrail Lake queries","OpenSearch SIEM","Managed Grafana","Amazon Detective","automated remediation (Lambda, Step Functions, SNS)","NIST incident response phases","forensics & chain of custody"]},{"name":"Governance & compliance","items":["multi-account strategy","Control Tower guardrails","Config rules","Audit Manager","Artifact","Well-Architected Tool","Trusted Advisor","Service Catalog approved patterns","RAM sharing","tagging governance"]},{"name":"Secure model serving","items":["model registry access control","artifact signing & integrity","inference endpoint isolation","model theft controls (throttling, quotas)","prompt injection defenses","agent scope-down","drift monitoring","egress restriction"]}],"exercises":[{"id":"H01","type":"branch","theme":"Governance & compliance","kw":["data residency","DataSync","service control policies (SCPs)","CloudTrail Lake queries","Direct Connect & MACsec","automated remediation (Lambda, Step Functions, SNS)","Control Tower guardrails"],"title":"Residency rupture: the sync task nobody read","scenario":"Kestrel trains its dispatch model on EU customer telemetry. An over-permissive DataSync task has quietly mirrored EU training buckets to a US region for six weeks so \"a test team could try GPUs there\". Legal is now on the bridge. The mirror site is even reachable over the Direct Connect path that MACsec protects - encryption was never the issue; permission was. The obvious answers are traps - walk the three decisions.","nodes":[{"q":"Legal says \"make it stop, now.\" What do you actually do first?","opts":[{"t":"Pause the DataSync task and its schedule, then freeze which buckets it could touch","ok":true,"fb":"Stopping the flow preserves the source data and the evidence, and stops new harm without destroying anything."},{"t":"Delete the mirrored copies in the US region immediately","ok":false,"fb":"Deleting feels decisive but destroys the evidence of what left, and the task may re-create copies minutes later."},{"t":"Ask the network team to unplug Direct Connect","ok":false,"fb":"That kills every production workload riding the link - ransom-like overreaction for one task."},{"t":"Watch the task for a day to confirm it is really copying","ok":false,"fb":"Six weeks of history already proves it. Watching adds another day of exposure."}]},{"q":"Scope question: exactly what crossed the border, and when?","opts":[{"t":"CloudTrail Lake query over DataSync task executions and object-level events, filtered by region and time window","ok":true,"fb":"One SQL query answers \"which buckets, which objects, what volume, since when\" with audit-grade records."},{"t":"Grep last week of app logs on the sync host","ok":false,"fb":"App logs are incomplete, unverified and missing five of the six weeks."},{"t":"Ask the test team what they remember downloading","ok":false,"fb":"Memory is not scope. Legal will need records."},{"t":"Compare bucket sizes between regions and diff the lists","ok":false,"fb":"Size diffs miss deletions and overwrites; you still cannot prove dates."}]},{"q":"Containment is done, scope is known: EU telemetry of 40k customers crossed. Which fix prevents the next silent copy?","opts":[{"t":"An SCP denying storage and copy actions outside EU regions for the org, plus a Config rule alerting on cross-region replication-style tasks","ok":true,"fb":"Preventive at the organization level, detective at the task level - the copy becomes impossible, and near-misses alert."},{"t":"Delete the test team IAM user that ran the task","ok":false,"fb":"The next over-permissive task just uses another principal; the design hole stays open."},{"t":"Trust the team training memo asking everyone to respect residency","ok":false,"fb":"Awareness did not fail here - governance did. Memo is not a control."},{"t":"Move the whole pipeline to the US region so copying is moot","ok":false,"fb":"That legalizes the breach instead of preventing it; EU residency obligations stay."}]}],"hint":"Preserve, prove with records, then make the action impossible. Deleting things is the trap in every step.","expl":"<p><b>Step 1 - pause, do not delete:<\/b> stopping the task stops the flow while keeping source data and logs intact. Deleting copies destroys evidence; unplugging Direct Connect harms the whole estate.<\/p><p><b>Step 2 - CloudTrail Lake:<\/b> task executions plus object-level data events give auditors bucket, object, volume and time - the exact scope legal needs. Logs and memory cannot prove a six-week window.<\/p><p><b>Step 3 - SCP + Config:<\/b> an SCP makes non-EU storage actions impossible for every principal in the org - deployed as a Control Tower guardrail on the landing zone - and a Config rule catches replication-style tasks early, with a Step Functions runbook that pauses offenders and pages via SNS. Deleting a user or writing memos leaves the design hole open.<\/p><p class=\"focus\">Focus next: residency incidents are governance failures - the fix is an impossibility (SCP), not a scolding.<\/p>","question":"Walk the three decisions. Choose the best action at each step - the obvious one is often the trap."},{"id":"H02","type":"spot","theme":"Identity & access","kw":["STS & federation","CloudTrail","external ID","model registry access control"],"title":"The AssumeRole chain that should not exist","scenario":"A quarterly access review pulled the role-assumption events for the model account. The team expects only the deploy chain. Chain abuse hides in patterns: unexpected sources, deprecated roles, keys created by roles. Four lines are the finding.","artifacts":[{"kind":"log","title":"CloudTrail - AssumeRole / key events, model account (window 02:10-03:40 UTC)","filter":true,"lines":["02:11:04 AssumeRole role/pipeline-deploy <- user/ci-runner        srcIP=10[.]44[.]2[.]15  mfa=n/a (service)","02:11:31 AssumeRole role/sagemaker-exec <- role/pipeline-deploy   srcIP=10[.]44[.]2[.]15  session=deploy-4021","02:41:50 AssumeRole role/prod-readonly <- role/staging-admin      srcIP=198[.]51[.]100[.]23  session=chain-77","02:42:12 GetObject role/prod-readonly bucket=model-registry key=dispatch-8.2.0.tar","02:44:03 AssumeRole role/legacy-etl <- role/prod-readonly         srcIP=198[.]51[.]100[.]23  note=role marked deprecated 2024, no externalId required","02:46:37 CreateAccessKey principal=role/legacy-etl target=user/etl-svc","03:01:22 AssumeRole role/sagemaker-exec <- role/pipeline-deploy   srcIP=10[.]44[.]2[.]15  session=deploy-4022","03:02:40 PutModel role/pipeline-deploy registry=dispatch model=dispatch-8.2.1","03:20:15 AssumeRole role/auditor-readonly <- user/r.okafor (Identity Center) srcIP=10[.]44[.]7[.]80","03:31:09 GetObject role/prod-readonly bucket=model-registry key=manifest.json  srcIP=10[.]44[.]7[.]80"]}],"question":"Select the <b>four<\/b> lines that form the suspicious cross-account chain (both hops, its data access, and its key creation).","bad":[2,4,3,5],"hint":"One hop enters from an internet address into prod-readonly; a deprecated role without externalId continues the chain; then a key is minted. The healthy deploy chain uses internal addresses.","expl":"<p><b>Line 3 - staging-admin assuming prod-readonly from 198[.]51[.]100[.]23:<\/b> the trusted chain starts from internal addresses; an internet source reaching into a prod role is hop one of the abuse.<\/p><p><b>Line 5 - legacy-etl assumed by prod-readonly:<\/b> a deprecated role that still trusts other roles and requires no external ID is the classic lateral bridge - trust relationships outlive the teams that made them.<\/p><p><b>Line 4 - GetObject on dispatch-8.2.0.tar by prod-readonly:<\/b> the chain touches the registry payload; that is the data consequence of the two hops.<\/p><p><b>Line 6 - CreateAccessKey by legacy-etl:<\/b> minting a long-lived key converts a temporary chain into a persistent foothold - the endgame of role chaining.<\/p><p>The healthy lines (deploy chain from 10[.]44[.]2[.]15, auditor from Identity Center) are expected shapes.<\/p><p class=\"focus\">Focus next: read trust chains from the outside in - who entered, through which deprecated door, and did anything permanent get created?<\/p>"},{"id":"H03","type":"order","theme":"Identity & access","kw":["key rotation","CloudTrail","EC2 Image Builder","Secrets Manager","S3 versioning & Object Lock"],"title":"Stolen pipeline key - sequence the response","scenario":"A public repo mirror exposed the long-lived access key of user/ml-ci-deploy. The key was live for 19 hours. Rate the six response actions in defensible order.","order":["Disable (then delete) the exposed access key of ml-ci-deploy","Pull CloudTrail events for the key to map every API call made in the 19-hour window","Revert or quarantine whatever the key created or changed (models, policies, roles)","Rotate every secret the pipeline could read, now stored in Secrets Manager with forced rotation","Rebuild the CI runner from a clean EC2 Image Builder pipeline image","Migrate the pipeline from long-lived keys to short-term STS role credentials"],"hint":"Kill the key, learn what it did, undo it, then fix everything it could reach, and finally remove the class of problem.","expl":"<p><b>1 Kill the key first<\/b> - every second it lives is attacker time; disabling stops new use immediately.<\/p><p><b>2 Map the 19 hours<\/b> - CloudTrail gives the attacker API history; you cannot revert what you have not listed.<\/p><p><b>3 Revert or quarantine<\/b> - models pushed, policies changed, roles touched: undo or isolate each, after the map exists.<\/p><p><b>4 Rotate reachable secrets<\/b> - if the key read Secrets Manager values, those secrets are attacker-known; forced rotation retires them.<\/p><p><b>5 Rebuild the runner<\/b> - the runner may be backdoored; a clean Image Builder image restores a known-good build origin.<\/p><p><b>6 STS instead of keys<\/b> - the structural fix: short-lived credentials make the next leak a 15-minute problem, not a 19-hour one.<\/p><p>Registry note: S3 versioning and Object Lock on the model registry would have made any attacker overwrite visible and reversible - a structural head start.<\/p><p>Graders note: rebuilding before rotating, or reverting before mapping, both destroy information or leave live secrets in attacker hands.<\/p><p class=\"focus\">Focus next: key incidents follow kill-map-undo-rotate-rebuild-refix. Skipping a step is how the second breach happens.<\/p>","question":"Drag the six actions into the defensible response order."},{"id":"H04","type":"fib","theme":"Containers & orchestration","kw":["EKS hardening","pod security standards","network policies","IRSA (IAM Roles for Service Accounts)"],"title":"Harden the inference pod spec","scenario":"The EKS cluster runs inference pods. The security review returned a hardening checklist for the pod spec; four words dropped out.","question":"Fill every blank with a word from the bank.","parts":["Run the container with runAs",{"b":0}," so it never holds uid 0; drop all Linux ",{"b":1}," beyond the defaults the runtime needs; apply a Kubernetes ",{"b":2}," policy so the pod reaches only the feature-store API and nothing else in the cluster; and give it AWS permissions through ",{"b":3}," - an IAM role bound to the service account - instead of node instance permissions."],"blanks":["NonRoot","capabilities","network","IRSA"],"extra":["Root","firewalls","storage","instance"],"hint":"One word per hardening layer: user, kernel powers, traffic, cloud permissions.","expl":"<p><b>NonRoot<\/b> - runAsNonRoot fails pods that try uid 0; a compromised container then has no root toolkit on the node.<\/p><p><b>capabilities<\/b> - dropping capabilities (NET_ADMIN, SYS_TIME...) shrinks what a container escape can do to the kernel.<\/p><p><b>network<\/b> - a NetworkPolicy turns the flat pod network into a least-privilege map: the inference pod can call the feature store and the DNS, nothing lateral.<\/p><p><b>IRSA<\/b> - IAM Roles for Service Accounts scope cloud permissions to this workload; with node roles, every pod on the node shares the same (too big) identity.<\/p><p class=\"focus\">Focus next: pod security is four dials - user, kernel, network, cloud identity. Turn each one down on purpose.<\/p>"},{"id":"H05","type":"spot","theme":"Identity & access","kw":["IAM roles & least privilege","external ID","STS & federation"],"title":"Trust policy trap","scenario":"A vendor asked for cross-account read access to the training bucket, and submitted this trust policy for your review. It looks scoped. Two lines make it trust every account that creates a role with the same name.","artifacts":[{"kind":"code","title":"proposed trust policy - role/model-vendor-reader","lines":["{","  \"Version\": \"2012-10-17\",","  \"Statement\": [{","    \"Effect\": \"Allow\",","    \"Principal\": \"*\",","    \"Action\": \"sts:AssumeRole\",","    \"Condition\": {","      \"StringLike\": {","        \"aws:PrincipalArn\": \"arn:aws:iam::*:role/VendorReader\"","      }","    }","  }]","}"]}],"question":"Select the <b>two<\/b> lines that combine into an open door.","bad":[4,8],"hint":"Principal * plus a StringLike on the role name - which part of an ARN does the * actually match?","expl":"<p><b>Line 5 - Principal \"*\"<\/b> invites every principal from every account to attempt assumption.<\/p><p><b>Line 9 - StringLike on \"arn:aws:iam::*:role/VendorReader\":<\/b> the wildcard sits in the <i>account id<\/i> position, so the condition matches VendorReader in <b>any<\/b> account, not the vendor account 444455566677. Together: any attacker who creates a role named VendorReader in their own account passes the condition.<\/p><p>The fix is two-fold: pin the principal to the vendor account (arn:aws:iam::444455566677:role/VendorReader) and require an <b>external ID<\/b> the vendor cannot influence - the standard defense against the confused-deputy problem.<\/p><p class=\"focus\">Focus next: a wildcard in a condition can silently re-open what the principal field seems to close. Read conditions as filters over the whole world.<\/p>"},{"id":"H06","type":"choice","theme":"Detect & respond","kw":["GuardDuty","forensics & chain of custody","egress restriction"],"title":"GuardDuty says exfiltration - keep the evidence alive","scenario":"GuardDuty flags a batch-inference instance for beaconing to 198[.]51[.]100[.]9. A 6-hour scoring job is 80% done on that instance. The on-call wants to terminate it \"before it does more damage\". Choose the response that contains without destroying the investigation.","choices":["Terminate the instance now; GuardDuty history is enough evidence","Reboot the instance to interrupt the beacon, let the job restart later","Tighten the instance security group to cut egress to that destination, keep the instance running, then snapshot memory and disk for forensics","Snapshot the disks, then wait for the job to finish before acting"],"correct":2,"hint":"Two options destroy evidence (memory or the live system), one option lets the beacon run for hours. Which option both stops the flow and keeps state?","expl":"<p><b>The SG-tighten path wins<\/b> because it does three things at once: it cuts the exfiltration path within seconds, it keeps the compromised system alive for live forensics (memory holds malware artifacts you can never get after termination), and the 80% job result can still be inspected rather than lost.<\/p><p><b>Terminate now<\/b> destroys memory and the live state - the classic evidence kill. <b>Reboot<\/b> clears memory too and the beacon returns with the job. <b>Snap and wait<\/b> gives the attacker hours; a snapshot without stopping the flow documents the crime while it continues.<\/p><p class=\"focus\">Focus next: containment should change the network around a compromised host before touching the host itself.<\/p>","question":"Choose the single best response for this shift."},{"id":"H07","type":"classify","theme":"Hybrid & data movement","kw":["FSx for Lustre","TPM & measured boot","MACsec","Bedrock guardrails"],"title":"Zones of control","scenario":"Kestrel defines three zones: <b>Training enclave<\/b> (the GPU world), <b>Serving tier<\/b> (where models answer requests), and <b>Cross-boundary<\/b> (controls that live on the links or resolvers between zones). Place eight controls.","cats":["Training enclave","Serving tier","Cross-boundary"],"items":[{"t":"TPM attestation gate before a node joins the training scheduler","c":0},{"t":"FSx for Lustre scratch volume with in-transit encryption for training reads","c":0},{"t":"Per-key inference quotas and throttling on the predict route","c":1},{"t":"Bedrock Guardrails filtering prompts and responses in the assistant tier","c":1},{"t":"MACsec on the Direct Connect circuit","c":2},{"t":"Route 53 Resolver DNS Firewall filtering enclave name lookups","c":2},{"t":"Mutual TLS between the on-prem job runner and the cloud control plane","c":2},{"t":"GPU BIOS and driver baseline verified at every boot","c":0}],"hint":"Ask where the control physically executes: on GPU hardware, at the request edge, or on the wire between.","expl":"<p><b>Training enclave:<\/b> TPM attestation proves node integrity before scheduling; the FSx for Lustre scratch volume (with in-transit encryption) is where the training reads happen; the BIOS/driver baseline is hardware trust. All three live inside the GPU world.<\/p><p><b>Serving tier:<\/b> quotas and throttling shape request traffic at the API edge; Guardrails filters conversational content where prompts are handled.<\/p><p><b>Cross-boundary:<\/b> MACsec encrypts the circuit itself; DNS Firewall sits on the resolver path that enclave queries must cross; mutual TLS authenticates both ends of the control-plane link. These controls exist precisely because two zones meet.<\/p><p class=\"focus\">Focus next: zone-thinking stops debates - argue about where the control runs, and its placement becomes obvious.<\/p>","question":"Drag each control into the zone where it executes."},{"id":"H08","type":"match","theme":"Detect & respond","kw":["VPC Flow Logs","CloudTrail","Route 53 Resolver & DNS Firewall","Managed Grafana"],"title":"What the log actually proves","scenario":"In the incident review, each responder quoted a log source to prove a claim. Half the quotes overstate what the source can show. Match each source to the claim it can truly prove.","cats":["VPC Flow Logs","CloudTrail","S3 server access logs","Route 53 Resolver DNS Firewall query logs","ELB access logs","CloudWatch metrics"],"items":[{"t":"\"Host A and host B had an accepted TCP conversation on port 443\"","c":0},{"t":"\"This role called CreateAccessKey at 03:14\"","c":1},{"t":"\"This principal downloaded model.tar.gz from the registry bucket\"","c":2},{"t":"\"The enclave looked up that suspicious domain at 02:58\"","c":3},{"t":"\"This API key made 4000 predict calls in one hour\"","c":4},{"t":"\"CPU doubled during the exfiltration window\"","c":5}],"hint":"Network state vs control-plane actions vs object reads vs name lookups vs application requests vs numbers over time.","expl":"<p><b>Flow Logs<\/b> prove reachability: IPs, ports, protocol, bytes, ACCEPT/REJECT. They cannot show the URL, the user, or the content.<\/p><p><b>CloudTrail<\/b> proves control-plane actions with identity and time - who created what, when.<\/p><p><b>S3 server access logs<\/b> prove object-level reads and writes on that bucket, with principal and key.<\/p><p><b>DNS Firewall query logs<\/b> prove name lookups from your VPCs - the beacon tripwire.<\/p><p><b>ELB access logs<\/b> prove application requests: route, status, bytes, client, API key.<\/p><p><b>CloudWatch metrics<\/b> prove aggregated numbers over time - never identities, always trends.<\/p><p class=\"focus\">Focus next: overstating a log source in a report is how findings die in court and in stand-up. Match claim to source, always.<\/p>","question":"Drag each claim onto the log source that can truly prove it."},{"id":"H09","type":"multi","theme":"Secure model serving","kw":["agent scope-down","service control policies (SCPs)","IAM roles & least privilege","VPC endpoints (gateway & interface)","endpoint policies"],"title":"Scope-down conditions: which actually restrict?","scenario":"A review asks you to shrink role/bedrock-agent-prod, which today allows bedrock:InvokeModel on Resource \"*\" from anywhere. Candidates proposed six policy changes. Some restrict. Some are theater. Some break automation.","question":"Select the <b>three<\/b> changes that genuinely restrict what this role can do.","choices":["Change the statement Resource to the specific foundation-model ARN the agent uses","Add a Deny statement when aws:SourceVpce is not the approved Bedrock interface endpoint","Add a condition allowing invocation only when aws:RequestedRegion is eu-central-1","Add an MFA condition to the allow statement so humans confirm every call","Move the check to a resource policy with aws:PrincipalOrgID and keep Resource *","Add Action bedrock:* on Resource * with a comment saying agents need flexibility"],"correct":[0,1,2],"hint":"One change narrows the what (model), one narrows the where (network path), one narrows the geography. The others either break service calls or change nothing.","expl":"<p><b>Pinning the model ARN<\/b> cuts the blast radius from every foundation model in the region to the one the agent needs - the \"what\".<\/p><p><b>The aws:SourceVpce Deny<\/b> blocks any invocation that does not arrive through the private endpoint - the \"where\"; it also kills token theft from a laptop outside the VPC.<\/p><p><b>aws:RequestedRegion<\/b> stops the same role from being replayed against models in other regions. Together with the endpoint resource policy, this is endpoint-policy thinking: rules on the door, not just on the caller.<\/p><p><b>Why not the others:<\/b> an MFA condition on a service role breaks automation - service calls cannot perform MFA, so the agent simply stops working (and someone \"fixes\" it by removing conditions). aws:PrincipalOrgID belongs in resource policies for cross-account trust, not as an identity-policy fix while Resource stays \"*\". And bedrock:* on * is the problem restated with a shrug.<\/p><p class=\"focus\">Focus next: scope has three axes - what, where, and from where. A real scope-down tightens at least one of them without breaking the caller.<\/p>"},{"id":"H10","type":"fib","theme":"Hybrid & data movement","kw":["Client VPN","Transit Gateway segmentation","Route 53 Resolver & DNS Firewall","SageMaker AI VPC mode","AWS Network Firewall"],"title":"Zero-trust memo, zero words left","scenario":"The CISO drafted the hybrid zero-trust memo; the word bank fell out. Complete it.","question":"Fill every blank with a word from the bank.","parts":["All administrator access enters through the ",{"b":0}," with device-posture checks - never through exposed SSH; every segment defaults to ",{"b":1}," and opens paths through Transit Gateway route tables only; service-to-service calls authenticate with ",{"b":2}," instead of trusting the network; and resolver queries are filtered and logged by DNS ",{"b":3}," so beacon domains die at lookup time."],"blanks":["Client VPN","deny","mTLS","Firewall"],"extra":["Site-to-Site","allow","VPN","Proxy"],"hint":"The admin door, the default posture, the protocol that authenticates both ends, and the DNS control.","expl":"<p><b>Client VPN<\/b> - per-user, posture-checked admin access replaces the bastion-bash habit; sessions are individual and expiring.<\/p><p><b>deny<\/b> - zero trust starts from deny-all; Transit Gateway route tables then open only the paths segments genuinely need.<\/p><p><b>mTLS<\/b> - mutual TLS authenticates both ends of every service call, so a compromised segment cannot impersonate a trusted one.<\/p><p><b>Firewall<\/b> - Route 53 Resolver DNS Firewall filters lookups and logs them; C2 domains fail before a connection is even attempted.<\/p><p>Site-to-Site VPN connects sites but does not check devices or users; \"allow\" is the opposite of the posture; a proxy is not the DNS control named here. In cloud-only corners the same posture appears as SageMaker AI VPC mode - notebooks in private subnets with endpoint-only egress - and stateful AWS Network Firewall rules guard the segment edges where DNS filtering alone is not enough.<\/p><p class=\"focus\">Focus next: zero-trust vocabulary - posture-checked entry, deny by default, authenticated pairwise traffic, filtered resolution.<\/p>"},{"id":"H11","type":"terminal","theme":"On-premises infrastructure","kw":["bastion / jump host","out-of-band management (iDRAC/iLO)","log analysis"],"title":"Identify the listener - no tool named","scenario":"During the enclave compromise review you have a break-glass shell on infer-host-01. Something is holding TCP port 8443 and the process is not in the runbook. Your goal: <b>show every listening TCP socket on this host together with the owning process<\/b>, so the mystery listener cannot hide.","hostname":"responder@infer-host-01","prompt":"responder@infer-host-01:~$","ph":"type the command that lists listening TCP sockets with process names","accepts":["^\\s*(sudo\\s+)?ss\\b[^|;&]*-[a-z]*t[a-z]*l[a-z]*[a-z]*p","^\\s*(sudo\\s+)?netstat\\b[^|;&]*-[a-z]*t[a-z]*l[a-z]*[a-z]*p","^\\s*(sudo\\s+)?lsof\\b[^|;&]*-i[^|;&]*"],"canonical":"ss -tlnp","alsoOk":"netstat -tlnp  /  lsof -i -P -n (then filter LISTEN)","hint":"The answer must list listening (L) TCP (T) sockets and the process (P) that owns them. Choose your own tool.","expl":"<p>Any of these answers the operational question:<\/p><p>- <code>ss -tlnp<\/code> - the modern default: <b>t<\/b>cp, <b>l<\/b>istening, <b>n<\/b>umeric, <b>p<\/b>rocess.<\/p><p>- <code>netstat -tlnp<\/code> - the classic equivalent, still everywhere.<\/p><p>- <code>lsof -i -P -n<\/code> - socket-to-process mapping from the open-files view; filter for LISTEN.<\/p><p>What matters for the exam behavior: you chose a socket-inspection tool, asked for listening TCP, and demanded the owning process. Without <b>p<\/b> (or the lsof equivalent) you see the door but never who opened it.<\/p><p class=\"focus\">Focus next: on a compromised host, \"which process owns this socket\" is the first fork in the road - know two tools that answer it by heart.<\/p>","question":"Type the command into the terminal. No tool is named - choose your own."},{"id":"H12","type":"order","theme":"Detect & respond","kw":["root user","GuardDuty","Amazon Detective","model theft controls (throttling, quotas)","S3 Block Public Access","CloudWatch alarms","tagging governance"],"title":"Six findings, one shift - response priority","scenario":"Sunday morning. Security Hub hands you six findings. You have three engineers before the weekend traffic. Rank by response priority, most urgent first. Ties are broken by \"active compromise beats exposure beats hygiene\".","order":["GuardDuty: root user console login from a residential proxy, MFA bypassed","Detective: service role ml-serving made 380k unusual read calls to the registry in 2 hours","Security Hub: dataset bucket with inference logs is public, no PII confirmed","CloudWatch: canary alert - predict route error rate 30% for 8 minutes","Inspector: one canary node runs an AMI with a critical CVE, not internet-facing","Config: 14 resources drift from mandatory tagging baseline"],"hint":"Two findings mean someone is inside right now; one means data is exposed; one is customers feeling pain; the last two are important, not urgent.","expl":"<p><b>1 Root login from a proxy, MFA bypassed:<\/b> account takeover in progress with the master identity; nothing has a higher ceiling of harm.<\/p><p><b>2 380k unusual registry reads by the serving role:<\/b> active theft at scale - either stolen credentials or a rogue pipeline; containment (revoke, throttle) and Detective both start here.<\/p><p><b>3 Public inference-log bucket:<\/b> exposure, not yet confirmed abuse - still fast to close (minutes) and it leaks operational detail attackers love. Close it properly: remove the Allow, switch on S3 Block Public Access at bucket and account level.<\/p><p><b>4 30% error rate on predict:<\/b> the CloudWatch alarms did their job; customers hurt now, but the cause may be benign (deploy, scaling) - triage overlaps with the compromises above.<\/p><p><b>5 Critical CVE on a non-internet canary:<\/b> patch in the window, no active threat.<\/p><p><b>6 Tag drift:<\/b> tagging governance debt; schedule it.<\/p><p class=\"focus\">Focus next: priority = in-progress compromise > open exposure > customer pain > hardening > hygiene. Tie-break on blast radius and reversibility.<\/p>","question":"Drag the findings into response priority, most urgent first."},{"id":"H13","type":"spot","theme":"Cloud platform security","kw":["security groups & NACLs","Amazon EFS","private subnet isolation"],"title":"The \"locked\" serving subnet is not locked","scenario":"The change ticket claims: \"serving subnet is segmented; model files come from EFS; no direct internet path exists.\" The Terraform-ish plan excerpt is below. Three lines contradict the claim.","artifacts":[{"kind":"code","title":"plan excerpt - serving subnet (ticket KST-8801)","lines":["resource \"aws_network_acl\" \"serving\" {","  subnet_id = aws_subnet.serving.id","  ingress  = [{ protocol = \"tcp\", rule_no = 100, action = \"allow\", cidr = \"0[.]0[.]0[.]0/0\", from_port = 0, to_port = 65535 },","              { protocol = \"tcp\", rule_no = 200, action = \"allow\", cidr = \"10[.]40[.]0[.]0/16\", from_port = 443, to_port = 443 }]","  egress   = [{ protocol = \"tcp\", rule_no = 100, action = \"allow\", cidr = \"0[.]0[.]0[.]0/0\", from_port = 0, to_port = 65535 }]","}","resource \"aws_security_group\" \"serving\" {","  ingress = [{ from_port = 8443, to_port = 8443, security_groups = [aws_security_group.alb.id] }]","  egress  = [{ from_port = 0, to_port = 0, protocol = \"-1\", cidr = \"0[.]0[.]0[.]0/0\" }]","}","resource \"aws_efs_mount_target\" \"serving\" {","  file_system_id = aws_efs_file_system.models.id","  subnet_id      = aws_subnet.public_edge.id","  security_groups = [aws_security_group.open_fs.id]","}"]}],"question":"Select the <b>three<\/b> lines that contradict the ticket claims.","bad":[2,8,12],"hint":"One line is an NACL that \"allows everything first\"; one is an all-protocol egress; one puts a mount target in the wrong subnet.","expl":"<p><b>Line 3 - NACL rule 100 allows all TCP from 0[.]0[.]0[.]0/0:<\/b> NACLs evaluate by rule number, so this catch-all fires before the \"real\" rule 200 and the subnet is not segmented at all.<\/p><p><b>Line 9 - SG egress all protocols to the world:<\/b> \"no direct internet path\" fails at the security group; every instance in the subnet may open any connection out.<\/p><p><b>Line 13 - EFS mount target in the public edge subnet:<\/b> the model file system is exposed at the edge - the storage follows the wrong network; mount targets belong in the private serving subnets with tight SGs.<\/p><p class=\"focus\">Focus next: claims vs configuration - read rule order for NACLs, protocol fields for SGs, and subnet placement for shared storage.<\/p>"},{"id":"H14","type":"spot","theme":"On-premises infrastructure","kw":["firmware & driver patching","TPM & measured boot","secure boot","air-gapped training enclave","GPU cluster hardening","physical access controls"],"title":"Firmware patch runbook v7 - the quiet shortcuts","scenario":"After last quarter, the air-gapped training enclave firmware runbook for the GPU fleet was \"simplified\". The intent stays: verified images, measured boot intact, no scheduling shortcuts - GPU cluster hardening as a habit. Three steps cut corners.","artifacts":[{"kind":"code","title":"runbook v7 - GPU firmware patch (steps in order)","lines":["1. Verify the signed firmware image against the vendor certificate on the PAW","2. Stage the image on the internal update server from the enclave segment","3. Flash one node from the production pool as the canary to save lab time","4. Confirm the flash by checking the reported file size matches the download","5. Reboot the node; secure boot stays enabled throughout","6. Skip re-measuring TPM PCRs; the previous attestation baseline is still good","7. Roll out to the rest of the pool in maintenance windows"]}],"question":"Select the <b>three<\/b> steps that betray the runbook intent.","bad":[2,3,5],"hint":"Canaries come from the lab, size is not integrity, and a firmware change invalidates old measurements by definition.","expl":"<p><b>Step 3 - canary from production:<\/b> a canary exists to absorb failure; using a production node makes the fleet the lab. The canary belongs in the lab segment with rollback media ready.<\/p><p><b>Step 4 - size as verification:<\/b> matching file size proves nothing about content. Verification means the vendor signature and hash checked (step 1) plus a post-flash measurement of what actually booted.<\/p><p><b>Step 6 - skip re-measuring PCRs:<\/b> measured boot extends TPM PCRs with what booted. New firmware means new measurements; keeping the old baseline makes attestation blind to this change - and to anything smuggled alongside it.<\/p><p>Steps 1, 2, 5 and 7 are the healthy spine: verify on the PAW (a privileged access workstation), stage internally, secure boot stays on, staged rollout. Physical access controls - badge, mantrap, CCTV - stay unchanged during patch windows; firmware work happens inside the controlled room.<\/p><p class=\"focus\">Focus next: attestation is a chain - change one link and every later measurement must be re-taken or the whole proof is stale.<\/p>"},{"id":"H15","type":"classify","theme":"Secure model serving","kw":["model theft controls (throttling, quotas)","artifact signing & integrity","egress restriction"],"title":"Kill the kill chain - map actions to phases","scenario":"The red team documented how they nearly stole the dispatch model. Their campaign map is below; the controls that stopped or would have stopped each phase are mixed in. Drag each card to the phase it belongs to: <b>Recon<\/b>, <b>Access<\/b>, <b>Exfiltration<\/b>.","cats":["Recon","Access","Exfiltration"],"items":[{"t":"Fingerprinting API version headers from three internet hosts","c":0},{"t":"A CI token pasted in a public repo issue","c":1},{"t":"4,800 uniform predict calls over six hours with one key","c":2},{"t":"AssumeRole into role/model-reader via the legacy trust","c":1},{"t":"Bulk GetObject on registry artifacts from an unfamiliar ASN","c":2},{"t":"DNS lookups for the staging endpoint from a seedlist site","c":0}],"hint":"Looking is recon. Getting in (with credentials or roles) is access. Model bytes leaving is exfiltration.","expl":"<p><b>Recon:<\/b> version-header fingerprinting and DNS seedlist lookups - the attacker maps the surface without touching protected resources.<\/p><p><b>Access:<\/b> the pasted CI token and the legacy-trust AssumeRole are the two ways in. Both die under short-lived credentials and pinned, external-ID-protected trust.<\/p><p><b>Exfiltration:<\/b> uniform predict calls (behavioral theft through the API) and bulk artifact downloads (direct theft) - stopped by quotas plus egress anomaly detection, and by registry access alarms.<\/p><p class=\"focus\">Focus next: classify the campaign before choosing controls - recon needs throttling and DNS monitoring, access needs identity hygiene, exfil needs volume analytics.<\/p>","question":"Drag each card onto the campaign phase it belongs to."},{"id":"H16","type":"multi","theme":"Data protection","kw":["training-data validation","FSx for Lustre","DataSync","data classification","Macie","PII detection & redaction","tokenization"],"title":"Poisoning or drift? Read the sync week","scenario":"During the hybrid dataset sync week, seven observations landed in the channel. Some hint at deliberate tampering of training data; some are routine platform noise. Select the <b>three<\/b> that genuinely warrant a poisoning investigation.","choices":["A label file arrives with the same schema but 12% of safety-critical labels flipped, source: sync job","One dataset shard fails its recorded checksum after the DataSync run","The sync executed outside the change window from an IP not in the approved range","Model accuracy dipped 0.4% after a planned hyperparameter change","FSx for Lustre reports cache-eviction warnings on the scratch volume","The scheduled schema migration added two nullable columns as documented"],"correct":[0,1,2],"hint":"Tampering lives in content, integrity, and unauthorized process. Performance dips and documented changes are the noise.","expl":"<p><b>Label flips (12% on safety-critical classes):<\/b> content-level tampering with maximum model impact - exactly what a poisoning attack wants, delivered through the sync path.<\/p><p><b>Checksum mismatch on one shard:<\/b> integrity failure in transit or in place; either the file changed or the wrong file arrived - both are poisoning-shaped until proven otherwise.<\/p><p><b>Sync outside the window from an unapproved IP:<\/b> process-level compromise; even with clean content, an unauthorized writer of the training path is an incident.<\/p><p>Follow-up for the three true positives: the same validation gate runs Macie for PII detection & redaction, and tokenization replaces any identifier that must stay for joins - so poisoned or sensitive rows never reach the trainer.<\/p><p><b>Why not the others:<\/b> a 0.4% dip right after a planned hyperparameter change is expected variance; cache-eviction warnings are storage housekeeping; a documented schema migration is change management working.<\/p><p class=\"focus\">Focus next: poisoning hides in three places - content, integrity, and who was allowed to write. Watch all three, ignore none silently.<\/p>","question":"Select the three observations that warrant a poisoning investigation."},{"id":"H17","type":"order","theme":"Detect & respond","kw":["forensics & chain of custody","log analysis","GuardDuty"],"title":"Keep the evidence court-ready - order the forensics","scenario":"The GuardDuty-confirmed compromise of infer-host-07 will end in legal action against the intruder. Six forensic actions must happen in defensible order or the case dies in court.","order":["Photograph and document the live state (screen, cables, indicator lights, session notes)","Capture volatile memory before the host powers down","Image the disks and hash the images at capture time","Copy the relevant logs into the evidence store with hashes and a chain-of-custody form","Analyze only working copies, never the originals","Write the report: timeline, tools, versions, and every person who touched evidence"],"hint":"Volatile first, stable next; originals never touched after hashing; every hand-off on paper.","expl":"<p><b>1 Document the live state<\/b> - the scene description is evidence and it is free; do it before anything changes.<\/p><p><b>2 Memory capture<\/b> - RAM holds keys, injected code and connections that vanish at power-off; volatile beats stable.<\/p><p><b>3 Disk images + hashes<\/b> - imaging freezes the state; hashing at capture time is what makes the images provably unmodified.<\/p><p><b>4 Logs to the evidence store<\/b> - with hashes and a custody form, so every later hand-off is on record.<\/p><p><b>5 Analyze copies only<\/b> - analysis tools mutate data; originals must stay sealed.<\/p><p><b>6 The report<\/b> - timeline, tooling, versions, custodians; the document the court actually reads.<\/p><p>Analyzing originals, or capturing memory after shutdown, are the two classic case-killers.<\/p><p class=\"focus\">Focus next: order = document, volatile, stable, preserve, analyze copies, report. Hash early, hash everywhere.<\/p>","question":"Drag the six forensic actions into the court-defensible order."},{"id":"H18","type":"spot","theme":"Hybrid & data movement","kw":["Route 53 Resolver & DNS Firewall","egress restriction","log analysis","OpenSearch SIEM"],"title":"DNS tunneling out of the enclave","scenario":"The enclave may resolve names but must never move data out. DNS Firewall query logs for one hour are below. Tunneling looks like: very long subdomains, high-entropy labels, many TXT queries to one zone. Four lines carry the tunnel.","artifacts":[{"kind":"log","title":"Route 53 Resolver DNS Firewall query logs - enclave vpc (13:00-13:58 UTC)","filter":true,"lines":["13:02:11 gpu-node-03 A  updates.vendor-cdn.example NOERROR allowed","13:04:29 gpu-node-03 A  releases.internal.kestrel.example NOERROR allowed","13:09:03 gpu-node-03 TXT p7x2m9q1t4v8w3z6a5c2b8n4m6k1j3h5[.]eupd-example[.] NXDOMAIN allowed","13:12:47 gpu-node-11 A  crates.internal.kestrel.example NOERROR allowed","13:18:22 gpu-node-03 TXT k9f2d7s4a1m3n8q5w2e6r1t4y7u3i9o2[.]eupd-example[.] NOERROR allowed","13:24:05 gpu-node-07 A  metrics.internal.kestrel.example NOERROR allowed","13:31:40 gpu-node-03 TXT z3c8v1b5n2m6q9w4e7r1t3y5u7i9o1p4[.]eupd-example[.] NXDOMAIN allowed","13:38:12 gpu-node-03 A  1c9b7e3f5a2d4e6f8a0b2c4d6[.]eupd-example[.] NOERROR allowed","13:44:51 gpu-node-11 A  artifacts.internal.kestrel.example NOERROR allowed","13:51:09 gpu-node-03 TXT w6e3r1t5y2u8i4o9p1a3s5d7f2g4h8j1[.]eupd-example[.] NOERROR allowed"]}],"question":"Select the <b>four<\/b> lines that make up the tunnel.","bad":[2,4,6,7],"hint":"Filter on upd-example - then drop the plain A-record line: long TXT labels and long hex A-records carry the payload.","expl":"<p><b>Lines 3, 5, 7, 9 and 8 (the four TXT plus the hex A-record):<\/b> the four TXT queries carry 32-character random labels under upd-example[.]net - each label is a chunk of exfiltrated data; the NXDOMAIN/NOERROR mix is the chatter of an encoder. Line 8 adds a long hex A-record - the same trick over A records. Together they are a DNS tunnel from gpu-node-03.<\/p><p>The healthy lines are short, predictable internal names and a vendor CDN - normal enclave life.<\/p><p>Note the kicker: every query says <b>allowed<\/b>. DNS Firewall was logging but no rule existed for this pattern - detection without prevention. The fix: a DNS Firewall rule blocking high-entropy labels and TXT to unknown zones, plus egress denial from gpu nodes.<\/p><p>Feed these queries into the OpenSearch SIEM so the entropy alert fires on the first tunnel packet, not the four-hundredth.<\/p><p class=\"focus\">Focus next: in DNS logs, entropy plus length plus record type (TXT) is the tunnel signature. And a logged-but-allowed finding is an unfinished control.<\/p>"},{"id":"H19","type":"choice","theme":"Secure model serving","kw":["AWS WAF","API Gateway","inference endpoint isolation","Bedrock guardrails"],"title":"Layer the public endpoint properly","scenario":"The public assistant endpoint currently runs as: ALB straight to model containers in the same public-facing subnets; the containers accept any source; a Bedrock guardrail filters chat content. After the theft scare, pick the best layered redesign.","choices":["Add Bedrock Guardrails on the containers and keep the current network path","WAF at the edge for rate and injection rules; API Gateway with usage plans and throttling; containers moved to private subnets reachable only through a private integration","Put the containers behind a security group that allows all traffic on port 8080 so WAF can reach them","Throttle at the container level with a custom rate-limiter library and keep the public subnets"],"correct":1,"hint":"Only one option fixes content, volume, identity AND network placement together.","expl":"<p><b>The WAF + API Gateway + private integration option<\/b> fixes all four layers: WAF absorbs floods and injection payloads before they cost compute; API Gateway adds authentication, per-key usage plans and hard throttling; private subnets plus a private integration remove the public network path entirely - the containers become unaddressable from the internet.<\/p><p><b>Why not the others:<\/b> Guardrails filters content but does nothing for volume, theft scraping or network exposure. \"Allow all on 8080\" is the opposite of segmentation. A container-level limiter is a good complement, but public subnets keep the direct path open - the theft campaign simply routes around one library.<\/p><p class=\"focus\">Focus next: serving hardening = content (WAF/Guardrails), volume and identity (API Gateway), and placement (private subnets). All three, or none hold.<\/p>","question":"Choose the redesign that layers every control correctly."},{"id":"H20","type":"fib","theme":"Data protection","kw":["S3 bucket policies","TLS in transit","VPC endpoints (gateway & interface)","presigned URL risk"],"title":"Deny the wrong pipe - rebuild the policy sentence","scenario":"The registry policy review lost its summary. Rebuild it with the bank.","question":"Fill every blank with a word from the bank.","parts":["The registry keeps one ",{"b":0}," statement that blocks every action unless aws:SecureTransport is ",{"b":1},", and a second Deny unless the request carries our approved aws:",{"b":2}," condition key; together they mean copies can only happen from inside the VPC over ",{"b":3},", never from the open internet."],"blanks":["Deny","true","SourceVpce","TLS"],"extra":["Allow","false","SourceIp","SFTP"],"hint":"The effect that blocks, the boolean that forces encryption, the condition key about endpoints, and the transport protocol.","expl":"<p><b>Deny<\/b> - guardrails on buckets are written as explicit Deny statements; Allows grant, Denys fence.<\/p><p><b>true<\/b> - aws:SecureTransport false marks plain-HTTP requests; denying them forces TLS.<\/p><p><b>SourceVpce<\/b> - aws:SourceVpce identifies the VPC endpoint a request rode in on; a Deny when it is not your endpoint keeps traffic on the private path.<\/p><p><b>TLS<\/b> - with SecureTransport enforced, every surviving copy rides TLS inside the VPC.<\/p><p>Presigned URLs inherit these Deny conditions - a URL minted outside the VPC still fails the SourceVpce test. SourceIp exists but pins addresses, not endpoints - the wrong tool for a private-path design; SFTP is not an S3 transport; Allow and false are the inverted twins of two answers.<\/p><p class=\"focus\">Focus next: two Deny statements - one for transport, one for the endpoint - turn a public-ish bucket into a private one, provably.<\/p>"},{"id":"H21","type":"branch","theme":"Secure model serving","kw":["inference endpoint isolation","egress restriction","prompt injection defenses"],"title":"Red lens, blue lens - the DMZ inference host","scenario":"You switch hats twice in this drill. Red first: you hold a web-shell foothold on the DMZ inference host. Then blue: you defend the same host. Three decisions, two perspectives.","nodes":[{"q":"RED: You have command execution on the host. Which next action stays quietest while moving you toward the model weights?","opts":[{"t":"Query the instance metadata path from the host to harvest the role credentials","ok":true,"fb":"Metadata requests look like normal instance chatter in most shops - the quietest route to cloud permissions."},{"t":"Run a full subnet port scan to map the VPC","ok":false,"fb":"Loud. Flow-log anomaly alerts trip on sweeps in minutes."},{"t":"Zip the model directory and upload it to a public paste site immediately","ok":false,"fb":"Giant egress with no rehearsal - the fastest way to an exfiltration alert."},{"t":"Change the admin password and leave a ransom note","ok":false,"fb":"That is vandalism, not model theft; it ends the stealth advantage."}]},{"q":"BLUE: The red team used exactly that metadata path. Which control would have cut the chain at the host?","opts":[{"t":"IMDSv2 enforced with hop limit 1, so a web-shell process cannot reach instance credentials","ok":true,"fb":"IMDSv2 requires a session PUT with a hop count that container/host tricks cannot satisfy - the credential harvest dies here."},{"t":"A weekly antivirus scan on the host","ok":false,"fb":"AV scans files weekly; the credential harvest takes seconds."},{"t":"Rotating the admin password every 30 days","ok":false,"fb":"The attacker never logged in with a password."},{"t":"A monthly port-scan alert rule","ok":false,"fb":"The attack made no scan - the alert never fires."}]},{"q":"BLUE: Which architectural change prevents the whole class of foothold-to-credentials attacks next quarter?","opts":[{"t":"Move the model serving into private subnets behind a private integration, with the host role scoped to one read-only artifact prefix","ok":true,"fb":"No public foothold to take, and even a foothold gets a role that can read one prefix - not the estate."},{"t":"Longer, rotated passwords on the host","ok":false,"fb":"Passwords were never the path; credential roles were."},{"t":"Install an EDR on the model containers","ok":false,"fb":"Useful visibility, but the architecture still hands every foothold the estate role."},{"t":"Rename the endpoints to obscure them","ok":false,"fb":"Security by obscurity delays a scanner by minutes."}]}],"hint":"Red: quiet beats fast, metadata beats scanning. Blue: kill the credential source, then remove the public door.","expl":"<p><b>Red perspective:<\/b> the quietest escalation is the metadata service - one request that looks native. Scans and instant bulk exfiltration trip volume anomalies; ransom notes end the game.<\/p><p><b>Blue control 1:<\/b> IMDSv2 with hop limit 1 makes the credential harvest technically fail - defense at the source of the credentials.<\/p><p><b>Blue control 2:<\/b> private subnets plus a private integration remove the public foothold class, and a scope-down role (one read-only prefix) turns any future foothold into a dead end. EDR and passwords are useful, but neither changes what a foothold can reach.<\/p><p class=\"focus\">Focus next: attack the way the attacker thinks - least noise first; defend by removing the credential prize and the public door.<\/p>","question":"Switch hats as told: red perspective first, then blue. Three decisions total."},{"id":"H22","type":"spot","theme":"Secure model serving","kw":["agent scope-down","IAM roles & least privilege","Lambda"],"title":"Agent gone wide - find the over-broad lines","scenario":"An assistant agent was granted \"everything it might need someday\". Its action-group config is below; the intent: the agent reads one knowledge base and calls one Lambda tool. Two lines make the config dangerous.","artifacts":[{"kind":"code","title":"agent config - assistant-prod (action group + role)","lines":["actionGroup: ticket-lookup","  lambda: arn:aws:lambda:eu-central-1:111122233:function:kb-ticket-lookup","  description: looks up service tickets for the assistant","role: assistant-prod-role","  trust: bedrock.amazonaws[.]com","  allow:","    - bedrock:Retrieve on arn:aws:bedrock:...:knowledge-base/kb-support-01","    - lambda:InvokeFunction on \"*\"","    - s3:GetObject on \"arn:aws:s3:::kb-support-01/*\"","  deny: []","  sessionPolicy: full-write"]}],"question":"Select the <b>two<\/b> lines that make the agent dangerous.","bad":[7,10],"hint":"One wildcard sits in a Lambda permission; one session setting hands the agent a keyboard that can write everywhere.","expl":"<p><b>Line 8 - lambda:InvokeFunction on \"*\":<\/b> the agent can invoke <b>any function in the account<\/b> - including the payroll sync, the deploy trigger and the data-deletion job. Scope it to the one kb-ticket-lookup ARN; anything more is a remote-code-execution voucher for a prompt injection.<\/p><p><b>Line 11 - sessionPolicy: full-write:<\/b> the session carries broad write scope into every call; a successful prompt injection inherits it. Sessions should be read-mostly and narrowly scoped - the agent formats an answer, it does not mutate systems.<\/p><p>The knowledge-base Retrieve and the single Lambda target are the intended shape; trust on the Bedrock principal is correct.<\/p><p class=\"focus\">Focus next: agents execute prompts - assume a prompt can be hostile. Every wildcard you grant an agent, you grant to whoever writes its next prompt.<\/p>"},{"id":"H23","type":"match","theme":"Governance & compliance","kw":["Audit Manager","Artifact","Trusted Advisor","CloudTrail Lake queries","RAM sharing"],"title":"The compliance shelf - map requirement to control","scenario":"The auditor left six requirements on the table. Match each to the AWS-native control that satisfies it most directly.","cats":["CloudTrail Lake","AWS Audit Manager","AWS Artifact","AWS Config","Trusted Advisor","Service Catalog"],"items":[{"t":"Seven-year immutable storage with SQL search over management events","c":0},{"t":"Continuously collected evidence mapped to ISO 27001 controls","c":1},{"t":"AWS-side compliance reports to hand the auditor","c":2},{"t":"Proof that bucket encryption never drifted from the baseline","c":3},{"t":"Service-limited checks for cost, performance and fault tolerance quick wins","c":4},{"t":"Approved, pre-hardened AI stack that teams must deploy from","c":5}],"hint":"Archive with SQL, evidence engine, the vendor paper, the drift watcher, the quick-win checker, the golden template.","expl":"<p><b>CloudTrail Lake<\/b> - long-retention, queryable event archive; seven years with SQL is its shape.<\/p><p><b>Audit Manager<\/b> - maps resource evidence to framework controls continuously; the ISO answer.<\/p><p><b>Artifact<\/b> - AWSs own compliance reports and agreements - the paper the auditor accepts for the vendor side.<\/p><p><b>Config<\/b> - records configuration over time and evaluates rules; drift proof lives here.<\/p><p><b>Trusted Advisor<\/b> - service-limit, cost, performance and fault-tolerance checks; the quick-win list.<\/p><p><b>Service Catalog<\/b> - approved products; deploying AI stacks only from the catalog is governance by construction.<\/p><p>Shared networks count too: RAM sharing of subnets shows up in audits as shared-responsibility evidence, so keep the RAM agreements with the rest of the pack.<\/p><p class=\"focus\">Focus next: auditors ask \"prove it\" - Lake archives, Audit Manager evidences, Artifact attests, Config proves stability, Service Catalog prevents the mess.<\/p>","question":"Drag each requirement onto the control that satisfies it most directly."},{"id":"H24","type":"choice","theme":"Data protection","kw":["AWS KMS customer-managed keys","IAM roles & least privilege","multi-account strategy","dedicated HSM","envelope encryption","encryption at rest"],"title":"Who may actually use the key?","scenario":"Account A owns the KMS CMK that encrypts model artifacts. The data team in account B must decrypt for serving. The key policy currently only says: \"Principal: arn:aws:iam::B:root\" for kms:Decrypt. Serving still fails. Why, and what completes the design?","choices":["The key policy must name the B serving role directly; IAM in B is irrelevant","KMS grants are broken; switch to S3-managed encryption","Add an SCP in B allowing kms:* on all keys","Both doors must open: the key policy delegates to account B, AND an IAM identity policy in B grants the serving role kms:Decrypt"],"correct":3,"hint":"Cross-account access to KMS is a two-door system. Naming the account root opens the first door only.","expl":"<p><b>Cross-account KMS is two doors:<\/b> the <b>key policy<\/b> in account A must delegate to account B (naming B root or B roles), and then an <b>identity policy in B<\/b> must grant the specific serving role kms:Decrypt. Naming B:root only opens door one - inside B, nobody has KMS permissions unless their own IAM grants them, so serving keeps failing.<\/p><p><b>Why not the others:<\/b> pinning B roles directly in the key policy works but couples As key policy to Bs team changes - delegation plus identity policy scales better. S3-managed encryption does not fix cross-account key use, it removes the CMK control you wanted. A broad kms:* SCP is a blunt org-level permission that still does not create the identity-policy grant.<\/p><p>Context: this CMK is the root of encryption at rest for the artifacts under envelope encryption, and its highest-grade alternative is a dedicated HSM backing the same design.<\/p><p class=\"focus\">Focus next: cross-account = resource policy door + identity policy door. One open door opens nothing.<\/p>","question":"Choose the answer that explains the failure and completes the design."},{"id":"H25","type":"order","theme":"On-premises infrastructure","kw":["secure boot","TPM & measured boot","attestation","VLAN segmentation","media sanitization (NIST SP 800-88)"],"title":"Boot with proof - order the attestation chain","scenario":"New GPU nodes may join the training scheduler only if they can prove their boot. Put the five chain steps in the order they happen.","order":["UEFI secure boot verifies the bootloader signature against the enrolled key store","Measured boot extends each boot component hash into the TPM PCRs","The attestation service requests a TPM quote and compares PCRs to the golden baseline","The node receives a join certificate and enters the training scheduler queue","A mismatch sends the node to the remediation VLAN, never the training pool"],"hint":"Verify the boot, measure the boot, prove the measurement, then join - or be fenced.","expl":"<p><b>1 Secure boot<\/b> - firmware-level check: the bootloader must carry a signature the enrolled keys trust, or the boot stops.<\/p><p><b>2 Measured boot<\/b> - independent of trust decisions, every component hash extends into TPM PCRs - an unforgeable log of what booted.<\/p><p><b>3 Attestation<\/b> - the node signs a TPM quote; the service compares it to the golden baseline. This is proof, not
