 a checkbox.<\/p><p><b>4 Join<\/b> - with a matching quote, the node earns its scheduler certificate.<\/p><p><b>5 Mismatch quarantine<\/b> - the remediation VLAN gives it a repair path without giving it the training pool.<\/p><p>Secure boot decides \"may this boot at all\", measured boot records \"what booted\", attestation decides \"may it join\". Skipping the re-measure step makes step 3 compare against stale truths. And when a node finally leaves the pool, NIST SP 800-88 media sanitization is the last control of its lifecycle.<\/p><p class=\"focus\">Focus next: three different jobs - verify, record, prove. Attestation without fresh measurement is theater.<\/p>","question":"Drag the five chain steps into the order they happen at boot."},{"id":"H26","type":"classify","theme":"Governance & compliance","kw":["multi-account strategy","Security Hub","AWS Backup","Audit Manager"],"title":"Whose queue? Route the eight tickets","scenario":"The intake bot mixed eight tickets into one pile. Route each to its owning team: <b>Security operations<\/b> (live detection and response), <b>Cloud platform team<\/b> (infrastructure build and change), <b>Data & ML platform<\/b> (pipelines, datasets, training), <b>GRC<\/b> (governance, risk, compliance).","cats":["Security operations","Cloud platform team","Data & ML platform","GRC"],"items":[{"t":"GuardDuty finding triage on the serving account","c":0},{"t":"Change request: new Transit Gateway attachment for the lab segment","c":1},{"t":"Dataset schema-change approval for the fine-tune set","c":2},{"t":"Assemble the quarterly evidence pack in Audit Manager","c":3},{"t":"WAF rule tuning after this weeks scrape attempt","c":0},{"t":"Restore drill: AWS Backup of the registry bucket","c":1},{"t":"FSx for Lustre throughput complaint from the training fleet","c":2},{"t":"Residency impact review for the new EU partner data","c":3}],"hint":"Live attackers to SecOps; wires and restores to platform; datasets and training storage to ML platform; law and audits to GRC.","expl":"<p><b>Security operations:<\/b> GuardDuty triage and WAF tuning are detection-and-response work - hours matter and context lives in the SOC.<\/p><p><b>Cloud platform team:<\/b> a new Transit Gateway attachment is network change; a Backup restore drill is infrastructure resilience practice.<\/p><p><b>Data & ML platform:<\/b> schema approvals and FSx throughput are the daily bread of the ML pipeline owners.<\/p><p><b>GRC:<\/b> evidence packs and residency reviews are governance obligations - legal-shaped, audit-shaped, and slow on purpose.<\/p><p class=\"focus\">Focus next: misrouted tickets are silent SLA killers - routing is a security control too.<\/p>","question":"Drag every ticket to its owning team."},{"id":"H27","type":"classify","theme":"Secure model serving","kw":["model theft controls (throttling, quotas)","multi-account strategy","inference endpoint isolation","Well-Architected Tool"],"title":"Blast radius or theater? Sort the proposed changes","scenario":"After the near-theft incident, seven proposals reached the CISO. Two buckets: <b>Real reduction<\/b> (structurally shrinks what one compromise can reach) and <b>Mostly theater<\/b> (looks busy, changes little for this threat).","cats":["Real reduction","Mostly theater"],"items":[{"t":"Per-key usage plans with hard quotas on every predict route","c":0},{"t":"Move production serving into its own account behind an SCP boundary","c":0},{"t":"Replace the public ALB path with a private integration only","c":0},{"t":"Add a security-awareness banner to the internal dashboard login","c":1},{"t":"Deploy an antivirus agent on the API gateway container host","c":1},{"t":"Rotate the TLS certificate to a longer key on the same public path","c":1},{"t":"Quarterly access review that deletes orphaned API keys","c":0}],"hint":"Ask each proposal: if the attacker repeats the exact campaign tomorrow, what exactly changed?","expl":"<p><b>Real reduction:<\/b> quotas cap how much model behavior any one key can harvest; account separation plus an SCP walls production off from everything else; a private-only path deletes the public door; deleting orphaned keys removes the standing credentials the campaign fed on.<\/p><p><b>Mostly theater:<\/b> a login banner changes no capability; antivirus on an API host does not touch API-layer scraping (the threat lived in valid calls); a longer TLS key protects transport while the same public path hands out predictions - the attacker never broke TLS.<\/p><p>The theater options are not worthless - they are just answers to different questions. For this threat, none of them changes the outcome. Log the decision in the next Well-Architected Tool review so the security pillar records why.<\/p><p class=\"focus\">Focus next: judge controls by the campaign they stop, not by the activity they create.<\/p>","question":"Drag each proposal into Real reduction or Mostly theater."},{"id":"H28","type":"spot","theme":"Hybrid & data movement","kw":["VPC Flow Logs","NAT egress control","private subnet isolation"],"title":"\"No direct internet,\" they said - the route table disagrees","scenario":"The serving team insists their subnet has no internet path. You pull the route table, the SG, and Flow Logs for the same hour. Three lines together prove them wrong.","artifacts":[{"kind":"code","title":"evidence bundle - serving subnet (tickets KST-9017)","lines":["// route table rtb-serving","10[.]40[.]0[.]0/16 -> local","0[.]0[.]0[.]0/0 -> nat-mlgw-04","// security group sg-serving egress","443 -> 0[.]0[.]0[.]0/0 ALLOW","// flow logs 05:12-05:40 UTC","10[.]40[.]7[.]21 -> 151[.]101[.]1[.]140:443 ACCEPT 214 pkt 178900 bytes","10[.]40[.]7[.]21 -> 10[.]40[.]9[.]10:443 ACCEPT 40 pkt 9800 bytes","10[.]40[.]7[.]21 -> 198[.]51[.]100[.]77:443 ACCEPT 988 pkt 8244001 bytes"]}],"question":"Select the <b>three<\/b> lines that together prove an internet path exists and is in use.","bad":[2,4,8],"hint":"A default route to a NAT, an all-destination SG rule, and a fat accepted flow to a public address - one line per layer.","expl":"<p><b>Line 3 - default route 0[.]0[.]0[.]0/0 to nat-mlgw-04:<\/b> the subnet holds a route to a NAT, which is a managed door to the internet. The \"no internet path\" claim fails at routing.<\/p><p><b>Line 5 - SG egress 443 to any destination:<\/b> nothing in the security group narrows where 443 may go, so the door is wide at the instance layer.<\/p><p><b>Line 9 - 988 packets, 8.2 MB accepted to 198[.]51[.]100[.]77:<\/b> proof in production - real bytes left to a public address. (Line 7 is the same story smaller; line 8 is internal traffic.)<\/p><p>Together: route + permission + observed flow = internet path, no matter what the ticket says. The fix stack: remove the default route, use VPC endpoints, pin SG egress, alert on first-seen public destinations.<\/p><p class=\"focus\">Focus next: \"no internet path\" is a three-layer claim - route, rule, and reality. Verify all three before believing it.<\/p>"},{"id":"H29","type":"order","theme":"Containers & orchestration","kw":["container image scanning","artifact signing & integrity","drift monitoring","Immutable infrastructure","Service Catalog approved patterns"],"title":"Promotion gates - order the model release pipeline","scenario":"A new model container goes from build to full traffic. Six security gates define the promotion. Order them as the pipeline must enforce them.","order":["Scan the container image with Inspector (CVEs and secrets) before it is tagged releasable","Sign the model artifact and the image digest with the release KMS key","Deploy to the canary namespace in the isolated staging account, verifying the signature at admission time","Watch the canary: drift, latency, error rate, and abuse patterns for a full cycle","Promote to production through the GitOps PR that only signed digests can reference","Lock the registry tag and open the Post-incident-ready monitoring dashboards"],"hint":"Inspect, seal, prove at the gate, observe, promote through the only legal path, then freeze and watch.","expl":"<p><b>1 Scan before tagging:<\/b> CVEs and embedded secrets are cheapest to stop before anyone can reference the image.<\/p><p><b>2 Sign artifact and digest:<\/b> signing turns \"this build\" into a verifiable claim; the digest binds content to identity.<\/p><p><b>3 Canary with signature verification at admission:<\/b> the cluster itself refuses unsigned or re-tagged images - the gate is enforced by the platform, not by good intentions.<\/p><p><b>4 Observe the canary:<\/b> drift, latency, errors and abuse patterns earn the promotion; a clean build can still behave badly.<\/p><p><b>5 Promote via GitOps PR:<\/b> production references only signed digests, so promotion is reviewable, auditable and reversible.<\/p><p><b>6 Lock and monitor:<\/b> immutable tags prevent silent replacement; dashboards keep watching after the release.<\/p><p>Ship the whole pipeline as one of your Service Catalog approved patterns, so no team has to reinvent (and weaken) the gates. Signing after deployment, or promoting before observation, breaks the chain of custody the first time someone is in a hurry.<\/p><p class=\"focus\">Focus next: supply-chain security is ordered gates - each one assumes the previous proof exists.<\/p>","question":"Drag the six gates into the order the pipeline must enforce them."},{"id":"H30","type":"fib","theme":"Detect & respond","kw":["GuardDuty","forensics & chain of custody","NIST incident response phases","Config rules"],"title":"Write it up - insert the report keywords","scenario":"The draft of the incident report for the inference-host compromise needs its precise vocabulary. Insert the right terms.","question":"Fill every blank with a word from the bank.","parts":["At 03:12 GuardDuty flagged unusual ",{"b":0}," behavior from the serving role; we ",{"b":1}," the host by tightening its security group while preserving live memory; we preserved ",{"b":2}," with hashed log copies and a custody form; and the ",{"b":3}," review produced a Config rule that now fails any serving subnet with a default internet route."],"blanks":["exfiltration","contained","evidence","post-incident"],"extra":["celebration","terminated","blame","quarterly"],"hint":"What GuardDuty saw, what we did without destroying state, what the hashes protect, and which review follows every incident.","expl":"<p><b>exfiltration<\/b> - naming the behavior precisely (data leaving) matters for scope, notification duties and legal steps.<\/p><p><b>contained<\/b> - containment keeps state; \"terminated\" would have destroyed the memory and the job - the report must show the smarter choice.<\/p><p><b>evidence<\/b> - hashed copies plus chain-of-custody make the data usable in disciplinary or legal follow-ups.<\/p><p><b>post-incident<\/b> - the lessons-learned review converts the incident into the Config guardrail; skipping it is how incident 2 replays incident 1.<\/p><p>\"Blame\" is the opposite of a healthy review culture, and \"quarterly\" review is not the NIST post-incident step.<\/p><p class=\"focus\">Focus next: reports that use the right vocabulary (exfiltration, containment, evidence, post-incident) read as competent - and hold up.<\/p>"}]};
</script>
<script>
(function () {
  'use strict';
  var D = window.EXAM_DATA;
  var META = D.meta;
  var PTS = 10;            // every exercise worth 10 points
  var HINT_COST = 1;       // one hint = -10% of the exercise points

  /* ---------------- helpers ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function shuffle(a) { var r = a.slice(), i, j, t; for (i = r.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
  function fmt(s) { var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + ('0' + m).slice(-2) : String(m)) + ':' + ('0' + x).slice(-2); }
  function trim(s, n) { s = String(s).replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }
  function applyTheme(t) { try { document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); } catch (e) {} }
  function paintSession() {
    var s = S.session, box = document.getElementById('sessline');
    if (!box) return;
    var bits = [];
    if (s) {
      if (s.username) bits.push('Candidate: ' + s.username);
      if (s.country) bits.push('Country: ' + s.country);
      if (s.batch) bits.push('Batch: ' + s.batch);
      if (s.topicId) bits.push('Topic: ' + s.topicId);
      if (s.locale) bits.push('Locale: ' + s.locale);
    }
    if (!bits.length) { box.style.display = 'none'; return; }
    box.textContent = bits.join(' \u00b7 ');
    box.style.display = '';
  }
  function isLocked(rq) { return (rq.status === 'checked' && !rq.revising) || S.over; }

  /* ---------------- state ---------------- */
  var S = { started: false, over: false, cur: 0, tLeft: 0, manual: false, checkPause: false, RQ: [], attempt: 1, reported: false, user: '', tick: null, session: null, parentOrigin: null };

  function buildRuntime() {
    var qs = shuffle(D.exercises);
    S.RQ = qs.map(function (ex) {
      var rq = { ex: ex, status: 'new', earned: null, snap: null, hints: 0, inter: {} };
      TYPES[ex.type].prep(rq);
      return rq;
    });
    S.cur = 0; S.manual = false; S.checkPause = false; S.over = false; S.started = false;
    S.tLeft = META.perQuestionSeconds * S.RQ.length; S.reported = false;
  }

  /* ---------------- chrome ---------------- */
  function buildShell() {
    var root = $('#examroot');
    root.innerHTML = '';
    var head = el('header', 'top');
    head.innerHTML =
      '<div class="brand"><b>' + esc(META.examName) + '</b><small>' + esc(META.title) + ' \u00b7 attempt <span id="att">1</span></small></div>' +
      '<div class="tstats">' +
      '<span class="chipstat" id="time" title="Time left"><span class="ic">\u23f1</span><span id="timetxt">' + fmt(S.tLeft) + '</span></span>' +
      '<span class="chipstat" title="Live score"><span class="ic">\u2b50</span><span id="scoretxt">0 pts</span></span>' +
      '<span class="chipstat" title="Progress"><span class="ic">\u2699</span><span id="progtxt">0 / ' + S.RQ.length + '</span></span>' +
      '<button class="btn ghost" id="pausebtn" aria-pressed="false" title="Manual pause (hides the exercise)"><span class="em">\u23f8</span> Pause</button>' +
      '</div>';
    root.appendChild(head);
    root.appendChild(el('div', 'pauseind', '<span class="pi manual" id="piman">\u23f8 Paused (manual)</span><span class="pi review" id="pirev">\u23f8 Timer paused \u2014 review mode</span>'));
    root.appendChild(el('div', 'pibar', '<i id="pibarfill"></i>'));
    root.appendChild(el('div', '', '<div id="pausednote" style="display:none;text-align:center;border:1px solid var(--bad);background:rgba(248,113,113,.08);border-radius:12px;padding:18px;font-weight:700;font-size:17px">\u23f8 Paused \u2014 the exercise is hidden. Press <span style="color:var(--acc)">Resume</span> in the header to continue.</div>'));
    var nav = el('div', 'navwrap');
    nav.appendChild(el('div', 'blabel2', 'QUESTION NAVIGATOR \u2014 click any number to jump (allowed until the exam ends)'));
    nav.appendChild(el('div', 'navgrid', '', )).id = 'navgrid';
    nav.appendChild(el('div', 'navlegend',
      '<span><i style="background:#0c1a33"></i> not answered</span>' +
      '<span><i style="background:#14532d"></i> checked, full</span>' +
      '<span><i style="background:#78350f"></i> checked, partial</span>' +
      '<span><i style="background:#7f1d1d"></i> checked, zero</span>' +
      '<span><i style="background:#3f3206;border-style:dashed"></i> skipped</span>'));
    root.appendChild(nav);
    var main = el('main'); main.id = 'qarea'; main.setAttribute('tabindex', '-1');
    root.appendChild(main);
    var foot = el('div', 'qfoot'); foot.id = 'qfoot';
    foot.innerHTML = '<div class="grp">' +
      '<button class="btn" id="bprev"><span class="em">\u2190</span> Prev</button>' +
      '<button class="btn primary" id="bcheck"><span class="em">\u2713</span> Check</button>' +
      '<button class="btn" id="brevise"><span class="em">\u270e</span> Revise</button>' +
      '<button class="btn warn" id="bhint"><span class="em">\u2753</span> Hint \u22121 pt</button>' +
      '<button class="btn" id="bskip"><span class="em">\u21e5</span> Skip</button>' +
      '<button class="btn" id="bnext">Next <span class="em">\u2192</span></button>' +
      '</div><div class="grp"><button class="btn go" id="bsubmit"><span class="em">\u25b7</span> Submit exam</button></div>';
    root.appendChild(foot);
    root.appendChild(el('div', 'sronly', '')).setAttribute('aria-live', 'polite');
    $$('.sronly', root)[0].id = 'live';

    var modal = el('div', 'modal'); modal.id = 'modal';
    modal.innerHTML = '<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Submit this attempt?</h3><div id="mbody" style="font-size:14.5px;color:var(--mut)"></div>' +
      '<div class="grp" style="margin-top:14px"><button class="btn" id="mcancel">Keep working</button><button class="btn go" id="mok">Submit now</button></div></div>';
    root.appendChild(modal);

    $('#bprev').onclick = function () { goto(S.cur - 1); };
    $('#bnext').onclick = function () { goto(S.cur + 1); };
    $('#bcheck').onclick = onCheck;
    $('#brevise').onclick = onRevise;
    $('#bhint').onclick = onHint;
    $('#bskip').onclick = onSkip;
    $('#bsubmit').onclick = askSubmit;
    $('#pausebtn').onclick = toggleManual;
    $('#mcancel').onclick = function () { $('#modal').classList.remove('show'); };
    $('#mok').onclick = function () { $('#modal').classList.remove('show'); finish('submit'); };
  }

  function toggleManual() {
    if (S.over) return;
    S.manual = !S.manual;
    $('#pausebtn').setAttribute('aria-pressed', S.manual ? 'true' : 'false');
    $('#pausebtn').innerHTML = S.manual ? '<span class="em">\u25b6</span> Resume' : '<span class="em">\u23f8</span> Pause';
    renderQ();
  }

  function pauseVisual() {
    var q = $('#qarea'), f = $('#qfoot');
    var hide = S.manual;
    if (q) { q.classList.toggle('blurred', hide); try { q.inert = hide; } catch (e) { q.setAttribute('inert', hide ? '' : 'x'); } }
    if (f) { f.classList.toggle('blurred', hide); try { f.inert = hide; } catch (e) { f.setAttribute('inert', hide ? '' : 'x'); } }
    var pn = document.getElementById('pausednote');
    if (pn) pn.style.display = hide ? '' : 'none';
    $('#piman').classList.toggle('show', S.manual);
    $('#pirev').classList.toggle('show', S.checkPause);
  }

  /* ---------------- timer ---------------- */
  function tickBody() {
    if (!S.started || S.over || S.manual || S.checkPause) return false;
    S.tLeft--;
    paintTime();
    if (S.tLeft <= 0) { finish('time'); return true; }
    return true;
  }
  function startTimer() {
    if (S.tick) clearInterval(S.tick);
    S.tick = setInterval(tickBody, 1000);
  }
  function paintTime() {
    var t = $('#timetxt'); if (!t) return;
    t.textContent = fmt(Math.max(0, S.tLeft));
    var c = $('#time');
    c.classList.toggle('low', S.tLeft <= 300 && S.tLeft > 60);
    c.classList.toggle('crit', S.tLeft <= 60);
  }

  /* ---------------- header paints ---------------- */
  function paintHeader() {
    var earned = 0, done = 0;
    S.RQ.forEach(function (r) {
      if (r.status === 'checked') { earned += r.earned; done++; }
      else if (r.status === 'skipped') { done++; }
    });
    $('#scoretxt').textContent = (Math.round(earned * 10) / 10) + ' pts';
    $('#progtxt').textContent = done + ' / ' + S.RQ.length;
    $('#pibarfill').style.width = (done / S.RQ.length * 100) + '%';
    paintTime();
  }

  function paintNav() {
    var g = $('#navgrid'); g.innerHTML = '';
    S.RQ.forEach(function (r, i) {
      var b = el('button', 'nbtn', String(i + 1));
      b.type = 'button';
      var lab = 'Question ' + (i + 1) + ': ' + r.ex.title;
      if (r.status === 'checked') {
        var la = r.snap.ratio >= 1 ? 'full' : r.snap.ratio > 0 ? 'partial' : 'zero';
        b.classList.add(la === 'full' ? 'st-ok' : la === 'partial' ? 'st-part' : 'st-bad');
        lab += ' \u2014 checked, ' + la + ' (' + r.earned + '/' + PTS + ' pts)';
      } else if (r.status === 'skipped') { b.classList.add('st-skip'); lab += ' \u2014 skipped'; }
      if (i === S.cur) { b.classList.add('cur'); lab += ' \u2014 current'; }
      b.setAttribute('aria-label', lab);
      b.title = r.ex.title;
      b.onclick = function () { goto(i); };
      g.appendChild(b);
    });
  }

  /* ---------------- navigation ---------------- */
  function goto(i) {
    if (i < 0 || i >= S.RQ.length || S.over) return;
    if (i !== S.cur) {
      S.checkPause = false;   // leaving review mode resumes the timer
      var cr = S.RQ[S.cur]; if (cr) cr.revising = false;   // abandoning a revise keeps the last grade
    }
    S.cur = i;
    renderQ();
    var h = $('#qarea'); if (h) h.focus({ preventScroll: false });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---------------- footer actions ---------------- */
  function onCheck() {
    if (S.over) return;
    var rq = S.RQ[S.cur];
    if (S.manual) return;
    if (rq.status === 'checked' && !rq.revising) return;
    if (rq.ex.type === 'branch' && !rq.inter.fin) {
      $('#live').textContent = 'Answer every step of the scenario before pressing Check.';
      var b = $('.block.answers'); if (b) { b.style.boxShadow = '0 0 0 2px var(--warn)'; setTimeout(function () { b.style.boxShadow = ''; }, 900); }
      return;
    }
    var snap = TYPES[rq.ex.type].check(rq);
    rq.snap = snap;
    rq.earned = Math.max(0, Math.round((snap.ratio * PTS - rq.hints * HINT_COST) * 10) / 10);
    rq.status = 'checked';
    rq.revising = false;
    S.checkPause = true;                     // Check-pause: content stays visible, clock frozen
    renderQ();
    $('#live').textContent = 'You earned ' + rq.earned + ' of ' + PTS + ' points. Timer paused in review mode; press Next to continue.';
  }

  function onRevise() {
    if (S.over) return;
    var rq = S.RQ[S.cur];
    if (rq.status !== 'checked' || rq.revising) return;
    rq.revising = true;                      // grade stays until the exercise is re-checked
    if (rq.ex.type === 'branch') { TYPES.branch.prep(rq); }   // branch scenarios restart when revised
    renderQ();
  }

  function onHint() {
    if (S.over || S.manual) return;
    var rq = S.RQ[S.cur];
    if (rq.status === 'checked') return;
    if (rq.hints >= 1) return;
    rq.hints++;
    renderQ();
    $('#live').textContent = 'Hint revealed. This exercise loses 1 point (10 percent) when checked.';
  }

  function onSkip() {
    if (S.over) return;
    var rq = S.RQ[S.cur];
    if (rq.status === 'checked') return;
    rq.status = 'skipped';
    if (S.cur < S.RQ.length - 1) { S.checkPause = false; S.cur++; renderQ(); }
    else { renderQ(); }
  }

  function hasAnswer(rq) {
    var it = rq.inter;
    switch (rq.ex.type) {
      case 'choice': return it.picked != null;
      case 'multi': return Object.keys(it.picked).length > 0;
      case 'fib': return it.placed.some(function (p) { return p != null; });
      case 'spot': return Object.keys(it.sel).length > 0;
      case 'classify': return Object.keys(it.place).some(function (k) { return it.place[k] != null; });
      case 'order': return !!it.touched;
      case 'terminal': return !!(it.text && it.text.trim());
      case 'branch': return it.dec.some(function (d) { return d; });
    }
    return false;
  }

  function askSubmit() {
    if (S.over) return;
    var skipped = 0, unanswered = 0, counted = 0;
    S.RQ.forEach(function (r) {
      if (r.status === 'skipped') skipped++;
      else if (r.status === 'checked') counted++;
      else if (hasAnswer(r)) unanswered++;
      else unanswered++;
    });
    var answeredOrChecked = counted + S.RQ.filter(function (r) { return r.status !== 'skipped' && r.status !== 'checked' && hasAnswer(r); }).length;
    if (answeredOrChecked === 0) {
      $('#mbody').innerHTML = '<p><b style="color:var(--warn)">\u26a0 You have not answered any exercise.</b></p><p>Answer at least one exercise before submitting \u2014 skipped and empty exercises are excluded from scoring.</p><div class="grp" style="margin-top:12px;display:flex;gap:9px;justify-content:flex-end"><button class="btn" id="mx">Back to the exam</button></div>';
      $('#modal').classList.add('show');
      $('#mx').onclick = function () { $('#modal').classList.remove('show'); };
      return;
    }
    $('#mbody').innerHTML = '<ul>' +
      '<li><b>' + counted + '</b> exercise(s) checked and counted.</li>' +
      '<li><b>' + S.RQ.filter(function (r) { return r.status !== 'skipped' && r.status !== 'checked' && hasAnswer(r); }).length + '</b> answered but not Checked \u2014 they will be graded now, with no review pause.</li>' +
      '<li><b>' + skipped + '</b> skipped and <b>' + S.RQ.filter(function (r) { return r.status !== 'skipped' && r.status !== 'checked' && !hasAnswer(r); }).length + '</b> empty exercise(s) will be <b>excluded</b> from the score (removed from both points earned and points possible).</li>' +
      '</ul><p>The timer will stop and your result will be recorded for this attempt.</p>';
    $('#modal').classList.add('show');
    $('#mok').focus();
  }

  /* ---------------- results ---------------- */
  function finish(why) {
    if (S.over) return;
    S.over = true;
    S.checkPause = false; S.manual = false;
    if (S.tick) clearInterval(S.tick);
    // grade answered-but-unchecked exercises silently
    S.RQ.forEach(function (r) {
      if (r.status !== 'checked' && r.status !== 'skipped' && hasAnswer(r)) {
        var snap = TYPES[r.ex.type].check(r);
        r.snap = snap;
        r.earned = Math.max(0, Math.round((snap.ratio * PTS - r.hints * HINT_COST) * 10) / 10);
        r.status = 'checked';
      }
    });
    renderResults(why);
  }

  function reportScore(correct, total) {
    var percent = Math.round((correct / total) * 100);
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: META.topicId,
        score: correct,
        total: total,
        percent: percent,
        passed: percent >= META.passMark
      }, S.parentOrigin || location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  function renderResults(why) {
    var counted = [], skipped = [], excluded = [];
    S.RQ.forEach(function (r) {
      if (r.status === 'skipped') skipped.push(r);
      else if (r.status === 'checked') counted.push(r);
      else excluded.push(r);
    });
    var earned = counted.reduce(function (a, r) { return a + r.earned; }, 0);
    var possible = counted.length * PTS;
    var pct = possible > 0 ? Math.round(earned / possible * 100) : 0;
    var passed = possible > 0 && pct >= META.passMark;
    // report on the site's scale: total = answered exercises, score = points scaled to 1 pt per exercise
    var scoreR = Math.min(counted.length, Math.round(earned / PTS)), totalR = counted.length;

    var root = $('#examroot');
    root.innerHTML = '';
    var box = el('section', 'res');
    var h = el('h2', null, (why === 'time' ? '\u23f1 Time is up \u2014 final results' : '\u25b7 Final results'));
    h.style.marginTop = '0';
    box.appendChild(h);

    var rr = el('div', 'ringrow');
    var R = 62, C = 2 * Math.PI * R;
    var off = C * (1 - Math.min(1, pct / 100));
    var ringCol = passed ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)';
    rr.innerHTML =
      '<div class="ring" role="img" aria-label="Final score ' + pct + ' percent">' +
      '<svg width="150" height="150" viewBox="0 0 150 150">' +
      '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="#12233f" stroke-width="13"/>' +
      '<circle cx="75" cy="75" r="' + R + '" fill="none" stroke="' + ringCol + '" stroke-width="13" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '"/>' +
      '</svg><div class="rv"><b style="color:' + ringCol + '">' + pct + '%</b><span>' + (Math.round(earned * 10) / 10) + ' / ' + possible + ' pts</span></div></div>' +
      '<div class="verdict"><h2 class="' + (passed ? 'v-pass' : 'v-fail') + '">' + (passed ? '\u2705 PASS \u2014 well done' : '\u274c FAIL \u2014 you must retake it') + '</h2>' +
      '<p>Counted exercises: <b>' + counted.length + '</b> of ' + S.RQ.length + ' \u00b7 skipped: <b>' + skipped.length + '</b> \u00b7 empty: <b>' + excluded.length + '</b> (skipped and empty exercises are excluded from both the earned and the possible points). Pass mark: <b>' + META.passMark + '%</b>.</p>' +
      (passed
        ? '<div class="certpanel">\u2713 <b>Certificate-style success panel</b><br>You reached ' + pct + '% on the ' + esc(META.severity.toUpperCase()) + ' practice exam for \u201c' + esc(META.chapterLabel) + '\u201d. Your result was recorded for attempt ' + S.attempt + '.' + (S.user ? ' Great work, ' + esc(S.user) + '.' : '') + '</div>'
        : '<div class="certpanel" style="border-color:var(--bad);background:rgba(248,113,113,.07)">\u2716 You scored ' + pct + '%, below the ' + META.passMark + '% pass mark. Review the report below \u2014 each wrong item explains what to focus on \u2014 then press <b>Retake exam</b>. Questions and answers are reshuffled on every attempt.</div>') +
      '</div>';
    box.appendChild(rr);

    // per-theme progress
    var themes = {};
    counted.forEach(function (r) {
      var t = r.ex.theme;
      if (!themes[t]) themes[t] = { e: 0, p: 0 };
      themes[t].e += r.earned; themes[t].p += PTS;
    });
    skipped.forEach(function (r) { if (!themes[r.ex.theme]) themes[r.ex.theme] = { e: 0, p: 0 }; });
    var tkeys = Object.keys(themes);
    if (tkeys.length) {
      var tg = el('div', 'themebars');
      tkeys.sort().forEach(function (k) {
        var p = themes[k].p > 0 ? Math.round(themes[k].e / themes[k].p * 100) : 0;
        var d = el('div', 'tbar');
        d.innerHTML = '<div class="trow1"><span>' + esc(k) + '</span><span>' + (Math.round(themes[k].e * 10) / 10) + ' / ' + themes[k].p + '</span></div>' +
          '<div class="track"><i style="width:' + p + '%"></i></div>';
        tg.appendChild(d);
      });
      box.appendChild(el('h3', null, 'Per-theme progress')).style.margin = '16px 0 2px';
      box.appendChild(tg);
    }

    // skipped note
    if (skipped.length || excluded.length) {
      var names = skipped.concat(excluded).map(function (r) { return '#' + (S.RQ.indexOf(r) + 1) + ' ' + esc(trim(r.ex.title, 46)); }).join(' \u00b7 ');
      box.appendChild(el('div', 'skipnote', '<b>\u26a0 Excluded from scoring:</b> ' + names + '<br>These exercises were skipped or left empty, so their points are not in your total.'));
    }

    // per-exercise report
    box.appendChild(el('h3', null, 'Detailed report \u2014 every exercise')).style.margin = '18px 0 2px';
    var tbl = el('table', 'rtable');
    tbl.innerHTML = '<thead><tr><th>#</th><th>Exercise</th><th>Result</th><th>Details</th></tr></thead>';
    var tb = el('tbody');
    S.RQ.forEach(function (r, i) {
      var tr = el('tr');
      var lab, lcls;
      if (r.status === 'skipped') { lab = 'skipped (not counted)'; lcls = 'skipped'; }
      else if (r.status === 'checked') {
        var la = r.snap.ratio >= 1 ? 'full' : r.snap.ratio > 0 ? 'partial' : 'zero';
        lab = la + ' \u00b7 ' + r.earned + '/' + PTS; lcls = la;
      } else { lab = 'not answered (not counted)'; lcls = 'skipped'; }
      var det = '<div class="rd"><b>Your answer:</b> ' + (r.snap && r.snap.summary ? r.snap.summary : '\u2014') + '</div>' +
        '<div class="rd"><b>Correct:</b> ' + (r.snap && r.snap.correctSummary ? r.snap.correctSummary : esc(TYPES[r.ex.type].correctText(r))) + '</div>' +
        '<details class="rdetails"><summary>\u2139 Why \u2014 explanation</summary><div class="rd">' + r.ex.expl + '</div></details>';
      tr.innerHTML = '<td class="rn">' + (i + 1) + '</td>' +
        '<td><b>' + esc(trim(r.ex.title, 60)) + '</b><br><span style="font-size:12px;color:var(--dim)">' + esc(r.ex.theme) + ' \u00b7 ' + esc(r.ex.type) + (r.hints ? ' \u00b7 hint used (\u22121)' : '') + '</span></td>' +
        '<td><span class="plabel ' + lcls + '">' + (lcls === 'full' ? '\u2713 ' : lcls === 'zero' ? '\u2717 ' : lcls === 'partial' ? '\u26a0 ' : '\u21e5 ') + lab + '</span></td>' +
        '<td class="rdetails-cell">' + det + '</td>';
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    box.appendChild(tbl);

    var btns = el('div', 'grp');
    btns.style.cssText = 'display:flex;gap:10px;margin-top:16px;flex-wrap:wrap';
    var rb = el('button', 'btn primary', '<span class="em">\u21ba</span> Retake exam');
    rb.onclick = retake;
    btns.appendChild(rb);
    box.appendChild(btns);
    root.appendChild(box);
    window.scrollTo({ top: 0, behavior: 'auto' });

    // report the score to the site exactly once per completed attempt
    if (!S.reported && counted.length > 0) {
      S.reported = true;
      reportScore(scoreR, totalR);
    }
  }

  function retake() {
    S.attempt++;
    buildRuntime();
    buildShell();          // results screen cleared the chrome - rebuild header, navigator, footer
    $('#att').textContent = S.attempt;
    renderIntro();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }


  /* ---------------- intro ---------------- */
  function renderIntro() {
    S.started = false;
    paintHeader();
    var root = $('#examroot');
    // keep chrome, replace question area content
    var q = $('#qarea');
    q.innerHTML = '';
    q.classList.remove('blurred');
    $('#qfoot').classList.remove('blurred');
    $('#piman').classList.remove('show'); $('#pirev').classList.remove('show');
    var pn0 = document.getElementById('pausednote'); if (pn0) pn0.style.display = 'none';

    var hero = el('section', 'hero');
    hero.innerHTML =
      '<span class="sev ' + META.severity + '">' + (META.severity === 'medium' ? '\u2699 MEDIUM severity' : '\u26a1 HARD severity') + '</span>' +
      '<h1 style="margin-top:10px">' + esc(META.examName) + '</h1>' +
      '<p class="sub">' + esc(META.introTag) + '</p>' +
      '<div class="metagrid">' +
      '<div class="mg"><b>' + S.RQ.length + '</b><span>scenario-based exercises</span></div>' +
      '<div class="mg"><b>' + fmt(S.tLeft) + '</b><span>time limit (' + META.perQuestionSeconds + 's per exercise)</span></div>' +
      '<div class="mg"><b>' + META.passMark + '%</b><span>pass mark</span></div>' +
      '<div class="mg"><b>' + PTS + '</b><span>points per exercise</span></div>' +
      '</div>' +
      '<span id="greet" style="color:var(--acc2);font-weight:600"></span><br><span class="sessline" id="sessline" style="display:none"></span>';
    q.appendChild(hero);          // attach first: #greet / #sessline only exist in the document after this
    if (S.user) $('#greet').textContent = 'Ready, ' + S.user + ' \u2014 good luck.';
    paintSession();

    var rules = el('div', 'rules');
    var n = el('div', 'rulecard', '<h3>\u25b8 How this exam works</h3><p>' + META.introSev + '</p>');
    rules.appendChild(n);
    rules.appendChild(el('div', 'rulecard', '<h3>\u2713 Check \u2014 grade, lock, review pause</h3><p>Press <b>Check</b> to grade the current exercise. Every element is marked green (correct), red (wrong) or amber (partial / missed). Your answer is then <b>locked</b> for scoring, the <b>timer pauses</b> in \u201creview mode\u201d and the explanation opens \u2014 the exercise stays fully visible so you can learn from it. The clock resumes <b>only when you press Next</b>.</p>'));
    rules.appendChild(el('div', 'rulecard', '<h3>\u23f8 Two different pauses</h3><p><b>Manual Pause</b> blurs and hides the exercise while the clock is frozen \u2014 resume with the same button. <b>Check-pause</b> keeps everything visible for review and ends only on <b>Next</b>. They can stack; the timer runs only when both are cleared.</p>'));
    rules.appendChild(el('div', 'rulecard', '<h3>\u21e5 Skip, return, partial credit</h3><p><b>Skip</b> jumps on without grading (amber marker in the navigator). You can return to any exercise until the timer ends \u2014 pressing Check there removes the skip. Skipped and empty exercises are <b>excluded from scoring</b> (removed from both numerator and denominator). Multi-answer exercises give <b>partial credit per correct element</b>; wrong picks neither subtract nor earn.</p>'));

  /* ---------------- question rendering ---------------- */

  function fbPanel(rq) {

      '<div class="fline" style="color:var(--acc2)"><b>\u23f8 Timer paused \u2014 review mode.</b> The clock resumes when you press <b>Next</b>.</div>' +
      '<details class="expl" open><summary>\u2139 Why \u2014 explanation</summary><div class="xbody">' + rq.ex.expl + '</div></details>';

  /* ---------------- artifacts ---------------- */
  function artifactEl(a, rq) {
    if (a.kind === 'note') { return el('div', 'block', '<div class="blabel">\u2630 ' + esc(a.title || 'NOTE') + '</div><div class="btext">' + a.html + '</div>'); }
    var clickable = rq.ex.type === 'spot';
    var box = el('div', 'logview');
    var head = el('div', 'loghead');
    head.innerHTML = '<b>' + (a.kind === 'log' ? '\u2261 ' : '\u2261 ') + esc(a.title) + '</b>';
    var body = el('div', 'logbody');
    var rows = [];
    a.lines.forEach(function (ln, i) {
      var row = el('div', 'logline');
      row.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="lt" style="flex:1;word-break:break-all">' + esc(ln) + '</span>';
      if (clickable) {
        var b = el('button', '');
        b.className = 'logline';
        b.type = 'button';
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('aria-label', 'Line ' + (i + 1) + (rq.inter.sel && rq.inter.sel[i] ? ', selected' : ', not selected'));
        b.innerHTML = '<span class="ln">' + (i + 1) + '</span><span class="lt" style="flex:1;word-break:break-all">' + esc(ln) + '</span><span class="mkslot"></span>';
        b.onclick = function () {
          if (isLocked(rq)) return;
          rq.inter.sel[i] = !rq.inter.sel[i];
          if (!rq.inter.sel[i]) delete rq.inter.sel[i];
          paintSpotSel(rq);
          rq.inter.touched = true;
        };
        row = b;
        if (rq.inter.sel && rq.inter.sel[i]) b.classList.add('sel');
      }
      rows.push(row);
      body.appendChild(row);
    });
    if (a.filter) {
      var fl = el('div', 'fl');
      fl.innerHTML = '<span class="logcount" id="lcount">' + a.lines.length + ' / ' + a.lines.length + ' lines</span>';
      var inp = el('input');
      inp.type = 'text';
      inp.placeholder = 'filter lines (like Kibana)';
      inp.setAttribute('aria-label', 'Filter log lines');
      inp.value = rq.inter.fv || '';
      inp.oninput = function () {
        rq.inter.fv = inp.value;
        var v = inp.value.toLowerCase();
        var n = 0;
        rows.forEach(function (r, i) {
          var hit = !v || a.lines[i].toLowerCase().indexOf(v) >= 0;
          r.style.display = hit ? '' : 'none';
          if (hit) n++;
        });
        var c = document.getElementById('lcount') || $('.logcount', head);
        if (c) c.textContent = n + ' / ' + a.lines.length + ' lines';
      };
      fl.appendChild(inp);
      head.appendChild(fl);
    }
    box.appendChild(head);
    box.appendChild(body);
    if (clickable && rq.snap) paintSpotMarks(rq, rows, a);
    else if (clickable) {
      var c2 = $('#selspot');
      if (c2) c2.textContent = String(Object.keys(rq.inter.sel).length);
    }
    return box;
  }

  function paintSpotSel(rq) {
    $$('#qarea .logline').forEach(function (b, i) {
      var on = !!rq.inter.sel[i];
      b.classList.toggle('sel', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var c = document.getElementById('selspot');
    if (c) c.textContent = String(Object.keys(rq.inter.sel).length);
  }
  function paintSpotMarks(rq, rows, a) {
    var bad = rq.ex.bad;
    rows.forEach(function (r, i) {
      r.classList.add('logline');
      var sel = !!rq.inter.sel[i], isBad = bad.indexOf(i) >= 0;
      var slot = $('.mkslot', r);
      if (sel && isBad) { r.classList.add('mk-ok'); if (slot) slot.innerHTML = '<span class="mktag tag-ok">\u2713 caught</span>'; }
      else if (sel && !isBad) { r.classList.add('mk-bad'); if (slot) slot.innerHTML = '<span class="mktag tag-bad">\u2717 clean line</span>'; }
      else if (!sel && isBad) { r.classList.add('mk-miss'); if (slot) slot.innerHTML = '<span class="mktag tag-warn">\u26a0 missed</span>'; }
    });
  }

  /* ---------------- exercise types ---------------- */
  var TYPES = {};

  /* ----- choice ----- */
  TYPES.choice = {
    prep: function (rq) { rq.inter.perm = shuffle(rq.ex.choices.map(function (_, i) { return i; })); rq.inter.picked = null; },
    correctText: function (rq) { return trim(rq.ex.choices[rq.ex.correct], 90); },
    body: function (rq, host) {
      var ex = rq.ex, it = rq.inter;

      it.perm.forEach(function (oi, pos) {
        var b = el('button', 'opt');

        b.setAttribute('role', 'radio');

        b.innerHTML = '<span class="okey">' + String.fromCharCode(65 + pos) + '</span><span class="otext">' + ex.choices[oi] + '</span><span class="mkslot"></span>';
        b.onclick = function () {
          if (isLocked(rq)) return;
          it.picked = oi;
          $$('.opt', w).forEach(function (x) { x.classList.remove('on'); x.setAttribute('aria-checked', 'false'); });
          b.classList.add('on'); b.setAttribute('aria-checked', 'true');
        };
        if (it.picked === oi) b.classList.add('on');
        if (rq.snap) {
          if (oi === ex.correct) { b.classList.add('mk-ok'); $('.mkslot', b).innerHTML = '<span class="mktag tag-ok">\u2713 correct answer</span>'; }
          else if (it.picked === oi) { b.classList.add('mk-bad'); $('.mkslot', b).innerHTML = '<span class="mktag tag-bad">\u2717 your pick</span>'; }
        }
        w.appendChild(b);
      });
      host.appendChild(w);
    },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var ok = it.picked === ex.correct;
      return {
        ratio: ok ? 1 : 0,
        summary: it.picked == null ? '\u2014 nothing chosen' : '\u201c' + trim(ex.choices[it.picked], 90) + '\u201d',
        correctSummary: '\u201c' + trim(ex.choices[ex.correct], 90) + '\u201d'
      };
    }
  };

  /* ----- multi ----- */
  TYPES.multi = {
    prep: function (rq) { rq.inter.perm = shuffle(rq.ex.choices.map(function (_, i) { return i; })); rq.inter.picked = {}; },
    correctText: function (rq) { return rq.ex.correct.map(function (i) { return '\u201c' + trim(rq.ex.choices[i], 70) + '\u201d'; }).join('; '); },
    body: function (rq, host) {
      var ex = rq.ex, it = rq.inter;
      var w = el('div', 'opts');
      it.perm.forEach(function (oi, pos) {
        var b = el('button', 'opt');
        b.type = 'button';
        b.setAttribute('role', 'checkbox');
        b.setAttribute('aria-checked', it.picked[oi] ? 'true' : 'false');
        b.innerHTML = '<span class="okey">' + (it.picked[oi] ? '\u2611' : '\u2610') + '</span><span class="otext">' + ex.choices[oi] + '</span><span class="mkslot"></span>';
        b.onclick = function () {
          if (isLocked(rq)) return;
          if (it.picked[oi]) delete it.picked[oi]; else it.picked[oi] = true;
          $('.okey', b).textContent = it.picked[oi] ? '\u2611' : '\u2610';
          b.classList.toggle('on', !!it.picked[oi]);
          b.setAttribute('aria-checked', it.picked[oi] ? 'true' : 'false');
        };
        if (it.picked[oi]) b.classList.add('on');
        if (rq.snap) {
          var isC = ex.correct.indexOf(oi) >= 0;
          if (isC && it.picked[oi]) { b.classList.add('mk-ok'); $('.mkslot', b).innerHTML = '<span class="mktag tag-ok">\u2713 you got it</span>'; }
          else if (!isC && it.picked[oi]) { b.classList.add('mk-bad'); $('.mkslot', b).innerHTML = '<span class="mktag tag-bad">\u2717 wrong pick</span>'; }
          else if (isC && !it.picked[oi]) { b.classList.add('mk-miss'); $('.mkslot', b).innerHTML = '<span class="mktag tag-warn">\u26a0 missed</span>'; }
        }
        w.appendChild(b);
      });
      host.appendChild(w);
    },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var hits = ex.correct.filter(function (i) { return it.picked[i]; });
      var pickedKeys = Object.keys(it.picked).map(Number);
      return {
        ratio: ex.correct.length ? hits.length / ex.correct.length : 0,
        summary: pickedKeys.length ? pickedKeys.sort().map(function (i) { return '\u201c' + trim(ex.choices[i], 60) + '\u201d'; }).join('; ') : '\u2014 nothing selected',
        correctSummary: ex.correct.map(function (i) { return '\u201c' + trim(ex.choices[i], 60) + '\u201d'; }).join('; ')
      };
    }
  };

  /* ----- fib ----- */
  TYPES.fib = {
    prep: function (rq) {
      var ex = rq.ex;
      rq.inter.placed = ex.blanks.map(function () { return null; });
      rq.inter.words = shuffle(ex.blanks.concat(ex.extra || []));
      rq.inter.target = null;
    },
    correctText: function (rq) { return rq.ex.blanks.join(' \u00b7 '); },
    body: function (rq, host) {
      var ex = rq.ex, it = rq.inter;
      var sent = el('div', 'fib-sent');
      ex.parts.forEach(function (p) {
        if (typeof p === 'string') { sent.appendChild(el('span', null, p)); return; }
        var bi = p.b;
        var b = el('button', 'fibb');
        b.type = 'button';
        b.dataset.b = bi;
        var w = it.placed[bi];
        b.textContent = w == null ? '\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7\u00b7' : it.words[w];
        if (w != null) b.classList.add('filled');
        if (it.target === bi) b.classList.add('target');
        b.onclick = function () {
          if (isLocked(rq)) return;
          if (it.placed[bi] != null) { it.placed[bi] = null; }
          else { it.target = (it.target === bi ? null : bi); }
          renderFib(rq, host);
        };
        if (rq.snap) {
          var good = it.placed[bi] != null && it.words[it.placed[bi]] === ex.blanks[bi];
          b.classList.add(good ? 'mk-ok' : 'mk-bad');
          if (!good) {
            var ans = el('span', 'fibans', 'answer: ' + ex.blanks[bi]);
            b.appendChild(document.createElement('br'));
            b.appendChild(ans);
          }
        }
        sent.appendChild(b);
      });
      host.appendChild(sent);
      var bank = el('div', 'bankwords');
      bank.setAttribute('aria-label', 'Word bank');
      it.words.forEach(function (wd, wi) {
        var used = it.placed.indexOf(wi) >= 0;
        var c = el('button', 'wchip');
        c.type = 'button';
        c.textContent = wd;
        c.disabled = used && !rq.snap;
        if (rq.snap) {
          var correctHere = ex.blanks.indexOf(wd) >= 0;
          if (used && correctHere) c.classList.add('mk-ok');
          else if (used && !correctHere) c.classList.add('mk-bad');
        }
        c.onclick = function () {
          if (isLocked(rq)) return;
          if (it.placed.indexOf(wi) >= 0) return;
          var bi = (it.target != null && it.placed[it.target] == null) ? it.target : it.placed.indexOf(null);
          if (bi < 0) return;
          it.placed[bi] = wi;
          it.target = null;
          renderFib(rq, host);
        };
        bank.appendChild(c);
      });
      host.appendChild(bank);
    },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var rights = 0;
      var got = [], want = [];
      ex.blanks.forEach(function (ans, bi) {
        want.push(ans);
        if (it.placed[bi] != null && it.words[it.placed[bi]] === ans) { rights++; got.push(ans); }
        else got.push(it.placed[bi] != null ? it.words[it.placed[bi]] + ' (\u2717)' : '\u2014');
      });
      return {
        ratio: rights / ex.blanks.length,
        summary: got.map(esc).join(' \u00b7 '),
        correctSummary: want.map(esc).join(' \u00b7 ')
      };
    }
  };
  function renderFib(rq, host) {
    host.innerHTML = '';
    var ab2 = el('div', 'blabel', '\u270d ' + TYPE_LABEL.fib.a);
    host.appendChild(ab2);
    TYPES.fib.body(rq, host);
  }

  /* ----- spot ----- */
  TYPES.spot = {
    prep: function (rq) { rq.inter.sel = {}; },
    correctText: function (rq) { return 'Lines ' + rq.ex.bad.map(function (i) { return i + 1; }).join(', '); },
    body: function (rq, host) {
      host.appendChild(el('div', 'btext', 'Click every line that matches the question above, then press <b>Check</b>. Use the filter box to search like in Kibana or Splunk. Selected: <b id="selspot">' + Object.keys(rq.inter.sel).length + '</b>'));
    },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var hits = ex.bad.filter(function (i) { return it.sel[i]; });
      var selKeys = Object.keys(it.sel).map(Number).sort(function (a, b) { return a - b; });
      return {
        ratio: ex.bad.length ? hits.length / ex.bad.length : 0,
        summary: selKeys.length ? 'Lines ' + selKeys.map(function (i) { return i + 1; }).join(', ') : '\u2014 nothing selected',
        correctSummary: 'Lines ' + ex.bad.map(function (i) { return (i + 1) + ' (\u201c' + trim(ex.artifacts[0].lines[i], 60) + '\u201d)'; }).join(', ')
      };
    }
  };

  /* ----- classify / match ----- */
  function dndPrep(rq) {
    rq.inter.place = {};
    rq.inter.order = shuffle(rq.ex.items.map(function (_, i) { return i; }));
    rq.inter.sel = null;
  }
  function renderDnd(rq, host) {
    var ex = rq.ex, it = rq.inter;
    host.innerHTML = '';
    var ab2 = el('div', 'blabel', '\u270d ' + TYPE_LABEL[ex.type].a);
    host.appendChild(ab2);
    var w = el('div', 'dnd' + (ex.type === 'match' ? ' match' : ''));
    var bank = el('div', 'bank');
    bank.appendChild(el('div', 'blabel2', ex.type === 'match' ? 'DESCRIPTIONS TO PAIR' : 'ITEM POOL'));
    var bl = el('div', 'banklist');
    var any = false;
    it.order.forEach(function (ii) {
      if (it.place[ii] != null) return;
      any = true;
      bl.appendChild(dndChip(rq, ii, host));
    });
    if (!any) bl.appendChild(el('div', 'bankempty', rq.snap ? 'Scoring complete' : 'All items placed \u2014 press Check when ready'));
    bank.appendChild(bl);
    w.appendChild(bank);
    var grid = el('div', 'cats');
    ex.cats.forEach(function (cname, ci) {
      var col = el('div', 'cat');
      col.dataset.c = ci;
      col.setAttribute('tabindex', '0');
      col.setAttribute('role', 'group');
      col.setAttribute('aria-label', (ex.type === 'match' ? 'Target' : 'Category') + ': ' + cname + '. Press Enter to place the selected item here.');
      col.appendChild(el('div', 'catname', '<span aria-hidden="true">\u25a3</span> ' + esc(cname)));
      var slot = el('div', 'catslot');
      it.order.forEach(function (ii) { if (it.place[ii] === ci) slot.appendChild(dndChip(rq, ii, host)); });
      col.appendChild(slot);
      col.addEventListener('dragover', function (e) { if (isLocked(rq)) return; e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', function () { col.classList.remove('over'); });
      col.addEventListener('drop', function (e) {
        e.preventDefault(); col.classList.remove('over');
        if (isLocked(rq)) return;
        var i = e.dataTransfer.getData('text/plain');
        if (i !== '') { it.place[+i] = ci; renderDnd(rq, host); }
      });
      col.addEventListener('click', function () {
        if (isLocked(rq)) return;
        if (it.sel != null) { it.place[it.sel] = ci; it.sel = null; renderDnd(rq, host); }
      });
      col.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (isLocked(rq)) return;
          if (it.sel != null) { it.place[it.sel] = ci; it.sel = null; renderDnd(rq, host); }
        }
      });
      grid.appendChild(col);
    });
    w.appendChild(grid);
    host.appendChild(w);
  }
  function dndChip(rq, ii, host) {
    var ex = rq.ex, it = rq.inter;
    var it2 = ex.items[ii];
    var c = el('div', 'chip');
    c.tabIndex = 0;
    c.setAttribute('role', 'button');
    c.setAttribute('aria-label', it2.t + (it.sel === ii ? ', selected' : ''));
    c.innerHTML = '<span>' + esc(it2.t) + '</span><span class="mkslot"></span>';
    if (!isLocked(rq)) c.draggable = true;
    if (it.sel === ii) c.classList.add('sel');
    c.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(ii)); });
    c.addEventListener('click', function (e) {
      e.stopPropagation();
      if (isLocked(rq)) return;
      if (it.sel != null && it.sel !== ii && it.place[ii] != null) {
        // carrying an item and clicking a placed chip: drop the carried item into that chip's category
        it.place[it.sel] = it.place[ii];
        it.sel = null;
        renderDnd(rq, host);
        return;
      }
      if (it.place[ii] != null) { it.place[ii] = null; renderDnd(rq, host); }
      else { it.sel = (it.sel === ii ? null : ii); renderDnd(rq, host); }
    });
    c.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.click(); }
      if ((e.key === 'Delete' || e.key === 'Backspace') && it.place[ii] != null) { it.place[ii] = null; renderDnd(rq, host); }
    });
    if (rq.snap) {
      var good = it.place[ii] === it2.c;
      if (it.place[ii] == null) {
        c.classList.add('mk-miss');
        $('.mkslot', c).innerHTML = '<span class="chipmiss">\u26a0 missed \u2192 ' + esc(ex.cats[it2.c]) + '</span>';
      } else if (good) {
        c.classList.add('mk-ok');
        $('.mkslot', c).innerHTML = '<span class="mktag tag-ok">\u2713</span>';
      } else {
        c.classList.add('mk-bad');
        $('.mkslot', c).innerHTML = '<span class="chipmiss">\u2717 \u2192 ' + esc(ex.cats[it2.c]) + '</span>';
      }
    }
    return c;
  }
  TYPES.classify = {
    prep: dndPrep,
    correctText: function (rq) { return rq.ex.items.map(function (x) { return esc(trim(x.t, 40)) + ' \u2192 ' + esc(rq.ex.cats[x.c]); }).join('; '); },
    body: function (rq, host) { renderDnd(rq, host); },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var rights = 0, wrong = [];
      ex.items.forEach(function (x, i) {
        if (it.place[i] === x.c) rights++;
        else if (it.place[i] != null) wrong.push(esc(trim(x.t, 34)) + ' \u2192 ' + esc(ex.cats[it.place[i]]) + ' (\u2717)');
        else wrong.push(esc(trim(x.t, 34)) + ' \u2192 not placed (\u26a0)');
      });
      return {
        ratio: rights / ex.items.length,
        summary: rights + ' of ' + ex.items.length + ' placed correctly' + (wrong.length ? '. ' + wrong.join('; ') : ''),
        correctSummary: ex.items.map(function (x) { return esc(trim(x.t, 34)) + ' \u2192 ' + esc(ex.cats[x.c]); }).join('; ')
      };
    }
  };
  TYPES.match = {
    prep: dndPrep,
    correctText: TYPES_classifyCT,
    body: function (rq, host) { renderDnd(rq, host); },
    check: TYPES_classifyCK
  };
  function TYPES_classifyCT(rq) { return TYPES.classify.correctText(rq); }
  function TYPES_classifyCK(rq) { return TYPES.classify.check(rq); }

  /* ----- order / rank ----- */
  TYPES.order = {
    prep: function (rq) { rq.inter.order = shuffle(rq.ex.order.map(function (_, i) { return i; })); rq.inter.touched = false; },
    correctText: function (rq) { return rq.ex.order.map(function (s, i) { return (i + 1) + '. ' + esc(trim(s, 60)); }).join(' '); },
    body: function (rq, host) {
      var ex = rq.ex, it = rq.inter;
      var w = el('div', 'olist');
      var dragPos = null;
      function renderRows() {
        w.innerHTML = '';
        it.order.forEach(function (oi, pos) {
          var row = el('div', 'orow');
          row.draggable = !isLocked(rq);
          row.dataset.pos = pos;
          row.innerHTML = '<span class="grab" aria-hidden="true">\u2630</span>' +
            '<span class="onum">' + (pos + 1) + '</span>' +
            '<span class="otext">' + esc(ex.order[oi]) + '</span>' +
            '<span class="mv"><button type="button" aria-label="Move up" ' + (pos === 0 ? 'disabled' : '') + '>\u2191</button><button type="button" aria-label="Move down" ' + (pos === it.order.length - 1 ? 'disabled' : '') + '>\u2193</button></span>' +
            '<span class="mkslot"></span>';
          var up = $$('.mv button', row)[0], dn = $$('.mv button', row)[1];
          up.onclick = function () { if (isLocked(rq)) return; mv(pos, pos - 1); };
          dn.onclick = function () { if (isLocked(rq)) return; mv(pos, pos + 1); };
          row.addEventListener('dragstart', function (e) { dragPos = pos; e.dataTransfer.setData('text/plain', String(pos)); });
          row.addEventListener('dragover', function (e) { if (isLocked(rq)) return; e.preventDefault(); row.classList.add('over'); });
          row.addEventListener('dragleave', function () { row.classList.remove('over'); });
          row.addEventListener('drop', function (e) {
            e.preventDefault(); row.classList.remove('over');
            if (isLocked(rq)) return;
            var from = dragPos != null ? dragPos : +e.dataTransfer.getData('text/plain');
            if (!isNaN(from)) mv(from, pos);
          });
          if (rq.snap) {
            var good = oi === pos;
            row.classList.add(good ? 'mk-ok' : 'mk-bad');
            $('.mkslot', row).innerHTML = good ? '<span class="mktag tag-ok">\u2713 right slot</span>' : '<span class="mktag tag-bad">\u2717 belongs at #' + (oi + 1) + '</span>';
          }
          w.appendChild(row);
        });
      }
      function mv(from, to) {
        if (to < 0 || to >= it.order.length || from === to) return;
        var x = it.order.splice(from, 1)[0];
        it.order.splice(to, 0, x);
        it.touched = true;
        renderRows();
      }
      renderRows();
      host.appendChild(w);
      host.appendChild(el('div', 'btext', 'Drag rows with \u2630, or use \u2191 \u2193. Press Check when the order looks right.'));
    },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var rights = 0;
      it.order.forEach(function (oi, pos) { if (oi === pos) rights++; });
      return {
        ratio: rights / ex.order.length,
        summary: it.order.map(function (oi, pos) { return (pos + 1) + '. ' + esc(trim(ex.order[oi], 52)); }).join(' '),
        correctSummary: ex.order.map(function (s, i) { return (i + 1) + '. ' + esc(trim(s, 52)); }).join(' ')
      };
    }
  };

  /* ----- terminal ----- */
  TYPES.terminal = {
    prep: function (rq) { rq.inter.text = ''; },
    correctText: function (rq) { return '<code>' + esc(rq.ex.canonical) + '</code>'; },
    body: function (rq, host) {
      var it = rq.inter, ex = rq.ex;
      var t = el('div', 'term');
      t.innerHTML = '<div class="termhead"><span class="dot"></span><span class="dot"></span><span class="dot"></span><b>' + esc(ex.hostname || 'analyst@jump-host') + '</b></div>' +
        '<div class="termbody">' +
        (ex.note ? '<div class="tline"># ' + esc(ex.note) + '</div>' : '') +
        '<div class="trow"><span class="tps1">' + esc(ex.prompt || 'analyst@jump:~$') + '</span>' +
        '<input class="tin" type="text" spellcheck="false" autocomplete="off" aria-label="Type your command" placeholder="' + esc(ex.ph || 'type the command, then press Check') + '"></div>' +
        (rq.snap ? '<div class="termout ' + (rq.snap.ratio >= 1 ? 'tag-ok' : 'tag-bad') + '">' + (rq.snap.ratio >= 1 ? '\u2713 Command accepted.' : '\u2717 Not the command we needed. See the explanation below.') + '</div>' : '') +
        '</div>';
      var inp = $('.tin', t);
      inp.value = it.text;
      inp.oninput = function () { it.text = inp.value; };
      host.appendChild(t);
      if (ex.cmdnote && !rq.snap) host.appendChild(el('div', 'btext', ex.cmdnote));
    },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var txt = (it.text || '').trim();
      var ok = false;
      if (txt) ok = ex.accepts.some(function (src) { return new RegExp(src, 'i').test(txt); });
      return {
        ratio: ok ? 1 : 0,
        summary: txt ? '<code>' + esc(txt) + '</code>' : '\u2014 nothing typed',
        correctSummary: '<code>' + esc(ex.canonical) + '</code>' + (ex.alsoOk ? ' (also accepted: ' + esc(ex.alsoOk) + ')' : '')
      };
    }
  };

  /* ----- branch ----- */
  TYPES.branch = {
    prep: function (rq) {
      var ex = rq.ex;
      rq.inter.optPerm = ex.nodes.map(function (n) { return shuffle(n.opts.map(function (_, i) { return i; })); });
      rq.inter.dec = ex.nodes.map(function () { return null; });
      rq.inter.node = 0;
      rq.inter.fin = false;
    },
    correctText: function (rq) { return rq.ex.nodes.map(function (n, i) { return 'Step ' + (i + 1) + ': ' + esc(trim(bestOpt(n), 70)); }).join(' '); },
    body: function (rq, host) {
      var ex = rq.ex, it = rq.inter;
      var w = el('div', 'steps');
      if (rq.snap && !rq.revising) {
        // graded: show every step with marks
        ex.nodes.forEach(function (n, ni) {
          var d = it.dec[ni];
          var st = el('div', 'step');
          st.innerHTML = '<div class="slabel">STEP ' + (ni + 1) + ' / ' + ex.nodes.length + '</div><div class="sq">' + n.q + '</div>';
          var opts = el('div', 'sopts');
          it.optPerm[ni].forEach(function (oi) {
            var o = n.opts[oi];
            var b = el('div', 'opt');
            b.innerHTML = '<span class="okey">' + (o.ok ? '\u2713' : '\u2717') + '</span><span class="otext">' + o.t + '</span><span class="mkslot"></span>';
            if (o.ok) { b.classList.add('mk-ok'); $('.mkslot', b).innerHTML = '<span class="mktag tag-ok">best call</span>'; }
            if (d && d.pick === oi) {
              if (!o.ok) b.classList.add('mk-bad');
              if (!o.ok) $('.mkslot', b).innerHTML = '<span class="mktag tag-bad">your call</span>';
              else $('.mkslot', b).innerHTML = '<span class="mktag tag-ok">your call \u2713</span>';
            }
            b.style.cursor = 'default';
            opts.appendChild(b);
          });
          st.appendChild(opts);
          if (d && !d.ok) st.appendChild(el('div', 'stepfb badf', '<b>Why not:</b> ' + n.opts[d.pick].fb));
          w.appendChild(st);
        });
        host.appendChild(w);
        return;
      }
      if (!it.fin) {
        var ni = it.node;
        var n = ex.nodes[ni];
        var st = el('div', 'step');
        st.innerHTML = '<div class="slabel">STEP ' + (ni + 1) + ' / ' + ex.nodes.length + '</div><div class="sq">' + n.q + '</div>';
        var opts = el('div', 'sopts');
        var fbBox = el('div');
        var cont = el('button', 'btn go');
        cont.type = 'button';
        cont.style.display = 'none';
        cont.onclick = function () {
          if (ni + 1 >= ex.nodes.length) { it.fin = true; } else { it.node++; }
          renderQ();
        };
        it.optPerm[ni].forEach(function (oi) {
          var o = n.opts[oi];
          var b = el('button', 'opt');
          b.type = 'button';
          b.innerHTML = '<span class="okey">' + String.fromCharCode(65 + it.optPerm[ni].indexOf(oi)) + '</span><span class="otext">' + o.t + '</span>';
          b.onclick = function () {
            if (it.dec[ni]) return;
            it.dec[ni] = { pick: oi, ok: !!o.ok };
            $$('button.opt', opts).forEach(function (x) { x.disabled = true; x.style.opacity = '.55'; });
            b.disabled = false; b.style.opacity = '1';
            b.classList.add(o.ok ? 'mk-ok' : 'mk-bad');
            fbBox.className = 'stepfb ' + (o.ok ? 'good' : 'badf');
            fbBox.innerHTML = (o.ok ? '<b>Good call \u2014 </b>' : '<b>Not quite \u2014 </b>') + o.fb;
            cont.style.display = '';
            cont.innerHTML = (ni + 1 >= ex.nodes.length) ? '<span class="em">\u2713</span> Finish &amp; see Check' : 'Continue <span class="em">\u2192</span>';
          };
          opts.appendChild(b);
        });
        st.appendChild(opts);
        st.appendChild(fbBox);
        st.appendChild(cont);
        w.appendChild(st);
        // show already-decided earlier steps (when returning)
        for (var k = 0; k < ni; k++) {
          var nk = ex.nodes[k], dk = it.dec[k];
          var sk = el('div', 'step');
          var okk = dk && dk.ok;
          sk.innerHTML = '<div class="slabel">STEP ' + (k + 1) + ' \u2014 decided</div><div class="sq">' + nk.q + '</div>' +
            '<div class="stepfb ' + (okk ? 'good' : 'badf') + '">' + (okk ? '\u2713 ' : '\u2717 ') + (dk ? esc(trim(nk.opts[dk.pick].t, 90)) : '\u2014') + '</div>';
          w.appendChild(sk);
        }
      } else {
        var done = el('div', 'step');
        done.innerHTML = '<div class="slabel">ALL STEPS DECIDED</div><div class="sq">You have walked the whole scenario. Press <b>Check</b> to grade your decisions.</div>';
        w.appendChild(done);
      }
      host.appendChild(w);
    },
    check: function (rq) {
      var it = rq.inter, ex = rq.ex;
      var rights = 0, sum = [];
      ex.nodes.forEach(function (n, i) {
        var d = it.dec[i];
        if (d && d.ok) rights++;
        sum.push('S' + (i + 1) + ' ' + (d ? (d.ok ? '\u2713' : '\u2717') : '\u26a0') + ' ' + esc(trim(n.opts[d ? d.pick : 0].t, 40)));
      });
      return {
        ratio: rights / ex.nodes.length,
        summary: sum.join(' \u00b7 '),
        correctSummary: ex.nodes.map(function (n, i) { return 'S' + (i + 1) + ': ' + esc(trim(bestOpt(n), 60)); }).join(' \u00b7 ')
      };
    }
  };
  function bestOpt(n) {
    for (var i = 0; i < n.opts.length; i++) if (n.opts[i].ok) return n.opts[i].t;
    return '';
  }

  /* ---------------- boot ---------------- */
  function boot() {
    buildRuntime();
    buildShell();
    renderIntro();
    window.addEventListener('message', function (event) {
      if (!event.data) return;
      if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
      if (event.origin && event.origin !== 'null') S.parentOrigin = event.origin;
      var d = event.data;
      S.session = {
        username: d.username || null, country: d.country || null, theme: d.theme || null,
        locale: d.locale || null, topicId: d.topicId || null, batch: d.batch || null
      };
      if (d.username) S.user = String(d.username);
      if (d.theme === 'light' || d.theme === 'dark') applyTheme(d.theme);
      var g = $('#greet');
      if (g && S.user) g.textContent = 'Ready, ' + S.user + ' \u2014 good luck.';
      paintSession();
      var live = $('#live');
      if (live) live.textContent = 'Session initialized' + (S.user ? ' for ' + S.user : '') + '.';
    });
  }
  /* ---------------- selftest hook (only active with ?selftest=1) ---------------- */
  if (/selftest=1/.test(location.search)) {
    window.__exam = {
      state: function () {
        return {
          started: S.started, over: S.over, cur: S.cur, tLeft: S.tLeft,
          manual: S.manual, checkPause: S.checkPause, attempt: S.attempt,
          reported: S.reported, n: S.RQ.length,
          curId: S.RQ[S.cur] ? S.RQ[S.cur].ex.id : null,
          ids: S.RQ.map(function (r) { return r.ex.id; }),
          statuses: S.RQ.map(function (r) { return r.status + (r.revising ? '+rev' : ''); }),
          earned: S.RQ.map(function (r) { return r.earned; }),
          user: S.user, session: S.session
        };
      },
      tick: function (n) { n = n || 1; for (var k = 0; k < n; k++) { if (!tickBody()) break; } }
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
