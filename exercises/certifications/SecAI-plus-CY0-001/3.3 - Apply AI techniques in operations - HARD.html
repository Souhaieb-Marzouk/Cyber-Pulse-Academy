 unattended for months at a time, so the ML platform team builds a monitoring dashboard per model. Screen space is scarce: seven candidate panels exist, and the review says five actually catch real failure modes early. Two panels are cargo cult.", "question": "Select the five panels that earn their place. Wrong picks cost nothing but earn nothing.", "options": ["Precision and recall trend per model, week over week", "False positive rate per detection rule, with analyst override reasons", "Input distribution metrics that move when the telemetry's shape moves (drift signals)", "Alert volume and analyst override rate per rule", "MTTR trend for incidents opened by each model family", "GPU temperature of the inference cluster", "The model's feature-importance chart, frozen at training time"], "correct": [0, 1, 2, 3, 4], "explanation": "The five earning panels each catch a known failure early. Precision and recall trends expose slow decay — the months-long slide no single alert ever shows. Per-rule false positive rates with override reasons reveal which specific rule is rotting and why analysts disagree with it, feeding the label loop. Input-distribution metrics fire before the model's output does: when telemetry shape moves, you know to re-examine before precision craters. Alert volume and override rate measure the human cost — the earliest visible symptom of alert fatigue and threshold staleness. MTTR per model family tells you whether a model's alerts lead to fast, clean resolution or slow, messy ones, which is outcome quality, not just alert quantity. GPU temperature is ops plumbing, and a feature-importance chart frozen at training time is a museum piece — it cannot drift, so it cannot warn.", "tips": ["Focus on: monitor the model's quality, its inputs, its human cost, and its outcomes.", "Focus on: anything frozen at training time cannot detect drift by definition."], "hints": ["One wrong panel monitors hardware; the other cannot change after deployment.", "Ask: would this panel look different in the week things went wrong?"]}, {"id": "H28", "type": "categorize", "theme": "ML for Detection", "keywords": ["Confusion matrix", "Labeled data", "Feedback loop", "Supervised learning", "False positive", "False negative", "Imbalanced data"], "title": "Sort the verdicts into the confusion matrix", "scenario": "NovaGrid closes the quarter by reviewing sampled model decisions so the labels feed supervised retraining. The ML lead warns the team: attacks are 0.4% of events, so the matrix is imbalanced and every verdict must be placed by ground truth, not by how the alert felt. Eight sampled cases must land in the four quadrants. Each quadrant receives exactly two cases.", "question": "Place each case into its confusion-matrix quadrant.", "categories": ["True positive", "False positive", "False negative", "True negative"], "items": [{"t": "Beacon alert fired; host confirmed infected after forensics", "c": 0}, {"t": "Backup job flagged as exfiltration; schedule change ticket verified", "c": 1}, {"t": "Hunt found ransomware staging that no model ever alerted on", "c": 2}, {"t": "Quiet day sampled at random: no alert, no incident found on check", "c": 3}, {"t": "Impossible travel alert; account takeover confirmed via MFA bypass", "c": 0}, {"t": "VPN-lookalike sign-in flagged as travel; concentrator logs reconciled it", "c": 1}, {"t": "Password spray discovered later in IdP logs; no alert ever fired", "c": 2}, {"t": "Insider rule fired on an export process approved by the data owner", "c": 1}], "explanation": "Ground truth decides the quadrant. The beacon host and the MFA-bypass takeover were real attacks the model raised — true positives. The backup job, the VPN reconciliation and the approved export were flagged but benign — false positives, the tax analysts pay for recall. The ransomware staging found by hunt and the spray found later in IdP logs were real attacks the models missed — false negatives, the dangerous quadrant because nobody paid attention at the time. The random quiet day with no incident is a true negative — sampled precisely to keep the matrix honest about how often silence is correct. Imbalanced data means the FN quadrant is tiny but catastrophic and the FP quadrant is big but survivable, which is why sampling review must deliberately hunt FNs instead of letting volume decide what gets labeled.", "tips": ["Focus on: did the model fire, and was it real? Both answers decide the quadrant.", "Focus on: false negatives hide — only hunts and late discovery surface them."], "hints": ["Two items were found after the fact with no alert ever firing.", "One item is a checked, clean silence — the quadrant nobody samples often enough."]}, {"id": "H29", "type": "terminal", "theme": "Data & Intelligence Pipeline", "keywords": ["Telemetry", "Beaconing", "IoC extraction", "Data quality"], "title": "Terminal: profile the suspicious process, your own tooling", "scenario": "EDR telemetry exported to /var/log/edr/proconn.log records process-network events:<br><code>2026-10-12T09:00:03Z pid=4410 proc=svhost~ dst=198[.]51[.]100[.]77:443 bytes=1182</code><br>Analysis asks two questions, no tools specified: which external destinations did pid 4410 contact, uniquely; and how many connections went to each. That second answer is the beacon fingerprint. Output shapes:<br><code>198[.]51[.]100[.]77:443</code><br>then<br><code>  137 198[.]51[.]100[.]77:443</code>", "question": "Type the two commands: one that lists unique external destinations for pid 4410, and one that counts connections per destination.", "greet": "demo-shell ready. /var/log/edr/proconn.log exists. Choose your own tooling.", "tasks": [{"accept": ["(grep|awk|sed|rg).*4410.*(sort|uniq)|(grep|awk).*pid=4410", "awk.*4410.*\\{.*print"], "note": "list the unique external destinations contacted by pid 4410", "ex": "grep 'pid=4410' /var/log/edr/proconn.log | awk '{print $4}' | sort -u"}, {"accept": ["uniq\\s+-c", "sort.*uniq\\s+-c", "awk.*count|wc\\s+-l"], "note": "count connections per destination for the same process", "ex": "grep 'pid=4410' /var/log/edr/proconn.log | awk '{print $4}' | sort | uniq -c | sort -rn"}], "samples": [{"m": "^help$", "out": ["supported demo commands: help, clear", "pipelines are recorded and validated on 'Check'"]}, {"m": "^clear$", "out": ["(screen cleared)"]}, {"m": "pid=4410", "out": ["2026-10-12T09:00:03Z pid=4410 proc=svhost~ dst=198[.]51[.]100[.]77:443 bytes=1182", "2026-10-12T09:01:04Z pid=4410 proc=svhost~ dst=198[.]51[.]100[.]77:443 bytes=1182", "2026-10-12T09:02:02Z pid=4410 proc=svhost~ dst=198[.]51[.]100[.]23:443 bytes=1180", "... 1,907 more matching lines"]}], "explanation": "Two operations answer the question: filter to the process, then reshape the destination field. Filtering by pid isolates the actor; sort -u collapses the output to the unique destination set — the attacker's infrastructure list. Counting per destination (sort | uniq -c, often piped through sort -rn) yields the frequency table: one destination absorbing 137 of 1909 connections at metronome intervals is a beacon fingerprint, while the runner-up at lower volume suggests fallback infrastructure. The same two-step pattern — filter then aggregate — is the backbone of log analysis, and its discipline generalizes: choose the field that identifies the actor, choose the field that profiles the behavior, then count.", "tips": ["Focus on: filter by the actor (pid), then aggregate by the behavior field (destination).", "Focus on: the count-per-destination table is what separates one C2 from ambient noise."], "hints": ["Command one is filter, extract the dst field, sort -u.", "Command two adds the counting stage after the sort."]}, {"id": "H30", "type": "rank", "theme": "Continuous Monitoring & SOC", "keywords": ["Alert triage", "Threat intelligence", "Enrichment", "Anomaly detection", "Alert fatigue", "Impossible travel", "False negative", "STIX", "CTI feed"], "title": "Rank the escalated queue with STIX context", "s <style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a101d;--panel:#121a2c;--panel2:#0d1422;--line:#26385a;--line2:#1a2740;
  --txt:#e7eef8;--dim:#a9b9d0;--faint:#7e90ac;
  --acc:#2dd4bf;--acc2:#38bdf8;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--info:#93c5fd;
  --okbg:rgba(74,222,128,.12);--badbg:rgba(248,113,113,.12);--warnbg:rgba(251,191,36,.12);--accbg:rgba(45,212,191,.10);
  --sans:'Segoe UI',system-ui,Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'Cascadia Mono',Consolas,'DejaVu Sans Mono','Courier New',monospace;
}
html.light{
  --bg:#eef2f8;--panel:#ffffff;--panel2:#f4f7fc;--line:#c3d0e4;--line2:#d7e0ee;
  --txt:#152238;--dim:#41526d;--faint:#5d6f8c;
  --acc:#0f766e;--acc2:#1d4ed8;--ok:#15803d;--bad:#b91c1c;--warn:#92400e;--info:#1e40af;
  --okbg:rgba(21,128,61,.10);--badbg:rgba(185,28,28,.08);--warnbg:rgba(146,64,14,.10);--accbg:rgba(15,118,110,.08);
}
html{background:var(--bg)}
body{font-family:var(--sans);background:radial-gradient(1100px 500px at 85% -10%,var(--accbg),transparent),var(--bg);color:var(--txt);font-size:15.5px;line-height:1.55;padding:14px 12px 60px}
#app{max-width:1020px;margin:0 auto}
code,.mono{font-family:var(--mono);font-size:.95em}
.hidden{display:none!important}
/* header */
#top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.sev-chip{font-weight:700;font-size:13px;letter-spacing:.08em;color:#062019;background:linear-gradient(135deg,#2dd4bf,#38bdf8);padding:7px 10px;border-radius:9px;white-space:nowrap}
html.light .sev-chip{color:#ffffff}
.brand h1{font-size:17px;line-height:1.25}
.brand .sub{font-size:12.5px;color:var(--dim)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;color:var(--dim);white-space:nowrap}
.hud-box b{color:var(--txt);font-size:15px}
.hud-box.timer b{font-family:var(--mono);font-size:16px}
.hud-box.timer.low b{color:var(--bad)}
.hud-box.timer.warnlow b{color:var(--warn)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{background:var(--panel)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#2dd4bf,#0ea5a0);border-color:#0ea5a0;color:#062019}
html.light .btn.primary{color:#ffffff}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.opt:focus-visible,.chip:focus-visible,.slot:focus-visible,.navchip:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
/* banners */
.banner{border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin:10px 0;font-size:14.5px;background:var(--panel2)}
.banner.manual{border-color:var(--acc2);background:var(--accbg)}
.banner.review{border-color:var(--warn);background:var(--warnbg)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.cline.half{border-left-color:var(--warn);background:var(--warnbg)}
.slot.half{border-color:var(--warn);background:var(--warnbg)}
.chip.half{border-color:var(--warn);background:var(--warnbg)}
/* theme strip */
#themeStrip{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tchip{font-size:12px;color:var(--dim);border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:4px 10px}
.tchip b{color:var(--txt)}
/* intro */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.intro h2{font-size:21px;margin-bottom:6px}
.intro .lede{color:var(--dim);margin-bottom:12px}
.statrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13.5px;color:var(--dim)}
.stat b{color:var(--txt);font-size:15px}
.intro h3{font-size:15.5px;margin:14px 0 6px;color:var(--acc)}
.intro ul{margin:4px 0 4px 20px}
.intro li{margin:4px 0}
.kwrap{margin-top:8px}
.ktheme{margin:9px 0 4px;font-size:13.5px;font-weight:700;color:var(--info)}
.kpanel{display:flex;flex-wrap:wrap;gap:6px}
.kw{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line2);color:var(--dim);border-radius:7px;padding:3px 8px}
/* exam */
.progressbar{height:9px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;overflow:hidden;margin-bottom:10px}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#2dd4bf,#38bdf8);transition:width .35s}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:8px}
.qmeta .pilltype{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--dim);background:var(--panel2)}
#exWrap{transition:filter .2s}
#exWrap.blurred{filter:blur(11px);pointer-events:none;user-select:none}
.scenario{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--acc2);border-radius:11px;padding:13px 15px;margin-bottom:11px}
.taglabel{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--acc2);margin-bottom:5px}
.answertag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--warn);margin:2px 0 8px}
.question{background:var(--accbg);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:11px;padding:13px 15px;margin-bottom:12px;font-weight:600}
.ansbox{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.anslabel{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--warn);margin-bottom:8px}
.ansbox.locked{pointer-events:none}
.ansbox.locked .opt,.ansbox.locked .chip,.ansbox.locked .slot,.ansbox.locked .row{cursor:default}
/* options */
.optlist{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);font-size:15px;cursor:pointer;font-family:var(--sans)}
.opt:hover{border-color:var(--acc2)}
.opt .optmark{flex:0 0 auto;font-size:15px;color:var(--faint);min-width:18px}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.sel .optmark{color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .optmark{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .optmark{color:var(--bad)}
.opt.half{border-color:var(--warn);background:var(--warnbg)}
.opt .marknote{margin-left:auto;font-size:12.5px;font-weight:700;white-space:nowrap}
.opt .marknote.ok{color:var(--ok)}.opt .marknote.bad{color:var(--bad)}.opt .marknote.half{color:var(--warn)}
/* bank / chips / slots */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font-family:var(--mono);font-size:14px;min-height:44px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer}
.chip.sel{border-color:var(--warn);background:var(--warnbg)}
.chip.ok{border-color:var(--ok);background:var(--okbg)}
.chip.bad{border-color:var(--bad);background:var(--badbg)}
.chip.ghosted{opacity:.4}
.slots{display:flex;flex-direction:column;gap:8px}
.slotrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slotrow .slabel{font-size:14.5px;flex:1 1 220px;min-width:180px}
.slot{min-width:130px;min-height:44px;border:1.5px dashed var(--line);border-radius:9px;background:var(--panel2);color:var(--txt);font-family:var(--mono);font-size:14px;padding:8px 12px;cursor:pointer;text-align:left}
.slot.filled{border-style:solid;border-color:var(--acc2)}
.slot.ok{border-color:var(--ok);background:var(--okbg)}
.slot.bad{border-color:var(--bad);background:var(--badbg)}
.zone{border:1.5px dashed var(--line);border-radius:11px;padding:10px 12px;min-height:58px;margin:8px 0;cursor:pointer}
.zone.over{border-color:var(--warn);background:var(--warnbg)}
.zone.zok{border-color:var(--ok)}
.zone h4{font-size:13.5px;color:var(--info);margin-bottom:4px}
.zone .zchips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
/* ordering */
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:6px 10px}
.row .pos{font-family:var(--mono);font-size:13px;color:var(--faint);min-width:26px}
.row .rtext{flex:1;font-size:14.5px}
.row .rbtns{display:flex;gap:4px}
.row .rbtns button{min-width:44px;min-height:44px}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.bad{border-color:var(--bad);background:var(--badbg)}
.row .rmk{font-weight:800;min-width:20px}
.row .rmk.ok{color:var(--ok)}.row .rmk.bad{color:var(--bad)}
/* terminal */
.term{background:#050a13;border:1px solid var(--line);border-radius:10px;overflow:hidden}
html.light .term{background:#101826}
.term .tbar{font-size:12px;color:var(--dim);padding:6px 12px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.thist{font-family:var(--mono);font-size:14px;color:#c7f3e8;padding:10px 12px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.thist .cmdline{color:#7dd3fc}
.thist .err{color:#fda4af}
.tin{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line2);padding:8px 12px}
.tin .pr{font-family:var(--mono);font-size:14px;color:#4ade80;white-space:nowrap}
.tin input{flex:1;background:transparent;border:0;color:#e7eef8;font-family:var(--mono);font-size:14px;min-height:32px}
.tin input:focus-visible{outline:2px solid var(--acc2);outline-offset:0}
/* log viewer */
.logbox{background:#050a13;border:1px solid var(--line);border-radius:10px;overflow:hidden}
html.light .logbox{background:#101826}
.logtools{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2);background:var(--panel2);flex-wrap:wrap}
.logtools input{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-family:var(--mono);font-size:14px;padding:8px 10px;min-height:40px}
.logtools .lcount{font-size:12.5px;color:var(--faint);white-space:nowrap}
.loglines{font-family:var(--mono);font-size:14px;color:#c9d7ea;padding:8px 0;max-height:320px;overflow:auto}
.logline{padding:2px 12px;white-space:pre-wrap;word-break:break-word}
.logline.tok-bad{color:#fda4af}
.logline .tok-bad{color:#fda4af}
.logline .tok-warn{color:#fcd34d}
.logline .tok-ok{color:#86efac}
/* alerts (triage) */
.alertcard{border:1px solid var(--line2);border-radius:11px;padding:12px;margin:10px 0;background:var(--panel2)}
.alertcard .ahead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.alertcard .ahead b{font-size:15px}
.alertcard .ameta{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
.alertcard.okc{border-color:var(--ok)}
.alertcard.badc{border-color:var(--bad)}
.alertcard.halfc{border-color:var(--warn)}
.outcome{margin-top:8px;border-left:3px solid var(--info);padding:7px 10px;font-size:14px;color:var(--dim);background:var(--accbg);border-radius:8px}
/* spot */
.codeblock{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#050a13}
html.light .codeblock{background:#101826}
.cline{display:flex;width:100%;text-align:left;gap:10px;font-family:var(--mono);font-size:14px;color:#c9d7ea;padding:6px 12px;border:0;border-left:4px solid transparent;background:transparent;cursor:pointer;min-height:34px}
.cline:nth-child(odd){background:rgba(255,255,255,.02)}
.cline .ln{color:var(--faint);min-width:30px}
.cline.flagged{border-left-color:var(--warn);background:var(--warnbg)}
.cline.ok{border-left-color:var(--ok);background:var(--okbg)}
.cline.bad{border-left-color:var(--bad);background:var(--badbg)}
.cline .cmk{margin-left:auto;font-weight:800}
.cline .cmk.ok{color:var(--ok)}.cline .cmk.bad{color:var(--bad)}.cline .cmk.warn{color:var(--warn)}
/* branch */
.stepdone{font-size:13.5px;color:var(--dim);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;margin:6px 0;background:var(--panel2)}
.stepdone.ok{border-color:var(--ok)}
.stepdone.bad{border-color:var(--bad)}
.stepdone.half{border-color:var(--warn)}
.bnode{border:1px solid var(--acc2);border-radius:11px;padding:12px;background:var(--panel2);margin-top:10px}
.bnode .bq{font-weight:600;margin-bottom:8px}
/* hint / explanation */
.hintbox{border:1px dashed var(--warn);background:var(--warnbg);border-radius:11px;padding:11px 14px;margin:10px 0;font-size:14.5px}
.hintbox .hitem{margin:4px 0}
.explbox{border:1px solid var(--line);border-left:4px solid var(--ok);background:var(--panel2);border-radius:11px;padding:12px 14px;margin:10px 0;font-size:14.5px}
.explbox h4{font-size:13px;letter-spacing:.07em;color:var(--ok);margin-bottom:5px}
.explbox .tip{margin-top:7px;color:var(--dim)}
.explbox ul{margin:6px 0 0 20px}
/* score note */
.scoreline{margin-top:9px;font-size:13.5px;color:var(--dim)}
.scoreline b{color:var(--txt)}
/* navigator */
.navigator{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:14px}
.navchip{min-height:44px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.navchip .st{font-size:10.5px;font-weight:800}
.navchip.cur{border-color:var(--acc2);border-width:2px;color:var(--txt)}
.navchip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.navchip.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.navchip.part{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.navchip.skip{background:var(--warnbg);border-style:dashed;border-color:var(--warn);color:var(--warn)}

.reshead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bigpct{font-size:44px;font-weight:800;font-family:var(--mono)}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.pill.pass{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.pill.fail{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.pill.full{background:var(--okbg);color:var(--ok)}
.pill.partial{background:var(--warnbg);color:var(--warn)}
.pill.zero{background:var(--badbg);color:var(--bad)}
.pill.skipped{border:1px dashed var(--warn);color:var(--warn)}
.resitem{border:1px solid var(--line2);border-radius:11px;padding:12px;margin:9px 0;background:var(--panel2)}
.resitem .r1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.resitem .r1 b{font-size:14.5px}
.resitem .r1 .pts{margin-left:auto;font-family:var(--mono);font-size:13.5px;color:var(--dim)}
.resitem .r2{font-size:13.5px;color:var(--dim);margin-top:6px}
.resitem .r2 .cap{color:var(--faint);font-weight:700}
.resitem details{margin-top:7px}
.resitem summary{cursor:pointer;font-size:13.5px;color:var(--acc2);font-weight:600;min-height:32px;display:flex;align-items:center}
.resitem .expbody{font-size:14px;color:var(--txt);padding:8px 2px}
.resitem .expbody .tip{color:var(--dim);margin-top:6px}
.skipnote{border:1px dashed var(--warn);background:var(--warnbg);border-radius:11px;padding:11px 14px;margin:10px 0;font-size:14px;color:var(--dim)}
/* modal */

#modal .mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:460px;width:100%}
#modal h3{margin-bottom:8px}

@media (max-width:720px){.brand h1{font-size:15px}.bigpct{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <span class="sev-chip" id="sevChip">EXAM</span>
      <div>
        <h1>3.3 Apply AI techniques in operations</h1>
        <p class="sub">CompTIA SecAI+ (CY0-001) &middot; AI in threat modeling, behavior analysis &amp; continuous monitoring</p>
      </div>
    </div>
    <div class="hud">
      <div class="hud-box hidden" id="candBox"></div>
      <div class="hud-box">Score <b id="scoreNow">0</b> / <span id="scoreMax">0</span></div>
      <div class="hud-box timer" id="hudTimer"><span aria-hidden="true">&#9201;</span> <b id="timeLeft">--:--</b></div>
      <button class="btn ghost" id="btnPause" type="button">&#9209; Pause</button>
      <button class="btn ghost" id="btnSubmit" type="button">Submit exam</button>
    </div>
  </header>

  <div id="bannerZone"></div>
  <div id="srLive" class="sr-only" aria-live="polite"></div>
  <div id="themeStrip"></div>

  <section id="viewIntro" class="view intro"></section>

  <section id="viewExam" class="view hidden">
    <div class="progressbar" role="progressbar" aria-label="Exam progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="barFill"></div></div>
    <div class="qmeta"><span class="pilltype" id="qPos"></span><span class="pilltype" id="qTheme"></span><span class="pilltype" id="qType"></span></div>
    <div id="exWrap"><div id="exHost"></div></div>
    <div id="hintBox" class="hintbox hidden"></div>
    <div id="explBox" class="explbox hidden"></div>
    <div class="card" style="padding:12px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn" id="btnPrev" type="button">&larr; Prev</button>
        <button class="btn warn" id="btnHint" type="button">Hint (&minus;10%)</button>
        <button class="btn primary" id="btnCheck" type="button">&#10003; Check</button>
        <button class="btn" id="btnRevise" type="button hidden">&#9998; Revise</button>
        <button class="btn ghost" id="btnSkip" type="button">Skip &rarr;</button>
        <button class="btn primary" id="btnNext" type="button">Next &rarr;</button>
      </div>
    </div>
    <nav id="navigator" class="navigator" aria-label="Question navigator"></nav>
  </section>

  <section id="viewResult" class="view hidden"></section>

  <div id="modal" class="hidden">
    <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h3 id="mTitle"></h3>
      <div id="mBody" style="font-size:14.5px;color:var(--dim)"></div>
      <div class="mrow">
        <button class="btn ghost" id="mCancel" type="button">Cancel</button>
        <button class="btn primary" id="mOk" type="button">Confirm</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
/* ============ utils ============ */
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function rng(n){var r=[],i;for(i=0;i<n;i++)r.push(i);return r;}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();}
function fmt1(x){var v=Math.round(x*10)/10;return (v%1===0?String(v):v.toFixed(1));}
function byId(id){return document.getElementById(id);}
function announce(msg){var l=byId('srLive');if(l)l.textContent='';if(l)setTimeout(function(){l.textContent=msg;},30);}

/* ============ data ============ */
var DATA=JSON.parse(byId('exdata').textContent);
var EXS=DATA.exercises;
var THEMES=DATA.themes;
var META=JSON.parse(byId('cm-exercise-meta').textContent);
var CFG={passMark:META.passMark||70,seconds:(META.estimatedMinutes||60)*60,sev:(META.difficulty||'medium').toUpperCase(),topicId:META.topicId,count:EXS.length,title:META.title||'',
  product:META.product||'Exam',examId:META.examId||'exam',version:META.version||'3.0',
  msgInit:META.msgInit||'EXAM_INIT',msgReady:META.msgReady||'EXAM_READY',msgScore:META.msgScore||'EXAM_SCORE'};

var S=null,L={};var R={};

function newState(){
  return {order:shuffle(rng(EXS.length)),cur:0,ans:{},res:{},checked:{},skipped:{},hints:{},
    manual:false,checkPause:false,started:false,done:false,left:CFG.seconds,reported:false};
}
function buildLayouts(){
  L={};
  EXS.forEach(function(ex){
    var l={};
    if(ex.type==='qcm'||ex.type==='multi'){l.ord=shuffle(rng(ex.options.length));}
    else if(ex.type==='match'){l.ord=shuffle(rng(ex.rights.length));}
    else if(ex.type==='fill'){l.bank=shuffle(ex.bank.slice());}
    else if(ex.type==='order'||ex.type==='rank'){l.disp=shuffle(rng(ex.steps.length));}
    else if(ex.type==='categorize'){l.items=shuffle(rng(ex.items.length));}
    else if(ex.type==='logviewer'){
      if(ex.inner.type==='qcm'||ex.inner.type==='multi'){l.ord=shuffle(rng(ex.inner.options.length));}
      else if(ex.inner.type==='fill'){l.bank=shuffle(ex.inner.bank.slice());}
    }
    else if(ex.type==='dual'){ex.parts.forEach(function(p,i){if(p.inner.type==='qcm'||p.inner.type==='multi'){l['ord'+i]=shuffle(rng(p.inner.options.length));}});}
    else if(ex.type==='triage'){l.aord=ex.alerts.map(function(a){return shuffle(rng(a.options.length));});}
    else if(ex.type==='branch'){l.ideal=idealPath(ex);}
    L[ex.id]=l;
  });
}
function idealPath(ex){
  var p=[],n=ex.start,guard=0;
  while(n&&ex.nodes[n]&&!ex.nodes[n].end&&guard++<25){
    var node=ex.nodes[n],best=0;
    node.options.forEach(function(o,i){if((o.val||0)>(node.options[best].val||0))best=i;});
    p.push({node:n,opt:best});n=node.options[best].next;
  }
  return p;
}
function exMax(ex){
  switch(ex.type){
    case 'qcm':return 2;
    case 'multi':return ex.correct.length;
    case 'match':return ex.lefts.length;
    case 'categorize':return ex.items.length;
    case 'fill':return ex.answers.length;
    case 'order':case 'rank':return ex.steps.length;
    case 'terminal':return ex.tasks.length;
    case 'triage':return ex.alerts.length;
    case 'spot':return ex.wrong.length;
    case 'branch':return L[ex.id].ideal.length;
    case 'logviewer':return ex.inner.type==='qcm'?2:(ex.inner.type==='multi'?ex.inner.correct.length:ex.inner.answers.length);
    case 'dual':return ex.parts.reduce(function(a,p){return a+(p.inner.type==='qcm'?1:p.inner.correct.length);},0);
  }
  return 1;
}
function curEx(){return EXS[S.order[S.cur]];}
function adjEarned(id){
  var ex=EXS.filter(function(e){return e.id===id;})[0];
  var raw=S.res[id]?S.res[id].earned:0;
  var hints=S.hints[id]||0;
  return Math.max(0,raw-0.1*exMax(ex)*hints);
}

/* ============ views / banners ============ */
function showView(id){$all('.view').forEach(function(v){v.classList.remove('hidden');});$all('.view').forEach(function(v){if(v.id!==id)v.classList.add('hidden');});}
function renderBanners(){
  var z=byId('bannerZone');z.innerHTML='';
  if(S&&S.started&&!S.done){
    if(S.manual&&S.checkPause){
      z.appendChild(el('div','banner manual','&#9209; Paused (manual) <b>and</b> &#9203; Timer paused &mdash; review mode. The exercise stays visible; the clock resumes only when you press <b>Next</b> and un-pause.'));
    }else if(S.manual){
      z.appendChild(el('div','banner manual','&#9209; Paused (manual) &mdash; the exercise is hidden while the clock is frozen. Press <b>Resume</b> to continue.'));
    }else if(S.checkPause){
      z.appendChild(el('div','banner review','&#9203; Timer paused &mdash; review mode. Feedback and the explanation stay visible. Press <b>Next</b> (or jump to another question) to resume the timer.'));
    }
  }
}

/* ============ HUD / navigator ============ */
function renderHUD(){
  var earned=0,poss=0,sk=0;
  EXS.forEach(function(ex){
    if(S.skipped[ex.id])sk++;
    if(S.checked[ex.id]){earned+=adjEarned(ex.id);poss+=exMax(ex);}
  });
  byId('scoreNow').textContent=fmt1(earned);
  byId('scoreMax').textContent=fmt1(poss);
  var m=Math.floor(S.left/60),s=S.left%60;
  byId('timeLeft').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  var t=byId('hudTimer');
  t.classList.toggle('warnlow',S.left<=CFG.seconds*0.2&&S.left>CFG.seconds*0.1);
  t.classList.toggle('low',S.left<=CFG.seconds*0.1);
  var pctPos=Math.round(((S.cur+1)/EXS.length)*100);
  byId('barFill').style.width=pctPos+'%';
  var pb=byId('barFill').parentNode;if(pb)pb.setAttribute('aria-valuenow',String(pctPos));
  var strip=byId('themeStrip');strip.innerHTML='';
  THEMES.forEach(function(th){
    var e=0,p=0,n=0;
    EXS.forEach(function(ex){
      if(ex.theme===th.name){
        n++;
        if(S.checked[ex.id]){e+=adjEarned(ex.id);p+=exMax(ex);}
      }
    });
    strip.appendChild(el('span','tchip',esc(th.name)+': <b>'+fmt1(e)+'</b>/'+fmt1(p)+' <span style="color:var(--faint)">('+n+')</span>'));
  });
  renderNavigator();
}
function renderNavigator(){
  var nav=byId('navigator');nav.innerHTML='';
  S.order.forEach(function(exi,i){
    var ex=EXS[exi];
    var cls='navchip',icon='&middot;',stat='not answered';
    if(S.checked[ex.id]){
      var mx=exMax(ex),e=adjEarned(ex.id);
      if(e>=mx-0.001){cls+=' ok';icon='&#10003;';stat='correct';}
      else if(e>0){cls+=' part';icon='~';stat='partial';}
      else{cls+=' bad';icon='&#10007;';stat='incorrect';}
    }else if(S.skipped[ex.id]){cls+=' skip';icon='&#9193;';stat='skipped';}
    if(i===S.cur){cls+=' cur';stat+=', current';}
    var b=el('button',cls,esc(String(i+1))+'<span class="st">'+icon+'</span>');
    b.type='button';
    b.setAttribute('aria-label','Question '+(i+1)+', '+stat);
    if(i===S.cur)b.setAttribute('aria-current','true');
    b.addEventListener('click',function(){jumpTo(i);});
    nav.appendChild(b);
  });
}

/* ============ intro ============ */
function renderIntro(){
  var v=byId('viewIntro');
  var types='Scenario triage queues, drag &amp; drop (matching, categories, ordering, priority ranking), log viewer with a live filter, guided terminal tasks, branching incident decisions, spot-the-mistake code review, multi-select, and a few single-choice questions.';
  var termNote=(CFG.sev==='MEDIUM')
    ?'Terminal tasks tell you which command family to use (for example &ldquo;use <b>grep</b>&rdquo;) and give a flag hint plus the output shape.'
    :'Terminal tasks describe only the goal in operational words &mdash; no tool is named. You choose the tool, the flags and the command yourself.';
  var h='';
  h+='<div class="card">';
  h+='<h2>'+esc(CFG.sev)+' practice exam &mdash; objective 3.3: Apply AI techniques in operations</h2>';
  h+='<p class="lede">You are a SOC analyst using AI every day: AI-assisted threat modeling, UEBA behavior analysis, and continuous monitoring with machine-learning detections. Every exercise is set at <b>'+esc(CFG.sev)+'</b> severity and mirrors real on-the-job work.</p>';
  h+='<div class="statrow">'
    +'<span class="stat">Questions: <b>'+CFG.count+'</b></span>'
    +'<span class="stat">Timer: <b>'+(CFG.seconds/60)+' min</b> (auto-submit at zero)</span>'
    +'<span class="stat">Pass mark: <b>'+CFG.passMark+'%</b></span>'
    +'<span class="stat">Severity: <b>'+esc(CFG.sev)+'</b></span></div>';
  h+=(I&&I.ok)
    ?'<p class="lede" id="candLine">Signed in as <b>'+esc(I.username||'guest candidate')+'</b>'+(I.country?' &middot; '+esc(I.country):'')+(I.batch?' &middot; batch '+esc(I.batch):'')+(I.topicId?' &middot; topic '+esc(I.topicId):'')+(I.locale?' &middot; '+esc(I.locale):'')+'</p>'
    :'<p class="lede" id="candLine">Standalone mode &mdash; opened directly, no proctor handshake received. Candidate fields will appear once the host page sends '+esc(CFG.msgInit)+'.</p>';
  h+='<h3>How this exam works</h3><ul>'
    +'<li><b>Check</b> validates the exercise, marks each part green/red, locks the answer and <b>pauses the timer in review mode</b> &mdash; the content stays visible so you can learn from the feedback. The clock resumes only when you press <b>Next</b> (or jump to another question).</li>'
    +'<li><b>Manual Pause</b> freezes the clock but <b>hides/blurs the exercise</b> so it cannot be studied while paused.</li>'
    +'<li><b>Skip</b> jumps on without scoring. Skipped questions are excluded from the score (numerator and denominator). You can return to any skipped question until the timer ends or you submit; question you never opened count as skipped at submit time.</li>'
    +'<li><b>Partial credit:</b> multi-answer exercises score per correct element. Wrong picks earn nothing but do not subtract. Single-choice questions are all-or-nothing.</li>'
    +'<li><b>Hint</b> reveals a nudge, never the answer. Each hint costs 10% of that exercise&rsquo;s points.</li>'
    +'<li><b>Revise</b> reopens a checked exercise; press Check again to re-score (the timer rule applies to each new Check).</li>'
    +'<li>Order and wording are re-shuffled on every retake. When the timer hits zero the exam submits itself.</li>'
    +'<li>'+termNote+'</li>'
    +'</ul>';
  h+='<h3>Exercise types</h3><p>'+types+'</p>';
  h+='<h3>Keywords covered</h3><p style="font-size:13.5px;color:var(--dim)">Every keyword below is exercised at least once in this file. Themes also drive the per-theme progress chips above the exam.</p><div class="kwrap">';
  THEMES.forEach(function(th){
    h+='<div class="ktheme">'+esc(th.name)+'</div><div class="kpanel">';
    th.keywords.forEach(function(k){h+='<span class="kw">'+esc(k)+'</span>';});
    h+='</div>';
  });
  h+='</div><div style="margin-top:16px"><button class="btn primary" id="btnStart" type="button" style="min-width:200px;justify-content:center">Start exam</button></div>';
  h+='<p style="margin-top:14px;font-size:12.5px;color:var(--faint)">'+esc(CFG.product)+' practice simulator v'+esc(CFG.version)+' &middot; single self-contained file &middot; fully offline &middot; all indicators defanged &middot; no external resources.</p>';
  h+='</div>';
  v.innerHTML=h;
  byId('btnStart').addEventListener('click',startExam);
}

/* ============ exam flow ============ */
var tickInt=null;
var ATTEMPT=0;
function startExam(){
  if(S.started)return;
  S.started=true;ATTEMPT++;
  byId('btnPause').innerHTML='&#9209; Pause';
  showView('viewExam');
  if(!tickInt)tickInt=setInterval(tick,1000);
  mountCurrent();
}
function tick(){
  if(!S||!S.started||S.done)return;
  if(S.manual||S.checkPause)return;
  S.left--;
  if(S.left<=0){S.left=0;renderHUD();announce('Time is up. The exam is submitting automatically.');finishExam(true);return;}
  if(S.left===300&&!S.w5){S.w5=true;announce('5 minutes remaining.');}
  if(S.left===60&&!S.w1){S.w1=true;announce('1 minute remaining.');}
  renderTimerOnly();
}
function renderTimerOnly(){
  var m=Math.floor(S.left/60),s=S.left%60;
  byId('timeLeft').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  var t=byId('hudTimer');
  t.classList.toggle('warnlow',S.left<=CFG.seconds*0.2&&S.left>CFG.seconds*0.1);
  t.classList.toggle('low',S.left<=CFG.seconds*0.1);
}
function mountCurrent(){
  var ex=curEx();
  byId('qPos').textContent='Question '+(S.cur+1)+' / '+EXS.length;
  byId('qTheme').textContent=ex.theme;
  byId('qType').textContent=TYPE_LABEL[ex.type]||ex.type;
  var host=byId('exHost');host.innerHTML='';
  host.appendChild(el('div','scenario','<span class="taglabel">SCENARIO</span><br>'+ex.scenario));
  host.appendChild(el('div','question','<span class="taglabel">QUESTION</span><br>'+ex.question));
  host.appendChild(el('div','answertag','ANSWERS'));
  if(!S.ans[ex.id])S.ans[ex.id]={};
  R[ex.type].mount(host,ex,S.ans[ex.id]);
  var locked=!!S.checked[ex.id];
  if(locked){
    var ansbox=$('.ansbox',host);
    if(ansbox)ansbox.classList.add('locked');
    R[ex.type].feedback(host,ex,S.ans[ex.id],S.res[ex.id]);
    showExpl(ex);
  }else{
    byId('explBox').classList.add('hidden');
  }
  renderHintBox(ex);
  updateButtons(ex);
  renderBanners();
  renderHUD();
  var wrap=byId('exWrap');
  wrap.classList.toggle('blurred',S.manual);
  wrap.classList.remove('paused');
}
function updateButtons(ex){
  var m=!!S.manual;
  byId('btnPrev').disabled=m||(S.cur===0);
  byId('btnCheck').disabled=m||!!S.checked[ex.id];
  byId('btnRevise').hidden=!S.checked[ex.id];
  byId('btnHint').disabled=m||((S.hints[ex.id]||0)>=(ex.hints||[]).length)||!!S.checked[ex.id];
  byId('btnSkip').disabled=m;
  byId('btnNext').disabled=m;
  byId('btnNext').textContent=(S.cur===EXS.length-1)?'Finish & submit \u2192':'Next \u2192';
}
function showExpl(ex){
  var box=byId('explBox');
  var h='<h4>EXPLANATION</h4><div>'+ex.explanation+'</div>';
  if(ex.tips&&ex.tips.length){h+='<ul class="tip">'+ex.tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>';}
  box.innerHTML=h;
  box.classList.remove('hidden');
}
function renderHintBox(ex){
  var box=byId('hintBox');
  var n=S.hints[ex.id]||0;
  if(n===0){box.classList.add('hidden');box.innerHTML='';return;}
  var h='';
  for(var i=0;i<n;i++){h+='<div class="hitem">&#128161; '+(ex.hints[i]||'')+'</div>';}
  if(n<(ex.hints||[]).length)h+='<div class="hitem" style="color:var(--faint)">'+((ex.hints||[]).length-n)+' hint(s) left &mdash; each costs 10% of this exercise&rsquo;s points.</div>';
  box.innerHTML=h;box.classList.remove('hidden');
}
function check(){
  var ex=curEx();
  if(S.checked[ex.id])return;
  var st=S.ans[ex.id];
  var res=R[ex.type].validate(ex,st);
  S.res[ex.id]=res;S.checked[ex.id]=true;delete S.skipped[ex.id];
  var host=byId('exHost');
  R[ex.type].feedback(host,ex,st,res);
  var ansbox=$('.ansbox',host);if(ansbox)ansbox.classList.add('locked');
  showExpl(ex);
  S.checkPause=true;
  updateButtons(ex);renderBanners();renderHUD();
  var mx=exMax(ex);
  announce(res.earned>=mx-0.001?'Correct. Timer paused in review mode.':(res.earned>0?'Partially correct. Timer paused in review mode.':'Incorrect. Timer paused in review mode.'));
}
function revise(){
  var ex=curEx();
  if(!S.checked[ex.id])return;
  delete S.checked[ex.id];delete S.res[ex.id];
  mountCurrent();
}
function skip(){
  var ex=curEx();
  S.skipped[ex.id]=true;
  renderHUD();
  announce('Question skipped. You can return to it from the navigator.');
  if(S.cur===EXS.length-1){askSubmit();return;}
  S.cur++;S.checkPause=false;
  mountCurrent();
}
function goNext(){
  if(S.cur===EXS.length-1){askSubmit();return;}
  S.cur++;S.checkPause=false;
  mountCurrent();
}
function goPrev(){if(S.cur>0){S.cur--;S.checkPause=false;mountCurrent();}}
function jumpTo(i){
  if(i===S.cur)return;
  S.cur=i;S.checkPause=false;
  mountCurrent();
}
function togglePause(){
  if(!S||S.done)return;
  S.manual=!S.manual;
  byId('btnPause').innerHTML=S.manual?'&#9654; Resume':'&#9209; Pause';
  byId('exWrap').classList.toggle('blurred',S.manual);
  updateButtons(curEx());
  renderBanners();
  if(S.manual)announce('Exam paused manually. Exercise content is hidden while the clock is frozen.');
  else announce(S.checkPause?'Manual pause off. Timer stays paused in review mode until you press Next.':'Exam resumed.');
}

/* ============ submit / finish ============ */
function askSubmit(){
  var answered=0,skipped=0,unchecked=0;
  EXS.forEach(function(ex){
    if(S.skipped[ex.id]){skipped++;return;}
    if(S.checked[ex.id]){answered++;return;}
    if(!R[ex.type].isEmpty(ex,S.ans[ex.id]||{})){answered++;unchecked++;}
    else{skipped++;}
  });
  if(answered===0){
    modal('Nothing to submit','All questions are skipped or empty. Please answer at least one exercise before submitting.',null);
    return;
  }
  var extra=unchecked?(' '+unchecked+' answered-but-unchecked question(s) will be scored from their current state.'):'';
  modal('Submit exam?','Answered: '+answered+' &middot; Skipped (excluded from scoring): '+skipped+'.'+extra+' The timer will stop and your result will be shown.',function(){finishExam(false);});
}
function finishExam(auto){
  if(S.done)return;
  EXS.forEach(function(ex){
    if(S.skipped[ex.id])return;
    if(S.checked[ex.id])return;
    var st=S.ans[ex.id]||{};
    if(R[ex.type].isEmpty(ex,st)){S.skipped[ex.id]=true;return;}
    S.res[ex.id]=R[ex.type].validate(ex,st);S.checked[ex.id]=true;
  });
  var earned=0,total=0,skipped=[];
  EXS.forEach(function(ex){
    if(S.skipped[ex.id]){skipped.push(ex);return;}
    total+=exMax(ex);earned+=adjEarned(ex.id);
  });
  if(total===0&&!auto){
    modal('All questions skipped','Every exercise is skipped or empty, so there is nothing to grade. Answer at least one exercise before submitting.',null);
    return;
  }
  S.done=true;
  if(tickInt){clearInterval(tickInt);tickInt=null;}
  byId('exWrap').classList.remove('blurred');
  var correct=Math.round(earned);
  var percent=total>0?Math.round((correct/total)*100):0;
  var passed=total>0&&percent>=CFG.passMark;
  renderResults(earned,total,percent,passed,skipped,auto);
  reportScore(correct,total);
}
function reportScore(correct,total){
  if(window.parent===window)return;
  if(S.reported)return;
  S.reported=true;
  var percent=total>0?Math.round((correct/total)*100):0;
  var answered=0,skippedN=0;
  EXS.forEach(function(ex){if(S.skipped[ex.id])skippedN++;else if(S.checked[ex.id])answered++;});
  try{
    parent.postMessage({type:CFG.msgScore,examId:CFG.examId,topicId:CFG.topicId,attempt:ATTEMPT,version:CFG.version,
      username:I.username||null,country:I.country||null,batch:I.batch||null,locale:I.locale||null,
      score:correct,total:total,percent:percent,passed:total>0&&percent>=CFG.passMark,
      answered:answered,skipped:skippedN,timeUsedSec:CFG.seconds-S.left},I.origin||'*');
  }catch(e){/* standalone or blocked host: score stays on the page */}
}
function labelFor(ex){
  if(S.skipped[ex.id])return ['skipped','pill skipped'];
  var mx=exMax(ex),e=adjEarned(ex.id);
  if(e>=mx-0.001)return ['full','pill full'];
  if(e>0)return ['partial','pill partial'];
  return ['zero','pill zero'];
}
function renderResults(earned,total,percent,passed,skippedList,auto){
  var v=byId('viewResult');
  var h='<div class="card">';
  h+='<div class="reshead"><div><div class="bigpct">'+percent+'%</div><div style="color:var(--dim)">'+fmt1(earned)+' / '+fmt1(total)+' points (skipped questions excluded)</div></div>';
  h+='<div><span class="pill '+(passed?'pass':'fail')+'" style="font-size:15px;padding:8px 16px">'+(passed?'&#10003; PASS':'&#10007; FAIL')+'</span></div></div>';
  h+='<p style="margin-top:10px;font-size:14.5px;color:var(--dim)">'+(passed
    ?'Certificate-style pass. You reached the '+CFG.passMark+'% threshold on '+esc(CFG.sev)+' severity. Study the report below, especially any partial-scored exercises.'
    :'You did not reach the '+CFG.passMark+'% threshold. Review the report below, focus on the tips, then retake the exam &mdash; questions and answers are re-shuffled.')+'</p>';
  if(auto)h+='<p style="margin-top:6px;font-size:13px;color:var(--warn)">The timer reached zero and the exam was submitted automatically.</p>';
  if(skippedList.length>0){
    h+='<div class="skipnote"><b>Skipped &amp; excluded from scoring ('+skippedList.length+'):</b> ';
    h+=skippedList.map(function(ex){return esc(ex.title);}).join(' &middot; ');
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="card"><h2 style="font-size:18px;margin-bottom:8px">Per-exercise report</h2>';
  S.order.forEach(function(exi){
    var ex=EXS[exi];
    var lab=labelFor(ex);
    var mx=exMax(ex);
    var e=S.skipped[ex.id]?0:adjEarned(ex.id);
    h+='<div class="resitem">';
    h+='<div class="r1"><b>Q'+(S.order.indexOf(exi)+1)+'. '+esc(ex.title)+'</b><span class="'+lab[1]+'">'+lab[0]+'</span><span class="pts">'+fmt1(e)+' / '+fmt1(mx)+' pts'+((S.hints[ex.id]||0)?' (hint &minus;10% x'+S.hints[ex.id]+')':'')+'</span></div>';
    if(S.skipped[ex.id]){
      h+='<div class="r2"><span class="cap">Skipped:</span> not counted in your score.</div>';
    }else{
      h+='<div class="r2"><span class="cap">Your answer:</span> '+R[ex.type].answerSummary(ex,S.ans[ex.id]||{})+'</div>';
      h+='<div class="r2"><span class="cap">Correct:</span> '+R[ex.type].correctSummary(ex)+'</div>';
    }
    h+='<details><summary>Show explanation</summary><div class="expbody">'+ex.explanation;
    if(ex.tips&&ex.tips.length){h+='<ul class="tip">'+ex.tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>';}
    h+='</div></details>';
    h+='</div>';
  });
  h+='<div style="margin-top:12px"><button class="btn primary" id="btnRetake" type="button">Retake exam</button></div>';
  h+='<p style="margin-top:10px;font-size:12.5px;color:var(--faint)">'+esc(CFG.product)+' v'+esc(CFG.version)+' &middot; attempt '+ATTEMPT+' &middot; report generated locally, nothing was uploaded.</p>';
  h+='</div>';
  v.innerHTML=h;
  showView('viewResult');
  byId('btnRetake').addEventListener('click',retake);
  announce(auto?'Time is up. Exam finished. '+(passed?'Result: pass.':'Result: not passed.'):'Exam submitted. '+(passed?'Result: pass.':'Result: not passed.'));
}

}

/* ============ host handshake ============ */
var I={username:null,country:null,locale:null,topicId:null,batch:null,origin:null,ok:false};
function applyInit(d,origin){
  I.ok=true;if(origin)I.origin=origin;
  ['username','country','locale','topicId','batch'].forEach(function(k){
    if(d&&typeof d[k]==='string'&&d[k].trim())I[k]=d[k].trim();
  });
  if(d&&d.theme==='light')document.documentElement.classList.add('light');
  if(d&&d.theme==='dark')document.documentElement.classList.remove('light');
  var cb=byId('candBox');
  if(cb){
    var bits=[];
    if(I.username)bits.push(I.username);
    if(I.country)bits.push(I.country);
    if(I.batch)bits.push('batch '+I.batch);
    if(I.topicId)bits.push('topic '+I.topicId);
    if(bits.length){cb.textContent='Candidate: '+bits.join(' \u00b7 ');cb.classList.remove('hidden');}
  }
  if(!S||!S.started)renderIntro();
  try{
    if(window.parent!==window){
      parent.postMessage({type:CFG.msgReady,examId:CFG.examId,accepted:true,version:CFG.version,
        applied:{username:I.username,country:I.country,locale:I.locale,topicId:I.topicId,batch:I.batch,theme:(d&&d.theme)||null}},I.origin||'*');
    }
  }catch(e){/* standalone: nothing to acknowledge to */}
}
window.addEventListener('message',function(event){
  try{
    var d=event.data;
    if(!d||typeof d!=='object')return;
    if(d.type!==CFG.msgInit)return;
    applyInit(d,event.origin);
  }catch(e){/* malformed message: ignore, never break the exam */}
});

var TYPE_LABEL={qcm:'Single choice',multi:'Multi-select',match:'Matching',categorize:'Categorize',fill:'Fill the blanks',order:'Order the steps',rank:'Rank by priority',terminal:'Terminal task',logviewer:'Log analysis',triage:'Alert triage',branch:'Branching scenario',spot:'Spot the mistake',dual:'Dual perspective'};
function markNote(v){return v>=1?'<span class="marknote ok">&#10003; correct</span>':(v>=0.5?'<span class="marknote half">&#9888; half</span>':'<span class="marknote bad">&#10007; wrong</span>');}

/* ---------- shared choice list (qcm / multi / dual parts) ---------- */
function buildChoice(host,label,options,ord,multi,sel,onSel){
  var box=el('div','ansbox');
  box.appendChild(el('div','anslabel',label));
  var list=el('div','optlist');
  ord.forEach(function(oi){
    var b=el('button','opt');
    b.type='button';
    var isSel=multi?(sel&&sel[oi]):(sel===oi);
    if(isSel)b.classList.add('sel');
    b.setAttribute('aria-pressed',isSel?'true':'false');
    b.innerHTML='<span class="optmark">'+(multi?'&#9744;':'&#9678;')+'</span><span class="opttext">'+options[oi]+'</span>';
    b.addEventListener('click',function(){
      if(multi){
        sel=sel||{};
        if(sel[oi]){delete sel[oi];b.classList.remove('sel');}
        else{sel[oi]=true;b.classList.add('sel');}
        b.setAttribute('aria-pressed',sel[oi]?'true':'false');
      }else{
        sel=(sel===oi)?null:oi;
        $all('.opt',list).forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-pressed','false');});
        if(sel===oi){b.classList.add('sel');b.setAttribute('aria-pressed','true');}
      }
      onSel(sel);
    });
    list.appendChild(b);
  });
  box.appendChild(list);
  host.appendChild(box);
  return box;
}
function choiceValidateSingle(ex,st){
  var ok=st.sel===ex.correct;
  return {earned:ok?2:0,rows:[{label:'Single choice',ok:ok?1:0}]};
}
function choiceValidateMulti(ex,st){
  var earned=0,rows=[];
  ex.correct.forEach(function(ci){
    var got=!!(st.sel&&st.sel[ci]);
    if(got)earned++;
    rows.push({label:'Correct option: '+ex.options[ci],ok:got?1:0});
  });
  if(st.sel){Object.keys(st.sel).forEach(function(k){
    var ki=parseInt(k,10);
    if(ex.correct.indexOf(ki)<0)rows.push({label:'Wrong pick: '+ex.options[ki],ok:0});
  });}
  return {earned:earned,rows:rows};
}
function choiceFeedback(host,ex,st,res,opts){
  var list=$('.optlist',host);if(!list)return;
  var btns=$all('.opt',list);
  var ord=opts.ord,multi=opts.multi;
  ord.forEach(function(oi,i){
    var b=btns[i];if(!b)return;
    var isSel=multi?(st.sel&&st.sel[oi]):(st.sel===oi);
    var mark=null;
    if(multi){
      var isCorr=ex.correct.indexOf(oi)>=0;
      if(isCorr&&isSel){b.classList.add('ok');mark='<span class="marknote ok">&#10003; correct</span>';}
      else if(isCorr&&!isSel){b.classList.add('half');mark='<span class="marknote half">&#9888; missed</span>';}
      else if(!isCorr&&isSel){b.classList.add('bad');mark='<span class="marknote bad">&#10007; wrong pick</span>';}
    }else{
      if(oi===ex.correct){b.classList.add('ok');mark='<span class="marknote ok">&#10003; correct</span>';}
      else if(isSel){b.classList.add('bad');mark='<span class="marknote bad">&#10007; your pick</span>';}
    }
    if(mark)b.insertAdjacentHTML('beforeend',mark);
  });
}
function choiceAnsSummary(ex,st,opts){
  if(opts.multi){
    var sel=st.sel||{};var ks=Object.keys(sel);
    if(!ks.length)return '<span style="color:var(--faint)">nothing selected</span>';
    return '<ul style="margin-left:18px">'+ks.map(function(k){return '<li>'+opts.options[parseInt(k,10)]+'</li>';}).join('')+'</ul>';
  }
  return st.sel==null?'<span style="color:var(--faint)">nothing selected</span>':opts.options[st.sel];
}
function choiceCorSummary(ex,opts){
  if(opts.multi)return '<ul style="margin-left:18px">'+ex.correct.map(function(ci){return '<li>'+opts.options[ci]+'</li>';}).join('')+'</ul>';
  return opts.options[ex.correct];
}

/* ---------- QCM ---------- */
R.qcm={
  mount:function(host,ex,st){
    var l=L[ex.id];
    st.sel=(st.sel==null)?null:st.sel;
    buildChoice(host,'CHOOSE ONE',ex.options,l.ord,false,st.sel,function(v){st.sel=v;});
  },
  validate:function(ex,st){return choiceValidateSingle(ex,st);},
  feedback:function(host,ex,st){choiceFeedback(host,ex,st,null,{ord:L[ex.id].ord,multi:false});},
  isEmpty:function(ex,st){return st.sel==null;},
  answerSummary:function(ex,st){return choiceAnsSummary(ex,st,{options:ex.options,multi:false});},
  correctSummary:function(ex){return choiceCorSummary(ex,{options:ex.options,multi:false});}
};
/* ---------- MULTI ---------- */
R.multi={
  mount:function(host,ex,st){
    var l=L[ex.id];
    st.sel=st.sel||{};
    buildChoice(host,'SELECT ALL THAT APPLY &mdash; partial credit per correct pick',ex.options,l.ord,true,st.sel,function(v){st.sel=v||{};});
  },
  validate:function(ex,st){return choiceValidateMulti(ex,st);},
  feedback:function(host,ex,st){choiceFeedback(host,ex,st,null,{ord:L[ex.id].ord,multi:true});},
  isEmpty:function(ex,st){return !st.sel||Object.keys(st.sel).length===0;},
  answerSummary:function(ex,st){return choiceAnsSummary(ex,st,{options:ex.options,multi:true});},
  correctSummary:function(ex){return choiceCorSummary(ex,{options:ex.options,multi:true});}
};

/* ---------- MATCH ---------- */
R.match={
  mount:function(host,ex,st){
    var l=L[ex.id];
    st.place=st.place||{};st._selR=null;
    var box=el('div','ansbox');
    box.appendChild(el('div','anslabel','MATCH EACH ITEM &mdash; click a word, then its slot (or drag)'));
    var bank=el('div','chips');bank.setAttribute('aria-label','word bank');
    var slots=el('div','slots');
    box.appendChild(slots);box.appendChild(el('div','anslabel','WORD BANK'));
    box.appendChild(bank);host.appendChild(box);
    function redraw(){
      bank.innerHTML='';slots.innerHTML='';
      l.ord.forEach(function(ri){
        var used=false;Object.keys(st.place).forEach(function(k){if(st.place[k]===ri)used=true;});
        if(used)return;
        var c=el('button','chip'+(st._selR===ri?' sel':''),esc(ex.rights[ri]));
        c.type='button';c.draggable=true;
        c.addEventListener('click',function(){st._selR=(st._selR===ri)?null:ri;redraw();});
        c.addEventListener('dragstart',function(e){try{e.dataTransfer.setData('text/plain',String(ri));}catch(e2){}});
        bank.appendChild(c);
      });
      if(!bank.firstChild)bank.appendChild(el('span','kw','bank empty'));
      ex.lefts.forEach(function(lt,li){
        var row=el('div','slotrow');
        row.appendChild(el('span','slabel',lt));
        var pl=st.place[li];
        var s=el('button','slot'+(pl!=null?' filled':''),pl==null?'drop here':esc(ex.rights[pl]));
        s.type='button';
        s.addEventListener('click',function(){
          if(st._selR!=null){st.place[li]=st._selR;st._selR=null;}
          else if(pl!=null){delete st.place[li];}
          redraw();
        });
        s.addEventListener('dragover',function(e){e.preventDefault();s.classList.add('over');});
        s.addEventListener('dragleave',function(){s.classList.remove('over');});
        s.addEventListener('drop',function(e){e.preventDefault();var v=parseInt(e.dataTransfer.getData('text/plain'),10);if(!isNaN(v)){st.place[li]=v;st._selR=null;redraw();}});
        row.appendChild(s);
        slots.appendChild(row);
      });
    }
    redraw();
  },
  validate:function(ex,st){
    var earned=0,rows=[];
    ex.lefts.forEach(function(lt,li){
      var ok=st.place[li]===li;
      if(ok)earned++;
      rows.push({label:lt,ok:ok?1:0});
    });
    return {earned:earned,rows:rows};
  },
  feedback:function(host,ex,st){
    var slots=$all('.slot',host);
    var idx=0;
    ex.lefts.forEach(function(lt,li){
      var s=slots[idx++];if(!s)return;
      if(st.place[li]===li){s.classList.add('ok');s.insertAdjacentHTML('beforeend',' <b>&#10003;</b>');}
      else if(st.place[li]!=null){s.classList.add('bad');s.textContent=ex.rights[st.place[li]]+' \u2192 correct: '+ex.rights[li];s.insertAdjacentHTML('beforeend',' <b>\u2717 wrong</b>');}
      else{s.classList.add('half');s.textContent='not answered \u2192 correct: '+ex.rights[li];s.insertAdjacentHTML('beforeend',' <b>\u26a0 missed</b>');}
    });
  },
  isEmpty:function(ex,st){return Object.keys(st.place||{}).length===0;},
  answerSummary:function(ex,st){
    var out=ex.lefts.map(function(lt,li){
      var p=st.place[li];
      return esc(lt)+' &rarr; <b>'+(p!=null?esc(ex.rights[p]):'empty')+'</b>';
    }).join(' &middot; ');
    return out;
  },
  correctSummary:function(ex){
    return ex.lefts.map(function(lt,li){return esc(lt)+' &rarr; <b>'+esc(ex.rights[li])+'</b>';}).join(' &middot; ');
  }
};

/* ---------- ORDER / RANK ---------- */
function orderMount(host,ex,st,labelTop){
  var l=L[ex.id];
  st.arr=st.arr||l.disp.slice();
  st.touched=st.touched||false;
  var box=el('div','ansbox');
  box.appendChild(el('div','anslabel',labelTop));
  var rows=el('div','rows');box.appendChild(rows);host.appendChild(box);
  function redraw(){
    rows.innerHTML='';
    st.arr.forEach(function(oi,pos){
      var r=el('div','row');
      r.setAttribute('draggable','true');
      r.appendChild(el('span','pos',(pos+1)+'.'));
      r.appendChild(el('span','rtext',ex.steps[oi]));
      var btns=el('span','rbtns');
      var up=el('button','btn ghost','&uarr;');up.type='button';up.setAttribute('aria-label','move up');
      up.addEventListener('click',function(){if(pos>0){var t=st.arr[pos-1];st.arr[pos-1]=st.arr[pos];st.arr[pos]=t;st.touched=true;redraw();}});
      var dn=el('button','btn ghost','&darr;');dn.type='button';dn.setAttribute('aria-label','move down');
      dn.addEventListener('click',function(){if(pos<st.arr.length-1){var t=st.arr[pos+1];st.arr[pos+1]=st.arr[pos];st.arr[pos]=t;st.touched=true;redraw();}});
      btns.appendChild(up);btns.appendChild(dn);
      r.appendChild(btns);
      r.addEventListener('dragstart',function(e){try{e.dataTransfer.setData('text/plain',String(pos));}catch(e2){}});
      r.addEventListener('dragover',function(e){e.preventDefault();});
      r.addEventListener('drop',function(e){
        e.preventDefault();
        var from=parseInt(e.dataTransfer.getData('text/plain'),10);
        if(isNaN(from)||from===pos)return;
        var it=st.arr.splice(from,1)[0];
        st.arr.splice(pos,0,it);
        st.touched=true;
        redraw();
      });
      rows.appendChild(r);
    });
  }
  redraw();
}
function orderValidate(ex,st){
  var earned=0,rows=[];
  st.arr.forEach(function(oi,pos){
    var ok=oi===pos;
    if(ok)earned++;
    rows.push({label:ex.steps[oi],ok:ok?1:0});
  });
  return {earned:earned,rows:rows};
}
function orderFeedback(host,ex,st){

    var oi=st.arr[pos];
    var mk=el('span','rmk '+(oi===pos?'ok':'bad'),oi===pos?'\u2713':'\u2717');
    r.insertBefore(mk,r.firstChild);
    r.classList.add(oi===pos?'ok':'bad');
  });
}
function orderAnsSummary(ex,st){

}
function orderCorSummary(ex){

}

/* ---------- LOG VIEWER ---------- */
function hlLog(line){
  var s=esc(line);
  s=s.replace(/\b(ERROR|CRIT|CRITICAL|FAILED|FAIL|DENIED|DENY|ALERT|MALICIOUS|SUSPICIOUS)\b/g,'<span class="tok-bad">$1</span>');
  s=s.replace(/\b(WARN|WARNING)\b/g,'<span class="tok-warn">$1</span>');
  s=s.replace(/\b(OK|SUCCESS|ALLOWED|ACCEPTED|PASS)\b/g,'<span class="tok-ok">$1</span>');
  return s;
}
function logMount(host,ex,st,innerCfg,extraLabel){
  var box=el('div','ansbox');
  box.appendChild(el('div','anslabel',extraLabel||'FILTER THE LOGS (KIBANA-STYLE), THEN ANSWER BELOW'));
  var lb=el('div','logbox');
  var tools=el('div','logtools');
  var inp=el('input');
  inp.type='text';inp.spellcheck=false;inp.placeholder=ex.filterPh||'filter (case-insensitive substring)';
  inp.setAttribute('aria-label','log filter');
  tools.appendChild(inp);
  var cnt=el('span','lcount');
  tools.appendChild(cnt);
  lb.appendChild(tools);
  var lines=el('div','loglines');
  var rows=[];
  ex.logs.forEach(function(ln){
    var d=el('div','logline');
    d.innerHTML=hlLog(ln);
    lines.appendChild(d);rows.push({raw:ln,el:d});
  });
  lb.appendChild(lines);
  box.appendChild(lb);host.appendChild(box);
  function applyFilter(){
    var q=norm(inp.value);
    var n=0;
    rows.forEach(function(r){
      var show=!q||norm(r.raw).indexOf(q)>=0;
      r.el.classList.toggle('hidden',!show);
      if(show)n++;
    });
    cnt.textContent=n+' / '+rows.length+' lines';
  }
  inp.addEventListener('input',applyFilter);
  applyFilter();
}

/* ---------- BRANCH ---------- */
R.branch={
  mount:function(host,ex,st){
    var l=L[ex.id];
    st.path=st.path||[];
    var box=el('div','ansbox');
    box.appendChild(el('div','anslabel','WALK THE INCIDENT &mdash; each choice locks in and unlocks the next step'));
    var wrap=el('div');box.appendChild(wrap);host.appendChild(box);
    function redraw(){
      wrap.innerHTML='';
      st.path.forEach(function(sp,i){
        var node=ex.nodes[sp.node];
        var o=node.options[sp.opt];
        var d=el('div','stepdone','<b>Step '+(i+1)+':</b> '+esc(o.t)+'<br><span style="color:var(--faint)">'+esc(o.fb)+'</span>');
        wrap.appendChild(d);
      });
      var last=st.path.length?ex.nodes[st.path[st.path.length-1].node].options[st.path[st.path.length-1].opt].next:ex.start;
      var node=ex.nodes[last];
      if(!node||node.end){
        wrap.appendChild(el('div','outcome',node&&node.end?esc(node.text):''));
        if(st.path.length){
          var rk=el('button','btn ghost','&#8635; Restart scenario');
          rk.type='button';
          rk.addEventListener('click',function(){st.path=[];redraw();});
          wrap.appendChild(rk);
        }
        return;
      }
      var bn=el('div','bnode');
      bn.appendChild(el('div','bq',node.text));
      var list=el('div','optlist');
      node.options.forEach(function(o,oi){
        var b=el('button','opt');
        b.type='button';
        b.innerHTML='<span class="optmark">&#9656;</span><span class="opttext">'+o.t+'</span>';
        b.addEventListener('click',function(){
          st.path.push({node:last,opt:oi});
          redraw();
        });
        list.appendChild(b);
      });
      bn.appendChild(list);
      wrap.appendChild(bn);
    }
    redraw();
  },
  validate:function(ex,st){
    var ideal=L[ex.id].ideal;
    var earned=0,rows=[];
    var max=Math.max(ideal.length,st.path.length);
    for(var i=0;i<max;i++){
      var iv=0,pv=0;
      if(ideal[i])iv=ex.nodes[ideal[i].node].options[ideal[i].opt].val||0;
      if(st.path[i]){pv=ex.nodes[st.path[i].node].options[st.path[i].opt].val||0;}
      var nodeTxt=st.path[i]?ex.nodes[st.path[i].node].text:'step '+(i+1);
      if(pv>0)earned+=pv;
      rows.push({label:nodeTxt,ok:pv});
    }
    return {earned:earned,rows:rows};
  },
  feedback:function(host,ex,st,res){
    $all('.stepdone',host).forEach(function(d,i){
      var v=res.rows[i]?res.rows[i].ok:0;
      d.classList.add(v>=1?'ok':(v>=0.5?'half':'bad'));
      d.insertAdjacentHTML('beforeend',(v>=1?' <b style="color:var(--ok)">&#10003;</b>':(v>=0.5?' <b style="color:var(--warn)">&#9888; half</b>':' <b style="color:var(--bad)">&#10007;</b>')));
    });
  },
  isEmpty:function(ex,st){return !st.path||st.path.length===0;},
  answerSummary:function(ex,st){
    if(!st.path||!st.path.length)return '<span style="color:var(--faint)">no path taken</span>';
    return '<ol style="margin-left:18px">'+st.path.map(function(sp){
      return '<li>'+ex.nodes[sp.node].options[sp.opt].t+'</li>';
    }).join('')+'</ol>';
  },
  correctSummary:function(ex){
    var ideal=L[ex.id].ideal;
    return '<ol style="margin-left:18px">'+ideal.map(function(sp){
      return '<li>'+ex.nodes[sp.node].options[sp.opt].t+'</li>';
    }).join('')+'</ol>';
  }
};

/* ---------- DUAL ---------- */
R.dual={
  mount:function(host,ex,st){
    var l=L[ex.id];
    st.parts=st.parts||[];
    while(st.parts.length<ex.parts.length)st.parts.push({});
    ex.parts.forEach(function(p,i){
      var sec=el('div','card');
      sec.style.margin='10px 0';
      sec.appendChild(el('div','taglabel',p.role));
      sec.appendChild(el('div','question',p.q));
      host.appendChild(sec);
      var holder=el('div');
      host.appendChild(holder);
      if(p.inner.type==='qcm'){
        st.parts[i].sel=(st.parts[i].sel==null)?null:st.parts[i].sel;
        buildChoice(holder,'CHOOSE ONE',p.inner.options,l['ord'+i],false,st.parts[i].sel,function(v){st.parts[i].sel=v;});
      }else{
        st.parts[i].sel=st.parts[i].sel||{};
        buildChoice(holder,'SELECT ALL THAT APPLY &mdash; partial credit per correct pick',p.inner.options,l['ord'+i],true,st.parts[i].sel,function(v){st.parts[i].sel=v||{};});
      }
    });
  },
  validate:function(ex,st){
    var earned=0,rows=[];
    ex.parts.forEach(function(p,i){
      var ist=st.parts[i]||{};
      if(p.inner.type==='qcm'){
        var ok=ist.sel===p.inner.correct;
        if(ok)earned++;
        rows.push({label:p.role+': '+p.inner.options[p.inner.correct],ok:ok?1:0});
      }else{
        p.inner.correct.forEach(function(ci){
          var got=!!(ist.sel&&ist.sel[ci]);
          if(got)earned++;
          rows.push({label:p.role+' correct: '+p.inner.options[ci],ok:got?1:0});
        });
        if(ist.sel){Object.keys(ist.sel).forEach(function(k){
          var ki=parseInt(k,10);
          if(p.inner.correct.indexOf(ki)<0)rows.push({label:p.role+' wrong pick: '+p.inner.options[ki],ok:0});
        });}
      }
    });
    return {earned:earned,rows:rows};
  },
  feedback:function(host,ex,st,res){
    var hosts=$all('.ansbox',host);
    var idx=0;
    ex.parts.forEach(function(p,i){
      var box=hosts[i];if(!box)return;
      var list=$('.optlist',box);if(!list)return;
      var btns=$all('.opt',list);
      L[ex.id]['ord'+i].forEach(function(oi,k){
        var b=btns[k];if(!b)return;
        var multi=p.inner.type==='multi';
        var isSel=multi?(st.parts[i].sel&&st.parts[i].sel[oi]):(st.parts[i].sel===oi);
        if(multi){
          var isCorr=p.inner.correct.indexOf(oi)>=0;
          if(isCorr&&isSel){b.classList.add('ok');b.insertAdjacentHTML('beforeend','<span class="marknote ok">&#10003;</span>');}
          else if(isCorr&&!isSel){b.classList.add('half');b.insertAdjacentHTML('beforeend','<span class="marknote half">&#9888; missed</span>');}
          else if(!isCorr&&isSel){b.classList.add('bad');b.insertAdjacentHTML('beforeend','<span class="marknote bad">&#10007;</span>');}
        }else{
          if(oi===p.inner.correct){b.classList.add('ok');b.insertAdjacentHTML('beforeend','<span class="marknote ok">&#10003;</span>');}
          else if(isSel){b.classList.add('bad');b.insertAdjacentHTML('beforeend','<span class="marknote bad">&#10007;</span>');}
        }
      });
    });
  },
  isEmpty:function(ex,st){
    return (st.parts||[]).every(function(ist){
      return ist==null||(ist.sel==null)||(ist.sel&&!Object.keys(ist.sel).length&&!Array.isArray(ist.sel));
    })||!st.parts;
  },
  answerSummary:function(ex,st){
    return ex.parts.map(function(p,i){
      var ist=st.parts[i]||{};
      if(p.inner.type==='qcm')return esc(p.role)+': <b>'+(ist.sel!=null?esc(p.inner.options[ist.sel]):'none')+'</b>';
      var ks=ist.sel?Object.keys(ist.sel):[];
      return esc(p.role)+': <b>'+(ks.length?ks.map(function(k){return p.inner.options[parseInt(k,10)];}).join('; '):'none')+'</b>';
    }).join('<br>');
  },
  correctSummary:function(ex){
    return ex.parts.map(function(p){
      if(p.inner.type==='qcm')return esc(p.role)+': <b>'+esc(p.inner.options[p.inner.correct])+'</b>';
      return esc(p.role)+': <b>'+p.inner.correct.map(function(ci){return esc(p.inner.options[ci]);}).join('; ')+'</b>';
    }).join('<br>');
  }
};

})();
</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
