<script>
window.EXAM_DATA = {"meta":{"topicId":"secai-plus","examName":"Secure AI deployment environments","title":"Secure AI deployment environments — MEDIUM","chapterLabel":"2.2 Secure AI deployment environments","severity":"medium","passMark":70,"perQuestionSeconds":100,"introTag":"Chapter 2.2 · Apply best practices across on-premises, cloud, and hybrid AI infrastructures · CompTIA SecAI+ (CY0-001)","introSev":"This MEDIUM file holds 30 realistic exercises that need real reasoning — multi-step thinking over logs, policies, and live scenarios — but a prepared candidate can reach every correct path. Wrong answers are near-misses, not jokes. Each exercise is worth 10 points and shows its explanation after Check."},"keywords":[{"name":"On-premises AI infrastructure","items":["air-gapped training enclave","GPU cluster hardening","secure boot","TPM & measured boot","attestation","bastion / jump host","privileged access workstation","physical access controls","out-of-band management (iDRAC/iLO)","firmware & driver patching","media sanitization (NIST SP 800-88)","VLAN segmentation","dedicated HSM"]},{"name":"Cloud AI platform security","items":["SageMaker AI VPC mode","private subnet isolation","NAT egress control","VPC endpoints (gateway & interface)","endpoint policies","security groups & NACLs","AWS Network Firewall","AWS WAF","IAM roles & least privilege","service control policies (SCPs)","AWS KMS customer-managed keys","envelope encryption","key rotation","CloudTrail","GuardDuty","Security Hub","Inspector","Macie","Secrets Manager","STS & federation","EC2 Image Builder","API Gateway","Lambda"]},{"name":"Hybrid connectivity & data movement","items":["Direct Connect & MACsec","Site-to-Site VPN","Client VPN","Transit Gateway segmentation","Route 53 Resolver & DNS Firewall","VPC Flow Logs","DataSync","Amazon EFS","FSx for Lustre","S3 Block Public Access","S3 bucket policies","AWS Backup","data residency"]},{"name":"Containers & orchestration","items":["EKS hardening","pod security standards","network policies","IRSA (IAM Roles for Service Accounts)","container image scanning","immutable infrastructure"]},{"name":"Data protection for AI","items":["data classification","PII detection & redaction","tokenization","TLS in transit","encryption at rest","S3 versioning & Object Lock","presigned URL risk","training-data validation"]},{"name":"Monitoring, detection & response","items":["CloudWatch alarms","CloudTrail Lake queries","OpenSearch SIEM","Managed Grafana","Amazon Detective","automated remediation (Lambda, Step Functions, SNS)","NIST incident response phases","forensics & chain of custody"]},{"name":"Governance & compliance","items":["multi-account strategy","Control Tower guardrails","Config rules","Audit Manager","Artifact","Well-Architected Tool","Trusted Advisor","Service Catalog approved patterns","RAM sharing","tagging governance"]},{"name":"Secure model serving","items":["model registry access control","artifact signing & integrity","inference endpoint isolation","model theft controls (throttling, quotas)","prompt injection defenses","agent scope-down","drift monitoring","egress restriction"]}],"exercises":[{"id":"M01","type":"classify","theme":"On-premises infrastructure","kw":["TPM & measured boot","GuardDuty","Direct Connect & MACsec","media sanitization (NIST SP 800-88)","physical access controls","VLAN segmentation"],"title":"Base camp: sort the controls by environment","scenario":"Helios Robotics trains warehouse-robot models on an on-premises GPU enclave. Fine-tuning and inference run in AWS. The two worlds are joined by a Direct Connect link. The new security lead asks you to sort the control list before the architecture review.","question":"Drag every control onto the place where it lives: the <b>on-premises enclave<\/b>, the <b>AWS cloud side<\/b>, or the <b>hybrid link<\/b> between them.","cats":["On-premises enclave","AWS cloud side","Hybrid link"],"items":[{"t":"TPM measured-boot gate before a GPU node joins the cluster","c":0},{"t":"GuardDuty protection plans on the training account","c":1},{"t":"MACsec encryption on the Direct Connect circuit","c":2},{"t":"Physical access controls: badge, mantrap, CCTV at the enclave door","c":0},{"t":"Security group egress allow-list on SageMaker notebooks","c":1},{"t":"Transit Gateway route tables that isolate enclave subnets","c":2},{"t":"NIST SP 800-88 purge of disks from decommissioned GPU servers","c":0},{"t":"KMS customer-managed key on the model-artifacts bucket","c":1},{"t":"Route 53 Resolver DNS Firewall on the enclave resolvers","c":2}],"hint":"Ask one question per item: does it need to touch the GPU hardware, only the AWS account, or the wire between them?","expl":"<p><b>On-premises enclave:<\/b> TPM measured boot proves the boot chain before a node joins; physical access controls (badge, mantrap, CCTV) guard the door; VLAN segmentation keeps the GPU subnets apart from office networks; NIST SP 800-88 defines how media is purged when hardware leaves.<\/p><p><b>AWS cloud side:<\/b> GuardDuty watches account and network signals; security groups filter notebook traffic; a KMS CMK encrypts the artifact bucket.<\/p><p><b>Hybrid link:<\/b> MACsec encrypts layer 2 on Direct Connect; Transit Gateway route tables steer and isolate traffic between worlds; DNS Firewall filters name lookups that leave the enclave resolvers.<\/p><p class=\"focus\">Focus next: controls belong to a place. Naming the place first makes the design conversation fast.<\/p>"},{"id":"M02","type":"choice","theme":"Cloud platform security","kw":["SageMaker AI VPC mode","VPC endpoints (gateway & interface)","NAT egress control","private subnet isolation"],"title":"Stop the quiet training-data exit","scenario":"A SageMaker training notebook sits in a private subnet. Today its only route out is a NAT gateway with open internet egress, so the notebook can download packages from anywhere. The team is worried that a stolen training dataset could quietly leave the same way.","question":"Which redesign best keeps the dataset in while still letting the notebook pull the packages and data it needs?","choices":["Keep the NAT gateway but allow-list package domains on the Network Firewall, and encrypt the dataset bucket","Move the notebook to a public subnet so traffic is easier to see in Flow Logs","Remove internet egress: add an S3 gateway VPC endpoint plus interface endpoints for the needed services, and tighten security-group egress","Leave the design as is; KMS encryption on the dataset bucket is enough to stop exfiltration"],"correct":2,"hint":"Think about which path can carry data to the internet at all, not only who can read the bucket.","expl":"<p><b>Private subnet isolation<\/b> plus removing the internet path entirely: an S3 gateway endpoint keeps dataset traffic on the AWS network, interface endpoints serve the other APIs, and security-group egress denies everything else. Data has nowhere to go.<\/p><p><b>Why not the others:<\/b> allow-listing helps but a NAT path still exists, and encryption does not stop someone who can already read the data from copying it out. A public subnet makes things worse, not more visible. Encryption protects storage, it does not remove the exit door.<\/p><p class=\"focus\">Focus next: in AWS, egress design (VPC endpoints, no NAT) is the strongest anti-exfiltration control for training environments.<\/p>"},{"id":"M03","type":"spot","theme":"Detect & respond","kw":["CloudTrail","root user","S3 bucket policies","EC2 Image Builder"],"title":"CloudTrail triage on the model account","scenario":"You are on shift for the ml-models account. The morning CloudTrail export is below. Nothing looks broken: training ran, deployments ran. Filter it, then judge which events do not belong to normal operations.","artifacts":[{"kind":"log","title":"CloudTrail event export - account ml-models-prod (yesterday 22:00 - 06:00 UTC)","filter":true,"lines":["22:04:11 CreateTrainingJob  principal=role/sagemaker-exec source=10[.]20[.]4[.]17  job=robot-vision-d4","22:40:03 GetObject          principal=role/sagemaker-exec  bucket=helios-training-data  key=frames-0912.tar","23:02:57 PutModel           principal=role/pipeline-deploy registry=helios-vision  model=detector-7.3.1","23:15:44 ConsoleLogin       principal=root user  extra=SigninFailure,3  ip=198[.]51[.]100[.]77","23:31:20 DescribeInstances  principal=role/sagemaker-exec  region=eu-west-1","00:12:09 PutBucketPolicy    principal=root user  bucket=helios-model-registry  statement=Allow s3:GetObject to Principal \"*\"","00:41:52 GetObject          principal=role/unknown-contractor  bucket=helios-model-registry  key=detector-7.3.1.tar  ip=198[.]51[.]100[.]77","01:02:33 StartInferencePipeline principal=role/serving-router  endpoint=vision-prod-01","01:44:10 AssumeRole         principal=role/pipeline-deploy  target=role/sagemaker-exec  from=10[.]20[.]4[.]17","02:20:51 StopTrainingJob    principal=user/j.moreau  reason=manual stop, job stuck","03:05:38 CreateAccessKey    principal=root user  note=programmatic call from 198[.]51[.]100[.]77","03:44:02 GetBucketPolicy    principal=role/pipeline-deploy  bucket=helios-model-registry","04:10:17 GetObject          principal=role/sagemaker-exec  bucket=helios-training-data  key=frames-0913.tar","05:12:46 DeleteBucketPolicy principal=role/pipeline-deploy  bucket=helios-model-registry  note=reverted to baseline","05:41:29 StartImageBuild    principal=role/pipeline-deploy  pipeline=training-base-ami  note=EC2 Image Builder scheduled build"]}],"question":"Select the <b>three<\/b> lines that are real warning signs of compromise or dangerous change, not normal platform noise.","bad":[3,5,10],"hint":"The deployment pipeline and the training role act on a fixed schedule from internal addresses. Who acts outside that pattern, and with what privileges?","expl":"<p><b>Line 4 - root console login with failures from an external IP.<\/b> The root user should almost never log in, and never from the internet. Failures then success means someone is guessing or has the password.<\/p><p><b>Line 6 - PutBucketPolicy by root allowing GetObject to Principal \"*\".<\/b> This opens the model registry to everyone. Registry theft is the classic AI-state crime.<\/p><p><b>Line 11 - CreateAccessKey by root from the same external IP.<\/b> Making a long-lived key is exactly what an attacker does after a console login, so the access survives even if the password changes.<\/p><p>Everything else is scheduled platform work - the EC2 Image Builder AMI build, the deploy chain, a named engineer stopping a stuck job - normal noise.<\/p><p class=\"focus\">Focus next: root activity, Principal \"*\", and new long-lived keys are the three CloudTrail shapes you should never ignore.<\/p>"},{"id":"M04","type":"fib","theme":"Cloud platform security","kw":["SageMaker AI VPC mode","VPC endpoints (gateway & interface)","AWS KMS customer-managed keys","IAM roles & least privilege"],"title":"Complete the notebook hardening checklist","scenario":"A ticket (HLP-2287) asks you to harden the data-science SageMaker notebooks before a regulated project starts. The security architect already wrote the checklist; some words fell out during export.","question":"Fill every blank with a word from the bank. Click a word, then a blank (or just click words in order).","parts":["Put each notebook in a ",{"b":0}," subnet with no internet route, attach an S3 ",{"b":1}," VPC endpoint so dataset traffic never touches the internet, encrypt the notebook volume with a customer-managed ",{"b":2}," key, and give the execution role only the ",{"b":3}," privilege permissions that the project actually needs."],"blanks":["private","gateway","KMS","least"],"extra":["public","interface","root","broad"],"hint":"Two blanks describe network placement, one describes the key service, one is the golden rule of permissions.","expl":"<p><b>private subnet<\/b> - no direct internet path, so the notebook cannot be reached from outside.<\/p><p><b>gateway endpoint<\/b> - the S3 gateway endpoint is free and routes S3 traffic inside the AWS network; an interface endpoint also exists but the S3-native choice is gateway.<\/p><p><b>KMS<\/b> - a customer-managed KMS key lets your team control and rotate the key that protects the volume.<\/p><p><b>least<\/b> - least privilege means the role can read its one bucket and call its few APIs, nothing more. \"Public\", \"root\" and \"broad\" are the exact opposites of a hard checklist.<\/p><p class=\"focus\">Focus next: notebooks are workstations. Treat them like laptops: private, encrypted, minimal rights.<\/p>"},{"id":"M05","type":"branch","theme":"Data protection","kw":["S3 bucket policies","S3 Block Public Access","CloudTrail data events"],"title":"Incident drill: the bucket bleeds training data","scenario":"Sunday, 09:10. A bug bounty message says the bucket helios-training-data returns frame archives to anonymous users. The bucket holds 4 TB of labeled robot-camera frames. Walk the four decisions of the first hour.","nodes":[{"q":"A stranger emails: \"your bucket serves data to anyone.\" What do you do first?","opts":[{"t":"Open the bucket policy and CloudTrail data events to confirm what is exposed and who fetched it","ok":true,"fb":"Confirm first. You need scope and evidence before you touch anything."},{"t":"Delete the bucket immediately so the data is safe","ok":false,"fb":"Deleting destroys evidence and the data may be needed by teams. Scope first, act second."},{"t":"Patch all training hosts, the bucket cannot be the real problem","ok":false,"fb":"The report is specific. Patching hosts ignores the actual exposure."},{"t":"Forward the email to the team and wait for the next shift","ok":false,"fb":"Data exposure is urgent. Waiting extends the leak."}]},{"q":"Exposure is confirmed: the policy has a public Allow. What is the containment move?","opts":[{"t":"Remove the public statement and turn on Block Public Access at the bucket and account level","ok":true,"fb":"Correct - stop the serving path and add the guardrail that blocks this class of mistake."},{"t":"Delete the objects that were downloaded most often","ok":false,"fb":"You cannot know which files matter to the attacker; and deletion is not containment."},{"t":"Rotate the KMS key on the bucket","ok":false,"fb":"The data was served through a policy hole, not a key problem. Rotation is good hygiene, not containment here."},{"t":"Rename the bucket so old links break","ok":false,"fb":"The policy hole remains; the next link or listing finds it again."}]},{"q":"Now the leadership question: was data actually taken?","opts":[{"t":"Query CloudTrail data events and S3 server logs for anonymous GetObject calls and their volume","ok":true,"fb":"Yes - data events tell you who fetched what, when, and how much. That is your scope."},{"t":"Assume nobody noticed; the bug bounty report is the only visit","ok":false,"fb":"Never assume. Reports arrive days after discovery."},{"t":"Check the billing page for a traffic spike","ok":false,"fb":"Billing is a weak signal and far too coarse for evidence."},{"t":"Scan the dataset with Macie for PII","ok":false,"fb":"Useful follow-up for impact, but it does not answer \"was it taken?\""}]},{"q":"Scope confirmed: 63 GB fetched by three IPs. Close the hour with the right follow-up:","opts":[{"t":"Preserve the logs, notify per policy, and add a Config rule that fails any bucket without Block Public Access","ok":true,"fb":"Evidence, process, and a guardrail so it cannot quietly happen again."},{"t":"Nothing else - the hole is closed","ok":false,"fb":"Closing the hole is containment, not recovery. Governance and notification remain."},{"t":"Re-train the affected models from scratch as a precaution","ok":false,"fb":"Expensive and not indicated; the exposure was read access to frames."},{"t":"Change the bucket name and move on","ok":false,"fb":"Cosmetic. The missing guardrail is the real lesson."}]}],"hint":"The pattern is confirm, contain, scope, harden. If an option destroys evidence, it is wrong.","expl":"<p>The drill walks the first-hour loop: <b>confirm<\/b> the exposure with policy and data events, <b>contain<\/b> by removing the public statement and enabling Block Public Access, <b>scope<\/b> with CloudTrail data events (who fetched, how much), and <b>harden<\/b> with a Config rule plus required notification.<\/p><p>Deleting the bucket or objects destroys evidence. Billing and Macie answer different questions. \"Assume nobody came\" is the most expensive sentence in incident response.<\/p><p class=\"focus\">Focus next: for S3 leaks, data events (object-level logging) are the difference between knowing the scope and guessing it.<\/p>","question":"Walk the four decisions. At each step choose the single best action - the drill grades all four when you press Check at the end."},{"id":"M06","type":"match","theme":"Cloud platform security","kw":["Macie","Inspector","GuardDuty","Security Hub","Amazon Detective","Config rules"],"title":"Whose job is it? Match the service","scenario":"A new joiner mixed up the six AWS security services on the whiteboard. The board photo is below - drag each description onto the service that actually does that job.","cats":["Macie","Amazon Inspector","Amazon GuardDuty","AWS Security Hub","Amazon Detective","AWS Config"],"items":[{"t":"Finds sensitive data such as PII stored in S3 buckets","c":0},{"t":"Scans software and container images for known vulnerabilities","c":1},{"t":"Watches for malicious activity using threat-intelligence signals","c":2},{"t":"Collects findings from many tools into one score and standard","c":3},{"t":"Investigates the root cause of a finding across accounts","c":4},{"t":"Tracks resource configuration and flags drift from the baseline","c":5}],"hint":"Three of them watch (data, software, behavior), one aggregates, one investigates, one measures configuration.","expl":"<p><b>Macie<\/b> - data: it discovers and classifies sensitive data, classic use: find PII in training buckets.<\/p><p><b>Inspector<\/b> - software: vulnerability scanning for EC2, Lambda and container images.<\/p><p><b>GuardDuty<\/b> - behavior: continuous threat detection from VPC Flow Logs, DNS and CloudTrail signals.<\/p><p><b>Security Hub<\/b> - the aggregator: one place, one score, compliance standards like CIS.<\/p><p><b>Detective<\/b> - the investigator: it answers \"how did this happen?\" by linking findings to activity over time.<\/p><p><b>Config<\/b> - configuration: rules that check resources stay in the approved shape (encrypted, private, tagged).<\/p><p class=\"focus\">Focus next: exams love these six. Remember the pairs: data=Macie, software=Inspector, behavior=GuardDuty.<\/p>","question":"Drag each description onto the service whose job it describes."},{"id":"M07","type":"order","theme":"Secure model serving","kw":["model theft controls (throttling, quotas)","Detect & respond phases","VPC Flow Logs","forensics & chain of custody"],"title":"Contain the endpoint abuse - in the right order","scenario":"Alert: one API key made 4000 near-identical predict calls on the vision endpoint in 40 minutes. The pattern matches model extraction - someone trying to steal the model through the API. Order the six response steps.","order":["Snapshot the endpoint and gateway logs so the evidence does not roll away","Disable the API key that fired the alert and issue a replacement to its real owner","Attach a WAF rate-limit rule to the predict route","Use Flow Logs and gateway metrics to total how much data left during the window","Compare the call pattern against model-extraction indicators and decide if re-training keys must rotate","Write the lessons-learned note and tune the alert thresholds that fired late"],"hint":"Evidence first, stop the bleed second, then measure, analyze, and finally improve.","expl":"<p><b>1 Snapshot logs<\/b> - rolling logs lose evidence; copy first, and keep the copies under chain of custody.<\/p><p><b>2 Disable the key<\/b> - the attacker loses access while the honest owner gets a new key quickly.<\/p><p><b>3 WAF rate rule<\/b> - slows any other key or IP trying the same trick; cheap and immediate.<\/p><p><b>4 Measure the outflow<\/b> - Flow Logs plus gateway metrics tell you how many predictions (and how much model behavior) left.<\/p><p><b>5 Analyze<\/b> - decide whether extraction really succeeded and what secrets (keys, endpoints) need rotation.<\/p><p><b>6 Lessons learned<\/b> - alerts fired late; tuning them is the durable fix.<\/p><p class=\"focus\">Focus next: preserve before you purge. Every containment step that deletes state should come after a snapshot.<\/p>","question":"Drag the six steps into the order you would run them (first step on top)."},{"id":"M08","type":"spot","theme":"Identity & access","kw":["IAM roles & least privilege","security groups & NACLs","S3 bucket policies"],"title":"Review the JSON before it merges","scenario":"A teammate opened a merge request titled \"read-only access for the metrics service\". The change adds a security group rule and an IAM policy. Read the intent, then find the lines that betray it.","artifacts":[{"kind":"code","title":"merge request HLP-2311 - metrics service access","lines":["// Intent: metrics service may read model artifacts from one bucket, nothing else","\"Statement\": [{","  \"Effect\": \"Allow\",","  \"Action\": \"s3:GetObject\",","  \"Resource\": \"arn:aws:s3:::helios-model-registry/*\"","},{","  \"Effect\": \"Allow\",","  \"Action\": \"s3:*\",","  \"Resource\": \"arn:aws:s3:::helios-model-registry/*\"","}]","// security group for the metrics pod","\"Ingress\": [{ \"Port\": 443, \"Source\": \"10[.]20[.]8[.]0/22\" }],","\"Egress\":   [{ \"Port\": 443, \"Destination\": \"0[.]0[.]0[.]0/0\" }]","// note: egress left wide so updates are easy"]}],"question":"Select the <b>three<\/b> lines that break least privilege or the stated intent.","bad":[7,12,13],"hint":"One line gives far more S3 power than reading; two network lines do not match a read-only, one-bucket world.","expl":"<p><b>Line 8 - \"Action\": \"s3:*\".<\/b> The intent is read-only. s3:* also allows delete, put and policy change. GetObject alone matches the need.<\/p><p><b>Line 13 - Egress to 0[.]0[.]0[.]0/0 on 443.<\/b> The service only needs to reach the S3 endpoint. Wide egress is an open exit door for data.<\/p><p><b>Line 14 - the note \"egress left wide so updates are easy\".<\/b> Convenience is not a control; the comment itself shows the decision to skip hardening. (Line 12 ingress from the internal CIDR is fine.)<\/p><p class=\"focus\">Focus next: review diffs against the stated intent line by line - the dangerous line is usually one word: * .<\/p>"},{"id":"M09","type":"terminal","theme":"Detect & respond","kw":["bastion / jump host","log analysis","egress restriction"],"title":"Hunt the beacon in the gateway log","scenario":"During the enclave audit you suspect that a training node beacons out. The merged egress-gateway log for the shift is at /var/log/train-gateway.log. One user-agent string, updhelper, appears in traffic that no runbook explains.","artifacts":[{"kind":"log","title":"excerpt of /var/log/train-gateway.log (for shape only - the real file is on the jump host)","lines":["05:11:02 10[.]20[.]4[.]17 -> 23[.]61[.]190[.]8:443  agent=python-requests/2.31 bytes=1204","05:11:44 10[.]20[.]4[.]19 -> 140[.]82[.]121[.]4:443  agent=pip/24.0  bytes=88213","05:12:03 10[.]20[.]4[.]17 -> 23[.]61[.]190[.]8:443  agent=updhelper/1.2  bytes=512"]}],"question":"On the jump host, use a <code>grep<\/code> command to print every line of <code>/var/log/train-gateway.log<\/code> that mentions <code>updhelper<\/code>, <b>case-insensitive<\/b>, so the hunt also catches UpdHelper or UPDHELPER.","hostname":"analyst@enclave-jump","prompt":"analyst@enclave-jump:~$","ph":"type the grep command and press Check","cmdnote":"The command family is given: <code>grep<\/code>. Remember the flag that ignores case.","accepts":["^\\s*(sudo\\s+)?grep\\b[^|;&]*-i[a-zA-Z]*[^|;&]*updhelper","^\\s*(sudo\\s+)?grep\\b[^|;&]*updhelper[^|;&]*-i[a-zA-Z]*"],"canonical":"grep -i updhelper /var/log/train-gateway.log","alsoOk":"grep -iE updhelper /var/log/train-gateway.log","hint":"grep, the -i flag, then the search word and the file. That is the whole spell.","expl":"<p><code>grep -i updhelper /var/log/train-gateway.log<\/code> prints every line containing the agent name in any case. The <b>-i<\/b> flag matters: logs often mix cases, and a case-sensitive hunt silently misses hits.<\/p><p>On a real shift you would pipe it onward, for example to count hits or to extract the destination addresses for the blocklist.<\/p><p class=\"focus\">Focus next: a hunt command that can miss half the matches is worse than no command - always ask \"which flag makes this broader?\"<\/p>"},{"id":"M10","type":"multi","theme":"Detect & respond","kw":["GuardDuty","root user","CloudWatch alarms"],"title":"Shift queue: which alerts page the on-call now?","scenario":"It is 03:00 and you hold the pager. Six alerts queued during the night are below. Company policy: page immediately only for alerts that suggest active compromise or an outage of a serving endpoint.","question":"Select the <b>three<\/b> alerts that need an immediate page under the policy.","choices":["GuardDuty: CredentialAccess:IAMUser-AnomalousBehavior on role/ml-train-prod, confidence high","CloudWatch: notebook ml-dev-07 CPU utilization 82% for 20 minutes","CloudTrail: successful root console login, session without MFA, new IP 203[.]0[.]113[.]66","Config: 3 S3 buckets missing the cost-center tag","Serving: Bedrock endpoint 5xx rate 40% plus new egress flow to 198[.]51[.]100[.]9 from the serving subnet","Trusted Advisor: green check on MFA for all IAM users"],"correct":[0,2,4],"hint":"One alert is identity theft in progress, one is the crown-jewel login, one is a serving endpoint failing while talking to a stranger.","expl":"<p><b>Alert 1 - anomalous credential behavior on the production training role:<\/b> possible live credential misuse; that role touches datasets and the registry. Page.<\/p><p><b>Alert 3 - root console login without MFA from a new IP:<\/b> the root user is the master key of the account; an unauthenticated root session is account takeover until proven otherwise. Page.<\/p><p><b>Alert 5 - endpoint failing while egressing to a new address:<\/b> availability is broken and the flow suggests the host was redirected or compromised. Page.<\/p><p><b>Why not the others:<\/b> 82% CPU for 20 minutes is workload, not a compromise signal; missing tags violate governance, not security this minute; a green MFA check is good news.<\/p><p class=\"focus\">Focus next: triage = identity in use + crown jewels + availability. Tags and smooth CPU never wake anyone.<\/p>"},{"id":"M11","type":"choice","theme":"Identity & access","kw":["STS & federation","IAM roles & least privilege","Secrets Manager"],"title":"Contractors need GPU time, not keys","scenario":"Three external contractors will tune models on the enclave-adjacent AWS account for eight weeks. Someone proposed creating one IAM user, ml-contractor, with an access key, and sharing the key in the team chat.","question":"Which design gives the contractors the right access with the least standing risk?","choices":["Create the shared IAM user but store the key in Secrets Manager instead of the chat","Create IAM Identity Center users for each contractor, mapped to a permission set scoped to the training queue, yielding short-term STS credentials","Give each contractor the account root password but enable MFA on it","Create three IAM users with long-lived keys and individual password rotation every 90 days"],"correct":1,"hint":"Standing credentials that never expire are the real enemy here. Which option has none?","expl":"<p><b>IAM Identity Center + STS<\/b> is the right shape: every contractor is a named human (traceable), the permission set can expire with the project, and the credentials are short-lived STS tokens. Nothing long-lived exists to leak.<\/p><p><b>Why not the others:<\/b> a shared key in Secrets Manager is still one shared identity - no attribution, and rotation is a group email. Root for contractors is the strongest key in the account handed to the weakest trust. Long-lived IAM user keys will outlive the project and end up in a repo.<\/p><p class=\"focus\">Focus next: prefer identity that <i>expires by itself<\/i> (federation, STS) over identity someone must remember to rotate.<\/p>"},{"id":"M12","type":"classify","theme":"Detect & respond","kw":["GuardDuty","CloudWatch alarms","drift monitoring","Amazon EFS","Managed Grafana"],"title":"Alert queue triage: contain, investigate, or accept","scenario":"Your SOC queue for the AI platform holds six findings. Policy defines three lanes: <b>Contain now<\/b> (act within minutes), <b>Investigate today<\/b> (open a case), <b>Accepted noise<\/b> (known and approved). Sort them.","cats":["Contain now","Investigate today","Accepted noise"],"items":[{"t":"Inference endpoint hit 4000 times/hour by one key with identical payloads","c":0},{"t":"Successful SSH from the ops office IP to the enclave bastion, valid key","c":2},{"t":"Training role assumed from a new provider in another country at 04:12","c":1},{"t":"Model bucket policy updated by the deploy pipeline inside the approved change window","c":2},{"t":"Amazon EFS volume mounted by a security group that no runbook lists","c":0},{"t":"A Managed Grafana dashboard was edited by the SRE lead, no alerting change","c":1}],"hint":"Approved activity with a name and a window is noise. Reachable-and-unexplained is containment. Identity oddities from far away earn a case.","expl":"<p><b>Contain now:<\/b> the 4000-calls/hour pattern matches model extraction - throttle or revoke the key immediately. An Amazon EFS mount from an unknown security group means something new can touch training storage - cut the path while you look.<\/p><p><b>Investigate today:<\/b> a role assumed from another country can be a contractor on travel or a stolen token - odd identity geography deserves a case with Detective, not instant panic, since no data action is confirmed. A Managed Grafana dashboard edit by a named lead is explainable but untracked - log the case so change records stay honest.<\/p><p><b>Accepted noise:<\/b> valid SSH from the office to the bastion and pipeline policy changes inside the change window are the designed system working.<\/p><p class=\"focus\">Focus next: the lane depends on evidence and speed of harm, not on how scary the alert subject line sounds.<\/p>","question":"Drag every alert into its policy lane: Contain now, Investigate today, or Accepted noise."},{"id":"M13","type":"fib","theme":"Hybrid & data movement","kw":["Direct Connect & MACsec","Site-to-Site VPN","Transit Gateway segmentation","Route 53 Resolver & DNS Firewall","Client VPN"],"title":"Finish the hybrid link decision memo","scenario":"The architecture board asked for one paragraph explaining the hybrid design between the enclave and AWS. The memo is below - complete it with words from the bank.","question":"Fill every blank with a word from the bank.","parts":["For steady, high-throughput dataset sync we chose Direct ",{"b":0}," with MACsec; as an encrypted backup path over the internet we keep a Site-to-Site ",{"b":1},"; routes between the enclave segments and our cloud segments are controlled by Transit ",{"b":2}," so a compromised segment cannot see the others; and name lookups from the enclave are filtered by Route 53 DNS ",{"b":3}," before they leave."],"blanks":["Connect","VPN","Gateway","Firewall"],"extra":["Peering","Tunnel","Broker","Proxy"],"hint":"Four product words: one for the private fiber, one for the encrypted backup, one for routing, one for DNS filtering.","expl":"<p><b>Connect<\/b> - Direct Connect is the private circuit; with MACsec it encrypts layer 2 on that circuit.<\/p><p><b>VPN<\/b> - Site-to-Site VPN rides the internet inside an IPsec tunnel; it is the classic encrypted backup path.<\/p><p><b>Gateway<\/b> - Transit Gateway is the router hub; its route tables decide which segments can talk, which is segmentation.<\/p><p><b>Firewall<\/b> - Route 53 Resolver DNS Firewall filters and logs domain lookups, a cheap tripwire for beaconing. Remote administrators arrive through Client VPN with device checks - a different door for a different job.<\/p><p>The distractors name real concepts (VPC peering, tunnels, proxies) but none of them is the product doing that job in this memo.<\/p><p class=\"focus\">Focus next: hybrid security = path 1, path 2, the router in the middle, and the resolver - all four, on purpose.<\/p>"},{"id":"M14","type":"spot","theme":"Data protection","kw":["S3 bucket policies","TLS in transit","S3 Block Public Access","presigned URL risk"],"title":"Bucket policy review: the registry stays private","scenario":"Below is the proposed policy for helios-model-registry. The intent: reads only over TLS, only from inside the VPC endpoint; writes only for the pipeline role; public access impossible. Two lines betray the intent.","artifacts":[{"kind":"code","title":"proposed bucket policy - helios-model-registry","lines":["{","  \"Version\": \"2012-10-17\",","  \"Statement\": [","    { \"Sid\": \"DenyInsecure\",","      \"Effect\": \"Deny\",","      \"Principal\": \"*\",","      \"Action\": \"s3:*\",","      \"Resource\": [\"arn:aws:s3:::helios-model-registry\", \"arn:aws:s3:::helios-model-registry/*\"],","      \"Condition\": { \"Bool\": { \"aws:SecureTransport\": \"false\" } } },","    { \"Sid\": \"PipelineWrites\",","      \"Effect\": \"Allow\",","      \"Principal\": { \"AWS\": \"arn:aws:iam::111122233:role/pipeline-deploy\" },","      \"Action\": [\"s3:PutObject\"],","      \"Resource\": \"arn:aws:s3:::helios-model-registry/artifacts/*\" },","    { \"Sid\": \"EveryoneReads\",","      \"Effect\": \"Allow\",","      \"Principal\": \"*\",","      \"Action\": [\"s3:GetObject\"],","      \"Resource\": \"arn:aws:s3:::helios-model-registry/artifacts/*\" }","  ]","}"]}],"question":"Select the <b>two<\/b> lines that break the stated intent.","bad":[16,17],"hint":"The DenyInsecure and PipelineWrites statements are healthy. Ask who the last statement lets in.","expl":"<p><b>Line 17 and 18 - the \"EveryoneReads\" statement.<\/b> Principal \"*\" with s3:GetObject makes the registry public: any account, any anonymous request that passes TLS may download every model artifact. The whole point of the VPC-endpoint condition in the intent is dropped. These two lines are one statement - both carry the fault.<\/p><p>The <b>DenyInsecure<\/b> statement is a healthy guardrail: it denies all actions when SecureTransport is false, forcing TLS. The <b>PipelineWrites<\/b> statement is properly scoped to one role and one prefix. Watch presigned URLs too - they bypass the Allow side for their lifetime, so keep expiries short; the Deny statements still apply to them.<\/p><p class=\"focus\">Focus next: in bucket policies, an Allow with Principal \"*\" near GetObject is a public bucket - read to the last statement before approving.<\/p>"},{"id":"M15","type":"order","theme":"Data protection","kw":["data classification","Macie","PII detection & redaction","FSx for Lustre","DataSync","tokenization"],"title":"Protect the dataset, in order","scenario":"A new dataset of customer-adjacent images with metadata will be used for fine-tuning. Six steps make it safe for training. Put them in the order the pipeline should run them.","order":["Classify and label the dataset (what sensitivity is it?)","Scan the staging bucket with Macie for hidden PII","Redact or tokenize whatever Macie flagged","Encrypt with the project KMS key and land the clean copy in S3","Sync the clean copy to FSx for Lustre for fast training access","Enable versioning and Backup on the dataset bucket and record the lineage"],"hint":"Know it, find the sensitive parts, clean them, protect the clean copy, then move and keep it.","expl":"<p><b>1 Classify<\/b> - you cannot protect what you have not graded; classification decides how strict every later step is.<\/p><p><b>2 Macie scan<\/b> - machines find names, emails and ID numbers humans miss at 4 TB scale.<\/p><p><b>3 Redact or tokenize<\/b> - redaction blanks it out, tokenization replaces it with a harmless stand-in; both remove the risk while the data is still in staging, before it spreads.<\/p><p><b>4 Encrypt and land in S3<\/b> - the clean copy gets a KMS CMK at birth, not later.<\/p><p><b>5 Sync to FSx for Lustre<\/b> - DataSync moves the protected copy with integrity verification; high-throughput training reads happen on the Lustre scratch only.<\/p><p><b>6 Versioning, Backup, lineage<\/b> - now the dataset is an asset: recoverable and traceable. Scanning after sync or encrypting before cleaning would spread dirty or orderless data.<\/p><p class=\"focus\">Focus next: the order matters because every step assumes the one before it happened.<\/p>","question":"Drag the six steps into the order the pipeline must run them."},{"id":"M16","type":"fib","theme":"Data protection","kw":["AWS KMS customer-managed keys","key rotation","TLS in transit","envelope encryption","encryption at rest","dedicated HSM","artifact signing & integrity"],"title":"Lock the model artifacts - complete the design note","scenario":"The storage design note for model artifacts lost four words in a bad copy-paste. Rebuild it.","question":"Fill every blank with a word from the bank.","parts":["Artifacts are encrypted at rest with a customer-managed ",{"b":0}," key owned by the security team; we enable annual automatic key ",{"b":1}," so a leaked old key ages out; every download happens over ",{"b":2}," so artifacts are never readable on the wire; and with envelope encryption, data keys encrypt the objects while the CMK only protects the ",{"b":3}," keys."],"blanks":["KMS","rotation","TLS","data"],"extra":["S3","deletion","FTP","root"],"hint":"The service name, the maintenance habit, the transport protocol, and the kind of key the CMK wraps.","expl":"<p><b>KMS<\/b> - the key management service issues customer-managed keys (CMKs) you control and can audit in CloudTrail.<\/p><p><b>rotation<\/b> - annual automatic rotation gives new key material under the same key ID; old material stays for decryption of old objects.<\/p><p><b>TLS<\/b> - transport encryption for every read; the bucket policy usually denies requests with aws:SecureTransport false.<\/p><p><b>data<\/b> - envelope encryption: a data key encrypts each object; the CMK encrypts (wraps) the data keys. This keeps bulk encryption fast and key use centralized. For the highest-grade key custody, a dedicated HSM (CloudHSM) can hold root keys under your own control.<\/p><p>Related habits: sign model artifacts at publish time and verify at deploy (artifact signing &amp; integrity), so what you encrypt is also provably yours.<\/p><p class=\"focus\">Focus next: encryption at rest = KMS CMK, in transit = TLS, and the CMK protects data keys, not petabytes.<\/p>"},{"id":"M17","type":"classify","theme":"Detect & respond","kw":["NIST incident response phases","Security Hub","automated remediation (Lambda, Step Functions, SNS)"],"title":"Put the ticket notes on the IR timeline","scenario":"After the registry-policy incident, the responder dumped her notes as loose cards. NIST-style IR has four phases here: <b>Detection &amp; analysis<\/b>, <b>Containment<\/b>, <b>Eradication &amp; recovery<\/b>, <b>Post-incident activity<\/b>. Sort the notes.","cats":["Detection & analysis","Containment","Eradication & recovery","Post-incident activity"],"items":[{"t":"Security Hub raised the public-registry finding; you confirmed scope from data events","c":0},{"t":"Removed the public statement and enabled Block Public Access","c":1},{"t":"Rebuilt the deploy pipeline image after Inspector flagged the leaking dependency","c":2},{"t":"Endpoint re-opened to healthy traffic; serving monitored for a full day","c":2},{"t":"Scheduled a tabletop exercise for the registry-theft playbook","c":3},{"t":"Deployed a Step Functions runbook that auto-reverts public bucket statements and notifies via SNS","c":3}],"hint":"Two notes stop or restore, one pair discovers, the last pair makes sure it never repeats the same way.","expl":"<p><b>Detection & analysis:<\/b> the finding plus scoping from data events - you learned what happened and how big.<\/p><p><b>Containment:<\/b> removing the public statement and turning on Block Public Access stops the harm now.<\/p><p><b>Eradication & recovery:<\/b> fixing the root cause (rebuilding the pipeline image) and returning to healthy service under monitoring.<\/p><p><b>Post-incident:<\/b> a tabletop and an automated revert runbook are the changes that outlive the ticket. Automation (Step Functions + SNS) belongs here because it converts the lesson into a permanent control.<\/p><p class=\"focus\">Focus next: \"restore service\" and \"remove the cause\" are different steps - eradiation is not the same as containment.<\/p>","question":"Drag each note onto the NIST phase it belongs to."},{"id":"M18","type":"multi","theme":"Cloud platform security","kw":["VPC endpoints (gateway & interface)","endpoint policies","IAM roles & least privilege"],"title":"VPC endpoint truths","scenario":"Before the egress-hardening review, the team listed what they believe about VPC endpoints. Some statements are right, some are folklore.","question":"Select the <b>three<\/b> statements that are true.","choices":["An S3 gateway endpoint keeps GetObject traffic on the AWS network instead of the public internet","An interface endpoint creates elastic network interfaces with private IPs inside your subnets","An endpoint policy can restrict which buckets or principals may use the endpoint","Gateway endpoints are available for every AWS service","Adding a VPC endpoint removes the need for IAM permissions on the caller","Security groups cannot be attached to interface endpoints"],"correct":[0,1,2],"hint":"One statement confuses gateway and interface scope, one forgets IAM, one denies a basic property.","expl":"<p><b>True:<\/b> the S3 <b>gateway endpoint<\/b> routes S3 traffic privately (and is free); an <b>interface endpoint<\/b> is a set of ENIs with private IPs in your subnets; and an <b>endpoint policy<\/b> can limit which buckets, actions or principals work through it - a strong anti-exfiltration lever.<\/p><p><b>False:<\/b> gateway endpoints exist only for S3 and DynamoDB, not every service. Endpoints are network paths - IAM permissions still decide who may do what, so they never replace IAM. Interface endpoints do take security groups; that is how you lock their traffic.<\/p><p class=\"focus\">Focus next: gateway = S3/DynamoDB only; interface = ENI + SG + hourly cost; policies on top of IAM, not instead of it.<\/p>"},{"id":"M19","type":"spot","theme":"Hybrid & data movement","kw":["VPC Flow Logs","egress restriction","model theft controls (throttling, quotas)"],"title":"Flow logs show the leak","scenario":"The serving subnet is supposed to talk only to the API gateway and the model store. You pulled VPC Flow Logs for the window when the extraction alert fired. Three flows do not belong.","artifacts":[{"kind":"log","title":"VPC Flow Logs - serving subnet, accepted flows (window 03:40-04:05 UTC)","filter":true,"lines":["03:40:59 10[.]30[.]2[.]51 -> 10[.]30[.]9[.]10:443 ACCEPT 14 pkt 1902 bytes app=internal-api","03:43:19 10[.]30[.]2[.]51 -> 10[.]30[.]9[.]10:443 ACCEPT 9 pkt 1210 bytes app=internal-api","03:52:40 10[.]30[.]2[.]51 -> 198[.]51[.]100[.]44:443 ACCEPT 512 pkt 5123410 bytes app=unknown","03:55:12 10[.]30[.]2[.]51 -> 10[.]30[.]9[.]10:443 ACCEPT 15 pkt 2033 bytes app=internal-api","03:57:31 10[.]30[.]2[.]47 -> 10[.]30[.]9[.]10:443 ACCEPT 8 pkt 1102 bytes app=internal-api","03:58:44 10[.]30[.]2[.]51 -> 198[.]51[.]100[.]44:443 ACCEPT 620 pkt 6340112 bytes app=unknown","04:01:03 10[.]30[.]2[.]51 -> 198[.]51[.]100[.]44:443 ACCEPT 701 pkt 7410993 bytes app=unknown","04:02:56 10[.]30[.]2[.]47 -> 10[.]30[.]9[.]10:443 ACCEPT 11 pkt 1488 bytes app=internal-api","04:04:20 10[.]30[.]2[.]51 -> 10[.]30[.]9[.]10:443 ACCEPT 10 pkt 1354 bytes app=internal-api"]}],"question":"Select the <b>three<\/b> flow lines that show data leaving the serving subnet to an unknown internet host.","bad":[2,5,6],"hint":"Filter on 198[.]51[.]100[.]44 - then check that you caught every line with it.","expl":"<p><b>Lines 4, 7 and 8<\/b> show the serving host 10[.]30[.]2[.]51 sending multi-megabyte accepted flows to 198[.]51[.]100[.]44 on 443, labeled app=unknown. Internal traffic goes to 10[.]30[.]9[.]10 - everything to that public address with growing byte counts is the exfiltration path that pairs with the extraction alert.<\/p><p>Flow Logs here prove reachability and volume: source, destination, port, packets, bytes, ACCEPT. They do not prove content - but the volume pattern (megabytes per flow to one new address) is enough for containment.<\/p><p class=\"focus\">Focus next: in Flow Logs, hunt destinations that are (a) new, (b) public, and (c) receiving bytes - and check for ALL lines, not the first one.<\/p>"},{"id":"M20","type":"match","theme":"Secure model serving","kw":["prompt injection defenses","training-data validation","S3 versioning & Object Lock","Secrets Manager","Config rules"],"title":"Match the threat to its control","scenario":"The platform risk register lists six threats for the AI platform. Match each threat to the control that most directly reduces it.","cats":["API Gateway throttling + per-key quotas","Bedrock Guardrails on the app","Dataset validation job before promotion","S3 versioning + AWS Backup","Secrets Manager with rotation","Config rule on bucket encryption"],"items":[{"t":"Model theft through massive API scraping","c":0},{"t":"Jailbreak text that makes the assistant leak its instructions","c":1},{"t":"Poisoned rows that slip into a fine-tune dataset","c":2},{"t":"A fat-finger delete of the model-registry bucket","c":3},{"t":"A database credential pasted into a notebook cell","c":4},{"t":"A team quietly creating an unencrypted dataset bucket","c":5}],"hint":"Throttle the floods, filter the words, check the data, back up the objects, rotate the secrets, watch the config.","expl":"<p><b>Throttling + quotas<\/b> make extraction slow and expensive - the practical anti-theft control at the API layer.<\/p><p><b>Bedrock Guardrails<\/b> filters prompt-injection and jailbreak content before it reaches or leaves the model.<\/p><p><b>Dataset validation<\/b> (schema, source, label-distribution checks) catches poisoned rows before promotion to training.<\/p><p><b>Versioning + Backup<\/b> keep every overwritten or deleted object recoverable.<\/p><p><b>Secrets Manager<\/b> removes pasted credentials: short-lived, auto-rotated, fetched at runtime.<\/p><p><b>Config rule<\/b> flags unencrypted or public buckets continuously, so drift is found by a robot, not by accident.<\/p><p class=\"focus\">Focus next: controls are chosen by the threat they stop, not by the fashion of the week.<\/p>","question":"Drag each threat onto the control that most directly reduces it."},{"id":"M21","type":"branch","theme":"On-premises infrastructure","kw":["air-gapped training enclave","firmware & driver patching","secure boot","attestation"],"title":"The air-gapped enclave wants new drivers","scenario":"The air-gapped GPU enclave runs an isolated training rack. No internet path exists by design. The GPU vendor published a security driver update for a vulnerable kernel module. Walk the four decisions.","nodes":[{"q":"How does the update enter the enclave?","opts":[{"t":"Verify the vendor signature and hash against the ticket, then transfer on dedicated, sanitized media through the diode","ok":true,"fb":"Signed, verified, dedicated media - the enclave stays clean."},{"t":"Download on any office laptop and copy via the nearest USB stick","ok":false,"fb":"That is how air gaps die - unverified media from a general-purpose machine."},{"t":"Open a temporary internet path on the enclave firewall for the download","ok":false,"fb":"A temporary hole is a permanent temptation; the design exists for a reason."},{"t":"Email the driver to the enclave mailbox server","ok":false,"fb":"The enclave should have no mailbox path for binaries; media plus signature is the controlled route."}]},{"q":"Secure boot is enabled. The new module is not signed by the old key store. What now?","opts":[{"t":"Import the vendor key into the approved MOK key store as part of the change, then keep secure boot on","ok":true,"fb":"Right - trust the vendor key deliberately; never switch the protection off."},{"t":"Disable secure boot on all nodes until the module loads","ok":false,"fb":"Disabling secure boot removes the guarantee for everything else that boots."},{"t":"Compile the module locally with debug signing and load it anyway","ok":false,"fb":"Self-signed debug keys make attestation meaningless."},{"t":"Ship the module without any verification to keep the schedule","ok":false,"fb":"An unsigned module in a secure-boot fleet is the incident you just avoided."}]},{"q":"Where do you install first?","opts":[{"t":"On one canary node in the lab segment, with rollback media ready","ok":true,"fb":"Canary first: the blast radius of a bad driver is one lab node."},{"t":"On all 64 training nodes in parallel to finish before the weekend","ok":false,"fb":"A bad module on 64 nodes at once is a self-inflicted outage."},{"t":"On the node with the scheduler service, it is the most powerful","ok":false,"fb":"The scheduler is the worst canary - if it fails, the fleet stops."},{"t":"Skip testing; the vendor signed it","ok":false,"fb":"A signature proves origin, not compatibility with your stack."}]},{"q":"The canary passed. How does the fleet accept the change?","opts":[{"t":"Re-measure and re-attest each node (TPM PCR baseline update) before it rejoins the training pool","ok":true,"fb":"Attestation catches anything that changed; the fleet proves its own integrity."},{"t":"Trust the process; attestation records can stay as they were","ok":false,"fb":"Stale baselines make future attestation comparisons blind to this change."},{"t":"Only update the baseline on nodes that feel slow","ok":false,"fb":"Integrity is measured, never felt."},{"t":"Turn off attestation checks for the fleet to save time","ok":false,"fb":"That deletes the control the enclave was built around."}]}],"hint":"The thread is verify, keep protections on, canary, then prove the fleet with fresh measurements.","expl":"<p>The drill enforces four habits for air-gapped patching: <b>verified transfer<\/b> (signature + hash + dedicated media), <b>protections stay on<\/b> (import the vendor key into the MOK store rather than disabling secure boot), <b>canary first<\/b> (blast radius one lab node), and <b>re-attestation<\/b> (TPM PCR baselines updated so every node proves its new, known-good state before joining the pool).<\/p><p>Every wrong option trades a permanent control for a temporary convenience - the classic enclave failure pattern.<\/p><p class=\"focus\">Focus next: in an air gap, the media, the signature, the canary and the attestation record are the four locks. Any one shortcut undoes the other three.<\/p>","question":"Decide the four steps of the driver-update request, in order."},{"id":"M22","type":"fib","theme":"Secure model serving","kw":["agent scope-down","IAM roles & least privilege","VPC endpoints (gateway & interface)"],"title":"Scope down the Bedrock agent","scenario":"An internal assistant runs on a Bedrock agent with an action group. Security flagged the role as over-broad. Complete the fix.","question":"Fill every blank with a word from the bank.","parts":["The agent role now trusts only the ",{"b":0}," service principal; its policy allows retrieval on one knowledge-base ",{"b":1}," ARN instead of every resource; it can invoke exactly one Lambda ",{"b":2}," for its action group; and a ",{"b":3}," block denies any call that does not arrive through the approved VPC endpoint."],"blanks":["Bedrock","resource","function","condition"],"extra":["root","account","bucket","tag"],"hint":"The service, the ARN type, the compute unit it may call, and the policy element that adds \"only if\".","expl":"<p><b>Bedrock<\/b> - trust only the Bedrock service principal; a role trusted by more services is a wider attack surface.<\/p><p><b>resource<\/b> - scoping to one knowledge-base ARN means the agent cannot read the other nine knowledge bases in the account.<\/p><p><b>function<\/b> - one Lambda function per action group: the agent can act, but only inside its job.<\/p><p><b>condition<\/b> - a condition block (for example on aws:SourceVpce) denies everything that does not come through the private endpoint, so the role cannot be abused from elsewhere.<\/p><p class=\"focus\">Focus next: scope an agent like a junior employee on their first week: one job, one place, one door, with an \"only if\" attached.<\/p>"},{"id":"M23","type":"order","theme":"Governance & compliance","kw":["root user","S3 Block Public Access","GuardDuty","tagging governance"],"title":"Patch these first - rank the findings","scenario":"Monday stand-up: six findings from Security Hub and Trusted Advisor on the table, one sprint. Rank them from most urgent (top) to least urgent (bottom).","order":["Root user has active access keys, and one was used last week","Dataset bucket with customer PII is publicly readable","Inference endpoint accepts requests with no authentication at all","Bastion security group allows SSH from any address","Model-registry bucket has versioning disabled","Eleven resources are missing the mandatory cost-center tag"],"hint":"Ask two questions per finding: how fast can it be abused, and how big is the blast radius when it is.","expl":"<p><b>1 Root access keys, actively used<\/b> - the master key of the account used in the wild; one key equals total takeover. Delete or lock today.<\/p><p><b>2 Public PII bucket<\/b> - direct, silent, large-scale data exposure; closure takes minutes.<\/p><p><b>3 Unauthenticated inference endpoint<\/b> - anyone can use (and abuse) a production model; theft and cost risks.<\/p><p><b>4 SSH from any address<\/b> - brute-force surface, but scoped to one host with (hopefully) keyed auth.<\/p><p><b>5 Versioning disabled<\/b> - a resilience gap, not an open door; recovery still exists via Backup if configured.<\/p><p><b>6 Missing tags<\/b> - governance hygiene; matters for audits, not for attackers this week.<\/p><p class=\"focus\">Focus next: identity compromise and open data doors outrank hardening gaps, which outrank hygiene.<\/p>","question":"Drag the findings so the most urgent sits on top and the least urgent at the bottom."},{"id":"M24","type":"spot","theme":"Identity & access","kw":["IAM roles & least privilege","model registry access control","VPC endpoints (gateway & interface)"],"title":"Model registry IAM policy: two lines betray the design","scenario":"The registry team wants: the serving role can read artifacts; the CI role can publish; both only through the private endpoint. The proposed identity policy is below. Two lines break it.","artifacts":[{"kind":"code","title":"proposed policy attached to role/model-registry-access","lines":["{","  \"Version\": \"2012-10-17\",","  \"Statement\": [","    { \"Sid\": \"ReadArtifacts\",","      \"Effect\": \"Allow\",","      \"Action\": [\"s3:GetObject\"],","      \"Resource\": \"arn:aws:s3:::helios-model-registry/*\" },","    { \"Sid\": \"PublishArtifacts\",","      \"Effect\": \"Allow\",","      \"Action\": [\"s3:PutObject\"],","      \"Resource\": \"arn:aws:s3:::helios-model-registry/artifacts/*\" },","    { \"Sid\": \"AnythingAnywhere\",","      \"Effect\": \"Allow\",","      \"Action\": \"*\",","      \"Resource\": \"*\" }","  ]","}"]}],"question":"Select the <b>two<\/b> lines that break least privilege and drop the private-endpoint requirement.","bad":[13,14],"hint":"The first two statements are healthy. What does a statement with Action * and Resource * actually grant?","expl":"<p><b>Lines 14 and 15 - the \"AnythingAnywhere\" statement:<\/b> Action * on Resource * makes every other statement decorative. This role can delete buckets, change KMS keys, assume roles - anything, from anywhere, with no VPC-endpoint condition. It is a full admin grant hiding behind a careful-looking policy.<\/p><p>Even without it, note that the policy has no condition restricting calls to the VPC endpoint (aws:SourceVpce) - the review should add that. But the wildcard statement is the fault this exercise targets.<\/p><p class=\"focus\">Focus next: scan IAM policies for a statement whose Resource is \"*\" - most over-privilege in the wild hides exactly there.<\/p>"},{"id":"M25","type":"fib","theme":"Detect & respond","kw":["Security Hub","Amazon Detective","automated remediation (Lambda, Step Functions, SNS)","CloudTrail Lake queries","OpenSearch SIEM"],"title":"Fill the response playbook sentences","scenario":"The SOC playbook lost its key nouns in a template mishap. Rebuild the sentences.","question":"Fill every blank with a word from the bank.","parts":["When Security Hub raises a ",{"b":0}," severity finding, the on-call acknowledges within 15 minutes; GuardDuty findings are enriched and root-caused in ",{"b":1},"; containment actions execute through a ",{"b":2}," runbook so humans approve, machines act; and the twelve-month audit trail for every query lives in CloudTrail ",{"b":3},"."],"blanks":["Critical","Detective","Step Functions","Lake"],"extra":["Informational","Macie","KMS","personal inbox"],"hint":"A severity word, an investigation service, an orchestration service, and the place CloudTrail stores long-term.","expl":"<p><b>Critical<\/b> - the playbooks reserve 15-minute acknowledgment for critical findings; informational waits for business hours.<\/p><p><b>Detective<\/b> - GuardDuty tells you something happened; Detective links identities, IPs and resources to show how.<\/p><p><b>Step Functions<\/b> - orchestration keeps containment repeatable and auditable; ad-hoc scripts do not survive shifts.<\/p><p><b>Lake<\/b> - CloudTrail Lake stores events for years with SQL querying - the audit-grade archive (normal CloudTrail trails are shorter-lived). Longer hunts across sources live in the OpenSearch SIEM.<\/p><p class=\"focus\">Focus next: playbook = trigger severity, investigation tool, orchestrated action, immutable record.<\/p>"},{"id":"M26","type":"choice","theme":"Governance & compliance","kw":["service control policies (SCPs)","data residency","multi-account strategy","Control Tower guardrails","Service Catalog approved patterns","RAM sharing"],"title":"Keep the training data in the region","scenario":"Legal confirms: EU customer data used for fine-tuning must never be processed or stored outside EU regions. Teams keep \"temporarily\" copying datasets to US regions for experiments.","question":"Which control most reliably enforces the residency rule for the whole organization?","choices":["A service control policy on the organization that denies actions outside the approved EU regions","Encrypting all datasets with a KMS key, since encrypted data is compliant anywhere","A CloudFront geo-restriction so only EU users can open the web app","A monthly tag audit reminding teams which buckets are EU-relevant"],"correct":0,"hint":"Which option makes the forbidden action impossible for every IAM principal, including admins of team accounts?","expl":"<p><b>An SCP denying non-EU regions<\/b> is preventive and organization-wide: no user, role or even account admin inside the org can invoke services outside the approved regions while it is attached. Residency becomes a property of the platform, not of team discipline.<\/p><p><b>Why not the others:<\/b> encryption protects content but the data (and processing) still happens in the wrong place; geo-restriction filters web users, not where storage or compute runs; monthly audits are detective and easy to survive for 30 days at a time.<\/p><p>Deployment notes: the SCP is usually rolled out as a Control Tower guardrail on the landing zone, teams build only from Service Catalog approved patterns, and RAM sharing of subnets keeps shared networks inside the same governance.<\/p><p class=\"focus\">Focus next: residency, like safety rails, works best when it is impossible to bypass rather than policy to remember. SCPs and org-level controls are the tool.<\/p>"},{"id":"M27","type":"classify","theme":"Governance & compliance","kw":["AWS WAF","AWS Network Firewall","service control policies (SCPs)","GuardDuty","Macie","Audit Manager"],"title":"Preventive, detective, or audit?","scenario":"Before the control-framework mapping workshop, sort nine controls by their nature: they either <b>stop<\/b> an action, <b>spot<\/b> it, or <b>prove<\/b> it was governed.","cats":["Preventive - stops it","Detective - spots it","Audit & assurance - proves it"],"items":[{"t":"WAF rule blocking SQL-injection patterns at the edge","c":0},{"t":"GuardDuty finding on anomalous API usage","c":1},{"t":"SCP denying region transfer of regulated data","c":0},{"t":"Macie alerting on PII discovered in a training bucket","c":1},{"t":"Audit Manager continuous evidence collection for ISO 27001","c":2},{"t":"AWS Artifact providing compliance reports from AWS","c":2},{"t":"Network Firewall dropping traffic to known-bad domains","c":0},{"t":"Config rule flagging unencrypted S3 buckets","c":1},{"t":"Well-Architected Tool review documenting security pillar gaps","c":2}],"hint":"If it blocks, it is preventive. If it watches and raises a hand, detective. If its output is paperwork an auditor accepts, assurance.","expl":"<p><b>Preventive:<\/b> WAF and Network Firewall actively drop malicious traffic; an SCP makes forbidden actions impossible before any request runs.<\/p><p><b>Detective:<\/b> GuardDuty, Macie and Config evaluate and raise findings - they tell you after (or while) something happens.<\/p><p><b>Audit & assurance:<\/b> Audit Manager collects evidence continuously; Artifact delivers AWS-side compliance reports; the Well-Architected review documents gaps and plans - none of them stop an attack, all of them prove governance.<\/p><p class=\"focus\">Focus next: control-type mapping is a favorite exam question - ask \"does it block, bark, or document?\"<\/p>","question":"Drag each control into its nature: preventive, detective, or audit & assurance."},{"id":"M28","type":"spot","theme":"On-premises infrastructure","kw":["air-gapped training enclave","firmware & driver patching","out-of-band management (iDRAC/iLO)","privileged access workstation","GPU cluster hardening"],"title":"Runbook review: enclave patch day","scenario":"The updated patch-day runbook for the GPU enclave arrived for review. The intent: patches enter verified, out-of-band management stays trusted, and admin access stays on dedicated machines. Three steps betray the intent.","artifacts":[{"kind":"code","title":"runbook v3 - enclave patch day (steps in execution order)","lines":["1. Pull the patch bundle hash from the vendor portal on a standard office laptop","2. Verify the bundle hash against the change ticket on the privileged access workstation","3. Write the bundle to dedicated, sanitized transfer media","4. Carry the media through the enclave diode; scan media on the enclave scanner","5. Apply the patch to one lab node; reboot; check the service log only","6. Update the out-of-band (iDRAC) firmware on all nodes during the same window","7. Use the shared iDRAC admin password for the firmware flash","8. Let any team member run the flash from their normal workstation via the office VPN"]}],"question":"Select the <b>three<\/b> numbered steps that violate enclave best practices.","bad":[0,6,7],"hint":"One step puts the hash on the wrong machine, one step reuses a shared secret, one step administers hardware from the wrong place.","expl":"<p><b>Step 1 - hash pulled on a standard office laptop:<\/b> the reference value must come through a controlled channel to the PAW; a general-purpose laptop is a malware-friendly place to source a trust anchor.<\/p><p><b>Step 7 - shared iDRAC password:<\/b> out-of-band management is the master control of the rack; shared credentials mean no attribution and no clean revocation when someone leaves.<\/p><p><b>Step 8 - flashing from normal workstations over VPN:<\/b> infrastructure that powerful is administered from privileged access workstations with session recording - not from the same machines people read email on.<\/p><p>Steps 2-6 are healthy: verify on the PAW, dedicated media, the diode, canary patching, planned OOB firmware work - that is GPU cluster hardening as a routine, not a reaction.<\/p><p class=\"focus\">Focus next: the enclave chain is only as strong as the machines and identities allowed near it - PAW for admin, dedicated media for data, individual credentials everywhere.<\/p>"},{"id":"M29","type":"spot","theme":"Secure model serving","kw":["model theft controls (throttling, quotas)","API Gateway","CloudWatch alarms"],"title":"Who is scraping the endpoint?","scenario":"The load balancer access log for the public predict route is below. Honest traffic varies in size and timing. Extraction campaigns look like machines: uniform requests, uniform sizes, one identity, no gaps. Find the scraper lines.","artifacts":[{"kind":"log","title":"ELB access log - predict route (04:00-04:12 UTC, shortened)","filter":true,"lines":["04:00:11 key=k_a91f predict 200 1184ms resp=48112B client=84[.]17[.]45[.]12","04:00:19 key=k_77c3 predict 200 1102ms resp=47998B client=84[.]17[.]45[.]88","04:01:02 key=k_de04 predict 200 1203ms resp=48330B client=84[.]17[.]45[.]12","04:01:11 key=k_theft predict 200 1199ms resp=48001B client=198[.]51[.]100[.]9","04:02:03 key=k_theft predict 200 1197ms resp=48002B client=198[.]51[.]100[.]9","04:03:05 key=k_theft predict 200 1201ms resp=48001B client=198[.]51[.]100[.]9","04:04:09 key=k_b215 predict 200 1301ms resp=48290B client=84[.]17[.]45[.]12","04:05:02 key=k_theft predict 200 1198ms resp=48003B client=198[.]51[.]100[.]9","04:06:11 key=k_theft predict 401 1196ms resp=0B client=198[.]51[.]100[.]9","04:07:03 key=k_theft predict 401 1199ms resp=0B client=198[.]51[.]100[.]9","04:08:14 key=k_theft predict 200 1200ms resp=48001B client=198[.]51[.]100[.]9","04:11:45 key=k_9d13 predict 200 1442ms resp=51320B client=84[.]17[.]45[.]88"]}],"question":"Select the <b>five<\/b> lines where the extraction key made a <b>successful (HTTP 200)<\/b> predict call.","bad":[3,4,5,7,10],"hint":"Filter on k_theft - the key with machine-clock timing. Then keep only its successful 200 responses; the two 401s failed.","expl":"<p><b>Lines 4, 5, 6, 8 and 11:<\/b> every successful k_theft call shows the same fingerprint - near-identical latency (1197-1201 ms), identical response sizes (48001-48003 B), one client IP, and gaps of almost exactly one minute. Those five responses are the moments model behavior left the building.<\/p><p>The two 401 lines (9-10) are the same campaign failing auth; they are evidence for the case file, but nothing was returned, so they are not selected. Honest traffic (k_a91f, k_77c3, k_b215, k_9d13) varies in latency and size and comes from several keys and IPs. That variance is what per-key throttling, quotas and anomaly alarms are tuned to protect.<\/p><p class=\"focus\">Focus next: extraction = uniformity. Latency, size, timing and identity that never vary is a machine, not a customer.<\/p>"},{"id":"M30","type":"classify","theme":"Secure model serving","kw":["model theft controls (throttling, quotas)","inference endpoint isolation","Config rules"],"title":"Cut the model-theft risk: sort the measures","scenario":"The platform team brainstormed measures against model theft through the public inference API. Some measures act at the API tier, some on the network, some are governance habits. Sort them so each lands in its operating layer.","cats":["API tier","Network tier","Governance tier"],"items":[{"t":"Per-key usage plan with tight quotas on predict calls","c":0},{"t":"Serve the endpoint only through a VPC endpoint / private integration","c":1},{"t":"WAF rate rule on the predict route","c":0},{"t":"Deny egress from the serving subnet to the internet","c":1},{"t":"Quarterly access review of every API key and its owner","c":2},{"t":"Config rule that fails any endpoint deployed without auth enabled","c":2},{"t":"Short-lived tokens issued through STS instead of static keys","c":0}],"hint":"If it lives in an HTTP request or a token, it is API tier. If it lives in routes, subnets or endpoints, network. If it is a habit or a rule someone reviews, governance.","expl":"<p><b>API tier:<\/b> quotas and throttling slow extraction to a crawl; the WAF rate rule blocks bursts; short-lived STS tokens shrink what a stolen key is worth.<\/p><p><b>Network tier:<\/b> serving through a private endpoint removes the public door entirely; denying internet egress from the serving subnet kills both exfiltration and surprise callbacks.<\/p><p><b>Governance tier:<\/b> quarterly key reviews catch orphaned or over-scoped keys; a Config rule stops unauthenticated endpoints from reaching production at all.<\/p><p class=\"focus\">Focus next: real defense layers these three tiers - any single tier alone eventually leaks.<\/p>","question":"Drag every measure into the tier where it operates: API, network, or governance."},{"id":"M31","type":"classify","theme":"Containers & orchestration","kw":["EKS hardening","pod security standards","network policies","IRSA (IAM Roles for Service Accounts)","container image scanning","immutable infrastructure"],"title":"EKS hardening: sort the dials","scenario":"The inference cluster runs on Amazon EKS. Before the platform review, sort six hardening measures by the layer they belong to: the <b>Pod spec<\/b> (what the container may do), the <b>Cluster network<\/b> (what it may reach), or <b>Supply chain &amp; identity<\/b> (how images and permissions arrive).","cats":["Pod spec","Cluster network","Supply chain & identity"],"items":[{"t":"runAsNonRoot so the container never holds uid 0","c":0},{"t":"Drop Linux capabilities beyond the runtime defaults","c":0},{"t":"A NetworkPolicy that allows only the feature-store API","c":1},{"t":"Default-deny traffic between namespaces","c":1},{"t":"Container image scanning before an image enters the cluster","c":2},{"t":"IRSA: one IAM role bound to the service account, not the node","c":2}],"hint":"Two dials limit what the container can do, two limit where it can talk, two govern how code and permissions arrive.","expl":"<p><b>Pod spec:<\/b> runAsNonRoot removes uid 0 and dropping capabilities shrinks what a container escape can do to the kernel - both are pod security standards in practice.<\/p><p><b>Cluster network:<\/b> a NetworkPolicy pins the pod to the feature store; default-deny between namespaces makes lateral movement the exception. That is EKS hardening at the network layer.<\/p><p><b>Supply chain & identity:<\/b> container image scanning before admission keeps known-bad builds out; IRSA scopes cloud permissions to this workload instead of the node role; referencing images by digest keeps them immutable - the core of immutable infrastructure.<\/p><p class=\"focus\">Focus next: EKS hardening = pod, network, supply chain, identity. Four dials, turned on purpose.<\/p>","question":"Drag each measure onto its layer."}]};
