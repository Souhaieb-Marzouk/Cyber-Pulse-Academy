}
function rDual(ex,g){
  var d=ex.d,rt=S.rt[ex._oi],a=S.ans[ex._oi],lk=S.locked[ex._oi];
  var m=(g&&g.marks)?g.marks.byPart:null;
  function part(key,data,perm,label){
    var mk='';if(m){var st=m[key];mk=st==='ok'?gl('ok','Correct'):st==='bad'?gl('bad','Wrong'):st==='open'?gl('open','Not answered'):'';}
    var h='<div class="dpart '+(key==='b'?'dp-blue':'dp-red')+'"><div class="dh">'+label+' '+mk+'</div><div>'+data.q+'</div><div class="chlist" role="radiogroup" aria-label="'+label+'">';
    perm.forEach(function(oi){
      var cls='choice',tag='';
      if(m&&m.byChoice&&m.byChoice[key]){var s4=m.byChoice[key][oi];
        if(s4==='ok'){cls+=' ok';tag=gl('ok','Correct');}
        else if(s4==='bad'){cls+=' bad';tag=gl('bad','Wrong pick');}
        else if(s4==='key'){cls+=' key';tag=gl('key','Correct answer');}
        else if(s4==='miss'){cls+=' key';tag=gl('miss','You missed this');}}
      h+='<label class="'+cls+'"><input type="radio" name="dq'+ex._oi+key+'" data-kind="dual" data-part="'+key+'" data-oi="'+ex._oi+'" value="'+oi+'"'+(a[key]===oi?' checked':'')+(lk?' disabled':'')+'><span>'+tag+esc(data.c[oi])+'</span></label>';
    });
    return h+'</div></div>';
  }
  return '<div class="dwrap">'+part('b',d.blue,rt.bperm,'BLUE TEAM VIEW — defender side')+part('r',d.red,rt.rperm,'RED TEAM VIEW — attacker side')+'</div>';
}
function renderAnswer(ex,g){
  switch(ex.t){
    case 'qcm':return rChoices(ex,g,'q');
    case 'multi':return rChoices(ex,g,'q');
    case 'match':return rMatch(ex,g,'');
    case 'fill':return rFill(ex,g);
    case 'dd':return rDD(ex,g);
    case 'order':return rOrder(ex,g);
    case 'spot':return rSpot(ex,g);
    case 'terminal':return rTerminal(ex,g);
    case 'logview':return rLogview(ex,g);
    case 'branch':return rBranch(ex,g);
    case 'dual':return rDual(ex,g);
  }
  return '';
}

/* ---------------- grading ---------------- */
function gQCM(d,a){
  var g={earned:0,okEls:0,nEls:1,marks:{byChoice:{}}};
  if(a===d.a){g.earned=1;g.okEls=1;g.marks.byChoice[d.a]='ok';}
  else{g.marks.byChoice[d.a]='key';if(a!=null)g.marks.byChoice[a]='bad';}
  return g;
}
function gMulti(d,a){
  a=a||{};
  var n=d.a.length,hit=0,g={earned:0,okEls:0,nEls:n,marks:{byChoice:{}}};
  d.a.forEach(function(ci){if(a[ci]){hit++;g.marks.byChoice[ci]='ok';}else g.marks.byChoice[ci]='miss';});
  Object.keys(a).forEach(function(k){k=+k;if(d.a.indexOf(k)<0)g.marks.byChoice[k]='bad';});
  g.earned=hit/n;g.okEls=hit;return g;
}
function gMatchCore(d,a){
  var n=d.rows.length,ok=0,g={earned:0,okEls:0,nEls:n,marks:{row:{}}};
  d.rows.forEach(function(r,k){
    var v=a[k];
    if(v==null)g.marks.row[k]='open';
    else if(v===r.a){ok++;g.marks.row[k]='ok';}
    else g.marks.row[k]='bad';
  });
  g.earned=ok/n;g.okEls=ok;return g;
}
function grade(ex){
  var d=ex.d,a=S.ans[ex._oi];if(a==null)a={};
  switch(ex.t){
    case 'qcm':return gQCM(d,a);
    case 'multi':return gMulti(d,a);
    case 'match':return gMatchCore(d,a);
    case 'fill':{
      var n=d.keys.length,ok=0,g={earned:0,okEls:0,nEls:n,marks:{slot:{}}};
      d.keys.forEach(function(key,k){
        var acc=Array.isArray(key)?key:[key],v=a[k];
        if(v==null)g.marks.slot[k]='open';
        else if(acc.indexOf(v)>=0){ok++;g.marks.slot[k]='ok';}
        else g.marks.slot[k]='bad';
      });
      g.earned=ok/n;g.okEls=ok;return g;}
    case 'dd':{
      var n2=d.items.length,ok2=0,g2={earned:0,okEls:0,nEls:n2,marks:{item:{}}};
      d.items.forEach(function(it,oi){
        var b=a[oi];
        if(b==null)g2.marks.item[oi]='open';
        else if(b===it.b){ok2++;g2.marks.item[oi]='ok';}
        else g2.marks.item[oi]='bad';
      });
      g2.earned=ok2/n2;g2.okEls=ok2;return g2;}
    case 'order':{
      var n3=d.items.length,ok3=0,ord=a.ord||[],g3={earned:0,okEls:0,nEls:n3,marks:{pos:{}}};
      for(var p=0;p<n3;p++){
        var oi=ord[p];
        if(oi==null)g3.marks.pos[p]='open';
        else if(oi===p){ok3++;g3.marks.pos[p]='ok';}
        else g3.marks.pos[p]='bad';
      }
      g3.earned=ok3/n3;g3.okEls=ok3;return g3;}
    case 'spot':{
      var bads=[];d.lines.forEach(function(l,k){if(l.bad)bads.push(k);});
      var n4=bads.length,ok4=0,g4={earned:0,okEls:0,nEls:n4,marks:{line:{}}};
      bads.forEach(function(k){if(a[k]){ok4++;g4.marks.line[k]='ok';}else g4.marks.line[k]='miss';});
      d.lines.forEach(function(l,k){if(!l.bad&&a[k])g4.marks.line[k]='bad';});
      g4.earned=n4?ok4/n4:0;g4.okEls=ok4;return g4;}
    case 'terminal':{
      var hist=a.hist||[],n5=d.goals.length,ok5=0,g5={earned:0,okEls:0,nEls:n5,marks:{goal:{}}};
      d.goals.forEach(function(gd,gi){
        var m=hist.some(function(c){return gd.all.every(function(rx){return (new RegExp(rx,'i')).test(c);});});
        if(m){ok5++;g5.marks.goal[gi]='ok';}else g5.marks.goal[gi]='bad';
      });
      g5.earned=ok5/n5;g5.okEls=ok5;return g5;}
    case 'logview':{
      var sd=d.sub,sa=a.sub||{};
      if(sd.t==='qcm')return gQCM(sd,sa.pick==null?null:sa.pick);
      if(sd.t==='multi')return gMulti(sd,sa);
      return gMatchCore(sd,sa);}
    case 'branch':{
      var n6=d.steps.length,ok6=0,g6={earned:0,okEls:0,nEls:n6,marks:{step:{},byStep:{}}};
      d.steps.forEach(function(st,k){
        var v=(a.steps||{})[k],bm={};
        if(v==null){g6.marks.step[k]='open';bm[st.a]='miss';}
        else if(v===st.a){ok6++;g6.marks.step[k]='ok';bm[v]='ok';}
        else{g6.marks.step[k]='bad';bm[v]='bad';bm[st.a]='key';}
        g6.marks.byStep[k]=bm;
      });
      g6.earned=ok6/n6;g6.okEls=ok6;return g6;}
    case 'dual':{
      var ok7=0,g7={earned:0,okEls:0,nEls:2,marks:{byPart:{},byChoice:{}}};
      [['b',d.blue],['r',d.red]].forEach(function(pr){
        var key=pr[0],part=pr[1],v=a[key],bm={};
        if(v==null){g7.marks.byPart[key]='open';bm[part.a]='miss';}
        else if(v===part.a){ok7++;g7.marks.byPart[key]='ok';bm[v]='ok';}
        else{g7.marks.byPart[key]='bad';bm[v]='bad';bm[part.a]='key';}
        g7.marks.byChoice[key]=bm;
      });
      g7.earned=ok7/2;g7.okEls=ok7;return g7;}
  }
  return {earned:0,okEls:0,nEls:1,marks:{}};
}
/* ---------------- summaries for the report ---------------- */
function ansSummary(ex){
  var d=ex.d,a=S.ans[ex._oi];if(a==null)a={};
  switch(ex.t){
    case 'qcm':return (typeof a==='number')?d.c[a]:'(no answer chosen)';
    case 'multi':{var ks=Object.keys(a);return ks.length?ks.map(function(k){return '• '+d.c[+k];}).join(' '):'(none selected)';}
    case 'match':return d.rows.map(function(r,k){return r.k+' → '+(a[k]!=null?d.opts[a[k]]:'—');}).join(' | ');
    case 'fill':return d.keys.map(function(key,k){return 'Blank '+(k+1)+': '+(a[k]!=null?d.bank[a[k]]:'—');}).join(' | ');
    case 'dd':return d.items.map(function(it,oi){return trimz(it.t,40)+' → '+(a[oi]!=null?d.buckets[a[oi]]:'(not placed)');}).join(' | ');
    case 'order':return (a.ord||[]).map(function(oi,p){return (p+1)+'. '+trimz(d.items[oi],36);}).join('  ');
    case 'spot':{var ks2=d.lines.map(function(l,k){return a[k]?l.t:null;}).filter(Boolean);return ks2.length?ks2.map(function(x){return '• '+trimz(x,64);}).join(' '):'(nothing flagged)';}
    case 'terminal':return (a.hist&&a.hist.length)?('last command: '+a.hist[a.hist.length-1]):'(no command run)';
    case 'logview':{var sd=d.sub,sa=a.sub||{};
      if(sd.t==='qcm')return sa.pick!=null?sd.c[sa.pick]:'(no answer)';
      if(sd.t==='multi'){var ks3=Object.keys(sa);return ks3.length?ks3.map(function(k){return '• '+sd.c[+k];}).join(' '):'(none selected)';}
      return sd.rows.map(function(r,k){return r.k+' → '+(sa[k]!=null?sd.opts[sa[k]]:'—');}).join(' | ');}
    case 'branch':return d.steps.map(function(st,k){return 'S'+(k+1)+': '+((a.steps||{})[k]!=null?trimz(st.c[a.steps[k]],40):'—');}).join(' | ');
    case 'dual':return 'Blue: '+(a.b!=null?trimz(d.blue.c[a.b],60):'—')+' | Red: '+(a.r!=null?trimz(d.red.c[a.r],60):'—');
  }
  return '';
}
function correctSummary(ex){
  var d=ex.d;
  switch(ex.t){
    case 'qcm':return d.c[d.a];
    case 'multi':return d.a.map(function(k){return '• '+d.c[k];}).join(' ');
    case 'match':return d.rows.map(function(r){return r.k+' → '+d.opts[r.a];}).join(' | ');
    case 'fill':return d.keys.map(function(key,k){var kk=Array.isArray(key)?key:[key];return 'Blank '+(k+1)+': '+d.bank[kk[0]];}).join(' | ');
    case 'dd':return d.items.map(function(it){return trimz(it.t,40)+' → '+d.buckets[it.b];}).join(' | ');
    case 'order':return d.items.map(function(t2,p){return (p+1)+'. '+trimz(t2,36);}).join('  ');
    case 'spot':return d.lines.filter(function(l){return l.bad;}).map(function(l){return '• '+trimz(l.t,64);}).join(' ');
    case 'terminal':return d.answerTxt||'(see explanation)';
    case 'logview':{var sd=d.sub;
      if(sd.t==='qcm')return sd.c[sd.a];
      if(sd.t==='multi')return sd.a.map(function(k){return '• '+sd.c[k];}).join(' ');
      return sd.rows.map(function(r){return r.k+' → '+sd.opts[r.a];}).join(' | ');}
    case 'branch':return d.steps.map(function(st,k){return 'S'+(k+1)+': '+trimz(st.c[st.a],40);}).join(' | ');
    case 'dual':return 'Blue: '+trimz(d.blue.c[d.blue.a],60)+' | Red: '+trimz(d.red.c[d.red.a],60);
  }
  return '';
}
/* ---------------- top bar / navigator ---------------- */
function mmss(t){t=Math.max(0,t);var m=Math.floor(t/60),s=t%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function updateTimer(){
  var el=$('#timer');
  if(!S||!S.started){el.textContent=mmss(EXAM.minutes*60);el.className='';return;}
  el.textContent=mmss(S.remain);
  el.className=S.remain<=60?'danger':(S.remain<=300?'warn':'');
}
function updateBadges(){
  var bm=$('#pb-m'),bc=$('#pb-c'),btn=$('#pausebtn');
  var hide=!!(S&&S.pauseM&&!S.finished);
  bm.classList.toggle('on',hide);
  bc.classList.toggle('on',!!(S&&S.pauseC&&!S.finished));
  btn.disabled=!S||!S.started||S.finished;
  btn.textContent=(S&&S.pauseM)?'▶ Resume':'❚❚ Pause';
  var w=$('#exwrap'),qn=$('#qnav');
  if(w){if(hide){w.setAttribute('inert','');w.setAttribute('aria-hidden','true');}else{w.removeAttribute('inert');w.removeAttribute('aria-hidden');}}
  if(qn){if(hide){qn.setAttribute('inert','');}else{qn.removeAttribute('inert');}}
}
function sumEarned(){var s=0;QUESTIONS.forEach(function(q){var i=q._oi;if(S.skipped[i])return;if(S.checked[i])s+=S.earned[i]||0;});return s;}
function answeredCount(){var c=0;QUESTIONS.forEach(function(q){if(S.skipped[q._oi])return;if(S.checked[q._oi]||hasAnswer(q))c++;});return c;}
function updateTop(){
  $('#scorev').textContent=fmt(sumEarned())+' / '+QUESTIONS.length+' pts';
  $('#pfill').style.width=pct(answeredCount(),QUESTIONS.length)+'%';
  updateTimer();updateBadges();
}
function updateNav(){
  var h='';
  S.order.forEach(function(oi,p){
    var cls='qn';
    if(S.checked[oi])cls+=' checked';
    else if(hasAnswer(QUESTIONS[oi]))cls+=' answered';
    if(S.skipped[oi])cls+=' skipped';
    if(p===S.cur)cls+=' cur';
    var st=S.skipped[oi]?'skipped':(S.checked[oi]?'checked':(hasAnswer(QUESTIONS[oi])?'answered':'not answered'));
    h+='<button type="button" class="'+cls+'" data-act="jump" data-p="'+p+'" aria-label="Question '+(p+1)+', '+st+'"'+(p===S.cur?' aria-current="true"':'')+'>'+(S.skipped[oi]?'⚑':'')+(S.checked[oi]?'✔':'')+(p+1)+'</button>';
  });
  $('#qnav').innerHTML=h;
}
function flash(msg){
  var f=document.createElement('div');f.className='flash';f.setAttribute('role','status');f.textContent=msg;
  document.body.appendChild(f);setTimeout(function(){f.remove();},2800);
}
/* ---------------- screens ---------------- */
function renderExam(){
  var ex=curEx(),rt=rtOf(ex);ansOf(ex);
  var g=S.checked[ex._oi]?S.g[ex._oi]:null;
  document.body.className='state-exam'+(S.pauseM?' manualpause':'');
  var theme=THEMES[ex.th]||'';
  var sevCls=EXAM.sev==='MEDIUM'?'sev-med':'sev-hard';
  var h='<div id="exwrap"><div class="exmeta"><span class="chip '+sevCls+'">'+EXAM.sev+'</span><span class="chip">Exercise '+(S.cur+1)+' of '+QUESTIONS.length+'</span><span class="chip theme">'+esc(theme)+'</span><span class="chip pts">1 pt</span></div>';
  h+='<h2 class="extitle">'+esc(ex.T)+'</h2>';
  h+='<section class="blk sc"><div class="lab">SCENARIO</div><div class="bd">'+ex.s+'</div></section>';
  h+='<section class="blk q"><div class="lab">QUESTION</div><div class="bd">'+ex.q+'</div></section>';
  h+='<section class="blk ans"><div class="lab">ANSWERS — '+LABELS[ex.t]+'</div><div class="bd">'+renderAnswer(ex,g)+'</div></section>';
  if(S.hint[ex._oi])h+='<div class="hintbox" role="status"><b>Hint (−10% of this exercise):</b> '+esc(ex.h)+'</div>';
  if(g){
    var label=S.raw[ex._oi]>=0.999?'full':(S.raw[ex._oi]>0?'partial':'zero');
    var cls=label==='full'?'ok':label==='zero'?'bad':'part';
    var word=label==='full'?'Full credit':label==='zero'?'No points':'Partial credit';
    var ic=label==='full'?'✔':label==='zero'?'✖':'⚠';
    h+='<div class="fb '+cls+'" aria-live="polite"><b>'+ic+' '+word+'</b> — you earned '+fmt(S.earned[ex._oi])+' / 1 pt (correct elements: '+g.okEls+' / '+g.nEls+').'+(S.hint[ex._oi]?' <span class="mk miss">Hint used: −10%.</span>':'')+(S.auto[ex._oi]?' <span class="mk open">Scored automatically at submission.</span>':'')+'</div>';
    h+='<div class="explain">'+ex.x+'</div>';
  }
  h+='<div class="actions">';
  h+='<button type="button" class="btn" data-act="hint"'+((S.hint[ex._oi]||S.locked[ex._oi])?' disabled':'')+'>Hint (−10%)</button>';
  h+='<button type="button" class="btn primary" data-act="check"'+(S.locked[ex._oi]?' disabled':'')+'>Check</button>';
  if(S.checked[ex._oi]&&!S.finished)h+='<button type="button" class="btn" data-act="revise">Revise</button>';
  h+='<button type="button" class="btn ghost" data-act="skip">Skip</button>';
  h+='</div>';
  h+='<div class="footnav"><button type="button" class="btn" data-act="prev"'+(S.cur===0?' disabled':'')+'>◀ Prev</button><button type="button" class="btn primary" data-act="next">'+(S.cur===QUESTIONS.length-1?'Next ▶ (last)':'Next ▶')+'</button><button type="button" class="btn ghost" data-act="finish" id="finbtn">'+(S.confirmFinish?'Confirm submit?':'Finish &amp; submit')+'</button></div>';
  h+='</div>';
  $('#screen').innerHTML=h;
  updateNav();updateTop();
  if(ex.t==='terminal'&&!S.locked[ex._oi]){var ti=$('#termin');if(ti)ti.focus();}
}
function renderIntro(){
  document.body.className='state-intro';
  var n=QUESTIONS.length,sevCls=EXAM.sev==='MEDIUM'?'sev-med':'sev-hard';
  var h='<section><div class="heroline"><span class="chip '+sevCls+'">'+EXAM.sev+' severity</span><span class="chip">'+n+' exercises</span><span class="chip">'+EXAM.minutes+' minutes</span><span class="chip">Pass mark '+EXAM.passMark+'%</span><span class="chip">1 pt each · partial credit</span></div>';
  h+='<h1>'+esc(EXAM.h1)+'</h1><p class="lead">'+esc(EXAM.lead)+'</p>';
  h+='<div class="introgrid">'+EXAM.intro+'</div>';
  h+='<details class="kwp" open><summary>Keywords covered — grouped by theme (both severity files of this chapter cover the same keywords through different exercises)</summary>';
  EXAM.kw.forEach(function(th){
    h+='<div class="kwtheme"><b>'+esc(th.t)+'</b><div class="kwitems">'+th.items.map(function(x){return '<span class="kw">'+esc(x)+'</span>';}).join('')+'</div></div>';
  });
  h+='</details>';
  var who=(INITDATA&&INITDATA.username)?'<span id="who" class="chip">Learner: '+esc(INITDATA.username)+'</span>':'<span id="who" class="chip" style="display:none"></span>';
  h+='<div class="actions">'+who+'<button type="button" class="btn primary big" data-act="start">Start exam ▶</button></div>';
  h+='<p class="hint-uitext">The timer starts when you press Start. All indicators are defanged, as in real reports.</p></section>';
  $('#screen').innerHTML=h;
  updateTop();
}
function renderResults(){
  document.body.className='state-results';
  var total=0,earn=0,skipped=[];
  S.order.forEach(function(oi){
    if(S.skipped[oi]){skipped.push(oi);return;}
    total++;earn+=(S.earned[oi]||0);
  });
  var score=Math.round(earn);
  var percent=pct(score,total);
  var passed=total>0&&percent>=EXAM.passMark;
  var tstat={};
  S.order.forEach(function(oi){
    if(S.skipped[oi])return;
    var th=QUESTIONS[oi].th||0;
    if(!tstat[th])tstat[th]={e:0,n:0};
    tstat[th].n++;tstat[th].e+=(S.earned[oi]||0);
  });
  var used=EXAM.minutes*60-S.remain;
  var sevCls=EXAM.sev==='MEDIUM'?'sev-med':'sev-hard';
  var h='<section><div class="heroline"><span class="chip '+sevCls+'">'+EXAM.sev+'</span><span class="chip">'+(passed?'Attempt passed':'Attempt not passed')+'</span><span class="chip">'+mmss(used)+' time used</span></div>';
  if(total===0){
    h+='<div class="failcard" role="status"><div class="big">✖ NOTHING SCORED</div><p class="score-line">No exercise was answered.</p><p>Skipped exercises are excluded from both the points earned and the maximum, so this attempt produced no score. Press Retake exam to try again.</p></div>';
  }else if(passed){
    h+='<div class="passcard" role="status"><div class="big">✔ PASS</div><p class="score-line"><b>'+score+' / '+total+' answered exercises</b> — '+percent+'% (pass mark '+EXAM.passMark+'%)</p><p>Certificate-style result: you met the standard for SecAI+ 4.1 — Understand regulatory frameworks ('+EXAM.sev+'). Precise points: '+fmt(earn)+' of '+total+' before rounding. The score above is what gets recorded.</p></div>';
  }else{
    h+='<div class="failcard" role="status"><div class="big">✖ DO NOT PASS</div><p class="score-line"><b>'+score+' / '+total+' answered exercises</b> — '+percent+'% (pass mark '+EXAM.passMark+'%)</p><p>You must retake this exam to reach the pass mark. Read the report below, focus on the red and amber items, then press Retake exam. Precise points: '+fmt(earn)+' of '+total+' before rounding.</p></div>';
  }
  h+='<h3>Skipped exercises — excluded from scoring</h3>';
  if(skipped.length===0)h+='<p class="lead">None — every exercise was answered.</p>';
  else{
    h+='<ul>';
    skipped.forEach(function(oi){h+='<li>#'+(S.order.indexOf(oi)+1)+' — '+esc(QUESTIONS[oi].T)+'</li>';});
    h+='</ul><p class="hint-uitext">These were skipped and not counted: they add nothing to the earned points and nothing to the maximum.</p>';
  }
  h+='<h3>Progress by theme</h3>';
  Object.keys(tstat).map(Number).sort(function(a,b){return a-b;}).forEach(function(th){
    var st=tstat[th];
    h+='<div class="tbar"><span style="min-width:210px;color:var(--mut)">'+esc(THEMES[th]||'')+'</span><div class="pbar"><div id="pfill" style="width:'+pct(st.e,st.n)+'%"></div></div><span>'+fmt(st.e)+' / '+st.n+'</span></div>';
  });
  h+='<h3>Full report</h3>';
  S.order.forEach(function(oi,p){
    var q=QUESTIONS[oi];
    var lbl=S.skipped[oi]?'skipped':(S.raw[oi]>=0.999?'full':(S.raw[oi]>0?'partial':'zero'));
    var pts=S.skipped[oi]?'excluded':fmt(S.earned[oi])+' / 1 pt';
    h+='<details class="rrow"><summary><b>#'+(p+1)+'</b> <span>'+esc(q.T)+'</span><span class="lbl '+lbl+'">'+lbl+'</span><span class="chip pts">'+pts+'</span></summary><div class="rbody">';
    h+='<div class="ya"><b>Your answer:</b> '+esc(S.skipped[oi]?'(skipped — not scored)':ansSummary(q))+'</div>';
    h+='<div class="ca"><b>Correct answer:</b> '+esc(correctSummary(q))+'</div>';
    h+='<div class="explain">'+q.x+'</div></div></details>';
  });
  h+='<div class="actions"><button type="button" class="btn primary big" data-act="retake">Retake exam ↻</button></div>';
  h+='<p class="hint-uitext">Retake reshuffles the exercise order and all choices, resets the timer, pause states, skip flags and partial scores.</p></section>';
  $('#screen').innerHTML=h;
  updateTop();
  reportScore(score,total);
}
/* ---------------- actions ---------------- */
function reportScore(score,total){
  if(S.reported)return;
  S.reported=true;
  if(!total)return;
  if(window.parent===window)return; /* opened directly — parent is the page itself, nothing to report to */
  var percent=Math.round((score/total)*100);
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:EXAM.topicId,score:score,total:total,percent:percent,passed:percent>=EXAM.passMark},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
function goNext(){
  S.pauseC=false;
  if(S.cur<QUESTIONS.length-1){S.cur++;renderExam();}
  else{renderExam();flash('Last exercise — press Finish & submit when ready.');}
}
function doCheck(){
  var ex=curEx();
  if(!hasAnswer(ex)){flash('Choose an answer first — or press Skip.');return;}
  var g=grade(ex),raw=g.earned;
  S.g[ex._oi]=g;S.raw[ex._oi]=raw;
  S.earned[ex._oi]=Math.round(raw*(S.hint[ex._oi]?0.9:1)*100)/100;
  S.checked[ex._oi]=true;S.locked[ex._oi]=true;delete S.skipped[ex._oi];
  S.pauseC=true;
  renderExam();
}
function doRevise(){
  var ex=curEx(),i=ex._oi;
  S.locked[i]=false;S.checked[i]=false;S.g[i]=null;S.raw[i]=0;S.earned[i]=0;
  renderExam();
}
function doSkip(){
  var i=curEx()._oi;S.skipped[i]=true;goNext();
}
function startExam(){
  S.started=true;
  renderExam();
}
function finishExam(auto){
  if(S.finished)return;
  if(!auto){
    var answered=0;
    QUESTIONS.forEach(function(q){if(S.checked[q._oi]||hasAnswer(q))answered++;});
    if(answered===0){S.confirmFinish=false;flash('Answer at least one exercise before submitting — or keep going.');renderExam();return;}
  }
  S.finished=true;S.pauseM=false;S.pauseC=false;
  QUESTIONS.forEach(function(q){
    var i=q._oi;
    if(S.checked[i])return;
    if(hasAnswer(q)){
      var g=grade(q);
      S.g[i]=g;S.raw[i]=g.earned;
      S.earned[i]=Math.round(g.earned*(S.hint[i]?0.9:1)*100)/100;
      S.checked[i]=true;S.locked[i]=true;S.auto[i]=true;
    }else S.skipped[i]=true;
  });
  renderResults();
}
function runTerm(){
  var ex=curEx(),i=ex._oi;
  if(S.locked[i])return;
  var inp=$('#termin');if(!inp)return;
  var cmd=(inp.value||'').trim();if(!cmd)return;
  var d=ex.d,rt=S.rt[i];
  rt.out=rt.out||[];
  var a=ansOf(ex);a.hist.push(cmd);
  var line=null;
  if(cmd==='clear'){rt.out=[];inp.value='';renderExam();return;}
  if(cmd==='help'){line='Commands: help, ls, cat FILE, clear — plus the real command the task asks for.';}
  else if(cmd==='ls'){line=Object.keys(d.fs).join('  ');}
  else if(/^cat\s+\S+$/.test(cmd)){
    var f=cmd.slice(4).trim();
    line=(d.fs[f]!=null)?d.fs[f]:('cat: '+f+': No such file or directory');
  }else{
    var hit=null;
    for(var g=0;g<d.goals.length;g++){
      var gd=d.goals[g];
      if(gd.all.every(function(rx){return (new RegExp(rx,'i')).test(cmd);})){hit=gd;break;}
    }
    if(hit){line=hit.out||'';if(hit.write)d.fs[hit.write.file]=hit.write.content;}
    else line='bash: '+cmd.split(/\s+/)[0]+': command not found (the command is recorded — press Check to validate)';
  }
  rt.out.push('grc@soc:~$ '+cmd);
  if(line)rt.out.push(line);
  inp.value='';
  renderExam();
}
function onClick(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='retake'){newAttempt();renderIntro();return;}
  if(act==='start'){startExam();return;}
  if(!S||!S.started||S.finished)return;
  var ex=curEx();
  switch(act){
    case 'pause':
      S.pauseM=!S.pauseM;updateBadges();
      document.body.classList.toggle('manualpause',S.pauseM);
      if(S.pauseM){var w0=$('#exwrap');if(w0&&document.activeElement&&w0.contains(document.activeElement)&&document.activeElement.blur)document.activeElement.blur();}
      return;
    case 'hint':if(!S.locked[ex._oi]){S.hint[ex._oi]=true;renderExam();}return;
    case 'check':doCheck();return;
    case 'revise':doRevise();return;
    case 'skip':doSkip();return;
    case 'prev':if(S.cur>0){S.pauseC=false;S.cur--;renderExam();}return;
    case 'next':goNext();return;
    case 'jump':S.pauseC=false;S.cur=+el.getAttribute('data-p');renderExam();return;
    case 'finish':
      if(!S.confirmFinish){
        S.confirmFinish=true;el.textContent='Confirm submit?';
        setTimeout(function(){if(S&&!S.finished){S.confirmFinish=false;var b=$('#finbtn');if(b)b.textContent='Finish & submit';}},4000);
        return;
      }
      finishExam(false);return;
    case 'spot':{
      if(S.locked[ex._oi])return;
      var a=ansOf(ex),l=+el.getAttribute('data-l');
      if(a[l])delete a[l];else a[l]=true;
      renderExam();return;}
    case 'dd-sel':{
      if(S.locked[ex._oi])return;
      var rt=rtOf(ex),oi=+el.getAttribute('data-oi');
      rt.sel=(rt.sel===oi?null:oi);renderExam();return;}
    case 'dd-place':{
      if(S.locked[ex._oi])return;
      var rt2=rtOf(ex);
      if(rt2.sel==null)return;
      var a2=ansOf(ex);
      a2[rt2.sel]=+el.getAttribute('data-b');rt2.sel=null;renderExam();return;}
    case 'dd-out':{
      if(S.locked[ex._oi])return;
      var a3=ansOf(ex);delete a3[+el.getAttribute('data-oi')];renderExam();return;}
    case 'up':case 'dn':{
      if(S.locked[ex._oi])return;
      var a4=ansOf(ex),p=+el.getAttribute('data-p'),q=act==='up'?p-1:p+1;
      if(q<0||q>=a4.ord.length)return;
      var t3=a4.ord[p];a4.ord[p]=a4.ord[q];a4.ord[q]=t3;
      S.rt[ex._oi].touched=true;
      renderExam();return;}
    case 'runterm':runTerm();return;
  }
}
function onChange(e){
  if(!S||!S.started||S.finished)return;
  var t=e.target;
  if(!t.dataset||t.dataset.oi==null)return;
  var ex=curEx();
  if(+t.dataset.oi!==ex._oi)return;
  if(S.locked[ex._oi])return;
  var a=ansOf(ex),kind=t.dataset.kind,v=t.value;
  if(kind==='qcm')S.ans[ex._oi]=+v;
  else if(kind==='multi'){if(t.checked)a[+v]=true;else delete a[+v];}
  else if(kind==='match'||kind==='fill')a[+t.dataset.k]=v===''?null:+v;
  else if(kind==='subqcm')(a.sub=a.sub||{}).pick=+v;
  else if(kind==='submulti'){if(t.checked)(a.sub=a.sub||{})[+v]=true;else delete a.sub[+v];}
  else if(kind==='submatch')(a.sub=a.sub||{})[+t.dataset.k]=v===''?null:+v;
  else if(kind==='branch'){
    a.steps[+t.dataset.k]=+v;
    var rt=rtOf(ex);
    if(+t.dataset.k+2>rt.rev)rt.rev=+t.dataset.k+2;
    renderExam();
  }
  else if(kind==='dual')a[t.dataset.part]=+v;
  updateTop();
}
function onInput(e){
  if(!S||!S.started||S.finished)return;
  var t=e.target;
  if(t.id!=='logfilter')return;
  var ex=curEx(),rt=S.rt[ex._oi];
  rt.filter=t.value;
  var f=(rt.filter||'').toLowerCase();
  var lines=ex.d.lines.filter(function(l){return !f||l.toLowerCase().indexOf(f)>=0;});
  var pre=$('#loglines');
  if(pre)pre.innerHTML=lines.map(hi).join('\n');
  var c=$('#logcount');
  if(c)c.textContent=lines.length+' of '+ex.d.lines.length+' lines';
}
function onKey(e){
  if(!S||!S.started||S.finished)return;
  if(e.target&&e.target.id==='termin'&&e.key==='Enter'){runTerm();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('bucket')){
    e.preventDefault();
    var ex=curEx(),rt=S.rt[ex._oi];
    if(S.locked[ex._oi]||rt.sel==null)return;
    var a=ansOf(ex);
    a[rt.sel]=+e.target.getAttribute('data-b');rt.sel=null;
    renderExam();
  }
}
/* ---------------- init ---------------- */
function init(){
  QUESTIONS.forEach(function(q,i){q._oi=i;});
  $('#brand').innerHTML=EXAM.brand;
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKey);
  document.addEventListener('dragstart',function(e){
    var el=e.target.closest?e.target.closest('.dd-item'):null;
    if(!el||!e.dataTransfer)return;
    e.dataTransfer.setData('text/plain',el.getAttribute('data-oi'));
  });
  document.addEventListener('dragover',function(e){
    var el=e.target.closest?e.target.closest('.bucket'):null;
    if(el){e.preventDefault();el.classList.add('over');}
  });
  document.addEventListener('dragleave',function(e){
    var el=e.target.closest?e.target.closest('.bucket'):null;
    if(el)el.classList.remove('over');
  });
  document.addEventListener('drop',function(e){
    var el=e.target.closest?e.target.closest('.bucket'):null;
    if(!el)return;
    e.preventDefault();el.classList.remove('over');
    if(!S||!S.started||S.finished)return;
    var ex=curEx();
    if(ex.t!=='dd'||S.locked[ex._oi])return;
    var oi=e.dataTransfer.getData('text/plain');
    if(oi==='')return;
    var a=ansOf(ex);
    a[+oi]=+el.getAttribute('data-b');
    S.rt[ex._oi].sel=null;
    renderExam();
  });
  window.addEventListener('message',function(ev){
    var d=ev.data;
    if(!d)return;
    if(d.type==='CYBERPULSE_INIT'||d.type==='CYBERMASTERY_INIT'){
      INITDATA=d;
      if(d.username){var el=$('#who');if(el){el.textContent='Learner: '+d.username;el.style.display='';}}
    }
  });
  setInterval(function(){
    if(!S||!S.started||S.finished)return;
    if(S.pauseM||S.pauseC)return;
    S.remain--;
    if(S.remain<=0){S.remain=0;updateTimer();finishExam(true);return;}
    updateTimer();
  },1000);
  newAttempt();renderIntro();
}
init();
})();

</script>
</body>
