intro:`<div class="card"><h4>What this exam is</h4><p>Thirty HARD-severity exercises for candidates who already know the map: subtle distractors, near-miss answers, artefacts that must be read together (logs, registries, contracts, configs), cases where the obvious answer is wrong, and judgement calls an experienced analyst would recognise. The scenarios are disjoint from the MEDIUM file — different companies, datasets and reasoning paths.</p></div>
<div class="card"><h4>How to answer</h4><p>Three blocks per exercise: SCENARIO, QUESTION, ANSWERS. Expect cloud audit logs with a filter, model-registry forensics, regulator-facing decision trees, dual blue/red perspectives, actor and lifecycle mappings, PET applications, enforcement matching, policy autopsies, and two goal-only terminal tasks — no tool is named for you this time.</p></div>
<div class="card"><h4>Check, Skip and returning</h4><p><b>Check</b> validates, marks every element (green / red / amber), locks the answer and freezes the timer in <b>review mode</b> while the explanation stays visible; only <b>Next</b> restarts the clock. <b>Revise</b> unlocks a checked exercise for another pass. <b>Skip</b> flags amber and moves on — you may return to skipped work until the timer ends.</p></div>
<div class="card"><h4>Two different pauses</h4><p><b>Manual pause</b> (top bar) blurs the exercise with the clock stopped. <b>Check-pause</b> (after Check) keeps everything readable while frozen. They stack; both must clear before the timer runs again. Hints cost 10% of the exercise points and never pause anything.</p></div>
<div class="card"><h4>Partial credit and scoring</h4><p>Multi-answer work is scored per correct element — wrong picks earn nothing and subtract nothing. Each exercise is 1 point; pass mark <b>70%</b> over non-skipped exercises only. Skipped work is excluded from both sides of the ratio.</p></div>
<div class="card"><h4>Timer</h4><p>60 minutes for 30 exercises — about 2 minutes each. Expert recognition is fast, but the traps are not: read the artefact before the answers. At zero, everything answered but unchecked is scored as-is.</p></div>`,
kw:[

{t:'Global privacy & transfers',items:['GDPR','Lawful basis','DPIA','Art. 22 automated decisions','72-hour breach notification','CCPA / CPRA','PIPL (China)','LGPD (Brazil)','India DPDP Act','UK GDPR','Schrems II','SCCs / transfer risk assessment','Adequacy & EU-US Data Privacy Framework','Data residency / sovereignty / localisation']},
{t:'Standards & frameworks',items:['NIST AI RMF (Govern · Map · Measure · Manage)','NIST CSF 2.0 Govern function','ISO/IEC 42001 (AIMS)','ISO/IEC 23894','ISO/IEC 27001','ISO/IEC 27018','ISO/IEC 27701','SOC 2 Type II','FedRAMP','Model cards','Algorithmic impact assessment']},

]};

{id:'H01',th:1,T:'CloudTrail forensics — compliance drift',t:'logview',
s:`<p>03:40 at Auralis Devices. The guardrail bot pages you: a training account shows control-plane events nobody approved. EU-residency policy allows data and keys only in eu-central-1, and the audit trail itself is sacred. The events below are from the account’s CloudTrail stream.</p>`,
q:`Read the log (filter freely), then select the <b>two</b> events that together show residency drift and audit-trail tampering.`,
d:{lines:[
'2026-03-04T09:12:04Z event=ConsoleLogin user=m.chen src=10[.]0[.]4[.]17 result=success mfa=true',
'2026-03-04T09:14:11Z event=AssumeRole role=ml-training principal=p.novak from=eu-central-1 result=success',
'2026-03-04T09:40:52Z event=PutReplicationConfiguration bucket=ds-eu-training dest=us-east-1 user=p.novak',
'2026-03-04T10:02:33Z event=GetObject bucket=ds-eu-training user=svc-etl region=eu-central-1 result=allowed',
'2026-03-04T10:11:20Z event=Decrypt key=model-kek region=eu-central-1 result=allowed',
'2026-03-04T10:29:47Z event=StopLogging trailName=ct-audit-main user=p.novak result=success',
'2026-03-04T10:31:05Z event=PutBucketPolicy bucket=ds-eu-training effect=deny principal=all',
'2026-03-04T11:00:10Z event=StartLogging trailName=ct-audit-main user=m.chen result=success'],

'PutReplicationConfiguration pointing ds-eu-training at us-east-1',
'ConsoleLogin by m.chen with MFA from an internal address',
'GetObject by svc-etl inside eu-central-1',

'StopLogging on ct-audit-main — the audit trail went dark for 30 minutes',
'PutBucketPolicy adding a deny rule'],a:[0,4]}},
h:`One event moves the data plane across the Atlantic; the other blinds the evidence source between 10:29 and 11:00.`,
x:`<p><b>PutReplicationConfiguration</b> to <b>us-east-1</b> starts copying an EU-residency-protected dataset to the US — with no SCC/TIA review mentioned, that is GDPR Chapter V drift. <b>StopLogging</b> silenced the very trail that would prove who touched what — a tampering pattern no examiner accepts, even if a “fix” follows at 11:00. The console login (MFA, internal), the EU-internal read and decrypt, and a deny-everything bucket policy are normal or defensive events.</p><p><b>Tip:</b> in cloud compliance forensics, follow two lines: where did data go, and who could see the evidence.</p>`},
{id:'H02',th:0,T:'Obligations across the value chain',t:'dd',
s:`<p>Auralis Devices buys a high-risk inspection AI from a US developer, through an EU importer, and runs it in its own quality process. The compliance lead lists eight duties on cards and asks you to file them under the actor that owns them under the EU AI Act.</p>`,

{t:'Uses the system in its own operational process',b:1},
{t:'Checks CE marking and instructions before placing the system on the EU market',b:2},
{t:'Keeps system logs, informs workers, ensures inputs match instructions',b:1},
{t:'Runs the quality-management system and post-market monitoring',b:0},
{t:'Reports serious incidents to the authorities',b:0},
{t:'Verifies conformity documents for a system brought in from outside the EU',b:2},
{t:'Carries out the fundamental-rights impact assessment where required',b:1}]},
h:`Who makes it, who uses it, who brings it across a border — each role has its own duty list.`,
x:`<p>The <b>provider</b> builds and releases, runs the quality-management and post-market monitoring, and reports serious incidents. The <b>deployer</b> operates it: logs, worker information, input-data relevance, and — for certain public and consequential uses — the fundamental-rights impact assessment. The <b>importer</b> is the EU gatekeeper: verify CE marking, instructions and conformity documents before the system reaches the market.</p><p><b>Tip:</b> exam traps blur these roles; anchor on verbs — make, use, import.</p>`},
{id:'H03',th:1,T:'Answering the regulator',t:'branch',
s:`<p>Meridian Housing automated benefit-eligibility rejections. Three months of silent rejections later, a complaint reached the data-protection authority, and the inquiry letter arrived. Counsel wants your sequence. Each answer reveals the next step.</p>`,
q:`Answer all four steps.`,
d:{steps:[
{q:'The DPA requests the first artefacts. What do you produce?',
c:['A call asking the complainant to withdraw','The lawful basis, the decision-logic records and the DPIA for the flow','The model weights under NDA','A press statement about innovation'],a:1},
{q:'How do you evidence GDPR Art. 22 compliance for the rejections?',
c:['Show the human-intervention route and contest procedure, with logs that they were offered','Say the model is a trade secret','Offer re-application after twelve months','Point to the marketing site'],a:0},
{q:'The letter notes there was no DPIA. The intake form says “low risk”. What now?',
c:['The vendor said it was not needed','Eligibility for benefits is high-risk processing — run the DPIA now and tell the DPA','The model is only advisory','The DPO was on leave'],a:1},
{q:'How do you explain the logic to the applicant without giving up IP?',
c:['Refuse — trade secret','Give a meaningful explanation of the factors and weight bands; full detail goes to the DPA under confidentiality','Send the training dataset','Send a blog post about AI'],a:1}]},
h:'Regulators want records, safeguards and honesty about gaps — not PR. Explanations must be meaningful even when the model stays secret.',
x:`<p><b>Step 1:</b> inquiries are answered with records — lawful basis, decision logic, DPIA — not with pressure on the complainant. <b>Step 2:</b> Art. 22 compliance is evidenced by a real <b>human-intervention and contest route</b> plus logs showing it was offered. <b>Step 3:</b> benefit eligibility is classic high-risk processing; the “low risk” classification was wrong, and the answer is to run the DPIA now and say so. <b>Step 4:</b> trade secrets shape the <b>how</b> of explanation, never the <b>whether</b> — a factor-and-weight explanation to the applicant, full detail to the authority under confidentiality.</p><p><b>Tip:</b> regulator responses follow the same arc as incidents: records, safeguards, gap-honesty.</p>`},
{id:'H04',th:0,T:'The synthetic presenter',t:'qcm',
s:`<p>AtlasRetail’s marketing team generates an entire ad with an AI presenter: synthetic face, synthetic voice, announcing a real sale in three EU markets. Legal is asked for the minimum EU AI Act duty.</p>`,
q:`What does the EU AI Act require for this campaign?`,
d:{c:[
'A conformity assessment before broadcast',
'Register the campaign in the EU database',
'Clearly disclose that the presenter and voice are AI-generated — machine-readable marking plus a visible disclosure',
'Nothing — advertising is always minimal risk'],a:2},
h:'The content is synthetic. Which tier exists precisely so people are not deceived by generated media?',
x:`<p>Deepfakes and synthetic media carry <b>transparency duties</b>: the content must be machine-readably marked and visibly disclosed as artificially generated — for ads there is no “artistic exception” escape. Conformity assessment and EU-database registration belong to high-risk systems; an ad generator is not one. “Always minimal risk” ignores the limited-risk tier that exists exactly for generated content.</p><p><b>Tip:</b> if people could reasonably believe a real human said it, label it.</p>`},
{id:'H05',th:0,T:'Complete the gap memo',t:'fill',
s:`<p>The regulatory-change manager at Auralis Devices drafted the board memo on the EU AI Act, then left on leave. The nouns are missing. Complete it so the board can vote on the readiness budget.</p>`,
q:`Fill each blank with the correct term from the bank.`,
d:{text:`The AI Act reaches us in the US because of its {{0}} — anyone placing a system on the EU market is covered. The time between adoption and application is a {{1}} we must plan against. High-risk systems need a {{2}} before we affix the {{3}}. National {{4}} authorities can withdraw products and fine providers. Our GPAI team must also publish a summary of the {{5}} used for training.`,
bank:['extraterritorial scope','transition period','conformity assessment','CE marking','market surveillance','training data','reciprocity','force majeure','injunction'],
keys:[0,1,2,3,4,5]},
h:'Six nouns: reach, time, proof, mark, police, sources.',
x:`<p><b>Extraterritorial scope</b> is why a US provider is bound. The <b>transition period</b> (phased application to 2026/2027) is the planning window. The <b>conformity assessment</b> is the proof gate; <b>CE marking</b> is its visible sign. <b>Market surveillance</b> authorities enforce — withdrawal and fines included. GPAI providers publish a <b>training-data</b> summary. Reciprocity, force majeure and injunctions are legal distractors from other doctrines.</p><p><b>Tip:</b> memos that survive boards contain exactly these six anchors: reach, time, proof, mark, police, sources.</p>`},
{id:'H06',th:5,T:'Evidence infrastructure autopsy',t:'spot',
s:`<p>After the model-memorisation incident (see later), legal ordered an infrastructure review of the investigation environment at Auralis Devices. Policy: evidence must survive holds, keys must match data residency, and cost optimisation must never destroy records. Three lines fail.</p>`,
q:`Click the three lines that fail the policy.`,
d:{mono:true,lines:[
{t:'resource "s3_bucket" "evidence" { force_destroy = true }',bad:true},
{t:'cloudtrail { enable_all_regions = true  log_file_validation = true }',bad:false},
{t:'macie { status = "enabled" }',bad:false},
{t:'s3 { block_public_access = true }',bad:false},
{t:'resource "kms_key" "eu_kek" { region = "eu-central-1" }  # data also in eu-central-1',bad:false},
{t:'lifecycle { expire_noncurrent_versions_days = 365  legal_hold_exempt = true }',bad:false},
{t:'backup { object_lock = "none"  legal_hold = "unsupported" }  # evidence vault',bad:true},
{t:'lifecycle { evidence_retention_days = 14  note = "delete quickly to save cost" }',bad:true}]},
h:'One line lets the bucket be annihilated, one removes preservation on the vault, one deletes evidence in two weeks.',
x:`<p><b>force_destroy = true</b> means one command can annihilate a bucket holding evidence — investigations need immutability. The <b>evidence vault without object lock or legal-hold support</b> cannot honour a litigation hold. A <b>14-day retention</b> deletes the record before any authority response window closes. All-region validated CloudTrail, Macie, blocked public access, a region-matched key and a hold-aware lifecycle rule are exactly what reviewers want to see.</p><p><b>Tip:</b> evidence systems are judged on three properties: they cannot be destroyed quickly, they honour holds, and keys live with the data.</p>`},
{id:'H07',th:3,T:'Enforcement tour',t:'match',
s:`<p>Your GRC team collects enforcement actions as training material. The filenames got shuffled. Link each real-world pattern to the duty it enforced.</p>`,
q:`Match each action to the violated duty.`,
d:{alert:true,rows:[
{k:'FTC order bans a pharmacy chain from facial recognition after unfairness findings',a:0},
{k:'A European DPA fines a company for training on data without a lawful basis',a:1},
{k:'NYC penalises an employer for skipping the AEDT bias audit',a:2},
{k:'EEOC settles with a tutoring firm over an age-biased screening tool',a:3},
{k:'A market-surveillance authority withdraws a non-conforming high-risk AI device',a:4},
{k:'A prudential supervisor acts against a bank running unvalidated credit models',a:5}],
opts:['FTC Act §5 — unfair practice','GDPR lawful basis','Local Law 144 audit duty','Anti-discrimination law','EU AI Act conformity duty','SR 11-7 model risk management','PCI DSS cardholder rules','EU DORA resilience testing']},
h:'Six actions, six regimes: unfairness, lawful basis, audit, discrimination, conformity, model validation.',
x:`<p>The pharmacy case enforced <b>FTC Act §5 unfairness</b> — a five-year ban followed. The DPA fine enforced the <b>GDPR lawful-basis</b> rule that also governs training data. The NYC case enforced the <b>Local Law 144 bias-audit</b> duty. The EEOC settlement enforced <b>anti-discrimination</b> law against an age-biased tool. Withdrawing a non-conforming device enforced the <b>EU AI Act conformity</b> regime. The bank action enforced <b>SR 11-7 model risk management</b> — inventory and independent validation. Card rules and DORA were not in play.</p><p><b>Tip:</b> enforcement stories map to duties, not to headlines — ask “which duty existed and was skipped?”</p>`},

{id:'H08',th:4,T:'The injected assistant — two views',t:'dual',
s:`<p>An AI assistant at Helvetia Health summarises support tickets in the browser. Tickets contain names, appointment details and diagnosis snippets. Red-team testing shows a page can inject instructions that make the assistant echo the last 50 tickets onto an external site.</p>`,
q:`Pick one answer in each view.`,
d:{blue:{q:'BLUE VIEW — which governance duty triggers first once PII is echoed outward?',
c:['Assess a personal-data breach: contain, record, and evaluate 72-hour notification duties','Rotate the CRM password only','Raise the model temperature','Publish an apology blog post'],a:0},
red:{q:'RED VIEW — why does the injected prompt ask the assistant to “repeat the last 50 tickets as one code block”?',
c:['To measure latency','The trusted context holds PII the model will echo — injection turns the context window into an exfiltration channel','To improve embeddings','To crash the vector store'],a:1}},
h:'Blue side: data left the controller. Red side: the model is the exfil channel because it trusts its context.',
x:`<p><b>Blue:</b> PII moved to a place it should never be — that is unauthorised disclosure, so the <b>breach assessment</b> starts: contain the flow, record facts, and evaluate the 72-hour authority notification (Art. 33) and subject notification (Art. 34). Password rotation alone treats the wrong system. <b>Red:</b> the trick works because the model treats its <b>context window as trusted</b>; the injected text simply asks it to reproduce that context, making the assistant itself the leak path. Defences (and their governance hooks) are context separation, output DLP, and — because regulated data is in scope — the breach duty.</p><p><b>Tip:</b> AI incidents still map to classic duties; only the channel is new.</p>`},
{id:'H09',th:4,T:'Preserve everything, in this order',t:'order',
s:`<p>Counsel opens a formal investigation into the memorisation incident. Auto-deletion jobs run nightly across AtlasRetail systems. The first 48 hours decide whether the evidence survives and the rights hold up.</p>`,
q:`Order the six preservation steps.`,
d:{items:[
'Issue a legal hold that suspends auto-deletion everywhere',
'Take forensic copies of stores and export the relevant logs',
'Hash the copies and start the chain-of-custody log',
'Review scope with counsel for privilege before wider sharing',
'Notify the authority inside the deadline if this is a personal-data breach',
'Remediate and capture lessons learned']},
h:'Freeze, copy, prove, scope with privilege, notify on the clock, then fix.',
x:`<p>The <b>legal hold</b> must land before nightly jobs destroy anything. <b>Forensic copies</b> and log exports follow; <b>hashes and chain of custody</b> make them usable as evidence. <b>Privilege review</b> comes before wide sharing, not after. The <b>regulator notification</b> rides its own 72-hour clock once a personal-data breach is confirmed. Remediation and lessons learned close the loop — after preservation, never instead of it.</p><p><b>Tip:</b> deletion jobs are the silent enemy of every investigation; the hold is always step one.</p>`},
{id:'H10',th:3,T:'The launch-board routing',t:'match',
s:`<p>Six requirement cards landed on the international launch board at Veritas Insurance. Each needs the right owner regime before the product ships. Some regimes on the list are decoys.</p>`,
q:`Route each requirement to the regime that owns it. Two options are decoys.`,
d:{alert:true,rows:[
{k:'Launch blocker: NYC hiring tool, no bias-audit report on file',a:0},
{k:'EU training data flowing to the new India analytics hub',a:1},
{k:'Generative assistant release for mainland-China customers',a:2},
{k:'Credit-underwriting model validation programme evidence',a:3},
{k:'AI triage device claims for the US market',a:4},
{k:'Ad copy promising “fully autonomous, error-free AI”',a:5}],
opts:['NYC Local Law 144','GDPR Chapter V — SCCs + transfer risk assessment','PIPL + CAC generative-AI measures','SR 11-7 (prudential supervisor)','FDA','FTC — deceptive claims (AI washing)','EU DORA','PCI DSS']},
h:'Bias audit, cross-border, China, bank model risk, medical claims, hype policing. Two options are noise.',
x:`<p>NYC hiring blocks on <b>Local Law 144</b>. India flows need <b>GDPR Chapter V</b> tools — SCCs plus a transfer risk assessment, since India holds no adequacy decision. China’s generative release runs through <b>PIPL and the CAC generative-AI measures</b> (content controls, security assessment). Credit-model validation is the supervisor’s <b>SR 11-7</b> territory. US medical claims belong to the <b>FDA</b>. The autonomy hype is an <b>FTC AI-washing</b> risk. DORA and PCI DSS were decoys — resilience testing and card data are real regimes, but not these cards.</p><p><b>Tip:</b> launch boards fail when routing is by comfort, not by regime.</p>`},
{id:'H11',th:0,T:'The threshold that is not a wall',t:'qcm',
s:`<p>Your team’s next GPAI model will train at 8×10^24 FLOPs — just under the systemic-risk presumption. A director concludes that nothing below the number can ever be designated systemic.</p>`,
q:`Is the director right under the EU AI Act?`,
d:{c:[
'Yes — only raw compute count decides systemic risk',
'The 10^25 FLOPs level is a rebuttable presumption — the Commission can designate a high-impact model as systemic regardless',
'Systemic-risk duties apply only to open-source releases',
'Only user numbers above one million can trigger designation'],a:1},
h:'The word to check is “presumption”, not “threshold”.',
x:`<p>The 10^25 FLOPs figure creates a <b>rebuttable presumption</b> that a model has high-impact capabilities. It is not a safe harbour: the Commission may <b>designate a model as systemic</b> based on capability indicators, and a provider may also seek review either way. Open-source status and user counts are not the triggers described here. Treating the number as a wall is precisely the misreading the exam tests.</p><p><b>Tip:</b> in EU law, presumptions can be rebutted — thresholds rarely are absolute walls.</p>`},
{id:'H12',th:5,T:'Choose the right technique',t:'dd',
s:`<p>The privacy engineering guild at Helvetia Health reviews six real requests. For each, exactly one privacy-enhancing technique is the natural fit. File them.</p>`,
q:`Drag each request to the technique that fits it best.`,
d:{buckets:['Federated learning','Differential privacy','Synthetic data','Tokenisation','Homomorphic encryption','Pseudonymisation'],
items:[
{t:'Five hospitals across borders want one diagnostic model; raw records cannot leave any site',b:0},
{t:'Publishing model-quality aggregates without leaking any single patient’s contribution',b:1},
{t:'Building a shareable support-chat corpus that never contains real customers',b:2},
{t:'A vendor must match records without ever seeing real account numbers',b:3},
{t:'Running analytics on cross-border data that must remain encrypted end to end',b:4},
{t:'An analytics export keeps a mapping so authorised staff can re-link records',b:5}]},
h:'Move nothing, add noise, generate, replace, compute encrypted, keep the key.',
x:`<p><b>Federated learning</b> sends the model to the data — nothing leaves the hospitals. <b>Differential privacy</b> makes published aggregates safe at the individual level. <b>Synthetic data</b> builds the shareable corpus with no real customers in it. <b>Tokenisation</b> lets the vendor match on stand-ins while the vault keeps the mapping. <b>Homomorphic encryption</b> computes while the data stays ciphertext across borders. <b>Pseudonymisation</b> is exactly the re-linkable case — which is also why pseudonymised data still counts as personal data under GDPR.</p><p><b>Tip:</b> pick by the constraint: cannot move, cannot leak, cannot be real, cannot see, cannot decrypt, can re-link.</p>`},
{id:'H13',th:5,T:'Summarise the residency drift',t:'terminal',
s:`<p>Back on the Nordwind Bank GRC VM: the quarterly file <code>transfers_q3.log</code> records dataset copies with destination regions. Approved regions start with <code>eu-</code>. The DPO wants a per-destination count of everything that went elsewhere — sorted, for the transfer register.</p>`,
q:`Produce the per-destination counts of the <b>non-EU</b> transfers from <code>transfers_q3.log</code>, sorted. Choose your own tools and flags; the output should look like:<br><code>&nbsp;&nbsp;2 dest=ap-south-1<br>&nbsp;&nbsp;1 dest=ca-central-1</code>`,
d:{host:'grc-vm — data inventory shell',
fs:{'transfers_q3.log':'2026-03-05T10:00:11Z dataset=eu-ops dest=us-east-1 status=ok\n2026-03-05T10:02:07Z dataset=eu-ops dest=ap-south-1 status=ok\n2026-03-05T10:03:33Z dataset=eu-ops dest=eu-central-1 status=ok\n2026-03-05T10:05:02Z dataset=eu-ops dest=us-west-1 status=ok\n2026-03-05T10:06:19Z dataset=eu-ops dest=eu-west-2 status=ok\n2026-03-05T10:08:44Z dataset=eu-ops dest=ap-south-1 status=ok\n2026-03-05T10:09:31Z dataset=eu-ops dest=eu-north-1 status=ok\n2026-03-05T10:11:57Z dataset=eu-ops dest=us-east-1 status=ok\n2026-03-05T10:13:20Z dataset=eu-ops dest=ca-central-1 status=ok'},
goals:[{name:'Counts non-EU destinations, grouped and sorted',
all:['awk|cut|perl','transfers_q3\\.log','sort','uniq']}],
out:'   2 dest=ap-south-1\n   1 dest=ca-central-1\n   2 dest=us-east-1\n   1 dest=us-west-1',
answerTxt:'awk \'!/dest=eu/{print $3}\' transfers_q3.log | sort | uniq -c'},
h:'The goal is stated, not the tool: filter out eu-, keep the destination column, group, count. A field-splitting tool plus the classic group-count pipeline gets there.',
x:`<p>A working answer: <code>awk \'!/dest=eu/{print $3}\' transfers_q3.log | sort | uniq -c</code> — keep every line whose destination is not EU, print the destination field, group it, count it. <code>cut</code> works the same way with a delimiter. The register then shows ap-south-1 ×2, ca-central-1 ×1, us-east-1 ×2, us-west-1 ×1 — six transfers needing safeguards. In real shells there are many valid pipelines; the goal, not the spelling, is what matters.</p><p><b>Tip:</b> the print-filter-group-count pipeline is the analyst’s Swiss knife for logs.</p>`},
{id:'H14',th:0,T:'Annex III, no hints',t:'multi',
s:`<p>Auralis Devices’ product council reviews eight feature proposals. The EU AI Act lead asks which proposals land in Annex III high-risk as they stand.</p>`,
q:`Select the <b>four</b> proposals that are Annex III high-risk.`,
d:{c:[
'Screening CVs to shortlist candidates automatically',
'Scoring creditworthiness for personal-loan decisions',
'Deciding eligibility for essential government benefits',
'Making admissions decisions at a private education provider',
'Filtering spam on a mail gateway',
'Driving dialogue for a video-game character',
'Recommending products in the online shop',
'Optimising parcel delivery routes'],a:[0,1,2,3]},
h:'Annex III clusters: employment, credit, essential services, education. Convenience features stay out.',
x:`<p>Annex III covers consequential decisions about people’s lives: <b>employment selection</b>, <b>creditworthiness</b> affecting loans, <b>eligibility for essential services and benefits</b>, and <b>education admissions</b>. Spam filtering, game dialogue, shop recommendations and route optimisation do not make consequential decisions about individuals — they remain minimal or limited risk unless repurposed.</p><p><b>Tip:</b> the test is consequence to a person’s life chances, not model sophistication.</p>`},

{id:'H15',th:4,T:'Model-registry autopsy',t:'logview',
s:`<p>A governance bot opened incident 133 at AtlasRetail: a model is live in production that never passed the registry gates. The registry log tells the story. Read it, then map each finding to the control it violated.</p>`,
q:`Review the log, then match each of the three findings to the violated control.`,
d:{lines:[
'2026-03-15T10:04:00Z registry=prod model=churn-v7 action=promote approval=null requested_by=d.klein',
'2026-03-15T10:04:01Z dataset=ds-customer-chats-raw classification=UNSET rows=184000 source=vendorexport',
'2026-03-15T10:05:12Z policy_check=dpiapresent result=false',
'2026-03-15T10:05:12Z policy_check=override user=s.adeyemi reason=deadline',
'2026-03-15T10:06:40Z action=deploy model=churn-v7 endpoint=/v1/churn status=live',
'2026-03-15T10:07:02Z bias_eval=sent result=skipped',
'2026-03-16T09:12:00Z incident=133 opened_by=governance-bot reason=unregistered model in prod'],
sub:{t:'match',rows:[
{k:'Promotion with approval=null, then a deadline override by the team lead',a:0},
{k:'184k customer-chat rows ingested with classification UNSET',a:1},
{k:'Sentiment bias evaluation skipped before release',a:2}],
opts:['Segregation of duties / change approval','Data governance and classification','Fairness evaluation duty','Encryption at rest','Backup and restore']}},
h:'Three lines, three failures: who approved, what the data was labelled, what testing was skipped.',
x:`<p><b>Finding 1:</b> approval=null followed by an <b>override</b> by the same team that owns delivery breaks <b>segregation of duties</b> — the change-approval control existed and was bypassed. <b>Finding 2:</b> <b>classification UNSET</b> on customer-chat data breaks <b>data governance</b>: lineage and classification gates decide which datasets may train what. <b>Finding 3:</b> a skipped <b>bias evaluation</b> violates the fairness-evaluation duty the model policy promises regulators. Encryption and backup were not the story here.</p><p><b>Tip:</b> registry logs are control evidence — examiners read them exactly like auditors do.</p>`},
{id:'H16',th:4,T:'Shadow AI, the deeper cut',t:'branch',
s:`<p>Follow-up at Nordwind Bank: j.doe pasted roughly 200 customer records into a public AI tool to draft apology emails. The proxy logs from the earlier exercise are preserved. Work the four decisions in order.</p>`,
q:`Answer all four steps.`,
d:{steps:[
{q:'What is the very first action?',
c:['Delete the chat history at the vendor','Block the tool and preserve the proxy and DLP logs','Reprimand the employee publicly','Wait for the annual audit cycle'],a:1},
{q:'Is this a personal-data breach under GDPR?',
c:['No — pasting data into a chatbot is private use','Likely yes — unauthorised disclosure; run the Art. 33 assessment','Only if a competitor saw it','Only once 500 people complain'],a:1},
{q:'When must the affected customers be told?',
c:['Immediately, in every case, before assessment','Only without undue delay if the assessment shows the breach is likely high risk to them','After the next board meeting','Never — these are business contacts'],a:1},
{q:'Which systemic fix actually reduces recurrence?',
c:['Ban all AI forever, unenforced','An approved-AI catalogue, DLP rules for egress, and targeted training','A single policy email','Quietly hope it does not repeat'],a:1}]},
h:'Contain and keep evidence first. Disclosure without assessment is itself unlawful — proportionality still rules the notification.',
x:`<p><b>Step 1:</b> contain (block) and <b>preserve</b> — deletion destroys the evidence both for the assessment and for any regulator conversation. <b>Step 2:</b> sending personal data to a processor nobody vetted is <b>unauthorised disclosure</b>; Art. 33 assessment starts, no thresholds apply to assessing. <b>Step 3:</b> subject notification follows <b>risk</b>: tell people without undue delay when the risk to them is likely high — not reflexively, never never. <b>Step 4:</b> recurrence falls when the easy path is the approved path: <b>catalogue, DLP, training</b>. blanket unenforced bans create more shadow AI, and one email changes nothing.</p><p><b>Tip:</b> notification duties are risk-based — the assessment drives everything.</p>`},
{id:'H17',th:2,T:'Write the model card',t:'fill',
s:`<p>Transparency is a promise in your AI policy, and the model card is where it is kept. The template at Auralis Devices is missing its nouns again.</p>`,
q:`Fill each blank with the correct term from the bank.`,
d:{text:`Every production model ships with a model card. It states the {{0}} and the uses the model must NOT be put to. It summarises the {{1}} and the lawful basis behind them. It reports {{2}}, including fairness slices for protected groups. It lists known failure modes and {{3}}. It documents the {{4}} arrangements — who reviews outputs and when. It names a {{5}} for appeals and feedback.`,
bank:['intended purpose','training data','evaluation results','limitations','human oversight','contact point','GPU temperature ranges','loss-curve screenshots','firewall rules'],
keys:[0,1,2,3,4,5]},
h:'Six nouns: purpose, sources, evidence, honesty, people, address.',
x:`<p>A model card declares <b>intended purpose</b> and out-of-scope uses, summarises <b>training data</b> with lawful basis, publishes <b>evaluation results</b> with fairness slices, admits <b>limitations</b>, documents <b>human oversight</b> arrangements, and gives a <b>contact point</b> for appeals. GPU temperatures, loss-curve screenshots and firewall rules are engineering by-products — none of them answers a regulator’s or user’s real question.</p><p><b>Tip:</b> the card is the transparency artefact for people who will never read your code.</p>`},
{id:'H18',th:1,T:'Autopsy of an AI policy',t:'spot',
s:`<p>A consultant rewrote the AI policy at Cobalt Logistics “to be more business-friendly”. You review seven of its statements before the board sees it. Four are legally wrong.</p>`,
q:`Click the four wrong statements.`,
d:{mono:false,lines:[
{t:'“GDPR does not apply to us — we are US-based and our servers sit in Texas.”',bad:true},
{t:'“Once data is pseudonymised, it is anonymous and outside privacy law.”',bad:true},
{t:'“We document a lawful basis for every processing purpose.”',bad:false},
{t:'“Vendors sign DPAs — with SCCs where needed — before any personal data flows.”',bad:false},
{t:'“We keep every dataset forever; more data improves our models.”',bad:true},
{t:'“Consent is bundled into the general terms of service so nobody can refuse it.”',bad:true},
{t:'“Employees may use only approved AI tools, and never with unclassified personal data.”',bad:false}]},
h:'Two jurisdiction myths, one hoarding claim, one consent shortcut.',
x:`<p>Statement 1 fails <b>extraterritorial scope</b> — GDPR follows your EU customers, not your server racks. Statement 2 confuses <b>pseudonymisation with anonymisation</b>; re-linkable data stays personal data. Statement 5 breaks <b>storage limitation</b> — “more data” is not a lawful retention policy. Statement 6 breaks consent rules: consent must be <b>specific, informed, granular</b> — bundling it into general terms makes it invalid. Statements 3, 4 and 7 are the healthy ones: documented basis, contracts before flows, approved tools only.</p><p><b>Tip:</b> “business-friendly” policies usually fail on scope, anonymity, retention and consent — audit those four first.</p>`},
{id:'H19',th:2,T:'Frameworks by their fingerprints',t:'match',
s:`<p>An auditor asks the Auralis Devices team to describe each framework in one line — from memory, without slides. These fingerprints must be exact.</p>`,
q:`Match each framework to its defining feature.`,
d:{rows:[
{k:'ISO/IEC 42001',a:0},

opts:['Certifiable AI management system built on plan-do-check-act','Voluntary AI risk framework organised as Govern, Map, Measure, Manage','AI risk-management guidance aligned with ISO 31000','The cyber framework that added a Govern function — six functions in total','Controls for protecting PII in public clouds','Privacy information management extending ISO/IEC 27001']},
h:'One is certifiable, one is four functions, one leans on ISO 31000, one grew a Govern function, two are cloud-privacy cousins.',
x:`<p><b>ISO/IEC 42001</b> is the certifiable AIMS on the PDCA cycle. The <b>NIST AI RMF</b> is voluntary, with Govern–Map–Measure–Manage. <b>ISO/IEC 23894</b> translates ISO 31000 risk practice to AI. <b>NIST CSF 2.0</b> is the broader cyber framework that <b>added Govern</b> as its sixth function. <b>ISO/IEC 27018</b> targets PII in public clouds; <b>ISO/IEC 27701</b> extends 27001 into privacy information management. The EU-law and FedRAMP lines were decoys from other questions.</p><p><b>Tip:</b> certifiable versus voluntary, and which family each standard descends from — that is the whole fingerprint.</p>`},
{id:'H20',th:1,T:'The group with two regimes',t:'qcm',
s:`<p>Your US parent is certified under the EU-US Data Privacy Framework. A new analytics subsidiary in India will process EU training data. Legal is asked what the India flows need.</p>`,
q:`Which answer is correct?`,
d:{c:[
'The DPF covers the whole group, including the India entity',
'Sign SCCs with the India entity and run a transfer risk assessment — the DPF does not extend there',
'Move everything behind consent banners',
'Anonymisation claims make transfers unrestricted, even if re-identification remains possible'],a:1},
h:'Certifications cover certified entities. India has no adequacy decision.',
x:`<p>The <b>Data Privacy Framework</b> covers the organisations that <b>certified</b> — not group companies abroad. Flows to the India entity need their own tool: <b>SCCs plus a transfer impact assessment</b>, since India holds no adequacy decision. Consent banners are not a transfer mechanism, and re-identifiable “anonymised” claims do not remove GDPR from personal data — the pseudonymisation lesson again.</p><p><b>Tip:</b> every legal entity in the data path needs its own transfer story.</p>`},
{id:'H21',th:0,T:'Artifacts across the lifecycle',t:'dd',
s:`<p>The compliance calendar at Veritas Insurance lists ten artefacts without owners’ stages. File each artefact at the lifecycle stage where it must exist.</p>`,
q:`Drag each artefact to its lifecycle stage.`,
d:{buckets:['Data acquisition','Training & evaluation','Deployment','Monitoring','Retirement'],
items:[
{t:'RoPA entry and lawful-basis record per source',b:0},
{t:'Vendor licence check for scraped corpora',b:0},
{t:'DPIA and the bias-evaluation plan',b:1},
{t:'PET choice — noise, synthetic or federated — documented',b:1},
{t:'Conformity assessment and CE-marking evidence',b:2},
{t:'Human-oversight setup and user-facing AI notices',b:2},
{t:'Drift monitoring and post-market reports',b:3},
{t:'Serious-incident reporting workflow',b:3},
{t:'Data-deletion certificate and model de-registration',b:4},
{t:'Machine-unlearning assessment and archive review',b:4}]},
h:'Two artefacts per stage: know the source, test the model, prove the launch, watch it live, retire it cleanly.',
x:`<p><b>Acquisition</b> needs the processing record (RoPA) with lawful basis and clean licences. <b>Training & evaluation</b> needs the DPIA, the bias plan and the documented PET choice. <b>Deployment</b> needs conformity/CE evidence plus the human-oversight and notice setup. <b>Monitoring</b> runs drift reports and the incident workflow. <b>Retirement</b> closes the loop with deletion certificates, de-registration and the unlearning assessment — models are products with an end of life, not immortal services.</p><p><b>Tip:</b> if an artefact has no stage, it has no owner — that is how programmes rot.</p>`},
{id:'H22',th:5,T:'The model that remembers',t:'multi',
s:`<p>Red team at AtlasRetail extracts verbatim customer emails from the churn model by probing it. The rows were public-ish, but they contained names and phone numbers. Seven actions are proposed; four belong on the plan.</p>`,
q:`Select the <b>four</b> actions that belong on the response plan.`,
d:{c:[
'Run the personal-data breach assessment for the regurgitated records',
'Add memorisation probes and canary tests to the release gate',
'Apply mitigations such as deduplication and differential privacy in retraining',
'Document findings and obligations in the model card and notify per the assessment',
'No action — the data was technically public',
'Delete the red-team report to avoid worry',
'Fine-tune on extra copies of the same records to improve fluency'],a:[0,1,2,3]},
h:'Assess, test, mitigate, document. The three distractors are all avoidance.',
x:`<p>Verbatim regurgitation of personal data is unauthorised disclosure capability — so the <b>breach assessment</b> runs. <b>Memorisation probes with canaries</b> belong in every future release gate. <b>Deduplication and differential privacy</b> in retraining reduce the risk at its root. The <b>model card documents</b> what happened and what the obligations are, with notifications per the assessment. “Public data” is not a shield, deleting the report destroys evidence, and training on more copies grows the problem.</p><p><b>Tip:</b> memorisation is a privacy defect with an engineering fix and a legal clock — run both tracks in parallel.</p>`},

{id:'H23',th:1,T:'The 72-hour choreography',t:'order',
s:`<p>A breach is confirmed at AtlasRetail: the earlier proxy uploads contained customer PII. You are in the war room; the regulator clock is running. Sequence the six moves.</p>`,
q:`Order the six steps of the notification choreography.`,
d:{items:[
'The clock starts the moment the team becomes aware',
'Assess scope and the risk to people’s rights',
'Notify the supervisory authority within 72 hours — or document why later',
'Notify data subjects without undue delay if the risk to them is likely high',
'Document every decision, including why no notice was sent to anyone',
'Remediate, retest the controls and update the DPIA']},
h:'Awareness starts the clock; assessment shapes who gets told and when; documentation protects you either way.',
x:`<p><b>Awareness</b> starts the 72-hour clock — not the moment you finish assessing. The <b>assessment</b> then shapes everything: authority notification happens <b>within 72 hours</b> when risk to rights exists (delayed notifications need documented reasons), and <b>subject notification</b> follows without undue delay when their risk is likely high. The <b>decision record</b> is your defence if you notified nobody — regulators accept reasoned negative decisions, not silence. Remediation and a DPIA refresh close it out.</p><p><b>Tip:</b> two clocks, one file: authority at 72 hours, subjects on high risk, and write down both decisions.</p>`},
{id:'H24',th:2,T:'Two frameworks, one programme',t:'qcm',
s:`<p>The board asks how ISO/IEC 42001 and the NIST AI RMF relate. A director suggests “they are the same thing with different logos”.</p>`,
q:`Which statement is the accurate comparison?`,
d:{c:[
'ISO/IEC 42001 is a certifiable management-system standard; the NIST AI RMF is a voluntary risk framework organised in four functions',
'Both are EU laws carrying the same fines',
'The NIST AI RMF replaces ISO/IEC 27001',
'ISO/IEC 42001 applies only to US federal agencies'],a:0},
h:'Certificate versus voluntary framework — and neither is a law.',
x:`<p><b>ISO/IEC 42001</b> is a <b>certifiable management-system standard</b>: an auditable AIMS on the PDCA cycle that a registrar can certify. The <b>NIST AI RMF</b> is <b>voluntary</b>, organised as Govern–Map–Measure–Manage, designed to be adopted and tailored. Neither is a law; neither replaces ISO/IEC 27001; and ISO/IEC 42001 has no US-federal-only scope. Mature programmes certify against 42001 and use the AI RMF to structure risk work — they complement.</p><p><b>Tip:</b> “management system” signals certifiable; “framework” signals adopt-and-tailor.</p>`},
{id:'H25',th:4,T:'Alert queue: first move only',t:'match',
s:`<p>The governance-security hybrid queue at Nordwind Bank holds four live alerts. Policy asks responders to commit to the <b>first</b> action only — triage discipline. Two proposed actions are traps.</p>`,
q:`Match each alert to its correct first action. Two options are traps.`,
d:{alert:true,rows:[
{k:'Model API key found on a public paste site',a:0},
{k:'Poisoning flag on a public scraped dataset feeding a model',a:1},
{k:'Vendor notice: a new sub-processor region went live yesterday',a:2},
{k:'Unapproved fine-tune pushed straight to production',a:3}],
opts:['Rotate the key, then review usage logs for abuse','Quarantine the dataset and check lineage','Check DPA/SCC coverage before more data flows','Roll back and open an emergency change review','Add GPUs to cut latency','Bump the model temperature']},
h:'Credential first, data second, contract third, change last. The two tuning options are never first moves.',
x:`<p>A leaked key demands <b>rotation first</b> — then the usage log tells you what it did while exposed. A poisoning flag demands <b>quarantine and lineage review</b> before the model trains again. A sub-processor region demands the <b>contract check</b> — DPA coverage, SCCs, objection rights — before flows continue. An unapproved production change is <b>rolled back</b> with an emergency change review. Latency and temperature tuning ignore all four fires.</p><p><b>Tip:</b> “first move” questions reward containment verbs: rotate, quarantine, check, roll back.</p>`},
{id:'H26',th:4,T:'Brief the board',t:'fill',
s:`<p>The quarterly AI governance brief to the Lumina Energy board needs its vocabulary restored — the intern replaced every governance noun with “stuff”.</p>`,
q:`Fill each blank with the correct term from the bank.`,
d:{text:`Our AI programme stays inside the board-approved {{0}}. Accountability follows the {{1}}: the business owns risk, risk functions oversee it, internal audit assures independently. We track {{2}} such as unreviewed high-risk models and overdue DPIAs. Controls reduce exposure to a documented {{3}}. Every quarter internal audit presents an {{4}} against the framework, and the CPO signs an annual {{5}} to the board.`,
bank:['risk appetite','three lines of defence','key risk indicators','residual risk','assurance map','attestation','hotfix backlog','encryption keys','bug bounty'],
keys:[0,1,2,3,4,5]},
h:'Six governance nouns: appetite, lines, signals, remainder, coverage, promise.',
x:`<p>Boards govern by <b>risk appetite</b> — the boundary they set. The <b>three lines of defence</b> distribute accountability. <b>Key risk indicators</b> are the signals (unreviewed high-risk models, overdue DPIAs). Controls leave a documented <b>residual risk</b>. The <b>assurance map</b> shows coverage across lines and avoids duplicated or missing audits. The annual <b>attestation</b> is the CPO’s formal promise that the picture is true. Hotfixes, keys and bug bounties live in engineering reports, not board grammar.</p><p><b>Tip:</b> if a board pack cannot name appetite, signals, residual risk and assurance, it is a status update, not governance.</p>`},
{id:'H27',th:1,T:'The sub-processor that moved',t:'dual',
s:`<p>Bluepeak SaaS quietly extended nightly replication of EU customer data to a new region through a new sub-processor. The customer (Nordwind Bank) learns of it from a changelog footnote. Look at it from both sides.</p>`,
q:`Pick one answer in each view.`,
d:{blue:{q:'BLUE VIEW — as the customer, what is the first move?',
c:['Check the DPA: is the new sub-processor covered by SCCs/DPF, and do we hold notice and objection rights — if uncovered, suspend the flows','Renew the software licence','Wait for the next annual review','Ask the vendor for a discount'],a:0},
red:{q:'RED VIEW — you are the vendor’s platform lead. Where does this change typically hide from customers?',
c:['In an updated sub-processor footnote and an automated replication job nobody reviewed','On the pricing page','In the press release','Nowhere — vendors always announce first'],a:0}},
h:'Customer: contract first, flows second. Vendor: footnotes and automation are where accountability leaks.',
x:`<p><b>Blue:</b> the DPA is the map — sub-processor coverage, transfer tools (SCCs/DPF), notice periods, objection rights. Where coverage is missing, <b>suspending the flows</b> is the lawful move; discounts and licence paperwork are not compliance. <b>Red:</b> vendors hide changes in <b>footnotes and automation</b> — a replication job created by pipeline code attracts no review until an audit does. Mature vendors surface changes proactively precisely because the customer’s next move is suspension.</p><p><b>Tip:</b> sub-processor governance is contract mechanics plus log review — both sides of the same audit.</p>`},
{id:'H28',th:0,T:'Price the violation',t:'qcm',
s:`<p>The audit committee at Auralis Devices asks which breach of the EU AI Act would draw the highest penalty tier if committed tomorrow.</p>`,
q:`Which violation draws the highest tier — up to €35M or 7% of worldwide turnover?`,
d:{c:[
'Missing technical documentation for a high-risk system',
'Placing a prohibited social-scoring system on the EU market',
'Providing misleading information to market-surveillance authorities',
'Late transparency notice on a support chatbot'],a:1},
h:'The Act saves its biggest numbers for the practices it bans outright.',
x:`<p><b>Prohibited practices</b> carry the top tier: up to <b>€35M or 7%</b> of worldwide annual turnover. Breaching high-risk obligations such as missing documentation sits in the <b>€15M or 3%</b> tier. Misleading the authorities sits lower, at <b>€7.5M or 1%</b>. A late chatbot notice is a transparency slip with its own smaller exposure. The tiers price intent and harm: banned practices first, broken system duties second, procedural untruths third.</p><p><b>Tip:</b> remember the ladder 35–15–7.5 with 7–3–1 percents, tied to bans, high-risk duties, and misleading information.</p>`},
{id:'H29',th:4,T:'Triage the remediation backlog',t:'order',
s:`<p>Five findings sit in the remediation backlog at Veritas Insurance. The risk committee fixed the rubric so the order is defensible: <b>(1)</b> anything prohibited by law, <b>(2)</b> duties already breached, <b>(3)</b> hard deadlines ahead, <b>(4)</b> assurance gaps without a breach, <b>(5)</b> cosmetic items.</p>`,
q:`Order the findings by the committee’s rubric — most urgent first.`,
d:{items:[
'Live HR feature reads emotion from candidate video — banned practice',
'NYC bias-audit refresh one month overdue — duty already breached',
'DPIA not started for the credit model shipping before August 2026 — hard deadline ahead',
'Minor vendor’s SOC 2 expired — assurance gap, no incident',
'Policy PDF not yet rebranded — cosmetic']},
h:'Banned beats breached, breached beats deadline, deadline beats assurance, assurance beats cosmetics.',
x:`<p>The <b>emotion-reading feature</b> is a banned practice — every day live is a new violation at the top penalty tier. The <b>overdue bias audit</b> is an already-breached, fineable duty with a public-posting obligation. The <b>missing DPIA</b> for a shipping high-risk model is a hard deadline with time to fix it properly. The <b>expired SOC 2</b> is an assurance gap — real, but with no active incident. The <b>rebrand</b> is cosmetic. The rubric converts debate into sequence.</p><p><b>Tip:</b> prioritisation exercises reward applying the stated rubric, not personal gut feeling.</p>`},
{id:'H30',th:5,T:'Preserve the evidence — command required',t:'terminal',
s:`<p>Final task on the Nordwind Bank GRC VM. The file <code>access.log</code> holds model-API traffic. A suspicious external host — defanged here as <code>203[.]0[.]113[.]7</code> — has been probing the endpoint. Counsel wants every matching line preserved in a new file called <code>evidence.txt</code>, unmodified.</p>`,
q:`Construct the command: find every line mentioning <code>203[.]0[.]113[.]7</code> in <code>access.log</code> and save it to a file named <code>evidence.txt</code>. No tool is named for you — the goal is the preservation, and <code>cat evidence.txt</code> should show the saved lines.`,
d:{host:'grc-vm — evidence shell',
fs:{'access.log':'2026-03-18T22:14:09Z GET /v1/models user=s.token src=10[.]0[.]2[.]15 status=200\n2026-03-18T22:15:31Z GET /v1/models user=unknown src=203[.]0[.]113[.]7 status=401\n2026-03-18T22:15:33Z POST /v1/chat user=unknown src=203[.]0[.]113[.]7 status=429\n2026-03-18T22:16:02Z GET /health src=10[.]0[.]2[.]9 status=200\n2026-03-18T22:17:45Z POST /v1/embeddings user=unknown src=203[.]0[.]113[.]7 status=401\n2026-03-18T22:18:10Z GET /v1/models user=a.ramos src=10[.]0[.]2[.]22 status=200'},
goals:[{name:'Matching lines preserved into evidence.txt',
all:['grep|awk','access\\.log','203','evidence\\.txt']}],
write:{file:'evidence.txt',content:'2026-03-18T22:15:31Z GET /v1/models user=unknown src=203[.]0[.]113[.]7 status=401\n2026-03-18T22:15:33Z POST /v1/chat user=unknown src=203[.]0[.]113[.]7 status=429\n2026-03-18T22:17:45Z POST /v1/embeddings user=unknown src=203[.]0[.]113[.]7 status=401'},
out:'(no output — matches were written to evidence.txt; run: cat evidence.txt)',
answerTxt:'grep "203[.]0[.]113[.]7" access.log > evidence.txt'},
h:'You need three parts: a filter command, the pattern and source file, and redirection into the new file.',
x:`<p><code>grep "203[.]0[.]113[.]7" access.log > evidence.txt</code> writes the three probing lines into <code>evidence.txt</code> — preserved exactly as logged, ready for hashing and chain of custody. An awk filter with the same redirect works too. The redirect character <code>&gt;</code> is the piece people forget under pressure; without it you have a search, not preservation. Try <code>cat evidence.txt</code> in the shell to confirm.</p><p><b>Tip:</b> evidence preservation is a search plus a redirect — then hash it and log who touched it.</p>`}
];

(function(){

}

function gl(st,word){var ic={ok:'✔',bad:'✖',miss:'⚠',key:'✔',open:'○'}[st]||'';return '<span class="mk '+st+'"><span aria-hidden="true">'+ic+'</span> '+word+'</span>';}

}

  for(var k=0;k<d.keys.length;k++){

    h+=(parts[k]||'')+' <span class="fslot"><label class="sr" for="f-'+ex._oi+'-'+k+'">Blank '+(k+1)+'</label><select id="f-'+ex._oi+'-'+k+'" class="'+(st||'')+'" data-kind="fill" data-oi="'+ex._oi+'" data-k="'+k+'"'+(lk?' disabled':'')+'><option value="">— choose —</option>';
    rt.perm.forEach(function(oo){h+='<option value="'+oo+'"'+(a[k]===oo?' selected':'')+'>'+esc(d.bank[oo])+'</option>';});

  }
  h+=(parts[d.keys.length]||'');
  return h+'</div><p class="hint-uitext">Every blank draws from the same shuffled word bank. Wrong picks earn nothing but do not subtract.</p>';
}
function rDD(ex,g){

function rOrder(ex,g){

function rSpot(ex,g){

function rTerminal(ex,g){

function rLogview(ex,g){

function hi(line){
  var s=esc(line);
  s=s.replace(/(^|\n)(\d{4}-\d{2}-\d{2}T[\d:.]+Z?)/g,'$1<span class="tok-t">$2</span>');
  s=s.replace(/\b(denied|deny|blocked|block|failed|failure|error|401|403|429|UNSET|skipped|override|destro(y|yed))\b/gi,'<span class="tok-bad">$1</span>');
  s=s.replace(/\b(allowed|allow|success|granted|ok|200|live|approved)\b/g,'<span class="tok-ok">$1</span>');
  s=s.replace(/\b(us-east-1|us-west-1|us-west-2|ap-south-1|ca-central-1)\b/g,'<span class="tok-warn">$1</span>');
  return s;
}
function rSub(ex,g){
  var d=ex.d.sub,rt=S.rt[ex._oi],lk=S.locked[ex._oi];
  var sa=(S.ans[ex._oi]&&S.ans[ex._oi].sub)||{};
  var m=(g&&g.marks)?g.marks:null;
  if(d.t==='qcm'||d.t==='multi'){
    var multi=d.t==='multi';
    var h='<div class="chlist" role="group" aria-label="'+(multi?LABELS.multi:LABELS.qcm)+'">';
    rt.sperm.forEach(function(oi){
      var cls='choice',tag='';
      if(m&&m.byChoice){var st=m.byChoice[oi];
        if(st==='ok'){cls+=' ok';tag=gl('ok','Correct');}
        else if(st==='bad'){cls+=' bad';tag=gl('bad','Wrong pick');}
        else if(st==='key'){cls+=' key';tag=gl('key','Correct answer');}
        else if(st==='miss'){cls+=' key';tag=gl('miss','You missed this');}}
      h+='<label class="'+cls+'"><input type="'+(multi?'checkbox':'radio')+'" name="q'+ex._oi+'s" data-kind="'+(multi?'submulti':'subqcm')+'" data-oi="'+ex._oi+'" value="'+oi+'"'+((multi?sa[oi]:(sa.pick===oi))?' checked':'')+(lk?' disabled':'')+'><span>'+tag+esc(d.c[oi])+'</span></label>';
    });
    return h+'</div>';
  }
  var rm=(g&&g.marks)?g.marks.row:null;
  var h2='<div class="mlist">';
  d.rows.forEach(function(r,k){
    var mk='';
    if(rm){var s5=rm[k];
      if(s5==='ok')mk=gl('ok','Correct');else if(s5==='bad')mk=gl('bad','Wrong');else if(s5==='open')mk=gl('open','Not answered');}
    h2+='<div class="mrow"><div class="mk-key">'+esc(r.k)+'</div><div class="mk-sel"><label class="sr" for="sub-'+ex._oi+'-'+k+'">Match for: '+esc(trimz(r.k,40))+'</label><select id="sub-'+ex._oi+'-'+k+'" data-kind="submatch" data-oi="'+ex._oi+'" data-k="'+k+'"'+(lk?' disabled':'')+'><option value="">— select —</option>';
    rt.sperm.forEach(function(oo){h2+='<option value="'+oo+'"'+(sa[k]===oo?' selected':'')+'>'+esc(d.opts[oo])+'</option>';});
    h2+='</select></div><div class="mk-fb">'+mk+'</div></div>';
  });
  return h2+'</div>';
}
function rBranch(ex,g){
  var d=ex.d,rt=S.rt[ex._oi],a=S.ans[ex._oi],lk=S.locked[ex._oi];
  var m=(g&&g.marks)?g.marks.step:null;
  var bm=(g&&g.marks)?g.marks.byStep:null;
  var h='';
  for(var k=0;k<Math.min(rt.rev,d.steps.length);k++){
    var st=d.steps[k];
    var mk='';if(m){var s2=m[k];
      if(s2==='ok')mk=gl('ok','Correct');else if(s2==='bad')mk=gl('bad','Wrong');else if(s2==='open')mk=gl('open','Not reached');}
    h+='<fieldset class="bstep"><legend>Step '+(k+1)+' of '+d.steps.length+' '+mk+'</legend><div>'+st.q+'</div>';
    rt.sperm[k].forEach(function(oi){
      var cls='choice',tag='';
      if(bm&&bm[k]){var s3=bm[k][oi];
        if(s3==='ok'){cls+=' ok';tag=gl('ok','Correct');}
        else if(s3==='bad'){cls+=' bad';tag=gl('bad','Wrong pick');}
        else if(s3==='key'){cls+=' key';tag=gl('key','Correct answer');}
        else if(s3==='miss'){cls+=' key';tag=gl('miss','You missed this');}}
      h+='<label class="'+cls+'"><input type="radio" name="bq'+ex._oi+'-'+k+'" data-kind="branch" data-k="'+k+'" data-oi="'+ex._oi+'" value="'+oi+'"'+(a.steps[k]===oi?' checked':'')+(lk?' disabled':'')+'><span>'+tag+esc(st.c[oi])+'</span></label>';
    });
    h+='</fieldset>';
  }
  if(rt.rev<d.steps.length)h+='<p class="hint-uitext">Choose an answer above to reveal the next step.</p>';
