var EXAM={"themes":[{"id":"A","name":"AI event triage","kws":["Event/alert triage","True / false / benign positive","Alert fatigue & noise reduction","Deduplication & aggregation","Confidence & risk scoring","Precision, recall & F1","Threshold tuning","Alert prioritization (P1–P4)","IOC & context enrichment","UEBA baselines & peer groups","LLM-assisted triage & hallucination risk"]},{"id":"B","name":"Alert correlation","kws":["Alert correlation","Multi-stage attack chains","Entity linking","Time-window correlation","Correlation rule logic (AND/sequence)","ATT&CK tactics & techniques","Anomaly detection","Beaconing & jitter detection","Suppression & rule tuning","Case building","TIP / STIX / TAXII intel matching"]},{"id":"C","name":"Response orchestration (SOAR)","kws":["SOAR platforms","Playbooks vs runbooks","Human-in-the-loop approval","Containment actions","Eradication & recovery","Rollback & guardrails","Break-glass procedures","Case management & ticketing","Webhook / API integration","Forensic-safe evidence handling"]},{"id":"D","name":"Metrics, governance & automation safety","kws":["MTTD & MTTR","FPR & confusion matrix","Feedback loops & retraining","Model drift","Least privilege for automation","Secrets management","Audit trails","Change control & shadow mode","Explainability & over-reliance","Prompt injection & PII care","Defanged IOC reporting"]}],"blurb":"This HARD exam pushes SecAI+ objective 3.2 to expert level: ambiguous artefacts where the obvious answer is wrong, near-miss options, attacker tradecraft, multi-source correlation, LLM failure modes, and judgement calls about automating response. Read every artefact before committing; several correct-looking options are traps.","howto":["Press <b>Check</b> to grade and lock your answer. The timer pauses in <b>review mode</b> until you press <b>Next</b> — feedback marks and the explanation stay fully visible while paused.","<b>Revise</b> unlocks a checked exercise for editing; your last validated score stands until you press Check again.","<b>Skip</b> moves on without scoring. You can return to any skipped exercise before the exam ends; skipped exercises are excluded from the score (removed from both numerator and denominator).","<b>Pause</b> (manual) hides the exercise and freezes the clock. The Check-pause is separate: it shows feedback and only ends with Next. The two pause reasons can stack.","Multi-answer exercises earn <b>partial credit per correct element</b>. Wrong picks never subtract — they simply earn nothing.","A <b>hint</b> reveals a nudge, never the answer, and costs 10% of that exercise's points per use.","Pass mark is <b>70%</b>. Final score = earned points ÷ points of non-skipped exercises, rounded once.","On retake, the exercise order and all answer choices reshuffle."],"exercises":[{"id":"h01","type":"logviewer","theme":"B","timeSec":140,"title":"Three-stage chain across three sources","scenario":"<p>02:00–02:30, finance segment. Security Hub raised one finding; you pulled CloudTrail and the VPC flow logs. Two other services show routine activity that is easy to blame.</p>","question":"<p>Which case summary is supported by the evidence?</p>","logs":["{\"ts\":\"01:58:03\",\"event\":\"RotateApiKey\",\"user\":\"svc-report\",\"src\":\"10[.]0[.]40.12\",\"note\":\"scheduled monthly rotation, CHG-2210\"}","{\"ts\":\"02:01:11\",\"event\":\"ConsoleLogin\",\"user\":\"fin-svc\",\"mfa\":\"false\",\"src\":\"198[.]51[.]100.71\",\"note\":\"first time this ASN\"}","{\"ts\":\"02:03:29\",\"event\":\"CreateAccessKey\",\"actor\":\"fin-svc\",\"target\":\"fin-svc\",\"src\":\"198[.]51[.]100.71\"}","{\"ts\":\"02:06:15\",\"event\":\"ListSecrets\",\"user\":\"fin-svc\",\"src\":\"198[.]51[.]100.71\"}","{\"ts\":\"02:07:44\",\"event\":\"GetSecretValue\",\"user\":\"fin-svc\",\"secret\":\"prod-db-master\",\"src\":\"198[.]51[.]100.71\"}","{\"ts\":\"02:12:02\",\"event\":\"ConsoleLogin\",\"user\":\"r.ibarra\",\"result\":\"failed\",\"src\":\"198[.]51[.]100.15\",\"note\":\"typos in password\"}","{\"ts\":\"02:12:31\",\"event\":\"ConsoleLogin\",\"user\":\"r.ibarra\",\"result\":\"failed\",\"src\":\"198[.]51[.]100.15\"}","{\"ts\":\"02:14:57\",\"flow\":\"fin-db-01 → 203[.]0[.]113.44:443 bytes=1213000000 dur=610s\",\"note\":\"1.2 GB outbound\"}","{\"ts\":\"02:19:40\",\"event\":\"DescribeInstances\",\"user\":\"mon-02\",\"src\":\"10[.]0[.]30.5\"}","{\"ts\":\"02:24:18\",\"flow\":\"fin-db-01 → 10[.]0[.]30.9:2049 bytes=8400000\",\"note\":\"nightly export to reporting\"}"],"sub":{"type":"qcm","options":["Compromised fin-svc: new-ASN login → self-issued key → prod-db-master secret read → 1.2 GB egress from the DB host. Tags: Valid Accounts, Secrets access, Exfiltration over web service.","Benign key rotation: svc-report rotates keys monthly, and the 1.2 GB flow is the nightly export to reporting.","Data staging only — nothing left the VPC, so no exfiltration occurred.","Brute force against r.ibarra — the two failed logins are the incident, everything else is noise."],"correct":[0]},"explain":"<p>The chain is unbroken: fin-svc logs in from a first-time ASN without MFA, mints its own key (self-issued persistence), reads the <b>prod-db-master</b> secret, and the DB host then pushes 1.2 GB to 203[.]0[.]113.44:443 — an external address, not the reporting host (10[.]0[.]30.9, 8.4 MB nightly, port 2049). The rotation at 01:58 is real but belongs to svc-report per CHG-2210, and the two failed r.ibarra logins are a different, unsuccessful pattern. Tagging matters for the next hunt: Valid Accounts (T1078), secret access, exfiltration over a web service.</p>","hints":["Follow fin-svc only — what does it do in sequence, and where does the DB host send 1.2 GB?","The rotation and the export both have routine signatures: scheduled change, internal destination, small size."],"tip":"Correlate by identity across sources, and separate each flow by destination, size, and schedule before merging stories."},{"id":"h02","type":"branch","theme":"A","timeSec":140,"title":"The obvious answer is wrong","scenario":"<p>02:00. Host fin-rpt-03 beacons to 203[.]0[.]113.9:443 every ~90 seconds, 900±30 bytes. A 'file agent' was installed on the host last week. DLP shows a nightly customer.parquet upload to the same IP. This looks like textbook exfiltration.</p>","question":"<p>Work the scenario. Each choice shows its consequence.</p>","branch":[{"q":"Before you isolate fin-rpt-03, what do you check first?","opts":[{"t":"Asset ownership and change tickets: who owns fin-rpt-03, and what was installed last week?","after":"Ticket CHG-2210: a compliance data agent was installed; the vendor documentation says it uploads to 203[.]0[.]113.9 every 90 seconds."},{"t":"Isolate immediately — beacons are never benign.","after":"You isolate the host mid-batch. The month-end compliance upload fails, and two hours later you find the change ticket."},{"t":"Ask the user in chat whether anything is running.","after":"The user does not know what 'file agent' means. You burned 40 minutes for nothing."}],"c":0},{"q":"The vendor documentation matches the pattern exactly: 90-second interval, ~900 bytes, nightly file upload. Classification?","opts":[{"t":"Benign positive — the activity is real and matches the rule, but it is documented and approved.","after":"You label it benign positive and queue an allowlist entry instead of an incident."},{"t":"False positive — nothing described by the rule happened.","after":"Wrong: the rule detected real uploads. A false positive means the detection itself was wrong, which is not the case."},{"t":"True positive — encrypted uploads are always exfiltration.","after":"Encrypted and approved still happen. You would chase the compliance team's own tooling every night."}],"c":0},{"q":"What closes the loop so the model stops paging on this every night?","opts":[{"t":"Allowlist the agent-plus-destination pair with an owner and an expiry, and feed the disposition back for retraining.","after":"The allowlist entry expires in 90 days, the owner is the compliance lead, and the model's precision on this pattern recovers."},{"t":"Shut off the DLP rule that created the alerts.","after":"The rule was right. Killing it blinds you to a real exfil using the same path later."},{"t":"Uninstall the agent everywhere.","after":"You just broke a compliance requirement to silence an alert — the trade nobody should make quietly."}],"c":0}],"explain":"<p>This is the discipline test: perfect beacon telemetry with a mundane explanation. The correct first move is asset and change context — CHG-2210 explains everything. Because the activity is real and matches the rule but is approved, it is a <b>benign positive</b>, not a false positive; confusing the two corrupts your metrics and retrains the model wrongly. The fix is an allowlist entry with an owner and an expiry, plus feedback to the model — not destroying the detection or the compliance control.</p>","hints":["Step 1: what organisational record explains software that was installed last week?","Step 2: real activity + approval = which disposition? Wrong detection = which disposition?"],"tip":"Check change tickets before containment. Benign positive ≠ false positive, and allowlists need owners and expiry dates."},{"id":"h03","type":"bank","theme":"C","timeSec":120,"title":"The SOAR state machine","scenario":"<p>Your team is documenting the response state machine that every playbook must follow. Missing words below.</p>","question":"<p>Fill every blank from the word bank. Each word is used at most once.</p>","bank":["enrichment","HITL","executes","verification","rollback","audit","break-glass","sandbox","rotation"],"slots":["enrichment","HITL","executes","verification","rollback","audit"],"slotLabels":["1. Finding arrives → <b>___</b> check: allowlists, asset owner, duplicate merge.","2. P0/P1 → <b>___</b> approval with a 15-minute timer, then actions fire.","3. The runner <b>___</b> the action through a least-privilege role.","4. A <b>___</b> step proves the effect: port closed, session dead, host isolated.","5. On failure, the <b>___</b> path reverts the change and pages a human.","6. Every step writes to the <b>___</b> trail with actor, input, and approval ID."],"explain":"<p>The machine runs in order: <b>enrichment</b> filters noise before anything expensive happens; <b>HITL</b> approval gates high-impact actions with a timer so speed survives; the runner <b>executes</b> through a least-privilege role (so a playbook bug cannot do everything); a <b>verification</b> step proves the action actually worked — automations fail silently more often than people think; a <b>rollback</b> path reverts bad changes; and the <b>audit</b> trail records everything. <i>Distractors:</i> <b>break-glass</b> is for when automation itself is down, <b>sandbox</b> is for testing playbooks, <b>rotation</b> is a credential practice.</p>","hints":["Blanks 4 and 5 are the pair teams forget: proving the action worked, and undoing it if it did not.","One distractor is the emergency manual path, another is where playbooks are tested."],"tip":"State machine: enrich → approve → execute (least privilege) → verify → rollback on failure → audit everything."},{"id":"h04","type":"qcm","theme":"A","timeSec":80,"title":"Improve recall without drowning the analysts","scenario":"<p>After the EDR migration, model recall fell to 0.55 — half of real attacks are missed. Class balance is brutal: 1% of events are malicious. Analysts can clear ~150 alerts per day; the current queue is ~60 per day. Precision is 0.92.</p>","question":"<p>Which plan raises recall without breaking the team?</p>","options":["Lower the auto-close threshold modestly and add a second-stage model that re-scores the expanded queue, so humans see a filtered shortlist.","Lower the threshold aggressively and staff up to clear roughly 2,000 alerts per day.","Raise the threshold; precision will rise and the missed attacks stop mattering.","Keep the threshold and auto-close everything below 0.9 confidence to protect analyst time."],"correct":[0],"explain":"<p>With 1% prevalence, naively lowering the threshold explodes the queue faster than hiring can absorb — that is option (b)'s trap. Raising the threshold (c) improves precision but misses even more attacks, the exact problem you are fixing. Auto-closing below 0.9 (d) would bury the very low-confidence real attacks you are currently missing. The workable pattern is the two-stage funnel: relax the first stage to raise recall, then let a cheap second-stage model filter the expanded queue down to a shortlist humans can actually clear — recall goes up while analyst load stays bounded.</p>","hints":["The constraint is human capacity, so something between the threshold and the human must absorb the extra volume.","Two of the wrong options quietly worsen exactly the metric you are trying to improve."],"tip":"Class-imbalanced triage: raise recall at stage one, filter with a second stage, keep humans on a shortlist."},{"id":"h05","type":"linepick","theme":"D","timeSec":110,"title":"Audit the auto-responder Lambda policy","scenario":"<p>The SOAR auto-responder runs from a Lambda whose execution role is below. It isolates hosts via SSM and reads a secret for API tokens.</p>","question":"<p>Click every line that violates least privilege.</p>","lines":["{","  \"Role\": \"soar-auto-responder\",","  \"Statement\": [","    { \"Effect\": \"Allow\", \"Action\": \"iam:PassRole\", \"Resource\": \"*\" },","    { \"Effect\": \"Allow\", \"Action\": [\"ssm:SendCommand\"], \"Resource\": \"*\" },","    { \"Effect\": \"Allow\", \"Action\": [\"kms:Decrypt\"], \"Resource\": \"*\" },","    { \"Effect\": \"Allow\", \"Action\": [\"sts:AssumeRole\"], \"Resource\": \"arn:aws:iam::111122223333:role/soc-ir\" }","  ]","}"],"expected":[3,4,5],"explain":"<p>Line 4 allows <b>iam:PassRole on any resource</b> — passing any role to any service is a privilege-escalation primitive; scope it to the exact role ARN the responder needs, with condition keys. Line 5 allows <b>SSM RunCommand on every instance</b>: one playbook bug could run commands fleet-wide; scope to the instance tags or IDs the responder is allowed to touch. Line 6 allows <b>kms:Decrypt on every key</b>, which reads any protected secret; scope to the one key holding the responder's token. Line 7 is the model citizen: a single named role ARN.</p>","hints":["Three statements use Resource: \"*\" — that alone is your candidate list.","PassRole with a wildcard is not just broad — it is a known escalation path."],"tip":"Automation roles: every statement names its exact resources. Wildcards in PassRole, SendCommand, or Decrypt are audit findings."},{"id":"h06","type":"order","theme":"D","timeSec":100,"title":"Playbook change control, done properly","scenario":"<p>Detection engineering wants to change the isolation playbook's trigger. The old way was 'edit and deploy on Friday'. Put the disciplined lifecycle in order.</p>","question":"<p>Order the six lifecycle stages from first (top) to last (bottom).</p>","steps":["Draft the change in version control with a written reason and expected effect","Peer review by detection engineering: logic, blast radius, rollback plan","Test in the sandbox by replaying historical alerts against the new logic","Staged rollout in shadow mode: run for a week logging what it would do, acting on nothing","Enable real actions; monitor KPIs — false-positive rate, MTTR, override count","Quarterly review: retire, re-tune, or renew with analyst feedback labels"],"explain":"<p>The lifecycle is: draft with a reason, peer review (logic + blast radius + rollback), sandbox testing with <b>replayed historical alerts</b> (you test against reality, not imagination), then <b>shadow mode</b> — a week of logging what the playbook would have done without doing it, which catches trigger explosions before they isolate hosts. Only then do actions go live under KPI monitoring, and a quarterly review keeps the playbook from rotting. Shadow mode is the step most teams skip and most incidents punish.</p>","hints":["Two stages produce evidence without touching production; one of them runs for a week.","Monitoring and the periodic review both come after the first real action."],"tip":"Change control: draft → review → replay tests → shadow mode → live with KPIs → quarterly re-review."},{"id":"h07","type":"terminal","theme":"A","timeSec":170,"title":"Terminal: extract the brute-force sources","scenario":"<p>You have <b>auth.log</b> in the current directory. It mixes failed SSH password attempts (the attack) with successful logins and routine service lines (the noise).</p>","question":"<p>Print <b>only the source address</b> of every failed password attempt, one per line, <b>de-duplicated</b>, so you can compare attacker sources. Choose your own tools — none are named for you.</p>","artifacts":[{"label":"auth.log PREVIEW (first 4 lines)","html":"Mar 11 02:14:07 web01 sshd[2312]: Failed password for invalid user admin from 203[.]0[.]113.45 port 44812 ssh2\nMar 11 02:14:11 web01 sshd[2312]: Failed password for invalid user admin from 203[.]0[.]113.45 port 44820 ssh2\nMar 11 02:14:19 web01 sshd[2319]: Accepted password for deploy from 10[.]0[.]40.12 port 51022 ssh2\nMar 11 02:15:02 web01 sshd[2331]: Failed password for root from 198[.]51[.]100.203 port 33012 ssh2"}],"goal":"From auth.log, print only the source address of each failed password attempt, one per line, de-duplicated.","prompt":"$ ","accepts":["failed(\\s|_)?password","auth\\.log","(awk|grep|cut|sed|perl|python)","(uniq|sort\\s+-u)"],"sampleOut":"198[.]51[.]100.203\n203[.]0[.]113.45\n203[.]0[.]113.77","acceptNote":"Example: grep \"Failed password\" auth.log | awk '{print $(NF-3)}' | sort -u","explain":"<p>You needed four things: select the failed lines (<code>grep \"Failed password\"</code> or an awk pattern), extract only the address (<code>awk '{print $(NF-3)}'</code> — the IP sits three fields from the end — or <code>grep -oE 'from [0-9.]+ | '</code>), and de-duplicate (<code>sort -u</code> or <code>sort | uniq</code>). The output shows three distinct sources hammering the box; each now goes to reputation enrichment and blocking. Choosing the tool yourself is the point: the same pipeline exists in awk alone, in perl, or in a python one-liner.</p>","hints":["The pipeline shape is: select lines → extract the address field → deduplicate.","In 'Failed password … from ADDRESS port N ssh2', the address is the third field from the end."],"tip":"Extraction pipelines: select → cut/awk the field → sort -u. Count occurrences with sort | uniq -c when you need volume per source."},{"id":"h08","type":"multi","theme":"A","timeSec":110,"title":"LLMs in the triage loop — which statements hold?","scenario":"<p>The team proposes letting an LLM agent summarise alerts and auto-close obvious noise. Before the pilot, the staff meeting argues about what is actually true.</p>","question":"<p>Select <b>all</b> statements that are correct.</p>","options":["The model can invent alert details that were never in the logs, so a human validates summaries before they reach a case.","Text inside a log line or an email can try to control the model, so log content is treated as untrusted input.","The same prompt with the same alert always produces byte-identical output, so no validation is needed.","Auto-closing alerts is safe as long as the LLM says the alert is benign with high confidence.","The agent's permissions stay scoped — it must not hold admin rights to every system it can read about.","PII from tickets can be freely pasted into any external AI service because the vendor promises not to train on it."],"correct":[0,1,4],"explain":"<p>Three statements hold. <b>Hallucination</b>: LLMs generate plausible text, not verified text, so a human validates summaries that become case records. <b>Prompt injection</b>: attacker-controlled text inside logs or mail is input to the model — a phish can carry 'ignore previous instructions' just as it carries a link. <b>Scoped permissions</b>: the agent's blast radius must match its trust level; a reader-agent should not hold admin anywhere. The wrong ones: outputs are non-deterministic (a), model confidence is not ground truth and never justifies unreviewed auto-close (d), and PII handling is a legal duty — vendor promises do not replace your DLP and data-governance controls (f).</p>","hints":["Two wrong statements assume the model is more reliable than it can be.","One wrong statement outsources a responsibility that stays yours."],"tip":"LLM-in-the-loop rules: human validation, untrusted input handling, scoped permissions, and data-governance over vendor promises."},{"id":"h09","type":"match","theme":"B","timeSec":130,"title":"Match the linked alerts to the correlation technique","scenario":"<p>The correlation engine built five cases overnight. A junior analyst asks you to justify each merge with the technique that made it — 'the engine felt like it' is not a justification. One technique in the list is a decoy.</p>","question":"<p>Click an alert pair on the left, then the technique that justifies linking it. Not every technique is used.</p>","pairs":[{"l":"New inbox rule + first-time-ASN console sign-in, same identity, 12 minutes apart","r":"Entity linking on the user principal"},{"l":"Two hosts beaconing to one C2 domain within a 10-minute window","r":"Shared-infrastructure correlation"},{"l":"svc_jenkins beacon outward, then root login on the same host 4 minutes later","r":"Host-scoped sequence logic (AND inside a window)"},{"l":"Impossible travel + MFA push approved from the same new device, 3 minutes apart","r":"Entity linking on the device fingerprint"},{"l":"14 identical GuardDuty findings for one host in one hour","r":"Deduplication and aggregation before scoring"}],"extras":["Time-of-day anomaly baselining","Threat-intel matching over TAXII"],"explain":"<p>Each link is justified by one technique: the inbox rule and the sign-in share the <b>user principal</b> (entity linking on identity); two hosts on one C2 domain share <b>infrastructure</b>; the beacon-then-root-login pair is a <b>host-scoped sequence</b> — technique B on host H inside a short window; impossible travel plus the approved push share the <b>device fingerprint</b> — the attacker is holding the device, so the push was theirs, not the user's; and 14 identical findings collapse through <b>deduplication and aggregation</b> before any scoring happens. <i>Decoys:</i> time-of-day baselining is UEBA profiling, not a pairwise link, and TAXII matching feeds indicators into detection — it merges nothing.</p>","hints":["Two pairs are justified by WHO or WHAT did it: a user principal and a device fingerprint.","One pair is not really a merge at all — it is cleanup that happens before scoring."],"tip":"Name the technique behind every merge: entity, infrastructure, sequence-in-window, or dedup. If you cannot name it, do not merge."},{"id":"h10","type":"bank","theme":"A","timeSec":120,"title":"Threshold tuning by the numbers","scenario":"<p>Rule R alerts at confidence ≥ 60. Last 30 days: 1,000 alerts, of which 850 were false alarms and 150 real. 40 further real attacks scored below 60 and never alerted.</p>","question":"<p>Fill every blank from the word bank. Each term is used at most once.</p>","bank":["15","85","lower","false negatives","confusion","feedback","raise","precision","drift"],"slots":["15","85","lower","false negatives","confusion","feedback"],"slotLabels":["1. Precision today is <b>___</b> percent (150 out of 1,000).","2. About <b>___</b> percent of the alerts were false alarms.","3. Raising the alert threshold to 75 will cut false positives but will <b>___</b> recall.","4. The 40 missed attacks are <b>___</b> — the model never alerted on them.","5. Fix the threshold using the <b>___</b> matrix, not gut feeling.","6. Retrain every two weeks using analyst <b>___</b> labels."],"explain":"<p>Precision is 150 ÷ 1,000 = <b>15%</b> — analysts wade through six false alarms per truth. The false-alarm share is <b>85%</b>. Raising the threshold cuts noise but also <b>lowers</b> recall: some of the 150 real hits scored 60–75 and would vanish. The 40 unalerted attacks are <b>false negatives</b> — tuning thresholds cannot recover them; better features and retraining can. Decisions come from the <b>confusion</b> matrix (TP/FP/TN/FN per threshold), and the labels that make retraining possible are analyst <b>feedback</b>. <i>Distractors:</i> 'raise' answers the wrong blank; <b>precision</b> is already used; <b>drift</b> is a cause of change, not a tuning artefact.</p>","hints":["Two blanks are pure arithmetic from the 1,000 / 850 / 150 numbers.","Only one word describes attacks the model never saw."],"tip":"Tune from the confusion matrix: precision, recall, FN. Every threshold move trades one against the other."},{"id":"h11","type":"qcm","theme":"C","timeSec":80,"title":"Revoked — but the calls keep coming","scenario":"<p>03:20: IR disables the compromised IAM user and revokes its long-lived keys. The attacker's API calls from that role continue until 04:05, then stop.</p>","question":"<p>What explains the 45 minutes of continued access?</p>","options":["STS session tokens issued before the revocation stay valid until they expire; you must also revoke the live sessions.","IAM permission changes take up to 24 hours to propagate across all regions.","The attacker kept a second console password, and disabling a user never blocks console sign-in.","CloudTrail delivery lag makes it look like the calls continued; they actually stopped at 03:20."],"correct":[0],"explain":"<p>Disabling a user and rotating keys does not kill <b>STS session tokens</b> that were already issued — they carry their own expiry and keep working until then. That is the 45 minutes: the attacker held a valid temporary session the whole time. The complete containment is: disable the principal, rotate keys, <b>and</b> revoke active sessions so every token dies immediately. Propagation myths (b), a second password (c), and delivery lag (d) are all wrong — and lag (d) is the dangerous belief, because it makes teams wait instead of acting.</p>","hints":["The role's permissions were not the problem — a token derived from them was still alive.","One containment step was missing. Which one acts on credentials that already exist?"],"tip":"Disable + rotate keys + revoke sessions. Temporary credentials ignore the first two until they expire."},{"id":"h12","type":"logviewer","theme":"B","timeSec":140,"title":"The night logging went dark","scenario":"<p>Next morning, the SIEM shows a gap in CloudTrail delivery between 02:47 and 03:04. You pull the events recorded before the gap.</p>","question":"<p>What happened, and what is the correct first response?</p>","logs":["{\"ts\":\"02:31:10\",\"event\":\"PutBucketPolicy\",\"user\":\"deploy-ci\",\"src\":\"10[.]0[.]40.12\",\"obj\":\"audit-archive\"}","{\"ts\":\"02:33:42\",\"event\":\"CreateLogStream\",\"user\":\"deploy-ci\",\"src\":\"10[.]0[.]40.12\"}","{\"ts\":\"02:41:07\",\"event\":\"DescribeInstances\",\"user\":\"deploy-ci\",\"src\":\"10[.]0[.]40.12\"}","{\"ts\":\"02:47:19\",\"event\":\"StopLogging\",\"user\":\"deploy-ci\",\"src\":\"198[.]51[.]100.244\",\"note\":\"first external source ever seen for this user\"}","{\"ts\":\"02:47:44\",\"event\":\"GetBucketPolicy\",\"user\":\"deploy-ci\",\"src\":\"198[.]51[.]100.244\",\"obj\":\"audit-archive\"}","{\"ts\":\"02:52:03\",\"event\":\"ListAccessKeys\",\"user\":\"deploy-ci\",\"src\":\"198[.]51[.]100.244\"}","{\"ts\":\"02:58:37\",\"event\":\"PutRolePolicy\",\"user\":\"deploy-ci\",\"src\":\"198[.]51[.]100.244\",\"role\":\"fin-reader\"}","{\"ts\":\"03:04:12\",\"event\":\"CreateLogStream\",\"user\":\"deploy-ci\",\"src\":\"10[.]0[.]40.12\",\"note\":\"regular CI job resumes\"}"],"sub":{"type":"qcm","options":["deploy-ci called StopLogging at 02:47 from a first-time external IP, then probed the audit bucket and added a policy to fin-reader. Re-enable logging, contain deploy-ci, and treat 02:47–03:04 as unrecorded.","Logging stopped because the audit bucket filled up; the CI jobs simply failed until space was freed.","The 02:47 entry is routine CI maintenance from an internal runner.","Nothing happened — CloudTrail is always on and cannot be turned off per trail."],"correct":[0]},"explain":"<p>Filter for deploy-ci and the story separates cleanly: the 02:31–02:41 lines come from the internal CI address (10[.]0[.]40.12), then <b>StopLogging fires at 02:47 from 198[.]51[.]100.244 — an address this user has never used</b>. What follows is exactly what an attacker wants: policy inspection on the audit bucket, key enumeration, and a new policy on fin-reader. The gap is the goal, not a side effect — it hides everything done in that window. First response: re-enable logging immediately, contain deploy-ci (disable, rotate, revoke sessions), and investigate the unrecorded window with the auxiliary sources you have (VPC flow logs, GuardDuty, the bucket's own access logs).</p>","hints":["Filter on the user, then look at where each event's src comes from.","One event type here should never appear from an external address."],"tip":"StopLogging from an unusual source is a P1 by itself: blind spots are the attacker's objective."},{"id":"h13","type":"branch","theme":"C","timeSec":140,"title":"Ransomware orchestration under pressure","scenario":"<p>03:40. Three file servers are encrypting shares. The SOAR proposal on the table: isolate all three hosts, block SMB org-wide, disable 40 accounts that touched the shares. Leadership is in the room asking for 'everything, now'.</p>","question":"<p>Work the scenario. Each choice shows its consequence.</p>","branch":[{"q":"The org-wide SMB block will also stop backups and print servers. What do you approve?","opts":[{"t":"Isolate the three hosts now; hold the org-wide SMB block for HITL review with a per-subnet scoped alternative.","after":"The three hosts are contained in 90 seconds; the subnet-scoped block is reviewed and applied to the affected VLANs only."},{"t":"Approve everything at once; an outage is acceptable during ransomware.","after":"Backups go dark mid-incident — you lose the ability to verify clean restore points while the attack runs."},{"t":"Approve nothing until the root cause is fully understood.","after":"Encryption spreads to a fourth server while the analysis runs. Containment is not root cause."}],"c":0},{"q":"The backup server was reachable from an infected host. Before restoring anything:","opts":[{"t":"Verify an immutable, offline backup copy and restore with the backup server segmented from the production network.","after":"The immutable copy checks out clean; the restore runs in a segmented lane with the production net firewalled from it."},{"t":"Restore immediately from the newest snapshot; speed wins.","after":"The newest snapshot is post-encryption-staging — you would restore the attacker's tombstones. Recovery restarts from day zero."},{"t":"Consider negotiating; restore is too risky to attempt.","after":"Negotiation is a business decision made later with full facts — it never replaces verifying a clean restore path."}],"c":0},{"q":"The 40 disabled-account candidates are mostly ordinary users. Best move?","opts":[{"t":"Force step-up resets only where sessions look suspicious, stage the rest for review, and keep a rollback ready.","after":"Six suspicious sessions get resets; the other 34 users keep working, and the rollback list stays one click deep."},{"t":"Disable all 40 permanently and sort it out next week.","after":"34 innocent users lose access during the busiest week of the quarter; the helpdesk becomes the incident."},{"t":"Leave the accounts alone; the hosts are the real problem.","after":"One of those sessions re-enters through a VPN profile two days later. Hosts were half the story."}],"c":0}],"explain":"<p>Under pressure, the discipline that saves you is scoping. Contain what is burning (three hosts), and route the wide, disruptive action (org-wide SMB) through HITL review with a scoped alternative — bulk blocks that kill backups mid-incident destroy your recovery options. Restoration only starts after an <b>immutable</b> copy is verified and the restore lane is segmented, because the newest snapshot may be attacker-tainted. Identity actions get the same treatment: step-up on evidence, staged review for the rest, rollback always ready. Fast and blunt lose to fast and scoped.</p>","hints":["Step 1 separates what is certain (three hosts) from what is wide (org-wide SMB).","Step 2: which copy can the attacker not have touched?"],"tip":"Ransomware orchestration: scoped containment, immutable-verified restore, evidence-based identity actions, rollback everywhere."},{"id":"h14","type":"fillblank","theme":"A","timeSec":120,"title":"Defang the intel report","scenario":"<p>Your CTI report is ready to share with the ISAC. House style: defang every URL and IP, and share indicators through the TIP using STIX objects over TAXII. The raw artefacts from the ticket: an HTTPS link on host payroll-portal dot example dot top, callback IP 203 dot 0 dot 113 dot 9, C2 domain c2 dot malware-example dot net, second-stage host 198 dot 51 dot 100 dot 203 on port 8443.</p>","question":"<p>Type the correctly <b>defanged</b> form or the correct term into each blank. The [.] wrappers are required exactly as written; matching is case-insensitive.</p>","slotLabels":["1. Phishing link scheme (the link used HTTPS): <b>___</b>://…","2. Callback IP 203 dot 0 dot 113 dot 9, defanged: <b>___</b>.","3. C2 domain c2 dot malware-example dot net, defanged: <b>___</b>.","4. The indicators are exchanged as <b>___</b> objects (the format), transported over TAXII (the protocol).","5. House rule: never write a live link — a plain-http scheme becomes <b>___</b>.","6. Second-stage host 198 dot 51 dot 100 dot 203, defanged: <b>___</b>."],"blanks":[{"answer":"hxxps","accepts":["hxxps"]},{"answer":"203[.]0[.]113.9","accepts":["203\\[\\.\\]0\\[\\.\\]113\\.9"]},{"answer":"c2[.]malware-example[.]net","accepts":["c2\\[\\.\\]malware-example\\[\\.\\]net"]},{"answer":"STIX","accepts":["stix"]},{"answer":"hxxp","accepts":["hxxp"]},{"answer":"198[.]51[.]100.203","accepts":["198\\[\\.\\]51\\[\\.\\]100\\.203"]}],"explain":"<p>Defanging is mechanical: <b>hxxps://</b> replaces the https scheme (plain http becomes <b>hxxp</b>), and every dot in a domain or IP becomes <b>[.]</b> — so nothing renders clickable or resolves by accident: 203[.]0[.]113.9, c2[.]malware-example[.]net, 198[.]51[.]100.203. The sharing pair is <b>STIX</b> (the object format) over <b>TAXII</b> (the transport). The two scheme blanks look almost the same — anchoring matters, which is why exact-match grading is used here. Why bother: one click on a live link in a ticket can compromise the reader; defanging is a safety habit, not decoration.</p>","hints":["Every IP keeps its octets but wraps each dot: 203[.]0[.]113.9.","Blanks 1 and 5 differ by one letter — the s is only for HTTPS links."],"tip":"Defang = scheme → hxxp(s) + dots → [.] . Share as STIX over TAXII. Never paste live indicators."},{"id":"h15","type":"order","theme":"C","timeSec":100,"title":"Containment when the blast radius is unknown","scenario":"<p>An access key for a highly-privileged automation role was published in a public repository two hours ago. You do not know whether anyone copied it. 2,000 employees, one production account.</p>","question":"<p>Order the six actions from first (top) to last (bottom).</p>","steps":["Revoke the exposed key and all active sessions for the role (cut access before anything else)","Rotate every secret the role could read — assume it was copied and used","Sweep CloudTrail for the key's usage to scope what actually happened","Isolate only the hosts showing anomalous use of the role","Open the change ticket and notify the role's owners for the policy fix","Post-incident: add secret scanning to CI so the next leak is caught in seconds"],"explain":"<p>When access material is public, you <b>revoke first and investigate second</b> — an investigation that waits for evidence leaves a working key in the wild, and the key cannot be un-leaked. With access cut, you rotate everything the role could read (assume compromise), then use CloudTrail to scope the real usage and isolate only the hosts showing anomalous activity. The policy fix and owner notification follow, and the durable lesson — secret scanning in CI — closes the loop. Every step after revocation is safer because revocation happened first.</p>","hints":["One action cannot wait for evidence, because the asset is already public.","Forensics comes after the bleeding stops — but before the paperwork."],"tip":"Public credential = revoke immediately, rotate dependent secrets, then scope with logs, then fix and prevent."},{"id":"h16","type":"linepick","theme":"B","timeSec":110,"title":"Find the correlation rule's three mistakes","scenario":"<p>This rule merges authentication and admin events into one case. It has produced 40 nonsense cases this week. Three lines are wrong.</p>","question":"<p>Click the three lines that make the rule misbehave.</p>","lines":["{","  \"name\": \"impossible-travel-plus-admin\",","  \"when\": \"any of\",","  \"events\": [","    {\"type\": \"ConsoleLogin\", \"flag\": \"impossible_travel\"},","    {\"type\": \"PutUserPolicy\", \"flag\": \"new_admin_policy\"},","    {\"type\": \"CreateAccessKey\", \"flag\": \"self_issued\"}","  ],","  \"window\": \"72 hours\",","  \"group_by\": \"sourceIPAddress\"","}"],"expected":[2,8,9],"explain":"<p>Line 3: <b>\"when\": \"any of\"</b> raises a case for a single event — impossible travel alone (a common false positive) becomes a full case; the chain needs all three stages. Line 9: a <b>72-hour window</b> merges unrelated events into one story; this chain lives in minutes, not days. Line 10: grouping by <b>sourceIPAddress</b> links everyone behind the same NAT or CI runner — the entity is the <i>identity</i> (user), not the address. The event choices themselves (lines 5–7) are reasonable chain stages. Wrong entity + wrong logic + wrong window = the week of noise.</p>","hints":["One line decides how many events are needed, one decides how far apart they may be, one decides what 'same' means.","Behind one NAT address sit hundreds of identities."],"tip":"Correlation rules need: all-stages logic, a window that matches the chain's real tempo, and an entity that is the actor, not the address."},{"id":"h17","type":"logviewer","theme":"A","timeSec":140,"title":"The peer-group trap","scenario":"<p>The UEBA model flagged the CFO for the highest deviation score of the month, and an intern escalated it as a P1. The model output is below.</p>","question":"<p>What is the correct disposition, and what does the data actually say?</p>","logs":["team=finance-analytics  user=median-peer   upload_24h=61MB   window=22:00-01:00  dst=internal-reports[.]example","team=finance-analytics  user=p1            upload_24h=44MB   window=22:30-00:30  dst=internal-reports[.]example","team=finance-analytics  user=p2            upload_24h=77MB   window=21:40-00:10  dst=internal-reports[.]example","team=finance-analytics  user=p3            upload_24h=52MB   window=23:00-00:40  dst=internal-reports[.]example","team=finance-analytics  user=p4            upload_24h=39MB   window=22:10-23:50  dst=internal-reports[.]example","team=finance-analytics  user=p5            upload_24h=68MB   window=21:30-00:20  dst=internal-reports[.]example","team=finance-analytics  user=cfo           upload_24h=3900MB window=23:40        dst=mergers-data-room[.]example  ticket=LEGAL-118 approved_by=General-Counsel","model_note: deviation_score=9.2/10 (highest this month) — auto-flagged P1 by junior analyst","context: LEGAL-118 opened 5 days ago — M&A due-diligence data-room sync, vendor approved by Legal"],"sub":{"type":"qcm","options":["Benign positive: the deviation is real and enormous, but the destination, volume, and ticket LEGAL-118 match an approved M&A process — document it and allowlist with an owner and expiry.","False positive: the UEBA model made an error, and nothing described actually happened.","True positive P1: 3.9 GB is exfiltration regardless of what any ticket says.","Keep paging every night: UEBA alone can never support a decision, so no disposition is possible."],"correct":[0]},"explain":"<p>The deviation score is honest — 3.9 GB against a 40–80 MB peer norm is a 50× outlier, and the model was right to scream. But screaming is not verdicts: the destination is a named, defanged M&A data room, the volume matches a due-diligence sync, and LEGAL-118 shows General-Counsel approval from five days ago. That is the definition of a <b>benign positive</b>: real activity, correctly detected, legitimately approved. Calling it a false positive would be a lie about the data; ignoring context and treating volume alone as exfiltration is how SOCs burn executive goodwill. The durable fix: allowlist the CFO's data-room sync with an owner and an expiry tied to LEGAL-118's end date.</p>","hints":["Separate two questions: did the deviation really happen, and is it approved?","One line of context resolves the whole case — find the ticket."],"tip":"UEBA flags deviations; tickets and destinations give verdicts. Big + approved = benign positive, documented and allowlisted."},{"id":"h18","type":"classify","theme":"A","timeSec":130,"title":"Threshold review across six rules","scenario":"<p>Monthly detection review. For each rule, decide the threshold action from its numbers and its context. Analyst capacity is strained: noise is the enemy, but so are the 40 attacks that slipped through last month.</p>","question":"<p>Place each rule into the correct decision bucket.</p>","buckets":[{"id":"raise","label":"Raise the threshold"},{"id":"lower","label":"Lower the threshold"},{"id":"keep","label":"Keep and monitor (tune sources, not threshold)"}],"items":[{"t":"Rule A: 2,000 alerts/month, 5% precision, only 3 attacks missed below threshold","b":"raise"},{"t":"Rule B: 12 alerts/month, 100% precision, 25 attacks missed below threshold","b":"lower"},{"t":"Rule C: 40 alerts/month, 90% precision, 0 missed, team capacity fine","b":"keep"},{"t":"Rule D: 300/month, 60% precision, 1 missed — the noise is all one IT agent","b":"keep"},{"t":"Rule E: 8/month, 75% precision, 0 missed, but all 8 alerts trace to one noisy scanner","b":"keep"},{"t":"Rule F: 500/month, 25% precision, 10 missed — retraining lands next sprint","b":"raise"}],"explain":"<p>Rule A drowns the team for almost no gain (5% precision, 3 extra catches) — raise. Rule B is the mirror image: nearly free, missing 25 attacks — lower. Rule C is healthy — keep. Rules D and E have healthy thresholds with a single noisy source: the fix is <b>suppression of the source</b> (with owner and expiry), not a threshold move that would cost coverage everywhere else. Rule F is terrible today, but the cause is the stale model — raise to survive until retraining lands, then re-evaluate from the confusion matrix. The discipline: threshold moves are one lever; source tuning, suppression, and retraining are the others.</p>","hints":["Two rules should change their threshold in opposite directions for opposite reasons.","Two rules have a specific noisy source — that is a suppression problem, not a threshold problem."],"tip":"Read precision AND misses together. Source noise → suppression; global noise → threshold; stale model → retrain."},{"id":"h19","type":"terminal","theme":"A","timeSec":170,"title":"Terminal: decode the staged payload","scenario":"<p>An isolated Lambda's environment captured <b>STAGE_B64=\"U1RBR0UyLVBBWUxPQUQtUkVUUklFVkVE\"</b>. The same blob is saved as <b>stage.b64</b> in the current directory. Analysts decode in a sandbox before touching anything else.</p>","question":"<p>Recover the plaintext from the blob and save it into <b>decoded.txt</b> in the current directory. Choose your own tools — none are named for you.</p>","goal":"Decode the base64 blob (env STAGE_B64 or file stage.b64) and write the plaintext to decoded.txt.","prompt":"$ ","accepts":["base64","(-d\\b|--decode)","decoded\\.txt"],"sampleOut":"$ cat decoded.txt\nSTAGE2-PAYLOAD-RETRIEVED","acceptNote":"Example: echo \"$STAGE_B64\" | base64 -d > decoded.txt  ·  or: base64 -d stage.b64 > decoded.txt","explain":"<p>The tool is <code>base64</code> with <code>-d</code> (or <code>--decode</code>), and the redirect writes the plaintext to decoded.txt — either <code>echo \"$STAGE_B64\" | base64 -d > decoded.txt</code> or <code>base64 -d stage.b64 > decoded.txt</code>. The recovered marker STAGE2-PAYLOAD-RETRIEVED tells you the implant self-checks its staging step; search other Lambdas for the same variable and hunt the marker across the estate. Discipline note: decode untrusted blobs in a sandbox — a 'text file' has been a loader before, and never let generated decode commands run without review.</p>","hints":["The blob is base64; the tool that reverses it has a decode flag.","The redirect symbol decides where the plaintext lands."],"tip":"base64 -d writes binary-safe plaintext; decode in a sandbox and hunt the recovered marker everywhere."},{"id":"h20","type":"bank","theme":"B","timeSec":120,"title":"Fix the junior analyst's write-up","scenario":"<p>A junior analyst's incident write-up is factually complete but uses the wrong vocabulary in six places. Correct the terms so the case reads professionally.</p>","question":"<p>Fill every blank from the word bank. Each term is used at most once.</p>","bank":["baseline","identity","time window","Valid Accounts","revoked","MTTR","FPR","quarantine","drift"],"slots":["baseline","identity","time window","Valid Accounts","revoked","MTTR"],"slotLabels":["1. A1: sign-in from a new country. We did not auto-close on confidence alone; we compared it with the user's 30-day <b>___</b> and their peer group.","2. A2: the same user created a new access key 6 minutes later. Both alerts share one <b>___</b> and sit inside a short <b>___</b>, so we merged them into a single case.","3. (same sentence as above — the second blank)","4. We tagged the chain ATT&CK T1078 — <b>___</b> — and <b>___</b> the user's active sessions through STS.","5. (same sentence as above — the second blank)","6. MTTD came to 9 minutes (open to engagement) and <b>___</b> to 42 minutes (engagement to containment)."],"explain":"<p>The corrected write-up: compare a first-time-country sign-in against the user's 30-day <b>baseline</b> and peer group before deciding. Two alerts merge when they share an <b>identity</b> and a <b>time window</b> — that is entity linking in one sentence. T1078 is <b>Valid Accounts</b>, the technique of using legitimate credentials, and the containment was that the sessions were <b>revoked</b> via STS (disable + rotate + revoke). The response number — engagement to containment — is <b>MTTR</b>; MTTD covers detection. <i>Distractors:</i> <b>FPR</b> is a rate for tuning, not a case fact; <b>quarantine</b> is a host action, not a session one; <b>drift</b> explains model decay, not this incident.</p>","hints":["Blank 2 has the two correlation words: who, and how close together.","The T-number is the technique name; the containment word is what STS does."],"tip":"Write cases in shared vocabulary: baseline, entity, window, technique names, exact containment verbs, defined metrics."},{"id":"h21","type":"branch","theme":"D","timeSec":140,"title":"The AI agent that auto-closed a breach","scenario":"<p>Three weeks ago the team gave an AI triage agent auto-close powers for low-risk detection classes. Yesterday a real P1 was found inside the auto-closed pile, 19 days old. The agent is now suspect.</p>","question":"<p>Work the response and governance scenario. Each choice shows its consequence.</p>","branch":[{"q":"First move after discovering the missed P1?","opts":[{"t":"Suspend auto-close for the affected detection classes, then review the closed pile in priority order.","after":"Auto-close stops for those classes within minutes; the pile review starts with the highest-confidence closures."},{"t":"Turn off every AI feature immediately, including summaries and enrichment.","after":"You lose the tooling that is working while investigating the part that failed — and the pile keeps growing unanswered."},{"t":"Accept it; one miss in three weeks is a good rate.","after":"The missed case was a live intrusion aging for 19 days. 'Good rate' needs to survive that sentence in the post-mortem."}],"c":0},{"q":"Root cause: the agent's confidence came from a summary it wrote itself, not from the evidence. Fix?","opts":[{"t":"Require evidence-linked scoring: every auto-close cites the exact fields that justified it, and scoring fails closed without them.","after":"Auto-closes now carry field citations; the hallucinated-confidence path is structurally impossible, not just discouraged."},{"t":"Raise the auto-close threshold from 60 to 90 and move on.","after":"Higher numbers from a broken scoring path are still broken — the same miss just needs a slightly better hallucination."},{"t":"Have the agent double-check its own summary; self-review is enough.","after":"The model grading its own homework reproduces the same blind spot with extra steps."}],"c":0},{"q":"What governance prevents the next one?","opts":[{"t":"A documented policy: what may auto-close, quarterly audits of closures, analyst overrides feeding retraining, and a named owner for the model.","after":"The policy names the owner, the audit cadence, and the feedback path — the miss becomes a tuning input instead of a surprise."},{"t":"Let the agent manage its own configuration to save engineering time.","after":"Self-managed automation with a failed control is how the same incident returns with better lighting."},{"t":"Only the vendor can audit the model; internal reviews would be uninformed.","after":"Your analysts hold the labels and the context — the audit you own is the audit that happens."}],"c":0}],"explain":"<p>The response order is: scope the blast radius first (suspend the failing behaviour per class), then review the damage in priority order. The root cause is structural — confidence computed from self-generated text — so the fix is also structural: <b>evidence-linked scoring</b> that fails closed, not a higher threshold on the same broken path. Governance closes the loop: a written auto-close policy, quarterly closure audits, override data feeding retraining (the feedback loop), and a named accountable owner. AI triage is a system to govern, not a vendor box to trust.</p>","hints":["Step 1 is damage control for the failure mode, not for AI in general.","Step 2: what makes a hallucinated score impossible rather than unlikely?"],"tip":"AI governance: scoped auto-close policies, evidence-linked fail-closed scoring, audits, feedback loops, named owners."},{"id":"h22","type":"bank","theme":"D","timeSec":120,"title":"Compute the metrics honestly","scenario":"<p>Five incidents from last week are on the table, plus the week's alert totals. Fill the metrics with the right definitions attached.</p>","question":"<p>Fill every blank from the word bank. Each term is used at most once.</p>","artifacts":[{"label":"INCIDENT TABLE","html":"inc-1  opened 08:02  engaged 08:10  contained 08:40\ninc-2  opened 09:40  engaged 09:52  contained 10:37\ninc-3  opened 11:15  engaged 11:22  contained 11:47\ninc-4  opened 13:03  engaged 13:12  contained 13:52\ninc-5  opened 14:30  engaged 14:44  contained 15:44\n\nWeekly alerts: 180 total · 162 false alarms"}],"bank":["10","40","60","90","MTTR","definition","MTTD","70","95"],"slots":["10","40","60","90","MTTR","definition"],"slotLabels":["1. Average MTTD (open → engagement) across the five incidents is <b>___</b> minutes.","2. Average MTTR (engagement → containment) is <b>___</b> minutes.","3. The slowest incident took <b>___</b> minutes to contain.","4. The weekly false-positive rate is <b>___</b> percent.","5. Removing three manual steps cut <b>___</b> by roughly 15 minutes per case.","6. Publish both numbers with their exact <b>___</b> (open→engage vs engage→contain) so the trend line is honest."],"explain":"<p>Open→engagement: 8, 12, 7, 9, 14 — average <b>10</b>, that is MTTD. Engagement→containment: 30, 45, 25, 40, 60 — average <b>40</b>, that is MTTR; inc-5's <b>60</b> is the outlier worth a look, not an average-smoothing excuse. False-positive rate: 162 ÷ 180 = <b>90%</b>. Automation savings land in <b>MTTR</b> because the removed steps sat between engagement and containment. And every published metric carries its <b>definition</b> — half of all metric arguments are two people measuring different intervals. <i>Distractors:</i> <b>MTTD</b> answers blank 1, not 5; 70 and 95 fit no computation.</p>","hints":["Blank 1 and blank 2 use the two different intervals — compute each from five numbers.","Only one distractor number is the rate the 162/180 fraction produces."],"tip":"Metrics: MTTD = open→engage, MTTR = engage→contain, FPR = FP/all. Definitions travel with the numbers."},{"id":"h23","type":"logviewer","theme":"B","timeSec":140,"title":"The jittered beacon among the metronomes","scenario":"<p>Overnight flow logs, two hosts, several destinations. One pattern here is a C2 beacon with jitter; the others are legitimately periodic. Rough intervals are noted from timestamp gaps.</p>","question":"<p>Which reading of the traffic is correct?</p>","logs":["01:02:47 fin-ws-07 → 198[.]51[.]100.77:443 bytes=908   (+42s)","01:03:29 fin-ws-07 → 198[.]51[.]100.77:443 bytes=844   (+88s)","01:04:57 fin-ws-07 → 198[.]51[.]100.77:443 bytes=1121  (+67s)","01:06:04 fin-ws-07 → 198[.]51[.]100.77:443 bytes=871   (+95s)","01:07:02 mon-02    → 10[.]0[.]30.5:9100 bytes=96      (health check)","01:07:39 fin-ws-07 → 198[.]51[.]100.77:443 bytes=902   (+72s)","01:08:51 fin-ws-07 → 198[.]51[.]100.77:443 bytes=858   (+73s)","01:10:06 fin-ws-07 → 198[.]51[.]100.77:443 bytes=1180  (+68s)","01:11:19 fin-ws-07 → 198[.]51[.]100.77:443 bytes=864   (+73s)","01:12:00 fin-ws-07 → 129[.]6[.]15.28:123 bytes=90      (NTP sync)","01:13:02 fin-ws-07 → 198[.]51[.]100.77:443 bytes=901   (+103s)","01:14:10 fin-ws-07 → 198[.]51[.]100.77:443 bytes=1109  (+68s)"],"sub":{"type":"qcm","options":["fin-ws-07 → 198[.]51[.]100.77:443 shows irregular intervals (42–103 s) with small near-constant payloads — jittered C2; isolate the host and block the IP.","mon-02 → 10[.]0[.]30.5 at a fixed cadence is the beacon — perfectly regular timing is the strongest signature.","There is no beacon — the intervals are too irregular; real beacons are perfectly timed.","The NTP traffic is the beacon because it repeats all night."],"correct":[0]},"explain":"<p>Modern C2 adds <b>jitter</b> on purpose: intervals scattered around a mean (here 42–103 s around ~70 s) defeat naive fixed-interval detectors, while the payload stays small and near-constant (844–1180 bytes) — check-in traffic, not bulk transfer. The perfectly regular mon-02 health check is legitimate monitoring (internal, tiny, scheduled), and the NTP sync is one line, not a pattern. The trap is option (c): demanding perfect timing means detecting only the politest malware. Behavioral analytics that score interval variance plus payload consistency plus external destination catch exactly this shape.</p>","hints":["Look at the spread of intervals, not just their average.","Compare payload sizes across the repeating flow — steady small beats noisy big for check-ins."],"tip":"Jitter defeats fixed-interval matching. Score variance + constant small payload + external dst."},{"id":"h24","type":"qcm","theme":"D","timeSec":80,"title":"Least privilege for the automation role","scenario":"<p>The SOAR platform needs to: read GuardDuty findings, invoke exactly one isolation Lambda, and read two specific secrets. Which policy design is correct?</p>","question":"<p>Which policy design is correct?</p>","options":["Three scoped statements: guardduty:GetFindings (service has no resource-level permissions), lambda:InvokeFunction on the specific function ARN, secretsmanager:GetSecretValue on the two secret ARNs.","One statement: Action \"*\" on Resource \"*\" — the automation team rotates the credentials often.","AdministratorAccess attached, but the Lambda code reviews its own actions before executing them.","Action \"s3:*\" on the whole account, because the findings are stored in S3 somewhere."],"correct":[0],"explain":"<p>Least privilege in practice: name the exact actions (<b>guardduty:GetFindings</b>, <b>lambda:InvokeFunction</b>, <b>secretsmanager:GetSecretValue</b>) and scope every resource that supports it — the function ARN and the two secret ARNs. GuardDuty genuinely has no resource-level permissions, so its resource is legitimately the service scope — that is least privilege, not laziness, and knowing the difference is the skill. Wildcard-everything (b) makes rotation irrelevant, self-review (c) is not a control, and s3:* (d) is both too wide and aimed at the wrong layer.</p>","hints":["One option hides behind a true fact (some services lack resource scoping) to excuse an untrue one.","Rotation, self-review, and 'somewhere in S3' are not substitutes for scoped statements."],"tip":"Scope every resource that supports it; where the service cannot scope, name the exact read-only action."},{"id":"h25","type":"branch","theme":"C","timeSec":140,"title":"The webhook that fired at production","scenario":"<p>04:12. The SOAR 'block-ip' playbook's webhook was misconfigured: it called the <b>production</b> firewall instead of the lab and blocked internal ranges (10[.]0[.]0[.]0/8 among them). Four minutes of damage so far.</p>","question":"<p>Work the recovery. Each choice shows its consequence.</p>","branch":[{"q":"First move, four minutes in?","opts":[{"t":"Trigger the documented rollback playbook and break-glass access, and page the network owner — no hand-editing in panic.","after":"The rollback reverts to the last known-good policy in six minutes; the network owner watches the blast radius while you work."},{"t":"Log into the firewall console and start deleting rules by hand.","after":"Hand edits under pressure create a second, unrecorded configuration drift on top of the first."},{"t":"Wait for the next change window to revert cleanly.","after":"Internal traffic keeps dying for hours; 'clean process' has become 'longer outage'."}],"c":0},{"q":"Traffic is recovering. What comes next?","opts":[{"t":"Run post-action verification: compare the live policy against the known-good config, and build a timeline from the audit trail.","after":"One leftover block rule is caught by the diff and removed; the audit trail gives a minute-accurate timeline for the review."},{"t":"Declare success because the ping test works.","after":"One ping proves one path. The leftover rule bites during failover tonight."},{"t":"Delete the audit entries that show the misfire.","after":"Now the org has an outage AND a cover-up. The second one ends careers."}],"c":0},{"q":"How does this never happen again?","opts":[{"t":"Environment pinning (separate lab and production credentials), dry-run mode default-on, dual approval for network-wide actions, sandbox replay before promotion.","after":"The lab token physically cannot touch production; dry-run shows the diff first; dual approval gates the wide actions."},{"t":"Rename the webhook so the typo cannot recur.","after":"The class of failure — wrong environment, no rehearsal — survives any renaming."},{"t":"Only run playbooks at night when fewer people are affected.","after":"You have scheduled the blast radius instead of removing it."}],"c":0}],"explain":"<p>Automation misfires are contained by process, not heroics: the documented <b>rollback</b> path and <b>break-glass</b> access revert cleanly while the network owner supervises. Verification is a diff against known-good plus an audit-trail timeline — a single ping proves nothing. Prevention is structural: <b>environment pinning</b> (lab credentials cannot touch production), <b>dry-run default</b> that shows the intended change before it applies, <b>dual approval</b> for network-wide actions, and sandbox replay. Deleting audit entries converts an outage into a trust failure; never.</p>","hints":["Step 1: the fastest safe path is the one you rehearsed and can prove.","Step 3: name the control that makes the wrong environment impossible, not just unlikely."],"tip":"Misfire playbook: rollback + break-glass → verify by diff + audit trail → pin environments, dry-run, dual approval."},{"id":"h26","type":"order","theme":"C","timeSec":100,"title":"Forensic-safe handling of the crown jewel","scenario":"<p>AI triage flagged anomalous admin behaviour on fin-db-01, the payment database host. Evidence rules apply from the first minute — one wrong move and the case is worthless in court.</p>","question":"<p>Order the six actions from first (top) to last (bottom).</p>","steps":["Freeze the scene: isolate fin-db-01 but keep it powered on","Preserve state: snapshot the EBS volumes and export CloudTrail for the window","Collect volatile data: memory capture and the running-process list","Analyze copies only — never investigate on the live host","Contain identities: revoke the sessions and keys used from that host","Eradicate and rebuild from known-good images; document the full timeline"],"explain":"<p>Forensic order follows volatility and integrity. Freeze first — isolation without power-off preserves both the attacker's runtime state and the encryption keys in memory. Preservation (volume snapshots, CloudTrail export) and volatile collection (memory, processes) come before anything that changes the host, because memory dies with a reboot and snapshots die with a wipe. All analysis runs on copies; the live host is never your workbench. Identity revocation cuts the attacker's path once evidence is safe, and eradication plus rebuild from known-good images comes last, with the timeline documented throughout for admissibility.</p>","hints":["Two evidence steps happen while nothing on the host changes; one of them dies at reboot.","The host is evidence before it is a machine — where does analysis happen?"],"tip":"Forensic order: isolate (powered) → preserve → collect volatile → analyze copies → revoke identities → rebuild."},{"id":"h27","type":"bank","theme":"D","timeSec":120,"title":"Write the automation governance policy","scenario":"<p>The automation council drafts the one-page governance policy for SOAR playbooks. The six missing words carry the whole document.</p>","question":"<p>Fill every blank from the word bank. Each word is used at most once.</p>","bank":["dual","break-glass","audit","peer","least","metrics","runbook","RACI","shadow"],"slots":["dual","break-glass","audit","peer","least","metrics"],"slotLabels":["1. Every playbook action above a set blast radius requires <b>___</b> approval before execution.","2. A documented <b>___</b> procedure exists for emergencies when the automation platform itself is down.","3. All automated actions write to the <b>___</b> trail with actor, input, and approval ID.","4. Playbooks are <b>___</b>-reviewed and load-tested before promotion from the sandbox.","5. Automated credentials run under a dedicated role with <b>___</b> privilege and rotated secrets.","6. The team reviews automation <b>___</b> — false-positive rate, override rate, MTTR — every month."],"explain":"<p>The six controls: <b>dual</b> approval for high-blast-radius actions (two humans, no fat-finger single point), a documented <b>break-glass</b> procedure for when automation is down, a complete <b>audit</b> trail per action (actor, input, approval ID), <b>peer</b> review plus load-testing before sandbox promotion, <b>least</b>-privilege dedicated roles with rotated secrets for the automation identities, and a monthly <b>metrics</b> review (false-positive rate, override rate, MTTR) that keeps the whole system honest. <i>Distractors:</i> a <b>runbook</b> is the human procedure document, <b>RACI</b> is a responsibility matrix, <b>shadow</b> mode is a deployment stage — all real terms, wrong blanks.</p>","hints":["Blank 1 is how many humans; blank 4 is how many humans review code.","One distractor is a document type, one is a matrix, one is a deployment stage."],"tip":"Governance = dual approval + break-glass + audit trail + peer review + least privilege + monthly metrics."},{"id":"h28","type":"linepick","theme":"A","timeSec":110,"title":"The LLM-drafted runbook: find the hallucinations","scenario":"<p>An assistant generated this runbook draft. It reads confidently. Five lines would cause real damage or violate policy if executed as written.</p>","question":"<p>Click the five lines that must be fixed before this runbook is approved.</p>","lines":["runbook: contain-guardduty-trojan","drafted_by: ai-assistant (unreviewed)","steps:","  - confirm the finding exists in GuardDuty","  - call GuardDuty DeleteDetector to remove the threat","  - run rm -rf /tmp/* on the affected host to clean it","  - collect memory with SSM Run Command for forensics","  - email the full raw logs to the CEO","  - revoke the user's sessions via STS","  - close the case as remediated","approval: none needed","review: pending"],"expected":[4,5,7,9,10],"explain":"<p>Line 5 hallucinates an API: <b>DeleteDetector</b> deletes your GuardDuty detector — your own detection capability — and removes no threat; no such 'remove threat' call exists. Line 6 (<b>rm -rf</b>) destroys evidence and data on a whim. Line 8 sends unredacted raw logs — credentials, PII, customer data — to an executive's mailbox: a data-handling violation, not a notification step. Line 10 closes the case as remediated with zero verification. Line 11 removes the human from a containment workflow. The good lines: confirming the finding (4), memory collection via SSM (7), session revocation (9), and the pending review (12) are all legitimate — which is exactly why a confident-sounding draft still needs line-by-line review.</p>","hints":["One line invents a destructive API that does not do what it claims.","Two lines leak or destroy data; one line pretends the work is done; one removes the human."],"tip":"LLM drafts: verify every API call exists and does what it claims, protect evidence and PII, keep verification and approval in the loop."},{"id":"h29","type":"prio","theme":"A","timeSec":130,"title":"Rank the queue by priority, then by blast-radius growth","scenario":"<p>Six situations are waiting and the orchestrator works top-down until its budget runs out, so the order is the decision. Matrix: P1 = active compromise of critical assets or spreading impact; P2 = confirmed exposure or data loss, limited scope; P3 = real attack activity, blocked or contained; P4 = informational or no viable path.</p>","question":"<p>Rank the six situations from highest priority (top) to lowest priority (bottom). Inside a band, the situation that gets worse fastest goes higher.</p>","steps":["Ransom note on the crown-jewel file share; encryption is spreading (P1)","Root-level API abuse from an unknown ASN on the production payment database (P1)","DLP: 50 customer records pasted to personal webmail by a departing employee (P2)","Public S3 bucket with test data, no PII; exposed for four days (P2)","Password spray, 200 attempts, all blocked by MFA, no success (P3)","Vulnerability scan flags an old Apache version on an isolated lab VLAN (P4)"],"explain":"<p>Top-down: the two P1 items come first, and between them the <b>spreader</b> outranks the <b>contained credential abuse</b> — ransomware widening its blast radius costs more every minute, while the payment-DB abuse is one credential until proven otherwise. Then confirmed harm with limited scope: the <b>50-record loss</b> is real data loss; the <b>exposed test bucket</b> is real exposure but no PII — loss outranks exposure. The <b>MFA-blocked spray</b> was a real attack that failed (P3), and the <b>lab VLAN</b> finding has no viable path to production (P4). The P-label only brackets the decision — ordering inside a band is the expert judgement call.</p>","hints":["Inside P1, ask which situation gets worse by the minute if you do nothing.","P3 and P4 both mean 'nothing succeeded' — separate them by whether any path to production exists."],"tip":"Priority = impact × urgency. Band first (P1–P4), then order inside the band by blast-radius growth."},{"id":"h30","type":"multi","theme":"B","timeSec":110,"title":"Why did the engine merge these?","scenario":"<p>The correlation engine merged four events into one case for user r.ibarra: a first-time-country sign-in (02:01), a self-issued access key (02:06), a new admin policy on the key's user (02:09), and a 900 MB egress from her workstation (02:31).</p>","question":"<p>Select <b>all</b> reasons that correctly justify the merge.</p>","options":["All four events share the same identity (r.ibarra).","All four events fall inside one 30-minute window.","The stages form a known chain: valid login → key creation → policy change → egress.","All four events carry the same event ID.","The engine's model had learned this chain shape from past confirmed incidents.","All four events have High severity, so they must belong to one story."],"correct":[0,1,2,4],"explain":"<p>Merges stand on evidence: the shared <b>identity</b> (r.ibarra in all four), the <b>time window</b> (all inside 30 minutes), the <b>chain shape</b> (login → key → policy → egress is a recognized escalation-to-exfiltration sequence), and the model's learned pattern from past confirmed cases — that is exactly what behavioral correlation is for. Wrong reasons: event IDs are unique per event (and similarity of IDs means nothing), and shared severity says nothing about shared causation — two unrelated High alerts on one morning stay separate.</p>","hints":["Two wrong options confuse 'looks similar' with 'causally linked'.","The identity, the clock, the chain, and the learned pattern — count them."],"tip":"Justify every merge with: entity + window + chain logic (+ learned pattern). Severity and ID similarity justify nothing."}]};
var META=JSON.parse(document.getElementById("cm-exercise-meta").textContent);

var S=null;

/* ---------- session ---------- */
function newSession(){
  var perm=shuffle(range(EXS.length));

    var o={pos:pos,e:e,checked:false,locked:false,skipped:false,auto:false,earned:null,gres:null,rows:null,disp:null,hintsUsed:0,hintList:[],touched:false};
    if(e.type==="qcm"||e.type==="multi"){o.opts=shuffle(range(e.options.length));o.sel=(e.type==="multi")?[]:null;}
    else if(e.type==="bank"){o.bank=shuffle(e.bank.slice());o.slots=range(e.slots.length).map(function(){return null;});o.selWord=null;}
    else if(e.type==="classify"){o.items=shuffle(range(e.items.length));o.asg={};o.selItem=null;}
    else if(e.type==="order"){var ord;do{ord=shuffle(range(e.steps.length));}while(ord.every(function(v,i){return v===i;})&&e.steps.length>1);o.ord=ord;}
    else if(e.type==="branch"){o.steps=e.branch.map(function(s){return{q:s.q,opts:shuffle(range(s.opts.length))};});o.chosen=range(e.branch.length).map(function(){return null;});o.stepOpen=0;}
    else if(e.type==="linepick"){o.pick=[];}
    else if(e.type==="terminal"){o.cmd="";o.hist=[];}
    else if(e.type==="logviewer"){var sb=e.sub;o.subOpts=shuffle(range(sb.options.length));o.subSel=(sb.type==="multi")?[]:null;o.filt="";}
    else if(e.type==="fillblank"){o.fb=range(e.slotLabels.length).map(function(){return "";});}
    else if(e.type==="match"){o.rgt=shuffle(e.pairs.map(function(p){return p.r;}).concat(e.extras||[]));o.pair=range(e.pairs.length).map(function(){return null;});o.selL=null;}
    else if(e.type==="prio"){var or2;do{or2=shuffle(range(e.steps.length));}while(or2.every(function(v,i){return v===i;})&&e.steps.length>1);o.ord=or2;}
    return o;
  });
  S={st:st,pos:0,remaining:TOTAL,manual:false,checkPause:false,running:false,done:false,reported:false,attempt:(S&&S.attempt?S.attempt+1:1)};
}
function cur(){return S.st[S.pos];}
function hasAnswer(st){
  if(st.checked)return true;var e=st.e;
  switch(e.type){
    case "qcm":return st.sel!=null;
    case "multi":return st.sel&&st.sel.length>0;
    case "bank":return st.slots.some(function(w){return w;});
    case "classify":return Object.keys(st.asg).length>0;
    case "order":return !!st.touched;
    case "branch":return st.chosen.every(function(c){return c!=null;});
    case "linepick":return st.pick.length>0;
    case "terminal":return st.cmd.trim().length>0;
    case "logviewer":return st.subSel!=null&&(typeof st.subSel==="number"||st.subSel.length>0);
    case "fillblank":return st.fb.some(function(v){return v.trim().length>0;});
    case "match":return st.pair.some(function(j){return j!=null;});
    case "prio":return !!st.touched;
  }return false;
}

/* ---------- grading ---------- */
function grade(st){
  var e=st.e,rows=[],frac=0,disp={};
  var pen=Math.pow(0.9,st.hintsUsed);
  function pct(f){return Math.max(0,Math.min(1,f*pen));}
  if(e.type==="qcm"){
    var dC=st.opts.indexOf(e.correct[0]);var ok=(st.opts[st.sel]===e.correct[0]);frac=pct(ok?1:0);
    disp={picked:st.sel,correct:dC};
    rows=[{t:(ok?"Your pick is the correct answer.":"Correct answer: "+e.options[e.correct[0]]+"."),s:ok?"ok":"bad"}];
  }else if(e.type==="multi"){
    var selO=st.sel.map(function(d){return st.opts[d];});
    var hits=selO.filter(function(o){return e.correct.indexOf(o)>=0;}).length;
    frac=pct(hits/e.correct.length);
    disp={correctD:e.correct.map(function(o){return st.opts.indexOf(o);}),picked:st.sel.slice()};
    e.correct.forEach(function(o){var d=st.opts.indexOf(o);var was=st.sel.indexOf(d)>=0;
      rows.push({t:(was?"Correctly selected: ":"Missed (correct but not selected): ")+e.options[o],s:was?"ok":"miss"});});
    st.sel.forEach(function(d){var o=st.opts[d];if(e.correct.indexOf(o)<0)rows.push({t:"Selected but not correct: "+e.options[o],s:"bad"});});
  }else if(e.type==="bank"){
    var hits=0;disp={slotState:[]};
    st.slots.forEach(function(w,i){var ok=w===e.slots[i];var s2=!w?"miss":(ok?"ok":"bad");disp.slotState[i]=s2;if(ok)hits++;
      rows.push({t:(ok?"Slot "+(i+1)+" correct.":(w?"Slot "+(i+1)+": you placed \""+w+"\" — correct: \""+e.slots[i]+"\".":"Slot "+(i+1)+" left empty — correct: \""+e.slots[i]+"\".")),s:s2});});
    frac=pct(hits/e.slots.length);
  }else if(e.type==="classify"){
    var hits=0;disp={itemState:{}};
    st.items.forEach(function(oi,d){var item=e.items[oi];var b=st.asg[d];var ok=b===item.b;var s2=b?(ok?"ok":"bad"):"miss";disp.itemState[d]=s2;if(ok)hits++;
      rows.push({t:(ok?"Correct: ":(b?"Wrong: ":"Not placed: "))+trunc(item.t,80)+(b?(" — you said "+bucketLabel(e,b)+", correct: "+bucketLabel(e,item.b)):" (correct: "+bucketLabel(e,item.b)+")"),s:s2});});
    frac=pct(hits/e.items.length);
  }else if(e.type==="order"||e.type==="prio"){
    var hits=0;disp={posState:[]};
    st.ord.forEach(function(oi,i){var ok=oi===i;disp.posState[i]=ok?"ok":"bad";if(ok)hits++;});
    frac=pct(hits/e.steps.length);
    for(var i=0;i<e.steps.length;i++){var okP=st.ord[i]===i;
      rows.push({t:(okP?"Position "+(i+1)+" correct.":"Position "+(i+1)+": you had \""+trunc(e.steps[st.ord[i]],60)+"\" — correct: \""+trunc(e.steps[i],60)+"\"."),s:okP?"ok":"bad"});}
  }else if(e.type==="fillblank"){
    var hitsF=0;disp={fbState:[]};
    e.blanks.forEach(function(b,i){var v=(st.fb[i]||"").trim().replace(/\s+/g," ").toLowerCase();var s2;
      if(!v){s2="miss";}else{s2=b.accepts.some(function(rx){return new RegExp("^(?:"+rx+")$","i").test(v);})?"ok":"bad";}
      disp.fbState[i]=s2;if(s2==="ok")hitsF++;
      rows.push({t:(s2==="ok"?"Blank "+(i+1)+" correct.":"Blank "+(i+1)+": "+(s2==="miss"?"left empty":"you typed \""+((st.fb[i]||"").replace(/\s+/g," ").trim())+"\"")+" — expected: "+b.answer+"."),s:s2});});
    frac=pct(hitsF/e.blanks.length);
  }else if(e.type==="match"){
    var hitsM=0;disp={pairState:[]};
    e.pairs.forEach(function(p,i){var j=st.pair[i];var ok=j!=null&&st.rgt[j]===p.r;var s2=j!=null?(ok?"ok":"bad"):"miss";disp.pairState[i]=s2;if(ok)hitsM++;
      rows.push({t:(ok?"Correct pair: ":(j!=null?"Wrong: ":"Not paired: "))+trunc(p.l,60)+(j!=null&&!ok?(" — you said \""+st.rgt[j]+"\"; "):" → ")+"correct: \""+p.r+"\"",s:s2});});
    frac=pct(hitsM/e.pairs.length);
  }else if(e.type==="branch"){
    var hits=0;disp={stepState:[],correctD:[]};
    e.branch.forEach(function(bs,si){var d=st.chosen[si];var orig=d==null?null:st.steps[si].opts[d];var ok=orig===bs.c;disp.stepState[si]=ok?"ok":"bad";disp.correctD[si]=st.steps[si].opts.indexOf(bs.c);if(ok)hits++;
      rows.push({t:(ok?"Step "+(si+1)+" correct.":"Step "+(si+1)+": correct choice was \""+bs.opts[bs.c].t+"\"."),s:ok?"ok":"bad"});});
    frac=pct(hits/e.branch.length);
  }else if(e.type==="linepick"){
    if(e.single){
      var ok=st.pick.length===1&&st.pick[0]===e.expected[0];frac=pct(ok?1:0);
      disp={lineState:{}};disp.lineState[e.expected[0]]=ok?"ok":"miss";
      st.pick.forEach(function(i){if(i!==e.expected[0])disp.lineState[i]="bad";});
      rows=[{t:(ok?"Correct line.":"The problem is line "+(e.expected[0]+1)+": "+trunc(e.lines[e.expected[0]],90)),s:ok?"ok":"bad"}];
    }else{
      var hits=0;disp={lineState:{}};
      e.expected.forEach(function(i){var was=st.pick.indexOf(i)>=0;disp.lineState[i]=was?"ok":"miss";if(was)hits++;
        rows.push({t:(was?"Correct: ":"Missed problem line "+(i+1)+": ")+trunc(e.lines[i],90),s:was?"ok":"miss"});});
      st.pick.forEach(function(i){if(e.expected.indexOf(i)<0){disp.lineState[i]="bad";rows.push({t:"Not a real problem: line "+(i+1),s:"bad"});}});
      frac=pct(hits/e.expected.length);
    }
  }else if(e.type==="terminal"){
    var norm=st.cmd.trim().replace(/\s+/g," ");
    var ok=e.accepts.every(function(rx){return new RegExp(rx,"i").test(norm);});frac=pct(ok?1:0);
    disp={ok:ok};
    st.hist=[{cmd:st.cmd,ok:ok}];
    rows=[{t:(ok?"Command accepted.":"Command not accepted — compare it with the accepted approach in the explanation."),s:ok?"ok":"bad"}];
  }else if(e.type==="logviewer"){
    var sb=e.sub;
    if(sb.type==="qcm"){
      var dC=st.subOpts.indexOf(sb.correct[0]);var ok=(st.subOpts[st.subSel]===sb.correct[0]);frac=pct(ok?1:0);
      disp={picked:st.subSel,correct:dC};
      rows=[{t:(ok?"Your pick is the correct answer.":"Correct answer: "+sb.options[sb.correct[0]]+"."),s:ok?"ok":"bad"}];
    }else{
      var selO=st.subSel.map(function(d){return st.subOpts[d];});
      var hits=selO.filter(function(o){return sb.correct.indexOf(o)>=0;}).length;
      frac=pct(hits/sb.correct.length);
      disp={correctD:sb.correct.map(function(o){return st.subOpts.indexOf(o);}),picked:st.subSel.slice()};
      sb.correct.forEach(function(o){var d=st.subOpts.indexOf(o);var was=st.subSel.indexOf(d)>=0;
        rows.push({t:(was?"Correctly selected: ":"Missed (correct but not selected): ")+sb.options[o],s:was?"ok":"miss"});});
      st.subSel.forEach(function(d){var o=st.subOpts[d];if(sb.correct.indexOf(o)<0)rows.push({t:"Selected but not correct: "+sb.options[o],s:"bad"});});
    }
  }
  st.disp=disp;
  return {frac:Math.round(frac*1000)/1000,rows:rows};
}
function bucketLabel(e,id){for(var i=0;i<e.buckets.length;i++){if(e.buckets[i].id===id)return e.buckets[i].label;}return id;}

/* ---------- rendering ---------- */
function stateIcon(s){return s==="ok"?"✔":(s==="bad"?"✘":"± ");}
function markCls(st,d,map){return st.checked&&st.locked&&map[d]?" "+map[d]:"";}
function hl(line){
  var h=esc(line);
  h=h.replace(/(&quot;[^&]*?&quot;)(\s*:)/g,"<span class=\"k\">$1</span>$2");
  h=h.replace(/\b(Critical|critical|DNSDataExfiltration|StopLogging|AdministratorAccess|Failed password|AccessDenied|exfiltrat\w*|beacon\w*)\b/g,"<span class=\"hi\">$1</span>");
  h=h.replace(/\b(High|severity[:=]?\s*[7-9]|UnauthorizedAccess|CredentialAccess)\b/g,"<span class=\"md\">$1</span>");
