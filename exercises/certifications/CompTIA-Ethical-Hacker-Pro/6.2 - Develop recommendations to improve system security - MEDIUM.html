{"t":"drag","th":"C","kw":"MFA,EDR,offline backups,patch management,SMBv1 removal,IR playbook,honeypot / canary tokens,code signing,SIEM / centralized logging","pts":9,"title":"Sort the remediation plan by control type","sc":"You finished an internal penetration test for Meridian Foods. In the closing meeting the CISO asks you to sort your list of recommendations by <b>control type</b>: <b>Preventive</b> (stops the attack before it happens), <b>Detective</b> (finds and reports attacks while they happen), and <b>Corrective</b> (restores or improves things after an incident).","q":"Drag each recommendation onto the pillar it belongs to.","d":{"slots":[{"id":"p","label":"Preventive"},{"id":"d","label":"Detective"},{"id":"c","label":"Corrective"}],"items":[{"v":"Enforce MFA on all remote access","s":"p"},{"v":"Deploy EDR and review its alerts daily","s":"d"},{"v":"Test quarterly restores from offline backups","s":"c"},{"v":"Patch the 9.8 RCE on the edge gateway","s":"p"},{"v":"Tune SIEM rules for password spraying","s":"d"},{"v":"Remove SMBv1 and close unused RDP","s":"p"},{"v":"Update the IR playbook after lessons learned","s":"c"},{"v":"Deploy a canary honeypot in the server VLAN","s":"d"},{"v":"Enforce code signing for internal scripts","s":"p"}]},"ex":"<b>Preventive</b> controls block attacks before they start: MFA on remote access, patching the RCE, removing SMBv1 and unused RDP, and code signing for scripts (it stops unsigned malicious scripts from running). <b>Detective</b> controls spot attacks in progress: EDR alert review, tuned SIEM correlation rules for password spraying, and a canary honeypot (nothing real should ever touch it, so any hit is a strong signal). <b>Corrective</b> controls recover and improve after an incident: tested offline-backup restores bring data back, and an updated IR playbook makes the next response faster. The same security goal often needs all three types — that is defense in depth.","hi":["Ask yourself: does it stop it, see it, or fix it afterwards?"]},
{"t":"match","th":"B","kw":"LAPS,MFA,gMSA,Kerberoasting,default credentials,tiered admin model,least privilege,service account hygiene","pts":5,"title":"Pair each finding with its best recommendation","sc":"Your report for Harbor Logistics lists five identity findings. The client agrees to fix all of them and asks you to write the recommendation next to each finding for the final deliverable.","q":"Drag the recommendation onto the finding it fixes at the root cause.","d":{"slots":[{"id":"s1","label":"Same local admin password on every laptop"},{"id":"s2","label":"No MFA on the VPN gateway"},{"id":"s3","label":"Kerberoastable service account with a weak password"},{"id":"s4","label":"Default admin credentials on 40 printers"},{"id":"s5","label":"Domain Admin account used for e-mail on workstations"}],"items":[{"v":"Deploy LAPS so every host rotates its own local admin password","s":"s1"},{"v":"Enforce MFA for all remote access","s":"s2"},{"v":"Move the account to a gMSA and rotate its password","s":"s3"},{"v":"Change the defaults and disable the admin web UI","s":"s4"},{"v":"Create separate admin accounts under a tiered model","s":"s5"}]},"ex":"Each recommendation removes the root cause, not just the symptom. <b>LAPS</b> gives every machine a different, rotated local admin password, so one stolen password cannot spread — this also blocks pass-the-hash between laptops. <b>MFA on the VPN</b> makes a stolen password alone useless for remote access. A <b>gMSA</b> (group managed service account) is a service account that Windows rotates automatically with a long random password — it kills the Kerberoasting risk, where attackers ask for the account's encrypted ticket and crack it offline. <b>Default credentials</b> are public knowledge on the internet, so changing them and closing the admin web UI removes an easy foothold. The <b>tiered admin model</b> keeps Domain Admin logins off user PCs, so malware on a workstation cannot steal a tier-0 credential (which could lead to DCSync and total domain compromise).","hi":["One item is about printers, one about a service account Windows can manage for you."]},
{"t":"qcm","th":"A","kw":"CVSS scoring,risk-based prioritization,business impact","pts":3,"title":"Two findings, one CVSS score — what comes first?","sc":"Your scan found the same pre-auth RCE (CVSS 9.8) on two VPN appliances. Appliance A sits on the internet and a public exploit exists. Appliance B runs the same firmware but sits in an isolated lab network with no route from user networks.","q":"Which finding should the recommendation report list for remediation first?","d":{"ch":[{"v":"Appliance A, because of its exposure and the public exploit","ok":true},{"v":"Appliance B, because the lab has weaker monitoring"},{"v":"Both at once — identical CVSS means identical priority"},{"v":"Neither — no attack has been observed in the logs yet"}]},"ex":"A CVSS base score measures severity in the abstract, not your real risk. Two devices with the same 9.8 can carry very different risk: <b>Appliance A is reachable by anyone</b> and already has working public exploit code, so the likelihood of attack is high. Appliance B has the same severity but almost no exposure, so it drops down the queue even though the score matches. Risk = severity × likelihood × impact on <b>your</b> business. Good recommendations always rank by this context, and 'no attack seen yet' is never a reason to defer a live pre-auth RCE on the internet.","hi":["CVSS base scores do not know where the device is plugged in."]},
{"t":"blank","th":"E","kw":"executive summary,parameterized queries,least privilege,retest / fix validation,report audiences","pts":4,"title":"Complete the executive summary","sc":"You are drafting the executive summary of your web application penetration test for a retail client. Executives read this section first; it must stay short and free of jargon, while still pointing at the right fixes.","q":"Fill each blank with the best word or phrase from the bank.","d":{"pre":"The assessment covered the customer portal and its APIs. The most serious finding is SQL injection in the login form, rated [[1]] because an attacker could read the whole customer database without credentials. We recommend fixing it with [[2]] and reviewing every query that takes user input. On the file server, share permissions should follow [[3]] so each user only gets the access the job needs. Once your fixes are live, we recommend a [[4]] to confirm the gaps are really closed.","bank":["critical","parameterized queries","least privilege","retest","medium","input validation","encrypt everything","a longer password policy","full disk encryption"],"key":["critical","parameterized queries","least privilege","retest"]},"ex":"The summary rates the SQL injection <b>critical</b>: unauthenticated access to all customer data is a company-level risk, not a technical detail. The real fix is <b>parameterized queries</b> (the database treats user input as data, never as SQL code) — a WAF or input filtering only lowers the chance of exploitation. <b>Least privilege</b> means each user and service gets only the access it needs, which shrinks the blast radius of any compromise. Finally, a <b>retest</b> after remediation is what turns 'we fixed it' into evidence that it is fixed; executives should see that verification step in the plan.","hi":["Two slots ask for a named security principle made of two words."]},
{"t":"log","th":"C","kw":"SMBv1 removal,NTLMv1 / RC4 legacy auth,unnecessary services,patch management","pts":4,"title":"Prove the legacy-protocol finding from the log","sc":"Your scanner flagged FILESrv01 for legacy protocols, but the server owner disagrees and wants proof before he approves the change window. You captured a short window of the server's SMBD log.","q":"Select every line that proves legacy SMBv1 or NTLMv1 is still in use. Your recommendation to disable them must cite these lines.","d":{"lines":[{"t":"Feb 11 09:14:03 FILESrv01 smbd[812]: client 10[.]20[.]30[.]55 requested dialect NT LM 0.12 (SMBv1)","ok":true},{"t":"Feb 11 09:14:03 FILESrv01 smbd[812]: negotiated protocol SMBv1 (dialect NT1)","ok":true},{"t":"Feb 11 09:14:44 FILESrv01 smbd[815]: auth user svc_print used NTLMv1 session security","ok":true},{"t":"Feb 11 09:15:41 FILESrv01 smbd[917]: negotiated protocol SMB 3.1.1","ok":false},{"t":"Feb 11 09:15:58 FILESrv01 smbd[919]: connect to share print$ from 10[.]20[.]30[.]58 as CORP\\jmovie ok","ok":false},{"t":"Feb 11 09:16:12 FILESrv01 smbd[922]: client 10[.]20[.]30[.]61 negotiated SMBv2","ok":false},{"t":"Feb 11 09:17:02 FILESrv01 smbd[930]: auth user jmovie used NTLMv2 session security","ok":false},{"t":"Feb 11 09:18:24 FILESrv01 systemd[1]: Started Daily apt download activities.","ok":false},{"t":"Feb 11 09:19:01 FILESrv01 CRON[941]: (root) CMD (/usr/local/bin/backup.sh)","ok":false},{"t":"Feb 11 09:21:47 FILESrv01 smbd[812]: client 10[.]20[.]30[.]55 closed connection","ok":false},{"t":"Feb 11 09:23:10 FILESrv01 smbd[955]: negotiated protocol SMB 3.0.2","ok":false},{"t":"Feb 11 09:25:36 FILESrv01 systemd[1]: snapd.service: Succeeded.","ok":false}]},"ex":"The two SMBv1 lines show clients still <b>negotiating dialect NT1</b>, and the NTLMv1 line shows the print service account still authenticating with the ancient challenge/response protocol. Both are legacy: SMBv1 is the protocol that worms like WannaCry and EternalBlue rode across networks, and NTLMv1 hashes can be cracked quickly and relayed. SMB 3.x and NTLMv2 lines are the healthy ones — they are not evidence. The recommendation: set the server minimum dialect to SMB 2 or 3, disable NTLMv1 (audit first, then enforce NTLMv2 or Kerberos), and find the old clients that still need SMBv1 before switching it off.","hi":["Filter on the word 'negotiated' and on 'NTLM'. SMB 2 and 3 are the modern versions."]},
{"t":"order","th":"A","kw":"retest / fix validation,change management,risk-based prioritization,IR playbook","pts":6,"title":"Order the post-engagement improvement workflow","sc":"After a ransomware drill, the incident commander asks you to write the standard workflow that turns an assessment report into actual security improvements. She wants the steps in the order a real organization should follow them.","q":"Drag the steps into the correct order (first step on top).","d":{"items":["Validate every reported finding and drop the false positives","Prioritize the confirmed findings by risk and business impact","Assign an owner and a deadline to each recommendation","Implement the fixes through normal change management","Retest the fixes to confirm the gaps are closed","Update the report and the risk register with the final status"]},"ex":"Fixing what is not real wastes the limited change window, so findings are <b>validated</b> first. Then they are <b>prioritized by risk</b> — exposure, impact, exploitability — because no organization can patch everything at once. Every item then needs a named <b>owner and deadline</b>; recommendations without owners quietly die. Fixes go through normal <b>change management</b> so a security patch does not break production silently. A <b>retest</b> proves the fix works instead of trusting a ticket marked 'done'. Finally the <b>report and risk register</b> are updated so auditors and future teams see the truth: what was found, what was fixed, what was accepted.","hi":["You cannot prioritize what you have not verified, and you cannot close the loop before verifying the fix."]},
{"t":"term","th":"C","kw":"SIEM / centralized logging,least privilege,SSH hardening","pts":3,"title":"Count the failed SSH attempts in the shell","sc":"You are on the SOC jump box. The file <code>/home/analyst/auth.log</code> holds one day of SSH logs. Your draft recommendation says the account <code>svc_backup</code> is being targeted, and you want the raw proof lines to paste into the report.","q":"Use a <code>grep</code> command to print every <code>Failed password</code> line for the user <code>svc_backup</code> from <code>/home/analyst/auth.log</code>.","d":{"title":"analyst@soc-lab: ~ — bash","prompt":"analyst@soc-lab:~$ ","intro":["SOC lab shell — task: print the failed SSH password lines for svc_backup.","Use the grep command family. Useful flags: -i (ignore case), -E (extended regex).","Expected output shape, one line per event:","  Mar 04 02:41:19 srv-db01 sshd[2211]: Failed password for svc_backup from 10[.]20[.]7[.]44 port 51234 ssh2"],"help":"Family reminder: grep. Try: grep -i 'Failed password' /home/analyst/auth.log — then narrow it to the svc_backup user with a second grep or a regex.","goals":[{"all":["(grep|awk)","failed password","svc[_ -]?backup"],"demo":"grep -i 'Failed password' /home/analyst/auth.log | grep svc_backup"}]},"ex":"<code>grep -i 'Failed password' /home/analyst/auth.log | grep svc_backup</code> prints exactly the evidence lines. <code>-i</code> makes the match case-insensitive, so 'failed password', 'Failed Password' and 'FAILED password' all match — attackers and log formats are not consistent. Piping a second <code>grep svc_backup</code> (or using a combined regex like <code>grep -E 'Failed password.*svc_backup'</code>) narrows the noise to the targeted account. Pasting these lines into the recommendation turns 'someone is attacking us' into a provable statement with timestamps and source addresses — which also justifies the follow-up recommendations: rotate the service account credentials and restrict SSH sources.","hi":["grep -i 'Failed password' /home/analyst/auth.log, then pipe | grep svc_backup"]},
{"t":"multi","th":"C","kw":"TLS hardening,encryption in transit,WAF / virtual patching,secure baseline","pts":3,"title":"Pick the real TLS hardening steps","sc":"Your scan of <code>shop.crpmoda[.]com</code> shows the web server still accepts TLS 1.0 and 1.1 and offers old CBC cipher suites. The client asks which changes actually harden the TLS configuration (not general web defense — just TLS).","q":"Select the THREE recommendations that belong in the TLS hardening section.","d":{"n":3,"ch":[{"v":"Disable TLS 1.0 and TLS 1.1 on the server","ok":true},{"v":"Enable TLS 1.3 next to TLS 1.2 with modern AEAD ciphers","ok":true},{"v":"Enable HSTS so browsers refuse plain HTTP","ok":true},{"v":"Put a WAF in front of the application","ok":false},{"v":"Reissue the certificate with a 1024-bit RSA key","ok":false},{"v":"Serve the login page from a subdomain with a self-signed cert","ok":false}]},"ex":"TLS hardening means removing weak protocol versions and weak ciphers and forcing encryption everywhere: turning off <b>TLS 1.0/1.1</b> kills protocol attacks like POODLE and downgrade tricks; enabling <b>TLS 1.3</b> (with AEAD suites such as AES-GCM or ChaCha20) removes whole classes of legacy flaws; <b>HSTS</b> stops the first plain-HTTP request from being hijacked or stripped. A <b>WAF</b> filters HTTP requests — useful, but it does not change the TLS configuration, so it belongs in a different section. A <b>1024-bit RSA key</b> weakens the certificate (2048-bit or ECC is the floor). A <b>self-signed certificate</b> makes browsers show warnings and trains users to click through them.","hi":["One distractor makes encryption weaker, one distractor does not touch TLS at all."]},
{"t":"spot","th":"C","kw":"SMBv1 removal,secure baseline,CIS Benchmark,unnecessary services","pts":2,"title":"Spot the mistakes in smb.conf","sc":"The file server owner applied a partial CIS Benchmark hardening to <code>smb.conf</code> and believes the server is now compliant. You reviewed the config before signing off the recommendation.","q":"Click the TWO lines that still violate the hardened baseline.","d":{"lines":[{"t":"[global]","ok":false},{"t":"   workgroup = CORP","ok":false},{"t":"   server min protocol = NT1","ok":true},{"t":"   server max protocol = SMB3","ok":false},{"t":"   log level = 1","ok":false},{"t":"   load printers = no","ok":false},{"t":"[projects]","ok":false},{"t":"   path = /srv/projects","ok":false},{"t":"   valid users = @projteam","ok":false},{"t":"   guest ok = yes","ok":true},{"t":"   read only = no","ok":false}]},"ex":"<code>server min protocol = NT1</code> explicitly allows ancient SMBv1 clients — the hardened baseline sets <code>server min protocol = SMB2</code> (or SMB3), because SMBv1 carries wormable exploits and cannot use modern signing or encryption. <code>guest ok = yes</code> on a real project share lets anyone connect without an identity: no attribution, no access control, and combined with <code>read only = no</code> it becomes a writable anonymous drop point. The other lines are fine or cosmetic: <code>max protocol = SMB3</code> is good, <code>valid users = @projteam</code> is proper group-based least privilege, and log level or printer settings are not security failures here.","hi":["One line invites 30-year-old clients. One line invites strangers with no account at all."]},
{"t":"branch","th":"D","kw":"alert tuning,detection coverage,SIEM / centralized logging,IR playbook","pts":4,"title":"Fix the noisy SIEM without going blind","sc":"The SOC queue at NovaRetail gets 600 alerts a day; 90% are the same EDR rule firing on the inventory script. Analysts have started ignoring everything. You are asked to improve the pipeline so real attacks are seen.","q":"Decide step by step. Each choice unlocks the next step.","d":{"steps":[{"q":"First move before touching any rule?","ch":[{"v":"Delete the noisy rule so the queue is clean"},{"v":"Pull 2 weeks of alerts for that rule and check what it actually fired on"},{"v":"Buy a bigger SIEM license for more storage"}],"ok":1,"fb":"Tuning without data is guesswork. You first confirm what the rule fired on: here it is the inventory script every night — a false positive pattern, not an attack."},{"q":"The review shows one host ran the script from an odd subnet at 03:00 once. What now?","ch":[{"v":"Suppress the rule for all hosts forever"},{"v":"Whitelist the known script by hash and host, and keep alerting on every other execution"},{"v":"Turn the rule into a weekly report"}],"ok":1,"fb":"A narrow whitelist (same hash, same host, same account) kills the noise but keeps the rule armed. A global suppression would hide a real attacker reusing that script."},{"q":"How do you keep the queue trustworthy after the change?","ch":[{"v":"Track the false-positive rate per rule weekly and re-tune the worst one"},{"v":"Raise every threshold so fewer alerts appear"},{"v":"Route all alerts to a mailbox nobody reads"}],"ok":0,"fb":"Tuning is a loop: measure the false-positive rate, fix the worst rule, repeat. Raising thresholds hides real events; unread mailboxes are where detections go to die."},{"q":"The EDR lead wants the same change everywhere. What do you add so the rule is never fully blind?","ch":[{"v":"A canary alert that pages if the script ever runs on a server that never ran it before"},{"v":"Nothing — the whitelist is enough"},{"v":"A second copy of every alert in a spreadsheet"}],"ok":0,"fb":"A 'first-time-on-this-host' condition is a cheap detective control: normal noise is whitelisted, but any new context still fires. That is tuned detection, not detection loss."}]},"ex":"Alert tuning is not alert deletion. The safe loop: analyze what a rule fires on, whitelist the exact benign pattern (hash, host, account), keep the rule armed for everything else, and measure the false-positive rate over time. A noise-free queue that still fires on new behavior is the goal — '600 alerts a day' and '0 alerts a day' are both failures.","hi":["Step 2: the whitelist must be narrow enough that a copy-cat attacker does not blend in."]},
{"t":"rank","th":"A","kw":"risk-based prioritization,CVSS scoring,business impact,remediation timeline","pts":5,"title":"Rank the report findings for the fix queue","sc":"You are writing the remediation priority list for Kestrel Bank (450 staff, internet-facing services, cardholder data in scope). The scanner produced five confirmed findings. Business context: finding D sits on the payment-redirect page; the bank loses money for every minute of downtime, and attackers actively phish its customers.","q":"Rank from most urgent to fix first (top) to least urgent (bottom).","d":{"items":["A · Pre-auth RCE on the internet-facing file transfer appliance (CVSS 9.8, public exploit)","B · Reflected XSS on an internal admin report page (CVSS 6.1, admin-only reach)","C · Missing security headers on the careers site (CVSS 3.1, static content)","D · Open redirect on the payment confirmation page used in a live phishing kit (CVSS 6.8, actively abused)","E · Outdated library with known exploit on a patched backup server, no internet exposure (CVSS 7.5)"]},"ex":"1) <b>A</b> — internet-facing pre-auth RCE with a public exploit is the classic 'fix today' item: severity, exposure and likelihood all peak. 2) <b>D</b> — the CVSS is only 6.8, but it is being exploited right now against customers and harms the business directly; context beats the score. 3) <b>E</b> — a 7.5 on a hard-to-reach backup server: real risk, no urgency pressure, schedule it. 4) <b>B</b> — XSS limited to authenticated admins is a lower-likelihood path; still fix it, but after the above. 5) <b>C</b> — headers on a static site are hardening hygiene with minimal direct risk. The lesson: CVSS orders severity, but <b>exposure and active abuse order the queue</b>.","hi":["Two items are being exploited or trivially exploitable from the internet — they take the top two spots."]},
{"t":"drag","th":"E","kw":"report audiences,executive summary,business impact,retest / fix validation,remediation timeline","pts":6,"title":"Split report content by audience","sc":"Your report draft for Vantage Rail mixes everything into one wall of text. The CISO asks you to split each element into the right section: <b>Executive summary</b> (decisions, risk, money, deadlines), <b>Technical annex</b> (proof, commands, exact configs), or <b>Both</b> (the backbone every reader needs).","q":"Drag each element onto the section where it belongs.","d":{"slots":[{"id":"e","label":"Executive summary"},{"id":"t","label":"Technical annex"},{"id":"b","label":"Both sections"}],"items":[{"v":"Business impact of the top findings","s":"e"},{"v":"The exact curl request proving the SQLi","s":"t"},{"v":"Remediation deadline for each critical finding","s":"e"},{"v":"Full nmap output per subnet","s":"t"},{"v":"A prioritized list of what to fix first","s":"b"},{"v":"Proposed retest date after fixes","s":"b"},{"v":"The compromised account names and hashes","s":"t"},{"v":"One-line risk rating per finding","s":"b"}]},"ex":"Executives need <b>decisions and consequences</b>: business impact, deadlines, and the budget or risk-acceptance call. Engineers need <b>reproducibility</b>: the curl request, scan output, and any credentials used — those belong in the annex so evidence can be verified without leaking into a board paper. Elements like the prioritized fix list, retest date and per-finding risk ratings are the <b>spine of the report</b>: managers track them and engineers execute them, so both sections carry them. A report that only speaks one dialect fails one audience — the other one stops reading.","hi":["Ask: does a director act on it, does an engineer reproduce it, or both?"]},
{"t":"match","th":"C","kw":"CIS Benchmark,DISA STIG,LAPS,secure baseline,patch management,EDR","pts":5,"title":"Match each standard or tool to its job","sc":"A junior admin at FerroSteel keeps mixing up the hardening frameworks and tools in your recommendations. Build the reference table for her.","q":"Drag the description onto the standard or tool it defines.","d":{"slots":[{"id":"s1","label":"CIS Benchmarks"},{"id":"s2","label":"DISA STIGs"},{"id":"s3","label":"LAPS"},{"id":"s4","label":"A vulnerability scanner (e.g. Nessus)"},{"id":"s5","label":"OpenSCAP"}],"items":[{"v":"Community hardening baselines with two strictness levels for most platforms","s":"s1"},{"v":"US DoD configuration guidance, stricter and audit-oriented","s":"s2"},{"v":"Randomizes and rotates each Windows machine's local admin password","s":"s3"},{"v":"Finds missing patches and known CVEs across the estate","s":"s4"},{"v":"Checks a machine's live config against a baseline XML and reports drift","s":"s5"}]},"ex":"<b>CIS Benchmarks</b> are the widely used, community-maintained hardening guides (level 1 = practical, level 2 = stricter, more breakage risk). <b>DISA STIGs</b> are the US Department of Defense equivalents — stricter, commonly required in defense contexts. <b>LAPS</b> solves one narrow problem: every Windows box having the same local admin password — it rotates a unique password per machine. A <b>vulnerability scanner</b> answers 'what is missing or broken' (missing patches, known CVEs), while <b>OpenSCAP</b> answers 'does this machine match the agreed baseline' by checking live configuration against an XML profile. Scanner finds the holes; SCAP proves the hardening.","hi":["Two of them compare a machine against written rules — one scans for known flaws, one verifies config compliance."]},
{"t":"qcm","th":"B","kw":"least privilege,PAM / just-in-time access,tiered admin model","pts":3,"title":"The developer with Domain Admin rights","sc":"At BlueFin Media you find that developer Dana uses a Domain Admin account for e-mail, IDEs and everything else. The IT lead says: 'It is only one trusted person, and auditing is enabled.'","q":"Which recommendation best fixes the root cause?","d":{"ch":[{"v":"Revoke the standing Domain Admin and grant JIT elevation per task","ok":true},{"v":"Keep the Domain Admin account and alert on each of its uses"},{"v":"Move Dana to a standard local admin account on every workstation"},{"v":"Keep the account and shorten its password expiry to 15 days"}]},"ex":"Least privilege means an account holds only the rights the task needs, for only as long as the task needs them. A <b>just-in-time (JIT)</b> elevation flow with approval gives Dana admin power for a change window, then removes it — the standing Domain Admin credential, the attacker's dream target (phishing, token theft, DCSync), simply stops existing. Monitoring a full-time Domain Admin account detects abuse but leaves the standing risk in place. Local admin on every workstation spreads privilege wider, not narrower. Shorter password expiry does not reduce what a stolen session can do — and modern guidance (NIST SP 800-63B) even drops forced periodic rotation for normal accounts.","hi":["One option removes the standing privilege entirely; the others only watch it or move it."]},
{"t":"log","th":"E","kw":"DMARC / SPF / DKIM,DNS & email filtering,user awareness training","pts":4,"title":"Prove the spoofing recommendation from the mail log","sc":"Finance at Orbit Freight received an invoice-fraud e-mail that appeared to come from a real supplier. The supplier's domain is <code>partswave[.]com</code>. You pulled the receiving gateway log to build your recommendation.","q":"Select every line that shows the spoofed mail failed authentication — the evidence your DMARC recommendation cites.","d":{"lines":[{"t":"Mar 03 10:12:04 mx1 in: from=ceo@partswave[.]com ip=203[.]0[.]113[.]77 spf=fail dkim=none dmarc=fail","ok":true},{"t":"Mar 03 10:12:04 mx1 action=quarantine rule=suspicious-sender","ok":false},{"t":"Mar 03 10:14:31 mx1 in: from=orders@partswave[.]com ip=52[.]9[.]14[.]2 spf=pass dkim=pass dmarc=pass","ok":false},{"t":"Mar 03 10:20:07 mx1 in: from=billing@partswave[.]com ip=198[.]51[.]100[.]9 spf=fail dkim=none dmarc=fail","ok":true},{"t":"Mar 03 10:22:44 mx1 out: from=finance@orbitfreight[.]com to=partswave[.]com queued","ok":false},{"t":"Mar 03 10:31:12 mx1 in: from=ceo@orbitfreight-corp[.]com ip=203[.]0[.]113[.]77 spf=softfail dkim=none dmarc=fail","ok":true},{"t":"Mar 03 10:35:02 mx1 in: from=newsletter@vendor-mail[.]net ip=17[.]24[.]8[.]10 spf=pass dkim=pass dmarc=pass","ok":false},{"t":"Mar 03 10:41:55 mx1 in: from=billing@partswave[.]com ip=52[.]9[.]14[.]2 spf=pass dkim=pass dmarc=pass","ok":false}]},"ex":"Three lines carry the proof: both <code>partswave[.]com</code> entries arrive from IPs that fail <b>SPF</b> (the sending server is not authorized by the domain's DNS record), carry no <b>DKIM</b> signature, and therefore fail <b>DMARC</b> — and the look-alike domain <code>orbitfreight-corp[.]com</code> fails too, a classic impersonation pattern. The passing lines are the supplier's legitimate server. The recommendation writes itself: publish a strict DMARC policy (<code>p=reject</code>) on your own domain after a monitoring phase, deploy DNS/mail filtering that blocks look-alike domains and failed-DMARC mail, and pair it with user awareness training plus phishing simulations — because a technical filter is the seatbelt, but trained staff are the airbag.","hi":["spf=fail with dmarc=fail is the smoking gun; spf=pass lines are the legitimate server."]},
{"t":"blank","th":"B","kw":"password policy hardening,MFA,phishing-resistant MFA,secret management","pts":4,"title":"Modernize the password policy memo","sc":"FerroSteel's policy still demands '8 characters, 3 of 4 character sets, change every 60 days'. Your pentest showed the result: <code>Summer2024!</code> everywhere. Rewrite the memo with modern guidance (NIST SP 800-63B style).","q":"Fill each blank with the best phrase from the bank.","d":{"pre":"Replace complexity rules with [[1]] — length is what slows cracking, so require at least 14 characters screened against known-breach lists. Drop forced 60-day rotation: it drives predictable patterns like Summer2024!, so rotation should happen only on evidence of compromise. Ban shared and reused passwords, and put every privileged account behind [[2]] so a stolen password alone is not enough. For remote access and admin logins, move to [[3]] such as FIDO2 keys or passkeys, which phishers cannot simply harvest. Finally, service accounts must use secrets from the [[4]], never a password written in a runbook.","bank":["longer passphrases","MFA","phishing-resistant MFA","vault","complex symbol rules","90-day rotation for all users","security questions","a shared spreadsheet"],"key":["longer passphrases","MFA","phishing-resistant MFA","vault"]},"ex":"NIST 800-63B flipped password advice: <b>length beats complexity</b>, so passphrases win, and every new password should be checked against breach corpora. Forced periodic rotation produces <code>Spring2025!</code> after <code>Winter2024!</code> — predictability, not security — so rotation is reserved for evidence of compromise. <b>MFA</b> on privileged accounts makes a leaked password a dead end. <b>Phishing-resistant MFA</b> (FIDO2/passkeys) binds the login to the real site, so a fake portal cannot relay the factor — unlike SMS or push codes that attackers steal in real time. And secrets belong in a <b>vault</b> with access control and audit logs; a runbook or shared spreadsheet is just a slower data breach.","hi":["Slot 1 wants a two-word noun phrase; slot 3 is a specific subset of slot 2."]},
{"t":"branch","th":"A","kw":"compensating controls,risk acceptance,risk treatment options,change management,network segmentation / VLANs","pts":4,"title":"When the legacy system cannot be patched","sc":"Your finding: the warehouse ERP runs on an OS the vendor no longer supports, with a known remote exploit. The plant manager says re-platforming takes 14 months and any downtime stops the production line. Leadership asks you to design the risk treatment.","q":"Decide step by step. Each choice unlocks the next step.","d":{"steps":[{"q":"The vendor patch does not exist. What is the honest first treatment option to present?","ch":[{"v":"Mark the finding closed — nothing can be done"},{"v":"Present options: mitigate with compensating controls now, accept formally, transfer partially via insurance, or avoid by retiring the system"},{"v":"Tell the plant to air-gap the ERP today, no matter the cost"}],"ok":1,"fb":"Risk treatment has four honest routes: mitigate, accept, transfer, avoid. 'Close the finding' would be lying in writing. The right move is to mitigate immediately with compensating controls while a formal decision is made."},{"q":"Leadership chooses 'mitigate for now'. Which bundle actually reduces exploitability?","ch":[{"v":"Move the ERP to its own VLAN, restrict traffic with firewall rules, and put an IPS virtual patch in front of it"},{"v":"Ask staff to be careful and add the finding to a watchlist"},{"v":"Install antivirus on the ERP and call it patched"}],"ok":0,"fb":"Compensating controls lower the real risk when the primary fix is impossible: <b>segmentation</b> shrinks who can reach the host, tight <b>firewall rules</b> cut it to the minimum, and an <b>IPS virtual patch</b> blocks the known exploit signature at the network edge. Antivirus does not fix a network service exploit, and a watchlist is not a control."},{"q":"The CFO asks what to write in the risk register. What belongs there?","ch":[{"v":"'Fixed' — the ticket is going well"},{"v":"Owner, the chosen treatment, the compensating controls, a review date, and the 14-month plan to retire the system"},{"v":"Nothing — risk registers are for auditors only"}],"ok":1,"fb":"An accepted or mitigated risk needs a named owner, the exact compensating controls, a review/expiry date and the path to the real fix. That is what turns 'we know about it' into governance an auditor can verify — and it expires: an acceptance without a date is a lie with a signature."},{"q":"Six months later the plant proposes moving the ERP between datacenters 'temporarily' onto the flat network. What is your recommendation?","ch":[{"v":"Approve it — the risk register already has an entry"},{"v":"Reject the change in its current form; the compensating controls must move with the system and the risk owner re-approves"},{"v":"Approve it but ask them to be careful"}],"ok":1,"fb":"Compensating controls are attached to the system's context. Moving it back onto a flat network silently deletes the segmentation and IPS controls while the paperwork still says 'mitigated'. Change management exists exactly for this: the risk owner re-evaluates before the move, not after the incident."}]},"ex":"When the primary fix is impossible, the professional answer is a <b>compensating control bundle</b> (segment, restrict, virtual-patch), a <b>formal risk acceptance</b> with owner, expiry and review date, and the long-term plan to retire the system. Treatments are a choice of mitigate / accept / transfer / avoid — never 'ignore'. And controls live and die with the system's environment: any change that removes them reopens the risk and must go through change management.","hi":["Step 2: think segmentation, minimum firewall rules, and IPS signatures — not endpoint tools."]},
{"t":"drag","th":"D","kw":"SIEM / centralized logging,detection coverage,EDR,IR playbook","pts":5,"title":"Map each log source to the detection it unlocks","sc":"Cobalt Chain's SIEM currently ingests only firewall logs. The client will pay for exactly three more log sources this quarter and asks which onboarding gives which detection power. Build the mapping for the recommendation.","q":"Drag each log source onto the attack it lets you detect.","d":{"slots":[{"id":"s1","label":"Lateral movement to other hosts"},{"id":"s2","label":"Malicious PowerShell on endpoints"},{"id":"s3","label":"Stolen credentials used on the VPN"},{"id":"s4","label":"SQL injection attempts against the web app"},{"id":"s5","label":"C2 callback domains resolved by hosts"}],"items":[{"v":"Windows Security event logs (4624/4648 logons across hosts)","s":"s1"},{"v":"PowerShell Operational logs (4104 script blocks)","s":"s2"},{"v":"VPN gateway authentication logs with geo data","s":"s3"},{"v":"Web server / WAF request logs with query strings","s":"s4"},{"v":"DNS resolver query logs","s":"s5"}]},"ex":"Each source answers one question. <b>Windows logon events</b> across hosts show an account hopping between machines — the fingerprint of lateral movement after a foothold. <b>PowerShell script-block logging (4104)</b> records the actual commands, so obfuscated downloaders and credential dumpers stop being invisible. <b>VPN auth logs</b> reveal one account signing in from two countries in an hour — stolen credentials in use. <b>Web/WAF request logs</b> carry the <code>UNION SELECT</code> and <code>' OR 1=1</code> payloads that mark SQL injection probing. <b>DNS query logs</b> expose hosts asking for known-bad or freshly registered domains — the beacon before the breach. The recommendation: onboard all five; if only three fit the budget, prioritize lateral movement, PowerShell and DNS, because they see the attacker after any prevention fails.","hi":["Think about where each attack leaves its trace: endpoints, the network, or the gateway."]},
{"t":"order","th":"D","kw":"containment workflow,offline backups,IR playbook,patch management,retest / fix validation,change management","pts":6,"title":"Order the ransomware response and hardening steps","sc":"During a tabletop at Harbor Logistics the team froze: nobody agreed on what comes after 'we are encrypted'. The drill report asks you to write the canonical sequence for the IR plan and the follow-up hardening work.","q":"Drag the steps into the correct order (first on top).","d":{"items":["Isolate affected hosts from the network to stop the spread","Preserve forensic evidence (memory, logs) before wiping anything","Eradicate the attacker (remove persistence, rebuild or clean hosts)","Restore data from tested offline backups","Patch the root cause that let the attacker in","Retest the environment and run a lessons-learned review to update the playbooks"]},"ex":"Containment comes first: <b>isolate</b> before the encryption spreads to the file servers you have not lost yet. <b>Evidence before wiping</b> — memory and logs answer 'how did they get in and what did they touch'; destroying it blinds both the investigation and the hardening plan. Only then <b>eradicate</b> (persistence removal, clean rebuilds), then <b>restore from offline backups</b> — offline or immutable copies are the one thing ransomware cannot encrypt, which is why their tested existence is a recommendation in every report. <b>Patch the root cause</b> so the same door is closed, and finish with a <b>retest and lessons-learned</b> that updates the IR playbook — an incident you do not learn from is an incident you will repeat.","hi":["Two steps must happen before any reboot or rebuild: stopping the spread and keeping proof."]},
{"t":"qcm","th":"E","kw":"parameterized queries,input validation,WAF / virtual patching,output encoding / CSP","pts":3,"title":"The right fix for the login-form SQLi","sc":"Your report documents SQL injection in the login form of Ironclad Insurance's customer portal: <code>admin'--</code> in the username field logs you in as any user. The dev lead proposes four options and asks which one the report should recommend.","q":"Which recommendation fixes the vulnerability at the root?","d":{"ch":[{"v":"Rebuild the query with parameterized prepared statements","ok":true},{"v":"Block quotes and dashes with a WAF rule in front of it"},{"v":"Strip special characters from input before queries run"},{"v":"Hide the database error messages from every response"}]},"ex":"SQL injection exists because user input is concatenated into code. <b>Parameterized queries</b> separate code from data permanently — the driver sends the query shape and the values separately, so input can never change the query's meaning. That kills the bug class everywhere it is applied. A <b>WAF rule</b> is a virtual patch: useful as a stopgap while the code fix ships, but bypassable (encoding tricks, comment forms) and it protects one door. <b>Stripping characters</b> breaks legitimate data (O'Brien, dates with dashes) and still leaks holes. <b>Hiding errors</b> removes information for the attacker but changes nothing about exploitability. The professional recommendation: parameterize the query, add input validation and output encoding as defense in depth, and use the WAF only as the temporary bandage — clearly labeled as one.","hi":["Three options treat the symptom; one changes how the query is built."]},
{"t":"spot","th":"B","kw":"least privilege,password policy hardening,default credentials,secure baseline","pts":3,"title":"Spot the policy violations in the server checklist","sc":"The Windows server build checklist at FerroSteel claims to be CIS-aligned. Before you sign the recommendation, review the audit export below.","q":"Click the THREE lines that violate the hardened baseline.","d":{"lines":[{"t":"Local Administrator account: renamed to 'svc_locadm'","ok":false},{"t":"Local Administrator password: 'F3rr0St33l!' identical on all 42 servers","ok":true},{"t":"Guest account: Enabled","ok":true},{"t":"Account lockout threshold: 5 invalid attempts","ok":false},{"t":"Minimum password length: 8 characters, complexity on","ok":false},{"t":"RDP: restricted to mgmt VLAN via firewall, NLA required","ok":false},{"t":"Windows Firewall: domain profile ON","ok":false},{"t":"SMBv1 client and server: installed","ok":true},{"t":"BitLocker: enabled on data volumes","ok":false},{"t":"Windows Update: automatic, deferral 7 days","ok":false}]},"ex":"The three violations each carry a known attack path. An <b>identical local admin password</b> on all 42 servers means one dumped hash reuses everywhere (pass-the-hash) — the fix is LAPS or equivalent per-host rotation. An <b>enabled Guest account</b> is an anonymous, unattributable way in — baseline says disabled. <b>SMBv1 installed</b> keeps the wormable protocol alive for no reason on a modern build — remove the feature. The decoys are correct hardening: renamed admin (good hygiene even though renaming is cosmetic), lockout at 5, RDP gated by VLAN and NLA, firewall on, BitLocker protecting data at rest, and patched OS with short deferral.","hi":["One password should be different on every machine. One account should not exist at all. One protocol is 30 years past retirement."]},
{"t":"multi","th":"D","kw":"tabletop exercise,IR playbook,containment workflow,log retention,detection coverage","pts":3,"title":"Pick the changes that improve incident response","sc":"After a simulation, the IT director at Cobalt Chain has budget for exactly three improvements this quarter. He asks: 'Which of these actually make us respond better — not just prevent more?'","q":"Select the THREE options that improve incident response readiness.","d":{"n":3,"ch":[{"v":"Add an out-of-hours contact tree and a decision log template to the IR plan","ok":true},{"v":"Add a written containment step: who isolates a host and how, within 15 minutes","ok":true},{"v":"Extend central log retention from 7 to 90 days for the security sources","ok":true},{"v":"Enforce a 14-character minimum password for all users on every domain account","ok":false},{"v":"Enforce full-disk encryption with BitLocker on every laptop drive in the estate","ok":false},{"v":"Add a second redundant firewall in front of the DMZ for extra availability","ok":false}]},"ex":"Response readiness is about <b>speed and clarity during the incident</b>: an out-of-hours contact tree means the right people are woken at 03:00, a decision log keeps regulators and lawyers fed with facts, a written <b>containment step</b> removes the 'who is allowed to pull the cable' hesitation that costs hours, and 90-day <b>log retention</b> lets you investigate an intrusion discovered weeks after it started (7 days is an amnesia policy). The others are <b>prevention</b>: a longer password policy and full-disk encryption reduce compromises but change nothing about how fast you detect or respond, and a redundant firewall adds availability, not response capability. When a client asks for 'resilience', separate the preventive budget from the detective and corrective budget — the exam answer and the real answer agree: response lives in playbooks, people and evidence.","hi":["Ask of each option: does it help during the incident, or only before it?"]},
{"t":"log","th":"E","kw":"parameterized queries,input validation,WAF / virtual patching,secure SDLC / code review","pts":4,"title":"Find the successful injections in the access log","sc":"The web team at Ironclad Insurance doubts the SQLi finding: 'The WAF would have blocked it.' You exported the portal access log around the test window. Your source IP during testing was 10[.]44[.]2[.]187.","q":"Select every line from your test IP that shows a SUCCESSFUL injection (the server answered 200 with data, not a WAF block).","d":{"lines":[{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:14:02] \"GET /login?u=admin'-- HTTP/1.1\" 200 8341","ok":true},{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:14:09] \"GET /login?u=x' UNION SELECT card_no,1,1 FROM cards-- HTTP/1.1\" 200 18742","ok":true},{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:14:15] \"GET /login?u=x' UNION SELECT pwd,1,1 FROM users-- HTTP/1.1\" 403 291","ok":false},{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:14:22] \"GET /search?q=laptop HTTP/1.1\" 200 4022","ok":false},{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:14:30] \"GET /login?u=admin%27-- HTTP/1.1\" 200 8341","ok":true},{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:14:41] \"GET /api/v2/orders?id=1 HTTP/1.1\" 200 1553","ok":false},{"t":"41[.]22[.]9[.]140 - - [11/Mar/09:15:03] \"GET /login?u=x'-- HTTP/1.1\" 403 291","ok":false},{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:15:18] \"GET /login?u=x' OR '1'='1 HTTP/1.1\" 200 12088","ok":true},{"t":"10[.]44[.]2[.]187 - - [11/Mar/09:15:25] \"GET /logout HTTP/1.1\" 302 0","ok":false}]},"ex":"Five injection lines were sent, but only four <b>succeeded</b>: the UNION SELECT that returned 200 with an 18 KB body (the card table coming back), the URL-encoded <code>%27</code> variant (proves the WAF misses trivial encoding, so its protection is unreliable), the plain <code>admin'--</code> bypass (8 KB back), and <code>' OR '1'='1</code> returning 12 KB (the whole user set). The 403 lines prove the WAF caught the <b>naive, unencoded</b> payloads only — which is exactly why a WAF is a virtual patch, not a fix. The recommendation stands: parameterized queries and input validation in the code, plus a code review of every query built from user input; keep the WAF as the temporary shield and note in the report which payloads it missed.","hi":["Status 200 with an unusually large response body means data came back. 403 means the WAF ate it."]},
{"t":"rank","th":"A","kw":"risk-based prioritization,business impact,input validation,output encoding / CSP,CSRF tokens","pts":5,"title":"Rank the web findings for the development team","sc":"Your web assessment of Ironclad Insurance's portal produced five confirmed findings. Context: the portal is internet-facing and holds payment data; the dev team can ship one fix per sprint.","q":"Rank from most urgent to fix first (top) to least urgent (bottom).","d":{"items":["A · SQL injection in the login form — unauthenticated database read","B · Stored XSS in the claims chat — runs in every agent's session","C · Missing CSRF token on the 'change bank details' action","D · Missing Content-Security-Policy and security headers","E · Verbose stack traces on error pages leaking framework versions"]},"ex":"1) <b>A</b> — unauthenticated SQLi with direct database read is the crown jewel for any attacker; it jumps the queue. 2) <b>C</b> — no CSRF token on 'change bank details' means one crafted link or page silently redirects a customer's payouts; money moves, full stop. 3) <b>B</b> — stored XSS in the chat executes in <b>staff</b> sessions on every load — session theft and actions-as-agent are one paste away; it needs no credentials for the attacker beyond one poisoned message. 4) <b>D</b> — CSP is a strong safety net that would have blunted B, so it ships right after, but on its own it is hardening, not an open wound. 5) <b>E</b> — stack traces are information disclosure: they speed up attacker recon but do not compromise anything by themselves. Exposure, money impact and authentication requirements — in that order — sort the queue.","hi":["Two findings move money. One needs no victim beyond visiting a page. One only helps reconnaissance."]},
{"t":"term","th":"B","kw":"stale account cleanup,least privilege,secure baseline","pts":3,"title":"Find the accounts with empty password hashes","sc":"You are auditing <code>srv-core01</code> before writing the account-hygiene recommendation. The file <code>/etc/shadow</code> (root-readable, you have sudo) holds one entry per account; the second colon-separated field is the password hash. An <b>empty</b> second field means the account can log in with no password at all.","q":"Use <code>awk</code> to print the usernames of every account whose password field is empty in <code>/etc/shadow</code>.","d":{"title":"analyst@srv-core01: ~ — bash","prompt":"analyst@srv-core01:~$ ","intro":["Task: list accounts with an EMPTY password field in /etc/shadow.","Use awk. Hint: the field separator is ':' and the password hash is field 2 ($2).","Expected output shape (one username per line):","  backupsvc","  testuser"],"help":"Family reminder: awk with -F: and a condition on $2. Empty means $2 == \"\" — print $1 when it matches.","goals":[{"all":["awk","\\$2\\s*(==\\s*(['\"])\\2|~\\s*/\\^\\$/)","shadow"],"demo":"sudo awk -F: '($2==\"\"){print $1}' /etc/shadow"}]},"ex":"<code>sudo awk -F: '($2==\"\"){print $1}' /etc/shadow</code> lists every passwordless account. <code>-F:</code> splits each line at colons, <code>$2</code> is the hash field, and an empty match means the account authenticates with just a username — on any reachable service. These accounts are exactly what a recommendation is for: lock or remove them (<code>passwd -l</code>, disable the service, or delete if unused), and fold the check into the hardening baseline so a new passwordless account trips the compliance scan. Empty-hash accounts are also why 'default credentials' keeps appearing in reports: the credential is nothing at all.","hi":["awk -F: '($2==\"\"){print $1}' — run it with sudo against /etc/shadow."]},
{"t":"drag","th":"A","kw":"remediation timeline,patch management,firewall rule cleanup,cloud security groups,MFA,application allowlisting,log retention,CIS Benchmark,user awareness training,phishing simulation,encryption at rest,unnecessary services","pts":9,"title":"Build the 30/60/90-day remediation roadmap","sc":"FerroSteel accepted all ten findings. The CISO asks you to turn them into a roadmap the board can track: what ships <b>this week</b> (exposure is live), what lands within <b>30 days</b> (standard project work), and what is a <b>90-day</b> program (culture or architecture).","q":"Drag each action into the right time bucket.","d":{"slots":[{"id":"w","label":"This week (live exposure)"},{"id":"d30","label":"Within 30 days"},{"id":"d90","label":"90-day program"}],"items":[{"v":"Disable the exposed Telnet service on the legacy switch","s":"w"},{"v":"Delete the 0[.]0[.]0[.]0/0 ingress rule on the cloud security group","s":"w"},{"v":"Patch the RCE on the internet-facing gateway","s":"w"},{"v":"Roll out MFA on the VPN for all users","s":"d30"},{"v":"Deploy application allowlisting on the terminal servers","s":"d30"},{"v":"Extend security log retention from 7 to 90 days","s":"d30"},{"v":"Roll the CIS Benchmark program across all 200 servers","s":"d90"},{"v":"Launch the awareness program with monthly phishing simulations","s":"d90"},{"v":"Encrypt customer data at rest in the analytics cluster","s":"d90"}]},"ex":"The sorting rule is <b>live exposure first</b>: an exposed Telnet service, an any-any cloud security group and an internet-facing RCE are all 'fix today' items — minutes of work or a short patch window versus attackers' hours. The 30-day bucket is standard engineering with normal change windows: MFA rollout, application allowlisting (which needs testing or users riot), and log retention expansion — important, but none is exploitable this afternoon. The 90-day bucket changes culture or architecture: CIS baselines across 200 servers, awareness training with phishing simulations, and encryption at rest are programs with owners, phases and budget, not tickets. Every bucket still needs an owner and a date — a roadmap without them is a wish list.","hi":["Ask: can this be exploited before the next change-control board meets? If yes — this week."]},
{"t":"qcm","th":"D","kw":"SIEM / centralized logging,detection coverage,log retention","pts":3,"title":"Which log source goes into the SIEM first?","sc":"Cobalt Chain can onboard exactly ONE more log source this month. Current sources: perimeter firewall. Options on the table from your recommendation draft.","q":"Which source gives the broadest improvement in detection for an internal-attack scenario?","d":{"ch":[{"v":"Domain controller security event logs (logons, Kerberos)","ok":true},{"v":"Print usage logs from the marketing department’s printers"},{"v":"A second copy of the firewall logs already ingested"},{"v":"The office door-badge system’s physical access logs"}]},"ex":"Almost every internal attack — password spraying, pass-the-hash, DCSync, lateral movement — walks across a <b>domain controller</b> to authenticate. Onboarding DC security logs turns your SIEM from a perimeter camera into an interior motion sensor: impossible-travel logons, spraying patterns, privileged-account anomalies all become visible. Duplicating firewall logs adds storage, not coverage; printers and door badges answer narrow physical questions and belong much later in a detection roadmap. When budget forces a choice, recommend the source that <b>most attack paths cross</b> — for an internal-attack scenario that is authentication data, full stop.","hi":["What single system does every internal attacker have to talk to?"]},
{"t":"match","th":"E","kw":"parameterized queries,output encoding / CSP,CSRF tokens,input validation,WAF / virtual patching","pts":5,"title":"Pair each web finding with its code-level fix","sc":"The dev team at Ironclad Insurance asks for a one-page mapping so each squad can fix its own findings. Match the vulnerability class to the fix that removes it at the root.","q":"Drag the fix onto the finding it addresses.","d":{"slots":[{"id":"s1","label":"SQL injection"},{"id":"s2","label":"Reflected XSS"},{"id":"s3","label":"Cross-Site Request Forgery on money transfers"},{"id":"s4","label":"Open redirect on /goto?url="},{"id":"s5","label":"Clickjacking on the claims page"}],"items":[{"v":"Parameterized queries / prepared statements","s":"s1"},{"v":"Output encoding plus a Content-Security-Policy","s":"s2"},{"v":"Per-session anti-forgery tokens (and SameSite cookies)","s":"s3"},{"v":"Allow-list of permitted redirect targets","s":"s4"},{"v":"X-Frame-Options / frame-ancestors directive","s":"s5"}]},"ex":"Each class dies to one specific control. <b>SQLi</b>: parameterized queries keep user data out of the code channel. <b>XSS</b>: output encoding (context-aware: HTML, attribute, JS) plus CSP as the net that catches what encoding missed. <b>CSRF</b>: anti-forgery tokens bound to the session and SameSite cookies make the attacker's cross-site POST carry no valid token. <b>Open redirect</b>: never trust <code>url=</code> — allow only entries from a fixed list, so phishing links cannot dress up as your domain. <b>Clickjacking</b>: frame-ancestors / X-Frame-Options forbids other sites from embedding your page under an invisible button. A WAF may blunt several of these temporarily, but the recommendation section should point each squad at the code-level fix — the WAF line belongs in the 'until then' paragraph.","hi":["Two fixes are HTTP response headers; the other three change how input, state or redirects are handled."]},
{"t":"blank","th":"C","kw":"SSH hardening,secure baseline,unnecessary services,encryption in transit","pts":4,"title":"Complete the sshd hardening snippet","sc":"Your finding for <code>srv-core01</code>: SSH allows root logins with passwords, and the draft recommendation includes a config snippet the admin will paste. Fill the missing directives.","q":"Fill each blank with the correct sshd_config directive value from the bank.","d":{"pre":"# /etc/ssh/sshd_config — hardened baseline\nPermitRootLogin [[1]]\nPasswordAuthentication [[2]]\nMaxAuthTries [[3]]\nAllowUsers deploy admin\n# Keys only, least exposure, and the banner is set\n\nAfter editing, validate with sshd -t and reload the service.","bank":["no","no","3","yes","prohibit-password","20","0"],"key":["no","no","3"]},"ex":"<code>PermitRootLogin no</code> removes the single most brute-forced account from the network entirely — admins use their named accounts and elevate with sudo, which also restores <b>accountability</b> (you know WHO ran sudo, not just that root did). <code>PasswordAuthentication no</code> forces key-based authentication: passwords can be guessed, sprayed and phished; a 4096-bit key cannot be typed into a phishing page. <code>MaxAuthTries 3</code> throttles brute-force noise (the default 10 is generous for attackers). The slot that tempts many people, <code>prohibit-password</code>, is actually a valid middle ground for root — but the hardened baseline and this recommendation ask for plain <code>no</code>: named accounts and sudo give you the audit trail that root logins destroy.","hi":["Both root and password logins should end in the same three-letter word."]},
{"t":"branch","th":"B","kw":"unquoted service path,LAPS,tiered admin model,Credential Guard,pass-the-hash,DCSync,least privilege","pts":4,"title":"Red team found the keys — what do you tell blue to fix first?","sc":"DUAL PERSPECTIVE. You are the pentester. Your path: an <b>unquoted service path</b> on a workstation let you plant a privileged service; the machine reused the <b>shared local admin password</b>, so you dumped hashes with Mimikatz and hopped to 12 more hosts; a Domain Admin logged into one of them, and you grabbed the domain database (DCSync). The debrief: which fixes kill this chain at each link?","q":"Choose the strongest fix per link. Each answer unlocks the next step.","d":{"steps":[{"q":"Link 1 — the unquoted service path escalation. Best permanent fix?","ch":[{"v":"Reinstall the service with a quoted path and fix the ACLs on its folder"},{"v":"Hide the service from enumeration"},{"v":"Restart the server weekly"}],"ok":0,"fb":"A quoted path (and admin-only write on the service folder) removes the hijack primitive itself. Hiding the service changes nothing — the attacker already has the query output — and restarts are not controls."},{"q":"Link 2 — the same local admin password on 12+ hosts made lateral movement free. Fix?","ch":[{"v":"Deploy LAPS so every host rotates a unique local admin password"},{"v":"Change the password and tell staff not to share it again"},{"v":"Block Mimikatz in the antivirus exclusions"}],"ok":0,"fb":"LAPS attacks the property that made the reuse valuable: one password, twelve doors. Unique rotating per-host passwords make the dumped hash worthless elsewhere. 'Don't share it' is a wish, and blocking one tool is whack-a-mole — the technique survives every new binary name."},{"q":"Link 3 — Mimikatz read lsass from memory on user workstations. Which control makes that materially harder?","ch":[{"v":"Enable Credential Guard / LSA protection and remove admin rights from daily-use accounts"},{"v":"Encrypt the hard disks with BitLocker"},{"v":"Move lsass to a different port"}],"ok":0,"fb":"Credential Guard isolates secrets in a virtualization-based container, and removing local admin stops the process-access game entirely — without local admin, most dumpers cannot even open lsass. BitLocker protects data at rest (stolen disk), not live memory; lsass has no 'port'. The deeper fix is the tiered admin model: no privileged account ever logs into a workstation where user malware runs."},{"q":"Link 4 — a Domain Admin logged in where you had a foothold, enabling DCSync. Fix?","ch":[{"v":"Enforce the tiered admin model: tier-0 accounts log in only on hardened PAWs, never on user machines"},{"v":"Change the Domain Admin password more often"},{"v":"Firewall the domain controllers from everything"}],"ok":0,"fb":"DCSync worked because a tier-0 credential presented itself to a compromised host. The tiered admin model with dedicated privileged access workstations (PAWs) breaks that habit structurally: the crown-jewel credentials never touch the machines attackers reach first. Password changes do not help — the dump re-harvests on the next login, and DCs must stay reachable by definition."}]},"ex":"The chain — unquoted path → shared local admin → lsass dump → tier-0 login → DCSync — is the canonical Active Directory kill path, and each link has a structural fix: quote service paths, deploy <b>LAPS</b>, enable <b>Credential Guard</b> plus least privilege on endpoints, and enforce <b>tiered administration</b> with PAWs. Recommendations that name the link they break are the ones that survive the budget meeting; 'change the passwords' does not survive contact with the same attack next quarter.","hi":["Each step's answer removes a structural property, not a symptom. The last one is about WHERE tier-0 accounts may log in."]},
{"t":"drag","th":"E","kw":"report audiences,executive summary,secret management,secure SDLC / code review,retest / fix validation,risk acceptance","pts":6,"title":"Assemble the report — what belongs where?","sc":"You are assembling the final deliverable for the Vantage Rail engagement. Some material belongs in the main <b>Recommendations section</b>, some in the <b>Evidence annex</b>, and some must <b>not be in the report at all</b> (handled out-of-band).","q":"Drag each item to where it belongs.","d":{"slots":[{"id":"rec","label":"Recommendations section"},{"id":"ev","label":"Evidence annex"},{"id":"no","label":"Not in the report"}],"items":[{"v":"Prioritized remediation list with owners and dates","s":"rec"},{"v":"Screenshot showing the escalated shell","s":"ev"},{"v":"Add a secure code review gate before releases","s":"rec"},{"v":"Move CI/CD secrets into a vault with rotation","s":"rec"},{"v":"Full password list captured during testing","s":"no"},{"v":"Proposed retest window after remediation","s":"rec"},{"v":"Raw scan XML exports","s":"ev"},{"v":"Risk-acceptance wording for the deferred finding","s":"rec"}]},"ex":"The <b>recommendations section</b> is the action plan: prioritized fixes with owners and dates, structural improvements like a code-review gate or vaulted CI/CD secrets, the retest window, and the formal wording for anything leadership accepts instead of fixes. The <b>evidence annex</b> carries the proof a reviewer needs to reproduce or trust each finding — screenshots, raw exports — without the narrative. Captured <b>passwords and secrets never go into the report at all</b>: reports are e-mailed, printed, archived and read by many people; the credentials go into the engagement vault and are rotated at handover. Mixing these up either buries the action plan in noise or, far worse, ships a working credential list to everyone who ever opens the PDF.","hi":["Evidence proves; recommendations direct. And one bucket protects the client from the report itself."]},
{"t":"log","th":"B","kw":"Credential Guard,least privilege,tiered admin model,detection coverage","pts":4,"title":"Prove the credential-dumping attempt from the EDR feed","sc":"The SOC at Harbor Logistics dismissed an EDR alert as 'AV noise'. You review the raw EDR events for WKS-114 before writing the recommendation that hardens credential theft paths.","q":"Select the lines that show a credential-dumping attempt against lsass.","d":{"lines":[{"t":"09:41:02 WKS-114 proc: C:\\Windows\\System32\\svchost.exe -k netsvcs (signed) started","ok":false},{"t":"09:42:17 WKS-114 proc: C:\\Users\\jvilla\\AppData\\Local\\Temp\\rundll32.exe (unsigned) started","ok":false},{"t":"09:42:19 WKS-114 handle: PID 4412 opened lsass.exe access 0x1010 (PROCESS_QUERY_INFORMATION|PROCESS_VM_READ)","ok":true},{"t":"09:42:19 WKS-114 mod: PID 4412 loaded comsvcs.dll","ok":true},{"t":"09:42:20 WKS-114 file: MiniDump written to C:\\Users\\jvilla\\AppData\\Local\\Temp\\out.dmp","ok":true},{"t":"09:43:01 WKS-114 net: SMB2 session to 10[.]20[.]8[.]11 as CORP\\jvilla","ok":false},{"t":"09:44:12 WKS-114 proc: chrome.exe started (signed)","ok":false},{"t":"09:47:38 WKS-114 alert: schedule task 'OneDriveSync' created by PID 4412","ok":false},{"t":"09:52:05 WKS-114 handle: PID 999 opened lsass.exe access 0x1410 by C:\\Windows\\System32\\wmiprvse.exe (signed, WMI provider)","ok":true},{"t":"09:52:06 WKS-114 net: DNS query agostriloba[.]net resolved 185[.]199[.]110[.]153","ok":false}]},"ex":"The giveaway is a process opening <code>lsass.exe</code> with <b>PROCESS_VM_READ (0x1010)</b> — nothing legitimate reads lsass memory; that is where Windows caches credentials. The loaded <b>comsvcs.dll</b> plus the written <b>MiniDump</b> complete the classic <code>rundll32 comsvcs.dll MiniDump</code> dumping chain, and the unsigned rundll32 in Temp is the attacker's loader. The second lsass handle via WMI shows a second, quieter technique — both belong in the evidence. The recommendations these lines justify: enable <b>Credential Guard / LSA protection</b> so lsass memory is off-limits, remove local admin from daily-use accounts (least privilege — the dumper needed it), and enforce the <b>tiered admin model</b> so dumped workstation credentials cannot reach tier-0. The browser, svchost and SMB lines are normal noise; the unsigned Temp binary is context, the lsass handles are the finding.","hi":["Look for handles to lsass.exe and what module was loaded right before the dump file appeared."]},
{"t":"qcm","th":"B","kw":"MFA,phishing-resistant MFA,least privilege","pts":3,"title":"VPN has MFA — so why did the attacker get in?","sc":"Harbor Logistics enabled MFA (push approval) on the VPN six months ago. Your incident review shows the attacker logged into the VPN with jvilla's credentials anyway, approved the push from the user's own phone at 02:58, and moved laterally.","q":"Which recommendation best addresses the root cause going forward?","d":{"ch":[{"v":"Move VPN MFA to phishing-resistant factors with number matching","ok":true},{"v":"Force a 12-character password minimum for all VPN users"},{"v":"Disable MFA on the VPN so users stop approving blindly"},{"v":"Send push approvals only during business hours (08:00-18:00)"}]},"ex":"The failure was <b>MFA fatigue</b>: an attacker who already has the password spams push prompts until the asleep user taps 'Approve'. The fix is a factor the phisher cannot relay or harass through: <b>FIDO2/passkeys</b> cryptographically bind the login to the genuine site, and number matching makes a blind tap useless (the user must type the number shown on the VPN screen). A longer password does nothing — the password was already stolen. Disabling MFA removes the only thing that made the attacker need a trick in the first place. Business-hours push still trains users to approve on autopilot and the attack just moves to 08:58. When a control is technically 'on' but defeats itself in practice, the recommendation must upgrade the control, not the policy document.","hi":["The user approved it themselves — so which factor cannot be approved by a tired tap?"]}
];
