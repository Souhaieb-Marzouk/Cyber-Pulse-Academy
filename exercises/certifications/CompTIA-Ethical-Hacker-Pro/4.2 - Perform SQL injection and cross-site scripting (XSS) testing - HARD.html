question:"Select every technique that plausibly survives this naive filter without changing what the database executes.",

hintTxt:"The WAF sees the raw request; the database sees the decoded result. Anything that survives decoding while looking different wins.",
expl:"<b>Double encoding</b> (%2527 → %27 → ') defeats filters that decode once. <b>Inline comments</b> and <b>case variation</b> split keywords the signature matches. <b>Version comments</b> /*!50000*/ are executed by modern MySQL but invisible to regexes. ROT13 or Base64 just produce garbage the database rejects — the server never decodes them; padding and duplicates change nothing. Evasion tests the filter, but the real fix is still parameterized queries."},

var state=null,fired=false,interval=null;
function freshState(){
  return {order:shuf(EX.map(function(e,i){return i})),cur:0,started:false,finished:false,
    manualPause:false,checkPause:false,left:EX.length*SEC_PER_Q,
    st:EX.map(function(){return {checked:false,skipped:false,hints:0,earned:null,ans:null,rt:null,steps:0}})};
}
function exAt(n){return EX[state.order[n]]}
function stAt(n){return state.st[state.order[n]]}
function totalSec(){return EX.length*SEC_PER_Q}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r}
function tick(){
  if(!state||!state.started||state.finished)return;
  if(state.manualPause||state.checkPause)return;
  state.left--;
  if(state.left<=0){state.left=0;drawTime();endByTimer();return}
  drawTime();
}
function drawTime(){$("#timeTxt").textContent=fmt(state.left)}
function setPauseBadges(){
  $("#pauseBadge").classList.toggle("on",state.manualPause);
  $("#reviewBadge").classList.toggle("on",state.checkPause);
  $("#pauseBtn").textContent=state.manualPause?"▶ Resume":"⏸ Pause";
  var q=$("#quiz");
  if(state.manualPause){q.classList.add("blurred");$("#pauseVeil").classList.add("on")}
  else{q.classList.remove("blurred");$("#pauseVeil").classList.remove("on")}
}
function togglePause(){
  if(!state.started||state.finished)return;
  state.manualPause=!state.manualPause;setPauseBadges();
}
function liveScore(){
  var e=0,c=0;
  for(var i=0;i<EX.length;i++){var s=state.st[i];if(s.checked&&!s.skipped){e+=s.earned||0;c++}}
  $("#scoreChip").innerHTML="Points: <b>"+(Math.round(e*10)/10)+"</b> · answered "+c+"/"+EX.length;
}
function drawProgress(){
  var done=0;for(var i=0;i<EX.length;i++){var s=state.st[i];if(s.checked||s.skipped)done++}
  var pc=Math.round(done/EX.length*100);
  $("#pbar>i").style.width=pc+"%";$("#pbar").setAttribute("aria-valuenow",pc);
  var per={};for(var t in THEMES)per[t]={d:0,n:0};
  EX.forEach(function(e,i){per[e.theme].n++;var s=state.st[i];if(s.checked||s.skipped)per[e.theme].d++});
  var h="";for(var t in THEMES)h+='<span class="t">'+THEMES[t]+" <b>"+per[t].d+"/"+per[t].n+"</b></span>";
  $("#themes").innerHTML=h;
}
function drawNav(){
  var g=$("#navgrid");g.innerHTML="";
  state.order.forEach(function(ei,n){
    var s=state.st[ei];var b=document.createElement("button");
    b.textContent=n+1;
    var cls="";if(n===state.cur)cls="cur";
    if(s.skipped)cls+=" skip";
    else if(s.checked){var r=s.earned/EX[ei].points;cls+= r>=0.999?" done": r>0?" part":" zero"}
    b.className=cls.trim();
    b.setAttribute("aria-label","Go to question "+(n+1)+(s.skipped?" (skipped)":s.checked?" (checked)":""));
    b.addEventListener("click",function(){goTo(n)});
    g.appendChild(b);
  });
}
function goTo(n){
  if(!state.started||state.finished)return;
  if(n===state.cur&&$("#exhost").children.length)return;
  if(state.checkPause)state.checkPause=false;
  state.cur=n;setPauseBadges();renderEx();
}
function next(){
  if(!state.started||state.finished)return;
  if(state.checkPause)state.checkPause=false;
  if(state.cur>=EX.length-1){askFinish();return}
  state.cur++;setPauseBadges();renderEx();
}

function startExam(){
  state=freshState();fired=false;
  $("#intro").hidden=true;$("#results").hidden=true;$("#quiz").hidden=false;
  $("#pauseVeil").classList.remove("on");
  state.started=true;state.manualPause=false;state.checkPause=false;
  drawTime();setPauseBadges();drawProgress();drawNav();liveScore();renderEx();
  $("#quiz").scrollIntoView({block:"start"});
}
function buildRt(ex){
  var rt={};
  if(ex.type==="mc"||ex.type==="multi"){rt.choices=shuf(ex.choices.map(function(c,i){return {t:c,ok:ex.correct.indexOf(i)>=0}}))}
  else if(ex.type==="sort"){rt.items=shuf(ex.items.map(function(it,i){return {t:it.t,b:it.b,id:i}}));rt.place={};rt.items.forEach(function(it){rt.place[it.id]=-1})}
  else if(ex.type==="order"){rt.seq=shuf(ex.steps.map(function(s,i){return i}))}
  else if(ex.type==="match"){rt.rights=shuf(ex.pairs.map(function(p){return p.r}))}
  else if(ex.type==="fill"){rt.bank=shuf(ex.bank.slice());rt.filled={};rt.sel=null}
  else if(ex.type==="terminal"){rt.hist=[]}
  else if(ex.type==="logq"){rt.sel={}}
  else if(ex.type==="spot"){rt.sel={}}
  else if(ex.type==="branch"){rt.locked={}}
  return rt;
}
function tag(t,cls,html){return '<'+t+(cls?' class="'+cls+'"':'')+'>'+html+'</'+t+'>'}
function blockHead(){return ""}
function renderEx(){
  var n=state.cur,ex=exAt(n),st=stAt(n);

  if(st.ans===null||st.ans===undefined){st.ans=initAns(ex,st)}
  var h='<div class="card" id="excard">';
  h+='<div class="exhead"><span class="tno">Q'+(n+1)+" / "+EX.length+'</span><span class="tth">'+THEMES[ex.theme]+"</span><span class=\"tps\">"+ex.points+" pts · "+typeLabel(ex.type)+(st.skipped?' <span class="pill skip">SKIPPED — not counted</span>':"")+"</span></div>";
  h+='<div class="scenario"><span class="label sc">🗂 SCENARIO</span><br>'+ex.scenario+"</div>";
  if(ex.artefact)h+='<div class="artefact"><h4>'+ex.artTitle+"</h4>"+ex.artefact+"</div>";
  h+='<div class="question"><span class="label qz">❓ QUESTION</span><br>'+ex.question+"</div>";
  h+='<div class="answers"><span class="label an">✍ '+ansLabel(ex.type)+"</span><br>";
  h+=buildAns(ex,st);
  h+="</div>";
  h+='<div class="hintbox" id="hintbox">💡 '+esc(ex.hint||(ex.hintTxt||""))+"</div>";
  h+='<div class="expl" id="expl"><h4>📘 Explanation</h4>'+ex.expl+'<div id="elsum" style="margin-top:8px;font-weight:700"></div></div>';
  h+='<div class="acts">';
  h+='<button class="btn primary" id="checkBtn">✔ Check</button>';
  h+='<button class="btn" id="reviseBtn" style="display:none">↺ Revise</button>';
  h+='<button class="btn" id="nextBtn">Next ▶</button>';
  h+='<button class="btn ghost" id="skipBtn">⤼ Skip</button>';
  h+='<button class="btn ghost" id="hintBtn">💡 Hint (−10%)</button>';
  h+='<span id="exscore" style="margin-left:auto;font-weight:700"></span>';
  h+="</div></div>";
  $("#exhost").innerHTML=h;
  wireActions(ex,st);

function typeLabel(t){return {mc:"single choice",multi:"multi-select",sort:"drag & drop",order:"reorder",match:"matching",fill:"fill the blanks",terminal:"terminal",logq:"log analysis",spot:"click the lines",branch:"branching scenario"}[t]}
function ansLabel(t){return {mc:"CHOOSE ONE",multi:"CHOOSE ALL THAT APPLY",sort:"DRAG THE ITEMS INTO BUCKETS",order:"PUT IN THE RIGHT ORDER",match:"MATCH EACH ITEM",fill:"PLACE THE WORDS",terminal:"TYPE THE COMMAND",logq:"CLICK THE SUSPICIOUS LINES",spot:"CLICK THE PROBLEM LINES",branch:"CHOOSE YOUR PATH"}[t]}
function initAns(ex,st){
  switch(ex.type){
    case "mc":return -1;
    case "multi":return [];
    case "sort":{var o={};ex.items.forEach(function(it,i){o[i]=-1});return o}
    case "order":return st.rt.seq.slice();
    case "match":{var o={};ex.pairs.forEach(function(p,i){o[i]=-1});return o}
    case "fill":{var o={};ex.blanks.forEach(function(b,i){o[i]=null});return o}
    case "terminal":return "";
    case "logq":return [];
    case "spot":return [];
    case "branch":return ex.steps.map(function(){return -1});
  }
  return null;
}
function buildAns(ex,st){
  var rt=st.rt,ans=st.ans;
  switch(ex.type){
    case "mc":return '<div role="radiogroup" aria-label="Answers">'+rt.choices.map(function(c,i){return '<label class="choice"><input type="radio" name="mc" value="'+i+'" '+(ans===i?"checked":"")+(st.checked?" disabled":"")+'><span>'+esc(c.t)+'</span><span class="mark am" data-i="'+i+'"></span></label>'}).join("")+"</div>";
    case "multi":return '<div role="group" aria-label="Answers">'+rt.choices.map(function(c,i){return '<label class="choice"><input type="checkbox" value="'+i+'" '+(ans.indexOf(i)>=0?"checked":"")+(st.checked?" disabled":"")+'><span>'+esc(c.t)+'</span><span class="mark am" data-i="'+i+'"></span></label>'}).join("")+"</div>";
    case "sort":{
      var h='<div class="pool" id="pool">';
      rt.items.forEach(function(it){if(rt.place[it.id]===-1)h+='<span class="drag" draggable="true" data-id="'+it.id+'" tabindex="0" role="button" aria-label="Item: '+esc(it.t)+'">'+esc(it.t)+'<span class="mark am" data-id="'+it.id+'"></span></span>'});
      h+="</div>";
      h+='<div class="buckets">';
      ex.buckets.forEach(function(b,bi){
        h+='<div class="bucket" data-b="'+bi+'"><h4>'+b+"</h4>";
        var inner=rt.items.filter(function(it){return rt.place[it.id]===bi});
        inner.forEach(function(it){h+='<span class="drag inb" draggable="true" data-id="'+it.id+'" tabindex="0" role="button" aria-label="Item: '+esc(it.t)+'">'+esc(it.t)+'<span class="mark am" data-id="'+it.id+'"></span></span>'});
        h+='<div class="drop"></div></div>';
      });
      return h+"</div>";
    }
    case "order":{
      var h='<div class="rows" id="orows">';
      rt.seq.forEach(function(si,pos){
        h+='<div class="orow" draggable="true" data-si="'+si+'"><span class="idx">'+(pos+1)+'</span><span class="txt">'+esc(ex.steps[si])+'</span><span class="mark am" data-si="'+si+'"></span><span class="mv"><button class="up" data-si="'+si+'" aria-label="Move up">▲</button><button class="dn" data-si="'+si+'" aria-label="Move down">▼</button></span></div>';
      });
      return h+"</div>";
    }
    case "match":{
      var h='<div class="mrows">';
      ex.pairs.forEach(function(p,i){
        var opts='<option value="-1">— choose —</option>';
        rt.rights.forEach(function(r,ri){opts+='<option value="'+ri+'" '+(ans[i]===ri?"selected":"")+(st.checked?" disabled":"")+">"+esc(r)+"</option>"});
        h+='<div class="mrow" data-i="'+i+'"><span class="lt">'+esc(p.l)+'</span><span style="color:var(--dim)">→</span><select aria-label="Match for '+esc(p.l)+'" '+(st.checked?"disabled":"")+">"+opts+'</select><span class="mark am" data-i="'+i+'"></span></div>';
      });
      return h+"</div>";
    }
    case "fill":{
      var parts=ex.text.split(/\{(\d+)\}/);
      var h="";
      for(var i=0;i<parts.length;i++){
        if(i%2===0){h+=parts[i]}
        else{var bi=parseInt(parts[i],10);
          h+='<span class="blank" data-b="'+bi+'" tabindex="0" role="button" aria-label="Blank '+(bi+1)+'">'+(ans[bi]!==null?esc(ans[bi]):"____")+'<span class="mark am" data-b="'+bi+'"></span></span>'}
      }
      h+='<div class="obank" id="obank">';
      var used={};Object.keys(ans).forEach(function(k){if(ans[k])used[ans[k]]=(used[ans[k]]||0)+1});
      rt.bank.forEach(function(w){
        var avail=rt.bank.filter(function(x){return x===w}).length;
        var isUsed=(used[w]||0)>=avail;
        h+='<span class="drag bw" tabindex="0" role="button" style="'+(isUsed?"opacity:.3;pointer-events:none":"")+'" data-w="'+esc(w)+'">'+esc(w)+"</span>"});
      return h+"</div>";
    }
    case "terminal":{
      var h='<div class="terminal"><div class="hist" id="thist" aria-live="polite">';
      rt.hist.forEach(function(l){h+='<span class="p">analyst@lab:~$</span> '+esc(l)+"\n"});
      h+='</div><form id="tform"><span class="ps">analyst@lab:~$</span><input id="tinput" aria-label="Type your command" autocomplete="off" spellcheck="false" '+(st.checked?"disabled":"")+'></form>';
      h+='<div style="margin-top:8px;font-size:13.5px;color:var(--dim)">'+ex.tnote+"</div></div>";
      return h;
    }
    case "logq":{
      var h='<div style="margin-bottom:8px"><input id="lfilter" placeholder="🔍 filter lines (like Kibana)…" aria-label="Filter log lines" style="width:100%;max-width:420px;background:#0d1420;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;min-height:44px;font-size:14px"></div>';
      h+='<div class="lines" id="llines" role="group" aria-label="Log lines">';
      ex.logs.forEach(function(l,i){
        h+='<button class="ln" data-i="'+i+'" role="checkbox" aria-checked="'+(ans.indexOf(i)>=0)+'"><span class="no">'+(i+1)+'</span><span class="mono">'+hl(l)+'</span><span class="mark am" data-i="'+i+'"></span></button>';
      });
      return h+"</div>";
    }
    case "spot":{
      var h='<div class="lines" id="clines" role="group" aria-label="Code lines"><pre class="log" style="margin:0">';
      ex.code.forEach(function(l,i){
        h+='<button class="ln" data-i="'+i+'" role="checkbox" aria-checked="'+(ans.indexOf(i)>=0)+'"><span class="no">'+(i+1)+'</span><span class="mono">'+esc(l)+'</span><span class="mark am" data-i="'+i+'"></span></button>';
      });
      return h+"</pre></div>";
    }
    case "branch":{
      var h='<div class="steps">';
      ex.steps.forEach(function(s,si){
        if(si>=st.steps&&st.steps<ex.steps.length){if(si>st.steps)return}
        if(si>st.steps)return;
        h+='<div class="step"><h4>Step '+(si+1)+" of "+ex.steps.length+"</h4><p style='margin:4px 0 8px'>"+s.q+"</p>";
        s.o.forEach(function(o,oi){
          var chosen=ans[si]===oi;
          h+='<label class="choice" style="'+(si<st.steps?"pointer-events:none":"")+'"><input type="radio" name="bs'+si+'" value="'+oi+'" '+(chosen?"checked":"")+(si<st.steps?" disabled":"")+'><span>'+esc(o.t)+'</span><span class="mark am" data-s="'+si+'" data-o="'+oi+'"></span></label>';
        });
        if(si<st.steps)h+='<div class="outcome">'+s.o[ans[si]].out+"</div>";
        h+="</div>";
      });
      if(st.steps<ex.steps.length)h+='<div class="banner info" style="margin-top:8px">Make your choice above — the next step unlocks.</div>';
      return h+"</div>";
    }
  }
  return "";
}
function hl(line){
  return esc(line)
    .replace(/(&quot;[^&]*?&quot;|&#x27;[^&]*?&#x27;)/g,'<span class="warn">$1</span>')
    .replace(/\b(4\d\d|5\d\d)\b/g,'<span class="bad">$1</span>')
    .replace(/(\[[^\]]+\])/g,'<span class="ts">$1</span>');
}
function wireAns(ex,st){
  var rt=st.rt;
  if(ex.type==="mc"){
    document.querySelectorAll('input[name="mc"]').forEach(function(inp){
      inp.addEventListener("change",function(){if(st.checked)return;st.ans=parseInt(inp.value,10);updateActionState(ex,st)});
    });

      inp.addEventListener("change",function(){

      if(j<0||j>=seq.length)return;

    }

      var si=parseInt(row.dataset.si,10);
      row.querySelector(".up").addEventListener("click",function(e){e.stopPropagation();move(si,-1)});
      row.querySelector(".dn").addEventListener("click",function(e){e.stopPropagation();move(si,1)});
      row.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",String(si))});
      row.addEventListener("dragover",function(e){e.preventDefault()});
      row.addEventListener("drop",function(e){
        e.preventDefault();if(st.checked)return;
        var from=parseInt(e.dataTransfer.getData("text/plain"),10);
        var a=rt.seq,i=a.indexOf(from),j=a.indexOf(si);
        a.splice(i,1);a.splice(j,0,from);st.ans=a;st.touched=true;renderEx();
      });
    });
  } else if(ex.type==="match"){
    document.querySelectorAll(".mrow select").forEach(function(s){
      s.addEventListener("change",function(){if(st.checked)return;st.ans[parseInt(s.closest(".mrow").dataset.i,10)]=parseInt(s.value,10);updateActionState(ex,st)});
    });
  } else if(ex.type==="fill"){
    document.querySelectorAll("#obank .bw").forEach(function(w){
      w.addEventListener("click",function(){
        if(st.checked)return;
        document.querySelectorAll("#obank .bw").forEach(function(x){x.classList.remove("sel")});
        w.classList.add("sel");rt.sel=w.dataset.w;
      });
      w.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();w.click()}});
    });
    document.querySelectorAll(".blank").forEach(function(bl){
      bl.addEventListener("click",function(){
        if(st.checked)return;
        var bi=parseInt(bl.dataset.b,10);
        if(st.ans[bi]!==null){st.ans[bi]=null;renderEx();return}
        if(rt.sel){st.ans[bi]=rt.sel;rt.sel=null;renderEx()}
      });
      bl.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();bl.click()}});
    });
  } else if(ex.type==="terminal"){
    var f=document.getElementById("tform");
    if(f)f.addEventListener("submit",function(e){
      e.preventDefault();
      var inp=document.getElementById("tinput");
      var v=inp.value.trim();if(!v)return;
      rt.hist.push(v);st.ans=v;inp.value="";renderEx();
      var i=document.getElementById("tinput");if(i)i.focus();
    });
  } else if(ex.type==="logq"||ex.type==="spot"){
    document.querySelectorAll(".lines .ln").forEach(function(l){
      l.addEventListener("click",function(){
        if(st.checked)return;
        var v=parseInt(l.dataset.i,10);
        if(ex.type==="logq"){var f=document.getElementById("lfilter");if(f)f.value=""}
        var arr=st.ans,k=arr.indexOf(v);
        if(k>=0){arr.splice(k,1);l.setAttribute("aria-checked","false")}else{arr.push(v);l.setAttribute("aria-checked","true")}
        l.classList.toggle("sel",k<0);
        updateActionState(ex,st);
      });
    });
    var lf=document.getElementById("lfilter");
    if(lf)lf.addEventListener("input",function(){
      var q=norm(lf.value);
      document.querySelectorAll("#llines .ln").forEach(function(l){
        var raw=ex.logs[parseInt(l.dataset.i,10)];
        l.style.display=(!q||norm(raw).indexOf(q)>=0)?"flex":"none";
      });
    });
  } else if(ex.type==="branch"){
    document.querySelectorAll('#exhost input[type="radio"]').forEach(function(inp){
      inp.addEventListener("change",function(){
        if(st.checked)return;
        var name=inp.name,si=parseInt(name.replace("bs",""),10),oi=parseInt(inp.value,10);
        if(si!==st.steps)return;
        st.ans[si]=oi;st.steps++;renderEx();
      });
    });
  }
}
function wireActions(ex,st){
  document.getElementById("checkBtn").addEventListener("click",function(){doCheck(ex,st)});
  document.getElementById("nextBtn").addEventListener("click",next);
  document.getElementById("skipBtn").addEventListener("click",function(){doSkip(ex,st)});
  document.getElementById("hintBtn").addEventListener("click",function(){doHint(ex,st)});
  document.getElementById("reviseBtn").addEventListener("click",function(){doRevise(ex,st)});
}
function updateActionState(ex,st){
  var cb=document.getElementById("checkBtn");
  cb.disabled=st.checked||!hasAnswer(ex,st);
  document.getElementById("reviseBtn").style.display=st.checked?"":"none";
  document.getElementById("hintBtn").disabled=st.hints>0||st.checked;
  if(st.hints>0)document.getElementById("hintbox").style.display="block";
}
function hasAnswer(ex,st){
  var a=st.ans;
  if(a===undefined||a===null)return false;
  switch(ex.type){
    case "mc":return a>=0;
    case "multi":return a.length>0;
    case "sort":return Object.keys(a).some(function(k){return a[k]>=0});
    case "order":return !!st.touched;
    case "match":return Object.keys(a).some(function(k){return a[k]>=0});
    case "fill":return Object.keys(a).some(function(k){return a[k]!==null});
    case "terminal":return !!a;
    case "logq":return a.length>0;
    case "spot":return a.length>0;
    case "branch":return st.steps>=ex.steps.length;
  }
  return false;
}
function r2(x){return Math.round(x*100)/100}
function evaluate(ex,st){
  var rt=st.rt,a=st.ans,ev={detail:[],frac:0,n:1};
  var i,c;
  switch(ex.type){
    case "mc":{
      ev.n=1;var ch=rt.choices[a];
      ev.frac=ch&&ch.ok?1:0;ev.detail=[{i:a,ok:ch&&ch.ok}];
      break}
    case "multi":{
      var tot=rt.choices.filter(function(c){return c.ok}).length;ev.n=tot;
      var got=0;
      rt.choices.forEach(function(c,i){
        var sel=a.indexOf(i)>=0;
        if(c.ok&&sel){got++;ev.detail.push({i:i,s:"ok"})}
        else if(c.ok){ev.detail.push({i:i,s:"miss"})}
        else if(sel){ev.detail.push({i:i,s:"bad"})}
        else{ev.detail.push({i:i,s:"neu"})}
      });
      ev.frac=tot?got/tot:0;
      break}
    case "sort":{
      ev.n=rt.items.length;var got=0;
      rt.items.forEach(function(it){
        var p=rt.place[it.id];
        if(p===it.b){got++;ev.detail.push({id:it.id,s:"ok"})}
        else if(p===-1){ev.detail.push({id:it.id,s:"miss"})}
        else{ev.detail.push({id:it.id,s:"bad"})}
      });
      ev.frac=got/ev.n;
      break}
    case "order":{
      ev.n=rt.seq.length;var got=0;
      rt.seq.forEach(function(si,pos){
        if(si===pos){got++;ev.detail.push({si:si,s:"ok"})}else{ev.detail.push({si:si,s:"bad"})}
      });
      ev.frac=got/ev.n;
      break}
    case "match":{
      ev.n=ex.pairs.length;var got=0;
      ex.pairs.forEach(function(p,i){
        var ci=rt.rights.indexOf(p.r);
        if(a[i]===ci){got++;ev.detail.push({i:i,s:"ok"})}
        else if(a[i]===-1){ev.detail.push({i:i,s:"miss"})}
        else{ev.detail.push({i:i,s:"bad"})}
      });
      ev.frac=got/ev.n;
      break}
    case "fill":{
      ev.n=ex.blanks.length;var got=0;
      ex.blanks.forEach(function(b,i){
        var v=a[i];
        if(v!==null&&b.a.map(norm).indexOf(norm(v))>=0){got++;ev.detail.push({i:i,s:"ok"})}
        else if(v===null){ev.detail.push({i:i,s:"miss"})}
        else{ev.detail.push({i:i,s:"bad"})}
      });
      ev.frac=got/ev.n;
      break}
    case "terminal":{
      ev.n=1;var cmd=norm(a).replace(/^analyst@lab:~\$\s*/,"");
      var ok=ex.must.every(function(m){return m.re.test(cmd)});
      ev.frac=ok?1:0;ev.missed=ex.must.map(function(m){return m.des}).filter(function(d,i){return !ex.must[i].re.test(cmd)});
      break}
    case "logq":case "spot":{
      var corr=ex.correct;ev.n=corr.length;var got=0;
      corr.forEach(function(ci){
        if(a.indexOf(ci)>=0){got++;ev.detail.push({i:ci,s:"ok"})}
        else{ev.detail.push({i:ci,s:"miss"})}
      });
      a.forEach(function(si){if(corr.indexOf(si)<0)ev.detail.push({i:si,s:"bad"})});
      ev.frac=got/ev.n;
      break}
    case "branch":{
      ev.n=ex.steps.length;var got=0;
      ex.steps.forEach(function(s,si){
        if(a[si]===s.ok){got++;ev.detail.push({si:si,s:"ok"})}else{ev.detail.push({si:si,s:"bad"})}
      });
      ev.frac=got/ev.n;
      break}
  }
  return ev;
}
function mk(s){return s==="ok"?'<span class="m-ok">✓</span>':s==="bad"?'<span class="m-bad">✗</span>':s==="miss"?'<span class="m-warn">⚠ missed</span>':""}
function applyMarks(ex,st){
  var ev=st.ev||evaluate(ex,st);st.ev=ev;
  var root=$("#exhost");
  switch(ex.type){
    case "mc":{
      root.querySelectorAll(".choice").forEach(function(el,i){
        var c=st.rt.choices[i];var m=el.querySelector(".am");
        if(c.ok){el.classList.add("correct");m.innerHTML=' <span class="m-ok">✓ correct</span>'}
        else if(st.ans===i){el.classList.add("wrong");m.innerHTML=' <span class="m-bad">✗ your choice</span>'}
        else{el.classList.add("dim")}
      });
      break}
    case "multi":{
      root.querySelectorAll(".choice").forEach(function(el,i){
        var d=ev.detail.filter(function(x){return x.i===i})[0];if(!d)return;
        var m=el.querySelector(".am");
        if(d.s==="ok"){el.classList.add("correct");m.innerHTML=' <span class="m-ok">✓</span>'}
        else if(d.s==="miss"){el.classList.add("correct");m.innerHTML=' <span class="m-warn">⚠ missed</span>'}
        else if(d.s==="bad"){el.classList.add("wrong");m.innerHTML=' <span class="m-bad">✗</span>'}
      });
      break}
    case "sort":{
      root.querySelectorAll(".drag").forEach(function(el){
        var id=parseInt(el.dataset.id,10);
        var d=ev.detail.filter(function(x){return x.id===id})[0];if(!d)return;
        var m=el.querySelector(".am");
        if(d.s==="ok"){el.classList.add("correct");m.innerHTML=' <span class="m-ok">✓</span>'}
        else if(d.s==="bad"){el.classList.add("wrong");m.innerHTML=' <span class="m-bad">✗</span>'}
        else{el.classList.add("miss");m.innerHTML=' <span class="m-warn">⚠</span>'}
      });
      break}
    case "order":{
      root.querySelectorAll(".orow").forEach(function(el){
        var si=parseInt(el.dataset.si,10);
        var d=ev.detail.filter(function(x){return x.si===si})[0];if(!d)return;
        var m=el.querySelector(".am");
        if(d.s==="ok"){el.classList.add("correct");m.innerHTML=' <span class="m-ok">✓</span>'}
        else{el.classList.add("wrong");m.innerHTML=' <span class="m-bad">✗</span>'}
      });
      break}
    case "match":{
      root.querySelectorAll(".mrow").forEach(function(el){
        var i=parseInt(el.dataset.i,10);
        var d=ev.detail.filter(function(x){return x.i===i})[0];if(!d)return;
        if(d.s==="ok")el.classList.add("correct");else el.classList.add("wrong");
        var m=el.querySelector(".am");
        m.innerHTML=d.s==="ok"?' <span class="m-ok">✓</span>':d.s==="miss"?' <span class="m-warn">⚠</span>':' <span class="m-bad">✗</span>';
      });
      break}
    case "fill":{
      root.querySelectorAll(".blank").forEach(function(el){
        var i=parseInt(el.dataset.b,10);
        var d=ev.detail.filter(function(x){return x.i===i})[0];if(!d)return;
        var m=el.querySelector(".am");
        if(d.s==="ok"){el.classList.add("correct");m.innerHTML=' <span class="m-ok">✓</span>'}
        else if(d.s==="bad"){el.classList.add("wrong");m.innerHTML=' <span class="m-bad">✗</span> <span class="m-ok">→ '+esc(ex.blanks[i].a[0])+"</span>"}
        else{m.innerHTML=' <span class="m-warn">⚠ '+esc(ex.blanks[i].a[0])+"</span>"}
      });
      break}
    case "terminal":break;
    case "logq":case "spot":{
      root.querySelectorAll(".lines .ln").forEach(function(el){
        var i=parseInt(el.dataset.i,10);
        var d=ev.detail.filter(function(x){return x.i===i})[0];if(!d)return;
        var m=el.querySelector(".am");
        if(d.s==="ok"){el.classList.add("correct");m.innerHTML=' <span class="m-ok">✓</span>'}
        else if(d.s==="miss"){el.classList.add("miss");m.innerHTML=' <span class="m-warn">⚠</span>'}
        else{el.classList.add("wrong");m.innerHTML=' <span class="m-bad">✗</span>'}
      });
      break}
    case "branch":{
      ex.steps.forEach(function(s,si){
        var d=ev.detail.filter(function(x){return x.si===si})[0];if(!d)return;
        var sel=root.querySelector('.am[data-s="'+si+'"][data-o="'+s.ok+'"]');
        if(sel)sel.innerHTML=' <span class="m-ok">✓ right path</span>';
        if(d.s==="bad"){var bad=root.querySelector('.am[data-s="'+si+'"][data-o="'+st.ans[si]+'"]');if(bad)bad.innerHTML=' <span class="m-bad">✗</span>'}
      });
      break}
  }
  var lbl=ev.frac>=0.999?"full":ev.frac>0?"partial":"zero";
  var el=document.getElementById("elsum");
  if(el)el.innerHTML="Result: "+'<span class="'+(lbl==="full"?"m-ok":lbl==="partial"?"m-warn":"m-bad")+'">'+lbl.toUpperCase()+"</span> — you earned "+st.earned+" / "+ex.points+" points on this exercise."+((st.hints>0)?" (includes −"+(st.hints*10)+"% hint cost)":"");
  var ex2=document.getElementById("exscore");
  if(ex2)ex2.innerHTML='<span class="'+(lbl==="full"?"m-ok":lbl==="partial"?"m-warn":"m-bad")+'">'+st.earned+" / "+ex.points+" pts</span>";
}
function doCheck(ex,st){
  if(st.checked||!hasAnswer(ex,st))return;
  var ev=evaluate(ex,st);
  var pen=1-0.1*st.hints;
  st.ev=ev;
  st.earned=r2(ex.points*ev.frac*pen);
  st.checked=true;
  if(st.skipped)st.skipped=false;
  st.ansLock=true;
  state.checkPause=true;
  applyMarks(ex,st);
  var xp=document.getElementById("expl");if(xp)xp.style.display="block";
  if(ex.type==="terminal"&&ev.frac<1&&ev.missed&&ev.missed.length){
    var h=document.getElementById("thist");
    if(h)h.innerHTML+='<span class="m-bad">✗ not quite — missing: '+esc(ev.missed.join(", "))+"\n</span>";
  }
  updateActionState(ex,st);setPauseBadges();liveScore();drawNav();
}
function doSkip(ex,st){
  st.skipped=true;
  if(state.cur>=EX.length-1){askFinish();return}
  state.cur++;setPauseBadges();renderEx();
}
function doHint(ex,st){
  if(st.hints>0||st.checked)return;
  st.hints++;
  var hb=document.getElementById("hintbox");
  if(hb){hb.textContent="💡 Hint: "+ex.hintTxt;hb.style.display="block"}
  updateActionState(ex,st);
}
function doRevise(ex,st){
  st.checked=false;st.earned=null;st.ev=null;st.ansLock=false;
  if(ex.type==="branch"){st.steps=0;st.ans=ex.steps.map(function(){return -1})}
  document.getElementById("expl").style.display="none";
  renderEx();
}
var modalCb=null;
function askModal(title,body,yes,cb){$("#mTitle").textContent=title;$("#mBody").innerHTML=body;modalCb=cb;$("#modal").classList.add("on");$("#mYes").textContent=yes;$("#mYes").focus()}
function askFinish(){
  var any=state.st.some(function(s){return !s.skipped&&(s.checked||hasAnswer(EX[state.order[state.st.indexOf(s)]],s))});
  if(!any){askModal("Cannot submit yet","All exercises are skipped or empty. Please answer at least one exercise before submitting.","OK",null);return}
  askModal("Finish &amp; submit?","Unfinished exercises that you never answer will be <b>excluded from scoring</b>, like skipped ones. Submit now?","Submit",function(){finishExam(true)});
}
function ansSum(ex,st){
  var a=st.ans,rt=st.rt;
  function cl(i){return rt.choices[i]?rt.choices[i].t:""}
  switch(ex.type){
    case "mc":return a>=0?esc(cl(a)):"—";
    case "multi":return a.length?a.map(function(i){return esc(cl(i))}).join(" · "):"—";
    case "sort":return rt.items.map(function(it){var b=rt.place[it.id];return esc(it.t)+" → "+(b>=0?esc(ex.buckets[b].replace(/<[^>]*>/g,"")):"(not placed)")}).join("<br>");
    case "order":return rt.seq.map(function(si,pos){return (pos+1)+". "+esc(ex.steps[si])+(si===pos?" ✓":"")}).join("<br>");
    case "match":return ex.pairs.map(function(p,i){return esc(p.l)+" → "+(a[i]>=0?esc(rt.rights[a[i]]):"—")}).join("<br>");
    case "fill":return ex.blanks.map(function(b,i){return "blank "+(i+1)+": "+(a[i]!==null?esc(a[i]):"—")}).join(" · ");
    case "terminal":return a?esc(a):"—";
    case "logq":case "spot":return a.length?a.map(function(i){return "line "+(i+1)}).join(", "):"—";
    case "branch":return ex.steps.map(function(s,si){return "step "+(si+1)+": "+(a[si]>=0?esc(s.o[a[si]].t):"—")}).join("<br>");
  }
  return "";
}
function corrSum(ex){
  switch(ex.type){
    case "mc":return esc(ex.choices[ex.correct[0]]);
    case "multi":return ex.correct.map(function(i){return esc(ex.choices[i])}).join(" · ");
    case "sort":return ex.items.map(function(it){return esc(it.t)+" → "+esc(ex.buckets[it.b].replace(/<[^>]*>/g,""))}).join("<br>");
    case "order":return ex.steps.map(function(s,i){return (i+1)+". "+esc(s)}).join("<br>");
    case "match":return ex.pairs.map(function(p){return esc(p.l)+" → "+esc(p.r)}).join("<br>");
    case "fill":return ex.blanks.map(function(b,i){return "blank "+(i+1)+": "+esc(b.a[0])}).join(" · ");
    case "terminal":return esc(ex.sample);
    case "logq":return "lines "+ex.correct.map(function(i){return i+1}).join(", ");
    case "spot":return "lines "+ex.correct.map(function(i){return i+1}).join(", ");
    case "branch":return ex.steps.map(function(s,i){return "step "+(i+1)+": "+esc(s.o[s.ok].t)}).join("<br>");
  }
  return "";
}
function finishExam(manual){
  state.st.forEach(function(s,i){
    var ex=EX[i];
    if(!s.rt)s.rt=buildRt(ex);
    if(s.ans===undefined||s.ans===null)s.ans=initAns(ex,s);
    if(!s.skipped&&!s.checked&&hasAnswer(ex,s)){var ev=evaluate(ex,s);st=s;var pen=1-0.1*s.hints;s.ev=ev;s.earned=r2(ex.points*ev.frac*pen);s.checked=true}
    if(!s.skipped&&!s.checked&&!hasAnswer(ex,s)){s.skipped=true;s.never=true}
  });
  var totPts=0,got=0,nAns=0;
  state.st.forEach(function(s,i){var ex=EX[i];if(!s.skipped){totPts+=ex.points;if(s.earned)got+=s.earned;if(s.checked)nAns++}});
  var earnedR=Math.round(got*10)/10;
  var raw=totPts>0?got/totPts:0;
  var scoredR=nAns>0?Math.round(raw*nAns):0;
  var percent=nAns>0?Math.round(scoredR/nAns*100):0;
  var passed=percent>=PASS&&nAns>0;
  state.finished=true;
  $("#quiz").hidden=true;$("#intro").hidden=true;
  var r=$("#results");r.hidden=false;
  var certName=(window.__cmName?esc(window.__cmName):"Candidate");
  var h='<div class="card"><div class="cert'+(passed?"":" bad")+'">'+
    (passed?"<h2>🎉 PASS — "+percent+"%</h2>":"<h2>✗ FAIL — "+percent+"%</h2>")+
    '<div class="score-big">'+percent+"%</div>"+
    '<p style="margin:2px 0 8px;color:var(--dim)">'+earnedR+" of "+Math.round(totPts)+" points across "+nAns+" answered exercise(s)</p>"+
    "<p>"+(passed?("Certificate-style credit: <b>"+certName+"</b> met the "+PASS+"% pass mark on the 4.2 HARD practice exam. Well done — keep drilling the amber items."):"You did not reach the "+PASS+"% pass mark. Study the report below, then press <b>Retake Exam</b> — questions and choices will be reshuffled.")+"</p>"+
    (nAns===0?"<p class='banner gold'>No exercises were answered, so nothing was scored.</p>":"")+
    '<button class="btn primary" id="retakeBtn" style="margin-top:10px">↺ Retake Exam</button></div>';
  var sk=state.st.filter(function(s){return s.skipped}).length;
  if(sk>0)h+='<p class="banner gold">⚠ '+sk+" exercise(s) were skipped or never answered and were <b>excluded from scoring</b> (removed from both your earned points and the maximum possible).</p>";
  h+='<h2 style="margin:16px 0 6px">Per-exercise report</h2>';
  state.order.forEach(function(ei,n){
    var ex=EX[ei],s=state.st[ei];
    var lbl=s.skipped?"skipped":(s.earned/ex.points>=0.999?"full":s.earned>0?"partial":"zero");
    var pill=lbl==="full"?'<span class="pill full">FULL</span>':lbl==="partial"?'<span class="pill part">PARTIAL</span>':lbl==="zero"?'<span class="pill zero">ZERO</span>':'<span class="pill skip">SKIPPED — not counted</span>';
    h+='<div class="rep"><div class="rt">Q'+(n+1)+" — "+THEMES[ex.theme]+pill+'<span class="pts">'+(s.skipped?"—":(s.earned+" / "+ex.points))+"</span></div>";
    h+='<div class="bd"><b>Your answer:</b><br>'+ansSum(ex,s)+"</div>";
    if(!s.skipped)h+='<div class="bd"><b>Correct:</b><br>'+corrSum(ex)+"</div>";
    h+='<div class="tip">📘 '+ex.expl+"</div></div>";
  });
  h+="</div>";
  r.innerHTML=h;
  document.getElementById("retakeBtn").addEventListener("click",function(){startExam()});
  window.scrollTo(0,0);
  if(nAns>0)reportScore(scoredR,nAns,percent,passed);
}
function reportScore(score,total,percent,passed){
  if(fired)return;fired=true;
  try{
    parent.postMessage({type:"CYBERPULSE_SCORE",topicId:TOPIC,score:score,total:total,percent:percent,passed:passed},location.origin);
  }catch(e){/* opened directly — nothing to report to */}
}
function endByTimer(){finishExam(false)}
window.addEventListener("message",function(event){
  if(!event.data)return;
  if(event.data.type!=="CYBERPULSE_INIT"&&event.data.type!=="CYBERMASTERY_INIT")return;
  try{
    if(event.data.username)window.__cmName=String(event.data.username).slice(0,40);
  }catch(e){}
});
$("#mYes").addEventListener("click",function(){$("#modal").classList.remove("on");if(modalCb)modalCb()});
$("#mNo").addEventListener("click",function(){$("#modal").classList.remove("on");modalCb=null});
renderIntro();
document.getElementById("pauseBtn").addEventListener("click",togglePause);
document.getElementById("finishBtn").addEventListener("click",askFinish);
document.getElementById("veilResume").addEventListener("click",function(){if(state&&state.manualPause)togglePause()});
interval=setInterval(tick,1000);
/*__DATA__*/
</script>
