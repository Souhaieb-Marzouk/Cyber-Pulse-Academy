function runTerm(ex, a, cmd){
  var low = cmd.toLowerCase();
  if (low === 'clear') { a.val = []; return; }
  if (low === 'help') { a.val.push('\u0001Available in this sandbox: ls, cat, grep, nmap, whoami, id, ifconfig, ping, nc, echo, clear, help — plus the tools the exercise asks for.'); return; }
  if (ex.outputs) {
    for (var i = 0; i < ex.outputs.length; i++) {
      if (ex.outputs[i].re.test(cmd)) { a.val.push('\u0001' + ex.outputs[i].out); return; }
    }
  }
  var w = low.split(/\s+/)[0];
  if (w === 'ls') {
    var ks = Object.keys(ex.fs || {});
    if (!ks.length) { a.val.push('\u0001(total: 0)'); return; }
    var short = ks.map(function(k){ return k.split('/').pop(); }).join('  ');
    a.val.push('\u0001' + short); return;
  }
  if (w === 'cat' || w === 'less' || w === 'head' || w === 'tail') {
    var rest = cmd.slice(cmd.indexOf(' ') + 1).trim();
    var key = Object.keys(ex.fs || {}).filter(function(k){ return k === rest || k.endsWith('/' + rest) || rest.indexOf(k.split('/').pop()) >= 0; })[0];
    if (key) { a.val.push('\u0001' + (ex.fs[key].length > 1800 ? ex.fs[key].slice(0, 1800) + '\n[...] file truncated in sandbox' : ex.fs[key])); }
    else a.val.push('\u0002cat: ' + rest + ': No such file or directory');
    return;
  }
  if (w === 'grep') {
    var m = cmd.match(/grep\s+(?:-[a-zA-Z]+\s+)*["']?([^"'\s]+)["']?\s+(\S+)/);
    if (!m) { a.val.push('\u0002usage: grep [-c] [-i] PATTERN FILE'); return; }
    var pat = m[1].toLowerCase(), file = m[2];
    var fk = Object.keys(ex.fs || {}).filter(function(k){ return k.indexOf(file.split('/').pop()) >= 0; })[0];
    if (!fk) { a.val.push('\u0002grep: ' + file + ': No such file or directory'); return; }
    var lines2 = ex.fs[fk].split('\n'), hits = lines2.filter(function(L){ return L.toLowerCase().indexOf(pat) >= 0; });
    if (/-c\b/.test(cmd)) a.val.push('\u0001' + hits.length);
    else a.val.push('\u0001' + (hits.length ? hits.join('\n') : '(no matches)'));
    return;
  }
  if (w === 'whoami') { a.val.push('\u0001root'); return; }
  if (w === 'id') { a.val.push('\u0001uid=0(root) gid=0(root) groups=0(root)'); return; }
  if (w === 'ifconfig' || w === 'ip') { a.val.push('\u0001tun0: inet 10[.]10[.]10[.]240  netmask 255[.]255[.]255[.]0\neth0: inet 10[.]10[.]10[.]77  netmask 255[.]255[.]255[.]0'); return; }
  if (w === 'ping') { a.val.push('\u0001PING: 4 packets transmitted, 4 received, 0% packet loss'); return; }
  if (w === 'echo') { a.val.push('\u0001' + cmd.slice(5)); return; }
  if (w === 'nmap' || w === 'nc' || w === 'netcat' || w === 'hydra' || w === 'john' || w === 'hashcat' || w === 'sqlmap' || w === 'nikto' || w === 'aircrack-ng' || w === 'airodump-ng' || w === 'airmon-ng' || w === 'aireplay-ng' || w === 'msfconsole' || w === 'msfvenom' || w === 'searchsploit' || w === 'noseyparker') {
    a.val.push('\u0001' + (ex.fs && ex.fs.__bin ? '' : '') + genericToolOut(w, cmd));
    return;
  }
  a.val.push('\u0002bash: ' + w + ': command not found (type help)');
}
function genericToolOut(tool, cmd){
  if (tool === 'nmap') {
    if (/-sn\b|-sP\b/.test(cmd)) return 'Starting Nmap 7.94\nNmap scan report for 10[.]10[.]10[.]5\nHost is up (0.00045s latency).\n...\nNmap done: 256 IP addresses (6 hosts up) scanned in 4.11 seconds';
    return 'Starting Nmap 7.94\nNmap scan report for 10[.]10[.]10[.]5\nHost is up (0.00042s latency).\nNot shown: 997 closed tcp ports\nPORT   STATE SERVICE VERSION\n22/tcp open  ssh     OpenSSH 8.4p1\n80/tcp open  http    nginx 1.18.0\nService detection performed. Nmap done: 1 IP address (1 host up) scanned in 3.20 seconds';
  }
  if (tool === 'nc' || tool === 'netcat') return 'Connection accepted — (banner appears here)';
  if (tool === 'hydra') return '[ATTEMPT] target 10[.]10[.]10[.]9 - login "admin" - pass "test"\n1 of 1 target successfully completed';
  return '[' + tool + '] executed in sandbox (exercise checks your command text, not this output)';
}

/* ---------------- check / revise / hint / skip ---------------- */
function doCheck(){
  var a = curAns(), ex = curEx();
  if (S.manualPause) return;
  if (!touchedVal(ex, a.val) && ex.t !== 'order' && ex.t !== 'rank') { if (!a.touched) { toast('Select an answer first (or press Skip).'); return; } }
  if ((ex.t === 'order' || ex.t === 'rank') && !a.touched) { toast('Reorder the list first (or press Skip).'); return; }
  var res = computeScore(ex, a);
  a.locked = { val: cloneVal(ex, a.val), hints: a.hints, earned: res.earned, n: res.n, N: res.N, marks: res.marks };
  a.revising = false; a.skipped = false;
  S.checkPause = true;
  renderEx();
}
function cloneVal(ex, v){
  if (v == null) return v;
  if (ex.t === 'dnd') { var o = {}; Object.keys(v).forEach(function(k){ o[k] = v[k]; }); return o; }
  if (Array.isArray(v)) return v.slice();
  return v;
}
function doRevise(){
  var a = curAns(); if (!a.locked) return;
  a.revising = true;
  /* Per spec, editing answers must NOT resume the timer: an active Check-pause
     stays active until Next (or any navigation away) ends it. */
  renderEx();
}
function doHint(){
  var a = curAns();
  if (a.hints > 0 || a.locked) return;
  a.hints++; a.touched = true;
  renderEx(); /* re-renders with the persistent hint block */
}
function doSkip(){
  var a = curAns();
  if (a.locked) return;
  a.skipped = true;
  S.checkPause = false;
  nextQ();
}
function renderFeedback(stage, ex, a){
  var L = a.locked, fbCls = 'fb', fbIc = '', fbTxt = '';
  if (L.n === L.N) { fbCls += ' okf'; fbIc = '✓'; fbTxt = 'Fully correct — ' + L.n + ' of ' + L.N + ' elements right.'; }
  else if (L.n > 0) { fbCls += ' warf'; fbIc = '◐'; fbTxt = 'Partially correct — ' + L.n + ' of ' + L.N + ' elements right.'; }
  else { fbCls += ' badf'; fbIc = '✗'; fbTxt = 'Not correct — 0 of ' + L.N + ' elements right.'; }
  var box = el('div', null);
  box.id = 'fbBox';
  var fb = el('div', fbCls, '<span class="big">' + fbIc + ' ' + fbTxt + '</span> You earned <b>' + L.earned.toFixed(2) + ' / 1</b> point.' +
    (L.hints ? ' <span style="color:var(--warn)">(−' + (L.hints * 10) + '% hint)</span>' : '') +
    (S.checkPause ? '<span class="reviewnote">🕒 Timer paused — review mode. Press Next to continue.</span>' : ''));
  box.appendChild(fb);
  var expCls = 'explain' + (L.n === L.N ? '' : (L.n > 0 ? ' part' : ' bad'));
  var exp = el('div', expCls, '<div class="et">📘 Why</div>' + ex.ex);
  box.appendChild(exp);
  stage.appendChild(box);
  /* apply element marks */
  var d = {}; L.marks.forEach(function(m){ d[m.k] = m.st; });
  var stageEl = stage;
  Object.keys(d).forEach(function(k){
    var st = d[k]; if (!st) return;
    var nodes = [];
    switch (ex.t) {
      case 'qcm': case 'multi':
        stageEl.querySelectorAll('.opt').forEach(function(o){ var inp = o.querySelector('input'); if (inp && inp.value === k) nodes.push(o); });
        break;
      case 'dnd': nodes = stageEl.querySelectorAll('.slot[data-slot="' + k + '"]'); break;
      case 'match': nodes = stageEl.querySelectorAll('.mrow'); nodes = [nodes[Number(k)]]; break;
      case 'fib': nodes = stageEl.querySelectorAll('select[data-gap="' + k + '"]'); break;
      case 'term': break;
      case 'logview': case 'spot': break;
      case 'branch': nodes = stageEl.querySelectorAll('.stepcard'); nodes = [nodes[Number(k)]]; break;
      case 'sim': nodes = stageEl.querySelectorAll('.stepcard'); nodes = [nodes[Number(k)]]; break;
    }
    nodes.forEach(function(nd){
      nd.classList.add(st === 'warn' ? 'warn' : st);
      if (!nd.querySelector('.ic')) nd.appendChild(el('span', 'ic', icons(st)));
    });
  });
  if (ex.t === 'term') {
    var tq = stageEl.querySelector('.taskchk');
    if (tq) L.marks.forEach(function(m, i){
      var row = tq.children[i];
      if (row) row.appendChild(el('span', null, ' <b style="color:var(--' + (m.st === 'ok' ? 'ok' : 'bad') + ')">' + icons(m.st) + '</b>'));
    });
  }
}

/* ---------------- results ---------------- */
function finish(reason){
  if (S.finished) return;
  S.finished = true; S.manualPause = false; S.checkPause = false;
  if (S.tick) clearInterval(S.tick);
  var rows = [], included = 0, earned = 0, skippedList = [];
  S.order.forEach(function(ix, pos){
    var ex = E[ix], a = S.ans[ix], row;
    if (a.locked) {
      var sc = computeScore(ex, { val: a.locked.val, hints: a.locked.hints });
      earned += sc.earned; included++;
      row = { ex: ex, a: a, n: sc.n, N: sc.N, earned: sc.earned, counted: true };
    } else if (a.skipped) {
      skippedList.push(pos + 1);
      row = { ex: ex, a: a, n: 0, N: 0, earned: 0, counted: false, label: 'skip' };
    } else if (a.touched && touchedVal(ex, a.val)) {
      var sc3 = computeScore(ex, a); earned += sc3.earned; included++;
      row = { ex: ex, a: a, n: sc3.n, N: sc3.N, earned: sc3.earned, counted: true };
    } else {
      row = { ex: ex, a: a, n: 0, N: 0, earned: 0, counted: false, label: 'na' };
    }
    rows.push(row);
  });
  var pts = Math.round(earned * 100) / 100;
  var correct = Math.round(pts);
  var percent = included ? Math.round(correct / included * 100) : 0;
  var passed = included > 0 && percent >= EX.pass;
  renderResults(rows, pts, correct, included, percent, passed, skippedList, reason);
  $('hd').hidden = true; $('stageWrap').hidden = true; $('results').hidden = false;
  window.scrollTo(0, 0);
  if (!S.reported && included > 0) {
    S.reported = true;
    reportScore(correct, included);
  }
}
function reportScore(correct, total){
  var percent = Math.round((correct / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: EX.topicId,
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= EX.pass
    }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}
function summarizeAnswer(ex, a, mode){
  var v = mode === 'your' ? (a.locked ? a.locked.val : a.val) : null;
  function lim(s){ s = String(s); return s.length > 90 ? s.slice(0, 87) + '…' : s; }
  switch (ex.t) {
    case 'qcm':
      if (mode === 'your') return v ? lim(optTx(ex, v)) : '(no answer)';
      return lim(optTx(ex, ex.a));
    case 'multi': {
      var ids = mode === 'your' ? v : ex.a;
      return ids.length ? ids.map(function(id){ return lim(optTx(ex, id)); }).join(' · ') : '(no answer)';
    }
    case 'dnd': {
      var src = mode === 'your' ? v : ex.a;
      return ex.slots.map(function(s){ return esc(s.tx) + ' → ' + (src[s.id] ? esc(itemTx(ex, src[s.id])) : '—'); }).join('<br>');
    }
    case 'match': {
      var arr = mode === 'your' ? v : ex.a;
      return ex.lefts.map(function(L, li){ return esc(L) + ' → ' + (arr[li] >= 0 ? esc(ex.rights[arr[li]]) : '—'); }).join('<br>');
    }
    case 'order': case 'rank': {
      var list = mode === 'your' ? v : ex.items.map(function(o, i){ return i; });
      return list.map(function(ii, p){ return (p + 1) + '. ' + esc(ex.items[ii]); }).join('<br>');
    }
    case 'fib': {
      var words = mode === 'your' ? v : ex.a;
      return ex.a.map(function(w, g){ return 'Blank ' + (g + 1) + ': <code>' + esc(mode === 'your' ? (words[g] || '—') : w) + '</code>'; }).join('<br>');
    }
    case 'term':
      if (mode === 'your') return v.filter(function(l){ return l.indexOf('\u0001') !== 0 && l.indexOf('\u0002') !== 0; }).map(esc).join('<br>') || '(no commands typed)';
      return ex.tasks.map(function(t){ return '<code>' + esc(t.sol) + '</code>'; }).join('<br>');
    case 'logview': case 'spot': {
      var sel = mode === 'your' ? v : ex.bad;
      return sel.map(function(li){ return 'Line ' + (li + 1) + ': <code>' + esc(lim(ex.lines ? ex.lines[li] : ex.code[li])) + '</code>'; }).join('<br>') || '(none selected)';
    }
    case 'branch': {
      var arr2 = mode === 'your' ? v : null;
      return ex.steps.map(function(s, si){
        var txt;
        if (mode === 'your') txt = arr2[si] == null ? '—' : s.opts[arr2[si]].tx;
        else { var okO = s.opts.filter(function(o){ return o.ok; })[0]; txt = okO.tx; }
        return 'Step ' + (si + 1) + ': ' + esc(txt);
      }).join('<br>');
    }
    case 'sim': {
      var arr3 = mode === 'your' ? v : null;
      return ex.cards.map(function(c, ci){
        var txt;
        if (mode === 'your') txt = arr3[ci] == null ? '—' : c.opts[arr3[ci]].tx;
        else { var okO2 = c.opts.filter(function(o){ return o.ok; })[0]; txt = okO2.tx; }
        return 'Ticket ' + (ci + 1) + ': ' + esc(txt);
      }).join('<br>');
    }
  }
  return '';
}
function optTx(ex, id){ var o = ex.opts.filter(function(x){ return x.id === id; })[0]; return o ? o.tx : id; }
function itemTx(ex, id){ var o = ex.items.filter(function(x){ return x.id === id; })[0]; return o ? o.tx : id; }

function renderResults(rows, pts, correct, included, percent, passed, skippedList, reason){
  var r = $('results'); r.innerHTML = '';
  var pan = el('div', 'respanel ' + (passed ? 'pass' : 'fail'));
  pan.innerHTML = '<div class="bigp">' + percent + '%</div>' +
    '<div class="sub">' + (passed ? '🎉 PASS — well done. You reached the ' + EX.pass + '% pass mark.' : '✗ FAIL — you needed ' + EX.pass + '%. Review the report and retake the exam.') + '</div>' +
    '<div class="sub">Score: <b>' + pts.toFixed(2).replace(/\.00$/, '') + '</b> of ' + included + ' point' + (included === 1 ? '' : 's') + ' · ' + included + ' exercise' + (included === 1 ? '' : 's') + ' counted' +
    (skippedList.length ? ' · ' + skippedList.length + ' skipped (not counted)' : '') + '</div>' +
    (reason === 'time' ? '<div class="sub" style="color:var(--warn)">⏱ Time ran out — the exam ended automatically.</div>' : '') +
    '<div style="margin-top:14px"><button type="button" class="btn primary" id="btnRetake">↻ Retake Exam</button></div>';
  r.appendChild(pan);
  if (skippedList.length) {
    r.appendChild(el('div', 'sklist', '<b>⚠ Skipped exercises were excluded from scoring:</b> questions ' + skippedList.join(', ') + '. Their points are neither added to your score nor to the maximum. They still show full explanations below.'));
  }
  r.appendChild(el('h2', null, 'Detailed report'));
  rows.forEach(function(row, pos){
    var d = document.createElement('details'); d.className = 'rep';
    var lab, cls;
    if (!row.counted) { lab = row.label === 'skip' ? 'SKIPPED — NOT COUNTED' : 'UNANSWERED — NOT COUNTED'; cls = row.label === 'skip' ? 'skip' : 'na'; }
    else if (row.n === row.N) { lab = 'FULL'; cls = 'full'; }
    else if (row.n > 0) { lab = 'PARTIAL'; cls = 'part'; }
    else { lab = 'ZERO'; cls = 'zero'; }
    d.innerHTML = '<summary><span class="rlab ' + cls + '">' + lab + '</span> Q' + (pos + 1) + ' — ' + esc(row.ex.title) +
      '<span class="tagchip">' + esc(THEMES[row.ex.th].t) + '</span>' +
      '<span class="rpts">' + (row.counted ? row.earned.toFixed(2).replace(/\.00$/, '') + ' / 1 pt (' + row.n + '/' + row.N + ')' : 'not counted') + '</span></summary>';
    var body = el('div', 'rbody');
    body.appendChild(el('div', 'sec', '<span class="k">Your answer:</span>' + (row.counted ? summarizeAnswer(row.ex, row.a, 'your') : '(no answer — not counted)')));
    body.appendChild(el('div', 'sec', '<span class="k">Correct answer:</span>' + summarizeAnswer(row.ex, row.a, 'correct')));
    if (row.a.hints) body.appendChild(el('div', 'sec', '<span class="k">Hints used:</span>' + row.a.hints + ' (−' + (row.a.hints * 10) + '%)'));
    body.appendChild(el('div', 'exp', '<b>📘 Why:</b> ' + row.ex.ex));
    d.appendChild(body);
    r.appendChild(d);
  });
  var again = el('div', 'ctlbar', '<span class="spacer"></span>');
  var bt = mkBtn('↻ Retake Exam', 'btn primary', function(){ startExam(); });
  bt.id = 'btnRetake2';
  again.appendChild(bt);
  r.appendChild(again);
  var rb = $('btnRetake');
  if (rb) rb.addEventListener('click', function(){ startExam(); });
}

/* ---------------- submit / modal ---------------- */
function askSubmit(){
  if (S.finished) return;
  var unchecked = 0, skippedN = 0, answeredN = 0;
  S.order.forEach(function(ix){
    var a = S.ans[ix];
    if (a.locked) answeredN++;
    else if (a.skipped) skippedN++;
    else if (a.touched && touchedVal(E[ix], a.val)) answeredN++;
    else unchecked++;
  });
  if (answeredN === 0) { toast('Answer at least one exercise before submitting.'); return; }
  var m = $('modal'); m.hidden = false;
  $('mTitle').textContent = 'Submit exam?';
  $('mBody').innerHTML = '<p>Counted so far: <b>' + answeredN + '</b> answered · <b>' + skippedN + '</b> skipped · <b>' + unchecked + '</b> untouched.</p>' +
    (unchecked || skippedN ? '<p>Untouched and still-skipped exercises will be <b>excluded from scoring</b> (removed from both score and total). To count a skipped one, go back, answer it and press Check.</p>' : '<p>Everything is answered. Ready to submit.</p>') +
    '<p style="color:var(--tx2)">Remaining time: ' + fmtT(S.tLeft) + '.</p>';
  var bs = $('mBtns'); bs.innerHTML = '';
  var bc = mkBtn('Cancel', 'btn', function(){ m.hidden = true; });
  var bgo = mkBtn('Submit exam', 'btn primary', function(){ m.hidden = true; finish('submit'); });
  bs.appendChild(bc); bs.appendChild(bgo);
  bgo.focus();
}

  i.innerHTML = html;

function renderKeysPanel(){
  var kp = $('keysPanel');
  kp.innerHTML = '<div class="card" style="margin:8px 0">' + THEMES.map(function(t){ return '<div class="ktheme"><div class="kt">' + esc(t.t) + '</div>' + t.words.map(function(w){ return '<span class="kword">' + esc(w) + '</span>'; }).join('') + '</div>'; }).join('') + '</div>';

/* ---------------- wiring ---------------- */
document.addEventListener('DOMContentLoaded', function(){
  renderIntro(); renderKeysPanel();
  $('btnPause').addEventListener('click', function(){
    if (S.finished || !S.started) return;
    S.manualPause = !S.manualPause;
    if (S.manualPause && curAns().locked) { /* keep review marks; overlay hides them while paused */ }
    renderEx();
  });
  $('btnSubmit').addEventListener('click', askSubmit);
  $('btnKeys').addEventListener('click', function(){
    var kp = $('keysPanel');
    kp.hidden = !kp.hidden;
    $('btnKeys').setAttribute('aria-expanded', kp.hidden ? 'false' : 'true');
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && !$('modal').hidden) { $('modal').hidden = true; }
  });
  window.addEventListener('message', function(event){
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    try {
      if (event.data.username) {
        S.username = String(event.data.username).slice(0, 40);
        var c = $('candChip');
        c.textContent = '👤 ' + S.username;
        c.hidden = false;
      }
      /* event.data.theme is accepted but this file ships a single dark theme, so it is not applied. */
    } catch (e) {}
  });
});
/* debug/test hooks (harmless in production; used by the verification sandbox) */
window.__EXAM = S;
window.__EXAMEX = { E: E, computeScore: computeScore, finish: finish };
window.__examSetRemaining = function(sec){ S.tLeft = sec; $('tDisp').textContent = fmtT(sec); };

<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
