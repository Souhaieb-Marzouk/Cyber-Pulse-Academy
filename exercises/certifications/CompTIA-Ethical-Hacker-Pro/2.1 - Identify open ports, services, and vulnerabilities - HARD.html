function wireExercise(ex){
  var c=el('checkbtn');if(c)c.addEventListener('click',function(){onCheck(ex);});
  var r=el('revisebtn');if(r)r.addEventListener('click',function(){onRevise(ex);});
  var hb=el('hintbtn');if(hb)hb.addEventListener('click',function(){onHint(ex);});
  var sk=el('skipbtn');if(sk)sk.addEventListener('click',function(){onSkip(ex);});
  var pb=el('prevbtn');if(pb)pb.addEventListener('click',function(){navTo(S.cur-1);});
  var nb=el('nextbtn');if(nb)nb.addEventListener('click',function(){goNext(ex);});
  var sb=el('submitbtn');if(sb)sb.addEventListener('click',onSubmit);
  var grid=el('navgrid');
  if(grid)grid.addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]');if(b)navTo(parseInt(b.getAttribute('data-i'),10));
  });
  var aa=el('ansarea');if(!aa)return;
  wireType(ex,aa);
}
function wireType(ex,aa){
  if(aa.__wiredFor===ex.id){return;} /* rerenderAns reuses the same container — never stack listeners */
  aa.__wiredFor=ex.id;
  var id=ex.id;
  function touch(){S.touched[id]=true;}
  if(ex.tp==='qcm'||ex.tp==='multi'){
    aa.addEventListener('change',function(e){
      var t=e.target;if(locked(id))return;
      touch();
      if(ex.tp==='qcm'){S.ans[id]=parseInt(t.value,10);}
      else{
        var v=parseInt(t.value,10),arr=S.ans[id],ix=arr.indexOf(v);
        if(t.checked&&ix===-1)arr.push(v);
        if(!t.checked&&ix>-1)arr.splice(ix,1);
      }
    });
  }else if(ex.tp==='match'||ex.tp==='cat'){
    dragWire(ex,aa,touch);
  }else if(ex.tp==='order'||ex.tp==='rank'){
    aa.addEventListener('click',function(e){
      var up=e.target.closest('button[data-up]'),dn=e.target.closest('button[data-down]');
      if(locked(id))return;
      if(up){touch();var i=parseInt(up.getAttribute('data-up'),10);if(i>0){var a=S.ans[id],t2=a[i];a[i]=a[i-1];a[i-1]=t2;rerenderAns(ex);}}
      if(dn){touch();var j=parseInt(dn.getAttribute('data-down'),10);if(j<S.ans[id].length-1){var a2=S.ans[id],t3=a2[j];a2[j]=a2[j+1];a2[j+1]=t3;rerenderAns(ex);}}
    });
    orderDragWire(ex,aa,touch);
  }else if(ex.tp==='fib'){
    aa.addEventListener('change',function(e){var t=e.target.closest('select[data-bl]');if(t&&!locked(id)){touch();S.ans[id][parseInt(t.getAttribute('data-bl'),10)]=t.value;}});
    aa.addEventListener('input',function(e){var t=e.target.closest('input[data-bl]');if(t&&!locked(id)){touch();S.ans[id][parseInt(t.getAttribute('data-bl'),10)]=t.value;}});
  }else if(ex.tp==='terminal'){
    var inp=el('termin'),run=el('termrun');
    function go(){
      if(locked(id))return;
      var v=inp.value;
      if(!v.trim())return;
      inp.value='';
      touch();
      var out=el('termout');
      S.term[id].push('analyst@lab:~$ '+v);
      var ok=tokMatch(v,ex.ac);
      if(v.replace(/\s+/g,'').toLowerCase()==='clear'){S.term[id]=[];out.innerHTML='<span style="color:#7d8fa5"># goal: '+esc(ex.goal)+'</span>\n';return;}
      if(ok){S.ans[id].ok=true;S.term[id].push(ex.out);S.term[id].push('[lab] command accepted — press Check to score.');}
      else{S.term[id].push('bash: command not usable here — check the goal, the syntax, and the flags. Commands are case-sensitive.');}
      out.textContent='';out.innerHTML='<span style="color:#7d8fa5"># goal: '+esc(ex.goal)+'</span>\n';
      for(var i=0;i<S.term[id].length;i++){out.appendChild(document.createTextNode(S.term[id][i]));out.appendChild(document.createTextNode('\n'));}
      out.scrollTop=out.scrollHeight;
    }
    if(run)run.addEventListener('click',go);
    if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();go();}});
  }else if(ex.tp==='logview'){
    var fl=el('logfilter');
    if(fl)fl.addEventListener('input',function(){S.filter[id]=fl.value;el('loglist').innerHTML=logLinesHTML(ex);});
    aa.addEventListener('change',function(e){
      var t=e.target;if(locked(id))return;
      if(t.name&&t.name.indexOf('sub_'+id+'_')===0){
        touch();
        var qi=parseInt(t.name.split('_')[2],10),sb=ex.subs[qi];
        if(sb.k==='q'){S.ans[id]['s'+qi]=parseInt(t.value,10);}
        else{
          var v=parseInt(t.value,10),arr=S.ans[id]['s'+qi],ix=arr.indexOf(v);
          if(t.checked&&ix===-1)arr.push(v);if(!t.checked&&ix>-1)arr.splice(ix,1);
        }
      }
    });
    aa.addEventListener('input',function(e){var t=e.target.closest('input[data-sub]');if(t&&!locked(id)){touch();S.ans[id]['s'+parseInt(t.getAttribute('data-sub'),10)]=t.value;}});
  }else if(ex.tp==='spot'){
    aa.addEventListener('click',function(e){
      var b=e.target.closest('button[data-line]');if(!b||locked(id))return;
      touch();
      var li=parseInt(b.getAttribute('data-line'),10),arr=S.ans[id],ix=arr.indexOf(li);
      if(ix>-1)arr.splice(ix,1);else arr.push(li);
      b.classList.toggle('selc',ix===-1);
    });
  }else if(ex.tp==='steps'){
    aa.addEventListener('change',function(e){
      var t=e.target;if(locked(id))return;
      if(t.name&&t.name.indexOf('st_'+id+'_')===0){touch();var si=parseInt(t.name.split('_')[2],10);S.ans[id][si]=parseInt(t.value,10);}
    });
  }else if(ex.tp==='branch'){
    aa.addEventListener('change',function(e){
      var t=e.target;if(locked(id))return;
      if(t.name&&t.name.indexOf('st_'+id+'_')===0){
        touch();
        var si2=parseInt(t.name.split('_')[2],10);
        if(S.bst[id]===si2){S.ans[id][si2]=parseInt(t.value,10);rerenderAns(ex);}
      }
    });
    aa.addEventListener('click',function(e){
      var bn=e.target.closest?e.target.closest('#bstnext'):null;
      if(bn&&!locked(id)){S.bst[id]=Math.min(ex.steps.length-1,(S.bst[id]||0)+1);rerenderAns(ex);}
    });
  }
}
function rerenderAns(ex){
  var aa=el('ansarea');
  if(aa){aa.innerHTML=ansHTML(ex);wireType(ex,aa);}
  var grid=el('navgrid');if(grid)grid.innerHTML=navGridHTML();
}

/* drag & drop (mouse) + click-to-place (mouse/touch/keyboard) */
var selChip=null;
function dragWire(ex,aa,touch){
  var id=ex.id;
  aa.addEventListener('click',function(e){
    var chip=e.target.closest('button[data-chip]');
    if(chip){
      if(locked(id))return;
      touch();
      var ci=parseInt(chip.getAttribute('data-chip'),10);
      if(selChip!=null){
        var prev=aa.querySelector('button[data-chip][data-chip="'+selChip+'"]');
        if(prev)prev.classList.remove('sel');
        if(selChip===ci){selChip=null;chip.classList.remove('sel');return;}
      }
      selChip=ci;chip.classList.add('sel');
      return;
    }
    var slot=e.target.closest('[data-slot]');
    if(slot&&selChip!=null){
      if(locked(id))return;
      touch();
      placeChip(ex,parseInt(slot.getAttribute('data-slot'),10),selChip);
      var pc=aa.querySelector('button[data-chip].sel');if(pc)pc.classList.remove('sel');
      selChip=null;
    }
    var bank=e.target.closest('[data-bank]');
    if(bank&&selChip!=null&&e.target.closest('[data-drop]')===null&&e.target.closest('button[data-chip]')===null){
      if(locked(id))return;
      var arr=S.ans[id];
      if(ex.tp==='cat'){arr[selChip]=null;}
      else{for(var kk in arr){if(arr[kk]===selChip)arr[kk]=null;}}
      selChip=null;
      rerenderAns(ex);
      return;
    }
  });
  aa.addEventListener('dragstart',function(e){
    var chip=e.target.closest('button[data-chip]');if(!chip||locked(id))return;
    e.dataTransfer.setData('text/plain',chip.getAttribute('data-chip'));
    chip.classList.add('drag');
  });
  aa.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var slot=e.target.closest?e.target.closest('[data-slot]'):null;
    if(!slot||locked(id)||selChip==null)return;
    e.preventDefault();
    touch();
    placeChip(ex,parseInt(slot.getAttribute('data-slot'),10),selChip);
    selChip=null;
  });
  aa.addEventListener('dragend',function(e){var chip=e.target.closest('button[data-chip]');if(chip)chip.classList.remove('drag');});
  aa.addEventListener('dragover',function(e){var slot=e.target.closest('[data-slot]');if(slot){e.preventDefault();slot.classList.add('hl');}});
  aa.addEventListener('dragleave',function(e){var slot=e.target.closest('[data-slot]');if(slot)slot.classList.remove('hl');});
  aa.addEventListener('drop',function(e){
    var slot=e.target.closest('[data-slot]');if(!slot||locked(id))return;
    e.preventDefault();slot.classList.remove('hl');
    var ci=parseInt(e.dataTransfer.getData('text/plain'),10);
    if(isNaN(ci))return;
    touch();placeChip(ex,parseInt(slot.getAttribute('data-slot'),10),ci);
  });
}
function placeChip(ex,slotIdx,ci){
  var a=S.ans[ex.id];
  if(ex.tp==='cat'){ a[ci]=slotIdx; rerenderAns(ex); return; } /* cat answers map item -> category */
  for(var k in a){if(a[k]===ci)a[k]=null;}
  var cur=a[slotIdx];
  if(cur!=null&&cur!==ci){/* previous chip returns to bank automatically (not in a) */}
  a[slotIdx]=ci;
  rerenderAns(ex);
}

/* order drag (HTML5 on rows) */
function orderDragWire(ex,aa,touch){
  var dragIdx=null;
  aa.addEventListener('dragstart',function(e){
    var row=e.target.closest('.orow');if(!row||locked(ex.id))return;
    dragIdx=parseInt(row.getAttribute('data-pos'),10);
    e.dataTransfer.setData('text/plain',String(dragIdx));
  });
  aa.addEventListener('dragover',function(e){var row=e.target.closest('.orow');if(row)e.preventDefault();});
  aa.addEventListener('drop',function(e){
    var row=e.target.closest('.orow');if(!row||locked(ex.id)||dragIdx==null)return;
    e.preventDefault();
    var to=parseInt(row.getAttribute('data-pos'),10),a=S.ans[ex.id],it=a.splice(dragIdx,1)[0];
    a.splice(to,0,it);dragIdx=null;touch();rerenderAns(ex);
  });
}

/* ---------- feedback ---------- */
function correctBits(ex){
  switch(ex.tp){
    case 'qcm':return [{k:'0',t:ex.o[ex.a]}];
    case 'multi':return ex.a.map(function(i){return {k:'o'+i,t:ex.o[i]};});
    case 'match':return ex.pairs.map(function(p,i){return {k:'s'+i,t:p[0]+' → '+p[1]};});
    case 'cat':return ex.items.map(function(it,i){return {k:'c'+i,t:it.t+' → '+ex.cats[it.c]};});
    case 'order':case 'rank':return ex.items.map(function(it,i){return {k:'p'+i,t:(i+1)+'. '+it};});
    case 'fib':return ex.blanks.map(function(b,i){return {k:'b'+i,t:b.ans||b.o[b.a]};});
    case 'terminal':return [{k:'0',t:ex.ansKey||'the command described in the goal'}];
    case 'logview':return ex.subs.map(function(s,i){return {k:'s'+i,t:s.k==='q'?s.o[s.a]:(s.k==='m'?s.a.map(function(x){return s.o[x];}).join('; '):s.ans)};});
    case 'spot':return ex.lines.map(function(l,i){return l.bad?{k:'l'+i,t:l.t}:null;}).filter(Boolean);
    case 'steps':case 'branch':return ex.steps.map(function(s,i){return {k:'t'+i,t:s.o[s.a].t||s.o[s.a]};});
  }
  return [];
}
function feedbackHTML(ex,g){
  var r=S.res[ex.id];
  var h='<section class="fb" aria-live="polite">';
  h+='<h4>'+(g.hits===g.n?ICON.ok+' Result':'Result')+' — <span class="score">you earned '+r.earned+' / '+r.max+' points</span>'+(r.pen>0?' <span style="color:var(--warn);font-size:13.5px">(includes −'+r.pen+' hint penalty)</span>':'')+'</h4>';
  if(g.hits===0&&g.n>1)h+='<p style="color:var(--bad);font-weight:700">'+ICON.bad+' Zero on this exercise — read the notes below before moving on.</p>';
  if(g.hits===g.n&&g.n>0)h+='<p style="color:var(--ok);font-weight:700">'+ICON.ok+' Full points on this exercise.</p>';
  if(g.hits>0&&g.hits<g.n)h+='<p style="color:var(--warn);font-weight:700">'+ICON.part+' Partial credit — some elements were right, some were missed or wrong.</p>';
  var cb=correctBits(ex);
  if(cb.length&&cb.length<=8){
    h+='<ul class="why">';
    for(var i=0;i<cb.length;i++){h+='<li>'+ICON.ok+' <b>Expected:</b> '+cb[i].t+'</li>';}
    h+='</ul>';
  }
  if(ex.why){
    h+='<ul class="why">';
    for(var k in ex.why){h+='<li>'+esc(ex.why[k])+'</li>';}
    h+='</ul>';
  }
  h+='<p class="expl">'+ex.expl+'</p>';
  if(ex.tip)h+='<p class="tip">'+ICON.part+' <b>Focus next time:</b> '+esc(ex.tip)+'</p>';
  h+='<p style="font-size:13px;color:var(--dim);margin-top:10px">'+ICON.part+' Timer paused — review mode. The clock restarts when you press Next or navigate to another exercise.</p>';
  h+='</section>';
  return h;
}
function renderFeedbackIfAny(ex){
  var host=el('fbhost');if(!host)return;
  if(S.res[ex.id]&&S.checked[ex.id]&&!S.revised[ex.id]){
    var g=grade(ex);
    host.innerHTML=feedbackHTML(ex,g);
    paintMarks(ex,g);
  }
}
function paintMarks(ex,g){
  var aa=el('ansarea');if(!aa)return;
  if(ex.tp==='qcm'||ex.tp==='multi'){
    var labs=aa.querySelectorAll('.opt');
    for(var i=0;i<labs.length;i++){
      var oi=labs[i].getAttribute('data-oi'),st=g.marks['o'+oi];
      if(st){labs[i].classList.add('m-'+st);var m=labs[i].querySelector('.mk');if(m)m.innerHTML=mkSpan(st);}
    }
  }else if(ex.tp==='match'||ex.tp==='cat'){
    var chips=aa.querySelectorAll('button[data-chip]');
    for(var c=0;c<chips.length;c++){
      var ci=chips[c].getAttribute('data-chip');
      var key=ex.tp==='match'?('s'+findSlotOf(ex,ci)):('c'+ci);
      if(g.marks[key]){chips[c].classList.add('m-'+g.marks[key]);}
    }
    var slots=aa.querySelectorAll('[data-slot]');
    for(var s=0;s<slots.length;s++){
      var si=slots[s].getAttribute('data-slot'),key2=ex.tp==='match'?('s'+si):null;
      if(key2&&g.marks[key2]){
        var m2=slots[s].querySelector('.mk');
        if(m2&&m2.innerHTML==='')m2.innerHTML=mkSpan(g.marks[key2]);
        else if(m2)m2.innerHTML=mkSpan(g.marks[key2]);
      }
    }
  }else if(ex.tp==='order'||ex.tp==='rank'){
    var rows=aa.querySelectorAll('.orow');
    for(var r=0;r<rows.length;r++){
      var pos=rows[r].getAttribute('data-pos'),st2=g.marks['p'+pos];
      if(st2){rows[r].classList.add('m-'+st2);var m3=rows[r].querySelector('.mk');if(m3)m3.innerHTML=mkSpan(st2);}
    }
  }else if(ex.tp==='fib'){
    var ws=aa.querySelectorAll('.bwrap');
    for(var w=0;w<ws.length;w++){
      var bi=ws[w].querySelector('[data-bl]');if(!bi)continue;
      var st3=g.marks['b'+bi.getAttribute('data-bl')];
      if(st3){bi.classList.add('m-'+st3);var m4=ws[w].querySelector('.mk');if(m4)m4.innerHTML=mkSpan(st3);}
    }
  }else if(ex.tp==='terminal'){
    var m5=aa.querySelector('.mk[data-mk="0"]');if(m5)m5.innerHTML=mkSpan(g.marks['0']);
  }else if(ex.tp==='logview'){
    for(var q=0;q<ex.subs.length;q++){
      var sq=aa.querySelectorAll('.subq')[q];
      if(sq&&g.marks['s'+q]){var h4=sq.querySelector('h4');if(h4)h4.innerHTML+=' '+mkSpan(g.marks['s'+q]);}
      var sqm=sq?sq.querySelector('.mk[data-mk="s'+q+'"]'):null;
      if(sqm)sqm.innerHTML=mkSpan(g.marks['s'+q]);
    }
  }else if(ex.tp==='spot'){
    var sl=aa.querySelectorAll('button[data-line]');
    for(var l=0;l<sl.length;l++){
      var li=sl[l].getAttribute('data-line'),st4=g.marks['l'+li];
      if(st4){sl[l].classList.add('m-'+st4);var m6=sl[l].querySelector('.mk');if(m6)m6.innerHTML=mkSpan(st4);}
    }
  }else if(ex.tp==='steps'||ex.tp==='branch'){
    var steps=aa.querySelectorAll('.step');
    for(var t=0;t<steps.length;t++){
      if(g.marks['t'+t]){var h5=steps[t].querySelector('h4');if(h5)h5.innerHTML+=' '+mkSpan(g.marks['t'+t]);}
    }
  }
}
function findSlotOf(ex,ci){
  var a=S.ans[ex.id];
  for(var k in a){if(a[k]===ci)return k;}
  return '-1';
}

/* ---------- actions ---------- */
function onCheck(ex){
  doGrade(ex);
  S.t.check=true;
  renderExam();updateTop();
}
function onRevise(ex){
  if(!S.checked[ex.id])return;
  S.revised[ex.id]=true;
  delete S.res[ex.id];
  recomputeScore();
  renderExam();updateTop();
}
function onHint(ex){
  if((S.hinted[ex.id]||0)>=ex.hx.length)return;
  S.hinted[ex.id]=(S.hinted[ex.id]||0)+1;
  if(S.checked[ex.id]){doGrade(ex);S.t.check=true;}
  renderExam();updateTop();
}
function onSkip(ex){
  if(!(S.res[ex.id]&&S.checked[ex.id]&&!S.revised[ex.id])){S.skipped[ex.id]=true;}
  advance();
}
function goNext(ex){
  if(S.cur<EX.length-1){S.cur++;S.t.check=false;renderExam();updateTop();}
}
function navTo(i){
  if(!S.order.length||i<0||i>=EX.length)return;
  S.cur=i;S.t.check=false;
  renderExam();updateTop();
}
function advance(){
  if(S.cur<EX.length-1){S.cur++;}
  S.t.check=false;
  renderExam();updateTop();
}
function onSubmit(){
  var answered=0,touchedOpen=0,skipped=0,untouched=0;
  for(var i=0;i<EX.length;i++){
    var id=EX[i].id;
    if(S.checked[id]&&!S.revised[id])answered++;
    else if(S.skipped[id])skipped++;
    else if(hasAnswer(EX[i])||S.touched[id])touchedOpen++;
    else untouched++;
  }
  if(answered===0&&touchedOpen===0){
    openModal('Nothing answered yet','You have not answered or checked any exercise. Please answer at least one exercise before submitting. Skipped-only exams cannot be scored.',[{t:'Back to the exam',cls:'primary',fn:closeModal}]);
    return;
  }
  var msg='Checked: '+answered+'. Answered but not yet checked: '+touchedOpen+' (graded as they stand). Skipped: '+skipped+' and untouched: '+untouched+' (both excluded from scoring). Submit now?';
  openModal('Submit the exam?',msg,[
    {t:'Cancel',cls:'',fn:closeModal},
    {t:'Submit final answers',cls:'primary',fn:function(){closeModal();finishExam();}}
  ]);
}
function finishExam(){
  closeModal();
  for(var i=0;i<EX.length;i++){
    var ex=EX[i];
    if(S.skipped[ex.id])continue; /* a skip flag always keeps the exercise out of scoring */
    if(!(S.checked[ex.id]&&!S.revised[ex.id])&&(hasAnswer(ex)||S.touched[ex.id])){
      doGrade(ex);
    }
  }
  S.t.check=false;S.t.manual=false;
  S.scr='done';
  render();
  reportScoreOnce();
}
function computedTotals(){
  var earned=0,total=0,counted=0,rows=[];
  for(var i=0;i<S.order.length;i++){
    var ex=EX[S.order[i]],id=ex.id,r=S.res[id];
    var isCounted=!!(S.checked[id]&&!S.revised[id]&&r);
    if(isCounted){earned+=r.earned;total+=r.max;counted++;}
    var lbl=isCounted?(r.earned>=r.max?'full':(r.earned>0?'partial':'zero')):(S.skipped[id]?'skipped':'unanswered');
    rows.push({ex:ex,r:r||null,lbl:lbl,idx:i+1});
  }
  earned=r1(earned);
  var percent=(total>0)?Math.round(Math.round(earned)/total*100):0;
  return {earned:Math.round(earned),total:total,counted:counted,percent:percent,passed:percent>=PASSM,rows:rows};
}
function reportScoreOnce(){
  if(S.reported)return;
  var t=computedTotals();
  if(t.total<=0)return;
  S.reported=true;
  var score=t.earned,total=t.total,percent=t.percent;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:TOPIC,score:score,total:total,percent:percent,passed:percent>=70},location.origin);
  }catch(e){}
}
function answerSummary(ex){
  var a=S.ans[ex.id];
  switch(ex.tp){
    case 'qcm':return a==null?'(no answer)':ex.o[a];
    case 'multi':return (a&&a.length)?a.map(function(i){return ex.o[i];}).join(' | '):'(no answer)';
    case 'match':{var parts=[];for(var s=0;s<ex.pairs.length;s++){parts.push(ex.pairs[s][0]+' → '+(a[s]!=null?ex.pairs[a[s]][1]:'(empty)'));}return parts.join(' | ');}
    case 'cat':{var p2=[];for(var c=0;c<ex.items.length;c++){p2.push(ex.items[c].t+' → '+(a[c]!=null?ex.cats[a[c]]:'(none)'));}return p2.join(' | ');}
    case 'order':case 'rank':return a.map(function(i,p3){return (p3+1)+'. '+ex.items[i];}).join(' | ');
    case 'fib':return a.map(function(v,i){return 'blank '+(i+1)+': '+(v===''?'(empty)':v);}).join(' | ');
    case 'terminal':return (a&&a.ok)?'a command that met the goal':'(no valid command)';
    case 'logview':{var p4=[];for(var q=0;q<ex.subs.length;q++){var v=a['s'+q];p4.push((q+1)+': '+(ex.subs[q].k==='q'?(v==null?'(none)':ex.subs[q].o[v]):ex.subs[q].k==='m'?((v&&v.length)?v.map(function(x){return ex.subs[q].o[x];}).join('; '):'(none)'):(v||'(empty)')));}return p4.join(' | ');}
    case 'spot':return (a&&a.length)?a.map(function(i){return 'line '+(i+1);}).join(', '):'(no line selected)';
    case 'steps':case 'branch':{var p5=[];for(var s2=0;s2<ex.steps.length;s2++){p5.push('step '+(s2+1)+': '+(a[s2]!=null?(ex.steps[s2].o[a[s2]].t||ex.steps[s2].o[a[s2]]):'(none)'));}return p5.join(' | ');}
  }
  return '';
}
function renderResults(){
  var t=computedTotals();
  var h='<section class="res-hero '+(t.passed?'pass':'fail')+'">';
  h+='<div class="pct">'+t.percent+'%</div>';
  h+='<div class="verdict '+(t.passed?'pass':'fail')+'">'+(t.passed?ICON.ok+' PASS':'✕ FAIL')+' — pass mark '+PASSM+'%</div>';
  h+='<p class="certs">'+t.earned+' / '+t.total+' points over '+t.counted+' counted exercise'+(t.counted===1?'':'s')+' (skipped and untouched exercises are excluded from both numbers). '+DIFFU+' severity · Ethical Hacker Pro 2.1.</p>';
  if(t.passed){h+='<p class="certs">'+ICON.ok+' Certificate-style success: you reached the pass mark for this chapter objective.</p>';}
  else{h+='<p class="certs">You must retake this exam to reach '+PASSM+'%. Review the report below, then press Retake Exam — questions and choices will be reshuffled.</p>';}
  h+='</section>';
  var skippedList=[];
  for(var i=0;i<t.rows.length;i++){if(t.rows[i].lbl==='skipped'||t.rows[i].lbl==='unanswered')skippedList.push(t.rows[i].idx);}
  if(skippedList.length){
    h+='<section class="rules"><h2>'+ICON.skip+' Excluded from scoring</h2><p style="font-size:14.5px;color:var(--mut)">Exercises '+skippedList.join(', ')+' were skipped or never answered. Their points are not counted in the score or in the total.</p></section>';
  }
  h+='<section class="rules"><h2>Progress by theme</h2><table class="ttab"><tr><th>Theme</th><th>Full</th><th>Partial</th><th>Zero</th><th>Excluded</th></tr>';
  for(var th=1;th<=6;th++){
    var f=0,p=0,z=0,x=0;
    for(var j=0;j<t.rows.length;j++){
      if(t.rows[j].ex.th!==th)continue;
      var L=t.rows[j].lbl;
      if(L==='full')f++;else if(L==='partial')p++;else if(L==='zero')z++;else x++;
    }
    h+='<tr><td>'+esc(THEMES[th])+'</td><td>'+f+'</td><td>'+p+'</td><td>'+z+'</td><td>'+x+'</td></tr>';
  }
  h+='</table></section>';
  h+='<section class="rules"><h2>Detailed report</h2>';
  for(var r=0;r<t.rows.length;r++){
    var row=t.rows[r],ex=row.ex,res=row.r;
    h+='<div class="rrow"><div class="rh"><b>['+row.idx+'] '+esc(ex.ti)+'</b><span><span class="lbl '+row.lbl+'">'+row.lbl+'</span> <b class="mono" style="font-size:14px">'+(res?res.earned:0)+'/'+ex.pts+' pts</b></span></div>';
    h+='<div class="ra"><b>Your answer:</b> '+esc(answerSummary(ex))+'</div>';
    if(row.lbl==='skipped'||row.lbl==='unanswered'){
      h+='<div class="ra" style="color:var(--warn)">'+ICON.skip+' Not counted — '+(row.lbl==='skipped'?'you skipped it':'you never answered it')+'. The explanation below still teaches the point.</div>';
    }else{
      var cb=correctBits(ex);
      h+='<div class="ra"><b>Expected answer:</b> '+esc(cb.map(function(c){return c.t;}).join(' | '))+'</div>';
    }
    h+='<div class="rex">'+ex.expl+(ex.tip?' <b style="color:var(--warn)">Focus:</b> '+esc(ex.tip):'')+'</div></div>';
  }
  h+='</section>';
  h+='<section class="rules"><button class="btn primary bigstart" id="retakebtn">Retake Exam</button></section>';
  el('stage').innerHTML=h;
  var rb=el('retakebtn');
  if(rb)rb.addEventListener('click',function(){
    openModal('Retake the exam?','All answers, pauses, skips and the timer will be reset. Questions and answer choices will be reshuffled.',[
      {t:'Cancel',cls:'',fn:closeModal},
      {t:'Retake',cls:'primary',fn:function(){closeModal();startExam(true);}}
    ]);
  });
}

/* ---------- modal ---------- */
var modalBtns=[];
function openModal(title,body,btns){
  modalBtns=btns;
  var host=el('modalhost');
  var h='<div class="modalbg" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal"><h3>'+esc(title)+'</h3><p>'+body+'</p><div class="mrow">';
  for(var i=0;i<btns.length;i++){h+='<button class="btn '+(btns[i].cls||'')+'" data-mi="'+i+'">'+esc(btns[i].t)+'</button>';}
  h+='</div></div></div>';
  host.innerHTML=h;
}
function closeModal(){modalBtns=[];el('modalhost').innerHTML='';}
el('modalhost').addEventListener('click',function(e){
  var b=e.target.closest('button[data-mi]');
  if(!b)return;
  var i=parseInt(b.getAttribute('data-mi'),10);
  var entry=modalBtns[i];
  closeModal();
  if(entry&&entry.fn)entry.fn();
});

/* ---------- timer ---------- */
var iv=setInterval(function(){
  if(!S||S.scr!=='exam')return;
  if(S.t.manual||S.t.check)return;
  if(S.t.left<=0)return;
  S.t.left--;
  updateTop();
  if(S.t.left<=0){finishExam();}
},1000);

/* ---------- manual pause ---------- */
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='pausebtn'){
    if(!S||S.scr!=='exam')return;
    S.t.manual=!S.t.manual;
    render();updateTop();
  }
});

/* ---------- flow ---------- */
function startExam(isRetake){
  S=freshState();
  S.scr='exam';
  S.order=shuffle(EX.map(function(_,i){return i;}));
  buildPerms();
  render();updateTop();
}

/* ---------- website handshake ---------- */
window.addEventListener('message',function(event){
  if(!event.data)return;
  if(event.data.type!=='CYBERPULSE_INIT'&&event.data.type!=='CYBERMASTERY_INIT')return;
  try{
    if(S){S.user=event.data.username||'';if(S.scr==='intro')render();}
  }catch(e){}
});

/* ---------- boot ---------- */
S=freshState();
render();

/* debug/automation hook (no effect on normal use) */
window.__EH={get S(){return S;},set S2(v){S=v;},EX:EX,check:function(){onCheck(curEx());},next:function(){goNext(curEx());},skip:function(){onSkip(curEx());},finish:finishExam,start:startExam,totals:computedTotals,grade:grade,hasAnswer:hasAnswer,nav:navTo};
})();

</script>
</body>
</html>
