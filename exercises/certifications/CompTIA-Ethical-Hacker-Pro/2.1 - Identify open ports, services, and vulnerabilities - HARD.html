<script>
"use strict";
var EX=[];
/* HARD exercises 1-4: idle-scan zombie choice, decoy TTL logview, scan-signature match, scan-plan spot */
EX.push(
{
 id:'h01',th:1,tp:'qcm',pts:2,ti:'Choosing the zombie for an idle scan',
 sc:'<p>You are authorized to test the DMZ but your source address is watched by a strict sensor pair. The notes suggest an idle scan (<code>-sI</code>) so the probes appear to come from a third host. Four candidate zombies are reachable; their properties are on the table.</p>',
 q:'<p>Which candidate is the right zombie, and why?</p>',
 o:[
  'A quiet print server whose IP ID counter rises by exactly one between probes',
  'A busy mail gateway whose IP ID jumps by hundreds between probes because of its own traffic',
  'A domain controller — its OS matches the target, so replies look natural',
  'A host that answers every ping in under a millisecond, whatever else it does'
 ],
 a:0,
 expl:'Idle scans read the zombie\'s <b>IP ID</b> counter like a counter on a door. You probe the target as if from the zombie; if the port is open, the target SYN-ACKs the zombie, which replies with RST and burns one ID. Watching the ID tells you open from closed. That only works when the counter moves predictably — <b>quiet</b> host, <b>incrementing</b> IDs. A busy gateway burns IDs unpredictably and ruins the reading. Matching OS or ping speed decides nothing here.',
 tip:'The zombie must be idle and predictable — every packet it sends between your probes corrupts the count.',
 why:{
  w1:'A fast pinger with random ID churn is the worst zombie, not the best one.',
  w2:'OS similarity is irrelevant; predictability of the IP ID sequence is everything.'
 },
 hx:['The whole technique is named after how much the zombie does between your probes.']
},
{
 id:'h02',th:5,tp:'logview',pts:4,ti:'Four scanners, one real',
 sc:'<p>The client\'s firewall logged simultaneous probes against 3389/tcp from four sources. The SOC suspects a coordinated scan. You are asked to identify the <b>real</b> source before anyone blocks the wrong host. TTL values in the replies are your evidence — the source segment sits one hop from the firewall, and its hosts start TTL at 64.</p>',
 q:'<p>Filter the log if useful, then answer the two questions.</p>',
 log:[
  {s:'info',l:'fw-edge: denied/proxy lines for dst-port 3389, window 14:02:10 - 14:02:40'},
  {s:'warn',l:'14:02:10 SYN 3389/tcp src 10[.]30[.]1[.]44 ttl 117 -> dst 10[.]30[.]9[.]5'},
  {s:'warn',l:'14:02:11 SYN 3389/tcp src 10[.]30[.]1[.]44 ttl 116 -> dst 10[.]30[.]9[.]5'},
  {s:'warn',l:'14:02:12 SYN 3389/tcp src 10[.]30[.]1[.]51 ttl 63 -> dst 10[.]30[.]9[.]5'},
  {s:'warn',l:'14:02:13 SYN 3389/tcp src 10[.]30[.]1[.]51 ttl 63 -> dst 10[.]30[.]9[.]5'},
  {s:'warn',l:'14:02:14 SYN 3389/tcp src 10[.]30[.]1[.]77 ttl 251 -> dst 10[.]30[.]9[.]5'},
  {s:'warn',l:'14:02:15 SYN 3389/tcp src 10[.]30[.]1[.]77 ttl 251 -> dst 10[.]30[.]9[.]5'},
  {s:'warn',l:'14:02:16 SYN 3389/tcp src 10[.]30[.]1[.]90 ttl 64 -> dst 10[.]30[.]9[.]5'},
  {s:'warn',l:'14:02:17 SYN 3389/tcp src 10[.]30[.]1[.]90 ttl 64 -> dst 10[.]30[.]9[.]5'},
  {s:'info',l:'SOC note: only one of these hosts exists in asset inventory with a scan authorization (SC-W-2211)'}
 ],
 subs:[
  {k:'q',q:'Which source is most likely the real scanner, based on the TTL evidence?',o:[
    '10[.]30[.]1[.]51 — TTL 63 means it started at 64 and crossed one hop',
    '10[.]30[.]1[.]44 — the first source seen is always the real one',
    '10[.]30[.]1[.]77 — the source with the highest TTL wins',
    'All four are real — decoys do not produce log lines'],a:0},
  {k:'q',q:'What does the TTL pattern across all four sources tell you about the technique?',o:[
    'Decoy scanning — implausible TTLs on spoofs, one plausible source',
    'Four independent attackers — the TTL values prove four operating systems',
    'An idle scan — the TTL values prove a zombie was used',
    'A broken firewall duplicating the same log lines'],a:0}
 ],
 expl:'TTL is physical evidence: a packet that crosses hops loses one per router. With Linux-like hosts starting at 64, a source one hop away shows 63 — exactly what 10[.]30[.]1[.]51 shows. The decoys show impossible or suspicious values: 251 for an internal host, 116-117 drifting per packet (a TTL cannot change between packets on the same path), and 64 means zero hops — impossible from a segment one hop away. Consistency plus plausibility identifies the real probe; inventory then confirms it. This is how analysts unmask <b>decoy</b> scanning (<code>-D</code>) — the spoofed sources are loud, but they cannot fake the physics.',
 tip:'Spoofed packets can fake any address — they cannot fake the hop count their TTL reveals.',
 why:{
  w2:'Decoy sources do produce log lines — that is the entire point of using them.',
  w3:'Idle scans show probes from the zombie, not four hosts with mixed TTLs.'
 },
 hx:['Start each OS family at its usual TTL (64/128/255) and subtract the hops.','Only one candidate has a TTL that a real, nearby Linux host could produce.']
},
{
 id:'h03',th:1,tp:'match',pts:5,ti:'Read the scan from its signature',
 sc:'<p>You sit with the blue team during a purple-team day. The sensor console shows five captured scan signatures, and the task is to name the technique from the wire evidence alone — no scanner output, just what the packets did.</p>',
 q:'<p>Match each wire signature to the technique that produced it.</p>',
 pairs:[
  ['Full handshake to every probed port, then immediate close','TCP Connect scan (-sT) — a real, complete connection per port'],
  ['SYN sent, SYN-ACK received, RST sent without completing','SYN (half-open) scan (-sS)'],
  ['Probe carries no TCP flags at all; open ports stay silent','NULL scan (-sN)'],
  ['Probes arrive from five different source addresses at once','Decoy scan (-D) — one real source among spoofed ones'],
  ['Probes appear to come from a third host whose IP ID counter increments','Idle scan (-sI) through a zombie']
 ],
 expl:'Every scan type has a fingerprint. A full three-way handshake that closes right away is the Connect scan — reliable, but logged by almost every service. SYN-then-RST is the half-open scan\'s mark. A probe with <b>no flags at all</b> is the NULL scan: well-behaved old stacks ignore it on open ports and answer closed ones, which is the signal. Several simultaneous sources mean decoys. Probes from a third host with a marching IP ID counter mean an idle scan. Reading signatures turns the blue team from "we were scanned" into "we were scanned <i>this</i> way" — which decides what it means.',
 tip:'Ask three questions: which flags, how many sources, whose stack answered. The answer names the scan.',
 why:{
  w1:'NULL and Xmas differ only in flags (none vs FIN/PSH/URG) — both stay silent on open ports of RFC-style stacks.'
 },
 hx:['Two signatures are about identity (sources), three about flags and handshakes.','The quietest scan leaves the least complete handshake — or none at all.']
},
{
 id:'h04',th:6,tp:'spot',pts:2,ti:'Spot the mistake: the evasion plan',
 sc:'<p>A tester on your team drafted this plan to reduce detection on the next window. The lead asks you to review it before anything runs. Two lines are technically wrong or break the engagement — find them.</p>',
 q:'<p>Click the <b>two</b> lines that contain mistakes.</p>',
 lines:[
  {t:'PLAN EV-19 — detection-aware pass over 10[.]40[.]2[.]0/24, window approved',bad:false},
  {t:'1. Primary technique: FIN scan (-sF), expected to separate open from closed on the Windows farm',bad:true},
  {t:'2. Add decoys with -D RND:5 so alerts distribute across random addresses',bad:false},
  {t:'3. Also add the client\'s two production application servers as decoy sources',bad:true},
  {t:'4. Keep timing at -T2 to stay under threshold',bad:false},
  {t:'5. Log the evasion techniques used in the working notes',bad:false}
 ],
 expl:'Line 1 wastes the window: <b>Windows stacks reset FIN probes for open and closed ports alike</b>, so the scan cannot separate the two — it returns a wall of "closed" and teaches you nothing. Line 3 breaks the rules: putting the client\'s <b>production servers</b> into the decoy list means spoofing their addresses, which frames innocent machines in the client\'s own logs — testers use random decoys (<code>RND</code>), never the client\'s real, blameless systems. Random decoys, slow timing, and honest notes are all fine; a technically useless scan and a trust violation are not.',
 tip:'Two checks before any evasion line: does it technically work against that stack, and does it survive the ethics test?',
 why:{
  w2:'Decoys must not be identifiable third parties — RND:5 exists precisely so nobody real gets blamed.'
 },
 hx:['Which operating system family ignores FIN probes?','Read the decoy line again — whose addresses are being used?']
}
);
/* HARD exercises 5-8: tcpdump BPF fib, open|filtered branch, false-results multi, CVSS PR qcm */
EX.push(
{
 id:'h05',th:5,tp:'fib',pts:3,ti:'Write the detector yourself',
 sc:'<p>The blue team asks you to leave behind a detection before the assessment ends. The goal: catch <b>SYN scans</b> on the wire with tcpdump — packets with the SYN flag set but <b>without</b> the ACK flag, which is what half-open scanning looks like. The template is on the whiteboard; three parts are blank.</p>',
 q:'<p>Complete the capture filter. Choose the three missing pieces.</p>',
 fhtml:'<code>tcpdump -i eth0 {{b0}} &amp; {{b1}} != 0 and tcp[tcpflags] &amp; {{b2}} == 0</code>',
 blanks:[
  {k:'s',o:['tcp[tcpflags]','tcp[port]','ip[flags]','tcp[window]'],a:0},
  {k:'s',o:['tcp-syn','tcp-ack','tcp-fin','tcp-rst'],a:0},
  {k:'s',o:['tcp-ack','tcp-syn','tcp-push','tcp-urg'],a:0}
 ],
 expl:'The BPF syntax reads the TCP flags byte directly: <code>tcp[tcpflags]</code> selects that byte, and masking it with <code>tcp-syn</code> keeps only packets whose SYN bit is set. The second half masks the same byte with <code>tcp-ack</code> and requires the result to be <b>zero</b> — no ACK bit. Together: SYN present, ACK absent. A normal client\'s first packet matches too, which is why real sensors add thresholds (many such packets to many ports); but as the raw primitive, this is the half-open scan\'s shape. Port, window and IP-flag fields do not carry the handshake state.',
 tip:'BPF flag math is just bit masks: name the byte (tcpflags), then AND it with the bit you care about.',
 why:{
  w1:'The flags byte lives in the TCP header, so the selector is tcp[tcpflags] — window and port values say nothing about handshake state.'
 },
 hx:['The selector must name the TCP header\'s flags byte.','First blank pair: the bit we want SET. Second pair: the bit we want CLEAR.']
},
{
 id:'h06',th:1,tp:'branch',pts:3,ti:'Branching: the wall of open|filtered',
 sc:'<p>Your SYN scan of <code>bastion01.corp.local</code> reports <b>all 1,000 probed ports open|filtered</b> — a wall of ambiguity. The client says a filtering device sits in front of the host. You decide the path step by step.</p>',
 q:'<p>Decide step by step. Your choice at each step moves the work forward.</p>',
 steps:[
  {p:'Every port is open|filtered and the discovery ping answered. What does this pattern suggest?',o:[
    {t:'The host is down or unreachable right now',out:'A down host would not answer discovery at all. The wall means answers are being suppressed, not that the host is gone.'},
    {t:'A stateless filter is silently dropping most of the probes',out:'This is the classic shape: no RST, no SYN-ACK, just silence from a filter that eats everything — and nmap cannot tell open from filtered. You need a probe that forces the filter to react.'},
    {t:'All 1,000 services genuinely run and simply stay silent',out:'Technically possible, operationally absurd. Diagnose the filter first.'}],a:1},
  {p:'Which scan do you run next to map the filtering device\'s rules?',o:[
    {t:'A UDP scan (-sU) to get a second opinion on the ports',out:'UDP gives you a second wall of open|filtered — it adds noise, not knowledge.'},
    {t:'An ACK scan (-sA) to map what the filter passes and what it drops',out:'The ACK scan speaks to firewalls: stateless devices pass ACKs, the host answers RST, and nmap marks unfiltered. Ports the filter eats stay filtered. The ruleset takes shape.'},
    {t:'A Connect scan (-sT), it is the most reliable anyway',out:'Connect hits the same silent wall — full handshakes die at the filter exactly like SYNs did.'}],a:1},
  {p:'The ACK scan shows 22/tcp and 443/tcp unfiltered, everything else filtered. What is the honest conclusion?',o:[
    {t:'22 and 443 are confirmed as open and running services',out:'Unfiltered means "reachable through the ruleset" — an ACK scan can never confirm a service listens there. Say reachable, not open.'},
    {t:'22 and 443 pass the filter; their service state needs a service-aware probe',out:'Exactly. ACK scan maps rules, not services. A quick banner grab or Connect attempt to those two ports settles the service question, and the rest is filtered by design.'},
    {t:'The results contradict each other; rescan the host with -T5',out:'Faster probing through the same filter reproduces the same wall. Interpret what you have.'}],a:1}
 ],
 expl:'A wall of open|filtered is not a dead end — it is the filter telling you it is there. The <b>ACK scan</b> exists precisely for this: stateless filters pass ACK packets, the host itself replies RST, and nmap reports <b>unfiltered</b>, meaning "the ruleset let it through, nothing more". Unfiltered is <i>not</i> open — only a service-aware check (banner grab, Connect) confirms a listener. This layering — map the filter with ACK, then confirm services — turns an ambiguous scan into a precise picture of both the ruleset and the services behind it.',
 tip:'ACK scan = firewall cartography. Service truth = handshake or banner. Two different jobs.',
 why:{
  w1:'Unfiltered and open are different verdicts; confusing them is the classic report error.'
 },
 hx:['One scan type is designed to talk to firewall rulesets rather than services.','"Unfiltered" answers a different question than "open".']
},
{
 id:'h07',th:4,tp:'multi',pts:4,ti:'When the scanner lies',
 sc:'<p>The client disputes three findings from last quarter: "We verified those systems ourselves — the scanner is wrong." Before the dispute meeting, you list the known ways scanner output misrepresents reality. Four of the six causes on your list are real; two are not.</p>',
 q:'<p>Select every cause that genuinely produces false or misleading scan results.</p>',
 o:[
  'A banner was swapped for a patched version\'s string; the old binary still runs',
  'A WAF intercepts the scanner\'s web checks and answers for the application',
  'The "host" the scanner profiled is actually a honeypot imitating a real server',
  'A credentialed scan ran with a service account lacking rights to query installed patches',
  'The scanner\'s plugin feed was updated the day before the scan',
  'The scan ran at a slow timing template instead of a fast one'
 ],
 a:[0,1,2,3],
 expl:'Scanners mislead in known ways. <b>Spoofed banners</b> feed version-based plugins fiction — the binary behind it is unchanged. A <b>WAF</b> can answer the scanner\'s probes perfectly, hiding that the real application is vulnerable. A <b>honeypot</b> is designed to look vulnerable, producing findings against an imaginary host. And <b>under-privileged scan credentials</b> are the quiet killer: the run looks authenticated, but the account cannot read the patch store, so missing-patch checks silently return clean — a false negative with a green face. Fresh plugin feeds improve truth; slow timing changes coverage speed, not accuracy.',
 tip:'Ask for every disputed finding: what answered the probe, with what rights, and could something in between have answered for the target?',
 why:{
  w1:'A current feed reduces false results; it does not create them.',
  w2:'Timing templates spread or compress probes in time — they do not change what the target truthfully returns.'
 },
 hx:['Two of the wrong answers are settings that scan teams deliberately choose for better results.','"Something between the scanner and the truth" covers three of the four correct options.']
},
{
 id:'h08',th:4,tp:'qcm',pts:2,ti:'Pick the CVSS metric from the story',
 sc:'<p>A finding\'s narrative says: <i>"The attacker must already hold a low-privileged service account on the host to reach the vulnerable function."</i> The draft vector currently reads <code>PR:N</code> and scores too high. The client\'s risk board challenges the number.</p>',
 q:'<p>Which CVSS:AV metric value matches the narrative?</p>',
 o:['PR:L — privileges required: low','PR:N — privileges required: none','UI:R — user interaction required','AC:H — attack complexity: high'],
 a:0,
 expl:'CVSS v3 separates <i>what the attacker needs to have</i> from <i>what the attacker needs to do</i>. Holding an existing low-privilege account is exactly <code>PR:L</code> (Privileges Required: Low). <code>PR:N</code> means the attack works from nothing, which is what inflated the score. <code>UI:R</code> is about tricking a person into acting, and <code>AC:H</code> is about unpredictable conditions beyond the attacker\'s control — neither is described here. Fixing the vector drops the score honestly, and the risk board sees a number that matches the story.',
 tip:'PR describes credentials already held; UI describes a human being deceived; AC describes luck. Do not mix them.',
 why:{
  w2:'Nothing in the narrative involves a user being fooled — that would be UI:R.'
 },
 hx:['"Must already hold an account" is a requirements-of-attacker statement, and CVSS has one metric for exactly that.']
}
);
/* HARD exercises 9-12: SMB terminal, artifacts-to-protocol cat, IDS-response order, false-positive logview */
EX.push(
{
 id:'h09',th:3,tp:'terminal',pts:2,ti:'Terminal: the anonymous share check',
 sc:'<p>The engagement scope covers <code>filesrv01.corp.local</code>, and your notes say its SMB port answers. The lead\'s instruction is deliberately tool-agnostic: <i>"Find out whether someone with no account at all can list the shares on that host — bring back the share names if they can."</i></p>',
 q:'<p><b>Type a single command</b> that achieves the goal. No tool is named on purpose: choose any accepted real-world way, with the right flags, against <code>filesrv01.corp.local</code>. Commands are case-sensitive, like a real shell.</p>',
 goal:'List the SMB shares that an anonymous (no-credentials) session can see on filesrv01.corp.local',
 ac:[['smbclient','-L','filesrv01.corp.local'],['enum4linux','filesrv01.corp.local'],['smbmap','-H','filesrv01.corp.local'],['nmap','--script','smb-enum-shares','filesrv01.corp.local']],
 out:'Sharename       Type      Comment\n---------       ----      -------\nIPC$            IPC       Remote IPC\nbackup          Disk      Old backups (anon-readable)\npublic          Disk      Drop folder\nReconnecting with SMB1 for workgroup listing.\n[lab] 3 shares listed via anonymous session',
 ansKey:'smbclient -L //filesrv01.corp.local -N  (or: enum4linux -a, smbmap -H, or nmap --script smb-enum-shares)',
 expl:'Several standard paths all satisfy the goal. <code>smbclient -L //filesrv01.corp.local -N</code> asks the server for its share list with the <code>-N</code> no-password option, so the session is anonymous. <code>enum4linux</code> wraps several SMB checks — including the anonymous share listing — and needs only the host. <code>smbmap -H</code> and an nmap <code>smb-enum-shares</code> script run are equally accepted real-world ways. What matters is the idea: enumerate shares <i>without credentials</i>, because a readable anonymous share (like the <code>backup</code> one in the output) is a High finding on its own. The command family, the listing flag, and the target all have to be right, whichever tool you pick.',
 tip:'Know at least two tools for every protocol — real engagements take away your favorite one sooner or later.',
 hx:['One tool speaks raw SMB shares; another wraps several Windows enumeration checks.','An anonymous listing means a flag that says "no password" — or a wrapper that tries it for you.']
},
{
 id:'h10',th:3,tp:'cat',pts:8,ti:'Name the door each artifact came through',
 sc:'<p>Your enumeration notes from three hosts are a pile of output excerpts. Before the report, you sort every excerpt by the protocol that produced it, so each finding cites its source. The pile has eight excerpts.</p>',
 q:'<p>Sort each excerpt into the protocol it came from.</p>',
 cats:['LDAP','NTP','RPC','DNS'],
 items:[
  {t:'An anonymous search returns namingContexts: dc=corp,dc=local',c:0},
  {t:'ntpq -c peers lists six time sources, two of them public pool servers',c:1},
  {t:'rpcclient enumdomusers returns a 40-name account list',c:2},
  {t:'A query for _ldap._tcp SRV records reveals two domain controllers',c:3},
  {t:'A bind as a plain user without a password lists 200 user objects',c:0},
  {t:'A monlist request answers with the last 40 clients that queried the server',c:1},
  {t:'srvinfo names the services running on the remote host',c:2},
  {t:'A zone transfer attempt answers with 14 records and a serial number',c:3}
 ],
 expl:'Four doors, four kinds of loot. <b>LDAP</b> answers directory questions: naming contexts, and — if anonymous or unauthenticated binds are allowed — object lists with hundreds of users. <b>NTP</b> exposes time infrastructure: peers show who the device trusts, and the ancient monlist query dumps recent clients (also a reflection-amplification risk). <b>RPC</b> is the Windows back door: rpcclient\'s enumdomusers and srvinfo pull accounts and services over MSRPC. <b>DNS</b> hands out structure: SRV records point straight at domain controllers, and a permissive zone transfer copies the whole map. Sorting evidence by its door keeps the report\'s recommendations precise — each protocol has its own fix.',
 tip:'Every excerpt names its own protocol if you know each one\'s vocabulary — peers, contexts, SRV, enum.',
 hx:['Directory objects and naming contexts are LDAP\'s vocabulary.','enumdomusers and srvinfo are rpcclient verbs; peers and monlist belong to time keeping.']
},
{
 id:'h11',th:6,tp:'order',pts:5,ti:'The sensor fires during your scan — order the response',
 sc:'<p>You are the shift lead when the IPS alerts on scan-like traffic from an unknown internal host (not the approved scanner). The asset owner is pinging you, the client\'s SOC lead is pinging you, and the ticket system is empty. Order the correct response.</p>',
 q:'<p>Order the response steps from first to last.</p>',
 items:[
  'Correlate the alert across sources — firewall, sensor, NetFlow — to confirm scope and pattern',
  'Check the scan authorization list: is this source approved anywhere?',
  'Rate-limit or block the source at the firewall to stop the bleeding',
  'Notify the asset owner and the client SOC lead with what is known so far',
  'Document timeline, evidence and actions in the incident ticket'
 ],
 expl:'Response has an order for good reasons. <b>Correlation first</b>: one sensor line is a story fragment; firewall and flow data confirm what really happened and how wide it is. <b>Authorization check second</b>: an unapproved source is either an attacker or a rogue internal tool — the list decides which conversation you are having. <b>Containment third</b>: rate-limit or block now that you know what to contain. <b>Notification fourth</b>: humans act on accurate facts, not on first impressions. <b>Documentation last-but-always</b>: the ticket preserves the timeline for the review nobody will want to reconstruct from memory. Acting in another order is how blocks hit legitimate servers and how incidents lose their evidence.',
 tip:'Confirm, authorize, contain, inform, document — the scanner operator\'s fire drill.',
 hx:['You cannot contain or escalate before you know what you are looking at.','The paperwork comes last, but it is never optional.']
},
{
 id:'h12',th:4,tp:'logview',pts:4,ti:'The finding that would not die',
 sc:'<p>A scanner flagged <code>portal.corp.local</code> as "Apache httpd 2.4.29 — multiple CVEs" for the third quarter in a row. The client\'s web team insists the binary is patched. You pull the evidence both sides rely on.</p>',
 q:'<p>Filter the log if useful, then answer the two questions.</p>',
 log:[
  {s:'warn',l:'SCANNER plugin 157295: Apache httpd 2.4.29 detected on portal.corp.local:443 (banner: Server: Apache/2.4.29)'},
  {s:'warn',l:'SCANNER plugin 157296: NSE http-enum findings based on same banner: /manager/ exposed'},
  {s:'info',l:'MANUAL request: GET / -> Server: Apache/2.4.29 (header identical from both vantage points)'},
  {s:'info',l:'MANUAL probe: GET /server-status -> 403; GET /manager/html -> 403 (redirect to SSO)'},
  {s:'ok', l:'CRED CHECK (agreed): package list on host shows httpd 2.4.37-43 with vendor backport suffix'},
  {s:'info',l:'PROXY note: an edge proxy in front of the portal rewrites Server headers from a static map'}
 ],
 subs:[
  {k:'q',q:'What is the true status of the "Apache 2.4.29" finding?',o:[
    'A false positive — the banner is a proxy rewrite; the package is backported 2.4.37',
    'A true positive — the banner names the version, and banners never lie',
    'A false negative — the scanner missed a worse flaw on purpose',
    'Unverifiable — nothing can be done without vendor support'],a:0},
  {k:'q',q:'Which practice would have prevented this argument from recurring for three quarters?',o:[
    'Confirming banner-based findings with credentialed package checks first',
    'Scanning with more aggressive timing so banners cannot mislead',
    'Removing the banner-rewriting proxy from production entirely',
    'Disabling web scanning until banners are banned by policy'],a:0}
 ],
 expl:'Version-based web findings live and die by their source. Here the <b>banner was written by an edge proxy</b> from a static map — it said 2.4.29 regardless of what ran behind it, for three quarters. The package check (agreed in advance, read-only) shows 2.4.37 with a vendor backport suffix: the distribution patched the CVEs and kept the major version line. That is a textbook <b>false positive</b>. The durable fix is procedural: any banner-only version finding gets confirmed with a credentialed package check before it is published. Louder scans find the same banners faster; they do not find truth.',
 tip:'Banner says, proxy rewrites, package proves. Only the third one belongs in a report unqualified.',
 why:{
  w2:'Timing and noise affect detection speed, not the accuracy of a rewritten header.'
 },
 hx:['Follow the header: who actually generated the text the scanner read?','What read access shows the real installed software, bypassing all banners?']
}
);
/* HARD exercises 13-16: credentialed-scan qcm, remediation rank, firewall-conclusion fib, SOC queue steps */
EX.push(
{
 id:'h13',th:4,tp:'qcm',pts:2,ti:'The patch that was there all along',
 sc:'<p>The credentialed scan reports <code>srv-erp01</code> missing a critical cumulative update. The server team forwards their screenshot: the update is <b>installed</b>, rebooted, and verified twice. The scanner ran with the vault\'s service account, and the run log shows "authenticated: yes". Both sides are sure. You look at the scan account\'s permissions.</p>',
 q:'<p>What is the most likely root cause of the contradiction?</p>',
 o:[
  'The account authenticated fine but lacks the rights to read the patch store',
  'The scanner scanned the wrong host with the same name in another subnet',
  'The server team\'s screenshot came from a different server that shares the hostname',
  'The plugin feed was too new for this operating system to parse'
 ],
 a:0,
 expl:'"Authenticated" and "able to read everything the plugins need" are different things. Windows patch checks read WMI/registry state, and a service account without those rights yields empty or stale answers — the plugin then falls back to the last state it could see, which is exactly how a patched server reports unpatched. The other explanations would all be discoverable instantly in the run log (target IP vs name) or in the screenshot metadata; the rights gap is the one that hides inside a green "authenticated" badge. The fix: give the scan account read access to the required stores, rerun, and keep the account least-privileged but sufficient.',
 tip:'For credentialed scans, test the account against the read paths every plugin needs — before the scan window, not during the dispute.',
 why:{
  w2:'Two servers sharing a hostname would show in the scan report\'s target listing and the screenshot — the log here is clean.'
 },
 hx:['The contradiction lives between "logged in" and "allowed to read".']
},
{
 id:'h14',th:4,tp:'rank',pts:6,ti:'Rank six findings when the numbers disagree',
 sc:'<p>The client can fund two remediation tracks this quarter. Six findings sit on the table with awkward shapes: CVSS alone contradicts gut feeling in both directions. Rank them as a risk-driven report should — worst remediation urgency first.</p>',
 q:'<p>Rank from highest priority (top) to lowest (bottom).</p>',
 items:[
  'Internet-facing VPN appliance with CVSS 7.5, listed in the KEV catalog — exploitation observed in the wild this month',
  'Internal backup server, CVSS 9.8 unauthenticated RCE, but segmented away from user networks and no public exploit',
  'Exposure of a .git directory on the internet web root, CVSS 5.3 — leaks source and possibly credentials',
  'SMB signing not required on the domain controllers, CVSS 5.3 — enables relay attacks against the core of the domain',
  'Internal developer laptop, CVSS 8.8 Office RCE, requires a user to open a crafted file',
  'Self-signed certificate warning on an internal reporting portal, CVSS 3.1'
 ],
 expl:'Context reorders the numbers. The <b>KEV-listed VPN flaw</b> jumps first: attackers are actively exploiting it in the wild, at the internet edge, today — exploitability beats the raw 7.5. The backup server\'s 9.8 is real but gated by segmentation and the absence of public code, so it is second, not first. The <b>.git exposure</b> hands attackers source and secrets — quiet, cheap, high leverage. <b>SMB signing</b> on DCs looks modest at 5.3 but touches the domain\'s trust core (relay attacks). The laptop RCE needs a human to open a file, which training and mail controls mitigate; the certificate warning is hygiene. Ranking is risk arithmetic: exposure × exploitability × impact, with CVSS as one input.',
 tip:'KEV and internet edge first. Then high scores without barriers. Then architecture-level weaknesses the number underrates.',
 why:{
  w1:'A 9.8 with no reachable path and no public exploit is serious-but-plannable; an actively exploited edge flaw is now.'
 },
 hx:['Which item does the wild exploit right now, regardless of its score?','Two items sit at CVSS 5.3 — decide by what each unlocks for an attacker.']
},
{
 id:'h15',th:5,tp:'fib',pts:3,ti:'Read the firewall, predict the scan',
 sc:'<p>The client shares the ruleset guarding <code>db-zone01</code> before your scan window. You annotate what each rule means for your probes so the scan plan predicts the output instead of discovering it live.</p>',
 q:'<p>Complete the three annotations with the port states you expect.</p>',
 fhtml:'<p>"Rule 1: ACCEPT tcp 53 from the scanner range — an ACK scan with source port 53 will show these ports as <b>{{b0}}</b>. Rule 2: DROP all else silently — SYN probes to any other port will show <b>{{b1}}</b>. Rule 3: the db host itself sends RST for unused TCP ports reachable through the rules — those show <b>{{b2}}</b>."</p>',
 blanks:[
  {k:'s',o:['unfiltered','filtered','closed','open|filtered'],a:0},
  {k:'s',o:['filtered','unfiltered','closed','open'],a:0},
  {k:'s',o:['closed','filtered','unfiltered','open|filtered'],a:0}
 ],
 expl:'Predicting states is the difference between reading a scan and guessing through it. ACK probes with an allowed source port (53) pass rule 1; the host answers RST; nmap reports <b>unfiltered</b> — reachable, state unknown. Everything the silent DROP eats reports <b>filtered</b>: no reply, no knowledge. And where traffic is allowed through to the host but nothing listens, the host\'s own stack sends RST, which nmap reports as <b>closed</b>. Three rules, three different answers — the same wire, three meanings, all predictable from the ruleset.',
 tip:'State vocabulary in one line: RST from host = closed. Silence from a filter = filtered. ACK passed = unfiltered.',
 why:{
  w1:'Only the host\'s own stack can produce "closed"; a filter\'s silence produces "filtered".'
 },
 hx:['Match each answer to its author: filter silence, ACK passthrough, or host RST.']
},
{
 id:'h16',th:6,tp:'steps',pts:4,ti:'SOC queue: four calls with teeth',
 sc:'<p>Wednesday, 15:40. Four queue items, each with a trap for the unthinking. You are the senior on shift; the juniors watch how you route these.</p>',
 q:'<p>For each item, pick the call you actually make.</p>',
 steps:[
  {p:'<b>Item 1.</b> Mid-scan, the client calls: a networked printer crashed during the aggressive pass and staff cannot print. What do you do?',o:[
    'Stop the aggressive pass, document the impact, and switch to a throttled profile',
    'Reboot the printer yourself and continue at -T5 — one device is acceptable collateral',
    'Blame the printer\'s firmware in the report and continue unchanged',
    'End the whole engagement immediately, no questions asked'],a:0},
  {p:'<b>Item 2.</b> The IDS fires on scan traffic from 10[.]40[.]7[.]240 — the approved scanner IP — inside the documented window. What do you do?',o:[
    'Annotate the ticket as expected activity in SC-W-2211 and tell the SOC lead',
    'Open a P1 incident and block the scanner IP at once',
    'Ask the client to disable the IDS for the rest of the engagement',
    'Ignore the alert and say nothing — expected activity needs no record'],a:0},
  {p:'<b>Item 3.</b> The scanner flags "vsftpd 2.3.4 backdoor" on an internet host — a famous, juicy finding. What do you do?',o:[
    'Verify reachability first, then escalate per the IR path if it is confirmed',
    'Escalate immediately as a P1 with no verification — speed beats accuracy',
    'Delete the finding — that backdoor only exists in old CTF labs',
    'Attempt to trigger the backdoor yourself to prove it works'],a:0},
  {p:'<b>Item 4.</b> A Medium finding lands on a host the client says is being decommissioned tonight. What do you do?',o:[
    'Record it with the decommission context and a deadline',
    'Delete it — the host will not exist tomorrow anyway',
    'Raise it to Critical because deletion was mentioned',
    'Move it quietly to next quarter\'s report instead'],a:0}
 ],
 expl:'Four calls, one principle: <b>verify, document, stay proportionate</b>. A crashed printer means stop the cause, record the harm, throttle — rebooting client gear or shrugging at damage is not your role. Approved scan traffic is expected: annotate and inform, so the blue team saves its energy; silently ignoring it skips the paper trail. The famous vsftpd 2.3.4 backdoor is exactly where excitement kills accuracy — verify reachability first, then escalate through IR if real, and never trigger a backdoor yourself. The decommissioning host keeps its finding with a deadline: risk accepted until midnight is risk documented, not risk deleted.',
 tip:'Every queue call is the same test: what did you verify, what did you write down, and is the response proportionate?',
 why:{
  w1:'Testers do not operate client systems — even to fix damage their scan caused.',
  w3:'Deleting findings because a host will disappear erases the audit trail; context plus deadline is the honest form.'
 },
 hx:['In each item, one option removes evidence, breaks a role boundary, or skips verification.','"Document, verify, proportionate" — then read the options again.']
}
);
/* HARD exercises 17-20: applied state-cause match, disambiguation qcm, snmpwalk/ldapsearch fib, honeypot multi */
EX.push(
{
 id:'h17',th:1,tp:'match',pts:5,ti:'From the state, back to the cause',
 sc:'<p>Post-scan review. The report draft lists five observations verbatim from the output, and the client asks for each one: "and <i>why</i>, mechanically, does nmap say that?" You write the causal chain for every state, in context.</p>',
 q:'<p>Match each observation to the mechanical cause behind it.</p>',
 pairs:[
  ['UDP 161 shows open|filtered on the switch','SNMP may be listening but ignoring the probe, or a filter silently dropped the UDP packet'],
  ['ACK scan shows 443/tcp unfiltered','The filter let the ACK through and the host answered RST — reachability is proven, service state is not'],
  ['SYN scan shows 445/tcp filtered','Something between you and the port dropped the SYN without answering'],
  ['Connect scan to 22/tcp ends with RST from the host','The TCP stack itself refused the connection — nothing listens on that port'],
  ['SYN scan to 443/tcp returns SYN-ACK','A service is listening and offered to complete the handshake']
 ],
 expl:'Each state has exactly one author. <b>open|filtered</b> on UDP is silence — and silence has two suspects: a quiet service or a dropping filter. <b>unfiltered</b> comes only from ACK scans: the filter passed the packet and the host\'s RST is the receipt. <b>filtered</b> is authored by the filter alone — the packet died before reaching the stack. <b>closed</b> is the host\'s own stack speaking (RST). <b>open</b> is the service speaking (SYN-ACK). When you can name the author of every state, the scan becomes a conversation transcript instead of a table of symbols.',
 tip:'Who spoke? Service (open), stack (closed), filter (filtered/filtered-side of ambiguity), or nobody (open|filtered).',
 hx:['Two observations involve the filter — but the filter answers in two different ways.','"Unfiltered" never certifies a service; it certifies a path.']
},
{
 id:'h18',th:1,tp:'qcm',pts:2,ti:'Breaking the open|filtered tie',
 sc:'<p>Against a hardened Linux host behind an IDS, your FIN, NULL and Xmas passes all return <b>open|filtered</b> across the board — the stack ignores odd-flag probes on open ports and the filter ignores everything else. The report needs a real answer for ports 22 and 873.</p>',
 q:'<p>What is the correct next move to separate open from filtered on those two ports?</p>',
 o:[
  'Probe the two ports with a handshake (Connect scan or a protocol client)',
  'Repeat the Xmas scan with a different timing template again',
  'Run a UDP scan against those same two ports instead',
  'Increase the fragmentation level and rerun the NULL scan'
 ],
 a:0,
 expl:'Odd-flag scans (FIN, NULL, Xmas) cannot get an answer past this combination: Linux-style stacks ignore flagless probes on open ports, and the filter drops everything else — both produce silence, hence open|filtered. The tie is broken by the one method that forces an answer: a <b>complete handshake</b> (Connect scan) or a real protocol client, where open ports must respond and closed ports must refuse. Repeating the same physics at any speed or fragmentation reproduces the same silence, and UDP probes answer a different protocol\'s question entirely.',
 tip:'When stealthy probes return ambiguity, the honest answer comes from the handshake you were saving for last.',
 why:{
  w2:'Fragmentation changes how probes travel, not whether the stack will answer them.'
 },
 hx:['Which scan style always forces either a completion or a refusal from the target stack?']
},
{
 id:'h19',th:3,tp:'fib',pts:3,ti:'Two enumeration commands, no room for error',
 sc:'<p>The runbook page for SNMP and LDAP enumeration lost its examples in the last edit. You retype them from memory — the client\'s device answers SNMPv2c with the default community, and the directory allows unauthenticated binds.</p>',
 q:'<p>Complete both commands: the snmpwalk protocol version with its community, and the ldapsearch flag for a simple unauthenticated bind.</p>',
 fhtml:'<code>snmpwalk {{b0}} {{b1}} core-rtr01.corp.local system</code><br><code>ldapsearch {{b2}} -b dc=corp,dc=local "(objectClass=user)"</code>',
 blanks:[
  {k:'s',o:['-v 2c','-v 1','-v 3'],a:0},
  {k:'s',o:['-c public','-c private','-u admin'],a:0},
  {k:'s',o:['-x','-w secret','-H ldaps'],a:0}
 ],
 expl:'<code>snmpwalk -v 2c -c public</code> is the classic read walk: version 2c matches most deployed devices, and <b>public</b> is the default read community — the first string every tester tries (private is the historic write community, and version 3 would need credentials you do not have). <code>ldapsearch -x</code> selects simple authentication; with no bind DN and password, it attempts an <b>unauthenticated</b> session — the exact configuration that lets a stranger list 200 user objects. Together the two commands are the fastest way to learn whether a network leaks its inventory and its directory.',
 tip:'Default communities and unauthenticated binds are the two cheapest wins in internal testing — check both, every time.',
 why:{
  w1:'-u is not an snmpwalk flag; authentication in v2c lives entirely in the community string.'
 },
 hx:['v2c is both modern enough to work and old enough to be default.','"Simple" is the keyword for LDAP\'s least-privileged bind mode.']
},
{
 id:'h20',th:5,tp:'multi',pts:4,ti:'Is that host real? Honeypot tells',
 sc:'<p>One host in the DMZ answers every probe with suspicious enthusiasm, and two team members disagree about whether it is a honeypot. You list the tells you would stake a finding on. Four of the six are real honeypot indicators; two are normal server behavior.</p>',
 q:'<p>Select every item that is a genuine honeypot indicator.</p>',
 o:[
  'Every port from 1 to 65535 answers as open, with SYN-ACK for all',
  'Banners on different services share identical wording and unknown version strings',
  'Responses arrive in well under a millisecond; normal latency here is 3-8 ms',
  'An SSH service listens on 21/tcp and an FTP banner on 22/tcp — the services are swapped',
  'The web server returns 404s on unknown paths, as configured',
  'The host keeps correct system time via NTP like its neighbours'
 ],
 a:[0,1,2,3],
 expl:'Honeypots imitate, and imitation leaves seams. <b>Everything open</b> (all 65,535 ports answering) is the loudest tell — real servers run a handful of services. <b>Impossible or uniform banners</b> reveal a script answering instead of software. <b>Sub-millisecond responses</b> betray a machine answering instantly while real hosts obey physics and stack queues. <b>Swapped services</b> (SSH on 21, FTP on 22) show a template that never checked which port carries which protocol. The two normal behaviors — 404s and NTP sync — are what every honest server does; calling them honeypot evidence wastes the client\'s time and your credibility.',
 tip:'Honeypots answer too much, too fast, too uniformly — and occasionally in the wrong protocol\'s clothes.',
 why:{
  w1:'Consistent 404 behavior and time sync are baseline correctness, not deception.'
 },
 hx:['Two options describe diligence, not deception.','Count how many real servers you have seen with all 65,535 ports open.']
}
);
/* HARD exercises 21-24: mid-scan block logview, AXFR red/blue branch, idle-scan order, ROE qcm */
EX.push(
{
 id:'h21',th:5,tp:'logview',pts:4,ti:'The scan that turned filtered mid-run',
 sc:'<p>Your first pass against <code>app-tier</code> (10[.]40[.]6[.]0/24) ran clean at 11:20. You reran the same scan at 13:45 for the version pass — and suddenly everything is <b>filtered</b>, including ports that were open an hour ago. The client\'s firewall team forwards their log.</p>',
 q:'<p>Filter the log if useful, then answer the two questions.</p>',
 log:[
  {s:'info',l:'fw-app-tier: session log excerpt, scanner range 10[.]40[.]7[.]240'},
  {s:'ok', l:'11:20:05 ALLOW tcp 10[.]40[.]7[.]240 -> 10[.]40[.]6[.]22 ports 22,80,443 (rule APP-SRV-01)'},
  {s:'warn',l:'11:21:12 THRESHOLD alert: 3,100 SYNs in 60s from 10[.]40[.]7[.]240 (policy: 2,500/60s)'},
  {s:'info',l:'11:21:30 action=monitor — first threshold crossing logged, no block'},
  {s:'warn',l:'13:45:02 THRESHOLD alert: 4,600 SYNs in 60s from 10[.]40[.]7[.]240'},
  {s:'err', l:'13:45:20 action=BLOCK list=dynamic-scan-guard src=10[.]40[.]7[.]240 ttl=3600s'},
  {s:'err',l:'13:45:21+ DENY all 10[.]40[.]7[.]240 -> 10[.]40[.]6[.]0/24 (list=dynamic-scan-guard)'},
  {s:'info',l:'SOC note: dynamic-scan-guard is an automatic rate-based block, 60-minute expiry'}
 ],
 subs:[
  {k:'q',q:'Why does the 13:45 scan show every port filtered, including previously open ones?',o:[
    'A rate-based block engaged — the firewall drops probes before any host answers',
    'The application tier was taken offline between 11:20 and 13:45',
    'The scan ran with the wrong protocol this time around',
    'The open ports closed themselves after the morning scan'],a:0},
  {k:'q',q:'What is the correct professional next step?',o:[
    'Coordinate with the client to allow-list or slow the scan, then rerun and document',
    'Rotate the scanner to a spoofed source address so the block cannot follow you',
    'Wait 60 minutes, silently rerun at the same speed, and hope',
    'Declare the environment untestable and end the engagement'],a:0}
 ],
 expl:'The log tells one story twice: the morning pass crossed the rate threshold once (monitor-only), the afternoon pass crossed it again — and the firewall\'s <b>dynamic-scan-guard</b> responded with a one-hour block. From that moment every probe dies at the firewall, which nmap honestly reports as <b>filtered</b>, even for ports that were open at 11:20. The state changed at the <i>firewall</i>, not at the host. The professional answer is coordination and documentation — allow-list the approved scanner or throttle the scan — never spoofing your identity, which converts a technical hiccup into a breach of trust.',
 tip:'When results flip between runs, check what changed between them — including defenses that learned from your first pass.',
 why:{
  w1:'"Untestable" is the wrong conclusion; rate and allow-lists exist exactly for agreed testing.'
 },
 hx:['Two threshold lines and one block line explain everything that follows.','The block has an author and an expiry — so does the fix.']
},
{
 id:'h22',th:3,tp:'branch',pts:3,ti:'Branching: the zone that copies itself',
 sc:'<p>You test <code>ns1.corp.local</code> from both hats during the purple-team day. The DNS server is central enough that both teams learn something lasting. Decisions move the story.</p>',
 q:'<p>Decide step by step. Your choice at each step moves the work forward.</p>',
 steps:[
  {p:'<b>Red-team part.</b> The zone looks valuable. What do you try first?',o:[
    {t:'Brute-force thousands of common hostnames against the server',out:'Hours of noise for a partial list — and the query flood alerts on volume, not on intent. There is a one-query question that answers better.'},
    {t:'Request a zone transfer (AXFR) from ns1 for the internal zone',out:'One query. If the server is misconfigured, the entire zone — hosts, services, serials — lands in your terminal. If configured properly, you get REFUSED and lost eight seconds.'},
    {t:'Move on — DNS never contains anything useful',out:'DNS is the enterprise\'s own map of itself. Skipping it is leaving the blueprint on the table.'}],a:1},
  {p:'<b>Red-team part.</b> The AXFR succeeds and returns 14 records, including two domain controllers. What now?',o:[
    {t:'Target the domain controllers next and cite the AXFR as the source',out:'The zone gives you the DC names without a single noisy probe. The finding writes itself: one query exposed the internal map.'},
    {t:'Delete the zone file you received — it was too easy, so it cannot be a real finding',out:'Ease of exploitation is not a measure of severity. The finding stands.'},
    {t:'Publish the records to the client\'s public status page as proof',out:'The evidence goes in the report, not on a public page. This is a leak, not a demonstration.'}],a:0},
  {p:'<b>Blue-team part.</b> Which configuration change prevents the AXFR repeat?',o:[
    {t:'Allow-list secondaries (or TSIG keys) and verify with a test query',out:'The durable fix: AXFR is a legitimate server-to-server operation — allow-listed secondaries or TSIG-signed requests, everyone else refused. The follow-up test proves it.'},
    {t:'Disable DNS entirely on ns1 and be done with it',out:'The enterprise loses name resolution to save one record type. No.'},
    {t:'Change the zone\'s serial number weekly so copies go stale',out:'Serials track zone versions; they gate nothing about transfers.'}],a:0}
 ],
 expl:'A zone transfer is the cheapest possible map of a network: one query, whole zone, if the server forgets who is allowed to ask. Red team: try AXFR before brute-forcing names — and when it works, the DC names in the response aim the next phase. Blue team: the fix is an <b>allow-list</b> (approved secondaries, or TSIG-signed requests), verified afterwards with the same query that failed the test before. The lesson cuts both ways: DNS answers structural questions, and structures deserve allow-lists.',
 tip:'One AXFR query replaces hours of guessing — and one allow-list line prevents all of it.',
 why:{
  w1:'Serial numbers and disabling DNS do not touch the transfer permission — only the transfer policy does.'
 },
 hx:['There is a record type whose entire job is "copy the zone".','On the blue side, the fix names who may ask, not what the zone contains.']
},
{
 id:'h23',th:1,tp:'order',pts:5,ti:'The idle scan, performed properly',
 sc:'<p>The notes authorize an idle scan against <code>dmz-app03</code> using a candidate zombie. The lead wants the procedure done in the right order — "the wrong order produces confident nonsense."</p>',
 q:'<p>Order the idle-scan procedure from first to last.</p>',
 items:[
  'Select an idle candidate — quiet, with a predictable IP ID sequence',
  'Test the candidate\'s IP ID behavior directly (is it incrementing predictably?)',
  'Run the idle scan (-sI zombie) against the target from your own address',
  'Corroborate the open ports with an authorized direct probe from your scanner',
  'Record both result sets and the zombie\'s identity in the report caveats'
 ],
 expl:'Idle scans are built on an assumption — that the zombie\'s IP ID counter is predictable — so the procedure <b>tests the assumption before trusting the result</b>. Pick a quiet candidate; probe it directly and watch the ID sequence increment calmly; only then run the scan through it. Afterwards, corroborate: idle results are secondhand, so the open ports get confirmed with an authorized direct probe wherever possible. And the report records the zombie and the double-check — because an idle scan\'s evidence is only as strong as the host it borrowed. Skipping the test or the corroboration is how confident nonsense enters reports.',
 tip:'Idle scan = borrowed identity. Test the borrower, then verify everything it claims.',
 why:{
  w1:'Running the scan before testing the zombie turns any later surprise into untraceable noise.'
 },
 hx:['Nothing runs until the zombie\'s counter has proven itself.','Secondhand evidence needs a firsthand witness before it reaches a report.']
},
{
 id:'h24',th:6,tp:'qcm',pts:2,ti:'The subnet next door',
 sc:'<p>Mid-scan, your discovery sweep reveals live, unsecured hosts on 10[.]40[.]99[.]0/24 — a subnet that does <b>not</b> appear anywhere in the signed scope. The findings would be significant. The client\'s sponsor is on vacation, and the window is open for two more days.</p>',
 q:'<p>What is the correct action?</p>',
 o:[
  'Stop at the fence: document the observation, do not scan further, and escalate in writing',
  'Scan it — the hosts are unprotected, and the client clearly wants maximum value',
  'Scan it lightly (-T0) since slow scanning is less intrusive than fast scanning',
  'Ask the sponsor\'s deputy by phone and scan on the verbal yes only'
 ],
 a:0,
 expl:'Scope is a legal boundary, and it binds even when — especially when — the target is tempting. Hosts outside the authorization are out of bounds no matter how unprotected or how clearly "the client would want it". The correct move is what professionals do: <b>record the observation</b> (you may note that addresses are live from the sweep you were authorized to run), <b>do not probe further</b>, and <b>escalate in writing</b> for a scope amendment. A verbal yes from a deputy is not a scope change; slow scanning is still scanning; and "they would want it" is how unauthorized access charges start.',
 tip:'The fence does not move because the grass looks greener. Document, escalate, wait for paper.',
 why:{
  w1:'Intrusiveness does not define authorization — the signed scope does.'
 },
 hx:['Two answers replace a signature with something softer. Which of those is worth a contract dispute?']
}
);
/* HARD exercises 25-27: identifiers match, CVSS mismatch spot, evasion-plan fib */
EX.push(
{
 id:'h25',th:4,tp:'match',pts:5,ti:'Five identifiers, five jobs',
 sc:'<p>The client\'s risk register mixes up vulnerability vocabulary, and the confusion reaches their ticket routing: CVE numbers filed as products, scores filed as databases. You build the one-page decoder for the wall.</p>',
 q:'<p>Match each identifier to the job it actually does.</p>',
 pairs:[
  ['CVE','Names one specific vulnerability with a stable ID'],
  ['CVSS','Scores the severity of a vulnerability on a 0-10 scale'],
  ['CPE','Names a platform/product in a standardized format'],
  ['NVD','The public database that enriches CVEs with scores and references'],
  ['KEV','The catalog of vulnerabilities observed being exploited in the wild']
 ],
 expl:'The five identifiers answer five different questions. <b>CVE</b> is the name tag: one flaw, one ID (like CVE-2024-1234), so everyone discusses the same defect. <b>CVSS</b> is the ruler: a 0-10 severity from the vector\'s metrics. <b>CPE</b> describes the <i>thing</i> the flaw lives on — product, vendor, version — so scanners can say precisely which platforms are affected. <b>NVD</b> is the library: it collects CVEs and adds CVSS scores and references. <b>KEV</b> is the "act now" list: flaws with observed real-world exploitation, which is why KEV membership outranks raw CVSS in triage. Mixing them up misroutes tickets; keeping them straight routes by risk.',
 tip:'Name (CVE) → thing (CPE) → score (CVSS) → library (NVD) → urgency (KEV).',
 hx:['Two of these are catalogs or databases, not identifiers of a single flaw.','The catalog with the famous initials spells "exploited", not "database".']
},
{
 id:'h26',th:4,tp:'spot',pts:2,ti:'Spot the mistake: the vector does not match the story',
 sc:'<p>A teammate\'s draft finding pairs a narrative with a CVSS vector. The client\'s risk analyst — who reads vectors fluently — will challenge it unless you fix it first. Two lines in the draft contradict each other.</p>',
 q:'<p>Click the <b>two</b> lines that contain mistakes.</p>',
 lines:[
  {t:'FINDING DRAFT RB-77 — internal API gateway',bad:false},
  {t:'Narrative: "An attacker must trick an authenticated user into visiting a crafted link for the attack to fire."',bad:false},
  {t:'Vector fragment: UI:N — no user interaction required',bad:true},
  {t:'Narrative: "The attack requires the attacker to already hold a low-privileged API token."',bad:false},
  {t:'Vector fragment: PR:N — no privileges required',bad:true},
  {t:'Overall severity: Medium, pending client review',bad:false}
 ],
 expl:'CVSS vectors must mirror the narrative, line by line. "Must trick a user into visiting a crafted link" is the definition of <b>user interaction required</b> — <code>UI:R</code>, not <code>UI:N</code>. "Requires an existing low-privileged token" is <b>privileges required: low</b> — <code>PR:L</code>, not <code>PR:N</code>. Each error inflates the score, and a fluent reader spots both instantly, which costs the whole report its credibility. The severity line itself is fine pending the corrected vector.',
 tip:'Read the narrative sentence by sentence and ask which metric letter each phrase is claiming.',
 why:{
  w1:'The two narrative lines are actually well written — the vector letters under them are what contradict the words.'
 },
 hx:['"Trick a user" and "no user interaction" cannot both be true.','"Must already hold a token" is a privilege requirement — which value admits that?']
},
{
 id:'h27',th:5,tp:'fib',pts:3,ti:'Assemble the slow pass',
 sc:'<p>The notes for tomorrow\'s approved window say: <i>"The IDS thresholds trip on volume and on single-source bursts. Assemble the quietest pass that still finishes overnight."</i> You fill the blanks of the plan.</p>',
 q:'<p>Complete the plan with the timing template, the fragmentation switch, and the decoy form that fits the notes.</p>',
 fhtml:'<code>nmap {{b0}} {{b1}} {{b2}} -p- 10[.]40[.]8[.]0/24</code>',
 blanks:[
  {k:'s',o:['-T1','-T5','-T3 --max-rate 5000'],a:0},
  {k:'s',o:['-f','-sV --version-all','--open'],a:0},
  {k:'s',o:['-D RND:5','-D 10[.]40[.]8[.]1,10[.]40[.]8[.]2','--decoy none'],a:0}
 ],
 expl:'Overnight and quiet means <b>-T1</b>: probes spread across hours so no per-second threshold trips — <code>-T5</code> is the loud option and the rate-capped -T3 variant still bursts. <b>-f</b> fragments the probes so pattern-matching sensors see pieces instead of scans. <b>-D RND:5</b> adds five random, unowned decoy addresses — random on purpose, because listing real addresses (as the second option does) spoofs systems that belong to somebody. The notes said quiet and overnight; the plan now matches the physics and the ethics.',
 tip:'Volume thresholds answer to time and size: stretch the time, shrink the packets, blur the source.',
 why:{
  w1:'A rate-capped fast scan still bursts above quiet thresholds — slow beats capped for stealth.'
 },
 hx:['Which timing template spreads probes over hours rather than seconds?','Decoys should not point at anyone real.']
}
);
/* HARD exercises 28-30: dual-perspective version probing, vuln lifecycle order, enum4linux logview */
EX.push(
{
 id:'h28',th:2,tp:'steps',pts:4,ti:'Two hats: the version probes that woke the IDS',
 sc:'<p>Your <code>-sV --version-intensity 9</code> pass woke the client\'s monitoring: service logs full of malformed protocol probes, and an analyst asking questions. The purple-team debrief runs the incident through both hats.</p>',
 q:'<p>Answer from the correct perspective in each part.</p>',
 steps:[
  {p:'<b>Blue-team part.</b> Which telemetry directly exposes version-probing activity?',o:[

    'Banning all scanners from every network segment',
    'Reading the scanner vendor\'s marketing documentation'],a:0}
 ],
 expl:'Version probing has a sound, and the blue team can hear it: bursts of protocol errors and odd strings on open ports are the -sV engine asking "what are you?" in every dialect it knows. The red team\'s answer is proportionality — <b>light intensity</b> (0-2) sends only the highest-probability probes, naming most services for a fraction of the noise. And the strategic fix belongs to the blue team\'s inventory: a <b>CMDB</b> reconciled with credentialed scans knows versions without a single external probe, which makes loud fingerprinting unnecessary for defenders and reserved for testers. Two hats, one loop: quieter probing, better bookkeeping.',
 tip:'Noise is a budget. Spend light probes first, and let inventory carry the rest.',
 why:{
  w1:'Intensity 9 is what caused the alert — repeating it louder is not the quiet answer.',
  w3:'Banning scanners removes the tester\'s tool, not the defender\'s truth; inventory is the thing that scales.'
 },

},
{
 id:'h29',th:6,tp:'order',pts:6,ti:'The remediation loop, end to end',
 sc:'<p>The client\'s new vulnerability-management program needs its process written down before the first audit. You draft the loop that turns scanner output into closed findings — every stage once, in order.</p>',
 q:'<p>Order the vulnerability-management lifecycle from first to last.</p>',
 items:[

 tip:'Own it, find it, verify it, rank it, fix it, prove it. Six verbs, one loop.',

},
{

 ],

 ],
 expl:'A null session that returns a <b>domain SID, 34 usernames, share names, and the password policy</b> is not an inconvenience — it is the attacker\'s pre-flight briefing: names to brute-force, shares to probe, and a policy that says lockout is disabled. That combination rates <b>High</b>. The rating also needs proof beyond one tool: an independent confirmation with <code>smbclient -N</code> against IPC$, plus a read attempt on <code>backup$</code>, turns "the tool said so" into verified fact — the same discipline as any other finding. Remediation follows from the protocol: disable anonymous enumeration, require SMB signing, and fix the policy the session exposed.',

<script>
/* ===== Ethical Hacker Pro 2.1 exam engine (shared) ===== */
(function(){
"use strict";
var META={};
try{ META=JSON.parse(document.getElementById('cm-exercise-meta').textContent||'{}'); }catch(e){ META={}; }
var MINUTES=META.estimatedMinutes||60;
var PASSM=META.passMark||70;
var DIFFU=(META.difficulty||'medium').toUpperCase();
var TOPIC='cysa-plus';
var NCOUNT=EX.length||30;

var THEMES={
  1:'Port scanning & port states',
  2:'Service & version detection',
  3:'Enumeration protocols',
  4:'Vulnerability scanning & assessment',
  5:'Evasion, firewalls & IDS',
  6:'Methodology, scope & reporting'
};
var KEYW={
  1:['TCP SYN scan (-sS)','TCP Connect scan (-sT)','UDP scan (-sU)','FIN / NULL / Xmas scans','TCP ACK scan (-sA)','idle scan (-sI)','ping sweep (-sn)','ARP scan','port states: open, closed, filtered, unfiltered, open|filtered, closed|filtered','-Pn skip host discovery','-p / -p- / --top-ports','-T0..-T5 timing templates','nmap'],
  2:['banner grabbing','netcat (nc)','-sV version detection','--version-intensity','OS fingerprinting (-O)','TTL analysis','NSE scripts (--script)','service fingerprints','default ports'],
  3:['SMB / NetBIOS (enum4linux, smbclient, nbtstat)','null session','SNMP community strings (snmpwalk, MIB / OID)','LDAP (ldapsearch, naming contexts)','DNS zone transfer (AXFR, dig)','SMTP (VRFY / EXPN)','NTP (ntpq)','RPC (rpcclient)','share & user listing'],
  4:['Nessus','OpenVAS','Qualys','Nikto','scan policy / template','credentialed vs uncredentialed scan','false positive / false negative','CVE','CVSS score bands (AV / AC / PR / UI)','plugin & feed','remediation','prioritization','retest / validation'],
  5:['timing templates (-T0..-T5)','fragmentation (-f)','decoys (-D)','source port (-g)','--spoof-mac','stateful vs stateless filtering','IDS signature','slow scan','honeypot','rate limiting'],
  6:['authorization / ROE','scope','methodology order','documentation & evidence','findings report','severity rating','validation','production impact']
};

var S=null;
var ICON={ok:'\u2713',bad:'\u2715',miss:'\u26a0',part:'\u25d0',skip:'\u00bb'};
var WORD={ok:'correct',bad:'wrong',miss:'missed',part:'partial',skip:'skipped'};

/* ---------- utils ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtT(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function el(id){return document.getElementById(id);}
function byIdEx(id){for(var i=0;i<EX.length;i++){if(EX[i].id===id)return EX[i];}return null;}
function curEx(){return EX[S.order[S.cur]];}
function mkSpan(st){return '<span class="mk mk-'+st+'">'+ICON[st]+' '+WORD[st]+'</span>';}
function r1(x){return Math.round(x*10)/10;}

/* ---------- state ---------- */
function freshState(){
  return {scr:'intro',order:[],cur:0,ans:{},res:{},checked:{},skipped:{},hinted:{},revised:{},
    touched:{},perm:{},score:0,reported:false,user:'',
    t:{left:Math.round(MINUTES*60),manual:false,check:false},bst:{},filter:{},term:{}};
}
function buildPerms(){
  for(var i=0;i<S.order.length;i++){
    var ex=EX[S.order[i]],p={};
    if(ex.tp==='qcm'||ex.tp==='multi'){p.o=shuffle(ex.o.map(function(_,k){return k;}));}
    if(ex.tp==='match'){p.chips=shuffle(ex.pairs.map(function(_,k){return k;}));}
    if(ex.tp==='cat'){p.chips=shuffle(ex.items.map(function(_,k){return k;}));}
    if(ex.tp==='order'||ex.tp==='rank'){p.items=shuffle(ex.items.map(function(_,k){return k;}));}
    if(ex.tp==='fib'){p.bl=[];for(var b=0;b<ex.blanks.length;b++){var bl=ex.blanks[b];p.bl.push(bl.k==='s'?shuffle(bl.o.map(function(_,k){return k;})):null);}}
    if(ex.tp==='steps'||ex.tp==='branch'){p.st=[];for(var s2=0;s2<ex.steps.length;s2++){p.st.push(shuffle(ex.steps[s2].o.map(function(_,k){return k;})));}}
    if(ex.tp==='logview'){p.sv=[];for(var q4=0;q4<ex.subs.length;q4++){var sb3=ex.subs[q4];p.sv.push((sb3.k==='q'||sb3.k==='m')?shuffle(sb3.o.map(function(_,k4){return k4;})):null);}}
    S.perm[ex.id]=p;
    if(ex.tp==='match'){S.ans[ex.id]={};}
    if(ex.tp==='cat'){S.ans[ex.id]={};}
    if(ex.tp==='order'||ex.tp==='rank'){S.ans[ex.id]=p.items.slice();}
    if(ex.tp==='fib'){S.ans[ex.id]=[];for(var b2=0;b2<ex.blanks.length;b2++){S.ans[ex.id].push('');}}
    if(ex.tp==='steps'){S.ans[ex.id]=[];for(var s3=0;s3<ex.steps.length;s3++){S.ans[ex.id].push(null);}}
    if(ex.tp==='multi'){S.ans[ex.id]=[];}
    if(ex.tp==='spot'){S.ans[ex.id]=[];}
    if(ex.tp==='terminal'){S.ans[ex.id]={ok:false};S.term[ex.id]=[];}
    if(ex.tp==='logview'){S.ans[ex.id]={};for(var q=0;q<ex.subs.length;q++){var sb=ex.subs[q];if(sb.k==='m'){S.ans[ex.id]['s'+q]=[];}else if(sb.k==='f1'){S.ans[ex.id]['s'+q]='';}else{S.ans[ex.id]['s'+q]=null;}}}
    if(ex.tp==='branch'){S.ans[ex.id]=[];S.bst[ex.id]=0;}
  }
}
function locked(id){return !!S.checked[id]&&!S.revised[id];}
function recomputeScore(){
  var t=0;
  for(var k in S.res){ if(S.checked[k]&&!S.revised[k]&&S.res[k]&&typeof S.res[k].earned==='number'){t+=S.res[k].earned;} }
  S.score=r1(t);
  var c=0; for(var k2 in S.checked){ if(S.checked[k2]&&!S.revised[k2]){c++;} }
  return c;
}

/* ---------- answer helpers ---------- */
function norm(v){return String(v==null?'':v).replace(/[\[\]]/g,'').replace(/\s+/g,' ').trim();}
function tokMatch(v,sets){v=norm(v);outer:for(var i=0;i<sets.length;i++){var s=sets[i];for(var j=0;j<s.length;j++){if(v.indexOf(s[j])===-1){continue outer;}}return true;}return false;}
function hasAnswer(ex){
  var a=S.ans[ex.id];
  switch(ex.tp){
    case 'qcm':return a!=null;
    case 'multi':return !!(a&&a.length);
    case 'match':for(var k in a){if(a[k]!=null)return true;}return false;
    case 'cat':for(var k2 in a){if(a[k2]!=null)return true;}return false;
    case 'order':case 'rank':return !!S.touched[ex.id];
    case 'fib':for(var i=0;i<a.length;i++){if(a[i]!=='')return true;}return false;
    case 'terminal':return !!(a&&a.ok);
    case 'logview':for(var k3 in a){var v=a[k3];if(v==null)return false;if(typeof v==='string'){if(v!=='')return true;}else if(v.length&&v.length>0)return true;}return false;
    case 'spot':return !!(a&&a.length);
    case 'steps':for(var i2=0;i2<a.length;i2++){if(a[i2]!=null)return true;}return false;
    case 'branch':return !!(a&&a.length);
  }
  return false;
}

/* ---------- grading ---------- */
function grade(ex){
  var a=S.ans[ex.id],marks={},n=0,hits=0,g={};
  function bump(key,st){marks[key]=st;}
  switch(ex.tp){
    case 'qcm':n=1;if(a===ex.a){hits=1;bump('o'+a,'ok');}else if(a!=null){bump('o'+a,'bad');var ci=[];for(var qc=0;qc<ex.o.length;qc++){if(qc===ex.a)bump('o'+qc,'ok');}}else{var ci2=[];for(var qc2=0;qc2<ex.o.length;qc2++){if(qc2===ex.a)bump('o'+qc2,'ok');}}break;
    case 'multi':n=ex.a.length;
      for(var i=0;i<ex.o.length;i++){
        var sel=a.indexOf(i)>-1,cor=ex.a.indexOf(i)>-1;
        if(cor&&sel){hits++;bump('o'+i,'ok');}else if(cor&&!sel){bump('o'+i,'miss');}else if(!cor&&sel){bump('o'+i,'bad');}
      }break;
    case 'match':n=ex.pairs.length;
      for(var s=0;s<ex.pairs.length;s++){
        if(a[s]!=null&&a[s]===s){hits++;bump('s'+s,'ok');}else{bump('s'+s,a[s]==null?'miss':'bad');}
      }break;
    case 'cat':n=ex.items.length;
      for(var c=0;c<ex.items.length;c++){
        if(a[c]!=null&&a[c]===ex.items[c].c){hits++;bump('c'+c,'ok');}else{bump('c'+c,a[c]==null?'miss':'bad');}
      }break;
    case 'order':case 'rank':n=ex.items.length;
      for(var p=0;p<a.length;p++){ if(a[p]===p){hits++;bump('p'+p,'ok');}else{bump('p'+p,'bad');} }break;
    case 'fib':n=ex.blanks.length;
      for(var b=0;b<ex.blanks.length;b++){
        var bl=ex.blanks[b],v=a[b],ok=false;
        if(bl.k==='s'){ok=(v===String(bl.o[bl.a]));}
        else if(bl.re){ok=new RegExp(bl.re).test(norm(v));}
        else if(bl.ac){ok=tokMatch(v,bl.ac);}
        if(ok){hits++;bump('b'+b,'ok');}else{bump('b'+b,norm(v)===''?'miss':'bad');}
      }break;
    case 'terminal':n=1;if(a&&a.ok){hits=1;bump('0','ok');}else{bump('0','bad');}break;
    case 'logview':n=ex.subs.length;
      for(var q=0;q<ex.subs.length;q++){
        var sb=ex.subs[q],v2=a['s'+q],ok2=false;
        if(sb.k==='q'){ok2=(v2===sb.a);}
        else if(sb.k==='m'){var hits2=0;for(var i3=0;i3<sb.o.length;i3++){var sel2=v2.indexOf(i3)>-1,cor2=sb.a.indexOf(i3)>-1;if(cor2&&sel2)hits2++;}ok2=(hits2===sb.a.length);}
        else{ok2=tokMatch(v2,sb.ac);}
        if(ok2){hits++;bump('s'+q,'ok');}else{bump('s'+q,'bad');}
      }break;
    case 'spot':n=0;for(var l=0;l<ex.lines.length;l++){if(ex.lines[l].bad)n++;}
      for(var l2=0;l2<ex.lines.length;l2++){
        var sel3=a.indexOf(l2)>-1,bad=!!ex.lines[l2].bad;
        if(bad&&sel3){hits++;bump('l'+l2,'ok');}else if(bad&&!sel3){bump('l'+l2,'miss');}else if(!bad&&sel3){bump('l'+l2,'bad');}
      }break;
    case 'steps':n=ex.steps.length;
      for(var st=0;st<ex.steps.length;st++){
        if(a[st]===ex.steps[st].a){hits++;bump('t'+st,'ok');}else{bump('t'+st,a[st]==null?'miss':'bad');}
      }break;
    case 'branch':n=ex.steps.length;
      for(var b3=0;b3<ex.steps.length;b3++){
        if(a[b3]===ex.steps[b3].a){hits++;bump('t'+b3,'ok');}else{bump('t'+b3,a[b3]==null?'miss':'bad');}
      }break;
  }
  return {n:n,hits:hits,marks:marks};
}
function doGrade(ex){
  var g=grade(ex);
  var pen=0.1*ex.pts*(S.hinted[ex.id]||0);
  var earned=r1(Math.max(0,ex.pts*g.hits/Math.max(1,g.n)-pen));
  S.res[ex.id]={earned:earned,max:ex.pts,hits:g.hits,n:g.n,marks:g.marks,pen:r1(pen)};
  S.checked[ex.id]=true;S.revised[ex.id]=false;delete S.skipped[ex.id];
  recomputeScore();
  return g;
}

/* ---------- rendering ---------- */
function render(){
  var st=el('stage'),tb=el('topbar');
  try{st.inert=false;}catch(e){}
  if(S.scr==='intro'){tb.hidden=true;st.className='';st.innerHTML=introHTML();wireIntro();}
  else if(S.scr==='exam'){tb.hidden=false;st.className=S.t.manual?'blurred':'';if(S.t.manual){try{st.inert=true;}catch(e){}}renderExam();}
  else{tb.hidden=true;st.className='';renderResults();}
  updateTop();
}
function updateTop(){
  var c=recomputeScore();
  var sc=el('score'),cn=el('checkedn');
  if(sc)sc.textContent=String(r1(S.score));
  if(cn)cn.textContent=String(c);
  var tm=el('timer');
  if(tm){tm.textContent=fmtT(Math.max(0,S.t.left));tm.className=S.t.left<300?'crit':(S.t.left<600?'low':'');}
  var pb=el('pbar'),pw=el('pbarwrap');
  if(pb){
    var tot=0,done=0;
    for(var i=0;i<EX.length;i++){tot++;if(S.res[EX[i].id]&&S.checked[EX[i].id]&&!S.revised[EX[i].id])done++;}
    var pct=Math.round(done/tot*100);pb.style.width=pct+'%';pw.setAttribute('aria-valuenow',String(pct));
  }
  var pb2=el('pausebtn');
  if(pb2){pb2.textContent=S.t.manual?'Resume':'Pause';pb2.setAttribute('aria-label',S.t.manual?'Resume the timer and show exercise content':'Pause the timer and hide exercise content');}
  var box=el('pausebox');
  if(box){
    var h='';
    if(S.t.manual&&S.scr==='exam')h+='<span class="pind">'+ICON.part+' Paused (manual) — content hidden</span>';
    if(S.t.check&&S.scr==='exam')h+='<span class="pind">'+ICON.part+' Timer paused — review mode</span>';
    box.innerHTML=h;
  }
}
function introHTML(){
  var h='<section class="hero">';
  h+='<span class="badge '+(DIFFU==='HARD'?'hard':'med')+'">'+DIFFU+' SEVERITY</span> <span class="badge blue">CompTIA Ethical Hacker Pro</span> <span class="badge blue">Chapter 2.1 — Scanning and enumeration</span>';
  h+='<h1>Identify open ports, services, and vulnerabilities</h1>';
  h+='<p class="sub">'+EX.length+' scenario-based exercises &middot; '+MINUTES+' minute timer &middot; pass mark '+PASSM+'% &middot; partial credit on multi-answer exercises.</p>';
  if(S.user)h+='<p class="greet">'+ICON.ok+' Ready, '+esc(S.user)+'.</p>';
  h+='<div class="kgrid">';
  for(var t=1;t<=6;t++){
    h+='<div class="kcard"><h3>'+THEMES[t]+'</h3><div>';
    for(var k=0;k<KEYW[t].length;k++){h+='<span class="kw">'+esc(KEYW[t][k])+'</span>';}
    h+='</div></div>';
  }
  h+='</div></section>';
  h+='<section class="rules"><h2>How this exam works</h2><ul>';
  h+='<li><b>Realistic work, not recall.</b> You will triage scanner output, read logs, type real commands in a fake shell, drag items into slots, rank risks, and make judgement calls — every exercise mirrors on-the-job work at <b>'+DIFFU+'</b> severity.</li>';
  h+='<li><b>Three blocks per exercise.</b> The SCENARIO block sets the scene. The QUESTION block asks one thing. The ANSWERS area below it tells you exactly how to answer.</li>';
  h+='<li><b>Check locks and scores.</b> Press <b>Check</b> to grade an exercise. It locks your answer for scoring, marks every element (green correct, red wrong, amber missed), shows an explanation, and pauses the timer in <b>review mode</b> — the content stays fully visible so you can learn. The timer restarts only when you press <b>Next</b> (or navigate to another exercise).</li>';
  h+='<li><b>Manual pause hides content.</b> The <b>Pause</b> button freezes the clock but blurs the exercise so it cannot be studied. Press it again to resume. Both pauses can stack; the timer runs only when both are cleared.</li>';
  h+='<li><b>Partial credit.</b> Multi-answer exercises award points per correct element. A wrong extra pick never subtracts — it just earns nothing. Single-answer exercises are all-or-nothing.</li>';
  h+='<li><b>Skipping.</b> <b>Skip</b> jumps ahead and flags the exercise (amber). You can return to skipped or checked exercises at any time before the timer ends. Skipped exercises are <b>excluded from the score</b> — numerator and denominator — unless you come back and press Check on them. The exam cannot be submitted if nothing is answered.</li>';
  h+='<li><b>Hints cost 10%.</b> Each hint reveals a nudge, never the answer, and costs 10% of that exercise\'s points.</li>';
  h+='<li><b>Results and retake.</b> The results screen shows the percentage over non-skipped exercises, a per-exercise report with explanations, and a Retake button that reshuffles everything. The timer ends the exam when it reaches zero.</li>';
  h+='</ul><button class="btn primary bigstart" id="startbtn">Start the exam</button></section>';
  return h;
}
function wireIntro(){
  var b=el('startbtn');
  if(b)b.addEventListener('click',startExam);
}

/* ---------- exam rendering ---------- */
function ansLabel(ex){
  switch(ex.tp){
    case 'qcm':return 'CHOOSE ONE';
    case 'multi':return 'SELECT ALL THAT APPLY';
    case 'match':return 'DRAG EACH CHIP TO ITS SLOT — OR CLICK A CHIP, THEN A SLOT';
    case 'cat':return 'DRAG EACH ITEM INTO A CATEGORY — OR CLICK AN ITEM, THEN A CATEGORY';

function logLinesHTML(ex){

function hlLine(l){

function renderExam(){
  var ex=curEx();
  selChip=null;

  renderFeedbackIfAny(ex);
