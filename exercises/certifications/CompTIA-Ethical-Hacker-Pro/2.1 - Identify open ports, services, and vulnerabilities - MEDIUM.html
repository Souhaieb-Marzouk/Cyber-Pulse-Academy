<script>
"use strict";
var EX=[];
/* MEDIUM exercises 1-4: port states, FIN scan on Windows, nmap command build, terminal SYN+version scan */
EX.push(
{
 id:'m01',th:1,tp:'match',pts:5,ti:'What does each port state actually tell you?',
 sc:'<p>You are a junior analyst on the Redline Corp pentest team. Your team lead asks you to explain nmap output to a new hire before the first scan window. She says: <i>"If you cannot read the port states, you cannot read the scan."</i> You open last week\'s scan notes and pick five lines with the most common states.</p>',
 q:'<p>Match each port state from the notes to what it really means. Think about <b>who answered</b> (the service, the machine, or a firewall) and <b>what answered</b>.</p>',
 pairs:[
  ['<b>open</b>','An application is listening; it accepted the connection'],
  ['<b>closed</b>','The host itself replied with RST; nothing listens on that port'],
  ['<b>filtered</b>','A firewall or ACL dropped the probe; nmap cannot tell if anything listens'],
  ['<b>open|filtered</b>','No reply at all — the port may be open, or a firewall silently dropped it'],
  ['<b>unfiltered</b>','The port is reachable, but an ACK scan cannot say if it is open or closed']
 ],
 expl:'Port states are read from who replies. A SYN-ACK or a service banner means <b>open</b>. A RST from the target stack means <b>closed</b>. Silence with no error usually means a firewall dropped the packet, so nmap says <b>filtered</b>. With UDP, a silent service gives <b>open|filtered</b>, because no reply fits both cases. <b>Unfiltered</b> comes from an ACK scan: the port answered with RST, so a firewall let it through, but an ACK scan can never say if a service listens there. Reading the state correctly decides your next step — re-probe, enumerate, or move on.',
 tip:'Always ask: did the service answer, did the stack answer, or did nobody answer? That question maps every state.',
 hx:['Ask for each state: did a service answer, did the target machine answer, or did nobody answer at all?','open|filtered is typical for UDP probes. unfiltered only appears after an ACK scan.']
},
{
 id:'m02',th:1,tp:'qcm',pts:2,ti:'The FIN scan that answered everything',
 sc:'<p>During an internal test for Meridian Logistics, you run a FIN scan (<code>-sF</code>) against a legacy file server thought to run Windows. The output surprises you: every one of the 1,000 probed ports is reported <b>closed</b>, even though a colleague\'s Connect scan showed 445/tcp clearly <b>open</b> on the same host.</p>',
 q:'<p>What is the most likely explanation for the FIN scan result?</p>',
 o:[
  'The Windows TCP stack sends RST for FIN probes whether the port is open or closed',
  'A firewall intercepted the FIN probes and answered with RST on the server\'s behalf',
  'The FIN scan only works against servers, not workstations, so the result is always wrong',
  'The service on 445/tcp crashed between the two scans and stopped listening'
 ],
 a:0,
 expl:'Windows stacks do not follow the old RFC 793 rule for odd-flag probes. On Windows, FIN, NULL and Xmas probes get a RST for open <b>and</b> closed ports, so every port shows as closed and the scan gives no useful signal. A firewall answering RST would usually mark ports filtered or show one uniform pattern, not "closed" across the board. FIN scans do not only target servers, and 445/tcp was proven open minutes earlier, so the other options do not fit.',
 tip:'FIN, NULL and Xmas scans are reliable on old UNIX-like stacks, but on Windows machines use SYN or Connect scans to tell open from closed.',
 why:{
  w:'RST from a firewall would normally leave ports "filtered" in nmap output; the "closed" verdict comes from the target stack itself.'
 },
 hx:['Think about which operating system family ignores FIN/NULL/Xmas probes and resets them all.']
},
{
 id:'m03',th:1,tp:'fib',pts:3,ti:'Build the scan command for the ticket',
 sc:'<p>Ticket PLN-2311 asks for a quick check of two Windows management ports on <code>srv-db01.corp.local</code>. The client wants a fast scan that still looks like normal traffic — nothing so slow it misses the change window, nothing so loud it trips the IDS. You decide on a half-open SYN scan of ports 445 and 3389 with nmap\'s default speed.</p>',
 q:'<p>Complete the command. Choose the scan type, the port flag, and the timing template that fit the ticket.</p>',
 fhtml:'<code>nmap {{b0}} {{b1}} {{b2}} srv-db01.corp.local</code>',
 blanks:[
  {k:'s',o:['-sS','-sT','-sU','-sA','-sV'],a:0},
  {k:'s',o:['-p 445,3389','--top-ports 100','-p-','-p 1-1024'],a:0},
  {k:'s',o:['-T3','-T0','-T5','-T2'],a:0}
 ],
 expl:'<code>-sS</code> is the SYN (half-open) scan: nmap sends SYN, reads SYN-ACK, and never completes the handshake, so most systems log it less loudly than a full Connect scan (<code>-sT</code>). The ticket names two specific ports, so <code>-p 445,3389</code> is right — port lists never need <code>-p-</code> (all 65,535 ports) or a top-ports guess. <code>-T3</code> is nmap\'s default timing: quick enough for two ports and not obviously a scan. <code>-T0</code> and <code>-T2</code> are needlessly slow for the window, and <code>-T5</code> floods the wire and is the easiest for an IDS to spot.',
 tip:'Match the scan type to the goal first, then the port list from the ticket, then pick timing — never louder than the client agreed to.',
 why:{
  w1:'-sU probes UDP services such as SNMP or NTP; the ticket names TCP management ports.',
  w2:'-sA maps firewall rules, it does not confirm open services.',
  w3:'-sV adds version probes — a different job from the one in the ticket.'
 },
 hx:['"Half-open" is the nickname of one specific scan type. For speed, nmap\'s default template is -T3; -T0 is paranoid-slow, -T5 is insane-fast.']
},
{
 id:'m04',th:1,tp:'terminal',pts:2,ti:'Terminal: the first recon scan',
 sc:'<p>You are on the client\'s isolated lab range. Your target is the host <code>web01.corp.local</code>. The engagement notes say: <i>"Half-open scan the live web host, and pull service versions in the same pass so the report has something to work with."</i></p>',
 q:'<p><b>Use a <code>nmap</code> command.</b> Perform a SYN scan (half-open, flag <code>-sS</code>) with version detection (flag <code>-sV</code>) against <code>web01.corp.local</code>. Extra flags are allowed; the command family, both flags, and the target must be correct. Commands are case-sensitive, like a real shell.</p>',
 goal:'SYN scan web01.corp.local with version detection using nmap',
 ac:[['nmap','-sS','-sV','web01.corp.local']],
 out:'Starting Nmap 7.94 ( nmap lab build )\nNmap scan report for web01.corp.local (10[.]20[.]30[.]11)\nHost is up (0.0011s latency).\nNot shown: 997 closed tcp ports (reset)\nPORT     STATE SERVICE VERSION\n22/tcp   open  ssh     OpenSSH 8.9p1\n80/tcp   open  http    nginx 1.24.0\n3389/tcp open  ms-wbt-server Microsoft Terminal Services\nNmap done: 1 host address scanned in 4.22 seconds',
 ansKey:'nmap -sS -sV web01.corp.local',
 expl:'A single nmap run can chain both goals: <code>-sS</code> performs the half-open SYN scan, and <code>-sV</code> follows the port scan with version probes against every port it finds open, filling the VERSION column. The output shape (PORT / STATE / SERVICE / VERSION) is what you paste into the ticket. Flags can come in any order and extra options are fine — the goal is the combination of scan type, version detection, and the correct target.',
 tip:'Say what each flag does out loud: -sS chooses the SYN technique, -sV adds the version probes, and the target must be a host you are authorized to test.',
 hx:['Start with nmap, then add -sS for the SYN scan. Version detection is one more flag that starts with -sV.','Example shape: nmap -sS -sV &lt;target&gt; — type the hostname exactly as given.']
}
);
/* MEDIUM exercises 5-8: nmap output logview, ports-to-services match, netcat banner qcm, -sV logview */
EX.push(
{
 id:'m05',th:1,tp:'logview',pts:3,ti:'Read the sweep output like an analyst',
 sc:'<p>You finished a quick <code>nmap -sn</code> sweep of the 10[.]20[.]30[.]0/24 lab range, then ran a fast top-ports SYN scan on the three live hosts. This is the raw output from your notes.</p>',
 q:'<p>Use the filter box if the wall of text gets heavy. Then answer the two questions under the log.</p>',
 log:[

  {s:'ok', l:'22/tcp   open    ssh'},
  {s:'ok', l:'445/tcp  open    smb'},

  {s:'info',l:'Nmap scan report for 10[.]20[.]30[.]22 (legacy-print01.corp.local)'},

 ],
 subs:[

    'SMB is confirmed closed — no service listens on 445 on web01',

 ],
 expl:'Counting what you actually learned is the analyst habit: filesrv01 answers with two high-value ports (SMB on 445, RDP on 3389) that both have deep enumeration and attack paths, so it offers the most to work with. On web01, <b>filtered</b> means the probes got no answer because something dropped them — the packet never reached the port, so nmap cannot say open or closed. Only a RST from the host would prove <b>closed</b>.',
 tip:'When a scan shows filtered, plan a different probe or a different vantage point — do not write the port off as closed.',
 why:{

  w2:'"Closed" requires a RST from the host itself; filtered is silence from a filter.'
 },
 hx:['Count the open ports per host and think about which ones have known enumeration tools.','Filtered = dropped by a filter, not refused by the machine.']
},
{
 id:'m06',th:2,tp:'match',pts:6,ti:'Ports you will meet every week',
 sc:'<p>New-hire week at the SOC. Your mentor drops six scan lines on your desk and says the fastest way to read any scan is to know the common service ports by heart. "The version column helps," she says, "but the port number already tells the story."</p>',
 q:'<p>Match each port to the service that normally runs on it.</p>',
 pairs:[
  ['445/tcp','SMB — Windows file sharing and much more'],
  ['389/tcp','LDAP — directory queries'],
  ['161/udp','SNMP — device management data'],
  ['3389/tcp','RDP — Windows remote desktop'],
  ['25/tcp','SMTP — mail transfer'],
  ['3306/tcp','MySQL — database']
 ],
 expl:'A small set of ports carries most enterprise services: 445 SMB, 389 LDAP, 161/UDP SNMP, 3389 RDP, 25 SMTP, 3306 MySQL. Knowing them lets you plan the next step instantly — 445 leads to share and user enumeration, 161 to device data through community strings, 3389 to remote access review. Port numbers are a hint, not proof: services can be moved to odd ports, which is exactly why version detection exists.',
 tip:'Learn these six first; they cover most internal scan reports you will ever read.',
 hx:['SNMP is the odd one out — it runs over UDP, not TCP.']
},
{
 id:'m07',th:2,tp:'qcm',pts:2,ti:'Grab the banner by hand',
 sc:'<p>Before pointing the full scanner at <code>mail01.corp.local</code>, you want a quick human look at what the FTP service on port 21 says about itself. Banners often reveal the exact software and version in plain text, with no scan engine involved.</p>',
 q:'<p>Which one-liner gives you the banner by simply connecting and reading the greeting the service sends first?</p>',
 o:[
  'nc mail01.corp.local 21',
  'dig mail01.corp.local -p 21',
  'nmblookup -A mail01.corp.local',
  'traceroute -p 21 mail01.corp.local'
 ],
 a:0,
 expl:'<code>netcat</code> (nc) opens a plain TCP connection to the port you name and shows whatever the service sends first — that greeting line is the banner, and FTP servers greet you before you type anything. <code>dig</code> speaks DNS and cannot read an FTP greeting, <code>nmblookup</code> speaks NetBIOS naming, and <code>traceroute</code> maps hops, not services. Banner grabbing is valuable because it is one packet, it is quiet, and it often names the software and version before any scanner runs.',
 tip:'Connect with netcat, read the greeting, and check that version against CVE lists before the heavy scan.',
 why:{
  w2:'dig only queries DNS servers; it never completes an FTP conversation.',
  w3:'nmblookup asks the NetBIOS name service — a different protocol that never reads an FTP greeting.'
 },
 hx:['The right tool is the simplest one that just opens a TCP connection and prints what comes back.']
},
{
 id:'m08',th:2,tp:'logview',pts:3,ti:'Version column triage',
 sc:'<p>Your <code>nmap -sV</code> run against <code>app01.corp.local</code> finished. The client asked: "Tell us which open service should worry us first, and give us the exact version strings for the report." The output below is your working material.</p>',
 q:'<p>Read the log (filter it if useful), then answer the two questions under it.</p>',
 log:[
  {s:'hl', l:'Starting Nmap 7.94 with -sV --version-intensity 7'},
  {s:'info',l:'Nmap scan report for app01.corp.local (10[.]20[.]30[.]40)'},
  {s:'ok', l:'PORT     STATE SERVICE VERSION'},
  {s:'ok', l:'22/tcp   open  ssh     OpenSSH 8.4p1'},
  {s:'warn',l:'80/tcp   open  http    Apache httpd 2.4.29'},
  {s:'ok', l:'443/tcp  open  ssl/https Apache httpd 2.4.29'},
  {s:'warn',l:'8080/tcp open  http    Apache Tomcat 9.0.30'},
  {s:'ok', l:'3306/tcp open  mysql   MySQL 8.0.19'},
  {s:'info',l:'Service detection performed; OS guess: Linux 5.x (TTL 64)'}
 ],
 subs:[
  {k:'q',q:'Which finding should the report raise first, based only on this output?',o:[
    'Apache httpd 2.4.29 — old release, known CVEs, exposed on 80 and 443',
    'OpenSSH 8.4p1 — SSH is always the first thing to report',
    'MySQL 8.0.19 — databases must always be reported before anything else',
    'Tomcat 9.0.30 — application servers are never important'],a:0},
  {k:'q',q:'The line "OS guess: Linux 5.x (TTL 64)" is based on which simple clue?',o:[
    'The TTL value in replies — 64 is the usual starting value for Linux',
    'The Apache version string, since it names the kernel',
    'The number of open ports the scan reported for the host',
    'The total scan duration that nmap reported at the end'],a:0}
 ],
 expl:'Version columns let you rank findings before any CVE lookup: Apache 2.4.29 is an old release with well-known public exploits and it faces the network on two ports, so it leads the report. OS guessing in this output leans on a tiny detail — the <b>TTL</b> in the IP replies. Stacks start packets at 64 (Linux), 128 (Windows) or 255 (network gear); subtracting hops from the starting value identifies the family. That is passive fingerprinting from data you already have.',
 tip:'Rank by exposure plus version age. Then confirm versions with a credentialed check before calling them vulnerable.',
 why:{
  w2:'A version string never names the kernel; the TTL does the talking here.',
  w3:'"Always report X first" is not a ranking rule — exposure and known flaws are.'
 },
 hx:['Look for the oldest major version that is also the most exposed.','Linux boxes start TTL at 64, Windows at 128.']
}
);
/* MEDIUM exercises 9-12: NSE fib, enumeration-reveals cat, null session qcm, dig AXFR fib */
EX.push(
{
 id:'m09',th:2,tp:'fib',pts:3,ti:'Point an NSE script at the target',
 sc:'<p>You confirmed 445/tcp is open on <code>srv-files01.corp.local</code>. Before enumerating by hand, one nmap scripting-engine call can pull the OS banner, domain name and SMB signing status in a single pass. The team standard is to keep version probes light while the script does the talking.</p>',
 q:'<p>Complete the command with the right script name, the script engine flag order, and a light version-probe intensity.</p>',
 fhtml:'<code>nmap {{b0}} {{b1}} -p 445 {{b2}} srv-files01.corp.local</code>',
 blanks:[
  {k:'s',o:['--script smb-os-discovery','--script http-title','--script ftp-anon','--script smtp-commands'],a:0},
  {k:'s',o:['--script','--script-args','--script-updatedb'],a:0},
  {k:'s',o:['--version-intensity 0','--version-intensity 9','-sV --version-trace'],a:0}
 ],
 expl:'<code>--script smb-os-discovery</code> asks the SMB service itself for its OS banner, hostname and domain — exactly the recon this ticket wants. The engine is switched on with <code>--script</code> plus the script name; <code>--script-args</code> would pass parameters and <code>--script-updatedb</code> only refreshes the library. Keeping version probes at intensity 0 keeps the pass quiet: the script gives you the data, and aggressive version probing would only add noise the client did not ask for. Choosing a web or FTP script against port 445 would simply return nothing.',
 tip:'Match the script to the open service, and keep extra probing light when a script already answers the question.',
 why:{
  w1:'http-title talks to web servers; ftp-anon and smtp-commands target their own protocols, none of which is SMB on 445.',
  w2:'--script-args passes values to a script; it never selects one.'
 },
 hx:['The script name starts with smb- and ends with -discovery. The flag that loads a script is literally --script.']
},
{
 id:'m10',th:3,tp:'cat',pts:5,ti:'What does each protocol give away?',
 sc:'<p>You are planning the enumeration phase for the Redline internal assessment. The client asked: "Before you touch anything, tell us what each protocol would actually leak." You write one line per protocol on the whiteboard — the testers around you argue, then agree.</p>',
 q:'<p>Sort each artifact into the protocol that reveals it.</p>',
 cats:['DNS','SMTP','SNMP','SMB / NetBIOS'],
 items:[
  {t:'A successful AXFR hands you a full copy of the zone file',c:0},
  {t:'VRFY answers with "alice@corp.local — recipient ok"',c:1},
  {t:'snmpwalk returns sysDescr with the router model and IOS version',c:2},
  {t:'nbtstat shows the name table with a &lt;20&gt; server service entry',c:3},
  {t:'EXPN expands a mail alias into its member addresses',c:1},
  {t:'A PTR sweep lists hostnames for every address in the range',c:0},
  {t:'A walk of the interfaces OID maps every network the device routes',c:2},
  {t:'enum4linux lists shares, users and the domain SID',c:3}
 ],
 expl:'Each protocol leaks its own kind of data. <b>DNS</b> gives names and structure: a zone transfer (AXFR) copies the whole zone, and reverse (PTR) sweeps turn address ranges into hostnames. <b>SMTP</b> leaks people: VRFY confirms a mailbox exists and EXPN expands mailing lists. <b>SNMP</b> leaks devices: system description OIDs name hardware and software, and interface OIDs map networks. <b>SMB / NetBIOS</b> leaks the Windows estate: name tables, shares, users, and the domain SID. Knowing which door opens which drawer is the core of good enumeration planning.',
 tip:'When you find a protocol open, write down what it leaks before you run anything — it keeps the enumeration purposeful and the report focused.',
 hx:['Names and zone copies live in DNS; mailboxes and aliases live in SMTP.','Device OIDs belong to SNMP; shares, users and name tables belong to SMB.']
},
{
 id:'m11',th:3,tp:'qcm',pts:2,ti:'The session with no credentials',
 sc:'<p>Your <code>enum4linux</code> run against <code>srv-files02.corp.local</code> prints a full user list and share list — and at the top, the note: "getting information via anonymous (null) session". The client\'s admin looks surprised: "But you have no account!"</p>',
 q:'<p>What is a null session in this context?</p>',
 o:[
  'An unauthenticated connection to SMB that some legacy configurations still allow',
  'A session where the scanning tool crashed before a single packet was sent',
  'A VPN tunnel that authenticates the client without a username',
  'An account whose password field was left empty in the directory'
 ],
 a:0,
 expl:'A null session is an SMB connection made with no username and no password — the old anonymous logon. Legacy or misconfigured Windows systems still accept it and then hand out user lists, share lists and more, which is why enum4linux tries it first. It is not a crashed tool, not a VPN trick, and not an empty-password account (that would be a different, and even worse, finding). A working null session is a real finding on its own: it hands an attacker a target map with zero credentials.',
 tip:'Treat a null session as a finding, not a convenience — recommend disabling anonymous enumeration.',
 why:{
  w1:'If the tool had crashed you would have no user list; the note says the data came through the anonymous session.'
 },
 hx:['"Null" describes the credentials you used — none at all.']
},
{
 id:'m12',th:3,tp:'fib',pts:3,ti:'Ask DNS for the whole zone',
 sc:'<p>DNS server <code>ns1.corp.local</code> serves the client\'s internal zone. Your plan: try a zone transfer and, if it fails, fall back to reverse sweeps. A zone transfer in one packet beats hours of guessing hostnames, so it is always the first DNS move.</p>',
 q:'<p>Complete the <code>dig</code> command: name the server you query and the record type that requests a full zone transfer.</p>',
 fhtml:'<code>dig {{b0}} ns1.corp.local {{b1}} corp.local</code>',
 blanks:[
  {k:'s',o:['@','--server','-x'],a:0},
  {k:'s',o:['AXFR','A','PTR','MX','ANY'],a:0}
 ],
 expl:'<code>dig @ns1.corp.local AXFR corp.local</code> asks that specific server for the <b>AXFR</b> record type — the zone transfer. The <code>@</code> pins the query to one server instead of your resolver, and AXFR is the DNS opcode that says "send me every record in the zone". If the server is misconfigured and allows it, you get the full host list in seconds: web servers, domain controllers, printers, legacy boxes. A properly configured server answers with a transfer refused, and you fall back to PTR sweeps (<code>-x</code> is for reverse lookups one address at a time).',
 tip:'AXFR is the first DNS question of every assessment — it costs one query and can hand you the whole map.',
 why:{
  w2:'-x performs a single reverse lookup; it never pulls a zone.'
 },
 hx:['The server goes after an @ sign. The special record type that means "give me the zone" is four capital letters.']
}
);
/* MEDIUM exercises 13-16: triage steps, scan-accuracy multi, CVSS band qcm, risk ranking */
EX.push(
{
 id:'m13',th:3,tp:'steps',pts:4,ti:'SOC triage: four scanner alerts, four calls',
 sc:'<p>Monday, 09:10. The authenticated scanner finished its pass over the 10[.]20[.]40[.]0/24 office range overnight and dropped four findings in the queue. You take them in order. Each one needs the right next action — not panic, not silence.</p>',
 q:'<p>For each alert, pick the best next action.</p>',
 steps:[
  {p:'<b>Alert 1 — SMBv1 enabled on 10[.]20[.]40[.]7</b> (legacy file share). SMBv1 is obsolete and worm-friendly. What is the right next step?',o:[
    'Raise it as High: disable SMBv1, keep SMBv2/v3, document legacy dependencies',
    'Ignore it — SMBv1 is old but harmless once the firewall is in place',
    'Recommend removing the server from the network immediately, no analysis needed',
    'Rate it Informational because the share is internal-only anyway'],a:0},
  {p:'<b>Alert 2 — Anonymous FTP login allowed on 10[.]20[.]40[.]19</b>. The FTP root contains three folders. What is the right next step?',o:[
    'Check what the folders expose, then report the access and its business impact',
    'Download everything and delete the folders to prove the risk',
    'Report nothing — FTP is encrypted anyway, so there is no risk',
    'Rate it Critical without checking what the folders contain'],a:0},
  {p:'<b>Alert 3 — SNMP responds to community string "public" on 10[.]20[.]40[.]2</b> (core switch). What is the right next step?',o:[
    'Enumerate what the string exposes, then recommend SNMPv3 or a strong community',
    'Try to change the switch configuration through SNMP right away',
    'Ignore it — SNMP is a monitoring protocol, not a security issue',
    'Rate it Critical simply because the switch is a network device'],a:0},
  {p:'<b>Alert 4 — RDP open on 10[.]20[.]40[.]31 without NLA</b> (Network Level Authentication). What is the right next step?',o:[
    'Report it — without NLA the login prompt faces pre-authentication attacks',
    'Brute-force the RDP login yourself to prove it is weak',
    'Rate it Informational since RDP is a standard service',
    'Ask the client to close every port on the host, just in case'],a:0}
 ],
 expl:'Good triage pairs a fact with proportionate action. SMBv1 earns High because worms ride it; the fix is configuration, not panic. Anonymous FTP earns a look inside before rating — the impact depends on what it exposes. A default SNMP community ("public") is a classic High on network gear because it leaks system and interface data; the fix is SNMPv3 or a strong community, not a live config change by the tester. RDP without NLA lowers the bar for attackers against the login surface, so it stays a genuine finding even though RDP itself is normal.',
 tip:'Rate by exploitability and blast radius, verify impact before writing the number, and never change client systems yourself.',
 why:{
  w1:'Removing a production server unilaterally is outside a tester\'s role.',
  w2:'FTP is plaintext — encryption is exactly what it lacks.',
  w3:'"Critical" must follow the exposure, not the device type; a read-only leak is typically High.'
 },
 hx:['The tester verifies and reports; the client changes their own systems.','Anonymous FTP severity depends on what the folders hold — look first, then rate.']
},
{
 id:'m14',th:4,tp:'multi',pts:4,ti:'What makes a vulnerability scan trustworthy?',
 sc:'<p>The client\'s security manager asks why last year\'s scan report missed a known flaw on the ERP server. You walk her through the settings that decide whether a scanner tells the truth. Four of the six items on her list genuinely improve accuracy or trust; two do not.</p>',
 q:'<p>Select every item that genuinely improves the accuracy or trustworthiness of a vulnerability scan.</p>',
 o:[
  'Running credentialed (authenticated) scans so the scanner can read installed patches',
  'Updating the plugin feed before the scan window',
  'Re-scanning after remediation to confirm the fixes landed',
  'Scheduling the scan inside an agreed change window',
  'Turning off safe checks so aggressive tests run against production',
  'Scanning through a load balancer so one scan covers many servers'
 ],
 a:[0,1,2,3],
 expl:'Trustworthy results come from visibility and hygiene. <b>Credentialed</b> scans log into the host and read the real patch level, catching what network-only probes miss. A <b>current plugin feed</b> means the engine knows today\'s flaws, not last year\'s. A <b>re-scan after remediation</b> closes the loop and proves the fix. An <b>agreed change window</b> keeps the scan valid and the business safe. Disabling safe checks on production trades accuracy for outages — that is how scanners crash printers and legacy apps. Scanning through a load balancer blurs which server actually has the flaw and corrupts both findings and remediation tickets.',
 tip:'Credentialed, current, confirmed, coordinated — those four words carry most of scan quality.',
 why:{
  w1:'Aggressive checks against production create the false alarms and outages safe checks exist to prevent.',
  w2:'A load balancer mixes answers from several backends, so no single server is honestly assessed.'
 },
 hx:['Two items sound efficient but actually damage accuracy or stability.','Ask of each item: does it increase what the scanner can see, or just what it can break?']
},
{
 id:'m15',th:4,tp:'qcm',pts:2,ti:'Put the severity band on the finding',
 sc:'<p>A plugin flags the ERP server\'s support portal: <code>AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:H</code>. The report engine prints a numeric score of 6.3. The ticket template needs the band name before you can route it.</p>',
 q:'<p>Which CVSS severity band does 6.3 fall into?</p>',
 o:['Medium (4.0–6.9)','High (7.0–8.9)','Critical (9.0–10.0)','Low (0.1–3.9)'],
 a:0,
 expl:'CVSS v3 bands are fixed: 0.1–3.9 Low, 4.0–6.9 Medium, 7.0–8.9 High, 9.0–10 Critical. A 6.3 therefore lands in <b>Medium</b>. The vector tells you why it is not higher: the attacker needs some privileges (<code>PR:L</code>) and confidentiality and integrity losses are low — only availability is high. Routing by band keeps tickets honest: a Medium gets scheduled work, not the emergency lane.',
 tip:'Memorize the four band edges — 4, 7 and 9 — and you can route any finding without a calculator.',
 why:{
  w1:'High starts at 7.0; 6.3 is below that edge.',
  w2:'Critical starts at 9.0 and usually needs full C/I/A at network reach with no privileges.'
 },
 hx:['The bands break at 4, 7 and 9. Where does 6.3 sit between them?']
},
{
 id:'m16',th:4,tp:'rank',pts:5,ti:'Rank the findings for the remediation sprint',
 sc:'<p>The client gives your team one sprint of remediation time and asks for a ranked list — worst first. You have five confirmed findings with their context. Rank them the way a risk-driven report should.</p>',
 q:'<p>Rank from highest remediation priority (top) to lowest (bottom).</p>',
 items:[
  'RDP reachable from the internet with signs matching BlueKeep (CVE-2019-0708), CVSS 9.8, public exploits available',
  'SMBv1 enabled on two internal file servers, CVSS 8.1, worm-style propagation path',
  'Anonymous FTP on a build server, CVSS 5.3, exposes internal hostnames in listings',
  'TLS 1.0 still enabled on an internal reporting portal, CVSS 5.3, no exposure to the internet',
  'ICMP timestamp replies allowed on all workstations, CVSS 2.1, leaks uptime only'
 ],
 expl:'Risk ranking weighs exposure, exploitability, and impact together. The internet-facing RDP with a public exploit for CVE-2019-0708 is the sprint\'s first task — it needs no credentials and internet attackers scan for it hourly. SMBv1 comes next: internal today, but one phished laptop makes it a worm path. The build server\'s anonymous FTP leaks reconnaissance data; TLS 1.0 on an internal portal is a hardening gap with no current exposure; ICMP timestamp is noise-level. Same CVSS number does not mean same priority — context moves findings up and down the list.',
 tip:'Internet + public exploit beats everything. Then blast radius, then plain hardening gaps.',
 hx:['Which finding can an attacker on the internet exploit today, with a ready-made exploit?','Two findings share CVSS 5.3 — the one whose data helps further attacks ranks higher.']
}
);
/* MEDIUM exercises 17-20: Nessus policy spot, nmap flags match, filtered-host qcm, IDS logview */
EX.push(
{
 id:'m17',th:4,tp:'spot',pts:2,ti:'Spot the mistake: the scan policy ticket',
 sc:'<p>A junior analyst drafted the scanner policy for tonight\'s authenticated run. The change ticket reads like this. Two lines are wrong and would ruin the scan or breach the engagement rules. You review before the window opens.</p>',
 q:'<p>Click the <b>two</b> lines that contain mistakes.</p>',
 lines:[
  {t:'TICKET SEC-884 — authenticated scan of 10[.]20[.]50[.]0/24 (application tier)',bad:false},
  {t:'1. Plugin feed: updated from vendor feed this morning',bad:false},
  {t:'2. Authentication: SSH creds from vault, service account with read access',bad:false},
  {t:'3. Scan mode: uncredentialed only — credentials untested, skip them',bad:true},
  {t:'4. Safe checks: enabled, production window agreed with the client',bad:false},
  {t:'5. Extra targets: also scan 10[.]20[.]90[.]0/24 if time remains',bad:true},
  {t:'6. Report: export results to the shared findings folder after the run',bad:false}
 ],
 expl:'Line 3 defeats the ticket\'s own purpose: the run is titled <b>authenticated</b>, and an uncredentialed pass cannot read installed patches — it is exactly how last year\'s misses happened. Line 5 breaks scope: 10[.]20[.]90[.]0/24 is not in the authorization, and testers never scan "if time remains" into networks the client did not approve. The other lines are correct practice: fresh plugin feed, read-only service account from the vault, safe checks on in an agreed window, and results into the findings folder.',
 tip:'Scope is a fence, not a suggestion. And an authenticated scan needs credentials to be authenticated.',
 why:{
  w1:'"Skip them" is the mistake — the run exists to use them; uncredentialed-only belongs in a discovery pass, not this ticket.'
 },
 hx:['Compare the ticket title with line 3.','Check the authorized range in the title against line 5.']
},
{
 id:'m18',th:5,tp:'match',pts:6,ti:'Nmap flags and what they really do',
 sc:'<p>Your team lead slides you a cheat sheet with six nmap flags and asks you to present it at stand-up. "If you cannot say what a flag does," she says, "you cannot predict what the scan will look like on the wire — or in the IDS."</p>',
 q:'<p>Match each flag to its effect.</p>',
 pairs:[
  ['-sU','Scans UDP services such as SNMP, NTP and DNS'],
  ['-Pn','Treats every host as live; skips host discovery pings'],
  ['-sn','Host discovery only; no port scan at all'],
  ['-D','Sends decoy packets from spoofed sources alongside the real probe'],
  ['-g 53','Forces the scan\'s source port to 53'],
  ['-sI','Performs an idle scan through a zombie host']
 ],
 expl:'Each flag changes a different dial. <code>-sU</code> switches protocols to UDP, where silence means open|filtered. <code>-Pn</code> skips the discovery stage and scans every listed host — right when ICMP is blocked, wasteful when it is not. <code>-sn</code> is the opposite: find live hosts, then stop. <code>-D</code> buries your real probe among decoys. <code>-g 53</code> rewrites the source port to DNS, hoping old stateless rules let port-53 traffic through. <code>-sI</code> makes a zombie host send the probes, hiding your machine entirely.',
 tip:'Group the flags by job: protocol (-sU), discovery (-Pn, -sn), cover (-D, -g, -sI).',
 hx:['Two flags are about discovery — one says "skip it", one says "do only it".','The idle scan flag names the scan and its zombie helper.']
},
{
 id:'m19',th:5,tp:'qcm',pts:2,ti:'The silent host in a noisy range',
 sc:'<p>Your SYN scan of 10[.]20[.]60[.]0/24 shows most hosts answering normally. One host — 10[.]20[.]60[.]77 — reports <b>all 1,000 probed ports filtered</b>, and it did not answer the discovery ping either. Other hosts on the same subnet behave normally.</p>',
 q:'<p>What is the most likely explanation?</p>',
 o:[
  'A host-based firewall on that machine drops your probes on every port',
  'The host is powered off, so nmap reported every port filtered',
  'The IDS on the subnet is replaying recorded responses',
  'The scanner lost its route to that single host only'
 ],
 a:0,
 expl:'Filtered everywhere plus no ping response, while neighbours answer, points at a <b>host-based firewall</b> silently dropping your packets — the machine is up, it just refuses to talk to you. A powered-off host cannot answer at all, and nmap would mark ports down or "host down", not filtered. An IDS records or alerts; it does not eat packets on one host\'s behalf (an IPS could, but that is effectively the same silent-drop conclusion). A lost route would usually be visible in the scanner\'s own errors and would not present as a clean filtered table.',
 tip:'Filtered means "something between me and the port stayed silent". One silent host among loud neighbours = that host\'s own firewall.',
 why:{
  w1:'An off host produces no port table at all — nmap prints "Host down", not a filtered list.'
 },
 hx:['Compare the silent host with its talkative neighbours — what is different about it, not about the network?']
},
{
 id:'m20',th:5,tp:'logview',pts:3,ti:'The IDS is talking — are you listening?',
 sc:'<p>During your scan window the client\'s SOC forwards a slice of IDS alerts from the 10[.]20[.]70[.]0/24 segment. The scanner runs from 10[.]20[.]70[.]240. Read what the sensors saw.</p>',
 q:'<p>Filter the log as needed and answer the two questions under it.</p>',
 log:[
  {s:'info',l:'Suricata sensor s2 — segment 10[.]20[.]70[.]0/24'},
  {s:'err',l:'12:04:01 [ALRT] ET SCAN Suricata: Possible TCP Port Scan — 10[.]20[.]70[.]240 -> 10[.]20[.]70[.]5 ports 1-380 (SYN, no ACK)'},
  {s:'err',l:'12:04:03 [ALRT] ET SCAN Possible TCP Port Scan — 10[.]20[.]70[.]240 -> 10[.]20[.]70[.]5 ports 381-760 (SYN, no ACK)'},
  {s:'err',l:'12:04:05 [ALRT] ET SCAN Possible TCP Port Scan — 10[.]20[.]70[.]240 -> 10[.]20[.]70[.]5 ports 761-1024 (SYN, no ACK)'},
  {s:'warn',l:'12:04:09 [NOTE] firewall fw-edge: rate-limit applied to 10[.]20[.]70[.]240 (threshold: 400 SYN/s)'},
  {s:'warn',l:'12:05:44 [NOTE] firewall fw-edge: rate-limit released for 10[.]20[.]70[.]240'},
  {s:'info',l:'12:06:02 [INFO] scan window SC-W-2211 active until 13:00 — source 10[.]20[.]70[.]240 approved'}
 ],
 subs:[
  {k:'q',q:'What did the sensors actually observe?',o:[
    'A SYN (half-open) port scan — SYNs to many ports, no handshake',
    'A slow password brute-force against the SSH service',
    'A DNS zone transfer attempt against the name server',
    'Normal web traffic that the sensor mislabeled'],a:0},
  {k:'q',q:'The firewall applied rate limiting to your scanner. As the tester, what is the right response?',o:[
    'Slow the scan and note the rate limiting — the alerts were expected in the agreed window',
    'Escalate immediately — the firewall is broken and must be disabled for the rest of the test',
    'Spoof your source address so the firewall cannot rate-limit you',
    'Stop everything — being detected means the test has already failed'],a:0}
 ],
 expl:'The signature tells the story: bursts of SYN packets to consecutive ports with no handshake completion is the exact shape of a <b>SYN scan</b>. Rate limiting is a normal, defensive reaction, and the log itself shows the scan window was approved — so the professional response is to slow down and document, not to break things or hide. Getting detected is not failure; tests are usually <i>expected</i> to be visible to the blue team, and the window exists so nobody panics. Spoofing your source to dodge controls is out of bounds for an agreed engagement.',
 tip:'Read the log as three layers: what happened (scan), what defended (rate limit), what context (approved window).',
 why:{
  w2:'Disabling controls is never the tester\'s call — the window exists precisely so defenses can stay on.'
 },
 hx:['"SYN, no ACK" in the alert text is the scan\'s fingerprint.','Check the last log line before deciding what to do.']
}
);
/* MEDIUM exercises 21-24: evasion multi, methodology order, ROE fib, report contents multi */
EX.push(
{
 id:'m21',th:5,tp:'multi',pts:3,ti:'Quieter scans, same answers',
 sc:'<p>The client\'s IDS flagged your first pass within ninety seconds — alerts like the port-scan signatures you have already triaged today. The engagement notes allow stealth work as long as everything stays in scope. Your options for the second pass are on the table.</p>',
 q:'<p>Select every technique that legitimately makes a scan harder to detect or slower to alarm.</p>',
 o:[
  'Drop to a slow timing template such as -T1',
  'Split probes into small IP fragments with -f',
  'Add decoy sources with -D so alerts point at several addresses',
  'Push timing to -T5 so the scan finishes before the IDS reacts',
  'Set --spoof-mac to the address of the client\'s own printer vendor',
  'Remove the source IP from the authorization letter so nobody can trace it'
 ],
 a:[0,1,2],
 expl:'Slow timing (<code>-T1</code>) spreads probes over time so no alert threshold trips. <b>Fragmentation</b> (<code>-f</code>) splits probes into tiny pieces, hoping the target reassembles them while older sensors cannot. <b>Decoys</b> (<code>-D</code>) put fake sources next to your real one, blurring who scanned. The rest are wrong on purpose: <code>-T5</code> is the loudest option on the wire, not a stealth tool. Spoofing the MAC of the client\'s own printer only helps on the local segment and misuses their equipment identity. Removing yourself from the authorization is not evasion — it is a rules violation that can void the engagement.',
 tip:'Evasion = spreading in time, space, or protocol — never breaking the rules you signed.',
 why:{
  w1:'-T5 sends packets as fast as the NIC allows; that is the opposite of quiet.',
  w2:'A spoofed MAC imitates a device you have no permission to imitate — a trust problem, not a technique.'
 },
 hx:['Real techniques spread the same probes over more time, more pieces, or more fake sources.','One option here is not evasion at all — it is breaking the engagement contract.']
},
{
 id:'m22',th:6,tp:'order',pts:6,ti:'Put the methodology in order',
 sc:'<p>You are writing the test plan for the autumn assessment. The client\'s CISO wants to see that your process is a ladder, not a pile of tools. Each rung only makes sense after the one before it.</p>',
 q:'<p>Order the engagement steps from first to last.</p>',
 items:[
  'Obtain written authorization and agree the scope (ROE)',
  'Host discovery — find the live systems (ping sweep, ARP scan)',
  'Port scan the live hosts to find open ports',
  'Service and version detection on the open ports',
  'Enumeration of the services found (SMB, SNMP, LDAP, DNS)',
  'Vulnerability scanning and analysis of what was enumerated',
  'Report writing: findings, evidence, remediation'
 ],
 expl:'The ladder is authorization first — nothing runs without it. Discovery finds <i>who is alive</i>; the port scan asks each live host <i>what doors are open</i>; version detection asks each door <i>who is behind it</i>; enumeration asks each service <i>what will it tell me</i>; the vulnerability scan weighs what all of that means; and the report turns it into fixes. Skipping a rung wastes effort — vulnerability-scanning dead hosts or enumerating ports that are filtered tells you nothing.',
 tip:'Memorize the rungs: authorize, discover, scan, fingerprint, enumerate, assess, report.',
 hx:['Anything that touches the client\'s network comes after the paper that allows it.','Enumeration needs names of services — which only version detection provides.']
},
{
 id:'m23',th:6,tp:'fib',pts:3,ti:'Complete the ROE summary for the kickoff',
 sc:'<p>Kickoff meeting, Redline Corp vs. the client\'s operations team. You project the rules-of-engagement summary on the screen and fill the blanks live so everyone signs the same understanding.</p>',
 q:'<p>Complete the three blanks in the ROE summary.</p>',
 fhtml:'<p>"Testing may only start after <b>{{b0}}</b> is signed by both sides. All activity stays inside the agreed <b>{{b1}}</b> — networks, hosts and windows listed there and nothing else. Evidence (scan exports, notes, screenshots) is stored in the <b>{{b2}}</b> until the report is delivered and archived."</p>',
 blanks:[
  {k:'s',o:['written authorization','a friendly email','a verbal agreement in the meeting'],a:0},
  {k:'s',o:['scope','timeline of the client\'s competitors','the tester\'s convenience'],a:0},
  {k:'s',o:['designated secure findings location','tester\'s personal laptop','a public file-sharing site'],a:0}
 ],
 expl:'A rules-of-engagement document stands on three legs. <b>Written authorization</b> — signed, dated, naming both sides — is what makes the testing legal; emails and verbal nods do not survive disputes. The <b>scope</b> defines exactly which networks, hosts and time windows are allowed; "nothing else" is the sentence that keeps testers out of trouble when a tempting host appears. And <b>evidence</b> belongs in a designated secure location, because scan exports contain live intelligence about the client that must not leak from a personal laptop or a public file share.',
 tip:'Say it plainly: paper first, fence second, safe storage third.',
 why:{
  w1:'Scope is not about competitors or convenience — it is the agreed fence around the test.'
 },
 hx:['Which document, when signed, turns testing from an attack into a service?','Three answers here are traps a real tester would be fired for.']
},
{
 id:'m24',th:6,tp:'multi',pts:4,ti:'What belongs in the findings report?',
 sc:'<p>The client\'s PM sends a checklist titled "What we expect from the final report". Six candidate sections are on the whiteboard. Four belong; two do not.</p>',
 q:'<p>Select every section that belongs in a professional findings report.</p>',
 o:[
  'Executive summary in business language',
  'Scope and methodology actually used',
  'Each finding with evidence, severity and reproduction steps',
  'Prioritized remediation plan for the client\'s teams',
  'A dump of every raw packet capture taken during the week',
  'The tester\'s hourly rate sheet and invoices'
 ],
 a:[0,1,2,3],
 expl:'A report serves two readers at once. Executives need the <b>executive summary</b> — risk in business terms, no jargon. Engineers need the <b>scope and methodology</b> to judge coverage, the <b>per-finding detail</b> (evidence, severity, reproduction) to verify and fix, and a <b>prioritized remediation plan</b> so effort follows risk. Raw packet dumps are working material — terabytes of noise nobody reads; the report cites the captures as evidence instead. Billing documents belong to the contract process, not the technical report.',
 tip:'If a section does not help someone understand or fix the risk, it is an appendix at best.',
 why:{
  w1:'Nobody acts on a packet dump; you attach specific captures to specific findings instead.'
 },
 hx:['Two candidates serve the business of testing, not the outcome of testing.']
}
);
/* MEDIUM exercises 25-28: scan-plan spot, Nikto branch, dual blue/red steps, fingerprint order */
EX.push(
{
 id:'m25',th:6,tp:'spot',pts:2,ti:'Spot the mistake: the scan plan',
 sc:'<p>A contractor submitted this plan for the client\'s production data hall. The client\'s security architect forwards it to you with one line: "Something feels wrong — twice." Two lines of the plan are genuinely dangerous or improper.</p>',
 q:'<p>Click the <b>two</b> lines that contain mistakes.</p>',
 lines:[
  {t:'PLAN MH-04 — production hall 10[.]20[.]80[.]0/24, Thursday 14:00-16:00',bad:false},
  {t:'1. Full aggressive scan, timing -T5, all 65,535 ports',bad:true},
  {t:'2. Targets include the OT/lamp-control segment 10[.]20[.]80[.]200-220',bad:true},
  {t:'3. Fragile devices (printers, badge readers) listed as excluded per client email',bad:false},
  {t:'4. Findings drafted into the shared report workspace the same day',bad:false},
  {t:'5. Retest planned after client confirms patches, two weeks out',bad:false}
 ],
 expl:'Line 1 is the availability killer: <code>-T5</code> on all ports against a <b>production</b> hall is how scanners crash printers, badge readers and legacy apps — speed buys nothing here but risk. Line 2 crosses a fence the client drew themselves: the OT/lamp-control segment is exactly the kind of sensitive zone that must be excluded unless explicitly re-authorized, and OT gear is notorious for crashing under probing. The rest of the plan is healthy — honoring exclusions, writing findings same-day, and planning a retest.',
 tip:'Production plus aggressive timing equals self-inflicted outage. And "the client excluded it" means excluded.',
 why:{
  w1:'Fragile devices are excluded in line 3 precisely because aggressive scans hurt them — line 1 contradicts that care.'
 },
 hx:['Read the title: which two words make line 1 dangerous?','One target range in the plan was already carved out by the client.']
},
{
 id:'m26',th:4,tp:'branch',pts:3,ti:'Branching: the old PHP banner',
 sc:'<p>Nikto flags <code>portal.corp.local</code>: "PHP/7.2.34 appears to be outdated (EOL)". Your job: turn a one-line banner into a defensible finding. Your choices decide how deep the finding goes.</p>',
 q:'<p>Decide step by step. Your choice at each step moves the work forward.</p>',
 steps:[
  {p:'The banner says PHP 7.2.34. What do you do first?',o:[
    {t:'Treat the banner as the version truth and write the Critical finding now',out:'You file a Critical based on one banner line. The client\'s pushback meeting is scheduled for Friday. This path costs credibility.'},
    {t:'Verify the runtime independently — headers and behaviour, then the inventory if agreed',out:'You confirm via phpinfo remnants and a credentialed inventory check: the runtime really is PHP 7.2.34, hand-patched. The finding now has two independent sources.'},
    {t:'Drop the finding — banners always lie about their versions',out:'You discard a real finding. Banners can lie, but they are also where truth starts — that is what verification is for.'}],a:1},
  {p:'Version confirmed. How do you rate it?',o:[
    {t:'Critical — every EOL version is automatically a 10.0',out:'End-of-life alone does not set the score. The client challenges the number, and the whole report loses weight.'},
    {t:'Rate by CVSS against the version\'s known CVEs and its exposure, and note EOL',out:'The portal exposes known CVEs with CVSS scores around 7-8 depending on component, plus an EOL note: no more security patches will come. Solid, defensible rating.'},
    {t:'Informational — it still works, so it is fine as it is',out:'An internet-facing runtime with no vendor patches is more than Informational. The risk register keeps it alive.'}],a:1},
  {p:'The finding is rated. What lands in the remediation section?',o:[
    {t:'"Patch everything" — short, safe, and suitably vague',out:'Unactionable advice. The client\'s app team cannot schedule from it.'},
    {t:'"Upgrade PHP, plan compatibility work, add interim mitigations"',out:'The client schedules the upgrade for next quarter with interim mitigations. The finding closes the loop.'},
    {t:'Nothing — the report ends at the severity number',out:'A severity with no fix is half a finding. The PM sends the report back.'}],a:1}
 ],
 expl:'A banner is a lead, not a verdict. Verification (independent sources, then credentialed confirmation when agreed) turns it into evidence. Rating uses CVSS against the version\'s known CVEs plus its exposure — end-of-life is a documented risk factor (no patches coming), not an automatic 10.0. And remediation must be actionable: target version, compatibility work, interim mitigations. That chain — verify, rate honestly, prescribe — is what makes scanner output into a professional finding.',
 tip:'Banners start findings; verification finishes them.',
 hx:['The best choice at each step adds an independent source, an honest number, or an actionable fix.','Ask at every step: does this choice make the finding more defensible?']
},
{
 id:'m27',th:3,tp:'steps',pts:4,ti:'Two hats: one SNMP walk',
 sc:'<p>During the Redline internal test you discover the core switch answers SNMP with the default "public" community. The exercise runs the same fact through both hats — the blue team\'s and the red team\'s — so you learn what each side sees.</p>',
 q:'<p>Answer from the correct perspective in each part.</p>',
 steps:[
  {p:'<b>Blue-team part.</b> You want your monitoring to catch SNMP enumeration like this one. Which telemetry is the direct tell?',o:[
    'SIEM alerts on OID query bursts from a non-monitoring source',
    'Antivirus detections on the tester\'s own laptop',
    'The switch\'s uptime counter drifting slowly',
    'A spike in the client\'s internet email traffic'],a:0},
  {p:'<b>Red-team part.</b> The "public" community works. What is the most valuable next enumeration step?',o:[
    'Walk the interface and routing OIDs to map the network',
    'Change the switch\'s community string to lock out the blue team',
    'Reboot the switch to test its resilience under load',
    'Move on — SNMP never contains any useful data'],a:0},
  {p:'<b>Blue-team part.</b> What is the correct long-term fix to recommend in the report?',o:[
    'Migrate management access to SNMPv3 and retire default communities',
    'Change the community string from "public" to "public2"',
    'Disable all network monitoring permanently instead',
    'Nothing needs doing — the switch is new hardware'],a:0}
 ],
 expl:'Two hats, one fact. The blue team detects enumeration through <b>telemetry</b>: a storm of OID queries from a host that is not the monitoring server is the signature, so SIEM rules write themselves. The red team exploits the access: interface and routing OIDs reveal the network map — subnets, neighbors, routes — which feeds the next scanning phase. And the durable fix is protocol-level: <b>SNMPv3</b> authenticates and encrypts, while default communities ("public", "private") are effectively open doors. Changing "public" to something similar is security theatre; v3 is the real answer.',
 tip:'Blue teams watch behavior, red teams follow the data, and both win when the protocol is modernized.',
 why:{
  w1:'The tester changing or rebooting the switch breaks the engagement rules — testers report, they do not modify.'
 },
 hx:['Detection = watching for query patterns that normal monitoring never makes.','v2c communities travel in plaintext; v3 adds authentication and encryption.']
},
{
 id:'m28',th:2,tp:'order',pts:5,ti:'Fingerprint a service properly',
 sc:'<p>You found 22/tcp open on a hardened host and want its identity for the report — software, version, and a sanity check — without trusting any single source. Your mentor insists there is an order to the steps.</p>',
 q:'<p>Order the fingerprinting steps from first to last.</p>',
 items:[
  'Grab the raw banner by connecting to the port (netcat)',
  'Run version detection probes (-sV) against the port',
  'Compare the fingerprint against the tool\'s signature database',
  'Cross-check the OS family with TTL analysis on replies',
  'Record the confirmed version string and cite it in the report'
 ],
 expl:'Fingerprinting is layered on purpose. The <b>banner</b> is the cheapest tell — services often announce themselves. <b>-sV</b> goes further, sending protocol-aware probes when the banner is missing or vague. The <b>signature database</b> turns raw answers into a named version. <b>TTL analysis</b> cross-checks the OS family independently — 64 for Linux-like stacks, 128 for Windows — so a spoofed banner cannot stand alone. Finally the <b>confirmed string</b> enters the report with its evidence. Each layer either confirms or questions the one before; a single source is how wrong versions end up in reports.',
 tip:'Two independent sources minimum before a version string earns a place in a finding.',
 hx:['Start with the cheapest data source, then let probes refine it.','The TTL check is your independent judge — it comes after the signatures, before the write-up.']
}
);
/* MEDIUM exercises 29-30: tools-to-purpose match, UDP scan logview */
EX.push(
{
 id:'m29',th:3,tp:'match',pts:5,ti:'The enumeration toolbox',
 sc:'<p>Friday workshop at Redline Corp. The intern asks: "How do you remember which tool goes with which protocol?" Your mentor builds this matching board on the whiteboard and asks everyone to fill it.</p>',
 q:'<p>Match each tool to the protocol it enumerates.</p>',
 pairs:[
  ['enum4linux','SMB / NetBIOS shares, users, policy'],
  ['snmpwalk','SNMP OIDs and device data'],
  ['ldapsearch','LDAP directory objects'],
  ['dig','DNS records and zone transfers'],
  ['rpcclient','RPC calls against Windows hosts']
 ],
 expl:'The toolbox maps one tool per protocol: enum4linux rides SMB/NetBIOS for shares, users and policy; snmpwalk walks SNMP OIDs for device facts; ldapsearch queries LDAP directories for objects and naming contexts; dig speaks DNS for records and zone transfers; rpcclient talks MSRPC to Windows hosts for user and group data. Tools are interchangeable within a protocol (smbclient, nbtstat, nsenumerate do similar jobs), but a tool never jumps protocols — snmpwalk cannot read LDAP, and dig cannot list shares.',
 tip:'Learn the protocol first, then its tools — the mapping becomes obvious.',
 hx:['Three of these tools query directory- or device-style data; two query Windows-native services.','dig is the only one that speaks to name servers.']
},
{
 id:'m30',th:1,tp:'logview',pts:3,ti:'The UDP scan that mostly shrugs',
 sc:'<p>You run <code>nmap -sU --top-ports 100</code> against <code>infra01.corp.local</code>. UDP scans are famously ambiguous, and this output shows why. Your notes need two conclusions before you plan follow-up probes.</p>',

<script>
/* ===== Ethical Hacker Pro 2.1 exam engine (shared) ===== */
(function(){

var META={};
try{ META=JSON.parse(document.getElementById('cm-exercise-meta').textContent||'{}'); }catch(e){ META={}; }
var MINUTES=META.estimatedMinutes||60;
var PASSM=META.passMark||70;

var TOPIC='cysa-plus';
var NCOUNT=EX.length||30;

var THEMES={
  1:'Port scanning & port states',

  3:'Enumeration protocols',
  4:'Vulnerability scanning & assessment',
  5:'Evasion, firewalls & IDS',
  6:'Methodology, scope & reporting'
};
var KEYW={
  1:['TCP SYN scan (-sS)','TCP Connect scan (-sT)','UDP scan (-sU)','FIN / NULL / Xmas scans','TCP ACK scan (-sA)','idle scan (-sI)','ping sweep (-sn)','ARP scan','port states: open, closed, filtered, unfiltered, open|filtered, closed|filtered','-Pn skip host discovery','-p / -p- / --top-ports','-T0..-T5 timing templates','nmap'],
  2:['banner grabbing','netcat (nc)','-sV version detection','--version-intensity','OS fingerprinting (-O)','TTL analysis','NSE scripts (--script)','service fingerprints','default ports'],
  3:['SMB / NetBIOS (enum4linux, smbclient, nbtstat)','null session','SNMP community strings (snmpwalk, MIB / OID)','LDAP (ldapsearch, naming contexts)','DNS zone transfer (AXFR, dig)','SMTP (VRFY / EXPN)','NTP (ntpq)','RPC (rpcclient)','share & user listing'],
  4:['Nessus','OpenVAS','Qualys','Nikto','scan policy / template','credentialed vs uncredentialed scan','false positive / false negative','CVE','CVSS score bands (AV / AC / PR / UI)','plugin & feed','remediation','prioritization','retest / validation'],
  5:['timing templates (-T0..-T5)','fragmentation (-f)','decoys (-D)','source port (-g)','--spoof-mac','stateful vs stateless filtering','IDS signature','slow scan','honeypot','rate limiting'],
  6:['authorization / ROE','scope','methodology order','documentation & evidence','findings report','severity rating','validation','production impact']
};

var S=null;
var ICON={ok:'\u2713',bad:'\u2715',miss:'\u26a0',part:'\u25d0',skip:'\u00bb'};
var WORD={ok:'correct',bad:'wrong',miss:'missed',part:'partial',skip:'skipped'};

/* ---------- utils ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtT(s){var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function el(id){return document.getElementById(id);}
function byIdEx(id){for(var i=0;i<EX.length;i++){if(EX[i].id===id)return EX[i];}return null;}
function curEx(){return EX[S.order[S.cur]];}
function mkSpan(st){return '<span class="mk mk-'+st+'">'+ICON[st]+' '+WORD[st]+'</span>';}
function r1(x){return Math.round(x*10)/10;}

/* ---------- state ---------- */
function freshState(){
  return {scr:'intro',order:[],cur:0,ans:{},res:{},checked:{},skipped:{},hinted:{},revised:{},
    touched:{},perm:{},score:0,reported:false,user:'',
    t:{left:Math.round(MINUTES*60),manual:false,check:false},bst:{},filter:{},term:{}};
}
function buildPerms(){
  for(var i=0;i<S.order.length;i++){
    var ex=EX[S.order[i]],p={};
    if(ex.tp==='qcm'||ex.tp==='multi'){p.o=shuffle(ex.o.map(function(_,k){return k;}));}
    if(ex.tp==='match'){p.chips=shuffle(ex.pairs.map(function(_,k){return k;}));}
    if(ex.tp==='cat'){p.chips=shuffle(ex.items.map(function(_,k){return k;}));}
    if(ex.tp==='order'||ex.tp==='rank'){p.items=shuffle(ex.items.map(function(_,k){return k;}));}
    if(ex.tp==='fib'){p.bl=[];for(var b=0;b<ex.blanks.length;b++){var bl=ex.blanks[b];p.bl.push(bl.k==='s'?shuffle(bl.o.map(function(_,k){return k;})):null);}}
    if(ex.tp==='steps'||ex.tp==='branch'){p.st=[];for(var s2=0;s2<ex.steps.length;s2++){p.st.push(shuffle(ex.steps[s2].o.map(function(_,k){return k;})));}}
    if(ex.tp==='logview'){p.sv=[];for(var q4=0;q4<ex.subs.length;q4++){var sb3=ex.subs[q4];p.sv.push((sb3.k==='q'||sb3.k==='m')?shuffle(sb3.o.map(function(_,k4){return k4;})):null);}}
    S.perm[ex.id]=p;
    if(ex.tp==='match'){S.ans[ex.id]={};}
    if(ex.tp==='cat'){S.ans[ex.id]={};}
    if(ex.tp==='order'||ex.tp==='rank'){S.ans[ex.id]=p.items.slice();}
    if(ex.tp==='fib'){S.ans[ex.id]=[];for(var b2=0;b2<ex.blanks.length;b2++){S.ans[ex.id].push('');}}
    if(ex.tp==='steps'){S.ans[ex.id]=[];for(var s3=0;s3<ex.steps.length;s3++){S.ans[ex.id].push(null);}}
    if(ex.tp==='multi'){S.ans[ex.id]=[];}
    if(ex.tp==='spot'){S.ans[ex.id]=[];}
    if(ex.tp==='terminal'){S.ans[ex.id]={ok:false};S.term[ex.id]=[];}
    if(ex.tp==='logview'){S.ans[ex.id]={};for(var q=0;q<ex.subs.length;q++){var sb=ex.subs[q];if(sb.k==='m'){S.ans[ex.id]['s'+q]=[];}else if(sb.k==='f1'){S.ans[ex.id]['s'+q]='';}else{S.ans[ex.id]['s'+q]=null;}}}
    if(ex.tp==='branch'){S.ans[ex.id]=[];S.bst[ex.id]=0;}
  }
}
function locked(id){return !!S.checked[id]&&!S.revised[id];}
function recomputeScore(){
  var t=0;
  for(var k in S.res){ if(S.checked[k]&&!S.revised[k]&&S.res[k]&&typeof S.res[k].earned==='number'){t+=S.res[k].earned;} }
  S.score=r1(t);
  var c=0; for(var k2 in S.checked){ if(S.checked[k2]&&!S.revised[k2]){c++;} }
  return c;
}

/* ---------- answer helpers ---------- */
function norm(v){return String(v==null?'':v).replace(/[\[\]]/g,'').replace(/\s+/g,' ').trim();}
function tokMatch(v,sets){v=norm(v);outer:for(var i=0;i<sets.length;i++){var s=sets[i];for(var j=0;j<s.length;j++){if(v.indexOf(s[j])===-1){continue outer;}}return true;}return false;}
function hasAnswer(ex){
  var a=S.ans[ex.id];
  switch(ex.tp){
    case 'qcm':return a!=null;
    case 'multi':return !!(a&&a.length);
    case 'match':for(var k in a){if(a[k]!=null)return true;}return false;
    case 'cat':for(var k2 in a){if(a[k2]!=null)return true;}return false;
    case 'order':case 'rank':return !!S.touched[ex.id];
    case 'fib':for(var i=0;i<a.length;i++){if(a[i]!=='')return true;}return false;
    case 'terminal':return !!(a&&a.ok);
    case 'logview':for(var k3 in a){var v=a[k3];if(v==null)return false;if(typeof v==='string'){if(v!=='')return true;}else if(v.length&&v.length>0)return true;}return false;
    case 'spot':return !!(a&&a.length);
    case 'steps':for(var i2=0;i2<a.length;i2++){if(a[i2]!=null)return true;}return false;
    case 'branch':return !!(a&&a.length);
  }
  return false;
}

/* ---------- grading ---------- */
function grade(ex){
  var a=S.ans[ex.id],marks={},n=0,hits=0,g={};
  function bump(key,st){marks[key]=st;}
  switch(ex.tp){
    case 'qcm':n=1;if(a===ex.a){hits=1;bump('o'+a,'ok');}else if(a!=null){bump('o'+a,'bad');var ci=[];for(var qc=0;qc<ex.o.length;qc++){if(qc===ex.a)bump('o'+qc,'ok');}}else{var ci2=[];for(var qc2=0;qc2<ex.o.length;qc2++){if(qc2===ex.a)bump('o'+qc2,'ok');}}break;
    case 'multi':n=ex.a.length;
      for(var i=0;i<ex.o.length;i++){
        var sel=a.indexOf(i)>-1,cor=ex.a.indexOf(i)>-1;
        if(cor&&sel){hits++;bump('o'+i,'ok');}else if(cor&&!sel){bump('o'+i,'miss');}else if(!cor&&sel){bump('o'+i,'bad');}
      }break;
    case 'match':n=ex.pairs.length;
      for(var s=0;s<ex.pairs.length;s++){
        if(a[s]!=null&&a[s]===s){hits++;bump('s'+s,'ok');}else{bump('s'+s,a[s]==null?'miss':'bad');}
      }break;
    case 'cat':n=ex.items.length;
      for(var c=0;c<ex.items.length;c++){
        if(a[c]!=null&&a[c]===ex.items[c].c){hits++;bump('c'+c,'ok');}else{bump('c'+c,a[c]==null?'miss':'bad');}
      }break;
    case 'order':case 'rank':n=ex.items.length;
      for(var p=0;p<a.length;p++){ if(a[p]===p){hits++;bump('p'+p,'ok');}else{bump('p'+p,'bad');} }break;
    case 'fib':n=ex.blanks.length;
      for(var b=0;b<ex.blanks.length;b++){
        var bl=ex.blanks[b],v=a[b],ok=false;
        if(bl.k==='s'){ok=(v===String(bl.o[bl.a]));}
        else if(bl.re){ok=new RegExp(bl.re).test(norm(v));}
        else if(bl.ac){ok=tokMatch(v,bl.ac);}
        if(ok){hits++;bump('b'+b,'ok');}else{bump('b'+b,norm(v)===''?'miss':'bad');}
      }break;
    case 'terminal':n=1;if(a&&a.ok){hits=1;bump('0','ok');}else{bump('0','bad');}break;
    case 'logview':n=ex.subs.length;
      for(var q=0;q<ex.subs.length;q++){
        var sb=ex.subs[q],v2=a['s'+q],ok2=false;
        if(sb.k==='q'){ok2=(v2===sb.a);}
        else if(sb.k==='m'){var hits2=0;for(var i3=0;i3<sb.o.length;i3++){var sel2=v2.indexOf(i3)>-1,cor2=sb.a.indexOf(i3)>-1;if(cor2&&sel2)hits2++;}ok2=(hits2===sb.a.length);}
        else{ok2=tokMatch(v2,sb.ac);}
        if(ok2){hits++;bump('s'+q,'ok');}else{bump('s'+q,'bad');}
      }break;
    case 'spot':n=0;for(var l=0;l<ex.lines.length;l++){if(ex.lines[l].bad)n++;}
      for(var l2=0;l2<ex.lines.length;l2++){
        var sel3=a.indexOf(l2)>-1,bad=!!ex.lines[l2].bad;
        if(bad&&sel3){hits++;bump('l'+l2,'ok');}else if(bad&&!sel3){bump('l'+l2,'miss');}else if(!bad&&sel3){bump('l'+l2,'bad');}
      }break;
    case 'steps':n=ex.steps.length;
      for(var st=0;st<ex.steps.length;st++){
        if(a[st]===ex.steps[st].a){hits++;bump('t'+st,'ok');}else{bump('t'+st,a[st]==null?'miss':'bad');}
      }break;
    case 'branch':n=ex.steps.length;
      for(var b3=0;b3<ex.steps.length;b3++){
        if(a[b3]===ex.steps[b3].a){hits++;bump('t'+b3,'ok');}else{bump('t'+b3,a[b3]==null?'miss':'bad');}
      }break;
  }
  return {n:n,hits:hits,marks:marks};
}
function doGrade(ex){
  var g=grade(ex);
  var pen=0.1*ex.pts*(S.hinted[ex.id]||0);
  var earned=r1(Math.max(0,ex.pts*g.hits/Math.max(1,g.n)-pen));
  S.res[ex.id]={earned:earned,max:ex.pts,hits:g.hits,n:g.n,marks:g.marks,pen:r1(pen)};
  S.checked[ex.id]=true;S.revised[ex.id]=false;delete S.skipped[ex.id];
  recomputeScore();
  return g;
}
