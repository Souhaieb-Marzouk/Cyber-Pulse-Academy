{"themes":{"t1":"Nmap host discovery & port scanning","t2":"Nmap fingerprinting & features","t3":"Wireshark & packet analysis","t4":"Protocol traffic indicators","t5":"Recon methodology, OSINT & evasion"},"kws":{"kw-sn":{"th":"t1","label":"Host discovery / ping sweep (-sn)"},"kw-sS":{"th":"t1","label":"SYN scan (-sS, half-open)"},"kw-sT":{"th":"t1","label":"Connect scan (-sT)"},"kw-sU":{"th":"t1","label":"UDP scan (-sU)"},"kw-sA":{"th":"t1","label":"ACK scan (-sA) & firewall rule mapping"},"kw-xmas":{"th":"t1","label":"FIN / Null / Xmas scans (-sF -sN -sX)"},"kw-portstate":{"th":"t1","label":"Port states: open, closed, filtered, unfiltered"},"kw-portrange":{"th":"t1","label":"Port specification (-p, lists, ranges, -p-)"},"kw-sV":{"th":"t2","label":"Service & version detection (-sV)"},"kw-O":{"th":"t2","label":"OS detection & TCP/IP fingerprinting (-O)"},"kw-T":{"th":"t2","label":"Timing templates (-T0 to -T5)"},"kw-nse":{"th":"t2","label":"NSE scripting engine (--script, categories)"},"kw-output":{"th":"t2","label":"Output formats (-oN, -oX, -oG, -oA)"},"kw-idle":{"th":"t2","label":"Idle / zombie scan (-sI)"},"kw-decoy":{"th":"t2","label":"Decoys & source spoofing (-D, -S, -g)"},"kw-bpf":{"th":"t3","label":"Capture filters (BPF syntax)"},"kw-dfilter":{"th":"t3","label":"Display filters (Wireshark syntax)"},"kw-handshake":{"th":"t3","label":"TCP three-way handshake"},"kw-flags":{"th":"t3","label":"TCP flags (SYN, ACK, RST, FIN, PSH)"},"kw-stream":{"th":"t3","label":"Follow TCP stream & reassembly"},"kw-protohier":{"th":"t3","label":"Protocol hierarchy & statistics"},"kw-promisc":{"th":"t3","label":"Promiscuous mode & SPAN / mirror ports"},"kw-dns":{"th":"t4","label":"DNS traffic analysis"},"kw-http":{"th":"t4","label":"HTTP analysis (methods, User-Agent)"},"kw-arp":{"th":"t4","label":"ARP traffic & ARP spoofing"},"kw-icmp":{"th":"t4","label":"ICMP types & codes (echo, unreachable)"},"kw-retrans":{"th":"t4","label":"Retransmissions & connection anomalies"},"kw-ttl":{"th":"t4","label":"TTL analysis & path hints"},"kw-passive":{"th":"t5","label":"Passive vs active reconnaissance"},"kw-osint":{"th":"t5","label":"OSINT: WHOIS, DNS records, public sources"},"kw-footprint":{"th":"t5","label":"Footprinting process"},"kw-banner":{"th":"t5","label":"Banner grabbing"},"kw-enum":{"th":"t5","label":"Service & share enumeration"},"kw-evasion":{"th":"t5","label":"Scan evasion (fragmentation, throttling, decoys)"},"kw-scope":{"th":"t5","label":"Scope, authorization & legal limits"}},"ex":[{"id":"H01","t":"log","th":"t2","pts":7,"title":"Five scanners or one?","sc":"<p>03:12. The DMZ firewall logged a burst of SYN-only probes against 10[.]20[.]8[.]31. Five source IPs appear. Look closely before you attribute anything.</p>","q":"<p>Select <b>every conclusion the artefacts actually support</b>.</p>","rows":[{"t":"03:12:01  SRC 198[.]51[.]100[.]23:44112 -> 10[.]20[.]8[.]31:22   SYN  ttl=118 win=1024","l":"i"},{"t":"03:12:01  SRC 198[.]51[.]100[.]24:44112 -> 10[.]20[.]8[.]31:23   SYN  ttl=118 win=1024","l":"i"},{"t":"03:12:02  SRC 198[.]51[.]100[.]25:44112 -> 10[.]20[.]8[.]31:80   SYN  ttl=118 win=1024","l":"i"},{"t":"03:12:02  SRC 198[.]51[.]100[.]26:44113 -> 10[.]20[.]8[.]31:445 SYN  ttl=118 win=1024","l":"i"},{"t":"03:12:03  SRC 198[.]51[.]100[.]27:44113 -> 10[.]20[.]8[.]31:3389 SYN  ttl=118 win=1024","l":"i"},{"t":"03:12:03  (no replies logged - all probes dropped)","l":"w"},{"t":"03:12:04  no other external hosts touched the DMZ in this window","l":"i"}],"sub":{"t":"multi","ch":[{"x":"The five sources are almost certainly decoys from one scanner - identical TTL and TCP window on every packet","ok":true},{"x":"The real scanner is one machine, not five coordinated bots","ok":true},{"x":"The sweep looks designed to defeat simple source-based blocking","ok":true},{"x":"Five different machines on one ISP scanned in perfect sync","ok":false},{"x":"The probes were UDP","ok":false}]},"hint":"Compare ttl and win across all five rows. Real machines rarely agree that perfectly.","ex":"<p>Every packet shows ttl=118 and win=1024, and source ports repeat in pairs - independent hosts would differ. That fingerprint matches one scanner behind -D style decoys. Five simultaneous bots with byte-identical stacks are far less likely, and the protocol is TCP (SYN flags). Decoys exist exactly to make source-blocking guesswork.</p>","kw":["kw-decoy","kw-ttl","kw-evasion","kw-sS"]},{"id":"H02","t":"term","th":"t2","pts":6,"title":"Version truth, saved for the toolchain","sc":"<p>Before the report goes out, every service version on <code>db-edg-07</code> ports 22, 80 and 443 must be confirmed - and stored so the reporting pipeline and any other tool can read them.</p>","q":"<p>Type a single command that finds exact service versions on those three ports and saves results in every reusable format at once. No tool is named - choose your own and justify the flags to yourself as you type.</p>","help":"Goal in operational terms: exact software + version per port, limited to 22,80,443, saved for any later tool. Expected result shape: <code>22/tcp open ssh OpenSSH 8.2p1</code>.","req":["nmap","-sv","-oa","(22,80,443|443,80,22)","db-edg-07"],"demo":"nmap -sV -oA db7-scan -p 22,80,443 db-edg-07","hint":"One switch writes all output formats from a single run. One switch asks services to reveal versions. A leading sudo is accepted.","ex":"<p>The expert answer is <code>nmap -sV -oA db7-scan -p 22,80,443 db-edg-07</code>: -sV interrogates each open service for its exact product and version, -p narrows the probe set to the three ports, and -oA writes normal, XML and grepable output in one run (any basename works) so any downstream tool can parse the result.</p>","kw":["kw-sV","kw-output","kw-portrange"]},{"id":"H03","t":"branch","th":"t5","pts":8,"title":"The patient scanner","sc":"<p>Four nights in a row, the IDS logs a slow SYN sweep from the partner VPN range: about 8 ports per minute, fragmented probes, never finishing handshakes. Alerts auto-close as \"low\". Nothing else is known.</p>","q":"<p>Lead the investigation. One decision per step.</p>","steps":[{"q":"The alerts keep auto-closing. Your first move?","ch":[{"x":"Pull the raw sessions and compare the pattern against scanner fingerprints and IP ID behaviour","ok":true,"fb":"Right - verify with raw data before any conclusion."},{"x":"Firewall-block the whole partner range at once","ok":false,"fb":"Blocking a business partner on day one can breach a contract."},{"x":"Unplug the DMZ switch","ok":false,"fb":"Business damage with zero evidence so far."}]},{"q":"A full capture on the SPAN port shows reassembled probes with FIN, PSH and URG all set. What now?","ch":[{"x":"Confirm the Xmas-style evasion in the capture and document the flags as evidence","ok":true,"fb":"Correct - FIN+PSH+URG is the Xmas signature; document it."},{"x":"Assume the IDS already caught everything worth catching","ok":false,"fb":"The IDS auto-closed everything - you have to look yourself."},{"x":"Reply with RST floods to scare off the scanner","ok":false,"fb":"Counter-attacking is never an approved response."}]},{"q":"The source maps to NordGate - a partner whose contract allows VPN access but says NOTHING about scanning. Next?","ch":[{"x":"Check the contract text and the approved-use clause before any other step","ok":true,"fb":"Exactly - the paperwork decides if this is authorised work."},{"x":"Scan them back immediately to gather leverage","ok":false,"fb":"Unauthorised scanning is illegal, even against an attacker."},{"x":"Open a firewall ticket to allow their scanner, maybe it is scheduled","ok":false,"fb":"Nothing says it is scheduled - that would help the intrusion."}]},{"q":"Contract confirmed: no scanning rights. Final call?","ch":[{"x":"Preserve evidence, notify the partner POC and management, and write the incident report","ok":true,"fb":"Correct - evidence, notification, report."},{"x":"Delete the captures - it was only recon","ok":false,"fb":"Destroying evidence hides a policy breach by a third party."},{"x":"Scan them back now that you know who it is","ok":false,"fb":"Revenge scanning is still unauthorised scanning."}]}],"hint":"Raw data first, contract second, paperwork everywhere.","ex":"<p>Hard cases turn on discipline: verify in raw packets (fragmented, handshakes never finished, FIN/PSH/URG = Xmas trick), then let the contract decide whether a partner may scan at all, then preserve evidence and escalate through people, never through counter-attacks.</p>","kw":["kw-xmas","kw-evasion","kw-scope","kw-promisc"]},{"id":"H04","t":"spot","th":"t1","pts":6,"title":"The firewall assessment note","sc":"<p>A consultant delivered this note about host 10[.]20[.]8[.]31. Two lines contain real errors. The rest is accurate.</p>","q":"<p>Click both <b>wrong</b> lines.</p>","lines":[{"x":"Command used: nmap -sA 10[.]20[.]8[.]31","bad":false},{"x":"Result: 22/tcp unfiltered, 80/tcp unfiltered, 445/tcp filtered, 3389/tcp filtered","bad":false},{"x":"Conclusion 1: ports 22 and 80 are open.","bad":true},{"x":"Conclusion 2: the firewall silently drops traffic to 445 and 3389.","bad":false},{"x":"Conclusion 3: an ACK scan cannot tell open from closed on unfiltered ports.","bad":false},{"x":"Conclusion 4: the host answered our ACK packets with RST, which proves the services on 22 and 80 are running.","bad":true}],"hint":"One conclusion reads \"unfiltered\" as \"open\". The other over-reads what an RST-to-ACK proves.","ex":"<p>\"Unfiltered\" means an ACK probe got <i>some</i> reply - it says nothing about a service. The RST that comes back for an ACK is generated by the host TCP stack or the firewall itself, whether or not anything listens. Conclusion 2 and 3 are exactly right: silence means dropped, and ACK scans cannot decide open vs closed.</p>","kw":["kw-sA","kw-portstate","kw-flags"]},{"id":"H05","t":"match","th":"t1","pts":5,"title":"Scan types and their intents","sc":"<p>Incident review: you must explain to management why the attacker used five different scan types across five days.</p>","q":"<p>Match each scan type to the intent behind it.</p>","pairs":[{"l":"SYN scan (-sS)","r":"Fast default probe that never completes a handshake"},{"l":"Connect scan (-sT)","r":"Chosen when raw sockets are unavailable (no admin rights)"},{"l":"FIN / Null / Xmas scans","r":"Attempt to slip past simple stateless firewalls and log rules"},{"l":"ACK scan (-sA)","r":"Maps which ports the firewall lets through"},{"l":"Idle scan (-sI)","r":"Makes an unrelated host look like the scanner"}],"hint":"Three of these care about logs and rules; two care about who gets blamed.","ex":"<p>-sS is the fast, reasonably quiet default. -sT works from unprivileged accounts because the OS builds real connections. Flagless or weird-flag scans (FIN/Null/Xmas) exploit lenient stacks and stateless devices. ACK scans read firewall rule sets, not services. Idle scans shift blame to a zombie host entirely.</p>","kw":["kw-sS","kw-sT","kw-xmas","kw-sA","kw-idle"]},{"id":"H06","t":"multi","th":"t2","pts":7,"title":"Preconditions of the idle scan","sc":"<p>A red-team lead reviews the plan for an attribution-hidden scan against the legacy VLAN and asks you to validate the idle-scan preconditions.</p>","q":"<p>Select <b>every condition that must hold</b> for an idle (-sI) scan to work.</p>","ch":[{"x":"The zombie host must send little or no traffic during the scan","ok":true},{"x":"The zombie IP ID counter must increase in a predictable way, usually by 1 per packet","ok":true},{"x":"The attacker sends probes that appear to come from the zombie address","ok":true},{"x":"The attacker needs a shell account on the zombie","ok":false},{"x":"The zombie must run a vulnerable service for the trick to work","ok":false},{"x":"Idle scans only work against UDP services","ok":false},{"x":"The zombie must have SYN cookies enabled","ok":false}],"hint":"The whole trick reads a counter. Busy hosts and SYN cookies spoil the reading.","ex":"<p>An idle scan watches the zombie IP ID counter: attacker probes spoofed as the zombie make the target reply to the zombie, and the attacker polls the zombie to see if its counter jumped (port open) or not. So the zombie must be quiet, predictable (no SYN cookies, no OS randomisation) and never need credentials. It is a TCP trick - UDP plays no role.</p>","kw":["kw-idle"]},{"id":"H07","t":"qcm","th":"t4","pts":4,"title":"The 03:00 retransmissions","sc":"<p>Expert Information for file server 10[.]9[.]31[.]77: every night from 00:00 to 05:00, bursts of TCP retransmissions to 192[.]0[.]2[.]50:445, spaced exactly 15 minutes apart, byte-identical payloads, constant TTL 63. A change ticket (CHG-1104) documents a legacy replication agent on that host; nothing else on the host is unusual.</p>","q":"<p>Which reading fits the artefacts best?</p>","ch":["The documented replication agent keeps hitting a device that drops its sessions","A malware beacon disguises itself as SMB traffic to a command server","An attacker brute-forces SMB logins every fifteen minutes","A NIC driver bug duplicates every outbound frame on that host"],"a":0,"hint":"Match the artefacts against the paperwork before you chase attackers: fixed port, identical payloads, a documented agent, a maintenance window.","ex":"<p>Every clue points at the boring answer: the port is SMB, the payloads never change, the rhythm matches a scheduled job, and a ticket documents exactly such an agent on that host. Malware can mimic this shape, but nothing here supports it - same-port, same-payload repetition plus paperwork is a misbehaving scheduled job, not a beacon. Brute force would vary payloads and credentials, and a NIC bug would not respect a five-hour window.</p>","kw":["kw-retrans","kw-ttl"]},{"id":"H08","t":"order","th":"t4","pts":5,"title":"Rebuild the exfil timeline","sc":"<p>The forensic capture covers five events on a compromised file server. Reconstruct the attack chain in the order it happened.</p>","q":"<p>Order the five events from first to last.</p>","items":["Baseline: normal DNS lookups and HTTPS to business apps only","New pattern: hourly TXT queries with long random labels to one domain","A 400 MB POST upload leaves the network at 02:00","Follow TCP Stream on the POST body reveals an archived file of documents","Beacons continue from a second host after the first is quarantined"],"hint":"Start from the clean state, end with what happened after containment.","ex":"<p>Chains read: normal state, first anomaly (DNS beaconing recon/check-in), the big data movement (POST upload), confirmation of content (stream reassembly proves exfiltration), and finally the failover behaviour that shows the operation was resilient. Ordering evidence correctly is what makes an incident report credible.</p>","kw":["kw-dns","kw-stream","kw-http"]},{"id":"H09","t":"dd","th":"t2","pts":5,"title":"File the NSE scripts","sc":"<p>Your runbook lists five NSE scripts; each must land in its primary category so the team knows how dangerous each one is.</p>","q":"<p>Drag each script onto its primary NSE category.</p>","zones":[{"id":"z1","label":"vuln"},{"id":"z2","label":"safe"},{"id":"z3","label":"discovery"},{"id":"z4","label":"intrusive"},{"id":"z5","label":"auth"}],"items":[{"x":"smb-vuln-ms17-010","c":"z1"},{"x":"http-title","c":"z2"},{"x":"nbstat","c":"z3"},{"x":"http-sql-injection","c":"z4"},{"x":"ftp-anon","c":"z5"}],"hint":"One reads a page title (harmless), one fires real payloads (dangerous), one checks a login mode.","ex":"<p>smb-vuln-ms17-010 checks a known vulnerability (vuln). http-title just fetches page titles (safe). nbstat pulls NetBIOS names (discovery). http-sql-injection actually sends attack strings (intrusive - can break things). ftp-anon tests anonymous login (auth). Categories set expectations about risk before anyone runs them.</p>","kw":["kw-nse","kw-enum"]},{"id":"H10","t":"fib","th":"t3","pts":8,"title":"The scanner-hunting filter","sc":"<p>You hunt for half-open scans inside a big capture. The hunt filter must show packets that start a handshake but carry no ACK and no FIN.</p>","q":"<p>Fill all four gaps. Click a word, then a gap.</p>","text":"tcp.flags.syn <b>[]</b> 1 <b>[]</b> tcp.flags.ack <b>[]</b> 0 <b>[]</b> tcp.flags.fin == 0","slots":["==","and","==","and"],"bank":["==","==","and","and","or","not","!=","contains"],"hint":"Each condition compares with ==; the conditions join with the same word every time.","ex":"<p>The completed filter is tcp.flags.syn == 1 and tcp.flags.ack == 0 and tcp.flags.fin == 0. Using \"or\" would flood you with noise: a SYN/ACK has syn==1, an ACK-only packet has ack==1, and neither is a scan attempt. Tight conjunctions isolate exactly the probes you hunt.</p>","kw":["kw-dfilter","kw-flags","kw-handshake","kw-sS"]},{"id":"H11","t":"log","th":"t4","pts":6,"title":"The polite flood at 03:00","sc":"<p>Web access log, one night. Three normal-looking user agents and one stranger. Filter and read carefully.</p>","q":"<p>Select <b>every statement the log supports</b>.</p>","rows":[{"t":"03:00:11  GET  /products?id=41          200  UA \"Mozilla/5.0 (Windows NT 10.0)\"  10[.]9[.]2[.]14","l":"g"},{"t":"03:00:40  GET  /products?id=42          200  UA \"Mozilla/5.0 (Windows NT 10.0)\"  10[.]9[.]2[.]14","l":"g"},{"t":"03:01:02  POST /search?q=1%27%20OR%20%271%27%3D%271   200  UA \"sqlmap/1.7\"  203[.]0[.]113[.]88","l":"e"},{"t":"03:01:05  POST /search?q=UNION%20SELECT%20...       200  UA \"sqlmap/1.7\"  203[.]0[.]113[.]88","l":"e"},{"t":"03:01:30  POST /search?q=SLEEP(5)--                 200  UA \"python-requests/2.31\"  203[.]0[.]113[.]88","l":"e"},{"t":"03:02:10  GET  /login                     200  UA \"Mozilla/5.0 (X11; Linux)\"  10[.]9[.]2[.]31","l":"g"},{"t":"03:02:44  POST /search?q=1%27--                     200  UA \"python-requests/2.31\"  203[.]0[.]113[.]88","l":"e"},{"t":"03:03:19  GET  /products?id=43          200  UA \"Mozilla/5.0 (Windows NT 10.0)\"  10[.]9[.]2[.]14","l":"g"}],"sub":{"t":"multi","ch":[{"x":"Automated SQL-injection probing with the sqlmap tool is under way","ok":true},{"x":"One external source sent many malformed requests in a short window","ok":true},{"x":"The 200 answers show server-side filtering did not block the probes","ok":true},{"x":"A normal user was browsing products","ok":true},{"x":"The web server failed its TLS handshake","ok":false},{"x":"An NTP sync problem caused the 03:00 burst","ok":false}]},"hint":"Filter on \"search\" and on the strange user agent. Then decide what the well-formed rows really tell you.","ex":"<p>The URL-decoded payloads (1' OR '1'='1, UNION SELECT, SLEEP(5)) plus the sqlmap and python-requests agents mark automated injection probing from one external IP, and every probe earned HTTP 200, so nothing server-side stopped it. The internal /products rows are a genuine, well-formed browsing session from a browser user agent - normal traffic that merely shares the log with the attack. No TLS event and no NTP entry can appear in a plain web access log.</p>","kw":["kw-http","kw-enum"]},{"id":"H12","t":"dual","th":"t4","pts":6,"title":"Man in the middle, both chairs","sc":"<p>A user reports a slow intranet. Your capture from the access SPAN shows: <code>ARP reply 10[.]1[.]1[.]1 is-at 0c:11:aa:01:9f:2b</code> followed 90 seconds later by <code>ARP reply 10[.]1[.]1[.]1 is-at 0c:11:aa:77:31:04</code>, repeating. The gateway MAC should be 0c:11:aa:01:9f:2b.</p>","q":"<p>Answer as the detector, then as the attacker.</p>","subs":[{"t":"multi","label":"BLUE TEAM VIEW","q":"Which findings support an ARP man-in-the-middle?","ch":[{"x":"Two different MACs answer for the gateway IP, over and over","ok":true},{"x":"The gateway MAC in client caches flips back and forth","ok":true},{"x":"Every ARP reply uses the broadcast MAC as sender","ok":false},{"x":"DHCP offers arrive from two different servers","ok":false}]},{"t":"qcm","label":"RED TEAM VIEW","q":"What must the attacker keep doing to stay in the middle?","ch":["Keep sending ARP replies and forward the victim traffic to the real gateway","Nothing more - one poisoned reply lasts for days on modern stacks","Send one ICMP redirect packet and leave the network alone","Flood the switch CAM table once, then disconnect quietly"],"a":0}],"hint":"Blue: count who claims the gateway. Red: caches age out, and the attacker must relay traffic or the victim notices.","ex":"<p>Blue: two MACs fighting over the gateway IP, with client caches flipping, is the MITM signature - broadcast senders and DHCP offers are different problems. Red: ARP entries expire, so the attacker must re-send replies continuously and actually route the traffic to the real gateway, or the victim loses connectivity and the trick unravels.</p>","kw":["kw-arp"]},{"id":"H13","t":"rank","th":"t5","pts":4,"title":"Rank the recon findings","sc":"<p>Engagement wrap-up. Four findings sit in the queue and the client fixes them in one order. Rank by <b>remediation urgency</b> (fix first first).</p>","q":"<p>Rank the four findings from most to least urgent.</p>","items":["Unpatched file-transfer service with a public RCE advisory, internet-facing","Admin portal banner reveals exact old version and build number","SMB enumeration listed 40 readable shares to ordinary domain users","Management port filtered at the firewall, no banner, no exposure"],"hint":"Exploitable and exposed beats informative. A filtered port with no data is the least of the four.","ex":"<p>A public RCE on an internet-facing service is a compromise waiting to happen. Verbose banners hand attackers free fingerprinting. Broad share readability enables lateral movement once any account is taken. A filtered management port with no banner leaks nothing actionable today - monitor it and move on.</p>","kw":["kw-banner","kw-enum","kw-scope"]},{"id":"H14","t":"qcm","th":"t3","pts":4,"title":"Why the sensor stayed silent","sc":"<p>tcpdump on the SPAN port shows the probe arriving as 40-byte IP fragments with offsets 0/8/16, payload only visible after reassembly. The signature-based IDS in the same path raised nothing. Capture proves the probes reached the target.</p>","q":"<p>Why did the IDS miss it?</p>","ch":["Signatures match whole packets, and these probes only take shape after reassembly","The probes were encrypted end to end, so no signature could read them","The SPAN port duplicated every frame, so the IDS dropped both copies","The IDS licence had expired, so the engine quietly stopped matching"],"a":0,"hint":"Pattern-matching needs a pattern. What do you get before reassembly?","ex":"<p>Fragmentation splits one probe across several small packets. A signature engine that matches each packet in isolation sees meaningless byte slivers; only a reassembly-aware engine recognises the probe. Encryption would hide content from everyone including tcpdump, and a doubled mirror would cause extra alerts, not fewer.</p>","kw":["kw-evasion","kw-promisc"]},{"id":"H15","t":"term","th":"t3","pts":6,"title":"Aim the capture lens","sc":"<p>You need a focused pcap for the case file: only packets to or from <code>web-edg-02</code> on port 443, saved as <code>caps/web.pcap</code>, captured from the command line.</p>","q":"<p>Type the command that does all of this. No tool is named - pick your own and own every flag.</p>","help":"Goal in operational terms: one host, one port, file output (the folder <code>caps/</code> already exists). Expected file content shape: <code>14:22:01 IP 10[.]8[.]0[.]5.52114 > web-edg-02.443: Flags [S]</code>. A leading <code>sudo</code> is accepted.","req":["tcpdump|tshark|dumpcap","web-edg-02","\\b443\\b","-w\\s*\"?(\\./)?caps/web\\.pcap\"?"],"demo":"tcpdump -i eth0 host web-edg-02 port 443 -w caps/web.pcap","hint":"Every capture tool has: an interface or input, a BPF expression (host, port), and a write-file flag.","ex":"<p>One solid answer: <code>tcpdump -i eth0 host web-edg-02 port 443 -w caps/web.pcap</code>. The BPF part (host ... port 443) keeps the file small and focused; -w writes raw packets. tshark -i eth0 -f \"host web-edg-02 and port 443\" -w caps/web.pcap works too - same concepts, different tool.</p>","kw":["kw-bpf"]},{"id":"H16","t":"multi","th":"t2","pts":8,"title":"Evasion toolbox","sc":"<p>The approved red-team plan calls for a low-and-slow, attribution-blurred scan of the legacy VLAN. The lead asks you to pick the options that actually change how the scan <i>looks</i> on the wire.</p>","q":"<p>Select <b>every option that is a genuine evasion or blending technique</b>.</p>","ch":[{"x":"-f or --mtu to fragment the probes","ok":true},{"x":"-D to mix decoy sources into the sweep","ok":true},{"x":"-T1 with --max-rate to throttle the scan","ok":true},{"x":"--data-length to change probe payload size","ok":true},{"x":"-g 53 to send probes from source port 53","ok":true},{"x":"-sV to detect service versions","ok":false},{"x":"-iL to read the target list","ok":false},{"x":"-v and -vv for verbosity","ok":false}],"hint":"Five options change packet shape, pace or identity. Three only change what YOU see.","ex":"<p>Evasion = change shape (-f/--mtu, --data-length), pace (-T1, --max-rate) or identity (-D decoys, -g source port). -sV asks services questions loudly on every open port, -iL merely lists targets, and -v/-vv only prints more to your screen. Nothing in the \"no\" group alters how a sensor perceives the scan.</p>","kw":["kw-evasion","kw-decoy","kw-T"]},{"id":"H17","t":"match","th":"t3","pts":6,"title":"Statistics tools in the hot seat","sc":"<p>During the incident you get five Wireshark/statistics questions from the team. Match each tool to the question it answers.</p>","q":"<p>Match each tool or feature to its investigative use.</p>","pairs":[{"l":"Protocol Hierarchy","r":"Shows which protocols share the traffic - spot the odd one"},{"l":"Conversations","r":"Ranks who talks to whom and how much"},{"l":"Endpoints","r":"Lists every MAC and IP seen on the wire"},{"l":"I/O Graph","r":"Reveals periodic beacon patterns over time"},{"l":"Expert Information","r":"Collects retransmissions, resets and checksum errors"},{"l":"SPAN / mirror port","r":"Feeds switch traffic to your sensor without inline access"}],"hint":"One tool answers \"when\", one answers \"how much\", one answers \"what is broken\".","ex":"<p>Protocol Hierarchy exposes unusual protocol shares; Conversations ranks pairs of hosts; Endpoints lists identities; the I/O Graph plots volume over time so beacons appear as teeth; Expert Information aggregates anomalies like retransmissions. The SPAN port is not a statistic at all - it is how the sensor gets frames to analyse.</p>","kw":["kw-protohier","kw-retrans","kw-promisc"]},{"id":"H18","t":"branch","th":"t5","pts":6,"title":"Scope creep, phone call edition","sc":"<p>Mid-engagement, the client CTO calls: \"While you are here, also test the subsidiary web app - same network, no big deal.\" Your contract covers ONE app on ONE domain. The subsidiary app is on a different domain the client does not own.</p>","q":"<p>Handle it step by step.</p>","steps":[{"q":"First reaction on the call?","ch":[{"x":"Say you will check the signed contract and statement of work first","ok":true,"fb":"Right - the paperwork decides, not the enthusiasm of the moment."},{"x":"Start scanning the subsidiary app while you talk","ok":false,"fb":"Packets against an unauthorised domain are illegal from byte one."},{"x":"Refuse and hang up - no exceptions ever","ok":false,"fb":"Professional, but wrong: scope CAN change - in writing."}]},{"q":"The contract lists only the primary app. The CTO insists \"an email from me is enough\". Now?","ch":[{"x":"Ask for written change approval signed by an authorised signatory before any packet","ok":true,"fb":"Correct - only signatories can extend scope, and only in writing."},{"x":"Treat the CTO email as authorisation and scan","ok":false,"fb":"A single email is not a signed change order."},{"x":"Scan from your home connection so it stays quiet","ok":false,"fb":"Concealing activity is worse than the missing paperwork."}]},{"q":"A signed change order arrives next Monday, covering the subsidiary app for three days. Then?","ch":[{"x":"Update the plan and report structure, archive the change order, then test","ok":true,"fb":"Exactly - new scope flows into plan, evidence and report."},{"x":"Scan straight away from the old plan with no changes","ok":false,"fb":"New targets need updated methodology and reporting lines."},{"x":"Bill the hours but skip updating any document","ok":false,"fb":"Undocumented scope is invisible to auditors and insurers."}]}],"hint":"Contract, signature, archive. In that order, every time.","ex":"<p>Scope is a legal object, not a mood. Only the contract (or a signed change order from a signatory) defines targets; verbal enthusiasm is free but worthless. After signing, the plan, evidence folders and report must reflect the new scope so every packet remains accountable.</p>","kw":["kw-scope"]},{"id":"H19","t":"spot","th":"t1","pts":5,"title":"UDP scan note review","sc":"<p>A teammate’s UDP scan note goes into the report. Two lines are technically wrong. The rest is fine.</p>","q":"<p>Click both <b>wrong</b> lines.</p>","lines":[{"x":"Command: nmap -sU -T5 --top-ports 200 10[.]20[.]30[.]5","bad":false},{"x":"We picked -T5 to keep UDP results accurate and complete.","bad":true},{"x":"Result: 53/udp open|filtered, 123/udp open|filtered, 161/udp closed","bad":false},{"x":"\"open|filtered\" means the service answered our probe.","bad":true},{"x":"UDP scans are slow because open ports usually stay silent and Nmap must wait and retransmit.","bad":false}],"hint":"Fast timing loses slow replies. And think again about what silence from a UDP port means.","ex":"<p>-T5 retransmits aggressively and gives up early, so slow UDP services get missed - that is less accuracy, not more. \"open|filtered\" means Nmap got <i>no</i> answer: an open UDP port stays silent by design, and a filtering firewall is equally silent - hence the two-word state. The closed verdict (ICMP port unreachable) and the slowness explanation are correct.</p>","kw":["kw-sU","kw-T","kw-portstate"]},{"id":"H20","t":"fib","th":"t5","pts":8,"title":"Write the attribution paragraph","sc":"<p>The incident report describes how the actor worked. Fill the four gaps with the exact terms. Click a word, then a gap.</p>","q":"<p>Write the attribution paragraph: fill the four gaps with the exact terms. Click a word, then a gap.</p>","text":"The actor began with <b>[]</b> reconnaissance from public sources - a classic footprinting pass - then moved to <b>[]</b> scanning against live hosts. To blur the source, the sweep mixed in <b>[]</b> packets from fake addresses, and fragmented every probe so only <b>[]</b> on the sensor could rebuild the original pattern.","slots":["passive","active","decoy","reassembly"],"bank":["passive","active","decoy","reassembly","banners","promiscuous","enumeration","handshake"],"hint":"Two words describe the two phases; one names the fake sources; one names what a sensor must do with fragments.","ex":"<p>Phase one (public data, no packets) is passive recon / footprinting; phase two touches hosts, so it is active scanning. Fake source packets are decoys, and fragmented probes only regain meaning through fragment reassembly on the sensor side. Banners, enumeration and handshake do not fit these sentences.</p>","kw":["kw-passive","kw-osint","kw-footprint","kw-decoy","kw-evasion"]},{"id":"H21","t":"log","th":"t4","pts":4,"title":"Measure the beacon","sc":"<p>Resolver log for one host. Filter the noise and measure the rhythm of the TXT queries to <code>*.stage.example-cdn[.]net</code>.</p>","q":"<p>What is the beacon interval, and why does it matter?</p>","rows":[{"t":"00:05:02  TXT  a91f3c6b2d4e8f10.stage.example-cdn[.]net","l":"w"},{"t":"00:10:03  TXT  77c1e9d0a4b2f638.stage.example-cdn[.]net","l":"w"},{"t":"00:15:03  TXT  e02d4f6a8c1b3e57.stage.example-cdn[.]net","l":"w"},{"t":"00:20:04  TXT  4b8d2f6a0c9e1d35.stage.example-cdn[.]net","l":"w"},{"t":"00:25:04  TXT  6f3a9c1e5b7d2048.stage.example-cdn[.]net","l":"w"},{"t":"00:30:05  TXT  91c4e7a2d6b80f34.stage.example-cdn[.]net","l":"w"},{"t":"00:31:10  A    cdn-assets.example-cdn[.]net","l":"i"},{"t":"00:35:05  TXT  2d8f4b6a0c1e9d37.stage.example-cdn[.]net","l":"w"}],"sub":{"t":"qcm","ch":["About every 5 minutes, always 16 hex characters - an automated C2 check-in channel","Random user browsing that happens to hit the same domain every five minutes","An NTP time sync that fires every five minutes and drifts slightly","A backup job that moves its full dataset every sixty seconds"],"a":0},"hint":"Filter for \"TXT\" and subtract consecutive timestamps.","ex":"<p>The TXT queries repeat at almost exactly 300-second gaps with fixed-length labels - machine rhythm, not human behaviour. Fixed-length encoded labels plus metronomic timing is the classic DNS beacon: the interval (about 5 minutes) is the C2 check-in schedule. Browsing, NTP and backups do not send identical-shaped TXT names.</p>","kw":["kw-dns"]},{"id":"H22","t":"qcm","th":"t2","pts":4,"title":"The standby print server alibi","sc":"<p>Firewall logs show 10[.]20[.]99[.]7 - a print server - apparently scanning the finance VLAN across 400 ports in 3 minutes. Asset data: the print server is in standby, its admin page shows no open sessions, and its IP ID responses were predictable all morning. Staff confirm nobody touched it.</p>","q":"<p>What most likely really happened?</p>","ch":["Someone ran an idle scan through the print server as a zombie","The printer was hacked and ran nmap itself","The firewall duplicated log entries","A VLAN misconfiguration echoed packets between ranges"],"a":0,"hint":"A quiet, predictable machine can scan without running a single command itself.","ex":"<p>The print server matches the ideal idle-scan zombie: idle (standby, no sessions) and predictable IP ID behaviour. Its address appears as the scanner because the real attacker spoofed it - the actual probing came from somewhere else. Duplicate log entries and VLAN echoes would not produce a clean sequential port sweep tied to one host.</p>","kw":["kw-idle"]},{"id":"H23","t":"dd","th":"t3","pts":8,"title":"Packet triage: normal or suspicious","sc":"<p>Eight events from a corporate capture land in your queue. Decide fast, but decide correctly.</p>","q":"<p>Drag every event to Normal or Suspicious.</p>","zones":[{"id":"z1","label":"Normal"},{"id":"z2","label":"Suspicious"}],"items":[{"x":"HTTP GET /logo.png 200 from a workstation","c":"z1"},{"x":"DNS answer for www[.]company[.]example","c":"z1"},{"x":"TLS ClientHello to cdn[.]company[.]example","c":"z1"},{"x":"ARP request: who-has 10[.]1[.]1[.]1? tell 10[.]1[.]1[.]24","c":"z1"},{"x":"SYN to 445/SMB from an external IP","c":"z2"},{"x":"POST /upload with UA python-requests at 03:00","c":"z2"},{"x":"ARP reply: 10[.]1[.]1[.]1 is-at a brand-new MAC","c":"z2"},{"x":"DNS TXT query with a 44-character hex subdomain","c":"z2"}],"hint":"Three are everyday traffic including an ordinary ARP question. The odd ones: SMB from outside, scripted uploads at night, a gateway identity change, encoded DNS.","ex":"<p>Normal: a logo fetch, a DNS answer, a TLS hello to the company CDN, and a standard ARP \"who has\" question. Suspicious: external SYN to SMB (recon of file-sharing), a scripted upload at 03:00, an ARP reply that re-binds the gateway (spoofing), and a long encoded TXT subdomain (tunneling/beacon).</p>","kw":["kw-http","kw-dns","kw-arp","kw-handshake"]},{"id":"H24","t":"order","th":"t5","pts":5,"title":"Hunt the internal scanner","sc":"<p>Management asks: \"Could a rogue scanner already be inside?\" Build the hunt plan in the correct order.</p>","q":"<p>Order the five hunt steps from first to last.</p>","items":["Confirm the sensor sits on a SPAN port and sees inter-VLAN traffic","Search flow logs for one source touching 20+ distinct ports in minutes","Match those flows against IDS scan signatures and firewall drops","Identify the host, its owner and its asset footprint","Contain the host and review what it already reached"],"hint":"You cannot hunt what you cannot see. Containment is the last step, not the first.","ex":"<p>A hunt starts with visibility (SPAN/promiscuous sensor), then a cheap, high-signal query in flow logs, then corroboration from IDS and firewall records, then attribution against the asset inventory (footprint), and only then containment plus reach-back. Skipping visibility or attribution leads to wrong hosts being contained.</p>","kw":["kw-promisc","kw-footprint","kw-evasion"]},{"id":"H25","t":"multi","th":"t1","pts":7,"title":"Port states, no shortcuts","sc":"<p>Final review before the scan-report workshop. Several trainee statements about Nmap port states are mixed up; the slide must keep only the true ones.</p>","q":"<p>Select <b>every true statement</b>.</p>","ch":[{"x":"closed - the host sent RST, so it is up but no service listens","ok":true},{"x":"filtered - no reply arrived, or an ICMP unreachable came back","ok":true},{"x":"unfiltered - the ACK scan got RST, but open vs closed stays unknown","ok":true},{"x":"open - the probe drew a SYN/ACK answer","ok":true},{"x":"filtered - the service is definitely down","ok":false},{"x":"unfiltered - the port is guaranteed open","ok":false},{"x":"closed - the firewall is dropping our probes","ok":false}],"hint":"Two lines swap what silence means, one line over-promises.","ex":"<p>RST = closed (alive host, empty port). Silence or ICMP unreachable = filtered - the service may or may not exist behind the drop, so \"definitely down\" is wrong. SYN/ACK = open. ACK-scan RST = unfiltered, reachable but undecided - \"guaranteed open\" over-promises. The last line confuses closed with filtered, the classic beginner swap.</p>","kw":["kw-portstate","kw-sA","kw-icmp"]},{"id":"H26","t":"qcm","th":"t2","pts":4,"title":"Low confidence behind the balancer","sc":"<p>Your -O OS detection run against a big customer site reports \"No exact OS matches\" repeatedly. The path crosses a load balancer and a NAT device. Probes from the same tool against a directly reachable lab host nail the OS every time.</p>","q":"<p>Why is OS detection unreliable on the customer site?</p>","ch":["The fingerprint mixes several devices and paths, so no one stack matches","The -O flag only reads fingerprints at night to avoid noise","The lab host simply runs a newer kernel than the servers","OS detection needs UDP services that the site does not expose"],"a":0,"hint":"-O reads a personality. What happens to a personality when several devices translate and split the traffic?","ex":"<p>OS detection compares TCP/IP behaviour (window sizes, TTL, options order) against known stacks. Behind a load balancer and NAT, replies are rewritten and spread across paths and devices, so the observed fingerprint belongs to nobody. The lab host, reached directly, presents one clean stack - hence the difference.</p>","kw":["kw-O","kw-ttl"]},{"id":"H27","t":"match","th":"t5","pts":5,"title":"Recon techniques to ATT&CK","sc":"<p>Your threat-intel team maps observed behaviour to MITRE ATT&CK IDs for the quarterly report.</p>","q":"<p>Match each technique ID to its ATT&CK name.</p>","pairs":[{"l":"T1595","r":"Active Scanning"},{"l":"T1592","r":"Gather Victim Host Information"},{"l":"T1590","r":"Gather Victim Network Information"},{"l":"T1593","r":"Search Open Websites and Domains"},{"l":"T1589","r":"Gather Victim Identity Information"}],"hint":"1595 sends packets; 1593 reads public pages; the others split host facts from network facts from identity facts.","ex":"<p>ATT&CK RECONNAISSANCE: T1595 Active Scanning (port and vulnerability sweeps), T1592 Gather Victim Host Information (software, roles), T1590 Gather Victim Network Information (ranges, DNS, topology), T1593 Search Open Websites/Domains (OSINT browsing), T1589 Gather Victim Identity Information (emails, personas). Consistent mapping makes reports searchable across teams.</p>","kw":["kw-osint","kw-footprint","kw-enum"]},{"id":"H28","t":"spot","th":"t1","pts":5,"title":"Alive, but untouched","sc":"<p>Change window. The network owner only accepts a <b>host discovery</b> pass over <code>LAB-SUBNET-A</code> - no service port may be probed - and wants the result in a file a script can parse. A junior sends this note for review. One line is wrong.</p>","q":"<p>Click the one <b>wrong</b> line.</p>","lines":[{"x":"Command: nmap -sn -oG live.txt 10[.]10[.]20[.]0/24","bad":false},{"x":"Note: -sn lists live hosts and skips the port scan entirely.","bad":false},{"x":"Note: -sn also reports which of the top 1000 ports are open on each host.","bad":true},{"x":"Note: -oG writes one line per host, so a script can grep for Status: Up.","bad":false},{"x":"Note: hosts that drop every probe will be listed as down, even if they are alive.","bad":false},{"x":"Note: a plain default scan would probe about 1000 TCP ports on every live host.","bad":false}],"hint":"The owner banned port probes. Which line sneaks port results back into the report?","ex":"<p>-sn is the \"ping scan, no port scan\" switch: it answers \"who is alive\" and the report never contains port states - exactly why the owner allows it. -oG keeps one parseable line per host (\"Status: Up\"). A default scan without -sn would probe about a thousand ports per host and breach the change window, and a host that silently drops all discovery probes shows as down even though it is alive.</p>","kw":["kw-sn","kw-output"]},{"id":"H29","t":"qcm","th":"t3","pts":4,"title":"Isolate handshake step two","sc":"<p>You teach a packet-reading class and want a filter that shows <b>only</b> the second step of TCP handshakes: SYN and ACK set together.</p>","q":"<p>Which display filter isolates exactly that step?</p>","ch":["tcp.flags.syn == 1 && tcp.flags.ack == 1","tcp.flags.syn == 1 && tcp.flags.ack == 0","tcp.flags.ack == 1 && tcp.flags.syn == 0","tcp.flags.reset == 1 && tcp.flags.ack == 1"],"a":0,"hint":"Step one is SYN alone. Almost every data packet carries plain ACK.","ex":"<p>SYN+ACK set together appears (almost) only in handshake step two - a server accepting a connection. SYN with ack==0 is step one. ack==1 alone matches nearly every packet after the handshake, and reset==1 shows teardowns, not handshakes. Precise flag pairs are how you slice phases out of large captures.</p>","kw":["kw-handshake","kw-flags","kw-dfilter"]},{"id":"H30","t":"fib","th":"t2","pts":4,"title":"Assemble the blended scan","sc":"<p>Approved red-team run: a slow, blended SYN sweep. The lead fixed the pace and source-port options; you must add the two identity/shape switches.</p>","q":"<p>Fill both gaps. Click a word, then a gap.</p>","text":"nmap -sS <b>[]</b> R1,R2,ME <b>[]</b> --max-rate 30 --source-port 53 10[.]20[.]8[.]0/24","slots":["-D","-f"],"bank":["-D","-f","-sU","-T5","--badsum","-O"],"hint":"One switch takes a comma-separated list of fake sources. One switch cuts probes into small pieces.","ex":"<p>-D R1,R2,ME hides the scanner among decoy addresses (ME marks the real one - the list is comma-separated); -f fragments the probes so pattern-based sensors see slivers instead of a signature. -T5 would fight --max-rate 30 (loud, not slow), -sU changes protocol, --badsum relies on NIC dropping - a different trick, and -O fingerprints instead of evading.</p>","kw":["kw-decoy","kw-evasion","kw-sS","kw-T"]}],"severity":"hard"}
</script>
<script>
'use strict';
/* ===== Engine state & utils ===== */
var M = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var BLOB = JSON.parse(document.getElementById('exdata-json').textContent);
var THEMES = BLOB.themes, KWS = BLOB.kws, EX = BLOB.ex, SEV = BLOB.severity;
var S = null;
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtT(sec){ sec=Math.max(0,Math.floor(sec)); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function r2(n){ return Math.round(n*100)/100; }
function newState(){
  return {
    order: shuffle(EX.map(function(_,i){return i;})),
    pos: 0, ans:{}, lay:{}, res:{}, checked:{}, skipped:{}, hint:{},
    timeLeft:(M.estimatedMinutes||60)*60,
    pMan:false, pChk:false, reported:false, started:false, finished:false, user:'', earnedMap:{}, touched:{}
  };
}
function cur(){ return S ? S.order[S.pos] : -1; }
function curEx(){ return EX[cur()]; }
function isPause(){ return S && (S.pMan || S.pChk); }

/* ===== Timer ===== */
setInterval(function(){
  if(!S || !S.started || S.finished) return;
  if(S.pMan || S.pChk) return;
  S.timeLeft -= 1;
  if(S.timeLeft <= 0){ S.timeLeft = 0; updChrome(); finish(true); return; }
  updTimer();
},1000);
function updTimer(){
  var t=$('#timer'); if(!t) return;
  t.textContent=fmtT(S.timeLeft);
  t.classList.toggle('low', S.timeLeft<600 && S.timeLeft>0);
}
function updIndicators(){
  var box=$('#indicators'), out=[];
  if(S.pMan) out.push('<span class="pill man">&#9208; Paused (manual)</span>');
  if(S.pChk) out.push('<span class="pill chk">&#9203; Timer paused &mdash; review mode</span>');
  box.innerHTML=out.join('');
  box.classList.toggle('on', out.length>0);
  var pb=$('#pausebtn');
  pb.setAttribute('aria-pressed', S.pMan?'true':'false');
  pb.innerHTML = S.pMan ? '&#9654; Resume' : '&#9208; Pause';
}

/* ===== Live score & progress ===== */
function earnedSum(){
  var e=0; for(var k in S.earnedMap){ if(isCounted(k)) e+=S.earnedMap[k]; } return r2(e);
}
function isCounted(i){ return !S.skipped[i] && (S.checked[i] || S.touched[i]); }
function nonSkippedPts(){
  var p=0; for(var i=0;i<S.order.length;i++){ var ei=S.order[i]; if(isCounted(ei)) p+=EX[ei].pts; } return r2(p);
}
function notCountedIdx(){
  var out=[]; for(var p=0;p<S.order.length;p++){ var ei=S.order[p]; if(!isCounted(ei)) out.push({pos:p, ei:ei}); } return out;
}
function updScore(){
  var tot=nonSkippedPts();
  $('#scorebox').innerHTML='Score <b>'+fmtPts(earnedSum())+'</b> / '+fmtPts(tot)+' pt';
  var answered=0;
  for(var i=0;i<S.order.length;i++){ var ei=S.order[i]; if(S.checked[ei]||S.skipped[ei]||S.touched[ei]) answered++; }
  $('#barfill').style.width=(answered/EX.length*100)+'%';
  var th={};
  for(var j=0;j<S.order.length;j++){
    var e2=EX[S.order[j]];
    if(S.checked[S.order[j]]||S.skipped[S.order[j]]) th[e2.th]=(th[e2.th]||0)+1;
  }
  var chips='';
  for(var key in THEMES){ chips+='<span class="thchip">'+esc(THEMES[key])+' '+ (th[key]||0) +'/'+ themeCount(key) +'</span>'; }
  $('#thchips').innerHTML=chips;
}
function themeCount(t){ var n=0; for(var i=0;i<EX.length;i++){ if(EX[i].th===t) n++; } return n; }
function fmtPts(n){ var v=Math.round(n*100)/100; var s=(Math.round(v*100)/100); return (s%1===0)?String(s):String(parseFloat(s.toFixed(2))); }

/* ===== Navigator ===== */
function updNav(){
  var g=$('#navgrid'), h='';
  for(var p=0;p<S.order.length;p++){
    var ei=S.order[p], cls='nbtn', lbl='Exercise '+(p+1), gst='';
    if(S.skipped[ei]){ cls+=' skip'; gst='<span class="gst" aria-hidden="true">\u2934</span>'; lbl+=' (skipped, not counted unless finished)'; }
    else if(S.res[ei]){
      var st=labelOf(S.res[ei]);
      if(st==='full'){ cls+=' done'; gst='<span class="gst" aria-hidden="true">\u2713</span>'; lbl+=' (full points)'; }
      else if(st==='zero'){ cls+=' zero'; gst='<span class="gst" aria-hidden="true">\u2717</span>'; lbl+=' (zero points)'; }
      else { cls+=' part'; gst='<span class="gst" aria-hidden="true">\u26A0</span>'; lbl+=' (partial points)'; }
    } else if(S.checked[ei]){ cls+=' ansd'; lbl+=' (answered)'; }
    if(p===S.pos){ cls+=' cur'; lbl+=' (current)'; }
    h+='<button type="button" class="'+cls+'" data-act="jump" data-p="'+p+'" aria-label="'+esc(lbl)+'" title="'+esc(lbl)+'">'+(p+1)+gst+'</button>';
  }
  g.innerHTML=h;
}
function labelOf(res){
  if(res.earned>=res.max-0.001) return 'full';
  if(res.earned<=0.001) return 'zero';
  return 'partial';
}

/* ===== Chrome update ===== */
function updChrome(){
  if(!S) return;
  updTimer(); updIndicators(); updScore(); updNav();
  var w=$('#exwrap');
  if(w){ w.classList.toggle('veiled', S.pMan); w.setAttribute('aria-hidden', S.pMan?'true':'false'); }
}

/* ===== Navigation ===== */
function gotoPos(p){
  if(p<0||p>=S.order.length) return false;
  S.pos=p;
  if(S.pChk) S.pChk=false; /* leaving the reviewed exercise ends its Check-pause; only re-Checking re-applies it */
  renderEx(); updChrome();
  var app=$('#screen'); if(app) app.scrollIntoView({block:'start'});
  return true;
}
function onNext(){
  if(!S||S.finished) return;
  S.pChk=false;
  if(S.pos < S.order.length-1){ gotoPos(S.pos+1); }
  else { openModal('End of exam','You reached the last exercise. Submit now, or go back with Prev to finish skipped exercises.','Submit exam'); }
  updChrome();
}
function onPrev(){
  if(!S||S.finished) return;
  if(S.pos>0) gotoPos(S.pos-1);
}
function onJump(p){ if(!S||S.finished) return; gotoPos(p); }

/* ===== Layout & answer init ===== */
function initLay(i,e){
  var L={};
  if(e.t==='qcm'||e.t==='multi') L.ord=shuffle(e.ch.map(function(_,k){return k;}));
  else if(e.t==='dd') L.ord=shuffle(e.items.map(function(_,k){return k;}));
  else if(e.t==='order'||e.t==='rank') L.ord=shuffle(e.items.map(function(_,k){return k;}));

/* ===== Evaluators ===== */
function evalEx(i,e){
  var a=S.ans[i], els=[], earned=0, max=e.pts, mult=S.hint[i]?0.9:1;
  function fin(frac){ return r2(max*frac*mult); }
  if(e.t==='qcm'){
    var ok=(a===e.a);
    els.push({k:'c'+e.a, st: ok?'ok':'miss'});
    if(a!==null&&a!==e.a) els.push({k:'c'+a, st:'bad'});
    return {els:els, earned: ok?fin(1):0, max:max};
  }
  if(e.t==='multi'){
    var okIdx=e.ch.map(function(c,k){return c.ok?k:-1;}).filter(function(k){return k>-1;});
    var hit=0;
    okIdx.forEach(function(o){ if(a.indexOf(o)>-1){els.push({k:'c'+o,st:'ok'});hit++;} else els.push({k:'c'+o,st:'miss'}); });
    a.forEach(function(o){ if(!e.ch[o].ok) els.push({k:'c'+o,st:'bad'}); });
    return {els:els, earned: fin(hit/okIdx.length), max:max};
  }
  if(e.t==='dd'){
    var hit2=0;
    e.items.forEach(function(it,o){ var z=a[o]; if(z===it.c){els.push({k:'i'+o,st:'ok'});hit2++;} else if(z===undefined||z===null){els.push({k:'i'+o,st:'miss'});} else els.push({k:'i'+o,st:'bad'}); });
    return {els:els, earned: fin(hit2/e.items.length), max:max};
  }
  if(e.t==='order'||e.t==='rank'){
    var hit3=0;
    a.forEach(function(o,p){ els.push({k:'o'+o, st:(o===p)?'ok':'bad'}); if(o===p) hit3++; });
    return {els:els, earned: fin(hit3/e.items.length), max:max};
  }
  if(e.t==='match'){
    var hit4=0;
    e.pairs.forEach(function(p,l){ if(a[l]===l){els.push({k:'m'+l,st:'ok'});hit4++;} else if(a[l]<0){els.push({k:'m'+l,st:'miss'});} else els.push({k:'m'+l,st:'bad'}); });
    return {els:els, earned: fin(hit4/e.pairs.length), max:max};
  }
  if(e.t==='fib'){
    var hit5=0;
    e.slots.forEach(function(sv,s){ if(a[s]>=0 && e.bank[a[s]]===sv){els.push({k:'s'+s,st:'ok'});hit5++;} else if(a[s]<0){els.push({k:'s'+s,st:'miss'});} else els.push({k:'s'+s,st:'bad'}); });
    return {els:els, earned: fin(hit5/e.slots.length), max:max};
  }
  if(e.t==='term'){
    var cmd=norm(a||''), ok2=e.req.every(function(rx){ return new RegExp(rx,'i').test(cmd); });
    els.push({k:'cmd', st: ok2?'ok':'bad'});
    return {els:els, earned: ok2?fin(1):0, max:max};
  }
  if(e.t==='log'){ return evalSub(e.sub, a, 's', max, mult, els); }
  if(e.t==='branch'){
    var hit6=0;
    e.steps.forEach(function(st,s){ var p=a.picks[s];
      if(p===undefined){els.push({k:'b'+s,st:'miss'});}
      else if(st.ch[p].ok){els.push({k:'b'+s,st:'ok'});hit6++;}
      else els.push({k:'b'+s,st:'bad'});
    });
    return {els:els, earned: fin(hit6/e.steps.length), max:max};
  }
  if(e.t==='spot'){
    var bad=e.lines.map(function(l,k){return l.bad?k:-1;}).filter(function(k){return k>-1;});
    if(bad.length===1){
      var ok3=(a.length===1&&a[0]===bad[0]);
      els.push({k:'l'+bad[0], st: ok3?'ok':'miss'});
      a.forEach(function(l){ if(l!==bad[0]) els.push({k:'l'+l,st:'bad'}); });
      return {els:els, earned: ok3?fin(1):0, max:max};
    }
    var hit7=0;
    bad.forEach(function(l){ if(a.indexOf(l)>-1){els.push({k:'l'+l,st:'ok'});hit7++;} else els.push({k:'l'+l,st:'miss'}); });
    a.forEach(function(l){ if(bad.indexOf(l)<0) els.push({k:'l'+l,st:'bad'}); });
    return {els:els, earned: fin(hit7/bad.length), max:max};
  }
  if(e.t==='dual'){
    var totE=0, gotE=0;
    e.subs.forEach(function(sb,si){
      var tmp=[];
      var sub=evalSub(sb, a[si], 'd'+si+'c', 1, 1, tmp);
      var n=sb.t==='multi'?sb.ch.filter(function(c){return c.ok;}).length:1;
      totE+=n; gotE+=sub.earned*n;
      tmp.forEach(function(el){ els.push(el); });
    });
    return {els:els, earned: fin(totE? gotE/totE : 0), max:max};
  }
  return {els:els, earned:0, max:max};
}
function evalSub(sb, a, prefix, max, mult, els){
  function fin(f){ return r2(max*f*mult); }
  if(sb.t==='qcm'){
    var ok=(a===sb.a);
    els.push({k:prefix+sb.a, st: ok?'ok':'miss'});
    if(a!==null&&a!==undefined&&a!==sb.a) els.push({k:prefix+a, st:'bad'});
    return {els:els, earned: ok?fin(1):0, max:max};
  }
  var okIdx=sb.ch.map(function(c,k){return c.ok?k:-1;}).filter(function(k){return k>-1;});
  var hit=0;
  okIdx.forEach(function(o){ if(a.indexOf(o)>-1){els.push({k:prefix+o,st:'ok'});hit++;} else els.push({k:prefix+o,st:'miss'}); });
  a.forEach(function(o){ if(!sb.ch[o].ok) els.push({k:prefix+o,st:'bad'}); });
  return {els:els, earned: fin(hit/okIdx.length), max:max};
}
function norm(c){ return String(c).toLowerCase().replace(/\s+/g,' ').replace(/^[\s\$]+/,'').trim(); }

/* ===== Actions ===== */
var PENDING=null; /* holds {kind:'bcheck'} while the branch-check confirmation modal is open */
function doCheck(force){
  var i=cur(), e=EX[i];
  if(S.res[i]){ S.pChk=true; updChrome(); return; }
  if(e.t==='branch' && !force && S.ans[i].picks.filter(function(x){return x!==undefined;}).length<e.steps.length){
    PENDING={kind:'bcheck'};
    openModal('Finish the scenario?','Not every step is done. Check now anyway? Any step without a decision scores zero.','Check now');
    return;
  }
  if(e.t==='qcm'&&S.ans[i]===null){ flash('Choose an answer first, or press Skip.'); return; }
  if(e.t==='multi'&&S.ans[i].length===0){ flash('Select at least one option, or press Skip.'); return; }
  if(e.t==='term'&&!S.ans[i]){ flash('Type a command first, or press Skip.'); return; }
  if(e.t==='log'){ var se=(e.sub.t==='multi')?(S.ans[i].length===0):(S.ans[i]===null||S.ans[i]===undefined); if(se){ flash('Pick an answer under the log first, or press Skip.'); return; } }
  if(e.t==='dual'){ var any=false; e.subs.forEach(function(sb,si){ var sv=S.ans[i][si]; if(sb.t==='multi'?sv.length>0:(sv!==null&&sv!==undefined)) any=true; }); if(!any){ flash('Answer at least one of the two views first, or press Skip.'); return; } }
  if(e.t==='spot'&&S.ans[i].length===0){ flash('Flag at least one line first, or press Skip.'); return; }
  var r=evalEx(i,e);
  r.hintUsed=!!S.hint[i];
  S.res[i]=r; S.checked[i]=true; S.skipped[i]=false;
  S.earnedMap=S.earnedMap||{}; S.earnedMap[i]=r.earned;
  S.pChk=true;
  renderEx();
}
function doRevise(){
  var i=cur();
  if(!S.res[i]) return;
  delete S.res[i]; S.checked[i]=false;
  S.earnedMap=S.earnedMap||{}; S.earnedMap[i]=0;
  /* Check-pause intentionally survives Revise: only Next resumes the timer (spec) */
  renderEx();
}
function doSkip(){
  var i=cur();
  if(S.res[i]){
    if(S.pos<S.order.length-1){ gotoPos(S.pos+1); }
    else openModal('End of exam','You reached the last exercise. Submit now, or go back with Prev to finish skipped exercises.','Submit exam');
    flash('Already checked \u2014 this exercise stays counted. Use Revise to change your answer.');
    return;
  }
  S.skipped[i]=true;
  if(S.pos<S.order.length-1){ S.pChk=false; gotoPos(S.pos+1); }
  else openModal('End of exam','You reached the last exercise. Submit now, or go back with Prev to finish skipped exercises.','Submit exam');
}
function doHint(){

  S.hint[i]=true; renderEx();
}
function flash(msg){

/* ===== DnD binding ===== */
function bindDnD(i,e){
  var root=$('#ansarea'); if(!root) return;
  $all('.chip',root).forEach(function(ch){
    ch.addEventListener('dragstart',function(ev){ try{ev.dataTransfer.setData('text/plain',ch.getAttribute('data-i'));}catch(x){} ch.classList.add('dragging'); });
    ch.addEventListener('dragend',function(){ ch.classList.remove('dragging'); });
  });
  $all('.zone',root).forEach(function(zn){
    zn.addEventListener('dragover',function(ev){ ev.preventDefault(); zn.classList.add('over'); });
    zn.addEventListener('dragleave',function(){ zn.classList.remove('over'); });
    zn.addEventListener('drop',function(ev){ ev.preventDefault(); zn.classList.remove('over');
      if(S.res[i]) return;
      var o=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(o)) return;
      S.ans[i][o]=zn.getAttribute('data-zone'); S.sel=null; renderEx();
    });
  });
  var pool=$('[data-pool="1"]',root);
  if(pool){
    pool.addEventListener('dragover',function(ev){ ev.preventDefault(); });
    pool.addEventListener('drop',function(ev){ ev.preventDefault();
      if(S.res[i]) return;
      var o=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(o)) return;
      delete S.ans[i][o]; S.sel=null; renderEx();
    });
  }
  $all('.rowit[draggable="true"]',root).forEach(function(rw){
    rw.addEventListener('dragover',function(ev){ ev.preventDefault();
      if(S.res[i]) return;
      var from=parseInt(rw.getAttribute('data-row'),10);
      var drag=getDragRow(); if(drag===null||drag===from) return;
      var arr=S.ans[i], it=arr.splice(drag,1)[0]; arr.splice(from,0,it); S.dragPos=from; renderEx();
    });
  });
}
function getDragRow(){ return (S&&S.dragPos!==undefined)?S.dragPos:null; }

/* ===== Event delegation ===== */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');
  if(!t){
    var zi=cur();
    var zn2=ev.target.closest?ev.target.closest('.zone'):null;
    if(S&&!S.finished&&!S.pMan&&zi>-1&&!S.res[zi]&&EX[zi].t==='dd'&&zn2&&S.sel!==null&&S.sel!==undefined){
      S.touched[zi]=true;
      S.ans[zi][S.sel]=zn2.getAttribute('data-zone'); S.sel=null; renderEx();
    }
    return;
  }
  var act=t.getAttribute('data-act');
  var i=cur(), e=(i>-1)?EX[i]:null;
  if(act==='jump'){ onJump(parseInt(t.getAttribute('data-p'),10)); return; }
  if(act==='start'){ startExam(); return; }
  if(!S||S.finished){ if(act==='retake'){retake();} else if(act==='dosubmit'){closeModal(); finish(false);} else if(act==='mclose'){closeModal();} return; }
  if(act==='pause'){ doPause(); return; }
  if(act==='asksubmit'){ askSubmit(); return; }
  if(act==='mclose'){ PENDING=null; closeModal(); return; }
  if(act==='dosubmit'){
    var pend=PENDING; PENDING=null; closeModal();
    if(pend&&pend.kind==='bcheck'){ doCheck(true); } else { finish(false); }
    return;
  }
  if(S.pMan&&act!=='pause'){ return; }
  if(act==='check'){ doCheck(); return; }
  if(act==='revise'){ doRevise(); return; }
  if(act==='skip'){ doSkip(); return; }
  if(act==='hint'){ doHint(); return; }
  if(act==='prev'){ onPrev(); return; }
  if(act==='next'){ onNext(); return; }
  if(!e||S.res[i]){ return; }
  if(act==='chip'){
    var o=parseInt(t.getAttribute('data-i'),10);
    S.touched[i]=true;
    if(S.ans[i][o]){ delete S.ans[i][o]; S.sel=null; }
    else { S.sel=(S.sel===o?null:o); }
    renderEx(); return;
  }
  if(act==='up'||act==='down'){
    var p=parseInt(t.getAttribute('data-p'),10), arr=S.ans[i], q=(act==='up')?p-1:p+1;
    if(q<0||q>=arr.length) return;
    S.touched[i]=true;
    var tmp=arr[p]; arr[p]=arr[q]; arr[q]=tmp; renderEx(); return;
  }
  if(act==='bank'){
    var b=parseInt(t.getAttribute('data-b'),10);
    S.touched[i]=true;
    S.sel=(S.sel===b?null:b); renderEx(); return;
  }
  if(act==='slot'){
    var s2=parseInt(t.getAttribute('data-s'),10), cur2=S.ans[i][s2];
    S.touched[i]=true;
    if(S.sel!==null&&S.sel!==undefined){
      var usedAt=S.ans[i].indexOf(S.sel); if(usedAt>-1) S.ans[i][usedAt]=-1;
      S.ans[i][s2]=S.sel; S.sel=null;
    }
    else if(cur2>=0){ S.ans[i][s2]=-1; }
    renderEx(); return;
  }
  if(act==='bpick'){
    var st=parseInt(t.getAttribute('data-s'),10), c=parseInt(t.getAttribute('data-c'),10);
    if(S.ans[i].picks[st]!==undefined) return;
    S.touched[i]=true;
    S.ans[i].picks[st]=c; renderEx(); return;
  }
  if(act==='bcont'){
    S.ans[i].step=Math.min(S.ans[i].step+1, e.steps.length-1);
    if(S.ans[i].picks[S.ans[i].step]!==undefined) S.ans[i].step=Math.min(S.ans[i].step+1,e.steps.length-1);
    renderEx(); return;
  }
  if(act==='spot'){
    var l=parseInt(t.getAttribute('data-l'),10), arr2=S.ans[i];
    S.touched[i]=true;
    var ix=arr2.indexOf(l); if(ix>-1) arr2.splice(ix,1); else arr2.push(l);
    renderEx(); return;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target; if(!t.matches('input[type="radio"],input[type="checkbox"],select.matchsel')) return;
  if(!S||S.finished) return;
  var i=cur(), e=EX[i]; if(!e||S.res[i]) return;
  if(t.matches('select.matchsel')){
    S.touched[i]=true;

  }
  var o=parseInt(t.value,10);
  var sub=t.getAttribute('data-sub');
  if(t.closest('#ansarea')&&t.name.indexOf('sub')===0){
    S.touched[i]=true;
    if(e.t==='log'){ 
      if(e.sub.t==='multi'){ var arr=S.ans[i], ix=arr.indexOf(o); if(t.checked&&ix<0)arr.push(o); if(!t.checked&&ix>-1)arr.splice(ix,1); }
      else S.ans[i]=o;
    } else {
      var si=parseInt(sub,10);
      if(e.subs[si].t==='multi'){ var arr2=S.ans[i][si], ix2=arr2.indexOf(o); if(t.checked&&ix2<0)arr2.push(o); if(!t.checked&&ix2>-1)arr2.splice(ix2,1); }
      else S.ans[i][si]=o;
    }
    renderEx(); return;
  }
  if(e.t==='qcm') S.ans[i]=o;
  else if(e.t==='multi'){ var arr3=S.ans[i], ix3=arr3.indexOf(o); if(t.checked&&ix3<0)arr3.push(o); if(!t.checked&&ix3>-1)arr3.splice(ix3,1); }
  S.touched[i]=true;
  renderEx();
});
document.addEventListener('input',function(ev){
  var t=ev.target; if(!S||S.finished) return;
  var i=cur(), e=EX[i]; if(!e) return;
  if(t.id==='termin'&&!S.res[i]){ S.touched[i]=true; S.ans[i]=t.value; }
  if(t.id==='logfilter'){ S.lay[i].filter=t.value; var rr=rowHtml(i,e); $('#logrows').innerHTML=rr.html; $('#logcnt').textContent=rr.n+' / '+rr.tot+' lines'; }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&$('#modal').classList.contains('on')){ PENDING=null; closeModal(); return; }
  if(!S||S.finished) return;
  var i=cur(), e=EX[i]; if(!e) return;
  if(ev.key==='Enter'&&ev.target.classList){
    if(ev.target.classList.contains('chip')&&ev.target.getAttribute('data-act')==='chip'){ ev.preventDefault(); ev.target.click(); return; }
    if(ev.target.classList.contains('slot')){ ev.preventDefault(); ev.target.click(); return; }
    if(ev.target.classList.contains('zone')&&S.sel!==null&&S.sel!==undefined){ ev.preventDefault(); S.ans[i][S.sel]=ev.target.getAttribute('data-zone'); S.sel=null; renderEx(); return; }
  }
});

function askSubmit(){

/* ===== Results ===== */
function givenSummary(i,e){
  var a=S.ans[i], L=S.lay[i];
  if(S.skipped[i]&&!S.res[i]) return '<i>Skipped &mdash; not counted.</i>';
  switch(e.t){
    case 'qcm': return a===null?'<i>No answer.</i>':txt(e.ch[a]);
    case 'multi': return a.length? e.ch.filter(function(c,k){return a.indexOf(k)>-1;}).map(txt).join(' &middot; ') : '<i>Nothing selected.</i>';
    case 'dd': { var parts=[]; e.items.forEach(function(it,o){ if(a[o]) parts.push(esc(it.x)+' &rarr; <b>'+esc(e.zones.filter(function(z){return z.id===a[o];})[0].label)+'</b>'); }); return parts.join(' &middot; ')||'<i>Nothing placed.</i>'; }
    case 'order': case 'rank': return a.map(function(o,p){return (p+1)+'. '+esc(e.items[o]);}).join(' &middot; ');
    case 'match': return e.pairs.map(function(p,l){return esc(p.l)+' &rarr; '+(a[l]>-1?'<b>'+esc(e.pairs[a[l]].r)+'</b>':'<i>&mdash;</i>');}).join(' &middot; ');
    case 'fib': return e.slots.map(function(sv,s){return (a[s]>=0)?'<b>'+esc(e.bank[a[s]])+'</b>':'<i>&mdash;</i>';}).join(' &middot; ');
    case 'term': return a?'<code>'+esc(a)+'</code>':'<i>Nothing typed.</i>';
    case 'log': return subGiven(e.sub,a);
    case 'branch': return e.steps.map(function(st,s){return 'Step '+(s+1)+': '+(a.picks[s]!==undefined?txt(st.ch[a.picks[s]].x):'<i>unreached</i>');}).join(' &middot; ');
    case 'spot': return a.length? a.map(function(l){return '<code>'+esc(e.lines[l].x)+'</code>';}).join(' &middot; ') : '<i>No line flagged.</i>';
    case 'dual': return e.subs.map(function(sb,si){return sb.label+': '+subGiven(sb,a[si]);}).join(' &middot; ');
  }
  return '';
}
function subGiven(sb,a){
  if(sb.t==='qcm') return a===null||a===undefined?'<i>No answer.</i>':txt(sb.ch[a]);
  return (a&&a.length)? sb.ch.filter(function(c,k){return a.indexOf(k)>-1;}).map(txt).join(' &middot; ') : '<i>Nothing selected.</i>';
}
function txt(h){ return h; }
function correctSummary(i,e){
  switch(e.t){
    case 'qcm': return txt(e.ch[e.a]);
    case 'multi': return e.ch.filter(function(c){return c.ok;}).map(txt).join(' &middot; ');
    case 'dd': return e.items.map(function(it){return esc(it.x)+' &rarr; <b>'+esc(e.zones.filter(function(z){return z.id===it.c;})[0].label)+'</b>';}).join(' &middot; ');
    case 'order': case 'rank': return e.items.map(function(x,p){return (p+1)+'. '+esc(x);}).join(' &middot; ');
    case 'match': return e.pairs.map(function(p){return esc(p.l)+' &rarr; <b>'+esc(p.r)+'</b>';}).join(' &middot; ');
    case 'fib': return e.slots.map(function(sv){return '<b>'+esc(sv)+'</b>';}).join(' &middot; ');
    case 'term': return '<code>'+esc(e.demo)+'</code>';
    case 'log': return subCorrect(e.sub);
    case 'branch': return e.steps.map(function(st,s){return 'Step '+(s+1)+': '+st.ch.filter(function(c){return c.ok;}).map(function(c){return txt(c.x);}).join('');}).join(' &middot; ');
    case 'spot': return e.lines.filter(function(l){return l.bad;}).map(function(l){return '<code>'+esc(l.x)+'</code>';}).join(' &middot; ');
    case 'dual': return e.subs.map(function(sb){return sb.label+': '+subCorrect(sb);}).join(' &middot; ');
  }
  return '';
}
function subCorrect(sb){
  if(sb.t==='qcm') return txt(sb.ch[sb.a]);
  return sb.ch.filter(function(c){return c.ok;}).map(txt).join(' &middot; ');
}

/* ===== Finish & report ===== */
function feedbackHtml(i,e){
  var r=S.res[i]; if(!r) return '';
  var lab=labelOf(r);
  var cls=lab==='full'?'full':lab==='zero'?'zero':'part';
  var icon=lab==='full'?'\u2713 FULL':lab==='zero'?'\u2717 ZERO':'\u26A0 PARTIAL';
  var h='<div class="fb '+cls+'" role="status">'+icon+' &mdash; You earned '+fmtPts(r.earned)+' / '+fmtPts(r.max)+' points.'+(r.hintUsed?' (Hint used: &minus;10%)':'')+'</div>';
  h+='<div class="expl"><h4>EXPLANATION</h4>'+e.ex+'</div>';
  return h;
}
function finish(auto){
  if(S.finished) return;
  S.finished=true;
  S.order.forEach(function(ei){
    if(S.skipped[ei]) return;
    if(!S.touched[ei]) return;
    if(!S.res[ei]){
      if(S.ans[ei]===undefined) initAns(ei,EX[ei]);
      var r=evalEx(ei,EX[ei]);
      r.hintUsed=!!S.hint[ei];
      S.res[ei]=r; S.checked[ei]=true;
      S.earnedMap=S.earnedMap||{}; S.earnedMap[ei]=r.earned;
    }
  });
  closeModal(); S.pMan=false; S.pChk=false;
  updChrome();
  renderResults();
  var total=nonSkippedPts(), earned=earnedSum();
  var correct=Math.round(earned), tot=Math.round(total);
  if(tot>0){
    var percent=Math.round(correct/tot*100);
    reportScore(correct,tot,percent,percent>=70);
  }
}
function reportScore(correct,total,percent,passed){
  if(S.reported) return;
  S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      score:correct, total:total, percent:percent, passed:passed
    }, location.origin);
  }catch(e){ /* opened directly: nothing to report to */ }
}

/* ===== Boot ===== */
function boot(){
  S=newState();
  window.addEventListener('message',function(ev){
    if(!ev.data) return;
    if(ev.data.type==='CYBERPULSE_INIT'||ev.data.type==='CYBERMASTERY_INIT'){
      S.user=ev.data.username||S.user||'';
      var g=$('#greet'); if(g&&S.user) g.textContent='Welcome, '+S.user+' \u2014 '+M.title;
    }
  });
  renderIntro();
  /* QA hooks: exposed only when the file is opened directly from disk, never on the site */
  if(location.protocol==='file:'){
    window.__EXPOSED__={
      get state(){ return S; },
      ex: EX,
      setTime:function(v){ S.timeLeft=v; updTimer(); },
      reportCount:function(){ return S.reported?1:0; }
    };
  }
}
boot();

</script>
