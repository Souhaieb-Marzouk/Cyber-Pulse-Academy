{"themes":{"t1":"Nmap host discovery & port scanning","t2":"Nmap fingerprinting & features","t3":"Wireshark & packet analysis","t4":"Protocol traffic indicators","t5":"Recon methodology, OSINT & evasion"},"kws":{"kw-sn":{"th":"t1","label":"Host discovery / ping sweep (-sn)"},"kw-sS":{"th":"t1","label":"SYN scan (-sS, half-open)"},"kw-sT":{"th":"t1","label":"Connect scan (-sT)"},"kw-sU":{"th":"t1","label":"UDP scan (-sU)"},"kw-sA":{"th":"t1","label":"ACK scan (-sA) & firewall rule mapping"},"kw-xmas":{"th":"t1","label":"FIN / Null / Xmas scans (-sF -sN -sX)"},"kw-portstate":{"th":"t1","label":"Port states: open, closed, filtered, unfiltered"},"kw-portrange":{"th":"t1","label":"Port specification (-p, lists, ranges, -p-)"},"kw-sV":{"th":"t2","label":"Service & version detection (-sV)"},"kw-O":{"th":"t2","label":"OS detection & TCP/IP fingerprinting (-O)"},"kw-T":{"th":"t2","label":"Timing templates (-T0 to -T5)"},"kw-nse":{"th":"t2","label":"NSE scripting engine (--script, categories)"},"kw-output":{"th":"t2","label":"Output formats (-oN, -oX, -oG, -oA)"},"kw-idle":{"th":"t2","label":"Idle / zombie scan (-sI)"},"kw-decoy":{"th":"t2","label":"Decoys & source spoofing (-D, -S, -g)"},"kw-bpf":{"th":"t3","label":"Capture filters (BPF syntax)"},"kw-dfilter":{"th":"t3","label":"Display filters (Wireshark syntax)"},"kw-handshake":{"th":"t3","label":"TCP three-way handshake"},"kw-flags":{"th":"t3","label":"TCP flags (SYN, ACK, RST, FIN, PSH)"},"kw-stream":{"th":"t3","label":"Follow TCP stream & reassembly"},"kw-protohier":{"th":"t3","label":"Protocol hierarchy & statistics"},"kw-promisc":{"th":"t3","label":"Promiscuous mode & SPAN / mirror ports"},"kw-dns":{"th":"t4","label":"DNS traffic analysis"},"kw-http":{"th":"t4","label":"HTTP analysis (methods, User-Agent)"},"kw-arp":{"th":"t4","label":"ARP traffic & ARP spoofing"},"kw-icmp":{"th":"t4","label":"ICMP types & codes (echo, unreachable)"},"kw-retrans":{"th":"t4","label":"Retransmissions & connection anomalies"},"kw-ttl":{"th":"t4","label":"TTL analysis & path hints"},"kw-passive":{"th":"t5","label":"Passive vs active reconnaissance"},"kw-osint":{"th":"t5","label":"OSINT: WHOIS, DNS records, public sources"},"kw-footprint":{"th":"t5","label":"Footprinting process"},"kw-banner":{"th":"t5","label":"Banner grabbing"},"kw-enum":{"th":"t5","label":"Service & share enumeration"},"kw-evasion":{"th":"t5","label":"Scan evasion (fragmentation, throttling, decoys)"},"kw-scope":{"th":"t5","label":"Scope, authorization & legal limits"}},"ex":[{"id":"M01","t":"qcm","th":"t5","pts":4,"title":"Passive or active first move","sc":"<p>You start a two-week penetration test for Meridian Logistics (fictional client). Your lead says: <b>\"Do the quiet part first. Nothing may touch their systems yet.\"</b></p>","q":"<p>Which action is <b>passive reconnaissance</b> and fits this instruction?</p>","ch":["Reviewing the WHOIS records of the client domain","Running nmap -sS against the client subnets","Connecting to port 21 with netcat to read the FTP banner","Sending ICMP echo requests to map live hosts"],"a":0,"hint":"Ask yourself: which option sends zero packets to the client systems?","ex":"<p>Passive reconnaissance collects information <b>without talking to the client systems</b>. A WHOIS lookup asks a public registry, so nothing reaches the client network. The other three options all send packets (TCP, ICMP) directly to the client, so they are active steps.</p>","kw":["kw-passive","kw-osint"]},{"id":"M02","t":"multi","th":"t1","pts":6,"title":"What a SYN scan really does","sc":"<p>A teammate ran <code>nmap -sS 10[.]20[.]8[.]0/24</code> from the attack box and calls it a \"half-open scan\". A junior asks what that actually means.</p>","q":"<p>Select <b>every true statement</b> about a SYN scan (-sS).</p>","ch":[{"x":"It sends a SYN packet and never completes the handshake","ok":true},{"x":"It is often called a half-open scan","ok":true},{"x":"It needs elevated rights to craft raw packets","ok":true},{"x":"It completes the three-way handshake on every open port","ok":false},{"x":"It sets FIN, PSH and URG flags at the same time","ok":false},{"x":"It only works against UDP services","ok":false}],"hint":"Half-open means exactly that: the connection is never opened fully. Which two flags describe a completed handshake?","ex":"<p>-sS sends a SYN. If the port answers SYN/ACK, Nmap sends RST and never finishes the handshake - that is why it is \"half-open\". Crafting raw packets needs admin or root rights. It is a TCP scan, not UDP, and the FIN/PSH/URG combination belongs to an Xmas scan, not to -sS.</p>","kw":["kw-sS","kw-handshake","kw-xmas"]},{"id":"M03","t":"dd","th":"t2","pts":6,"title":"Sort the nmap flags","sc":"<p>You are preparing the scan cheat sheet for the team wall. New colleagues keep mixing up what each flag does.</p>","q":"<p>Drag every nmap flag onto the job it does.</p>","zones":[{"id":"z1","label":"Host discovery"},{"id":"z2","label":"Service & OS fingerprinting"},{"id":"z3","label":"Timing & evasive scanning"},{"id":"z4","label":"Output"}],"items":[{"x":"-sn","c":"z1"},{"x":"-sV","c":"z2"},{"x":"-O","c":"z2"},{"x":"-sX","c":"z3"},{"x":"-f","c":"z3"},{"x":"-oG","c":"z4"}],"hint":"-sn means \"no port scan\". -f makes packets small so they are harder to match.","ex":"<p>-sn only checks which hosts are alive. -sV asks services for their versions and -O guesses the operating system from TCP/IP quirks - both are fingerprinting. -sX (Xmas) and -f (fragmentation) belong to evasive and timing tricks. -oG writes grep-friendly output.</p>","kw":["kw-sn","kw-sV","kw-O","kw-xmas","kw-evasion","kw-output"]},{"id":"M04","t":"log","th":"t1","pts":4,"title":"Reading an ACK scan result","sc":"<p>You ran an ACK scan against one DMZ host to learn how its firewall treats ports. The raw output is below.</p>","q":"<p>What does this output tell you about the firewall?</p>","rows":[{"t":"root@lab:~# nmap -sA 10[.]20[.]8[.]31","l":"b"},{"t":"PORT      STATE         SERVICE","l":"i"},{"t":"22/tcp    unfiltered    ssh","l":"g"},{"t":"80/tcp    unfiltered    http","l":"g"},{"t":"445/tcp   filtered      microsoft-ds","l":"e"},{"t":"3389/tcp  filtered      ms-wbt-server","l":"e"}],"sub":{"t":"qcm","ch":["The firewall lets ACK packets to 22 and 80 through, and silently drops those to 445 and 3389","The firewall answers every ACK probe with RST, so all four services are open and listening","The firewall drops every ACK packet it receives, so all four ports are protected by a deny rule","The firewall replies with RST only on the filtered ports, which proves that 445 and 3389 listen"],"a":0},"hint":"\"Unfiltered\" means the probe got a reply. \"Filtered\" means it got none.","ex":"<p>An ACK scan sends packets with the ACK flag. When a rule allows them, the host answers with RST and Nmap writes <b>unfiltered</b> - reachable, but open or closed stays unknown. When a firewall drops the probe, nothing comes back and Nmap writes <b>filtered</b>. So the rules allow 22 and 80 and block 445 and 3389. ACK scan results never say \"open\".</p>","kw":["kw-sA","kw-portstate"]},{"id":"M05","t":"term","th":"t2","pts":5,"title":"Build the version scan command","sc":"<p>Your task for tonight: probe <code>lab-web-01</code> with a SYN scan plus service version detection, and keep the human-readable result in a file called <code>scan.txt</code>.</p>","q":"<p>Type the nmap command that does all three things: SYN scan (-sS), version detection (-sV), and normal output saved with -oN scan.txt.</p>","help":"Use the <code>nmap</code> command family. Required flags: <code>-sS</code>, <code>-sV</code>, and <code>-oN scan.txt</code> for the output file. Target: <code>lab-web-01</code>. A leading <code>sudo</code> is accepted. Example output shape: <code>22/tcp open ssh OpenSSH 8.4</code>.","req":["nmap","-ss","-sv","-on\\s*scan\\.txt","lab-web-01"],"demo":"nmap -sS -sV -oN scan.txt lab-web-01","hint":"Order of the flags does not matter - the target host goes last.","ex":"<p><code>nmap -sS -sV -oN scan.txt lab-web-01</code> does everything: -sS for the half-open scan, -sV to ask each open port what software and version it runs, and -oN to write the classic text report. Without -sV you would only see \"22/tcp open ssh\" with no version.</p>","kw":["kw-sS","kw-sV","kw-output"]},{"id":"M06","t":"match","th":"t1","pts":4,"title":"Match the port states","sc":"<p>During the debrief a junior mixes up the four port states Nmap can report. You build this matching drill for the team wiki.</p>","q":"<p>Match each port state to what it actually means.</p>","pairs":[{"l":"open","r":"An application is accepting connections on this port"},{"l":"closed","r":"The host answered with RST; nothing listens here"},{"l":"filtered","r":"No reply at all; a device silently drops the probes"},{"l":"unfiltered","r":"The port is reachable, but the scan cannot tell open from closed"}],"hint":"Only \"unfiltered\" comes from an ACK scan. \"Filtered\" is silence.","ex":"<p>Open means SYN/ACK came back. Closed means the host itself sent RST. Filtered means silence - a firewall or ACL is dropping the probe. Unfiltered means the host answered an ACK probe with RST, so it is reachable but the scan type cannot decide open vs closed.</p>","kw":["kw-portstate","kw-sA","kw-sS"]},{"id":"M07","t":"fib","th":"t3","pts":6,"title":"Build a display filter","sc":"<p>You captured traffic on the office uplink and now need to show only HTTP GET requests that went from workstation <code>10[.]1[.]7[.]42</code> to port 8080.</p>","q":"<p>Complete the Wireshark display filter. Click a word, then click a gap.</p>","text":"http.request.method <b>[]</b> \"GET\" <b>[]</b> tcp.port <b>[]</b> 8080 <b>[]</b> ip.src == 10[.]1[.]7[.]42","slots":["==","and","==","and"],"bank":["==","==","and","and","or","not","!=","contains"],"hint":"Display filters use == for \"equals\" and plain English \"and\"/\"or\" to join conditions.","ex":"<p>Display filter syntax uses <code>==</code> to compare a field with a value and the words <code>and</code> / <code>or</code> to join conditions (the symbolic forms <code>&amp;&amp;</code> and <code>||</code> also work in display filters). The finished filter is: http.request.method == \"GET\" and tcp.port == 8080 and ip.src == 10[.]1[.]7[.]42. \"or\" would wrongly widen the search.</p>","kw":["kw-dfilter","kw-http"]},{"id":"M08","t":"branch","th":"t5","pts":6,"title":"SOC triage: a sudden port sweep","sc":"<p>Monday, 09:14. The SIEM raises one alert: a single internal source sent SYN packets to 250 different ports across 8 hosts in 40 seconds. You are the on-shift analyst.</p>","q":"<p>Work the triage step by step. One decision at a time.</p>","steps":[{"q":"The alert fires. What do you do first?","ch":[{"x":"Open the alert and confirm source and targets in the raw session logs","ok":true,"fb":"Right. Verify before acting - raw logs tell you the real pattern."},{"x":"Power off the source host immediately","ok":false,"fb":"Too fast: you might kill a business process on a hunch."},{"x":"Delete the alert as a false positive","ok":false,"fb":"Never delete before checking. The pattern fits a scan."}]},{"q":"Raw logs confirm the sweep. The source resolves to ap-sc-01 - the approved vulnerability scanner - and change ticket CHG-2291 covers a scan window now. Next?","ch":[{"x":"Correlate the timing with CHG-2291 and mark the alert as expected activity","ok":true,"fb":"Correct. Documented scanning is exactly what the ticket describes."},{"x":"Block the scanner IP at the firewall","ok":false,"fb":"That would break an approved business task."},{"x":"Escalate to incident response as a breach","ok":false,"fb":"No breach signs - the activity is scheduled and documented."}]},{"q":"Same host, ten minutes later: it now probes ports 6667 and a subnet that is NOT in the ticket scope. What now?","ch":[{"x":"Escalate: activity outside the approved scope needs human review","ok":true,"fb":"Correct. Scope creep from an approved tool is still unapproved activity."},{"x":"Ignore it - scanners sometimes test extra things","ok":false,"fb":"Ignoring scope violations hides real risk."},{"x":"Quietly add the new subnet to the ticket","ok":false,"fb":"Changing the ticket to cover an anomaly is falsifying records."}]}],"hint":"First verify, then correlate with change records, then judge anything outside the paperwork.","ex":"<p>Good triage order: verify in raw data, correlate with change tickets, and treat anything outside the approved scope as a new finding. A sweep of sequential ports is the classic fingerprint of a port scan, whether friendly or not.</p>","kw":["kw-sS","kw-scope","kw-footprint"]},{"id":"M09","t":"spot","th":"t1","pts":5,"title":"Spot the wrong claims in the scan plan","sc":"<p>A colleague wrote this scan plan for the production office subnet and asks you to review it before the change window.</p>","q":"<p>Click every <b>wrong</b> line. Some lines are true on purpose.</p>","lines":[{"x":"nmap -sT -T5 -p- 10[.]0[.]44[.]0/24","bad":false},{"x":"Plan: full TCP connect scan of all 65535 ports on the office subnet.","bad":false},{"x":"Note: -sT completes real connections, so host firewalls and EDR will log each one.","bad":false},{"x":"Note: -T5 keeps the scan quiet and slow, perfect for stealth.","bad":true},{"x":"We expect zero traces on the target side.","bad":true}],"hint":"One line lies about what -T5 does. Another claims something no connect scan can promise.","ex":"<p>-T5 is the <b>fastest</b> timing template - fast probes are loud, not stealthy. And a connect scan (-sT) finishes real TCP handshakes, so target-side logs and EDR records appear; \"zero traces\" is impossible. The command line itself and the two true notes are correct as written.</p>","kw":["kw-sT","kw-T","kw-portrange"]},{"id":"M10","t":"order","th":"t5","pts":6,"title":"Order the reconnaissance phases","sc":"<p>You are writing the methodology section of the test plan for the Meridian Logistics engagement.</p>","q":"<p>Put the six phases of a clean reconnaissance process in the right order.</p>","items":["Get written authorization and define the scope","Collect public data: WHOIS, DNS records, job ads","Discover live hosts with a ping sweep","Scan open ports on the live hosts","Fingerprint services and operating systems","Write findings and evidence into the report"],"hint":"Paperwork first, public data second, anything that touches the target much later.","ex":"<p>A professional flow always starts with authorization and scope, then passive OSINT, and only then packets: host discovery, port scan, fingerprinting, documentation last. Doing active steps before scope and paperwork is both rude and legally risky.</p>","kw":["kw-footprint","kw-scope","kw-passive","kw-osint","kw-sn","kw-sV"]},{"id":"M11","t":"multi","th":"t3","pts":7,"title":"Valid capture filters only","sc":"<p>You will run a packet capture on the sensor with tcpdump. A junior proposes several filter lines; some are display-filter syntax or made-up words that tcpdump would reject.</p>","q":"<p>Select <b>every line that is valid BPF capture-filter syntax</b> for tcpdump.</p>","ch":[{"x":"tcp port 443","ok":true},{"x":"udp port 53","ok":true},{"x":"arp","ok":true},{"x":"net 192[.]168[.]7[.]0/24","ok":true},{"x":"tcp.port == 443","ok":false},{"x":"port equals 80","ok":false},{"x":"host ip 10[.]0[.]0[.]9","ok":false}],"hint":"BPF speaks plain words: host, net, port, and protocol names. The dot notation with == belongs to Wireshark display filters.","ex":"<p>BPF capture filters use tokens like <code>tcp port 443</code>, <code>udp port 53</code>, <code>arp</code>, and <code>net A.B.C.D/nn</code>. <code>tcp.port == 443</code> is Wireshark <i>display</i> syntax, \"port equals 80\" is not a keyword pair, and <code>host ip ...</code> reverses the correct form. Capture filters run in the kernel; display filters run after capture.</p>","kw":["kw-bpf"]},{"id":"M12","t":"qcm","th":"t1","pts":4,"title":"Name that scan from packets","sc":"<p>The IPS shows this pattern from 198[.]51[.]100[.]7 toward one web server, repeated over 1,000 ports: <b>SYN &rarr; SYN/ACK &rarr; RST</b> (the third packet comes from the scanning side, and no ACK is ever sent).</p>","q":"<p>Which scan produced this pattern?</p>","ch":["A SYN (half-open) scan","A full connect scan (-sT)","A UDP service scan (-sU)","An ACK flag scan (-sA)"],"a":0,"hint":"Watch who sends the third packet and what it contains.","ex":"<p>SYN &rarr; SYN/ACK &rarr; RST-from-scanner is the exact signature of a half-open scan: the scanner quits with RST instead of finishing the handshake. A connect scan would end with ACK and a proper close. UDP scans show no such handshake, and an ACK scan sends ACK (not SYN) first.</p>","kw":["kw-sS","kw-handshake","kw-flags","kw-sA"]},{"id":"M13","t":"term","th":"t3","pts":5,"title":"Capture only ARP traffic","sc":"<p>You suspect ARP games on the lab network and want a clean evidence file.</p>","q":"<p>Type the tcpdump command that captures <b>only ARP packets</b> on interface <code>eth0</code> and writes them to <code>arp.pcap</code>.</p>","help":"Use <code>tcpdump</code>. Hints: <code>-i</code> selects the interface, <code>-w</code> writes a pcap file, and the protocol keyword for ARP is simply <code>arp</code>. A leading <code>sudo</code> is accepted. Expected output shape when reading the file later: <code>ARP, Request who-has 10[.]1[.]1[.]1, tell 10[.]1[.]1[.]24</code>.","req":["tcpdump","[\\s\"']arp(?![\\w.\\-])","-i\\s+eth0","-w\\s+arp\\.pcap"],"demo":"tcpdump -i eth0 arp -w arp.pcap","hint":"Three parts: interface, protocol, output file. Order does not matter.","ex":"<p><code>tcpdump -i eth0 arp -w arp.pcap</code> does exactly this: -i eth0 listens on eth0, the word arp is a BPF protocol filter, and -w writes raw packets to the file. ARP is the protocol that maps IP addresses to MAC addresses - perfect to watch for spoofing.</p>","kw":["kw-bpf","kw-arp"]},{"id":"M14","t":"dd","th":"t5","pts":7,"title":"Right tool for the job","sc":"<p>Team onboarding day. You explain which recon tool answers which question.</p>","q":"<p>Drag each tool onto the question it answers best.</p>","zones":[{"id":"z1","label":"Which hosts and ports are reachable?"},{"id":"z2","label":"What is inside each packet?"},{"id":"z3","label":"Who owns this domain?"},{"id":"z4","label":"What do DNS records say?"},{"id":"z5","label":"Which emails and subdomains are public?"},{"id":"z6","label":"What banner does a service show?"}],"items":[{"x":"Nmap","c":"z1"},{"x":"Wireshark","c":"z2"},{"x":"WHOIS","c":"z3"},{"x":"dig","c":"z4"},{"x":"an OSINT harvester","c":"z5"},{"x":"Netcat","c":"z6"}],"hint":"Two tools never send packets to the target themselves: one reads registries, one reads name servers.","ex":"<p>Nmap maps hosts and ports. Wireshark reads packet contents. WHOIS asks the registry who owns a domain. dig asks name servers for records. An OSINT harvester scrapes public pages for emails and subdomains. Netcat connects to a port and shows the raw service banner - the classic banner grab.</p>","kw":["kw-banner","kw-osint","kw-enum"]},{"id":"M15","t":"rank","th":"t2","pts":5,"title":"Rank the scan targets","sc":"<p>Your OSINT and internal survey found five candidate targets for the next scan block. Time is limited, so you must rank them by <b>how urgent they are to assess</b> (most urgent first).</p>","q":"<p>Rank the five targets from most to least urgent.</p>","items":["Internet-facing admin panel that responds with a default login page","Legacy database server in the DMZ, patch level unknown","File server reachable from the VPN range","Office printer with an open web UI on the guest LAN","Standard workstation with a fully patched, hardened image"],"hint":"Exposed management surfaces and unknown legacy systems come before end-user devices.","ex":"<p>Urgency follows exposure and uncertainty: an internet-facing admin panel is a door anyone can knock on; an unassessed legacy database is a high-impact unknown; the file server matters for lateral movement; the printer is low impact; a hardened workstation is the least interesting target for a recon pass.</p>","kw":["kw-footprint","kw-enum","kw-scope"]},{"id":"M16","t":"dual","th":"t4","pts":6,"title":"DNS that talks too much","sc":"<p>The DNS resolver log for one internal host, 10[.]1[.]9[.]31, shows 14 TXT queries in three minutes to names like <code>3f2a9c.tun.cdn-metrics[.]example</code>, each with long random-looking labels. Normal hosts make A/AAAA queries for real product domains.</p>","q":"<p>Answer both views on this traffic.</p>","subs":[{"t":"qcm","label":"SOC VIEW","q":"What is the most likely explanation for the TXT queries?","ch":["Data is being tunneled out through DNS TXT queries","A user is browsing a corporate CDN domain","The resolver has a caching problem with TXT records","NTP time sync traffic is misconfigured somewhere"],"a":0},{"t":"qcm","label":"ANALYST TOOLKIT VIEW","q":"Which Wireshark statistic would first make DNS stand out on this link?","ch":["Protocol Hierarchy - DNS takes an odd traffic share","Follow TCP Stream on one captured HTTP session","The WLAN signal and channel statistics panel","The frame number column of the capture"],"a":0}],"hint":"TXT records can carry arbitrary bytes. Which view sums up traffic per protocol?","ex":"<p>Long random labels inside TXT queries every few seconds are the classic shape of DNS tunneling: one side encodes data into queries, the other answers and decodes. Protocol Hierarchy shows how much of the traffic each protocol uses, so a strange DNS share is the first hint. Browsing and NTP would look completely different.</p>","kw":["kw-dns","kw-protohier"]},{"id":"M17","t":"fib","th":"t1","pts":6,"title":"Write the report sentence","sc":"<p>You are writing the findings section and must describe the probe results precisely.</p>","q":"<p>Fill the gaps so the report is technically correct. Click a word, then a gap.</p>","text":"A SYN to port 25 was answered with RST, so SMTP is <b>[]</b> on this host. Probes to port 587 never received any reply, so Nmap lists it as <b>[]</b>. Our earlier ACK-based sweep could not decide open or closed on any port because that scan type only reports <b>[]</b> results.","slots":["closed","filtered","unfiltered"],"bank":["closed","filtered","unfiltered","open","-sS","-sA","reachable"],"hint":"RST reply = one state. Silence = another. The ACK scan has its own special word.","ex":"<p>An RST answer means the port is <b>closed</b> - the host is alive but nothing listens. Silence means <b>filtered</b> - something drops the probe. An ACK scan can only report <b>unfiltered</b> (it reached the port) or filtered; it can never decide open vs closed, which is why it is used to map firewall rules.</p>","kw":["kw-portstate","kw-sA","kw-sS"]},{"id":"M18","t":"qcm","th":"t4","pts":4,"title":"Retransmissions with a story","sc":"<p>Wireshark Expert Information on the branch uplink shows: from 10[.]4[.]2[.]19 to 198[.]51[.]100[.]44 port 8530, three to six TCP <b>retransmissions</b> every 55-65 seconds, for the last six hours. The TTL of those packets is a constant 49. Nothing else between the two hosts misbehaves.</p>","q":"<p>Which interpretation fits best?</p>","ch":["A process keeps retrying a connection that something on the path refuses to finish","A video stream that the provider throttles every minute or so","A backup job retransmitting because the NAS disk is nearly full","A DNS server retrying zone transfers the firewall allows at night"],"a":0,"hint":"Steady, patient retries to one fixed port are not how people browse.","ex":"<p>Repetitive retransmissions to one fixed high port, spaced like clockwork, mean the sender keeps trying and the connection never completes - typical when an egress filter silently drops a command-and-control channel. A throttled stream, a busy NAS or a DNS server produce varied, human or job-shaped traffic instead; the constant TTL also says the path does not change.</p>","kw":["kw-retrans","kw-ttl"]},{"id":"M19","t":"match","th":"t3","pts":5,"title":"TCP flags at work","sc":"<p>New SOC hires keep mixing up the flags in the packet list. You prepare the reference card.</p>","q":"<p>Match each flag pattern to its role in a TCP conversation.</p>","pairs":[{"l":"SYN","r":"Opens a connection (step 1 of the handshake)"},{"l":"SYN, ACK","r":"Server accepts and answers (step 2)"},{"l":"ACK","r":"Confirms data or connection (step 3, and every data packet)"},{"l":"RST","r":"Kills the connection immediately"},{"l":"FIN","r":"Starts a clean, polite close"}],"hint":"Step 2 carries two flags at once. One flag is rude, one is polite.","ex":"<p>The handshake is SYN, then SYN/ACK, then ACK. RST aborts instantly - scanners see it from closed ports. FIN closes politely after both sides finish. Knowing these roles lets you read any packet list: who started, who refused, who walked away.</p>","kw":["kw-flags","kw-handshake"]},{"id":"M20","t":"multi","th":"t2","pts":7,"title":"Keep the results for later","sc":"<p>You must run one long scan and keep the results so other tools and colleagues can reuse them tonight.</p>","q":"<p>Select <b>every flag that saves scan output to a file</b>.</p>","ch":[{"x":"-oX report.xml","ok":true},{"x":"-oN scan.txt","ok":true},{"x":"-oG hosts.gnmap","ok":true},{"x":"-oA scans","ok":true},{"x":"-iL targets.txt","ok":false},{"x":"--datadir /usr/share/nmap","ok":false},{"x":"-v","ok":false}],"hint":"All output flags start with -o. -iL reads, it does not write.","ex":"<p>-oN (normal), -oX (XML), -oG (grepable) and -oA (all three at once with a basename) write files. -iL is an <i>input</i> list of targets, --datadir points at Nmap data files, and -v only raises verbosity on screen.</p>","kw":["kw-output"]},{"id":"M21","t":"spot","th":"t3","pts":4,"title":"One filter line is broken","sc":"<p>An analyst saved these Wireshark display-filter lines in the case notes. Four work fine in Wireshark; one would throw a syntax or field error.</p>","q":"<p>Click the <b>one broken</b> filter line.</p>","lines":[{"x":"http.request.method == \"POST\"","bad":false},{"x":"ip.addr == 192[.]0[.]2[.]15","bad":false},{"x":"http.request == \"GET\"","bad":true},{"x":"tcp.flags.syn == 1 && tcp.flags.ack == 0","bad":false},{"x":"frame contains \"login\"","bad":false}],"hint":"One line names a field that does not exist. The method lives in a longer field name.","ex":"<p><code>http.request</code> is only a true/false marker field - comparing it to the text \"GET\" fails a type check, so line 3 is broken. The request <i>method</i> text lives in <code>http.request.method</code>. The others are valid: ip.addr matches both source and destination, flag filters isolate handshake steps, and frame contains searches raw bytes.</p>","kw":["kw-dfilter","kw-flags","kw-http"]},{"id":"M22","t":"order","th":"t3","pts":6,"title":"Rebuild one web session","sc":"<p>You captured a user session to the intranet and want to present it to the class as a clean story of one TCP connection.</p>","q":"<p>Put the six captured moments in the order they happened.</p>","items":["Client sends SYN to the web server","Server answers SYN, ACK","Client sends ACK - the handshake is complete","Both sides exchange data packets with PSH, ACK (the HTTP GET and its answer)","Client sends FIN to close politely","Analyst uses Follow TCP Stream to read the whole conversation as text"],"hint":"Handshake first, data in the middle, close at the end - and one step is an analyst action, not a packet.","ex":"<p>Every clean TCP session follows the same shape: SYN, SYN/ACK, ACK, then data (data packets carry PSH/ACK), then FIN for a graceful close. Follow TCP Stream is the Wireshark view that reassembles those bytes into the actual HTTP request and response - perfect for reports.</p>","kw":["kw-handshake","kw-flags","kw-stream","kw-http"]},{"id":"M23","t":"dual","th":"t2","pts":6,"title":"Same scan, two hats","sc":"<p>A junior runs <code>nmap -sS -T4</code> against the lab range from the attack box. The IDS sees it. Tomorrow the same junior must run a quieter check - with written approval - and asks you how.</p>","q":"<p>Answer as the defender first, then as the (approved) attacker.</p>","subs":[{"t":"qcm","label":"BLUE TEAM VIEW","q":"What will the SOC most likely see in the alerts?","ch":["A burst of SYNs to many sequential ports with no completed handshakes","Full TCP connections logged by the web application tier","An ICMP echo flood across the whole address range","Repeated DNS zone transfer attempts against the DC"],"a":0},{"t":"multi","label":"RED TEAM VIEW","q":"Which TWO options hide who is really scanning? (pick two)","ch":[{"x":"-sI printer-04 - bounce an idle scan through the unmonitored print server","ok":true},{"x":"-D 10[.]1[.]9[.]4 10[.]1[.]9[.]5 - mix decoy sources into the sweep","ok":true},{"x":"-T5 - scan at maximum speed","ok":false},{"x":"-v - raise verbosity","ok":false},{"x":"--reason - show why Nmap decided a port state","ok":false}]}],"hint":"Blue: count handshakes, not connections. Red: one flag borrows a third host, another flag fakes extra sources.","ex":"<p>Blue sees thousands of SYNs to different ports with handshakes never finished - the half-open fingerprint. Red has two classic attribution killers: an idle scan (-sI) makes a quiet third host look like the scanner, and -D injects decoy sources so blocking becomes guesswork. Speed and verbosity only make scans louder.</p>","kw":["kw-sS","kw-idle","kw-decoy","kw-T"]},{"id":"M24","t":"qcm","th":"t4","pts":4,"title":"Two MACs, one IP","sc":"<p>Your capture at the access switch shows, within four seconds: <code>ARP reply 10[.]0[.]0[.]1 is-at aa:bb:cc:00:11:22</code>, then <code>ARP reply 10[.]0[.]0[.]1 is-at aa:bb:cc:99:88:77</code>, then the first one again. Clients start complaining about a slow network.</p>","q":"<p>What is the most likely explanation?</p>","ch":["ARP spoofing - one gateway IP is being claimed by two different MAC addresses","A DHCP server re-announcing an old lease to the whole VLAN","Two printers fighting over the same driver on the print server","A switch port flapping up and down under spanning-tree tuning"],"a":0,"hint":"The gateway IP should belong to exactly one MAC. Watch who keeps re-announcing it.","ex":"<p>Repeated ARP replies binding one IP to alternating MAC addresses is the fingerprint of ARP spoofing (poisoning): a host lies to neighbours to become the man-in-the-middle. DHCP renewals are broadcasts from a server with one MAC, and neither printers nor port flaps rewrite ARP caches.</p>","kw":["kw-arp"]},{"id":"M25","t":"dd","th":"t5","pts":6,"title":"Passive shelf or active kit","sc":"<p>Before the Meridian engagement you sort every planned technique into two boxes so the client knows exactly when packets start flowing.</p>","q":"<p>Drag each action to Passive or Active.</p>","zones":[{"id":"z1","label":"Passive - no packets to the target"},{"id":"z2","label":"Active - sends traffic to the target"}],"items":[{"x":"Read WHOIS for the client domain","c":"z1"},{"x":"Search public certificate logs for subdomains","c":"z1"},{"x":"Review job ads for tech-stack hints","c":"z1"},{"x":"Ping sweep the office subnet","c":"z2"},{"x":"Grab the banner of the FTP server","c":"z2"},{"x":"Send SYNs across the /24 to find web servers","c":"z2"}],"hint":"If it touches a client socket or cable, it is active. Registries and search engines are passive.","ex":"<p>Passive sources live outside the target: WHOIS, certificate logs, job ads. Active steps touch the target network: ping sweeps (ICMP), banner grabs (real TCP connection), SYN sweeps. The split matters for legal scope and for how noisy you are.</p>","kw":["kw-passive","kw-sn","kw-banner","kw-sS","kw-osint"]},{"id":"M26","t":"branch","th":"t5","pts":6,"title":"Scope pressure: the public wiki","sc":"<p>Day two of the approved Meridian test. While doing passive OSINT you find a PDF on the client wiki: a list of staff passwords, published by mistake. The wiki is in scope. The VPN is not.</p>","q":"<p>Handle the finding step by step.</p>","steps":[{"q":"The PDF is confirmed real. Your first action?","ch":[{"x":"Capture the URL, date and a screenshot as evidence, then notify the client contact","ok":true,"fb":"Correct - critical findings are documented and reported fast."},{"x":"Log into the mail server with one of the passwords right away","ok":false,"fb":"Mail access is not in the approved scope."},{"x":"Post it on the public bug tracker for visibility","ok":false,"fb":"Never publish client secrets without written consent."}]},{"q":"The client asks: \"just check if these work on the VPN too.\" VPN testing is NOT in your contract. What do you do?","ch":[{"x":"Stop and ask for written permission to extend the scope before any packet","ok":true,"fb":"Exactly - scope changes need signed paperwork, not a chat message."},{"x":"Continue anyway - the passwords were public","ok":false,"fb":"Public data does not expand your authorisation."},{"x":"Try them on the mail server instead, since that is \"basically the VPN\"","ok":false,"fb":"The mail server is also outside the written scope."}]},{"q":"The client sends a signed change order covering the VPN for two days. Now?","ch":[{"x":"Update the plan, save the approval with the evidence file, then test","ok":true,"fb":"Correct - new scope, new paperwork, then work."},{"x":"Scan from your home IP so the client cannot tie it to the engagement","ok":false,"fb":"Hiding your source from the client breaks trust and rules."},{"x":"Skip documenting - everyone already knows about the approval","ok":false,"fb":"Undocumented scope changes are invisible in audits."}]}],"hint":"Evidence first. Scope changes in writing. Paperwork travels with the work.","ex":"<p>Strong engagements share one pattern: evidence gets captured immediately, any scope change is agreed in writing before new packets flow, and every approval is archived. OSINT finds are still client data - handling them cleanly is part of the job.</p>","kw":["kw-scope","kw-osint","kw-passive"]},{"id":"M27","t":"fib","th":"t1","pts":6,"title":"Complete the mixed scan command","sc":"<p>You need one command for the server <code>lab-dns-01</code>: a SYN scan on TCP port 80 and a UDP scan on port 53, using the T:/U: port syntax.</p>","q":"<p>Fill the three gaps to complete the command. Click a word, then a gap.</p>","text":"nmap <b>[]</b> <b>[]</b> <b>[]</b> T:80,U:53 lab-dns-01","slots":["-sS","-sU","-p"],"bank":["-sS","-sU","-p","-sA","-O","-T5","-f"],"hint":"One flag per scan type; the ports come after the port-list switch.","ex":"<p>The finished command is <code>nmap -sS -sU -p T:80,U:53 lab-dns-01</code>. -sS is the half-open TCP scan, -sU sends UDP probes, and -p takes the port list where T: marks TCP and U: marks UDP. Without -p the UDP scan of 65k ports would take hours.</p>","kw":["kw-sS","kw-sU","kw-portrange"]},{"id":"M28","t":"dual","th":"t3","pts":6,"title":"Read the handshake, trust the sensor","sc":"<p>The capture below comes from the sensor plugged into the SPAN port of switch SW-3. It watches traffic between many hosts; this excerpt shows one workstation probing server 10[.]20[.]30[.]5:</p><div class=\"art\"><pre>12:04:01.113  IP 10[.]1[.]7[.]42.51203 > 10[.]20[.]30[.]5.80:   Flags [S]\n12:04:01.115  IP 10[.]20[.]30[.]5.80  > 10[.]1[.]7[.]42.51203: Flags [S.]\n12:04:01.116  IP 10[.]1[.]7[.]42.51203 > 10[.]20[.]30[.]5.80:   Flags [.], ack 1\n12:04:01.220  IP 10[.]1[.]7[.]42.51204 > 10[.]20[.]30[.]5.445:  Flags [S]\n12:04:01.221  IP 10[.]20[.]30[.]5.445 > 10[.]1[.]7[.]42.51204:  Flags [R.]\n12:04:01.310  IP 10[.]1[.]7[.]42.51205 > 10[.]20[.]30[.]5.3389: Flags [S]\n              (no reply to port 3389 probe within 60 seconds)</pre></div>","q":"<p>Answer both questions about this capture.</p>","subs":[{"t":"qcm","label":"PACKET VIEW","q":"From the packet list, which conclusion set is right?","ch":["80 open, 445 closed, 3389 filtered","80 closed, 445 open, 3389 open","All three ports are filtered","80 open, 445 filtered, 3389 closed"],"a":0},{"t":"qcm","label":"SENSOR VIEW","q":"Why does the sensor see traffic between two other hosts at all?","ch":["Its NIC runs in promiscuous mode on a SPAN (mirror) port that copies switch traffic","The switch vendor gave the sensor a special management access level","Every host on the LAN broadcasts copies of all its traffic by default","The sensor answers as a gateway and pulls the traffic to itself"],"a":0}],"hint":"SYN/ACK = open, RST/ACK = closed, silence = filtered. A SPAN port copies frames that are not addressed to you.","ex":"<p>Port 80 answered SYN/ACK (open). Port 445 answered RST/ACK (closed - alive host, no listener). Port 3389 got no reply at all (filtered). The sensor sees other hosts business because the SPAN port mirrors frames to it and the NIC reads every frame - normal mode would drop frames with foreign MACs.</p>","kw":["kw-handshake","kw-portstate","kw-promisc"]},{"id":"M29","t":"qcm","th":"t4","pts":4,"title":"Decode the ping reply","sc":"<p>Your pre-sweep shows: <code>ping 10[.]20[.]30[.]60</code> answers <code>From 10[.]1[.]1[.]1: icmp_seq=1 Destination Net Unreachable</code>. The reply comes from your gateway, not from the target.</p>","q":"<p>What does this reply actually tell you?</p>","ch":["A router on the path says the target network cannot be reached","The web service on the target refused the ping","The target host itself answered the ping request","The packet TTL hit zero somewhere along the way"],"a":0,"hint":"Look at who sent the reply. Type 3 code 0 is a network message.","ex":"<p>\"Destination Net Unreachable\" is ICMP type 3 code 0, sent by a router (here the gateway 10[.]1[.]1[.]1): it has no route to that network. The target itself never answered. TTL expiry would be type 11 \"Time Exceeded\", and a closed port has nothing to do with ping.</p>","kw":["kw-icmp","kw-sn"]},{"id":"M30","t":"multi","th":"t2","pts":7,"title":"Real NSE categories only","sc":"<p>You write the NSE section of the runbook and must only list categories that Nmap actually ships.</p>","q":"<p>Select <b>every real NSE script category</b>.</p>","ch":[{"x":"default","ok":true},{"x":"safe","ok":true},{"x":"vuln","ok":true},{"x":"discovery","ok":true},{"x":"intrusive","ok":true},{"x":"aggressive","ok":false},{"x":"stealth","ok":false},{"x":"recon","ok":false}],"hint":"Five are real. \"Stealth\" and \"recon\" sound nice but no script wears them.","ex":"<p>Real NSE categories include default, safe, vuln, discovery, intrusive (plus auth, broadcast, dos, external, fuzzer, malware, version). \"aggressive\", \"stealth\" and \"recon\" are not categories - --script=aggressive simply matches nothing. Categories also warn you about risk: intrusive scripts may crash fragile services.</p>","kw":["kw-nse"]}],"severity":"medium"}
</script>
<script>
'use strict';
/* ===== Engine state & utils ===== */
var M = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var BLOB = JSON.parse(document.getElementById('exdata-json').textContent);
var THEMES = BLOB.themes, KWS = BLOB.kws, EX = BLOB.ex, SEV = BLOB.severity;
var S = null;
function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtT(sec){ sec=Math.max(0,Math.floor(sec)); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function r2(n){ return Math.round(n*100)/100; }
function newState(){
  return {
    order: shuffle(EX.map(function(_,i){return i;})),
    pos: 0, ans:{}, lay:{}, res:{}, checked:{}, skipped:{}, hint:{},
    timeLeft:(M.estimatedMinutes||60)*60,
    pMan:false, pChk:false, reported:false, started:false, finished:false, user:'', earnedMap:{}, touched:{}
  };
}
function cur(){ return S ? S.order[S.pos] : -1; }
function curEx(){ return EX[cur()]; }
function isPause(){ return S && (S.pMan || S.pChk); }

/* ===== Timer ===== */
setInterval(function(){
  if(!S || !S.started || S.finished) return;
  if(S.pMan || S.pChk) return;
  S.timeLeft -= 1;
  if(S.timeLeft <= 0){ S.timeLeft = 0; updChrome(); finish(true); return; }
  updTimer();
},1000);
function updTimer(){
  var t=$('#timer'); if(!t) return;
  t.textContent=fmtT(S.timeLeft);
  t.classList.toggle('low', S.timeLeft<600 && S.timeLeft>0);
}
function updIndicators(){
  var box=$('#indicators'), out=[];
  if(S.pMan) out.push('<span class="pill man">&#9208; Paused (manual)</span>');
  if(S.pChk) out.push('<span class="pill chk">&#9203; Timer paused &mdash; review mode</span>');
  box.innerHTML=out.join('');
  box.classList.toggle('on', out.length>0);
  var pb=$('#pausebtn');
  pb.setAttribute('aria-pressed', S.pMan?'true':'false');
  pb.innerHTML = S.pMan ? '&#9654; Resume' : '&#9208; Pause';
}

/* ===== Live score & progress ===== */
function earnedSum(){
  var e=0; for(var k in S.earnedMap){ if(isCounted(k)) e+=S.earnedMap[k]; } return r2(e);
}
function isCounted(i){ return !S.skipped[i] && (S.checked[i] || S.touched[i]); }
function nonSkippedPts(){
  var p=0; for(var i=0;i<S.order.length;i++){ var ei=S.order[i]; if(isCounted(ei)) p+=EX[ei].pts; } return r2(p);
}
function notCountedIdx(){
  var out=[]; for(var p=0;p<S.order.length;p++){ var ei=S.order[p]; if(!isCounted(ei)) out.push({pos:p, ei:ei}); } return out;
}
function updScore(){
  var tot=nonSkippedPts();
  $('#scorebox').innerHTML='Score <b>'+fmtPts(earnedSum())+'</b> / '+fmtPts(tot)+' pt';
  var answered=0;
  for(var i=0;i<S.order.length;i++){ var ei=S.order[i]; if(S.checked[ei]||S.skipped[ei]||S.touched[ei]) answered++; }
  $('#barfill').style.width=(answered/EX.length*100)+'%';
  var th={};
  for(var j=0;j<S.order.length;j++){
    var e2=EX[S.order[j]];
    if(S.checked[S.order[j]]||S.skipped[S.order[j]]) th[e2.th]=(th[e2.th]||0)+1;
  }
  var chips='';
  for(var key in THEMES){ chips+='<span class="thchip">'+esc(THEMES[key])+' '+ (th[key]||0) +'/'+ themeCount(key) +'</span>'; }
  $('#thchips').innerHTML=chips;
}
function themeCount(t){ var n=0; for(var i=0;i<EX.length;i++){ if(EX[i].th===t) n++; } return n; }
function fmtPts(n){ var v=Math.round(n*100)/100; var s=(Math.round(v*100)/100); return (s%1===0)?String(s):String(parseFloat(s.toFixed(2))); }

/* ===== Navigator ===== */
function updNav(){
  var g=$('#navgrid'), h='';
  for(var p=0;p<S.order.length;p++){
    var ei=S.order[p], cls='nbtn', lbl='Exercise '+(p+1), gst='';
    if(S.skipped[ei]){ cls+=' skip'; gst='<span class="gst" aria-hidden="true">\u2934</span>'; lbl+=' (skipped, not counted unless finished)'; }
    else if(S.res[ei]){
      var st=labelOf(S.res[ei]);
      if(st==='full'){ cls+=' done'; gst='<span class="gst" aria-hidden="true">\u2713</span>'; lbl+=' (full points)'; }
      else if(st==='zero'){ cls+=' zero'; gst='<span class="gst" aria-hidden="true">\u2717</span>'; lbl+=' (zero points)'; }
      else { cls+=' part'; gst='<span class="gst" aria-hidden="true">\u26A0</span>'; lbl+=' (partial points)'; }
    } else if(S.checked[ei]){ cls+=' ansd'; lbl+=' (answered)'; }
    if(p===S.pos){ cls+=' cur'; lbl+=' (current)'; }
    h+='<button type="button" class="'+cls+'" data-act="jump" data-p="'+p+'" aria-label="'+esc(lbl)+'" title="'+esc(lbl)+'">'+(p+1)+gst+'</button>';
  }
  g.innerHTML=h;
}
function labelOf(res){
  if(res.earned>=res.max-0.001) return 'full';
  if(res.earned<=0.001) return 'zero';
  return 'partial';
}

/* ===== Chrome update ===== */
function updChrome(){
  if(!S) return;
  updTimer(); updIndicators(); updScore(); updNav();
  var w=$('#exwrap');
  if(w){ w.classList.toggle('veiled', S.pMan); w.setAttribute('aria-hidden', S.pMan?'true':'false'); }
}

/* ===== Navigation ===== */
function gotoPos(p){
  if(p<0||p>=S.order.length) return false;
  S.pos=p;
  if(S.pChk) S.pChk=false; /* leaving the reviewed exercise ends its Check-pause; only re-Checking re-applies it */
  renderEx(); updChrome();
  var app=$('#screen'); if(app) app.scrollIntoView({block:'start'});
  return true;
}
function onNext(){
  if(!S||S.finished) return;
  S.pChk=false;
  if(S.pos < S.order.length-1){ gotoPos(S.pos+1); }
  else { openModal('End of exam','You reached the last exercise. Submit now, or go back with Prev to finish skipped exercises.','Submit exam'); }
  updChrome();
}
function onPrev(){
  if(!S||S.finished) return;
  if(S.pos>0) gotoPos(S.pos-1);
}
function onJump(p){ if(!S||S.finished) return; gotoPos(p); }

/* ===== Layout & answer init ===== */
function initLay(i,e){
  var L={};
  if(e.t==='qcm'||e.t==='multi') L.ord=shuffle(e.ch.map(function(_,k){return k;}));
  else if(e.t==='dd') L.ord=shuffle(e.items.map(function(_,k){return k;}));
  else if(e.t==='order'||e.t==='rank') L.ord=shuffle(e.items.map(function(_,k){return k;}));
  else if(e.t==='match') L.rord=shuffle(e.pairs.map(function(_,k){return k;}));
  else if(e.t==='fib') L.bord=shuffle(e.bank.map(function(_,k){return k;}));
  else if(e.t==='log') L.ord=shuffle(e.sub.ch.map(function(_,k){return k;})), L.filter='';
  else if(e.t==='branch') L.sord=e.steps.map(function(st){return shuffle(st.ch.map(function(_,k){return k;}));});
  else if(e.t==='dual') L.sord=e.subs.map(function(sb){return shuffle(sb.ch.map(function(_,k){return k;}));});
  S.lay[i]=L;
}
function initAns(i,e){
  var a=null;
  if(e.t==='qcm') a=null;
  else if(e.t==='multi') a=[];
  else if(e.t==='dd') a={};
  else if(e.t==='order'||e.t==='rank') a=shuffle(e.items.map(function(_,k){return k;}));
  else if(e.t==='match') a=e.pairs.map(function(){return -1;});
  else if(e.t==='fib') a=e.slots.map(function(){return -1;});
  else if(e.t==='term') a='';
  else if(e.t==='log') a=(e.sub.t==='multi')?[]:null;
  else if(e.t==='branch') a={step:0,picks:[]};
  else if(e.t==='spot') a=[];
  else if(e.t==='dual') a=e.subs.map(function(sb){return sb.t==='multi'?[]:null;});
  S.ans[i]=a;
}
var TYPELABEL={qcm:'CHOOSE ONE',multi:'SELECT ALL THAT APPLY',dd:'DRAG EACH ITEM INTO ITS ZONE &mdash; or click an item, then click a zone',order:'PUT THE STEPS IN ORDER &mdash; use the arrows or drag rows',match:'MATCH EACH ITEM &mdash; pick the right partner for every row',fib:'FILL THE GAPS &mdash; click a word, then click a gap; click a filled gap to empty it',term:'TYPE THE COMMAND &mdash; then press Check',log:'READ THE LOG, THEN ANSWER BELOW',branch:'WORK THE SCENARIO &mdash; one decision at a time',spot:'FLAG THE MISTAKE(S) &mdash; click every line that is wrong',rank:'RANK FROM MOST TO LEAST URGENT &mdash; use the arrows or drag rows',dual:'TWO PERSPECTIVES &mdash; answer both views'};

/* ===== Exercise screen ===== */
function renderEx(){
  var i=cur(), e=EX[i];
  if(!S.lay[i]) initLay(i,e);
  if(S.ans[i]===undefined) initAns(i,e);
  var fb=feedbackHtml(i,e);
  var h='<div id="exwrap" class="veilwrap"><div class="veilmsg" aria-hidden="true"><div>&#9208; Paused (manual) &mdash; content hidden. Press Resume to continue.</div></div>'
    +'<div id="exbody">'
    +'<div class="panel scen"><span class="tag vio">SCENARIO</span><div style="margin-top:6px">'+e.sc+'</div></div>'
    +'<div class="panel qblk"><span class="tag">QUESTION</span><div style="margin-top:6px">'+e.q+'</div></div>'
    +'<div class="panel ansblk"><span class="tag grn">ANSWERS</span> <span class="mono" style="font-size:13px;color:var(--dim)">Q'+(S.pos+1)+'/'+EX.length+' &middot; '+esc(THEMES[e.th])+' &middot; '+e.pts+' pt &middot; '+TYPELABEL[e.t]+'</span>'

function subHtml(i,e,prefix,si){
  var sb=(e.t==='log')?e.sub:e.subs[si];

  var ord=(e.t==='log')?S.lay[i].ord:S.lay[i].sord[si];
  for(var d2=0;d2<ord.length;d2++){
    var o=ord[d2], c=sb.ch[o], sel=(sb.t==='multi')?(a.indexOf(o)>-1):(a===o), k=prefix+'c'+o;
    h+='<label class="choice'+(sel?' sel':'')+(res?markCls(res,k):'')+'"><input type="'+typ+'" name="'+nm+'" value="'+o+'" data-el="'+k+'" data-sub="'+(si===undefined?'':si)+'"'+(sel?' checked':'')+(res?' disabled':'')+'><span>'+c+'</span>'+(res?markSt(res,k):'')+'</label>';
  }
  return h;
}
function markCls(res,k){
  for(var q=0;q<res.els.length;q++){ if(res.els[q].k===k) return ' '+res.els[q].st; } return '';
}
function markSt(res,k){
  for(var q=0;q<res.els.length;q++){ if(res.els[q].k===k) return '<span class="st">'+(res.els[q].st==='ok'?'&#10003;':res.els[q].st==='bad'?'&#10007;':'&#9888;')+'</span>'; } return '';
}
function rowHtml(i,e){
  var f=(S.lay[i].filter||'').toLowerCase(), out='', n=0;
  for(var r=0;r<e.rows.length;r++){
    var ln=e.rows[r];
    if(f && ln.t.toLowerCase().indexOf(f)<0) continue;
    n++;
    var lv=ln.l||'i';
    out+='<span class="lg lv-'+lv+'">'+esc(ln.t)+'</span>';
  }
  return {html:out, n:n, tot:e.rows.length};
}

/* ===== Evaluators ===== */
function evalEx(i,e){
  var a=S.ans[i], els=[], earned=0, max=e.pts, mult=S.hint[i]?0.9:1;
  function fin(frac){ return r2(max*frac*mult); }
  if(e.t==='qcm'){
    var ok=(a===e.a);
    els.push({k:'c'+e.a, st: ok?'ok':'miss'});
    if(a!==null&&a!==e.a) els.push({k:'c'+a, st:'bad'});
    return {els:els, earned: ok?fin(1):0, max:max};
  }
  if(e.t==='multi'){
    var okIdx=e.ch.map(function(c,k){return c.ok?k:-1;}).filter(function(k){return k>-1;});
    var hit=0;
    okIdx.forEach(function(o){ if(a.indexOf(o)>-1){els.push({k:'c'+o,st:'ok'});hit++;} else els.push({k:'c'+o,st:'miss'}); });
    a.forEach(function(o){ if(!e.ch[o].ok) els.push({k:'c'+o,st:'bad'}); });
    return {els:els, earned: fin(hit/okIdx.length), max:max};
  }
  if(e.t==='dd'){
    var hit2=0;
    e.items.forEach(function(it,o){ var z=a[o]; if(z===it.c){els.push({k:'i'+o,st:'ok'});hit2++;} else if(z===undefined||z===null){els.push({k:'i'+o,st:'miss'});} else els.push({k:'i'+o,st:'bad'}); });
    return {els:els, earned: fin(hit2/e.items.length), max:max};
  }
  if(e.t==='order'||e.t==='rank'){
    var hit3=0;
    a.forEach(function(o,p){ els.push({k:'o'+o, st:(o===p)?'ok':'bad'}); if(o===p) hit3++; });
    return {els:els, earned: fin(hit3/e.items.length), max:max};
  }
  if(e.t==='match'){
    var hit4=0;
    e.pairs.forEach(function(p,l){ if(a[l]===l){els.push({k:'m'+l,st:'ok'});hit4++;} else if(a[l]<0){els.push({k:'m'+l,st:'miss'});} else els.push({k:'m'+l,st:'bad'}); });
    return {els:els, earned: fin(hit4/e.pairs.length), max:max};
  }
  if(e.t==='fib'){
    var hit5=0;
    e.slots.forEach(function(sv,s){ if(a[s]>=0 && e.bank[a[s]]===sv){els.push({k:'s'+s,st:'ok'});hit5++;} else if(a[s]<0){els.push({k:'s'+s,st:'miss'});} else els.push({k:'s'+s,st:'bad'}); });
    return {els:els, earned: fin(hit5/e.slots.length), max:max};
  }
  if(e.t==='term'){
    var cmd=norm(a||''), ok2=e.req.every(function(rx){ return new RegExp(rx,'i').test(cmd); });
    els.push({k:'cmd', st: ok2?'ok':'bad'});
    return {els:els, earned: ok2?fin(1):0, max:max};
  }
  if(e.t==='log'){ return evalSub(e.sub, a, 's', max, mult, els); }
  if(e.t==='branch'){
    var hit6=0;
    e.steps.forEach(function(st,s){ var p=a.picks[s];
      if(p===undefined){els.push({k:'b'+s,st:'miss'});}
      else if(st.ch[p].ok){els.push({k:'b'+s,st:'ok'});hit6++;}
      else els.push({k:'b'+s,st:'bad'});
    });
    return {els:els, earned: fin(hit6/e.steps.length), max:max};
  }
  if(e.t==='spot'){
    var bad=e.lines.map(function(l,k){return l.bad?k:-1;}).filter(function(k){return k>-1;});
    if(bad.length===1){
      var ok3=(a.length===1&&a[0]===bad[0]);
      els.push({k:'l'+bad[0], st: ok3?'ok':'miss'});
      a.forEach(function(l){ if(l!==bad[0]) els.push({k:'l'+l,st:'bad'}); });
      return {els:els, earned: ok3?fin(1):0, max:max};
    }
    var hit7=0;
    bad.forEach(function(l){ if(a.indexOf(l)>-1){els.push({k:'l'+l,st:'ok'});hit7++;} else els.push({k:'l'+l,st:'miss'}); });
    a.forEach(function(l){ if(bad.indexOf(l)<0) els.push({k:'l'+l,st:'bad'}); });
    return {els:els, earned: fin(hit7/bad.length), max:max};
  }
  if(e.t==='dual'){
    var totE=0, gotE=0;
    e.subs.forEach(function(sb,si){
      var tmp=[];
      var sub=evalSub(sb, a[si], 'd'+si+'c', 1, 1, tmp);
      var n=sb.t==='multi'?sb.ch.filter(function(c){return c.ok;}).length:1;
      totE+=n; gotE+=sub.earned*n;
      tmp.forEach(function(el){ els.push(el); });
    });
    return {els:els, earned: fin(totE? gotE/totE : 0), max:max};
  }
  return {els:els, earned:0, max:max};
}
function evalSub(sb, a, prefix, max, mult, els){
  function fin(f){ return r2(max*f*mult); }
  if(sb.t==='qcm'){
    var ok=(a===sb.a);
    els.push({k:prefix+sb.a, st: ok?'ok':'miss'});
    if(a!==null&&a!==undefined&&a!==sb.a) els.push({k:prefix+a, st:'bad'});
    return {els:els, earned: ok?fin(1):0, max:max};
  }
  var okIdx=sb.ch.map(function(c,k){return c.ok?k:-1;}).filter(function(k){return k>-1;});
  var hit=0;
  okIdx.forEach(function(o){ if(a.indexOf(o)>-1){els.push({k:prefix+o,st:'ok'});hit++;} else els.push({k:prefix+o,st:'miss'}); });
  a.forEach(function(o){ if(!sb.ch[o].ok) els.push({k:prefix+o,st:'bad'}); });
  return {els:els, earned: fin(hit/okIdx.length), max:max};
}
function norm(c){ return String(c).toLowerCase().replace(/\s+/g,' ').replace(/^[\s\$]+/,'').trim(); }

/* ===== Actions ===== */
var PENDING=null; /* holds {kind:'bcheck'} while the branch-check confirmation modal is open */
function doCheck(force){
  var i=cur(), e=EX[i];
  if(S.res[i]){ S.pChk=true; updChrome(); return; }
  if(e.t==='branch' && !force && S.ans[i].picks.filter(function(x){return x!==undefined;}).length<e.steps.length){
    PENDING={kind:'bcheck'};
    openModal('Finish the scenario?','Not every step is done. Check now anyway? Any step without a decision scores zero.','Check now');
    return;
  }
  if(e.t==='qcm'&&S.ans[i]===null){ flash('Choose an answer first, or press Skip.'); return; }
  if(e.t==='multi'&&S.ans[i].length===0){ flash('Select at least one option, or press Skip.'); return; }
  if(e.t==='term'&&!S.ans[i]){ flash('Type a command first, or press Skip.'); return; }
  if(e.t==='log'){ var se=(e.sub.t==='multi')?(S.ans[i].length===0):(S.ans[i]===null||S.ans[i]===undefined); if(se){ flash('Pick an answer under the log first, or press Skip.'); return; } }
  if(e.t==='dual'){ var any=false; e.subs.forEach(function(sb,si){ var sv=S.ans[i][si]; if(sb.t==='multi'?sv.length>0:(sv!==null&&sv!==undefined)) any=true; }); if(!any){ flash('Answer at least one of the two views first, or press Skip.'); return; } }
  if(e.t==='spot'&&S.ans[i].length===0){ flash('Flag at least one line first, or press Skip.'); return; }
  var r=evalEx(i,e);
  r.hintUsed=!!S.hint[i];
  S.res[i]=r; S.checked[i]=true; S.skipped[i]=false;
  S.earnedMap=S.earnedMap||{}; S.earnedMap[i]=r.earned;
  S.pChk=true;
  renderEx();
}
function doRevise(){
  var i=cur();
  if(!S.res[i]) return;
  delete S.res[i]; S.checked[i]=false;
  S.earnedMap=S.earnedMap||{}; S.earnedMap[i]=0;
  /* Check-pause intentionally survives Revise: only Next resumes the timer (spec) */
  renderEx();
}
function doSkip(){
  var i=cur();
  if(S.res[i]){
    if(S.pos<S.order.length-1){ gotoPos(S.pos+1); }
    else openModal('End of exam','You reached the last exercise. Submit now, or go back with Prev to finish skipped exercises.','Submit exam');
    flash('Already checked \u2014 this exercise stays counted. Use Revise to change your answer.');
    return;
  }
  S.skipped[i]=true;
  if(S.pos<S.order.length-1){ S.pChk=false; gotoPos(S.pos+1); }
  else openModal('End of exam','You reached the last exercise. Submit now, or go back with Prev to finish skipped exercises.','Submit exam');
}
function doHint(){
  var i=cur();
  if(S.hint[i]){ flash('Hint already used on this exercise.'); return; }
  S.hint[i]=true; renderEx();
}
function flash(msg){
  var old=$('#flashbx'); if(old) old.remove();
  var b=document.createElement('div'); b.className='warnbx'; b.id='flashbx'; b.setAttribute('role','alert'); b.textContent=msg;
  var btns=$('#exbtns'); if(btns) btns.parentNode.insertBefore(b, btns.nextSibling); 
}
function doPause(){
  if(!S||S.finished) return;
  S.pMan=!S.pMan; updChrome();
}

/* ===== DnD binding ===== */
function bindDnD(i,e){
  var root=$('#ansarea'); if(!root) return;
  $all('.chip',root).forEach(function(ch){
    ch.addEventListener('dragstart',function(ev){ try{ev.dataTransfer.setData('text/plain',ch.getAttribute('data-i'));}catch(x){} ch.classList.add('dragging'); });
    ch.addEventListener('dragend',function(){ ch.classList.remove('dragging'); });
  });
  $all('.zone',root).forEach(function(zn){
    zn.addEventListener('dragover',function(ev){ ev.preventDefault(); zn.classList.add('over'); });
    zn.addEventListener('dragleave',function(){ zn.classList.remove('over'); });
    zn.addEventListener('drop',function(ev){ ev.preventDefault(); zn.classList.remove('over');
      if(S.res[i]) return;
      var o=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(o)) return;
      S.ans[i][o]=zn.getAttribute('data-zone'); S.sel=null; renderEx();
    });
  });
  var pool=$('[data-pool="1"]',root);
  if(pool){
    pool.addEventListener('dragover',function(ev){ ev.preventDefault(); });
    pool.addEventListener('drop',function(ev){ ev.preventDefault();
      if(S.res[i]) return;
      var o=parseInt(ev.dataTransfer.getData('text/plain'),10); if(isNaN(o)) return;
      delete S.ans[i][o]; S.sel=null; renderEx();
    });
  }
  $all('.rowit[draggable="true"]',root).forEach(function(rw){
    rw.addEventListener('dragover',function(ev){ ev.preventDefault();
      if(S.res[i]) return;
      var from=parseInt(rw.getAttribute('data-row'),10);
      var drag=getDragRow(); if(drag===null||drag===from) return;
      var arr=S.ans[i], it=arr.splice(drag,1)[0]; arr.splice(from,0,it); S.dragPos=from; renderEx();
    });
  });
}
function getDragRow(){ return (S&&S.dragPos!==undefined)?S.dragPos:null; }

/* ===== Event delegation ===== */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');
  if(!t){
    var zi=cur();
    var zn2=ev.target.closest?ev.target.closest('.zone'):null;
    if(S&&!S.finished&&!S.pMan&&zi>-1&&!S.res[zi]&&EX[zi].t==='dd'&&zn2&&S.sel!==null&&S.sel!==undefined){
      S.touched[zi]=true;
      S.ans[zi][S.sel]=zn2.getAttribute('data-zone'); S.sel=null; renderEx();
    }
    return;
  }
  var act=t.getAttribute('data-act');
  var i=cur(), e=(i>-1)?EX[i]:null;
  if(act==='jump'){ onJump(parseInt(t.getAttribute('data-p'),10)); return; }
  if(act==='start'){ startExam(); return; }
  if(!S||S.finished){ if(act==='retake'){retake();} else if(act==='dosubmit'){closeModal(); finish(false);} else if(act==='mclose'){closeModal();} return; }
  if(act==='pause'){ doPause(); return; }
  if(act==='asksubmit'){ askSubmit(); return; }
  if(act==='mclose'){ PENDING=null; closeModal(); return; }
  if(act==='dosubmit'){
    var pend=PENDING; PENDING=null; closeModal();
    if(pend&&pend.kind==='bcheck'){ doCheck(true); } else { finish(false); }
    return;
  }
  if(S.pMan&&act!=='pause'){ return; }
  if(act==='check'){ doCheck(); return; }
  if(act==='revise'){ doRevise(); return; }
  if(act==='skip'){ doSkip(); return; }
  if(act==='hint'){ doHint(); return; }
  if(act==='prev'){ onPrev(); return; }
  if(act==='next'){ onNext(); return; }
  if(!e||S.res[i]){ return; }
  if(act==='chip'){
    var o=parseInt(t.getAttribute('data-i'),10);
    S.touched[i]=true;
    if(S.ans[i][o]){ delete S.ans[i][o]; S.sel=null; }
    else { S.sel=(S.sel===o?null:o); }
    renderEx(); return;
  }
  if(act==='up'||act==='down'){
    var p=parseInt(t.getAttribute('data-p'),10), arr=S.ans[i], q=(act==='up')?p-1:p+1;
    if(q<0||q>=arr.length) return;
    S.touched[i]=true;
    var tmp=arr[p]; arr[p]=arr[q]; arr[q]=tmp; renderEx(); return;
  }
  if(act==='bank'){
    var b=parseInt(t.getAttribute('data-b'),10);
    S.touched[i]=true;
    S.sel=(S.sel===b?null:b); renderEx(); return;
  }
  if(act==='slot'){
    var s2=parseInt(t.getAttribute('data-s'),10), cur2=S.ans[i][s2];
    S.touched[i]=true;
    if(S.sel!==null&&S.sel!==undefined){
      var usedAt=S.ans[i].indexOf(S.sel); if(usedAt>-1) S.ans[i][usedAt]=-1;
      S.ans[i][s2]=S.sel; S.sel=null;
    }
    else if(cur2>=0){ S.ans[i][s2]=-1; }
    renderEx(); return;
  }
  if(act==='bpick'){
    var st=parseInt(t.getAttribute('data-s'),10), c=parseInt(t.getAttribute('data-c'),10);
    if(S.ans[i].picks[st]!==undefined) return;
    S.touched[i]=true;
    S.ans[i].picks[st]=c; renderEx(); return;
  }
  if(act==='bcont'){
    S.ans[i].step=Math.min(S.ans[i].step+1, e.steps.length-1);
    if(S.ans[i].picks[S.ans[i].step]!==undefined) S.ans[i].step=Math.min(S.ans[i].step+1,e.steps.length-1);
    renderEx(); return;
  }
  if(act==='spot'){
    var l=parseInt(t.getAttribute('data-l'),10), arr2=S.ans[i];
    S.touched[i]=true;
    var ix=arr2.indexOf(l); if(ix>-1) arr2.splice(ix,1); else arr2.push(l);
    renderEx(); return;
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target; if(!t.matches('input[type="radio"],input[type="checkbox"],select.matchsel')) return;
  if(!S||S.finished) return;
  var i=cur(), e=EX[i]; if(!e||S.res[i]) return;
  if(t.matches('select.matchsel')){
    S.touched[i]=true;
    S.ans[i][parseInt(t.getAttribute('data-l'),10)]=parseInt(t.value,10); renderEx(); return;
  }
  var o=parseInt(t.value,10);
  var sub=t.getAttribute('data-sub');
  if(t.closest('#ansarea')&&t.name.indexOf('sub')===0){
    S.touched[i]=true;
    if(e.t==='log'){ 
      if(e.sub.t==='multi'){ var arr=S.ans[i], ix=arr.indexOf(o); if(t.checked&&ix<0)arr.push(o); if(!t.checked&&ix>-1)arr.splice(ix,1); }
      else S.ans[i]=o;
    } else {
      var si=parseInt(sub,10);
      if(e.subs[si].t==='multi'){ var arr2=S.ans[i][si], ix2=arr2.indexOf(o); if(t.checked&&ix2<0)arr2.push(o); if(!t.checked&&ix2>-1)arr2.splice(ix2,1); }
      else S.ans[i][si]=o;
    }
    renderEx(); return;
  }
  if(e.t==='qcm') S.ans[i]=o;
  else if(e.t==='multi'){ var arr3=S.ans[i], ix3=arr3.indexOf(o); if(t.checked&&ix3<0)arr3.push(o); if(!t.checked&&ix3>-1)arr3.splice(ix3,1); }
  S.touched[i]=true;
  renderEx();
});
document.addEventListener('input',function(ev){
  var t=ev.target; if(!S||S.finished) return;
  var i=cur(), e=EX[i]; if(!e) return;
  if(t.id==='termin'&&!S.res[i]){ S.touched[i]=true; S.ans[i]=t.value; }
  if(t.id==='logfilter'){ S.lay[i].filter=t.value; var rr=rowHtml(i,e); $('#logrows').innerHTML=rr.html; $('#logcnt').textContent=rr.n+' / '+rr.tot+' lines'; }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&$('#modal').classList.contains('on')){ PENDING=null; closeModal(); return; }
  if(!S||S.finished) return;
  var i=cur(), e=EX[i]; if(!e) return;
  if(ev.key==='Enter'&&ev.target.classList){
    if(ev.target.classList.contains('chip')&&ev.target.getAttribute('data-act')==='chip'){ ev.preventDefault(); ev.target.click(); return; }
    if(ev.target.classList.contains('slot')){ ev.preventDefault(); ev.target.click(); return; }
    if(ev.target.classList.contains('zone')&&S.sel!==null&&S.sel!==undefined){ ev.preventDefault(); S.ans[i][S.sel]=ev.target.getAttribute('data-zone'); S.sel=null; renderEx(); return; }
  }
});

/* ===== Intro screen ===== */
function kwPanel(){
  var h='<div class="kwgrid">';
  for(var t in THEMES){
    h+='<div class="kwcol"><h4>'+esc(THEMES[t])+'</h4><ul>';
    for(var k in KWS){ if(KWS[k].th===t) h+='<li>'+esc(KWS[k].label)+'</li>'; }
    h+='</ul></div>';
  }
  return h+'</div>';
}
function renderIntro(){
  $('#hdr').hidden=true;
  var mins=M.estimatedMinutes;
  $('#screen').innerHTML='<div class="fade">'
    +'<div class="panel" style="border-color:var(--acc2)">'
    +'<h1 id="greet">'+esc(M.title)+'</h1>'
    +'<p style="color:var(--dim)"><span class="badge '+(SEV==='medium'?'med':'hard')+'">'+SEV.toUpperCase()+' severity</span> &nbsp; CompTIA Ethical Hacker Pro &middot; Chapter 1.2 &mdash; Reconnaissance and footprinting (Nmap &amp; Wireshark)</p>'
    +'<div class="tmeta" style="margin:10px 0">'
    +'<span class="badge med">'+EX.length+' exercises</span>'
    +'<span class="badge med">'+mins+' minutes</span>'
    +'<span class="badge hard">Pass mark: 70%</span>'
    +'<span class="badge med">Hints cost 10% each</span>'
    +'</div>'
    +'<h2>How this exam works</h2>'
    +'<ul class="intro">'
    +'<li>Every exercise has three blocks: <b>SCENARIO</b>, <b>QUESTION</b> and <b>ANSWERS</b>. Read them in that order.</li>'
    +'<li><b>Check</b> validates your answer, shows green/red marks per element, and <b>pauses the timer in review mode</b> so you can read the explanation. The timer starts again only when you press <b>Next</b>.</li>'
    +'<li><b>Skip</b> jumps to the next exercise. Skipped exercises are <b>not counted</b> (neither your points nor the maximum) unless you go back and finish them. You can return to skipped exercises any time before the timer ends or before you submit.</li>'
    +'<li><b>Manual Pause</b> is different: it hides the exercise so you cannot study it while the clock is frozen. Both pauses can be active at once.</li>'
    +'<li><b>Partial credit:</b> multi-answer exercises (multi-select, drag &amp; drop, ordering, matching, gaps) give points per correct element. Wrong picks earn nothing but never subtract.</li>'
    +'<li><b>Hints:</b> one hint per exercise reveals a nudge, never the answer. Using it costs 10% of that exercise&rsquo;s points.</li>'
    +'<li><b>Revise</b> unlocks a checked exercise so you can change your answer; the new Check applies the timer rule again.</li>'
    +'<li>Final score = your points &divide; the points of the exercises you did not skip. You pass at <b>70%</b>. Shuffle changes on every retake.</li>'
    +'<li>Exercise types you will meet: scenario triage, branching incidents, drag &amp; drop, ordering, matching, gap fills, log viewer with filter, fake terminal, spot-the-mistake, ranking, dual blue/red perspective and a few classic multiple choice questions.</li>'
    +'</ul>'
    +'<h2>Keywords covered in this file</h2>'
    +kwPanel()
    +'<div class="btnrow" style="margin-top:16px"><button type="button" class="btn acc" data-act="start" style="font-size:17px;padding:12px 26px">&#9654; Start the exam</button></div>'
    +'</div></div>';
  var g=$('#greet'); if(g&&S.user) g.textContent='Welcome, '+S.user+' \u2014 '+M.title;
}
function startExam(){
  S.started=true; $('#hdr').hidden=false; gotoPos(0);
}
function retake(){
  S=newState(); S.started=true; $('#hdr').hidden=false; gotoPos(0);
}

/* ===== Modal ===== */
function openModal(title,text,oklabel){
  $('#mtitle').textContent=title; $('#mtext').innerHTML=text;
  var ok=$('#mok'); ok.style.display=oklabel?'':'none'; if(oklabel) ok.textContent=oklabel;
  $('#modal').classList.add('on');
  var focusTarget=(oklabel?ok:$('.mbox .btn[data-act="mclose"]'));
  if(focusTarget) focusTarget.focus();
}
function closeModal(){ $('#modal').classList.remove('on'); }
function askSubmit(){
  var skippedAll=S.order.every(function(ei){ return S.skipped[ei]; });
  if(skippedAll){ openModal('Cannot submit yet','<b>All exercises are skipped.</b> Go back and answer at least one exercise before submitting. Use the number buttons at the top to jump to any exercise.',''); return; }
  var nS=0,nC=0;
  S.order.forEach(function(ei){ if(isCounted(ei)){ nS++; if(S.checked[ei]) nC++; } });
  openModal('Submit the exam?','Counted exercises: <b>'+nS+'</b> (answered or engaged). Checked: <b>'+nC+'</b>. Skipped and never-answered exercises stay excluded from scoring. Unchecked answers will be graded as they are now.','Submit');
}

/* ===== Results ===== */
function givenSummary(i,e){
  var a=S.ans[i], L=S.lay[i];
  if(S.skipped[i]&&!S.res[i]) return '<i>Skipped &mdash; not counted.</i>';
  switch(e.t){
    case 'qcm': return a===null?'<i>No answer.</i>':txt(e.ch[a]);
    case 'multi': return a.length? e.ch.filter(function(c,k){return a.indexOf(k)>-1;}).map(txt).join(' &middot; ') : '<i>Nothing selected.</i>';
    case 'dd': { var parts=[]; e.items.forEach(function(it,o){ if(a[o]) parts.push(esc(it.x)+' &rarr; <b>'+esc(e.zones.filter(function(z){return z.id===a[o];})[0].label)+'</b>'); }); return parts.join(' &middot; ')||'<i>Nothing placed.</i>'; }
    case 'order': case 'rank': return a.map(function(o,p){return (p+1)+'. '+esc(e.items[o]);}).join(' &middot; ');
    case 'match': return e.pairs.map(function(p,l){return esc(p.l)+' &rarr; '+(a[l]>-1?'<b>'+esc(e.pairs[a[l]].r)+'</b>':'<i>&mdash;</i>');}).join(' &middot; ');
    case 'fib': return e.slots.map(function(sv,s){return (a[s]>=0)?'<b>'+esc(e.bank[a[s]])+'</b>':'<i>&mdash;</i>';}).join(' &middot; ');
    case 'term': return a?'<code>'+esc(a)+'</code>':'<i>Nothing typed.</i>';
    case 'log': return subGiven(e.sub,a);
    case 'branch': return e.steps.map(function(st,s){return 'Step '+(s+1)+': '+(a.picks[s]!==undefined?txt(st.ch[a.picks[s]].x):'<i>unreached</i>');}).join(' &middot; ');
    case 'spot': return a.length? a.map(function(l){return '<code>'+esc(e.lines[l].x)+'</code>';}).join(' &middot; ') : '<i>No line flagged.</i>';
    case 'dual': return e.subs.map(function(sb,si){return sb.label+': '+subGiven(sb,a[si]);}).join(' &middot; ');
  }
  return '';
}
function subGiven(sb,a){
  if(sb.t==='qcm') return a===null||a===undefined?'<i>No answer.</i>':txt(sb.ch[a]);
  return (a&&a.length)? sb.ch.filter(function(c,k){return a.indexOf(k)>-1;}).map(txt).join(' &middot; ') : '<i>Nothing selected.</i>';
}
function txt(h){ return h; }
function correctSummary(i,e){
  switch(e.t){
    case 'qcm': return txt(e.ch[e.a]);
    case 'multi': return e.ch.filter(function(c){return c.ok;}).map(txt).join(' &middot; ');
    case 'dd': return e.items.map(function(it){return esc(it.x)+' &rarr; <b>'+esc(e.zones.filter(function(z){return z.id===it.c;})[0].label)+'</b>';}).join(' &middot; ');
    case 'order': case 'rank': return e.items.map(function(x,p){return (p+1)+'. '+esc(x);}).join(' &middot; ');
    case 'match': return e.pairs.map(function(p){return esc(p.l)+' &rarr; <b>'+esc(p.r)+'</b>';}).join(' &middot; ');
    case 'fib': return e.slots.map(function(sv){return '<b>'+esc(sv)+'</b>';}).join(' &middot; ');
    case 'term': return '<code>'+esc(e.demo)+'</code>';
    case 'log': return subCorrect(e.sub);
    case 'branch': return e.steps.map(function(st,s){return 'Step '+(s+1)+': '+st.ch.filter(function(c){return c.ok;}).map(function(c){return txt(c.x);}).join('');}).join(' &middot; ');
    case 'spot': return e.lines.filter(function(l){return l.bad;}).map(function(l){return '<code>'+esc(l.x)+'</code>';}).join(' &middot; ');
    case 'dual': return e.subs.map(function(sb){return sb.label+': '+subCorrect(sb);}).join(' &middot; ');
  }
  return '';
}
function subCorrect(sb){
  if(sb.t==='qcm') return txt(sb.ch[sb.a]);
  return sb.ch.filter(function(c){return c.ok;}).map(txt).join(' &middot; ');
}
function renderResults(){
  var total=nonSkippedPts(), earned=earnedSum();
  var correct=Math.round(earned), tot=Math.round(total);
  var pct=tot>0?Math.round(correct/tot*100):0;
  var passed=pct>=70&&tot>0;
  var skippedList=[], untouched=[];
  S.order.forEach(function(ei,p){ if(S.skipped[ei]) skippedList.push('#'+(p+1)+' '+EX[ei].title); else if(!S.touched[ei]) untouched.push('#'+(p+1)+' '+EX[ei].title); });
  var th={};
  S.order.forEach(function(ei){ var e=EX[ei]; if(!isCounted(ei)) return; if(!th[e.th]) th[e.th]={g:0,m:0,n:0}; th[e.th].g+=S.res[ei]?S.res[ei].earned:0; th[e.th].m+=e.pts; th[e.th].n++; });
  var h='<div class="fade"><div class="hero '+(passed?'pass':'fail')+'">'
    +'<div class="big">'+(passed?'PASS':'FAIL')+'</div>'
    +'<div class="pct">'+fmtPts(earned)+' / '+fmtPts(total)+' points &middot; '+pct+'% &middot; pass mark 70%</div>'
    +'<div style="margin-top:8px;color:var(--dim)">'+(passed?'Certificate-style result: chapter 1.2 ('+SEV.toUpperCase()+') mastered at this severity. Well done.':'You must retake this exam. Review the explanations below, then press Retake Exam.')+'</div>'
    +'</div>'
    +'<div class="panel"><h3 style="margin-top:0">What happened</h3>'
    +'<p>'+S.order.filter(function(ei){return isCounted(ei);}).length+' of '+EX.length+' exercises were counted (answered or engaged). <b>'+(skippedList.length+untouched.length)+'</b> were excluded from both your points and the maximum.</p>'
    +'<div class="thchips" style="margin-top:4px">';
  for(var t in th){ h+='<span class="thchip">'+esc(THEMES[t])+': '+fmtPts(th[t].g)+' / '+fmtPts(th[t].m)+'</span>'; }
  h+='</div>';
  if(skippedList.length){ h+='<div class="warnbx"><b>Skipped (not counted):</b> '+skippedList.map(esc).join(' &middot; ')+'</div>'; }
  if(untouched.length){ h+='<div class="warnbx"><b>Never answered (not counted):</b> '+untouched.map(esc).join(' &middot; ')+'</div>'; }
  h+='</div><div class="panel"><h3 style="margin-top:0">Per-exercise report</h3>';
  S.order.forEach(function(ei,p){
    var e=EX[ei], r=S.res[ei];
    var excluded=!isCounted(ei);
    var lab=excluded?'skipped':(r?labelOf(r):'skipped');
    var tagcls=lab==='full'?'grn':lab==='zero'?'red':'amb';
    var labtxt=excluded?(S.skipped[ei]?'&#9193; SKIPPED &mdash; NOT COUNTED':'&#9675; NOT ANSWERED &mdash; NOT COUNTED'):(lab==='full'?'&#10003; FULL':lab==='partial'?'&#9888; PARTIAL':'&#10007; ZERO');
    h+='<div class="rli"><div class="rhead"><span class="rnum">Q'+(p+1)+'</span><span class="rttl">'+esc(e.title)+'</span>'
      +'<span class="tag '+tagcls+'">'+labtxt+'</span><span class="rpts">'+(excluded?'&mdash;':(r?fmtPts(r.earned):'0'))+' / '+fmtPts(e.pts)+' pt</span></div>'
      +'<div class="rsec"><b>Your answer:</b> '+(excluded?'<i>Excluded from scoring.</i>':givenSummary(ei,e))+'</div>'
      +'<div class="rsec"><b>Correct:</b> '+correctSummary(ei,e)+'</div>'
      +'<div class="rsec"><b>Why:</b> '+e.ex+'</div>'
      +'<div class="rsec" style="color:var(--dim)"><b style="color:#7dd3fc">Keywords:</b> '+e.kw.map(function(k){return esc(KWS[k]?KWS[k].label:k);}).join(' &middot; ')+'</div>'
      +'</div>';
  });
  h+='</div><div class="btnrow"><button type="button" class="btn acc" data-act="retake" style="font-size:16px;padding:12px 24px">&#8635; Retake Exam</button></div></div>';
  $('#screen').innerHTML=h;
  window.scrollTo(0,0);
}

/* ===== Finish & report ===== */
function feedbackHtml(i,e){
  var r=S.res[i]; if(!r) return '';
  var lab=labelOf(r);
  var cls=lab==='full'?'full':lab==='zero'?'zero':'part';
  var icon=lab==='full'?'\u2713 FULL':lab==='zero'?'\u2717 ZERO':'\u26A0 PARTIAL';
  var h='<div class="fb '+cls+'" role="status">'+icon+' &mdash; You earned '+fmtPts(r.earned)+' / '+fmtPts(r.max)+' points.'+(r.hintUsed?' (Hint used: &minus;10%)':'')+'</div>';
  h+='<div class="expl"><h4>EXPLANATION</h4>'+e.ex+'</div>';
  return h;
}
function finish(auto){
  if(S.finished) return;
  S.finished=true;
  S.order.forEach(function(ei){
    if(S.skipped[ei]) return;
    if(!S.touched[ei]) return;
    if(!S.res[ei]){
      if(S.ans[ei]===undefined) initAns(ei,EX[ei]);
      var r=evalEx(ei,EX[ei]);
      r.hintUsed=!!S.hint[ei];
      S.res[ei]=r; S.checked[ei]=true;
      S.earnedMap=S.earnedMap||{}; S.earnedMap[ei]=r.earned;
    }
  });
  closeModal(); S.pMan=false; S.pChk=false;
  updChrome();
  renderResults();
  var total=nonSkippedPts(), earned=earnedSum();
  var correct=Math.round(earned), tot=Math.round(total);
  if(tot>0){
    var percent=Math.round(correct/tot*100);
    reportScore(correct,tot,percent,percent>=70);
  }
}
function reportScore(correct,total,percent,passed){
  if(S.reported) return;
  S.reported=true;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:M.topicId,
      score:correct, total:total, percent:percent, passed:passed
    }, location.origin);
  }catch(e){ /* opened directly: nothing to report to */ }
}

/* ===== Boot ===== */
function boot(){
  S=newState();
  window.addEventListener('message',function(ev){
    if(!ev.data) return;
    if(ev.data.type==='CYBERPULSE_INIT'||ev.data.type==='CYBERMASTERY_INIT'){
      S.user=ev.data.username||S.user||'';
      var g=$('#greet'); if(g&&S.user) g.textContent='Welcome, '+S.user+' \u2014 '+M.title;
    }
  });
  renderIntro();
  /* QA hooks: exposed only when the file is opened directly from disk, never on the site */
  if(location.protocol==='file:'){
    window.__EXPOSED__={
      get state(){ return S; },
      ex: EX,
      setTime:function(v){ S.timeLeft=v; updTimer(); },
      reportCount:function(){ return S.reported?1:0; }
    };
  }
}
boot();
