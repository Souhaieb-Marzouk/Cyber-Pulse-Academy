{"t":"log","th":"C","kw":"SSH hardening,secure baseline,SIEM / centralized logging,least privilege,stale account cleanup","pts":4,"title":"Justify the jump-host hardening from the logs","sc":"You are closing an engagement at Meridian Foods. The client accepts that the jump host needs hardening but demands each recommendation be tied to a log line — 'no log line, no change request'. Review the captured auth/syslog excerpt for <code>jh01</code>.","q":"Select the FOUR lines that justify hardening recommendations (not the ones that are normal operations).","d":{"lines":[{"t":"Mar 12 03:11:52 jh01 sshd[3011]: Accepted publickey for deploy from 10[.]30[.]5[.]12 port 55220","ok":false},{"t":"Mar 12 03:14:09 jh01 sshd[3022]: Accepted password for root from 10[.]30[.]5[.]99 port 44110","ok":true},{"t":"Mar 12 04:02:33 jh01 sshd[3055]: Accepted publickey for deploy from 10[.]30[.]5[.]12 port 55301","ok":false},{"t":"Mar 12 05:41:10 jh01 systemd[1]: Starting Daily apt upgrade and clean activities...","ok":false},{"t":"Mar 12 09:18:44 jh01 sudo: deploy : TTY=pts/0 ; PWD=/home/deploy ; USER=root ; COMMAND=/usr/bin/ansible-playbook site.yml","ok":false},{"t":"Mar 12 11:03:27 jh01 sshd[3101]: Accepted password for backupsvc from 10[.]30[.]9[.]201 port 51234","ok":true},{"t":"Mar 12 11:03:29 jh01 sshd[3103]: subsystem request for sftp by user backupsvc","ok":false},{"t":"Mar 12 12:20:15 jh01 sshd[3120]: Failed password for invalid user admin from 185[.]243[.]115[.]84 port 60011","ok":false},{"t":"Mar 12 12:20:19 jh01 sshd[3122]: Failed password for invalid user admin from 185[.]243[.]115[.]84 port 60022","ok":false},{"t":"Mar 12 12:20:26 jh01 sshd[3125]: Accepted password for deploy from 185[.]243[.]115[.]84 port 60030","ok":true},{"t":"Mar 12 13:02:41 jh01 sshd[3140]: Connection closed by 185[.]243[.]115[.]84 port 60030","ok":false},{"t":"Mar 12 14:44:03 jh01 CRON[3155]: (root) CMD (/usr/local/sbin/sess_clean.sh)","ok":false}]},"ex":"The four lines that force change requests: <b>root logged in with a password</b> (direct-login root must not exist; keys + named accounts + sudo only), <b>backupsvc authenticated with a password</b> (service accounts authenticate with keys, and an SSH-capable service account is a lateral-movement rail), <b>deploy authenticated successfully from the internet-scanner address 185[.]243[.]115[.]84</b> after admin probing — the only acceptable explanations (a prior authorized test) must be provable, otherwise that is the incident of the month and its recommendation is source-restricted SSH rules plus immediate credential rotation. The failed-admin pair is background internet noise (and it failed), the deploy logins from 10[.]30[.]5[.]12 are the bastion's normal admin subnet, and the cron/apt lines are routine. The judgment call — noise versus signal — is exactly what separates a recommendation a client signs from one they laugh out of the meeting.","hi":["Two logins use passwords where keys should be, and one successful login comes from the same address that just failed twice."]},
{"t":"match","th":"B","kw":"Credential Guard,pass-the-hash,DCSync,tiered admin model,NTLMv1 / RC4 legacy auth,default credentials,unquoted service path,SSH hardening,least privilege","pts":7,"title":"Map each incident artifact to its root-cause fix","sc":"Incident review at Harbor Logistics produced seven artifacts. The CISO complains that every past fix 'made the alert go away, not the attack'. For each artifact, match the recommendation that removes the ROOT CAUSE — not the one that treats the symptom.","q":"Drag the root-cause fix onto the artifact it eliminates.","d":{"slots":[{"id":"s1","label":"Mimikatz found reading lsass memory"},{"id":"s2","label":"NTLM relay to the file server succeeded"},{"id":"s3","label":"Unquoted service path on 12 servers"},{"id":"s4","label":"SSH permits direct root password login"},{"id":"s5","label":"World-writable share on the backup server"},{"id":"s6","label":"Default SNMP community 'public' on 200 switches"},{"id":"s7","label":"DCSync replication request from member server WKS-229"}],"items":[{"v":"Enable Credential Guard and strip local admin from daily accounts","s":"s1"},{"v":"Enforce SMB signing and audit-plan the NTLM phase-out","s":"s2"},{"v":"Quote the paths and lock the folder ACLs","s":"s3"},{"v":"PermitRootLogin no and key-only authentication","s":"s4"},{"v":"Restrict the share ACL to named groups","s":"s5"},{"v":"Change defaults and disable SNMPv2c read access","s":"s6"},{"v":"Tier-0 logons only on privileged access workstations","s":"s7"}]},"ex":"Symptom fixes (AV signature, one password change, blocking one tool) all fail the next engagement. The root causes: lsass is readable because endpoints let privileged processes touch it — <b>Credential Guard</b> isolates the secrets and least privilege removes the opener (the same dump feeds pass-the-hash, which dies with unique per-host credentials). NTLM relay succeeded because signing was optional — enforce <b>SMB signing</b> and retire NTLM on an audited schedule. An <b>unquoted service path</b> is a local privesc primitive — quote it and fix the ACL. Direct <b>root SSH with passwords</b> is brute-forceable and unauditable — keys and named accounts only. A <b>world-writable share</b> is an anonymous staging area for any insider or compromised account — named groups only. <b>Default SNMP communities</b> are public knowledge — change, restrict, disable v2c. Each fix names the property it removes; that is what makes the fix stick. A DCSync replication request from WKS-229 means a tier-0 credential sat on a reachable box — tier-0 logons belong on privileged access workstations only.","hi":["For each artifact ask: what PROPERTY of the environment made this work? That property is the slot's answer."]},
{"t":"qcm","th":"A","kw":"CVSS scoring,risk-based prioritization,business impact,remediation timeline","pts":3,"title":"The board wants the 'highest score' fixed first","sc":"Two confirmed findings reach the risk committee at Kestrel Bank. Finding P: CVSS <b>8.8</b>, reflected XSS on the public marketing site — static content, no session data, no PII reachable. Finding Q: CVSS <b>8.2</b>, SQL injection on an internal reconciliation app — flat network, the app account can read the cardholder database, and PCI DSS scope covers the segment. The CEO says: '8.8 beats 8.2. Fix P.'","q":"What does your recommendation report actually advise?","d":{"ch":[{"v":"Fix Q first — its cardholder-data impact beats P’s higher score","ok":true},{"v":"Fix P first — committee instinct keeps the CVSS order defensible"},{"v":"Fix both in the same window — the scores are too close to pick"},{"v":"Fix neither before the quarterly window — both sit under 9.0"}]},"ex":"This is the judgment call the exam is built on: <b>a CVSS score is an input to prioritization, not the verdict</b>. P is a reflected XSS on a static, data-less page — exploitation yields little and touches nobody's money. Q sits on a flat network, its app account reaches the <b>cardholder database</b>, and the segment is in PCI scope — exploitation is a compliance event, a fraud event and a breach-notification event at once. Environmental scoring exists precisely for this: impact and likelihood in YOUR context reorder the queue. 'Both at once' dodges the question when the sprint capacity is one fix; 'wait for the window' ignores that Q is a living exposure to regulated data. The recommendation advises Q first, P scheduled immediately after — and documents why the committee's score-first instinct was overridden.","hi":["Ask of each finding: what exactly does the attacker GET, and what does the business OWE regulators afterwards?"]},
{"t":"blank","th":"A","kw":"risk acceptance,compensating controls,business impact,remediation timeline","pts":4,"title":"Draft the formal risk-acceptance clause","sc":"Kestrel Bank will not patch the legacy settlement gateway before Q4. As the assessor you must draft the acceptance clause so it protects the bank instead of the ignorers.","q":"Fill each blank with the best phrase from the bank.","d":{"pre":"Risk RA-2026-014 is formally accepted by the [[1]] (named role, not a team mailbox). The residual risk remains [[2]] because the gateway is reachable from two VLANs and holds settlement instructions. Mitigation in the interim: the compensating controls — host firewall allow-list, IPS virtual patch and daily integrity check — are verified [[3]] by the security team, and the acceptance [[4]] on 30 September regardless of project status, forcing a fresh decision or a new acceptance.","bank":["chief operating officer","high","monthly","expires","low","deleted","annually","transferred to the vendor","automatically escalates to critical"],"key":["chief operating officer","high","monthly","expires"]},"ex":"An acceptance that means anything names a single accountable <b>owner</b> (a role with authority over the asset, not an inbox), states the honest <b>residual risk</b> — still high: reachable from two VLANs, settlement instructions — and binds compensating controls to a <b>verification cadence</b> (monthly here; 'annually' would let six months of drift go unseen on a high risk). Most importantly the acceptance <b>expires</b>: an open-ended acceptance is how a 2019 exception becomes a 2027 breach nobody re-approved. The decoys are the failure patterns auditors find constantly: risk 'transferred to the vendor' (the vendor does not accept YOUR risk), acceptance 'deleted' after pressure, or bureaucratic inflation instead of a decision.","hi":["Two slots are about honesty, two are about not letting the paperwork outlive the risk."]},
{"t":"spot","th":"C","kw":"TLS hardening,encryption in transit,secure baseline,patch management","pts":3,"title":"Audit the nginx TLS block","sc":"Meridian Foods' platform team shipped this nginx TLS block claiming 'A-grade config'. Your sslscan output disagrees. Read it like an assessor — three lines undermine the whole intent.","q":"Click the THREE lines that must change before the recommendation signs off.","d":{"lines":[{"t":"server {","ok":false},{"t":"  listen 443 ssl;","ok":false},{"t":"  ssl_protocols TLSv1 TLSv1.1 TLSv1.2;","ok":true},{"t":"  ssl_ciphers ALL:!aNULL:!eNULL:!MD5;","ok":true},{"t":"  ssl_prefer_server_ciphers on;","ok":false},{"t":"  ssl_session_cache shared:SSL:10m;","ok":false},{"t":"  add_header Strict-Transport-Security \"max-age=31536000\" always;","ok":false},{"t":"  ssl_certificate /etc/ssl/certs/site-fullchain.pem;","ok":false},{"t":"  ssl_certificate_key /etc/ssl/private/site-key.pem;","ok":true},{"t":"  server_tokens off;","ok":false}]},"ex":"Three lines sink it. <code>ssl_protocols TLSv1 TLSv1.1 TLSv1.2</code> re-enables two dead protocols — POODLE and downgrade territory; the baseline is TLSv1.2 plus TLSv1.3. <code>ssl_ciphers ALL:...</code> ships every cipher family including 3DES/RC4-era suites — a hardened block names modern AEAD suites (ECDHE with AES-GCM/CHACHA20) explicitly. And the private key sits at <code>/etc/ssl/private/site-key.pem</code> with no restriction shown while the recommendation's evidence shows it world-readable — a private key readable by any local user means 'encryption in transit' protects against everyone except every account on the box. The decoys are correct: HSTS present, server_tokens off, cipher preference on, sane session cache. This is also why the report's retest step reruns sslscan after the fix — 'we changed the config' is not the same as 'the handshake is clean'.","hi":["Two lines negotiate WHAT is allowed; one line hides WHO can read the key."]},
{"t":"branch","th":"E","kw":"secret management,secure SDLC / code review,change management,parameterized queries","pts":4,"title":"DUAL PERSPECTIVE — from CI/CD to production in one engagement","sc":"RED TEAM VIEW: You cloned a public internal mirror of the payments repo, found a long-lived AWS key in a CI variable referenced by a committed script, and used it to reach the payments database staging credentials — which worked in production. The blue team lead now asks you to walk the fixes in order. Each answer unlocks the next.","q":"Choose the strongest fix per step.","d":{"steps":[{"q":"Step 1 — the long-lived key in CI variables. What kills this class, not this key?","ch":[{"v":"Rotate the key and delete it from the variable store"},{"v":"Short-lived, scoped tokens issued per pipeline run, plus secret scanning on every commit"},{"v":"Make the repo private and apologize to the auditor"}],"ok":1,"fb":"Rotating one key resets the clock until the next leak. The structural fix is <b>no long-lived secrets at all</b>: tokens minted per run, scoped to the one job, expiring in minutes — and secret scanning in CI so the next key never merges. This is also a secure-SDLC finding: the pipeline is part of the code path and needs the same review gates."},{"q":"Step 2 — the leaked script reveals staging credentials reused in production. Fix?","ch":[{"v":"Environment isolation: staging holds synthetic data and its own credentials, never production's"},{"v":"Rename the staging database so it is harder to find"},{"v":"Rotate the production password quarterly"}],"ok":0,"fb":"Credential reuse across environments means the weakest environment owns the strongest one. Staging exists to be prodded by interns and CI runners — it must never share identity with production. Isolation plus synthetic data breaks the bridge permanently; renaming and rotation schedules do not."},{"q":"Step 3 — how does the DB credential reach the app at runtime now?","ch":[{"v":"The app fetches secrets from a vault at startup, with audit logging on every read and automatic rotation"},{"v":"A shared password-protected spreadsheet owned by the DBA team"},{"v":"Base64 in a Kubernetes configmap, it is encoded after all"}],"ok":0,"fb":"A <b>vault</b> with per-app identity, read audit trails and rotation turns 'who knows the password' from folklore into a log line. Encoding is not encrypting — base64 in a configmap is a password with a costume. The spreadsheet is how the next incident starts."},{"q":"Step 4 — the postmortem asks how this reached prod. Which process change prevents the next silent path?","ch":[{"v":"A change-management gate: infrastructure and pipeline changes ship through the same review as application code"},{"v":"A monthly reminder e-mail about secrets hygiene"},{"v":"Ban contractors from Git"}],"ok":0,"fb":"The key lived in the pipeline because infrastructure changes bypassed every review the code has. Extending <b>change management</b> to pipelines and infra makes the next secret fall into a reviewed process, not a gap. E-mails do not gate merges, and excluding people misses the structural hole — the process, not the person, leaked the key."}]},"ex":"The chain — public mirror → long-lived key → shared environment credentials → unmanaged runtime secrets → ungoverned pipeline — is one finding about <b>secret management</b> wearing four costumes. The recommendations that survive re-engagement: ephemeral scoped tokens plus secret scanning, strict environment isolation, a vault with audit and rotation, and change management that covers infrastructure like code. 'Rotate and move on' is how the same finding pays your next visit.","hi":["Every correct answer removes a standing secret or a standing gap — none of them just hides the current one."]},
{"t":"drag","th":"C","kw":"least privilege,network segmentation / VLANs,encryption at rest,encryption in transit,MFA,EDR","pts":5,"title":"Assign controls to the Zero Trust pillars","sc":"Meridian Foods' board approved a zero-trust program after your finding that the VPN was 'the castle gate'. The architect asks you to slot each control into the pillar it belongs to, so the roadmap does not become one big VPN replacement.","q":"Drag each control onto its zero-trust pillar.","d":{"slots":[{"id":"p1","label":"Identity"},{"id":"p2","label":"Device"},{"id":"p3","label":"Network"},{"id":"p4","label":"Application"},{"id":"p5","label":"Data"}],"items":[{"v":"Phishing-resistant MFA and conditional access on every login","s":"p1"},{"v":"EDR compliance gate: patched and healthy devices only","s":"p2"},{"v":"Micro-segmentation between workloads instead of one flat VLAN","s":"p3"},{"v":"Per-app broker access — no implicit network trust from the VPN","s":"p4"},{"v":"Encrypt fields at rest and enforce per-record access labels","s":"p5"}]},"ex":"Zero trust distributes the 'gate' across five pillars. <b>Identity</b>: strong, phishing-resistant authentication with conditional access — who you are, verified hard. <b>Device</b>: the endpoint must prove health (patched, EDR present) before touching anything — a stolen session on a rotten laptop still fails the gate. <b>Network</b>: micro-segmentation makes east-west movement expensive even after a foothold. <b>Application</b>: access is granted per application through a broker — the old VPN's fatal gift, 'you are on the network now', disappears. <b>Data</b>: encryption at rest plus per-record labels means a leak is both harder and smaller. Your pentest narrative maps 1:1: stolen password → identity pillar, unpatched jump host → device pillar, flat VLAN → network pillar, implicit trust → application pillar, readable settlement data → data pillar.","hi":["Every pillar answers one question: who, what device, which segment, which app, which record."]},
{"t":"multi","th":"D","kw":"detection coverage,SIEM / centralized logging,honeypot / canary tokens,alert tuning,EDR","pts":3,"title":"Spend the detection budget where it bites","sc":"After your engagement, Harbor Logistics has budget for three detection improvements and six proposals on the table. The CEO's constraint: 'I want to KNOW faster next time — not buy furniture.'","q":"Select the THREE proposals with the best detection return.","d":{"n":3,"ch":[{"v":"Enable PowerShell script-block logging fleet-wide and ship it to the SIEM","ok":true},{"v":"Deploy a Sysmon configuration curated for process, network and image-load events","ok":true},{"v":"Plant canary tokens: a fake 'finance_passwords.xlsx' share and unused admin accounts","ok":true},{"v":"Buy 20 TB more SIEM storage with no new log sources or correlation rules","ok":false},{"v":"Set every EDR policy to 'alert on everything' with default severity critical","ok":false},{"v":"Disable PowerShell script-block logging fleet-wide because it is 'too noisy'"}]},"ex":"The three winners all change <b>what is visible</b>: script-block logging records the actual PowerShell commands (the single most common attacker tool on Windows), a curated Sysmon config gives process lineage and network events that default logging misses, and canary tokens are near-zero-noise tripwires — nobody opens 'finance_passwords.xlsx' by accident, and unused admin accounts have exactly one visitor. The losers change <b>nothing about visibility</b>: more storage without new sources is a bigger diary for the same diary entries; 'alert on everything at critical' is how a SOC stops believing its own queue (alert tuning means better signals, not louder ones); and disabling PowerShell logging removes the best source precisely because it needed tuning, not deletion.","hi":["One option is a tripwire nobody can trip by accident; two options record what attackers actually type."]},
{"t":"order","th":"A","kw":"compensating controls,network segmentation / VLANs,alert tuning,risk acceptance,remediation timeline,least privilege","pts":6,"title":"Design the compensating-control package in the right order","sc":"Kestrel Bank cannot patch the settlement gateway before Q4 (certified vendor appliance, 14-month re-certification). You promised the risk committee a compensating-control package designed properly — not a firewall rule taped over the alert.","q":"Drag the design steps into the correct order (first on top).","d":{"items":["Define exactly which exploit paths the missing patch enables","Map who and what can currently reach the gateway, host by host","Segment it: dedicated VLAN, host firewall allow-list, deny by default","Front it with an IPS virtual patch keyed to the specific CVE signatures","Reduce standing privilege on the box and alert on any change to it","Set the owner, the expiry date and the review trigger in the risk register"]},"ex":"A compensating package is engineered from the attack outward. First define <b>which paths the missing patch leaves open</b> — you cannot compensate what you have not spelled out. Then <b>map reachability</b>: every host and flow that can touch the gateway today. <b>Segmentation</b> (own VLAN, default-deny host firewall) shrinks that map to the minimum. The <b>IPS virtual patch</b> stands in for the vendor's missing fix by blocking the specific exploit signatures at the edge. <b>Privilege reduction plus change alerting</b> guards the control plane itself — a compensating control someone can quietly edit is not a control. Last, governance: owner, expiry, review trigger — the package joins the risk register with a date, because compensation without expiry is acceptance wearing a costume. Doing step 6 first (signing the paper) is exactly how 'compensated' systems end up flat-networked three months later.","hi":["You compensate known paths, not a CVE number — and the paperwork closes the design, it does not open it."]},
{"t":"qcm","th":"B","kw":"LAPS,PAM / just-in-time access,least privilege,password policy hardening","pts":3,"title":"One local admin password, no emergency access — design both away","sc":"Your finding at Harbor Logistics: one identical local administrator password on all 200 endpoints, and — when the AD team simulated a vault outage — no way at all to administer the domain if the PAM vault dies. The CIO wants one recommendation covering both.","q":"Which recommendation package do you sign?","d":{"ch":[{"v":"LAPS rotation for every host, plus two sealed break-glass accounts that alarm on use","ok":true},{"v":"LAPS rotation on every host — unique local passwords make emergency accounts pointless"},{"v":"Keep the shared password in the PAM vault and rotate it weekly with audit alerts"},{"v":"Strip local admin from all staff and rely on the PAM vault’s recovery mode"}]},"ex":"Two findings, one package. <b>LAPS</b> kills the shared-local-admin problem structurally: every endpoint rotates a unique password, so one dumped hash is one door, not two hundred — and pass-the-hash lateral movement loses its free ride. But LAPS does not address the second half: when the PAM vault (or AD itself) is down, even correct JIT design needs a way in — hence two <b>break-glass accounts</b>, sealed offline, alarmed on every use, rotated after each use. 'LAPS alone' leaves the outage dead end; 'shared password in a vault' keeps the single credential that opens 200 doors (vault compromise = fleet compromise); 'remove all admin rights' breaks support's ability to work at all — least privilege still grants the rights the job needs, just scoped and brokered.","hi":["The correct package has two halves — one per finding. The near-miss answers each solve exactly one half, or neither."]},
{"t":"rank","th":"A","kw":"risk-based prioritization,CVSS scoring,patch management,unquoted service path,remediation timeline,change management,SMBv1 removal","pts":6,"title":"Sequence the fixes under a hard change constraint","sc":"Kestrel Bank's change calendar allows exactly one server change per week. Your report has six confirmed findings. Context: the internet-facing edge is rebuilt on Monday; the asset DB holds cardholder data; WIN-311 is reachable only from the admin VLAN; the file server took 9 hours to rebuild last time it failed.","q":"Rank from what you schedule FIRST (top) to what you schedule LAST (bottom).","d":{"items":["Edge gateway: patch the pre-auth RCE (CVSS 9.8, public exploit, internet-facing)","Asset DB: fix the unauthenticated SQLi reaching cardholder data (CVSS 8.2)","WIN-311: fix the unquoted service path privesc (CVSS 7.1, admin-VLAN only, no PoC)","File server: apply the OS patch stack (CVSS 8.6, no public exploit, risky 9-hour rebuild)","Payroll app: disable the exposed Telnet management port (CVSS 5.3, internal users only)","HR portal: fix the stored XSS visible only to HR staff (CVSS 6.4)"]},"ex":"1) <b>Edge RCE</b> — highest score, internet-facing, public exploit, AND Monday's rebuild window already exists: cheapest top-priority fix ever scheduled. 2) <b>Asset DB SQLi</b> — lower score, but unauthenticated access to cardholder data on a flat path: regulated impact beats the file server's higher number. 3) <b>WIN-311 privesc</b> — admin-VLAN-only and no public PoC: real risk, restricted likelihood, and a low-risk fix (quote a path, fix ACLs). 4) <b>File server stack</b> — the 8.6 is tempting, but a 9-hour risky rebuild on a machine with no targeted exploit waits for a maintenance night; note the compensating monitoring until then. 5) <b>Telnet port</b> — exposed legacy protocol, internal-only reachability: quick win, cheap change, schedule when the payroll box next bounces. 6) <b>HR XSS</b> — smallest audience and blast radius. The lesson the exam wants: priority = exposure × impact × exploitability × <b>cost of the fix window</b>, not the CVSS column sort.","hi":["One fix piggybacks on a window that already exists, and one fix risks a 9-hour outage for a finding with no exploit in the wild."]},
{"t":"log","th":"E","kw":"DNS & email filtering,detection coverage,SIEM / centralized logging,alert tuning","pts":4,"title":"Separate the beacon from the noise in the proxy log","sc":"Kestrel Bank's SOC suspects a compromised host on 10[.]44[.]7[.]23. You exported five minutes of egress proxy traffic. Real C2 beacons have a rhythm; humans and patch agents do not.","q":"Select every line that is part of the C2 beacon pattern from that host.","d":{"lines":[{"t":"09:14:02 10[.]44[.]7[.]23 -> hxxp://cdn-metrics[.]net/a?k=8842 POST 204","ok":true},{"t":"09:14:32 10[.]44[.]7[.]23 -> hxxp://cdn-metrics[.]net/a?k=8843 POST 204","ok":true},{"t":"09:15:02 10[.]44[.]7[.]23 -> hxxp://cdn-metrics[.]net/a?k=8844 POST 204","ok":true},{"t":"09:15:02 10[.]44[.]7[.]23 -> hxxp://update.telemetry-cdn[.]com/win11/defender.dat GET 200","ok":false},{"t":"09:15:19 10[.]44[.]7[.]23 -> hxxp://intranet-portal KB search GET 200","ok":false},{"t":"09:15:32 10[.]44[.]7[.]23 -> hxxp://cdn-metrics[.]net/a?k=8845 POST 204","ok":true},{"t":"09:15:47 10[.]44[.]7[.]23 -> hxxp://docs.corp[.]internal sync GET 200","ok":false},{"t":"09:16:02 10[.]44[.]7[.]23 -> hxxp://cdn-metrics[.]net/a?k=8846 POST 204","ok":true},{"t":"09:16:02 10[.]44[.]2[.]9 -> hxxp://cdn-metrics[.]net/a?k=5511 POST 204","ok":false},{"t":"09:16:32 10[.]44[.]7[.]23 -> hxxp://cdn-metrics[.]net/a?k=8847 POST 204","ok":true}]},"ex":"The six <code>cdn-metrics[.]net</code> POSTs from 10[.]44[.]7[.]23 land on a metronome: <b>exactly every 30 seconds</b>, tiny 204 responses, sequential keys — that rhythm is machine-generated tasking, not a human browsing (humans jitter; patch agents pull on schedules measured in hours and fetch real content). The Defender telemetry GET is a large vendor URL with real payload — benign. The 09:16:02 line from 10[.]44[.]2[.]9 is the tricky one: same domain, different host — evidence the implant is not unique to one machine, but the question scoped the beacon pattern FROM 10[.]44[.]7[.]23, and a good analyst flags the second host separately rather than blurring two findings. Recommendations: block and sinkhole the domain, add a 'beaconing rhythm' correlation rule (same host, same URL, fixed interval, empty responses) to the SIEM, egress-allowlist unapproved new domains, and re-image the implant's hosts — the recommendation section grows by one host the moment the log says so.","hi":["Count the seconds between identical requests from the same host. Then check who else talks to that domain."]},
{"t":"blank","th":"B","kw":"gMSA,service account hygiene,password policy hardening,least privilege","pts":4,"title":"Write the service-account standard","sc":"After the Kerberoast finding, Kestrel Bank asks for a one-paragraph standard for service accounts. The legal-reviewed template needs the right terms dropped in.","q":"Fill each blank with the best phrase from the bank.","d":{"pre":"Every service account must run as a [[1]] where the platform supports it — the operating system then manages its password automatically and no human ever learns it. Interactive logon rights are denied so the account cannot be used at a desktop or over RDP. Where a managed account is impossible, the password must be at least [[2]] characters, stored in the vault, and [[3]] on a documented schedule with no reuse. Privileges are limited to the [[4]] the service actually performs — a backup agent never needs domain admin.","bank":["group managed service account","40","rotated","single task","password of 12 characters","shared across services","domain admin group"],"key":["group managed service account","40","rotated","single task"]},"ex":"The standard's four load-bearing terms: <b>gMSA</b> (group managed service account) — AD generates and rotates a 240+ character password the human never sees, which ends Kerberoasting against it. Where the legacy platform cannot use one, a <b>40+ character</b> random secret (cracked offline in the incident took 40 minutes for a human-chosen one — length is the only defense offline attacks respect), <b>rotated</b> on a schedule from the vault, never shared across services so one leak stays one leak. And privilege scoped to the <b>single task</b> the service performs — least privilege again: the blast radius of a compromised service account is whatever that account could touch. 'Shared across services' and 'domain admin group' are the two properties your finding explicitly proved fatal.","hi":["Slot 1 is a three-word AD account type; slot 4 is about scope, not strength."]},
{"t":"spot","th":"B","kw":"least privilege,secure baseline,CIS Benchmark,PAM / just-in-time access","pts":2,"title":"Audit the sudoers snippet","sc":"Meridian Foods' Unix team shipped this sudoers fragment after the 'least privilege' retro. Two lines quietly grant the kingdom. The rest is genuinely good hygiene.","q":"Click the TWO lines that violate least privilege.","d":{"lines":[{"t":"Defaults use_pty","ok":false},{"t":"Defaults logfile=\"/var/log/sudo.log\"","ok":false},{"t":"Defaults passwd_tries=3","ok":false},{"t":"Cmnd_Alias DB_OPS = /usr/bin/psql, /usr/bin/pg_dump","ok":false},{"t":"%dbteam ALL=(postgres) NOPASSWD: DB_OPS","ok":false},{"t":"%devs ALL=(ALL) NOPASSWD: ALL","ok":true},{"t":"deploy ALL=(root) NOPASSWD: /bin/bash","ok":true},{"t":"svc_backup ALL=(root) NOPASSWD: /usr/local/bin/backup.sh","ok":false}]},"ex":"<code>%devs ALL=(ALL) NOPASSWD: ALL</code> is root for every developer with no password and no logging of intent — the opposite of just-in-time access; the fix is a command alias of what builds actually need (systemctl on the app service, journalctl), run as the service user. <code>deploy ALL=(root) NOPASSWD: /bin/bash</code> is the same kingdom with one step of indirection: a root shell IS all commands, so writing the binary name in the alias fools nobody — grant specific binaries or, for deployments, run the app as a dedicated user instead of escalating to root. The decoys are exactly what a good baseline looks like: <code>use_pty</code> (tty isolation), a sudo logfile (accountability), <code>passwd_tries</code>, a tight <code>DB_OPS</code> alias executed AS the postgres user, and svc_backup pinned to ONE script. Least privilege is a per-command decision, never a wildcard.","hi":["One line is a wildcard for a whole team; one line hides 'everything' behind a single program name."]},
{"t":"branch","th":"C","kw":"network segmentation / VLANs,firewall rule cleanup,change management,compensating controls,unnecessary services","pts":4,"title":"Sequence the segmentation project without an outage","sc":"Your finding: flat 10[.]20[.]0[.]0/16 network, cardholder segment reachable from every floor. Meridian Foods approves segmentation but the plant runs 24/7 — an outage costs more than the breach fine. The architect asks for the rollout decision path.","q":"Choose the strongest move per step.","d":{"steps":[{"q":"Step 1 — before any enforcement, what makes the plan survivable?","ch":[{"v":"Build the flow map first: weeks of actual traffic between segments from firewall/NetFlow data"},{"v":"Copy a segmentation design from a conference talk"},{"v":"Start by blocking everything and re-enable as tickets arrive"}],"ok":0,"fb":"A flow map from real data is the difference between a change window and a night of paging: you learn which 40 flows actually matter, then write allow rules for those — instead of discovering them from angry plant operators at 03:00. Copy-paste designs and block-everything both ignore how THIS business actually talks."},{"q":"Step 2 — the quick win that reduces risk this month, before the big VLAN work?","ch":[{"v":"Delete the rules that literally say 'any any' between user and PCI zones and replace with the mapped flows"},{"v":"Add a second firewall next to the first one"},{"v":"Move the payment servers into the CEO's office VLAN"}],"ok":0,"fb":"Rule cleanup IS segmentation's first mile: 'any any' between user and PCI zones means the zones are decorative. Replacing them with the mapped minimum (a few ports, named sources) shrinks the attack path now, uses change windows you already have, and generates the operational confidence — and documentation — the full program needs. Redundant firewalls add availability, not segmentation."},{"q":"Step 3 — enforcement night for the payment VLAN. What separates professionals from cowboys here?","ch":[{"v":"A tested rollback plan, a freeze on other changes, and application owners watching their flows live"},{"v":"Confidence — the flow map was probably right"},{"v":"Doing it Friday 17:00 so the weekend covers any mistake"}],"ok":0,"fb":"The flow map is a hypothesis until enforcement proves it; a <b>tested rollback</b> (previous rule-set snapshot, one-command restore) converts 'probably right' into 'recoverable'. A change freeze stops a second change from poisoning the diagnosis, and app owners watching live cut mean-time-to-recover to minutes. Friday-evening big-bang changes are how 'the weekend covers it' becomes 'the weekend extends it'."},{"q":"Step 4 — a legacy kiosk on the floor still needs card traffic but cannot join the new VLAN. What is the honest answer?","ch":[{"v":"Keep it on a pinned micro-segment with a compensating ACL and a documented exception with expiry"},{"v":"Leave it on the flat network — it is only one device"},{"v":"Disable it and tell the shop to use pen and paper forever"}],"ok":0,"fb":"Every segmentation project meets one unfixable device. The professional pattern: pin it to its own narrow segment, write the compensating ACL (only the exact card-processing flows), and register a <b>documented, expiring exception</b> with an owner — the same discipline as risk acceptance. 'Only one device' is exactly how flat networks repopulate themselves, and 'pen and paper forever' is a decision nobody was asked to make."}]},"ex":"Segmentation fails as a project when it is enforced as one heroic night. The survivable path: observe real flows, clean the any-any rules first (instant risk reduction), enforce with rollback rehearsed and owners watching, and park unfixable devices on pinned micro-segments with expiring exceptions. Each step is also a change-management exercise — which is why the recommendation section of a flat-network finding reads like this, not like 'buy a firewall'.","hi":["Step 1 is about data you already have. Step 3 is about what happens when the hypothesis is wrong."]},
{"t":"multi","th":"A","kw":"retest / fix validation,change management,risk acceptance,remediation timeline","pts":3,"title":"Which findings must be RETESTED before closure?","sc":"The PMO at Harbor Logistics is closing sprint tickets and asks which items need a formal retest by your team before they can be marked 'fixed' — and which close through other verification.","q":"Select the THREE items that require a technical retest before closure.","d":{"n":3,"ch":[{"v":"TLS 1.0/1.1 disabled and HSTS added on the edge (config change)","ok":true},{"v":"PCI VLAN ACLs enforced between user and payment zones","ok":true},{"v":"The reconciliation app rebuilt with parameterized queries for the SQLi","ok":true},{"v":"The awareness training completion tracker reached 94% of staff","ok":false},{"v":"The IR plan document updated to version 4.2","ok":false},{"v":"The compensating controls for the deferred gateway finding verified by the security team","ok":false}]},"ex":"A <b>technical retest</b> replays the original attack or check and proves the door is shut: re-run the TLS scan (protocols gone? HSTS present?), attempt cross-VLAN traffic against the new ACLs, and replay the SQLi payload against the rebuilt app — code changes especially, because remediations for injection are notorious for fixing the reported endpoint and missing its three siblings. The others verify differently: training completion is a <b>record check</b> (you verify attendance, not phishing resistance — that is the simulation's job next quarter), a policy document update is a <b>review</b> of content and approval, and compensating controls are verified on their <b>own cadence</b> defined in the risk acceptance — not the finding's retest. Closure without the right verification type is how 'fixed' tickets reopen during real incidents.","hi":["Ask: can this be proven false by running a technical check again? Then it is a retest."]},
{"t":"drag","th":"D","kw":"alert tuning,detection coverage,SIEM / centralized logging","pts":4,"title":"Triage the four problem alerts","sc":"The SOC lead at Harbor Logistics hands you four alerts the team handles badly and asks what to DO with each: <b>Tune</b> (narrow it — it fires on benign activity), <b>Keep &amp; correlate</b> (true signal, but needs enrichment to be actionable), <b>Deduplicate</b> (one event, a hundred copies), or <b>Escalate</b> (rare, high-value, always wakes someone).","q":"Drag each alert onto the correct handling.","d":{"slots":[{"id":"t","label":"Tune (narrow it)"},{"id":"k","label":"Keep & correlate"},{"id":"d","label":"Deduplicate"},{"id":"e","label":"Escalate always"}],"items":[{"v":"'Possible port scan' firing 400×/day on the vulnerability scanner's own IP","s":"t"},{"v":"'New admin account created' — rare, and every legit creation is change-ticketed","s":"e"},{"v":"'Successful VPN login' firing once per user per morning","s":"d"},{"v":"'LSASS handle opened' — low rate, but needs user+process context to judge","s":"k"}]},"ex":"<b>Tune</b>: the port-scan alert's top talker is your own scanner — exclude the known-good source and keep the rule armed for everyone else; that is tuning, not suppression. <b>Escalate always</b>: new admin account creation is rare and every legitimate one has a change ticket — an alert that pages only when it matters trains analysts to trust the queue. <b>Deduplicate</b>: one VPN login generating one alert per user per morning is an aggregation failure, not a detection — roll them up and alert on the exception (impossible travel, disabled accounts). <b>Keep &amp; correlate</b>: an LSASS handle is a superb signal but means nothing without WHO ran WHAT — correlate with process lineage and user context before it leaves the SOC. Alert quality is a portfolio decision: each alert is tuned, enriched, deduplicated or promoted — never just left to numb the team.","hi":["One alert is the SOC attacking itself, one is a volume problem, one needs friends from other log sources."]},
{"t":"log","th":"B","kw":"NTLMv1 / RC4 legacy auth,Kerberoasting,service account hygiene,patch management","pts":4,"title":"Read the Kerberos traffic like an assessor","sc":"You exported domain-controller security events for Kestrel Bank. The team wants to know which accounts still negotiate legacy crypto — the ones your recommendation will name. Event 4769 = a service ticket was requested; encryption type 0x17 is RC4-HMAC (legacy), 0x12 is AES256 (modern).","q":"Select every line that still requests a service ticket with legacy RC4 (0x17).","d":{"lines":[{"t":"4769 Account: svc_sql  Service: MSSQLSvc/db01  Etype: 0x12 Status: 0x0","ok":false},{"t":"4769 Account: jmovie   Service: cifs/FILESrv01 Etype: 0x17 Status: 0x0","ok":true},{"t":"4769 Account: printer1$ Service: HOST/PRN-04    Etype: 0x17 Status: 0x0","ok":true},{"t":"4769 Account: svc_etl  Service: MSSQLSvc/etl02  Etype: 0x17 Status: 0x0","ok":true},{"t":"4776 Account: jmovie   Package: NTLM   Status: 0x0","ok":false},{"t":"4769 Account: svc_sql  Service: MSSQLSvc/db02  Etype: 0x12 Status: 0x0","ok":false},{"t":"4769 Account: admin_rj Service: HOST/PAW-07    Etype: 0x12 Status: 0x0","ok":false},{"t":"4768 Account: svc_etl  Etype: 0x12 Status: 0x0","ok":false},{"t":"4769 Account: legacy-app$ Service: http/intranet Etype: 0x17 Status: 0x0","ok":true}]},"ex":"Four principals still negotiate <b>RC4-HMAC (0x17)</b>: a user, two machine accounts (a printer and a legacy application host), and one service account. RC4 is the crypto your Kerberoasting finding loves — tickets forged under it crack offline in minutes, which is why the recommendation pairs 'disable RC4 domain-wide' with 'fix these accounts first': migrate services to <b>gMSA</b> (AES by default), replace or upgrade the device that only speaks legacy, and audit user accounts for old Kerberos settings. The 4776 NTLM validation line is context — NTLM still in use — but it is not a 4769 RC4 ticket, and the AES (0x12) lines are the healthy majority. A hardening recommendation names the exact accounts, the exact protocol knob (<code>msDS-SupportedEncryptionTypes</code>), and a verification event to watch after enforcement — because flipping RC4 off in a domain with one forgotten printer is how Monday outages are born.","hi":["Filter on 4769 and the Etype column. 0x12 is the modern one you WANT to see."]},
{"t":"qcm","th":"C","kw":"network segmentation / VLANs,compensating controls,application allowlisting,unnecessary services,patch management","pts":3,"title":"The unpatchable app on the plant floor","sc":"Meridian Foods' MES (manufacturing execution system) runs on an OS that cannot be patched — vendor certification voids on any change, and re-certification takes 14 months. It currently sits on the flat network with local admin rights for the operators.","q":"Which recommendation bundle do you sign?","d":{"ch":[{"v":"Dedicated VLAN with default-deny ACLs, least privilege on the box, IPS virtual patch, expiring exception","ok":true},{"v":"Host firewall on the flat network, quarterly reinstalls from a known-good image, extra monitoring"},{"v":"Move it into the server VLAN next to the patch servers and add it to the monthly patch cycle"},{"v":"Wait out the 14-month re-certification, then patch, and log the finding as closed until then"}]},"ex":"An unpatchable system is compensated, not ignored. The complete bundle: a <b>dedicated VLAN</b> with default-deny ACLs (only the MES's exact flows in and out), <b>least privilege</b> on the box itself (operators run the app, not the OS; extra services and shares removed), an <b>IPS virtual patch</b> upstream that drops the known exploit signatures, and a <b>documented expiring exception</b> in the risk register so the acceptance cannot quietly live forever. The decoys all fail a specific way: a host firewall on the flat network still leaves every host adjacent; moving it toward the server VLAN increases blast radius; and 'wait 14 months' is a bare acceptance with no compensating controls — the exact pattern auditors flag and attackers test. Compensating controls are a package: shrink reachability, shrink privilege, stand in for the patch, and put an expiry on the whole arrangement.","hi":["The right bundle touches the network, the host, the exploit path, and the paperwork — four different knobs."]},
{"t":"order","th":"E","kw":"secure SDLC / code review,change management,input validation,parameterized queries,code signing","pts":7,"title":"Roll out the secure-SDLC improvements in a realistic order","sc":"After your findings (SQLi, XSS, secrets in CI), Ironclad Insurance funds a secure-SDLC program. The engineering leads warn: process that lands before tooling becomes theater, tooling without triage becomes noise. Sequence the rollout.","q":"Drag the steps into the order you recommend (first on top).","d":{"items":["Agree a definition of done that includes security review for touched code paths","Add parameterized-query and output-encoding standards with examples to the developer handbook","Wire SAST and dependency scanning into CI, with a triage rota and severity SLAs","Run the first threat-modeling session on the payments flow","Enforce code signing for release artifacts, signing key held in the vault","Add DAST against the staging environment on every release candidate","Report metrics (open findings by age) to engineering leadership monthly"]},"ex":"The order respects how engineering organizations actually absorb change. <b>Definition of done</b> first: a rule that says 'security review for touched code paths' makes every later tool meaningful — without it, findings have no gate to land in. <b>Standards with examples</b> next: developers cannot parameterize a query they have never seen parameterized; the handbook is the cheapest fix you ship. Then <b>SAST and dependency scanning in CI</b> — but with a triage rota and SLAs, because unowned scanner output trains everyone to ignore it. <b>Threat modeling</b> comes once the team speaks the language — it is a design conversation that needs vocabulary. <b>Code signing</b> for release artifacts (key in the vault, not on a build box) means what runs in production is provably what the pipeline built — and it pairs naturally with the next step. <b>DAST on release candidates</b> validates the whole stack against real requests. Metrics last: open findings by age is what keeps the program honest after the novelty dies. Rolling this order backwards — dashboards before gates — produces the dashboard of doom every security team has seen.","hi":["The first two steps cost almost nothing and make every later step enforceable."]},
{"t":"match","th":"A","kw":"risk treatment options,risk acceptance,compensating controls,business impact,remediation timeline","pts":5,"title":"Pick the correct risk treatment for each scenario","sc":"Kestrel Bank's risk committee asks you to classify five decisions using the four standard treatments — so the register stops listing everything as 'mitigated' by default.","q":"Drag the treatment onto the decision it describes.","d":{"slots":[{"id":"s1","label":"Mitigate"},{"id":"s2","label":"Accept"},{"id":"s3","label":"Transfer"},{"id":"s4","label":"Avoid"},{"id":"s5","label":"Mitigate with compensating controls"}],"items":[{"v":"Ship the vendor's new patch for the edge gateway this week","s":"s1"},{"v":"Sign off the low-risk header finding with a review date, no fix","s":"s2"},{"v":"Buy cyber insurance covering settlement-fraud losses","s":"s3"},{"v":"Decommission the legacy file-transfer server instead of upgrading it","s":"s4"},{"v":"Segment and virtual-patch the unpatchable MES until re-certification","s":"s5"}]},"ex":"Four treatments, five scenarios — because 'mitigate' has a special case. <b>Mitigate</b>: the patch exists, apply it; risk drops by the vendor's fix. <b>Accept</b>: a genuinely low finding (headers) signed with a review date — acceptance is legal ONLY with an owner and expiry, otherwise it is avoidance by paperwork. <b>Transfer</b>: insurance moves the financial consequence, not the vulnerability — the attacker still breaks in; the invoice goes to someone else. <b>Avoid</b>: decommissioning removes the risk by removing the asset — the only treatment with a 100% guarantee. And <b>mitigate with compensating controls</b>: the unpatchable MES gets segmentation, virtual patching and an expiry — risk is reduced by YOUR controls instead of the vendor's patch. Mislabeling treatments matters: an insurer does not patch you, and an acceptance is not a mitigation — the register's honesty is what makes the next audit short.","hi":["One treatment removes the asset itself; one moves money, not risk; one is mitigation without the vendor's help."]},
{"t":"log","th":"C","kw":"cloud security groups,firewall rule cleanup,SIEM / centralized logging,alert tuning,change management","pts":4,"title":"Flag the dangerous cloud guardrail changes","sc":"Meridian Foods runs its workloads in a public cloud. You exported CloudTrail-style API events for the security review. Rules of thumb: security groups opening ingress to the world are findings; changes scoped to the admin VPN CIDR are hygiene.","q":"Select every event that opened a security group to the whole internet (0[.]0[.]0[.]0/0).","d":{"lines":[{"t":"AuthorizeSecurityGroupIngress sg-web-01 proto=tcp port=443 cidr=0[.]0[.]0[.]0/0 user=deploy-ci","ok":true},{"t":"AuthorizeSecurityGroupIngress sg-web-01 proto=tcp port=443 cidr=10[.]60[.]0[.]0/16 user=netops","ok":false},{"t":"RevokeSecurityGroupIngress sg-db-01 proto=tcp port=3389 cidr=0[.]0[.]0[.]0/0 user=netops","ok":false},{"t":"AuthorizeSecurityGroupIngress sg-rds-01 proto=tcp port=5432 cidr=0[.]0[.]0[.]0/0 user=jdev Temporary=true","ok":true},{"t":"CreateSecurityGroup sg-staging-03 vpc=vpc-prod user=deploy-ci","ok":false},{"t":"AuthorizeSecurityGroupIngress sg-rds-01 proto=tcp port=5432 cidr=0[.]0[.]0[.]0/0 user=jdev Temporary=false","ok":true},{"t":"ModifyInstanceAttribute i-4412 instanceType=m5.xlarge user=netops","ok":false},{"t":"AuthorizeSecurityGroupIngress sg-adm-01 proto=tcp port=22 cidr=10[.]60[.]9[.]0/24 user=netops","ok":false}]},"ex":"Three events opened the world in. The web-01 443 open may even be intentional (a public site) — but a recommendation still asks for proof: load-balancer fronting or CDN means the origin never needs 0[.]0[.]0[.]0/0. The two database events are the real findings: <b>port 5432 (PostgreSQL) open to the internet</b>, and the second one written as <code>Temporary=false</code> — the earlier 'temporary' open became permanent, which is exactly how temporary rules die. The revocation line is GOOD news (3389 closed), the staging group creation is neutral until rules attach, and the admin VPN 22 open is scoped hygiene. Recommendations: an SCP/deny guardrail on 0[.]0[.]0[.]0/0 for database ports, SIEM alerting on every <code>AuthorizeSecurityGroupIngress</code> with a public CIDR (tuned: warn for web ports, page for data ports), time-boxed temporary rules that auto-revoke, and change management that treats security-group edits as changes — with tickets, not vibes.","hi":["Two events touch a database port with a public CIDR; one of them says it is not temporary."]},
{"t":"rank","th":"D","kw":"MFA,user awareness training,phishing simulation,patch management,detection coverage,risk-based prioritization","pts":6,"title":"Rank the quick wins by risk reduction per effort","sc":"Harbor Logistics asks for the 'quick wins first' page of your report: maximum risk reduction per unit of effort. Effort ratings from your own estimates: MFA rollout = low (IdP supports it natively), SMBv1 removal = low, EDR on 40 servers = medium, awareness program with simulations = medium, patch backlog burn-down = high (legacy approvals), logging overhaul = high.","q":"Rank from BEST risk-reduction-per-effort (top) to WORST (bottom).","d":{"items":["Enforce MFA on remote access and admin logins (low effort, kills stolen-password attacks)","Remove SMBv1 across the estate (low effort, closes a wormable protocol)","Deploy EDR with tuned alerting on all servers (medium effort, buys detection everywhere)","Launch awareness program with phishing simulations (medium effort, slow-burn human fix)","Burn down the critical patch backlog (high effort, fixes many CVEs at once)","Overhaul logging and SIEM sources (high effort, enables all future detection)"]},"ex":"The ranking is a value-for-effort calculation. <b>MFA</b>: lowest effort in the list because the platform already supports it, and it neutralizes the most common kill chain — the stolen password — across every user at once. <b>SMBv1 removal</b>: nearly free, closes a protocol with wormable history. <b>EDR</b>: medium effort, but it is the safety net for everything prevention misses and the data source every future incident needs. <b>Awareness</b>: medium effort but its returns arrive over quarters, not weeks — still excellent, just slower; simulations make it measurable. <b>Patch backlog</b>: high effort (approval hell, legacy systems) yet real risk reduction — schedule it as a program, not a quick win. <b>Logging overhaul</b>: highest effort and — the counterintuitive part — the least immediate risk reduction, even though detection depends on it; it belongs on the roadmap right after the quick wins. 'Quick win' means risk ÷ effort, not importance: the most valuable program on this list is still last on this page.","hi":["Two items are 'low effort' — one of them stops the most common attack pattern in the world."]},
{"t":"qcm","th":"E","kw":"output encoding / CSP,input validation,WAF / virtual patching,CSRF tokens","pts":3,"title":"Deploying CSP without breaking the portal","sc":"Ironclad Insurance's portal has no Content-Security-Policy. The front-end lead warns: 'A strict CSP on day one breaks the inline scripts everywhere.' The sponsor wants it 'fixed this sprint'.","q":"Which recommendation do you sign?","d":{"ch":[{"v":"Start in report-only mode, review two weeks of violations, then enforce with nonces","ok":true},{"v":"Enforce a strict CSP on day one and allow 'unsafe-inline' so nothing breaks"},{"v":"Skip CSP entirely — the WAF already blocks all the XSS payloads at the edge"},{"v":"Add the CSP as a meta tag on the login page and revisit it next quarter"}]},"ex":"The mature CSP rollout is exactly the three-phase answer: <b>report-only</b> first (the browser reports what WOULD be blocked, users see nothing), a violation review to find the portal's inline habits, then <b>enforcement with nonces or hashes</b> — which legitimizes only the scripts you intended and kills injected ones. 'unsafe-inline' with enforcement is the classic self-defeat: the header exists, the XSS protection does not. A WAF is request-side guesswork — it cannot stop every payload, and it says nothing about third-party script behavior; CSP is the browser-side guarantee. A meta-tag on one page covers one page and cannot express the full policy set. This recommendation also shows respect for the delivery constraint: it FIXES it this sprint (phase one ships immediately) without lying about which phase actually protects users.","hi":["The correct answer starts with a mode that breaks nothing and ends with a mechanism that allows specific scripts only."]},
{"t":"blank","th":"D","kw":"IR playbook,tabletop exercise,containment workflow,offline backups,log retention,business impact","pts":5,"title":"Complete the IR plan upgrade memo","sc":"After the tabletop collapse at Meridian Foods (nobody knew who decides, or where the offline tapes are), the CISO asks you to finish the plan-improvement memo. The template has five gaps.","q":"Fill each blank with the best phrase from the bank.","d":{"pre":"Section 2 replaces the vague 'respond quickly' with a [[1]] — P1 means a domain-wide impact with a 15-minute containment decision, P4 can wait for the morning. Section 3 adds an [[2]] so the on-call engineer never discovers at 03:00 that authority sits with someone on holiday. Section 4 writes the [[3]] as an executable checklist: who isolates, what gets preserved, and which two people verify each step. Section 5 mandates quarterly [[4]] with the actual on-call rotation, replacing the annual slide-show review. Section 6 commits to quarterly restore tests from [[5]] — the backup that has never been restored is a rumor, not a control.","bank":["severity matrix","out-of-hours contact tree","containment workflow","tabletop exercises","offline backups","annual compliance training","unlimited cloud backups","a shared inbox"],"key":["severity matrix","out-of-hours contact tree","containment workflow","tabletop exercises","offline backups"]},"ex":"Each gap maps to a real failure mode from the drill. A <b>severity matrix</b> converts 'respond quickly' into decisions with numbers — P1 gets the 15-minute containment call, P4 does not page anyone. The <b>out-of-hours contact tree</b> removes the single most expensive moment in incident response: deciding who has authority at 03:00. The <b>containment workflow</b> as an executable checklist (who isolates, what is preserved, who verifies) turns panic into procedure — and preserves forensics instead of rebooting evidence away. <b>Tabletops with the real rotation</b> keep the plan synchronized with the humans who will run it; the annual slide-show reviews nobody remembers are compliance theater. And restore tests from <b>offline backups</b> are the only honest measure of ransomware readiness — untested backups have a known failure rate that shockingly approaches 'the day you need them'. Every one of these is a recommendation you can write after any tabletop that goes badly — which is what tabletops are for.","hi":["Three of the five blanks are two-word nouns; the other two are three words. Section 5 happens four times a year with real people."]},
{"t":"term","th":"D","kw":"stale account cleanup,least privilege","pts":3,"title":"Prove the dormant-account finding on the spot","sc":"Your draft report for Meridian Foods claims several local accounts have never been used. The sysadmin disagrees: 'Prove it.' You are on <code>srv-core01</code> with sudo.","q":"Produce the system's own record of last login for every account, so the never-used ones are visible.","d":{"title":"analyst@srv-core01: ~ — bash","prompt":"analyst@srv-core01:~$ ","intro":["Task: show the last-login record for every account on this host.","The output must make never-logged-in accounts obvious."],"help":"No tool names this time — that is the exercise. The system tracks last login per account; one standard command prints the whole table, and it marks accounts that have never logged in.","goals":[{"all":["lastlog"],"demo":"lastlog"}]},"ex":"<code>lastlog</code> reads <code>/var/log/lastlog</code> and prints one row per account, marking unused ones <b>Never logged in</b> — the exact evidence a stale-account recommendation needs. Dormant accounts (departed staff, retired services) are standing attack surface: nobody watches their password, MFA enrollment rots, and a login triggers no alarm because 'that account left months ago'. The recommendation chain: disable or delete the never-used accounts, fold the check into quarterly access recertification, and alert on any login to an account dormant beyond a threshold. Choosing the right tool without a hint — lastlog versus last versus wtmp parsing — is the expert-level part of this exercise; the goal was the evidence, not the syntax.","hi":["The command rhymes with 'last log' and needs no arguments to do the whole job."]},
{"t":"spot","th":"E","kw":"secret management,secure SDLC / code review","pts":2,"title":"Spot the secrets in the pipeline file","sc":"The pipeline file below passed review at Ironclad Insurance. You found it while tracing the CI/CD finding. Two lines leak live credentials.","q":"Click the TWO lines that leak credentials.","d":{"lines":[{"t":"stages: [build, test, deploy]","ok":false},{"t":"deploy_prod:","ok":false},{"t":"  environment: production","ok":false},{"t":"  script:","ok":false},{"t":"    - sshpass -p \"W3stR0ck2024!\" ssh deploy@10[.]60[.]1[.]10 ./release.sh","ok":true},{"t":"    - echo \"vault token: hvs.CI9mQ2...\" >> /tmp/build.log","ok":true},{"t":"    - rm /tmp/build.log || true","ok":false},{"t":"  only: [main]","ok":false}]},"ex":"Two leaks: a hardcoded SSH password on the deploy line (anyone who can read the repo — including the public mirror, per the incident — owns the deploy account) and the <b>vault token written into a build log</b>. The <code>rm</code> line is the trap: deleting the log after the fact does not help — CI logs are already shipped, indexed and retained by the CI system, so the token lives in the artifacts history forever. The recommendations: secrets only as injected, short-lived variables from the vault; secret scanning on commits so the next one never merges; log-scrubbing rules; and a code-review gate for pipeline files (they are code that owns production). Rotating BOTH leaked credentials is the immediate follow-up — and the finding text reminds the client that rotation without the structural fix just schedules the next leak.","hi":["One secret authenticates a shell; the other one unlocks the vault itself. Deleting the file afterwards is not remediation."]},
{"t":"branch","th":"D","kw":"patch management,offline backups,IR playbook,tabletop exercise,detection coverage,honeypot / canary tokens","pts":4,"title":"DUAL PERSPECTIVE — the ransomware operator reads your report","sc":"RED TEAM VIEW: You encrypted Kestrel Bank's file servers last quarter (unpatched VPN, no offline backups, alerts tuned to silence). The bank restored from a lucky snapshot. Now blue asks you — the reformed attacker — what to fix so your playbook dies. Each answer unlocks the next.","q":"Choose the fix that kills each link of your old playbook.","d":{"steps":[{"q":"Step 1 — you entered through the unpatched VPN appliance. What stops the rerun?","ch":[{"v":"Emergency patch SLA for internet-facing gear: criticals in 72 hours, owned by a named role"},{"v":"A second VPN appliance for redundancy"},{"v":"A weekly report of open CVEs to the board"}],"ok":0,"fb":"Your entry was a known CVE with a patch available for weeks. A patch SLA with a named owner and a 72-hour clock for internet-facing criticals is the structural answer; redundancy gives you two unpatched appliances, and reports document the risk while you exploit it."},{"q":"Step 2 — the backup that saved them was a fluke. What makes recovery boring?","ch":[{"v":"Immutable or offline copies on air-gapped storage, restore-tested quarterly, with one copy outside the domain credentials"},{"v":"More backups, all reachable by the same admin account"},{"v":"A backup of the backups, same share"}],"ok":0,"fb":"Ransomware encrypts what the compromised admin account can reach — including online backups. The kill condition is an <b>offline or immutable copy outside those credentials</b>, tested by actual restores on a schedule. 'The restore worked once' is luck; tested, unreachable-from-domain backups are engineering."},{"q":"Step 3 — detection. You moved for six hours unnoticed. What would have caught you fastest?","ch":[{"v":"Canary files on the file servers plus a tuned 'mass file modification' rule that pages within minutes"},{"v":"A bigger firewall"},{"v":"Alerting on every file open, severity critical"}],"ok":0,"fb":"Encryption is loud: thousands of renames in minutes. A <b>canary document</b> that only ransomware touches and a tuned mass-modification rule give minutes-level detection — before the volume finishes. Alert-on-everything was already tried: it trained analysts to ignore the queue, which is exactly why your six hours were quiet."},{"q":"Step 4 — governance. What keeps the next variant from reusing the same gaps?","ch":[{"v":"An updated IR playbook plus twice-yearly tabletops with the real on-call rotation and the findings tracked to closure"},{"v":"Reading the incident report at the all-hands"},{"v":"Requiring the CEO to approve every security purchase"}],"ok":0,"fb":"Incidents repeat when the playbook stays theoretical: update it with what the response actually taught, then <b>tabletop it with the people who will live it</b> — twice a year, tracked findings, owners and dates. All-hands readings fade in a week; executive approval chains just add latency to the next patch SLA. Response readiness is a maintained system, not a document."}]},"ex":"Your old playbook had four dependencies: an unpatched edge, reachable backups, silent movement, and an organization that treats the IR plan as paper. Each dependency has a structural kill: an owned patch SLA, immutable tested backups, canary-plus-tuned-rule detection, and a living playbook drilled by the real rotation. That is the anatomy of a ransomware-resilience recommendation — and every line of it traces back to a moment in the attacker's own story, which is why dual-perspective findings land budgets that scanners never do.","hi":["Step 2 hinges on WHO (and what credentials) can reach the backup. Step 3 hinges on what only ransomware ever touches."]},
{"t":"match","th":"E","kw":"DMARC / SPF / DKIM,DNS & email filtering,CIS Benchmark,DISA STIG,secure baseline","pts":5,"title":"Map each recommendation to its source standard","sc":"A client's compliance team asks WHERE each recommendation comes from — they will only fund items with an authoritative source. Match each finding to the standard or control framework that names it.","q":"Drag the source onto the recommendation it underpins.","d":{"slots":[{"id":"s1","label":"Block the spoofed-supplier mail (SPF/DKIM fail)"},{"id":"s2","label":"Sinkhole newly registered domains at the resolver"},{"id":"s3","label":"Level 1/2 hardening baseline with rationale documents"},{"id":"s4","label":"Stricter-than-CIS guidance for the DC build"},{"id":"s5","label":"Verification requirements for the payments app rewrite"}],"items":[{"v":"DMARC policy enforcement plus mail-gateway filtering","s":"s1"},{"v":"DNS response policy zones / RPZ filtering","s":"s2"},{"v":"CIS Benchmarks","s":"s3"},{"v":"DISA STIG guidance","s":"s4"},{"v":"OWASP ASVS","s":"s5"}]},"ex":"Recommendations land budgets when they carry an authority. The spoofed mail dies with <b>DMARC enforcement</b> (p=reject after the monitoring phase) plus gateway filtering — SPF and DKIM are the authentication records DMARC builds its policy on. The sinkhole recommendation is <b>response-policy-zone filtering</b> at the resolver — the DNS-side control that kills C2 lookups before they leave. The baselines: <b>CIS Benchmarks</b> for the mainstream hardening levels with documented rationale, and <b>DISA STIG</b> where the client needs the stricter, audit-grade guidance (defense supply chains and their contractors usually must). The payments rewrite gets its acceptance bar from <b>OWASP ASVS</b> — a verification standard that says exactly what to test at which level, so 'secure' stops being an adjective and becomes a checklist the pen test can grade against.","hi":["Two answers are DNS or mail controls; two are hardening catalogs; one is an application verification standard."]},
{"t":"multi","th":"C","kw":"NTLMv1 / RC4 legacy auth,patch management,network segmentation / VLANs,change management","pts":3,"title":"Design the NTLMv1 retirement safely","sc":"Your finding: domain-wide NTLMv1 allowed, four legacy devices still negotiate it, and the file servers accept it. The AD team warns: 'Block it Monday and half the plant stops working.' Pick the recommendations that retire it SAFELY.","q":"Select the THREE recommendations that belong in the plan.","d":{"n":3,"ch":[{"v":"Audit NTLM usage first (event 4624 package names, 4776 audits) to build the true dependency list","ok":true},{"v":"Enforce SMB signing everywhere, then flip NTLMv1 to 'audit then deny' via GPO in stages","ok":true},{"v":"Upgrade or segment the four legacy devices, with compensating ACLs meanwhile","ok":true},{"v":"Disable NTLM for the whole domain immediately on Monday and fix breakage after"},{"v":"Allow NTLMv1 permanently for the four legacy devices and document the exception"},{"v":"Replace Kerberos with NTLMv2-only across the estate to simplify the protocols"}]},"ex":"Retiring legacy auth is a program, not a switch. The <b>audit first</b> step builds the real dependency list — every 'we don't use NTLM' claim dies on contact with event logs, and the list is what makes the staged rollout survivable. <b>SMB signing then staged deny</b> kills the relay attacks immediately while the GPO moves NTLMv1 from allowed → audited → denied, so surprises appear in logs before they appear as outages. The <b>legacy devices</b> get engineered answers — firmware upgrades where the vendor shipped one, segmentation with compensating ACLs where they did not — instead of a permanent exemption. Immediate domain-wide disablement fails exactly the way the AD team fears; permanent allowances (with a documented acceptance and expiry, if the business insists) are how 2019 exceptions become 2027 findings; and 'NTLMv2-only' is not a retirement — NTLM remains relayable and un-delegatable, which is why the destination is Kerberos everywhere.","hi":["One recommendation is about knowing, one about enforcing in stages, one about the devices themselves."]},
{"t":"log","th":"A","kw":"risk acceptance,remediation timeline,business impact,executive summary,report audiences","pts":4,"title":"Reconcile the risk register before the board meeting","sc":"Thursday's board pack claims: 'All accepted risks are current, owned and reviewed.' Today is 1 October 2026. You exported the acceptance rows to check that sentence before the executive summary repeats it.","q":"Select every acceptance row that is OVERDUE for review (expired or missing its review date).","d":{"lines":[{"t":"RA-2026-004 | unpatched settlement gateway | owner: COO | accepted: 2026-03-01 | review: 2026-09-01 | impact: high","ok":true},{"t":"RA-2026-007 | missing security headers, careers site | owner: Head of Web | accepted: 2026-08-15 | review: 2027-02-15 | impact: low","ok":false},{"t":"RA-2025-091 | shared service account on the ETL host | owner: (vacant) | accepted: 2025-11-20 | review: 2026-05-20 | impact: high","ok":true},{"t":"RA-2026-011 | TLS 1.0 on legacy partner feed | owner: NetOps Lead | accepted: 2026-06-10 | review: 2026-12-10 | impact: medium","ok":false},{"t":"RA-2026-002 | flat network between plant and office VLANs | owner: Plant Director | accepted: 2026-01-10 | review: (none recorded) | impact: high","ok":true},{"t":"RA-2026-009 | verbose errors on internal wiki | owner: IT Ops | accepted: 2026-07-01 | review: 2027-01-01 | impact: low","ok":false}]},"ex":"Three rows break the board sentence. <b>RA-2026-004</b> expired a month ago — the acceptance is now void, and an expired acceptance on a high-impact settlement gateway is exactly the line the executive summary must NOT paper over; it goes to the board as 'acceptance lapsed, decision required'. <b>RA-2025-091</b> is doubly broken: expired AND ownerless — a risk nobody owns is a risk nobody will ever review. <b>RA-2026-002</b> has no review date at all: an acceptance without expiry is a permanent permission slip, which is not what acceptance means. The recommendations: every acceptance carries an owner (a role, not a vacancy), an expiry, and a review trigger; expired rows auto-escalate to the risk committee; and the register feeds the executive summary mechanically, so the board sentence is computed from the register — never written by hand the night before.","hi":["One row is a month past its date, one has no owner, one has no date at all."]},
{"t":"qcm","th":"B","kw":"MFA,phishing-resistant MFA,least privilege,user awareness training","pts":3,"title":"MFA exists — the attacker still logged in","sc":"Kestrel Bank has MFA on the VPN, yet the incident review shows the attacker logged in as a finance user: the helpdesk reset the user's MFA enrollment after a phone call, and the attacker completed the new enrollment from his own device eleven minutes later.","q":"Which recommendation addresses the root cause?","d":{"ch":[{"v":"A verified MFA-reset workflow: identity proofing, trusted-device re-enrollment, reset alerts","ok":true},{"v":"Force all users to re-enroll MFA monthly so enrollment badges stay fresh and current"},{"v":"Remove MFA from users who fail the phishing simulation twice, then retrain them"},{"v":"Send the helpdesk a reminder e-mail about social-engineering risk each quarter"}]},"ex":"The attack targeted the <b>recovery path</b> — and a control is only as strong as its reset procedure. The fix is identity proofing on resets (video verification or strong knowledge factors, manager confirmation, never caller ID), re-enrollment from a trusted device the user already holds, and monitoring that treats every reset as a privileged event with step-up alerting — because whoever controls enrollment owns the account regardless of password strength. Monthly re-enrollment multiplies the attack surface (more resets, more chances). Punishing simulation failures by REMOVING MFA inverts the control. And a reminder e-mail is not a workflow. This is also why recommendations read the incident, not the checklist: 'we have MFA' was true, and irrelevant — the root cause lived one step beside it.","hi":["The attacker never beat the factor — he beat the process that reissues it."]},
{"t":"term","th":"B","kw":"least privilege,stale account cleanup,tiered admin model","pts":3,"title":"Hunt the UID-0 accounts on the spot","sc":"During the closing review at Meridian Foods, the Unix lead claims only root has UID 0. You have sudo on <code>srv-core01</code> and one shot at the evidence for the report.","q":"List the account names of every account whose UID is 0, so any backdoor account is exposed.","d":{"title":"analyst@srv-core01: ~ — bash","prompt":"analyst@srv-core01:~$ ","intro":["Task: print the names of all accounts with UID 0 on this host."],"help":"No tool names — that is the point. The local account database is colon-separated; one of its fields is the numeric user ID. Filter for the value 0 and print the name field.","goals":[{"all":["awk","\\$3\\s*==\\s*(0|(['\"])0\\2)","passwd"],"demo":"sudo awk -F: '($3==0){print $1}' /etc/passwd"}]},"ex":"<code>sudo awk -F: '($3==0){print $1}' /etc/passwd</code> prints every UID-0 identity — the ground truth behind 'only root is root'. A second UID-0 account is the classic Unix backdoor: it survives root-password rotations, looks like a service account in listings, and holds total power. The recommendation writes itself: verify single-root policy on every host in the baseline scan, alert on any account creation with UID 0, and fold the check into the quarterly recertification. Choosing the tool — awk over grep here, because the filter must match the FIELD, not the substring — is the hard part of this exercise: <code>grep ':0:'</code> also matches GID 0 and group memberships, which would put innocent accounts in your evidence. Precision of the query is part of the finding's credibility.","hi":["Field 3 is the UID. Field 1 is the name you print. The database is /etc/passwd."]}
];
