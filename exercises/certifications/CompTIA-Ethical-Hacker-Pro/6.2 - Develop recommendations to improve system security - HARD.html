<script>
'use strict';
/* ================= Ethical Hacker Pro exam engine (shared framework) ================= */
var S=null;
var THEMES={A:'Risk & Prioritization',B:'Identity & Access',C:'Systems & Network Hardening',D:'Detection & Response Readiness',E:'People & Secure Development'};
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function fmtT(s){s=Math.max(0,s);var m=Math.floor(s/60),ss=s%60;return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
function mk(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function btnLbl(cls,txt,fn,id){var b=mk('button',cls,txt);if(id)b.id=id;b.addEventListener('click',fn);return b;}
function rxi(arr){return arr.map(function(r){return new RegExp(r,'i');});}
function ansOf(i){if(!S.ans[i])S.ans[i]={status:'unchecked',a:{},hints:0,earned:0,chk:null,reviving:false};return S.ans[i];}
function viewOf(i){if(!S.view[i])S.view[i]={};return S.view[i];}
function isLocked(i){var st=S.ans[i];return st&&st.status==='checked'&&!st.reviving;}

/* ---------- intro ---------- */
function renderIntro(){
  var app=$('app');app.innerHTML='';
  var top=mk('div','screen-top');
  top.appendChild(mk('div','brand','Ethical Hacker <span>Pro</span>'));
  top.appendChild(mk('span','badge '+(CONFIG.sev==='hard'?'hard':'med'),CONFIG.sev==='hard'?'HARD':'MEDIUM'));
  top.appendChild(mk('span','mini','Certification practice exam'));
  app.appendChild(top);
  app.appendChild(mk('h1',null,esc(CONFIG.title)));
  var chips=mk('div','chips');
  [['Questions',EX.length],['Time limit',CONFIG.minutes+' min'],['Pass mark','70%'],['Points',''+totalPts()],['Severity',CONFIG.sev==='hard'?'HARD':'MEDIUM']].forEach(function(c){
    chips.appendChild(mk('span','chip','<b>'+c[0]+'</b> '+esc(c[1])));
  });
  app.appendChild(chips);
  var w=mk('div','mini');w.id='welcome';app.appendChild(w);
  app.appendChild(mk('h2',null,'Keywords covered in this exam'));
  var kp=mk('div','card kwpanel');
  PANEL.forEach(function(g){
    var d=mk('div');
    d.appendChild(mk('div','th-t',THEMES[g.t]+' <span class="mini">('+g.t+')</span>'));
    var u=mk('ul');g.k.forEach(function(k){u.appendChild(mk('li',null,esc(k)));});
    d.appendChild(u);kp.appendChild(d);
  });
  app.appendChild(kp);
  app.appendChild(mk('h2',null,'How this exam works'));
  var ins=mk('div','card');var ul=mk('ul','tight');
  ['<b>'+EX.length+' scenario-based exercises</b> mixing many formats: multiple choice, multi-select, drag &amp; drop sorting and matching, fill-in-the-blank, ordering / priority ranking, log &amp; config review with a filter box, an interactive terminal, and branching incident decisions.',
   'Every exercise shows three separated blocks: <b>SCENARIO</b>, <b>QUESTION</b>, and the <b>ANSWERS</b> area.',
   '<b>Check</b> validates your answer, shows green/red/amber marks per element, locks the answer for scoring and <b>pauses the timer in review mode</b> (content stays visible so you can learn). The timer resumes only when you press <b>Next</b>.',
   '<b>Revise</b> re-opens a checked exercise. A new Check re-validates it; the last checked result counts until then.',
   '<b>Skip</b> jumps to the next exercise and marks it amber. You can return to skipped exercises any time before the timer ends or you submit. Skipped exercises are <b>excluded from scoring</b> (neither points earned nor points possible).',
   'Multi-answer exercises give <b>partial credit</b> per correct element. Single-answer exercises are all-or-nothing.',
   '<b>Hint</b> reveals a nudge for <b>\u221210% of that exercise\'s points</b> (never the answer). Using a hint does not pause the timer.',
   'The <b>manual Pause</b> button freezes the timer but hides the exercise so it cannot be studied. The Check-pause and a manual pause can stack; both must clear before time runs again.',
   'The two manual pause behaviours are independent: manual Pause hides/blurs content; Check-pause never hides content.',
   'Submit from the header button, or keep working until the timer ends. You need <b>70%</b> to pass. A detailed report with explanations follows the results screen.',
   'This is the <b>'+CONFIG.sevLabel+'</b> file of chapter '+esc(CONFIG.chapterStr)+'. Its companion severity level is a separate, disjoint exam.'].forEach(function(t){var li=mk('li',null,t);ul.appendChild(li);});
  ins.appendChild(ul);app.appendChild(ins);
  var sb=btnLbl('btn-primary','Start exam',function(){startExam();},'startBtn');
  sb.style.width='100%';sb.style.fontSize='17px';
  app.appendChild(sb);
  updateWelcome();
}
function updateWelcome(){
  var w=$('welcome');if(!w)return;
  var nm=(S&&S.username)||userName;
  w.innerHTML=nm?'Welcome, <b>'+esc(nm)+'</b> \u2014 good luck.':'Ready when you are.';
}
/* ---------- start / state ---------- */
function totalPts(){var t=0;for(var i=0;i<EX.length;i++)t+=EX[i].pts;return t;}
function startExam(){
  S={username:S?S.username:'',order:shuffle(EX.map(function(_,i){return i;})),idx:0,ans:{},view:{},tLeft:CONFIG.minutes*60,manualPause:false,checkPause:false,started:true,finished:false,reported:false};
  renderChrome();renderExamScreen();startTimer();
}
function curEx(){return EX[S.order[S.idx]];}
function curIdx(){return S.order[S.idx];}
/* ---------- chrome (header/nav) ---------- */
function renderChrome(){
  var app=$('app');app.innerHTML='';
  var hdr=mk('div');hdr.id='hdr';
  var row=mk('div','row');
  row.appendChild(mk('div','brand','Ethical Hacker <span>Pro</span>'));
  row.appendChild(mk('span','badge '+(CONFIG.sev==='hard'?'hard':'med'),CONFIG.sev==='hard'?'HARD':'MEDIUM'));
  var ind1=mk('span','pauseInd');ind1.id='indManual';ind1.textContent='\u23F8 Paused (manual)';
  var ind2=mk('span','pauseInd');ind2.id='indCheck';ind2.textContent='\u23F8 Timer paused \u2014 review mode';
  row.appendChild(ind1);row.appendChild(ind2);
  var sp=mk('span','spacer');row.appendChild(sp);
  row.appendChild(mk('span','mini','Exercise <span id="posLbl"></span>'));
  row.appendChild(mk('span','mini','Score <span id="scoreBox" class="kv">0</span>'));
  var tb=mk('span');tb.id='timer';row.appendChild(tb);
  row.appendChild(btnLbl('btn-sm btn-ghost','\u23F8 Pause',toggleManualPause,'pauseBtn'));
  row.appendChild(btnLbl('btn-sm','Submit exam',askSubmit,'submitBtn'));
  hdr.appendChild(row);

function updateChrome(){
  if(!$('timer'))return;
  $('timer').textContent=fmtT(S.tLeft);
  $('timer').className=S.tLeft<300?'low':'';
  var sc=0;for(var i=0;i<EX.length;i++){var a=S.ans[i];if(a&&a.status!=='skipped'&&a.done)sc+=a.earned;}
  $('scoreBox').textContent=(Math.round(sc*10)/10)+' / '+totalPts();
  var done=0;for(i=0;i<EX.length;i++){a=S.ans[i];if(a&&(a.status==='checked'||a.status==='skipped'))done++;}
  $('pfill').style.width=(100*done/EX.length)+'%';
  $('posLbl').textContent=(S.idx+1)+' / '+EX.length;
  $('indManual').className='pauseInd'+(S.manualPause?' show':'');
  $('indCheck').className='pauseInd'+(S.checkPause?' show':'');
  $('pauseBtn').innerHTML=S.manualPause?'\u25B6 Resume':'\u23F8 Pause';
  var th={};for(i=0;i<EX.length;i++){var ex=EX[i];a=S.ans[i];if(a&&a.status==='skipped')continue;if(!th[ex.th])th[ex.th]={e:0,p:0};th[ex.th].p+=ex.pts;if(a&&a.done)th[ex.th].e+=a.earned;}
  var trw=$('themeRow');trw.innerHTML='';
  Object.keys(THEMES).forEach(function(k){
    var d=th[k]||{e:0,p:0};var pct=d.p?Math.round(100*d.e/d.p):0;
    trw.appendChild(mk('div','tp','<span>'+k+' \u00b7 '+esc(THEMES[k].split(' ')[0])+' '+pct+'%</span><div class="bar"><div style="width:'+pct+'%"></div></div>'));
  });
  var nv=$('nav');nv.innerHTML='';
  S.order.forEach(function(exId,pos){
    var a=S.ans[exId];var cls='';var glyph='';var state='';
    if(a&&a.status==='skipped'){cls='skipped';glyph='\u21AA ';state=', skipped';}
    else if(a&&a.chk){cls=(a.earned>0)?'done':'zero';glyph=(a.earned>0)?'\u2713 ':'\u2717 ';state=(a.earned>0)?', checked with points':', checked, zero points';}
    if(pos===S.idx)cls+=' cur';
    var b=mk('button',cls,glyph+(pos+1));
    b.title='Exercise '+(pos+1)+state;b.setAttribute('aria-label','Go to exercise '+(pos+1)+state);
    b.addEventListener('click',function(){goTo(pos);});
    nv.appendChild(b);
  });
}
/* ---------- timer ---------- */
var tickIv=null;
function startTimer(){
  if(tickIv)clearInterval(tickIv);

    if(!S||!S.started||S.finished||S.manualPause||S.checkPause)return;
    S.tLeft--;
    if(S.tLeft<=0){S.tLeft=0;updateChrome();finishExam('time');return;}
    $('timer').textContent=fmtT(S.tLeft);
    $('timer').className=S.tLeft<300?'low':'';

}
function toggleManualPause(){

/* ---------- navigation ---------- */
function leaveCurrent(){
  var st=S.ans[curIdx()];
  if(st&&st.reviving){st.reviving=false;if(st.prevChk)st.chk=st.prevChk;}
}
function goTo(pos){

}
function nextEx(){

function attachDrag(c,ii){

    v.out.push({c:'info',t:ex.d.help});

  }else{
    var norm=cmd.replace(/\s+/g,' ').toLowerCase();
    var hitAny=false;
    ex.d.goals.forEach(function(g,i){
      if(st.a.done[i])return;
      var ok=g.all.every(function(rx){return new RegExp(rx,'i').test(norm);})&&(!g.not||g.not.every(function(rx){return !(new RegExp(rx,'i')).test(norm);}));
      if(ok){st.a.done[i]=true;hitAny=true;
        v.out.push({c:'ok',t:g.echo||('\u2713 good \u2014 accepted: '+g.demo),g:i});
        out.appendChild(mk('div','ok',esc(g.echo||('\u2713 good \u2014 accepted: '+g.demo))));
      }
    });
    if(!hitAny){
      v.out.push({c:'err',t:'no matching result \u2014 check the task wording (type help for a nudge)'});
      out.appendChild(mk('div','err',esc('no matching result \u2014 check the task wording (type help for a nudge)')));
    }
  }
  out.scrollTop=out.scrollHeight;
}
/* ---------- branching ---------- */
function renderBranch(ex,st){
  var v=viewOf(curIdx());
  if(st.a.step==null){st.a.step=0;st.a.picks=[];}
  if(!v.bcho)v.bcho=ex.d.steps.map(function(sd){return shuffle(sd.ch.map(function(_,ci){return ci;}));});
  var box=$('ansArea');
  box.appendChild(mk('div','blockLabel lbl-a','DECIDE \u2014 EACH CHOICE UNLOCKS THE NEXT STEP'));
  var hold=mk('div');
  var last=Math.min(st.a.step,ex.d.steps.length-1);
  for(var s=0;s<=last;s++){
    var sd=ex.d.steps[s];
    var card=mk('div','card');
    card.appendChild(mk('div','stepTag','STEP '+(s+1)+' / '+ex.d.steps.length));
    card.appendChild(mk('div',null,sd.q));
    var picked=st.a.picks[s];
    v.bcho[s].forEach(function(ci,disp){
      var c=sd.ch[ci];
      var b=mk('button','opt','<span class="box">'+LETTERS[disp]+'</span><span>'+c.v+'</span>');
      if(picked!=null){
        b.disabled=true;
        if(ci===sd.ok){b.className+=' ok';b.querySelector('.box').textContent='\u2713';}
        else if(ci===picked){b.className+=' no';b.querySelector('.box').textContent='\u2717';}
      }else if(s===st.a.step&&!st.chk&&!isLocked(curIdx())){
        (function(sx,cix){b.addEventListener('click',function(){pickStep(sx,cix);});})(s,ci);
      }else b.disabled=true;
      card.appendChild(b);
    });
    if(picked!=null&&!st.chk){
      var fb=mk('div','stepFb show '+(picked===sd.ok?'good':'bad'));
      fb.innerHTML=(picked===sd.ok?'<b class="mk-ok">\u2713 Good call.</b> ':'<b class="mk-no">\u2717 Not the best move.</b> ')+sd.fb;
      card.appendChild(fb);
      if(s===st.a.step&&s<ex.d.steps.length-1){
        (function(sx){var cb=btnLbl('btn-primary','Continue \u2192',function(){var stx=ansOf(curIdx());if(stx.a.picks[sx]==null)return;stx.a.step=sx+1;renderExamScreen();});card.appendChild(cb);})(s);
      }
      if(s===st.a.step&&s===ex.d.steps.length-1){
        card.appendChild(mk('div','mini','All steps decided \u2014 press Check above to score this exercise.'));
      }
    }
    hold.appendChild(card);
  }
  box.appendChild(hold);
}
function pickStep(s,ci){
  var st=ansOf(curIdx());st.a.picks[s]=ci;renderExamScreen();
}
/* ---------- dispatch ---------- */
function renderAnswer(ex,st){
  if(S.lastRi!==S.idx){_sel=null;_selWord=null;S.lastRi=S.idx;}
  if(ex.t==='qcm'||ex.t==='multi')renderChoice(ex,st);
  else if(ex.t==='drag'||ex.t==='match')renderSlots(ex,st);
  else if(ex.t==='order'||ex.t==='rank')renderOrder(ex,st);
  else if(ex.t==='log'||ex.t==='spot')renderLines(ex,st);
  else if(ex.t==='blank')renderBlank(ex,st);
  else if(ex.t==='term')renderTerm(ex,st);
  else if(ex.t==='branch')renderBranch(ex,st);
}
/* ---------- validation ---------- */
function validate(ex,st){
  var res={frac:0,marks:{},itemMarks:{},posMarks:{},lineMarks:{},blankMarks:{},msg:'',detail:''};
  var i=curIdx();
  if(ex.t==='qcm'||ex.t==='multi'){
    var sel=st.a.sel||[];
    var nOk=0,okIdx=ex.d.ch.map(function(c,k){return c.ok?k:-1;}).filter(function(k){return k>=0;});
    ex.d.ch.forEach(function(c,k){
      var picked=sel.indexOf(k)>=0;
      if(c.ok&&picked){res.marks[k]='ok';nOk++;}
      else if(c.ok&&!picked){res.marks[k]='miss';}
      else if(!c.ok&&picked){res.marks[k]='no';}
    });
    if(ex.t==='multi'){res.frac=nOk/ex.d.n;res.msg=nOk+' of '+ex.d.n+' correct elements identified';}
    else{res.frac=(nOk===1&&sel.length<=1)?1:0;res.msg=res.frac===1?'Correct':'Wrong choice';}
  }
  else if(ex.t==='drag'||ex.t==='match'){
    var n=ex.d.items.length,nGood=0;
    ex.d.items.forEach(function(it,k){
      var placed=st.a.place?st.a.place[k]:null;
      if(placed===it.s){res.itemMarks[k]='ok';nGood++;}
      else if(placed!=null){res.itemMarks[k]='no';}
      else{res.itemMarks[k]='miss';}
    });
    res.frac=nGood/n;res.msg=nGood+' of '+n+' items placed correctly'+(nGood<n?' (unplaced items score 0)':'');
  }
  else if(ex.t==='order'||ex.t==='rank'){
    n=ex.d.items.length;var nPos=0;
    for(var p=0;p<n;p++){var ii=st.a.ord[p];res.posMarks[p]=(ii===p)?'ok':'no';if(ii===p)nPos++;}
    res.frac=nPos/n;res.msg=nPos+' of '+n+' positions correct';
  }
  else if(ex.t==='log'||ex.t==='spot'){
    var nEv=0,nSel=0;
    ex.d.lines.forEach(function(L,k){if(L.ok)nEv++;});
    ex.d.lines.forEach(function(L,k){
      var s=st.a.sel[k];
      if(L.ok&&s){res.lineMarks[k]='ok';nSel++;}
      else if(!L.ok&&s){res.lineMarks[k]='no';}
      else if(L.ok&&!s){res.lineMarks[k]='miss';}
    });
    res.frac=nEv?nSel/nEv:0;res.msg=nSel+' of '+nEv+' evidence lines found';
  }
  else if(ex.t==='blank'){
    n=ex.d.key.length;var nB=0;
    ex.d.key.forEach(function(kv,k){var v=st.a.fill[k];if(v===kv){res.blankMarks[k]='ok';nB++;}else res.blankMarks[k]='no';});
    res.frac=nB/n;res.msg=nB+' of '+n+' blanks correct';
  }
  else if(ex.t==='term'){
    var nG=ex.d.goals.length,nD=0;
    ex.d.goals.forEach(function(g,k){if(st.a.done&&st.a.done[k]){nD++;res.marks[k]='ok';}else res.marks[k]='no';});
    res.frac=nG?nD/nG:0;res.msg=nD+' of '+nG+' command goals met';
  }
  else if(ex.t==='branch'){
    n=ex.d.steps.length;var nS=0;
    ex.d.steps.forEach(function(sd,k){
      var p=st.a.picks[k];
      if(p===sd.ok)nS++;
    });
    res.frac=nS/n;res.msg=nS+' of '+n+' decision steps correct';
  }
  return res;
}
/* ---------- check / skip / hint / revise ---------- */
function doCheck(){
  var i=curIdx(),ex=EX[i],st=ansOf(i);
  if(S.finished)return;
  var res=validate(ex,st);
  st.chk=res;
  st.prevChk=null;
  st.done=true;
  var base=res.frac*ex.pts;
  var ded=ex.pts*0.1*(st.hints||0);
  st.earned=Math.max(0,Math.round((base-ded)*100)/100);
  st.status='checked';st.reviving=false;
  S.checkPause=true;
  renderExamScreen();
}
function doSkip(){
  if(S.finished)return;
  leaveCurrent();
  var i=curIdx(),st=ansOf(i);
  st.status='skipped';st.reviving=false;st.chk=null;st.earned=0;
  S.checkPause=false;
  if(S.idx<EX.length-1){S.idx++;renderExamScreen();}
  else{updateChrome();askSubmit();}
}
function doHint(){
  var i=curIdx(),ex=EX[i],st=ansOf(i);
  if(st.hints>=(ex.hi?ex.hi.length:0))return;
  st.hints=(st.hints||0)+1;
  renderExamScreen();
}
function renderHints(ex,st){
  var hb=$('hintArea');
  var html='<b>Hints used ('+st.hints+') \u2014 \u2212'+(10*st.hints)+'% of this exercise:</b><ul class="tight">';
  for(var k=0;k<st.hints&&k<ex.hi.length;k++)html+='<li>'+ex.hi[k]+'</li>';
  html+='</ul>';
  hb.innerHTML=html;hb.className='hintBox show';
  var hb2=$('hintBtn');if(hb2)hb2.disabled=st.hints>=ex.hi.length;
}
function doRevise(){
  var i=curIdx(),ex=EX[i],st=ansOf(i);
  if(!st.chk)return;
  st.prevChk=st.chk;
  st.chk=null;
  if(ex.t==='term')st.a.done=ex.d.goals.map(function(){return false;});
  if(ex.t==='branch'){st.a.step=0;st.a.picks=[];}
  st.reviving=true;
  renderExamScreen();
}
/* ---------- feedback + explanation ---------- */
function showCheckResult(ex,st){
  var res=st.chk;
  var fb=$('fbArea');fb.className='feedback show '+(res.frac>=0.999?'good':(res.frac<=0.001?'bad':'part'));
  var label=res.frac>=0.999?'\u2713 FULL CREDIT':(res.frac<=0.001?'\u2717 ZERO':'\u26A0 PARTIAL');
  var ded=ex.pts*0.1*(st.hints||0);
  var html='<div class="fbHead">'+label+' \u2014 '+esc(res.msg)+'</div>';
  html+='<div>You earned <b>'+(Math.round(st.earned*10)/10)+' / '+ex.pts+'</b> points on this exercise.';
  if(st.hints>0)html+=' (includes a \u2212'+(Math.round(ded*100)/100)+' pt hint penalty: '+st.hints+' \u00D7 10%)';
  html+='</div>';
  if(st.status==='checked'&&!st.reviving)html+='<div class="mini">Timer is frozen in review mode \u2014 it resumes when you press Next. Use Revise to change your answer (a new Check applies the timer pause again).</div>';
  fb.innerHTML=html;
  var xp=$('exArea');xp.className='explain show';
  xp.innerHTML='<span class="xt">WHY \u2014 explanation</span><br>'+ex.ex;
  $('reviseBtn').disabled=st.reviving;
}

/* ---------- submit & results ---------- */
function answeredCount(){var n=0;for(var i=0;i<EX.length;i++){var a=S.ans[i];if(a&&a.status==='checked')n++;}return n;}
function skippedList(){var r=[];S.order.forEach(function(exId){var a=S.ans[exId];if(a&&a.status==='skipped')r.push(exId);});return r;}
function askSubmit(){
  if(!S||S.finished)return;
  var old=$('modal');if(old)old.remove();
  var nAns=answeredCount(),nSkip=skippedList().length,nUn=EX.length-nAns-nSkip;

  ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Submit exam confirmation');
  var c=mk('div','card');c.style.maxWidth='480px';c.style.width='100%';
  c.appendChild(mk('h2',null,'Submit exam?'));

  c.appendChild(mk('p','mini','Skipped exercises are excluded from scoring (removed from both points earned and points possible). The timer keeps running until you confirm.'));
  var warn=mk('p','mk-no');

function finishExam(){
  if(!S||S.finished)return;
  leaveCurrent();
  S.checkPause=false;S.manualPause=false;
  if($('pauseOverlay'))$('pauseOverlay').className='';

function computeTotals(){
  var earned=0,possible=0;
  EX.forEach(function(ex,i){
    var a=S.ans[i];
    if(a&&a.status==='skipped')return;
    possible+=ex.pts;
    if(a&&a.earned)earned+=a.earned;
  });
  return {earned:Math.round(earned*10)/10,possible:possible};
}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'\u2026':s;}
function slotLabel(ex,id){var s=ex.d.slots.filter(function(x){return x.id===id;})[0];return s?s.label:'(bank)';}
function summarize(ex,st,exId){
  var ys='',cs='';
  if(ex.t==='qcm'||ex.t==='multi'){
    var sel=st.a.sel||[];
    ys=sel.length?sel.map(function(k){return '\u2022 '+trunc(ex.d.ch[k].v,80);}).join('<br>'):'(no choice made)';
    cs=ex.d.ch.map(function(c,k){if(c.ok)return '\u2022 '+trunc(c.v,80);}).filter(Boolean).join('<br>');
  }else if(ex.t==='drag'||ex.t==='match'){
    ys=ex.d.items.map(function(it,k){var p=st.a.place?st.a.place[k]:null;return '\u2022 '+trunc(it.v,60)+' \u2192 '+(p?esc(slotLabel(ex,p)):'<i>not placed</i>');}).join('<br>');
    cs=ex.d.items.map(function(it){return '\u2022 '+trunc(it.v,60)+' \u2192 '+esc(slotLabel(ex,it.s));}).join('<br>');
  }else if(ex.t==='order'||ex.t==='rank'){
    ys=(st.a.ord||[]).map(function(ii,p){return (p+1)+'. '+trunc(ex.d.items[ii],70);}).join('<br>');
    cs=ex.d.items.map(function(t,p){return (p+1)+'. '+trunc(t,70);}).join('<br>');
  }else if(ex.t==='log'||ex.t==='spot'){
    var selL=[];ex.d.lines.forEach(function(L,k){if(st.a.sel&&st.a.sel[k])selL.push(L.t);});
    ys=selL.length?selL.map(function(t){return '\u2022 <span class="mono">'+esc(trunc(t,90))+'</span>';}).join('<br>'):'(nothing selected)';
    cs=ex.d.lines.filter(function(L){return L.ok;}).map(function(L){return '\u2022 <span class="mono">'+esc(trunc(L.t,90))+'</span>';}).join('<br>');
  }else if(ex.t==='blank'){
    var fl=st.a.fill||[];
    ys=fl.length?fl.map(function(w,k){return (k+1)+': '+(w?esc(w):'<i>empty</i>');}).join(' \u00b7 '):'(not answered)';
    cs=ex.d.key.map(function(kv,k){return (k+1)+': '+esc(kv);}).join(' \u00b7 ');
  }else if(ex.t==='term'){
    var v=S.view?S.view[exId]:null;
    ys=(v&&v.out?v.out.filter(function(o){return o.c==='in';}).map(function(o){return '\u2022 <span class="mono">'+esc(trunc(o.t,90))+'</span>';}).join('<br>'):'')||'(no commands run)';
    cs=ex.d.goals.map(function(g){return '\u2022 <span class="mono">'+esc(g.demo)+'</span>';}).join('<br>');
  }else if(ex.t==='branch'){
    var pk=st.a.picks||[];
    ys=ex.d.steps.map(function(sd,k){var p=pk[k];return 'Step '+(k+1)+': '+(p!=null?trunc(sd.ch[p].v,70):'<i>not answered</i>');}).join('<br>');
    cs=ex.d.steps.map(function(sd,k){return 'Step '+(k+1)+': '+trunc(sd.ch[sd.ok].v,70);}).join('<br>');
  }
  return {ys:ys,cs:cs};
}
function renderResults(){

  if(passed){

  }else{
    panel.innerHTML+='<h2>\u2717 FAIL \u2014 retake required</h2><p>You needed 70%. Study the report below \u2014 focus on every item marked <b>zero</b> or <b>partial</b> \u2014 then press Retake Exam. Questions and answer choices are reshuffled on the next attempt.</p>';
  }
  var rb=btnLbl('btn-primary','\u21BB Retake exam',function(){startExam();});

  if(skips.length){

  }
  app.appendChild(stCard);

  S.order.forEach(function(exId,pos){
    var ex=EX[exId],a=S.ans[exId]||{a:{}};
    var item=mk('div','repItem');
    var tag= a&&a.status==='skipped'?'skipped':(a&&a.chk?(a.earned>=ex.pts-0.001?'full':(a.earned<=0?'zero':'partial')):'zero');
    var tagTxt=a&&a.status==='skipped'?'SKIPPED \u2014 NOT COUNTED':(a&&a.chk?(tag==='full'?'FULL':(tag==='zero'?'ZERO':'PARTIAL')):'NOT CHECKED \u2014 COUNTS AS 0');
    var rh=mk('div','rh');
    rh.innerHTML='<b>'+(pos+1)+'. '+esc(ex.title)+'</b><span class="tag '+tag+'">'+tagTxt+'</span><span class="kv">'+(a&&a.chk?(Math.round(a.earned*10)/10):0)+' / '+ex.pts+'</span>';
    var body=mk('div','repBody');
    var s=a?summarize(ex,a,exId):null;

    if(a&&a.status==='skipped')h+='<div class="mini">This exercise was skipped, so it was excluded from both the points you earned and the points possible.</div>';
    h+='<div class="explain show" style="margin-top:8px"><span class="xt">WHY \u2014 explanation</span><br>'+ex.ex+'</div>';
    body.innerHTML=h;
    rh.addEventListener('click',function(){body.className=body.className.indexOf('show')>=0?'repBody':'repBody show';});
    item.appendChild(rh);item.appendChild(body);

  });
  app.appendChild(mk('p','mini','Severity: '+esc(CONFIG.sevLabel)+'. The chapter also has a companion exam at the other severity level with disjoint exercises.'));
  window.scrollTo(0,0);
}
