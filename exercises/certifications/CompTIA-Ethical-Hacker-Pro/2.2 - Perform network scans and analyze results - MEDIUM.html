<script>
/* ===== MEDIUM data, part 1 (Q01–Q10) ===== */
function X(id,type,theme,cs,o){o.id=id;o.type=type;o.theme=theme;o.cs=cs;return o;}
var M1=[
X('m01','order','A · Scan types','Confirm scope/RoE → host discovery → port scan → versions → OS → document',{
scenario:'<p>You have just joined the Nortshield Security pentest team. Your lead hands you a signed rules-of-engagement sheet for a small office network: <code>192[.]168[.]50[.]0/24</code>. The client wants a full picture of exposed services, and the lead says: “Plan the work first.”</p>',
question:'Put the scan-methodology steps in the correct order. The first step goes at the top.',
data:{items:[
'Confirm the scope and the rules of engagement',
'Run a host discovery sweep to find live machines',
'Scan ports on the live hosts',
'Fingerprint the service versions on open ports',
'Fingerprint the operating systems',
'Document the findings and report them'
]},
hint:'Ask what you need before each step: permission before everything, live hosts before ports, open ports before versions.',
expl:'<p>A scan is a process, not one command. You first confirm <b>what you are allowed to touch</b>, because scanning outside the scope is illegal even by accident.</p><ul><li>Host discovery comes first: port-scanning dead hosts wastes time and makes noise.</li><li>Port scanning comes next: you cannot fingerprint a service on a port you have not found.</li><li>Version fingerprinting (<code>-sV</code>) says <b>what</b> is running; OS fingerprinting (<code>-O</code>) says <b>on what kind of system</b>.</li><li>Documentation is last but never optional — results that are not written down are lost.</li></ul>'}),
X('m02','fill','E · Evasion & detection','Idle scan: zombie · idle · IP ID · +2 = open',{
scenario:'<p>A red-team colleague shows you a scan result for the client’s ticketing server. Your name and your IP address appear nowhere in the target logs. The firewall log shows the scan coming from a network printer. “That,” she says, “is an idle scan (<code>-sI</code>). The printer is our zombie.”</p>',
question:'Complete the summary sentences about idle scans. Click the words into the blanks.',
data:{text:'An idle scan makes the port scan appear to come from another machine, called the {{0}} . The zombie must be {{1}} on the network, because any extra traffic changes the value we watch: the zombie’s {{2}} counter. If that counter rises by {{3}} during one probe, the target port is open.',
bank:['zombie','idle','IP ID','2','busy','MAC'],
ans:['zombie','idle','IP ID','2']},
hint:'Three blanks describe the zombie: what it is, its state, and its counter. The last blank is a small number.',
expl:'<p>An idle scan uses a third machine (the <b>zombie</b>) so the real scanner stays invisible. It works only when the zombie is <b>idle</b>: every extra packet the zombie sends changes its <b>IP ID</b> counter, which is the signal we read.</p><ul><li>If the target port is open, the target sends a SYN/ACK to the zombie; the zombie answers with an RST, so its IP ID goes up by <b>2</b> (that RST plus your own poll).</li><li>A rise of 1 usually means the port is closed. No rise means the probe was filtered.</li><li>The zombie’s <b>MAC address</b> plays no role here — ARP stays on the local wire and is not what we watch.</li></ul>'}),
X('m03','terminal','B · Scanner tooling','nmap -sn 192[.]168[.]12[.]0/24',{
scenario:'<p>You are on the attack box for the Halvorsen Retail engagement. The rules of engagement are signed and the scope is <code>192[.]168[.]12[.]0/24</code>. The lead says: “First tell me which machines are alive. Do not touch their ports yet.”</p>',
question:'Type the command: run a <b>nmap ping sweep</b> (host discovery only, no port scan) against the whole /24 network.',
data:{prompt:'analyst@attackbox:~$',
rules:{tool:'nmap',mustAll:[],mustAny:[['-sn','-sP']],banned:['-sS','-sT','-sU','-sA','-sV','-O','-p'],contains:['192[.]168[.]12[.]0/24']},
goalShort:'nmap host discovery (ping sweep) of 192[.]168[.]12[.]0/24 with no port scan',
helpText:'Lab help: this exercise wants a nmap host-discovery sweep. The -sn flag means "ping scan, no port scan". Give the network in CIDR form, like a[.]b[.]c[.]0/24.',
sample:'Starting Nmap 7.94 (scan engine)\nNmap scan report for 192[.]168[.]12[.]1\nHost is up (0.0012s latency).\nNmap scan report for 192[.]168[.]12[.]7\nHost is up (0.0009s latency).\nNmap done: 256 IP addresses (7 hosts up) scanned in 2.31 seconds',
example:'nmap -sn 192[.]168[.]12[.]0/24'},
hint:'Command family: nmap. One flag means “host discovery only”. The target is the whole /24 network.',
expl:'<p><code>nmap -sn 192[.]168[.]12[.]0/24</code> is a <b>ping sweep</b>: nmap sends discovery probes (ARP on the local subnet, echo requests and TCP pings elsewhere) and lists the hosts that answer. It does <b>not</b> scan ports, so the machines are barely touched.</p><ul><li><b>-sn</b> means “skip the port scan”. Older nmap versions used <code>-sP</code> for the same thing; the lab accepts it too.</li><li>The <b>/24</b> after the address means “this whole 256-address network”.</li><li>Adding <code>-sS</code>, <code>-sV</code> or <code>-p</code> would turn this into a port scan — that was not the request.</li></ul>'}),
X('m04','logview','C · Reading results','filtered = no reply or ICMP blocked message',{
scenario:'<p>You ran a SYN scan (<code>-sS</code>) from the attack box against an internal file server. Here is the raw output.</p>',
question:'Port 3389 shows <b>filtered</b>. What did nmap most likely observe to decide that?',
data:{logs:[
'$ nmap -sS 10[.]0[.]5[.]20',
'Starting Nmap 7.94',

expl:'<p>In a SYN scan every reply has a fixed meaning. A <b>SYN/ACK</b> means the port is <b>open</b>. An <b>RST</b> means the port is <b>closed</b> (nothing listens there, but the host itself answered). <b>Filtered</b> means the probe never got a real answer: either nothing came back after several retries, or an ICMP message said the traffic is not allowed (for example type 3 code 13, “communication administratively prohibited”).</p><ul><li>A filtering device between you and the host is the usual cause of a filtered result.</li><li>“Filtered” never proves the service is running or absent — you simply do not know.</li><li>FIN probes belong to the FIN scan type, not to how a SYN scan reads replies.</li></ul>'}),

data:{ch:[

{t:'TCP Connect scan (-sT)',ok:false},
{t:'FIN scan',ok:true},
{t:'NULL scan',ok:true},
{t:'Xmas scan',ok:true}]},
hint:'Four of the five never finish a handshake. The one that does behaves exactly like a normal program opening a connection.',
expl:'<p>The three-way handshake is SYN → SYN/ACK → ACK. Only the <b>TCP Connect scan</b> performs all three steps (the operating system does it for nmap), so it is the one that completes the handshake — and the one that shows up in application logs.</p><ul><li><b>SYN scan</b> stops after the SYN/ACK: nmap sends RST instead of the final ACK, so the connection never completes. That is why it is called <b>half-open</b>.</li><li><b>FIN, NULL and Xmas scans</b> send packets that cannot legally open a connection at all (FIN only, no flags, or FIN+PSH+URG together), so no handshake can ever form.</li></ul>'}),

hint:'One flag starts, one answers, one says goodbye nicely, one slams the door, one delivers without waiting.',
expl:'<p>The flags you see during a scan:</p><ul><li><b>SYN</b> starts every TCP connection — a scan full of SYNs with no completions is a SYN (half-open) scan.</li><li><b>ACK</b> confirms data (and, in an ACK scan, is used to probe firewall rules).</li><li><b>FIN</b> closes politely; a scan made only of FINs exploits the rule that open ports should ignore such packets.</li><li><b>RST</b> aborts instantly — the standard “nothing listens here” answer of a closed port.</li><li><b>PSH</b> tells the receiver to hand the data to the application right away; a Xmas scan lights up FIN, PSH and URG together.</li></ul>'}),

/* ---------- timer ---------- */
var lastTick=0;
function startTimerLoop(){
  lastTick=Date.now();
  setInterval(function(){
    var now=Date.now();var dt=(now-lastTick)/1000;lastTick=now;
    if(!S||!S.started||S.finished)return;
    if(S.pManual||S.pCheck)return;
    S.remaining-=dt;
    if(S.remaining<=0){S.remaining=0;renderTimer();finish('time');return;}
    renderTimer();
  },250);
}
function renderTimer(){
  var t=$('#tTimer');if(!t)return;
  t.textContent=fmtTime(S.remaining);
  var frac=S.remaining/CFG.timerSeconds;
  t.className='timer mono'+(frac<=0.1?' crit':(frac<=0.25?' low':''));
}
function renderPind(){
  var p=$('#tPind');var parts=[];
  if(S.pCheck)parts.push('<span class="pind check">⏸ Timer paused — review mode (press Next to resume)</span>');
  if(S.pManual)parts.push('<span class="pind manual">⏸ Paused (manual) — content hidden</span>');
  p.innerHTML=parts.join(' ');
}
function togglePause(){
  if(!S.started||S.finished)return;
  S.pManual=!S.pManual;
  $('#bPause').textContent=S.pManual?'Resume':'Pause';
  $('#bPause').setAttribute('aria-pressed',S.pManual?'true':'false');
  applyPauseView();renderPind();
}
function applyPauseView(){
  var area=$('#exArea');if(!area)return;
  var wrap=$('.exwrap',area);
  var hasOvl=$('.ovl',area);
  if(S.pManual&&!hasOvl){
    if(wrap)wrap.classList.add('blurred');
    var o=el('div','ovl');o.setAttribute('role','status');o.innerHTML='<div style="text-align:center"><div style="font-size:20px;font-weight:800;letter-spacing:2px">PAUSED (MANUAL)</div><div class="muted" style="font-size:14px;margin-top:6px">Content is hidden while the clock is stopped.<br>Press Resume in the header to continue.</div></div>';
    area.appendChild(o);
  }else if(!S.pManual&&hasOvl){
    if(wrap)wrap.classList.remove('blurred');hasOvl.remove();
  }
  if(S.pManual){['#bCheck','#bSkip','#bHint','#bPrev','#bNext'].forEach(function(s){var b=$(s);if(b)b.disabled=true;});}
  else{updateButtons();}
}

/* ---------- QCM (single choice, all-or-nothing) ---------- */
function mkQCM(c,ex){
  var d=ex.data,a0=ans(ex.id);a0.ord=a0.ord||{};
  var ord=a0.ord.qcm||(a0.ord.qcm=shuf(d.ch.map(function(_,i){return i;})));
  var box=el('div');box.setAttribute('role','radiogroup');box.setAttribute('aria-label','choose one answer');
  var inputs=[];
  ord.forEach(function(ci){
    var ch=d.ch[ci];
    var l=el('label','opt');var inp=document.createElement('input');
    inp.type='radio';inp.name='r_'+ex.id;inp.value=String(ci);
    l.appendChild(inp);l.appendChild(el('span',null,ch.t));l.appendChild(el('span','mk',''));
    box.appendChild(l);
    l.addEventListener('click',function(){inputs.forEach(function(o){o.lab.classList.remove('sel');});if(inp.checked)l.classList.add('sel');});
    inputs.push({inp:inp,ch:ch,lab:l});
  });
  c.appendChild(box);
  return {
    collect:function(){for(var i=0;i<inputs.length;i++){if(inputs[i].inp.checked)return {sel:inputs[i].ch.t};}return null;},
    applyAnswer:function(v){if(!v)return;inputs.forEach(function(o){if(o.ch.t===v.sel){o.inp.checked=true;o.lab.classList.add('sel');}});},
    grade:function(v){var correct='';inputs.forEach(function(o){if(o.ch.ok)correct=o.ch.t;});
      var ok=!!v&&v.sel===correct;
      return {earned:ok?1:0,els:[{label:ok?'You picked the correct answer.':'You picked: '+(v?v.sel:'nothing')+'. The correct answer is: '+correct,verdict:ok?'ok':'bad'}],yours:v?v.sel:'—',correct:correct};},
    mark:function(res,v){inputs.forEach(function(o){
        var chosen=!!v&&v.sel===o.ch.t;
        o.lab.classList.remove('sel');
        if(o.ch.ok){o.lab.classList.add('mk-ok');o.lab.querySelector('.mk').textContent='✓ correct';}
        else if(chosen){o.lab.classList.add('mk-bad');o.lab.querySelector('.mk').textContent='✗ your pick';}
        else{o.lab.classList.remove('mk-bad');o.lab.querySelector('.mk').textContent='';}
      });},
    clearMarks:function(){inputs.forEach(function(o){o.lab.classList.remove('mk-ok','mk-bad');o.lab.querySelector('.mk').textContent='';});}
  };
}

/* ---------- multi-select (partial credit) ---------- */
function mkMULTI(c,ex){
  var d=ex.data,a0=ans(ex.id);a0.ord=a0.ord||{};
  var ord=a0.ord.multi||(a0.ord.multi=shuf(d.ch.map(function(_,i){return i;})));
  var box=el('div');box.setAttribute('role','group');box.setAttribute('aria-label','select all that apply');
  var inputs=[];
  ord.forEach(function(ci){
    var ch=d.ch[ci];
    var l=el('label','opt');var inp=document.createElement('input');
    inp.type='checkbox';inp.value=String(ci);
    l.appendChild(inp);l.appendChild(el('span',null,ch.t));l.appendChild(el('span','mk',''));
    box.appendChild(l);
    l.addEventListener('click',function(){setTimeout(function(){l.classList.toggle('sel',inp.checked);},0);});
    inputs.push({inp:inp,ch:ch,lab:l});
  });
  c.appendChild(box);
  var nOk=d.ch.filter(function(ch){return ch.ok;}).length;
  return {
    collect:function(){var sel=[];inputs.forEach(function(o){if(o.inp.checked)sel.push(o.ch.t);});return sel.length?{sel:sel}:null;},
    applyAnswer:function(v){if(!v)return;inputs.forEach(function(o){o.inp.checked=v.sel.indexOf(o.ch.t)>=0;o.lab.classList.toggle('sel',o.inp.checked);});},
    grade:function(v){
      var sel=v?v.sel:[];var good=0;var els=[];
      inputs.forEach(function(o){
        var picked=sel.indexOf(o.ch.t)>=0;
        if(o.ch.ok&&picked){good++;els.push({label:'“'+o.ch.t+'” — correctly selected.',verdict:'ok'});}
        else if(o.ch.ok&&!picked){els.push({label:'“'+o.ch.t+'” — correct, but you missed it.',verdict:'warn'});}
        else if(!o.ch.ok&&picked){els.push({label:'“'+o.ch.t+'” — wrong: this one should not be selected.',verdict:'bad'});}
      });
      return {earned:good/nOk,els:els,yours:sel.join(' · ')||'—',correct:d.ch.filter(function(ch){return ch.ok;}).map(function(ch){return ch.t;}).join(' · ')};},
    mark:function(res,v){var sel=v?v.sel:[];inputs.forEach(function(o){
        var picked=sel.indexOf(o.ch.t)>=0;o.lab.classList.remove('mk-ok','mk-bad');
        if(o.ch.ok&&picked)o.lab.classList.add('mk-ok');
        else if(!o.ch.ok&&picked)o.lab.classList.add('mk-bad');
      });},
    clearMarks:function(){inputs.forEach(function(o){o.lab.classList.remove('mk-ok','mk-bad');});}
  };
}

/* ---------- fill-in-the-blank ---------- */
function mkFILL(c,ex){
  var d=ex.data,a0=ans(ex.id);a0.ord=a0.ord||{};
  var bank=a0.ord.bank||(a0.ord.bank=shuf(d.bank.slice()));
  var sent=el('p','fbl');var help=el('p','muted','Click a word, then click a blank. Click a filled blank to put the word back.');
  var bankEl=el('div','chips');
  c.appendChild(sent);c.appendChild(help);c.appendChild(bankEl);
  var blanks=[];var selChip=null;var chipBtns=[];
  var parts=d.text.split(/(\{\{\d+\}\})/);
  parts.forEach(function(p){
    var m=p.match(/^\{\{(\d+)\}\}$/);
    if(m){var i=parseInt(m[1],10);
      var b=el('button','blank','____');b.type='button';b.setAttribute('aria-label','blank '+(i+1));
      b.addEventListener('click',function(){
        if(selChip!=null){
          if(blanks[i].word!=null){blanks[i].word=null;}
          blanks[i].word=bank[selChip];b.textContent=bank[selChip];b.classList.add('filled');
          chipBtns[selChip].classList.remove('sel');selChip=null;syncChips();
        }else if(blanks[i].word!=null){blanks[i].word=null;b.textContent='____';b.classList.remove('filled');syncChips();}
      });
      blanks[i]={btn:b,word:null};sent.appendChild(b);
    }else if(p){sent.appendChild(document.createTextNode(p));}
  });
  bank.forEach(function(w,i){
    var ch=el('button','chip',esc(w));ch.type='button';
    ch.addEventListener('click',function(){
      if(ch.classList.contains('used'))return;
      if(selChip!=null)chipBtns[selChip].classList.remove('sel');
      selChip=i;ch.classList.add('sel');
    });
    bankEl.appendChild(ch);chipBtns.push(ch);
  });
  function syncChips(){chipBtns.forEach(function(cb,i){var used=blanks.some(function(b){return b&&b.word===bank[i];});cb.classList.toggle('used',used);});}
  return {
    collect:function(){for(var i=0;i<blanks.length;i++){if(!blanks[i])return null;}var w=blanks.map(function(b){return b.word;});return w.some(function(x){return x!=null;})?{words:w}:null;},
    applyAnswer:function(v){if(!v)return;blanks.forEach(function(b,i){var w=v.words[i];b.word=w||null;b.textContent=w||'____';b.classList.toggle('filled',!!w);});syncChips();},
    grade:function(v){var els=[];var good=0;var words=v?v.words:[];
      d.ans.forEach(function(correct,i){
        var w=words[i];
        if(w===correct){good++;els.push({label:'Blank '+(i+1)+': “'+correct+'” — correct.',verdict:'ok'});}
        else{els.push({label:'Blank '+(i+1)+': you put '+(w?'“'+w+'”':'nothing')+' — the correct word is “'+correct+'”.',verdict:'bad'});}
      });
      return {earned:good/d.ans.length,els:els,yours:(words.map(function(w){return w||'—';}).join(' · ')),correct:d.ans.join(' · ')};},
    mark:function(res){blanks.forEach(function(b,i){var v2=res.els[i].verdict;b.btn.classList.remove('mk-ok','mk-bad');if(v2==='ok')b.btn.classList.add('mk-ok');else b.btn.classList.add('mk-bad');});},
    clearMarks:function(){blanks.forEach(function(b){b.btn.classList.remove('mk-ok','mk-bad');});}
  };
}

/* ---------- drag & drop into slots ---------- */
function mkDND(c,ex){
  var d=ex.data,a0=ans(ex.id);a0.ord=a0.ord||{};
  var itemOrd=a0.ord.items||(a0.ord.items=shuf(d.items.map(function(_,i){return i;})));
  var wrap=el('div','dndwrap');
  var pool=el('div','pool');pool.appendChild(el('div','slab','Item pool — click an item, then click a slot (or drag)'));
  var slotsWrap=el('div','dndslots');
  wrap.appendChild(pool);wrap.appendChild(slotsWrap);c.appendChild(wrap);
  var itemBtns={};var place={};d.items.forEach(function(it){place[it.id]=-1;});
  var selId=null;
  d.slots.forEach(function(sl,si){
    var s=el('div','dslot');s.appendChild(el('div','slab',esc(sl.label)));
    var zone=el('div','dzone');s.appendChild(zone);
    s.addEventListener('click',function(ev){if(ev.target.closest('.ditem'))return;move(selId,si);});
    s.addEventListener('dragover',function(ev){ev.preventDefault();s.classList.add('dragover');});
    s.addEventListener('dragleave',function(){s.classList.remove('dragover');});
    s.addEventListener('drop',function(ev){ev.preventDefault();s.classList.remove('dragover');var id=ev.dataTransfer.getData('text/plain');move(id,si);});
    slotsWrap.appendChild(s);
    sl._zone=zone;sl._el=s;
  });
  pool.addEventListener('click',function(ev){if(ev.target.closest('.ditem'))return;move(selId,-1);});
  pool.addEventListener('dragover',function(ev){ev.preventDefault();});
  pool.addEventListener('drop',function(ev){ev.preventDefault();move(ev.dataTransfer.getData('text/plain'),-1);});
  itemOrd.forEach(function(ii){
    var it=d.items[ii];
    var b=el('button','ditem',esc(it.t));b.type='button';b.draggable=true;b.setAttribute('data-id',it.id);
    b.addEventListener('click',function(ev){ev.stopPropagation();
      if(selId===it.id){move(it.id,-1);selId=null;b.classList.remove('sel');}
      else{if(selId!=null&&itemBtns[selId])itemBtns[selId].classList.remove('sel');selId=it.id;b.classList.add('sel');}
    });
    b.addEventListener('dragstart',function(ev){ev.dataTransfer.setData('text/plain',it.id);});
    itemBtns[it.id]=b;pool.appendChild(b);
  });
  function move(id,si){
    if(id==null)return;
    place[id]=si;selId=null;
    if(itemBtns[id])itemBtns[id].classList.remove('sel');
    Object.keys(itemBtns).forEach(function(k){var p=place[k];var host=(p<0)?pool:d.slots[p]._zone;if(itemBtns[k].parentNode!==host)host.appendChild(itemBtns[k]);});
  }
  return {
    collect:function(){var o={};d.items.forEach(function(it){o[it.id]=place[it.id];});return {place:o};},
    applyAnswer:function(v){if(!v)return;Object.keys(v.place).forEach(function(k){place[k]=v.place[k];move(k,v.place[k]);});},
    grade:function(v){var els=[];var good=0;
      d.items.forEach(function(it){
        var p=v.place[it.id];var acc=p>=0&&d.slots[p].acc.indexOf(it.id)>=0;
        if(acc){good++;els.push({label:'“'+it.t+'” — correctly in “'+d.slots[p].label+'”.',verdict:'ok'});}
        else{els.push({label:'“'+it.t+'” — '+(p<0?'left in the pool':'in the wrong slot')+'. Correct slot: “'+slotFor(it.id)+'”.',verdict:'bad'});}
      });
      return {earned:good/d.items.length,els:els,yours:d.items.map(function(it){return (v.place[it.id]>=0?d.slots[v.place[it.id]].label:'pool')+' ← '+it.t;}).join(' · '),correct:d.slots.map(function(sl){return sl.label+': '+sl.acc.map(function(id){var f=null;d.items.forEach(function(it){if(it.id===id)f=it.t;});return f;}).join(', ');}).join(' | ')};},
    mark:function(res){d.items.forEach(function(it,i){var v2=res.els[i].verdict;itemBtns[it.id].classList.remove('mk-ok','mk-bad');if(v2==='ok')itemBtns[it.id].classList.add('mk-ok');else itemBtns[it.id].classList.add('mk-bad');});},
    clearMarks:function(){d.items.forEach(function(it){itemBtns[it.id].classList.remove('mk-ok','mk-bad');});}
  };
  function slotFor(id){var f='';d.slots.forEach(function(sl){if(sl.acc.indexOf(id)>=0)f=sl.label;});return f;}
}

/* ---------- matching ---------- */
function mkMATCH(c,ex){
  var d=ex.data,a0=ans(ex.id);a0.ord=a0.ord||{};
  var rights=a0.ord.opts||(a0.ord.opts=shuf(d.pairs.map(function(p){return p[1];})));
  var rows=[];

    collect:function(){var picks=[];var any=false;rows.forEach(function(r){var v=r.s.value;picks.push(v);if(v)any=true;});return any?{picks:picks}:null;},
    applyAnswer:function(v){if(!v)return;rows.forEach(function(r,i){r.s.value=v.picks[i]||'';});},

      });
      return {earned:good/rows.length,els:els,yours:((v&&v.picks)?v.picks:[]).map(function(x){return x||'—';}).join(' · '),correct:d.pairs.map(function(p){return p[0]+' → '+p[1];}).join(' · ')};},
    mark:function(res){rows.forEach(function(r,i){var v2=res.els[i].verdict;r.row.classList.remove('mk-ok','mk-bad');if(v2==='ok')r.row.classList.add('mk-ok');else r.row.classList.add('mk-bad');});},
    clearMarks:function(){rows.forEach(function(r){r.row.classList.remove('mk-ok','mk-bad');});}
  };
}

/* ---------- ordering / ranking ---------- */
function mkORDER(c,ex){
  var d=ex.data,a0=ans(ex.id);a0.ord=a0.ord||{};
  var cur=a0.ord.seq||(a0.ord.seq=shuf(d.items.map(function(_,i){return i;})));
  var list=el('ul','olist');c.appendChild(list);
  c.appendChild(el('p','muted','Use the arrow buttons or drag the rows.'));
  function render(){
    list.innerHTML='';
    cur.forEach(function(ix,pos){
      var li=el('li');li.setAttribute('draggable','true');li.setAttribute('data-ix',String(ix));
      li.appendChild(el('span','num',String(pos+1)));
      li.appendChild(el('span','otx',esc(d.items[ix])));
      var up=el('button','btn mv','↑');up.type='button';up.setAttribute('aria-label','move item '+String(pos+1)+' up');
      var dn=el('button','btn mv','↓');dn.type='button';dn.setAttribute('aria-label','move item '+String(pos+1)+' down');
      up.addEventListener('click',function(){if(pos>0){var t=cur[pos-1];cur[pos-1]=cur[pos];cur[pos]=t;render();}});
      dn.addEventListener('click',function(){if(pos<cur.length-1){var t=cur[pos+1];cur[pos+1]=cur[pos];cur[pos]=t;render();}});
      li.appendChild(up);li.appendChild(dn);
      li.addEventListener('dragstart',function(ev){try{ev.dataTransfer.setData('text/plain',String(ix));}catch(e){}});
      li.addEventListener('dragover',function(ev){ev.preventDefault();li.classList.add('dragover');});
      li.addEventListener('dragleave',function(){li.classList.remove('dragover');});
      li.addEventListener('drop',function(ev){ev.preventDefault();li.classList.remove('dragover');
        var src=parseInt(ev.dataTransfer.getData('text/plain'),10);var from=cur.indexOf(src);
        if(from<0)return;cur.splice(from,1);cur.splice(pos,0,src);render();});
      list.appendChild(li);
    });
  }
  render();
  return {
    collect:function(){return {seq:cur.slice()};},
    applyAnswer:function(v){if(!v||!v.seq)return;cur=v.seq.slice();render();},
    grade:function(v){var els=[];var good=0;
      v.seq.forEach(function(ix,pos){
        if(ix===pos){good++;els.push({label:'Position '+(pos+1)+': “'+d.items[pos]+'” — correct.',verdict:'ok'});}
        else{els.push({label:'Position '+(pos+1)+': you put “'+d.items[ix]+'” — correct is “'+d.items[pos]+'”.',verdict:'bad'});}
      });
      return {earned:good/d.items.length,els:els,yours:v.seq.map(function(ix){return d.items[ix];}).join(' → '),correct:d.items.join(' → ')};},
    mark:function(res){var lis=$all('li',list);lis.forEach(function(li,pos){var v2=res.els[pos].verdict;li.classList.remove('mk-ok','mk-bad');if(v2==='ok')li.classList.add('mk-ok');else li.classList.add('mk-bad');});},
    clearMarks:function(){$all('li',list).forEach(function(li){li.classList.remove('mk-ok','mk-bad');});}
  };
}

/* ===== engine part C: terminal / spot / branch / dual + exam flow ===== */

/* ---------- terminal emulator ---------- */
function mkTERM(c,ex){
  var d=ex.data;
  var out=el('div','term-out');out.setAttribute('aria-live','polite');
  var line=el('div','term-line');
  line.appendChild(el('span','pr',esc(d.prompt)));
  var inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
  inp.setAttribute('aria-label','terminal command input');inp.placeholder='type a command and press Enter';
  line.appendChild(inp);
  var term=el('div','term');term.appendChild(out);term.appendChild(line);
  c.appendChild(term);
  var hist=[];
  function print(t,cls){var ln=el('div',cls?('ln '+cls):'ln');ln.textContent=t;out.appendChild(ln);out.scrollTop=out.scrollHeight;}
  print('Lab shell. Type "help" for local help. Type your command, then press Enter.');
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){var v=inp.value;inp.value='';run(v);}});
  function norm(s){return String(s).replace(/\[\.\]/g,'.').replace(/hxxp/gi,'http').replace(/["']/g,'').replace(/\s+/g,' ').trim().toLowerCase();}
  function checkCmd(raw){
    var gen='the command does not achieve the stated goal';
    var med=CFG.severity==='medium';
    var n=norm(raw);if(!n)return {ok:false,msg:med?'nothing typed':gen};
    var r=d.rules;
    var cmdToks=n.split(' ').filter(Boolean);
    if(cmdToks[0]==='sudo')cmdToks.shift();          /* a sudo prefix is always fine in the lab */
    var i;
    if(r.tool){
      var t0=cmdToks[0]||'';
      if(!(t0===r.tool||(t0.indexOf('/'+r.tool)===t0.length-r.tool.length-1&&t0.length>=r.tool.length+1)))
        return {ok:false,msg:'command not found: '+t0};
    }
    function has(tok){return cmdToks.indexOf(tok)>=0;}
    function grpOk(grp){for(var k=0;k<grp.length;k++){if(has(String(grp[k]).toLowerCase()))return true;}return false;}
    if(r.mustAll){for(i=0;i<r.mustAll.length;i++){
      var item=r.mustAll[i];
      var grp=Array.isArray(item)?item:[item];
      if(!grpOk(grp))return {ok:false,msg:med?('this command does not do the whole job — one required option is missing ('+grp.join(' / ')+')'):gen};
    }}
    if(r.mustAny&&r.mustAny.length){var any=false;for(i=0;i<r.mustAny.length;i++){if(grpOk(r.mustAny[i]))any=true;}
      if(!any)return {ok:false,msg:med?('the job needs one of these options: '+r.mustAny.map(function(gg){return gg.join(' / ');}).join(', ')):gen};}
    if(r.banned){for(i=0;i<r.banned.length;i++){if(has(r.banned[i].toLowerCase()))return {ok:false,msg:med?('option '+r.banned[i]+' does not fit the stated goal here'):gen};}}
    if(r.contains){for(i=0;i<r.contains.length;i++){if(n.indexOf(norm(r.contains[i]))<0)return {ok:false,msg:med?('the command must target '+r.contains[i]):gen};}}
    if(r.before){for(i=0;i<r.before.length;i++){
      var aTok=norm(r.before[i][0]),bTok=norm(r.before[i][1]);
      var ia=cmdToks.indexOf(aTok),ib=cmdToks.indexOf(bTok);
      if(ia<0||ib<0||ia>=ib)return {ok:false,msg:med?('argument order: put '+r.before[i][0]+' before '+r.before[i][1]):gen};
    }}
    return {ok:true};
  }
  function run(v){
    print(d.prompt+' '+v,'l-cy');
    var n=norm(v);
    if(n==='clear'){out.innerHTML='';return;}
    if(n==='help'){print(d.helpText||'No manual on this box. Use what you know.');return;}
    if(!n)return;
    var res=checkCmd(v);
    if(res.ok){hist.push(v);live.lastCmd=v;print(d.sample||'done.');print('— command accepted. Press Check to score it —','l-ok');}
    else{print(res.msg,'l-bad');
      if(CFG.severity==='medium'){print('Lab tip: this exercise expects the "'+d.rules.tool+'" tool family. Check the options and the target.','l-mut');}
      else{print('The command ran but does not achieve the stated goal. Think about the tool, the options and the target again.','l-mut');}
    }
  }
  return {
    collect:function(){return hist.length?{cmd:live.lastCmd||hist[hist.length-1],hist:hist.slice()}:null;},
    applyAnswer:function(v){if(!v)return;hist=v.hist||[];live.lastCmd=v.cmd;(v.hist||[]).forEach(function(h){print(d.prompt+' '+h,'l-mut');});if(v.cmd)print('— command restored. Press Check to score it —','l-ok');},
    grade:function(v){var ok=false;if(v&&v.cmd){ok=checkCmd(v.cmd).ok;}
      return {earned:ok?1:0,els:[{label:ok?'Command accepted: “'+v.cmd+'”':'Command not accepted'+(v&&v.cmd?' (last command: “'+v.cmd+'”)':' — nothing valid was typed')+'. '+(ok?'':'Goal: '+d.goalShort),verdict:ok?'ok':'bad'}],yours:v&&v.cmd?v.cmd:'—',correct:d.example};},
    mark:function(res){},
    clearMarks:function(){}
  };
}

/* ---------- spot the mistake ---------- */
function mkSPOT(c,ex){
  var d=ex.data;var btns=[];
  c.appendChild(el('p','muted','Click every line that contains the mistake. Click again to unselect.'));
  d.lines.forEach(function(ln){
    var b=el('button','spotline',esc(ln.t));b.type='button';b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){b.classList.toggle('sel');b.setAttribute('aria-pressed',b.classList.contains('sel')?'true':'false');});
    c.appendChild(b);btns.push({b:b,ok:ln.ok});
  });
  var nWrong=btns.filter(function(o){return !o.ok;}).length;
  return {
    collect:function(){var picked=btns.map(function(o){return o.b.classList.contains('sel');});return picked.some(function(x){return x;})?{picked:picked}:null;},
    applyAnswer:function(v){if(!v)return;btns.forEach(function(o,i){o.b.classList.toggle('sel',!!v.picked[i]);o.b.setAttribute('aria-pressed',o.b.classList.contains('sel')?'true':'false');});},
    grade:function(v){var picked=v?v.picked:[];var els=[];var good=0;
      btns.forEach(function(o,i){
        var lineNo='Line '+(i+1);
        if(!o.ok&&picked[i]){good++;els.push({label:lineNo+' — rightly flagged: “'+short(o.b.textContent)+'”.',verdict:'ok'});}
        else if(!o.ok&&!picked[i]){els.push({label:lineNo+' — this is a mistake and you missed it: “'+short(o.b.textContent)+'”.',verdict:'warn'});}
        else if(o.ok&&picked[i]){els.push({label:lineNo+' — wrongly flagged: this line is actually fine.',verdict:'bad'});}
      });
      return {earned:nWrong?good/nWrong:0,els:els,yours:btns.map(function(o,i){return picked[i]?'L'+(i+1):null;}).filter(Boolean).join(', ')||'—',correct:'Lines '+btns.map(function(o,i){return (!o.ok)?(i+1):null;}).filter(Boolean).join(', ')};},
    mark:function(res,v){var picked=v?v.picked:[];btns.forEach(function(o,i){
        var isPicked=btns[i].b.classList.contains('sel');
        o.b.classList.remove('mk-ok','mk-bad');
        if(!o.ok&&picked[i])o.b.classList.add('mk-ok');
        else if(!o.ok&&!picked[i])o.b.classList.add('mk-warn');
        else if(o.ok&&picked[i])o.b.classList.add('mk-bad');
      });},
    clearMarks:function(){btns.forEach(function(o){o.b.classList.remove('mk-ok','mk-bad','mk-warn');});}
  };
  function short(t){return t.length>70?t.slice(0,67)+'…':t;}
}

/* ---------- branching decision walk ---------- */
function mkBRANCH(c,ex){
  var d=ex.data;var idx=0;var picks=[];
  var holder=el('div');c.appendChild(holder);
  function renderStep(){
    holder.innerHTML='';
    if(idx>=d.steps.length){
      holder.appendChild(el('p',null,'Walk-through complete. Press <b>Check</b> to score your decisions.'));
      return;
    }
    var st=d.steps[idx];
    var sc=el('div','branch-scene');
    sc.appendChild(el('div','branch-step','Decision '+(idx+1)+' of '+d.steps.length));
    sc.appendChild(el('p',null,st.scene));
    var cq=el('div','conseq hidden');
    st.opts.forEach(function(op){
      var b=el('button','opt','<span>'+esc(op.t)+'</span>');b.type='button';
      b.addEventListener('click',function(){
        picks[idx]=st.opts.indexOf(op);
        $all('.opt',sc).forEach(function(o){o.disabled=true;});
        cq.innerHTML='<b>What happens:</b> '+esc(op.c)+' '+
          '<button class="btn" type="button" style="margin-left:8px">'+(idx===d.steps.length-1?'Finish walk-through':'Continue')+'</button>';
        cq.classList.remove('hidden');
        cq.querySelector('button').addEventListener('click',function(){idx++;renderStep();});
      });
      sc.appendChild(b);
    });
    sc.appendChild(cq);
    holder.appendChild(sc);
  }
  renderStep();
  return {
    collect:function(){return idx>=d.steps.length?{picks:picks.slice()}:null;},
    applyAnswer:function(v){if(!v)return;picks=v.picks.slice();idx=picks.length;renderStep();},
    grade:function(v){var els=[];var good=0;
      d.steps.forEach(function(st,i){
        var pick=v.picks[i];var op=st.opts[pick];
        if(op&&op.ok){good++;els.push({label:'Decision '+(i+1)+': “'+op.t+'” — the right call.',verdict:'ok'});}
        else{var rt='';d.steps[i].opts.forEach(function(o){if(o.ok)rt=o.t;});
          els.push({label:'Decision '+(i+1)+': “'+(op?op.t:'—')+'” — not the best call. Better: “'+rt+'”.',verdict:'bad'});}
      });
      return {earned:good/d.steps.length,els:els,yours:d.steps.map(function(st,i){var op=st.opts[v.picks[i]];return op?op.t:'—';}).join(' → '),correct:d.steps.map(function(st){var r='';st.opts.forEach(function(o){if(o.ok)r=o.t;});return r;}).join(' → ')};},
    mark:function(res){},clearMarks:function(){}
  };
}

/* ---------- dual perspective (two sub-questions) ---------- */
function mkDUAL(c,ex){
  var parts=[];
  ex.data.parts.forEach(function(p,i){
    c.appendChild(el('h4',null,esc(p.side)));
    c.appendChild(el('p','muted',esc(p.question)));
    var box=el('div');c.appendChild(box);
    var ctl=CTRL[p.type](box,{id:ex.id+'_p'+i,data:p.data});
    parts.push({ctl:ctl,p:p,g:null});
  });
  return {
    collect:function(){var o={};var any=false;
      for(var i=0;i<parts.length;i++){var v=parts[i].ctl.collect();if(v!=null){o['p'+i]=v;any=true;}}
      return any?o:null;},
    applyAnswer:function(a){if(!a)return;parts.forEach(function(pt,i){pt.ctl.applyAnswer(a['p'+i]);});},
    grade:function(a){var els=[];var sum=0;var yours=[],corr=[];
      parts.forEach(function(pt,i){
        var g=pt.ctl.grade(a['p'+i]);pt.g=g;sum+=g.earned;
        g.els.forEach(function(e2){els.push({label:pt.p.side.split('—')[0].trim()+': '+e2.label,verdict:e2.verdict});});
        yours.push(pt.p.side.split('—')[0].trim()+': '+g.yours);corr.push(pt.p.side.split('—')[0].trim()+': '+g.correct);
      });
      return {earned:sum/parts.length,els:els,yours:yours.join(' | '),correct:corr.join(' | '),parts:parts.map(function(pt){return pt.g;})};},
    mark:function(res,a){parts.forEach(function(pt,i){if(res.parts&&res.parts[i])pt.ctl.mark(res.parts[i],a['p'+i]);else if(pt.g)pt.ctl.mark(pt.g,a['p'+i]);});},
    clearMarks:function(){parts.forEach(function(pt){pt.ctl.clearMarks();});}
  };
}

var CTRL={qcm:mkQCM,multi:mkMULTI,fill:mkFILL,dnd:mkDND,match:mkMATCH,order:mkORDER,rank:mkORDER,terminal:mkTERM,spot:mkSPOT,branch:mkBRANCH,dual:mkDUAL};

/* ---------- log artefact ---------- */
function hl(t){
  var s=esc(t);
  s=s.replace(/(open\|filtered|closed\|filtered|unfiltered|filtered|closed|open)/g,'<span class="l-kw">$1</span>');
  s=s.replace(/(Host is up[^\n<]*)/g,'<span class="l-ok">$1</span>');
  s=s.replace(/(Nmap done[^\n<]*)/g,'<span class="l-ok">$1</span>');
  s=s.replace(/(\d{2}:\d{2}(:\d{2})?)/g,'<span class="l-cy">$1</span>');
  s=s.replace(/(Starting Nmap[^\n<]*)/g,'<span class="l-mut">$1</span>');
  return s;
}
function buildLog(holder,e){
  var bar=el('div','logbar');
  var lab=el('label','muted','Filter:');lab.htmlFor='f_'+e.id;
  var inp=document.createElement('input');inp.id='f_'+e.id;inp.placeholder='type to filter lines…';
  var cnt=el('span','muted','');
  bar.appendChild(lab);bar.appendChild(inp);bar.appendChild(cnt);holder.appendChild(bar);
  var box=el('div','logbox');holder.appendChild(box);
  var lns=e._logs.map(function(t){var ln=el('div','ln',hl(t));ln.setAttribute('data-raw',t.toLowerCase());box.appendChild(ln);return ln;});
  function upd(){var q=inp.value.toLowerCase();var n=0;lns.forEach(function(ln){var show=!q||ln.getAttribute('data-raw').indexOf(q)>=0;ln.classList.toggle('hide',!show);if(show)n++;});cnt.textContent='showing '+n+' of '+lns.length+' lines';}
  inp.addEventListener('input',upd);upd();
}

/* ---------- rendering one exercise ---------- */
var TYPE_LABEL={qcm:'CHOOSE ONE',multi:'SELECT ALL THAT APPLY',fill:'CLICK THE WORDS INTO THE BLANKS',dnd:'DRAG THE ITEMS INTO THE SLOTS',match:'MATCH EACH ITEM',order:'PUT IN ORDER — FIRST AT THE TOP',rank:'RANK THEM — 1 = HIGHEST PRIORITY',terminal:'TYPE THE COMMAND',spot:'CLICK EVERY LINE THAT CONTAINS THE MISTAKE',branch:'WALK THE DECISIONS',dual:'ANSWER BOTH VIEWS'};
function renderEx(){
  var e=exByPos(S.cur);var a=ans(e.id);
  live={};live.exId=e.id;live.lastCmd=null;
  var area=$('#exArea');area.innerHTML='';
  var wrap=el('div','exwrap');area.appendChild(wrap);
  var sc=el('div','blk scenario','<div class="lab"><span class="ic">▣</span>Scenario</div>'+e.scenario);
  wrap.appendChild(sc);
  if(e._logs){
    var lg=el('div','blk','<div class="lab"><span class="ic">▤</span>Log artefact — use the filter box</div>');
    var lh=el('div');lg.appendChild(lh);buildLog(lh,e);wrap.appendChild(lg);
  }
  var q=el('div','blk question','<div class="lab"><span class="ic">❓</span>Question</div>');
  var h=el('h3','qtitle',e.question);h.setAttribute('tabindex','-1');q.appendChild(h);
  wrap.appendChild(q);
  var an=el('div','blk answers','<div class="lab"><span class="ic">✎</span>'+TYPE_LABEL[e.type]+'</div>');
  wrap.appendChild(an);
  var box=el('div');an.appendChild(box);
  live.ctrl=CTRL[e.type](box,e);
  if(a.answer)live.ctrl.applyAnswer(a.answer);
  live.fb=el('div','fbwrap');wrap.appendChild(live.fb);
  live.explBox=el('div','expl hidden');wrap.appendChild(live.explBox);
  if(a.hintUsed)wrap.insertBefore(el('div','hintbox','<b>Hint (−10% on this exercise):</b> '+esc(e.hint)),live.fb);
  if(a.status==='checked'&&a.result){live.ctrl.mark(a.result,a.answer);renderFeedback(a);showExpl(e);}
  updateButtons();renderNav();renderThemes();renderScore();renderTimer();renderPind();applyPauseView();
  try{h.focus({preventScroll:true});}catch(err){h.focus();}
  window.scrollTo(0,0);
}

/* ===== engine part D: exam actions, results, website contract, boot ===== */
function updateButtons(){
  var e=exByPos(S.cur);var a=ans(e.id);
  $('#bPrev').disabled=(S.cur===0)||S.pManual;
  $('#bRevise').disabled=(a.status!=='checked')||S.pManual;
  $('#bSkip').disabled=(a.status==='checked')||S.pManual;
  $('#bHint').disabled=a.hintUsed||(a.status==='checked')||S.pManual;
  $('#bCheck').disabled=S.pManual;
  $('#bNext').disabled=S.pManual;
  $('#bNext').textContent=(S.cur===EX.length-1)?'Finish →':'Next';
}
function renderFeedback(a){
  var fb=live.fb,r=a.result;fb.innerHTML='';
  var label=r.earned>=0.999?'FULL':(r.earned>0?'PARTIAL':'ZERO');
  var cls=r.earned>=0.999?'ok-t':(r.earned>0?'warn-t':'bad-t');
  var ic=r.earned>=0.999?'✓':(r.earned>0?'▲':'✗');
  fb.appendChild(el('div','fbline '+cls,'<span>'+ic+'</span><span>You earned '+fmtPts(r.earned)+' / 1 point on this exercise — '+label+(a.hintUsed?' (hint used: −10%)':'')+'</span>'));
  r.els.forEach(function(e2){
    if(e2.verdict==='ok')fb.appendChild(el('div','el-ok','<span class="elmark ok-t">✓</span>'+esc(e2.label)));
    else if(e2.verdict==='bad')fb.appendChild(el('div','el-bad','<span class="elmark bad-t">✗</span>'+esc(e2.label)));
    else if(e2.verdict==='warn')fb.appendChild(el('div','el-warn','<span class="elmark warn-t">▲</span>'+esc(e2.label)));
  });
}
function showExpl(e){
  live.explBox.classList.remove('hidden');
  live.explBox.innerHTML='<h4>Why</h4>'+e.expl;
}
function doCheck(){
  if(!S.started||S.finished||S.pManual)return;
  var e=exByPos(S.cur);var a=ans(e.id);var ctrl=live.ctrl;
  var c;
  try{c=ctrl.collect();}catch(err){c=null;}
  if(c==null){toast('Nothing to check yet — give an answer first.');return;}
  var g=ctrl.grade(c);
  var mult=a.hintUsed?0.9:1;
  var earned=Math.round(g.earned*mult*100)/100;
  a.status='checked';a.checkedOnce=true;a.answer=c;a.earned=earned;
  a.result={earned:earned,els:g.els,yours:g.yours,correct:g.correct,parts:g.parts||null};
  ctrl.mark(a.result,c);
  renderFeedback(a);showExpl(e);
  S.pCheck=true;
  renderPind();renderNav();renderThemes();renderScore();updateButtons();
  window.scrollTo(0,0);
}
function doRevise(){
  var e=exByPos(S.cur);var a=ans(e.id);
  if(a.status!=='checked')return;
  a.status='untouched';a.result=null;a.earned=0;
  if(live.ctrl.clearMarks)live.ctrl.clearMarks();
  live.fb.innerHTML='';live.explBox.classList.add('hidden');
  renderNav();renderThemes();renderScore();updateButtons();
  toast('Answer unlocked. Edit it, then press Check again. The timer stays in review mode until you press Next.');
}
function doSkip(){
  if(!S.started||S.finished||S.pManual)return;
  var e=exByPos(S.cur);var a=ans(e.id);
  if(a.status==='checked'){toast('This exercise is already checked. Use Revise first.');return;}
  a.status='skipped';
  renderNav();renderScore();
  if(S.cur>=EX.length-1){openSubmitModal();}
  else{go(S.cur+1);}
}
function doHint(){
  if(!S.started||S.finished||S.pManual)return;
  var e=exByPos(S.cur);var a=ans(e.id);
  if(a.hintUsed||a.status==='checked')return;
  a.hintUsed=true;
  var hb=el('div','hintbox','<b>Hint (−10% on this exercise):</b> '+esc(e.hint));
  var an=$('.blk.answers',$('#exArea'));
  an.parentNode.insertBefore(hb,an.nextSibling);
  updateButtons();
  toast('Hint revealed — this exercise now earns 10% less.');
}
function saveLiveAnswer(){
  var e=exByPos(S.cur);var a=ans(e.id);
  if(a.status==='checked')return;
  if(!live.ctrl)return;
  try{var c=live.ctrl.collect();if(c!=null)a.answer=c;}catch(err){}
}
function go(pos){
  if(S.finished||S.pManual)return;
  pos=clamp(pos,0,EX.length-1);
  saveLiveAnswer();
  S.cur=pos;renderEx();
}
function nextEx(){
  if(S.finished||S.pManual)return;
  S.pCheck=false;               /* Next is the ONLY thing that ends the Check-pause */
  renderPind();
  if(S.cur>=EX.length-1){openSubmitModal();return;}
  go(S.cur+1);
}

/* ---------- submit + finish ---------- */
function openSubmitModal(){
  if(S.finished)return;
  if(document.querySelector('.modal'))return;   /* never stack submit dialogs */
  var checked=totalChecked(),skipped=countSkipped(),untouched=EX.length-checked-skipped;
  var m=el('div','modal');
  m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Submit the exam?');
  m.innerHTML='<div class="mbox"><h3>Submit the exam?</h3><ul>'+
    '<li>Checked and scored: <b>'+checked+'</b></li>'+
    '<li>Skipped: <b>'+skipped+'</b> — excluded from scoring</li>'+
    '<li>Not checked yet: <b>'+untouched+'</b> — counted as skipped</li></ul>'+
    '<p class="muted">Only exercises you finished with <b>Check</b> are scored. Answered-but-unchecked exercises are excluded like skipped ones.</p>'+
    '<p class="muted">'+(checked===0?'You must answer (Check) at least one exercise before the exam can be scored.':'The final percentage is computed over the non-skipped exercises only.')+'</p>'+
    '<div style="display:flex;gap:10px;margin-top:14px">'+
    '<button class="btn" id="mNo">Keep working</button>'+
    '<button class="btn primary" id="mYes">Submit now</button></div></div>';
  document.body.appendChild(m);
  var mNo=$('#mNo',m),mYes=$('#mYes',m);
  mNo.addEventListener('click',function(){m.remove();});
  m.addEventListener('keydown',function(ev){if(ev.key==='Escape')m.remove();});
  mYes.addEventListener('click',function(){
    m.remove();
    if(checked===0){toast('All exercises are skipped — answer (Check) at least one exercise before submitting.');return;}
    finish('submit');
  });
  try{mYes.focus();}catch(err){}
}
function finish(reason){
  if(S.finished)return;
  S.order.forEach(function(ix){var a=ans(EX[ix].id);if(a.status!=='checked')a.status='skipped';});
  var total=0,earnedTotal=0;
  S.order.forEach(function(ix){var a=ans(EX[ix].id);if(a.status === 'checked'){total++;earnedTotal+=a.earned;}});
  if(total===0){
    if(reason==='time'){renderResults({reason:reason,empty:true});S.finished=true;S.reported=true;}
    else{toast('All exercises are skipped — answer (Check) at least one exercise before submitting.');}
    return;
  }
  S.finished=true;S.pManual=false;S.pCheck=false;applyPauseView();
  var scoreInt=Math.round(earnedTotal);
  var percent=Math.round(scoreInt/total*100);
  renderResults({reason:reason,earned:earnedTotal,scoreInt:scoreInt,total:total,percent:percent,passed:percent>=CFG.passMark});
  if(!S.reported){S.reported=true;reportScore(scoreInt,total);}
}
function reportScore(correct,total){
  var percent=Math.round((correct/total)*100);
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:CFG.topicId,score:correct,total:total,percent:percent,passed:percent>=CFG.passMark},location.origin);
  }catch(err){/* opened directly — nothing to report to */}
}

/* ---------- results screen ---------- */
function tagFor(e2){
  if(e2>=0.999)return '<span class="tag full">✓ FULL</span>';
  if(e2>0)return '<span class="tag partial">▲ PARTIAL</span>';
  return '<span class="tag zero">✗ ZERO</span>';
}
function renderResults(R){
  scrExam.classList.add('hidden');scrRes.classList.remove('hidden');scrRes.innerHTML='';
  var c=el('div','rescard');
  if(R.empty){
    c.innerHTML='<h1>Time is up</h1><p>No exercise was answered, so nothing was scored. Press the button below to retake the exam.</p><button class="btn primary" id="bRetake2">Retake exam</button>';
    scrRes.appendChild(c);$('#bRetake2',c).addEventListener('click',retake);window.scrollTo(0,0);return;
  }
  var head;
  if(R.passed){
    head='<div class="passpanel"><div class="big">★ PASSED ★</div>'+
      '<p style="font-size:18px;margin:8px 0 0">Certificate-style credit: '+esc(CFG.certName)+'<br>Chapter '+esc(CFG.chapter)+' — '+esc(CFG.chapterGoal)+' ('+esc(CFG.severityLabel)+' practice exam)</p></div>';
  }else{
    head='<div class="failpanel"><div class="big">✗ NOT PASSED</div>'+
      '<p style="font-size:16px;margin:8px 0 0">You need '+CFG.passMark+'% to pass. Review the report below, then retake the exam — questions and choices will be reshuffled.</p></div>';
  }
  var skippedRows='',repRows='';
  var skippedList=[];
  S.order.forEach(function(ix,pos){
    var e=EX[ix];var a=ans(e.id);
    if(a.status==='skipped'){
      skippedList.push(pos+1);
      repRows+='<div class="rep"><div class="toprow"><span class="qn">Q'+(pos+1)+'</span><span class="tag skip">⤼ SKIPPED — NOT COUNTED</span><span class="muted">'+esc(e.theme)+'</span></div>'+
        '<details><summary>Show what the correct answer was</summary><div class="corr">'+esc(a.result?a.result.correct:(e._correctSummary||''))+'</div>'+
        '<div class="expl" style="margin:8px 0 0"><h4>Why</h4>'+e.expl+'</div></details></div>';
    }else{
      var r=a.result;
      repRows+='<div class="rep"><div class="toprow"><span class="qn">Q'+(pos+1)+'</span>'+tagFor(r.earned)+
        '<span class="muted mono">'+fmtPts(r.earned)+' / 1 pt</span><span class="muted">'+esc(e.theme)+'</span></div>'+
        '<div class="yours"><b>Your answer:</b> '+esc(r.yours||'—')+(a.hintUsed?' <span class="warn-t">(hint used)</span>':'')+'</div>'+
        '<div class="corr"><b>Correct:</b> '+esc(r.correct||'—')+'</div>'+
        '<details open><summary>Explanation</summary><div class="expl" style="margin:8px 0 0"><h4>Why</h4>'+e.expl+'</div></details></div>';
    }
  });
  if(skippedList.length){
    skippedRows='<div class="skiplist"><b>⤼ Skipped exercises ('+skippedList.length+'):</b> '+skippedList.join(', ')+
      '<br><span class="muted">These were excluded from scoring: their points count neither for you nor against you.</span></div>';
  }
  c.innerHTML=
    '<h1>Results</h1>'+
    '<div class="bignum">'+R.percent+'%</div>'+
    '<p class="muted">Score <b>'+R.scoreInt+'</b> / '+R.total+' points over the '+R.total+' non-skipped exercise'+(R.total===1?'':'s')+
    (R.reason==='time'?' · <span class="warn-t">time ran out — unanswered exercises were excluded</span>':'')+
    ' · pass mark '+CFG.passMark+'% · '+(R.passed?'<span class="ok-t">PASSED ✓</span>':'<span class="bad-t">NOT PASSED ✗</span>')+'</p>'+
    head+skippedRows+
    '<h3 class="qtitle" style="margin:18px 0 8px">Per-exercise report</h3>'+repRows+
    '<div style="display:flex;gap:10px;margin-top:18px"><button class="btn primary" id="bRetake" style="min-height:48px">Retake exam</button></div>';
  scrRes.appendChild(c);
  $('#bRetake',c).addEventListener('click',retake);
  window.scrollTo(0,0);
}
function retake(){
  S=freshState();
  scrRes.classList.add('hidden');scrExam.classList.add('hidden');
  scrIntro.classList.remove('hidden');
  renderIntro();
  window.scrollTo(0,0);
}
function startExam(){
  S.started=true;S.finished=false;S.cur=0;S.remaining=CFG.timerSeconds;lastTick=Date.now();
  scrIntro.classList.add('hidden');scrExam.classList.remove('hidden');
  renderEx();renderTimer();
}

/* ---------- toast ---------- */
var toastEl=null,toastT=null;
function toast(msg){
  if(toastEl)toastEl.remove();
  toastEl=el('div','toast',esc(msg));document.body.appendChild(toastEl);
  clearTimeout(toastT);toastT=setTimeout(function(){if(toastEl){toastEl.remove();toastEl=null;}},3600);
}

/* ---------- website handshake (accept both type names; never required) ---------- */
window.addEventListener('message',function(ev){
  if(!ev.data||typeof ev.data!=='object')return;
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT')return;
  try{
    if(ev.data.username){S.userName=String(ev.data.username).slice(0,40);}
    var hi=$('#introHi');
    if(hi&&S.userName)hi.textContent='Good luck, '+S.userName+'.';
  }catch(err){}
});

/* ---------- boot ---------- */
function boot(){
  EX.forEach(function(e){
    if(e.type==='logview'){e._logs=e.data.logs;e.question=e.data.sub.question;e.type=e.data.sub.type;e.data=e.data.sub.data;}
    if(e.cs)e._correctSummary=e.cs;
  });
  S=freshState();
  buildShell();renderIntro();startTimerLoop();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}
else{boot();}

</script>
</body>
</html>
