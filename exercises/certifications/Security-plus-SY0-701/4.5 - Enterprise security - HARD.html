<script>

window.THEMES=[
 {k:"fw",n:"Firewall"},{k:"ips",n:"IDS/IPS"},{k:"dns",n:"DNS Filtering"},{k:"dlp",n:"DLP"},{k:"nac",n:"NAC"},{k:"edr",n:"EDR/XDR"},{k:"proc",n:"Security Process"}
];
window.KEYWORDS=[
 {t:"Firewall Management",kws:["rule order (top-down, first match)","implicit deny","allow/deny rules","ports & protocols","stateful inspection","next-generation firewall (NGFW)","UTM","WAF","shadowed rules","ACL change control"]},
 {t:"IDS / IPS",kws:["NIDS","HIDS","signature-based","anomaly-based","behavior-based","heuristic","inline (IPS) vs passive (IDS)","SPAN / port mirror","false positives","false negatives","alert tuning"]},
 {t:"DNS Filtering",kws:["DNS filtering","blocklist / allowlist","domain categorization","DNS sinkhole","newly registered & uncategorized domains","DNS tunneling","NXDOMAIN","recursive resolver","threat feeds","DNS-over-HTTPS (DoH) bypass"]},
 {t:"Data Loss Prevention",kws:["DLP","data at rest","data in transit","data in use","pattern / regex matching","templates","email DLP","cloud DLP","USB / removable media","agent vs network DLP","monitor mode vs block mode","false positives","classification labels"]},
 {t:"Network Access Control",kws:["NAC","802.1X","supplicant / authenticator / RADIUS","EAP-TLS","posture assessment","persistent / dissolvable / agentless","MDM integration","quarantine VLAN","captive portal","guest network"]},
 {t:"EDR / XDR",kws:["EDR","XDR","telemetry","host isolation","root cause analysis","indicators of compromise (IOC)","threat hunting","MDR","SOAR playbooks","remediation & rollback","continuous monitoring","EDR vs anti-malware"]},
 {t:"Security Process",kws:["change approval (CAB)","maintenance window","rollback plan","business-impact judgment","alert prioritization"]}
];
window.EXTIME=120;
var EX=[
{id:"H01",type:"lmulti",title:"Audit the weekend changes",th:["fw","proc"],pts:10,
scen:"<p>Monday 07:30. The stateful perimeter firewall forwards every session fine — too fine. A data-outflow spike hit db-server 10.9.9[.]50 on Sunday night. You pulled the firewall change audit log and the CAB minutes before the incident manager arrives. CAB minutes say: approved changes this weekend = CH-8841 only (a scoped SQL permit for the reporting subnet).</p>",
q:"<p>Select the <b>three</b> findings the audit evidence actually supports.</p>",
hint:"Compare who, what, when, and which rule made the outflow physically possible. Blame needs more than the log shows.",
exp:"<p>The log shows a <b>permit ip any any added by the external vendor account with no ticket</b>, the <b>default deny demoted below it</b> (so top-down processing let everything through), and the <b>outflow spike falling inside that rule's active window</b> — those three are written in the evidence. What the log does <b>not</b> show is intent: svc-fwadmin's actions were the cleanup, the vendor account made the change, and 'malicious' would need the vendor investigation, not this log. Patching is not mentioned anywhere. Audit conclusions must stop where the evidence stops.</p>",
data:{lines:[
 ["m","fw-edge-01 change audit — Mar 01 → Mar 03"],
 ["k","Mar 01 09:12  CH-8841 applied by svc-fwadmin: permit tcp 10.9.4[.]0/24 -> 10.9.9[.]50 3306  [ticket CH-8841 approved]"],
 ["g","Mar 01 09:14  CH-8841 rollback window closed  (CAB-approved change complete)"],
 ["e","Mar 02 23:47  change applied by ext-vendor-acct: permit ip any any  [no ticket referenced]"],
 ["e","Mar 02 23:49  rule 512 modified: deny ip any any -> moved below rule 511 (permit ip any any)"],
 ["w","Mar 03 07:02  netflow alert: outflow spike from 10.9.9[.]50 to 198.51.100[.]88:8443  4.1 GB"],
 ["g","Mar 03 08:15  CH-8901 applied by svc-fwadmin: remove 'permit ip any any'"],
 ["g","Mar 03 08:16  CH-8901 applied by svc-fwadmin: restore 'deny ip any any' to top position"],
 ["m","Mar 03 08:20  outflow returns to baseline"]],
 inner:{opts:[
  {t:"A rule allowing all traffic was added with no approved ticket",c:true},
  {t:"The default deny was demoted below the allow rule",c:true},
  {t:"The outflow spike falls inside the window the any/any rule was active",c:true},
  {t:"svc-fwadmin added the any/any rule maliciously on Sunday night",c:false},
  {t:"The database server was patched during the weekend",c:false}]}}},
{id:"H02",type:"spot",title:"The deny that never fires",th:["fw"],pts:6,
scen:"<p>Security review of fw-edge-02. The intent: the contractor 'John' needed RDP to 10.10.1[.]20 for one week; the user VLAN 172.18.44[.]0/24 must never reach RDP on that host. Both rules exist. The security team claims the user VLAN is protected. Test it in your head, top-down, first match wins.</p>",
q:"<p>Click the single rule that shadows (makes useless) the deny rule below it.</p>",
hint:"Who matches first? Rule 2's source range — what does it include?",
exp:"<p>Rule 2 permits <b>any</b> source to TCP/3389 on 10.10.1[.]20, so every packet from 172.18.44[.]0/24 matches rule 2 first and the firewall never evaluates rule 3. The deny is <b>shadowed</b> — a textbook case of shadowed rules: it looks protective in the config but never fires. The fix is to narrow rule 2 to John's actual host (or his jump box) and keep the deny above any broader permit. Stateful inspection tracks the sessions it allows — which here is exactly the problem: it happily tracks the sessions policy meant to stop.</p>",
data:{code:[
 {t:"! fw-edge-02 — top-down, first match wins"},
 {t:"1  permit tcp 172.18.0[.]0/16 any 443"},
 {t:"2  permit tcp any -> 10.10.1[.]20 3389    ! 'temp for contractor John, one week'",bad:true},
 {t:"3  deny tcp 172.18.44[.]0/24 -> 10.10.1[.]20 3389  ! block user VLAN from RDP"},
 {t:"4  deny ip any any  log"}],multi:false}},
{id:"H03",type:"branch",title:"Detection mode under fire",th:["ips","proc"],pts:10,
scen:"<p>Your internet-facing IPS runs in detection mode, fed by a SPAN port. A new CVE exploit attempt starts hitting the public web app. The vendor shipped a fresh signature for it — brand new, never tested on your traffic. The app team is mid-release and terrified of dropped requests.</p>",
q:"<p>Drive the three decision points of the IPS response.</p>",
hint:"Watch before you enforce. Enforce with the app team on the bridge, never alone.",
exp:"<p>The professional path is <b>monitor → measure → enforce with a plan</b>. First run the new signature in monitor mode: you gain visibility without betting the app on an untested signature. Zero false positives on live traffic then justify switching that signature to prevention — targeted at the sources still attempting the exploit. When the app team raises a real business risk (legitimate SOAP traffic looks similar), you do not surrender and you do not bulldoze: you enable prevention <b>with a documented rollback and the app team on standby during a maintenance window</b>. 'Deploy everywhere immediately' turns a detection gap into an outage risk; 'monitor forever' turns prevention into homework nobody does.</p>",
data:{steps:[
 {sit:"Exploit attempts hit the public app; a brand-new vendor signature exists but is untested in your environment. First decision:",opts:[
  {t:"Enable the new signature in monitor mode and watch live traffic for false positives",fb:"Alerts start flowing — real attempts and their noise level become visible.",ok:true},
  {t:"Deploy the signature in prevention mode on all traffic immediately",fb:"Within minutes, two customer requests are dropped — the app team pages you.",ok:false},
  {t:"Do nothing until the vendor ships an updated appliance",fb:"The attempts continue unwatched for weeks.",ok:false}]},
 {sit:"Monitor mode: 0 false positives on live traffic; 3 source IPs keep attempting the exploit. Next decision:",opts:[
  {t:"Switch the signature to prevention (inline drop) — the sensor is inline-capable and tested now",fb:"Attempts are dropped at the wire; alerts confirm what was blocked.",ok:true},
  {t:"Stay in monitor mode and write a weekly report",fb:"You document the attacks while they succeed.",ok:false},
  {t:"Block the three source countries at the border router",fb:"Thousands of legitimate users penalized for three addresses.",ok:false}]},
 {sit:"The app owner warns that legitimate SOAP traffic can look like this exploit. Final decision:",opts:[
  {t:"Prevention on, with a rollback plan and the app team on standby during the maintenance window",fb:"Window runs clean; one rule tuned; rollback never needed.",ok:true},
  {t:"Ignore the app team — security always wins",fb:"Next business release breaks in production. Trust damage done.",ok:false},
  {t:"Keep detection forever and review every alert by hand",fb:"Analyst hours burn on a solvable tuning problem.",ok:false}]}]}},
{id:"H04",type:"multi",title:"Why we stay in detection mode",th:["ips"],pts:9,
scen:"<p>The audit asks the network team to justify why the core data centre IPS runs in detection mode instead of prevention. The team must answer with engineering facts, not habits.</p>",
q:"<p>Select the <b>three</b> answers that are valid engineering justifications.</p>",
hint:"Two of the wrong ones are marketing; one is just false. Prevention needs to be physically in the traffic path.",
exp:"<p>Valid justifications: a sensor fed by a <b>SPAN port</b> (a port mirror) is passive and out-of-band — it sees a copy and physically cannot block; <b>untested signatures</b> can drop real business traffic the moment prevention flips on; and with a high <b>false-positive rate</b>, prevention converts noise into outages — every false positive becomes a denied customer. The wrong claims invert reality: prevention is not 'more accurate', it does not hide alerts, and attackers bypass detection all the time — detection is simply a different trade-off: visibility without blocking risk.</p>",
data:{opts:[
 {t:"The sensor watches a SPAN-port copy of the traffic, so it physically cannot block",c:true},
 {t:"The signature set is new and untested against real business traffic",c:true},
 {t:"With the current false-positive rate, prevention would drop legitimate customer traffic",c:true},
 {t:"Detection mode is always more accurate than prevention mode",c:false},
 {t:"Prevention mode hides all alerts from the SOC",c:false},
 {t:"Attackers can bypass prevention but never detection",c:false}]}},
{id:"H05",type:"term",title:"Terminal: name the noisiest source",th:["fw","proc"],pts:8,
scen:"<p>You are on the firewall management host. The drop log /var/log/fw/drop.log has layout <b>&lt;ts&gt; &lt;action&gt; &lt;src&gt; &lt;dst&gt; &lt;dport&gt;</b>. The incident manager wants one number for the report: which single source IP causes the most DROP lines?</p>",
q:"<p>Build the pipeline yourself — produce the count per source, biggest first, on screen. No tool is prescribed; shell text tools are installed (grep, awk, cut, sort, uniq, head).</p>",
hint:"One pipe stage per job: select the DROP lines, cut out the source column, group identical values, count them, sort numerically descending.",
exp:"<p>Canonical answer: <b>grep DROP /var/log/fw/drop.log | awk '{print $3}' | sort | uniq -c | sort -rn | head</b> (cut -d' ' -f3 works instead of awk; 'sort -nr' also fine). The stages: grep selects the DROP lines, awk/cut extracts field 3 (the source), sort groups equal values so uniq can count them, the second sort orders by count descending and head shows the top. This is the bread-and-butter pipeline for 'who is the noisiest' questions in any log.</p>",
data:{host:"analyst@fw-cli",title:"fw-cli — bash",ps:"analyst@fw-cli:~$",
banner:["fw-cli 5.4.0 #1 SMP","Log layout: <ts> <action> <src> <dst> <dport>","Log file: /var/log/fw/drop.log","Tools on PATH: grep awk cut sort uniq head tail wc"],
accepted:["^grep\\s+(-\\w+\\s+)*drop\\b.*drop\\.log\\s*\\|\\s*(awk|cut)\\b.*\\|\\s*sort\\b.*\\|\\s*uniq\\s+-c\\b.*\\|\\s*sort\\s+-r"],
canon:"grep DROP /var/log/fw/drop.log | awk '{print $3}' | sort | uniq -c | sort -rn | head",
out:["    412 203.0.113[.]44","     37 198.51.100[.]7","     12 192.0.2[.]55"],
err:"pipeline error — expected: select DROP lines | extract the source column | group | count | sort by count"}},
{id:"H06",type:"lq",title:"Why did the alerts stop?",th:["ips"],pts:8,
scen:"<p>Two traces, same morning. The NIDS alerted once on a SQL-injection attempt against the API — then went quiet for that host, while the web server access log shows the attack continuing and succeeding (HTTP 200). The IDS signature for this class matches the literal, case-sensitive string 'UNION SELECT' with single spaces, after basic URL decoding.</p>",
q:"<p>Based on the log evidence, why did the NIDS stop alerting while the attack continued?</p>",
hint:"Compare the exact bytes of request 1 with the requests that followed it.",
exp:"<p>Request 1 used the literal string and matched the signature (the WAF answered 403). The attacker then switched to <b>URL-encoded (%20), plus-encoded (+) and mixed-case variants</b> — same attack, different bytes. A literal, case-sensitive signature misses those variants: classic <b>false negatives</b> caused by evading the match, not by the sensor failing. The fix is updated signatures with proper normalization (consistent URL decoding, case folding) plus behavioral or anomaly detection that does not depend on one exact string. The 403 was the WAF on that one request — the 200s prove the later requests were not blocked, and nothing was patched mid-morning.</p>",
data:{lines:[
 ["m","web-api access log (src 10.20.8[.]77) — 09:12 → 09:19"],
 ["w","09:12:03  GET /api/users?id=1 UNION SELECT pass FROM creds  -> 403 (WAF block)"],
 ["k","09:12:40  GET /api/users?id=1%20UNION%20SELECT%20pass%20FROM%20creds  -> 200"],
 ["k","09:13:11  GET /api/users?id=1+UNION+SELECT+pass+FROM+creds  -> 200"],
 ["k","09:14:02  GET /api/users?id=1 uNiOn sElEcT pass FROM creds  -> 200"],
 ["k","09:15:47  GET /api/users?id=1/**/UNION/**/SELECT/**/pass/**/FROM/**/creds  -> 200"],
 ["e","09:16:30  GET /api/export?table=creds  -> 200  size=184112"],
 ["m","ids-vlan20 alert log — same window"],
 ["g","09:12:03  [1:2101:12] SQL injection attempt  src=10.20.8[.]77  -> alert"],
 ["m","09:12:04 → 09:19:59  no further alerts from sensor ids-vlan20"]],
 inner:{opts:[
  {t:"Encoding and case variants evaded the literal signature — a false negative; signatures need normalization updates"},
  {t:"The WAF blocked everything after the first request, so the IDS had nothing left to report"},
  {t:"The sensor was switched to prevention mode mid-attack and silently dropped the rest"},
  {t:"The API was patched at 09:12, which is what actually ended the whole attack"}],a:0}}},
{id:"H07",type:"match",title:"Name the detection method",th:["ips","edr"],pts:8,
scen:"<p>The SOC lead quizzes the new hire: four detections from this week, four methods. Match them — and note that two are 'the same alert, different brain'.</p>",
q:"<p>Match each detection to the method that produced it.</p>",
hint:"Known pattern = signature. Baseline deviation = anomaly. Activity sequence = behavior. Rule-of-thumb scoring = heuristic.",
exp:"<p><b>Signature-based</b> matches known exploit bytes — reliable for the known, blind to the new. <b>Anomaly-based</b> builds a baseline and flags deviations (the quiet database suddenly exporting gigabytes). <b>Behavior-based</b> flags activity sequences typical of a threat — mass file renaming plus shadow-copy deletion is ransomware behavior even with zero known signatures. <b>Heuristic</b> uses rules of thumb and scoring to catch suspicious structures (obfuscated script, packer entropy) before anything malicious happens. Mature stacks layer all four because each one covers the others' blind spots.</p>",
data:{pairs:[
 {l:"Signature-based",r:"Matches the known exploit string byte-for-byte"},
 {l:"Anomaly-based",r:"Flags traffic that deviates from the learned baseline"},
 {l:"Behavior-based",r:"Flags mass file renaming plus shadow-copy deletion on a laptop"},
 {l:"Heuristic",r:"Scores suspicious code structure, like packed and obfuscated scripts"}]}},
{id:"H08",type:"rank",title:"Rank the DNS events",th:["dns","proc"],pts:10,
scen:"<p>You are the DNS layer owner. Six events from the last 24 hours sit in one list; the morning bridge wants a ranking with reasoning. Two are 'suspect attack/exfil', two 'needs review', one 'likely benign'.</p>",
q:"<p>Rank the five events into the bands (2 / 2 / 1).</p>",
hint:"Data smuggling and zone stealing outrank noise. One host browsing one new domain is the weakest signal here.",
exp:"<p><b>Suspect attack/exfil:</b> hundreds of TXT queries with long random labels from one client is the classic DNS tunnel (data encoded in query names, usually toward a domain copied straight from the threat feeds), and an external host attempting an <b>AXFR</b> (zone transfer) of your corporate zone is reconnaissance trying to dump your internal name map — both are active attacks on the DNS filtering layer itself. <b>Needs review:</b> a tripled NXDOMAIN volume usually means malware or a misconfigured app hammering names that do not exist (worth one look), and a visit to a newly registered, uncategorized domain is weak but nonzero risk — categorize and watch. <b>Likely benign:</b> a marketing laptop resolving many analytics hostnames during a campaign check is exactly what that work looks like.</p>",
data:{items:[
 "One client sends 900 TXT queries/min to t1nk2v.c2feed[.]example",
 "External host attempts an AXFR (zone transfer) of corp[.]example",
 "NXDOMAIN volume from one host triples for an hour, then stops",
 "One host visits a newly registered, uncategorized domain",
 "Marketing laptop resolves 40 cdn[.]ads-analytics[.]example names during a campaign check"],
 bands:[{label:"Suspect attack / exfil",n:2},{label:"Needs review",n:2},{label:"Likely benign",n:1}]}}
,
{id:"H09",type:"branch",title:"Anatomy of a DNS tunnel",th:["dns","edr","proc"],pts:10,
scen:"<p>Tuesday 11:03. The DNS filter flags client 10.44.9[.]7: over 300 unique subdomains under exfil-node[.]example in one hour, all TXT queries, labels like 9x2af3.exfil-node[.]example. Egress DNS is supposed to flow only through your internal resolvers — and it did, which is the only reason you can see this at all.</p>",
q:"<p>Lead the response through its three decision points.</p>",
hint:"First confirm what process is speaking DNS. Then contain the host and the domain. Then close the door properly — at the layer that failed.",
exp:"<p>The pattern is textbook <b>DNS tunneling</b>. Decision 1: corroborate at the endpoint before touching anything — EDR shows <b>which process</b> issues the queries, turning 'a strange pattern' into a named binary. Decision 2: with a custom service confirmed, <b>isolate the host, preserve the binary for analysis, and put the domain on the blocklist at your recursive resolvers</b> — deleting logs or allowlisting a 'backup service' would destroy the case and the evidence. Decision 3: the durable fix is <b>DNS-layer control</b>: keep egress DNS on internal resolvers only, flag TXT-heavy and high-cardinality patterns automatically, and alert on volume anomalies. Banning DNS outright is impossible (it is how the network works), and 'accept the risk' is how exfil continues for months.</p>",
data:{steps:[
 {sit:"The filter flags 300+ unique subdomains, TXT queries, one client. First decision:",opts:[
  {t:"Corroborate in EDR: find which process on 10.44.9[.]7 makes these DNS calls",fb:"EDR names the process: a custom service 'SyncSvc' querying every 30 seconds.",ok:true},
  {t:"Uninstall the DNS filter — it keeps making noise",fb:"The tunnel keeps flowing, and now nothing watches DNS.",ok:false},
  {t:"Raise the alert threshold so this stops paging people",fb:"The pages stop. So does your visibility into the exfil.",ok:false}]},
 {sit:"EDR: nslookup.exe spawned every 30s by custom service 'SyncSvc' (unsigned binary in Users\\Public). Next decision:",opts:[
  {t:"Isolate the host, capture the binary for analysis, block exfil-node[.]example at the resolver",fb:"Host contained; binary in the lab; the tunnel answers no more queries.",ok:true},
  {t:"Delete the DNS logs — the disk is nearly full anyway",fb:"The one complete record of the exfil is gone.",ok:false},
  {t:"Allow 'SyncSvc' through the firewall — it might be the backup agent",fb:"The backup agent is signed and lives on a server. This is neither.",ok:false}]},
 {sit:"Leadership asks how to prevent a repeat. Final decision:",opts:[
  {t:"Keep egress DNS on internal resolvers, auto-flag TXT-heavy / high-cardinality patterns, alert on volume anomalies",fb:"Tunnel attempts now surface in minutes with a named client.",ok:true},
  {t:"Ban the DNS protocol company-wide",fb:"Nothing resolves — Active Directory, email and the internet all depend on DNS.",ok:false},
  {t:"Accept the risk — nothing can detect this reliably",fb:"The next tunnel runs unwatched. The board memo writes itself.",ok:false}]}]}},
{id:"H10",type:"spot",title:"The exception that eats the policy",th:["dlp"],pts:6,
scen:"<p>Quarterly DLP review. The pii-outbound policy blocks national IDs in outbound email — on paper. In practice, zero blocks in 90 days while the privacy office keeps receiving leaked-data complaints. The policy as deployed:</p>",
q:"<p>Click the line that makes the policy fail its purpose.</p>",
hint:"Who benefits from an exception, and what do attackers type into a subject line?",
exp:"<p>The exception <b>allows any message whose subject contains 'confidential'</b> — which is exactly backwards: attackers and careless users label sensitive mail 'confidential' all the time, so the exception exempts the very traffic this email DLP policy exists to catch. That is why 90 days produced zero blocks. Exceptions should be scoped to validated business recipients or approved flows — never to free-text fields a sender controls. The detect template, scope and action are sound.</p>",
data:{code:[
 {t:"policy \"pii-outbound\" {"},
 {t:"  detect: template \"national-id\""},
 {t:"  scope: outbound email"},
 {t:"  action: block"},
 {t:"  exception: allow if subject contains \"confidential\"",bad:true},
 {t:"}"}],multi:false}},
{id:"H11",type:"fill",title:"Choose the DLP patterns",th:["dlp"],pts:8,
scen:"<p>The DLP engineer builds a custom template set because the vendor's generic patterns over-match. Compliance requires: a national ID pattern tolerant of optional dashes, a payment-card pattern that covers the realistic card lengths, and the mandated rollout mode.</p>",
q:"<p>Complete the template set from the bank.</p>",
hint:"A national ID is 3-2-4 digit groups with optional dashes. Card numbers run longer than any phone number — 13 to 19 digits — and then pass a checksum.",
exp:"<p>National IDs are <b>\\d{3}-?\\d{2}-?\\d{4}</b>: three groups with optional dashes — \\d{9} misses formatted input, \\d{3}\\d{2}\\d{4} likewise. Payment cards are <b>13–19 digits</b> (\\d{13,19}) followed by a checksum; a hard \\d{16} misses 13-, 15- and 19-digit cards, and \\d{1,19} matches nearly every number on earth. New patterns always start in <b>monitor</b> mode so the false-positive rate is measured before anyone is blocked, and pair the templates with <b>classification labels</b> so the strictest patterns only run on files marked Confidential or Restricted. \\w+ and \\d{1,19} are the over-matching traps; 'block' is the premature-enforcement trap.</p>",
data:{text:"Template set: national ID must match {0}; payment card numbers must match {1} and pass the Luhn checksum; deploy every new template in {2} mode for two weeks before enforcement.",
bank:[{t:"\\d{3}-?\\d{2}-?\\d{4}",c:true},{t:"\\d{13,19}",c:true},{t:"monitor",c:true},{t:"\\d{9}",c:false},{t:"\\d{16}",c:false},{t:"\\d{1,19}",c:false},{t:"\\w+",c:false},{t:"block",c:false}],
exp:[0,1,2]}},
{id:"H12",type:"multi",title:"Monitor mode before block mode",th:["dlp","proc"],pts:8,
scen:"<p>Legal, the business units and the DLP team meet before the new data-exfil policy goes anywhere near block mode. The DLP lead must justify the monitor-first rollout in defensible terms.</p>",
q:"<p>Select the <b>three</b> reasons that actually justify monitor mode first.</p>",
hint:"Monitor mode is about knowledge and consent — measurement, tuning, and getting the lawyers on board.",
exp:"<p>Monitor mode lets you <b>measure real hit rates</b> against live business traffic, <b>tune false positives</b> before a block ever disrupts a payroll run, and give <b>legal and compliance time to agree</b> on the response (notify whom? block what? which evidence is kept?). It works the same for <b>cloud DLP</b> on SaaS email and file shares: <b>endpoint agents</b> and <b>network DLP</b> gateways both feed the same monitor data first. The wrong options confuse the mode itself: monitor mode does not block silently, does not make patterns 'stronger' (patterns are patterns — mode is only about the action), and blocking is absolutely possible with DLP — that is the whole point of switching modes after tuning.</p>",
data:{opts:[
 {t:"Measure how often the pattern hits real business traffic",c:true},
 {t:"Find and fix false positives before users are disrupted",c:true},
 {t:"Give legal and compliance time to agree on the response",c:true},
 {t:"Monitor mode blocks without alerting, which users prefer",c:false},
 {t:"Monitor mode makes the detection patterns stronger",c:false},
 {t:"Blocking is technically impossible with DLP tools",c:false}]}},
{id:"H13",type:"lq",title:"RADIUS rejects at 18:02",th:["nac"],pts:8,
scen:"<p>Help desk flood: 'no network on the office Wi-Fi'. Wired phones work. The RADIUS log for the last minutes is below; the certificate authority issued device certificates in one batch, and the CA's notAfter policy is one year.</p>",
q:"<p>What is the most likely root cause and the correct next step?</p>",
hint:"Same method, same reject reason, timestamps clustered — what expires in a batch?",
exp:"<p>Both rejects are <b>EAP-TLS with expired device certificates</b> — and RADIUS is clearly alive (it answers reject, and the phone that authenticates with PEAP-MSCHAPv2 succeeds). Certificates issued in the same enrollment batch expire together, so a cluster of rejects with 'certificate expired' points to <b>batch expiry</b>, not a server fault. The fix: re-enroll the affected devices and fix the renewal automation (SCEP/MDM auto-renewal) so next year does not repeat. 'RADIUS is down' contradicts the accepts; 'the switch lost 802.1X config' contradicts the working phones; and users' passwords are irrelevant when authentication is certificate-based.</p>",
data:{lines:[
 ["m","radius-auth01 — 18:02 → 18:04 — offices ESSID 'CORP'"],
 ["e","18:02:11  Access-Request  user=laptop-fs04  method=EAP-TLS  -> reject reason=certificate expired (notAfter Mar 01)"],
 ["e","18:02:11  Access-Reject  vlan=quarantine  port=ge-0/14"],
 ["e","18:02:29  Access-Request  user=laptop-fs05  method=EAP-TLS  -> reject reason=certificate expired (notAfter Mar 01)"],
 ["e","18:02:29  Access-Reject  vlan=quarantine  port=ge-0/15"],
 ["g","18:03:02  Access-Request  user=phone-sr12  method=PEAP-MSCHAPv2  -> accept vlan=corp"],
 ["e","18:03:40  Access-Request  user=laptop-fs04  method=EAP-TLS  -> reject reason=certificate expired"],
 ["m","18:04:10  summary: 7 rejects (EAP-TLS, expired) / 1 accept / 0 timeouts"]],
 inner:{opts:[
  {t:"Device certificates from one enrollment batch expired together — re-enroll and fix auto-renewal"},
  {t:"The RADIUS server is down — restart the service and watch the rejects clear"},
  {t:"The access switch lost its 802.1X configuration during last night's firmware update"},
  {t:"Users forgot their passwords after the holiday — schedule a password reset campaign"}],a:0}}},
{id:"H14",type:"branch",title:"The printer that became a laptop",th:["nac","proc"],pts:10,
scen:"<p>Port ge-0/22 passed 802.1X with a <b>valid user certificate</b> — but the MAC address belongs to the floor printer, and DHCP fingerprints a Windows laptop. The switch is configured for user-certificate EAP-TLS; MAC address is not an authentication factor, just an observation.</p>",
q:"<p>Drive the three decisions of the NAC incident.</p>",
hint:"The certificate authenticated a user — but who is holding the certificate, and can you trust MACs at all?",
exp:"<p>Decision 1: the mismatch (printer MAC + laptop fingerprint + user cert) is a probable <b>device/certificate misuse</b> — quarantine first, then compare the certificate identity against the asset inventory. Decision 2: after confirmation, the durable fix is <b>device certificates with EAP-TLS plus MDM posture</b> — MAC addresses are trivially spoofable, so 'better MAC filtering' and 'turn off 802.1X' both leave the door open. Decision 3: rollouts fail when they strangle legitimate devices, so new devices onboard through a <b>provisioning VLAN with temporary certificates</b> — not by pausing NAC for everyone or sharing an admin certificate (one certificate to rule them all is an attacker's dream).</p>",
data:{steps:[
 {sit:"Printer MAC, laptop fingerprint, valid user certificate. First decision:",opts:[
  {t:"Quarantine the port and compare the certificate identity against the asset inventory",fb:"Inventory shows the certificate belongs to a contractor, not the printer.",ok:true},
  {t:"Trust the certificate and open all VLANs to the device",fb:"The laptop now sits on the finance VLAN. Nobody checks whose cert it was.",ok:false},
  {t:"Shut down the whole floor until the mystery is solved",fb:"200 people offline — for a question a database query answers.",ok:false}]},
 {sit:"Confirmed: a contractor cloned the printer's MAC to obtain network access. Next decision:",opts:[
  {t:"Roll out device certificates (EAP-TLS) with MDM posture so a spoofed MAC grants nothing",fb:"MAC spoofing no longer matters — authentication is certificate-bound.",ok:true},
  {t:"Add stricter MAC filtering on the printer VLAN",fb:"MACs are user-changeable; the next clone takes two minutes.",ok:false},
  {t:"Disable 802.1X on that switch — it clearly caused trouble",fb:"The door is now open to everyone on every port.",ok:false}]},
 {sit:"Facilities worries about blocking legitimate new devices during rollout. Final decision:",opts:[
  {t:"Onboard new devices via a provisioning VLAN with temporary certificates",fb:"Legitimate devices enroll smoothly; unknown ones stay fenced.",ok:true},
  {t:"Pause NAC for everyone during the rollout",fb:"For six weeks, the network has no admission control at all.",ok:false},
  {t:"Give every device the same admin certificate",fb:"One leaked certificate now unlocks the whole company.",ok:false}]}]}},
{id:"H15",type:"match",title:"Who does what in 802.1X",th:["nac"],pts:8,
scen:"<p>After the printer incident, the help desk needs the 802.1X role model on one slide. Four terms, four roles — no overlaps, no confusion.</p>",
q:"<p>Match each role to its job in the handshake.</p>",
hint:"The asker, the gatekeeper, the decision-maker, and the waiting room.",
exp:"<p>The <b>supplicant</b> is the client asking for access. The <b>authenticator</b> (switch or AP) is the gatekeeper: it relays messages and enforces the port state — open, closed or quarantined. The <b>authentication server</b> (RADIUS) actually validates credentials/certificates and returns the decision plus attributes like the VLAN. The <b>quarantine VLAN</b> is not a role in the handshake but the restricted segment where failed or unhealthy devices wait. Confusing the authenticator with the decision-maker is the classic new-hire mistake — the switch never decides, it only enforces.</p>",
data:{pairs:[
 {l:"Supplicant",r:"The client device asking for network access"},
 {l:"Authenticator",r:"The switch or AP that relays requests and enforces the port state"},
 {l:"Authentication server",r:"The RADIUS server that validates credentials and returns the decision"},
 {l:"Quarantine VLAN",r:"Restricted segment where devices that fail posture wait"}]}},
{id:"H16",type:"qcm",title:"The jailbroken tablet that passed",th:["nac","edr"],pts:8,
scen:"<p>A tablet on the corporate WLAN passed NAC admission with a healthy posture result. Two days later, MDM flags the same tablet as <b>jailbroken</b>. The tablet never runs the persistent agent — its posture check was the dissolvable web agent through the captive portal, which can only read what the browser can see.</p>",
q:"<p>Why did NAC pass a jailbroken device — and what is the structural fix?</p>",
hint:"Which component can actually see OS-level integrity, and was that component part of the check?",
exp:"<p>The <b>dissolvable agent cannot inspect device integrity</b> — it runs inside the browser for one check and, like every agentless check, sees nothing below the browser sandbox, so a jailbroken tablet reports healthy. The structural fix is <b>MDM integration</b>: feed MDM signals into the posture assessment, because the MDM supervises the OS, knows about jailbreaks, encryption and profile compliance, and can revoke or downgrade access — continuously, not once. 'NAC does not work on wireless' is false (802.1X works fine on Wi-Fi), RADIUS misconfiguration would show rejects, and moving the tablet to the guest VLAN is where it should end up, not the root cause analysis.</p>",
data:{opts:[
 {t:"The dissolvable agent cannot see device integrity — integrate MDM signals into the posture check"},
 {t:"NAC does not really work on wireless networks — move the tablet to the wired LAN"},
 {t:"RADIUS is misconfigured and accepts everything, which is why the posture passed"},
 {t:"The tablet should simply have been placed on the guest VLAN from the very start"}],a:0}}
,
{id:"H17",type:"lmulti",title:"Root cause on the sales laptop",th:["edr","proc"],pts:10,
scen:"<p>21:17 — EDR raises a critical behavior detection on sales-lt-11 (user alu): process injection into rundll32.exe. You have the telemetry timeline. The incident manager wants actions that follow from the root cause, not generic advice.</p>",
q:"<p>Select the <b>three</b> actions the root cause analysis directly supports.</p>",
hint:"Containment, indicators, and the process that got injected — those three directions are in the timeline.",
exp:"<p>The timeline shows the full chain: downloaded archive → unsigned binary in AppData → <b>injection into rundll32.exe</b> → TLS outbound → scheduled-task persistence. That supports (1) <b>hunting the fleet</b> for svchost32.exe and the task name 'OneDriveSync' — the IOCs are right there in the telemetry; (2) <b>blocking the URL and hashes and rotating the user's credentials</b> because the session reached an external server; and (3) <b>inspecting the injected process</b> (rundll32 pid 2204 memory) since the malware runs inside it. Deleting alerts, blaming Chrome ('reinstall the browser') or waiting for the patch cycle are non-actions dressed as decisions — root cause analysis exists precisely to drive the first three.</p>",
data:{lines:[
 ["m","EDR telemetry — sales-lt-11 — Mar 03 21:14 → 21:17"],
 ["w","21:14:11  chrome.exe → download invoice-mar.zip from hxxp://files-share[.]example/dl/8812"],
 ["k","21:15:02  archive extracted → C:\\Users\\alu\\AppData\\Roaming\\svchost32.exe  (unsigned)"],
 ["e","21:15:40  svchost32.exe → process injection into rundll32.exe (pid 2204)"],
 ["e","21:16:12  rundll32.exe (pid 2204) → TLS out to 185[.]199[.]108[.]153:443"],
 ["k","21:16:45  rundll32.exe (pid 2204) → schtasks /create OneDriveSync  (persistence)"],
 ["g","21:17:01  EDR detection: behavior 'trojan-like injection' severity=critical  auto-isolate engaged"]],
 inner:{opts:[
  {t:"Hunt every endpoint for svchost32.exe, update.vbs-style artefacts and the task name OneDriveSync",c:true},
  {t:"Block the URL and file hashes at proxy/EDR, and rotate user alu's credentials",c:true},
  {t:"Inspect rundll32.exe (pid 2204) memory — the malware runs injected inside it",c:true},
  {t:"Delete the EDR alert once the host is reimaged",c:false},
  {t:"Reinstall Chrome — the browser downloaded malware, so it is broken",c:false},
  {t:"Wait for the next monthly patch cycle before touching anything",c:false}]}}},
{id:"H18",type:"branch",title:"Ransomware on the CFO's laptop",th:["edr","proc"],pts:10,
scen:"<p>23:40, quarter-close night. EDR prevention just engaged on cfo-lt-01: mass file encryption in progress, files renamed *.lockd, 40 files already hit before the block. The CFO is unreachable; her laptop holds unsaved local changes. Backups run in 20 minutes.</p>",
q:"<p>Make the three calls of the night. Business pressure is the trap, not the guidance.</p>",
hint:"Isolation is non-negotiable. Evidence first, restore second. And one host is never the whole story — hunt the pattern.",
exp:"<p>Decision 1: <b>host isolation stays</b> — EDR auto-isolation contained the network spread; releasing it to 'finish the close' risks every share the CFO can reach, and shutting a server room does nothing about the infected laptop. Decision 2: with encrypted files, finishing the close on that device is already impossible — <b>capture memory and disk first</b>, then restore from clean backups; un-isolating 'for ten minutes' risks everything and re-infects. Decision 3: <b>hunt the rename pattern and ransom note across all endpoints with EDR</b> — assuming a single laptop is how ransomware becomes an enterprise event, and manual AV scans by email cannot see what EDR already can.</p>",
data:{steps:[
 {sit:"EDR prevention engaged; 40 files encrypted; CFO unreachable; her laptop holds unsaved work. First decision:",opts:[
  {t:"Keep EDR isolation, verify no SMB shares were touched, open the incident bridge",fb:"Isolation holds; shares show no access; the bridge starts.",ok:true},
  {t:"Release isolation so the CFO can finish the quarter close",fb:"Five minutes later the laptop reaches the finance share again.",ok:false},
  {t:"Shut down the finance server room as a precaution",fb:"Quarter-close stops company-wide — for an infection contained on one laptop.",ok:false}]},
 {sit:"Backup job in 20 minutes; unsaved local changes on the isolated laptop. Next decision:",opts:[
  {t:"Capture volatile memory and a disk image first; restore the device from clean backups afterwards",fb:"Evidence preserved; the laptop will be rebuilt and its files restored from backup.",ok:true},
  {t:"Un-isolate for ten minutes so she can save the spreadsheets",fb:"The ransomware resumes — including any mapped shares she opens.",ok:false},
  {t:"Restore last night's backup onto the laptop immediately, no analysis",fb:"The restore overwrites the only evidence of how it started.",ok:false}]},
 {sit:"Containment holds. Now scope the incident. Final decision:",opts:[
  {t:"Hunt the *.lockd rename pattern and the ransom note filename across all endpoints with EDR",fb:"Two more laptops flagged early — same campaign, caught before encryption spread.",ok:true},
  {t:"Assume only one laptop is affected and close the bridge",fb:"Two days later, three departments lose files at once.",ok:false},
  {t:"Email all staff to run antivirus scans and wait for results",fb:"Uncontrolled, unverifiable — and the attacker keeps working overnight.",ok:false}]}]}},
{id:"H19",type:"multi",title:"What belongs in the rollback plan",th:["proc","fw","ips"],pts:8,
scen:"<p>Tonight 22:00: the IPS policy moves from detection to prevention on the egress pair. The change ticket requires a rollback plan before the CAB will approve. The junior admin drafted six candidate items; the change manager reviews.</p>",
q:"<p>Select the <b>four</b> items that belong in a real rollback plan.</p>",
hint:"A rollback plan answers: how do we get back to known-good, how do we know we must, and who do we tell?",
exp:"<p>A rollback plan needs the <b>exported current policy</b> (known-good state), the <b>exact restore steps</b> (no improvising at 23:00), <b>success criteria with a monitoring window</b> (how you decide the change worked or failed), and the <b>communication line</b> (who calls whom when it fails). 'Never test in monitor mode' is the opposite of good practice — monitor-first is how you avoid needing the rollback. Deleting old alerts cleans a dashboard, not a risk, and has nothing to do with rollback.</p>",
data:{opts:[
 {t:"Exported copy of the current, working policy",c:true},
 {t:"Exact steps and commands to restore the previous policy",c:true},
 {t:"Success criteria and the monitoring window for the change",c:true},
 {t:"Call tree and communication plan if the change fails",c:true},
 {t:"A commitment to never test changes in monitor mode",c:false},
 {t:"A cleanup job that deletes the old alerts from the dashboard",c:false}]}},
{id:"H20",type:"spot",title:"The automation that isolates everyone",th:["edr","proc"],pts:6,
scen:"<p>A junior engineer 'improved' the XDR playbook. In its first week it auto-isolated 23 workstations — 21 of them false alarms during a busy Monday. Users lost unsaved work; the CISO wants the flaw named precisely.</p>",
q:"<p>Click the line whose threshold causes the damage.</p>",
hint:"Medium-severity alerts fire on ordinary software noise. What does 'any' + 'medium' multiply out to on a fleet of 4,000?",
exp:"<p>The trigger <b>any alert with severity ≥ medium</b> guarantees business disruption: medium alerts include harmless quirks (a dev tool, an odd macro), and at fleet scale 'any' means constant isolation. Auto-containment belongs to <b>high-confidence, critical detections</b> — ransomware behavior, confirmed C2 — with everything else queued for an analyst, or enriched first by <b>SOAR playbooks</b>. The action, the notification and the automation block itself are fine; the trigger's threshold and breadth are the flaw.</p>",
data:{code:[
 {t:"automation \"auto-contain\" {"},
 {t:"  trigger: any alert severity >= medium",bad:true},
 {t:"  action: isolate host immediately"},
 {t:"  notify: soc-mailbox"},
 {t:"}"}],multi:false}},
{id:"H21",type:"order",title:"The EDR-driven response sequence",th:["edr","proc"],pts:9,
scen:"<p>Trainee question, senior stakes: put the phases of an EDR-assisted response in order. The detection already fired; the runbook has seven steps and someone shuffled the cards.</p>",
q:"<p>Order the seven steps from first to last.</p>",
hint:"Contain before you collect, collect before you clean, learn last.",
exp:"<p><b>Detect</b> (the alert) → <b>contain</b> (isolate before anything spreads) → <b>collect</b> (process tree, memory, disk artefacts while volatile evidence lives) → <b>root cause</b> (patient zero, initial access, what else it touched) → <b>hunt</b> (threat hunting: sweep every endpoint for the same IOCs) → <b>eradicate and recover</b> (remove persistence, reimage, restore from clean backups) → <b>review</b> (update detections and the runbook). Cleaning before containing re-infects you; skipping the hunt leaves patient-two waiting; skipping review guarantees a repeat.</p>",
data:{items:[
 "Detect: EDR raises the high-severity behavior alert",
 "Contain: isolate the host with EDR",
 "Collect: pull process tree, memory and disk artefacts",
 "Root cause: identify patient zero and the initial access vector",
 "Hunt: sweep all endpoints for the same indicators of compromise",
 "Eradicate and recover: remove persistence, reimage, restore clean backups",
 "Review: update detections and the runbook from lessons learned"]}},
{id:"H22",type:"cat",title:"Assign each event to its control",th:["fw","dns","dlp","nac","edr"],pts:10,
scen:"<p>The SOC's new triage board has one column per control stack. Eight events from the morning must land in exactly one column each — the tool that would own the response.</p>",
q:"<p>Drag each event to the control stack that owns it.</p>",
hint:"Session and application = perimeter. Name resolution = DNS. Content of data = DLP. Network admission = NAC. What runs on the device = endpoint.",
exp:"<p><b>NGFW:</b> geo-blocking and blocking an unapproved SSH application tag are session/application-layer decisions on the perimeter. <b>DNS filter:</b> a <b>DNS sinkhole</b> for a C2 domain and blocking a newly registered phishing domain before it resolves both live at the resolver. <b>DLP:</b> blocking an SSN-template attachment and stopping the customer-list paste into webmail are data-content decisions — content matters, not the channel. <b>NAC:</b> the guest portal with posture check and quarantining a switch port that fails posture are admission decisions. <b>EDR/HIDS:</b> killing a process and isolating a laptop with ransomware behavior is endpoint response; a file-integrity alert is endpoint telemetry too.</p>",
data:{buckets:[{k:"ngfw",label:"NGFW"},{k:"dns",label:"DNS filter"},{k:"dlp",label:"DLP"},{k:"nac",label:"NAC"},{k:"edr",label:"EDR / HIDS"}],
items:[
 {t:"Geo-block a country at the perimeter",k:"ngfw"},
 {t:"Sinkhole a known C2 domain",k:"dns"},
 {t:"Block an email attachment matching the SSN template",k:"dlp"},
 {t:"Guest Wi-Fi portal with a posture check",k:"nac"},
 {t:"Kill the process and isolate a laptop with ransomware behavior",k:"edr"},
 {t:"Block an unapproved application tag 'tools/ssh-client'",k:"ngfw"},

{id:"H23",type:"qcm",title:"The filter that stopped seeing names",th:["dns","fw"],pts:8,
scen:"<p>The DNS filter dashboard shows a 40% drop in queries — but web traffic is unchanged, and the NGFW sees growing TLS volume to known DoH provider addresses (1[.]1[.]1[.]1 class) plus a rise of direct-to-IP connections. Browsers shipped with DoH enabled by default last month.</p>",
q:"<p>Which modification restores visibility without breaking the internet for users?</p>",
hint:"You cannot categorize what you cannot resolve. Keep name resolution on the path you control — and be precise about which ports carry which protocol.",
exp:"<p>The fix is to <b>make your own resolvers the only name-resolution path</b>: block the known DoH provider IPs and categories at the NGFW, permit udp/53 (and approved encrypted DNS like DoT on tcp/853) only to the internal resolvers, and let everything else fall to the deny. That restores <b>domain categorization</b> without disabling DNS for users. Disabling the filter surrenders; blocking port 53 while allowing DoH inverts the intent (you would force the bypass you are fighting); and a 'second DNS filter for DoH' still lets clients skip your policy — the traffic must be forced onto the path you control.</p>",
data:{opts:[
 {t:"Force internal resolvers: block known DoH providers at the NGFW, allow udp/53 only to your resolvers"},
 {t:"Disable the DNS filter and its categories — DoH clearly won and users need their browsers"},
 {t:"Allow DoH freely to any provider but block all outbound udp/53 at the perimeter"},
 {t:"Install a second DNS filter beside the first one that handles only the DoH traffic"}],a:0}},
{id:"H24",type:"fill",title:"Write the DNS egress ruleset",th:["fw","dns"],pts:8,
scen:"<p>After the DoH bypass, the network team rewrites the perimeter ruleset for name resolution. Least privilege: only resolvers you own may resolve; one encrypted-DNS exception; everything else falls to the final rule.</p>",
q:"<p>Complete the ruleset from the bank.</p>",
hint:"Permit what you own, deny the rest of the port, allow the approved encrypted channel, and the last rule is the catch-all.",
exp:"<p><b>Permit</b> udp/53 only to the two internal resolvers; <b>deny</b> udp/53 to any other server (this kills direct-to-public-resolver bypasses); allow <b>tcp/853</b> (DNS-over-TLS) only to the approved secure resolver; and the final <b>deny any any</b> — the ACL's last line — catches everything else, making the firewall's implicit deny explicit and logged. Writing allow and deny rules that name exact ports and protocols is what keeps the path enforceable. 'Allow any any' would recreate the incident; udp/123 is NTP; 'block all DNS' is how you take the company offline; tcp/22 has no place in a DNS ruleset.</p>",
data:{text:"Perimeter ruleset: {0} udp/53 from any to the two internal resolvers only. {1} udp/53 from any to any other name server. Allow {2} to the approved secure resolver. Log everything and let the final {3} catch the rest.",
bank:[{t:"permit",c:true},{t:"deny",c:true},{t:"tcp/853 (DoT)",c:true},{t:"deny any any",c:true},{t:"allow any any",c:false},{t:"udp/123",c:false},{t:"block all DNS",c:false},{t:"tcp/22",c:false}],
exp:[0,1,2,3]}}

{id:"H25",type:"match",title:"Capability sets, one line each",th:["fw","dlp","nac","edr"],pts:8,
scen:"<p>Vendor week. Four one-liners arrive in the RFP inbox; procurement needs each capability mapped to the product class that actually delivers it — marketing departments have mixed everything up.</p>",
q:"<p>Match each product class to the capability set that defines it.</p>",
hint:"App-aware edge, data content, network admission, cross-product correlation — four different jobs.",
exp:"<p>An <b>NGFW</b> (next-generation firewall) is defined by app-aware perimeter filtering with integrated IPS and TLS inspection — speed plus context at the edge. <b>DLP</b> is defined by content: pattern-based protection for <b>data at rest, in transit or in use</b>, against data leaving through email, web, USB or other removable media. <b>NAC</b> is admission control — posture checks and VLAN assignment deciding who may join. <b>XDR</b> is correlation across products: endpoint, identity, network and cloud telemetry in one detection engine, fed by continuous monitoring. A UTM would bundle similar features at lower performance; an MDR service would run any of these for you — but the classes here are about capability, not delivery model. And remember EDR vs anti-malware: signature-only antivirus cannot see behavior like injection or correlate telemetry chains.</p>",
data:{pairs:[
 {l:"NGFW",r:"App-aware perimeter filtering with integrated IPS and TLS inspection"},
 {l:"DLP",r:"Pattern-based protection for data leaving via email, web or USB"},
 {l:"NAC",r:"Admission control: posture checks and VLAN assignment"},
 {l:"XDR",r:"Cross-product correlation of endpoint, identity, network and cloud telemetry"}]}},
{id:"H26",type:"rank",title:"Cross-stack prioritization",th:["proc","edr","dns","dlp","nac","fw"],pts:10,
scen:"<p>Five alerts, five different stacks, one on-call engineer. The controller domain is watched by auditors; the CIO reads the incident report every Monday.</p>",
q:"<p>Rank the five: 2 in 'P1 — now', 2 in 'P2 — this shift', 1 in 'P3 — routine'.</p>",
hint:"Domain controllers and open perimeters are company-wide blast radius. Patching waits are the definition of routine.",
exp:"<p><b>P1:</b> injection behavior on a <b>domain controller</b> threatens every identity in the forest, and an active <b>any/any rule</b> on a branch firewall is an open perimeter — both can escalate company-wide within minutes. <b>P2:</b> 30 SSN-pattern hits heading to a partner domain is a probable <b>data leak</b> (business-level harm, but contained and traced), and a finance group visiting a newly registered login-page domain smells like targeted phishing — both deserve the shift, not the minute. <b>P3:</b> one device sitting in quarantine for outdated patches is the NAC control working exactly as designed. The whole ranking is a <b>business-impact judgment</b>, not a first-in-first-out queue.</p>",
data:{items:[
 "EDR critical: process injection behavior on the domain controller",
 "Firewall: any/any rule discovered active on the branch firewall",
 "DLP monitor mode: 30 SSN-pattern hits in mail to a partner domain",
 "DNS filter: newly registered domain with a login form visited by the finance group",
 "NAC: one device in quarantine for outdated patches"],
 bands:[{label:"P1 — act now",n:2},{label:"P2 — this shift",n:2},{label:"P3 — routine",n:1}]}},
{id:"H27",type:"lmulti",title:"Cross-reference the change log",th:["proc","fw"],pts:9,
scen:"<p>Post-incident review of the bastion scare. You have the change log and the ticket system export. Approved tickets that night: CH-9101 (scoped deny rule) and CH-9102 (emergency rollback, approved by the on-call manager by phone, documented after). Everything else that touched the firewall was unapproved.</p>",
q:"<p>Select the <b>two</b> conclusions the combined evidence supports.</p>",
hint:"Match every applied line to a ticket — and remember the emergency rollback also has an approval path.",
exp:"<p>The applied rule 'permit tcp 92.63.107[.]70 → any 22' matches <b>no ticket</b>, and an SSH session from that address landed on the bastion within minutes — so 'applied outside change control and used quickly' is fully supported. The emergency rollback CH-9102 that removed the rule was itself approved (phone, documented after) and was the correct containment. What the evidence does <b>not</b> support: svc-fwadmin's other changes all match approved tickets, so the blame falls on the unattributed line, not the admin's whole evening — and 'keep the SSH rule for convenience' ignores that the rule existed precisely to bypass review.</p>",
data:{lines:[
 ["m","change log vs tickets — Mar 04 22:00 → 23:10"],
 ["g","22:00  ticket CH-9101 approved: deny tcp any -> 10.9.9[.]50 3389 (window 22:00-23:00)"],
 ["g","22:14  applied by svc-fwadmin: deny tcp any -> 10.9.9[.]50 3389  [matches CH-9101]"],
 ["e","22:31  applied by ext-contractor: permit tcp 92.63.107[.]70 -> any 22  [no ticket found]"],
 ["e","22:40  auth alert: ssh session from 92.63.107[.]70 to bastion  user=root"],
 ["g","23:05  applied by svc-fwadmin: emergency CH-9102 — remove the unauthorized rule  [phone approval on record]"],
 ["m","23:10  bastion session terminated; source added to watchlist"]],

  {t:"A rule was applied outside change control and used within minutes",c:true},
  {t:"The emergency rollback CH-9102 followed the approval path and was the right containment",c:true},
  {t:"svc-fwadmin applied the unauthorized rule",c:false},
  {t:"The bastion should keep the new SSH rule for the contractor",c:false}]}}},
{id:"H28",type:"multi",title:"Is the DNS filter being bypassed?",th:["dns","proc"],pts:8,
scen:"<p>Monthly control review. The DNS filter reports 'working as configured', but three engineers independently noticed odd traffic patterns this month. The review asks which observations actually indicate bypass.</p>",
q:"<p>Select the <b>three</b> observations that indicate the DNS filter is being bypassed.</p>",
hint:"Bypass means resolution is happening somewhere you cannot see — or not happening at all (direct IPs).",
exp:"<p>Bypass shows up as resolution moving off your path: <b>TLS to known DoH providers</b> (encrypted DNS you cannot categorize), a <b>rise of direct-to-IP traffic</b> (no name lookup at all — the client already had the address), and <b>queries to public resolvers like 8[.]8[.]8[.]8</b> instead of the internal ones. More NXDOMAIN from your own resolvers is your resolvers working (answering 'no such name'); more intranet visits is normal; and the console showing more blocked categories proves the filter is seeing traffic — the opposite of bypass.</p>",
data:{opts:[
 {t:"TLS sessions from clients to known DoH provider addresses",c:true},
 {t:"A rise of direct-to-IP connections with no DNS lookup at all",c:true},
 {t:"Queries going to 8[.]8[.]8[.]8 instead of the internal resolvers",c:true},
 {t:"More NXDOMAIN replies from the internal resolvers",c:false},
 {t:"More users visiting the intranet portal",c:false},
 {t:"The filter console shows more blocked categories than last month",c:false}]}},
{id:"H29",type:"spot",title:"The quarantine that is not one",th:["nac"],pts:6,
scen:"<p>Design review of the branch-office NAC standard. The author insists everything is fine: posture runs monthly, the guest network is isolated, 802.1X is on everywhere. One line, though, quietly defeats the entire quarantine concept.</p>",
q:"<p>Click the line that lets a compromised device reach almost everything after failing posture.</p>",
hint:"What is the one job of a quarantine network — and does this config let it do that job?",
exp:"<p>A quarantine VLAN exists to isolate failing devices; this one grants <b>10.0.0[.]0/8</b> — the entire internal space. Any compromised device that fails posture lands in a 'waiting room' with keys to every room in the building: the control fails open. Remediation access must be an explicit, narrow allow-list (patch and AV servers only). Monthly posture is weak but a deliberate trade-off, the guest network is correctly internet-only, and 802.1X everywhere is right — the quarantine scope is the design-breaking line.</p>",

 {t:"  posture-check frequency: every 30 days"},
 {t:"  quarantine vlan: full access to 10.0.0[.]0/8",bad:true},
 {t:"  guest wifi: open, captive portal, internet only"},
 {t:"  802.1x: enabled on all user ports"},
 {t:"}"}],multi:false}},
{id:"H30",type:"order",title:"Safe IPS signature rollout",th:["ips","proc"],pts:9,
scen:"<p>The vendor shipped a major signature-set update covering 40 new detections. The CAB will approve the rollout only with the full lifecycle in order — they have been burned before by 'deploy and pray'.</p>",
q:"<p>Order the six steps of a safe signature rollout.</p>",
hint:"Lab first, watch second, tune third, enforce the confident ones, keep reviewing the ambiguous, write it all down.",
exp:"<p>The safe lifecycle: <b>test</b> in the lab against recorded business traffic → <b>deploy in monitor mode</b> to production (visibility with zero blocking risk) → <b>alert tuning</b>: analyze the alerts and remove the false positives the lab could not predict → <b>enable prevention for high-confidence signatures only</b> → keep <b>ambiguous signatures in detection with a monthly review</b> (they eventually graduate or retire) → <b>document</b> the change, the exceptions and the rollback path. Enforcement before tuning is how prevention mode gets disabled forever after one bad morning.</p>",
data:{items:[
 "Test the new signature set in the lab against recorded business traffic",
 "Deploy to production sensors in monitor (detection) mode",
 "Analyze the alerts and tune out the false positives",
 "Enable prevention for the high-confidence signatures",
 "Keep ambiguous signatures in detection with a monthly review",
 "Document the change, the exceptions and the rollback path"]}}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function idx(n){var r=[];for(var i=0;i<n;i++)r.push(i);return r;}
function ensurePerm(n,st,key){if(!st[key])st[key]=shuf(idx(n));return st[key];}
function ensureAns(st,shape){if(!st.ans)st.ans=shape;else{for(var k in shape)if(st.ans[k]===undefined)st.ans[k]=shape[k];}return st.ans;}

    var b=document.createElement('button');b.className='nd';

function warn(msg){var w=$('#warnbox');if(w){w.textContent=msg;setTimeout(function(){if(w.textContent===msg)w.textContent='';},3500);}}
function checkCurrent(){
  if(!S.started||S.ended)return;
  var ex=exOf(S.cur),st=curSt();
  if(st.checked){S.checkPause=!S.ended;renderAll();return;}
  if(!R[ex.type].has(ex,st)){warn('Select or place an answer first.');return;}
  if(ex.type==='branch'&&st.ans.step<ex.data.steps.length){warn('Make every decision first — the branch is not finished.');return;}
  var res=R[ex.type].eval(ex,st);
  var maxEff=ex.pts*(st.usedHint?0.9:1);
  st.frac=res.frac;st.earned=res.frac*maxEff;st.max=maxEff;st.marks=res.marks;st.elems=res.elems;st.bk=res.bk||null;st.your=res.your;st.corr=res.corr;st.lastOk=!!res.lastOk;
  st.checked=true;st.skipped=false;
  if(!S.ended)S.checkPause=true;
  S.note='';S.scrollTo='fb';
  renderAll();
}
function revise(){var st=curSt();st.checked=false;st.earned=0;st.frac=0;st.marks=null;st.elems=null;st.bk=null;S.note='';S.scrollTo='top';renderAll();}
function useHint(){var st=curSt();if(st.usedHint||st.checked)return;st.usedHint=true;S.scrollTo='top';renderAll();}
function skipCur(){var st=curSt();if(st.checked)return;st.skipped=true;S.note='';S.scrollTo='top';if(S.cur<EX.length-1)S.cur++;renderAll();}
function goNext(){
  if(S.checkPause)S.checkPause=false;
  S.note='';S.scrollTo='top';
  if(S.cur<EX.length-1){S.cur++;renderAll();}
  else{S.note='End of exam — review the navigator or press Finish & Submit. Review mode has ended.';renderAll();}
  window.scrollTo({top:0,behavior:'smooth'});
}
function togglePause(){
  if(!S.started||S.ended)return;
  S.manualPause=!S.manualPause;
  $('#pausebtn').setAttribute('aria-pressed',S.manualPause?'true':'false');
  $('#pausebtn').innerHTML=S.manualPause?'▶ Resume':'⏸ Pause';
  var bw=$('#blurwrap');if(bw)bw.className=bw.className.replace(' paused-manual','')+(S.manualPause?' paused-manual':'');
  renderHeader();
}
/* ---------- finish / results ---------- */
function finishClick(){
  if(!S.started||S.ended)return;
  var ans=0,skip=0,un=0;
  S.st.forEach(function(s){if(s.checked&&!s.skipped)ans++;else if(s.skipped)skip++;else un++;});
  if(ans===0){openModal('<h3>⚠ Nothing is answered yet</h3><p>Answer at least one exercise before submitting. Skipped exercises are not counted, so an all-skipped exam cannot be scored.</p><div class="btnrow"><button class="btn primary" id="mok">Back to the exam</button></div>',function(){$('#mok').addEventListener('click',closeModal);});return;}
  openModal('<h3>Submit the exam?</h3><p>Answered and checked: <b>'+ans+'</b> · skipped: <b>'+skip+'</b> · not yet answered: <b>'+un+'</b>.</p><p>Skipped and unanswered exercises will be <b>excluded from scoring</b>.</p><div class="btnrow"><button class="btn primary" id="myes">✓ Submit now</button><button class="btn" id="mno">Keep working</button></div>',function(){
    $('#myes').addEventListener('click',function(){closeModal();endExam(false);});
    $('#mno').addEventListener('click',closeModal);
  });
}
function openModal(html,after){var m=$('#modal');m.innerHTML=html;$('#ovl').classList.add('on');if(after)after();var f=m.querySelector('.btn');if(f)f.focus();}
function closeModal(){$('#ovl').classList.remove('on');}
function endExam(timeout){
  S.ended=true;S.checkPause=false;S.manualPause=false;
  closeModal();
  var bw=$('#blurwrap');if(bw)bw.className=bw.className.replace(' paused-manual','');
  var rowsHtml='',earned=0,maxT=0,ans=0,skiplist=[],unlist=[];
  var rep=[];
  for(var i=0;i<EX.length;i++){
    var ex=exOf(i),st=S.st[i];
    if(st.checked&&!st.skipped){earned+=st.earned;maxT+=st.max;ans++;
      rep.push({n:i+1,ex:ex,st:st,label:st.frac>=1?'full':(st.frac>0?'partial':'zero'),cnt:true});}
    else if(st.skipped){skiplist.push('#'+(i+1)+' '+ex.title);rep.push({n:i+1,ex:ex,st:st,label:'skipped',cnt:false});}
    else{unlist.push('#'+(i+1)+' '+ex.title);rep.push({n:i+1,ex:ex,st:st,label:'skipped',cnt:false});}
  }
  var earnedR=Math.round(earned*10)/10;
  var percent=maxT>0?Math.round(earned/maxT*100):0;
  var passed=percent>=META.passMark;
  var h='<div class="card hero"><div class="bigres"><div class="pct '+(passed?'pass':'fail')+'">'+percent+'%</div>'+
  '<div class="verdict '+(passed?'pass':'fail')+'">'+(passed?'PASS':'FAIL')+'</div>'+
  '<div style="color:var(--dim);margin-top:10px">'+(timeout?'Time is up — the exam submitted itself. ':'')+'Score <b style="color:var(--tx)">'+earnedR+'</b> points over <b style="color:var(--tx)">'+(Math.round(maxT*10)/10)+'</b> · '+ans+' exercise(s) counted'+(skiplist.length+unlist.length?' · '+(skiplist.length+unlist.length)+' excluded':'')+' · pass mark '+META.passMark+'%</div>';
  if(passed)h+='<div class="cert"><div style="font-size:30px">🛡</div><div class="cn">'+esc(S.username||'Candidate')+' — well done!</div><div class="cc">You passed the <b>'+esc(META.title)+'</b> practice exam at '+percent+'%.<br>CompTIA Security+ (SY0-701) · Objective 4.5 Enterprise Security · severity '+META.difficulty.toUpperCase()+'</div></div>';
  else h+='<div style="margin-top:14px;color:var(--rd)">You must retake this exam to reach the '+META.passMark+'% pass mark. Study the report below — every explanation tells you what to focus on.</div>';
  h+='<div class="btnrow center"><button class="btn primary" id="retakebtn" style="min-width:220px">↺ Retake exam (reshuffled)</button></div></div>';
  if(skiplist.length||unlist.length){
    h+='<div class="skipnote"><b>Excluded from scoring ('+(skiplist.length+unlist.length)+'):</b> '+(skiplist.concat(unlist)).map(esc).join(' · ')+'.<br>These were skipped or left unanswered. Their points are removed from both your score and the total possible.</div>';
  }
  h+='<div class="card"><h2 style="font-size:18px;margin:0 0 8px">Detailed report</h2><div style="overflow-x:auto"><table class="rep"><thead><tr><th>#</th><th>Exercise</th><th>Result</th><th>Points</th><th>Your answer</th><th>Correct answer</th><th>Explanation</th></tr></thead><tbody>';
  rep.forEach(function(r){
    var st=r.st;
    h+='<tr><td>'+r.n+'</td><td>'+esc(r.ex.title)+'<br><span style="color:var(--mut);font-size:12px">'+esc(TYPELBL[r.ex.type]||r.ex.type)+'</span></td>'+
    '<td><span class="lab '+r.label+'">'+(r.label==='skipped'?(st.skipped?'SKIPPED':'NOT ANSWERED'):r.label.toUpperCase())+'</span></td>'+
    '<td>'+(r.cnt?fmtP(st.earned)+' / '+fmtP(st.max):'—')+'</td>'+
    '<td style="max-width:220px">'+(r.cnt?esc(st.your):'<span style="color:var(--mut)">not counted</span>')+'</td>'+
    '<td style="max-width:220px">'+(r.cnt?esc(r.ex.ansShort||st.corr):'—')+'</td>'+
    '<td style="max-width:420px"><details><summary>Show explanation</summary><div style="margin-top:6px">'+r.ex.exp+'</div></details></td></tr>';
  });
  h+='</tbody></table></div></div>';
  var res=$('#results');res.innerHTML=h;res.hidden=false;$('#exam').hidden=true;
  $('#retakebtn').addEventListener('click',startExam);
  $('#pausebtn').disabled=true;
  renderHeader();
  window.scrollTo({top:0,behavior:'smooth'});
  if(!S.reported&&maxT>0){
    S.reported=true;
    var correct=Math.round(earned),total=Math.round(maxT);
    try{parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,score:correct,total:total,percent:percent,passed:percent>=META.passMark},location.origin);}catch(e){}
  }
}
/* opening-in-iframe safety: allow modal close by backdrop or Escape */
document.addEventListener('click',function(e){if(e.target&&e.target.id==='ovl')closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#ovl').classList.contains('on'))closeModal();});

</script>
</body>
</html>
