window.EXAM_QUESTIONS = [{"id":"H01","type":"order","theme":"Tools and tradecraft","points":5,"scenario":"Meridian Retail's MSSP reports a long-running intrusion that started 11 weeks ago. You inherit the case file: a signed remote management agent was installed from the vendor's update channel, and the attackers stayed quiet for six weeks before they touched anything valuable. The incident manager wants the campaign written as stages, using the intrusion framework the industry shares with MITRE ATT&CK, so the report can be mapped to detections.","question":"Put the campaign stages in the order they occurred, earliest first.","items":["Reconnaissance of the supplier portal and the vendor's support forum","Weaponisation of a signed update package with a hidden loader","Delivery of the package through the trusted update channel","Exploitation of the agent's auto-update trust to run the loader","Installation of a service that survives reboot and hides in a signed folder","Command and control over a domain that looks like a vendor telemetry host","Actions on objectives: mailbox collection and finance document staging"],"hint":"The framework runs from learning about the target to getting what the attacker came for, and this campaign used a trusted channel for delivery.","why":"This is the Cyber Kill Chain, and the case is a textbook example of its most dangerous property: each stage leaves less evidence than the one before it, so the earliest stages are the cheapest place to break the chain. Reconnaissance left web logs and forum posts. Weaponisation and delivery happened inside the vendor's own signed update, which is why no malware signature fired. Exploitation was the agent trusting its own update, installation was a persistent service in a signed folder, command and control used a look-alike domain, and actions on objectives were mailbox and document collection. Detections should be mapped to the stage they interrupt: egress rules to the trusted update hosts, service-install auditing, and anomaly detection on signed binaries that start making network connections. The reconnaissance stage is also a detection opportunity, because scanning a supplier forum and a portal leaves requests that a monitoring rule can catch, and the resource development work that produced the loader is the stage where the attacker is least visible. Static analysis of the loader and dynamic analysis in a lab both come after the incident, when the case is stable.","kw":["Cyber Kill Chain","supply chain attack","malicious update","command and control (C2)","persistence","MITRE ATT&CK","beacon","static analysis","dynamic analysis","resource development"]},{"id":"H02","type":"spot","theme":"Password and credential attacks","points":5,"scenario":"Meridian Retail's identity team exports the security log of one domain controller for the hour after a suspected Kerberos attack. The attacker already holds domain administrator rights on a workstation and wants to keep access after every password in the domain is changed.","question":"Flag every line in the artefact that shows evidence of a forged Kerberos ticket rather than normal domain activity.","art":{"kind":"log","pick":true,"title":"Domain controller DC01, Security log, 01:02 to 01:20","lines":["01:02:07 EventID 4768 Authentication ticket requested  account=svc_backup  enc=0x12 (AES256)  src=10[.]30[.]4[.]18","01:03:44 EventID 4769 Service ticket requested  account=svc_backup  service=krbtgt/MERIDIAN.EXAMPLE  enc=0x17 (RC4)  src=10[.]30[.]4[.]18","01:04:02 EventID 4769 Service ticket requested  account=helpdesk1  service=krbtgt/MERIDIAN.EXAMPLE  enc=0x17 (RC4)  src=10[.]30[.]4[.]18","01:06:19 EventID 4769 Service ticket requested  account=helpdesk1  service=CIFS/FS02  enc=0x12 (AES256)  src=10[.]30[.]4[.]18","01:09:31 EventID 4769 Service ticket requested  account=helpdesk1  service=krbtgt/MERIDIAN.EXAMPLE  enc=0x17 (RC4)  lifetime=10h  src=10[.]30[.]4[.]18","01:12:55 EventID 4768 Authentication ticket requested  account=helpdesk1  enc=0x12 (AES256)  src=10[.]30[.]4[.]18","01:15:08 EventID 4672 Special privileges assigned  account=helpdesk1  privileges=SeDebugPrivilege","01:18:40 EventID 4624 Logon type 3 (network)  account=helpdesk1  src=10[.]30[.]4[.]18  auth=Kerberos"]},"bad":[1,2,4],"whyEach":["A normal AES ticket request for a service account from an internal workstation is ordinary domain activity.","A service ticket request whose service field is krbtgt, coming from a workstation rather than a domain controller, is the classic forged ticket pattern: the client is asking the ticket-granting service account for a ticket to itself.","The same krbtgt service request made on behalf of a helpdesk account is a second forged ticket, showing the attacker minted one for a different identity.","A normal CIFS file share ticket over AES is what a healthy session looks like.","A krbtgt ticket with an unusual ten-hour lifetime and legacy RC4 encryption is forged: real domain-issued tickets use the strongest available encryption and the domain default lifetime.","A fresh authentication ticket over AES an hour later is a normal renewal.","Special privileges being assigned after a privileged logon is expected behaviour for an administrator.","A network logon over Kerberos from the same workstation matches the legitimate pattern of file share access."],"hint":"A normal account never asks the ticket-granting account for a ticket to itself, and a modern domain does not hand out legacy RC4 tickets with strange lifetimes.","why":"A forged ticket, often called a golden ticket, is created with the password hash of the krbtgt account, so the attacker can mint a ticket for any identity with any lifetime and the domain controller cannot tell it from a real one. The tells are structural rather than signature based. First, the requested service is krbtgt itself, which happens when a client presents a forged ticket-granting ticket. Second, the encryption type is the legacy RC4 value while the rest of the domain uses AES. Third, the ticket lifetime does not match the domain policy. Detections should alert on krbtgt service requests from member workstations, on RC4 downgrades in a domain that has AES enabled, and on ticket lifetimes outside the policy. The lasting fix is to rotate the krbtgt password twice, which invalidates every forged ticket, and to remove the credentials that let the attacker reach the hash. The same log lines show lateral movement, because one stolen account is being used across several servers, and the tool that most often produces this traffic is a credential dumper that reads the local security authority. A spoofed ticket is also an indicator of compromise worth sharing with the sector group.","kw":["Kerberos golden ticket","pass the hash","Mimikatz","privilege escalation","lateral movement","spoofing","indicators of compromise (IoC)"]},{"id":"H03","type":"match","theme":"Tools and tradecraft","points":5,"scenario":"A new vulnerability lands on the Meridian Retail estate and the patch team has three days to decide what to do first. The estate inventory lists the logging library, the print spooler, the SMB file host, the mail server and the Java framework, and one of the five already has a working public exploit.","question":"Match each exposure to the attack technique it enables.","pairs":[["A Java logging library that resolves lookup strings inside logged input","Remote code execution through a directory lookup from log input"],["A print spooler service that loads a driver from a user-writable path","Local privilege escalation by planting a malicious driver"],["An unpatched SMBv1 server on an internal file host","Remote code execution with a well-known wormable exploit"],["An Exchange server with a missing proxy component patch","Mailbox compromise by writing a web shell through the proxy"],["A Java framework that binds request parameters to object properties","Code execution by binding a dangerous class property"]],"hint":"Think about what each component trusts: user input in a log line, a file path, a network protocol, a web proxy, or a request parameter name.","why":"Every one of these exposures is dangerous for a different reason, and the ranking is driven by exposure plus reachability, not by the CVSS base score alone. A logging library that resolves lookups inside input turns any logged string into remote code execution, which is why it scored so highly: the attacker only needs to make the application log their text. A print spooler that loads a driver from a user-writable folder gives any local user administrator rights. Unpatched SMBv1 is wormable, so one infected laptop becomes an estate-wide incident. A missing proxy patch on a mail server lets an attacker write a web shell and read mailboxes. Parameter binding in a framework lets an attacker set properties the developer never intended to expose. The order you patch in follows reachability first, then whether a public exploit already exists, then the score. Two practical notes. A zero-day with no vendor fix is handled by virtual patching at the edge and by removing the exposed service from the internet, because virtual patching buys time rather than closing the code flaw. And the question of who can reach the service is answered with discovery tools: a port scan shows the exposed service, a packet capture shows whether it is being probed, and a credential tool shows what an attacker would gain once inside.","kw":["zero-day","web shell","CVSS score","virtual patching","vulnerability scan","input validation","privilege escalation","Nmap","Wireshark","Metasploit","Mimikatz"]},{"id":"H04","type":"branch","theme":"Tools and tradecraft","points":5,"scenario":"At 22:10 the Meridian Retail help desk reports that a support contractor cannot log in to the admin console. At 22:14 the SIEM shows an unusual gap: a contractor account used a VPN from a new country at 19:40, then invoked a cloud management API at 20:05 to create an access key, and from 21:00 that key read six storage buckets. The on-call manager has asked you to handle the case and report what you decided and why.","question":"Work through the incident step by step. Each step appears only after the previous decision.","steps":[{"sit":"The account is compromised, the access key is live, and the contractor cannot log in. What is your first action?","opts":["Revoke the access key and the session, disable the account and reset it, then review what the key touched","Change the contractor's password and ask him to re-enrol MFA tomorrow morning","Delete every storage bucket that the key read, then tell the contractor","Open a support ticket with the cloud provider and wait for their analysis"],"correct":0,"res":["Correct. Revoking the key and its session stops the theft immediately, disabling the account removes the attacker's other paths in, and reviewing what the key touched tells you the real scope.","A password change does not revoke an active access key or a live session, so the attacker keeps reading data all night.","Deleting the data destroys the business records and the audit trail, and it does not stop the key.","The provider can help with logs later, but the key stays valid while you wait, which is the opposite of containment."]},{"sit":"The key is revoked and the account is disabled. The key read six buckets, including the one that holds the customer export files. What comes next?","opts":["Preserve the provider audit logs, notify the data protection officer, and rotate every credential that the compromised role could reach","Wait to see whether the data appears for sale before telling anyone","Restore the six buckets from backup and close the case","Add MFA to the cloud console and take no other action"],"correct":0,"res":["Correct. The provider audit log is the only complete record of what the key did, notification obligations run from the moment you know, and every credential in the same role is potentially exposed.","Waiting for the data to appear loses the audit log retention window and breaks the notification deadline, which turns a breach into a compliance failure.","Restoring buckets does not un-steal data and closes the case before the scope is known.","MFA is a good control for the future, but it does not answer what was taken or who must be told."]},{"sit":"The audit log shows the key also listed the secret store but did not read any secret. The role that owns the key can read four other accounts' secrets. What is the correct follow-up?","opts":["Rotate the secrets in the same trust boundary and scope the role down to the minimum it needs","Leave the secrets alone because the log shows no read","Delete the role and recreate it with the same permissions","Move the secrets to a text file on a shared drive until the role is fixed"],"correct":0,"res":["Correct. A list operation proves the attacker knew where the secrets were, and secrets in the same trust boundary are treated as exposed. Scoping the role down removes the path they were looking for.","Enumeration is reconnaissance before theft. The safe assumption after a compromise is that anything reachable was taken.","Recreating the same permissions reproduces the same over-privileged design.","Moving secrets to a shared file removes the audit trail and makes the exposure far worse."]}],"hint":"Contain the live credential first, then scope and notify, then remove the path the attacker was probing.","why":"A stolen cloud access key is a credential that does not need a password, a session or a device, so password resets do nothing. Containment means revoking the key and every active session, then disabling the account so no other route remains. Scope comes from the provider's audit log, which is the only complete record of what the key did and is usually retained for a limited time, so it is exported immediately. Notification is a legal deadline, not a public relations choice. Finally, the design fault is over-privileged roles and long-lived keys: the fixes are short-lived credentials from a workload identity, least privilege per role, and monitoring that alerts when a permission is used for the first time. The attacker's own tooling is worth naming, because it tells you what to look for next: an online guessing tool against the portal to test the leaked password, and an offline cracker if a hash file was copied. A cloud identity theft like this does not need ARP poisoning or a session replay on the local network, so evidence of those techniques would point to a second, separate intrusion.","kw":["credential stuffing","privilege escalation","lateral movement","indicators of compromise (IoC)","multifactor authentication (MFA)","pass the hash","Hydra","John the Ripper","ARP poisoning","session replay","replay attack"]},{"id":"H05","type":"mcq","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A Meridian Retail internal tool accepts a base64 field called viewstate and turns it back into a .NET object to render a dashboard. A tester sends a crafted value and, within one request, runs a system command as the web service account. The server has a current patch level and a web application firewall in front of it.","question":"Which weakness explains how one request became command execution?","opts":["Insecure deserialization of an object the client sends","A buffer overflow in the dashboard rendering library","A directory traversal in the template loader code","A race condition between the parse and the render step"],"correct":[0],"hint":"The payload is not a string that gets parsed badly. It is a whole object the server rebuilds and trusts.","why":"Insecure deserialization is the vulnerability class where the server rebuilds an object from data the client controls, and the object's type decides what code runs during construction. That is why a patched server and a WAF do not save the application: the request looks legitimate and the code path is a normal framework feature. A buffer overflow needs a memory-unsafe copy of excessive input, a directory traversal needs a file path, and a race condition needs two operations competing in time; none of those produces command execution in one request from a serialised object. The fix is to never accept a serialised object from a client, or if the format is unavoidable, to allow only a known list of safe types and to sign the payload so it cannot be altered.","kw":["insecure deserialization","command injection","buffer overflow","directory traversal","race condition (TOCTOU)","input validation","web shell"]},{"id":"H06","type":"spot","theme":"Network attacks","points":5,"scenario":"Meridian Retail's DNS resolver logs are kept for 30 days. The threat hunting team sees a burst of queries that all end in the same registered domain and asks you to flag the lines that show a data channel rather than normal name resolution.","question":"Flag every line in the artefact that shows DNS being used as a data channel or as an evasion path.","art":{"kind":"log","pick":true,"title":"Resolver query log, resolver R1, 03:00 to 03:40","lines":["03:02:11 query A www.meridian-retail.example from 10[.]30[.]9[.]31 answer 203[.]0[.]113[.]40","03:04:02 query A cdn.meridian-retail.example from 10[.]30[.]9[.]44 answer 203[.]0[.]113[.]41","03:05:47 query TXT kQ29t bWFuZCBhbmQgY29udHJvbA.telemetry-sync-update[.]example from 10[.]30[.]9[.]77 answer TXT \"Q29uZmlndXJlZA==\"","03:07:19 query A mail.meridian-retail.example from 10[.]30[.]9[.]12 answer 203[.]0[.]113[.]42","03:09:03 query AAAA meridian-retail.example from 10[.]30[.]9[.]5 answer none","03:11:40 query TXT 4f6e65206d6f7265206368756e6b.telemetry-sync-update[.]example from 10[.]30[.]9[.]77 answer TXT \"b2s=\"","03:13:22 query A telemetry-sync-update[.]example from 10[.]30[.]9[.]77 answer 198[.]51[.]100[.]7","03:16:58 query A updates.meridian-retail.example from 10[.]30[.]9[.]77 answer 203[.]0[.]113[.]43"]},"bad":[2,5,6],"whyEach":["An ordinary A record for the company web host is normal resolution.","A content delivery hostname resolving to a public address is expected traffic.","A long base64-looking label carrying a TXT query to an unrelated domain is data moving out inside DNS, which is DNS tunnelling.","A mail host A record is routine.","A AAAA query that returns no answer is a normal lookup for a host with no IPv6 record.","A second long encoded label to the same external domain, answered with 'ok' in base64, continues the channel and shows a two-way exchange.","A plain A query to the same external domain returning a single address is the fallback the malware uses when TXT queries are blocked.","An internal update hostname resolving normally shows the resolver is still serving legitimate business traffic."],"hint":"Compare the query name length and the record type: business lookups are short, and encoded data needs long labels and TXT records.","why":"DNS tunnelling hides a command and control channel inside a protocol that almost every network permits. The three fingerprint features are visible here. First, the query labels are long and encoded rather than human names. Second, the record type is TXT, which can carry text back in the answer, so the channel works in both directions. Third, the domain is unrelated to the business and appears only for one internal host, which is the infected machine. A fourth tell is volume: a workstation making hundreds of queries to one domain is abnormal even when each query looks harmless. Defences are a DNS security layer that scores domain reputation, a policy that blocks or limits TXT records to unknown domains, response policy zones, and monitoring for query volume per host. This is also why DNS poisoning is such a serious companion attack: if an attacker can forge the resolver answer, they can redirect legitimate lookups to their own server and the tunnelling becomes even harder to see. The beacon pattern here is a fixed interval, and the data leaving is exfiltration rather than a one-off upload. Bluesnarfing is a short-range wireless attack and has nothing to do with this evidence, so it would be the wrong label for the case.","kw":["DNS tunneling","command and control (C2)","beacon","network traffic analysis","exfiltration","DNS poisoning","bluesnarfing"]},{"id":"H07","type":"mcq","theme":"Network attacks","points":5,"scenario":"Meridian Retail customers on the same hotel network report that the portal login page loads without a padlock. The load balancer logs show normal TLS handshakes, but the certificate that clients received has a valid chain and a valid name, and it was issued by a different authority from the one in the change record. The security team later finds the original certificate still on the server and unchanged.","question":"Which control would have made this substitution visible to the client?","opts":["Certificate pinning in the app and HSTS with preload on the portal","A longer RSA key on the certificate the portal presents","Disabling TLS 1.0 and TLS 1.1 on the load balancer","Publishing the certificate fingerprint in the DNS TXT record"],"correct":[0],"hint":"The clients were given a certificate that looked valid, so the fix must make only the expected certificate acceptable.","why":"The description is certificate spoofing on an on-path position: a valid-looking certificate from another authority is accepted because the client trusts every authority. Certificate pinning tells the application to accept only a specific key or issuer, so a substitute is refused even though its chain is valid, and HSTS with preload forces the browser to refuse to continue after a certificate error, which closes the window where a user can click through the warning. A longer key on the real certificate does not help when a different certificate is presented. Disabling old protocol versions is good hygiene but does not decide which certificate is trusted. Publishing a fingerprint in DNS is only useful if the client checks it, which a normal browser does not. The wider lesson is that a key exchange is only as trustworthy as the certificate that authenticates it.","kw":["certificate spoofing","certificate pinning","on-path (man-in-the-middle) attack","man-in-the-middle key exchange","downgrade attack"]},{"id":"H08","type":"dual","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A Meridian Retail supplier portal builds a page from a template and shows a supplier's free-text company description to other suppliers. A bug report says the page sometimes shows strange characters and sometimes loads an image from a domain nobody recognises. You are asked to write the finding from both sides of the table.","question":"Answer both questions. The blue team question asks what you fix, the red team question asks what you try next.","q1":{"q":"Blue team: which combination closes the fault in the supplier description field?","opts":["Encode the output for the HTML context and add a content security policy that blocks external script and image hosts","Strip every space and punctuation mark from the description on save","Allow only 200 characters in the description field","Move the description into an iframe on the same domain"],"correct":[0]},"q2":{"q":"Red team: given that HTML is not encoded but a filter removes the script tag, which payload is most likely to run in the supplier's browser?","opts":["An image tag whose onerror attribute triggers a handler, loaded from an allowed host","A script tag with a mixed-case name to bypass the filter","A directory traversal string in the description field","A SQL comment sequence inside the description field"],"correct":[0]},"hint":"The output goes into an HTML context, so encoding is the fix; the bypass is an attribute handler, not a script tag.","why":"This is cross-site scripting, and the vulnerable pattern is that stored free text is rendered as markup without output encoding. Removing the script tag is a block-list defence, and block lists lose: an attribute handler such as onerror needs no script tag at all, and an image tag with a broken source is enough to fire it. The correct fix is contextual output encoding, which turns the angle brackets into text the browser displays rather than executes, plus a content security policy that stops the page loading script or images from hosts you did not approve. A length limit and an iframe do not encode anything, and directory traversal or SQL comments belong to completely different vulnerability classes, which is the trap: they are the wrong payloads for this context.","kw":["cross-site scripting (XSS)","output encoding","input validation","SQL injection (SQLi)","directory traversal","OWASP Top 10"]},{"id":"H09","type":"mcq","theme":"Cryptographic attacks","points":5,"scenario":"A Meridian Retail document signing flow uses MD5 to hash the agreement text before it is signed with the company key. Two different agreements with different payment terms produce the same MD5 digest, and both verify against the same signature. The legal team wants to know whether this is a practical problem or a theoretical one.","question":"Which statement is correct about what the attacker did?","opts":["The attacker found two documents with the same MD5 hash","The attacker brute forced the signing key of the company","The attacker factored the RSA modulus of the signing key","The attacker downgraded the signing algorithm in the client"],"correct":[0],"hint":"Two different documents with the same digest is the definition of one specific hash weakness.","why":"A collision attack means two different inputs produce the same hash, and a signature over the hash therefore covers both documents, which is exactly what happened here: two agreements with different terms, one digest, one valid signature. MD5 has been vulnerable to practical collisions for years, and the birthday attack is the mathematical reason a hash needs twice the bits you think it does, because you only need about the square root of the digest space to find a pair. Brute forcing a signing key is a different and much harder attack, and the legal team should not be told that a short key caused this. Factoring the RSA modulus is not what a matching digest proves. A downgrade attack changes the algorithm a protocol negotiates. The fix is to move the whole signing flow to SHA-256 or better and to keep a signed record of which digest was approved.","kw":["collision attack","birthday attack","MD5","SHA-1","weak key","downgrade attack","brute force key search"]},{"id":"H10","type":"spot","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A Meridian Retail mobile team ships an upload endpoint for delivery photos. A penetration tester reports that the endpoint can be used to host attacker content on the company domain and to read files from the server. The developer has sent the handler for review line by line.","question":"Flag every line in the artefact that is a real security fault.","art":{"kind":"code","pick":true,"title":"upload handler, reviewed copy","lines":["const upload = multer({ dest: '/srv/app/public/uploads' });","const name = req.body.filename || path.basename(file.originalname);","const dest = path.join('/srv/app/public/uploads', name);","if (!/^[\\w\\-]+\\.(jpg|png)$/i.test(name)) { return res.status(400).end(); }","await fs.rename(file.path, dest);","const thumb = await sharp(dest).resize(240).toBuffer();","const signed = jwt.sign({ sub: user.id }, process.env.JWT_SECRET, { expiresIn: '15m' });","res.json({ url: '/uploads/' + name, thumb: thumb.toString('base64'), token: signed });"]},"bad":[0,2,4,7],"whyEach":["Uploading into a folder that is inside the public web root means any file the user uploads can be requested as a URL and executed by the web server.","Reading the client-supplied filename is fine here only because the next line validates it, so the line itself is not the fault.","Joining the client-supplied name onto a server path allows sequences such as ../ to escape the upload folder, which is directory traversal.","The allow list with a regular expression and an anchored pattern is exactly the control that makes the filename safe.","Renaming to the attacker-controlled path is what writes the file outside the intended folder, so this line carries the traversal fault.","Re-encoding the image through the image library strips embedded scripts and normalises the file, which is a good control.","Signing a short-lived token for the authenticated user is a normal pattern and not a fault in this handler.","Returning the upload path to the client confirms where the file landed and hands the attacker the traversal result, and the raw filename should never be echoed back."],"hint":"Four lines break the rule that uploaded content must be stored outside the web root and served through a handler, with the smallest possible reach to the file system.","why":"An upload feature is dangerous in three ways: the file can be executed, the file path can escape, and the file can be served back with a content type the browser will run. This handler does two of them. Files land in the public web root, so an uploaded script is a web shell waiting for one request. The destination path is built from client input, so traversal writes outside the folder. Returning the internal path also confirms the result to the attacker. The safe design is to store uploads outside the web root, generate a server-side name that the client never supplies, validate the real content type by re-encoding the file, serve the file through a handler that sets a fixed content type and a download disposition, and never return the storage path. The image re-encoding and the filename allow list already in the code are the good parts to keep.","kw":["directory traversal","web shell","input validation","buffer overflow","OWASP Top 10","persistence"]},{"id":"H11","type":"branch","theme":"Malware types and behaviours","points":5,"scenario":"At 04:12 a Meridian Retail hospital campus reports that the medication management system is showing database errors. By 04:30 an analyst finds a ransom note on three file servers, and the backup catalogue shows the last full backup finished at 02:00 with a verified restore test last week. The clinical director is on the phone asking when systems come back.","question":"Work through the ransomware response step by step. Each step appears only after the previous decision.","steps":[{"sit":"Three file servers show ransom notes and encryption is still spreading. What is your first action?","opts":["Disconnect the affected network segments and the backup network, then identify the strain and the entry point","Start restoring the file servers from the 02:00 backup immediately","Shut down every server in the hospital to be safe","Pay the ransom to get the decryptor before more data is lost"],"correct":0,"res":["Correct. Isolating the segments stops the encryption from reaching the rest of the campus, and protecting the backup network is what keeps your recovery option alive. Identifying the strain and the entry point tells you whether you are clean.","Restoring while encryption is still spreading means the restored data is encrypted again within minutes, and the backup target may be the next victim.","Shutting everything down removes the evidence and takes clinical systems offline that were never affected. Segment the affected area, not the hospital.","Payment does not guarantee a working decryptor, funds the attackers, and is a last resort after every recovery path has been tested."]},{"sit":"The encryption has stopped, the backup network is isolated, and the last full backup from 02:00 verifies clean. The entry point looks like a stolen VPN credential with no MFA. What is the correct recovery path?","opts":["Rebuild the affected hosts, restore from the verified backup, and rotate every credential in the affected trust boundary","Restore the file shares in place and reconnect the backup network","Reimage only the servers with visible ransom notes and keep the rest running","Restore the data, then decide about credentials after the audit"],"correct":0,"res":["Correct. Ransomware operators leave persistence behind, so affected hosts are rebuilt rather than cleaned, data comes back from a verified backup, and every credential the attacker could have touched is rotated before the network is trusted again.","Reconnecting the backup network before the rebuild gives the attacker a second chance at the only clean copy, and the restored files may carry the persistence that re-encrypts them.","Servers without a visible note may still hold the persistence mechanism, which is exactly how second-wave encryption happens.","Restoring data before rotating credentials lets the attacker log in again with the same stolen account."]}],"hint":"Stop the spread and protect the clean copy first, then rebuild rather than clean, and treat every credential in the affected area as stolen.","why":"Ransomware is a business-model attack, and the technical work is about protecting the one thing that breaks the model: a verified, isolated backup. Containment means disconnecting the affected segments and the backup network so the encryption cannot reach the recovery path. Scope comes from the strain, the ransom note and the entry point, which here was a credential without a second factor. Recovery means rebuilding affected hosts from a known good image instead of cleaning them, because operators commonly leave a scheduled task or a service behind that re-encrypts after the restore. Credential rotation across the affected trust boundary closes the door the attacker came through, and a restore test before reconnecting proves the data is usable. Paying is a last resort: there is no guarantee of a working decryptor, and it funds the next attack. One operational detail matters during containment: a flood of requests can also be used as a smokescreen, so a denial of service at the same time is not automatically a coincidence. If the flood is large, the response is upstream, with blackhole routing or a scrubbing service, because no device inside the network can filter traffic that fills the link. A TCP SYN flood is the classic version of that distraction, and it is worth checking whether the attacker used it to cover the encryption.","kw":["ransomware","persistence","privilege escalation","lateral movement","multifactor authentication (MFA)","indicators of compromise (IoC)","backdoor","denial of service","impact","TCP SYN flood","distributed denial of service (DDoS)","blackhole routing"]},{"id":"H12","type":"fill","theme":"Application attacks and vulnerabilities","points":5,"scenario":"You are completing the written finding for a Meridian Retail cloud assessment. The tester reached the cloud metadata service through a server-side fetch and used the role attached to the instance. Complete the finding with the correct terms.","question":"Choose the correct term for each gap in the finding.","parts":["The invoice preview feature accepted a URL from the client and fetched it on the server, which is ",{"b":0},". ","By pointing it at the link-local address , ",{"b":1},", the tester read the temporary credential of the instance role. ","The durable fix is an ",{"b":2}," of the hosts the preview service may call, plus a workload identity whose permissions match only the preview function. "],"answers":["server-side request forgery (SSRF)","the cloud instance metadata endpoint","allow list"],"extras":["a directory traversal","the print spooler service","deny list","a replay attack"],"hint":"One gap is the classic web flaw where the server makes the request, one names the cloud service that hands out credentials, and one is the opposite of a block list.","why":"Server-side request forgery is what turns a harmless preview feature into a credential theft, because the request comes from the server, which sits inside the trusted network. The cloud metadata endpoint is reachable only from the instance itself and returns the role's temporary credentials, which is why a single fetch can hand over an entire cloud role. Blocking the one known address is not enough, because redirects, DNS rebinding and alternative encodings get around it; the safe design is an allow list of destinations the feature may call, a policy that requires IMDSv2-style session tokens where the platform offers them, and a least-privilege role. A deny list only stops the addresses you already thought of, which is exactly the wrong model for this flaw. Two related risks often sit beside it: a weak key in the instance metadata store, which a metadata read would also expose, and a replay attack against a signed request, which a nonce and a short validity window prevent. Lateral movement from the compromised instance role is the next step the attacker would take.","kw":["server-side request forgery (SSRF)","privilege escalation","input validation","weak key","replay attack","lateral movement","parameterised query"]},{"id":"H13","type":"order","theme":"Tools and tradecraft","points":5,"scenario":"Meridian Retail's incident manager wants a defensible timeline for the regulator. The case began with a phishing email and ended with 4 GB leaving the network, and the team holds timestamped artefacts from the mail gateway, the proxy, the endpoint and the data loss prevention tool.","question":"Put the incident events into the correct chronological order, earliest first.","items":["A supplier invoice email is delivered with a link to a document portal","The user's browser downloads a script from the portal and the endpoint records a child process of the browser","A command and control domain is resolved for the first time from that workstation","The workstation authenticates to the file server with a service account that was never used from a desk","The file server begins reading a large archive folder outside working hours","A 4 GB transfer leaves over the proxy to a cloud storage host with a valid certificate","The security team receives a data loss prevention alert and opens the incident"],"hint":"Follow the attacker from the first user action to the moment the data leaves, and remember that movement comes before collection.","why":"A defensible timeline is built from the artefact that proves each step, not from the alert that finally woke the team. Delivery is proven by the mail gateway record, execution by the endpoint process tree, command and control by the first DNS resolution, lateral movement by the authentication from a host that normally never uses that service account, collection by the file server reads, exfiltration by the proxy byte count, and detection by the data loss prevention alert, which came last. Writing the timeline this way shows the regulator both what happened and how long the organisation was blind, which is where the detection improvement work goes: the earliest cheap detection here was the first DNS resolution to a new domain from a workstation, and the strongest was the service account logging on from a desk. The case file then becomes an indicator of compromise package: the beacon domain, the file hashes and the service account name, shared with the sector group. In the shared vocabulary, the file reads belong to discovery and collection, and the transfer itself is exfiltration. The Cyber Kill Chain tells the same story in seven stages and is easier to explain to management.","kw":["indicators of compromise (IoC)","command and control (C2)","lateral movement","exfiltration","beacon","Cyber Kill Chain","discovery","collection"]},{"id":"H14","type":"classify","theme":"Malware types and behaviours","points":5,"scenario":"The Meridian Retail detection engineering team is mapping last quarter's confirmed cases to MITRE ATT&CK so the coverage gaps become visible. Each case below is described by the one piece of evidence that proves it. Sort them by tactic.","question":"Place each case under the MITRE ATT&CK tactic that the evidence proves.","buckets":["Initial access","Execution","Persistence","Credential access","Lateral movement","Exfiltration"],"items":["A valid supplier account logs in from an address that has never been used before","A signed binary loads a script from a remote share through a registry key","A service is created with a binary path in a user-writable folder","A process reads the memory of lsass and writes a file to the temp folder","A workstation opens an SMB session to a server using a machine account it has never used","A workstation sends 900 MB to a storage host that no business process uses"],"answer":[0,1,2,3,4,5],"whyEach":["Using a valid account from a new location is initial access, and it is hard to detect because nothing is exploited.","A trusted binary loading a remote script is execution through a signed loader, which ATT&CK treats as a defence evasion and execution technique.","Creating a service that points into a user-writable folder is persistence, and it often survives a reboot.","Reading the memory of the local security authority is credential access, the step before pass the hash and forged tickets.","Using a machine account to open a session on another server is lateral movement.","A large transfer to an unused host is exfiltration, the last stage before the attacker leaves."],"hint":"Ask what the evidence lets the attacker do next: get in, run code, stay, steal secrets, move, or take data out.","why":"ATT&CK is a map of behaviour rather than a list of tools, and mapping forces you to say which evidence proves which step. A valid account from a new place is initial access and needs behavioural detection, because there is no exploit to signature. A signed loader running remote script is execution with defence evasion built in. A service in a user-writable folder is persistence. Reading process memory for credentials is credential access, and it is the step that makes everything after it possible, which is why it deserves an alert of its own. A machine account opening a new session is lateral movement, and the transfer to an unused host is exfiltration. The gap analysis then asks which of the six you could not detect today, and that list becomes the detection backlog. One case here is a signed binary loading a remote script, which is living off the land: the attacker uses a tool that is already installed and trusted, so a file scanner has nothing to match.","kw":["MITRE ATT&CK","initial access","execution","persistence","credential access","lateral movement","exfiltration","living off the land","defense evasion"]},{"id":"H15","type":"fill","theme":"Tools and tradecraft","points":5,"scenario":"Meridian Retail is joining a sector threat intelligence group. Before the first exchange, the intelligence lead asks you to complete the sharing note so partners know exactly what they may do with the indicators.","question":"Choose the correct term for each gap in the sharing note.","parts":["The indicator package may be shared inside the sector group but not published, so it is marked ",{"b":0},". ","We publish the indicators in an ",{"b":1}," format so partner tools can ingest them without manual work. ","Each indicator carries a ",{"b":2}," so partners know how much weight to give it. "],"answers":["TLP:AMBER","STIX and TAXII","confidence score"],"extras":["honeytoken","CVSS score","TLP:CLEAR","sandbox analysis"],"hint":"One gap is a sharing marking, one is the standard machine-readable format and transport, and one tells partners how sure you are.","why":"Threat intelligence is only useful when the handling rules travel with the data. A sharing marking such as TLP:AMBER tells the recipient that the content stays inside their organisation and the named community, while TLP:CLEAR means it may be published, which would break this agreement. STIX is the structure for describing indicators and TAXII is the transport that lets partner tools pull them automatically, which is what removes the copy-and-paste errors that make shared indicators rot. A confidence score separates what you saw with your own eyes from what a third party reported, and it stops partners from blocking business traffic because of a weak indicator. A CVSS score rates a vulnerability, not an indicator, and a honeytoken is a decoy credential used to detect an insider, so neither belongs in this note. Two habits make an indicator package trustworthy. A sandbox analysis result and a hash lookup on a reputation site both feed the confidence score, because a behaviour you observed yourself is worth more than a report from a third party. And the reconnaissance value runs both ways: the same package tells a partner which of their hosts is being probed, which is how a sector group spots a campaign before it lands.","kw":["indicators of compromise (IoC)","honeytoken","CVSS score","sandbox analysis","malware signature","VirusTotal","reconnaissance"]},{"id":"H16","type":"terminal","theme":"Network attacks","points":5,"scenario":"Meridian Retail's network team captured four hours of traffic at the internet edge during a suspected data theft. The capture is stored on the analysis host as /cases/2025-0311/edge.pcapng. You must show the auditor only the HTTP requests inside that capture, printing the request method, the host and the full URI, with no packet bytes, and write the result to /cases/2025-0311/http-requests.txt for the evidence pack.","question":"Type the single pipeline that reads the capture, keeps only HTTP requests, prints the fields method, host and URI as tab-separated text, and writes the result to the evidence file.","sample":"GET\tsso.meridian-retail.example\t/oauth/token?client=portal\nPOST\tcdn-sync-update[.]example\t/upload/chunk?id=8842\nPOST\tcdn-sync-update[.]example\t/upload/chunk?id=8843\nGET\tmail.meridian-retail.example\t/owa/inbox","parts":[{"label":"reads the capture file from the command line","re":"\\btshark\\b|\\bcapinfos\\b|\\beditcap\\b"},{"label":"keeps only HTTP requests","re":"-Y\\s+['\"]?http\\.request\\b|http\\.request\\s*&&"},{"label":"prints the request method field","re":"http\\.request\\.method"},{"label":"prints the host field","re":"http\\.host"},{"label":"prints the full URI field","re":"http\\.request\\.full_uri|http\\.request\\.uri"},{"label":"uses the fields output mode","re":"-T\\s*fields|\\b-Tfields\\b"},{"label":"writes the output to the evidence file","re":">\\s*\\S*http-requests\\.txt|tee\\s+\\S*http-requests\\.txt"}],"solution":"tshark -r /cases/2025-0311/edge.pcapng -Y 'http.request' -T fields -e http.request.method -e http.host -e http.request.full_uri > /cases/2025-0311/http-requests.txt","hint":"Open the capture from the command line without a graphical tool: one display filter to keep requests, a fields output mode that prints the three fields you need, and a shell redirect into the evidence file. Field names follow protocol dot noun, so the request method is protocol dot request dot method.","why":"The pipeline has four parts and each one answers an audit question. The reader flag with the file path makes the analysis reproducible from the original capture. The display filter keeps only requests, so responses and background chatter do not fill the evidence file. The fields output mode with explicit field names removes packet bytes, which keeps the file small, readable and free of unrelated payload, and tab separation means a spreadsheet can open it. The redirect writes the result into the case folder so the auditor receives an artefact that can be regenerated and compared. In a real investigation the same technique with the DNS or TLS field names is what turns a multi-gigabyte capture into a table you can actually reason about, and the three suspicious requests in the sample output are exactly how a data theft appears: two uploads to an unrelated storage host between normal business traffic. That pair of uploads is the exfiltration step in progress, and the same fields would show the command and control traffic if the filter were widened. The requests also become indicators of compromise: the host name, the URI pattern and the user agent are what you block and hunt across the estate. Opening the same file in the packet capture tool with a display filter gives the analyst the conversation view the auditor asked for.","kw":["packet capture","Wireshark","network traffic analysis","exfiltration","command and control (C2)","indicators of compromise (IoC)"]},{"id":"H17","type":"fill","theme":"Password and credential attacks","points":5,"scenario":"Three Meridian Retail laptops were lost from a hotel room. They held a cached copy of the local account database, and IT cannot confirm whether the disks were encrypted. The risk note for the information security committee is half written.","question":"Choose the correct term for each gap in the risk note.","parts":["The local account passwords are stored as unsalted MD5 hashes, so an attacker can recover them with ",{"b":0}," rather than a fast lookup table alone. ","Because the hash is unsalted and fast, the correct storage fix is a slow ",{"b":1}," such as bcrypt or Argon2. ","The lost laptops also cached the credentials of the remote access account, whose portal is published straight from the internal server range with no ",{"b":2}," between it and the office network. ","That portal sends a one-time code by text message, and the provider allows unlimited attempts, so there is no ",{"b":3}," on guesses or messages. "],"answers":["offline hash cracking","key derivation function","demilitarised zone (DMZ)","rate limit"],"extras":["password spraying","deny list","a honeytoken","an on-path attack"],"hint":"Two gaps are about cracking a stolen file, and two are about the network that the stolen credential opens: the separate public segment and the cap on repeated attempts.","why":"Once the disk image is in the attacker's hands, guessing happens at their own speed with no lockout, no rate limit and no logs, which is why the defence moves to how the hash is stored. An unsalted fast hash such as MD5 lets an attacker use precomputed tables and then a cracking tool across a wordlist with rules, and two users with the same password produce the same hash, so one crack opens both accounts. A slow key derivation function with a per-user salt makes each guess expensive and makes precomputation useless. The network half of the note matters because the stolen credential is the attacker's way in: a portal that sits directly on the internal range should live in a demilitarised zone, so a compromise there does not give a path to the office network, and every service that sends one-time codes needs a rate limit on attempts and on messages, or an attacker can enumerate codes and drain the SMS budget. Password spraying and on-path attacks need a live connection at a different point, and a honeytoken is a decoy credential, so those three are the wrong terms here.","kw":["offline hash cracking","rainbow table","MD5","password spraying","on-path (man-in-the-middle) attack","honeytoken","rate limit","demilitarised zone (DMZ)"]},{"id":"H18","type":"match","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A Meridian Retail customer portal fails an external penetration test with five findings. The delivery manager has two sprints of developer time and asks you to match each finding to the cheapest fix that actually closes it.","question":"Match each finding to the fix that closes it.","pairs":[["A URL parameter controls which server the portal calls","Allow-list the permitted destination hosts for that feature"],["A search term is written into the page as HTML","Encode the value for the HTML context before it is rendered"],["A numeric id fetches a record without an ownership check","Check authorisation on the server for every record access"],["A session cookie works after logout and on any device","Regenerate the session identifier and bind the session to its device"],["An XML import accepts external entity declarations","Disable external entity resolution in the XML parser"]],"hint":"Each finding is a different trust mistake, so the fix must act where the trust was broken: destination, output, authorisation, session, or parser.","why":"Every finding here has a specific fix because the trust failure happens in a specific place. A user-controlled destination is server-side request forgery, fixed by an allow list of hosts the feature may reach. Rendered user input is cross-site scripting, fixed by contextual output encoding. A missing ownership check is broken access control, fixed on the server, because hiding the link in the interface protects nothing. A session that outlives logout or follows the attacker to another device is a session management fault, fixed by regenerating the identifier at each privilege change and binding it to the client. External entity declarations in an XML parser allow file reads and network calls, fixed by disabling them. The pattern across all five is that you fix where the trust was misplaced, not where the symptom appeared.","kw":["server-side request forgery (SSRF)","cross-site scripting (XSS)","session hijacking","output encoding","input validation","OWASP Top 10","cross-site request forgery (CSRF)"]},{"id":"H19","type":"fill","theme":"Network attacks","points":5,"scenario":"A Meridian Retail staff member searched for a payroll guide and then visited a well-known finance news site. Two hours later her laptop beaconed to a domain registered four days earlier. The proxy log shows the news site served a script from an advertising network that was compromised the same day. No phishing email was found in her mailbox, and the site itself was patched and current. Complete the incident note with the correct terms.","question":"Choose the correct term for each gap in the incident note.","parts":["No message was sent to her personally and she was chosen for the sites she visits, so this fits the pattern of ",{"b":0},". ","The news site itself was patched and current, so the weak point was the script it loaded from an advertising network, which makes this a ",{"b":1},". ","The control that stops the next case is a ",{"b":2}," that allows script only from the hosts we choose. "],"answers":["a watering hole attack","supply chain attack","content security policy"],"extras":["credential stuffing","dumpster diving","a honeytoken"],"hint":"Nobody sent her anything, the trusted site was healthy, and the fix controls which hosts a page may load code from.","why":"A watering hole attack compromises a site that a target group is known to visit, so the victim is selected by habit rather than by name, and that is why no phishing message exists to find. The second gap is the important detail: the news site was patched and current, so the compromise was in a script it loaded from a third-party advertising network, which makes this a supply chain attack on a trusted dependency. Your attack surface includes every script your own pages load for exactly this reason. The durable control is a content security policy that lists the hosts allowed to serve script and other content, so an unexpected third party is refused by the browser. Credential stuffing attacks logons with stolen pairs, dumpster diving recovers discarded material, and a honeytoken is a decoy credential, so none of the three explains this evidence.","kw":["supply chain attack","credential stuffing","rogue access point","malicious update","beacon","command and control (C2)","watered hole attack"]},{"id":"H20","type":"spot","theme":"Application attacks and vulnerabilities","points":5,"scenario":"Meridian Retail moved its backup catalogue into a cloud object store. An external reviewer reads the bucket policy and the logging configuration and asks you to flag every line that creates a real exposure.","question":"Flag every line in the artefact that creates a security exposure.","art":{"kind":"code","pick":true,"title":"Object store policy and settings, reviewed copy","lines":["Statement: Effect Allow, Action s3:GetObject, Principal *, Resource arn:aws:s3:::meridian-backup/*","Statement: Effect Allow, Action s3:PutObject, Principal arn:aws:iam::111122223333:role/backup-writer, Resource arn:aws:s3:::meridian-backup/*","Statement: Effect Deny, Action s3:*, Principal *, Condition NotIpAddress 10[.]40[.]0[.]0/16","Setting: Block public access = false","Setting: Default encryption = AES256","Setting: Versioning = Enabled","Setting: Server access logging = Disabled","Setting: Object lock = Compliance mode, 35 days"]},"bad":[0,2,3,6],"whyEach":["Allowing GetObject to every principal in the world means anyone who learns an object name can download the backup data.","Granting write permission to one named role in the account is the least-privilege pattern you want to see.","Denying all actions to principals outside the company address range breaks legitimate remote administrators and is not a security control, because addresses can be spoofed and the deny also blocks your own recovery staff.","Leaving the public access block disabled means no account-level guard rail stands between a bad policy and the internet.","Default encryption at rest is a required baseline control and is correctly set.","Versioning protects the data from overwrite and deletion, which matters for ransomware recovery.","Disabling server access logging removes the only record of who read the backups, which is exactly what an investigation needs.","Object lock in compliance mode for 35 days makes the backups immutable, which is the strongest defence against ransomware."],"hint":"Four lines break the rules that backups must be private, logged and immutable. One line is a repair attempt that would break your own access.","why":"A backup store is the last line of defence, so its configuration is judged on three properties: who can read it, who can change it, and whether anyone can see what happened. Reading it must be limited to specific roles, never to every principal, because an object name is the only secret left. The public access block at the account level exists precisely to stop a policy mistake like the first line from becoming an internet-facing data leak. Logging must be on, because without access logs you cannot tell whether the attacker already downloaded the backups before encrypting production. Versioning and object lock make the data immutable, which defeats the modern ransomware tactic of destroying the backups first. The Deny statement tries to help but is built on source addresses, which are not a reliable identity, and it would lock out the very staff who need to restore. Regenerating an old MD5 digest for the backup manifest would also be a mistake, because the whole point of the manifest is to prove that the stored copy has not changed. An indicator of compromise for this case is simple to write: who read the bucket, when, and from where, and the access log that is switched off here is exactly where that evidence lives.","kw":["ransomware","privilege escalation","indicators of compromise (IoC)","MD5","input validation","malware signature"]},{"id":"H21","type":"fill","theme":"Cryptographic attacks","points":5,"scenario":"Meridian Retail's payment terminal fleet still negotiates legacy ciphers when it talks to the gateway, and the vendor has confirmed that a firmware fix is eighteen months away. The crypto review for the risk register is half written.","question":"Choose the correct term for each gap in the review.","parts":["The gateway still offers a weak protocol version, so an attacker on the path can force the terminal to use it in a ",{"b":0},". ","One terminal family shipped with the same symmetric key on every device, which is a ",{"b":1}," and cannot be fixed by making the key longer. ","Where the key exchange uses a small Diffie-Hellman group, an attacker who records the session can attempt a ",{"b":2}," with precomputed values for that group. ","The gateway certificate is signed with a hash that has practical collisions, which allows a ",{"b":3}," to forge it. "],"answers":["downgrade attack","weak key","chosen plaintext attack","collision attack"],"extras":["a honeytoken","pass the hash","buffer overflow"],"hint":"Four gaps: forcing an older protocol, a shared secret on every device, an attack that uses known or chosen input against a small group, and two different certificates with the same signature.","why":"Each gap names a different cryptographic weakness. A downgrade attack works because the server still offers an old protocol or cipher, so the fix is to remove every legacy option rather than to hope the client chooses well. A key that is identical on every device is a weak key: the attacker only has to extract it once to read the whole fleet, and a longer key does not help because the secret is already shared. A small Diffie-Hellman group lets an attacker use precomputation against the exchange, which is why the group size is part of the security policy, not an implementation detail. A hash with practical collisions allows a collision attack, in which two different certificates produce the same digest and one valid signature therefore covers both. Pass the hash and buffer overflow belong to credential theft and memory safety, and a honeytoken is a decoy credential, so none of them fits a transport review.","kw":["downgrade attack","weak key","chosen plaintext attack","collision attack","man-in-the-middle key exchange","certificate spoofing","MD5","SHA-1"]},{"id":"H22","type":"mcq","theme":"Malware types and behaviours","points":5,"scenario":"A memory capture from a Meridian Retail workstation shows no malicious file on disk, the antivirus log is clean, and the endpoint still beacons every 90 seconds. The only unusual artefacts are a signed Microsoft binary that started from an Office process and a registry key that makes that binary load a script from a network share. The patch level is current.","question":"Which detection approach finds this on the other 900 workstations?","opts":["Alert on Office starting a script host and on redirected loader keys","Run a full file signature scan every hour on each workstation","Block all network shares so the loader cannot reach the script","Increase the antivirus heuristic sensitivity to its highest level"],"correct":[0],"hint":"There is no file to sign, so the detection must describe a relationship between processes and a registry change.","why":"This is fileless malware using living off the land, where a trusted, already installed binary does the work and nothing new appears on disk. Signature scanning finds nothing because there is no signature to match, and stronger heuristics produce false positives without finding a behaviour the product does not model. Blocking all network shares is far too broad and would break the business. The detection that works is behavioural and relational: an Office application should never start a script or command interpreter, and a registry key that redirects the loading behaviour of a signed binary is a specific, rare event. Those two rules together are precise enough to alert on, and the same event data makes the hunt across 900 endpoints a single query. A sandbox would show nothing useful here, because there is no file to detonate, and a persistence entry in a registry key is the only durable trace the attacker leaves.","kw":["fileless malware","living off the land","malware signature","persistence","sandbox analysis","virus","polymorphic malware","armored virus"]},{"id":"H23","type":"classify","theme":"Malware types and behaviours","points":5,"scenario":"Meridian Retail buys a smaller competitor and inherits a mixed estate. The integration team asks you to sort the inherited findings by the malware or attack category they belong to before the risk register is written.","question":"Place each inherited finding under the category it belongs to.","buckets":["Boot sector virus","Shadow IT malware","Firmware implant","Browser extension abuse","Cryptojacking","Bluesnarfing"],"items":["A laptop that was bought second hand boots a payload before the operating system loads and survives a full disk wipe","An unmanaged laptop on the guest network runs a file-sharing tool and serves a remote access client to anyone who asks","A network switch retains a modified firmware image that survives a factory reset and calls an external host at boot","An extension installed in every browser profile reads cookies and injects adverts into partner pages","Every workstation in an office runs at 100 percent CPU while a script mines a coin and pays to an external address pool","A phone in a meeting room has its contact list and calendar read over a short-range wireless connection"],"answer":[0,1,2,3,4,5],"whyEach":["A payload that runs before the operating system and survives a disk wipe lives in the boot sector or firmware, which is a boot sector virus pattern.","An unmanaged device running unapproved software is shadow IT, and the file-sharing tool is the malware delivery path.","Modified firmware that survives a factory reset and calls out at boot is a firmware implant, which is the hardest class to remove.","An extension that reads cookies and injects content uses the browser as the attack surface.","Mining a coin with other people's CPU and paying an external pool is cryptojacking.","Reading data over a short-range wireless link from a nearby device is bluesnarfing."],"hint":"Ask where the code lives or where the loss happens: before the operating system, in firmware, in the browser, in the CPU, or over a short-range radio.","why":"These six findings teach an important lesson about persistence. A boot sector payload and a firmware implant both survive a normal rebuild, so the response is replacement or reflash from a trusted image, not a wipe. Shadow IT matters because an unmanaged device has no endpoint agent, no patch level and no owner, which makes it the easiest place to hide. A malicious browser extension lives inside the user's profile, so it survives a reinstall of the browser and travels with the profile. Cryptojacking is malware whose payment is compute rather than data, and it is often found through an unexpected power bill rather than an alert. Bluesnarfing uses a short-range wireless link, which shows that physical proximity is still an attack path in an office with meeting rooms. The remaining classes are worth naming because they are the ones people confuse: a logic bomb waits for a trigger, a keylogger records typing, spyware gathers information, a worm spreads alone, a trojan arrives as something the user wanted, a rootkit hides below the operating system, and a virus infects other files or programs. Living off the land is the modern variant, where the attacker writes no malware at all but reuses the tools already installed.","kw":["boot sector virus","malware signature","bluesnarfing","living off the land","persistence","supply chain attack","worm","trojan","spyware","keylogger","logic bomb","rootkit"]},{"id":"H24","type":"order","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A Meridian Retail checkout bug lets a customer redeem the same single-use coupon twice within four milliseconds. The developer has a fix in mind and the change board wants the work broken into steps it can approve.","question":"Put the remediation steps in the correct order, first step to last.","items":["Reproduce the double redemption in a test environment and record the exact race window","Add a database uniqueness constraint so the second insert is rejected","Move the balance check and the deduction into one transaction with row locking","Write an automated test that fires the two requests in parallel and expects one success","Deploy to production and watch the coupon redemption error rate","Add monitoring for duplicate redemption attempts and alert on the first one"],"hint":"Prove the flaw first, fix it at the narrowest point, then prove the fix and watch it in production.","why":"A race condition, also called time-of-check to time-of-use, exists because the check and the change are separate operations, so two requests can both pass the check before either writes. The order matters. You reproduce it first, because a race that cannot be shown cannot be tested after the fix. The uniqueness constraint is the cheapest, most reliable part of the fix, because the database refuses the second row no matter how the application is scheduled. Wrapping the check and the deduction in one transaction with a row lock removes the window properly. The parallel test is what proves the fix rather than hoping, and production monitoring plus an alert on duplicate attempts gives you early warning if a new code path reintroduces the window. Testing before reproducing, or monitoring before fixing, are the classic ways this kind of bug survives a release. The same discipline applies to an input validation finding, to a web shell left on a server, or to a persistence entry that reappears after a rebuild: prove it, fix the narrowest point, test the fix, then watch production. A file signature scan has no part to play here, because this flaw lives in the timing of two requests rather than in a file.","kw":["race condition (TOCTOU)","input validation","OWASP Top 10","web shell","malware signature","persistence"]},{"id":"H25","type":"fill","theme":"Physical and social attacks","points":5,"scenario":"After two intrusion attempts at the Meridian Retail data centre, the facilities team asks for a written control set. Complete the note with the correct terms.","question":"Choose the correct term for each gap in the control note.","parts":["The lobby door opens into a small room where the outer door must close before the inner door opens, which is an ",{"b":0},". ","Contractors who arrive without a badge are let in one at a time by a guard, because the last attempt used ",{"b":1}," behind a courier. ","Badge readers are fitted with a shielded case, because a handheld reader can copy a card that is still in a pocket, which is a ",{"b":2},". ","Old access cards that reach the end of life are destroyed and not thrown away, because a ",{"b":3}," would hand the attacker a working credential. "],"answers":["access control vestibule","tailgating","proximity reader bypass","dumpster diving"],"extras":["a honeypot","a USB drop attack","chip-off attack"],"hint":"Four gaps: the double-door room, following someone through a door, reading a card from a distance, and recovering a discarded item.","why":"Each control answers a technique that needs no exploit at all. An access control vestibule, sometimes called a mantrap, makes one person pass at a time, which removes the tailgating opportunity that social pressure creates. A proximity reader bypass, where a handheld device reads a card in a pocket or bag, is defeated by a shielded holder and by cards that use a challenge-response exchange instead of a static number. Discarded cards and documents are a dumpster diving target, so a documented destruction process matters as much as a shredder, and the same is true for the paper and media that carry access information. A chip-off attack is a laboratory technique against a physically held device, a USB drop attack uses found media, and a honeypot is a decoy system, so none of those three fits these four gaps. Badge cloning deserves a second line of defence on its own: a copied card cannot be stopped once it exists, so the controls that matter are the reader, the case that blocks a long-range read, and the habit of checking that only one person passes through the vestibule at a time.","kw":["access control vestibule","mantrap","tailgating","proximity reader bypass","badge cloning","dumpster diving","chip-off attack","USB drop attack","honeypot"]},{"id":"H26","type":"spot","theme":"Physical and social attacks","points":5,"scenario":"The Meridian Retail security manager walks the data centre corridor with the local hardening standard in hand. The standard covers removable media, credential copying, key control, asset records, screen privacy and written secrets, and the walk produced one recorded finding per rack.","question":"Flag every line in the artefact that breaks the hardening standard.","art":{"kind":"code","pick":true,"title":"Data centre corridor walk, findings copy","lines":["Rack 14: server has both front USB ports enabled and a bootable USB disk is left in the top port","Rack 15: badge reader is a serial-number-only reader with no challenge-response support","Rack 16: cabinet key is stored in an unlocked wall box beside the door","Rack 17: asset tag is present and matches the asset register for that serial number","Rack 18: console cable is connected and the terminal session is logged out with a lock screen","Rack 19: a sticky note on the KVM tray lists the local administrator password","Rack 20: camera above the aisle covers the full row and records to the server room system","Rack 21: the visitor log is filled in with name, company and escort for every visit this week"]},"bad":[0,1,2,5],"whyEach":["A bootable USB left in an enabled port is both a USB drop risk and a boot path around the operating system, so it breaks the removable media rule.","A reader that only carries a static serial number can be copied by any compatible handheld device, which breaks the cloned-credential rule.","An unlocked key box beside a door gives anyone in the corridor access to every cabinet in the row, so it breaks the physical key control rule.","A matching asset tag is exactly what the standard asks for, so this line is compliant.","A locked console session is the correct state for an unattended terminal.","A written local administrator password in an open area is a shoulder surfing and camera risk and breaks the no-written-credential rule.","Cameras that cover the whole aisle and record centrally meet the standard.","A complete visitor log with escort names meets the standard."],"hint":"Four lines break the rules about removable media, credential copying, key control and written secrets. Four lines show the standard being met.","why":"A hardening walk finds the controls that quietly stopped working. A bootable USB in an enabled port is the fastest way past a disk password and the easiest way to leave a payload, and the fix is to disable removable boot, block unauthorised USB storage by policy, and give the left disk to a forensic process rather than plugging it in. A reader with a static serial number is defeated by a handheld reader at half a metre, so readers should use a challenge-response exchange or a protected card and a shielded holder. Keys in an open box turn one corridor visit into access to every cabinet. A password on a sticky note is visible to a visitor, a cleaner or a camera. This is also where a honeytoken earns its place: a fake credential in the same room tells you at once if somebody copied it, because nobody legitimate ever uses it. Two findings are worth escalating beyond this corridor: a reader that cannot tell a copied card from a real one is a badge cloning exposure for the whole building, and a printer that keeps a copy of every document in memory is a data loss risk that no camera will catch.","kw":["USB drop attack","proximity reader bypass","badge cloning","shoulder surfing","honeytoken","facility perimeter control"]},{"id":"H27","type":"dual","theme":"Network attacks","points":5,"scenario":"Meridian Retail's staff wireless covers the loading bay and the visitor car park, and one access point is mounted on the outside wall of the building. A penetration test at the car park showed a strong look-alike network with the same name and a captive portal. Both teams are asked to write the same finding.","question":"Answer both questions. The blue team question asks what you fix, the red team question asks what you do with the position you already have.","q1":{"q":"Blue team: which change best stops a look-alike access point from harvesting staff credentials in the car park?","opts":["Enable a wireless intrusion prevention system that flags a duplicate SSID and use certificate-based authentication instead of a captive portal password","Increase the wireless encryption to the strongest available version on the real access point","Reduce the transmit power of the outside access point and add another indoor access point","Require a longer password on the captive portal and change it monthly"],"correct":[0]},"q2":{"q":"Red team: the blue team has not applied these changes yet. Which step turns the look-alike network into working access to the corporate wireless?","opts":["Present the same network name with a stronger signal and forward credentials to a real captive portal","Break the encryption key of the real access point with a dictionary attack","Send a deauthentication frame storm until clients reconnect elsewhere","Clone the MAC address of an access point already on the wired network"],"correct":[0]},"hint":"On the blue side the problem is that users cannot tell the two networks apart, and on the red side that is exactly the advantage.","why":"An evil twin is an access point that copies a legitimate network name and usually serves a captive portal, so users type their credentials into the attacker's page. Signal strength decides which network a device chooses, which is why the attacker sits in the car park with a stronger radio. The blue team fix is twofold: a wireless intrusion prevention system that notices a second access point advertising the same name and can contain it, and certificate-based authentication, so the client proves its identity with a certificate and never types a password into a portal. Stronger encryption on the genuine access point does not help, because the attacker is not attacking the encryption. A portal password change does not help either, because the attacker collects the new password the same way. On the red team side, competing on signal and relaying to a real portal is the practical path; a deauthentication storm annoys users but does not hand over credentials.","kw":["evil twin","rogue access point","war driving","deauthentication attack","password spraying","multifactor authentication (MFA)"]},{"id":"H28","type":"mcq","theme":"Cryptographic attacks","points":5,"scenario":"A Meridian Retail partner captures one encrypted session between a branch router and the head office gateway. The protocol uses a small Diffie-Hellman group and a static key pair, and the partner also holds one plaintext message from an earlier session with the same static key. The head office insists the traffic is safe because the session used a modern cipher.","question":"Which attack is the partner best placed to attempt?","opts":["A chosen plaintext attack on the key exchange to recover the key","A ciphertext-only attack against the modern session cipher","A birthday collision attack on the session transcript hash","A downgrade attack against the branch router configuration"],"correct":[0],"hint":"The weak point is not the cipher. It is the key exchange, the group, and the fact that the same static key was used before.","why":"The session cipher is strong, so attacking it directly is the hardest path and the partner would not choose it. The weaknesses are the small Diffie-Hellman group and the static key pair reused across sessions. A small group allows precomputation, and a reused static key with messages an attacker can influence or already knows is the setting for a chosen plaintext attack on the key exchange, which is how the partner recovers material they can use on other sessions. A birthday collision on the transcript hash needs a hash of about twice the collision strength and would not yield the key. A downgrade attack requires the attacker to influence the protocol negotiation rather than merely to record it. The fixes are a large ephemeral group with perfect forward secrecy, meaning a fresh key per session, and a cipher suite list that refuses weak options. A brut
