   {t:'Keep the backdoor for the follow-up test',ok:false,fb:'Leftover access is a real vulnerability; nothing stays behind.'},
   {t:'Publish the exploit code online as marketing',ok:false,fb:'Client findings are confidential; publishing is a breach.'},
   {t:'Send a one-line chat message instead of a report',ok:false,fb:'The report is the deliverable; a chat line proves nothing.'}]}]},
h:'The lifecycle is the map: scope, recon, exploit, post-exploit, cleanup, report.',
x:'Each step follows from the phase you are in. Recon before exploitation, and enumeration before guessing. After a shell, post-exploitation means understanding and careful movement inside the fence, never damage. Out-of-scope stays out of reach. At the end, cleanup and a written report close the loop. These branch decisions look small, but each one either respects the RoE or breaks it.'},
{id:'M10',th:1,ty:'qcm',tt:'Type I or Type II?',pts:3,
sc:'A prospect writes: “Our auditor wants proof that NimbusCloud’s access controls did not just exist on paper, but actually operated well over the last twelve months.”',
q:'Which document is the right answer?',
d:{c:[
 {t:'A SOC 2 Type I report',ok:false},
 {t:'A SOC 2 Type II report',ok:true},
 {t:'A SOC 1 report',ok:false},
 {t:'A SOC 3 report',ok:false}]},
h:'The two clues are “operated” and “twelve months”.',
x:'Type I reports say whether controls were designed correctly at one point in time. Type II reports add an operating-effectiveness test across a period, often six to twelve months. The prospect asked about a year of actual operation, so Type II is the match. SOC 1 answers financial-control questions, and SOC 3 is a public summary without the detail an auditor needs.'},
{id:'M11',th:1,ty:'dnd',tt:'Trust Services Criteria in the wild',pts:5,
sc:'You are mapping NimbusCloud controls to the SOC 2 Trust Services Criteria before the auditor arrives. Five control descriptions, five criteria.',
q:'Drag each control to the criterion it belongs to.',
d:{slots:['Security','Availability','Processing integrity','Confidentiality','Privacy'],items:[
 {t:'MFA everywhere plus quarterly access reviews',slot:0},
 {t:'99.9% uptime target with a tested DR plan',slot:1},
 {t:'Billing runs charge each invoice exactly once',slot:2},
 {t:'Source code and product roadmaps stay sealed',slot:3},
 {t:'Customers can view, correct and delete their personal data',slot:4}]},
h:'Confidentiality protects the organization’s secrets; privacy protects people’s personal data.',
x:'Security is the base criterion: access control, MFA, reviews. Availability asks whether the service stays up and recovers, which is why uptime and disaster recovery sit there. Processing integrity is about jobs being complete, accurate and on time, like correct billing. Confidentiality covers information the company promised to keep secret, such as source code. Privacy covers personal data and the rights people have over it. The confidentiality-versus-privacy boundary confuses many candidates: company secrets versus personal data.'},
{id:'M12',th:5,ty:'order',tt:'Rank the fixes',pts:5,
sc:'The Brightline audit closed with five open findings. Leadership will fund fixes top-down, worst first, and you own the ranking memo.',
q:'Arrange the findings from the highest risk (1) to the lowest (5).',
d:{items:[
 'Unpatched internet-facing VPN flaw with a public exploit',
 'Shared admin password on the payment server',
 'No MFA on the internal file share',
 'Weak password policy on the internal HR app',
 'Contractors missed this year’s security awareness training']},
h:'Ask for each: how easy is the attack from outside, and how bad is the blast radius?',
x:'Risk grows with exposure and impact. The internet-facing VPN flaw is both easy to reach and publicly exploitable, so it is worst. The shared payment-server password follows: one leak empties the till. No MFA on a file share is a real but internal gap. A weak policy on an internal HR app is slower to exploit. Training for contractors matters over months, not days. Ranking forces trade-offs, so document the reasons and the order survives questioning. This risk ranking is what separates an assessment from a plain vulnerability scan listing.'},
{id:'M13',th:2,ty:'dnd',tt:'Known, unknown, partially known',pts:3,
sc:'Halberd runs three engagement briefings this week. Match each briefing to the knowledge level the client bought.',
q:'Drag each card to the environment type.',
d:{slots:['Known environment','Unknown environment','Partially known environment'],items:[
 {t:'Tester receives network diagrams, a normal user account and the asset list',slot:0},
 {t:'Tester receives only the company name and its main domain',slot:1},
 {t:'Tester receives the external IP ranges and app list, but no credentials',slot:2}]},
h:'Count what is in the envelope: everything, almost nothing, or something in between.',
x:'A known environment (often called white box) hands the tester maps, accounts and asset lists, so depth replaces discovery. An unknown environment (black box) gives nearly nothing, which shows what an outside attacker could find. The partially known setup (gray box) splits the difference: useful boundaries without insider knowledge. Vendors pick levels based on what they want to learn about their own defenses.'},
{id:'M14',th:5,ty:'fib',tt:'Build the report skeleton',pts:5,
sc:'Your lead hands you the finding on the VPN flaw and asks you to draft the report structure around it.',
q:'Fill the blanks to complete the report skeleton.',
d:{txt:'Every finding needs a clear description, a [0] such as Critical or Medium, and a [1] that shows the attack really worked. Each one also carries a [2] recommendation the client can act on. The whole report opens with an [3] written for leadership in plain words. Weeks after the fixes, a [4] confirms the issues are truly closed.',
bank:['risk rating','proof of concept','remediation','executive summary','retest'],ans:[0,1,2,3,4]},
h:'Two blanks are artifacts, one is a section, one is an event at the very end.',
x:'A usable finding has four parts: description, risk rating, proof of concept, and a remediation recommendation. The executive summary lets leadership act without reading the technical body, and IoCs — indicators of compromise — tell defenders what to hunt for afterwards. The retest, done after fixes, turns the report from a snapshot into a verified closure. Missing any piece weakens the client’s ability to fix the issue and to prove the fix to auditors.'},
{id:'M15',th:0,ty:'multi',tt:'Audit parties, true or false',pts:4,
sc:'A new GRC intern wrote five claims about audits on the team wiki. Correct the record before the audit committee reads it.',
q:'Select every statement that is TRUE.',
d:{c:[
 {t:'An external audit is performed by an outside firm on our organization',ok:true},
 {t:'A third-party audit reviews a vendor or partner, not our own company',ok:true},
 {t:'Internal auditors usually report to the audit committee or the board',ok:true},
 {t:'Internal auditors should audit controls they personally built',ok:false},
 {t:'A third-party audit is just another name for our annual external audit',ok:false}]},
h:'Two claims confuse who is audited; one claim breaks independence.',
x:'Direction matters. External audit points at your organization, third-party audit points at a vendor, and internal audit is your own team checking itself. The intern’s first three statements match those definitions. Auditing controls you built is self-review — a conflict of interest that breaks independence — which is why internal audit reports upward, not to the teams it reviews. And a third-party audit of a supplier is never the same event as your own external audit.'},
{id:'M16',th:5,ty:'text',tt:'Find the control without evidence',pts:3,
log:{lines:[
 '09:02 register CTRL-001 MFA enforcement — evidence: policy-pdf, console-export',
 '09:02 register CTRL-002 Backup restore test — evidence: restore-log-2026',
 '09:03 register CTRL-003 Data retention schedule — evidence: NONE',
 '09:03 register CTRL-004 Vendor security review — evidence: contract-scan',
 '09:05 register CTRL-005 Joiner-mover-leaver process — evidence: hr-export']},
sc:'Audit day. The evidence register for Brightline’s SOX-style review is below. Every control must show attached evidence, and the auditor is about to arrive.',
q:'Type the control ID of the control that has no evidence attached (format: CTRL- followed by three digits).',
d:{acceptAll:['CTRL-?0*3'],ph:'CTRL-…',show:'CTRL-003 (Data retention schedule)'},
h:'Filter the register for the word NONE.',
x:'The register shows CTRL-003, the data retention schedule, with evidence NONE. Under frameworks like SOX, a control without evidence is treated as not operating, even if the team believes it works, because audits run on proof. The fix is to produce the artifact — the approved schedule — and attach it before the auditor closes fieldwork. This is why evidence requests start weeks before the audit itself.'},
{id:'M17',th:0,ty:'order',tt:'The audit path',pts:6,
sc:'You coordinate Brightline’s first formal compliance audit against its PCI DSS, SOX and HIPAA obligations — the stores run in-house pharmacies, so patient-data rules apply. The audit firm sent the plan; order the phases.',
q:'Put the six audit phases in order (1 = first).',
d:{items:[
 'Define scope, objectives and the framework checklist',
 'Request evidence and plan the sample of records',
 'Test controls and inspect the sampled records',
 'Document exceptions where controls failed',
 'Draft the report and collect management responses',
 'Track the corrective action plan to closure']},
h:'You cannot test what you have not scoped, and you cannot report before you know what failed.',
x:'Audits run in a fixed order. First scope and objectives, so everyone knows the rules. Then evidence requests and sampling, because auditors test records, not promises. Fieldwork tests controls and finds exceptions, the formal name for failures. Exceptions go into the draft report with management responses. The corrective action plan (CAP) tracks each fix to closure, and auditors verify later. Jumping straight to testing without scope is the classic rookie error.'},
{id:'M18',th:1,ty:'spot',tt:'Vendor marketing vs reality',pts:4,
sc:'Procurement forwards a competitor’s pitch page. The compliance team wants the wrong claims flagged before anyone believes them.',
q:'Click the two lines that contain a real error.',
d:{lines:[
 'pitch.md — SecureBox managed platform',
 '“We are SOC 2 certified — our certificate proves it.”',
 '“Our SOC 2 Type II covers operating effectiveness for 12 months.”',
 '“SSAE 18 is the standard our CPA firm reports under.”',
 '“You may also buy ISO 27001 certification audits from us.”',
 '“Our Attestation of Compliance covers PCI DSS for card handling.”'],
bad:[1,4]},
h:'One line uses the wrong noun for a SOC report. One line mixes up who may issue ISO certificates.',
x:'There is no “SOC 2 certificate”: SOC reports are attestation reports issued by a CPA firm, not certificates, and they say nothing about ISO 27001. ISO 27001 certificates come from an accredited registrar after a certification audit, not from a competitor selling one. The other lines are correct: Type II does cover a period of operating effectiveness, SSAE 18 is the AICPA attestation standard, and the AoC is the PCI DSS document. Precision matters here, because contracts and audits quote these documents.'},
{id:'M19',th:3,ty:'qcm',tt:'Physical test paperwork',pts:3,
sc:'Halberd is contracted to test Brightline’s data center physical controls: badge readers, doors and the tailgating risk. The team already packed lock-pick sets and badge-cloning gear.',
q:'What must exist before any lock is touched?',
d:{c:[
 {t:'A verbal go-ahead from any full-time site employee',ok:false},
 {t:'A signed RoE naming the site, the doors and the time window',ok:true},
 {t:'A public announcement post on the client’s own website',ok:false},
 {t:'A copy of last year’s signed physical test report',ok:false}]},
h:'The same safety contract you signed for network tests applies to doors.',
x:'Physical testing needs the same rules of engagement as technical testing: a named site, named doors, an attack window, and a signature from someone allowed to give it. Badge cloners and lock picks are legal only inside that envelope. A friendly employee cannot authorize entry, a website post is not authorization, and an old report proves nothing about today. If a guard stops the tester, the RoE contact card resolves it in minutes.'},
{id:'M20',th:5,ty:'dnd',tt:'Rate the findings',pts:6,
sc:'Fieldwork on the Brightline external test produced six candidate findings. The client argues about every rating, so yours must be defensible.',
q:'Drag each finding to the risk rating it deserves.',
d:{slots:['Critical','High','Medium','Low'],items:[
 {t:'SQL injection on the public login page',slot:0},
 {t:'Domain admin password found on a public paste site',slot:0},
 {t:'Backup server reachable from the guest Wi-Fi',slot:1},
 {t:'Production password reused on a test server',slot:1},
 {t:'TLS 1.0 still enabled on one internal legacy app',slot:2},
 {t:'Missing login banner on the staff portal',slot:3}]},
h:'Internet-facing and instant-impact go to the top; internal hygiene slides down.',
x:'Critical means trivially exploitable now with severe impact: public SQL injection and a leaked domain admin password qualify. High covers serious exposure one step removed: a backup server reachable from guest Wi-Fi, and production credentials reused elsewhere. Medium fits the legacy TLS problem, weak but inside the network. Low is the missing banner, a policy hygiene item. Ratings combine exposure and impact; a rating you cannot explain will not survive the debrief.'},
{id:'M21',th:0,ty:'branch',tt:'PCI readiness, three calls',pts:3,
sc:'You run Brightline’s internal PCI DSS readiness review — a regulation and compliance audit before the real assessment.',
q:'Choose the best action at every step.',
d:{steps:[
 {q:'You find card numbers in a marketing spreadsheet. First move?',c:[
   {t:'Notify the audit owner and contain it per the data policy',ok:true,fb:''},
   {t:'Delete the file quietly so nobody panics',ok:false,fb:'Destroying evidence during an audit is worse than the finding.'},
   {t:'Email it to your personal address for later review',ok:false,fb:'Moving card data around spreads the problem and breaks policy.'},
   {t:'Leave it; the real assessor comes next year',ok:false,fb:'A known gap left open becomes negligence, not an oversight.'}]},
 {q:'A manager asks to “exclude the spreadsheet from scope”. Answer?',c:[
   {t:'Scope cannot hide a finding — document it and fix the storage',ok:true,fb:''},
   {t:'Agree and strike it from the working papers',ok:false,fb:'That is falsifying the audit trail.'},
   {t:'Reclassify the spreadsheet as “not card data”',ok:false,fb:'You saw the numbers; reclassification is a lie.'},
   {t:'Tell only the acquirer and move on',ok:false,fb:'Internal ownership comes first; the audit owner decides disclosure.'}]},
 {q:'Storage is fixed. What closes the loop?',c:[
   {t:'A follow-up check with evidence that the fix holds',ok:true,fb:''},
   {t:'Close the ticket on the manager’s word',ok:false,fb:'Audits run on evidence, not assurances.'},
   {t:'Nothing — finding found, work done',ok:false,fb:'Unverified fixes reappear next year.'},
   {t:'Ask the marketing intern to promise in writing',ok:false,fb:'A promise is not a control test.'}]}]},
h:'Two instincts to kill: hiding evidence, and letting scope eat findings.',
x:'A compliance audit exists to compare practice with the rulebook — here PCI DSS, which forbids storing card data in spreadsheets. The professional path is contain, document, fix, verify. Quiet deletion, scope tricks and word-of-mouth closure all corrupt the audit trail. A readiness review is a gift: every finding you verify as fixed is one the real assessor will not raise.'},
{id:'M22',th:4,ty:'term',tt:'Grep the notes',pts:4,
sc:'During the engagement you kept notes.txt. Before the report, your lead wants every line that mentions the partner subnet 192[.]0[.]2[.]9 to confirm you never touched it.',
q:'Type a grep command that prints all lines containing 192[.]0[.]2[.]9 from notes.txt. Run it with Enter, then Check.',
d:{banner:'analyst@lab:~$ reminder: grep prints every line of a file that matches a pattern',
sim:'09:21 considered 192[.]0[.]2[.]9 — NOT in scope, skipped\n11:02 confirmed partner range 192[.]0[.]2[.]0/24 avoided\n(no other matches)',
acceptAll:['grep','192','notes'],show:'grep 192[.]0[.]2[.]9 notes.txt — the pattern and the file name, in either order.'},
h:'The command family is grep. It needs the pattern and the file name.',
x:'grep PATTERN FILE prints every matching line, which makes it the fastest way to prove what you did or did not touch. Your two notes show the partner address was considered and deliberately avoided — exactly the kind of self-record that protects you if the client ever questions the test. Keeping a clean, searchable log is a professional habit for testers.'},
{id:'M23',th:2,ty:'multi',tt:'What belongs in a RoE?',pts:4,
sc:'A startup asks Halberd to “send the standard rules of engagement template”. You mark up the template before sending it.',
q:'Select every item that belongs in a RoE.',
d:{c:[
 {t:'The target list with exact IP ranges and hostnames',ok:true},
 {t:'The testing time window with start and end dates',ok:true},
 {t:'Emergency and escalation contacts for both sides',ok:true},
 {t:'How found personal data must be handled and destroyed',ok:true},
 {t:'The tester’s hourly billing rate and invoice terms',ok:false},
 {t:'The marketing plan for publishing the final report',ok:false},
 {t:'A clause letting testers keep copies of any data they find',ok:false}]},
h:'A RoE is a safety and permission document, not a business contract.',
x:'A RoE defines the fence and the safety net: targets, time window, escalation contacts, and rules for sensitive data you will inevitably meet — the GDPR-style care point. Billing belongs in the contract, not the RoE. Publishing plans are a client decision, never a template clause. Letting testers keep found data is the opposite of what a RoE should say: data stays on client systems or is destroyed with proof. If an item changes what testers may touch or must protect, it belongs here.'},
{id:'M24',th:4,ty:'dnd',tt:'Recon source triage',pts:6,
sc:'Planning the NimbusCloud engagement, the team brainstorms twelve sources; you must sort the six that made the shortlist.',
q:'Drag each technique to passive or active.',
d:{slots:['Passive (target never sees us)','Active (traffic touches the target)'],items:[
 {t:'Reading the client’s public job postings for stack hints',slot:0},
 {t:'WHOIS lookup of the main domain',slot:0},
 {t:'Ping sweep across the DMZ range',slot:1},
 {t:'Reading public certificate-transparency logs',slot:0},
 {t:'Full TCP port scan of 203[.]0[.]113[.]0/24',slot:1},
 {t:'Logging into the VPN with the supplied test account',slot:1}]},
h:'Ask: does anything travel over the network to the client?',
x:'Passive sources feed on third parties: job postings, WHOIS, certificate logs — public-source intelligence (OSINT) the target cannot log or block. Active techniques send your packets to their systems, like ping sweeps and port scans. And once you authenticate with the supplied test account you are far past recon, into authorized access. Teams keep the two apart because passive work can run any day, while active work must wait for the attack window in the RoE.'},
{id:'M25',th:3,ty:'multi',tt:'Night shift judgment (defense view)',pts:4,
sc:'You run the SOC night shift. At 03:10, sensors flag a SYN scan of the DMZ from 203[.]0[.]113[.]77. The RoE on file says the vendor pentest runs 09:00–17:00 from 198[.]51[.]100[.]66.',
q:'Select every defensible response.',
d:{c:[
 {t:'Verify the source and window against the RoE, then call the listed contact',ok:true},
 {t:'Treat it as possible unauthorized recon and follow the alert playbook',ok:true},
 {t:'Ignore the alert because some approved pentest is surely running',ok:false},
 {t:'Shut down the whole DMZ segment at once to stop the scan',ok:false},
 {t:'Launch your own counter-scan back at the source right away',ok:false}]},
h:'The RoE answers two questions — who and when — and both answers here are “no”.',
x:'The source address and the hour both fall outside the RoE, so this is not clearly the authorized test. The balanced response is verification plus the normal alert process: check the RoE, call the listed contact, and keep watching. Ignoring alerts because “audits happen” trains analysts to miss real attacks. Cutting the DMZ and counter-attacking are disproportionate and may break your own rules. Judgment means matching the response to the evidence.'},
{id:'M26',th:3,ty:'qcm',tt:'Bug bounty basics',pts:3,
sc:'Brightline’s CTO read about companies paying researchers and asks you what a bug bounty program actually is.',
q:'Which description is correct?',
d:{c:[
 {t:'A program that pays rewards for valid vulnerability reports under published rules',ok:true},
 {t:'An annual compliance audit of the code, run by an accounting firm',ok:false},
 {t:'A free and rule-free full replacement for penetration testing',ok:false},
 {t:'A subscription service that finds and patches server flaws automatically',ok:false}]},
h:'Two words carry the answer: reward and rules.',
x:'A bug bounty invites independent researchers to test inside a published scope and pays a reward for valid reports, usually with a responsible disclosure process that gives the vendor time to fix. It complements a pentest: bounty hunters bring variety, while a paid pentest brings fixed dates, a defined scope and a report you can show auditors. “Rule-free” is the giveaway in the wrong option — without rules, bounty testing would be illegal in most places.'},
{id:'M27',th:1,ty:'fib',tt:'The attestation letter',pts:4,
sc:'NimbusCloud’s account team must answer a prospect who wants “proof that never expires”. You draft the plain-English reply.',
q:'Fill the blanks in the reply.',
d:{txt:'Our SOC 2 report is an attestation: an independent [0] firm examined our controls under the AICPA’s [1] standard. The [2] report you received covers a full year of operating effectiveness, which is what Type II means. Between annual reports we send a [3] letter so your team has assurance that nothing material changed.',
bank:['CPA','SSAE 18','Type II','bridge'],ans:[0,1,2,3]},
h:'The auditor’s licence, the attestation standard, the report type, the gap-filler.',
x:'Attestation means an independent professional examines something and issues a formal opinion. For SOC reports that professional is a CPA firm and the standard is SSAE 18, published by the AICPA. A Type II report covers a period of operating effectiveness, not a single day. A bridge letter covers the gap between the report’s end date and today, listing any changes. Together these four words answer the question “how current is your proof?”'},
{id:'M28',th:5,ty:'spot',tt:'Report section review',pts:4,
sc:'A junior wrote the closing sections of the Brightline report. The lead asks you to flag the lines a client lawyer would attack.',
q:'Click the two lines that must be rewritten.',
d:{lines:[
 'Report section — handling of evidence and follow-up',
 'We captured screenshots and command output as proof for each finding.',
 'We will keep a copy of the customer database dump for training use.',
 'Remediation advice: not needed; the client can accept the risk.',
 'All captured data will be destroyed 30 days after report delivery, with confirmation.',
 'A retest is offered after the fixes are deployed.'],
bad:[2,3]},
h:'One line is about data they have no right to keep. One line is where the tester does the client’s job.',
x:'Testers may capture proof, but keeping a database dump for “training” exceeds the mandate; data must be returned or destroyed, ideally with written confirmation. And “no remediation advice” abandons the client: every finding needs a recommendation, even when the client then chooses to accept the risk. Accepting risk is a client decision, not a tester conclusion. The other lines — proof capture, destruction with confirmation, and a retest offer — are exactly what a professional close-out looks like.'},
{id:'M29',th:2,ty:'order',tt:'After the first shell',pts:5,
sc:'The team got a foothold on an in-scope app server during the attack window. Your lead asks you to brief the intern on what post-exploitation looks like when done properly.',
q:'Order the five post-exploitation steps (1 = first).',
d:{items:[
 'Escalate privileges on the compromised host',
 'Pivot carefully toward other in-scope hosts',
 'Set up persistence only if the RoE allows it',
 'Collect evidence and document every access',
 'Remove all artifacts and restore what was changed']},
h:'Access first, reach second, records always, cleanup last.',
x:'Post-exploitation starts by learning what the foothold can do: privilege escalation turns a user shell into stronger access. Pivoting then uses that position to reach agreed targets deeper inside. Persistence — keeping a way back in — needs explicit RoE permission, because leftover access is a real risk. Documentation runs through all of it, since the report must prove every claim. Cleanup removes tools, accounts and settings so the client gets their system back exactly as it was.'},
{id:'M30',th:3,ty:'multi',tt:'Red, blue, purple — who does what',pts:4,
sc:'Brightline booked a “purple exercise” and half the IT staff think it means the auditors join the attack team. You fix the briefing deck.',
q:'Select every correct statement.',
d:{c:[
 {t:'The red team plays attacker and probes detections end to end',ok:true},
 {t:'The blue team defends, detects and improves controls',ok:true},
 {t:'A purple exercise has red and blue working together and sharing findings live',ok:true},
 {t:'The red team writes the production firewall rules afterwards',ok:false},
 {t:'The blue team performs the annual external audit',ok:false}]},
h:'Colors describe roles in an attack-and-defend exercise, not jobs in audit or networking.',
x:'Red emulates attackers — offensive testing in practice; blue runs the defense — defensive testing; purple is the integrated mode, where the two work together, often with live sharing so detections improve during the exercise itself. Firewall changes belong to engineering, and external audits belong to independent firms — neither is a team color. Knowing the terms matters commercially too: clients ask for purple exercises because they turn an attack simulation into a detection-improvement workshop.'}
];
boot();

<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
