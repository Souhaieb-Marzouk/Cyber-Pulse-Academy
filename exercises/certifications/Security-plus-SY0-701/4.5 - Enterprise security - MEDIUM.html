exp:"<p><b>Alert 1:</b> a Word document spawning encoded PowerShell is classic malicious-macro behavior. Containment comes first, so isolate the host with EDR and investigate after. <b>Alert 2:</b> repeated drops to RDP from one internet source is probing. The firewall is already blocking it — keep it blocked, add a source block and review logs. Opening RDP would make it worse. <b>Alert 3:</b> your own vulnerability scanner triggers SQL-injection signatures thousands of times. The detection works; the source is known-benign, so tune or suppress for that scanner IP. Disabling the signature would blind you. <b>Alert 4:</b> a productivity-category block is working as designed. Confirm the category and explain the policy to the user; do not change categories to please one request.</p>",
data:{rows:[
 {t:"EDR alert — finance-ws-07: WINWORD.EXE spawned powershell.exe with an encoded (-enc) command.",short:"EDR macro alert",opts:["Isolate the host with EDR and start investigating","Create a firewall allow rule for powershell.exe","Lower EDR sensitivity on the finance team","Email the user and ask if she opened a document"],a:0,fb:"Host isolated — the macro was stopped before lateral movement."},
 {t:"Firewall log — 60 DROP entries in 5 minutes from 203.0.113[.]44 to 10.20.5[.]10 TCP/3389.",short:"RDP drops",opts:["Open TCP/3389 to the source so the noise stops","Keep blocking, add a source block rule and review RDP logs","Disable logging on port 3389","Reboot the firewall to clear the queue"],a:1,fb:"Source blocked and logged — the probe never reached the host."},
 {t:"IDS — signature 'SQL injection attempt' fired 400 times in the last hour; source is the weekly vulnerability scanner 10.9.9[.]60.",short:"Scanner alerts",opts:["Disable the SQL-injection signature","Move the IPS to prevention mode for this signature","Tune the rule to suppress the known scanner IP","Ignore every SQL alert for a week"],a:2,fb:"Alert tuned for the scanner IP — real SQL-injection alerts still fire."},
 {t:"DNS filter — user blocked from job-board-site[.]com (category: productivity, company policy: blocked).",short:"Blocked job site",opts:["Create a permanent allow rule for the whole category","Re-categorize the site as 'news' so it passes","Confirm the category and explain the policy to the user","Turn off DNS filtering for the HR subnet"],a:2,fb:"User informed — the filter stays as configured."}
]}},
{id:"M02",type:"cat",title:"Which layer owns this control?",th:["fw","dns","dlp","nac"],pts:10,
scen:"<p>Meridian Retail is refreshing its enterprise security controls. The new security manager collected candidate measures from four vendor meetings, and now they are mixed together on one whiteboard.</p>",
q:"<p>Drag each control to the layer where it is actually enforced.</p>",
hint:"Ask: is this done at the network edge, at name resolution, on the data itself, or at the door to the network?",
exp:"<p><b>Network perimeter:</b> a deny rule for inbound TCP/445 and NGFW application control both run on the firewall. <b>DNS layer:</b> sinkholing a domain and filtering newly registered domains happen at the resolver, before a connection even starts. <b>Data protection:</b> blocking credit-card patterns in outbound email (email DLP) and blocking USB removable media protect the data itself, wherever it travels. <b>Access control:</b> 802.1X on access switches decides whether a device may join the network at all — that is NAC.</p>",
data:{buckets:[{k:"fw",label:"Network perimeter"},{k:"dns",label:"DNS layer"},{k:"dlp",label:"Data protection"},{k:"nac",label:"Access control"}],
items:[
 {t:"Add a deny rule for inbound TCP/445",k:"fw"},
 {t:"Sinkhole a malicious domain",k:"dns"},
 {t:"Block credit-card patterns in outbound email",k:"dlp"},
 {t:"Enable 802.1X on access switches",k:"nac"},
 {t:"NGFW application control for SSH tools",k:"fw"},
 {t:"Filter newly registered domains",k:"dns"},
 {t:"Block USB removable-media drives",k:"dlp"}]}},
{id:"M03",type:"order",title:"Order a firewall rule change",th:["fw","proc"],pts:8,
scen:"<p>The app team asks for one new permit rule on the perimeter firewall so a partner can reach their API. Your company has a formal change-approval process (a CAB — change advisory board) for firewall modifications.</p>",
q:"<p>Put the steps of a controlled firewall rule change in the correct order.</p>",
hint:"Paperwork comes before production. Documentation is written when the work is done, not before.",
exp:"<p>A controlled change always follows the same shape: <b>request</b> (what and why), <b>peer review</b> (catch mistakes early), <b>approval</b> (the change advisory board — the CAB — accepts the risk), <b>schedule + rollback</b> (a window and a tested way back), <b>apply</b>, <b>verify</b> (prove it works and nothing else broke), and <b>document</b> (so the next auditor knows why the rule exists). Applying first and asking later is how shadowed and orphan rules pile up.</p>",
data:{items:[
 "Raise a change request describing the rule and the business reason",
 "Peer review of the requested rule (security + network)",
 "Approval by the change advisory board",
 "Schedule a maintenance window and prepare the rollback plan",
 "Apply the rule change on the firewall",
 "Test and verify the traffic behaves as intended",
 "Update the rule documentation and close the ticket"]}},
{id:"M04",type:"qcm",title:"Least-privilege SSH rule",th:["fw"],pts:6,
scen:"<p>The perimeter firewall is stateful and processes rules top-down, first match wins. Logs show the whole contractor subnet 172.16.9[.]0/24 attempting SSH (TCP/22) to jump host 10.20.5[.]10. Policy says only the two admin workstations, 172.16.9[.]31 and 172.16.9[.]32, may ever use SSH.</p>",
q:"<p>Which rule change gives the admins access without exposing SSH to everyone else?</p>",
hint:"The more specific permit must sit above any broad rule, and everyone else must still fall into a deny.",
exp:"<p>The correct change is a <b>specific permit</b> for the two admin workstations, placed above any broader rule, while everything else still falls through to the deny. Allow and deny rules are read top-down, first match wins — order is part of the rule itself. Allowing the whole /24 (option B) gives every contractor SSH. Allowing any source (option C) exposes the jump host to the internet. Option D denies exactly the people who need access. This is least privilege: one narrow rule, explicit order, and <b>stateful inspection</b> tracks the sessions that pass.</p>",
data:{opts:[
 {t:"Permit tcp/22 from the two admin workstations to the jump host, placed above the broad rule"},
 {t:"Permit tcp/22 from 172.16.9[.]0/24 to any destination, deny added later in the list"},
 {t:"Permit tcp/22 from any source to the jump host on this perimeter, with logging enabled"},
 {t:"Deny tcp/22 from 172.16.9[.]31 and 172.16.9[.]32, permit the rest of the subnet"}],a:0}},
{id:"M05",type:"fill",title:"Write the partner web rule",th:["fw"],pts:8,
scen:"<p>Partners reach the Meridian web app at 10.44.2[.]15 from their network 198.51.100[.]0/24 over HTTPS only. You are writing the rule pair by hand in the change ticket.</p>",
q:"<p>Complete the rule wording with the terms from the bank.</p>",
hint:"Protocol first, then the web port, then the catch-all rule that enforces the default behavior.",
exp:"<p>Every allow rule must name its ports and protocols precisely. HTTPS is <b>TCP port 443</b>, so the permit names <b>tcp</b> and <b>443</b> and nothing else. Firewalls read their allow and deny rules top-down, and after every specific rule a final <b>deny any any</b> makes the default visible and logged — firewalls already drop unmatched traffic by default, which is called the <b>implicit deny</b>; writing it down just makes it explicit and easier to audit.</p>",
data:{text:"Add the rule: {0} from 198.51.100[.]0/24 to 10.44.2[.]15 port {1}. Then add a final rule that says {2}, so the default {3} of the firewall is enforced and logged.",
bank:[{t:"tcp",c:true},{t:"443",c:true},{t:"deny any any",c:true},{t:"implicit deny",c:true},{t:"udp",c:false},{t:"8080",c:false},{t:"allow any any",c:false},{t:"permit ip any",c:false}],
exp:[0,1,2,3]}},
{id:"M06",type:"match",title:"Match the appliance to its job",th:["fw","ips"],pts:8,
scen:"<p>Procurement sent you four one-line product descriptions and asked which box does which job. Answer before the Friday call.</p>",
q:"<p>Match each product to the description that fits it.</p>",
hint:"One is a web-app specialist, one is an all-in-one for smaller sites, one is app-aware and fast, one only watches and warns.",
exp:"<p>An <b>NGFW</b> (next-generation firewall) filters by application and user with deep packet inspection and integrated IPS — the fast, app-aware choice for modern perimeters. A <b>UTM</b> bundles firewall, IPS, antivirus and web filtering into one appliance, which smaller sites love. A <b>WAF</b> sits in front of web applications and inspects HTTP for SQL injection and XSS. A <b>NIDS</b> watches a copy of the traffic (for example from a SPAN port, also called a port mirror) and raises alerts — it is passive and cannot block anything, because it is not in the traffic path.</p>",
data:{pairs:[
 {l:"NGFW",r:"Filters by application and user, deep packet inspection built in"},
 {l:"UTM",r:"One appliance bundling firewall, IPS, antivirus and web filtering"},
 {l:"WAF",r:"Protects web apps by inspecting HTTP for SQLi and XSS"},
 {l:"NIDS",r:"Watches a SPAN-port copy of traffic and raises alerts; cannot block"}]}},
{id:"M07",type:"spot",title:"Find the dangerous rule",th:["fw"],pts:6,
scen:"<p>During an incident last quarter, a vendor asked for 'temporary full access' on fw-edge-01. The change was never cleaned up. Here is the current ruleset, top-down, first match wins.</p>",
q:"<p>Click the single line that makes every deny rule below it useless.</p>",
hint:"The firewall reads from the top. Whatever matches first wins — what does line 2 do to everything after it?",
exp:"<p>Line 2 (<b>permit ip any any</b>) matches every possible packet, so the firewall never reaches the denies below. This is the classic <b>shadowed rules</b> problem: the specific permits and denies still exist but are dead. Specific permits should sit above only the denies they must overrule — never an any/any permit. Remove line 2, keep the specific partner permits, and the denies become effective again.</p>",
data:{code:[
 {t:"! fw-edge-01 ruleset — top-down, first match wins"},
 {t:"1  permit ip any any        ! 'temporary' vendor access, added during incident",bad:true},
 {t:"2  permit tcp 10.60.1[.]0/24 -> db01 1433"},
 {t:"3  deny ip any -> db01  log"},
 {t:"4  deny ip any any  log"}],multi:false}},
{id:"M08",type:"lq",title:"What is happening on the SSH gateway?",th:["ips"],pts:6,
scen:"<p>07:40: the IDS on the VPN segment lit up. Use the filter in the log viewer below to see the pattern before you answer. The gateway 10.20.5[.]10 accepts SSH only from the admin VLAN.</p>",
q:"<p>What does this alert pattern show, and what is the right first move?</p>",
hint:"Same source, hundreds of connections to port 22 in three minutes = someone guessing passwords.",
exp:"<p>One external source opened hundreds of connections to SSH within minutes — that is a <b>brute-force scan</b>, not a user. The NIDS works as designed: it is <b>signature-based</b>, so it matched the known 'Possible SSH Scan' signature. First move: block the source at the firewall and check the auth logs for any successful login. It is not DNS traffic (no tunnel), not your scanner (the scanner is on an internal VLAN and flagged differently), and 'close the alert' ignores an active probe.</p>",

 ["m","07:37:02  sensor=ids-vpn01  sig=ET SCAN Possible SSH Scan  attempts=1"],
 ["k","07:37:11  [**] [1:2001219:8] ET SCAN Possible SSH Scan [**] {TCP} 198.51.100[.]7:51234 -> 10.20.5[.]10:22"],
 ["k","07:37:14  [**] [1:2001219:8] ET SCAN Possible SSH Scan [**] {TCP} 198.51.100[.]7:51235 -> 10.20.5[.]10:22"],
 ["k","07:37:19  [**] [1:2001219:8] ET SCAN Possible SSH Scan [**] {TCP} 198.51.100[.]7:51240 -> 10.20.5[.]10:22"],
 ["k","07:37:44  [**] [1:2001219:8] ET SCAN Possible SSH Scan [**] {TCP} 198.51.100[.]7:51288 -> 10.20.5[.]10:22"],
 ["w","07:38:02  [**] [1:2006422:3] ET SCAN LibSSH Based Brute Force Detection [**] {TCP} 198.51.100[.]7:51301 -> 10.20.5[.]10:22"],
 ["k","07:38:31  [**] [1:2001219:8] ET SCAN Possible SSH Scan [**] {TCP} 198.51.100[.]7:51344 -> 10.20.5[.]10:22"],
 ["k","07:38:55  [**] [1:2001219:8] ET SCAN Possible SSH Scan [**] {TCP} 198.51.100[.]7:51390 -> 10.20.5[.]10:22"],
 ["m","07:39:10  sensor=ids-vpn01  sig=ET SCAN Possible SSH Scan  attempts=214  src=198.51.100[.]7"],
 ["m","07:39:11  summary: 214 alerts / 3 min / single source / dst tcp22"],
 ["m","07:39:30  sensor=ids-dmz01  sig=POLICY FTP upload  (unrelated)"]],

  {t:"SSH brute force from one source — block it at the firewall and check auth logs for success"},
  {t:"Normal user behavior — several admins use the gateway, so close the alert as a false alarm"},

{id:"M09",type:"multi",title:"Silence the noise, keep the eyes",th:["ips"],pts:9,
scen:"<p>The SOC gets 2,000 IDS alerts a day. About 85% come from three sources: the weekly vulnerability scanner, a legacy monitoring probe that sends odd TCP options, and one signature that fires on every internal backup job. Analysts are starting to ignore the console.</p>",
q:"<p>Select <b>three</b> actions that reduce false positives without losing real detection coverage.</p>",
hint:"Look for changes that keep the detection alive for real attackers and only remove known-benign noise.",
exp:"<p>Good alert tuning keeps coverage and removes noise: <b>adjusting thresholds</b> so a single probe does not alert, <b>suppressing known-benign sources</b> like the scanner IP, and <b>updating the signature database</b> so old, over-broad signatures are replaced by precise ones. Switching the <b>anomaly-based</b> engine off removes a whole detection method — that is losing coverage and inviting <b>false negatives</b>, not tuning. Keeping the <b>heuristic</b> rules sharp matters too: they catch new variants the signature database does not know yet. Putting the IPS inline in blocking mode changes risk, it does not fix false positives, and it can block business traffic. Disabling all SQL signatures blinds you to a real attack class.</p>",
data:{opts:[
 {t:"Tune the signature threshold so single probes do not alert",c:true},
 {t:"Suppress the known-benign alert for the scanner IP only",c:true},
 {t:"Update the signature database to the current vendor version",c:true},
 {t:"Turn off the anomaly detection engine completely",c:false},
 {t:"Move the IPS inline and enable block mode on all rules",c:false},
 {t:"Disable every SQL-injection signature",c:false}]}},
{id:"M10",type:"term",title:"Terminal: pull the dropped packets",th:["fw","proc"],pts:6,
scen:"<p>You are on the SOC jump host. The firewall log is at /var/log/fw/fw01.log. Field layout: <b>&lt;ts&gt; &lt;action&gt; &lt;proto&gt; &lt;src&gt; &lt;dst&gt; &lt;sport&gt; &lt;dport&gt;</b> — for example: 2026-03-02T02:14:09 DROP udp 198.51.100[.]9 10.20.5[.]1 51337 53</p>",
q:"<p>Use a <b>grep</b> command to print every DROPped line from /var/log/fw/fw01.log. Type the complete command.</p>",
hint:"The family is grep. Shape: grep PATTERN FILE — the pattern is the action word you see in the field layout.",
exp:"<p>The expected command is <b>grep DROP /var/log/fw/fw01.log</b> (grep -i drop or quoting also works). grep prints every line that contains the pattern, which is exactly what you need before counting or grouping. This is the standard first step of firewall log review: filter by the action field, then look at sources and ports.</p>",
data:{host:"analyst@soc-jump",title:"soc-jump — bash",ps:"analyst@soc-jump:~$",
banner:["soc-jump 4.9.0 #1 SMP","Field layout: <ts> <action> <proto> <src> <dst> <sport> <dport>","Log file: /var/log/fw/fw01.log"],
accepted:["^grep\\s+(-\\w+\\s+)*drop\\b.*fw01\\.log$"],
canon:"grep DROP /var/log/fw/fw01.log",
out:["2026-03-02T02:14:09 DROP udp 198.51.100[.]9 10.20.5[.]1 51337 53","2026-03-02T02:14:31 DROP tcp 203.0.113[.]44 10.20.5[.]10 52110 3389","2026-03-02T02:15:02 DROP udp 198.51.100[.]9 10.20.5[.]1 51355 53"],
err:"grep: no output — check the pattern (DROP) and the file path."}},
{id:"M11",type:"branch",title:"Blocked domain on a finance workstation",th:["dns","edr","proc"],pts:9,
scen:"<p>09:15 — the DNS filter blocks invoice-portal-update[.]com (category: newly registered / phishing) for user dana.k on a finance workstation. She says she only clicked a link in an 'overdue invoice' email. Your playbook: confirm, scope, contain — in that order.</p>",
q:"<p>Work through the three decision points. Each choice unlocks the next step.</p>",
hint:"Containment first, then find the scope, then protect the identity.",
exp:"<p>The right path is <b>confirm the block → check the scope → contain the identity</b>. Checking whether other hosts queried the domain tells you if one user clicked or a campaign is running. When more hosts appear, you block the domain for everyone and hunt who else clicked. A follow-up POST means data may have left — isolate that host with EDR and reset the user's credentials, because a stolen password outlives any single device. Silently allowing a phishing domain, disabling protection, or 'waiting for the weekly review' each leave the attacker in control.</p>",
data:{steps:[
 {sit:"The DNS filter just blocked invoice-portal-update[.]com on one finance workstation. First decision:",opts:[
  {t:"Confirm the block and check whether other hosts queried the same domain",fb:"The block holds. A quick query of DNS logs starts.",ok:true},
  {t:"Silently allow the domain for 24 hours to avoid blocking real work",fb:"The domain resolves. The user's session with the 'invoice portal' continues.",ok:false},
  {t:"Uninstall the DNS agent from the user's laptop",fb:"The laptop no longer reports DNS events. You are blind on that host.",ok:false}]},
 {sit:"Query logs show 6 more hosts contacted the same domain in the last hour. Next decision:",opts:[
  {t:"Keep the blocklist entry and start hunting which users actually interacted",fb:"Six more workstations identified. Two users opened the page.",ok:true},
  {t:"Add the domain to the allowlist so nobody complains again",fb:"All seven hosts now reach the phishing page freely.",ok:false},
  {t:"Ignore it — six hits is not an incident",fb:"The queue stays quiet. The phishing page keeps working.",ok:false}]},
 {sit:"One host shows a follow-up POST to hxxp://invoice-portal-update[.]com/submit — likely credentials. Final decision:",opts:[
  {t:"Isolate that host with EDR and reset the user's credentials",fb:"Host contained, password rotated before reuse. Incident bridged.",ok:true},
  {t:"Wait for the weekly security review",fb:"The credentials are used against webmail within the hour.",ok:false},
  {t:"Reimage every laptop in the company",fb:"Massive disruption — and the stolen password was never reset.",ok:false}]}]}},
{id:"M12",type:"cat",title:"Four DNS events, four controls",th:["dns"],pts:9,
scen:"<p>You manage the enterprise recursive resolvers and the DNS filter for Corvex Manufacturing. Four DNS-related items landed in your queue this morning, each needing a different control.</p>",
q:"<p>Drag each item to the control that fits it best.</p>",
hint:"Sinkhole = redirect and watch. Block = stop. Tunnel = strange record types and volumes. Category tuning = policy, not security.",
exp:"<p>A phishing domain that users already resolved goes on the <b>blocklist</b> so it stops resolving. A known C2 domain from the <b>threat feeds</b> is perfect for a <b>DNS sinkhole</b>: it keeps resolving (to your sinkhole IP) so you can see which infected hosts still try to beacon — block it and you lose that visibility. Hundreds of TXT queries with long random names is a suspected <b>DNS tunnel</b>, which needs investigation, not a block. A trusted internal widget flagged as 'ads' is <b>domain categorization</b> (or allowlist) housekeeping — policy, not security, and the same applies to uncategorized sites that behave. And <b>DNS-over-HTTPS (DoH)</b> straight to a public provider <b>bypasses your filter</b>, so it deserves investigation of which clients do it and why.</p>",
data:{buckets:[{k:"block",label:"Block / blocklist"},{k:"sink",label:"Sinkhole it"},{k:"tun",label:"Investigate (possible tunnel / bypass)"},{k:"cat",label:"Tune category / allowlist"}],
items:[
 {t:"Phishing domain from a reported email — 12 users already resolved it",k:"block"},
 {t:"C2 domain from the threat feed — you want to see which hosts still try it",k:"sink"},
 {t:"One client sends 400 TXT queries/min to a long-random subdomain chain",k:"tun"},
 {t:"Intranet widget flagged as 'ads' — it is a trusted internal tool",k:"cat"},
 {t:"Clients using encrypted DNS to a public provider instead of the internal resolver",k:"tun"},
 {t:"Newly registered domain running a fake payroll login page",k:"block"}]}},
{id:"M13",type:"qcm",title:"Odd TXT traffic on the resolver",th:["dns"],pts:6,
scen:"<p>Resolver logs: workstation ws-eng-22 sent 900+ queries in 10 minutes for names like a3f9c2.tunnel-update[.]net, all asking for <b>TXT</b> records. The resolver answered 40 of them with NXDOMAIN. No other host shows this pattern.</p>",
q:"<p>What is the most likely explanation, and what does it mean for the response?</p>",
hint:"TXT records can carry arbitrary data. Long random subdomains + high volume = someone is encoding information into DNS queries.",
exp:"<p>This is the signature of <b>DNS tunneling</b>: data is chopped into chunks and encoded into subdomain names (and sometimes TXT records) of one authoritative domain. The high query volume, the long random labels and the NXDOMAIN replies (the attacker's server does not answer every chunk) all fit. The response is to isolate and investigate the workstation and block the domain. Cache poisoning, DNSSEC trouble and CDN load-balancing do not look like this — they do not need thousands of unique, random TXT queries from one host.</p>",
data:{opts:[
 {t:"DNS tunneling — data is being smuggled in DNS queries; isolate the host and block the domain"},
 {t:"DNS cache poisoning — the resolver cached wrong records, so flush the resolver cache"},
 {t:"DNSSEC misconfiguration — signatures fail validation, so roll the DNSSEC keys"},
 {t:"Normal CDN load balancing — many unique names are expected, so no action needed"}],a:0}},
{id:"M14",type:"fill",title:"Draft the email DLP policy",th:["dlp"],pts:8,
scen:"<p>The privacy office asks for protection against national ID numbers leaving by email. The DLP team follows the safe rollout: measure first, enforce second.</p>",
q:"<p>Complete the policy wording with the terms from the bank.</p>",
hint:"You do not block on day one. First you measure how much real traffic would have been stopped.",
exp:"<p>The policy <b>blocks</b> messages matching the <b>template</b> — DLP ships ready-made patterns (templates) for things like national IDs and payment cards, so you do not write the pattern by hand. It runs in <b>monitor</b> mode first to measure <b>false positives</b>: how often everyday numbers trip the pattern. After tuning, switch to block. Deploying a brand-new pattern straight in block mode is how DLP projects get rolled back after the first payroll day.</p>",
data:{text:"Email DLP policy: {0} any outbound message that matches the {1} for a national ID number. Run it in {2} mode for two weeks to measure {3}, then switch to enforcement.",
bank:[{t:"block",c:true},{t:"template",c:true},{t:"monitor",c:true},{t:"false positives",c:true},{t:"allow",c:false},{t:"encryption",c:false},{t:"signature",c:false},{t:"true negatives",c:false}],
exp:[0,1,2,3]}},
{id:"M15",type:"cat",title:"Protect the data in its three states",th:["dlp"],pts:9,
scen:"<p>The DLP team at Veldt Insurance must show the audit committee one control per data state. They have six candidate controls on the table.</p>",
q:"<p>Drag each control to the data state it protects.</p>",
hint:"At rest = sitting on a disk. In transit = moving over a network. In use = being worked on right now.",
exp:"<p><b>At rest</b> means stored: full-disk encryption protects the laptop disk, and the nightly DLP scan checks what lives on the file server. <b>In transit</b> means moving: blocking uploads of files whose <b>classification labels</b> mark them Confidential — that is cloud DLP at the web gateway — and TLS inspection there is <b>network DLP</b> watching data on the wire. <b>In use</b> means actively handled: the clipboard/watermark shield and the <b>endpoint agent</b> that blocks printing of tagged documents protect data while a user touches it. A complete DLP program covers all three states — a disk encryption checkbox alone fails the audit.</p>",
data:{buckets:[{k:"rest",label:"Data at rest"},{k:"trans",label:"Data in transit"},{k:"use",label:"Data in use"}],
items:[
 {t:"Full-disk encryption on the finance laptop",k:"rest"},
 {t:"Block upload of files tagged Confidential to personal cloud drives",k:"trans"},
 {t:"Clipboard and watermark shield inside VDI sessions",k:"use"},
 {t:"TLS inspection at the web gateway",k:"trans"},
 {t:"Nightly DLP scan of the file server shares",k:"rest"},
 {t:"Endpoint agent blocks printing of tagged documents",k:"use"}]}},
{id:"M16",type:"spot",title:"Why is DLP crying wolf?",th:["dlp"],pts:6,
scen:"<p>Two days after the new payment-card DLP policy went live in monitor mode, it reports 11,400 hits per hour. The business sends order numbers, timestamps and case IDs all day. Here is the pattern as deployed:</p>",
q:"<p>Click the one line that causes the flood of false positives.</p>",
hint:"How many everyday numbers have 13 to 19 digits? A real card check does more than count digits.",
exp:"<p>The regex <b>[0-9]{13,19}</b> matches any run of 13–19 digits — order numbers, timestamps joined together, case IDs. A payment-card template must include <b>checksum validation</b> (the Luhn check) and sensible separators, which is why teams use the vendor's card <b>template</b> instead of a hand-rolled digit count. The scope, action and name are fine; the detection pattern is the mistake. This is exactly why the policy runs in monitor mode first — the flood shows up as data, not as blocked payroll.</p>",
data:{code:[
 {t:"policy \"block-credit-cards\" {"},
 {t:"  detect: pattern \"[0-9]{13,19}\"",bad:true},
 {t:"  scope: outbound email"},
 {t:"  action: block"},
 {t:"}"}],multi:false}}
,
{id:"M17",type:"multi",title:"Valid posture checks",th:["nac"],pts:8,
scen:"<p>Kestrel Logistics rolls out NAC on the office LAN. Before a device may leave the remediation network, the posture service runs its check list. The compliance officer wants only checks that describe the <b>health of the device</b>.</p>",
q:"<p>Select the <b>four</b> checks that are valid NAC posture checks.</p>",
hint:"Posture = is this device healthy and trustworthy right now — not who owns it or how old it is.",
exp:"<p>Posture checks look at device health: <b>endpoint protection present and healthy</b>, <b>patches at the required level</b>, <b>disk encryption</b> enabled, and the <b>host firewall</b> on. The user's department is an authorization (identity) question — useful for VLAN choice, not for health. The laptop's purchase date says nothing about its security state today. Mixing identity and posture is a classic design mistake: it makes healthy devices fail and unhealthy devices pass.</p>",
data:{opts:[
 {t:"Endpoint protection client present and database current",c:true},
 {t:"OS security patches at the company-required level",c:true},
 {t:"Disk encryption enabled",c:true},
 {t:"Host firewall enabled",c:true},
 {t:"User belongs to the marketing department",c:false},
 {t:"Laptop was purchased less than three years ago",c:false},
 {t:"Device has a purple sticker on it",c:false}]}},
{id:"M18",type:"order",title:"Follow one 802.1X handshake",th:["nac"],pts:8,
scen:"<p>A laptop joins the office Wi-Fi bridge at Halcyon Bank. The access layer uses 802.1X with EAP-TLS and RADIUS. Trace one successful logon from cable plug to production VLAN.</p>",
q:"<p>Put the handshake steps in the correct order.</p>",
hint:"Laptop → switch → RADIUS → laptop → RADIUS → switch. The certificate travels to the server, the decision travels back.",
exp:"<p>In 802.1X the <b>supplicant</b> (laptop) asks, the <b>authenticator</b> (switch or AP) never decides by itself — it relays to the <b>authentication server</b> (RADIUS). RADIUS challenges the client, the client answers with its certificate (EAP-TLS), RADIUS validates it against the PKI and returns <b>Access-Accept</b> plus attributes like the VLAN. Only then does the switch open the port and place the device in that VLAN. If RADIUS answered 'reject', the port stays closed or the device lands in quarantine.</p>",
data:{items:[
 "Supplicant (laptop) connects to the switch port and requests access",
 "Authenticator (switch) forwards the request to the RADIUS server",
 "RADIUS server challenges the client to prove its identity",
 "Client responds with its device certificate (EAP-TLS)",
 "RADIUS validates the certificate and returns Access-Accept with the VLAN",
 "Switch opens the port and places the laptop in the assigned VLAN"]}},
{id:"M19",type:"match",title:"NAC vocabulary check",th:["nac"],pts:8,
scen:"<p>New SOC hires keep mixing up the NAC terms. You build a flash-card set for the onboarding folder.</p>",
q:"<p>Match each NAC term to its definition.</p>",
hint:"Think: always-on helper, one-shot browser check, remote fingerprint, and the web page you must click through.",
exp:"<p>A <b>persistent agent</b> is installed once and reports posture continuously — best for company devices. A <b>dissolvable agent</b> runs a one-time check in the browser and removes itself — typical for contractor and BYOD laptops. An <b>agentless</b> check fingerprints the device remotely (open ports, DHCP fingerprint) without installing anything — weaker but zero-touch. A <b>captive portal</b> is the web page a user must complete before access is granted — standard on guest Wi-Fi. <b>MDM integration</b> lets the NAC read device compliance state (encryption, jailbreak, OS version) from the mobile device manager, which matters for phones and tablets.</p>",
data:{pairs:[
 {l:"Persistent agent",r:"Installed once, runs always, reports posture continuously"},
 {l:"Dissolvable agent",r:"One-time posture check in the browser, then removes itself"},
 {l:"Agentless scan",r:"NAC fingerprints the device remotely, installs nothing"},
 {l:"Captive portal",r:"Web page the user must complete before access is granted"},
 {l:"MDM integration",r:"Device manager feeds compliance state into the NAC decision"}]}},
{id:"M20",type:"branch",title:"A laptop fails posture",th:["nac","proc"],pts:9,
scen:"<p>09:40 — an accounting laptop fails its 802.1X posture check: the endpoint protection database is 45 days out of date. The NAC design puts failing devices in the quarantine VLAN, which reaches only the remediation servers.</p>",
q:"<p>Make the three operational decisions in order.</p>",
hint:"Quarantine is a waiting room with tools, not a punishment cell and not a second-class production network.",
exp:"<p>Failing posture means <b>quarantine with remediation access</b> — that is exactly what the quarantine VLAN is for. Inside it, the device reaches <b>only the remediation servers</b> (patch source, AV update server); opening the whole network would defeat the control, and using a colleague's PC just moves the problem. Once updates are applied, <b>re-run the posture assessment</b> and release the device to its production VLAN — a timed release without re-checking, or dumping the device into the guest network, skips the very check that exists to protect the LAN.</p>",
data:{steps:[
 {sit:"The accounting laptop fails posture (AV database 45 days old). First decision:",opts:[
  {t:"Place it in the quarantine VLAN with remediation access only",fb:"The laptop lands in the remediation network as designed.",ok:true},
  {t:"Grant full access — 'it is only the AV database'",fb:"An unpatched device joins production next to the payment system.",ok:false},
  {t:"Block the device permanently and report the user",fb:"Help desk flooded, user angry, and the device stays unhealthy forever.",ok:false}]},
 {sit:"While quarantined, the user must update AV and pull OS patches. Next decision:",opts:[
  {t:"Allow only the remediation servers from the quarantine VLAN",fb:"Updates flow; nothing else is reachable.",ok:true},
  {t:"Open the full network so work continues",fb:"Quarantine is now theatre — the control means nothing.",ok:false},
  {t:"Tell the user to borrow a colleague's laptop",fb:"Two users share one device; the sick laptop stays sick.",ok:false}]},
 {sit:"Updates finished. Final decision:",opts:[
  {t:"Re-run the posture assessment and release the laptop to its production VLAN",fb:"Posture passes; the device returns to the accounting VLAN.",ok:true},
  {t:"Leave it in quarantine for a week 'to be sure'",fb:"A healthy device sits idle; the user works from the lobby.",ok:false},
  {t:"Move it to the guest VLAN — same thing as production",fb:"The guest network strips access; accounting work stops.",ok:false}]}]}},
{id:"M21",type:"qcm",title:"First move on a suspicious Office alert",th:["edr"],pts:6,
scen:"<p>EDR raises a critical alert on acct-laptop-03: WINWORD.EXE spawned powershell.exe with an -enc (Base64) command; a new scheduled task 'SysUpdate' was created; the host tried to connect to 185[.]199[.]108[.]153 on TCP/443. The user is in a meeting.</p>",
q:"<p>What is your first action?</p>",
hint:"What stops the damage right now, without waiting for the user to answer?",
exp:"<p>The behavior chain (Office → encoded PowerShell → persistence → outbound connection) is a textbook malicious document. The first move is <b>containment with EDR host isolation</b> — it cuts the host off the network in seconds while keeping your control channel alive, and then you investigate the process tree in peace. Allowing the destination, rebooting (which wipes valuable memory evidence), or waiting for the user all give the intrusion time to move.</p>",
data:{opts:[
 {t:"Isolate the host with EDR, then investigate the process tree"},
 {t:"Add a firewall rule to allow the destination for later analysis"},
 {t:"Restart the laptop so the malicious task stops"},
 {t:"Email the user and wait for her to confirm the document"}],a:0}},
{id:"M22",type:"lq",title:"Read the EDR process tree",th:["edr","proc"],pts:6,
scen:"<p>Before you can close the alert from acct-laptop-03, the incident manager wants the root cause chain and the indicators to hunt. Filter the EDR timeline below if you need to.</p>",
q:"<p>What is the correct root cause chain — and what should you hunt across the estate?</p>",
hint:"Read parent → child from the top. Where did it all start, and what artefacts can you search for on every other host?",
exp:"<p>The chain starts with the <b>document</b> (Q3-invoice.xlsb): Word spawned encoded PowerShell, which created the scheduled task and ran the script from the user profile — then called out. The <b>behavior-based</b> detection fired on that whole sequence, not on one signature. So: malicious macro document → PowerShell → scheduled task persistence. The huntable <b>indicators of compromise (IOCs)</b> are the <b>file update.vbs</b>, the <b>-enc command line</b> and the scheduled task name — that is threat hunting with EDR: search every endpoint for those artefacts. 'PowerShell broke Word' and 'Windows maintenance task' misread the parent-child direction, and nobody typed those commands by hand.</p>",
data:{lines:[
 ["m","EDR timeline — acct-laptop-03 — 14:02:11 → 14:02:40"],
 ["g","14:02:11  explorer.exe (pid 4108)  user dana.k opens Q3-invoice.xlsb"],
 ["k","14:02:19  WINWORD.EXE (pid 5211)  parent=explorer.exe"],
 ["e","14:02:21  WINWORD.EXE → powershell.exe -nop -w hidden -enc SQBFAF..."],
 ["k","14:02:24  powershell.exe (pid 6322) → schtasks.exe /create SysUpdate"],
 ["w","14:02:25  schtasks.exe → wscript.exe C:\\Users\\dana.k\\AppData\\update.vbs"],
 ["e","14:02:40  wscript.exe → connect 185[.]199[.]108[.]153:443  (blocked by policy)"],
 ["m","14:02:41  detection: behavior 'office-spawned-script' severity=critical"]],
 inner:{opts:[
  {t:"Malicious macro document → PowerShell → scheduled task; hunt update.vbs and the -enc command line"},
  {t:"A broken PowerShell update corrupted Word during patching, so reinstall Office on the host"},
  {t:"The user opened a terminal and typed the commands manually, one by one"},
  {t:"The scheduled task is normal Windows maintenance that fires on every boot"}],a:0}}},
{id:"M23",type:"match",title:"EDR, XDR, MDR, SOAR",th:["edr"],pts:8,
scen:"<p>The CISO's quarterly review uses four acronyms that everyone mixes up. You get to define them once, correctly.</p>",
q:"<p>Match each term to the sentence that defines it.</p>",
hint:"One is endpoint-only, one crosses products, one is a team-for-hire, one is automation of playbooks.",
exp:"<p><b>EDR</b> is continuous monitoring of endpoints: it collects telemetry (processes, files, network) and lets you detect, investigate and respond on laptops and servers — far beyond signature-based anti-malware, which is the whole EDR vs anti-malware difference. <b>XDR</b> extends that across products: endpoint plus network, identity, email and cloud signals correlated in one place. <b>MDR</b> is a service: a provider's analyst team watches and responds for you around the clock. <b>SOAR playbooks</b> are the automation layer: they pull alerts, enrich them and run response steps without a human for the routine parts.</p>",
data:{pairs:[
 {l:"EDR",r:"Endpoint telemetry with detection and response on laptops and servers"},
 {l:"XDR",r:"Correlates endpoint, network, identity and cloud signals in one place"},
 {l:"MDR",r:"A vendor team monitors and responds for you around the clock"},
 {l:"SOAR",r:"Playbooks that automate repeated response steps"}]}},
{id:"M24",type:"multi",title:"What does XDR add over EDR?",th:["edr","fw","dns"],pts:8,
scen:"<p>Your EDR rollout succeeded. In the steering meeting, the architecture board asks what an XDR upgrade would actually add before they budget for it.</p>",
q:"<p>Select the <b>four</b> signal sources XDR adds beyond classic EDR.</p>",
hint:"XDR crosses tool borders: network boxes, identity systems, cloud workloads, email and SaaS.",
exp:"<p>XDR's whole point is correlation beyond the endpoint: <b>network and firewall telemetry</b>, <b>identity and sign-in events</b>, <b>cloud workload logs</b>, and <b>email/SaaS security events</b> feed the same detection engine, so 'impossible login + unusual file copy + new inbox rule' becomes one story instead of three alerts. XDR does not replace firewalls (it consumes their signals), and nothing replaces patching.</p>",
data:{opts:[
 {t:"Network and firewall telemetry",c:true},
 {t:"Identity and sign-in events",c:true},
 {t:"Cloud workload logs",c:true},
 {t:"Email and SaaS security events",c:true},
 {t:"It replaces the need for a firewall",c:false},
 {t:"It removes the need for patching",c:false}]}}
,

{id:"M26",type:"rank",title:"Order the morning queue",th:["ips","edr","dns","proc"],pts:10,
scen:"<p>Monday 08:00. Five items wait in the queue and two analysts are free until 10:00. The on-call lead asks for an ordering before anyone touches a ticket.</p>",
q:"<p>Rank the items: 2 belong in 'Act now', 2 in 'Same shift', 1 is 'Routine'.</p>",
hint:"Data destruction and an active attacker outrank everything. Your own scanner making noise is last.",
exp:"<p><b>Act now:</b> ransomware encrypting a file server destroys data by the minute, and an internal host beaconing to a known C2 means an active intruder — both get immediate containment. <b>Same shift:</b> SSH brute force against the VPN gateway is contained by drops but needs a block and a log review, and a blocked phishing domain for one user needs a quick check that nobody clicked. <b>Routine:</b> alerts fired by your own vulnerability scanner are known-benign — tune them, do not chase them. Alert prioritization is a <b>business-impact judgment</b>: impact and urgency decide, not the order alerts arrived.</p>",
data:{items:[

 "Firewall: internal host beaconing to known C2 45.33.32[.]156",

{id:"M27",type:"fill",title:"NAC policy sentence",th:["nac"],pts:8,
scen:"<p>The network team writes the NAC section of the new network security standard. One sentence must name the protocol, the server, the health check and the holding network.</p>",
q:"<p>Complete the standard with the terms from the bank.</p>",
hint:"The port protocol, the server that answers yes or no, the health check, the waiting room.",
exp:"<p>Access switches enforce <b>802.1X</b> — the port-based authentication protocol. The <b>RADIUS</b> server is the authentication server that validates the credentials or certificate and answers accept or reject. The <b>posture assessment</b> is the health check (AV, patches, encryption). Devices that fail land in the <b>quarantine VLAN</b> until remediated. WPA3 is Wi-Fi encryption, DNSSEC protects name resolution, DMARC is email anti-spoofing, and a sinkhole is a DNS control — none of them grant or deny LAN admission.</p>",
data:{text:"Company standard: all access switches enforce {0} with {1} as the authentication server. Devices that fail the {2} are placed in the {3} until they are remediated.",

exp:[0,1,2,3]}},
{id:"M28",type:"cat",title:"Detection or prevention?",th:["fw","ips","dns","dlp","edr"],pts:10,
scen:"<p>During the architecture review, the CISO asks a simple question about every control in the stack: does it <b>stop</b> the bad thing by itself, or does it <b>tell us</b> about it?</p>",
q:"<p>Drag each control to the right column.</p>",
hint:"Ask: can this control end the malicious action on its own, right now, without a human?",
exp:"<p><b>Detection</b> controls watch and alert: a NIDS on a SPAN port (it cannot block — it sees a copy), DLP in monitor mode (measures, does not stop), and an NGFW raising a syslog alert about a port scan while allowing the traffic. A HIDS file-integrity alert also only tells you something changed. <b>Prevention</b> controls act: an IPS dropping packets inline, a DNS filter refusing to resolve a phishing domain, EDR auto-isolating a host on high-confidence ransomware behavior, and the firewall's deny rule dropping packets by ACL. The same product can play both roles depending on mode — mode decides, marketing does not.</p>",
data:{buckets:[{k:"det",label:"Detection (alerts, does not block)"},{k:"prev",label:"Prevention (blocks in real time)"}],
items:[
 {t:"NIDS raising an alert from a SPAN-port copy",k:"det"},
 {t:"IPS dropping a malicious packet inline",k:"prev"},
 {t:"DNS filter refusing to resolve a phishing domain",k:"prev"},
 {t:"DLP in monitor mode reporting a policy hit",k:"det"},
 {t:"EDR auto-isolating a host on high-confidence ransomware behavior",k:"prev"},
 {t:"NGFW sending a syslog alert about a port scan",k:"det"},
 {t:"HIDS file-integrity alert on a server",k:"det"},
 {t:"Firewall ACL dropping denied traffic",k:"prev"}]}},
{id:"M29",type:"term",title:"Terminal: find the TXT chatter",th:["dns","proc"],pts:6,
scen:"<p>You are on the DNS management box. The query log is /var/log/dns/queries.log with layout <b>&lt;ts&gt; &lt;client&gt; &lt;qtype&gt; &lt;qname&gt;</b>.</p>",

exp:"<p>The expected command is <b>grep TXT /var/log/dns/queries.log</b> (case-insensitive grep -i txt is also fine). Filtering by record type is the first step of a tunnel hunt: TXT queries are rare in normal enterprise traffic, so the lines that survive the filter are your shortlist for volume analysis per client.</p>",

{id:"M30",type:"qcm",title:"NGFW, UTM or both?",th:["fw"],pts:6,
scen:"<p>A company with 800 users and a 10 Gbps data centre wants application-aware control, TLS inspection and IPS at the perimeter. Its 12 branch offices each have 10–20 users and a single small box, managed by nobody local.</p>",
q:"<p>Which placement fits the enterprise best?</p>",
hint:"Performance and rich inspection where the traffic is heavy; simplicity where nobody will tune it.",
exp:"<p>The data centre perimeter needs <b>NGFW</b> capability: high throughput, application awareness, TLS inspection and integrated IPS. Branch offices with no local admin are the textbook case for <b>UTM</b> — one appliance that bundles firewall, IPS, antivirus and web filtering and is simple to manage centrally. Using UTM at a 10 Gbps core kills performance; using NGFW in an unmanaged branch wastes its capability; a plain packet-filtering router has neither.</p>",
data:{opts:[
 {t:"NGFW at the data centre perimeter; UTM appliances at the branches"},
 {t:"UTM appliances everywhere — NGFW capability is only for home users"},
 {t:"NGFW only at the branches, nothing at the data centre"},
 {t:"Packet-filtering router at the perimeter; UTM at the data centre"}],a:0}}
];

  h+='<div class="btnrow center"><button class="btn primary" id="retakebtn" style="min-width:220px">↺ Retake exam (reshuffled)</button></div></div>';
  if(skiplist.length||unlist.length){
    h+='<div class="skipnote"><b>Excluded from scoring ('+(skiplist.length+unlist.length)+'):</b> '+(skiplist.concat(unlist)).map(esc).join(' · ')+'.<br>These were skipped or left unanswered. Their points are removed from both your score and the total possible.</div>';
  }
  h+='<div class="card"><h2 style="font-size:18px;margin:0 0 8px">Detailed report</h2><div style="overflow-x:auto"><table class="rep"><thead><tr><th>#</th><th>Exercise</th><th>Result</th><th>Points</th><th>Your answer</th><th>Correct answer</th><th>Explanation</th></tr></thead><tbody>';
  rep.forEach(function(r){
    var st=r.st;
    h+='<tr><td>'+r.n+'</td><td>'+esc(r.ex.title)+'<br><span style="color:var(--mut);font-size:12px">'+esc(TYPELBL[r.ex.type]||r.ex.type)+'</span></td>'+
    '<td><span class="lab '+r.label+'">'+(r.label==='skipped'?(st.skipped?'SKIPPED':'NOT ANSWERED'):r.label.toUpperCase())+'</span></td>'+
    '<td>'+(r.cnt?fmtP(st.earned)+' / '+fmtP(st.max):'—')+'</td>'+
    '<td style="max-width:220px">'+(r.cnt?esc(st.your):'<span style="color:var(--mut)">not counted</span>')+'</td>'+
    '<td style="max-width:220px">'+(r.cnt?esc(r.ex.ansShort||st.corr):'—')+'</td>'+
    '<td style="max-width:420px"><details><summary>Show explanation</summary><div style="margin-top:6px">'+r.ex.exp+'</div></details></td></tr>';
  });
  h+='</tbody></table></div></div>';
  var res=$('#results');res.innerHTML=h;res.hidden=false;$('#exam').hidden=true;
  $('#retakebtn').addEventListener('click',startExam);
  $('#pausebtn').disabled=true;
  renderHeader();
  window.scrollTo({top:0,behavior:'smooth'});
  if(!S.reported&&maxT>0){
    S.reported=true;
    var correct=Math.round(earned),total=Math.round(maxT);
    try{parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,score:correct,total:total,percent:percent,passed:percent>=META.passMark},location.origin);}catch(e){}
  }
}
/* opening-in-iframe safety: allow modal close by backdrop or Escape */
document.addEventListener('click',function(e){if(e.target&&e.target.id==='ovl')closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#ovl').classList.contains('on'))closeModal();});

</script>
