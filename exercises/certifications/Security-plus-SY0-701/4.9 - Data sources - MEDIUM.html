.slotrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}

.zone{border:1px dashed var(--line2);border-radius:12px;padding:10px;margin:10px 0;background:var(--deep);min-height:76px}
.zone.dragover{border-color:var(--acc);background:#101d33}
.zone-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.zone-t{font-weight:700;font-size:15px;color:var(--acc)}

.pool-lbl{font-size:13px;font-weight:700;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em;margin-top:10px}
/* order / rank rows */
.orow{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:6px 8px;margin:8px 0;min-height:48px}
.orow.dragging{opacity:.4}
.orow .olabel{flex:1;font-size:15px}
.orow .o-n{font-family:var(--mono);color:var(--dim2);font-size:13px;width:22px;text-align:center}
.mini{min-height:44px;min-width:44px;padding:4px 8px;font-size:15px;border-radius:8px}
.handle{cursor:grab;color:var(--dim2);font-size:16px;padding:0 4px;user-select:none}
/* blank sentence */
.sentence{font-size:16px;line-height:2.1}
.gap{display:inline-block;min-width:110px;min-height:44px;border:1px dashed var(--line2);border-radius:8px;background:var(--deep);cursor:pointer;vertical-align:middle;padding:2px 10px;color:var(--dim2);font-size:14.5px;text-align:center}
.gap.filled{border-style:solid;color:var(--tx)}
/* terminal */
.term{background:#04070d;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:14px}
.term-out{white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:#c9e3d1;margin:0 0 8px}
.term-in{display:flex;gap:8px;align-items:center}
.term-ps{color:var(--ok);font-family:var(--mono);font-size:14px;white-space:nowrap}
.term-in input{flex:1;background:var(--deep);border:1px solid var(--line2);border-radius:8px;color:var(--tx);font-family:var(--mono);font-size:14px;min-height:44px;padding:6px 12px}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.lv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}

.lv-count{font-size:13px;color:var(--dim);font-family:var(--mono)}
.lv-wrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--deep)}
/* branch */
.bstep{border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:10px 12px;margin:8px 0}
.bstep .bs-t{font-weight:700;color:var(--acc);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.bfb{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}

/* spot the mistake */
.sline{display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;min-height:44px;padding:7px 10px;margin:4px 0;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;font-family:var(--mono);font-size:14px}
.sline:hover{border-color:var(--line2);background:var(--panel)}
.sline[aria-pressed="true"]{border-color:var(--acc);background:#14243f}
/* actions / feedback */
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.notice{color:var(--warn);font-size:14.5px;min-height:6px;margin:6px 0;font-weight:600}
.fb{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--panel)}
.fb .fb-line{font-weight:700;font-size:15.5px}
.fb .fb-line.ok{color:var(--ok)}.fb .fb-line.part{color:var(--warn)}.fb .fb-line.zero{color:var(--bad)}
.hintbox{border:1px solid var(--warn);background:var(--warnd);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.expl{border:1px solid var(--line2);border-left:4px solid var(--ok);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--panel2);font-size:15.5px}
.expl .ex-t{font-weight:800;color:var(--ok);text-transform:uppercase;font-size:12.5px;letter-spacing:.1em;margin-bottom:4px}
.expl .focus{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);color:var(--dim)}
/* mask */
#ex-wrap{position:relative}
.mask{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(6,10,19,.55);border-radius:14px}
.mask>div{background:var(--panel);border:1px solid var(--warn);color:var(--warn);font-weight:800;border-radius:14px;padding:22px 30px;text-align:center;font-size:17px}
.mask span{display:block;font-weight:400;color:var(--dim);font-size:14px;margin-top:6px}
.blurred>*{filter:blur(9px);pointer-events:none;user-select:none}
.bottnav{display:flex;justify-content:space-between;gap:10px;margin:16px 0 8px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,7,13,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-p{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:520px;width:100%;padding:20px}
.modal-b{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
/* results */
.res-hero{border-radius:14px;padding:22px;text-align:center;border:1px solid var(--line2);background:var(--panel)}
.res-hero.pass{border-color:var(--ok);background:linear-gradient(180deg,var(--okd),var(--panel))}
.res-hero.fail{border-color:var(--bad);background:linear-gradient(180deg,var(--badd),var(--panel))}
.res-hero .big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
.res-hero .verdict{font-size:20px;font-weight:800;letter-spacing:.08em}
.res-hero.pass .verdict{color:var(--ok)}
.res-hero.fail .verdict{color:var(--bad)}
.res-sum{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
table.rep{width:100%;border-collapse:collapse;margin-top:12px;font-size:14.5px}
table.rep th,table.rep td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rep th{background:var(--panel2);font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
td .lab{font-weight:800;white-space:nowrap}
td .lab.full{color:var(--ok)}td .lab.partial{color:var(--warn)}td .lab.zero{color:var(--bad)}td .lab.skipped{color:var(--warn)}
.det{margin-top:8px;border-top:1px dashed var(--line2);padding-top:8px;color:var(--dim)}
.det b{color:var(--tx)}
/* responsive */
@media (max-width:720px){
  body{padding:10px 8px 50px}
  .card{padding:14px}
  .slot-l{max-width:100%}
  .h-title{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>

var THEMES = [

sc:'You are the Monday-morning analyst at <b>Meridian Health Group</b>. The SIEM queue has collected alerts overnight from every sensor. Before you can investigate, you must decide <b>which data source holds the evidence</b> for each alert — that is where you will look first.',
artLabel:'OVERNIGHT ALERT QUEUE',
art:'A1 &nbsp;Outbound 10[.]20[.]31[.]44 → 203[.]0[.]113[.]9:4444 — ALLOW, 40 attempts in 10 min<br>A2 &nbsp;12 NXDOMAIN replies for random subdomains of hr-portal[.]meridian-hh[.]example<br>A3 &nbsp;Event 4625 ×52 in 4 min for user svc_backup on FS-01<br>A4 &nbsp;EDR: lsass.exe launched from C:\\Users\\public\\temp\\ on WKS-112<br>A5 &nbsp;TLS session to rare ASN, 2.1 GB outbound from WKS-045<br>A6 &nbsp;Queries for 6f2a1[.]pay[.]cnc[.]evil[.]example every 30 s<br>A7 &nbsp;Event 4648 (explicit-credential logon) burst on DC-02<br>A8 &nbsp;EDR: powershell.exe -enc child of winword.exe on WKS-112',
q:'Drag each alert into the data source you would open <b>first</b> to investigate it.',
d:{
zones:[{id:'fw',label:'Firewall log'},{id:'dns',label:'DNS log'},{id:'auth',label:'Authentication log'},{id:'ep',label:'Endpoint log'}],
items:[
 {id:'i1',label:'A1 blocked outbound 4444 ×40',zone:'fw'},
 {id:'i2',label:'A2 NXDOMAIN random subdomains',zone:'dns'},
 {id:'i3',label:'A3 4625 storm for svc_backup',zone:'auth'},
 {id:'i4',label:'A4 lsass.exe from temp folder',zone:'ep'},
 {id:'i5',label:'A5 2.1 GB TLS to rare ASN',zone:'fw'},
 {id:'i6',label:'A6 periodic queries to cnc domain',zone:'dns'},
 {id:'i7',label:'A7 4648 burst on DC-02',zone:'auth'},
 {id:'i8',label:'A8 encoded PowerShell from Word',zone:'ep'}
]},
h:'Ask yourself: where is this event <i>recorded</i>? Connections are logged where they cross a control point; logons live with the identity system; process behaviour lives on the host.',
ex:'Routing an alert to the right source is step one of every investigation. Firewall logs record connections that cross the network edge — blocked attempts and large outbound transfers both appear there. DNS logs record every name lookup, so odd subdomains and beacon-like periodic queries live there. Authentication logs hold logon events (4625 failed, 4648 explicit credential). Endpoint logs (EDR) hold process behaviour such as lsass.exe launched from a temp folder or an encoded PowerShell command. Picking the wrong source wastes the first, most valuable minutes of an incident.',
fx:'Practise asking "which sensor saw this?" for every alert type: network events → firewall/DNS/flow data; identity events → authentication logs; process events → endpoint/EDR logs.'
});

EX.push({
t:'terminal', ti:'Shell work: measure the failed-login storm', th:'Log data & log types',
k:['Authentication logs','Syslog','Event/action codes','Usernames & accounts'], p:3,
sc:'The auth.log on the SIEM jump host has captured last night\u2019s noise. Work in the shell below. The log uses syslog format with failed-password lines for SSH.',
artLabel:'TERMINAL BRIEFING',
art:'File available in the working directory: <code>auth.log</code><br>Sample of its lines:<br><code>Mar 4 08:43:19 fs01 sshd[2210]: Failed password for svc_backup from 198[.]51[.]100[.]23 port 40024 ssh2</code><br><code>Mar 4 08:44:02 fs01 sshd[2214]: Failed password for root from 198[.]51[.]100[.]23 port 40044 ssh2</code>',
q:'Two tasks: <b>(1)</b> count the Failed-password lines for source 198[.]51[.]100[.]23, <b>(2)</b> list the usernames the attacker tried.',
d:{
boot:'analyst@soc-jump:~$ ls\nauth.log\nanalyst@soc-jump:~$ _',
ls:'auth.log',
prompt:'analyst@soc-jump:~$',
help:'Allowed tools: grep, awk, cut, sort, uniq, wc. Tip: grep -c counts lines. Pipe to awk or cut to pull a field, then sort -u to make it unique.',
goals:[
 {re:'grep\\s+[^;|]*-c[^;|]*auth\\.log', label:'Count failed-password lines in auth.log with grep -c'},
 {re:'(awk|cut|sed|grep\\s+-o)[^\\n]*auth\\.log|auth\\.log[^\\n]*(awk|cut|sed|grep\\s+-o)', label:'Extract the tried usernames from auth.log'}
],
show:[
 {when:'grep\\s+[^|;]*-c', out:'23'},
 {when:'grep.*auth\\.log', out:'Mar 4 08:43:19 fs01 sshd[2210]: Failed password for svc_backup from 198[.]51[.]100[.]23 port 40024 ssh2\nMar 4 08:44:02 fs01 sshd[2214]: Failed password for root from 198[.]51[.]100[.]23 port 40044 ssh2\nMar 4 08:47:44 fs01 sshd[2288]: Failed password for admin from 198[.]51[.]100[.]23 port 40190 ssh2\nMar 4 09:01:12 fs01 sshd[2340]: Failed password for svc_backup from 198[.]51[.]100[.]23 port 40500 ssh2\nMar 4 09:05:40 fs01 sshd[2361]: Failed password for postgres from 198[.]51[.]100[.]23 port 40601 ssh2'},
 {when:'(awk|cut|sed|grep\\s+-o).*', out:'svc_backup\nroot\nadmin\npostgres'}
],
example:'grep -c "Failed password" auth.log ; grep "Failed password" auth.log | awk "{print $11}" | sort -u'},
h:'Use <code>grep -c "Failed password" auth.log</code> for the count. For usernames: grep the same lines and pipe to <code>awk</code> or <code>cut</code>, then <code>sort -u</code>.',
ex:'This is the classic first command pair of a Linux investigation. <code>grep -c</code> prints only a count of matching lines, which answers "how loud was the noise?". Pulling the username field (the 11th word on these lines) and running <code>sort -u</code> answers "which accounts were targeted?" — the list tells you whose passwords to reset. Authentication logs like this arrive through syslog and are the main evidence of credential attacks on Linux hosts; on Windows the same story is told by event 4625.',
fx:'Drill the pipeline pattern: grep to select lines → awk/cut to pick the field → sort/uniq to summarize. It works on almost every text log.'
});

EX.push({
t:'blank', ti:'Syslog message anatomy', th:'Log data & log types',
k:['Syslog','Severity levels','Event/action codes'], p:2,
sc:'A junior analyst asks you to explain a syslog line from the core router that the SIEM just parsed. Complete the explanation by filling the gaps.',
q:'Fill each gap with a word from the bank.',
d:{
text:'Most Linux servers and network devices send events to the SIEM with {{0}} over UDP port {{1}}. In a message named local0.{{2}}, the first part (local0) names the {{3}} that produced the message, and the last part gives its {{4}}.',
bank:['syslog','514','notice','facility','severity','22','TCP','timestamp','firewall','4625'],
accepted:[['syslog'],['514'],['notice','info','informational'],['facility'],['severity','priority']]},
h:'The transport is UDP and the port number is famous. The word after the dot in local0.notice is a level, the word before it says <i>who</i> spoke.',
ex:'Syslog is the standard way network gear and Linux hosts ship logs. It uses UDP port 514 (plain syslog) — TCP 514 exists as syslog-tls, but the classic send is UDP. A name like local0.notice has two halves: the facility (which subsystem sent it: local0, auth, cron, kernel…) and the severity (how bad it is: emergency, alert, critical, error, warning, notice, informational, debug). Knowing both lets analysts filter a firehose of messages down to the few that matter.',
fx:'Memorize the 8 syslog severities in order — exams love asking which is higher, and SIEM dashboards group by them.'
});

EX.push({
t:'match', ti:'Read the artifact: name the technique', th:'Log data & log types',
k:['Application logs','DNS logs','Authentication logs','Endpoint logs','Firewall logs','IDS/IPS logs'], p:4,
sc:'Six artifacts landed in the case folder from different sensors. Match each artifact to the technique it most likely shows. This is the core daily skill: turning a raw line into a named behaviour.',
q:'Place the technique chip next to the artifact it describes.',
d:{
left:[
 'App log: <code>GET /search?q=\u0027 OR 1=1 --</code> repeated from one IP',
 'DNS log: TXT query for <code>8f3a91.tun[.]evil[.]example</code>, 4 more like it per minute',
 'Auth log: 120 × event 4625 for svc_backup within 3 minutes, then 1 × 4624',
 'EDR: <code>powershell -enc SQBFAFgA…</code> spawned by winword.exe',
 'Firewall: 400 DENY entries to 10[.]20[.]30[.]15:22 from one external IP',
 'IDS alert: signature WEB-ATTACK "union select" on VLAN 20'
],
right:['SQL injection attempt','DNS tunneling','Password guessing that may have succeeded','Obfuscated script execution','Brute-force attempt still blocked','Known-attack signature detection'],
correct:[0,1,2,3,4,5],
plainNote:''},
h:'Look at the channel: quotes inside a URL = injection; long random labels in TXT queries = tunneling; 4625 storms = password guessing; -enc PowerShell from Office = script execution.',
ex:'Each sensor tells one slice of the story. Quotes and OR 1=1 inside a URL are classic SQL injection in application logs. Long encoded labels in TXT records are DNS tunneling. A burst of failed logons (4625) followed by one success (4624) means the guessing probably worked — that pair is the single most valuable correlation in authentication logs. PowerShell with -enc started by Word is obfuscated script execution, a common macro-attack pattern. Steady DENYs to one port are a brute force that the firewall is still stopping, and an IDS signature hit is detection of a known attack pattern rather than a new one.',
fx:'Build a mental table: artifact → technique → next action. The 4625-then-4624 pair deserves special respect: treat it as a compromise until proven otherwise.'
});

sc:'EDR on finance-wks2 raised a medium alert: the process <code>update_helper.exe</code> resolves <code>cdn-sync[.]evil[.]example</code> every 60 seconds and opens a short TLS session. The EDR vendor calls it "likely C2". Your manager asks for network-side proof before isolating a finance workstation during month-end close.',

 'A packet capture on the egress link, filtered for that workstation',
 'The DHCP lease history for the workstation over the last week',
 'A new authenticated vulnerability scan of the workstation',

], correct:0},
h:'You need evidence of the traffic itself, captured outside the possibly-compromised host.',
ex:'A packet capture is independent evidence: it records the actual packets leaving the network, whatever the endpoint claims. A 60-second repeating TLS session to one rare domain, seen on the wire, confirms beaconing without trusting the possibly-compromised host. The DHCP list only maps names to addresses, a vulnerability scan describes missing patches (not live traffic), and the antivirus list is again endpoint-side data — the same machine you already distrust.',
fx:'When an endpoint alert needs confirmation, look for a source that saw the same event from a different vantage point — that is why packet captures and NetFlow exist.'

EX.push({
t:'order', ti:'Order the investigation: from alert to report', th:'Investigation integrity',
k:['Chain of custody','Hashing & log integrity','SIEM aggregation','Log normalization','Threat intelligence'], p:3,
sc:'A suspected data-theft case just opened. Your team lead pinned the process on the whiteboard but someone knocked the cards down. Rebuild the correct order of a clean, defensible investigation.',
q:'Put the five steps in the order a defensible investigation should follow.',
d:{
items:[
 'Collect the relevant logs and record where each one came from',
 'Hash the originals and store them read-only',
 'Normalize the formats and correlate the events into one timeline',
 'Enrich the timeline with threat-intelligence and asset data',
 'Write the report: findings, scope, and recommended actions'
],
order:[0,1,2,3,4]},
h:'Preserve before you analyze; analyze before you interpret; write last.',
ex:'A defensible investigation has a fixed backbone. Collection comes first — you cannot study what you did not save. Preservation (hashing, read-only storage) protects the evidence from change and lets anyone later prove it is intact; that is the chain-of-custody habit. Only then do you normalize the different log formats and correlate events into one timeline, enrich it with external context such as reputation data, and finally write the report. Doing analysis before preservation risks changing the very evidence you may need in court or in HR proceedings.',
fx:'The order collection → preserve → analyze → enrich → report appears in some form in almost every incident-handling framework. Lock it in.'
});

lines:[

 'set policy WEB-ALLOW action allow',
 'set policy WEB-ALLOW log disable',
 'set policy name DB-DENY src inside dst dmz 10[.]20[.]30[.]40 1433',
 'set policy DB-DENY action deny',

h:'The gap concerns <i>allowed</i> traffic, so look at what the allow rule records.',
ex:'The WEB-ALLOW rule has logging disabled, so every connection it permits produces no firewall log at all. During the incident the team could see denied noise but nothing about the attacker\u2019s successful sessions, which is exactly the part that matters. Best practice is to log allow rules on perimeter and segment edges and keep default-deny logging on as well. The deny rules here are logged correctly — the blind spot is only the permitted path.',
fx:'Auditing firewall configs: for every allow rule ask "if an attacker used this path, would I have a record?" If the answer is no, that is a finding.'

EX.push({

sc:'02:31 UTC, cloud console audit log: principal <code>deploy-ci</code> (a CI/CD role) performed <code>AssumeRole</code> from 198[.]51[.]100[.]77 — an address that never touches this account. The role then listed storage buckets. You have 10 minutes to pick the data sources for the first evidence pull.',

ex:'Cloud audit logs are often regional — an attacker can act in a quiet region while you stare at the busy one, so pull every region. The SSO/identity logs show whether any real user session was hijacked to reach the role, which changes containment completely. A reputation check on the source address gives fast, free context: known VPN exit, known scanner, or clean. A vulnerability scan describes software flaws, not this session\u2019s activity, and the office-LAN NetFlow never sees a cloud control-plane session, so it cannot help here.',

EX.push({
t:'qcm', ti:'Two clocks, one event — five hours apart', th:'Log attributes & time',
k:['Timestamps & time zones','NTP time sync','Correlation rules'], p:2,
sc:'You are building a timeline. DC-02 (database side) logged a service logon at <code>09:14:03</code>. The application server logged the very same session at <code>04:14:03</code>. Both servers claim their logs are UTC. The SIEM correlation rule refuses to join them into one incident.',
q:'What is the most likely explanation for the five-hour gap?',
d:{opts:[
 'A server ignores NTP, so its clock drifted from true time',
 'The same session really did happen twice, five hours apart',
 'The SIEM ingested and duplicated the same event twice',
 'Time zones stop mattering once the logs reach the SIEM'
], correct:0},
h:'Both servers <i>claim</i> UTC. If both were right, the gap could not exist.',
ex:'When two logs that both say UTC disagree by hours, a clock is lying — and the usual culprit is missing time synchronization. NTP keeps every host on the same time; a server without NTP drifts (or was set to the wrong local time but labelled UTC), which silently breaks correlation rules that match events by timestamp. This is why time sync is an exam favourite and a real audit finding: without it, your whole timeline is guesswork. Fix it by pointing every host at the same NTP source and normalizing all logs to UTC at the SIEM.',
fx:'First check for any timeline puzzle: are all sources truly synced (NTP) and truly in UTC? Most "impossible" timelines are clock problems.'
});

EX.push({
t:'logviewer', ti:'DNS log: tunneling or just noise?', th:'Log data & log types',
k:['DNS logs','Network traffic analysis','Indicators of compromise'], p:3,
sc:'The DNS server of <b>Meridian Health Group</b> forwards all queries to the SIEM. WKS-045 has been quiet all week — until tonight. Filter the log and decide what the pattern really is.',
q:'Select <b>every</b> statement that the log genuinely supports about DNS <b>tunneling</b>. Some patterns look suspicious but mean something else.',
d:{
logs:[
 '2025-03-04T22:00:01Z WKS-045 A www.meridian-hh[.]example NOERROR',
 '2025-03-04T22:00:11Z WKS-045 TXT 7f3a91b2c4.tun[.]evil[.]example NOERROR 233B',
 '2025-03-04T22:00:21Z WKS-045 TXT 9d2e11f7ab.tun[.]evil[.]example NOERROR 241B',
 '2025-03-04T22:00:31Z WKS-045 TXT 4c88ba01de.tun[.]evil[.]example NOERROR 238B',
 '2025-03-04T22:00:41Z WKS-045 TXT 5b9c02fa31.tun[.]evil[.]example NOERROR 244B',
 '2025-03-04T22:00:51Z WKS-045 TXT 8a1d77e402.tun[.]evil[.]example NOERROR 239B',
 '2025-03-04T22:01:01Z WKS-045 TXT 3e5f19c8a7.tun[.]evil[.]example NOERROR 240B',
 '2025-03-04T22:01:09Z WKS-112 A cdn-pull-2[.]meridian-cdn[.]example NOERROR',
 '2025-03-04T22:01:31Z WKS-045 TXT 6c2b04e9d1.tun[.]evil[.]example NOERROR 242B',
 '2025-03-04T22:01:52Z WKS-098 AAAA mail.google[.]example NOERROR',
 '2025-03-04T22:02:01Z WKS-045 TXT 1a7f33b5c9.tun[.]evil[.]example NOERROR 237B',
 '2025-03-04T22:02:03Z WKS-131 A sale-summer-2025[.]meridian-hh[.]example NXDOMAIN',
 '2025-03-04T22:02:31Z WKS-045 TXT 2d8e42a0f6.tun[.]evil[.]example NOERROR 243B'
],
a:{kind:'multi', opts:[
 'Long encoded labels under one domain, queried over and over — classic DNS tunneling',
 'The queries run like a clock: one TXT every 10 seconds — beacon-like regularity',
 'Large TXT answer sizes (~240 bytes) carrying data back to the client',
 'The NXDOMAIN for sale-summer-2025 proves tunneling is happening',
 'One A query for the CDN proves tunneling is happening'
], correct:[0,1,2]}},
h:'Tunneling = data hidden <i>inside</i> queries to one controlled domain. Random NXDOMAINs usually mean a different trick (DGA).',
ex:'Tunneling hides stolen data inside DNS queries: the malware chops its payload into labels (here ten-character blobs), sends them as TXT lookups to one domain it controls, and gets answers back — note the ~240-byte TXT replies, far larger than normal. The 10-second heartbeat is the malware\u2019s send loop. The NXDOMAIN for a typo-looking name is a different phenomenon (often DGA or a fat-fingered hostname), and a single CDN lookup is ordinary traffic — neither supports the tunneling story. TXT-heavy, label-heavy, clock-regular traffic to one odd domain is the tunneling signature.',
fx:'Three tunneling tells: odd long labels, TXT-record abuse, and machine-regular timing. Any one alone is weak; together they are proof.'
});

EX.push({
t:'match', ti:'Match the SIEM capability to what it does', th:'SIEM & automated reporting',
k:['SIEM aggregation','Correlation rules','Log normalization','Threat intelligence','Dashboards & automated reports','IP reputation & GeoIP'], p:4,
sc:'A vendor demo threw five buzzwords at your team. Cut through the marketing: match each SIEM capability to the concrete example of it at work.',
q:'Place each capability next to the example that describes it.',
d:{
left:[
 'A single search box finds Windows, Linux and firewall events together',
 'A rule links 5 failed logons followed by 1 success from the same IP in 10 minutes',
 'Every event, whatever its format, ends up with fields like user, src_ip, action',
 'Each event gains a country and a "known-malicious?" score for its source IP',
 'Every Monday 08:00 the CISO gets a PDF of the week\u2019s top alert trends'
],
right:['Aggregation','Correlation','Normalization','Enrichment','Automated reporting'],
correct:[0,1,2,3,4]},
h:'Where do logs live? Where do events get joined? Where do fields get tidy? Where does context get added? What arrives without anyone clicking?',
ex:'Aggregation is the collecting: logs from many systems land in one searchable store. Correlation is the joining: a rule connects related events (failed logons then a success) into one alert. Normalization is the tidying: different formats are parsed into one shared schema so the same query works everywhere. Enrichment is the context: each event gains outside facts such as GeoIP or reputation. Automated reporting is the delivery: scheduled reports and dashboards reach stakeholders without anyone clicking a button. A SIEM needs all five; missing one leaves a predictable hole in detection or reporting.',
fx:'If a SIEM misses enrichment, alerts are context-blind; misses normalization, searches break; misses correlation, attacks hide between logs.'
});

EX.push({
t:'branch', ti:'Beacon on finance-wks2: run the response', th:'Network data sources',
k:['Endpoint logs','DNS logs','Network traffic analysis','Chain of custody'], p:4,
sc:'You are on shift at <b>Meridian Health Group</b>. EDR flagged finance-wks2 beaconing every 60 seconds. It is month-end close, so the finance team is watching. Your choices decide how the incident unfolds.',
q:'Choose the best next action at each step.',
d:{steps:[
 {ctx:'EDR shows <code>update_helper.exe</code> on finance-wks2 reaching <code>cdn-sync[.]evil[.]example</code> every 60 s. Confidence: medium.',
  q:'What do you do first?',
  opts:[
   {t:'Pull 48 h of DNS, proxy and flow logs for that host to see when it started and what it touched', ok:true, fb:'Correct — you widen the picture with independent network sources before touching the host.'},
   {t:'Reboot the workstation immediately to wipe the malware', ok:false, fb:'A reboot destroys memory evidence and the beacon returns on start-up anyway.'},
   {t:'Reply to the user\u2019s old ticket asking whether they installed something', ok:false, fb:'Users rarely know; meanwhile the beacon keeps running and the trail cools.'}
  ]},
 {ctx:'The DNS log confirms TXT queries every 60 s to the low-reputation domain since 03:10, ~9 hours of beacons.',
  q:'Beacon confirmed. Next move?',
  opts:[
   {t:'Coordinate with the IR lead: capture volatile evidence, then isolate the host and block the domain', ok:true, fb:'Correct — preserve what only exists now (memory, live connections), then cut the attacker out.'},
   {t:'Delete the domain entries from the DNS log to silence the beacon', ok:false, fb:'Never edit evidence — it breaks integrity and the beacon is not in the log, it is on the host.'},
   {t:'Wait 48 hours to gather more beacons before acting', ok:false, fb:'The attacker may escalate at any moment; gathering already happened — 9 hours is plenty.'}
  ]},
 {ctx:'finance-wks2 is isolated; the domain is sinkholed. The user still needs to work for month-end close.',
  q:'Close the loop properly:',
  opts:[
   {t:'Save the EDR and network artifacts into the case folder with hashes, then reimage the host from a clean image', ok:true, fb:'Correct — evidence preserved with integrity, host rebuilt, business unblocked.'},
   {t:'Reimage right now and skip artifact capture to save time', ok:false, fb:'Without preserved evidence you cannot scope the incident or explain it to auditors.'},
   {t:'Post the user\u2019s credentials to the SOC mailing list for review', ok:false, fb:'Sharing credentials is a security violation in itself — rotate them through the proper process instead.'}
  ]}
]},
h:'The pattern: corroborate with a second source → preserve volatile evidence → contain → document. Nothing destructive before preservation.',
ex:'Good incident handling follows the same rhythm every time. First corroborate with an independent source so one alert does not drive a business-breaking decision. When the beacon is confirmed, preserve the evidence that dies first — memory and live connections — and only then contain by isolating the host and blocking the domain. Finally, package artifacts with hashes so the case file is complete, and reimage to return the host to service. Every wrong branch here either destroyed evidence, edited logs, or wasted hours the attacker could use.',
fx:'Rehearse the order out loud: corroborate → preserve → contain → document → recover. Under pressure, follow the order you practised.'
});

EX.push({
t:'blank', ti:'Build the tcpdump command', th:'Network data sources',
k:['Packet captures','tcpdump / Wireshark','Network logs'], p:3,
sc:'You are on the SIEM jump host and need a packet capture of DNS traffic for the finance-wks2 investigation. Complete the command from memory — the exam room has no internet.',
q:'Fill the gaps to complete the commands.',
d:{
text:'To watch DNS traffic live on interface eth0: <code>tcpdump {{0}} eth0 {{1}} 53</code>. To save the capture to a file instead of printing it, add: <code>tcpdump -i eth0 {{2}} /tmp/dns.pcap</code> (combined with the port filter). To read that file back later, you would use <code>-r</code> instead.',
bank:['-i','port','-w','-r','host','22','-nn'],
accepted:[['-i','-i'],['port','port 53'],['-w']]},
h:'-i picks the interface, the DNS port is famous, and -w writes to a file (-r reads).',
ex:'tcpdump is the default capture tool on almost every Linux box. The <code>-i</code> flag chooses the interface (eth0 here). The filter <code>port 53</code> keeps only DNS packets — filters make captures small and readable. <code>-w</code> writes raw packets to a file for later analysis (Wireshark or tcpdump -r), while printing to the screen is for quick looks. The other flags: -r reads a file back, host filters by address, -nn skips name resolution so you see raw numbers — useful, but not what these gaps ask for.',
fx:'Say the command out loud until it is muscle memory: tcpdump -i eth0 port 53 -w file.pcap. Captures belong in investigations almost every week.'
});

sc:'Five alerts arrived during a busy shift at <b>Meridian Health Group</b>. You can only work one at a time. Rank them from most urgent to least urgent, considering asset value, evidence of success, and blast radius.',
q:'Rank the alerts from MOST urgent (top) to LEAST urgent (bottom).',
d:{
items:[
 'EDR: credential-dump tool signature fired on domain controller DC-02',
 'Auth: 3 failed logons then a success for j.smith from a country he never works from',
 'App: 404 burst from a known scanner hitting the dev website',
 'Firewall: one blocked telnet attempt from an external address',
 'DNS: a single NXDOMAIN for a misspelled internal hostname'
],
order:[0,1,2,3,4]},
h:'Highest value asset + tool built for stealing credentials = drop everything. One blocked probe with no follow-up is the safest to leave.',
ex:'Triage balances impact and evidence of success. A credential-dump signature on a domain controller is close to game over — every account in the domain is at risk — so it goes first. Failed logons followed by a success from a new country is the classic takeover pattern, and identity is the attacker\u2019s master key: second. A scanner\u2019s 404 burst on a dev box is noise with low impact: third. One blocked telnet attempt shows control working: fourth. A single NXDOMAIN typo is daily life in DNS logs: last. Ranking is a skill the exams test with scenarios exactly like this.',
fx:'Ask three questions per alert: how valuable is the asset? did anything succeed? how wide could it spread? Then rank.'

ex:'WHOIS is the public registration record of a domain: registrant (often privacy-shielded), registrar, creation and expiry dates. A domain registered days ago and never seen before is a strong phishing signal — the creation date alone upgrades the incident. The other sources describe your own estate (DHCP, NetFlow, antivirus) and cannot tell you anything about who owns a domain you do not control. WHOIS lookups are passive OSINT: they do not touch the attacker\u2019s infrastructure, so they do not tip anyone off.',

EX.push({
t:'multi', ti:'Exposure or exploitation? Pick the proof', th:'Vulnerability & scan data',
k:['Vulnerability scans','CVE / CVSS context','Scan-to-exploit correlation','IDS/IPS logs','Application logs','Endpoint logs'], p:3,
sc:'Last week\u2019s authenticated scan flagged the file-transfer server for a known remote-code-execution CVE with a high CVSS score. This morning the IDS fired three signatures matching exactly that CVE against the same server. Your manager asks: "was it actually exploited, or are we just exposed?"',
q:'Select <b>every</b> data source that shows <b>actual exploitation</b> (not just exposure).',
d:{opts:[
 'IDS logs: three signature hits matching the CVE payload against the server',
 'Application log: POST requests containing the exploit\u2019s distinctive pattern',
 'Endpoint log: a new unexpected process spawned by the file-transfer service',
 'The vulnerability scan report from last week',
 'The asset inventory entry for the server'
], correct:[0,1,2]},
h:'Exposure says "the door is unlocked". Exploitation says "someone walked through". Which sources watch the door?',
ex:'A scan tells you the flaw exists — exposure. It cannot tell you the flaw was used. Exploitation leaves live traces: an IDS signature matching the attack payload, exploit patterns in the application\u2019s own request log, and a service that suddenly spawns strange child processes on the endpoint. Those three together form a scan-to-exploit correlation, and they upgrade the ticket from "patch this" to "investigate a break-in". The scan report and the asset inventory only describe state; they never witness behaviour.',
fx:'Scan = potential. Log of behaviour = actual. When a CVE alert lands, immediately hunt for behavioural evidence around the same host and date.'
});

EX.push({
t:'qcm', ti:'The logs are gone: what failed?', th:'Investigation integrity',
k:['Log retention'], p:2,
sc:'An employee is accused of leaking contracts eight months ago. Legal asks the SOC for proxy and mail logs from that period. The SIEM answers: the oldest data on disk is <b>90 days</b> old. The investigation is dead before it starts.',
q:'Which control failure caused this?',
d:{opts:[
 'The retention policy was too short for legal and investigative needs',
 'A hard-drive failure in the SIEM last week wiped the older archive',
 'Hashing was never enabled, so the logs silently aged out and expired',
 'The logs still exist, but a time-zone setting hides them from search'
], correct:0},
h:'The data is simply not there anymore — someone decided how long to keep it.',
ex:'Retention defines how long logs are kept before deletion. A 90-day window is common for cost reasons, but it must match business and legal needs: investigations, disputes and audits routinely reach back months or years. Once retention has deleted data, no tool recovers it — this is a policy and architecture failure, not a disk failure or a hashing problem (hashing proves integrity, it does not extend life). The fix: classify log sources, agree retention with legal (often 12 months hot, longer cold/archive), and document it.',
fx:'Retention is a balancing act: storage cost versus investigative reach. Know typical ranges — 90 days hot, 1 year+ archive for sensitive sources.'
});

EX.push({
t:'terminal', ti:'Capture the DNS traffic yourself', th:'Network data sources',
k:['Packet captures','tcpdump / Wireshark','DNS logs'], p:3,
sc:'The DNS-beacon investigation needs fresh, first-hand evidence: you will capture DNS traffic on the jump host\u2019s egress interface <code>eth0</code> and save it for Wireshark. The tool is <code>tcpdump</code>; DNS uses port 53.',
artLabel:'TERMINAL BRIEFING',
art:'Goal: one tcpdump command that filters DNS (port 53) on eth0 and writes the packets to <code>/tmp/dns.pcap</code>.',
q:'Type the tcpdump command that captures DNS on eth0 and saves it to /tmp/dns.pcap, then press Check.',
d:{
boot:'analyst@soc-jump:~$ ls\nauth.log  egress-sample.pcap\nanalyst@soc-jump:~$ sudo -i\nroot@soc-jump:~# _',
ls:'auth.log  egress-sample.pcap',
prompt:'root@soc-jump:~#',
help:'tcpdump -i <iface> <filter> -w <file>. The filter for DNS is the keyword port followed by the DNS port number.',
goals:[
 {re:'tcpdump[\\s\\S]*\\b53\\b', label:'tcpdump filters DNS traffic (port 53)'},
 {re:'tcpdump[\\s\\S]*-w\\s+\\S*dns\\S*\\.pcap', label:'capture is written to /tmp/dns.pcap with -w'}
],
show:[
 {when:'tcpdump.*-w.*pcap', out:'listening on eth0, link-type EN10MB (Ethernet), snapshot length 262144 bytes\n^C\n12 packets captured\n12 packets received by filter\n0 packets dropped by kernel'},
 {when:'tcpdump', out:'tcpdump: listening on eth0, link-type EN10MB (Ethernet)\n09:41:02.113 IP 10[.]20[.]31[.]7.53111 > 10[.]20[.]10[.]2.53: 1+ A? www.meridian-hh[.]example\n09:41:02.114 IP 10[.]20[.]10[.]2.53 > 10[.]20[.]31[.]7.53111: 1 1/0/0 A 10[.]20[.]30[.]5'}
],
example:'tcpdump -i eth0 port 53 -w /tmp/dns.pcap'},
h:'Order of the flags is free, but you need all three parts: -i eth0, the port 53 filter, and -w /tmp/dns.pcap.',
ex:'The canonical capture command is <code>tcpdump -i eth0 port 53 -w /tmp/dns.pcap</code>. <code>-i eth0</code> selects the interface; <code>port 53</code> is a BPF filter keeping only DNS; <code>-w</code> writes raw packets to a .pcap file that Wireshark (or tcpdump -r) can open later. Capturing with a filter keeps the file small — a full capture of everything would be gigabytes of noise. Saved pcaps are powerful evidence because they hold the actual packets, independent of any single tool\u2019s interpretation.',
fx:'Practise until instant: interface = -i, filter = port/host, save = -w, replay = -r. That quartet solves most capture tasks.'
});

EX.push({
t:'spot', ti:'The correlation rule that cries wolf', th:'SIEM & automated reporting',
k:['Correlation rules','SIEM aggregation','Log normalization'], p:2,
sc:'The SOC\u2019s password-spray rule generates hundreds of false alarms a day, and — worse — missed last month\u2019s real spray, which came from twelve different addresses at once. The rule definition is below.',
q:'Click the one line that breaks the rule\u2019s logic.',
d:{
lines:[
 'rule "PASSWORD_SPRAY":',
 '  match events where event.code = 4625',
 '  and event.code = 4624 within 10 minutes',
 '  group by event.dest_host',
 '  having count(failed) >= 20',
 '  then raise alert severity=critical'
],
wrong:3},
h:'A spray hits <i>many usernames from few sources</i>. Grouping by the victim machine counts every legitimate failure on that machine too.',
ex:'Password spraying is defined by the <i>source</i>: few addresses trying many usernames. Grouping by <code>dest_host</code> lumps every user\u2019s ordinary typos on a busy domain controller into one giant count — hence constant false alarms — while a distributed spray from many IPs gets diluted below the threshold and slips through. Grouping by <code>src_ip</code> matches how the attack actually works. The other lines are reasonable: pairing 4625 with 4624, a 10-minute window, and a threshold of 20 are all sensible tuning.',
fx:'Rule logic follows attack shape: spray → group by source; brute force (one victim) → group by target account. The group-by line is where rules live or die.'
});

EX.push({

/* ---------- shared choice component (qcm / multi, also inside logviewer) ---------- */
function buildChoice(ex, d, rm, root, multi){
  var st = { sel: multi ? {} : null };

  rm.opt.forEach(function(orig, disp){
    var b = el('button', 'opt');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="key">' + String.fromCharCode(65 + disp) + '.</span><span class="ot">' + d.opts[orig] + '</span>';
    b.addEventListener('click', function(){
      if (multi){
        if (st.sel[orig]) delete st.sel[orig]; else st.sel[orig] = 1;
        b.setAttribute('aria-pressed', st.sel[orig] ? 'true' : 'false');
      } else {
        st.sel = orig;
        btns.forEach(function(x){ x.b.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
      }
    });
    btns.push({ orig: orig, b: b });
    root.appendChild(b);
  });
  function btnOfOrig(orig){ for (var k = 0; k < btns.length; k++) if (btns[k].orig === orig) return btns[k].b; return null; }
  return {
    read: function(){
      if (multi){ var arr = Object.keys(st.sel).map(Number).sort(function(a, b){ return a - b; }); return arr.length ? { set: arr } : null; }
      return st.sel == null ? null : { sel: st.sel };
    },
    grade: function(v){
      var marks = [];
      if (multi){
        var hits = 0;
        d.correct.forEach(function(c){ marks.push([btnOfOrig(c), v.set.indexOf(c) >= 0 ? 'm-ok' : 'm-miss']); if (v.set.indexOf(c) >= 0) hits++; });
        v.set.forEach(function(s){ if (d.correct.indexOf(s) < 0) marks.push([btnOfOrig(s), 'm-bad']); });
        return { earned0: ex.p * hits / d.correct.length, marks: marks };
      }
      var ok = v.sel === d.correct;
      marks.push([btnOfOrig(v.sel), ok ? 'm-ok' : 'm-bad']);
      if (!ok) marks.push([btnOfOrig(d.correct), 'm-reveal']);
      return { earned0: ok ? ex.p : 0, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ btns.forEach(function(x){ stripMarks([x.b]); }); },
    lock: function(on){ btns.forEach(function(x){ x.b.disabled = on; }); },
    yours: function(v){ return multi ? v.set.map(function(o){ return d.opts[o]; }).join(' · ') : d.opts[v.sel]; },
    correct: function(){ return multi ? d.correct.map(function(c){ return d.opts[c]; }).join(' · ') : d.opts[d.correct]; }
  };
}

/* ---------- match ---------- */
function buildMatch(ex, d, rm, root){

  var pool = el('div', 'pool');

  pool.setAttribute('aria-label', 'Answer chips to place');
  var slots = [], chipEls = {}, allEls = [];
  root.appendChild(el('div', 'pool-lbl', 'Chips — click one, then click a slot beside its partner'));
  root.appendChild(pool);
  rm.right.forEach(function(orig){
    var c = el('button', 'chip', esc(d.right[orig]));
    c.type = 'button'; c.draggable = true; c.setAttribute('aria-pressed', 'false');
    c.addEventListener('click', function(){
      if (st.assign.indexOf(orig) >= 0) return;
      st.sel = (st.sel === orig) ? null : orig;
      rm.right.forEach(function(k){ chipEls[k].setAttribute('aria-pressed', String(k === st.sel && st.sel !== null)); });
    });
    c.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', String(orig)); });

  });
  d.left.forEach(function(L, li){
    var row = el('div', 'slotrow');
    row.appendChild(el('span', 'slot-l', L));
    var s = el('button', 'slot', '— drop here —');
    s.type = 'button';
    s.setAttribute('aria-label', 'Slot for: ' + L.replace(/<[^>]*>/g, '').trim());
    s.addEventListener('dragover', function(e){ e.preventDefault(); s.classList.add('dragover'); });
    s.addEventListener('dragleave', function(){ s.classList.remove('dragover'); });
    s.addEventListener('drop', function(e){
      e.preventDefault(); s.classList.remove('dragover');
      var orig = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if (isNaN(orig) || orig < 0) return;
      var dup = st.assign.indexOf(orig);
      if (dup >= 0){ chipEls[orig].classList.remove('ghosted'); chipEls[orig].disabled = false; st.assign[dup] = -1; paint(dup); }
      if (st.assign[li] >= 0){ chipEls[st.assign[li]].classList.remove('ghosted'); chipEls[st.assign[li]].disabled = false; }
      st.assign[li] = orig;
      chipEls[orig].classList.add('ghosted'); chipEls[orig].disabled = true;
      st.sel = null; paint(li);
    });
    s.addEventListener('click', function(){
      if (st.assign[li] >= 0){
        var prev = st.assign[li];
        chipEls[prev].classList.remove('ghosted'); chipEls[prev].disabled = false;
        st.assign[li] = -1; paint(li); return;
      }
      if (st.sel != null){
        var dup = st.assign.indexOf(st.sel);
        if (dup >= 0){ chipEls[st.sel].classList.remove('ghosted'); chipEls[st.sel].disabled = false; st.assign[dup] = -1; paint(dup); }
        st.assign[li] = st.sel;
        chipEls[st.sel].classList.add('ghosted'); chipEls[st.sel].disabled = true;
