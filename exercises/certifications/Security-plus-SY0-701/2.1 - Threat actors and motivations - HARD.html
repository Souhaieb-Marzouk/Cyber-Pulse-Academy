  if(S.skip[q.id])skipped.push(i+1);else unseen.push(i+1);
 }
 if(skipped.length)h+='<div class="blk exp"><h3>Skipped exercises - excluded from scoring</h3><p>Exercise'+((skipped.length>1)?'s':'')+' '+skipped.join(', ')+' were skipped. They are excluded from both the points you earned and the points possible, exactly as the exam rules state. Their explanations are still shown below so you can learn from them.</p></div>';
 if(unseen.length)h+='<div class="blk exp"><h3>Not attempted - excluded from scoring</h3><p>Exercise'+((unseen.length>1)?'s':'')+' '+unseen.join(', ')+' were never answered and never skipped, so they are also excluded from both totals.</p></div>';
 h+='<h2>Per-exercise report</h2>';
 h+='<table class="rep"><thead><tr><th>#</th><th>Theme and type</th><th>Points</th><th>Label</th><th>Your answer</th><th>Correct answer</th></tr></thead><tbody>';
 for(i=0;i<S.order.length;i++){
  q=DATA[S.order[i]];
  var s=S.st[q.id],r=S.res[q.id];
  var maxp=r?r.total:staticTotal(q);
  var earned=0,label='skipped',labcls='skip';
  if(!counted(q)){label=S.skip[q.id]?'skipped':'not attempted';labcls=S.skip[q.id]?'skip':'none';}
  else if(r){
   var pen=S.hint[q.id]?0.1*r.total:0;
   earned=Math.max(0,r.earned-pen);
   if(earned>=r.total){label='full'+(S.hint[q.id]?' (hint used)':'');labcls='full';}
   else if(earned<=0){label='zero'+(S.hint[q.id]?' (hint used)':'');labcls='zero';}
   else {label='partial'+(S.hint[q.id]?' (hint used)':'');labcls='part';}
  } else {label='not attempted';labcls='none';}
  h+='<tr><td>'+(i+1)+'</td><td>'+esc(q.theme)+'<br><small>'+typeName(q.type)+'</small></td>'+
     '<td>'+nf(earned)+' / '+maxp+'</td><td><span class="lab '+labcls+'">'+label+'</span></td>'+
     '<td>'+esc(shortAnswer(q,s)).replace(/\|\|/g,'<br>')+'</td><td>'+esc(correctAnswerText(q)).replace(/\|\|/g,'<br>')+'</td></tr>';
 }
 h+='</tbody></table>';
 h+='<h2>Detailed explanations</h2>';
 for(i=0;i<S.order.length;i++){
  q=DATA[S.order[i]];
  var s2=S.st[q.id],r2=S.res[q.id];
  var lbl='not attempted';
  if(!counted(q))lbl=S.skip[q.id]?'skipped - not counted':'not attempted';
  else if(r2){var pen2=S.hint[q.id]?0.1*r2.total:0;var e2=Math.max(0,r2.earned-pen2);lbl=nf(e2)+' / '+r2.total+' points';}
  h+='<div class="blk '+(S.skip[q.id]?'ask':'scen')+'"><h3>Exercise '+(i+1)+' - '+esc(q.theme)+' ('+lbl+')</h3>';
  h+='<p><b>Question.</b> '+q.question+'</p>';
  h+='<p><b>Correct answer.</b> '+esc(correctAnswerText(q)).replace(/\|\|/g,'<br>')+'</p>';
  if(!S.skip[q.id]&&counted(q))h+='<p><b>Your answer.</b> '+esc(shortAnswer(q,s2)).replace(/\|\|/g,'<br>')+'</p>';
  h+='<p><b>Why.</b> '+q.explain+'</p>';
  if(r2&&!S.skip[q.id]){
   var d=detail(q,s2);
   h+='<ul class="elem">';
   for(var j=0;j<d.length;j++){h+='<li><span class="tick '+(d[j].ok?'y':'n')+'">'+(d[j].ok?'&#10003;':'&#10007;')+'</span>'+d[j].txt+'</li>';}
   h+='</ul>';
  }
  h+='</div>';
 }
 h+='<div class="actions"><button type="button" class="btn good" data-act="retake">Retake Exam</button></div>';
 return h;
}

/* ============================ RENDER ============================ */
function render(resetScroll){
 var app=document.getElementById('app');
 if(S.phase==='intro'){app.innerHTML=introHtml();}
 else if(S.phase==='exam'){app.innerHTML=examHtml();paintClock();applyAllFilters();}
 else {app.innerHTML=resultsHtml();}
 if(S.focus){
  var e=document.querySelector(S.focus);
  if(e&&e.focus)e.focus();
  S.focus=null;
 }
 if(resetScroll)window.scrollTo(0,0);
}
function applyAllFilters(){
 var q=curQ();
 if(!q||!q.logs)return;
 var inp=document.querySelector('.logfilter');
 if(inp&&inp.value)applyFilter(inp);
}

/* ============================ INTERACTION ============================ */
function place(q,s,chip,zone){
 var k;
 if(q.type==='category'){s.place[chip]=zone;}
 else if(q.type==='fill'){
  for(k in s.place){if(s.place[k]===chip||k===String(zone))delete s.place[k];}
  s.place[zone]=chip;
 } else {
  for(k in s.place){if(s.place[k]===zone)delete s.place[k];}
  s.place[chip]=zone;
 }
}
function unplace(q,s,chip){
 var k;
 if(q.type==='fill'){for(k in s.place){if(s.place[k]===chip)delete s.place[k];}return;}
 delete s.place[chip];
}
function firstOpen(q,s){
 for(var i=0;i<s.steps.length;i++){if(s.steps[i]==null)return i;}
 return s.steps.length;
}
function flash(m){S.flash=m;}
function doCheck(){
 var q=curQ(),s=S.st[q.id];
 if(!hasContent(q)){flash('Add an answer before you press Check.');render();return;}
 S.res[q.id]=grade(q,s);S.skip[q.id]=false;
 s.dirty=false;s.attempted=true;s.cp=true;S.flash='';
 render();
}
function finish(){
 if(S.phase==='done')return;
 if(S.h)S.clearInterval(S.h);
 S.finalT=finalTotals();
 S.phase='done';
 render(true);
 animateScore();
}
function tryFinish(){
 var c=0,i;
 for(i=0;i<S.order.length;i++){if(counted(DATA[S.order[i]]))c++;}
 if(c===0){flash('You have not answered any exercise yet. Answer at least one exercise before you submit, or use Skip on the ones you do not want to count.');render();return;}
 finish();
}
function animateScore(){
 var target=finalPercent();
 var el=document.getElementById('bigpct');
 var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduce||target<3){if(el)el.textContent=target+'%';reportOnce();return;}
 var cur=0,step=Math.max(1,Math.round(target/40));
 var iv=setInterval(function(){
  cur+=step;
  if(cur>=target){cur=target;if(el)el.textContent=cur+'%';clearInterval(iv);reportOnce();}
  else if(el)el.textContent=cur+'%';
 },30);
}
function reportOnce(){
 if(S.reported)return;
 S.reported=true;
 var e=Math.round(S.finalT.e),t=Math.round(S.finalT.t);
 var pct=t>0?Math.round(e/t*100):0;
 try{
  parent.postMessage({type:'CYBERPULSE_SCORE',topicId:TOPIC,score:e,total:t,percent:pct,passed:pct>=PASS},location.origin);
 }catch(err){}
}
function navTo(i){
 var q=curQ();
 if(q&&S.st[q.id])S.st[q.id].cp=false;
 S.cur=i;S.flash='';
 render(true);
}
function onAct(act,node){
 var i=parseInt(node.getAttribute('data-i')||'-1',10);
 if(act==='start'){prep();S.phase='exam';render(true);if(S.h)S.clearInterval(S.h);S.h=setInterval(tick,1000);return;}
 if(act==='retake'){prep();S.phase='exam';render(true);if(S.h)S.clearInterval(S.h);S.h=setInterval(tick,1000);return;}
 if(act==='submit'){tryFinish();return;}
 if(S.phase!=='exam')return;
 var q=curQ(),s=S.st[q.id],j;
 if(!s)return;
 if(act==='jump'){navTo(i);return;}
 if(act==='next'){
  s.cp=false;S.flash='';
  if(S.cur<S.order.length-1)S.cur++;
  render(true);return;
 }
 if(act==='prev'){
  s.cp=false;S.flash='';
  if(S.cur>0)S.cur--;
  render(true);return;
 }
 if(act==='pause'){S.manual=!S.manual;S.focus='[data-act="pause"]';render();return;}
 if(act==='check'){doCheck();return;}
 if(act==='revise'){delete S.res[q.id];s.dirty=true;s.cp=false;S.flash='';render();return;}
 if(act==='skip'){
  S.skip[q.id]=true;delete S.res[q.id];s.cp=false;S.flash='';
  if(S.cur<S.order.length-1)S.cur++;
  render(true);return;
 }
 if(act==='hint'){
  S.hint[q.id]=true;
  var hints={
   mcq:'Re-read the evidence and ask which claim the artefacts can actually prove, not which one sounds confident.',
   multi:'Check every option against the artefacts. Anything that a false flag could plant, or that thousands of actors share, is not evidence.',
   category:'Ask what each artefact is specific to. Anything commercial, generic or already permitted points to the no-attribution bucket.',
   match:'Look at the whole behaviour set. One loud detail matters less than the quiet pattern around it.',
   order:'Start with collection and verification, end with sharing. Judgement steps come after the facts are checked.',
   fill:'Each blank has exactly one word in the bank that fits both the meaning and the technical level of the sentence.',
   terminal:'Build it one stage at a time: filter, extract, sort, count, sort again, filter on the count, write to the file.',
   branch:'Choose the option that preserves evidence or buys information first, and never warns the actor.',
   dual:'Answer each part on its own terms: the blue part is what you can see, the red part is what stays invisible.'};
  flash('Hint: '+(hints[q.type]||'Re-read the scenario and the question wording.'));
  S.focus='[data-act="check"]';
  render();return;
 }
 S.skip[q.id]=false;
 if(act==='pool'){
  if(s.chip===null||s.chip===undefined){flash('Select an item first, then return it to the list.');render();return;}
  unplace(q,s,s.chip);s.chip=null;s.dirty=true;s.touched=true;
  S.focus='[data-act="pool"]';render();return;
 }
 if(act==='chip'){
  s.chip=(s.chip===i)?null:i;
  S.focus='[data-act="chip"][data-i="'+i+'"]';render();return;
 }
 if(act==='zone'){
  if(s.chip===null||s.chip===undefined){flash('Select an item or a word first, then place it here.');render();return;}
  place(q,s,s.chip,i);
  s.chip=null;s.dirty=true;s.touched=true;S.flash='';
  S.focus='[data-act="zone"][data-i="'+i+'"]';render();return;
 }
 if(act==='up'||act==='down'){
  j=(act==='up')?i-1:i+1;
  if(j<0||j>=s.seq.length)return;
  var tmp=s.seq[i];s.seq[i]=s.seq[j];s.seq[j]=tmp;
  s.touched=true;s.dirty=true;
  S.focus='[data-act="'+act+'"][data-i="'+i+'"]';render();return;
 }
 if(act==='bstep'){
  var st=parseInt(node.getAttribute('data-step'),10),op=parseInt(node.getAttribute('data-opt'),10);
  if(st>firstOpen(q,s))return;
  s.steps[st]=op;s.dirty=true;s.touched=true;
  S.focus='[data-act="bstep"][data-step="'+st+'"][data-opt="'+op+'"]';render();return;
 }
}
function onDrop(ev){
 if(S.phase!=='exam')return;
 var zoneEl=ev.target.closest?ev.target.closest('[data-act="zone"],[data-act="pool"]'):null;
 if(!zoneEl)return;
 ev.preventDefault();
 var q=curQ(),s=S.st[q.id];
 var drag=ev.dataTransfer.getData('text/plain');
 if(drag==='')return;
 var ci=parseInt(drag,10);
 if(isNaN(ci))return;
 if(zoneEl.getAttribute('data-act')==='pool'){unplace(q,s,ci);}
 else {place(q,s,ci,parseInt(zoneEl.getAttribute('data-i'),10));}
 s.dirty=true;s.touched=true;S.skip[q.id]=false;
 render();
}
document.addEventListener('click',function(ev){
 var node=ev.target.closest?ev.target.closest('[data-act]'):null;
 if(!node)return;
 var act=node.getAttribute('data-act');
 if(act==='radio'||act==='check2'||act==='da'||act==='db'||act==='filter'||act==='term')return;
 ev.preventDefault();
 onAct(act,node);
},false);
document.addEventListener('change',function(ev){
 var t=ev.target;
 if(!t||!t.getAttribute)return;
 var act=t.getAttribute('data-act');
 if(S.phase!=='exam')return;
 var q=curQ(),s=S.st[q.id];
 var i=parseInt(t.getAttribute('data-i'),10);
 S.skip[q.id]=false;
 if(act==='radio'){s.pick=i;s.dirty=true;}
 else if(act==='check2'){s.sel[i]=t.checked;s.dirty=true;}
 else if(act==='da'){s.selA[i]=t.checked;s.dirty=true;}
 else if(act==='db'){s.selB[i]=t.checked;s.dirty=true;}
},false);
document.addEventListener('input',function(ev){
 var t=ev.target;
 if(!t||!t.getAttribute)return;
 var act=t.getAttribute('data-act');
 if(act==='filter'){applyFilter(t);if(S.phase==='exam'){var q=curQ();if(q)S.st[q.id].filter=t.value;}}
 else if(act==='term'){if(S.phase==='exam'){var q2=curQ();S.st[q2.id].text=t.value;S.skip[q2.id]=false;}}
},false);
document.addEventListener('keydown',function(ev){
 var t=ev.target;
 if(!t||!t.getAttribute)return;
 if(t.getAttribute('data-act')==='term'&&ev.key==='Enter'){ev.preventDefault();doCheck();}
 if(t.getAttribute('data-act')==='zone'&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();onAct('zone',t);}
},false);
document.addEventListener('dragstart',function(ev){
 var c=ev.target.closest?ev.target.closest('[data-act="chip"]'):null;
 if(!c)return;
 ev.dataTransfer.setData('text/plain',c.getAttribute('data-i'));
 ev.dataTransfer.effectAllowed='move';
 c.style.opacity='0.5';
},false);
document.addEventListener('dragend',function(ev){
 var c=ev.target.closest?ev.target.closest('[data-act="chip"]'):null;
 if(c)c.style.opacity='1';
},false);
document.addEventListener('dragover',function(ev){
 if(S.phase!=='exam')return;
 var z=ev.target.closest?ev.target.closest('[data-act="zone"],[data-act="pool"]'):null;
 if(z){ev.preventDefault();ev.dataTransfer.dropEffect='move';}
},false);
document.addEventListener('drop',onDrop,false);
window.addEventListener('message',function(ev){
 if(!ev||!ev.data)return;
 var d=ev.data;
 if(d.type!=='CYBERPULSE_INIT'&&d.type!=='CYBERMASTERY_INIT')return;
 if(typeof d.username==='string')S.user=d.username;
 if(typeof d.country==='string')S.country=d.country;
},false);

/* ============================ BOOT ============================ */
prep();
S.phase='intro';
render(true);
})();
</script>
</body>
</html>
