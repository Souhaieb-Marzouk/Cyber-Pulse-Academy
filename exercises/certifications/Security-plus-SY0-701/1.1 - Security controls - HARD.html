<style>

p{margin:0 0 10px}
.mono,pre,code,.termout{font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:var(--mono)}

.btn{

}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:linear-gradient(180deg,#1e7fb8,#155e8c);border-color:#3fb0e6;color:#f2fbff}

.btn.warn{background:linear-gradient(180deg,#8a6415,#5f440c);border-color:var(--warn)}

.btn:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{

}

.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--acc)}

.pbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .35s ease}

.pauseline .pe{padding:4px 10px;border-radius:999px;border:1px solid var(--warn);background:var(--warnbg);color:var(--warn)}

.tagtheme{background:#1a2a4a;border-color:#33507f}
.tag{display:inline-block;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#0f1930;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}

.opt:hover{border-color:var(--acc)}

.opt .mk{font-weight:800;flex:none;min-width:22px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.miss{border-color:var(--warn);background:var(--warnbg)}
.verdict{font-size:13px;font-weight:800;padding:3px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
.verdict.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.verdict.bad{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.verdict.miss{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}

.chip[aria-pressed="true"]{border-color:var(--acc);background:#1d3355;outline:2px solid var(--acc)}

.chip.bad{border-color:var(--bad);background:var(--badbg)}

.orderrow,.matchrow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:#0e1729;margin-bottom:8px;flex-wrap:wrap}

.orderrow.bad{border-color:var(--bad);background:var(--badbg)}
.orderrow .pos{font-weight:800;min-width:26px;color:var(--mut)}
.orderrow .grab{cursor:grab}
.matchrow .lft{flex:1 1 210px;min-width:180px}
select,input[type="text"],input[type="number"]{

}

.term{display:flex;gap:8px;align-items:center;background:#050a14;border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.term input{flex:1;background:transparent;border:0;min-height:40px}
.term input:focus{outline:none}
.termout{background:#050a14;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;white-space:pre-wrap;overflow-x:auto;color:#bcd3f0}
.logbox{background:#050a14;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.cert{border:3px solid var(--ok);border-radius:16px;padding:18px;text-align:center;background:linear-gradient(180deg,#0e2f24,#0c1f1a)}

.gcard{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0e1729}

.hintbox{border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;margin:10px 0;background:#0c1e30}
.small{font-size:14px}
ul{margin:6px 0 10px 20px;padding:0}

}
.logline.pick{min-height:44px;display:flex;align-items:center;padding:8px;cursor:pointer}

select.ok,input.ok{border-color:var(--ok);background:var(--okbg)}

.opt input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.themegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.themebox{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0e1729}
.themerow{display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-weight:600;margin-bottom:6px}
.flagmark{margin-left:8px}
.gcard span.small{display:block;margin-top:2px}
@media (max-width:560px){
  .wrap{padding:10px 10px 80px}
  .big{font-size:32px}

}

window.EXAM_QUESTIONS = [{"id":"H01","type":"classify","theme":"Control categories at scale","points":10,"scenario":"You are the lead assessor for a NIST SP 800-53 control baseline review at Meridian Bank. The register below was filled in by four different teams, and each team used its own idea of what a category means.","question":"Place every register entry in the correct control category.","buckets":["Technical (logical)","Managerial (administrative)","Operational","Physical"],"items":["Information security policy manual and the CIS hardening baseline for servers","Background check and signed NDA for every contractor before access is granted","Pipeline that turns firewall denies into SIEM alerts","Monthly privileged access review meeting","Tamper-evident seal on each payment rack","Weekly process for pushing new IDS signatures","Firewall rule set at the internet edge","Business continuity plan for the card processing site","Fence, guard post and turnstile at the site entrance","Signed key-cabinet log for the server room"],"answer":[1,1,0,2,3,2,0,1,3,2],"whyEach":["A policy manual and a hardening baseline are written management documents, so they are managerial, even though the baseline describes technical settings.","A background check and an NDA are management controls over people, so they are managerial.","A log pipeline is built from software and configuration, so it is technical.","A recurring review meeting is a human routine, so it is operational.","A seal is a physical item on a rack, so it is physical.","Pushing signatures is a weekly human and process task, so it is operational. The IDS itself is technical.","A firewall is software enforcing rules, so it is technical.","A continuity plan is a written management document, so it is managerial.","A fence, a guard post and a turnstile are all fixed or staffed items on the site, so they are physical.","A key log is a daily human routine, so it is operational."],"hint":"Do not look at what the control protects. Look at what carries it out: software, a management document, a daily human routine, or something on the site.","why":"Teams often misclassify because they think about the asset instead of the mechanism. A hardening baseline protects servers, but the document is managerial and the settings it produces are technical. This matters for the baseline. A gap in a managerial control is fixed with a process owner. A gap in a technical control is fixed with a change ticket.","kw":["technical (logical) control","managerial (administrative) control","operational control","physical control","security policy","CIS Critical Security Controls","control baseline","background check","non-disclosure agreement (NDA)","SIEM","firewall","access review","tamper-evident seal","IDS / IPS","business continuity plan (BCP) / DRP","fence","security guard","turnstile","lock"]},{"id":"H02","type":"spot","theme":"Firewall rule ordering","points":10,"scenario":"Meridian Bank's firewall change SOP says that every rule needs an owner and a business reason. You review a proposed edge rule set before the change board. Rule order and ownership are both in scope.","art":{"kind":"code","title":"meridian-edge.cfg (proposed, evaluated top to bottom)","pick":true,"lines":["rule 05 permit tcp 10[.]10[.]0[.]0/16 any eq 3389","rule 10 permit tcp any any eq 22 log","rule 15 deny tcp any any eq 22","rule 20 permit tcp any any eq 443","rule 25 deny ip any any log","! comment: rule 15 was added last week as a hardening step"]},"question":"Click the two lines that must be fixed before approval.","bad":[1,2],"whyEach":["Rule 05 allows remote desktop from the internal range only. That is the normal pattern for admin access, so it is not the finding.","Rule 10 allows SSH from the whole internet. Management access must come from a known range, so this rule is the exposure.","Rule 15 tries to deny SSH, but a firewall stops at the first match. Because rule 10 already permits SSH, rule 15 never sees the traffic and gives false comfort.","Rule 20 allows HTTPS from anywhere, which is expected for a public web service.","The final deny with logging is correct practice.","The comment is documentation, not a rule."],"hint":"Read the rules in order and stop at the first match, exactly like the firewall does. Then ask which rule can never be reached.","why":"Firewall evaluation is first match wins. A permit above a deny makes the deny dead code, which is worse than no rule at all because the team believes the port is closed. The fix is to scope the SSH permit to the admin range and place the deny before the broader permits. This is a preventive technical control failing on ordering, not on intent.","kw":["firewall","access control list (ACL)","preventive control","standard operating procedure (SOP)","change management","technical (logical) control"]},{"id":"H03","type":"terminal","theme":"Exposure validation","points":10,"scenario":"Before a new lab host may join the management VLAN at Meridian Bank, you must prove which services it exposes. The host name is lab-edge.meridian.example. The ticket requires the service versions and a saved copy of the result in normal output format at /tmp/scan.txt.","question":"Type the single command that produces that evidence.","hint":"No tool and no options are given here. Read the ticket again: it asks for the exposed services, their versions, and a saved record of the result.","parts":[{"re":{"source":"\\bnmap\\b","flags":""},"label":"uses a port and service scanner"},{"re":{"source":"-sV\\b|--version-(detection|light|all|intensity)","flags":""},"label":"probes service versions"},{"re":{"source":"-oN\\b|-oA\\b","flags":""},"label":"writes the output to a file"},{"re":{"source":"\\/tmp\\/scan\\.txt","flags":""},"label":"writes to /tmp/scan.txt"},{"re":{"source":"lab-edge\\.meridian\\.example","flags":""},"label":"targets lab-edge.meridian.example"}],"solution":"nmap -sV -oN /tmp/scan.txt lab-edge.meridian.example","why":"The evidence, not the memory of the build team, decides whether a host joins a trusted VLAN. Version detection tells you not only which ports are open but which product and version answers, which is what the risk decision needs. Writing the output to a file makes the result reviewable and repeatable, so the next scan can be compared with this one.","kw":["vulnerability scanner","technical (logical) control","due care / due diligence","continuous monitoring","access review"]},{"id":"H04","type":"branch","theme":"Ransomware response","points":10,"scenario":"At 04:00 the Meridian Bank service desk receives forty calls in ten minutes. Ransom notes are appearing on file shares. EDR shows a signed remote management tool pushing a new executable through the estate. The CEO wants everything back online before the markets open.","question":"Work the incident. Each step records the choice you click.","hint":"Contain before you recover, and keep one machine untouched. Ask at each step what a regulator or a court would need to see.","steps":[{"sit":"Step 1 - the encryptor is still running on some hosts.","opts":["Isolate the affected network segments, stop the remote management service, and keep one host untouched for forensics","Reboot every server to clear the encryptor from memory","Restore the backups straight away and keep the servers online","Pay the ransom so the decryptor arrives sooner"],"correct":0,"res":["Correct. Containment first, with one preserved host so the case can be explained later.","A reboot can clear evidence and may trigger more encryption on start-up.","Restoring over live systems destroys the evidence and the encrypted data may be re-encrypted.","Payment funds the attacker, and a decryptor is never guaranteed."]},{"sit":"Step 2 - the nightly backup job failed two days ago. The last verified copy is five days old.","opts":["Test the immutable object storage copy, verify its integrity, then restore from it","Restore the five-day-old tape copy over the live servers immediately","Copy the backup files from an affected server because they look untouched","Wait for the ransom decryption key"],"correct":0,"res":["Correct. An immutable copy cannot be encrypted by the attacker, and integrity checks prove the restore will work.","Restoring before checking loses the newest clean data and may restore onto live systems.","Backup files on an affected server are inside the attacker's reach and may already be encrypted or poisoned.","There is no guarantee a key will arrive or work."]},{"sit":"Step 3 - containment is done. A regulator and the police will ask for evidence.","opts":["Keep a write-blocked image of one host and a chain-of-custody log for every item","Let the administrator copy what he needs onto his own USB stick","Delete the malware and take a screenshot of the file name","Rebuild every host first and look for logs afterwards"],"correct":0,"res":["Correct. A hash-verified image plus a custody log keeps the evidence usable.","Personal media breaks custody and can leak data.","Deleting the malware destroys the only copy of the tool used against you.","Rebuilding wipes memory, logs and timestamps."]},{"sit":"Step 4 - the entry path was a remote management console with a single shared password.","opts":["Remove that tool, require MFA on remote management, and use just-in-time admin access","Add a second antivirus product to every server","Block internet access for all staff","Force a password change on the first Monday of each month"],"correct":0,"res":["Correct. The compensating and preventive controls that matter here are identity, approval and time limits.","A second scanner adds little and can conflict with the first.","That stops the business and would be rejected by the board.","A monthly change schedule trains users to pick predictable passwords."]}],"why":"Ransomware response runs on containment, evidence and recovery, in that order. The attacker's favourite entry route is often a legitimate tool with a weak login. The long-term fix is therefore identity and access management: MFA, just-in-time privileges, and removal of tools nobody owns. Backups only count as a corrective control when a verified copy exists outside the attacker's reach.","kw":["incident response plan","corrective control","preventive control","compensating control","MFA","RBAC / least privilege","backup and restore","change management","antivirus","EDR"]},{"id":"H05","type":"fill","theme":"Unpatchable device","points":10,"scenario":"A legacy imaging workstation at Meridian Clinic cannot run the endpoint agent and cannot be patched. Vendor support ends in fourteen months, and the clinicians need it daily.","question":"Fill the four gaps so the risk record reads correctly.","parts":["The workstation cannot run the EDR agent, so we apply a ",{"b":0}," control: it sits in a dedicated ",{"b":1}," with a deny-all rule except for one imaging server, and its traffic is copied to the ",{"b":2}," for review. The finding is recorded with an owner and a replacement date in the ",{"b":3},"."],"answers":["compensating","VLAN","SIEM","plan of action and milestones (POA&M)"],"extras":["preventive","honeypot","change log","backup and restore"],"hint":"The gaps name the network idea that keeps the workstation apart, the platform that collects logs, and the document that carries owners and dates.","why":"The missing control cannot be installed, so a different control must lower the same risk. Isolation plus log review is that different control, and it is compensating. It must still be documented, because a compensating control lowers residual risk but never removes it. The POA&M ties the finding to an owner and a date, which is what turns a permanent exception into a plan.","kw":["compensating control","VLAN segmentation","SIEM","plan of action and milestones (POA&M)","EDR","patch management","residual risk","continuous monitoring"]},{"id":"H06","type":"order","theme":"Breach timeline","points":10,"scenario":"Meridian Bank asks you to rebuild the timeline of a confirmed breach from four different log sources. The timestamps are already in UTC and the sources are trustworthy.","question":"Put the six events in the order they happened, earliest first.","items":["02:07 VPN: authentication SUCCESS user=jsmith src=198[.]51[.]100[.]23","02:19 DNS: query for l3vel3-cdn.badhost.example from 10[.]9[.]4[.]31","02:24 EDR: powershell.exe spawned by winword.exe on FIN-PC-14","02:31 Directory: new account svc_help created by user jsmith","02:48 File server: mass read of /finance/2019-2023 by svc_help","03:02 Proxy: outbound POST of 480 MB to hxxp://drop[.]exfil-host[.]example"],"why":"The chain reads as access, discovery, execution, persistence, collection, exfiltration. Each stage had a control that could have broken it. MFA on the VPN would have stopped the first step. An EDR rule on Office spawning a shell would have stopped the third. A new-account alert would have caught the fourth. A proxy rule on large uploads would have caught the last. Naming the stage is what tells you which control to buy.","hint":"Look at the verbs in order: getting in, looking around, running code, staying in, taking data, sending data out.","kw":["log review","MFA","EDR","detective control","preventive control","incident response plan","SIEM","RBAC / least privilege"]},{"id":"H07","type":"spot","theme":"Detective control coverage","points":10,"scenario":"After a breach at Meridian Bank, you review why the SIEM stayed silent while an attacker moved between hosts for two hours. You read the platform health records for the payment zone.","art":{"kind":"log","title":"SIEM platform health and change records","pick":true,"lines":["SIEM HEARTBEAT 01:00:00 source=pay-dc01 status=OK events=184220","SIEM HEARTBEAT 01:00:00 source=pay-app02 status=MISSING last_seen=2024-06-02T23:11:00Z","AGENT STATUS 01:05:00 host=pay-app02 agent=winlogbeat state=STOPPED reason=SERVICE_DISABLED","CHANGE 2024-06-02T23:09:40 ticket=CHG-4412 host=pay-app02 action='disable audit service for a performance test' approval=NONE","SIEM HEARTBEAT 01:00:00 source=pay-db01 status=OK events=99211","EDR 01:20:00 host=pay-app02 state=DISCONNECTED last_checkin=2024-06-03T01:02:00Z"]},"question":"Click the two lines that explain the cause of the blind spot.","bad":[2,3],"whyEach":["A healthy data source. Not the cause.","This is the symptom: the source is missing. The question asks for the cause, which is further down the chain.","The agent stopped because the audit service was disabled. This is the technical cause of the blind spot.","The change record shows the service was disabled with no approval. This is the process cause, and it is why nobody knew.","A healthy data source. Not the cause.","The endpoint agent losing contact is a second effect, not the original cause."],"hint":"Separate the symptom from the cause. One line reports that something is missing, and two lines explain why it went missing.","why":"A detective control is only as strong as its data sources, and coverage drifts silently. An unapproved change disabled the audit service, which stopped the agent, which removed the payment application from the SIEM. Without health monitoring on the collectors, MTTD grows without anyone noticing. The fixes are a change process that cannot be bypassed and a continuous monitoring rule on agent health.","kw":["SIEM","detective control","change management","continuous monitoring","MTTD / MTTR","log review","control gap","EDR"]},{"id":"H08","type":"match","theme":"Control families","points":10,"scenario":"Meridian Bank maps NIST SP 800-53 control families to its ISO/IEC 27001 Annex A control set. New analysts keep confusing the family codes, so you write a one-line reminder for each.","question":"Match each control family with what it covers.","pairs":[["AC","Access control"],["AU","Audit and accountability"],["CM","Configuration management"],["IA","Identification and authentication"],["IR","Incident response"],["SC","System and communications protection"]],"why":"Family codes are shorthand for a group of controls. AC limits who may do what. AU makes actions traceable. CM keeps systems in a known state. IA proves identity. IR covers preparation and response. SC covers the technical protection of systems and traffic. A control baseline is a tailored set drawn from these families. Each gap you find belongs to a family, which is how the POA&M stays readable.","hint":"Two families are about identity and access. One is about logs. One is about keeping systems consistent.","kw":["NIST SP 800-53","ISO/IEC 27001 Annex A","control baseline","plan of action and milestones (POA&M)","access review","log review","incident response plan","encryption"]},{"id":"H09","type":"calc","theme":"Alert quality","points":10,"scenario":"The Meridian Bank SOC closed 480 alerts last week. Twelve were confirmed true positives. The rest were benign, and the tuning backlog is growing because analysts chase the same alerts every week.","question":"Type the percentage of alerts that were false positives, to one decimal place.","answerNum":97.5,"tol":0.2,"unit":"%","hint":"Count the false positives first, then divide by the total and multiply by 100.","why":"A false positive rate near 98 percent means the detective control is technically running but operationally useless, because analysts start ignoring alerts. Three fixes are normal: tune or retire noisy rules, add context such as an approved scanner list, and measure quality next to MTTD. Alert quality is a control effectiveness question, not a tooling question.","kw":["detective control","SIEM","log review","MTTD / MTTR","continuous monitoring","control gap"]},{"id":"H10","type":"dual","theme":"Endpoint detection: both sides","points":10,"scenario":"At 22:40 the Meridian Bank EDR console shows a signed binary in the finance user's temp folder writing a file and then spawning cmd.exe. You look at the same event twice.","question":"Give the defender's answer first, then the attacker's next move.","hint":"Blue side: one host is rarely the only one. Red side: what already runs with trust on that machine?","q1":{"q":"Blue team: what is the correct next action?","opts":["Isolate the host, capture the process tree and memory, then hunt the file hash across the estate","Delete the file and close the alert","Reboot the host so the process stops","Block cmd.exe on every server in the bank"],"correct":[0]},"q2":{"q":"Red team: your first payload was blocked. What is the next evasion step?","opts":["Abuse a signed binary that is already trusted on the host","Disable the EDR service with the local admin password","Encrypt the payload twice before sending it","Send the payload again by email"],"correct":[0]},"why":"The blue side must preserve the process tree and hunt the hash, because one host is rarely the only one. The red side avoids writing new malware and instead abuses a signed tool the endpoint already trusts, which is why application control and allow-listing matter. Both views show the same lesson: detection is a race between behaviour rules and legitimate tools used in the wrong place.","kw":["EDR","detective control","preventive control","incident response plan","technical (logical) control","RBAC / least privilege"]},{"id":"H11","type":"classify","theme":"Risk response judgement","points":10,"scenario":"The Meridian Bank risk committee reviews six open risks. Each proposed action must be labelled with the response it really represents, not the response the owner claims.","question":"Place each action under the risk response it represents.","buckets":["Mitigate","Transfer","Accept","Avoid"],"items":["Add a contract clause that makes the supplier liable for breach costs","Move the analytics workload to a region that stores no client data","Keep the old shop-floor kiosk running for six more months and log the decision","Deploy a dedicated WAF rule set in front of the booking engine","Carry the first 250 thousand of any loss on the bank's own balance sheet","Buy a performance bond from the hosting provider"],"answer":[1,3,2,0,2,1],"whyEach":["A liability clause moves the financial consequence to the supplier, so it is transfer.","Removing client data from that region removes the exposure, so it is avoidance.","Staying exposed with a written decision and an owner is acceptance.","A WAF rule reduces the likelihood of exploitation, so it is mitigation.","Keeping the first part of any loss is retained risk, which is acceptance.","A bond pays out on failure, so the loss is transferred."],"hint":"Ask where the loss lands: reduced, moved to another party, kept, or removed by changing the activity.","why":"Owners often call a transfer a mitigation, because a contract feels like protection. A contract does not reduce the chance of the event, it only moves the cost. The distinction matters because residual risk accounting depends on it: mitigation lowers the exposure, while transfer leaves the exposure and changes who pays.","kw":["risk response: mitigate","risk response: transfer","risk response: accept","risk response: avoid","residual risk","WAF","risk assessment","due care / due diligence"]},{"id":"H12","type":"order","theme":"Control investment","points":10,"scenario":"Meridian Bank has 40 thousand to spend this quarter. Four teams submitted five proposals. Risk reduction is measured in points on the bank's own scale.","art":{"kind":"text","title":"Proposals submitted to the risk committee","lines":["A - MFA on the remote access gateway: cost 4k, risk reduction 40 points","B - Full data loss prevention rollout: cost 12k, risk reduction 30 points","C - Remove five unused internet-facing services: cost 2k, risk reduction 8 points","D - Replace the whole endpoint estate: cost 40k, risk reduction 45 points","E - Buy a second SIEM vendor for redundancy: cost 6k, risk reduction 6 points"]},"question":"Order the five proposals from best value to worst value, where value means risk reduction per unit of cost.","items":["A - MFA on the remote access gateway: cost 4k, risk reduction 40 points","C - Remove five unused internet-facing services: cost 2k, risk reduction 8 points","B - Full data loss prevention rollout: cost 12k, risk reduction 30 points","E - Buy a second SIEM vendor for redundancy: cost 6k, risk reduction 6 points","D - Replace the whole endpoint estate: cost 40k, risk reduction 45 points"],"why":"Divide the reduction by the cost. A gives 10 points per thousand, C gives 4, B gives 2.5, E gives 1, and D gives just over 1. Ranking by raw reduction would put D first, which spends the whole budget for 45 points. Good control selection is not about the biggest control, it is about the most risk removed for the money, and the decision must still be recorded.","hint":"For each proposal, divide the risk reduction by the cost. Compare the five numbers.","kw":["risk assessment","due care / due diligence","MFA","SIEM","residual risk","risk response: mitigate","control gap"]},{"id":"H13","type":"fill","theme":"Tabletop findings","points":10,"scenario":"Meridian Bank ran a tabletop exercise on a payment supplier outage. The exercise found that nobody knew who to call at 03:00, and the payment run had no fallback procedure.","question":"Fill the three gaps in the after-action note.","parts":["The ",{"b":0}," plan named no alternate contact for the payment provider, so the exercise failed at the first call. The vendor review was only a yearly questionnaire, so the ",{"b":1}," control had a gap. We will retest next quarter and add the missing contacts, which is part of ongoing ",{"b":2},"."],"answers":["incident response","managerial","due diligence"],"extras":["business continuity","technical","background check"],"hint":"The three gaps are the plan for handling an event, the supplier review category, and the bank's duty of care to its customers.","why":"A tabletop exercise tests plans against people, and it finds what documents hide: missing contacts, unclear owners and untested fallbacks. A yearly questionnaire is a managerial control, and it is weak because it reviews paper instead of performance. Due diligence means the bank keeps checking that its suppliers can do what the contract says, and it must be repeated, not filed once.","kw":["tabletop exercise","business continuity plan (BCP) / DRP","incident response plan","managerial (administrative) control","due care / due diligence","security audit","continuous monitoring"]},{"id":"H14","type":"spot","theme":"CCTV and data protection","points":10,"scenario":"Meridian Bank installs CCTV in a new operations centre. You review the camera policy before the data protection officer signs it.","art":{"kind":"code","title":"Operations centre CCTV policy (draft)","pick":true,"lines":["1. Cameras cover the vault door, the loading bay and the server room door.","2. Footage is retained for 400 days in the cloud archive.","3. Signs at every covered entrance tell people that recording takes place.","4. Only the security manager may export footage, and every export is written to a log.","5. Footage may be used for any purpose the company finds useful.","6. Staff may request a copy of footage that shows them."]},"question":"Click the two lines that break data protection principles.","bad":[1,4],"whyEach":["Cameras pointed at controlled doors are proportionate to the security purpose.","Keeping footage for more than a year is far beyond what a door camera needs. Storage limitation means you keep personal data only as long as necessary.","Signs make the recording transparent to the people filmed, which is required.","Restricting exports to one role with an audit trail is exactly right.","Allowing any use the company finds useful breaks purpose limitation. The purpose must be stated when the data is collected.","A right of access for the person filmed is a legal right, so this line is correct."],"hint":"Look for one line that keeps data far too long, and one that allows any use at all.","why":"CCTV is a detective physical control, but it also processes personal data. Data protection principles attach to the control: collect only what you need, state the purpose, keep it only as long as necessary, and make it transparent. A bank that ignores them can lose the footage as evidence and pay a fine as well.","kw":["CCTV","GDPR","physical control","detective control","security policy","due care / due diligence"]},{"id":"H15","type":"fill","theme":"Resolver evidence","points":10,"scenario":"The Meridian Bank SOC reviews resolver logs after a finance workstation was flagged for unusual traffic. The endpoint agent was missing on that workstation, so the controller only has network evidence.","art":{"kind":"log","title":"Recursive resolver log (excerpt)","lines":["03:14:02 client=10[.]9[.]4[.]31 name=8f3a91bc22d4e7a1.tun.badhost.example type=TXT size=240","03:14:03 client=10[.]9[.]4[.]31 name=1c9d77ab04f2ee55.tun.badhost.example type=TXT size=238","03:14:04 client=10[.]9[.]4[.]31 name=73ba21cc9084fd10.tun.badhost.example type=TXT size=241","03:14:05 client=10[.]9[.]4[.]31 name=f09e13ad7b2c4411.tun.badhost.example type=TXT size=239","03:14:05 client=10[.]9[.]4[.]31 name=portal.meridian.example type=A size=48","03:14:06 client=10[.]9[.]4[.]31 name=5b7c0e94aa31dd27.tun.badhost.example type=TXT size=240"]},"question":"Fill the three gaps in the shift note.","parts":["Six long random subdomains to one domain in four seconds point to ",{"b":0},". The control that should catch this at the resolver is a ",{"b":1},". Because the workstation has no endpoint agent, that resolver rule is acting as a ",{"b":2}," control on this host."],"answers":["data exfiltration over DNS","DNS filter","compensating"],"extras":["a brute-force login","firewall rule","preventive"],"hint":"Long random labels carried in TXT records are a well-known way to move data out. The second gap is the control you would place at the resolver.","why":"DNS tunnelling hides data inside queries that most networks allow. High entropy labels, TXT records and a steady query rate are the signatures. The detection therefore belongs at the resolver, or in the SIEM rule that watches it. With no endpoint agent on the host, the resolver rule stands in for the missing control, which makes it compensating until the agent is reinstalled.","kw":["detective control","compensating control","SIEM","log review","continuous monitoring","control gap"]},{"id":"H16","type":"mcq","theme":"Authorisation judgement","points":10,"scenario":"Meridian Bank's risk committee is told that a new payment service will go live next month. Three controls from the approved baseline are still not implemented, and the programme director wants to know the correct governance route.","question":"Which route is the correct one?","opts":["Add a compensating control, log the gaps in the POA&M, and let the authorising official accept the residual risk","Record the three gaps in the risk register, go live as planned, and review the register next quarter","Remove the three controls from the approved baseline so the system matches what has been built","Ask the supplier to sign a letter stating that the three controls are not required for this service","Go live as planned and write the POA&M entries after the first internal audit next year"],"correct":[0],"whyEach":{"0":"The gaps stay visible with owners and dates, the risk is lowered as far as possible, and a named official accepts what is left.","1":"A register entry alone has no milestone, no owner and no authorising decision, so nobody has accepted the risk in writing.","2":"Changing the baseline to match the build is self-certification. The weakness is still there, it has just stopped being reported.","3":"A supplier letter moves no duty and reduces no risk. The bank still owns the exposure.","4":"An audit that finds unowned, undocumented gaps turns a technical problem into a governance finding against the programme."},"hint":"Ask three questions: who lowers the risk, who owns the gap, and who signs for what remains.","why":"Authorisation is a decision made by a named person on the record. The route that works has three parts. Lower the risk as far as the technology allows. Write every remaining gap into the POA&M with an owner and a date. Have the authorising official formally accept the residual risk. The other routes either hide the gap, move it to somebody who cannot accept it, or delay the paperwork until an audit finds it.","kw":["plan of action and milestones (POA&M)","control baseline","residual risk","compensating control","control gap","security audit","due care / due diligence","risk assessment"]},{"id":"H17","type":"match","theme":"Physical attack and countermeasure","points":10,"scenario":"A red-team report on Meridian Bank's operations centre lists ten physical attack ideas. You must pair each one with the control that answers it.","question":"Match each attack with the physical control that counters it.","pairs":[["Ramming a vehicle into the lobby doors","Bollard"],["Following an employee through the entry door","Mantrap"],["Reading a screen from the next seat on a train","Privacy filter"],["Finding old printed statements in the rubbish","Shredder"],["Tapping a network cable in a shared riser","Protected cabling / conduit"],["A fire starting beside the tape archive","Fire suppression"],["Heat building up in the server room","Environmental control (HVAC)"],["A power cut in the middle of a payment run","UPS / generator"],["An intruder crossing the yard after dark","Security lighting"],["A lost badge that still opens doors","Badge reader with revocation"]],"why":"Physical security is layered, and each item here answers one specific attack. A bollard stops kinetic attacks, a mantrap stops tailgating, a privacy filter stops shoulder surfing, and a shredder removes the paper trail. The last pair is the one teams forget: a badge reader without a revocation process keeps trusting a credential that should be dead.","hint":"Three of these are about vehicles, heat and power. Two are about doors. Two are about what a person can see or take.","kw":["bollard","mantrap","privacy filter","shredder","protected cabling / conduit","fire suppression","environmental control (HVAC)","UPS / generator","security lighting","badge reader","physical control","defense in depth"]},{"id":"H18","type":"mcq","theme":"Compensating control facts","points":10,"scenario":"During the Meridian Bank audit, a control owner claims he does not need to fix a gap because he already added a compensating control.","question":"Which statement about compensating controls is correct?","opts":["A compensating control lowers the same risk and is reviewed and time-boxed","A compensating control removes the need to fix the original problem","A compensating control is another name for a detective control","A compensating control is only used when the budget is small"],"correct":[0],"whyEach":{"0":"It must address the same risk, be documented, and carry a review date, because it is a temporary answer.","1":"The original problem stays on the risk record with an owner and a date. Compensation buys time, not a permanent pass.","2":"Compensation can be preventive, detective or physical. It is defined by why it exists, not by what it does.","3":"Budget is one reason to use one, but the real trigger is that the primary control is not possible or not yet in place."},"hint":"Think about what happens to the original finding after the compensating control is in place.","why":"A compensating control is a different control that reduces the same risk when the intended control cannot be used. It must be documented, it must be reviewed, and it must end when the real fix arrives. Otherwise the organisation collects shadow controls that nobody tests, and the gap quietly becomes permanent.","kw":["compensating control","residual risk","plan of action and milestones (POA&M)","security audit","due care / due diligence"]},{"id":"H19","type":"dual","theme":"Honeypot: both sides","points":10,"scenario":"Meridian Bank runs a honeypot on an unused address range inside the DMZ. It has no users and no business purpose, and its traffic is copied to the SOC.","question":"Answer as the SOC owner first, then as the intruder who just found the host.","hint":"Blue side: the host has no users, so what does any traffic to it mean? Red side: what makes a host look fake?","q1":{"q":"Blue team: what makes this honeypot useful?","opts":["Any connection to it is suspicious by design, so the alerts have almost no false positives","It blocks attacks automatically before they reach the bank","It replaces the need for an IDS on that segment","It stores a spare copy of the payment database"],"correct":[0]},"q2":{"q":"Red team: you suspect the host you found is a honeypot. What do you check first?","opts":["Whether the host is unusually easy to reach and carries no real user traffic","Whether the address is inside the cloud provider range","Whether the domain was registered many years ago","Whether the web service answers on port 443"],"correct":[0]},"why":"A honeypot is a detective control with a special property: it has no legitimate users, so any activity is interesting. That makes alerts high fidelity and cheap to triage. The attacker's counter is the same logic in reverse, so a honeypot must look plausible: real banners, patched services, no obvious name such as honeypot01.","kw":["honeypot","detective control","IDS / IPS","SIEM","log review","control gap"]},{"id":"H20","type":"classify","theme":"Directive or deterrent","points":10,"scenario":"Meridian Bank is tidying the wording of its control register. Directive and deterrent controls are constantly mixed up by the teams, so you sort the new entries carefully.","question":"Place each entry under directive, deterrent or corrective.","buckets":["Directive","Deterrent","Corrective"],"items":["Warning banner: all activity on this system is monitored and unauthorised access will be prosecuted","Procedure requiring a second approver for payments over 50 thousand","Restoring the payroll database from an offsite copy after corruption","Sign stating that photography is forbidden in the data hall","Notice that intruders will be prosecuted to the full extent of the law","Failover to the standby data centre after a fire in the primary site"],"answer":[1,0,2,0,1,2],"whyEach":["The banner warns of a consequence, so it deters. It also tells users they have no privacy here, but deterrence is its purpose.","The procedure tells staff what they must do before acting, so it is directive.","A restore puts the data back, so it is corrective.","The sign instructs people not to take photographs, so it is directive.","The notice threatens a legal consequence to discourage an attempt, so it is deterrent.","Failover restores service, so it is corrective."],"hint":"Directive controls give an instruction. Deterrent controls warn about a consequence. Neither one repairs anything.","why":"Directive controls shape behaviour before an action: policies, procedures, baselines and signs. Deterrent controls also act before an action, but through fear of a consequence rather than through instruction. Corrective controls act after the event. A register that mixes them cannot answer the board's question, which is: are we telling people what to do, scaring attackers, or repairing damage?","kw":["directive control","deterrent control","corrective control","security policy","standard operating procedure (SOP)","separation of duties","backup and restore","business continuity plan (BCP) / DRP"]},{"id":"H21","type":"spot","theme":"Change management bypass","points":10,"scenario":"Meridian Bank investigates a two-hour logging blind spot. The audit team gives you the change and configuration records for pay-app02 from that night.","art":{"kind":"code","title":"pay-app02 change and audit records","pick":true,"lines":["CHG-5510 status=APPROVED approver=cab-chair window=Sat 02:00-04:00 host=pay-app02","AUDIT 02:41 change to /etc/audit/auditd.conf by user=contractor1 ticket=NONE","AUDIT 02:42 service auditd restart by user=root ticket=CHG-5510 (inside approved window)","AUDIT 02:50 change to firewall rule 22 by user=contractor1 ticket=CHG-5499 approved-host=pay-db01","MAIL 03:00 'maintenance finished' from contractor1 to ops-team","CHG-5511 status=REJECTED host=pay-db01 windows=Sun 02:00-04:00"]},"question":"Click the two lines that show the change process was bypassed.","bad":[1,3],"whyEach":["An approved change inside its window. Normal.","A configuration change with no ticket at all, made by a contractor outside any approved request.","A service restart under an approved ticket inside its window. The restart itself is expected.","The rule change on pay-app02 was made under a ticket approved for pay-db01. The ticket exists, but it does not cover this host, so the process was bypassed.","A handover note is not a control failure.","A rejected change is the process working."],"hint":"One line has no ticket at all. Another has a ticket, but read carefully which host that ticket covers.","why":"Change management is an operational control that protects every other control, because it is what keeps configurations inside the approved baseline. The first bypass disabled auditing, which removed the evidence. The second changed a firewall rule on a host that the approval did not cover, which is the quiet version of the same failure. Both are found only by comparing the change record with the configuration record.","kw":["change management","control baseline","log review","operational control","firewall","security audit","continuous monitoring"]},{"id":"H22","type":"fill","theme":"Control gap assessment","points":10,"scenario":"You write the gap section of a PCI DSS assessment for the Meridian Bank cardholder environment.","question":"Fill the six gaps so the finding reads correctly.","parts":["The cardholder zone has strong network controls, but nobody reviews the logs daily, so the ",{"b":0}," control is missing. The same two administrators write changes and approve them, so ",{"b":1}," is broken. Neither has taken continuous leave in three years, so job rotation and ",{"b":2}," are not in place. Contractors also receive accounts without a signed ",{"b":3}," and with no removal step when they leave, so the ",{"b":4}," process is incomplete. Every gap is recorded in the ",{"b":5}," with owners and dates."],"answers":["detective","separation of duties","mandatory vacation","acceptable use policy (AUP)","onboarding / offboarding","plan of action and milestones (POA&M)"],"extras":["preventive","job rotation","change log","non-disclosure agreement (NDA)"],"hint":"Two gaps are about fraud that needs two people or constant hiding. Two are about a contractor's first day and last day at the bank.","why":"Log review turns raw data into detection. Without it the zone has no detective control at all. Separation of duties makes fraud need two people. Mandatory vacation exposes fraud that needs constant hiding, and job rotation stops one person owning a process forever. A contractor account also needs a signed acceptable use policy, so the rules are agreed in writing. It needs an onboarding and offboarding process too, so rights appear and disappear on time. Without a POA&M none of these findings gets an owner.","kw":["detective control","separation of duties","mandatory vacation","job rotation","plan of action and milestones (POA&M)","PCI DSS","log review","control gap","managerial (administrative) control","acceptable use policy (AUP)","onboarding / offboarding"]},{"id":"H23","type":"order","theme":"Inherent risk ranking","points":10,"scenario":"The Meridian Bank risk committee wants the five newest findings ranked by inherent risk, which means the risk before any existing control is taken into account.","art":{"kind":"text","title":"Findings with likelihood (l) and impact (i) on a 1 to 5 scale","lines":["F-01 internet-facing VPN appliance, l=5 i=5","F-02 partner file transfer service, l=4 i=5","F-03 staff laptop build, l=5 i=3","F-04 offsite tape vault, l=2 i=5","F-05 print server, l=3 i=3"]},"question":"Order the five findings from highest inherent risk at the top to lowest at the bottom.","items":["F-01 internet-facing VPN appliance, l=5 i=5","F-02 partner file transfer service, l=4 i=5","F-03 staff laptop build, l=5 i=3","F-04 offsite tape vault, l=2 i=5","F-05 print server, l=3 i=3"],"why":"Inherent risk is likelihood times impact: 25, 20, 15, 10 and 9. The ranking is deliberately different from the residual ranking. F-02 may already have a strong compensating control, while F-03 has none. Both views matter. Inherent risk shows where the business is exposed. Residual risk shows where the money should go next. Confusing the two hides the findings that already have protection.","hint":"Multiply each pair of numbers. A high impact with low likelihood can still fall below a medium score.","kw":["risk assessment","residual risk","vulnerability scanner","control baseline","due care / due diligence","compensating control"]},{"id":"H24","type":"mcq","theme":"Compensating control set","points":10,"scenario":"The Meridian Bank core switch supports only one shared local administrator account and no central authentication. The vendor has no roadmap for this model.","question":"Which three actions together form a reasonable compensating control set? Select three.","multi":true,"opts":["Restrict management access to a jump host that requires MFA","Send every switch login to the SIEM and alert on a new source address","Rotate the shared local credential after each maintenance session","Manage the switch only through a serial cable on the data hall floor","Publish the web management interface so engineers can reach it from home"],"correct":[0,1,2],"whyEach":{"0":"A jump host with MFA replaces central authentication for this one device, which is exactly what compensation means.","1":"Alerting on a new source address gives a detective layer, because the shared account cannot prove who logged in.","2":"Rotation limits how long a leaked shared credential stays useful.","3":"Serial-only management would break remote support and adds a physical risk in the data hall, so it hurts availability without lowering the main risk.","4":"Publishing a management interface to the internet raises the risk and is the opposite of a compensating control."},"hint":"A compensating set must lower the same risk while keeping the device usable by the people who need it.","why":"When a control such as central authentication cannot be implemented, you build a set that covers identity, detection and credential lifetime. The set only works if the device stays supportable, which is why serial-only or internet-exposed management are both wrong. The whole set is then documented with a review date and an owner.","kw":["compensating control","MFA","SIEM","detective control","RBAC / least privilege","access review","residual risk","plan of action and milestones (POA&M)"]},{"id":"H25","type":"order","theme":"Evidence handling","points":10,"scenario":"Meridian Bank must hand evidence to the police after a confirmed intrusion. The legal team warns that the case will be lost if the handling order is wrong.","question":"Order the six evidence steps from first to last.","items":["Identify and document every device and data source in scope","Photograph and label the scene, then open a chain-of-custody form","Capture volatile data such as memory and live connections","Create a write-blocked forensic image and record its hash","Analyse the working copy only, never the original","Report the findings with the artefacts and the limitations"],"why":"Volatile data disappears first, so memory and live connections are captured before anything is powered down. The chain of custody starts at the scene, not in the lab, because the gap in the middle is what a defence lawyer attacks. Hashing proves the image matches the original, and analysing only the copy keeps the original admissible. Reporting limitations is part of honesty, not weakness.","hint":"Think about what disappears when the power goes off, and when the paperwork must start.","kw":["incident response plan","log review","due care / due diligence","corrective control","detective control","continuous monitoring"]},{"id":"H26","type":"classify","theme":"Alert triage quality","points":10,"scenario":"You are the Meridian Bank SOC shift lead. Eight alerts from last night wait in the queue, and the tuning backlog is already long. You sort each alert before the handover meeting.","art":{"kind":"log","title":"Overnight alert queue","lines":["A1 EDR: credential dumping tool signature on FIN-PC-14, parent process cmd.exe, user jsmith","A2 IDS: SSH brute-force signature from 10[.]9[.]4[.]31, which is the approved internal scanner inside its window","A3 DLP: 40 MB of PDF files copied to an encrypted personal USB drive, user m.okafor, no ticket","A4 IDS: repeated SMB logon failures from the backup server using a stale credential known since March","A5 Cloud: console login for service account svc_report from a new country, although the account is never used interactively","A6 Mail: 900 outbound messages to a single domain in three minutes from one mailbox","A7 Antivirus: test file detected in /tmp during the nightly scanner self-test","A8 FIM: /etc/sudoers modified on pay-db01 by user root outside the change window"]},"question":"Place each alert under the label that fits it best.","buckets":["True positive","False positive","Benign true positive"],"items":["A1 EDR: credential dumping tool signature on FIN-PC-14, parent process cmd.exe, user jsmith","A2 IDS: SSH brute-force signature from 10[.]9[.]4[.]31, which is the approved internal scanner inside its window","A3 DLP: 40 MB of PDF files copied to an encrypted personal USB drive, user m.okafor, no ticket","A4 IDS: repeated SMB logon failures from the backup server using a stale credential known since March","A5 Cloud: console login for service account svc_report from a new country, although the account is never used interactively","A6 Mail: 900 outbound messages to a single domain in three minutes from one mailbox","A7 Antivirus: test file detected in /tmp during the nightly scanner self-test","A8 FIM: /etc/sudoers modified on pay-db01 by user root outside the change window"],"answer":[0,1,0,2,0,0,1,0],"whyEach":["Credential dumping on a finance endpoint is a real compromise until proven otherwise. True positive.","An approved scanner inside its window explains the traffic completely, so this is a false positive that the rule should learn to ignore.","Copying financial PDFs to personal media with no ticket is a policy breach and possible data theft. True positive.","The credential is known and stale, so nobody is attacking the bank. The activity is real and harmless, but the account must still be fixed in March's backlog, so this is a benign true positive.","A service account never used interactively has no reason to sign in from a new country. True positive.","Mass mailing from one mailbox is the signature of a compromised account or a spam run. True positive.","The scanner testing itself is expected. False positive.","A file integrity alert on a privileged configuration file, changed outside every approved window, is a true positive until a change record explains it."],"hint":"Ask three questions in order: is there an approved explanation, is the underlying cause still unfixed, or is this real?","why":"Triage is a control-effectiveness skill. A false positive is a tool detecting something the environment already explains. A benign true positive is real activity with no attacker in it, but with an underlying problem nobody fixed. Mixing the last two together is how rules get switched off when the correct fix was to disable a stale account. The shift lead tracks the third category as work, because otherwise the same ticket returns every week.","kw":["detective control","SIEM","log review","control gap","continuous monitoring","security awareness training","RBAC / least privilege","EDR","IDS / IPS","file integrity monitoring (FIM)","change management"]},{"id":"H27","type":"fill","theme":"Control testing evidence","points":10,"scenario":"Meridian Bank's internal audit tests twenty firewall rules in the cardholder zone. The working papers must show exactly what was done and what was found.","question":"Fill the three gaps in the working paper.","parts":["We tested each sampled rule by ",{"b":0}," it with the approved rule documentation and the system owner's statement. Four rules had no owner and were absent from the ",{"b":1},". We reported those four rules as not effective and agreed a removal date; the zone stays under ",{"b":2}," until the next assessment."],"answers":["comparing","control baseline","continuous monitoring"],"extras":["encrypting","change log","job rotation"],"hint":"The gaps are the act of checking, the approved document you check against, and what continues after the assessment.","why":"A control test needs three things: the sample, the expected state and the evidence of the actual state. Here the expected state is the approved baseline, which is why a rule that is missing from the baseline has no owner and no business reason. Reporting the gap without a removal date and without monitoring turns a finding into a permanent exception.","kw":["security audit","control baseline","firewall","continuous monitoring","control gap","change management","due care / due diligence"]},{"id":"H28","type":"dual","theme":"Cloud exposure: both sides","points":10,"scenario":"A Meridian Bank storage bucket holds scanned patient referral letters for a partner clinic. Anonymous list access is enabled and the objects are not encrypted at rest. You look at the same bucket twice.","question":"Answer from inside the bank first, then from outside it.","hint":"Blue side: the exposure already exists, so what proves whether anyone used it? Red side: a public bucket needs no exploit at all.","q1":{"q":"Blue team: what is the first thing you check?","opts":["The access log, to see whether anyone outside the bank already listed or read the objects","The monthly storage cost of the bucket","The colour scheme used in the cloud console","The provider's public uptime page"],"correct":[0]},"q2":{"q":"Red team: how do you find buckets like this at scale?","opts":["Guess common bucket names and test anonymous list access from outside","Send phishing mail to the cloud engineering team","Buy advertising space on a search engine","Attack the badge reader at the branch"],"correct":[0]},"why":"Exposure is a preventive failure. The first question is whether the failure was already used, and only the access log can answer that. The red side does not need a clever attack for a public bucket. That is why the fix belongs in preventive controls. Block public access by default, encrypt at rest, and add posture findings so the next bucket is caught in minutes.","kw":["encryption","access control list (ACL)","preventive control","detective control","log review","continuous monitoring","technical (logical) control"]},{"id":"H29","type":"terminal","theme":"Hidden listener hunt","points":10,"scenario":"A payment host at Meridian Bank is suspected of running an unexpected listener after a maintenance session. You must attach the list of listening TCP and UDP sockets with their owning process names and numeric ports to the incident ticket.","question":"Type the single command you would run on the host to produce that list.","hint":"No tool and no options are given here. The ticket asks for every listening socket together with the process that owns it, in numeric form.","parts":[{"re":{"source":"\\b(ss|netstat|lsof)\\b","flags":""},"label":"uses a socket listing tool"},{"re":{"source":"(^|\\s)-{1,2}[a-z]*t[a-z]*\\b|--tcp\\b","flags":"i"},"label":"includes TCP sockets"},{"re":{"source":"(^|\\s)-{1,2}[a-z]*u[a-z]*\\b|--udp\\b","flags":"i"},"label":"includes UDP sockets"},{"re":{"source":"(^|\\s)-{1,2}[a-z]*l[a-z]*\\b|--listen","flags":"i"},"label":"shows listening sockets"},{"re":{"source":"(^|\\s)-{1,2}[a-z]*p[a-z]*\\b|--process","flags":"i"},"label":"shows the owning process"},{"re":{"source":"(^|\\s)-{1,2}[a-z]*n[a-z]*\\b|--numeric\\b","flags":"i"},"label":"prints numeric ports and addresses"}],"solution":"ss -tulpn","why":"A hidden listener is a persistence sign, so you need the process name and not only the port. Numeric output avoids slow name lookups and stops unexpected DNS traffic from the very host you are investigating. Comparing the list with the documented service baseline tells you which listener has no business reason, and that is the one you investigate and remove.","kw":["technical (logical) control","control baseline","detective control","incident response plan","log review","RBAC / least privilege"]},{"id":"H30","type":"mcq","theme":"Why process controls exist","points":10,"scenario":"The Meridian Bank board asks why the security programme still pays for policies, reviews and training when the bank already owns firewalls, EDR and a SIEM. The chief information security officer asks you for the best short answer.","question":"Which answer is best?","opts":["Technical controls drift without owners and reviews, so process controls keep them effective","Technical controls are enough when the security budget of the bank is large enough","Process controls exist mainly to satisfy the external auditors who visit once a year","People controls are a cheaper substitute for technical controls in a cloud tenant"],"correct":[0],"whyEach":{"0":"Technical controls drift without a rule set, an owner and a review cycle, so the process controls are what keep them working.","1":"A large budget buys tools that nobody owns, which is how coverage gaps like a disabled audit service happen.","2":"Auditors check the process controls because they protect the business, not because the paperwork is the goal.","3":"Training and policy reduce mistakes, but they cannot block a port or encrypt a disk."},"hint":"Think about what happens to a firewall rule, an EDR agent and a SIEM rule set after a year without an owner.","why":"Every technical control is configured by someone, changed by someone and reviewed by nobody unless a process says otherwise. Policies set the standard, change management keeps configurations inside it, access reviews remove stale rights and training reduces mistakes. That is why a control framework such as ISO/IEC 27001 or NIST SP 800-53 includes management and operational families next to the technical ones.","kw":["technical (logical) control","managerial (administrative) control","operational control","security policy","change management","access review","security awareness training","ISO/IEC 27001 Annex A","NIST SP 800-53","control baseline"]}];

  /* ---------------- artefact rendering ---------------- */

      }).join("\n");
      return head + "<pre class=\"code\">" + cl + "</pre></div>";

    return head + '<pre class="code">' + a.lines.map(esc).join("\n") + "</pre></div>";
