{id:'H1',th:0,ty:'multi',tt:'The auditor who also sells to you',pts:4,
sc:'Greenfield Bank hired BrightPath Consulting for its yearly external audit. BrightPath also manages Greenfield’s SIEM — a contract worth 40% of BrightPath’s local revenue — and three of the audit team members helped configure that SIEM last year.',
q:'Select every concern that is valid and should be raised.',
d:{c:[
 {t:'Auditor independence is impaired: the firm would review work its own people performed',ok:true},
 {t:'The audit committee must be told about the conflict before fieldwork starts',ok:true},
 {t:'The cleanest fix is handing the audit to a firm with no role in the SIEM',ok:true},
 {t:'No issue exists: large firms can never have conflicts of interest',ok:false},
 {t:'It is fine if the engineers who built the SIEM audit its controls themselves',ok:false}]},
h:'The phrase to hold onto is self-review: nobody reliably audits their own work.',
x:'Self-review is a classic independence threat: the firm would judge controls its own consultants built, paid from the same contract. The audit committee owns oversight, so the conflict goes to them first. Transferring the audit to an uninvolved firm removes the threat completely. “Big firms have no conflicts” and “builders audit their own work” are both wrong — the second is exactly the problem. This is the same independence logic that separates internal audit from external and third-party audit work.'},
{id:'H2',th:2,ty:'multi',tt:'Authorized tester or real intruder?',pts:4,
log:{lines:[
 '10:05 vpn-gw auth SUCCESS user=pentest-lab src=45[.]33[.]22[.]11',
 '23:40 vpn-gw auth SUCCESS user=pentest-lab src=198[.]51[.]100[.]66',
 '23:41 vpn-gw auth SUCCESS user=pentest-lab src=198[.]51[.]100[.]66',
 '23:44 file-srv access user=pentest-lab path=\\\\fs01\\payroll']},
sc:'RoE for the Halberd engagement: attack window 09:00–17:00 UTC, and the only approved source host is 198[.]51[.]100[.]66 (the whitelisted attack box). You are the SOC analyst reviewing overnight activity the next morning.',
q:'Select every conclusion that is defensible.',
d:{c:[
 {t:'The 23:40 activity sits outside the window and outside the rules until confirmed',ok:true},
 {t:'The 10:05 login came from an unapproved source — possibly a real intrusion',ok:true},
 {t:'Both sessions are fine because a tester may work from any IP they like',ok:false},
 {t:'The 10:05 login must be the tester since it happened inside the window',ok:false}]},
h:'The RoE pins down two things: the clock and the source address. Check both lines against both.',
x:'The 10:05 login is inside the window but from the wrong source address, and the 23:40 session is from the right address but far outside the window — neither matches the RoE, so both deserve suspicion until the provider confirms. “Any IP is fine” and “the window makes it safe” are the traps: the RoE binds time and source together, and real attackers often mimic test accounts. Call the escalation contact, preserve the logs, and treat the unexplained session as an incident until proven otherwise.'},
{id:'H3',th:1,ty:'dnd',tt:'Attestation nuance, four buyers',pts:4,
sc:'Four prospects ask NimbusCloud for assurance documents in the same week. The wording of each request is subtly different, and the wrong document burns goodwill.',
q:'Drag each request to the document that truly fits.',
d:{slots:['SOC 2 Type I','SOC 2 Type II','Bridge letter','SOC 3'],items:[
 {t:'“We need a report on how the controls were designed, as of this month.”',slot:0},
 {t:'“We need the auditor’s opinion on operating effectiveness across nine months.”',slot:1},
 {t:'“Your last report ended in September; we need current assurance today.”',slot:2},
 {t:'“We just want a public summary to shortlist you, no sensitive detail.”',slot:3}]},
h:'Design-at-a-date, tested-over-a-period, gap-filler, public teaser — four different jobs.',
x:'Type I opines on design at a single point in time. Type II adds testing of operating effectiveness over a period, which is what “across nine months” asks for. A bridge letter carries assurance forward between report dates, which fits the September gap. SOC 3 is the public, detail-free summary. Buyers rarely know the difference, so the provider who picks correctly for them saves everyone a rewrite.'},
{id:'H4',th:2,ty:'fib',tt:'RoE amendment under pressure',pts:5,
sc:'Mid-engagement, the partner organization complained about scanning, and the client asked for an amended RoE the same day. You are reviewing the amendment text.',
q:'Fill each blank with the right word from the bank.',
d:{txt:'The amendment adds 203[.]0[.]113[.]224/28 to the [0] list after the partner complained. Any finding that could stop production must be reported [1] through the [2] hotline. Verbal approvals are void; only [3] sign-off changes the scope. The engagement cannot close until a final [4] confirms the fixes.',
bank:['out-of-scope','immediately','escalation','written','retest'],ans:[0,1,2,3,4]},
h:'Two blanks are safety rails, one is a speed requirement, one is about who may sign, one closes the engagement.',
x:'Amendments are how a RoE stays honest while reality moves. The partner range becomes explicitly out-of-scope, so no tester can claim confusion. Production-risk findings go to the escalation hotline immediately, not in the weekly call. Only written sign-off changes scope — a hallway “yes” protects nobody. And the retest at the end verifies that fixes hold before closure. If a client pushes back on any of these five lines, that pushback is itself worth documenting.'},
{id:'H5',th:4,ty:'term',tt:'Enumerate and keep the record',pts:5,
sc:'This engagement is partially known: you have the external range and the app list, but no credentials and no diagrams. On host 198[.]51[.]100[.]44 you must find which TCP services answer, and keep a machine-readable record of the whole run for the report appendix.',
q:'From the attack box, enumerate the open TCP services on 198[.]51[.]100[.]44 and save the run’s results to a file, using the tool and flags of your choice. Run it with Enter, then Check.',
d:{banner:'analyst@lab:~$ goal: enumerate open TCP services on the target and persist the output of the run',
sim:'Discovered open ports:\n22/tcp   open  ssh\n80/tcp   open  http\n443/tcp  open  https\n(result file written for the appendix)',
acceptAny:[['nmap','oN|oA|oX|oG'],['nmap','>'],['nmap','tee']],show:'A service/port enumeration of 198[.]51[.]100[.]44 (for example with nmap) that also saves its output — an -oN/-oA/-oX style flag, or a shell redirect / tee.'},
h:'Think of the de-facto standard enumeration tool, and of the flag family that writes output files.',
x:'The expected shape is an nmap run that both scans the target and saves output: any of -oN, -oA or -oX writes a file you can attach to the report, and a shell redirect or tee into a file meets the same goal. In a partially known environment you enumerate first and exploit later — the saved record is your proof of what was open and when. A command that scans but saves nothing fails the operational goal, because the report appendix would have no artifact.'},
{id:'H6',th:2,ty:'order',tt:'Close-out under audit',pts:6,
sc:'The engagement is ending and the client’s own auditor will review how Halberd closed it out. Your lead wants the close-out done in the defensible order, nothing skipped.',
q:'Put the six close-out steps in order (1 = first).',
d:{items:[
 'Confirm findings and capture the final evidence',
 'Remove persistence and planted artifacts from every host',
 'Restore any settings that testing changed',
 'Destroy or return captured data as the RoE requires',
 'Hold the debrief with the client team',
 'Deliver the report and schedule the retest']},
h:'Evidence first, destruction of planted things second, the client conversation before the paper.',
x:'Close-out runs in a strict order so the client can verify each step. First you finish collecting proof, because once cleanup starts, the evidence changes. Then artifact removal begins: persistence, tools, accounts. Settings are restored so the environment matches the pre-test state, and captured data is destroyed or returned as the RoE promised. The debrief happens while memories are fresh, and the report plus retest schedule closes the engagement. Doing the debrief before cleanup, or deleting data before evidence is fixed, are the traps auditors look for.'},
{id:'H7',th:0,ty:'multi',tt:'What weakens an internal audit',pts:4,
sc:'Greenfield Bank’s internal audit team reviewed its own payroll process (a SOX-style control test). The audit committee asks you to review the review. Five facts surfaced.',
q:'Select every fact that genuinely weakens the audit’s reliability.',
d:{c:[
 {t:'The lead auditor tested a payroll control she designed herself last year',ok:true},
 {t:'One piece of evidence is a screenshot with no timestamp and no source',ok:true},
 {t:'The sample was drawn only from records the process owner recommended',ok:true},
 {t:'The team used the COSO framework as the control baseline for testing',ok:false},
 {t:'The auditors are full-time employees of the bank itself, not contractors',ok:false}]},
h:'One fact is about self-review, one about traceable evidence, one about who picked the sample. Two facts are normal.',
x:'Self-review — auditing your own design — is the textbook independence problem. Evidence without timestamp or source cannot be traced, so it proves nothing under SOX-style standards. And a sample chosen by the process owner is curated, not random; the audit sees only what the owner wants seen. Using COSO as a baseline is standard practice, and internal auditors are by definition employees — their value comes from reporting to the audit committee, not from being outsiders. Three facts damage the audit; two do not.'},
{id:'H8',th:5,ty:'spot',tt:'Report lines a reviewer would strike',pts:4,
sc:'You are peer-reviewing the draft report of a fellow pentester before it ships to the client. A reviewer would strike two of these lines.',
q:'Click the two problematic lines.',
d:{lines:[
 'Finding F-07 — timeline: first exploited 2026-05-11 14:02 UTC',
 'Risk: Critical — because the CEO is personally worried about this host',
 'PoC: the exploit worked; full details available on request',
 'Fix: parameterize the database queries and add a WAF rule for the parameter',
 'Affected asset: search.internal.example (in scope per RoE Appendix A)',
 'Retest window offered: two weeks after fix deployment'],
bad:[1,2]},
h:'One line rates risk by opinion. One line promises the proof later.',
x:'A risk rating must come from impact and exploitability — “the CEO is worried” is neither, and ratings built on feelings collapse in the debrief. “Details available on request” is not a proof of concept: a PoC must be reproducible from the report itself, or the client’s own auditors cannot verify the finding. The other lines are exactly right: a timestamped timeline, a concrete fix, a scoped asset, and a retest window. Reports are read by hostile reviewers; every line must stand on its own.'},
{id:'H9',th:2,ty:'branch',tt:'Out-of-scope temptation',pts:4,
sc:'Week two of an authorized test. The RoE scope is a /24 and three apps. Everything else is out of scope, with an escalation contact on call.',
q:'Choose the best action at every step.',
d:{steps:[
 {q:'You find 192[.]0[.]2[.]50 — not in the RoE — running an open, unauthenticated database. Do you?',c:[
   {t:'Stop, document it, and notify the escalation contact per the RoE',ok:true,fb:''},
   {t:'Exploit it: it is clearly vulnerable and clearly a finding',ok:false,fb:'Out of scope means out of bounds, however juicy the target looks.'},
   {t:'Ask a friend at the partner firm to quietly check it',ok:false,fb:'You just deputized an unauthorized test on another company.'},
   {t:'List it as in-scope in your report without telling anyone',ok:false,fb:'That is falsifying the engagement record.'}]},
 {q:'Your next exploit chain on an in-scope host might corrupt a production database. What now?',c:[
   {t:'Halt the chain, note the impact risk, and alert the emergency contact',ok:true,fb:''},
   {t:'Continue, just more slowly and more carefully',ok:false,fb:'A known production-impact risk needs the client’s decision, not yours.'},
   {t:'Restore the database yourself if it breaks',ok:false,fb:'You are not the recovery owner, and your restore could hide the damage.'},
   {t:'Delete your log entries showing the attempt',ok:false,fb:'Destroying the client’s records is never in the mandate.'}]},
 {q:'You obtain domain-admin access three days early. The RoE says stop at user level until phase two. Do you?',c:[
   {t:'Stop, document the access, and request written approval to continue',ok:true,fb:''},
   {t:'Push on — domain admin was the obvious goal anyway',ok:false,fb:'The RoE staged the engagement for safety; early escalation breaks it.'},
   {t:'Deploy persistence so the access survives the pause',ok:false,fb:'Unapproved persistence is exactly what close-out must remove.'},
   {t:'Email the client’s marketing team to celebrate',ok:false,fb:'Wrong channel, wrong audience, and it discloses test results.'}]},
 {q:'The client asks you to skip the retest and just mark the findings fixed. Answer?',c:[
   {t:'Explain the report stays open until an independent retest verifies the fixes',ok:true,fb:''},
   {t:'Mark them fixed to be helpful',ok:false,fb:'You would be certifying work you never verified.'},
   {t:'Hand the client your exploit scripts to self-verify',ok:false,fb:'Client staff running your exploits is an unauthorized test.'},
   {t:'Backdate the report to before the findings',ok:false,fb:'That is fraud, full stop.'}]}]},
h:'The fence, the blast radius, the staging, and the signature — four places a test is won or lost.',
x:'Every step here trades short-term temptation against the RoE. Out-of-scope targets stay out of bounds no matter how vulnerable, and the right move is documentation plus escalation. When your actions might damage production, the client decides — through the emergency contact — not you. Access levels are staged in the RoE for a reason: privilege escalation beyond the stage you are in — early domain admin — means stop, document, and ask in writing, and pivoting is legitimate only while the next hop stays in scope. Every post-exploitation move is judged against the RoE, and a retest is what turns “we fixed it” into verified closure. Testers who internalize these four calls are trusted with bigger engagements.'},
{id:'H10',th:1,ty:'qcm',tt:'The January assurance gap',pts:3,
sc:'NimbusCloud’s SOC 2 Type II report covers October 2024 through September 2025. A prospect signs a contract in January 2026 and their auditor asks for “current” assurance before go-live.',
q:'What is the professional response?',
d:{c:[
 {t:'Issue a fresh Type I report immediately, written in-house by the IT team',ok:false},
 {t:'Send a screenshot of the current security status dashboard as proof',ok:false},
 {t:'Provide the Type II report plus a bridge letter covering the gap to January 2026',ok:true},
 {t:'Explain that no assurance can exist until next October’s report lands',ok:false}]},
h:'The report is real but stale; there is a standard artifact for exactly this gap.',
x:'A bridge letter extends the report’s coverage to the present: it lists system changes since the period end and states whether controls stayed effective. Combined with the Type II report it gives the prospect’s auditor current, defensible assurance. An in-house “fresh Type I” is not an attestation at all, a dashboard screenshot is evidence of nothing, and refusing until October ignores the standard tool made for this situation.'},
{id:'H11',th:1,ty:'dnd',tt:'Trust Services Criteria, near-miss edition',pts:5,
sc:'You are preparing NimbusCloud for its SOC 2 Type II fieldwork. The auditor sent five control descriptions that must each map to one criterion — two of the pairs are deliberate near-misses.',
q:'Drag each control to its criterion.',
d:{slots:['Security','Availability','Processing integrity','Confidentiality','Privacy'],items:[
 {t:'Hardened patch baseline enforced on every server',slot:0},
 {t:'UPS and generator keep the platform online through grid failures',slot:1},
 {t:'Order totals are computed and charged exactly once',slot:2},
 {t:'Trade-secret documents are encrypted at rest',slot:3},
 {t:'Users can request deletion of their personal data',slot:4}]},
h:'System protection, staying online, correct processing, company secrets, people’s data rights.',
x:'The patch baseline is Security — protecting the system itself. The UPS and generator work is Availability. Charging exactly once is Processing integrity: complete, accurate, on time. Encryption of trade secrets is Confidentiality, because the information belongs to the company. Deletion requests are Privacy, because personal data belongs to people, who hold rights over it. The near-miss trap is confidential versus private: company secrets versus personal data. On the exam, find who owns the information and the criterion follows.'},
{id:'H12',th:5,ty:'order',tt:'Rank like an assessor',pts:5,
sc:'Five findings from a partially known external test. The client’s change board meets in an hour; your ranking must reflect real-world risk, not scanner scores alone.',
q:'Arrange the findings from highest real-world risk (1) to lowest (5).',
d:{items:[
 'Unauthenticated remote code execution on the border VPN, active exploitation reported in the wild',
 'SMBv1 still enabled on an internal domain controller',
 'Forgotten test server with default credentials, reachable only from the corporate LAN',
 'Admin panel behind MFA that lacks rate limiting on the login',
 'Laptops with an outdated browser patch level']},
h:'Reachability and in-the-wild exploitation outweigh theoretical severity.',
x:'The border VPN with active exploitation is first: it is reachable from anywhere and already being attacked. SMBv1 on a domain controller is next — one internal foothold turns it into domain takeover. The default-credential test server is real but fenced behind the LAN. The MFA-protected panel without rate limiting is a slow online-guessing risk. Outdated browsers are a hygiene issue pending a phishing attempt. A vulnerability scan would rank some of these by CVSS alone; assessment work adds exposure, exploit availability and business context.'},
{id:'H13',th:4,ty:'text',tt:'Where recon became exploitation',pts:4,
log:{lines:[
 'L1 03:58 GET /.env 404 from 198[.]51[.]100[.]9',
 'L2 03:58 GET /phpmyadmin/ 404 from 198[.]51[.]100[.]9',
 'L3 03:59 GET /wp-admin/ 403 from 198[.]51[.]100[.]9',
 'L4 04:01 GET /robots.txt 200 from 198[.]51[.]100[.]9',
 'L5 04:03 POST /login.php user=admin\'-- 401 from 198[.]51[.]100[.]9',
 'L6 04:03 POST /login.php user=admin\'-- 302 from 198[.]51[.]100[.]9',
 'L7 04:04 POST /api/export?token=bypass 200 from 198[.]51[.]100[.]9',
 'L8 04:04 GET /favicon.ico 200 from 203[.]0[.]113[.]8']},
sc:'You are the analyst on the Brightline web server. The lines below arrived overnight from one source address. Your incident report needs the earliest line that shows the attacker achieved successful exploitation rather than just probing.',
q:'Type the line ID of the earliest clear evidence of successful exploitation (format: L7).',
d:{acceptAll:['^L?7$'],ph:'L…',show:'L7 — the 200 response on /api/export?token=bypass proves the bypass worked.'},
h:'Probes get error codes. Successful exploitation gets the attacker what they asked for.',
x:'L1–L4 are reconnaissance: footprinting the web tier by probing common paths and reading public files, answered by errors. L5–L6 show an injection attempt against the login — the 302 on a tampered login suggests something changed, but the earliest unambiguous proof of success is L7, where the export API returns 200 to a bypassed token. L8 is unrelated traffic from a different address. Drawing the recon-versus-exploitation boundary precisely like this is what makes an incident timeline credible.'},
{id:'H14',th:2,ty:'multi',tt:'Unknown environment, hard limits',pts:4,
sc:'RoE for an unknown-environment engagement states three hard limits: no denial-of-service, no exfiltration of production data, and no social engineering of call-center staff.',
q:'Select every action that stays compliant.',
d:{c:[
 {t:'Fingerprint the edge firewall by reading its banner responses',ok:true},
 {t:'Prove data access with one screenshot, then destroy the file per the RoE',ok:true},
 {t:'Run a traffic-stress tool to see whether the cluster autoscales',ok:false},
 {t:'Register a look-alike domain and phish the receptionists',ok:false},
 {t:'Copy the customer table to your own laptop for offline analysis',ok:false}]},
h:'Each hard limit kills exactly one option; the compliant ones are the quiet and reversible ones.',
x:'Banner reading is quiet fingerprinting — pure active recon, allowed. One screenshot with prompt destruction is the standard way to prove access without exfiltrating data. The stress tool is denial-of-service by another name. Phishing receptionists is social engineering of call-center staff, banned twice over in spirit and letter. Copying the customer table off-site is textbook exfiltration. In an unknown environment, where you know least about the blast radius, the limits exist precisely because surprises are guaranteed.'},
{id:'H15',th:1,ty:'fib',tt:'Right report, right reader',pts:5,
sc:'Four people at one prospect ask NimbusCloud for assurance in the same email thread. Each needs a different artifact, and you must route them correctly.',
q:'Fill the blanks to route each request.',
d:{txt:'The finance auditors need assurance over payroll controls, so they receive a [0]. The security team wants detailed evidence over security and availability, so they receive a [1]. The CEO only wants a public summary, so they receive a [2]. After the PCI DSS assessment, the [3] signs the [4] for the merchant.',
bank:['SOC 1','SOC 2','SOC 3','QSA','AoC'],ans:[0,1,2,3,4]},
h:'Money process, control detail, public summary, the assessor’s licence, the signed document.',
x:'SOC 1 serves financial-audit readers, because its scope is controls relevant to financial reporting such as payroll. SOC 2 serves security reviewers with detail over the Trust Services Criteria. SOC 3 is the public summary for executives and shortlisting. In the PCI DSS world, the qualified assessor — the QSA — performs the assessment and signs the Attestation of Compliance. Routing the same “we need assurance” question to four different documents is the daily work of attestation.'},
{id:'H16',th:2,ty:'dnd',tt:'Cleanup versus deliverable',pts:6,
sc:'The test is over and the client asks: “what do you remove, and what do we get to keep?” Answer by sorting the artifacts.',
q:'Drag each artifact to where it belongs at close-out.',
d:{slots:['Remove from client systems','Keep and hand over in the report'],items:[
 {t:'Reverse-shell binary dropped on three hosts',slot:0},
 {t:'Local admin account “pentest-admin” you created',slot:0},
 {t:'Hosts-file entry you added to redirect updates',slot:0},
 {t:'Screenshots proving the exploitation chain',slot:1},
 {t:'The written exploit-chain walkthrough',slot:1},
 {t:'IoC list: hashes, paths and the usernames you used',slot:1}]},
h:'Planted things leave; proof and detection material stay.',
x:'Everything the tester planted on client systems must go: the reverse shells, the created account, the modified hosts file — leftover access is a real vulnerability and a cleanup failure. The report keeps the proof: screenshots, the exploit walkthrough, and the IoC list, which lets the blue team hunt for any access the test may have missed. “Artifacts” cuts both ways — what you planted is your responsibility to remove, and what you documented is your deliverable to hand over.'},
{id:'H17',th:0,ty:'branch',tt:'Integrity pressure in the audit',pts:3,
sc:'You are the fieldwork lead on Greenfield Bank’s compliance audit. Three moments will test your independence and your nerve.',
q:'Choose the best action at every step.',
d:{steps:[
 {q:'Mid-audit, the CFO offers you paid “consulting work on the side”. Do you?',c:[
   {t:'Decline and disclose the offer to the audit committee',ok:true,fb:''},
   {t:'Accept but promise yourself to stay neutral',ok:false,fb:'The threat is created by accepting, not by feeling neutral.'},
   {t:'Accept only after the audit ends',ok:false,fb:'A deferred gift still buys goodwill and undermines independence.'},
   {t:'Bill it discreetly through the client',ok:false,fb:'That is concealment on top of the conflict.'}]},
 {q:'A control owner hands you a test log with visible timeline gaps. Do you?',c:[
   {t:'Corroborate with a second independent source and record the exception',ok:true,fb:''},
   {t:'Accept it — their word is good enough',ok:false,fb:'Evidence that fails inspection cannot support a control conclusion.'},
   {t:'Accuse them of fraud in the team chat',ok:false,fb:'The finding is “unreliable evidence”, not a solved crime.'},
   {t:'Drop the control from your sample',ok:false,fb:'Removing the control hides the problem instead of reporting it.'}]},
 {q:'The final report will embarrass a senior leader. Do you?',c:[
   {t:'Report the facts as found; the audit committee owns the outcome',ok:true,fb:''},
   {t:'Soften the rating from Critical to Low',ok:false,fb:'That is altering findings under pressure — a falsified report.'},
   {t:'Delete the finding entirely',ok:false,fb:'Suppression, the most serious audit failure there is.'},
   {t:'Give the leader a private verbal note instead',ok:false,fb:'Verbal-only findings leave no accountable record.'}]}]},
h:'Independence, evidence quality, and factual reporting — in that order, every time.',
x:'Auditor integrity survives on three habits. Independence: gifts and side work — offered, accepted, or deferred — go to the audit committee, not into your pocket. Evidence: logs that fail inspection are corroborated from a second source and recorded as an exception, not argued about in chat channels. Factual reporting: findings are reported as found, and softening, deleting or privatizing them converts an audit into a cover story. These branch points are exactly what professional bodies examine when audits go wrong.'},
{id:'H18',th:3,ty:'qcm',tt:'Caught in the server room',pts:3,
sc:'During an authorized physical test you pull off badge cloning, tailgating past the man-trap into the data center, and photograph an unlocked cage. A guard stops you and asks who you are.',
q:'What is the correct first move?',
d:{c:[
 {t:'Show the RoE contact card and follow the agreed escalation path',ok:true},
 {t:'Run — the signed RoE covers any escape from the guards',ok:false},
 {t:'Deny everything and keep the cloned badge as a souvenir',ok:false},
 {t:'Post the photos online as proof of the physical finding',ok:false}]},
h:'The RoE anticipated this moment and gave you a card for it.',
x:'Every professional physical test includes an escalation card: who to call, what to say, and how the client verifies you in minutes. Showing it converts a security incident into a scheduled test event. Running turns a legal engagement into a police matter, denying everything destroys the engagement’s credibility, and posting photos leaks the client’s physical controls to the world. The test measures controls — but the moment you are caught, the RoE is what protects everyone.'},
{id:'H19',th:0,ty:'spot',tt:'The external audit request draft',pts:4,
sc:'A junior manager drafted the request-for-proposal for Greenfield’s first external audit of its cloud vendor. Legal will bounce two of these lines.',
q:'Click the two lines that must be fixed.',
d:{lines:[
 'RFP draft — external audit of NimbusCloud services',
 'We will let NimbusCloud’s ops team audit the SLA reports they produced themselves, to save time',
 'Period under review: fiscal year 2026',
 'Sampling: twenty-five records per control, drawn at random by the audit firm',
 'Evidence access: the audit firm may copy any file, including all employee personal data, without limits',
 'Deliverable: report addressed to the audit committee'],
bad:[1,4]},
h:'One line destroys independence. One line ignores data protection limits.',
x:'Letting the vendor’s own team audit its own output is self-review — the external audit exists precisely to bring independence, so the audit firm must draw its own evidence. “Any file, all employee personal data, without limits” ignores data-protection principles: audits take evidence that is relevant and minimal, with GDPR-style handling rules, not blanket copying. The other lines are textbook: a defined period, random sampling, and a report addressed to the audit committee so the readers own the oversight.'},
{id:'H20',th:3,ty:'dnd',tt:'Offensive, defensive or integrated?',pts:6,
sc:'Greenfield’s security manager must label six planned activities correctly for the budget review — the labels decide which line item funds each one.',
q:'Drag each activity to its testing mode.',
d:{slots:['Offensive','Defensive','Integrated (purple)'],items:[
 {t:'Emulate a known criminal group’s tradecraft end to end against the estate',slot:0},
 {t:'Chain phish to C2 to domain admin to prove real impact',slot:0},
 {t:'Validate that the EDR blocks a known loader, then tune the rule',slot:1},
 {t:'Threat-hunt for living-off-the-land binaries after an exercise',slot:1},
 {t:'Deploy deception canaries, then tune detections from the red team’s paths',slot:2},
 {t:'Red runs the attack while blue watches live and both debrief together',slot:2}]},
h:'Attacking, hardening, or both at once with shared feedback.',
x:'Offensive work attacks: emulating adversary tradecraft and chaining phish to domain admin proves what a real attacker could do. Defensive work hardens: validating EDR detections and threat-hunting are blue-team muscle. Integrated means the two sides work together — canaries placed from the red team’s observed paths, and live sharing with a joint debrief — so every attack becomes a detection lesson the same day. Budget lines that confuse these modes fund the wrong work.'},
{id:'H21',th:4,ty:'multi',tt:'Red view: you have been seen',pts:4,
sc:'You are the red team. Mid-scan, blue announces on the shared channel that they detected your SYN sweep and are watching. The RoE allows stealth testing and forbids damaging or disabling defenses.',
q:'Select every realistic adjustment that stays inside the RoE.',
d:{c:[
 {t:'Slow the scan down and spread it across the remaining attack window',ok:true},
 {t:'Shift probing to protocols and ports the blue team is not watching yet',ok:true},
 {t:'Overwhelm the SIEM with noise so alerts become useless',ok:false},
 {t:'Delete the blue team’s log storage to hide your tracks',ok:false},
 {t:'Abandon stealth and scan everything at maximum speed',ok:false}]},
h:'Evasion is patience and variety — not destruction, and not panic.',
x:'Evasion, done legally, is about shape and timing: slowing traffic blends into baseline noise, and moving to unwatched protocols tests detection coverage from a new angle. Blinding the SIEM or deleting logs attacks the defenses themselves, which the RoE forbids and which destroys the exercise’s value — the client paid to learn what blue can and cannot see. Scanning at maximum speed after being seen simply confirms their detection works and ends the stealth phase of the test.'},
{id:'H22',th:3,ty:'multi',tt:'Blue view: proportionate response',pts:4,
sc:'Same event, defense side. Your sensors flagged the red team’s scan; the RoE confirms an authorized exercise is running this week. Your manager wants “proportionate first steps”, not heroics.',
q:'Select every proportionate response.',
d:{c:[
 {t:'Verify the source and timing against the RoE before escalating',ok:true},
 {t:'Tune detection and watch for the next stage: web probes and auth attempts',ok:true},
 {t:'Wipe the DMZ hosts immediately to cut the attacker off',ok:false},
 {t:'Counter-attack the scanning source with your own exploits',ok:false},
 {t:'Disable all remote access company-wide for a week',ok:false}]},
h:'Verify, sharpen, observe. Everything else breaks things the business needs.',
x:'Proportionality means the response fits an authorized test: verify the activity against the RoE, sharpen detections, and observe the next stage — that is exactly the intelligence the exercise exists to produce. Wiping hosts destroys evidence and the business’s own servers. Counter-attacking is illegal against systems you do not own and pointless against your own red team. A week-long remote-access shutdown punishes the whole company for a scheduled test. Blue teams earn their name by being measured, not loud.'},
{id:'H23',th:5,ty:'fib',tt:'The remediation plan that closes',pts:4,
sc:'The client accepted the findings and asked for the remediation section template. You build it so nothing can quietly die in a backlog.',
q:'Fill the blanks in the template.',
d:{txt:'Each finding receives a [0] so teams fix the worst first, a named [1] who answers for the fix, and a deadline tracked in the [2]. After the fixes land, an independent [3] verifies them before the finding is closed.',
bank:['severity','owner','corrective action plan','retest'],ans:[0,1,2,3]},
h:'What to fix first, who answers, where it is tracked, and how it is verified.',
x:'A remediation recommendation that closes findings needs four elements. Severity orders the queue so critical fixes are not stuck behind cosmetic ones. A named owner prevents the “somebody should fix this” trap. The corrective action plan is the tracked commitment — dates, steps, status — that auditors ask for by name. And an independent retest is what turns “deployed” into “verified closed”. Remove any of the four and findings drift: no priority, no owner, no tracking, or no proof.'},
{id:'H24',th:3,ty:'multi',tt:'Bounty versus pentest, honestly',pts:4,
sc:'Greenfield’s board asks whether a bug bounty can replace the annual penetration test. You brief them on the honest trade-offs.',
q:'Select every statement that is accurate.',
d:{c:[
 {t:'A bounty pays only for valid, in-scope reports; quality varies and triage takes staff time',ok:true},
 {t:'A private pentest brings fixed dates, a defined scope and a report auditors accept',ok:true},
 {t:'Switching to a bounty removes the need for any internal control testing',ok:false},
 {t:'Pentest findings are always more accurate because testers work for the client',ok:false},
 {t:'A public bounty guarantees every critical bug is found within thirty days',ok:false}]},
h:'One statement about how bounties really work, one about what pentests really deliver. The rest are sales talk.',
x:'Bounties work on reward for valid, in-scope findings — which means variable quality and real triage effort, not guaranteed coverage — and they run on responsible disclosure, which gives the vendor time to fix before anything is published. Private pentests deliver predictability: dates, scope, and a professional report with evidence that external auditors accept. Neither replaces control testing, and pentest testers are usually external specialists, not client staff, so “always more accurate” is false. And nothing in security “guarantees” full discovery on a clock. Mature programs run both: pentest for depth on schedule, bounty for continuous variety.'},
{id:'H25',th:5,ty:'order',tt:'Evidence handling, end to end',pts:5,
sc:'The audit committee questioned how fieldwork evidence was handled last year. You are writing the new standard operating procedure — order it.',
q:'Put the five evidence steps in order (1 = first).',
d:{items:[
 'Request the evidence in writing, tied to each control objective',
 'Store it access-controlled and encrypted',
 'Test and sample it against the control objective',
 'Record exceptions as facts, without blame',
 'Follow up until every exception is closed']},
h:'Ask, protect, test, record, chase.',
x:'Evidence handling is a lifecycle. It starts with a written request tied to the control objective, so the auditor tests the right thing and the requester knows why. Once received, evidence is protected — access-controlled and encrypted — because audit files contain sensitive material. Testing and sampling then compare the evidence against the objective. Exceptions are recorded as observable facts, which keeps the report professional and defensible. Finally, follow-up chases every exception to closure, which is the step audits most often skip and most often regret.'},
{id:'H26',th:0,ty:'dnd',tt:'Attestation, certification, compliance audit',pts:6,
sc:'Three governance words get mixed up constantly. Six real-world events land on your desk; file each under the right mechanism.',
q:'Drag each event to the mechanism it belongs to.',
d:{slots:['Attestation (SOC/SSAE)','Certification (ISO)','Compliance audit (regulation-driven)'],items:[
 {t:'A CPA firm issues an opinion on service controls under SSAE 18',slot:0},
 {t:'A registrar grants a three-year ISO 27001 certificate with yearly surveillance',slot:1},
 {t:'An internal team reviews practices against GDPR, HIPAA and PCI DSS requirements',slot:2},
 {t:'A SOC 2 Type II opinion letter arrives for the managed platform',slot:0},
 {t:'A QSA completes a PCI DSS Review of Compliance for the merchant',slot:2},
 {t:'The registrar’s year-two surveillance visit re-checks the ISMS',slot:1}]},
h:'Who issues it and against what: a CPA opinion, a registrar certificate, or a regulation checklist.',
x:'Attestation is a CPA firm’s formal opinion — SOC 1 and SOC 2 under SSAE 18, AICPA rules. Certification is a registrar’s certificate after an ISO audit, maintained by yearly surveillance visits. A compliance audit checks practice against a regulation or card-brand rulebook — GDPR, PCI DSS — whether internal or by a QSA whose RoC supports the AoC. The mix-up usually happens because all three produce documents: what separates them is who signs and against which body of requirements.'},
{id:'H27',th:5,ty:'multi',tt:'The evidence vault log',pts:4,
log:{lines:[
 '2026-05-12 09:14 auditor_rkim OPEN /evidence/payroll-sample.xlsx',
 '2026-05-12 09:20 sysadmin_jdoe COPY /evidence/payroll-sample.xlsx to /tmp',
 '2026-05-12 14:02 audit_lead LIST /evidence (read-only index)',
 '2026-05-12 23:51 auditor_rkim EXPORT /evidence/ALL.zip to personal-cloud',
 '2026-05-13 08:00 auditor_rkim OPEN /evidence/po-sample.xlsx']},
sc:'Only named auditors may open the evidence vault, nothing may leave it, and reads are logged. You are reviewing the access log below after the finance director noticed odd activity.',
q:'Select every line that violates the vault rules.',
d:{c:[
 {t:'09:20 — sysadmin_jdoe copies payroll evidence out of the vault',ok:true},
 {t:'23:51 — an auditor exports the entire vault to a personal cloud drive',ok:true},
 {t:'09:14 — auditor_rkim opens the assigned payroll sample file',ok:false},
 {t:'14:02 — audit_lead lists the vault index in read-only mode',ok:false}]},
h:'Two rules: who may open, and nothing leaves. Judge each line against both.',
x:'The sysadmin is not an authorized auditor, and the copy moves evidence out of the vault — two violations in one line. The 23:51 export sends the entire evidence set to a personal cloud account, the most serious breach in the log: sensitive audit material outside controlled storage. A named auditor opening an assigned file, and a read-only index listing, are both normal vault use. Logs like this are exactly why evidence handling rules pair access control with audit trails — the vault enforces the policy even when people do not follow it.'},
{id:'H28',th:2,ty:'multi',tt:'What makes a RoE hold up',pts:4,
sc:'A startup’s “RoE” is one email: “have fun, be careful”. The client’s lawyer asks you what a legally and operationally sufficient RoE actually contains.',
q:'Select every element that genuinely strengthens a RoE.',
d:{c:[
 {t:'A named approval authority with signature and date',ok:true},
 {t:'An explicit out-of-scope list, not just in-scope targets',ok:true},
 {t:'An emergency stop procedure with after-hours contacts',ok:true},
 {t:'A clause letting testers attack anything that is reachable',ok:false},
 {t:'An NDA signed only after the testing has already started',ok:false}]},
h:'Three elements add certainty; two elements remove it.',
x:'A named, dated signature makes authorization enforceable — you know exactly who approved what. An explicit out-of-scope list closes the gaps that in-scope lists leave, and a no-contact rule shields neighbor systems that must never receive a single packet. An emergency stop procedure with after-hours contacts is the difference between a contained incident and a disaster. “Anything reachable” is the opposite of scope — it is the vague clause lawyers strike first. And an NDA signed after testing begins protects nobody: confidentiality must exist before the first packet.'},
{id:'H29',th:4,ty:'qcm',tt:'What woke the IPS',pts:3,
sc:'Greenfield’s IPS raised its first alert at 03:12. Before it, the only activity against the target was reading public job postings, checking WHOIS records, browsing certificate-transparency logs, and one more thing that matters here.',
q:'Which act most likely triggered the alert, while the passive work never could?',
d:{c:[
 {t:'Reading the target’s published DNS records',ok:false},
 {t:'A SYN scan across the public address ranges',ok:true},
 {t:'Browsing the target’s marketing website',ok:false},
 {t:'Checking job ads for technology keywords',ok:false}]},
h:'Passive work never touches the target’s systems. One option does.',
x:'Alerts fire on packets that reach the target’s systems. A SYN scan sends connection attempts across the ranges, and IPS sensors are tuned to flag exactly that half-open pattern. Job ads, WHOIS, certificate logs and public DNS all come from third parties or published data — the target cannot see them, which is why they are passive reconnaissance and OSINT. The boundary between passive and active is not about intent or tools: it is whether your traffic arrives at their systems.'},
{id:'H30',th:5,ty:'multi',tt:'What the report may contain',pts:4,
sc:'A junior tester is enthusiastic about the final report and proposes five inclusions. Two are professional; three would create legal or privacy problems for the client and for Halberd.',
q:'Select every inclusion that is appropriate.',
d:{c:[
 {t:'An executive summary in plain language for leadership',ok:true},
 {t:'Methodology and limitations, so readers can judge the coverage',ok:true},
 {t:'IoCs — hashes, paths, usernames — so the blue team can hunt missed access',ok:true},
 {t:'Full unredacted customer PII dumps as proof of impact',ok:false},
 {t:'Personal notes listing client staff home addresses found via OSINT',ok:false}]},
h:'Proof yes, people no: the report proves compromise without hoarding personal data.',
x:'A professional report contains an executive summary, its methodology and limitations, and IoCs that let defenders hunt for anything the test missed. What it never contains is raw personal data: unredacted customer dumps prove nothing extra and create a new data breach inside the report itself, with GDPR consequences. OSINT notes about staff home addresses are private information with no control value — where red lines sit matters as much as what the test found.'}
];
boot();

    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,

      body: JSON.stringify({
