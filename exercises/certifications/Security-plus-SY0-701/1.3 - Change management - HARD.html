window.EXAM_QUESTIONS = [{"id":"H01","type":"mcq","theme":"Rogue change detection","points":10,"multi":true,"scenario":"Northwind Retail runs its payment systems inside the cardholder data environment, so PCI DSS change control applies. Ticket CHG-5502 was approved for one task only: restart the web service on web-pay-01 to clear a memory leak. The window was 01:00 to 02:00. The lines below come from the change record, the directory service, the file integrity monitor and the firewall.","art":{"title":"Window artefacts for CHG-5502","kind":"log","lines":["01:00:12  change   CHG-5502 restart started on web-pay-01","01:02:41  auth     svc-deploy logged on to dc-01 with a shared service account","01:03:05  auth     new account svc-backup2 created in the domain administrators group","01:04:22  fim      /etc/httpd/conf/httpd.conf hash changed","01:06:10  fim      /etc/sudoers.d/90-support hash changed","01:07:33  fw       rule added: allow 10[.]20[.]4[.]0/24 to pay-db-01 port 3389","01:58:02  change   CHG-5502 restart finished on web-pay-01","02:00:00  change   window closed by the duty manager"]},"question":"Which three facts show that the work went beyond the scope of the approved change request?","opts":["The operator used a shared service account instead of a named account","A new privileged account appeared in the domain admins group tonight","The restart began at 01:00 and finished at 01:58, inside the window","A firewall rule opened remote desktop from a wide internal range today","The ticket allowed one restart, so the sudoers edit is out of scope","The window closed at 02:00, exactly as the approved plan said it would"],"correct":[1,3,4],"whyEach":["Wrong as an answer to this question. The shared account is a real control weakness, but it says who worked, not what was changed beyond the scope.","Correct. Creating a privileged account was never part of a service restart. This is the clearest sign of scope creep.","Wrong. The start and end times match the plan, so they show the change stayed inside the window.","Correct. The new rule opens remote desktop to a whole internal range, and it appears nowhere in the request.","Correct. The ticket allowed one restart. Editing a privilege file is a second change that nobody approved.","Wrong. Closing on time is not scope creep. It is the plan being followed."],"hint":"Scope is about what was changed, not about who did it or when. Compare each artefact with the single task the ticket allowed.","why":"An approved change has a boundary: the work that the approver agreed to. Anything outside that boundary is an unauthorised change wearing an approved ticket. Here the restart was the approved task, and the restart was done. The new administrator account, the edited sudoers file and the firewall rule that opens remote desktop are three separate changes that no approver saw. The shared service account is serious too, because it hides the identity of the person behind the work, but it answers a different question. Scope creep is caught by comparing the artefacts with the ticket, line by line. The comparison is made during post-change validation, when the artefacts of the window are checked against the ticket line by line.","kw":["change request (RFC)","approval process","restricted activity","privileged access to production","audit trail","configuration baseline","segregation of duties","PCI DSS change control","maintenance window","post-change validation and monitoring"]},{"id":"H02","type":"branch","theme":"Incident and containment","points":10,"scenario":"You are the on-call security analyst at Northwind Retail. The change window closed two hours ago and something in it is still alive.","question":"Work through the containment decisions. Pick the best action at each step; the next step appears after you choose.","steps":[{"sit":"The account svc-backup2, created during CHG-5502, is still active and has just read a payroll share. The engineer who ran the window, D. Okafor, is on shift until 06:00 and holds the same administrator rights.","opts":["Call D. Okafor and ask him what the new account is for today","Disable the new account, end the session, then keep the evidence","Wait until the morning and raise a ticket with the identity team"],"correct":1,"res":["That warns the only suspect before any evidence is secured, and the account keeps working while you talk.","Correct. The account is the intruder's path, so it goes first, and the evidence is kept before anything else changes.","Every hour of delay gives an unknown account more time to read data, and the logs may roll over."]},{"sit":"The account is disabled and the session is closed. You must now establish exactly what it did.","opts":["Ask the engineer to sign in again so you can watch what he does","Read the logs on screen and write the interesting parts down by hand","Copy the authentication and file logs to the evidence store, hashed"],"correct":2,"res":["That is entrapment rather than investigation, and it destroys the value of the evidence you have.","Handwritten notes cannot be checked, and the live logs may be overwritten at any time.","Correct. A complete, hashed copy can be trusted later, even if the live logs rotate."]},{"sit":"The logs show the account read three payroll files. Your engineering manager asks you to keep the matter quiet until the project ships next week.","opts":["Report it to security management and HR, and keep the evidence","Agree to keep it quiet, so the team is not upset before the release","Delete the account quietly and tell nobody else about the finding"],"correct":0,"res":["Correct. A suspected insider case goes up the reporting line at once, with the evidence preserved.","That hides a suspected crime to protect a release date, and it puts you inside the cover-up.","Destroying the account removes the evidence of what it did, and the logs alone will not explain it."]}],"hint":"Contain the intruder's path first, keep a copy of the evidence before it rotates, and remember who is allowed to hear about an insider case.","why":"A suspicious change is an incident, not a change problem. The order is contain, preserve, investigate, report. Containment means removing the path the account uses, which is the account itself and the live session. Preservation means copying the logs and directory data to a store that will not rotate, with hashes to prove nothing changed. Only then does the careful work of reconstruction begin. Reporting follows the same day, because a suspected insider case is a matter for security management, legal and HR rather than for the project calendar.","kw":["segregation of duties","privileged access to production","audit trail","change owner","restricted activity"]},{"id":"H03","type":"terminal","theme":"Version control and release","points":10,"scenario":"The firewall review team wants to know which change introduced the rule that permits remote management from the whole corporate range, and what else that same change touched. The edge firewall configuration is kept in the team repository as firewall.conf, with the full history of every edit.","question":"Type the command that finds the commit which introduced the management rule and shows the change that commit made. Do not modify any file.","parts":[{"re":"^\\s*git\\b","label":"the version control tool is used","flags":"i"},{"re":"\\blog\\b","label":"the commit history is searched"},{"re":"(-S\\b|--pickaxe|--patch\\b[^|]*\\||-G\\b|-p\\b[^|]*\\|)","label":"the search looks for text that a commit added or removed"},{"re":"firewall\\.conf","label":"the search is limited to the firewall configuration file"}],"solution":"git log -p -S\"allow 10[.]20[.]4[.]0/24\" -- firewall.conf","hint":"Search the history for the text of the rule, and let the same command print the change it made. Limit the search to the one file.","why":"A rule that appears in a configuration file has a commit behind it, and that commit names the author, the time and the ticket. Searching the history for the text of the rule finds the commit that added or removed it, and printing the change shows what else travelled with it. This is how a version controlled configuration answers the two questions that matter in a review: who put this here, and what came with it. The evidence is stronger than a device log, because the history cannot be edited without leaving a mark of its own.","kw":["version control","release tag and commit history","firewall rule change","audit trail","change owner"]},{"id":"H04","type":"mcq","theme":"Rollback and recovery","points":10,"multi":true,"scenario":"Release 5.1 of the checkout service rolled out at 02:00 and broke the checkout page. The pipeline has an automatic rollback job. It ran, it reported success, and the checkout page was still broken at 02:40. The change board wants to know why the rollback did not restore the service.","art":{"title":"Deployment and rollback log - release 5.1","kind":"log","lines":["02:00:03  deploy   image=checkout:5.1  result=success","02:00:44  migrate  schema=checkout_v14  result=success  note=adds column payment_ref, not null","02:01:10  deploy   health=checkout  result=failed  http=500","02:01:12  rollback job=rollback-5.0  image=checkout:latest  result=success","02:01:40  verify   checkout  http=500  version reported=5.1","02:02:00  notify   on-call: rollback complete"]},"question":"Which three facts explain why the rollback did not restore the service?","opts":["The on-call engineer was notified at 02:02 by the pipeline itself","The rollback pulled the tag latest, which had been rebuilt with 5.1","The health check returned an HTTP 500 code from the web server","The migration added a column that the older application cannot fill","The rollback was never tested against a database already at 5.1","The migration step finished before the health check step started"],"correct":[1,3,4],"whyEach":["Wrong. A notification time says nothing about why the service stayed broken.","Correct. The tag latest is a moving label. Once it was rebuilt, the rollback pulled the broken code and reported success.","Wrong. A 500 response is the symptom. The question asks for the causes behind it.","Correct. A schema that only moves forward cannot be undone by older code, so the rollback could not work.","Correct. The plan was never rehearsed against the forward state, so it assumed a version of the database that no longer existed.","Wrong. That order is the design of the pipeline, not a fault."],"hint":"Look for the three hidden assumptions in the backout plan: what the code label points at, what the database now expects, and what was never rehearsed.","why":"A backout plan is a set of assumptions about the state you will return to. Three of those assumptions failed here. The image tag latest was a moving label, so the rollback restored code that no longer existed as version 5.0. The migration moved the schema forward and the older code cannot satisfy the new column, which is a backward compatibility problem. And the plan itself was never tested against a database in the new state, so it worked only in theory. A rollback job that reports success is reporting on its own steps, not on the service.","kw":["backout plan","rollback decision point","backward compatibility","infrastructure as code (IaC)","test results","release tag and commit history"]},{"id":"H05","type":"mcq","theme":"Vendor and third-party change","points":10,"scenario":"At 09:00 the network team notices that every edge appliance now reports firmware version 9.4.2-C. The vendor pushed it at 03:00 through a support tunnel that is open all the time. There is no change record anywhere, and the appliances are working.","question":"What is the correct first response as change coordinator?","opts":["Roll every appliance back tonight and tell the vendor to ask next time","Accept it, because the vendor owns the platform and every appliance works","Close the support tunnel and leave the new firmware in place unrecorded","Record the version, check it against the baseline and control the path"],"correct":[3],"whyEach":["Wrong. An immediate rollback is an unplanned change of its own, and the old firmware may have the flaw the new one fixes.","Wrong. A vendor pushing code into your estate without a record removes your control and your audit trail.","Wrong. Closing the tunnel may be part of the fix, but leaving the change unrecorded keeps the gap open.","Correct. The change happened, so it must be recorded, checked against the baseline and brought into the process."],"hint":"The change has already happened. What matters first is the record and the check that the estate still matches its baseline, not revenge on the vendor.","why":"An unauthorised change is still a change, and the estate already carries it. The first job is to make the estate visible again: record the new version, compare the running configuration with the approved baseline, and confirm that nothing else travelled with the update. Then the channel itself is fixed, because an always-open support tunnel that can push firmware is a permanent unauthorised change path. Rolling back at once would be a second unplanned change, and it may reintroduce the very flaw the vendor fixed. The retrospective record goes to the board, so the decision and the correction are visible to the people who own the risk.","kw":["change request (RFC)","approval process","configuration baseline","patch management","standard, normal and emergency changes","audit trail","Change Advisory Board (CAB)"]},{"id":"H06","type":"classify","theme":"Access and controls","points":10,"scenario":"A critical flaw in the customer portal is exploited in the wild. At 23:10 the board approves an emergency change with a two hour window. The rule for the window is simple: the work must stay inside the approved scope, and it must not weaken the controls that protect the portal.","question":"Sort the six actions into allowed and not allowed inside this emergency window.","buckets":["Allowed inside the approved scope","Not allowed"],"items":["Apply the signed vendor patch to the two portal servers","Restart only the portal service on those two servers","Add a temporary deny list entry that blocks the attacker's address range","Upgrade the reporting library at the same time, because the window is already open","Turn off the web application firewall on the portal so the patch installs faster","Delete the older log files to free space for the patch"],"answer":[0,0,0,1,1,1],"whyEach":["The patch is the approved work and it is signed by the vendor.","A restart of the affected service is needed to finish the approved work.","Blocking the attacker protects the portal, and the entry is easy to reverse when the attack stops.","An unrelated library upgrade is scope creep, even in an open window.","Removing a protective control to save time trades one risk for a larger one.","Log files are evidence. Deleting them removes the record of what the attacker did."],"hint":"Two of these six actions would remove a detective or protective control, and one is simply a different change.","why":"An emergency window is short, not lawless. The approved scope is the patch and the restart it needs. Blocking the attacker is defensive work that fits the emergency and can be reversed. The other three actions fail for different reasons. The library upgrade is a second change that nobody approved. Turning off the web application firewall removes a control that protects the portal precisely when it is under attack. Deleting log files destroys the evidence of the incident you are responding to.","kw":["standard, normal and emergency changes","restricted activity","service restart","deny list","firewall rule change","audit trail","patch management"]},{"id":"H07","type":"spot","theme":"Rogue change detection","points":10,"scenario":"A change request titled 'Password policy refresh' was approved for the domain controller dc-01. Below is part of the file that the change actually edited, taken from the post-change review.","art":{"title":"Content of /etc/sudoers.d/90-support after CHG-5610","kind":"code","pick":true,"lines":["Defaults  passwd_tries=3","Defaults  logfile=/var/log/sudo.log","Defaults  badpass_message=\"Contact the service desk\"","%helpdesk  ALL=(ALL)  NOPASSWD: ALL","Defaults  env_reset"]},"bad":[3],"whyEach":["Limiting the number of password attempts is a sensible part of a password policy refresh.","Writing privileged commands to a log file supports the audit trail and fits the change.","A helpful message for users is harmless and inside the scope of the change.","This line gives the whole helpdesk group unrestricted privileged access with no password, which the approved change never mentioned.","Clearing the environment for privileged commands is standard hardening, not a new grant of power."],"question":"Click the single line that grants far more power than the approved change needed.","hint":"Read the lines as permissions rather than as settings. One line grants a whole group something permanent.","why":"Most of this file is ordinary hardening. One line is not: it gives every member of the helpdesk group full privileged access without a password. That is an unconditional allow list entry for a group, created by a change that was approved only to refresh password settings. It also defeats the password policy the change was meant to improve, because no password is needed. The pattern to remember is that a small approved change can hide a large permanent grant of power, so the reviewer must read what the file now allows, not just what the ticket said it would do.","kw":["allow list","privileged access to production","segregation of duties","approval process","audit trail"]},{"id":"H08","type":"order","theme":"Incident and containment","points":10,"scenario":"During the review of CHG-5730 you find that a management rule was added to the edge firewall and that the change record was edited afterwards to match the device. You treat the change as a possible intrusion. The team asks for the order of the response.","question":"Put the six response steps in the correct order.","items":["Declare an incident and stop any further change on the affected systems","Copy the volatile evidence, such as live sessions, logs and file hashes","Remove the attacker's path by revoking the account and the added rule","Restore the affected systems to the last known-good configuration baseline","Check that the service is healthy and watch it closely for a while","Record the timeline in the ticket and hold the post-implementation review"],"hint":"The service is not restored until you know what happened. Stop the bleeding, keep a copy of the evidence, then take the intruder's path away.","why":"When a change is suspected to be malicious, the response follows the incident order rather than the change order. First the team stops further change, so nothing else moves while the picture is unclear. Then it copies the volatile evidence, because sessions and live logs disappear first. Only then does it remove the attacker's path, which here is the account and the added rule. Restoring the baseline follows, and the service is watched afterwards because an intruder may return. The record and the review close the loop and turn the event into better controls.","kw":["audit trail","privileged access to production","rollback decision point","configuration baseline","post-change validation and monitoring","post-implementation review (PIR)","runbook"]},{"id":"H09","type":"match","theme":"Change governance under pressure","points":10,"scenario":"An auditor at Northwind Health lists five weak controls found across the estate during the last quarter. You match each weak control to the failure it creates.","question":"Match each weak control to the failure it produces.","pairs":[["One engineer raises, approves and applies the change","Segregation of duties is missing, so nobody checks the work."],["A firewall rule was edited on the device and no ticket was raised","The change is unauthorised and the audit trail has a gap."],["The backout plan was written but never tested","The rollback is a guess, so the window can overrun."],["The estate record still lists the old firmware version","The record drifts from the device, so planning starts from false facts."],["A change ran during the freeze because the team was quiet","The freeze was ignored and a peak-period risk was taken."]],"hint":"Each failure is a direct consequence: no second pair of eyes, no record, no rehearsal, no accurate record, no respect for the freeze.","why":"Weak controls fail in predictable ways, which is why the auditor can name the failure before it happens. Collapsing the requester, the approver and the implementer into one person removes the check on the work. Editing a device without a ticket leaves no record and no approval. An untested backout plan turns a rollback into improvisation. An estate record that disagrees with the devices makes every future plan slightly wrong. And ignoring a freeze is a decision to accept extra risk in the busiest weeks, taken by people who were not asked to accept it.","kw":["segregation of duties","change request (RFC)","backout plan","configuration management database (CMDB)","configuration drift","change freeze","audit trail"]},{"id":"H10","type":"fill","theme":"Audit and compliance","points":10,"scenario":"You write the management response to a SOC 2 change management finding. The auditor found that one engineer both approved and deployed four changes, that the estate record was not updated, and that the ticket history held no second signature.","question":"Complete the five findings in the response with the correct terms.","parts":["Finding one: the change record shows no ",{"b":0},", because the same engineer approved and deployed the work. Finding two: the ",{"b":1}," was not updated after two changes, so a ",{"b":2}," now exists between the record and the devices. Finding three: the ",{"b":3}," in the ticket holds no second signature, and the ",{"b":4}," still shows the rule that was removed in October."],"answers":["segregation of duties","configuration management database (CMDB)","configuration drift","audit trail","network and architecture diagrams"],"extras":["change freeze","release notes","runbook"],"hint":"One gap names the missing separation of roles, one names the estate record, one names the gap between record and reality, one names the proof of who did what, and one names a picture of the estate.","why":"Every gap in the response names a different control. Segregation of duties is the check that one person cannot do the whole job alone. The configuration management database is the record of what exists, and when it falls behind the devices the estate drifts. The audit trail is the proof of who approved and who acted, and a missing second signature means the proof is incomplete. The diagram is the shared picture of the estate, so it must be updated with every change. A response like this is only complete when the change procedure itself is updated, so the control lives in the process instead of in people's memory. The auditor reads it to see whether the company understands the cause, not just the symptom.","kw":["segregation of duties","configuration management database (CMDB)","configuration drift","audit trail","network and architecture diagrams","approval process","SOC 2 change criteria (CC8.1)","policy and procedure update"]},{"id":"H11","type":"spot","theme":"Rogue change detection","points":10,"scenario":"During the change window for CHG-5730 the operations team used the break-glass account. The approved scope is one host, mail-relay-02, and one task: a restart of the mail relay. The security team reviews the session log afterwards.","art":{"title":"Break-glass session log - CHG-5730","kind":"log","pick":true,"lines":["01:00:04  auth  breakglass-ops  logon OK  host=mail-relay-02  mfa=yes","01:03:19  auth  breakglass-ops  logon OK  host=dc-02  mfa=yes","01:05:41  auth  breakglass-ops  logon OK  host=pay-db-01  mfa=yes","01:08:02  mail  relay restart complete  host=mail-relay-02","01:10:55  auth  breakglass-ops  logon OK  host=vmware-01  mfa=yes","01:31:20  auth  breakglass-ops  logoff OK","01:31:25  servicedesk  CHG-5730 closed by operations"]},"bad":[1,2,4],"whyEach":["The logon to mail-relay-02 is the approved host, so this line is expected.","The directory controller dc-02 is not in the approved scope, and nothing in the ticket explains this logon.","The payment database is far outside the scope of a mail relay restart, and the account has no reason to reach it.","The restart of the mail relay is the approved task and it succeeded.","The virtualisation host is also outside the scope, and it is a high value target.","A clean logoff is good practice, but it does not explain the three extra hosts.","Closing the ticket at the service desk does not explain the extra logons."],"question":"Flag the three lines that the approved change does not explain.","hint":"The ticket allows one host. Compare every logon with that host, and remember that MFA and a clean logoff are not scope.","why":"A break-glass account is a powerful tool with a narrow purpose. Everything it touches is recorded, and every host in the log must be explained by the ticket that justified the account. Three logons here go far beyond the approved host: a directory controller, the payment database and a virtualisation host. MFA and a tidy logoff make the session look healthy, which is exactly why scope must be read from the ticket rather than from the tone of the log. The account should be rotated after such a session, and the review must ask who held the credential.","kw":["privileged access to production","audit trail","restricted activity","change request (RFC)","post-change validation and monitoring"]},{"id":"H12","type":"terminal","theme":"Version control and release","points":10,"scenario":"The change record store keeps one plain text file per change in /var/audit/changes/. The reviewer wants the number of change records that do not mention a backout plan at all, without opening the files one by one.","question":"Type the command that lists the record files which do not mention a backout plan and then prints how many of them there are.","parts":[{"re":"^\\s*grep\\b","label":"the file search tool is used","flags":"i"},{"re":"(^|\\s)(-[a-zA-Z]*L[a-zA-Z]*|--files-without-match)(\\s|$)","label":"the flag that lists files with no match is used"},{"re":"backout|back-out|back out","label":"the backout plan text is searched for"},{"re":"\\bwc\\b","label":"the result is counted"}],"solution":"grep -rLi backout /var/audit/changes/ | wc -l","hint":"You need the files that do not contain the word, so invert which files are reported, and then count the lines that come back.","why":"The reviewer wants a number, not a reading list. The search tool normally reports the lines that match, so the inverted flag reports the file names that hold no match at all, which are exactly the records with no backout plan. Piping the result into the line counter turns the list into a figure that can go straight into the audit note. Recording the command alongside the number matters as much as the number itself, because the next reviewer must be able to reproduce it. Each record that the command reports goes back to its change owner for correction.","kw":["backout plan","audit trail","standard operating procedure (SOP)","change request (RFC)","change owner"]},{"id":"H13","type":"spot","theme":"Version control and release","points":10,"scenario":"You review the release record for version 6.0.0, which went to production on Friday. A developer had committed a credential file by mistake, and the team had to remove it. The extract below comes from the repository history and the release notes.","art":{"title":"Repository history for release 6.0.0","kind":"code","pick":true,"lines":["f3a91c2  6.0.0  release 6.0.0 prepared        Fri 09:10  R. Iqbal","b7d20e4  main   merge branch fix/logging     Fri 09:02  R. Iqbal","9c04ab1  main   remove .env.production       Fri 08:55  R. Iqbal","2e77b90  main   push --force origin main     Fri 08:58  R. Iqbal","1a55c83  main   add logging fields           Thu 17:40  M. Sorensen","changelog 6.0.0: logging fields added, credential file removed from the release"]},"bad":[3],"whyEach":["Tagging the prepared release is normal practice.","Merging a reviewed branch into the main line is the expected path.","Removing the credential file from the newest version is a good intention.","This line rewrites the shared history. The original commits, including the one that added the credential, are replaced, so the audit trail can no longer be read.","An ordinary feature commit with an author and a time.","The release note describes the removal, but it cannot replace the destroyed history."],"question":"Click the single line that destroys the history the auditor needs.","hint":"One entry does not add or remove a file. It replaces the shared history with a rewritten version of it.","why":"Removing a secret from the newest version of a file does not remove it from history, because the repository keeps every state it has ever recorded. Rewriting the shared history hides the commit that added the credential, but it also destroys the record of everything else in that rewrite. The auditor can no longer see the original sequence of changes, and any other edit that travelled with the rewrite becomes invisible. The correct response to a committed secret is to rotate the credential, keep the history intact, and record the incident.","kw":["release tag and commit history","version control","auditor evidence and approval records","branch and merge request","changelog and release notes","version numbering","secrets in the repository"]},{"id":"H14","type":"dual","theme":"Change governance under pressure","points":10,"scenario":"Northwind Retail has a recurring problem: small unauthorised changes appear in the estate during maintenance windows. You examine the same problem from both sides.","question":"Answer the blue team question and the red team question about the unauthorised change.","q1":{"q":"Blue team: which single control gives you the best chance of catching a change that was slipped in during a maintenance window?","opts":["A daily count of failed sign-in attempts on the domain controllers","A nightly comparison of key configuration files with the baseline","A weekly report of the endpoint antivirus alerts from all hosts"],"correct":[1]},"q2":{"q":"Red team: you want a change to survive the review that follows the window. Which method is hardest for the blue team to notice?","opts":["Make the change at 03:00 on a Sunday, when the office is empty","Use the hardware vendor's support account for a few minutes","Attach the change to an approved ticket for that same host"],"correct":[2]},"hint":"The window is not the weak point, the ticket is. A timeline that matches the plan looks healthy unless something compares the record with the real configuration.","why":"Out-of-hours work is expected during a window, so timing alone proves nothing. Vendor accounts are logged and reviewed, so they leave a trail. The technique that survives review is the one that borrows an honest ticket: the change happens on a host that was genuinely being changed, inside a window that was genuinely approved, and the reviewer sees a ticket that matches the timeline. The only reliable detection is to compare the resulting configuration with the approved baseline and to ask whether every difference is explained by the ticket.","kw":["change freeze","configuration baseline","configuration drift","audit trail","restricted activity","post-change validation and monitoring","maintenance window"]},{"id":"H15","type":"classify","theme":"Version control and release","points":10,"scenario":"Before the next release, the release manager at Falcon Logistics reviews the team's repository and pipeline. She asks you to sort the observations into real release risks and things that are merely untidy.","question":"Sort the six observations into release risk and not a release risk.","buckets":["Real release risk","Not a release risk"],"items":["The release tag points at a commit that never passed the pipeline","A long-lived branch is 400 commits behind the main line and is still deployed from","The repository history holds a database password from a commit in March","Two developers prefer different editors for the same repository","The pipeline takes twelve minutes instead of nine","The team changed the colour theme of the repository pages"],"answer":[0,0,0,1,1,1],"whyEach":["A tag that points at untested code means nobody knows what is running, which is a real risk.","Deploying from a branch far behind the main line reintroduces old code and missing fixes.","A secret in the history is a permanent exposure, because deleting the file does not delete the record.","Editor choice is personal preference and changes nothing about the release.","A slower pipeline costs waiting time, but it does not weaken the release.","A colour theme is cosmetic and has no effect on the code that ships."],"hint":"Ask of each observation: does it change what code runs, or who can read something they should not, or whether the release can be reproduced?","why":"Release risk comes from three places: code that nobody tested, changes that cannot be reproduced, and secrets that stay readable. A tag pointing at an untested commit fails the first test, and deploying from a stale branch fails the second. A password in the history is a permanent exposure and must be rotated, because the record cannot be unpublished. Editor choice, pipeline duration and a colour theme are matters of taste and convenience; they cost time or comfort, not control.","kw":["secrets in the repository","version control","release tag and commit history","branch and merge request","test results","version numbering"]},{"id":"H16","type":"fill","theme":"Access and controls","points":10,"scenario":"Northwind Health is adding one paragraph to the change policy that covers changes which weaken a security control, because those changes keep slipping through as ordinary work.","question":"Complete the new policy paragraph with the correct terms.","parts":["Any change that weakens a control needs extra review. For example, a new ",{"b":0}," entry in the firewall, or an exception on the ",{"b":1},", must be explained by the ",{"b":2}," in the impact analysis, with a tested ",{"b":3}," attached before the board can approve it."],"answers":["allow list","deny list","change owner","backout plan"],"extras":["changelog and release notes","release tag","runbook"],"hint":"Two gaps name the kinds of firewall entry, one names the accountable person, and one names the recovery steps.","why":"A change that weakens a control is the most dangerous kind, because the estate becomes less safe while every test still passes. Adding an allow list entry widens what may reach a service, and removing or excepting a deny list entry stops blocking something known to be bad. Both must be explained in the impact analysis by the accountable change owner, and both need a tested way back. Naming this in the policy forces the review to look at what the change permits, not only at whether the service still works afterwards.","kw":["allow list","deny list","firewall rule change","change owner","impact analysis","backout plan","Change Advisory Board (CAB)"]},{"id":"H17","type":"match","theme":"Access and controls","points":10,"scenario":"Cobalt Freight is moving twelve services onto a shared platform. Before the release is approved, the change owner must list the dependency that each change can break.","question":"Match each planned change to the dependency it can break.","pairs":[["Restart the primary database","Check the copy that takes over, and the connection pools inside the applications."],["Update the shared library that twelve services import","Check every service that uses it, then restart each application in the right order."],["Renew the certificate on the API gateway","Check the clients that pin the old certificate and will refuse the new one."],["Shorten the time to live on a DNS record","Check the resolvers and the long-lived connections that cache the old address."],["Change the operating system under the legacy billing application","Check that the version is still supported and that the restart works unattended."]],"hint":"Each check protects a different dependency: a standby copy, twelve consumers, pinned certificates, cached addresses, or an old application nobody will fix for you.","why":"Modern services depend on each other, so a small change can break something that was never mentioned in the ticket. A database restart is only safe if the standby takes over and the connection pools recover. A shared library change reaches every service that imports it, and each one must restart in the right order. A renewed certificate breaks clients that pin the old one. A shorter DNS time to live affects resolvers and long-lived connections that still hold the old address. And an unsupported legacy application must be checked for a restart that works without a person watching it.","kw":["upstream and downstream dependencies","service restart","application restart","backward compatibility","legacy application","downtime","availability and service level agreement (SLA)"]},{"id":"H18","type":"order","theme":"Rollback and recovery","points":10,"scenario":"The orders migration at Northwind Health failed half way through. The schema already holds new format data that the older application cannot read, so a rollback would lose the work already written. You plan the forward fix.","question":"Put the seven steps of the forward fix in the correct order.","items":["Stop the deployment and stop further writes to the affected table","Measure how much data the new schema has already written","Record the decision that a rollback is impossible, and why","Write a forward fix that converts the remaining data and keeps the old readers working","Test the forward fix against a restored copy of the production database","Run the forward fix inside the next window and watch the error rate","Confirm the data, then hold the post-implementation review"],"hint":"Nothing can be written until the state is measured, and nothing can be measured safely until the writes stop.","why":"A forward fix is the answer when the change has already moved data that the old version cannot read. The first step is to stop the flow, because measuring a moving target is impossible. Then the team measures how much has been written, which decides whether a forward fix is viable at all, and records that decision in the ticket. The fix itself must keep the old readers working, which is a backward compatibility requirement, and it must be tested against a restored copy of the real data. Only then does it run, inside a window, with the error rate watched. Confirmation and review close the change.","kw":["forward fix","rollback decision point","backward compatibility","test results","maintenance window","post-change validation and monitoring","post-implementation review (PIR)"]},{"id":"H19","type":"branch","theme":"Change governance under pressure","points":10,"scenario":"You are the change coordinator at Northwind Retail on 21 December, inside the trading freeze.","question":"Work through the pressure. Pick the best action at each step; the next step appears after you choose.","steps":[{"sit":"The sales director wants a price banner changed on the checkout page tonight, because the campaign starts at midnight. The change is not a fix and not urgent. The developer is free and the code is ready.","opts":["Allow it, because the campaign is expected to bring in a lot of revenue","Explain the freeze rule and offer the emergency path with acceptance","Ask the developer to make the change quietly and raise the ticket later"],"correct":1,"res":["That accepts a peak-period risk on behalf of the business, and the person who owns the risk never agreed to it.","Correct. The rule stays intact, the business gets a real path, and the decision is recorded by the person who owns the risk.","A quiet change is exactly the failure the freeze exists to prevent, and it destroys the audit trail."]},{"sit":"The director accepts the rule and asks what a written risk acceptance would have to contain.","opts":["A verbal agreement given during an evening call with the director","A short chat message from the director saying go ahead tonight","A signed note from the business owner naming the risk and the plan"],"correct":2,"res":["A verbal agreement leaves no record and no named owner of the risk.","A chat message does not identify a risk, a window or a backout plan.","Correct. The acceptance must name the risk, the time and the way back, and the business owner must sign it."]},{"sit":"The change runs with the signed acceptance. On 3 January the auditor asks for the evidence.","opts":["Give the ticket with the signed acceptance, approvals and times","Explain that the director asked for it, so the change was allowed","Give the chat history between the director and the developer"],"correct":0,"res":["Correct. The ticket holds the decision, the approvals and the outcome, which is exactly what the auditor reads.","Who asked for a change is not evidence that the risk was accepted in writing.","A chat history shows a conversation, not an approved exception."]}],"hint":"The freeze is a rule about who accepts risk. Keep the rule, and make the business owner put the acceptance in writing.","why":"A freeze is only as strong as the exception path that runs beside it. Refusing everything pushes people to work quietly, and agreeing to everything destroys the point of the freeze. The workable answer is a written risk acceptance: the business owner names the risk, the window and the backout plan, and signs it. That puts the decision with the person who owns the business risk, keeps the change inside the process, and produces the evidence an auditor will ask for weeks later.","kw":["change freeze","risk acceptance by the business owner","impact analysis","backout plan","audit trail","stakeholders","approval process"]},{"id":"H20","type":"spot","theme":"Rollback and recovery","points":10,"scenario":"The change board at Northwind Health reviews the backout plan for an orders migration. The window starts at 02:00, the migration must finish by 03:30, and the service must be online at 03:45.","art":{"title":"Backout plan - orders migration","kind":"code","pick":true,"lines":["Backout plan - migration of the orders table","02:00  stop the application tier","02:20  run the schema migration","02:50  copy the order history, about 70 minutes of work","03:10  take a snapshot of the database","03:30  backout deadline: restore the snapshot and restart the application","03:45  the service must be online for the morning shift","the last rehearsal of this plan took 25 minutes"]},"bad":[4,5],"whyEach":["The heading names the plan and the object it protects, which is correct.","Stopping the application tier before the migration is the right first action.","Running the migration before the copy is a sensible order for the work.","The copy is long, but the plan gives it a slot, so the step itself is not the fault.","The snapshot is taken after the migration has already started, so restoring it would not undo the schema change.","This deadline cannot be met: the rehearsal of the restore took 25 minutes, yet the plan allows only 15 before the service promise.","The service promise is stated clearly, which is what a plan should do.","The rehearsal figure is the evidence that exposes the timing problem."],"question":"Click the two lines that make this backout plan unsafe.","hint":"Ask two questions: at what moment does the snapshot have to exist for a restore to undo the migration, and how long did the last restore really take?","why":"A backout plan is only as good as its two weakest numbers: the moment of the snapshot and the time the restore takes. Here the snapshot is taken twenty minutes after the migration began, so restoring it would leave the schema in the new state and the failure in place. And the restore itself was rehearsed at 25 minutes, while the plan allows 15 minutes before the service promise is broken. Both faults are invisible in prose and obvious in a timeline, which is why rehearsing a rollback and writing the timings down is the only way to know that it works.","kw":["backout plan","maintenance window","rollback decision point","test results","downtime","availability and service level agreement (SLA)"]},{"id":"H21","type":"mcq","theme":"Rollback and recovery","points":10,"scenario":"Release 7.2 went to five percent of users at 14:00 through a canary group. The rollout can be stopped at any moment, and the backout plan for the canary group was tested last week.","art":{"title":"Canary dashboard - release 7.2","kind":"log","lines":["14:00  canary  rollout 5%  version=7.2  result=started","14:10  metric  checkout_failures  baseline=0.4%  now=1.2%  canary_only=yes","14:20  metric  checkout_failures  baseline=0.4%  now=2.1%  canary_only=yes","14:25  alert   sla=checkout_success  state=at_risk  window=30m","14:25  note    on-call: only one user in five is affected"]},"question":"What is the correct next action?","opts":["Continue the rollout, because only one user in five is affected","Wait for the post-implementation review before doing anything else","Stop the rollout and run the tested backout for the canary group","Restore the whole estate, including parts the release never touched"],"correct":[2],"whyEach":["Wrong. The rate is doubling every ten minutes and the service target is already at risk, so waiting widens the harm.","Wrong. A review takes days. The service is losing checkouts now.","Correct. The failure rate is rising inside the canary group only, and the tested backout is the cheapest way to stop the harm.","Wrong. Restoring untouched parts of the estate turns one small failure into a large unplanned change."],"hint":"Read the trend, not the size. The failure rate is still only inside the canary group, and a canary exists so that it can be withdrawn.","why":"A canary rollout is a controlled bet: a small group carries the risk so that the rest of the estate stays safe. The number to watch is the trend, not the percentage. Here the failure rate rises from 1.2 to 2.1 percent in ten minutes while the service target is already flagged at risk, and the failures appear only in the canary group. The tested backout for that group stops the harm and leaves the untouched estate alone. Continuing to roll out would spread a fault that the canary has already detected, which is the one thing the canary was designed to prevent.","kw":["post-change validation and monitoring","availability and service level agreement (SLA)","rollback decision point","backout plan","downtime","change owner"]},{"id":"H22","type":"mcq","theme":"Change governance under pressure","points":10,"scenario":"The emergency change for the customer portal is approved for a two hour window. Half way through, the engineer finds that the patch makes the application write a debug log that would fill the disk in forty minutes. The fast fix is to switch off application logging on that one host until the morning.","art":{"title":"CHG-5820 emergency record","kind":"code","lines":["TICKET   CHG-5820  emergency","SCOPE    apply the vendor patch to portal-01 and portal-02","WINDOW   23:10 to 01:10","APPROVER on-call security manager 23:12","NOTE     engineer: patch installed on portal-01; disk pressure from debug log"]},"question":"What is the correct decision?","opts":["Cancel the patch and accept that the flaw stays open tonight","Switch the logging off now and restore it at the review next week","Stop and ask the approver, who may allow it with a time limit","Switch the logging off, because the approval covers the window"],"correct":[2],"whyEach":["Wrong. That leaves the portal exposed to the very flaw the change was raised to fix.","Wrong. The review happens days later, and the portal would run blind until then with nobody's agreement.","Correct. Losing a control is a new decision, so the approver must make it with a limit and a compensating control.","Wrong. The approval covers the patch, not the removal of a detective control on a portal that is under attack."],"hint":"Read the approved scope line in the record. Does it cover the loss of a logging control, or only the patch?","why":"An emergency approval covers the scope that was agreed, and nothing more. Switching logging off is a second decision with its own risk: nobody would see an intrusion on the portal while it is being attacked. The workable path is to ask the approver, keep a compensating control such as network level logging or a packet capture, set a firm time limit, and record the acceptance. That keeps the fix inside the window without silently trading away the evidence that would show an attack.","kw":["standard, normal and emergency changes","restricted activity","approval process","change owner","audit trail","risk acceptance by the business owner","post-implementation review (PIR)"]},{"id":"H23","type":"fill","theme":"Cloud and automation","points":10,"scenario":"At 02:00 an engineer at Northwind Retail fixed a live fault by adding a rule in the cloud console instead of in the code. The next pipeline run will rebuild the network from the repository, and the repository does not hold the rule.","question":"Complete the drift response note with the correct terms.","parts":["The console change is not in the code, so the live estate no longer matches its ",{"b":0},". The next ",{"b":1}," run will rebuild the network from the repository and remove the fix, so the fault may return. To close this properly the rule is written into the code and reviewed, and the console change is recorded in the ",{"b":2}," so the audit can see who made it. A plan that removes a protective rule nobody asked about is a clear sign of ",{"b":3},"."],"answers":["configuration baseline","infrastructure as code (IaC)","audit trail","configuration drift"],"extras":["release notes","runbook","change freeze"],"hint":"One gap names the approved state of the estate, one names the practice of building from code, one names the record of who did what, and one names the gap between code and reality.","why":"When the estate is built from code, the code is the source of truth and the approved state is the baseline. A change made by hand in a console breaks that link, so the live estate drifts away from what the code describes. The next automated build will quietly undo the hand made fix, which is how a repair turns into an outage. The remedy is to move the change into the code, review it like any other change, and record the hand made edit in the audit trail. Configuration management guidance such as NIST SP 800-128 asks for exactly this: baselines, change control and a record for every deviation.","kw":["infrastructure as code (IaC)","configuration drift","configuration baseline","audit trail","approval process","NIST SP 800-128 configuration management"]},{"id":"H24","type":"classify","theme":"Rollback and recovery","points":10,"scenario":"A release has failed at Northwind Health and the change owner must choose between a rollback and a forward fix. Six situations are described below.","question":"Sort each situation into the recovery approach it forces.","buckets":["Roll back","Forward fix"],"items":["The new version has already written data that the old version cannot read","The change only replaced a configuration file and the previous file is saved","The migration has already converted forty thousand records","The service fails its health checks and no data has changed","A security fix must stay applied and the remaining fault is cosmetic","The new code failed only inside the canary group and production is untouched"],"answer":[1,0,1,0,1,0],"whyEach":["Data written in the new format cannot be read by the old version, so the old version cannot return.","A saved configuration file makes the return trivial, so a rollback is the cheapest safe option.","Forty thousand converted records would be lost or stranded, so the work must move forwards.","Nothing has changed yet, so the previous version is still a complete answer.","The security benefit must be kept, so the cosmetic fault is repaired forwards.","Only the canary group is affected, so withdrawing that group restores the estate."],"hint":"Ask one question for each situation: can the previous version still work with the data and the code as they are now?","why":"The choice between a rollback and a forward fix is decided by state, not by preference. If the old version can still run against the current data, a rollback is quick and cheap. If the data has moved into a shape the old version cannot read, or if a security fix must survive, then the way out is forwards. Canary failures and untouched data are the easy cases for a rollback, because the exposure is contained. Converting a large set of records is the case that makes a rollback expensive, which is why the decision point belongs before the change starts, not during it.","kw":["rollback decision point","forward fix","backout plan","backward compatibility","test results","downtime"]},{"id":"H25","type":"match","theme":"Audit and compliance","points":10,"scenario":"An audit of Northwind Health lists five findings about the way changes are controlled. You match each finding to the control that closes it.","question":"Match each audit finding to the control that closes it.","pairs":[["Change records have no second approver","Apply segregation of duties, so a different person approves and deploys."],["No evidence that changes were tested before production","Make the production deployment depend on test results in the pipeline."],["The change policy was last reviewed six years ago","Give the document an owner and a fixed review cycle."],["Emergency changes are closed with no review","Require a post-implementation review before an emergency ticket can close."],["Change types are missing, so every change waits for the board","Use ITIL change enablement to give standard changes a pre-approved path."]],"hint":"Each finding names a missing habit: a second pair of eyes, a test gate, a document owner, a review after emergencies, or the classification of changes.","why":"Every finding has one control that answers it, and the controls are ordinary practices rather than new tools. A missing second approver is segregation of duties. Untested changes are closed by making the pipeline depend on test results. A stale policy needs an owner and a review cycle, because a document without an owner drifts like anything else. Emergency changes need the review that turns one rushed night into a better plan. And when every change waits for the board, the fault is not the board but the missing classification of change types, which change enablement practices supply.","kw":["segregation of duties","test results","document owner and review cadence","post-implementation review (PIR)","ITIL change enablement","auditor evidence and approval records","standard, normal and emergency changes"]},{"id":"H26","type":"order","theme":"Cloud and automation","points":10,"scenario":"Northwind Health wants to load a copy of the production database into the test environment so that a schema change can be tried against real data. The privacy team must approve the way it is done.","question":"Put the five steps in the order the team must follow them.","items":["Get written approval for the copy and record it in the change ticket","Mask or remove the personal data before the copy leaves production","Copy only the records that the test actually needs","Give access to the test environment to the named testers only","Delete the copy when the test ends and record the deletion"],"hint":"Nothing may leave production until the approval exists and the personal data is protected, and nothing may stay behind after the test.","why":"Real data makes a test realistic and dangerous. The permission comes first, so the copy is a controlled change with a record. Personal data is masked or removed before the copy moves, because once it is in a test environment it is outside the controls that protect production. Copying only what the test needs limits the exposure. Access is limited to the named testers, which keeps the test environment inside the same discipline as production. The deletion closes the loop, so the copy does not become a permanent second copy of live data that nobody watches.","kw":["separation of environments (dev, test, production)","restricted activity","privileged access to production","audit trail","test results"]},{"id":"H27","type":"classify","theme":"Change governance under pressure","points":10,"scenario":"At the end of the quarter the change coordinator at Falcon Logistics reviews the exceptions that were logged. She asks you to group them by the rule that was broken.","question":"Sort each exception under the rule it broke.","buckets":["Segregation of duties","Change freeze","Documentation and version control"],"items":["One engineer raised, approved and implemented CHG-6001","A cosmetic interface change was merged on 27 December","The firewall diagram still shows the host that was removed in October","The emergency change was approved by the person who raised it","A library upgrade was deployed on 31 December because the office was quiet","The release tag was moved after the auditor took the evidence copy"],"answer":[0,1,2,0,1,2],"whyEach":["One person held the requester, the approver and the implementer roles, which removes the independent check.","The interface change is cosmetic, so the freeze rule applies and it should have waited.","The diagram is a document that no longer matches the estate, which is a documentation failure.","Approving your own request is the same control failure as approving and deploying it.","The office being quiet is not a reason to run a routine change inside a freeze.","Moving a tag after the evidence was taken breaks the link between the version and the code that ran."],"hint":"Read each item and ask which single rule it breaks: who approved it, when it ran, or what the record now says.","why":"Exceptions are useful because they show which control is weakest. Three groups appear here. The first is the collapse of roles, where the same person requests, approves and implements, which removes the only independent check in the process. The second is a freeze that people treat as advice rather than a rule, usually because nothing bad happened last time. The third is documentation that drifts away from the estate, including a release tag that was moved after the evidence was collected. Each group needs a different fix, and the pattern tells the coordinator where to start.","kw":["segregation of duties","change freeze","network and architecture diagrams","release tag and commit history","audit trail"]},{"id":"H28","type":"branch","theme":"Vendor and third-party change","points":10,"scenario":"You are the change coordinator at Northwind Retail. A storage array is degrading and the vendor says the fault can only be fixed with temporary administrator access to your management network.","question":"Work through the third-party access decisions. Pick the best action at each step; the next step appears after you choose.","steps":[{"sit":"It is 16:00 and the estate is inside the freeze. The array is degrading slowly, and the vendor needs administrator access to your management network.","opts":["Create a local admin account and email its password to the vendor","Refuse the visit until the freeze ends, because vendor access is risky","Raise an emergency change with a named sponsor and a short time box"],"correct":2,"res":["A shared password by email cannot be revoked per person and leaves no usable record.","The array is degrading. Refusing help leaves a growing risk with no owner.","Correct. The access is real, so it is approved, named, limited in time and recorded."]},{"sit":"The vendor fixes the array in ninety minutes, then asks to keep the access until the end of the week in case the fault returns.","opts":["Leave the access in place until Friday, to save time if it recurs","Remove the access now and require a fresh approval for any visit","Leave the account active but change its password every single day"],"correct":1,"res":["Standing access outlives the problem it was granted for, and nobody is watching it.","Correct. Temporary access ends when the work ends, and a new visit needs a new approval.","A daily password change is a ritual that still leaves standing privileged access."]},{"sit":"The access is removed. Before the ticket can close, you must be sure that nothing was left behind.","opts":["Compare the accounts, keys and configuration with the baseline","Trust the vendor's written report, because the array works again","Ask the vendor to confirm in writing that nothing else changed"],"correct":0,"res":["Correct. Verification against the baseline catches anything the visit left behind, and the recording shows what was done.","The array working is evidence about the array, not about the accounts and keys.","A written promise is not a check, and it cannot show a forgotten key or account."]}],"hint":"Third-party access is temporary by nature. Approve it with a name and a time box, take it away when the work ends, and verify the estate afterwards.","why":"Vendor access is necessary and dangerous at the same time. The safe pattern names a sponsor and an engineer, sets a time box, records the approval, and removes the access the moment the work ends. Standing access granted for one fault becomes a permanent privileged path that nobody reviews. When the visit is over, the estate is compared with its baseline and the session recording is read, because a vendor can leave a key, an account or a changed setting behind without meaning any harm. The post-implementation review records what the visit cost and whether the next one can be avoided.","kw":["privileged access to production","approval process","standard operating procedure (SOP)","post-implementation review (PIR)","configuration baseline","audit trail","runbook"]},{"id":"H29","type":"match","theme":"Rogue change detection","points":10,"scenario":"You brief the Northwind Retail change board on how attackers use change management itself. You match each technique to the weakness it exploits.","question":"Match each attacker technique to the change management weakness it exploits.","pairs":[["Create an administrator account during an approved maintenance window","The scope of the ticket is never compared with the change that really happened."],["Disable the endpoint agent so that the patch installs faster","The loss of a control is accepted without a review of the risk."],["Keep using the vendor support account after the ticket is closed","Temporary third-party access is not removed when the work ends."],["Edit the firewall and then edit the record so that both agree","The change is never checked against an independent copy of the baseline."],["Rewrite the branch history after the release","The version history is not protected against alteration."]],"hint":"Each technique needs one blind spot: an unchecked scope, an unreviewed loss of control, access that outlives its purpose, a record that checks itself, or a history that can be rewritten.","why":"Attackers do not defeat change management, they borrow it. A genuine maintenance window provides cover, because out-of-hours activity is expected. Disabling a control is often framed as a way to make the work faster. A vendor account is trusted by design, so it is rarely revoked on time. Editing the record to match the device defeats a review that only reads the record. Rewriting a branch hides the trail entirely. Each of these is answered by one habit: compare what happened with what was approved, using a source the person doing the work cannot edit.","kw":["change request (RFC)","restricted activity","privileged access to production","configuration baseline","release tag and commit history","audit trail"]},{"id":"H30","type":"classify","theme":"Audit and compliance","points":10,"scenario":"Northwind Health is answering an ISO/IEC 27001 surveillance audit. The auditor is not satisfied with the first draft of the management responses, because several of them only treat the symptom of the finding. You sort the six proposed responses before the final reply is sent.","question":"Sort the six proposed responses into those that remove the cause and those that only treat the symptom.","buckets":["Removes the cause","Treats the symptom only"],"items":["The production pipeline refuses to deploy a release that has no test results","Every engineer must attend a one hour briefing about the change policy","Vendor engineers receive access only with a named sponsor and a fixed time box","The team is asked to be more careful during the next freeze","The business owner must sign the risk acceptance before an emergency change runs","The change coordinator sends a weekly reminder that repeats the policy"],"answer":[0,1,0,1,0,1],"whyEach":["The pipeline gate makes the control automatic, so an untested release cannot reach production at all.","A briefing informs people but leaves the process unchanged, so the same exception can happen again.","Named sponsorship and a time box remove the standing access that allowed the vendor change.","Asking people to be careful relies on memory and goodwill rather than on a control.","The signature puts the decision, and the evidence, with the person who owns the business risk.","A weekly reminder repeats the rule without changing what the process allows."],"hint":"Ask whether the response changes what the process allows, or whether it only asks people to behave differently.","why":"An auditor reads a management response to see whether the company removed the cause of the finding. Reminders, briefings and requests to be more careful treat the symptom, because they depend on memory and goodwill, so the same exception can return next quarter. Responses that change the process are stronger, because they make the right path the easy path. A pipeline gate removes the choice, a signed acceptance puts the decision with the risk owner, and a named sponsor with a time box removes standing access. The test of a good response is simple: would the finding be possible again if nobody remembered this audit? The answer belongs in the change procedure, not in a briefing slide.","kw":["test results","privileged access to production","risk acceptance by the business owner","auditor evidence and approval records","ISO/IEC 27001 change control","stakeholders","approval process","policy and procedure update"]},{"id":"H31","type":"calc","theme":"Rollback and recovery","points":10,"scenario":"The orders table at Northwind Health holds 250,000 records. The migration wrote the new format to 78 percent of them before it failed, and the change owner has decided that a rollback is impossible because the converted records cannot be read by the old version.","question":"How many records must the forward fix still convert? Give the number of records, without separators.","answerNum":55000,"unit":"records","tol":1,"hint":"Work out how many records are already converted, then take that away from the total.","why":"Seventy eight percent of 250,000 records is 195,000 records already written in the new format. The forward fix must convert the remainder, which is 55,000 records. That number decides the size of the next window, because a conversion rate measured in records per minute turns into minutes of work. It is also the number that shows why a rollback was refused: returning to the old version would strand nearly two hundred thousand converted records, so the only safe way forward is to finish the job. The fix is tested against a restored copy first, and the converted rows are counted afterwards to confirm that the totals match.","kw":["forward fix","backout plan","rollback decision point","backward compatibility","post-change validation and monitoring","test results"]}];

    for (var i = r.length - 1; i > 0; i--) {

  /* A shuffled order that happens to be partly correct would hand out free
     points before the student touches anything, so ordering exercises start
     from a derangement: no row is in its correct place at the start. */
  function derange(n) {
    var a = shuffle(range(n)), tries = 0;
    while (hasFixed(a) && tries < 40) { a = shuffle(range(n)); tries++; }
    if (hasFixed(a)) { a = range(n); a.push(a.shift()); }

  function pts(n) { return Math.round(n * 100) / 100; }

  function cur() { return Q[S.order[S.idx]]; }
  function idOf(ex) { return ex.id; }

  function disp(ex) {
    if (!S.disp[ex.id]) {
      var n = ex.type === "classify" ? ex.items.length : (ex.type === "order" ? ex.items.length : ex.opts.length);
      S.disp[ex.id] = ex.type === "order" ? derange(n) : shuffle(range(n));
    }

  function bankFor(ex) {
    if (!S.bank[ex.id]) { S.bank[ex.id] = shuffle(ex.answers.concat(ex.extras || [])); }
    return S.bank[ex.id];

  function rightPool(ex) {
    if (!S.disp["R" + ex.id]) { S.disp["R" + ex.id] = shuffle(range(ex.pairs.length)); }
    return S.disp["R" + ex.id];

  /* Branching steps and dual-perspective groups also get shuffled options, so the

  /* ---------------- syntax highlighting for logs ---------------- */

    wrap(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, "hl-ip");
    wrap(/\b\d{1,3}(?:\.\d{1,3}){3}\b/g, "hl-ip");

  /* ---------------- artefact rendering ---------------- */

  /* ---------------- answer area rendering ---------------- */

  /* ---------------- grading (with optional DOM marking) ---------------- */
  function tagNode(el, st) {
    if (!el) { return; }
    el.classList.add(st === "miss" ? "miss" : st);
    var v = document.createElement("span");
    v.className = "verdict " + (st === "miss" ? "miss" : st);
    v.textContent = st === "ok" ? "correct" : (st === "bad" ? "wrong" : "missed correct");
    el.appendChild(v);
  }
  function noteOf(ex, key) { return (ex.whyEach && ex.whyEach[key]) ? ex.whyEach[key] : ""; }

  function gradeMcq(ex, a, root) {
    var sel = (a && a.sel) ? a.sel : [];
    var correct = ex.correct;
    var hit = correct.filter(function (i) { return sel.indexOf(i) >= 0; }).length;
    var earned = ex.points * hit / correct.length;
    var notes = [], stText = [], cText = [];
    disp(ex).forEach(function (oi) {
      var node = root ? root.querySelector('.opt[data-i="' + oi + '"]') : null;
      var isC = correct.indexOf(oi) >= 0, isS = sel.indexOf(oi) >= 0, st = "";
      if (isS && isC) { st = "ok"; } else if (isS && !isC) { st = "bad"; } else if (isC) { st = "miss"; }
      if (st) { tagNode(node, st); notes.push((st === "ok" ? "Correct: " : (st === "bad" ? "Wrong: " : "Missed: ")) + noteOf(ex, oi)); }
      if (isS) { stText.push(ex.opts[oi]); }
      if (isC) { cText.push(ex.opts[oi]); }

      earned: earned, max: ex.points, notes: notes,
      student: stText.length ? stText.join(" | ") : "(nothing selected)",
      correct: cText.join(" | "),
      hit: hit, total: correct.length
    };
  }

  function gradeClassify(ex, a, root) {
    var place = (a && a.place) || {};
    var hit = 0, notes = [], stText = [], cText = [];
    ex.items.forEach(function (t, i) {
      var want = ex.answer[i], got = place[i];
      var node = root ? root.querySelector('.chip[data-i="' + i + '"]') : null;
      var st = "";
      if (got === want) { st = "ok"; hit++; } else if (got !== undefined) { st = "bad"; } else { st = "miss"; }
      tagNode(node, st);
      var line = t + " -> " + (got === undefined ? "not placed" : ex.buckets[got]) + " (correct: " + ex.buckets[want] + "). " + noteOf(ex, i);
      notes.push((st === "ok" ? "Correct: " : (st === "bad" ? "Wrong: " : "Missed: ")) + line);
      stText.push(t + " -> " + (got === undefined ? "not placed" : ex.buckets[got]));
      cText.push(t + " -> " + ex.buckets[want]);
    });
    return { earned: ex.points * hit / ex.items.length, max: ex.points, notes: notes, student: stText.join(" ; "), correct: cText.join(" ; "), hit: hit, total: ex.items.length };
  }

  function gradeOrder(ex, a, root) {
    var ord = (a && a.ord) ? a.ord : disp(ex);
    var hit = 0, notes = [], stText = [], cText = [];
    for (var p = 0; p < ex.items.length; p++) {
      var ii = ord[p], ok = ii === p;
      if (ok) { hit++; }
      var node = root ? root.querySelector('.orderrow[data-pos="' + p + '"]') : null;
      tagNode(node, ok ? "ok" : "bad");
      notes.push((ok ? "Correct position: " : "Wrong position: ") + ex.items[ii] + (ok ? "" : " (correct position " + (ii + 1) + ")"));
      stText.push((p + 1) + ". " + ex.items[ii]);
      cText.push((p + 1) + ". " + ex.items[p]);
    }
    return { earned: ex.points * hit / ex.items.length, max: ex.points, notes: notes, student: stText.join(" | "), correct: cText.join(" | "), hit: hit, total: ex.items.length };
  }

  function gradeMatch(ex, a, root) {
    var sel = (a && a.sel) || [], hit = 0, notes = [], stText = [], cText = [];
    ex.pairs.forEach(function (p, li) {
      var got = sel[li], ok = got === li;
      if (ok) { hit++; }
      var node = root ? root.querySelector('.matchrow[data-l="' + li + '"]') : null;
      tagNode(node, ok ? "ok" : "bad");
      var gotTxt = (got === undefined || got === "") ? "no choice" : ex.pairs[got][1];
      notes.push((ok ? "Correct pair: " : "Wrong pair: ") + p[0] + " -> " + gotTxt + (ok ? "" : " (correct: " + p[1] + ")"));
      stText.push(p[0] + " -> " + gotTxt);
      cText.push(p[0] + " -> " + p[1]);
    });
    return { earned: ex.points * hit / ex.pairs.length, max: ex.points, notes: notes, student: stText.join(" ; "), correct: cText.join(" ; "), hit: hit, total: ex.pairs.length };
  }

  function gradeFill(ex, a, root) {

    ex.answers.forEach(function (want, bi) {

      if (ok) { hit++; }

        var sp = document.createElement("span");
        sp.className = "verdict " + (ok ? "ok" : "bad");
        sp.textContent = ok ? "correct" : "wrong";
        node.parentNode.insertBefore(sp, node.nextSibling);

      notes.push((ok ? "Correct gap: " : "Wrong gap: ") + gotTxt + (ok ? "" : " (correct: " + want + ")"));

      cText.push(want);

  /* A learner may paste the line together with the shell prompt, or prefix it with

  function normaliseCmd(raw) {
    var c = String(raw == null ? "" : raw).trim();
    c = c.replace(/^[A-Za-z0-9_.-]+@[A-Za-z0-9_.-]+:[^\s]*[#$]\s*/, "");
    c = c.replace(/^[#$]\s*/, "");

    return c.trim();
  }

      if (ok) { hit++; }
      notes.push((ok ? "Present: " : "Missing: ") + p.label);

    return { earned: ex.points * hit / ex.parts.length, max: ex.points, notes: notes, student: cmd || "(no command typed)", correct: ex.solution, hit: hit, total: ex.parts.length };
  }

  function gradeBranch(ex, a, root) {
    var picks = (a && a.picks) || [], hit = 0, notes = [], stText = [], cText = [];
    ex.steps.forEach(function (st, i) {
      var got = picks[i], ok = got === st.correct;
      if (ok) { hit++; }
      var node = root ? root.querySelector('.step[data-s="' + i + '"]') : null;
      tagNode(node, ok ? "ok" : "bad");
      var gotTxt = (got === undefined) ? "no choice" : st.opts[got];
      notes.push((ok ? "Step " + (i + 1) + " correct. " : "Step " + (i + 1) + " wrong. ") + "You chose: " + gotTxt + (ok ? "" : " (best: " + st.opts[st.correct] + ")"));
      stText.push("Step " + (i + 1) + ": " + gotTxt);
      cText.push("Step " + (i + 1) + ": " + st.opts[st.correct]);
    });
    return { earned: ex.points * hit / ex.steps.length, max: ex.points, notes: notes, student: stText.join(" | "), correct: cText.join(" | "), hit: hit, total: ex.steps.length };
  }

  function gradeDual(ex, a, root) {
    var hit = 0, notes = [], stText = [], cText = [];
    [["Blue team", ex.q1, a ? a.a : undefined], ["Red team", ex.q2, a ? a.b : undefined]].forEach(function (row) {
      var label = row[0], g = row[1], got = row[2];

        if (n2) { tagNode(n2, ok ? "ok" : "bad"); }
      }
      var gotTxt = (got === undefined) ? "no choice" : g.opts[got];
      notes.push((ok ? label + " correct. " : label + " wrong. ") + "You chose: " + gotTxt + (ok ? "" : " (best: " + g.opts[g.correct[0]] + ")"));
      stText.push(label + ": " + gotTxt);
      cText.push(label + ": " + g.opts[g.correct[0]]);

      if (st) {

  function gradeOf(ex, root) {

  /* ---------------- scoring ---------------- */
  function counted() { return S.order.filter(function (i) { return !S.skip[Q[i].id]; }); }
  function maxPoints() { return counted().reduce(function (t, i) { return t + Q[i].points; }, 0); }
  function earnedPoints() {
    return counted().reduce(function (t, i) {
      var ex = Q[i];
      if (!S.checked[ex.id]) { return t; }
      return t + gradeOf(ex).earned;
    }, 0);
  }
  /* The site records the figure shown on the results screen, and that figure must
     count only the exercises the learner really answered and checked. A skipped

  function gradedSet() {
