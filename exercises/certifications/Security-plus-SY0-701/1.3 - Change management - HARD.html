  }
  function finalMax() { return gradedSet().reduce(function (t, i) { return t + Q[i].points; }, 0); }
  function finalEarned() { return gradedSet().reduce(function (t, i) { return t + gradeOf(Q[i]).earned; }, 0); }
  function excludedList() {
    return S.order.map(function (qi, n) {
      var id = Q[qi].id;
      return (!S.skip[id] && !S.checked[id]) ? (n + 1) : null;
    }).filter(function (x) { return x !== null; });
  }
  function labelFor(ex) {
    if (S.skip[ex.id]) { return "skipped"; }
    if (!S.checked[ex.id]) { return "excluded"; }
    var g = gradeOf(ex);
    if (g.earned >= g.max - 0.01) { return "full"; }
    if (g.earned > 0) { return "partial"; }
    return "zero";
  }

  /* ---------------- header and navigation ---------------- */
  function clockText() {
    var t = Math.max(0, S.timeLeft);
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    function two(n) { return (n < 10 ? "0" : "") + n; }
    return h > 0 ? h + ":" + two(m) + ":" + two(s) : two(m) + ":" + two(s);
  }
  function pauseLine() {
    if (!S.manualPause && !S.checkPause) { return ""; }
    var h = '<div class="pauseline" role="status" aria-live="polite">';
    if (S.manualPause) { h += '<span class="pe">Paused (manual)</span>'; }
    if (S.checkPause) { h += '<span class="pe amber">Timer paused - review mode (press Next to continue)</span>'; }
    return h + "</div>";
  }
  function headerHTML() {
    return '<div class="hdr"><div class="hdrin">' +
      '<span class="t">' + esc(META.title || "Practice exam") + "</span>" +
      '<span class="pill time" id="clock" aria-live="off">Time ' + clockText() + "</span>" +
      '<span class="pill" id="score">Score 0 / 0</span>' +
      '<button type="button" class="btn" id="pauseBtn">' + (S.manualPause ? "Resume" : "Pause") + "</button>" +
      '<button type="button" class="btn primary" id="submitBtn">Finish exam</button>' +
      "</div>" +
      '<div style="padding:0 14px 8px"><div class="pbar" role="progressbar" aria-label="progress"><i id="pbar" style="width:0%"></i></div></div>' + pauseLine() +
      "</div>";
  }
  function navHTML() {
    var h = '<div class="card"><h2 style="margin-bottom:10px">Question navigator</h2><div class="nav">';
    S.order.forEach(function (qi, n) {
      var ex = Q[qi], cls = "", sym = "", word = "not answered";
      if (S.skip[ex.id]) { cls = "skip"; sym = "\u00bb"; word = "skipped"; }
      else if (S.checked[ex.id]) {
        var l = labelFor(ex);
        cls = l === "full" ? "ok" : (l === "partial" ? "mid" : "bad");
        sym = l === "full" ? "\u2713" : (l === "partial" ? "~" : "\u2717");
        word = l === "full" ? "full marks" : (l === "partial" ? "partial marks" : "wrong");
      } else if (S.touch[ex.id]) { cls = "answered"; sym = "\u25cb"; word = "answered, not checked"; }
      if (n === S.idx) { cls += " cur"; word += ", current question"; }
      h += '<button type="button" class="' + cls.trim() + '" data-n="' + n + '" aria-label="question ' + (n + 1) + ', ' + word + '"><span aria-hidden="true">' + (n + 1) + (sym ? " " + sym : "") + "</span></button>";
    });
    h += '</div><div class="legend"><span><b>\u2713</b> full marks</span><span><b>~</b> partial marks</span><span><b>\u2717</b> wrong</span><span><b>\u25cb</b> answered, not checked</span><span><b>\u00bb</b> skipped, excluded from scoring</span></div></div>';
    return h;
  }
  function handledCount() {
    return S.order.filter(function (i) { return S.checked[Q[i].id] || S.skip[Q[i].id]; }).length;
  }
  function themeProgressHTML() {
    var map = {}, names = [];
    S.order.forEach(function (qi) {
      var ex = Q[qi];
      if (!map[ex.theme]) { map[ex.theme] = { done: 0, n: 0, earned: 0, max: 0, skipped: 0 }; names.push(ex.theme); }
      var m = map[ex.theme];
      m.n++;
      if (S.skip[ex.id]) { m.skipped++; return; }
      m.max += ex.points;
      if (S.checked[ex.id]) { m.done++; m.earned += gradeOf(ex).earned; }
    });
    var h = '<div class="card"><h2 style="margin-bottom:10px">Progress by theme</h2><p class="small mut">Points and progress for each theme in this exam. Skipped exercises are removed from a theme\'s possible points, exactly as they are removed from the final score.</p><div class="themegrid">';
    names.forEach(function (t) {
      var m = map[t];
      var pct = m.max > 0 ? Math.round((m.earned / m.max) * 100) : 0;
      h += '<div class="themebox"><div class="themerow"><span>' + esc(t) + '</span><span class="small mut">' + (m.done + m.skipped) + " / " + m.n + ' handled</span></div>' +
        '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="small mut">' + fx(m.earned) + " / " + fx(m.max) + " points" + (m.skipped ? ", " + m.skipped + " skipped" : "") + "</div></div>";
    });
    return h + "</div></div>";
  }
  function updateHeader() {
    var c = $("#clock"); if (c) { c.textContent = "Time " + clockText(); }
    var sc = $("#score");
    if (sc) { var mx = maxPoints(); var er = earnedPoints(); sc.textContent = "Score " + fx(er) + " / " + fx(mx) + (mx > 0 ? " (" + Math.round(er / mx * 100) + "%)" : ""); }
    var pb = $("#pbar");
    if (pb) { pb.style.width = Math.round((handledCount() / S.order.length) * 100) + "%"; }
    var pb2 = $("#pauseBtn"); if (pb2) { pb2.textContent = S.manualPause ? "Resume" : "Pause"; }
  }

  /* ---------------- answer area binding ---------------- */
  function bindAnswerArea(ex) {
    var area = $("#ansArea");
    if (!area) { return; }
    var locked = !!S.checked[ex.id];
    function store(fn) { var a = ensureAns(ex); S.touch[ex.id] = true; fn(a); }
    if (ex.type === "mcq") {
      $$("input", area).forEach(function (inp) {
        inp.disabled = locked;
        inp.addEventListener("change", function () {
          store(function (a) {
            var v = Number(inp.value);
            if (ex.multi) {
              a.sel = a.sel || [];
              var k = a.sel.indexOf(v);
              if (inp.checked && k < 0) { a.sel.push(v); }
              if (!inp.checked && k >= 0) { a.sel.splice(k, 1); }
            } else { a.sel = [v]; }
          });
          updateHeader(); renderNav();
        });
      });
    } else if (ex.type === "classify") {
      $$(".chip", area).forEach(function (c) {
        c.addEventListener("click", function () {
          if (locked) { return; }
          var i = Number(c.getAttribute("data-i"));
          var inBank = c.parentElement.getAttribute("data-b") === "bank";
          if (selChip.id === ex.id && selChip.i === i) { selChip = { id: null, i: null }; }
          else if (inBank) {
            selChip = { id: ex.id, i: i };
            $$(".chip", area).forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
            c.setAttribute("aria-pressed", "true");
            return;
          } else {
            store(function (a) { a.place = a.place || {}; delete a.place[i]; });
            selChip = { id: null, i: null };
            drawAnswer(); updateHeader(); renderNav(); return;
          }
          $$(".chip", area).forEach(function (x) { x.setAttribute("aria-pressed", x === c ? "true" : "false"); });
        });
        c.addEventListener("dragstart", function (ev) { if (locked) { ev.preventDefault(); return; } ev.dataTransfer.setData("text/plain", c.getAttribute("data-i")); });
      });
      $$(".bucket, .bank", area).forEach(function (b) {
        b.addEventListener("dragover", function (ev) { if (!locked) { ev.preventDefault(); b.classList.add("hot"); } });
        b.addEventListener("dragleave", function () { b.classList.remove("hot"); });
        b.addEventListener("drop", function (ev) {
          ev.preventDefault(); b.classList.remove("hot");
          if (locked) { return; }
          var i = Number(ev.dataTransfer.getData("text/plain"));
          var bi = b.getAttribute("data-b");
          store(function (a) {
            a.place = a.place || {};
            if (bi === "bank") { delete a.place[i]; } else { a.place[i] = Number(bi); }
          });
          drawAnswer(); updateHeader(); renderNav();
        });
        b.addEventListener("click", function (ev) {
          if (locked || selChip.id !== ex.id) { return; }
          if (ev.target.classList.contains("chip")) { return; }
          var bi = b.getAttribute("data-b");
          store(function (a) {
            a.place = a.place || {};
            if (bi === "bank") { delete a.place[selChip.i]; } else { a.place[selChip.i] = Number(bi); }
          });
          selChip = { id: null, i: null };
          drawAnswer(); updateHeader(); renderNav();
        });
      });
    } else if (ex.type === "order") {
      $$("[data-mv]", area).forEach(function (b) {
        b.disabled = locked;
        b.addEventListener("click", function () {
          if (locked) { return; }
          var p = Number(b.getAttribute("data-pos"));
          var dir = b.getAttribute("data-mv") === "up" ? -1 : 1;
          var q2 = p + dir;
          store(function (a) {
            a.ord = a.ord || [];
            if (q2 < 0 || q2 >= a.ord.length) { return; }
            var t = a.ord[p]; a.ord[p] = a.ord[q2]; a.ord[q2] = t;
          });
          drawAnswer(); updateHeader(); renderNav();
        });
      });
      var dragFrom = null;
      $$(".orderrow", area).forEach(function (row) {
        var handle = $(".grab", row);
        if (handle && !locked) {
          handle.addEventListener("dragstart", function (ev) { dragFrom = Number(row.getAttribute("data-pos")); ev.dataTransfer.setData("text/plain", String(dragFrom)); });
        }
        row.addEventListener("dragover", function (ev) { if (!locked) { ev.preventDefault(); } });
        row.addEventListener("drop", function (ev) {
          ev.preventDefault();
          if (locked) { return; }
          var to = Number(row.getAttribute("data-pos"));
          var from = Number(ev.dataTransfer.getData("text/plain"));
          store(function (a) {
            a.ord = a.ord || [];
            var moved = a.ord.splice(from, 1)[0];
            a.ord.splice(to, 0, moved);
          });
          drawAnswer(); updateHeader(); renderNav();
        });
      });
    } else if (ex.type === "match") {
      $$("select", area).forEach(function (s2) {
        s2.disabled = locked;
        s2.addEventListener("change", function () {
          store(function (a) { a.sel = a.sel || []; a.sel[Number(s2.getAttribute("data-l"))] = s2.value === "" ? undefined : Number(s2.value); });
          updateHeader(); renderNav();
        });
      });
    } else if (ex.type === "fill") {
      $$("select[data-b]", area).forEach(function (s2) {
        s2.disabled = locked;
        s2.addEventListener("change", function () {
          store(function (a) { a.sel = a.sel || []; a.sel[Number(s2.getAttribute("data-b"))] = s2.value === "" ? undefined : Number(s2.value); });
          updateHeader(); renderNav();
        });
      });
    } else if (ex.type === "terminal") {
      var inp2 = $("#cmd", area);
      if (inp2) {
        inp2.disabled = locked;
        inp2.addEventListener("input", function () { store(function (a) { a.cmd = inp2.value; }); updateHeader(); renderNav(); });
        /* a shell answers the Enter key, so Enter runs the same check the button runs */
        inp2.addEventListener("keydown", function (ev) {
          if (ev.key !== "Enter") { return; }
          ev.preventDefault();
          var cbtn = $("#checkBtn");
          if (cbtn && !cbtn.disabled) { cbtn.click(); }
        });
      }
    } else if (ex.type === "branch") {
      $$("input", area).forEach(function (inp) {
        inp.disabled = locked;
        inp.addEventListener("change", function () {
          store(function (a) { a.picks = a.picks || []; a.picks[Number(inp.closest(".step").getAttribute("data-s"))] = Number(inp.value); });
          drawAnswer(); updateHeader(); renderNav();
        });
      });
    } else if (ex.type === "dual") {
      $$("input", area).forEach(function (inp) {
        inp.disabled = locked;
        inp.addEventListener("change", function () {
          var g = inp.closest(".opt").getAttribute("data-g").indexOf("Blue") === 0 ? "a" : "b";
          store(function (a) { a[g] = Number(inp.value); });
          updateHeader(); renderNav();
        });
      });
    } else if (ex.type === "calc") {
      var num = $("#num", area);
      if (num) {
        num.disabled = locked;
        num.addEventListener("input", function () { store(function (a) { a.num = num.value; }); updateHeader(); renderNav(); });
        num.addEventListener("keydown", function (ev) {
          if (ev.key !== "Enter") { return; }
          ev.preventDefault();
          var cbtn2 = $("#checkBtn");
          if (cbtn2 && !cbtn2.disabled) { cbtn2.click(); }
        });
      }
    }
  }

  /* ---------------- card ---------------- */
  function drawAnswer() {
    var ex = cur();
    var area = $("#ansArea");
    if (!area) { return; }
    area.innerHTML = ansHTML(ex);
    bindAnswerArea(ex);
  }

  function bindArtefact(ex) {
    var a = ex.art;
    if (!a) { return; }
    if (a.kind === "log") {
      var f = $(".logfilter");
      if (f) {
        f.addEventListener("input", function () {
          var v = f.value.toLowerCase();
          $$(".logline").forEach(function (ln) {
            ln.classList.toggle("hide", v !== "" && ln.textContent.toLowerCase().indexOf(v) < 0);
          });
        });
      }
    }
    if (ex.type === "spot") {
      $$("#artArea [data-i]").forEach(function (ln) {
        var i = Number(ln.getAttribute("data-i"));
        function toggle() {
          if (S.checked[ex.id]) { return; }
          var a2 = ensureAns(ex);
          S.touch[ex.id] = true;
          a2.lines = a2.lines || [];
          var k = a2.lines.indexOf(i);
          if (k >= 0) { a2.lines.splice(k, 1); } else { a2.lines.push(i); }
          flagLine(ln, k < 0);
          updateHeader(); renderNav();
        }
        ln.addEventListener("click", toggle);
        ln.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); }
        });
        /* restore the visible flagged state when the learner comes back later */
        var a3 = S.ans[ex.id];
        flagLine(ln, !!(a3 && a3.lines && a3.lines.indexOf(i) >= 0) && !S.checked[ex.id]);
      });
    }
  }
  function flagLine(ln, on) {
    ln.classList.toggle("bad", on);
    var mark = $(".flagmark", ln);
    if (on && !mark) {
      mark = document.createElement("span");
      mark.className = "verdict bad flagmark";
      mark.textContent = "flagged";
      ln.appendChild(mark);
    } else if (!on && mark) {
      mark.parentNode.removeChild(mark);
    }
  }

  function focusTip(ex) {
    var k = (ex.kw || []).slice(0, 4).join(", ");
    return '<p class="small"><b>What to revise if you lost points here:</b> ' + esc(ex.theme) + ". Key terms to review: " + esc(k) + ".</p>";
  }
  function feedbackHTML(ex, g) {
    var cls = g.earned >= g.max - 0.01 ? "good" : (g.earned > 0 ? "mid" : "poor");
    var h = '<div class="block fb ' + cls + '" role="status" aria-live="polite"><h3>Feedback</h3>';
    h += "<p><b>You earned " + fx(g.earned) + " / " + fx(g.max) + " points</b> (" + g.hit + " of " + g.total + " correct elements).</p>";
    if (g.hinted) { h += '<p class="small">A hint was used on this exercise, so a 10 percent penalty was applied.</p>'; }
    h += "<ul>" + g.notes.map(function (n) { return "<li>" + n + "</li>"; }).join("") + "</ul>";
    if (ex.type === "terminal") { h += '<p class="small"><b>Reference command:</b> <code>' + esc(ex.solution) + "</code></p>"; }
    h += "<p><b>Why this answer works:</b> " + ex.why + "</p>";
    if (g.earned < g.max - 0.01) { h += focusTip(ex); }
    return h + "</div>";
  }

  function cardHTML() {
    var ex = cur();
    var num = S.idx + 1;
    var h = '<article class="ex' + (S.manualPause ? " paused" : "") + '" id="qcard">';
    h += '<div class="exhead"><span class="tag tagtheme">Q' + num + " of " + S.order.length + '</span><span class="tag">' + typeLabel(ex) + '</span><span class="tag">' + esc(ex.theme) + '</span><span class="tag">' + ex.points + " pts</span>" + (S.skip[ex.id] ? '<span class="tag" style="border-color:#f0a93a;color:#f0a93a">skipped</span>' : "") + (S.hint[ex.id] ? '<span class="tag" style="border-color:#ffc247;color:#ffc247">hint used</span>' : "") + "</div>";
    h += '<div class="block scen"><h3>Scenario</h3><p>' + ex.scenario + "</p></div>";
    if (ex.art) { h += '<div id="artArea">' + artHTML(ex) + "</div>"; }
    h += '<div class="block quest"><h3>Question</h3><p>' + ex.question + "</p></div>";
    h += '<div class="block ans"><h3>' + answerLabel(ex) + '</h3><div id="ansArea"></div>' + (S.hint[ex.id] ? '<div class="hintbox"><b>Hint:</b> ' + ex.hint + "</div>" : "") + "</div>";
    h += '<div class="btnrow">' +
      '<button type="button" class="btn ok" id="checkBtn">Check</button>' +
      (S.checked[ex.id] ? '<button type="button" class="btn warn" id="reviseBtn">Revise</button>' : "") +
      (S.skip[ex.id] ? '<button type="button" class="btn ghost" id="skipBtn" disabled>Skipped</button>' : '<button type="button" class="btn ghost" id="skipBtn">Skip</button>') +
      (!S.hint[ex.id] && !S.checked[ex.id] ? '<button type="button" class="btn ghost" id="hintBtn">Hint (-10%)</button>' : "") +
      '<span class="spacer"></span>' +
      '<button type="button" class="btn" id="prevBtn"' + (S.idx === 0 ? " disabled" : "") + ">Previous</button>" +
      '<button type="button" class="btn primary" id="nextBtn">' + (S.idx === S.order.length - 1 ? "Next (finish)" : "Next") + "</button>" +
      "</div>";
    if (S.checked[ex.id]) { h += feedbackHTML(ex, gradeOf(ex)); }
    h += "</article>";
    return h;
  }

  function bindCard() {
    var ex = cur();
    bindArtefact(ex);
    var cb = $("#checkBtn");
    if (cb) {
      cb.disabled = !!S.checked[ex.id];
      cb.addEventListener("click", function () {
        S.checked[ex.id] = true;
        delete S.skip[ex.id];
        S.checkPause = true;
        selChip = { id: null, i: null };
        renderExam();
      });
    }
    var rb = $("#reviseBtn");
    if (rb) {
      rb.addEventListener("click", function () {
        S.checked[ex.id] = false;
        renderCard(); updateHeader(); renderNav();
      });
    }
    var sb = $("#skipBtn");
    if (sb && !sb.disabled) { sb.addEventListener("click", function () { doSkip(); }); }
    var hb = $("#hintBtn");
    if (hb) {
      hb.addEventListener("click", function () {
        S.hint[ex.id] = true;
        renderCard();
      });
    }
    var pb = $("#prevBtn");
    if (pb) { pb.addEventListener("click", function () { if (S.idx > 0) { S.idx--; leaveReview(); render(); } }); }
    var nb = $("#nextBtn");
    if (nb) { nb.addEventListener("click", function () { doNext(); }); }
  }

  function renderCard() {
    var host = $("#qhost");
    if (!host) { return; }
    host.innerHTML = cardHTML();
    bindCard();
    drawAnswer();
    var ex = cur();
    if (S.checked[ex.id]) {
      var root = $("#qcard");
      gradeOf(ex, root);
    }
    if (S.manualPause) {
      var msg = document.createElement("div");
      msg.className = "pausemsg";
      msg.textContent = "Paused (manual). The exercise is hidden while the clock is stopped. Press Resume to continue.";
      host.insertBefore(msg, host.firstChild);
      $$("button, input, select", $("#qcard")).forEach(function (c2) { c2.disabled = true; });
      $$("[tabindex]", $("#qcard")).forEach(function (c2) { c2.setAttribute("tabindex", "-1"); });
    }
  }
  function render() {
    if (S.phase === "intro") { renderIntro(); }
    else if (S.phase === "exam") { renderExam(); }
    else { renderResults(); }
  }

  function doNext() {
    S.checkPause = false;
    if (S.idx < S.order.length - 1) { S.idx++; render(); }
    else { finish(false); }
  }
  function doSkip() {
    var ex = cur();
    S.skip[ex.id] = true;
    S.checked[ex.id] = false;
    S.checkPause = false;
    if (S.idx < S.order.length - 1) { S.idx++; render(); } else { render(); }
    renderNav(); updateHeader();
  }

  /* ---------------- timer ---------------- */
  function tick() {
    if (S.ended || S.phase !== "exam") { return; }
    if (S.manualPause || S.checkPause) { return; }
    S.timeLeft--;
    if (S.timeLeft <= 0) { S.timeLeft = 0; updateHeader(); finish(true); return; }
    updateHeader();
  }

  /* ---------------- screens ---------------- */
  function renderNav() {
    var host = $("#navhost");
    if (host) {
      host.innerHTML = navHTML();
      $$("[data-n]", host).forEach(function (b) {
        b.addEventListener("click", function () {
          var target = Number(b.getAttribute("data-n"));
          if (target !== S.idx) { leaveReview(); }
          S.idx = target;
          render();
        });
      });
    }
  }
  /* Leaving the exercise also ends the review pause. This can only remove free
     time, never add it, so the Check-pause rule stays intact. */
  function leaveReview() { S.checkPause = false; }

  function renderExam() {
    app.innerHTML = headerHTML() + '<div class="wrap"><div id="navhost"></div><div id="themehost"></div><div id="qhost"></div></div>';
    renderNav();
    var th = $("#themehost");
    if (th) { th.innerHTML = themeProgressHTML(); }
    renderCard();
    updateHeader();
    var pauseBtn = $("#pauseBtn");
    if (pauseBtn) {
      pauseBtn.addEventListener("click", function () {
        S.manualPause = !S.manualPause;
        render();
      });
    }
    $("#submitBtn").addEventListener("click", function () { finish(false); });
  }

  function kwPanel() {
    var h = '<div class="card"><h2>Keywords covered in this exam</h2><p class="small mut">Every keyword below is exercised in this file through the scenarios, artefacts and questions that follow.</p><div class="kwgrid">';
    KW.forEach(function (g) {
      h += '<div class="kwbox"><h4>' + g.theme + '</h4><div class="kwlist">' + g.items.map(function (k) { return '<span class="kw">' + k + "</span>"; }).join("") + "</div></div>";
    });
    return h + "</div></div>";
  }

  function renderIntro() {
    var diff = (META.difficulty || "medium").toUpperCase();
    var typeList = "scenario simulations, branching decisions, drag and click classification, ordering and ranking, matching, fill in the gaps, log and config analysis with a filter box, spot the mistake, two-perspective blue and red team work, a numeric calculation, and a terminal emulator where you type a real command.";
    var h = '<div class="wrap">';
    h += "<h1>" + esc(META.title || "Practice exam") + "</h1>";
    h += '<div class="card"><span class="tag tagtheme">' + esc(META.topicId) + "</span> " +
      '<span class="tag">Chapter ' + esc(META.chapter) + "</span> " +
      '<span class="tag">Severity: ' + diff + "</span> " +
      '<span class="tag">' + Q.length + " exercises</span> " +
      '<span class="tag">' + (META.estimatedMinutes || 60) + " minutes</span> " +
      '<span class="tag">Pass mark ' + PASS + "%</span>" +
      (S.user.name ? '<span class="tag">Candidate: ' + esc(S.user.name) + "</span>" : "") +
      "</div>";
    h += kwPanel();
    h += '<div class="card"><h2>How this exam works</h2><ul>' +
      "<li><b>Severity:</b> every exercise in this file is " + diff + " level. The other file of this chapter is a different exam at another severity.</li>" +
      "<li><b>Question mix:</b> " + typeList + "</li>" +
      "<li><b>Every exercise is labelled</b> so you always see the scenario, then the question, then the answer area in separate blocks.</li>" +
      "<li><b>Check button:</b> validates your answer, marks each element as correct, wrong or missed, locks the answer, shows the explanation and pauses the timer in review mode.</li>" +
      "<li><b>Timer pause, reason one (manual):</b> the Pause button blurs the exercise so you cannot study it while the clock is stopped. Press Resume to continue.</li>" +
      "<li><b>Timer pause, reason two (Check-pause):</b> after Check the exercise stays fully visible with its marks, its feedback and its explanation, and the clock is frozen. Pressing Check again, reading the explanation, or pressing Pause and Resume does not restart the clock. The clock restarts when you move on: <b>Next</b>, <b>Skip</b>, or choosing another question in the navigator.</li>" +
      "<li><b>Skip button:</b> moves to the next exercise straight away, with no pause. Skipped exercises are marked amber in the navigator, and at the end their points are removed from both the earned total and the possible total.</li>" +
      "<li><b>Coming back:</b> until the timer ends you can return to any exercise, including a skipped one, with the navigator, and you can revise an answer with the Revise button. Checking a skipped exercise removes the skip flag.</li>" +
      "<li><b>Partial credit:</b> multi-answer exercises score per correct element. Three correct slots out of four earn three quarters of the points. The feedback shows the points you earned on each exercise, and the final total is rounded to whole points once, on the results screen.</li>" +
      "<li><b>Live tracking:</b> the score counter, the progress bar, the question navigator and the progress-by-theme panel update as you check exercises.</li>" +
      "<li><b>Hints:</b> a hint costs 10 percent of that exercise. A hint never pauses the timer.</li>" +
      "<li><b>Result:</b> the final score counts only the exercises you answered and checked. Skipped exercises, and exercises you never checked, are taken out of both the earned points and the possible points. You need " + PASS + " percent of the counted exercises to pass. The results screen shows the full report with explanations, per-element feedback and what to revise for every exercise, including the ones you skipped.</li>" +
      "</ul></div>";
    h += '<div class="btnrow"><button type="button" class="btn primary" id="startBtn">Start the exam</button></div>';
    h += "</div>";
    app.innerHTML = h;
    $("#startBtn").addEventListener("click", startExam);
  }

  function fmtRows() {
    return S.order.map(function (qi, n) {
      var ex = Q[qi];
      var g = gradeOf(ex);
      var lab = labelFor(ex);
      var skipRow = lab === "skipped" || lab === "excluded";
      var cls = skipRow ? "st-skip" : (lab === "full" ? "st-ok" : (lab === "partial" ? "st-mid" : "st-bad"));
      var shown = S.checked[ex.id] ? g.earned : 0;
      var earned = skipRow ? "" : fx(shown) + " / " + fx(g.max);
      var tip = (lab === "zero" || lab === "partial") ? focusTip(ex) : "";
      return "<tr class=\"" + cls + '"><td>' + (n + 1) + "</td><td>" + esc(ex.theme) + "</td><td>" + typeLabel(ex) + '</td><td class="st">' + lab + "</td><td>" + earned + "</td><td>" + esc(g.student) + "</td><td>" + esc(g.correct) + "</td><td>" + ex.why + (g.notes.length ? '<ul class="small">' + g.notes.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>" : "") + tip + "</td></tr>";
    }).join("");
  }

  function renderResults() {
    S.phase = "results";
    var mx = finalMax(), er = finalEarned();
    /* Partial credit is rounded once, here, and every figure on this screen and
       in the score message is computed from the same rounded pair, so the site
       can never record a different percentage from the one the learner sees. */
    var score = Math.round(er), total = Math.round(mx);
    var pct = total > 0 ? Math.round((score / total) * 100) : 0;
    var pass = pct >= PASS;
    var skipped = S.order.map(function (qi, n) { return S.skip[Q[qi].id] ? (n + 1) : null; }).filter(function (x) { return x !== null; });
    var excluded = excludedList();
    var h = '<div class="wrap"><h1>Exam result</h1>';
    h += pass
      ? '<div class="cert"><div class="tag tagtheme">Certificate style result</div><h2>' + esc(META.title) + "</h2><p class=\"big\" id=\"pctBig\">' + pct + '%</p><p><b>PASS</b> - you reached the ' + PASS + ' percent pass mark.</p></div>"
      : '<div class="card" style="border-color:#ff7b7b"><h2>FAIL - you did not reach ' + PASS + " percent</h2><p>You must retake this exam to master the chapter. Read the report below first: it explains every answer, including the ones you skipped.</p></div>";
    h += '<div class="grade">' +
      '<div class="gcard"><span class="small mut">Points earned</span><b>' + score + "</b><span class=\"small mut\">rounded from " + fx(er) + "</span></div>" +
      '<div class="gcard"><span class="small mut">Points possible (counted exercises)</span><b>' + total + "</b><span class=\"small mut\">rounded from " + fx(mx) + "</span></div>" +
      '<div class="gcard"><span class="small mut">Percentage</span><b>' + pct + "%</b></div>" +
      '<div class="gcard"><span class="small mut">Exercises counted (answered and checked)</span><b>' + gradedSet().length + "</b></div>" +
      '<div class="gcard"><span class="small mut">Exercises skipped</span><b>' + skipped.length + "</b></div>" +
      "</div>";
    h += '<p class="small mut">Partial credit from multi-answer exercises is rounded to the nearest whole point once, on this screen, and the pass decision and the recorded score both use that rounded pair.</p>';
    if (skipped.length) {
      h += '<div class="skipnote"><b>Skipped and excluded from scoring:</b> exercise numbers ' + skipped.join(", ") + ". Their points were removed from both the earned total and the possible total.</div>";
    }
    if (excluded.length) {
      h += '<div class="skipnote"><b>Never checked, so excluded from scoring:</b> exercise numbers ' + excluded.join(", ") + ". You did not check these during the exam, so they count as unanswered and their points were removed from both totals, exactly like skipped exercises.</div>";
    }
    h += '<p class="small mut">The percentage above is the earned points divided by the points of the ' + gradedSet().length + " exercise(s) that were answered and checked.</p>";
    if (S.hintUsedCount) { h += '<p class="small mut">Hints were used on ' + S.hintUsedCount + " exercises, and each one carried a 10 percent penalty on that exercise.</p>"; }
    h += '<div class="btnrow"><button type="button" class="btn primary" id="retakeBtn">Retake Exam</button></div>';
    h += '<div class="card"><h2>Full report, exercise by exercise</h2><p class="small mut">Your answer, the correct answer, the points earned (with partial credit), the label and the explanation are shown for every exercise.</p><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Theme</th><th>Type</th><th>Result</th><th>Points</th><th>Your answer</th><th>Correct answer</th><th>Explanation, per-element feedback and what to revise</th></tr></thead><tbody>' + fmtRows() + "</tbody></table></div></div></div>";
    app.innerHTML = h;
    $("#retakeBtn").addEventListener("click", function () { S = freshState(); selChip = { id: null, i: null }; startExam(); });
    reportOnce(score, total);
  }

  /* ---------------- score reporting ---------------- */
  function reportOnce(score, total) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var big = $("#pctBig");
    function send() {
      if (S.reported) { return; }
      S.reported = true;
      var percent = total > 0 ? Math.round((score / total) * 100) : 0;
      try {
        parent.postMessage({
          type: "CYBERPULSE_SCORE",
          topicId: META.topicId,
          score: score,
          total: total,
          percent: percent,
          passed: percent >= PASS
        }, location.origin);
      } catch (e) { /* opened directly, nothing to report to */ }
    }
    if (!big || reduce || S.reported) { send(); return; }
    var start = null;
    var target = parseInt(big.textContent, 10) || 0;
    function step(ts) {
      if (start === null) { start = ts; }
      var p = Math.min(1, (ts - start) / 700);
      var v = Math.round(target * p);
      big.textContent = v + "%";
      if (p < 1) { window.requestAnimationFrame(step); } else { big.textContent = target + "%"; send(); }
    }
    window.requestAnimationFrame(step);
  }

  /* ---------------- start and finish ---------------- */
  function startExam() {
    S.phase = "exam";
    S.order = shuffle(range(Q.length));
    S.idx = 0;
    S.ans = {}; S.checked = {}; S.skip = {}; S.hint = {};
    S.disp = {}; S.bank = {};
    S.hintUsedCount = 0;
    S.manualPause = false; S.checkPause = false; S.ended = false; S.reported = false;
    S.timeLeft = (META.estimatedMinutes || 60) * 60;
    S.hintUsedCount = 0;
    S.order.forEach(function (qi) {
      var ex = Q[qi];
      if (ex.type === "order") { S.ans[ex.id] = { ord: disp(ex).slice() }; }
    });
    if (S.timer) { clearInterval(S.timer); }
    S.timer = setInterval(tick, 1000);
    renderExam();
  }

  function finish(auto) {
    if (S.ended) { return; }
    if (gradedSet().length === 0) {
      window.alert("No exercise has been answered and checked yet. Answer and check at least one exercise before you submit.");
      return;
    }
    var unchecked = excludedList().length;
    if (!auto && unchecked > 0) {
      var ok = window.confirm(unchecked + " exercise(s) were never checked. They are excluded from both the earned points and the possible points, exactly like skipped exercises. Submit the exam now?");
      if (!ok) { return; }
    }
    S.ended = true;
    S.checkPause = false; S.manualPause = false;
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
    S.hintUsedCount = Object.keys(S.hint).filter(function (k) { return S.hint[k]; }).length;
    renderResults();
  }

  /* ---------------- handshake ---------------- */
  window.addEventListener("message", function (event) {
    if (!event.data) { return; }
    if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") { return; }
    if (event.data.username) { S.user.name = String(event.data.username); }
    if (event.data.country) { S.user.country = String(event.data.country); }
    if (event.data.theme) { S.user.theme = String(event.data.theme); }
    if (S.phase === "intro") { renderIntro(); }
  });

  /* ---------------- boot ---------------- */
  renderIntro();
})();

</script>
</body>
</html>
