<div id="pauseOverlay" class="hide">
  <div class="pbox">
    <div class="t">Paused (manual)</div>
    <div class="s">Question content is hidden while the timer is stopped.<br>Press Resume to continue the exam.</div>
    <div style="margin-top:14px"><button id="btnResume" class="btn primary">Resume exam</button></div>
  </div>
</div>
<script>
'use strict';
/* ===================== configuration & state ===================== */
var CFG = {
  mins: 75, diff: 'MEDIUM', diffLow: 'medium',
  cert: 'CompTIA Security+ (SY0-701)', chap: '4.6 Identity and Access Management',
  topicId: 'security-plus', passMark: 70, ptsPerEx: 10
};
/* keep engine config in lockstep with the per-file metadata block (spec 6.1: metadata must be true).
   This is what makes the HARD file run 60 min / 'HARD' while MEDIUM runs 75 min / 'MEDIUM'. */
try {
  var __meta = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
  if (__meta.estimatedMinutes) CFG.mins = __meta.estimatedMinutes;
  if (__meta.difficulty) { CFG.diffLow = __meta.difficulty; CFG.diff = String(__meta.difficulty).toUpperCase(); }
} catch (e) { /* metadata missing — defaults stay */ }
var THEMES = [];
var EX = [];
var S = null;
var TICK = null;
var candidate = { name: '', country: '' };

function freshState() {
  return {
    order: [], st: [], idx: 0, tleft: CFG.mins * 60,
    manualPause: false, checkPause: false, ended: false, reported: false, attempt: 1, startAt: 0
  };
}
/* ===================== small utils ===================== */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(a) { var r = a.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
function r2(n) { return Math.round(n * 100) / 100; }
function fmtTime(s) { s = Math.max(0, s); var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function normCmd(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function curEx() { return EX[S.order[S.idx]]; }
function curSt() { return S.st[S.order[S.idx]]; }
function exState(exi) {
  var st = S.st[exi];
  if (!st.ans) {
    var ex = EX[exi];
    if (ex.t === 'multi') st.ans = [];
    else if (ex.t === 'slots') { st.ans = {}; ex.it.forEach(function (it, i) { st.ans[i] = -1; }); }
    else if (ex.t === 'match') { st.ans = {}; ex.rt.forEach(function (r, i) { st.ans[i] = -1; }); }
    else if (ex.t === 'order' || ex.t === 'rank') st.ans = st.perm.items.slice();
    else if (ex.t === 'fill') st.ans = (ex.fblanks.length > 1) ? ex.fblanks.map(function () { return -1; }) : '';
    else if (ex.t === 'terminal') st.ans = ex.tps.map(function () { return ''; });
    else if (ex.t === 'branch') { st.ans = ex.steps.map(function () { return -1; }); st.revealed = 0; }
    else if (ex.t === 'spot') st.ans = [];
    else if (ex.t === 'log') { st.ans = null; if (!st.inner) st.inner = { ans: null }; initAns(ex.inner, st.inner, ex); }
    else st.ans = -1;
  }
  return st;
}
function initAns(ex, st) {
  var t = ex.t || ex.kind;
  if (t === 'multi') st.ans = [];
  else if (t === 'fill') st.ans = (ex.fblanks.length > 1) ? ex.fblanks.map(function () { return -1; }) : '';
  else st.ans = -1;
}
function buildPerms() {
  EX.forEach(function (ex, i) {
    var p = { o: null, items: null, right: null, bank: null, lines: null };
    if (ex.t === 'mc' || ex.t === 'multi') p.o = shuffle(ex.o.map(function (_, k) { return k; }));
    if (ex.t === 'slots') p.items = shuffle(ex.it.map(function (_, k) { return k; }));
    if (ex.t === 'match') p.right = shuffle(ex.rt.map(function (_, k) { return k; }));
    if (ex.t === 'order' || ex.t === 'rank') {
      var idxs = ex.oseq.map(function (_, k) { return k; });
      var sh = idxs.slice(); while (sh.every(function (v, k) { return v === idxs[k]; })) sh = shuffle(idxs);
      p.items = sh;
    }
    if (ex.t === 'fill' && ex.fblanks.length > 1) {
      var words = [];
      ex.fblanks.forEach(function (b) { words.push(b[0]); });
      (ex.fbank || []).forEach(function (w) { words.push(w); });
      p.bank = shuffle(words.map(function (_, k) { return k; }));
      p.words = words;
    }
    if (ex.t === 'spot') p.lines = ex.lines.map(function (_, k) { return k; });
    if (ex.t === 'log') {
      var inn = ex.inner;
      if (inn.kind === 'mc' || inn.kind === 'multi') p.o = shuffle(inn.o.map(function (_, k) { return k; }));
      if (inn.kind === 'fill' && inn.fblanks.length > 1) {
        var words2 = [];
        inn.fblanks.forEach(function (b) { words2.push(b[0]); });
        (inn.fbank || []).forEach(function (w) { words2.push(w); });
        p.bank = shuffle(words2.map(function (_, k) { return k; }));
        p.words = words2;
      }
    }
    S.st[i].perm = p;
  });
}
/* ===================== timer ===================== */
function tick() {
  if (S.ended || S.manualPause || S.checkPause) return;
  S.tleft--;
  if (S.tleft <= 0) { S.tleft = 0; paintTimer(); finishExam('time'); return; }
  paintTimer();
}
function paintTimer() {
  var t = $('timerTxt'); t.textContent = fmtTime(S.tleft);
  var box = $('timerBox');
  box.classList.remove('warn', 'danger');
  if (S.tleft <= CFG.mins * 60 * 0.1) box.classList.add('danger');
  else if (S.tleft <= CFG.mins * 60 * 0.25) box.classList.add('warn');
  box.setAttribute('aria-label', 'Time remaining ' + fmtTime(S.tleft));
}
function paintPause() {
  var w = $('pauseState'); w.innerHTML = '';
  if (S.manualPause) { var a = el('span', 'ind manual', '<span aria-hidden="true">✕</span> Paused (manual)'); w.appendChild(a); }
  if (S.checkPause) { var b = el('span', 'ind review', '<span aria-hidden="true">◷</span> Timer paused — review mode'); w.appendChild(b); }
  var pb = $('btnPause');
  pb.textContent = S.manualPause ? 'Resume' : 'Pause';
  pb.setAttribute('aria-pressed', S.manualPause ? 'true' : 'false');
}
function setManualPause(on) {
  if (S.ended) return;
  S.manualPause = on;
  $('pauseOverlay').classList.toggle('hide', !on);
  paintPause();
}
/* ===================== header paint ===================== */
function themeOf(ex) { return THEMES[ex.th] ? THEMES[ex.th].n : 'General'; }
function paintHeader() {
  var done = 0, exTotal = EX.length;
  S.st.forEach(function (s) { if (s.vis !== 'new') done++; });
  var pct = Math.round((done / exTotal) * 100);
  $('progressBar').style.width = pct + '%';
  $('progressWrap').setAttribute('aria-valuenow', pct);
  var earned = 0, counted = 0;
  S.st.forEach(function (s) { if (s.vis === 'checked') { earned += s.earned; counted++; } });
  $('scoreTxt').textContent = (Math.round(earned * 10) / 10) + (counted ? ' / ' + (counted * CFG.ptsPerEx) : '');
  var tr = $('themesRow'); tr.innerHTML = '';
  THEMES.forEach(function (th, ti) {
    var tot = 0, dn = 0;
    S.order.forEach(function (exi) { if (EX[exi].th === ti) { tot++; var s = S.st[exi]; if (s.vis !== 'new') dn++; } });
    var c = el('span', 'tchip', esc(th.n) + ' <b>' + dn + '/' + tot + '</b>');
    tr.appendChild(c);
  });
  var ng = $('navGrid'); ng.innerHTML = '';
  S.order.forEach(function (exi, pos) {
    var s = S.st[exi];
    var cls = 'navq';
    var g = '';
    if (s.vis === 'checked') {
      var f = s.earned / CFG.ptsPerEx;
      if (f >= 0.999) { cls += ' ok'; g = '<span class="g" aria-hidden="true">✓</span>'; }
      else if (f > 0) { cls += ' part'; g = '<span class="g" aria-hidden="true">~</span>'; }
      else { cls += ' bad'; g = '<span class="g" aria-hidden="true">✕</span>'; }
    } else if (s.vis === 'skip') { cls += ' skip'; g = '<span class="g" aria-hidden="true">»</span>'; }
    if (pos === S.idx) cls += ' cur';
    var b = el('button', cls, String(pos + 1) + g);
    b.type = 'button';
    b.setAttribute('aria-label', 'Question ' + (pos + 1) + ' — ' + (s.vis === 'checked' ? (f >= 0.999 ? 'checked, correct' : (f > 0 ? 'checked, partial' : 'checked, wrong')) : (s.vis === 'skip' ? 'skipped' : 'not answered')));
    b.addEventListener('click', function () { goTo(pos); });
    ng.appendChild(b);
  });
}
function goTo(pos) {
  if (S.ended) return;
  /* Check-pause only ends when the student MOVES to another exercise (Next, Back or navigator).
     Clicking the current question's navigator tile must not resume the clock (spec Step 2). */
  if (S.checkPause && pos !== S.idx) S.checkPause = false;
  S.idx = pos;
  renderQ();
}
/* ===================== exercise renderers ===================== */
function artHtml(ex) {
  if (!ex.art) return '';
  return ex.art.map(function (a) {
    return '<div class="art"><div class="albl"><span aria-hidden="true">▤</span>' + esc(a.l) + '</div><pre class="pre">' + a.pre + '</pre></div>';
  }).join('');
}
function blkScenario(ex) {
  return '<div class="blk scenario"><span class="lbl">SCENARIO</span><div>' + ex.sc + '</div></div>';
}
function blkQuestion(ex) {
  return '<div class="blk question"><span class="lbl">QUESTION</span><div>' + ex.q + '</div></div>';
}
function answersLabel(t) {
  return {
    mc: 'CHOOSE ONE', multi: 'SELECT ALL THAT APPLY', slots: 'DRAG EACH ITEM INTO ITS BUCKET (or click item, then bucket)',
    match: 'MATCH THE PAIRS (drag a right-side item onto a left row)', order: 'PUT THE STEPS IN THE RIGHT ORDER (drag or use the arrows)',
    rank: 'RANK BY RISK — 1 = MOST SEVERE (drag or use the arrows)', fill: 'FILL THE BLANKS FROM THE WORD BANK',
    terminal: 'TYPE THE COMMAND(S)', spot: 'CLICK THE LINE(S) THAT CONTAIN THE MISTAKE', branch: 'CHOOSE ONE FOR EACH STEP', log: 'ANSWER BELOW'
  }[t] || 'ANSWER';
}
function markSpan(cls, word) { return '<span class="mark ' + cls + '">' + (cls === 'ok' ? '✓ ' : cls === 'bad' ? '✕ ' : '▲ ') + word + '</span>'; }

function renderQ() {
  var ex = curEx(), st = exState(S.order[S.idx]);
  paintHeader(); paintPause();
  var host = $('qHost'); host.innerHTML = '';
  var card = el('div', 'qcard');
  var head = '<div class="qhead"><span class="qnum">Q' + (S.idx + 1) + '/' + EX.length + '</span>' +
    '<span class="chip"><span aria-hidden="true">◈</span>' + esc(themeOf(ex)) + '</span>' +
    '<span class="qtitle">' + esc(ex.title) + '</span></div>';
  card.innerHTML = head + blkScenario(ex) + artHtml(ex) + blkQuestion(ex);
  var ans = el('div', 'blk ansblk');
  ans.innerHTML = '<span class="lbl">' + answersLabel(ex.t) + '</span>';
  var area = el('div');
  ans.appendChild(area);
  card.appendChild(ans);
  var acts = el('div', 'acts');
  var bCheck = el('button', 'btn primary', 'Check');
  bCheck.type = 'button'; bCheck.id = 'btnCheck';
  var bRev = el('button', 'btn', 'Revise');
  bRev.type = 'button'; bRev.id = 'btnRevise';
  var bHint = el('button', 'btn warnbtn', 'Hint (−10%)');
  bHint.type = 'button'; bHint.id = 'btnHint';
  var bSkip = el('button', 'btn danger', 'Skip');
  bSkip.type = 'button'; bSkip.id = 'btnSkip';
  acts.appendChild(bCheck); acts.appendChild(bRev); acts.appendChild(bHint); acts.appendChild(bSkip);
  var sp = el('span', 'spacer'); acts.appendChild(sp);
  var lockNote = el('span', 'locknote');
  acts.appendChild(lockNote);
  card.appendChild(acts);
  var feed = el('div'); feed.id = 'feedArea'; card.appendChild(feed);
  host.appendChild(card);
  var nav = el('div', 'navrow');
  var bBack = el('button', 'btn sm', '← Back'); bBack.type = 'button'; bBack.id = 'btnBack';
  var pos = el('span', 'qpos', 'Question ' + (S.idx + 1) + ' of ' + EX.length);
  var bNext = el('button', 'btn sm primary', 'Next →'); bNext.type = 'button'; bNext.id = 'btnNext';
  var bFin = el('button', 'btn sm', 'Finish exam'); bFin.type = 'button'; bFin.id = 'btnFinish';
  nav.appendChild(bBack); nav.appendChild(pos); nav.appendChild(bFin); nav.appendChild(bNext);
  host.appendChild(nav);

  var REN = { mc: rMC, multi: rMulti, slots: rSlots, match: rMatch, order: rOrder, rank: rOrder, fill: rFill, terminal: rTerm, branch: rBranch, spot: rSpot, log: rLog };
  REN[ex.t](ex, st, area);

  bCheck.addEventListener('click', function () { doCheck(); });
  bRev.addEventListener('click', function () { doRevise(); });
  bHint.addEventListener('click', function () { doHint(); });
  bSkip.addEventListener('click', function () { doSkip(); });
  bBack.addEventListener('click', function () { if (S.idx > 0) goTo(S.idx - 1); });
  bNext.addEventListener('click', function () {
    if (S.checkPause) S.checkPause = false;
    if (S.idx < EX.length - 1) { S.idx++; renderQ(); }
  });
  bFin.addEventListener('click', askFinish);
  bBack.disabled = (S.idx === 0); /* honest state: there is nothing before Q1 */
  var checked = (st.vis === 'checked');
  bCheck.disabled = checked;
  bRev.disabled = !checked;
  bHint.disabled = checked || st.hints >= (ex.hints ? ex.hints.length : 0);
  bSkip.disabled = checked;
  if (checked) { lockNote.textContent = 'Answer locked — use Revise to change it (timer rule applies again on the next Check).'; applyFeedback(ex, st, feed); }
  if (st.hints > 0) showHints(ex, st, feed);
  var first = area.querySelector('button,input,[tabindex]');
  if (first && !S.manualPause) { try { first.focus({ preventScroll: false }); } catch (e) { } }
}
/* ---- choice types ---- */
function optBtn(kind, o, dsIdx) {
  var b = el('button', 'opt');
  b.type = 'button';
  b.setAttribute('data-i', dsIdx);
  b.setAttribute(kind === 'multi' ? 'role' : 'role', kind === 'multi' ? 'checkbox' : 'radio');
  b.setAttribute('aria-checked', 'false');
  b.innerHTML = '<span class="key" aria-hidden="true">' + (kind === 'multi' ? '▣' : '◯') + '</span><span class="otxt">' + o.h + '</span>';
  return b;
}
function rMC(ex, st, area) {
  var wrap = el('div', 'opts'); wrap.setAttribute('role', 'radiogroup'); wrap.setAttribute('aria-label', 'Answer options');
  st.perm.o.forEach(function (oi) {
    var b = optBtn('mc', ex.o[oi], oi);
    if (st.ans === oi) { b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); }
    if (st.vis === 'checked') b.disabled = true;
    b.addEventListener('click', function () {
      if (st.vis === 'checked') return;
      st.ans = oi;
      wrap.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); x.setAttribute('aria-checked', 'false'); });
      b.classList.add('sel'); b.setAttribute('aria-checked', 'true');
    });
    wrap.appendChild(b);
  });
  area.appendChild(wrap);
}
function rMulti(ex, st, area) {
  var wrap = el('div', 'opts'); wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Answer options, select all that apply');
  st.perm.o.forEach(function (oi) {
    var b = optBtn('multi', ex.o[oi], oi);
    if (st.ans.indexOf(oi) >= 0) { b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); b.querySelector('.key').textContent = '☑'; }
    if (st.vis === 'checked') b.disabled = true;
    b.addEventListener('click', function () {
      if (st.vis === 'checked') return;
      var p = st.ans.indexOf(oi);
      if (p >= 0) { st.ans.splice(p, 1); b.classList.remove('sel'); b.setAttribute('aria-checked', 'false'); b.querySelector('.key').textContent = '▣'; }
      else { st.ans.push(oi); b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); b.querySelector('.key').textContent = '☑'; }
    });
    wrap.appendChild(b);
  });
  area.appendChild(wrap);
}
/* ---- drag & drop: slots + match share a helper ---- */
function dndItem(o, idx, kind) {
  var b = el('button', 'itm');
  b.type = 'button'; b.draggable = true; b.setAttribute('data-idx', idx);
  b.innerHTML = o.h;
  b.setAttribute('aria-label', 'Item: ' + o.h.replace(/<[^>]*>/g, '').slice(0, 80) + '. Press Enter to pick it up, then activate a drop zone.');
  b.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(idx)); e.dataTransfer.effectAllowed = 'move'; document.querySelectorAll('.dz').forEach(function (z) { z.classList.add('drop-hot'); }); });
  b.addEventListener('dragend', function () { document.querySelectorAll('.dz').forEach(function (z) { z.classList.remove('drop-hot', 'over'); }); });
  b.addEventListener('click', function () {
    var cur = document.querySelector('.itm.picked');
    if (cur === b) { b.classList.remove('picked'); return; }
    document.querySelectorAll('.itm.picked').forEach(function (x) { x.classList.remove('picked'); });
    b.classList.add('picked');
  });
  return b;
}
function zoneAccept(zone, assignFn) {
  zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); zone.classList.remove('over');
    var idx = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (!isNaN(idx)) assignFn(idx);
  });
}
function rSlots(ex, st, area) {
  var grid = el('div', 'dz-area' + (ex.sl.length > 2 ? ' slots3' : ''));
  var zones = [];
  ex.sl.forEach(function (sl, si) {
    var z = el('div', 'dz'); z.setAttribute('data-slot', si);
    z.innerHTML = '<h4>' + esc(sl.n) + '</h4><div class="zbody"></div>';
    zones.push(z); grid.appendChild(z);
  });
  area.appendChild(grid);
  var bl = el('div', null, '<div style="font-size:12.5px;color:var(--dim2);margin:10px 0 4px;font-weight:700;letter-spacing:.6px">ITEMS</div>');
  var bank = el('div', 'bank'); bank.setAttribute('aria-label', 'Item bank');
  bl.appendChild(bank); area.appendChild(bl);
  function paint() {
    zones.forEach(function (z, si) {
      var zb = z.querySelector('.zbody'); zb.innerHTML = '';
      st.perm.items.forEach(function (ii) {
        if (st.ans[ii] === si) {
          var it = dndItem(ex.it[ii], ii, 'slot');
          if (st.vis === 'checked') it.disabled = true;
          zb.appendChild(it);
        }
      });
    });
    bank.innerHTML = '';
    st.perm.items.forEach(function (ii) {
      if (st.ans[ii] === -1) {
        var it = dndItem(ex.it[ii], ii, 'slot');
        if (st.vis === 'checked') it.disabled = true;
        bank.appendChild(it);
      }
    });
  }
  zones.forEach(function (z, si) {
    zoneAccept(z, function (idx) { if (st.vis === 'checked') return; st.ans[idx] = si; paint(); });
    z.addEventListener('click', function (e) {
      var cur = document.querySelector('.itm.picked');
      if (cur && !z.contains(cur)) { if (st.vis !== 'checked') { st.ans[parseInt(cur.getAttribute('data-idx'), 10)] = si; paint(); } }
    });
  });
  bank.addEventListener('click', function (e) {
    var cur = document.querySelector('.itm.picked');
    if (cur && !bank.contains(cur)) { if (st.vis !== 'checked') { st.ans[parseInt(cur.getAttribute('data-idx'), 10)] = -1; paint(); } }
  });
  paint();
}
function rMatch(ex, st, area) {
  var wrap = el('div', null);
  var rows = [];
  ex.lf.forEach(function (l, li) {
    var z = el('div', 'dz'); z.setAttribute('data-slot', li);
    z.innerHTML = '<h4>' + l.h + '</h4><div class="zbody"></div>';
    rows.push(z); wrap.appendChild(z);
    zoneAccept(z, function (idx) { if (st.vis === 'checked') return; st.ans[idx] = li; paint(); });
    z.addEventListener('click', function (e) {
      var cur = document.querySelector('.itm.picked');
      if (cur && !z.contains(cur)) { if (st.vis !== 'checked') { st.ans[parseInt(cur.getAttribute('data-idx'), 10)] = li; paint(); } }
    });
  });
  area.appendChild(wrap);
  var bl = el('div', null, '<div style="font-size:12.5px;color:var(--dim2);margin:10px 0 4px;font-weight:700;letter-spacing:.6px">RIGHT-SIDE ITEMS</div>');
  var bank = el('div', 'bank'); bl.appendChild(bank); area.appendChild(bl);
  function paint() {
    rows.forEach(function (z, li) {
      var zb = z.querySelector('.zbody'); zb.innerHTML = '';
      st.perm.right.forEach(function (ri) {
        if (st.ans[ri] === li) { var it = dndItem(ex.rt[ri], ri, 'match'); if (st.vis === 'checked') it.disabled = true; zb.appendChild(it); }
      });
    });
    bank.innerHTML = '';
    st.perm.right.forEach(function (ri) {
      if (st.ans[ri] === -1) { var it = dndItem(ex.rt[ri], ri, 'match'); if (st.vis === 'checked') it.disabled = true; bank.appendChild(it); }
    });
  }
  paint();
}
/* ---- ordering (order + rank) ---- */
function rOrder(ex, st, area) {
  var wrap = el('div', 'seq');
  function paint() {
    wrap.innerHTML = '';
    st.ans.forEach(function (ii, pos) {
      var row = el('div', 'row');
      row.draggable = true; row.setAttribute('data-idx', ii);
      row.innerHTML = '<span class="pos" aria-hidden="true">' + (pos + 1) + '</span><span class="txt">' + ex.oseq[ii].h + '</span>' +
        '<span class="mv"><button type="button" aria-label="Move item ' + (pos + 1) + ' up">↑</button><button type="button" aria-label="Move item ' + (pos + 1) + ' down">↓</button></span>';
      if (st.vis === 'checked') { row.draggable = false; row.querySelectorAll('button').forEach(function (b) { b.disabled = true; }); }
      var up = row.querySelector('button'), dn = row.querySelectorAll('button')[1];
      up.addEventListener('click', function () { if (st.vis !== 'checked' && pos > 0) { var t = st.ans[pos - 1]; st.ans[pos - 1] = st.ans[pos]; st.ans[pos] = t; paint(); } });
      dn.addEventListener('click', function () { if (st.vis !== 'checked' && pos < st.ans.length - 1) { var t = st.ans[pos + 1]; st.ans[pos + 1] = st.ans[pos]; st.ans[pos] = t; paint(); } });
      row.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(pos)); });
      row.addEventListener('dragover', function (e) { e.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', function () { row.classList.remove('dragover'); });
      row.addEventListener('drop', function (e) {
        e.preventDefault(); row.classList.remove('dragover');
        if (st.vis === 'checked') return;
        var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(from)) return;
        var mv = st.ans.splice(from, 1)[0];
        st.ans.splice(pos, 0, mv);
        paint();
      });
      wrap.appendChild(row);
    });
  }
  paint();
  area.appendChild(wrap);
}
/* ---- fill in the blanks ---- */
function rFill(ex, st, area) {
  var wrap = el('div');
  if (ex.fblanks.length > 1) {
    var txt = el('div', 'fillText');
    var parts = ex.ftext.split(/\{\{(\d+)\}\}/);
    var htmlStr = '';
    parts.forEach(function (p, i) {
      if (i % 2 === 0) htmlStr += p;
      else htmlStr += '<button type="button" class="blank" data-b="' + p + '" aria-label="Blank ' + (parseInt(p, 10) + 1) + ' — empty">_____</button>';
    });
    txt.innerHTML = htmlStr;
    wrap.appendChild(txt);
    var bl = el('div', null, '<div style="font-size:12.5px;color:var(--dim2);margin:12px 0 4px;font-weight:700;letter-spacing:.6px">WORD BANK</div>');
    var bank = el('div', 'bank'); bl.appendChild(bank); wrap.appendChild(bl);
    function paint() {
      txt.querySelectorAll('.blank').forEach(function (bk) {
        var bi = parseInt(bk.getAttribute('data-b'), 10);
        var w = st.ans[bi];
        if (w >= 0) { bk.textContent = st.perm.words[w]; bk.classList.add('filled'); bk.setAttribute('aria-label', 'Blank ' + (bi + 1) + ': ' + st.perm.words[w] + ' — activate to return the word'); }
        else { bk.textContent = '_____'; bk.classList.remove('filled'); bk.setAttribute('aria-label', 'Blank ' + (bi + 1) + ' — empty'); }
        bk.classList.remove('m-ok', 'm-bad', 'm-miss');
      });
      bank.innerHTML = '';
      st.perm.bank.forEach(function (wi) {
        var used = st.ans.indexOf(wi) >= 0;
        var chip = el('button', 'itm');
        chip.type = 'button'; chip.textContent = st.perm.words[wi];
        chip.disabled = used;
        chip.setAttribute('aria-label', 'Word: ' + st.perm.words[wi] + (used ? ' (used)' : ''));
        chip.addEventListener('click', function () {
          if (st.vis === 'checked') return;
          var target = st.ans.indexOf(-1);
          if (target >= 0) { st.ans[target] = wi; paint(); }
        });
        bank.appendChild(chip);
      });
    }
    txt.addEventListener('click', function (e) {
      var bk = e.target.closest('.blank');
      if (!bk || st.vis === 'checked') return;
      var bi = parseInt(bk.getAttribute('data-b'), 10);
      if (st.ans[bi] >= 0) { st.ans[bi] = -1; paint(); }
    });
    paint();
  } else {
    var inp = el('input');
    inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.className = 'fillTyped';
    inp.setAttribute('aria-label', 'Type your answer');
    inp.placeholder = ex.ph || 'Type the answer';
    inp.style.cssText = 'width:100%;max-width:520px;background:#08101f;border:1px solid var(--line2);border-radius:8px;color:var(--tx);font-size:15px;padding:10px 12px;min-height:44px';
    inp.value = st.ans || '';
    if (st.vis === 'checked') inp.disabled = true;
    inp.addEventListener('input', function () { if (st.vis !== 'checked') st.ans = inp.value; });
    wrap.appendChild(inp);
  }
  area.appendChild(wrap);
}

/* ---- log viewer ---- */
function rLog(ex, st, area) {
  if (!st.inner.perm) st.inner.perm = st.perm;
  var box = el('div', 'logbox');
  box.innerHTML = '<div class="lbar"><span aria-hidden="true" style="color:var(--acc)">⌕</span><input type="text" aria-label="Filter log lines" placeholder="filter…"><span class="cnt"></span></div><div class="lines" role="log" aria-label="Log lines"></div>';
  var fIn = box.querySelector('input'), linesEl = box.querySelector('.lines'), cnt = box.querySelector('.cnt');
  var lines = ex.lines;
  function paint() {
    var f = fIn.value.toLowerCase();
    linesEl.innerHTML = '';
    var shown = 0;
    lines.forEach(function (ln, i) {
      var plain = ln.replace(/<[^>]*>/g, '');
      if (f && plain.toLowerCase().indexOf(f) < 0) return;
      shown++;
      var d = el('div', 'ln');
      d.innerHTML = ln;
      if (ex.t === 'spot') {
        d.setAttribute('data-i', i); d.tabIndex = 0;
        if (st.ans.indexOf(i) >= 0) d.classList.add('pick');
        if (st.vis === 'checked') { d.style.cursor = 'default'; }
        else {
          d.style.cursor = 'pointer';
          d.addEventListener('click', function () { toggleSpot(i, d); });
          d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSpot(i, d); } });
        }
      }
      linesEl.appendChild(d);
    });
    cnt.textContent = shown + '/' + lines.length + ' lines';
  }
  function toggleSpot(i, d) {
    var p = st.ans.indexOf(i);
    if (p >= 0) { st.ans.splice(p, 1); d.classList.remove('pick'); }
    else { st.ans.push(i); d.classList.add('pick'); }
  }
  fIn.addEventListener('input', paint);
  paint();
  area.appendChild(box);
  var sub = el('div'); sub.style.marginTop = '12px';
  area.appendChild(sub);
  var inner = ex.inner;
  if (inner.kind === 'mc') rMC(inner, st.inner, sub);
  else if (inner.kind === 'multi') rMulti(inner, st.inner, sub);
  else if (inner.kind === 'fill') rFill(inner, st.inner, sub);
}
/* ---- branch ---- */
function rBranch(ex, st, area) {
  var wrap = el('div');
  function paint() {
    wrap.innerHTML = '';
    ex.steps.forEach(function (s, si) {
      if (si > st.revealed) return;
      var box = el('div', 'step');
      box.innerHTML = '<div class="sn">DECISION ' + (si + 1) + ' / ' + ex.steps.length + '</div><div>' + s.h + '</div>';
      if (st.ans[si] >= 0) box.innerHTML += '<div class="chosen">Your call: <b>' + s.o[st.ans[si]].h + '</b></div>';
      var og = el('div', 'opts'); og.style.marginTop = '10px';
      s.o.forEach(function (o, oi) {
        var b = optBtn('mc', o, oi);
        if (st.ans[si] === oi) { b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); }
        if (st.vis === 'checked') b.disabled = true;
        b.addEventListener('click', function () {
          if (st.vis === 'checked') return;
          st.ans[si] = oi;
          if (si === st.revealed && st.revealed < ex.steps.length - 1) st.revealed++;
          paint();
        });
        og.appendChild(b);
      });
      box.appendChild(og);
      wrap.appendChild(box);
    });
    if (st.revealed < ex.steps.length - 1) {
      var hint = el('div', 'locknote', 'Answer decision ' + (st.revealed + 1) + ' to unlock the next step.');
      wrap.appendChild(hint);
    }
  }
  paint();
  area.appendChild(wrap);
}
/* ---- spot the mistake ---- */
function rSpot(ex, st, area) {
  var box = el('div', 'logbox');
  box.innerHTML = '<div class="lbar"><span style="font-size:13px;color:var(--dim)">Config / transcript — click a line to flag it</span><span class="cnt"></span></div><div class="lines"></div>';
  var linesEl = box.querySelector('.lines');
  ex.lines.forEach(function (ln, i) {
    var d = el('div', 'ln');
    d.innerHTML = ln;
    d.tabIndex = 0; d.setAttribute('data-i', i);
    d.style.cursor = 'pointer';
    d.setAttribute('aria-label', 'Line ' + (i + 1) + ' — activate to flag as the mistake');
    if (st.ans.indexOf(i) >= 0) d.classList.add('pick');
    if (st.vis !== 'checked') {
      d.addEventListener('click', function () {
        var p = st.ans.indexOf(i);
        if (p >= 0) { st.ans.splice(p, 1); d.classList.remove('pick'); }
        else { st.ans.push(i); d.classList.add('pick'); }
      });
      d.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.click(); } });
    } else { d.style.cursor = 'default'; }
    linesEl.appendChild(d);
  });
  area.appendChild(box);
}

EX.push(
{ t: 'slots', th: 0, title: 'Sort the accounts on the file server', kw: ['shared or generic account', 'service account', 'guest account', 'privileged account', 'user identity'],
  sc: '<p>You are auditing <code>fs01.corp.northwind.internal</code> before its move into the new domain. The sysadmin hands you a sticky note listing every login that touched the server last month:</p><p><code>bkup-agent</code> (runs the nightly backup, no person ever logs in) · <code>reception-pc</code> login used by four front-desk staff on one desk · <code>tempvendor</code> (created for a two-day partner visit) · <code>da-root</code> (member of Domain Admins) · <code>a.price</code> (normal finance employee) · <code>scanmgr</code> (runs the scanner ingest job).</p>',
  q: '<p>Drag each login onto the account type it actually is.</p>',
  sl: [ { n: 'User account (person)' }, { n: 'Shared / generic account' }, { n: 'Service account' }, { n: 'Guest account' }, { n: 'Privileged account' } ],
  it: [ { h: 'a.price — finance employee', s: 0 }, { h: 'reception-pc desk login used by 4 staff', s: 1 }, { h: 'bkup-agent nightly backup job', s: 2 }, { h: 'scanmgr scanner ingest job', s: 2 }, { h: 'tempvendor 2-day partner visit', s: 3 }, { h: 'da-root Domain Admins member', s: 4 } ],
  ex: '<p>A <b>user account</b> maps to one person. A <b>shared or generic account</b> is one login several people use — it destroys accountability, so it should be phased out. A <b>service account</b> runs a program or job, never a person; it needs a long random password and no interactive login. A <b>guest account</b> gives outside or temporary visitors limited access and should normally stay disabled. A <b>privileged account</b> can change the system itself (admins). Every extra privileged account is extra attack surface.</p><p><b>Focus next:</b> for each account you meet, ask “which human or which program is behind it, and how much damage if it leaks?”</p>',
  hints: ['Ask first: is this login a person, a program, or several people at once?', 'The Domain Admins member is the privileged one; the two jobs that never involve a person are service accounts.'] },
{ t: 'mc', th: 2, title: 'SSO for the new cloud HR suite', kw: ['SSO', 'SAML 2.0', 'identity provider (IdP)', 'federation / trust'],
  sc: '<p>Northwind bought a cloud HR suite used by all 4,000 staff. The CIO wants one login: staff authenticate once against the company identity provider in Active Directory, and the cloud suite accepts that login without seeing any password. You must pick the sign-in protocol between the company IdP and the cloud app.</p>',
  q: '<p>Which protocol fits this requirement best?</p>',
  o: [ { h: 'SAML 2.0 federation between the IdP and the suite' , ok: true }, { h: 'LDAP queries from the suite to the domain controller' }, { h: 'TACACS+ authentication against the domain controller' }, { h: 'Kerberos tickets issued by the cloud suite' } ],
  ex: '<p><b>SAML 2.0</b> is the standard federation protocol for web single sign-on between an identity provider (IdP) and a service provider (SP): the IdP signs an assertion, the cloud app trusts it, and the user gets SSO without the app ever seeing the password. <b>LDAP</b> is for reading the directory, not for browser SSO. <b>TACACS+</b> is for network device administration. <b>Kerberos</b> needs a shared key infrastructure and is meant for the internal domain, not a cloud suite.</p><p><b>Focus next:</b> map each protocol to its job — LDAP = directory lookups, Kerberos = internal domain tickets, SAML/OIDC = web SSO, TACACS+/RADIUS = network gear.</p>',
  hints: ['The suite is a cloud web app, so directory protocols designed for LAN queries are out.', 'The keyword is “the app never sees the password” — that is exactly what signed assertions were designed for.'] },
{ t: 'fill', th: 2, title: 'Complete the SAML sign-in sentence', kw: ['SAML assertion', 'identity provider (IdP)', 'service provider (SP)', 'federation / trust', 'SSO'],
  sc: '<p>A new helpdesk agent asks you how staff end up logged into the expense tool without ever typing the expense tool password. You sketch the SAML flow for them, but you left the five key words out.</p>',
  q: '<p>Fill every blank from the word bank.</p>',
  ftext: '<p>The user first signs in to the {{0}}, which signs a {{1}} and posts it to the {{2}}. The SP accepts it because the two organisations share a pre-built {{3}}. From that moment the user has {{4}} across both applications without a second login.</p>',
  fblanks: [ ['identity provider'], ['SAML assertion'], ['service provider'], ['federation trust'], ['SSO'] ],
  fbank: ['OAuth token', 'RADIUS packet', 'bind DN'],
  ex: '<p>In SAML the <b>identity provider (IdP)</b> authenticates the user and signs a <b>SAML assertion</b>. The <b>service provider (SP)</b> — here the expense tool — validates the signature and accepts the user because of the pre-built <b>federation trust</b>. The result is <b>SSO</b>: one authentication works for many apps. Distractor words: an OAuth token is for delegated authorisation, a RADIUS packet is network access, and a bind DN is an LDAP directory login — none of them carry a signed web login.</p><p><b>Focus next:</b> be able to name the two sides of the trust (IdP signs, SP verifies) and the object that travels between them (the signed assertion).</p>',
  hints: ['Who signs the assertion: the party that holds the directory and the password? Or the party that hosts the app?', 'Two blanks are the two organisations, two blanks are objects, one blank is the user experience.'] },
{ t: 'order', th: 1, title: 'Build the onboarding runbook', kw: ['provisioning', 'onboarding', 'identity proofing', 'RBAC'],
  sc: '<p>HR asked you to write the standard joiner runbook so every new hire gets identical, minimal access. The steps below arrived from four different people and are in a random order.</p>',
  q: '<p>Drag the steps into the correct operational order.</p>',
  oseq: [ { h: 'HR raises the joiner ticket with start date and role' }, { h: 'Verify the new hire with identity proofing (ID documents checked)' }, { h: 'Create the account in the directory' }, { h: 'Add the account to role-based groups (RBAC baseline for the job)' }, { h: 'Enrol the chosen MFA factor with the user' }, { h: 'Manager requests role-specific exceptions with approval' }, { h: 'Access verified in a 30-day review' } ],
  ex: '<p>Provisioning follows a strict order: the <b>HR trigger</b> starts everything; <b>identity proofing</b> must happen <i>before</i> any account exists, otherwise you build access on an unverified person; then the account is created; then the <b>RBAC baseline</b> gives the standard access for the role; then <b>MFA enrolment</b> protects that account; exceptions come after the baseline, each with approval; and a 30-day review catches anything wrongly granted. Doing exceptions before the baseline causes privilege creep from day one.</p><p><b>Focus next:</b> remember the pairing “verify the human first, then create, then grant the least”.</p>',
  hints: ['Nothing can be created before you know the person is real.', 'Groups first, exceptions second — and something must check the result a month later.'] },
{ t: 'log', th: 3, title: 'Fourteen pushes in three minutes', kw: ['MFA fatigue (push bombing)', 'push notification', 'number matching', 'SIM swap'],
  sc: '<p>You are on the SOC shift at Northwind. The IdP admin forwards you an extract of the authentication log for user <code>mkelly</code>. Password checks all succeeded (the password is correct), but something odd follows.</p>',
  q: '<p>Select the <b>two</b> statements that are true.</p>',

    '<span class="ts">02:11:09</span> <span class="host">idp01</span> MFA push sent to device <span class="host">mkelly-phone</span> (push notification)',

  inner: { kind: 'multi', o: [ { h: 'This pattern is MFA fatigue (push bombing): noise until the user approves by mistake', ok: true }, { h: 'Enabling number matching and rate-limiting pushes would blunt this attack', ok: true }, { h: 'This is a SIM swap: the log proves the phone number was ported' }, { h: 'The password failed, so the attacker never had valid credentials' }, { h: 'The TOTP app on the phone is broken and must be reinstalled' } ] },
  ex: '<p>The attacker already had the correct password and spammed <b>push notification</b> prompts until the tired user approved one — classic <b>MFA fatigue (push bombing)</b>. <b>Number matching</b> (the user must type a number shown on screen into the app) plus rate limits breaks this, because random approvals stop working. It is not a <b>SIM swap</b> — nothing here shows the phone number moved, and pushes go to an app, not the SIM. The password clearly succeeded. TOTP is not involved at all; this is about push prompts.</p><p><b>Focus next:</b> see a burst of pushes after valid passwords → think fatigue; also know SMS codes are weak (interceptable, SIM-swap-prone) and push alone is noisy.</p>',
  hints: ['The password line says pass=valid — so what was the attacker actually attacking?', 'The user first denied, then approved after repeated prompts. What social effect causes that?'] },
{ t: 'multi', th: 3, title: 'Which of these is “something you have”?', kw: ['something you have', 'TOTP', 'smart card', 'hardware token', 'biometrics', 'PIV', 'CAC'],

  ex: '<p>“Something you <b>have</b>” means a physical or digital object you carry: a <b>TOTP</b> generating device or app, a <b>smart card</b> (PIV for civilian staff, CAC in the military), a <b>hardware token</b>. A fingerprint is “something you <b>are</b>” (biometrics), a password and a personal fact are “something you <b>know</b>”. Note that a maiden name is a weak secret — it is knowable, public for many people, and never changes.</p><p><b>Focus next:</b> classify in seconds: know = secrets in your head, have = objects in your pocket, are = your body.</p>',
