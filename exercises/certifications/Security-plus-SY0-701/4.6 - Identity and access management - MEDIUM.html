  q: '<p>Drag each item into the factor bucket it belongs to.</p>',
  sl: [ { n: 'Something you know' }, { n: 'Something you have' }, { n: 'Something you are' }, { n: 'Somewhere you are (context)' } ],
  it: [ { h: 'Password or PIN', s: 0 }, { h: 'Security questions about your past', s: 0 }, { h: 'HOTP counter-based token', s: 1 }, { h: 'TOTP app code', s: 1 }, { h: 'Push approval on a registered phone', s: 1 }, { h: 'PIV smart card', s: 1 }, { h: 'Iris scan', s: 2 }, { h: 'Voice print check', s: 2 }, { h: 'Login only allowed from the office network range', s: 3 } ],
  ex: '<p><b>Know</b> = secrets you memorise (password, PIN, answers to security questions — which are weak because they leak). <b>Have</b> = objects or apps you possess: the <b>HOTP</b> counter token, the <b>TOTP</b> app, a <b>push notification</b> on a registered phone, a <b>smart card</b>. <b>Are</b> = biometrics tied to your body: iris, voice, face, fingerprint. <b>Somewhere you are</b> is a context factor — location or network — used to allow or step up authentication, not a secret. True <b>MFA</b> needs factors from <i>different</i> buckets.</p><p><b>Focus next:</b> two passwords are still one factor; password + smart card is real MFA.</p>',
  hints: ['Context items describe where the login happens, not what the user carries.', 'Counter-based HOTP and time-based TOTP are both physical/digital possessions.'] },
{ t: 'match', th: 2, title: 'Match each protocol to its real job', kw: ['SAML 2.0', 'OAuth 2.0', 'OpenID Connect (OIDC)', 'LDAP', 'bind DN', 'RADIUS', 'TACACS+'],
  sc: '<p>A junior admin keeps mixing up the identity protocols. You print this matching exercise for the team wall.</p>',
  q: '<p>Drag each protocol onto the job it actually does.</p>',
  lf: [ { h: 'Signs web SSO assertions between organisations' }, { h: 'Delegates access to a user’s resources without sharing the password' }, { h: 'Identity layer on top of OAuth that returns who the user is' }, { h: 'Directory lookups and binds (a bind DN plus password)' }, { h: 'Network access AAA — “can this laptop join the Wi-Fi?”' }, { h: 'Per-command authorisation for network device admins' } ],
  rt: [ { h: 'SAML 2.0', m: 0 }, { h: 'OAuth 2.0', m: 1 }, { h: 'OpenID Connect (OIDC)', m: 2 }, { h: 'LDAP (bind DN)', m: 3 }, { h: 'RADIUS', m: 4 }, { h: 'TACACS+', m: 5 } ],
  ex: '<p><b>SAML 2.0</b> carries signed federation assertions for web SSO. <b>OAuth 2.0</b> is pure authorisation: an app gets an access token to act on a user’s resources. <b>OIDC</b> layers identity on OAuth and returns an ID token saying who the user is. <b>LDAP</b> is the directory protocol — clients authenticate with a bind DN and password, then read or search. <b>RADIUS</b> is the classic AAA protocol for network access (Wi-Fi, VPN, 802.1X). <b>TACACS+</b> separates authentication, authorisation and accounting and can authorise <i>per command</i>, which device admins love.</p><p><b>Focus next:</b> if the question says “assertions”, think SAML; “access token”, think OAuth; “who is the user”, think OIDC; “directory”, LDAP; “Wi-Fi/VPN AAA”, RADIUS; “per-command on switches”, TACACS+.</p>',
  hints: ['Two of these protocols are for network gear, four are directory/web protocols.', 'The one that can authorise a single command is the + one.'] },
{ t: 'mc', th: 2, title: 'Read-only access to the sales drive', kw: ['OAuth 2.0', 'access token', 'refresh token', 'SSO'],
  sc: '<p>The marketing team wants their reporting app to read files from the company cloud drive — only read, only for signed-in users, and nobody may hand the app a password. The drive team asks you which standard to implement.</p>',
  q: '<p>What do you recommend?</p>',
  o: [ { h: 'OAuth 2.0 delegated authorisation with scoped access tokens', ok: true }, { h: 'SAML 2.0 assertions posted by the app' }, { h: 'Share one service account password with the app' }, { h: 'Give every marketer a second account used only by the app' } ],
  ex: '<p>This is delegated authorisation: <b>OAuth 2.0</b>. The user consents, the app receives a scoped <b>access token</b> (read-only) and never sees the password; a <b>refresh token</b> renews it. SAML asserts <i>who the user is</i> to apps but does not delegate resource access. Sharing a password with an app breaks auditability and MFA, and shadow second accounts create unmanaged identity sprawl — both are anti-patterns.</p><p><b>Focus next:</b> OAuth answers “what may this app do on my behalf”; SAML/OIDC answer “who is this user”.</p>',
  hints: ['The app must act on the user’s behalf without ever learning the password.', 'You need scopes and tokens, not assertions or shared secrets.'] },
{ t: 'branch', th: 1, title: 'Leaver on the finance team — live', kw: ['offboarding', 'deprovisioning', 'disable vs delete'],
  sc: '<p>HR pings you: <code>d.lamb</code> from finance resigned, today is the last day, and she still has access to the payment approval system. Answer the four decisions of the offboarding flow.</p>',
  q: '<p>Choose the best action for each decision point.</p>',
  steps: [
    { h: '<p><b>14:02 —</b> The leaver ticket is open. What do you do with the account itself, right now?</p>', o: [ { h: 'Disable the account immediately; keep the mailbox and data for the retention policy', ok: true }, { h: 'Delete the account immediately to close every door' }, { h: 'Leave it active until the exit interview is scheduled' } ] },
    { h: '<p><b>14:05 —</b> The account is disabled. d.lamb may still hold live sessions and tokens. Next move?</p>', o: [ { h: 'Revoke sessions and refresh tokens, and reset the password to break any silent re-entry', ok: true }, { h: 'Ask her politely to log out of everything on her way out' }, { h: 'Nothing — a disabled account stops every token automatically' } ] },
    { h: '<p><b>14:20 —</b> Assets and data. What is the correct handling?</p>', o: [ { h: 'Transfer ownership of her files and mailbox to the manager, then collect laptop and badge', ok: true }, { h: 'Wipe the mailbox now — leavers must not keep data' }, { h: 'Leave the shared-drive ownership pointing at her account' } ] },
    { h: '<p><b>14:45 —</b> Closing the ticket. What belongs in the close-out?</p>', o: [ { h: 'Remove licences and group memberships, and schedule a 30-day check that nothing of hers still works', ok: true }, { h: 'Delete the account in 24 hours so the directory stays tidy' }, { h: 'Move the account into a “former staff” group with its old rights' } ] }
  ],
  ex: '<p>Offboarding = <b>deprovisioning</b>. You <b>disable</b>, never instantly delete: deletion destroys data and audit trails the retention policy needs. Disabled accounts do not reliably kill already-issued sessions and refresh tokens — you must revoke them and rotate the password. Data and assets transfer to a named owner, then licences and groups go, and a 30-day verification confirms no orphaned access remains. “Former staff” groups with old rights are how <b>orphaned accounts</b> are born.</p><p><b>Focus next:</b> the disable-vs-delete decision and “disable ≠ tokens die” are classic exam traps.</p>',
  hints: ['Deleting removes evidence and data the company still owns.', 'A disabled directory account does not reach out and kill tokens already in the wild.'] },
{ t: 'spot', th: 1, title: 'Find the weak lines in the password policy', kw: ['password complexity', 'password expiration', 'password history / reuse', 'account recovery / reset'],
  sc: '<p>This is the current password policy block from the directory config of <code>corp.northwind.internal</code>. An internal audit flagged two lines as actively harmful. The rest is reasonable.</p>',
  q: '<p>Click the two lines the audit is talking about.</p>',
  lines: [
    '<span class="ts">[password-policy]</span>',
    'min_length        = 12',
    'complexity        = on   (3 of 4 character classes)',
    'history           = 5    (last 5 passwords blocked)',
    'max_age_days      = 0    (passwords never expire)',
    'lockout_threshold = 5',
    'lockout_duration  = 15m',
    'self_reset        = enabled',
    'reset_verification = caller-id phone number only',
    '<span class="ts">[end]</span>'
  ],
  wrong: [4, 8],
  ex: '<p><code>max_age_days = 0</code> means <b>passwords never expire</b> — with no expiry and no MFA, a leaked password works forever, so the audit wants a finite <b>password expiration</b>. <code>reset_verification = caller-id only</code> makes <b>account recovery</b> trivially spoofable: caller ID is trivially faked, and it is not real identity proofing; use verified callbacks, MFA, or manager approval. The other lines (length 12, complexity, history of 5 to block <b>password reuse</b>, a 5-try lockout with a 15-minute duration) are sane defaults.</p><p><b>Focus next:</b> never-expiring passwords and weak reset verification are the two policy lines auditors circle first.</p>',
  hints: ['One line makes a stolen password valid forever.', 'One line lets an attacker who knows (or fakes) a phone number take over the account.'] },
{ t: 'order', th: 2, title: 'Kerberos from password to file share', kw: ['Kerberos', 'KDC', 'TGT', 'TGS / service ticket'],
  sc: '<p>A new analyst asks what actually happens, in order, when she opens a file share in the Windows domain after logging on.</p>',
  q: '<p>Put the Kerberos steps in the correct order.</p>',
  oseq: [ { h: 'User authenticates to the KDC authentication service' }, { h: 'KDC returns a TGT (ticket-granting ticket), cached on the client' }, { h: 'Client presents the TGT and asks the ticket-granting service for the file server' }, { h: 'KDC issues a service ticket (TGS) for that SPN' }, { h: 'Client presents the service ticket to the file server' }, { h: 'File server validates the ticket and opens the session' } ],
  ex: '<p>Kerberos never sends your password to the file server. The user first authenticates to the <b>KDC</b> (key distribution centre); the KDC answers with a <b>TGT</b>, which the client caches and which proves “the KDC knows who I am”. For each new service the client shows the TGT to the ticket-granting service and receives a <b>service ticket (TGS)</b> for that SPN; the service itself validates the ticket and grants access. Time sync matters: tickets are time-stamped, so big clock skew breaks everything.</p><p><b>Focus next:</b> remember the two-ticket flow — one long-lived TGT, many short-lived service tickets.</p>',
  hints: ['The first ticket is a general “I am me” ticket, not tied to any one server.', 'The file server only ever sees the second ticket.'] },
{ t: 'mc', th: 2, title: 'What is the TGT actually for?', kw: ['TGT', 'KDC', 'Kerberos'],
  sc: '<p>During a Windows hardening review, a server owner asks why his service never sees user passwords and what the mysterious blob in the user’s cache is. You explain the TGT.</p>',
  q: '<p>Which statement about the TGT is correct?</p>',
  o: [ { h: 'It lets the client request service tickets from the KDC without re-entering the password', ok: true }, { h: 'It is the ticket the file server keeps to prove the user was there' }, { h: 'It stores the user’s password hash for the session' }, { h: 'It replaces the need for MFA on privileged accounts' } ],
  ex: '<p>The <b>TGT</b> is a cached proof-of-authentication from the <b>KDC</b>. The client uses it to ask for <b>service tickets</b> for each new SPN, so the user does not retype the password — and no service ever touches the password. It is issued by the KDC, not kept by file servers; it contains no password hash; and it has nothing to do with MFA, which happens at the initial authentication.</p><p><b>Focus next:</b> TGT = “ask the KDC for anything”, service ticket = “show this one service”.</p>',
  hints: ['Think of the TGT as a membership card for the ticket office, not for the individual shops.', 'Who issued the blob, and who accepts it?'] },
{ t: 'slots', th: 1, title: 'Which access control model is described?', kw: ['RBAC', 'ABAC', 'DAC', 'MAC', 'rule-based access control', 'ACL'],
  sc: '<p>You are preparing the access-control section of the security architecture briefing. Each sentence below describes one deployment the company runs.</p>',
  q: '<p>Drag each sentence onto the model it describes.</p>',
  sl: [ { n: 'RBAC' }, { n: 'ABAC' }, { n: 'DAC' }, { n: 'MAC' }, { n: 'Rule-based access control' } ],
  it: [ { h: 'Permissions attach to job roles like “Payroll Clerk”', s: 0 }, { h: 'Access needs department = Finance AND device.compliant = true', s: 1 }, { h: 'Each file owner decides who may open their own document', s: 2 }, { h: 'The OS enforces security labels; even owners cannot override', s: 3 }, { h: 'One global ACL filters every subject identically', s: 4 } ],
  ex: '<p><b>RBAC</b> binds permissions to roles, so access follows the job. <b>ABAC</b> evaluates attributes of user, resource, action and environment — “Finance AND compliant device” is textbook ABAC. <b>DAC</b> leaves the decision to the resource owner (discretionary). <b>MAC</b> is label-based and enforced by the system; even the owner cannot grant downward. A single global <b>ACL</b> applied to all subjects identically is <b>rule-based access control</b> — the same rule for everyone, like a firewall policy.</p><p><b>Focus next:</b> spot the “who decides” question — the job (RBAC), attributes (ABAC), the owner (DAC), the system labels (MAC), one global rule (rule-based).</p>',
  hints: ['“Owner decides” is the discretionary one; “cannot be overridden” is the mandatory one.', 'Attributes include device health and department — two conditions joined with AND.'] },
{ t: 'multi', th: 1, title: 'Recognise privilege creep', kw: ['privilege creep', 'privilege escalation', 'access recertification', 'least privilege'],
  sc: '<p>During the quarterly <b>access recertification</b>, the IAM tool surfaces five statements about <code>r.okonkwo</code>, a support engineer. The reviewer must mark which statements describe privilege creep.</p>',
  q: '<p>Select the <b>three</b> statements that describe privilege creep.</p>',
  o: [ { h: 'She still belongs to every project group from the four teams she joined and left', ok: true }, { h: 'She holds rights far beyond what her current role needs', ok: true }, { h: 'Rights accumulated because movers were never cleaned up after team changes', ok: true }, { h: 'It is caused by granting too few permissions at onboarding' }, { h: 'The fix is to make her a full admin so the groups stop mattering' }, { h: 'It is a defect in the NIC driver of her laptop' } ],
  ex: '<p><b>Privilege creep</b> is the slow accumulation of rights beyond the current role — typically because <b>joiner-mover-leaver</b> events add groups but movers and leavers are never cleaned up. The cure is <b>least privilege</b>: recertification removes unneeded rights (or JIT replaces standing ones). It is not caused by too few permissions; adding blanket admin rights is escalation risk, not a fix; and it has nothing to do with hardware. Related terms: <b>vertical privilege escalation</b> = user → admin, <b>horizontal</b> = user → another user’s context.</p><p><b>Focus next:</b> creep = too many rights accumulating slowly; escalate = jumping to rights you should never have.</p>',
  hints: ['Creep grows over time as people change roles — look for the statements about accumulation.', '“Make them admin” is escalation, the opposite of a fix.'] },
{ t: 'log', th: 2, title: 'The laptop that cannot join the Wi-Fi', kw: ['802.1X', 'RADIUS', 'device identity'],
  sc: '<p>The helpdesk escalates: one finance laptop fails on the corporate Wi-Fi every morning while others connect fine. You pull the RADIUS log of <code>vpn-gw01</code> (the 802.1X authentication point). Use the filter box to find the failing device.</p>',
  q: '<p>Type the hostname of the device that fails certificate authentication.</p>',
  lines: [
    '<span class="ts">08:01:11</span> <span class="host">ws-fin-101</span> EAP-TLS machine cert OK → Access-Accept via 10[.]30[.]1[.]5',
    '<span class="ts">08:01:24</span> <span class="host">ws-fin-102</span> EAP-TLS machine cert OK → Access-Accept via 10[.]30[.]1[.]5',
    '<span class="ts">08:02:02</span> <span class="host">ws-fin-114</span> EAP-TLS machine cert EXPIRED → Access-Reject (device identity not verified)',
    '<span class="ts">08:02:19</span> <span class="host">lt-sls-020</span> EAP-TLS machine cert OK → Access-Accept via 10[.]30[.]1[.]5',
    '<span class="ts">08:03:41</span> <span class="host">ws-fin-114</span> EAP-TLS retry → Access-Reject',
    '<span class="ts">08:05:12</span> <span class="host">ws-fin-103</span> user auth ok (PEAP-MSCHAPv2) → Access-Accept'
  ],
  inner: { kind: 'fill', fblanks: [ [ 'ws-fin-114', 'wsfin114', 'ws-fin-114.corp.northwind.internal' ] ], ph: 'hostname' },
  ex: '<p>The network runs <b>802.1X</b>: the laptop (supplicant) authenticates through the access point to the <b>RADIUS</b> server. <code>ws-fin-114</code> presents an <b>expired machine certificate</b>, so its <b>device identity</b> cannot be verified and RADIUS answers Access-Reject — twice. Machine certificates are the device equivalent of a user identity, and they expire like any certificate; re-enrolment fixes it. The other laptops pass EAP-TLS cleanly.</p><p><b>Focus next:</b> on 802.1X networks, “device can’t connect + others can” → check the machine cert and the RADIUS reject reason.</p>',
  hints: ['Filter the log for “Reject” — the failing name appears twice.', 'The reason next to the reject says exactly what expired.'] },
{ t: 'rank', th: 0, title: 'Rank the morning’s identity alerts', kw: ['break-glass account', 'service account', 'guest account', 'account lockout', 'offboarding', 'privileged password rotation'],
  sc: '<p>Monday 08:30. Five identity alerts sit in the queue and you can only work them top-down. Rank them by risk — which needs a human first?</p>',
  q: '<p>Drag the alerts so the most severe is position 1.</p>',
  oseq: [ { h: 'Offboarded contractor account is still authenticating to the finance share this morning' }, { h: 'break-glass admin account used — no change ticket open, outside change window' }, { h: 'Service account (4-year-old password) started interactive RDP sessions — it never does that' }, { h: 'Guest account found enabled on the filings server' }, { h: 'One user hit the account lockout threshold after 5 typos (probable user error)' } ],
  ex: '<p>An <b>offboarded</b> account still active is a live intrusion path — deprovisioning failed and someone is using it, so it is first. An unexplained <b>break-glass</b> use means someone may have bypassed the PAM workflow — second, because it hints at privilege misuse. A <b>service account</b> logging in interactively with an ancient unrotated password is a serious hardening failure (rotation plus no-interactive policy would stop it). An enabled <b>guest account</b> is a finding to fix today but limited exposure. A single <b>lockout</b> after typos is user error — lowest.</p><p><b>Focus next:</b> rank by “is access actively being used that should not exist”.</p>',
  hints: ['Two alerts show access happening right now that should be impossible.', 'A user who mistypes five times is annoyed, not breached.'] },
{ t: 'fill', th: 4, title: 'Describe the new PAM workflow', kw: ['PAM suite', 'credential vault', 'jump box / jump server', 'just-in-time (JIT) access', 'session recording / broker', 'privileged password rotation', 'elevation control (sudo / UAC)', 'PIM'],
  sc: '<p>Management approved a <b>PAM suite</b>. You must present the workflow in one paragraph to the server team — but the projector ate your key words again.</p>',
  q: '<p>Fill every blank from the word bank.</p>',
  ftext: '<p>All admin passwords now live in a {{0}} that enforces privileged password rotation after every checkout. Engineers reach the Linux fleet only through a {{1}}, where they request elevation on demand — sudo rights are granted {{2}} with an approval and expire by themselves. Every privileged session runs through the broker with {{3}}, so reviews can replay exactly what happened. Many suites call the on-demand rights feature {{4}}.</p>',
  fblanks: [ ['credential vault'], ['jump box'], ['just-in-time (JIT)'], ['session recording'], ['PIM'] ],
  fbank: ['standing administration', 'SMS gateway', 'guest access'],
  ex: '<p>A <b>credential vault</b> stores privileged secrets and rotates them after each use, so a leaked password dies quickly. The <b>jump box</b> is the only path to admin planes — a hardened bastion. <b>Just-in-time (JIT)</b> elevation replaces standing admin rights: rights are granted on demand, with approval, and expire automatically (vendors call it <b>PIM</b>). <b>Session recording</b> via the broker gives a replayable audit trail — proving who did what, not just who logged in.</p><p><b>Focus next:</b> the four pillars to recite: vault the secret, broker the path, JIT the rights, record the session.</p>',
  hints: ['Where do the passwords sleep, and who rotates them?', '“Granted on demand and expires by itself” is the definition of one specific acronym-style answer.'] },
{ t: 'mc', th: 4, title: 'Why keep the jump box?', kw: ['jump box / jump server', 'bastion host', 'PAM suite'],
  sc: '<p>A cost-cutting manager asks why the team cannot reach production servers directly over the VPN like before, “since the jump box costs a licence and adds a hop”.</p>',
  q: '<p>What is the strongest justification for keeping it?</p>',
  o: [ { h: 'It is the one hardened, monitored path for privileged sessions', ok: true }, { h: 'It keeps every admin password of the fleet in one store' }, { h: 'It spreads ordinary user traffic across the servers' }, { h: 'It exempts admin accounts from the MFA requirement' } ],
  ex: '<p>A <b>jump box</b> (a hardened <b>bastion host</b>) funnels all privileged access through one monitored door: policy checks, MFA, approval, and session recording all happen in one place, and the servers themselves can refuse all other sources. It does not store passwords (that is the vault), it is not a load balancer, and it never removes MFA — if anything, MFA is enforced exactly there.</p><p><b>Focus next:</b> jump box = choke point + monitoring; vault = secret storage; broker = session workflow.</p>',
  hints: ['The question is about controlling and observing the path, not about storing secrets.', 'One door with a camera beats ten unlocked doors.'] },
{ t: 'slots', th: 4, title: 'Map PAM controls to their goal', kw: ['just-in-time (JIT) access', 'ephemeral credentials', 'credential vault', 'session recording / broker', 'break-glass account', 'separation of duties'],
  sc: '<p>The CISO asks for a one-screen map showing which PAM control delivers which security goal. Six controls, three goals.</p>',
  q: '<p>Drag each control onto the goal it primarily delivers.</p>',
  sl: [ { n: 'Remove standing privilege' }, { n: 'Protect the credential itself' }, { n: 'Prove who did what' } ],
  it: [ { h: 'Just-in-time elevation with expiry', s: 0 }, { h: 'Ephemeral credentials that die after the task', s: 0 }, { h: 'Credential vault with automatic rotation', s: 1 }, { h: 'One-time checkout of admin passwords', s: 1 }, { h: 'Session recording on the broker', s: 2 }, { h: 'Request and approve by different people (separation of duties)', s: 2 } ],
  ex: '<p><b>Standing privilege</b> disappears when rights are <b>just-in-time</b> or credentials are <b>ephemeral</b> — there is simply nothing to steal between tasks. The credential itself is protected by the <b>vault</b> and rotation/one-time checkouts — a stolen password is already invalid. Proof of actions comes from <b>session recording</b> and from workflow controls like <b>separation of duties</b> (requester ≠ approver), which also stops self-approval abuse. A break-glass account, by contrast, is a controlled emergency exception — logged, alarmed, and reviewed.</p><p><b>Focus next:</b> group PAM features by the risk they kill: persistence, theft, or doubt.</p>',
  hints: ['“Standing” means existing all the time — which controls make privilege temporary?', 'Replay videos and maker-checker workflows are both about evidence.'] },
{ t: 'match', th: 3, title: 'Tune the biometric door readers', kw: ['FAR', 'FRR', 'CER', 'biometrics'],
  sc: '<p>The new data-centre doors use fingerprint readers. Security complains about impostors; staff complain about being locked out. You must match the terms the vendor keeps using.</p>',
  q: '<p>Drag each term onto its correct meaning.</p>',
  lf: [ { h: 'The system accepts someone it should reject' }, { h: 'The system rejects the legitimate enrolled user' }, { h: 'The sensitivity point where the two error rates are equal' }, { h: 'Making the reader stricter moves you here' }, { h: 'Re-enrolling users with better-quality scans attacks this problem' } ],
  rt: [ { h: 'FAR — false acceptance rate', m: 0 }, { h: 'FRR — false rejection rate', m: 1 }, { h: 'CER — crossover error rate', m: 2 }, { h: 'FAR goes up (more false accepts)', m: 3 }, { h: 'High FRR', m: 4 } ],
  ex: '<p><b>FAR</b> = false accepts (impostors get in — a security failure). <b>FRR</b> = false rejects (real staff locked out — an availability and morale failure). The <b>CER (crossover error rate)</b> is where FAR and FRR meet; a lower CER means a more accurate reader. The two rates pull against each other: stricter threshold → fewer false accepts but more false rejects. Bad templates cause rejections, so re-enrolment with clean scans reduces <b>FRR</b>. Biometric systems complement MFA factors — they are the “something you are”.</p><p><b>Focus next:</b> security people fear FAR; users suffer FRR; buyers compare CER.</p>',
  hints: ['Which error favours the attacker, and which annoys the user?', 'Stricter = fewer impostors in = but more real people locked out.'] },
{ t: 'multi', th: 3, title: 'Which MFA survives a fake login page?', kw: ['phishing-resistant MFA', 'FIDO2 / WebAuthn', 'passkey', 'PIV', 'SMS weakness'],
  sc: '<p>After a phishing campaign that harvested OTP codes through a proxy site, the security team lists six MFA methods and asks which are considered phishing-resistant.</p>',
  q: '<p>Select the <b>three</b> phishing-resistant methods.</p>',
  o: [ { h: 'FIDO2 / WebAuthn security key bound to the real site origin', ok: true }, { h: 'A synced passkey on the company phone', ok: true }, { h: 'PIV smart card with client certificate', ok: true }, { h: 'A 6-digit SMS code' }, { h: 'A TOTP code typed into any page that asks' }, { h: 'A one-time code read out over a phone call' } ],
  ex: '<p><b>FIDO2/WebAuthn</b> keys and <b>passkeys</b> cryptographically bind the signature to the genuine site origin, so a cloned page cannot use them — a proxy can relay a code, but not an origin-bound signature. A <b>PIV smart card</b> performs a similar certificate handshake. SMS codes, typed TOTP codes and voice codes can all be relayed in real time by an attacker-in-the-middle page or tricked out of a user, so they authenticate the user but do not resist phishing.</p><p><b>Focus next:</b> “phishing-resistant” = the method checks <i>where</i> it is authenticating, not just <i>who</i>.</p>',
  hints: ['Ask: does the method verify the website’s identity cryptographically before answering?', 'Codes that a user can be tricked into typing anywhere are relayable.'] },
{ t: 'terminal', th: 1, title: 'Set the password aging for cveira', kw: ['password expiration', 'provisioning'],
  sc: '<p>During provisioning QA you find that user <code>cveira</code> was created without aging rules. Company policy: passwords must expire after <b>90 days</b>, and new or reset passwords must be changed by the user at next login. You are on the Linux host as admin.</p>',
  q: '<p>Type a <code>chage</code> command that applies both rules to <code>cveira</code>.</p>',
  tname: 'root@srv-app01', tout: 'Apply password aging for user cveira\nRules: max age 90 days, force change at next login',
  tps: [ { label: 'chage command', ph: 'chage …', acc: [ '^(sudo\\s+)?chage\\b(?=.*-m\\s*90)(?=.*-d\\s*0)(?=.*cveira)' ], show: 'chage -M 90 -d 0 cveira' } ],
  ex: '<p><code>chage -M 90 -d 0 cveira</code> sets maximum age (<code>-M 90</code>) so the password hits <b>password expiration</b> after 90 days, and last-change day 0 (<code>-d 0</code>) forces a change at next login — standard for new provisioned or reset accounts. Without <code>-d 0</code> a default password could survive indefinitely. Adding <code>-m</code> (min age) would further block immediate re-use churn.</p><p><b>Focus next:</b> know at least one command per policy knob — aging (chage), lockout (usermod -L / passwd -l), expiry dates (-E).</p>',
  hints: ['Use chage: -M sets the maximum days, and -d 0 sets the last-change date to day zero — the password counts as ancient, so a change is forced at next login.', 'End the command with the username it applies to.'] },
{ t: 'order', th: 1, title: 'Run the quarterly access review', kw: ['access recertification', 'deny by default, allow by exception', 'privilege creep'],
  sc: '<p>The IAM tool exported 4,000 entitlements. Your director wants the quarterly recertification run exactly by the book — and reminders you that non-responding owners count as “no”.</p>',
  q: '<p>Put the review steps in the correct order.</p>',
  oseq: [ { h: 'Export the current entitlements per application and owner' }, { h: 'Send each owner their list for approval or revocation' }, { h: 'Treat unanswered reviews as revoked — deny by default, allow by exception' }, { h: 'Revoke the rights that were not approved' }, { h: 'Log decisions and remediate the privilege creep found' }, { h: 'Schedule the next cycle and report exceptions to management' } ],
  ex: '<p>Access <b>recertification</b> works because “no answer = no approval”: <b>deny by default, allow by exception</b>. Owners get <i>their own</i> list (they know their team), unapproved rights are actively revoked (a report alone fixes nothing), the decisions are logged, and detected <b>privilege creep</b> is remediated — usually by removing whole stale groups. Closing the loop with the next cycle turns it from a one-off cleanup into a control.</p><p><b>Focus next:</b> the two exam keywords: recertification cadence, and deny-by-default handling of non-responses.</p>',
  hints: ['You cannot review what you have not exported, and owners cannot answer what they never received.', 'Silence is not consent — decide what silence means before revoking.'] },
{ t: 'fill', th: 1, title: 'The five access models, in one paragraph', kw: ['RBAC', 'ABAC', 'DAC', 'MAC', 'rule-based access control', 'ACL'],
  sc: '<p>Your architecture wiki page comparing the access control models lost its key terms in a migration. Rebuild it.</p>',
  q: '<p>Fill every blank from the word bank.</p>',
  ftext: '<p>In {{0}}, permissions attach to job roles, so a leaver simply drops their roles. {{1}} adds richer conditions such as device health or location. With {{2}}, the owner of each file decides who may read it. {{3}} uses system-enforced labels that even owners cannot change. A firewall-style {{4}} — one flat list applied identically to every subject — is the rule-based approach.</p>',
  fblanks: [ ['RBAC'], ['ABAC'], ['DAC'], ['MAC'], ['ACL'] ],
  fbank: ['SSO', 'JIT elevation'],
  ex: '<p><b>RBAC</b>: roles carry permissions — clean joiner/mover/leaver handling. <b>ABAC</b>: decisions from attributes (department, device compliance, time, location). <b>DAC</b>: owners share their own objects — flexible but leak-prone. <b>MAC</b>: labels and central enforcement; owners cannot override (think military or SELinux). A flat <b>ACL</b> applied to all subjects identically is <b>rule-based access control</b>. SSO and JIT belong to other chapters entirely.</p><p><b>Focus next:</b> tie each model to one vivid example — roles, attributes, owner, labels, flat rule.</p>',
  hints: ['Two models are decided by people (owner or job), two by the system, one by a single global list.', 'Labels that cannot be overridden are “mandatory”.'] },
{ t: 'mc', th: 0, title: 'Which one is a machine identity?', kw: ['machine / computer identity', 'device identity', 'user identity'],
  sc: '<p>The identity governance tool counts “identities” across the company and the CISO wants the categories right. Four team members each nominate one candidate.</p>',
  q: '<p>Which nomination is a machine identity?</p>',
  o: [ { h: 'The certificate issued to laptop ws-fin-114 for 802.1X', ok: true }, { h: 'The login a.price uses for the finance system' }, { h: 'The shared front-desk login on the reception PC' }, { h: 'The break-glass admin account of the hypervisor' } ],
  ex: '<p>A <b>machine identity</b> (or <b>device identity</b>) is an identity belonging to hardware or software, not a person — typically a certificate, key, or workload credential, like the 802.1X certificate of <code>ws-fin-114</code>. A person’s login is a <b>user identity</b>; the shared desk login is a shared account (a human workaround, not a machine); the break-glass account is a privileged human-useable account. Machine identities now outnumber users in most companies and must be inventoried and rotated too.</p><p><b>Focus next:</b> certificates, keys and workload accounts are identities with lifecycles — track them like staff.</p>',
  hints: ['Ask: does this identity belong to a device or a workload, or to somebody who can type a password?', 'Certificates issued to hardware are the classic case.'] },
{ t: 'slots', th: 1, title: 'Joiner, mover or leaver?', kw: ['onboarding', 'offboarding', 'provisioning', 'deprovisioning', 'joiner-mover-leaver', 'privilege escalation'],
  sc: '<p>The HR feed sends six events to the IAM system overnight. Route each event to the lifecycle phase that must handle it.</p>',
  q: '<p>Drag each event into the correct lifecycle bucket.</p>',
  sl: [ { n: 'Onboarding (joiner)' }, { n: 'Mover (role change)' }, { n: 'Offboarding (leaver)' } ],
  it: [ { h: 'New engineer signs contract, starts in two weeks', s: 0 }, { h: 'Proof identity documents for the new hire', s: 0 }, { h: 'Payroll clerk transfers into the audit team', s: 1 }, { h: 'Support engineer promoted to admin — grant via JIT, not standing rights, to avoid privilege escalation', s: 1 }, { h: 'Contractor’s last day is Friday', s: 2 }, { h: 'Sales manager resigns with immediate effect', s: 2 } ],
  ex: '<p>The <b>joiner-mover-leaver</b> model maps HR events to IAM work: joiners get identity proofing and provisioning; movers get their old groups pruned and the new role granted (a promotion to admin should use JIT to prevent <b>privilege escalation</b> into standing rights); leavers trigger deprovisioning — disable, revoke tokens, transfer data. Miss a mover and you get privilege creep; miss a leaver and you get orphaned access.</p><p><b>Focus next:</b> every HR event should cause exactly one lifecycle workflow — nothing automatic should be left “for later”.</p>',
  hints: ['The new hire events both happen before any access exists.', 'The promotion is still the same person — that makes it a mover.'] },
{ t: 'multi', th: 1, title: 'Design the lockout policy', kw: ['account lockout', 'password complexity'],
  sc: '<p>After a password-spray wave, security and service desk must agree new login throttling settings. They list five candidate measures.</p>',
  q: '<p>Select the <b>two</b> measures that slow guessing without letting attackers weaponise lockouts against staff.</p>',
  o: [ { h: 'Lockout threshold around 10 attempts with automatic unlock after 15 minutes', ok: true }, { h: 'Progressive rate-limiting and delays on the login endpoint itself', ok: true }, { h: 'Threshold of 3 attempts with unlock only by a helpdesk ticket' }, { h: 'No lockout at all — just log the failures and review weekly' }, { h: 'Permanent lockout of any account that fails once from a new country' } ],
  ex: '<p>A generous <b>lockout</b> threshold plus short automatic unlock slows brute force while keeping attacker-triggered <b>denial of service</b> cheap to recover from; endpoint rate-limiting stops thousands of guesses before the threshold is even reached. A threshold of 3 with manual unlock lets attackers lock out thousands of users at will (a self-inflicted DoS). “Only log” is not a control. One-failure country lockouts block travelling staff and VPN users, and attackers rotate sources anyway.</p><p><b>Focus next:</b> lockout design is a balance: too tight = attacker’s DoS weapon; too loose = no protection.</p>',
  hints: ['Think about who can trigger the lockout, and what it costs the company when they do.', 'One option controls how fast guesses arrive; another controls what happens after a burst.'] },
{ t: 'match', th: 1, title: 'What should the reviewer do?', kw: ['access recertification', 'identity proofing', 'separation of duties', 'deprovisioning', 'least privilege'],
  sc: '<p>The monthly access review queue contains five findings. For each, pick the action that matches the underlying control.</p>',
  q: '<p>Drag each finding onto the correct action.</p>',
  lf: [ { h: 'User left three weeks ago; account still active' }, { h: 'Contractor engagement extended by 6 months' }, { h: 'Finance user sits in a new ERP group she never uses' }, { h: 'Admin shared his password with a teammate “for cover”' }, { h: 'Helpdesk reset a password with no identity verification' } ],
  rt: [ { h: 'Deprovision: disable the orphaned account now', m: 0 }, { h: 'Recertify and update the account expiry date', m: 1 }, { h: 'Revoke for least privilege; re-request if really needed', m: 2 }, { h: 'Rotate credentials and restore separation of duties', m: 3 }, { h: 'Re-verify the user (identity proofing) before any reset', m: 4 } ],
  ex: '<p>An active account for a leaver is failed <b>deprovisioning</b> — disable it immediately. The extended contractor is a normal <b>recertification</b> outcome: approve and set a new expiry so the account dies on time automatically. Unused rights violate <b>least privilege</b> — revoke, and make the user re-request through approval if the need is real. A shared admin password breaks <b>separation of duties</b> and accountability — rotate it and fix the cover arrangement with delegated JIT rights. A reset without verification skips <b>identity proofing</b> — that is exactly how vishing takeovers happen.</p><p><b>Focus next:</b> every finding maps to one named control — name the control, then the action writes itself.</p>',
  hints: ['Orphaned = the owner is gone. Expired-in-the-future = extend it.', 'Two findings are about proving who is asking; one is about nobody proving who is asking.'] }
);
/* ===================== check / feedback / scoring ===================== */
function evaluate(ex, st) {
  var n = 0, ok = 0, given = [], corr = [];
  var marks = {};
  var T = ex.t || ex.kind;
  function acc(nn, k, g, c) { n = nn; ok = k; given = g; corr = c; }
  if (T === 'mc') {
    var okIdx = ex.o.map(function (o, i) { return o.ok ? i : -1; }).filter(function (x) { return x >= 0; })[0];
    n = 1;
    var chosen = st.ans;
    if (chosen === okIdx) { ok = 1; marks['o' + chosen] = 'ok'; }
    else if (chosen >= 0) { marks['o' + chosen] = 'bad'; marks['o' + okIdx] = 'miss'; }
    else { marks['o' + okIdx] = 'miss'; }
    given = [chosen >= 0 ? clean(ex.o[chosen].h) : '— nothing selected —'];
    corr = [clean(ex.o[okIdx].h)];
  } else if (T === 'multi') {
    var okIdxs = ex.o.map(function (o, i) { return o.ok ? i : -1; }).filter(function (x) { return x >= 0; });
    n = okIdxs.length;
    ok = 0;
    ex.o.forEach(function (o, i) {
      var sel = st.ans.indexOf(i) >= 0;
      if (o.ok && sel) { ok++; marks['o' + i] = 'ok'; }
      else if (!o.ok && sel) { marks['o' + i] = 'bad'; }
      else if (o.ok && !sel) { marks['o' + i] = 'miss'; }
    });
    given = st.ans.length ? st.ans.map(function (i) { return clean(ex.o[i].h); }) : ['— nothing selected —'];
    corr = okIdxs.map(function (i) { return clean(ex.o[i].h); });
  } else if (T === 'slots') {
    n = ex.it.length; ok = 0;
    ex.it.forEach(function (it, i) {
      var right = it.s, got = st.ans[i];
      if (got === right) { ok++; marks['i' + i] = 'ok'; }
      else if (got === -1) { marks['i' + i] = 'miss'; }
      else { marks['i' + i] = 'bad'; }
      given.push(clean(it.h) + ' → ' + (got >= 0 ? esc(ex.sl[got].n) : 'left in bank'));
      corr.push(clean(it.h) + ' → ' + esc(ex.sl[right].n));
    });
  } else if (T === 'match') {
    n = ex.rt.length; ok = 0;
    ex.rt.forEach(function (r, i) {
      var got = st.ans[i];
      if (got === r.m) { ok++; marks['i' + i] = 'ok'; }
      else if (got === -1) { marks['i' + i] = 'miss'; }
      else { marks['i' + i] = 'bad'; }
      given.push(clean(r.h) + ' → ' + (got >= 0 ? clean(ex.lf[got].h) : 'unmatched'));
      corr.push(clean(r.h) + ' → ' + clean(ex.lf[r.m].h));
    });
  } else if (T === 'order' || T === 'rank') {
    n = ex.oseq.length; ok = 0;
    st.ans.forEach(function (ii, pos) {
      if (ii === pos) { ok++; marks['p' + pos] = 'ok'; } else { marks['p' + pos] = 'bad'; }
    });
    given = st.ans.map(function (ii) { return clean(ex.oseq[ii].h); });
    corr = ex.oseq.map(function (o) { return clean(o.h); });
  } else if (T === 'fill') {
    if (ex.fblanks.length > 1) {
      n = ex.fblanks.length; ok = 0;
      ex.fblanks.forEach(function (accs, bi) {
        var w = st.ans[bi];
        var val = w >= 0 ? st.perm.words[w] : '';
        if (val && accs.some(function (a) { return a.toLowerCase() === val.toLowerCase(); })) { ok++; marks['b' + bi] = 'ok'; }
        else if (!val) { marks['b' + bi] = 'miss'; }
        else { marks['b' + bi] = 'bad'; }
        given.push('blank ' + (bi + 1) + ': ' + (val || '— empty —'));
        corr.push('blank ' + (bi + 1) + ': ' + accs[0]);
      });
    } else {
      n = 1;
      var val = String(st.ans || '').trim();
      var good = ex.fblanks[0].some(function (a) { return a.toLowerCase() === val.toLowerCase(); });
      if (good) { ok = 1; marks['b0'] = 'ok'; } else if (!val) { marks['b0'] = 'miss'; } else { marks['b0'] = 'bad'; }
      given = [val || '— empty —'];
      corr = [ex.fblanks[0][0]];
    }
  } else if (T === 'terminal') {
    n = ex.tps.length; ok = 0;
    ex.tps.forEach(function (tp, ti) {
      var v = normCmd(st.ans[ti]);
      var good = v && tp.acc.some(function (rx) { try { return new RegExp(rx, 'i').test(v); } catch (e) { return false; } });
      if (good) { ok++; marks['t' + ti] = 'ok'; } else { marks['t' + ti] = 'bad'; }
      given.push('cmd ' + (ti + 1) + ': ' + (normCmd(st.ans[ti]) || '— empty —'));
      corr.push('cmd ' + (ti + 1) + ' accepted pattern: ' + tp.show);
    });
  } else if (T === 'branch') {
    n = ex.steps.length; ok = 0;
    ex.steps.forEach(function (s, si) {
      var c = st.ans[si];
      if (c >= 0 && s.o[c].ok) { ok++; marks['s' + si] = 'ok'; }
      else if (c >= 0) { marks['s' + si] = 'bad'; }
      else { marks['s' + si] = 'miss'; }
      given.push('Decision ' + (si + 1) + ': ' + (c >= 0 ? clean(s.o[c].h) : '— not answered —'));
      corr.push('Decision ' + (si + 1) + ': ' + clean(s.o.filter(function (o) { return o.ok; })[0].h));
    });
  } else if (T === 'spot') {
    n = ex.wrong.length; ok = 0;
    st.ans.forEach(function (li) {
      if (ex.wrong.indexOf(li) >= 0) { ok++; marks['l' + li] = 'ok'; }
      else { marks['l' + li] = 'bad'; }
    });
    ex.wrong.forEach(function (li) { if (marks['l' + li] !== 'ok') marks['l' + li] = 'miss'; });
    given = st.ans.length ? st.ans.map(function (li) { return 'line ' + (li + 1) + ': ' + clean(ex.lines[li]); }) : ['— nothing flagged —'];
    corr = ex.wrong.map(function (li) { return 'line ' + (li + 1) + ': ' + clean(ex.lines[li]); });
  } else if (T === 'log') {
    return evaluate(ex.inner, st.inner);
  }
  return { n: n, ok: ok, marks: marks, given: given, corr: corr };
}

function labelOf(f) { return f >= 0.999 ? 'full' : (f > 0 ? 'partial' : 'zero'); }

  });

  if (seqRows.length) {
    var curStt = st;
    curStt.ans.forEach(function (ii, pos) {
      var m = marks['p' + pos];

    });
  }
  if (ex.t === 'fill' && ex.fblanks.length > 1) {
    var blanks = host.querySelectorAll('.blank');

      if (m && blanks[bi]) { blanks[bi].classList.add('m-' + m); }
    });
  }
  if (ex.t === 'spot') {
    var lns = host.querySelectorAll('.lines .ln');
    Object.keys(marks).forEach(function (k) {
      var li = parseInt(k.slice(1), 10);
      var m = marks[k];

    });
  }
  if (ex.t === 'branch') {
    var steps = host.querySelectorAll('.step');
    ex.steps.forEach(function (_, si) {

      if (m && steps[si]) steps[si].classList.add('m-' + m);

  if (ex.t === 'fill' && ex.fblanks.length === 1 || ex.t === 'log' && ex.inner.kind === 'fill') {

    '<ul class="instr">' +
    '<li><span class="ic">01</span><span>Every exercise has three separated blocks: <b>SCENARIO</b>, <b>QUESTION</b> and the answer area. The artefacts (logs, configs, tickets) live in the scenario block — read them, then answer.</span></li>' +
    '<li><span class="ic">02</span><span><b>Check</b> validates your answer, marks every element green (correct), red (wrong) or amber (missed), locks the answer and <b>pauses the timer in review mode</b> — the exercise and its explanation stay visible. Press <b>Next</b> to resume the clock.</span></li>' +
    '<li><span class="ic">03</span><span><b>Manual Pause</b> (top right) stops the timer but hides the question content. The two pause types are independent and can stack.</span></li>' +
    '<li><span class="ic">04</span><span><b>Skip</b> jumps to the next exercise and flags this one (amber » in the navigator). Before time runs out you can come back to any skipped exercise. Skipped exercises are <b>excluded from scoring</b> — they earn nothing but also do not count against you.</span></li>' +
    '<li><span class="ic">05</span><span>Multi-answer exercises give <b>partial credit</b>: each correct element earns its share, wrong picks earn nothing (but are shown in red). Single-answer exercises are all-or-nothing. <b>Hint</b> costs 10% of the exercise and gives a nudge, never the answer.</span></li>' +
    '<li><span class="ic">06</span><span>Score 70% or more to pass. You can revise any checked answer until the timer ends. On retake, questions and options are reshuffled.</span></li>' +
    '</ul>' +
    '<div class="themeBox"><h2 style="font-size:16px;margin:16px 0 2px">Keywords covered</h2>' + kw + '</div>' +
    '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
    '<button id="btnStart" class="btn primary" style="min-width:200px;min-height:48px">Start exam →</button>' +
    '<span style="color:var(--dim2);font-size:13.5px">The timer starts as soon as you press Start.</span>' +
    '</div></div>';
  $('btnStart').addEventListener('click', startExam);
}
function startExam() {
  S = freshState();
  S.attempt = attemptNo;
  S.order = shuffle(EX.map(function (_, i) { return i; }));
  S.st = EX.map(function () { return { vis: 'new', ans: null, earned: 0, hints: 0, marks: null, snap: null, perm: null, inner: null, revealed: 0 }; });
  buildPerms();
  $('scrIntro').classList.add('hide');
  $('scrResults').classList.add('hide');
  $('scrExam').classList.remove('hide');
  $('brandDiff').textContent = '· ' + CFG.diff;
  S.idx = 0;
  S.tleft = CFG.mins * 60;
  paintTimer();
  if (TICK) clearInterval(TICK);
  TICK = setInterval(tick, 1000);
  renderQ();
  window.scrollTo(0, 0);
}
/* ===================== finish & results ===================== */
function askFinish() {
  if (S.ended) return;
  var unchecked = 0;
  S.st.forEach(function (s) { if (s.vis !== 'checked') unchecked++; });
  if (unchecked === EX.length) { modal('Nothing answered', 'You must answer at least one exercise before the exam can be submitted. Skip and unanswered exercises are excluded from scoring, so an exam with zero answered exercises cannot be graded.', 'Back to exam', null); return; }
  modal('Finish the exam?', unchecked + ' exercise(s) are still unanswered or skipped. They will be excluded from the score — the percentage is computed over the exercises you actually answered. The timer keeps running until you confirm.', 'Submit results', function () { finishExam('submit'); });
}
function modal(title, msg, okTxt, cb) {
  $('modalTitle').textContent = title;
  $('modalMsg').textContent = msg;
  $('modalOk').textContent = okTxt;
  $('modalWrap').classList.remove('hide');
  $('modalOk').focus();
  $('modalOk').onclick = function () { $('modalWrap').classList.add('hide'); if (cb) cb(); };
  $('modalCancel').onclick = function () { $('modalWrap').classList.add('hide'); };
}
function finishExam(reason) {
  if (S.ended) return;
  S.ended = true;
  S.manualPause = false; S.checkPause = false;
  $('pauseOverlay').classList.add('hide');
  if (TICK) { clearInterval(TICK); TICK = null; }
  paintPause();
  renderResults(reason);
}
function reportScore(score, total) {
  var percent = Math.round((score / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      score: score, total: total, percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch (e) { /* opened directly — nothing to report to */ }
}
function renderResults(reason) {
  var checked = 0, earnedSum = 0;
  var skipped = [];
  S.st.forEach(function (s, i) {
    if (s.vis === 'checked') { checked++; earnedSum += s.earned; }
    else skipped.push(i);
  });
  var scr = $('scrResults');
  $('scrExam').classList.add('hide');
  scr.classList.remove('hide');
  if (checked === 0) {
    scr.innerHTML = '<div class="panel"><div class="resHero"><div class="big">—</div>' +
      '<div class="verdict">NOTHING WAS ANSWERED</div></div>' +
      '<p style="text-align:center;color:var(--dim)">No exercise was completed, so nothing is counted and no score is reported. Press Retake to try again.</p>' +
      '<div style="text-align:center"><button id="btnRetake" class="btn primary">Retake exam</button></div></div>';
    $('btnRetake').addEventListener('click', function () { retake(); });
    window.scrollTo(0, 0);
    return;
  }
  var finalScore = Math.round(earnedSum);
  var unitScore = Math.round(earnedSum / CFG.ptsPerEx);
  var total = checked;
  var percent = Math.round((unitScore / total) * 100);
  var passed = percent >= CFG.passMark;
  if (!S.reported) { S.reported = true; reportScore(unitScore, total); }
  var full = 0, part = 0, zero = 0;
  S.st.forEach(function (s) { if (s.vis === 'checked') { var f = s.earned / CFG.ptsPerEx; if (f >= 0.999) full++; else if (f > 0) part++; else zero++; } });
  var stats = '<span class="chip">Answered &amp; graded <b>' + checked + '/' + EX.length + '</b></span>' +
    '<span class="chip"><span style="color:var(--ok)">✓</span> full <b>' + full + '</b></span>' +
    '<span class="chip"><span style="color:var(--warn)">~</span> partial <b>' + part + '</b></span>' +
    '<span class="chip"><span style="color:var(--bad)">✕</span> zero <b>' + zero + '</b></span>' +
    '<span class="chip"><span style="color:var(--purple)">»</span> not counted <b>' + skipped.length + '</b></span>' +
    '<span class="chip">Attempt <b>#' + S.attempt + '</b> (' + (reason === 'time' ? 'time ran out' : 'submitted') + ')</span>';
  var skipHtml = skipped.length ?
    '<div class="skipNote"><b>Not counted:</b> exercises ' + skipped.map(function (i) { return 'Q' + (S.order.indexOf(i) + 1) + ' — ' + esc(EX[i].title); }).join(' · ') +
    '.<br>These were skipped (or left unanswered) and are excluded from both the points earned and the points possible. Their explanations appear below so you can still learn from them.</div>' : '';
  var rep = S.order.map(function (exi, pos) {
    var ex = EX[exi], s = S.st[exi];
    var isSk = s.vis !== 'checked';
    var f = s.vis === 'checked' ? s.earned / CFG.ptsPerEx : 0;
    var lab = isSk ? 'skipped' : labelOf(f);
    var given = s.snap ? s.snap.given.map(function (g) { return '<div>• ' + esc(g) + '</div>'; }).join('') : '<div>• — no answer recorded —</div>';
    var corr = (isSk ? correctSummary(ex) : s.snap.corr.map(function (g) { return '<div>• ' + esc(g) + '</div>'; }).join(''));
    return '<details class="repItem"><summary><span class="rn">Q' + (pos + 1) + '</span><span class="rt">' + esc(ex.title) + '</span>' +
      '<span class="lab ' + lab + '">' + lab + '</span><span class="rp">' + (isSk ? 'excluded' : s.earned + ' / ' + CFG.ptsPerEx + ' pts') + '</span></summary>' +
      '<div class="repBody"><div class="given"><span class="k">YOUR ANSWER</span>' + given + '</div>' +
      '<div class="corr"><span class="k">CORRECT</span>' + corr + '</div>' +
      '<div class="explain" style="margin-top:10px"><span class="lbl">EXPLANATION' + (isSk ? ' — SKIPPED, STILL WORTH READING' : '') + '</span>' + ex.ex +
      '</div></div></details>';
  }).join('');
  scr.innerHTML =
    '<div class="panel ' + (passed ? 'resHero pass' : 'resHero fail') + '">' +
    '<div class="resHero"><div class="big">' + percent + '%</div>' +
    '<div class="verdict">' + (passed ? '✓ PASS' : '✕ FAIL — RETAKE REQUIRED') + '</div>' +
    '<div style="color:var(--dim);margin-top:4px;font-family:var(--mono)">' + finalScore + ' of ' + (total * CFG.ptsPerEx) + ' possible points over ' + total + ' graded exercise(s) · pass mark ' + CFG.passMark + '%</div>' +
    '<div class="resBar"><div style="width:' + Math.min(100, percent) + '%"></div></div></div>' +
    '<div class="resStats">' + stats + '</div>' +
    (passed ?
      '<div class="skipNote" style="border-color:#1f7a55;background:#0d3325;color:#a9f5d5"><b>Certificate-style result:</b> you reached the pass mark for the ' + CFG.diff + ' exam on 4.6 Identity and Access Management. ' + (part || skipped.length ? 'Review the report below to close the remaining gaps.' : 'Clean run — every graded exercise was fully correct.') + '</div>'
      :
      '<div class="skipNote" style="border-color:#8c2f44;background:#3a1220;color:#ffc9d2"><b>Retake needed:</b> you did not reach ' + CFG.passMark + '%. Work through the explanations below — each one says exactly what to focus on — then press Retake Exam. Questions and options will be reshuffled.</div>') +
    skipHtml +
    '<h3 style="margin:18px 0 4px">Per-exercise report</h3>' + rep +
    '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="btnRetake" class="btn primary" style="min-height:48px">Retake Exam</button></div>' +
    '</div>';
  $('btnRetake').addEventListener('click', function () { retake(); });
  window.scrollTo(0, 0);
}
function correctSummaryList(ex) {
  var t = ex.t || ex.kind;
  var out = [];
  if (t === 'mc' || t === 'multi') ex.o.forEach(function (o) { if (o.ok) out.push(clean(o.h)); });
  else if (t === 'slots') ex.it.forEach(function (it) { out.push(clean(it.h) + ' → ' + ex.sl[it.s].n); });
  else if (t === 'match') ex.rt.forEach(function (r) { out.push(clean(r.h) + ' → ' + clean(ex.lf[r.m].h)); });
  else if (t === 'order' || t === 'rank') ex.oseq.forEach(function (o, i) { out.push((i + 1) + '. ' + clean(o.h)); });
  else if (t === 'fill') ex.fblanks.forEach(function (b, i) { out.push('blank ' + (i + 1) + ': ' + b[0]); });
  else if (t === 'terminal') ex.tps.forEach(function (tp, i) { out.push('cmd ' + (i + 1) + ' example: ' + tp.show); });
  else if (t === 'branch') ex.steps.forEach(function (s, i) { out.push('Decision ' + (i + 1) + ': ' + clean(s.o.filter(function (o) { return o.ok; })[0].h)); });
  else if (t === 'spot') ex.wrong.forEach(function (li) { out.push('line ' + (li + 1) + ': ' + clean(ex.lines[li])); });
  else if (t === 'log') return correctSummaryList(ex.inner);
  return out;
}
function correctSummary(ex) {
  return correctSummaryList(ex).map(function (g) { return '<div>• ' + esc(g) + '</div>'; }).join('');
}
function correctAns(ex) {
  var t = ex.t || ex.kind;
  if (t === 'mc' || t === 'multi') { var a = []; ex.o.forEach(function (o, i) { if (o.ok) a.push(i); }); return t === 'mc' ? a[0] : a; }
  if (t === 'slots') { var m = {}; ex.it.forEach(function (it, i) { m[i] = it.s; }); return m; }
  if (t === 'match') { var m2 = {}; ex.rt.forEach(function (r, i) { m2[i] = r.m; }); return m2; }
  if (t === 'order' || t === 'rank') return ex.oseq.map(function (_, i) { return i; });
  if (t === 'fill') return ex.fblanks.map(function (b) { return b[0]; });
  if (t === 'terminal') return ex.tps.map(function (tp) { return tp.show; });
  if (t === 'branch') return ex.steps.map(function (s) { return s.o.map(function (o, i) { return o.ok ? i : -1; }).filter(function (x) { return x >= 0; })[0]; });
  if (t === 'spot') return ex.wrong.slice();
  if (t === 'log') return correctAns(ex.inner);
  return -1;
}
var attemptNo = 1;
function retake() {
  attemptNo++;
  $('scrResults').classList.add('hide');
  startExam();
}
/* ===================== website handshake ===================== */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  if (event.data.username) candidate.name = String(event.data.username).slice(0, 40);
  if (event.data.country) candidate.country = String(event.data.country).slice(0, 2);
  try { renderIntro(); } catch (e) { }
});
/* ===================== boot ===================== */
function boot() {
  S = freshState();
  S.attempt = attemptNo;
  S.order = EX.map(function (_, i) { return i; });
  S.st = EX.map(function () { return { vis: 'new', ans: null, earned: 0, hints: 0, marks: null, snap: null, perm: null, inner: null, revealed: 0 }; });
  buildPerms();
  $('btnPause').addEventListener('click', function () { setManualPause(!S.manualPause); });
  $('btnResume').addEventListener('click', function () { setManualPause(false); });
  renderIntro();
}
boot();
/* ===================== QA hooks (only with #qa in the URL) ===================== */
if (location.hash.indexOf('qa') >= 0) {
  window.__cpx = {
    state: function () { return S; },
    ex: function () { return curEx(); },
    st: function () { return curSt(); },
    correct: function () { return correctAns(curEx()); },
    setTimeLeft: function (s) { S.tleft = s; paintTimer(); },
    finish: function () { finishExam('submit'); },
    meta: CFG
  };
}
</script>
</body>
</html>
