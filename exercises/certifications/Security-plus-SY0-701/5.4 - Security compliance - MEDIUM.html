<script>
"use strict";
var CFG={topicId:"security-plus",chapter:5.4,title:"5.4 Security compliance — MEDIUM",difficulty:"medium",sevLabel:"MEDIUM",passMark:70,secsPerEx:100};
var THEMES=[
{id:"REG",name:"Regulations & data types",kws:["GDPR","CCPA","HIPAA","PCI DSS","SOX","GLBA","FERPA","COPPA","ISO/IEC 27001","SOC 2","NIST CSF","FedRAMP / FISMA","PII","PHI","Cardholder data (PAN)","Data classification","Data controller / processor","Jurisdiction & data ownership"]},
{id:"RPT",name:"Compliance reporting",kws:["Internal compliance report","External / regulator reporting","Internal vs external audit","SOC 2 Type I / Type II","ISO 27001 certification & surveillance audits","PCI SAQ / AOC / ROC","QSA","ASV scan","Evidence collection","Attestation","Due care vs due diligence","Compliance dashboard","KPI","KRI"]},
{id:"CON",name:"Consequences of non-compliance",kws:["Regulatory fines","GDPR fine tiers (4% / EUR 20M)","HIPAA penalty tiers","PCI monthly fines","Consent order","Corrective action plan (CAP)","Lawsuit / class action","Criminal liability","Loss of certification or license","Contract termination (BAA / DPA breach)","Reputational damage","Increased audit frequency","Regulator escalation (OCR / FTC / ICO / state AG)","Processing ban / suspension"]},
{id:"MON",name:"Compliance monitoring",kws:["Continuous monitoring","Point-in-time audit","Automated evidence collection","GRC platform","Policy attestation tracking","Training completion tracking","Exception register","Vendor / third-party monitoring","Self-assessment","Control drift","Audit readiness"]},
{id:"PRV",name:"Privacy & sensitive data",kws:["Data minimization","Masking","Tokenization","Anonymization","Pseudonymization","Retention policy","Legal hold","Information life cycle","Media sanitization","DPIA / PIA","Privacy notice","Consent & lawful basis","Opt-in / opt-out","Breach notification windows (GDPR 72h / HIPAA 60d)","Notice of privacy events","Data subject rights (DSAR)","Right to erasure","Data portability","NDA","MOU","SLA","DPA (data processing agreement)","BAA","Data owner / steward / custodian"]}
];
const EXERCISES=[
{id:"m1",th:"REG",type:"dnd",title:"Which regime governs it?",kw:["GDPR","HIPAA","PCI DSS","COPPA","FERPA","SOX","GLBA"],
scenario:"You are the new GRC analyst at a holding company with several lines of business. Legal asks you to sort seven real situations from the weekly intake into the right compliance regime, so each can be routed to the correct owner.",
question:"Drag each situation onto the regime that governs it.",
buckets:["GDPR","HIPAA","PCI DSS","COPPA","FERPA","SOX","GLBA"],
items:[
{t:"A hospital shares patient records with a billing vendor",b:1},
{t:"An app tracks the location of customers across the EU",b:0},
{t:"A store saves full card numbers with the CVV in the same file",b:2},
{t:"An edtech platform collects profiles of children under 13",b:3},
{t:"A university shares transcripts with a donor-mailing firm",b:4},
{t:"The CEO and CFO must certify the financial reports",b:5},
{t:"A bank passes customer data to a telemarketer with no opt-out",b:6}],
expl:"Each situation matches the regime that regulates that data or activity: patient data is HIPAA, EU residents' personal data is GDPR, card data is PCI DSS, children under 13 online is COPPA, education records are FERPA, public-company financial reporting is SOX, and financial-institution customer data with opt-out rights is GLBA. Focus on: match the DATA or the ACTIVITY to the regime, not the industry label.",
hint:"Ask yourself for each item: what kind of data is it, and which law exists to protect exactly that?"},
{id:"m2",th:"REG",type:"match",title:"Handling rules for sensitive data",kw:["PHI","Cardholder data (PAN)","PII","Data minimization","FERPA","SOX","Retention policy","BAA"],
scenario:"During an internal audit of Meridian Health Plans, the auditor asks you to confirm that each data type is handled per policy. The policy map is on your desk — now match it to the data types found in the systems.",
question:"Match each data type to the handling rule that applies to it.",
left:["A typed doctor note inside a claims file (PHI)","The 16-digit card number (PAN) in a payment export","A spreadsheet of employee PII built for payroll","University transcript records","Signed SOX audit workpapers"],
right:["Share only under a signed BAA; use limited to treatment, payment and operations","Render it unreadable (mask or tokenize); never keep the CVV with it","Collect only the fields payroll truly needs (minimization)","Require consent before disclosure to third parties","Retain for seven years, then destroy securely"],
sol:[0,1,2,3,4],
expl:"PHI may only flow to vendors under a Business Associate Agreement. Card numbers must be unreadable and the CVV may not be stored after authorization. Payroll PII follows minimization: collect only what the purpose needs. Education records need consent before third-party disclosure (FERPA). SOX audit workpapers carry a seven-year retention duty. Focus on: the handling rule comes from the data type, not from the system it sits in.",
hint:"Two rules are about reading limits, one is about how little you collect, one is about consent, and one is a calendar."},
{id:"m3",th:"REG",type:"qcm",title:"Classify the leaked file",kw:["Data classification"],
scenario:"Ticket CMP-2214: a cleaner found the file 'M&A_bidding_plan_v3.xlsx' and a folder of open HR complaints on a share that every employee can read. The deal team is furious; the cleanup ticket is yours.",
question:"Which classification should these files carry BEFORE remediation?",
opts:["Internal — every employee may read it freely","Public — release it through the marketing site","Restricted — only named deal-team members may open it","Confidential — fine to post on the staff intranet"],
correct:2,
expl:"Restricted is the top handling class: access is limited to named people because exposure would cause serious damage — an M&A plan and HR complaints are exactly that. 'Internal' over-shares, 'Public' is absurd here, and the intranet option still spreads the files to the whole workforce. Focus on: classification drives handling; the label must match the harm of exposure, not the folder it was found in.",
hint:"Think about who must be allowed to read it, and how much damage a wide read would cause."},
{id:"m4",th:"REG",type:"fib",title:"Controller or processor?",kw:["Data controller / processor","BAA","PHI"],
scenario:"Meridian Health Plans hires CloudPay to run payroll, which means some employee PHI will sit in CloudPay's systems. Legal asks you to finish the contract wording before the signature meeting.",
question:"Complete the contract sentence with the correct terms from the word bank.",
html:"Meridian Health Plans decides why and how patient data is used, so it is the data {{0}}. CloudPay runs payroll only on documented instructions, so it is the data {{1}}. Before any PHI flows to CloudPay, the two parties must sign a {{2}}.",
blanks:["controller","processor","BAA"],
bank:["controller","processor","BAA","custodian","steward","tokenization"],
expl:"The controller decides the purposes and means of processing; the processor acts on the controller's documented instructions. A vendor that touches PHI needs a Business Associate Agreement before any data moves. Custodian and steward are internal data-governance roles, and tokenization is a technique, not a party. Focus on: who DECIDES versus who EXECUTES.",
hint:"One side decides the 'why and how'; the other side just follows written instructions."},
{id:"m5",th:"RPT",type:"terminal",title:"Pull the missing reviews",kw:["Evidence collection","Audit readiness","Internal vs external audit"],
scenario:"The external auditor reviewing Meridian Health Plans' access governance asked for one thing: every account that did NOT get a Q2 access review. The review register is access_review_q2.csv on the GRC host. The column q2_review holds 'reviewed' or 'missing'.",
question:"Use a grep command to print every line that does NOT contain 'reviewed', so the missed accounts are listed. The file is access_review_q2.csv.",
banner:["analyst@grc:~$ head -5 access_review_q2.csv","account,role,last_login,q2_review","svc_backup,service,2026-04-02,reviewed","j.aldridge,finance,2026-05-11,reviewed","tmp_vendor_scan,external,2026-06-30,missing","a.finley,ops,2026-06-12,reviewed","... (34 rows total)"],
acceptedAny:["^grep\\s+(?:-\\w+\\s+)*-v\\s+['\\\"]?reviewed['\\\"]?\\s+(?:\\./)?access_review_q2\\.csv\\s*$","^grep\\s+['\\\"]?missing['\\\"]?\\s+(?:\\./)?access_review_q2\\.csv\\s*$","^cat\\s+(?:\\./)?access_review_q2\\.csv\\s*\\|\\s*grep\\s+(?:-\\w+\\s+)*-v\\s+['\\\"]?reviewed['\\\"]?\\s*$"],
sample:"grep -v reviewed access_review_q2.csv",
expl:"grep prints matching lines; the -v flag inverts the match, so it prints the lines WITHOUT the word — exactly the accounts that were missed. Auditors want complete evidence: those missing rows are the findings. Focus on: invert a match with -v, and always know which column proves the control.",
hint:"The -v flag inverts the match: it prints lines that do NOT contain the word."},
{id:"m6",th:"RPT",type:"multi",title:"What goes in the external report?",kw:["External / regulator reporting","Internal compliance report","PCI DSS","Evidence collection"],
scenario:"Cobalt Retail Group failed part of its annual PCI assessment. The acquirer expects the external compliance report within 20 days. Your manager asks you to assemble it and to keep the internal version separate.",
question:"Select the THREE items that belong in the EXTERNAL report (the others stay internal).",
opts:["Summary of control failures that affected cardholder data","Named performance reviews for the engineers involved","The committed remediation dates owed to the acquirer","Raw vulnerability scan exports with internal host names","The scope of the assessment and the systems included","Internal salary benchmarking for the security team"],
correct:[0,2,4],
expl:"An external report tells the counterparty what happened, what it means for them, and what you commit to fix and when — plus the scope so they can judge coverage. Staff performance notes, raw scans full of internal detail, and salary data are internal material; sending them out leaks more than the failure itself. Focus on: external reporting is complete but filtered — share conclusions, commitments and scope, not internal working papers.",
hint:"Ask for each item: does the acquirer NEED this to judge our compliance posture, or is it internal housekeeping?"},
{id:"m7",th:"CON",type:"dnd",title:"Who punishes what?",kw:["GDPR fine tiers (4% / EUR 20M)","Processing ban / suspension","HIPAA penalty tiers","Criminal liability","Corrective action plan (CAP)","PCI monthly fines","Contract termination (BAA / DPA breach)","Lawsuit / class action","Consent order"],
scenario:"After a rough year of audits and one public incident, the risk committee wants to understand which consequences come from which authority. You get the mapping task for the briefing pack.",
question:"Drag each consequence onto the authority that imposes it.",
buckets:["GDPR (data protection authority)","OCR (HIPAA enforcement)","Payment brand / acquirer","Contract counterparties","Courts / class actions","FTC"],
items:[
{t:"Fine up to 4% of annual global turnover",b:0},
{t:"Ban on a processing activity until it is fixed",b:0},
{t:"Tiered civil penalties; worst cases can be referred for criminal prosecution",b:1},
{t:"Corrective action plan with fixed deadlines",b:1},
{t:"Monthly fines plus higher card transaction fees",b:2},
{t:"Terminate the BAA after repeated PHI misuse",b:3},
{t:"Class action by affected customers",b:4},
{t:"Consent order with years of independent monitoring",b:5}],
expl:"Each authority has its own stick: GDPR regulators fine by turnover and can suspend processing; OCR under HIPAA uses penalty tiers and corrective action plans, and criminal cases go to the DOJ; card brands and acquirers charge monthly fines and raise fees; contracts can simply be terminated for breach; customers sue in court; the FTC uses consent orders with long monitoring. Focus on: map the consequence to the relationship — law, contract, or payment rules.",
hint:"Think: privacy law, health law, card rules, contract law, tort law, consumer protection."},
{id:"m8",th:"CON",type:"qcm",title:"The GDPR fine math",kw:["GDPR fine tiers (4% / EUR 20M)","Regulatory fines"],
scenario:"Veldt Ltd has a global annual turnover of EUR 900 million. The data protection authority finds systemic violations of the processing principles and applies the higher fine tier.",
question:"What is the HIGHEST possible GDPR fine in the higher tier for this company?",
opts:["EUR 20 million — the fixed maximum always wins","EUR 36 million — 4% here beats the EUR 20 million figure","EUR 900 million — the full turnover can be taken","EUR 18 million — 2% here stays under the fixed cap"],
correct:1,
expl:"The higher GDPR tier is up to EUR 20 million OR 4% of annual global turnover, whichever is HIGHER. For EUR 900 million turnover, 4% is EUR 36 million, which beats the fixed cap. The 2% figure belongs to the lower tier, and taking the whole turnover is not a thing. Focus on: remember 'whichever is higher', and do the arithmetic with the company's own turnover.",
hint:"Compute 4% of the turnover and compare it with the fixed maximum. Keep the bigger number."},
{id:"m9",th:"PRV",type:"branch",title:"Night-time bucket exposure",kw:["Breach notification windows (GDPR 72h / HIPAA 60d)","Notice of privacy events","GDPR","Jurisdiction & data ownership","Reputational damage"],
scenario:"You are the on-call privacy analyst. A misconfigured storage bucket holding a nightly customer database export has been open to the internet; the access log shows downloads from unknown sources.",
question:"Walk the response path. One choice per decision — the story moves on.",
nodes:[
{txt:"02:40 — The on-call engineer pings you: bucket open, unknown downloads in the log. What is your first decision as case owner?",
opts:[
{t:"Take the bucket offline now, preserve the logs, and open an incident case",ok:true,out:"Good — containment comes first, and the evidence stays intact for the risk assessment."},
{t:"Wait for Monday so the whole team can look at it together",ok:false,out:"Poor — the exposure continues and the notification clock keeps running all weekend."},
{t:"Delete the bucket immediately so nobody else can reach it",ok:false,out:"Poor — deleting destroys the very evidence you need to judge the risk."}]},
{txt:"The case lead confirms the export holds personal data of EU residents. The storage runs in Ireland, but the customers sit across the EU.",
opts:[
{t:"Notify the supervisory authority within 72 hours of becoming aware, unless the risk is unlikely",ok:true,out:"Good — GDPR follows the PEOPLE, not the server rack. The 72-hour clock starts at awareness."},
{t:"No notice needed — the data never left the EU region",ok:false,out:"Poor — jurisdiction follows the people whose data it is, wherever the bytes sit."},
{t:"Notify the authority only when the investigation closes, even if that takes months",ok:false,out:"Poor — the 72-hour clock starts when you become aware, not when the file is closed."}]},
{txt:"The assessment concludes the risk to the people is HIGH: names plus policy numbers were exposed.",
opts:[
{t:"Inform the affected people without undue delay, in clear language, with what happened and what to do",ok:true,out:"Good — high risk to rights and freedoms triggers the duty to tell the people themselves."},
{t:"Tell nobody outside the regulator — it alone decides who hears about it",ok:false,out:"Poor — the regulator notice and the people notice are two separate duties."},
{t:"Post a short note on the corporate blog and consider it done",ok:false,out:"Poor — a passive blog post does not actually reach the affected individuals, and delay costs trust."}]}],
expl:"Privacy-event response has three linked duties: contain and preserve, tell the regulator fast (72 hours under GDPR from awareness), and tell the people when the risk to them is high. Jurisdiction follows the people whose data it is, not the server location. Handling it late or silently is what turns an incident into reputational damage. Focus on: awareness starts the clock; containment never waits.",
hint:"Three duties in order: contain, regulator, people — and the clock starts when you become aware."},
{id:"m10",th:"PRV",type:"order",title:"Life of a data record",kw:["Information life cycle","Retention policy","Data classification","Media sanitization"],
scenario:"A new analyst joined the records team and keeps destroying files 'to be safe'. You must show the correct order of the information life cycle so controls land at the right stage.",
question:"Put the stages of the information life cycle in the correct order.",
items:["Create / capture the data","Classify it (public, internal, confidential, restricted)","Store it with controls matched to its class","Use it for the agreed purpose","Share it only as the policy allows","Archive it when it is no longer active","Destroy it at the end of the retention schedule"],
expl:"The life cycle runs create, classify, store, use, share, archive, destroy. Classification comes right after creation so the storage controls match the value and the risk. Destruction is the last step, only when the retention schedule ends, and it must use proper media sanitization — clear, purge or physically destroy. Focus on: classify early, destroy last, and never skip the schedule.",
hint:"Creation is first and destruction is last; classification must happen before controls are chosen."},
{id:"m11",th:"PRV",type:"fibtext",title:"Name that technique",kw:["Anonymization","Pseudonymization","GDPR"],
scenario:"The analytics team keeps saying 'anonymous' about two very different datasets. The DPO asks you to label them precisely before the release decision.",
question:"Type the correct term for each description.",
fields:[
{lab:"Dataset A: values were changed so that nobody — not even the company holding extra data — can re-identify the people.",accept:["anonymization","anonymisation","anonymized data","anonymised data"]},
{lab:"Dataset B: names were replaced by random codes, but a key table kept separately could reverse the codes.",accept:["pseudonymization","pseudonymisation","pseudonymized","pseudonymised"]}],
expl:"Anonymization is irreversible: no one can re-identify people, so GDPR no longer applies to it. Pseudonymization replaces identifiers with codes but keeps a key somewhere — it is still personal data and GDPR still applies. Teams love to say 'anonymous' when they really mean pseudonymized, which understates the duty. Focus on: can ANYONE re-identify with extra information? If yes, it is pseudonymization.",
hint:"Ask: does a key, a code table, or extra data still exist that could undo the change?"},
{id:"m12",th:"REG",type:"dnd",title:"Who owns the data?",kw:["Data owner / steward / custodian","Data controller / processor","Privacy notice"],
scenario:"A new data governance board is being stood up at Meridian Health Plans. HR wrote one job description labelled 'data person' and four very different tasks arrived on your desk to sort into roles.",
question:"Drag each duty onto the role that performs it.",
buckets:["Data owner","Data steward","Data custodian","Data controller","Data processor"],
items:[
{t:"Approves access requests and sets the classification of the dataset",b:0},
{t:"Makes sure data quality and handling rules are followed day to day",b:1},
{t:"Runs the backups, patches and storage systems that hold the data",b:2},
{t:"Decides WHY and HOW personal data is processed; publishes the privacy notice and answers access requests",b:3},
{t:"Processes personal data on behalf of another party, on documented instructions only",b:4}],
expl:"The data owner is accountable for the dataset and approves access and classification. The steward keeps quality and handling right day to day. The custodian operates the systems — backups, patches, storage. For personal data, the controller decides the purposes and means (and answers privacy requests), while the processor only acts on instructions. Focus on: accountable vs operational, and deciding vs following instructions.",
hint:"Separate business accountability (owner), daily care (steward), machine work (custodian), then the two privacy-law roles."},
{id:"m13",th:"PRV",type:"match",title:"Technique or excuse?",kw:["Masking","Tokenization","Data minimization","Pseudonymization","Anonymization"],
scenario:"A vendor demo used the word 'de-identified' five times for five different things. The DPO wants each example labelled with the real technique before she answers the vendor.",
question:"Match each example to the privacy-enhancing technique it actually shows.",
left:["On the support screen the card shows ****-****-****-4417","The payment file stores TK-88123 instead of the card number; the mapping sits in a guarded vault","The research file holds only age bands and regions, never birth dates","Each record carries code M-9931; the table linking codes to names is stored separately with strict access","The exported statistics cannot be turned back into individual people by anyone"],
right:["Masking","Tokenization","Data minimization","Pseudonymization","Anonymization"],
sol:[0,1,2,3,4],
expl:"Masking hides part of the value on display. Tokenization swaps the value for a token kept meaningful only inside a vault. Minimization collects fewer fields in the first place. Pseudonymization replaces identifiers with codes while a key still exists. Anonymization is irreversible for everyone. Focus on: is the original retrievable (masking/tokenization/pseudonymization) and by whom — or is it gone for good (anonymization)?",
hint:"Two examples keep a mapping somewhere; one never collected the data at all; one is simply hidden on screen; one is gone forever."},
{id:"m14",th:"MON",type:"logview",title:"DLP queue: first move",kw:["Continuous monitoring","PII","Automated evidence collection","Notice of privacy events"],
scenario:"You monitor the DLP alert queue for Meridian Health Plans. A contractor from vendorpart.example has export activity today. The queue below is the live continuous-monitoring feed.",
question:"Per the privacy policy, what is your FIRST action?",
log:{title:"DLP alert queue — export monitor (today)",lines:[
"09:14:22 INFO  dlp-engine policy=PII-EXPORT-01 user=d.wells@vendorpart.example action=GRANTED file=members_q3.xlsx(1.9GB) dest=webmail",
"09:16:05 WARN  dlp-engine policy=PII-EXPORT-01 user=d.wells@vendorpart.example action=BLOCKED dest=usb policy=PII-USB-01",
"09:18:40 INFO  dlp-engine policy=PII-EXPORT-01 user=d.wells@vendorpart.example action=GRANTED file=members_q3_p2.xlsx(1.4GB) dest=webmail",
"10:02:11 INFO  vpn-gateway user=d.wells@vendorpart.example connected from home-gw-77",
"10:31:02 INFO  dlp-engine user=k.okafor@meridianhp.example action=GRANTED file=claims_template.docx dest=webmail size=40KB",
"11:44:51 INFO  hr-portal ticket CMP-2311 updated: contractor d.wells offboarding scheduled 2026-11-30",
"12:20:17 INFO  dlp-engine daily summary: 42 GRANTED, 3 BLOCKED",
"14:05:33 WARN  dlp-engine policy=PII-EXPORT-01 user=d.wells@vendorpart.example action=GRANTED file=members_q3_p3.xlsx(0.9GB) dest=webmail",
"14:06:01 INFO  case-queue NEW case DLP-9931 opened automatically for policy PII-EXPORT-01",
"14:30:00 INFO  dlp-engine policy=PII-EXPORT-01 vendorpart.example still allowed pending review"]},
opts:["Wait for the Friday access review to decide anything","Email d.wells, ask if the exports were intentional, and wait for the reply","Disable d.wells' export rights now and work case DLP-9931","Delete the three export alerts — the vendor is trusted","Escalate straight to the regulator before opening any case"],
correct:[2],
expl:"Continuous monitoring did its job: several gigabytes of member PII left to a webmail account, three times, and the auto-case DLP-9931 is open. The first move is containment — cut the export path now — then investigate the case; the notification duty comes later, only if a privacy event is confirmed. Waiting for a weekly review or tipping off the user first are classic failures. Focus on: contain, then verify, then decide on notification.",
hint:"A member-PII export to webmail is live exposure. What stops it fastest without destroying evidence?"},
{id:"m15",th:"MON",type:"multi",title:"Is that compliance monitoring?",kw:["Continuous monitoring","Policy attestation tracking","Training completion tracking","Vendor / third-party monitoring","NIST CSF","Automated evidence collection","GRC platform","Self-assessment"],
scenario:"The compliance manager is tidying the yearly plan. Someone pasted eight activities into the 'compliance monitoring' section, but two of them landed there by mistake.",
question:"Select the SIX activities that are genuinely compliance monitoring.",
opts:["Quarterly user access recertification","Monthly policy attestation reminders with completion tracking","Tracking security awareness training completion","Scheduled reassessment of critical vendors","Refreshing the control-to-NIST CSF mapping each quarter","Automated nightly evidence collection into the GRC platform","Running a red-team exercise against production","Containing a live ransomware incident"],
correct:[0,1,2,3,4,5],
expl:"Compliance monitoring proves controls keep working: access recertification, policy attestation tracking, training completion, vendor reassessments, control mapping against NIST CSF, and automated evidence collection into the GRC platform. A red-team exercise is security testing and incident containment is incident response — both valuable, but neither is compliance monitoring. Focus on: monitoring is periodic or continuous PROOF, not attack or response.",
hint:"Which six items produce evidence that a control still works? The other two are attack and response."},
{id:"m16",th:"RPT",type:"qcm",title:"KPI or KRI?",kw:["KRI","KPI","Control drift"],
scenario:"The monthly compliance pack for the board mixes two kinds of metrics and the CFO keeps asking why the numbers never warn about anything. You must label them properly.",
question:"Which of these metrics is a KRI (a key RISK indicator)?",
opts:["Laptops with disk encryption enabled, as a percentage","Security awareness training completion, now at 98%","Policies past their review date — a number that rises first","Average time to close compliance tickets this month"],
correct:2,
expl:"A KRI points at risk BEFORE it becomes an incident — policies drifting past their review date signal that the control framework is going stale. The other three are KPIs: they measure how well a control or process performs today. Focus on: a KRI is a leading, predictive measure; a KPI is a current-performance measure.",
hint:"Which number goes up quietly and warns you that something WILL break, rather than how something IS performing?"},
{id:"m17",th:"RPT",type:"fib",title:"PCI policy blanks",kw:["PCI DSS","Cardholder data (PAN)","Masking","ASV scan","PCI SAQ / AOC / ROC","QSA"],
scenario:"Cobalt Retail Group is rewriting its cardholder data policy. Legal left four blanks and asked you to finish it with the exact compliance terms.",
question:"Fill each blank from the word bank.",
html:"Card systems must never store the {{0}} after authorization. When the full card number is shown on screen, {{1}} must reduce it so staff see only the last digits. An {{2}} vendor must run external scans every {{3}}. After fieldwork, the assessor signed our {{4}}, the report on the assessment.",
blanks:["CVV","masking","ASV","quarter","ROC"],
bank:["CVV","masking","ASV","quarter","ROC","QSA","GDPR"],
expl:"PCI DSS forbids storing the CVV after authorization, requires masking of displayed PANs, and mandates quarterly external scans by an Approved Scanning Vendor. The ROC — Report on Compliance — is the report the assessor signs after fieldwork; the QSA is the person, not the report. GDPR does not belong in a card policy. Focus on: CVV storage is always forbidden after authorization, and know which document the assessor signs.",
hint:"One blank is the 3-digit code, one is the display technique, one is the scan vendor type, one is the frequency, one is the report the assessor signs."},
{id:"m18",th:"RPT",type:"dnd",title:"Evidence to the right audience",kw:["PCI SAQ / AOC / ROC","Attestation","QSA","SOC 2","SOC 2 Type I / Type II","FedRAMP / FISMA","Compliance dashboard","Internal compliance report","ISO 27001 certification & surveillance audits","Evidence collection","External / regulator reporting"],
scenario:"The evidence cabinet at Brightline Bank is a mess: seven documents, six possible audiences. The audit committee asked you to route each document where it actually belongs.",
question:"Drag each document onto the audience it is meant for.",
buckets:["Acquirer / payment brand","Enterprise customers","Federal agency (ATO)","Board of directors","Certification body","OCR (regulator)"],
items:[
{t:"Signed PCI SAQ self-assessment",b:0},
{t:"PCI AOC attestation signed by the QSA",b:0},
{t:"SOC 2 Type II report for customer due diligence",b:1},
{t:"FedRAMP authorization package",b:2},
{t:"Quarterly control KPI compliance dashboard",b:3},
{t:"ISO 27001 audit evidence pack",b:4},
{t:"Risk analysis summary demanded during an OCR audit",b:5}],
expl:"Card evidence (SAQ and the QSA-signed AOC) goes to the acquirer or payment brand. Enterprise customers ask for the SOC 2 Type II during due diligence. Serving US federal agencies requires the FedRAMP authorization package. The board consumes the internal compliance dashboard. The ISO 27001 evidence pack belongs to the certification body's audit, and OCR gets what it demands during an audit. Focus on: the audience is set by the relationship that demands the evidence.",
hint:"Ask: who REQUIRES this document — card rules, a customer, the government, the board, the certifier, or the health regulator?"},
{id:"m19",th:"RPT",type:"qcm",title:"Type I is not enough",kw:["SOC 2 Type I / Type II","Vendor / third-party monitoring","Attestation","Point-in-time audit"],
scenario:"Brightline Bank is onboarding a SaaS vendor. The vendor proudly sends a SOC 2 report that covers the DESIGN of controls at one point in time — nothing about how they operated over the year.",
question:"What should the bank request for assurance across the whole year?",
opts:["Nothing more — Type I design coverage is enough for a year","A SOC 3 marketing summary for the whole year instead","The vendor's latest penetration test report instead","A SOC 2 Type II report testing controls across the whole year"],
correct:3,
expl:"SOC 2 Type I is a point-in-time look at design; Type II samples how controls actually OPERATED over a period, which is what a year of vendor risk needs. A SOC 3 is a short public summary without the detail, and a pen test checks a different thing entirely. Focus on: point-in-time proves design; a period proves operation — pick the report that matches the risk window.",
hint:"Design at a snapshot vs operation over months — which one answers 'did it work all year'?"},
{id:"m20",th:"PRV",type:"clickfind",title:"Fix the retention schedule",kw:["Retention policy","Legal hold","Cardholder data (PAN)","Media sanitization","Data minimization"],
scenario:"Internal audit flagged Cobalt Retail Group's retention schedule table. Some rows quietly break law or policy. Click every row that violates the retention and privacy policy.",
question:"Click every row in the answer list that violates the retention and privacy policy.",
lines:["Payment cards — store CVV for 90 days for dispute handling","Marketing profiles — keep indefinitely while the customer is active","CCTV footage — keep 30 days, then overwrite","Employee files — keep employment + 6 years, then destroy","Access logs — keep 12 months","Customer records deleted on request — keep copies in daily backups beyond the retention policy","Tax records under litigation hold — destroy at year end to save storage"],
correct:[0,1,5,6],
expl:"Four rows break the rules: the CVV may never be stored after authorization (not even for disputes); 'indefinite' marketing retention ignores the retention schedule and minimization; deleted-on-request data must also leave backups once the schedule ends, or backups must age out on policy; and a legal hold beats destruction — records involved in litigation may not be destroyed at year end. The other rows match their schedules. Focus on: retention is a schedule, a legal hold freezes it, and backups are still retention.",
hint:"One row stores a forbidden code, one has no end date, one hides copies in backups, one destroys data it is not allowed to destroy."},
{id:"m21",th:"PRV",type:"order",title:"The notification chain",kw:["Breach notification windows (GDPR 72h / HIPAA 60d)","Notice of privacy events","GDPR"],
scenario:"A privacy event hit Meridian Health Plans last night. The DPO is on a plane and left you the blank process card: 'put the steps in the right order before I land'.",
question:"Order the steps of the breach notification workflow.",
items:["Detect and contain the incident","Assess what personal data and how many people are involved","Notify the DPO and record the facts of the breach","Notify the supervisory authority within 72 hours if there is a risk","Inform affected people without undue delay if the risk is high","Remediate, review lessons learned, update the register"],
expl:"Contain first, then assess the scope, then the DPO records the facts — because the regulator notice within 72 hours must describe what happened, and the people notice (when risk is high) follows the assessment. Remediation and lessons learned close the loop and feed the register. Focus on: nothing is notified before it is contained and assessed; the register keeps the proof.",
hint:"Contain, assess, record, regulator, people, improve — each step feeds the next."},
{id:"m22",th:"PRV",type:"match",title:"Which agreement is this?",kw:["BAA","DPA (data processing agreement)","NDA","SLA","MOU","PHI"],
scenario:"Contracts weekly at Veldt Software: five arrangements, five template folders. The paralegal mixed the tabs; you get to label each engagement with the right agreement.",
question:"Match each engagement to the agreement it needs.",
left:["A pharmacy chain outsources its after-hours call center, which will hear patient details","A payroll provider processes employee data for an EU subsidiary, on written instructions","An incident-response consultant must read breach evidence before signing anything","The monitoring service pledges 15-minute alert response or the month is credited","A hospital and a university agree to explore a shared security research lab"],
right:["BAA","DPA (data processing agreement)","NDA","SLA","MOU"],
sol:[0,1,2,3,4],
expl:"Patient details flowing to an outside service provider need a Business Associate Agreement before any data moves. A processor acting on a controller's written instructions for personal data needs a Data Processing Agreement. The consultant who will read breach evidence signs an NDA first. A response-time promise with a penalty lives in the SLA, and a non-binding plan to explore joint work is an MOU. Focus on: pick the agreement by what flows — health data, processor duties, secrets, service levels, goodwill.",
hint:"Health data, processor duties, secrets, response promises, good intentions — five agreements, five purposes."},
{id:"m23",th:"PRV",type:"branch",title:"A DSAR lands",kw:["Data subject rights (DSAR)","Right to erasure","Data portability","GDPR","CCPA","Consent & lawful basis"],
scenario:"You run the privacy inbox at Meridian Health Plans. A rights request arrived this morning and the DPO is in court all day — you handle the path.",
question:"Walk the request handling. One choice per decision.",
nodes:[
{txt:"Email: 'Send me everything you hold about me, then delete it all.' The sender address matches our member records.",
opts:[
{t:"Verify the requester's identity, log which rights they invoke (access, erasure, portability), then process",ok:true,out:"Good — identity first stops data going to an impostor; logging keeps the response auditable."},
{t:"Reply at once with a full unredacted export to the email in the request",ok:false,out:"Poor — without identity checks you may hand someone's data to a stranger."},
{t:"Ignore it — rights requests are optional in a busy month",ok:false,out:"Poor — a DSAR is a legal right with a clock, not a courtesy."}]},
{txt:"Identity is verified. Which deadline applies, and what if the case turns out to be complex?",
opts:[
{t:"One month from receipt, extendable by two more months for complex cases if you tell the person",ok:true,out:"Good — 30 days under GDPR, plus a told-and-tracked extension for complexity (CCPA runs a similar 45-day clock)."},
{t:"72 hours, like a breach notice",ok:false,out:"Poor — 72 hours is the breach clock, not the rights-request clock."},
{t:"Six months, matching our retention period",ok:false,out:"Poor — retention and response deadlines are different things entirely."}]},
{txt:"The erasure part collides with a legal duty: tax law requires us to keep some of the records.",
opts:[
{t:"Erase what you can; refuse erasure of what the law requires, and explain why in the reply",ok:true,out:"Good — a lawful basis to keep beats erasure for those records, and the person must get the reason."},
{t:"Delete everything, including the tax records",ok:false,out:"Poor — breaking one law to satisfy another is still non-compliance."},
{t:"Refuse the whole request because one part cannot be met",ok:false,out:"Poor — partial refusal with reasons is the compliant path, not a blanket no."}]}],
expl:"A DSAR starts with identity verification and logging of the invoked rights — access, erasure, portability. GDPR gives one month, extendable by two for complexity with notice; CCPA is similar at 45 days. Erasure can be refused where a law requires the data, but only for those records and with a reason. Focus on: verify, clock, then split the request into what must go and what must stay.",
hint:"Identity first, then the right clock, then remember: a lawful basis to keep overrides erasure for exactly those records."},
{id:"m24",th:"PRV",type:"qcm",title:"The HIPAA clock",kw:["HIPAA","Breach notification windows (GDPR 72h / HIPAA 60d)","Notice of privacy events","PHI"],
scenario:"Meridian Health Plans discovered on 3 March that an unencrypted laptop with records of 800 members is gone. The HIPAA breach assessment says notification is required.",
question:"By when must the affected individuals be notified, at the latest?",
opts:["Within 72 hours of discovery","Within 60 days of discovery","Within 30 days of discovery","Within 6 months, at the annual review"],
correct:1,
expl:"HIPAA requires notification to affected individuals without unreasonable delay and no later than 60 days after discovery. The 72-hour figure is the GDPR regulator-notice window — a classic trap. 30 days belongs to other state laws, and waiting for an annual review is far outside the rule. Focus on: 72 hours (GDPR authority) vs 60 days (HIPAA individuals) — learn the pair.",
hint:"One regime says hours to the regulator, another says about two months to the people. This is the people one."},
{id:"m25",th:"RPT",type:"logview",multi:true,title:"Reading the audit report",kw:["Internal vs external audit","ISO/IEC 27001","ISO 27001 certification & surveillance audits","Corrective action plan (CAP)","Loss of certification or license","Increased audit frequency","Audit readiness","Internal compliance report","NIST CSF"],
scenario:"The internal audit team of Meridian Health Plans closed its ISMS cycle. The management report lands next week and the surveillance audit is in spring. Read the findings log and pick every TRUE statement.",
question:"Select ALL statements that are true about this audit.",
log:{title:"Internal audit findings — ISMS cycle 2026 (Meridian Health Plans)",lines:[
"2026-09-08 INFO  internal-audit opened ISMS cycle, scope: all of Meridian Health Plans",
"2026-09-09 WARN  finding F-01 MAJOR: no risk assessment process for new systems in scope",
"2026-09-09 WARN  finding F-02 MAJOR: backup restore never tested in 2 years",
"2026-09-10 WARN  finding F-03 minor: asset register missing 12 laptops",
"2026-09-10 WARN  finding F-04 minor: training completion 88% vs 95% target",
"2026-09-11 WARN  finding F-05 minor: incident response plan contacts outdated",
"2026-09-11 INFO  finding F-06 observation: attach the NIST CSF mapping to the annual report",
"2026-09-12 INFO  internal-audit closed; internal report to management next week"]},
opts:["Two major nonconformities were raised","A major nonconformity can put the ISO 27001 certificate at risk at the next surveillance audit","Minor findings force immediate certificate suspension","An observation needs a corrective action plan within 7 days","This audit was performed by an external certification body"],
correct:[0,1],
expl:"The log shows F-01 and F-02 as MAJOR — two majors is true, and an unresolved major can indeed risk the certificate at the next surveillance visit, often with follow-up audits in between. Minor findings need action but do not suspend a certificate, an observation is advice (no CAP deadline is attached), and this audit was performed by the INTERNAL audit team — the external one is the certification body's. Focus on: internal audit finds, management fixes, the certification body decides on the certificate.",
hint:"Filter the log for MAJOR — how many? And check who performed this audit."},
{id:"m26",th:"MON",type:"dnd",title:"Set the monitoring cadence",kw:["Continuous monitoring","Automated evidence collection","GRC platform","ASV scan","Point-in-time audit","Self-assessment"],
scenario:"Brightline Bank's compliance calendar is being rebuilt. The chief auditor wants every activity on the right cadence so evidence is fresh when it is needed.",
question:"Drag each activity onto how often it should run.",
buckets:["Continuous","Quarterly","Annual"],
items:[
{t:"Automated control monitoring in the GRC platform",b:0},
{t:"Automated nightly evidence collection",b:0},
{t:"ASV vulnerability scans of the external footprint",b:1},
{t:"User access recertification",b:1},
{t:"Enterprise-wide risk self-assessment",b:2},
{t:"Full policy review and re-approval",b:2},
{t:"Point-in-time audit by the certification body",b:2}],
expl:"Continuous monitoring and automated evidence collection run all the time by design. ASV scans and access recertification are quarterly controls. The enterprise risk self-assessment, the full policy review, and the certification body's point-in-time audit are annual events. Focus on: automated proof runs continuously; periodic controls sit on fixed cycles; big judgments happen yearly.",
hint:"Two run every day by automation, two every three months, three once a year."},
{id:"m27",th:"PRV",type:"multi",title:"What can they actually ask for?",kw:["Data subject rights (DSAR)","Right to erasure","Data portability","Opt-in / opt-out","CCPA"],
scenario:"The support desk forwards seven 'rights' demands from customers; the DPO asks you to keep only the rights that GDPR actually grants before the desk answers them.",
question:"Select the FOUR rights that GDPR grants to people.",
opts:["Right of access to their data","Right to rectification of wrong data","Right to erasure in the cases the law allows","Right to data portability","Right to have data kept forever","Right to free premium hosting","Right to skip identity verification"],
correct:[0,1,2,3],
expl:"GDPR grants access, rectification, erasure (when a ground applies) and portability — the right to receive data in a machine-readable format to move to another provider. Data is not kept forever (retention limits do the opposite), hosting is not a privacy right, and identity verification protects the requester too. Note: the right to OPT OUT of the sale of data is CCPA's, not GDPR's. Focus on: the four core rights and the traps dressed as rights.",
hint:"Access, fix, delete, take away — then check which options are invented."},

var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){var r=Math.round(n*100)/100;return Math.abs(r-Math.round(r))<0.005?String(Math.round(r)):r.toFixed(2);}
function norm(s){return String(s==null?"":s).toLowerCase().replace(/\s+/g," ").trim().replace(/[.]+$/,"");}
var S=null,CLOCK=null;
function newState(){return{phase:"intro",order:shuffle(EXERCISES.map(function(_,i){return i;})),idx:0,ans:{},view:{},checked:{},skipped:{},hints:{},hintShown:{},earned:{},revised:{},manual:false,checkPause:false,timeLeft:EXERCISES.length*CFG.secsPerEx,reported:false,reason:"",tot:null,user:"",modal:false,warn:""};}
function mmss(x){var m=Math.floor(x/60),s=x%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function timerFrozen(){return !!(S&&(S.manual||S.checkPause));}
function startClock(){if(CLOCK)clearInterval(CLOCK);CLOCK=setInterval(function(){if(!S||S.phase!=="exam"||S.manual||S.checkPause)return;S.timeLeft--;if(S.timeLeft<=0){S.timeLeft=0;finish("timeout");return;}paintTimer();},1000);}
function paintTimer(){var e=document.getElementById("clock");if(!e||!S)return;e.textContent=mmss(S.timeLeft);var tot=EXERCISES.length*CFG.secsPerEx;e.className="clock"+(S.timeLeft<=tot*0.1?" crit":S.timeLeft<=tot*0.2?" low":"")+(timerFrozen()?" frozen":"");}
function curEx(){return EXERCISES[S.order[S.idx]];}
function themeOf(ex){for(var i=0;i<THEMES.length;i++){if(THEMES[i].id===ex.th)return THEMES[i];}return THEMES[0];}
function ensureState(ex){
 if(!S.view[ex.id]){
  var v={};
  if(ex.type==="qcm"){v.order=shuffle(ex.opts.map(function(_,i){return i;}));}
  if(ex.type==="multi"){v.order=shuffle(ex.opts.map(function(_,i){return i;}));}
  if(ex.type==="logview"){v.order=shuffle(ex.opts.map(function(_,i){return i;}));}
  if(ex.type==="dnd"){v.items=shuffle(ex.items.map(function(_,i){return i;}));}
  if(ex.type==="match"){v.rights=shuffle(ex.right.map(function(_,i){return i;}));}
  if(ex.type==="order"){v.ord=shuffle(ex.items.map(function(_,i){return i;}));}
  if(ex.type==="fib"){v.bank=shuffle(ex.bank.map(function(_,i){return i;}));}
  if(ex.type==="dual"){v.o1=shuffle(ex.parts[0].opts.map(function(_,i){return i;}));v.o2=shuffle(ex.parts[1].opts.map(function(_,i){return i;}));}
  S.view[ex.id]=v;
 }
 if(!S.ans[ex.id]){
  var a={};
  switch(ex.type){
   case"qcm":a.sel=-1;break;
   case"multi":a.sel={};break;
   case"logview":a.sel=ex.multi?{}:-1;break;
   case"dnd":a.place={};a.selItem=-1;break;
   case"match":a.sel=ex.left.map(function(){return -1;});break;
   case"order":a.ord=0;break;
   case"fib":a.fill=ex.blanks.map(function(){return null;});break;
   case"fibtext":a.vals=ex.fields.map(function(){return "";});break;
   case"terminal":a.lines=[];break;
   case"clickfind":a.pick={};break;
   case"branch":a.node=0;a.picks=[];break;
   case"dual":a.sel=[-1,-1];break;
  }
  S.ans[ex.id]=a;
 }
}
function markLog(l){var s=esc(l);
 s=s.replace(/\b(ERROR|ERR|FAIL|FAILED|DENIED|CRITICAL|BLOCKED)\b/g,'<span class="lvl-err">$1</span>');
 s=s.replace(/\b(WARN|WARNING|OVERDUE|EXCEPTION|LATE|RETRY|MISSING|VIOLATION)\b/g,'<span class="lvl-warn">$1</span>');
 s=s.replace(/\b(OK|PASS|PASSED|SUCCESS|GRANTED|REVIEWED|RESOLVED|COMPLETE)\b/g,'<span class="lvl-ok">$1</span>');
 s=s.replace(/^(\d{2}:\d{2}(:\d{2})?)/,'<span class="ts">$1</span>').replace(/^(\d{4}-\d{2}-\d{2})/,'<span class="ts">$1</span>');
 return s;}
/* ---------- grading ---------- */
function gradeMulti(ex,a){var parts=[],ok=0;var corr=ex.correct;
 ex.opts.forEach(function(t,i){
  var isC=corr.indexOf(i)>=0,picked=!!a.sel[i];
  if(picked&&isC){ok++;parts.push({lab:t,st:"ok"});}
  else if(picked&&!isC){parts.push({lab:t,st:"bad"});}
  else if(!picked&&isC){parts.push({lab:t,st:"miss"});}
 });
 return{frac:corr.length?ok/corr.length:0,parts:parts};}
function grade(ex){var a=S.ans[ex.id],v=S.view[ex.id],parts=[],ok=0,n=1,i,r;
 switch(ex.type){
 case"qcm":n=1;r=a.sel===ex.correct;parts.push({lab:r?"Your choice was correct.":"Your choice was wrong.",st:r?"ok":"bad"});if(r)ok=1;return{frac:ok/n,parts:parts};
 case"multi":r=gradeMulti(ex,a);return{frac:r.frac,parts:r.parts};
 case"logview":
  if(ex.multi){r=gradeMulti({opts:ex.opts,correct:ex.correct},a);return{frac:r.frac,parts:r.parts};}
  n=1;r=a.sel===ex.correct[0];parts.push({lab:r?"Your choice was correct.":"Your choice was wrong.",st:r?"ok":"bad"});if(r)ok=1;return{frac:ok/n,parts:parts};
 case"dnd":n=ex.items.length;
  ex.items.forEach(function(it,i2){var p=a.place[i2],has=(p!==undefined&&p!==null&&p>=0);
   if(p===it.b){ok++;parts.push({lab:it.t+" → "+ex.buckets[it.b],st:"ok"});}
   else if(has){parts.push({lab:it.t+" → "+ex.buckets[p],st:"bad"});}
   else{parts.push({lab:it.t+" (not placed)",st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"match":n=ex.left.length;
  ex.left.forEach(function(l,i2){var s=a.sel[i2];
   if(s===ex.sol[i2]){ok++;parts.push({lab:l+" → "+ex.right[s],st:"ok"});}
   else if(s<0){parts.push({lab:l+" (no match chosen)",st:"miss"});}
   else{parts.push({lab:l+" → "+ex.right[s],st:"bad"});}});
  return{frac:ok/n,parts:parts};
 case"order":n=ex.items.length;
  for(i=0;i<n;i++){if(v.ord[i]===i){ok++;parts.push({lab:"Position "+(i+1)+": "+ex.items[i],st:"ok"});}else{parts.push({lab:"Position "+(i+1)+": you placed "+ex.items[v.ord[i]],st:"bad"});}}
  return{frac:ok/n,parts:parts};
 case"fib":n=ex.blanks.length;
  ex.blanks.forEach(function(w,i2){var f=a.fill[i2];
   if(f===w){ok++;parts.push({lab:"Blank "+(i2+1)+": "+w,st:"ok"});}
   else if(f){parts.push({lab:"Blank "+(i2+1)+": you wrote "+f,st:"bad"});}
   else{parts.push({lab:"Blank "+(i2+1)+" (empty)",st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"fibtext":n=ex.fields.length;
  ex.fields.forEach(function(f,i2){var val=norm(a.vals[i2]),good=f.accept.some(function(x){return norm(x)===val;});
   if(val&&good){ok++;parts.push({lab:f.lab+": "+a.vals[i2],st:"ok"});}
   else if(val){parts.push({lab:f.lab+": "+a.vals[i2],st:"bad"});}
   else{parts.push({lab:f.lab+" (empty)",st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"terminal":n=1;var last=(a.lines&&a.lines.length)?a.lines[a.lines.length-1]:"";var good=false;
  if(ex.acceptedAll){good=ex.acceptedAll.every(function(rx){return new RegExp(rx,"i").test(last);});}
  else{good=(ex.acceptedAny||[]).some(function(rx){return new RegExp(rx,"i").test(last);});}
  parts.push({lab:good?"Command accepted.":"Command not correct: "+(last||"(nothing typed)"),st:good?"ok":"bad"});if(good)ok=1;return{frac:ok/n,parts:parts};
 case"clickfind":n=ex.correct.length;
  ex.lines.forEach(function(l,i2){var isC=ex.correct.indexOf(i2)>=0,picked=!!a.pick[i2];
   if(isC&&picked){ok++;parts.push({lab:l,st:"ok"});}
   else if(!isC&&picked){parts.push({lab:l,st:"bad"});}
   else if(isC&&!picked){parts.push({lab:l,st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"branch":n=ex.nodes.length;
  ex.nodes.forEach(function(nd,i2){var p=a.picks[i2];
   if(p===undefined||p===null){parts.push({lab:"Decision "+(i2+1)+" (not made)",st:"miss"});}
   else if(nd.opts[p].ok){ok++;parts.push({lab:"Decision "+(i2+1)+": "+nd.opts[p].t,st:"ok"});}
   else{parts.push({lab:"Decision "+(i2+1)+": "+nd.opts[p].t,st:"bad"});}});
  return{frac:ok/n,parts:parts};
 case"dual":n=2;
  ex.parts.forEach(function(p,i2){var s=a.sel[i2];
   if(s===p.correct){ok++;parts.push({lab:"Part "+(i2+1)+" correct.",st:"ok"});}
   else if(s<0){parts.push({lab:"Part "+(i2+1)+" (not answered)",st:"miss"});}
   else{parts.push({lab:"Part "+(i2+1)+" wrong: "+p.opts[s],st:"bad"});}});
  return{frac:ok/n,parts:parts};
 }
 return{frac:0,parts:[]};}

function buildFeedback(ex){var g=grade(ex);var d=h("div","fb");
 var en=S.earned[ex.id]||0;var pen=S.hints[ex.id]?0.1*S.hints[ex.id]:0;
 var el=h("div","earnline");
 el.innerHTML='Earned: <span class="'+(en>0.99?"ok-t":en>0?"warn-t":"bad-t")+'">'+fmt(en)+' / 1 pt</span>'+(pen>0?' <span class="dim">(includes hint penalty of -'+fmt(pen)+')</span>':"");
 d.appendChild(el);
 g.parts.forEach(function(p){
  var tag=p.st==="ok"?'<span class="tag ok-t">✓ CORRECT</span>':p.st==="bad"?'<span class="tag bad-t">✕ WRONG</span>':'<span class="tag warn-t">○ MISSED</span>';
  var it=h("div","fbitem");it.innerHTML=tag+'<span>'+esc(p.lab)+'</span>';d.appendChild(it);});

/* ---------- actions ---------- */
function doCheck(){var ex=curEx();if(ex.type==="branch"&&S.ans[ex.id].picks.length<ex.nodes.length)return;
 var g=grade(ex);var pen=0.1*(S.hints[ex.id]||0);
 S.earned[ex.id]=Math.max(0,Math.round((g.frac-pen)*100)/100);
 S.checked[ex.id]=true;S.skipped[ex.id]=false;S.revised[ex.id]=false;S.checkPause=true;S.warn="";
 render();}
function doSkip(){var id=curEx().id;if(!S.checked[id])S.skipped[id]=true;go(1);}
function focusTitle(){var t=document.querySelector("#excard .ttl");if(t){t.setAttribute("tabindex","-1");try{t.focus();}catch(e){}}}
function go(d){S.idx=Math.max(0,Math.min(EXERCISES.length-1,S.idx+d));S.checkPause=false;S.warn="";window.scrollTo(0,0);render();focusTitle();}
function navTo(i){S.idx=i;S.checkPause=false;S.warn="";window.scrollTo(0,0);render();focusTitle();}
function renderCard(){render();}
function askSubmit(){var answered=Object.keys(S.checked).length;
 if(answered===0){S.warn="Answer at least one exercise before submitting — press Check on an exercise to record your answer.";render();return;}
 S.modal=true;S.warn="";render();}
function confirmSubmit(){S.modal=false;finish("submit");}
function cancelSubmit(){S.modal=false;render();}
function finish(reason){if(!S||S.phase!=="exam")return;S.reason=reason;
 var ids=S.order.filter(function(i){return S.checked[EXERCISES[i].id];});
 var earned=0;ids.forEach(function(i){earned+=(S.earned[EXERCISES[i].id]||0);});
 earned=Math.round(earned*100)/100;
 var possible=ids.length,scoreR=Math.round(earned);
 var percent=possible?Math.round(scoreR/possible*100):0;
 S.tot={answered:ids,earned:earned,possible:possible,scoreR:scoreR,percent:percent,passed:percent>=CFG.passMark};
 S.phase="results";S.manual=false;S.checkPause=false;S.modal=false;
 if(CLOCK)clearInterval(CLOCK);
 reportScore();render();}
function reportScore(){if(!S||S.reported||!S.tot)return;S.reported=true;var t=S.tot;
 try{parent.postMessage({type:"CYBERPULSE_SCORE",topicId:CFG.topicId,score:t.scoreR,total:t.possible,percent:t.percent,passed:t.percent>=CFG.passMark},location.origin);}catch(e){}}
/* ---------- results ---------- */
function statusOf(exId){if(S.checked[exId]){var e=S.earned[exId]||0;return e>0.99?{cls:"ok",word:"FULL"}:e>0?{cls:"warn",word:"PARTIAL"}:{cls:"bad",word:"ZERO"};}return{cls:"warn",word:"SKIPPED"};}
function yourAnswer(ex){if(!S.ans[ex.id])return["(not answered — excluded from scoring)"];var a=S.ans[ex.id],v=S.view[ex.id],out=[];
 switch(ex.type){
 case"qcm":out.push(a.sel>=0?ex.opts[a.sel]:"(no choice)");break;
 case"logview":if(ex.multi){out.push(Object.keys(a.sel).length?Object.keys(a.sel).map(function(k){return ex.opts[k];}).join(" | "):"(none selected)");}else{out.push(a.sel>=0?ex.opts[a.sel]:"(no choice)");}break;
 case"multi":out.push(Object.keys(a.sel).length?Object.keys(a.sel).map(function(k){return ex.opts[k];}).join(" | "):"(none selected)");break;
 case"dnd":ex.items.forEach(function(it,i){out.push(it.t+" → "+(a.place[i]>=0?ex.buckets[a.place[i]]:"(not placed)"));});break;
 case"match":ex.left.forEach(function(l,i){out.push(l+" → "+(a.sel[i]>=0?ex.right[a.sel[i]]:"(no match)"));});break;
 case"order":v.ord.forEach(function(ii,p){out.push((p+1)+". "+ex.items[ii]);});break;
 case"fib":a.fill.forEach(function(f,i){out.push("Blank "+(i+1)+": "+(f||"(empty)"));});break;
 case"fibtext":ex.fields.forEach(function(f,i){out.push(f.lab+": "+(a.vals[i]||"(empty)"));});break;
 case"terminal":out.push(a.lines.length?a.lines[a.lines.length-1]:"(nothing typed)");break;
 case"clickfind":var pk=Object.keys(a.pick).map(function(k){return parseInt(k,10);});out.push(pk.length?pk.map(function(i){return "line "+(i+1);}).join(", "):"(none clicked)");break;
 case"branch":a.picks.forEach(function(p,i){out.push("Decision "+(i+1)+": "+ex.nodes[i].opts[p].t);});break;
 case"dual":ex.parts.forEach(function(p,i){out.push("Part "+(i+1)+": "+(a.sel[i]>=0?p.opts[a.sel[i]]:"(none)"));});break;
 }
 return out;}
function answerKey(ex){var out=[];
 switch(ex.type){
 case"qcm":out.push(ex.opts[ex.correct]);break;
 case"logview":(ex.multi?ex.correct:[ex.correct[0]]).forEach(function(i){out.push(ex.opts[i]);});break;
 case"multi":ex.correct.forEach(function(i){out.push(ex.opts[i]);});break;
 case"dnd":ex.items.forEach(function(it){out.push(it.t+" → "+ex.buckets[it.b]);});break;
 case"match":ex.left.forEach(function(l,i){out.push(l+" → "+ex.right[ex.sol[i]]);});break;
 case"order":ex.items.forEach(function(it,i){out.push((i+1)+". "+it);});break;
 case"fib":ex.blanks.forEach(function(w,i){out.push("Blank "+(i+1)+": "+w);});break;
 case"fibtext":ex.fields.forEach(function(f){out.push(f.lab+": "+f.accept.join(" / "));});break;
 case"terminal":out.push("Example of an accepted command: "+ex.sample);break;
 case"clickfind":ex.correct.forEach(function(i){out.push("line "+(i+1)+": "+ex.lines[i]);});break;
 case"branch":ex.nodes.forEach(function(n,i){var ok=n.opts.filter(function(o){return o.ok;})[0];out.push("Decision "+(i+1)+": "+ok.t);});break;
 case"dual":ex.parts.forEach(function(p,i){out.push("Part "+(i+1)+": "+p.opts[p.correct]);});break;
 }
 return out;}
function renderResults(){var t=S.tot;var w=h("div");
 w.innerHTML='<div class="topbar"><div class="t">CompTIA Security+ (SY0-701) · 5.4 Security compliance · '+sevBadge()+'</div><div class="r"><span class="chip">'+(S.reason==="timeout"?"Time is up — exam auto-submitted":"Exam submitted")+'</span></div></div>'
 +'<div class="bigscore"><div class="pct">'+t.percent+'%</div><div class="statline">Score: '+t.scoreR+' of '+t.possible+' answered exercises (points are partial-aware: '+fmt(t.earned)+' raw points, rounded for the pass mark)</div></div>';
 if(t.passed){w.appendChild(h("div","cert",'<div class="t1">✓ PASSED</div><p>You reached the '+CFG.passMark+'% pass mark on Chapter 5.4 — Security compliance ('+CFG.sevLabel+').</p><p class="dim">Credit recorded for: <b>'+esc(S.user||"Candidate")+'</b></p>'));}
 else{w.appendChild(h("div","failyou",'<div class="t1">✕ NOT PASSED</div><p>You scored '+t.percent+'%. The pass mark is '+CFG.passMark+'%. You must retake this exam.</p><p class="dim">Read the report below, focus on the themes with the lowest scores, then press Retake Exam.</p>'));}
 var sk=EXERCISES.map(function(e,i){return{i:i,e:e};}).filter(function(p){return !S.checked[p.e.id];});
 if(sk.length){var sp=h("div","panel");sp.innerHTML='<h2>Skipped / not answered — excluded from scoring</h2><p class="dim">These '+sk.length+' exercise(s) were skipped or never checked. They are NOT counted in your score or in the maximum.</p>'+sk.map(function(p){return '<span class="chip warn">Ex '+(S.order.indexOf(p.i)+1)+': '+esc(p.e.title)+'</span>';}).join("");w.appendChild(sp);}
 var themes=THEMES.map(function(t){var exs=EXERCISES.map(function(e,i){return{e:e,i:i};}).filter(function(p){return p.e.th===t.id&&S.checked[p.e.id];});
  var mx=exs.length,er=exs.reduce(function(s,p){return s+(S.earned[p.e.id]||0);},0);return{n:t.name,r:mx?er/mx:1};}).sort(function(a,b){return a.r-b.r;});
 if(!t.passed){var rev=h("div","panel");rev.innerHTML='<h2>What to review first</h2>'+themes.slice(0,3).map(function(t2){return '<p><b>'+esc(t2.n)+'</b> — '+Math.round(t2.r*100)+'% of available points earned here.</p>';}).join("");w.appendChild(rev);}
 var rep=h("div","panel");rep.innerHTML='<h2>Per-exercise report</h2>';
 S.order.forEach(function(ei,pos){var e=EXERCISES[ei];var st2=statusOf(e.id);
  var det=h("details","repitem");
  det.innerHTML='<summary><span class="chip '+st2.cls+'">'+st2.word+'</span> Ex '+(pos+1)+' — '+esc(e.title)+' <span class="dim">'+(S.checked[e.id]?(fmt(S.earned[e.id]||0)+" / 1 pt"):"not counted")+'</span></summary>'
  +'<div class="body"><div class="kv"><span class="k">Your answer:</span>'+(yourAnswer(e).map(esc).join("<br>")||"—")+'</div>'
  +'<div class="kv"><span class="k">Correct:</span>'+answerKey(e).map(esc).join("<br>")+'</div>'
  +'<div class="expl"><span class="lab">EXPLANATION</span>'+e.expl+'</div></div>';
  rep.appendChild(det);});
 w.appendChild(rep);
 var row=h("div","acts");
 var rb=h("button","primary");rb.textContent="Retake exam";rb.addEventListener("click",function(){S=newState();render();});row.appendChild(rb);
 w.appendChild(row);
 app.appendChild(w);}
/* ---------- modal ---------- */
function renderModal(){var m=h("div","modal");
 var answered=Object.keys(S.checked).length;
 var skipped=EXERCISES.filter(function(e){return !S.checked[e.id];}).length;
 m.innerHTML='<div class="panel"><h2>Submit this attempt?</h2><p>'+answered+' exercise(s) answered and checked. '+skipped+' will be excluded from scoring (skipped or never answered).</p><p class="dim">After submitting you see the full report and the pass / fail verdict.</p><div class="acts"><button class="primary" id="m-yes">Submit now</button><button id="m-no">Keep working</button></div></div>';
 m.querySelector("#m-yes").addEventListener("click",confirmSubmit);
 m.querySelector("#m-no").addEventListener("click",cancelSubmit);
 app.appendChild(m);}
var _origRender=render;
render=function(){_origRender();if(S&&S.phase==="exam"&&S.modal)renderModal();};
/* ---------- handshake + boot ---------- */
window.addEventListener("message",function(ev){var d=ev.data;if(!d)return;
 if(d.type==="CYBERPULSE_INIT"||d.type==="CYBERMASTERY_INIT"){S.user=d.username||"";var u=document.getElementById("whoami");if(u&&S.user)u.innerHTML='<span class="chip ok">Candidate: '+esc(S.user)+'</span>';}});
S=newState();render();
window.__cm={getS:function(){return S;},setTime:function(t){if(S){S.timeLeft=t;paintTimer();}},finish:finish,cfg:CFG,EX:EXERCISES,THEMES:THEMES,
 coverage:function(){var have={};EXERCISES.forEach(function(e){(e.kw||[]).forEach(function(k){have[k]=1;});});var miss=[];
  THEMES.forEach(function(t){t.kws.forEach(function(k){if(!have[k])miss.push(t.id+": "+k);});});return miss;}};
</script>
