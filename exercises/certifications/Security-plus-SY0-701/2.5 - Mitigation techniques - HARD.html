window.EXAM_QUESTIONS = [{"id":"H01","type":"spot","theme":"Segmentation and isolation","points":12,"scenario":"The visitor season starts next week, and you own the review of the guest network rule set on the core switch. The access list was written by an engineer who left the company, and the guest network is only meant to reach the web and the name servers.","question":"Click the two rules that must be corrected or removed before the review can be signed off.","art":{"title":"extended access list GUEST-IN - core switch - last edited by j.whitfield","kind":"code","pick":true,"lines":["ip access-list extended GUEST-IN"," permit ip any any"," permit tcp 10[.]40[.]0[.]0 0[.]0[.]255[.]0 any eq 445"," deny   tcp any any eq 23"," deny   tcp any any eq 3389"," permit tcp 10[.]40[.]0[.]0 0[.]0[.]255[.]0 any eq 443"," permit udp 10[.]40[.]0[.]0 0[.]0[.]255[.]0 any eq 53"," deny   ip any any"]},"bad":[1,2],"whyEach":["The list header is required and is not a finding.","This is the first finding. A permit for every protocol from every source to every destination runs before the rest of the list, so the deny at the bottom and the host list above it never control anything. A guest network with a rule like this is an open door with extra paperwork.","This is the second finding. The guest subnet may open file sharing to any host, which puts the guest network one hop away from the server shares. Nothing in the guest service needs that port.","Blocking Telnet on a guest network is correct and should stay.","Blocking Remote Desktop is correct and should stay.","Web access is the service the guests are meant to have, so this rule stands.","Name resolution is needed for the web to work, so this rule stands.","The default deny at the end is exactly right, and it is also powerless while rule 2 sits above it."],"why":"An access list is read from top to bottom and the first match wins, so a permit for everything at the top silently removes every control below it. The file share rule is a second, quieter problem: it lets a visitor network reach the servers. The fix is to delete the open rule, delete the file sharing rule, and keep the small set of ports the guest service really uses above the default deny. The open rule removes least privilege in one line, and the file share rule breaks both microsegmentation and disabling unused ports and protocols.","hint":"Order matters in an access list, and so does the number of services a visitor network may reach.","kw":["access control list (ACL)","least privilege","network segmentation","microsegmentation","disabling unused ports and protocols"]},{"id":"H02","type":"branch","theme":"Hardening techniques","points":12,"scenario":"At 02:14 the endpoint console raises a critical alert on SQL-01: a signed binary from the backup vendor ran with SYSTEM rights and wrote a 4 GB file to the temporary volume. The change calendar shows CR-2291, an approved backup performance test, open from 01:00 to 04:00 tonight, and the ticket lists SQL-01 as the test host.","question":"Work through the alert, one decision at a time.","steps":[{"sit":"The alert is two minutes old and the test window is still open. What is your first action?","opts":["Isolate SQL-01 with endpoint containment straight away","Verify the signature, the change record and the parent process first","Close the alert because the binary carries a vendor signature","Escalate to the on call manager and wait at the console"],"correct":1,"res":["Containment would cut a production database server off the network in the middle of an approved window and stop a test the business asked for.","Three facts decide this alert: the signature matches the expected publisher, the change record covers this host in this hour, and the parent process is the backup agent and not a document or a script.","A signature alone is not a verdict. Certificates get stolen, and approval covers only the recorded work.","Escalation adds no information, and the window keeps running while you wait."]},{"sit":"The signature is valid, the record covers SQL-01 from 01:00 to 04:00, and the parent process is the backup agent service. The written file is a copy of the database memory. What is the correct verdict and next step?","opts":["Authorised activity. Record the evidence, flag that a memory tool is allowed here, and note a detection tuning item","Malicious activity. Isolate the host and open a full incident","Authorised activity. Delete the memory file so the data cannot leak","Unauthorised activity. Stop the backup agent service on the host"],"correct":0,"res":["The activity matches an approved record and a valid signature, so it closes as authorised with the evidence attached. The review still records the real point: this tool can copy secrets out of memory, which is exactly what an attacker would do.","Nothing in the evidence supports an incident, and isolating a production database during an approved window has a direct business cost.","Deleting the file destroys both the test output and the evidence you just collected.","Stopping the service ends the approved test and leaves the database without its backup agent."]},{"sit":"The review asks what would reduce the chance of a real attack hiding inside this kind of activity.","opts":["Run the tool only from the approved jump host, log its hash, and alert when it runs outside the window","Block the tool on every host and accept the backup failures","Ask the vendor to send an email before each backup run","Move the backup agent onto a domain administrator account so it runs faster"],"correct":0,"res":["Restricting the tool to the jump host and alerting on it outside the window keeps the approved work and catches the copycat use.","Blocking it breaks the approved process and pushes the team towards an unsupervised tool.","An email cannot be enforced and is not a control.","Domain administrator rights would turn one compromised agent into a domain compromise."]}],"why":"This alert looks like a credential theft tool, and the fastest reaction would be to isolate the host. The evidence says otherwise: an approved change record, a valid vendor signature and the expected parent process make it authorised activity. The expert move closes it as authorised with evidence and then improves detection, so the same tool outside the window raises an alert instead of sitting in a long list of closed tickets. Containment would have been isolation, and refusing a tool that can read memory is least privilege.","hint":"Check what was approved, who signed the file and who started it before you cut a production server off the network.","kw":["endpoint detection and response (EDR)","isolation","change management","jump box / bastion host","least privilege"]},{"id":"H03","type":"fill","theme":"Segmentation and isolation","points":10,"scenario":"The platform team is replacing its flat application network with a rule set that names every allowed flow. You are asked to describe the design in the architecture note, using the terms the team must agree on.","question":"Choose the word or phrase that completes each gap in the architecture note.","parts":["The rule set between the application tiers begins with a ",{"b":0}," rule, so every flow must be named before it works. Each workload receives only the ports its own role needs, which follows ",{"b":1},". Rather than separating two large subnets only, the team writes a rule set for every workload, which is ",{"b":2},". The database tier is then placed on a segment that no user network can reach, which is classic ",{"b":3},"."],"answers":["deny by default","least privilege","microsegmentation","network segmentation"],"extras":["port mirroring","a flat network design","perimeter only filtering"],"why":"A deny by default rule set means that nothing works until someone names it, which makes every open flow a decision rather than an accident. Least privilege keeps each workload to the ports its role needs, microsegmentation applies that idea workload by workload instead of subnet by subnet, and the database on its own unreachable segment is network segmentation in its simplest form. Each workload rule is written as an access control list, and the segment no user VLAN can reach is what a VLAN is for.","hint":"One gap is the rule at the top, one is about ports, one is about the size of the boundary, one is about the segment the data sits on.","kw":["microsegmentation","least privilege","network segmentation","access control list (ACL)","VLAN"]},{"id":"H04","type":"order","theme":"Segmentation and isolation","points":10,"scenario":"A workstation in the finance team is confirmed as compromised and the incident lead hands the host to you. The business wants the machine back quickly, and the forensic team will review your work, so the order of your actions matters as much as the actions themselves.","question":"Put the steps in the order they must happen.","items":["Confirm with the incident lead that the host is compromised and that you may work on it","Isolate the host from the network with the endpoint agent, leaving the agent channel open","Keep the host powered on so the memory contents survive","Capture the memory image and the live network connections","Image the disk for the forensic record","Rebuild the host from the approved golden image and restore clean data"],"why":"Isolation stops the spread while the endpoint agent keeps its own channel, which is why you never simply pull the power. Powering the host down would destroy the memory that holds running code, keys and open connections, so memory is captured before the disk. The rebuild comes last and only from a known good image, because a cleaned host cannot be trusted. The isolation step is done with the endpoint agent, which is the EDR console that keeps its own management channel open while the host is cut off.","hint":"Stop the spread, keep the host alive, take the fragile evidence first, and only then put a trusted build back.","kw":["isolation","endpoint detection and response (EDR)","golden image","network segmentation"]},{"id":"H05","type":"mcq","multi":false,"theme":"Configuration enforcement","points":10,"scenario":"A monitoring alert says that a security setting on host APP-14 changed at 03:12 on Sunday. The change calendar shows an approved maintenance window for that host from 02:00 to 04:00, a build pipeline that redeploys the application tier every Sunday at 03:00, and an open approved exception for one legacy setting that expires in June. All of these arrive through Group Policy or through the pipeline.","question":"Which single fact would prove that this is configuration drift and not an approved change?","opts":["The new value is exactly the kind the pipeline always deploys to that tier","The new value matches no baseline, no pipeline and no open exception","The change happened inside the approved maintenance window","The host was redeployed by the pipeline earlier the same night"],"correct":[1],"whyEach":["A value that the pipeline always deploys is expected, so this points to an approved change.","Correct. Drift is a setting that no approved source explains. If the baseline does not contain it, no pipeline produces it and no exception covers it, then something or someone else changed it.","A window without an approved record is a window, not a permission. On its own it does not explain the value.","A pipeline run explains changes the pipeline makes, and it says nothing about this setting."],"why":"Drift is defined by what the approved sources allow, not by the clock. A maintenance window makes a change possible and does not make it approved, and a pipeline run only explains the settings the pipeline owns. The proof of drift is that no baseline, no pipeline and no open exception accounts for the new value. The pipeline that redeploys the tier is infrastructure as code, which is why its output never counts as drift.","hint":"Compare the new value with every approved source, and remember that a window is not an approval.","kw":["configuration drift","secure baseline","infrastructure as code (IaC)","Group Policy","change management"]},{"id":"H06","type":"match","theme":"Hardening techniques","points":10,"scenario":"A penetration test report lists the techniques that worked. You must pair each missing or weakened control with the technique it allowed, so the remediation plan explains itself to the business.","question":"Match each weak or missing control with the technique it allowed.","pairs":[["SMB signing left switched off on the file servers","Relay of authentication to reach another host"],["One shared local administrator password on every build","Pass the hash movement between workstations"],["Macros in documents from the internet left unblocked","A file that runs a payload after one click"],["Name resolution protocols left enabled on the user network","Credential capture by whichever host answers first"],["End of life firmware on the management controller","An implant that starts below the operating system"],["No file integrity monitoring on the web servers","A web shell that survives a restart"]],"why":"Each weak control leaves one specific technique available, and naming the pair is what makes a remediation plan testable. Without signing, file share authentication can be relayed, and one shared local password means one stolen hash opens many hosts. Unblocked macros turn a document into a program, and free name resolution lets a rogue host collect credentials. Firmware below the operating system needs measured boot to be caught, and a web shell is found by watching the files it changes. The last three pairs are attack surface reduction: macro blocking, disabling LLMNR and NetBIOS name resolution, and taking away the shared local rights that make one stolen hash so useful. Removing that shared right is least privilege applied to local accounts.","hint":"For each technique, ask which single control would have made it fail.","kw":["SMB signing","least privilege","macro blocking","disable LLMNR / NetBIOS","secure boot","file integrity monitoring (FIM)","attack surface reduction"]},{"id":"H07","type":"spot","theme":"Access control and least privilege","points":12,"scenario":"The monitoring team flags an unusual early morning session on the build server. You read the log for the night of 14 May and must point at the two lines that prove an attacker created a way back in rather than simply logging in.","question":"Click the two lines that prove a new way back into the host was created.","art":{"title":"auth.log - build-01 - 2025-05-14 to 2025-05-15","kind":"log","pick":true,"lines":["2025-05-14T21:02:11Z sshd[3312]: Failed password for root from 10[.]88[.]12[.]7 port 44210 ssh2","2025-05-14T21:02:40Z sshd[3315]: Failed password for root from 10[.]88[.]12[.]7 port 44218 ssh2","2025-05-14T21:05:02Z sshd[3320]: Accepted publickey for d.ihara from 10[.]30[.]4[.]18 port 39002 ssh2","2025-05-14T21:31:44Z sshd[3402]: Accepted publickey for d.ihara from 10[.]30[.]4[.]18 port 39120 ssh2","2025-05-14T21:31:45Z sudo: d.ihara : TTY=pts/0 ; PWD=/home/d.ihara ; USER=root ; COMMAND=/usr/bin/tee -a /root/.ssh/authorized_keys","2025-05-14T21:33:10Z sshd[3410]: Accepted publickey for root from 10[.]30[.]4[.]18 port 39144 ssh2","2025-05-15T02:00:00Z CRON[3601]: (root) CMD (/usr/local/bin/nightly-report.sh)","2025-05-15T06:12:22Z sshd[3702]: Accepted publickey for d.ihara from 10[.]30[.]4[.]18 port 40222 ssh2"]},"bad":[4,5],"whyEach":["A failed root login from an outside address is noise here, and it belongs to a different problem.","A second failed root login from the same outside address. Still no success.","A normal key based login for a named engineer at the start of her session. This is expected.","A second login for the same engineer on the same host. Two sessions are normal during maintenance work.","This is the first half of the proof. The engineer account wrote into the root account key file, which is how an attacker, or a person with a stolen session, adds a permanent way back in.","This is the second half. Root logged in with a key from the same address moments later, which means the key that was just added works and root login by key is allowed.","The nightly job that runs as root every morning at 02:00. This is expected on this host.","A routine login the next morning by the same engineer. It is not evidence of a new way in."],"why":"A single successful login is not persistence. A new way back in is created when a key is written into the root key file and then used to log in as root, which is exactly what the last two flagged lines show. The rest of the log is a mix of outside noise and normal named activity, and the fix is to disallow root login altogether and to alert on writes into the key files. The controls are SSH key-only authentication with root login disabled, a privileged access management check on who may hold a key, and an access review that notices a new key.","hint":"Persistence needs a change plus a use of that change, not just a successful sign-in.","kw":["SSH key-only authentication","least privilege","privileged access management (PAM)","access review"]},{"id":"H08","type":"branch","theme":"Access control and least privilege","points":12,"scenario":"The internal audit of the supplier payment process finds that one senior accountant holds the supplier creation role and the payment approval role in the ERP, and he is also the only person who can change bank details. He says he has never combined the roles and that his team of three is too small for more separation.","question":"Handle the finding, one decision at a time.","steps":[{"sit":"What is the correct first action on this finding?","opts":["Treat it as a control failure, review his activity, and remove one of the roles","Accept the explanation and record it as a low risk because nothing has happened","Ask for a written promise that he will not use both roles in the same process","Give a second accountant the same combination so the work is shared"],"correct":0,"res":["The risk is the ability to complete a payment from start to finish, so the activity review tells you whether it has been used and splitting the roles removes the ability.","Fraud controls cannot rely on intention, and history is not a control.","A written promise cannot be tested and removes nothing.","A second person with the same rights doubles the exposure instead of removing it."]},{"sit":"His activity review is clean, and the team really has only three people. What is the best compensating approach?","opts":["Keep the roles apart, and send every bank detail change to a second approver outside the team with a log entry","Let him keep both roles and send a monthly report of his actions to the manager","Let him keep both roles and shorten the password lifetime for his account","Let him keep both roles and ask the ERP vendor to watch the account"],"correct":0,"res":["Separation of duties stays intact, and a second pair of eyes plus a log entry covers the small team. The control is named, owned and testable.","A monthly report tells you about a loss after it has happened.","Password lifetime has no effect on what a valid session may do.","The vendor has no role in your internal control and cannot enforce it."]},{"sit":"The audit asks for proof that the control is now real. What do you provide?","opts":["The before and after role export, the approval, and a quarterly review that shows the roles stayed apart","A signed statement from the accountant that he understands the rules","A copy of the policy section about separation of duties","A note in the audit file that explains the small team size"],"correct":0,"res":["The export shows the change, the approval shows who accepted it, and the later review shows that it is checked again.","A statement shows understanding, not enforcement.","The policy states the intent and is not evidence that the roles changed.","A note explains a difficulty and proves nothing."]}],"why":"Separation of duties is about what one account is able to do, not about what its owner intends to do. The first act is therefore to remove the ability and to check whether it was used, and where a small team makes full separation impossible, a named and testable compensating control takes its place. Evidence of control is a before and after state plus a later review, not a promise or a policy copy. The role split is role based access control under least privilege, and the vaulted second approval is the privileged access management control.","hint":"Remove the ability first, then cover the small team with a control you can test.","kw":["separation of duties","least privilege","role-based access control (RBAC)","access review","privileged access management (PAM)"]},{"id":"H09","type":"spot","theme":"Segmentation and isolation","points":12,"scenario":"A log shipping pod is due to be deployed on the shared cluster. The cluster hosts workloads from four business units, and the platform standard states that a pod may not reach the node or the other tenants. You must check the submitted specification before it goes to the platform team.","question":"Click the two lines that break pod isolation and must be removed.","art":{"title":"pod specification - log-shipper - submitted by the observability team","kind":"code","pick":true,"lines":["kind: Pod","metadata:","  name: log-shipper","spec:","  containers:","    - name: shipper","      image: registry.local/log-shipper:1.9.2","      securityContext:","        privileged: true","      volumeMounts:","        - mountPath: /var/run/docker.sock","  volumes:","    - name: sock","      hostPath:","        path: /var/run/docker.sock"]},"bad":[8,14],"whyEach":["The object kind is standard.","The metadata header is required by the format.","The pod name is fine.","The specification header is required.","The container list header is required.","The container name is fine.","The image comes from the internal registry and is pinned to a version, which is good practice.","The security context block is the right place for isolation settings.","This is the first finding. A privileged container runs with the same power as a process on the node, so the container wall is gone and the pod can reach the host and every other workload on that node.","The volume mount list is required.","This line shows the container mounting a host socket. It is the second half of the finding, because the mount is only dangerous when the file behind it is the container runtime socket.","The volume list header is required.","The volume name is only a label.","The host path type means the file comes from the node itself.","This is the second finding. Mounting the container runtime socket into a pod lets the pod start new containers on the node, which is a well known way out of the container and onto the host. A container boundary or a virtual machine boundary would have contained this."],"why":"Container isolation holds only while the container stays inside its own namespace and keeps no host rights. A privileged container can reach the node, and a mounted runtime socket lets the workload create new containers on that node, so the two settings together are a full escape path. The workload should collect logs through a read only path or an agent on the node, and it should run as an unprivileged user. A pod is containerization, the security context block is where sandboxing is configured, and running the process as a normal user is least privilege.","hint":"One setting gives the pod node level power, and one mount gives it the keys to the container runtime.","kw":["containerization","isolation","sandboxing","virtual machine isolation","least privilege"]},{"id":"H10","type":"order","theme":"Lifecycle, sanitization and governance","points":10,"scenario":"The data protection officer asks you to explain why some disposal methods are trusted more than others. You must rank the six methods from the weakest assurance that the data is gone to the strongest.","question":"Rank the methods from the weakest to the strongest assurance that the data cannot be recovered.","items":["Delete the files with the file manager","Format the volume once","Overwrite the whole disk with a verified pattern","Run the built in secure erase command on the solid state drive","Destroy the encryption keys of the self encrypting drive","Shred the platters and burn the remains"],"why":"Deleting and formatting only rewrite the index, and the data blocks stay on the medium, so neither is sanitization. A verified overwrite is a real clear step, and a built in secure erase on flash is stronger because it works at the level of the memory cells. Destroying the keys of an encrypted drive is a cryptographic erase, which is as strong as the encryption itself, and physical destruction is the final answer because there is nothing left to recover. Degaussing is the magnetic step that belongs to tape, and it sits between overwriting and destruction in assurance.","hint":"Ask what happens to the data itself at each step, not what the operating system shows in the folder.","kw":["data sanitization","overwrite wipe","cryptographic erase","physical destruction","degaussing","certificate of destruction"]},{"id":"H11","type":"fill","theme":"Lifecycle, sanitization and governance","points":10,"scenario":"The plant controller PC-7 cannot be patched and cannot be replaced this year. You must complete the risk exception form that goes to the plant manager, using the terms the governance team expects.","question":"Choose the word or phrase that completes each gap in the exception form.","parts":["Asset PC-7 reached ",{"b":0}," in March and will receive no further fixes. The scan lists 41 missing fixes. Because no vendor fix will arrive, the plant applies the following ",{"b":1},": a firewall rule that allows only the two engineering hosts, and a virtual signature for the known exploit. After those controls, the team judges the ",{"b":2}," to be medium. The exception is ",{"b":3}," and expires on 31 December, after which the asset must be replaced or the exception renewed."],"answers":["end of support","compensating controls","residual risk","time bound"],"extras":["full compliance","a penetration test","a security awareness campaign"],"why":"The asset is out of support, so no patch will ever arrive and the missing fixes cannot be closed in the normal way. Compensating controls reduce the exposure instead, and what is left after them is the residual risk that the business is being asked to accept. A time bound exception has an expiry date and an owner, which is what stops a temporary decision from becoming permanent. The asset is at end of support, the signature on the firewall is virtual patching, and the rule that allows two hosts is an access control list.","hint":"One gap names the state of the product, one names the extra controls, one names what is left over, one names the expiry.","kw":["risk acceptance","compensating control","end-of-life / end-of-support","virtual patching","access control list (ACL)","patch management"]},{"id":"H12","type":"terminal","theme":"Hardening techniques","points":12,"scenario":"You are on the jump host with a shell session. The change record for fileserver02 needs a full service inventory before the unused file sharing service is removed, and the evidence must be kept as scan.txt in the current directory for the ticket.","question":"Enumerate the services that listen on fileserver02 with version detection, and save the result to scan.txt. Type the command.","parts":[{"re":"\\bnmap\\b","label":"a port and service scanner is used","flags":""},{"re":"(^|\\s)(-sV|-A)(\\s|$)","label":"version detection is switched on","flags":""},{"re":"-oN\\s+scan\\.txt(\\s|$)","label":"the normal output is written to scan.txt","flags":"i"},{"re":"\\bfileserver02\\b","label":"the target host is named","flags":""}],"solution":"nmap -sV -oN scan.txt fileserver02","why":"The task hides three separate decisions: which tool, which flag turns on version detection, and how the output is written to a file. Version detection matters because a port number alone does not tell you which build answers, and the build number is what proves whether the old file sharing service is still running. Writing to a file gives the ticket a record that survives the session, and a scan of one host is far less noisy than a scan of the whole subnet. The result feeds the asset inventory, the scan is the authenticated vulnerability scan that proves what is listening, and removing the unused service is removing unnecessary software under least functionality before the next patch management cycle. Removing the old file sharing service is disabling unused ports and protocols.","hint":"You need a scanner, a service detection option, a file output option, and the host name in the right place.","kw":["disabling unused ports and protocols","authenticated vulnerability scan","asset inventory / CMDB","least functionality","removing unnecessary software","patch management"]},{"id":"H13","type":"mcq","multi":false,"theme":"Hardening techniques","points":10,"scenario":"A scan finds that the internal results portal still offers TLS 1.0 so that a laboratory instrument built in 2012 can upload its files. The instrument cannot be upgraded and its vendor no longer exists. The portal is used by 300 staff with modern browsers, and the instrument sits on the same segment as 60 research laptops.","question":"Which change is the correct hardening decision?","opts":["Turn off TLS 1.0 on the portal and move the instrument to its own segment","Turn off TLS 1.0 on the portal today and tell the lab to replace the instrument","Leave TLS 1.0 switched on and record the scan finding as a false positive","Replace the portal certificate with a longer key and keep TLS 1.0 on"],"correct":[0],"whyEach":["Correct. The modern traffic gets the hardened setting, and the old device keeps working behind its own boundary with only the instrument reachable.","This is the obvious answer and it breaks a business process, because the instrument cannot be replaced or upgraded.","Recording a true finding as false is a reporting failure and leaves the weak protocol in place for everyone.","A longer key does not repair a weak protocol version, so the finding stays open."],"why":"Weak protocol versions must be removed where they are not needed, and the one device that needs them must be isolated rather than allowed to hold the whole portal back. The correct design is a hardened main listener for the 300 staff and a separate listener on a segment the instrument alone can reach, with the exception recorded and reviewed. Turning the protocol off everywhere would stop the laboratory work, and a bigger certificate changes nothing about the protocol. The separate listener is isolation on its own network segmentation, and it is a compensating control for a device that is at end of support.","hint":"Separate the old device from the modern users instead of choosing one of them.","kw":["TLS","isolation","network segmentation","compensating control","end-of-life / end-of-support"]},{"id":"H14","type":"spot","theme":"Hardening techniques","points":12,"scenario":"A workstation raised a low severity alert for unusual command activity. The timeline covers the workstation WS-2201 and the file server FS-01 for the same morning. You must point at the single line that shows the attacker moved from the workstation onto another host.","question":"Click the one line that proves lateral movement to a second host.","art":{"title":"endpoint timeline - WS-2201 and FS-01 - 2025-06-02","kind":"log","pick":true,"lines":["2025-06-02T09:10:02Z EDR host WS-2201 process explorer.exe pid 2200 user CORP\\t.novak action start","2025-06-02T09:11:44Z EDR host WS-2201 process powershell.exe pid 2310 args Get-ADComputer -Filter * action start","2025-06-02T09:12:03Z EDR host WS-2201 process nslookup.exe pid 2322 args dc01.corp.local action start","2025-06-02T09:14:20Z EDR host WS-2201 process net.exe pid 2402 args view action start","2025-06-02T09:15:00Z EDR host WS-2201 network powershell.exe dst 10[.]30[.]9[.]11:445 action ALLOW","2025-06-02T09:16:31Z EDR host WS-2201 process cmd.exe pid 2502 args whoami /groups action start","2025-06-02T09:18:47Z EDR host FS-01 process services.exe pid 812 action create service PSEXESVC","2025-06-02T09:19:10Z EDR host WS-2201 process notepad.exe pid 2610 user CORP\\t.novak action start"]},"bad":[6],"whyEach":["The desktop shell starting is ordinary activity and only sets the scene.","Listing the computers in the domain is discovery. It is suspicious in context and it stays on one host.","A name lookup for a domain controller is discovery, not movement.","Listing the shares in the domain is more discovery on the same host.","A connection to the file sharing port of another server is the first step of movement, and on its own it is normal file access.","Running a command to see the current group membership is privilege discovery on the local host.","This is the proof. The line is recorded on FS-01, a different host, and it shows a service being created there. A remote service creation is how a tool such as PsExec lands on a second machine and runs code with the credentials it carried from the first.","Opening a text editor is ordinary activity and adds nothing."],"why":"Discovery stays on one host and looks noisy but harmless. Movement is different, and the proof is an event recorded on the second host that the first host caused, such as a remote service being created. The connection to the file sharing port earlier is the step that made it possible, and the pair together shows the attacker took a credential from the workstation and used it on the server. The EDR timeline is what proved it, and the controls that would have stopped it are isolation of the workstation, microsegmentation of the server tier and privileged access management over the service account. That timeline is endpoint detection and response (EDR) telemetry, which is what made a remote service creation visible at all.","hint":"Movement leaves a mark on the machine that was reached, not only on the one that started it.","kw":["endpoint detection and response (EDR)","isolation","microsegmentation","least privilege","privileged access management (PAM)"]},{"id":"H15","type":"branch","theme":"Access control and least privilege","points":12,"scenario":"A company with 900 seats asks for one change this quarter that reduces the most identity risk. The facts are: administrators sign in with the same personal account they use for email, the domain administrator password is shared in a spreadsheet, there is no approval step before elevation and no second factor on administrator accounts, laptops are not enrolled in any device management service, and the network between users and servers is flat.","question":"Choose the plan, one decision at a time.","steps":[{"sit":"Which gap do you close first, and why?","opts":["Split administrator accounts from everyday accounts, vault the shared password, and add a second factor","Buy a new endpoint agent for all 900 seats","Deploy full disk encryption to every laptop","Run a phishing awareness campaign for all staff"],"correct":0,"res":["One stolen mailbox is a path to every server while the everyday account also holds admin rights, and the shared secret is known to several people. Splitting the accounts, vaulting the secret and adding a second factor closes the fastest route to a full compromise.","A new agent adds detection and leaves the over privileged, shared credential in place.","Disk encryption protects a lost laptop and does nothing about credential reuse.","Awareness lowers the chance of a click and leaves the standing access untouched."]},{"sit":"The accounts are split and the vault is live. What is the next control for administrator work?","opts":["Give elevation only on request, with approval, for a fixed time window","Give every administrator two personal admin accounts so the work is faster","Shorten the administrator password so it is easier to type at the console","Email the administrator password to the team each Monday morning"],"correct":0,"res":["Just in time elevation with approval and a time limit removes standing privilege, so a stolen account has no rights until a request is approved.","More privileged accounts means more identities to protect, not fewer.","A shorter shared password is weaker and is still shared.","Email is copied and forwarded, so it is not a vault."]},{"sit":"The board asks how you will prove that the change worked. Which measurement is right?","opts":["The number of accounts that hold standing administrator rights, reviewed every month","The number of phishing messages that staff report each month","The number of alerts the endpoint agent raises each week","The percentage of laptops with disk encryption switched on"],"correct":0,"res":["The measure matches the control. If standing privilege falls and stays low, the change is real and the quarterly access review proves it.","Phishing reports measure awareness, not privilege.","Alert volume describes detection workload and says nothing about standing access.","Encryption coverage measures a different control that was not part of this plan."]}],"why":"When one account is both an everyday mailbox and an administrator, one phished password can reach the whole estate, so the first fix is to separate the two and to stop sharing a secret. Standing privilege is then removed with just in time elevation, and the proof is the count of accounts that hold standing rights, checked again each quarter. Device management and encryption are useful controls, and neither of them removes the reused credential that made the compromise quick. The second factor on the administrator accounts is MFA, and it is what makes the vaulted password worth less to a thief.","hint":"Find the credential that gives the fastest route to everything, and measure whether it still exists afterwards.","kw":["least privilege","privileged access management (PAM)","MFA","access review","mobile device management (MDM)","full-disk encryption"]},{"id":"H16","type":"spot","theme":"Patching and vulnerability management","points":12,"scenario":"The compliance report lists the database server as missing the same critical fix for the third week in a row, and the service owner is asking why patching keeps failing. You open the deployment log for one maintenance window and must point at the two lines that show the real cause.","question":"Click the two lines that show the root cause of the repeated failure.","art":{"title":"deployment log - SQL-02 - security update KB5034441","kind":"log","pick":true,"lines":["2025-06-10T01:00:00Z PATCH SQL-02 detection: scan found 1 missing security update","2025-06-10T01:00:12Z PATCH SQL-02 download: package downloaded from the internal update point","2025-06-10T01:02:40Z PATCH SQL-02 install: installation started inside the maintenance window","2025-06-10T01:06:02Z PATCH SQL-02 install: installation returned code 3010","2025-06-10T01:06:02Z PATCH SQL-02 state: restart required before the update can finish","2025-06-10T03:59:58Z PATCH SQL-02 window: window closed with the restart still pending","2025-06-17T01:00:00Z PATCH SQL-02 detection: scan still reports the update as missing","2025-06-17T01:00:30Z PATCH SQL-02 report: update listed as failed in the weekly report"]},"bad":[4,5],"whyEach":["Detection worked and found the update, so this line is not the cause.","The package downloaded correctly from the internal source.","The installer started in the agreed window, which is what the process asks for.","The return code shows that the install step finished its work and asked for a restart. This is a success code, not a failure.","This is the first half of the cause. The update cannot complete until the host restarts, and the restart is the step nobody scheduled.","This is the second half. The window closed with the restart still pending, so the update was rolled back or left unfinished, and the next scan sees it as missing again.","The scan is only reporting the result of the unfinished install, so it is a symptom.","The weekly report is the same symptom seen from the management side."],"why":"The log shows a successful install that needed a restart, and a window that ended before the restart happened. Every later line, including the scan and the compliance report, describes that same unfinished state rather than a new fault, which is why three weeks of patching have changed nothing. The fix is to schedule the restart inside the window and to alert when a window closes with a restart pending. The scan line is an authenticated vulnerability scan, which is why it can report both the build number and the pending restart.","hint":"Find the line that says what the installer still needed, and the line that shows the window ending first.","kw":["patch management","maintenance window","authenticated vulnerability scan","patch prioritization"]},{"id":"H17","type":"match","theme":"Patching and vulnerability management","points":12,"scenario":"The weekly triage sheet has five findings and only one maintenance window this month. Each finding must be matched with the action the team will actually take, so the decisions can be defended in the change board.","question":"Match each finding with the correct action.","art":{"title":"weekly triage sheet - five open findings","kind":"code","lines":["CVE-2025-1180 | internet facing VPN appliance | CVSS 9.8 | listed in the CISA KEV catalog | exploit observed in the wild","CVE-2025-2044 | internal HR web app | CVSS 8.1 | no public exploit | EPSS 0.02","CVE-2025-3311 | warehouse scanner firmware | CVSS 6.5 | no vendor fix yet | device reaches the internet","CVE-2025-4102 | laboratory workstation | CVSS 5.3 | needs a local session | no fix available","CVE-2025-4477 | public web server | CVSS 7.5 | public proof of concept | EPSS 0.31"]},"pairs":[["CVE-2025-1180, VPN appliance, in the KEV catalog","Fix tonight, outside the normal window"],["CVE-2025-2044, internal HR web app, no exploit","Fix in the next scheduled window"],["CVE-2025-3311, scanner firmware, no vendor fix","Isolate the device and reduce what it may reach"],["CVE-2025-4102, laboratory workstation, local access only","Record an exception and review it next quarter"],["CVE-2025-4477, public web server, exploit published","Block the known attack path now and fix this week"]],"why":"Priority comes from reach, impact and whether anyone is already using the flaw. A remote code execution flaw on an internet facing appliance that sits in the KEV catalog is being exploited now, so it goes outside the normal window. A published exploit on an internet facing server justifies blocking the known attack path immediately with a virtual patch and fixing it this week, while the internal application waits for the scheduled window. A device with no vendor fix is handled by reducing what it can reach, and a flaw that needs a local session on a laboratory host is recorded and reviewed. Isolating the scanner is a compensating control, and the local only flaw is the one row where risk acceptance with a review date is defensible.","hint":"Combine how reachable the target is, how bad a success would be, and whether an exploit already exists.","kw":["patch prioritization","CVSS","CISA KEV catalog","EPSS","compensating control","virtual patching","risk acceptance"]},{"id":"H18","type":"fill","theme":"Hardening techniques","points":10,"scenario":"The endpoint team is writing the rule syntax for the new application allow list. The standard must explain which kinds of rule the team may write and which ones it must avoid.","question":"Choose the word or phrase that completes each gap in the allow list standard.","parts":["An application is accepted when its ",{"b":0}," is on the approved publisher list, or when the exact file ",{"b":1}," has been approved for an unsigned tool. Rules based only on the ",{"b":2}," are avoided, because anyone can copy a program into a trusted folder. Script hosts and signed system tools are covered by ",{"b":3},", so that an allowed binary cannot be used to run an attacker script."],"answers":["digital signature","hash","file path","behaviour rules"],"extras":["file size","icon","install date"],"why":"A signature rule lets a publisher update its software without a new approval each time, and a hash rule pins one exact file, which is what an unsigned internal tool needs. Path rules look convenient and are easy to defeat, because the attacker simply writes into a trusted folder. Behaviour rules cover the tools that are meant to run, such as script hosts, which is the gap a plain allow list leaves open. The whole rule set is attack surface reduction and least privilege, and the behaviour rules are what cover script hosts the way macro blocking covers documents.","hint":"One rule trusts a publisher, one pins an exact file, one is easy to abuse, one watches what an allowed program does.","kw":["application allow list","application deny list","attack surface reduction","least privilege","macro blocking"]},{"id":"H19","type":"branch","theme":"Segmentation and isolation","points":12,"scenario":"A design laboratory keeps its models on a network with no route to the internet, as its customer contracts require. A supplier must send a revised model file every week, and the engineers want it quickly.","question":"Set up the weekly transfer without breaking the air gap, one decision at a time.","steps":[{"sit":"Which transfer method keeps the air gap and still meets the weekly need?","opts":["A one way link into the laboratory network, with the file checked by a scanner before release","A shared cloud folder that the laboratory reaches when a file is needed","A memory stick carried in by the supplier engineer and plugged in at a workstation","A temporary internet connection opened for the weekly transfer hour"],"correct":0,"res":["A one way link keeps traffic flowing in, and the file passes a scanning stage before it reaches the laboratory, so the gap holds and the need is met.","A cloud folder needs a route to the internet, which breaks the contract condition the customer audits.","An uncontrolled stick from outside is the classic way into a separated network.","A temporary route is still a route, and the gap is gone for as long as it exists."]},{"sit":"The laboratory agrees to allow removable media for a small number of transfers. What must be in place first?","opts":["One scanning kiosk, laboratory owned media, a two person rule and a transfer log","A list of engineers who may use their own memory sticks","A warning label on every stick that enters the room","Antivirus software on the engineering workstations"],"correct":0,"res":["The kiosk scans the media before it enters, the media belongs to the laboratory, two people sign for the transfer and the log records what moved.","Personal media cannot be controlled, scanned or traced.","A label is a warning, not a control.","Protecting only the workstations leaves the media path open."]},{"sit":"The customer audit asks how the laboratory proves the network stayed separate. Which evidence is correct?","opts":["Device configurations that show no route, plus the transfer log for approved media","A statement from the laboratory manager that no cable has ever been connected","The customer contract that requires an air gap","The network diagram produced during the design phase"],"correct":0,"res":["The running configurations show the missing route, and the log shows every crossing that did happen.","A statement is not evidence about the configuration of a device.","The contract states the requirement, not the state of the network.","A diagram shows intent and can be out of date."]}],"why":"An air gap is held by the absence of a route, and every exception must be a controlled, one way and recorded crossing. A one way link with a scanning stage, laboratory owned media, a two person rule and a transfer log each reduce the chance that the weekly file becomes the way in. The audit asks for the running configuration and the log, because intent and policy documents describe what should be true rather than what is true. The one way link and the scanning kiosk are isolation, and every crossing is approved and logged under change management.","hint":"Keep every crossing one way, scanned and recorded, and prove it with the device itself.","kw":["air gap","isolation","network segmentation","access control list (ACL)","change management"]},{"id":"H20","type":"spot","theme":"Access control and least privilege","points":12,"scenario":"You are chairing the quarterly access review for the finance systems. One line on the export looks wrong at first glance and must not be flagged, and four lines must be revoked today. You must be sure which is which.","question":"Click the four accounts that must be revoked in this review.","art":{"title":"access review export - finance systems - quarter 3","kind":"log","pick":true,"lines":["a.berg   | accounts payable | role ap-entry only            | last sign-in 1 day ago   | no exception","b.koch   | accounts payable | roles ap-entry and ap-approve | last sign-in 2 days ago  | no exception","c.lind   | treasury         | role payment-release          | last sign-in 4 days ago  | no exception","d.marsh  | hr               | role hr-admin                 | last sign-in 6 days ago  | no exception","e.otto   | contractor       | role build-operator           | badge returned 12 days ago | no exception","f.rau    | it               | role backup-operator          | last sign-in 9 days ago  | no exception","svc_edi  | integration      | role edi-service              | secret never rotated since 2023 | no exception","g.silva  | plant            | role controller-admin         | last sign-in 2 days ago  | approved exception, single admin, expires 30 September","h.novak  | sales            | role crm-user                 | last sign-in 1 day ago   | no exception","shared_helpdesk | it        | one account used by five agents | last sign-in today     | no exception"]},"bad":[1,4,6,9],"whyEach":["A named accountant with the entry role only and recent activity. Nothing to revoke.","This account holds the entry role and the approval role with no exception, so one person can create a supplier and approve its payment. That breaks separation of duties and one of the two roles must go.","A named user in a single treasury role with recent activity. Nothing to revoke.","A named user in a single human resources role. Nothing to revoke.","The contractor badge was returned twelve days ago and the account is still active, so offboarding failed. The account must be disabled now.","A named backup operator with one role and activity nine days ago. This is a legitimate account that stays.","A service account whose secret has not been rotated since 2023 is a standing credential with no owner review. It must be taken out of service and reissued under the secret rotation process.","This line is the trap and must not be flagged. The plant has one administrator, the exception is approved and it has an expiry date, so the risk has been accepted in writing. Replacing it needs a second plant administrator, which is a project rather than a review action.","A named sales user with one role and recent activity. Nothing to revoke.","One account is shared by five agents, so no action can be traced to a person. Shared accounts break accountability and must be replaced by named accounts."],"why":"A review asks whether this exact access is still needed by this exact identity. Two roles that let one person complete a payment fail the separation of duties test, an account whose contractor has left fails the identity test, a service account with a stale secret fails the ownership test, and a shared account fails the accountability test. An approved, dated exception for a single plant administrator is a control decision that has already been taken, so it stays until its expiry date. Revoking the extra role restores least privilege, and the trap line shows that a documented risk acceptance is not the same thing as a forgotten account.","hint":"Look for the ability to complete a whole process alone, an identity that no longer exists, a secret nobody owns, and one login shared by many people.","kw":["access review","separation of duties","orphaned account","service account","risk acceptance","least privilege"]},{"id":"H21","type":"order","theme":"Patching and vulnerability management","points":10,"scenario":"The review of a ransomware incident is finished. The attacker found a service account password inside a script on a developer laptop, used it to reach the backup server, and deleted the backup catalogue before encrypting the file servers. The hardening backlog has more items than the team can do this quarter.","question":"Rank the hardening work by how much it would have reduced this incident, from the greatest reduction to the smallest.","items":["Remove the password from the script and move the account into the vault with a rotated secret","Stop the service account from signing in interactively and limit it to the one host it needs","Separate the backup server so a workstation tier account cannot reach it","Alert when backup catalogues are deleted, and not only when files are encrypted","Run an awareness campaign about secrets written into code"],"why":"The incident began with one reusable secret that had far more reach than its job needed, so removing the secret from the script comes first and reducing what the account may do comes second. Separating the backup server then prevents any single stolen identity from reaching the recovery data, and alerting on catalogue deletion shortens the next incident. Training is worth doing and it is the slowest and weakest of the five, which is why it ranks last. The vault work is privileged access management under least privilege, the backup separation is microsegmentation, and the role split is separation of duties.","hint":"Start from what the attacker actually used, then remove the reach, then improve what you would see.","kw":["least privilege","service account","privileged access management (PAM)","microsegmentation","separation of duties","access review"]},{"id":"H22","type":"mcq","multi":false,"theme":"Access control and least privilege","points":10,"scenario":"A flat network of 1,200 Windows hosts must keep NTLM for two legacy applications that cannot change this year. Every workstation was built from the same image and still uses the same local administrator password that the image shipped with. A penetration test moved from one workstation to the domain controller in twenty minutes without cracking a single password.","question":"Which single change breaks that attack path while the legacy applications stay as they are?","opts":["Give every host its own random local administrator password now","Turn off the NTLM protocol across the whole domain this weekend","Raise the minimum domain password length from 14 to 20 characters","Turn on SMB signing on the file servers and on nothing else"],"correct":[0],"whyEach":["Correct. The reused build password is what makes one stolen hash open many hosts, and tiering keeps powerful credentials away from workstations.","This is the obvious answer and it breaks the two legacy applications, which the business cannot accept this year.","Longer passwords do not help when the attacker replays a hash instead of guessing a password.","Signing helps against relay and tampering, and it does not stop a hash that is accepted directly by another host."],"why":"The test did not crack anything, so the attacker replayed a credential that many hosts accept. A per host random password removes the reuse, and tiering stops a powerful credential from ever being used on a workstation where it can be captured. Turning NTLM off entirely would remove the path and break production, and longer passwords change nothing when no password is being guessed. A password that is unique to each host restores least privilege, and tiering the administrator accounts is the privileged access management idea that keeps powerful credentials off workstations. Keeping the two tiers on separate network paths is microsegmentation.","hint":"Nothing was cracked, so ask which credential is accepted by more than one machine.","kw":["least privilege","privileged access management (PAM)","SMB signing","default credential change","microsegmentation"]},{"id":"H23","type":"fill","theme":"Configuration enforcement","points":10,"scenario":"The platform team is presenting its new automation model to the architecture board. The slides must name the four parts that keep hosts identical to the declared design.","question":"Choose the word or phrase that completes each gap in the presentation notes.","parts":["Every host is created from ",{"b":0},", so a replacement host is built exactly like the one it replaces. A ",{"b":1}," compares the running settings with the declared design and corrects any difference it finds. Nothing reaches production unless a ",{"b":2}," in the pipeline has checked the change. When a difference cannot be corrected automatically, the team receives a ",{"b":3}," so that the drift is visible and owned."],"answers":["declarative code","desired state check","policy gate","drift alert"],"extras":["a manual runbook","an annual audit","a change freeze"],"why":"Declarative code describes the host the team wants, and the desired state check is what closes the gap between that description and the running host. A policy gate in the pipeline means a bad design is refused before it is deployed, which is far cheaper than fixing it in production. The drift alert is the last line of defence, because a setting that cannot be corrected automatically must still be seen by a person. Declarative code is infrastructure as code, the declared design is the secure baseline, and rebuilding a host from it is the golden image idea.","hint":"One part describes the host, one compares, one refuses bad changes early, one reports what it could not fix.","kw":["infrastructure as code (IaC)","configuration drift","secure baseline","change management","golden image"]},{"id":"H24","type":"spot","theme":"Hardening techniques","points":12,"scenario":"The application server appserver07 was built by a project team and handed over last week. You run a socket listing on the host and compare it with the service list in the handover document.","question":"Click the two listening sockets that must be closed or restricted before the server is accepted.","art":{"title":"listening sockets - appserver07 - ss -tulpn","kind":"log","pick":true,"lines":["tcp   LISTEN  0  128  0[.]0[.]0[.]0:22      0[.]0[.]0[.]0:*  users:((sshd,pid=1180))","tcp   LISTEN  0  128  127[.]0[.]0[.]1:8080  0[.]0[.]0[.]0:*  users:((app,pid=2410))","tcp   LISTEN  0  128  0[.]0[.]0[.]0:443     0[.]0[.]0[.]0:*  users:((nginx,pid=900))","tcp   LISTEN  0  128  0[.]0[.]0[.]0:6379    0[.]0[.]0[.]0:*  users:((redis,pid=3120))","tcp   LISTEN  0  128  127[.]0[.]0[.]1:3306  0[.]0[.]0[.]0:*  users:((mysql,pid=1500))","tcp   LISTEN  0  128  0[.]0[.]0[.]0:2375    0[.]0[.]0[.]0:*  users:((dockerd,pid=880))","tcp   LISTEN  0  128  127[.]0[.]0[.]1:5432  0[.]0[.]0[.]0:*  users:((postgres,pid=1620))","tcp   LISTEN  0  128  ::1:9113             :::*        users:((metrics,pid=2210))"]},"bad":[3,5],"whyEach":["Secure Shell on every interface is expected for a managed server, and it is protected by keys and a host firewall rule.","The application port is bound to the loopback address, so only the web server on the same host can reach it. This is correct hardening.","The web port is the service the server exists to provide. It is expected to listen on every interface.","This is the first finding. The data store listens on every interface with no authentication in this configuration, so any host that can reach appserver07 can read and write every cached value. The service should be bound to the loopback address or to a management interface.","The database is bound to the loopback address and is not reachable from the network. This is correct.","This is the second finding. The container runtime control socket listens on every interface, and anyone who reaches it can start a new container with host level rights, which is a direct path to root on the server. It should never be exposed beyond the local host.","A second database bound to the loopback address. This is correct.","A metrics endpoint bound to the IPv6 loopback address only. This is correct."],"why":"A listening socket on every interface is reachable by anything that can route to the host, so each one must be justified. The cache store and the container runtime socket are both management interfaces that belong on the loopback address or behind a host firewall rule, and the runtime socket in particular is a direct path to full control of the host. Closing them, or binding them locally, is least functionality applied to a real host. Binding the management sockets to the loopback address is disabling unused ports and protocols, the runtime socket belongs to containerization, and a host based intrusion prevention system can refuse that traffic until the sockets are closed.","hint":"Two services here are administrative by nature and should never answer the network.","kw":["disabling unused ports and protocols","host-based firewall","least functionality","containerization","least privilege","host-based intrusion prevention system (HIPS)"]},{"id":"H25","type":"order","theme":"Lifecycle, sanitization and governance","points":10,"scenario":"The storage array SAN-3 kept the encrypted finance database and is being retired. Its volumes are encrypted by keys held in the array key manager, the array is being replaced, and the auditor will inspect the retirement record.","question":"Put the retirement steps in the order they must happen.","items":["Get written approval from the storage owner and confirm that no host still uses the array","Revoke the host initiator records and the administrator accounts on the array","Confirm that the archive copy of the needed volumes opens and is complete","Destroy the encryption keys held in the array key manager","Run the array sanitize command and check the completion report","File the sanitization report and the certificate of destruction with the asset record"],"why":"The array may only be retired once its owner agrees and no host still depends on it, and the data that must survive is checked before anything is destroyed. Removing the initiator records and the administrator accounts closes the array as a live system, and destroying the keys makes the encrypted database unreadable without touching the platters. The sanitize command and its report finish the work on the media, and the paperwork closes the asset record. Destroying the keys is cryptographic erase, the archive check is part of decommissioning, and the file is what keeps the asset inventory and the access review honest.","hint":"Detach the array from the business, prove the archive, then remove the keys and clean the media.","kw":["decommissioning","cryptographic erase","database encryption","data sanitization","certificate of destruction","asset inventory / CMDB","access review"]},{"id":"H26","type":"dual","theme":"Hardening techniques","points":12,"scenario":"An application allow list now runs on 900 endpoints, and the endpoint agent reports file activity from allowed programs. You look at the same control from both sides of the fence.","question":"Give the defender answer first, then the attacker answer.","q1":{"q":"Blue team: an allowed and signed program loads a library file from a user writable folder. What should you do?","opts":["Alert on any allowed program that loads a library from a user writable folder","Alert when a user opens a folder that contains executable files","Block every program that does not live in the system folder","Alert when the endpoint agent restarts by itself"],"correct":[0]},"q2":{"q":"Red team: the target allows signed programs and refuses unknown binaries. Which action is most likely to run your code quietly?","opts":["Copy a signed program under a new name and start it","Place a library file next to a signed program so that the program loads it","Encrypt the payload and ask the user to start it","Change the payload file extension so it looks like a document"],"correct":[1]},"why":"An allow list judges programs, and it can be walked around by the programs it already trusts. Placing a library beside a signed binary makes the trusted program load attacker code, which is why the blue team watches where loaded libraries come from rather than only which programs run. Renaming a signed program runs someone else code, and renaming a payload does not make it start. Restricting what a trusted program may load is attack surface reduction and file integrity monitoring working on the same problem.","hint":"One side watches what a trusted program loads, the other side leaves a file for a trusted program to pick up.","kw":["application allow list","application deny list","attack surface reduction","file integrity monitoring (FIM)"]},{"id":"H27","type":"match","theme":"Configuration enforcement","points":10,"scenario":"A new engineer asks which hardening document to follow for a new appliance, and the answer depends on the document role. You write a short matching set for the team wiki.","question":"Match each document with what it provides.","pairs":[["CIS Benchmark","Consensus secure settings for a product, written by a community"],["STIG","Strict configuration guide written for government systems"],["PCI DSS requirement","Contractual rule for any system that stores card data"],["NIST SP 800-53 control","Catalogue of controls used to build an internal control set"],["Vendor hardening guide","Product specific settings published by the maker of the device"]],"why":"These documents answer different questions. A benchmark or a vendor guide tells you which settings a product should carry, a government guide adds stricter settings for sensitive systems, and a control catalogue gives you the structure to build your own baseline. A payment card standard is a contractual obligation, so it must be met where card data is stored, and it is not a technical settings list. A benchmark or a government guide becomes your secure baseline, and every later comparison against it is how configuration drift is measured.","hint":"Ask who wrote the document and who has to obey it.","kw":["CIS Benchmark","STIG","secure baseline","configuration drift"]},{"id":"H28","type":"mcq","multi":false,"theme":"Lifecycle, sanitization and governance","points":10,"scenario":"An appliance that reached end of support cannot be replaced before the next budget year. The team has applied a firewall rule, a virtual signature for the known exploit and weekly monitoring. The plant manager signs a page that says the plant accepts the risk of keeping the device.","question":"Which change makes that risk acceptance acceptable to the auditor?","opts":["Add the compensating controls, a named owner, an expiry date and a review cycle","Store the signed page in the shared folder and mark the audit finding as closed for now","Ask the vendor to confirm in writing that the device is out of support","Increase the monitoring level and leave the risk record exactly as it is"],"correct":[0],"whyEach":["Correct. The record then states what was done instead, who owns the decision, when it ends and when it is looked at again.","A signature with no controls, owner or end date is an open risk with a receipt.","The vendor letter confirms the problem and does not manage the risk.","More monitoring helps, and it still leaves an unbounded acceptance with nobody named."],"why":"Risk acceptance is a management decision, and to be auditable it must name what the risk is, which controls reduce it, who owns the decision, when the acceptance ends and when it is reviewed. Without those elements the signature accepts an open ended exposure, which is why auditors treat it as a finding rather than a resolution. The device is at end of support, which is exactly the case where a risk acceptance needs a named owner and an end date.","hint":"A risk acceptance needs a limit, an owner and a date, not only a signature.","kw":["risk acceptance","compensating control","end-of-life / end-of-support","virtual patching","access review"]},{"id":"H29","type":"classify","theme":"Access control and least privilege","points":12,"scenario":"During a control walkthrough you collect eight decisions that were made on live systems. Each one is an example of one access control model at work, and two of them are quiet weakenings rather than normal administration. You must sort them for the report.","question":"Place each decision under the access control model it belongs to.","items":["A file policy lets a process read a file only when the process label matches the file label","An engineer switches a mandatory policy boolean on so that the web server may bind to a database port","The owner of the marketing share adds a colleague to the share permissions","A container runs with its mandatory confinement profile set to unconfined","A pipeline grants the deployment identity the contributor role on one resource group","A sign-in rule allows access only from a managed device and only outside the change freeze","A file server administrator takes ownership of a folder to restore a backup","A firewall policy permits management access to the switch for two hours each Tuesday"],"buckets":["Mandatory access control","Discretionary access control","Role-based access control","Rule-based access control"],"answer":[0,0,1,0,2,3,1,3],"whyEach":["Labels decide here, and no owner may override them, which is mandatory access control.","The boolean is part of a mandatory policy, so changing it changes the mandatory rules. It deserves a change record even though it feels like a small setting.","The owner of the resource decides who else may use it, which is discretionary access control.","This is a quiet weakening. Removing the confinement profile turns off the mandatory protection, so the container is no longer limited by the policy at all.","Rights are attached to a role that the identity holds, which is role based access control.","The condition is the kind of device and the time of day, which is a rule based decision.","Taking ownership is a discretionary act by an administrator, and it should be logged and reviewed because it can widen access.","A time window and a protocol on a management interface is a rule based decision."],"why":"The model is decided by who or what makes the call. A label makes a mandatory decision that no owner can override, an owner makes a discretionary one, a role carries the rights, and a rule applies a condition such as the device or the time. Two of these items are removals of a mandatory control rather than routine work, which is why they belong in the report. The two Tuesday windows are time-of-day restrictions, and the unconfined profile is a containerization hardening gap.","hint":"Ask who decides: a label, an owner, a role, or a condition such as the time or the device.","kw":["mandatory access control (MAC)","discretionary access control (DAC)","role-based access control (RBAC)","rule-based access control","time-of-day restriction","containerization"]},{"id":"H30","type":"calc","theme":"Patching and vulnerability management","points":8,"scenario":"The quarterly scan covers 12,000 managed endpoints. Twenty five percent of them still run the end of life build that receives no fixes. Of those hosts, one in five is reachable from the internet through the remote access service. The remediation project needs the exact size of the group that must be blocked or fixed tonight.","question":"How many internet reachable hosts run the end of life build? Enter the number of hosts.","answerNum":600,"tol":0,"unit":"hosts","why":"Twelve thousand endpoints with twenty five percent on the old build gives 3,000 hosts. One in five of those is reachable from the internet, so 600 hosts form the immediate group. That number matters because the compensating control is applied to those 600 tonight while the remaining 2,400 move on the planned replacement schedule. The scan is an authenticated vulnerability scan, the old build is end of support, and the 600 hosts are ranked by exposure rather than by CVSS score alone. That ranking is patch prioritization: the 600 internet facing hosts come before everything else on the list.","hint":"Take the share on the old build first, then take one fifth of that result.","kw":["end-of-life / end-of-support","authenticated vulnerability scan","patch prioritization","compensating control","CVSS"]},{"id":"H31","type":"branch","theme":"Patching and vulnerability management","points":12,"scenario":"At 16:40 on a Friday the vendor publishes an emergency fix for a remotely reachable flaw in the remote access appliance that sits in the DMZ. A working exploit is already public, the change board next meets on Tuesday, and 400 staff work from home.","question":"Handle the emergency fix, one decision at a time.","steps":[{"sit":"What is your first action?","opts":["Raise an emergency change with the two named approvers and plan the install for tonight","Wait for the Tuesday change board so that the process is followed","Install the fix alone now and write the change record on Monday","Switch the appliance off until Tuesday morning"],"correct":0,"res":["An emergency change exists for this case: a small approval group, a written record and a tested rollback. The fix goes in tonight.","Waiting four days with a public exploit leaves the appliance open over a weekend.","Working alone on a production service without a record risks an outage and an untraceable change.","Taking the remote access service down stops 400 people from working, which is a larger business risk than the fix itself."]},{"sit":"The emergency change is approved. What must be ready before the install starts?","opts":["A configuration backup, a tested rollback path, a pilot on the standby appliance and the contact list","The vendor release note and a new administrator password for the appliance","A full scan of the whole estate so that the report is complete","A message to all staff to say that remote work may be slow"],"correct":0,"res":["Emergency does not mean unprepared. The backup and the rollback path protect the service, and the pilot proves the fix on the standby unit first.","The release note is useful reading, and it will not recover the service if the install fails.","A full estate scan takes hours and delays the fix without reducing the immediate exposure.","A notice is polite and it is not a recovery plan."]},{"sit":"The fix is installed and the appliance restarts cleanly at 22:10. What correctly closes the emergency change?","opts":["Verify the build and the service, record the change and the evidence, and send it to the change board","Delete the emergency record now that the appliance works","Leave the record open until the next quarterly audit","Add the fix to the monthly patch report and close the incident"],"correct":0,"res":["Verification proves the fix is live, the record explains what happened, and the board review turns one emergency into a process improvement.","Deleting the record hides an unplanned change and loses the audit trail.","A record left open for months means nobody closed the loop.","A monthly report does not record the emergency decision or who approved it."]}],"why":"An emergency change process exists so that a real threat can be fixed the same day without abandoning control. It uses a small approval group, a written record, a tested rollback path and a pilot, and it closes with verification and a review by the change board. Waiting for the next board leaves a public exploit open, working alone loses the record, and shutting the service down trades a security risk for a bigger business one. Tonight is the maintenance window, so the emergency out-of-band patch runs inside a window rather than outside one.","hint":"Use the emergency route, prepare the rollback, and close the loop with the board afterwards.","kw":["emergency out-of-band patch","change management","rollback plan","patch management","DMZ","maintenance window"]},{"id":"H32","type":"mcq","multi":false,"theme":"Lifecycle, sanitization and governance","points":10,"scenario":"An auditor asks for proof that a retired storage array which held customer records no longer holds readable data, and that the asset record is correct. Four evidence packs are offered.","question":"Which evidence pack proves the point?","opts":["The wipe report with its verification, the destruction certificate and the asset record","A photograph of the array in the loading bay with a note from the storage engineer","The purchase invoice, the support contract and the end of support notice from the vendor","The last backup report, the change record and the removal of the array from monitoring"],"correct":[0],"whyEach":["Correct. The method and its verification show how the data was removed, the certificate shows what happened to the media, and the updated record shows the asset no longer exists.","A photograph and a note show intent and prove nothing about the data.","Purchase and support papers describe the history of the device, not its final state.","Backups and monitoring records show that the array was in use, not that it was cleaned."],"why":"Retirement evidence has to answer two questions: is the data unreadable, and is the inventory correct. A wipe report with the method and its verification answers the first, a destruction certificate from the disposal partner supports it, and the corrected asset record answers the second. Paperwork about the life of the device does not show what happened at the end of it. The pack is the closing evidence for decommissioning, and where the media was encrypted the same proof rests on cryptographic erase.","hint":"The auditor needs the state of the data and the state of the inventory, not the history of the device.","kw":["decommissioning","data sanitization","certificate of destruction","asset inventory / CMDB","cryptographic erase"]}];
