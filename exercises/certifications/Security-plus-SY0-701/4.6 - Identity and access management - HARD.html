  lines: [
    '<span class="ts"># /etc/sudoers.d/deploy — reviewed config</span>',
    '%deploy ALL=(ALL) /usr/bin/systemctl restart app, /app/bin/deploy.sh',
    '%admin ALL=(ALL) NOPASSWD: ALL',
    'Defaults logfile="/var/log/sudo.log"',
    '<span class="ts"># /etc/pam.d/system-auth — reviewed config</span>',
    'pam_faillock.so deny=0 unlock_time=never',
    'pam_pwquality.so minlen=12 dcredit=-1 ucredit=-1',
    'pam_pwhistory.so remember=5 use_authtok'
  ],
  wrong: [2, 5],
  ex: '<p><code>%admin ALL=(ALL) NOPASSWD: ALL</code> gives every admin unlimited passwordless <b>elevation</b> — any compromised admin shell is instantly root, and the log file only records <i>that</i> sudo ran, not who typed what. <code>pam_faillock.so deny=0</code> disables lockout entirely, so password guessing can run forever (deny must be a small number with an unlock time). The deploy group line correctly whitelists two commands, pwquality enforces length/complexity, and pwhistory enforces <b>password history</b> (the last five are blocked, so no instant reuse) — those stay.</p><p><b>Focus next:</b> in sudoers, “NOPASSWD: ALL” for a group is always the finding; in PAM, a disabled faillock is always the finding.</p>',
  hints: ['One line hands out unlimited rights for free; one line turns off the brute-force brake.', 'Look at what “deny=0” means for the lockout counter.'] },
{ t: 'fill', th: 2, title: 'Kerberos, the hard version', kw: ['Kerberos', 'KDC', 'TGT', 'TGS / service ticket'],
  sc: '<p>The Kerberos wiki page for the AD team needs its four core terms back. Note the last blank describes what happens when clocks drift past the policy.</p>',
  q: '<p>Fill every blank from the word bank.</p>',
  ftext: '<p>Every ticket in the realm is issued by the {{0}}. After logon the client holds a {{1}}, which it presents to obtain a {{2}} for each service SPN it wants to reach. Services trust those tickets because they were sealed with keys they share with the KDC. If a machine’s clock drifts beyond the policy, its {{3}} stop working and authentication fails.</p>',
  fblanks: [ ['KDC (key distribution centre)'], ['TGT'], ['service ticket (TGS)'], ['Kerberos tickets'] ],
  fbank: ['LDAP bind', 'smart card', 'SAML assertion'],
  ex: '<p>The <b>KDC</b> (in Active Directory, the domain controller role) issues both tickets. The <b>TGT</b> is the cached “I am authenticated” ticket used to request a <b>service ticket (TGS)</b> per SPN; services open tickets because the KDC sealed them with shared keys. Kerberos is time-sensitive — tickets carry timestamps, so clock drift beyond the tolerance breaks <b>Kerberos tickets</b> entirely. The distractors live elsewhere: an LDAP bind is a directory login, a smart card holds certificates, and a SAML assertion is web federation.</p><p><b>Focus next:</b> “time drift breaks login” is a classic Kerberos symptom — check the clock before touching anything else.</p>',
  hints: ['One issuer, two ticket types — which one is cached, which one is per service?', 'The last blank is plural: the things that stop working when time goes wrong.'] },
{ t: 'match', th: 3, title: 'Match each attack to its control', kw: ['phishing-resistant MFA', 'FIDO2 / WebAuthn', 'passkey', 'number matching', 'account lockout'],
  sc: '<p>The incident review produced five attack patterns and a shelf of candidate controls. Match them so the next audit cycle can fund the right ones.</p>',
  q: '<p>Drag each attack onto the control that defeats it.</p>',
  lf: [ { h: 'Password spray across the login endpoint' }, { h: 'Credential stuffing with breach dumps' }, { h: 'MFA fatigue (push bombing)' }, { h: 'Attacker-in-the-middle proxy harvesting OTP codes' }, { h: 'SIM swap against SMS second factors' } ],
  rt: [ { h: 'Throttling, rate limits and smart lockout thresholds', m: 0 }, { h: 'Screen passwords against breach lists + ban reused passwords', m: 1 }, { h: 'Number matching and rate-limited push', m: 2 }, { h: 'FIDO2 security keys / passkeys — origin-bound, phishing-resistant MFA', m: 3 }, { h: 'Move users off SMS to app-based or hardware authenticators', m: 4 } ],
  ex: '<p>Guessing dies to <b>rate limits and smart lockout</b> (thresholds that weigh sources, not naive counts). <b>Stuffing</b> dies because the password was already public — screening against breach corpora and banning <b>password reuse</b> removes those pairs from your directory. <b>Push bombing</b> dies to <b>number matching</b> (approval requires the on-screen number) plus rate limits. An <b>attacker-in-the-middle</b> relay can forward any code the user types, but cannot forge an origin-bound <b>FIDO2/passkey</b> signature — that is what makes it <b>phishing-resistant MFA</b>. And a ported SIM means SMS is attacker-owned — the fix is dropping SMS for authenticator apps or hardware keys.</p><p><b>Focus next:</b> for every attack name, be able to name its one best control and one acceptable fallback.</p>',
  hints: ['One attack exploits reuse of a secret you do not control; its fix is checking secret quality.', 'Two rows involve what the phone receives — one is noise, one is a hijacked number.'] },
{ t: 'terminal', th: 0, title: 'Audit the local accounts', kw: ['non-privileged account', 'privileged account', 'provisioning'],
  sc: '<p>You are auditing a legacy Linux host that will join the domain next week. Two findings are required for the report, and you get no tooling hints this time: choose your own commands.</p>',
  q: '<p>Type <b>two</b> commands:<br>1 — print every account whose UID is 0 from the local password database.<br>2 — print every account whose password hash field is empty (no password set) from the shadow database.</p>',
  tname: 'root@legacy02', tout: 'Local account audit — no tool is named on purpose.\nCommand 1: accounts with UID 0\nCommand 2: accounts with an empty password hash',
  tps: [
    { label: 'command 1', ph: 'print UID-0 accounts', acc: [ '^(?=.*passwd)(sudo\\s+)?(.*\\|\\s*)?awk\\b(?=.*\\$3\\s*==\\s*0).*$', '^(?=.*passwd)(sudo\\s+)?grep\\b.*:0:0[: ].*$' ], show: 'awk -F: \'($3==0){print $1}\' /etc/passwd' },
    { label: 'command 2', ph: 'print empty-password accounts', acc: [ '^(?=.*shadow)(sudo\\s+)?(.*\\|\\s*)?awk\\b(?=.*\\$2\\s*==\\s*["\'][\"\']).*$', '^(?=.*shadow)(sudo\\s+)?grep\\b.*::.*$' ], show: 'awk -F: \'($2==""){print $1}\' /etc/shadow' }
  ],
  ex: '<p>UID 0 means root-level <b>privileged account</b>: <code>awk -F: \'($3==0){print $1}\' /etc/passwd</code> lists every such account — there should be exactly one on a healthy host, so extra names are backdoor-level findings. An empty hash in <code>/etc/shadow</code> means passwordless login (a broken provisioning step or an attacker’s gift): <code>awk -F: \'($2==""){print $1}\' /etc/shadow</code> finds them precisely; a quick <code>grep \'::\' /etc/shadow</code> shows the same candidates (it can also match trailing empty fields, so confirm with the awk form). Fix by setting or locking the hash (<code>passwd -l</code> / <code>usermod -L</code>) and keeping every other account <b>non-privileged</b>.</p><p><b>Focus next:</b> two local checks every Linux audit starts with: UID 0 count, and empty hashes.</p>',
  hints: ['Think in field numbers: passwd field 3 is the UID, shadow field 2 is the hash.', 'awk with -F: plus a condition on the field prints exactly the names you need.'] },
{ t: 'slots', th: 1, title: 'Assemble the ABAC policy', kw: ['ABAC', 'RBAC', 'least privilege'],
  sc: '<p>The document vault moves from <b>RBAC</b> to <b>ABAC</b> for the Restricted tier. The policy engine needs each condition classified by the attribute it reads.</p>',
  q: '<p>Drag each condition onto the attribute category it belongs to.</p>',
  sl: [ { n: 'Subject attributes' }, { n: 'Resource attributes' }, { n: 'Action attributes' }, { n: 'Environment attributes' } ],
  it: [ { h: 'user.department == "Finance"', s: 0 }, { h: 'user.training.current == true', s: 0 }, { h: 'doc.classification == "Restricted"', s: 1 }, { h: 'doc.owner.department == user.department', s: 1 }, { h: 'action in ["read", "download"]', s: 2 }, { h: 'device.compliant == true AND time in 08:00–18:00', s: 3 } ],
  ex: '<p><b>ABAC</b> decides from four attribute families: <b>subject</b> (who is asking — department, training status), <b>resource</b> (what is asked about — classification, owning department), <b>action</b> (what operation — read, download), and <b>environment</b> (the surrounding context — device compliance, time of day). Mixing them yields fine-grained rules no static group list can match, while <b>RBAC</b> stays simpler for coarse roles. The environment line is the classic exam trap: device health and time are not about the user at all.</p><p><b>Focus next:</b> for any condition ask: is it about the person, the object, the verb, or the context?</p>',
  hints: ['Two conditions describe the user, two describe the document.', 'Device compliance and time-of-day are properties of the situation, not of anyone in it.'] },
{ t: 'mc', th: 2, title: 'AAA for the network device admins', kw: ['TACACS+', 'RADIUS', '802.1X'],
  sc: '<p>The network team wants central administration of switch and router logins, with approval of <i>individual commands</i> per admin role and full encryption of the request payloads. Wi-Fi client access already uses <b>802.1X</b> with certificates and stays as it is.</p>',
  q: '<p>Which protocol fits the device-administration requirement?</p>',
  o: [ { h: 'TACACS+ — per-command authorisation and full payload encryption', ok: true }, { h: 'RADIUS — it encrypts everything after the password anyway' }, { h: 'Kerberos — domain-joined switches can use tickets' }, { h: 'OAuth 2.0 with scoped access tokens' } ],
  ex: '<p><b>TACACS+</b> separates authentication, authorisation and accounting and can authorise <i>per command</i> (“this role may run show, not configure”), with the whole payload encrypted — exactly what device administration needs. <b>RADIUS</b> is the right AAA protocol for network <i>access</i> (your 802.1X Wi-Fi), but it encrypts only the password field and has no per-command model. Switches do not speak Kerberos, and OAuth is an authorisation framework for APIs, not device logins.</p><p><b>Focus next:</b> Wi-Fi/VPN = RADIUS + 802.1X; switch/router admins = TACACS+ with command authorisation.</p>',
  hints: ['The requirement names a granularity only one protocol can express: per command.', 'One of these protocols encrypts only the password — the requirement says full payload.'] },
{ t: 'log', th: 4, title: 'The service account that learned to type', kw: ['service account', 'PAM suite', 'credential vault', 'jump box / jump server', 'just-in-time (JIT) access', 'privileged password rotation'],
  sc: '<p>The PAM suite flags policy violations on <code>jump01</code>, the only allowed path to production. Service policy: service accounts never log in interactively; checkouts expire at shift end; elevation is JIT only. Use the filter to inspect, then type the account that breaks the interactive-login rule.</p>',
  q: '<p>Type the account name that violates the no-interactive-login policy.</p>',
  lines: [
    '<span class="ts">01:58:02</span> CHECKOUT acct=<span class="host">svc-dbpatch</span> vault rotated on return — ok',
    '<span class="ts">02:03:17</span> SESSION user=<span class="host">c.varga</span> via <span class="host">jump01</span> → db01 (recorded, JIT elevated 09:00–17:00)',
    '<span class="ts">02:14:44</span> CHECKOUT acct=<span class="host">bkup-sync</span> from 10[.]9[.]2[.]44 — outside approved window',
    '<span class="ts">02:15:03</span> LOGIN acct=<span class="host">bkup-sync</span> interactive shell on <span class="host">jump01</span> from 10[.]9[.]2[.]44 — POLICY: service accounts may not log in interactively',
    '<span class="ts">02:31:29</span> JIT grant acct=<span class="host">bkup-sync</span> sudo ALL — auto-expiry FAILED (still active)',
    '<span class="ts">02:31:30</span> WARN vault rotation skipped for <span class="host">bkup-sync</span> — password unchanged since 2023-02-11',
    '<span class="ts">02:44:11</span> SESSION user=<span class="host">a.dubois</span> via <span class="host">jump01</span> → app02 (recorded, approval #INC7781)'
  ],
  inner: { kind: 'fill', fblanks: [ [ 'bkup-sync', 'bkupsync' ] ], ph: 'account name' },
  ex: '<p><code>bkup-sync</code> breaks the rule three ways: it checked out its vault secret outside the approved window, then opened an <b>interactive</b> shell on the <b>jump box</b> — service accounts exist to run jobs, not to type commands, and a shell under a service identity leaves no accountable human. The <b>JIT</b> elevation it received never expired, and the vault skipped <b>privileged password rotation</b>, so one stolen password from 2023 still works. Healthy rows show the intended flow: human users, recorded sessions, JIT windows, rotation on return — the <b>PAM suite</b> working as designed, and the jump box standing guard as the hardened <b>bastion</b> host it should be.</p><p><b>Focus next:</b> service-account monitoring trio: no interactive login, no unexpired JIT, rotation actually happening.</p>',
  hints: ['Filter for “interactive” — the policy violation names the account itself.', 'The account also skipped its vault rotation in another line — it has a bad morning.'] },
{ t: 'multi', th: 4, title: 'What a real PAM suite guarantees', kw: ['PAM suite', 'ephemeral credentials', 'PIM', 'session recording / broker', 'credential vault', 'just-in-time (JIT) access'],
  sc: '<p>A vendor demoed their <b>PAM suite</b>. Before the purchase order, the architecture board lists six claims from the pitch. Which four describe what a proper suite genuinely delivers?</p>',
  q: '<p>Select the <b>four</b> correct claims.</p>',
  o: [ { h: 'Ephemeral credentials are issued per task and expire when the task ends', ok: true }, { h: 'The vault rotates privileged passwords automatically after each checkout', ok: true }, { h: 'JIT elevation (PIM) grants rights on demand with approval and auto-expiry', ok: true }, { h: 'The session broker records privileged sessions for later replay', ok: true }, { h: 'Standing admin rights are cheaper and equally auditable' }, { h: 'The vault shares one admin password with the whole team to save licences' } ],
  ex: '<p>The four real guarantees: <b>ephemeral credentials</b> (nothing lasts past the task), automatic <b>vault rotation</b> (a leaked password is already dead), <b>JIT/PIM</b> elevation (rights appear on approval and vanish by themselves), and broker-side <b>session recording</b> (replayable proof of actions). Standing admin is the opposite of auditable — the whole point is removing it. Sharing one password destroys individual accountability and outlives every control around it.</p><p><b>Focus next:</b> test any PAM claim against the four pillars: temporary, rotated, on-demand, recorded.</p>',
  hints: ['Two claims save licence money by quietly removing the controls you are buying.', 'Temporary, rotated, on-demand, recorded — four positives to find.'] },
{ t: 'order', th: 1, title: 'Offboard a domain admin — carefully', kw: ['offboarding', 'deprovisioning', 'access recertification', 'separation of duties'],
  sc: '<p>Your senior Windows admin resigned with immediate effect. Because of her privileges, offboarding is a ritual, not a checkbox. Order it.</p>',
  q: '<p>Put the steps in the correct order.</p>',
  oseq: [ { h: 'Freeze the account and preserve logs, recordings and recent vault checkouts' }, { h: 'Terminate all active sessions and revoke tokens' }, { h: 'Rotate every shared secret she knew and re-issue her personal credentials as dead' }, { h: 'Collect laptop, smart card and hardware tokens' }, { h: 'Transfer her standing duties to a named peer, keeping separation of duties intact' }, { h: 'Recertify the remaining privileged group members and remove dormant rights' } ],
  ex: '<p>Privileged <b>offboarding</b> starts with preservation — her knowledge of the estate is now a risk, and you still need the evidence. Sessions and tokens die next; then every secret she knew is rotated (shared admin passwords she typed are compromised by definition); assets return; duties move to a <i>named</i> peer so <b>separation of duties</b> survives; and the closing <b>recertification</b> uses the moment to shrink the privileged group itself. The <b>disable vs delete</b> call is permanent here: disable preserves the audit trail, delete destroys it. Rotating “next month”, or deleting on day one, are the classic failures — that is <b>deprovisioning</b> done backwards.</p><p><b>Focus next:</b> preserve → terminate → rotate → collect → reassign → recertify.</p>',
  hints: ['You need the evidence before anything mutates it.', 'The last step should make the whole estate safer than before she left.'] },
{ t: 'fill', th: 1, title: 'The models, applied to five systems', kw: ['DAC', 'MAC', 'rule-based access control', 'RBAC', 'ABAC', 'ACL'],
  sc: '<p>Five Northwind systems, five access models. The architecture deck needs the right name on each — this time from real deployments, not definitions.</p>',
  q: '<p>Fill every blank from the word bank.</p>',
  ftext: '<p>The file shares are {{0}} — department heads hand out rights on their own folders. The research cluster runs {{1}}: labels on every file, enforced by the OS, no exceptions for owners. The old proxy applies one flat {{2}} to all users identically — pure rule-based thinking. HR and payroll run {{3}}, permissions following the job family. The zero-trust document gate is {{4}}: department, device health and time must all match.</p>',
  fblanks: [ ['DAC'], ['MAC'], ['ACL'], ['RBAC'], ['ABAC'] ],
  fbank: ['SSO', 'JIT'],
  ex: '<p>Owner-managed sharing is <b>DAC</b> (the owner’s discretion is the point and the risk). OS-enforced, non-overridable labels are <b>MAC</b>. One flat <b>ACL</b> for everyone is <b>rule-based access control</b> — one global rule, no per-subject nuance. Job-family permissions are <b>RBAC</b>. Multiple matching conditions across user, device and time are <b>ABAC</b>. SSO and JIT are access-delivery features, not decision models.</p><p><b>Focus next:</b> recognise the models from deployment descriptions, not from definitions — that is how exam scenarios phrase it.</p>',
  hints: ['“No exceptions for owners” is the mandatory one.', 'One flat list for everyone is the rule-based one; the gate that checks three conditions at once is attribute-based.'] },
{ t: 'match', th: 1, title: 'Life events to lifecycle controls', kw: ['joiner-mover-leaver', 'provisioning', 'deprovisioning', 'password expiration', 'identity proofing'],
  sc: '<p>Six HR directory events arrived this month. Each needs the lifecycle control that handles it cleanly — and only that one.</p>',
  q: '<p>Drag each event onto its correct control.</p>',
  lf: [ { h: 'New hire, contract signed, starts on the 1st' }, { h: 'Accountant moves from payroll to procurement' }, { h: 'Leaver with immediate effect' }, { h: 'Promotion to sysadmin granted' }, { h: 'Contractor engagement reaches its end date' }, { h: 'Former employee re-hired after a year' } ],
  rt: [ { h: 'Identity proofing, then provisioning with MFA enrolment', m: 0 }, { h: 'Remove old-role groups, grant per new role — stop privilege creep', m: 1 }, { h: 'Deprovisioning: disable now, revoke tokens, transfer data', m: 2 }, { h: 'Grant via JIT elevation, not standing rights', m: 3 }, { h: 'Let the pre-set account expiration fire — no extension without approval', m: 4 }, { h: 'Reactivate the archived identity — never create a duplicate', m: 5 } ],
  ex: '<p>The <b>joiner-mover-leaver</b> trio plus two edge cases. Joiners: <b>identity proofing</b> before <b>provisioning</b>, MFA from day one. Movers: old groups must be removed or privilege creep starts the same day. Leavers: <b>deprovisioning</b> immediately. A sysadmin promotion should arrive as JIT elevation — standing admin would linger long after the role changes again. Contractor accounts live and die by a pre-set <b>account expiration</b> date. Re-hires reactivate the archived identity so history, audits and group lineage stay in one place — duplicates create orphaned access.</p><p><b>Focus next:</b> every event has exactly one clean handler; improvising one is how orphaned and over-privileged accounts are born.</p>',
  hints: ['Re-hire is the tricky row — the person already exists in the directory’s history.', 'The sysadmin promotion is a mover, but with a privilege twist.'] },
{ t: 'rank', th: 0, title: 'Risk-rank the identity report', kw: ['break-glass account', 'service account', 'guest account', 'machine / computer identity', 'privileged account'],
  sc: '<p>The monthly identity risk report lists five findings from five different teams. The steering committee funds fixes top-down — your ranking decides what gets money.</p>',
  q: '<p>Drag the findings so the most dangerous is position 1.</p>',
  oseq: [ { h: 'break-glass account used on Sunday, no incident ticket, no approval trail' }, { h: 'Offboarded admin’s VPN certificate (machine identity) still authenticates' }, { h: 'Service account with a 3-year-old password allows interactive logon' }, { h: '40 accounts hold Domain Admin “temporarily” since the migration' }, { h: 'Guest account enabled on one filing server with read access' } ],
  ex: '<p>An unexplained <b>break-glass</b> use means the emergency path was taken outside every control — treat as a probable intrusion first. A still-valid <b>machine identity</b> (VPN certificate) of an offboarded admin is live remote access with a forgotten identity. A <b>service account</b> with an unrotated password and interactive logon is a standing invitation with no human to hold accountable. Forty lingering <b>privileged accounts</b> expand the blast radius of every future compromise. An enabled <b>guest account</b> with read-only scope is fixable hygiene by comparison.</p><p><b>Focus next:</b> rank by active, uncontrolled access first; by blast-radius growth second; by hygiene last.</p>',
  hints: ['Two findings describe access that works right now and should not exist at all.', '“Temporarily since the migration” is not temporary — count the blast radius.'] },
{ t: 'branch', th: 2, title: 'The IdP is down during quarter close', kw: ['SSO', 'federation / trust', 'break-glass account', 'MFA'],
  sc: '<p>07:58 on the last day of the quarter: the federation service (IdP) for <b>SSO</b> is down. 4,000 users cannot reach mail, ERP or the reporting suite. Executives demand access now. Three decisions.</p>',
  q: '<p>Choose the best action for each decision point.</p>',
  steps: [
    { h: '<p><b>08:05 —</b> Finance must submit quarter-end numbers. Access path?</p>', o: [ { h: 'Open the documented break-glass procedure: named users, time-boxed local credentials, every step logged', ok: true }, { h: 'Disable MFA and password checks tenant-wide until the IdP returns' }, { h: 'Email the shared admin password to the finance leads' } ] },
    { h: '<p><b>08:40 —</b> Ordinary users are locked out of SaaS apps. What keeps the business moving safely?</p>', o: [ { h: 'Communicate the outage, extend session lifetimes for already-signed-in users per policy, and open a status page', ok: true }, { h: 'Reset everyone’s password so they can use the fallback login form' }, { h: 'Point every app directly at the domain controller with LDAP binds' } ] },
    { h: '<p><b>11:15 —</b> The IdP is restored. What closes the incident properly?</p>', o: [ { h: 'Revoke the break-glass credentials, review their use against the log, and schedule a federation failover drill', ok: true }, { h: 'Leave the break-glass accounts enabled in case it happens again' }, { h: 'Delete the incident ticket — everything works again' } ] },
  ],
  ex: '<p>A federation outage is a test of <b>break-glass</b> discipline: pre-agreed, named, time-boxed, fully logged — never a global disabling of <b>MFA</b> or passwords, which is precisely the hole an attacker waits for. For the masses, sessions that already exist can be stretched by policy and honest communication; mass resets and raw directory binds create new incidents on top of this one. Afterwards, emergency credentials are revoked, their use is audited against the log, and the runbook is tested — a break-glass account left enabled forever is tomorrow’s alert.</p><p><b>Focus next:</b> emergency access is a procedure, not a password you improvise under pressure.</p>',
  hints: ['One option fixes the outage by deleting the company’s authentication controls.', 'When the IdP returns, the emergency door must close again.'] },
{ t: 'spot', th: 2, title: 'Debug the rejected SAML response', kw: ['SAML assertion', 'SAML 2.0', 'identity provider (IdP)', 'service provider (SP)'],
  sc: '<p>The payroll SP logs “invalid assertion” for every user since Monday. You capture the SAML response. The signature is valid and the certificates are trusted. Two lines are wrong.</p>',
  q: '<p>Click the two lines that make the SP reject the response.</p>',
  lines: [
    '<span class="ts">&lt;saml2p:Response Destination="hxxps://payroll.northwind.example/saml/acs" ID="_9f1c"&gt;</span>',
    '  &lt;saml2:Issuer&gt;hxxps://idp.corp.northwind.internal/sso&lt;/saml2:Issuer&gt;',
    '  &lt;saml2p:Status&gt;&lt;saml2p:StatusCode Value="urn:oasis:names:tc:SAML:2.0:status:Success"/&gt;&lt;/saml2p:Status&gt;',
    '  &lt;saml2:Assertion IssueInstant="2026-03-04T10:00:03Z"&gt;',
    '    &lt;saml2:Conditions NotBefore="2026-03-04T10:14:03Z" NotOnOrAfter="2026-03-04T10:10:03Z"/&gt;',
    '    &lt;saml2:AudienceRestriction&gt;&lt;saml2:Audience&gt;hxxps://payroll-legacy.northwind.example/sp&lt;/saml2:Audience&gt;&lt;/saml2:AudienceRestriction&gt;',
    '    &lt;saml2:AttributeStatement&gt;&lt;saml2:Attribute Name="mail"&gt;j.moreau@northwind.example&lt;/saml2:Attribute&gt;&lt;/saml2:AttributeStatement&gt;',
    '<span class="ts">&lt;/saml2p:Response&gt;</span>'
  ],
  wrong: [4, 5],
  ex: '<p>The <code>NotBefore</code> (10:14:03Z) sits <i>after</i> <code>NotOnOrAfter</code> (10:10:03Z) — the validity window is inverted, so the assertion can never be valid at any point in time; the SP correctly rejects it. The <b>audience</b> is <code>payroll-legacy…</code>, but the Destination and the receiving service are <code>payroll.northwind.example</code> — an SP only accepts <b>SAML assertions</b> whose audience is its own entity ID, so even with a perfect signature the <b>IdP</b> is addressing the wrong <b>SP</b>. Issuer, status code, attribute statement and destination are all consistent.</p><p><b>Focus next:</b> when “signature is fine but everything fails”, check the two silent killers: the audience and the validity window.</p>',
  hints: ['One line makes the assertion valid at no moment in time.', 'One line names a system that is not the one receiving this response.'] },
{ t: 'multi', th: 0, title: 'Harden the non-human identities', kw: ['machine / computer identity', 'device identity', 'service account', 'user identity'],
  sc: '<p>The identity inventory shows 11,200 non-human identities against 4,000 staff: <b>machine identities</b> (certificates, device objects), workload <b>service accounts</b> and API keys. Pick the four controls the programme should mandate.</p>',
  q: '<p>Select the <b>four</b> correct controls.</p>',
  o: [ { h: 'Use platform managed identities / workload identity federation instead of static passwords where possible', ok: true }, { h: 'Give every service account a vaulted, automatically rotated secret where static credentials remain', ok: true }, { h: 'Block interactive logon for service accounts and scope their rights to one job', ok: true }, { h: 'Enrol devices with their own certificates so each machine identity is verifiable and revocable', ok: true }, { h: 'Consolidate all services onto one shared admin account for easier tracking' }, { h: 'Map every device object to a personal user identity so a human is always responsible' } ],
  ex: '<p>Non-human identities need non-human discipline: managed identities remove static secrets entirely; whatever remains gets a vaulted, auto-rotated secret; <b>service accounts</b> get no interactive shell and a single, narrow job; and every <b>device identity</b> is issued its own certificate so it can be verified and revoked like a staff badge. One shared admin account destroys accountability across 11,200 workloads, and pinning devices to personal <b>user identities</b> breaks the moment the human leaves — a device is not a person.</p><p><b>Focus next:</b> the non-human lifecycle: verify, scope, rotate, revoke — without ever needing a human password.</p>',
  hints: ['Two options quietly recreate the shared-account and orphaned-account problems.', 'A machine that can prove itself with a certificate never needs to borrow a person’s login.'] },
{ t: 'mc', th: 3, title: 'PIV and CAC on the audit table', kw: ['PIV', 'CAC', 'smart card', 'MFA'],
  sc: '<p>A defence contractor and a civilian agency both issue smart-card credentials. The auditor asks you to explain the relationship between the two programmes precisely.</p>',
  q: '<p>Which statement is correct?</p>',
  o: [ { h: 'CAC is the Department of Defense implementation of the PIV smart-card standard', ok: true }, { h: 'PIV and CAC are unrelated standards from different industries' }, { h: 'PIV is a software-only credential; CAC requires a physical card' }, { h: 'PIV cards cannot carry X.509 certificates, unlike CAC' } ],
  ex: '<p><b>PIV</b> (Personal Identity Verification) is the US federal government smart-card standard (FIPS 201); <b>CAC</b> (Common Access Card) is the DoD’s implementation of that world, predating and aligning with it. Both are physical <b>smart cards</b> holding X.509 certificates, used as a “something you have” factor together with a PIN (“something you know”) — strong <b>MFA</b> in one card. Neither is software-only, and certificates are exactly what both carry.</p><p><b>Focus next:</b> standard vs implementation: PIV = the federal standard, CAC = the DoD card built on it.</p>',
  hints: ['One is the standard, one is an organisation’s card built on that standard.', 'Both cards hold certificates — that rules out two options immediately.'] },
{ t: 'slots', th: 1, title: 'Name the failed control in each finding', kw: ['privilege creep', 'least privilege', 'shared or generic account', 'account recovery / reset'],
  sc: '<p>Four findings from the identity audit. Each one is a specific control that failed. The remediation budget follows the control, not the symptom.</p>',
  q: '<p>Drag each finding onto the control failure it demonstrates.</p>',
  sl: [ { n: 'Privilege creep (least privilege failed)' }, { n: 'Orphaned account (deprovisioning failed)' }, { n: 'Shared account use (accountability failed)' }, { n: 'Weak recovery proof (identity proofing failed)' } ],
  it: [ { h: 'qa-bot account: 14 humans know the password, logins from 3 cities', s: 2 }, { h: 'Ex-employee’s account still owns the CI pipeline after 5 months', s: 1 }, { h: 'm.reyes holds admin rights from a project that closed in 2024', s: 0 }, { h: 'Password reset approved by reading a colleague ID photo sent over chat', s: 3 }, { h: 'Service desk granted “temporary” Domain Admin in 2023, still active', s: 0 }, { h: 'Leaver’s SSO session re-created itself from a live refresh token', s: 1 } ],
  ex: '<p><b>Shared account</b>: one password, many humans, logins from everywhere — nobody is accountable. <b>Orphaned account</b>: the human is gone but the identity lingers — deprovisioning never completed (and a live refresh token resurrecting a session is still the same orphan). <b>Privilege creep</b>: rights outliving their justification — the 2024 project admin rights and the “temporary” Domain Admin both show <b>least privilege</b> decaying over time. <b>Weak recovery proof</b>: a reset approved on a photo from a chat is not <b>identity proofing</b> — the recovery path must verify the person as strongly as login does.</p><p><b>Focus next:</b> audit findings map to controls: creep → recertification, orphan → deprovisioning, shared → named accounts, weak proof → verification steps.</p>',
  hints: ['Two findings share one bucket: rights that outlived their purpose.', 'A reset approved from a chat photo — ask how the helpdesk verified who was asking.'] },
{ t: 'order', th: 1, title: 'The vishing-proof reset procedure', kw: ['account recovery / reset', 'identity proofing', 'password complexity'],
  sc: '<p>Attackers calling the service desk impersonated two executives last month. Rebuild the reset procedure so a voice on the phone is never enough.</p>',
  q: '<p>Put the verification steps in the correct order.</p>',
  oseq: [ { h: 'Call the requester back on the number stored in the HR system — never the number that called in' }, { h: 'Verify identity: video check or manager confirmation on the recorded line' }, { h: 'Check account risk flags (recent SIM change, impossible travel, new MFA device)' }, { h: 'Issue the reset only to a compliant device; require fresh MFA enrolment' }, { h: 'Deliver a one-time temporary password that meets complexity rules and must be changed immediately' }, { h: 'Record everything in the ticket and notify the user’s registered contact' } ],
  ex: '<p>Reset attacks target the <b>recovery</b> path, so it must re-run <b>identity proofing</b>: callback on the stored number defeats caller-ID spoofing; a human verification step anchors the person; risk flags catch a hijacked SIM or a stolen MFA device before it hurts; the reset lands only on a compliant device with fresh MFA; the temporary password obeys <b>complexity</b> rules and dies at first use; and the registered contact gets told — so the real executive learns someone tried. Skipping any step re-opens the vishing door.</p><p><b>Focus next:</b> a reset is an authentication event — verify like it is one.</p>',
  hints: ['The first step removes the attacker’s channel entirely.', 'The notification at the end is the tripwire the attacker cannot switch off.'] },
{ t: 'match', th: 3, title: 'Know your authenticators', kw: ['TOTP', 'HOTP', 'push notification', 'FIDO2 / WebAuthn', 'passkey', 'PIV', 'SMS weakness', 'something you have'],
  sc: '<p>MFA onboarding material lists six authenticator types. Match each to the mechanism that actually makes it tick.</p>',
  q: '<p>Drag each authenticator onto its mechanism.</p>',
  lf: [ { h: 'Code derived from the current 30-second time window' }, { h: 'Code derived from a counter that increments per use' }, { h: 'Approval request where the user types the on-screen number' }, { h: 'Origin-bound key pair; signs the challenge of the genuine site only' }, { h: 'X.509 certificate held on a government smart card' }, { h: 'Code over the mobile network — weakest, hijackable via ported numbers' } ],
  rt: [ { h: 'TOTP (time-based OTP)', m: 0 }, { h: 'HOTP (counter-based OTP)', m: 1 }, { h: 'Push with number matching', m: 2 }, { h: 'FIDO2 / passkey (WebAuthn)', m: 3 }, { h: 'PIV smart card', m: 4 }, { h: 'SMS OTP', m: 5 } ],
  ex: '<p><b>TOTP</b> derives codes from a shared secret plus time, so both sides stay in step; <b>HOTP</b> walks a counter instead — lose sync and you resync at next use. <b>Number matching</b> push ties the approval to the specific login attempt, killing blind approvals. <b>FIDO2/passkey</b> holds a private key that only signs challenges from the genuine origin — a “something you have” factor with <b>phishing resistance</b> built in. A <b>PIV</b> card is a certificate on plastic. And <b>SMS OTP</b> rides the mobile network: interceptable, and the number itself can be ported — the <b>SMS weakness</b> every hardening guide warns about.</p><p><b>Focus next:</b> mechanism explains weakness: time sync, counter sync, blind taps, phishing relays, card loss, phone hijack.</p>',
  hints: ['Two OTPs differ only in what keeps them aligned: a clock or a counter.', 'The strongest one in the list never sends anything the user could type somewhere else.'] },
{ t: 'mc', th: 3, title: 'The reader everyone fights with', kw: ['FRR', 'FAR', 'CER', 'biometrics'],
  sc: '<p>The new data-centre iris readers reject 11% of legitimate staff attempts (FRR 11%), while the measured FAR is 0.001%. Operations demands change; security refuses to “open the doors to impostors”.</p>',
  q: '<p>Which change is the right engineering response?</p>',
  o: [ { h: 'Re-enrol poor templates and tune the threshold slightly toward FAR while keeping it inside policy', ok: true }, { h: 'Relax the threshold until FRR reaches zero — impostor risk is theoretical' }, { h: 'Disable liveness detection so scans succeed faster' }, { h: 'Replace the readers with a shared staff badge stored at the door' } ],
  ex: '<p>High <b>FRR</b> with clean <b>FAR</b> usually means bad templates or a threshold tuned past the <b>CER</b> point. The engineering fix: re-enrol the failing users with quality captures, then move the threshold modestly toward FAR — trading a microscopic acceptance rise for a large usability gain, always inside the documented policy. Relaxing to zero FRR hands the door to impostors; killing liveness detection invites photo and replay spoofs; a shared badge at the door replaces biometrics — the “something you are” factor — with the weakest possible <b>shared account</b>.</p><p><b>Focus next:</b> error rates are a tuning dial between security (FAR) and availability (FRR), with CER as the quality metric.</p>',
  hints: ['Fix the data before the dial — bad templates cause most false rejects.', 'The answer that “fixes” the problem by removing a security control is the trap.'] },
{ t: 'fill', th: 2, title: '802.1X, roles and all', kw: ['802.1X', 'RADIUS', 'device identity'],
  sc: '<p>The network team’s onboarding doc lost its four role names. Fill them so the next engineer understands who does what in <b>802.1X</b>.</p>',
  q: '<p>Fill every blank from the word bank.</p>',
  ftext: '<p>The laptop runs the {{0}}, which asks for network access. The switch acts as the {{1}}: it forwards the exchange and keeps the port closed until told otherwise. Behind it, the {{2}} (a RADIUS server) checks the machine {{3}} and — only if the device identity verifies — instructs the switch to open the port.</p>',
  fblanks: [ ['supplicant'], ['authenticator'], ['authentication server'], ['certificate'] ],
  fbank: ['TGT', 'bind DN'],
  ex: '<p>In <b>802.1X</b> the three roles never change: the <b>supplicant</b> (the device wanting in), the <b>authenticator</b> (the switch or access point holding the port shut), and the <b>authentication server</b> (RADIUS) that validates the credentials — for machine auth, the device <b>certificate</b>, which is the <b>device identity</b>. The port opens only on an Access-Accept. TGT and bind DN belong to Kerberos and LDAP respectively — not to port-based access control.</p><p><b>Focus next:</b> supplicant → authenticator → authentication server, always in that order, with RADIUS at the back.</p>',
  hints: ['Three role names describe the conversation: asker, gatekeeper, judge.', 'Machine authentication on 802.1X runs on certificates, not passwords.'] },
{ t: 'slots', th: 1, title: 'Which principle did each design break?', kw: ['least privilege', 'separation of duties', 'deny by default, allow by exception', 'privilege escalation'],
  sc: '<p>Four architecture snippets from the assessment. Each violates exactly one access-control principle.</p>',
  q: '<p>Drag each snippet onto the principle it violates.</p>',
  sl: [ { n: 'Least privilege' }, { n: 'Separation of duties' }, { n: 'Deny by default, allow by exception' }, { n: 'Need-to-know' } ],
  it: [ { h: 'New hires receive Domain Admin “so nothing blocks them later”', s: 0 }, { h: 'The same person raises and approves access requests in the tool', s: 1 }, { h: 'The VPN grants every VLAN by default; exceptions are removed case by case', s: 2 }, { h: 'The whole HR share is readable by every employee “for transparency”', s: 3 }, { h: 'A contractor keeps the finance group after the project ended', s: 0 }, { h: 'Developers can both write and approve changes to production' , s: 1 } ],
  ex: '<p><b>Least privilege</b> dies whenever rights exist without a current need — speculative Domain Admin and a stale contractor group both grant power ahead of (or beyond) duty. <b>Separation of duties</b> requires the requester and the approver to be different people, and writers never approve their own production changes — otherwise one compromised account carries a change end-to-end (a straight <b>privilege escalation</b> path). <b>Deny by default, allow by exception</b> is inverted when the VPN opens everything and relies on case-by-case removal — the default must be closed. Whole-company readability of HR data ignores <b>need-to-know</b>: access follows purpose, not transparency.</p><p><b>Focus next:</b> name the principle, then the fix writes itself: shrink rights, split roles, close the default, narrow the audience.</p>',
  hints: ['Two snippets are about one person holding two sides of a transaction.', 'The VPN snippet has its default facing the wrong way.'] },
{ t: 'multi', th: 2, title: 'The real cost of SSO concentration', kw: ['SSO', 'MFA', 'access token'],
  sc: '<p>After moving 140 apps behind one SSO portal, the risk committee asks what the concentration risk actually is and what genuinely mitigates it. Six statements are on the table.</p>',
  q: '<p>Select the <b>three</b> correct statements.</p>',
  o: [ { h: 'One phished IdP session now opens many apps — the blast radius of a stolen session grew', ok: true }, { h: 'SSO must sit behind conditional access (device compliance, location, risk) and strong MFA', ok: true }, { h: 'Short session lifetimes and step-up authentication for sensitive actions shrink the risk', ok: true }, { h: 'With SSO in place, MFA is no longer necessary' }, { h: 'SSO is only safe if every app stores the same password locally as a fallback' }, { h: 'Sessions should never expire, so staff are not interrupted' } ],
  ex: '<p><b>SSO</b> concentrates identity: one phished or stolen session — one stolen <b>access token</b> — unlocks everything attached to it. That risk is managed, not accepted: <b>conditional access</b> (compliant device, sane location, risk score) plus <b>MFA</b> at the IdP, and short session lifetimes with step-up prompts before sensitive actions. SSO does not retire MFA — it makes MFA the single critical gate, which is exactly why it must be strong. Local password fallbacks and never-expiring sessions are how the blast radius becomes permanent.</p><p><b>Focus next:</b> SSO moves risk from 140 weak doors to one strong one — so the one door must genuinely be strong.</p>',
  hints: ['Two options remove controls at the moment they matter most.', 'The mitigation is about making the single gate strong and short-lived.'] },
{ t: 'terminal', th: 1, title: 'Find the top offender — no tool named', kw: ['account lockout', 'password complexity'],
  sc: '<p>Lockout alarms fired all night on <code>jump01</code>. Management wants one line for the report: <i>which account collected the most failed SSH password attempts?</i> No tool is specified — build the pipeline yourself from <code>/var/log/auth.log</code>.</p>',
  q: '<p>Type a single pipeline that prints the failed-attempt counts per account, sorted so the worst offender is first (counts and account names visible).</p>',
  tname: 'analyst@jump01', tout: 'Goal: aggregate "Failed password" lines per account, highest count first.\nExample of expected output shape:\n  812 svc-old\n  310 root\n   47 deploy',
  tps: [ { label: 'pipeline', ph: 'build the counting pipeline …', acc: [ '^(?=.*grep)(?=.*failed password)(?=.*uniq)(?=.*sort).*$', '^(?=.*grep)(?=.*failed password)(?=.*awk)(?=.*sort).*$', '^(sudo\\s+)?awk\\b.*failed password.*sort.*$' ], show: 'grep "Failed password" /var/log/auth.log | sed -E \'s/.*for (invalid user )?([^ ]+) from.*/\\2/\' | sort | uniq -c | sort -rn | head' } ],
  ex: '<p><code>grep "Failed password" /var/log/auth.log | sed -E \'s/.*for (invalid user )?([^ ]+) from.*/\\2/\' | sort | uniq -c | sort -rn | head</code>: grep isolates the failures, sed keeps only the account name (its pattern also handles the “invalid user” form), sort groups equal names, <code>uniq -c</code> counts them, the final <code>sort -rn</code> puts the biggest first, and head trims the list. Variants with <code>awk</code>/<code>cut</code> for the field are equally fine. The winner of such a run is usually a dormant <b>service account</b> being sprayed — a lockout policy plus rate limiting exists exactly for this, and weak <b>password complexity</b> is what spray hopes for.</p><p><b>Focus next:</b> the counting pipeline (grep → extract → sort → uniq -c → sort -rn) answers half of all “what happened most?” log questions.</p>',
  hints: ['grep selects the lines first; then you need one field from each line.', 'uniq -c only counts neighbours — that is why sort comes before it, and sort -rn after it.'] }
);
/* ===================== check / feedback / scoring ===================== */
function evaluate(ex, st) {
  var n = 0, ok = 0, given = [], corr = [];
  var marks = {};
  var T = ex.t || ex.kind;
  function acc(nn, k, g, c) { n = nn; ok = k; given = g; corr = c; }
  if (T === 'mc') {
    var okIdx = ex.o.map(function (o, i) { return o.ok ? i : -1; }).filter(function (x) { return x >= 0; })[0];
    n = 1;
    var chosen = st.ans;
    if (chosen === okIdx) { ok = 1; marks['o' + chosen] = 'ok'; }
    else if (chosen >= 0) { marks['o' + chosen] = 'bad'; marks['o' + okIdx] = 'miss'; }
    else { marks['o' + okIdx] = 'miss'; }
    given = [chosen >= 0 ? clean(ex.o[chosen].h) : '— nothing selected —'];
    corr = [clean(ex.o[okIdx].h)];
  } else if (T === 'multi') {
    var okIdxs = ex.o.map(function (o, i) { return o.ok ? i : -1; }).filter(function (x) { return x >= 0; });
    n = okIdxs.length;
    ok = 0;
    ex.o.forEach(function (o, i) {
      var sel = st.ans.indexOf(i) >= 0;
      if (o.ok && sel) { ok++; marks['o' + i] = 'ok'; }
      else if (!o.ok && sel) { marks['o' + i] = 'bad'; }
      else if (o.ok && !sel) { marks['o' + i] = 'miss'; }
    });
    given = st.ans.length ? st.ans.map(function (i) { return clean(ex.o[i].h); }) : ['— nothing selected —'];
    corr = okIdxs.map(function (i) { return clean(ex.o[i].h); });
  } else if (T === 'slots') {
    n = ex.it.length; ok = 0;
    ex.it.forEach(function (it, i) {
      var right = it.s, got = st.ans[i];
      if (got === right) { ok++; marks['i' + i] = 'ok'; }
      else if (got === -1) { marks['i' + i] = 'miss'; }
      else { marks['i' + i] = 'bad'; }
      given.push(clean(it.h) + ' → ' + (got >= 0 ? esc(ex.sl[got].n) : 'left in bank'));
      corr.push(clean(it.h) + ' → ' + esc(ex.sl[right].n));
    });
  } else if (T === 'match') {
    n = ex.rt.length; ok = 0;
    ex.rt.forEach(function (r, i) {
      var got = st.ans[i];
      if (got === r.m) { ok++; marks['i' + i] = 'ok'; }
      else if (got === -1) { marks['i' + i] = 'miss'; }
      else { marks['i' + i] = 'bad'; }
      given.push(clean(r.h) + ' → ' + (got >= 0 ? clean(ex.lf[got].h) : 'unmatched'));
      corr.push(clean(r.h) + ' → ' + clean(ex.lf[r.m].h));
    });
  } else if (T === 'order' || T === 'rank') {
    n = ex.oseq.length; ok = 0;
    st.ans.forEach(function (ii, pos) {
      if (ii === pos) { ok++; marks['p' + pos] = 'ok'; } else { marks['p' + pos] = 'bad'; }
    });
    given = st.ans.map(function (ii) { return clean(ex.oseq[ii].h); });
    corr = ex.oseq.map(function (o) { return clean(o.h); });
  } else if (T === 'fill') {
    if (ex.fblanks.length > 1) {
      n = ex.fblanks.length; ok = 0;
      ex.fblanks.forEach(function (accs, bi) {
        var w = st.ans[bi];
        var val = w >= 0 ? st.perm.words[w] : '';
        if (val && accs.some(function (a) { return a.toLowerCase() === val.toLowerCase(); })) { ok++; marks['b' + bi] = 'ok'; }
        else if (!val) { marks['b' + bi] = 'miss'; }
        else { marks['b' + bi] = 'bad'; }
        given.push('blank ' + (bi + 1) + ': ' + (val || '— empty —'));
        corr.push('blank ' + (bi + 1) + ': ' + accs[0]);
      });
    } else {
      n = 1;
      var val = String(st.ans || '').trim();
      var good = ex.fblanks[0].some(function (a) { return a.toLowerCase() === val.toLowerCase(); });
      if (good) { ok = 1; marks['b0'] = 'ok'; } else if (!val) { marks['b0'] = 'miss'; } else { marks['b0'] = 'bad'; }
      given = [val || '— empty —'];
      corr = [ex.fblanks[0][0]];
    }
  } else if (T === 'terminal') {
    n = ex.tps.length; ok = 0;
    ex.tps.forEach(function (tp, ti) {
      var v = normCmd(st.ans[ti]);
      var good = v && tp.acc.some(function (rx) { try { return new RegExp(rx, 'i').test(v); } catch (e) { return false; } });
      if (good) { ok++; marks['t' + ti] = 'ok'; } else { marks['t' + ti] = 'bad'; }
      given.push('cmd ' + (ti + 1) + ': ' + (normCmd(st.ans[ti]) || '— empty —'));
      corr.push('cmd ' + (ti + 1) + ' accepted pattern: ' + tp.show);
    });
  } else if (T === 'branch') {
    n = ex.steps.length; ok = 0;
    ex.steps.forEach(function (s, si) {
      var c = st.ans[si];
      if (c >= 0 && s.o[c].ok) { ok++; marks['s' + si] = 'ok'; }
      else if (c >= 0) { marks['s' + si] = 'bad'; }
      else { marks['s' + si] = 'miss'; }
      given.push('Decision ' + (si + 1) + ': ' + (c >= 0 ? clean(s.o[c].h) : '— not answered —'));
      corr.push('Decision ' + (si + 1) + ': ' + clean(s.o.filter(function (o) { return o.ok; })[0].h));
    });
  } else if (T === 'spot') {
    n = ex.wrong.length; ok = 0;
    st.ans.forEach(function (li) {
      if (ex.wrong.indexOf(li) >= 0) { ok++; marks['l' + li] = 'ok'; }
      else { marks['l' + li] = 'bad'; }
    });
    ex.wrong.forEach(function (li) { if (marks['l' + li] !== 'ok') marks['l' + li] = 'miss'; });
    given = st.ans.length ? st.ans.map(function (li) { return 'line ' + (li + 1) + ': ' + clean(ex.lines[li]); }) : ['— nothing flagged —'];
    corr = ex.wrong.map(function (li) { return 'line ' + (li + 1) + ': ' + clean(ex.lines[li]); });
  } else if (T === 'log') {
    return evaluate(ex.inner, st.inner);
  }
  return { n: n, ok: ok, marks: marks, given: given, corr: corr };
}
function clean(h) { return String(h).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }
function labelOf(f) { return f >= 0.999 ? 'full' : (f > 0 ? 'partial' : 'zero'); }
function doCheck() {
  var ex = curEx(), st = curSt();
  if (st.vis === 'checked' || S.ended) return;
  var r = evaluate(ex, st);
  var earned = r2(CFG.ptsPerEx * (r.ok / r.n));
  var pen = st.hints * (CFG.ptsPerEx * 0.10);
  earned = Math.max(0, r2(earned - pen));
  st.earned = earned;
  st.marks = r.marks;
  st.snap = { given: r.given, corr: r.corr };
  st.vis = 'checked';
  S.checkPause = true;
  renderQ();
}
function applyFeedback(ex, st, feed) {
  var host = st.vis === 'checked' ? $('qHost') : null;
  if (!host) return;
  var marks = st.marks || {};
  host.querySelectorAll('.opt').forEach(function (b) {
    var m = marks['o' + b.getAttribute('data-i')];
    if (m) { b.classList.add('m-' + m); var sp = el('span', 'mark ' + m, (m === 'ok' ? '✓ correct' : m === 'bad' ? '✕ wrong' : '▲ missed')); b.appendChild(sp); }
  });
  host.querySelectorAll('.dz').forEach(function (z) {
    z.querySelectorAll('.itm').forEach(function (it) {
      var i = it.getAttribute('data-idx');
      var m = ex.t === 'match' ? marks['i' + i] : marks['i' + i];
      if (m) { it.classList.add('m-' + m); it.appendChild(el('span', 'mark ' + m, (m === 'ok' ? '✓' : m === 'bad' ? '✕' : '▲'))); }
    });
  });
  host.querySelectorAll('.bank .itm').forEach(function (it) {
    var i = it.getAttribute('data-idx');
    var m = marks['i' + i];
    if (m) { it.classList.add('m-' + m); it.appendChild(el('span', 'mark ' + m, (m === 'ok' ? '✓' : m === 'bad' ? '✕' : '▲'))); }
  });
  var seqRows = host.querySelectorAll('.seq .row');
  if (seqRows.length) {
    var curStt = st;
    curStt.ans.forEach(function (ii, pos) {
      var m = marks['p' + pos];
      if (m && seqRows[pos]) { seqRows[pos].classList.add('m-' + m); seqRows[pos].querySelector('.pos').innerHTML += (m === 'ok' ? ' ✓' : ' ✕'); }
    });
  }
  if (ex.t === 'fill' && ex.fblanks.length > 1) {
    var blanks = host.querySelectorAll('.blank');
    ex.fblanks.forEach(function (_, bi) {
      var m = marks['b' + bi];
      if (m && blanks[bi]) { blanks[bi].classList.add('m-' + m); }
    });
  }
  if (ex.t === 'spot') {
    var lns = host.querySelectorAll('.lines .ln');
    Object.keys(marks).forEach(function (k) {
      var li = parseInt(k.slice(1), 10);
      var m = marks[k];
      if (lns[li]) lns[li].classList.add('m-' + m);
    });
  }
  if (ex.t === 'branch') {
    var steps = host.querySelectorAll('.step');
    ex.steps.forEach(function (_, si) {
      var m = marks['s' + si];
      if (m && steps[si]) steps[si].classList.add('m-' + m);
    });
  }
  if (ex.t === 'fill' && ex.fblanks.length === 1 || ex.t === 'log' && ex.inner.kind === 'fill') {
    var inpM = host.querySelector('.ansblk input.fillTyped');
    if (inpM && marks['b0']) {
      inpM.style.borderColor = marks['b0'] === 'ok' ? 'var(--ok)' : marks['b0'] === 'bad' ? 'var(--bad)' : 'var(--warn)';
      inpM.style.background = marks['b0'] === 'ok' ? 'var(--okSoft)' : marks['b0'] === 'bad' ? 'var(--badSoft)' : 'var(--warnSoft)';
      var note = marks['b0'] === 'ok' ? '✓ correct' : marks['b0'] === 'bad' ? '✕ wrong' : '▲ missed';
      inpM.insertAdjacentHTML('afterend', '<span class="mark ' + marks['b0'] + '">' + note + '</span>');
    }
  }
  if (ex.t === 'terminal') {
    ex.tps.forEach(function (_, ti) {
      var inpT = $('tIn' + ti);
      var m = marks['t' + ti];
      if (inpT && m) {
        inpT.style.borderColor = m === 'ok' ? 'var(--ok)' : 'var(--bad)';
        inpT.style.background = m === 'ok' ? 'var(--okSoft)' : 'var(--badSoft)';
        inpT.insertAdjacentHTML('afterend', '<span class="mark ' + m + '">' + (m === 'ok' ? '✓ accepted' : '✕ not accepted') + '</span>');
      }
    });
  }
  var f = st.earned / CFG.ptsPerEx;
  var lab = labelOf(f);
  var fl = el('div', 'feedline ' + (lab === 'full' ? 'full' : lab === 'partial' ? 'part' : 'zero'));
  fl.innerHTML = (lab === 'full' ? '✓' : lab === 'partial' ? '~' : '✕') + ' You earned <span style="font-family:var(--mono)">' + st.earned + ' / ' + CFG.ptsPerEx + '</span> points — ' + lab + (st.hints ? ' (includes −' + (st.hints * 10) + '% hint cost)' : '');
  feed.appendChild(fl);
  var expl = el('div', 'explain', '<span class="lbl">EXPLANATION</span>' + ex.ex);
  feed.appendChild(expl);
}
function showHints(ex, st, feed) {
  /* idempotent: drop lines already on screen so repeated Hint clicks never duplicate */
  Array.prototype.slice.call(feed.querySelectorAll('.hintline')).forEach(function (n) { n.parentNode.removeChild(n); });
  for (var i = 0; i < st.hints; i++) {
    var h = el('div', 'hintline', '<b>Hint ' + (i + 1) + ' (−10%):</b> ' + esc(ex.hints[i]));
    feed.appendChild(h);
  }
}
function doHint() {
  var ex = curEx(), st = curSt();
  if (st.vis === 'checked') return;
  if (st.hints >= ex.hints.length) return;
  st.hints++;
  var feed = $('feedArea');
  showHints(ex, st, feed);
  $('btnHint').disabled = st.hints >= ex.hints.length;
}
function doRevise() {
  var ex = curEx(), st = curSt();
  if (st.vis !== 'checked') return;
  st.vis = 'new';
  st.earned = 0; st.marks = null; st.snap = null;
  S.checkPause = false;
  renderQ();
}
function doSkip() {
  var st = curSt();
  if (st.vis === 'checked' || S.ended) return;
  st.vis = 'skip';
  if (S.idx < EX.length - 1) { S.idx++; renderQ(); } else { paintHeader(); }
}
/* ===================== intro screen ===================== */
function renderIntro() {
  var scr = $('scrIntro');
  var kw = THEMES.map(function (th) {
    return '<h3><span aria-hidden="true">◇</span> ' + esc(th.n) + '</h3><div>' + th.k.map(function (k) { return '<span class="kw-chip">' + esc(k) + '</span>'; }).join('') + '</div>';
  }).join('');
  scr.innerHTML =
    '<div class="panel">' +
    '<div class="introTitle"><span aria-hidden="true">🛡</span> ' + esc(CFG.cert) + ' — ' + esc(CFG.chap) + ' <span class="diffTag ' + CFG.diffLow + '">' + CFG.diff + '</span></div>' +
    '<div class="introSub">' + (candidate.name ? 'Candidate: <b>' + esc(candidate.name) + '</b>' + (candidate.country && candidate.country !== 'ZZ' ? ' (' + esc(candidate.country) + ')' : '') + ' · ' : '') + 'Scenario-based practice exam for chapter 4.6: provisioning, SSO, MFA and privileged access tools.</div>' +
    '<div class="metaGrid">' +
    '<span class="chip"><b>' + EX.length + '</b>&nbsp;exercises</span>' +
    '<span class="chip">Timer <b>' + CFG.mins + ' min</b> (~' + Math.round(CFG.mins * 60 / EX.length) + ' s per exercise)</span>' +
    '<span class="chip">Pass mark <b>' + CFG.passMark + '%</b></span>' +
    '<span class="chip">Severity <b>' + CFG.diff + '</b></span>' +
    '<span class="chip">Max <b>' + (EX.length * CFG.ptsPerEx) + '</b> pts</span>' +
    '</div>' +
    '<ul class="instr">' +
    '<li><span class="ic">01</span><span>Every exercise has three separated blocks: <b>SCENARIO</b>, <b>QUESTION</b> and the answer area. The artefacts (logs, configs, tickets) live in the scenario block — read them, then answer.</span></li>' +
    '<li><span class="ic">02</span><span><b>Check</b> validates your answer, marks every element green (correct), red (wrong) or amber (missed), locks the answer and <b>pauses the timer in review mode</b> — the exercise and its explanation stay visible. Press <b>Next</b> to resume the clock.</span></li>' +
    '<li><span class="ic">03</span><span><b>Manual Pause</b> (top right) stops the timer but hides the question content. The two pause types are independent and can stack.</span></li>' +
    '<li><span class="ic">04</span><span><b>Skip</b> jumps to the next exercise and flags this one (amber » in the navigator). Before time runs out you can come back to any skipped exercise. Skipped exercises are <b>excluded from scoring</b> — they earn nothing but also do not count against you.</span></li>' +
    '<li><span class="ic">05</span><span>Multi-answer exercises give <b>partial credit</b>: each correct element earns its share, wrong picks earn nothing (but are shown in red). Single-answer exercises are all-or-nothing. <b>Hint</b> costs 10% of the exercise and gives a nudge, never the answer.</span></li>' +
    '<li><span class="ic">06</span><span>Score 70% or more to pass. You can revise any checked answer until the timer ends. On retake, questions and options are reshuffled.</span></li>' +
    '</ul>' +
    '<div class="themeBox"><h2 style="font-size:16px;margin:16px 0 2px">Keywords covered</h2>' + kw + '</div>' +
    '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
    '<button id="btnStart" class="btn primary" style="min-width:200px;min-height:48px">Start exam →</button>' +
    '<span style="color:var(--dim2);font-size:13.5px">The timer starts as soon as you press Start.</span>' +
    '</div></div>';
  $('btnStart').addEventListener('click', startExam);
}
function startExam() {
  S = freshState();
  S.attempt = attemptNo;
  S.order = shuffle(EX.map(function (_, i) { return i; }));
  S.st = EX.map(function () { return { vis: 'new', ans: null, earned: 0, hints: 0, marks: null, snap: null, perm: null, inner: null, revealed: 0 }; });
  buildPerms();
  $('scrIntro').classList.add('hide');
  $('scrResults').classList.add('hide');
  $('scrExam').classList.remove('hide');
  $('brandDiff').textContent = '· ' + CFG.diff;
  S.idx = 0;
  S.tleft = CFG.mins * 60;
  paintTimer();
  if (TICK) clearInterval(TICK);
  TICK = setInterval(tick, 1000);
  renderQ();
  window.scrollTo(0, 0);
}
/* ===================== finish & results ===================== */
function askFinish() {
  if (S.ended) return;
  var unchecked = 0;
  S.st.forEach(function (s) { if (s.vis !== 'checked') unchecked++; });
  if (unchecked === EX.length) { modal('Nothing answered', 'You must answer at least one exercise before the exam can be submitted. Skip and unanswered exercises are excluded from scoring, so an exam with zero answered exercises cannot be graded.', 'Back to exam', null); return; }
  modal('Finish the exam?', unchecked + ' exercise(s) are still unanswered or skipped. They will be excluded from the score — the percentage is computed over the exercises you actually answered. The timer keeps running until you confirm.', 'Submit results', function () { finishExam('submit'); });
}
function modal(title, msg, okTxt, cb) {
  $('modalTitle').textContent = title;
  $('modalMsg').textContent = msg;
  $('modalOk').textContent = okTxt;
  $('modalWrap').classList.remove('hide');
  $('modalOk').focus();
  $('modalOk').onclick = function () { $('modalWrap').classList.add('hide'); if (cb) cb(); };
  $('modalCancel').onclick = function () { $('modalWrap').classList.add('hide'); };
}
function finishExam(reason) {
  if (S.ended) return;
  S.ended = true;
  S.manualPause = false; S.checkPause = false;
  $('pauseOverlay').classList.add('hide');
  if (TICK) { clearInterval(TICK); TICK = null; }
  paintPause();
  renderResults(reason);
}
function reportScore(score, total) {
  var percent = Math.round((score / total) * 100);
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      score: score, total: total, percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch (e) { /* opened directly — nothing to report to */ }
}
function renderResults(reason) {
  var checked = 0, earnedSum = 0;
  var skipped = [];
  S.st.forEach(function (s, i) {
    if (s.vis === 'checked') { checked++; earnedSum += s.earned; }
    else skipped.push(i);
  });
  var scr = $('scrResults');
  $('scrExam').classList.add('hide');
  scr.classList.remove('hide');
  if (checked === 0) {
    scr.innerHTML = '<div class="panel"><div class="resHero"><div class="big">—</div>' +
      '<div class="verdict">NOTHING WAS ANSWERED</div></div>' +
      '<p style="text-align:center;color:var(--dim)">No exercise was completed, so nothing is counted and no score is reported. Press Retake to try again.</p>' +
      '<div style="text-align:center"><button id="btnRetake" class="btn primary">Retake exam</button></div></div>';
    $('btnRetake').addEventListener('click', function () { retake(); });
    window.scrollTo(0, 0);
    return;
  }
  var finalScore = Math.round(earnedSum);
  var unitScore = Math.round(earnedSum / CFG.ptsPerEx);
  var total = checked;
  var percent = Math.round((unitScore / total) * 100);
  var passed = percent >= CFG.passMark;
  if (!S.reported) { S.reported = true; reportScore(unitScore, total); }
  var full = 0, part = 0, zero = 0;
  S.st.forEach(function (s) { if (s.vis === 'checked') { var f = s.earned / CFG.ptsPerEx; if (f >= 0.999) full++; else if (f > 0) part++; else zero++; } });
  var stats = '<span class="chip">Answered &amp; graded <b>' + checked + '/' + EX.length + '</b></span>' +
    '<span class="chip"><span style="color:var(--ok)">✓</span> full <b>' + full + '</b></span>' +
    '<span class="chip"><span style="color:var(--warn)">~</span> partial <b>' + part + '</b></span>' +
    '<span class="chip"><span style="color:var(--bad)">✕</span> zero <b>' + zero + '</b></span>' +
    '<span class="chip"><span style="color:var(--purple)">»</span> not counted <b>' + skipped.length + '</b></span>' +
    '<span class="chip">Attempt <b>#' + S.attempt + '</b> (' + (reason === 'time' ? 'time ran out' : 'submitted') + ')</span>';
  var skipHtml = skipped.length ?
    '<div class="skipNote"><b>Not counted:</b> exercises ' + skipped.map(function (i) { return 'Q' + (S.order.indexOf(i) + 1) + ' — ' + esc(EX[i].title); }).join(' · ') +
    '.<br>These were skipped (or left unanswered) and are excluded from both the points earned and the points possible. Their explanations appear below so you can still learn from them.</div>' : '';
  var rep = S.order.map(function (exi, pos) {
    var ex = EX[exi], s = S.st[exi];
    var isSk = s.vis !== 'checked';
    var f = s.vis === 'checked' ? s.earned / CFG.ptsPerEx : 0;
    var lab = isSk ? 'skipped' : labelOf(f);
    var given = s.snap ? s.snap.given.map(function (g) { return '<div>• ' + esc(g) + '</div>'; }).join('') : '<div>• — no answer recorded —</div>';
    var corr = (isSk ? correctSummary(ex) : s.snap.corr.map(function (g) { return '<div>• ' + esc(g) + '</div>'; }).join(''));
    return '<details class="repItem"><summary><span class="rn">Q' + (pos + 1) + '</span><span class="rt">' + esc(ex.title) + '</span>' +
      '<span class="lab ' + lab + '">' + lab + '</span><span class="rp">' + (isSk ? 'excluded' : s.earned + ' / ' + CFG.ptsPerEx + ' pts') + '</span></summary>' +
      '<div class="repBody"><div class="given"><span class="k">YOUR ANSWER</span>' + given + '</div>' +
      '<div class="corr"><span class="k">CORRECT</span>' + corr + '</div>' +
      '<div class="explain" style="margin-top:10px"><span class="lbl">EXPLANATION' + (isSk ? ' — SKIPPED, STILL WORTH READING' : '') + '</span>' + ex.ex +
      '</div></div></details>';
  }).join('');
  scr.innerHTML =
    '<div class="panel ' + (passed ? 'resHero pass' : 'resHero fail') + '">' +
    '<div class="resHero"><div class="big">' + percent + '%</div>' +
    '<div class="verdict">' + (passed ? '✓ PASS' : '✕ FAIL — RETAKE REQUIRED') + '</div>' +
    '<div style="color:var(--dim);margin-top:4px;font-family:var(--mono)">' + finalScore + ' of ' + (total * CFG.ptsPerEx) + ' possible points over ' + total + ' graded exercise(s) · pass mark ' + CFG.passMark + '%</div>' +
    '<div class="resBar"><div style="width:' + Math.min(100, percent) + '%"></div></div></div>' +
    '<div class="resStats">' + stats + '</div>' +
    (passed ?
      '<div class="skipNote" style="border-color:#1f7a55;background:#0d3325;color:#a9f5d5"><b>Certificate-style result:</b> you reached the pass mark for the ' + CFG.diff + ' exam on 4.6 Identity and Access Management. ' + (part || skipped.length ? 'Review the report below to close the remaining gaps.' : 'Clean run — every graded exercise was fully correct.') + '</div>'
      :
      '<div class="skipNote" style="border-color:#8c2f44;background:#3a1220;color:#ffc9d2"><b>Retake needed:</b> you did not reach ' + CFG.passMark + '%. Work through the explanations below — each one says exactly what to focus on — then press Retake Exam. Questions and options will be reshuffled.</div>') +
    skipHtml +
    '<h3 style="margin:18px 0 4px">Per-exercise report</h3>' + rep +
    '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button id="btnRetake" class="btn primary" style="min-height:48px">Retake Exam</button></div>' +
    '</div>';
  $('btnRetake').addEventListener('click', function () { retake(); });
  window.scrollTo(0, 0);
}
function correctSummaryList(ex) {
  var t = ex.t || ex.kind;
  var out = [];
  if (t === 'mc' || t === 'multi') ex.o.forEach(function (o) { if (o.ok) out.push(clean(o.h)); });
  else if (t === 'slots') ex.it.forEach(function (it) { out.push(clean(it.h) + ' → ' + ex.sl[it.s].n); });
  else if (t === 'match') ex.rt.forEach(function (r) { out.push(clean(r.h) + ' → ' + clean(ex.lf[r.m].h)); });
  else if (t === 'order' || t === 'rank') ex.oseq.forEach(function (o, i) { out.push((i + 1) + '. ' + clean(o.h)); });
  else if (t === 'fill') ex.fblanks.forEach(function (b, i) { out.push('blank ' + (i + 1) + ': ' + b[0]); });
  else if (t === 'terminal') ex.tps.forEach(function (tp, i) { out.push('cmd ' + (i + 1) + ' example: ' + tp.show); });
  else if (t === 'branch') ex.steps.forEach(function (s, i) { out.push('Decision ' + (i + 1) + ': ' + clean(s.o.filter(function (o) { return o.ok; })[0].h)); });
  else if (t === 'spot') ex.wrong.forEach(function (li) { out.push('line ' + (li + 1) + ': ' + clean(ex.lines[li])); });
  else if (t === 'log') return correctSummaryList(ex.inner);
  return out;
}
function correctSummary(ex) {
  return correctSummaryList(ex).map(function (g) { return '<div>• ' + esc(g) + '</div>'; }).join('');
}
function correctAns(ex) {
  var t = ex.t || ex.kind;
  if (t === 'mc' || t === 'multi') { var a = []; ex.o.forEach(function (o, i) { if (o.ok) a.push(i); }); return t === 'mc' ? a[0] : a; }
  if (t === 'slots') { var m = {}; ex.it.forEach(function (it, i) { m[i] = it.s; }); return m; }
  if (t === 'match') { var m2 = {}; ex.rt.forEach(function (r, i) { m2[i] = r.m; }); return m2; }
  if (t === 'order' || t === 'rank') return ex.oseq.map(function (_, i) { return i; });
  if (t === 'fill') return ex.fblanks.map(function (b) { return b[0]; });
  if (t === 'terminal') return ex.tps.map(function (tp) { return tp.show; });
  if (t === 'branch') return ex.steps.map(function (s) { return s.o.map(function (o, i) { return o.ok ? i : -1; }).filter(function (x) { return x >= 0; })[0]; });
  if (t === 'spot') return ex.wrong.slice();
  if (t === 'log') return correctAns(ex.inner);
  return -1;
}
var attemptNo = 1;
function retake() {
  attemptNo++;
  $('scrResults').classList.add('hide');
  startExam();
}
/* ===================== website handshake ===================== */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  if (event.data.username) candidate.name = String(event.data.username).slice(0, 40);
  if (event.data.country) candidate.country = String(event.data.country).slice(0, 2);
  try { renderIntro(); } catch (e) { }
});
/* ===================== boot ===================== */
function boot() {
  S = freshState();
  S.attempt = attemptNo;
  S.order = EX.map(function (_, i) { return i; });
  S.st = EX.map(function () { return { vis: 'new', ans: null, earned: 0, hints: 0, marks: null, snap: null, perm: null, inner: null, revealed: 0 }; });
  buildPerms();
  $('btnPause').addEventListener('click', function () { setManualPause(!S.manualPause); });
  $('btnResume').addEventListener('click', function () { setManualPause(false); });
  renderIntro();
}
boot();
/* ===================== QA hooks (only with #qa in the URL) ===================== */
if (location.hash.indexOf('qa') >= 0) {
  window.__cpx = {
    state: function () { return S; },
    ex: function () { return curEx(); },
    st: function () { return curSt(); },
    correct: function () { return correctAns(curEx()); },
    setTimeLeft: function (s) { S.tleft = s; paintTimer(); },
    finish: function () { finishExam('submit'); },
    meta: CFG
  };
}
</script>
