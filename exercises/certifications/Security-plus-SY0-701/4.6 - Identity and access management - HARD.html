<div id="pauseOverlay" class="hide">
  <div class="pbox">
    <div class="t">Paused (manual)</div>
    <div class="s">Question content is hidden while the timer is stopped.<br>Press Resume to continue the exam.</div>
    <div style="margin-top:14px"><button id="btnResume" class="btn primary">Resume exam</button></div>
  </div>
</div>
<script>
'use strict';
/* ===================== configuration & state ===================== */
var CFG = {
  mins: 75, diff: 'MEDIUM', diffLow: 'medium',
  cert: 'CompTIA Security+ (SY0-701)', chap: '4.6 Identity and Access Management',
  topicId: 'security-plus', passMark: 70, ptsPerEx: 10
};
/* keep engine config in lockstep with the per-file metadata block (spec 6.1: metadata must be true).
   This is what makes the HARD file run 60 min / 'HARD' while MEDIUM runs 75 min / 'MEDIUM'. */
try {
  var __meta = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
  if (__meta.estimatedMinutes) CFG.mins = __meta.estimatedMinutes;
  if (__meta.difficulty) { CFG.diffLow = __meta.difficulty; CFG.diff = String(__meta.difficulty).toUpperCase(); }
} catch (e) { /* metadata missing — defaults stay */ }
var THEMES = [];
var EX = [];
var S = null;
var TICK = null;
var candidate = { name: '', country: '' };

function freshState() {
  return {
    order: [], st: [], idx: 0, tleft: CFG.mins * 60,
    manualPause: false, checkPause: false, ended: false, reported: false, attempt: 1, startAt: 0
  };
}
/* ===================== small utils ===================== */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function shuffle(a) { var r = a.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
function r2(n) { return Math.round(n * 100) / 100; }
function fmtTime(s) { s = Math.max(0, s); var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
function normCmd(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function curEx() { return EX[S.order[S.idx]]; }
function curSt() { return S.st[S.order[S.idx]]; }
function exState(exi) {
  var st = S.st[exi];
  if (!st.ans) {
    var ex = EX[exi];
    if (ex.t === 'multi') st.ans = [];
    else if (ex.t === 'slots') { st.ans = {}; ex.it.forEach(function (it, i) { st.ans[i] = -1; }); }
    else if (ex.t === 'match') { st.ans = {}; ex.rt.forEach(function (r, i) { st.ans[i] = -1; }); }
    else if (ex.t === 'order' || ex.t === 'rank') st.ans = st.perm.items.slice();
    else if (ex.t === 'fill') st.ans = (ex.fblanks.length > 1) ? ex.fblanks.map(function () { return -1; }) : '';
    else if (ex.t === 'terminal') st.ans = ex.tps.map(function () { return ''; });
    else if (ex.t === 'branch') { st.ans = ex.steps.map(function () { return -1; }); st.revealed = 0; }
    else if (ex.t === 'spot') st.ans = [];
    else if (ex.t === 'log') { st.ans = null; if (!st.inner) st.inner = { ans: null }; initAns(ex.inner, st.inner, ex); }
    else st.ans = -1;
  }
  return st;
}
function initAns(ex, st) {
  var t = ex.t || ex.kind;
  if (t === 'multi') st.ans = [];
  else if (t === 'fill') st.ans = (ex.fblanks.length > 1) ? ex.fblanks.map(function () { return -1; }) : '';
  else st.ans = -1;
}
function buildPerms() {
  EX.forEach(function (ex, i) {
    var p = { o: null, items: null, right: null, bank: null, lines: null };
    if (ex.t === 'mc' || ex.t === 'multi') p.o = shuffle(ex.o.map(function (_, k) { return k; }));
    if (ex.t === 'slots') p.items = shuffle(ex.it.map(function (_, k) { return k; }));
    if (ex.t === 'match') p.right = shuffle(ex.rt.map(function (_, k) { return k; }));
    if (ex.t === 'order' || ex.t === 'rank') {
      var idxs = ex.oseq.map(function (_, k) { return k; });
      var sh = idxs.slice(); while (sh.every(function (v, k) { return v === idxs[k]; })) sh = shuffle(idxs);
      p.items = sh;
    }
    if (ex.t === 'fill' && ex.fblanks.length > 1) {
      var words = [];
      ex.fblanks.forEach(function (b) { words.push(b[0]); });
      (ex.fbank || []).forEach(function (w) { words.push(w); });
      p.bank = shuffle(words.map(function (_, k) { return k; }));
      p.words = words;
    }
    if (ex.t === 'spot') p.lines = ex.lines.map(function (_, k) { return k; });
    if (ex.t === 'log') {
      var inn = ex.inner;
      if (inn.kind === 'mc' || inn.kind === 'multi') p.o = shuffle(inn.o.map(function (_, k) { return k; }));
      if (inn.kind === 'fill' && inn.fblanks.length > 1) {
        var words2 = [];
        inn.fblanks.forEach(function (b) { words2.push(b[0]); });
        (inn.fbank || []).forEach(function (w) { words2.push(w); });
        p.bank = shuffle(words2.map(function (_, k) { return k; }));
        p.words = words2;
      }
    }
    S.st[i].perm = p;
  });
}
/* ===================== timer ===================== */
function tick() {
  if (S.ended || S.manualPause || S.checkPause) return;
  S.tleft--;
  if (S.tleft <= 0) { S.tleft = 0; paintTimer(); finishExam('time'); return; }
  paintTimer();
}
function paintTimer() {
  var t = $('timerTxt'); t.textContent = fmtTime(S.tleft);
  var box = $('timerBox');
  box.classList.remove('warn', 'danger');
  if (S.tleft <= CFG.mins * 60 * 0.1) box.classList.add('danger');
  else if (S.tleft <= CFG.mins * 60 * 0.25) box.classList.add('warn');
  box.setAttribute('aria-label', 'Time remaining ' + fmtTime(S.tleft));
}
function paintPause() {
  var w = $('pauseState'); w.innerHTML = '';
  if (S.manualPause) { var a = el('span', 'ind manual', '<span aria-hidden="true">✕</span> Paused (manual)'); w.appendChild(a); }
  if (S.checkPause) { var b = el('span', 'ind review', '<span aria-hidden="true">◷</span> Timer paused — review mode'); w.appendChild(b); }
  var pb = $('btnPause');
  pb.textContent = S.manualPause ? 'Resume' : 'Pause';
  pb.setAttribute('aria-pressed', S.manualPause ? 'true' : 'false');
}
function setManualPause(on) {
  if (S.ended) return;
  S.manualPause = on;
  $('pauseOverlay').classList.toggle('hide', !on);
  paintPause();
}
/* ===================== header paint ===================== */
function themeOf(ex) { return THEMES[ex.th] ? THEMES[ex.th].n : 'General'; }
function paintHeader() {
  var done = 0, exTotal = EX.length;
  S.st.forEach(function (s) { if (s.vis !== 'new') done++; });
  var pct = Math.round((done / exTotal) * 100);
  $('progressBar').style.width = pct + '%';
  $('progressWrap').setAttribute('aria-valuenow', pct);
  var earned = 0, counted = 0;
  S.st.forEach(function (s) { if (s.vis === 'checked') { earned += s.earned; counted++; } });
  $('scoreTxt').textContent = (Math.round(earned * 10) / 10) + (counted ? ' / ' + (counted * CFG.ptsPerEx) : '');
  var tr = $('themesRow'); tr.innerHTML = '';
  THEMES.forEach(function (th, ti) {
    var tot = 0, dn = 0;
    S.order.forEach(function (exi) { if (EX[exi].th === ti) { tot++; var s = S.st[exi]; if (s.vis !== 'new') dn++; } });
    var c = el('span', 'tchip', esc(th.n) + ' <b>' + dn + '/' + tot + '</b>');
    tr.appendChild(c);
  });
  var ng = $('navGrid'); ng.innerHTML = '';
  S.order.forEach(function (exi, pos) {
    var s = S.st[exi];
    var cls = 'navq';
    var g = '';
    if (s.vis === 'checked') {
      var f = s.earned / CFG.ptsPerEx;
      if (f >= 0.999) { cls += ' ok'; g = '<span class="g" aria-hidden="true">✓</span>'; }
      else if (f > 0) { cls += ' part'; g = '<span class="g" aria-hidden="true">~</span>'; }
      else { cls += ' bad'; g = '<span class="g" aria-hidden="true">✕</span>'; }
    } else if (s.vis === 'skip') { cls += ' skip'; g = '<span class="g" aria-hidden="true">»</span>'; }
    if (pos === S.idx) cls += ' cur';
    var b = el('button', cls, String(pos + 1) + g);
    b.type = 'button';
    b.setAttribute('aria-label', 'Question ' + (pos + 1) + ' — ' + (s.vis === 'checked' ? (f >= 0.999 ? 'checked, correct' : (f > 0 ? 'checked, partial' : 'checked, wrong')) : (s.vis === 'skip' ? 'skipped' : 'not answered')));
    b.addEventListener('click', function () { goTo(pos); });
    ng.appendChild(b);
  });
}
function goTo(pos) {
  if (S.ended) return;
  /* Check-pause only ends when the student MOVES to another exercise (Next, Back or navigator).
     Clicking the current question's navigator tile must not resume the clock (spec Step 2). */
  if (S.checkPause && pos !== S.idx) S.checkPause = false;
  S.idx = pos;
  renderQ();
}
/* ===================== exercise renderers ===================== */
function artHtml(ex) {
  if (!ex.art) return '';
  return ex.art.map(function (a) {
    return '<div class="art"><div class="albl"><span aria-hidden="true">▤</span>' + esc(a.l) + '</div><pre class="pre">' + a.pre + '</pre></div>';
  }).join('');
}
function blkScenario(ex) {
  return '<div class="blk scenario"><span class="lbl">SCENARIO</span><div>' + ex.sc + '</div></div>';
}
function blkQuestion(ex) {
  return '<div class="blk question"><span class="lbl">QUESTION</span><div>' + ex.q + '</div></div>';
}
function answersLabel(t) {
  return {
    mc: 'CHOOSE ONE', multi: 'SELECT ALL THAT APPLY', slots: 'DRAG EACH ITEM INTO ITS BUCKET (or click item, then bucket)',
    match: 'MATCH THE PAIRS (drag a right-side item onto a left row)', order: 'PUT THE STEPS IN THE RIGHT ORDER (drag or use the arrows)',
    rank: 'RANK BY RISK — 1 = MOST SEVERE (drag or use the arrows)', fill: 'FILL THE BLANKS FROM THE WORD BANK',
    terminal: 'TYPE THE COMMAND(S)', spot: 'CLICK THE LINE(S) THAT CONTAIN THE MISTAKE', branch: 'CHOOSE ONE FOR EACH STEP', log: 'ANSWER BELOW'
  }[t] || 'ANSWER';
}
function markSpan(cls, word) { return '<span class="mark ' + cls + '">' + (cls === 'ok' ? '✓ ' : cls === 'bad' ? '✕ ' : '▲ ') + word + '</span>'; }

function renderQ() {
  var ex = curEx(), st = exState(S.order[S.idx]);
  paintHeader(); paintPause();
  var host = $('qHost'); host.innerHTML = '';
  var card = el('div', 'qcard');
  var head = '<div class="qhead"><span class="qnum">Q' + (S.idx + 1) + '/' + EX.length + '</span>' +
    '<span class="chip"><span aria-hidden="true">◈</span>' + esc(themeOf(ex)) + '</span>' +
    '<span class="qtitle">' + esc(ex.title) + '</span></div>';
  card.innerHTML = head + blkScenario(ex) + artHtml(ex) + blkQuestion(ex);
  var ans = el('div', 'blk ansblk');
  ans.innerHTML = '<span class="lbl">' + answersLabel(ex.t) + '</span>';
  var area = el('div');
  ans.appendChild(area);
  card.appendChild(ans);
  var acts = el('div', 'acts');
  var bCheck = el('button', 'btn primary', 'Check');
  bCheck.type = 'button'; bCheck.id = 'btnCheck';
  var bRev = el('button', 'btn', 'Revise');
  bRev.type = 'button'; bRev.id = 'btnRevise';
  var bHint = el('button', 'btn warnbtn', 'Hint (−10%)');
  bHint.type = 'button'; bHint.id = 'btnHint';
  var bSkip = el('button', 'btn danger', 'Skip');
  bSkip.type = 'button'; bSkip.id = 'btnSkip';
  acts.appendChild(bCheck); acts.appendChild(bRev); acts.appendChild(bHint); acts.appendChild(bSkip);
  var sp = el('span', 'spacer'); acts.appendChild(sp);
  var lockNote = el('span', 'locknote');
  acts.appendChild(lockNote);
  card.appendChild(acts);
  var feed = el('div'); feed.id = 'feedArea'; card.appendChild(feed);
  host.appendChild(card);
  var nav = el('div', 'navrow');
  var bBack = el('button', 'btn sm', '← Back'); bBack.type = 'button'; bBack.id = 'btnBack';
  var pos = el('span', 'qpos', 'Question ' + (S.idx + 1) + ' of ' + EX.length);
  var bNext = el('button', 'btn sm primary', 'Next →'); bNext.type = 'button'; bNext.id = 'btnNext';
  var bFin = el('button', 'btn sm', 'Finish exam'); bFin.type = 'button'; bFin.id = 'btnFinish';
  nav.appendChild(bBack); nav.appendChild(pos); nav.appendChild(bFin); nav.appendChild(bNext);
  host.appendChild(nav);

  var REN = { mc: rMC, multi: rMulti, slots: rSlots, match: rMatch, order: rOrder, rank: rOrder, fill: rFill, terminal: rTerm, branch: rBranch, spot: rSpot, log: rLog };
  REN[ex.t](ex, st, area);

  bCheck.addEventListener('click', function () { doCheck(); });
  bRev.addEventListener('click', function () { doRevise(); });
  bHint.addEventListener('click', function () { doHint(); });
  bSkip.addEventListener('click', function () { doSkip(); });
  bBack.addEventListener('click', function () { if (S.idx > 0) goTo(S.idx - 1); });
  bNext.addEventListener('click', function () {
    if (S.checkPause) S.checkPause = false;
    if (S.idx < EX.length - 1) { S.idx++; renderQ(); }
  });
  bFin.addEventListener('click', askFinish);
  bBack.disabled = (S.idx === 0); /* honest state: there is nothing before Q1 */
  var checked = (st.vis === 'checked');
  bCheck.disabled = checked;
  bRev.disabled = !checked;
  bHint.disabled = checked || st.hints >= (ex.hints ? ex.hints.length : 0);
  bSkip.disabled = checked;
  if (checked) { lockNote.textContent = 'Answer locked — use Revise to change it (timer rule applies again on the next Check).'; applyFeedback(ex, st, feed); }
  if (st.hints > 0) showHints(ex, st, feed);
  var first = area.querySelector('button,input,[tabindex]');
  if (first && !S.manualPause) { try { first.focus({ preventScroll: false }); } catch (e) { } }
}
/* ---- choice types ---- */
function optBtn(kind, o, dsIdx) {
  var b = el('button', 'opt');
  b.type = 'button';
  b.setAttribute('data-i', dsIdx);
  b.setAttribute(kind === 'multi' ? 'role' : 'role', kind === 'multi' ? 'checkbox' : 'radio');
  b.setAttribute('aria-checked', 'false');
  b.innerHTML = '<span class="key" aria-hidden="true">' + (kind === 'multi' ? '▣' : '◯') + '</span><span class="otxt">' + o.h + '</span>';
  return b;
}
function rMC(ex, st, area) {
  var wrap = el('div', 'opts'); wrap.setAttribute('role', 'radiogroup'); wrap.setAttribute('aria-label', 'Answer options');
  st.perm.o.forEach(function (oi) {
    var b = optBtn('mc', ex.o[oi], oi);
    if (st.ans === oi) { b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); }
    if (st.vis === 'checked') b.disabled = true;
    b.addEventListener('click', function () {
      if (st.vis === 'checked') return;
      st.ans = oi;
      wrap.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('sel'); x.setAttribute('aria-checked', 'false'); });
      b.classList.add('sel'); b.setAttribute('aria-checked', 'true');
    });
    wrap.appendChild(b);
  });
  area.appendChild(wrap);
}
function rMulti(ex, st, area) {
  var wrap = el('div', 'opts'); wrap.setAttribute('role', 'group'); wrap.setAttribute('aria-label', 'Answer options, select all that apply');
  st.perm.o.forEach(function (oi) {
    var b = optBtn('multi', ex.o[oi], oi);
    if (st.ans.indexOf(oi) >= 0) { b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); b.querySelector('.key').textContent = '☑'; }
    if (st.vis === 'checked') b.disabled = true;
    b.addEventListener('click', function () {
      if (st.vis === 'checked') return;
      var p = st.ans.indexOf(oi);
      if (p >= 0) { st.ans.splice(p, 1); b.classList.remove('sel'); b.setAttribute('aria-checked', 'false'); b.querySelector('.key').textContent = '▣'; }
      else { st.ans.push(oi); b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); b.querySelector('.key').textContent = '☑'; }
    });
    wrap.appendChild(b);
  });
  area.appendChild(wrap);
}
/* ---- drag & drop: slots + match share a helper ---- */
function dndItem(o, idx, kind) {
  var b = el('button', 'itm');
  b.type = 'button'; b.draggable = true; b.setAttribute('data-idx', idx);
  b.innerHTML = o.h;
  b.setAttribute('aria-label', 'Item: ' + o.h.replace(/<[^>]*>/g, '').slice(0, 80) + '. Press Enter to pick it up, then activate a drop zone.');
  b.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(idx)); e.dataTransfer.effectAllowed = 'move'; document.querySelectorAll('.dz').forEach(function (z) { z.classList.add('drop-hot'); }); });
  b.addEventListener('dragend', function () { document.querySelectorAll('.dz').forEach(function (z) { z.classList.remove('drop-hot', 'over'); }); });
  b.addEventListener('click', function () {
    var cur = document.querySelector('.itm.picked');
    if (cur === b) { b.classList.remove('picked'); return; }
    document.querySelectorAll('.itm.picked').forEach(function (x) { x.classList.remove('picked'); });
    b.classList.add('picked');
  });
  return b;
}
function zoneAccept(zone, assignFn) {
  zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
  zone.addEventListener('drop', function (e) {
    e.preventDefault(); zone.classList.remove('over');
    var idx = parseInt(e.dataTransfer.getData('text/plain'), 10);
    if (!isNaN(idx)) assignFn(idx);
  });
}
function rSlots(ex, st, area) {
  var grid = el('div', 'dz-area' + (ex.sl.length > 2 ? ' slots3' : ''));
  var zones = [];
  ex.sl.forEach(function (sl, si) {
    var z = el('div', 'dz'); z.setAttribute('data-slot', si);
    z.innerHTML = '<h4>' + esc(sl.n) + '</h4><div class="zbody"></div>';
    zones.push(z); grid.appendChild(z);
  });
  area.appendChild(grid);
  var bl = el('div', null, '<div style="font-size:12.5px;color:var(--dim2);margin:10px 0 4px;font-weight:700;letter-spacing:.6px">ITEMS</div>');
  var bank = el('div', 'bank'); bank.setAttribute('aria-label', 'Item bank');
  bl.appendChild(bank); area.appendChild(bl);
  function paint() {
    zones.forEach(function (z, si) {
      var zb = z.querySelector('.zbody'); zb.innerHTML = '';
      st.perm.items.forEach(function (ii) {
        if (st.ans[ii] === si) {
          var it = dndItem(ex.it[ii], ii, 'slot');
          if (st.vis === 'checked') it.disabled = true;
          zb.appendChild(it);
        }
      });
    });
    bank.innerHTML = '';
    st.perm.items.forEach(function (ii) {
      if (st.ans[ii] === -1) {
        var it = dndItem(ex.it[ii], ii, 'slot');
        if (st.vis === 'checked') it.disabled = true;
        bank.appendChild(it);
      }
    });
  }
  zones.forEach(function (z, si) {
    zoneAccept(z, function (idx) { if (st.vis === 'checked') return; st.ans[idx] = si; paint(); });
    z.addEventListener('click', function (e) {
      var cur = document.querySelector('.itm.picked');
      if (cur && !z.contains(cur)) { if (st.vis !== 'checked') { st.ans[parseInt(cur.getAttribute('data-idx'), 10)] = si; paint(); } }
    });
  });
  bank.addEventListener('click', function (e) {
    var cur = document.querySelector('.itm.picked');
    if (cur && !bank.contains(cur)) { if (st.vis !== 'checked') { st.ans[parseInt(cur.getAttribute('data-idx'), 10)] = -1; paint(); } }
  });
  paint();
}
function rMatch(ex, st, area) {
  var wrap = el('div', null);
  var rows = [];
  ex.lf.forEach(function (l, li) {
    var z = el('div', 'dz'); z.setAttribute('data-slot', li);
    z.innerHTML = '<h4>' + l.h + '</h4><div class="zbody"></div>';
    rows.push(z); wrap.appendChild(z);
    zoneAccept(z, function (idx) { if (st.vis === 'checked') return; st.ans[idx] = li; paint(); });
    z.addEventListener('click', function (e) {
      var cur = document.querySelector('.itm.picked');
      if (cur && !z.contains(cur)) { if (st.vis !== 'checked') { st.ans[parseInt(cur.getAttribute('data-idx'), 10)] = li; paint(); } }
    });
  });
  area.appendChild(wrap);
  var bl = el('div', null, '<div style="font-size:12.5px;color:var(--dim2);margin:10px 0 4px;font-weight:700;letter-spacing:.6px">RIGHT-SIDE ITEMS</div>');
  var bank = el('div', 'bank'); bl.appendChild(bank); area.appendChild(bl);
  function paint() {
    rows.forEach(function (z, li) {
      var zb = z.querySelector('.zbody'); zb.innerHTML = '';
      st.perm.right.forEach(function (ri) {
        if (st.ans[ri] === li) { var it = dndItem(ex.rt[ri], ri, 'match'); if (st.vis === 'checked') it.disabled = true; zb.appendChild(it); }
      });
    });
    bank.innerHTML = '';
    st.perm.right.forEach(function (ri) {
      if (st.ans[ri] === -1) { var it = dndItem(ex.rt[ri], ri, 'match'); if (st.vis === 'checked') it.disabled = true; bank.appendChild(it); }
    });
  }
  paint();
}
/* ---- ordering (order + rank) ---- */
function rOrder(ex, st, area) {
  var wrap = el('div', 'seq');
  function paint() {
    wrap.innerHTML = '';
    st.ans.forEach(function (ii, pos) {
      var row = el('div', 'row');
      row.draggable = true; row.setAttribute('data-idx', ii);
      row.innerHTML = '<span class="pos" aria-hidden="true">' + (pos + 1) + '</span><span class="txt">' + ex.oseq[ii].h + '</span>' +
        '<span class="mv"><button type="button" aria-label="Move item ' + (pos + 1) + ' up">↑</button><button type="button" aria-label="Move item ' + (pos + 1) + ' down">↓</button></span>';
      if (st.vis === 'checked') { row.draggable = false; row.querySelectorAll('button').forEach(function (b) { b.disabled = true; }); }
      var up = row.querySelector('button'), dn = row.querySelectorAll('button')[1];
      up.addEventListener('click', function () { if (st.vis !== 'checked' && pos > 0) { var t = st.ans[pos - 1]; st.ans[pos - 1] = st.ans[pos]; st.ans[pos] = t; paint(); } });
      dn.addEventListener('click', function () { if (st.vis !== 'checked' && pos < st.ans.length - 1) { var t = st.ans[pos + 1]; st.ans[pos + 1] = st.ans[pos]; st.ans[pos] = t; paint(); } });
      row.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', String(pos)); });
      row.addEventListener('dragover', function (e) { e.preventDefault(); row.classList.add('dragover'); });
      row.addEventListener('dragleave', function () { row.classList.remove('dragover'); });
      row.addEventListener('drop', function (e) {

    function paint() {
      txt.querySelectorAll('.blank').forEach(function (bk) {

        chip.disabled = used;
        chip.setAttribute('aria-label', 'Word: ' + st.perm.words[wi] + (used ? ' (used)' : ''));
        chip.addEventListener('click', function () {
          if (st.vis === 'checked') return;
          var target = st.ans.indexOf(-1);

}

function rBranch(ex, st, area) {

EX.push(
{ t: 'log', th: 2, title: 'The refresh token that travelled too fast', kw: ['OAuth 2.0', 'access token', 'refresh token', 'federation / trust'],
  sc: '<p>You are the on-call identity engineer. The IdP log shows an OAuth session for <code>svc-report</code> that does not add up. Read the log with the filter, then answer.</p>',
  q: '<p>Select the <b>two</b> statements that correctly explain the log.</p>',
  lines: [
    '<span class="ts">21:02:11</span> <span class="host">idp01</span> GRANT auth_code user=<span class="host">j.moreau</span> client=svc-report scope=files.read',
    '<span class="ts">21:02:12</span> <span class="host">idp01</span> TOKEN issued access_token (exp 3600s) + refresh_token to client=svc-report',
    '<span class="ts">21:44:38</span> <span class="host">idp01</span> REFRESH refresh_token[*****aa1] client=svc-report from 10[.]44[.]7[.]81 (Amsterdam) → new access_token',
    '<span class="ts">21:46:02</span> <span class="host">idp01</span> REFRESH refresh_token[*****aa1] client=svc-report from 10[.]44[.]7[.]81 (Amsterdam) → DENIED token already used',
    '<span class="ts">21:46:19</span> <span class="host">idp01</span> REFRESH refresh_token[*****bb7] client=svc-report from 203[.]0[.]113[.]44 (Lagos) → new access_token ISSUED',
    '<span class="ts">21:46:20</span> <span class="host">idp01</span> WARN refresh rotation conflict for user=<span class="host">j.moreau</span> — two live access_tokens, 4600 km apart in 41 min'
  ],
  inner: { kind: 'multi', o: [ { h: 'A refresh token was replayed — someone captured it and raced the legitimate client', ok: true }, { h: 'The identity provider should revoke the whole token family and force re-authentication, not keep issuing tokens to the far location', ok: true }, { h: 'This is normal: the user commutes between Amsterdam and Lagos every evening' }, { h: 'The auth code grant itself failed, so no token was ever issued' }, { h: 'Access tokens must be valid for at least 24 hours or apps break — that is the root cause' } ] },
  ex: '<p>The same <b>refresh token</b> was used twice in 41 minutes from two locations thousands of kilometres apart. With refresh-token rotation the second use of an already-rotated token should kill the family — here the IdP issued a new token to the distant caller anyway, which is exactly what an attacker who stole the <b>refresh token</b> (or the <b>access token</b> alongside it) needs. Correct response: revoke the token family, invalidate sessions, force re-login. No failed grant appears in the log; short token lifetimes are a defence, not the problem; and no commute explains 41 minutes.</p><p><b>Focus next:</b> token replay shows up as one token, two lives — and rotation plus immediate revocation is the fix.</p>',
  hints: ['Compare the two REFRESH lines: same token suffix, different places, different outcome.', 'A token family that keeps issuing after a replay is helping the thief.'] },
{ t: 'multi', th: 2, title: 'Why the SP rejects this assertion', kw: ['SAML assertion', 'identity provider (IdP)', 'service provider (SP)', 'SAML 2.0'],
  sc: '<p>Federated logins to the payroll SP fail for everyone since the IdP upgrade. You decode the SAML assertion that reaches the SP (slightly shortened). Signature validation itself passes.</p>',
  q: '<p>Select the <b>two</b> statements that explain the failure.</p>',
  art: [ { l: 'Decoded SAML assertion (excerpt)', pre: '&lt;saml2:Assertion Version="2.0" IssueInstant="2026-03-02T08:59:58Z"&gt;\n  &lt;saml2:Issuer&gt;hxxps://idp.corp.northwind.internal/sso&lt;/saml2:Issuer&gt;\n  &lt;saml2:Subject&gt;&lt;saml2:NameID&gt;j.moreau@northwind.example&lt;/saml2:NameID&gt;&lt;/saml2:Subject&gt;\n  &lt;saml2:Conditions NotBefore="2026-03-02T09:14:58Z"\n                NotOnOrAfter="2026-03-02T09:05:58Z"&gt;\n    &lt;saml2:AudienceRestriction&gt;\n      &lt;saml2:Audience&gt;hxxps://payroll-old.northwind.example/sp&lt;/saml2:Audience&gt;\n    &lt;/saml2:AudienceRestriction&gt;\n  &lt;/saml2:Conditions&gt;\n&lt;/saml2:Assertion&gt;' } ],
  o: [ { h: 'The audience does not match the SP’s entity ID, so the SP must reject the assertion', ok: true }, { h: 'NotBefore lies 15 minutes in the future, so the assertion is not yet valid when it arrives', ok: true }, { h: 'The assertion is fine — a valid signature overrides everything else' }, { h: 'SAML assertions carry no validity window, so time can never be the problem' }, { h: 'NameID formats are optional, so the subject cannot cause a rejection' } ],
  ex: '<p>Two hard failures hide in the conditions. The <b>audience restriction</b> names <code>payroll-old…</code> while the receiving SP is the migrated payroll service — a SP must reject an <b>assertion</b> issued for someone else. And <code>NotBefore = 09:14:58</code> is 15 minutes after issuance: between clock drift and a wrong setting on the IdP, the assertion is “not yet valid” on arrival; SPs apply a small skew allowance only. A valid signature proves who wrote the assertion — it cannot fix a wrong audience or window. Assertions always carry validity windows, and the subject/NameID is well-formed here.</p><p><b>Focus next:</b> the four SP checks: signature, issuer trust, audience, validity window (NotBefore / NotOnOrAfter).</p>',
  hints: ['Compare the Audience value with the SP that is actually receiving this assertion.', 'When does the assertion become valid — and when did the user click “log in”?'] },
{ t: 'slots', th: 3, title: 'Name the identity attack in each snippet', kw: ['MFA fatigue (push bombing)', 'SIM swap', 'privilege escalation', 'credential stuffing'],
  sc: '<p>Six excerpts from this week’s identity telemetry. Each one is a different known attack pattern against authentication.</p>',
  q: '<p>Drag each snippet onto the attack pattern it shows.</p>',
  sl: [ { n: 'Password spray' }, { n: 'Credential stuffing' }, { n: 'MFA fatigue / push bombing' }, { n: 'Token replay' }, { n: 'Horizontal privilege escalation' }, { n: 'SIM swap' } ],
  it: [ { h: 'One IP tries “Winter2026!” against 900 usernames at 2 attempts each', s: 0 }, { h: '5,000 leaked username/password pairs replayed against the VPN, 41 hits', s: 1 }, { h: '22 push prompts in 4 minutes; user approves attempt #19', s: 2 }, { h: 'A bearer token captured yesterday is replayed from another country', s: 3 }, { h: 'Helpdesk agent uses her reset rights to open a colleague’s mailbox', s: 4 }, { h: 'Attacker ports the CEO’s number, then intercepts the SMS OTP', s: 5 } ],
  ex: '<p><b>Password spray</b>: one or two guesses across many usernames — low-and-slow to dodge lockouts. <b>Credential stuffing</b>: reused passwords from a third-party breach replayed at scale. <b>MFA fatigue (push bombing)</b>: prompt spam until a user approves. <b>Token replay</b>: a stolen session/bearer token reused while it is still valid — no password involved. <b>Horizontal privilege escalation</b>: reaching <i>another user’s</i> data at the same level, here through abused reset rights (vertical escalation would climb to admin). <b>SIM swap</b>: the phone number is ported to the attacker’s SIM, so SMS codes land in their hands — a core <b>SMS weakness</b>.</p><p><b>Focus next:</b> anchor each pattern to its tell: breadth = spray, reused pairs = stuffing, prompt spam = fatigue, token twice = replay, peer’s data = horizontal, ported number = SIM swap.</p>',
  hints: ['Spray spreads few guesses over many names; stuffing spreads many pairs over one login form.', 'One snippet is about abuse of a legitimate permission against a peer — same level, different user.'] },
{ t: 'order', th: 2, title: 'The OAuth authorization-code flow', kw: ['OAuth 2.0', 'access token', 'refresh token'],
  sc: '<p>The wiki page for “how our apps get tokens” lost its ordering after an import. Rebuild the canonical <b>OAuth 2.0</b> authorization-code flow.</p>',
  q: '<p>Put the steps in the correct order.</p>',
  oseq: [ { h: 'App redirects the browser to the authorization endpoint with scope and redirect_uri' }, { h: 'User authenticates at the IdP (password plus MFA)' }, { h: 'User consents to the requested scope' }, { h: 'IdP sends an authorization code to the redirect_uri' }, { h: 'App exchanges code + client secret for tokens (backend call)' }, { h: 'App calls the API with the access token' }, { h: 'When the access token expires, the app uses the refresh token' } ],
  ex: '<p>In the authorization-code flow the browser first goes to the <b>authorization endpoint</b>; the user authenticates (with <b>MFA</b>) and consents; the IdP returns a short-lived <b>authorization code</b> to the exact redirect URI; the app — server-side, with its client secret — trades code for an <b>access token</b> and <b>refresh token</b>; the access token calls the API; and the refresh token renews access silently later. The code itself is useless without the secret, which is why the exchange is a backend call.</p><p><b>Focus next:</b> browser leg = code, backend leg = tokens, API leg = access token, renewal = refresh token.</p>',
  hints: ['Consent can only happen after the user has authenticated.', 'The client secret never travels through the browser leg.'] },
{ t: 'mc', th: 2, title: 'Which token says who the user is?', kw: ['OpenID Connect (OIDC)', 'access token', 'OAuth 2.0'],
  sc: '<p>Your web app moved to OIDC for SSO. After login it receives three objects. A developer asks which one the app should read to learn <i>who</i> signed in, and why it is different from what it sends to the API.</p>',

  ex: '<p><b>OpenID Connect</b> adds an identity layer on top of <b>OAuth 2.0</b>: the <b>ID token</b> is a signed object whose claims name the authenticated user (subject, email, issuer, audience, expiry). The <b>access token</b> answers a different question — what the app may do at the API — and the <b>refresh token</b> only renews access; it is not the identity document. LDAP is a directory protocol, not part of the OIDC token flow.</p><p><b>Focus next:</b> identity = ID token (OIDC); permission = access token (OAuth); renewal = refresh token.</p>',
  hints: ['OIDC was invented precisely because OAuth alone could not answer “who is the user”.', 'One of the three tokens is a JWT whose claims describe a person.'] },
{ t: 'branch', th: 4, title: 'A vault admin account is awake at 03:00', kw: ['PAM suite', 'credential vault', 'session recording / broker', 'break-glass account', 'elevation control (sudo / UAC)'],

  ex: '<p>Privileged account response keeps evidence intact: freeze checkouts and <b>disable</b> (deleting destroys the audit trail), kill sessions via the <b>session broker</b> rather than rebooting (reboot wipes volatile evidence), then scope with the artefacts a <b>PAM suite</b> exists for: recordings, checkout history, <b>elevation/sudo</b> logs. Recovery means the stolen secret dies (rotation), rights return to <b>just-in-time</b>, and the recordings are reviewed before the incident closes. Standing admin “while we investigate” is how the same intruder stays in.</p><p><b>Focus next:</b> preserve, terminate in a controlled way, scope from logs, rotate — in that order.</p>',
