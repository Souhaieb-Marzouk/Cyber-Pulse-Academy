<script>
(function(){
"use strict";

/* =========================================================================
   DATA — 30 HARD exercises for CompTIA Security+ Chapter 1.4
   Cryptographic solutions: PKI, encryption, obfuscation, hashing,
   digital signatures, blockchain.
   No scenario, dataset, artefact or question is shared with the MEDIUM file.
   ========================================================================= */
var EX = [
{id:"h1",t:"MCQ",pts:1,theme:"PKI and Certificates",
 s:"A vendor host api.delta-claims.example works in every browser except yours. You cannot change the vendor. You pull the chain from the server, including its name constraints extension.",
 a:"Leaf: CN=api.delta-claims.example\n  Issuer: CN=Delta Partner Issuing CA\n  Validity: 2024-06-01 to 2026-06-01\n  extendedKeyUsage: serverAuth\nIntermediate: CN=Delta Partner Issuing CA\n  Issuer: CN=Public Root CA R3\n  Basic Constraints: CA:TRUE\n  Name Constraints: excluded subtree .delta-claims.example\nRoot: CN=Public Root CA R3 (trusted, not sent)",
 q:"Which chain problem actually blocks the handshake for your client?",
 instr:"CHOOSE ONE",
 o:["The intermediate excludes the leaf own domain from its subtree","The leaf certificate has passed its own expiry date already","The leaf certificate has no key usage extension at all","The root certificate was not sent by the server at all"],
 k:["a"],
 why:"The intermediate carries a name constraint that excludes the whole .delta-claims.example subtree, so no certificate under that name can be valid in this chain, even though the leaf is inside its validity window and has correct extended key usage. Expiry is wrong (2024 to 2026 covers today), key usage is present, and the root never needs to be sent because the client already trusts it.",
 h:"Read every extension on the intermediate, not only on the leaf."},

{id:"h2",t:"MS",pts:2,theme:"PKI and Trust",
 s:"A red team rents a valid certificate for payments.acme-bank.example from a public CA and prepares to run an on-path TLS proxy. The target browsers use HSTS with long max-age.",
 a:"Target facts\n- Chromium and Firefox, HSTS preload list includes the parent domain\n- Certificate transparency logging is enforced by the CA\n- The proxy must present a certificate the browser accepts to read plaintext",
 q:"Which TWO controls make this attack detectable or ineffective? Select exactly two.",
 instr:"CHOOSE TWO",
 o:["Certificate transparency logs that the bank watches for issuance","HSTS preload, which blocks downgraded plain HTTP requests","Larger RSA key sizes used on the bank real certificate","Shorter certificate renewal intervals set by the bank"],
 k:["a","b"],
 why:"Certificate transparency makes every publicly issued certificate visible, so the bank can detect an unauthorised certificate for its own domain. HSTS with preload forces HTTPS and blocks the initial plaintext request that an SSL stripping attack needs. Key size and renewal timing do not stop a legitimately issued rogue certificate from being accepted.",
 h:"One control is about seeing mis-issuance. The other is about never starting in plaintext."},

{id:"h3",t:"INP",pts:2,theme:"Hashing and Integrity",
 s:"02:40. Two installer files come from the same vendor page. Both are listed with an MD5 value, and the repository is waiting on your decision.",
 a:"file-a.msi  size 48213011  MD5 d41d8cd98f00b204e9800998ecf8427e  SHA-256 9f2b...c41a\nfile-b.msi  size 48219904  MD5 d41d8cd98f00b204e9800998ecf8427e  SHA-256 71ae...0d33\nVendor page states: integrity is guaranteed because the MD5 values match the published list.",
 q:"Name what the matching MD5 really is, and what must replace it. One item per box.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Term for two different inputs that produce the same hash value",ph:"one word",acc:["collision","hash collision","a collision"],disp:"collision"},{l:"Digest check that must replace MD5 in the release process",ph:"two or three words",acc:["sha-256","sha256","sha 256","sha-2","sha256 sum"],disp:"SHA-256"}],
 why:"Two files with different sizes and different SHA-256 values cannot be the same file, so the shared MD5 is a collision: MD5 is broken for collision resistance and cannot prove integrity. The release process must use a collision-resistant digest such as SHA-256, and better still a signed digest so the list itself is trusted. A SHA-256 difference proves the files differ, but it does not by itself prove deliberate tampering.",
 h:"One word names what two different files did to the same hash. One digest must replace it."},

{id:"h4",t:"INP",pts:2,theme:"Symmetric Encryption",
 s:"A developer defends the design of an encryption service: AES-256-GCM with a 96-bit nonce that restarts from zero once the counter wraps. Traffic is around 4 billion messages per key per day.",
 a:"Design claims\n- Cipher: AES-256-GCM\n- Nonce: 96-bit counter that restarts at zero after a wrap\n- Volume: about 4 billion messages per key per day\n- Key rotation: annual, aligned to the compliance calendar",
 q:"Name the property that breaks and the action that prevents it. One item per box.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Term for using one counter value with the same key more than once",ph:"two words",acc:["nonce reuse","iv reuse","reused nonce","nonce repetition","repeated nonce"],disp:"nonce reuse"},{l:"Action the service must take before any counter wrap",ph:"one word",acc:["rotate","rotation","rekey","re-key"],disp:"rotate"},{l:"Key-agreement method that also gives forward secrecy on the link",ph:"five letters or a name",acc:["ecdhe","ephemeral diffie-hellman","ephemeral diffie hellman","dhe"],disp:"ECDHE"}],
 why:"In GCM, reusing a nonce with the same key destroys both confidentiality and integrity: an attacker can recover the authentication key and combine ciphertexts. With about 4 billion messages a day, a 96-bit counter wraps and nonces repeat, so the service must guarantee a unique nonce per message and rotate keys well before any wrap rather than once a year. ECDHE keys would also be wrong here for a different reason: they give forward secrecy on the link, but they say nothing about nonce handling inside the service. AES has no 512-bit variant, and a longer key or a bigger tag does not repair nonce reuse.",
 h:"Ask what happens when two messages share one key and one nonce, then how you avoid it."},

{id:"h5",t:"DND",pts:5,theme:"PKI and Certificates",
 s:"A pharmaceutical group must sign and encrypt clinical contracts for 15,000 staff plus 4,000 external partner doctors. Legal requires non-repudiation. The current design puts every private key on the CA server.",
 a:"Current design (audit finding)\n- All private keys generated and stored on the CA server\n- One shared signing account for the legal team\n- CRL published only when someone complains\n- Certificates valid for 10 years\n- No hardware protection for CA keys",
 q:"Drag one remediation into each slot. Five slots, one item each.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["Generate and hold each user private key on a token or in an HSM","Give every user a distinct key pair and account of their own","Publish revocation through CRL and an OCSP responder on a schedule","Shorten certificate lifetimes and automate the renewal process","Protect the CA key in an HSM with M-of-N approval and split knowledge","Increase the RSA key size of every certificate to 8192 bits","Add a second password to the shared legal team account","Keep the 10-year certificates but add a wildcard name to them"],
 slots:[{l:"Key custody",a:"Generate and hold each user private key on a token or in an HSM"},{l:"Non-repudiation",a:"Give every user a distinct key pair and account of their own"},{l:"Revocation",a:"Publish revocation through CRL and an OCSP responder on a schedule"},{l:"Certificate lifecycle",a:"Shorten certificate lifetimes and automate the renewal process"},{l:"CA protection",a:"Protect the CA key in an HSM with M-of-N approval and split knowledge"}],
 why:"Non-repudiation needs three things. The private key must be under the sole control of its owner (hardware token or HSM), each signature must map to one person (no shared accounts), and revocation must be current so a compromised key stops working quickly. Short lifetimes with automated renewal reduce the blast radius of any single key. The CA signing key is the root of all trust, so it needs an HSM with M-of-N approval and split knowledge, which stops one insider from minting trust. Bigger keys, an extra password on a shared account, and long-lived wildcards change nothing about custody or attribution.",
 h:"For each slot ask: who holds the key, who is named by the signature, and how fast can trust be withdrawn?"},

{id:"h6",t:"MATCH",pts:3,theme:"Obfuscation",
 s:"A review flags a product search page that reflects user input into the HTML body, and it also stores the same input in an HTML attribute on a later page. A developer proposes HTML entity encoding everywhere and calls it done.",
 a:"Output sinks\nA) Reflected value placed between two HTML tags\nB) Reflected value placed inside an HTML attribute\nC) Reflected value placed inside a JavaScript string\nD) Reflected value placed inside a URL parameter",
 q:"Match each output sink to the correct fix.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"A) Between two HTML tags"},{l:"B) Inside an HTML attribute"},{l:"C) Inside a JavaScript string"},{l:"D) Inside a URL parameter"}],
 opts:[{v:"a",l:"Encode for HTML text context, which entity encoding covers"},{v:"b",l:"Encode for attribute context, including quotes and delimiter"},{v:"c",l:"Encode for JavaScript context so the string cannot be broken"},{v:"d",l:"Encode for URL context so the value cannot change the request"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d"},
 why:"Output encoding must match the sink. HTML entities are correct between two HTML tags, but an attribute needs attribute encoding (quotes and delimiters), a JavaScript string needs JavaScript encoding, and a URL parameter needs URL encoding. Blanket HTML entity encoding therefore leaves three of the four sinks unsafe. Encoding is not encryption or obfuscation for secrecy, and no TLS key change stops a scripting flaw; server-side input validation and a content security policy are useful additions, not replacements.",
 h:"A quote mark is dangerous in one context and harmless in another."},

{id:"h7",t:"INP",pts:3,theme:"Key Management",
 s:"An auditor challenges the DR plan for an encrypted records system. The design team claims it is safe.",
 a:"Design note\n- Keys are generated in an HSM and never exported in clear\n- One administrator holds a wrapped copy, sealed under two separate passphrases\n- Recovery requires the security officer and the platform lead to approve together\n- Custody records are kept for every use",
 q:"Type the term that names each practice. Three boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Copy kept so data can be recovered if the owner leaves",ph:"one word",acc:["escrow","key escrow"],disp:"escrow"},{l:"Splitting a secret between two people so neither can use it alone",ph:"two words",acc:["split knowledge","m of n","m-of-n"],disp:"split knowledge"},{l:"Two approvals required before an action",ph:"four words",acc:["dual control","two person control","two-person control"],disp:"dual control"}],
 why:"Escrow keeps a recovery copy of a key; split knowledge divides the secret so no single person can rebuild it; dual control requires two people to act together. Together they let the business recover data while stopping one insider from using the key alone. Wrapped storage inside an HSM protects the material at rest, but it is these three practices that answer who can recover what.",
 h:"One term is about recovery, one about dividing a secret, one about two people acting together."},

{id:"h8",t:"TERM",pts:2,theme:"PKI and Certificates",
 s:"04:20. A certificate file arrived in a sealed evidence bundle. You must prove, with a tool, that it chains to the corporate root, that it is valid for the server role, and that revocation is checked through the signed list published by the CA.",
 a:"Target file: /evidence/bundle/api.corp.example.crt\nTrusted root: /evidence/bundle/corp-root-ca.crt\nIntermediate chain: /evidence/bundle/corp-chain.pem\nSigned revocation list from the CA: /evidence/bundle/corp.crl\nThe result must be written into your notes as readable validation output.",
 q:"Write the exact command you would run. Use the OpenSSL suite.",
 instr:"TYPE THE COMMAND",
 terms:[{l:"Command that verifies the chain, the server-role purpose and the revocation list",ph:"openssl ...",
   re:/^openssl\s+verify\b[\s\S]*$/i,req:[/^openssl\s+verify\b/i,/-CAfile\b/i,/-untrusted\b/i,/-purpose\b/i,/-CRLfile\b/i],
   disp:"openssl verify -CAfile corp-root-ca.crt -untrusted corp-chain.pem -purpose sslserver -CRLfile corp.crl /evidence/bundle/api.corp.example.crt"}],
 why:"The verify subcommand checks a certificate against a trust anchor. -CAfile names the trusted root, -untrusted supplies the intermediate certificates, -purpose sslserver checks that the certificate is allowed for a TLS server, and -CRLfile makes the tool check the CA's signed revocation list. Without the purpose check a client certificate could pass the chain test, and without -CRLfile a revoked certificate would still look valid. The flags may be written in any order.",
 h:"One subcommand does chain validation. It needs the anchor, the untrusted intermediates, the intended purpose and the revocation list."},

{id:"h9",t:"DND",pts:4,theme:"PKI and Trust",
 s:"05:10. The certificate monitor reports new entries for your domain. One change request was approved last night. You must interpret the log before the morning stand-up.",
 a:"ct-log 2025-02-04T05:02Z issuer=Public CA R3 cn=portal.acme-bank.example status=valid\nct-log 2025-02-04T05:06Z issuer=Public CA R9 cn=vpn.acme-bank.example status=valid\nct-log 2025-02-04T05:09Z issuer=Public CA R9 cn=mail.acme-bank.example status=valid\nct-log 2025-02-04T05:12Z issuer=Public CA R9 cn=secure.acme-bank.example status=valid\nct-log 2025-02-04T05:15Z issuer=Public CA R9 cn=secure.acme-bank.example status=valid\nchange-ticket CHG-8841: request 4 certificates for secure.acme-bank.example, expected 4",
 q:"Drag one item into each of the four slots.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["An extra certificate for secure.acme-bank.example was issued","Two certificates for the same name, so one is unexpected","Quarantine the extra certificate and confirm the request out of band","The duplicate proves the issuing CA was fully compromised","The vpn and mail names prove an internal host was compromised","The archive is safer because the certificates are logged","Revoke the corporate root certificate and rebuild the whole PKI"],
 slots:[{l:"What happened",a:"An extra certificate for secure.acme-bank.example was issued"},{l:"What the log shows",a:"Two certificates for the same name, so one is unexpected"},{l:"Immediate action",a:"Quarantine the extra certificate and confirm the request out of band"},{l:"What it is not",a:"The duplicate proves the issuing CA was fully compromised"}],
 why:"The change ticket approves four certificates for secure.acme-bank.example, but the log shows five: one request produced a certificate that nobody expected, which is the early warning for a rogue or mis-issued certificate. Certificate transparency works only when the issuing CA submits every certificate to public logs. A duplicate alone does not prove a CA compromise or an internal breach, so the next step is out-of-band confirmation rather than revoking the root.",
 h:"Count the certificates for the changed host against the approved number."},

{id:"h10",t:"INP",pts:3,theme:"Key Management",
 s:"06:00. A cloud migration must keep tenant keys inside each tenant's region, and the compliance team wants a standard way for the platform to ask the key service to encrypt and decrypt without ever seeing the raw key.",
 a:"Requirement\n- Keys must never leave their region\n- The application asks the service to use a key, it never handles key bytes\n- All requests must be logged with the calling identity\n- One standard interface must be used across regions",
 q:"Type the correct term in each box. Four boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Hardware device that holds the key and performs the operation",ph:"three words",acc:["hardware security module","hsm","cloud hsm"],disp:"hardware security module"},{l:"Standard protocol the platform uses to ask the key service",ph:"four letters",acc:["kmip"],disp:"KMIP"},{l:"Property that stops a tenant key from leaving its region",ph:"three words",acc:["data residency","data sovereignty","region isolation"],disp:"data residency"},{l:"Deprecated cipher with a 112-bit effective key that must not be used",ph:"letters or a number",acc:["3des","triple des","des","112-bit","112 bit"],disp:"3DES"}],
 why:"An HSM performs the cryptographic operation while the key stays inside tamper-resistant hardware, so the application asks for a result rather than holding key bytes. KMIP is the standard protocol for those key-service requests, which keeps one interface across regions. Data residency (also called data sovereignty) is the requirement that key material and data stay inside the region, which is why one global key store cannot be used here.",
 h:"One answer is hardware, one is a four-letter protocol, one is a legal placement rule."},

{id:"h11",t:"ORD",pts:4,theme:"Key Management",
 s:"07:15. A storage array with four encrypted volumes must be retired and re-issued to another department. You must act in the safest order.",
 a:"Volumes\n1: software-encrypted volume, key in the KMS, array stays in the company\n2: self-encrypting drive, key held by the controller, drive leaves the company\n3: encrypted backup tape in a vault, kept for seven years by law\n4: laptop with a TPM-bound key, being resold",
 q:"Rank the four items from fastest safe erasure to slowest, based on the strongest available method for each.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["Self-encrypting drive: destroy the media encryption key","Laptop with a TPM-bound key: clear the TPM and the bound key","Software-encrypted volume: delete the KMS key and the volume","Encrypted backup tape: keep as required, then degauss and destroy the media"],
 why:"Crypto erase is the fastest safe method: destroying the key makes the ciphertext worthless, and for a self-encrypting drive that key lives in the controller. Clearing a TPM removes the sealed key, so the disk becomes unreadable, which is why a TPM-bound laptop can be safely resold. A software-encrypted volume needs the KMS key deleted and the volume removed, which takes longer because the platform must confirm the key is gone everywhere. The tape must be retained by law, so action is delayed and the final step is physical: degauss and destroy the media.",
 h:"When a key can be destroyed, erasure is instant. Legal retention is the slowest item."},

{id:"h12",t:"MATCH",pts:4,theme:"Hashing and Integrity",
 s:"08:00. A forensic image of a workstation is being shared with a partner. The case may go to court in a year, so you must state what the hash does and does not prove.",
 a:"Case notes\n- Two analysts handle the disk\n- The image is copied to a network share\n- The partner will analyse the copy\n- The court will ask what the recorded value proves",
 q:"Match each statement to the verdict it deserves.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"The SHA-256 value is recorded and re-verified after every copy"},{l:"The value proves the image was unchanged since acquisition"},{l:"The value proves the image contains no hidden malicious code"},{l:"The value proves the original source disk was encrypted"}],
 opts:[{v:"a",l:"Sound practice that supports the chain of custody"},{v:"b",l:"Sound claim, because a digest is a fingerprint of the bytes"},{v:"c",l:"Flawed claim: a digest says nothing about content meaning"},{v:"d",l:"Flawed claim: encryption is a separate finding of analysis"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d"},
 why:"A cryptographic hash is a fingerprint: recording the SHA-256 value and re-verifying it after every transfer is what supports the chain of custody in court. The value proves the evidence is byte-for-byte the same as when it was acquired, but it says nothing about what the data means, so it cannot show the absence of malware or whether the disk was encrypted. Those require analysis, not hashing.",
 h:"Hashing answers one question only: is this the same data as before?"},

{id:"h13",t:"MCQ",pts:1,theme:"Digital Signatures",
 s:"09:20. An internal load-plan file is signed by the shipping desk. The signature verifies correctly against a key whose ID is loaded under the shared shift account, and the signature covers the payload plus the timestamp. A supplier disputes a load plan and demands non-repudiation.",
 q:"What is the strongest objection to the non-repudiation claim?",
 instr:"CHOOSE ONE",
 o:["The signature algorithm used here is symmetric in nature","The key belongs to a shared shift account and names nobody","The timestamp inside the payload can be changed by anyone","The key identifier on its own is not a valid certificate"],
 k:["b"],
 why:"Non-repudiation means one identity cannot credibly deny an action. When the signing key is available to everyone on a shift, any of those people could have produced the signature, so attribution fails even though the cryptography is sound. A digital signature is asymmetric, so the symmetric objection is wrong. Editing the timestamp would break the signature. A key ID is not required to be a certificate.",
 h:"The math is fine. Ask who could have used the key."},

{id:"h14",t:"DND",pts:4,theme:"Symmetric Encryption",
 s:"10:05. A design review packet for a new sensor platform arrives with four claims. You must classify each claim before you approve the packet.",
 a:"Claims\n1: RSA-2048 encrypts each sensor reading, one key pair per sensor\n2: AES-128-GCM with a per-message nonce protects readings on the link\n3: The session key is agreed with ephemeral Diffie-Hellman, then the link uses ChaCha20-Poly1305\n4: ECB mode is used because each reading is small",
 q:"Drag one claim into each slot according to its verdict.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["AES-128-GCM with a per-message nonce protects readings on the link","Sound, because GCM authenticates and the nonce is unique per message","Ephemeral key agreement with ChaCha20-Poly1305 on the link","Sound, because fresh key agreement keeps forward secrecy on small CPUs","RSA-2048 encrypts each sensor reading with one key pair per sensor","Flawed, because RSA per reading is slow and fragile at fleet scale","ECB mode is used because each reading is small","Flawed, because repeated readings leak identical block patterns"],
 slots:[{l:"Claim 2, the control",a:"AES-128-GCM with a per-message nonce protects readings on the link"},{l:"Claim 2, the verdict",a:"Sound, because GCM authenticates and the nonce is unique per message"},{l:"Claim 1, the verdict",a:"Flawed, because RSA per reading is slow and fragile at fleet scale"},{l:"Claim 4, the verdict",a:"Flawed, because repeated readings leak identical block patterns"}],
 why:"AES-128-GCM with a nonce used once per message is sound: GCM authenticates and encrypts, and AES-128 is an accepted baseline. Ephemeral Diffie-Hellman gives forward secrecy, and ChaCha20-Poly1305 is an authenticated stream cipher that is fast on small CPUs without hardware acceleration. RSA per reading is needlessly slow and fragile at scale. ECB encrypts identical blocks to identical ciphertext, so repeated readings leak patterns no matter how small each message is.",
 h:"Two claims name an authenticated mode and a fresh key agreement. Two claims are about scale and pattern leakage."},

{id:"h15",t:"INP",pts:2,theme:"Key Management",
 s:"11:00. A KMS incident shows that a wrapped data key was copied before the HSM was patched. The data it protects is a 3 TB archive with a two-year retention rule. Leadership asks for your judgement in writing.",
 a:"Incident facts\n- A wrapped copy of one data key left the HSM before the patch\n- The key protects a 3 TB archive\n- Retention policy requires the archive to be kept for two years\n- The wrapped copy was found on an internal share",
 q:"Type the correct answer in each of the three boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Assumption you must make about the exposed key (one word)",ph:"one word",acc:["compromised","compromise","exposed","lost"],disp:"compromised"},{l:"Action that stops further exposure of new data (one word)",ph:"one word",acc:["rotate","rotation","rekey","re-key"],disp:"rotate"},{l:"Action that protects the data already written under that key",ph:"one word",acc:["re-encrypt","reencrypt","re encrypt","rewrap","re-wrap"],disp:"re-encrypt"}],
 why:"If a wrapped key copy left the HSM, you must assume the key is compromised: wrapping slows an attacker but does not make stolen key material harmless. Rotation stops future exposure, but only re-encrypting the existing archive protects the 3 TB already written under that key. Deleting the archive would break the two-year retention rule, so it is not an option.",
 h:"Ask what protects the data that was already encrypted with the exposed key."},

{id:"h16",t:"DUAL",pts:2,theme:"Digital Signatures",
 s:"11:45. A signed settlement instruction was altered before it reached the clearing system. The instruction still carries a valid-looking signature block and a matching key ID.",
 a:"Beneficiary view: the signature exists, so the instruction must be genuine.\nForensic view: the digest inside the signature no longer matches the instruction body.",
 q:"Answer both sides. One selection per side.",
 instr:"ONE ANSWER PER SIDE",
 groups:[{l:"What does the digest mismatch prove?",opts:["The instruction changed after signing, so the signature is invalid","The sender used a public key that does not match the ID","The signing certificate expired between signing and delivery","The clearing system has lost the original signing timestamp"],k:["a"]},
 {l:"What must be verified to confirm the signature came from the claimed sender?",opts:["The signature against the sender public key, plus chain and revocation","The instruction file size and its original creation date stamp","The number of named recipients on the distribution list","The measured speed of the delivery channel used to send it"],k:["a"]}],
 why:"A signature covers a hash of the content. If the body changes, the digest changes and verification fails, which proves the content was altered after signing. Confirming the signer means checking the signature with the sender's public key, then checking that the signing certificate chains to a trusted root and has not been revoked. File metadata and delivery details prove nothing about origin.",
 h:"The signature is bound to the bytes that existed at signing time."},

{id:"h17",t:"MATCH",pts:6,theme:"Obfuscation",
 s:"13:00. A malware analysis team must label six techniques for the report. Each label must state what the technique actually hides or protects.",
 a:"Techniques\nA) Payload packed with a custom packer\nB) C2 addresses hidden inside image pixels\nC) Customer card numbers replaced by random reference tokens\nD) Account numbers shown as 1234-****-5678 in the portal\nE) A blob that is only base64 text\nF) Configuration file encrypted with AES-256-CBC",
 q:"Match each technique to its real effect.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"A) Packed payload"},{l:"B) Addresses inside image pixels"},{l:"C) Random reference tokens"},{l:"D) Masked account number"},{l:"E) Base64 blob"},{l:"F) AES-256-CBC configuration"}],
 opts:[{v:"a",l:"Hides code from static tools, but does not encrypt traffic"},{v:"b",l:"Hides commands in a carrier file so data survives review"},{v:"c",l:"Removes the sensitive value, with the original held in a vault"},{v:"d",l:"Shows only part of the value to the viewer of the screen"},{v:"e",l:"Changes the form of data only; anyone can reverse it"},{v:"f",l:"Protects the file with a key, so secrecy depends on key management"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d",r5:"e",r6:"f"},
 why:"A packer compresses or encrypts the code of a packed payload so static tools struggle, while tokenisation, data masking, DLP and CASB each hide or control data in a different way, and none of them encrypts network traffic. Steganography hides data inside a carrier so it survives normal review. Tokenisation replaces the value with a reference, and the vault holds the original, which is stronger than masking. Masking only hides part of the display. Base64 is encoding, so it is reversible with no key. AES-CBC genuinely encrypts, but CBC gives no integrity, so it must be paired with a message authentication code.",
 h:"Separate real encryption from encoding, and check whether the original value still exists in the system."},

{id:"h18",t:"DUAL",pts:2,theme:"Blockchain and Ledger",
 s:"14:30. A smart contract controls payouts on a permissioned supply-chain ledger. The audit finds a single owner key that can rewrite payout records without a vote.",
 a:"Red team view: one owner key means one transaction can break the record of every payout.\nBlue team view: the same design must be defended in the next release.",
 q:"Answer both sides. One selection per side.",
 instr:"ONE ANSWER PER SIDE",
 groups:[{l:"Red team: what does the owner key give the attacker?",opts:["The power to change recorded state without any consensus","The power to encrypt every single block on the ledger","The power to slow the whole ledger network down only","The power to read other members private channel data"],k:["a"]},
 {l:"Blue team: which fix best restores tamper resistance?",opts:["Drop the owner key and require multi-signature approval","Increase the maximum block size that the ledger allows","Move the whole ledger onto a public blockchain network","Add a second password to protect the owner key file"],k:["a"]}],
 why:"On a blockchain, immutability comes from consensus between the members: no single party can rewrite recorded state alone, which is exactly what a smart contract must enforce. A unilateral owner key reintroduces that power, so payouts can be changed without agreement. The fix is to remove that key and require multi-signature approval for privileged actions. Block size, a public network or a second password do not restore consensus and do not remove the single point of control.",
 h:"Immutability is a property of who must agree, not of how the data is stored."},

{id:"h19",t:"ORD",pts:3,theme:"Symmetric Encryption",
 s:"15:20. A long-term partner wants to protect traffic that must stay secret for 15 years against a future attacker with a large quantum computer. The partner proposes RSA-4096 key transport, and you must show why that fails and what to do instead.",
 a:"Design notes (not in order)\nThe session is protected with a hybrid handshake\nAn attacker records the ciphertext today\nRSA-4096 and ECC are broken by a future quantum computer\nThe classical or the post-quantum half still holds, so the session survives\nCrypto agility lets the algorithms be replaced later without redesign",
 q:"Order the notes so they form a correct argument for the design.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["An attacker records the ciphertext today","RSA-4096 and ECC are broken by a future quantum computer","The session is protected with a hybrid handshake","The classical or the post-quantum half still holds, so the session survives","Crypto agility lets the algorithms be replaced later without redesign"],
 why:"The threat model starts with recorded traffic: an attacker keeps the ciphertext today and waits. A future quantum computer can break today's public-key algorithms, including RSA and elliptic curves, so that recorded traffic could then be decrypted. A hybrid handshake combines a post-quantum key encapsulation method with a classical one, so the session stays safe if either holds. Crypto agility keeps the design replaceable later. AES-128 is not the weak point, and compression has no effect on long-term secrecy.",
 h:"Start with what the attacker does today, then what breaks, then the fix."},

{id:"h20",t:"INP",pts:4,theme:"Protocols and Controls",
 s:"16:10. A banking gateway must stop protocol downgrade attacks on client connections. The team must complete the hardening record.",
 a:"Hardening record\n- Disable TLS 1.0 and TLS 1.1\n- Set the minimum protocol to ____\n- Enable ____ so a browser never starts on plain HTTP\n- Prefer cipher suites with ephemeral key exchange to keep ____\n- Add ____ inspection at the egress proxy for outbound sessions",
 q:"Type the missing term in each of the four boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"Minimum protocol version for the gateway",ph:"for example TLS x.y",acc:["tls 1.2","tls1.2","tls 1.3","tls1.3","tlsv1.2","tlsv1.3"],disp:"TLS 1.2 (or higher)"},{l:"Header that forces HTTPS for future visits",ph:"four letters",acc:["hsts","strict transport security","strict-transport-security"],disp:"HSTS"},{l:"Property preserved by ephemeral key exchange",ph:"two words",acc:["forward secrecy","perfect forward secrecy","pfs"],disp:"forward secrecy"},{l:"Inspection type needed to see inside outbound TLS",ph:"two words",acc:["tls inspection","ssl inspection","ssl tls inspection","tls ssl inspection","break and inspect","break-and-inspect"],disp:"TLS inspection"}],
 why:"Refusing TLS 1.0 and 1.1 with a minimum of TLS 1.2 (or 1.3) removes the protocol downgrade path, and HSTS stops the browser from ever starting on plain HTTP, which is the opening an SSL stripping attack needs. Ephemeral key exchange keeps forward secrecy, so past sessions stay safe if a key leaks later. Most outbound traffic is encrypted, so egress monitoring for data in transit needs TLS inspection to see inside those sessions. A certificate signing request for the gateway needs the same care: the CSR must carry the right subject, and the certificate policy decides what the CA will issue for that name.",
 h:"One blank is a header, one is a property of ephemeral keys, one is a proxy capability."},

{id:"h21",t:"DND",pts:4,theme:"Symmetric Encryption",
 s:"17:20. A card processor must reduce the value of a database breach. Four slots describe the control, the data state, the rollback plan and the media rule.",
 a:"Design constraints\n- Card numbers must not sit in the application database in clear\n- Keys must be usable by the payment service only\n- The vendor may return the original number for refunds\n- Backups go to removable media that leaves the data centre",
 q:"Drag one item into each slot. Four slots, one item each.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["Tokenise the card number and keep the original in a vault","Encrypt data at rest with keys held in an HSM, not in the app","Reversal happens only through a controlled dual-control lookup","Encrypt the backup media and store the keys separately from it","Hash the card number with SHA-256 so it cannot be reversed back","Symmetric encryption protects bulk data and data at rest","Move the card numbers to a spreadsheet on a shared network drive","Rotate the database account password once every 90 days or so","Compress the database before writing it to the backup set"],
 slots:[{l:"Reduce breach value",a:"Tokenise the card number and keep the original in a vault"},{l:"Protect the stored copy",a:"Encrypt data at rest with keys held in an HSM, not in the app"},{l:"Return the original",a:"Reversal happens only through a controlled dual-control lookup"},{l:"Removable media",a:"Encrypt the backup media and store the keys separately from it"}],
 why:"Tokenisation removes the sensitive value from the application database, so a breach there yields tokens that are useless alone. The original must still be protected, so encryption at rest with HSM-held keys keeps key material away from the application. Refunds need the real number, which means a controlled vault lookup with dual control. Backup media leaves the building, so it must be encrypted and the keys must travel separately. Hashing is one-way, so it cannot support refunds, and shared drives, password rotation or compression change nothing about the exposure.",
 h:"Ask for each slot: what does the attacker get, and how does the business still work?"},

{id:"h22",t:"ORD",pts:6,theme:"Key Management",
 s:"18:00. A new key-management standard is being written. Put the lifecycle phases in the correct order.",
 a:"Phases (not in order)\nRotate before the cryptoperiod ends\nUse the key only for its approved purpose\nGenerate inside an HSM with a defined algorithm and length\nDestroy or archive the key with a custody record\nDistribute or wrap the key to the parties that need it\nApprove and register the key in the inventory",
 q:"Order the phases from the first action to the last.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["Generate inside an HSM with a defined algorithm and length","Approve and register the key in the inventory","Distribute or wrap the key to the parties that need it","Use the key only for its approved purpose","Rotate before the cryptoperiod ends","Destroy or archive the key with a custody record"],
 why:"Key management runs in a fixed order. The key is generated in an HSM with an approved algorithm and length, then approved and registered so ownership and purpose are recorded. It is distributed or wrapped to the parties that need it, used only for its approved purpose, rotated before the cryptoperiod ends to limit exposure, and finally destroyed or archived with a custody record. Skipping registration or destruction breaks auditability.",
 h:"Nothing can be distributed before it exists and is approved, and nothing is destroyed before it is rotated out."},

{id:"h23",t:"DND",pts:4,theme:"Obfuscation",
 s:"19:10. A data-protection alert fires on a workstation. DLP and CASB are both in the stack, and you must decide what the user was doing and which control was missing.",
 a:"dlp 2025-02-04T19:02Z host=WKS-4471 user=j.okafor action=allow rule=outbound_https size=118MB\ncasb 2025-02-04T19:02Z app=personal-storage.example session=upload filename=board-pack.pdf encoding=base64-wrapped\nproxy 2025-02-04T19:02Z POST personal-storage.example 200 118MB\nproxy 2025-02-04T19:04Z POST personal-storage.example 200 96MB filename=ledger-q4.xlsx\npolicy: DLP inspects cleartext only; CASB inline control is in monitor mode",
 q:"Drag one item into each of the four slots. Decide whether this is data exfiltration or a false positive.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["Documents were uploaded to unapproved personal storage as exfiltration","Files left over allowed HTTPS, so the proxy returned success","The payload was wrapped and the inline CASB control was not enforcing","The DLP engine could not read the wrapped content as cleartext","The user encrypted the files with AES-256 before the upload","The proxy blocked the uploads and wrote a warning to the log","The CASB control blocked both uploads at the network edge"],
 slots:[{l:"What happened",a:"Documents were uploaded to unapproved personal storage as exfiltration"},{l:"Evidence of success",a:"Files left over allowed HTTPS, so the proxy returned success"},{l:"Why DLP missed it",a:"The payload was wrapped and the inline CASB control was not enforcing"},{l:"Technical reason",a:"The DLP engine could not read the wrapped content as cleartext"}],
 why:"The proxy shows successful uploads to a personal storage site over allowed HTTPS, so data left the network. DLP inspects cleartext only, so the base64-wrapped payload was never matched, and the CASB inline control was in monitor mode, so it enforced nothing. Nothing in the evidence shows AES encryption of the files, and the 200 responses show the uploads succeeded rather than being blocked. The lesson is that a control in monitor mode and an engine that cannot read the payload together leave an exfiltration path open.",
 h:"Check the response codes and what the DLP engine can actually read."},

{id:"h24",t:"DUAL",pts:3,theme:"Protocols and Controls",
 s:"20:00. A mobile customer app pins the server certificate. An analyst captures traffic with an instrumented device and can read every request. The certificate the analyst presented was self-signed and had never appeared in any public certificate transparency log.",
 a:"Red team view: the capture works because the pinning check was removed at run time.\nBlue team view: the same technique must be detected and prevented in the next release.",
 q:"Answer both sides. One selection per side, plus the detection signal.",
 instr:"ONE ANSWER PER SIDE",
 groups:[{l:"Red team: how did the attacker read the traffic?",opts:["Pinning was bypassed at run time, then a proxy presented a certificate","The server private key was recovered from the mobile device","The certificate was revoked and replaced by the CA","TLS was downgraded to plain HTTP by the server side"],k:["a"]},
 {l:"Blue team: which control best reduces this risk?",opts:["Pinning with run-time integrity checks and tamper detection","A much larger server key size on the same certificate","A longer certificate validity period for the mobile app","Disabling the certificate checks inside the app itself"],k:["a"]},
 {l:"Which detection signal is most useful here?",opts:["A pinning check that never runs, plus a new trust anchor","A larger response size returned for the very same request","A change in the language setting chosen inside the app","A second DNS lookup for the same host name as before"],k:["a"]}],
 why:"On a device the attacker controls, pinning can be removed at run time, and then a proxy can present its own certificate and read the traffic. Defences must combine pinning with integrity checks and tamper detection so a modified app refuses to run. The most useful signal is the pinning check never running, or a new trust anchor appearing at run time. Larger keys, longer validity and disabling checks all make the problem worse or change nothing.",
 h:"On a device the attacker owns, every local check can be edited. Detection has to notice the edit."},

{id:"h25",t:"INP",pts:2,theme:"Digital Signatures",
 s:"20:50. A signed PDF arrives from a law firm. The signature block is present and the hash shown inside it does not match the file content.",
 a:"Verification output\n  signer: CN=Legal Counsel, O=Firm, C=UK\n  signed attribute messageDigest: 3f9a...\n  computed digest of document: 8c11...\n  signature algorithm: sha256WithRSAEncryption\n  result: DIGEST MISMATCH",
 q:"Type the correct answer in each box. Two boxes.",
 instr:"TYPE THE MISSING TERMS",
 fields:[{l:"What the mismatch means for the document",ph:"one word",acc:["tampered","tampered with","altered","modified","changed"],disp:"tampered"},{l:"Which key confirms the signer when the digest does match",ph:"two words",acc:["public key","signer public key"],disp:"public key"}],
 why:"A digital signature signs a hash of the content. If the recomputed digest differs from the one inside the signature, the bytes changed after signing, so the document was tampered with and the signature is invalid for this file. When the digests do match, the signature is checked with the signer's public key, and the certificate chain and revocation status confirm that the key really belongs to that signer.",
 h:"One word describes what happened to the file. One key is used to check the signature."},

{id:"h26",t:"TERM",pts:2,theme:"PKI and Certificates",
 s:"21:40. A certificate signing request must be produced for a new internal service on host payments.corp.example, using RSA with a 4096-bit key. The private key and the request must both go to the file paths the PKI team expects.",
 a:"Required output files\n/keys/payments.key (private key, RSA 4096)\n/keys/payments.csr (certificate signing request, CN=payments.corp.example)\nThe private key stays unencrypted only because the PKI team will wrap it inside an HSM immediately.",
 q:"Write the exact command you would run. Use the OpenSSL suite.",
 instr:"TYPE THE COMMAND",
 terms:[{l:"Command that creates the RSA-4096 private key and the CSR with the correct subject",ph:"openssl ...",
   re:/^openssl\s+req\b[\s\S]*$/i,req:[/^openssl\s+req\b/i,/-new\b/i,/rsa:4096/i,/-keyout\b/i,/-out\b/i,/-subj\b/i],
   disp:"openssl req -new -newkey rsa:4096 -nodes -keyout /keys/payments.key -out /keys/payments.csr -subj /CN=payments.corp.example"}],
 why:"The req subcommand creates a request. -new starts a new request, -newkey rsa:4096 generates the key pair, -nodes keeps the private key unencrypted for immediate HSM wrapping, -keyout and -out name the two files, and -subj sets the subject so the common name matches the host. Without -subj the tool prompts interactively, which breaks automation. The flags may be written in any order.",
 h:"One subcommand creates a request and a key together. It needs the key spec, the two file names and the subject."},

{id:"h27",t:"MATCH",pts:4,theme:"Obfuscation",
 s:"22:30. Two files arrive from a partner. File one is a .zip whose header is intact but whose file names inside are random strings. File two is small, its first bytes match no known format, its entropy is very high, and the analysis team cannot yet tell whether it is packed or encrypted.",
 a:"Observations\nZip file names are random strings\nZip header is intact and readable\nSmall blob with very high entropy\nBlob bytes are all inside the printable ASCII range",
 q:"Match each observation to what it really tells you.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"Random file names inside a zip"},{l:"A small blob with very high entropy"},{l:"Bytes limited to printable ASCII"},{l:"An intact, readable zip header"}],
 opts:[{v:"a",l:"Consistent with a password-protected or encrypted archive"},{v:"b",l:"Consistent with encryption or packing, but also with compression"},{v:"c",l:"Consistent with base64 or another text encoding, not ciphertext"},{v:"d",l:"Shows the container is a real archive, not a hidden carrier"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d"},
 why:"Random names inside a zip usually mean the archive was password-protected or encrypted. High entropy is consistent with encryption or packing, but compressed data looks the same, so entropy alone names nothing. Ciphertext is not limited to printable ASCII, so an all-printable blob suggests base64 or another text encoding. An intact zip header shows the file really is an archive, which is why steganography, where a carrier keeps its normal format, does not fit here.",
 h:"Entropy narrows the options. It does not name the algorithm."},

{id:"h28",t:"MATCH",pts:6,theme:"PKI and Trust",
 s:"23:20. A zero-trust programme needs each control matched to the risk it actually reduces. The registration authority is the team that proofs identities before any certificate is issued.",
 a:"Controls\nA) Internal CA with strict certificate policy\nB) Certificate transparency monitoring\nC) OCSP stapling at the edge\nD) Certificate pinning in the mobile app\nE) Short-lived certificates with automated renewal\nF) HSM with M-of-N approval for the CA key",
 q:"Match each control to the risk it reduces most.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"A) Internal CA with strict certificate policy"},{l:"B) Certificate transparency monitoring"},{l:"C) OCSP stapling at the edge"},{l:"D) Certificate pinning in the mobile app"},{l:"E) Short-lived certificates with automated renewal"},{l:"F) HSM with M-of-N approval"}],
 opts:[{v:"a",l:"Uncontrolled certificate issuance inside the organisation"},{v:"b",l:"A rogue certificate for your domain from a public CA"},{v:"c",l:"Clients failing open when the status service is unreachable"},{v:"d",l:"A trusted but wrong certificate being accepted by the app"},{v:"e",l:"Long exposure from a certificate that stays valid for years"},{v:"f",l:"A single insider minting trust at the root of the PKI"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d",r5:"e",r6:"f"},
 why:"An internal CA with a strict policy controls who can obtain internal certificates, and the registration authority is the team that proofs each requester identity before issue. Certificate transparency monitoring shows issuance for your domain by outside CAs, which is how a rogue certificate is found early. OCSP stapling lets the server attach a fresh status response, so clients do not stall or fail open when the responder is slow. Pinning makes the app refuse any certificate that is not the expected one. Short lifetimes with automation cap how long a bad certificate is useful, and a key held in escrow must still be protected the same way. An HSM with M-of-N approval stops one insider from using the root key alone.",
 h:"Each option names a specific failure mode. Match the failure, not the tool name."},

{id:"h32",t:"DND",pts:4,theme:"Obfuscation",
 s:"02:40. An analyst is drafting next-step actions for the same personal-storage upload case that the DLP and CASB alert described. The remediation plan must name the right control for each gap.",
 a:"Gaps found in the review\n- The upload used an allowed HTTPS path with no inspection of content\n- The payload was wrapped, so cleartext matching never fired\n- The inline control was in monitor mode, so nothing was enforced\n- No alert reached the SOC while the upload was in progress",
 q:"Drag one item into each of the four slots.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["Enable DLP inspection in the HTTPS path, not only cleartext","Decode wrapped payloads before matching content rules","Move the CASB inline control from monitor mode to blocking","Route DLP and CASB alerts to the SOC in near real time","Add a longer password policy for the finance team","Encrypt the workstation disk to stop the upload","Disable outbound HTTPS for the whole department"],
 slots:[{l:"Inspection gap",a:"Enable DLP inspection in the HTTPS path, not only cleartext"},{l:"Wrapping gap",a:"Decode wrapped payloads before matching content rules"},{l:"Enforcement gap",a:"Move the CASB inline control from monitor mode to blocking"},{l:"Detection gap",a:"Route DLP and CASB alerts to the SOC in near real time"}],
 why:"A DLP engine that reads cleartext only cannot inspect TLS traffic, so the first fix is to give it a decrypted path to inspect, usually through TLS inspection at the proxy. Wrapped or encoded payloads must be decoded before content rules run, otherwise base64 hides the data indefinitely. A CASB in monitor mode observes but enforces nothing, so it must move to blocking for the categories the business will not allow. Finally, an alert that never reaches the SOC is not detection: DLP and CASB events must be routed to the monitoring queue. Disk encryption, password length and blocking all outbound HTTPS do not close these four gaps and would break normal work.",
 h:"Four gaps: visibility, decoding, enforcement and alert routing."},

{id:"h31",t:"MATCH",pts:5,theme:"Key Management",
 s:"00:20. A new certificate service is being approved for an internal PKI. Five statements from the request need a verdict before the change board signs it off.",
 a:"Statements\nOur internal CA issues certificates only after the registration authority proofs the requester identity\nEvery private key for the service is escrowed in the CA database so support can recover it\nA 8192-bit RSA key is used on every certificate to remove the need for rotation\nCertificates are valid for five years so the team renews them less often\nOur service passwords are stored as a single SHA-1 digest with no per-account salt",
 q:"Match each statement to the verdict it deserves.",
 instr:"CHOOSE ONE OPTION PER ROW",
 rows:[{l:"Identity proofed by the registration authority before issue"},{l:"Every private key escrowed in the CA database"},{l:"A larger RSA key is used instead of key rotation"},{l:"Five-year certificates to reduce the renewal effort"},{l:"Passwords stored as one unsalted SHA-1 digest"}],
 opts:[{v:"a",l:"Approved: issue follows proofing of the requester identity"},{v:"b",l:"Rejected: escrow must not put user keys where the CA can sign"},{v:"c",l:"Rejected: rotation limits exposure, key size does not"},{v:"d",l:"Rejected: a long lifetime keeps a bad certificate useful"},{v:"e",l:"Rejected: a fast unsalted digest invites rainbow tables"}],
 ans:{r1:"a",r2:"b",r3:"c",r4:"d",r5:"e"},
 why:"The registration authority proofs the requester identity before the CA issues anything, so the first statement is the approved practice. Escrow is legitimate for a recovery key, but putting every user private key in the CA database breaks non-repudiation, because the CA could then sign as the user; the key must stay under the owner control, ideally on a token or in an HSM with separation of duties. A larger RSA key does not replace rotation: rotation and a bounded certificate lifetime limit how long one exposed key stays useful. Five-year certificates keep a compromised or mis-issued certificate trusted for years. Storing passwords as a single unsalted SHA-1 digest is also wrong: a fast, unsalted hash of that kind allows rainbow tables and precomputed lookup, so each account needs a unique salt and a deliberately slow password hash.",
 h:"One statement follows good practice. The other three confuse escrow, key size and lifetime with the risk they are meant to reduce."},

{id:"h29",t:"DND",pts:4,theme:"Obfuscation",
 s:"00:40. A supplier uploads a signed firmware update. The SHA-256 in the advisory matches, but the build system flags two anomalies and asks for your decision.",
 a:"Update facts\n- Published SHA-256 in the supplier advisory matches the uploaded file\n- File is 12 MB larger than the same version published last month\n- Update server logs a second TLS connection from an unexpected region\n- The advisory and the file came from the same supplier portal",
 q:"Drag one item into each of the four slots.",
 instr:"DRAG EACH ANSWER (click a chip, then click a slot)",
 bank:["A matching hash only proves the file matches the advisory","It does not prove where the file came from in the first place","Quarantine the build and confirm it out of band with the supplier","Deploy the update because the published SHA-256 matches it","Re-publish the advisory with the new file size and hash","Delete the file and stop updating the fleet until next quarter"],
 slots:[{l:"What the hash proves",a:"A matching hash only proves the file matches the advisory"},{l:"What the hash cannot prove",a:"It does not prove where the file came from in the first place"},{l:"Best next step",a:"Quarantine the build and confirm it out of band with the supplier"},{l:"What not to do",a:"Deploy the update because the published SHA-256 matches it"}],
 why:"A matching hash only proves the file is the one the advisory describes. If an attacker replaces both the file and the advisory, the hash still matches, so the hash is not evidence of origin. The size change and the unexpected upload region are inconsistent with a normal release, so the safe action is quarantine, out-of-band confirmation and provenance checks such as a signature from a known key. Deploying on the hash alone trusts the very document that may be forged, and re-publishing or deleting the update hides the signal or leaves the fleet unpatched.",
 h:"Ask who wrote the advisory, and whether it could have changed with the file."},

{id:"h30",t:"ORD",pts:5,theme:"Hashing and Integrity",
 s:"01:20. A hash mismatch is found during an update rollout. Put the response steps in the right order.",
 a:"Steps (not in order)\nRotate the signing key and re-issue the release signature\nVerify the file against the vendor signed advisory through a separate channel\nPublish a security advisory and recall the bad artefact\nFreeze the rollout and quarantine the artefact, keeping the original copy\nRecord findings in the incident ticket and update the release process",
 q:"Order the response from the first action to the last.",
 instr:"USE THE ARROW BUTTONS TO REORDER",
 items:["Freeze the rollout and quarantine the artefact, keeping the original copy","Verify the file against the vendor signed advisory through a separate channel","Rotate the signing key and re-issue the release signature","Publish a security advisory and recall the bad artefact","Record findings in the incident ticket and update the release process"],
 why:"First, stop the spread: freeze the rollout and quarantine the artefact without destroying evidence. Then confirm origin through a separate channel, because the same channel that delivered the file cannot be trusted to describe it. If the signing key may be exposed, rotate it and re-issue the signature. Then tell the people affected with an advisory and a recall. Finally, record what happened and change the release process so the same gap cannot be reused.",
 h:"Containment comes before confirmation, and confirmation comes before touching keys or telling users."}
];

/* =========================================================================
   FRAMEWORK — written once, drives every exercise above.
   ========================================================================= */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var META={topicId:"security-plus",chapter:1.4,title:"Cryptographic Solutions",difficulty:"hard",questionCount:32,estimatedMinutes:69,passMark:70};
try{var raw=$("#cm-exercise-meta");if(raw){META=JSON.parse(raw.textContent);}}catch(e){}
var PASS=META.passMark||70, TOTMETA=META.estimatedMinutes||69;
var main=$("#main"),tLeft=$("#tLeft"),scNow=$("#scNow"),qNow=$("#qNow"),pFill=$("#pFill"),pauseInd=$("#pauseInd"),btnPause=$("#btnPause");
var USER={name:"",country:"ZZ",theme:"dark"};
var S=null,armed=null,armedCls=null;

function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r;}
function r1(n){return Math.round(n*10)/10;}
function norm(v){return String(v||"").toLowerCase().replace(/\s+/g," ").replace(/[.]+$/,"").trim();}
function testTerm(tm,val){
  if(!val)return false;
  if(!tm.re.test(val))return false;
  var req=tm.req||[];
  for(var i=0;i<req.length;i++){if(!req[i].test(val))return false;}
  return true;
}
var LETTERS=["A","B","C","D","E","F","G","H"];

/* ---------- preparation: shuffle answers once per attempt ---------- */
function prepare(){
  S.views=EX.map(function(ex,i){
    var v={ex:ex,idx:i,i:ex.id,t:ex.t,pts:ex.pts||1,theme:ex.theme||"General"};
    v.parts=[];
    if(ex.t==="MCQ"||ex.t==="MS"){
      v.order=shuffle((ex.o||[]).map(function(_,idx){return idx;}));
      (ex.k||[]).forEach(function(letter){
        var orig=letter.charCodeAt(0)-97,pos=v.order.indexOf(orig);
        v.parts.push({id:"c"+orig,label:"choice "+LETTERS[pos],pts:1,
          ok:function(){return !!S.cv[v.i].sel["c"+orig];},
          detail:(ex.o||[])[orig]});
      });
      v.maxParts=(ex.k||[]).length||1;
    } else if(ex.t==="DND"){
      v.bank=(ex.bank||[]).map(function(text,idx){return {text:text,idx:idx};});
      v.bankOrder=shuffle(v.bank.map(function(b){return b.idx;}));
      v.slots=ex.slots;
      v.slots.forEach(function(sl,si){
        v.parts.push({id:"s"+si,label:sl.l,pts:1,
          ok:function(){var b=v.bank[parseInt(S.cv[v.i].pick[si],10)];return !!b&&b.text===sl.a;},
          detail:"should be: "+sl.a});
      });
      v.maxParts=v.parts.length;
    } else if(ex.t==="CLASS"){
      v.cats=ex.cats;
      v.bank=(ex.bank||[]).map(function(b,idx){return {text:b.l,c:b.c,idx:idx};});
      v.bankOrder=shuffle(v.bank.map(function(b){return b.idx;}));
      v.parts=v.bank.map(function(b,bi){
        return {id:"b"+bi,label:b.text,pts:1,
          ok:function(){return S.cv[v.i].pick["b"+bi]===b.c;},
          detail:"role: "+(((ex.cats||[]).filter(function(c){return c.id===b.c;})[0]||{}).l||"")};
      });
      v.maxParts=v.parts.length;
    } else if(ex.t==="MATCH"){
      v.rows=ex.rows;
      v.opts=shuffle((ex.opts||[]).map(function(o,idx){return {v:o.v,l:o.l,idx:idx};}));
      v.parts=v.rows.map(function(row,ri){
        var good=ex.ans["r"+(ri+1)];
        return {id:"r"+(ri+1),label:row.l,pts:1,
          ok:function(){return S.cv[v.i].pick["r"+(ri+1)]===good;},
          detail:"correct option: "+optText(v,good)};
      });
      v.maxParts=v.rows.length;
    } else if(ex.t==="ORD"){
      v.items=ex.items.slice();
      v.start=shuffle(v.items.map(function(_,i){return i;}));
      v.parts=v.items.map(function(text,i){
        return {id:"p"+i,label:text,pts:1,ok:function(){return S.cv[v.i].ord[i]===i;},detail:"position "+(i+1)};
      });
      v.maxParts=v.items.length;
    } else if(ex.t==="INP"){
      v.fields=ex.fields;
      v.parts=v.fields.map(function(f,fi){
        return {id:"f"+fi,label:f.l,pts:1,
          ok:function(){var val=norm(S.cv[v.i].txt[fi]);return (f.acc||[]).some(function(a){return norm(a)===val;});},
          detail:"accepted: "+f.disp};
      });
      v.maxParts=v.fields.length;
    } else if(ex.t==="TERM"){
      v.terms=ex.terms;
      v.parts=v.terms.map(function(tm,ti){
        return {id:"t"+ti,label:tm.l,pts:1,
          ok:function(){return testTerm(tm,norm(S.cv[v.i].txt[ti]));},
          detail:"expected: "+tm.disp};
      });
      v.maxParts=v.terms.length;
    } else if(ex.t==="DUAL"){
      v.groups=ex.groups;
      v.groups.forEach(function(g,gi){
        (g.k||[]).forEach(function(letter){
          var orig=letter.charCodeAt(0)-97;
          v.parts.push({id:"g"+gi+"_"+orig,label:g.l,pts:1,
            ok:function(){return !!S.cv[v.i].sel["g"+gi+"_"+orig];},
            detail:g.opts[orig]});
        });
      });
      v.maxParts=v.parts.length;
    }
    v.maxParts=v.maxParts||1;
    v.perPart=v.pts/v.maxParts;
    return v;
  });
}
function optText(v,val){var f=(v.opts||[]).filter(function(o){return o.v===val;})[0];return f?f.l:val;}

function newState(){
  var order=EX.map(function(_,i){return i;});
  shuffle(order);
  S={order:order,pos:0,cv:{},locked:{},revising:{},skipped:{},
     manual:false,checkPause:false,tLeft:TOTMETA*60,tick:null,finished:false,results:null};
  EX.forEach(function(ex){S.cv[ex.id]={sel:{},pick:{},txt:[],ord:[],hint:false};});
  S.views.forEach(function(v){
    if(v.t==="ORD")S.cv[v.i].ord=v.start.slice();
    if(v.t==="INP"||v.t==="TERM")S.cv[v.i].txt=(v.ex.fields||v.ex.terms||[]).map(function(){return "";});
  });
}
function view(){return S.views.filter(function(v){return v.i===EX[S.order[S.pos]].id;})[0];}
function editing(v){return !S.locked[v.i]||!!S.revising[v.i];}

function itemScores(v){
  var cv=S.cv[v.i],c=0;
  v.parts.forEach(function(p){if(p.ok())c++;});
  var earned=c*v.perPart;
  if(cv.hint)earned=earned*0.9;
  return {correct:c,earned:r1(earned),max:v.pts,
          label:c===v.parts.length?"full":(c>0?"partial":"zero")};
}
function totals(){
  var earned=0,max=0,answered=0,skipped=[],denied=0;
  S.views.forEach(function(v){
    if(S.skipped[v.i]&&!S.locked[v.i]){skipped.push(v.idx+1);return;}
    var sc=itemScores(v);
    earned+=sc.earned;max+=sc.max;answered++;
  });
  S.views.forEach(function(v){if(S.cv[v.i].hint)denied+=v.pts*0.10;});
  earned=Math.max(0,earned-denied);
  var pct=max>0?Math.round((earned/max)*100):0;
  return {earned:r1(earned),max:max,answered:answered,skipped:skipped,pct:pct,denied:r1(denied)};
}
function refreshHud(){
  tLeft.textContent=fmt(S.tLeft);
  var t=totals();
  scNow.textContent=t.earned.toFixed(1)+" / "+t.max;
  qNow.textContent=(S.pos+1)+" / "+S.order.length;
  pFill.style.width=((S.pos+1)/S.order.length*100)+"%";
  pFill.parentNode.classList.toggle("amber",t.skipped.length>0);
  var parts=[];
  if(S.manual)parts.push("Paused (manual)");
  if(S.checkPause)parts.push("Timer paused — review mode");
  pauseInd.textContent=parts.length?parts.join(" + "):"Timer running";
  pauseInd.className="pill"+(parts.length?" on":"");
  btnPause.setAttribute("aria-pressed",S.manual?"true":"false");
  btnPause.textContent=S.manual?"Resume":"Pause";
  $("#hdSev").textContent="Timer "+fmt(TOTMETA*60)+" · pass "+PASS+"%";
}
function tick(){
  if(!S||S.finished)return;
  if(!S.manual&&!S.checkPause){
    S.tLeft-=1;
    if(S.tLeft<=0){S.tLeft=0;refreshHud();finish(true);return;}
  }
  refreshHud();
}
function startTimer(){if(S.tick)clearInterval(S.tick);S.tick=setInterval(tick,1000);}

/* ---------- rendering ---------- */
function blockArt(v){
  var ex=v.ex,a=ex.a||"";
  if(ex.t==="LOGV"){
    return '<div class="blk art"><span class="lbl">Evidence</span>'+
      '<div class="filter" style="margin-bottom:8px"><label class="sr" for="flt-'+esc(v.i)+'">Filter the evidence lines</label>'+
      '<input id="flt-'+esc(v.i)+'" type="text" placeholder="Filter evidence lines (for example: ct-log, 200, revoked, sha)" data-flt="'+esc(v.i)+'"></div>'+
      '<pre id="pre-'+esc(v.i)+'">'+a.split("\n").map(function(l){return '<span class="logline">'+esc(l)+'</span>';}).join("\n")+'</pre></div>';
  }
  return '<div class="blk art"><span class="lbl">Evidence</span><pre>'+esc(a)+'</pre></div>';
}
function optionsHtml(v,group){
  var ex=v.ex,g=(v.t==="DUAL")?v.groups[group]:null;
  var arr=g?g.opts:ex.o;
  var order=(v.t==="DUAL")?arr.map(function(_,i){return i;}):v.order;
  var sel=(v.t==="DUAL")?("g"+group+"_"):"c";
  var type=(v.t==="MS"||v.t==="DUAL")?"checkbox":"radio";
  var lock=!editing(v);
  var html="";
  order.forEach(function(orig,pos){
    var id=sel+orig,on=!!S.cv[v.i].sel[id];
    var correct=(v.t==="DUAL")?((g.k||[]).indexOf(String.fromCharCode(97+orig))>=0)
                              :((ex.k||[]).indexOf(String.fromCharCode(97+orig))>=0);
    var cls="opt";
    if(lock){
      if(correct&&on)cls+=" good";
      else if(correct&&!on)cls+=" miss";
      else if(!correct&&on)cls+=" err";
    }
    var mark=lock?('<span class="chip-in '+(correct?"ok":"bad")+'">'+(correct?"correct":"wrong")+'</span>'):"";
    html+='<label class="'+cls+'"><input type="'+type+'" name="g-'+esc(v.i)+'-'+group+'" data-sel="'+esc(id)+'" '+(on?"checked":"")+' '+(lock?"disabled":"")+'>'+
      '<span class="k">'+LETTERS[pos]+'</span><span>'+esc(arr[orig])+mark+'</span></label>';
  });
  return html;
}
function renderAnswer(v){
  var ex=v.ex,html="",lock=!editing(v);
  if(ex.t==="MCQ"||ex.t==="MS"){html+=optionsHtml(v,0);}
  else if(ex.t==="DUAL"){
    html+='<div class="two">';
    v.groups.forEach(function(g,gi){html+='<div><h3>'+esc(g.l)+'</h3>'+optionsHtml(v,gi)+'</div>';});
    html+='</div>';
  }
  else if(ex.t==="DND"){
    html+='<p class="note">Click a chip to select it, then click a slot. Keyboard: tab to a chip, press Enter, then tab to the slot and press Enter. You can also drag with the mouse. A slot always shows the item it holds.</p>';
    html+='<div class="pool">'+v.bankOrder.map(function(bi){
      return '<button type="button" class="chip" data-bank="'+bi+'" aria-pressed="false" '+(lock?"disabled":"")+'>'+esc(v.bank[bi].text)+'</button>';
    }).join("")+'</div>';
    v.slots.forEach(function(sl,si){
      var pick=S.cv[v.i].pick[si];
      var txt=(pick!==undefined&&pick!=="")?v.bank[parseInt(pick,10)].text:"(empty)";
      var cls="drop",mark="";
      if(lock){
        var ok=v.parts[si].ok();
        cls+=(ok?" good":" bad");
        mark='<span class="chip-in '+(ok?"ok":"bad")+'">'+(ok?"correct":"wrong")+'</span>';
        if(!ok)mark+='<span class="chip-in miss">expected: '+esc(sl.a)+'</span>';
      }
      html+='<div class="slot"><span class="sn">'+esc(sl.l)+'</span>'+
        '<div class="'+cls+'" data-slot="'+si+'" tabindex="0" role="button" aria-label="Slot '+esc(sl.l)+'">'+esc(txt)+mark+'</div>'+
        (lock?"":'<button type="button" class="btn sm" data-clear="'+si+'">Clear</button>')+'</div>';
    });
  }
  else if(ex.t==="CLASS"){
    html+='<p class="note">Click an item, then click the role. Keyboard: tab to the item, press Enter, then tab to the role and press Enter.</p>';
    html+='<div class="pool">'+v.bankOrder.map(function(bi){
      var b=v.bank[bi],picked=S.cv[v.i].pick["b"+bi]||null,cls="chip";
      if(lock)cls+=(picked===b.c?" good":" bad");
      var tag=picked?('<span class="chip-in mut">'+(lock?(picked===b.c?"correct":"wrong"):"assigned")+'</span>'):"";
      return '<button type="button" class="'+cls+'" data-cls="'+bi+'" aria-pressed="'+(picked?"true":"false")+'" '+(lock?"disabled":"")+'>'+esc(b.text)+tag+'</button>';
    }).join("")+'</div><div class="two">';
    v.cats.forEach(function(c){
      var kids=v.bank.filter(function(b){return S.cv[v.i].pick["b"+b.idx]===c.id;});
      html+='<div class="slot" style="display:block"><div class="sn" style="flex:none">'+esc(c.l)+'</div>'+
        '<div class="drop" data-cat="'+esc(c.id)+'" tabindex="0" role="button" aria-label="'+esc(c.l)+'">'+
        (kids.length?kids.map(function(b){return '<span class="chip-in mut">'+esc(b.text)+'</span>';}).join(" "):"(empty)")+'</div></div>';
    });
    html+='</div>';
  }
  else if(ex.t==="MATCH"){
    v.rows.forEach(function(row,ri){
      var id="r"+(ri+1),pick=S.cv[v.i].pick[id]||"",cls="rw";
      if(lock)cls+=(v.parts[ri].ok()?" good":" bad");
      var opts='<option value="">-- choose --</option>'+v.opts.map(function(o){
