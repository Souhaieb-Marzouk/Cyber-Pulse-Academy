window.EXAM_QUESTIONS = [{"id":"M01","type":"classify","theme":"Control categories","points":10,"scenario":"You are a GRC analyst at Northwind Health. A new auditor asks you to sort the current control register into the four CompTIA control categories: technical, managerial, operational and physical.","question":"Place every register item in the correct control category.","buckets":["Technical (logical)","Managerial (administrative)","Operational","Physical"],"items":["Stateful firewall rule that blocks inbound SMB","Acceptable use policy signed during onboarding","SOC analyst reviews authentication logs every morning","Bollards in front of the data-centre loading bay","EDR agent installed on every laptop","Annual risk assessment workshop with the CISO","Change advisory board approves every firewall request","Shredder beside every printer on the third floor"],"answer":[0,1,2,3,0,1,2,3],"whyEach":["A firewall rule is enforced by software, so it is a technical control.","A written rule signed by staff is a management document, so it is a managerial control.","A daily human routine in the SOC is an operational control: people and process, not a product.","A bollard is a fixed object on the site, so it is a physical control.","An EDR agent is software on the endpoint, so it is technical.","A workshop with management that reviews risk is a managerial control.","A board that approves changes is an operational process control.","A shredder destroys paper on site, so it is a physical control."],"hint":"Ask what actually enforces the control: software, a written rule from managers, a daily human routine, or something fixed on the site.","why":"The four categories answer the question: how is the control delivered? Software and hardware rules are technical. Written rules, risk reviews and training are managerial. Day-to-day routines run by people are operational. Anything you can touch on the site is physical. The same goal, for example blocking SMB, can be met by controls from more than one category.","kw":["technical (logical) control","managerial (administrative) control","operational control","physical control","firewall","EDR","acceptable use policy (AUP)","risk assessment","change management","bollard","log review","onboarding / offboarding","shredder"]},{"id":"M02","type":"classify","theme":"Control types","points":10,"scenario":"Falcon Logistics is redesigning its warehouse security. The design team lists six proposed controls and asks you to label each one with its control type.","question":"Put each proposed control under the type that best describes what it does.","buckets":["Preventive","Detective","Corrective","Deterrent","Compensating","Directive"],"items":["IDS sensor that alerts on port scans","Warning banner shown before login","MFA required on the VPN","Sign at the lab door: badge in before entering","Unpatchable label printer kept on an isolated VLAN","Restore of the file server from last night's backup"],"answer":[1,3,0,5,4,2],"whyEach":["An IDS watches and alerts. It does not stop traffic, so it is detective.","A banner warns an attacker that the system is monitored. It discourages action, so it is a deterrent.","MFA stops an unauthorised login before it happens, so it is preventive.","The sign tells people what they must do, so it is a directive control.","The printer cannot be patched, so a different control (isolation) reduces the risk. That is compensating.","Restoring from backup puts the service back after the damage, so it is corrective."],"hint":"Ask: does it stop (prevent), notice (detect), repair (correct), scare (deter), stand in for a missing control (compensate), or tell people what to do (direct)?","why":"The six types describe what a control does, while the four categories describe how it is delivered. A control can carry two labels: an MFA prompt is a technical preventive control; the same idea written in a standard is a managerial directive one. Directive controls only work with training, because a rule nobody knows cannot guide behaviour.","kw":["preventive control","detective control","corrective control","deterrent control","compensating control","directive control","IDS / IPS","MFA","VLAN segmentation","backup and restore","security awareness training"]},{"id":"M03","type":"match","theme":"Control types","points":10,"scenario":"You are filling in the control mapping sheet for an ISO/IEC 27001 Annex A gap analysis at Greyline Media.","question":"Match each control description with the control type that best fits it.","pairs":[["Two-person rule for the vault door","Preventive"],["Motion sensor that triggers the alarm","Detective"],["Re-imaging a laptop after malware","Corrective"],["Notice: trespassers will be prosecuted","Deterrent"],["Cloud WAF in front of an app that cannot be patched","Compensating"],["Procedure: visitors must sign the register","Directive"]],"why":"A two-person rule blocks a single person from acting alone, so it prevents. A motion sensor only reports, so it detects. Re-imaging puts the endpoint back to a known good state, so it corrects. A legal notice tries to stop an attacker by fear of consequences, so it deters. A WAF added because patching is impossible is compensating. A written procedure that tells people what to do is directive.","hint":"Group the answers by the verb: blocks, notices, repairs, scares, replaces, instructs.","kw":["preventive control","detective control","corrective control","deterrent control","compensating control","directive control","ISO/IEC 27001 Annex A","WAF","separation of duties","control gap"]},{"id":"M04","type":"order","theme":"Defense in depth","points":10,"scenario":"A new architect at Halcyon Retail asks how the layers of defense in depth are usually drawn. The question runs from the outside of the building through to the data itself.","question":"Order the five layers from outermost to innermost.","items":["Perimeter: fence, bollards and the internet edge firewall","Network: VLAN segmentation plus IDS sensors","Endpoint: hardened laptops with EDR and antivirus","Application: input validation and a WAF","Data: encryption at rest and tested backups"],"why":"Defense in depth means several independent controls between the attacker and the asset. Each layer assumes the one before it has already failed. The perimeter slows an attacker down. The network limits how far they can move. The endpoint and the application reduce what they can run. The data layer keeps the information unreadable or recoverable, even after a full compromise.","hint":"Start where an attacker first stands: outside the building. Finish where the valuable information lives.","kw":["defense in depth","firewall","VLAN segmentation","IDS / IPS","EDR","antivirus","WAF","encryption","backup and restore","fence","bollard"]},{"id":"M05","type":"fill","theme":"Control types in an audit","points":10,"scenario":"You are drafting the wording of three findings from a physical security audit at Bayview Clinic.","question":"Fill each gap with the control type that fits the finding.","parts":["Finding 1: the CCTV system is a ",{"b":0}," control because it records activity for later review. Finding 2: the door plate lock on the same door is a ",{"b":1}," control because it stops most people from entering. Finding 3: the unpatched label printer now sits in its own VLAN as a ",{"b":2}," control until the vendor releases a fix. Finding 4: the same two payment approvers have shared one queue for six years and neither has taken two weeks of leave, so the ",{"b":3}," control is missing."],"answers":["detective","preventive","compensating","job rotation"],"extras":["corrective","deterrent","directive"],"hint":"One finding is about noticing, one about stopping, one about standing in for a patch you cannot apply, and one about fraud that needs constant hiding.","why":"CCTV produces evidence after the event, so it detects. A lock physically stops entry, so it prevents. A compensating control is a different control used when the main control, here patching, cannot be applied. Job rotation moves staff between duties, so fraud needs two people at once. Mandatory vacation exposes fraud that needs the same person every day. Both are managerial detective controls that cost only time, which is why auditors look for them first.","kw":["detective control","preventive control","compensating control","CCTV","lock","VLAN segmentation","patch management","residual risk","security audit","job rotation","mandatory vacation","managerial (administrative) control"]},{"id":"M06","type":"mcq","theme":"Deterrent controls","points":10,"scenario":"Redwood Bank is refreshing the signage in its branch lobbies after two attempted break-ins.","question":"Which single action adds a deterrent control?","opts":["A sign that says the area is watched by CCTV cameras","A sign that lists the opening hours of the branch","A camera that records the lobby for thirty days","A guard who checks badges at the staff door"],"correct":[0],"whyEach":{"0":"The sign warns an attacker that they will be seen, so it discourages the attempt. That is a deterrent.","1":"Opening hours inform customers. They do not change an attacker's decision.","2":"A recording camera is a detective control. The sign about it is the deterrent.","3":"A guard checking badges prevents entry. Guards can deter as well, but the badge check itself is preventive."},"hint":"A deterrent changes the attacker's decision before they act. Look for the option that only warns.","why":"Deterrent controls work on the attacker's mind, not on the asset. A warning sign, a visible camera housing or a marked patrol car may stop an attempt before it starts. They are cheap but weak on their own, because an attacker who knows the camera is fake will simply ignore the sign.","kw":["deterrent control","detective control","CCTV","security guard","badge reader"]},{"id":"M07","type":"spot","theme":"Detective controls in logs","points":10,"scenario":"You are on the night shift in the Northwind Health SOC. A ticket says the app server had a burst of failed logins. You open the authentication log.","art":{"kind":"log","title":"srv-app auth log (excerpt)","pick":true,"lines":["Mar 14 02:11:07 srv-app sshd[2211]: Accepted password for deploy from 10[.]20[.]5[.]44 port 51233 ssh2","Mar 14 02:11:09 srv-app sshd[2214]: Failed password for root from 203[.]0[.]113[.]9 port 40122 ssh2","Mar 14 02:11:10 srv-app sshd[2216]: Failed password for root from 203[.]0[.]113[.]9 port 40124 ssh2","Mar 14 02:11:11 srv-app sshd[2218]: Connection closed by authenticating user admin 10[.]20[.]5[.]44 port 51400 [preauth]","Mar 14 02:11:12 srv-app systemd[1]: Started Session 88 of user deploy.","Mar 14 02:11:15 srv-app sshd[2220]: Failed password for root from 203[.]0[.]113[.]9 port 40130 ssh2"]},"question":"Click the three lines that show the brute-force attempt on the SSH service.","bad":[1,2,5],"whyEach":["Normal admin login from an internal address. Not part of the attack.","Failed login for root from an external address. Repeated attempts are the signature of a brute force.","Another failed root login from the same external address two seconds later.","A user disconnecting before authentication. This is noise, not an attack.","A normal session start for the deploy account.","A third failed root login from the same external address. The pattern confirms it."],"hint":"Look for one source address that keeps failing on the same account.","why":"Three failed root logins from one external address in six seconds is a brute-force attempt. The log file itself is not a control; the control is the monitoring that reads it. Log review, a SIEM rule or an IPS threshold all turn this raw evidence into a detection. The next step is to block the source and check whether any attempt succeeded.","kw":["detective control","log review","SIEM","IDS / IPS","technical (logical) control"]},{"id":"M08","type":"terminal","theme":"Log review command","points":10,"scenario":"The on-call ticket says 'repeated failed logins on the app server'. The shift SOP says you must count the failures before you write the ticket update. You are on the Linux host and the authentication log is at /var/log/auth.log. You must produce that count now.","question":"Type a grep command that counts how many times the text Failed password appears in /var/log/auth.log.","hint":"Use the grep command with the count option so it prints only a number, put the pattern in quotes, and give the file path last.","sample":"Expected shape of the output: one line holding a single number, for example:\n12","parts":[{"re":{"source":"\\bgrep\\b","flags":""},"label":"uses the grep command"},{"re":{"source":"(^|\\s)-[a-zA-Z]*c[a-zA-Z]*(\\s|$)|--count\\b","flags":""},"label":"uses the count option (-c)"},{"re":{"source":"failed password","flags":"i"},"label":"matches the text Failed password"},{"re":{"source":"\\/var\\/log\\/auth\\.log","flags":""},"label":"reads /var/log/auth.log"}],"solution":"grep -c \"Failed password\" /var/log/auth.log","why":"Counting failures turns a pile of lines into one number you can compare with yesterday. A sudden jump is what the SOC escalates. The command itself does not block anything: grep is part of the operational routine of log review, which supports the detective control. Blocking comes later, from the firewall or the account lockout policy.","kw":["log review","operational control","detective control","preventive control","standard operating procedure (SOP)"]},{"id":"M09","type":"branch","theme":"Compensating control decision","points":10,"scenario":"You are the duty analyst at Beacon Insurance. A public web server runs an old content manager with a critical remote-code flaw. The vendor patch window opens in five days, and the server must stay online for a live customer event.","question":"Answer each step the way a careful analyst would. Each step records your choice when you click it.","hint":"At each step ask which choice keeps the service running while lowering the risk, and which choice only documents the problem or ignores it.","steps":[{"sit":"Step 1 - the immediate decision.","opts":["Put the server behind the WAF in block mode, restrict admin access to the office range, and keep the site online","Shut the server down until patch day","Leave it as it is and wait for patch day","Remove the firewall in front of the server so you can watch the traffic better"],"correct":0,"res":["Good. You added a compensating control instead of accepting the exposure as it was.","The event would fail and the business would lose money for no technical reason.","The host stays exposed for five days with a known exploit in the wild.","Removing a preventive control during an active risk makes the exposure worse."]},{"sit":"Step 2 - the paperwork that keeps the decision legal.","opts":["Open a POA&M entry, record the compensating control and the patch date, and get CISO sign-off","Send the vendor an email and wait for a reply","Add a comment in the ticket and close it as solved","Mention it at the next quarterly audit"],"correct":0,"res":["Correct. The POA&M is the record of a known weakness with an owner and a date.","The vendor is not the risk owner. Nothing is recorded on your side.","A closed ticket hides the open risk from the auditor.","Three months of undocumented exposure is exactly what the auditor looks for."]},{"sit":"Step 3 - patch day. How do you prove the temporary control can be removed?","opts":["Rescan the host, confirm the patched version, then remove the temporary WAF rule","Leave the WAF rule in place and close the ticket","Reimage the whole server instead of patching","Ask the vendor for a new licence before doing anything"],"correct":0,"res":["Correct. Verification proves the real fix works before the compensating control is retired.","A rule nobody reviews becomes permanent clutter and hides the next real problem.","A reimage is slow and does not prove the flaw is fixed in the product.","Licensing is unrelated to the technical fix."]}],"why":"A compensating control keeps the risk low while the real fix waits. It must be documented, time-boxed and verified, or it becomes a permanent shadow control that nobody owns. A POA&M gives the finding an owner and a date, and a rescan before removal proves the primary control finally works.","kw":["compensating control","plan of action and milestones (POA&M)","WAF","patch management","vulnerability scanner","risk response: mitigate","residual risk"]},{"id":"M10","type":"spot","theme":"Firewall rule review","points":10,"scenario":"A change request adds management access to an internet edge firewall at Halcyon Retail. You review the proposed rule set before the change advisory board meets.","art":{"kind":"code","title":"edge-fw.cfg (proposed rules, top to bottom)","pick":true,"lines":["rule 10 permit tcp any any eq 3389 log","rule 20 permit tcp any any eq 22 log","rule 30 deny ip any any log","rule 40 permit tcp 10[.]20[.]0[.]0/16 any eq 445","! implicit deny all"]},"question":"Click the two rules that must be fixed before this change is approved.","bad":[0,1],"whyEach":["Rule 10 opens RDP (3389) from the whole internet. That is how ransomware crews find a way in.","Rule 20 opens SSH (22) from the whole internet. Management access must come from a known range.","Rule 30 denies everything else and logs it. This is good practice.","Rule 40 allows internal hosts to reach file shares. It is not internet facing, so it is not the finding.","The implicit deny at the end is the correct last line of a rule set."],"hint":"Look at the source side of each permit rule. Where does it allow traffic to come from?","why":"A firewall is a preventive technical control, but only if the rules match policy. Permitting management ports from any source turns a strong control into an open door. The fix is to limit the source to the office range, keep the logging, and review the rule again at the next access review.","kw":["firewall","access control list (ACL)","preventive control","technical (logical) control","change management","access review","log review"]},{"id":"M11","type":"order","theme":"Risk-based prioritisation","points":10,"scenario":"You are the vulnerability management lead at Beacon Insurance. The weekly report lists five open items. You have one team for the next 48 hours.","question":"Order the five actions from most urgent at the top to least urgent at the bottom.","items":["Patch the internet-facing VPN appliance: CVSS 9.8, exploit already seen in the wild","Remove the unused FTP service from the DMZ web host: internet facing, no business owner","Patch the internal print server: CVSS 9.8, not reachable from outside, no known exploit","Upgrade TLS 1.0 on the intranet wiki: internal users only","Replace the end-of-life switch firmware in the lab: next maintenance window"],"why":"Risk is likelihood times impact, not the CVSS number alone. An internet-facing, actively exploited flaw is first. An exposed but unused service is next, because removing it is cheap and shrinks the attack surface. A high score on an unreachable internal host can wait behind exposed items. The last two raise the score slowly and have no evidence of attack.","hint":"Ask two questions for each item: can an attacker reach it from the internet, and is anyone already using the flaw?","kw":["risk assessment","patch management","firewall","vulnerability scanner","residual risk","risk response: mitigate","due care / due diligence"]},{"id":"M12","type":"dual","theme":"Blue and red on physical entry","points":10,"scenario":"Vantage Tower uses a badge reader and CCTV at the single staff entrance. You look at the same entrance twice, once as the defender and once as the attacker.","question":"Two views of the same door: answer the blue view first, then the red view.","hint":"Blue side: think about what one badge log can prove on its own. Red side: the cheapest way past two controls at the same time.","q1":{"q":"Blue team: what can the badge logs alone show you?","opts":["One badge used at two different doors within four seconds","A visitor who signed the paper register","A camera that lost focus during the night","A cleaner who propped a door open at 07:00"],"correct":[0]},"q2":{"q":"Red team: with a stolen badge, which action defeats the badge reader and the CCTV together?","opts":["Follow an employee through the turnstile with your head down","Cover the camera lens with tape the night before","Clone the badge at home with a reader","Ask the receptionist for a visitor pass"],"correct":[0]},"why":"The blue side needs correlation. One badge cannot be at two doors at once, so the log shows tailgating. The red side uses the weakest point, which is the human habit of holding the door. This is why a single badge reader is not enough. A mantrap or a turnstile makes tailgating physically hard. The guard watching the door adds a human detective layer.","kw":["badge reader","CCTV","turnstile","mantrap","security guard","detective control","preventive control","deterrent control"]},{"id":"M13","type":"mcq","theme":"Control frameworks","points":10,"scenario":"A United States federal agency asks your team which catalogue of security and privacy controls it should use to build its control baseline and authorisation package.","question":"Which publication is the correct answer?","opts":["NIST SP 800-53, the federal control catalogue","ISO/IEC 27001 Annex A, the ISO control list","The CIS Critical Security Controls, a priority list","PCI DSS, the payment card industry standard","GDPR, the European privacy regulation"],"correct":[0],"whyEach":{"0":"SP 800-53 is the NIST catalogue of security and privacy controls used for federal systems and for many control baselines.","1":"Annex A is the control list inside the ISO management standard. It is widely used, but it is not the federal catalogue.","2":"The CIS Controls are a prioritised list of eighteen practice areas, useful but not a full control catalogue.","3":"PCI DSS is a payment card standard. It applies to card data, not to a federal authorisation package.","4":"GDPR is a privacy regulation that sets duties on personal data. It is not a catalogue of technical controls."},"hint":"One of these is a catalogue of controls with families such as AC, AU, CM and IA.","why":"Frameworks give you a starting point, then you tailor it. SP 800-53 is organised into control families and is the base of the federal control baseline. ISO/IEC 27001 Annex A gives a shorter list of control objectives. The CIS Controls are prioritised for quick wins. PCI DSS applies only to cardholder data. Knowing which one to pick is part of due care, because the wrong framework leaves gaps.","kw":["NIST SP 800-53","ISO/IEC 27001 Annex A","CIS Critical Security Controls","PCI DSS","GDPR","control baseline","control gap","due care / due diligence"]},{"id":"M14","type":"classify","theme":"Risk responses","points":10,"scenario":"In the quarterly risk review at Northwind Health, each open risk gets a response. You must label the actions the team has already agreed.","question":"Label each agreed action with the risk response it represents.","buckets":["Mitigate","Transfer","Accept","Avoid"],"items":["Deploy EDR on all servers","Buy cyber-insurance for ransomware loss","Document and accept the risk of a demo kiosk that holds no data","Stop selling the feature instead of fixing it","Contract an outside provider that becomes responsible for watching the network and for the cost of a missed detection","Enforce MFA on the finance system"],"answer":[0,1,2,3,1,0],"whyEach":["You add a control that lowers the risk. That is mitigation.","Insurance moves the financial loss to the insurer. That is transfer.","The risk stays, it is written down and signed. That is acceptance.","The activity that created the risk is removed. That is avoidance.","The contract moves both the monitoring duty and the cost of a missed detection to the supplier, so the risk is transferred.","A stronger login control lowers the risk. That is mitigation."],"hint":"Four verbs: lower it, move it to someone else, live with it, or stop doing the thing that creates it.","why":"Every risk ends with one of four responses, and the choice must be recorded with an owner. Mitigation adds or improves controls. Transfer moves cost or duty to a third party. Acceptance keeps the risk and signs for it. Avoidance removes the activity. Residual risk is what is left after the response, and it is never zero.","kw":["risk response: mitigate","risk response: transfer","risk response: accept","risk response: avoid","residual risk","EDR","MFA","risk assessment"]},{"id":"M15","type":"fill","theme":"Compensating control in a POA&M","points":10,"scenario":"Bayview Clinic has an MRI scanner that runs an operating system the vendor no longer updates. The scanner is needed every day, and the replacement budget arrives in the third quarter.","question":"Fill each gap so the POA&M entry reads correctly for the auditor.","parts":["Because the MRI scanner runs an unsupported system, it cannot be ",{"b":0}," on a normal cycle. We keep it on an isolated ",{"b":1}," and watch its traffic. We record this ",{"b":2}," control in the POA&M, and the CISO has ",{"b":3}," the remaining risk until the scanner is replaced in Q3."],"answers":["patched","VLAN","compensating","accepted"],"extras":["encrypted","firewall","preventive","transferred"],"hint":"One gap names the network idea that keeps the scanner apart from everything else.","why":"The scanner cannot be patched, so the team uses a different control: isolation plus monitoring. That is compensating, and it must be documented with a date. The CISO formally accepts the residual risk, because a compensating control lowers risk but never removes it. Without the signature, the clinic carries an unowned risk.","kw":["compensating control","patch management","VLAN segmentation","plan of action and milestones (POA&M)","risk response: accept","residual risk","continuous monitoring"]},{"id":"M16","type":"match","theme":"Detective tooling","points":10,"scenario":"You are writing the monitoring section of a security design document for Greyline Media. Each tool must be matched to the evidence it produces.","question":"Match each tool with what it detects.","pairs":[["SIEM","Correlates log events from many sources"],["File integrity monitoring (FIM)","Alerts when a system file changes"],["IDS","Watches network traffic for attack patterns"],["EDR","Records process and file behaviour on an endpoint"],["Honeypot","Lures an attacker and records their actions"],["Vulnerability scanner","Finds missing patches and weak settings"]],"why":"These tools are detective controls: they do not block, they tell you what is happening. A SIEM is only as good as the sources that feed it, and FIM only works when a baseline exists. A honeypot has no business value, so any traffic to it is suspicious by definition. A scanner looks for known weaknesses, usually on a weekly or monthly schedule, and feeds the patch process.","hint":"Two of these tools have nothing to do with live blocking. Match each one to the evidence it can give you.","kw":["SIEM","file integrity monitoring (FIM)","IDS / IPS","EDR","honeypot","vulnerability scanner","detective control","patch management","control baseline"]},{"id":"M17","type":"terminal","theme":"Verifying a host firewall","points":10,"scenario":"After a reboot, a Linux web host at Beacon Insurance is answering on a port that should be closed. You must show the current IPv4 filter rules, printed numerically, so the change board can see the control state.","question":"Type an iptables command that lists the current IPv4 rules using numeric addresses.","hint":"Use the iptables command. The listing option is a capital L, and the option that stops name lookups is a lowercase n.","sample":"Expected shape of the output: a chain header, then one line per rule with numeric addresses, for example:\nChain INPUT (policy ACCEPT)\ntarget     prot opt source               destination\nACCEPT     tcp  --  10[.]20[.]5[.]0/24      0[.]0[.]0[.]0/0","parts":[{"re":{"source":"\\biptables\\b","flags":""},"label":"uses the iptables command"},{"re":{"source":"(^|\\s)-[a-zA-Z]*L[a-zA-Z]*(\\s|$)|--list\\b","flags":""},"label":"lists the rule set (-L)"},{"re":{"source":"(^|\\s)-[a-zA-Z]*n[a-zA-Z]*(\\s|$)|--numeric\\b","flags":""},"label":"prints numeric addresses (-n)"}],"solution":"iptables -L -n","why":"You cannot trust a control you have not verified. A reboot can load an old rule set, and a numeric listing shows exactly which ports are open without waiting for DNS lookups. This is the operational check that proves the preventive technical control, the host firewall, is still working.","kw":["firewall","access control list (ACL)","preventive control","technical (logical) control","operational control"]},{"id":"M18","type":"order","theme":"Reading firewall events","points":10,"scenario":"At Northwind Health the edge firewall logs every deny. You are building the incident timeline for a ticket about a file share on 10.40[.]9[.]15.","art":{"kind":"log","title":"edge firewall deny and allow log (mixed order)","lines":["02:03:39 ALLOW SRC=10[.]40[.]9[.]15 DST=10[.]40[.]2[.]8 DPT=53 PROTO=UDP","02:03:41 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]9[.]15 DPT=445 PROTO=TCP","02:03:44 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]9[.]15 DPT=139 PROTO=TCP","02:03:52 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]12[.]30 DPT=445 PROTO=TCP","02:04:05 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]12[.]30 DPT=3389 PROTO=TCP"]},"question":"Put the five events in the order in which they happened, earliest first.","items":["02:03:39 ALLOW SRC=10[.]40[.]9[.]15 DST=10[.]40[.]2[.]8 DPT=53 PROTO=UDP","02:03:41 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]9[.]15 DPT=445 PROTO=TCP","02:03:44 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]9[.]15 DPT=139 PROTO=TCP","02:03:52 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]12[.]30 DPT=445 PROTO=TCP","02:04:05 DENY SRC=198[.]51[.]100[.]23 DST=10[.]40[.]12[.]30 DPT=3389 PROTO=TCP"],"why":"One source address sweeps file sharing, then remote desktop, across two hosts. That is a scan, not normal traffic. The firewall is a preventive control that also produces evidence, because it logs the deny. The correct next step is to block the source range and open an incident, since the same address may already have found an open port elsewhere.","hint":"Sort by the timestamp only. Do not let the port numbers distract you.","kw":["firewall","log review","detective control","preventive control","technical (logical) control","IDS / IPS"]},{"id":"M19","type":"branch","theme":"Phishing response","points":10,"scenario":"A finance user at Greyline Media typed company credentials into a look-alike page at hxxp://portal-greyline[.]secure-login[.]example and reported it twenty minutes later. The attacker also created a mail rule that forwards messages to an outside address.","question":"Work through the response. Each step records the choice you click.","hint":"First kill the attacker's access, then clean the host, then close the path they used to get in.","steps":[{"sit":"Step 1 - the account is still live and the mail rule is still active. What do you do first?","opts":["Reset the password, revoke active sessions, delete the mail rule and check for other mailbox changes","Ask the user to change the password on the next password day","Delete the mailbox and recreate it","Block the whole finance subnet from the internet"],"correct":0,"res":["Correct. New credentials plus session revocation kills the attacker's access, and the rule is removed.","The attacker keeps working for days with a valid session.","Mail and history are lost, and the attacker may still hold a token.","You would stop the business without removing the attacker's access."]},{"sit":"Step 2 - the user also opened the downloaded file on a company laptop.","opts":["Isolate the host with EDR, collect evidence, then reimage it","Run a quick virus scan and hand the laptop back","Leave it online so you can watch the attacker","Clear the browser cache and close the ticket"],"correct":0,"res":["Correct. Isolation stops spread, and a reimage from a known good image removes anything hidden.","A scan can miss a fileless or dormant implant.","Watching an attacker on a business endpoint is a risk with no written plan behind it.","Nothing about the host is actually fixed."]},{"sit":"Step 3 - which control stops the same trick working again?","opts":["Block automatic forwarding to external addresses at the mail gateway","Add a second antivirus product to every laptop","Disable the user's mailbox permanently","Turn off the spam filter so users see everything"],"correct":0,"res":["Correct. The external forwarding rule was the quiet part of the attack. Blocking it removes the channel.","Two scanners on one host cause conflicts and add little.","The user still needs mail. This punishes the person, not the flaw.","Removing a filter raises the number of phishing mails that reach users."]}],"why":"Phishing response is a chain of preventive, detective and corrective actions. Revoke access first so the attacker cannot keep working, then clean the endpoint, then close the channel that turned a stolen password into a data leak. Training and MFA are the preventive controls that stop the next attempt, and mandatory reporting is what made this case fast.","kw":["incident response plan","MFA","EDR","corrective control","preventive control","security awareness training"]},{"id":"M20","type":"spot","theme":"Onboarding controls","points":10,"scenario":"Greyline Media rewrote its onboarding checklist after a failed audit. You review draft version 3 before it is published.","art":{"kind":"code","title":"Onboarding checklist (draft v3)","pick":true,"lines":["1. HR creates the employee record and starts the background check.","2. IT creates ONE shared admin account that all new starters in the team will use.","3. The new starter signs the acceptable use policy and the NDA.","4. The manager sets the job role in the HR system, and access follows the role.","5. All new starters keep the default password for the first 30 days.","6. The new starter finishes security awareness training in week one."]},"question":"Click the two lines that break good security control practice.","bad":[1,4],"whyEach":["A background check before access is granted is normal due diligence.","One shared admin account means no accountability: logs cannot show who did what, and least privilege is impossible.","Signed policies are direct evidence of a directive managerial control.","Role-based access is the correct way to grant rights, and it supports access reviews later.","Default passwords are published in manuals and reused across sites. Every account must get a unique secret and MFA.","Awareness training in week one is the right time, before the person handles real work."],"hint":"Two lines make it impossible to tell who did what, or leave a credential that many people could guess.","why":"Onboarding is where least privilege is either built or broken. Individual accounts, role-based rights, unique credentials and training in the first week are the controls that hold for the whole employment. One shared admin account destroys accountability, and a default password left in place for a month is an open invitation.","kw":["onboarding / offboarding","RBAC / least privilege","background check","acceptable use policy (AUP)","non-disclosure agreement (NDA)","security awareness training","access review","managerial (administrative) control","MFA","security policy"]},{"id":"M21","type":"match","theme":"Physical controls","points":10,"scenario":"You are writing the physical security section of a data-centre design document for Vantage Tower.","question":"Match each physical control with what it does.","pairs":[["Mantrap","Stops tailgating with two interlocked doors"],["Bollard","Stops a vehicle from reaching the building"],["CCTV","Records activity for later review"],["Fence and gate","Delays an intruder at the site boundary"],["Security lighting","Removes places where an intruder can hide"],["Badge reader","Checks identity before a door opens"]],"why":"Physical controls are still controls: each one prevents, detects or deters. A fence delays, a bollard blocks a vehicle, lighting removes cover, a badge reader authenticates, a mantrap defeats tailgating, and CCTV records evidence. No single item is enough. The design works only when the items cover each other's weak points.","hint":"Two of these are about vehicles and the perimeter. Two are about the door itself. One is about light, one about evidence.","kw":["mantrap","bollard","CCTV","fence","security lighting","badge reader","physical control","preventive control","detective control"]},{"id":"M22","type":"fill","theme":"Physical security audit finding","points":10,"scenario":"You are writing the executive summary of a penetration test at Bayview Clinic. The tester walked in behind an employee and spent forty minutes in the server room.","question":"Fill the three gaps so the finding reads correctly.","parts":["The tester followed an employee through the staff door. The badge reader is a technical ",{"b":0}," control, but nobody reviewed the door logs, so the ",{"b":1}," part of the control chain was missing. Staff were never trained to challenge strangers, so the ",{"b":2}," control was weak as well."],"answers":["preventive","detective","security awareness training"],"extras":["compensating","directive","physical"],"hint":"One gap is about stopping entry, one about noticing it afterwards, and one is a training programme.","why":"A badge reader only prevents entry for the person who uses it. Tailgating walks around it. The design therefore needs a detective layer, such as door log review or a guard. It also needs a human layer: training that tells staff to challenge strangers. The finding is not that the badge reader failed. The finding is that two other controls were missing.","kw":["badge reader","log review","detective control","preventive control","security awareness training","security guard","physical control","control gap"]},{"id":"M23","type":"order","theme":"Control assessment lifecycle","points":10,"scenario":"Beacon Insurance must show its regulator that the controls it claims are real. Your team runs the assessment from scratch.","question":"Order the six assessment steps from first to last.","items":["Scope the assessment and list the systems and controls in scope","Collect evidence such as configuration files, logs and screenshots","Test each control against the framework requirement","Write findings that state the control gap and the risk","Agree remediation owners and dates in the POA&M","Monitor the fix and retest after the change"],"why":"An assessment that skips scoping tests the wrong things. Evidence must be collected before testing, or the tester only has opinions. Findings must be written as a gap plus a risk so the reader can rank them. Owners and dates turn a finding into work, and retesting after the change is what proves the fix. Monitoring then continues, because controls drift.","hint":"Nothing can be tested before you know what is in scope, and nothing is proven until you check again after the fix.","kw":["security audit","control gap","plan of action and milestones (POA&M)","continuous monitoring","due care / due diligence","risk assessment","control baseline"]},{"id":"M24","type":"mcq","theme":"Compensating controls","points":10,"scenario":"An old card payment terminal at Bayview Clinic cannot support MFA, and the vendor will not update it for another year. The terminal must keep working.","question":"Which action is a compensating control for the missing MFA?","opts":["Isolate the terminal on its own network segment that one known server can reach","Add a second antivirus product to the terminal and scan it twice every day","Remove the firewall rule that blocks the terminal so it can reach the internet","Ask the vendor for a letter that states the missing MFA is an accepted risk"],"correct":[0],"whyEach":{"0":"Isolation reduces who can reach the terminal, which lowers the risk that MFA would have lowered.","1":"A second scanner on a locked-down terminal adds little and does not replace MFA.","2":"Removing a control makes the risk worse, which is the opposite of compensating.","3":"A letter is not a control. It only documents the problem."},"hint":"A compensating control must reduce the same risk that the missing control was meant to reduce.","why":"Compensating means you use a different control because the first one is not possible. It must lower the same risk without weakening anything else, and it must be documented with an end date. The segment isolation does that: fewer paths in, one known peer, and monitoring on the segment.","kw":["compensating control","MFA","VLAN segmentation","antivirus","firewall","residual risk","plan of action and milestones (POA&M)"]},{"id":"M25","type":"classify","theme":"Cloud control types","points":10,"scenario":"Northwind Health moved a patient portal into a cloud tenant. During the design review you label each cloud action with its control type.","question":"Place each action under preventive, detective or corrective.","buckets":["Preventive","Detective","Corrective"],"items":["Block public access on the object storage bucket","Posture finding that flags an open security group","Restore a snapshot after a bad configuration change","Review the cloud audit trail for unusual role use","Deny policy on delete actions for the data store","Roll back a broken deployment to the previous version"],"answer":[0,1,2,1,0,2],"whyEach":["The bucket setting stops exposure before it can happen.","A posture finding reports a weakness. It does not fix it, so it detects.","A snapshot restore puts the service back. That corrects.","Reviewing the audit trail is a detective activity that needs a human or a rule.","A deny policy blocks the action outright, so it prevents.","A rollback returns to a good state, so it corrects."],"hint":"Ask whether the action stops something, tells you about it, or puts things back afterwards.","why":"The same three verbs work in the cloud. Preventive controls shape what is possible (bucket policy, deny policy). Detective controls tell you what happened (posture findings, audit trail review). Corrective controls put you back (snapshot restore, rollback). A design that only prevents has no evidence, and a design that only detects learns about the damage too late.","kw":["preventive control","detective control","corrective control","continuous monitoring","backup and restore","change management","technical (logical) control"]},{"id":"M26","type":"calc","theme":"Detective control metrics","points":10,"scenario":"Your SOC at Northwind Health recorded five confirmed incidents last week. The time between the first malicious event and the moment the team detected it was 4, 6, 8, 10 and 12 minutes.","question":"Type the mean time to detect (MTTD) in minutes for that week.","answerNum":8,"tol":0.1,"unit":"minutes","hint":"Add the five numbers and divide by five.","why":"MTTD is the average time from the event to detection. It measures detective controls: log collection, alert rules and analyst attention. MTTR is the average time to repair, which measures corrective controls. A falling MTTD means detection is improving; it says nothing about how fast you recover, so the two numbers must be tracked separately.","kw":["MTTD / MTTR","detective control","corrective control","SIEM","log review","continuous monitoring"]},{"id":"M27","type":"fill","theme":"File integrity monitoring","points":10,"scenario":"You are the analyst on shift at Northwind Health. A file integrity alert fires on the HR file server. You read the alert and the lines around it.","art":{"kind":"log","title":"Correlated host events (hr-fs01)","lines":["FIM BASELINE 02:00:00 host=hr-fs01 files=18422 status=OK","AUTH 02:13:55 host=hr-fs01 user=svc_backup result=SUCCESS src=10[.]30[.]7[.]55","FIM ALERT 02:14:07 host=hr-fs01 path=/etc/passwd action=MODIFIED user=svc_backup","FIM ALERT 02:14:09 host=hr-fs01 path=/etc/shadow action=MODIFIED user=svc_backup","EDR 02:15:02 host=hr-fs01 process=useradd parent=bash user=svc_backup","FIM ALERT 02:41:00 host=hr-fs01 path=/srv/hr/payroll action=MODIFIED user=svc_backup"]},"question":"Fill the two gaps in your ticket note.","parts":["The alert comes from a ",{"b":0}," control. Because a backup service account ran useradd and changed the password files, the most likely explanation is ",{"b":1},"."],"answers":["file integrity monitoring (FIM)","privilege escalation"],"extras":["antivirus","preventive","data loss","hardware failure"],"hint":"The baseline line and the ALERT lines came from the same tool. The second gap is about what an attacker does to keep access.","why":"FIM compares files with a stored baseline and alerts on any change, so it is a detective control. Here the changes come from a service account that should only copy backups. Creating a user and editing the password files is the classic way to keep access after the first break-in, which is privilege escalation. The right next step is to disable the account and start an incident.","kw":["file integrity monitoring (FIM)","detective control","control baseline","RBAC / least privilege","operational control","incident response plan"]},{"id":"M28","type":"dual","theme":"Firewall rule: both sides","points":10,"scenario":"A change request at Beacon Insurance asks for the rule permit tcp any any eq 445 on the internet edge firewall. You review it twice.","question":"Review the request from both sides: answer the firewall owner first, then the attacker.","hint":"Blue side: which service does port 445 expose? Red side: how does an attacker find an exposed service?","q1":{"q":"Blue team: what is the main risk of this rule?","opts":["Ransomware on the internet can reach the file sharing service directly","The rule will use too much CPU on the firewall","The log file will grow faster than usual","Users will lose access to their home drives"],"correct":[0]},"q2":{"q":"Red team: given this rule, what is your most efficient next move?","opts":["Scan the address range for hosts answering on port 445 and try a known exploit","Send phishing mail to the finance team","Buy a look-alike domain name","Attack the badge reader at the front door"],"correct":[0]},"why":"Port 445 is the file sharing service that most ransomware worms use. Opening it to the internet turns a preventive control into the attack path. The blue side must block the rule and ask for a business reason. The red side would simply scan for it, because exposed SMB is one of the cheapest ways in. Both views point at the same fix: never expose a service that does not need internet access.","kw":["firewall","access control list (ACL)","preventive control","risk assessment","vulnerability scanner","RBAC / least privilege"]},{"id":"M29","type":"fill","theme":"After-action report","points":10,"scenario":"You write the after-action report for a ransomware incident at Greyline Media. The EDR alerted in four minutes, and the nightly backup saved the file share. The order of recovery was already agreed, because the business continuity plan was tested in a tabletop exercise last quarter.","question":"Fill the three gaps with the control type that fits each sentence.","parts":["The ",{"b":0}," control (EDR) raised the alert in four minutes, so MTTD was good. The ",{"b":1}," control (restore from the nightly backup) brought the file share back in two hours. We added MFA, a ",{"b":2}," control, to close the same access path next time."],"answers":["detective","corrective","preventive"],"extras":["deterrent","compensating","directive"],"hint":"One raised the alarm, one put the data back, one will stop the next attempt.","why":"A good report names each control by what it did. EDR detected, the backup restored, and MFA prevents a repeat. The type matters because the reader decides what to fund next. If detection was slow, buy monitoring. If recovery was slow, fix the backups. If the way in was open, close it.","kw":["detective control","corrective control","preventive control","EDR","backup and restore","MFA","MTTD / MTTR","incident response plan","business continuity plan (BCP) / DRP","tabletop exercise"]},{"id":"M30","type":"mcq","theme":"Classifying a physical control","points":10,"scenario":"A small warehouse at Falcon Logistics keeps a trained guard dog in the yard at night and also pays a security firm for two patrol visits.","question":"How should the guard dog be recorded in the control register?","opts":["As a deterrent and physical control","As a preventive technical control","As a detective managerial control","As a corrective operational control"],"correct":[0],"whyEach":{"0":"The dog discourages an intruder and it is a physical presence on the site, so both labels fit.","1":"It is not technology, and it cannot be relied on to stop every intruder.","2":"A dog is not a management process, and it is a weak detector compared with CCTV.","3":"It does not repair anything, and it is not a written process."},"hint":"A control can carry two labels: one for how it is delivered, one for what it does.","why":"CompTIA lets a control hold two labels, because category and type answer different questions. A barking dog deters and it is physical. Relying on the dog alone would be poor practice: it sleeps, it can be drugged, and it cannot report. The patrol contract adds an operational detective layer, and CCTV would add evidence.","kw":["deterrent control","physical control","security guard","CCTV","detective control","operational control"]},{"id":"M31","type":"classify","theme":"Physical control layout","points":10,"scenario":"You are helping the facilities team at Vantage Tower lay out the physical controls for the new building, from the street to the server room.","question":"Place each physical control at the point in the building where it is normally installed.","buckets":["Site boundary","Building entry","Inside the room"],"items":["Fence and locked gate around the yard","Security lighting across the car park","Turnstile in the ground floor lobby","Badge reader on the staff door","Mantrap outside the data-centre door","Shredder beside every printer","Privacy filter on laptop screens","Protected cabling in sealed conduit","Tamper-evident seal on each rack","Fire suppression and HVAC in the server room","UPS and generator for the server racks"],"answer":[0,0,1,1,1,2,2,2,2,2,2],"whyEach":["A fence marks and delays at the site boundary.","Lighting belongs where people and vehicles move after dark: the boundary and the car park.","A turnstile controls the flow of people at the lobby before they reach the lifts.","A badge reader authenticates a person at the door they want to open.","A mantrap sits at the last door before the most valuable room, so two people cannot pass on one badge.","A shredder sits where paper is produced, not at the boundary.","A privacy filter is a desk-level control against shoulder surfing.","Sealed conduit protects cabling inside the building where a visitor could reach it.","A tamper-evident seal shows whether a rack was opened between maintenance visits.","Fire suppression and cooling protect the equipment inside the room.","A UPS and generator keep power on inside the room during an outage."],"hint":"Work outwards from the street, then the lobby, then the desk and the rack.","why":"Physical controls are laid out in layers, just like network controls. The boundary delays, the entry authenticates, and the room controls keep the equipment alive and unopened. Each layer assumes the previous one can be passed, which is why the server room needs both a mantrap and a sealed rack.","kw":["physical control","fence","security lighting","turnstile","badge reader","mantrap","shredder","privacy filter","protected cabling / conduit","tamper-evident seal","fire suppression","environmental control (HVAC)","UPS / generator","defense in depth"]}];

  /* A shuffled order that happens to be partly correct would hand out free

  function cur() { return Q[S.order[S.idx]]; }

    return S.bank[ex.id];

  function rightPool(ex) {

  /* Branching steps and dual-perspective groups also get shuffled options, so the

  function branchOrder(ex, i) {

  function typeLabel(ex) {

  /* ---------------- syntax highlighting for logs ---------------- */

        return '<div class="orderrow" data-pos="' + pos + '" data-i="' + ii + '"><span class="pos">' + (pos + 1) + '</span><span class="grab" draggable="true" aria-hidden="true">::</span><span class="tx">' + ex.items[ii] + '</span><span class="spacer"></span><button type="button" class="btn" data-mv="up" data-pos="' + pos + '" aria-label="Move row ' + (pos + 1) + ' up">Move up</button><button type="button" class="btn" data-mv="down" data-pos="' + pos + '" aria-label="Move row ' + (pos + 1) + ' down">Move down</button></div>';

        }).join("") + "</select></div>";

    }
    if (ex.type === "fill") {
      var bank2 = bankFor(ex), fsel = a.sel || [], out = '<div class="filltext">';
      ex.parts.forEach(function (p) {

    if (ex.type === "terminal") {
      var term = '<div class="term"><span class="pr">analyst@host:~$</span><input type="text" id="cmd" spellcheck="false" autocomplete="off" aria-label="command" value="' + esc(a.cmd || "") + '"></div>';

    }

        dualOrder(ex, key, g).forEach(function (oi) {
          out2 += '<label class="opt" data-g="' + letter + '" data-o="' + oi + '"><input type="radio" name="d' + ex.id + key + '" value="' + oi + '"' + (String(val) === String(oi) ? " checked" : "") + '><span class="tx">' + g.opts[oi] + "</span></label>";
        });

    }

  /* ---------------- grading (with optional DOM marking) ---------------- */
  function tagNode(el, st) {
    if (!el) { return; }
    el.classList.add(st === "miss" ? "miss" : st);
    var v = document.createElement("span");
    v.className = "verdict " + (st === "miss" ? "miss" : st);
    v.textContent = st === "ok" ? "correct" : (st === "bad" ? "wrong" : "missed correct");
    el.appendChild(v);
  }
  function noteOf(ex, key) { return (ex.whyEach && ex.whyEach[key]) ? ex.whyEach[key] : ""; }

  function gradeMcq(ex, a, root) {
    var sel = (a && a.sel) ? a.sel : [];
    var correct = ex.correct;
    var hit = correct.filter(function (i) { return sel.indexOf(i) >= 0; }).length;
    var earned = ex.points * hit / correct.length;
    var notes = [], stText = [], cText = [];
    disp(ex).forEach(function (oi) {
      var node = root ? root.querySelector('.opt[data-i="' + oi + '"]') : null;
      var isC = correct.indexOf(oi) >= 0, isS = sel.indexOf(oi) >= 0, st = "";
      if (isS && isC) { st = "ok"; } else if (isS && !isC) { st = "bad"; } else if (isC) { st = "miss"; }
      if (st) { tagNode(node, st); notes.push((st === "ok" ? "Correct: " : (st === "bad" ? "Wrong: " : "Missed: ")) + noteOf(ex, oi)); }
      if (isS) { stText.push(ex.opts[oi]); }
      if (isC) { cText.push(ex.opts[oi]); }
    });
    return {
      earned: earned, max: ex.points, notes: notes,
      student: stText.length ? stText.join(" | ") : "(nothing selected)",
      correct: cText.join(" | "),
      hit: hit, total: correct.length
    };
  }

  function gradeClassify(ex, a, root) {
    var place = (a && a.place) || {};
    var hit = 0, notes = [], stText = [], cText = [];
    ex.items.forEach(function (t, i) {
      var want = ex.answer[i], got = place[i];
      var node = root ? root.querySelector('.chip[data-i="' + i + '"]') : null;
      var st = "";
      if (got === want) { st = "ok"; hit++; } else if (got !== undefined) { st = "bad"; } else { st = "miss"; }
      tagNode(node, st);
      var line = t + " -> " + (got === undefined ? "not placed" : ex.buckets[got]) + " (correct: " + ex.buckets[want] + "). " + noteOf(ex, i);
      notes.push((st === "ok" ? "Correct: " : (st === "bad" ? "Wrong: " : "Missed: ")) + line);
      stText.push(t + " -> " + (got === undefined ? "not placed" : ex.buckets[got]));
      cText.push(t + " -> " + ex.buckets[want]);
    });
    return { earned: ex.points * hit / ex.items.length, max: ex.points, notes: notes, student: stText.join(" ; "), correct: cText.join(" ; "), hit: hit, total: ex.items.length };
  }

  function gradeOrder(ex, a, root) {
    var ord = (a && a.ord) ? a.ord : disp(ex);
    var hit = 0, notes = [], stText = [], cText = [];
    for (var p = 0; p < ex.items.length; p++) {
      var ii = ord[p], ok = ii === p;

      cText.push((p + 1) + ". " + ex.items[p]);

  }

  function gradeMatch(ex, a, root) {
    var sel = (a && a.sel) || [], hit = 0, notes = [], stText = [], cText = [];
    ex.pairs.forEach(function (p, li) {

  }

  function gradeFill(ex, a, root) {

  /* A terminal part may carry its pattern as a string (the form that survives

  var NEVER = /$^/;
  function rxOf(re) {

    }
    return NEVER;
  }

  function gradeTerminal(ex, a) {

    return { earned: ex.points * hit / ex.parts.length, max: ex.points, notes: notes, student: cmd || "(no command typed)", correct: ex.solution, hit: hit, total: ex.parts.length };
  }

  function gradeBranch(ex, a, root) {
    var picks = (a && a.picks) || [], hit = 0, notes = [], stText = [], cText = [];
    ex.steps.forEach(function (st, i) {
      var got = picks[i], ok = got === st.correct;

      notes.push((ok ? "Step " + (i + 1) + " correct. " : "Step " + (i + 1) + " wrong. ") + "You chose: " + gotTxt + (ok ? "" : " (best: " + st.opts[st.correct] + ")"));

  }

  function gradeDual(ex, a, root) {
    var hit = 0, notes = [], stText = [], cText = [];
    [["Blue team", ex.q1, a ? a.a : undefined], ["Red team", ex.q2, a ? a.b : undefined]].forEach(function (row) {
      var label = row[0], g = row[1], got = row[2];

      cText.push(label + ": " + g.opts[g.correct[0]]);

  function gradeCalc(ex, a) {

    var ok = !isNaN(v) && Math.abs(v - ex.answerNum) <= (ex.tol || 0);
    return {

      student: isNaN(v) ? "(no value)" : String(v) + " " + (ex.unit || ""), correct: String(ex.answerNum) + " " + (ex.unit || ""), hit: ok ? 1 : 0, total: 1
    };
  }

  function gradeSpot(ex, a, root) {

  function gradeOf(ex, root) {

      case "order": r = gradeOrder(ex, a, root); break;
      case "match": r = gradeMatch(ex, a, root); break;

  }

  /* ---------------- scoring ---------------- */
  function counted() { return S.order.filter(function (i) { return !S.skip[Q[i].id]; }); }
  function maxPoints() { return counted().reduce(function (t, i) { return t + Q[i].points; }, 0); }
  function earnedPoints() {
    return counted().reduce(function (t, i) {
      var ex = Q[i];
      if (!S.checked[ex.id]) { return t; }
      return t + gradeOf(ex).earned;
    }, 0);
  }
  function labelFor(ex) {
    if (S.skip[ex.id]) { return "skipped"; }
    if (!S.checked[ex.id]) { return "zero"; }
    var g = gradeOf(ex);
    if (g.earned >= g.max - 0.01) { return "full"; }
    if (g.earned > 0) { return "partial"; }
    return "zero";
  }

  /* ---------------- header and navigation ---------------- */
  function clockText() {
    var t = Math.max(0, S.timeLeft);
    var h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
    function two(n) { return (n < 10 ? "0" : "") + n; }
    return h > 0 ? h + ":" + two(m) + ":" + two(s) : two(m) + ":" + two(s);
  }
  function pauseLine() {
    if (!S.manualPause && !S.checkPause) { return ""; }
    var h = '<div class="pauseline" role="status" aria-live="polite">';
    if (S.manualPause) { h += '<span class="pe">Paused (manual)</span>'; }
    if (S.checkPause) { h += '<span class="pe amber">Timer paused - review mode (press Next to continue)</span>'; }
    return h + "</div>";
  }
  function headerHTML() {
    return '<div class="hdr"><div class="hdrin">' +
      '<span class="t">' + esc(META.title || "Practice exam") + "</span>" +
      '<span class="pill time" id="clock" aria-live="off">Time ' + clockText() + "</span>" +
      '<span class="pill" id="score">Score 0 / 0</span>' +
      '<button type="button" class="btn" id="pauseBtn">' + (S.manualPause ? "Resume" : "Pause") + "</button>" +
      '<button type="button" class="btn primary" id="submitBtn">Finish exam</button>' +
      "</div>" +
      '<div style="padding:0 14px 8px"><div class="pbar" role="progressbar" aria-label="progress"><i id="pbar" style="width:0%"></i></div></div>' + pauseLine() +
      "</div>";
  }
  function navHTML() {
    var h = '<div class="card"><h2 style="margin-bottom:10px">Question navigator</h2><div class="nav">';
    S.order.forEach(function (qi, n) {
      var ex = Q[qi], cls = "", sym = "", word = "not answered";
      if (S.skip[ex.id]) { cls = "skip"; sym = "\u00bb"; word = "skipped"; }
      else if (S.checked[ex.id]) {
        var l = labelFor(ex);
        cls = l === "full" ? "ok" : (l === "partial" ? "mid" : "bad");
        sym = l === "full" ? "\u2713" : (l === "partial" ? "~" : "\u2717");
        word = l === "full" ? "full marks" : (l === "partial" ? "partial marks" : "wrong");
      } else if (S.touch[ex.id]) { cls = "answered"; sym = "\u25cb"; word = "answered, not checked"; }
      if (n === S.idx) { cls += " cur"; word += ", current question"; }

    });
    h += '</div><div class="legend"><span><b>\u2713</b> full marks</span><span><b>~</b> partial marks</span><span><b>\u2717</b> wrong</span><span><b>\u25cb</b> answered, not checked</span><span><b>\u00bb</b> skipped, excluded from scoring</span></div></div>';
    return h;
  }
  function handledCount() {
    return S.order.filter(function (i) { return S.checked[Q[i].id] || S.skip[Q[i].id]; }).length;
  }
  /* ---------------- keyword themes ---------------- */
  var KWG = null;
  function kwIndex() {
    if (!KWG) {
      KWG = {};
      KW.forEach(function (g, gi) { g.items.forEach(function (k) { KWG[k] = gi; }); });
    }
    return KWG;
  }
  function themeProgressHTML() {
    var idx = kwIndex();
    var map = KW.map(function (g) { return { label: g.theme, done: 0, n: 0, earned: 0, max: 0, skipped: 0 }; });
    S.order.forEach(function (qi) {
      var ex = Q[qi], groups = {};
      (ex.kw || []).forEach(function (k) { var gi = idx[k]; if (gi !== undefined) { groups[gi] = true; } });
      Object.keys(groups).forEach(function (gi) {
        var m = map[Number(gi)];
        if (!m) { return; }
        m.n++;
        if (S.skip[ex.id]) { m.skipped++; return; }

      });
    });
    var h = '<div class="card"><h2 style="margin-bottom:10px">Progress by theme</h2><p class="small mut">Progress for each keyword theme of this chapter. One exercise can teach keywords from more than one theme, so the points in this panel overlap; your final score is not the sum of these rows. Skipped exercises leave both the handled count and the possible points of a theme.</p><div class="themegrid">';
    map.forEach(function (m) {
      var pct = m.max > 0 ? Math.round((m.earned / m.max) * 100) : 0;
      h += '<div class="themebox"><div class="themerow"><span>' + esc(m.label) + '</span><span class="small mut">' + (m.done + m.skipped) + " / " + m.n + ' handled</span></div>' +
        '<div class="pbar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="small mut">' + fx(m.earned) + " / " + fx(m.max) + " points" + (m.skipped ? ", " + m.skipped + " skipped" : "") + "</div></div>";
    });
    return h + "</div></div>";
  }
  function updateHeader() {
    var c = $("#clock"); if (c) { c.textContent = "Time " + clockText(); }
    var sc = $("#score");
    if (sc) { var mx = maxPoints(); var er = earnedPoints(); sc.textContent = "Score " + fx(er) + " / " + fx(mx) + (mx > 0 ? " (" + Math.round(er / mx * 100) + "%)" : ""); }
    var pb = $("#pbar");
    if (pb) { pb.style.width = Math.round((handledCount() / S.order.length) * 100) + "%"; }

  }

  /* ---------------- answer area binding ---------------- */
  function bindAnswerArea(ex) {
    var area = $("#ansArea");
    if (!area) { return; }
    var locked = !!S.checked[ex.id];
    function store(fn) { var a = ensureAns(ex); S.touch[ex.id] = true; fn(a); }
    if (ex.type === "mcq") {
      $$("input", area).forEach(function (inp) {
        inp.disabled = locked;
        inp.addEventListener("change", function () {
          store(function (a) {
            var v = Number(inp.value);

            } else { a.sel = [v]; }

        });
      });

          if (selChip.id === ex.id && selChip.i === i) { selChip = { id: null, i: null }; }

            selChip = { id: ex.id, i: i };

            c.setAttribute("aria-pressed", "true");
