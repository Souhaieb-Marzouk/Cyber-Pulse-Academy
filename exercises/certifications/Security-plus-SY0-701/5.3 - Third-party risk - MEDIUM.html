<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../../assets/img/logo.png" type="image/png">
<title>5.3 - Third-party risk</title>
<script type="application/json" id="cm-exercise-meta">{"topicId": "security-plus", "chapter": 5.3, "title": "5.3 - Third-party risk", "difficulty": "medium", "questionCount": 30, "estimatedMinutes": 65, "passMark": 70}</script>
<style>
:root{
  --bg:#0b0f14;--panel:#10161e;--card:#141b25;--card2:#182231;--line:#26303e;--line2:#33445a;
  --tx:#e8eef5;--dim:#a7b7c7;--mut:#7d8fa1;
  --acc:#4da3ff;--acc2:#1f6feb;--ok:#4ade80;--okd:#173d29;--bad:#f87171;--badd:#42212a;--amb:#fbbf24;--ambd:#3d3115;--cy:#67e8f9;--pur:#c4b5fd;
  --mono:ui-monospace,'Cascadia Mono',Consolas,'Liberation Mono',monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15.5px/1.55 'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:12px 16px 60px}
h1,h2,h3{line-height:1.25}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0d131b 0%,#0d131bee 100%);border-bottom:1px solid var(--line);padding:10px 0 8px;margin-bottom:14px}
.hd .wrap{padding:0 16px}
.hdrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.hd h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.hd h1 .sev{color:var(--cy);font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--dim);min-height:26px}
.chip b{color:var(--tx);font-variant-numeric:tabular-nums}
.chip.time b{font-size:14.5px}
.chip.time.low b{color:var(--bad)}
.chip.cand{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:#0a0e13;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px;transition:width .45s ease}
.indics{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:0}
.indic{display:none;align-items:center;gap:6px;border-radius:7px;padding:4px 10px;font-size:13px;font-weight:600;border:1px solid}
.indic.on{display:inline-flex}
.indic.man{background:var(--ambd);border-color:#6b5417;color:var(--amb)}
.indic.chk{background:#12253d;border-color:#274a75;color:var(--acc)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 18px;border-radius:9px;border:1px solid var(--line2);background:var(--card2);color:var(--tx);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#20304a;border-color:var(--acc)}
.btn.pri{background:var(--acc2);border-color:#3b82f6;color:#fff}
.btn.pri:hover{background:#2b7bff}
.btn.ok{background:#1f7a44;border-color:#2ea365;color:#eafff3}
.btn.warn{background:#2a2410;border-color:#6b5417;color:var(--amb)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:4px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}

/* ---------- screens ---------- */
.scr{display:none}
.scr.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:20px}
.panel h3{margin:18px 0 8px;font-size:16px;color:var(--cy)}
.panel p,.panel li{color:var(--dim)}
.panel ul{margin:6px 0;padding-left:22px}
.panel li{margin:4px 0}
.kpanel{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);margin:10px 0;overflow:hidden}
.kpanel>summary{cursor:pointer;padding:12px 16px;font-weight:650;color:var(--cy);list-style:none;min-height:44px;display:flex;align-items:center;gap:8px}
.kpanel>summary::before{content:'▸';transition:transform .15s}
.kpanel[open]>summary::before{transform:rotate(90deg)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;padding:2px 16px 16px}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kcol h4{margin:0 0 6px;font-size:13.5px;color:var(--pur);text-transform:uppercase;letter-spacing:.6px}
.kcol .kws{display:flex;flex-wrap:wrap;gap:5px}
.kw{background:#0d1420;border:1px solid var(--line2);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--dim)}
.infoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin:12px 0}
.infoBox{background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:8px;padding:10px 14px}
.infoBox b{color:var(--tx)}
.infoBox p{margin:4px 0 0;font-size:14px}
.startRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
.metaLine{font-size:14px;color:var(--mut)}

/* ---------- exam layout ---------- */
.card{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:18px;position:relative}
.card.dimmed .qbody{filter:blur(9px);pointer-events:none;user-select:none}
.card.dimmed .pauseOv{display:flex}
.pauseOv{display:none;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;background:#0b0f14cc;border-radius:12px}
.pauseOv>div{text-align:center;background:var(--panel);border:1px solid var(--amb);border-radius:12px;padding:22px 30px;max-width:420px}
.pauseOv .big{font-size:17px;font-weight:700;color:var(--amb)}
.pauseOv .sm{color:var(--dim);font-size:14px;margin-top:4px}
.qtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.qnum{font-weight:700;font-size:15px;color:var(--cy)}
.tag{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:6px;padding:3px 9px;border:1px solid}
.tag.theme{color:var(--pur);border-color:#4c3d80;background:#1c1730}
.tag.type{color:var(--cy);border-color:#1e5a6b;background:#0f2730}
.tag.pts{color:var(--dim);border-color:var(--line2);background:var(--panel)}
.blk{border-radius:10px;padding:12px 14px;margin:10px 0;border:1px solid}
.blk .lab{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.blk p{margin:0;white-space:pre-line}
.blk.scen{background:#0f1b2b;border-color:#1f3a5f}
.blk.scen .lab{color:var(--acc)}
.blk.qblk{background:#101d22;border-color:#1e4b57}
.blk.qblk .lab{color:var(--cy)}
.ansZone{margin-top:14px}
.ansLab{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--amb);margin-bottom:8px}

/* choices */
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:11px 13px;margin:7px 0;cursor:pointer;min-height:44px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--acc)}
.opt input{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--acc2);cursor:pointer}
.opt .ot{flex:1}
.opt.sel{border-color:var(--acc);background:#13233a}
.opt.m-ok{border-color:var(--ok);background:var(--okd)}
.opt.m-bad{border-color:var(--bad);background:var(--badd)}
.opt.m-miss{border-color:var(--amb);background:var(--ambd)}
.opt .mk{font-weight:800;font-size:13px;flex:none;min-width:20px;text-align:center}
.opt.m-ok .mk{color:var(--ok)}.opt.m-bad .mk{color:var(--bad)}.opt.m-miss .mk{color:var(--amb)}
.opt.lock{cursor:default;opacity:.92}

/* match / slots */
.dz{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
@media(max-width:720px){.dz{grid-template-columns:1fr}}
.pool,.slotList{display:flex;flex-direction:column;gap:7px;min-height:40px}
.poolTitle,.slotTitle{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.item{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;cursor:grab;min-height:44px;display:flex;align-items:center;gap:8px;font-size:14.5px}
.item:active{cursor:grabbing}
.item.dragging{opacity:.45}
.item.picked{border-color:var(--amb);box-shadow:0 0 0 1px var(--amb)}
.item.m-ok{border-color:var(--ok);background:var(--okd)}
.item.m-bad{border-color:var(--bad);background:var(--badd)}
.item.m-miss{border-color:var(--amb);background:var(--ambd)}
.item .grab{color:var(--mut);font-size:12px;flex:none}
.slot{background:var(--panel);border:1.5px dashed var(--line2);border-radius:9px;padding:9px 11px;min-height:52px;cursor:pointer}
.slot:focus-visible{border-color:var(--acc);border-style:solid}
.slot.hl{border-color:var(--amb);background:#1c1a10}
.slot .st{font-size:13px;font-weight:700;color:var(--cy);margin-bottom:5px}
.slot .ph{color:var(--mut);font-size:13px;font-style:italic}
.slot .item{padding:7px 10px;min-height:44px;font-size:13.5px}

/* order */
.olist{display:flex;flex-direction:column;gap:7px}
.oitem{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:48px}
.oitem .onum{flex:none;width:28px;height:28px;border-radius:7px;background:#0d1420;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;color:var(--cy)}
.oitem .otx{flex:1;font-size:14.5px}
.oitem .mv{display:flex;flex-direction:row;gap:4px}
.oitem .mv button{min-width:44px;min-height:44px;padding:0;border-radius:7px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:15px;color:var(--dim)}
.oitem .mv button:hover{border-color:var(--acc);color:var(--tx)}
.omk{flex:none;min-width:22px;text-align:center;font-weight:800;font-size:15px}
.oitem.m-ok .omk{color:var(--ok)}.oitem.m-bad .omk{color:var(--bad)}
.oitem.m-ok{border-color:var(--ok);background:var(--okd)}
.oitem.m-bad{border-color:var(--bad);background:var(--badd)}

/* fill */
.ftext{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:13px 15px;font-size:15.5px;line-height:2.05;white-space:pre-wrap}
.blank{display:inline-block;min-width:110px;min-height:44px;border-bottom:2px solid var(--amb);background:#0d1420;border-radius:6px 6px 0 0;text-align:center;padding:2px 8px;margin:0 3px;cursor:pointer;font-weight:600;color:var(--cy);vertical-align:middle}
.blank.filled{border-bottom-color:var(--acc)}
.blank.m-ok{border-bottom-color:var(--ok);background:var(--okd)}
.blank.m-ok::after{content:' ✓';color:var(--ok);font-weight:800}
.blank.m-bad{border-bottom-color:var(--bad);background:var(--badd)}
.blank.m-bad::after{content:' ✘';color:var(--bad);font-weight:800}
.blank.m-miss::after{content:' ◐';color:var(--amb);font-weight:800}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding:10px;background:#0d1420;border:1px dashed var(--line2);border-radius:9px}
.bank .bw{background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:7px 15px;min-height:44px;cursor:pointer;font-weight:600;font-size:14px}
.bank .bw:hover{border-color:var(--amb)}
.bank .bw.used{opacity:.32;cursor:default}
.bank .bw.picked{border-color:var(--amb);box-shadow:0 0 0 1px var(--amb)}
.bankTitle{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:12px 0 0}

/* branch */
.stage{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;margin:9px 0}
.stage .sn{font-size:12px;font-weight:800;color:var(--amb);letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
.stage .sq{margin:0 0 8px;white-space:pre-line}
.stage .resolv{font-size:13.5px;color:var(--dim);margin:6px 0 0;border-top:1px dashed var(--line2);padding-top:7px}
.stageDone{opacity:.85}
.stage .opt.lock{cursor:default}

/* terminal */
.term{background:#05080c;border:1px solid #1c2a3a;border-radius:9px;font-family:var(--mono);font-size:14px;overflow:hidden}
.termBar{display:flex;gap:6px;align-items:center;background:#0d1420;padding:7px 12px;border-bottom:1px solid #1c2a3a}
.termBar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.termBar .tl{color:var(--mut);font-size:12px;margin-left:8px}
.termBody{padding:12px 14px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.termBody .in{color:var(--ok)}
.termBody .out{color:#b8c7d9}
.termBody .err{color:var(--bad)}
.termIn{display:flex;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid #1c2a3a;background:#080d13}
.termIn .ps{color:var(--ok);font-family:var(--mono);font-size:14px;flex:none}
.termIn input{flex:1;background:transparent;border:0;color:var(--tx);font-family:var(--mono);font-size:14px;min-height:44px}
.termIn input:focus-visible{outline:none;box-shadow:inset 0 -2px 0 var(--acc)}
.termHintLine{font-size:13px;color:var(--mut);margin-top:8px}

/* logview */
.lv{background:#05080c;border:1px solid #1c2a3a;border-radius:9px;overflow:hidden;margin:8px 0}
.lvBar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0d1420;border-bottom:1px solid #1c2a3a;flex-wrap:wrap}
.lvBar .lt{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--cy);flex:none}
.lvFilter{flex:1;min-width:170px;min-height:44px;background:#05080c;border:1px solid var(--line2);border-radius:7px;color:var(--tx);font-family:var(--mono);font-size:14px;padding:7px 11px}
.lvCount{font-size:12px;color:var(--mut);font-family:var(--mono);flex:none}
.lvBody{max-height:300px;overflow:auto;padding:9px 0}
.lvBody table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:14px}
.lvBody td{padding:2.5px 10px;vertical-align:top;white-space:pre-wrap;word-break:break-word}
.lvBody tr:nth-child(odd){background:#070b10}
.lvBody .ts{color:#7d8ca0;white-space:nowrap}
.lvBody .sev-E{color:var(--bad);font-weight:700}
.lvBody .sev-W{color:var(--amb)}
.lvBody .sev-I{color:#9fb0c0}
.lvBody .sev-S{color:var(--ok)}
.lvBody .hl-ip{color:#79c0ff}
.lvBody .hl-user{color:#d2a8ff}
.lvBody .hl-host{color:var(--cy)}
.lvEmpty{padding:14px;color:var(--mut);font-family:var(--mono);font-size:13.5px}
.lvLegend{font-size:12px;color:var(--mut);margin:4px 2px 0}

/* feedback + explain */
.fb{display:none;margin-top:14px;border-radius:10px;padding:12px 15px;border:1px solid}
.fb:focus,.expl:focus{outline:none}
.fb.on{display:block}
.fb .fbHead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700}
.fb .fbScore{font-variant-numeric:tabular-nums}
.fb .fbHead .stIc{font-size:15px}
.fb.full{background:#0f2418;border-color:#2ea365}
.fb.full .fbHead{color:var(--ok)}
.fb.zero{background:#2a1418;border-color:#a33}
.fb.zero .fbHead{color:var(--bad)}
.fb.part{background:#241d0c;border-color:#8a6d1d}
.fb.part .fbHead{color:var(--amb)}
.fb .fbSub{font-size:13.5px;color:var(--dim);margin-top:3px}
.expl{display:none;margin-top:10px;background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:9px;padding:12px 15px}
.expl.on{display:block}
.expl .el{font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:5px}
.expl p{margin:0;white-space:pre-line;color:var(--dim);font-size:14.5px}
.hintTxt{display:none;margin-top:10px;background:#1c1a10;border:1px solid #6b5417;border-radius:9px;padding:10px 14px;font-size:14.5px;color:var(--amb)}
.hintTxt.on{display:block}
.hintTxt b{letter-spacing:.5px}

/* footer buttons */
.qfoot{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;align-items:center}
.qfoot .spacer{flex:1}
.posInfo{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}

/* navigator */
.navPanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0}
.navPanel summary{cursor:pointer;font-weight:700;color:var(--cy);min-height:44px;display:flex;align-items:center;gap:8px;list-style:none}
.navPanel summary::before{content:'▸';transition:transform .15s}
.navPanel[open] summary::before{transform:rotate(90deg)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px}
.ncell{min-width:44px;min-height:44px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--dim);font-weight:700;font-size:14px;cursor:pointer;position:relative;padding:0}
.ncell:hover{border-color:var(--acc)}
.ncell.ans{border-color:#274a75;color:var(--acc)}
.ncell.chk{border-color:var(--ok);background:var(--okd);color:var(--ok)}
.ncell.skip{border-color:var(--amb);background:var(--ambd);color:var(--amb)}
.ncell.cur{box-shadow:0 0 0 2px var(--acc);z-index:1}
.nlegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--mut)}
.nlegend span{display:inline-flex;align-items:center;gap:5px}
.nlegend i{font-style:normal;font-weight:800}
.nlegend .li-ans{color:var(--acc)}.nlegend .li-chk{color:var(--ok)}.nlegend .li-skip{color:var(--amb)}.nlegend .li-un{color:var(--mut)}
.themeChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tchip{font-size:12.5px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--dim)}
.tchip b{color:var(--cy)}
.submitRow{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.submitRow .note{font-size:13px;color:var(--mut)}

/* results */
.resHero{text-align:center;padding:26px 18px}
.resHero .pct{font-size:54px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.resHero .lbl{font-size:15px;color:var(--dim)}
.passPanel{margin:14px auto;max-width:520px;border-radius:14px;padding:22px;text-align:center;border:2px solid var(--ok);background:radial-gradient(ellipse at top,#12291c 0%,#0d1f16 100%)}
.passPanel .pt{font-size:22px;font-weight:800;color:var(--ok);letter-spacing:1px}
.passPanel .ps{color:var(--dim);margin-top:6px;font-size:14.5px}
.failPanel{margin:14px auto;max-width:520px;border-radius:14px;padding:22px;text-align:center;border:2px solid var(--bad);background:radial-gradient(ellipse at top,#2a1418 0%,#1c0f12 100%)}
.failPanel .pt{font-size:22px;font-weight:800;color:var(--bad)}
.failPanel .ps{color:var(--dim);margin-top:6px;font-size:14.5px}
.statChips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.repCard{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:13px 15px;margin:9px 0}
.repCard .rh{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:6px}
.repCard .rq{font-weight:700;font-size:14.5px;color:var(--tx)}
.rc-full{border-left:3px solid var(--ok)}
.rc-part{border-left:3px solid var(--amb)}
.rc-zero{border-left:3px solid var(--bad)}
.rc-skip{border-left:3px solid var(--mut);opacity:.88}
.rlbl{font-size:12px;font-weight:800;padding:2px 9px;border-radius:6px;letter-spacing:.5px}

.rlbl.zero{background:var(--badd);color:var(--bad);border:1px solid #a33}
.rlbl.skip{background:var(--panel);color:var(--mut);border:1px solid var(--line2)}

<script>
window.__EXAM__ = {"meta": {"topicId": "security-plus", "chapter": "5.3", "titlePrefix": "CompTIA Security+ (SY0-701) — 5.3 Third-party risk", "sevLabel": "MEDIUM", "passMark": 70, "qCount": 30, "estMin": 65, "title": "CompTIA Security+ (SY0-701) — 5.3 Third-party risk — MEDIUM practice exam"}, "timerSec": 3900, "themes": {"VAS": "Vendor assessment & selection", "Q": "Questionnaires", "ROE": "Rules of engagement", "AGR": "Agreements", "MON": "Vendor monitoring & offboarding"}, "keywords": {"VAS": ["Vendor assessment", "Vendor selection", "Due diligence", "RFI (Request for Information)", "RFP (Request for Proposal)", "Weighted scoring matrix", "Proof of concept", "Reference checks", "Financial health", "Vendor tiering", "Right-to-audit clause", "Independent assessment", "Internal assessment", "SOC 1 report", "SOC 2 Type I", "SOC 2 Type II", "SOC 3 report", "ISO/IEC 27001", "Penetration test report", "Attestation letter", "Evidence of compliance"], "Q": ["Security questionnaire", "SIG (Standardized Information Gathering)", "CAIQ (Consensus Assessments Initiative Questionnaire)", "Self-assessment bias", "Evidence request", "Follow-up questions", "Vague answer red flags", "Leading question design"], "ROE": ["Rules of engagement", "Scope (in-scope systems)", "Authorized techniques", "Prohibited actions", "Time windows", "Escalation contact", "Authorization letter", "Deconfliction", "Evidence handling"], "AGR": ["MOU (Memorandum of Understanding)", "MSA (Master Service Agreement)", "MLA (Master License Agreement)", "SaaS agreement", "SLA (Service-Level Agreement)", "Uptime percentage", "Maintenance window exclusion", "Service credits", "RTO (Recovery Time Objective)", "RPO (Recovery Point Objective)", "EOSL (End of Service Life)", "NDA (Non-Disclosure Agreement)", "Data sharing agreement", "Data controller", "Data processor", "Purpose limitation", "Cross-border transfer", "BPA (Blanket Purchase Agreement)", "Incident notification clause", "Legacy system"], "MON": ["Vendor monitoring", "Continuous monitoring", "Periodic reassessment", "KPI (Key Performance Indicator)", "KRI (Key Risk Indicator)", "Subcontractor / 4th-party", "Orphaned account", "Offboarding", "Access revocation", "Data return", "Destruction certificate", "Conflicting interests", "Lack of vendor support", "Outsourcing", "Vendor threat intelligence"]}, "typeList": "Multiple choice (5), drag & drop classification, matching, ordering and prioritization, fill-in-the-blank, decision scenarios (branching, including dual blue/red perspective), log analysis with a filter box, and two terminal exercises where you type real commands.", "exercises": [{"id": "m01", "type": "choice", "theme": "VAS", "pts": 2, "scen": "You sit on the vendor selection committee at Meridian Health. Three managed-SOC providers answered the RFP. The committee agreed the weighted scoring matrix in advance: Security controls 40%, Cost 25%, Support quality 20%, Integration 10%, Roadmap 5%. Panel scores (1-5):\n  NorthGuard SOC : 4 / 3 / 5 / 3 / 4\n  CyberLens      : 5 / 2 / 3 / 2 / 3\n  SafeHarbor     : 3 / 4 / 4 / 5 / 5", "q": "Using the weighted scoring matrix, which vendor wins the selection and why?", "opts": [["a", "NorthGuard SOC — highest weighted total, 3.85"], ["b", "CyberLens — its top security score should dominate"], ["c", "SafeHarbor — strongest support and integration"], ["d", "CyberLens — lowest cost per gigabyte stored"]], "correct": ["a"], "hint": "Multiply each score by its criterion weight, then add the five results per vendor.", "explain": "A weighted scoring matrix multiplies each criterion score by its weight and adds the results. NorthGuard: 4x0.40 + 3x0.25 + 5x0.20 + 3x0.10 + 4x0.05 = 3.85. SafeHarbor: 3.75. CyberLens: 3.45. CyberLens has the single best security score, but vendor selection weighs all agreed criteria — its weak cost and support scores pull the total down. The weights were agreed BEFORE the proposals arrived, which keeps the process fair and defensible."}, {"id": "m02", "type": "match", "theme": "AGR", "pts": 3, "scen": "Legal sends you six agreement names from the vendor management playbook and asks you to brief the new procurement assistants.", "q": "Match each agreement to the description that fits it.", "items": [["i_mou", "Shows shared intent between two SOCs to exchange threat intelligence; duties stay broad and it is not a full contract"], ["i_msa", "One master legal frame with a supplier; each new project is added as a work order under it"], ["i_sla", "Sets measurable service targets — uptime, response times — and money back when they are missed"], ["i_nda", "Legally binds a party to keep shared confidential information secret"], ["i_mla", "Grants licence rights and usage limits for a vendor's software or content"], ["i_bpa", "One negotiated deal that covers many future purchases at pre-agreed prices"]], "slots": [["s_mou", "MOU — Memorandum of Understanding"], ["s_msa", "MSA — Master Service Agreement"], ["s_sla", "SLA — Service-Level Agreement"], ["s_nda", "NDA — Non-Disclosure Agreement"], ["s_mla", "MLA — Master License Agreement"], ["s_bpa", "BPA — Blanket Purchase Agreement"]], "map": {"i_mou": "s_mou", "i_msa": "s_msa", "i_sla": "s_sla", "i_nda": "s_nda", "i_mla": "s_mla", "i_bpa": "s_bpa"}, "hint": "Two of them are about money over time (services and purchases); the other four each protect one specific thing.", "explain": "MOU = statement of shared intent, usually loosely binding. MSA = the master terms that all future work orders inherit. SLA = measurable service levels plus credits when missed. NDA = confidentiality obligation. MLA = software/content licensing terms. BPA = one negotiation covering many future purchases at fixed prices. Mixing these up causes real damage — for example, treating an MOU as a contract with real remedies."}, {"id": "m03", "type": "slots", "theme": "Q", "pts": 2, "scen": "CloudNest, a SaaS file-sharing vendor, returned their security questionnaire (SIG format) for the annual review. Six answers arrived. You must flag each one before the follow-up meeting.", "q": "Sort the six answers: red flag needing follow-up, or acceptable with evidence?", "items": [["n1", "'SOC 2 Type II certified — report attached, issued last month'"], ["n2", "'We follow industry best practices for encryption of customer data'"], ["n3", "'Access reviews run quarterly; minutes from the last review attached'"], ["n4", "'We have never had a breach, so additional controls are unnecessary'"], ["n5", "'ISO/IEC 27001 certificate valid until March — certificate number attached'"], ["n6", "'Security is very important to us and we train our staff regularly'"]], "groups": [["g_red", "Red flag — needs follow-up questions"], ["g_ok", "Acceptable — control, date, and evidence attached"]], "map": {"n1": "g_ok", "n2": "g_red", "n3": "g_ok", "n4": "g_red", "n5": "g_ok", "n6": "g_red"}, "hint": "Good answers name a control, a frequency, and attach evidence. Marketing phrases do none of that.", "explain": "Answers 2, 4 and 6 are vague self-praise with no evidence — classic self-assessment bias and a vague-answer red flag. 'Industry best practices' names no control; 'never had a breach' is luck, not a control, and says nothing about detection ability; 'we train regularly' gives no frequency, content, or proof. Answers 1, 3 and 5 name a control, give a date, and attach evidence — that is what an evidence request looks for. Note a SOC 2 Type II covers controls operating over a period, which is stronger than a SOC 2 Type I snapshot, which observes design only at a single point in time. A good questionnaire avoids leading questions so vendors cannot just agree their way through."}, {"id": "m04", "type": "logview", "theme": "MON", "pts": 2, "scen": "03:20, Friday. Your SIEM opened ticket INC-40113: unusual VPN activity for the vendor support account svc.northguard-support (NorthGuard SOC is a tier-1 managed-SOC vendor). The raw VPN gateway log is below.", "q": "Review the log (use the filter box). Which TWO findings must be escalated right now?", "log": {"title": "vpn-gw01 auth log — INC-40113", "lines": [["02:58", "I", "user=svc.northguard-support authenticated to VPN from 198[.]51[.]100[.]9 (Amsterdam)"], ["03:01", "S", "MFA push approved for svc.northguard-support (device: vendor-tab-02)"], ["03:14", "I", "user=svc.northguard-support authenticated to VPN from 203[.]0[.]113[.]44 (Sao Paulo)"], ["03:14", "W", "new device fingerprint for svc.northguard-support (not seen in 90 days)"], ["03:16", "S", "MFA push approved for svc.northguard-support (device: vendor-tab-02)"], ["03:20", "I", "session opened: read ticket queue INC-* (14 tickets listed)"]]}, "ans": {"opts": [["a", "Impossible travel: one account, two distant countries, 16 minutes apart"], ["b", "The account is shared by the vendor team, so accountability is lost"], ["c", "Night VPN logins from a service account are always attacks"], ["d", "The 03:20 queue read proves that exfiltration already happened"]], "correct": ["a", "b"]}, "hint": "Think: can one human be in Amsterdam and Sao Paulo 16 minutes apart? And who was actually typing?", "explain": "Amsterdam at 02:58 and Sao Paulo at 03:14 is impossible travel — one session cannot hop continents in 16 minutes, so at minimum credentials are shared or stolen. The account itself is a shared vendor login, which breaks individual accountability: you cannot prove who performed the actions, and the vendor should issue named accounts. Night logins are normal for a service account that monitors your SOC — not a finding by itself. Reading a ticket queue does not prove exfiltration; it is suspicious context, not proof."}, {"id": "m05", "type": "terminal", "theme": "MON", "pts": 2, "scen": "Working INC-40113 (vendor account misuse), you SSH to the SOC jump host. The evidence needs the vendor account's lines pulled from the authentication log and saved for the ticket — without changing the original log.", "q": "Use a grep command on /var/log/auth.log to save every line mentioning svc.northguard-support into vendor_evidence.txt. Type the command and press Enter.", "term": {"title": "SOC jump host — bash", "banner": "auth.log: 41,882 lines · last write 03:41\nEvidence rule: read-only on originals; write outputs to your case folder.", "ps1": "analyst@soc-jump:~$", "accept": ["grep\\s+.*svc\\.northguard-support.*(>|tee)", "grep\\s+.*(>|tee).*svc\\.northguard-support"], "out": "2026-10-09T02:58:11Z vpn: user=svc.northguard-support authenticated from 198[.]51[.]100[.]9\n2026-10-09T03:14:02Z vpn: user=svc.northguard-support authenticated from 203[.]0[.]113[.]44\n2026-10-09T03:14:03Z vpn: new device fingerprint for svc.northguard-support\n2026-10-09T03:20:44Z vpn: session opened queue INC-* by svc.northguard-support\n-> 4 lines written to vendor_evidence.txt", "err": "no output — check the pattern and the file name", "example": "grep svc.northguard-support /var/log/auth.log > vendor_evidence.txt"}, "hint": "Family: grep. Pattern first or after flags, then the log file, then redirect with > to the output file.", "explain": "grep filters text by pattern: grep PATTERN FILE. The > redirect writes the matches into vendor_evidence.txt instead of the screen. This keeps the original log untouched — evidence handling means you never edit or move the source of truth, you only copy from it. tee would also work: it shows the output AND saves it."}, {"id": "m06", "type": "order", "theme": "VAS", "pts": 4, "scen": "Meridian Health is about to select a new backup-storage vendor. The CISO asks you to present the assessment lifecycle at the architecture board.", "q": "Put the vendor assessment steps in the correct order, from first to last.", "items": [["o1", "Define requirements and the evaluation criteria"], ["o2", "Send the RFI to map the market and shortlist candidates"], ["o3", "Issue the RFP to the shortlisted vendors"], ["o4", "Score the proposals with the agreed weighted matrix"], ["o5", "Run a proof of concept with the top two vendors"], ["o6", "Do due diligence: reference checks, SOC 2 report, financial health"], ["o7", "Negotiate and sign the MSA, SLA and NDA"], ["o8", "Onboard the vendor and start continuous monitoring"]], "hint": "You cannot evaluate what you have not defined; paperwork comes before the pilot, contracts after you trust the numbers.", "explain": "Order: requirements first (you cannot score what you never defined), then RFI to discover the market, RFP to collect binding proposals, weighted scoring to compare fairly, a proof of concept to test claims in practice, due diligence (reference checks, SOC 2 review, financial health) to confirm the vendor is real and stable, contracts after — never before — the checks, and finally onboarding with monitoring from day one. Skipping due diligence because 'the demo looked great' is the classic failure. Note the internal assessment of your own requirements happens at step 1, before any independent assessment of the vendor."}, {"id": "m07", "type": "choice", "theme": "AGR", "pts": 2, "scen": "The CloudNest SLA promises 99.9% monthly uptime for your tenant, excluding scheduled maintenance announced at least 48 hours ahead. October has 31 days (44,640 minutes). The October report shows 66 minutes of unplanned downtime and 90 minutes of announced, scheduled maintenance.", "q": "Did CloudNest breach the SLA in October?", "opts": [["a", "Yes — 66 unplanned minutes exceed the 44.6-minute allowance"], ["b", "No — total downtime of 156 minutes is under 1% of the month"], ["c", "Yes — 156 total minutes exceed the 44.6-minute allowance"], ["d", "No — 66 minutes is under 0.2% of the month, inside tolerance"]], "correct": ["a"], "hint": "99.9% of 44,640 minutes means at most 0.1% may be down. Only unplanned downtime counts against it.", "explain": "0.1% of 44,640 minutes is 44.6 minutes of allowed unplanned downtime. The 90 minutes of scheduled maintenance is excluded because the SLA says announced maintenance windows do not count. 66 minutes of unplanned downtime is over the allowance, so the SLA is breached and service credits apply. Option b and d use the wrong threshold; option c wrongly adds the excluded maintenance. Always read what the uptime percentage excludes — that is where vendors win arguments."}, {"id": "m08", "type": "fill", "theme": "AGR", "pts": 2, "scen": "Legal asks you to sanity-check the NDA before the incident-response workshop with vendor staff who will see live case data.", "q": "Complete the NDA clause. Click a word in the bank, then click its blank.", "text": "This NDA is {1}: only Meridian Health discloses confidential information to the vendor. The obligation lasts {2} years after termination. If the vendor breaches it, the agreed {3} apply. The NDA does not cover information that is already {4}.", "bank": ["unilateral", "5", "liquidated damages", "publicly known", "mutual", "purpose limitation"], "correct": {"1": "unilateral", "2": "5", "3": "liquidated damages", "4": "publicly known"}, "hint": "Only one side is disclosing — that decides the first blank. The last blank is the standard exception to every NDA.", "explain": "One-way disclosure makes it a unilateral NDA (a mutual NDA covers both sides disclosing). Five years is the agreed tail period after termination. Liquidated damages are the pre-agreed amounts payable for a breach, which avoids arguing about losses later. Publicly known information is the standard exception — a secret that is already public can no longer be protected. Purpose limitation belongs in a data sharing agreement, not here."}, {"id": "m09", "type": "match", "theme": "VAS", "pts": 3, "scen": "Due diligence week: the inbox is full of vendor assurance documents. The junior analyst keeps them all in one folder labelled 'proof'. You must teach the team what each document actually proves.", "q": "Match each assurance artifact to what it really demonstrates.", "items": [["a1", "SOC 2 Type II report"], ["a2", "ISO/IEC 27001 certificate"], ["a3", "Penetration test report"], ["a4", "SOC 1 report"], ["a5", "SOC 3 report"], ["a6", "SIG questionnaire"], ["a7", "Attestation letter"]], "slots": [["b1", "An auditor observed security controls operating over a period (3-12 months)"], ["b2", "An accredited body certified the ISMS against a published standard"], ["b3", "Testers attacked like real adversaries and listed findings with severity"], ["b4", "Controls relevant to financial reporting — meant for financial auditors"], ["b5", "A short, public, general-use summary of the audit — no control detail"], ["b6", "The vendor self-describes its controls in a standard format, unverified"], ["b7", "The vendor's own signed claim that one control exists — weakest assurance"]], "map": {"a1": "b1", "a2": "b2", "a3": "b3", "a4": "b4", "a5": "b5", "a6": "b6", "a7": "b7"}, "hint": "Rank them by who says it: independent auditor over outside testers over the vendor itself.", "explain": "SOC 2 Type II is the strongest common report: an independent assessor verified controls operated over months. ISO/IEC 27001 certifies the management system, not each control's effectiveness. A penetration test report shows real attack results but only a point in time. SOC 1 is for financial auditors, not security. SOC 3 is a public teaser of the SOC 2. A SIG questionnaire is the vendor describing itself — useful, but self-attested. An attestation letter is just a promise. Independent assessment beats internal assessment claims; an evidence of compliance request should always name the document it expects."}, {"id": "m10", "type": "branch", "theme": "AGR", "pts": 3, "scen": "Friday 18:40. CloudNest emails: 'We detected unauthorized access to a storage bucket that may include your data. Details to follow.' You are the on-call vendor manager.", "q": "Work the decision path. Each choice unlocks the next step.", "stages": [{"q": "What is your FIRST move?", "opts": [["s1a", "Open an internal incident and start the clock on the notification clause"], ["s1b", "Reply asking them to investigate quietly and report back only if something is confirmed"], ["s1c", "Post a public warning on the customer status page right away"]], "correct": "s1a", "resolv": {"s1a": "Correct — an incident with a defined owner and a running clock protects every later decision.", "s1b": "Asking a vendor to stay silent is a trap: you lose time and may breach your own notification duties.", "s1c": "Going public before facts exist spreads panic and may be wrong — notify internally first."}}, {"q": "Legal asks: which documents define YOUR notification duties for this event?", "opts": [["s2a", "Your data sharing agreement plus the contract's incident notification clause"], ["s2b", "CloudNest's marketing FAQ, which promises full transparency to customers"], ["s2c", "No documents apply — only the vendor carries duties in a vendor breach"]], "correct": "s2a", "resolv": {"s2a": "Correct — the DSA defines processing duties and the notification clause defines timing and content.", "s2b": "Marketing text has no legal force.", "s2c": "As the data controller you carry duties to your own regulators and customers — documents do apply."}}, {"q": "CloudNest proposes: 'We investigate quietly, no tickets, no paper trail.' Your response?", "opts": [["s3a", "Decline in writing, demand the forensic timeline, and preserve all evidence"], ["s3b", "Accept — fewer tickets and less paperwork means less work for everyone"], ["s3c", "Accept, but forward their emails to a private account as a record"]], "correct": "s3a", "resolv": {"s3a": "Correct — decline on the record, demand the contractual timeline, and keep evidence intact.", "s3b": "Waiving your contractual rights in writing weakens any later claim.", "s3c": "Moving evidence to a private account destroys the chain of custody."}}], "hint": "First move is always to control your own clock. Legal duties come from your signed documents, not the vendor's FAQ.", "explain": "The right path: open an incident and start the contractual clock, ground the duties in the data sharing agreement and the incident notification clause, and refuse any 'quiet investigation' deal — instead demand the forensic timeline the contract entitles you to and preserve evidence. Verbal or private-workaround paths destroy both your legal position and the evidence chain. This is also where vendor monitoring pays off: vendors with mature incident processes notify early, giving you more reaction time."}, {"id": "m11", "type": "slots", "theme": "ROE", "pts": 3, "scen": "Meridian Health hired NorthGuard's red team to test the claims-processing lab. The rules of engagement (ROE) authorize the engagement: the signed authorization letter is attached, scope is the test range 10[.]20[.]30[.]0/24 plus the claims API, the window is Tue-Thu 09:00-17:00, and the escalation contact is the vendor SOC lead. The ROE lists authorized techniques (external recon, web exploitation, password spraying on the lab only) and prohibited actions (denial of service, phishing staff, touching production).", "q": "Sort each planned action. Drag each item into its group — or click item, then group.", "items": [["r1", "Port-scan the test range 10[.]20[.]30[.]0/24 during the window"], ["r2", "Attempt SQL injection on the in-scope claims API on Thursday"], ["r3", "Phish the vendor's HR staff to harvest credentials"], ["r4", "Run a load test against the production payment gateway to check resilience"], ["r5", "Attack a host that turns out to be shared with a partner platform on the same range"], ["r6", "Password-spray the lab's test accounts listed in scope"]], "groups": [["g1", "Allowed under the ROE"], ["g2", "Prohibited — do not do it"], ["g3", "Deconfliction needed first"]], "map": {"r1": "g1", "r2": "g1", "r3": "g2", "r4": "g2", "r5": "g3", "r6": "g1"}, "hint": "Scope, techniques, and targets must all be inside the letter. Shared infrastructure is never a green light by default.", "explain": "R1, R2 and R6 sit inside the scope, the window, and the authorized techniques, so they are allowed. R3 (phishing staff) and R4 (DoS-style load on production) are explicitly prohibited actions — the tester must stop. R5 needs deconfliction: the host is shared with a partner, so the tester pauses and contacts the escalation contact before touching it. An ROE only protects you while every part of it — scope, authorized techniques, time windows, prohibited actions — is respected."}, {"id": "m12", "type": "slots", "theme": "VAS", "pts": 4, "scen": "The vendor register review: every new vendor must be tiered, because the tier drives assessment depth — tier 1 gets full due diligence and continuous monitoring, tier 3 a light annual check. Outsourcing work to a vendor moves the task, never the accountability.", "q": "Classify each vendor into its tier, considering data access, network access, and business criticality.", "items": [["v1", "Payroll processor with direct access to employee bank data"], ["v2", "Managed SOC provider whose engineers hold VPN accounts into our core network"], ["v3", "Backup storage provider holding full database replicas"], ["v4", "CRM SaaS holding customer contact records"], ["v5", "HR benefits portal holding employee personal data, no network access to us"], ["v6", "E-learning platform for staff training content, no sensitive data"], ["v7", "Office coffee supplier, no systems, no data"], ["v8", "Business-card printer, receives only the public logo"]], "groups": [["t1", "Tier 1 — critical"], ["t2", "Tier 2 — important"], ["t3", "Tier 3 — low"]], "map": {"v1": "t1", "v2": "t1", "v3": "t1", "v4": "t2", "v5": "t2", "v6": "t3", "v7": "t3", "v8": "t3"}, "hint": "Tier 1 = sensitive data or deep network access or the business stops without them.", "explain": "Tier 1: payroll (money plus PII), the managed SOC (direct network access), and backups (complete data replicas) — compromise or failure here is existential, so they get the deepest due diligence and continuous monitoring. Tier 2: the CRM and the benefits portal hold real personal data but without deep integration. Tier 3: no sensitive data, no access — a light questionnaire is enough. Tiering (vendor tiering by criticality) is what makes the assessment program affordable: effort follows risk."}, {"id": "m13", "type": "order", "theme": "MON", "pts": 2, "rank": true, "scen": "Quarterly vendor risk review. Four vendors sit on the agenda with these facts:\n  ALPHA — no current assurance reports, admin VPN into the core network, failed last year's reassessment, two unanswered escalation emails.\n  BETA — current SOC 2 Type II, read-only API into the customer database, one KRI breach last quarter (late patching).\n  GAMMA — no assessments, supplies stationery, no network access, no data.\n  DELTA — ISO/IEC 27001 certified, stores archived backups offline, annual review scheduled next month.", "q": "Rank the vendors from MOST overall risk to LEAST.", "items": [["k1", "ALPHA"], ["k2", "BETA"], ["k3", "GAMMA"], ["k4", "DELTA"]], "hint": "Combine three things: level of access, state of assurance, and behaviour (missed reviews, ignored escalations).", "explain": "ALPHA is the most risky: deep access, no valid assurance, a failed reassessment and ignored escalations — the profile of a vendor about to cause an incident. BETA follows: real access to customer data and a KRI breach, but current independent evidence shows control. DELTA has certified controls, offline-only backups, and a review on schedule. GAMMA has neither access nor data — almost no blast radius. Ranking blends access, assurance, and track record; a vendor with no access can hardly hurt you, however untidy their paperwork."}, {"id": "m14", "type": "logview", "theme": "MON", "pts": 2, "scen": "Monday stand-up. The storage team noticed the SFTP transfer report looks 'too healthy'. The contract with ACME Data says: one weekly sync, Sundays 02:00, one archive file, maximum 2 GB, to their gateway gw.acmedata.example. The log below covers the last 72 hours.", "q": "Read the log (try filtering for acmedata or csv). What does it most likely show?", "log": {"title": "sftp-transfer-01 — last 72h", "lines": [["01:22", "I", "session opened user=acmedata-svc from 203[.]0[.]113[.]77 (sftp)"], ["01:24", "W", "upload payroll_export_full.csv 1.4 GB -> ext-gw.acme-shadow.example"], ["01:31", "I", "session opened user=acmedata-svc from 203[.]0[.]113[.]77 (sftp)"], ["01:33", "W", "upload payroll_export_delta.csv 610 MB -> ext-gw.acme-shadow.example"], ["02:00", "S", "scheduled weekly sync: archive_w42.tar.gz 1.1 GB -> gw.acmedata.example"], ["02:09", "I", "session closed user=acmedata-svc"], ["01:18", "I", "session opened user=acmedata-svc from 198[.]51[.]100[.]30 (sftp)"], ["01:25", "W", "upload payroll_export_full.csv 1.4 GB -> ext-gw.acme-shadow.example"]]}, "ans": {"opts": [["a", "Sessions outside the contract push data to an unnamed destination — possible data leakage"], ["b", "Normal operation: the only real event is the weekly Sunday sync, which ran as scheduled"], ["c", "A backup naming glitch — the same file appearing twice means nothing at all"], ["d", "Proof that a zero-day in the SFTP server was exploited by an unknown hacker"]], "correct": ["a"]}, "hint": "Compare each session against the contract line: one weekly sync, one file, one named destination.", "explain": "Three extra sessions outside the Sunday window push payroll CSVs, including the same 1.4 GB file twice, to ext-gw.acme-shadow.example — a destination that appears nowhere in the contract. The legitimate weekly sync also appears, which is exactly why this looks 'healthy' in a volume report. This pattern fits the vendor account moving data out beyond its authorized purpose — escalate as possible data leakage, preserve the logs, and invoke the incident notification clause. The Sunday sync being normal does not neutralize the off-contract transfers."}, {"id": "m15", "type": "fill", "theme": "AGR", "pts": 2, "scen": "CloudNest will process pseudonymized patient appointment records for the reminder service. Legal hands you the data sharing agreement draft to complete before signature.", "q": "Complete the DSA clauses. Click a word, then its blank.", "text": "Under this agreement Meridian Health is the data {1}, because it decides why and how the records are used. CloudNest acts as data {2} and processes only on documented instructions. Processing is limited to the reminder service by the {3} principle. Any transfer to a country outside the approved list requires an approved {4} safeguard first.", "bank": ["controller", "processor", "purposes", "cross-border", "custodian", "indefinitely"], "correct": {"1": "controller", "2": "processor", "3": "purposes", "4": "cross-border"}, "hint": "The party that decides the WHY is the controller. The other party only follows instructions.", "explain": "Meridian decides the purposes, so it is the data controller; CloudNest processes on instructions as the data processor. Purpose limitation means data collected for the reminder service cannot silently feed other uses. Moving data to a non-approved country needs a valid cross-border transfer safeguard (for example an adequacy decision or standard contractual clauses) before the first byte moves. Getting these roles wrong reverses who carries which legal duty."}, {"id": "m16", "type": "slots", "theme": "AGR", "pts": 3, "scen": "Procurement inbox, end of day. Six situations, six agreement names. The assistants need to file each under the document that actually governs it.", "q": "Assign each situation to the agreement that governs it.", "items": [["x1", "Two SOCs agree in writing to explore joint threat-intelligence exchanges, no binding duties yet"], ["x2", "New projects with the MSSP join an existing legal frame instead of renegotiating from zero"], ["x3", "Critical tickets must be answered in 15 minutes or the vendor pays money back"], ["x4", "Laptops are bought all year at pre-negotiated prices with one signing"], ["x5", "A university researcher will see incident data; confidentiality must be binding"], ["x6", "Pseudonymized patient records go to a laboratory for analysis"]], "groups": [["y1", "MOU"], ["y2", "MSA"], ["y3", "SLA"], ["y4", "BPA"], ["y5", "NDA"], ["y6", "Data sharing agreement"]], "map": {"x1": "y1", "x2": "y2", "x3": "y3", "x4": "y4", "x5": "y5", "x6": "y6"}, "hint": "Ask each time: is this about intent, the master frame, measurable service, repeated buying, secrecy, or personal data?", "explain": "Intent without binding duties = MOU. The master frame that future work orders inherit = MSA. Measurable service levels with credits = SLA. One negotiation for many future purchases = BPA. Binding confidentiality for disclosed information = NDA. Personal data handed to another party for defined processing = data sharing agreement. Filing under the wrong document is how organizations discover too late that nobody actually owed them anything."}, {"id": "m17", "type": "fill", "theme": "MON", "pts": 2, "scen": "The CISO drafts the vendor monitoring policy after the ACME transfer scare. Fill the policy language.", "q": "Complete the vendor monitoring policy. Click a word, then its blank.", "text": "Tier-1 vendors receive {1} monitoring of their security posture, not a once-a-year questionnaire. We track {2} values such as 'days since last SLA breach' to measure delivered performance. A {3} warns us when vendor RISK rises, for example patch backlog growing past 30 days. Every vendor with network access receives a {4} reassessment at least annually. Vendor threat intelligence — news of a breach at a vendor — triggers an immediate review.", "bank": ["continuous", "KPI", "KRI", "periodic", "quarterly-only", "one-time"], "correct": {"1": "continuous", "2": "KPI", "3": "KRI", "4": "periodic"}, "hint": "KPI measures how WELL they perform; KRI warns how DANGEROUS they are becoming.", "explain": "Continuous monitoring means telemetry and checks all year, not paperwork annually. KPIs measure delivered performance (response times, availability). KRIs are early-warning risk signals — rising patch backlog is a KRI, not a KPI, because it measures danger, not service. Periodic reassessment keeps the assurance fresh; 'annual-only' contact with a tier-1 vendor is how stale approvals happen. And vendor threat intelligence closes the loop: a breach at the vendor is a monitoring event for you too."}, {"id": "m18", "type": "branch", "theme": "VAS", "pts": 3, "scen": "FileFlow, a new SaaS transfer vendor, wants a pilot with real customer email addresses next month. You own the due diligence gate.", "q": "Work the onboarding path. Each choice unlocks the next step.", "stages": [{"q": "Before any data moves, what do you request first?", "opts": [["f1a", "Request the questionnaire, tier the vendor, and require SOC 2 or ISO evidence first"], ["f1b", "Start the pilot immediately; the paperwork can follow if the tool proves useful"], ["f1c", "Ask only for their best price so that procurement can compare vendors"]], "correct": "f1a", "resolv": {"f1a": "Correct — questionnaire plus evidence, and tiering decided before data flows.", "f1b": "Pilots have a habit of becoming production. Evidence first.", "f1c": "Price without assurance is how risky vendors get bought."}}, {"q": "FileFlow returns the questionnaire fully answered but with zero evidence attached. Next?", "opts": [["f2a", "Issue a formal evidence request with a deadline and follow-up questions"], ["f2b", "Accept it — vendors score their own controls honestly"], ["f2c", "Fail them silently and simply stop answering their emails"]], "correct": "f2a", "resolv": {"f2a": "Correct — self-scores without evidence are claims, not facts; follow-up questions close the gaps.", "f2b": "Self-assessment bias is exactly why evidence exists.", "f2c": "Silent failure teaches nobody anything and leaves the register wrong."}}, {"q": "The pilot is approved with dummy data. What still protects information during the pilot?", "opts": [["f3a", "An NDA plus a pilot addendum fixing purpose limitation and data handling"], ["f3b", "Nothing at all — dummy data needs no protection whatsoever"], ["f3c", "A verbal promise from their sales engineer that everything stays internal"]], "correct": "f3a", "resolv": {"f3a": "Correct — even pilots run under signed terms; purpose limitation stops scope creep.", "f3b": "Dummy data still reveals your workflows, schemas and traffic patterns.", "f3c": "Verbal promises are worth exactly the cost of remembering them."}}], "hint": "Paperwork before pilot, evidence before trust, signed terms even for 'just a test'.", "explain": "Good onboarding runs: questionnaire plus evidence request with follow-ups, tiering before any data flows, and signed pilot terms — NDA plus addendum under the SaaS agreement with purpose limitation. Skipping the gate because the tool is shiny is how shadow SaaS with customer PII appears. The vendor register should show FileFlow as tier 2 (or 1 if real data later) with its reassessment date already set."}, {"id": "m19", "type": "match", "theme": "MON", "pts": 4, "scen": "The vendor monitoring queue shows eight events from this week. As vendor manager you must pick the right response for each — the wrong one either overreacts or lets risk sit.", "q": "Match each monitoring event to the correct response.", "items": [["e1", "KRI: vendor patch backlog doubled in one month"], ["e2", "Vendor announces EOSL for the firewall model we rent from them"], ["e3", "SLA availability missed two months in a row"], ["e4", "Vendor added a subcontractor that now processes our data"], ["e5", "Vendor engineers share one admin login between shifts"], ["e6", "Vendor missed the annual reassessment window by 60 days"], ["e7", "Finalist in our selection is 40% owned by a direct competitor"], ["e8", "Vendor support stopped answering critical tickets for three weeks"]], "slots": [["p1", "Escalate with a demand for a remediation plan and dated commitments"], ["p2", "Plan the replacement or upgrade before support — and patches — end"], ["p3", "Invoke service credits and open a contract performance review"], ["p4", "Verify the change flows into the DSA and reassess the new party"], ["p5", "Require named individual accounts with unique attribution"], ["p6", "Suspend new data flows until the reassessment completes"], ["p7", "Declare the conflicting interest to the risk committee and recuse or control it"], ["p8", "Trigger the escalation path and review exit options — lack of support is a contract issue"]], "map": {"e1": "p1", "e2": "p2", "e3": "p3", "e4": "p4", "e5": "p5", "e6": "p6", "e7": "p7", "e8": "p8"}, "hint": "Every event has a matching knob: technical fix, contractual lever, or governance decision.", "explain": "Growing patch backlog is a KRI — demand a dated remediation plan. EOSL turns rented gear into a legacy system with no patches, so replacement must be planned before the date. Two missed SLA months invoke credits and a performance review. A new subcontractor must enter the DSA world and be reassessed — outsourcing work never outsources accountability. Shared logins destroy attribution, so named accounts are mandatory. A missed reassessment freezes new data flows until the check completes. A competitor-owned finalist is a conflicting interest for the risk committee, and three weeks of silence from support is a lack-of-vendor-support problem with exit options on the table."}, {"id": "m20", "type": "branch", "theme": "ROE", "pts": 2, "scen": "Dual perspective — the same vendor-access event, seen from both chairs. The ROE for NorthGuard's support access sets time windows: sessions only Mon-Fri 08:00-18:00, all sessions recorded.", "q": "Two rounds: first as blue team, then as red team.", "stages": [{"q": "BLUE TEAM — The vendor's remote-support tool opens a session on the finance server at 21:15, outside the ROE window. What do you detect?", "opts": [["d1a", "An ROE violation: authorized vendor access outside the agreed time window"], ["d1b", "Normal vendor behaviour — support tools run whenever support needs them"], ["d1c", "A false positive; time windows in an ROE are suggestions, not controls"]], "correct": "d1a", "resolv": {"d1a": "Correct — the tool is authorized, the HOUR is not. That is a violation to escalate, not ignore.", "d1b": "'Whatever hours' access is exactly what the ROE exists to prevent.", "d1c": "Time windows are the control that makes vendor access predictable and monitorable."}}, {"q": "RED TEAM — You test the same finance server for the vendor. A junior wants to keep a copied support-tool session token to return next week after the engagement ends. Call it?", "opts": [["d2a", "Prohibited: persistence after the engagement ends — remove it and report it"], ["d2b", "Acceptable: the token belongs to an authorized tool, so it is fine"], ["d2c", "Acceptable if the token is deleted after the next successful login"]], "correct": "d2a", "resolv": {"d2a": "Correct — access must die with the engagement. Tokens outliving the window are backdoors.", "d2b": "Authorization belongs to the window and the engagement, not to the tool forever.", "d2c": "Conditional theft is still theft — the ROE allows no post-engagement access."}}], "hint": "Blue: check the event against scope, techniques, and TIME. Red: your permission ends when the engagement ends.", "explain": "Blue team: authorized vendor tooling used outside the ROE time window is a violation — escalate via the escalation contact, keep the recording, and review what was touched. Red team: keeping a live token after the engagement creates unauthorized persistence; the ROE, the authorization letter, and the law all end at the same moment. Understanding both sides shows why ROE time windows exist: they turn vendor access from a standing risk into a bounded, observable event."}, {"id": "m21", "type": "slots", "theme": "AGR", "pts": 4, "scen": "Drafting day for the CloudNest renewal. Legal spread eight draft clauses on the table and asks which document each belongs in. Misfiled clauses cause disputes years later.", "q": "Sort each clause into the document where it belongs.", "items": [["c1", "99.95% monthly uptime target for the service"], ["c2", "Response time for P1 incidents: 15 minutes, 24/7"], ["c3", "Service credits: 5% of monthly fee per full hour of unplanned downtime"], ["c4", "RTO 4 hours and RPO 1 hour after a declared disaster"], ["c5", "Definition of confidential information and its return on request"], ["c6", "Licence seat counts, usage limits, and permitted installations"], ["c7", "Invoice amounts, currency, and payment terms"], ["c8", "Approved purposes for any shared customer records"]], "groups": [["w1", "SLA"], ["w2", "NDA"], ["w3", "MLA"], ["w4", "MSA / SaaS agreement"], ["w5", "Data sharing agreement"]], "map": {"c1": "w1", "c2": "w1", "c3": "w1", "c4": "w1", "c5": "w2", "c6": "w3", "c7": "w4", "c8": "w5"}, "hint": "Ask what the clause measures (SLA), protects (NDA), licenses (MLA), sells/pays (MSA), or permits with data (DSA).", "explain": "Measurable service performance — uptime target, response times, service credits, and the RTO/RPO recovery commitments — lives in the SLA. Confidential information and its return belong to the NDA. Licence scope is the MLA. Money and general commercial terms sit in the MSA (or the SaaS agreement for a subscription). Approved purposes for shared records are the heart of the data sharing agreement. A payment clause hidden in an SLA, or credits missing entirely, is how renewal season becomes dispute season."}, {"id": "m22", "type": "choice", "theme": "AGR", "pts": 2, "scen": "A partner SOC proposes an MOU to share detections. A director says: 'Great — sign it, then we can demand their source data whenever we want.'", "q": "Which statement about an MOU is correct?", "opts": [["a", "An MOU records shared intent and broad roles, with little enforceability"], ["b", "An MOU carries the same remedies as an MSA once it is signed"], ["c", "An MOU must include uptime targets before it counts as valid"], ["d", "An MOU removes the need for an NDA when sensitive data is shared"]], "correct": ["a"], "hint": "MOU = the handshake on paper. It sets direction, not remedies.", "explain": "An MOU documents common intent and broad responsibilities — useful to start cooperation — but it typically lacks enforceable remedies, service levels, and liability terms. You cannot 'demand' anything under it. Uptime targets belong in an SLA, and sensitive data still needs an NDA or a data sharing agreement regardless of any MOU. Treat an MOU as the prelude to a real contract, not a substitute."}, {"id": "m23", "type": "branch", "theme": "VAS", "pts": 2, "scen": "The Meridian-NorthGuard MSA contains a right-to-audit clause: with 15 business days' written notice, Meridian may examine the vendor's relevant controls and records, on site or by document review. After two SLA breaches, you invoke it. NorthGuard replies: 'Internal policy — no customer audits.'", "q": "Work the escalation path.", "stages": [{"q": "What does the right-to-audit clause actually give you?", "opts": [["q1a", "A contractual right to inspect the vendor's controls and records"], ["q1b", "The right to take administrative control of the vendor's systems"], ["q1c", "An automatic right to terminate and recover every fee ever paid"]], "correct": "q1a", "resolv": {"q1a": "Correct — it is an inspection right, exercised with notice, in scope, with the vendor's cooperation.", "q1b": "Audit rights inspect; they do not seize systems.", "q1c": "Termination follows its own breach process — the audit clause is not a kill switch."}}, {"q": "NorthGuard still refuses after your written notice. The contract names audit refusal a material breach. Next?", "opts": [["q2a", "Issue a cure notice citing the clause, involve legal, and start exit planning"], ["q2b", "Complain publicly on social media to pressure them into compliance"], ["q2c", "Accept the refusal quietly to protect the relationship"]], "correct": "q2a", "resolv": {"q2a": "Correct — use the contract's own machinery: cure notice, governance escalation, and a prepared exit.", "q2b": "Public pressure breaches your own confidentiality duties and weakens your position.", "q2c": "Waiving an audit right after breaches tells every vendor that clauses are decorative."}}], "hint": "The clause is an inspection right with conditions — and refusal is a breach you answer through the contract.", "explain": "A right-to-audit clause grants supervised inspection of the vendor's controls and records after proper notice — it is evidence-gathering, not system seizure. When the vendor refuses, the contractual path runs: written invocation, then a cure notice naming the material breach, with legal and procurement aligned and exit options prepared. An audit right you never exercise or defend is worthless; vendors watch whether clauses get enforced."}, {"id": "m24", "type": "order", "theme": "MON", "pts": 3, "scen": "CloudNest lost the renewal: their contract ends in 30 days. You own the offboarding. The register lists six steps; the order matters — one wrong move either strands your data or leaves live access behind.", "q": "Order the offboarding steps correctly, first to last.", "items": [["z1", "Confirm the termination notice and set the end date with the vendor"], ["z2", "Export and migrate our data while vendor access is still live"], ["z3", "Revoke all vendor accounts, API keys, and VPN profiles (access revocation)"], ["z4", "Close the network paths and integrations pointed at the vendor"], ["z5", "Collect the certificate of destruction for data the vendor held"], ["z6", "Update the vendor register and sweep for orphaned accounts"]], "hint": "Data first while access exists, then cut everything, then get proof, then clean the register.", "explain": "Sequence: confirm the end date, export your data while the pipe still works, revoke every vendor identity (access revocation), then close network paths and integrations, then obtain the certificate of destruction as proof the vendor's copies are gone, and finally update the register and sweep for orphaned accounts left in SSO, firewalls, or scripts. Revoking before exporting strands your data; forgetting the destruction certificate means you can never prove data return and deletion happened."}, {"id": "m25", "type": "slots", "theme": "MON", "pts": 2, "scen": "A new vendor service account request lands in your queue. The IdM ticket shows this configuration:\n\n  identity: vendor.acmedata-support\n    type:          service_account\n    mfa:           disabled\n    owner:         none\n    expires:       never\n    scope:         read+write, all storage buckets", "q": "Sort the five configuration lines before you sign the approval.", "items": [["q1", "mfa: disabled"], ["q2", "owner: none"], ["q3", "expires: never"], ["q4", "type: service_account"], ["q5", "scope: read+write, all storage buckets"]], "groups": [["s_fix", "Blocker — fix before approval"], ["s_ok", "Acceptable as configured"]], "map": {"q1": "s_fix", "q2": "s_fix", "q3": "s_fix", "q4": "s_ok", "q5": "s_fix"}, "hint": "Ownership, authentication, lifetime, and blast radius — one line is a legitimate design choice.", "explain": "'mfa: disabled' kills the second factor exactly where attackers hunt first. 'owner: none' means nobody is accountable when the account misbehaves — every vendor account needs a named internal owner. 'expires: never' creates the standing risk that outlives the contract; vendor accounts must expire with the engagement. 'read+write on ALL buckets' ignores least privilege: scope must be narrowed to the buckets the integration needs. 'type: service_account' is the one legitimate line — service accounts exist for automation. Fix all four blockers in the same change, or reject the ticket."}, {"id": "m26", "type": "choice", "theme": "AGR", "pts": 2, "scen": "Procurement buys 40 to 80 laptops a year, all from the same reseller, with prices renegotiated once annually. Legal is tired of signing an almost identical contract for every small batch.", "q": "Which agreement structure fits this buying pattern?", "opts": [["a", "A Blanket Purchase Agreement (BPA) at pre-agreed prices"], ["b", "A Memorandum of Understanding (MOU) with the reseller"], ["c", "An NDA renewed with each individual delivery"], ["d", "An EOSL clause appended to every invoice"]], "correct": ["a"], "hint": "Many purchases, one negotiation, fixed prices — the acronym literally says it.", "explain": "A Blanket Purchase Agreement is one negotiation that covers many future purchases at pre-agreed prices and terms — ideal for a predictable, repeating buy like laptops. An MOU has no purchase mechanics, an NDA protects secrets rather than prices, and EOSL is an end-of-support concept, not a purchasing instrument. BPAs cut paperwork while keeping one set of negotiated security and delivery terms."}, {"id": "m27", "type": "slots", "theme": "Q", "pts": 2, "scen": "Onboarding FileFlow: the tier-1 evidence pack for the SaaS onboarding gate is being assembled. Six items were proposed by different stakeholders; you decide what belongs in the evidence request before any production data moves.", "q": "Sort the six items into the evidence pack or out of it.", "items": [["e1", "Current SOC 2 Type II report covering the services we will use"], ["e2", "ISO/IEC 27001 certificate with the scope statement attached"], ["e3", "Most recent independent penetration test executive summary"], ["e4", "Completed CAIQ or SIG questionnaire with evidence pointers"], ["e5", "Their three-year product roadmap deck"], ["e6", "Screenshots of their office lobby and data center signage"]], "groups": [["r1", "Request — real evidence of compliance"], ["r2", "Leave out — decoration, not evidence"]], "map": {"e1": "r1", "e2": "r1", "e3": "r1", "e4": "r1", "e5": "r2", "e6": "r2"}, "hint": "Four of the six prove something testable. Two are sales material.", "explain": "The SOC 2 Type II (controls operating over time), the ISO/IEC 27001 certificate with its scope (an ISMS certified for THEIR relevant scope, not yours by assumption), the independent penetration test summary, and a completed CAIQ or SIG with evidence pointers form the core evidence of compliance pack. A roadmap deck is sales material; lobby photos prove nothing about controls. Each requested artifact must be current, in scope, and verifiable — that is what separates an evidence request from a formality."}, {"id": "m28", "type": "slots", "theme": "AGR", "pts": 2, "scen": "Renewal review of the CloudNest SLA. Four clauses sit in the draft. One of them will cause a dispute the first time YOUR tenant breaks while their platform looks green.", "q": "Sort the four clauses: dispute-maker, or standard drafting?", "items": [["cA", "'Uptime 99.9% measured monthly, excluding scheduled maintenance announced 48h ahead'"], ["cB", "'Availability is measured across the vendor's whole platform, not per customer tenant'"], ["cC", "'The vendor decides in its sole discretion whether an incident counts as downtime'"], ["cD", "'RTO and RPO commitments apply only when the vendor declares a disaster'"]], "groups": [["d1", "Will cause disputes — renegotiate"], ["d2", "Standard drafting — acceptable"]], "map": {"cA": "d2", "cB": "d1", "cC": "d1", "cD": "d2"}, "hint": "One clause hides your outage inside someone else's average. Another puts the referee in the other team's shirt.", "explain": "Clause B measures availability platform-wide: your tenant can be down for hours while the global average stays above target, and no credits ever trigger — the metric must reflect what YOU experience (or at least add a tenant-level SLO). Clause C makes the vendor the judge of its own failures, which no measurable SLA should allow; downtime needs an objective definition and evidence. Clauses A and D are standard drafting — A's maintenance exclusion with notice is normal, and D's disaster-declaration trigger is common (though worth negotiating down to customer-declared disasters too)."}, {"id": "m29", "type": "terminal", "theme": "VAS", "pts": 2, "scen": "Final due diligence on FileFlow's portal before signature. You want independent proof of the portal's TLS certificate — its validity window and issuer — straight from the endpoint on the SOC jump host.", "q": "Use an openssl command to retrieve the certificate offered by portal.fileflow.example on port 443. Type the command and press Enter.", "term": {"title": "SOC jump host — bash", "banner": "Outbound 443 allowed to vendor ranges.\nTip: you want the certificate the SERVER presents, printed to your screen.", "ps1": "analyst@soc-jump:~$", "accept": ["openssl\\s+s_client\\s+.*portal\\.fileflow\\.example.*443", "openssl\\s+s_client\\s+.*443.*portal\\.fileflow\\.example", "openssl\\s+s_client\\s+.*portal\\.fileflow\\.example"], "out": "CONNECTED(00000003)\ndepth=2 C=US, O=Internet Security Research Group, CN=ISRG Root X1\n---\nCertificate chain\n subject=CN=portal.fileflow.example\n issuer=C=US, O=Let's Encrypt, CN=R3\n---\nNot before:            Oct  1 09:14:07 2026 GMT\nNot after :            Dec 30 09:14:06 2026 GMT\n---\nVerification: OK", "err": "handshake failed — check the tool name and the target", "example": "openssl s_client -connect portal.fileflow.example:443 -servername portal.fileflow.example"}, "hint": "Family: openssl. The s_client subcommand speaks TLS to a host:port and dumps what the server presents.", "explain": "openssl s_client -connect host:443 completes a TLS handshake and prints the presented certificate — issuer, validity dates, and chain. Reading it yourself beats trusting a website screenshot: you see the actual endpoint answer, the issuer (here Let's Encrypt), and the expiry window (90 days, typical for automated renewal). During vendor due diligence, a certificate chain that fails verification, a mismatched name, or a wildcard cert shared across unrelated services are all worth a follow-up question."}, {"id": "m30", "type": "choice", "theme": "AGR", "pts": 2, "scen": "The benefits provider processes employee data strictly on Meridian's written instructions, using its own systems, for the purposes Meridian defines. A trainee asks who is the controller and who is the processor.", "q": "Which answer is correct?", "opts": [["a", "Meridian is the controller; the provider is the processor"], ["b", "The provider is the controller because it stores the data"], ["c", "Both are processors, because the data belongs to employees"], ["d", "Those roles apply only to customers, never to employee data"]], "correct": ["a"], "hint": "The controller decides WHY and HOW. Storage location decides nothing.", "explain": "The controller determines the purposes and means of processing — that is Meridian, which decides what is processed and why. The provider processes on documented instructions with its own systems, which is the textbook definition of a data processor. Physical storage confers no role, employees' data follows the same rules as customer data, and 'both are processors' is meaningless — someone must decide the purpose. The roles drive the DSA: controllers carry the duty to lawfully choose processors and supervise them; processors carry instructions-only processing plus notification duties."}]};
</script>

var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function derange(correct){
  /* starting layout for ordering exercises: never any item already in its
     correct slot, so an untouched Check can never earn free partial credit */
  var a=shuf(correct), n=a.length, i, t, guard=0, bad=true;
  while(bad && guard<200){
    guard++; bad=false;
    for(i=0;i<n;i++){
      if(a[i]===correct[i]){ var j=(i+1)%n; t=a[i]; a[i]=a[j]; a[j]=t; }
    }
    for(i=0;i<n;i++){ if(a[i]===correct[i]){ bad=true; break; } }
  }
  if(bad){ a=correct.slice(1).concat(correct.slice(0,1)); } /* guaranteed derangement, n>=2 */
  return a;
}
function r1(x){return Math.round(x*100)/100;}
function fmtPts(x){var v=Math.round(x*10)/10;return (v%1===0? String(Math.round(v)) : v.toFixed(1));}
function isMulti(ex){
  if(ex.type==='match'||ex.type==='slots'||ex.type==='order'||ex.type==='fill'||ex.type==='branch') return true;
  if(ex.type==='choice') return ex.correct.length>1;
  if(ex.type==='logview') return ex.ans.correct.length>1;
  return false;
}

/* ---------------- state ---------------- */
var S = {started:false,finished:false,order:[],cur:0,qs:[],manualPause:false,checkPause:false,
         tLeft:0,tick:null,cand:'',scoreSent:false,attempt:0};
window.__exam = S; /* debug/state handle for the host page and tests */
function running(){return S.started && !S.finished && !S.manualPause && !S.checkPause;}

/* ---------------- boot ---------------- */
function boot(){
  buildHeader(); buildIntro(); buildShell();
  $('#btnStart').addEventListener('click', startExam);
  $('#btnPause').addEventListener('click', toggleManualPause);
  window.addEventListener('message', onMsg);
  document.addEventListener('keydown', function(ev){
    if(ev.target && /INPUT|TEXTAREA|SELECT|BUTTON/.test(ev.target.tagName)) return;
    var ae=document.activeElement;
    if(ae && ae!==document.body && !/^(HTML|BODY)$/.test(ae.tagName)) return;
    if(!S.started || S.finished) return;
    if(ev.key==='ArrowLeft' && !$('#btnPrev').disabled){ $('#btnPrev').click(); }
    if(ev.key==='ArrowRight' && !$('#btnNext').disabled){ $('#btnNext').click(); }
  });
}
function onMsg(ev){
  if(!ev.data) return;
  var t = ev.data.type;
  if(t!=='CYBERPULSE_INIT' && t!=='CYBERMASTERY_INIT') return;
  try{ if(location.origin!=='null' && ev.origin!==location.origin) return; }catch(e){}
  if(ev.data.username){ S.cand = String(ev.data.username); var c=$('#candChip'); if(c){c.style.display='';c.textContent='Candidate: '+S.cand;} }
}
