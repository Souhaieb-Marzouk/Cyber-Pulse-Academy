/* ==== Certification exam engine (shared by the MEDIUM and HARD files) ====
   One framework, many exercises: every exercise is an object in EXERCISES and
   supplies its own renderer for the answer area plus its own grading function.

   Timer: two independent pause reasons.
     - manual pause  -> hides/blurs the exercise so it cannot be studied
     - Check-pause   -> content and feedback stay visible ("review mode")
     The clock runs only when neither reason is active. Check-pause ends only on
     "Next". Manual pause ends on the Pause button. They stack.

   Scoring: every exercise is worth its own points. Multi-answer exercises split
   their points evenly across their correct elements, so partial work earns
   partial credit. Skipped exercises leave both numerator and denominator.

   Reporting: one CYBERPULSE_SCORE message, once per attempt, at the moment the
   results screen is shown and after the score animation settles. No batch field. */
"use strict";

var EXAM = (function () {
  var S = {
    phase: "intro",
    order: [],
    idx: 0,
    answers: {},
    locked: {},
    grades: {},
    skipped: {},
    hintUsed: {},
    manualPause: false,
    checkPause: false,
    remaining: 0,
    timerId: null,
    startRemaining: 0,
    reported: false,
    attempt: 0,
    animating: 0,
    lastReport: null
  };

  var META = window.__CM_META__ || {};
  var EX = window.__CM_EXERCISES__ || [];
  function totalSeconds() { return ((META.estimatedMinutes || 60) * 60); }

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined) continue;
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "style") n.setAttribute("style", attrs[k]);
      else if (k === "value") n.value = attrs[k];
      else if (k === "checked") n.checked = !!attrs[k];
      else if (k === "disabled") n.disabled = !!attrs[k];
      else if (k === "type") { n.type = attrs[k]; n.setAttribute("type", attrs[k]); }
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  /* Shorthand for a text-only element. Pass attrs when more than a class is
     needed, since an id cannot be conveyed by the class argument. */
  function t(tag, cls, text) {
    var attrs = cls ? { class: cls } : null;
    return el(tag, attrs, text === undefined ? null : document.createTextNode(text));
  }

  /* ---------------- deterministic shuffle ---------------- */
  function rngFor(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function shuffle(arr, rand) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  var attemptSeed = 20240917;
  function rand() { return rngFor(attemptSeed + S.attempt * 7919)(); }
  function shuffled(arr) { return shuffle(arr, rngFor(attemptSeed + S.attempt * 7919 + arr.length * 13)); }

  /* ---------------- scoring helpers ---------------- */
  function pointsFor(ex) {
    /* A used hint costs 10% of this exercise's points, once. */
    var base = typeof ex.points === "number" ? ex.points : 10;
    return S.hintUsed[ex.id] ? Math.round(base * 0.9 * 100) / 100 : base;
  }

  /* ---------------- grading ----------------
     Every exercise ships a GRADE SPEC as plain data, so it serialises safely and
     the engine owns the marking logic:
       { total, note?,
         singles:  [ { id, answer: "b", label } ]                      1 element each
         sets:     [ { id, correct: ["x","y"], label } ]               1 element each
         pool:     { id, correct: [...], label, order: "free"|"exact" }  N elements each
         rows:     [ { id, correct: "x", label } ]                     1 element each
         exactRows:{ id, order: [ ... ], label }                       N elements each
       }
     `correct` counts ELEMENTS matched correctly (never above total), `missed`
     counts elements the student did not find, `wrong` counts bad picks. */
  function specTotal(spec) {
    if (typeof spec.total === "number") return spec.total;
    var n = 0;
    (spec.singles || []).forEach(function () { n += 1; });
    (spec.sets || []).forEach(function (s) { n += Math.max(1, (s.correct || []).length); });
    if (spec.pool) n += Math.max(1, (spec.pool.correct || []).length);
    (spec.rows || []).forEach(function () { n += 1; });
    (spec.choices || []).forEach(function () { n += 1; });
    if (spec.exactRows) n += Math.max(1, (spec.exactRows.order || []).length);
    (spec.dual || []).forEach(function () { n += 1; });
    return Math.max(1, n);
  }

  function gradeAgainst(spec, ans) {
    ans = ans || {};
    var total = specTotal(spec);
    var correct = 0, wrong = 0, missed = 0;
    var elements = [];
    var detail = {};

    (spec.singles || []).forEach(function (q) {
      var picked = ans[q.id];
      var ok = picked !== undefined && String(picked) === String(q.answer);
      if (ok) correct++; else { wrong++; if (picked === undefined) missed++; }
      detail[q.id] = { picked: picked, status: ok ? "correct" : (picked === undefined ? "missed" : "wrong") };
      elements.push({ label: q.label + " \u2014 you chose: " + (picked === undefined ? "nothing" : String(picked)) + (ok ? " (correct)" : ", correct is: " + q.answer), status: ok ? "correct" : (picked === undefined ? "missed" : "wrong") });
    });

    (spec.sets || []).forEach(function (q) {
      /* The answer may be a list of values in this group, or a map of
         value -> group, depending on which widget produced it. */
      var raw = ans[q.id];
      var picked;
      if (Array.isArray(raw)) picked = raw.map(String);
      else if (raw && typeof raw === "object") picked = Object.keys(raw).filter(function (k) { return String(raw[k]) === String(q.groupId || q.id); }).map(String);
      else picked = [];
      var want = (q.correct || []).map(String);
      picked.forEach(function (p) {
        if (want.indexOf(p) >= 0) { correct++; elements.push({ label: q.label + " \u2014 " + p, status: "correct" }); }
        else { wrong++; elements.push({ label: q.label + " \u2014 " + p + " (not one of the correct picks)", status: "wrong" }); }
      });
      want.forEach(function (w) {
        if (picked.indexOf(w) < 0) { missed++; elements.push({ label: q.label + " \u2014 you missed " + w, status: "missed" }); }
      });
    });

    if (spec.pool) {
      var p = spec.pool;
      var placed = (ans[p.id] || []).map(function (x) { return x === undefined || x === null ? "" : String(x); });
      var want2 = (p.correct || []).map(String);
      for (var i = 0; i < want2.length; i++) {
        var got = placed[i];
        var okp = got !== undefined && got !== "" && got === want2[i];
        if (okp) { correct++; elements.push({ label: p.label + " \u2014 blank " + (i + 1) + " = " + got, status: "correct" }); }
        else if (got === undefined || got === "") { missed++; elements.push({ label: p.label + " \u2014 blank " + (i + 1) + " left empty, correct is " + want2[i], status: "missed" }); }
        else { wrong++; elements.push({ label: p.label + " \u2014 blank " + (i + 1) + " = " + got + ", correct is " + want2[i], status: "wrong" }); }
      }
    }

    (spec.rows || []).forEach(function (q) {
      var picked = ans[q.id];
      var ok = picked !== undefined && String(picked) === String(q.correct);
      if (ok) correct++; else { wrong++; if (picked === undefined) missed++; }
      elements.push({ label: q.label + " \u2014 you chose: " + (picked === undefined ? "nothing" : String(picked)) + (ok ? " (correct)" : ", correct is: " + q.correct), status: ok ? "correct" : (picked === undefined ? "missed" : "wrong") });
    });

    /* choices: one decision per line, where the correct decision can be to leave
       the line alone. This is how "spot the mistake" and log triage are scored. */
    (spec.choices || []).forEach(function (q) {
      var flagged = !!(ans[q.id]);
      var shouldFlag = String(q.answer) === "flag";
      var ok = flagged === shouldFlag;
      if (ok) correct++;
      else missed++;
      var chosen = flagged ? "you flagged it" : "you left it alone";
      var should = shouldFlag ? "it is a real problem" : "it is fine as written";
      elements.push({
        label: q.label + " \u2014 " + chosen + (ok ? " (correct)" : ", but " + should) + (q.why ? " (" + q.why + ")" : ""),
        status: ok ? "correct" : "missed"
      });
    });

    if (spec.exactRows) {
      /* Ordering is graded by POSITION, not by set membership: a sequence that
         contains the right items in the wrong places is not partly right. */
      var e = spec.exactRows;
      var order = (ans[e.id] || []);
      var misplaced = [];
      if (spec.exactRows.items) {
        var want0 = spec.exactRows.items.map(String);
        var have = order.map(String);
        for (var q = 0; q < want0.length; q++) {
          if (have.indexOf(want0[q]) < 0) misplaced.push(want0[q]);
        }
      }
      for (var j = 0; j < e.order.length; j++) {
        var at = order[j];
        var ok2 = at !== undefined && at !== null && String(at) === String(e.order[j]);
        if (ok2) correct++;
        else if (at === undefined || at === null) missed++;
        else wrong++;
        elements.push({
          label: e.label + " " + (j + 1) + ": " + (at === undefined || at === null ? "empty" : at) +
            (ok2 ? " (correct for this position)" : ", the correct entry here is " + e.order[j]),
          status: ok2 ? "correct" : (at === undefined || at === null ? "missed" : "wrong")
        });
      }
      if (misplaced.length) {
        elements.push({ label: "Not in the sequence at all: " + misplaced.join(", "), status: "missed" });
      }
    }

    (spec.dual || []).forEach(function (q) {
      var picked = ans[q.id];
      var ok = picked !== undefined && String(picked) === String(q.answer);
      if (ok) correct++; else { wrong++; if (picked === undefined) missed++; }
      elements.push({ label: q.label + " \u2014 you chose: " + (picked === undefined ? "nothing" : String(picked)) + (ok ? " (correct)" : ", correct is: " + q.answer), status: ok ? "correct" : (picked === undefined ? "missed" : "wrong") });
    });

    /* terminals accept a validator result supplied by the renderer */
    if (spec.terminal) {
      /* A terminal command is single-answer: all or nothing. The widget already
         decided whether the command is correct, so use its verdict directly. */
      var res = ans.__terminal || null;
      var verdict = res && res.status ? res.status : "missed";
      if (verdict === "correct") correct++;
      else missed++;
      elements.push({
        label: spec.terminal.label + " \u2014 " + (res && res.label ? res.label : "nothing was run"),
        status: verdict === "correct" ? "correct" : "missed"
      });
    }

    if (correct > total) correct = total;
    return {
      correct: correct, total: total, wrong: wrong, missed: missed,
      elements: elements, note: spec.note || "", detail: detail
    };
  }

  /* Grade one exercise from its stored answer. Returns
     { level, earned, max, elements:[{label, status}], note } */
  function elementAnswer(ex, ans) {
    /* Each widget stores the answer in the shape that suits its own UI. The
       grader works from one decision per element, so normalise here. */
    if (!ans) return ans;
    if (ex.type === "classify") {
      /* placed: { itemValue: bucketId }  ->  { "b:<bucket>": [itemValue, ...] } */
      var out = {};
      Object.keys(ans.placed || {}).forEach(function (value) {
        var key = "b:" + ans.placed[value];
        (out[key] = out[key] || []).push(value);
      });
      return out;
    }
    if (ex.type === "match") {
      /* picks: { pairId: optionValue }  ->  { pairId: optionValue } (same shape) */
      return ans.picks || {};
    }
    if (ex.type === "fill") {
      return { slots: ans.slots || [] };
    }
    if (ex.type === "terminal") {
      return { __terminal: ans.result || null };
    }
    if (ex.type === "mcq") {
      /* Multi-select stores a list of picks; single-select stores one value.
         The grader reads the key that matches the exercise's grade spec. */
      if (Array.isArray(ans.picks)) return { picks: ans.picks };
      return { pick: ans.picked };
    }
    if (ex.type === "dual") {
      return ans.picks || {};
    }
    if (ex.type === "pitfall" || ex.type === "logview") {
      var prefix = ex.type === "pitfall" ? "l" : "ll";
      var map = {};
      var picks = (ans.picks) || [];
      picks.forEach(function (i) { map[prefix + i] = true; });
      return map;
    }
    if (ex.type === "order") {
      return { order: ans.order || [] };
    }
    return ans;
  }

  function gradeOne(ex) {
    var ans = elementAnswer(ex, S.answers[ex.id]);
    var max = pointsFor(ex);
    var g = gradeAgainst(ex.gradeSpec || { total: 1 }, ans);
    var total = Math.max(1, g.total || 1);
    var correct = Math.max(0, Math.min(total, g.correct || 0));
    var earned = Math.round((max * (correct / total)) * 100) / 100;
    var level = correct === 0 ? "zero" : (correct >= total ? "full" : "partial");
    return {
      level: level,
      earned: earned,
      max: max,
      baseMax: typeof ex.points === "number" ? ex.points : 10,
      correctCount: correct,
      totalCount: total,
      elements: g.elements || [],
      note: g.note || ""
    };
  }

  /* ---------------- timer ---------------- */
  function timerRunning() { return !S.manualPause && !S.checkPause && S.phase === "exam"; }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function tick() {
    if (!timerRunning()) return;
    S.remaining--;
    paintTimer();
    if (S.remaining <= 0) finish("time");
  }

  function startClock() {
    if (S.timerId) return;
    S.remaining = S.startRemaining;
    S.timerId = setInterval(tick, 1000);
  }

  function paintTimer() {
    var node = $("#timerStat");
    if (node) {
      node.textContent = "Time left " + fmt(S.remaining);
      if (S.remaining <= 120) node.className = "stat timer low"; else node.className = "stat timer";
    }
    var ind = $("#pauseIndicator");
    if (!ind) return;
    var reasons = [];
    if (S.manualPause) reasons.push("Paused (manual)");
    if (S.checkPause) reasons.push("Timer paused \u2014 review mode");
    if (reasons.length) {
      ind.className = "on";
      ind.innerHTML = '<span aria-hidden="true">\u23F8\uFE0F</span><span>' + reasons.join(" + ") +
        "</span><span class=\"small\">The clock is frozen.</span>";
    } else {
      ind.className = "";
      ind.innerHTML = "";
    }
  }

  /* ---------------- score ---------------- */
  function currentScore() {
    var earned = 0, max = 0;
    S.order.forEach(function (id) {
      var ex = byId(id);
      if (S.skipped[id]) return;
      var g = S.grades[id];
      max += pointsFor(ex);
      if (g) earned += g.earned;
    });
    return { earned: Math.round(earned * 100) / 100, max: Math.round(max * 100) / 100 };
  }

  function byId(id) { for (var i = 0; i < EX.length; i++) if (EX[i].id === id) return EX[i]; return null; }

  function paintScore() {
    var sc = currentScore();
    var node = $("#scoreStat");
    if (node) {
      var full = fullExamPoints();
      var pct = full > 0 ? Math.round((sc.earned / full) * 100) : 0;
      node.textContent = "Score " + round1(sc.earned) + " / " + round1(full) + " possible (" + pct + "%)";
      node.setAttribute("title", "Points earned so far, out of every exercise in this attempt. Skipped exercises still leave the exam and are dropped from the final score.");
    }
  }
  /* Total value of the whole attempt, so the live counter always has a stable
     denominator instead of growing as exercises are checked. */
  function fullExamPoints() {
    var total = 0;
    S.order.forEach(function (id) { total += pointsFor(byId(id)); });
    return Math.round(total * 100) / 100;
  }
  function round1(n) { return Math.round(n * 10) / 10; }

  /* ---------------- progress + navigator ---------------- */
  function paintProgress() {
    var answered = 0, marked = 0;
    S.order.forEach(function (id) {
      var g = S.grades[id];
      if (g) { answered++; if (g.level === "full") marked++; }
      else if (S.skipped[id]) marked++;
    });
    var pct = S.order.length ? Math.round((answered / S.order.length) * 100) : 0;
    var fill = $("#progressFill");
    if (fill) fill.style.width = pct + "%";
    var txt = $("#progressText");
    if (txt) {
      txt.textContent = "Question " + (S.idx + 1) + " of " + S.order.length +
        " \u2014 " + answered + " checked, " + (S.order.length - answered) + " to go" +
        (countSkipped() ? ", " + countSkipped() + " skipped" : "");
    }
    var nav = $("#navBar");
    if (!nav) return;
    nav.innerHTML = "";
    S.order.forEach(function (id, i) {
      var g = S.grades[id];
      var state = S.skipped[id] ? "skipped" : (g ? (g.level === "full" ? "correct" : (g.level === "partial" ? "partial" : "wrong")) : "todo");
      var icon = state === "correct" ? "\u2714" : state === "partial" ? "\u25D1" : state === "wrong" ? "\u2716" : state === "skipped" ? "\u21B7" : "";
      var b = el("button", {
        class: "navdot", type: "button", "data-state": state, "data-current": i === S.idx ? "1" : "0",
        title: "Question " + (i + 1) + " \u2014 " + stateLabel(state),
        "aria-label": "Go to question " + (i + 1) + ", " + stateLabel(state)
      }, document.createTextNode(icon ? icon + " " + (i + 1) : String(i + 1)));
      b.addEventListener("click", function () { goTo(i); });
      nav.appendChild(b);
    });
  }
  function stateLabel(s) {
    return s === "correct" ? "correct" : s === "partial" ? "partly correct" : s === "wrong" ? "wrong" :
      s === "skipped" ? "skipped, not counted" : "not answered yet";
  }
  function countSkipped() { var n = 0; S.order.forEach(function (id) { if (S.skipped[id]) n++; }); return n; }

  /* ---------------- views ---------------- */
  function clearApp() {
    var app = $("#app");
    app.innerHTML = "";
    app.__hudMoved = false;
    return app;
  }

  function keywordsPanel() {
    var wrap = t("div", "panel");
    wrap.appendChild(t("h2", null, "Keywords covered by this exam"));
    wrap.appendChild(t("p", "small muted", "Every keyword below is exercised somewhere in this file. Some exercises cover several keywords at once."));
    var grid = t("div", "keywordgrid");
    (window.__CM_THEMES__ || []).forEach(function (th) {
      var card = t("div", "keywordcard");
      card.appendChild(t("h3", null, th.theme));
      var ul = t("ul", "kwlist");
      th.keywords.forEach(function (k) { ul.appendChild(t("li", null, k.label)); });
      card.appendChild(ul);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function introScreen() {
    var app = clearApp();
    var head = t("div", "panel");
    head.appendChild(t("h1", null, META.title || "Practice exam"));
    var meta = t("div", "row");
    meta.appendChild(t("span", "pill info", (META.difficulty || "medium").toUpperCase() + " difficulty"));
    meta.appendChild(t("span", "pill", EX.length + " exercises"));
    meta.appendChild(t("span", "pill", Math.round(totalSeconds() / 60) + " minutes"));
    meta.appendChild(t("span", "pill ok", "Pass mark " + (META.passMark || 70) + "%"));
    meta.appendChild(t("span", "pill", "Topic " + (META.topicId || "")));
    head.appendChild(meta);
    head.appendChild(t("p", null, "This is a full practice exam for this chapter. It works like a real certification attempt: you get one clock, you can move between exercises, and your score builds up as you check each answer."));
    app.appendChild(head);

    var how = t("div", "panel");
    how.appendChild(t("h2", null, "How this exam works"));
    var ul = t("ul", "rulelist");
    [
      "Pass mark: " + (META.passMark || 70) + "%. Your score is shown live in the bar at the top.",
      "Each exercise has a Check button. Check marks your answer, locks it for scoring, and shows the explanation.",
      "Pressing Check also freezes the clock (review mode). The exercise and the explanation stay fully visible. The clock restarts only when you press Next.",
      "The manual Pause button is different: it blurs and hides the exercise so you cannot study it while paused, and it freezes the clock. The two pauses stack.",
      "Every exercise also has a Skip button. A skipped exercise is marked amber in the question map and is NOT counted in your score. You can come back to it any time before the clock ends.",
      "When the clock ends, or when you submit, skipped exercises leave both the points you earned and the points available.",
      "Multi-answer exercises (multi-select, drag and drop, matching, ordering, several accepted commands) give partial credit: each correct element earns its share of the points. A wrong pick earns nothing but costs you nothing either.",
      "A hint costs 10% of that exercise's points. It gives you a nudge, never the answer. A hint never freezes the clock by itself.",
      "At the end you get a full report: your answer, the correct answer, the points earned, and what to study next."
    ].forEach(function (s) { ul.appendChild(t("li", null, s)); });
    how.appendChild(ul);
    how.appendChild(t("p", "small muted", "Tip: everything here is keyboard reachable. Use Tab to move, Space or Enter to choose, and the up and down buttons to reorder."));
    app.appendChild(how);

    app.appendChild(keywordsPanel());

    var start = t("div", "panel center");
    var b = el("button", { class: "btn-primary", type: "button", id: "startBtn" }, document.createTextNode("Start the exam"));
    b.addEventListener("click", function () { startExam(); });
    start.appendChild(b);
    start.appendChild(t("p", "small muted", "The clock starts as soon as you press this button."));
    app.appendChild(start);
    b.focus();
  }

  /* ---------------- exam screen ---------------- */
  function examShell() {
    var app = clearApp();
    var hud = t("div", null);
    hud.id = "hud";
    hud.appendChild(el("div", { id: "hudTop" }, [
      el("div", { id: "hudTitle" }, [
        document.createTextNode((META.title || "Practice exam") + " "),
        el("span", { class: "small muted", id: "whoami" }, document.createTextNode(window.__CM_INIT && window.__CM_INIT.username ? window.__CM_INIT.username : ""))
      ]),
      el("div", { id: "hudStats" })
    ]));
    hud.appendChild(el("div", { id: "progressWrap" }, [
      el("div", { id: "progressBar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": "0" }, [
        el("div", { id: "progressFill" })
      ]),
      el("div", { id: "progressText" })
    ]));
    hud.appendChild(el("div", { id: "pauseIndicator", role: "status", "aria-live": "polite" }));
    hud.appendChild(el("div", { id: "navBar", role: "group", "aria-label": "Question map" }));
    /* Attach the header first, then build the controls inside it. Elements only
       become findable by id once they are in the document tree, so anything the
       engine looks up later must be created after this point. */
    app.appendChild(hud);

    var stats = $("#hudStats");
    var timer = el("span", { class: "stat timer", id: "timerStat", role: "timer", "aria-live": "off" }, document.createTextNode("Time left --:--"));
    var score = el("span", { class: "stat score", id: "scoreStat" }, document.createTextNode("Score 0 / 0 possible"));
    stats.appendChild(timer);
    stats.appendChild(score);
    var pauseBtn = el("button", { class: "btn-warn btn-sm", type: "button", id: "pauseBtn", "aria-pressed": "false" }, document.createTextNode("Pause"));
    pauseBtn.addEventListener("click", toggleManualPause);
    stats.appendChild(pauseBtn);

    var stage = el("div", { id: "stage" });
    app.appendChild(stage);
    return stage;
  }

  function toggleManualPause() {
    S.manualPause = !S.manualPause;
    var btn = $("#pauseBtn");
    if (btn) {
      btn.textContent = S.manualPause ? "Resume" : "Pause";
      btn.setAttribute("aria-pressed", S.manualPause ? "true" : "false");
      btn.className = S.manualPause ? "btn-ok btn-sm" : "btn-warn btn-sm";
    }
    applyManualBlur();
    paintTimer();
  }

  function applyManualBlur() {
    var stage = $("#stage");
    if (!stage) return;
    var veil = $("#veil");
    if (S.manualPause) {
      stage.setAttribute("data-blurred", "1");
      stage.style.filter = "blur(9px)";
      stage.style.pointerEvents = "none";
      stage.setAttribute("aria-hidden", "false");
      if (!veil) {
        veil = el("div", { id: "veil", class: "panel center" });
        veil.appendChild(t("h2", null, "\u23F8 Manual pause"));
        veil.appendChild(t("p", null, "The exercise is hidden while the clock is paused. Press Resume to bring it back."));
        var rb = el("button", { class: "btn-ok", type: "button" }, document.createTextNode("Resume"));
        rb.addEventListener("click", toggleManualPause);
        veil.appendChild(rb);
        var hud = $("#hud");
        hud.parentNode.insertBefore(veil, hud.nextSibling);
      }
    } else {
      stage.removeAttribute("data-blurred");
      stage.style.filter = "";
      stage.style.pointerEvents = "";
      if (veil && veil.parentNode) veil.parentNode.removeChild(veil);
    }
  }

  function currentEx() { return byId(S.order[S.idx]); }

  function render() {
    /* Once the attempt is over the results screen owns the page: rendering an
       exercise now would wipe the report the student is reading. */
    if (S.phase !== "exam") return;
    var app = $("#app");
    /* The header only needs building once per attempt. Rebuilding it would
       replace the Pause button while the student is using it, so the clock
       controls are created once and only the exercise area is refreshed. */
    if (!app.querySelector("#hud")) {
      examShell();
    }
    var stage = $("#stage");
    if (!stage) return;
    var ex = currentEx();
    stage.innerHTML = "";
    var card = el("div", { class: "panel", id: "qcard" });
    card.setAttribute("data-ex", ex.id);
    card.setAttribute("data-type", ex.type);

    card.appendChild(el("div", { class: "row" }, [
      el("span", { class: "pill info" }, document.createTextNode(ex.typeLabel || ex.type)),
      el("span", { class: "pill" }, document.createTextNode(ex.theme || "Architecture")),
      el("span", { class: "pill" }, document.createTextNode("Worth " + (typeof ex.points === "number" ? ex.points : 10) + " pts"))
    ]));

    /* --- SCENARIO block --- */
    if (ex.scenario) {
      var sb = el("div", { class: "blk-scenario" });
      sb.appendChild(el("div", { class: "blocklabel" }, document.createTextNode("\u25A3 Scenario")));
      (Array.isArray(ex.scenario) ? ex.scenario : [ex.scenario]).forEach(function (p) {
        sb.appendChild(t("p", null, p));
      });
      if (ex.facts) {
        var ul = t("ul", "scenario-facts");
        ex.facts.forEach(function (f) { ul.appendChild(t("li", null, f)); });
        sb.appendChild(ul);
      }
      if (ex.artefact) {
        sb.appendChild(el("div", { class: "artefact", role: "region", "aria-label": "Evidence" }, document.createTextNode(ex.artefact)));
      }
      card.appendChild(sb);
    }

    /* --- QUESTION block --- */
    var qb = el("div", { class: "blk-question" });
    qb.appendChild(el("div", { class: "blocklabel" }, document.createTextNode("\u2753 Question")));
    qb.appendChild(t("h2", null, ex.question));
    if (ex.questionNote) qb.appendChild(t("p", "small", ex.questionNote));
    card.appendChild(qb);

    /* --- ANSWER block --- */
    var ab = el("div", { class: "blk-answer" });
    ab.appendChild(el("div", { class: "blocklabel" }, document.createTextNode("\u270E Your answer")));
    var body = el("div", { id: "answerBody" });
    ab.appendChild(body);
    card.appendChild(ab);

    /* controls */
    var ctr = el("div", { class: "row", id: "controls", style: "margin-top:14px" });
    var checkBtn = el("button", { class: "btn-primary", type: "button", id: "checkBtn" }, document.createTextNode("Check"));
    checkBtn.addEventListener("click", onCheck);
    var skipBtn = el("button", { class: "btn-warn", type: "button", id: "skipBtn" }, document.createTextNode("Skip"));
    skipBtn.addEventListener("click", onSkip);
    var hintBtn = el("button", { class: "btn-ghost", type: "button", id: "hintBtn" }, document.createTextNode("Hint (costs 10%)"));
    hintBtn.addEventListener("click", onHint);
    var prevBtn = el("button", { class: "btn-ghost", type: "button", id: "prevBtn" }, document.createTextNode("\u2190 Previous"));
    prevBtn.addEventListener("click", function () { goTo(S.idx - 1); });
    var nextBtn = el("button", { class: "btn-ok", type: "button", id: "nextBtn" }, document.createTextNode("Next \u2192"));
    nextBtn.addEventListener("click", onNext);
    var submitBtn = el("button", { class: "btn-warn", type: "button", id: "submitBtn" }, document.createTextNode("Finish exam"));
    submitBtn.addEventListener("click", function () { guardedFinish("submit"); });
    ctr.appendChild(checkBtn);
    ctr.appendChild(skipBtn);
    ctr.appendChild(hintBtn);
    ctr.appendChild(prevBtn);
    ctr.appendChild(nextBtn);
    ctr.appendChild(submitBtn);
    card.appendChild(ctr);
    card.appendChild(el("p", { class: "small muted", id: "ctrlNote" }));

    var fb = el("div", { id: "feedbackWrap" });
    card.appendChild(fb);

    stage.appendChild(card);

    /* hydrate the exercise's answer area */
    var ctx = {
      ex: ex,
      body: body,
      card: card,
      answer: S.answers[ex.id],
      set: function (a) { S.answers[ex.id] = a; S.answers[ex.id] = a; return a; },
      get: function () { return S.answers[ex.id]; },
      locked: !!S.locked[ex.id],
      paintAnswerLocks: function (marks) { paintAnswer(ex, body, marks); }
    };
    WIDGETS.render(ex.type, body, ctx, { shuffled: shuffled, el: el, t: t });
    if (S.grades[ex.id]) paintAnswer(ex, body, true);
    if (S.locked[ex.id]) {
      checkBtn.disabled = true;
      checkBtn.textContent = "Checked";
      var rev = el("button", { class: "btn-primary", type: "button", id: "reviseBtn" }, document.createTextNode("Revise"));
      rev.addEventListener("click", onRevise);
      $("#controls").insertBefore(rev, checkBtn.nextSibling);
      if (ex.hint) hintBtn.disabled = true;
    }
    prevBtn.disabled = S.idx === 0;
    nextBtn.disabled = S.idx >= S.order.length - 1;
    if (S.skipped[ex.id]) {
      $("#ctrlNote").textContent = "This exercise is marked as skipped. It will not count in your score unless you check it.";
    }
    if (S.grades[ex.id]) showFeedback(true);
    paintHud();
  }

  function paintAnswer(ex, body, marks) {
    WIDGETS.paint(ex.type, body, marks, { ex: ex, body: body, get: function () { return S.answers[ex.id]; } });
  }

  function paintHud() { paintProgress(); paintScore(); paintTimer(); }

  /* ---------------- Check ---------------- */
  function onCheck() {
    var ex = currentEx();
    if (S.locked[ex.id]) return;
    S.skipped[ex.id] = false;
    S.grades[ex.id] = gradeOne(ex);
    S.locked[ex.id] = true;
    S.checkPause = true;
    paintHud();
    render();
    var fb = $("#feedbackWrap");
    if (fb) {
      var focusTarget = $("#nextBtn") || fb;
      if (focusTarget) focusTarget.focus();
    }
  }

  function onRevise() {
    var ex = currentEx();
    S.locked[ex.id] = false;
    delete S.grades[ex.id];
    S.checkPause = false;
    paintHud();
    render();
  }

  function showFeedback(fromCheck) {
    var ex = currentEx();
    var wrap = $("#feedbackWrap");
    if (!wrap) return;
    var g = S.grades[ex.id];
    wrap.innerHTML = "";
    if (!g) return;
    var icons = { full: "\u2714", partial: "\u25D1", zero: "\u2716", skipped: "\u21B7" };
    var words = { full: "Correct", partial: "Partly correct", zero: "Not correct", skipped: "Skipped" };
    var fb = el("div", { class: "feedback", "data-level": g.level, role: "status", "aria-live": "polite" });
    var head = el("div", { class: "fbhead" }, [
      el("span", { class: "fbicon", "aria-hidden": "true" }, document.createTextNode(icons[g.level])),
      el("span", null, document.createTextNode(words[g.level])),
      el("span", { class: "pill " + (g.level === "full" ? "ok" : g.level === "partial" ? "warn" : "bad") },
        document.createTextNode("You earned " + round1(g.earned) + " / " + round1(g.max) + " points"))
    ]);
    fb.appendChild(head);
    if (g.totalCount > 1) {
      fb.appendChild(t("p", "small", "This exercise has " + g.totalCount + " correct elements. You matched " + g.correctCount + " of them, so the points are shared."));
    }
    if (g.note) fb.appendChild(t("p", null, g.note));
    if (g.elements && g.elements.length) {
      var ul = el("ul", { class: "elementlist" });
      g.elements.forEach(function (e2) {
        var st = e2.status;
        var mark = st === "correct" ? "\u2714" : st === "missed" ? "\u25D1" : "\u2716";
        var word = st === "correct" ? "correct" : st === "missed" ? "missed" : "wrong";
        ul.appendChild(el("li", null, [
          el("span", { class: "elmark " + st, "aria-hidden": "true" }, document.createTextNode(mark + " ")),
          el("span", { class: "sr" }, document.createTextNode(word + ": ")),
          el("span", null, document.createTextNode(e2.label))
        ]));
      });
      fb.appendChild(ul);
    }
    var exp = el("div", { class: "explain" });
    exp.appendChild(t("h4", null, "Why"));
    (Array.isArray(ex.explain) ? ex.explain : [ex.explain]).forEach(function (p) {
      if (p) exp.appendChild(t("p", null, p));
    });
    if (ex.study && ex.study.length) {
      exp.appendChild(t("h4", null, "What to study"));
      var sl = t("ul", null);
      ex.study.forEach(function (s) { sl.appendChild(t("li", null, s)); });
      exp.appendChild(sl);
    }
    if (ex.keywords && ex.keywords.length) {
      exp.appendChild(t("p", "small muted", "Keywords in this exercise: " + ex.keywords.join(", ")));
    }
    fb.appendChild(exp);
    if (S.checkPause) {
      fb.appendChild(t("p", "small", "\u23F8 The clock is frozen while you read this. Press Next to continue and restart the clock."));
    }
    wrap.appendChild(fb);
  }

  /* ---------------- Skip ---------------- */
  function onSkip() {
    var ex = currentEx();
    if (!S.locked[ex.id]) {
      S.skipped[ex.id] = true;
      delete S.grades[ex.id];
    }
    paintHud();
    if (S.idx < S.order.length - 1) goTo(S.idx + 1, true);
    else render();
  }

  /* ---------------- Hint ---------------- */
  function onHint() {
    var ex = currentEx();
    if (S.locked[ex.id]) return;
    var first = !S.hintUsed[ex.id];
    S.hintUsed[ex.id] = true;
    var wrap = $("#feedbackWrap");
    wrap.innerHTML = "";
    var fb = el("div", { class: "feedback", "data-level": "info", role: "status", "aria-live": "polite" });
    fb.appendChild(el("div", { class: "fbhead" }, [
      el("span", { class: "fbicon", "aria-hidden": "true" }, document.createTextNode("\u2139")),
      el("span", null, document.createTextNode(first ? "Hint used \u2014 this exercise is now worth 10% less" : "Hint"))
    ]));
    fb.appendChild(t("p", null, ex.hint));
    fb.appendChild(t("p", "small muted", "A hint does not freeze the clock. Press Check when you are ready to lock your answer."));
    wrap.appendChild(fb);
    if (first) { paintScore(); }
  }

  /* ---------------- navigation ---------------- */
  function onNext() {
    if (S.idx >= S.order.length - 1) { S.checkPause = false; render(); return; }
    /* Pressing Next is the specified way to leave review mode. */
    S.checkPause = false;
    S.idx = S.idx + 1;
    render();
    var card = $("#qcard");
    if (card && card.focus) card.focus();
  }

  /* Moving with the question map or Previous ends review mode too: the student
     has chosen to work on another exercise, so the clock starts again. Review
     mode is re-armed whenever Check is pressed again. */
  function goTo(i, fromSkip) {
    if (i < 0 || i >= S.order.length) return;
    if (i !== S.idx) S.checkPause = false;
    S.idx = i;
    render();
    var card = $("#qcard");
    if (card && card.focus) card.focus();
    var stage = $("#stage");
    if (stage && stage.scrollIntoView) stage.scrollIntoView();
  }

  /* ---------------- finish + results ---------------- */
  function finish(reason) {
    if (S.phase === "done") return;
    S.phase = "done";
    S.checkPause = false;
    S.manualPause = false;
    if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
    results(reason);
  }

  function results(reason) {
    var app = clearApp();
    var scored = S.order.filter(function (id) { return !S.skipped[id]; });
    var skippedIds = S.order.filter(function (id) { return S.skipped[id]; });
    var earned = 0, max = 0;
    scored.forEach(function (id) {
      var g = S.grades[id];
      if (g) earned += g.earned;
      max += pointsFor(byId(id));
    });
    var earnedR = Math.round(earned * 100) / 100;
    var maxR = Math.round(max * 100) / 100;
    var pct = maxR > 0 ? Math.round((earnedR / maxR) * 100) : 0;
    var passed = pct >= (META.passMark || 70);

    var head = t("div", "panel");
    head.appendChild(t("h1", null, "Exam results"));
    head.appendChild(t("p", "muted", (reason === "time" ? "The clock ran out. " : "") + "Difficulty: " + String(META.difficulty || "").toUpperCase()));

    var scoreRow = t("div", "row");
    var scoreNum = el("div", { class: "bigscore", id: "finalScore", role: "status", "aria-live": "polite" }, document.createTextNode("0%"));
    scoreRow.appendChild(scoreNum);
    var detail = t("div", null);
    detail.appendChild(t("p", null, "You earned " + earnedR + " of " + maxR + " available points."));
    detail.appendChild(t("p", null, "Pass mark is " + (META.passMark || 70) + "%. You scored " + pct + "%."));
    var outcome = el("span", { class: "pill " + (passed ? "ok" : "bad") }, document.createTextNode(passed ? "\u2714 PASS" : "\u2716 NOT PASSED"));
    detail.appendChild(outcome);
    scoreRow.appendChild(detail);
    head.appendChild(scoreRow);
    head.appendChild(t("p", "small muted", "Skipped exercises are left out of both the points you earned and the points available, exactly as the score above shows."));
    app.appendChild(head);

    /* topic progress */
    var tp = t("div", "panel");
    tp.appendChild(t("h2", null, "Where you stand by theme"));
    var tbl = t("div", "topicbar");
    var byTheme = {};
    S.order.forEach(function (id) {
      var ex = byId(id);
      var key = ex.theme || "Other";
      if (!byTheme[key]) byTheme[key] = { earned: 0, max: 0 };
      if (S.skipped[id]) return;
      var g = S.grades[id];
      byTheme[key].max += pointsFor(ex);
      if (g) byTheme[key].earned += g.earned;
    });
    Object.keys(byTheme).forEach(function (k) {
      var d = byTheme[k];
      var p = d.max > 0 ? Math.round((d.earned / d.max) * 100) : 0;
      var row = t("div", "topicrow");
      row.appendChild(t("div", "tname", k + " \u2014 " + p + "%"));
      var bar = t("div", "minibar");
      var fill = t("div", "minifill");
      fill.style.width = p + "%";
      bar.appendChild(fill);
      row.appendChild(bar);
      tbl.appendChild(row);
    });
    tp.appendChild(tbl);
    app.appendChild(tp);

    /* skipped list */
    var sk = t("div", "panel");
    sk.appendChild(t("h2", null, "Skipped exercises (not counted)"));
    if (!skippedIds.length) {
      sk.appendChild(t("p", null, "You did not skip any exercise."));
    } else {
      sk.appendChild(t("p", null, "These exercises were skipped, so they were removed from the score above. The correct answer and the explanation are still below so you can learn from them."));
      var skl = t("ul", null);
      skippedIds.forEach(function (id) {
        var ex = byId(id);
        skl.appendChild(t("li", null, "Question " + (S.order.indexOf(id) + 1) + ": " + ex.question));
      });
      sk.appendChild(skl);
    }
    app.appendChild(sk);

    /* per exercise report */
    var rep = t("div", "panel");
    rep.appendChild(t("h2", null, "Report for every exercise"));
    var wrapTbl = t("div", "tblwrap");
    var table = el("table", { class: "report" });
    var thead = el("thead", null, el("tr", null, [
      el("th", { scope: "col" }, document.createTextNode("#")),
      el("th", { scope: "col" }, document.createTextNode("Result")),
      el("th", { scope: "col" }, document.createTextNode("Points")),
      el("th", { scope: "col" }, document.createTextNode("Your answer")),
      el("th", { scope: "col" }, document.createTextNode("Correct answer"))
    ]));
    table.appendChild(thead);
    var tbody = el("tbody");
    S.order.forEach(function (id, i) {
      var ex = byId(id);
      var g = S.grades[id];
      var level = S.skipped[id] ? "skipped" : (g ? g.level : "zero");
      var pts = S.skipped[id] ? "not counted" : ((g ? round1(g.earned) : 0) + " / " + round1(pointsFor(ex)));
      var tr = el("tr", { "data-level": level });
      tr.appendChild(el("td", null, document.createTextNode(String(i + 1))));
      tr.appendChild(el("td", null, document.createTextNode(S.skipped[id] ? "skipped" : (g ? g.level : "not checked"))));
      tr.appendChild(el("td", null, document.createTextNode(pts)));
      tr.appendChild(el("td", null, document.createTextNode(S.skipped[id] ? "\u2014" : answerSummary(ex))));
      tr.appendChild(el("td", null, document.createTextNode(correctSummary(ex))));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrapTbl.appendChild(table);
    rep.appendChild(wrapTbl);
    app.appendChild(rep);

    /* detailed review */
    var rev = t("div", "panel");
    rev.appendChild(t("h2", null, "Detailed review"));
    rev.appendChild(t("p", "small muted", "Open any exercise to see the scenario, your answer, the correct answer and the full explanation."));
    S.order.forEach(function (id, i) {
      var ex = byId(id);
      var g = S.grades[id];
      var level = S.skipped[id] ? "skipped" : (g ? g.level : "zero");
      var card = el("div", { class: "reviewcard", "data-level": level, "data-ex": ex.id });
      var title = "Q" + (i + 1) + " \u2014 " + stateLabel(level === "full" ? "correct" : level === "partial" ? "partial" : level === "skipped" ? "skipped" : "wrong") +
        " \u2014 " + (S.skipped[id] ? "not counted" : (g ? round1(g.earned) + "/" + round1(pointsFor(ex)) + " pts" : "0 pts")) +
        " \u2014 " + ex.question;
      var det = el("details");
      var sum = el("summary", null, document.createTextNode(title));
      det.appendChild(sum);
      var inner = el("div", { style: "padding-top:8px" });
      if (ex.scenario) {
        var sb = el("div", { class: "blk-scenario" });
        sb.appendChild(el("div", { class: "blocklabel" }, document.createTextNode("\u25A3 Scenario")));
        (Array.isArray(ex.scenario) ? ex.scenario : [ex.scenario]).forEach(function (p) { sb.appendChild(t("p", null, p)); });
        if (ex.artefact) sb.appendChild(el("div", { class: "artefact" }, document.createTextNode(ex.artefact)));
        inner.appendChild(sb);
      }
      var qb = el("div", { class: "blk-question" });
      qb.appendChild(el("div", { class: "blocklabel" }, document.createTextNode("\u2753 Question")));
      qb.appendChild(t("p", null, ex.question));
      inner.appendChild(qb);
      var ab = el("div", { class: "blk-answer" });
      ab.appendChild(el("div", { class: "blocklabel" }, document.createTextNode("\u270E Answer")));
      ab.appendChild(t("p", null, "Your answer: " + (S.skipped[id] ? "skipped (not counted)" : answerSummary(ex))));
      ab.appendChild(t("p", null, "Correct answer: " + correctSummary(ex)));
      inner.appendChild(ab);
      if (g) {
        var fb = el("div", { class: "feedback", "data-level": g.level });
        fb.appendChild(el("div", { class: "fbhead" }, document.createTextNode("You earned " + round1(g.earned) + " / " + round1(g.max) + " points (" + (g.correctCount || 0) + "/" + (g.totalCount || 1) + " elements correct)")));
        if (g.elements && g.elements.length) {
          var ul = el("ul", { class: "elementlist" });
          g.elements.forEach(function (e2) {
            var mark = e2.status === "correct" ? "\u2714" : e2.status === "missed" ? "\u25D1" : "\u2716";
            ul.appendChild(el("li", null, [
              el("span", { class: "elmark " + e2.status }, document.createTextNode(mark + " ")),
              el("span", null, document.createTextNode(e2.label))
            ]));
          });
          fb.appendChild(ul);
        }
        inner.appendChild(fb);
      }
      var exp = el("div", { class: "explain" });
      exp.appendChild(t("h4", null, "Why"));
      (Array.isArray(ex.explain) ? ex.explain : [ex.explain]).forEach(function (p) { if (p) exp.appendChild(t("p", null, p)); });
      if (ex.study && ex.study.length) {
        exp.appendChild(t("h4", null, "What to study"));
        var sl = t("ul", null);
        ex.study.forEach(function (s) { sl.appendChild(t("li", null, s)); });
        exp.appendChild(sl);
      }
      inner.appendChild(exp);
      det.appendChild(inner);
      card.appendChild(det);
      rev.appendChild(card);
    });
    app.appendChild(rev);

    /* outcome + retake */
    var end = t("div", "panel center");
    if (passed) {
      var cert = el("div", { class: "cert" });
      cert.appendChild(t("h2", null, "\u2714 Passed"));
      cert.appendChild(t("p", null, "You reached " + pct + "%, above the " + (META.passMark || 70) + "% pass mark for this chapter."));
      cert.appendChild(t("p", "small", "Chapter: " + (META.chapter || "") + " \u2014 " + (META.title || "")));
      end.appendChild(cert);
    } else {
      end.appendChild(el("h2", { class: "center" }, document.createTextNode("\u2716 Not passed yet")));
      end.appendChild(t("p", null, "You scored " + pct + "%. You need " + (META.passMark || 70) + "% to pass this chapter. Read the detailed review above, then retake the exam. Questions and answer choices are reshuffled on every attempt."));
    }
    var retake = el("button", { class: "btn-primary", type: "button", id: "retakeBtn" }, document.createTextNode("Retake Exam"));
    retake.addEventListener("click", retakeExam);
    end.appendChild(retake);
    app.appendChild(end);

    /* score animation, then report exactly once */
    var target = pct;
    var current = 0;
    var motion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (motion || !window.requestAnimationFrame) {
      scoreNum.textContent = target + "%";
      reportOnce(pct, passed);
    } else {
      S.animating++;
      var steps = 24, step = 0;
      var frame = function () {
        step++;
        current = Math.round((target * step) / steps);
        scoreNum.textContent = current + "%";
        if (step < steps) window.requestAnimationFrame(frame);
        else {
          scoreNum.textContent = target + "%";
          S.animating--;
          reportOnce(pct, passed);
        }
      };
      window.requestAnimationFrame(frame);
      /* Safety net: if animation frames are throttled or unavailable, report anyway. */
      window.setTimeout(function () {
        if (!S.reported) {
          scoreNum.textContent = target + "%";
          S.animating = 0;
          reportOnce(pct, passed);
        }
      }, 2500);
    }
  }

  function answerSummary(ex) {
    var a = S.answers[ex.id];
    if (a === undefined || a === null) return "\u2014 (no answer)";
    return WIDGETS.summary(ex.type, ex, a);
  }
  function correctSummary(ex) {
    return WIDGETS.solution(ex.type, ex);
  }

  /* The site records score/total for the exercises that were actually answered.
     Skipped exercises leave both sides, per the exam rules. */
  function reportMetrics() {
    var scored = S.order.filter(function (id) { return !S.skipped[id]; });
    var answered = scored.filter(function (id) { return !!S.grades[id]; });
    var earned = 0, max = 0;
    answered.forEach(function (id) {
      var g = S.grades[id];
      if (g) earned += g.earned;
      max += pointsFor(byId(id));
    });
    return {
      earned: Math.round(earned), total: Math.round(max),
      earnedExact: Math.round(earned * 100) / 100,
      totalExact: Math.round(max * 100) / 100
    };
  }

  function reportOnce(pct, passed) {
    if (S.reported) return;
    S.reported = true;
    var m = reportMetrics();
    S.lastReport = { score: m.earned, total: m.total, percent: pct, passed: passed };
    reportScore(m.earned, m.total, pct, passed);
  }

  function reportScore(score, total, percent, passed) {
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: META.topicId,
        score: score,
        total: total,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) {
      /* Opened directly rather than inside the site. Nothing to report to. */
    }
  }

  function retakeExam() {
    S.attempt++;
    S.phase = "exam";
    S.idx = 0;
    S.answers = {};
    S.locked = {};
    S.grades = {};
    S.skipped = {};
    S.hintUsed = {};
    S.manualPause = false;
    S.checkPause = false;
    S.reported = false;
    S.animating = 0;
    S.lastReport = null;
    S.remaining = totalSeconds();
    S.startRemaining = totalSeconds();
    buildOrder();
    examShell();
    render();
    startClock();
    var b = $("#pauseBtn");
    if (b) { b.textContent = "Pause"; b.className = "btn-warn btn-sm"; b.setAttribute("aria-pressed", "false"); }
  }

  /* ---------------- build + boot ---------------- */
  function buildOrder() {
    var ids = EX.map(function (e) { return e.id; });
    var r1 = rngFor(attemptSeed + S.attempt * 104729);
    S.order = shuffle(ids, r1);
  }

  function startExam() {
    S.attempt++;
    S.phase = "exam";
    S.idx = 0;
    S.answers = {}; S.locked = {}; S.grades = {}; S.skipped = {}; S.hintUsed = {};
    S.manualPause = false; S.checkPause = false; S.reported = false;
    S.remaining = totalSeconds(); S.startRemaining = totalSeconds();
    buildOrder();
    examShell();
    render();
    startClock();
  }

  function guardedFinish(reason) {
    if (S.phase !== "exam") return;
    var scored = S.order.filter(function (id) { return !S.skipped[id]; });
    if (scored.length === 0) {
      var note = $("#ctrlNote");
      var msg = "You skipped every exercise. Answer at least one exercise before you submit, otherwise there is nothing to score.";
      if (note) { note.textContent = msg; note.style.color = "var(--warn)"; }
      window.alert(msg);
      return;
    }
    finish(reason);
  }

  function boot() {
    if (S.booted) return;
    S.booted = true;
    introScreen();
    /* The site handshake may arrive at any time. It is never required. */
    window.addEventListener("message", function (event) {
      if (!event || !event.data) return;
      if (event.data.type !== "CYBERPULSE_INIT" && event.data.type !== "CYBERMASTERY_INIT") return;
      var d = event.data;
      window.__CM_INIT = d;
      if (d.username) {
        var who = document.getElementById("whoami");
        if (who) who.textContent = d.username;
      }
      if (d.theme === "light") document.documentElement.setAttribute("data-site-theme", "light");
    });
  }

  document.addEventListener("DOMContentLoaded", function () { boot(); });

  return {    boot: boot,
    start: startExam,
    finish: guardedFinish,
    state: S,
    _internal: {
      byId: byId, gradeOne: gradeOne, gradeAgainst: gradeAgainst, currentScore: currentScore,
      buildOrder: buildOrder, shuffled: shuffled, pointsFor: pointsFor, finishNow: finish,
      results: results, render: render, examShell: examShell, paintHud: paintHud,
      reportMetrics: reportMetrics, introScreen: introScreen
    }
  };
})();

if (typeof window !== "undefined") {
  window.EXAM = EXAM;
  /* Exposed so the automated verification harness can read state directly.
     Harmless in a browser: it only reads what is already on the page. */
  window.__CM_ENGINE__ = EXAM._internal;
}

</script>
<script>
/* ==== Exercise widgets (shared by the MEDIUM and HARD files) ====
   Seven answer-area renderers. Every one of them:
     - is fully operable by keyboard (Space/Enter to pick up and place),
     - supports drag with the pointer (so it works with a mouse AND by touch),
     - shows per-element marks after Check (green / red / amber plus an icon),
     - can build a plain-text summary of the answer for the final report.

   Drag is implemented with Pointer Events rather than the HTML5 drag-and-drop
   API: one code path covers mouse, touch and pen, and the same gesture can be
   driven by a test. A tap-or-click on a chip selects it, and a tap-or-click on a
   container places it, which is the keyboard and screen-reader path. */
"use strict";

var WIDGETS = (function () {

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined) continue;
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k === "value") n.value = attrs[k];
      else if (k === "checked") n.checked = !!attrs[k];
      else if (k === "disabled") n.disabled = !!attrs[k];
      else if (k === "type") { n.type = attrs[k]; n.setAttribute("type", attrs[k]); }
      else if (k === "selected") { n.setAttribute("selected", "selected"); if (attrs[k]) n.selected = true; }
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function t(tag, cls, text) { return el(tag, cls ? { class: cls } : null, text === undefined ? null : document.createTextNode(text)); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function shuffle(a, rnd) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }
  /* Stable per-exercise shuffle so a re-render does not reshuffle under the user. */
  function makeRnd(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* ---------- generic drag-or-place engine ----------
     Holds the "currently picked up" value, so the click path and the drag path
     share one state. A pointer gesture that crosses a small threshold performs
     the drop; a click without movement selects or deselects. */
  var PICK = { value: null, setter: null };

  function setPick(value, ctx) {
    PICK.value = value;
    PICK.ctx = ctx;
    if (ctx && ctx.body) {
      $$(".chip", ctx.body).forEach(function (c) {
        c.setAttribute("aria-pressed", c.getAttribute("data-val") === value ? "true" : "false");
      });
    }
  }
  function currentPick(ctx) {
    return (PICK.ctx === ctx) ? PICK.value : null;
  }

  function wireDrag(ctx, opts) {
    /* Listeners are attached to the widget's own scope element, never directly
       to ctx.body, because a widget may re-render itself in place. Attaching to
       the reused body would stack duplicate handlers on every re-render. The
       scope is returned to the caller and destroyed with the body each time. */
    var body = ctx.body;
    var host = el("div", { class: "dragscope" });
    var dragState = null;

    function place(targetId) {
      var picked = currentPick(ctx);
      if (picked === null || ctx.locked) return;
      setPick(null, ctx);
      opts.onPlace(picked, targetId);
    }

    /* click-to-place, which is also the keyboard path: chips are real buttons */
    host.addEventListener("click", function (e) {
      if (ctx.locked) return;
      var un = closest(e.target, "[data-unplace]");
      if (un) { opts.onReturn(un.getAttribute("data-unplace")); return; }
      var chip = closest(e.target, ".chip");
      if (chip && chip.getAttribute("data-inbank") === "1") {
        var v = chip.getAttribute("data-val");
        setPick(currentPick(ctx) === v ? null : v, ctx);
        return;
      }
      var zone = closest(e.target, "[data-target]");
      if (zone) { place(zone.getAttribute("data-target")); return; }
    });

    host.addEventListener("keydown", function (e) {
      if (ctx.locked) return;
      if (e.key !== " " && e.key !== "Enter") return;
      var zone = closest(e.target, "[data-target]");
      if (zone && currentPick(ctx) !== null) { e.preventDefault(); place(zone.getAttribute("data-target")); return; }
      var chip = closest(e.target, ".chip");
      if (chip && chip.getAttribute("data-inbank") === "1") {
        e.preventDefault();
        var v = chip.getAttribute("data-val");
        setPick(currentPick(ctx) === v ? null : v, ctx);
      }
    });

    host.addEventListener("pointerdown", function (e) {
      if (ctx.locked) return;
      var chip = closest(e.target, ".chip");
      if (!chip || chip.getAttribute("data-inbank") !== "1") return;
      dragState = { value: chip.getAttribute("data-val"), chip: chip, moved: false, x: e.clientX, y: e.clientY };
      chip.classList.add("dragging");
    });
    host.addEventListener("pointermove", function (e) {
      if (!dragState) return;
      if (Math.abs(e.clientX - dragState.x) + Math.abs(e.clientY - dragState.y) > 6) dragState.moved = true;
      $$("[data-target]", host).forEach(function (z) { z.classList.remove("over"); });
      var node = window.__elementFromPoint ? window.__elementFromPoint(e.clientX, e.clientY) : null;
      var zone = closest(node, "[data-target]");
      if (zone) zone.classList.add("over");
    });
    function endDrag(e) {
      if (!dragState) return;
      var st = dragState;
      dragState = null;
      if (st.chip) st.chip.classList.remove("dragging");
      $$("[data-target]", host).forEach(function (z) { z.classList.remove("over"); });
      if (!st.moved) return;
      var node = window.__elementFromPoint ? window.__elementFromPoint(e.clientX, e.clientY) : null;
      var zone = closest(node, "[data-target]");
      if (zone) { setPick(st.value, ctx); place(zone.getAttribute("data-target")); }
    }
    host.addEventListener("pointerup", endDrag);
    host.addEventListener("pointercancel", endDrag);
    /* the HTML5 drag API is disabled on purpose: pointer events cover mouse and touch */
    host.addEventListener("dragstart", function (e) { e.preventDefault(); });
    return host;
  }

  function closest(node, sel) {
    while (node && node.nodeType === 1) {
      if (node.matches && node.matches(sel)) return node;
      node = node.parentNode;
    }
    return null;
  }

  /* ================= 1. classify (drag chips into buckets) ================= */
  function renderClassify(body, ctx, helpers) {
    var ex = ctx.ex;
    var answer = ctx.get() || { placed: {}, target: null };
    if (answer.classId !== ex.id) { answer = { classId: ex.id, placed: {}, target: null }; ctx.set(answer); }
    answer.placed = answer.placed || {};
    answer.target = answer.target || null;

    var rnd = makeRnd(hash(ex.id) + 17);
    var placedValues = {};
    Object.keys(answer.placed).forEach(function (k) { placedValues[answer.placed[k]] = k; });
    var bankValues = [];
    ex.items.forEach(function (it) { if (!placedValues[it.value]) bankValues.push(it.value); });
    bankValues = shuffle(bankValues, rnd);

    body.innerHTML = "";
    /* The drag scope wraps the whole answer area. Listeners live on this scope,
       which is recreated on every render, so they can never stack up. */
    var scope = wireDrag(ctx, {
      onPlace: function (value, targetId) {
        var a = ctx.get();
        /* Rebuild the map so the item cannot exist in two groups at once.
           Assigning a filtered copy is used everywhere instead of `delete`,
           because in-place key removal is not reliable across every object the
           page handles, and a silent failure would leave the item duplicated. */
        a.placed = withoutKey(a.placed, value);
        a.placed[value] = targetId;
        a.target = targetId;
        ctx.body.innerHTML = "";
        renderClassify(ctx.body, ctx, helpers);
      },
      onReturn: function (value) {
        var a = ctx.get();
        a.placed = withoutKey(a.placed, value);
        ctx.body.innerHTML = "";
        renderClassify(ctx.body, ctx, helpers);
      }
    });
    body.appendChild(scope);

    var bank = el("div", { class: "chipbank", role: "group", "aria-label": "Items to place" });
    bankValues.forEach(function (v) {
      var label = labelFor(ex, v);
      var chip = el("button", {
        class: "chip", type: "button", "data-val": v, "data-inbank": "1", "aria-pressed": "false", role: "button",
        "aria-label": "Item " + label + ". Press to pick it up, then press a group to drop it."
      }, [document.createTextNode("\u2725 " + label)]);
      bank.appendChild(chip);
    });
    scope.appendChild(t("p", "small muted", "Drag an item onto a group, or press it and then press the group."));
    var bankWrap = el("div");
    bankWrap.appendChild(bank);
    if (!bankValues.length) bankWrap.appendChild(t("p", "dzempty", "All items are placed. Use \u21A9 to take one back."));
    scope.appendChild(bankWrap);

    var banks = ex.buckets || [];
    var drops = el("div", { class: "drops" });
    banks.forEach(function (b, bi) {
      var zone = el("div", { class: "dropzone", "data-target": b.id, tabindex: "0", role: "group", "aria-label": "Group " + b.label });
      zone.appendChild(el("div", { class: "dztitle" }, [document.createTextNode("\u25A2 " + b.label)]));
      var dz = el("div", { class: "dzbody" });
      var items = Object.keys(answer.placed).filter(function (k) { return answer.placed[k] === b.id; });
      if (!items.length) dz.appendChild(t("span", "dzempty", "Nothing here yet"));
      items.forEach(function (v) {
        dz.appendChild(el("span", { class: "slotitem" }, [
          document.createTextNode(labelFor(ex, v) + " "),
          el("button", { type: "button", class: "btn-sm", "data-unplace": v, "aria-label": "Take " + labelFor(ex, v) + " back", title: "Take back" }, document.createTextNode("\u21A9"))
        ]));
      });
      zone.appendChild(dz);
      drops.appendChild(zone);
    });
    scope.appendChild(drops);
  }

  function labelFor(ex, v) {
    for (var i = 0; i < ex.items.length; i++) if (ex.items[i].value === v) return ex.items[i].label;
    return v;
  }

  /* Remove one key from a value map and return the filtered copy. Used instead
     of `delete` so removal can never fail silently and leave an item in two
     places at once. */
  function withoutKey(map, key) {
    var keep = {};
    Object.keys(map || {}).forEach(function (k) {
      if (String(k) !== String(key)) keep[k] = map[k];
    });
    return keep;
  }

  function paintClassify(body, marks, ctx) {
    var ans = ctx.get() || { placed: {} };
    var ex = ctx.ex;
    var want = {};
    ex.items.forEach(function (it) { want[it.value] = it.bucket; });
    (ex.buckets || []).forEach(function (b) { body.querySelectorAll('[data-target="' + b.id + '"]').length; });
    $$("[data-target]", body).forEach(function (zone) {
      zone.setAttribute("data-mark", "");
    });
    (ex.buckets || []).forEach(function (b) {
      var zone = body.querySelector('[data-target="' + b.id + '"]');
      if (!zone) return;
      var kids = $$(".slotitem", zone);
      var anyCorrect = false, anyWrong = false;
      kids.forEach(function (k) {
        var v = k.querySelector("[data-unplace]").getAttribute("data-unplace");
        var ok = want[v] === b.id;
        k.style.borderColor = ok ? "var(--ok)" : "var(--bad)";
        k.style.background = ok ? "var(--ok-bg)" : "var(--bad-bg)";
        var tag = k.querySelector(".marktag");
        if (tag) tag.parentNode.removeChild(tag);
        k.appendChild(el("span", { class: "marktag", style: "font-weight:800;color:" + (ok ? "var(--ok)" : "var(--bad)") },
          document.createTextNode(ok ? " \u2714 correct" : " \u2716 wrong")));
        if (ok) anyCorrect = true; else anyWrong = true;
      });
      zone.setAttribute("data-mark", anyWrong ? "wrong" : (anyCorrect ? "correct" : ""));
    });
    /* flag items the student never placed */
    if (marks) {
      var placed = {};
      Object.keys(ans.placed).forEach(function (k) { placed[k] = true; });
      ex.items.forEach(function (it) {
        if (!placed[it.value]) {
          var b = body.querySelector('[data-target="' + it.bucket + '"]');
          if (b) {
            b.appendChild(el("div", { class: "dzempty", style: "color:var(--warn)" },
              document.createTextNode("\u25D1 missing: " + it.label)));
          }
        }
      });
    }
  }

  /* ================= 2. order (reorder with buttons) ================= */
  function renderOrder(body, ctx) {
    var ex = ctx.ex;
    var answer = ctx.get();
    if (!answer || answer.orderId !== ex.id) {
      answer = { orderId: ex.id, order: shuffle(ex.items.slice(), makeRnd(hash(ex.id) + 31)) };
      ctx.set(answer);
    }
    if (answer.order.length !== ex.items.length) answer.order = ex.items.slice();
    body.innerHTML = "";
    body.appendChild(t("p", "small muted", "Use \u25B2 and \u25BC to move each row. Position 1 is the first step."));
    answer.order.forEach(function (item, i) {
      var row = el("div", { class: "orderrow", "data-item": item });
      row.appendChild(el("span", { class: "ordnum" }, document.createTextNode(String(i + 1) + ".")));
      row.appendChild(el("span", { class: "ordtext" }, document.createTextNode(item)));
      var up = el("button", { type: "button", class: "btn-sm", "data-mv": "up", "aria-label": "Move " + item + " up", title: "Move up" }, document.createTextNode("\u25B2"));
      var down = el("button", { type: "button", class: "btn-sm", "data-mv": "down", "aria-label": "Move " + item + " down", title: "Move down" }, document.createTextNode("\u25BC"));
      up.disabled = i === 0;
      down.disabled = i === answer.order.length - 1;
      up.addEventListener("click", function () { swap(ctx, i, i - 1); });
      down.addEventListener("click", function () { swap(ctx, i, i + 1); });
      row.appendChild(up);
      row.appendChild(down);
      body.appendChild(row);
    });

    function swap(c, a, b) {
      if (c.locked) return;
      var o = c.get().order;
      if (b < 0 || b >= o.length) return;
      var tmp = o[a]; o[a] = o[b]; o[b] = tmp;
      c.body.innerHTML = "";
      renderOrder(c.body, c);
    }
  }

  function paintOrder(body, marks, ctx) {
    var ex = ctx.ex;
    var ans = ctx.get();
    $$(".orderrow", body).forEach(function (row, i) {
      var item = row.getAttribute("data-item");
      var ok = ans && ans.order[i] === ex.order[i];
      row.setAttribute("data-mark", ok ? "correct" : "wrong");
      var tag = row.querySelector(".marktag");
      if (tag) tag.parentNode.removeChild(tag);
      row.appendChild(el("span", { class: "marktag", style: "font-weight:800;color:" + (ok ? "var(--ok)" : "var(--bad)") },
        document.createTextNode(ok ? " \u2714" : " \u2716 should be " + (ex.order.indexOf(item) + 1))));
    });
  }

  /* ================= 3. match (one dropdown per row) ================= */
  function renderMatch(body, ctx) {
    var ex = ctx.ex;
    var answer = ctx.get();
    if (!answer || answer.matchId !== ex.id) { answer = { matchId: ex.id, picks: {} }; ctx.set(answer); }
    answer.picks = answer.picks || {};
    body.innerHTML = "";
    body.appendChild(t("p", "small muted", "Choose the best partner for each item on the left."));
    var bank = shuffle(ex.options.slice(), makeRnd(hash(ex.id) + 53));
    var grid = el("div", { class: "matchgrid" });
    ex.pairs.forEach(function (p, i) {
      var row = el("div", { class: "matchrow", "data-row": p.id });
      row.appendChild(el("div", { class: "mlabel" }, document.createTextNode((i + 1) + ". " + p.left)));
      var sel = el("select", { "data-rowsel": p.id, "aria-label": "Partner for " + p.left });
      sel.appendChild(el("option", { value: "" }, document.createTextNode("\u2014 choose one \u2014")));
      bank.forEach(function (o) {
        var op = el("option", { value: o.value }, document.createTextNode(o.label));
        if (answer.picks[p.id] === o.value) op.setAttribute("selected", "selected");
        sel.appendChild(op);
      });
      sel.value = answer.picks[p.id] || "";
      sel.addEventListener("change", function () { answer.picks[p.id] = sel.value; });
      row.appendChild(sel);
      grid.appendChild(row);
    });
    body.appendChild(grid);
  }

  function paintMatch(body, marks, ctx) {
    var ex = ctx.ex;
    var ans = ctx.get() || { picks: {} };
    ex.pairs.forEach(function (p) {
      var row = body.querySelector('[data-row="' + p.id + '"]');
      if (!row) return;
      var ok = ans.picks[p.id] === p.right;
      row.setAttribute("data-mark", ok ? "correct" : "wrong");
      var tag = row.querySelector(".marktag");
      if (tag) tag.parentNode.removeChild(tag);
      row.appendChild(el("span", { class: "marktag", style: "font-weight:800;color:" + (ok ? "var(--ok)" : "var(--bad)") },
        document.createTextNode(ok ? "\u2714 correct" : "\u2716 correct answer: " + labelOf(ex, p.right))));
    });
  }
  function labelOf(ex, value) {
    for (var i = 0; i < ex.options.length; i++) if (ex.options[i].value === value) return ex.options[i].label;
    return value;
  }
  /* Label lookup for a choice list (used by the MCQ summary and solution). */
  function labelOfValue(ex, value) {
    for (var i = 0; i < (ex.choices || []).length; i++) {
      if (ex.choices[i].value === value) return ex.choices[i].label;
    }
    return value;
  }

  /* ================= 4. fill (blanks with a shared word bank) ================= */
  function renderFill(body, ctx) {
    var ex = ctx.ex;
    var answer = ctx.get();
    if (!answer || answer.fillId !== ex.id) { answer = { fillId: ex.id, slots: [] }; ctx.set(answer); }
    if (!answer.slots.length) answer.slots = new Array(ex.blankLabels.length).fill("");

    body.innerHTML = "";
    var scope = wireDrag(ctx, {
      onPlace: function (value, targetId) {
        var idx = parseInt(String(targetId).split(":")[1], 10);
        var a = ctx.get();
        a.slots.forEach(function (v, i) { if (v === value) a.slots[i] = ""; });
        a.slots[idx] = value;
        ctx.body.innerHTML = "";
        renderFill(ctx.body, ctx);
      },
      onReturn: function () {}
    });
    body.appendChild(scope);
    scope.appendChild(t("p", "small muted", "Drag a word into a blank, or press a word and then press the blank. Press a filled blank to take the word back."));
    var used = {};
    answer.slots.forEach(function (s) { if (s) used[s] = true; });
    var bankVals = shuffle(ex.bank.filter(function (b) { return !used[b]; }), makeRnd(hash(ex.id) + 71));

    var bank = el("div", { class: "chipbank", role: "group", "aria-label": "Words to place" });
    bankVals.forEach(function (v) {
      bank.appendChild(el("button", {
        class: "chip", type: "button", "data-val": v, "data-inbank": "1", "aria-pressed": "false",
        "aria-label": "Word " + v + ". Press to pick it up, then press a blank."
      }, document.createTextNode("\u2725 " + v)));
    });
    scope.appendChild(bank);

    var text = el("div", { class: "filltext" });
    ex.segments.forEach(function (seg) {
      if (typeof seg === "string") { text.appendChild(document.createTextNode(seg + " ")); return; }
      var idx = seg.blank;
      var val = answer.slots[idx] || "";
      var s = el("button", {
        class: "slot" + (val ? " filled" : ""), type: "button", "data-target": "slot:" + idx,
        "aria-label": ex.blankLabels[idx] + ": " + (val ? "currently " + val : "empty") + ". Press to place the chosen word, or to clear it."
      }, document.createTextNode(val || "\u2014 " + ex.blankLabels[idx] + " \u2014"));
      s.addEventListener("click", function () {
        if (ctx.locked) return;
        var a = ctx.get();
        if (a.slots[idx]) { a.slots[idx] = ""; }
        else if (currentPick(ctx)) { a.slots[idx] = currentPick(ctx); }
        setPick(null, ctx);
        ctx.body.innerHTML = "";
        renderFill(ctx.body, ctx);
      });
      text.appendChild(s);
      text.appendChild(document.createTextNode(" "));
    });
    scope.appendChild(text);
  }

  function paintFill(body, marks, ctx) {
    var ex = ctx.ex;
    var ans = ctx.get() || { slots: [] };
    $$(".slot", body).forEach(function (s, i) {
      var val = ans.slots[i] || "";
      var ok = val === ex.correct[i];
      s.setAttribute("data-mark", ok ? "correct" : (val ? "wrong" : "missed"));
      s.appendChild(el("span", { style: "font-size:14px;font-weight:800;margin-left:6px;color:" + (ok ? "var(--ok)" : "var(--bad)") },
        document.createTextNode(ok ? "\u2714" : (val ? "\u2716" : "\u25D1"))));
      if (!ok) s.setAttribute("title", "Correct: " + ex.correct[i]);
    });
    if (marks) {
      var hint = el("p", { class: "small", style: "color:var(--warn)" },
        document.createTextNode("\u25D1 Correct words in order: " + ex.correct.join(", ")));
      body.appendChild(hint);
    }
  }

  /* ================= 5. pitfall (spot the mistake) ================= */
  function renderPitfall(body, ctx) {
    var ex = ctx.ex;
    var answer = ctx.get();
    if (!answer || answer.pitId !== ex.id) { answer = { pitId: ex.id, picks: [] }; ctx.set(answer); }
    answer.picks = answer.picks || [];
    body.innerHTML = "";
    if (ex.instructions) body.appendChild(t("p", "small muted", ex.instructions));
    var wrap = el("div", { class: "artefact", role: "group", "aria-label": "Configuration under review" });
    ex.lines.forEach(function (line, i) {
      var rowId = ex.id + "-" + i;
      var row = document.createElement("div");
      row.setAttribute("data-line", String(i));
      row.setAttribute("style", "display:flex;gap:8px;align-items:flex-start;padding:2px 0");
      var lab = document.createElement("label");
      lab.setAttribute("style", "display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-height:24px;font:inherit");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.setAttribute("data-linebox", String(i));
      cb.checked = answer.picks.indexOf(i) >= 0;
      cb.setAttribute("aria-label", "Flag line " + (i + 1) + ": " + line);
      cb.addEventListener("change", function () {
        var a = ctx.get();
        var at = a.picks.indexOf(i);
        if (cb.checked && at < 0) a.picks.push(i);
        if (!cb.checked && at >= 0) a.picks.splice(at, 1);
      });
      lab.appendChild(cb);
      var code = document.createElement("span");
      code.textContent = line;
      lab.appendChild(code);
      row.appendChild(lab);
      wrap.appendChild(row);
    });
    body.appendChild(wrap);

    /* open question: at least the required number of bad lines must be flagged */
    var note = el("p", { class: "small muted" }, document.createTextNode(
      "Select every line that carries a real problem. " + (ex.mustFind ? "You need to find " + ex.mustFind + " of them." : "")));
    body.appendChild(note);
    if (ex.followUp) {
      var box = el("div", null, [t("label", "small", ex.followUp.label)]);
      box.querySelector("label").setAttribute("for", ex.id + "-fu");
      var inp = el("input", { type: "text", id: ex.id + "-fu", placeholder: ex.followUp.placeholder || "" });
      inp.value = answer.followUp || "";
      inp.addEventListener("input", function () { answer.followUp = inp.value; });
      box.appendChild(inp);
      body.appendChild(box);
    }
  }

  function paintPitfall(body, marks, ctx) {
    var ex = ctx.ex;
    var ans = ctx.get() || { picks: [] };
    $$("[data-line]", body).forEach(function (row) {
      var i = parseInt(row.getAttribute("data-line"), 10);
      var isBad = ex.badLines.indexOf(i) >= 0;
      var flagged = ans.picks.indexOf(i) >= 0;
      if (isBad && flagged) row.setAttribute("data-mark", "correct");
      else if (isBad && !flagged) row.setAttribute("data-mark", "missed");
      else if (!isBad && flagged) row.setAttribute("data-mark", "wrong");
      var tag = row.querySelector(".marktag");
      if (tag) tag.parentNode.removeChild(tag);
      if (isBad) {
        row.appendChild(el("span", { class: "marktag", style: "font-weight:800;color:" + (flagged ? "var(--ok)" : "var(--warn)") },
          document.createTextNode(flagged ? " \u2714 found" : " \u25D1 missed")));
      } else if (flagged) {
        row.appendChild(el("span", { class: "marktag", style: "font-weight:800;color:var(--bad)" }, document.createTextNode(" \u2716 not a problem")));
      }
    });
  }

  /* ================= 6. terminal ================= */
  function renderTerminal(body, ctx) {
    var ex = ctx.ex;
    var answer = ctx.get();
    if (!answer || answer.termId !== ex.id) { answer = { termId: ex.id, cmd: "", result: null }; ctx.set(answer); }
    body.innerHTML = "";
    body.appendChild(t("p", "small muted", ex.instructions || "Type the command and press Run, or press Enter."));
    var term = el("div", { class: "term" });
    term.appendChild(el("div", { class: "termbar" }, [document.createTextNode("\u25CF \u25CF \u25CF   " + (ex.host || "analyst@soc-01") + " \u2014 bash")]));
    var out = el("div", { class: "termbody", role: "log", "aria-live": "polite" });
    if (ex.banner) out.appendChild(displayLine(ex.banner, "dim"));
    if (answer.cmd) {
      out.appendChild(displayLine(ex.prompt || "$", "prompt", answer.cmd));
      if (answer.result && answer.result.echo) answer.result.echo.forEach(function (l) { out.appendChild(displayLine(l, "info")); });
    }
    term.appendChild(out);
    var ip = el("div", { class: "terminput" });
    ip.appendChild(el("span", { class: "prompt" }, document.createTextNode(ex.prompt || "$")));
    var inp = el("input", { type: "text", id: ex.id + "-cmd", "aria-label": "Command", autocomplete: "off", spellcheck: "false", placeholder: ex.placeholder || "type your command" });
    inp.value = answer.cmd || "";
    inp.addEventListener("input", function () { answer.cmd = inp.value; });
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); run(); }
    });
    ip.appendChild(inp);
    var runBtn = el("button", { type: "button", class: "btn-ok btn-sm", "data-run": "1" }, document.createTextNode("Run"));
    runBtn.addEventListener("click", run);
    ip.appendChild(runBtn);
    term.appendChild(ip);
    body.appendChild(term);
    body.appendChild(el("p", { class: "small muted", id: ex.id + "-hintline" }, document.createTextNode(
      ex.toolHint ? "Command family: " + ex.toolHint : "Work out which tool and which options are needed.")));

    function run() {
      if (ctx.locked) { inp.disabled = true; return; }
      answer.cmd = inp.value;
