      if (!answer.cmd.trim()) {
        out.appendChild(displayLine("Type a command before you run it.", "warn"));
        return;
      }
      answer.result = ex.check(answer.cmd);
      ctx.body.innerHTML = "";
      renderTerminal(ctx.body, ctx);
      var ni = document.getElementById(ex.id + "-cmd");
      if (ni) { ni.focus(); ni.setSelectionRange && ni.setSelectionRange(ni.value.length, ni.value.length); }
    }
  }

  function displayLine(text, cls, cmd) {
    var d = document.createElement("div");
    d.className = "termline";
    if (cmd !== undefined) {
      var p = document.createElement("span"); p.className = "prompt"; p.textContent = text;
      var c = document.createElement("span"); c.className = "cmd"; c.textContent = cmd;
      d.appendChild(p); d.appendChild(c);
    } else {
      var s = document.createElement("span");
      s.className = "lg-" + (cls || "info");
      s.textContent = text;
      d.appendChild(s);
    }
    return d;
  }

  function paintTerminal(body, marks, ctx) {
    var ex = ctx.ex;
    var ans = ctx.get() || { result: null };
    var input = body.querySelector("input[type=text]");
    if (input) input.disabled = true;
    var res = ans.result || { status: "missed", label: "no command was run", echo: [] };
    var term = body.querySelector(".term");
    if (term) {
      term.style.borderColor = res.status === "correct" ? "var(--ok)" : (res.status === "wrong" ? "var(--bad)" : "var(--warn)");
    }
    var fb = el("div", { class: "feedback", "data-level": res.status === "correct" ? "full" : res.status === "wrong" ? "zero" : "partial", style: "margin-top:10px" });
    fb.appendChild(el("div", { class: "fbhead" }, [
      el("span", { class: "fbicon" }, document.createTextNode(res.status === "correct" ? "\u2714" : res.status === "wrong" ? "\u2716" : "\u25D1")),
      el("span", null, document.createTextNode(res.label))
    ]));
    if (res.missing && res.missing.length) {
      var ul = el("ul", null);
      res.missing.forEach(function (m) { ul.appendChild(el("li", null, document.createTextNode("Missing or wrong: " + m))); });
      fb.appendChild(ul);
    }
    if (res.notes) res.notes.forEach(function (n) { fb.appendChild(t("p", "small", n)); });
    body.appendChild(fb);
  }

  /* ================= 7. logview (filter box over log lines) ================= */
  function renderLogview(body, ctx) {
    var ex = ctx.ex;
    var answer = ctx.get();
    if (!answer || answer.logId !== ex.id) { answer = { logId: ex.id, filter: "", picks: [] }; ctx.set(answer); }
    answer.picks = answer.picks || [];

    var existing = body.querySelector(".logtoolbar");
    var keepFilter = answer.filter;
    body.innerHTML = "";
    var bar = el("div", { class: "logtoolbar" });
    var lab = el("label", { class: "small", for: ex.id + "-filter" }, document.createTextNode("Filter:"));
    var fin = el("input", { type: "text", id: ex.id + "-filter", placeholder: "type to highlight matching lines", value: keepFilter, "aria-label": "Filter log lines" });
    var count = el("span", { class: "logcount" });
    fin.addEventListener("input", function () { answer.filter = fin.value; paintLines(); });
    bar.appendChild(lab); bar.appendChild(fin); bar.appendChild(count);
    body.appendChild(bar);

    var view = el("div", { class: "logview", role: "log", "aria-label": "Log lines" });
    body.appendChild(view);

    /* the question for this widget is answerable by choosing log lines */
    var note = t("p", "small muted", ex.logNote || "Select the line or lines that answer the question.");
    body.appendChild(note);

    paintLines();

    function paintLines() {
      view.innerHTML = "";
      var q = String(answer.filter || "").toLowerCase();
      var shown = 0;
      ex.lines.forEach(function (l, i) {
        var match = !q || l.text.toLowerCase().indexOf(q) >= 0;
        if (q && !match) return;
        shown++;
        var row = el("label", { class: "logline lv-" + (l.level || "info"), "data-line": String(i), style: "display:flex;gap:8px;align-items:flex-start;cursor:pointer;min-height:24px" });
        var cb = el("input", { type: "checkbox", "data-linebox": String(i), style: "margin-top:3px" });
        cb.checked = answer.picks.indexOf(i) >= 0;
        cb.setAttribute("aria-label", "Select log line " + (i + 1));
        cb.addEventListener("change", function () {
          var a = ctx.get();
          var at = a.picks.indexOf(i);
          if (cb.checked && at < 0) a.picks.push(i);
          if (!cb.checked && at >= 0) a.picks.splice(at, 1);
        });
        var span = document.createElement("span");
        if (q) {
          var t2 = l.text; var lower = t2.toLowerCase(); var pos = lower.indexOf(q); var last = 0;
          while (pos >= 0) {
            span.appendChild(document.createTextNode(t2.slice(last, pos)));
            var mk = document.createElement("mark"); mk.textContent = t2.slice(pos, pos + q.length);
            span.appendChild(mk);
            last = pos + q.length; pos = lower.indexOf(q, last);
          }
          span.appendChild(document.createTextNode(t2.slice(last)));
        } else {
          span.textContent = l.text;
        }
        row.appendChild(cb); row.appendChild(span);
        view.appendChild(row);
      });
      count.textContent = shown + " of " + ex.lines.length + " lines";
      if (!shown) view.appendChild(t("p", "dzempty", "No line matches that filter."));
    }
  }

  function paintLogview(body, marks, ctx) {
    var ex = ctx.ex;
    var ans = ctx.get() || { picks: [] };
    $$(".logline", body).forEach(function (row) {
      var i = parseInt(row.getAttribute("data-line"), 10);
      var isBad = ex.badLines.indexOf(i) >= 0;
      var flagged = ans.picks.indexOf(i) >= 0;
      if (isBad && flagged) row.setAttribute("data-mark", "correct");
      else if (isBad) row.setAttribute("data-mark", "missed");
      else if (flagged) row.setAttribute("data-mark", "wrong");
      if (isBad && flagged) row.style.outline = "2px solid var(--ok)";
      if (isBad && !flagged) row.style.outline = "2px dashed var(--warn)";
      if (!isBad && flagged) row.style.outline = "2px solid var(--bad)";
    });
  }

  /* ================= 8. dual (red team and blue team on one scenario) ================= */
  function renderDual(body, ctx) {
    var ex = ctx.ex;
    var answer = ctx.get();
    if (!answer || answer.dualId !== ex.id) { answer = { dualId: ex.id, picks: {} }; ctx.set(answer); }
    answer.picks = answer.picks || {};
    body.innerHTML = "";
    var wrap = el("div", { class: "dualwrap" });
    ex.dual.forEach(function (side, si) {
      var card = el("div", { class: "dualcard " + (side.side === "red" ? "red" : "blue"), "data-side": side.id });
      card.appendChild(el("h4", null, [document.createTextNode((side.side === "red" ? "\u2694 Red team: " : "\u26E8 Blue team: ") + side.title)]));
      card.appendChild(t("p", null, side.prompt));
      var opts = el("div", { class: "opts" });
      side.choices.forEach(function (c, ci) {
        var id = side.id + ":" + c.value;
        var lab = el("label", { class: "opt" });
        var rb = el("input", { type: "radio", name: ex.id + "-dual-" + side.id, value: c.value, "data-dual": side.id, "data-choice": c.value });
        rb.checked = answer.picks[side.id] === c.value;
        rb.addEventListener("change", function () { answer.picks[side.id] = c.value; });
        lab.appendChild(rb);
        lab.appendChild(el("span", { class: "opttext" }, document.createTextNode(c.label)));
        opts.appendChild(lab);
      });
      card.appendChild(opts);
      wrap.appendChild(card);
    });
    body.appendChild(wrap);
  }

  function paintDual(body, marks, ctx) {
    var ex = ctx.ex;
    var ans = ctx.get() || { picks: {} };
    ex.dual.forEach(function (side) {
      var card = body.querySelector('[data-side="' + side.id + '"]');
      if (!card) return;
      var got = ans.picks[side.id];
      var ok = got === side.answer;
      card.setAttribute("data-mark", ok ? "correct" : "wrong");
      var old = card.querySelector(".marktag");
      if (old) old.parentNode.removeChild(old);
      card.appendChild(el("span", { class: "marktag", style: "font-weight:800;color:" + (ok ? "var(--ok)" : "var(--bad)") },
        document.createTextNode(ok ? "\u2714 correct" : "\u2716 correct: " + side.answerLabel)));
    });
  }

  /* ================= 9. mcq (single or multi select) =================
     Data shape:
       single: { choices:[...], answer: "b" }
       multi:  { choices:[...], answers: ["a","c"], howMany: 3 }
     A multi-select question states how many answers to pick (the first prompt
     requires this) and is scored per element, so partial work earns partial
     credit. Choice order is fixed in the file and the correct answer sits in a
     different position in each question; options are written to a similar length
     so length never hints at the answer. */
  function isMulti(ex) { return Array.isArray(ex.answers) && ex.answers.length > 0; }

  function renderMcq(body, ctx) {
    var ex = ctx.ex;
    var multi = isMulti(ex);
    var answer = ctx.get();
    if (!answer || answer.mcqId !== ex.id) {
      answer = { mcqId: ex.id, picked: "", picks: [] };
      ctx.set(answer);
    }
    if (multi && !Array.isArray(answer.picks)) answer.picks = [];
    body.innerHTML = "";

    var need = ex.howMany || (multi ? ex.answers.length : 1);
    body.appendChild(t("p", "small muted", multi
      ? "Select " + need + " answers, then press Check."
      : "Choose one answer, then press Check."));

    var opts = el("div", {
      class: "opts",
      role: multi ? "group" : "radiogroup",
      "aria-label": multi ? "Answer choices, select " + need : "Answer choices"
    });

    ex.choices.forEach(function (c, i) {
      var lab = el("label", { class: "opt", "data-choice": c.value });
      var inp = el("input", {
        type: multi ? "checkbox" : "radio",
        name: ex.id + "-mcq",
        value: c.value,
        "data-mcq": "1"
      });
      if (multi) {
        inp.checked = answer.picks.indexOf(c.value) >= 0;
        inp.addEventListener("change", function () {
          var a = ctx.get();
          a.picks = a.picks || [];
          var at = a.picks.indexOf(c.value);
          if (inp.checked && at < 0) a.picks.push(c.value);
          if (!inp.checked && at >= 0) a.picks.splice(at, 1);
        });
      } else {
        inp.checked = answer.picked === c.value;
        inp.addEventListener("change", function () { answer.picked = c.value; });
      }
      lab.appendChild(inp);
      lab.appendChild(el("span", { class: "optkey", "aria-hidden": "true" },
        document.createTextNode(String.fromCharCode(65 + i) + ".")));
      lab.appendChild(el("span", { class: "opttext" }, document.createTextNode(c.label)));
      opts.appendChild(lab);
    });
    body.appendChild(opts);
  }

  function paintMcq(body, marks, ctx) {
    var ex = ctx.ex;
    var multi = isMulti(ex);
    var ans = ctx.get() || {};
    $$("[data-choice]", body).forEach(function (lab) {
      var v = lab.getAttribute("data-choice");
      var isCorrect = multi ? (ex.answers || []).indexOf(v) >= 0 : v === ex.answer;
      var picked = multi
        ? (ans.picks || []).indexOf(v) >= 0
        : ans.picked === v;
      var mark = lab.querySelector(".optmark");
      if (mark) mark.parentNode.removeChild(mark);
      lab.removeAttribute("data-mark");
      if (isCorrect && picked) {
        lab.setAttribute("data-mark", "correct");
        lab.appendChild(el("span", { class: "optmark correct" }, document.createTextNode("\u2714 correct pick")));
      } else if (isCorrect && !picked) {
        lab.setAttribute("data-mark", "missed");
        lab.appendChild(el("span", { class: "optmark missed" }, document.createTextNode("\u25D1 correct answer, not picked")));
      } else if (!isCorrect && picked) {
        lab.setAttribute("data-mark", "wrong");
        lab.appendChild(el("span", { class: "optmark wrong" }, document.createTextNode("\u2716 not a correct pick")));
      }
      if (marks && !multi) {
        /* single choice: say plainly what the right answer was */
        var note = lab.querySelector(".mcqnote");
        if (note) note.parentNode.removeChild(note);
      }
    });
    if (marks && multi) {
      var got = (ans.picks || []).filter(function (v) { return (ex.answers || []).indexOf(v) >= 0; }).length;
      var hint = el("p", { class: "small", style: "color:var(--warn)" },
        document.createTextNode("\u25D1 You picked " + got + " of " + (ex.answers || []).length + " correct answers."));
      body.appendChild(hint);
    }
  }

  /* ================= renderers by type ================= */
  var RENDER = {
    classify: renderClassify,
    order: renderOrder,
    match: renderMatch,
    fill: renderFill,
    pitfall: renderPitfall,
    terminal: renderTerminal,
    logview: renderLogview,
    dual: renderDual,
    mcq: renderMcq
  };
  var PAINT = {
    classify: paintClassify,
    order: paintOrder,
    match: paintMatch,
    fill: paintFill,
    pitfall: paintPitfall,
    terminal: paintTerminal,
    logview: paintLogview,
    dual: paintDual,
    mcq: paintMcq
  };

  function render(type, body, ctx, helpers) {
    var fn = RENDER[type];
    if (fn) fn(body, ctx, helpers);
    else body.appendChild(document.createTextNode("Unsupported exercise type: " + type));
  }
  function paint(type, body, marks, ctx) {
    var fn = PAINT[type];
    if (fn) fn(body, marks, ctx);
  }

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < String(s).length; i++) { h ^= String(s).charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }

  /* ---------- terminal command validation from plain data ---------- */
  function compileValidator(spec) {
    var main = spec.main ? new RegExp(spec.main, "i") : null;
    var reject = (spec.reject || []).map(function (r) { return { re: new RegExp(r.pattern, "i"), why: r.why }; });
    var requirements = (spec.requirements || []).map(function (r) {
      return { re: new RegExp(r.pattern, "i"), label: r.label, weight: r.weight === undefined ? 1 : r.weight };
    });
    return function (raw) {
      var cmd = String(raw || "").toLowerCase().replace(/\s+/g, " ").trim().replace(/[.;]+$/, "");
      var notes = [], missing = [];
      if (!cmd) return { status: "missed", label: "nothing was typed", echo: [], notes: ["Type the command you would run."] };
      for (var i = 0; i < reject.length; i++) {
        if (reject[i].re.test(cmd)) return { status: "wrong", label: "that command does not do the job", echo: [], missing: [], notes: [reject[i].why] };
      }
      if (main && !main.test(cmd)) {
        return { status: "wrong", label: "this is not the right tool for the job", echo: [], missing: [], notes: spec.whyMain ? [spec.whyMain] : [] };
      }
      var got = 0, total = 0;
      requirements.forEach(function (r) {
        total += r.weight;
        if (r.re.test(cmd)) got += r.weight; else missing.push(r.label);
      });
      var echo = (spec.echo || []).slice();
      if (total > 0 && got === total) return { status: "correct", label: "the command is correct and complete", echo: echo, missing: [], notes: spec.notes || [] };
      if (got > 0) return { status: "partial", label: "partly right: " + got + " of " + total + " required parts", echo: echo, missing: missing, notes: spec.notes || [] };
      return { status: "wrong", label: "the right tool, but the wrong options", echo: echo, missing: missing, notes: spec.notes || [] };
    };
  }

  /* ---------- plain-text summaries for the final report ---------- */
  function summary(type, ex, ans) {
    if (!ans) return "\u2014 (no answer)";
    try {
      if (type === "classify") {
        var parts = Object.keys(ans.placed || {}).map(function (v) { return labelFor(ex, v) + " \u2192 " + bucketLabel(ex, ans.placed[v]); });
        return parts.length ? parts.join("; ") : "\u2014 (nothing placed)";
      }
      if (type === "order") return (ans.order || []).join(" \u2192 ");
      if (type === "match") {
        var ps = ex.pairs.map(function (p) { return p.left + " \u2192 " + (ans.picks[p.id] ? labelOf(ex, ans.picks[p.id]) : "nothing"); });
        return ps.join("; ");
      }
      if (type === "fill") return ex.blankLabels.map(function (l, i) { return l + ": " + (ans.slots[i] || "\u2014"); }).join("; ");
      if (type === "pitfall") {
        var flagged = (ans.picks || []).map(function (i) { return "line " + (i + 1); }).join(", ");
        return (flagged ? "flagged " + flagged : "flagged nothing") + (ans.followUp ? " | note: " + ans.followUp : "");
      }
      if (type === "terminal") return ans.cmd ? ans.cmd : "\u2014 (nothing typed)";
      if (type === "logview") {
        var fl = (ans.picks || []).map(function (i) { return "line " + (i + 1); }).join(", ");
        return fl ? "selected " + fl : "selected nothing";
      }
      if (type === "dual") {
        return ex.dual.map(function (s) { return s.side + ": " + (ans.picks[s.id] || "nothing"); }).join("; ");
      }
      if (type === "mcq") {
        if (Array.isArray(ex.answers) && ex.answers.length) {
          var pickedMulti = (ans.picks || []).map(function (v) { return labelOfValue(ex, v); });
          return pickedMulti.length ? pickedMulti.join("; ") : "\u2014 (nothing selected)";
        }
        var picked = (ex.choices.filter(function (c) { return c.value === ans.picked; })[0] || {}).label;
        return picked ? picked : "\u2014 (no answer)";
      }
    } catch (e) { return "\u2014"; }
    return JSON.stringify(ans);
  }

  function bucketLabel(ex, id) {
    for (var i = 0; i < (ex.buckets || []).length; i++) if (ex.buckets[i].id === id) return ex.buckets[i].label;
    return id;
  }

  function solution(type, ex) {
    if (type === "classify") {
      var groups = {};
      ex.items.forEach(function (it) { (groups[it.bucket] = groups[it.bucket] || []).push(it.label); });
      return Object.keys(groups).map(function (b) { return bucketLabel(ex, b) + ": " + groups[b].join(", "); }).join(" | ");
    }
    if (type === "order") return ex.order.join(" \u2192 ");
    if (type === "match") return ex.pairs.map(function (p) { return p.left + " \u2192 " + labelOf(ex, p.right); }).join("; ");
    if (type === "fill") return ex.blankLabels.map(function (l, i) { return l + ": " + ex.correct[i]; }).join("; ");
    if (type === "pitfall") return "Problem lines: " + ex.badLines.map(function (i) { return (i + 1) + " (" + (ex.badWhy[i] || "") + ")"; }).join("; ");
    if (type === "terminal") return ex.accepted || "the command described in the explanation";
    if (type === "logview") return "Lines " + ex.badLines.map(function (i) { return i + 1; }).join(", ");
    if (type === "dual") return ex.dual.map(function (s) { return s.side + ": " + s.answerLabel; }).join("; ");
    if (type === "mcq") {
      if (Array.isArray(ex.answers) && ex.answers.length) {
        return ex.answers.map(function (v) { return labelOfValue(ex, v); }).join("; ");
      }
      var c = ex.choices.filter(function (x) { return x.value === ex.answer; })[0];
      return c ? c.label : "see the explanation";
    }
    return "see the explanation";
  }

  /* ---------- grade-spec builders ---------- */
  function gradeSpec(type, ex) {
    if (type === "classify") {
      var sets = {};
      ex.items.forEach(function (it) { (sets[it.bucket] = sets[it.bucket] || { id: "b:" + it.bucket, correct: [], label: bucketLabel(ex, it.bucket) }).correct.push(it.value); });
      return { total: ex.items.length, sets: Object.keys(sets).map(function (k) { return sets[k]; }) };
    }
    if (type === "order") return { total: ex.order.length, exactRows: { id: "order", order: ex.order, label: "Position", items: ex.items } };
    if (type === "match") return { total: ex.pairs.length, rows: ex.pairs.map(function (p) { return { id: p.id, correct: p.right, label: p.left }; }) };
    if (type === "fill") return { total: ex.correct.length, pool: { id: "slots", correct: ex.correct, label: "Blank" } };
    if (type === "pitfall") {
      return {
        total: ex.lines.length,
        choices: ex.lines.map(function (l, i) {
          var bad = ex.badLines.indexOf(i) >= 0;
          return {
            id: "l" + i, answer: bad ? "flag" : "leave",
            label: "Line " + (i + 1) + ": " + l,
            why: bad ? (ex.badWhy[i] || "") : "this line is correct as written"
          };
        })
      };
    }
    if (type === "terminal") return { total: 1, terminal: { id: "cmd", label: "Command" } };
    if (type === "mcq") {
      if (Array.isArray(ex.answers) && ex.answers.length) {
        /* multi-select: one element per correct answer, so partial credit works */
        return {
          total: ex.answers.length,
          sets: [{ id: "picks", correct: ex.answers, label: "Correct answer" }],
          note: "This question has " + ex.answers.length + " correct answers out of " +
            ex.choices.length + " choices. Each correct pick earns its share of the points."
        };
      }
      return { total: 1, singles: [{ id: "pick", answer: ex.answer, label: "Answer" }] };
    }
    if (type === "logview") {
      return {
        total: ex.lines.length,
        choices: ex.lines.map(function (l, i) {
          var bad = ex.badLines.indexOf(i) >= 0;
          return {
            id: "ll" + i, answer: bad ? "flag" : "leave",
            label: "Log line " + (i + 1) + ": " + l.text,
            why: bad ? (ex.badWhy[i] || "") : "this line is normal for the workload"
          };
        })
      };
    }
    if (type === "dual") return { total: ex.dual.length, dual: ex.dual.map(function (s) { return { id: s.id, answer: s.answer, label: s.side + " team" }; }) };
    return { total: 1 };
  }

  /* pitfall and logview answer shapes are native to their widgets (checkbox
     lists), so adapt them into the row-based grade spec the engine expects. */
  function adaptAnswer(type, ans) {
    if (!ans) return ans;
    if (type === "pitfall" || type === "logview") {
      var out = {};
      var picks = ans.picks || [];
      var prefix = type === "pitfall" ? "l" : "ll";
      /* mark every line explicitly so unselected lines can score as correct */
      var count = type === "pitfall" ? null : null;
      out.__picks = picks;
      return out;
    }
    return ans;
  }

  return {
    render: render, paint: paint, summary: summary, solution: solution,
    gradeSpec: gradeSpec, compileValidator: compileValidator, hash: hash,
    labelOf: labelOf, labelFor: labelFor, bucketLabel: bucketLabel
  };
})();

if (typeof window !== "undefined") window.WIDGETS = WIDGETS;

</script>

  EX.forEach(function (ex) {
    ex.gradeSpec = WIDGETS.gradeSpec(ex.type, ex);
    if (ex.type === "terminal") ex.check = WIDGETS.compileValidator(ex.validator);
  });
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { EXAM.boot(); });
  } else {
    EXAM.boot();
  }
  /* Read-only handle on engine state, used by the automated test harness. */
  window.__CM_ENGINE__ = {
    state: EXAM.state,
    byId: function (id) { return EXAM._internal.byId(id); },
    pointsFor: EXAM._internal.pointsFor,
    render: EXAM._internal.render,
    reportMetrics: EXAM._internal.reportMetrics,
    gradeAgainst: EXAM._internal.gradeAgainst
  };
})();
</script>
