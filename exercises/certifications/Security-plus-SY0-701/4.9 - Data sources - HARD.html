EX.push({
t:'terminal', ti:'Hunt the PCAP without a named tool', th:'Network data sources',
k:['Packet captures','tcpdump / Wireshark','DNS logs','Indicators of compromise'], p:4,
sc:'The egress sensor saved a rolling capture to <code>/pcaps/egress.pcap</code>. Threat intel says the campaign uses DNS names ending in <code>.cdnedge[.]example</code>. Operational goal, no tool suggestions this time: extract every DNS query for those names from the capture and save the list for the case file.',
artLabel:'TERMINAL BRIEFING',
art:'Available: the capture file <code>/pcaps/egress.pcap</code>. Standard shell tools and packet-analysis suites installed. The output file must be <code>/tmp/hits.txt</code>.',
q:'Produce /tmp/hits.txt containing every DNS query line for names ending in .cdnedge[.]example found in the capture. You choose the tool and the flags.',
d:{
boot:'analyst@kf-forensics:~$ ls /pcaps\negress.pcap\nanalyst@kf-forensics:~$ _',
ls:'/pcaps: egress.pcap',
prompt:'analyst@kf-forensics:~$',
help:'No help available for this task. You are expected to know the packet-analysis tools installed here.',
goals:[
 {re:'(tshark|tcpdump|wireshark)[\\s\\S]*(-r\\b|/pcaps/egress\\.pcap)', label:'Read the capture from /pcaps/egress.pcap (offline analysis)'},
 {re:'cdnedge', label:'Filter for the campaign domain .cdnedge[.]example'},
 {re:'(tshark[\\s\\S]*-Y[\\s\\S]*dns|tshark[\\s\\S]*-f[\\s\\S]*dns|tcpdump[\\s\\S]*(port\\s+53|dns)|grep[\\s\\S]*dns|dns\\.qry)', label:'The command targets DNS records'},
 {re:'(>\\s*/tmp/hits\\.txt|>>\\s*/tmp/hits\\.txt|\\btee\\s+[^;|]*hits\\.txt)', label:'The list is saved to /tmp/hits.txt'}
],
show:[
 {when:'(tshark|tcpdump)[\\s\\S]*egress\\.pcap[\\s\\S]*cdnedge', out:'54  01:12:03.441  10[.]44[.]9[.]7 → 192[.]0[.]2[.]53  DNS 201 Standard query 0x8a21 A beacon-7f3a.cdnedge[.]example\n71  01:12:34.902  10[.]44[.]9[.]7 → 192[.]0[.]2[.]53  DNS 198 Standard query 0x8a22 TXT 9d2e11.cdnedge[.]example\n89  01:13:05.107  10[.]44[.]9[.]7 → 192[.]0[.]2[.]53  DNS 201 Standard query 0x8a23 A beacon-7f3a.cdnedge[.]example'},
 {when:'(tshark|tcpdump)[\\s\\S]*egress\\.pcap', out:'egress.pcap: 4218 packets, captured 01:00:00–02:00:00, 3 hosts talking'}
],
example:'tshark -r /pcaps/egress.pcap -Y "dns.qry.name contains \\"cdnedge.example\\"" > /tmp/hits.txt'},
h:'Two families of tools read pcap files offline; both can print only the matching packets, and the shell redirect (>) saves that list into the deliverable file.',
ex:'Offline capture analysis is core tradecraft. Wireshark\u2019s CLI twin, tshark, reads a file with <code>-r</code> and applies a display filter with <code>-Y "dns.qry.name contains ..."</code>; classic tcpdump reads files with <code>-r</code> too and its text output pairs perfectly with grep. Any chain that reads the file, keeps only DNS, matches the campaign suffix, and redirects (<code>&gt;</code> or <code>tee</code>) into /tmp/hits.txt satisfies all four goals — the redirect is not decoration, it is the deliverable the case file needs. The saved list becomes a durable IoC record — better than screenshots, because it is reproducible.',
fx:'Memorize one offline-analysis chain per tool family: tshark -r file -Y filter > out.txt, and tcpdump -r file | grep pattern > out.txt. Redirects make evidence, prints make screenshots.'
});

EX.push({
t:'qcm', ti:'The beacon that resolves to a CDN', th:'Network data sources',
k:['Packet captures','Endpoint logs','Threat intelligence','Network traffic analysis'], p:3,
sc:'EDR insists: nightly-beacon to <code>assets[.]cdnedge[.]example</code> from a developer workstation. Your packet capture shows that the domain resolves to <b>195[.]x-shared CDN addresses that also serve two legitimate partner sites</b> — the TLS sessions look ordinary, the volume is small and steady.',
q:'What is the professional interpretation — and the next step?',
d:{opts:[
 'Treat it as unproven: split the traffic by TLS SNI / Host name and rhythm first',
 'Block the whole CDN IP range now — the beacon rhythm is proof enough by itself',
 'The capture file is corrupt, because the endpoint and the capture disagree',
 'Recall every EDR agent — they are plainly misfiring across the whole estate'
], correct:0},
h:'Shared infrastructure means one address is many sites. What field inside the TLS handshake names the site the client actually wants?',
ex:'Modern malware loves CDN and shared-hosting camouflage: blocking the IP would break legitimate partner traffic, and the "EDR is broken" reflex discards your best sensor. The capture is fine — it simply records shared infrastructure. The discriminator lives inside the traffic: the TLS SNI (or HTTP Host) name reveals which site the client requested, so filter the capture by the suspicious hostname and compare session shape against the partner sites. Beacons have a metronome rhythm and near-constant sizes; ordinary browsing does not. Evidence first, blocklist second — especially when the blocklist would hurt the business.',
fx:'When infrastructure is shared, never block the address — block or sinkhole the <i>name</i>, and prove intent from SNI/Host and session rhythm.'
});

EX.push({
t:'dragdrop', ti:'Whose field is this? Assign log fields to their source', th:'Log data & log types',
k:['Cloud logs','NetFlow','Syslog','Endpoint logs','Windows Event IDs'], p:4,
sc:'During the Kestrel incident review, an auditor asks you to prove you know which system produces which fields — "or your correlations are guesswork." Assign each field to the data source that natively provides it.',
q:'Drag each field into the source that natively records it.',
d:{
zones:[{id:'cloud',label:'Cloud audit log'},{id:'flow',label:'NetFlow record'},{id:'sys',label:'Syslog header'},{id:'ep',label:'Endpoint/EDR telemetry'}],
items:[
 {id:'f1',label:'userIdentity + eventName (AssumeRole)',zone:'cloud'},
 {id:'f2',label:'awsRegion of the API call',zone:'cloud'},
 {id:'f3',label:'dst_pkts + bytes counters',zone:'flow'},
 {id:'f4',label:'input SNMP ifIndex of the flow',zone:'flow'},
 {id:'f5',label:'PRI value (facility + severity)',zone:'sys'},
 {id:'f6',label:'TIMESTAMP + hostname before the message tag',zone:'sys'},
 {id:'f7',label:'process.image + commandLine',zone:'ep'},
 {id:'f8',label:'file hash of the executable that wrote a registry Run key',zone:'ep'}
]},
h:'Cloud = who did what to which API. Flow = counters between addresses. Syslog = the PRI/TIMESTAMP header. Endpoint = processes and files.',
ex:'Field literacy prevents fake correlations. Cloud audit logs speak in API terms: userIdentity, eventName, region — they describe control-plane actions, not packets. NetFlow records conversations as counters: packets, bytes, interfaces — no usernames, no processes. A syslog header carries the PRI (facility + severity packed in one number), a timestamp and the hostname. Endpoint/EDR telemetry owns everything process- and file-shaped: image paths, command lines, hashes. If you find a username inside a flow record or a byte counter inside EDR data, one of the two is misattributed — auditors love finding exactly that.',
fx:'Learn one signature field per source: cloud → eventName; flow → bytes/packets; syslog → PRI; EDR → commandLine. Everything else follows.'
});

d:{
left:[
 'Auth: 4625 burst, then 4624 + 4672 for j.admin from a new IP',
 'DNS: TXT lookups every 30 s to one domain, ~240-byte answers',

h:'Identity story, tunnel story, exploit story, volume story, survival story — match each bundle to its narrative.',
ex:'Evidence bundles become conclusions only when their internal lines agree. The auth bundle says identity takeover: failures, then success, then privileged logon. The DNS bundle is a C2 tunnel: metronome timing plus TXT answers sized to carry data. The app+IDS bundle is exploitation: the application saw the payload and the IDS signature named the same CVE — two independent witnesses. The flow bundle is exfiltration: big, one-directional, to a brand-new destination, at night. The EDR bundle is persistence: an extra admin and a scheduled task exist to survive reboots. Naming the technique from combined artifacts is the core HARD skill this exam drills.',

EX.push({
t:'branch', ti:'Active intruder on trading-wks4: steady hands', th:'Investigation integrity',
k:['Chain of custody','Endpoint logs','Network traffic analysis','SIEM aggregation','SOAR playbooks'], p:4,
sc:'14:12, <b>Kestrel Financial</b>. EDR: trading-wks4 is beaconing. The user is in a live trading session. The attacker, if present, may be watching. Every choice has a cost — choose like someone who has done this before.',
q:'Choose the best action at each step.',
d:{steps:[
 {ctx:'Beacon confirmed on the wire (60 s rhythm, TXT answers). Attacker presence is <i>active and unknown-depth</i>.',
  q:'First move?',
  opts:[
   {t:'Quietly coordinate with the IR lead: pull memory + flows, then isolate during a pre-agreed window', ok:true, fb:'Correct — volatile evidence first, then a coordinated cut (the SOAR playbook can execute the isolation the moment the IR lead approves).'},
   {t:'Yank the network cable right now, from the desk, visibly', ok:false, fb:'A visible cut can trigger the attacker\u2019s dead-man logic (wiping, ransomware detonation). Memory dies with the cable anyway.'},
   {t:'Email the user asking them to stop working for 30 minutes', ok:false, fb:'If the workstation is compromised, so is the mailbox — and you just told the attacker you are coming.'}
  ]},
 {ctx:'Memory image and flow records captured; isolation window agreed with the trading desk supervisor.',
  q:'Preservation step:',
  opts:[
   {t:'Hash the memory image and flow exports, store read-only, and record the handoff on the custody form', ok:true, fb:'Correct — integrity + accountability from the first minute, before anyone analyses anything.'},
   {t:'Start analysing the memory image on the affected workstation to save transfer time', ok:false, fb:'Analysing on a compromised host contaminates evidence and risks the attacker watching your tooling.'},
   {t:'Copy everything to a personal cloud drive as backup', ok:false, fb:'Evidence leaves the controlled environment — custody broken, confidentiality breached.'}
  ]},
 {ctx:'Host isolated, evidence sealed. Now scoping: how far did the intruder reach?',

   {t:'Correlate in the SIEM: same source IP, same beacon domain, same service account across all logs for 72 h', ok:true, fb:'Correct — pivot on the IoCs through every log source to find siblings of this compromise.'},

   {t:'Announce a company-wide password reset in the all-hands channel before scoping', ok:false, fb:'A public alarm mid-investigation tells the attacker your progress and burns your quiet containment.'}
  ]}
]},
h:'The hardened pattern: quiet coordination → volatile evidence → integrity paperwork → SIEM-wide pivoting. Loud moves come only when containment demands them.',
ex:'Active-intruder handling adds one rule to the playbook: do not educate the attacker. Visible or announced actions tip them into destruction mode, so you coordinate quietly, capture what dies first (memory, live flows), and cut the session in a pre-agreed window. Preservation paperwork (hashes, custody form) happens before analysis — it is cheap now and priceless later. Scoping then pivots across every log source on the IP, domain and accounts involved, because staged intrusions almost always have siblings. The wrong branches each either warned the attacker, contaminated evidence, or declared victory on one hour of data.',
fx:'Under pressure, recite: quiet, capture, seal, pivot. Visibility to the attacker is a cost you pay for, every time. A SOAR playbook turns the approved isolation into a one-click, logged action.'

sc:'December morning. The emergency scan says half the estate carries the Log4j vulnerability (CVE-2021-44228, CVSS 10.0). The estate is big; the patch queue is bigger. Management asks where to start — the answer is triage by <i>evidence of exploitation</i>, not by scan count.',

 'The CVSS 10.0 score on the emergency scan report',

], correct:[0,1,2]},
h:'One string in a request is a knock on the door. A spawned process is someone inside. Which signals hear the knock vs see the guest?',

k:['Correlation rules','Windows Event IDs','SIEM aggregation','Log normalization'], p:4,
sc:'Last month\u2019s spray walked past a broken rule. You are rewriting it. The SIEM query language is pseudo-SQL over normalized events (fields like event.code, _time, src_ip, user).',

h:'Spray = one source touching many users, so the GROUP BY follows the attacker, not the victim. Sprays are slow — minutes, not a full day.',
ex:'A spray rule counts <i>distinct usernames</i> per <i>source IP</i> inside a short window. 4625 is the failed-logon code (4624 would count successes); the window is minutes — 300 seconds is a common choice, and 86400 (a full day) would bury real sprays in a day of typos; grouping by src_ip follows the attacker while grouping by user would model single-account brute force instead; and a threshold around 20 distinct users separates attack from clumsy humans. This one rule encodes the whole spray-vs-brute-force distinction you practised in the log exercise earlier.',

EX.push({
t:'qcm', ti:'Badge log versus sensor log: who moved first?', th:'Log attributes & time',
k:['Timestamps & time zones','NTP time sync','Log normalization'], p:3,
sc:'A badge reader logged the suspect entering the server room at <code>2025-03-03 21:10:00</code> — local time, UTC-5, and the badge system does not stamp a zone. The network sensor logged his laptop\u2019s first connection at <code>2025-03-04T02:10:00Z</code>. A junior analyst says the badge swipe happened five hours before the connection and wants two separate incidents.',
q:'Which interpretation is correct?',
d:{opts:[
 'Same moment: 21:10 local (UTC-5) is 02:10 UTC next day — normalize both to one clock',
 'The badge swipe really is five hours before the connection — open two separate incidents',
 'The sensor event came five hours before the badge swipe',
 'The badge clock is broken — discard the badge evidence entirely'
], correct:0},
h:'Do the arithmetic slowly: 21:10 + 5 hours = 02:10 — and crossing midnight rolls the date forward.',
ex:'This is the exact trap mixed time zones set. The badge system writes local time (UTC-5) with no zone marker; the sensor writes UTC with a Z. 21:10 in UTC-5 is 02:10 UTC on the following day — the events are simultaneous, which is itself evidence (he entered and his laptop connected immediately). Two incidents would be a false story; discarding the badge evidence throws away physical corroboration. Note that NTP health is a separate axis: with NTP broken, even correctly zoned clocks drift — but here both sources claim reliable time, so the zones are the variable. The professional habit: record each source\u2019s true zone, normalize everything to UTC, and only then sequence events. Time-zone blindness has collapsed many real timelines — and it is a favourite exam trap for the same reason.',
fx:'Convert every timestamp to UTC the moment you collect it, and write the zone down beside sources that do not stamp it.'
});

EX.push({
t:'logviewer', ti:'Rule base review: how did the DB get reached?', th:'Log data & log types',
k:['Firewall logs','Network traffic analysis','Source/destination IP'], p:4,
sc:'Post-incident review at <b>Kestrel Financial</b>: the internal database VLAN was reached over 443 despite a "protect" deny rule. The firewall\u2019s rule base and the relevant log lines are below. The config comments show rule evaluation order — top to bottom, first match wins.',
q:'Which reading of the rule base and logs is correct?',
d:{
logs:[
 '# rule base (evaluated top-down, first match wins)',
 '# 1  WEB-ANY-443   allow  src=any  dst=any        port=443  log=no',
 '# 2  DB-PROTECT    deny   src=any  dst=10[.]44[.]9[.]20  port=443  log=yes',
 '# 3  DEFAULT       deny   any-any            log=yes',
 '03:02:11Z ALLOW TCP 10[.]44[.]5[.]30:52100 -> 10[.]44[.]9[.]20:443 rule=WEB-ANY-443 bytes=41MB',
 '03:02:14Z ALLOW TCP 10[.]44[.]5[.]30:52102 -> 10[.]44[.]9[.]20:443 rule=WEB-ANY-443 bytes=88MB',
 '03:04:40Z ALLOW TCP 10[.]44[.]5[.]30:52110 -> 10[.]44[.]9[.]20:443 rule=WEB-ANY-443 bytes=12MB',
 '03:07:02Z DENY  TCP 10[.]44[.]5[.]30:52120 -> 10[.]44[.]9[.]20:1433 rule=DB-PROTECT-1433 bytes=0',
 '03:08:19Z DENY  TCP 10[.]44[.]5[.]30:52130 -> 10[.]44[.]9[.]20:443 rule=DB-PROTECT bytes=0'
],
a:{kind:'qcm', opts:[
 'Rule 1 shadowed DB-PROTECT: first match wins, so early sessions rode the silent any/any allow',
 'DB-PROTECT is broken, because deny rules cannot produce log entries for the traffic they match',
 'The firewall failed open and let those sessions bypass its rule base entirely',
 'The 1433 deny proves the database never listens on 443, so the allowed sessions are impossible'
], correct:0}},
h:'First match wins — and the allow that matched carries log=no, which is why the session hid from the dashboards. Why does the DENY appear later in the log?',
ex:'Firewalls evaluate top-down and stop at the first match. WEB-ANY-443 (any→any on 443, logging off) sits above the DB protect rule, so early connections to the database on 443 matched the allow, were permitted, and — thanks to log=no — left no trace in the dashboards. The later DENY entries imply the rule order changed mid-window (the review found an admin pushed a reorder), letting DB-PROTECT finally see the traffic. The lesson generalizes: allow rules shadow everything below them, so specific denies must sit above broad allows, and silent allows are how real breaches hide. The 1433 deny behaving normally proves the engine works — the flaw is ordering, not mechanics.',
fx:'Audit rule bases top-down: for every broad allow, ask which specific denies it shadows, and make sure allow rules log.'
});

h:'Hashes pin files, names pin domains, addresses pin endpoints, behaviour needs analytics, URL shapes fit proxies.',
ex:'Each indicator type has a native control. A file hash is pinned in an endpoint blocklist — same file, same hash, instant block. A malicious domain fits a DNS sinkhole or resolver block, catching every host that resolves it. An IP:port listener is a textbook firewall deny. A TTP cannot be "blocked" at all — it is a behaviour, so it needs a detection rule or analytics that watch for scheduled tasks spawning encoded PowerShell. A stable URL path pattern fits a proxy or IPS rule. Mismatching them (blocking a TTP like an IP, sinkholing a hash) is how campaigns slip through despite good intel.',
fx:'Map the quartet: file → hash block; name → DNS block; address → firewall block; behaviour → analytics. URL patterns live with the proxy.'
});

EX.push({

sc:'The evidence locker drill: put the acquisition steps in the order that a court, an auditor and your own lab manager would all accept.',
q:'Order the six steps from first to last.',
d:{
items:[
 'Secure the scene and photograph the system exactly as found',
 'Acquire the disk image through a write-blocker',
 'Hash the original and the image; record both values',
 'Complete the chain-of-custody form for the transfer',
 'Transport the sealed copy to the evidence locker',
 'Verify the hash on receipt, then analyse the copy only'
],
order:[0,1,2,3,4,5]},
h:'Document the scene before touching it; never let bits reach the original; paper the trail; verify at every boundary.',
ex:'Acquisition order is doctrine because each step protects the previous one. Photographing first preserves the scene as evidence of state. The write-blocker guarantees acquisition cannot change a single sector. Hashing both original and image creates the integrity pair you will re-verify forever after. The custody form names every hand, so the trail is unbroken. Sealed transport protects the copy physically. Verification on receipt — then analysis of the copy only — closes the loop. Skipping any step gives opposing counsel the exact gap to attack, and the order cannot be shuffled after the fact.',
fx:'Chant it: scene → acquire (blocked) → hash → custody → transport → verify → analyse the copy. Muscle memory beats memory under stress.'

sc:'The campaign\u2019s phishing domain is live. Leadership wants attribution and infrastructure mapping. Some enrichment methods are passive (they leave no trace on the attacker\u2019s side); others actively touch the infrastructure and can warn the operator.',

d:{opts:[

 'Attempting to log into the attacker\u2019s admin panel with default passwords'
], correct:[0,1,2]},
h:'Passive = somebody else\u2019s stored records. Active = someone knocks on the attacker\u2019s door on your behalf. Which is which?',

EX.push({
t:'terminal', ti:'Name the process behind the connection', th:'Log data & log types',
k:['Endpoint logs','Network traffic analysis','Source/destination IP'], p:4,
sc:'The bastion host has one established connection to <code>198[.]18[.]7[.]44:8443</code> and nobody can say which program owns it. Operational goal, tools unnamed: identify the owning process and its PID, using the socket-inspection capability of the host.',
artLabel:'TERMINAL BRIEFING',
art:'You are root on <code>bastion</code>. The connection: remote <code>198[.]18[.]7[.]44:8443</code>. Deliverable: a command whose output shows the process name and PID for that connection.',
q:'Run a command (or short pipeline) that maps the connection to 198[.]18[.]7[.]44 to its owning process and PID.',
d:{
boot:'root@bastion:~# _',
ls:'no files needed for this task',
prompt:'root@bastion:~#',
help:'No tool names this time. Hosts can list live sockets together with the process that owns each one — you are expected to know the two or three classic utilities for that.',
goals:[
 {re:'\\b(ss|netstat|lsof|sockstat)\\b', label:'Uses a socket-inspection utility (ss / netstat / lsof / sockstat)'},
 {re:'(198\\.18\\.7\\.44|198\\[\\.\\]18\\[\\.\\]7\\[\\.\\]44)', label:'Targets the remote address 198[.]18[.]7[.]44'},
 {re:'(^|\\s)-[a-z]*p[a-z]*(\\s|$)|\\+process|programs|--process|-i\\b', label:'Asks for process/program mapping in the output'}
],
show:[
 {when:'(ss|netstat|lsof|sockstat)[\\s\\S]*198', out:'tcp  ESTAB  0  0  10[.]44[.]2[.]9:51440  198[.]18[.]7[.]44:8443\n         users:(("update_helper",pid=4412,fd=9))\n→ process: update_helper (PID 4412)'},
 {when:'(ss|netstat|lsof|sockstat)', out:'(socket list printed — add the address filter or process flag to answer the task precisely)'}
],
example:'ss -tunp | grep 198[.]18[.]7[.]44'},
h:'The classic trio lists sockets; two of them print owning PIDs with one extra flag; one takes the address directly with -i.',
ex:'Correlating a live connection to its owning process is the bridge between network and endpoint evidence. <code>ss -tunp</code> (or <code>netstat -tunp</code>) lists sockets with the <code>-p</code> process map; <code>lsof -i @198[.]18[.]7[.]44</code> goes straight to files-and-sockets for that address. The answer here matters because <code>update_helper</code> should not exist on a bastion — PID 4412 becomes your endpoint pivot: its path, hash, start time, parent. Flow logs name the conversation; only the host names the criminal. Tools change names across platforms, but the capability — socket plus process — is the same everywhere.',
fx:'Drill one command per platform until reflex: Linux ss -tunp, Windows netstat -anob (elevated), and lsof -i for the surgical case.'
});

EX.push({
t:'qcm', ti:'The exfil flow the firewall never saw', th:'Network data sources',
k:['NAT-aware analysis','NetFlow','Firewall logs','Network traffic analysis'], p:3,
sc:'NetFlow shows 10[.]44[.]9[.]7 shipping 3 GB to an external address at 02:14. You search the firewall logs for <code>10[.]44[.]9[.]7</code> and get <b>zero results</b> for that hour. The firewall demonstrably carried the traffic (the bytes left the building).',
q:'What explains the empty search — and what is the correct move?',
d:{opts:[
 'NAT: the firewall logs the pool address — search 203[.]0[.]113[.]10, join by time and ports',
 'The flow exporter\u2019s clock is a full day off — search the previous day\u2019s firewall log instead',
 'The firewall dropped the session without logging it, so the bytes went another way',
 'NetFlow cannot report internal source addresses, so the flow line itself is unusable'
], correct:0},
h:'Flows are recorded where the session happens; firewall logs are written where the NAT rewrite happens. Same session, different name.',
ex:'The session existed once but wears two names: inside, its real address 10[.]44[.]9[.]7 (as the router\u2019s flow export reports); at the firewall, the NAT pool address 203[.]0[.]113[.]10 it was rewritten to. Searching the firewall for the internal IP finds nothing — not because evidence is missing, but because you asked for the wrong name. Join the two records by timestamp and ports, then pivot on the translated address. The other explanations fail on facts: flows do report internal addresses, a one-day clock error would show in every other correlation, and the bytes demonstrably transited this path.',
fx:'NAT-aware correlation is a standing exam theme: know your address pools, and always ask "which name did this device record?"'
});

EX.push({
t:'logviewer', ti:'Syslog routing: find the misfiled evidence', th:'Log data & log types',
k:['Syslog','Severity levels','Log normalization','SIEM aggregation'], p:3,
sc:'The SIEM team inherited a rsyslog config nobody reviews. During the incident, messages were filed — some correctly, some not. Below is the routing config (comments) and five filed messages with their severity and destination. <code>*.err</code> means severity <b>err and worse</b> (crit, alert, emerg).',
q:'Select <b>every</b> statement the routing evidence supports.',
d:{
logs:[
 '# rsyslog routing.conf',
 '# auth,authpriv.*   -> /var/log/secure',
 '# kern.*            -> /var/log/kernel',
 '# *.err             -> /var/log/errors   (err and above)',
 '# mail.info         -> /var/log/mail',
 'Mar 4 02:11:09 bastion sshd[2201]: auth.crit — failed-logon burst from 192[.]0[.]2[.]187   -> filed: /var/log/mail',
 'Mar 4 02:12:40 bastion kernel: kern.warning — NIC eth1 link flap   -> filed: /var/log/kernel',
 'Mar 4 02:13:02 bastion systemd: daemon.info — time step +0.4s   -> filed: /var/log/errors',
 'Mar 4 02:14:10 mailgw postfix: mail.info — queue 8F2A1 accepted   -> filed: /var/log/mail',
 'Mar 4 02:15:55 bastion sshd[2288]: auth.info — session opened for j.admin   -> filed: /var/log/secure'
],
a:{kind:'multi', opts:[
 'The auth.crit burst was misfiled into /var/log/mail instead of the secure log — the SOC\u2019s SSH dashboards watched the wrong file',
 'The daemon.info message does not belong in /var/log/errors: info is <i>below</i> err, so *.err never asked for it',
 'kern.warning and mail.info were routed correctly',
 'An auth.err message would be dropped entirely by this config',
 'Syslog severity plays no role in routing on this box'
], correct:[0,1,2]}},
h:'Read the selectors like a programmer: auth,authpriv.* takes every auth severity; *.err takes err and anything worse; the bursts and the time step tell you what the misfiling cost.',
ex:'Routing follows selectors, and two failures stand out. The auth.crit burst belongs to the secure log (auth.*); filed under mail, it silently escaped every SSH watch — exactly how a real spray hides. The daemon.info entry landed in errors although *.err only accepts err and worse; info never qualifies, so someone misread severity ordering (emerg &gt; alert &gt; crit &gt; err &gt; warning &gt; notice &gt; info &gt; debug). The kernel, mail and session lines all match their selectors — and an auth.err would still land in the secure log (auth,authpriv.* takes everything), so the config never drops auth messages. Misfiled logs are lost logs: severity and facility routing deserve the same review as firewall rules.',
fx:'Recite the 8 severities top-down (emerg…debug) until selector math is instant — half of syslog questions are ordering questions.'
});

EX.push({
t:'spot', ti:'The capture that lost the evidence', th:'Network data sources',
k:['Packet captures','tcpdump / Wireshark','Hashing & log integrity'], p:3,
sc:'The analyst\u2019s capture workflow for the suspicious TLS host looked professional: filtered, saved, hashed, copied to evidence. Yet when Wireshark opened the file, every packet was a header stub — no SNI, no bytes, nothing to analyse.',
q:'Click the line that quietly destroyed the capture\u2019s evidential value.',
d:{
lines:[
 '# capture TLS to the suspicious host for the case file',
 'tcpdump -i eth0 -s 96 -w /pcaps/tls.pcap host 198[.]51[.]100[.]80 and port 443',
 '# later: quick verification of the capture',
 'tcpdump -nn -r /pcaps/tls.pcap | head',
 '# hand-off to evidence',
 'sha256sum /pcaps/tls.pcap > evidence-hash.txt',
 'cp /pcaps/tls.pcap /mnt/evidence/case-2214/'
],
wrong:1},
h:'One flag on the capture line caps how much of each packet is stored. TLS handshakes and SNI names live far beyond 96 bytes.',
ex:'The <code>-s 96</code> snapshot length truncates every packet to 96 bytes — headers survive, payloads die. The TLS ClientHello with its SNI name, the application data, everything an analyst needs sits beyond that cut, so the capture is permanently blinded: hashing a useless file perfectly preserves its uselessness (the hash and the copy were done correctly, which makes the flaw sadder, not better). Full-fidelity captures use <code>-s 0</code> (or no -s on modern tcpdump, which defaults to capturing whole packets). Snapshot length is the quietest way to lose a case — the file looks complete, the packets are hollow.',
fx:'Default capture command: -i, filter, -w — and -s 0 when payload matters. Verify payload presence before you hash and seal.'
});

EX.push({
t:'multi', ti:'Admissibility checklist: which actions keep evidence usable?', th:'Investigation integrity',
k:['Chain of custody','Hashing & log integrity','Legal hold','Log retention'], p:3,
sc:'The Kestrel legal team published a one-page "evidence handling" test. You are handed six actions seen in past incidents. Select the ones that keep digital evidence admissible — and deselect the ones that ruin it.',
q:'Select <b>every</b> action that preserves admissibility.',
d:{opts:[
 'Hash the image before and after every transfer, and compare the values',
 'Acquire disks through a hardware write-blocker',
 'Record every person who touches the evidence, with times, on the custody form',
 'Analyse a verified working copy; keep the original sealed',
 'Mount the original drive read-write for a faster keyword search',
 'Email a copy of the image to a personal mailbox as a backup'
], correct:[0,1,2,3]},
h:'Three verbs are sacred: verify (hash), block (write), record (custody). Two shortcuts above are the classic case-killers.',
ex:'Admissibility rests on integrity, accountability and proportionality. Hashing at every boundary makes any change detectable; write-blockers make acquisition non-destructive; the custody form makes the trail unbroken; copy-only analysis keeps originals pristine. Mounting the original read-write destroys the integrity guarantee the acquisition hash provides — one write, and the evidence is challengeable. The personal-mailbox copy breaks custody and confidentiality in one move, and it also dodges the legal-hold and retention controls that decide how long evidence lives. Four habits pass the test; two shortcuts fail it, every time, in every court.',
fx:'Legal hold pauses retention for a reason: evidence must outlive the case. Everything you do to evidence must be verifiable, blocked, recorded — and on the copy.'

EX.push({

k:['Dashboards & automated reports','Network traffic analysis','Log normalization'], p:3,
sc:'The automated weekly report flags: egress volume +160% in the 03:00–03:20 window, <b>every single day for six weeks</b>, including weekends and holidays. Top talker: BKPSRV-01. Destination: one internal repository and one cloud-storage endpoint, stable. Volume varies less than ±5%.',

 'Data theft — any nightly upload to cloud storage is theft by definition',

], correct:0},
h:'Regularity is the tell. Attacks vary; jobs repeat. Six weeks of ±5% at the same minutes is a machine\u2019s fingerprint.',
ex:'Machine schedules are metronomes: same window, same talker, same destinations, tiny variance, weekends included — that is a job, not an actor. Human-driven exfiltration wobbles: sizes, times and destinations shift as the attacker improvises. The defensible path is verification, not reaction: confirm the backup job\u2019s schedule and its two destinations, check the change calendar for when it started, then annotate the baseline so the report stops flagging it. Isolation and theft claims would cost the business a backup window for nothing, and "recalibrate and ignore" would bury the day this pattern actually changes — which is the real signal to watch.',

EX.push({
t:'branch', ti:'Phishing chain: from one click to campaign scope', th:'Log data & log types',
k:['Application logs','Authentication logs','Network traffic analysis','SIEM aggregation'], p:4,
sc:'09:05, <b>Kestrel Financial</b>. j.harper reports: clicked a "payroll update" link, entered credentials on a convincing page. The phish is under two hours old. Scope it like the campaign it almost certainly is.',
q:'Choose the best action at each step.',
d:{steps:[
 {ctx:'Credentials were typed. The domain is <code>kestrel-payroll[.]example</code>, registered two days ago.',
  q:'First move?',
  opts:[
   {t:'Pull proxy logs for who clicked the link and mail-gateway logs for everyone who received it', ok:true, fb:'Correct — one report is one data point; the logs reveal the campaign\u2019s true size in minutes.'},
   {t:'Reimage j.harper\u2019s laptop first and ask questions later', ok:false, fb:'The laptop is now the least interesting machine — credential theft lives in the identity plane, and imaging destroys browser evidence.'},
   {t:'Wait for more reports to confirm it is a campaign', ok:false, fb:'Waiting hands the attacker hours. The mail logs already know how many received it.'}
  ]},
 {ctx:'Proxy: 6 clicks. Mail gateway: sent to 40 recipients. j.harper and one more typed credentials.',
  q:'Contain the identity plane:',
  opts:[
   {t:'Force resets for both, then check authentication logs for logons from the phishing infrastructure addresses', ok:true, fb:'Correct — reset the exposed credentials and hunt for their immediate use.'},
   {t:'Reset only j.harper\u2019s password and close the ticket', ok:false, fb:'The second victim\u2019s credentials are equally live, and neither reset matters if you never check where they were used.'},
   {t:'Block the sender\u2019s display name at the gateway and call containment done', ok:false, fb:'Display names are trivially spoofed — the infrastructure (domain, addresses) is what you block.'}
  ]},
 {ctx:'Auth logs: one successful logon from the phish IP, followed by a new inbox rule "forward all to archive-box[.]evil[.]example" in the victim\u2019s mailbox.',
  q:'Finish the containment and the sweep:',
  opts:[
   {t:'Kill sessions and revoke tokens, remove the inbox rule, and sweep all 40 mailboxes for the same rule', ok:true, fb:'Correct — the rule is the attacker\u2019s persistence; the sweep finds every other mailbox where it lives.'},
   {t:'Delete the victim\u2019s mailbox to remove the rule', ok:false, fb:'Destroying the mailbox destroys the evidence of what was forwarded — and the rule is removable in seconds.'},
   {t:'Post the phishing screenshots on public social media to warn everyone', ok:false, fb:'Publicizing live infrastructure details warns the operator and burns your takedown options — warn staff through internal channels.'}
  ]}
]},
h:'Campaign math: log the recipients → reset the exposed → hunt the use → kill the persistence → sweep for siblings.',
ex:'Phishing response is a funnel. Mail and proxy logs convert one report into the campaign\u2019s real shape: who received, who clicked, who typed. Credential resets pair with authentication-log hunts — a reset without checking for use is half a job, and the auth logs showed exactly the use to fear. The inbox rule is the attacker\u2019s persistence inside the mailbox: sessions killed, tokens revoked, rule removed, then a sweep across all recipients because mass campaigns rarely stop at one rule. Public warnings and mailbox destruction both help the attacker more than the defenders.',
fx:'Remember the funnel: receive → click → type → logon → persist. Each stage has its own log; sweep every stage, not just the loudest.'
});

EX.push({

sc:'The report draft makes three claims about the intrusion. The reviewer demands proof — match each artifact to the claim it actually supports. Some artifacts prove more than one thing in life, but each has its strongest single home below.',

zones:[{id:'exec',label:'Proves execution'},{id:'net',label:'Proves network activity'},{id:'per',label:'Proves persistence'}],
items:[
 {id:'p1',label:'Event 4688: cmd.exe created by update_helper.exe',zone:'exec'},

 {id:'p6',label:'Amcache entry: update_helper ran at least once on this host',zone:'exec'}

h:'Execution = "it ran". Network = "it talked". Persistence = "it comes back". Match the artifact\u2019s question.',
ex:'Precise claims need matched artifacts. Execution is proven where process starts are recorded: 4688 process creation in real time, or the Amcache/shimcache inventory that remembers a run after the fact. Network activity is proven by connection records — the Sysmon network event ties the process to the connection, and the packet capture shows the sessions themselves on the wire. Persistence is proven by the mechanisms that restart software: a Run key, a scheduled task. Mixing them weakens reports ("the PCAP proves it executed" — it does not; it proves it talked). Reviewers attack exactly these mismatches.',

function makeRM(ex){

/* ---------- shared choice component (qcm / multi, also inside logviewer) ---------- */
function buildChoice(ex, d, rm, root, multi){
  var st = { sel: multi ? {} : null };
  var btns = [];
  rm.opt.forEach(function(orig, disp){
    var b = el('button', 'opt');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="key">' + String.fromCharCode(65 + disp) + '.</span><span class="ot">' + d.opts[orig] + '</span>';
    b.addEventListener('click', function(){
      if (multi){
        if (st.sel[orig]) delete st.sel[orig]; else st.sel[orig] = 1;
        b.setAttribute('aria-pressed', st.sel[orig] ? 'true' : 'false');
      } else {
        st.sel = orig;
        btns.forEach(function(x){ x.b.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
      }
    });
    btns.push({ orig: orig, b: b });
    root.appendChild(b);
  });
  function btnOfOrig(orig){ for (var k = 0; k < btns.length; k++) if (btns[k].orig === orig) return btns[k].b; return null; }
  return {
    read: function(){
      if (multi){ var arr = Object.keys(st.sel).map(Number).sort(function(a, b){ return a - b; }); return arr.length ? { set: arr } : null; }
      return st.sel == null ? null : { sel: st.sel };
    },
    grade: function(v){
      var marks = [];
      if (multi){
        var hits = 0;
        d.correct.forEach(function(c){ marks.push([btnOfOrig(c), v.set.indexOf(c) >= 0 ? 'm-ok' : 'm-miss']); if (v.set.indexOf(c) >= 0) hits++; });
        v.set.forEach(function(s){ if (d.correct.indexOf(s) < 0) marks.push([btnOfOrig(s), 'm-bad']); });
        return { earned0: ex.p * hits / d.correct.length, marks: marks };
      }
      var ok = v.sel === d.correct;
      marks.push([btnOfOrig(v.sel), ok ? 'm-ok' : 'm-bad']);
      if (!ok) marks.push([btnOfOrig(d.correct), 'm-reveal']);
      return { earned0: ok ? ex.p : 0, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ btns.forEach(function(x){ stripMarks([x.b]); }); },
    lock: function(on){ btns.forEach(function(x){ x.b.disabled = on; }); },
    yours: function(v){ return multi ? v.set.map(function(o){ return d.opts[o]; }).join(' · ') : d.opts[v.sel]; },
    correct: function(){ return multi ? d.correct.map(function(c){ return d.opts[c]; }).join(' · ') : d.opts[d.correct]; }
  };
}

/* ---------- match ---------- */
function buildMatch(ex, d, rm, root){

  var slots = [], chipEls = {}, allEls = [];

  root.appendChild(pool);
  rm.right.forEach(function(orig){
    var c = el('button', 'chip', esc(d.right[orig]));
    c.type = 'button'; c.draggable = true; c.setAttribute('aria-pressed', 'false');
    c.addEventListener('click', function(){
      if (st.assign.indexOf(orig) >= 0) return;
      st.sel = (st.sel === orig) ? null : orig;
      rm.right.forEach(function(k){ chipEls[k].setAttribute('aria-pressed', String(k === st.sel && st.sel !== null)); });
    });
    c.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', String(orig)); });
    chipEls[orig] = c; allEls.push(c); pool.appendChild(c);
  });
  d.left.forEach(function(L, li){
    var row = el('div', 'slotrow');
    row.appendChild(el('span', 'slot-l', L));
    var s = el('button', 'slot', '— drop here —');
    s.type = 'button';
    s.setAttribute('aria-label', 'Slot for: ' + L.replace(/<[^>]*>/g, '').trim());
    s.addEventListener('dragover', function(e){ e.preventDefault(); s.classList.add('dragover'); });

    s.addEventListener('drop', function(e){
      e.preventDefault(); s.classList.remove('dragover');
      var orig = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if (isNaN(orig) || orig < 0) return;
      var dup = st.assign.indexOf(orig);
      if (dup >= 0){ chipEls[orig].classList.remove('ghosted'); chipEls[orig].disabled = false; st.assign[dup] = -1; paint(dup); }
      if (st.assign[li] >= 0){ chipEls[st.assign[li]].classList.remove('ghosted'); chipEls[st.assign[li]].disabled = false; }
      st.assign[li] = orig;
      chipEls[orig].classList.add('ghosted'); chipEls[orig].disabled = true;
      st.sel = null; paint(li);
    });
    s.addEventListener('click', function(){
      if (st.assign[li] >= 0){
        var prev = st.assign[li];
        chipEls[prev].classList.remove('ghosted'); chipEls[prev].disabled = false;
        st.assign[li] = -1; paint(li); return;
      }
      if (st.sel != null){
        var dup = st.assign.indexOf(st.sel);
        if (dup >= 0){ chipEls[st.sel].classList.remove('ghosted'); chipEls[st.sel].disabled = false; st.assign[dup] = -1; paint(dup); }
        st.assign[li] = st.sel;
        chipEls[st.sel].classList.add('ghosted'); chipEls[st.sel].disabled = true;
        st.sel = null; paint(li);
      }
    });
    slots.push(s); allEls.push(s); row.appendChild(s); root.appendChild(row);
  });
  function paint(li){
    var s = slots[li];
    if (st.assign[li] >= 0){ s.textContent = d.right[st.assign[li]]; s.classList.add('filled'); }
    else { s.innerHTML = '— drop here —'; s.classList.remove('filled'); }
  }
  return {
    read: function(){ var placed = st.assign.some(function(v){ return v >= 0; }); return placed ? st.assign.slice() : null; },
    grade: function(v){
      var marks = [], ok = 0;
      v.forEach(function(val, li){
        var cls;
        if (val < 0) cls = 'm-miss';
        else {
          /* grade by chip TEXT, not index: identical chips are interchangeable */
          var good = plain(d.right[val]) === plain(d.right[d.correct[li]]);
          if (good) ok++;
          cls = good ? 'm-ok' : 'm-bad';
        }
        marks.push([slots[li], cls]);
      });
      return { earned0: ex.p * ok / d.left.length, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ stripMarks(allEls); },
    lock: function(on){ rm.right.forEach(function(k){ chipEls[k].disabled = on; }); slots.forEach(function(s){ s.disabled = on; }); },
    yours: function(v){ return v.map(function(val, li){ return plain(d.left[li]) + ' → ' + (val >= 0 ? d.right[val] : '(none)'); }).join(' · '); },
    correct: function(){ return d.left.map(function(L, li){ return plain(L) + ' → ' + d.right[d.correct[li]]; }).join(' · '); }
  };
}

/* ---------- dragdrop zones ---------- */
function buildDrag(ex, d, rm, root){
  var st = { place: {}, sel: null };
  d.items.forEach(function(it){ st.place[it.id] = '__pool'; });
  var pool = el('div', 'zone');
  pool.setAttribute('aria-label', 'Unassigned items');
  var zoneEls = {}, chipEls = {}, allEls = [];
  root.appendChild(el('div', 'pool-lbl', 'Unassigned — click a chip, then click a zone (or drag the chip)'));
  root.appendChild(pool);
  function chipFor(it){
    var c = el('button', 'chip', '<span class="ct">' + it.label + '</span><span class="backicon" role="button" aria-label="Return to tray" title="Return to tray" style="opacity:.65;margin-left:6px">↩</span>');
    c.type = 'button'; c.draggable = true; c.setAttribute('aria-pressed', 'false');
    c.addEventListener('click', function(e){
      if (e.target.classList && e.target.classList.contains('backicon')){
        place(it.id, '__pool'); st.sel = null; syncSel(); return;
      }
      st.sel = (st.sel === it.id) ? null : it.id;
      syncSel();
    });
    c.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', it.id); });
    chipEls[it.id] = c; allEls.push(c);
    return c;
  }
  function syncSel(){ d.items.forEach(function(it){ chipEls[it.id].setAttribute('aria-pressed', String(st.sel === it.id)); }); }
  function place(itemId, zoneId){
    if (!chipEls[itemId]) return;
    st.place[itemId] = zoneId;
    Object.keys(zoneEls).forEach(function(zid){ zoneEls[zid].body.innerHTML = ''; });
    pool.innerHTML = '';
    d.items.forEach(function(it){
      var tgt = st.place[it.id] === '__pool' ? pool : zoneEls[st.place[it.id]].body;
      tgt.appendChild(chipEls[it.id]);
    });
  }
  function zoneBox(z){
    var box = el('div', 'zone');
    box.setAttribute('aria-label', 'Zone: ' + z.label);
    var h = el('div', 'zone-h'); h.appendChild(el('span', 'zone-t', esc(z.label)));
    box.appendChild(h);
    var b = el('div', 'zone-b'); box.appendChild(b);
    box.addEventListener('dragover', function(e){ e.preventDefault(); box.classList.add('dragover'); });
    box.addEventListener('dragleave', function(){ box.classList.remove('dragover'); });
    box.addEventListener('drop', function(e){
      e.preventDefault(); box.classList.remove('dragover');
      place(e.dataTransfer.getData('text/plain'), z.id);
    });
    box.addEventListener('click', function(e){
      if (e.target.closest('.chip')) return;
      if (st.sel != null) place(st.sel, z.id);
    });
    zoneEls[z.id] = { box: box, body: b, label: z.label };
    root.appendChild(box);
  }
  rm.items.forEach(function(ii){ pool.appendChild(chipFor(d.items[ii])); });
  d.zones.forEach(zoneBox);
  pool.addEventListener('dragover', function(e){ e.preventDefault(); });
  pool.addEventListener('drop', function(e){ e.preventDefault(); place(e.dataTransfer.getData('text/plain'), '__pool'); });
  return {
    read: function(){
      var placed = d.items.some(function(it){ return st.place[it.id] !== '__pool'; });
      if (!placed) return null;
      var o = {}; d.items.forEach(function(it){ o[it.id] = st.place[it.id]; });
      return o;
    },
    grade: function(v){
      var marks = [], ok = 0;
      d.items.forEach(function(it){
        var cls;
        if (v[it.id] === it.zone){ cls = 'm-ok'; ok++; }
        else if (v[it.id] === '__pool') cls = 'm-miss';
        else cls = 'm-bad';
        marks.push([chipEls[it.id], cls]);
      });
      return { earned0: ex.p * ok / d.items.length, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ stripMarks(allEls); },
    lock: function(on){ d.items.forEach(function(it){ chipEls[it.id].disabled = on; }); },
    yours: function(v){
      return d.items.map(function(it){
        var zl = v[it.id] === '__pool' ? '(unassigned)' : (zoneEls[v[it.id]] ? zoneEls[v[it.id]].label : v[it.id]);
        return it.label + ' → ' + zl;
      }).join(' · ');
    },
    correct: function(){
      return d.items.map(function(it){
        var zl = it.zone;
        d.zones.forEach(function(z){ if (z.id === it.zone) zl = z.label; });
        return it.label + ' → ' + zl;
      }).join(' · ');
    }
  };
}

/* ---------- order / rank ---------- */
function buildOrder(ex, d, rm, root){
  var rows = rm.rows.slice();
  var listEl = el('div'); root.appendChild(listEl);
  var rowEls = [], allEls = [];
  function paint(){
    listEl.innerHTML = '';
    rowEls = [];
    rows.forEach(function(orig, pos){
      var r = el('div', 'orow');
      r.draggable = true;
      r.appendChild(el('span', 'o-n', (pos + 1) + '.'));
      r.appendChild(el('span', 'handle', '⠿'));
      r.appendChild(el('span', 'olabel', d.items[orig]));
      var up = el('button', 'btn small mini', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' up');
      var dn = el('button', 'btn small mini', '▼'); dn.type = 'button'; dn.setAttribute('aria-label', 'Move item ' + (pos + 1) + ' down');
      up.addEventListener('click', function(){ if (pos > 0){ var t = rows[pos - 1]; rows[pos - 1] = rows[pos]; rows[pos] = t; paint(); } });
      dn.addEventListener('click', function(){ if (pos < rows.length - 1){ var t = rows[pos + 1]; rows[pos + 1] = rows[pos]; rows[pos] = t; paint(); } });
      r.appendChild(up); r.appendChild(dn);
      r.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', String(pos)); r.classList.add('dragging'); });
      r.addEventListener('dragend', function(){ r.classList.remove('dragging'); });
      r.addEventListener('dragover', function(e){ e.preventDefault(); });
      r.addEventListener('drop', function(e){
        e.preventDefault();
        var from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(from) || from === pos) return;
        var item = rows.splice(from, 1)[0];
        rows.splice(pos, 0, item);
        paint();
      });
      rowEls.push(r); allEls.push(r);
      listEl.appendChild(r);
    });
  }
  paint();
  return {
    read: function(){ return rows.slice(); },
    grade: function(v){
      var marks = [], ok = 0;
      v.forEach(function(orig, pos){
        var good = orig === d.order[pos];
        if (good) ok++;
        marks.push([rowEls[pos], good ? 'm-ok' : 'm-bad']);
      });
      return { earned0: ex.p * ok / d.order.length, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ stripMarks(allEls); },
    lock: function(on){ $$('button', listEl).forEach(function(b){ b.disabled = on; }); $$('.orow', listEl).forEach(function(r){ r.draggable = !on; }); },
    yours: function(v){ return v.map(function(o, i){ return (i + 1) + '. ' + plain(d.items[o]); }).join(' | '); },
    correct: function(){ return d.order.map(function(o, i){ return (i + 1) + '. ' + plain(d.items[o]); }).join(' | '); }
  };
}

/* ---------- blank ---------- */
function buildBlank(ex, d, rm, root){
  var st = { assign: d.accepted.map(function(){ return -1; }), sel: null };
  var sent = el('div', 'sentence');
  var parts = d.text.split(/\{\{(\d+)\}\}/);
  var gapEls = [], chipEls = {}, allEls = [];
  for (var i = 0; i < parts.length; i++){
    if (i % 2 === 0){ if (parts[i]) sent.appendChild(el('span', null, parts[i])); }
    else {
      (function(si){
        var g = el('button', 'gap', 'gap ' + (si + 1));
        g.type = 'button';
        g.setAttribute('aria-label', 'Gap ' + (si + 1) + ', empty');
        g.addEventListener('click', function(){
          if (st.assign[si] >= 0){
            chipEls[st.assign[si]].classList.remove('ghosted'); chipEls[st.assign[si]].disabled = false;
            st.assign[si] = -1; paint(si); return;
          }
          if (st.sel != null){
            var dup = st.assign.indexOf(st.sel);
            if (dup >= 0){ st.assign[dup] = -1; paint(dup); }
            st.assign[si] = st.sel;
            chipEls[st.sel].classList.add('ghosted'); chipEls[st.sel].disabled = true;
            st.sel = null; paint(si);
          }
        });
        gapEls[si] = g; allEls.push(g); sent.appendChild(g);
      })(parseInt(parts[i], 10));
    }
  }
  root.appendChild(sent);
  root.appendChild(el('div', 'pool-lbl', 'Word bank — click a word, then a gap'));
  var pool = el('div', 'pool'); root.appendChild(pool);
  rm.bank.forEach(function(bi){
    var c = el('button', 'chip', esc(d.bank[bi]));
    c.type = 'button'; c.setAttribute('aria-pressed', 'false');
    c.addEventListener('click', function(){
      if (st.assign.indexOf(bi) >= 0) return;
      st.sel = (st.sel === bi) ? null : bi;
      rm.bank.forEach(function(k){ chipEls[k].setAttribute('aria-pressed', String(k === st.sel && st.sel !== null)); });
    });
    chipEls[bi] = c; allEls.push(c); pool.appendChild(c);
  });
  function paint(si){
    var g = gapEls[si];
    if (st.assign[si] >= 0){ g.textContent = d.bank[st.assign[si]]; g.classList.add('filled'); g.setAttribute('aria-label', 'Gap ' + (si + 1) + ': ' + d.bank[st.assign[si]]); }
    else { g.textContent = 'gap ' + (si + 1); g.classList.remove('filled'); g.setAttribute('aria-label', 'Gap ' + (si + 1) + ', empty'); }
  }
  return {
    read: function(){ var touched = st.assign.some(function(bi){ return bi >= 0; }); return touched ? st.assign.slice() : null; },
    grade: function(v){
      var marks = [], ok = 0;
      v.forEach(function(bi, si){
        var good = false;
        if (bi >= 0) good = d.accepted[si].some(function(acc){ return norm(acc) === norm(d.bank[bi]); });
        if (good) ok++;
        marks.push([gapEls[si], bi < 0 ? 'm-miss' : (good ? 'm-ok' : 'm-bad')]);
      });
      return { earned0: ex.p * ok / d.accepted.length, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ stripMarks(allEls); },
    lock: function(on){ rm.bank.forEach(function(k){ chipEls[k].disabled = on; }); gapEls.forEach(function(g){ if (g) g.disabled = on; }); },
    yours: function(v){ return v.map(function(bi, si){ return 'gap ' + (si + 1) + ': ' + (bi >= 0 ? d.bank[bi] : '(empty)'); }).join(' · '); },
    correct: function(){ return d.accepted.map(function(acc, si){ return 'gap ' + (si + 1) + ': ' + acc[0]; }).join(' · '); }
  };
}

/* ---------- terminal ---------- */
function buildTerm(ex, d, rm, root){
  var st = { cmds: [] };
  var goals = d.goals.map(function(g){ return { re: new RegExp(g.re, 'i'), el: null, ok: false, label: g.label }; });
  var shows = (d.show || []).map(function(s){ return { re: new RegExp(s.when, 'i'), out: s.out }; });
  var out = el('div', 'term-out'); out.setAttribute('aria-live', 'polite');
  if (d.boot) out.textContent = d.boot + '\n';
  var inp = el('input'); inp.type = 'text'; inp.setAttribute('aria-label', 'Terminal input'); inp.autocomplete = 'off'; inp.spellcheck = false;
  var run = el('button', 'btn small', 'Run'); run.type = 'button';
  var line = el('div', 'term-in');
  line.appendChild(el('span', 'term-ps', d.prompt));
  line.appendChild(inp); line.appendChild(run);
  var term = el('div', 'term'); term.appendChild(out); term.appendChild(line);
  root.appendChild(term);
  var gwrap = el('div', 'goals'); root.appendChild(gwrap);
  goals.forEach(function(g){
    var chip = el('span', 'goal', '· ' + g.label);
    g.el = chip; gwrap.appendChild(chip);
  });
  function print(txt){ out.textContent += txt + '\n'; out.scrollTop = out.scrollHeight; }
  function evalGoals(){
    goals.forEach(function(g){
      g.ok = st.cmds.some(function(c){ return g.re.test(c); });
      g.el.classList.toggle('g-ok', g.ok);
      g.el.textContent = (g.ok ? '✓ ' : '· ') + g.label;
    });
  }
  function submit(){
    var cmd = inp.value.trim();
    if (!cmd) return;
    inp.value = '';
    st.cmds.push(cmd);
    print(d.prompt + ' ' + cmd);
    var low = cmd.toLowerCase();
    if (low === 'clear'){ out.textContent = ''; }
    else if (low === 'help'){ print(d.help || 'No help available. Work from the goals.'); }
    else if (low === 'ls' && d.ls){ print(d.ls); }
    else {
      var hit = false;
      for (var si = 0; si < shows.length; si++){
        if (shows[si].re.test(cmd)){ print(shows[si].out); hit = true; break; }   /* first matching rule only */
      }
      if (!hit) print('ran. (Simulated shell — commands that satisfy a goal are what matter here.)');
    }
    evalGoals();
  }
  run.addEventListener('click', submit);
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
  return {
    read: function(){ return st.cmds.length ? { met: goals.map(function(g){ return g.ok; }), cmds: st.cmds.slice() } : null; },
    grade: function(v){
      var marks = [], ok = 0;
      goals.forEach(function(g, i){
        if (v.met[i]){ marks.push([g.el, 'm-ok']); ok++; } else marks.push([g.el, 'm-miss']);
      });
      return { earned0: ex.p * ok / goals.length, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ goals.forEach(function(g){ stripMarks([g.el]); }); },
    lock: function(on){ inp.disabled = on; run.disabled = on; },
    yours: function(v){ return v.cmds.slice(0, 6).join(' ; ') || '(no commands)'; },
    correct: function(){ return d.example || d.goals.map(function(g){ return g.label; }).join(' · '); }
  };
}

/* ---------- logviewer ---------- */
function buildLog(ex, d, rm, root){
  var bar = el('div', 'lv-bar');
  var f = el('input'); f.type = 'text'; f.placeholder = 'Filter lines (case-insensitive, e.g. 4625 or UNION)'; f.setAttribute('aria-label', 'Filter log lines');
  var cnt = el('span', 'lv-count');
  bar.appendChild(f); bar.appendChild(cnt);
  root.appendChild(bar);
  var wrap = el('div', 'lv-wrap'); var box = el('div', 'loglines'); wrap.appendChild(box); root.appendChild(wrap);
  function paint(fv){
    var q = (fv || '').toLowerCase();
    var shown = 0;
    box.innerHTML = '';
    d.logs.forEach(function(l){
      if (q && l.toLowerCase().indexOf(q) < 0) return;
      shown++;
      box.appendChild(el('div', 'ln', esc(l)));
    });
    if (!shown) box.appendChild(el('div', 'ln', '— no lines match this filter —'));

/* ---------- branch ---------- */
function buildBranch(ex, d, rm, root){
  var st = { step: 0, choices: [] };
  var stage = el('div'); root.appendChild(stage);
  function render(){
    stage.innerHTML = '';
    if (st.step >= d.steps.length){
      stage.appendChild(el('p', 'dim', 'Scenario complete — press Check to validate your decisions.'));
      return;
    }
    var s = d.steps[st.step];
    var box = el('div', 'bstep');
    box.appendChild(el('div', 'bs-t', 'Step ' + (st.step + 1) + ' of ' + d.steps.length));
    if (s.ctx) box.appendChild(el('div', null, s.ctx));
    box.appendChild(el('p', null, '<b>' + s.q + '</b>'));
    stage.appendChild(box);
    var chosen = st.choices[st.step];
    rm.steps[st.step].forEach(function(oi){
      if (chosen != null && oi !== chosen.opt) return;
      var o = s.opts[oi];
      var b = el('button', 'opt', '<span class="ot">' + o.t + '</span>');
      b.type = 'button';
      b.disabled = chosen != null;
      b.addEventListener('click', function(){
        if (st.choices[st.step] != null) return;
        st.choices[st.step] = { opt: oi, ok: !!o.ok };
        render();
      });
      box.appendChild(b);
    });
    if (chosen != null){
      var o = s.opts[chosen.opt];
      var fb = el('div', 'bfb ' + (chosen.ok ? 'ok' : 'bad'), (chosen.ok ? '✓ Good call. ' : '✗ Not the best path. ') + o.fb);
      stage.appendChild(fb);
      var nxt = el('button', 'btn primary', st.step + 1 < d.steps.length ? 'Continue ›' : 'End of scenario — press Check');
      nxt.type = 'button';
      nxt.addEventListener('click', function(){ st.step++; render(); window.scrollTo(0, document.body.scrollHeight); });
      stage.appendChild(nxt);
    }
  }
  render();
  return {
    read: function(){ return st.choices.length === d.steps.length ? { choices: st.choices.slice() } : null; },
    grade: function(v){
      var ok = 0;
      v.choices.forEach(function(c){ if (c.ok) ok++; });
      return { earned0: ex.p * ok / d.steps.length, marks: [] };
    },
    mark: function(){
      /* review mode: show every step with its chosen option marked */
      stage.innerHTML = '';
      d.steps.forEach(function(s, si){
        var c = st.choices[si];
        if (c == null) return;
        var o = s.opts[c.opt];
        var box = el('div', 'bstep');
        box.appendChild(el('div', 'bs-t', 'Step ' + (si + 1) + ' of ' + d.steps.length));
        if (s.ctx) box.appendChild(el('div', null, s.ctx));
        var b = el('button', 'opt', '<span class="ot">' + o.t + '</span>');
        b.type = 'button';
        b.disabled = true;
        b.classList.add(c.ok ? 'm-ok' : 'm-bad');
        box.appendChild(b);
        stage.appendChild(box);
      });
    },
    clear: function(){},
    lock: function(on){},
    reset: function(){ st.step = 0; st.choices = []; render(); },
    yours: function(v){ return v.choices.map(function(c, si){ return 'Step ' + (si + 1) + ': ' + d.steps[si].opts[c.opt].t.slice(0, 80); }).join(' | '); },
    correct: function(){
      return d.steps.map(function(s, si){
        var good = null;
        s.opts.forEach(function(o){ if (o.ok) good = o; });
        return 'Step ' + (si + 1) + ': ' + (good ? good.t.slice(0, 80) : '');
      }).join(' | ');
    }
  };
}

/* ---------- spot the mistake ---------- */
function buildSpot(ex, d, rm, root){
  var st = { sel: null };
  var rows = [];
  var wrap = el('div', 'blk art'); wrap.style.padding = '6px';
  d.lines.forEach(function(l, li){
    var b = el('button', 'sline');
    b.type = 'button';
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', 'Line ' + (li + 1));
    b.innerHTML = '<span class="o-n" style="color:var(--dim2)">' + (li + 1) + '</span><span style="white-space:pre-wrap">' + esc(l) + '</span>';
    b.addEventListener('click', function(){
      st.sel = li;
      rows.forEach(function(r){ r.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
    });
    rows.push(b); wrap.appendChild(b);
  });
  root.appendChild(wrap);
  return {
    read: function(){ return st.sel == null ? null : { sel: st.sel }; },
    grade: function(v){
      var marks = [];
      marks.push([rows[v.sel], v.sel === d.wrong ? 'm-ok' : 'm-bad']);
      if (v.sel !== d.wrong) marks.push([rows[d.wrong], 'm-reveal']);
      return { earned0: v.sel === d.wrong ? ex.p : 0, marks: marks };
    },
    mark: applyMarks,
    clear: function(){ stripMarks(rows); },
    lock: function(on){ rows.forEach(function(r){ r.disabled = on; }); },
    yours: function(v){ return 'Line ' + (v.sel + 1) + ': ' + d.lines[v.sel].slice(0, 80); },
    correct: function(){ return 'Line ' + (d.wrong + 1) + ': ' + d.lines[d.wrong].slice(0, 80); }
  };
}

var BUILDERS = { qcm: null, multi: null, match: buildMatch, dragdrop: buildDrag, order: buildOrder, rank: buildOrder, blank: buildBlank, terminal: buildTerm, logviewer: buildLog, branch: buildBranch, spot: buildSpot };

/* ======== view assembly + exam flow ======== */
function buildView(i){
  var ex = EX[i];
  var card = el('div', 'card');
  card.style.position = 'relative';

  /* header */
  var ch = el('div', 'card-h');
  ch.appendChild(el('span', 'badge sev ' + (CFG.sev === 'medium' ? 'med' : 'hard'), CFG.sev === 'medium' ? 'MEDIUM' : 'HARD'));
  var h = el('h2', null, esc(ex.ti));
  ch.appendChild(h);
  ch.appendChild(el('span', 'pts', ex.p + ' pts · ' + esc(ex.th)));
  card.appendChild(ch);

  /* scenario */
  var sc = el('section', 'blk sc');
  sc.appendChild(el('div', 'blk-l', 'Scenario'));
  sc.appendChild(el('div', null, ex.sc));
  card.appendChild(sc);

  /* artifacts */
  if (ex.art){
    var art = el('section', 'blk art');
    art.appendChild(el('div', 'blk-l', ex.artLabel || 'Artifacts'));
    if (ex.t === 'spot'){ /* spot renders its own line area */ }
    var pre = el('pre', 'art'); pre.innerHTML = ex.art;
    art.appendChild(pre);
    card.appendChild(art);
  }

  /* question */
  var q = el('section', 'blk q');
  q.appendChild(el('div', 'blk-l', 'Question'));
  q.appendChild(el('div', null, ex.q));
  card.appendChild(q);

  /* answers */
  var an = el('section', 'blk an');
  an.appendChild(el('div', 'blk-l', ANSWER_LABEL[ex.t]));
  an.appendChild(el('p', 'dim small', HOWTO[ex.t]));
  var ansRoot = el('div');
  an.appendChild(ansRoot);
  if (ex.t !== 'branch') an.insertAdjacentHTML('beforeend', LEGEND);
  card.appendChild(an);

  var api = null;
  if (ex.t === 'qcm') api = buildChoice(ex, ex.d, makeRM(ex), ansRoot, false);
  else if (ex.t === 'multi') api = buildChoice(ex, ex.d, makeRM(ex), ansRoot, true);
  else if (ex.t === 'logviewer') api = buildLog(ex, ex.d, makeRM(ex), ansRoot);
  else api = BUILDERS[ex.t](ex, ex.d, makeRM(ex), ansRoot);

  /* actions */
  var acts = el('div', 'acts');
  var hintBtn = el('button', 'btn small', '💡 Hint (−10%)'); hintBtn.type = 'button';
  var checkBtn = el('button', 'btn primary', '✓ Check'); checkBtn.type = 'button';
  var reviseBtn = el('button', 'btn small', '✎ Revise'); reviseBtn.type = 'button'; reviseBtn.hidden = true;
  var skipBtn = el('button', 'btn small ghost', 'Skip ⇥'); skipBtn.type = 'button';
  acts.appendChild(hintBtn); acts.appendChild(checkBtn); acts.appendChild(reviseBtn); acts.appendChild(skipBtn);
  card.appendChild(acts);

  var notice = el('div', 'notice'); card.appendChild(notice);
  var hintbox = el('div', 'hintbox'); hintbox.hidden = true; hintbox.innerHTML = '💡 <b>Hint:</b> ' + ex.h; card.appendChild(hintbox);
  var fb = el('div', 'fb'); fb.hidden = true; card.appendChild(fb);
  var expl = el('div', 'expl'); expl.hidden = true;
  expl.innerHTML = '<div class="ex-t">Explanation — why</div>' + ex.ex +
    '<div class="focus"><b>Focus next time:</b> ' + ex.fx + '</div>';
  card.appendChild(expl);

  var view = { node: card, api: api, notice: notice, fb: fb, expl: expl, hintbox: hintbox, checkBtn: checkBtn, reviseBtn: reviseBtn, hintBtn: hintBtn, skipBtn: skipBtn, locked: false };

  hintBtn.addEventListener('click', function(){
    var a = S.ans[i];
    if (!a.hint){ a.hint = true; hintBtn.textContent = '💡 Hint used (−10%)'; hintBtn.disabled = true; }
    hintbox.hidden = !hintbox.hidden;
  });
  checkBtn.addEventListener('click', function(){
    var a = S.ans[i];
    if (a.checked){
      /* Spec edge case: re-Checking a locked exercise re-applies the Check-pause. */
      notice.textContent = 'Already checked — answer locked. Review mode: the timer stays paused until you press Next.';
      if (!S.finished){ S.checkPause = true; updPauseInd(); }
      return;
    }
    var ok = doCheck(i, false);
    if (ok) notice.textContent = '';
  });
  reviseBtn.addEventListener('click', function(){
    var a = S.ans[i];
    a.checked = false;
    api.clear();
    if (api.reset) api.reset();
    view.lock(false);
    fb.hidden = true; expl.hidden = true; reviseBtn.hidden = true;
    notice.textContent = 'Answer unlocked — change it, then press Check again. Your last checked answer is what counts until then.';
    if (S.checkPause){ /* stays paused; only Next resumes */ }
    updPauseInd();
  });
  skipBtn.addEventListener('click', function(){
    var a = S.ans[i];
    if (!a.counted) a.skipped = true;
    nextQ();
  });

  view.lock = function(on){
    api.lock(on);
    /* Check stays clickable on a locked exercise: re-Checking re-applies the Check-pause (spec edge case). */
    checkBtn.disabled = false;
    skipBtn.disabled = on;
    hintBtn.disabled = on || S.ans[i].hint;
  };
  view.lock(false);
  return view;
}

/* ---------- check ---------- */
function doCheck(i, silent){
  var ex = EX[i], a = S.ans[i], view = views[i];
  if (!view) return false;
  var api = view.api;
  var v = api.read();
  if (v == null){
    if (!silent) view.notice.textContent = 'Nothing to check yet — give an answer first, or press Skip to come back later.';
    return false;
  }
  var g = api.grade(v);
  var earned = g.earned0 * (a.hint ? 0.9 : 1);
  earned = Math.round(earned * 100) / 100;
  a.v = v; a.checked = true; a.counted = true; a.skipped = false;
  a.earned = earned; a.yours = api.yours(v); a.correct = api.correct();
  if (!silent){
    view.notice.textContent = '';
    api.mark(g.marks);
    api.lock(true);
    view.locked = true;
    var mx = ex.p;
    var label = earned >= mx - 0.001 ? 'Full' : (earned <= 0.001 ? 'Zero' : 'Partial');
    var cls = label === 'Full' ? 'ok' : (label === 'Zero' ? 'zero' : 'part');
    var extra = a.hint ? ' <span class="dim">(includes −10% hint cost)</span>' : '';
    view.fb.hidden = false;
    view.fb.innerHTML = '<div class="fb-line ' + cls + '">You earned ' + fmtPts(earned) + ' / ' + mx + ' points — ' + label + '</div>' + extra;
    view.expl.hidden = false;
    view.reviseBtn.hidden = false;
    view.lock(true);
    S.checkPause = true;           /* Check-pause: timer frozen, content stays visible */
    updPauseInd();
  }
  updScore(); updNav(); updProgress(); updThemeChips();
  return true;
}

/* ---------- submit & results ---------- */
function countSkipped(){ return S.ans.filter(function(a){ return a.skipped; }).length; }

function submitPrompt(){
  if (S.finished) return;
  var skipped = countSkipped(), answered = 0, answerable = 0, untouched = 0;
  S.ans.forEach(function(a, i){
    if (a.skipped) return;
    if (a.counted) answered++;
    else {
      var v = views[i] ? views[i].api.read() : null;
      if (v != null) answerable++; else untouched++;
    }
  });
  if (answered + answerable === 0){
    showModal('<b>Cannot submit.</b><p class="dim">No exercise is answered. Answer at least one exercise — the exam cannot be scored with zero answers.</p>',
      [{ label: 'Go back', cls: 'primary', fn: function(){} }]);
    return;
  }
  var msg = '<b>Submit the exam?</b><p class="dim">Checked: ' + answered + ' · Answered, graded on submit: ' + answerable +
    ' · Skipped (excluded from scoring): ' + skipped;
  if (untouched > 0) msg += ' · Not answered (excluded from scoring): ' + untouched;
  msg += '</p>';
  showModal(msg, [
    { label: 'Keep working', fn: function(){} },
    { label: 'Submit exam', cls: 'primary', fn: function(){ finishExam(false); } }
  ]);
}

function finishExam(auto){
  if (S.finished) return;
  S.finished = true;
  /* silently grade answered-but-never-checked exercises */
  S.ans.forEach(function(a, i){
    if (!a.counted && !a.skipped && views[i]){
      var v = views[i].api.read();
      if (v != null) doCheck(i, true);
    }
  });
  /* Score contract (site 6.2 rule 4): total counts ONLY exercises actually answered.
     Skipped and never-answered exercises are excluded from BOTH numerator and denominator. */
  var total = 0, earned = 0;
  EX.forEach(function(ex, i){
    var a = S.ans[i];
    if (a.skipped || !a.counted) return;
    total += ex.p;
    if (a.earned != null) earned += a.earned;
  });
  /* Round once; percent and the reported message must agree with the screen figure. */
  var rScore = Math.round(earned), rTotal = Math.round(total);
  var percent = rTotal > 0 ? Math.round(rScore / rTotal * 100) : 0;
  var passed = percent >= CFG.passMark;
  renderResults(earned, total, rScore, rTotal, percent, passed, auto);
  show('#scr-res');
  if (!S.reported){
    S.reported = true;
    reportScore(rScore, rTotal);
  }
}

function reportScore(correct, total){
  var percent = total > 0 ? Math.round((correct / total) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: CFG.topicId,
      score: correct,
      total: total,
      percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch (e) { /* Opened directly rather than inside the site. Nothing to report to. */ }
}

function renderResults(earned, total, rScore, rTotal, percent, passed, auto){
  var r = $('#scr-res');
  r.innerHTML = '';
  var hero = el('div', 'res-hero ' + (passed ? 'pass' : 'fail'));
  var verdict = passed ? 'PASS' : 'FAIL';
  var sub = passed
    ? 'Certificate-style success — you mastered this ' + (CFG.sev === 'medium' ? 'MEDIUM' : 'HARD') + ' exam' + (USERNAME ? ', ' + USERNAME : '') + '.'
    : 'You must retake this exam to reach the ' + CFG.passMark + '% pass mark.';
  hero.innerHTML = '<div class="verdict">' + verdict + (auto ? ' <span class="small dim">(time expired)</span>' : '') + '</div>' +
    '<div class="big">' + percent + '%</div>' +
    '<p>You earned <b>' + fmtPts(earned) + '</b> of <b>' + fmtPts(total) + '</b> points over scored (non-skipped, answered) exercises. ' +
    'Score reported to the site: <b>' + rScore + ' / ' + rTotal + '</b>. Pass mark: ' + CFG.passMark + '%.</p>' +
    '<p class="dim">' + sub + '</p>';
  r.appendChild(hero);

  var full = 0, part = 0, zero = 0, skipped = 0, notAns = 0;
  S.ans.forEach(function(a, i){
    if (a.skipped) skipped++;
    else if (a.counted && a.earned != null){
      var mx = EX[i].p;
      if (a.earned >= mx - 0.001) full++; else if (a.earned <= 0.001) zero++; else part++;
    } else notAns++;
  });
  var sum = el('div', 'res-sum');
  sum.appendChild(el('span', 'meta-chip', '<b style="color:var(--ok)">Full:</b> ' + full));
  sum.appendChild(el('span', 'meta-chip', '<b style="color:var(--warn)">Partial:</b> ' + part));
  sum.appendChild(el('span', 'meta-chip', '<b style="color:var(--bad)">Zero:</b> ' + zero));
  sum.appendChild(el('span', 'meta-chip', '<b style="color:var(--warn)">Skipped (not counted):</b> ' + skipped));
  if (notAns) sum.appendChild(el('span', 'meta-chip', '<b style="color:var(--warn)">Not answered (not counted):</b> ' + notAns));
  r.appendChild(sum);

  var sk = [];
  S.order.forEach(function(exIdx, pos){ if (S.ans[exIdx].skipped) sk.push('Q' + (pos + 1)); });
  var na = [];
  S.order.forEach(function(exIdx, pos){ var a = S.ans[exIdx]; if (!a.skipped && !a.counted) na.push('Q' + (pos + 1)); });
  if (sk.length){
    r.appendChild(el('p', 'small', '⚠ Skipped and excluded from scoring: <b>' + sk.join(', ') + '</b>. Their points were removed from both your score and the total.'));
  }
  if (na.length){
    r.appendChild(el('p', 'small', '⚠ Never answered and excluded from scoring: <b>' + na.join(', ') + '</b>.'));
  }

  r.appendChild(el('h2', null, 'Detailed report'));
  var tbl = el('table', 'rep');
  tbl.innerHTML = '<thead><tr><th>#</th><th>Exercise</th><th>Result</th><th>Points</th><th>Your answer</th><th>Correct answer</th></tr></thead><tbody></tbody>';
  var tb = tbl.querySelector('tbody');
  S.order.forEach(function(exIdx, pos){
    var ex = EX[exIdx], a = S.ans[exIdx];
    var tr = document.createElement('tr');
    var lab, labCls, pts;
    if (a.skipped){ lab = 'Skipped — not counted'; labCls = 'skipped'; pts = '—'; }
    else if (a.counted && a.earned != null){
      var mx = ex.p;
      lab = a.earned >= mx - 0.001 ? 'Full' : (a.earned <= 0.001 ? 'Zero' : 'Partial');
      labCls = lab.toLowerCase();
      pts = fmtPts(a.earned) + ' / ' + mx + (a.hint ? ' <span class="dim">(hint −10%)</span>' : '');
    } else { lab = 'Not answered — not counted'; labCls = 'skipped'; pts = '—'; }
    var yourTxt = a.counted && a.yours ? esc(a.yours) : '<i class="dim">No answer given.</i>';
    var corrTxt = esc(a.correct || '');
    tr.innerHTML = '<td>' + (pos + 1) + '</td><td>' + esc(ex.ti) + '<div class="det">' + ex.ex +
      '<div style="margin-top:6px"><b>Focus next time:</b> ' + ex.fx + '</div></div></td>' +
      '<td><span class="lab ' + labCls + '">' + lab + '</span></td>' +
      '<td>' + pts + '</td><td>' + yourTxt + '</td><td>' + (a.skipped ? '<i class="dim">Exercise skipped — not counted in your score.</i>' : corrTxt) + '</td>';
    tb.appendChild(tr);
  });
  r.appendChild(tbl);

  var acts = el('div', 'acts'); acts.style.justifyContent = 'center';
  var retake = el('button', 'btn primary big', '↻ Retake exam');
  retake.type = 'button';
  retake.addEventListener('click', retakeExam);
  acts.appendChild(retake);
  r.appendChild(acts);
}

function retakeExam(){
  EX.forEach(function(ex){ delete ex._rm; });   /* reshuffle everything on retry */
  S = newState();
  views = [];
  renderExamChrome();
  show('#scr-exam');
  renderCur();
  S.started = true;
  updTimer();
}

/* ---------- chrome & boot ---------- */
function renderExamChrome(){
  $('#h-title').textContent = CFG.shortTitle;
}
function startExam(){
  S = newState();
  views = [];
  renderExamChrome();
  show('#scr-exam');
  renderCur();
  S.started = true;
  updTimer();
}

window.addEventListener('message', function(event){
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  /* event.data.username / country / theme / locale / topicId / batch */
  if (event.data.username){
    USERNAME = String(event.data.username).slice(0, 40);
    var g = $('#in-greet');
    if (g) g.textContent = 'Welcome, ' + USERNAME + '. Good luck on this attempt.';
  }
  /* theme: this file ships dark-only, so the site theme is intentionally not applied */
});

document.addEventListener('DOMContentLoaded', function(){
  renderIntro();
  $('#btn-start').addEventListener('click', startExam);
  $('#btn-pause').addEventListener('click', togglePause);
  $('#btn-submit').addEventListener('click', submitPrompt);
  $('#btn-prev').addEventListener('click', prevQ);
  $('#btn-next').addEventListener('click', nextQ);
  tickId = setInterval(tick, 1000);
});

/* test hooks (also handy for power users) */
window.__exam = {
  state: function(){ return S; },
  setRemaining: function(n){ if (S){ S.remaining = n; updTimer(); } },
  countMessages: function(){ return window.__scoreMsgs || 0; }
};

</script>
