<script>
window.__EXAM__ = {"meta": {"topicId": "security-plus", "chapter": "5.3", "titlePrefix": "CompTIA Security+ (SY0-701) — 5.3 Third-party risk", "sevLabel": "HARD", "passMark": 70, "qCount": 30, "estMin": 50, "title": "CompTIA Security+ (SY0-701) — 5.3 Third-party risk — HARD practice exam"}, "timerSec": 3000, "themes": {"VAS": "Vendor assessment & selection", "Q": "Questionnaires", "ROE": "Rules of engagement", "AGR": "Agreements", "MON": "Vendor monitoring & offboarding"}, "keywords": {"VAS": ["Vendor assessment", "Vendor selection", "Due diligence", "RFI (Request for Information)", "RFP (Request for Proposal)", "Weighted scoring matrix", "Proof of concept", "Reference checks", "Financial health", "Vendor tiering", "Right-to-audit clause", "Independent assessment", "Internal assessment", "SOC 1 report", "SOC 2 Type I", "SOC 2 Type II", "SOC 3 report", "ISO/IEC 27001", "Penetration test report", "Attestation letter", "Evidence of compliance"], "Q": ["Security questionnaire", "SIG (Standardized Information Gathering)", "CAIQ (Consensus Assessments Initiative Questionnaire)", "Self-assessment bias", "Evidence request", "Follow-up questions", "Vague answer red flags", "Leading question design"], "ROE": ["Rules of engagement", "Scope (in-scope systems)", "Authorized techniques", "Prohibited actions", "Time windows", "Escalation contact", "Authorization letter", "Deconfliction", "Evidence handling"], "AGR": ["MOU (Memorandum of Understanding)", "MSA (Master Service Agreement)", "MLA (Master License Agreement)", "SaaS agreement", "SLA (Service-Level Agreement)", "Uptime percentage", "Maintenance window exclusion", "Service credits", "RTO (Recovery Time Objective)", "RPO (Recovery Point Objective)", "EOSL (End of Service Life)", "NDA (Non-Disclosure Agreement)", "Data sharing agreement", "Data controller", "Data processor", "Purpose limitation", "Cross-border transfer", "BPA (Blanket Purchase Agreement)", "Incident notification clause", "Legacy system"], "MON": ["Vendor monitoring", "Continuous monitoring", "Periodic reassessment", "KPI (Key Performance Indicator)", "KRI (Key Risk Indicator)", "Subcontractor / 4th-party", "Orphaned account", "Offboarding", "Access revocation", "Data return", "Destruction certificate", "Conflicting interests", "Lack of vendor support", "Outsourcing", "Vendor threat intelligence"]}, "typeList": "Multiple choice (5), drag & drop classification, matching, ordering and prioritization, fill-in-the-blank, decision scenarios (branching, including dual red/blue perspective), log analysis with a filter box, and one terminal exercise where you pick the tool and construct the command yourself.", "exercises": [{"id": "h01", "type": "logview", "theme": "MON", "pts": 2, "scen": "01:40 CET, Saturday. The SOC queue lights up: the ShieldWorks (tier-1 MSSP) engineer account 'k-osei@shieldworks.example' — a NAMED account, not a service login — is active on your VPN concentrator from two continents in one night, and the MFA module is spamming pushes. Contract: the escalation contact is ShieldWorks' duty manager, reachable 24/7. Legal hold policy: do not destroy logs during an open incident.", "q": "Review the VPN log (try filtering for k-osei or push). Which TWO immediate actions are correct?", "log": {"title": "vpn-conc-02 — Sat 00:50 to 01:38", "lines": [["00:52", "I", "auth ok user=k-osei@shieldworks.example from 198[.]51[.]100[.]44 (Frankfurt) geo=DE"], ["00:53", "W", "MFA push #1 sent (mobile-iOS) — timeout, no response"], ["00:55", "I", "auth ok user=k-osei@shieldworks.example from 203[.]0[.]113[.]180 (Sydney) geo=AU"], ["00:55", "W", "impossible travel flagged: DE -> AU in 3 min"], ["00:56", "W", "MFA push #2 approved (mobile-iOS) 1.2s after send — anomaly: median is 14s"], ["01:02", "I", "push #3 sent, approved 0.8s after send"], ["01:09", "W", "14 pushes in 17 minutes — MFA fatigue pattern"], ["01:22", "I", "session: vpn-admin role assumed (read+write)"], ["01:30", "E", "config change: aaa segment 10[.]44[.]0[.]0/16 pushed by k-osei session"], ["01:38", "I", "session still active"]]}, "ans": {"opts": [["a", "Suspend the account and kill the active session, then rotate any secrets the session could read"], ["b", "Call the contract's escalation contact at the vendor to verify and coordinate, per the incident process"], ["c", "Wait for Monday morning — geo anomalies usually resolve themselves and staff need sleep"], ["d", "Block every IP range the vendor uses at the perimeter so nothing else gets through"]], "correct": ["a", "b"]}, "hint": "One action stops the bleeding. The other uses the lever your contract already built for exactly this hour.", "explain": "The log shows the named account failing over from Frankfurt to Sydney in minutes plus machine-speed MFA approvals and 14 pushes — MFA fatigue succeeding — followed by a VPN config change with write access. You suspend the account and kill the session now (the activity is live), and you invoke the escalation contact because the contract names a 24/7 duty manager precisely for this: only the vendor can tell you whether Osei is on a plane or on holiday while your analysts preserve evidence. Waiting burns the containment window. Blocking the vendor's whole address range is a self-inflicted outage for every other service and is not needed to stop one account."}, {"id": "h02", "type": "slots", "theme": "ROE", "pts": 3, "scen": "You supervise NorthGuard's red team engagement against the claims lab (range 10[.]30[.]0[.]0/23). The ROE and authorization letter: identity systems (Okta tenant, corporate SSO) are OUT of scope; social engineering is prohibited; a honeypot database seeded with 20 fake records is explicitly in scope; production payment systems are prohibited; the window is 18:00-22:00 today. The activity feed arrives in real time.", "q": "Triage each feed item into its ruling.", "items": [["a1", "18:04 — full TCP scan of 10[.]30[.]0[.]0/23, the authorized range"], ["a2", "18:20 — password-spray against the vendor Okta tenant, listed as excluded in the ROE"], ["a3", "18:41 — exploit attempt against the corporate SSO that also serves two other tenants"], ["a4", "19:02 — dump of 3 records from the honeypot database marked as bait in the ROE"], ["a5", "19:15 — pretext phone call to the vendor NOC asking for a password reset"], ["a6", "19:30 — re-attempt against 10[.]30[.]4[.]9 after a partner complained it also hosts their staging"]], "groups": [["b1", "In scope — log it and let the engagement continue"], ["b2", "Violation — stop the action and escalate to the escalation contact"], ["b3", "Deconfliction needed before any further attempt"]], "map": {"a1": "b1", "a2": "b2", "a3": "b3", "a4": "b1", "a5": "b2", "a6": "b3"}, "hint": "Two items break written prohibitions outright; two others touch shared systems where pause-and-confirm is the only legal move.", "explain": "The range scan and the honeypot dump are exactly what the letter authorizes — the honeypot exists to be taken. The Okta spray and the NOC pretext call break explicit prohibitions (identity systems out of scope; social engineering banned): the supervisor stops the action and escalates, because a tester who violates the ROE converts an authorized test into unauthorized access. The SSO attempt and the contested host need deconfliction — shared infrastructure is not yours to risk on a maybe, so both sides agree the handling first. ROE discipline is what separates a professional engagement from a crime with paperwork."}, {"id": "h03", "type": "choice", "theme": "AGR", "pts": 2, "scen": "Vantiq Cloud's SLA: 'Platform availability 99.95% per calendar month. Excluded: scheduled maintenance announced 5+ days ahead, customer-caused downtime, force majeure. Availability is measured at PLATFORM level across all tenants.' September (30 days = 43,200 min): platform-wide incidents 12 min; YOUR tenant alone was unreachable 95 min during an isolated storage failure; scheduled maintenance 60 min. You demand credits.", "q": "What is the correct contractual outcome?", "opts": [["a", "No credits are due: the platform's 12 minutes sit inside the 21.6-minute allowance"], ["b", "Credits are due: your tenant's 95-minute outage alone exceeds the 21.6-minute allowance"], ["c", "Credits are due: 12 + 95 + 60 = 167 minutes, far past the allowance"], ["d", "No credits are due: the force majeure wording excludes every incident"]], "correct": ["a"], "hint": "First read WHAT is measured and what is excluded — then do the arithmetic on the right number.", "explain": "The measurement clause is the trap. 0.05% of 43,200 minutes allows 21.6 minutes. Only platform-level downtime counts: 12 minutes — inside the allowance. The 95-minute tenant outage is real and painful but is not a metric this SLA measures; the 60 minutes of maintenance is excluded by design. So the vendor owes nothing, however unfair it feels — the fix is contractual, not arithmetic: negotiate tenant-level or service-instance SLOs, an RTO and RPO commitment for component failures, and credits that bite at your level. Choosing option b is the 'obvious answer' the clause was written to defeat."}, {"id": "h04", "type": "slots", "theme": "Q", "pts": 2, "scen": "Vantiq Cloud's questionnaire returns. Six answers; three are solid, three are polished nonsense — each of the weak ones would have looked acceptable to a rushed reviewer.", "q": "Sort the six answers: insufficient despite sounding good, or sufficient as answered?", "items": [["a1", "Encryption: 'We encrypt everything with the highest security available.'"], ["a2", "IR: 'Plan attached; last tabletop 2026-08; forensics retainer active; two named incident leads.'"], ["a3", "Backups: 'Encrypted, 3-2-1 scheme; quarterly restore test reports attached for 2026.'"], ["a4", "Subprocessors: 'We use only best-in-class subprocessors, vetted by our procurement team.'"], ["a5", "Access: 'SAML SSO enforced, RBAC matrix attached, quarterly access reviews with samples.'"], ["a6", "Pen testing: 'We test regularly against best practices and fix everything important.'"]], "groups": [["b1", "Insufficient — evidence request and follow-ups"], ["b2", "Sufficient — verifiable artifact attached"]], "map": {"a1": "b1", "a2": "b2", "a3": "b2", "a4": "b1", "a5": "b2", "a6": "b1"}, "hint": "'Highest', 'best-in-class', 'regularly' — superlatives are not specs. What can you verify from each wording?", "explain": "A1, A4 and A6 share the disease: no artifact, no scope, no date, no named control. 'Highest security' names no algorithm or key management; 'best-in-class subprocessors' gives no list, no flow-down terms, no reassessment cycle; 'we test regularly' has no scope, vendor, or findings. All three are vague-answer red flags in polished clothing. A CAIQ-style column of yes/no answers without evidence is still self-assessment bias — the format does not make it true. A2, A3 and A5 attach verifiable artifacts with dates. The correct response to the insufficient three is an evidence request with a deadline plus targeted follow-up questions, and a questionnaire designed without leading questions so 'agree' buttons stop passing for answers."}, {"id": "h05", "type": "branch", "theme": "AGR", "pts": 3, "scen": "DataWave, your payroll SaaS, confirms at 16:20 that attackers read the employee file export of the last payroll run. 2,300 employees' bank details and national IDs are in it. You hold the DSA, the MSA with its incident notification clause, and an NDA DataWave now wants to extend. Works council law requires informing employee representatives within days. Your regulator expects controller-side assessment without undue delay.", "q": "Work the decision path.", "stages": [{"q": "16:35 — what happens first, before any reply to DataWave?", "opts": [["d1a", "Open the internal incident, invoke the notification clause, and map every legal clock"], ["d1b", "Reply warmly, ask them to keep you posted, and finish your week as planned"], ["d1c", "Publish an employee notice immediately with their best guesses at scope"]], "correct": "d1a", "resolv": {"d1a": "Correct — start your clocks, preserve the notice, and let legal map the duties.", "d1b": "Every hour unmanaged is an hour the vendor's narrative fills.", "d1c": "Publishing guesses about scope creates the story you will later have to retract."}}, {"q": "17:10 — DataWave offers full technical detail ONLY if you sign their stricter NDA: 90-day blanket silence, no carve-outs. The works council must be informed by law within days. What do you sign?", "opts": [["d2a", "Redline the NDA so legally required disclosures are carved out — no blanket gag"], ["d2a2", "Sign it as-is — the vendor relationship matters more than a formality"], ["d2a3", "Refuse all further technical information to stay clean"]], "correct": "d2a", "resolv": {"d2a": "Correct — confidentiality yes, but never against mandatory legal duties; carve-outs are standard.", "d2a2": "You just agreed to break works-council law in writing. The vendor's paper now contradicts your statute.", "d2a3": "Refusing information does not pause any duty — it just blinds you."}}, {"q": "18:00 — the regulator question: who assesses and notifies, and under what role?", "opts": [["d3a", "Meridian, as data controller, assesses risk and notifies within the statutory window"], ["d3b", "DataWave decides everything, because it is their breach"], ["d3c", "Nobody notifies: bank details of staff are internal data, not personal data"]], "correct": "d3a", "resolv": {"d3a": "Correct — controller duties do not pause because the processor was breached.", "d3b": "The processor must notify YOU; your duties to regulators and data subjects remain yours.", "d3c": "Employee bank details are exactly the personal data notification law exists for."}}], "hint": "Clocks first, paper second, roles third. An NDA can never silence a statutory duty.", "explain": "Path: invoke the incident notification clause in writing and open your own incident immediately; sign nothing that gags legally required disclosures — the redlined NDA with statutory carve-outs is the only signable version; and run the regulator assessment as the data controller, because the DSA makes your duties independent of the vendor's breach handling. This is where conflicting obligations meet: the vendor's confidentiality ask, works-council law, and your regulator's clock. The vendor's paper never outranks statute, and 'undue delay' starts when YOU learn, not when they finish."}, {"id": "h06", "type": "slots", "theme": "AGR", "pts": 2, "scen": "The DataWave MSA/SLA bundle contains six clauses. Two of them quietly contradict each other, and the contradiction will surface at the worst possible moment.", "q": "Sort the six clauses: conflicting pair member, or no conflict?", "items": [["k1", "MSA 7.2 — 'Service credits are the sole and exclusive remedy for unavailability.'"], ["k2", "MSA 4.1 — 'Services are delivered to the Customer's tenant with tenant-level availability reporting each month.'"], ["k3", "SLA 2 — 'Platform availability 99.95% monthly, measured platform-wide.'"], ["k4", "MSA 9.3 — 'Either party may terminate for material breach if uncured 30 days after notice.'"], ["k5", "SLA 8 — 'Chronic failure: three missed availability months in any 6-month window entitle Customer to terminate immediately without penalty.'"], ["k6", "MSA 11 — 'Governing law: the vendor's home jurisdiction; disputes go to arbitration there.'"]], "groups": [["m1", "Conflicting — the pair must be fixed"], ["m2", "No conflict — stands as written"]], "map": {"k1": "m1", "k5": "m1", "k2": "m2", "k3": "m2", "k4": "m2", "k6": "m2"}, "hint": "One clause says credits are the ONLY thing you can ever get. The other hands you a second remedy. Both cannot stand.", "explain": "MSA 7.2 makes service credits the exclusive remedy for unavailability; SLA 8 grants termination without penalty as a second remedy for the same unavailability — an exclusive-remedy clause cancels that, and vendors wave 7.2 at exactly the moment SLA 8 should fire. The fix is a carve-out: 'exclusive remedy except as provided in SLA 8 (chronic failure)' or delete one. MSA 4.1 (tenant-level reporting) versus SLA 2 (platform-wide measurement) is a real tension worth cleaning up, but reporting and measurement can legally differ — the true contradiction is remedies. Termination-for-breach and governing-law clauses operate on different subjects and do not collide here."}, {"id": "h07", "type": "order", "theme": "MON", "pts": 3, "scen": "The ShieldWorks VPN incident (k-osei, MFA fatigue) is confirmed malicious. Legal has declared a preservation duty — nothing relevant may be destroyed. The vendor's session may still be live. Six actions are on the war-room board.", "q": "Order the response actions correctly, first to last.", "items": [["w1", "Snapshot volatile evidence: active sessions, auth logs, and the pushed config (before anything changes)"], ["w2", "Notify the vendor's escalation contact and open a joint bridge per the incident notification clause"], ["w3", "Disable the compromised account and rotate the secrets and tokens it could reach"], ["w4", "Assess exposure: reconstruct what data and systems the account actually touched"], ["w5", "Brief internal stakeholders and legal per the notification matrix"], ["w6", "After closure: invoke the right-to-audit and require the vendor's root-cause report"]], "hint": "Evidence dies first when systems change. The vendor must hear from you through the door your contract built. Audit comes when the fire is out.", "explain": "Order: snapshot first — revocation and fixes destroy volatile evidence (live sessions, tokens, the pushed config), and a preservation duty makes destroying it a legal failure. Then the contractual notification: the vendor's escalation contact may kill upstream access you cannot see and owes you information under the incident notification clause. Only then disable and rotate, because containment without evidence is blind. Exposure assessment follows containment — scope comes from evidence, not guesses. Internal briefings run on the notification matrix once facts exist. The right-to-audit and the vendor RCA are post-closure levers: they land hardest when invoked with a complete evidence package."}, {"id": "h08", "type": "match", "theme": "MON", "pts": 3, "scen": "Vantiq Cloud (tier-1 SaaS) reorganized its delivery chain: three new subprocessors appeared in the data flow, and your DSA says any subprocessor change needs 30 days' notice, flow-down terms, and reassessment. Outsourcing the work never outsourced your accountability.", "q": "Match each subprocessor situation to the control that answers it.", "items": [["s1", "New subprocessor processes your metadata in a country not on the approved list"], ["s2", "The subprocessor suffered a breach last month; Vantiq is vague about what was exposed"], ["s3", "Subprocessor staff administer your data with a single shared login"], ["s4", "Vantiq refuses to name its subprocessors at all"], ["s5", "The subprocessor's own SOC 2 came back with qualified opinions"], ["s6", "The subprocessor still stores your data six months after contract end"]], "slots": [["t1", "Flow-down DSA update plus reassessment before any data continues to flow"], ["t2", "Invoke the incident notification clause; demand the subprocessor forensic summary through Vantiq"], ["t3", "Require unique named accounts and attribution as a flow-down obligation"], ["t4", "Add a transparency schedule to the MSA with right-to-audit over subprocessor lists and changes"], ["t5", "Conditional approval only: dated remediation plan or replacement of the subprocessor"], ["t6", "Demand a destruction certificate with a deadline, flow-down to the subprocessor"]], "map": {"s1": "t1", "s2": "t2", "s3": "t3", "s4": "t4", "s5": "t5", "s6": "t6"}, "hint": "Each answer is either flow-down (push your terms down the chain), transparency (make them show the chain), or proof (certificates for data end-states).", "explain": "Fourth-party risk is managed by pushing YOUR terms down the chain: an unapproved-country processor needs a flow-down DSA update and reassessment before data moves. A breach in the chain triggers your notification clause against Vantiq, who owes you the subprocessor's forensic picture. Shared logins at a subprocessor are the same attribution failure as on-site — named accounts are a flow-down must. Refusal to name the chain is cured by a transparency schedule plus audit right. Qualified opinions mean conditional approval at best. And data surviving contract end ends only with a flow-down destruction certificate — data return is not done until proven."}, {"id": "h09", "type": "terminal", "theme": "VAS", "pts": 2, "scen": "Due diligence on Vantiq's managed SFTP endpoint. Last year's report flagged legacy SSH algorithms; Vantiq claims 'we hardened everything'. The endpoint is sftp.vantiq.example, port 22, reachable from the jump host. You need the server's actual algorithm negotiation, not their word for it.", "q": "From the jump host, produce the list of key-exchange, encryption, and MAC algorithms the endpoint actually offers. Type the command and press Enter.", "term": {"title": "SOC jump host — bash", "banner": "Outbound 22/tcp allowed to vendor ranges. Choose your own tool — the goal is the negotiated algorithm list.", "ps1": "analyst@soc-jump:~$", "accept": ["nmap\\s+(?=.*ssh2-enum-algos)(?=.*vantiq)", "nmap\\s+(?=.*-p\\s*22)(?=.*vantiq)", "sslscan\\s+.*sftp\\.vantiq\\.example", "ssh-audit\\s+.*vantiq"], "out": "Starting enumeration against sftp.vantiq.example:22\nkey exchange algorithms:\n  curve25519-sha256\n  diffie-hellman-group14-sha256\n  diffie-hellman-group1-sha1        <- legacy (1024-bit, SHA-1)\nencryption algorithms:\n  chacha20-poly1305@openssh.com\n  aes256-ctr\n  arcfour                          <- legacy (RC4 family)\nMAC algorithms:\n  hmac-sha2-256\n  hmac-sha1                        <- legacy (SHA-1)\n-> 3 legacy algorithms still offered", "err": "no enumeration produced — pick a tool that negotiates SSH algorithms", "example": "nmap --script ssh2-enum-algos -p 22 sftp.vantiq.example"}, "hint": "You need a tool that connects to port 22 and asks the server, before any login, what it supports.", "explain": "nmap with the ssh2-enum-algos script (or ssh-audit / sslscan-style enumeration) connects to port 22 and prints the server's offered key-exchange, cipher, and MAC algorithms — no login needed. The output shows three legacy holdovers: diffie-hellman-group1-sha1, arcfour (RC4 family) and hmac-sha1. Vantiq's 'we hardened everything' is therefore overstated: legacy offerings rarely break production but they weaken the negotiation floor and belong in the due diligence findings with a remediation date. This is what an independent assessment adds over a questionnaire: the endpoint answers for itself."}, {"id": "h10", "type": "order", "theme": "MON", "pts": 3, "rank": true, "scen": "Monday risk board, six vendor findings on one slide, one remediation budget. The CISO wants them ordered by urgency — what burns first.", "q": "Rank the findings from MOST urgent to LEAST urgent.", "items": [["f1", "Active: a vendor support account with production access shows logins from an unknown network operator"], ["f2", "The internet-facing managed firewall fleet hits EOSL in 3 weeks; no upgrade ordered"], ["f3", "Tier-1 vendor's SOC 2 Type II expired five weeks ago; renewal promised 'soon'"], ["f4", "DSA breach: vendor added a subprocessor without the contractual 30-day notice"], ["f5", "SLA missed in 2 of the last 3 months; service credits unpaid"], ["f6", "Tier-3 stationery vendor's questionnaire is 14 months stale"]], "hint": "Live access beats dead patches; dead patches beat stale paperwork. Commercial pain ranks below security exposure.", "explain": "1) The active account is a live intrusion — containment now. 2) The internet-facing EOSL firewall is a ticking exposure: after end of service life, no patches flow and it faces the internet — three weeks of runway to fix. 3) The expired SOC 2 is eroded assurance on your most critical vendor — no fresh independent evidence while they hold deep access. 4) The subprocessor notice breach is a real contract and data-flow violation, but the immediate exposure depends on what the subprocessor touches — verify before escalating hard. 5) Unpaid credits are commercial damage with contractual remedies on schedule. 6) Stale paperwork on a vendor with no access or data is hygiene. Order: live compromise, imminent unpatched exposure, expired assurance, contract/flow-down violation, commercial remedy, paperwork staleness."}, {"id": "h11", "type": "branch", "theme": "ROE", "pts": 2, "scen": "Dual perspective, one credential. You are the external tester on the Vantiq engagement. The ROE and authorization letter prohibit 'any credential attack against identity systems'. On a public breach dump you find a password reused by a Vantiq VPN account. The client's CISO messages you on the side: 'Use it, we need to see the depth.' Nothing is in writing.", "q": "Two rounds: red team first, then blue team.", "stages": [{"q": "RED — What do you do with the dumped credential?", "opts": [["r1a", "Stop: identity systems are out of scope and a verbal OK is not an amendment"], ["r1b", "Use it — the CISO owns the risk and their message is permission enough"], ["r1c", "Use it but keep it out of the logs and the report so nothing traces back"]], "correct": "r1a", "resolv": {"r1a": "Correct — scope changes are written amendments to the ROE and the authorization letter, or they do not exist.", "r1b": "Side-channel permission converts YOUR unauthorized access into YOUR liability.", "r1c": "Using credentials while hiding the trail is indistinguishable from being the attacker."}}, {"q": "BLUE — As Vantiq's SOC, which control would have caught a breached-password reuse on the VPN in the first place?", "opts": [["r2a", "Breached-password screening plus stuffing and travel detection on the VPN"], ["r2b", "Forcing 24-character minimum password length for everyone"], ["r2c", "Hiding the VPN login page from the public internet entirely"]], "correct": "r2a", "resolv": {"r2a": "Correct — screening rejects known-breached secrets at the door; analytics catch the stuffing pattern behind it.", "r2b": "Length does not help when the exact secret is already in a dump.", "r2c": "The page is not the problem; the accepted secret is."}}], "hint": "Red: permission lives where the ROE lives. Blue: the dump is public — the door should have known.", "explain": "Red: the ROE prohibition stands until it is amended in writing — a verbal nudge is not an authorization letter, and unlogged use would make the tester an intruder with a report template. Blue: breached-password screening at authentication would have rejected a credential that exists in public dumps, and credential-stuffing plus impossible-travel detection catches the replay pattern regardless. This is third-party tradecraft and defense in one exercise: the same reuse that empowers the attacker defines the control that defeats them."}, {"id": "h12", "type": "match", "theme": "AGR", "pts": 3, "scen": "Contract triage, hardest edition. Seven situations, seven instruments — and three of the pairs look almost identical until you read the object of each deal.", "q": "Assign each situation to the instrument that governs it.", "items": [["g1", "Yearly fixed-price managed-SOC deal, extended each year by work orders under one legal frame"], ["g2", "Vendor licenses its detection-content pack; use capped at 50 sensor installations"], ["g3", "One negotiated vehicle for ad-hoc hardware buys all year at fixed unit prices"], ["g4", "99.95% monthly platform uptime with service credits when missed"], ["g5", "A contractor will read unreleased incident reports; must never disclose or reuse them"], ["g6", "Pseudonymized claims data goes to an analytics partner for fraud detection ONLY"], ["g7", "Two SOCs 'will explore joint threat hunting'; no binding duties, no data yet"]], "slots": [["h1", "MSA"], ["h2", "MLA"], ["h3", "BPA"], ["h4", "SLA"], ["h5", "NDA"], ["h6", "Data sharing agreement"], ["h7", "MOU"]], "map": {"g1": "h1", "g2": "h2", "g3": "h3", "g4": "h4", "g5": "h5", "g6": "h6", "g7": "h7"}, "hint": "Ask what is actually being traded: services under a frame, usage rights of content, repeat buying, measured performance, secrecy, personal data, or nothing binding yet.", "explain": "Work orders under one legal frame = MSA. Usage rights and caps for licensed content = MLA — note the object is the CONTENT, not the service. Repeat purchases under one negotiation = BPA. Measured performance with credits = SLA. Confidentiality over disclosed material = NDA — the incident reports are the object, not a processing job. Personal data for a defined purpose = DSA, where purpose limitation does the heavy lifting. Exploratory intent = MOU. The near-misses: g2 looks like an MSA deal but licenses content; g6 looks like an NDA situation but actually hands personal data to another party for processing."}, {"id": "h13", "type": "fill", "theme": "AGR", "pts": 2, "scen": "The Brightpath DSA review is the hardest legal test yet: the analytics partner does not just follow instructions — they design their own fraud models from your claims data.", "q": "Complete the DSA role analysis. Click a word, then its blank.", "text": "Brightpath decides independently which fraud models to build from the claims data, so for those activities Brightpath is a {1} in its own right, not merely a {2} following instructions. Where Meridian and Brightpath jointly decide the purposes of processing, they act as {3}. The {4} clause is what stops Brightpath from quietly training unrelated products on your data.", "bank": ["controller", "processor", "joint controllers", "purpose limitation", "data importer", "audit clause"], "correct": {"1": "controller", "2": "processor", "3": "joint controllers", "4": "purpose limitation"}, "hint": "Whoever DECIDES the purpose wears the controller hat — even inside someone else's company.", "explain": "Independence of purpose flips the role: an analytics partner that chooses its own models from your data is acting as a controller for those activities, no matter what the marketing says. Where both parties jointly determine purposes and means, the honest label is joint controllers, with responsibilities allocated in the agreement. The purpose limitation clause is the fence: it confines Brightpath's use to the agreed fraud-detection purposes and makes any other use — like training unrelated products — a breach. Calling everyone a 'processor' in the DSA would be comfortable and wrong, and it would gut your enforcement position."}, {"id": "h14", "type": "logview", "theme": "MON", "pts": 2, "scen": "Contract with ACME Data ends Friday. Today is Wednesday. The SFTP log shows the vendor account busy at unusual hours, and the vendor's engineer emailed asking to 'extend access 30 days to finish archival'. You remember their storage layer was reorganized last month.", "q": "Read the transfer log (filter for archive or shadow). What is the correct read and move?", "log": {"title": "sftp-transfer-01 — Tue/Wed", "lines": [["23:41", "I", "session opened user=acme-files-svc from 198[.]51[.]100[.]30"], ["23:44", "W", "get archive_2019_full.tar.gz 2.1 GB -> files.acme-shadow.example"], ["23:52", "W", "get archive_2020_q1q2.tar.gz 2.1 GB -> files.acme-shadow.example"], ["00:07", "I", "session closed (bytes out 4.2 GB)"], ["02:15", "I", "session opened user=acme-files-svc from 198[.]51[.]100[.]30"], ["02:18", "W", "get archive_2020_q3q4.tar.gz 2.0 GB -> files.acme-shadow.example"], ["02:31", "I", "session closed (bytes out 2.0 GB)"], ["09:02", "I", "email queued to vendor mgmt: 'extend acme-files-svc 30 days?'"]]}, "ans": {"opts": [["a", "Pre-departure data staging — deny the extension, preserve logs, demand the destruction certificate"], ["b", "Approve the 30-day extension — vendors routinely need extra time after a contract ends"], ["c", "It is just the vendor's own backup routine; the archives are named archives"], ["d", "Take immediate legal action and skip containment — the logs are proof enough"]], "correct": ["a"]}, "hint": "Multi-year archives, an unnamed external destination, and the last days of a contract. What does an insider do before leaving?", "explain": "Two night sessions inside the final 72 hours pull 6.2 GB of historical archives to files.acme-shadow.example — a destination that appears in no contract — and the request to extend access arrives on top. This matches pre-departure data staging by a vendor facing offboarding. The move: deny the extension, preserve the logs as evidence (a contract term violation at minimum), complete offboarding exactly as written — revoke, close paths, collect the destruction certificate — and brief legal. Option d skips containment and evidence handling; courts and contracts both reward the disciplined path, not the fastest gesture."}, {"id": "h15", "type": "slots", "theme": "VAS", "pts": 2, "scen": "Final due diligence on three RFI-stage finalists for the managed-SOC contract. The vendor assessment must fail vendors on real deficiencies only — you saw one proof of concept environment live and one financial health check came back stable, so theatre is not the issue here. Six findings are on the table.", "q": "Sort the six findings: genuine failure reason, or not a failure?", "items": [["s1", "Their SOC 2 Type II carries a qualified opinion on access management: auditor documented exceptions"], ["s2", "No MFA for remote administration — 'our engineers use 20-character passwords instead'"], ["s3", "Backups: encrypted, 3-2-1, quarterly restore tests with documented results"], ["s4", "Their penetration test report is 19 months old; every critical finding was 'accepted risk' with no fix evidence"], ["s5", "Log retention is 90 days with alerting on all admin actions"], ["s6", "Subprocessor list published with flow-down terms and named reassessment dates"]], "groups": [["t1", "Genuine failure — fail the assessment"], ["t2", "Not a failure — this is what good looks like"]], "map": {"s1": "t1", "s2": "t1", "s4": "t1", "s3": "t2", "s5": "t2", "s6": "t2"}, "hint": "Two options describe exactly what a mature vendor should show you. Do not fail people for passing.", "explain": "A qualified opinion on access management means the independent assessor found the control NOT working as described — a tier-1 failure until remediated and re-audited. No MFA on remote administration with a password-length excuse fails hard: passwords alone are replayable, and remote admin is the crown jewel. A 19-month-old penetration test report with all criticals parked as accepted risk means no current attack-surface picture and no functioning risk management. Tested backups, sensible retention with admin alerting, and a transparent subprocessor chain are what good looks like — failing vendors for genuine deficiencies (and only those) keeps the vendor selection credible. This is vendor tiering in action: assessment depth follows criticality."}, {"id": "h16", "type": "choice", "theme": "AGR", "pts": 2, "scen": "Vendor notice: the managed firewall fleet you rent reaches EOSL in seven months — after that date, no patches, no firmware, no vendor support; the vendor has also quietly cut support hours already, a classic lack-of-vendor-support signal ahead of EOL. Your MSA auto-renews in five months, and the equipment becomes a legacy system the day support stops.", "q": "What is the best procurement response?", "opts": [["a", "Negotiate a refresh addendum before auto-renewal, with support extension and exit terms"], ["b", "Do nothing: EOSL is a marketing date and firewalls keep working"], ["c", "Buy consumer-grade firewalls with the saved budget and swap them quietly"], ["d", "Wait for the auto-renewal to complete, then demand compensation"]], "correct": ["a"], "hint": "The renewal date is the only leverage moment you control. What can you attach to it?", "explain": "EOSL ends patches and support; an internet-facing fleet past that date is an unpatchable exposure, and the vendor's shrinking support hours confirm the wind-down is real. The auto-renewal in five months is the leverage window: a refresh addendum signed before renewal can fix the upgrade path, price, timeline, and remedies (support extension, exit rights) while the vendor still wants the renewal. Doing nothing leaves a legacy system exposed; consumer gear is a governance joke; and post-renewal complaints negotiate from zero leverage. EOSL monitoring exists precisely to catch this at the contract moment, not the patch moment."}, {"id": "h17", "type": "slots", "theme": "AGR", "pts": 4, "scen": "The DataWave contract rewrite: eight clauses are stacked on the table, and legal wants each in its home document before signature week. Wrong homes create the disputes you have been cleaning up all quarter.", "q": "File each clause into the agreement where it belongs.", "items": [["n1", "P2 ticket response time: 95% answered within 30 minutes"], ["n2", "Definition of confidential information and return-on-request duty"], ["n3", "Approved transfer mechanism for cross-border processing of shared records"], ["n4", "Governing law and liability cap applying to all work orders"], ["n5", "Service credit formula: 5% of fee per missed availability hour, paid monthly"], ["n6", "Purpose limitation and retention limits for shared records"], ["n7", "Permitted use of each party's name and logo in case studies"], ["n8", "Confidentiality survives five years after termination"]], "groups": [["o1", "SLA"], ["o2", "NDA"], ["o3", "Data sharing agreement"], ["o4", "MSA"]], "map": {"n1": "o1", "n2": "o2", "n3": "o3", "n4": "o4", "n5": "o1", "n6": "o3", "n7": "o4", "n8": "o2"}, "hint": "Performance and credits are one family; secrets and their survival are another; data rules and the master frame take the rest.", "explain": "SLA: measurable performance — response-time targets and the credit formula — because both are service metrics with money attached. NDA: what counts as confidential and how long the duty survives (the five-year survival clause is classic NDA material). DSA: cross-border transfer mechanisms plus purpose limitation and retention — the rules governing the shared records themselves. MSA: governing law, liability cap, and marketing rights — frame and commercial terms that outlive any single work order. A credit formula hidden in the MSA becomes unenforceable against the SLA's own definitions; the clause must live where its subject lives."}, {"id": "h18", "type": "branch", "theme": "VAS", "pts": 3, "scen": "NorthGuard holds your tier-1 SOC monitoring deal. The MSA grants a right-to-audit with 15 business days' notice. After the SLA breaches you invoke an on-site audit; NorthGuard answers 'internal policy — no customer audits, ever'.", "q": "Work the escalation path.", "stages": [{"q": "First written reply — what do you assert?", "opts": [["u1a", "Cite the clause, propose an audit date inside the notice window, and copy legal"], ["u1b", "Drop it — their internal policy probably exists for good reasons"], ["u1c", "Fly your auditor in unannounced tomorrow and audit anyway"]], "correct": "u1a", "resolv": {"u1a": "Correct — the clause beats their policy; the written record does the heavy lifting.", "u1b": "A policy cannot void a signed contractual right.", "u1c": "Barging in breaks the clause's own notice conditions and hands them the moral high ground."}}, {"q": "NorthGuard offers a bridge: their current SOC 2 Type II plus ISO/IEC 27001 certificate instead of an on-site visit.", "opts": [["u2a", "Accept them as partial evidence and keep the audit right alive for the open items"], ["u2b", "Accept the documents and waive the audit right for the next three years to build trust"], ["u2c", "Refuse everything — only an on-site visit counts as an audit"]], "correct": "u2a", "resolv": {"u2a": "Correct — documents narrow the scope; the right stays loaded for what documents cannot answer.", "u2b": "Waiving the right for years right after breaches tells every vendor clauses are negotiable after the fact.", "u2c": "Refusing evidence out of pride burns goodwill the audit right may later need."}}, {"q": "NorthGuard now refuses even the document bridge and cites policy again. The contract names audit refusal a material breach.", "opts": [["u3a", "Issue a cure notice, start exit planning under the MSA, and record the evidence"], ["u3b", "Escalate the conflict on social media to pressure them publicly"], ["u3c", "Renew the contract early at a discount to keep the peace with them"]], "correct": "u3a", "resolv": {"u3a": "Correct — the contract's own machinery: cure notice, exit prep, clean evidence.", "u3b": "Public pressure breaches your confidentiality duties and devalues the contractual route.", "u3c": "Rewarding refusal with an early renewal is the most expensive lesson in vendor management."}}], "hint": "Assert in writing, accept evidence without waiving the right, and let the contract's breach machinery finish the sentence.", "explain": "The audit right survives their policy: written invocation with a proposed date inside the notice window, governance copied. A document bridge (SOC 2 Type II, ISO/IEC 27001) is genuine independent-assessment evidence and can narrow the open items — accepting it does NOT waive the right; waiving it after breaches would be malpractice. Continued refusal is a material breach by the contract's own definition: cure notice, exit planning, and a clean evidence chain follow. An internal assessment of your own leverage (data portability, substitute vendors) belongs in that exit planning too."}, {"id": "h19", "type": "slots", "theme": "ROE", "pts": 2, "scen": "Pre-engagement review of NorthGuard's draft rules of engagement (ROE) for the claims-lab test. Six sections are on the table for the sign-off decision.", "q": "Sort the six sections: defect that must be rewritten, or sound as drafted?", "items": [["x1", "1 Scope — 'All systems at 10[.]40[.]0[.]0/16 and any cloud assets we discover along the way.'"], ["x2", "2 Window — 'Testing 2026-11-03 to 2026-11-07, 09:00-17:00 vendor-local time.'"], ["x3", "3 Authorized techniques — 'Any technique except DoS and destruction of data.'"], ["x4", "4 Escalation contact — vendor SOC lead and client CISO, reachable 24/7 during the window."], ["x5", "5 Evidence handling — findings and artifacts per the client legal-hold procedure."], ["x6", "6 Authorization — signed authorization letter attached to this ROE."]], "groups": [["y1", "Defect — rewrite before signing"], ["y2", "Sound as drafted"]], "map": {"x1": "y1", "x3": "y1", "x2": "y2", "x4": "y2", "x5": "y2", "x6": "y2"}, "hint": "One section lets the target grow by discovery. Another defines the rules by subtraction instead of enumeration.", "explain": "Section 1's 'any cloud assets we discover' makes scope a moving target — the tester decides the boundary by finding things, which is how sibling production systems get hit. Scope must enumerate ranges, accounts, and explicit exclusions. Section 3 defines authorized techniques by subtraction ('anything except DoS and destruction') — leaving social engineering, physical access, and production-impacting techniques implicitly permitted; prohibited actions and authorized techniques must be listed positively and concretely. The time window, the escalation contacts, the legal-hold evidence handling, and the attached authorization letter are all correct ROE anatomy — those are the parts that hold up under dispute."}, {"id": "h20", "type": "match", "theme": "VAS", "pts": 3, "scen": "Assurance-document triage for the new GRC analyst. Four teams forwarded seven different questions about the same vendor; each question must be answered with exactly one artifact from the vendor's pack — and handing over the wrong one is how assurance theatre survives procurement.", "q": "Match each team question to the ONE artifact that actually answers it.", "items": [["p1", "'Our financial auditors want control evidence they can rely on.'"], ["p2", "'Was the control at least DESIGNED correctly, as of one point in time?'"], ["p3", "'Did the controls actually OPERATE, month after month, over a period?'"], ["p4", "'The board wants a public, shareable summary — nothing confidential.'"], ["p5", "'Is the management system itself certified against a published standard?'"], ["p6", "'What did real offensive testing find, with severities?'"], ["p7", "'The vendor will only offer a signed statement — what is that worth?'"]], "slots": [["q1", "SOC 1 report — financial-reporting controls, for financial auditors"], ["q2", "SOC 2 Type I — design snapshot at a single point in time"], ["q3", "SOC 2 Type II — operating effectiveness over a 3-12 month window"], ["q4", "SOC 3 report — general-use summary with no control detail"], ["q5", "ISO/IEC 27001 certificate — ISMS certified within a stated scope"], ["q6", "Penetration test report — attacker findings at a point in time"], ["q7", "Attestation letter — the vendor's own claim, weakest assurance"]], "map": {"p1": "q1", "p2": "q2", "p3": "q3", "p4": "q4", "p5": "q5", "p6": "q6", "p7": "q7"}, "hint": "Read what each team is really asking: who consumes it, and does it prove design, operation, or nothing at all.", "explain": "Each question names its consumer and its burden of proof. Financial auditors consume the SOC 1 — waving it as security proof is the oldest trick in vendor packs. A design-only question at one point in time is the SOC 2 Type I; a question about controls operating over months is the SOC 2 Type II — the classic Type I versus Type II trap. A public shareable summary is the SOC 3. Certification of the management system against a published standard is ISO/IEC 27001 — read the scope statement, not just the badge. Real offensive findings with severities come from the penetration test report. And a signed vendor statement is an attestation letter — a promise, not evidence of compliance. Pairing the wrong artifact with the wrong question is exactly how the wrong assurance reaches the wrong audience."}, {"id": "h21", "type": "choice", "theme": "AGR", "pts": 2, "scen": "A startup building an ML de-identification tool asks Meridian to send 5,000 REAL patient records 'to train the model' before any contract is signed. They were referred by a partner; last year's NDA with them covers a DIFFERENT project. An MSA template sits unsigned in your drafts folder.", "q": "What is the correct move?", "opts": [["a", "Decline: no processing basis exists yet — use an NDA plus DSA and synthetic data first"], ["b", "Send it — the old NDA from last year already covers confidentiality"], ["c", "Send it after stripping names and birth dates, which makes it anonymous"], ["d", "Send it once they confirm by email that they will protect it"]], "correct": ["a"], "hint": "Last year's NDA covers last year's project. And 'we promise by email' is not a processing agreement.", "explain": "No signed DSA means no processor role, no purpose limitation, no retention or security terms — sending real patient records now would be an uncontrolled disclosure by the controller. The old NDA binds confidentiality for its stated project, not data processing. Stripping a few fields from patient records does not make them anonymous — pseudonymized health data stays regulated, so option c is a comfort lie. Option d confuses a promise with a contract. The professional path: NDA for discussions, DSA for any processing, synthetic or minimized data for the feasibility phase — data minimization before trust, never after."}, {"id": "h22", "type": "logview", "theme": "MON", "pts": 2, "scen": "The API gateway report flags a contract that ended 21 days ago. Key ak_fileflow_prod_02 (FileFlow SaaS integration) is still live and its traffic has TRIPLED over baseline in the last four nights. Legal hold: preservation duty is active for vendor incidents.", "q": "Review the gateway log (filter for ak_fileflow or /v2/). Which TWO actions are correct?", "log": {"title": "api-gw-03 — key ak_fileflow_prod_02 (contract ended 21d ago)", "lines": [["00:12", "I", "GET /v2/contacts page=1 count=500 ua=FileFlow-Collector/1.4 from 198[.]51[.]100[.]77"], ["00:14", "I", "GET /v2/contacts page=2 count=500 ua=FileFlow-Collector/1.4 from 198[.]51[.]100[.]77"], ["00:17", "I", "GET /v2/contacts page=3 count=500 ua=FileFlow-Collector/1.4 from 198[.]51[.]100[.]77"], ["00:19", "W", "daily volume: 3.1x baseline (night 4 of 4)"], ["00:24", "I", "GET /v2/notes?since=2025-01-01 count=980 ua=FileFlow-Collector/1.4 from 198[.]51[.]100[.]77"], ["00:31", "W", "scope check: key authorized for /v2/files only — /v2/contacts + /v2/notes outside grant"], ["00:44", "I", "GET /v2/files count=120 ua=FileFlow-Collector/1.4 from 198[.]51[.]100[.]77"], ["01:02", "I", "no auth failures — key valid, quotas disabled post-termination"]]}, "ans": {"opts": [["a", "Revoke the key now and close the network path — confirm first that no preservation duty requires the traffic itself"], ["b", "Preserve the gateway logs as evidence of post-termination access — the contract's data duties survive the end date"], ["c", "Rotate the key to a fresh value and email it to the vendor so their collector keeps working"], ["d", "Rate-limit the key instead of revoking — keeps the peace while things settle"]], "correct": ["a", "b"]}, "hint": "One action ends the exposure. The other keeps your options — and proof — intact. Which kind act re-arms the problem?", "explain": "A post-termination key is an orphaned account by another name: contract over, grant over, quota gates off, and volume tripling while pulling contact and note data outside the key's authorized path. Revoke now — after confirming the preservation duty concerns artifacts, not live traffic. Preserve the logs: post-termination access is evidence for breach-of-contract and data-handling claims, and destruction-certificate duties still run. Rotating the key FOR the vendor (c) re-arms the access you just found; rate-limiting (d) slows the leak while leaving it open. This is offboarding hygiene failing in real time — the register said ended, the network said otherwise."}, {"id": "h23", "type": "order", "theme": "MON", "pts": 3, "scen": "Post-incident review of the ShieldWorks compromise is complete. The CISO wants the vendor-security-incident lifecycle mapped on one wall chart — in the correct order — for the next vendor breach.", "q": "Order the lifecycle stages correctly, first to last.", "items": [["l1", "Detect and triage: alerts confirm unauthorized vendor access; incident declared"], ["l2", "Contain: disable the vendor account, sever the integration path"], ["l3", "Eradicate: rotate every secret and token the access could reach; remove persistence"], ["l4", "Recover: restore the integration with tightened controls — named accounts, scoped grant, monitored window"], ["l5", "Post-incident: invoke the right-to-audit, require the vendor's root-cause report"], ["l6", "Improve: update the vendor risk register, KRIs, and the incident notification clause from lessons learned"]], "hint": "Declare, stop the bleeding, clean, rebuild stronger, then use the contract levers, then write it into the program.", "explain": "The lifecycle runs: detect and triage (declare the incident formally — the clock and the notification matrix start here), contain (kill the vendor access path), eradicate (rotate secrets, remove persistence — containment without rotation just postpones re-entry), recover (re-enable with tightened controls so the same door cannot be walked through), post-incident (right-to-audit and the vendor RCA — your contractual levers, aimed with the evidence you preserved), and improve (register, KRIs, clause updates so the next vendor breach finds a better program). Ordering matters: audit calls before eradication waste the window; skip the register update and the same vendor risk returns with a new name."}, {"id": "h24", "type": "fill", "theme": "MON", "pts": 2, "scen": "The risk committee approved the new vendor monitoring and risk register design. Your job: complete the methodology text that the analysts will follow.", "q": "Complete the register methodology. Click a word, then its blank.", "text": "The register defines {1} that turn raw metrics into warnings. When a KRI threshold is crossed — patch backlog over 30 days, for example — it opens an {2} reassessment instead of waiting for the annual cycle. Metrics the vendor must DELIVER against, like mean time to respond, are tracked as {3} and feed the SLA review. Continuous monitoring plus vendor threat intelligence feeds both; annual paperwork alone finds nothing in time.", "bank": ["thresholds", "out-of-cycle", "KPI", "best-effort", "annual-only", "qualitative"], "correct": {"1": "thresholds", "2": "out-of-cycle", "3": "KPI"}, "hint": "Thresholds trigger. Performance measures deliver. The cycle that waits a year is the wrong cycle.", "explain": "Thresholds are the tripwires: predefined values that convert a moving metric into a mandatory action. A crossed KRI triggers an out-of-cycle reassessment — that is the entire point of monitoring: reaction time measured in days, not until the next annual questionnaire. KPIs are the delivery metrics the vendor is accountable for (response times, availability) and feed the contract review. 'Annual-only' and 'best-effort' are the two failure modes this methodology exists to kill: one is blindness by calendar, the other is blindness by excuse."}, {"id": "h25", "type": "choice", "theme": "AGR", "pts": 2, "scen": "An MOU with a partner SOC states the parties 'share all security data to improve mutual defence — no formal limits'. Yesterday they requested: your full firewall rulebases, internal VLAN maps, and the last three penetration test reports. Their latest email signs off: 'The MOU says all security data.'", "q": "What is the correct response?", "opts": [["a", "Share only what serves the MOU's purpose — IOCs and detections — decline the rest"], ["b", "Send everything — the MOU literally says 'all security data', so consent is covered"], ["c", "Send the firewall configs and VLAN maps but watermark them first"], ["d", "Terminate the MOU immediately — partners who ask are adversaries"]], "correct": ["a"], "hint": "The MOU's breadth is exactly why it cannot be read as a blank cheque. What did the parties SAY they wanted to achieve?", "explain": "An MOU records intent; it does not abolish need-to-know, your own confidentiality duties, or regulatory limits on security documentation. Firewall rulebases, VLAN maps, and penetration test reports are an attacker's roadmap — sharing them is a decision, not a default. The professional answer scopes the sharing to the stated purpose (indicators, detections, watchlists) and, if broader sharing is genuinely wanted, puts it in a precise addendum with handling terms — purpose limitation applied to the MOU itself. Sending everything honors the drafting sloppiness over the security mission; watermarking changes nothing about the exposure; and tearing up the partnership over one request throws away the intelligence the MOU was built to deliver."}, {"id": "h26", "type": "slots", "theme": "AGR", "pts": 2, "scen": "DataWave confirms the payroll breach. Your MSA's incident notification clause requires written notice with defined content; the DSA adds processor duties. Your inbox already has three vendors' worth of 'we take security seriously' emails. Six demands were proposed in the war room.", "q": "Sort the six demands: contractually solid ground, or not ours to demand?", "items": [["w1", "Written notice with the incident timeline inside the contractual window"], ["w2", "A named point of contact and an update cadence for the duration"], ["w3", "Evidence preservation and a root-cause analysis report"], ["w4", "Confirmation whether Meridian's data was accessed, plus destruction certificate for anything deleted"], ["w5", "The raw SIEM logs of DataWave's OTHER customers for cross-checking"], ["w6", "A public statement naming Meridian's competitors as also affected"]], "groups": [["z1", "Contractually demandable — cite the clause"], ["z2", "Not ours to demand — refuse politely"]], "map": {"w1": "z1", "w2": "z1", "w3": "z1", "w4": "z1", "w5": "z2", "w6": "z2"}, "hint": "Everything you are owed concerns YOUR data, YOUR timeline, and proof — nothing you are owed concerns their other customers.", "explain": "The notification clause gives you the written notice with timeline and content requirements; the named contact and cadence make the clause workable during the incident; evidence preservation plus the RCA report are standard processor duties and often explicit; and confirmation about YOUR data — accessed, copied, deleted — with a destruction certificate where deletion happened, is the core of the DSA promise. Other customers' SIEM logs are their confidential data, not yours to demand; and a public statement about competitors is gossip with legal risk attached. Demanding exactly what the contract grants — and documenting each delivery — is what makes the clause worth its ink."}, {"id": "h27", "type": "slots", "theme": "Q", "pts": 2, "scen": "You are reviewing YOUR OWN SIG-based security questionnaire before sending it to thirty vendors. The quality review flags items that will produce garbage answers no matter who responds.", "q": "Sort the five items: badly designed — rewrite, or well designed — keep?", "items": [["t1", "Q1: 'Do you encrypt data at rest and in transit with AES-256 and TLS 1.2 or higher? (yes/no)'"], ["t2", "Q2: 'Our security standards are world-class — please confirm you agree. (agree/disagree)'"], ["t3", "Q3: 'Describe your access review process and attach the most recent review record.'"], ["t4", "Q4: 'Are you ISO 27001 certified, do you run a 24/7 SOC with mantrap-controlled offices, and do you hold annual fire drills? (yes/no)'"], ["t5", "Q5: 'List every subprocessor with name, location, service, and last review date.'"]], "groups": [["u1", "Badly designed — rewrite"], ["u2", "Well designed — keep"]], "map": {"t1": "u2", "t2": "u1", "t3": "u2", "t4": "u1", "t5": "u2"}, "hint": "One question tells the vendor what to say. Another asks four questions and allows one bit as the answer.", "explain": "Q2 is a leading question: it states the desired opinion and asks for agreement — the answers measure politeness, not controls. Q4 is quadruple-barreled: certification, SOC operation, physical access, and fire drills in one yes/no — a 'yes' means at most one of them is true, and the reviewer learns nothing about which. Q1 is specific and answerable, Q3 demands evidence with the answer, Q5 forces the subprocessor transparency you need. Good questionnaire design: one control per item, specific criteria, evidence attached, no adjectives to agree with. The design flaws here are the quiet cousins of self-assessment bias — the vendor answers honestly and the instrument still fails."}, {"id": "h28", "type": "branch", "theme": "Q", "pts": 3, "scen": "FileFlow (tier-1 SaaS) emails: 'We have added Marquis Analytics as a subprocessor for usage analytics, effective in 30 days.' Your DSA with FileFlow grants a 30-day objection window and requires notice of subprocessor changes. Marquis will process metadata — timestamps, document IDs, user identifiers — not document content.", "q": "Work the change-control path.", "stages": [{"q": "Day 0 — what is the first move inside the objection window?", "opts": [["v1a", "Log the change, check it against the flow-down terms, and start reassessment"], ["v1b", "Ignore it — SaaS vendors add subprocessors all the time anyway"], ["v1c", "Delete the FileFlow tenant before the 30 days expire"]], "correct": "v1a", "resolv": {"v1a": "Correct — the window exists to assess, not to panic or to sleep.", "v1b": "The DSA gave you 30 days precisely because unchecked chains grow in the dark.", "v1c": "Terminating before assessment burns a working service over metadata."}}, {"q": "Day 12 — assessment: metadata only, but user identifiers are in scope. The risk decision?", "opts": [["v2a", "Accept with conditions: update the subprocessor annex and monitor for scope creep"], ["v2b", "Accept silently — metadata is harmless by its very definition"], ["v2c", "Accept and also send Marquis document content to help the analytics"]], "correct": "v2a", "resolv": {"v2a": "Correct — conditions, paper, and a tripwire against creep.", "v2b": "User identifiers are personal data; 'metadata' is not a magic word.", "v2c": "You just expanded the chain and the purposes yourself — the exact failure the DSA prevents."}}, {"q": "Day 30 — how does ongoing monitoring change?", "opts": [["v3a", "Marquis enters the register with its own reassessment cycle and KRI lines"], ["v3b", "Nothing changes — FileFlow's assessment covers its subprocessors forever"], ["v3c", "Ask FileFlow to guarantee in writing that Marquis will never suffer a breach"]], "correct": "v3a", "resolv": {"v3a": "Correct — every new party gets a register entry, a cycle, and indicators.", "v3b": "Vendor self-coverage is the assumption that subprocessor risk lives on unmonitored.", "v3c": "Nobody can guarantee absence of breach — ask for controls and notification duties instead."}}], "hint": "Assess inside the window, accept with conditions and paper, and give the new party its own monitoring line.", "explain": "The 30-day objection window is a work order: log the change, assess the new party's role and data against the flow-down terms, decide with conditions. Metadata is not exempt — user identifiers are personal data — so acceptance comes with an updated SaaS agreement (DSA) subprocessor annex and scope-creep monitoring. The new subprocessor then enters the register with its own reassessment cycle and indicators; 'the vendor covers it' is how fourth parties accumulate unseen. Done well, the change control looks boring — which is the point: vendor monitoring is the art of making supply-chain changes boring."}, {"id": "h29", "type": "choice", "theme": "MON", "pts": 2, "scen": "The vendor selection is nearly done: your top-ranked MSSP finalist from the RFP scored highest on the weighted scoring matrix, and the reference checks glowed. Then procurement discovers the finalist is 35% owned by your largest competitor — a conflicting interest nobody declared. The contract is a week from signature.", "q": "What is the correct action?", "opts": [["a", "Disclose to the risk committee and either apply heightened controls or exclude the finalist"], ["b", "Proceed — partial ownership is normal in this market and the scores were the best"], ["c", "Proceed but do not mention the ownership to anyone, so the process stays calm"], ["d", "Proceed and quietly copy every incident ticket to the competitor's board seat"]], "correct": ["a"], "hint": "The conflict is not automatically fatal — the failure is leaving it undeclared and unmanaged.", "explain": "A competing owner inside a vendor that will see your incidents, detections, and weaknesses is a textbook conflicting interest: the risk is real but manageable, and the governance answer is disclosure plus a recorded decision. The risk committee either excludes the finalist or proceeds with heightened controls — segregation of your data, enhanced audit rights, predefined exit. Hiding the ownership (c) corrupts the vendor selection and the register; option d is not management but compromise. The weighted scoring matrix measures capability, not loyalty — that is why conflicting-interest review runs as its own gate, and why reference checks and ownership checks belong in due diligence before the final, not after it."}, {"id": "h30", "type": "fill", "theme": "MON", "pts": 2, "scen": "Quarter-end. Your vendor risk report goes to the executive committee. Legal wants the key terms used precisely — this report becomes the reference for next quarter's decisions.", "q": "Complete the executive summary. Click a term, then its blank.", "text": "DataWave remains our critical tier-1 vendor after the Q2 breach; its reassessment now runs {1} instead of waiting for the annual date. The two new KRIs proved their worth: the alerting {2} fired twice — patch backlog and unpaid service credits. The right-to-audit was exercised once; our auditor worked from the standard {3} letter. FileFlow's subprocessor change closed with a DSA {4}; no offboarding cases this quarter, and one contract reached EOSL and was replaced before support lapsed.", "bank": ["out-of-cycle", "threshold", "authorization", "annex", "annual-only", "verbal"], "correct": {"1": "out-of-cycle", "2": "threshold", "3": "authorization", "4": "annex"}, "hint": "The reassessment refuses to wait. The alerting trips on a value. The auditor carries a letter. The DSA grows a schedule.", "explain": "Out-of-cycle reassessment is what a breach triggers — the annual date is no longer the reference. A KRI threshold is the defined value that turns a metric into mandatory action; twice this quarter it worked. The authorization letter is the document that makes an audit lawful and bounded — auditors without it are guests, not auditors. The DSA annex is where the subprocessor schedule and its terms live. Precise terms matter at executive level: 'annual-only' is the failure mode this report shows being replaced, and a 'verbal' anything is a finding, not a control."}]};
</script>
<script>
(function(){
'use strict';
var E = window.__EXAM__;
var META = E.meta;
var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function derange(correct){
  /* starting layout for ordering exercises: never any item already in its
     correct slot, so an untouched Check can never earn free partial credit */
  var a=shuf(correct), n=a.length, i, t, guard=0, bad=true;
  while(bad && guard<200){
    guard++; bad=false;
    for(i=0;i<n;i++){
      if(a[i]===correct[i]){ var j=(i+1)%n; t=a[i]; a[i]=a[j]; a[j]=t; }
    }
    for(i=0;i<n;i++){ if(a[i]===correct[i]){ bad=true; break; } }
  }
  if(bad){ a=correct.slice(1).concat(correct.slice(0,1)); } /* guaranteed derangement, n>=2 */
  return a;
}
function r1(x){return Math.round(x*100)/100;}
function fmtPts(x){var v=Math.round(x*10)/10;return (v%1===0? String(Math.round(v)) : v.toFixed(1));}
function isMulti(ex){
  if(ex.type==='match'||ex.type==='slots'||ex.type==='order'||ex.type==='fill'||ex.type==='branch') return true;
  if(ex.type==='choice') return ex.correct.length>1;
  if(ex.type==='logview') return ex.ans.correct.length>1;
  return false;
}

/* ---------------- state ---------------- */
var S = {started:false,finished:false,order:[],cur:0,qs:[],manualPause:false,checkPause:false,
         tLeft:0,tick:null,cand:'',scoreSent:false,attempt:0};
window.__exam = S; /* debug/state handle for the host page and tests */
function running(){return S.started && !S.finished && !S.manualPause && !S.checkPause;}

/* ---------------- boot ---------------- */
function boot(){
  buildHeader(); buildIntro(); buildShell();
  $('#btnStart').addEventListener('click', startExam);
  $('#btnPause').addEventListener('click', toggleManualPause);
  window.addEventListener('message', onMsg);
  document.addEventListener('keydown', function(ev){
    if(ev.target && /INPUT|TEXTAREA|SELECT|BUTTON/.test(ev.target.tagName)) return;
    var ae=document.activeElement;
    if(ae && ae!==document.body && !/^(HTML|BODY)$/.test(ae.tagName)) return;
    if(!S.started || S.finished) return;
    if(ev.key==='ArrowLeft' && !$('#btnPrev').disabled){ $('#btnPrev').click(); }
    if(ev.key==='ArrowRight' && !$('#btnNext').disabled){ $('#btnNext').click(); }
  });
}
function onMsg(ev){
  if(!ev.data) return;
  var t = ev.data.type;
  if(t!=='CYBERPULSE_INIT' && t!=='CYBERMASTERY_INIT') return;
  try{ if(location.origin!=='null' && ev.origin!==location.origin) return; }catch(e){}
  if(ev.data.username){ S.cand = String(ev.data.username); var c=$('#candChip'); if(c){c.style.display='';c.textContent='Candidate: '+S.cand;} }
}

/* ---------------- header / intro ---------------- */
function buildHeader(){
  var h = $('#hdInner');
  h.innerHTML =
    '<div class="hdrow"><h1>5.3 - Third-party risk</h1>'+
    '<div class="badges">'+
      '<span class="chip time" id="timeChip" title="Time remaining">⏱ <b id="timeTxt">--:--</b></span>'+
      '<span class="chip">Score <b id="scoreTxt">0</b></span>'+
      '<span class="chip" id="progChip">Progress <b id="progTxt">0/'+E.exercises.length+'</b></span>'+
      '<button class="btn sm" id="btnPause" title="Pause the timer. Content is hidden while paused.">⏸ Pause</button>'+
      '<span class="chip cand" id="candChip" style="display:none"></span>'+
    '</div></div>'+
    '<div class="bar"><i id="progBar"></i></div>'+
    '<div class="indics">'+
      '<span class="indic man" id="indMan">⏸ Paused (manual) — content hidden, timer frozen</span>'+
      '<span class="indic chk" id="indChk">◆ Timer paused — review mode. Press Next to resume.</span>'+
    '</div>';
}
function kwPanel(){
  var out = '<details class="kpanel"><summary>Keywords covered in this exam ('+Object.keys(E.keywords).length+' themes)</summary><div class="kgrid">';
  Object.keys(E.keywords).forEach(function(tid){
    out += '<div class="kcol"><h4>'+esc(E.themes[tid]||tid)+'</h4><div class="kws">'+
      E.keywords[tid].map(function(k){return '<span class="kw">'+esc(k)+'</span>';}).join('')+'</div></div>';
  });
  return out+'</div></details>';
}
function buildIntro(){
  var m = META;
  var boxes = [
    box('Scenario / Question / Answers','Every exercise shows three clearly separated blocks: the <b>SCENARIO</b> (the setup and its artefacts), the <b>QUESTION</b>, and the <b>ANSWER</b> area. Read them in that order.'),
    box('Check — with review pause','Press <b>Check</b> to validate. You get inline per-element feedback and an explanation, and the timer <b>pauses in review mode</b> (content stays fully visible). Only pressing <b>Next</b> restarts the clock.'),
    box('Manual pause','The <b>Pause</b> button in the header freezes the timer but <b>blurs the exercise</b>, so it cannot be used to study. Both pauses can stack; the clock restarts only when both are cleared.'),
    box('Skip — and come back','<b>Skip</b> jumps to the next exercise and marks it in amber. Before time runs out you can go back to any skipped exercise and finish it. Skipped exercises are <b>excluded from scoring</b> (they count neither in your points nor in the total).'),
    box('Partial credit','Multi-answer exercises (multi-select, drag & drop, matching, ordering, branching) are scored <b>per correct element</b>. A wrong pick does not subtract — you keep the points for what you got right.'),
    box('Hints','Each exercise has one hint, worth <b>−10% of that exercise</b>. It gives a nudge, never the answer. Retaking the exam reshuffles questions and answers.')
  ];
  $('#scrIntro').innerHTML =
  '<div class="panel"><h2>'+esc(m.titlePrefix)+' — '+esc(m.sevLabel)+' practice exam</h2>'+
  '<p class="metaLine">'+m.qCount+' scenario-based exercises · '+m.estMin+' minutes · passing score <b>'+m.passMark+'%</b> · severity: <b>'+esc(m.sevLabel)+'</b> · topic '+esc(m.topicId)+' · chapter '+esc(m.chapter)+'</p>'+
  '<h3>How this exam works</h3>'+
  '<div class="infoGrid">'+boxes.join('')+'</div>'+
  '<h3>Exercise types you will meet</h3>'+
  '<p>'+esc(E.typeList)+'</p>'+
  kwPanel()+
  '<div class="startRow"><button class="btn pri" id="btnStart">▶ Start '+esc(m.sevLabel)+' exam</button>'+
  '<span class="metaLine">Timer starts when you press Start. Keep an eye on the amber/blue pause indicators under the progress bar.</span></div></div>';
}
function box(t,b){return '<div class="infoBox"><b>'+t+'</b><p>'+b+'</p></div>';}
function buildShell(){
  $('#scrExam').innerHTML =
    '<div class="navPanel"><details open id="navDet"><summary>Question navigator, themes & submit</summary>'+
    '<div class="ngrid" id="ngrid"></div>'+
    '<div class="nlegend"><span><i class="li-ans">●</i> answered</span><span><i class="li-chk">✓</i> checked</span><span><i class="li-skip">▲</i> skipped</span><span><i class="li-un">○</i> not done</span></div>'+
    '<div class="themeChips" id="themeChips"></div>'+
    '<div class="submitRow"><button class="btn ok" id="btnSubmit">✔ Submit exam</button>'+
    '<span class="note">Submitting ends the attempt. Skipped exercises are excluded from the score.</span></div></details></div>'+
    '<div class="warnBar" id="allSkipWarn">⚠ All exercises are skipped. Answer at least one exercise before submitting.</div>'+
    '<div class="card" id="qcard"><div class="qbody" id="qbody"></div>'+
    '<div class="pauseOv"><div><div class="big">⏸ Paused (manual)</div><div class="sm">The timer is frozen and the exercise is hidden. Press Resume to continue.</div>'+
    '<button class="btn warn" id="btnResume" style="margin-top:12px">▶ Resume</button></div></div></div>';
  $('#btnResume').addEventListener('click', toggleManualPause);
  $('#btnSubmit').addEventListener('click', submitExam);
}
function buildResults(){ /* rendered on demand */ }

/* ---------------- start / reset ---------------- */
function startExam(){
  S.attempt++; S.started=true; S.finished=false; S.scoreSent=false;
  S.manualPause=false; S.checkPause=false; S.cur=0; S.tLeft=E.timerSec;
  S.order = shuf(E.exercises.map(function(_,i){return i;}));
  S.qs = E.exercises.map(function(ex){
    var q = {ex:ex,status:'un',earned:0,hint:false,marks:null,snap:null,ans:null,r:{}};
    initRender(q); return q;
  });
  $('#scrIntro').classList.remove('on');
  $('#scrResults').classList.remove('on');
  $('#scrExam').classList.add('on');
  buildNav(); renderQ(); updScore(); updTime();
  if(S.tick) clearInterval(S.tick);
  S.tick = setInterval(function(){
    if(!running()) return;
    S.tLeft--;
    if(S.tLeft<=0){ S.tLeft=0; updTime(); finishExam(); return; }
    updTime();
  },1000);
  updIndics(); updProg();
  window.scrollTo(0,0);
}
function initRender(q){
  var ex=q.ex;
  if(ex.type==='choice'){ q.r.optOrder = shuf(ex.opts.map(function(o){return o[0];})); }
  if(ex.type==='match'||ex.type==='slots'){ q.r.itemOrder = shuf(ex.items.map(function(o){return o[0];})); q.r.slotOrder = shuf((ex.slots||ex.groups).map(function(o){return o[0];})); }
  if(ex.type==='order'){ q.r.oOrder = derange(ex.items.map(function(o){return o[0];})); }
  if(ex.type==='fill'){ q.r.bankOrder = shuf(ex.bank.slice()); }
  if(ex.type==='logview'){ q.r.optOrder = shuf(ex.ans.opts.map(function(o){return o[0];})); }
}
function resetAnswers(q){
  var ex=q.ex;
  if(ex.type==='choice'||ex.type==='logview'){ q.ans={sel:[]}; }
  if(ex.type==='match'||ex.type==='slots'){ q.ans={map:{},picked:null,drag:null}; }
  if(ex.type==='order'){ q.ans={list:q.r.oOrder.slice()}; }
  if(ex.type==='fill'){ q.ans={b:{},picked:null}; }
  if(ex.type==='branch'){ q.ans={path:[],done:false}; }
  if(ex.type==='terminal'){ q.ans={last:'',n:0}; }
}

/* ---------------- timer / header ---------------- */
function updTime(){
  var m=Math.floor(S.tLeft/60), s=S.tLeft%60;
  $('#timeTxt').textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  $('#timeChip').classList.toggle('low', S.tLeft < E.timerSec*0.1 && !S.finished);
}
function updScore(){
  var tot=0;
  S.qs.forEach(function(q){ if(q.status==='chk') tot+=q.earned; });
  $('#scoreTxt').textContent = fmtPts(tot);
}
function updProg(){
  var n=0; S.qs.forEach(function(q){ if(q.status!=='un') n++; });
  $('#progTxt').textContent = n+'/'+S.qs.length;
  $('#progBar').style.width = Math.round(n/S.qs.length*100)+'%';
}
function updIndics(){
  $('#indMan').classList.toggle('on', S.manualPause && !S.finished);
  $('#indChk').classList.toggle('on', S.checkPause && !S.finished);
  $('#btnPause').innerHTML = S.manualPause ? '▶ Resume' : '⏸ Pause';
}
function toggleManualPause(){
  if(!S.started || S.finished) return;
  S.manualPause = !S.manualPause;
  $('#qcard').classList.toggle('dimmed', S.manualPause);
  updIndics();
}

/* ---------------- navigator ---------------- */
function buildNav(){
  var g=$('#ngrid'); g.innerHTML='';
  S.order.forEach(function(qi,pos){
    var b=document.createElement('button');
    b.className='ncell'; b.textContent=pos+1;
    b.setAttribute('aria-label','Question '+(pos+1));
    b.addEventListener('click',function(){ S.cur=pos; renderQ(); });
    g.appendChild(b);
  });
  var tc=$('#themeChips'); tc.innerHTML='';
  Object.keys(E.themes).forEach(function(tid){
    var tot=0,done=0;
    S.qs.forEach(function(q){ if(q.ex.theme===tid){tot++; if(q.status==='ans'||q.status==='chk'||q.status==='rev') done++;} });
    if(!tot) return;
    var c=document.createElement('span'); c.className='tchip'; c.dataset.tid=tid;
    c.innerHTML=esc(E.themes[tid])+' <b>0/'+tot+'</b>'; c.dataset.tot=tot;
    tc.appendChild(c);
  });
  updNav();
}
function updNav(){
  var cells=$$('#ngrid .ncell');
  S.order.forEach(function(qi,pos){
    var q=S.qs[qi], c=cells[pos];
    c.classList.remove('ans','chk','skip','cur');
    if(pos===S.cur) c.classList.add('cur');
    if(q.status==='chk') c.classList.add('chk');
    else if(q.status==='skip') c.classList.add('skip');
    else if(q.status!=='un') c.classList.add('ans');
    c.setAttribute('aria-label','Question '+(pos+1)+': '+(q.status==='chk'?'checked':q.status==='skip'?'skipped':q.status!=='un'?'answered':'not done'));
  });
  $$('#themeChips .tchip').forEach(function(ch){
    var tid=ch.dataset.tid, tot=+ch.dataset.tot, done=0;
    S.qs.forEach(function(q){ if(q.ex.theme===tid && (q.status==='ans'||q.status==='chk'||q.status==='rev')) done++; });
    ch.innerHTML=esc(E.themes[tid])+' <b>'+done+'/'+tot+'</b>';
  });
}

/* ---------------- render question ---------------- */
function qAt(pos){ return S.qs[S.order[pos]]; }
function themeName(id){ return E.themes[id]||id; }
function typeLabel(ex){
  if(ex.tlabel) return ex.tlabel;
  switch(ex.type){
    case 'choice': return ex.correct.length>1?'Multi-select':'Multiple choice';
    case 'match': return 'Matching';
    case 'slots': return 'Drag & drop';
    case 'order': return ex.rank?'Prioritization':'Ordering';
    case 'fill': return 'Fill in the blank';
    case 'branch': return 'Decision scenario';
    case 'terminal': return 'Terminal';
    case 'logview': return 'Log analysis';
  }
  return ex.type;
}

/* ---------------- answer renderers ---------------- */
function renderAnswer(q){
  var z=$('#ansZone'); var ex=q.ex; var locked=(q.status==='chk');
  var lab='';
  if(ex.type==='choice') lab = ex.correct.length>1?'CHOOSE ALL THAT APPLY':'CHOOSE ONE';
  else if(ex.type==='logview') lab = ex.ans.correct.length>1?'CHOOSE ALL THAT APPLY':'CHOOSE ONE';

  else if(ex.type==='slots') lab = 'DRAG EACH ITEM INTO A GROUP — drag, or click item then group';
  else if(ex.type==='order') lab = ex.rank?'RANK FROM MOST TO LEAST — drag or use arrows':'PUT IN THE RIGHT ORDER — drag or use arrows';
  else if(ex.type==='fill') lab = 'CLICK A WORD, THEN ITS BLANK';
  else if(ex.type==='branch') lab = 'WORK THROUGH THE SCENARIO — each step unlocks the next';

  z.innerHTML=h;
