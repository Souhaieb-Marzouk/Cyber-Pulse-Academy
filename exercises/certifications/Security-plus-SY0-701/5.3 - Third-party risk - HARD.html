}

/* ---------------- answer wiring ---------------- */
function wireAnswer(q){
  var ex=q.ex, locked=(q.status==='chk');
  if(ex.type==='choice'||ex.type==='logview'){
    $$('#ansZone .opt').forEach(function(row){
      var inp=row.querySelector('input');
      inp.addEventListener('change',function(){
        if(locked) return;
        var id=inp.value;
        if(inp.type==='radio'){ q.ans.sel=[id]; }
        else{
          var i=q.ans.sel.indexOf(id);
          if(i>=0) q.ans.sel.splice(i,1); else q.ans.sel.push(id);
        }
        $$('#ansZone .opt').forEach(function(r){
          var on=q.ans.sel.indexOf(r.dataset.opt)>=0;
          r.classList.toggle('sel',on);
          var ii=r.querySelector('input'); if(ii) ii.checked=on;
        });
      });
    });
  }
  if(ex.type==='match'||ex.type==='slots'){
    wireDnD(q);
  }
  if(ex.type==='order'){
    wireOrder(q);
  }
  if(ex.type==='fill'){
    $$('#bank .bw').forEach(function(b){
      b.addEventListener('click',function(){
        if(locked||b.classList.contains('used')) return;
        $$('#bank .bw').forEach(function(x){x.classList.remove('picked');});
        b.classList.add('picked'); q.ans.picked=b.dataset.w;
      });
    });
    $$('#ansZone .blank').forEach(function(bl){
      bl.addEventListener('click',function(){
        if(locked) return;
        var n=bl.dataset.b;
        if(q.ans.b[n]){
          delete q.ans.b[n]; bl.textContent='\u00a0'; bl.classList.remove('filled');
          return;
        }
        if(q.ans.picked){
          q.ans.b[n]=q.ans.picked; bl.textContent=q.ans.picked; bl.classList.add('filled');
          var bw=$$('#bank .bw').filter(function(x){return x.dataset.w===q.ans.picked;})[0];
          if(bw){bw.classList.add('used');bw.classList.remove('picked');}
          q.ans.picked=null;
        }
      });
      bl.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();bl.click();} });
    });
  }
  if(ex.type==='branch' && !locked){
    $$('#ansZone .opt[data-stg]').forEach(function(row){
      row.addEventListener('click',function(ev){
        if(ev.target.tagName==='INPUT') { /* label handles it */ }
        var i=+row.dataset.stg, oid=row.dataset.opt;
        var st=ex.stages[i];
        if(q.ans.path.length>i) return;
        q.ans.path.push(oid);
        if(i+1>=ex.stages.length || (st.next && st.next[oid]===-1)) q.ans.done=true;
        renderAnswer(q);
        var chk=$('#btnCheck');
        if(q.ans.done){ chk.disabled=false; chk.title=''; }
      });
    });
  }
  if(ex.type==='terminal'){
    var ti=$('#termIn');
    if(ti && !locked){
      ti.addEventListener('keydown',function(ev){
        if(ev.key!=='Enter') return;
        var cmd=ti.value.trim(); if(!cmd) return;
        var okRx = ex.term.accept.some(function(rx){ try{ return new RegExp(rx,'i').test(cmd); }catch(e){ return false; } });
        q.termLines=q.termLines||[];
        q.termLines.push({ps:ex.term.ps1,cmd:cmd,out: okRx? ex.term.out : (ex.term.err||'command not recognized — no output'),ok:okRx});
        q.ans.last=cmd; q.ans.n=(q.ans.n||0)+1;
        ti.value='';
        renderQ.keepScroll=true;
        var keep=window.scrollY;
        renderQ();
        window.scrollTo(0,keep);
        var ni=$('#termIn'); if(ni) ni.focus();
      });
    }
  }
  if(ex.type==='logview'){
    var f=$('#lvFilter');
    if(f) f.addEventListener('input',function(){
      var v=f.value.trim().toLowerCase(), n=0;
      $$('#lvRows tr').forEach(function(tr){
        var on=!v||tr.dataset.t.indexOf(v)>=0;
        tr.style.display=on?'':'none'; if(on)n++;
      });
      $('#lvCount').textContent=v? (n+' shown') : '';
    });
  }
}
function wireDnD(q){
  var ex=q.ex, locked=(q.status==='chk');
  function assign(iid,sid){
    Object.keys(q.ans.map).forEach(function(k){ if(q.ans.map[k]===sid && k!==iid && ex.type==='match') delete q.ans.map[k]; });
    q.ans.map[iid]=sid; q.ans.picked=null; renderAnswer(q);
  }
  $$('#ansZone .item').forEach(function(it){
    it.addEventListener('dragstart',function(ev){
      if(locked){ev.preventDefault();return;}
      q.ans.drag=it.dataset.item; it.classList.add('dragging');
      try{ev.dataTransfer.setData('text/plain',it.dataset.item);}catch(e){}
    });
    it.addEventListener('dragend',function(){ it.classList.remove('dragging'); });
    it.addEventListener('click',function(){
      if(locked) return;
      var iid=it.dataset.item;
      if(q.ans.map[iid]){ delete q.ans.map[iid]; renderAnswer(q); return; }
      if(q.ans.picked===iid){ q.ans.picked=null; } else { q.ans.picked=iid; }
      renderAnswer(q);
    });
    it.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();it.click();} });
  });
  $$('#ansZone .slot').forEach(function(sl){
    sl.addEventListener('dragover',function(ev){ if(!locked){ev.preventDefault(); sl.classList.add('hl');} });
    sl.addEventListener('dragleave',function(){ sl.classList.remove('hl'); });
    sl.addEventListener('drop',function(ev){
      ev.preventDefault(); sl.classList.remove('hl');
      if(locked) return;
      var iid=q.ans.drag||ev.dataTransfer.getData('text/plain');
      if(iid) assign(iid,sl.dataset.slot);
    });
    sl.addEventListener('click',function(ev){
      if(locked||ev.target.closest('.item')) return;
      if(q.ans.picked) assign(q.ans.picked,sl.dataset.slot);
    });
    sl.addEventListener('keydown',function(ev){
      if(ev.key!=='Enter'&&ev.key!==' ') return;
      ev.preventDefault();
      if(!locked&&q.ans.picked) assign(q.ans.picked,sl.dataset.slot);
    });
  });
}
function wireOrder(q){
  var locked=(q.status==='chk');
  function move(i,d){
    if(locked) return;
    var l=q.ans.list, j=i+d;
    if(j<0||j>=l.length) return;
    var t=l[i]; l[i]=l[j]; l[j]=t;
    renderAnswer(q);
  }
  $$('#ansZone .oitem').forEach(function(row){
    row.addEventListener('dragstart',function(ev){
      if(locked){ev.preventDefault();return;}
      q.ans.drag=row.dataset.item; row.classList.add('dragging');
      try{ev.dataTransfer.setData('text/plain',row.dataset.item);}catch(e){}
    });
    row.addEventListener('dragend',function(){row.classList.remove('dragging');});
    row.addEventListener('dragover',function(ev){ if(!locked) ev.preventDefault(); });
    row.addEventListener('drop',function(ev){
      ev.preventDefault(); if(locked) return;
      var src=q.ans.drag||ev.dataTransfer.getData('text/plain');
      if(!src||src===row.dataset.item) return;
      var l=q.ans.list, si=l.indexOf(src), ti=l.indexOf(row.dataset.item);
      l.splice(si,1); l.splice(l.indexOf(row.dataset.item),0,src);
      renderAnswer(q);
    });
  });
  $$('#ansZone .mv button').forEach(function(b){
    b.addEventListener('click',function(){ move(+b.dataset.i, b.dataset.mv==='up'?-1:1); });
  });
}

/* ---------------- grading ---------------- */
function doCheck(q){
  if(q.status==='chk') return;
  var ex=q.ex, g=grade(q);
  q.marks=g.marks; q.snap=snapOf(q);
  var earned = g.n? (g.c/g.n*ex.pts) : 0;
  if(q.hint) earned*=0.9;
  q.earned=r1(earned);
  q.status='chk';
  renderQ();
  window.scrollTo(0,0);
  updScore(); updNav(); updProg();
  S.checkPause=true; updIndics();
}
function grade(q){
  var ex=q.ex, m={};
  function mk(n,c){ return {n:n,c:c,marks:m}; }
  if(ex.type==='choice'||ex.type==='logview'){
    var corr=(ex.type==='logview')?ex.ans.correct:ex.correct;
    var sel=q.ans.sel||[];
    if(corr.length===1){
      var ok = sel.length===1 && sel[0]===corr[0];
      if(ok) m[corr[0]]='ok';
      sel.forEach(function(s){ if(s!==corr[0]) m[s]='bad'; });
      return mk(1, ok?1:0);
    }
    var c=0;
    corr.forEach(function(id){ if(sel.indexOf(id)>=0){m[id]='ok';c++;} else m[id]='miss'; });
    sel.forEach(function(s){ if(corr.indexOf(s)<0) m[s]='bad'; });
    return mk(corr.length,c);
  }
  if(ex.type==='match'||ex.type==='slots'){
    var c2=0;
    ex.items.forEach(function(it){
      var got=q.ans.map[it[0]], want=ex.map[it[0]];
      if(got===want){m[it[0]]='ok';c2++;} else if(got) m[it[0]]='bad'; else m[it[0]]='miss';
    });
    return mk(ex.items.length,c2);
  }
  if(ex.type==='order'){
    var c3=0;
    ex.items.forEach(function(it,i){
      var got=q.ans.list[i];
      if(got===it[0]){m['p'+i]='ok';c3++;} else m['p'+i]='bad';
    });
    return mk(ex.items.length,c3);
  }
  if(ex.type==='fill'){
    var c4=0;
    Object.keys(ex.correct).forEach(function(k){
      var got=(q.ans.b[k]||'').toLowerCase().trim(), want=ex.correct[k].toLowerCase();
      if(got===want){m['b'+k]='ok';c4++;} else m['b'+k]=got?'bad':'miss';
    });
    return mk(Object.keys(ex.correct).length,c4);
  }
  if(ex.type==='branch'){
    var c5=0, bm={};
    q.ans.path.forEach(function(oid,i){
      var st=ex.stages[i];
      if(oid===st.correct){bm[i]='ok';c5++;} else bm[i]='bad';
    });
    m.branch=bm;
    return mk(ex.stages.length,c5);
  }
  if(ex.type==='terminal'){
    var last=(q.ans.last||'').trim();
    var ok2=last && ex.term.accept.some(function(rx){ try{return new RegExp(rx,'i').test(last);}catch(e){return false;} });
    return mk(1, ok2?1:0);
  }
  return mk(1,0);
}
function applyMarks(q){
  if(q.status!=='chk'||!q.marks) return;
  var ex=q.ex, m=q.marks;
  var icon={ok:'✓',bad:'✘',miss:'◐'};
  if(ex.type==='choice'||ex.type==='logview'){
    $$('#ansZone .opt').forEach(function(row){
      var k=m[row.dataset.opt]; if(!k) return;
      row.classList.add('m-'+k);
      row.querySelector('.mk').textContent=icon[k];
      row.querySelector('.mk').title=({ok:'correct',bad:'wrong',miss:'correct but not selected'})[k];
      var inp=row.querySelector('input'); if(inp) inp.disabled=true;
    });
  }
  if(ex.type==='match'||ex.type==='slots'){
    $$('#ansZone .item').forEach(function(row){
      var k=m[row.dataset.item]; if(!k) return;
      row.classList.add('m-'+k);
      var g=row.querySelector('.grab'); if(g) g.textContent=icon[k]||'\u25d0';
    });
  }
  if(ex.type==='order'){
    $$('#ansZone .oitem').forEach(function(row){
      var k=m['p'+row.dataset.idx]; if(!k) return;
      row.classList.add('m-'+k);
      var om=row.querySelector('.omk');
      if(om){ om.textContent=icon[k]; om.title=({ok:'correct position',bad:'wrong position'})[k]||''; }
    });
  }
  if(ex.type==='fill'){
    $$('#ansZone .blank').forEach(function(bl){
      var k=m['b'+bl.dataset.b]; if(!k) return;
      bl.classList.add('m-'+k);
      bl.title=({ok:'correct',bad:'wrong',miss:'not filled — correct word: '+ex.correct[bl.dataset.b]})[k];
    });
  }
  if(ex.type==='branch'){
    $$('#ansZone .stage').forEach(function(stEl,i){
      if(i>=q.ans.path.length) return;
      var k=(m.branch&&m.branch[i])||'bad';
      var opt=stEl.querySelector('.opt.lock');
      if(opt){ opt.classList.add('m-'+k); opt.querySelector('.mk').textContent=icon[k]; }
    });
  }
}
function applyFeedback(q){
  var ex=q.ex, fb=$('#fbBox'), expl=$('#explBox');
  var max=ex.pts, e=q.earned;
  var label, cls;
  if(e>=max-0.001){label='Full credit';cls='full';}
  else if(e<=0.001){label='No credit';cls='zero';}
  else{label='Partial credit';cls='part';}
  fb.className='fb on '+cls;
  var ic=cls==='full'?'✓':(cls==='zero'?'✘':'◐');
  fb.focus(); /* moving focus makes screen readers announce the result */
  fb.innerHTML='<div class="fbHead"><span class="stIc">'+ic+'</span> '+label+
    '<span class="fbScore">'+fmtPts(e)+' / '+max+' pts</span></div>'+
    (q.hint?'<div class="fbSub">Includes hint penalty −10%.</div>':'')+
    '<div class="fbSub">'+(isMulti(ex)?'Scored per element: green ✓ correct, red ✘ wrong, amber ◐ correct but missed.':'')+'</div>';
  expl.className='expl on';
  expl.innerHTML='<div class="el">◈ Why</div><p>'+esc(ex.explain)+'</p>';
  var chk=$('#btnCheck'); if(chk){chk.disabled=true;chk.innerHTML='✓ Checked';}
  var rv=$('#btnRevise'); if(rv) rv.style.display='';
}

/* ---------------- revise / skip / submit ---------------- */
function doRevise(q){
  if(q.status!=='chk') return;
  q.status='rev'; q.earned=0; q.marks=null; q.snap=null;
  if(q.ex.type==='branch'){ q.ans={path:[],done:false}; } /* keep q.r so stage option order stays stable on revise */
  if(q.ex.type==='terminal'){ q.termLines=q.termLines||[]; }
  renderQ(); updScore(); updNav();
}
function doSkip(q){
  if(S.finished) return;
  if(q.status==='chk') return; /* a validated answer stays scored — no skipping after Check */
  q.status='skip';
  if(S.cur<S.qs.length-1){ goNext(); }
  else{ renderQ(); }
  updNav(); updProg(); updScore();
}
function submitExam(){
  if(!S.started||S.finished) return;
  var allSkip=true;
  S.qs.forEach(function(q){ if(q.status!=='skip') allSkip=false; });
  if(allSkip){ var w=$('#allSkipWarn'); w.classList.add('on'); $('#navDet').open=true; window.scrollTo(0,0); return; }
  finishExam();
}
function finishExam(){
  if(S.finished) return;
  S.finished=true; S.checkPause=false; S.manualPause=false;
  if(S.tick){clearInterval(S.tick);S.tick=null;}
  updIndics();
  renderResults();
  $('#scrExam').classList.remove('on');
  $('#scrResults').classList.add('on');
  window.scrollTo(0,0);
  if(!S.scoreSent){
    S.scoreSent=true;
    var tot=0, sc=0;
    S.qs.forEach(function(q){ if(q.status!=='skip'){ tot+=q.ex.pts; sc+=q.earned; } });
    /* nothing answered and nothing skipped-but-answered: a 0/0 payload would be
       meaningless to the host site, so only report when there is a scored total */
    if(tot>0){ reportScore(Math.round(sc), tot); }
  }
}
function reportScore(score,total){
  var percent = total>0? Math.round((score/total)*100) : 0;
  try{
    parent.postMessage({type:'CYBERPULSE_SCORE',topicId:META.topicId,score:score,total:total,percent:percent,passed:percent>=META.passMark}, location.origin);
  }catch(e){ /* opened directly — nothing to report to */ }
}

/* ---------------- answer formatting ---------------- */
function labelOf(opts,id){ var o=opts.filter(function(x){return x[0]===id;})[0]; return o?o[1]:id; }
function snapOf(q){
  var ex=q.ex, a=q.ans;
  if(ex.type==='choice') return (a.sel||[]).map(function(id){return labelOf(ex.opts,id);});
  if(ex.type==='logview') return (a.sel||[]).map(function(id){return labelOf(ex.ans.opts,id);});
  if(ex.type==='match'||ex.type==='slots'){
    var slots=(ex.slots||ex.groups);
    return Object.keys(a.map).map(function(k){ return labelOf(ex.items,k)+' → '+labelOf(slots,a.map[k]); });
  }
  if(ex.type==='order') return a.list.map(function(id,i){return (i+1)+'. '+labelOf(ex.items,id);});
  if(ex.type==='fill') return Object.keys(ex.correct).map(function(k){return '#'+k+': '+(a.b[k]||'(empty)');});
  if(ex.type==='branch') return a.path.map(function(oid,i){return 'Step '+(i+1)+': '+labelOf(ex.stages[i].opts,oid);});
  if(ex.type==='terminal') return [a.last||'(no command entered)'];
  return [];
}
function correctOf(q){
  var ex=q.ex;
  if(ex.type==='choice') return ex.correct.map(function(id){return labelOf(ex.opts,id);});
  if(ex.type==='logview') return ex.ans.correct.map(function(id){return labelOf(ex.ans.opts,id);});
  if(ex.type==='match'||ex.type==='slots'){
    var slots=(ex.slots||ex.groups);
    return ex.items.map(function(it){ return labelOf(ex.items,it[0])+' → '+labelOf(slots,ex.map[it[0]]); });
  }
  if(ex.type==='order') return ex.items.map(function(it,i){return (i+1)+'. '+it[1];});
  if(ex.type==='fill') return Object.keys(ex.correct).map(function(k){return '#'+k+': '+ex.correct[k];});
  if(ex.type==='branch') return ex.stages.map(function(st,i){return 'Step '+(i+1)+': '+labelOf(st.opts,st.correct);});
  if(ex.type==='terminal') return [ex.term.example];
  return [];
}

/* ---------------- results ---------------- */
function renderResults(){
  var total=0, sc=0, skipped=[], rows='', nFull=0,nPart=0,nZero=0;
  S.order.forEach(function(qi,pos){
    var q=S.qs[qi], ex=q.ex;
    var isSkip=(q.status==='skip');
    if(!isSkip) total+=ex.pts;
    if(q.status==='chk') sc+=q.earned;
    var lbl,cls;
    if(isSkip){lbl='skipped';cls='skip';skipped.push(pos+1);}
    else if(q.status!=='chk'){lbl='zero';cls='zero';}
    else if(q.earned>=ex.pts-0.001){lbl='full';cls='full';nFull++;}
    else if(q.earned>0.001){lbl='partial';cls='part';nPart++;}
    else{lbl='zero';cls='zero';nZero++;}
    if(!isSkip && q.status!=='chk'){/* unanswered counts 0 */}
    var your = (q.snap&&q.snap.length)? q.snap.map(esc).join('<br>') : (isSkip?'—':'(no answer validated)');
    var corr = correctOf(q).map(esc).join('<br>');
    rows+='<div class="repCard rc-'+cls+'"><div class="rh"><span class="qnum">Q'+(pos+1)+'</span>'+
      '<span class="tag theme">'+esc(themeName(ex.theme))+'</span>'+
      '<span class="tag type">'+esc(typeLabel(ex))+'</span>'+
      '<span class="rlbl '+cls+'">'+lbl+'</span><span class="rpts">'+(isSkip?'not counted':fmtPts(q.status==='chk'?q.earned:0)+' / '+ex.pts)+'</span></div>'+
      '<div class="repSec"><b>Your answer:</b> '+(isSkip?'<i>skipped — not counted in score</i>':your)+'</div>'+
      '<div class="repSec"><b>Correct answer:</b> '+corr+'</div>'+
      '<div class="repExp"><b>Why:</b> '+esc(ex.explain)+'</div></div>';
  });
  var scoreR=Math.round(sc);
  var pct = total>0? Math.round(scoreR/total*100):0;
  var passed = pct>=META.passMark;
  var hero='<div class="panel resHero"><div class="pct" style="color:'+(passed?'var(--ok)':'var(--bad)')+'">'+pct+'%</div>'+
    '<div class="lbl">'+fmtPts(scoreR)+' of '+fmtPts(total)+' points · passing score '+META.passMark+'% · attempt #'+S.attempt+'</div>'+
    (passed
      ?'<div class="passPanel"><div class="pt">★ PASS — certificate earned ★</div><div class="ps">You demonstrated working mastery of '+esc(META.titlePrefix)+' chapter '+esc(META.chapter)+' at '+esc(META.sevLabel)+' severity. Add this to your study log and keep the momentum.</div></div>'
      :'<div class="failPanel"><div class="pt">✘ NOT YET — below the pass mark</div><div class="ps">You need '+META.passMark+'% to pass. Review the report below — the explanation for every element tells you exactly what to focus on — then retake the exam.</div></div>')+
    '<div class="statChips">'+
      '<span class="chip">Full credit <b>'+nFull+'</b></span>'+
      '<span class="chip">Partial <b>'+nPart+'</b></span>'+
      '<span class="chip">Zero <b>'+nZero+'</b></span>'+
      '<span class="chip">Skipped <b>'+skipped.length+'</b></span>'+
      '<span class="chip">Time left <b>'+$('#timeTxt').textContent+'</b></span>'+
    '</div></div>';
  var skipNote = skipped.length? '<div class="skipNote">▲ Skipped (not counted in score or total): Q'+skipped.join(', Q')+'. Their explanations are still shown below so you can learn from them.</div>':'';
  if(total===0) skipNote += '<div class="skipNote" role="alert">⚠ Every exercise was skipped, so nothing was scored and no result was reported to the site.</div>';
  $('#scrResults').innerHTML = hero+skipNote+
    '<div class="panel"><h2>Detailed report</h2><p class="metaLine">Every exercise, your validated answer, the correct answer, and why. Wrong picks do not subtract from partial credit — the report shows exactly what you got right and what you missed.</p>'+rows+
    '<div class="startRow"><button class="btn pri" id="btnRetake">↻ Retake exam</button><span class="metaLine">Retaking reshuffles all questions and answer choices and resets the timer.</span></div></div>';
  $('#btnRetake').addEventListener('click',function(){ startExam(); });
}

/* ---------------- go ---------------- */
document.addEventListener('DOMContentLoaded', boot);
if(document.readyState!=='loading') boot();
})();

</script>
