<script>

var CFG={topicId:"security-plus",chapter:5.4,title:"5.4 Security compliance — HARD",difficulty:"hard",sevLabel:"HARD",passMark:70,secsPerEx:70};
var THEMES=[
{id:"REG",name:"Regulations & data types",kws:["GDPR","CCPA","HIPAA","PCI DSS","SOX","GLBA","FERPA","COPPA","ISO/IEC 27001","SOC 2","NIST CSF","FedRAMP / FISMA","PII","PHI","Cardholder data (PAN)","Data classification","Data controller / processor","Jurisdiction & data ownership"]},
{id:"RPT",name:"Compliance reporting",kws:["Internal compliance report","External / regulator reporting","Internal vs external audit","SOC 2 Type I / Type II","ISO 27001 certification & surveillance audits","PCI SAQ / AOC / ROC","QSA","ASV scan","Evidence collection","Attestation","Due care vs due diligence","Compliance dashboard","KPI","KRI"]},
{id:"CON",name:"Consequences of non-compliance",kws:["Regulatory fines","GDPR fine tiers (4% / EUR 20M)","HIPAA penalty tiers","PCI monthly fines","Consent order","Corrective action plan (CAP)","Lawsuit / class action","Criminal liability","Loss of certification or license","Contract termination (BAA / DPA breach)","Reputational damage","Increased audit frequency","Regulator escalation (OCR / FTC / ICO / state AG)","Processing ban / suspension"]},
{id:"MON",name:"Compliance monitoring",kws:["Continuous monitoring","Point-in-time audit","Automated evidence collection","GRC platform","Policy attestation tracking","Training completion tracking","Exception register","Vendor / third-party monitoring","Self-assessment","Control drift","Audit readiness"]},
{id:"PRV",name:"Privacy & sensitive data",kws:["Data minimization","Masking","Tokenization","Anonymization","Pseudonymization","Retention policy","Legal hold","Information life cycle","Media sanitization","DPIA / PIA","Privacy notice","Consent & lawful basis","Opt-in / opt-out","Breach notification windows (GDPR 72h / HIPAA 60d)","Notice of privacy events","Data subject rights (DSAR)","Right to erasure","Data portability","NDA","MOU","SLA","DPA (data processing agreement)","BAA","Data owner / steward / custodian"]}
];
const EXERCISES=[
{id:"h1",th:"MON",type:"logview",multi:true,title:"Correlate the insider evidence",kw:["Continuous monitoring","PII","Automated evidence collection","Notice of privacy events","Breach notification windows (GDPR 72h / HIPAA 60d)","Audit readiness","Vendor / third-party monitoring"],
scenario:"Northgate Mutual, Friday eve. Contractor j.dore hands in notice. The GRC correlation view below merges three sources: the HR ticket, the VPN gateway and the export monitor. The compliance committee wants facts, not vibes.",
question:"Select ALL statements that the evidence bundle actually supports.",
log:{title:"Evidence bundle RGX-4417 — correlation view (Northgate Mutual)",lines:[
"2026-10-05 18:12 INFO  hr-ticket RGX-4417: j.dore (contractor, data desk) resignation received — last day 2026-10-09",
"2026-10-06 02:10 INFO  vpn-gateway session j.dore from home-gw-221 — session open 94 minutes",
"2026-10-06 02:19 WARN  export-monitor user=j.dore job=E-8871 records=2314502 dest=hxxps://p-drive[.]example/jd_out policy=PII-BULK flagged",
"2026-10-06 02:22 WARN  export-monitor user=j.dore job=E-8872 file=claims_history_full.csv(4.2GB) dest=hxxps://p-drive[.]example/jd_out",
"2026-10-06 03:44 INFO  vpn-gateway session j.dore ended — egress 4.2GB",
"2026-10-06 09:01 INFO  policy-portal j.dore attestation: data handling policy ACCEPTED",
"2026-10-07 11:30 INFO  hr-ticket RGX-4417 note: access termination scheduled for last day 2026-10-09",
"2026-10-08 16:45 WARN  case-queue export job E-8871 review status=OPEN owner=unassigned"]},
opts:["The export jobs moved over two million records to an external destination days before the last day","The signed policy attestation proves the exports were authorized","Access was terminated before the export session happened","A 94-minute VPN session at 02:00 with 4.2GB egress is consistent with bulk data theft, not normal desk work","The bulk-export policy flagged the jobs for review, and that review was still open two days later","The VPN session proves the activity was normal contractor work"],
correct:[0,3,4],
expl:"The logs support three facts: millions of records went to an external destination before the last day; the timing and volume pattern fits bulk theft; and the flagged review was still open — monitoring raised it, nobody finished it. The attestation proves nothing about authorization of exports, termination was scheduled for AFTER the session, and a 2 a.m. 4.2GB pull is not normal desk work. If confirmed, this becomes a privacy event with its own notification clocks (72 hours under GDPR for EU residents). Focus on: correlate times and volumes; an attestation is not an authorization.",
hint:"Check the dates: when did the exports happen, when was access due to end, and what happened to the flagged review?"},
{id:"h2",th:"REG",type:"qcm",title:"Who tells the regulator?",kw:["Data controller / processor","GDPR","External / regulator reporting","DPA (data processing agreement)"],
scenario:"Vireo Cloud, a processor, is breached; customer records belonging to Northgate Mutual, the controller, are exposed. The DPA between them does not even mention breach duties — the duties GDPR sets by law apply anyway. A Vireo manager offers to 'handle the regulator call' alone.",
question:"Under GDPR, who must notify the supervisory authority?",
opts:["Vireo as processor notifies the authority directly and alone","Nobody — the processor absorbs the duty behind the scenes","Northgate, as controller; Vireo must alert Northgate without delay","Only the affected individuals, never the authority"],
correct:2,
expl:"The controller decides and answers to the authority; the processor must notify the CONTROLLER without undue delay and assist. A processor cannot discharge the controller's duty. The individuals may also need telling when risk is high — but that is a separate duty from the authority notice. Focus on: controller notifies the authority; processor alerts the controller and helps.",
hint:"One party owns the relationship with the data subjects and the authority; the other must raise the alarm to that party fast."},
{id:"h3",th:"CON",type:"dnd",title:"Match the stick to the authority",kw:["Regulator escalation (OCR / FTC / ICO / state AG)","HIPAA penalty tiers","GDPR fine tiers (4% / EUR 20M)","Consent order","PCI monthly fines","FedRAMP / FISMA","Loss of certification or license"],
scenario:"The risk committee received six enforcement notices across the group and cannot tell who is punishing whom. Sort each action to the authority that took it.",
question:"Drag each enforcement action onto the authority behind it.",
buckets:["OCR (HIPAA)","FTC","ICO (UK data protection)","Acquirer / payment brand","State Attorney General","FedRAMP PMO"],
items:[
{t:"Willful-neglect breach left uncorrected for a year; tiered penalties",b:0},
{t:"Deceptive privacy practices; consent order with 20 years of independent assessments",b:1},
{t:"Turnover-based fine for systematic processing violations against UK customers",b:2},
{t:"Card compromise; monthly fines plus higher transaction fees",b:3},
{t:"Late breach notifications for 500 state residents",b:4},
{t:"Vendor loses authorization to host federal agency workloads",b:5}],
expl:"OCR enforces HIPAA with penalty tiers; the FTC's weapon is the consent order with long monitoring; the ICO fines by turnover under UK GDPR; acquirers charge monthly card fines and fees; state AGs chase late resident notifications; the FedRAMP PMO can remove the authorization that federal work depends on. Focus on: each authority's remedy is shaped by its legal relationship — health law, consumer law, privacy law, card rules, state breach laws, federal cloud authorization.",
hint:"Health, consumer, UK privacy, cards, state residents, federal cloud — one remedy each."},
{id:"h4",th:"RPT",type:"match",title:"What does the assessor really check?",kw:["SOC 2 Type I / Type II","ISO/IEC 27001","ISO 27001 certification & surveillance audits","QSA","PCI SAQ / AOC / ROC","HIPAA","Due care vs due diligence","Point-in-time audit"],
scenario:"Vendor risk reviews at Northgate Mutual keep mistaking one assurance artefact for another. The third-party team wants the real meaning of each pinned down before the next due-diligence cycle.",
question:"Match each artefact to what the assessor actually verifies.",
left:["SOC 2 Type II report","ISO 27001 stage 2 certification audit","PCI ROC produced by a QSA","HIPAA risk analysis reviewed by OCR","SOC 2 Type I report"],
right:["Samples whether controls operated over a 3-12 month window","On-site check that controls actually work before the certificate is issued","Validates every PCI DSS requirement in scope at the merchant","Documented review of threats and safeguards for ePHI","Snapshot of control DESIGN at one point in time"],
sol:[0,1,2,3,4],
expl:"Type II samples operation over time; the ISO stage 2 visit verifies controls work before certifying; the QSA's ROC validates each DSS requirement in scope; the HIPAA risk analysis documents threats and safeguards for ePHI; and Type I is design at a snapshot — useful, but only a point in time. Choosing diligence artefacts by their real meaning is the essence of due diligence, not box-ticking. Focus on: time window and depth are what separate these documents.",
hint:"Two look at a period, one walks the site, one is a health-risk document, one is a single-day snapshot."},
{id:"h5",th:"CON",type:"order",title:"After the failed external audit",kw:["Corrective action plan (CAP)","External / regulator reporting","Attestation","Evidence collection","Increased audit frequency"],
scenario:"Quill & Coin failed an external regulatory audit: documentation gaps and two dead controls. The regulator's letter gives 30 days for the response plan. Build the sequence.",
question:"Order the steps from failed audit to closure.",
items:["Receive the findings report from the external audit","Contain the immediate risk (shut the worst gaps first)","Submit the corrective action plan to the regulator by the deadline","Execute fixes while collecting evidence of each one","Undergo the regulator's verification or re-audit","Report closure and attestation to customers and the board"],
expl:"Findings first, immediate risk contained before paperwork, then the CAP goes in on time — a regulator cares as much about deadlines as about fixes. Each fix needs collected evidence for the verification or re-audit, and closure is attested to customers and the board. Expect closer scrutiny afterward: failed audits typically bring increased audit frequency. Focus on: contain before you document, document before you attest.",
hint:"Contain the fire before writing the fire-safety plan; the plan has a deadline; closure needs proof."},
{id:"h6",th:"RPT",type:"multi",title:"Real exceptions or noise?",kw:["SOC 2","SOC 2 Type I / Type II","Exception register","Self-assessment","Internal compliance report","Automated evidence collection"],
scenario:"Vireo Cloud's SOC 2 Type II fieldwork is done. The auditor's draft lists six observations. Management must decide which three are reportable control exceptions (the rest are context notes) before the management letter becomes an internal compliance report.",
question:"Select the THREE findings that are reportable control EXCEPTIONS.",
opts:["2 of 25 leavers kept system access for days after termination","The monitoring platform was down 14 hours in March and queued alerts were missed","One sampled quarterly access review had no evidence at all","New-hire training completion landed at 97% against a 95% target","Penetration test findings were remediated inside the agreed window","The access policy was refreshed and re-approved on schedule"],
correct:[0,1,2],
expl:"An exception means the control did NOT work as designed in the sample: leavers with lingering access, missed alerts from downtime, and a review with no evidence are all failures. Meeting a training target, remediating findings in time, and re-approving policy on schedule are controls working — context, not exceptions. Mislabelling working controls as exceptions (or hiding real ones) corrupts the report and the self-assessment behind it. Focus on: an exception is a failure against the control's own design.",
hint:"Ask for each: did the control fail its own design, or did it perform as intended?"},
{id:"h7",th:"REG",type:"branch",title:"EU data on a US platform",kw:["GDPR","Jurisdiction & data ownership","DPA (data processing agreement)","Data subject rights (DSAR)","Data portability","Vendor / third-party monitoring"],
scenario:"Northgate Mutual (US insurer) signs with Vireo Cloud (US SaaS) to process claims of EU residents. A director insists GDPR is irrelevant because the servers sit in Texas.",
question:"Walk the legal path. One choice per decision.",
nodes:[
{txt:"Decision 1 — Does GDPR apply to this processing?",
opts:[
{t:"Yes — GDPR reaches processing of EU residents' data even from outside the EU when services are offered to them",ok:true,out:"Good — GDPR is extraterritorial; the server's postcode does not decide."},
{t:"No — Texas servers mean only US law applies",ok:false,out:"Poor — jurisdiction follows the people whose data is processed, not the datacenter."},
{t:"Only if we open an EU office first",ok:false,out:"Poor — offering services to people in the EU is enough; no office is needed."}]},
{txt:"Decision 2 — What must be in place BEFORE EU personal data lands in the US platform?",
opts:[
{t:"A data processing agreement plus a valid transfer mechanism such as SCCs",ok:true,out:"Good — processor duties plus a documented transfer mechanism are the baseline."},
{t:"Nothing more — the DPA alone also covers cross-border transfers",ok:false,out:"Poor — a DPA sets processor duties; transfers need their own mechanism."},
{t:"A verbal assurance from the vendor that data will stay safe",ok:false,out:"Poor — assurances are not lawful transfer mechanisms."}]},
{txt:"Decision 3 — An EU claimant sends an access + portability request. Vireo holds the data.",
opts:[
{t:"Northgate answers within one month, drawing on Vireo's contractual assistance duties",ok:true,out:"Good — the controller answers the data subject; the processor must assist under the DPA."},
{t:"Redirect the claimant to Vireo — the data physically lives there",ok:false,out:"Poor — the data subject deals with the controller; processors do not answer requests."},
{t:"Refuse — a US company cannot be reached by EU rights",ok:false,out:"Poor — GDPR applies by scope here; a refusal invites a complaint to the authority."}]}],
expl:"GDPR follows the people, not the servers, so a US platform processing EU residents' claims is in scope. Before data moves you need the DPA (processor duties) and a transfer mechanism such as SCCs — two different instruments. Rights requests are answered by the controller within a month, using the processor's assistance duties. Focus on: extraterritorial scope, then layered instruments, then who answers the data subject.",
hint:"Scope first (people, not servers), instruments second (DPA + transfer), answers last (controller)."},
{id:"h8",th:"CON",type:"fibtext",title:"Name the enforcement tools",kw:["Processing ban / suspension","Legal hold","Retention policy"],
scenario:"The GC briefs the compliance team on two instruments that froze operations at a peer company last quarter. She wants the exact terms in the minutes.",
question:"Type the term for each description.",
fields:[
{lab:"The GDPR enforcement measure that temporarily STOPS a processing activity until it is fixed",accept:["processing ban","ban","suspension","processing suspension"]},
{lab:"The mechanism that pauses scheduled destruction of records involved in litigation",accept:["legal hold","litigation hold","hold","legal preservation"]}],
expl:"A processing ban is the GDPR regulator's stop switch: the activity halts until the failure is fixed — costlier than most fines for a data-driven business. A legal hold suspends the retention schedule for records involved in litigation; destroying held records is its own offence. Focus on: one stops PROCESSING, the other stops DESTRUCTION — do not swap them.",
hint:"One comes from the regulator and stops an activity; the other comes from lawyers and stops the shredder."},
{id:"h9",th:"PRV",type:"order",title:"Rank the recoverability",kw:["Tokenization","Pseudonymization","Anonymization","Masking"],
scenario:"A researcher claims the four de-identification states below are 'basically the same'. The DPO wants them ranked from MOST reversible to LEAST reversible to shut the argument down.",
question:"Order the states from most reversible to least reversible.",
items:["Encryption — the value returns with the key","Tokenization — the vault maps the token back","Pseudonymization — the separate key table can re-link","Anonymization — nobody can re-identify by any means"],
expl:"Encryption is reversible with the key; tokenization is reversible through the vault; pseudonymization is reversible through the separate key table; anonymization is irreversible for everyone, which is exactly why GDPR stops applying to it. Masking sits apart — it hides a display but the stored value often remains. Focus on: reversibility determines whether the data is still personal data and how strong the controls must be.",
hint:"Follow the keys and maps: who can undo it, and what would it take?"},
{id:"h10",th:"RPT",type:"logview",multi:true,title:"SOC 2 exceptions vs our SLA",kw:["SOC 2 Type I / Type II","SLA","Vendor / third-party monitoring","Contract termination (BAA / DPA breach)","Continuous monitoring"],
scenario:"Northgate Mutual receives Vireo Cloud's SOC 2 Type II excerpt while preparing the quarterly vendor review. The contract SLA clauses are pasted beneath the report lines. Three of the five statements the account manager sent are wrong — find the two that are TRUE.",
question:"Select ALL statements that are TRUE.",
log:{title:"Vireo Cloud SOC 2 Type II excerpt + contract SLA clauses",lines:[
"REPORT — period 2026-01-01 to 2026-06-30 (SOC 2 Type II)",
"CC6.1 EXCEPTION: logical access reviews not performed for two consecutive quarters (no evidence)",
"CC7.2 EXCEPTION: monitoring platform unavailable 14 hours in March; queued alerts missed",
"CC6.7 no exceptions: data transmission encryption operating effectively",
"CC8.1 no exceptions: change management sampled, all tickets approved",
"CC9.1 no exceptions: backup encryption operating effectively",
"SLA 3.1 — platform availability 99.9% monthly",
"SLA 4.2 — quarterly access reviews with evidence to the customer",
"SLA 5.0 — monthly patching cadence with report",
"SLA 6.1 — annual penetration test shared with customers",
"SLA 7.0 — backups encrypted with customer-managed keys"]},
opts:["Clause 4.2 is breached — the access reviews did not happen for two quarters","Clause 3.1 is challenged — 14 hours of monitoring downtime undermines the availability promise","Clause 5.0 is breached — patching failed in both quarters","Clause 7.0 is breached — backups turned out to be unencrypted","Clause 6.1 is breached — the penetration test was never shared"],
correct:[0,1],
expl:"The CC6.1 exception (no access reviews for two quarters) directly breaches SLA 4.2, and the CC7.2 downtime cuts against the availability promise in 3.1. Patching and change management show no exceptions, backups are explicitly encrypted, and the report says nothing about the pen test — claiming a breach there would be inventing evidence. Repeated or unremediated breaches like these are exactly what lets a customer terminate under the contract. Focus on: match each report exception to the clause it actually touches; absence of evidence is not a breach.",
hint:"Two report lines carry EXCEPTION. Find the SLA clause each one touches — and notice what the report does NOT say."},
{id:"h11",th:"PRV",type:"qcm",title:"'Fully anonymous' research data",kw:["Pseudonymization","Anonymization","GDPR"],
scenario:"Aurora Analytics hands university researchers a dataset it calls fully anonymous. The data team quietly kept the code-to-name table in a restricted schema, and the codes are sequential by enrollment date.",
question:"What is the correct assessment?",
opts:["It is pseudonymized personal data — GDPR obligations remain","It is anonymized — no obligations attach at all","It is anonymous because the names are no longer in the released file","It is aggregate statistics — no data protection law applies"],
correct:0,
expl:"A surviving key table means re-identification is possible for whoever holds it — that is pseudonymization, and GDPR keeps applying. 'The names are gone from the file' describes pseudonymization too, not anonymity, and sequential codes leak enrollment order. Aggregate statistics would only be safe if no individual could be re-derived at all. Focus on: anonymity is judged by the risk of re-identification using ANY reasonably available means, not by what is missing from the file.",
hint:"Who still holds a way back to the identities? If anyone does, it is not anonymous."},
{id:"h12",th:"PRV",type:"clickfind",title:"Red-line the privacy notice",kw:["Privacy notice","Data minimization","Retention policy","COPPA","Opt-in / opt-out","CCPA","Consent & lawful basis"],
scenario:"Legal sends the new privacy notice for review before publication. Three clauses in the draft would breach policy or law as written. Click every clause that must be fixed.",
question:"Click every clause in the answer list that must be fixed before the notice is published.",
lines:["We collect only the data we need to run the service.","We may share your data with unlimited marketing partners.","We keep your data for as long as we like.","You may access, correct, or delete your data.","Children under 13 may use the service without verifiable parental consent.","California residents may opt out of the sale of their data.","We will notify affected people and the regulator when the law requires.","Your data is encrypted in transit and at rest."],
correct:[1,2,4],
expl:"Three clauses fail: unlimited sharing ignores purpose limitation and minimization; keeping data 'as long as we like' contradicts the retention schedule; and collecting from children under 13 without verifiable parental consent breaks COPPA outright. The rest are fine — including the CCPA opt-out line, which belongs there for California residents. Focus on: a privacy notice makes promises the law then holds you to; vague forever-language and child data are the classic red flags.",
hint:"One clause has no limits, one has no end date, one involves children."},
{id:"h13",th:"MON",type:"terminal",title:"Summarize the export activity",kw:["Automated evidence collection","PII","Evidence collection"],
scenario:"The export monitor's raw log is export_log.csv (860 rows, column order: time,user,records,dest). The manager wants a one-line answer: how many export EVENTS did each account make, largest first. No tool is prescribed — choose your own and produce the summary.",
question:"Construct a command that prints a per-user count of export events, ordered largest first, from export_log.csv.",
banner:["analyst@grc:~$ head -4 export_log.csv","time,user,records,dest","2026-10-06T02:19,j.dore,880,webmail","2026-10-06T02:21,j.dore,1205,usb","2026-10-06T02:24,k.osei,45,webmail","... (860 rows total)"],
acceptedAll:["(?:\\./)?export_log\\.csv","(?:sort\\s*\\|\\s*uniq\\s+-c|cnt\\[\\$2\\])","sort\\s+-rn|sort\\s+-r\\s+-n|sort\\s+-n\\s+-r|sort\\s+-nr","\\$2|-f\\s*2"],
sample:"awk -F, '{print $2}' export_log.csv | sort | uniq -c | sort -rn",
expl:"Extract the user field (awk or cut), count repeats (sort then uniq -c), and order the counts descending (sort -rn). This is the everyday evidence-collection pattern: reduce a log to the metric the reviewer needs. Note the header row will appear once in the count — reviewers accept that, or you filter it. Focus on: isolate the field, count, sort.",
hint:"You need the user column, a way to count repeated values, and a descending numeric sort."},
{id:"h14",th:"REG",type:"multi",title:"PCI scope-reduction truths",kw:["PCI DSS","Tokenization","Masking","Cardholder data (PAN)","PCI SAQ / AOC / ROC","Regulatory fines"],
scenario:"Quill & Coin wants to shrink its PCI DSS scope before next year's assessment. The architecture meeting generated six claims; three are true, three would get the company fined or misled.",
question:"Select the THREE true claims.",
opts:["Tokenization can take systems out of cardholder-data scope","The CVV must never be stored after authorization — no exception","Masking the PAN limits who can read full card numbers on screen","Encrypting data yourself always removes it from PCI scope","A SAQ is a tax form required under GDPR","PCI monthly fines are set by the data protection authority"],
correct:[0,1,2],
expl:"Tokenization vaults the PAN so surrounding systems stop touching cardholder data — real scope reduction. CVV storage after authorization is forbidden with no exception, and masking limits on-screen exposure. Encryption does NOT automatically de-scope you (if you can decrypt, you are still in scope); a SAQ is a self-assessment questionnaire, not a tax form; and card fines come from the payment brands and acquirers, not the data protection authority. Focus on: what actually reduces scope — removing access to readable card data, not renaming the risk.",
hint:"Two claims confuse regulators, one confuses the tax office. The true three all touch the card number itself."},
{id:"h15",th:"PRV",type:"branch",title:"The celebrity record",kw:["Notice of privacy events","PHI","Continuous monitoring","Reputational damage","Regulator escalation (OCR / FTC / ICO / state AG)"],
scenario:"Access-governance monitoring flags nurse t.mack: she opened the record of a celebrity patient admitted overnight. t.mack works on a different ward and has no treatment relationship with the patient.",
question:"Handle the incident. One choice per decision.",
nodes:[
{txt:"Decision 1 — Classify what the monitoring alert shows.",
opts:[
{t:"A confirmed privacy violation — access without a care relationship; open a case and preserve the access logs",ok:true,out:"Good — technical ability to open a record is not authorization; need-to-know is the rule."},
{t:"Probably a false positive — staff may browse any record their account can technically open",ok:false,out:"Poor — broad technical access is an architecture problem, not permission to browse."},
{t:"Ask her on the ward to explain, then close it if the chat sounds fine",ok:false,out:"Poor — informal chats leave no record, destroy evidence quality, and tip her off."}]},
{txt:"Decision 2 — The privacy office confirms a curiosity breach. First action?",
opts:[
{t:"Suspend her record-access rights pending the case, per policy",ok:true,out:"Good — contain first; the investigation proceeds while access is frozen."},
{t:"Wait for the annual attestation cycle to sort access out",ok:false,out:"Poor — the exposure continues for months; attestation is governance, not containment."},
{t:"Delete the access-log entry to protect her privacy",ok:false,out:"Poor — destroying evidence is its own compliance failure and hides a real breach."}]},
{txt:"Decision 3 — The case is confirmed. What is the correct follow-up?",
opts:[
{t:"Sanction per HR policy, tighten role-based access, and notify per law if required",ok:true,out:"Good — people, process and legal duties all addressed; the record proves it."},
{t:"A quiet word is enough for a first offence",ok:false,out:"Poor — policy requires a documented sanction; informality breeds repeat cases."},
{t:"Publish her name in the staff newsletter as a deterrent",ok:false,out:"Poor — disproportionate shaming creates new legal exposure for the organization."}]}],
expl:"Curiosity browsing is a real privacy violation even without exfiltration: the alert confirms access without need-to-know. Contain (freeze access), preserve evidence, then the formal path — HR sanction, role-based access fixes, and regulator or patient notification duties where the law requires. Deleting logs or shaming the individual creates new failures on top of the first. Focus on: contain, document, then consequences — in that order.",
hint:"Access without need-to-know IS the violation. Contain, then evidence, then consequences."},
{id:"h16",th:"RPT",type:"dnd",title:"Grade the findings",kw:["PCI DSS","Cardholder data (PAN)","SOX","GLBA","NIST CSF","Internal vs external audit","Corrective action plan (CAP)","HIPAA"],
scenario:"Quill & Coin's internal audit produced six findings with the severities stripped (the team disagreed). The audit committee wants them graded before the external auditor arrives.",
question:"Drag each finding into the correct severity bucket.",
buckets:["Critical","Major","Minor","Observation"],
items:[
{t:"CVV found stored in the payments database",b:0},
{t:"SOX ITGC quarterly access review skipped for two quarters",b:1},
{t:"GLBA safeguards evidence missing for two critical vendors",b:1},
{t:"Training completion at 91% against a 95% target",b:2},
{t:"DRP contact list is one year stale",b:2},
{t:"The annual report lacks the NIST CSF control mapping",b:3}],
expl:"Stored CVV is a forbidden practice touching regulated card data — critical. Skipped SOX ITGC reviews and missing GLBA safeguards evidence are major: regulated duties failed, but nothing is wide open. Missed targets and a stale contact list are minor with obvious fixes. The missing CSF mapping is advice — it improves reporting but breaks nothing. Focus on: grade by regulatory exposure and immediacy, then by how fast the fix lands.",
hint:"Forbidden data practice first; failed regulated duties next; missed targets after; reporting advice last."},
{id:"h17",th:"PRV",type:"logview",multi:true,title:"Purge job vs legal hold",kw:["Retention policy","Legal hold","Media sanitization","Information life cycle","Exception register"],
scenario:"Northgate Mutual's nightly records job ran last Tuesday and the governance report is below. Two of the six statements made in the morning stand-up are true — the rest are wrong. Find the true ones.",
question:"Select ALL statements that are TRUE.",
log:{title:"Records governance — nightly job report 2026-10-02",lines:[
"2026-10-02 WARN  job PURGE: tax records 2019 for account 88-2214 destroyed — account under legal hold since 2026-09-15",
"2026-10-02 OK    job PURGE: CCTV segments older than 30 days overwritten per schedule",
"2026-10-02 WARN  job DELETE: audit trail entries for file-share-9 removed at 60 days — policy retention is 12 months",
"2026-10-02 OK    job ARCHIVE: HR files of leavers moved to cold storage per schedule",
"2026-10-02 INFO  job HOLD: destruction of contract set C-77 suspended — legal hold active",
"2026-10-02 INFO  exceptions: none filed for the two WARN lines"]},
opts:["The purge of account 88-2214 violated the legal hold","The audit trail deletion breached the 12-month retention requirement","The CCTV overwrite violated the schedule","The HR archive action breached data minimization","Legal holds expire automatically after 30 days","The hold on contract set C-77 was correctly respected"],
correct:[0,1,5],
expl:"Three statements are true: destroying records under an active legal hold is a violation; deleting audit trails at 60 days against a 12-month policy is a breach of retention; and contract set C-77 was correctly spared. The CCTV overwrite matched its schedule, archiving HR files to cold storage is the life cycle working as designed, and legal holds last as long as the litigation does — there is no automatic 30-day expiry. Two WARN lines with no exceptions filed is exactly how findings repeat. Focus on: the hold freezes destruction; the schedule defines deletion; both must be respected.",
hint:"Two jobs went wrong, one hold worked. Check each statement against the actual job lines."},
{id:"h18",th:"RPT",type:"qcm",title:"The ASV scan that blocks the AOC",kw:["ASV scan","PCI SAQ / AOC / ROC","QSA","Attestation","Audit readiness"],
scenario:"Quill & Coin's Q3 external ASV scan failed on one internet-facing host (critical severity). A re-scan passed in Q4. The QSA is now preparing the compliance attestation for the year.",
question:"What is true about the attestation?",
opts:["A passing re-scan next quarter erases the failing quarter","ASV scans become optional once the self-assessment is signed","Only the annual scan result matters for the attestation","The failed quarter must be re-scanned to a pass before attesting"],
correct:3,
expl:"PCI requires quarterly ASV scans, and a passing result is needed FOR each quarter of the attestation period — a failed quarter must be remediated and re-scanned to a pass for that same quarter. Next-quarter passes do not rewrite history, scanning is not optional for self-assessed merchants, and the cadence is quarterly, not annual. Focus on: the attestation covers a period; every quarter in it must carry a passing scan.",
hint:"The attestation covers a whole year in four quarters — what does each quarter need to show?"},
{id:"h19",th:"PRV",type:"fib",title:"Four clauses, four exact terms",kw:["Masking","Tokenization","Pseudonymization","Data minimization"],
scenario:"The vendor contract's data appendix uses near-synonyms interchangeably and legal knows it matters. Fill the four clauses with the exact technique each one describes.",
question:"Fill each blank from the word bank — every word is a different technique.",
html:"Show only the last four digits on screen: {{0}}. Swap the card number for a vaulted surrogate value: {{1}}. Replace names with codes while a key table survives elsewhere: {{2}}. Collect only the fields the purpose needs: {{3}}.",
blanks:["masking","tokenization","pseudonymization","minimization"],
bank:["masking","tokenization","pseudonymization","minimization","anonymization","encryption","aggregation"],
expl:"Masking hides a display value; tokenization replaces the stored value with a vaulted token; pseudonymization codes identifiers while a key still exists somewhere; minimization never collects the field at all. The distractors fail precisely: anonymization has no key anywhere, encryption protects with a cipher, and aggregation merges records into statistics. Focus on: the presence or absence of a key or vault is what separates these terms.",
hint:"Display, vault, key table, never-collected — each blank points at a different mechanism."},
{id:"h20",th:"CON",type:"multi",title:"Consequences without a breach",kw:["Consent order","Increased audit frequency","Loss of certification or license","Lawsuit / class action","Regulatory fines","Reputational damage"],
scenario:"A director claims 'no breach, no consequences' while blocking budget for the audit fix. The GC asks you to build the counter-example list for the board pack.",
question:"Select the consequences that CAN hit the company with NO data breach at all.",
opts:["A consent order for missing documentation","Increased audit frequency after a poor assessment","Loss of certification after failed surveillance","A customer class action tied to a violated duty, breach or not","Fines can only ever follow stolen data","Certification bodies cannot suspend certificates","Regulators may not act until an incident occurs"],
correct:[0,1,2,3],
expl:"Non-compliance alone carries consequences: consent orders for documentation failures, more frequent audits after weak assessments, suspended or lost certifications after failed surveillance, and class actions built on violated duties rather than stolen data. The last three claims are the director's fantasy — fines, suspensions and regulator action all exist without any breach. Focus on: compliance obligations bite on their own; a breach is only one trigger among many.",
hint:"Four of the seven really happened to breach-free companies. The other three are folklore."},
{id:"h21",th:"PRV",type:"dnd",title:"Contract routing, round two",kw:["BAA","DPA (data processing agreement)","FERPA","NDA","SLA","MOU","PHI"],
scenario:"Six fresh engagements wait for contract routing at Northgate Mutual. One involves student records; two involve regulated data; the rest are about promises and paperwork. Route each.",
question:"Drag each engagement onto the agreement it requires.",
buckets:["BAA","DPA (data processing agreement)","NDA","SLA","MOU","MSA"],
items:[
{t:"A hospice hires a transcription vendor for patient dictations",b:0},
{t:"A university's cloud LMS processes student records on instruction (FERPA school-official role)",b:1},
{t:"Red teamers get production access next month",b:2},
{t:"Managed hosting promises 99.95% uptime with service credits",b:3},
{t:"Two cities agree on a joint flood-response drill",b:4},
{t:"Master terms for a three-year consultancy, orders placed per statement of work",b:5}],
expl:"Patient dictations need a BAA. A university LMS processing student records on instruction needs a DPA — and the FERPA school-official exception shapes its terms. Red teamers sign an NDA before production access. Uptime with credits is the SLA's job. A non-binding joint drill is an MOU. The consultancy framework with order forms is an MSA. Focus on: regulated data dictates BAA/DPA; promises live in SLA; intentions in MOU; frameworks in MSA.",
hint:"Health data, processor duties, secrets, uptime, goodwill, framework — six engagements, six folders."},
{id:"h22",th:"PRV",type:"logview",title:"DSAR deadlines under pressure",kw:["Data subject rights (DSAR)","Data portability","Right to erasure","GDPR"],
scenario:"The privacy desk extracts the DSAR register before the weekly review. Four requests, all identity-verified. One statement about the register is correct — the desk lead has bet coffee on it.",
question:"Which statement about the register is correct?",
log:{title:"Privacy desk — DSAR register extract 2026-09-29 (one-month clock)",lines:[
"2026-09-29 WARN  DSAR-114 received 2026-08-25 — access — due 2026-09-24 — status OVERDUE 5 days",
"2026-09-29 OK    DSAR-115 received 2026-09-02 — erasure — due 2026-10-02 — status IN PROGRESS",
"2026-09-29 OK    DSAR-116 received 2026-09-05 — portability — due 2026-10-05 — status COMPLEX — EXTENSION FILED (+2 months, requester informed)",
"2026-09-29 OK    DSAR-117 received 2026-09-18 — access — due 2026-10-18 — status IN PROGRESS",
"2026-09-29 INFO  desk note: identity checks complete on all four requests"]},
opts:["All four requests are on time, within their one-month clocks","DSAR-114 is overdue; DSAR-116's extension was filed and notified","DSAR-116 breached the clock because extensions are never allowed","DSAR-114 must now be answered within 72 hours, like a breach"],
correct:[1],
expl:"DSAR-114 passed its due date five days ago — overdue. DSAR-116 is compliant: GDPR allows a further two months for complex requests, but only if the requester is told within the first month, which the log records. Extensions are allowed, and 72 hours is the breach clock, not the rights clock. Focus on: one month, plus a notified two-month extension for complexity — and erasure and portability run on the same clock.",
hint:"Check the due dates against the received dates, and read the extension note carefully."},
{id:"h23",th:"MON",type:"clickfind",title:"Catch the control drift",kw:["Control drift","Retention policy","Masking","Exception register","Continuous monitoring"],
scenario:"Continuous monitoring compares the payments DB configuration against the approved baseline. The diff below reached the compliance channel. Three lines drifted from the baseline (the rest are baseline-conformant). Click every drifted line.",
question:"Click every line in the answer list that drifted from the approved baseline.",
lines:["log_retention_days = 365","log_retention_days = 30","audit_alerting = enabled","audit_alerting = disabled","db_encryption_at_rest = on","pii_masking = on","pii_masking = off (support tool)","backup_schedule = daily","access_review_cycle = quarterly"],
correct:[1,3,6],
expl:"Three lines contradict the baseline: 30-day log retention cuts the required year (retention drift), disabled audit alerting blinds the monitoring control, and turning off PII masking for a support tool is an unrecorded exception waiting to leak. Drift like this is how compliant systems rot quietly — either restore the baseline or file the exception and get it approved. Focus on: drift detection only helps if someone closes the gap.",
hint:"Policy wants a year of logs, live alerts, and masked PII. Which lines say otherwise?"},
{id:"h24",th:"MON",type:"dual",title:"One leak, two perspectives",kw:["Continuous monitoring","PII","Notice of privacy events","Automated evidence collection"],
scenario:"Developer c.hale was refused a new data tool in the ticket queue. Two weeks later, monitoring shows 40,000 customer rows copied into a spreadsheet and mailed to a personal webmail address. Current controls: USB blocked by DLP; webmail attachments under 25MB allowed; export rights broadly granted to the data team.",
question:"Answer the same incident from both sides of the house.",
parts:[
{q:"BLUE TEAM — Which control gap failed FIRST and let the copy happen?",opts:["The firewall missed a slow port scan that same night","Password expiry for staff was set far too long","The wide data-exit path plus broad export rights let the copy happen","Antivirus signatures on laptops were a week out of date"],correct:2},
{q:"RED TEAM — As the insider, which next step would most likely EVADE the current DLP?",opts:["Repeat the exact same 40,000-row email next week","Split the data into small encrypted archives sent over weeks","Print the office badge access logs for the month","Ask the CEO by email for written approval first"],correct:1}],
expl:"Blue team: the first failure is architectural — DLP allowed a large PII set out via webmail while export rights were broad; containment is closing the exit path and narrowing rights, then the privacy-event assessment follows. Red team: the current tuning catches big obvious attachments, so an insider evades it by chunking the data into small encrypted pieces over time — which is why volume anomalies and behavioral baselines matter more than single-rule blocks. Focus on: controls are pairs — detection AND restriction; each side sees the other half of the failure.",
hint:"Blue: what made the copy POSSIBLE? Red: what does the current rule actually check?"},
{id:"h25",th:"CON",type:"order",title:"Remediation, ranked by risk",kw:["Cardholder data (PAN)","Media sanitization","Control drift","ASV scan","PCI SAQ / AOC / ROC","Exception register","Compliance dashboard","Evidence collection"],
scenario:"Quill & Coin's failed assessment left five remediation items and one very nervous acquirer. The board wants them executed in true risk order — not the order the tickets arrived.",
question:"Order the remediation steps by risk priority (do first = top).",
items:["Stop the CVV storage and sanitize the affected tables","Fix the logging and retention configuration drift","Re-run the external scan and refresh the attestation","Review the exception register and refresh the evidence set","Report status to the acquirer and the board dashboard"],
expl:"The forbidden CVV storage is the live regulatory exposure — stop it and sanitize the media properly. Configuration drift (logging, retention) comes next because blind systems hide the next incident. Then prove the fix: re-run the external scan and refresh the attestation, sweep the exception register and refresh evidence, and finally report status to the acquirer and the board. Focus on: exposure first, visibility second, proof third, communication last — but never skipped.",
hint:"Forbidden storage, then blind logging, then the proof loop, then the people who must hear it."},
{id:"h26",th:"REG",type:"fibtext",title:"Two terms the board asked for",kw:["FedRAMP / FISMA","Data controller / processor"],
scenario:"After the Vireo signing debate, two directors asked for precise terms. The company secretary wants them typed, correctly, in the minutes.",
question:"Type the answers.",
fields:[

/* ================= EXAM ENGINE (framework — driven by data above) ================= */
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;return e;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(n){var r=Math.round(n*100)/100;return Math.abs(r-Math.round(r))<0.005?String(Math.round(r)):r.toFixed(2);}
function norm(s){return String(s==null?"":s).toLowerCase().replace(/\s+/g," ").trim().replace(/[.]+$/,"");}
var S=null,CLOCK=null;
function newState(){return{phase:"intro",order:shuffle(EXERCISES.map(function(_,i){return i;})),idx:0,ans:{},view:{},checked:{},skipped:{},hints:{},hintShown:{},earned:{},revised:{},manual:false,checkPause:false,timeLeft:EXERCISES.length*CFG.secsPerEx,reported:false,reason:"",tot:null,user:"",modal:false,warn:""};}
function mmss(x){var m=Math.floor(x/60),s=x%60;return(m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function timerFrozen(){return !!(S&&(S.manual||S.checkPause));}
function startClock(){if(CLOCK)clearInterval(CLOCK);CLOCK=setInterval(function(){if(!S||S.phase!=="exam"||S.manual||S.checkPause)return;S.timeLeft--;if(S.timeLeft<=0){S.timeLeft=0;finish("timeout");return;}paintTimer();},1000);}
function paintTimer(){var e=document.getElementById("clock");if(!e||!S)return;e.textContent=mmss(S.timeLeft);var tot=EXERCISES.length*CFG.secsPerEx;e.className="clock"+(S.timeLeft<=tot*0.1?" crit":S.timeLeft<=tot*0.2?" low":"")+(timerFrozen()?" frozen":"");}
function curEx(){return EXERCISES[S.order[S.idx]];}
function themeOf(ex){for(var i=0;i<THEMES.length;i++){if(THEMES[i].id===ex.th)return THEMES[i];}return THEMES[0];}
function ensureState(ex){
 if(!S.view[ex.id]){
  var v={};
  if(ex.type==="qcm"){v.order=shuffle(ex.opts.map(function(_,i){return i;}));}
  if(ex.type==="multi"){v.order=shuffle(ex.opts.map(function(_,i){return i;}));}
  if(ex.type==="logview"){v.order=shuffle(ex.opts.map(function(_,i){return i;}));}
  if(ex.type==="dnd"){v.items=shuffle(ex.items.map(function(_,i){return i;}));}
  if(ex.type==="match"){v.rights=shuffle(ex.right.map(function(_,i){return i;}));}
  if(ex.type==="order"){v.ord=shuffle(ex.items.map(function(_,i){return i;}));}
  if(ex.type==="fib"){v.bank=shuffle(ex.bank.map(function(_,i){return i;}));}
  if(ex.type==="dual"){v.o1=shuffle(ex.parts[0].opts.map(function(_,i){return i;}));v.o2=shuffle(ex.parts[1].opts.map(function(_,i){return i;}));}
  S.view[ex.id]=v;
 }
 if(!S.ans[ex.id]){
  var a={};
  switch(ex.type){
   case"qcm":a.sel=-1;break;
   case"multi":a.sel={};break;
   case"logview":a.sel=ex.multi?{}:-1;break;
   case"dnd":a.place={};a.selItem=-1;break;
   case"match":a.sel=ex.left.map(function(){return -1;});break;
   case"order":a.ord=0;break;
   case"fib":a.fill=ex.blanks.map(function(){return null;});break;
   case"fibtext":a.vals=ex.fields.map(function(){return "";});break;
   case"terminal":a.lines=[];break;
   case"clickfind":a.pick={};break;
   case"branch":a.node=0;a.picks=[];break;
   case"dual":a.sel=[-1,-1];break;
  }
  S.ans[ex.id]=a;
 }
}
function markLog(l){var s=esc(l);
 s=s.replace(/\b(ERROR|ERR|FAIL|FAILED|DENIED|CRITICAL|BLOCKED)\b/g,'<span class="lvl-err">$1</span>');
 s=s.replace(/\b(WARN|WARNING|OVERDUE|EXCEPTION|LATE|RETRY|MISSING|VIOLATION)\b/g,'<span class="lvl-warn">$1</span>');
 s=s.replace(/\b(OK|PASS|PASSED|SUCCESS|GRANTED|REVIEWED|RESOLVED|COMPLETE)\b/g,'<span class="lvl-ok">$1</span>');
 s=s.replace(/^(\d{2}:\d{2}(:\d{2})?)/,'<span class="ts">$1</span>').replace(/^(\d{4}-\d{2}-\d{2})/,'<span class="ts">$1</span>');
 return s;}
/* ---------- grading ---------- */
function gradeMulti(ex,a){var parts=[],ok=0;var corr=ex.correct;
 ex.opts.forEach(function(t,i){
  var isC=corr.indexOf(i)>=0,picked=!!a.sel[i];
  if(picked&&isC){ok++;parts.push({lab:t,st:"ok"});}
  else if(picked&&!isC){parts.push({lab:t,st:"bad"});}
  else if(!picked&&isC){parts.push({lab:t,st:"miss"});}
 });
 return{frac:corr.length?ok/corr.length:0,parts:parts};}
function grade(ex){var a=S.ans[ex.id],v=S.view[ex.id],parts=[],ok=0,n=1,i,r;
 switch(ex.type){
 case"qcm":n=1;r=a.sel===ex.correct;parts.push({lab:r?"Your choice was correct.":"Your choice was wrong.",st:r?"ok":"bad"});if(r)ok=1;return{frac:ok/n,parts:parts};
 case"multi":r=gradeMulti(ex,a);return{frac:r.frac,parts:r.parts};
 case"logview":
  if(ex.multi){r=gradeMulti({opts:ex.opts,correct:ex.correct},a);return{frac:r.frac,parts:r.parts};}
  n=1;r=a.sel===ex.correct[0];parts.push({lab:r?"Your choice was correct.":"Your choice was wrong.",st:r?"ok":"bad"});if(r)ok=1;return{frac:ok/n,parts:parts};
 case"dnd":n=ex.items.length;
  ex.items.forEach(function(it,i2){var p=a.place[i2],has=(p!==undefined&&p!==null&&p>=0);
   if(p===it.b){ok++;parts.push({lab:it.t+" → "+ex.buckets[it.b],st:"ok"});}
   else if(has){parts.push({lab:it.t+" → "+ex.buckets[p],st:"bad"});}
   else{parts.push({lab:it.t+" (not placed)",st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"match":n=ex.left.length;
  ex.left.forEach(function(l,i2){var s=a.sel[i2];
   if(s===ex.sol[i2]){ok++;parts.push({lab:l+" → "+ex.right[s],st:"ok"});}
   else if(s<0){parts.push({lab:l+" (no match chosen)",st:"miss"});}
   else{parts.push({lab:l+" → "+ex.right[s],st:"bad"});}});
  return{frac:ok/n,parts:parts};
 case"order":n=ex.items.length;
  for(i=0;i<n;i++){if(v.ord[i]===i){ok++;parts.push({lab:"Position "+(i+1)+": "+ex.items[i],st:"ok"});}else{parts.push({lab:"Position "+(i+1)+": you placed "+ex.items[v.ord[i]],st:"bad"});}}
  return{frac:ok/n,parts:parts};
 case"fib":n=ex.blanks.length;
  ex.blanks.forEach(function(w,i2){var f=a.fill[i2];
   if(f===w){ok++;parts.push({lab:"Blank "+(i2+1)+": "+w,st:"ok"});}
   else if(f){parts.push({lab:"Blank "+(i2+1)+": you wrote "+f,st:"bad"});}
   else{parts.push({lab:"Blank "+(i2+1)+" (empty)",st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"fibtext":n=ex.fields.length;
  ex.fields.forEach(function(f,i2){var val=norm(a.vals[i2]),good=f.accept.some(function(x){return norm(x)===val;});
   if(val&&good){ok++;parts.push({lab:f.lab+": "+a.vals[i2],st:"ok"});}
   else if(val){parts.push({lab:f.lab+": "+a.vals[i2],st:"bad"});}
   else{parts.push({lab:f.lab+" (empty)",st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"terminal":n=1;var last=(a.lines&&a.lines.length)?a.lines[a.lines.length-1]:"";var good=false;
  if(ex.acceptedAll){good=ex.acceptedAll.every(function(rx){return new RegExp(rx,"i").test(last);});}
  else{good=(ex.acceptedAny||[]).some(function(rx){return new RegExp(rx,"i").test(last);});}
  parts.push({lab:good?"Command accepted.":"Command not correct: "+(last||"(nothing typed)"),st:good?"ok":"bad"});if(good)ok=1;return{frac:ok/n,parts:parts};
 case"clickfind":n=ex.correct.length;
  ex.lines.forEach(function(l,i2){var isC=ex.correct.indexOf(i2)>=0,picked=!!a.pick[i2];
   if(isC&&picked){ok++;parts.push({lab:l,st:"ok"});}
   else if(!isC&&picked){parts.push({lab:l,st:"bad"});}
   else if(isC&&!picked){parts.push({lab:l,st:"miss"});}});
  return{frac:ok/n,parts:parts};
 case"branch":n=ex.nodes.length;
  ex.nodes.forEach(function(nd,i2){var p=a.picks[i2];
   if(p===undefined||p===null){parts.push({lab:"Decision "+(i2+1)+" (not made)",st:"miss"});}
   else if(nd.opts[p].ok){ok++;parts.push({lab:"Decision "+(i2+1)+": "+nd.opts[p].t,st:"ok"});}
   else{parts.push({lab:"Decision "+(i2+1)+": "+nd.opts[p].t,st:"bad"});}});
  return{frac:ok/n,parts:parts};
 case"dual":n=2;
  ex.parts.forEach(function(p,i2){var s=a.sel[i2];
   if(s===p.correct){ok++;parts.push({lab:"Part "+(i2+1)+" correct.",st:"ok"});}
   else if(s<0){parts.push({lab:"Part "+(i2+1)+" (not answered)",st:"miss"});}
   else{parts.push({lab:"Part "+(i2+1)+" wrong: "+p.opts[s],st:"bad"});}});
  return{frac:ok/n,parts:parts};
 }
 return{frac:0,parts:[]};}

 w.appendChild(ins);

function buildFeedback(ex){var g=grade(ex);var d=h("div","fb");
 var en=S.earned[ex.id]||0;var pen=S.hints[ex.id]?0.1*S.hints[ex.id]:0;
 var el=h("div","earnline");
 el.innerHTML='Earned: <span class="'+(en>0.99?"ok-t":en>0?"warn-t":"bad-t")+'">'+fmt(en)+' / 1 pt</span>'+(pen>0?' <span class="dim">(includes hint penalty of -'+fmt(pen)+')</span>':"");
 d.appendChild(el);
 g.parts.forEach(function(p){
  var tag=p.st==="ok"?'<span class="tag ok-t">✓ CORRECT</span>':p.st==="bad"?'<span class="tag bad-t">✕ WRONG</span>':'<span class="tag warn-t">○ MISSED</span>';
  var it=h("div","fbitem");it.innerHTML=tag+'<span>'+esc(p.lab)+'</span>';d.appendChild(it);});

/* ---------- actions ---------- */
function doCheck(){var ex=curEx();if(ex.type==="branch"&&S.ans[ex.id].picks.length<ex.nodes.length)return;
 var g=grade(ex);var pen=0.1*(S.hints[ex.id]||0);
 S.earned[ex.id]=Math.max(0,Math.round((g.frac-pen)*100)/100);
 S.checked[ex.id]=true;S.skipped[ex.id]=false;S.revised[ex.id]=false;S.checkPause=true;S.warn="";
 render();}
function doSkip(){var id=curEx().id;if(!S.checked[id])S.skipped[id]=true;go(1);}
function focusTitle(){var t=document.querySelector("#excard .ttl");if(t){t.setAttribute("tabindex","-1");try{t.focus();}catch(e){}}}
function go(d){S.idx=Math.max(0,Math.min(EXERCISES.length-1,S.idx+d));S.checkPause=false;S.warn="";window.scrollTo(0,0);render();focusTitle();}
function navTo(i){S.idx=i;S.checkPause=false;S.warn="";window.scrollTo(0,0);render();focusTitle();}
function renderCard(){render();}
function askSubmit(){var answered=Object.keys(S.checked).length;
 if(answered===0){S.warn="Answer at least one exercise before submitting — press Check on an exercise to record your answer.";render();return;}
 S.modal=true;S.warn="";render();}
function confirmSubmit(){S.modal=false;finish("submit");}
function cancelSubmit(){S.modal=false;render();}
function finish(reason){if(!S||S.phase!=="exam")return;S.reason=reason;
 var ids=S.order.filter(function(i){return S.checked[EXERCISES[i].id];});
 var earned=0;ids.forEach(function(i){earned+=(S.earned[EXERCISES[i].id]||0);});
 earned=Math.round(earned*100)/100;
 var possible=ids.length,scoreR=Math.round(earned);
 var percent=possible?Math.round(scoreR/possible*100):0;
 S.tot={answered:ids,earned:earned,possible:possible,scoreR:scoreR,percent:percent,passed:percent>=CFG.passMark};
 S.phase="results";S.manual=false;S.checkPause=false;S.modal=false;
 if(CLOCK)clearInterval(CLOCK);
 reportScore();render();}
function reportScore(){if(!S||S.reported||!S.tot)return;S.reported=true;var t=S.tot;
 try{parent.postMessage({type:"CYBERPULSE_SCORE",topicId:CFG.topicId,score:t.scoreR,total:t.possible,percent:t.percent,passed:t.percent>=CFG.passMark},location.origin);}catch(e){}}
/* ---------- results ---------- */
function statusOf(exId){if(S.checked[exId]){var e=S.earned[exId]||0;return e>0.99?{cls:"ok",word:"FULL"}:e>0?{cls:"warn",word:"PARTIAL"}:{cls:"bad",word:"ZERO"};}return{cls:"warn",word:"SKIPPED"};}
function yourAnswer(ex){if(!S.ans[ex.id])return["(not answered — excluded from scoring)"];var a=S.ans[ex.id],v=S.view[ex.id],out=[];
 switch(ex.type){
 case"qcm":out.push(a.sel>=0?ex.opts[a.sel]:"(no choice)");break;
 case"logview":if(ex.multi){out.push(Object.keys(a.sel).length?Object.keys(a.sel).map(function(k){return ex.opts[k];}).join(" | "):"(none selected)");}else{out.push(a.sel>=0?ex.opts[a.sel]:"(no choice)");}break;
 case"multi":out.push(Object.keys(a.sel).length?Object.keys(a.sel).map(function(k){return ex.opts[k];}).join(" | "):"(none selected)");break;
 case"dnd":ex.items.forEach(function(it,i){out.push(it.t+" → "+(a.place[i]>=0?ex.buckets[a.place[i]]:"(not placed)"));});break;
 case"match":ex.left.forEach(function(l,i){out.push(l+" → "+(a.sel[i]>=0?ex.right[a.sel[i]]:"(no match)"));});break;
 case"order":v.ord.forEach(function(ii,p){out.push((p+1)+". "+ex.items[ii]);});break;
 case"fib":a.fill.forEach(function(f,i){out.push("Blank "+(i+1)+": "+(f||"(empty)"));});break;
 case"fibtext":ex.fields.forEach(function(f,i){out.push(f.lab+": "+(a.vals[i]||"(empty)"));});break;
 case"terminal":out.push(a.lines.length?a.lines[a.lines.length-1]:"(nothing typed)");break;
 case"clickfind":var pk=Object.keys(a.pick).map(function(k){return parseInt(k,10);});out.push(pk.length?pk.map(function(i){return "line "+(i+1);}).join(", "):"(none clicked)");break;
 case"branch":a.picks.forEach(function(p,i){out.push("Decision "+(i+1)+": "+ex.nodes[i].opts[p].t);});break;
 case"dual":ex.parts.forEach(function(p,i){out.push("Part "+(i+1)+": "+(a.sel[i]>=0?p.opts[a.sel[i]]:"(none)"));});break;
 }
 return out;}
function answerKey(ex){var out=[];
 switch(ex.type){
 case"qcm":out.push(ex.opts[ex.correct]);break;
 case"logview":(ex.multi?ex.correct:[ex.correct[0]]).forEach(function(i){out.push(ex.opts[i]);});break;
 case"multi":ex.correct.forEach(function(i){out.push(ex.opts[i]);});break;
 case"dnd":ex.items.forEach(function(it){out.push(it.t+" → "+ex.buckets[it.b]);});break;
 case"match":ex.left.forEach(function(l,i){out.push(l+" → "+ex.right[ex.sol[i]]);});break;
 case"order":ex.items.forEach(function(it,i){out.push((i+1)+". "+it);});break;
 case"fib":ex.blanks.forEach(function(w,i){out.push("Blank "+(i+1)+": "+w);});break;
 case"fibtext":ex.fields.forEach(function(f){out.push(f.lab+": "+f.accept.join(" / "));});break;
 case"terminal":out.push("Example of an accepted command: "+ex.sample);break;
 case"clickfind":ex.correct.forEach(function(i){out.push("line "+(i+1)+": "+ex.lines[i]);});break;
 case"branch":ex.nodes.forEach(function(n,i){var ok=n.opts.filter(function(o){return o.ok;})[0];out.push("Decision "+(i+1)+": "+ok.t);});break;
 case"dual":ex.parts.forEach(function(p,i){out.push("Part "+(i+1)+": "+p.opts[p.correct]);});break;
 }
 return out;}
function renderResults(){var t=S.tot;var w=h("div");
 w.innerHTML='<div class="topbar"><div class="t">CompTIA Security+ (SY0-701) · 5.4 Security compliance · '+sevBadge()+'</div><div class="r"><span class="chip">'+(S.reason==="timeout"?"Time is up — exam auto-submitted":"Exam submitted")+'</span></div></div>'
 +'<div class="bigscore"><div class="pct">'+t.percent+'%</div><div class="statline">Score: '+t.scoreR+' of '+t.possible+' answered exercises (points are partial-aware: '+fmt(t.earned)+' raw points, rounded for the pass mark)</div></div>';
 if(t.passed){w.appendChild(h("div","cert",'<div class="t1">✓ PASSED</div><p>You reached the '+CFG.passMark+'% pass mark on Chapter 5.4 — Security compliance ('+CFG.sevLabel+').</p><p class="dim">Credit recorded for: <b>'+esc(S.user||"Candidate")+'</b></p>'));}
 else{w.appendChild(h("div","failyou",'<div class="t1">✕ NOT PASSED</div><p>You scored '+t.percent+'%. The pass mark is '+CFG.passMark+'%. You must retake this exam.</p><p class="dim">Read the report below, focus on the themes with the lowest scores, then press Retake Exam.</p>'));}
 var sk=EXERCISES.map(function(e,i){return{i:i,e:e};}).filter(function(p){return !S.checked[p.e.id];});
 if(sk.length){var sp=h("div","panel");sp.innerHTML='<h2>Skipped / not answered — excluded from scoring</h2><p class="dim">These '+sk.length+' exercise(s) were skipped or never checked. They are NOT counted in your score or in the maximum.</p>'+sk.map(function(p){return '<span class="chip warn">Ex '+(S.order.indexOf(p.i)+1)+': '+esc(p.e.title)+'</span>';}).join("");w.appendChild(sp);}
 var themes=THEMES.map(function(t){var exs=EXERCISES.map(function(e,i){return{e:e,i:i};}).filter(function(p){return p.e.th===t.id&&S.checked[p.e.id];});
  var mx=exs.length,er=exs.reduce(function(s,p){return s+(S.earned[p.e.id]||0);},0);return{n:t.name,r:mx?er/mx:1};}).sort(function(a,b){return a.r-b.r;});
 if(!t.passed){var rev=h("div","panel");rev.innerHTML='<h2>What to review first</h2>'+themes.slice(0,3).map(function(t2){return '<p><b>'+esc(t2.n)+'</b> — '+Math.round(t2.r*100)+'% of available points earned here.</p>';}).join("");w.appendChild(rev);}
 var rep=h("div","panel");rep.innerHTML='<h2>Per-exercise report</h2>';
 S.order.forEach(function(ei,pos){var e=EXERCISES[ei];var st2=statusOf(e.id);
  var det=h("details","repitem");
  det.innerHTML='<summary><span class="chip '+st2.cls+'">'+st2.word+'</span> Ex '+(pos+1)+' — '+esc(e.title)+' <span class="dim">'+(S.checked[e.id]?(fmt(S.earned[e.id]||0)+" / 1 pt"):"not counted")+'</span></summary>'
  +'<div class="body"><div class="kv"><span class="k">Your answer:</span>'+(yourAnswer(e).map(esc).join("<br>")||"—")+'</div>'
  +'<div class="kv"><span class="k">Correct:</span>'+answerKey(e).map(esc).join("<br>")+'</div>'
  +'<div class="expl"><span class="lab">EXPLANATION</span>'+e.expl+'</div></div>';
  rep.appendChild(det);});
 w.appendChild(rep);
 var row=h("div","acts");
 var rb=h("button","primary");rb.textContent="Retake exam";rb.addEventListener("click",function(){S=newState();render();});row.appendChild(rb);
 w.appendChild(row);
 app.appendChild(w);}
/* ---------- modal ---------- */
function renderModal(){var m=h("div","modal");
 var answered=Object.keys(S.checked).length;
 var skipped=EXERCISES.filter(function(e){return !S.checked[e.id];}).length;
 m.innerHTML='<div class="panel"><h2>Submit this attempt?</h2><p>'+answered+' exercise(s) answered and checked. '+skipped+' will be excluded from scoring (skipped or never answered).</p><p class="dim">After submitting you see the full report and the pass / fail verdict.</p><div class="acts"><button class="primary" id="m-yes">Submit now</button><button id="m-no">Keep working</button></div></div>';
 m.querySelector("#m-yes").addEventListener("click",confirmSubmit);
 m.querySelector("#m-no").addEventListener("click",cancelSubmit);
 app.appendChild(m);}
var _origRender=render;
render=function(){_origRender();if(S&&S.phase==="exam"&&S.modal)renderModal();};
/* ---------- handshake + boot ---------- */
window.addEventListener("message",function(ev){var d=ev.data;if(!d)return;
 if(d.type==="CYBERPULSE_INIT"||d.type==="CYBERMASTERY_INIT"){S.user=d.username||"";var u=document.getElementById("whoami");if(u&&S.user)u.innerHTML='<span class="chip ok">Candidate: '+esc(S.user)+'</span>';}});
S=newState();render();
window.__cm={getS:function(){return S;},setTime:function(t){if(S){S.timeLeft=t;paintTimer();}},finish:finish,cfg:CFG,EX:EXERCISES,THEMES:THEMES,
 coverage:function(){var have={};EXERCISES.forEach(function(e){(e.kw||[]).forEach(function(k){have[k]=1;});});var miss=[];
  THEMES.forEach(function(t){t.kws.forEach(function(k){if(!have[k])miss.push(t.id+": "+k);});});return miss;}};
</script>
