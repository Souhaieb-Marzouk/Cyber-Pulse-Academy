  "subheading": "Tier 4 of 4 — EXTREMELY HARD. Senior work under pressure: chained decisions, artefacts that disagree, real business cost, and at least one case where the correct move is to escalate instead of acting.",
  "objectType": "Sub-Technique (child of Technique T1547)",
  "explanationHtml": "<h3>What you are looking at</h3><p>This page is about MITRE ATT&amp;CK sub-technique <strong>T1547.001, Registry Run Keys and Startup Folder</strong>. In ATT&amp;CK the object type here is a <strong>sub-technique</strong>. A sub-technique is one exact piece of attacker behaviour that belongs to a larger technique. The parent technique is T1547, Boot or Logon Autostart Execution. You will learn what this sub-technique does, why an attacker picks it, what it leaves behind in logs, and which controls reduce it.</p><h3>The simple idea</h3><p>Imagine you are the attacker. You have a program on a Windows computer and you want it to start again by itself, without you. Windows already keeps a list of programs that start when a user logs on, so you add your program to that list. Windows then starts it for you at every logon. This is <strong>Persistence (TA0003)</strong>: access that survives a reboot or a logoff. When the entry sits in a machine wide place and starts with higher rights, it also serves <strong>Privilege Escalation (TA0004)</strong>.</p><h3>Where the list lives</h3><ul><li><strong>HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run</strong> and RunOnce: starts for the user who is logging on. A normal user can write here.</li><li><strong>HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run</strong> and RunOnce: starts for every user. Writing here needs Administrator rights.</li><li>RunServices, RunServicesOnce and the Explorer Run policy keys are less common variants of the same idea.</li><li><strong>RunOnceEx</strong> and its Depend subkey are documented on the ATT&CK page as a way to load a DLL at logon, and the Shell Folders and User Shell Folders keys can be changed so that the Startup folder points somewhere else.</li><li>Two more documented locations start code even earlier: the <strong>Load</strong> value under Windows NT\\CurrentVersion\\Windows for one user, and the <strong>BootExecute</strong> value under the Session Manager for the whole machine.</li><li><strong>Startup folders</strong>: %APPDATA%\\Microsoft\\Windows\\Start Menu\\Programs\\Startup for one user, and C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\Startup for all users. A file placed there starts at logon.</li></ul><h3>What it leaves behind</h3><p>Registry value writes (Windows Registry data source), the program that starts at logon (Process creation), the command line that wrote the entry (Command execution), and new files in a Startup folder (File creation). Windows Event ID 4657 can show a registry value change when registry auditing is switched on, and Sysmon events 12, 13 and 14 show registry activity in many SOCs. ATT&CK also names a detection strategy for this exact behaviour, DET0365 Detect Registry and Startup Folder Persistence on Windows, and it marks the Windows Registry data source DS0024 as deprecated while the framework moves to data components.</p><h3>Why it matters</h3><ul><li>The attacker keeps access after a reboot. Cleaning the malware without removing the autostart entry means the malware comes back.</li><li>The entry normally runs at logon with the rights of the user. A machine wide entry written by an Administrator is more dangerous.</li><li>Autostart entries hide easily among real updaters, so a detection that is not tuned creates false positives.</li></ul>",
  "workHtml": "<h3>Who uses it at work</h3><ul><li><strong>SOC analyst</strong>: triages alerts about new autostart entries and decides if they come from normal software or from an intrusion.</li><li><strong>Detection engineer</strong>: writes and tunes the analytic for autostart registry writes, and removes the false positives caused by normal updaters.</li><li><strong>Threat hunter</strong>: sweeps hosts for unusual Run keys and compares them with a known good baseline.</li><li><strong>Incident responder</strong>: preserves the registry evidence first, then removes the persistence and hunts for the same entry on other hosts.</li><li><strong>CTI analyst</strong>: reports that a named group uses this procedure, and maps the procedure to ATT&amp;CK for the customer.</li><li><strong>GRC analyst and control owner</strong>: checks that the control really covers this behaviour, and records the evidence for the audit.</li><li><strong>Red teamer</strong>: picks this autostart method when the operation must survive a reboot with low noise.</li></ul><h3>Tools you will see</h3><ul><li>reg.exe (reg add, reg query, reg export) and regedit, on the attacker side and on the responder side.</li><li>Sysinternals Autoruns and autorunsc for a baseline of every autostart location.</li><li>Sysmon, Windows Security auditing (Event 4657) and an EDR console for telemetry.</li><li>The ATT&CK detection strategies DET0365 for this behaviour and DET0274 for the parent technique, used as the reference when an analytic is written.</li><li>PowerShell, GPO, and WDAC or AppLocker for control and hardening.</li></ul><h3>Daily tasks and deliverables</h3><ul><li>Triage: what wrote the value, which process, which user, is the path signed, has it been seen before.</li><li>Deliverables: triage note, detection rule with tuning notes, hunt report, IR timeline, registry export kept as evidence, control gap record.</li><li>The daily question: is this entry normal for this host, and what does it start next.</li></ul><h3>Risks and framework links</h3><ul><li>Risk: quiet persistence that survives a reboot and can lead to ransomware or to long term espionage access.</li><li>NIST CSF: PR.AC, PR.IP and DE.CM. CIS Controls v8: 4 secure configuration, 5 account management, 8 audit log management, 10 malware defenses. ISO 27001:2022: A.8.2 privileged access, A.8.16 monitoring, A.8.19 installation of software.</li></ul>",

    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;

  /* token based syntax highlighter for every mono block */
  function hl(text) {
    var TOK = [];
    function tok(html) { TOK.push(html); return '\u0001' + String.fromCharCode(0xE000 + TOK.length - 1) + '\u0001'; }
    var t = esc(text);
    t = t.replace(/^[ \t]*(#|;)[^\n]*/gm, function (m) { return tok('<span class="tc">' + m + '</span>'); });
    t = t.replace(/&quot;[^&\n]*&quot;/g, function (m) { return tok('<span class="tv">' + m + '</span>'); });
    t = t.replace(/\b(?:HKLM|HKCU|HKU|HKCR|HKEY_[A-Z_]+)\b/g, function (m) { return tok('<span class="tk">' + m + '</span>'); });
    t = t.replace(/\b(?:reg|reg\.exe|powershell|pwsh|cmd|cmd\.exe|rundll32|mshta|schtasks|wmic|autorunsc|wscript|cscript|bitsadmin|certutil)\b/gi,
      function (m) { return tok('<span class="tw">' + m + '</span>'); });
    t = t.replace(/\b(?:EventID|Image|TargetObject|Details|EventType|CommandLine|ParentImage|ParentCommandLine|User|UtcTime|RuleName|Provider|ProcessId|Hashes|Key|Value|Type|StartupFolder)\b/g,
      function (m) { return tok('<span class="tp">' + m + '</span>'); });
    t = t.replace(/\b(?:T\d{4}(?:\.\d{3})?|TA\d{4}|M\d{4}|G\d{4}|S\d{4}|DET\d{4})\b/g,
      function (m) { return tok('<span class="tk">' + m + '</span>'); });
    t = t.replace(/\b\d{3,5}\b/g, function (m) { return tok('<span class="tn">' + m + '</span>'); });

  /* ===================== GRADING AND FEEDBACK ===================== */

        S.step += 1;
        if (S.step >= ex.steps.length) {

          record(ex.id, all, S.hintUsed[ex.id], S.branchResults[ex.id].map(function (r, i) { return 'Step ' + (i + 1) + ': ' + r.given; }).join('   ||   '), ex.steps.map(function (s, i) { return 'Step ' + (i + 1) + ': ' + (s.options.filter(function (o) { return o.correct; })[0] || {}).text; }).join('   ||   '));

  /* ===================== PER-EXERCISE TIMER (terminal exercises) ===================== */

  /* ===================== RESULTS ===================== */

      '</div>';
    $('#examScreen').classList.add('hidden');
    $('#skippedScreen').classList.add('hidden');
    $('#introScreen').classList.add('hidden');
    $('#hdr').classList.add('hidden');
    $('#resultsScreen').innerHTML = html;
    $('#resultsScreen').classList.remove('hidden');
    $('#retakeBtn').addEventListener('click', retake);
    $('#toTop').addEventListener('click', function () { window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); });
    window.scrollTo({ top: 0, behavior: 'auto' });
    /* animate the percentage, then report exactly once for this attempt */
    var big = $('#resultsScreen .metric .big');
    if (RM || !big) {
      reportScore(R.sum, R.answered);
      S.reported = true;
    } else {
      var shown = 0;
      var step = Math.max(1, Math.round(R.percent / 22));
      var t = setInterval(function () {
        shown = Math.min(R.percent, shown + step);
        big.textContent = shown + '%';
        if (shown >= R.percent) {
          clearInterval(t);
          big.textContent = R.percent + '%';
          if (!S.reported) { reportScore(R.sum, R.answered); S.reported = true; }
        }
      }, 40);
    }
  }
  function retake() {
    $('#resultsScreen').classList.add('hidden');
    $('#skippedScreen').classList.add('hidden');
    $('#examScreen').classList.add('hidden');
    $('#hdr').classList.add('hidden');
    S.finished = false; S.started = false; S.reported = false; S.paused = false;
    $('#pauseOverlay').classList.add('hidden');
    $('#introScreen').classList.remove('hidden');
    renderIntro();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ===================== BOOT ===================== */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
