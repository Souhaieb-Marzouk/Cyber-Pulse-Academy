<h1>TA0005 &mdash; Defense Evasion &middot; <span class="badge sev-xhard">&#9733; EXTREMELY HARD</span></h1>
<div class="panel kwpanel">
  <h2>Keywords covered in this exam</h2>
  <p class="dim">These are the ideas behind the ATT&amp;CK object <strong>TA0005 &mdash; Defense Evasion</strong>. They are grouped by theme. Every exercise below comes from this list.</p>
  <div class="themes">
    <div class="theme"><b>Adversary objective &amp; lifecycle</b> Long-dwell evasion, defense blindness windows, and how TA0005 protects the whole intrusion investment.</div>
    <div class="theme"><b>Log &amp; artifact tampering</b> T1070.001 clearing, T1070.004 deletion, T1070.009 Clear Persistence, T1562.002/003 logging impairment, event 1102 chains, Sensor Health.</div>

    <div class="theme"><b>Masquerading &amp; hiding</b> T1036.004/005 (service and name/location), T1564.001, masqueraded binaries (fake csrss/svhost), rootkit boundary cases.</div>
    <div class="theme"><b>Obfuscation &amp; trusted tools</b> T1027 command obfuscation, T1140, T1218/T1202 chains, T1127.001, T1620 reflective loading.</div>

<div class="panel">
  <h2>Learn first: what is TA0005 &mdash; Defense Evasion?</h2>
  <p>TA0005 is a <strong>Tactic</strong> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a big, free knowledge base that describes what real attackers do. In ATT&amp;CK, a <em>Tactic</em> is a goal. It is the thing an attacker wants to reach at one stage of an attack. Defense Evasion is the goal of <strong>not being noticed</strong>.</p>
  <p>Imagine you are an attacker. You worked hard to get into one computer. If an alarm goes off, you lose everything. So you hide. You delete the files you used. You clean the event logs. You switch off the antivirus. You give your malware a boring name like <em>svchost.exe</em>. All of these moves have one goal: stay invisible. ATT&amp;CK collects these known moves under TA0005 and gives each one an ID, like T1070.001 for clearing logs.</p>
  <p><strong>Where you will meet this at work.</strong> A SOC analyst triages alerts about tampering. An incident responder looks for cleared logs during an investigation. A threat hunter searches for hidden files and fake names. A threat-intel analyst writes reports that name TA0005 techniques. A detection engineer builds alerts for tamper events. A red teamer uses the same map to show defenders what is possible. The tools are your SIEM, your EDR, Sysmon logs and the ATT&amp;CK website. The work products are detection rules, incident tickets and ATT&amp;CK coverage maps. The risk this tactic addresses is simple: if the attacker stays hidden, the attack grows.</p>
</div>

03:20  Windows 7045   Service "OneDriveSyncSvc" -> C:\\Users\\Public\\svhost.exe</pre></div></div>
<div class="art"><div class="art-l">ARTEFACT 2 &mdash; SIEM note</div><div class="art-b"><pre class="code">Between 02:52 and 03:41 the APP-7 agent reported NOTHING.
Central forwarding for APP-7 Security log: configured, last batch 03:45.
The 1102 event arrived in the SIEM at 03:46.</pre></div></div>
   <p>You are the senior analyst on call. The ticket already contains three assumptions from the first responder; two of them are wrong. Work the four steps.</p>`,
   question:"Work through all four decision steps.",
   hint:"Step 3 hinges on what 'agent stopped reporting' means for what you can still see centrally.",
   ix:{steps:[
      {q:"Step 1: Read the 02:41-03:20 sequence. Which lifecycle reading is correct?",
       opts:[{id:"o1", h:"Masqueraded execution, then defense impairment, then log clearing, then persistence &mdash; a coherent evasion chain"},
             {id:"o2", h:"Unrelated events: a broken agent, a policy change, and a routine service install"},
             {id:"o3", h:"Impact-phase activity: the attacker is already encrypting shares"}],
       correct:"o1"},
      {q:"Step 2: Which single artifact PROVES the log clearing on APP-7?",
       opts:[{id:"o4", h:"Event 1102, centrally forwarded at 03:46"},
             {id:"o5", h:"The empty Security log on APP-7 itself"},
             {id:"o6", h:"The EDR agent health event at 02:52"}],
       correct:"o4"},
      {q:"Step 3: The EDR agent reported nothing 02:52-03:41. What does that imply for the investigation?",
       opts:[{id:"o7", h:"A blind window on the endpoint &mdash; central logs become the primary source for that period"},
             {id:"o8", h:"Nothing happened in that window, since the agent saw no events"},
             {id:"o9", h:"The attacker has already wiped the SIEM too"}],
       correct:"o7"},
      {q:"Step 4: Your first action as IR lead?",
       opts:[{id:"o10", h:"Secure the central logs and capture memory of APP-7 before any reboot or re-image"},
             {id:"o11", h:"Reboot APP-7 immediately to stop the beacon"},
             {id:"o12", h:"Re-image APP-7 from the gold image to save time"}],
       correct:"o10"}]},
   explain:"<p>Step 1: the five events form the classic evasion ladder &mdash; proxy execution through rundll32 with a masqueraded name (T1218.011 + T1036), impairment of real-time protection (T1562.001, via the compromised admin), clearing of the audit trail (T1070.001), and a masqueraded service for persistence (T1036.004). Calling them unrelated ignores the shared account and 39-minute span. Step 2: the <em>only</em> surviving proof of the wipe is the forwarded 1102 &mdash; the on-host log is, by definition of the technique, gone. Step 3: an agent that stops reporting is a detection gap, not an activity gap; for 02:52&ndash;03:41 your SIEM (and any packet capture) is primary. Step 4: volatile memory and central logs are the two things the attacker cannot delete remotely; reboot or re-image destroys both and hands the attacker a clean slate &mdash; with the OneDriveSyncSvc service likely restored from their tooling. This chain is publicly documented tradecraft across ransomware crews; the discipline it demands is evidence-first thinking.</p>",
   study:"reading multi-artifact evasion chains and reasoning about telemetry blind windows."},

  {id:"X02", kind:"multi",
   summary:"Conflicting signals &mdash; the patch account",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Defender 5007, server SQL-PROD-2, 01:30</div><div class="art-b"><pre class="code">Real-time protection changed: Off   by CORP\\svc_patchadmin
Method: WMI from remote host VPN-4 (not a management server)
Context: svc_patchadmin is the documented patching account.
Context: No change ticket. Patch window: Saturdays only. Today: Wednesday.</pre></div></div>`,
   question:"Select the TWO defensible readings and actions for this artifact set.",
   hint:"The account is legitimate; the origin and timing are not. Separate the identity question from the behavior question.",
   ix:{opts:[
      {id:"o1", h:"Treat as compromise until verified: valid account, wrong host, wrong day, remote WMI"},
      {id:"o2", h:"Scope immediately: check where else svc_patchadmin authenticated from in the last 24 hours"},
      {id:"o3", h:"Close the alert &mdash; the account owns AV settings by design"},
      {id:"o4", h:"Reset the Defender policy and move on; the account is internal, so no further review is needed"}],
     correct:["o1","o2"]},
   explain:"<p>Two signals collide: the identity (legitimate patch account) versus the behavior (remote WMI from a VPN concentrator, no ticket, outside the patch window). Senior triage says the <em>behavior</em> wins: attackers who stole svc_patchadmin&rsquo;s credentials look exactly like this, and &ldquo;the account is allowed to do it&rdquo; only answers <em>who could have</em>, never <em>who did</em>. So the defensible pair: treat as compromise pending verification, and scope by checking the account&rsquo;s other authentications. Closing on identity alone or patching-and-moving-on leaves a live T1562.001 violation on a production SQL server. The check that settles it in minutes: 4624 type-3 logons for svc_patchadmin &mdash; if VPN-4 appears nowhere else and the account never logged there interactively, assume the credential is stolen and rotate it.</p>",
   study:"identity-versus-behavior conflicts and credential-abuse scoping."},

  {id:"X03", kind:"term", slot:3,
   summary:"WS-411 &mdash; proof before isolation (reduced timer)",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; live host WS-411, suspected fake process</div><div class="art-b"><pre class="code">Task manager shows TWO csrss.exe processes.
  PID 616   C:\\Windows\\system32\\csrss.exe   (legitimate)
  PID 8844  C:\\Users\\Public\\csrss.exe      (masqueraded, beaconing)
Attacker session believed ACTIVE on WS-411.</pre></div></div>
   <p>The CISO is on the bridge: &ldquo;I need proof of that fake process&rsquo;s command line and parent <strong>before</strong> we isolate the host. Do not kill anything, do not delete anything &mdash; if the operator sees us, they burn the box.&rdquo; You have one elevated shell and a short window. This terminal exercise carries its own <strong>4-minute timer</strong>.</p>`,
   question:"Type the command that prints ProcessId, ParentProcessId and CommandLine of the fake csrss.exe process, as a list.",
   hint:"WMIC or CIM both work. You need the WHERE filter on the name, three properties in the GET, and list formatting. Reading only.",
   ix:{reduced:240,
     prompt:"PS C:\\Users\\ir-lead>",
     canon:"wmic process where \"name='csrss.exe'\" get ProcessId,ParentProcessId,CommandLine /format:list",
     elems:[{re:/wmic|get-ciminstance/, h:"the WMI/CIM query tool"},
            {re:/csrss/, h:"the WHERE filter on name csrss.exe"},
            {re:/commandline/, h:"CommandLine in the GET list &mdash; the CISO's first ask"},
            {re:/parentprocessid/, h:"ParentProcessId in the GET list &mdash; the CISO's second ask"},
            {re:/format[:\-]list|\bfl\b/, h:"list output format (/format:list, Format-List, or fl)"}],
     forbidden:[{re:/taskkill|stop-process|sc\s+stop|net\s+stop/, h:"killing or stopping destroys a live process the bridge still needs"},
                {re:/del\b|remove-item|rd\s/, h:"deleting the binary burns the evidence and tips off the operator"},
                {re:/wevtutil\s+cl|clear-eventlog/, h:"log clearing &mdash; the attacker's move, never yours"}],
     out:["CommandLine=\"C:\\\\Users\\\\Public\\\\csrss.exe\" -b 185[.]62[.]108[.]12:443 -p beacon","ParentProcessId=3112","ProcessId=8844"]},
   explain:"<p>Canonical: <code>wmic process where \"name='csrss.exe'\" get ProcessId,ParentProcessId,CommandLine /format:list</code> (the Get-CimInstance equivalent scores the same). Why this exact shape: the CISO asked for <em>command line and parent</em> &mdash; CommandLine proves the beacon flags and the fake path, ParentProcessId ties 8844 to its launcher (3112), and list format survives the bridge screenshot. Everything destructive &mdash; taskkill, sc stop, delete &mdash; was forbidden twice over: it destroys the volatile state you were sent to prove, and a killed or removed beacon tells the operator you are here. The masqueraded csrss in a user-writable folder is textbook Masquerading (T1036.005) hiding a beacon; your command captured its confession in under a minute. On the real bridge, the next 60 seconds would go to RAM capture &mdash; while the process still runs.</p>",
   study:"safe volatile capture with WMI/CIM under active-attacker conditions."},

  {id:"X04", kind:"qcm",
   summary:"The loop &mdash; protection re-disabled three times",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; timeline, host SQL-PROD-2 (6 hours)</div><div class="art-b"><pre class="code">21:02  T1562.001 alert: real-time protection OFF (svc_patchadmin)
21:20  SOC playbook: re-enabled protection, closed alert
22:47  T1562.001 alert: OFF again (same account, same method)
23:05  Playbook again: re-enabled, closed
01:31  T1562.001 alert: OFF again  +  event 7045 new task "SysMonHelper"
Note: The disable runs from a scheduled task the playbook never touched.</pre></div></div>`,
   question:"The playbook says 're-enable protection on tamper alert'. Why is following it the wrong move this time, and what is the right call?",
   hint:"The alert keeps winning because something restores the disable. Re-enabling is losing a race, not fixing a cause.",
   ix:{opts:[
      {id:"o1", h:"The task re-arms the disable &mdash; cut the persistence first, then re-enable"},
      {id:"o2", h:"Follow the playbook a third time; three data points make a trend"},
      {id:"o3", h:"Rebuild SQL-PROD-2 immediately during business hours to end the loop"},
      {id:"o4", h:"Disable the tamper alerts until the noise stops, then investigate"}],
     correct:["o1"]},
   explain:"<p>Two turns of the loop prove the playbook is treating a symptom: whatever wrote the disable runs on a schedule, so re-enabling protection just re-arms the timer &mdash; and each loop is a fresh blind window the attacker works in (this is the widely-used best practice that is wrong <em>in this context</em>). The right call attacks the cause: pull the &ldquo;SysMonHelper&rdquo; task (a masqueraded name &mdash; T1036.004 wrapping the persistence), capture its definition and binary, remove the mechanism with evidence preserved, then re-enable protection and hold the alert channel open. A business-hours rebuild is the most expensive possible response while the attacker still holds credentials; silencing alerts is doing the attacker&rsquo;s T1562.002 work for them. Also check for Clear Persistence (T1070.009) traces &mdash; crews that loop tampering often clean their own leftovers when they notice attention.</p>",
   study:"breaking tamper loops by addressing persistence, not symptoms."},

  {id:"X05", kind:"order",
   summary:"Evidence first &mdash; the constrained shutdown",
   scenario:`<p>Legal has sealed the case: whatever you do must survive scrutiny. The attacker is active but session-bound (interactive, no service persistence confirmed yet). Order the five actions. Constraint: cutting the account&rsquo;s access is fast and reversible; pulling the host off the network is slower and the business will feel it.</p>`,
   question:"Order the five actions from first to last.",
   hint:"Reversible cuts come before irreversible ones, and RAM does not survive the network pull.",
   ix:{items:[
      {id:"i1", h:"Disable the compromised account (cuts the live session, fast and reversible)"},
      {id:"i2", h:"Export the Security log to off-host EVTX before rotation or a second clearing"},
      {id:"i3", h:"Capture RAM while the host is still fully connected"},
      {id:"i4", h:"Quarantine the host from the network (business-visible step)"},
      {id:"i5", h:"Image the disk (slowest, least volatile, last)"}]},
   explain:"<p>The order is reversibility-first, volatility-second: disable the account (instant, reversible, ends the live session) &rarr; export the log (the attacker has shown clearing intent &mdash; a second 1102 may be minutes away) &rarr; RAM capture (volatile, but the attacker&rsquo;s interactive session is already cut, so nothing is racing you) &rarr; network quarantine (now safe: session dead, RAM preserved, evidence exported) &rarr; disk image last because it is slow and captures nothing that decays. Note what this ordering protects against: doing the business-visible quarantine first would tip off any monitoring the attacker still holds, and imaging before RAM throws away process and network state forever. Legal-grade means defensible <em>order</em>, not just defensible tools.</p>",
   study:"evidence-preservation ordering under legal constraints."},

  {id:"X06", kind:"dnd",
   summary:"Placement &mdash; the cross-tactic drill",
   scenario:`<p>Your CTI lead misfiled six techniques during a late-night session. Fix the board: place each technique by its primary tactic goal. One of them only <em>feels</em> like evasion &mdash; the matrix says otherwise.</p>`,
   question:"Place all six technique cards into the correct tactic zone.",
   hint:"Five of the six serve hiding, stealing, or getting in. The one that destroys recovery shadows (vssadmin) belongs to Impact &mdash; check T1490.",
   ix:{zones:[
      {id:"z1", h:"Defense Evasion (TA0005)"},
      {id:"z2", h:"Credential Access"},
      {id:"z3", h:"Initial Access"},
      {id:"z4", h:"Impact"}],
     items:[
      {id:"i1", h:"Pass the Hash (T1550.002)", z:"z1"},
      {id:"i2", h:"Reflective Code Loading (T1620)", z:"z1"},
      {id:"i3", h:"Code Signing abuse (T1553.002)", z:"z1"},
      {id:"i4", h:"Credentials from Password Stores (T1555)", z:"z2"},
      {id:"i5", h:"Trusted Developer Utilities Proxy Execution (T1127)", z:"z1"},
      {id:"i6", h:"Inhibit System Recovery (T1490) &mdash; vssadmin delete shadows", z:"z4"}]},
   explain:"<p>Pass the Hash reuses stolen auth to move without alarms (TA0005 &mdash; the evasion is never re-authenticating); Reflective Code Loading (T1620) runs payloads straight from memory past on-disk scanners (TA0005); Code Signing abuse wears a trusted signature (TA0005, T1553.002); MSBuild proxy execution borrows a developer tool (TA0005, T1127). Credentials from Password Stores is Credential Access (TA0006) &mdash; stealing, not hiding. The trap card: <code>vssadmin delete shadows</code> <em>feels</em> like defense evasion, but T1490 Inhibit System Recovery is filed under <strong>Impact</strong> &mdash; its goal is making recovery impossible, not staying hidden. Boards drift without this discipline: misfiled techniques corrupt coverage maps and misprice controls.</p>",
   study:"cross-tactic boundaries around TA0005, especially T1490."},

  {id:"X07", kind:"fill",
   summary:"Analytic draft &mdash; rundll32 in the noise",
   scenario:`<div class="logpanel"><input class="logfilter" type="text" placeholder="Filter lines (e.g. rundll32)" aria-label="Filter log lines"><div class="loglines">
<div class="logline">2026-10-05 09:12:01  Sysmon ID 1  rundll32.exe shell32.dll,Control_RunDLL   PPID: explorer.exe   (normal user action)</div>
<div class="logline">2026-10-05 09:14:55  Sysmon ID 1  rundll32.exe  PPID: 3188 (winword.exe)  Image loads: C:\\Users\\Public\\svhost.dll</div>
<div class="logline">2026-10-05 09:20:33  Sysmon ID 1  rundll32.exe -localmachine  PPID: 8844 (fake csrss.exe)</div>
<div class="logline">2026-10-05 09:22:10  Sysmon ID 7  svchost.exe image load: C:\\Users\\Public\\winmm.dll  (real svchost is in System32)</div>
</div></div>
   <p>The raw rundll32 rule fires hundreds of times a day on benign Control_RunDLL activity. Draft the analytic that survives the noise. One artifact above is already the persistence anchor (the fake csrss) &mdash; do not key on it twice.</p>`,
   question:"Fill all three blanks of the analytic.",
   hint:"Blank 1 excludes the normal launcher. Blank 2 catches payload DLLs from user-writable paths. Blank 3 is the DLL-hijack tell in the EID 7 line.",
   ix:{segs:[
      "Alert when the rundll32 parent is NOT in the ",
      " allowlist AND a DLL loads from ",
      " (user-writable, like the Public folder) &mdash; the ",
      " mismatch the EID 7 line also shows with the planted winmm.dll."],
     slots:["explorer.exe","C:\\Users\\Public","unusual path"],
     slotNames:["the normal parent","the user-writable path pattern","the path mismatch tell"],
     bank:["explorer.exe","services.exe","C:\\Users\\Public","C:\\Windows\\System32","unusual path","known path","runas.exe"]},
   explain:"<p>The tuned analytic keys on two mismatches at once: parentage (rundll32 launched by <em>anything except explorer.exe</em> &mdash; winword.exe and the fake csrss.exe both qualify) and load path (payload DLLs resolving from <code>C:\\Users\\Public</code> instead of System32). The same path-mismatch logic rolls up the EID 7 line: real svchost loading <code>winmm.dll</code> from Public is textbook DLL Search Order Hijacking (T1574.001) &mdash; planted DLL, trusted binary. Keeping explorer.exe as the allowed parent preserves the hundreds of benign Control_RunDLL events per day while catching both the word-document dropper and the masqueraded launcher. This is allowlist-driven detection engineering: define normal precisely, alert on the edges.</p>",
   study:"allowlist analytics for proxy execution and DLL hijacking."},

  {id:"X08", kind:"multi",
   summary:"Telemetry conflict &mdash; EDR versus Sysmon",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; two engines disagree, host APP-7, PID 8844</div><div class="art-b"><pre class="code">EDR alert:    T1055.012 Process Hollowing on svchost-like process PID 8844
Sysmon:       NO EID 8/10 (CreateRemoteThread / ProcessAccess) for PID 8844
Sysmon EID 7: PID 8844 image-loaded C:\\Users\\Public\\winmm.dll (unsigned)
Re-scan:      winmm.dll is clean-signed, catalog mismatch, PID 8844 module list shows it resident</pre></div></div>`,
   question:"Select the TWO best next steps that respect the conflict.",
   hint:"One engine says injection; the other shows a loaded library and says nothing. Decide what evidence would settle it &mdash; and protect it meanwhile.",
   ix:{opts:[
      {id:"o1", h:"Capture RAM (or the specific process memory) before any remediation, so the true loading mechanism is preserved"},
      {id:"o2", h:"Reconcile the engines: pull raw Sysmon/store data and EDR telemetry for PID 8844 to resolve which story the evidence supports"},
      {id:"o3", h:"Dismiss the EDR alert &mdash; Sysmon saw no injection events, so it must be a false positive"},
      {id:"o4", h:"Delete winmm.dll from Public immediately and re-enable protection"}],
     correct:["o1","o2"]},
   explain:"<p>The conflict: EDR claims hollowing (T1055.012); Sysmon&rsquo;s absence of EID 8/10 supports a quieter story &mdash; DLL Side-Loading / Search-Order Hijacking (T1574.002/.001), where the payload enters as a <em>library</em>, not via remote threads, exactly matching the unsigned-then-catalog-mismatch winmm.dll resident in PID 8844. Either way the process is hostile, but the <em>mechanism</em> decides your threat hunting and reporting. So: preserve (RAM capture keeps the true loading path provable) and reconcile (read both stores before declaring a winner). Dismissing the EDR alert because one sensor missed it is how sophisticated side-loads survive &mdash; absence of Sysmon events is not absence of activity. Deleting the DLL first destroys the evidence you need to tell the two stories apart.</p>",
   study:"resolving engine disagreements; hollowing versus side-loading evidence."},

  {id:"X09", kind:"term", slot:9,
   summary:"DC-01 &mdash; the log that must survive scrutiny",
   scenario:`<p>Counsel has one requirement: the entire Security log of DC-01 must be preserved as a single, self-contained file that opens in forensic tooling, <strong>before</strong> anything else touches the DC. The attacker has already cleared logs on two member servers &mdash; assume DC-01 is next. Nothing may be altered or cleared. This is an elevated shell on DC-01.</p>`,
   question:"Type the command that exports the whole Security log to C:\\IR\\dc01-security.evtx.",
   hint:"The native tool can write the log out in its own EVTX format without touching the source. Clearing is the one move that must never appear.",
   ix:{prompt:"PS C:\\Users\\ir-lead>",
     canon:"wevtutil epl Security C:\\IR\\dc01-security.evtx",
     elems:[{re:/wevtutil/, h:"wevtutil &mdash; the native event log utility"},
            {re:/\bepl\b/, h:"epl &mdash; export the log in native EVTX format"},
            {re:/epl\s+"?security"?/, h:"Security &mdash; the log being exported (named right after epl)"},
            {re:/\S*\.evtx/, h:"the .evtx destination file (C:\\IR\\dc01-security.evtx)"}],
     forbidden:[{re:/\bcl\b|clear-eventlog/, h:"cl / Clear-EventLog destroys the very evidence counsel demanded"},
                {re:/out-file|-converttext|\/e:\s*false/, h:"text conversion or truncated queries lose the native format counsel asked for"}],
     out:["The command completed successfully.","(C:\\IR\\dc01-security.evtx written; source log untouched)"]},
   explain:"<p>Canonical: <code>wevtutil epl Security C:\\IR\\dc01-security.evtx</code>. Export (epl) copies the log in its native EVTX container &mdash; every record, original timestamps, hashable by forensics &mdash; while the source log remains untouched on the DC. This is the artifact legal meant by &ldquo;survives scrutiny&rdquo;: it opens in event viewers and forensic suites with full fidelity. The catastrophic near-miss is <code>wevtutil cl</code> (or Clear-EventLog): one flag difference between preserving the domain&rsquo;s primary evidence and destroying it. Text conversions and filtered queries lose records or format and would fail the requirement anyway. On the real bridge this export runs in the first minutes, in parallel with RAM capture &mdash; before any visibility change could spook the actor into a third 1102.</p>",
   study:"native log export (wevtutil epl) for legal-grade evidence."},

  {id:"X10", kind:"qcm",
   summary:"Single signal &mdash; one attrib in a quiet tenant",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; the entire alert queue for the day</div><div class="art-b"><pre class="code">14:02  WS-203 (intern workstation, Finance)
       Sysmon EID 1: attrib.exe +h C:\\Users\\istudent\\Downloads\\pricing_draft.xlsx
No network anomalies. No persistence events. No 1102/5007. File reputation: clean.
User context: intern archiving personal files (interviewed, coherent, owns the action).</pre></div></div>`,
   question:"Board pressure says 'decide now'. What is the senior call?",
   hint:"One low-fidelity signal, a coherent user story, and zero corroborating telemetry. What does the evidence actually support?",
   ix:{opts:[
      {id:"o1", h:"Watch and enrich &mdash; do not escalate on one low-fidelity signal"},
      {id:"o2", h:"Isolate WS-203 now &mdash; hiding a file is always an attack"},
      {id:"o3", h:"Declare a confirmed incident and notify the regulator"},
      {id:"o4", h:"Disable the intern's account pending HR and legal review"}],
     correct:["o1"]},
   explain:"<p>This is the deliberate &ldquo;do nothing yet&rdquo; case. The full weight of the evidence: one <code>attrib +h</code> on a spreadsheet, a coherent user interview that owns the action, clean reputation, and <em>zero</em> corroboration &mdash; no tampering (T1562 family), no clearing (T1070 family), no persistence (7045/tasks), no network. Hiding a file is technically T1564.001-shaped, but technique-shape is not intent; attackers chain it with impairments and cleanups, none of which exist here. Isolation costs the intern&rsquo;s afternoon and, worse, burns analyst credibility; regulatory notification on this record would be indefensible. The senior move is proportional handling: watch the file and host, revisit if any second signal appears, and log the reasoning &mdash; deciding <em>not</em> to escalate is a decision, and it is documented like one.</p>",
   study:"proportional response and documented non-escalation."},

  {id:"X11", kind:"dnd",
   summary:"Near-miss quadruplets &mdash; precise naming",
   scenario:`<p>External counsel rejected your report for &ldquo;imprecise technique naming&rdquo;. Rebuild the precision: match each mechanism to the technique that names it exactly.</p>`,
   question:"Drag each mechanism card onto the technique it defines.",
   hint:"Each card names a mechanism: forcing old protocols, rebooting stripped, trusting your own CA, faking the green banner.",
   ix:{zones:[
      {id:"z1", h:"Downgrade Attack (T1562.010)"},
      {id:"z2", h:"Safe Mode Boot (T1562.009)"},
      {id:"z3", h:"Install Root Certificate (T1553.004)"},
      {id:"z4", h:"Spoof Security Alerting (T1562.011)"}],
     items:[
      {id:"i1", h:"Coerce endpoints into NetNTLMv1 so hashes crack easily", z:"z1"},
      {id:"i2", h:"Reboot into a stripped-boot environment where AV drivers never load", z:"z2"},
      {id:"i3", h:"Plant a rogue CA so malicious TLS content validates as trusted", z:"z3"},
      {id:"i4", h:"Show fake 'Protection is ON' banners while protection is off", z:"z4"}]},
   explain:"<p>Counsel&rsquo;s complaint is fair &mdash; these four get swapped constantly. Downgrade (T1562.010) <em>forces</em> software to a weaker protocol or version &mdash; note how it differs from Pass the Hash: no hash is reused here, the protocol is weakened so a hash <em>can</em> be cracked later. Safe Mode Boot (T1562.009) reboots Windows into a minimal-driver state where endpoint agents often cannot start &mdash; impairment by environment, not by uninstall. Install Root Certificate (T1553.004) makes the attacker&rsquo;s own CA trusted, so hostile TLS content validates &mdash; trust subversion, not alert fakery. Spoof Security Alerting (T1562.011) shows users and dashboards a healthy lie. In your report, the precise name is the difference between &ldquo;they impaired defenses&rdquo; (unfalsifiable) and &ldquo;they used T1562.009&rdquo; (testable, detectable, defensible).</p>",
   study:"the four frequently-confused T1562/T1553 sub-techniques."},

  {id:"X12", kind:"multi",
   summary:"Chain reading &mdash; three techniques, one account",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; server FS-03, account adm_rkeller, 02:00&ndash;02:25</div><div class="art-b"><pre class="code">02:00  Sysmon EID 13  HKLM\\...\\Windows Defender\\DisableAntiSpyware = 1   (event 4657 also fires)
02:14  Windows 1102   Security log cleared
02:25  Windows 7045   Service "OneDriveSyncSvc" -> C:\\Users\\Public\\svhost.exe
Note:  adm_rkeller is in the local admins group on FS-03.
Note:  No interactive logon for adm_rkeller before 01:58 this night.</pre></div></div>`,
   question:"Select the THREE techniques this chain demonstrates.",
   hint:"Map each timestamp to its mechanism: a registry flip, a wipe, a costume. The admin rights are context, not a fourth technique.",
   ix:{opts:[
      {id:"o1", h:"Modify Registry (T1112) &mdash; the DisableAntiSpyware flip"},
      {id:"o2", h:"Clear Windows Event Logs (T1070.001) &mdash; the 1102"},
      {id:"o3", h:"Masquerading (T1036) &mdash; the OneDriveSyncSvc costume"},
      {id:"o4", h:"Abuse Elevation Control Mechanism (T1548) &mdash; the admin rights in evidence"},
      {id:"o5", h:"Hide Artifacts (T1564.001) &mdash; the Public folder"}],
     correct:["o1","o2","o3"]},
   explain:"<p>Three timestamps, three techniques: 02:00 is a registry-based kill of antispyware (T1112 Modify Registry, corroborated by 4657 &mdash; and functionally an Impair Defenses move, T1562.001, executed via the registry); 02:14 is log clearing (T1070.001, proven by 1102); 02:25 installs a service wearing a OneDrive-flavored name (Masquerading, T1036.004 &mdash; and note for your report: creating the service is also persistence, T1543.003, but that is a different tactic and not an option here). The admin membership explains <em>capability</em>, not a technique &mdash; T1548 needs an actual elevation-control bypass event. The Public folder is where the binary sits; T1564.001 would need a hidden attribute or similar. Precision exercise: capability, location, and intent are not techniques by themselves.</p>",
   study:"separating capability, mechanism and costume in chain evidence."},

  {id:"X13", kind:"branch",
   summary:"Day six &mdash; the silent containment problem",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; situation board, day 6 of intrusion</div><div class="art-b"><pre class="code">Actor: low-and-slow, active sessions 01:00-03:00 nightly
Access: one admin credential (stolen), PTH-capable, no persistence found yet
C2: beacon to a domain that resolves through a major CDN
Business: the same CDN serves the customer portal
Legal: build the case; board: 'no ransom noise'; CISO: 'stop the bleeding quietly'</pre></div></div>`,
   question:"Work the three decision steps.",
   hint:"Step 2's trap is the shared infrastructure. Step 3's trap is announcing too early.",
   ix:{steps:[
      {q:"The CISO wants containment that does not alert the actor yet. Which posture?",
       opts:[{id:"o1", h:"Targeted: revoke the stolen credential and move the affected hosts to a monitored segment, keeping telemetry flowing"},
             {id:"o2", h:"Full isolation of every host the account touched, all at once"},
             {id:"o3", h:"Change nothing &mdash; containment always alerts the actor"}],
       correct:"o1"},
      {q:"How do you cut the beacon without breaking the customer portal?",
       opts:[{id:"o4", h:"Internal DNS sinkhole for the C2 domain; portal CDN untouched"},
             {id:"o5", h:"Block the CDN's whole IP range at the border firewall"},
             {id:"o6", h:"Allow the beacon and rely on endpoint agents only"}],
       correct:"o4"},
      {q:"Evidence is secured and monitoring is tuned. When do you act openly?",
       opts:[{id:"o7", h:"Coordinated takedown: cut all access and remove mechanisms simultaneously, after evidence is secured and stakeholders are aligned"},
             {id:"o8", h:"Announce the investigation on the intranet immediately to deter the actor"},
             {id:"o9", h:"Keep watching for another week before acting, regardless of actor activity"}],
       correct:"o7"}]},
   explain:"<p>Step 1: silent containment means cutting what the actor <em>uses</em> (the credential) without changing what they <em>see</em> &mdash; full isolation of a fleet is visible and destroys the monitoring you need; doing nothing leaves an active nightly operator in place. Step 2: the beacon shares a CDN with the customer portal, so IP-range blocking is the classic self-inflicted outage &mdash; the surgical move is an internal DNS sinkhole for the specific C2 domain, invisible to the portal and loggable on your side. Step 3: once evidence is secured and the plan is aligned, <em>simultaneous</em> action matters: incremental, announced moves let the operator burn the environment (Clear Persistence, T1070.009, is standard cleanup-on-attention) or pivot to a fresh credential. This is the senior pattern: revoke quietly, watch the reaction, then cut everything at once.</p>",
   study:"silent containment, shared-infrastructure decisions, coordinated takedown timing."},

  {id:"X14", kind:"fill",
   summary:"CTI report &mdash; the precision blanks",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; findings summary for the executive CTI report</div><div class="art-b"><pre class="code">- Payload named OneDriveUpdater.exe in a OneDrive-looking path
- Auth material reused; no password events anywhere in the window
- The agent on APP-7 stopped reporting 02:52-03:41 (no host events survived)</pre></div></div>`,
   question:"Fill all three blanks of the report paragraph.",
   hint:"Blank 1 is the naming sub-technique. Blank 2 is the auth-material reuse technique. Blank 3 is the data source that reveals agent health gaps.",
   ix:{segs:[
      "The actor blended the payload by name and location (",
      ", T1036.005), avoided re-authentication noise by reusing stolen material (",
      ", T1550.002), and created a detection blind window visible only in ",
      " telemetry (Sensor Health)."],
     slots:["Match Legitimate Name or Location","Pass the Hash","Sensor Health"],
     slotNames:["the naming sub-technique","the auth reuse technique","the health telemetry source"],
     bank:["Match Legitimate Name or Location","Double File Extension","Pass the Hash","Pass the Ticket","Sensor Health","Cloud Logs","wevtutil"]},
   explain:"<p>The report-grade names: &ldquo;OneDriveUpdater.exe in a OneDrive-looking path&rdquo; is exactly Match Legitimate Name or Location (T1036.005) &mdash; the sub-technique, not the umbrella. &ldquo;Auth material reused, no password events&rdquo; is Pass the Hash (T1550.002): NTLM material moving between hosts with no interactive logon and no password entry; Pass the Ticket would show Kerberos ticket artifacts instead. The blind window is a <em>sensor</em> fact, so it comes from Sensor Health telemetry &mdash; the data source that tells you an agent stopped reporting, which no log-based source can do (the host logs stopped too). Executives fund what they can verify; these three precise names let the board test every claim.</p>",
   study:"report-grade technique naming for executive CTI deliverables."},

  {id:"X15", kind:"multi",
   summary:"Coverage under constraint &mdash; workstations first",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; environment facts</div><div class="art-b"><pre class="code">EDR agents: servers ONLY (licensing + OT segment ban: no agents on OT, ever)
Workstations: Windows Event Forwarding to SIEM, no EDR
Goal: raise TA0005 coverage on WORKSTATIONS this quarter
Constraints: no new budget line; OT untouched; log volume ceiling +15%</pre></div></div>`,
   question:"Select the TWO compensating moves that raise workstation coverage within the constraints.",
   hint:"Stay inside what workstations already ship with, and forward what you already collect.",
   ix:{opts:[
      {id:"o1", h:"Forward allow-listed Sysmon process and registry events to the SIEM"},
      {id:"o2", h:"Enable Defender Tamper Protection fleet-wide and forward its 5007 events"},
      {id:"o3", h:"Deploy EDR agents to the OT segment to close the biggest gap"},
      {id:"o4", h:"Raise workstation log verbosity to maximum on all channels"},
      {id:"o5", h:"Ask users to report anything suspicious as the primary detection"}],
     correct:["o1","o2"]},
   explain:"<p>Constraint math first: no budget, OT untouchable, +15% log ceiling. Sysmon is free, ships process/registry telemetry (the raw material for masquerade, tamper and hijack analytics), and forwarding it fits the ceiling when the analytics are allow-listed &mdash; that is move one, and it is how a SIEM-only estate compensates for no EDR. Tamper Protection plus its event forwarding is move two: Defender is already licensed on every workstation, and 5007-family events are low-volume, high-value T1562 signals. Both moves respect every constraint. EDR on OT violates a hard ban; maximum verbosity on all channels blows the volume cap for marginal gain; user reporting is a channel, not a control. This is compensating-control reasoning under real-world constraints &mdash; the audit committee will ask exactly these questions.</p>",
   study:"compensating detections when agents cannot deploy."},

  {id:"X16", kind:"qcm",
   summary:"The board call &mdash; fifteen minutes",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; what is confirmed at hour 2</div><div class="art-b"><pre class="code">- Evasion chain confirmed on 3 hosts: impair (T1562.001) + clear (T1070.001) + masquerade (T1036)
- Stolen admin credential in use, PTH-capable (T1550.002 evidence)
- DC-01 Security log exported and intact; APP-7 RAM captured
- Beacon intermittent on one host; no ransomware artifacts anywhere yet</pre></div></div>`,
   question:"The CISO joins the board call in fifteen minutes. Which opening statement is correct?",
   hint:"What is confirmed, what is being protected, and what happens next &mdash; no speculation the evidence cannot carry.",
   ix:{opts:[
      {id:"o1", h:"'Evasion confirmed on 3 hosts; evidence secured, access being cut, assessment in 60 minutes.'"},
      {id:"o2", h:"'Most servers show clean logs right now, so there is no evidence of compromise.'"},
      {id:"o3", h:"'This is ransomware in progress; we should evaluate paying within the hour.'"},
      {id:"o4", h:"'We will have the full picture across every host in one report tomorrow.'"}],
     correct:["o1"]},
   explain:"<p>The correct statement carries only what the evidence holds, states what is being done, and commits to a scoped next deliverable. Option 2 is the trap that &ldquo;clean logs&rdquo; always sets: the logs are clean because the attacker <em>cleared</em> them &mdash; treating T1070.001 success as absence of compromise is exactly the wrong inference. Option 3 speculates a business-altering decision (payment) from zero ransomware artifacts. Option 4 promises omniscience on a timetable the investigation cannot keep and wastes the board&rsquo;s attention window. Notice the structure of the right answer &mdash; confirmed findings with technique names, active protective steps, a time-boxed next assessment: this is the senior register for an active TA0005 incident, where what you say and when you say it are part of the defense.</p>",
   study:"board-level communication of active-evasion incidents."}
];



</script>
<script>
/* CyberPulseAcademy practice-exam engine — TA0005 Defense Evasion (4 severity tiers).
   Vanilla JS, no external requests. Implements: partial-credit scoring, Check-triggered
   auto-pause, manual pause, skip + review pool, hints with credit cost, results + retake,
   site handshake and single-shot score reporting. */
(function () {
  "use strict";

  var CFG = CONFIG, INTROD = INTRO, EXS = EXERCISES;

  /* ---------- small helpers ---------- */
  function $id(i) { return document.getElementById(i); }
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmtTime(s) { s = Math.max(0, s | 0); var m = (s / 60) | 0, r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function byId(id) { for (var i = 0; i < EXS.length; i++) if (EXS[i].id === id) return EXS[i]; return null; }
  function posOf(id) { for (var i = 0; i < S.order.length; i++) if (EXS[S.order[i]].id === id) return i; return -1; }

  /* Mandatory reusable scoring function: max(0, (H - W) / N) */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length;
    if (!N) return 1;
    var corr = {}, i;
    for (i = 0; i < N; i++) corr[correctItems[i]] = true;
    var H = 0, W = 0;
    for (i = 0; i < N; i++) if (corr[correctItems[i]] && selectedItems.indexOf(correctItems[i]) !== -1) H++;
    for (i = 0; i < selectedItems.length; i++) if (!corr[selectedItems[i]]) W++;
    return Math.max(0, (H - W) / N);
  }

  /* ---------- lightweight syntax highlighter for logs / commands ---------- */
  var RXHL = /(&quot;[^&]*?&quot;)|([A-Za-z]:\\[^\s,&<]+)|(\b\d+(?:[.,]\d+)?\b)|(\/[A-Za-z:.0-9]+|-[A-Za-z]+[.\w]*|\$\w+)|(\b(?:wevtutil|certutil|sc|net|attrib|powershell|powershell\.exe|mshta|mshta\.exe|rundll32|rundll32\.exe|regsvr32|regsvr32\.exe|wmic|schtasks|reg|taskkill|vssadmin|sdelete|bcdedit|installutil|msbuild|Get-WinEvent|Get-MpComputerStatus|Get-MpPreference|Set-MpPreference|Add-MpPreference|Clear-EventLog|Stop-Service|Select-Object|Where-Object|Format-List|Export-Clixml|WinDefend|Security|System|Sysmon|Operationally)\b)/g;
  function hl(text) {
    var s = esc(text);
    return s.replace(RXHL, function (m, str, path, num, flag, kw) {
      if (str) return '<span class="tok-str">' + str + "</span>";
      if (path) return '<span class="tok-path">' + path + "</span>";
      if (num) return '<span class="tok-num">' + num + "</span>";
      if (flag) return '<span class="tok-flag">' + flag + "</span>";
      return '<span class="tok-kw">' + kw + "</span>";
    });
  }
  function bindLogFilters(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".logpanel"), function (p) {
      var inp = p.querySelector(".logfilter");
      if (!inp || inp.getAttribute("data-bound")) return;
      inp.setAttribute("data-bound", "1");
      inp.addEventListener("input", function () {
        var q = inp.value.toLowerCase();
        Array.prototype.forEach.call(p.querySelectorAll(".logline"), function (l) {
          var match = !q || l.textContent.toLowerCase().indexOf(q) !== -1;
          l.style.display = match ? "" : "none";
          if (q && match) l.classList.add("hit"); else l.classList.remove("hit");
        });
      });
    });
    /* One-time syntax highlighting of plain-text log lines (spec: the log
       viewer mimics Kibana/Splunk with highlighting + a filter box). */
    Array.prototype.forEach.call(root.querySelectorAll(".logline"), function (l) {
      if (l.getAttribute("data-hl")) return;
      l.setAttribute("data-hl", "1");
      l.innerHTML = hl(l.textContent);
    });
  }
  function highlightCodeIn(root) {
    var pres = root.querySelectorAll("pre.code");
    Array.prototype.forEach.call(pres, function (p) {
      var t = p.textContent;
      p.innerHTML = hl(t);
    });
  }

  /* ---------- global state ---------- */
  var S = {
    screen: "intro",          /* intro | exam | review | results */
    order: [], pos: 0,
    cur: null, reviewFlag: false,
    answered: {}, skipped: {},
    score: 0, answeredN: 0,
    hints: {},                /* exId -> {used, shown} */
    attempt: 0, reported: false,
    user: { username: "", country: "", theme: "", locale: "" },
    tm: { state: "IDLE", remaining: 0, iv: null, manualMs: 0, autoMs: 0, pauseStart: 0, prev: "RUNNING" },
    reduced: { left: 0, total: 0 }
  };

  /* ---------- timer state machine ----------
     States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
     Check -> PAUSED_AUTO_CHECK (first action, before feedback renders).
     Next / Final Submit -> RUNNING or ENDED.
     Skip / Hint -> never change the state.
     Manual Pause on top of auto-pause -> PAUSED_MANUAL; Resume returns to PAUSED_AUTO_CHECK. */
  function setTimerState(st) {
    if (S.tm.state === st) return;
    var was = S.tm.state;
    /* Charge elapsed pause time to the state we are LEAVING, then re-arm the
       clock whenever a new pause segment starts (manual on top of auto-pause
       produces three correctly-attributed segments). */
    if (was === "PAUSED_MANUAL") S.tm.manualMs += Date.now() - S.tm.pauseStart;
    else if (was === "PAUSED_AUTO_CHECK") S.tm.autoMs += Date.now() - S.tm.pauseStart;
    if (st === "PAUSED_MANUAL" || st === "PAUSED_AUTO_CHECK") S.tm.pauseStart = Date.now();
    S.tm.state = st;
    renderTimer();
  }
  function tick() {
    if (S.tm.state !== "RUNNING") return;
    if (S.reduced.total > 0 && S.cur && S.cur.ex && S.cur.ex.ix && S.cur.ex.ix.reduced && !S.cur.graded) {
      S.reduced.left--;
      renderReduced();
      if (S.reduced.left <= 0) { onCheck(); return; }
    }
    S.tm.remaining--;
    if (S.tm.remaining <= 0) { S.tm.remaining = 0; renderTimer(); endByTimeout(); return; }
    renderTimer();
  }
  function startExamTimer() {
    S.tm.remaining = CFG.minutes * 60;
    setTimerState("RUNNING");
    if (!S.tm.iv) S.tm.iv = setInterval(tick, 1000);
  }
  function endByTimeout() {
    setTimerState("ENDED");
    showResults("Time ran out. Exercises you never answered are excluded from the score.");
  }

  /* ---------- play order (terminals stay on fixed, non-adjacent slots) ---------- */
  function buildOrder() {
    var n = EXS.length, order = new Array(n), free = [], i;
    for (i = 0; i < n; i++) free.push(i);
    var fixedIdx = [];
    EXS.forEach(function (ex, idx) {
      if (ex.slot) { order[ex.slot - 1] = idx; fixedIdx.push(idx); }
    });
    free = free.filter(function (p) { return order[p] === undefined; });
    var rest = shuffle(EXS.map(function (e, idx) { return idx; }).filter(function (idx) { return fixedIdx.indexOf(idx) === -1; }));
    var spots = shuffle(free);
    for (i = 0; i < rest.length; i++) order[spots[i]] = rest[i];
    S.order = order;
  }

  /* ---------- score display ---------- */
  function renderScore() {
    var el = $id("h-score");
    if (!el) return;
    var pct = S.answeredN ? Math.round((S.score / S.answeredN) * 100) : 0;
    el.innerHTML = '<span class="hlab">Score</span> <strong>' + (Math.round(S.score * 10) / 10).toFixed(1) + " / " + S.answeredN + "</strong> <span class='dim'>(" + pct + "%)</span>";
  }
  function renderTimer() {
    var el = $id("h-timer");
    if (!el) return;
    var t = fmtTime(S.tm.remaining), cls = "timerbox", txt = "";
    if (S.tm.state === "RUNNING") { cls += " state-run"; txt = "&#9654; Running &mdash; " + t; }
    else if (S.tm.state === "PAUSED_MANUAL") { cls += " state-manual"; txt = "&#9208; Paused &mdash; manual (press Resume)"; }
    else if (S.tm.state === "PAUSED_AUTO_CHECK") { cls += " state-auto"; txt = "&#9208; Paused &mdash; reviewing feedback (resumes on Next)"; }
    else if (S.tm.state === "ENDED") { cls += " state-ended"; txt = "&#9633; Ended"; }
    else { cls += " state-run"; txt = "&#9654; " + t; }
    el.className = cls;
    el.innerHTML = txt;
  }
  function renderReduced() {
    var el = $id("reduced-timer");
    if (!el) return;
    el.innerHTML = "&#9201; Terminal time left in this exercise: <strong>" + fmtTime(S.reduced.left) + "</strong> (of " + fmtTime(S.reduced.total) + "). When it reaches 0 the exercise is graded as it stands.";
  }

  /* ---------- header ---------- */
  function makeHeader() {
    var hd = h("header", "exhdr");
    hd.id = "exhdr";
    hd.innerHTML =
      '<div class="hgrp"><span class="hlab">Exercise</span> <strong id="h-count"></strong></div>' +
      '<div class="hgrp"><span class="badge sev-' + CFG.sevClass + '">' + CFG.sevIcon + " " + CFG.sevName + "</span></div>" +
      '<div class="hgrp"><span id="h-timer" class="timerbox state-run" aria-live="polite"></span></div>' +
      '<div class="hgrp" id="h-score"></div>' +
      '<div class="hgrp hbtns">' +
      '<button type="button" class="btn ghost" id="b-hint">Hint (&minus;10%)</button>' +
      '<button type="button" class="btn ghost" id="b-pause">Pause</button>' +
      '<button type="button" class="btn ghost" id="b-skip">Skip</button>' +
      '<button type="button" class="btn ghost" id="b-finish">Finish</button>' +
      "</div>";
    hd.querySelector("#b-hint").addEventListener("click", onHint);
    hd.querySelector("#b-pause").addEventListener("click", onPause);
    hd.querySelector("#b-skip").addEventListener("click", onSkip);
    hd.querySelector("#b-finish").addEventListener("click", onFinishButton);
    return hd;
  }
  function updateHeader() {
    var c = $id("h-count");
    if (c && S.cur) c.textContent = (S.pos + 1) + " of " + S.order.length;
    var skip = $id("b-skip"), hint = $id("b-hint");
    if (skip) skip.disabled = !!(S.cur && S.cur.graded);
    if (hint) {
      var used = S.cur && S.hints[S.cur.ex.id] && S.hints[S.cur.ex.id].used;
      hint.disabled = !!used || !!(S.cur && S.cur.graded);
    }
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    S.screen = "intro";
    var root = $id("app");
    root.innerHTML = "";
    var wrap = h("div", "intro");
    wrap.innerHTML = INTROD.html;
    var bar = h("div", "startbar");
    var btn = h("button", "btn primary big");
    btn.id = "start-btn"; btn.type = "button";
    btn.textContent = "Start the exam";
    btn.addEventListener("click", startExam);
    bar.appendChild(btn);
    wrap.appendChild(bar);
    root.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  function startExam() {
    S.attempt++; S.reported = false;
    S.answered = {}; S.skipped = {};
    S.score = 0; S.answeredN = 0; S.hints = {};
    S.pos = 0; S.reviewFlag = false; S.cur = null;
    S.reduced = { left: 0, total: 0 };
    S.tm.manualMs = 0; S.tm.autoMs = 0;
    if (S.tm.iv) { clearInterval(S.tm.iv); S.tm.iv = null; }
    S.tm.state = "IDLE";
    buildOrder();
    S.screen = "exam";
    startExamTimer();
    renderExamFrame();
    renderCurrent();
  }

  /* ---------- exam frame ---------- */
  function renderExamFrame() {
    var root = $id("app");
    root.innerHTML = "";
    root.appendChild(makeHeader());
    var main = h("div");
    main.id = "exam-main";
    root.appendChild(main);
  }

  function renderCurrent() {
    var main = $id("exam-main");
    main.innerHTML = "";
    var exIdx = S.order[S.pos];
    var ex = EXS[exIdx];
    var fromReview = S.reviewFlag;
    S.reviewFlag = false;
    S.cur = { ex: ex, idx: exIdx, graded: false, credit: 0, items: null, answerHtml: "", fromReview: fromReview, widget: null };
    if (!S.hints[ex.id]) S.hints[ex.id] = { used: false, shown: false };
    S.reduced = ex.ix.reduced ? { left: ex.ix.reduced, total: ex.ix.reduced } : { left: 0, total: 0 };

    var card = h("div", "excard");

    /* SCENARIO block (collapsible) */
    var sc = h("section", "blk blk-scenario");
    var scHead = h("div", "blk-h");
    scHead.innerHTML = '<span class="bicon" aria-hidden="true">&#9636;</span> SCENARIO';
    var caret = h("button", "minicaret");
    caret.type = "button";
    caret.setAttribute("aria-expanded", "true");
    caret.innerHTML = "&#9662; hide scenario";
    scHead.appendChild(caret);
    var sum = h("button", "sumline");
    sum.type = "button";
    sum.setAttribute("aria-expanded", "true");
    sum.innerHTML = '<span class="sumtxt">' + ex.summary + '</span><span class="caret">&#9662; collapse</span>';
    var scbody = h("div", "blk-body");
    scbody.innerHTML = ex.scenario;
    function setScenarioOpen(open) {
      scbody.style.display = open ? "" : "none";
      caret.setAttribute("aria-expanded", String(open));
      caret.innerHTML = open ? "&#9662; hide scenario" : "&#9656; show scenario";
      sum.style.display = open ? "none" : "";
    }
    caret.addEventListener("click", function () { setScenarioOpen(scbody.style.display === "none"); });
    sum.addEventListener("click", function () { setScenarioOpen(true); });
    sc.appendChild(scHead);
    sc.appendChild(sum);
    sc.appendChild(scbody);
    card.appendChild(sc);

    /* QUESTION block */
    var q = h("section", "blk blk-question");
    q.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#10067;</span> QUESTION</div>' +
      '<div class="blk-body"><p class="qtext">' + ex.question + "</p></div>";
    card.appendChild(q);

    /* YOUR ANSWER block */
    var ans = h("section", "blk blk-answer");
    ans.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#9998;</span> YOUR ANSWER</div>';
    var ansBody = h("div", "blk-body");
    S.cur.widget = buildWidget(ex);
    ansBody.appendChild(S.cur.widget.node);
    ans.appendChild(ansBody);
    card.appendChild(ans);

    /* hint panel */
    var hintPanel = h("div");
    hintPanel.id = "hint-panel";
    if (S.hints[ex.id].shown) hintPanel.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(ex.hint) + "</div>";
    card.appendChild(hintPanel);

    /* footer controls */
    var foot = h("div", "stepctrl");
    if (ex.ix.reduced) {
      foot.appendChild(h("span", "reducednote", ""));
      foot.lastChild.id = "reduced-timer";
    }
    var chk = h("button", "btn primary");
    chk.id = "b-check"; chk.type = "button"; chk.textContent = "Check";
    chk.addEventListener("click", onCheck);
    var nxt = h("button", "btn green");
    nxt.id = "b-next"; nxt.type = "button"; nxt.textContent = "Next";
    nxt.disabled = true;
    nxt.addEventListener("click", onNext);
    foot.appendChild(chk);
    foot.appendChild(nxt);
    card.appendChild(foot);

    /* feedback container (below the three blocks) */
    var fb = h("div");
    fb.id = "fb";
    fb.className = "fb";
    fb.style.display = "none";
    fb.addEventListener("click", function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains("copybtn")) {
        var pre = t.parentNode.querySelector("pre.code");
        if (pre) copyText(pre.textContent, t);
      }
    });
    card.appendChild(fb);

    main.appendChild(card);

    highlightCodeIn(card);
    bindLogFilters(card);
    renderTimer();
    renderScore();
    updateHeader();
    if (ex.ix.reduced) renderReduced();
    window.scrollTo(0, 0);
  }

  function copyText(text, btn) {
    var done = function () { if (btn) { var o = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = o; }, 1200); } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); return; }
    } catch (e) { /* fall through */ }
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e2) { /* clipboard unavailable */ }
    done();
  }

  function onHint() {
    if (!S.cur || S.cur.graded) return;
    var st = S.hints[S.cur.ex.id];
    if (!st) st = S.hints[S.cur.ex.id] = { used: false, shown: false };
    if (st.used) return;
    st.used = true; st.shown = true;
    var p = $id("hint-panel");
    if (p) p.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(S.cur.ex.hint) + "</div>";
    updateHeader();
    /* Hint never changes the timer state and never pauses the clock. */
  }

  function onPause() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    if (S.tm.state === "RUNNING" || S.tm.state === "PAUSED_AUTO_CHECK") {
      S.tm.prev = S.tm.state;
      setTimerState("PAUSED_MANUAL");
      showPauseOverlay();
    }
  }
  function showPauseOverlay() {
    removePauseOverlay();
    var ov = h("div", "overlay");
    ov.id = "pause-overlay";
    ov.innerHTML = '<div class="overlaybox"><h2>&#9208; Paused</h2><p>The timer is stopped. The exercise is hidden so you cannot read or answer it while you take a break.</p><button type="button" class="btn primary big" id="b-resume">Resume</button></div>';
    document.body.appendChild(ov);
    $id("b-resume").addEventListener("click", onResume);
  }
  function removePauseOverlay() {
    var ov = $id("pause-overlay");
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
  }
  function onResume() {
    if (S.tm.state !== "PAUSED_MANUAL") return;
    removePauseOverlay();
    setTimerState(S.tm.prev === "PAUSED_AUTO_CHECK" ? "PAUSED_AUTO_CHECK" : "RUNNING");
  }

  function onFinishButton() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    removePauseOverlay();
    if (S.screen === "review") { showResults(null); return; } /* Finish on the review screen = submit now */
    toReviewOrResults();
  }

  function toReviewOrResults() {
    if (Object.keys(S.skipped).length > 0) renderReview();
    else showResults(null);
  }

  /* ---------- widgets ---------- */
  function buildWidget(ex) {
    if (ex.kind === "qcm" || ex.kind === "multi") return buildChoice(ex, ex.kind === "multi");
    if (ex.kind === "dnd") return buildDnd(ex);
    if (ex.kind === "order") return buildOrderWidget(ex);
    if (ex.kind === "fill") return buildFill(ex);
    if (ex.kind === "term") return buildTerm(ex);
    if (ex.kind === "branch") return buildBranch(ex);
    return buildChoice(ex, false);
  }

  function buildChoice(ex, multi) {
    var ix = ex.ix;
    var opts = shuffle(ix.opts);
    var sel = {};
    var box = h("div", "opts");
    opts.forEach(function (o, i) {
      var letter = String.fromCharCode(65 + i);
      var b = h("button", "opt");
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="okey">' + letter + '.</span><span class="otxt">' + o.h + "</span>" + (multi ? '<span class="obox" aria-hidden="true"></span>' : "");
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (multi) {
          sel[o.id] = !sel[o.id];
          b.classList.toggle("sel", !!sel[o.id]);
          b.setAttribute("aria-pressed", String(!!sel[o.id]));
        } else {
          sel = {}; sel[o.id] = true;
          Array.prototype.forEach.call(box.children, function (c) { c.classList.remove("sel"); c.setAttribute("aria-pressed", "false"); });
          b.classList.add("sel");
          b.setAttribute("aria-pressed", "true");
        }
      });
      box.appendChild(b);
    });
    return {
      node: box,
      get: function () { return Object.keys(sel).filter(function (k) { return sel[k]; }); },
      lock: function () { Array.prototype.forEach.call(box.children, function (c) { c.disabled = true; }); }
    };
  }

  function buildDnd(ex) {
    var ix = ex.ix;
    var wrap = h("div", "dndwrap");
    var zname = {};
    ix.zones.forEach(function (z) { zname[z.id] = z.h; });
    var bankLabel = h("div", "bank-label", "Drag each item into a zone (or click an item, then click a zone):");
    var bank = h("div", "bank");
    bank.setAttribute("aria-label", "Items to place");
    var zonesLabel = h("div", "zones-label", "Drop zones:");
    var zones = h("div", "zones");
    var placement = {}, picked = null, itemEls = {};
    wrap.appendChild(bankLabel); wrap.appendChild(bank);
    wrap.appendChild(zonesLabel); wrap.appendChild(zones);

    function refresh() {
      Array.prototype.forEach.call(zones.children, function (z) {
        var list = z.querySelector(".zitems");
        list.innerHTML = "";
        var any = false;
        Object.keys(placement).forEach(function (itemId) {
          if (placement[itemId] === z.getAttribute("data-zone")) {
            any = true;
            list.appendChild(itemEls[itemId]);
          }
        });
        var empty = z.querySelector(".zempty");
        if (empty) empty.style.display = any ? "none" : "";
      });
      Array.prototype.forEach.call(bank.children, function (c) {
        if (c.getAttribute && c.getAttribute("data-item") && placement[c.getAttribute("data-item")]) {
          bank.removeChild(c);
        }
      });
    }
    function place(itemId, zoneId) {
      if (!itemId || !zoneId) return;
      placement[itemId] = zoneId;
      if (picked === itemId) picked = null;
      refresh();
    }
    ix.items.forEach(function (it) {
      var b = h("button", "ditem");
      b.type = "button";
      b.setAttribute("draggable", "true");
      b.setAttribute("data-item", it.id);
      b.innerHTML = it.h;
      b.addEventListener("dragstart", function (ev) {
        if (S.cur && S.cur.graded) { ev.preventDefault(); return; }
        try { ev.dataTransfer.setData("text/plain", it.id); } catch (e) { /* older engines */ }
      });
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (placement[it.id]) { /* return to bank */
          delete placement[it.id];
          bank.appendChild(b);
          refresh();
        } else {
          if (picked) { var prev = itemEls[picked]; if (prev) prev.classList.remove("picked"); }
          picked = it.id;
          b.classList.add("picked");
        }
      });
      itemEls[it.id] = b;
      bank.appendChild(b);
    });
    ix.zones.forEach(function (z) {
      var zd = h("div", "zone");
      zd.setAttribute("data-zone", z.id);
      /* Keyboard parity for click-to-place: a zone is a focusable button-like
         target; Enter or Space drops the picked item. */
      zd.setAttribute("role", "button");
      zd.setAttribute("tabindex", "0");
      zd.setAttribute("aria-label", "Drop zone: " + z.h.replace(/<[^>]+>/g, ""));
      zd.innerHTML = '<div class="zlabel">' + z.h + '</div><div class="zitems"></div><div class="zempty">Drop here</div>';
      zd.addEventListener("dragover", function (ev) { ev.preventDefault(); zd.classList.add("droptarget"); });
      zd.addEventListener("dragleave", function () { zd.classList.remove("droptarget"); });
      zd.addEventListener("drop", function (ev) {
        ev.preventDefault();
        zd.classList.remove("droptarget");
        if (S.cur && S.cur.graded) return;
        var itemId = null;
        try { itemId = ev.dataTransfer.getData("text/plain"); } catch (e) { /* older engines */ }
        if (!itemId) itemId = picked;
        place(itemId, z.id);
      });
      zd.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (picked) place(picked, z.id);
      });
      zd.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
        if (S.cur && S.cur.graded) return;
        ev.preventDefault();
        if (picked) place(picked, z.id);
      });
      zones.appendChild(zd);
    });
    return {
      node: wrap,
      get: function () { return placement; },
      lock: function () {
        Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; });
      }
    };
  }

  function buildOrderWidget(ex) {
    var ix = ex.ix;
    var list = h("div", "olist");
    var labels = {};
    ix.items.forEach(function (it) { labels[it.id] = it.h; });
    var cur = shuffle(ix.items.map(function (x) { return x.id; }));
    function mv2(i, j) {
      if (S.cur && S.cur.graded) return;
      if (i === j || i < 0 || j < 0 || i >= cur.length || j >= cur.length) return;
      var t = cur[i]; cur[i] = cur[j]; cur[j] = t;
      render();
    }
    function render() {
      list.innerHTML = "";
      cur.forEach(function (id, i) {
        var row = h("div", "orow");
        row.setAttribute("draggable", "true");
        row.setAttribute("data-oid", id);
        row.innerHTML = '<span class="okey">' + (i + 1) + '.</span><span class="otxt">' + labels[id] + "</span>" +
          '<span class="obtns">' +
          '<button type="button" class="mini" aria-label="Move up" data-mv="up">&#8593;</button>' +
          '<button type="button" class="mini" aria-label="Move down" data-mv="down">&#8595;</button></span>';
        row.querySelector('[data-mv="up"]').addEventListener("click", function () { mv2(i, i - 1); });
        row.querySelector('[data-mv="down"]').addEventListener("click", function () { mv2(i, i + 1); });
        row.addEventListener("dragstart", function (ev) { try { ev.dataTransfer.setData("text/plain", String(i)); } catch (e) { /* older engines */ } });
        row.addEventListener("dragover", function (ev) { ev.preventDefault(); });
        row.addEventListener("drop", function (ev) {
          ev.preventDefault();
          var from = parseInt(ev.dataTransfer.getData("text/plain"), 10);
          if (!isNaN(from)) mv2(from, i);
        });
        list.appendChild(row);
      });
    }
    render();
    return {
      node: list,
      get: function () { return cur.slice(); },
      lock: function () { Array.prototype.forEach.call(list.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function buildFill(ex) {
    var ix = ex.ix;
    var wrap = h("div", "fillwrap");
    var sent = h("div", "fillsent");
    var bankLabel = h("div", "bank-label", "Word bank (click a word to fill the next empty blank):");
    var bank = h("div", "bank");
    var slots = ix.slots.map(function () { return null; });
    var chipOf = {};
    function renderSentence() {
      sent.innerHTML = "";
      ix.segs.forEach(function (sg, i) {
        sent.appendChild(h("span", null, sg));
        if (i < ix.slots.length) {
          (function (idx) {
            var sb = h("button", "slot" + (slots[idx] ? " filled" : ""));
            sb.type = "button";
            sb.innerHTML = slots[idx] ? esc(slots[idx]) : "&nbsp;____&nbsp;";
            sb.addEventListener("click", function () {
              if (S.cur && S.cur.graded) return;
              if (slots[idx]) { bankReturn(idx); }
            });
            sent.appendChild(sb);
          })(i);
        }
      });
    }
    function renderBank() {
      bank.innerHTML = "";
      ix.bank.forEach(function (w) {
        var used = slots.indexOf(w) !== -1;
        var c = h("button", "chip");
        c.type = "button";
        c.innerHTML = esc(w);
        c.disabled = used;
        c.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          var target = -1;
          for (var i = 0; i < slots.length; i++) if (slots[i] === null) { target = i; break; }
          if (target === -1) return;
          slots[target] = w;
          renderSentence(); renderBank();
        });
        chipOf[w] = c;
        bank.appendChild(c);
      });
    }
    function bankReturn(idx) {
      slots[idx] = null;
      renderSentence(); renderBank();
    }
    renderSentence(); renderBank();
    wrap.appendChild(sent); wrap.appendChild(bankLabel); wrap.appendChild(bank);
    return {
      node: wrap,
      get: function () { return slots.slice(); },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function normCmd(c) { return String(c).replace(/\s+/g, " ").trim().toLowerCase(); }
  function matchAll(elems, n) { for (var i = 0; i < elems.length; i++) if (!elems[i].re.test(n)) return false; return true; }
  function hitAny(list, n) { for (var i = 0; i < list.length; i++) if (list[i].re.test(n)) return true; return false; }

  function buildTerm(ex) {
    var ix = ex.ix;
    var wrap = h("div", "termwrap");
    if (ix.syntax) wrap.appendChild(h("div", "syntax", ix.syntax));
    if (ix.shape) wrap.appendChild(h("div", "shape", ix.shape));
    var scr = h("div", "termscr");
    scr.setAttribute("aria-label", "Simulated terminal output");
    scr.innerHTML = '<div class="tline dim">Simulation only &mdash; nothing here runs for real. Type a command, press Run or Enter to try it, then press Check to submit.</div>';
    var inline = h("div", "terminline");
    inline.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span>";
    var inp = h("input", "tinput");
    inp.type = "text";
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("spellcheck", "false");
    inp.setAttribute("aria-label", "Type the command");
    var run = h("button", "btn ghost mini");
    run.type = "button"; run.textContent = "Run";
    inline.appendChild(inp); inline.appendChild(run);
    wrap.appendChild(scr); wrap.appendChild(inline);
    var lastCmd = "";
    function runCmd() {
      var v = inp.value;
      if (!v.trim()) return;
      lastCmd = v;
      var line = h("div", "tline");
      line.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span> " + esc(v);
      scr.appendChild(line);
      var n = normCmd(v);
      if (matchAll(ix.elems, n) && !hitAny(ix.forbidden || [], n)) {
        (ix.out && ix.out.length ? ix.out : ["The command completed successfully."]).forEach(function (l) {
          scr.appendChild(h("div", "tline out", l));
        });
      } else if (hitAny(ix.forbidden || [], n)) {
        scr.appendChild(h("div", "tline warn", ix.warn || "Careful: this command changes or destroys data. It will be marked wrong if you submit it."));
      } else {
        scr.appendChild(h("div", "tline dim", ix.miss || "The command did not match the expected action. Check the tool, the options and the target."));
      }
      scr.scrollTop = scr.scrollHeight;
    }
    run.addEventListener("click", runCmd);
    inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); runCmd(); } });
    return {
      node: wrap,
      get: function () { return inp.value.trim() ? inp.value : lastCmd; },
      lock: function () { inp.disabled = true; run.disabled = true; }
    };
  }

  function buildBranch(ex) {
    var ix = ex.ix;
    var wrap = h("div", "branchwrap");
    var area = h("div", "steparea");
    var ctrl = h("div", "branchctrl");
    var step = 0;
    var chosen = new Array(ix.steps.length);
    for (var i0 = 0; i0 < ix.steps.length; i0++) chosen[i0] = null;
    function optLabel(st, id) {
      for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h;
      return "(no answer)";
    }
    function renderStep() {
      area.innerHTML = "";
      var st = ix.steps[step];
      area.appendChild(h("div", "steplab", "STEP " + (step + 1) + " OF " + ix.steps.length));
      var opts = shuffle(st.opts);
      opts.forEach(function (o, i) {
        var b = h("button", "opt");
        b.type = "button";
        b.innerHTML = '<span class="okey">' + String.fromCharCode(65 + i) + '.</span><span class="otxt">' + o.h + "</span>";
        b.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          chosen[step] = o.id;
          Array.prototype.forEach.call(area.querySelectorAll(".opt"), function (c) { c.classList.remove("sel"); });
          b.classList.add("sel");
        });
        area.appendChild(b);
      });
      ctrl.innerHTML = "";
      if (step < ix.steps.length - 1) {
        var cb = h("button", "btn primary");
        cb.type = "button"; cb.textContent = "Confirm & continue";
        cb.addEventListener("click", function () {
          if (chosen[step] == null) {
            var f = h("span", "flash", "Choose an option first.");
            ctrl.appendChild(f);
            setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1600);
            return;
          }
          step++;
          renderStep();
        });
        ctrl.appendChild(cb);
        ctrl.appendChild(h("span", "dim", "Confirming a step does not pause the timer."));
      } else {
        ctrl.appendChild(h("span", "dim", "Final step. Now press Check to grade the whole decision chain."));
      }
    }
    renderStep();
    wrap.appendChild(area); wrap.appendChild(ctrl);
    return {
      node: wrap,
      get: function () { return chosen; },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function smoothScroll(el) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); }
    catch (e) { el.scrollIntoView(); }
  }

  /* ---------- check + grading ---------- */
  function flashCheckMsg(msg) {
    var foot = $id("b-check") && $id("b-check").parentNode;
    if (!foot) return;
    var old = $id("check-flash");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var f = h("span", "flash", esc(msg));
    f.id = "check-flash";
    foot.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 2200);
  }
  function isEmptyAnswer(ex) {
    var v = S.cur.widget.get();
    if (ex.kind === "qcm" || ex.kind === "multi") return v.length === 0;
    if (ex.kind === "dnd") {
      var keys = Object.keys(v); for (var i = 0; i < keys.length; i++) if (v[keys[i]]) return false; return true;
    }
    if (ex.kind === "order") return false; /* items are always placed */
    if (ex.kind === "fill") { for (var j = 0; j < v.length; j++) if (v[j]) return false; return true; }
    if (ex.kind === "term") return !String(v || "").trim();
    if (ex.kind === "branch") { for (var k = 0; k < v.length; k++) if (v[k]) return false; return true; }
    return false;
  }
  function onCheck() {
    if (!S.cur || S.cur.graded) return;
    /* An empty submission is not an answer: nudge instead of locking the
       exercise at zero. The timer keeps running; no pause is triggered. */
    if (isEmptyAnswer(S.cur.ex)) {
      flashCheckMsg("Choose an answer first, or press Skip to move on.");
      return;
    }
    /* First action, before feedback renders: enter the Check-triggered auto-pause. */
    if (S.tm.state === "RUNNING" || S.tm.state === "IDLE") setTimerState("PAUSED_AUTO_CHECK");
    gradeCurrent();
  }

  function gradeCurrent() {
    var ex = S.cur.ex, ix = ex.ix, w = S.cur.widget;
    var items = [], N = 1, credit = 0, answerHtml = "";
    if (ex.kind === "qcm" || ex.kind === "multi") {
      var sel = w.get(), corr = ix.correct;
      N = corr.length;
      credit = scoreExercise(sel, corr);
      ix.opts.forEach(function (o) {
        var isC = corr.indexOf(o.id) !== -1, isSel = sel.indexOf(o.id) !== -1;
        if (isC) items.push({ h: o.h, st: isSel ? "ok" : "missed" });
        else if (isSel) items.push({ h: o.h, st: "wrong" });
      });
      answerHtml = "<ul class='anslist'>" + ix.opts.filter(function (o) { return corr.indexOf(o.id) !== -1; })
        .map(function (o) { return "<li>" + o.h + "</li>"; }).join("") + "</ul>";
    } else if (ex.kind === "dnd") {
      var pl = w.get();
      var zname = {};
      ix.zones.forEach(function (z) { zname[z.id] = z.h; });
      N = ix.items.length;
      var H1 = 0, W1 = 0;
      ix.items.forEach(function (it) {
        var pz = pl[it.id];
        if (!pz) items.push({ h: it.h + " &rarr; <em>not placed</em>", st: "missed" });
        else if (pz === it.z) { H1++; items.push({ h: it.h + " &rarr; " + zname[it.z], st: "ok" }); }
        else { W1++; items.push({ h: it.h + " &rarr; you placed it in &ldquo;" + zname[pz] + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H1 - W1) / N);
      answerHtml = "<ul class='anslist'>" + ix.items.map(function (it) {
        return "<li>" + it.h + " &rarr; <strong>" + zname[it.z] + "</strong></li>";
      }).join("") + "</ul>";
    } else if (ex.kind === "order") {
      var cur = w.get();
      N = ix.items.length;
      var H2 = 0, W2 = 0;
      var lbl = {};
      ix.items.forEach(function (it) { lbl[it.id] = it.h; });
      cur.forEach(function (id, i) {
        if (id === ix.items[i].id) { H2++; items.push({ h: "Position " + (i + 1) + ": " + ix.items[i].h, st: "ok" }); }
        else { W2++; items.push({ h: "Position " + (i + 1) + ": you placed &ldquo;" + lbl[id] + "&rdquo; &mdash; correct: &ldquo;" + ix.items[i].h + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H2 - W2) / N);
      answerHtml = "<ol class='anslist'>" + ix.items.map(function (it) { return "<li>" + it.h + "</li>"; }).join("") + "</ol>";
    } else if (ex.kind === "fill") {
      var fills = w.get();
      N = ix.slots.length;
      var H3 = 0, W3 = 0;
      ix.slots.forEach(function (a, i) {
        var got = fills[i];
        if (!got) items.push({ h: "Blank " + (i + 1) + " (" + esc(ix.slotNames && ix.slotNames[i] ? ix.slotNames[i] : "blank") + "): left empty &mdash; correct: <strong>" + esc(a) + "</strong>", st: "missed" });
        else if (got.toLowerCase() === a.toLowerCase()) { H3++; items.push({ h: "Blank " + (i + 1) + ": " + esc(got), st: "ok" }); }
        else { W3++; items.push({ h: "Blank " + (i + 1) + ': you wrote &ldquo;' + esc(got) + "&rdquo; &mdash; correct: <strong>" + esc(a) + "</strong>", st: "wrong" }); }
      });
      credit = Math.max(0, (H3 - W3) / N);
      answerHtml = "<p>" + ix.slots.map(function (a, i) { return "Blank " + (i + 1) + ": <strong>" + esc(a) + "</strong>"; }).join(" &middot; ") + "</p>";
    } else if (ex.kind === "term") {
      var n = normCmd(w.get());
      var H4 = 0, W4 = 0;
      ix.elems.forEach(function (e) {
        var ok = e.re.test(n);
        if (ok) H4++;
        items.push({ h: e.h, st: ok ? "ok" : "missed" });
      });
      (ix.forbidden || []).forEach(function (f) {
        if (f.re.test(n)) { W4++; items.push({ h: f.h, st: "wrong" }); }
      });
      N = ix.elems.length;
      credit = Math.max(0, (H4 - W4) / N);
      answerHtml = '<div class="codeblock"><pre class="code">' + esc(ix.canon) + '</pre><button type="button" class="btn mini copybtn">Copy</button></div>' +
        "<ul class='anslist'>" + ix.elems.map(function (e) { return "<li>" + esc(e.h) + "</li>"; }).join("") + "</ul>" +
        (ix.canonNote || "");
    } else if (ex.kind === "branch") {
      var ch = w.get();
      N = ix.steps.length;
      var H5 = 0, W5 = 0;
      function olbl(st, id) { for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h; return "(no answer)"; }
      ix.steps.forEach(function (st, i) {
        var ok = ch[i] === st.correct;
