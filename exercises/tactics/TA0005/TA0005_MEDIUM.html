<h1>TA0005 &mdash; Defense Evasion &middot; <span class="badge sev-medium">&#9650; MEDIUM</span></h1>
<div class="panel kwpanel">
  <h2>Keywords covered in this exam</h2>
  <p class="dim">These are the ideas behind the ATT&amp;CK object <strong>TA0005 &mdash; Defense Evasion</strong>. They are grouped by theme. Every exercise below comes from this list.</p>
  <div class="themes">
    <div class="theme"><b>Adversary objective &amp; lifecycle</b> Avoid being detected; protect the foothold won by Initial Access, Persistence and Privilege Escalation.</div>
    <div class="theme"><b>Log &amp; artifact tampering</b> Clear Windows Event Logs (T1070.001), Clear Command History (T1070.003), File Deletion (T1070.004), Timestomp (T1070.006), events 1102/104.</div>
    <div class="theme"><b>Defense impairment</b> Impair Defenses (T1562), Disable or Modify Tools (T1562.001), Disable or Modify System Firewall (T1562.004), Disable Cloud Logs (T1562.007), Modify Registry (T1112).</div>
    <div class="theme"><b>Masquerading &amp; hiding</b> Masquerading (T1036), Double File Extension (T1036.007), Masquerade Task or Service (T1036.004), Hide Artifacts (T1564), Hidden Window (T1564.003), NTFS File Attributes (T1564.004).</div>
    <div class="theme"><b>Obfuscation &amp; trusted tools</b> Obfuscated Files or Information (T1027), Deobfuscate/Decode (T1140), certutil, Mshta (T1218.005), Rundll32 (T1218.011), MSBuild (T1127.001), Indirect Command Execution (T1202).</div>
    <div class="theme"><b>Injection &amp; execution flow</b> Process Injection (T1055), Process Hollowing (T1055.012), Hijack Execution Flow (T1574), DLL Search Order Hijacking (T1574.001).</div>
    <div class="theme"><b>Environment &amp; auth evasion</b> Virtualization/Sandbox Evasion (T1497), Pass the Hash (T1550.002), Pass the Ticket (T1550.003), Web Session Cookie (T1550.004).</div>
    <div class="theme"><b>Telemetry &amp; data sources</b> Sysmon EID 1/7/8/10/11/13/15/22/23, Windows events 1102/4624/4657/7036/7040/7045, Firewall metadata, Sensor Health, cloud logs.</div>
    <div class="theme"><b>Mitigations &amp; controls</b> Antivirus/Antimalware (M1049) + Tamper Protection, Privileged Account Management (M1026), Restrict Registry Permissions (M1024), Audit (M1047), Limit Software Installation (M1033).</div>
    <div class="theme"><b>Real-world work</b> SOC triage playbooks, IR evidence steps, detection engineering, ATT&amp;CK heat maps &mdash; and documented tampering by groups such as Trickbot, Emotet, LockBit and APT28.</div>
  </div>
</div>

<div class="panel">
  <h2>Learn first: what is TA0005 &mdash; Defense Evasion?</h2>
  <p>TA0005 is a <strong>Tactic</strong> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a big, free knowledge base that describes what real attackers do. In ATT&amp;CK, a <em>Tactic</em> is a goal. It is the thing an attacker wants to reach at one stage of an attack. Defense Evasion is the goal of <strong>not being noticed</strong>.</p>
  <p>Imagine you are an attacker. You worked hard to get into one computer. If an alarm goes off, you lose everything. So you hide. You delete the files you used. You clean the event logs. You switch off the antivirus. You give your malware a boring name like <em>svchost.exe</em>. All of these moves have one goal: stay invisible. ATT&amp;CK collects these known moves under TA0005 and gives each one an ID, like T1070.001 for clearing logs.</p>
  <p><strong>Where you will meet this at work.</strong> A SOC analyst triages alerts about tampering. An incident responder looks for cleared logs during an investigation. A threat hunter searches for hidden files and fake names. A threat-intel analyst writes reports that name TA0005 techniques. A detection engineer builds alerts for tamper events. A red teamer uses the same map to show defenders what is possible. The tools are your SIEM, your EDR, Sysmon logs and the ATT&amp;CK website. The work products are detection rules, incident tickets and ATT&amp;CK coverage maps. The risk this tactic addresses is simple: if the attacker stays hidden, the attack grows.</p>
</div>

<div class="panel instr">
  <h2>How this exam works</h2>
  <ul>
    <li><strong>16 exercises. One severity: MEDIUM.</strong> Most exercises connect <em>two</em> ideas &mdash; for example, name the technique <em>and</em> pick the telemetry that proves it. You need <strong>70%</strong> to pass.</li>

    <li><strong>Partial credit:</strong> exercises with several correct items are scored per item: <code>(H &minus; W) / N</code>. Right picks add, wrong picks take away. Selecting everything gives 0.</li>
    <li><strong>Check buys you time:</strong> when you press <em>Check</em>, the timer stops by itself. Read the feedback as long as you want. The timer restarts only when you press <em>Next</em>.</li>
    <li><strong>Pause:</strong> the Pause button is a manual break. It stops the timer and hides the exercise until you press Resume.</li>
    <li><strong>Skip:</strong> move on without answering. Before the end you get a screen to go back to skipped exercises. Skipped-and-never-answered exercises do not count in your score at all.</li>
    <li><strong>Hint:</strong> one hint per exercise. It costs 10% of that exercise&rsquo;s credit. On MEDIUM the hint narrows the direction &mdash; it does not give the answer.</li>
    <li><strong>Timer:</strong> 40 minutes in total for this tier.</li>

</div>
