    if (S.tm.state === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    if (S.cur.fromReview) { renderReview(); return; }
    S.pos++;
    if (S.pos < S.order.length) renderCurrent();
    else toReviewOrResults();
  }

  function onSkip() {
    if (S.screen !== "exam" || !S.cur || S.cur.graded) return;
    S.skipped[S.cur.ex.id] = true;
    /* Skip never triggers the auto-pause; the timer keeps running. */
    if (S.cur.fromReview) { renderReview(); return; }
    S.pos++;
    if (S.pos < S.order.length) renderCurrent();
    else toReviewOrResults();
  }

  function renderReview() {
    S.screen = "review";
    var root = $id("app");
    root.innerHTML = "";
    root.appendChild(makeHeader());
    renderTimer(); renderScore();
    /* No current exercise here: Skip and Hint have nothing to act on, so they
       are disabled. Pause (a real break) stays available. */
    var skipB = $id("b-skip"); if (skipB) skipB.disabled = true;
    var hintB = $id("b-hint"); if (hintB) hintB.disabled = true;
    var cnt = $id("h-count"); if (cnt) cnt.textContent = "Review";
    var card = h("div", "excard");
    card.appendChild(h("h2", null, "Review skipped exercises"));
    var keys = Object.keys(S.skipped);
    if (!keys.length) {
      card.appendChild(h("p", null, "No skipped exercises are waiting. You can submit the exam now."));
    } else {
      card.appendChild(h("p", null, "These exercises were skipped and not answered. You can go back to any of them while the timer still has time. The timer keeps running on this screen."));
      var ul = h("ul", "skiplist");
      keys.forEach(function (k) {
        var ex = byId(k);
        var li = h("li", "skipitem");
        li.innerHTML = '<span class="skiptxt">' + (ex ? ex.summary : esc(k)) + "</span>";
        var b = h("button", "btn primary");
        b.type = "button"; b.textContent = "Answer";
        b.addEventListener("click", function () {
          var p = posOf(k);
          if (p < 0) return;
          S.pos = p;
          S.reviewFlag = true;
          S.screen = "exam";
          renderExamFrame();
          renderCurrent();
        });
        li.appendChild(b);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    var sb = h("button", "btn primary big");
    sb.type = "button"; sb.textContent = "Final Submit";
    sb.addEventListener("click", function () { showResults(null); });
    card.appendChild(sb);
    root.appendChild(card);
    window.scrollTo(0, 0);
  }

  /* ---------- results + reporting ---------- */
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= CFG.passMark
      }, location.origin);
    } catch (e) { /* opened directly, not inside the site: nothing to report to */ }
  }

  function showResults(note) {
    if (S.screen === "results") return;
    setTimerState("ENDED");
    S.screen = "results";
    if (S.tm.iv) { clearInterval(S.tm.iv); S.tm.iv = null; } /* no ticks after the exam ends */
    var root = $id("app");
    root.innerHTML = "";
    var ids = Object.keys(S.answered);
    var sum = 0;
    ids.forEach(function (k) { sum += S.answered[k].credit; });
    var fully = 0, part = 0, wrong = 0, psum = 0;
    ids.forEach(function (k) {
      var c = S.answered[k].credit;
      if (c >= 0.999) fully++;
      else if (c > 0) { part++; psum += c; }
      else wrong++;
    });
    var skippedN = Object.keys(S.skipped).length;
    var total = ids.length;
    var pct = total ? Math.round((sum / total) * 100) : 0;
    var pass = pct >= CFG.passMark;

    var hero = h("div", "res-hero");
    hero.innerHTML = "<h2>Results &mdash; TA0005 Defense Evasion, " + CFG.sevName + " tier</h2>" +
      '<div class="res-score">' + (Math.round(sum * 10) / 10).toFixed(1) + " / " + total + "</div>" +
      '<div class="res-pct">' + pct + "% &mdash; pass mark " + CFG.passMark + "%</div>" +
      (note ? '<p class="dim">' + esc(note) + "</p>" : "");
    root.appendChild(hero);

    if (pass) {
      var name = S.user.username || "Learner";
      var cert = h("div", "cert");
      cert.innerHTML = '<div class="ctitle">&#10003; PASSED &mdash; Certificate of completion</div>' +
        '<div class="cname">' + esc(name) + "</div>" +
        "<p>MITRE ATT&amp;CK <strong>TA0005 &mdash; Defense Evasion</strong> &middot; " + CFG.sevName + " tier &middot; score " + pct + "%</p>" +
        '<p class="dim">You can read attack goals, spot common evasion moves, and name the right responses at this level.</p>';
      root.appendChild(cert);
    } else {
      var fail = h("div", "failpanel");
      fail.innerHTML = "<h2>&#10007; Not passed yet</h2><p>You scored " + pct + "% and the pass mark is " + CFG.passMark + "%. You must retake the exam. Read the feedback in each exercise again, then try once more.</p>";
      var rk = h("button", "btn primary big");
      rk.type = "button"; rk.textContent = "Retake Exam";
      rk.addEventListener("click", startExam);
      fail.appendChild(rk);
      root.appendChild(fail);
    }

    var grid = h("div", "resgrid");
    function rc(num, lbl) { return '<div class="rescard"><div class="num">' + num + '</div><div class="lbl">' + lbl + "</div></div>"; }
    grid.innerHTML =
      rc(fully, "&#10003; Fully correct") +
      rc(part, "&#10003; Partially correct" + (part ? " &mdash; avg " + (Math.round((psum / part) * 100) / 100).toFixed(2) : "")) +
      rc(wrong, "&#10007; Fully incorrect") +
      rc(skippedN, "&#9888; Skipped, never answered (excluded)");
    root.appendChild(grid);

    var pl = h("p", "pauselog");
    pl.innerHTML = "Time on pauses: manual breaks " + Math.round(S.tm.manualMs / 1000) + " s; feedback review (auto-pause after Check) " + Math.round(S.tm.autoMs / 1000) + " s. Attempt #" + S.attempt + ".";
    root.appendChild(pl);

    if (!S.reported) {
      S.reported = true;
      reportScore(sum, total);
    }
    window.scrollTo(0, 0);
  }

  /* ---------- site handshake (optional; exam works with no handshake at all) ---------- */
  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d) return;
    if (d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT") {
      S.user.username = String(d.username || "");
      S.user.country = String(d.country || "");
      S.user.theme = String(d.theme || "");
      S.user.locale = String(d.locale || "");
      /* This file ships a dark theme by default, which matches the site's
         dark theme; no style swap is needed for the supported 'dark' value. */
    }
  });

  /* ---------- boot ---------- */
  renderIntro();
})();


</script>
</body>
</html>
