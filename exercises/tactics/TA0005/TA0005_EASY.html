    sc.appendChild(scbody);
    card.appendChild(sc);

    /* QUESTION block */
    var q = h("section", "blk blk-question");
    q.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#10067;</span> QUESTION</div>' +
      '<div class="blk-body"><p class="qtext">' + ex.question + "</p></div>";
    card.appendChild(q);

    /* YOUR ANSWER block */
    var ans = h("section", "blk blk-answer");
    ans.innerHTML = '<div class="blk-h"><span class="bicon" aria-hidden="true">&#9998;</span> YOUR ANSWER</div>';
    var ansBody = h("div", "blk-body");
    S.cur.widget = buildWidget(ex);
    ansBody.appendChild(S.cur.widget.node);
    ans.appendChild(ansBody);
    card.appendChild(ans);

    /* hint panel */
    var hintPanel = h("div");
    hintPanel.id = "hint-panel";
    if (S.hints[ex.id].shown) hintPanel.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(ex.hint) + "</div>";
    card.appendChild(hintPanel);

    /* footer controls */
    var foot = h("div", "stepctrl");
    if (ex.ix.reduced) {
      foot.appendChild(h("span", "reducednote", ""));
      foot.lastChild.id = "reduced-timer";
    }
    var chk = h("button", "btn primary");
    chk.id = "b-check"; chk.type = "button"; chk.textContent = "Check";
    chk.addEventListener("click", onCheck);
    var nxt = h("button", "btn green");
    nxt.id = "b-next"; nxt.type = "button"; nxt.textContent = "Next";
    nxt.disabled = true;
    nxt.addEventListener("click", onNext);
    foot.appendChild(chk);
    foot.appendChild(nxt);
    card.appendChild(foot);

    /* feedback container (below the three blocks) */
    var fb = h("div");
    fb.id = "fb";
    fb.className = "fb";
    fb.style.display = "none";
    fb.addEventListener("click", function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains("copybtn")) {
        var pre = t.parentNode.querySelector("pre.code");
        if (pre) copyText(pre.textContent, t);
      }
    });
    card.appendChild(fb);

    main.appendChild(card);

    highlightCodeIn(card);
    bindLogFilters(card);
    renderTimer();
    renderScore();
    updateHeader();
    if (ex.ix.reduced) renderReduced();
    window.scrollTo(0, 0);
  }

  function copyText(text, btn) {
    var done = function () { if (btn) { var o = btn.textContent; btn.textContent = "Copied"; setTimeout(function () { btn.textContent = o; }, 1200); } };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, done); return; }
    } catch (e) { /* fall through */ }
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e2) { /* clipboard unavailable */ }
    done();
  }

  function onHint() {
    if (!S.cur || S.cur.graded) return;
    var st = S.hints[S.cur.ex.id];
    if (!st) st = S.hints[S.cur.ex.id] = { used: false, shown: false };
    if (st.used) return;
    st.used = true; st.shown = true;
    var p = $id("hint-panel");
    if (p) p.innerHTML = '<div class="hintbox"><strong>Hint:</strong> ' + esc(S.cur.ex.hint) + "</div>";
    updateHeader();
    /* Hint never changes the timer state and never pauses the clock. */
  }

  function onPause() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    if (S.tm.state === "RUNNING" || S.tm.state === "PAUSED_AUTO_CHECK") {
      S.tm.prev = S.tm.state;
      setTimerState("PAUSED_MANUAL");
      showPauseOverlay();
    }
  }
  function showPauseOverlay() {
    removePauseOverlay();
    var ov = h("div", "overlay");
    ov.id = "pause-overlay";
    ov.innerHTML = '<div class="overlaybox"><h2>&#9208; Paused</h2><p>The timer is stopped. The exercise is hidden so you cannot read or answer it while you take a break.</p><button type="button" class="btn primary big" id="b-resume">Resume</button></div>';
    document.body.appendChild(ov);
    $id("b-resume").addEventListener("click", onResume);
  }
  function removePauseOverlay() {
    var ov = $id("pause-overlay");
    if (ov && ov.parentNode) ov.parentNode.removeChild(ov);
  }
  function onResume() {
    if (S.tm.state !== "PAUSED_MANUAL") return;
    removePauseOverlay();
    setTimerState(S.tm.prev === "PAUSED_AUTO_CHECK" ? "PAUSED_AUTO_CHECK" : "RUNNING");
  }

  function onFinishButton() {
    if (S.screen !== "exam" && S.screen !== "review") return;
    removePauseOverlay();
    if (S.screen === "review") { showResults(null); return; } /* Finish on the review screen = submit now */
    toReviewOrResults();
  }

  function toReviewOrResults() {
    if (Object.keys(S.skipped).length > 0) renderReview();
    else showResults(null);
  }

  /* ---------- widgets ---------- */
  function buildWidget(ex) {
    if (ex.kind === "qcm" || ex.kind === "multi") return buildChoice(ex, ex.kind === "multi");
    if (ex.kind === "dnd") return buildDnd(ex);
    if (ex.kind === "order") return buildOrderWidget(ex);
    if (ex.kind === "fill") return buildFill(ex);
    if (ex.kind === "term") return buildTerm(ex);
    if (ex.kind === "branch") return buildBranch(ex);
    return buildChoice(ex, false);
  }

  function buildChoice(ex, multi) {
    var ix = ex.ix;
    var opts = shuffle(ix.opts);
    var sel = {};
    var box = h("div", "opts");
    opts.forEach(function (o, i) {
      var letter = String.fromCharCode(65 + i);
      var b = h("button", "opt");
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="okey">' + letter + '.</span><span class="otxt">' + o.h + "</span>" + (multi ? '<span class="obox" aria-hidden="true"></span>' : "");
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (multi) {
          sel[o.id] = !sel[o.id];
          b.classList.toggle("sel", !!sel[o.id]);
          b.setAttribute("aria-pressed", String(!!sel[o.id]));
        } else {
          sel = {}; sel[o.id] = true;
          Array.prototype.forEach.call(box.children, function (c) { c.classList.remove("sel"); c.setAttribute("aria-pressed", "false"); });
          b.classList.add("sel");
          b.setAttribute("aria-pressed", "true");
        }
      });
      box.appendChild(b);
    });
    return {
      node: box,
      get: function () { return Object.keys(sel).filter(function (k) { return sel[k]; }); },
      lock: function () { Array.prototype.forEach.call(box.children, function (c) { c.disabled = true; }); }
    };
  }

  function buildDnd(ex) {
    var ix = ex.ix;
    var wrap = h("div", "dndwrap");
    var zname = {};
    ix.zones.forEach(function (z) { zname[z.id] = z.h; });
    var bankLabel = h("div", "bank-label", "Drag each item into a zone (or click an item, then click a zone):");
    var bank = h("div", "bank");
    bank.setAttribute("aria-label", "Items to place");
    var zonesLabel = h("div", "zones-label", "Drop zones:");
    var zones = h("div", "zones");
    var placement = {}, picked = null, itemEls = {};
    wrap.appendChild(bankLabel); wrap.appendChild(bank);
    wrap.appendChild(zonesLabel); wrap.appendChild(zones);

    function refresh() {
      Array.prototype.forEach.call(zones.children, function (z) {
        var list = z.querySelector(".zitems");
        list.innerHTML = "";
        var any = false;
        Object.keys(placement).forEach(function (itemId) {
          if (placement[itemId] === z.getAttribute("data-zone")) {
            any = true;
            list.appendChild(itemEls[itemId]);
          }
        });
        var empty = z.querySelector(".zempty");
        if (empty) empty.style.display = any ? "none" : "";
      });
      Array.prototype.forEach.call(bank.children, function (c) {
        if (c.getAttribute && c.getAttribute("data-item") && placement[c.getAttribute("data-item")]) {
          bank.removeChild(c);
        }
      });
    }
    function place(itemId, zoneId) {
      if (!itemId || !zoneId) return;
      placement[itemId] = zoneId;
      if (picked === itemId) picked = null;
      refresh();
    }
    ix.items.forEach(function (it) {
      var b = h("button", "ditem");
      b.type = "button";
      b.setAttribute("draggable", "true");
      b.setAttribute("data-item", it.id);
      b.innerHTML = it.h;
      b.addEventListener("dragstart", function (ev) {
        if (S.cur && S.cur.graded) { ev.preventDefault(); return; }
        try { ev.dataTransfer.setData("text/plain", it.id); } catch (e) { /* older engines */ }
      });
      b.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (placement[it.id]) { /* return to bank */
          delete placement[it.id];
          bank.appendChild(b);
          refresh();
        } else {
          if (picked) { var prev = itemEls[picked]; if (prev) prev.classList.remove("picked"); }
          picked = it.id;
          b.classList.add("picked");
        }
      });
      itemEls[it.id] = b;
      bank.appendChild(b);
    });
    ix.zones.forEach(function (z) {
      var zd = h("div", "zone");
      zd.setAttribute("data-zone", z.id);
      /* Keyboard parity for click-to-place: a zone is a focusable button-like
         target; Enter or Space drops the picked item. */
      zd.setAttribute("role", "button");
      zd.setAttribute("tabindex", "0");
      zd.setAttribute("aria-label", "Drop zone: " + z.h.replace(/<[^>]+>/g, ""));
      zd.innerHTML = '<div class="zlabel">' + z.h + '</div><div class="zitems"></div><div class="zempty">Drop here</div>';
      zd.addEventListener("dragover", function (ev) { ev.preventDefault(); zd.classList.add("droptarget"); });
      zd.addEventListener("dragleave", function () { zd.classList.remove("droptarget"); });
      zd.addEventListener("drop", function (ev) {
        ev.preventDefault();
        zd.classList.remove("droptarget");
        if (S.cur && S.cur.graded) return;
        var itemId = null;
        try { itemId = ev.dataTransfer.getData("text/plain"); } catch (e) { /* older engines */ }
        if (!itemId) itemId = picked;
        place(itemId, z.id);
      });
      zd.addEventListener("click", function () {
        if (S.cur && S.cur.graded) return;
        if (picked) place(picked, z.id);
      });
      zd.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " " && ev.key !== "Spacebar") return;
        if (S.cur && S.cur.graded) return;
        ev.preventDefault();
        if (picked) place(picked, z.id);
      });
      zones.appendChild(zd);
    });
    return {
      node: wrap,
      get: function () { return placement; },
      lock: function () {
        Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; });
      }
    };
  }

  function buildOrderWidget(ex) {
    var ix = ex.ix;
    var list = h("div", "olist");
    var labels = {};
    ix.items.forEach(function (it) { labels[it.id] = it.h; });
    var cur = shuffle(ix.items.map(function (x) { return x.id; }));
    function mv2(i, j) {
      if (S.cur && S.cur.graded) return;
      if (i === j || i < 0 || j < 0 || i >= cur.length || j >= cur.length) return;
      var t = cur[i]; cur[i] = cur[j]; cur[j] = t;
      render();
    }
    function render() {
      list.innerHTML = "";
      cur.forEach(function (id, i) {
        var row = h("div", "orow");
        row.setAttribute("draggable", "true");
        row.setAttribute("data-oid", id);
        row.innerHTML = '<span class="okey">' + (i + 1) + '.</span><span class="otxt">' + labels[id] + "</span>" +
          '<span class="obtns">' +
          '<button type="button" class="mini" aria-label="Move up" data-mv="up">&#8593;</button>' +
          '<button type="button" class="mini" aria-label="Move down" data-mv="down">&#8595;</button></span>';
        row.querySelector('[data-mv="up"]').addEventListener("click", function () { mv2(i, i - 1); });
        row.querySelector('[data-mv="down"]').addEventListener("click", function () { mv2(i, i + 1); });
        row.addEventListener("dragstart", function (ev) { try { ev.dataTransfer.setData("text/plain", String(i)); } catch (e) { /* older engines */ } });
        row.addEventListener("dragover", function (ev) { ev.preventDefault(); });
        row.addEventListener("drop", function (ev) {
          ev.preventDefault();
          var from = parseInt(ev.dataTransfer.getData("text/plain"), 10);
          if (!isNaN(from)) mv2(from, i);
        });
        list.appendChild(row);
      });
    }
    render();
    return {
      node: list,
      get: function () { return cur.slice(); },
      lock: function () { Array.prototype.forEach.call(list.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function buildFill(ex) {
    var ix = ex.ix;
    var wrap = h("div", "fillwrap");
    var sent = h("div", "fillsent");
    var bankLabel = h("div", "bank-label", "Word bank (click a word to fill the next empty blank):");
    var bank = h("div", "bank");
    var slots = ix.slots.map(function () { return null; });
    var chipOf = {};
    function renderSentence() {
      sent.innerHTML = "";
      ix.segs.forEach(function (sg, i) {
        sent.appendChild(h("span", null, sg));
        if (i < ix.slots.length) {
          (function (idx) {
            var sb = h("button", "slot" + (slots[idx] ? " filled" : ""));
            sb.type = "button";
            sb.innerHTML = slots[idx] ? esc(slots[idx]) : "&nbsp;____&nbsp;";
            sb.addEventListener("click", function () {
              if (S.cur && S.cur.graded) return;
              if (slots[idx]) { bankReturn(idx); }
            });
            sent.appendChild(sb);
          })(i);
        }
      });
    }
    function renderBank() {
      bank.innerHTML = "";
      ix.bank.forEach(function (w) {
        var used = slots.indexOf(w) !== -1;
        var c = h("button", "chip");
        c.type = "button";
        c.innerHTML = esc(w);
        c.disabled = used;
        c.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          var target = -1;
          for (var i = 0; i < slots.length; i++) if (slots[i] === null) { target = i; break; }
          if (target === -1) return;
          slots[target] = w;
          renderSentence(); renderBank();
        });
        chipOf[w] = c;
        bank.appendChild(c);
      });
    }
    function bankReturn(idx) {
      slots[idx] = null;
      renderSentence(); renderBank();
    }
    renderSentence(); renderBank();
    wrap.appendChild(sent); wrap.appendChild(bankLabel); wrap.appendChild(bank);
    return {
      node: wrap,
      get: function () { return slots.slice(); },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function normCmd(c) { return String(c).replace(/\s+/g, " ").trim().toLowerCase(); }
  function matchAll(elems, n) { for (var i = 0; i < elems.length; i++) if (!elems[i].re.test(n)) return false; return true; }
  function hitAny(list, n) { for (var i = 0; i < list.length; i++) if (list[i].re.test(n)) return true; return false; }

  function buildTerm(ex) {
    var ix = ex.ix;
    var wrap = h("div", "termwrap");
    if (ix.syntax) wrap.appendChild(h("div", "syntax", ix.syntax));
    if (ix.shape) wrap.appendChild(h("div", "shape", ix.shape));
    var scr = h("div", "termscr");
    scr.setAttribute("aria-label", "Simulated terminal output");
    scr.innerHTML = '<div class="tline dim">Simulation only &mdash; nothing here runs for real. Type a command, press Run or Enter to try it, then press Check to submit.</div>';
    var inline = h("div", "terminline");
    inline.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span>";
    var inp = h("input", "tinput");
    inp.type = "text";
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("spellcheck", "false");
    inp.setAttribute("aria-label", "Type the command");
    var run = h("button", "btn ghost mini");
    run.type = "button"; run.textContent = "Run";
    inline.appendChild(inp); inline.appendChild(run);
    wrap.appendChild(scr); wrap.appendChild(inline);
    var lastCmd = "";
    function runCmd() {
      var v = inp.value;
      if (!v.trim()) return;
      lastCmd = v;
      var line = h("div", "tline");
      line.innerHTML = '<span class="tprompt">' + esc(ix.prompt) + "</span> " + esc(v);
      scr.appendChild(line);
      var n = normCmd(v);
      if (matchAll(ix.elems, n) && !hitAny(ix.forbidden || [], n)) {
        (ix.out && ix.out.length ? ix.out : ["The command completed successfully."]).forEach(function (l) {
          scr.appendChild(h("div", "tline out", l));
        });
      } else if (hitAny(ix.forbidden || [], n)) {
        scr.appendChild(h("div", "tline warn", ix.warn || "Careful: this command changes or destroys data. It will be marked wrong if you submit it."));
      } else {
        scr.appendChild(h("div", "tline dim", ix.miss || "The command did not match the expected action. Check the tool, the options and the target."));
      }
      scr.scrollTop = scr.scrollHeight;
    }
    run.addEventListener("click", runCmd);
    inp.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); runCmd(); } });
    return {
      node: wrap,
      get: function () { return inp.value.trim() ? inp.value : lastCmd; },
      lock: function () { inp.disabled = true; run.disabled = true; }
    };
  }

  function buildBranch(ex) {
    var ix = ex.ix;
    var wrap = h("div", "branchwrap");
    var area = h("div", "steparea");
    var ctrl = h("div", "branchctrl");
    var step = 0;
    var chosen = new Array(ix.steps.length);
    for (var i0 = 0; i0 < ix.steps.length; i0++) chosen[i0] = null;
    function optLabel(st, id) {
      for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h;
      return "(no answer)";
    }
    function renderStep() {
      area.innerHTML = "";
      var st = ix.steps[step];
      area.appendChild(h("div", "steplab", "STEP " + (step + 1) + " OF " + ix.steps.length));
      var opts = shuffle(st.opts);
      opts.forEach(function (o, i) {
        var b = h("button", "opt");
        b.type = "button";
        b.innerHTML = '<span class="okey">' + String.fromCharCode(65 + i) + '.</span><span class="otxt">' + o.h + "</span>";
        b.addEventListener("click", function () {
          if (S.cur && S.cur.graded) return;
          chosen[step] = o.id;
          Array.prototype.forEach.call(area.querySelectorAll(".opt"), function (c) { c.classList.remove("sel"); });
          b.classList.add("sel");
        });
        area.appendChild(b);
      });
      ctrl.innerHTML = "";
      if (step < ix.steps.length - 1) {
        var cb = h("button", "btn primary");
        cb.type = "button"; cb.textContent = "Confirm & continue";
        cb.addEventListener("click", function () {
          if (chosen[step] == null) {
            var f = h("span", "flash", "Choose an option first.");
            ctrl.appendChild(f);
            setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1600);
            return;
          }
          step++;
          renderStep();
        });
        ctrl.appendChild(cb);
        ctrl.appendChild(h("span", "dim", "Confirming a step does not pause the timer."));
      } else {
        ctrl.appendChild(h("span", "dim", "Final step. Now press Check to grade the whole decision chain."));
      }
    }
    renderStep();
    wrap.appendChild(area); wrap.appendChild(ctrl);
    return {
      node: wrap,
      get: function () { return chosen; },
      lock: function () { Array.prototype.forEach.call(wrap.querySelectorAll("button"), function (b) { b.disabled = true; }); }
    };
  }

  function smoothScroll(el) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" }); }
    catch (e) { el.scrollIntoView(); }
  }

  /* ---------- check + grading ---------- */
  function flashCheckMsg(msg) {
    var foot = $id("b-check") && $id("b-check").parentNode;
    if (!foot) return;
    var old = $id("check-flash");
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var f = h("span", "flash", esc(msg));
    f.id = "check-flash";
    foot.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 2200);
  }
  function isEmptyAnswer(ex) {
    var v = S.cur.widget.get();
    if (ex.kind === "qcm" || ex.kind === "multi") return v.length === 0;
    if (ex.kind === "dnd") {
      var keys = Object.keys(v); for (var i = 0; i < keys.length; i++) if (v[keys[i]]) return false; return true;
    }
    if (ex.kind === "order") return false; /* items are always placed */
    if (ex.kind === "fill") { for (var j = 0; j < v.length; j++) if (v[j]) return false; return true; }
    if (ex.kind === "term") return !String(v || "").trim();
    if (ex.kind === "branch") { for (var k = 0; k < v.length; k++) if (v[k]) return false; return true; }
    return false;
  }
  function onCheck() {
    if (!S.cur || S.cur.graded) return;
    /* An empty submission is not an answer: nudge instead of locking the
       exercise at zero. The timer keeps running; no pause is triggered. */
    if (isEmptyAnswer(S.cur.ex)) {
      flashCheckMsg("Choose an answer first, or press Skip to move on.");
      return;
    }
    /* First action, before feedback renders: enter the Check-triggered auto-pause. */
    if (S.tm.state === "RUNNING" || S.tm.state === "IDLE") setTimerState("PAUSED_AUTO_CHECK");
    gradeCurrent();
  }

  function gradeCurrent() {
    var ex = S.cur.ex, ix = ex.ix, w = S.cur.widget;
    var items = [], N = 1, credit = 0, answerHtml = "";
    if (ex.kind === "qcm" || ex.kind === "multi") {
      var sel = w.get(), corr = ix.correct;
      N = corr.length;
      credit = scoreExercise(sel, corr);
      ix.opts.forEach(function (o) {
        var isC = corr.indexOf(o.id) !== -1, isSel = sel.indexOf(o.id) !== -1;
        if (isC) items.push({ h: o.h, st: isSel ? "ok" : "missed" });
        else if (isSel) items.push({ h: o.h, st: "wrong" });
      });
      answerHtml = "<ul class='anslist'>" + ix.opts.filter(function (o) { return corr.indexOf(o.id) !== -1; })
        .map(function (o) { return "<li>" + o.h + "</li>"; }).join("") + "</ul>";
    } else if (ex.kind === "dnd") {
      var pl = w.get();
      var zname = {};
      ix.zones.forEach(function (z) { zname[z.id] = z.h; });
      N = ix.items.length;
      var H1 = 0, W1 = 0;
      ix.items.forEach(function (it) {
        var pz = pl[it.id];
        if (!pz) items.push({ h: it.h + " &rarr; <em>not placed</em>", st: "missed" });
        else if (pz === it.z) { H1++; items.push({ h: it.h + " &rarr; " + zname[it.z], st: "ok" }); }
        else { W1++; items.push({ h: it.h + " &rarr; you placed it in &ldquo;" + zname[pz] + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H1 - W1) / N);
      answerHtml = "<ul class='anslist'>" + ix.items.map(function (it) {
        return "<li>" + it.h + " &rarr; <strong>" + zname[it.z] + "</strong></li>";
      }).join("") + "</ul>";
    } else if (ex.kind === "order") {
      var cur = w.get();
      N = ix.items.length;
      var H2 = 0, W2 = 0;
      var lbl = {};
      ix.items.forEach(function (it) { lbl[it.id] = it.h; });
      cur.forEach(function (id, i) {
        if (id === ix.items[i].id) { H2++; items.push({ h: "Position " + (i + 1) + ": " + ix.items[i].h, st: "ok" }); }
        else { W2++; items.push({ h: "Position " + (i + 1) + ": you placed &ldquo;" + lbl[id] + "&rdquo; &mdash; correct: &ldquo;" + ix.items[i].h + "&rdquo;", st: "wrong" }); }
      });
      credit = Math.max(0, (H2 - W2) / N);
      answerHtml = "<ol class='anslist'>" + ix.items.map(function (it) { return "<li>" + it.h + "</li>"; }).join("") + "</ol>";
    } else if (ex.kind === "fill") {
      var fills = w.get();
      N = ix.slots.length;
      var H3 = 0, W3 = 0;
      ix.slots.forEach(function (a, i) {
        var got = fills[i];
        if (!got) items.push({ h: "Blank " + (i + 1) + " (" + esc(ix.slotNames && ix.slotNames[i] ? ix.slotNames[i] : "blank") + "): left empty &mdash; correct: <strong>" + esc(a) + "</strong>", st: "missed" });
        else if (got.toLowerCase() === a.toLowerCase()) { H3++; items.push({ h: "Blank " + (i + 1) + ": " + esc(got), st: "ok" }); }
        else { W3++; items.push({ h: "Blank " + (i + 1) + ': you wrote &ldquo;' + esc(got) + "&rdquo; &mdash; correct: <strong>" + esc(a) + "</strong>", st: "wrong" }); }
      });
      credit = Math.max(0, (H3 - W3) / N);
      answerHtml = "<p>" + ix.slots.map(function (a, i) { return "Blank " + (i + 1) + ": <strong>" + esc(a) + "</strong>"; }).join(" &middot; ") + "</p>";
    } else if (ex.kind === "term") {
      var n = normCmd(w.get());
      var H4 = 0, W4 = 0;
      ix.elems.forEach(function (e) {
        var ok = e.re.test(n);
        if (ok) H4++;
        items.push({ h: e.h, st: ok ? "ok" : "missed" });
      });
      (ix.forbidden || []).forEach(function (f) {
        if (f.re.test(n)) { W4++; items.push({ h: f.h, st: "wrong" }); }
      });
      N = ix.elems.length;
      credit = Math.max(0, (H4 - W4) / N);
      answerHtml = '<div class="codeblock"><pre class="code">' + esc(ix.canon) + '</pre><button type="button" class="btn mini copybtn">Copy</button></div>' +
        "<ul class='anslist'>" + ix.elems.map(function (e) { return "<li>" + esc(e.h) + "</li>"; }).join("") + "</ul>" +
        (ix.canonNote || "");
    } else if (ex.kind === "branch") {
      var ch = w.get();
      N = ix.steps.length;
      var H5 = 0, W5 = 0;
      function olbl(st, id) { for (var i = 0; i < st.opts.length; i++) if (st.opts[i].id === id) return st.opts[i].h; return "(no answer)"; }
      ix.steps.forEach(function (st, i) {
        var ok = ch[i] === st.correct;
        if (ok) H5++; else W5++;
        items.push({ h: "Step " + (i + 1) + ": " + (ok ? "you chose the best option" : 'you chose &ldquo;' + olbl(st, ch[i]) + "&rdquo; &mdash; best: &ldquo;" + olbl(st, st.correct) + "&rdquo;"), st: ok ? "ok" : "wrong" });
      });
      credit = Math.max(0, (H5 - W5) / N);
      answerHtml = "<ol class='anslist'>" + ix.steps.map(function (st) {
        return "<li>" + st.q + " &rarr; <strong>" + olbl(st, st.correct) + "</strong></li>";
      }).join("") + "</ol>";
    }

    var hintUsed = !!(S.hints[ex.id] && S.hints[ex.id].used);
    var creditFinal = Math.max(0, credit - (hintUsed ? 0.10 : 0));
    if (!(ex.id in S.answered)) S.answeredN++;
    S.score += creditFinal;
    S.answered[ex.id] = { credit: creditFinal, hint: hintUsed };
    delete S.skipped[ex.id];
    S.cur.graded = true;
    S.cur.credit = creditFinal;
    S.cur.items = items;
    S.cur.N = N;
    S.cur.answerHtml = answerHtml;
    S.cur.widget.lock();
    renderScore();
    updateHeader();
    renderFeedback();
  }

  function renderFeedback() {
    var fb = $id("fb");
    if (!fb || !S.cur) return;
    var credit = S.cur.credit, hintUsed = !!(S.hints[S.cur.ex.id] && S.hints[S.cur.ex.id].used);
    var label, cls, icon;
    if (credit >= 0.999) { label = "CORRECT"; cls = "fb-ok"; icon = "&#10003;"; }
    else if (credit > 0) { label = "PARTIALLY CORRECT"; cls = "fb-part"; icon = "&#10003;"; }
    else { label = "INCORRECT"; cls = "fb-no"; icon = "&#10007;"; }
    fb.style.display = "";
    fb.innerHTML = "";
    var head = h("div", "fbhead " + cls);
    head.setAttribute("role", "status");
    head.innerHTML = '<span class="fbicon">' + icon + "</span> " + label +
      (hintUsed ? ' <span class="dim">(hint used: &minus;0.10 credit)</span>' : "");
    fb.appendChild(head);
    var body = h("div", "fbbody");
    if (S.cur.items.length > 1) {
      var Hc = 0; S.cur.items.forEach(function (it) { if (it.st === "ok") Hc++; });
      body.appendChild(h("div", "fbcredit", "credit " + credit.toFixed(2) + " &mdash; " + Hc + "/" + S.cur.N + " items &mdash; scoring: (H &minus; W) / N"));
      S.cur.items.forEach(function (it) {
        var word = it.st === "ok" ? "&#10003; Correct" : it.st === "wrong" ? "&#10007; Wrong" : "&#9675; Missed";
        var cls2 = it.st;
        body.appendChild(h("div", "iline", '<span class="ist ' + cls2 + '">' + word + "</span><span>" + it.h + "</span>"));
      });
    } else if (S.cur.items.length === 1) {
      body.appendChild(h("div", "iline", '<span class="ist ' + (credit >= 0.999 ? "ok" : credit > 0 ? "part" : "wrong") + '">' + (credit >= 0.999 ? "&#10003; Correct" : "&#10007; Incorrect") + "</span><span>" + S.cur.items[0].h + "</span>"));
    }
    body.appendChild(h("h3", null, "Correct answer"));
    body.appendChild(h("div", null, S.cur.answerHtml));
    body.appendChild(h("div", "fbexplain", S.cur.ex.explain));
    body.appendChild(h("div", "fbstudy", "What to study next: " + S.cur.ex.study));
    fb.appendChild(body);
    var nxt = $id("b-next");
    if (nxt) { nxt.disabled = false; }
    var chk = $id("b-check");
    if (chk) chk.disabled = true;
    smoothScroll(fb);
  }

  /* ---------- next / skip / review ---------- */
  function onNext() {
    if (!S.cur || !S.cur.graded) return;
    if (S.tm.state === "PAUSED_AUTO_CHECK") setTimerState("RUNNING");
    if (S.cur.fromReview) { renderReview(); return; }
    S.pos++;
    if (S.pos < S.order.length) renderCurrent();
    else toReviewOrResults();
  }

  function onSkip() {
    if (S.screen !== "exam" || !S.cur || S.cur.graded) return;
    S.skipped[S.cur.ex.id] = true;
    /* Skip never triggers the auto-pause; the timer keeps running. */
    if (S.cur.fromReview) { renderReview(); return; }
    S.pos++;
    if (S.pos < S.order.length) renderCurrent();
    else toReviewOrResults();
  }

  function renderReview() {
    S.screen = "review";
    var root = $id("app");
    root.innerHTML = "";
    root.appendChild(makeHeader());
    renderTimer(); renderScore();
    /* No current exercise here: Skip and Hint have nothing to act on, so they
       are disabled. Pause (a real break) stays available. */
    var skipB = $id("b-skip"); if (skipB) skipB.disabled = true;
    var hintB = $id("b-hint"); if (hintB) hintB.disabled = true;
    var cnt = $id("h-count"); if (cnt) cnt.textContent = "Review";
    var card = h("div", "excard");
    card.appendChild(h("h2", null, "Review skipped exercises"));
    var keys = Object.keys(S.skipped);
    if (!keys.length) {
      card.appendChild(h("p", null, "No skipped exercises are waiting. You can submit the exam now."));
    } else {
      card.appendChild(h("p", null, "These exercises were skipped and not answered. You can go back to any of them while the timer still has time. The timer keeps running on this screen."));
      var ul = h("ul", "skiplist");
      keys.forEach(function (k) {
        var ex = byId(k);
        var li = h("li", "skipitem");
        li.innerHTML = '<span class="skiptxt">' + (ex ? ex.summary : esc(k)) + "</span>";
        var b = h("button", "btn primary");
        b.type = "button"; b.textContent = "Answer";
        b.addEventListener("click", function () {
          var p = posOf(k);
          if (p < 0) return;
          S.pos = p;
          S.reviewFlag = true;
          S.screen = "exam";
          renderExamFrame();
          renderCurrent();
        });
        li.appendChild(b);
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }
    var sb = h("button", "btn primary big");
    sb.type = "button"; sb.textContent = "Final Submit";
    sb.addEventListener("click", function () { showResults(null); });
    card.appendChild(sb);
    root.appendChild(card);
    window.scrollTo(0, 0);
  }

  /* ---------- results + reporting ---------- */
  function reportScore(creditSum, answeredCount) {
    var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
    try {
      parent.postMessage({
        type: "CYBERPULSE_SCORE",
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: percent >= CFG.passMark
      }, location.origin);
    } catch (e) { /* opened directly, not inside the site: nothing to report to */ }
  }

  function showResults(note) {
    if (S.screen === "results") return;
    setTimerState("ENDED");
    S.screen = "results";
    if (S.tm.iv) { clearInterval(S.tm.iv); S.tm.iv = null; } /* no ticks after the exam ends */
    var root = $id("app");
    root.innerHTML = "";
    var ids = Object.keys(S.answered);
    var sum = 0;
    ids.forEach(function (k) { sum += S.answered[k].credit; });
    var fully = 0, part = 0, wrong = 0, psum = 0;
    ids.forEach(function (k) {
      var c = S.answered[k].credit;
      if (c >= 0.999) fully++;
      else if (c > 0) { part++; psum += c; }
      else wrong++;
    });
    var skippedN = Object.keys(S.skipped).length;
    var total = ids.length;
    var pct = total ? Math.round((sum / total) * 100) : 0;
    var pass = pct >= CFG.passMark;

    var hero = h("div", "res-hero");
    hero.innerHTML = "<h2>Results &mdash; TA0005 Defense Evasion, " + CFG.sevName + " tier</h2>" +
      '<div class="res-score">' + (Math.round(sum * 10) / 10).toFixed(1) + " / " + total + "</div>" +
      '<div class="res-pct">' + pct + "% &mdash; pass mark " + CFG.passMark + "%</div>" +
      (note ? '<p class="dim">' + esc(note) + "</p>" : "");
    root.appendChild(hero);

    if (pass) {
      var name = S.user.username || "Learner";
      var cert = h("div", "cert");
      cert.innerHTML = '<div class="ctitle">&#10003; PASSED &mdash; Certificate of completion</div>' +
        '<div class="cname">' + esc(name) + "</div>" +
        "<p>MITRE ATT&amp;CK <strong>TA0005 &mdash; Defense Evasion</strong> &middot; " + CFG.sevName + " tier &middot; score " + pct + "%</p>" +
        '<p class="dim">You can read attack goals, spot common evasion moves, and name the right responses at this level.</p>';
      root.appendChild(cert);
    } else {
      var fail = h("div", "failpanel");
      fail.innerHTML = "<h2>&#10007; Not passed yet</h2><p>You scored " + pct + "% and the pass mark is " + CFG.passMark + "%. You must retake the exam. Read the feedback in each exercise again, then try once more.</p>";
      var rk = h("button", "btn primary big");
      rk.type = "button"; rk.textContent = "Retake Exam";
      rk.addEventListener("click", startExam);
      fail.appendChild(rk);
      root.appendChild(fail);
    }

    var grid = h("div", "resgrid");
    function rc(num, lbl) { return '<div class="rescard"><div class="num">' + num + '</div><div class="lbl">' + lbl + "</div></div>"; }
    grid.innerHTML =
      rc(fully, "&#10003; Fully correct") +
      rc(part, "&#10003; Partially correct" + (part ? " &mdash; avg " + (Math.round((psum / part) * 100) / 100).toFixed(2) : "")) +
      rc(wrong, "&#10007; Fully incorrect") +
      rc(skippedN, "&#9888; Skipped, never answered (excluded)");
    root.appendChild(grid);

    var pl = h("p", "pauselog");
    pl.innerHTML = "Time on pauses: manual breaks " + Math.round(S.tm.manualMs / 1000) + " s; feedback review (auto-pause after Check) " + Math.round(S.tm.autoMs / 1000) + " s. Attempt #" + S.attempt + ".";
    root.appendChild(pl);

    if (!S.reported) {
      S.reported = true;
      reportScore(sum, total);
    }
    window.scrollTo(0, 0);
  }

  /* ---------- site handshake (optional; exam works with no handshake at all) ---------- */
  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d) return;
    if (d.type === "CYBERPULSE_INIT" || d.type === "CYBERMASTERY_INIT") {
      S.user.username = String(d.username || "");
      S.user.country = String(d.country || "");
      S.user.theme = String(d.theme || "");
      S.user.locale = String(d.locale || "");
      /* This file ships a dark theme by default, which matches the site's
         dark theme; no style swap is needed for the supported 'dark' value. */
    }
  });

  /* ---------- boot ---------- */
  renderIntro();
})();


</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
