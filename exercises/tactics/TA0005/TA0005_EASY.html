<h1>TA0005 &mdash; Defense Evasion &middot; <span class="badge sev-easy">&#9679; EASY</span></h1>
<div class="panel kwpanel">
  <h2>Keywords covered in this exam</h2>
  <p class="dim">These are the ideas behind the ATT&amp;CK object <strong>TA0005 &mdash; Defense Evasion</strong>. They are grouped by theme. Every exercise below comes from this list.</p>
  <div class="themes">
    <div class="theme"><b>Adversary objective &amp; lifecycle</b> The goal: avoid being detected. Where TA0005 sits: after Initial Access, Persistence and Privilege Escalation.</div>
    <div class="theme"><b>Log &amp; artifact tampering</b> Clear Windows Event Logs (T1070.001), File Deletion (T1070.004), Timestomp (T1070.006), Clear Command History (T1070.003), event 1102.</div>
    <div class="theme"><b>Defense impairment</b> Impair Defenses (T1562), Disable or Modify Tools (T1562.001), Modify Registry (T1112), Defender events 5007/7040.</div>
    <div class="theme"><b>Masquerading &amp; hiding</b> Masquerading (T1036), Hide Artifacts (T1564), Hidden Files and Directories (T1564.001), attrib +h, Rootkit (T1014).</div>
    <div class="theme"><b>Obfuscation &amp; trusted tools</b> Obfuscated Files or Information (T1027), Deobfuscate/Decode (T1140), Mshta (T1218.005), Rundll32 (T1218.011), Indirect Command Execution (T1202).</div>
    <div class="theme"><b>Injection &amp; execution flow</b> Process Injection (T1055), Process Hollowing (T1055.012), Hijack Execution Flow (T1574), Subvert Trust Controls (T1553).</div>
    <div class="theme"><b>Environment &amp; auth evasion</b> Virtualization/Sandbox Evasion (T1497), Pass the Hash (T1550.002), Exploitation for Defense Evasion (T1211).</div>
    <div class="theme"><b>Telemetry &amp; data sources</b> Sysmon EID 1/3/7/11/13/15/23, Windows events 1102/104/4688/4657/7045, Sensor Health, file and registry telemetry.</div>
    <div class="theme"><b>Mitigations &amp; controls</b> Antivirus/Antimalware (M1049), Execution Prevention (M1038), Privileged Account Management (M1026), Operating System Configuration (M1028), Audit (M1047).</div>
    <div class="theme"><b>Real-world work</b> SOC triage, incident response, threat hunting, CTI reporting, detection engineering &mdash; and groups such as Trickbot, LockBit and APT28 that publicly used these behaviors.</div>
  </div>
</div>

<div class="panel">
  <h2>Learn first: what is TA0005 &mdash; Defense Evasion?</h2>
  <p>TA0005 is a <strong>Tactic</strong> in the MITRE ATT&amp;CK framework. ATT&amp;CK is a big, free knowledge base that describes what real attackers do. In ATT&amp;CK, a <em>Tactic</em> is a goal. It is the thing an attacker wants to reach at one stage of an attack. Defense Evasion is the goal of <strong>not being noticed</strong>.</p>
  <p>Imagine you are an attacker. You worked hard to get into one computer. If an alarm goes off, you lose everything. So you hide. You delete the files you used. You clean the event logs. You switch off the antivirus. You give your malware a boring name like <em>svchost.exe</em>. All of these moves have one goal: stay invisible. ATT&amp;CK collects these known moves under TA0005 and gives each one an ID, like T1070.001 for clearing logs.</p>
  <p><strong>Where you will meet this at work.</strong> A SOC analyst triages alerts about tampering. An incident responder looks for cleared logs during an investigation. A threat hunter searches for hidden files and fake names. A threat-intel analyst writes reports that name TA0005 techniques. A detection engineer builds alerts for tamper events. A red teamer uses the same map to show defenders what is possible. The tools are your SIEM, your EDR, Sysmon logs and the ATT&amp;CK website. The work products are detection rules, incident tickets and ATT&amp;CK coverage maps. The risk this tactic addresses is simple: if the attacker stays hidden, the attack grows.</p>
</div>

<div class="panel instr">
  <h2>How this exam works</h2>
  <ul>
    <li><strong>16 exercises. One severity: EASY.</strong> Each exercise tests <em>one</em> simple idea with a short scenario. You need <strong>70%</strong> to pass.</li>

    <li><strong>Exercise types:</strong> multiple choice, select-two, matching by drag and drop, ordering, fill in the blanks, log reading with a filter box, a fake terminal, and a small decision game.</li>
    <li><strong>Partial credit:</strong> exercises with several correct items are scored per item: <code>(H &minus; W) / N</code>. Right picks add, wrong picks take away. Selecting everything gives 0.</li>
    <li><strong>Check buys you time:</strong> when you press <em>Check</em>, the timer stops by itself. Read the feedback as long as you want. The timer restarts only when you press <em>Next</em>.</li>
    <li><strong>Pause:</strong> the Pause button is a manual break. It stops the timer and hides the exercise until you press Resume.</li>
    <li><strong>Skip:</strong> move on without answering. Before the end you get a screen to go back to skipped exercises. Skipped-and-never-answered exercises do not count in your score at all.</li>
    <li><strong>Hint:</strong> one hint per exercise. It costs 10% of that exercise&rsquo;s credit. On EASY the hint points straight at the idea.</li>
    <li><strong>Timer:</strong> 30 minutes in total for this tier.</li>
  </ul>
</div>

</div>

   question:"What is the main goal of Defense Evasion?",
   hint:"This tactic is about staying hidden. It is not about getting in or taking data out.",
   ix:{opts:[
      {id:"o1", h:"To avoid being seen by security tools"},
      {id:"o2", h:"To enter the network for the first time"},
      {id:"o3", h:"To steal passwords from computer memory"},
      {id:"o4", h:"To send stolen data to the internet"}],
     correct:["o1"]},
   explain:"<p>Defense Evasion has one goal: <strong>not being noticed</strong>. The matrix even says it on the tactic page: &ldquo;The adversary is trying to avoid being detected.&rdquo; Getting in for the first time is Initial Access (TA0001). Taking passwords is Credential Access (TA0006). Sending data out is Exfiltration (TA0010). Attackers clean logs, switch off tools and hide files so that the attack can continue without an alarm.</p>",
   study:"the definition of a tactic and the goal of TA0005."},

  {id:"E02", kind:"dnd",
   summary:"Matrix practice &mdash; four technique cards",
   scenario:`<p>You and a colleague look at a small part of the ATT&amp;CK matrix. You have four technique cards on the table. Place each card in the tactic column where it belongs.</p>
   <div class="art"><div class="art-l">Reminder &mdash; what each tactic means</div><div class="art-b"><pre class="code">Initial Access   : how the attacker gets in
Defense Evasion  : how the attacker stays hidden
Discovery        : how the attacker looks around
Impact           : how the attacker breaks or damages things</pre></div></div>`,
   question:"Place all four cards into the correct tactic zone.",
   hint:"Ask for each card: what is the attacker trying to do? Cleaning logs is about staying hidden &mdash; that is Defense Evasion.",
   ix:{zones:[
      {id:"z1", h:"Initial Access"},
      {id:"z2", h:"Defense Evasion (TA0005)"},
      {id:"z3", h:"Discovery"},
      {id:"z4", h:"Impact"}],
     items:[
      {id:"i1", h:"Phishing (T1566)", z:"z1"},
      {id:"i2", h:"Clear Windows Event Logs (T1070.001)", z:"z2"},
      {id:"i3", h:"Network Service Discovery (T1046)", z:"z3"},
      {id:"i4", h:"Data Encrypted for Impact (T1486)", z:"z4"}]},
   explain:"<p>Phishing is a way in &mdash; Initial Access. Clearing event logs removes traces &mdash; that is the heart of Defense Evasion (TA0005). Scanning the network to see what exists is Discovery. Encrypting files to cause damage is Impact. When you triage alerts, this same question &mdash; <em>what is the attacker trying to achieve?</em> &mdash; tells you which tactic column the alert belongs to.</p>",
   study:"reading the ATT&amp;CK matrix by tactic columns."},

  {id:"E03", kind:"qcm",
   summary:"Workstation PC-114 &mdash; one command line",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Sysmon Event ID 1 (process creation)</div><div class="art-b"><pre class="code">Time: 2026-09-29 02:14:07 UTC
Image:        C:\\Windows\\System32\\wevtutil.exe
CommandLine:  wevtutil cl Security
User:         CORP\\svc_backup</pre></div></div>
   <p>An alert shows one command that ran on workstation PC-114 at night. The attacker ran a real Windows tool with a short command.</p>`,
   question:"Which ATT&amp;CK technique does this command line show?",
   hint:"Look at the command: &ldquo;cl&rdquo; means clear, and &ldquo;Security&rdquo; is the name of a Windows event log.",
   ix:{opts:[
      {id:"o1", h:"Clear Windows Event Logs (T1070.001)"},
      {id:"o2", h:"Disable or Modify Tools (T1562.001)"},
      {id:"o3", h:"File Deletion (T1070.004)"},
      {id:"o4", h:"Hidden Files and Directories (T1564.001)"}],
     correct:["o1"]},
   explain:"<p><code>wevtutil cl Security</code> <strong>clears the Security event log</strong>. The tool is wevtutil and the sub-command <code>cl</code> means clear. Wiping a log is log tampering, so the technique is Clear Windows Event Logs (T1070.001). T1562.001 would stop or cripple a security <em>tool</em>. T1070.004 deletes <em>files</em>. T1564.001 sets the hidden flag on <em>files</em>. None of those match this command. A SOC analyst sees this pattern often &mdash; attackers clean logs right after doing something noisy.</p>",
   study:"log-clearing commands and the wevtutil tool."},

  {id:"E04", kind:"multi",
   summary:"Flashcards &mdash; two cards belong to TA0005",
   scenario:`<p>You are building flashcards for your SOC team. Each card names one ATT&amp;CK technique. Your lead asks you to pull out the cards that belong to the Defense Evasion tactic.</p>`,
   question:"Select the TWO techniques that belong to Defense Evasion (TA0005).",
   hint:"Two of the four are about hiding or blending in. The other two are about taking data out and guessing passwords.",
   ix:{opts:[
      {id:"o1", h:"Hide Artifacts (T1564)"},
      {id:"o2", h:"Process Injection (T1055)"},
      {id:"o3", h:"Exfiltration Over C2 Channel (T1041)"},
      {id:"o4", h:"Brute Force (T1110)"}],
     correct:["o1","o2"]},
   explain:"<p>Hide Artifacts (T1564) hides files, windows and users &mdash; Defense Evasion. Process Injection (T1055) hides code inside a normal-looking process &mdash; also Defense Evasion. Exfiltration Over C2 Channel (T1041) sends stolen data out &mdash; that is the Exfiltration tactic. Brute Force (T1110) guesses passwords &mdash; that is Credential Access. This matters in real triage: tagging alerts with the right tactic keeps the team&rsquo;s ATT&amp;CK heat map clean.</p>",
   study:"which technique families live under TA0005."},

  {id:"E05", kind:"fill",
   summary:"Report draft &mdash; a hidden file",
   scenario:`<p>You write your first incident note. Your lead already fixed the first half of the sentence for you. Finish the sentence with words from the bank.</p>`,
   question:"Fill all three blanks with words from the word bank.",
   hint:"The +h switch belongs to a small Windows command that changes file attributes.",
   ix:{segs:[
      "An attacker hides a file with the ",
      " command and the +h switch. In ATT&amp;CK the technique family is called ",
      ", and the exact sub-technique for the hidden flag is ",
      "."],
     slots:["attrib","Hide Artifacts","Hidden Files and Directories"],
     slotNames:["the command","the technique","the sub-technique"],
     bank:["attrib","certutil","Hide Artifacts","Hidden Files and Directories","File Deletion","Task Scheduling"]},
   explain:"<p><code>attrib +h file</code> sets the <em>hidden</em> attribute on a file, so normal folder views and some scanners skip it. ATT&amp;CK calls this Hide Artifacts (T1564), and the sub-technique Hidden Files and Directories (T1564.001) covers the hidden flag. <code>certutil</code> is a certificate tool that attackers abuse for decoding and downloads, not for hiding. File Deletion removes files; it does not hide them.</p>",
   study:"T1564.001 and the attrib command."},

  {id:"E06", kind:"term", slot:6,
   summary:"PC-114 &mdash; check the Defender service",
   scenario:`<p>You are the SOC analyst on shift. An alert says someone tried to change antivirus settings on workstation PC-114. Before anything else, you want to know if the Defender service is still running. You are in a normal Windows command prompt with admin rights.</p>`,
   question:"Type the command that shows the status of the WinDefend service.",
   hint:"The tool is sc and the safe action is query. Type the service name exactly as written.",
   ix:{prompt:"C:\\Users\\analyst>",
     syntax:`<strong>Syntax reminder</strong><br><code>sc &lt;action&gt; &lt;service name&gt;</code><br>
       <code>sc</code> is the Windows Service Control tool. The action <code>query</code> only <em>reads</em> the status &mdash; it changes nothing.
       <br>Example on a <em>different</em> service: <code>sc query EventLog</code>`,
     shape:`<strong>Expected output shape</strong><pre class="code">SERVICE_NAME: WinDefend
        TYPE               : 20  WIN32_SHARE_PROCESS
        STATE              : 4  RUNNING</pre>`,
     canon:"sc query WinDefend",
     elems:[{re:/^sc\b/, h:"sc &mdash; the Service Control tool"},
            {re:/\bquery\b/, h:"query &mdash; read the status, change nothing"},
            {re:/windefend/, h:"WinDefend &mdash; the Defender service name"}],
     forbidden:[{re:/\b(stop|config|delete)\b/, h:"stop / config / delete would change the service instead of reading it"}],
     out:["SERVICE_NAME: WinDefend","        TYPE               : 20  WIN32_SHARE_PROCESS","        STATE              : 4  RUNNING","        (STOPPABLE, NOT_PAUSABLE, ACCEPTS_SHUTDOWN)"]},
   explain:"<p><code>sc query WinDefend</code> prints the service state. On the <strong>defender</strong> side this is the fastest safe check after a tamper alert: is real-time protection still alive? On the <strong>attacker</strong> side the same tool is used in reverse with <code>sc config ... start= disabled</code> or <code>sc stop</code> &mdash; that is Impair Defenses (T1562.001). Notice the difference: <em>query</em> reads, <em>stop/config/delete</em> change. In an incident you always read first.</p>",
   study:"the sc tool and service tampering (T1562.001)."},

  {id:"E07", kind:"qcm",
   summary:"Event 1102 &mdash; a clean log",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; Windows Security event</div><div class="art-b"><pre class="code">EventID:        1102
Message:        The audit log was cleared.
SubjectUserName: adm_kfoss
Time:           2026-09-29 03:14:02 UTC</pre></div></div>`,
   question:"What does Windows Event ID 1102 tell you?",
   hint:"1102 belongs to the Security log itself. It appears when the log is wiped clean.",
   ix:{opts:[
      {id:"o1", h:"Someone cleared the Security event log"},
      {id:"o2", h:"A new service was installed on the host"},
      {id:"o3", h:"A scheduled task was created"},
      {id:"o4", h:"A user logged on with a smart card"}],
     correct:["o1"]},
   explain:"<p>Event 1102 fires <strong>in the Security log itself</strong> when that log is cleared. It is one of the most useful anti-evasion signals in Windows, because it survives the wipe: the attacker erases the log, and the wipe itself leaves this small event behind (on forwarded or central logs). Note the <code>SubjectUserName</code> &mdash; here an admin account cleared the log at 03:14. Service installs are event 7045, scheduled tasks 4698, and smart-card logons show up as 4624/4768. None of those say anything about a cleared log.</p>",
   study:"event 1102 as the anti-evidence signal of T1070.001."},

  {id:"E08", kind:"dnd",
   summary:"Match the move to the technique name",
   scenario:`<p>A threat-intel report describes four attacker moves in plain words. Your lead asks you to match each move to its ATT&amp;CK technique name before the morning briefing.</p>`,
   question:"Drag each behavior card onto the technique name that matches it.",
   hint:"Match what the action changes: the name, the protection, the shape of the code, or the leftovers.",
   ix:{zones:[
      {id:"z1", h:"Masquerading (T1036)"},
      {id:"z2", h:"Impair Defenses (T1562)"},
      {id:"z3", h:"Obfuscated Files or Information (T1027)"},
      {id:"z4", h:"Indicator Removal (T1070)"}],
     items:[
      {id:"i1", h:"Renames the malware to svchost.exe", z:"z1"},
      {id:"i2", h:"Turns off the antivirus with a PowerShell command", z:"z2"},
      {id:"i3", h:"Encodes the payload in Base64 to hide it", z:"z3"},
      {id:"i4", h:"Deletes the files it used after the attack", z:"z4"}]},
   explain:"<p>Rename the tool to look like Windows &mdash; Masquerading (T1036). Switch off protection &mdash; Impair Defenses (T1562). Wrap the code in Base64 so humans and simple tools cannot read it &mdash; Obfuscated Files or Information (T1027). Delete the leftovers &mdash; Indicator Removal (T1070). One trick to remember for interviews and briefings: <strong>masquerading changes the wrapper, obfuscation changes the content, indicator removal destroys the evidence, and impairing attacks your tools.</strong></p>",
   study:"the four classic TA0005 families: masquerade, impair, obfuscate, remove."},

  {id:"E09", kind:"qcm",
   summary:"Downloads folder &mdash; a strange attachment",
   scenario:`<div class="art"><div class="art-l">ARTEFACT 1 &mdash; file listing, C:\\Users\\jdoe\\Downloads</div><div class="art-b"><pre class="code">Q3_invoice.pdf.exe      2.1 MB   2026-09-28 14:02
Q3_report.pdf           1.4 MB   2026-09-28 09:31</pre></div></div>
   <p>A user double-clicked an email attachment named <strong>Q3_invoice.pdf.exe</strong>. Windows shows file extensions, and the user saw the name end in &ldquo;.pdf&rdquo;.</p>`,
   question:"Which technique makes a file like this look safe to a user?",
   hint:"The file pretends to be a PDF. The real type is .exe. Pretending is the key word.",
   ix:{opts:[
      {id:"o1", h:"Masquerading (T1036)"},
      {id:"o2", h:"Hide Artifacts (T1564)"},
      {id:"o3", h:"Indicator Removal (T1070)"},
      {id:"o4", h:"Obfuscated Files or Information (T1027)"}],
     correct:["o1"]},
   explain:"<p>The double extension <code>.pdf.exe</code> is a Masquerading trick (sub-technique T1036.007). Windows hides known extensions by default, so many users see only &ldquo;Q3_invoice.pdf&rdquo;. The file does not change its content (that would be T1027), does not hide from folder views (T1564), and does not remove old traces (T1070) &mdash; it simply wears a costume. Teaching users to show file extensions is a cheap control against exactly this move.</p>",
   study:"Masquerading sub-techniques, especially double file extension (T1036.007)."},

  {id:"E10", kind:"order",
   summary:"The story of an attack, in order",
   scenario:`<p>A trainer asks you to rebuild the story of a simple attack before the class continues. Put the tactic goals in the order they usually happen.</p>`,
   question:"Order all six steps from first to last.",
   hint:"Think of the story order: get in, keep a way back, hide, look around, gather, send out.",
   ix:{items:[
      {id:"i1", h:"Initial Access &mdash; the attacker gets in"},
      {id:"i2", h:"Persistence &mdash; the attacker keeps a way back in"},
      {id:"i3", h:"Defense Evasion &mdash; the attacker stays hidden"},
      {id:"i4", h:"Discovery &mdash; the attacker looks around"},
      {id:"i5", h:"Collection &mdash; the attacker gathers data"},
      {id:"i6", h:"Exfiltration &mdash; the attacker sends data out"}]},
   explain:"<p>This is the classic story order of the ATT&amp;CK matrix columns. In real incidents the steps mix and repeat &mdash; attackers often evade defenses all the way through, not just once. But for triage and reports, this order is the map most teams share. Defense Evasion sits in the middle: once the attacker has a foothold (Access + Persistence), staying hidden is what protects everything that follows.</p>",
   study:"where TA0005 sits in the attack lifecycle."},

  {id:"E11", kind:"multi",
   summary:"Hardening meeting &mdash; two good controls",
   scenario:`<p>Your team plans changes that make Defense Evasion harder. The whiteboard has four ideas. Your manager asks: which two of these actually slow an attacker down?</p>`,
   question:"Select the TWO ideas that make evasion harder for attackers.",
   hint:"Good controls keep protections on and limit powerful accounts. The other two remove your own defenses.",
   ix:{opts:[
      {id:"o1", h:"Keep Tamper Protection turned on for the antivirus"},
      {id:"o2", h:"Give admin rights only to people who need them"},
      {id:"o3", h:"Turn off event logs to save disk space"},
      {id:"o4", h:"Let every employee install any software they want"}],
     correct:["o1","o2"]},
   explain:"<p>Tamper Protection stops local changes to Defender, so a user-level attacker cannot switch off real-time protection &mdash; in ATT&amp;CK terms this is the Antivirus/Antimalware mitigation (M1049). Limited admin rights mean fewer people can run the powerful commands that disable tools &mdash; that is Privileged Account Management (M1026). The other two ideas work <em>for</em> the attacker: without logs the attacker leaves no trail, and open software installation makes masquerading easy.</p>",
   study:"mitigations that raise the cost of TA0005 (M1049, M1026, M1028)."},

  {id:"E12", kind:"term", slot:12,
   summary:"Triage &mdash; unhide a file for the scanner",
   scenario:`<p>During triage you find the file <code>C:\\Users\\analyst\\budget_q4.xlsm</code> with the Hidden attribute set. Your scanner skips hidden files, so it has not been scanned yet. You want to remove the hidden attribute so the scanner can read it. The file must stay exactly where it is.</p>`,
   question:"Type the command that removes the hidden attribute from that file.",
   hint:"The switch starts with a minus sign when you want to remove an attribute.",
   ix:{prompt:"C:\\Users\\analyst>",
     syntax:`<strong>Syntax reminder</strong><br><code>attrib &lt;+/-switch&gt; &lt;file&gt;</code><br>
       <code>attrib</code> changes file attributes. <code>+h</code> hides a file, <code>-h</code> shows it again.
       <br>Example on a <em>different</em> file: <code>attrib -h notes.txt</code>`,
     shape:`<strong>Expected output shape</strong><br>No message appears on success. If you run <code>attrib budget_q4.xlsm</code> afterwards, the H flag is gone.`,
     canon:"attrib -h budget_q4.xlsm",
     elems:[{re:/^attrib\b/, h:"attrib &mdash; the file attribute tool"},
            {re:/-h\b/, h:"-h &mdash; remove the hidden attribute"},
            {re:/budget_q4\.xlsm/, h:"budget_q4.xlsm &mdash; the exact target file"}],
     forbidden:[{re:/\+h\b/, h:"+h hides the file again &mdash; the opposite of the goal"}],
     out:["(no output &mdash; the attribute is removed)"]},
   explain:"<p>Hiding a file with <code>+h</code> is the attacker&rsquo;s move &mdash; Hidden Files and Directories (T1564.001). Removing it with <code>-h</code> is the defender&rsquo;s counter-move: now the scanner and your own eyes can see the file. It stays on disk, so nothing is destroyed. If you had typed <code>+h</code> you would have re-hidden the malware &mdash; the exact thing the attacker wanted. Small lesson, big habit: <strong>know which direction your switch points.</strong></p>",
   study:"file attributes and the defender side of T1564.001."},

  {id:"E13", kind:"qcm",
   summary:"PC-07 &mdash; three lines, one hiding move",
   scenario:`<div class="logpanel"><input class="logfilter" type="text" placeholder="Filter lines (e.g. attrib)" aria-label="Filter log lines"><div class="loglines">
<div class="logline">2026-09-29 02:10:11  Sysmon ID 1   attrib.exe +h toolkit.dll        Path: C:\\Users\\Public\\   User: CORP\\helpdesk_al</div>
<div class="logline">2026-09-29 02:10:40  Sysmon ID 1   notepad.exe C:\\notes.txt         Path: C:\\Windows\\System32\\</div>
<div class="logline">2026-09-29 02:11:02  Sysmon ID 3   chrome.exe -> hxxp://update[.]example.com   User: CORP\\helpdesk_al</div>
</div></div>
   <p>These are three lines from a Sysmon log on workstation PC-07. One line shows an attacker&rsquo;s hiding move. Use the filter box if you want to look closer.</p>`,
   question:"Which line shows the hiding move, and what is it called in ATT&CK?",
   hint:"The hiding move uses attrib with the +h switch.",
   ix:{opts:[
      {id:"o1", h:"Line 1 &mdash; Hidden Files and Directories (T1564.001)"},
      {id:"o2", h:"Line 2 &mdash; Hidden Files and Directories (T1564.001)"},
      {id:"o3", h:"Line 3 &mdash; Hidden Files and Directories (T1564.001)"},
      {id:"o4", h:"Line 1 &mdash; Obfuscated Files or Information (T1027)"}],
     correct:["o1"]},
   explain:"<p>Line 1 is the move: <code>attrib.exe +h toolkit.dll</code> sets the hidden attribute on a file &mdash; that is Hidden Files and Directories (T1564.001). Notepad opening a text file (line 2) is normal. Chrome reaching a web page (line 3) is normal network use &mdash; and the address is defanged here for safety. Obfuscation (T1027) would change the <em>content</em> of a file, like encoding it; nothing here is encoded. In a SOC you would filter the log for <code>attrib</code> in public folders &mdash; that is exactly what the filter box above does.</p>",
   study:"spotting attrib +h inside Sysmon Event ID 1."},

  {id:"E14", kind:"multi",
   summary:"Two moves that destroy evidence",
   scenario:`<p>Your lead wants a one-slide summary: which two of these attacker actions <em>remove evidence</em> of the attack? She will put them under the T1070 family on the slide.</p>`,
   question:"Select the TWO actions that remove evidence.",
   hint:"Removing evidence means wiping traces of what they did &mdash; think files and command history.",
   ix:{opts:[
      {id:"o1", h:"Delete the tools they uploaded (File Deletion, T1070.004)"},
      {id:"o2", h:"Clear the PowerShell command history (T1070.003)"},
      {id:"o3", h:"Open a fake website in the browser"},
      {id:"o4", h:"Print a document to the default printer"}],
     correct:["o1","o2"]},
   explain:"<p>Both correct cards belong to Indicator Removal (T1070): deleting the uploaded tools removes files an investigator would want, and clearing the command history removes the record of what was typed. Opening a browser page or printing a document may look odd, but neither destroys any trace of the attack. In real incidents these two moves are the reason responders prefer <strong>central log forwarding</strong> &mdash; what the attacker deletes on the host still exists in your SIEM.</p>",
   study:"the T1070 Indicator Removal family."},

  {id:"E15", kind:"branch",
   summary:"Night shift &mdash; protection switched off",
   scenario:`<p>It is 02:00. A monitoring alert appears: <strong>&ldquo;Real-time protection on PC-114 was switched off.&rdquo;</strong> No other alerts are open. You are the night-shift analyst. Take two simple decisions.</p>`,
   question:"Work through both steps of the decision game.",
   hint:"Ask who did it and why before you close anything.",
   ix:{steps:[
      {q:"Is a protection switch turning off at 02:00 a normal thing or a warning sign?",
       opts:[{id:"o1", h:"A warning sign that needs checking"},
             {id:"o2", h:"Protection turns off by itself at night"},
             {id:"o3", h:"Normal, but only on Mondays"}],
       correct:"o1"},
      {q:"What is your first simple action?",
       opts:[{id:"o4", h:"Tell the security team, then check who and what"},
             {id:"o5", h:"Turn protection back on and close the alert"},
             {id:"o6", h:"Delete the alert so nobody has to worry"}],
       correct:"o4"}]},
   explain:"<p>From the <strong>attacker</strong> view: switching off protection at night is a classic Impair Defenses move (T1562.001) &mdash; it opens a quiet window to work in. From the <strong>defender</strong> view: the first questions are always <em>who</em> and <em>what</em> &mdash; which account, which process, which command turned it off. Turning protection back on without checking just tells the attacker that you noticed; deleting the alert destroys your own evidence. Windows event 5007 records protection changes &mdash; that is where you look first.</p>",
   study:"T1562.001, Defender event 5007, and alert triage basics."},

  {id:"E16", kind:"fill",
   summary:"Report sentence &mdash; protection switched off",
   scenario:`<div class="logpanel"><input class="logfilter" type="text" placeholder="Filter lines" aria-label="Filter log lines"><div class="loglines">
<div class="logline">2026-09-30 02:41:55  Sysmon ID 1   powershell.exe -nop -w hidden -c "Set-MpPreference -DisableRealtimeMonitoring $true"</div>
<div class="logline">2026-09-30 02:42:10  Defender ID 5007   Real-time protection changed: Off</div>
</div></div>
   <p>Your lead started the report sentence for you. Finish it with words from the bank.</p>`,
   question:"Fill all three blanks with words from the word bank.",
   hint:"The command line starts with powershell.exe, and switching off a security tool is called impairing it.",
   ix:{segs:[
      "At 02:41 an attacker ran ",
      " to switch off Defender. ATT&amp;CK calls this family ",
      ", and the exact sub-technique for disabling a security tool is ",
      "."],
     slots:["PowerShell","Impair Defenses","Disable or Modify Tools"],
     slotNames:["the tool","the technique family","the sub-technique"],
     bank:["PowerShell","wevtutil","Impair Defenses","Disable or Modify Tools","File Deletion","Masquerading"]},
   explain:"<p><code>Set-MpPreference -DisableRealtimeMonitoring $true</code> is the textbook Impair Defenses command (T1562.001, Disable or Modify Tools). Defender itself writes event 5007 when protection settings change &mdash; a good alert source. One extra detail from the log line: <code>-w hidden</code> runs PowerShell in a hidden window, which is a small bonus trick (Hide Artifacts, T1564.003). <code>wevtutil</code> belongs to log clearing, not tool disabling &mdash; a common mix-up.</p>",
   study:"T1562.001 and the Defender 5007 tamper event."}
];

   site handshake and single-shot score reporting. */
(function () {
  "use strict";

  var CFG = CONFIG, INTROD = INTRO, EXS = EXERCISES;

  /* ---------- small helpers ---------- */
  function $id(i) { return document.getElementById(i); }
  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function fmtTime(s) { s = Math.max(0, s | 0); var m = (s / 60) | 0, r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function byId(id) { for (var i = 0; i < EXS.length; i++) if (EXS[i].id === id) return EXS[i]; return null; }
  function posOf(id) { for (var i = 0; i < S.order.length; i++) if (EXS[S.order[i]].id === id) return i; return -1; }

  /* Mandatory reusable scoring function: max(0, (H - W) / N) */
  function scoreExercise(selectedItems, correctItems) {
    var N = correctItems.length;
    if (!N) return 1;
    var corr = {}, i;
    for (i = 0; i < N; i++) corr[correctItems[i]] = true;
    var H = 0, W = 0;
    for (i = 0; i < N; i++) if (corr[correctItems[i]] && selectedItems.indexOf(correctItems[i]) !== -1) H++;
    for (i = 0; i < selectedItems.length; i++) if (!corr[selectedItems[i]]) W++;
    return Math.max(0, (H - W) / N);
  }

  /* ---------- lightweight syntax highlighter for logs / commands ---------- */
  var RXHL = /(&quot;[^&]*?&quot;)|([A-Za-z]:\\[^\s,&<]+)|(\b\d+(?:[.,]\d+)?\b)|(\/[A-Za-z:.0-9]+|-[A-Za-z]+[.\w]*|\$\w+)|(\b(?:wevtutil|certutil|sc|net|attrib|powershell|powershell\.exe|mshta|mshta\.exe|rundll32|rundll32\.exe|regsvr32|regsvr32\.exe|wmic|schtasks|reg|taskkill|vssadmin|sdelete|bcdedit|installutil|msbuild|Get-WinEvent|Get-MpComputerStatus|Get-MpPreference|Set-MpPreference|Add-MpPreference|Clear-EventLog|Stop-Service|Select-Object|Where-Object|Format-List|Export-Clixml|WinDefend|Security|System|Sysmon|Operationally)\b)/g;
  function hl(text) {
    var s = esc(text);
    return s.replace(RXHL, function (m, str, path, num, flag, kw) {
      if (str) return '<span class="tok-str">' + str + "</span>";
      if (path) return '<span class="tok-path">' + path + "</span>";
      if (num) return '<span class="tok-num">' + num + "</span>";
      if (flag) return '<span class="tok-flag">' + flag + "</span>";
      return '<span class="tok-kw">' + kw + "</span>";
    });
  }
  function bindLogFilters(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".logpanel"), function (p) {
      var inp = p.querySelector(".logfilter");
      if (!inp || inp.getAttribute("data-bound")) return;
      inp.setAttribute("data-bound", "1");
      inp.addEventListener("input", function () {
        var q = inp.value.toLowerCase();
        Array.prototype.forEach.call(p.querySelectorAll(".logline"), function (l) {
          var match = !q || l.textContent.toLowerCase().indexOf(q) !== -1;
          l.style.display = match ? "" : "none";
          if (q && match) l.classList.add("hit"); else l.classList.remove("hit");
        });
      });
    });
    /* One-time syntax highlighting of plain-text log lines (spec: the log
       viewer mimics Kibana/Splunk with highlighting + a filter box). */
    Array.prototype.forEach.call(root.querySelectorAll(".logline"), function (l) {
      if (l.getAttribute("data-hl")) return;
      l.setAttribute("data-hl", "1");
      l.innerHTML = hl(l.textContent);
    });
  }
  function highlightCodeIn(root) {
    var pres = root.querySelectorAll("pre.code");
    Array.prototype.forEach.call(pres, function (p) {
      var t = p.textContent;
      p.innerHTML = hl(t);
    });
  }

  /* ---------- global state ---------- */
  var S = {
    screen: "intro",          /* intro | exam | review | results */
    order: [], pos: 0,
    cur: null, reviewFlag: false,
    answered: {}, skipped: {},
    score: 0, answeredN: 0,
    hints: {},                /* exId -> {used, shown} */
    attempt: 0, reported: false,
    user: { username: "", country: "", theme: "", locale: "" },
    tm: { state: "IDLE", remaining: 0, iv: null, manualMs: 0, autoMs: 0, pauseStart: 0, prev: "RUNNING" },
    reduced: { left: 0, total: 0 }
  };

  /* ---------- timer state machine ----------
     States: IDLE, RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED.
     Check -> PAUSED_AUTO_CHECK (first action, before feedback renders).
     Next / Final Submit -> RUNNING or ENDED.
     Skip / Hint -> never change the state.
     Manual Pause on top of auto-pause -> PAUSED_MANUAL; Resume returns to PAUSED_AUTO_CHECK. */
  function setTimerState(st) {
    if (S.tm.state === st) return;
    var was = S.tm.state;
    /* Charge elapsed pause time to the state we are LEAVING, then re-arm the
       clock whenever a new pause segment starts (manual on top of auto-pause
       produces three correctly-attributed segments). */
    if (was === "PAUSED_MANUAL") S.tm.manualMs += Date.now() - S.tm.pauseStart;
    else if (was === "PAUSED_AUTO_CHECK") S.tm.autoMs += Date.now() - S.tm.pauseStart;
    if (st === "PAUSED_MANUAL" || st === "PAUSED_AUTO_CHECK") S.tm.pauseStart = Date.now();
    S.tm.state = st;
    renderTimer();
  }
  function tick() {
    if (S.tm.state !== "RUNNING") return;
    if (S.reduced.total > 0 && S.cur && S.cur.ex && S.cur.ex.ix && S.cur.ex.ix.reduced && !S.cur.graded) {
      S.reduced.left--;
      renderReduced();
      if (S.reduced.left <= 0) { onCheck(); return; }
    }
    S.tm.remaining--;
    if (S.tm.remaining <= 0) { S.tm.remaining = 0; renderTimer(); endByTimeout(); return; }
    renderTimer();
  }
  function startExamTimer() {
    S.tm.remaining = CFG.minutes * 60;
    setTimerState("RUNNING");
    if (!S.tm.iv) S.tm.iv = setInterval(tick, 1000);
  }
  function endByTimeout() {
    setTimerState("ENDED");
    showResults("Time ran out. Exercises you never answered are excluded from the score.");
  }

  /* ---------- play order (terminals stay on fixed, non-adjacent slots) ---------- */
  function buildOrder() {
    var n = EXS.length, order = new Array(n), free = [], i;
    for (i = 0; i < n; i++) free.push(i);
    var fixedIdx = [];
    EXS.forEach(function (ex, idx) {
      if (ex.slot) { order[ex.slot - 1] = idx; fixedIdx.push(idx); }
    });
    free = free.filter(function (p) { return order[p] === undefined; });
    var rest = shuffle(EXS.map(function (e, idx) { return idx; }).filter(function (idx) { return fixedIdx.indexOf(idx) === -1; }));
    var spots = shuffle(free);
    for (i = 0; i < rest.length; i++) order[spots[i]] = rest[i];
    S.order = order;
  }

  /* ---------- score display ---------- */
  function renderScore() {
    var el = $id("h-score");
    if (!el) return;
    var pct = S.answeredN ? Math.round((S.score / S.answeredN) * 100) : 0;
    el.innerHTML = '<span class="hlab">Score</span> <strong>' + (Math.round(S.score * 10) / 10).toFixed(1) + " / " + S.answeredN + "</strong> <span class='dim'>(" + pct + "%)</span>";
  }
  function renderTimer() {
    var el = $id("h-timer");
    if (!el) return;
    var t = fmtTime(S.tm.remaining), cls = "timerbox", txt = "";
    if (S.tm.state === "RUNNING") { cls += " state-run"; txt = "&#9654; Running &mdash; " + t; }
    else if (S.tm.state === "PAUSED_MANUAL") { cls += " state-manual"; txt = "&#9208; Paused &mdash; manual (press Resume)"; }
    else if (S.tm.state === "PAUSED_AUTO_CHECK") { cls += " state-auto"; txt = "&#9208; Paused &mdash; reviewing feedback (resumes on Next)"; }
    else if (S.tm.state === "ENDED") { cls += " state-ended"; txt = "&#9633; Ended"; }
    else { cls += " state-run"; txt = "&#9654; " + t; }
    el.className = cls;
    el.innerHTML = txt;
  }
  function renderReduced() {
    var el = $id("reduced-timer");
    if (!el) return;
    el.innerHTML = "&#9201; Terminal time left in this exercise: <strong>" + fmtTime(S.reduced.left) + "</strong> (of " + fmtTime(S.reduced.total) + "). When it reaches 0 the exercise is graded as it stands.";
  }

  /* ---------- header ---------- */
  function makeHeader() {
    var hd = h("header", "exhdr");
    hd.id = "exhdr";
    hd.innerHTML =
      '<div class="hgrp"><span class="hlab">Exercise</span> <strong id="h-count"></strong></div>' +
      '<div class="hgrp"><span class="badge sev-' + CFG.sevClass + '">' + CFG.sevIcon + " " + CFG.sevName + "</span></div>" +
      '<div class="hgrp"><span id="h-timer" class="timerbox state-run" aria-live="polite"></span></div>' +
      '<div class="hgrp" id="h-score"></div>' +
      '<div class="hgrp hbtns">' +
      '<button type="button" class="btn ghost" id="b-hint">Hint (&minus;10%)</button>' +
      '<button type="button" class="btn ghost" id="b-pause">Pause</button>' +
      '<button type="button" class="btn ghost" id="b-skip">Skip</button>' +
      '<button type="button" class="btn ghost" id="b-finish">Finish</button>' +
      "</div>";
    hd.querySelector("#b-hint").addEventListener("click", onHint);
    hd.querySelector("#b-pause").addEventListener("click", onPause);
    hd.querySelector("#b-skip").addEventListener("click", onSkip);
    hd.querySelector("#b-finish").addEventListener("click", onFinishButton);
    return hd;
  }
  function updateHeader() {
    var c = $id("h-count");
    if (c && S.cur) c.textContent = (S.pos + 1) + " of " + S.order.length;
    var skip = $id("b-skip"), hint = $id("b-hint");
    if (skip) skip.disabled = !!(S.cur && S.cur.graded);
    if (hint) {
      var used = S.cur && S.hints[S.cur.ex.id] && S.hints[S.cur.ex.id].used;
      hint.disabled = !!used || !!(S.cur && S.cur.graded);
    }
  }

  /* ---------- intro ---------- */
  function renderIntro() {
    S.screen = "intro";
    var root = $id("app");
    root.innerHTML = "";
    var wrap = h("div", "intro");
    wrap.innerHTML = INTROD.html;
    var bar = h("div", "startbar");
    var btn = h("button", "btn primary big");
    btn.id = "start-btn"; btn.type = "button";
    btn.textContent = "Start the exam";
    btn.addEventListener("click", startExam);
    bar.appendChild(btn);
    wrap.appendChild(bar);
    root.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  function startExam() {
    S.attempt++; S.reported = false;
    S.answered = {}; S.skipped = {};
    S.score = 0; S.answeredN = 0; S.hints = {};
    S.pos = 0; S.reviewFlag = false; S.cur = null;
    S.reduced = { left: 0, total: 0 };
    S.tm.manualMs = 0; S.tm.autoMs = 0;
    if (S.tm.iv) { clearInterval(S.tm.iv); S.tm.iv = null; }
    S.tm.state = "IDLE";
    buildOrder();
    S.screen = "exam";
    startExamTimer();
    renderExamFrame();
    renderCurrent();
  }

  /* ---------- exam frame ---------- */
  function renderExamFrame() {
    var root = $id("app");
    root.innerHTML = "";
    root.appendChild(makeHeader());
    var main = h("div");
    main.id = "exam-main";
    root.appendChild(main);
  }

  function renderCurrent() {
    var main = $id("exam-main");
    main.innerHTML = "";
    var exIdx = S.order[S.pos];
    var ex = EXS[exIdx];
    var fromReview = S.reviewFlag;
    S.reviewFlag = false;
    S.cur = { ex: ex, idx: exIdx, graded: false, credit: 0, items: null, answerHtml: "", fromReview: fromReview, widget: null };
    if (!S.hints[ex.id]) S.hints[ex.id] = { used: false, shown: false };
    S.reduced = ex.ix.reduced ? { left: ex.ix.reduced, total: ex.ix.reduced } : { left: 0, total: 0 };

    var card = h("div", "excard");

    /* SCENARIO block (collapsible) */
    var sc = h("section", "blk blk-scenario");
    var scHead = h("div", "blk-h");
    scHead.innerHTML = '<span class="bicon" aria-hidden="true">&#9636;</span> SCENARIO';
    var caret = h("button", "minicaret");
    caret.type = "button";
    caret.setAttribute("aria-expanded", "true");
    caret.innerHTML = "&#9662; hide scenario";
    scHead.appendChild(caret);
    var sum = h("button", "sumline");
    sum.type = "button";
    sum.setAttribute("aria-expanded", "true");
    sum.innerHTML = '<span class="sumtxt">' + ex.summary + '</span><span class="caret">&#9662; collapse</span>';
    var scbody = h("div", "blk-body");
    scbody.innerHTML = ex.scenario;
    function setScenarioOpen(open) {
      scbody.style.display = open ? "" : "none";
      caret.setAttribute("aria-expanded", String(open));
      caret.innerHTML = open ? "&#9662; hide scenario" : "&#9656; show scenario";
      sum.style.display = open ? "none" : "";
    }
