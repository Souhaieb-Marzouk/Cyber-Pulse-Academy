/* ===== TA0040 exam engine — exercise types, grading, navigation ===== */

var RENDERS={},GRADERS={};

/* ---------- QCM (single + multi) ---------- */
RENDERS.qcm=function(ex,ans,rt){
  rt.sel=rt.sel||[];
  ans.innerHTML=ex._opts.map(function(o,i){
    var lab=String.fromCharCode(65+i);
    var on=rt.sel.indexOf(o.id)>=0;
    return '<button type="button" class="opt'+(on?' sel':'')+'" data-oid="'+o.id+'" role="'+(ex.multi?'checkbox':'radio')+'" aria-checked="'+on+'">'
      +'<span class="olab">'+lab+'.</span><span class="otext">'+o.text+'</span><span class="omark">'+(on?'☑':'○')+'</span></button>';
  }).join('')+(ex.multi?'<p class="minihint">Select all that apply. Wrong picks subtract from correct picks (partial credit).</p>':'');
  qsa('.opt',ans).forEach(function(b){
    b.addEventListener('click',function(){
      if(rt.locked){return;}
      var id=b.getAttribute('data-oid');
      if(ex.multi){
        var i=rt.sel.indexOf(id);
        if(i>=0){rt.sel.splice(i,1);}else{rt.sel.push(id);}
      }else{rt.sel=[id];}
      qsa('.opt',ans).forEach(function(o){
        var on=rt.sel.indexOf(o.getAttribute('data-oid'))>=0;
        o.classList.toggle('sel',on);
        o.setAttribute('aria-checked',on?'true':'false');
        qs('.omark',o).textContent=on?'☑':'○';
      });
    });
  });
};
GRADERS.qcm=function(ex,rt){
  var g=scoreExercise(rt.sel,ex.correct);
  var nameOf=function(id){var o=ex.options.filter(function(x){return x.id===id;})[0];return o?stripTags(o.text):id;};
  var items=[];
  ex.correct.forEach(function(c){
    var st=rt.sel.indexOf(c)>=0?'ok':'miss';
    items.push({st:st,t:stripTags(nameOf(c)),note:st==='miss'?'this was part of the correct answer':''});
  });
  rt.sel.forEach(function(s){
    if(ex.correct.indexOf(s)<0){items.push({st:'bad',t:stripTags(nameOf(s)),note:'not correct in this scenario'});}
  });
  return {sel:rt.sel,correct:ex.correct,items:items,sc:g};
};
function stripTags(s){var d=document.createElement('div');d.innerHTML=s;return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();}

/* ---------- drag & drop ---------- */
RENDERS.dragdrop=function(ex,ans,rt){
  rt.place=rt.place||{};rt.picked=rt.picked||null;
  var bank=ex._chips.filter(function(c){return !rt.place[c.id];});
  var html='<p class="minihint">Tap a card to pick it up, then tap a box to drop it. You can also drag and drop with a mouse. Tap a placed card to send it back.</p>'
    +'<div class="banklabel">Cards</div><div class="bank" id="ddBank">'
    +bank.map(function(c){return '<button type="button" class="chip'+(rt.picked===c.id?' picked':'')+'" draggable="true" data-cid="'+c.id+'">'+c.text+'</button>';}).join('')
    +'</div><div class="zones">'+ex.zones.map(function(z){
      var inside=ex._chips.filter(function(c){return rt.place[c.id]===z.id;});
      return '<div class="zone" data-zid="'+z.id+'"><div class="zonelabel">'+esc(z.label)+'</div>'
        +inside.map(function(c){return '<button type="button" class="chip" data-cid="'+c.id+'">'+c.text+'</button>';}).join('')+'</div>';
    }).join('')+'</div>';
  ans.innerHTML=html;
  function place(cid,zid){
    if(rt.locked){return;}
    if(zid===null){delete rt.place[cid];}else{rt.place[cid]=zid;}
    rt.picked=null;RENDERS.dragdrop(ex,ans,rt);
  }
  qsa('#ddBank .chip',ans).forEach(function(ch){
    ch.addEventListener('click',function(){if(rt.locked){return;}rt.picked=(rt.picked===ch.getAttribute('data-cid'))?null:ch.getAttribute('data-cid');RENDERS.dragdrop(ex,ans,rt);});
    ch.addEventListener('dragstart',function(ev){rt.picked=ch.getAttribute('data-cid');try{ev.dataTransfer.setData('text/plain',rt.picked);}catch(e){}});
  });
  qsa('.zone',ans).forEach(function(z){
    z.addEventListener('click',function(ev){
      if(ev.target.closest('.chip')){return;}
      if(rt.picked){place(rt.picked,z.getAttribute('data-zid'));}
    });
    z.addEventListener('dragover',function(ev){ev.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    z.addEventListener('drop',function(ev){ev.preventDefault();z.classList.remove('over');if(rt.picked){place(rt.picked,z.getAttribute('data-zid'));}});
  });
  qsa('.zone .chip',ans).forEach(function(ch){
    ch.addEventListener('click',function(){place(ch.getAttribute('data-cid'),null);});
  });
};
GRADERS.dragdrop=function(ex,rt){
  var sel=[],corr=[];
  var nameOf=function(id){var c=ex.chips.filter(function(x){return x.id===id;})[0];return c?stripTags(c.text):id;};
  var zName=function(id){var z=ex.zones.filter(function(x){return x.id===id;})[0];return z?z.label:id;};
  var items=[];
  ex._chips.forEach(function(c){
    var p=rt.place[c.id];
    var right=ex.correct[c.id];
    if(right===undefined||right===null){
      /* bank-resident card: leaving it in the bank is correct; placing it anywhere is a wrong pick */
      if(p){sel.push(p+'|'+c.id);items.push({st:'bad',t:nameOf(c.id)+' → '+zName(p),note:'this card belongs in the bank — it covers none of the boxes'});}
      else{items.push({st:'ok',t:nameOf(c.id),note:'correctly left in the bank'});}
      return;
    }
    corr.push(right+'|'+c.id);
    if(p){sel.push(p+'|'+c.id);}
    if(p===right){items.push({st:'ok',t:nameOf(c.id)+' → '+zName(right)});}
    else if(p){items.push({st:'bad',t:nameOf(c.id)+' → '+zName(p),note:'belongs in “'+zName(right)+'”'});}
    else{items.push({st:'miss',t:nameOf(c.id),note:'not placed — belongs in “'+zName(right)+'”'});}
  });
  var g=scoreExercise(sel,corr);
  return {sel:sel,correct:corr,items:items,sc:g};
};

/* ---------- matching ---------- */
RENDERS.match=function(ex,ans,rt){
  rt.pairs=rt.pairs||{};rt.selL=rt.selL||null;
  var usedR=Object.keys(rt.pairs).map(function(k){return rt.pairs[k];});
  var num={};var n=1;
  Object.keys(rt.pairs).forEach(function(l){num[l]=n++;});
  ans.innerHTML='<p class="minihint">Tap an item on the left, then tap its partner on the right. Tap a paired card to undo the pair.</p>'
    +'<div class="cols"><div>'+ex.left.map(function(l){
      var pr=rt.pairs[l.id];
      return '<button type="button" class="mrow'+((rt.selL===l.id)?' selL':(pr?' paired':''))+'" data-lid="'+l.id+'">'
        +(pr?'<span class="pairnum">'+num[l.id]+'</span>':'')+'<span class="otext">'+l.text+'</span></button>';
    }).join('')+'</div><div>'+ex._right.map(function(r){
      var owner=null;Object.keys(rt.pairs).forEach(function(l){if(rt.pairs[l]===r.id){owner=l;}});
      return '<button type="button" class="mrow'+(owner?' paired':'')+'" data-rid="'+r.id+'">'
        +(owner?'<span class="pairnum">'+num[owner]+'</span>':'')+'<span class="otext">'+r.text+'</span></button>';
    }).join('')+'</div></div>';
  qsa('.mrow[data-lid]',ans).forEach(function(b){
    b.addEventListener('click',function(){
      if(rt.locked){return;}
      var id=b.getAttribute('data-lid');
      if(rt.pairs[id]){delete rt.pairs[id];rt.selL=null;}
      else{rt.selL=id;}
      RENDERS.match(ex,ans,rt);
    });
  });
  qsa('.mrow[data-rid]',ans).forEach(function(b){
    b.addEventListener('click',function(){
      if(rt.locked){return;}
      var rid=b.getAttribute('data-rid');
      if(!rt.selL){return;}
      Object.keys(rt.pairs).forEach(function(l){if(rt.pairs[l]===rid){delete rt.pairs[l];}});
      rt.pairs[rt.selL]=rid;rt.selL=null;
      RENDERS.match(ex,ans,rt);
    });
  });
};
GRADERS.match=function(ex,rt){
  var sel=[],corr=[],items=[];
  var lname=function(id){var l=ex.left.filter(function(x){return x.id===id;})[0];return l?stripTags(l.text):id;};
  var rname=function(id){var r=ex.right.filter(function(x){return x.id===id;})[0];return r?stripTags(r.text):id;};
  ex.left.forEach(function(l){
    var right=ex.pairs[l.id];corr.push(l.id+'|'+right);
    var p=rt.pairs[l.id];
    if(p){sel.push(l.id+'|'+p);}
    if(p===right){items.push({st:'ok',t:lname(l.id)+' → '+rname(right)});}
    else if(p){items.push({st:'bad',t:lname(l.id)+' → '+rname(p),note:'correct partner: '+rname(right)});}
    else{items.push({st:'miss',t:lname(l.id),note:'correct partner: '+rname(right)});}
  });
  var g=scoreExercise(sel,corr);
  return {sel:sel,correct:corr,items:items,sc:g};
};

/* ---------- ordering / ranking ---------- */
RENDERS.order=function(ex,ans,rt){
  rt.order=rt.order||ex._items.map(function(i){return i.id;});
  ans.innerHTML='<p class="minihint">Use the arrows to move items (or drag them) so the list is in the right order. Position 1 is first.</p>'
    +rt.order.map(function(id,i){
      var it=ex.items.filter(function(x){return x.id===id;})[0];
      return '<div class="ordrow" draggable="true" data-iid="'+id+'"><span class="posb">'+(i+1)+'</span><span class="otext">'+it.text+'</span>'
        +'<span class="ordbtns"><button type="button" data-mv="up" aria-label="Move up">↑</button><button type="button" data-mv="down" aria-label="Move down">↓</button></span></div>';
    }).join('');
  var rows=qsa('.ordrow',ans);
  rows.forEach(function(r){
    r.addEventListener('dragstart',function(ev){if(rt.locked){ev.preventDefault();return;}rt._drag=rt.order.indexOf(r.getAttribute('data-iid'));r.classList.add('dragging');});
    r.addEventListener('dragend',function(){r.classList.remove('dragging');});
    r.addEventListener('dragover',function(ev){
      if(rt.locked){return;}
      ev.preventDefault();
      var to=rt.order.indexOf(r.getAttribute('data-iid'));
      if(rt._drag===null||rt._drag===undefined||to===rt._drag){return;}
      var arr=rt.order;var item=arr.splice(rt._drag,1)[0];arr.splice(to,0,item);rt._drag=to;
      RENDERS.order(ex,ans,rt);
    });
  });
  qsa('.ordbtns button',ans).forEach(function(b){
    b.addEventListener('click',function(){
      if(rt.locked){return;}
      var row=b.closest('.ordrow');var i=rt.order.indexOf(row.getAttribute('data-iid'));
      var mv=b.getAttribute('data-mv');
      if(mv==='up'&&i>0){var t=rt.order[i-1];rt.order[i-1]=rt.order[i];rt.order[i]=t;}
      if(mv==='down'&&i<rt.order.length-1){var t2=rt.order[i+1];rt.order[i+1]=rt.order[i];rt.order[i]=t2;}
      RENDERS.order(ex,ans,rt);
    });
  });
};
GRADERS.order=function(ex,rt){
  var sel=[],corr=[],items=[];
  var nameOf=function(id){var it=ex.items.filter(function(x){return x.id===id;})[0];return it?stripTags(it.text):id;};
  rt.order.forEach(function(id,pos){
    sel.push(pos+'|'+id);corr.push(pos+'|'+ex.correctOrder[pos]);
    if(id===ex.correctOrder[pos]){items.push({st:'ok',t:'Position '+(pos+1)+': '+nameOf(id)});}
    else{items.push({st:'bad',t:'Position '+(pos+1)+': '+nameOf(id),note:'correct here: '+nameOf(ex.correctOrder[pos])});}
  });
  var g=scoreExercise(sel,corr);
  return {sel:sel,correct:corr,items:items,sc:g};
};

/* ---------- fill in the blanks ---------- */
RENDERS.fill=function(ex,ans,rt){
  rt.fill=rt.fill||{};rt.pick=rt.pick||null;
  var txt=ex.text.replace(/\[\[(\d+)\]\]/g,function(m,n){
    var cid=rt.fill[n];
    var chip=cid?ex.bank.filter(function(b){return b.id===cid;})[0]:null;
    return '<button type="button" class="blank'+(cid?' filled':'')+'" data-b="'+n+'">'+(chip?chip.text:'___ '+n+' ___')+'</button>';
  });
  var bank=ex._bank.filter(function(b){
    return Object.keys(rt.fill).every(function(k){return rt.fill[k]!==b.id;});
  });
  ans.innerHTML='<p class="minihint">Tap a word to pick it, then tap a gap to fill it. Tap a filled gap to give the word back.</p>'
    +'<div style="font-size:16px;line-height:2.1">'+txt+'</div>'
    +'<div class="banklabel">Word bank</div><div class="bank">'
    +bank.map(function(b){return '<button type="button" class="chip'+(rt.pick===b.id?' picked':'')+'" data-bid="'+b.id+'">'+b.text+'</button>';}).join('')
    +'</div>';
  qsa('.chip',ans).forEach(function(c){
    c.addEventListener('click',function(){if(rt.locked){return;}rt.pick=(rt.pick===c.getAttribute('data-bid'))?null:c.getAttribute('data-bid');
      qsa('.chip',ans).forEach(function(x){x.classList.toggle('picked',x.getAttribute('data-bid')===rt.pick);});});
  });
  qsa('.blank',ans).forEach(function(bl){
    bl.addEventListener('click',function(){
      if(rt.locked){return;}
      var n=bl.getAttribute('data-b');
      if(rt.fill[n]){delete rt.fill[n];}
      else if(rt.pick){rt.fill[n]=rt.pick;rt.pick=null;}
      RENDERS.fill(ex,ans,rt);
    });
  });
};
GRADERS.fill=function(ex,rt){
  var sel=[],corr=[],items=[];
  var bname=function(id){var b=ex.bank.filter(function(x){return x.id===id;})[0];return b?b.text:'(empty)';};
  Object.keys(ex.correct).forEach(function(n){
    var right=ex.correct[n];corr.push(n+'|'+right);
    var f=rt.fill[n];
    if(f){sel.push(n+'|'+f);}
    if(f===right){items.push({st:'ok',t:'Gap '+n+': '+bname(right)});}
    else if(f){items.push({st:'bad',t:'Gap '+n+': '+bname(f),note:'correct word: '+bname(right)});}
    else{items.push({st:'miss',t:'Gap '+n,note:'correct word: '+bname(right)});}
  });
  var g=scoreExercise(sel,corr);
  return {sel:sel,correct:corr,items:items,sc:g};
};

/* ---------- spot the mistake ---------- */
RENDERS.spot=function(ex,ans,rt){
  rt.marks=rt.marks||[];
  ans.innerHTML='<p class="minihint">Tap every line you believe is wrong. Tap again to unmark. Then press Check.</p>'
    +'<div class="code" style="white-space:normal">'+ex.lines.map(function(l,i){
      var m=rt.marks.indexOf(i)>=0;
      return '<div class="logline'+(m?' marked':'')+'" style="cursor:pointer" data-li="'+i+'">'+(m?'✗ ':'&nbsp;&nbsp;')+esc(l)+'</div>';
    }).join('')+'</div>';
  qsa('.logline[data-li]',ans).forEach(function(l){
    l.addEventListener('click',function(){
      if(rt.locked){return;}
      var i=parseInt(l.getAttribute('data-li'),10);
      var p=rt.marks.indexOf(i);
      if(p>=0){rt.marks.splice(p,1);}else{rt.marks.push(i);}
      RENDERS.spot(ex,ans,rt);
    });
  });
  if(rt.locked){qsa('.logline[data-li]',ans).forEach(function(l){l.style.cursor='default';});}
};
GRADERS.spot=function(ex,rt){
  var sel=rt.marks.map(function(i){return 'L'+i;});
  var corr=ex.correctLines.map(function(i){return 'L'+i;});
  var items=[];
  ex.correctLines.forEach(function(i){
    items.push({st:rt.marks.indexOf(i)>=0?'ok':'miss',t:'Line '+(i+1),note:rt.marks.indexOf(i)>=0?'':'this line holds the mistake'});
  });
  rt.marks.forEach(function(i){
    if(ex.correctLines.indexOf(i)<0){items.push({st:'bad',t:'Line '+(i+1),note:'this line is correct'});}
  });
  var g=scoreExercise(sel,corr);
  return {sel:sel,correct:corr,items:items,sc:g};
};

/* ---------- branching decision tree ---------- */
RENDERS.branch=function(ex,ans,rt){
  rt.step=rt.step||0;rt.choices=rt.choices||[];
  var done=rt.step>=ex.steps.length;
  var html='';
  if(!done){
    var st=ex.steps[rt.step];
    html+='<span class="stepbadge">STEP '+(rt.step+1)+' OF '+ex.steps.length+'</span>'
      +'<div>'+st.context+'</div>'
      +'<p class="qtext" style="margin-top:8px"><strong>'+st.question+'</strong></p>'
      +st._opts.map(function(o,i){
        var lab=String.fromCharCode(65+i);
        var on=rt.choices[rt.step]===o.id;
        return '<button type="button" class="opt'+(on?' sel':'')+'" data-oid="'+o.id+'"><span class="olab">'+lab+'.</span><span class="otext">'+o.text+'</span><span class="omark">'+(on?'◉':'○')+'</span></button>';
      }).join('')
      +'<div class="actionrow"><button class="btn" id="stepConfirm" disabled>Confirm this step ▶</button>'
      +(rt.step>0?'<button class="btn" id="stepBack">◀ Back</button>':'')
      +'<span class="minihint">Confirming a step does not stop the timer. The timer stops only on the final Check.</span></div>';
  }else{
    html+='<p class="minihint">All steps are answered. Press <strong>Check</strong> below to grade every step at once (partial credit).</p>'
      +ex.steps.map(function(s,i){
        var o=s.options.filter(function(x){return x.id===rt.choices[i];})[0];
        return '<div class="fi"><span class="fst">Step '+(i+1)+'</span><span>'+(o?stripTags(o.text):'(no answer)')+'</span></div>';
      }).join('');
  }
  ans.innerHTML=html;
  if(!done){
    var opts=qsa('.opt',ans);
    opts.forEach(function(b){
      b.addEventListener('click',function(){
        if(rt.locked){return;}
        rt.choices[rt.step]=b.getAttribute('data-oid');
        opts.forEach(function(o){o.classList.toggle('sel',o.getAttribute('data-oid')===rt.choices[rt.step]);
          qs('.omark',o).textContent=(o.getAttribute('data-oid')===rt.choices[rt.step])?'◉':'○';});
        var cb=qs('#stepConfirm');if(cb){cb.disabled=false;}
      });
    });
    var cb=qs('#stepConfirm');
    if(cb){cb.addEventListener('click',function(){if(rt.locked){return;}if(rt.choices[rt.step]===undefined){return;}rt.step++;RENDERS.branch(ex,ans,rt);});}
    var bk=qs('#stepBack');
    if(bk){bk.addEventListener('click',function(){if(rt.locked){return;}if(rt.step>0){rt.step--;RENDERS.branch(ex,ans,rt);}});}
  }
};
GRADERS.branch=function(ex,rt){
  var sel=[],corr=[],items=[];
  var optName=function(st,id){var o=st.options.filter(function(x){return x.id===id;})[0];return o?stripTags(o.text):'(no answer)';};
  ex.steps.forEach(function(st,i){
    var c=rt.choices[i];
    corr.push(i+'|'+st.correct);
    if(c!==undefined){sel.push(i+'|'+c);}
    if(c===st.correct){items.push({st:'ok',t:'Step '+(i+1)+': '+optName(st,c)});}
    else if(c!==undefined){items.push({st:'bad',t:'Step '+(i+1)+': '+optName(st,c),note:'better: '+optName(st,st.correct)});}
    else{items.push({st:'miss',t:'Step '+(i+1),note:'better: '+optName(st,st.correct)});}
  });
  var g=scoreExercise(sel,corr);
  return {sel:sel,correct:corr,items:items,sc:g};
};

/* ---------- SOC alert queue simulation ---------- */
RENDERS.sim=function(ex,ans,rt){
  rt.vals=rt.vals||{};
  ans.innerHTML='<p class="minihint">Choose one action for every alert, then press Check. Wrong choices subtract from correct ones.</p>'
    +ex._rows.map(function(r,i){
      return '<div class="simrow"><div><strong>'+esc(r.alert)+'</strong></div><div class="simdetail">'+r.detail+'</div>'
        +'<div class="selrow"><label class="mini actionlabel" for="sim_'+i+'">Action</label>'
        +'<select class="selctl" id="sim_'+i+'" data-rid="'+r.id+'"'+(rt.locked?' disabled':'')+'><option value="">— choose an action —</option>'
        +r.actions.map(function(a){return '<option value="'+esc(a)+'"'+(rt.vals[r.id]===a?' selected':'')+'>'+esc(a)+'</option>';}).join('')
        +'</select></div></div>';
    }).join('');
  qsa('.selctl',ans).forEach(function(s){
    s.addEventListener('change',function(){if(rt.locked){return;}rt.vals[s.getAttribute('data-rid')]=s.value;});
  });
};
GRADERS.sim=function(ex,rt){
  var sel=[],corr=[],items=[];
  ex._rows.forEach(function(r){
    corr.push(r.id+'|'+r.correct);
    var v=rt.vals[r.id];
    if(v){sel.push(r.id+'|'+v);}
    if(v===r.correct){items.push({st:'ok',t:r.alert+' → '+r.correct});}
    else if(v){items.push({st:'bad',t:r.alert+' → '+v,note:'better: '+r.correct});}
    else{items.push({st:'miss',t:r.alert,note:'better: '+r.correct});}
  });
  var g=scoreExercise(sel,corr);
  return {sel:sel,correct:corr,items:items,sc:g};
};

/* ---------- terminal emulator ---------- */
function normCmd(s){
  return String(s).toLowerCase().replace(/["']/g,'').replace(/\s+/g,' ').trim().replace(/\s*\|\s*/g,' | ').replace(/[.]$/,'');
}
RENDERS.terminal=function(ex,ans,rt){
  rt.lines=rt.lines||[ex.shell.welcome];
  rt.typed=rt.typed||'';
  var expired=ex.softTimer&&(ex._softLeft===0);
  var shellClosed=rt.locked||expired;
  ans.innerHTML='<p class="minihint">Type the command in the fake shell and press Enter. Then press Check to grade it. Nothing real is executed — this is a safe simulation.</p>'
    +(ex.softTimer?'<p class="minihint">⏱ This exercise has a reduced soft timer: <span id="softclock" class="softclock">'+fmt(ex._softLeft||ex.softTimer)+'</span>. <span id="softmsg" class="hidden"></span></p>':'')
    +(rt.locked?'<p class="minihint">🔒 Graded — the shell is read-only now.</p>':'')
    +(expired&&!rt.locked?'<p id="softmsg" class="minihint">⏱ <strong>Exercise time is over.</strong> You may still press Check with what you have typed, or press Skip to move on.</p>':'')
    +'<div class="term"><div class="tscroll" id="tscroll">'+rt.lines.map(function(l){return '<div>'+esc(l)+'</div>';}).join('')+'</div>'
    +'<div class="tinputrow"><span class="tprompt">'+esc(ex.shell.prompt)+'</span>'
    +'<input class="tinput" id="tinput" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command" value="'+esc(rt.typed)+'"'+(shellClosed?' disabled':'')+'></div></div>';
  var inp=qs('#tinput',ans);
  inp.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'){
      if(rt.locked||expired){return;}
      var raw=inp.value;rt.typed=raw;
      inp.value='';
      rt.lines.push(ex.shell.prompt+' '+raw);
      var n=normCmd(raw);
      if(n!==''){
        var toks=n.split(' ');
        var sets=ex.elementSets||[ex.elements];
        var best=null;
        sets.forEach(function(els){var res=evalElements(toks,els,ex.extraOk||[]);if(!best||res.credit>best.credit){best=res;}});
        var full=best&&best.H===best.N&&best.W===0;
        if(full){rt.lines.push(ex.shell.output||'[ok]');}
        else{
          var tool=toks[0];
          var known=(ex.elementSets||[ex.elements]).some(function(els){return els.some(function(e){return e.vals.indexOf(tool)>=0;});});
          if(known){rt.lines.push(ex.shell.toolErr||'Error: the options do not match the stated goal. Check the options and try again.');}
          else{rt.lines.push('command not found: '+tool);}
        }
      }
      RENDERS.terminal(ex,ans,rt);
      var sc2=qs('#tscroll');if(sc2){sc2.scrollTop=sc2.scrollHeight;}
      qs('#tinput',ans).focus();
    }
  });
  inp.focus();
};
function evalElements(toks,elements,extraOk){
  var H=0,W=0;
  elements.forEach(function(e){
    var hit=toks.some(function(t){return e.vals.indexOf(t)>=0;});
    if(hit){H++;}
  });
  var allVals=[];
  elements.forEach(function(e){allVals=allVals.concat(e.vals);});
  toks.forEach(function(t){
    if(t===''||t==='|'){return;}
    if(allVals.indexOf(t)<0&&extraOk.indexOf(t)<0){W++;}
  });
  var N=elements.length;
  return {H:H,W:W,N:N,credit:Math.max(0,(H-W)/N)};
}
GRADERS.terminal=function(ex,rt){
  var n=normCmd(rt.typed);
  var toks=n.split(' ').filter(function(t){return t!=='';});
  var sets=ex.elementSets||[ex.elements];
  var best=null,bestEls=null;
  sets.forEach(function(els){var r=evalElements(toks,els,ex.extraOk||[]);if(!best||r.credit>best.credit){best=r;bestEls=els;}});
  var items=[];
  (bestEls||[]).forEach(function(e){
    var hit=toks.some(function(t){return e.vals.indexOf(t)>=0;});
    items.push({st:hit?'ok':'miss',t:e.label,note:hit?'':'this part was missing'});
  });
  var allVals=[];
  (bestEls||[]).forEach(function(e){allVals=allVals.concat(e.vals);});
  toks.forEach(function(t){
    if(t===''||t==='|'||allVals.indexOf(t)>=0||(ex.extraOk||[]).indexOf(t)>=0){return;}
    items.push({st:'bad',t:'“'+t+'”',note:'this part is not needed (or is wrong) here'});
  });
  return {sel:[],correct:[],items:items,sc:best,creditOverride:best?best.credit:0};
};

/* ---------- grading + navigation ---------- */
/* Disable any free-typing widgets once an exercise is graded (the answer can no longer be edited) */
function lockWidgets(){
  qsa('.selctl').forEach(function(s){s.disabled=true;});
  qsa('.tinput').forEach(function(i){i.disabled=true;i.placeholder='Graded — the shell is read-only now';});
}
function gradeCurrent(){
  var ex=curEx();
  if(!ex){return;}
  var rt=RT[ex.id];
  if(rt.locked){return;}
  if(ex.type==='branch'&&rt.step<ex.steps.length){
    var nb=qs('#checkBtn');nb.classList.add('shake');
    setTimeout(function(){nb.classList.remove('shake');},400);
    return;
  }
  var g=GRADERS[ex.type](ex,rt);
  var sc=g.sc;
  var credit=(g.creditOverride!==undefined)?g.creditOverride:sc.credit;
  if(S.hintUsed[ex.id]){credit=Math.max(0,credit-0.10);}
  rt.locked=true;rt.result=credit;
  lockWidgets();
  if(!S.answered[ex.id]){
    S.answered[ex.id]={credit:credit};
    S.creditSum+=credit;S.answeredCount++;
    var si=S.skipped.indexOf(ex.id);
    if(si>=0){S.skipped.splice(si,1);}
  }
  renderFeedback(ex,rt,g,sc,credit);
  updateScore();
  var cb=qs('#checkBtn');if(cb){cb.classList.add('hidden');}
  var nw=qs('#nextwrap');
  var btn=document.createElement('button');
  btn.className='btn btn-primary';
  if(S.reviewing){btn.textContent='Return to skipped list ▶';btn.addEventListener('click',goReview);}
  else if(S.pos>=S.order.length-1){btn.textContent='Continue ▶';btn.addEventListener('click',afterLast);}
  else{btn.textContent='Next exercise ▶';btn.addEventListener('click',goNext);}
  nw.innerHTML='';nw.appendChild(btn);
  /* mandatory: Check-triggered auto-pause (timer state -> PAUSED_AUTO_CHECK) */
  setT('PAUSED_AUTO_CHECK');
  qs('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function goReview(){
  setT('RUNNING');
  S.reviewing=false;S.reviewId=null;
  renderReview();
}
function goNext(){
  setT('RUNNING');
  S.pos++;S.reviewing=false;S.reviewId=null;
  renderExercise();
  window.scrollTo(0,0);
}
function afterLast(){
  setT('RUNNING');
  S.reviewing=false;S.reviewId=null;
  if(S.skipped.length>0){renderReview();}
  else{finishExam(false);}
}
function skipEx(){
  var ex=curEx();
  if(!ex||S.screen!=='exam'){return;}
  var rt=RT[ex.id];
  if(rt&&rt.locked){return;}
  if(S.reviewing){goReview();return;}
  if(S.skipped.indexOf(ex.id)<0){S.skipped.push(ex.id);}
  S.pos++;
  if(S.pos>=S.order.length){afterLast();}
  else{renderExercise();window.scrollTo(0,0);}
}
function useHint(){
  var ex=curEx();
  if(!ex||S.screen!=='exam'){return;}
  var rt=RT[ex.id];
  if(rt&&rt.locked){return;}
  if(!S.hintUsed[ex.id]){S.hintUsed[ex.id]=true;}
  showHintBox(ex);
}
function manualPause(){
  if(TMR.state==='RUNNING'){S.pauseReturnAuto=false;setT('PAUSED_MANUAL');showPauseVeil();}
  else if(TMR.state==='PAUSED_AUTO_CHECK'){S.pauseReturnAuto=true;setT('PAUSED_MANUAL');showPauseVeil();}
}
function showPauseVeil(){
  qs('#pauseveil').classList.remove('hidden');
  var rb=qs('#resumeBtn');if(rb){rb.focus();}
}
function resumeFromPause(){
  qs('#pauseveil').classList.add('hidden');
  setT(S.pauseReturnAuto?'PAUSED_AUTO_CHECK':'RUNNING');
}

/* ---------- review skipped screen ---------- */
function renderReview(){
  S.screen='review';
  qs('#hdr').classList.remove('hidden');
  var st=qs('#stage');
  var rows=S.skipped.map(function(id){
    var ex=exById(id);
    return '<div class="simrow"><strong>'+esc(ex.title)+'</strong><div class="simdetail">'+esc(ex.summary)+'</div>'
      +'<div class="selrow"><button class="btn" data-ans="'+id+'">Answer this now ▶</button></div></div>';
  }).join('');
  st.innerHTML='<section class="card">'
    +'<div class="intro-top"><div class="kicker">Before you finish</div><h2>Review skipped exercises ('+S.skipped.length+')</h2></div>'
    +'<p>These exercises are still unanswered. You can answer them now, as many times as you need, as long as the timer has not ended. If you finish without answering them, they are <strong>excluded from your score</strong> — they do not count as right or wrong.</p>'
    +rows
    +'<div class="actionrow"><button id="finishBtn" class="btn btn-primary btn-big">Finish the exam ▶</button>'
    +'<span class="minihint">The timer is still running while you review.</span></div>'
    +'</section>';
  qsa('[data-ans]',st).forEach(function(b){
    b.addEventListener('click',function(){
      S.reviewing=true;S.reviewId=b.getAttribute('data-ans');
      S.screen='exam';
      renderExercise();
      window.scrollTo(0,0);
    });
  });
  qs('#finishBtn').addEventListener('click',function(){finishExam(false);});
  updateHeader();
}

/* ---------- results + reporting ---------- */
function finishExam(timeout){
  TMR.state='ENDED';
  if(TMR.iv){clearInterval(TMR.iv);TMR.iv=null;}
  S.screen='results';S.reviewing=false;S.reviewId=null;
  qs('#hdr').classList.remove('hidden');
  var answered=Object.keys(S.answered).length;
  var full=0,part=0,zero=0,partSum=0;
  EXAM.exercises.forEach(function(ex){
    var a=S.answered[ex.id];if(!a){return;}
    if(a.credit>=1){full++;}
    else if(a.credit>0){part++;partSum+=a.credit;}
    else{zero++;}
  });
  var notAnswered=EXAM.exercises.length-answered;
  var percent=answered>0?Math.round((S.creditSum/answered)*100):0;
  var passed=percent>=EXAM.passMark;
  var rows=EXAM.exercises.map(function(ex){
    var a=S.answered[ex.id];
    var st,ic;
    if(!a){st='Not answered — excluded';ic='○';}
    else if(a.credit>=1){st='Fully correct';ic='✓';}
    else if(a.credit>0){st='Partially correct ('+a.credit.toFixed(2)+')';ic='✓';}
    else{st='Incorrect';ic='✗';}
    return '<tr><td>'+ic+' '+esc(ex.title)+'</td><td>'+st+'</td></tr>';
  }).join('');
  var partAvg=part>0?(partSum/part).toFixed(2):'—';
  qs('#stage').innerHTML='<section class="card">'
    +'<div class="intro-top"><div class="kicker">'+esc(EXAM.topicLabel)+' · '+esc(EXAM.sevName)+' tier</div>'
    +'<h1>Results</h1></div>'
    +'<div class="resgrid">'
    +'<div class="resbox"><div class="num">'+S.creditSum.toFixed(1)+' / '+answered+'</div><div class="lab">Score (credit points)</div></div>'
    +'<div class="resbox"><div class="num">'+percent+'%</div><div class="lab">Final percentage</div></div>'
    +'<div class="resbox"><div class="num">'+full+'</div><div class="lab">Fully correct</div></div>'
    +'<div class="resbox"><div class="num">'+part+'</div><div class="lab">Partially correct (avg '+partAvg+')</div></div>'
    +'<div class="resbox"><div class="num">'+zero+'</div><div class="lab">Incorrect</div></div>'
    +'<div class="resbox"><div class="num">'+notAnswered+'</div><div class="lab">Skipped / not answered (excluded)</div></div>'
    +'</div>'
    +'<div class="passbox '+(passed?'pass':'fail')+'">'+(passed?'✓ PASS — well done, you reached the 70% pass mark.':'✗ FAIL — you need at least 70% to pass. Study the feedback and retake the exam.')+'</div>'
    +'<p class="minihint">Time: '+fmt(EXAM.timerSeconds-TMR.remaining)+' used · ⏸ manual breaks: '+fmt(S.manualTotal)+' · ⏸ feedback review (auto-pause): '+fmt(S.autoTotal)+(timeout?' · ⏱ the timer ran out and unfinished exercises were excluded.':'')+'</p>'
    +'<table class="restable">'+rows+'</table>'
    +'<div class="actionrow"><button id="retakeBtn" class="btn btn-primary btn-big">↻ Retake exam</button></div>'
    +'</section>';
  qs('#retakeBtn').addEventListener('click',startExam);
  updateHeader();
  window.scrollTo(0,0);
  if(!S.reported){
    S.reported=true;
    reportScore(S.creditSum,answered);
  }
}
function reportScore(creditSum,answeredCount){
  var percent=answeredCount>0?Math.round((creditSum/answeredCount)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EXAM.topicId,
      batch:EXAM.batch,
      score:Math.round(creditSum),
      total:answeredCount,
      percent:percent,
      passed:percent>=EXAM.passMark
    },location.origin);
  }catch(e){/* opened directly in a browser — nothing to report to */}
}

/* ---------- start / handshake / init ---------- */
function startExam(){
  S=freshState();
  prepAttempt();
  TMR.state='RUNNING';
  TMR.remaining=EXAM.timerSeconds;
  S.pauseReturnAuto=false;
  buildHeader();
  qs('#hdr').classList.remove('hidden');
  startTimer();
  renderExercise();
  window.scrollTo(0,0);
}
window.addEventListener('message',function(ev){
  if(!ev.data){return;}
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT'){return;}
  var n=ev.data.username||'';
  var el=qs('#welcomeline');
  if(el&&n){el.textContent='Welcome, '+n+'. Read every scenario with care — you have unlimited time whenever you press Check.';}
});
(function init(){
  qs('#resumeBtn').addEventListener('click',resumeFromPause);
  S=freshState();
  buildHeader();
  showIntro();
})();

</script>
