/* ---------- tiny helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmtT(s){ s=Math.max(0,s|0); var m=(s/60)|0, r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function byId(id){ return document.getElementById(id); }
function letter(i){ return String.fromCharCode(65+i); }

/* ---------- mandatory scoring function (partial credit) ---------- */
function scoreExercise(selectedItems, correctItems){
  var N = correctItems.length; var H = 0, W = 0;
  (selectedItems||[]).forEach(function(x){ if(correctItems.indexOf(x) !== -1){ H++; } else { W++; } });
  return Math.max(0, (H - W) / N);
}

/* ---------- global attempt state ---------- */
var S = null;
function freshState(){
  return {
    attempt:1, order:[], idx:0, creditSum:0, answered:0,
    checkedCount:0, partialCount:0, partialSum:0, zeroCount:0, fullCount:0,
    skipped:[], onReviewReturn:false, reported:false, hintUsed:{},
    started:false, finished:false, ctx:null
  };
}

/* ---------- timer state machine ---------- */
var T = { state:'IDLE', remaining:0, manualSec:0, autoSec:0, int:null, prevBeforeManual:null, segRemain:0, segOn:false };
function setState(st){
  T.state = st;
  if(st === 'RUNNING' && !T.int){ T.int = setInterval(tick, 1000); }
  updateTimerUI();
}
function tick(){
  if(T.state !== 'RUNNING'){ return; }
  T.remaining--;
  if(T.segOn && S && S.ctx && S.ctx.ex && S.ctx.ex.segmentSeconds && !S.ctx.checked && T.segRemain > 0){
    T.segRemain--; updateSegUI();
  }
  if(T.remaining <= 0){ T.remaining = 0; updateTimerUI(); endByTimeout(); return; }
  updateTimerUI();
}
function stopLoop(){ if(T.int){ clearInterval(T.int); T.int = null; } }
function updateTimerUI(){
  var chip = byId('timerchip'); if(!chip) return;
  var map = {
    'IDLE':               ['&#9697;','not started',''],
    'RUNNING':            ['&#9654;','RUNNING','run'],
    'PAUSED_MANUAL':      ['&#9208;','PAUSED &mdash; manual (press Resume)','pm'],
    'PAUSED_AUTO_CHECK':  ['&#9208;','PAUSED &mdash; reviewing feedback (resumes on Next)','pa'],
    'ENDED':              ['&#9632;','ENDED','end']
  };
  var m = map[T.state] || map.IDLE;
  chip.innerHTML = '<span class="tstate '+m[2]+'">'+m[0]+' '+m[1]+'</span> &middot; <b>'+fmtT(T.remaining)+'</b>';
}
function updateSegUI(){
  var n = byId('segtimer'); if(n){ n.textContent = 'Timed segment for this command: ' + fmtT(T.segRemain) + ' remaining (grading still possible after it ends).'; }
}

    '<button class="btn small" id="btnPause" title="Take a break: the timer stops and the exercise is hidden">&#9208; Pause</button>'+
    '<button class="btn small hide" id="btnReview" title="Return to skipped exercises">&#8635; Review skipped (<span id="rvcount">0</span>)</button>';

function updateHeader(){

  } else if(S.finished){ n.innerHTML = 'Finished'; }

  byId('scorechip').innerHTML = 'Score <b>'+S.creditSum.toFixed(1)+' / '+S.answered+'</b> &middot; '+
    (S.answered>0 ? Math.round((S.creditSum/S.answered)*100) : 0)+'%';

  if(S.skipped.length>0){ rv.classList.remove('hide'); byId('rvcount').textContent = S.skipped.length; }

  byId('btnHint').disabled = !canAct || !!S.ctx && !!S.ctx.hintUsed;
  byId('btnSkip').disabled = !canAct;

}

/* ---------- exam flow ---------- */
function startExam(){
  S.started = true;
  T.remaining = M.timerSeconds; T.manualSec = 0; T.autoSec = 0;
  DATA.forEach(function(d){ d._credit = null; });
  S.order = shuffle(DATA.map(function(_,i){ return i; }));
  fixTerminalAdjacency();
  S.idx = 0; S.creditSum = 0; S.answered = 0; S.skipped = []; S.reported = false;
  S.checkedCount = 0; S.partialCount = 0; S.partialSum = 0; S.zeroCount = 0; S.fullCount = 0;
  S.finished = false; S.onReviewReturn = false;
  if(!byId('scr-exam')){
    var w = el('div'); w.id='scr-exam';
    w.innerHTML = '<div id="excardhost"></div>';
    APP.appendChild(w);
  }
  setState('RUNNING');
  renderExercise();
  show('scr-exam');
}
function fixTerminalAdjacency(){
  for(var i=1;i<S.order.length;i++){
    var a = DATA[S.order[i-1]], b = DATA[S.order[i]];
    if(a.type==='terminal' && b.type==='terminal'){
      for(var j=0;j<S.order.length;j++){
        if(Math.abs(j-i)>1 && DATA[S.order[j]].type!=='terminal' && DATA[S.order[Math.max(0,j-1)]].type!=='terminal'){
          var t=S.order[i]; S.order[i]=S.order[j]; S.order[j]=t; break;
        }
      }
    }
  }
}

function currentEx(){ return DATA[S.order[S.idx]]; }

function renderExercise(){
  var ex = currentEx();
  var ctx = { ex:ex, checked:false, hintUsed:!!S.hintUsed[S.order[S.idx]], sel:null, stepIdx:0, sels:[], reviewBack:S.onReviewReturn };
  S.ctx = ctx; S.onReviewReturn = false;
  T.segOn = !!ex.segmentSeconds; T.segRemain = ex.segmentSeconds||0;
  var host = byId('excardhost'); host.innerHTML='';
  var card = el('div','excard'); card.id='excard';
  var title = el('div','exhead');
  title.innerHTML = '<span class="ext">'+esc(ex.title)+'</span><span class="spacer"></span>'+
    '<span class="chip">'+esc(typeLabel(ex.type))+'</span>';
  card.appendChild(title);

  /* SCENARIO block (collapsible with persistent summary) */
  var scen = el('details','scen blk-scen'); scen.id='scenblk';
  var sum = el('summary', null, '<span class="dot" style="background:var(--scen);width:11px;height:11px;border-radius:3px;display:inline-block;"></span> SCENARIO'+
    '<span class="tw">click to collapse / expand</span>');
  scen.appendChild(sum);
  var sumline = el('div','scen-sum', esc(ex.scenarioSummary||ex.title));
  scen.appendChild(sumline);
  var sbody = el('div','blk-b');
  (ex.scenario||[]).forEach(function(a,i){
    var art = el('div','art');

    art.appendChild(el('div','art-b', a.html));
    sbody.appendChild(art);
  });
  scen.appendChild(sbody);
  card.appendChild(scen);

  /* QUESTION block */
  var qb = el('div','blk blk-q');
  qb.appendChild(el('div','blk-h','<span class="dot"></span> QUESTION'));
  qb.appendChild(el('div','blk-b', ex.question));
  card.appendChild(qb);

  /* YOUR ANSWER block */
  var ab = el('div','blk blk-ans');
  ab.appendChild(el('div','blk-h','<span class="dot"></span> YOUR ANSWER'));
  var aw = el('div','blk-b'); aw.id='answerhost';
  ab.appendChild(aw);

  bar.id = 'checkrow';
  if(ex.type==='branch'){ bar.classList.add('hide'); }
  bar.innerHTML = '<button class="btn primary" id="btnCheck">Check</button>'+
    '<span class="muted" id="checknote">'+(ctx.hintUsed?'Hint already used on this exercise (credit reduced by 10%).':'Press Check to grade this exercise and stop the timer while you study the feedback.')+'</span>';
  card.appendChild(bar);

  if(ex.segmentSeconds){
    var seg = el('div','seg-timer'); seg.id='segtimer';
    seg.textContent = 'Timed segment for this command: '+fmtT(T.segRemain)+' remaining.';
    aw.parentNode.insertBefore(seg, aw);
  }
  host.appendChild(card);

  byId('btnCheck').addEventListener('click', onCheck);
  updateHeader();
}

function typeLabel(t){
  return {qcm:'single choice', sim:'scenario decision', multi:'multi-select + partial credit',
    fill:'fill in the blanks + partial credit', dnd:'drag &amp; drop + partial credit',
    match:'matching + partial credit', order:'ordering + partial credit', terminal:'terminal task',
    logview:'log analysis', branch:'branching scenario'}[t]||t;
}

/* ---------- hint / skip / pause ---------- */
function onHint(){
  if(!S.ctx || S.ctx.checked || S.ctx.hintUsed) return;
  S.ctx.hintUsed = true; S.hintUsed[S.order[S.idx]] = true;
  var hb = el('div','hintbox','<b>Hint:</b> '+esc(S.ctx.ex.hint||'Re-read the scenario and focus on what the attacker is trying to obtain.'));
  var card = byId('excard'); card.insertBefore(hb, byId('answerhost').parentNode);
  byId('btnHint').disabled = true;
  byId('checknote').textContent = 'Hint used: if this exercise scores, its credit is reduced by 0.10.';
}
function onSkip(){
  if(!S.ctx || S.ctx.checked || T.state!=='RUNNING') return;
  S.skipped.push(S.order[S.idx]);
  T.segOn = false;
  if(S.ctx.reviewBack){ S.ctx = null; showReview(); return; }
  advance(false);
}
function onManualPause(){
  if(S.finished) return;
  if(T.state==='RUNNING' || T.state==='PAUSED_AUTO_CHECK'){
    T.prevBeforeManual = T.state;
    setState('PAUSED_MANUAL');
    var ov = el('div','pause-ov'); ov.id='pauseov';
    ov.innerHTML = '<div class="pause-card"><h2>&#9208; Exam paused (manual break)</h2>'+
      '<p>The timer is stopped and the exercise is hidden so you cannot read it while paused. '+
      'Time paused is recorded and shown in your results.</p>'+
      '<button class="btn primary" id="btnResume">Resume</button></div>';
    document.body.appendChild(ov);
    byId('btnResume').addEventListener('click', function(){
      ov.remove();
      setState(T.prevBeforeManual || 'RUNNING');
    });
  }
}

/* ---------- advance / review / finish ---------- */
function advance(afterCheck){
  S.ctx = null;
  if(S.idx < S.order.length-1){
    S.idx++;
    setState('RUNNING');
    renderExercise();
    show('scr-exam');
  } else if(S.skipped.length>0){
    setState('RUNNING');
    showReview();
  } else {
    finishExam();
  }
}
function showReview(){
  if(S.skipped.length===0){ finishExam(); return; }
  setState('RUNNING');
  var w = byId('scr-review');
  if(!w){ w = el('div'); w.id='scr-review'; APP.appendChild(w); }
  var items = S.skipped.map(function(exIdx, pos){
    var ex = DATA[exIdx];
    return '<div class="rv-item"><span class="rt"><b>'+esc(ex.title)+'</b><br><span class="muted">'+esc(ex.scenarioSummary||'')+'</span></span>'+
      '<button class="btn small" data-pos="'+pos+'">Return to it</button></div>';
  }).join('');
  w.innerHTML = '<h2>&#8635; Review skipped exercises</h2>'+
    '<p class="muted">Timer still running: <b>'+fmtT(T.remaining)+'</b>. You can return to each skipped exercise and answer it. '+
    'If you submit now, skipped-and-unanswered exercises are excluded from the score &mdash; they count neither as correct nor as wrong.</p>'+
    items + '<div class="checkrow"><button class="btn primary" id="btnFinalSubmit">Final Submit</button>'+
    '<button class="btn" id="btnBackExam">Back to exam</button></div>';
  w.querySelectorAll('button[data-pos]').forEach(function(b){
    b.addEventListener('click', function(){
      var pos = parseInt(b.getAttribute('data-pos'),10);
      var exIdx = S.skipped.splice(pos,1)[0];
      var at = S.order.indexOf(exIdx);
      S.idx = at; S.onReviewReturn = true;
      renderExercise(); show('scr-exam');
    });
  });
  byId('btnFinalSubmit').addEventListener('click', finishExam);
  var pending = S.order.filter(function(ix){ return DATA[ix]._credit==null && S.skipped.indexOf(ix)===-1; });
  var backBtn = byId('btnBackExam');
  if(pending.length>0){
    backBtn.classList.remove('hide');
    backBtn.addEventListener('click', function(){
      S.idx = S.order.indexOf(pending[0]);
      S.ctx = null; S.onReviewReturn = false;
      renderExercise(); show('scr-exam');
    });
  } else {
    backBtn.classList.add('hide');
  }
  show('scr-review');
  updateHeader();
}

/* ---------- grading ---------- */
function onCheck(){
  if(!S.ctx || S.ctx.checked) return;
  var ctx = S.ctx, ex = ctx.ex;
  var res = WIDGETS[ex.type].grade(ex, ctx);
  var credit = scoreExercise(res.selectedItems, res.correctItems);
  if(ctx.hintUsed){ credit = Math.max(0, credit - 0.10); }
  ctx.checked = true; ctx.credit = credit; ctx.res = res;
  DATA[S.order[S.idx]]._credit = credit;
  S.answered++; S.creditSum += credit;
  if(credit >= 1){ S.fullCount++; } else if(credit > 0){ S.partialCount++; S.partialSum += credit; } else { S.zeroCount++; }
  /* mandatory Check-triggered auto-pause: timer stops BEFORE feedback is rendered */
  if(T.state==='RUNNING'){ setState('PAUSED_AUTO_CHECK'); }
  var last = (S.idx === S.order.length-1);
  var nextLabel = last ? (S.skipped.length>0 ? 'Review skipped ('+S.skipped.length+')' : 'Final Submit') : 'Next &rarr;';
  var fb = el('div','fb '+(credit>=1?'ok':(credit>0?'part':'bad')));
  var itemsHtml = '';
  (res.items||[]).forEach(function(it){
    var ic = it.state==='correct' ? '<span class="ic-ok">&#10003; Correct</span>' :
             it.state==='wrong'   ? '<span class="ic-bad">&#10007; Wrong</span>' :
                                    '<span class="ic-miss">&#9675; Missed</span>';
    itemsHtml += '<li>'+ic+' &mdash; <b>'+it.name+'</b>'+(it.note? ' <span class="muted">'+esc(it.note)+'</span>':'')+'</li>';
  });
  var multi = (res.correctItems.length > 1);
  var creditLine = '';
  if(multi){
    var h = res.items ? res.items.filter(function(i){return i.state==='correct';}).length : 0;
    creditLine = '<div class="fb-credit">credit '+credit.toFixed(2)+' &mdash; '+h+'/'+res.correctItems.length+' items'+
      (credit<1 ? ' &middot; formula: credit = max(0, (correct &minus; wrong) / total)'+(ctx.hintUsed?' &middot; includes the &minus;0.10 hint penalty':'') : '')+'</div>';
  } else if(ctx.hintUsed){
    creditLine = '<div class="fb-credit">credit '+credit.toFixed(2)+' &middot; includes the &minus;0.10 hint penalty</div>';
  }
  fb.innerHTML =
    '<div class="fb-h">'+(credit>=1?'&#10003; CORRECT':(credit>0?'&#10003; PARTIALLY CORRECT':'&#10007; INCORRECT'))+'</div>'+
    creditLine +
    (res.correctText? '<div class="fb-correct"><b>Correct answer:</b> '+res.correctText+'</div>':'')+
    ((res.items&&res.items.length)? '<ul class="fb-items">'+itemsHtml+'</ul>':'')+
    (res.outcome? '<div class="fb-correct"><b>What happens in real life:</b> '+res.outcome+'</div>':'')+
    '<div class="fb-explain">'+res.explain+'</div>'+
    (res.study? '<div class="fb-study"><b>What to study next:</b> '+esc(res.study)+'</div>':'');
  var card = byId('excard');
  card.appendChild(fb);
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
  var bar = card.querySelector('.checkrow');
  bar.innerHTML = '<button class="btn primary" id="btnNext">'+nextLabel+'</button>'+
    '<span class="muted">'+(last? 'This is the last exercise.' : 'Timer is paused while you read this. It resumes when you press Next.')+'</span>';
  byId('btnNext').addEventListener('click', function(){
    if(ctx.reviewBack){
      if(S.skipped.length>0){ setState('RUNNING'); showReview(); } else { finishExam(); }
      return;
    }
    if(S.idx === S.order.length-1){
      if(S.skipped.length>0){ setState('RUNNING'); showReview(); } else { finishExam(); }
    } else { advance(true); }
  });
  var ah = byId('answerhost'); ah.classList.add('opts-lock'); ah.style.pointerEvents='none';
  byId('btnHint').disabled = true; byId('btnSkip').disabled = true;
  T.segOn = false;
  updateHeader();
}

function endByTimeout(){
  if(S.finished) return;
  stopLoop();
  if(S.ctx && !S.ctx.checked){ S.skipped.push(S.order[S.idx]); S.ctx=null; }
  finishExam(true);
}

function finishExam(timeout){
  S.finished = true;
  setState('ENDED'); stopLoop();
  var answered = S.answered;
  var percent = answered>0 ? Math.round((S.creditSum/answered)*100) : 0;
  var passed = percent >= 70;
  /* report exactly once per attempt, at the results screen, rounded integers */
  if(!S.reported){
    S.reported = true;
    try{
      parent.postMessage({
        type:'CYBERPULSE_SCORE', topicId:M.topicId, batch:M.batch,
        score:Math.round(S.creditSum), total:answered, percent:percent, passed:passed
      }, location.origin);
    }catch(e){ /* opened directly, nothing to report to */ }
  }
  var w = byId('scr-results');
  if(!w){ w = el('div'); w.id='scr-results'; APP.appendChild(w); }
  var rows = S.order.map(function(exIdx){
    var ex = DATA[exIdx];
    var credit = null, st;
    if(S.ctx && S.order[S.idx]===exIdx && !S.ctx.checked){ st='<span class="st-skip">&#9888; NOT ANSWERED &mdash; EXCLUDED</span>'; }
    else {
      credit = ex._credit;
      if(credit==null){ st='<span class="st-skip">&#9888; NOT ANSWERED &mdash; EXCLUDED</span>'; }
      else if(credit>=1){ st='<span class="st-ok">&#10003; CORRECT</span>'; }
      else if(credit>0){ st='<span class="st-part">&#10003; PARTIALLY CORRECT &middot; '+credit.toFixed(2)+'</span>'; }
      else { st='<span class="st-bad">&#10007; INCORRECT</span>'; }
    }
    return '<div class="rv-item"><span class="rt"><b>'+esc(ex.title)+'</b></span>'+st+'</div>';
  }).join('');
  var avgPartial = S.partialCount>0 ? (S.partialSum/S.partialCount) : 0;
  w.innerHTML =
  '<div class="res-hero">'+
    '<h1>'+(timeout? 'Time is up' : 'Results')+'</h1>'+
    '<div class="pct '+(passed?'pass':'fail')+'">'+percent+'%</div>'+
    '<p class="muted">'+S.creditSum.toFixed(1)+' credits over '+answered+' answered exercise'+(answered===1?'':'s')+' &middot; pass mark 70%</p>'+
    (passed
      ? '<div class="cert"><h3>&#10003; PASS &mdash; certificate of completion</h3><p>'+esc(S.username||'Candidate')+' has demonstrated mastery of <b>TA0006 Credential Access</b> at severity <b>'+esc(M.severityLabel)+'</b>.</p><p>Topic: MITRE ATT&amp;CK tactic TA0006 &middot; tier '+(M.batch)+'/4 &middot; '+new Date().toISOString().slice(0,10)+'</p></div>'
      : '<div class="cert" style="border-color:var(--bad); background:#22100f;"><h3 style="color:var(--bad);">&#10007; FAIL &mdash; retake required</h3><p>You did not reach 70%. Review the explanations below, then retake the exam. Questions and answer choices are reshuffled on every attempt.</p></div>')+
  '</div>'+
  '<div class="res-grid">'+
    '<div class="res-card"><div class="n">'+S.fullCount+'</div><div class="l">fully correct</div></div>'+
    '<div class="res-card"><div class="n">'+S.partialCount+(S.partialCount? ' <span class="muted">(avg '+avgPartial.toFixed(2)+')</span>':'')+'</div><div class="l">partially correct</div></div>'+
    '<div class="res-card"><div class="n">'+S.zeroCount+'</div><div class="l">fully incorrect</div></div>'+
    '<div class="res-card"><div class="n">'+S.skipped.length+'</div><div class="l">skipped &mdash; excluded from score</div></div>'+
    '<div class="res-card"><div class="n">'+fmtT(M.timerSeconds-T.remaining)+'</div><div class="l">time used</div></div>'+
    '<div class="res-card"><div class="n">'+fmtT(T.manualSec)+' / '+fmtT(T.autoSec)+'</div><div class="l">paused manually / paused on feedback</div></div>'+
  '</div>'+
  '<div class="res-list"><h3 style="padding:8px 0 2px; margin:4px 0;">Per-exercise recap</h3>'+rows+'</div>'+
  '<div class="checkrow"><button class="btn primary" id="btnRetake">&#8635; Retake exam</button></div>';
  /* record credits for recap */
  w.querySelectorAll('.rv-item').forEach(function(){});
  show('scr-results');
  byId('btnRetake').addEventListener('click', function(){ S.attempt++; S.hintUsed={}; startExam(); });
}
/* ---------- widget registry ---------- */
var WIDGETS = {};

/* ===== QCM (single choice) / SIM (with outcomes) ===== */
WIDGETS.qcm = {
  render: function(ex, host, ctx){
    ctx.opts = shuffle(ex.options.map(function(o,i){ return {k:letter(i), id:'o'+i, html:o.html, correct:!!o.correct, outcome:o.outcome}; }));
    var wrap = el('div', null, '<div class="bank-label">Select one answer, then press Check.</div>');
    ctx.opts.forEach(function(o,i){
      var b = el('button','opt');
      b.setAttribute('type','button'); b.setAttribute('aria-pressed','false');
      b.innerHTML = '<span class="key">'+letter(i)+'.</span><span>'+o.html+'</span>';
      b.addEventListener('click', function(){
        ctx.sel = o.id;
        wrap.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
        b.setAttribute('aria-pressed','true');
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  },
  grade: function(ex, ctx){
    var sel = ctx.opts.filter(function(o){ return o.id===ctx.sel; })[0];
    var correct = ctx.opts.filter(function(o){ return o.correct; })[0];
    var items = [{name:'Answer', state:(sel&&sel.correct)?'correct':'wrong', note: sel? '' : 'No answer was selected.'}];
    return {
      selectedItems: sel? [sel.id] : [],
      correctItems: [correct.id],
      items: items,
      correctText: correct.html,
      outcome: (ex.type==='sim' && sel && sel.outcome) ? sel.outcome : '',
      explain: ex.explain, study: ex.study
    };
  }
};
WIDGETS.sim = WIDGETS.qcm;

/* ===== MULTI (multi-select, partial credit) ===== */
WIDGETS.multi = {
  render: function(ex, host, ctx){
    ctx.opts = shuffle(ex.options.map(function(o,i){ return {id:'o'+i, html:o.html, correct:!!o.correct}; }));
    var wrap = el('div','multirow', '<div class="bank-label">Select every statement that applies. Wrong picks subtract from correct ones.</div>');
    ctx.opts.forEach(function(o,i){
      var b = el('button','opt');
      b.setAttribute('type','button'); b.setAttribute('aria-pressed','false');
      b.innerHTML = '<span class="box" aria-hidden="true"></span><span class="key">'+letter(i)+'.</span><span>'+o.html+'</span>';
      b.addEventListener('click', function(){
        o._on = !o._on;
        b.setAttribute('aria-pressed', o._on?'true':'false');
      });
      wrap.appendChild(b);
    });
    host.appendChild(wrap);
  },
  grade: function(ex, ctx){
    var sel = [], correctIds = [], items = [];
    ctx.opts.forEach(function(o){
      if(o.correct) correctIds.push(o.id);
      if(o._on) sel.push(o.id);
      if(o.correct){ items.push({name:o.plain||stripTags(o.html), state:o._on?'correct':'missed'}); }
      else if(o._on){ items.push({name:stripTags(o.html), state:'wrong'}); }
    });
    return { selectedItems:sel, correctItems:correctIds, items:items,
      correctText: ctx.opts.filter(function(o){return o.correct;}).map(function(o){return stripTags(o.html);}).join(' &middot; '),
      explain: ex.explain, study: ex.study };
  }
};
function stripTags(s){ var d = el('div'); d.innerHTML = s; return (d.textContent||'').replace(/\s+/g,' ').trim(); }

/* ===== FILL (blanks with shuffled dropdowns, partial credit) ===== */
WIDGETS.fill = {
  render: function(ex, host, ctx){
    ctx.blanks = ex.blanks.map(function(b,i){
      var opts = shuffle(b.options.map(function(o,j){ return {id:'b'+i+'_'+j, v:o, html:o}; }));
      return {idx:i, opts:opts, answer:b.answer, name:(b.name||('Blank '+(i+1)))};
    });
    var parts = ex.prefixHtml.split(/{{\d}}/);
    var out = '<div class="filltext">';
    parts.forEach(function(p,i){
      out += p;
      if(i < ctx.blanks.length){
        out += '<select data-b="'+i+'" aria-label="'+esc(ctx.blanks[i].name)+'"><option value="">&mdash; choose &mdash;</option>';
        ctx.blanks[i].opts.forEach(function(o){ out += '<option value="'+esc(o.id)+'">'+esc(o.v)+'</option>'; });
        out += '</select>';
      }
    });
    out += '</div>';
    host.innerHTML = out;
  },
  grade: function(ex, ctx){
    var host = byId('answerhost');
    var sel = [], correctIds = [], items = [];
    ctx.blanks.forEach(function(b){
      var s = host.querySelector('select[data-b="'+b.idx+'"]');
      var chosenId = s ? s.value : '';
      var chosen = b.opts.filter(function(o){ return o.id===chosenId; })[0];
      var correctOpt = b.opts.filter(function(o){ return o.v===b.answer; })[0];
      correctIds.push(correctOpt.id);
      if(chosenId) sel.push(chosenId);
      items.push({name:b.name, state:(chosen && chosen.v===b.answer)?'correct':(chosen?'wrong':'missed'),
        note: chosen? ('you picked: '+chosen.v) : 'no answer'});
    });
    return { selectedItems:sel, correctItems:correctIds, items:items,
      correctText: ctx.blanks.map(function(b){ return b.name+': '+b.answer; }).join(' &middot; '),
      explain: ex.explain, study: ex.study };
  }
};

/* ===== DND (drag & drop: each item has one correct slot; partial credit per item) ===== */
WIDGETS.dnd = {
  render: function(ex, host, ctx){
    ctx.bank = shuffle(ex.bank.map(function(b){ return {id:b.id, html:b.html}; }));
    ctx.placed = {};
    var wrap = el('div');
    wrap.innerHTML = '<div class="bank-label">Drag an item into a box, or select the item and then select the box. Keyboard: Tab to an item, press Enter, Tab to a box, press Enter.</div>'+
      '<div class="bank-label">Items:</div>';
    var bank = el('div','bank'); bank.id='dndbank';
    ctx.bank.forEach(function(b){
      var c = el('button','chipitem');
      c.setAttribute('type','button'); c.draggable = true; c.dataset.id = b.id;
      c.innerHTML = b.html;
      c.addEventListener('click', function(){
        if(c.classList.contains('ghosted')) return;
        ctx.selItem = (ctx.selItem===b.id)? null : b.id;
        bank.querySelectorAll('.chipitem').forEach(function(x){ x.classList.remove('sel'); });
        if(ctx.selItem===b.id) c.classList.add('sel');
      });
      c.addEventListener('dragstart', function(e){ ctx.selItem = b.id; try{ e.dataTransfer.setData('text/plain', b.id); }catch(err){} });
      bank.appendChild(c);
    });
    wrap.appendChild(bank);
    var slots = el('div','slots '+(ex.slotCols||'two'));
    ctx.slots = ex.slots.map(function(s){
      var d = el('div','slot'); d.dataset.slot = s.id;
      d.setAttribute('tabindex','0'); d.setAttribute('role','button');
      d.setAttribute('aria-label','Drop box: '+stripTags(s.html)+'. Press Enter to place the selected item here.');
      d.innerHTML = '<div class="slot-h">'+s.html+'</div><div class="dropzone"><span class="muted unplace">drop here</span></div>';
      d.addEventListener('click', function(){
        if(ctx.selItem){ placeItem(ctx.selItem, d); }
      });
      d.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); if(ctx.selItem){ placeItem(ctx.selItem, d); } }
      });
      d.addEventListener('dragover', function(e){ e.preventDefault(); d.classList.add('over'); });
      d.addEventListener('dragleave', function(){ d.classList.remove('over'); });
      d.addEventListener('drop', function(e){
        e.preventDefault(); d.classList.remove('over');
        var id = e.dataTransfer && e.dataTransfer.getData('text/plain');
        if(id){ placeItem(id, d); }
      });
      slots.appendChild(d);
      return {id:s.id, node:d};
    });
    wrap.appendChild(slots);
    host.appendChild(wrap);
    function placeItem(id, slotNode){
      var s = ctx.slots.filter(function(x){ return x.id===slotNode.dataset.slot; })[0];
      if(!s) return;
      if(ctx.placed[s.id]){ returnChip(ctx.placed[s.id]); }
      var chip = bank.querySelector('.chipitem[data-id="'+id+'"]');
      if(chip){ chip.classList.add('ghosted'); }
      ctx.placed[s.id] = id;
      var dz = s.node.querySelector('.dropzone');
      dz.innerHTML = '';
      var c2 = el('span','chipitem', chip? chip.innerHTML : id);
      var rm = el('button','x','&times;'); rm.setAttribute('aria-label','Remove item');
      rm.addEventListener('click', function(ev){ ev.stopPropagation(); returnChip(id); });
      c2.appendChild(rm);
      dz.appendChild(c2);
      ctx.selItem = null;
      bank.querySelectorAll('.chipitem').forEach(function(x){ x.classList.remove('sel'); });
    }
    function returnChip(id){
      Object.keys(ctx.placed).forEach(function(k){ if(ctx.placed[k]===id) delete ctx.placed[k]; });
      var chip = bank.querySelector('.chipitem[data-id="'+id+'"]');
      if(chip) chip.classList.remove('ghosted');
      ctx.slots.forEach(function(s){
        var dz = s.node.querySelector('.dropzone');
        if(ctx.placed[s.id]==null && dz && !dz.querySelector('.unplace')){ dz.innerHTML = '<span class="muted unplace">drop here</span>'; }
      });
    }
  },
  grade: function(ex, ctx){
    var sel = [], correctIds = [], items = [];
    ctx.bank.forEach(function(card){
      var def = ex.bank.filter(function(b){ return b.id===card.id; })[0];
      var correctSlot = def.slot;
      correctIds.push(card.id+'@'+correctSlot);
      var placedSlot = null;
      Object.keys(ctx.placed).forEach(function(sk){ if(ctx.placed[sk]===card.id) placedSlot = sk; });
      if(placedSlot){ sel.push(card.id+'@'+placedSlot); }
      items.push({name: stripTags(card.html), state: placedSlot==null? 'missed' : (placedSlot===correctSlot? 'correct':'wrong'),
        note: placedSlot==null? 'not placed' : (placedSlot===correctSlot? '' : 'you put it in a different box')});
    });
    return { selectedItems:sel, correctItems:correctIds, items:items,
      correctText: ex.bank.map(function(b){
        var s = ex.slots.filter(function(x){ return x.id===b.slot; })[0];
        return stripTags(b.html)+' &rarr; '+stripTags(s.html);
      }).join('<br>'),
      explain: ex.explain, study: ex.study };
  }
};

/* ===== MATCH (pair lefts to rights, partial credit) ===== */
WIDGETS.match = {
  render: function(ex, host, ctx){
    ctx.lefts = shuffle(ex.lefts.map(function(l){ return {id:l.id, html:l.html}; }));
    ctx.rights = shuffle(ex.rights.map(function(r){ return {id:r.id, html:r.html}; }));
    var wrap = el('div');
    wrap.innerHTML = '<div class="bank-label">Select one card on the left, then one card on the right to link them. Select a link below to undo it.</div>'+
      '<div class="mcol"><div id="mleft"></div><div id="mright"></div></div><div class="pairlist" id="mpairs"></div>';
    host.appendChild(wrap);
    var L = host.querySelector('#mleft'), R = host.querySelector('#mright');
    ctx.lefts.forEach(function(l){
      var b = el('button','chipitem'); b.dataset.lid = l.id; b.innerHTML = l.html;
      b.addEventListener('click', function(){
        ctx.selLeft = (ctx.selLeft===l.id)? null : l.id;
        L.querySelectorAll('.chipitem').forEach(function(x){ x.classList.remove('sel'); });
        if(ctx.selLeft===l.id) b.classList.add('sel');
      });
      L.appendChild(b);
    });
    ctx.rights.forEach(function(r){
      var b = el('button','chipitem'); b.dataset.rid = r.id; b.innerHTML = r.html;
      b.addEventListener('click', function(){
        if(!ctx.selLeft){
          var pl = host.querySelector('#mpairs');
          if(pl){ pl.innerHTML = '<div class="muted">Select a card on the LEFT first, then its partner here.</div>'; }
          return;
        }
        ctx.pairs[ctx.selLeft] = r.id;
        ctx.selLeft = null;
        L.querySelectorAll('.chipitem').forEach(function(x){ x.classList.remove('sel'); });
        drawPairs();
      });
      R.appendChild(b);
    });
    ctx.pairs = {};
    function drawPairs(){
      var pl = host.querySelector('#mpairs'); pl.innerHTML='';
      Object.keys(ctx.pairs).forEach(function(lid){
        var l = ctx.lefts.filter(function(x){return x.id===lid;})[0];
        var r = ctx.rights.filter(function(x){return x.id===ctx.pairs[lid];})[0];
        var p = el('div','pair','<span>'+l.html+'</span><span>&harr;</span><span>'+r.html+'</span>');
        var x = el('button','x','&times;'); x.setAttribute('aria-label','Undo link');
        x.addEventListener('click', function(){ delete ctx.pairs[lid]; drawPairs(); });
        p.appendChild(x);
        pl.appendChild(p);
      });
    }
  },
  grade: function(ex, ctx){
    var sel = [], correctIds = [], items = [];
    ctx.lefts.forEach(function(l){
      var correctR = ex.lefts.filter(function(x){ return x.id===l.id; })[0].right;
      correctIds.push(correctR);
      var chosen = ctx.pairs[l.id];
      if(chosen){ sel.push(chosen); }
      items.push({name: stripTags(l.html), state: chosen? (chosen===correctR?'correct':'wrong'):'missed'});
    });
    return { selectedItems:sel, correctItems:correctIds, items:items,
      correctText: ex.lefts.map(function(l){
        var r = ex.rights.filter(function(x){ return x.id===l.right; })[0];
        return stripTags(l.html)+' &rarr; '+stripTags(r.html);
      }).join('<br>'),
      explain: ex.explain, study: ex.study };
  }
};

/* ===== ORDER (drag or arrows to reorder; optional distractors stay in tray) ===== */
WIDGETS.order = {
  render: function(ex, host, ctx){
    ctx.seq = shuffle(ex.sequence.map(function(s){ return {id:s.id, html:s.html}; }));
    ctx.distr = shuffle((ex.distractors||[]).map(function(s){ return {id:s.id, html:s.html}; }));
    var wrap = el('div');
    wrap.innerHTML = '<div class="bank-label">Put the events in the right order: drag a row onto another row, or use the arrows. '+(ctx.distr.length? 'Items in the tray below are <b>not</b> part of the sequence &mdash; leave them there.':'')+'</div><div id="ordlist"></div>'+
      (ctx.distr.length? '<div class="tray"><div class="slot-h">Tray &mdash; unrelated items (leave them here)</div><div id="ordtray" class="bank"></div></div>':'');
    host.appendChild(wrap);
    function draw(){
      var list = host.querySelector('#ordlist'); list.innerHTML='';
      ctx.seq.forEach(function(it, i){
        var row = el('div','ord');
        row.draggable = true; row.dataset.oid = it.id;
        row.innerHTML = '<span class="num">'+(i+1)+'</span><span class="otxt">'+it.html+'</span>'+
          '<span class="mv"><button class="btn small" data-mv="up" aria-label="Move up">&uarr;</button><button class="btn small" data-mv="dn" aria-label="Move down">&darr;</button></span>';
        row.addEventListener('dragstart', function(e){ ctx.dragId = it.id; try{ e.dataTransfer.setData('text/plain', it.id);}catch(err){} });
        row.addEventListener('dragover', function(e){ e.preventDefault(); row.classList.add('dragover'); });
        row.addEventListener('dragleave', function(){ row.classList.remove('dragover'); });
        row.addEventListener('drop', function(e){
          e.preventDefault(); row.classList.remove('dragover');
          var id = e.dataTransfer && e.dataTransfer.getData('text/plain');
          if(id){ moveTo(id, i); }
        });
        row.querySelectorAll('[data-mv]').forEach(function(b){
          b.addEventListener('click', function(){ moveTo(it.id, b.getAttribute('data-mv')==='up'? i-1 : i+1); });
        });
        list.appendChild(row);
      });
      var tray = host.querySelector('#ordtray');
      if(tray){
        tray.innerHTML='';
        ctx.distr.forEach(function(it){
          if(it._used){
            var w = el('div','ord');
            w.innerHTML = '<span class="num">!</span><span class="otxt">'+it.html+'</span><span class="muted">added to the sequence &mdash; will count as wrong</span>';
            list.appendChild(w);
            return;
          }
          var c = el('button','chipitem'); c.innerHTML = it.html; c.draggable=true;
          c.addEventListener('dragstart', function(e){ ctx.dragId = it.id; it._isDistr=true; try{ e.dataTransfer.setData('text/plain','__d__'+it.id);}catch(err){} });
          c.addEventListener('dblclick', function(){ if(!it._used){ it._used = true; draw(); } });
          tray.appendChild(c);
        });
      }
    }
    function moveTo(id, target){
      var i = ctx.seq.findIndex(function(x){ return x.id===id; });
      if(i<0) return;
      target = Math.max(0, Math.min(ctx.seq.length-1, target));
      var item = ctx.seq.splice(i,1)[0];
      ctx.seq.splice(target,0,item);
      draw();
    }
    /* dropping a distractor onto the list = using it (counts as wrong) */
    host.addEventListener('drop', function(e){
      var id = e.dataTransfer && e.dataTransfer.getData('text/plain');
      if(id && id.indexOf('__d__')===0){
        var did = id.slice(5);
        var d = ctx.distr.filter(function(x){ return x.id===did; })[0];
        if(d && !d._used){ d._used = true; draw(); }
      }
    });
    draw();
  },
  grade: function(ex, ctx){
    var sel = [], correctIds = [], items = [];
    ex.sequence.forEach(function(s, i){
      correctIds.push(s.id);
      var placed = ctx.seq[i];
      if(placed){ sel.push(placed.id); }
      items.push({name:'Position '+(i+1), state: placed? (placed.id===s.id?'correct':'wrong'):'missed',
        note: placed? (placed.id===s.id? '' : 'you put &ldquo;'+stripTags(placed.html)+'&rdquo; here') : 'empty'});
    });
    ctx.distr.forEach(function(d){
      if(d._used){ items.push({name:stripTags(d.html), state:'wrong', note:'this unrelated item does not belong in the sequence'}); }
    });
    return { selectedItems:sel, correctItems:correctIds, items:items,
      correctText: ex.sequence.map(function(s,i){ return (i+1)+'. '+stripTags(s.html); }).join('<br>'),
      explain: ex.explain, study: ex.study };
  }
};

/* ===== TERMINAL (fake shell + normaliser + element scoring) ===== */
function normCmd(s){
  return String(s||'').replace(/\r/g,'').trim().toLowerCase()
    .split('\n').map(function(l){ return l.replace(/\s+/g,' ').trim(); })
    .filter(function(l){ return l.length>0; }).join(' && ');
}
WIDGETS.terminal = {
  render: function(ex, host, ctx){
    ctx.lines = [];
    var wrap = el('div');
    var syn = ex.syntaxPanel? '<div class="syntax">'+ex.syntaxPanel+'</div>' : '';
    var shape = ex.outputSample? '<div class="syntax"><b>What success looks like</b> &mdash; expected output shape:<br><span class="mono-shape">'+esc(ex.outputSample)+'</span></div>' : '';
    wrap.innerHTML = syn + shape + '<div class="term"><div class="term-scroll" id="termout"></div>'+
      '<div class="term-line"><span class="pr">'+esc(ex.prompt)+'</span><input id="termin" type="text" autocomplete="off" spellcheck="false" aria-label="Type your command and press Enter"></div></div>'+
      '<p class="muted mt8">Type the command and press Enter. Nothing is really executed &mdash; this is a safe simulation. Press Check when you believe your command is right.</p>';
    host.appendChild(wrap);
    var out = host.querySelector('#termout'), inp = host.querySelector('#termin');
    function print(t, cls){
      var d = el('div', null, esc(t).replace(/\n/g,'<br>')); if(cls) d.style.color = cls;
      out.appendChild(d); out.scrollTop = out.scrollHeight;
    }
    print(ex.banner||'simulation shell ready - type the command for the goal above');
    inp.addEventListener('keydown', function(e){
      if(e.key==='Enter'){
        var v = inp.value; inp.value='';
        if(!v.trim()) return;
        ctx.lines.push(v.trim());
        print(ex.prompt+' '+v);
        var n = normCmd(v);
        if(ex.outputFor && ex.outputFor(n)){ print(ex.outputFor(n), '#9fe8bd'); }
        else if(ex.altOutputFor && ex.altOutputFor(n)){ print(ex.altOutputFor(n), '#f4d38a'); }
        else { print('command not found (this simulation only knows the commands the task needs)', '#ffa3a3'); }
      }
    });
  },
  grade: function(ex, ctx){
    var norm = normCmd(ctx.lines.join('\n'));
    var sel = [], correctIds = [], items = [];
    ex.elements.forEach(function(elm, i){
      var ok = elm.test(norm);
      correctIds.push('e'+i);
      if(ok) sel.push('e'+i);
      items.push({name:elm.name, state: ok?'correct':'missed', note: ok? '' : 'this required part was not found in what you typed'});
    });
    (ex.wrongTests||[]).forEach(function(w){
      if(w.test(norm)){
        items.push({name:w.name, state:'wrong', note:w.note||''});
      }
    });
    var danger = (ex.wrongTests||[]).filter(function(w){ return w.test(norm) && w.danger; });
    return { selectedItems:sel, correctItems:correctIds, items:items,
      correctText: '<div class="mono-block">'+esc(ex.canonical)+'</div>' + (ex.canonicalNote? '<div class="muted">'+ex.canonicalNote+'</div>':''),
      outcome: danger.length? ('<b>Careful:</b> your input included a command that would have changed or destroyed evidence: '+esc(danger.map(function(d){return d.name;}).join(', '))+'. In a real incident that can be a serious mistake.') : '',
      explain: ex.explain, study: ex.study };
  }
};

/* ===== LOGVIEW (filterable log panel + inner answer widget) ===== */
WIDGETS.logview = {
  render: function(ex, host, ctx){
    var wrap = el('div');
    wrap.innerHTML = '<div class="lv-wrap"><div class="lv-bar"><span class="muted">filter:</span>'+
      '<input id="lvfilter" type="text" placeholder="type to filter lines (for example 4771)"></div>'+
      '<div class="lv" id="lvlines"></div></div><div class="mt14" id="lvinner"></div>';
    host.appendChild(wrap);
    var lv = wrap.querySelector('#lvlines');
    function draw(f){
      lv.innerHTML='';
      ex.logs.forEach(function(l){
        var hay = (l.t+' '+l.text).toLowerCase();
        if(f && hay.indexOf(f.toLowerCase())===-1) return;
        var d = el('div','lv-line sev-'+(l.sev||'info'));
        d.innerHTML = '<span class="t">'+esc(l.t)+'</span><span class="g">'+esc(l.text)+'</span>';
        lv.appendChild(d);
      });
      if(!lv.children.length){ lv.innerHTML = '<div class="lv-line"><span class="g muted">no lines match the filter</span></div>'; }
    }
    draw('');
    wrap.querySelector('#lvfilter').addEventListener('input', function(e){ draw(e.target.value.trim()); });
    var innerHost = wrap.querySelector('#lvinner');
    WIDGETS[ex.inner.type].render(ex.inner, innerHost, ctx);
  },
  grade: function(ex, ctx){
    var res = WIDGETS[ex.inner.type].grade(ex.inner, ctx);
    return res;
  }
};

/* ===== BRANCH (multi-step; auto-pause only on the final Check) ===== */
WIDGETS.branch = {
  render: function(ex, host, ctx){
    ctx.sels = [];
    function drawStep(){
      var i = ctx.stepIdx;
      var st = ex.steps[i];
      var cr = byId('checkrow');
      if(cr){ cr.classList.toggle('hide', i !== ex.steps.length-1); }
      host.innerHTML = '<span class="stepchip">STEP '+(i+1)+' OF '+ex.steps.length+'</span>'+
        '<div class="bank-label">'+esc(st.label||'')+'</div>';
      var w2 = el('div'); host.appendChild(w2);
      var opts = shuffle(st.options.map(function(o,j){ return {id:'s'+i+'o'+j, html:o.html, correct:!!o.correct}; }));
      ctx['opts'+i] = opts;
      opts.forEach(function(o,j){
        var b = el('button','opt');
        b.setAttribute('type','button'); b.setAttribute('aria-pressed','false');
        b.innerHTML = '<span class="key">'+letter(j)+'.</span><span>'+o.html+'</span>';
        b.addEventListener('click', function(){
          ctx.sels[i] = o.id;
          w2.querySelectorAll('.opt').forEach(function(x){ x.setAttribute('aria-pressed','false'); });
          b.setAttribute('aria-pressed','true');
        });
        w2.appendChild(b);
      });
      var bar = el('div','mt8');
      var btn = el('button','btn '+(i===ex.steps.length-1?'primary':''), (i===ex.steps.length-1? 'Check final answer' : 'Confirm and continue'));
      btn.addEventListener('click', function(){
        if(ctx.sels[i]==null){ btn.textContent='Select an answer first'; setTimeout(function(){ btn.textContent=(i===ex.steps.length-1?'Check final answer':'Confirm and continue'); }, 1200); return; }
        if(i===ex.steps.length-1){ onCheck(); }
        else { ctx.stepIdx++; drawStep(); } /* intermediate confirm: no auto-pause, timer keeps running */
      });
      bar.appendChild(btn);
      host.appendChild(bar);
    }
    drawStep();
  },
  grade: function(ex, ctx){
    var sel = [], correctIds = [], items = [];
    ex.steps.forEach(function(st, i){
      var opts = ctx['opts'+i];
      var correct = opts.filter(function(o){ return o.correct; })[0];
      correctIds.push(correct.id);
      var chosen = ctx.sels[i];
      if(chosen) sel.push(chosen);
      var chosenObj = opts.filter(function(o){ return o.id===chosen; })[0];
      items.push({name:'Step '+(i+1), state: chosenObj? (chosenObj.correct?'correct':'wrong'):'missed',
        note: chosenObj && !chosenObj.correct ? ('you chose: '+stripTags(chosenObj.html)) : ''});
    });
    return { selectedItems:sel, correctItems:correctIds, items:items,
      correctText: ex.steps.map(function(st,i){
        var opts = ctx['opts'+i];
        var c = opts.filter(function(o){ return o.correct; })[0];
        return 'Step '+(i+1)+': '+stripTags(c.html);
      }).join('<br>'),
      explain: ex.explain, study: ex.study };
  }
};

/* ---------- site handshake (optional; exam works without it) ---------- */
window.addEventListener('message', function(event){
  if(!event.data) return;
  if(event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  if(S){ S.username = event.data.username || S.username; }
});

/* ---------- boot ---------- */
S = freshState();
S.username = '';
T.remaining = M.timerSeconds;
buildHeader();
renderIntro();
updateHeader();
updateTimerUI();
/* track pause durations for the results report */
(function(){
  var last = null;
  setInterval(function(){
    if(T.state==='PAUSED_MANUAL') T.manualSec++;
    if(T.state==='PAUSED_AUTO_CHECK') T.autoSec++;
  }, 1000);
})();
})();
