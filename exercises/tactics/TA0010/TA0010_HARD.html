{ id: "H1", type: "qcm",
  sum: "TLS to :8443 — which technique label survives review?",
  blocks: [
    { label: "ARTEFACT 1 — Firewall flow (WS-LGL-08)", kind: "log", text: "21:14:55  ALLOW 10[.]0[.]12[.]31:51870 -> 203[.]0[.]113[.]201:8443  proto 6, 94 KB out / 12 KB in, session 26 min\n21:41:10  ALLOW 10[.]0[.]12[.]31:51899 -> 203[.]0[.]113[.]201:8443  proto 6, session 31 min" },

  ],
  q: "Two long TLS sessions from a workstation to one external IP on port 8443. Which technique label survives a CTI review?",
  hint: "Ask three questions: is the port odd, is any application protocol visible, and is anything wrapped inside anything else?",
  w: { type: "qcm", mode: "single", options: [
    "T1071.001 — Web Protocols: the traffic is TLS, which is what web beacons use",
    "T1571 — Non-Standard Port: TLS does not belong on 8443 egress from a workstation",

    "T1090 — Proxy: the pinned IP proves the traffic hops through a relay"

  exp: "<p>The defensible label is <b>T1571</b>: a known protocol (TLS) on a port workstations never use for it. T1071.001 would need HTTP semantics — none are visible, and the implant pinned the IP without DNS. Tunneling would need evidence that RDP/SOCKS/SSH rides inside; 'TLS' alone does not show a wrapper. A relay would still look like a normal hop — a pinned IP is not proof of proxying. Port evidence is thin but exactly what T1571 describes.</p>",

{ id: "H2", type: "qcm", logFilter: true,
  sum: "Trusted SNI, hostile IP — what is the channel doing?",
  blocks: [
    { label: "ARTEFACT 1 — Zeek http.log + tls.log (WS-PRC-02)", kind: "log", text: "02:31:12  TLS   SNI=static-assets[.]example-cdn[.]net  dst=203[.]0[.]113[.]201:443  JA3=72a589da586844d7f0818ce684948eea\n02:31:13  HTTP  POST /media/metric.png Host: static-assets[.]example-cdn[.]net  body=418B\n02:36:14  TLS   SNI=static-assets[.]example-cdn[.]net  dst=203[.]0[.]113[.]201:443  JA3=72a589da586844d7f0818ce684948eea" },
    { label: "ARTEFACT 2 — Asset intel", text: "<p>The real CDN serving static-assets[.]example-cdn[.]net publishes ranges 198[.]51[.]100[.]0/24. The observed destination 203[.]0[.]113[.]201 is a bulletproof hoster. JA3 72a589… matches a common offensive framework's default TLS stack. The proxy categorises the SNI domain as 'trusted CDN' (stale feed).</p>" }
  ],
  q: "The SNI is a trusted CDN name, but the IP is not the CDN's. What is the channel actually doing?",
  hint: "One signal is what the client CLAIMS to talk to; the other is where packets truly went. Which one does fronting abuse?",
  w: { type: "qcm", mode: "single", options: [
    "Plain web beaconing (T1071.001) to a CDN the marketing team also uses today",
    "Fast flux DNS (T1568.001): the CDN domain rotates its A records every hour",
    "Non-standard data encoding (T1132.002): the PNG body is XOR-encoded twice",
    "Domain fronting (T1090.004): the trusted SNI is a decoy; the real endpoint is the hostile IP"
  ], correct: [3] },
  exp: "<p>Fronting works by putting a trusted domain in the TLS SNI while the packets land on an unrelated host that serves the real implant. The SNI-vs-IP mismatch plus the offensive JA3 plus 5-minute POSTs is that exact signature. Plain CDN use would show CDN-owned IPs; fast flux is a DNS-side rotation (not present); encoding hides content but does not explain the IP mismatch. Note the proxy category failed here — reputation feeds on SNI alone are fronting's first victim.</p>",

  w: { type: "qcm", mode: "single", optsCode: true, options: [

  exp: "<p>A is the Windows Time service polling its NTP source — the 64-second interval is the vendor default, the destination is Microsoft's, and the payload is a clock sync. It looks the most robotic of the four, which is the trap. B is a jittered web beacon; C is a server uploading data over FTP at night; D is DNS tunneling. All three deserve escalation; A deserves a yawn.</p>",

{ id: "H4", type: "dragdrop", dual: "<p><b>Attacker view:</b> resilience (fallbacks, relays, encryption) keeps the channel alive; blending (encoding, junk, mimicry) keeps it invisible. Both are needed — losing either loses the channel. <b>Defender view:</b> resilience indicators cluster in flow data (ports, endpoints, TLS), blending indicators cluster in content (bodies, names, formats) — look at both layers when hunting.</p>",

entity: `
<h2 class="ent-title">What is TA0010 — Command and Control?</h2>
<p><b>TA0010</b> is the ID of one <b>tactic</b> in the MITRE ATT&amp;CK framework. MITRE ATT&amp;CK is a free, public catalogue. It describes what real attackers do, step by step. A <b>tactic</b> is a goal. It says what the attacker wants to reach at one stage of an attack. It is not a single tool or a single command. It is the <b>objective</b>.</p>
<p>TA0010 is the goal called <b>Command and Control</b>. Many people call it <b>C2</b> or <b>C&amp;C</b>. It means this: the attacker already broke into a computer. Now they want to <b>talk with that computer from far away</b>, so they can control it. They send commands in. The infected machine sends answers and stolen data out. This two-way channel is the heart of most real attacks.</p>
<p><b>Imagine you are a guard in an office at night.</b> A thief got in last week. Entering the building was one goal (in ATT&amp;CK that is the tactic called Initial Access). Tonight the thief phones a friend outside and asks, <i>"What should I do next?"</i> The friend answers, <i>"Open the server room."</i> That phone line is Command and Control. If you cut the phone line, the thief inside is cut off from the boss outside.</p>
<p>Attackers try hard to make this channel look normal. They often use the <b>same protocols you use every day</b>: HTTPS web traffic, DNS name lookups, or remote help tools. They may encrypt it, send it through proxies, use strange ports, or switch to backup servers when you block them. That is why C2 has many techniques, such as Web Protocols (T1071.001), Encrypted Channel (T1573), Proxy (T1090), Non-Standard Port (T1571), Dynamic Resolution (T1568), and Fallback Channels (T1008).</p>

<h3>Why this matters, and where you will use it at work</h3>
<p>Command and Control is one of the most important things a defender can catch. Why? Because almost every serious attack needs it. If the attacker cannot reach their C2 server, they are often stuck. They cannot receive the next command, steal data, or spread further. Catching C2 early can stop a small problem before it becomes a big breach.</p>
<p>You will meet TA0010 in many roles:</p>
<ul>
<li><b>SOC analyst (Tier 1 / Tier 2):</b> You triage alerts. A proxy alert says a workstation contacts a strange website every 60 seconds. You decide: real C2, or normal software? You use the playbook, then you escalate.</li>
<li><b>Threat hunter:</b> You write hunting hypotheses. Examples: <i>"Are there periodic outbound connections with small jitter?"</i>, <i>"Are there rare domains first seen this month?"</i> You search DNS, proxy, firewall and endpoint data.</li>
<li><b>Incident responder (IR):</b> During an incident you find the C2 channel, block it, isolate hosts, and keep evidence safe. You must know how C2 behaves to contain it without losing proof.</li>
<li><b>Cyber threat intelligence (CTI) analyst:</b> You map attacker behaviour to ATT&amp;CK. You write reports that say "this group used TA0010 with these techniques", and you brief the CISO.</li>
<li><b>Detection engineer:</b> You turn C2 behaviour into detection rules in a SIEM, EDR or NDR tool. You tune them so real beacons alert and normal traffic does not.</li>
<li><b>Red teamer / pentester:</b> You use C2 frameworks (like Cobalt Strike in a legal test) to check if the blue team can see your channel. You report what worked.</li>
<li><b>GRC analyst / control owner:</b> You write and check policies: egress filtering, proxy rules, DNS controls, network segmentation. You map them to NIST CSF or CIS Controls.</li>
</ul>
<p>The tools you will touch include: <b>firewalls, web proxies, DNS resolvers and sinkholes, Network Intrusion Prevention (NIPS/IDS), packet capture (PCAP), Zeek and Suricata, NetFlow, EDR agents, and SIEM platforms</b>. Typical documents and deliverables are: alert tickets, hunt reports, detection rules, IR findings, and executive briefings.</p>
<p><b>This exam trains TA0010 itself</b> — the goal, its techniques, the data they leave behind, and the defences that work against them. Read every explanation. It teaches you the tactic.</p>
`,

instructions: function (cfg) {
  return `
<h2>How this exam works</h2>
<ul>
<li><b>Goal:</b> master <b>${cfg.obj}</b> at <b>${cfg.sev}</b> level. There are <b>${cfg.count} exercises</b>. The pass mark is <b>70%</b>. You have <b>${cfg.minutes} minutes</b>.</li>
<li><b>Exercise types:</b> multiple choice, matching, drag &amp; drop, ordering, fill-in-the-blank, log reading with a filter box, a fake terminal where you type a command, alert triage queues, and multi-step decisions.</li>
<li><b>Partial credit:</b> exercises with several items are scored <b>per item</b>. Formula: <code>credit = (correct items − wrong items) ÷ total items</code>, never below zero. Selecting everything "to be safe" gives you <b>0</b>, because wrong picks subtract. A partly right answer still earns part of the point.</li>
<li><b>Check = free time:</b> when you press <b>Check</b>, the timer <b>stops automatically</b>. You can study the feedback and explanation for as long as you want. The timer starts again only when you press <b>Next</b> (or Final Submit on the last exercise).</li>
<li><b>Manual pause:</b> the Pause button stops the timer and hides the exercise. Press Resume to continue. This is for a real break.</li>
<li><b>Hint:</b> one hint per exercise. It costs <b>−10% of that exercise's credit</b>. It is a nudge, not the answer.</li>
<li><b>Skip:</b> every exercise has a Skip button. Skipping is free and does not stop the timer. Skipped-and-never-answered exercises are <b>excluded from your score</b>. Before you finish, a "Review skipped" screen lets you go back and answer them while time remains.</li>
<li><b>Retry:</b> if you fail, you can retake the exam. Questions and answer options are shuffled again.</li>
</ul>`;
}

</script>
<script>
/* Exam engine core: state, timer FSM, partial-credit scoring, flow, results, site contract. */
(function () {
'use strict';
var D = window.EXAM_DATA;
var SH = window.SHARED;
var SEV = { easy: 'EASY', medium: 'MEDIUM', hard: 'HARD', 'extremely-hard': 'EXTREMELY HARD' };
var SEVCLS = { easy: 'sev-easy', medium: 'sev-medium', hard: 'sev-hard', 'extremely-hard': 'sev-xhard' };

/* ---------- tiny utils ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmtT(sec) { sec = Math.max(0, sec); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function hlLine(line) {
  var e = esc(line);
  e = e.replace(/\b(deny|DENY|DROP|REJECT|blocked)\b/g, '<span class="deny">$1</span>');
  e = e.replace(/\b(allow|ALLOW|ACCEPT|ESTABLISHED|LISTEN)\b/g, '<span class="ok">$1</span>');
  e = e.replace(/\b(GET|POST|PUT|HEAD|DNS|TXT|MX|PTR|CNAME|NXDOMAIN|SRV|HTTPS|HTTP|SSH|FTP)\b/g, '<span class="v">$1</span>');
  e = e.replace(/\b\d{1,3}(?:\[\.\]\d{1,3}){3}\b/g, '<span class="n">$&</span>');
  e = e.replace(/:\d{2,5}\b/g, '<span class="n">$&</span>');
  return e;
}

/* ---------- scoring (spec formula) ---------- */
window.scoreExercise = function (H, W, N) { return Math.max(0, (H - W) / N); };

/* ---------- state ---------- */
var S = null;
function newState() {
  return {
    order: shuffle(D.exercises.map(function (_, i) { return i; })),
    pos: 0, fromReview: false,
    answered: {},           /* idx -> {credit,label,N,H,W,hinted} */
    pool: [],               /* skipped, unanswered indices */
    hints: {},
    checkedNow: false,
    creditSum: 0, answeredCount: 0,
    timeLeft: D.meta.estimatedMinutes * 60,
    fsm: 'IDLE', prevFsm: null,
    manualSec: 0, autoSec: 0,
    reported: false,
    user: '',
    mini: false, miniLeft: 0
  };
}
function currentIdx() { return S.order[S.pos]; }
function currentEx() { return D.exercises[currentIdx()]; }

/* ---------- toast ---------- */
var toastEl = null, toastTimer = null;
function toast(msg) {
  if (!toastEl) { toastEl = el('div', 'toast'); document.body.appendChild(toastEl); }
  toastEl.textContent = msg; toastEl.classList.remove('hide');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.add('hide'); }, 3400);
}

/* ---------- app shell ---------- */
function buildShell() {
  var app = $('#app');
  app.innerHTML = '<div id="v-exam" class="hidden"><div class="exam-header"><div class="hrow">' +
    '<span class="hstat cnt">Exercise – of –</span>' +
    '<span class="hstat sevbadge"><span class="badge small"></span></span>' +
    '<span class="hstat timer" id="h-timer">⏱ --:--</span>' +
    '<span class="hstat" id="h-score">★ 0.0 / 0 · 0%</span>' +
    '<span class="hbtns">' +
    '<button id="h-hint" type="button">💡 Hint</button>' +
    '<button id="h-pause" type="button">⏸ Pause</button>' +
    '<button id="h-skip" type="button">⏭ Skip</button>' +
    '</div></div></div>' +
    '<div class="wrap"><div id="v-body"></div></div>' +
    '<div id="v-overlay"></div>';
  $('#h-hint').addEventListener('click', onHint);
  $('#h-pause').addEventListener('click', onPause);
  $('#h-skip').addEventListener('click', onSkip);
}

/* ---------- intro ---------- */
function showIntro() {
  $('#v-exam').classList.add('hidden');
  var body = $('#v-body');
  var cfg = { obj: 'TA0010 — Command and Control', sev: SEV[D.meta.difficulty], count: D.exercises.length, minutes: D.meta.estimatedMinutes };
  body.innerHTML = '<div class="intro-hero">' +
    '<div class="sev-line"><h1>TA0010 — Command and Control</h1><span class="badge">' + SEV[D.meta.difficulty] + ' · tier ' + D.meta.batch + ' of 4</span></div>' +
    '<div class="sev-line small">' + esc(D.intro.sevNote) + '</div>' +
    SH.entity +
    '<div class="kw-panel"><h3>Keywords covered in this exam</h3>' +
    SH.keywords.map(function (k) {
      return '<div class="kw-theme">' + esc(k.theme) + '</div><ul class="kw-items">' +
        k.items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>';
    }).join('') + '</div>' +
    SH.instructions(cfg) +
    '<div class="start-row"><button class="primary" id="btn-start" type="button">▶ Start the exam</button>' +
    '<span class="small">Timer: ' + cfg.minutes + ' minutes · Pass mark: 70% · ' + cfg.count + ' exercises</span></div>' +
    '</div>';
  $('#btn-start').addEventListener('click', startExam);
  window.scrollTo(0, 0);
}

/* ---------- timer FSM ---------- */
var tickHandle = null;
function setFsm(next) { S.fsm = next; updateHeader(); }
function startTicker() {
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function () {
    if (!S) return;
    if (S.fsm === 'RUNNING') {
      S.timeLeft -= 1;
      if (S.mini && !S.checkedNow && S.miniLeft > 0) {
        S.miniLeft -= 1;
        var mt = $('#mini-t');
        if (mt) mt.textContent = '⏱ This exercise: ' + S.miniLeft + 's (reduced timer — on expiry it moves to the skipped pool)';
        if (S.miniLeft <= 0) {
          toast('⏱ Time for this exercise ended — moved to the skipped pool (no answer revealed).');
          doSkip(true);
          return;
        }
      }
      if (S.timeLeft <= 0) { finishByTimeout(); return; }
    } else if (S.fsm === 'PAUSED_MANUAL') { S.manualSec += 1; }
    else if (S.fsm === 'PAUSED_AUTO_CHECK') { S.autoSec += 1; }
    updateHeader();
  }, 1000);
}
function finishByTimeout() {
  S.timeLeft = 0; setFsm('ENDED');
  toast('⏱ Time is over. Unanswered and skipped exercises were excluded.');
  showResults();
}

/* ---------- header ---------- */
function updateHeader() {
  var cnt = $('.cnt'); if (!cnt || !S) return;
  cnt.textContent = 'Exercise ' + Math.min(S.pos + 1, D.exercises.length) + ' of ' + D.exercises.length;
  $('.sevbadge .badge').textContent = SEV[D.meta.difficulty];
  var n = S.answeredCount, sum = S.creditSum;
  var pct = n > 0 ? Math.round((sum / n) * 100) : 0;
  $('#h-score').textContent = '★ ' + sum.toFixed(1) + ' / ' + n + ' · ' + pct + '%';
  var t = $('#h-timer');
  t.className = 'hstat timer';
  $('#h-skip').textContent = '⏭ Skip' + (S.pool.length ? ' (' + S.pool.length + ')' : '');
  if (S.fsm === 'RUNNING') { t.classList.add('state-run'); t.innerHTML = '⏱ ' + fmtT(S.timeLeft) + ' · RUNNING'; }
  else if (S.fsm === 'PAUSED_MANUAL') { t.classList.add('state-manual'); t.innerHTML = '⏸ PAUSED — manual (press Resume)'; }
  else if (S.fsm === 'PAUSED_AUTO_CHECK') { t.classList.add('state-auto'); t.innerHTML = '⏸ PAUSED — reviewing feedback (resumes on Next)'; }
  else { t.classList.add('state-end'); t.innerHTML = '⏹ ENDED'; }
}

/* ---------- exam flow ---------- */
function startExam() {
  S = newState();
  $('#v-exam').classList.remove('hidden');
  setFsm('RUNNING');
  startTicker();
  S.pos = 0;
  renderCurrent();
  window.scrollTo(0, 0);
}
function nextUnansweredPos(from) {
  for (var i = from; i < S.order.length; i++) {
    if (!S.answered[S.order[i]]) return i;
  }
  return -1;
}
function nextFreshPos(from) {
  /* next exercise that is neither answered nor sitting in the skipped pool */
  for (var i = from; i < S.order.length; i++) {
    var id = S.order[i];
    if (!S.answered[id] && S.pool.indexOf(id) < 0) return i;
  }
  return -1;
}
function advance() {
  var p = nextFreshPos(S.pos + 1);
  if (p < 0) p = nextFreshPos(0);
  if (p >= 0) { S.pos = p; renderCurrent(); return; }
  if (S.pool.length > 0) { showReview(); return; }
  finishExam();
}
function renderCurrent() {
  S.checkedNow = false; S.mini = false;
  $('#h-hint').disabled = false;
  $('#h-skip').disabled = false;
  var idx = currentIdx(), ex = D.exercises[idx];
  var body = $('#v-body');
  var card = el('div', 'card');
  card.innerHTML = '<div class="card-head"><span class="cnt">Exercise ' + (S.pos + 1) + ' of ' + D.exercises.length + '</span>' +
    '<span class="badge small">' + SEV[D.meta.difficulty] + '</span>' +
    (ex.dual ? '<span class="badge small" style="background:var(--blue-bg);color:var(--blue);border-color:var(--blue)">⚔ dual perspective</span>' : '') +
    '</div>' + scenarioHTML(ex) +
    '<div class="block b-question"><div class="block-h">❓ QUESTION</div><div class="block-b"><div class="qtext">' + esc(ex.q) + '</div></div></div>' +
    '<div class="block b-answer"><div class="block-h">✍ YOUR ANSWER</div><div class="block-b" id="ansbox"></div></div>' +
    '<div id="fb-slot"></div>' +
    '<div class="nextrow"><button class="primary" id="btn-check" type="button">✓ Check</button>' +
    '<span class="small" id="check-note"></span></div>';
  body.innerHTML = '';
  body.appendChild(card);
  wireScenario(ex);
  if (ex.miniSeconds) {
    S.mini = true; S.miniLeft = ex.miniSeconds;
    $('#ansbox').insertAdjacentHTML('beforebegin', '<div class="mini-timer" id="mini-t">⏱ This exercise: ' + S.miniLeft + 's (reduced timer — on expiry it moves to the skipped pool)</div>');
  }
  var ctrl = { setCheck: function (on) { var b = $('#btn-check'); if (b) b.disabled = !on; } };
  S.widget = window.WIDGETS[ex.type](ex, $('#ansbox'), ctrl);
  $('#btn-check').addEventListener('click', onCheck);
  $('#check-note').textContent = ex.type === 'steps'
    ? 'Grades every step at once. Intermediate steps do not stop the timer — only this final Check does.'
    : 'Check grades your answer and stops the timer so you can study the feedback.';
  updateHeader();
  window.scrollTo(0, 0);
}
function scenarioHTML(ex) {
  var inner = '';
  (ex.blocks || []).forEach(function (b, i) {
    var label = b.label || (ex.blocks.length > 1 ? 'ARTEFACT ' + (i + 1) : '');
    var content = b.kind === 'log'
      ? '<pre class="log">' + b.text.split('\n').map(hlLine).join('\n') + '</pre>'
      : '<div>' + b.text + '</div>';
    inner += '<div class="artefact">' + (label ? '<div class="artefact-h">' + esc(label) + '</div>' : '') +
      '<div class="artefact-b">' + content;
    if (b.kind === 'log' && ex.logFilter) {
      inner += '<div class="logfilter"><label>Filter:</label><input type="text" placeholder="type to filter lines…"></div>';
    }
    inner += '</div></div>';
  });
  var sum = esc(ex.sum || 'Scenario');
  return '<div class="block b-scenario" id="scen"><div class="block-h">🗂 SCENARIO' +
    '<button class="collapser" id="btn-coll" type="button" aria-expanded="true">▾ Collapse</button></div>' +
    '<div class="coll-summary hidden" id="scen-sum">' + sum + ' — collapsed</div>' +
    '<div class="block-b" id="scen-b">' + inner + '</div></div>';
}
function wireScenario(ex) {
  var btn = $('#btn-coll');
  if (btn) btn.addEventListener('click', function () {
    var b = $('#scen-b'), s = $('#scen-sum');
    var open = !b.classList.contains('hidden');
    if (open) { b.classList.add('hidden'); s.classList.remove('hidden'); btn.textContent = '▸ Expand'; btn.setAttribute('aria-expanded', 'false'); }
    else { b.classList.remove('hidden'); s.classList.add('hidden'); btn.textContent = '▾ Collapse'; btn.setAttribute('aria-expanded', 'true'); }
  });
  $$('#scen .logfilter input').forEach(function (inp) {
    var pre = inp.closest('.artefact').querySelector('pre.log');
    if (!pre.getAttribute('data-raw')) pre.setAttribute('data-raw', pre.textContent);
    inp.addEventListener('input', function () {
      var f = inp.value.toLowerCase();
      var lines = pre.getAttribute('data-raw').split('\n');
      pre.innerHTML = lines.filter(function (l) { return l.toLowerCase().indexOf(f) >= 0; }).map(hlLine).join('\n');
    });
  });
}

/* ---------- check / hint / skip / pause ---------- */
function onCheck() {
  if (!S || S.checkedNow || S.fsm === 'ENDED') return;
  var idx = currentIdx(), ex = D.exercises[idx];
  var ans = S.widget.getAnswer();
  var g = S.widget.grade(ans);
  var credit0 = window.scoreExercise(g.H, g.W, g.N);
  var hinted = !!S.hints[idx];
  var credit = hinted ? Math.max(0, credit0 - 0.10) : credit0;
  var label;
  if (g.N === 1) { label = (g.H - g.W > 0) ? 'CORRECT' : 'INCORRECT'; }
  else { label = (credit === 1) ? 'CORRECT' : (credit > 0 ? 'PARTIALLY CORRECT' : 'INCORRECT'); }
  S.answered[idx] = { credit: credit, label: label, N: g.N, H: g.H, W: g.W, hinted: hinted };
  S.creditSum += credit; S.answeredCount += 1;
  var p = S.pool.indexOf(idx); if (p >= 0) S.pool.splice(p, 1);
  S.checkedNow = true;
  /* spec: the Check button's FIRST action is the FSM transition — feedback renders after it */
  if (S.fsm === 'RUNNING' || S.fsm === 'PAUSED_MANUAL') { S.prevFsm = S.fsm; setFsm('PAUSED_AUTO_CHECK'); }
  S.widget.lock();
  $('#btn-check').disabled = true;
  $('#h-skip').disabled = true; $('#h-hint').disabled = true;
  renderFeedback(ex, idx, S.answered[idx], g);
  updateHeader();
}
function renderFeedback(ex, idx, rec, g) {
  var slot = $('#fb-slot');
  var cls = rec.label === 'CORRECT' ? 'fb-ok' : (rec.label === 'PARTIALLY CORRECT' ? 'fb-part' : 'fb-bad');
  var icon = rec.label === 'CORRECT' ? '✓' : (rec.label === 'PARTIALLY CORRECT' ? '◑' : '✗');
  var h = '<div class="feedback ' + cls + '" aria-live="polite"><div class="fb-h"><span>' + icon + '</span><span>' + rec.label + '</span></div><div class="fb-b">';
  if (rec.N > 1) h += '<div class="creditline">credit ' + rec.credit.toFixed(2) + ' — ' + rec.H + '/' + rec.N + ' items' + (rec.hinted ? ' (includes −10% hint penalty)' : '') + '</div>';
  else if (rec.hinted) h += '<div class="creditline">credit ' + rec.credit.toFixed(2) + ' (includes −10% hint penalty)</div>';
  if (g.items && g.items.length && (rec.N > 1 || rec.credit < 1)) {
    h += '<ul class="itemlist">' + g.items.map(function (it) {
      var ic = it.state === 'ok' ? '<span class="ic-ok">✓ Correct</span>' : (it.state === 'wrong' ? '<span class="ic-wrong">✗ Wrong</span>' : '<span class="ic-miss">○ Missed</span>');
      return '<li>' + ic + '<span>' + it.label + '</span></li>';
    }).join('') + '</ul>';
  }
  h += g.extraHTML || '';
  h += '<div class="fb-exp">' + ex.exp + '</div>';
  if (ex.dual) h += '<div class="fb-exp">' + ex.dual + '</div>';
  if (rec.label !== 'CORRECT' && ex.study) h += '<div class="study"><b>What to study:</b> ' + esc(ex.study) + '</div>';
  h += '</div></div>';
  var lastAnsweredAll = nextFreshPos(0) < 0;
  var nextLabel = (lastAnsweredAll && S.pool.length === 0) ? 'Final Submit ▸' : (S.fromReview ? 'Back to review ▸' : 'Next ▸');
  h += '<div class="nextrow"><button class="primary" id="btn-next" type="button">' + nextLabel + '</button></div>';
  slot.innerHTML = h;
  $('#btn-next').addEventListener('click', onNext);
  var fb = $('.feedback');
  if (fb) fb.scrollIntoView({ block: 'nearest' });
}
function onNext() {
  if (S.fsm === 'PAUSED_AUTO_CHECK') { S.prevFsm = null; setFsm('RUNNING'); }
  if (S.fromReview) {
    S.fromReview = false;
    if (S.pool.length > 0) { showReview(); return; }
    advance(); return;
  }
  advance();
}
function onHint() {
  if (!S || S.checkedNow || S.fsm === 'ENDED') return;
  var idx = currentIdx(), ex = D.exercises[idx];
  if (S.hints[idx]) return;
  S.hints[idx] = true;
  $('#h-hint').disabled = true;
  var box = el('div', 'hintbox', '<b>💡 Hint (−10% of this exercise\'s credit):</b> ' + esc(ex.hint));
  $('#ansbox').appendChild(box);
}
function onSkip() {
  if (!S || S.checkedNow || S.fsm === 'ENDED') return;
  doSkip(false);
}
function doSkip() {
  var idx = currentIdx();
  if (S.answered[idx]) return;
  if (S.pool.indexOf(idx) < 0) S.pool.push(idx);
  S.checkedNow = false;
  toast('⚠ Skipped — it stays in the pool and is excluded from the score unless you answer it.');
  var p = nextFreshPos(S.pos + 1);
  if (p < 0) p = nextFreshPos(0);
  if (p >= 0 && S.order[p] !== idx) { S.pos = p; renderCurrent(); return; }
  showReview();
}
function onPause() {
  if (!S || S.fsm === 'ENDED') return;
  if (S.fsm === 'PAUSED_MANUAL') { resumeManual(); return; }
  S.prevFsm = S.fsm;
  setFsm('PAUSED_MANUAL');
  $('#v-overlay').innerHTML = '<div class="overlay" role="dialog" aria-label="Manual pause"><div class="obox"><h2>⏸ Paused (manual)</h2><p>The timer is stopped and the exercise is hidden. This pause does not use your feedback-review time.</p><button class="primary" id="btn-resume" type="button">▶ Resume</button></div></div>';
  $('#btn-resume').addEventListener('click', resumeManual);
}
function resumeManual() {
  $('#v-overlay').innerHTML = '';
  if (S.checkedNow) { setFsm('PAUSED_AUTO_CHECK'); } /* resumed on top of auto-pause */
  else { setFsm('RUNNING'); }
  S.prevFsm = null;
}

/* ---------- review skipped ---------- */
function showReview() {
  var body = $('#v-body');
  var h = '<div class="card"><h1>Review skipped exercises</h1>' +
    '<p>You still have <b>' + S.pool.length + '</b> skipped exercise' + (S.pool.length === 1 ? '' : 's') + ' without an answer. You can go back to any of them while the timer has time left. Skipped exercises you never answer are <b>excluded from the score</b>.</p>';
  if (S.pool.length === 0) h += '<p class="small">The pool is empty — everything was answered.</p>';
  S.pool.forEach(function (idx) {
    var ex = D.exercises[idx];
    h += '<div class="review-item"><span class="rt">' + esc(ex.sum) + '</span><button type="button" data-idx="' + idx + '" class="rvbtn">↩ Return to this exercise</button></div>';
  });
  h += '<div class="nextrow"><button class="primary" id="btn-finish" type="button">🏁 Final Submit</button></div></div>';
  body.innerHTML = h;
  $$('.rvbtn').forEach(function (b) {
    b.addEventListener('click', function () {
      var idx = parseInt(b.getAttribute('data-idx'), 10);
      S.pos = S.order.indexOf(idx);
      S.fromReview = true;
      renderCurrent();
    });
  });
  $('#btn-finish').addEventListener('click', finishExam);
  updateHeader();
  window.scrollTo(0, 0);
}

/* ---------- results ---------- */
function finishExam() { setFsm('ENDED'); showResults(); }
function showResults() {
  var n = S.answeredCount, sum = S.creditSum;
  var pct = n > 0 ? Math.round((sum / n) * 100) : 0;
  var passed = pct >= D.meta.passMark;
  var full = 0, part = 0, partSum = 0, zero = 0;
  Object.keys(S.answered).forEach(function (k) {
    var a = S.answered[k];
    if (a.credit === 1) full++;
    else if (a.credit > 0) { part++; partSum += a.credit; }
    else zero++;
  });
  var skippedTotal = D.exercises.length - n;
  var h = '<div class="results"><h1>Results — TA0010 ' + SEV[D.meta.difficulty] + '</h1>' +
    (S.user ? '<p class="small">Candidate: ' + esc(S.user) + '</p>' : '') +
    '<div class="score-big">' + sum.toFixed(1) + ' / ' + n + ' · ' + pct + '%</div>' +
    '<p>Pass mark: ' + D.meta.passMark + '%. The score counts only exercises you actually answered.</p>';
  if (passed) {
    h += '<div class="pass-panel"><div class="cert">Certificate of achievement</div><h2>✓ PASS — TA0010 Command and Control · ' + SEV[D.meta.difficulty] + '</h2><p>You reached ' + pct + '%. You showed a solid command of this tier. Keep going with the next tier of this topic.</p></div>';
  } else {
    h += '<div class="fail-panel"><h2>✗ FAIL — ' + pct + '%</h2><p>You must retake this exam to pass. Read the explanations you missed, then press Retake Exam. Questions and options will be shuffled again.</p><button class="primary" id="btn-retake" type="button">↻ Retake Exam</button></div>';
  }
  h += '<div class="statgrid">' +
    '<div class="stat"><div class="sv">' + full + '</div><div class="sl">✓ Fully correct</div></div>' +
    '<div class="stat"><div class="sv">' + part + '</div><div class="sl">◑ Partially correct' + (part ? ' · avg credit ' + (partSum / part).toFixed(2) : '') + '</div></div>' +
    '<div class="stat"><div class="sv">' + zero + '</div><div class="sl">✗ Fully incorrect</div></div>' +
    '<div class="stat"><div class="sv">' + skippedTotal + '</div><div class="sl">⚠ Skipped &amp; unanswered — excluded</div></div>' +
    '<div class="stat"><div class="sv">' + fmtT(D.meta.estimatedMinutes * 60 - S.timeLeft) + '</div><div class="sl">⏱ Time used (of ' + D.meta.estimatedMinutes + ' min)</div></div>' +
    '<div class="stat"><div class="sv">' + fmtT(S.manualSec) + '</div><div class="sl">⏸ Time paused manually</div></div>' +
    '<div class="stat"><div class="sv">' + fmtT(S.autoSec) + '</div><div class="sl">🗣 Time reviewing feedback (auto-pause)</div></div>' +
    '</div></div>';
  $('#v-body').innerHTML = h;
  var rb = $('#btn-retake');
  if (rb) rb.addEventListener('click', startExam);
  updateHeader();
  window.scrollTo(0, 0);
  reportScore();
}
function reportScore() {
  if (S.reported) return;
  S.reported = true;
  var n = S.answeredCount;
  var sum = S.creditSum;
  var percent = n > 0 ? Math.round((sum / n) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: D.meta.topicId,
      batch: D.meta.batch,
      score: Math.round(sum),
      total: n,
      percent: percent,
      passed: percent >= D.meta.passMark
    }, location.origin);
  } catch (e) { /* opened directly; nothing to report to */ }
}

/* ---------- site handshake ---------- */
window.addEventListener('message', function (event) {
  if (!event.data) return;
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
  if (S) S.user = event.data.username || '';
});

/* ---------- boot ---------- */
document.addEventListener('DOMContentLoaded', function () {
  document.body.className = SEVCLS[D.meta.difficulty];
  buildShell();
  showIntro();
});
})();

</script>
<script>
/* Exercise widgets: qcm, match, dragdrop, order, fillblank, terminal, steps, triage. */
(function () {
'use strict';
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function btn(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function norm(s) { return String(s || '').trim().replace(/\s+/g, ' '); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

var WIDGETS = {};

/* ============ QCM (single / multi / spot-the-line) ============ */
WIDGETS.qcm = function (ex, box) {
  var w = ex.w;
  var entries = shuffle(w.options.map(function (t, i) { return { t: t, i: i }; }));
  var letters = 'ABCDEFGHIJ';
  var sel = {};
  var single = w.mode !== 'multi';
  var btns = [];
  box.insertAdjacentHTML('beforeend', '<div class="pickhint">' + (single ? 'Choose <b>one</b> answer.' : 'Choose <b>all</b> answers that apply. Wrong picks subtract.') + '</div><div class="opts"></div>');
  var holder = box.querySelector('.opts');
  entries.forEach(function (en, k) {
    var b = btn('button', 'opt' + (w.optsCode ? ' mono' : ''),
      '<span class="ol">' + letters[k] + '.</span><span class="ot">' + esc(en.t) + '</span>');
    b.type = 'button';
    b.setAttribute('role', single ? 'radio' : 'checkbox');
    b.setAttribute('aria-checked', 'false');
    b.addEventListener('click', function () {
      if (b.disabled) return;
      if (single) { btns.forEach(function (o) { o.classList.remove('selected'); o.setAttribute('aria-checked', 'false'); }); sel = {}; }
      sel[en.i] = !sel[en.i];
      b.classList.toggle('selected', !!sel[en.i]);
      b.setAttribute('aria-checked', sel[en.i] ? 'true' : 'false');
    });
    btns.push(b); holder.appendChild(b);
  });
  function chosen() {
    return entries.map(function (en) { return en.i; }).filter(function (i) { return sel[i]; });
  }
  return {
    getAnswer: function () { return single ? (chosen()[0] !== undefined ? chosen()[0] : null) : chosen(); },
    grade: function (ans) {
      var corr = w.correct;
      var items = [];
      var H = 0, W = 0;
      if (single) {
        var ok = ans !== null && corr.indexOf(ans) >= 0;
        if (ok) H = 1; else if (ans !== null) W = 1;
        var label = ans !== null ? w.options[ans] : '(no answer selected)';
        items.push({ state: ok ? 'ok' : (ans !== null ? 'wrong' : 'miss'), label: label });
        return { N: 1, H: H, W: W, items: items };
      }
      var picked = {};
      (ans || []).forEach(function (i) { picked[i] = true; });
      corr.forEach(function (ci) {
        if (picked[ci]) { H++; items.push({ state: 'ok', label: w.options[ci] }); }
        else items.push({ state: 'miss', label: w.options[ci] });
      });
      (ans || []).forEach(function (i) {
        if (corr.indexOf(i) < 0) { W++; items.push({ state: 'wrong', label: w.options[i] }); }
      });
      return { N: corr.length, H: H, W: W, items: items };
    },
    lock: function () {
      btns.forEach(function (b) { b.disabled = true; });
      var corr = w.correct;
      btns.forEach(function (b, k) {
        var orig = entries[k].i;
        if (corr.indexOf(orig) >= 0) b.classList.add('placed-ok');
      });
    }
  };
};

/* ============ Matching (click-free, select per row) ============ */
WIDGETS.match = function (ex, box) {
  var w = ex.w;
  var rights = shuffle(w.pairs.map(function (p) { return p.r; }));
  box.insertAdjacentHTML('beforeend', '<div class="pickhint">Pick the right partner for each row.</div>');
  var wrap = btn('div');
  var sels = [];
  w.pairs.forEach(function (p, i) {
    var row = btn('div', 'matchrow');
    var sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Match for: ' + p.l);
    /* value = index into w.pairs (raw strings), so grading never meets HTML-escaped text */
    sel.innerHTML = '<option value="">— choose —</option>' + rights.map(function (r) { return '<option value="' + w.pairs.map(function (q) { return q.r; }).indexOf(r) + '">' + esc(r) + '</option>'; }).join('');
    row.innerHTML = '<span class="ml"><b>' + (i + 1) + '.</b> ' + esc(p.l) + '</span>';
    row.appendChild(sel);
    wrap.appendChild(row); sels.push(sel);
  });
  box.appendChild(wrap);
  return {
    getAnswer: function () { return sels.map(function (s) { return s.value; }); },
    grade: function (ans) {
      var items = [], H = 0, W = 0;
      w.pairs.forEach(function (p, i) {
        var vi = (ans || [])[i];
        var v = (vi === null || vi === undefined || vi === '') ? '' : w.pairs[vi].r;
        if (v === p.r) { H++; items.push({ state: 'ok', label: p.l + ' → ' + p.r }); }
        else if (v === '') items.push({ state: 'miss', label: p.l + ' — no partner chosen (correct: ' + p.r + ')' });
        else { W++; items.push({ state: 'wrong', label: p.l + ' — you chose "' + v + '" (correct: ' + p.r + ')' }); }
      });
      return { N: w.pairs.length, H: H, W: W, items: items };
    },
    lock: function () { sels.forEach(function (s) { s.disabled = true; }); }
  };
};

/* ============ Drag & drop (pointer drag + click-to-place fallback) ============ */
WIDGETS.dragdrop = function (ex, box) {
  var w = ex.w;
  box.insertAdjacentHTML('beforeend', '<div class="pickhint">Drag each card into a zone — or click a card, then click a zone.</div>');
  var lay = btn('div', 'dnd');
  var bank = btn('div', 'dndzone bank');
  bank.setAttribute('data-bid', '__bank');
  bank.innerHTML = '<h4>📋 Cards</h4><div class="dropped"></div>';
  var zones = {};
  w.buckets.forEach(function (b) {
    var z = btn('div', 'dndzone');
    z.setAttribute('data-bid', b.id);
    z.innerHTML = '<h4>' + esc(b.label) + '</h4><div class="dropped"></div>';
    lay.appendChild(z); zones[b.id] = z;
  });
  lay.insertBefore(bank, lay.firstChild);
  box.appendChild(lay);
  var chips = [];
  var byIndex = {};   /* data index -> element, so getAnswer can report in w.chips (data) order */
  var armed = null;
  shuffle(w.chips.map(function (c, i) { return { t: c.t, b: c.b, i: i }; })).forEach(function (c) {
    var ch = btn('button', 'chip', esc(c.t));
    ch.type = 'button';
    ch.setAttribute('data-b', c.b);
    ch.setAttribute('data-i', c.i);
    ch.setAttribute('aria-pressed', 'false');
    ch.addEventListener('click', function (ev) {
      if (ch.disabled) return;
      /* arming a chip must not bubble into the zone/bank place-handlers */
      ev.stopPropagation();
      if (armed === ch) { armed = null; ch.classList.remove('armed'); ch.setAttribute('aria-pressed', 'false'); return; }
      if (armed) { armed.classList.remove('armed'); armed.setAttribute('aria-pressed', 'false'); }
      armed = ch; ch.classList.add('armed'); ch.setAttribute('aria-pressed', 'true');
    });
    dragify(ch);
    chips.push(ch);
    byIndex[c.i] = ch;
    bank.querySelector('.dropped').appendChild(ch);
  });
  Object.keys(zones).forEach(function (bid) {
    zones[bid].addEventListener('click', function () {
      if (armed) { place(armed, bid); armed = null; }
    });
  });
  /* the bank is a valid target too, so a placed card can always be taken back */
  bank.addEventListener('click', function () {
    if (armed) { place(armed, '__bank'); armed = null; }
  });
  function zoneUnder(e) {
    var els = document.elementsFromPoint ? document.elementsFromPoint(e.clientX, e.clientY) : [];
    for (var i = 0; i < els.length; i++) {
      if (els[i].classList && els[i].classList.contains('dndzone')) return els[i];
    }
    return null;
  }
  function dragify(ch) {
    ch.style.touchAction = 'none';
    ch.addEventListener('pointerdown', function (ev) {
      if (ch.disabled) return;
      ev.preventDefault();
      var ghost = ch.cloneNode(true);
      ghost.style.position = 'fixed'; ghost.style.zIndex = '120'; ghost.style.margin = '0';
      ghost.style.width = ch.offsetWidth + 'px'; ghost.style.pointerEvents = 'none';
      ghost.style.left = (ev.clientX - 12) + 'px'; ghost.style.top = (ev.clientY - 12) + 'px';
      document.body.appendChild(ghost);
      function move(e) {
        ghost.style.left = (e.clientX - 12) + 'px'; ghost.style.top = (e.clientY - 12) + 'px';
        var z = zoneUnder(e);
        Object.keys(zones).forEach(function (bid) { zones[bid].classList.toggle('over', zones[bid] === z); });
      }
      function up(e) {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        ghost.remove();
        var z = zoneUnder(e);
        Object.keys(zones).forEach(function (bid) { zones[bid].classList.remove('over'); });
        if (z) place(ch, z.getAttribute('data-bid'));
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }
  function place(ch, bid) {
    (zones[bid] || bank).querySelector('.dropped').appendChild(ch);
    ch.setAttribute('data-in', bid);
  }
  return {
    getAnswer: function () {
      /* report placements in w.chips (data) order — grade() indexes by data order */
      return w.chips.map(function (_, i) {
        var ch = byIndex[i];
        return (ch && ch.getAttribute('data-in')) || '';
      });
    },
    grade: function (ans) {
      var items = [], H = 0, W = 0;
      w.chips.forEach(function (c, i) {
        var z = (ans || [])[i] || '';
        var bl = (w.buckets.filter(function (b) { return b.id === c.b; })[0] || {}).label || c.b;
        if (z === c.b) { H++; items.push({ state: 'ok', label: c.t + ' → ' + bl }); }
        else if (z === '' || z === '__bank') items.push({ state: 'miss', label: c.t + ' — not placed (correct: ' + bl + ')' });
        else {
          W++;
          var zl = (w.buckets.filter(function (b) { return b.id === z; })[0] || {}).label || z;
          items.push({ state: 'wrong', label: c.t + ' — you placed it in "' + zl + '" (correct: ' + bl + ')' });
        }
      });
      return { N: w.chips.length, H: H, W: W, items: items };
    },
    lock: function () {
      chips.forEach(function (ch) {
        ch.disabled = true;
        ch.classList.remove('armed');
        var b = ch.getAttribute('data-b'), z = ch.getAttribute('data-in') || '';
        if (z && z !== '__bank') ch.classList.add(z === b ? 'placed-ok' : 'placed-wrong');
      });
    }
  };
};

/* ============ Ordering / ranking ============ */
WIDGETS.order = function (ex, box) {
  var w = ex.w;
  box.insertAdjacentHTML('beforeend', '<div class="pickhint">Put the rows in the right order — drag them, or use ▲ ▼.</div>');
  var list = btn('div');
  box.appendChild(list);
  var cur = shuffle(w.items.map(function (_, i) { return i; }));
  function render() {
    list.innerHTML = '';
    cur.forEach(function (oi, pos) {
      var row = btn('div', 'orderrow');
      row.setAttribute('data-oi', oi);
      row.innerHTML = '<span class="num">' + (pos + 1) + '</span><span class="ot">' + esc(w.items[oi]) + '</span>' +
        '<span class="mv"><button type="button" class="mvb up" aria-label="Move up">▲</button><button type="button" class="mvb down" aria-label="Move down">▼</button></span>';
      row.querySelector('.up').addEventListener('click', function () { move(pos, -1); });
      row.querySelector('.down').addEventListener('click', function () { move(pos, 1); });
      dragify(row, pos);
      list.appendChild(row);
    });
  }
  function move(pos, d) {
    var np = pos + d;
    if (np < 0 || np >= cur.length) return;
    var t = cur[pos]; cur[pos] = cur[np]; cur[np] = t;
    render();
  }
  function dragify(row, pos) {
    row.style.touchAction = 'none';
    row.addEventListener('pointerdown', function (ev) {
      if (ev.target.closest('button')) return;
      ev.preventDefault();
      var ghost = row.cloneNode(true);
      ghost.style.position = 'fixed'; ghost.style.zIndex = '120'; ghost.style.width = row.offsetWidth + 'px';
      ghost.style.left = (ev.clientX) + 'px'; ghost.style.top = (ev.clientY - 14) + 'px';
      ghost.style.pointerEvents = 'none'; ghost.style.opacity = '0.85';
      document.body.appendChild(ghost);
      function move(e) { ghost.style.left = (e.clientX) + 'px'; ghost.style.top = (e.clientY - 14) + 'px'; }
      function up(e) {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        ghost.remove();
        var rows = Array.prototype.slice.call(list.querySelectorAll('.orderrow'));
        var target = -1;
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i].getBoundingClientRect();
          if (e.clientY >= r.top && e.clientY <= r.bottom) { target = i; break; }
        }
        if (target < 0) return;
        var item = cur[pos];
        cur.splice(pos, 1); cur.splice(target, 0, item);
        render();
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }
  render();
  return {
    getAnswer: function () { return cur.slice(); },
    grade: function (ans) {
      var items = [], H = 0, W = 0;
      (ans || []).forEach(function (oi, pos) {
        if (oi === pos) { H++; items.push({ state: 'ok', label: 'Position ' + (pos + 1) + ': ' + w.items[oi] }); }
        else { W++; items.push({ state: 'wrong', label: 'Position ' + (pos + 1) + ': ' + w.items[oi] + ' (correct: ' + w.items[pos] + ')' }); }
      });
      return { N: w.items.length, H: H, W: W, items: items };
    },
    lock: function () {
      $$('.orderrow', list).forEach(function (r) {
        r.style.pointerEvents = 'none'; r.style.opacity = '0.9';
        /* keyboard cannot reorder a graded answer either */
        $$('.mvb', r).forEach(function (b) { b.disabled = true; });
      });
    }
  };
};

/* ============ Fill-in-the-blank ============ */
WIDGETS.fillblank = function (ex, box) {
  var w = ex.w;
  box.insertAdjacentHTML('beforeend', '<div class="pickhint">Pick one word or phrase for each gap. Every gap counts separately.</div>');
  var wrap = btn('div', 'fillwrap');
  var sels = [];
  var parts = w.html.split(/@@(\d+)@@/);
  var htmlOut = '';
  parts.forEach(function (p) {
    var m = /^(\d+)$/.exec(p);
    if (m) {
      var bi = parseInt(m[1], 10);
      var opts = shuffle(w.blanks[bi].options.map(function (t, i) { return { t: t, i: i }; }));
      var sel = '<select aria-label="Gap ' + (bi + 1) + '"><option value="">— choose —</option>' +
        opts.map(function (o) { return '<option value="' + o.i + '">' + esc(o.t) + '</option>'; }).join('') + '</select>';
      htmlOut += sel; sels.push({ bi: bi });
    } else htmlOut += esc(p);
  });
  wrap.innerHTML = htmlOut;
  box.appendChild(wrap);
  var selEls = Array.prototype.slice.call(wrap.querySelectorAll('select'));
  return {
    getAnswer: function () { return selEls.map(function (s) { return s.value === '' ? null : parseInt(s.value, 10); }); },
    grade: function (ans) {
      var items = [], H = 0, W = 0;
      w.blanks.forEach(function (b, i) {
        var v = (ans || [])[i];
        var right = b.options[b.correct];
        if (v === null || v === undefined) items.push({ state: 'miss', label: 'Gap ' + (i + 1) + ' — empty (correct: "' + right + '")' });
        else if (v === b.correct) { H++; items.push({ state: 'ok', label: 'Gap ' + (i + 1) + ': "' + right + '"' }); }
        else { W++; items.push({ state: 'wrong', label: 'Gap ' + (i + 1) + ': you chose "' + b.options[v] + '" (correct: "' + right + '")' }); }
      });
      return { N: w.blanks.length, H: H, W: W, items: items };
    },
    lock: function () { selEls.forEach(function (s) { s.disabled = true; }); }
  };
};

/* ============ Terminal emulator ============ */
WIDGETS.terminal = function (ex, box) {
  var w = ex.w;
  if (w.syntax) {
    box.insertAdjacentHTML('beforeend', '<div class="synpanel"><h4>Syntax reminder</h4>' +
      '<p><code>' + esc(w.syntax.shape) + '</code></p><ul>' +
      w.syntax.opts.map(function (o) { return '<li><code>' + esc(o.split(' — ')[0]) + '</code> — ' + esc(o.split(' — ').slice(1).join(' — ')) + '</li>'; }).join('') + '</ul>' +
      '<p><b>Example (different task, do not copy it):</b> <code>' + esc(w.syntax.example) + '</code></p></div>');
  }
  box.insertAdjacentHTML('beforeend',
    '<p class="pickhint">' + esc(w.note || 'Type the command in the fake shell. Nothing runs for real. Press Check to grade what you typed.') + '</p>' +
    '<div class="terminal"><div class="tscr" aria-live="polite"></div>' +
    '<div class="trow"><span class="tprompt">' + esc(w.prompt) + '</span><input type="text" aria-label="terminal input" spellcheck="false"></div></div>');
  var scr = box.querySelector('.tscr');
  var inp = box.querySelector('input');
  function push(txt, cls) {
    var d = btn('div', cls || 'tout', esc(txt));
    d.style.whiteSpace = 'pre-wrap';
    scr.appendChild(d); scr.scrollTop = scr.scrollHeight;
  }
  push('Simulation shell — nothing here touches a real system.', 'tout');
  push('Type your command, then press Check. Enter only shows simulated output.', 'tout');
  if (w.sample) push('Expected output shape:\n' + w.sample, 'tout');
  inp.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var v = inp.value; if (!norm(v)) return;
    push(w.prompt + ' ' + v, 'tprompt');
    var nv = norm(v).replace(/\s+/g, ' ');
    var out = null;
    (w.sim || []).forEach(function (s) { if (out === null && new RegExp(s.re, 'i').test(nv)) out = s.out; });
    if (out !== null) push(out, 'tout');
    else push('command not recognised in this simulation — Check will grade it', 'terr');
  });
  function explainElems() {
    var h = '<div class="synpanel"><h4>Canonical command (copyable)</h4><div class="canon">' + esc(w.canon) + '</div><ul>' +
      w.elems.map(function (e2) { return '<li><b>' + esc(e2.label) + '</b></li>'; }).join('') +
      ((w.wrong || []).map(function (x) { return '<li>⚠ ' + esc(x.label) + '</li>'; }).join('')) + '</ul></div>';
    return h;
  }
  return {
    getAnswer: function () { return norm(inp.value); },
    grade: function (ans) {
      var v = ' ' + norm(ans).replace(/\s+/g, ' ') + ' ';
      var items = [], H = 0, W = 0;
      w.elems.forEach(function (e2) {
        if (new RegExp(e2.re, 'i').test(v)) { H++; items.push({ state: 'ok', label: e2.label }); }
        else items.push({ state: 'miss', label: e2.label });
      });
      var dangers = [];
      (w.wrong || []).forEach(function (x) {
        if (new RegExp(x.re, 'i').test(v)) { W++; items.push({ state: 'wrong', label: x.label }); if (x.danger) dangers.push(x.label); }
      });
      var extra = explainElems();
      if (dangers.length) extra = '<div class="study"><b>⚠ Dangerous command warning:</b> your input would ' + esc(dangers.join('; ')) + '. Read the explanation below.</div>' + extra;
      return { N: w.elems.length, H: H, W: W, items: items, extraHTML: extra };
    },
    lock: function () { inp.disabled = true; }
  };
};

/* ============ Multi-step decision tree ============ */
WIDGETS.steps = function (ex, box, ctrl) {
  var w = ex.w;
  var picks = new Array(w.steps.length).fill(null);
  var curStep = 0;
  var letters = 'ABCDEF';
  var wrap = btn('div');
  box.appendChild(wrap);
  if (ctrl && ctrl.setCheck) ctrl.setCheck(false);
  function renderStep() {
    var st = w.steps[curStep];
    var h = '<div class="step-tag">STEP ' + (curStep + 1) + ' OF ' + w.steps.length + '</div>';
    if (st.note) h += '<p class="small">' + esc(st.note) + '</p>';
    h += '<p class="qtext">' + esc(st.q) + '</p><div class="opts"></div>';
    wrap.innerHTML = h;
    var holder = wrap.querySelector('.opts');
    var order = shuffle(st.options.map(function (t, i) { return { t: t, i: i }; }));
    order.forEach(function (o, k) {
      var b = btn('button', 'opt', '<span class="ol">' + letters[k] + '.</span><span class="ot">' + esc(o.t) + '</span>');
      b.type = 'button';
      b.addEventListener('click', function () {
        $$('.opt', holder).forEach(function (x) { x.classList.remove('selected'); });
        b.classList.add('selected');
        picks[curStep] = o.i;
      });
      holder.appendChild(b);
    });
    if (curStep < w.steps.length - 1) {
      var cb = btn('button', 'primary', 'Continue ▸');
      cb.type = 'button'; cb.style.marginTop = '10px';
      var warn = null;
      cb.addEventListener('click', function () {
        if (picks[curStep] === null) {
          /* inline warning: native alert() is blocked inside sandboxed site iframes */
          if (!warn) { warn = btn('p', 'stepwarn'); wrap.appendChild(warn); }
          warn.textContent = 'Pick an option to continue.';
          return;
        }
        if (warn) { warn.textContent = ''; }
        curStep++; renderStep();
      });
      wrap.appendChild(cb);
    } else {
      wrap.insertAdjacentHTML('beforeend', '<p class="small">Final step — press <b>Check</b> below to grade all ' + w.steps.length + ' steps at once.</p>');
      if (ctrl && ctrl.setCheck) ctrl.setCheck(picks[curStep] !== null);
      var last = holder;
      last.addEventListener('click', function () { if (ctrl && ctrl.setCheck) ctrl.setCheck(true); });
    }
  }
  renderStep();
  return {
    getAnswer: function () { return picks.slice(); },
    grade: function (ans) {
      var items = [], H = 0, W = 0;
      w.steps.forEach(function (st, i) {
        var p = (ans || [])[i];
        if (p === st.correct) { H++; items.push({ state: 'ok', label: 'Step ' + (i + 1) + ': ' + st.options[st.correct] }); }
        else if (p === null) items.push({ state: 'miss', label: 'Step ' + (i + 1) + ' — no answer (correct: ' + st.options[st.correct] + ')' });
        else { W++; items.push({ state: 'wrong', label: 'Step ' + (i + 1) + ': you chose "' + st.options[p] + '" (correct: ' + st.options[st.correct] + ')' }); }
      });
      return { N: w.steps.length, H: H, W: W, items: items };
    },
    lock: function () { $$('.opt, button', wrap).forEach(function (b) { b.disabled = true; }); }
  };
};

/* ============ Alert triage queue ============ */
WIDGETS.triage = function (ex, box) {
  var w = ex.w;
  box.insertAdjacentHTML('beforeend', '<div class="pickhint">Choose one action for each alert. Each alert is scored on its own.</div>');
  var sels = [];
  var actionOrder = shuffle(w.actions.map(function (t, i) { return { t: t, i: i }; }));
  w.alerts.forEach(function (a, i) {
    var card = btn('div', 'artefact');
    card.innerHTML = '<div class="artefact-h">ALERT ' + (i + 1) + (a.meta ? ' — ' + esc(a.meta) : '') + '</div><div class="artefact-b"><div>' + esc(a.t) + '</div></div>';
    var sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Action for alert ' + (i + 1));
    sel.style.margin = '8px 0 2px';
    sel.innerHTML = '<option value="">— choose action —</option>' + actionOrder.map(function (o) { return '<option value="' + o.i + '">' + esc(o.t) + '</option>'; }).join('');
    card.querySelector('.artefact-b').appendChild(sel);
    box.appendChild(card);
    sels.push(sel);
  });
  return {
    getAnswer: function () { return sels.map(function (s) { return s.value === '' ? null : parseInt(s.value, 10); }); },
    grade: function (ans) {
      var items = [], H = 0, W = 0;
      w.alerts.forEach(function (a, i) {
        var v = (ans || [])[i];
        var right = w.actions[w.correct[i]];
        if (v === null || v === undefined) items.push({ state: 'miss', label: 'Alert ' + (i + 1) + ' — no action (correct: "' + right + '")' });
        else if (v === w.correct[i]) { H++; items.push({ state: 'ok', label: 'Alert ' + (i + 1) + ': ' + right }); }
        else { W++; items.push({ state: 'wrong', label: 'Alert ' + (i + 1) + ': you chose "' + w.actions[v] + '" (correct: "' + right + '")' }); }
      });
      return { N: w.alerts.length, H: H, W: W, items: items };
    },
    lock: function () { sels.forEach(function (s) { s.disabled = true; }); }
  };
};

window.WIDGETS = WIDGETS;
})();

</script>
