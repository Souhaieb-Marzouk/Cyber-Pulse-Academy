<script type="application/json" id="exam-data">{"config":{"objectId":"TA0002","introTitle":"MITRE ATT&CK TA0002 — Execution","severity":"MEDIUM","difficulty":"medium","batch":2,"title":"TA0002 Execution — MEDIUM","minutes":32,"seconds":1920},"intro":{"entityHtml":"\u003ch2>What you will learn\u003c/h2>\u003cp>Welcome! This exam is about one part of the MITRE ATT&CK framework: the tactic called \u003cb>Execution\u003c/b>, with the ID \u003cb>TA0002\u003c/b>. You will learn what it is, why it matters, and how real security teams work with it every day.\u003c/p>\u003ch3>What is MITRE ATT&CK?\u003c/h3>\u003cp>MITRE ATT&CK is a big, public knowledge base. It describes what real attackers do, step by step. ATT&CK splits an attack into goals called \u003cb>tactics\u003c/b>. Every tactic has an ID that starts with \u003cb>TA\u003c/b>. Every way to reach a goal is called a \u003cb>technique\u003c/b>. Technique IDs start with \u003cb>T\u003c/b>.\u003c/p>\u003ch3>What is Execution (TA0002)?\u003c/h3>\u003cp>This object is a \u003cb>Tactic\u003c/b> — a goal, not a single action. The goal of TA0002 is simple: \u003cb>run attacker code on a target system\u003c/b>. Imagine an attacker sends an email with a bad attachment. An employee opens it. The attachment runs a script. At that moment the attacker has reached Execution: their code now runs inside the company. Before this step, the attacker often only has a document, a link, or a network position. After this step, their commands run on a real machine.\u003c/p>\u003cp>Execution usually comes right after \u003cb>Initial Access (TA0001)\u003c/b> and before \u003cb>Persistence (TA0003)\u003c/b>. Almost every serious attack needs this step. If defenders stop Execution, the attack usually stops too.\u003c/p>\u003ch3>Techniques that live under TA0002\u003c/h3>\u003cp>ATT&CK lists many ways to reach this goal. The best-known ones are: \u003cb>Command and Scripting Interpreter (T1059)\u003c/b> — for example PowerShell, Windows Command Shell, Unix Shell, AppleScript or Python; \u003cb>Windows Management Instrumentation (T1047)\u003c/b>; \u003cb>Scheduled Task/Job (T1053)\u003c/b>; \u003cb>User Execution (T1204)\u003c/b> — when a person opens a bad link or file; \u003cb>Exploitation for Client Execution (T1203)\u003c/b>; \u003cb>System Services (T1569)\u003c/b>; \u003cb>Inter-Process Communication (T1559)\u003c/b>; \u003cb>Hijack Execution Flow (T1574)\u003c/b>; \u003cb>Trusted Developer Utilities Proxy Execution (T1127)\u003c/b>; \u003cb>Native API (T1106)\u003c/b>; \u003cb>Software Deployment Tools (T1072)\u003c/b>; \u003cb>Shared Modules (T1129)\u003c/b>; \u003cb>Deploy Container (T1610)\u003c/b>; and \u003cb>Serverless Execution (T1648)\u003c/b>. Some techniques also serve other tactics — a scheduled task, for example, can execute code now (Execution) or start it again after a reboot (Persistence).\u003c/p>\u003ch3>Where is it used in real work?\u003c/h3>\u003cul>\u003cli>\u003cb>SOC analysts\u003c/b> see Execution alerts every day, for example: an Office program started PowerShell. They decide if it is an attack.\u003c/li>\u003cli>\u003cb>Threat hunters\u003c/b> search logs for attacker scripts: PowerShell script block logging (event 4104), process creation (4688), task creation (4698), service installs (7045).\u003c/li>\u003cli>\u003cb>Incident responders\u003c/b> stop running code, collect evidence, and clean systems.\u003c/li>\u003cli>\u003cb>Detection engineers\u003c/b> write rules for these events, for example: alert when a browser or Office app spawns a script interpreter.\u003c/li>\u003cli>\u003cb>Red teamers\u003c/b> use the same techniques (with written permission) to test defences.\u003c/li>\u003cli>\u003cb>GRC analysts and control owners\u003c/b> use TA0002 to justify controls like application allowlisting, exploit protection and user training.\u003c/li>\u003cli>\u003cb>Threat intelligence analysts\u003c/b> map adversary reports to TA0002 when they brief the CISO.\u003c/li>\u003c/ul>\u003ch3>What risks does it address?\u003c/h3>\u003cp>If you do not understand Execution, you miss the moment an attacker takes control of a machine. Files and network traffic can look normal, but one running script can steal data or start ransomware. That is why this tactic is one of the most important to master.\u003c/p>","rulesHtml":"\u003ch3>Difficulty of this file: MEDIUM\u003c/h3>\u003cp>Intermediate. Each exercise combines exactly two connected ideas — for example identify the technique, then pick the matching data source. The goal is stated, but the path is yours to find.\u003c/p>\u003ch3>Exercise types you will meet\u003c/h3>\u003cp>Multiple-choice questions, multi-select questions with partial credit, matching, drag-and-drop placement of techniques, ordering, fill-in-the-blank with a word bank, priority ranking, short branching scenarios, a log viewer with a filter box, and one small command-line lab.\u003c/p>\u003ch3>Scoring (please read — it helps you)\u003c/h3>\u003cul>\u003cli>Each exercise gives at most 1 point of credit. You pass with \u003cb>70%\u003c/b> over the exercises you answer.\u003c/li>\u003cli>Multi-item exercises (several correct options, several slots, several steps) give \u003cb>partial credit\u003c/b>: every correct item counts, but every wrong item subtracts. Selecting everything is worth 0, so only pick what you are sure of.\u003c/li>\u003cli>A partially correct answer still earns credit — for example 3 of 5 correct items give credit 0.60.\u003c/li>\u003c/ul>\u003ch3>Check buys you unlimited thinking time\u003c/h3>\u003cp>When you press \u003cb>Check\u003c/b>, the timer stops by itself. The feedback stays visible and you can study it as long as you want. The timer only runs again when you press \u003cb>Next\u003c/b> (or Final Submit on the last exercise). This is shown as “PAUSED — reviewing feedback”.\u003c/p>\u003ch3>Manual pause\u003c/h3>\u003cp>The \u003cb>Pause\u003c/b> button stops the timer for a real break. While it is paused, the exercise is hidden so nobody can read it. Press \u003cb>Resume\u003c/b> to continue.\u003c/p>\u003ch3>Skipping\u003c/h3>\u003cul>\u003cli>Every exercise has a \u003cb>Skip\u003c/b> button. Skipping hides the answer and moves the exercise to a review pool. The timer keeps running.\u003c/li>\u003cli>Before the exam ends you get a \u003cb>review screen\u003c/b> where you can answer skipped exercises as often as you like while time remains.\u003c/li>\u003cli>Skipped exercises that stay unanswered are \u003cb>excluded\u003c/b> from the score — they count neither for nor against you.\u003c/li>\u003c/ul>\u003ch3>Hints\u003c/h3>\u003cp>One hint per exercise. A hint costs \u003cb>−10% of that exercise’s credit\u003c/b> (never more). It gives a nudge, not the answer.\u003c/p>\u003ch3>Retake\u003c/h3>\u003cp>After the results screen you can retake the exam. Questions and answer choices are shuffled again.\u003c/p>"},"keywords":[{"theme":"Tactic objective & lifecycle position","chips":["Run attacker code on target","TA0002 = Execution","Follows Initial Access (TA0001)","Precedes Persistence (TA0003)","Adversary goal, not one action"]},{"theme":"Execution techniques & sub-techniques","chips":["T1059 Command and Scripting Interpreter","T1059.001 PowerShell","T1059.003 Windows Command Shell","T1059.004 Unix Shell","T1059.002 AppleScript","T1047 WMI","T1053 Scheduled Task/Job","T1053.005 Scheduled Task","T1204.001 Malicious Link","T1204.002 Malicious File","T1203 Exploitation for Client Execution","T1569.002 Service Execution","T1106 Native API","T1127.001 MSBuild","T1559 Inter-Process Communication","T1574 Hijack Execution Flow","T1072 Software Deployment Tools","T1129 Shared Modules","T1610 Deploy Container","T1648 Serverless Execution"]},{"theme":"Platforms & permissions","chips":["Windows","macOS","Linux","Containers","IaaS / Cloud","User vs administrator rights"]},{"theme":"Data sources & telemetry","chips":["Process creation (4688)","Script block logging (4104)","Module logging (4103)","Task creation (4698)","Service install (7045)","Sysmon process events","WMI activity logs","EDR telemetry"]},{"theme":"Detection logic & analytics","chips":["Office app spawning interpreter","Encoded command hunting","Parent-child process anomalies","Service created off-hours","Task registered at logon"]},{"theme":"Mitigations & controls","chips":["M1038 Execution Prevention","M1040 Behavior Prevention on Endpoint","M1017 User Training","M1049 Antivirus / Antimalware","M1050 Exploit Protection","M1026 Privileged Account Management","M1021 Restrict Web-Based Content"]},{"theme":"Adversary use & tooling","chips":["APT29","Lazarus","FIN7","Wizard Spider","OilRig","APT41","Cobalt Strike","PowerShell Empire","Metasploit"]}],"exercises":[{"id":"M01","type":"flow","summary":"Monday triage — pick the true Execution alert and your first action","scenario":["Monday, 08:40. Three alerts wait in the CyberPulse queue. Your lead says: “Start with the one that most clearly shows TA0002 Execution, then take your first action on it.”"],"artefacts":[{"label":"ARTEFACT — Alert queue, Monday 08:40","kind":"table","rows":[["Alert","Text","Host"],["AL-2201","svchost.exe started update.exe (signed, internal PKI certificate)","WKS-201"],["AL-2202","WINWORD.EXE started powershell.exe with -enc flag","HOST-114"],["AL-2203","chrome.exe downloaded installer.exe; user started nothing","WKS-305"]]}],"question":"Work through both steps of this triage.","hint":"Look for the pair where a document program starts a script interpreter with a hidden payload flag.","explanation":"Step 1: \u003cb>AL-2202\u003c/b> is the clearest Execution sight — Word (a document app) spawning PowerShell with \u003cb>-enc\u003c/b> (an encoded command) is the classic T1059.001 pattern. AL-2201 is plausible but svchost launching a properly signed internal updater is routine maintenance. AL-2203 shows only a download, and the user started nothing — no code ran. Step 2: pulling the decoded command from script block logging (4104) confirms what ran; reimaging or mass mailing are not first steps.","study":"Parent-child anomalies plus the -enc flag; then the telemetry you use to confirm.","data":{"steps":[{"text":["Step 1 — pick the alert that most clearly shows Execution (TA0002)."],"options":[{"t":"AL-2201 — svchost started a signed internal updater","why":"Signed, internally issued updater from svchost is routine maintenance."},{"t":"AL-2202 — WINWORD started powershell.exe with -enc","correct":true,"why":"A document app spawning an interpreter with an encoded command is the classic T1059.001 pattern."},{"t":"AL-2203 — chrome downloaded installer.exe, nothing started","why":"A download alone runs no code; no execution happened yet."}]},{"text":["Step 2 — AL-2202 is yours. What do you do first?"],"options":[{"t":"Reimage HOST-114 immediately","why":"Reimaging without understanding destroys evidence and is not a first step."},{"t":"Email the whole company a warning about macros","why":"Mass mailings before triage cause panic and confirm nothing."},{"t":"Pull the decoded command from script block logging (event 4104)","correct":true,"why":"4104 stores the script text, so you can read exactly what ran."}]}]}},{"id":"M02","type":"categorize","summary":"Matrix mapping — sort six observed behaviours into three tactic columns","scenario":["You are the detection engineer on rotation. Six behaviours from last week’s hunts sit in the backlog. The IR lead wants them mapped to ATT&CK tactic columns so the report reads correctly."],"artefacts":[{"label":"ARTEFACT — Sorting rule from the IR lead","kind":"text","body":["Ask one question per behaviour: does it run code now (Execution, TA0002), keep code coming back (Persistence, TA0003), or get the attacker in at the start (Initial Access, TA0001)?"]}],"question":"Place every behaviour into the correct tactic column.","hint":"WMI calls and native API calls run code now. Recurring tasks and Run keys keep code alive. Phishing and exploits of public servers get in.","explanation":"T1047 (WMI runs the payload now) and T1106 (malware calls WinExec in kernel32 to start a program) belong to Execution. A task that re-creates itself weekly and a Run key at logon exist to bring code back — Persistence. A spearphishing link and an exploit against a public web server are the way in — Initial Access. The wording of each item carries the intent, and intent decides the column.","study":"TA0002 vs TA0003 vs TA0001 — same technique can serve several, the intent decides.","data":{"zones":[{"title":"Execution (TA0002)"},{"title":"Persistence (TA0003)"},{"title":"Initial Access (TA0001)"}],"items":[{"t":"T1047 — WMI executed the payload on 12 hosts","target":0,"why":"WMI started the payload at that moment — Execution."},{"t":"T1053.005 — the same task re-creates itself weekly to relaunch malware","target":1,"why":"Its job is to keep malware returning — Persistence."},{"t":"T1566.002 — attacker sent a spearphishing link","target":2,"why":"The link is the way in — Initial Access."},{"t":"T1106 — malware calls WinExec in kernel32.dll","target":0,"why":"Native API call that starts a program — Execution."},{"t":"T1190 — exploit against the public web server","target":2,"why":"Exploiting a public app is an entry technique — Initial Access."},{"t":"T1547.001 — Run key starts the backdoor at every logon","target":1,"why":"Startup key keeps the backdoor alive — Persistence."}]}},{"id":"M03","type":"qcm","summary":"Domain controller service — name the technique and the next check","scenario":["You get a page at 02:07. Security event 7045 on HOST-DC-02 (a domain controller) shows a new service named HealthCore. Its path is: cmd.exe /c powershell -enc SQBFAFgA... It runs as LocalSystem."],"artefacts":[{"label":"ARTEFACT — Event 7045, Service installed","kind":"log","lines":["2026-10-08 02:01:33  Event 7045  Service Name: HealthCore","2026-10-08 02:01:33  Event 7045  Image Path: cmd.exe /c powershell -enc SQBFAFgA...","2026-10-08 02:01:33  Event 7045  Account: LocalSystem   Startup: Auto"]}],"question":"Which pair correctly names the technique behind the run and the best next check?","hint":"The service was used to start a program at that moment — which TA0002 technique does that? And what would you check first on a domain controller?","explanation":"\u003cb>T1569.002 Service Execution is correct.\u003c/b> A service that ran a payload at a moment in time is T1569.002 (Service Execution, TA0002); on a domain controller the first sanity check is whether a planned change created it — check the creating account and the change ticket. \u003cb>The Account Manipulation choice\u003c/b> misreads the event, \u003cb>the Exfiltration choice\u003c/b> jumps to a later tactic, and \u003cb>the Create Account choice\u003c/b> invents account creation that never happened. Note: if this service existed to relaunch malware at every boot, Persistence (T1543.003) would also be on the table — the run-now behaviour is the Execution half.","study":"T1569.002 Service Execution, and how one artefact can touch two tactics.","data":{"options":[{"t":"T1136 Create Account; audit every local user account on the host tonight","why":"No user account appears in this event."},{"t":"T1098 Account Manipulation; reset every domain password tonight","why":"No account was created or changed here."},{"t":"T1569.002 Service Execution; check the creating account and the change ticket","correct":true,"why":"Correct — the service executed code now; verify authorization first."},{"t":"T1041 Exfiltration Over C2; block all outbound traffic now","why":"Nothing shows data leaving the network."}]}},{"id":"M04","type":"terminal","summary":"Live bridge — list every process with full command lines on HOST-WKS-04 via WMI","scenario":["You are on the incident bridge. The lead says: “We must see every running process with its full command line on HOST-WKS-04, using WMI (that is technique T1047 territory), from your admin workstation. Your account has rights there.” The tool is wmic; the goal is full process detail from the remote node."],"artefacts":[{"label":"ARTEFACT — Bridge note","kind":"text","body":["Intent: remote node HOST-WKS-04, all processes, full details (name plus command line). No changes to the host."]}],"question":"Type the wmic command that lists every process with full details on HOST-WKS-04, then press Run.","hint":"wmic goes to a remote node with /node:, names the object you want, then asks for the detail level.","explanation":"The canonical command is \u003cb>wmic /node:HOST-WKS-04 process list full\u003c/b>. \u003cb>wmic\u003c/b> is the WMI command-line tool — the same interface attackers abuse for T1047. \u003cb>/node:\u003c/b> targets the remote machine. \u003cb>process\u003c/b> names the WMI class. \u003cb>list full\u003c/b> prints every field, including command lines. It is read-only, so evidence stays intact. The output even shows why this matters: the simulated listing exposes a hidden encoded PowerShell on the host.","study":"T1047 Windows Management Instrumentation — the defender side of the same interface.","data":{"prompt":"PS C:\\Users\\jmorales>","banner":["CyberPulse incident bridge — admin workstation","Connected as jmorales (local admin on HOST-WKS-04)."],"simMatch":"^wmic\\b","sim":["Executing (\\\\HOST-WKS-04): query...","Caption         CommandLine                                    ProcessId","explorer.exe    C:\\Windows\\explorer.exe                         2044","svchost.exe     C:\\Windows\\system32\\svchost.exe -k netsvcs      812","powershell.exe  powershell -nop -w hidden -enc SQBFAFgA...       6601"],"elements":[{"re":"^wmic\\b","label":"Tool: wmic","why":"The WMI command-line client, as the lead requested."},{"re":"\\/node:host-wks-04","label":"Remote node: HOST-WKS-04","why":"/node: points wmic at the remote machine."},{"re":"\\bprocess\\b","label":"Class: process","why":"You want the running processes."},{"re":"\\blist full\\b|\\bget\\b.*commandline","label":"Detail level: full (command lines included)","why":"The lead asked for full details, command lines included."}],"danger":[{"re":"\\bcall\\b.*create|\\bdelete\\b|\\bterminate\\b","label":"State-changing wmic action detected","why":"Your command would start or kill something — the lead asked for a read-only listing."}],"canonical":"wmic /node:HOST-WKS-04 process list full"}},{"id":"M05","type":"match","summary":"Telemetry wiring — connect each technique to the data source that catches it","scenario":["A junior intern asks: “Which log actually shows each Execution technique?” You build a quick matching board for the team wiki."],"artefacts":[],"question":"Match each technique to the data source that most directly catches it.","hint":"Script text, task creation, service install, and the file that the user opened.","explanation":"T1059.001 PowerShell is caught by script block logging (4104) — the script text itself. T1053.005 Scheduled Task leaves task-creation event 4698. T1569.002 Service Execution leaves service-install event 7045. T1204.002 User Execution is best tied together by the file’s origin: what the email gateway or browser delivered, plus the process that started right after the user opened it. Matching technique to telemetry is the backbone of detection engineering.","study":"The “Data sources & telemetry” theme in the intro.","data":{"zones":[{"title":"T1059.001 PowerShell"},{"title":"T1053.005 Scheduled Task"},{"title":"T1569.002 Service Execution"},{"title":"T1204.002 User Execution (file)"}],"items":[{"t":"Script block logging — event 4104","target":0,"why":"4104 records the exact script text PowerShell ran."},{"t":"Task creation — event 4698","target":1,"why":"4698 fires when a scheduled task is registered."},{"t":"Service install — event 7045","target":2,"why":"7045 fires when a service is installed."},{"t":"File creation at the gateway + process right after the click","target":3,"why":"User execution is proven by the delivered file plus the process it started."}]}},{"id":"M06","type":"fill","summary":"Detection note — complete the new rule description","scenario":["You finish the draft note for detection rule EX-007. Complete it with words from the box so the description reads correctly."],"artefacts":[],"question":"Choose the correct word or phrase for each gap.","hint":"The parent is a document app, the child is an interpreter, then two event IDs: script text and task creation.","explanation":"The rule fires when an Office program (like Word or Excel) spawns a script interpreter (like powershell.exe). Analysts then read event 4104 for the script text and event 4698 if a task was created to make the run repeat. The distractors are real but belong to other chains: browsers, event 7045 for services, and 1102 for log clearing.","study":"Parent-child detection logic plus the two event IDs every analyst memorises: 4104 and 4698.","data":{"textWithBlanks":"Rule EX-007 fires when {1} spawns {2}. Analysts then read event {3} for the full script text. If the run seems planned to repeat, they also check event {4} for task creation.","blanks":[{"answer":"an Office program","why":"Office apps spawning interpreters is the classic lure-execution chain."},{"answer":"a script interpreter","why":"The child process is PowerShell, cmd, or similar."},{"answer":"4104","why":"4104 carries the executed script text."},{"answer":"4698","why":"4698 shows a scheduled task was created."}],"bank":["a web browser","7045","1102","the printer spooler"]}},{"id":"M07","type":"qcm-multi","summary":"Intern audit — select every item that is an Execution technique","scenario":["A junior intern drafted a list of “Execution techniques” for the wiki. You audit it before it goes live. Select every item that truly belongs to TA0002."],"artefacts":[],"question":"Select EVERY item that is an Execution (TA0002) technique.","hint":"One trap has WMI in its name, but its goal is persistence, not running code now.","explanation":"Correct members of TA0002: \u003cb>T1059.004 Unix Shell\u003c/b> runs commands on Linux/macOS; \u003cb>T1610 Deploy Container\u003c/b> starts attacker containers; \u003cb>T1559.001 Component Object Model\u003c/b> abuses COM for local code execution. \u003cb>T1546.003 WMI Event Subscription\u003c/b> is the trap: its name contains WMI, but it triggers code later on events — that is Persistence/Privilege Escalation. \u003cb>T1021.001 RDP\u003c/b> is Lateral Movement and \u003cb>T1530\u003c/b> is Collection. Judgement rule: ask what the technique achieves, not what word it contains.","study":"Technique names can mislead — always check the tactic each technique serves.","data":{"options":[{"t":"T1530 — Data from Cloud Storage","why":"Collecting cloud data is Collection."},{"t":"T1546.003 — WMI Event Subscription","why":"It triggers code on future events — Persistence/Privilege Escalation, not TA0002."},{"t":"T1559.001 — Component Object Model","correct":true,"why":"COM abuse gives local code execution — Execution."},{"t":"T1021.001 — Remote Desktop Protocol","why":"RDP moves the attacker between machines — Lateral Movement."},{"t":"T1610 — Deploy Container","correct":true,"why":"Deploying an attacker container is an Execution technique."},{"t":"T1059.004 — Unix Shell","correct":true,"why":"A shell interpreter running commands — core Execution."}]}},{"id":"M08","type":"order","summary":"Incident rebuild — order the five attacker steps of a phishing-to-task chain","scenario":["The SOC rebuilds last month’s incident for a lessons-learned session. Five attacker steps are on cards. Put them in the order they happened."],"artefacts":[],"question":"Drag the five steps into the correct time order.","hint":"Delivery first, then the user runs it, then the interpreter works, then stage two arrives, then the task makes it stick.","explanation":"Order: (1) the email with invoice.lnk is delivered — Initial Access; (2) the user double-clicks it — User Execution T1204.002; (3) the LNK starts powershell.exe with a hidden encoded command — T1059.001; (4) PowerShell downloads stage two — more command execution; (5) the payload registers a scheduled task so it starts again at logon — Persistence. Note how the same incident walks through several tactics, and how Execution is the bridge between getting in and staying in.","study":"How TA0001, TA0002 and TA0003 chain together in one incident.","data":{"items":[{"t":"Employee receives an email with invoice.lnk attached","why":"Step 1: delivery — Initial Access."},{"t":"Employee double-clicks invoice.lnk","why":"Step 2: the user runs the lure — User Execution (T1204.002)."},{"t":"The LNK starts powershell.exe with a hidden encoded command","why":"Step 3: interpreter runs the payload — T1059.001."},{"t":"PowerShell downloads a second-stage payload","why":"Step 4: more command execution to fetch tooling."},{"t":"The payload registers a scheduled task for the next logon","why":"Step 5: recurring run — Persistence (T1053.005)."}]}},{"id":"M09","type":"qcm","summary":"Night shift 4104 — what does this encoded PowerShell evidence show?","scenario":["Night shift, 22:44. You review two events that arrived together from HOST-114 and must say what they most likely show."],"artefacts":[{"label":"ARTEFACT — Correlated events from HOST-114","kind":"log","filter":true,"lines":["2026-10-02 22:41:13  Event 4104  ScriptBlock  Invoking: \"powershell -nop -w hidden -enc SQBFAFgA(…88 chars…)=\"","2026-10-02 22:41:13  Event 4688  Process Create: parent WINWORD.EXE → child powershell.exe"]}],"question":"What does this evidence most likely show?","hint":"Look at the parent process and the -w hidden -enc flags together, at the same second.","explanation":"\u003cb>The hidden, encoded PowerShell reading is correct.\u003c/b> A document process spawning a hidden (-w hidden) encoded (-enc) PowerShell at the same moment is the signature of a lure file executing attacker code — T1059.001 under TA0002. \u003cb>The print-queue reading\u003c/b> ignores both red flags. \u003cb>The backup reading\u003c/b> invents a backup context that is not in the evidence. \u003cb>The group-policy reading\u003c/b> invents group policy, which does not spawn from Word. Encoded commands are a deliberate hiding choice — legitimate admin scripts on workstations rarely need them.","study":"The -enc / -w hidden pattern and why encoded commands deserve a look.","data":{"options":[{"t":"An administrator pushed a routine group policy update","why":"Group policy does not spawn from a document editor."},{"t":"A scheduled backup job ran its script as designed","why":"The parent is Word, not the backup service or scheduler."},{"t":"A document spawned hidden, encoded PowerShell — likely T1059.001","correct":true,"why":"Correct — Word + hidden encoded PowerShell at one instant is the lure-execution chain."},{"t":"A user opened PowerShell to manage the print queues","why":"Print management would not start from WINWORD with -enc."}]}},{"id":"M10","type":"fill","summary":"Triage note fix — replace the one wrong phrase","scenario":["A trainee wrote a triage note with one wrong phrase. The alert, the note, and reality disagree. You must pick which phrase has to change."],"artefacts":[{"label":"ARTEFACT — Trainee note (draft 1)","kind":"text","body":["“The alert shows WINWORD.EXE starting powershell.exe. This is Persistence (TA0003) behaviour, because the macro only ran once when the document opened.”"]}],"question":"The trainee’s note mislabels the behaviour. Choose the phrase that replaces “Persistence (TA0003)” in the corrected note.","hint":"Code that runs once, right now, serves which goal — staying, or running?","explanation":"\u003cb>Execution (TA0002) is correct.\u003c/b> Code that runs once at the moment a document opens is Execution (TA0002). Persistence (TA0003) is about coming back after reboots or logons — the note even says it ran only once, which contradicts Persistence. The other phrases are factually fine: Word did start PowerShell, and a one-shot macro run is correctly described.","study":"The difference between running code now (TA0002) and coming back later (TA0003).","data":{"textWithBlanks":"Corrected note: The alert shows WINWORD.EXE starting powershell.exe. This is {1} behaviour, because the macro only ran once when the document opened.","blanks":[{"answer":"Execution (TA0002)","why":"A one-shot run at document-open time is Execution — the goal was to run code now."}],"bank":["Persistence (TA0003)","Credential Access (TA0006)","Exfiltration (TA0010)"]}},{"id":"M11","type":"match","summary":"Objective bingo — connect each goal to the technique that delivers it","scenario":["Your lead reads four attacker goals aloud. You pin each one to the Execution technique that delivers it."],"artefacts":[],"question":"Match each goal to the technique that delivers it.","hint":"Management framework, human trickery, a Windows service, and Apple’s script language.","explanation":"Running code through Microsoft’s signed management framework is T1047 (WMI). Trickery that relies on the human opening something is T1204 (User Execution). Installing a Windows service to run the payload is T1569.002 (Service Execution). Running script text on macOS via osascript is T1059.002 (AppleScript). Mapping goals to techniques is how hunters turn “what did they want” into “what do I search for”.","study":"One goal, one technique: practice mapping intents to TA0002 entries.","data":{"zones":[{"title":"Run code through a signed Microsoft management framework"},{"title":"Trick a human into running the payload"},{"title":"Run code by installing a Windows service"},{"title":"Run script text directly on macOS"}],"items":[{"t":"T1047 — Windows Management Instrumentation","target":0,"why":"WMI is the built-in management framework used to start processes."},{"t":"T1204 — User Execution","target":1,"why":"User Execution is exactly this: the human performs the action."},{"t":"T1569.002 — Service Execution","target":2,"why":"A Windows service binary runs the payload."},{"t":"T1059.002 — AppleScript","target":3,"why":"AppleScript is the macOS script interpreter — used by Lazarus in real campaigns."}]}},{"id":"M12","type":"qcm","summary":"CISO question — which mitigation most directly blunts T1204.002?","scenario":["Your CISO asks: “Phishing keeps reaching our users. Attackers rely on the user opening the attachment — T1204.002. Which mitigation most directly reduces that?”"],"artefacts":[],"question":"Which mitigation most directly reduces T1204.002 (User Execution: Malicious File)?","hint":"Which control speaks to the person who opens the file?","explanation":"\u003cb>M1017 User Training is correct.\u003c/b> It directly targets the human action that T1204.002 depends on — people learn to recognise and report lures. \u003cb>Network Segmentation (M1030)\u003c/b> limits blast radius but does not stop the open. \u003cb>Restrict Web-Based Content (M1021)\u003c/b> helps against web-delivered payloads, but this lure arrives by email. \u003cb>Filter Network Traffic (M1037)\u003c/b> filters connections, not user choices. In practice training works best together with endpoint behaviour prevention (M1040) and macro controls.","study":"M1017, M1040 and how controls map to the User Execution techniques.","data":{"options":[{"t":"M1037 — Filter Network Traffic","why":"Filters connections, not the user’s click."},{"t":"M1017 — User Training","correct":true,"why":"Correct — training targets the exact human action T1204.002 needs."},{"t":"M1021 — Restrict Web-Based Content","why":"Strong for web delivery; this lure arrives by email."},{"t":"M1030 — Network Segmentation","why":"Limits movement later; does not stop the user opening the file."}]}},{"id":"M13","type":"rank","summary":"End of shift — rank three execution alerts by urgency","scenario":["Three execution alerts, one analyst, end of shift. Rank them 1–3 (1 = handle first). Think about host value, evidence strength, and who owns the machine."],"artefacts":[],"question":"Assign the correct priority rank to each alert.","hint":"Crown jewels first (domain controller), then a server with encoded execution, then a known admin’s routine command.","explanation":"Rank 1: a new service on the \u003cb>domain controller\u003c/b> whose path runs encoded PowerShell is the highest-value host with the strongest signal. Rank 2: Word spawning encoded PowerShell on a \u003cb>finance file server\u003c/b> is a strong signal on an important host. Rank 3: a \u003cb>known admin\u003c/b> running Get-Process on a dev laptop is routine administration. Ranking mixes technique signal strength (encoded = suspicious) with asset value (DC > server > laptop).","study":"Prioritisation logic: signal strength × asset value.","data":{"items":[{"t":"New service on HOST-DC-02 at 02:00 — path runs encoded PowerShell","rank":1,"why":"Crown-jewel host plus a strong execution signal — handle first."},{"t":"WINWORD spawned PowerShell -enc on FIN-SRV-03 (finance file server)","rank":2,"why":"Strong signal on a valuable server — second."},{"t":"Known admin ran powershell.exe Get-Process on DEV-LAP-12","rank":3,"why":"Routine admin command by a known identity — last."}]}},{"id":"M14","type":"fill","summary":"CTI briefing — complete the sentence about APT29-style tradecraft","scenario":["You draft the CTI briefing line for the CISO about APT29-style tradecraft. Complete every gap with a word from the box."],"artefacts":[],"question":"Choose the correct word for each gap.","hint":"The interpreter is PowerShell, the recurring mechanism is scheduled, and the event is 4104.","explanation":"APT29 is publicly known for heavy PowerShell use (T1059.001) and for scheduled tasks that keep tooling running (T1053.005). The quickest telemetry win against script execution is script block logging — event 4104. The distractors are plausible tools from the same toolbox (WMI, cron) but do not fit these gaps: WMI is a different technique, cron is Linux, 7045 is services, and Word is the lure, not the interpreter.","study":"The “Adversary use & tooling” theme: how named groups use TA0002 techniques.","data":{"textWithBlanks":"APT29-style tradecraft relied on {1} to run scripts (T1059.001) and on {2} tasks for recurring runs (T1053.005). The quickest telemetry win against their script use is script block logging, event {3}.","blanks":[{"answer":"PowerShell","why":"T1059.001 PowerShell is their signature interpreter."},{"answer":"scheduled","why":"T1053.005 Scheduled Task gives recurring runs."},{"answer":"4104","why":"Script block logging captures the script text."}],"bank":["WMI","cron","7045","Word"]}},{"id":"M15","type":"qcm","summary":"Budget question — the one telemetry source with the broadest Execution view","scenario":["The detection lead asks in the quarterly review: “If we can only fund ONE new telemetry source this quarter to catch the most Execution (TA0002) behaviour on Windows endpoints — which gives the broadest view?”"],"artefacts":[],"question":"Which telemetry source gives the broadest view of Execution behaviour?","hint":"Almost every Execution technique ends with a new process on the machine.","explanation":"\u003cb>Process creation events with full command lines is correct.\u003c/b> Process creation (4688 or Sysmon event 1) observes the end point of nearly every Execution technique: interpreters, WMI, services, tasks, user-executed files — all end in a started process. \u003cb>The USB option\u003c/b> covers device abuse, not execution. \u003cb>The firewall-deny option\u003c/b> sees network denials, not local code. \u003cb>The Wi-Fi option\u003c/b> covers Wi-Fi joins. That is why process telemetry is the recommended first buy for TA0002 coverage, with script block logging as a strong second.","study":"Coverage reasoning: which data source covers the most techniques at once.","data":{"options":[{"t":"USB device plug and unplug events on endpoints","why":"Device tracking says nothing about code starting."},{"t":"Firewall deny logs from the perimeter gateways","why":"Perimeter denials miss local execution entirely."},{"t":"Wi-Fi association logs from wireless access points","why":"Network joins are unrelated to code running."},{"t":"Process creation events with full command lines (4688)","correct":true,"why":"Correct — nearly all execution ends in a new process, so this sees the most."}]}},{"id":"M16","type":"categorize","summary":"Tabletop dual view — sort red and blue statements about the same macro","scenario":["In the tabletop, red and blue discuss the same macro incident. Four statements fly across the room. Sort each one by who would say it."],"artefacts":[],"question":"Drag each statement to the side that owns it: red team or blue team.","hint":"Red talks about their own tradecraft choices; blue talks about telemetry and rules.","explanation":"“One click runs our payload” and “hidden window so the console stays away” are red-team tradecraft decisions — they choose lures (T1204.002) and flags (-w hidden) to execute cleanly. “Tune rules for Office spawning interpreters” and “ship 4104 to the SIEM” are blue-team work — detection engineering and telemetry. Dual-perspective thinking is exactly how you predict both the attack path and the evidence it leaves.","study":"The dual-perspective habit: same technique, two views.","data":{"zones":[{"title":"Red team (attacker view)"},{"title":"Blue team (defender view)"}],"items":[{"t":"We used a macro because one click runs our payload (T1204.002).","target":0,"why":"Choosing the lure is attacker tradecraft."},{"t":"We tune rules for Office apps spawning interpreters.","target":1,"why":"Rule tuning is defender work."},{"t":"We chose -w hidden so no console window appears.","target":0,"why":"Hiding the interpreter window is attacker tradecraft."},{"t":"We ship script block logging (4104) to the SIEM.","target":1,"why":"Telemetry collection is defender work."}]}}]}</script>
<script>
/* Cyber Pulse Academy exam engine — part A (core) */
(function () {
'use strict';

var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var DATA = JSON.parse(document.getElementById('exam-data').textContent);
var CFG = DATA.config;

/* ---------------- helpers ---------------- */
function $(s, r) { return (r || document).querySelector(s); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s); }
function round1(n) { return Math.round(n * 10) / 10; }
function byId(id) { for (var i = 0; i < DATA.exercises.length; i++) { if (DATA.exercises[i].id === id) { return DATA.exercises[i]; } } return null; }
function badgeClass(sev) { return 'badge badge-' + (CFG.difficulty === 'extremely-hard' ? 'xhard' : CFG.difficulty); }

/* lightweight log/code highlighter (timestamps + Windows event IDs) */
function hl(text) {
  var t = esc(text);
  t = t.replace(/(\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/g, '<span class="tk-time">$1</span>');
  t = t.replace(/\b(4688|4104|4698|7045|4103|4697|4699|4702|1102|4624)\b/g, '<span class="tk-eid">$1</span>');
  return t;
}
function artefactNode(a) {
  var wrap = el('div', 'artefact');
  wrap.appendChild(el('div', 'artefact-h', esc(a.label)));
  var body = el('div', 'artefact-b');
  if (a.kind === 'log' || a.kind === 'code') {
    if (a.kind === 'log' && a.filter) {
      var fl = el('div', 'logfilter');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.placeholder = 'Filter lines…'; inp.setAttribute('aria-label', 'Filter log lines');
      var pre = el('pre', 'log');
      var render = function () {
        var q = inp.value.toLowerCase();
        var lines = a.lines.filter(function (ln) { return !q || String(ln).toLowerCase().indexOf(q) >= 0; });
        pre.innerHTML = lines.length ? lines.map(hl).join('\n') : '<span style="color:#7a87a0">No lines match this filter.</span>';
      };
      inp.addEventListener('input', render);
      fl.appendChild(inp);
      body.appendChild(fl);
      body.appendChild(pre);
      render();
    } else {
      var p = el('pre', a.kind === 'log' ? 'log' : 'code');
      p.innerHTML = (a.lines || []).map(hl).join('\n');
      body.appendChild(p);
    }
  } else if (a.kind === 'table') {
    var tb = el('div');
    tb.style.overflowX = 'auto';
    var tbl = el('table');
    tbl.style.borderCollapse = 'collapse'; tbl.style.width = '100%'; tbl.style.fontSize = '14px';
    (a.rows || []).forEach(function (row, ri) {
      var tr = document.createElement('tr');
      row.forEach(function (cellText) {
        var td = el(ri === 0 ? 'th' : 'td');
        td.style.cssText = 'border:1px solid #2a3550;padding:7px 10px;text-align:left;font-weight:' + (ri === 0 ? '800' : '400') + ';background:' + (ri % 2 ? '#121a2c' : 'transparent');
        td.innerHTML = hl(cellText);
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    tb.appendChild(tbl);
    body.appendChild(tb);
  } else {
    (a.body instanceof Array ? a.body : [a.body || '']).forEach(function (para) { body.appendChild(el('p', null, para)); });
  }
  wrap.appendChild(body);
  return wrap;
}

/* ---------------- partial-credit scoring engine ---------------- */
function scoreExercise(H, W, N) { if (!N) { return 0; } return Math.max(0, (H - W) / N); }
function hintAdjusted(credit) { return Math.max(0, credit - 0.10); }

/* ---------------- exam state ---------------- */
var S = {
  phase: 'intro',            /* intro | exam | review | results */
  order: [], pos: 0,
  rec: {},                   /* id -> {credit, answered, hintUsed, skipped} */
  skipped: [],
  reviewingFrom: null,
  timer: 'RUNNING',          /* RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  manualBefore: null,
  remaining: CFG.seconds,
  pauseManualSec: 0, pauseAutoSec: 0, pauseSince: null,
  creditSum: 0, answered: 0,
  reported: false,
  user: null,
  flow: {},                  /* id -> {step, choices[], done} */
  exRemaining: null,         /* per-exercise countdown (seconds) for EXTREMELY HARD terminal */
  widget: null, checked: false, notice: null
};
var ticker = null;

function currentId() { return S.order[S.pos]; }

/* ---------------- timer state machine ---------------- */
/* States: RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED (explicit, testable transitions) */
function setTimerState(st) {
  if (S.timer === st) { return; }
  if (S.pauseSince) {
    var d = Math.floor((Date.now() - S.pauseSince.at) / 1000);
    if (S.pauseSince.kind === 'manual') { S.pauseManualSec += d; } else { S.pauseAutoSec += d; }
    S.pauseSince = null;
  }
  if (st === 'PAUSED_MANUAL') { S.pauseSince = { kind: 'manual', at: Date.now() }; }
  if (st === 'PAUSED_AUTO_CHECK') { S.pauseSince = { kind: 'auto', at: Date.now() }; }
  S.timer = st;
  renderHeader();
}
function stateLabel(st) {
  if (st === 'RUNNING') { return '<span class="tstate tstate-run">▶ RUNNING</span>'; }
  if (st === 'PAUSED_MANUAL') { return '<span class="tstate tstate-man">⏸ PAUSED — manual (press Resume)</span>'; }
  if (st === 'PAUSED_AUTO_CHECK') { return '<span class="tstate tstate-auto">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'; }
  return '<span class="tstate tstate-end">⏹ ENDED</span>';
}
function tick() {
  if ((S.phase !== 'exam' && S.phase !== 'review') || S.timer !== 'RUNNING') { return; }
  S.remaining -= 1;
  if (S.exRemaining != null) {
    S.exRemaining -= 1;
    var tb = $('#exTimebox');
    if (tb) { tb.textContent = '⏱ Exercise timer: ' + fmtClock(S.exRemaining); }
    if (S.exRemaining <= 0) { expireExercise(); return; }
  }
  if (S.remaining <= 0) {
    S.remaining = 0;
    setTimerState('ENDED');
    finishExam('The exam timer reached zero. Exercises you never answered were excluded from the score.');
    return;
  }
  renderHeader();
}
function startTicker() { if (!ticker) { ticker = setInterval(tick, 1000); } }

/* ---------------- header ---------------- */
function renderHeader() {
  var c = $('#hdrCounter');
  if (S.phase === 'exam') { c.textContent = 'Exercise ' + (S.pos + 1) + ' of ' + S.order.length; }
  else if (S.phase === 'review') { c.textContent = 'Review skipped exercises'; }
  else if (S.phase === 'results') { c.textContent = 'Final results'; }
  else { c.textContent = 'Introduction'; }
  $('#hdrTimer').textContent = '⏱ ' + fmtClock(S.remaining);
  $('#hdrTimerState').innerHTML = stateLabel(S.timer);
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('#hdrScore').textContent = 'Score ' + round1(S.creditSum) + ' / ' + S.answered + ' (' + pct + '%)';
  var hintBtn = $('#btnHint'), skipBtn = $('#btnSkip'), pauseBtn = $('#btnPause');
  hintBtn.disabled = (S.phase !== 'exam') || S.checked || (S.rec[currentId()] ? S.rec[currentId()].hintUsed : false);
  skipBtn.disabled = (S.phase !== 'exam') || S.checked;
  pauseBtn.textContent = (S.timer === 'PAUSED_MANUAL') ? '▶ Resume' : '⏸ Pause';
  pauseBtn.disabled = (S.phase !== 'exam');
}

/* ---------------- intro screen ---------------- */
function renderIntro() {
  S.phase = 'intro';
  $('#hdr').classList.add('hidden');
  var stage = $('#stage');
  stage.innerHTML = '';
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, esc(CFG.introTitle)));
  var chips = el('div', 'metachips');
  [['badge', CFG.severity], ['chip', DATA.exercises.length + ' exercises'], ['chip', 'Pass mark: 70%'],
   ['chip', 'Time limit: ' + CFG.minutes + ' minutes'], ['chip', 'MITRE ATT&CK ' + CFG.objectId]].forEach(function (m) {
    chips.appendChild(el(m[0] === 'badge' ? 'span' : 'span', m[0] === 'badge' ? badgeClass() : 'mchip', esc(m[1])));
  });
  sheet.appendChild(chips);
  if (S.user) { sheet.appendChild(el('p', 'small', 'Candidate: ' + esc(S.user))); }

  var ex = el('div', null, DATA.intro.entityHtml);
  sheet.appendChild(ex);
  sheet.appendChild(el('h2', null, 'Related concepts covered in this exam (Keywords Covered)'));
  DATA.keywords.forEach(function (th) {
    var t = el('div', 'kwtheme');
    t.appendChild(el('h3', null, esc(th.theme)));
    var kc = el('div', 'kwchips');
    th.chips.forEach(function (c) { kc.appendChild(el('span', 'kw', esc(c))); });
    t.appendChild(kc);
    sheet.appendChild(t);
  });

  sheet.appendChild(el('h2', null, 'How this exam works'));
  sheet.appendChild(el('div', null, DATA.intro.rulesHtml));

  var nav = el('div', 'navrow');
  var start = el('button', 'btn btn-primary', 'Start the exam');
  start.type = 'button';
  start.addEventListener('click', startExam);
  nav.appendChild(start);
  sheet.appendChild(nav);
  stage.appendChild(sheet);
  window.scrollTo(0, 0);
}

/* ---------------- exam flow ---------------- */
function resetAttemptState() {
  S.order = shuffle(DATA.exercises.map(function (e) { return e.id; }));
  S.pos = 0; S.rec = {}; S.skipped = []; S.reviewingFrom = null;
  S.remaining = CFG.seconds; S.pauseManualSec = 0; S.pauseAutoSec = 0; S.pauseSince = null;
  S.creditSum = 0; S.answered = 0; S.flow = {}; S.exRemaining = null;
  S.widget = null; S.checked = false; S.notice = null;
  DATA.exercises.forEach(function (e) { S.rec[e.id] = { credit: null, answered: false, hintUsed: false, skipped: false }; });
}
function startExam() {
  resetAttemptState();
  S.phase = 'exam';
  $('#hdr').classList.remove('hidden');
  setTimerState('RUNNING');
  startTicker();
  renderExercise();
}
function retake() {
  S.reported = false;
  resetAttemptState();
  S.phase = 'exam';
  $('#hdr').classList.remove('hidden');
  setTimerState('RUNNING');
  renderExercise();
}
function finishExam(note) {
  S.phase = 'results';      /* set before setTimerState so the header renders "Final results" */
  setTimerState('ENDED');
  renderResults(note);
  reportScore();
}
function timeUpNote() { return null; }

/* expose part A to part B (same IIFE is concatenated, so direct scope sharing) */

/* Cyber Pulse Academy exam engine — part B (widgets, feedback, screens, reporting) */

/* ---------------- manual pause overlay ---------------- */
function onPauseBtn() {
  if (S.phase !== 'exam') { return; }
  if (S.timer === 'PAUSED_MANUAL') {
    var prior = S.manualBefore || 'RUNNING';
    S.manualBefore = null;
    $('#pauseOverlay').classList.add('hidden');
    setTimerState(prior);
  } else if (S.timer === 'RUNNING' || S.timer === 'PAUSED_AUTO_CHECK') {
    S.manualBefore = S.timer;
    setTimerState('PAUSED_MANUAL');
    $('#pauseOverlay').classList.remove('hidden');
    try { $('#btnResume').focus(); } catch (e) { /* focus move is progressive enhancement */ }
  }
}

/* ---------------- widget: qcm (single + multi) ---------------- */
function buildQcm(ex, root, checkBtn, multi) {
  var letters = 'ABCDEFGHIJ';
  var view = shuffle(ex.data.options.map(function (o, i) { return { i: i, t: o.t, correct: !!o.correct, why: o.why }; }));
  var sel = {};
  var list = el('div', 'optlist');
  var btns = [];
  view.forEach(function (o, vi) {
    var b = el('button', 'opt');
    b.type = 'button';
    b.innerHTML = '<span class="opt-label">' + letters[vi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
    b.addEventListener('click', function () {
      if (S.checked) { return; }
      if (multi) {
        sel[vi] = !sel[vi];
        b.classList.toggle('sel', !!sel[vi]);
      } else {
        sel = {};
        btns.forEach(function (x) { x.classList.remove('sel'); });
        sel[vi] = true;
        b.classList.add('sel');
      }
      var any = false;
      Object.keys(sel).forEach(function (k) { if (sel[k]) { any = true; } });
      checkBtn.disabled = !any;
    });
    btns.push(b);
    list.appendChild(b);
  });
  root.appendChild(list);
  function lab(o, vi) { return letters[vi] + '. ' + o.t; }
  return {
    grade: function () {
      var chosen = [];
      view.forEach(function (o, vi) { if (sel[vi]) { chosen.push({ o: o, vi: vi }); } });
      if (!multi) {
        if (chosen.length === 0) {
          return { H: 0, W: 0, N: 1, items: [{ state: 'missed', label: 'No option was selected', why: 'Nothing was chosen when Check was pressed.' }] };
        }
        var c = chosen[0];
        if (c.o.correct) { return { H: 1, W: 0, N: 1, items: [{ state: 'correct', label: lab(c.o, c.vi), why: c.o.why }] }; }
        var right = null, rightVi = 0;
        view.forEach(function (o, vi) { if (o.correct) { right = o; rightVi = vi; } });
        return { H: 0, W: 1, N: 1, items: [
          { state: 'wrong', label: lab(c.o, c.vi), why: c.o.why },
          { state: 'missed', label: lab(right, rightVi), why: right.why }
        ] };
      }
      var H = 0, W = 0, N = 0, items = [];
      view.forEach(function (o, vi) {
        var wasSel = !!sel[vi];
        if (o.correct) {
          N++;
          if (wasSel) { H++; items.push({ state: 'correct', label: lab(o, vi), why: o.why }); }
          else { items.push({ state: 'missed', label: lab(o, vi), why: o.why }); }
        } else if (wasSel) {
          W++; items.push({ state: 'wrong', label: lab(o, vi), why: o.why });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  };
}

/* ---------------- widget: chip yard (match + categorize) ---------------- */
function buildPlace(ex, root, checkBtn) {
  var d = ex.data;
  var isMatch = ex.type === 'match';
  var items = shuffle(d.items.map(function (o, i) { return { i: i, t: o.t, target: o.target, why: o.why }; }));
  var assign = {};
  var picked = null;
  var chipEls = {}, zoneSlots = [], zoneEmpties = [];
  var bankChips = el('div', 'bank-chips');

  var zonesWrap = el('div', 'yard-zones');
  d.zones.forEach(function (z, zi) {
    var zone = el('div', isMatch ? 'yzone matchrow' : 'yzone');
    var title = el('p', 'yzone-title', esc(z.title));
    var slots = el('div', 'yzone-slots');
    var empty = el('span', null, isMatch ? 'Tap a chip, then tap here' : 'Drop matching chips here');
    empty.style.cssText = 'color:#7a87a0;font-size:13px;align-self:center';
    slots.appendChild(empty);
    zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
    zone.addEventListener('drop', function (ev) {
      ev.preventDefault(); zone.classList.remove('over');
      var idx = ev.dataTransfer.getData('text/plain');
      if (idx !== '') { place(parseInt(idx, 10), zi); }
    });
    zone.addEventListener('click', function (ev) {
      if (ev.target !== zone && ev.target !== slots && ev.target !== title && ev.target !== empty) { return; }
      if (picked != null) { place(picked, zi); }
    });
    zone.tabIndex = 0;
    zone.setAttribute('role', 'button');
    zone.setAttribute('aria-label', 'Drop target: ' + z.title + '. Select a chip, then press Enter here to place it.');
    zone.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (picked != null) { place(picked, zi); } }
    });
    if (isMatch) {
      zone.appendChild(title); zone.appendChild(slots);
    } else {
      zone.appendChild(title); zone.appendChild(slots);
    }
    zoneSlots[zi] = slots; zoneEmpties[zi] = empty;
    zonesWrap.appendChild(zone);
  });

  items.forEach(function (it) {
    var chip = el('button', 'chip', esc(it.t));
    chip.type = 'button';
    chip.draggable = true;
    chip.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(it.i)); });
    chip.addEventListener('click', function () {
      if (S.checked) { return; }
      if (assign[it.i] !== undefined) { assign[it.i] = undefined; picked = null; renderAll(); return; }
      picked = (picked === it.i) ? null : it.i;
      renderAll();
    });
    chipEls[it.i] = chip;
  });

  function place(itemIdx, zoneIdx) {
    if (S.checked) { return; }
    assign[itemIdx] = zoneIdx;
    picked = null;
    renderAll();
  }
  function renderAll() {
    d.zones.forEach(function (z, zi) { zoneSlots[zi].innerHTML = ''; zoneSlots[zi].appendChild(zoneEmpties[zi]); });
    bankChips.innerHTML = '';
    items.forEach(function (it) {
      var chip = chipEls[it.i];
      chip.classList.toggle('pick', picked === it.i);
      chip.setAttribute('aria-pressed', picked === it.i ? 'true' : 'false');
      if (assign[it.i] === undefined) { bankChips.appendChild(chip); }
      else { zoneSlots[assign[it.i]].appendChild(chip); }
    });
    d.zones.forEach(function (z, zi) {
      zoneEmpties[zi].style.display = (zoneSlots[zi].children.length > 1) ? 'none' : 'inline';
    });
    var count = 0;
    Object.keys(assign).forEach(function (k) { if (assign[k] !== undefined) { count++; } });
    checkBtn.disabled = (count === 0);
  }

  var bank = el('div', 'bank');
  bank.appendChild(el('p', 'bank-title', 'Chips — tap one, then tap a target'));
  bank.appendChild(bankChips);
  bank.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  bank.addEventListener('drop', function (ev) {
    ev.preventDefault();
    var idx = ev.dataTransfer.getData('text/plain');
    if (idx !== '') { assign[parseInt(idx, 10)] = undefined; picked = null; renderAll(); }
  });
  var yard = el('div', 'yard');
  yard.appendChild(zonesWrap); yard.appendChild(bank);
  root.appendChild(yard);
  renderAll();

  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it) {
        var a = assign[it.i];
        if (a === undefined) { fb.push({ state: 'missed', label: it.t, why: it.why }); }
        else if (a === it.target) { H++; fb.push({ state: 'correct', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ordering ---------------- */
function buildOrder(ex, root, checkBtn) {
  var correct = ex.data.items;
  var view = shuffle(correct.map(function (o, i) { return { i: i, t: o.t, why: o.why }; }));
  var list = el('div', 'ordlist');
  var rows = [];
  function rerender() {
    list.innerHTML = '';
    view.forEach(function (it, idx) {
      var row = rows[it.i];
      row._pos = idx;
      list.appendChild(row);
    });
  }
  view.forEach(function (it) {
    var row = el('div', 'ord-row');
    row.setAttribute('draggable', 'true');
    row.innerHTML = '<span class="ord-handle" aria-hidden="true">≡</span><span class="ord-text">' + esc(it.t) + '</span>';
    var up = el('button', 'ord-btn', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
    var down = el('button', 'ord-btn', '▼'); down.type = 'button'; down.setAttribute('aria-label', 'Move down');
    up.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p > 0) { var t = view[p - 1]; view[p - 1] = view[p]; view[p] = t; rerender(); } });
    down.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p < view.length - 1) { var t = view[p + 1]; view[p + 1] = view[p]; view[p] = t; rerender(); } });
    row.appendChild(up); row.appendChild(down);
    row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(row._pos)); row.classList.add('dragging'); });
    row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
    row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
    row.addEventListener('drop', function (ev) {
      ev.preventDefault();
      if (S.checked) { return; }
      var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
      var to = row._pos;
      if (!isNaN(from) && from !== to) {
        var moved = view.splice(from, 1)[0];
        view.splice(to, 0, moved);
        rerender();
      }
    });
    rows[it.i] = row;
  });
  rerender();
  root.appendChild(list);
  checkBtn.disabled = false;
  return {
    grade: function () {
      var H = 0, W = 0, N = view.length, fb = [];
      view.forEach(function (it, p) {
        var ok = (it.i === p);
        if (ok) { H++; } else { W++; }
        fb.push({
          state: ok ? 'correct' : 'wrong',
          label: 'Position ' + (p + 1) + ': ' + it.t,
          why: ok ? it.why : (it.why + ' (Correct position: ' + (it.i + 1) + '. In that slot the item was: ' + correct[p].t + '.)')
        });
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: fill in the blanks ---------------- */
function buildFill(ex, root, checkBtn) {
  var d = ex.data;
  var bank = shuffle(d.blanks.map(function (b) { return b.answer; }).concat(d.bank || []));
  var wrap = el('div', 'fillwrap');
  var sels = {};
  var parts = d.textWithBlanks.split(/\{(\d+)\}/g);
  function makeSelect(n) {
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Blank ' + n);
    s.appendChild(new Option('— choose —', ''));
    bank.forEach(function (o) { s.appendChild(new Option(o, o)); });
    s.addEventListener('change', function () {
      var any = false;
      Object.keys(sels).forEach(function (k) { if (sels[k].value) { any = true; } });
      checkBtn.disabled = !any;
    });
    return s;
  }
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { wrap.appendChild(document.createTextNode(parts[i])); }
    else {
      var n = parseInt(parts[i], 10);
      var s = makeSelect(n);
      sels[n] = s;
      wrap.appendChild(s);
    }
  }
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = d.blanks.length, fb = [];
      d.blanks.forEach(function (b, bi) {
        var v = sels[bi + 1] ? sels[bi + 1].value : '';
        if (!v) { fb.push({ state: 'missed', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else if (v === b.answer) { H++; fb.push({ state: 'correct', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'Blank ' + (bi + 1) + ': you chose “' + v + '” → correct: ' + b.answer, why: b.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ranking ---------------- */
function buildRank(ex, root, checkBtn) {
  /* shuffle display order so the stored rank order never leaks the answer */
  var items = shuffle(ex.data.items.map(function (o) { return { t: o.t, rank: o.rank, why: o.why }; }));
  var wrap = el('div');
  var sels = [];
  items.forEach(function (it, i) {
    var row = el('div', 'rankrow');
    row.appendChild(el('span', 'rank-text', esc(it.t)));
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Rank for: ' + it.t);
    s.appendChild(new Option('— rank —', ''));
    for (var r = 1; r <= items.length; r++) { s.appendChild(new Option(String(r), String(r))); }
    s.addEventListener('change', function () {
      var any = false;
      sels.forEach(function (x) { if (x.value) { any = true; } });
      checkBtn.disabled = !any;
    });
    sels.push(s);
    row.appendChild(s);
    wrap.appendChild(row);
  });
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it, i) {
        var v = sels[i].value;
        if (!v) { fb.push({ state: 'missed', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else if (parseInt(v, 10) === it.rank) { H++; fb.push({ state: 'correct', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'You ranked ' + v + ': ' + it.t + ' → correct rank: ' + it.rank, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: terminal ---------------- */
function normCmd(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function buildTerminal(ex, root, checkBtn) {
  var d = ex.data;
  root.appendChild(el('div', 'small', 'Type the command, press Run to see the lab answer, then press Check to grade it. Nothing real is executed.'));
  if (d.notice) { root.appendChild(el('div', 'timebox', esc(d.notice))); }
  var box = el('div', 'term');
  var scroll = el('pre', 'term-scroll');
  scroll.textContent = (d.banner || []).join('\n');
  var prow = el('div', 'term-prompt');
  var lab = el('label', null, esc(d.prompt));
  lab.setAttribute('for', 'termIn');
  var inp = document.createElement('input');
  inp.className = 'term-in'; inp.id = 'termIn'; inp.type = 'text';
  inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('aria-label', 'Command line input');
  var run = el('button', 'term-run', 'Run');
  run.type = 'button';
  prow.appendChild(lab); prow.appendChild(inp); prow.appendChild(run);
  box.appendChild(scroll); box.appendChild(prow);
  root.appendChild(box);
  if (d.syntax) {
    var sp = el('div', 'synpanel');
    sp.appendChild(el('h4', null, 'Syntax reminder'));
    sp.appendChild(el('div', null, d.syntax.note));
    sp.appendChild(el('p', 'syn-ex', 'Example on a different target: <code>' + esc(d.syntax.example) + '</code>'));
    sp.appendChild(el('p', 'syn-ex', 'Expected output shape: <code>' + esc(d.syntax.sampleOut) + '</code>'));
    root.appendChild(sp);
  }
  function runCmd() {
    var v = inp.value;
    scroll.textContent += '\n' + d.prompt + ' ' + v + '\n';
    var n = normCmd(v);
    if (n && d.simMatch && new RegExp(d.simMatch).test(n)) {
      (d.sim || []).forEach(function (l) { scroll.textContent += l + '\n'; });
    } else if (n) {
      scroll.textContent += 'command not found: ' + v.trim().split(/\s+/)[0] + ' — this lab recognises only the command expected here.\n';
    }
    scroll.scrollTop = scroll.scrollHeight;
    if (n) { checkBtn.disabled = false; }
  }
  run.addEventListener('click', runCmd);
  inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { runCmd(); } });
  return {
    typed: function () { return normCmd(inp.value); },
    grade: function () {
      var n = normCmd(inp.value);
      var H = 0, W = 0, items = [];
      if (!n) {
        return { H: 0, W: 0, N: d.elements.length, items: [{ state: 'missed', label: 'No command was typed', why: 'The input was empty at Check time.' }] };
      }
      d.elements.forEach(function (eDef) {
        if (new RegExp(eDef.re).test(n)) { H++; items.push({ state: 'correct', label: eDef.label, why: eDef.why }); }
        else { items.push({ state: 'missed', label: eDef.label, why: eDef.why }); }
      });
      (d.danger || []).forEach(function (dg) {
        if (new RegExp(dg.re).test(n)) { W++; items.push({ state: 'wrong', label: dg.label, why: dg.why }); }
      });
      return { H: H, W: W, N: d.elements.length, items: items };
    }
  };
}

/* ---------------- widget: branching flow ---------------- */
function buildFlow(ex, root, checkBtn) {
  var steps = ex.data.steps;
  var letters = 'ABCDEF';
  var st = { step: 0, choices: [] };
  S.flow[ex.id] = st;
  var holder = el('div');
  root.appendChild(holder);
  function renderStep() {
    holder.innerHTML = '';
    if (st.step >= steps.length) {
      holder.appendChild(el('div', 'notice', 'All steps are taken. Press Check to grade the complete path you chose.'));
      checkBtn.disabled = false;
      return;
    }
    var s = steps[st.step];
    holder.appendChild(el('span', 'step-tag', 'STEP ' + (st.step + 1) + ' OF ' + steps.length));
    (s.text || []).forEach(function (t) { holder.appendChild(el('p', 'flow-text', t)); });
    (s.artefacts || []).forEach(function (a) { holder.appendChild(artefactNode(a)); });
    var list = el('div', 'optlist');
    shuffle(s.options).forEach(function (o, oi) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.innerHTML = '<span class="opt-label">' + letters[oi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked) { return; }
        st.choices[st.step] = o;
        st.step += 1;
        renderStep();
      });
      list.appendChild(b);
    });
    holder.appendChild(list);
  }
  renderStep();
  return {
    grade: function () {
      var H = 0, W = 0, N = steps.length, fb = [];
      steps.forEach(function (s, i) {
        var ch = st.choices[i];
        var right = null;
        s.options.forEach(function (o) { if (o.correct) { right = o; } });
        if (ch && ch.correct) {
          H++; fb.push({ state: 'correct', label: 'Step ' + (i + 1) + ': ' + ch.t, why: ch.why });
        } else {
          W++; fb.push({
            state: 'wrong',
            label: 'Step ' + (i + 1) + ': ' + (ch ? ch.t : '(no choice)'),
            why: (ch ? ch.why + ' ' : '') + 'Better: ' + right.t + ' — ' + right.why
          });
        }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

function buildWidget(ex, root, checkBtn) {
  if (ex.type === 'qcm') { return buildQcm(ex, root, checkBtn, false); }
  if (ex.type === 'qcm-multi') { return buildQcm(ex, root, checkBtn, true); }
  if (ex.type === 'match' || ex.type === 'categorize') { return buildPlace(ex, root, checkBtn); }
  if (ex.type === 'order') { return buildOrder(ex, root, checkBtn); }
  if (ex.type === 'fill') { return buildFill(ex, root, checkBtn); }
  if (ex.type === 'rank') { return buildRank(ex, root, checkBtn); }
  if (ex.type === 'terminal') { return buildTerminal(ex, root, checkBtn); }
  if (ex.type === 'flow') { return buildFlow(ex, root, checkBtn); }
  return buildQcm(ex, root, checkBtn, false);
}

/* ---------------- exercise screen ---------------- */

/* ---------------- check + feedback ---------------- */
function onCheck() {
  if (S.checked || !S.widget) { return; }
  setTimerState('PAUSED_AUTO_CHECK'); /* first action: stop the clock before rendering feedback */
  var ex = byId(currentId());
  var g = S.widget.grade();
  var credit = scoreExercise(g.H, g.W, g.N);
  var rec = S.rec[currentId()];
  if (rec.hintUsed) { credit = hintAdjusted(credit); }
  rec.credit = credit;
  rec.answered = true;
  S.creditSum += credit;
  S.answered += 1;
  S.checked = true;
  S.exRemaining = null;
  var checkBtn = $('#btnCheck');
  if (checkBtn) { checkBtn.classList.add('hidden'); }
  renderFeedback(ex, g, credit, rec.hintUsed);
  renderHeader();
}
function renderFeedback(ex, g, credit, hintUsed) {
  var anchor = $('#fbAnchor');
  anchor.innerHTML = '';
  var cls = credit >= 1 ? 'fb-correct' : (credit > 0 ? 'fb-partial' : 'fb-wrong');
  var icon = credit >= 1 ? '✔ CORRECT' : (credit > 0 ? '◔ PARTIALLY CORRECT' : '✘ INCORRECT');
  var fb = el('section', 'block blk-feedback ' + cls);
  var head = el('div', 'fb-head', '<span>' + icon + '</span>');
  if (g.N > 1) {
    head.appendChild(el('span', 'fb-credit', 'credit ' + credit.toFixed(2) + ' — ' + g.H + '/' + g.N + ' items' + (hintUsed ? ' (after −0.10 hint penalty)' : '')));
  } else if (hintUsed) {
    head.appendChild(el('span', 'fb-credit', 'credit ' + credit.toFixed(2) + ' (after −0.10 hint penalty)'));
  }
  fb.appendChild(head);
  var body = el('div', 'fb-body');
  if (g.N > 1) {
    var ul = el('ul', 'fb-items');
    g.items.forEach(function (it) {
      var ic = it.state === 'correct' ? '<span class="ic-c">✓ Correct</span>'
        : (it.state === 'wrong' ? '<span class="ic-w">✗ Wrong</span>' : '<span class="ic-m">○ Missed</span>');
      ul.appendChild(el('li', 'fb-item', ic + '<span><b>' + esc(it.label) + '</b><br><span class="fb-why">' + esc(it.why) + '</span></span>'));
    });
    body.appendChild(ul);
  }
  body.appendChild(el('p', 'fb-expl', ex.explanation));
  if (ex.study) { body.appendChild(el('p', 'fb-study', 'What to study: ' + esc(ex.study))); }
  var nav = el('div', 'navrow');
  var label;
  if (S.reviewingFrom) { label = '↩ Return to review'; }
  else if (S.pos >= S.order.length - 1) { label = S.skipped.length ? 'Go to skipped review' : '🏁 Final Submit'; }
  else { label = 'Next ▶'; }
  var next = el('button', 'btn btn-blue', label);
  next.type = 'button';
  next.addEventListener('click', onNext);
  nav.appendChild(next);
  body.appendChild(nav);
  fb.appendChild(body);
  anchor.appendChild(fb);
  var motionOk = true;
  try { motionOk = !window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { /* default on */ }
  anchor.scrollIntoView({ behavior: motionOk ? 'smooth' : 'auto', block: 'nearest' });
}
function unansweredSkipped() {
  return S.skipped.filter(function (id) { return !S.rec[id].answered; });
}
function onNext() {
  if (S.reviewingFrom) {
    var rid = S.reviewingFrom;
    S.reviewingFrom = null;
    if (S.rec[rid].answered) {
      var si = S.skipped.indexOf(rid);
      if (si >= 0) { S.skipped.splice(si, 1); }
    }
    setTimerState('RUNNING');
    if (unansweredSkipped().length) { renderReview(); }
    else { finishExam(null); }
    return;
  }
  if (S.pos < S.order.length - 1) {
    S.pos += 1;
    setTimerState('RUNNING');
    renderExercise();
  } else if (unansweredSkipped().length) {
    setTimerState('RUNNING');
    renderReview();
  } else {
    finishExam(null);
  }
}

/* ---------------- skip / hint ---------------- */
function onSkip() {
  if (S.phase !== 'exam' || S.checked) { return; }
  var id = currentId();
  var rec = S.rec[id];
  if (!rec.skipped) {
    rec.skipped = true;
    if (S.skipped.indexOf(id) < 0) { S.skipped.push(id); }
  }
  S.exRemaining = null;
  if (S.reviewingFrom) {
    S.reviewingFrom = null;
    renderReview();
    return;
  }
  if (S.pos < S.order.length - 1) { S.pos += 1; renderExercise(); }
  else { renderReview(); }
}
function expireExercise() {
  S.exRemaining = null;
  S.notice = '⏱ That exercise ran out of its own timer and moved to the skipped pool. You can still answer it from the review screen while the exam timer runs.';
  onSkip();
}
function onHint() {
  if (S.phase !== 'exam' || S.checked) { return; }
  var rec = S.rec[currentId()];
  if (rec.hintUsed) { return; }
  rec.hintUsed = true;
  var ex = byId(currentId());
  var area = $('#hintArea');
  area.innerHTML = '';
  area.appendChild(el('div', 'hintline', '💡 Hint (−10% of this exercise’s credit): ' + esc(ex.hint)));
  renderHeader();
}

/* ---------------- review skipped ---------------- */
function renderReview() {
  S.phase = 'review';
  var stage = $('#stage');
  stage.innerHTML = '';
  var pool = unansweredSkipped();
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, 'Review skipped exercises'));
  sheet.appendChild(el('p', null, 'These exercises are not answered yet. They are excluded from your score until you answer them. You can come back as often as you want while the exam timer is still running.'));
  if (S.notice) { sheet.appendChild(el('div', 'notice', esc(S.notice))); S.notice = null; }
  if (!pool.length) {
    sheet.appendChild(el('div', 'notice', 'All skipped exercises have been answered. Finish the exam to see your results.'));
  }
  pool.forEach(function (id) {
    var ex = byId(id);
    var row = el('div', 'rev-row');
    row.appendChild(el('span', 'pill pill-excl', '⚠ NOT ANSWERED — EXCLUDED'));
    row.appendChild(el('span', 'rev-txt', esc(ex.summary)));
    var b = el('button', 'btn btn-ghost', 'Answer now');
    b.type = 'button';
    b.addEventListener('click', function () {
      S.reviewingFrom = id;
      S.pos = S.order.indexOf(id);
      renderExercise();
    });
    row.appendChild(b);
    sheet.appendChild(row);
  });
  var nav = el('div', 'navrow');
  var fin = el('button', 'btn btn-primary', '🏁 Finish the exam');
  fin.type = 'button';
  fin.addEventListener('click', function () { finishExam(null); });
  nav.appendChild(fin);
  sheet.appendChild(nav);
  stage.appendChild(sheet);
  renderHeader();
  window.scrollTo(0, 0);
}

/* ---------------- results ---------------- */
function renderResults(note) {
  var stage = $('#stage');
  stage.innerHTML = '';
  var full = 0, partial = 0, zero = 0, partialSum = 0, skippedNever = 0;
  DATA.exercises.forEach(function (e) {
    var r = S.rec[e.id];
    if (r.answered) {
      if (r.credit >= 1) { full++; }
      else if (r.credit > 0) { partial++; partialSum += r.credit; }
      else { zero++; }
    } else { skippedNever++; }
  });
  var percent = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  var pass = percent >= 70 && S.answered > 0;
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, 'Final results — ' + esc(CFG.title)));
  sheet.appendChild(el('div', 'bigscore', percent + '%'));
  if (pass) {
    var pp = el('div', 'passpanel');
    pp.appendChild(el('div', null, '🎉 PASSED — certificate of completion'));
    pp.appendChild(el('div', 'certname', esc(S.user ? S.user : 'Cyber Pulse Academy learner')));
    pp.appendChild(el('div', 'small', esc(CFG.title) + ' · pass mark 70% · ' + new Date().toLocaleDateString()));
    sheet.appendChild(pp);
  } else {
    var fp = el('div', 'failpanel');
    fp.appendChild(el('div', null, '❌ Not passed this time'));
    fp.appendChild(el('div', 'small', 'You need at least 70% over the answered exercises. You must retake the exam.'));
    sheet.appendChild(fp);
  }
  if (note) { sheet.appendChild(el('div', 'notice', esc(note))); }
  var bd = el('div');
  function row(k, v) { var r = el('div', 'resrow'); r.appendChild(el('span', null, k)); r.appendChild(el('span', 'rv', v)); bd.appendChild(r); }
  row('Fully correct', String(full));
  row('Partially correct', partial ? partial + ' (avg ' + (partialSum / partial).toFixed(2) + ')' : '0');
  row('Fully incorrect', String(zero));
  row('Skipped and never answered (excluded)', String(skippedNever));
  row('Score over answered exercises', round1(S.creditSum) + ' / ' + S.answered + ' — ' + percent + '%');
  var active = Math.max(0, CFG.seconds - S.remaining);
  row('Active time on the clock', fmtClock(active));
  row('Time paused for manual breaks', fmtClock(S.pauseManualSec));
  row('Time spent studying feedback', fmtClock(S.pauseAutoSec));
  sheet.appendChild(el('h2', null, 'Score breakdown'));
  sheet.appendChild(bd);
  var nav = el('div', 'navrow');
  var rt = el('button', 'btn btn-primary', '🔁 Retake Exam');
  rt.type = 'button';
  rt.addEventListener('click', retake);
  nav.appendChild(rt);
  sheet.appendChild(nav);
  stage.appendChild(sheet);
  window.scrollTo(0, 0);
}

/* ---------------- website integration (STEP 6) ---------------- */
function reportScore() {
  if (S.reported) { return; }
  S.reported = true;
  var score = Math.round(S.creditSum);
  var total = S.answered;
  var percent = total > 0 ? Math.round((S.creditSum / total) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: score,
      total: total,
      percent: percent,
      passed: percent >= 70
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d) { return; }
  if (d.type === 'CYBERPULSE_INIT' || d.type === 'CYBERMASTERY_INIT') {
    S.user = d.username || S.user;
    if (S.phase === 'intro' && S.user) { renderIntro(); }
  }
});

/* ---------------- boot ---------------- */
(function boot() {
  $('#btnHint').addEventListener('click', onHint);
  $('#btnSkip').addEventListener('click', onSkip);
  $('#btnPause').addEventListener('click', onPauseBtn);
  $('#btnResume').addEventListener('click', onPauseBtn);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && S.phase === 'exam' && S.timer === 'PAUSED_MANUAL') { onPauseBtn(); }
  });
  renderIntro();
})();
})();

</script>
</body>
</html>
