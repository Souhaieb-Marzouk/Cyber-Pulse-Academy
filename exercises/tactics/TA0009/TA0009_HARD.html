function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtMMSS(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}
function pct(sum, n) { return n > 0 ? Math.round((sum / n) * 100) : 0; }
function LETTER(i) { return String.fromCharCode(65 + i); }
function sevLabel() { var c = document.body.className.replace('se-', ''); return c === 'xhard' ? 'EXTREMELY HARD' : c.toUpperCase(); }

/* Mandatory partial-credit scoring formula (enforced for every multi-answer exercise). */
function scoreExercise(selectedItems, correctItems) {
  var corr = {}, i;
  for (i = 0; i < correctItems.length; i++) corr[correctItems[i]] = true;
  var H = 0, W = 0, sel = {};
  for (i = 0; i < selectedItems.length; i++) {
    if (sel[selectedItems[i]]) continue;
    sel[selectedItems[i]] = true;
    if (corr[selectedItems[i]]) H++; else W++;
  }
  var N = correctItems.length;
  if (N === 0) return 0;
  return Math.max(0, (H - W) / N);
}

/* ---------- timer: single state machine ----------
   States: IDLE -> RUNNING -> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED        */
var T = { state: 'IDLE', remain: CFG.seconds, exRemain: null, _iv: null };

/* Segment accounting: measure wall time spent in each pause state. */
var _seg = { st: null, t0: 0 };
function _segEnter(st) {
  _segClose();
  _seg.st = st; _seg.t0 = Date.now();
}
function _segClose() {
  if (_seg.st) {
    var d = Math.round((Date.now() - _seg.t0) / 1000);
    if (_seg.st === 'PAUSED_MANUAL') S.pauseManualSec += d;
    if (_seg.st === 'PAUSED_AUTO_CHECK') S.pauseAutoSec += d;
  }
  _seg.st = null; _seg.t0 = 0;
}
function setState(st) {
  T.state = st;
  if (st === 'PAUSED_MANUAL' || st === 'PAUSED_AUTO_CHECK') _segEnter(st); else _segClose();
  renderTimer();
}
function startTicker() {
  if (T._iv) clearInterval(T._iv);
  T._iv = setInterval(tick, 1000);
}
function tick() {
  if (T.state !== 'RUNNING') return;
  T.remain--;
  if (T.exRemain !== null) {
    T.exRemain--;
    if (T.exRemain <= 0) { autoSkipTimed(); return; }
  }
  if (T.remain <= 0) {
    T.remain = 0;
    setState('ENDED');
    endExam(true);
    return;
  }
  renderTimer();
}
function renderTimer() {
  var el = $('hTimer'); if (!el) return;
  var txt = fmtMMSS(T.remain);
  if (T.state === 'RUNNING') { el.className = 'pill tmr run'; el.innerHTML = '&#9654; RUNNING &#183; ' + txt; }
  else if (T.state === 'PAUSED_MANUAL') { el.className = 'pill tmr pm'; el.innerHTML = '&#9208; PAUSED &#8212; manual (press Resume)'; }
  else if (T.state === 'PAUSED_AUTO_CHECK') { el.className = 'pill tmr pa'; el.innerHTML = '&#9208; PAUSED &#8212; reviewing feedback (resumes on Next)'; }
  else if (T.state === 'ENDED') { el.className = 'pill tmr en'; el.innerHTML = '&#9632; ENDED'; }
  else { el.className = 'pill tmr'; el.innerHTML = '&#9654; ' + txt; }
}

    $('btnPause').innerHTML = '&#9208; Pause';

function onHintBtn() {

  var r = S.res[ex.id];

function autoSkipTimed() {

  var ex = curEx(); if (!ex) return;
  var r = S.res[ex.id];

/* ---------- flow ---------- */
function curEx() {
  if (!S.order.length || S.idx >= S.order.length) return null;
  return DATA[S.order[S.idx]];
}
/* Shuffle option/chip arrangements for a fresh attempt (answers are remapped too). */
function shuffleAttempt() {
  DATA.forEach(function (ex) {
    delete ex._rorder; delete ex._oorder; delete ex._forder; delete ex._dorder;
    if (ex.opts) {
      var old = ex.opts.slice();
      var ord = shuffle(old.map(function (_, i) { return i; }));
      ex.opts = ord.map(function (i) { return old[i]; });
      if (typeof ex.correct === 'number') ex.correct = ord.indexOf(ex.correct);
      else if (Array.isArray(ex.correct)) ex.correct = ex.correct.map(function (k) { return ord.indexOf(k); });
    }
    if (ex.type === 'dnd' && ex.chips) {
      ex.chips = shuffle(ex.chips);
    } else if (ex.type === 'fill' && ex.bank) {
      ex.bank = shuffle(ex.bank);
    }
    if (ex.type === 'branch') {
      ex.steps.forEach(function (s) {
        var oldO = s.opts.slice();
        var ordO = shuffle(oldO.map(function (_, i) { return i; }));
        s.opts = ordO.map(function (i) { return oldO[i]; });
        s.correct = ordO.indexOf(s.correct);
      });
    }
    if (ex.type === 'triage') {
      ex.cards.forEach(function (c) {
        var oldO = c.opts.slice();
        var ordO = shuffle(oldO.map(function (_, i) { return i; }));
        c.opts = ordO.map(function (i) { return oldO[i]; });
        c.correct = ordO.indexOf(c.correct);
      });
    }
  });
}
function startExam() {
  S = freshState();
  if (PENDING_USER) { S.username = PENDING_USER; }
  S.order = shuffle(DATA.map(function (d, i) { return i; }));
  shuffleAttempt();
  T.remain = CFG.seconds; T.exRemain = null; T.state = 'IDLE';
  $('hdr').hidden = false;
  S.phase = 'exam';
  S.idx = 0;
  setState('RUNNING');
  renderCounter(); renderScore(); renderTimer();
  $('btnHint').disabled = false; $('btnSkip').disabled = false;
  renderExercise();
}
function advance() {
  S.idx++;

    if (S.skipped.length > 0) { showReview(); } else { showResults(); }
    return;

function onNextBtn() {
  if (T.state === 'PAUSED_AUTO_CHECK') { setState('RUNNING'); }
  if (S.returnTo === 'review') {
    S.returnTo = null;

  }
  if (S.idx >= S.order.length - 1) {
    if (S.skipped.length > 0) { showReview(); } else { showResults(); }
    return;

}
/* A Check always: 1) sets PAUSED_AUTO_CHECK first, 2) grades, 3) renders feedback below. */
function submitCheck(ex, selected, correct, items, canonHtml, explHtml, studyHtml) {
  if (T.state === 'RUNNING') setState('PAUSED_AUTO_CHECK');
  var creditRaw = scoreExercise(selected, correct);
  var credit = creditRaw;
  if (S.hintUsed[ex.id]) credit = Math.max(0, credit - 0.10);
  credit = Math.round(credit * 100) / 100;
  var r = S.res[ex.id] || {};
  r.answered = true; r.credit = credit; r.creditRaw = creditRaw; r.hintUsed = !!S.hintUsed[ex.id];
  r.N = correct.length; r.H = Math.round(creditRaw * correct.length);
  r.items = items; r.selected = selected;
  if (!r.countedOnce) { r.countedOnce = true; S.creditSum += credit; S.answeredCount++; }
  S.res[ex.id] = r;
  /* remove from skipped pool (answered after review-return) */
  var si = S.skipped.indexOf(ex.id);
  if (si !== -1) S.skipped.splice(si, 1);

  renderFeedback(ex, r, canonHtml, explHtml, studyHtml);

function renderFeedback(ex, r, canonHtml, explHtml, studyHtml) {

/* ---------- website integration contract ---------- */
var PENDING_USER = '';   /* handshake may arrive before the exam starts (S is null then) */
function reportScore(creditSum, answeredCount) {
  if (S.reported) return;              /* exactly once per attempt */
  S.reported = true;
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),
      total: answeredCount,
      percent: percent,
      passed: percent >= CFG.passMark
    }, location.origin);
  } catch (e) { /* opened directly: nothing to report to */ }
}
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  try {
    if (event.data.username) {
      PENDING_USER = String(event.data.username).slice(0, 60);
      if (S) { S.username = PENDING_USER; }
      var el = $('helloLine');
      if (el) el.textContent = 'Hello, ' + PENDING_USER + '. Ready when you are.';
    }
  } catch (e) { /* ignore malformed payloads */ }
});



/* ============================================================

DATA.byId = {}; DATA.idx = {};
(function buildIndex() {
  for (var i = 0; i < DATA.length; i++) {

})();

/* ---------- shared scenario builder ---------- */
function fmtLog(lines) {
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var ln = esc(lines[i]);
    ln = ln.replace(/^(\d{4}-\d{2}-\d{2}[T ][\d:.]+Z?)/, '<span class="ts">$1</span>');
    ln = ln.replace(/(\[[^\]]{2,60}\])/, '<span class="pth">$1</span>');
    out.push(ln);
  }
  return out.join('\n');
}
function panelHtml(p, idx, collapsible) {

  else inner = '<p style="margin:0">' + esc(p.t) + '</p>';

/* ---------- render dispatcher ---------- */
function renderExercise() {
  var ex = curEx();
  if (!ex) { showResults(); return; }
  renderCounter();
  var r = S.res[ex.id];
  var answered = r && r.answered;
  /* branch exercises need their in-progress state (step/chosen) even before the final Check */
  var rv = answered ? r : (ex.type === 'branch' && r ? r : null);
  T.exRemain = (ex.timeLimit && !answered) ? ex.timeLimit : null;
  /* rebuild the stage node so delegated listeners from previous exercises die with it */
  var old = $('stage');
  var neo = old.cloneNode(false);
  neo.id = 'stage';
  old.parentNode.replaceChild(neo, old);
  var st = neo;
  var fn = RENDER[ex.type];
  st.innerHTML = fn(ex, rv);
  if (RENDERWIRE[ex.type]) RENDERWIRE[ex.type](ex, rv);
  $('btnHint').disabled = !!answered || !!S.hintUsed[ex.id];
  $('btnSkip').disabled = !!answered;
  window.scrollTo(0, 0);

var RENDER = {}; var RENDERWIRE = {};

/* ---------- generic check wiring for option widgets ---------- */
function wireOpts(ex, onCheck) {
  var c = $('btnCheck-' + ex.id); if (!c) return;
  c.addEventListener('click', onCheck);
}
function lockOptions(ex) {
  var st = $('stage');
  var btns = st.querySelectorAll('.opt');
  for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  var chk = $('btnCheck-' + ex.id); if (chk) chk.disabled = true;
}

/* ---------- QCM (single answer) ---------- */
RENDER.qcm = function (ex, r) {
  var sel = {}; if (r && r.selected && r.selected.length) sel[r.selected[0]] = true;
  return exFrame(ex, optionRows(ex.opts, sel, 'Single choice', 'radio'), '');
};
RENDERWIRE.qcm = function (ex, r) {
  var chosen = (r && r.selected && r.selected.length) ? r.selected[0] : null;
  var st = $('stage');
  var btns = st.querySelectorAll('.opt');
  for (var i = 0; i < btns.length; i++) {
    (function (b, i) {
      b.addEventListener('click', function () {
        if (S.res[ex.id] && S.res[ex.id].answered) return;
        chosen = i;
        for (var j = 0; j < btns.length; j++) { btns[j].classList.remove('sel'); btns[j].setAttribute('aria-checked', 'false'); }
        b.classList.add('sel'); b.setAttribute('aria-checked', 'true');
      });
    })(btns[i], i);
  }
  if (r && r.answered) {
    markQcm(ex, r); lockOptions(ex); return;
  }
  wireOpts(ex, function () {
    if (chosen === null) return;
    var items = [{ k: ex.correct === chosen ? 'ok' : 'wrg', w: (ex.correct === chosen ? 'Correct' : 'Wrong'), d: LETTER(chosen) + '. ' + ex.opts[chosen] }];
    if (ex.correct !== chosen) items.push({ k: 'mis', w: 'Missed', d: LETTER(ex.correct) + '. ' + ex.opts[ex.correct] });
    markQcm(ex, { selected: [chosen] });
    lockOptions(ex);
    submitCheck(ex, [chosen], [ex.correct], items,
      '<p style="margin:0 0 6px"><b>' + LETTER(ex.correct) + '.</b> ' + esc(ex.opts[ex.correct]) + '</p>',
      ex.expl, ex.study);
  });
  if (chosen !== null) { btns[chosen].classList.add('sel'); btns[chosen].setAttribute('aria-checked', 'true'); }
};
function markQcm(ex, r) {
  var st = $('stage');
  var btns = st.querySelectorAll('.opt');
  for (var i = 0; i < btns.length; i++) {
    var v = parseInt(btns[i].getAttribute('data-opt'), 10);
    if (v === ex.correct) btns[i].classList.add('good');
    else if (r.selected && r.selected[0] === v) btns[i].classList.add('badd');
    else btns[i].classList.add('dim');
  }
}

/* ---------- MULTI (partial credit) ---------- */
RENDER.multi = function (ex, r) {

  return exFrame(ex, optionRows(ex.opts, sel, 'Multi select: choose ' + ex.pick + (ex.pick > 1 ? ' answers' : ' answer')), '<p style="margin:0 0 10px;font-size:.9rem;color:#9db0cd">Select all that apply. Wrong selections subtract from right ones.</p>');
};
RENDERWIRE.multi = function (ex, r) {
  var chosen = {}; var n = 0;
  if (r && r.selected) for (var i = 0; i < r.selected.length; i++) { chosen[r.selected[i]] = true; n++; }
  var st = $('stage');
  var btns = st.querySelectorAll('.opt');
  for (var i = 0; i < btns.length; i++) {
    (function (b, i) {
      b.setAttribute('role', 'checkbox');
      b.addEventListener('click', function () {
        if (S.res[ex.id] && S.res[ex.id].answered) return;
        if (chosen[i]) { delete chosen[i]; n--; b.classList.remove('sel'); b.setAttribute('aria-checked', 'false'); }
        else { chosen[i] = true; n++; b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); }
      });
    })(btns[i], i);
  }
  if (r && r.answered) { markMulti(ex, r); lockOptions(ex); return; }
  wireOpts(ex, function () {
    var sel = [], corr = [];
    for (var k in chosen) if (chosen[k]) sel.push(parseInt(k, 10));
    for (var c = 0; c < ex.correct.length; c++) corr.push(ex.correct[c]);
    var items = [];
    for (var c2 = 0; c2 < ex.correct.length; c2++) {
      var got = chosen[ex.correct[c2]];
      items.push({ k: got ? 'ok' : 'mis', w: got ? 'Correct' : 'Missed', d: LETTER(ex.correct[c2]) + '. ' + ex.opts[ex.correct[c2]] });
    }
    for (var s2 = 0; s2 < sel.length; s2++) {
      if (ex.correct.indexOf(sel[s2]) === -1) items.push({ k: 'wrg', w: 'Wrong', d: LETTER(sel[s2]) + '. ' + ex.opts[sel[s2]] });
    }
    markMulti(ex, { selected: sel });
    lockOptions(ex);
    submitCheck(ex, sel, corr, items,
      '<p style="margin:0 0 6px"><b>All correct options:</b></p><ul style="margin:0 0 4px 18px">' + (function () { var o = ''; for (var i = 0; i < ex.correct.length; i++) o += '<li>' + LETTER(ex.correct[i]) + '. ' + esc(ex.opts[ex.correct[i]]) + '</li>'; return o; })() + '</ul>',
      ex.expl, ex.study);
  });
  if (n) { for (var k2 in chosen) if (chosen[k2]) { btns[k2].classList.add('sel'); btns[k2].setAttribute('aria-checked', 'true'); } }
};
function markMulti(ex, r) {
  var st = $('stage');
  var btns = st.querySelectorAll('.opt');
  var sel = r.selected || [];
  for (var i = 0; i < btns.length; i++) {
    var v = parseInt(btns[i].getAttribute('data-opt'), 10);
    var wasSel = sel.indexOf(v) !== -1, isCorr = ex.correct.indexOf(v) !== -1;
    if (isCorr) btns[i].classList.add('good');
    else if (wasSel) btns[i].classList.add('badd');
    else btns[i].classList.add('dim');
  }
}



/* ---------- MATCH (partial credit) ---------- */
RENDER.match = function (ex, r) {
  var leftH = '';
  ex.left.forEach(function (L, i) {
    var asg = (r && r.pairs && r.pairs[i] !== undefined && r.pairs[i] !== null) ? esc(ex.right[r.pairs[i]]) : '';
    leftH += '<button type="button" class="mrow" data-l="' + i + '"><span><b>' + esc(L) + '</b></span><span class="asg">' + asg + '</span></button>';
  });
  var rightH = '<div class="chipbank" id="mbank-' + ex.id + '">';
  var order = ex._rorder || (ex._rorder = shuffle(ex.right.map(function (_, i) { return i; })));
  order.forEach(function (ri) {
    rightH += '<button type="button" class="chip" data-r="' + ri + '">' + esc(ex.right[ri]) + '</button>';
  });
  rightH += '</div>';
  return exFrame(ex, '<div class="matchgrid"><div class="mlist" id="mlist-' + ex.id + '">' + leftH + '</div><div>' + rightH + '</div></div>', '<p style="margin:0 0 10px;font-size:.9rem;color:#9db0cd">Select one item on the left, then select its match on the right. Every correct pair scores. Wrong pairs subtract.</p>');
};
RENDERWIRE.match = function (ex, r) {
  var pairs = {}; /* leftIndex -> rightIndex */
  var selL = null;
  if (r && r.pairs) pairs = r.pairs;
  var st = $('stage');
  var rows = st.querySelectorAll('.mrow');
  var chips = st.querySelectorAll('#mbank-' + ex.id + ' .chip');
  function refresh() {
    for (var i = 0; i < rows.length; i++) {
      var li = parseInt(rows[i].getAttribute('data-l'), 10);
      rows[i].querySelector('.asg').textContent = (pairs[li] !== undefined && pairs[li] !== null) ? ex.right[pairs[li]] : '';
    }
    for (var j = 0; j < chips.length; j++) {
      var ri = parseInt(chips[j].getAttribute('data-r'), 10);
      var used = false;
      for (var k in pairs) if (pairs[k] === ri) used = true;
      chips[j].classList.toggle('ghosted', used);
    }
  }
  refresh();
  for (var i = 0; i < rows.length; i++) {
    (function (row) {
      row.addEventListener('click', function () {
        if (S.res[ex.id] && S.res[ex.id].answered) return;
        for (var j = 0; j < rows.length; j++) rows[j].classList.remove('selm');
        selL = parseInt(row.getAttribute('data-l'), 10);
        row.classList.add('selm');
      });
    })(rows[i]);
  }
  for (var c = 0; c < chips.length; c++) {
    (function (chip) {
      chip.addEventListener('click', function () {
        if (S.res[ex.id] && S.res[ex.id].answered || selL === null) return;
        var ri = parseInt(chip.getAttribute('data-r'), 10);
        for (var k in pairs) if (pairs[k] === ri) delete pairs[k];
        pairs[selL] = ri;
        for (var j = 0; j < rows.length; j++) rows[j].classList.remove('selm');
        selL = null;
        refresh();
      });
    })(chips[c]);
  }
  if (r && r.answered) { lockOptions(ex); return; }
  wireOpts(ex, function () {
    var sel = [], corr = [], items = [];
    for (var li = 0; li < ex.left.length; li++) {
      var my = (pairs[li] !== undefined) ? pairs[li] : null;
      var want = ex.pairs[li];
      corr.push('L' + li + 'R' + want);
      if (my !== null) sel.push('L' + li + 'R' + my);
      if (my === want) items.push({ k: 'ok', w: 'Correct', d: esc(ex.left[li]) + ' \u2192 ' + esc(ex.right[want]) });
      else if (my === null) items.push({ k: 'mis', w: 'Missed', d: esc(ex.left[li]) + ' \u2192 ' + esc(ex.right[want]) });
      else items.push({ k: 'wrg', w: 'Wrong', d: esc(ex.left[li]) + ' matched to ' + esc(ex.right[my]) + ' (correct: ' + esc(ex.right[want]) + ')' });
    }
    var canon = '<ul style="margin:0 0 4px 18px">';
    for (var li2 = 0; li2 < ex.left.length; li2++) canon += '<li><b>' + esc(ex.left[li2]) + '</b> \u2192 ' + esc(ex.right[ex.pairs[li2]]) + '</li>';
    canon += '</ul>';
    lockOptions(ex);
    submitCheck(ex, sel, corr, items, canon, ex.expl, ex.study);
  });
};

/* ---------- ORDER / ranking (partial credit) ---------- */
RENDER.order = function (ex, r) {
  var slots = '';
  for (var i = 0; i < ex.items.length; i++) {
    var cur = (r && r.placed && r.placed[i] !== undefined) ? r.placed[i] : null;
    slots += '<div class="slot" data-slot="' + i + '"><span class="num">' + (i + 1) + '.</span>' +
      (cur === null ? '<span class="ph">tap a chip to place it here</span>' : '<span class="chip" data-in="' + i + '">' + esc(ex.chips[cur]) + '</span>') + '</div>';
  }
  var bank = '<div class="chipbank" id="obank-' + ex.id + '">';
  var order = ex._oorder || (ex._oorder = shuffle(ex.chips.map(function (_, i) { return i; })));
  var placed = (r && r.placed) || [];
  order.forEach(function (ci) {
    if (placed.indexOf(ci) === -1) bank += '<button type="button" class="chip" data-c="' + ci + '">' + esc(ex.chips[ci]) + '</button>';
  });
  bank += '</div>';
  return exFrame(ex, '<div class="slots" id="oslots-' + ex.id + '">' + slots + '</div>' + bank,
    '<p style="margin:0 0 10px;font-size:.9rem;color:#9db0cd">' + esc(ex.orderHint || 'Put the items in the right order. Tap a chip, then tap a slot. Tap a placed chip to send it back.') + '</p>');
};
RENDERWIRE.order = function (ex, r) {
  var placed = (r && r.placed) ? r.placed.slice() : new Array(ex.items.length).fill(null);
  var selC = null;
  var st = $('stage');
  function refresh() {
    var slots = st.querySelectorAll('#oslots-' + ex.id + ' .slot');
    for (var i = 0; i < slots.length; i++) {
      var si = parseInt(slots[i].getAttribute('data-slot'), 10);
      var cur = placed[si];
      slots[i].innerHTML = '<span class="num">' + (si + 1) + '.</span>' + (cur === null || cur === undefined ? '<span class="ph">tap a chip to place it here</span>' : '<button type="button" class="chip" data-in="' + si + '">' + esc(ex.chips[cur]) + '</button>');
    }
    var bank = $('obank-' + ex.id);
    var chips = bank.querySelectorAll('.chip');
    for (var j = 0; j < chips.length; j++) {
      var ci = parseInt(chips[j].getAttribute('data-c'), 10);
      chips[j].style.display = (placed.indexOf(ci) !== -1) ? 'none' : '';
      chips[j].classList.toggle('selc', selC === ci);
    }
  }
  refresh();
  st.addEventListener('click', function (ev) {
    if (S.res[ex.id] && S.res[ex.id].answered) return;
    var t = ev.target;
    var chipEl = t.closest ? t.closest('.chip[data-c]') : null;
    if (chipEl) {
      selC = parseInt(chipEl.getAttribute('data-c'), 10); refresh(); return;
    }
    var inEl = t.closest ? t.closest('.chip[data-in]') : null;
    if (inEl) {
      var si2 = parseInt(inEl.getAttribute('data-in'), 10);
      placed[si2] = null; refresh(); return;
    }
    var slotEl = t.closest ? t.closest('.slot') : null;
    if (slotEl && selC !== null) {
      var si3 = parseInt(slotEl.getAttribute('data-slot'), 10);
      var existing = placed.indexOf(selC);
      if (existing !== -1) placed[existing] = null;
      placed[si3] = selC; selC = null; refresh();
    }
  });
  if (r && r.answered) { lockOptions(ex); return; }
  wireOpts(ex, function () {
    var sel = [], corr = [], items = [];
    for (var i = 0; i < ex.items.length; i++) {
      corr.push('S' + i + 'C' + ex.items[i]);
      var my = placed[i];
      if (my === ex.items[i]) { sel.push('S' + i + 'C' + ex.items[i]); items.push({ k: 'ok', w: 'Correct', d: 'Position ' + (i + 1) + ': ' + esc(ex.chips[ex.items[i]]) }); }
      else if (my === null || my === undefined) items.push({ k: 'mis', w: 'Missed', d: 'Position ' + (i + 1) + ' should be: ' + esc(ex.chips[ex.items[i]]) });
      else { items.push({ k: 'wrg', w: 'Wrong', d: 'Position ' + (i + 1) + ': you placed ' + esc(ex.chips[my]) + ' (correct: ' + esc(ex.chips[ex.items[i]]) + ')' }); sel.push('S' + i + 'C' + my); }
    }
    var canon = '<ol style="margin:0 0 4px 18px">';
    for (var j = 0; j < ex.items.length; j++) canon += '<li>' + esc(ex.chips[ex.items[j]]) + '</li>';
    canon += '</ol>';
    lockOptions(ex);
    submitCheck(ex, sel, corr, items, canon, ex.expl, ex.study);
  });
};

/* ---------- FILL (word bank, partial credit) ---------- */
RENDER.fill = function (ex, r) {
  var order = ex._forder || (ex._forder = shuffle(ex.bank.slice()));
  var bank = '<div class="chipbank" id="fbank-' + ex.id + '">';
  order.forEach(function (w) { bank += '<button type="button" class="chip" data-w="' + esc(w) + '">' + esc(w) + '</button>'; });
  bank += '</div>';
  var parts = ex.text.split(/\{\{(\d+)\}\}/);
  var body = '';
  for (var i = 0; i < parts.length; i++) {
    if (i % 2 === 0) body += esc(parts[i]);
    else body += '<button type="button" class="blank" data-b="' + parts[i] + '">' + ((r && r.filled && r.filled[parts[i]] !== undefined) ? esc(r.filled[parts[i]]) : '_____') + '</button>';
  }
  return exFrame(ex, '<p class="blankline" id="ftext-' + ex.id + '">' + body + '</p>' + bank,
    '<p style="margin:0 0 10px;font-size:.9rem;color:#9db0cd">Pick a word from the bank, then tap a gap to fill it. Tap a filled gap to empty it. Words can be reused more than once.</p>');
};
RENDERWIRE.fill = function (ex, r) {
  var filled = (r && r.filled) ? JSON.parse(JSON.stringify(r.filled)) : {};
  var selW = null;
  var st = $('stage');
  function refresh() {
    var bl = st.querySelectorAll('.blank');
    for (var i = 0; i < bl.length; i++) {
      var bi = bl[i].getAttribute('data-b');
      bl[i].textContent = filled[bi] !== undefined ? filled[bi] : '_____';
      bl[i].classList.toggle('filled', filled[bi] !== undefined);
    }
    var chips = st.querySelectorAll('#fbank-' + ex.id + ' .chip');
    for (var j = 0; j < chips.length; j++) chips[j].classList.toggle('selc', chips[j].getAttribute('data-w') === selW);
  }
  refresh();
  st.addEventListener('click', function (ev) {
    if (S.res[ex.id] && S.res[ex.id].answered) return;
    var t = ev.target;
    var chipEl = t.closest ? t.closest('.chip[data-w]') : null;
    if (chipEl) { selW = chipEl.getAttribute('data-w'); refresh(); return; }
    var blEl = t.closest ? t.closest('.blank') : null;
    if (blEl) {
      var bi = blEl.getAttribute('data-b');
      if (filled[bi] !== undefined) { delete filled[bi]; selW = null; }
      else if (selW !== null) { filled[bi] = selW; selW = null; }
      refresh();
    }
  });
  if (r && r.answered) { lockOptions(ex); return; }
  wireOpts(ex, function () {
    var sel = [], corr = [], items = [];
    for (var i = 0; i < ex.correct.length; i++) {
      corr.push('B' + i + ':' + ex.correct[i]);
      var my = filled[String(i)];
      if (my === ex.correct[i]) { sel.push('B' + i + ':' + ex.correct[i]); items.push({ k: 'ok', w: 'Correct', d: 'Gap ' + (i + 1) + ': ' + esc(ex.correct[i]) }); }
      else if (my === undefined) items.push({ k: 'mis', w: 'Missed', d: 'Gap ' + (i + 1) + ' should be: ' + esc(ex.correct[i]) });
      else { sel.push('B' + i + ':' + my); items.push({ k: 'wrg', w: 'Wrong', d: 'Gap ' + (i + 1) + ': you used ' + esc(my) + ' (correct: ' + esc(ex.correct[i]) + ')' }); }
    }
    var canon = '<p style="margin:0">' + esc(ex.text.replace(/\{\{(\d+)\}\}/g, function (_, n) { return '[' + ex.correct[parseInt(n, 10)] + ']'; })) + '</p>';
    lockOptions(ex);
    submitCheck(ex, sel, corr, items, canon, ex.expl, ex.study);
  });
};

/* ---------- DRAG & DROP into buckets (partial credit) ---------- */
RENDER.dnd = function (ex, r) {
  var assign = (r && r.assign) ? r.assign : {}; /* chipIdx -> bucketIdx */
  var buckets = '<div class="buckets" id="dbuckets-' + ex.id + '">';
  ex.buckets.forEach(function (B, bi) {
    buckets += '<div class="bucket" data-bk="' + bi + '"><div class="bucket-h">' + esc(B.name) + '</div><div class="bucket-b">';
    for (var ci in assign) if (assign[ci] === bi) buckets += '<button type="button" class="chip" data-c="' + ci + '" data-in="1">' + esc(ex.chips[ci].t) + '</button>';
    buckets += '</div></div>';
  });
  buckets += '</div>';
  var bank = '<div class="chipbank" id="dbank-' + ex.id + '" style="margin-top:10px">';
  var dorder = ex._dorder || (ex._dorder = ex.chips.map(function (_, i) { return i; }));
  dorder.forEach(function (ci) {
    if (assign[ci] === undefined) bank += '<button type="button" class="chip" draggable="true" data-c="' + ci + '">' + esc(ex.chips[ci].t) + '</button>';
  });
  bank += '</div>';
  return exFrame(ex, bank + buckets,
    '<p style="margin:0 0 10px;font-size:.9rem;color:#9db0cd">Drag each card into the right bucket, or tap a card and then tap a bucket. Tap a placed card to send it back.</p>');
};
RENDERWIRE.dnd = function (ex, r) {
  var assign = (r && r.assign) ? JSON.parse(JSON.stringify(r.assign)) : {};
  var selC = null;
  var st = $('stage');
  function refresh() {
    var bank = $('dbank-' + ex.id);
    var chips = bank.querySelectorAll('.chip');
    for (var j = 0; j < chips.length; j++) {
      var ci = chips[j].getAttribute('data-c');
      chips[j].style.display = (assign[ci] !== undefined) ? 'none' : '';
      chips[j].classList.toggle('selc', String(selC) === ci);
    }
    var bks = st.querySelectorAll('.bucket');
    for (var b = 0; b < bks.length; b++) {
      var bi = bks[b].getAttribute('data-bk');
      var body = bks[b].querySelector('.bucket-b');
      var inner = '';
      for (var c in assign) if (String(assign[c]) === String(bi)) inner += '<button type="button" class="chip" data-c="' + c + '" data-in="1">' + esc(ex.chips[c].t) + '</button>';
      body.innerHTML = inner;
    }
  }
  refresh();
  st.addEventListener('click', function (ev) {
    if (S.res[ex.id] && S.res[ex.id].answered) return;
    var t = ev.target;
    var chipEl = t.closest ? t.closest('.chip[data-c]') : null;
    if (chipEl && !chipEl.getAttribute('data-in')) { selC = parseInt(chipEl.getAttribute('data-c'), 10); refresh(); return; }
    if (chipEl && chipEl.getAttribute('data-in')) { delete assign[chipEl.getAttribute('data-c')]; refresh(); return; }
    var bkEl = t.closest ? t.closest('.bucket') : null;
    if (bkEl && selC !== null) {
      assign[selC] = parseInt(bkEl.getAttribute('data-bk'), 10); selC = null; refresh();
    }
  });
  /* HTML5 drag and drop for mouse users */
  st.addEventListener('dragstart', function (ev) {
    var chipEl = ev.target.closest ? ev.target.closest('.chip[data-c]') : null;
    if (chipEl) { selC = parseInt(chipEl.getAttribute('data-c'), 10); try { ev.dataTransfer.setData('text/plain', String(selC)); } catch (e) { } refresh(); }
  });
  st.addEventListener('dragover', function (ev) {
    var bkEl = ev.target.closest ? ev.target.closest('.bucket') : null;
    if (bkEl) { ev.preventDefault(); bkEl.classList.add('hov'); }
  });
  st.addEventListener('dragleave', function (ev) {
    var bkEl = ev.target.closest ? ev.target.closest('.bucket') : null;
    if (bkEl) bkEl.classList.remove('hov');
  });
  st.addEventListener('drop', function (ev) {
    var bkEl = ev.target.closest ? ev.target.closest('.bucket') : null;
    if (bkEl && selC !== null) {
      ev.preventDefault(); assign[selC] = parseInt(bkEl.getAttribute('data-bk'), 10); selC = null; refresh();
    }
  });
  if (r && r.answered) { lockOptions(ex); return; }
  wireOpts(ex, function () {
    var sel = [], corr = [], items = [];
    ex.chips.forEach(function (C, ci) {
      var want = ex.chips[ci].b;
      corr.push('C' + ci + 'B' + want);
      var my = assign[ci];
      if (my === want) { sel.push('C' + ci + 'B' + want); items.push({ k: 'ok', w: 'Correct', d: esc(C.t) + ' \u2192 ' + esc(ex.buckets[want].name) }); }
      else if (my === undefined) items.push({ k: 'mis', w: 'Missed', d: esc(C.t) + ' belongs in: ' + esc(ex.buckets[want].name) });
      else { sel.push('C' + ci + 'B' + my); items.push({ k: 'wrg', w: 'Wrong', d: esc(C.t) + ' \u2192 ' + esc(ex.buckets[my].name) + ' (belongs in: ' + esc(ex.buckets[want].name) + ')' }); }
    });
    var canon = '<ul style="margin:0 0 4px 18px">';
    ex.buckets.forEach(function (B, bi) {
      var names = [];
      ex.chips.forEach(function (C, ci) { if (C.b === bi) names.push(esc(C.t)); });
      canon += '<li><b>' + esc(B.name) + ':</b> ' + names.join(', ') + '</li>';
    });
    canon += '</ul>';
    lockOptions(ex);
    submitCheck(ex, sel, corr, items, canon, ex.expl, ex.study);
  });
};



/* ---------- LOG VIEWER (filter + embedded qcm/multi) ---------- */
function logviewLogOf(ex) {
  if (ex.log) return ex.log;
  if (ex._log) return ex._log;
  ex._log = []; ex._logAt = -1;
  for (var i = 0; i < ex.sc.length; i++) {
    if (ex.sc[i].k === 'log') { ex._log = ex.sc[i].lines; ex._logAt = i; break; }
  }
  return ex._log;
}
RENDER.logview = function (ex, r) {
  var logLines = logviewLogOf(ex);
  var h = '';
  if (S.notice) { h += '<div class="exnote">&#9888; ' + esc(S.notice) + '</div>'; S.notice = ''; }
  if (ex.timeLimit && !r) h += '<div class="exnote">&#9203; Reduced time budget: ' + (ex.timeLimit / 60) + ' minutes for this exercise.</div>';
  if (S.returnTo === 'review') h += '<div class="exnote">&#8617; You are answering a skipped exercise. After Check, Next brings you back to the review screen.</div>';
  h += '<div class="block b-sc"><div class="block-h">&#128203; SCENARIO</div><div class="block-b">';
  for (var i = 0; i < ex.sc.length; i++) {
    if (i === ex._logAt) {
      /* the log panel becomes the interactive filterable viewer */
      h += '<div class="logview"><div class="logbar"><b style="font-size:.82rem;color:#c9d6ee">' + esc(ex.sc[i].title || 'Log excerpt') + '</b>' +
        '<label for="lfilter-' + ex.id + '" style="margin-left:auto">Filter:</label>' +
        '<input id="lfilter-' + ex.id + '" type="text" placeholder="Type to filter log lines..." aria-label="Filter log lines">' +
        '</div><div class="loglines" id="llog-' + ex.id + '"></div><div class="logcount" id="lcount-' + ex.id + '"></div></div>';
    } else {
      h += panelHtml(ex.sc[i], i, false);
    }
  }
  h += '</div></div>';
  h += '<div class="block b-q"><div class="block-h">&#10067; QUESTION</div><div class="block-b"><p class="qtext">' + esc(ex.q) + '</p></div></div>';
  var sel = {};
  if (r && r.selected) for (var s = 0; s < r.selected.length; s++) sel[r.selected[s]] = true;
  h += '<div class="block b-an"><div class="block-h">&#9997; YOUR ANSWER</div><div class="block-b">';
  if (ex.sub === 'multi') h += '<p style="margin:0 0 10px;font-size:.9rem;color:#9db0cd">Select all that apply. Wrong selections subtract from right ones.</p>';
  h += optionRows(ex.opts, sel, 'Answer options', ex.sub === 'multi' ? 'checkbox' : 'radio');
  h += '<div id="hintbox-' + ex.id + '" class="hintbox" hidden><b>Hint:</b> ' + esc(ex.hint) + '</div>';
  h += '<div class="center"><button class="btn pri" id="btnCheck-' + ex.id + '" type="button">Check</button></div>';

  medium: 'This is the MEDIUM tier. Each exercise connects two ideas, for example: name the technique, then choose the control that fits it. You must decide what to look at first. Some exercises have several correct parts and give partial credit.',
  hard: 'This is the HARD tier. Exercises chain two to three ideas. Distractors are near-miss answers that look almost right. Expect artefact sets (logs, tickets, configs) that you must read together, and traps where the loud finding is benign and the quiet one is not.',
  'extremely-hard': 'This is the EXTREMELY HARD tier. Exercises chain three or more ideas with conflicting and incomplete signals, expert-level decisions under pressure, real costs to accept, and at least one case where the popular "best practice" is the wrong answer here.'
};
var TYPE_LIST = 'Scenario triage, log analysis with a filter box, drag-and-drop placement, matching, ordering, fill-in-the-blank, decision-tree branching, a terminal simulation where you type commands, and multiple choice.';

function renderIntro() {
  var st = $('stage');
  var h = '';
  h += '<div class="hero"><h1>' + esc(CFG.mitreId + ' ' + CFG.name) + ' \u2014 ' + esc(sevLabel()) + ' practice exam</h1>' +
    '<p class="sub" id="helloLine">A practice certification exam on the MITRE ATT&amp;CK tactic ' + esc(CFG.mitreId) + ' ' + esc(CFG.name) + '.</p>' +
    '<div class="meta-chips"><span class="mchip">' + CFG.qc + ' exercises</span><span class="mchip">' + (CFG.seconds / 60) + ' minutes</span><span class="mchip">Pass mark ' + CFG.passMark + '%</span><span class="mchip">Tier: ' + esc(sevLabel()) + '</span></div></div>';
  h += '<div class="intro-sec"><div class="h2sec">About this ATT&amp;CK object (TA0009 &#8212; Collection)</div>' +
    '<p><b>What it is.</b> TA0009 is a <b>Tactic</b>. In MITRE ATT&amp;CK, a tactic is a goal of the attacker, not a single action. The goal of Collection is simple to say: the adversary is trying to gather data of interest to their goal. Imagine an attacker is already inside a company network. They do not want alerts, so they quietly take copies of the data they need: files, emails, screenshots, clipboard text, cloud documents, or database entries. That gathering step is the Collection tactic.</p>' +
    '<p><b>Where it sits.</b> In a typical attack, the attacker first gets in (Initial Access, TA0001), then looks around (Discovery, TA0007), then collects data of interest (Collection, TA0009), and finally sends the data outside (Exfiltration, TA0010). Collection often runs together with Credential Access (TA0006), because capturing what users type is one way to collect secrets. Data staging (T1074) is the bridge between Collection and Exfiltration: the attacker groups the gathered data in one place before sending it out.</p>' +
    '<p><b>Who uses it at work.</b> You will use this tactic in many roles. A SOC analyst triages alerts and maps them to TA0009 techniques. A threat hunter writes hypotheses like "someone is reading hundreds of files from a share". An incident responder checks what data was touched before it left. A cyber threat intelligence analyst maps a group&#8217;s behaviour to Collection techniques when writing a report. A detection engineer builds analytics on the data sources Collection produces. A red teamer uses it to plan realistic tests. A GRC or control owner picks mitigations such as data loss prevention, encryption, or network segmentation to reduce the risk.</p>' +
    '<p><b>Tools and documents you will meet.</b> SIEM and EDR consoles, mail gateway and message tracking logs, cloud audit logs, DLP consoles, data source and telemetry catalogs, hunt hypotheses, detection rules, incident reports, and ATT&amp;CK Navigator layers. The risks this tactic addresses: quiet data theft, privacy loss, losing intellectual property, and regulators asking hard questions after a breach.</p></div>';
  h += '<div class="intro-sec"><div class="h2sec">Keywords covered in this exam</div><p style="font-size:.9rem;color:#9db0cd;margin:0 0 10px">Every related concept of TA0009 appears in at least one exercise across the four tiers. This panel lists them by theme.</p><div class="kwgrid">';
  for (var i = 0; i < KEYWORDS.length; i++) {
    h += '<div class="kwcard"><h4>' + esc(KEYWORDS[i][0]) + '</h4><p>' + esc(KEYWORDS[i][1]) + '</p></div>';
  }
  h += '</div></div>';
  h += '<div class="intro-sec"><div class="h2sec">How this exam works</div>' +
    '<ul>' +
    '<li><b>Goal.</b> Answer ' + CFG.qc + ' exercises. Reach at least <b>' + CFG.passMark + '%</b> to pass and earn the certificate panel.</li>' +
    '<li><b>Exercise types.</b> ' + TYPE_LIST + '</li>' +
    '<li><b>Severity.</b> ' + esc(SEV_INFO[META.difficulty] || SEV_INFO.easy) + '</li>' +
    '<li><b>Timer.</b> You have <b>' + (CFG.seconds / 60) + ' minutes</b> for the whole exam. The timer state is always visible: &#9654; RUNNING, &#9208; PAUSED &#8212; manual, &#9208; PAUSED &#8212; reviewing feedback, &#9632; ENDED.</li>' +
    '<li><b>Check buys you time.</b> When you press Check, the timer stops by itself so you can read the feedback for as long as you want. The timer starts again only when you press Next (or Final Submit on the last exercise). You cannot change your answer after Check.</li>' +
    '<li><b>Manual pause.</b> The Pause button is a normal break. The exercise is hidden while paused. Press Resume to continue. You can also use Pause on top of the feedback pause.</li>' +
    '<li><b>Partial credit.</b> Exercises with several correct parts score per item: right picks add, wrong picks subtract. The formula is (right &#8722; wrong) divided by the number of items, and it can never go below zero. So selecting everything is worth zero. Single-answer exercises score all-or-nothing.</li>' +
    '<li><b>Hints.</b> One hint per exercise. A hint costs 10% of that exercise&#8217;s credit. It gives a nudge, never the answer.</li>' +
    '<li><b>Skipping.</b> Every exercise has a Skip button. Skipping is free, but the exercise goes to a waiting pool. Before you finish, a review screen lists your skipped exercises and lets you answer them, as long as the timer has not ended. If you submit with exercises still unanswered, they are simply excluded from the score.</li>' +
    '<li><b>Retake.</b> If you fail, you can retake the exam. Questions and answer choices are shuffled again.</li>' +
    '</ul></div>';
  h += '<div class="center" style="margin-top:6px"><button class="btn pri" id="btnStart" type="button" style="font-size:1.1rem;padding:14px 34px">Start the exam</button></div>';
  st.innerHTML = h;
  $('btnStart').addEventListener('click', startExam);
}

/* collapsible artefact panels (event delegation, survives re-render) */
document.addEventListener('click', function (ev) {
  var ph = ev.target.closest ? ev.target.closest('.panel-h[role="button"]') : null;
  if (ph) {
    var p = ph.parentElement;
    p.classList.toggle('closed');
    ph.setAttribute('aria-expanded', p.classList.contains('closed') ? 'false' : 'true');
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var ph = ev.target.closest ? ev.target.closest('.panel-h[role="button"]') : null;
  if (ph) { ev.preventDefault(); ph.click(); }
});

/* manual pause veil */
function showVeil(kind) {
  removeVeil();
  var v = document.createElement('div');
  v.className = 'veil'; v.id = 'pauseVeil';
  v.innerHTML = '<div class="veilbox"><h3>&#9208; Paused</h3><p>The exercise is hidden during a manual pause. The timer is stopped. Press Resume in the header (or the button below) to continue.</p><button class="btn pri" id="veilResume" type="button">&#9654; Resume</button></div>';
  document.body.appendChild(v);
  $('veilResume').addEventListener('click', function () { if (T.state === 'PAUSED_MANUAL') onPauseBtn(); });
}
function hideVeil() { removeVeil(); }
function removeVeil() { var v = $('pauseVeil'); if (v) v.remove(); }

/* ---------- boot ---------- */
wireHeader();
renderIntro();

</script>
</body>
</html>
