/* E1 — goal of the tactic */
{ id:'E1', type:'qcm', tag:'Multiple choice', rvTitle:'The goal of Collection',
  sc:[{k:'p', t:'You are a new SOC analyst. Your mentor shows you the MITRE ATT&CK Enterprise matrix and points at the column named Collection, tactic ID TA0009.'}],
  q:'What is the main goal of the Collection tactic (TA0009)?',
  opts:['To spread malware to more machines inside the network','To gather data of interest to the attacker\u2019s goal','To erase security logs to cover the attacker\u2019s tracks','To disable the local firewall and other defences'],
  correct:1,
  hint:'This is about the tactic where the adversary quietly gathers the data it wants.',
  expl:'The ATT&CK page for TA0009 says it directly: the adversary is trying to gather data of interest to their goal. The attacker is already inside and quietly takes copies of files, emails, or other data. Spreading malware is movement inside the network, erasing logs is hiding, and disabling a firewall is changing defences. None of those is the goal of gathering data.',
  study:'Read the short description of tactic TA0009 on the ATT&CK site and try to say the goal in one sentence.' },

/* E2 — object type */
{ id:'E2', type:'qcm', tag:'Multiple choice', rvTitle:'TA0009 is a tactic',
  sc:[{k:'p', t:'A colleague asks you what kind of object TA0009 is in MITRE ATT&CK. They have seen IDs like T1114, M1057, and G0007 and is confused.'}],
  q:'What kind of ATT&CK object is TA0009?',
  opts:['A technique that runs one command or script','A mitigation that blocks an attack path','A tactic: a goal the adversary works towards','A group of threat actors sharing tooling'],
  correct:2,
  hint:'ATT&CK has groups, mitigations, techniques, and goal-level objects. The TA prefix marks the goal-level ones.',
  expl:'The TA prefix stands for tactic. A tactic is a goal, not one action. Techniques (T IDs) are the actions that serve the goal. Mitigations (M IDs) are the controls that reduce the risk. Groups (G IDs) are the actors. So TA0009 Collection is the goal of gathering data of interest.',
  study:'Look at the ATT&CK matrix once and say out loud which objects are goals (TA) and which are actions (T).' },

/* E3 — lifecycle order */
{ id:'E3', type:'order', tag:'Ordering', rvTitle:'Where Collection sits in an attack',
  sc:[{k:'p', t:'Your team lead draws a simple attack story on a whiteboard: the attacker gets in, looks around, takes copies of interesting data, sends the data out, and finally causes damage.'}],

  items:[0,1,2,3,4],

  hint:'Collection sits between looking around and sending the data out.',
  expl:'The usual story is: Initial Access (get in), Discovery (look around), Collection (take copies of data), Exfiltration (send the data out), Impact (cause damage). Collection is the gathering step, so it comes after the attacker knows what exists and before the data leaves. Real attacks can repeat steps, but this is the standard order the ATT&CK matrix teaches.',

/* ============================================================
   Exam engine — TA0009 Collection (Cyber Pulse Academy contract)
   ============================================================ */
var META = {};
try { META = JSON.parse(document.getElementById('cm-exercise-meta').textContent); } catch (e) { META = { topicId: 'ta0009', batch: 1, passMark: 70, questionCount: 15 }; }
var CFG = {
  mitreId: 'TA0009', name: 'Collection',
  passMark: (META.passMark || 70),
  seconds: (META.estimatedMinutes || 25) * 60,
  qc: META.questionCount || 15
};
var DATA = window.__EXERCISES__ || [];

/* ---------- state ---------- */
var S = null;
function freshState() {
  return {
    phase: 'intro',            /* intro | exam | review | results */
    order: [],
    idx: 0,
    res: {},                   /* exId -> {credit, creditRaw, hintUsed, answered, items} */
    creditSum: 0,
    answeredCount: 0,
    skipped: [],               /* exIds skipped and never answered */
    returnTo: null,            /* 'review' when answering a returned skipped exercise */
    hintUsed: {},
    reported: false,
    pauseManualSec: 0,
    pauseAutoSec: 0,
    autoPauseOpen: false,      /* true while PAUSED_AUTO_CHECK */
    manualOnTop: false,
    exStartRemain: CFG.seconds,
    notice: '',
    username: ''
  };
}

/* ---------- utils ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtMMSS(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}
function pct(sum, n) { return n > 0 ? Math.round((sum / n) * 100) : 0; }
function LETTER(i) { return String.fromCharCode(65 + i); }
function sevLabel() { var c = document.body.className.replace('se-', ''); return c === 'xhard' ? 'EXTREMELY HARD' : c.toUpperCase(); }

/* Mandatory partial-credit scoring formula (enforced for every multi-answer exercise). */
function scoreExercise(selectedItems, correctItems) {
  var corr = {}, i;
  for (i = 0; i < correctItems.length; i++) corr[correctItems[i]] = true;
  var H = 0, W = 0, sel = {};
  for (i = 0; i < selectedItems.length; i++) {
    if (sel[selectedItems[i]]) continue;
    sel[selectedItems[i]] = true;
    if (corr[selectedItems[i]]) H++; else W++;
  }
  var N = correctItems.length;
  if (N === 0) return 0;
  return Math.max(0, (H - W) / N);
}

/* ---------- timer: single state machine ----------
   States: IDLE -> RUNNING -> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED        */
var T = { state: 'IDLE', remain: CFG.seconds, exRemain: null, _iv: null };

/* Segment accounting: measure wall time spent in each pause state. */
var _seg = { st: null, t0: 0 };
function _segEnter(st) {
  _segClose();
  _seg.st = st; _seg.t0 = Date.now();
}
function _segClose() {
  if (_seg.st) {
    var d = Math.round((Date.now() - _seg.t0) / 1000);
    if (_seg.st === 'PAUSED_MANUAL') S.pauseManualSec += d;
    if (_seg.st === 'PAUSED_AUTO_CHECK') S.pauseAutoSec += d;
  }
  _seg.st = null; _seg.t0 = 0;
}
function setState(st) {
  T.state = st;
  if (st === 'PAUSED_MANUAL' || st === 'PAUSED_AUTO_CHECK') _segEnter(st); else _segClose();
  renderTimer();
}
function startTicker() {
  if (T._iv) clearInterval(T._iv);
  T._iv = setInterval(tick, 1000);
}
function tick() {
  if (T.state !== 'RUNNING') return;
  T.remain--;
  if (T.exRemain !== null) {
    T.exRemain--;
    if (T.exRemain <= 0) { autoSkipTimed(); return; }
  }
  if (T.remain <= 0) {
    T.remain = 0;
    setState('ENDED');
    endExam(true);
    return;
  }
  renderTimer();
}
function renderTimer() {
  var el = $('hTimer'); if (!el) return;
  var txt = fmtMMSS(T.remain);
  if (T.state === 'RUNNING') { el.className = 'pill tmr run'; el.innerHTML = '&#9654; RUNNING &#183; ' + txt; }
  else if (T.state === 'PAUSED_MANUAL') { el.className = 'pill tmr pm'; el.innerHTML = '&#9208; PAUSED &#8212; manual (press Resume)'; }
  else if (T.state === 'PAUSED_AUTO_CHECK') { el.className = 'pill tmr pa'; el.innerHTML = '&#9208; PAUSED &#8212; reviewing feedback (resumes on Next)'; }
  else if (T.state === 'ENDED') { el.className = 'pill tmr en'; el.innerHTML = '&#9632; ENDED'; }
  else { el.className = 'pill tmr'; el.innerHTML = '&#9654; ' + txt; }
}
function renderScore() {
  var el = $('hScore'); if (!el) return;
  var sum = (Math.round(S.creditSum * 10) / 10).toFixed(1);
  el.textContent = sum + ' / ' + S.answeredCount + ' \u00B7 ' + pct(S.creditSum, S.answeredCount) + '%';
}
function renderCounter() {
  var el = $('hCounter'); if (!el) return;
  el.textContent = 'Exercise ' + (S.idx + 1) + ' of ' + S.order.length;
}

/* ---------- header buttons ---------- */
function wireHeader() {
  $('btnPause').addEventListener('click', onPauseBtn);
  $('btnHint').addEventListener('click', onHintBtn);
  $('btnSkip').addEventListener('click', onSkipBtn);
}
function onPauseBtn() {
  if (S.phase !== 'exam') return;
  if (T.state === 'RUNNING') {
    setState('PAUSED_MANUAL');
    showVeil('manual');
    $('btnPause').innerHTML = '&#9654; Resume';
  } else if (T.state === 'PAUSED_MANUAL') {
    /* resume: back to the state we came from (auto-check or running) */
    setState(S.manualOnTop ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
    S.manualOnTop = false;
    hideVeil();
    $('btnPause').innerHTML = '&#9208; Pause';
  } else if (T.state === 'PAUSED_AUTO_CHECK') {
    /* manual pause on top of auto-pause: hide exercise, timer already stopped */
    S.manualOnTop = true;
    setState('PAUSED_MANUAL');
    showVeil('manual');
    $('btnPause').innerHTML = '&#9654; Resume';
  }
}
function onHintBtn() {
  if (S.phase !== 'exam' || T.state === 'PAUSED_MANUAL') return;
  var ex = curEx(); if (!ex) return;
  var r = S.res[ex.id];
  if (r && r.answered) return;                 /* no hints after Check */
  if (S.hintUsed[ex.id]) return;               /* one hint per exercise */
  S.hintUsed[ex.id] = true;
  var box = $('hintbox-' + ex.id);
  if (box) { box.hidden = false; }
  $('btnHint').disabled = true;
  if (box) box.scrollIntoView({ block: 'nearest' });
}
function onSkipBtn() {
  if (S.phase !== 'exam') return;
  var ex = curEx(); if (!ex) return;
  var r = S.res[ex.id];
  if (r && r.answered) return;                 /* cannot skip after answering */
  if (T.state === 'PAUSED_AUTO_CHECK') return; /* no skip during review pause */
  if (S.skipped.indexOf(ex.id) === -1) S.skipped.push(ex.id);
  advance();
}
function autoSkipTimed() {
  /* per-exercise time budget (used by the EXTREMELY HARD terminal only) */
  var ex = curEx(); if (!ex) return;
  var r = S.res[ex.id];
  if (r && r.answered) return;
  if (S.skipped.indexOf(ex.id) === -1) S.skipped.push(ex.id);
  S.notice = 'The ' + ex.timeLimit / 60 + '-minute budget for this exercise ended. It moved to the skipped pool. You can return to it from the review screen while time is left.';
  advance();
}

/* ---------- flow ---------- */
function curEx() {
  if (!S.order.length || S.idx >= S.order.length) return null;
  return DATA[S.order[S.idx]];
}
/* Shuffle option/chip arrangements for a fresh attempt (answers are remapped too). */
function shuffleAttempt() {
  DATA.forEach(function (ex) {
    delete ex._rorder; delete ex._oorder; delete ex._forder; delete ex._dorder;
    if (ex.opts) {
      var old = ex.opts.slice();
      var ord = shuffle(old.map(function (_, i) { return i; }));
      ex.opts = ord.map(function (i) { return old[i]; });
      if (typeof ex.correct === 'number') ex.correct = ord.indexOf(ex.correct);
      else if (Array.isArray(ex.correct)) ex.correct = ex.correct.map(function (k) { return ord.indexOf(k); });
    }
    if (ex.type === 'dnd' && ex.chips) {
      ex.chips = shuffle(ex.chips);
    } else if (ex.type === 'fill' && ex.bank) {
      ex.bank = shuffle(ex.bank);
    }
    if (ex.type === 'branch') {
      ex.steps.forEach(function (s) {
        var oldO = s.opts.slice();
        var ordO = shuffle(oldO.map(function (_, i) { return i; }));
        s.opts = ordO.map(function (i) { return oldO[i]; });
        s.correct = ordO.indexOf(s.correct);
      });
    }
    if (ex.type === 'triage') {
      ex.cards.forEach(function (c) {
        var oldO = c.opts.slice();
        var ordO = shuffle(oldO.map(function (_, i) { return i; }));
        c.opts = ordO.map(function (i) { return oldO[i]; });
        c.correct = ordO.indexOf(c.correct);
      });
    }
  });
}
function startExam() {
  S = freshState();
  if (PENDING_USER) { S.username = PENDING_USER; }
  S.order = shuffle(DATA.map(function (d, i) { return i; }));
  shuffleAttempt();
  T.remain = CFG.seconds; T.exRemain = null; T.state = 'IDLE';
  $('hdr').hidden = false;
  S.phase = 'exam';
  S.idx = 0;
  setState('RUNNING');
  renderCounter(); renderScore(); renderTimer();
  $('btnHint').disabled = false; $('btnSkip').disabled = false;
  renderExercise();
}
function advance() {
  S.idx++;
  if (S.idx >= S.order.length) {
    if (S.skipped.length > 0) { showReview(); } else { showResults(); }
    return;
  }
  renderExercise();
}
function onNextBtn() {
  if (T.state === 'PAUSED_AUTO_CHECK') { setState('RUNNING'); }
  if (S.returnTo === 'review') {
    S.returnTo = null;
    showReview();
    return;
  }
  if (S.idx >= S.order.length - 1) {
    if (S.skipped.length > 0) { showReview(); } else { showResults(); }
    return;
  }
  advance();
}
/* A Check always: 1) sets PAUSED_AUTO_CHECK first, 2) grades, 3) renders feedback below. */
function submitCheck(ex, selected, correct, items, canonHtml, explHtml, studyHtml) {
  if (T.state === 'RUNNING') setState('PAUSED_AUTO_CHECK');
  var creditRaw = scoreExercise(selected, correct);
  var credit = creditRaw;
  if (S.hintUsed[ex.id]) credit = Math.max(0, credit - 0.10);
  credit = Math.round(credit * 100) / 100;
  var r = S.res[ex.id] || {};
  r.answered = true; r.credit = credit; r.creditRaw = creditRaw; r.hintUsed = !!S.hintUsed[ex.id];
  r.N = correct.length; r.H = Math.round(creditRaw * correct.length);
  r.items = items; r.selected = selected;
  if (!r.countedOnce) { r.countedOnce = true; S.creditSum += credit; S.answeredCount++; }
  S.res[ex.id] = r;
  /* remove from skipped pool (answered after review-return) */
  var si = S.skipped.indexOf(ex.id);

var PENDING_USER = '';   /* handshake may arrive before the exam starts (S is null then) */
function reportScore(creditSum, answeredCount) {
  if (S.reported) return;              /* exactly once per attempt */
  S.reported = true;
  var percent = answeredCount > 0 ? Math.round((creditSum / answeredCount) * 100) : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: META.topicId,
      batch: META.batch,
      score: Math.round(creditSum),

}
window.addEventListener('message', function (event) {

  try {

      if (S) { S.username = PENDING_USER; }

});

RENDERWIRE.qcm = function (ex, r) {
  var chosen = (r && r.selected && r.selected.length) ? r.selected[0] : null;
  var st = $('stage');

  for (var i = 0; i < btns.length; i++) {

    if (ex.correct !== chosen) items.push({ k: 'mis', w: 'Missed', d: LETTER(ex.correct) + '. ' + ex.opts[ex.correct] });
    markQcm(ex, { selected: [chosen] });

    }
    for (var j = 0; j < chips.length; j++) {

        selL = parseInt(row.getAttribute('data-l'), 10);

/* ---------- LOG VIEWER (filter + embedded qcm/multi) ---------- */
function logviewLogOf(ex) {
  if (ex.log) return ex.log;
  if (ex._log) return ex._log;
  ex._log = []; ex._logAt = -1;
  for (var i = 0; i < ex.sc.length; i++) {
    if (ex.sc[i].k === 'log') { ex._log = ex.sc[i].lines; ex._logAt = i; break; }
  }
  return ex._log;
}

  if (S.returnTo === 'review') h += '<div class="exnote">&#8617; You are answering a skipped exercise. After Check, Next brings you back to the review screen.</div>';
  h += '<div class="block b-sc"><div class="block-h">&#128203; SCENARIO</div><div class="block-b">';

    } else {

RENDERWIRE.terminal = function (ex, r) {

  echo(ex.banner || 'Simulation shell. Type the command for this exercise and press Enter. Nothing here runs for real.', 'cok');

    var n = norm(cmd);

    var sel = [], corr = [], items = [];
    for (var i = 0; i < ex.elements.length; i++) {
      var el = ex.elements[i];
      corr.push(el.label);
      var re = new RegExp(el.re, 'i');
      var hit = re.test(ex.strict ? n : nl);

      else items.push({ k: 'mis', w: 'Missed', d: el.label });

      var ng = ex.neg[j];

    }

RENDERWIRE.branch = function (ex, r) {

      });

  var go = $('btnStep-' + ex.id);

  var ph = ev.target.closest ? ev.target.closest('.panel-h[role="button"]') : null;
  if (ph) {
    var p = ph.parentElement;
    p.classList.toggle('closed');
    ph.setAttribute('aria-expanded', p.classList.contains('closed') ? 'false' : 'true');
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var ph = ev.target.closest ? ev.target.closest('.panel-h[role="button"]') : null;
  if (ph) { ev.preventDefault(); ph.click(); }
});

/* manual pause veil */
function showVeil(kind) {
  removeVeil();
  var v = document.createElement('div');
  v.className = 'veil'; v.id = 'pauseVeil';
  v.innerHTML = '<div class="veilbox"><h3>&#9208; Paused</h3><p>The exercise is hidden during a manual pause. The timer is stopped. Press Resume in the header (or the button below) to continue.</p><button class="btn pri" id="veilResume" type="button">&#9654; Resume</button></div>';
  document.body.appendChild(v);
  $('veilResume').addEventListener('click', function () { if (T.state === 'PAUSED_MANUAL') onPauseBtn(); });
}
function hideVeil() { removeVeil(); }
function removeVeil() { var v = $('pauseVeil'); if (v) v.remove(); }

/* ---------- boot ---------- */
wireHeader();
renderIntro();

</script>
