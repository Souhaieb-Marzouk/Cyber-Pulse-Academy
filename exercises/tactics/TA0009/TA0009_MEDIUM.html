window.__EXERCISES__ = [

/* M1 — placement across three tactics (mandatory placement exercise) */
{ id:'M1', type:'dnd', tag:'Drag & drop', rvTitle:'Collection, Discovery or Exfiltration',
  sc:[{k:'p', t:'You are building a hunting dashboard. Each card on your desk is a technique your team saw in the last quarter. You must sort them into the three tactics your dashboard covers.'}],
  q:'Place every technique card into the correct tactic bucket.',
  buckets:[{name:'Collection (TA0009)'},{name:'Discovery (TA0007)'},{name:'Exfiltration (TA0010)'}],
  chips:[
    {t:'T1039 Data from Network Shared Drive', b:0},
    {t:'T1074 Data Staged', b:0},
    {t:'T1213.002 Sharepoint', b:0},
    {t:'T1135 Network Share Discovery', b:1},
    {t:'T1087 Account Discovery', b:1},
    {t:'T1567.002 Exfiltration to Cloud Storage', b:2}
  ],
  hint:'Copying data is Collection. Listing what exists is Discovery. Moving data out is Exfiltration.',
  expl:'T1039, T1074, and T1213.002 all take copies of data of interest, so they are Collection. T1135 and T1087 only list what exists (shares, accounts), so they are Discovery. T1567.002 moves data out through a cloud service, so it is Exfiltration. Attacker view: the same three buckets are the attacker\u2019s to-do list \u2014 look, take, move. Defender view: each bucket needs different telemetry, so misplacing a technique in your dashboard means hunting in the wrong logs.',
  study:'Read the one-line description of each technique on the ATT&CK site and mark the verb: list, copy, or move.' },

/* M2 — technique to data source matching */
{ id:'M2', type:'match', tag:'Matching', rvTitle:'Techniques and their data sources',
  sc:[{k:'p', t:'Your detection engineer leaves you a note: "Before we write any analytic, we must know which log speaks about which technique." She lists four Collection techniques.'}],
  q:'Match each technique to the data source that best detects it.',
  left:['T1113 Screen Capture','T1114.003 Email Forwarding Rule','T1039 Data from Network Shared Drive','T1074.001 Local Data Staging'],
  right:['File creation monitoring on unusual local paths','Mail server logs that record new mailbox rules','API monitoring for capture functions','Windows share access events such as 5145'],
  pairs:[2,1,3,0],
  hint:'Ask one question per technique: which log would record that exact action?',
  expl:'Each action writes to a different log. Screen capture calls capture APIs, so API monitoring fits T1113. A forwarding rule is a mailbox change, so mail server rule logs fit T1114.003. Reading files from a share writes Windows event 5145, so share access events fit T1039. Staging creates files in odd local paths, so file creation monitoring fits T1074.001. Picking the wrong source is the number one reason collection analytics stay silent.',
  study:'Open one technique page and read its Data Sources table.' },

/* M3 — forwarding rule signals */
{ id:'M3', type:'multi', tag:'Multi-select', rvTitle:'Signals of an email forwarding rule',
  sc:[{k:'p', t:'Your mail gateway dashboard shows a quiet but strange morning on the mail server. No malware was detected, no link was clicked, but three mailbox changes were logged in ten minutes.'},
      {k:'log', title:'Mail server admin log', lines:['2026-02-04 08:12:31Z  user a.silva  NEW INBOX RULE  forward all incoming mail to m.repair90@[.]protonmail[.]tld','2026-02-04 08:12:44Z  login a.silva  country=BR device=unknown  (first time this country)','2026-02-04 08:13:02Z  user a.silva  rule applied to ALL incoming mail  (auto-apply)']}],
  q:'Select the three signals that point to T1114.003 Email Forwarding Rule.',
  opts:['A new inbox rule forwards all incoming mail to an external address','The rule was created minutes after a first-time login from an unusual country','The rule applies automatically to all incoming mail','A local PST email file was read on the laptop','A new local administrator account was created on a workstation'],
  correct:[0,1,2], pick:3,
  hint:'Three signals describe the rule itself. Two describe completely different techniques.',
  expl:'All three first signals describe one behaviour: a forwarding rule that sends every incoming mail outside, created right after a suspicious login, and applied automatically. That is exactly T1114.003. Reading a local PST file would be T1114.001 Local Email Collection, and a new local admin is an account change, not a mail rule. Forwarding rules are a favourite collection trick because every future email is copied out quietly.',

/* ============================================================
   Exam engine — TA0009 Collection (Cyber Pulse Academy contract)
   ============================================================ */
var META = {};
try { META = JSON.parse(document.getElementById('cm-exercise-meta').textContent); } catch (e) { META = { topicId: 'ta0009', batch: 1, passMark: 70, questionCount: 15 }; }
var CFG = {
  mitreId: 'TA0009', name: 'Collection',
  passMark: (META.passMark || 70),
  seconds: (META.estimatedMinutes || 25) * 60,
  qc: META.questionCount || 15
};
var DATA = window.__EXERCISES__ || [];

/* ---------- state ---------- */
var S = null;
function freshState() {
  return {
    phase: 'intro',            /* intro | exam | review | results */
    order: [],
    idx: 0,
    res: {},                   /* exId -> {credit, creditRaw, hintUsed, answered, items} */
    creditSum: 0,
    answeredCount: 0,
    skipped: [],               /* exIds skipped and never answered */
    returnTo: null,            /* 'review' when answering a returned skipped exercise */
    hintUsed: {},
    reported: false,
    pauseManualSec: 0,
    pauseAutoSec: 0,
    autoPauseOpen: false,      /* true while PAUSED_AUTO_CHECK */
    manualOnTop: false,
    exStartRemain: CFG.seconds,
    notice: '',
    username: ''
  };
}

/* ---------- utils ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmtMMSS(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
}
function pct(sum, n) { return n > 0 ? Math.round((sum / n) * 100) : 0; }
function LETTER(i) { return String.fromCharCode(65 + i); }
function sevLabel() { var c = document.body.className.replace('se-', ''); return c === 'xhard' ? 'EXTREMELY HARD' : c.toUpperCase(); }

/* Mandatory partial-credit scoring formula (enforced for every multi-answer exercise). */
function scoreExercise(selectedItems, correctItems) {
  var corr = {}, i;
  for (i = 0; i < correctItems.length; i++) corr[correctItems[i]] = true;
  var H = 0, W = 0, sel = {};
  for (i = 0; i < selectedItems.length; i++) {
    if (sel[selectedItems[i]]) continue;
    sel[selectedItems[i]] = true;
    if (corr[selectedItems[i]]) H++; else W++;
  }
  var N = correctItems.length;
  if (N === 0) return 0;
  return Math.max(0, (H - W) / N);
}

/* ---------- timer: single state machine ----------
   States: IDLE -> RUNNING -> PAUSED_MANUAL / PAUSED_AUTO_CHECK -> ENDED        */
var T = { state: 'IDLE', remain: CFG.seconds, exRemain: null, _iv: null };

/* Segment accounting: measure wall time spent in each pause state. */
var _seg = { st: null, t0: 0 };
function _segEnter(st) {
  _segClose();
  _seg.st = st; _seg.t0 = Date.now();
}
function _segClose() {
  if (_seg.st) {
    var d = Math.round((Date.now() - _seg.t0) / 1000);
    if (_seg.st === 'PAUSED_MANUAL') S.pauseManualSec += d;
    if (_seg.st === 'PAUSED_AUTO_CHECK') S.pauseAutoSec += d;
  }
  _seg.st = null; _seg.t0 = 0;
}
function setState(st) {
  T.state = st;
  if (st === 'PAUSED_MANUAL' || st === 'PAUSED_AUTO_CHECK') _segEnter(st); else _segClose();
  renderTimer();
}
function startTicker() {
  if (T._iv) clearInterval(T._iv);
  T._iv = setInterval(tick, 1000);
}
function tick() {
  if (T.state !== 'RUNNING') return;
  T.remain--;
  if (T.exRemain !== null) {
    T.exRemain--;
    if (T.exRemain <= 0) { autoSkipTimed(); return; }
  }
  if (T.remain <= 0) {
    T.remain = 0;
    setState('ENDED');
    endExam(true);
    return;
  }
  renderTimer();
}
function renderTimer() {
  var el = $('hTimer'); if (!el) return;
  var txt = fmtMMSS(T.remain);
  if (T.state === 'RUNNING') { el.className = 'pill tmr run'; el.innerHTML = '&#9654; RUNNING &#183; ' + txt; }
  else if (T.state === 'PAUSED_MANUAL') { el.className = 'pill tmr pm'; el.innerHTML = '&#9208; PAUSED &#8212; manual (press Resume)'; }
  else if (T.state === 'PAUSED_AUTO_CHECK') { el.className = 'pill tmr pa'; el.innerHTML = '&#9208; PAUSED &#8212; reviewing feedback (resumes on Next)'; }
  else if (T.state === 'ENDED') { el.className = 'pill tmr en'; el.innerHTML = '&#9632; ENDED'; }
  else { el.className = 'pill tmr'; el.innerHTML = '&#9654; ' + txt; }
}
function renderScore() {
  var el = $('hScore'); if (!el) return;
  var sum = (Math.round(S.creditSum * 10) / 10).toFixed(1);
  el.textContent = sum + ' / ' + S.answeredCount + ' \u00B7 ' + pct(S.creditSum, S.answeredCount) + '%';
}
function renderCounter() {
  var el = $('hCounter'); if (!el) return;
  el.textContent = 'Exercise ' + (S.idx + 1) + ' of ' + S.order.length;
}

/* ---------- header buttons ---------- */
function wireHeader() {
  $('btnPause').addEventListener('click', onPauseBtn);
  $('btnHint').addEventListener('click', onHintBtn);
  $('btnSkip').addEventListener('click', onSkipBtn);
}
function onPauseBtn() {
  if (S.phase !== 'exam') return;
  if (T.state === 'RUNNING') {
    setState('PAUSED_MANUAL');
    showVeil('manual');
    $('btnPause').innerHTML = '&#9654; Resume';
  } else if (T.state === 'PAUSED_MANUAL') {
    /* resume: back to the state we came from (auto-check or running) */
    setState(S.manualOnTop ? 'PAUSED_AUTO_CHECK' : 'RUNNING');
    S.manualOnTop = false;
    hideVeil();
    $('btnPause').innerHTML = '&#9208; Pause';
  } else if (T.state === 'PAUSED_AUTO_CHECK') {
    /* manual pause on top of auto-pause: hide exercise, timer already stopped */
    S.manualOnTop = true;
    setState('PAUSED_MANUAL');
    showVeil('manual');
    $('btnPause').innerHTML = '&#9654; Resume';
  }
}
function onHintBtn() {
  if (S.phase !== 'exam' || T.state === 'PAUSED_MANUAL') return;
  var ex = curEx(); if (!ex) return;
  var r = S.res[ex.id];
  if (r && r.answered) return;                 /* no hints after Check */
  if (S.hintUsed[ex.id]) return;               /* one hint per exercise */
  S.hintUsed[ex.id] = true;
  var box = $('hintbox-' + ex.id);
  if (box) { box.hidden = false; }
  $('btnHint').disabled = true;
  if (box) box.scrollIntoView({ block: 'nearest' });
}
function onSkipBtn() {
  if (S.phase !== 'exam') return;
  var ex = curEx(); if (!ex) return;
  var r = S.res[ex.id];
  if (r && r.answered) return;                 /* cannot skip after answering */
  if (T.state === 'PAUSED_AUTO_CHECK') return; /* no skip during review pause */
  if (S.skipped.indexOf(ex.id) === -1) S.skipped.push(ex.id);
  advance();
}
function autoSkipTimed() {
  /* per-exercise time budget (used by the EXTREMELY HARD terminal only) */
  var ex = curEx(); if (!ex) return;
  var r = S.res[ex.id];
  if (r && r.answered) return;
  if (S.skipped.indexOf(ex.id) === -1) S.skipped.push(ex.id);
  S.notice = 'The ' + ex.timeLimit / 60 + '-minute budget for this exercise ended. It moved to the skipped pool. You can return to it from the review screen while time is left.';
  advance();
}

/* ---------- flow ---------- */
function curEx() {
  if (!S.order.length || S.idx >= S.order.length) return null;
  return DATA[S.order[S.idx]];
}
/* Shuffle option/chip arrangements for a fresh attempt (answers are remapped too). */
function shuffleAttempt() {
  DATA.forEach(function (ex) {
    delete ex._rorder; delete ex._oorder; delete ex._forder; delete ex._dorder;
    if (ex.opts) {
      var old = ex.opts.slice();
      var ord = shuffle(old.map(function (_, i) { return i; }));
      ex.opts = ord.map(function (i) { return old[i]; });
      if (typeof ex.correct === 'number') ex.correct = ord.indexOf(ex.correct);
      else if (Array.isArray(ex.correct)) ex.correct = ex.correct.map(function (k) { return ord.indexOf(k); });
    }
    if (ex.type === 'dnd' && ex.chips) {
      ex.chips = shuffle(ex.chips);
    } else if (ex.type === 'fill' && ex.bank) {
      ex.bank = shuffle(ex.bank);
    }
    if (ex.type === 'branch') {
      ex.steps.forEach(function (s) {
        var oldO = s.opts.slice();

RENDERWIRE.match = function (ex, r) {

    '<p><b>Who uses it at work.</b> You will use this tactic in many roles. A SOC analyst triages alerts and maps them to TA0009 techniques. A threat hunter writes hypotheses like "someone is reading hundreds of files from a share". An incident responder checks what data was touched before it left. A cyber threat intelligence analyst maps a group&#8217;s behaviour to Collection techniques when writing a report. A detection engineer builds analytics on the data sources Collection produces. A red teamer uses it to plan realistic tests. A GRC or control owner picks mitigations such as data loss prevention, encryption, or network segmentation to reduce the risk.</p>' +
    '<p><b>Tools and documents you will meet.</b> SIEM and EDR consoles, mail gateway and message tracking logs, cloud audit logs, DLP consoles, data source and telemetry catalogs, hunt hypotheses, detection rules, incident reports, and ATT&amp;CK Navigator layers. The risks this tactic addresses: quiet data theft, privacy loss, losing intellectual property, and regulators asking hard questions after a breach.</p></div>';
  h += '<div class="intro-sec"><div class="h2sec">Keywords covered in this exam</div><p style="font-size:.9rem;color:#9db0cd;margin:0 0 10px">Every related concept of TA0009 appears in at least one exercise across the four tiers. This panel lists them by theme.</p><div class="kwgrid">';
  for (var i = 0; i < KEYWORDS.length; i++) {
    h += '<div class="kwcard"><h4>' + esc(KEYWORDS[i][0]) + '</h4><p>' + esc(KEYWORDS[i][1]) + '</p></div>';
  }
  h += '</div></div>';
  h += '<div class="intro-sec"><div class="h2sec">How this exam works</div>' +
    '<ul>' +
    '<li><b>Goal.</b> Answer ' + CFG.qc + ' exercises. Reach at least <b>' + CFG.passMark + '%</b> to pass and earn the certificate panel.</li>' +
    '<li><b>Exercise types.</b> ' + TYPE_LIST + '</li>' +
    '<li><b>Severity.</b> ' + esc(SEV_INFO[META.difficulty] || SEV_INFO.easy) + '</li>' +
    '<li><b>Timer.</b> You have <b>' + (CFG.seconds / 60) + ' minutes</b> for the whole exam. The timer state is always visible: &#9654; RUNNING, &#9208; PAUSED &#8212; manual, &#9208; PAUSED &#8212; reviewing feedback, &#9632; ENDED.</li>' +
    '<li><b>Check buys you time.</b> When you press Check, the timer stops by itself so you can read the feedback for as long as you want. The timer starts again only when you press Next (or Final Submit on the last exercise). You cannot change your answer after Check.</li>' +
    '<li><b>Manual pause.</b> The Pause button is a normal break. The exercise is hidden while paused. Press Resume to continue. You can also use Pause on top of the feedback pause.</li>' +
    '<li><b>Partial credit.</b> Exercises with several correct parts score per item: right picks add, wrong picks subtract. The formula is (right &#8722; wrong) divided by the number of items, and it can never go below zero. So selecting everything is worth zero. Single-answer exercises score all-or-nothing.</li>' +
    '<li><b>Hints.</b> One hint per exercise. A hint costs 10% of that exercise&#8217;s credit. It gives a nudge, never the answer.</li>' +
    '<li><b>Skipping.</b> Every exercise has a Skip button. Skipping is free, but the exercise goes to a waiting pool. Before you finish, a review screen lists your skipped exercises and lets you answer them, as long as the timer has not ended. If you submit with exercises still unanswered, they are simply excluded from the score.</li>' +
    '<li><b>Retake.</b> If you fail, you can retake the exam. Questions and answer choices are shuffled again.</li>' +
    '</ul></div>';
  h += '<div class="center" style="margin-top:6px"><button class="btn pri" id="btnStart" type="button" style="font-size:1.1rem;padding:14px 34px">Start the exam</button></div>';
  st.innerHTML = h;
  $('btnStart').addEventListener('click', startExam);
}

/* collapsible artefact panels (event delegation, survives re-render) */
document.addEventListener('click', function (ev) {
  var ph = ev.target.closest ? ev.target.closest('.panel-h[role="button"]') : null;
  if (ph) {
    var p = ph.parentElement;
    p.classList.toggle('closed');
    ph.setAttribute('aria-expanded', p.classList.contains('closed') ? 'false' : 'true');
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var ph = ev.target.closest ? ev.target.closest('.panel-h[role="button"]') : null;
  if (ph) { ev.preventDefault(); ph.click(); }
});

/* manual pause veil */
function showVeil(kind) {
  removeVeil();
  var v = document.createElement('div');
  v.className = 'veil'; v.id = 'pauseVeil';
  v.innerHTML = '<div class="veilbox"><h3>&#9208; Paused</h3><p>The exercise is hidden during a manual pause. The timer is stopped. Press Resume in the header (or the button below) to continue.</p><button class="btn pri" id="veilResume" type="button">&#9654; Resume</button></div>';
  document.body.appendChild(v);
  $('veilResume').addEventListener('click', function () { if (T.state === 'PAUSED_MANUAL') onPauseBtn(); });
}
function hideVeil() { removeVeil(); }
function removeVeil() { var v = $('pauseVeil'); if (v) v.remove(); }

/* ---------- boot ---------- */
wireHeader();
renderIntro();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
