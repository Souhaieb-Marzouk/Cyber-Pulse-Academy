<script>
var EXAM = {"title": "TA0007 Discovery \u2014 EASY", "topicId": "ta0007", "batch": 1, "passMark": 70, "timeSec": 1200, "metaMinutes": 20, "sevLabel": "EASY", "sevCls": "easy", "sevBlurb": "<b>Tier 1 \u2014 EASY:</b> one idea per exercise, short scenarios, guided wording. Wrong options are wrong for obvious reasons once you know the concept. Built for a solid first contact with TA0007.", "about": "\n<p><b>What you will learn.</b> This exam trains one part of the MITRE ATT&amp;CK framework. ATT&amp;CK is a big catalogue that describes what real attackers do. This part is a <b>Tactic</b>. Its ID is <b>TA0007</b>. Its name is <b>Discovery</b>. A tactic answers one question: what does the attacker want to achieve at this moment? Discovery means: the attacker wants to learn about your environment.</p>\n<p><b>Imagine you are the attacker for a moment.</b> You already have access to one computer inside a company. What do you want to know before you act? Which other computers exist? Which users and groups exist? Who has power (admin rights)? Which servers run which services? Which shared folders can you open? Which cloud resources can you reach with the keys you have? Discovery is the tactic that answers these questions. It is homework: attackers do it to make every later step cheaper, faster and quieter.</p>\n<p><b>Discovery is not Reconnaissance.</b> Reconnaissance (TA0043) happens <i>before</i> the attacker gets in: they scan your public systems from outside and read public information. Discovery (TA0007) happens <i>after</i> the attacker is inside: they run commands on machines you own. This difference is the number one exam trap \u2014 and the number one ticket mistake.</p>\n<p><b>Where you will use this in real work:</b></p>\n<ul>\n<li><b>SOC analysts</b> see Discovery alerts every day: <code>net user</code>, <code>ipconfig /all</code>, <code>nltest</code>, <code>adfind</code>, <code>nmap</code>. Your job is to decide: real attacker, or normal admin work?</li>\n<li><b>Incident responders</b> use Discovery artefacts to scope intrusions: which hosts, which accounts, how far did they get?</li>\n<li><b>Threat hunters</b> build hypotheses from Discovery behaviour: one host touching 180 hosts on port 445 in five minutes is a hunt, not a hunch.</li>\n<li><b>Detection engineers</b> turn Discovery behaviour into analytics: they pick data sources (process command lines, flow logs, AD audit, cloud audit), write thresholds, and tune out the false positives.</li>\n<li><b>CTI analysts</b> map published group reports (APT29, FIN6, Conti) to Discovery techniques so detections become reusable.</li>\n<li><b>Red teamers</b> run Discovery to show what an attacker could learn \u2014 and how much noise it makes.</li>\n<li><b>GRC and control owners</b> reduce what the environment tells an attacker: least privilege, network segmentation, clean cloud permissions.</li>\n</ul>\n<p><b>The risks it addresses.</b> Discovery steals nothing and breaks nothing \u2014 that is exactly why it is easy to ignore. But it is the step before privilege escalation, lateral movement, ransomware and theft. If you catch Discovery, you stop the attack while it is still cheap to stop.</p>\n", "keywords": [{"theme": "Adversary objective", "items": "Learn the environment from inside: hosts, accounts, groups, shares, services, trusts, cloud assets. Output feeds the next technique choice."}, {"theme": "Lifecycle position", "items": "TA0007 comes after the first foothold. Contrast: Reconnaissance (TA0043) is pre-access and victim-external."}, {"theme": "Host techniques", "items": "T1033 (whoami/quser), T1082 (systeminfo), T1012 (reg query), T1057 (tasklist), T1087 (accounts), T1069 (groups), T1201 (net accounts), T1615 (gpresult), T1652 (driverquery), T1497 (sandbox checks)."}, {"theme": "Network techniques", "items": "T1016 (ipconfig, route print), T1018 (nltest /dclist:, nbtstat, ping sweep), T1046 (port scans), T1049 (netstat, arp -a), T1135 (net view, Get-SmbShare), T1482 (nltest /trusted_domains)."}, {"theme": "Cloud & container", "items": "T1580 (aws ec2 describe-instances, iam list-roles), T1137 (kubectl get pods, auth can-i)."}, {"theme": "Attacker tooling", "items": "net, nltest, dsquery, adfind, PowerView, SharpHound/BloodHound, nmap, Advanced IP Scanner, kubectl, cloud CLI (aws/az)."}, {"theme": "Data sources & telemetry", "items": "Process creation with command line, network flow/firewall logs, AD/LDAP audit (4662), Windows Registry, cloud audit (CloudTrail), container audit logs, logon sessions."}, {"theme": "Detection & analytics", "items": "Scan-rate thresholds, LDAP enumeration spikes, native tools on wrong tiers, parent-process lineage, first-ever per host, false positives (scanners, admins, monitoring) and suppression discipline."}, {"theme": "Mitigations & limits", "items": "Hard to prevent \u2014 detection-first. Segmentation caps scan reach; least privilege caps enumeration value; IAM denies cap cloud visibility."}, {"theme": "Real-world behaviour", "items": "APT29 used ADFIND for AD enumeration; FIN6 used net commands; Conti/Wizard Spider used Advanced IP Scanner and SharpHound before ransomware."}], "instructions": ["This exam has <b>15 exercises</b>. You see one exercise at a time. Types in this file: multiple choice, fill-in-the-blank, drag &amp; drop (technique placement), matching, ordering / ranking, alert-triage tables, a fake terminal (simulation only), and multi-select.", "The <b>pass mark is 70%</b> \u2014 computed over the exercises you actually answer.", "<b>Partial credit:</b> exercises with several correct items are scored per item: <code>credit = max(0, (correct \u2212 wrong) / items)</code>. Wrong picks subtract. Example: 3 correct and 1 wrong out of 5 items \u2192 (3\u22121)/5 = 0.40. Feedback shows each item as \u2713 Correct, \u2717 Wrong or \u25cb Missed.", "<b>Hints:</b> one hint per exercise, costs 10% of that exercise\u2019s credit (clamped at zero). Hints never reveal the answer.", "<b>Skipping:</b> every exercise has a Skip button. Skipped exercises move to a review pool; before finishing you can return and answer them as often as you like while the timer runs. Skipped-and-never-answered exercises are excluded from both the score and the total.", "<b>Timer:</b> a countdown runs while you work (20 minutes). The <b>Pause</b> button is a manual break \u2014 the exercise hides until you press Resume. Pressing <b>Check</b> stops the timer automatically (state \u201c\u23f8 PAUSED \u2014 reviewing feedback\u201d) so you can study the explanation without pressure; the timer restarts only when you press <b>Next</b> \u2014 or <b>Final Submit</b> on the last exercise. The header always shows the timer state.", "<b>Scoring:</b> the live score in the header counts fractional credits (for example 8.4 / 11). At the end you get a full breakdown and a pass/fail verdict.", "<b>Retake:</b> failed exams can be retaken; every attempt reshuffles question order and answer choices."], "exercises": [{"id": "EASY-01", "type": "qcm", "summary": "Mentor question \u2014 what does Discovery try to do?", "scenario": ["You are a new SOC analyst. You are learning the MITRE ATT&CK framework. ATT&CK is a catalogue that describes what real attackers do. Your mentor asks you about the tactic <b>TA0007 \u2014 Discovery</b>."], "question": "What is the main goal of the Discovery tactic (TA0007)?", "opts": ["To learn about the environment from inside, after getting in", "To trick the first user into opening a bad link or file", "To steal data and send it outside the company networks", "To damage systems so badly that they stop working"], "ok": [0], "why": {"0": "Discovery (TA0007) is exactly this: the attacker is inside and collects facts about your environment.", "1": "Tricking a user is Initial Access (TA0001). It is how the attacker gets in, not how they look around.", "2": "Stealing data is Exfiltration (TA0010). That happens much later, after the attacker knows the environment.", "3": "Damaging systems is Impact (TA0040). Discovery does not break anything."}, "hint": "Think about what the attacker wants to KNOW first, not what they want to take or break.", "ansText": "Discovery = the attacker, already inside, learns about computers, users, shares and services to plan the next step.", "expl": ["Discovery (TA0007) is a <b>tactic</b>. A tactic is a goal, not a single action. The goal here is to learn the environment.", "The attacker already has a foothold. They look for computers, users, groups, shares, services and cloud resources. This knowledge helps them choose the next move.", "<b>Attacker view:</b> \u201cI need a map of this network before I act.\u201d <b>Defender view:</b> every look-around command is a chance to catch the attacker early."], "study": "Re-read the intro panel: tactic goal vs the other tactic goals (Initial Access, Exfiltration, Impact)."}, {"id": "EASY-02", "type": "blanks", "summary": "Discovery vs Reconnaissance \u2014 before or after access?", "scenario": ["Two ATT&CK tactics look similar: <b>Reconnaissance (TA0043)</b> and <b>Discovery (TA0007)</b>. The difference is simple: it is about <b>when</b> the attacker collects information. Complete the rule below by picking a word for each blank."], "question": "Fill both blanks with the right words.", "text": "Discovery happens ___ the attacker already has access to a system. Reconnaissance (TA0043) happens ___ the attacker gets in.", "bankw": ["after", "before", "inside", "never"], "ans": ["after", "before"], "blankWhy": ["Discovery (TA0007) runs on victim systems, so the attacker must already have access.", "Reconnaissance (TA0043) is outside work: public websites, scan of internet-facing systems, social media. It stops once the attacker is in."], "hint": "One word goes with \u201calready has access\u201d. The other goes with the phase outside the network.", "ansText": "Discovery = after access. Reconnaissance = before access.", "expl": ["Both tactics collect information. The clock is the difference.", "Reconnaissance (TA0043) happens outside: the attacker reads websites, scans public IPs, looks at staff profiles.", "Discovery (TA0007) happens inside: the attacker runs commands on a machine you own. That is why Discovery leaves logs on your systems \u2014 and why defenders can detect it."], "study": "Remember the pair: TA0043 outside, TA0007 inside."}, {"id": "EASY-03", "type": "slots", "summary": "Place four techniques on the right ATT&CK tactic", "scenario": ["ATT&CK is a matrix. Every technique sits in one tactic column. Below are four techniques. Drag each one onto the tactic where it belongs. Two of them belong to Discovery (TA0007)."], "question": "Drag every technique onto its correct tactic column.", "bank": [{"id": "b1", "t": "T1087 \u2014 Account Discovery"}, {"id": "b2", "t": "T1566 \u2014 Phishing"}, {"id": "b3", "t": "T1057 \u2014 Process Discovery"}, {"id": "b4", "t": "T1486 \u2014 Data Encrypted for Impact"}], "slots": [{"label": "TA0007 \u2014 Discovery (the look-around tactic)", "accept": ["b1", "b3"], "why": "T1087 and T1057 both collect knowledge from inside the victim environment, so both are Discovery techniques."}, {"label": "TA0001 \u2014 Initial Access (getting in)", "accept": ["b2"], "why": "Phishing is a way to get the first access, so it belongs to Initial Access."}, {"label": "TA0040 \u2014 Impact (breaking things)", "accept": ["b4"], "why": "Ransomware-style encryption of files is Impact: it destroys availability."}, {"label": "TA0008 \u2014 Lateral Movement (spreading inside)", "accept": [], "why": "None of these four techniques spread the attacker to a new host, so this column stays empty."}], "hint": "Ask yourself for each card: does it LOOK AROUND, GET IN, BREAK, or SPREAD?", "ansText": "Discovery column: T1087 Account Discovery and T1057 Process Discovery. Phishing \u2192 Initial Access. Encryption \u2192 Impact.", "expl": ["T1087 (Account Discovery) lists accounts. T1057 (Process Discovery) lists running processes. Both are classic \u201clook around\u201d behaviour inside the network \u2014 that is Discovery (TA0007).", "T1566 (Phishing) is how attackers get their first foothold, so it is Initial Access (TA0001).", "T1486 (Data Encrypted for Impact) breaks your data, so it is Impact (TA0040). Lateral Movement (TA0008) is about moving to other hosts \u2014 none of these four cards do that."], "study": "Scan the ATT&CK matrix top to bottom: the tactic column tells you the GOAL of the technique."}, {"id": "EASY-04", "type": "pairs", "summary": "Match four common commands to their ATT&CK technique", "scenario": ["You will see these commands in alerts almost every day. Match each command to the Discovery technique it performs."], "question": "Match each command on the left to its technique on the right.", "left": [{"id": "l1", "t": "net user", "ok": "r1", "why": "\u201cnet user\u201d lists accounts \u2014 that is Account Discovery (T1087)."}, {"id": "l2", "t": "ipconfig /all", "ok": "r2", "why": "\u201cipconfig /all\u201d shows IP, DNS and gateway settings \u2014 System Network Configuration Discovery (T1016)."}, {"id": "l3", "t": "tasklist", "ok": "r3", "why": "\u201ctasklist\u201d lists running processes \u2014 Process Discovery (T1057)."}, {"id": "l4", "t": "nmap", "ok": "r4", "why": "\u201cnmap\u201d probes many hosts and ports \u2014 Network Service Scanning (T1046)."}], "right": [{"id": "r1", "t": "T1087 \u2014 Account Discovery"}, {"id": "r2", "t": "T1016 \u2014 System Network Configuration Discovery"}, {"id": "r3", "t": "T1057 \u2014 Process Discovery"}, {"id": "r4", "t": "T1046 \u2014 Network Service Scanning"}], "hint": "Say what each command SHOWS: accounts, network setup, processes, or open ports on other machines.", "ansText": "net user \u2192 T1087. ipconfig /all \u2192 T1016. tasklist \u2192 T1057. nmap \u2192 T1046.", "expl": ["These four tools are the daily bread of Discovery detection.", "\u201cnet user\u201d asks Windows for the list of accounts \u2192 T1087 Account Discovery.", "\u201cipconfig /all\u201d prints the local network setup (IP, DNS, gateway) \u2192 T1016.", "\u201ctasklist\u201d prints running processes \u2192 T1057.", "\u201cnmap\u201d talks to many hosts and ports to learn what is open \u2192 T1046 Network Service Scanning."], "study": "Keep a personal cheat-sheet: command \u2192 technique ID. It speeds up triage a lot."}, {"id": "EASY-05", "type": "qcm", "summary": "One EDR line with nltest /dclist \u2014 what does it reveal?", "scenario": ["One alert lands in your queue. You only have this one log line.", "<b>ARTEFACT \u2014 EDR process log</b><br><code>2026-10-14 02:12:44 UTC \u00b7 WIN-FIN-22 \u00b7 user: svc_backup \u00b7 process: nltest.exe /dclist:corp.local</code>"], "question": "Look at the command in this line. What is the attacker trying to learn?", "opts": ["The list of domain controllers in the corp.local domain", "The password of the svc_backup service account", "The names of files inside a shared folder", "The serial number of the server hard drive"], "ok": [0], "why": {"0": "\u201c/dclist:\u201d asks the domain for its domain controllers. That is exactly what this option says.", "1": "nltest never reads passwords. Password theft is Credential Access, a different tactic.", "2": "Listing shared folders is share discovery (for example \u201cnet view\u201d), not nltest /dclist.", "3": "Hardware details come from tools like systeminfo or BIOS queries, not nltest."}, "hint": "Break the command apart: \u201cDC\u201d means domain controller. \u201clist\u201d means list.", "ansText": "nltest /dclist:corp.local asks the domain: \u201cgive me your list of domain controllers\u201d.", "expl": ["nltest is a built-in Windows tool for domain questions. The /dclist: switch lists the <b>domain controllers</b> (the most important servers in a Windows domain).", "Why does an attacker want this? Domain controllers hold all accounts and passwords. Knowing them is the first step to attack them.", "<b>Defender note:</b> an alert like this at 02:12 from a service account deserves a ticket: who started nltest, and from which parent process?"], "study": "nltest has a few switches (/dclist:, /trusted_domains\u2026). Learn what each one reveals."}, {"id": "EASY-06", "type": "order", "summary": "Put four attack phases in the right order", "scenario": ["A simple attack story has four steps. The steps below are shuffled. Put them back into the order a real attack follows."], "question": "Order the four phases from first to last.", "items": ["The attacker gets in with a phishing link \u2014 Initial Access (TA0001)", "The attacker runs ipconfig and net user to look around \u2014 Discovery (TA0007)", "The attacker uses a stolen account on a file server \u2014 Lateral Movement (TA0008)", "The attacker sends the stolen data to a server outside \u2014 Exfiltration (TA0011)"], "itemWhy": ["Initial Access is always the first tactic: no access, no attack.", "Discovery comes right after the first foothold: the attacker maps the ground before moving.", "Lateral Movement needs two things first: access and knowledge of where to go. That is why it follows Discovery.", "Exfiltration is near the end: the attacker first finds and collects the data, then sends it out."], "hint": "Think: get in \u2192 look around \u2192 move \u2192 send out.", "ansText": "Initial Access \u2192 Discovery \u2192 Lateral Movement \u2192 Exfiltration.", "expl": ["The kill chain flows: <b>TA0001</b> get in, <b>TA0007</b> look around, <b>TA0008</b> spread to other hosts, <b>TA0011</b> send data out.", "Discovery sits early on purpose. Every later step (which server? which account?) depends on what the attacker learns here.", "This is why catching Discovery is so valuable: it happens before the expensive damage."], "study": "Sketch the tactics as a timeline and place three techniques you know on it."}, {"id": "EASY-07", "type": "qcm", "summary": "Which data source catches arp -a?", "scenario": ["<b>ARTEFACT \u2014 EDR event, PC-ACC-03</b><br><code>process created: cmd.exe /c arp -a (parent: cmd.exe, user: fin-user1)</code>", "You want your SOC to automatically catch every command like this one."], "question": "Which data source catches this command best?", "opts": ["Process creation logs that keep the full command line", "Firewall logs from the internet gateway at the edge", "Printer and scanner usage logs from the print servers", "Antivirus definition update logs from the AV console"], "ok": [0], "why": {"0": "arp -a is a process with a command line. A process-creation log with command line shows it word for word.", "1": "arp -a runs on the local machine and talks to the local network segment. The internet gateway never sees it.", "2": "Printers have nothing to do with running commands.", "3": "Antivirus updates say when signatures were refreshed, not which commands ran."}, "hint": "Ask: what does the EDR need to record so the exact command appears in the log?", "ansText": "Process creation logging with command-line capture catches arp -a (and every other Discovery command).", "expl": ["The command <code>arp -a</code> prints the ARP cache: the list of machines the host recently talked to on the local network. In ATT&CK it maps to System Network Connections Discovery (T1049).", "To catch it, a sensor must record the <b>process creation event with its command line</b>. That is the key data source for most Discovery techniques.", "<b>Defender note:</b> without command-line logging, you see \u201ccmd.exe ran\u201d \u2014 which is useless. Turn on command-line capture in your EDR or Sysmon config."], "study": "Data source \u201cProcess: Process Creation\u201d with \u201cProcess Command Line\u201d \u2014 learn this pair; most Discovery detections need it."}, {"id": "EASY-08", "type": "grid", "summary": "Three quick alerts: discovery or normal activity?", "scenario": ["Morning SOC shift. Three alerts wait in the queue. Classify each row: is the behaviour Discovery, or is it normal activity?"], "question": "Classify each of the three rows.", "rows": [{"label": "03:58 \u00b7 fin-file01 \u00b7 adfind.exe -f objectCategory=group (new tool on this host)", "opts": ["Discovery \u2014 suspicious look-around", "Benign \u2014 normal user activity", "Network outage \u2014 not security"], "ok": 0, "why": "adfind is an Active Directory query tool. On a file server at 03:58 it is a classic Discovery alert."}, {"label": "10:02 \u00b7 it-laptop-44 \u00b7 netstat -ano run by the IT intern during onboarding training", "opts": ["Discovery \u2014 suspicious look-around", "Benign \u2014 normal user activity", "Network outage \u2014 not security"], "ok": 1, "why": "A supervised training session by IT staff is expected activity, even though netstat is a Discovery tool."}, {"label": "11:47 \u00b7 hr-ws-12 \u00b7 powershell Get-SmbShare (share listing on an HR workstation)", "opts": ["Discovery \u2014 suspicious look-around", "Benign \u2014 normal user activity", "Network outage \u2014 not security"], "ok": 0, "why": "Listing SMB shares from an HR workstation has no normal business reason \u2014 treat it as Discovery until proven otherwise."}], "hint": "Two questions per row: WHAT tool ran, and does this host/user normally do that?", "ansText": "Row 1 Discovery. Row 2 benign (training). Row 3 Discovery.", "expl": ["The tool alone does not decide the case \u2014 <b>context</b> does. adfind on a file server at night is odd; netstat during a documented IT training is normal.", "This is the core SOC skill for Discovery alerts: compare the behaviour with a baseline for that host and user.", "<b>Attacker view:</b> attackers love built-in tools because they look like admin work. <b>Defender answer:</b> baseline who runs which tool, where, and when."], "study": "\u201cExpected vs anomalous\u201d baselines: who, where, when, which parent process."}, {"id": "EASY-09", "type": "term", "timebox": null, "summary": "Fake terminal \u2014 list local user accounts (guided)", "scenario": ["This is a <b>safe training machine</b> called PC-TRAIN-01. Nothing you type here touches a real system.", "Your task: list the <b>local user accounts</b> on this machine. The <code>net</code> command asks Windows for account information. Type the command below, press <b>Run \u23ce</b>, look at the output, then press <b>Check \u2713</b>."], "question": "Type the command that lists local user accounts.", "cmd": {"prompt": "C:\\WINDOWS\\system32> ", "note": "<b>Syntax reminder</b><br>Shape: <code>net &lt;what-to-list&gt;</code><br>Example on a <i>different</i> target: <code>net localgroup</code> lists local groups.<br>Your goal is the list of users. The command is two words.", "elements": [{"name": "the net tool", "re": "\\bnet(\\.exe)?\\b", "why": "net is the built-in Windows tool for accounts, groups and shares."}, {"name": "the target \u201cuser\u201d", "re": "\\busers?\\b", "why": "\u201cnet user\u201d lists the local user accounts. (Both \u201cuser\u201d and \u201cusers\u201d work.)"}], "danger": [{"re": "\\b(add|delete)\\b", "msg": "\u201cnet user <name> /add or /delete\u201d changes accounts. This task only asks you to LIST \u2014 never change state in an investigation."}], "runOk": [["^net(\\.exe)?\\s+users?\\s*$", ["User accounts for \\\\PC-TRAIN-01", "-----------------------------------------------------", "Administrator   DefaultAccount   Guest   helpdesk1   svc_scan", "The command completed successfully."]]], "canonical": "net user", "outputShape": "User accounts for \\\\PC-TRAIN-01\n-------------------------------------\nAdministrator  DefaultAccount  Guest  helpdesk1  svc_scan"}, "hint": "The shape is \u201cnet + what you want\u201d. You want users.", "ansText": "net user", "expl": ["<code>net user</code> asks Windows to print every local account. It is one of the most common Account Discovery (T1087) commands.", "<b>Attacker view:</b> one short command, no admin rights needed, output is a ready list of targets. That is why attackers love it.", "<b>Defender view:</b> process-creation logging with command line catches it. Alert when net user runs on hosts where admins never run it."], "study": "net has a family: net user, net localgroup, net group (domain), net share, net view. Learn one per day."}, {"id": "EASY-10", "type": "pairs", "summary": "Match data sources to what they show", "scenario": ["A detection is only as good as its data source. Match each data source to what it can show you during a Discovery attack."], "question": "Match each data source to what it shows.", "left": [{"id": "l1", "t": "Process command-line logs", "ok": "r1", "why": "Command-line logging records the exact command the attacker typed."}, {"id": "l2", "t": "Network flow logs", "ok": "r2", "why": "Flow logs record host-to-host connections \u2014 perfect for spotting scans and sweeps."}, {"id": "l3", "t": "Windows Registry access logs", "ok": "r3", "why": "Registry logging shows which configuration values the attacker read (for example T1012 Query Registry)."}], "right": [{"id": "r1", "t": "which exact command the attacker ran"}, {"id": "r2", "t": "which other hosts the attacker connected to"}, {"id": "r3", "t": "which system settings the attacker read"}], "hint": "One source watches processes, one watches connections, one watches system settings.", "ansText": "Command lines \u2192 the exact command. Flow logs \u2192 the connections. Registry logs \u2192 the settings read.", "expl": ["Every Discovery technique leaves traces in different places. Picking the right data source is the first job of a detection engineer.", "Process command-line logs answer \u201cwhat did they run?\u201d. Network flow logs answer \u201cwho did they talk to?\u201d. Registry logs answer \u201cwhat did they read from the system?\u201d.", "<b>Real-work link:</b> when your team plans logging, cover all three layers \u2014 host commands, network flows, and system configuration reads."], "study": "ATT&CK lists \u201cData Sources\u201d on every technique page. Use them when you design detections."}, {"id": "EASY-11", "type": "qcm", "summary": "180 servers probed on port 445 in four minutes", "scenario": ["<b>ARTEFACT \u2014 firewall summary</b><br><code>src: 10[.]0[.]4[.]61 \u2192 180 unique internal hosts \u00b7 dport: 445/tcp (SMB) \u00b7 240 s \u00b7 result: mostly connection refused</code>"], "question": "Which Discovery technique is this?", "opts": ["Network Service Scanning (T1046)", "Application Window Discovery (T1010)", "Password Policy Discovery (T1201)", "Cloud Infrastructure Discovery (T1580)"], "ok": [0], "why": {"0": "One host probing many hosts on one port is the definition of service scanning.", "1": "T1010 enumerates open windows on the local desktop \u2014 it never touches 180 servers.", "2": "T1201 reads password rules (length, complexity) \u2014 for example \u201cnet accounts /domain\u201d.", "3": "T1580 queries cloud APIs (AWS, Azure) \u2014 this traffic is inside the LAN."}, "hint": "Many hosts + one port + short time = one word that starts with \u201cscanning\u201d.", "ansText": "A rapid single-port sweep over 180 hosts is Network Service Scanning (T1046).", "expl": ["The pattern tells the story: one source, many destinations, one service port, very short time window. Nobody works that way by hand \u2014 but a scanning tool does.", "Port 445 is SMB (Windows file sharing). A scan of 445 says: \u201cI am building a list of machines that accept file-sharing connections\u201d. Attackers use that list for lateral movement and ransomware spread.", "<b>Defender note:</b> internal scans are often missed because teams only watch the internet edge. Watch east-west traffic too."], "study": "Scan analytics: unique destinations per source per minute. Tune for real scanners (vulnerability scanners) with a ticket reference."}, {"id": "EASY-12", "type": "multi", "summary": "Select the two Discovery techniques", "scenario": ["You are building a small ATT&CK cheat-sheet for your team. Four technique cards are on the table, but         (d.danger||[]).some(function(r){if(new RegExp(r.re,'i').test(nc)){warn=r;return true;}return false;});
        if(warn){scr.appendChild(nd('div','tline warn','⚠ BLOCKED IN SIMULATION — '+warn.msg));}
        else{scr.appendChild(nd('div','tline err','command not found in simulation, or it produced no output'));}
      }
    }
    inp.value='';
    scr.scrollTop=scr.scrollHeight;
  }
  run.addEventListener('click',doRun);
  inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'){doRun();}});
  if(d.outputShape){wrap.appendChild(nd('div','termShape',nl2br(d.outputShape)));}
  i.termInput=inp;
  i.readFn=function(){var v=(inp.value&&inp.value.trim())?inp.value:i.cmd;i.cmd=v;return v;};
  return wrap;
}
function wSteps(i){
  var wrap=nd('div');
  function renderStep(){
    wrap.innerHTML='';
    var k=i.rstep;
    if(k>=i.rsteps.length){
      wrap.appendChild(nd('div','stepDone','✓ All steps answered. Your choices are graded together when you press Check. The timer keeps running until then.'));
      return;
    }
    var st=i.rsteps[k];
    wrap.appendChild(nd('div','stepChip','STEP '+(k+1)+' OF '+i.rsteps.length));
    if(st.ctx){wrap.appendChild(nd('div','stepCtx',st.ctx));}
    wrap.appendChild(nd('div','stepQ',esc(st.q)));
    var opts=nd('div','opts');
    st.ropts.forEach(function(o,ix){
      var b=mkbtn('<span class="ol">'+String.fromCharCode(65+ix)+'.</span><span class="ot">'+esc(o.t)+'</span>','opt'+(i.stepAns[k]===ix?' on':''));
      b.setAttribute('aria-pressed',i.stepAns[k]===ix?'true':'false');
      b.addEventListener('click',function(){
        var bs=opts.querySelectorAll('.opt');
        for(var z=0;z<bs.length;z++){bs[z].classList.remove('on');bs[z].setAttribute('aria-pressed','false');}
        b.classList.add('on');b.setAttribute('aria-pressed','true');
        i.stepAns[k]=ix;
      });
      opts.appendChild(b);
    });
    wrap.appendChild(opts);
    var nb=mkbtn((k+1<i.rsteps.length?'Confirm & continue →':'Confirm last step →'),'primary');
    nb.addEventListener('click',function(){
      if(i.stepAns[k]==null){setFlash('Choose an option for this step first.');return;}
      setFlash('');
      i.rstep++;
      renderStep();
    });
    wrap.appendChild(nb);
  }
  renderStep();
  i.readFn=function(){return i.stepAns.slice();};
  return wrap;
}
function buildWidget(i){
  switch(i.d.type){
    case 'qcm':return wOptions(i,false);
    case 'multi':return wOptions(i,true);
    case 'slots':return wSlots(i);
    case 'order':return wOrder(i);
    case 'pairs':return wPairs(i);
    case 'blanks':return wBlanks(i);
    case 'grid':return wGrid(i);
    case 'term':return wTerm(i);
    case 'steps':return wSteps(i);
  }
  return nd('div','p','(unsupported exercise type)');
}

/* ============ TA0007 exam engine — part B: grading, views, flow ============ */
var EX=window.EXAM;
var S=null;
var TICKH=null;

function newState(){

  return {phase:'INTRO',idx:0,ex:order,creditSum:0,answered:0,skipPool:[],timeLeft:EX.timeSec,

/* ============ grading: max(0,(H−W)/N) ============ */
function gradeEx(i){
  var d=i.d,ans=i.readFn();
  var items=[],N=0,H=0,W=0;
  function ok(l,why){H++;items.push({st:'ok',l:l,why:why});}
  function bad(l,why){W++;items.push({st:'bad',l:l,why:why});}
  function miss(l,why){items.push({st:'miss',l:l,why:why});}
  var k,oi;
  if(d.type==='qcm'){
    N=1;
    if(ans==null){miss('No option chosen','You did not answer. The correct answer is shown below.');}
    else{
      var ro=i.ropts[ans];
      var lbl='Option '+String.fromCharCode(65+ans)+': '+ro.t;
      if(ro.ok){ok(lbl,ro.why||d.ansText);}
      else{bad(lbl,ro.why||'This option does not match the scenario.');}
    }
  }else if(d.type==='multi'){
    var sel={};(ans||[]).forEach(function(x){sel[x]=1;});
    i.ropts.forEach(function(o,ix){
      var chosen=sel[ix]===1;
      if(o.ok){
        if(chosen){ok(o.t,o.why||'This item is part of the correct answer.');}
        else{miss(o.t,o.why||'This item is part of the correct answer.');}
      }else if(chosen){bad(o.t,o.why||'This item is not part of the correct answer.');}
    });
    N=i.ropts.filter(function(o){return o.ok;}).length;
  }else if(d.type==='slots'){
    /* item-centric: every bank item must land in the one slot that accepts it.
       Slots that accept nothing ("stay empty" columns) need no item — placing one there is wrong. */
    N=i.rbank.length;
    i.rbank.forEach(function(b){
      var placedSi=-1,correctSi=-1;
      for(var s=0;s<i.place.length;s++){if(i.place[s].indexOf(b.id)>=0){placedSi=s;break;}}
      for(var s2=0;s2<i.rslots.length;s2++){if(i.rslots[s2].accept.indexOf(b.id)>=0){correctSi=s2;break;}}
      var where=placedSi>=0?i.rslots[placedSi].label:'(left in the bank)';
      var lbl=b.t+' → '+where;
      if(placedSi===correctSi){ok(lbl,i.rslots[correctSi].why);}
      else if(placedSi>=0){bad(lbl,findBankWhy(i,b.id)||('This item belongs in “'+i.rslots[correctSi].label+'”: '+i.rslots[correctSi].why));}
      else{miss(lbl+' — correct target: '+i.rslots[correctSi].label,i.rslots[correctSi].why);}
    });
  }else if(d.type==='order'){
    N=i.ritems.length;
    for(var p=0;p<i.ritems.length;p++){
      var id=ans[p];
      var oi2=parseInt(String(id).replace('o',''),10);
      var txt='';
      for(var z2=0;z2<i.ritems.length;z2++){if(i.ritems[z2].id===id){txt=i.ritems[z2].t;break;}}
      if(id===('o'+p)){ok('Position '+(p+1)+': '+txt,d.itemWhy[p]);}
      else{bad('Position '+(p+1)+': '+txt+' — it belongs at position '+(oi2+1),d.itemWhy[oi2]);}
    }
  }else if(d.type==='pairs'){
    N=i.rleft.length;
    i.rleft.forEach(function(l,ix){
      var v=ans[ix]||'';
      var rt='';
      for(var z3=0;z3<i.rright.length;z3++){if(i.rright[z3].id===v){rt=i.rright[z3].t;break;}}
      if(v===l.ok){ok(l.t+' → '+rt,l.why);}
      else if(v){bad(l.t+' → '+rt,l.why);}
      else{miss(l.t+' → (no match chosen)',l.why);}
    });
  }else if(d.type==='blanks'){
    N=i.d.ans.length;
    for(var b2=0;b2<i.d.ans.length;b2++){
      var v2=ans[b2]||'';
      if(v2===i.d.ans[b2]){ok('Blank '+(b2+1)+': '+v2,i.d.blankWhy[b2]);}
      else if(v2){bad('Blank '+(b2+1)+': “'+v2+'” — the correct word is “'+i.d.ans[b2]+'”',i.d.blankWhy[b2]);}
      else{miss('Blank '+(b2+1)+' → (empty). Correct word: “'+i.d.ans[b2]+'”',i.d.blankWhy[b2]);}
    }
  }else if(d.type==='grid'){
    N=i.rrows.length;
    i.rrows.forEach(function(r,ix){
      var v=ans[ix];
      if(v==null||v<0){miss('R'+(ix+1)+': '+r.label+' → (no classification). Correct: “'+r.ropts.filter(function(o){return o.ok;})[0].t+'”',r.why);}
      else if(r.ropts[v].ok){ok('R'+(ix+1)+': '+r.label+' → '+r.ropts[v].t,r.why);}
      else{bad('R'+(ix+1)+': '+r.label+' → '+r.ropts[v].t,r.why);}
    });
  }else if(d.type==='term'){
    var nc=String(ans||'').toLowerCase().replace(/\s+/g,' ').trim();
    var els=(i.d.cmd&&i.d.cmd.elements)||[];
    N=els.length;
    if(!nc){
      /* an empty command answers nothing: every element counts as missed, no 'avoided' credit */
      els.forEach(function(e){
        miss(e.name+' → (no command entered)',e.why);
      });
    }else{
    els.forEach(function(e){
      var hit=new RegExp(e.re,'i').test(nc);
      if(e.not){
        if(hit){bad('You used: '+e.name,e.why);}
        else{ok('Avoided: '+e.name,e.why);}
      }else{
        if(hit){ok(e.name,e.why);}
        else{miss(e.name,e.why);}
      }
    });
    }
  }else if(d.type==='steps'){
    N=i.rsteps.length;
    i.rsteps.forEach(function(st,si){
      var v=ans[si];
      var correctOpt=null;
      st.ropts.forEach(function(o){if(o.ok){correctOpt=o;}});
      if(v==null){miss('Step '+(si+1)+': no choice recorded. Correct: “'+(correctOpt?correctOpt.t:'?')+'”',st.why);}
      else if(st.ropts[v]&&st.ropts[v].ok){ok('Step '+(si+1)+' choice: '+st.ropts[v].t,st.why);}
      else if(st.ropts[v]){bad('Step '+(si+1)+' choice: '+st.ropts[v].t+' — correct: “'+(correctOpt?correctOpt.t:'?')+'”',st.why);}
      else{miss('Step '+(si+1)+': no choice recorded. Correct: “'+(correctOpt?correctOpt.t:'?')+'”',st.why);}
    });
  }
  var credit0=clamp01((H-W)/N);
  var credit=(i.hintUsed?Math.max(0,credit0-0.10):credit0);
  return {credit:credit,credit0:credit0,items:items,N:N,H:H,W:W,ans:ans};
}
function findBankWhy(i,id){
  for(var z=0;z<i.rbank.length;z++){if(i.rbank[z].id===id&&i.rbank[z].whyNot){return i.rbank[z].whyNot;}}
  return '';
}

/* ============ pause accounting ============ */
function enterPause(kind){S.pauseKind=kind;S.pauseStart=Date.now();}
function leavePause(){
  if(S.pauseKind&&S.pauseStart){
    var dt=Date.now()-S.pauseStart;
    if(S.pauseKind==='manual'){S.pManMs+=dt;}else{S.pAutoMs+=dt;}
  }
  S.pauseKind=null;S.pauseStart=0;
}

/* ============ header ============ */
function updHdr(){
  var prog=gid('hprog'),st=gid('hstate'),tm=gid('htimer'),sc=gid('hscore');
  if(!prog){return;}
  if(S.phase==='INTRO'){prog.textContent='Read the briefing, then start';}
  else if(S.phase==='ENDED'){prog.textContent='Results';}
  else if(S.reviewing!=null){prog.textContent='Reviewing skipped exercise '+(S.reviewing+1);}
  else if(S.onReviewList){prog.textContent='Review skipped ('+S.skipPool.length+' in pool)';}
  else{prog.textContent='Exercise '+(S.idx+1)+' of '+S.ex.length;}
  var cls='hstate ',txt='';
  if(S.phase==='INTRO'){cls+='running';txt='⏱ READY — timer starts on Start';}
  else if(S.phase==='RUNNING'){cls+='running';txt='▶ RUNNING';}
  else if(S.phase==='PAUSED_MANUAL'){cls+='pman';txt='⏸ PAUSED — manual (press Resume)';}
  else if(S.phase==='PAUSED_AUTO_CHECK'){cls+='pauto';txt='⏸ PAUSED — reviewing feedback (resumes on Next)';}
  else{cls+='ended';txt='⏹ ENDED';}
  st.className=cls;st.textContent=txt;
  tm.textContent=fmt(S.timeLeft);
  var sum=Math.round(S.creditSum*10)/10;
  var pc=S.answered>0?Math.round((S.creditSum/S.answered)*100):0;
  sc.textContent=S.answered>0?('Score '+sum.toFixed(1)+' / '+S.answered+' · '+pc+'%'):'Score —';
  var bH=gid('btnHint'),bS=gid('btnSkip'),bP=gid('btnPause');
  var i=curEx();
  bH.disabled=!(S.phase==='RUNNING'&&i&&!i.graded&&!i.hintUsed);
  bS.disabled=!(S.phase==='RUNNING'&&i&&!i.graded&&S.reviewing==null);
  bP.disabled=!(S.phase==='RUNNING'||S.phase==='PAUSED_AUTO_CHECK');
}

/* ============ feedback ============ */
function renderFeedback(holder,i,g){
  var d=i.d;
  var isSingle=(d.type==='qcm');
  var label,cls,icon;
  if(g.credit>=1){label=isSingle?'CORRECT':'CORRECT';cls='ok';icon='✓';}
  else if(g.credit>0){label='PARTIALLY CORRECT';cls='part';icon='✓';}
  else{label='INCORRECT';cls='bad';icon='✗';}
  var fb=nd('div','fb '+cls);
  fb.appendChild(nd('div','fb-h',icon+' '+label));
  var b=nd('div','fb-b');
  if(!isSingle){
    b.appendChild(nd('div','creditLine','credit '+g.credit.toFixed(2)+' — '+g.H+'/'+g.N+' items counted'+(i.hintUsed&&g.credit0>0?' (hint −0.10 applied)':'')));
  }else if(i.hintUsed&&g.credit0>0){
    b.appendChild(nd('div','creditLine','hint −0.10 applied to this exercise’s credit'));
  }
  b.appendChild(nd('div','ansLine','<b>Correct answer:</b> '+esc(d.ansText)));
  var exWrap=nd('div','expl');
  d.expl.forEach(function(p){exWrap.appendChild(nd('p',null,p));});
  b.appendChild(exWrap);
  if(d.type==='term'){
    b.appendChild(nd('div',null,'<b>Canonical command (copyable):</b>'));
    b.appendChild(nd('div','copyBlock',esc(d.cmd.canonical)));
    (d.cmd.elements||[]).forEach(function(e){
      var line='• <b>'+esc(e.name)+'</b> — '+esc(e.why);
      b.appendChild(nd('div','p',line));
    });
    (d.cmd.danger||[]).forEach(function(dg){
      b.appendChild(nd('div','p','⚠ <b>Dangerous near-miss:</b> '+esc(dg.msg)));
    });
  }
  if(!isSingle&&g.items.length){
    var box=nd('div','items');
    g.items.forEach(function(it){
      var ic=it.st==='ok'?'✓':(it.st==='bad'?'✗':'○');
      var wd=it.st==='ok'?'Correct':(it.st==='bad'?'Wrong':'Missed');
      var r=nd('div','itm '+it.st,'<span class="ic">'+ic+'</span><span><b>'+wd+' — '+esc(it.l)+'</b><br>'+esc(it.why)+'</span>');
      box.appendChild(r);
    });
    b.appendChild(box);
  }
  if(d.study){b.appendChild(nd('div','study','📚 What to study next: '+esc(d.study)));}
  fb.appendChild(b);
  holder.appendChild(fb);
}

/* ============ flow: check / next / skip / hint / pause ============ */
function doCheck(){
  var i=curEx();
  if(!i||i.graded){return;}
  /* FIRST ACTION: stop the timer by entering the auto-check pause state */
  if(S.phase==='RUNNING'){enterPause('auto');}
  S.phase='PAUSED_AUTO_CHECK';
  var g=gradeEx(i);
  i.g=g;i.graded=true;i.credit=g.credit;i.answered=true;
  S.creditSum+=g.credit;S.answered++;
  renderExercise();updHdr();
}
function doNext(){
  var i=curEx();
  if(!i||!i.graded){return;}
  leavePause();
  if(S.reviewing!=null){
    S.reviewing=null;S.phase='RUNNING';
    renderReview();updHdr();
    return;
  }
  if(S.idx<S.ex.length-1){S.idx++;S.phase='RUNNING';renderExercise();updHdr();}
  else if(S.skipPool.length){S.phase='RUNNING';renderReview();updHdr();}
  else{endExam('submit');}
}
function doSkip(){
  var i=curEx();
  if(!i||i.graded||i.skipped||S.reviewing!=null||S.phase!=='RUNNING'){return;}
  i.skipped=true;
  S.skipPool.push(S.idx);
  if(S.idx<S.ex.length-1){S.idx++;renderExercise();}
  else if(S.skipPool.length){renderReview();}
  else{endExam('submit');}
  updHdr();
}
function doHint(){
  var i=curEx();
  if(!i||i.graded||i.hintUsed){return;}
  i.hintUsed=true;i.hintShown=true;
  renderExercise();updHdr();
}
function doPause(){
  if(S.phase==='RUNNING'||S.phase==='PAUSED_AUTO_CHECK'){
    S.resumeTo=(S.phase==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':null;
    if(S.phase==='RUNNING'){enterPause('manual');}
    else{leavePause();enterPause('manual');} /* bank the auto time so far; the break counts as manual */
    S.phase='PAUSED_MANUAL';
    renderOverlay();updHdr();
  }
}
function doResume(){
  leavePause();
  S.phase=S.resumeTo||'RUNNING';
  S.resumeTo=null;
  if(S.phase==='PAUSED_AUTO_CHECK'){enterPause('auto');} /* keep counting feedback-review time */
  gid('ovl').className='';
  document.body.classList.remove('manually-paused');
  if(S.phase==='RUNNING'){renderExercise();}
  updHdr();
}
function renderOverlay(){
  var o=gid('ovl');
  o.className='show';
  document.body.classList.add('manually-paused');
  o.innerHTML='<div class="ovlCard"><div style="font-size:44px">☕</div><h2>Manual pause</h2>'+
    '<p>The timer is stopped and the exercise is hidden. Take a real break.</p>'+
    '<p style="font-size:13.5px;color:#9aa8bd">Press Resume when you are ready. Your answer (if you made one) is kept.</p>'+
    '<button class="bigBtn" id="btnResume">Resume ▶</button></div>';
  gid('btnResume').addEventListener('click',doResume);
}

/* ============ review skipped ============ */
function renderReview(){
  var m=gid('main');
  m.innerHTML='';
  S.onReviewList=true;
  var w=nd('div','panel');
  w.appendChild(nd('h2',null,'🔁 Review skipped exercises'));
  w.appendChild(nd('p','p','Time left: <b>'+fmt(S.timeLeft)+'</b>. You can answer skipped exercises as many times as you need until the timer ends, or submit now. Skipped-and-never-answered exercises are excluded from your score.'));
  S.skipPool.forEach(function(exIdx){
    var inst=S.ex[exIdx];
    var row=nd('div','revRow');
    row.appendChild(nd('div','revT','<b>Exercise '+(exIdx+1)+'</b> — '+esc(inst.d.summary||inst.d.question)));
    if(inst.graded){
      row.appendChild(nd('span','revTag done','✓ Answered — credit '+inst.credit.toFixed(2)));
    }else{
      row.appendChild(nd('span','revTag excl','⚠ NOT ANSWERED — EXCLUDED'));
      var b=mkbtn('Answer ▶','hbtn');
      b.addEventListener('click',function(){
        S.reviewing=exIdx;S.idx=exIdx;S.phase='RUNNING';
        renderExercise();updHdr();
      });
      row.appendChild(b);
    }
    w.appendChild(row);
  });
  var ftr=nd('div','ftr');
  var sb=mkbtn('Submit exam & see results ✓','bigBtn');
  sb.addEventListener('click',function(){leavePause();endExam('submit');});
  ftr.appendChild(sb);
  w.appendChild(ftr);
  m.appendChild(w);
}

/* ============ results ============ */
function renderResults(){
  var m=gid('main');
  m.innerHTML='';
  var answered=0,sum=0,full=0,part=0,zero=0,partSum=0,skippedUn=0,notReached=0;
  S.ex.forEach(function(i){
    if(i.graded){
      answered++;sum+=i.credit;
      if(i.credit>=1){full++;}
      else if(i.credit>0){part++;partSum+=i.credit;}
      else{zero++;}
    }else if(i.skipped){skippedUn++;}
    else{notReached++;}
  });
  var percent=answered>0?Math.round((sum/answered)*100):0;
  var passed=percent>=EX.passMark;
  var w=nd('div');
  var hero=nd('div','resHero '+(passed?'pass':'fail'));
  hero.appendChild(nd('div',null,passed?'🏆':'📉'));
  hero.appendChild(nd('div','big',percent+'% — '+(passed?'PASS':'FAIL')));
  hero.appendChild(nd('p','p',passed
    ?('You reached the pass mark of '+EX.passMark+'%. Well done — you mastered this tier of TA0007 Discovery.')
    :('You needed '+EX.passMark+'% over the exercises you answered. You must retake this exam to pass the tier.')));
  hero.appendChild(nd('p','p','<b>Topic:</b> '+esc(EX.title)+' · <b>Score:</b> '+(Math.round(sum*10)/10).toFixed(1)+' / '+answered+' answered'));
  if(S.userName){hero.appendChild(nd('p','p','<b>Learner:</b> '+esc(S.userName)));}
  w.appendChild(hero);

  var sg=nd('div','statGrid');
  [[full,'Fully correct'],[part,part?('Partially correct (avg '+ (part? (Math.round(partSum/part*100)/100).toFixed(2):'—')+')'):'Partially correct'],[zero,'Fully incorrect'],[skippedUn,'Skipped, never answered (excluded)'],[notReached,'Not reached (excluded)']].forEach(function(c){
    var s=nd('div','stat');
    s.appendChild(nd('div','n',''+c[0]));
    s.appendChild(nd('div','l',esc(c[1])));
    sg.appendChild(s);
  });
  var panel=nd('div','panel');
  panel.appendChild(nd('h2',null,'📊 Score breakdown'));
  panel.appendChild(sg);
  panel.appendChild(nd('p','pauseStats','⏱ Time used: '+fmt(EX.timeSec-S.timeLeft)+' of '+fmt(EX.timeSec)+
    ' · ☕ Paused manually: '+Math.round(S.pManMs/1000)+' s · ⏸ Paused for feedback review: '+Math.round(S.pAutoMs/1000)+' s'));
  if(skippedUn>0){panel.appendChild(nd('p','p','ℹ️ '+skippedUn+' skipped exercise(s) were never answered and are excluded from both the score and the total.'));}
  w.appendChild(panel);

  var ftr=nd('div','panel');
  ftr.appendChild(nd('h2',null,'🔄 What now?'));
  if(!passed){
    var rb=mkbtn('Retake Exam ↻','bigBtn');
    rb.addEventListener('click',retake);
    ftr.appendChild(rb);
    ftr.appendChild(nd('p','p','The retake reshuffles all questions and answer choices, resets the timer and your score.'));
  }else{
    ftr.appendChild(nd('p','p','You can retake this tier any time — questions and choices reshuffle on every attempt. The next tier up is a harder batch on the same tactic.'));
    var rb2=mkbtn('Retake Exam ↻','hbtn');
    rb2.addEventListener('click',retake);
    ftr.appendChild(rb2);
  }
  w.appendChild(ftr);
  m.appendChild(w);
}
function endExam(reason){
  document.body.classList.remove('manually-paused');
  if(S.pauseKind){leavePause();}
  S.phase='ENDED';S.endedBy=reason;
  renderResults();updHdr();
  reportOnce();
}
function retake(){
  S=newState();
  gid('ovl').className='';
  S.phase='RUNNING';S.idx=0;
  renderExercise();updHdr();
}

/* ============ website integration ============ */
function reportOnce(){
  if(S.reported){return;}
  S.reported=true;
  var answered=0,sum=0;
  S.ex.forEach(function(i){if(i.graded){answered++;sum+=i.credit;}});
  var percent=answered>0?Math.round((sum/answered)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EX.topicId,
      batch:EX.batch,
      score:Math.round(sum),
      total:answered,
      percent:percent,
      passed:percent>=EX.passMark
    },location.origin);
  }catch(e){/* opened directly, not in an iframe — nothing to report to */}
}
window.addEventListener('message',function(ev){
  if(!ev.data){return;}
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT'){return;}
  try{
    S.userName=ev.data.username||S.userName;
    var w=gid('welcome');
    if(w){w.textContent=S.userName||'—';}
  }catch(e){}
});

/* ============ timer tick (single state machine) ============ */
function tick(){
  if(!S){return;}
  if(S.phase==='RUNNING'){
    S.timeLeft--;
    var i=curEx();
    if(i&&i.d.timebox&&!i.graded&&i.tbLeft>0){
      i.tbLeft--;
      var c=document.querySelector('.tbchip');
      if(c){c.textContent=i.tbLeft>0?('⏱ Time box for this exercise: '+fmt(i.tbLeft)):'⏱ Time box over — take the time you need';}
    }
    if(S.timeLeft<=0){S.timeLeft=0;endExam('time');return;}
    updHdr();
  }
}

/* ============ boot ============ */
function boot(){
  S=newState();
  gid('hTitle').textContent=EX.title;
  var b=gid('hBadge');
  b.className='badge '+EX.sevCls;
  b.innerHTML='<span class="dot"></span>'+esc(EX.sevLabel);
  gid('btnPause').addEventListener('click',doPause);
  gid('btnHint').addEventListener('click',doHint);
  gid('btnSkip').addEventListener('click',doSkip);
  renderIntro();updHdr();
  TICKH=setInterval(tick,1000);
}
boot();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
