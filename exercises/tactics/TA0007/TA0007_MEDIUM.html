<script>
var EXAM = {"title": "TA0007 Discovery \u2014 MEDIUM", "topicId": "ta0007", "batch": 2, "passMark": 70, "timeSec": 1800, "metaMinutes": 30, "sevLabel": "MEDIUM", "sevCls": "medium", "sevBlurb": "<b>Tier 2 \u2014 MEDIUM:</b> every exercise combines two connected ideas (recognise the behaviour, then choose the correct action or mapping). Scenarios are realistic SOC/IR work.", "about": "\n<p><b>What you will learn.</b> This exam trains one part of the MITRE ATT&amp;CK framework. ATT&amp;CK is a big catalogue that describes what real attackers do. This part is a <b>Tactic</b>. Its ID is <b>TA0007</b>. Its name is <b>Discovery</b>. A tactic answers one question: what does the attacker want to achieve at this moment? Discovery means: the attacker wants to learn about your environment.</p>\n<p><b>Imagine you are the attacker for a moment.</b> You already have access to one computer inside a company. What do you want to know before you act? Which other computers exist? Which users and groups exist? Who has power (admin rights)? Which servers run which services? Which shared folders can you open? Which cloud resources can you reach with the keys you have? Discovery is the tactic that answers these questions. It is homework: attackers do it to make every later step cheaper, faster and quieter.</p>\n<p><b>Discovery is not Reconnaissance.</b> Reconnaissance (TA0043) happens <i>before</i> the attacker gets in: they scan your public systems from outside and read public information. Discovery (TA0007) happens <i>after</i> the attacker is inside: they run commands on machines you own. This difference is the number one exam trap \u2014 and the number one ticket mistake.</p>\n<p><b>Where you will use this in real work:</b></p>\n<ul>\n<li><b>SOC analysts</b> see Discovery alerts every day: <code>net user</code>, <code>ipconfig /all</code>, <code>nltest</code>, <code>adfind</code>, <code>nmap</code>. Your job is to decide: real attacker, or normal admin work?</li>\n<li><b>Incident responders</b> use Discovery artefacts to scope intrusions: which hosts, which accounts, how far did they get?</li>\n<li><b>Threat hunters</b> build hypotheses from Discovery behaviour: one host touching 180 hosts on port 445 in five minutes is a hunt, not a hunch.</li>\n<li><b>Detection engineers</b> turn Discovery behaviour into analytics: they pick data sources (process command lines, flow logs, AD audit, cloud audit), write thresholds, and tune out the false positives.</li>\n<li><b>CTI analysts</b> map published group reports (APT29, FIN6, Conti) to Discovery techniques so detections become reusable.</li>\n<li><b>Red teamers</b> run Discovery to show what an attacker could learn \u2014 and how much noise it makes.</li>\n<li><b>GRC and control owners</b> reduce what the environment tells an attacker: least privilege, network segmentation, clean cloud permissions.</li>\n</ul>\n<p><b>The risks it addresses.</b> Discovery steals nothing and breaks nothing \u2014 that is exactly why it is easy to ignore. But it is the step before privilege escalation, lateral movement, ransomware and theft. If you catch Discovery, you stop the attack while it is still cheap to stop.</p>\n", "keywords": [{"theme": "Adversary objective", "items": "Learn the environment from inside: hosts, accounts, groups, shares, services, trusts, cloud assets. Output feeds the next technique choice."}, {"theme": "Lifecycle position", "items": "TA0007 comes after the first foothold. Contrast: Reconnaissance (TA0043) is pre-access and victim-external."}, {"theme": "Host techniques", "items": "T1033 (whoami/quser), T1082 (systeminfo), T1012 (reg query), T1057 (tasklist), T1087 (accounts), T1069 (groups), T1201 (net accounts), T1615 (gpresult), T1652 (driverquery), T1497 (sandbox checks)."}, {"theme": "Network techniques", "items": "T1016 (ipconfig, route print), T1018 (nltest /dclist:, nbtstat, ping sweep), T1046 (port scans), T1049 (netstat, arp -a), T1135 (net view, Get-SmbShare), T1482 (nltest /trusted_domains)."}, {"theme": "Cloud & container", "items": "T1580 (aws ec2 describe-instances, iam list-roles), T1137 (kubectl get pods, auth can-i)."}, {"theme": "Attacker tooling", "items": "net, nltest, dsquery, adfind, PowerView, SharpHound/BloodHound, nmap, Advanced IP Scanner, kubectl, cloud CLI (aws/az)."}, {"theme": "Data sources & telemetry", "items": "Process creation with command line, network flow/firewall logs, AD/LDAP audit (4662), Windows Registry, cloud audit (CloudTrail), container audit logs, logon sessions."}, {"theme": "Detection & analytics", "items": "Scan-rate thresholds, LDAP enumeration spikes, native tools on wrong tiers, parent-process lineage, first-ever per host, false positives (scanners, admins, monitoring) and suppression discipline."}, {"theme": "Mitigations & limits", "items": "Hard to prevent \u2014 detection-first. Segmentation caps scan reach; least privilege caps enumeration value; IAM denies cap cloud visibility."}, {"theme": "Real-world behaviour", "items": "APT29 used ADFIND for AD enumeration; FIN6 used net commands; Conti/Wizard Spider used Advanced IP Scanner and SharpHound before ransomware."}], "instructions": ["This exam has <b>16 exercises</b>. You see one exercise at a time. Types in this file: alert-triage tables, multiple choice, drag &amp; drop (technique placement), multi-select, branching scenarios, matching, fill-in-the-blank, ordering / ranking, and a fake terminal (simulation only).", "The <b>pass mark is 70%</b> \u2014 computed over the exercises you actually answer.", "<b>Partial credit:</b> exercises with several correct items are scored per item: <code>credit = max(0, (correct \u2212 wrong) / items)</code>. Wrong picks subtract. Example: 3 correct and 1 wrong out of 5 items \u2192 (3\u22121)/5 = 0.40. Feedback shows each item as \u2713 Correct, \u2717 Wrong or \u25cb Missed.", "<b>Hints:</b> one hint per exercise, costs 10% of that exercise\u2019s credit (clamped at zero). Hints never reveal the answer.", "<b>Skipping:</b> every exercise has a Skip button. Skipped exercises move to a review pool; before finishing you can return and answer them as often as you like while the timer runs. Skipped-and-never-answered exercises are excluded from both the score and the total.", "<b>Timer:</b> a countdown runs while you work (30 minutes). The <b>Pause</b> button is a manual break \u2014 the exercise hides until you press Resume. Pressing <b>Check</b> stops the timer automatically (state \u201c\u23f8 PAUSED \u2014 reviewing feedback\u201d) so you can study the explanation without pressure; the timer restarts only when you press <b>Next</b> \u2014 or <b>Final Submit</b> on the last exercise. The header always shows the timer state.", "<b>Scoring:</b> the live score in the header counts fractional credits (for example 8.4 / 11). At the end you get a full breakdown and a pass/fail verdict.", "<b>Retake:</b> failed exams can be retaken; every attempt reshuffles question order and answer choices."], "exercises": [{"id": "MED-01", "type": "grid", "summary": "SOC queue: label four process alerts", "scenario": ["Morning SOC shift, 08:05. The EDR queue holds four process alerts from the night and the morning. Classify each row by picking the behaviour it shows. Pick the technique when it is Discovery, or \u201cbenign\u201d when the context says expected activity."], "question": "Classify each of the four alert rows.", "rows": [{"label": "02:31 \u00b7 APP-SRV-02 \u00b7 systeminfo.exe (parent: cmd.exe, user: srv-installer)", "opts": ["System Information Discovery (T1082)", "Account Discovery (T1087)", "Benign \u2014 expected activity"], "ok": 0, "why": "systeminfo prints hardware, OS and patch data of the local host \u2014 that is T1082, whatever account ran it."}, {"label": "09:14 \u00b7 IT-OPS-07 \u00b7 net.exe group \"Domain Admins\" /domain (user: j.smith, AD admin)", "opts": ["Account Discovery (T1087)", "Permission Groups Discovery (T1069)", "Benign \u2014 expected activity"], "ok": 1, "why": "The command enumerates the MEMBERS of a group, so it is T1069. T1087 would list accounts themselves \u2014 a classic near-miss."}, {"label": "03:02 \u00b7 DMZ-WEB-01 \u00b7 nmap -sT -p 22,80,443,3389 10[.]0[.]7[.]0/24 (parent: powershell)", "opts": ["Network Service Scanning (T1046)", "Query Registry (T1012)", "Benign \u2014 expected activity"], "ok": 0, "why": "A nmap sweep from a DMZ host against an internal subnet is service scanning \u2014 and highly suspicious from a web server."}, {"label": "12:40 \u00b7 FIN-WS-31 \u00b7 excel.exe quarterly_report.xlsx (user: m.jones)", "opts": ["Network Service Scanning (T1046)", "Process Discovery (T1057)", "Benign \u2014 expected activity"], "ok": 2, "why": "A user opening a spreadsheet is normal office work \u2014 no Discovery behaviour at all."}], "hint": "Step 1: what does the command PRINT? Step 2: does the context (host, user, time) look normal?", "ansText": "R1 T1082 \u00b7 R2 T1069 (group members, not accounts) \u00b7 R3 T1046 \u00b7 R4 benign.", "expl": ["Two-step triage: first read what the command does, then read the context around it.", "R1: systeminfo \u2192 T1082. R2: the object is a GROUP, so T1069 Permission Groups Discovery \u2014 choosing T1087 is the classic near-miss. R3: nmap across a subnet \u2192 T1046. R4: Excel with a file name is daily office life.", "<b>Defender note:</b> the same binary can be benign or hostile \u2014 the parent process, the host role and the hour decide."], "study": "Write down your top-10 Discovery commands and the exact technique each maps to."}, {"id": "MED-02", "type": "qcm", "summary": "Ticket #6120 \u2014 net group on a SQL server", "scenario": ["<b>ARTEFACT 1 \u2014 EDR alert</b><br><code>SRV-DB-03 \u00b7 23:47 \u00b7 net.exe group \"Domain Admins\" /domain \u00b7 parent: powershell.exe (no console session)</code>", "<b>ARTEFACT 2 \u2014 CMDB note</b><br><code>SRV-DB-03 = production SQL server. No interactive admin work approved. No scheduled task should touch AD.</code>"], "question": "Which answer pairs the correct technique with the correct first action?", "opts": ["T1069 Permission Groups Discovery \u2014 open an incident and trace how powershell started", "T1087 Account Discovery \u2014 close the alert as expected admin work on the server", "T1046 Network Service Scanning \u2014 block port 445 on SRV-DB-03 and wait", "T1135 Network Share Discovery \u2014 reboot SRV-DB-03 into safe mode tonight"], "ok": [0], "why": {"0": "The command lists group members (T1069) and the context (unapproved parent on a DB box) demands an investigation, not a close.", "1": "The CMDB note says no admin work is approved here \u2014 \u201cexpected admin work\u201d is contradicted by your own data.", "2": "Blocking 445 may break production SQL traffic and does not address how the process started.", "3": "The evidence shows AD enumeration, not share listing \u2014 and rebooting destroys volatile evidence."}, "hint": "First decide WHAT was enumerated (accounts or a group?). Then decide what a good first action is for an unexplained parent process.", "ansText": "T1069 + open an incident and trace the powershell parent chain.", "expl": ["Step 1 \u2014 name the behaviour: \u201cnet group X /domain\u201d enumerates group MEMBERSHIP \u2192 T1069 Permission Groups Discovery.", "Step 2 \u2014 choose the action: an unapproved powershell on a production SQL server is the real alarm. Trace parents, collect the script, check persistence \u2014 before any disruptive action.", "<b>Attacker view:</b> Domain Admin membership is the shortest shopping list for privilege escalation."], "study": "Parent-process analysis: net.exe from powershell.exe from what? Follow the chain to the entry point."}, {"id": "MED-03", "type": "slots", "summary": "Place six techniques \u2014 two neighbour tactics included", "scenario": ["Six technique cards are on the table. Drag each onto its tactic column. Watch out: two of them are NOT Discovery, even though they often appear in the same intrusion timeline."], "question": "Drag each card onto the tactic column where it belongs.", "bank": [{"id": "b1", "t": "T1046 \u2014 Network Service Scanning"}, {"id": "b2", "t": "T1615 \u2014 Group Policy Discovery"}, {"id": "b3", "t": "T1110 \u2014 Brute Force"}, {"id": "b4", "t": "T1021.001 \u2014 Remote Desktop Protocol"}, {"id": "b5", "t": "T1005 \u2014 Data from Local System"}, {"id": "b6", "t": "T1087 \u2014 Account Discovery"}], "slots": [{"label": "TA0007 \u2014 Discovery", "accept": ["b1", "b2", "b6"], "why": "Scanning (T1046), reading Group Policy (T1615) and listing accounts (T1087) all only collect knowledge."}, {"label": "TA0006 \u2014 Credential Access", "accept": ["b3"], "why": "Brute Force tries passwords until one works \u2014 it steals access rather than learning the map."}, {"label": "TA0008 \u2014 Lateral Movement", "accept": ["b4"], "why": "Using RDP moves the attacker onto another host \u2014 movement, not enumeration."}, {"label": "TA0009 \u2014 Collection", "accept": ["b5"], "why": "T1005 copies files from a system \u2014 collecting data, not collecting knowledge about the environment."}], "hint": "Ask: does this technique COLLECT knowledge, STEAL access, MOVE the actor, or GATHER data?", "ansText": "Discovery: T1046, T1615, T1087 \u00b7 Brute Force \u2192 Credential Access \u00b7 RDP \u2192 Lateral Movement \u00b7 T1005 \u2192 Collection.", "expl": ["Discovery techniques only answer questions about the environment. They do not guess passwords (T1110), do not move the attacker (T1021.001) and do not copy data (T1005).", "Why the confusion is common: brute force, RDP and file collection often come right after Discovery in a timeline \u2014 but each serves a different goal.", "<b>Defender note:</b> classify the tactic correctly in tickets; the response playbook differs (credential response vs containment vs DLP)."], "study": "Learn the neighbour tactics by their verbs: learn (Discovery), steal (Credential Access), move (Lateral Movement), gather (Collection)."}, {"id": "MED-04", "type": "multi", "summary": "Which three data sources catch T1046?", "scenario": ["Your detection engineering team designs coverage for T1046 Network Service Scanning. Not every data source can see a scan."], "question": "Select the THREE data sources that can catch T1046.", "opts": ["Network/flow connection logs showing one source with many destinations", "Process creation logs showing a scanning tool with its arguments", "Windows print spooler service event logs on hosts", "LDAP query audit logs for group membership changes", "EDR network events showing one process opening many TCP connections"], "ok": [0, 1, 4], "why": {"0": "A scan is, at network level, one source touching many destination ports/hosts \u2014 flow and firewall logs show exactly that.", "1": "The scanner itself is a process: command-line logging records tools like nmap or masscan with their flags.", "2": "The print spooler has nothing to do with connection sweeps.", "3": "LDAP logs show directory queries (T1087/T1069/T1482), not TCP port sweeps.", "4": "EDR sees per-process network behaviour: one process opening dozens of sockets is a scan signature."}, "hint": "A scan lives in two worlds at once: as network connections AND as a process. Which sources watch those two worlds?", "ansText": "Flow/firewall connection logs, process creation logs, and EDR per-process network events.", "expl": ["T1046 produces two kinds of telemetry: network (many connections) and host (the scanning process). Pick sources from both worlds and the scan is caught even if one layer is muted.", "The wrong options fail cleanly: printer logs watch a different subsystem; LDAP logs watch directory reads that accompany a scan but are not the scan itself.", "<b>Real-work link:</b> when you write a detection, list its data sources first \u2014 then check they are actually collected."], "study": "For every technique you detect, write: data sources \u2192 fields \u2192 threshold \u2192 known false positives."}, {"id": "MED-05", "type": "steps", "summary": "IR mini-case: PC-FIN-08 looks around", "scenario": ["You are the on-call IR analyst. Finance reports odd behaviour on PC-FIN-08. EDR shows three new processes in the last 10 minutes: <code>whoami</code>, <code>nltest /dclist:corp.local</code>, <code>net view \\\\FIN-DC01</code>. Work through the three steps; your choices are graded together on the final Check."], "question": "Answer all three steps of the response workflow.", "steps": [{"ctx": "Step 1 \u2014 the user asks what is going on.", "q": "What kind of activity is this?", "opts": ["Discovery \u2014 the actor is mapping the domain and its shares", "Exfiltration \u2014 data is already leaving the company", "Benign \u2014 Windows runs these commands by itself every day"], "ok": 0, "why": "All three commands answer questions about the environment (who am I, where are DCs, which shares exist) \u2014 the Discovery trio."}, {"ctx": "Step 2 \u2014 you must choose the next move while the host is still live.", "q": "Which next step is best?", "opts": ["Isolate PC-FIN-08 from the network and start timeline collection", "Email every employee to change all passwords immediately", "Wait a week and see whether the behaviour repeats"], "ok": 0, "why": "Containment plus evidence collection is the standard early move; mass password resets destroy evidence trails and a week of waiting lets the attacker move on."}, {"ctx": "Step 3 \u2014 your lead asks for a one-line case note.", "q": "Which sentence belongs in the note?", "opts": ["Host ran domain- and share-discovery commands; isolated and under forensic collection", "Host was hit by ransomware; all data encrypted", "Nothing happened; case closed without findings"], "ok": 0, "why": "The note must state the observed behaviour (Discovery commands) and the action taken (isolation + collection) \u2014 nothing more, nothing less."}], "hint": "Follow the classic rhythm: classify \u2192 contain & collect \u2192 document.", "ansText": "S1 Discovery \u00b7 S2 isolate + collect \u00b7 S3 factual note with behaviour and action.", "expl": ["Step 1: whoami / nltest /dclist / net view are textbook Discovery (T1033, T1018, T1135). No data leaves the network, so not exfiltration; these commands never run \u201cby themselves\u201d.", "Step 2: early Discovery means the attacker is still mapping \u2014 isolate early, collect volatile evidence, keep options open.", "Step 3: IR notes stay factual and short: behaviour + action + time. Speculation (ransomware) without evidence does not belong in a ticket.", "<b>Defender note:</b> this workflow \u2014 classify, contain, document \u2014 is the skeleton of every Discovery alert response."], "study": "Practise the three-sentence IR note: what happened, what you did, what you need."}, {"id": "MED-06", "type": "pairs", "summary": "Match five attacker tools to their techniques", "scenario": ["You review a captured attacker toolkit. Match each tool or command to the Discovery technique it performs. One option on the right is a decoy and stays unused."], "question": "Match each item on the left to its technique.", "left": [{"id": "l1", "t": "Get-NetUser (PowerView module)", "ok": "r1", "why": "PowerView\u2019s Get-NetUser enumerates domain users \u2014 Domain Account Discovery."}, {"id": "l2", "t": "nltest /trusted_domains", "ok": "r2", "why": "This switch asks the domain for its TRUSTS \u2014 Domain Trust Discovery (T1482)."}, {"id": "l3", "t": "Get-ADGroupMember \"Domain Admins\"", "ok": "r3", "why": "It prints the members of a group \u2014 Permission Groups Discovery (Domain Groups)."}, {"id": "l4", "t": "kubectl get pods -A", "ok": "r4", "why": "It lists pods across the cluster \u2014 Pod Discovery under Container and Resource Discovery."}], "right": [{"id": "r1", "t": "T1087.002 \u2014 Domain Account Discovery"}, {"id": "r2", "t": "T1482 \u2014 Domain Trust Discovery"}, {"id": "r3", "t": "T1069.002 \u2014 Domain Groups Discovery"}, {"id": "r4", "t": "T1137.003 \u2014 Pod Discovery"}, {"id": "r5", "t": "T1580 \u2014 Cloud Infrastructure Discovery"}], "hint": "User list, trust list, group members, pod list \u2014 one card on the right is bait.", "ansText": "Get-NetUser \u2192 T1087.002 \u00b7 nltest /trusted_domains \u2192 T1482 \u00b7 Get-ADGroupMember \u2192 T1069.002 \u00b7 kubectl get pods \u2192 T1137.003.", "expl": ["Each tool answers one question: which users exist (T1087.002)? Which domains trust each other (T1482)? Who is in this group (T1069.002)? Which pods run in Kubernetes (T1137.003)?", "T1580 is the decoy: it is Discovery too, but for CLOUD infrastructure via cloud APIs \u2014 none of the four left items query a cloud API.", "<b>Real-work link:</b> CTI analysts map exactly these tool-to-technique pairs when they read malware reports."], "study": "PowerView and SharpHound commands: learn the five most common and their IDs."}, {"id": "MED-07", "type": "blanks", "summary": "Complete a CTI report excerpt", "scenario": ["You are a CTI analyst finishing a short report. Fill the four blanks from the word bank so the ATT&CK mapping is correct."], "question": "Fill all four blanks.", "text": "The intrusion set used adfind.exe to enumerate users and groups. In ATT&CK this is ___ Discovery (T1087). Minutes earlier they swept internal ranges with nmap, mapped as ___ (T1046). Detection should watch for adfind on ___ hosts, where admins rarely run it, and treat nmap from ___ servers as a high-signal alert.", "bankw": ["Account", "Impact", "Network Service Scanning", "workstation", "server", "Exfiltration"], "ans": ["Account", "Network Service Scanning", "server", "workstation"], "blankWhy": ["adfind listing users and groups maps to Account Discovery (T1087).", "nmap range sweeps map to Network Service Scanning (T1046).", "adfind is admin tooling; its appearance on a SERVER, where nobody does daily AD admin work, is the anomaly.", "nmap coming FROM a workstation/server is inverted: normal scanners are dedicated scan hosts, so scans FROM servers/workstations are the alert."], "hint": "Blank 1 and 2 are technique names; blank 3 and 4 are host types. Think \u201cwhere is this tool normal, where is it odd?\u201d", "ansText": "Account \u00b7 Network Service Scanning \u00b7 server \u00b7 workstation.", "expl": ["CTI reports become useful when behaviour is mapped to ATT&CK IDs \u2014 that is what makes detections reusable across teams.", "adfind \u2192 T1087 Account Discovery; nmap sweeps \u2192 T1046. The context rule: tools are suspicious on the hosts that never normally run them. adfind belongs on admin workstations; nmap belongs on dedicated scanners.", "So: alert on adfind on servers, and on nmap from workstations or servers \u2014 not from the sanctioned scan host."], "study": "Turn one CTI report per week into three detection ideas \u2014 that is how CTI feeds detection engineering."}, {"id": "MED-08", "type": "order", "summary": "Order the attacker\u2019s discovery chain", "scenario": ["One attacker session on a beachhead host produced five logged actions. Put them into the order a methodical attacker follows when mapping an environment."], "question": "Order the five actions from first to last.", "items": ["Runs systeminfo and ipconfig /all on the beachhead host (T1082, T1016)", "Lists active connections with netstat -ano (T1049)", "Finds reachable servers with nltest /dclist: (T1018)", "Enumerates domain groups with net group /domain (T1069)", "Runs SharpHound to collect the full AD relationship graph (T1087 collection)"], "itemWhy": ["Local facts first: what machine am I on, what network card does it have?", "Then live connections: which hosts and sessions are active right now?", "Then the domain skeleton: where are the domain controllers?", "Then people and power: which groups exist and who is in them?", "The heavy graph collection comes last \u2014 it needs the domain context the earlier steps provided."], "hint": "Small \u2192 wide \u2192 heavy: own host, own connections, domain servers, domain people, full graph.", "ansText": "systeminfo/ipconfig \u2192 netstat \u2192 nltest /dclist: \u2192 net group /domain \u2192 SharpHound.", "expl": ["Attackers escalate the width of their discovery: local machine \u2192 local connections \u2192 domain structure \u2192 domain people \u2192 full graph.", "Each step depends on the previous one. SharpHound output is far more useful once the actor knows which DCs and groups matter.", "<b>Defender view:</b> this progression gives you an early window \u2014 the first three steps already fire alerts if command-line logging is on."], "study": "Hunt for the progression pattern, not only for single commands \u2014 chains beat one-offs."}, {"id": "MED-09", "type": "qcm", "summary": "Malware refuses to run in the lab", "scenario": ["A malware sample you are analysing refuses to execute its payload in the sandbox lab. Before running, the dropper performs three checks: CPU core count below 2? System uptime below 10 minutes? Were office documents opened in the last days? If any answer says \u201canalysis machine\u201d, it sleeps."], "question": "Which ATT&CK technique describes these checks, and why does the malware perform them?", "opts": ["T1497 Virtualization/Sandbox Evasion \u2014 it probes for signs of an analysis machine", "T1082 System Information Discovery \u2014 it builds a hardware inventory for later", "T1614 System Location Discovery \u2014 it looks up the physical office location", "T1201 Password Policy Discovery \u2014 it checks password rules before executing"], "ok": [0], "why": {"0": "CPU count, uptime and recent user activity are the classic sandbox fingerprints \u2014 the checks exist to evade analysis.", "1": "The data is collected for a decision (run or hide), not to report an inventory anywhere.", "2": "Nothing here asks about language or location \u2014 core count and uptime say nothing about geography.", "3": "No password policy is queried; the checks are about the MACHINE, not about accounts."}, "hint": "Ask what the malware DOES with the answers. \u201cRun or hide?\u201d points to one technique.", "ansText": "T1497 Virtualization/Sandbox Evasion \u2014 Discovery-style checks used to detect and dodge analysis environments.", "expl": ["Interesting fact: T1497 lives in two tactics \u2014 Discovery AND Defense Evasion. The information gathering is Discovery-like; the purpose is evasion.", "Sandboxes are strong machines with fresh clocks and no human activity. Low CPU count, young uptime, empty recent documents = probably a lab.", "<b>Defender note:</b> hardened sandboxes fake these signals (many cores, aged uptime, seeded user files) to force execution."], "study": "T1497 sub-techniques: .001 System Checks, .002 User Activity Based Checks, .003 Time Based Evasion."}, {"id": "MED-10", "type": "term", "summary": "Terminal \u2014 established connections with owning process", "scenario": ["You are triaging host FIN-WS-19 (Windows). The EDR console lets you run read-only commands on the host. You must see which TCP connections are <b>ESTABLISHED right now</b> and <b>which process owns each one</b>. netstat is installed."], "question": "Build the netstat command that shows only established connections with owning process IDs.", "cmd": {"prompt": "PS FIN-WS-19> ", "note": "<b>Intent</b> \u2014 you need: established connections only, plus the owning process ID. The base command is netstat; you add what the goal requires. (A filter helper like findstr is allowed.)", "elements": [{"name": "the netstat tool", "re": "\\bnetstat(\\.exe)?\\b", "why": "netstat is the built-in Windows tool for active connections."}, {"name": "process-ID output (-o, or combined -ano)", "re": "(-ano\\b|-o\\b)", "why": "-o adds the owning PID column; -a and -n keep all states in numeric form."}, {"name": "filter for ESTABLISHED", "re": "established", "why": "Only ESTABLISHED lines show live sessions; LISTENING lines are a different question."}], "danger": [{"re": "\\b(kill|ta       var b=mkbtn('<span class="ol">'+String.fromCharCode(65+ix)+'.</span><span class="ot">'+esc(o.t)+'</span>','opt'+(i.stepAns[k]===ix?' on':''));

        b.classList.add('on');b.setAttribute('aria-pressed','true');

    nb.addEventListener('click',function(){
      if(i.stepAns[k]==null){setFlash('Choose an option for this step first.');return;}
      setFlash('');
      i.rstep++;

function buildWidget(i){
  switch(i.d.type){
    case 'qcm':return wOptions(i,false);

/* ============ grading: max(0,(H−W)/N) ============ */
function gradeEx(i){
  var d=i.d,ans=i.readFn();
  var items=[],N=0,H=0,W=0;
  function ok(l,why){H++;items.push({st:'ok',l:l,why:why});}
  function bad(l,why){W++;items.push({st:'bad',l:l,why:why});}
  function miss(l,why){items.push({st:'miss',l:l,why:why});}
  var k,oi;
  if(d.type==='qcm'){
    N=1;
    if(ans==null){miss('No option chosen','You did not answer. The correct answer is shown below.');}
    else{
      var ro=i.ropts[ans];
      var lbl='Option '+String.fromCharCode(65+ans)+': '+ro.t;
      if(ro.ok){ok(lbl,ro.why||d.ansText);}
      else{bad(lbl,ro.why||'This option does not match the scenario.');}
    }
  }else if(d.type==='multi'){
    var sel={};(ans||[]).forEach(function(x){sel[x]=1;});
    i.ropts.forEach(function(o,ix){
      var chosen=sel[ix]===1;
      if(o.ok){
        if(chosen){ok(o.t,o.why||'This item is part of the correct answer.');}
        else{miss(o.t,o.why||'This item is part of the correct answer.');}
      }else if(chosen){bad(o.t,o.why||'This item is not part of the correct answer.');}
    });
    N=i.ropts.filter(function(o){return o.ok;}).length;
  }else if(d.type==='slots'){
    /* item-centric: every bank item must land in the one slot that accepts it.
       Slots that accept nothing ("stay empty" columns) need no item — placing one there is wrong. */
    N=i.rbank.length;
    i.rbank.forEach(function(b){
      var placedSi=-1,correctSi=-1;
      for(var s=0;s<i.place.length;s++){if(i.place[s].indexOf(b.id)>=0){placedSi=s;break;}}
      for(var s2=0;s2<i.rslots.length;s2++){if(i.rslots[s2].accept.indexOf(b.id)>=0){correctSi=s2;break;}}
      var where=placedSi>=0?i.rslots[placedSi].label:'(left in the bank)';
      var lbl=b.t+' → '+where;
      if(placedSi===correctSi){ok(lbl,i.rslots[correctSi].why);}
      else if(placedSi>=0){bad(lbl,findBankWhy(i,b.id)||('This item belongs in “'+i.rslots[correctSi].label+'”: '+i.rslots[correctSi].why));}
      else{miss(lbl+' — correct target: '+i.rslots[correctSi].label,i.rslots[correctSi].why);}
    });
  }else if(d.type==='order'){
    N=i.ritems.length;
    for(var p=0;p<i.ritems.length;p++){
      var id=ans[p];
      var oi2=parseInt(String(id).replace('o',''),10);
      var txt='';
      for(var z2=0;z2<i.ritems.length;z2++){if(i.ritems[z2].id===id){txt=i.ritems[z2].t;break;}}
      if(id===('o'+p)){ok('Position '+(p+1)+': '+txt,d.itemWhy[p]);}
      else{bad('Position '+(p+1)+': '+txt+' — it belongs at position '+(oi2+1),d.itemWhy[oi2]);}
    }
  }else if(d.type==='pairs'){
    N=i.rleft.length;
    i.rleft.forEach(function(l,ix){
      var v=ans[ix]||'';
      var rt='';
      for(var z3=0;z3<i.rright.length;z3++){if(i.rright[z3].id===v){rt=i.rright[z3].t;break;}}
      if(v===l.ok){ok(l.t+' → '+rt,l.why);}
      else if(v){bad(l.t+' → '+rt,l.why);}
      else{miss(l.t+' → (no match chosen)',l.why);}
    });
  }else if(d.type==='blanks'){
    N=i.d.ans.length;
    for(var b2=0;b2<i.d.ans.length;b2++){
      var v2=ans[b2]||'';
      if(v2===i.d.ans[b2]){ok('Blank '+(b2+1)+': '+v2,i.d.blankWhy[b2]);}
      else if(v2){bad('Blank '+(b2+1)+': “'+v2+'” — the correct word is “'+i.d.ans[b2]+'”',i.d.blankWhy[b2]);}
      else{miss('Blank '+(b2+1)+' → (empty). Correct word: “'+i.d.ans[b2]+'”',i.d.blankWhy[b2]);}
    }
  }else if(d.type==='grid'){
    N=i.rrows.length;
    i.rrows.forEach(function(r,ix){
      var v=ans[ix];
      if(v==null||v<0){miss('R'+(ix+1)+': '+r.label+' → (no classification). Correct: “'+r.ropts.filter(function(o){return o.ok;})[0].t+'”',r.why);}
      else if(r.ropts[v].ok){ok('R'+(ix+1)+': '+r.label+' → '+r.ropts[v].t,r.why);}
      else{bad('R'+(ix+1)+': '+r.label+' → '+r.ropts[v].t,r.why);}
    });
  }else if(d.type==='term'){
    var nc=String(ans||'').toLowerCase().replace(/\s+/g,' ').trim();
    var els=(i.d.cmd&&i.d.cmd.elements)||[];
    N=els.length;
    if(!nc){
      /* an empty command answers nothing: every element counts as missed, no 'avoided' credit */
      els.forEach(function(e){
        miss(e.name+' → (no command entered)',e.why);
      });
    }else{
    els.forEach(function(e){
      var hit=new RegExp(e.re,'i').test(nc);
      if(e.not){
        if(hit){bad('You used: '+e.name,e.why);}
        else{ok('Avoided: '+e.name,e.why);}
      }else{
        if(hit){ok(e.name,e.why);}
        else{miss(e.name,e.why);}
      }
    });
    }
  }else if(d.type==='steps'){
    N=i.rsteps.length;
    i.rsteps.forEach(function(st,si){
      var v=ans[si];
      var correctOpt=null;
      st.ropts.forEach(function(o){if(o.ok){correctOpt=o;}});
      if(v==null){miss('Step '+(si+1)+': no choice recorded. Correct: “'+(correctOpt?correctOpt.t:'?')+'”',st.why);}
      else if(st.ropts[v]&&st.ropts[v].ok){ok('Step '+(si+1)+' choice: '+st.ropts[v].t,st.why);}
      else if(st.ropts[v]){bad('Step '+(si+1)+' choice: '+st.ropts[v].t+' — correct: “'+(correctOpt?correctOpt.t:'?')+'”',st.why);}
      else{miss('Step '+(si+1)+': no choice recorded. Correct: “'+(correctOpt?correctOpt.t:'?')+'”',st.why);}
    });
  }
  var credit0=clamp01((H-W)/N);
  var credit=(i.hintUsed?Math.max(0,credit0-0.10):credit0);
  return {credit:credit,credit0:credit0,items:items,N:N,H:H,W:W,ans:ans};
}
function findBankWhy(i,id){
  for(var z=0;z<i.rbank.length;z++){if(i.rbank[z].id===id&&i.rbank[z].whyNot){return i.rbank[z].whyNot;}}
  return '';
}

/* ============ pause accounting ============ */
function enterPause(kind){S.pauseKind=kind;S.pauseStart=Date.now();}
function leavePause(){
  if(S.pauseKind&&S.pauseStart){
    var dt=Date.now()-S.pauseStart;
    if(S.pauseKind==='manual'){S.pManMs+=dt;}else{S.pAutoMs+=dt;}
  }
  S.pauseKind=null;S.pauseStart=0;
}

/* ============ header ============ */
function updHdr(){
  var prog=gid('hprog'),st=gid('hstate'),tm=gid('htimer'),sc=gid('hscore');
  if(!prog){return;}
  if(S.phase==='INTRO'){prog.textContent='Read the briefing, then start';}
  else if(S.phase==='ENDED'){prog.textContent='Results';}
  else if(S.reviewing!=null){prog.textContent='Reviewing skipped exercise '+(S.reviewing+1);}
  else if(S.onReviewList){prog.textContent='Review skipped ('+S.skipPool.length+' in pool)';}
  else{prog.textContent='Exercise '+(S.idx+1)+' of '+S.ex.length;}
  var cls='hstate ',txt='';
  if(S.phase==='INTRO'){cls+='running';txt='⏱ READY — timer starts on Start';}
  else if(S.phase==='RUNNING'){cls+='running';txt='▶ RUNNING';}
  else if(S.phase==='PAUSED_MANUAL'){cls+='pman';txt='⏸ PAUSED — manual (press Resume)';}
  else if(S.phase==='PAUSED_AUTO_CHECK'){cls+='pauto';txt='⏸ PAUSED — reviewing feedback (resumes on Next)';}
  else{cls+='ended';txt='⏹ ENDED';}
  st.className=cls;st.textContent=txt;
  tm.textContent=fmt(S.timeLeft);
  var sum=Math.round(S.creditSum*10)/10;
  var pc=S.answered>0?Math.round((S.creditSum/S.answered)*100):0;
  sc.textContent=S.answered>0?('Score '+sum.toFixed(1)+' / '+S.answered+' · '+pc+'%'):'Score —';
  var bH=gid('btnHint'),bS=gid('btnSkip'),bP=gid('btnPause');
  var i=curEx();
  bH.disabled=!(S.phase==='RUNNING'&&i&&!i.graded&&!i.hintUsed);
  bS.disabled=!(S.phase==='RUNNING'&&i&&!i.graded&&S.reviewing==null);
  bP.disabled=!(S.phase==='RUNNING'||S.phase==='PAUSED_AUTO_CHECK');
}

  if(!i.graded){cb=mkbtn('Check ✓','checkBtn');cb.addEventListener('click',doCheck);}
  else if(S.reviewing!=null){cb=mkbtn('Back to review list ▶','checkBtn');cb.addEventListener('click',doNext);}
  else if(S.idx<S.ex.length-1){cb=mkbtn('Next ▶','checkBtn');cb.addEventListener('click',doNext);}
  else{cb=mkbtn('Final Submit ✓','checkBtn');cb.addEventListener('click',doNext);}
  ftr.appendChild(cb);
  var fl=nd('span','flash');fl.id='flash';ftr.appendChild(fl);
  card.appendChild(ftr);

  /* feedback */
  var fbHolder=nd('div');
  fbHolder.id='fbholder';
  card.appendChild(fbHolder);
  if(i.graded&&i.g){renderFeedback(fbHolder,i,i.g);}

  m.appendChild(card);
  window.scrollTo(0,0);
}

/* ============ feedback ============ */
function renderFeedback(holder,i,g){
  var d=i.d;
  var isSingle=(d.type==='qcm');
  var label,cls,icon;
  if(g.credit>=1){label=isSingle?'CORRECT':'CORRECT';cls='ok';icon='✓';}
  else if(g.credit>0){label='PARTIALLY CORRECT';cls='part';icon='✓';}
  else{label='INCORRECT';cls='bad';icon='✗';}
  var fb=nd('div','fb '+cls);
  fb.appendChild(nd('div','fb-h',icon+' '+label));
  var b=nd('div','fb-b');
  if(!isSingle){
    b.appendChild(nd('div','creditLine','credit '+g.credit.toFixed(2)+' — '+g.H+'/'+g.N+' items counted'+(i.hintUsed&&g.credit0>0?' (hint −0.10 applied)':'')));
  }else if(i.hintUsed&&g.credit0>0){
    b.appendChild(nd('div','creditLine','hint −0.10 applied to this exercise’s credit'));
  }
  b.appendChild(nd('div','ansLine','<b>Correct answer:</b> '+esc(d.ansText)));
  var exWrap=nd('div','expl');
  d.expl.forEach(function(p){exWrap.appendChild(nd('p',null,p));});
  b.appendChild(exWrap);
  if(d.type==='term'){
    b.appendChild(nd('div',null,'<b>Canonical command (copyable):</b>'));
    b.appendChild(nd('div','copyBlock',esc(d.cmd.canonical)));
    (d.cmd.elements||[]).forEach(function(e){
      var line='• <b>'+esc(e.name)+'</b> — '+esc(e.why);
      b.appendChild(nd('div','p',line));
    });
    (d.cmd.danger||[]).forEach(function(dg){
      b.appendChild(nd('div','p','⚠ <b>Dangerous near-miss:</b> '+esc(dg.msg)));
    });
  }
  if(!isSingle&&g.items.length){
    var box=nd('div','items');
    g.items.forEach(function(it){
      var ic=it.st==='ok'?'✓':(it.st==='bad'?'✗':'○');
      var wd=it.st==='ok'?'Correct':(it.st==='bad'?'Wrong':'Missed');
      var r=nd('div','itm '+it.st,'<span class="ic">'+ic+'</span><span><b>'+wd+' — '+esc(it.l)+'</b><br>'+esc(it.why)+'</span>');
      box.appendChild(r);
    });
    b.appendChild(box);
  }
  if(d.study){b.appendChild(nd('div','study','📚 What to study next: '+esc(d.study)));}
  fb.appendChild(b);
  holder.appendChild(fb);
}

/* ============ flow: check / next / skip / hint / pause ============ */
function doCheck(){
  var i=curEx();
  if(!i||i.graded){return;}
  /* FIRST ACTION: stop the timer by entering the auto-check pause state */
  if(S.phase==='RUNNING'){enterPause('auto');}
  S.phase='PAUSED_AUTO_CHECK';
  var g=gradeEx(i);
  i.g=g;i.graded=true;i.credit=g.credit;i.answered=true;
  S.creditSum+=g.credit;S.answered++;
  renderExercise();updHdr();
}
function doNext(){
  var i=curEx();
  if(!i||!i.graded){return;}
  leavePause();
  if(S.reviewing!=null){
    S.reviewing=null;S.phase='RUNNING';
    renderReview();updHdr();
    return;
  }
  if(S.idx<S.ex.length-1){S.idx++;S.phase='RUNNING';renderExercise();updHdr();}
  else if(S.skipPool.length){S.phase='RUNNING';renderReview();updHdr();}
  else{endExam('submit');}
}
function doSkip(){
  var i=curEx();
  if(!i||i.graded||i.skipped||S.reviewing!=null||S.phase!=='RUNNING'){return;}
  i.skipped=true;
  S.skipPool.push(S.idx);
  if(S.idx<S.ex.length-1){S.idx++;renderExercise();}
  else if(S.skipPool.length){renderReview();}
  else{endExam('submit');}
  updHdr();
}
function doHint(){
  var i=curEx();
  if(!i||i.graded||i.hintUsed){return;}
  i.hintUsed=true;i.hintShown=true;
  renderExercise();updHdr();
}
function doPause(){
  if(S.phase==='RUNNING'||S.phase==='PAUSED_AUTO_CHECK'){
    S.resumeTo=(S.phase==='PAUSED_AUTO_CHECK')?'PAUSED_AUTO_CHECK':null;
    if(S.phase==='RUNNING'){enterPause('manual');}
    else{leavePause();enterPause('manual');} /* bank the auto time so far; the break counts as manual */
    S.phase='PAUSED_MANUAL';
    renderOverlay();updHdr();
  }
}
function doResume(){
  leavePause();
  S.phase=S.resumeTo||'RUNNING';
  S.resumeTo=null;
  if(S.phase==='PAUSED_AUTO_CHECK'){enterPause('auto');} /* keep counting feedback-review time */
  gid('ovl').className='';
  document.body.classList.remove('manually-paused');
  if(S.phase==='RUNNING'){renderExercise();}
  updHdr();
}
function renderOverlay(){
  var o=gid('ovl');
  o.className='show';
  document.body.classList.add('manually-paused');
  o.innerHTML='<div class="ovlCard"><div style="font-size:44px">☕</div><h2>Manual pause</h2>'+
    '<p>The timer is stopped and the exercise is hidden. Take a real break.</p>'+
    '<p style="font-size:13.5px;color:#9aa8bd">Press Resume when you are ready. Your answer (if you made one) is kept.</p>'+
    '<button class="bigBtn" id="btnResume">Resume ▶</button></div>';
  gid('btnResume').addEventListener('click',doResume);
}

/* ============ review skipped ============ */
function renderReview(){
  var m=gid('main');
  m.innerHTML='';
  S.onReviewList=true;
  var w=nd('div','panel');
  w.appendChild(nd('h2',null,'🔁 Review skipped exercises'));
  w.appendChild(nd('p','p','Time left: <b>'+fmt(S.timeLeft)+'</b>. You can answer skipped exercises as many times as you need until the timer ends, or submit now. Skipped-and-never-answered exercises are excluded from your score.'));
  S.skipPool.forEach(function(exIdx){
    var inst=S.ex[exIdx];
    var row=nd('div','revRow');
    row.appendChild(nd('div','revT','<b>Exercise '+(exIdx+1)+'</b> — '+esc(inst.d.summary||inst.d.question)));
    if(inst.graded){
      row.appendChild(nd('span','revTag done','✓ Answered — credit '+inst.credit.toFixed(2)));
    }else{
      row.appendChild(nd('span','revTag excl','⚠ NOT ANSWERED — EXCLUDED'));
      var b=mkbtn('Answer ▶','hbtn');
      b.addEventListener('click',function(){
        S.reviewing=exIdx;S.idx=exIdx;S.phase='RUNNING';
        renderExercise();updHdr();
      });
      row.appendChild(b);
    }
    w.appendChild(row);
  });
  var ftr=nd('div','ftr');
  var sb=mkbtn('Submit exam & see results ✓','bigBtn');
  sb.addEventListener('click',function(){leavePause();endExam('submit');});
  ftr.appendChild(sb);
  w.appendChild(ftr);
  m.appendChild(w);
}

/* ============ results ============ */
function renderResults(){
  var m=gid('main');
  m.innerHTML='';
  var answered=0,sum=0,full=0,part=0,zero=0,partSum=0,skippedUn=0,notReached=0;
  S.ex.forEach(function(i){
    if(i.graded){
      answered++;sum+=i.credit;
      if(i.credit>=1){full++;}
      else if(i.credit>0){part++;partSum+=i.credit;}
      else{zero++;}
    }else if(i.skipped){skippedUn++;}
    else{notReached++;}
  });
  var percent=answered>0?Math.round((sum/answered)*100):0;
  var passed=percent>=EX.passMark;
  var w=nd('div');
  var hero=nd('div','resHero '+(passed?'pass':'fail'));
  hero.appendChild(nd('div',null,passed?'🏆':'📉'));
  hero.appendChild(nd('div','big',percent+'% — '+(passed?'PASS':'FAIL')));
  hero.appendChild(nd('p','p',passed
    ?('You reached the pass mark of '+EX.passMark+'%. Well done — you mastered this tier of TA0007 Discovery.')
    :('You needed '+EX.passMark+'% over the exercises you answered. You must retake this exam to pass the tier.')));
  hero.appendChild(nd('p','p','<b>Topic:</b> '+esc(EX.title)+' · <b>Score:</b> '+(Math.round(sum*10)/10).toFixed(1)+' / '+answered+' answered'));
  if(S.userName){hero.appendChild(nd('p','p','<b>Learner:</b> '+esc(S.userName)));}
  w.appendChild(hero);

  var sg=nd('div','statGrid');
  [[full,'Fully correct'],[part,part?('Partially correct (avg '+ (part? (Math.round(partSum/part*100)/100).toFixed(2):'—')+')'):'Partially correct'],[zero,'Fully incorrect'],[skippedUn,'Skipped, never answered (excluded)'],[notReached,'Not reached (excluded)']].forEach(function(c){
    var s=nd('div','stat');
    s.appendChild(nd('div','n',''+c[0]));
    s.appendChild(nd('div','l',esc(c[1])));
    sg.appendChild(s);
  });
  var panel=nd('div','panel');
  panel.appendChild(nd('h2',null,'📊 Score breakdown'));
  panel.appendChild(sg);
  panel.appendChild(nd('p','pauseStats','⏱ Time used: '+fmt(EX.timeSec-S.timeLeft)+' of '+fmt(EX.timeSec)+
    ' · ☕ Paused manually: '+Math.round(S.pManMs/1000)+' s · ⏸ Paused for feedback review: '+Math.round(S.pAutoMs/1000)+' s'));
  if(skippedUn>0){panel.appendChild(nd('p','p','ℹ️ '+skippedUn+' skipped exercise(s) were never answered and are excluded from both the score and the total.'));}
  w.appendChild(panel);

  var ftr=nd('div','panel');
  ftr.appendChild(nd('h2',null,'🔄 What now?'));
  if(!passed){
    var rb=mkbtn('Retake Exam ↻','bigBtn');
    rb.addEventListener('click',retake);
    ftr.appendChild(rb);
    ftr.appendChild(nd('p','p','The retake reshuffles all questions and answer choices, resets the timer and your score.'));
  }else{
    ftr.appendChild(nd('p','p','You can retake this tier any time — questions and choices reshuffle on every attempt. The next tier up is a harder batch on the same tactic.'));
    var rb2=mkbtn('Retake Exam ↻','hbtn');
    rb2.addEventListener('click',retake);
    ftr.appendChild(rb2);
  }
  w.appendChild(ftr);
  m.appendChild(w);
}
function endExam(reason){
  document.body.classList.remove('manually-paused');
  if(S.pauseKind){leavePause();}
  S.phase='ENDED';S.endedBy=reason;
  renderResults();updHdr();
  reportOnce();
}
function retake(){
  S=newState();
  gid('ovl').className='';
  S.phase='RUNNING';S.idx=0;
  renderExercise();updHdr();
}

/* ============ website integration ============ */
function reportOnce(){
  if(S.reported){return;}
  S.reported=true;
  var answered=0,sum=0;
  S.ex.forEach(function(i){if(i.graded){answered++;sum+=i.credit;}});
  var percent=answered>0?Math.round((sum/answered)*100):0;
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EX.topicId,
      batch:EX.batch,
      score:Math.round(sum),
      total:answered,
      percent:percent,
      passed:percent>=EX.passMark
    },location.origin);
  }catch(e){/* opened directly, not in an iframe — nothing to report to */}
}
window.addEventListener('message',function(ev){
  if(!ev.data){return;}
  if(ev.data.type!=='CYBERPULSE_INIT'&&ev.data.type!=='CYBERMASTERY_INIT'){return;}
  try{
    S.userName=ev.data.username||S.userName;
    var w=gid('welcome');
    if(w){w.textContent=S.userName||'—';}
  }catch(e){}
});

/* ============ timer tick (single state machine) ============ */
function tick(){
  if(!S){return;}
  if(S.phase==='RUNNING'){
    S.timeLeft--;
    var i=curEx();
    if(i&&i.d.timebox&&!i.graded&&i.tbLeft>0){
      i.tbLeft--;
      var c=document.querySelector('.tbchip');
      if(c){c.textContent=i.tbLeft>0?('⏱ Time box for this exercise: '+fmt(i.tbLeft)):'⏱ Time box over — take the time you need';}
    }
    if(S.timeLeft<=0){S.timeLeft=0;endExam('time');return;}
    updHdr();
  }
}

/* ============ boot ============ */
function boot(){
  S=newState();
  gid('hTitle').textContent=EX.title;
  var b=gid('hBadge');
  b.className='badge '+EX.sevCls;
  b.innerHTML='<span class="dot"></span>'+esc(EX.sevLabel);
  gid('btnPause').addEventListener('click',doPause);
  gid('btnHint').addEventListener('click',doHint);
  gid('btnSkip').addEventListener('click',doSkip);
  renderIntro();updHdr();
  TICKH=setInterval(tick,1000);
}
boot();
})();

</script>
<!-- cm-beacon: reports this attempt when the batch runs outside the hub -->
<script>
(function(){
  if (window.parent !== window) { return; }              /* inside the hub, exam-hub reports it */
  var m = /\/exercises\/(.+\.html)$/.exec(location.pathname);
  if (!m || !window.fetch) { return; }
  var path = 'exercises/' + m[1];
  var sent = false;
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
    if (!d || (d.type !== 'CYBERPULSE_SCORE' && d.type !== 'CYBERMASTERY_SCORE')) { return; }
    if (sent) { return; }
    var pct = (typeof d.percent === 'number') ? d.percent
      : ((typeof d.score === 'number' && typeof d.total === 'number' && d.total > 0)
          ? Math.round(d.score / d.total * 100) : null);
    if (pct === null) { return; }
    sent = true;
    fetch('https://cpa-engagement.marzouk-souhaieb.workers.dev/event', {
      method: 'POST', mode: 'cors', credentials: 'omit', keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        path: path, topicId: String(d.topicId || ''), percent: pct,
        passed: (typeof d.passed === 'boolean') ? d.passed : pct >= 70
      })
    })['catch'](function () { sent = false; });
  }, false);
})();
</script>
