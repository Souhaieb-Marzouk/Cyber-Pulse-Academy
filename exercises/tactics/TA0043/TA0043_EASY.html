/* Is a required element present in the typed command?
   Flags (-p, -sV, -Pn) must match as an exact token, or as a token that continues
   into a non-letter (so -p22,80 counts for -p, but -Pn does NOT count for -p).
   Non-flags (tool, host, ports) match as an exact token, or as a substring of the
   joined command when the element is at least 4 characters (tolerates a trailing dot). */
function elementFound(e, low, joined, lowEq){
  if(e.charAt(0)==='-'){
    for(var i=0;i<low.length;i++){
      var tok=low[i];
      if(tok===e){ return true; }
      if(tok.indexOf(e)===0){
        var rest=tok.slice(e.length);
        if(rest==='' || !/[a-z]/.test(rest.charAt(0))){ return true; }
      }
    }
    return false;
  }
  /* numeric port lists compare as unordered sets: 3389,443,80,22 == 22,80,443,3389 */
  if(/^\d+(,\d+)*$/.test(e)){
    for(var n=0;n<low.length;n++){
      if(/^\d+(,\d+)*$/.test(low[n])){
        var pa=e.split(','), pb=low[n].split(',');
        if(pa.length===pb.length && pa.slice().sort().join(',')===pb.slice().sort().join(',')){ return true; }
      }
    }
  }
  if(low.indexOf(e)>=0){ return true; }
  if(lowEq && lowEq.indexOf(e)>=0){ return true; }
  if(e.length>=4 && joined.indexOf(e)>=0){ return true; }
  return false;
}
function gradeTerminal(ex, cmd){
  var t=ex.term;
  var res={ sel:[], extras:[], cmd:cmd||'' };
  if(!cmd || !cmd.trim()){ return res; }
  var toks=cmd.trim().replace(/\s+/g,' ').split(' ');
  var low=toks.map(function(x){return x.toLowerCase();});
  var joined=low.join(' ');
  /* tokens split on '=' so nslookup's -type=mx form exposes the 'mx' element */
  var lowEq=[];
  for(var q=0;q<low.length;q++){ var seg=low[q].split('='); for(var q2=0;q2<seg.length;q2++){ if(seg[q2]){ lowEq.push(seg[q2]); } } }
  /* alternative tool names (e.g. host/nslookup instead of dig) satisfy the tool element, which must be element 0 */
  var els=t.els;
  var toolAltHit=false;
  if(t.toolAlts){
    for(var a=0;a<t.toolAlts.length;a++){ if(low.indexOf(t.toolAlts[a].toLowerCase())>=0){ toolAltHit=true; } }
  }
  for(var i=0;i<els.length;i++){
    var e=els[i].toLowerCase();
    var found=elementFound(e, low, joined, lowEq);
    if(!found && i===0 && t.toolAlts && toolAltHit){ found=true; }
    if(found){ res.sel.push(els[i]); }
  }
  var tolerance = ex.tol || 'hard'; /* easy|medium|hard */
  var allowList = (ex.allow || []).map(function(x){return String(x).toLowerCase();});
  var toolNames = (t.tool || []).map(function(x){return String(x).toLowerCase();});
  for(var k=0;k<toks.length;k++){
    var tok=low[k];
    if(tokenCovered(tok, t.els)){ continue; }
    if(toolNames.indexOf(tok)>=0){ continue; } /* alternative tool names are never 'unexpected parts' */
    if(allowedToken(tok, allowList)){ continue; }
    if(tolerance==='easy'){ continue; }
    if(tolerance==='medium' && tok.charAt(0)!=='-'){ continue; }
    res.extras.push(toks[k]);
  }
  return res;
}
function allowedToken(tok, allowList){
  for(var i=0;i<allowList.length;i++){
    var a=allowList[i];
    if(tok===a){ return true; }
    if(a.charAt(a.length-1)==='=' && tok.indexOf(a)===0){ return true; }
  }
  return false;
}
function tokenCovered(tok, els){
  for(var i=0;i<els.length;i++){
    var e=els[i].toLowerCase();
    if(tok===e){ return true; }
    if(e.charAt(0)==='-' && tok.indexOf(e)===0){
      var rest=tok.slice(e.length);
      if(rest==='' || !/[a-z]/.test(rest.charAt(0))){ return true; }
    }
    if(e.charAt(0)!=='-' && e.length>=4 && tok.indexOf(e)>=0){ return true; }
  }
  return false;
}

/* ---------- correct sets per type ---------- */
function getCorrect(ex, ws){
  switch(ex.type){
    case 'qcm': case 'multi': return ex.correct;
    case 'dnd': var c=[]; for(var i=0;i<ex.chips.length;i++){ c.push(ex.chips[i].id+':'+ex.sol[ex.chips[i].id]); } return c;
    case 'order': var o=[]; for(var j=0;j<ex.items.length;j++){ o.push(j+':'+(j+1)); } return o;
    case 'match': var m=[]; for(var k=0;k<ex.sol.length;k++){ m.push(k+':'+ex.sol[k]); } return m;
    case 'fill': return ws.correctSet();
    case 'triage': var t=[]; for(var r=0;r<ex.rows.length;r++){ t.push(r+':'+ex.rows[r].correct); } return t;
    case 'branch': var b=[]; for(var s=0;s<ex.steps.length;s++){ b.push(s+':'+ex.steps[s].correct); } return b;
    case 'terminal': return ex.term.els;
  }
  return [];
}

/* ---------- Check (first action: auto-pause the timer) ---------- */
function onCheck(){
  var ex=S.current;
  if(!ex || S.answered[ex.id]){ return; }
  if(T.state==='RUNNING'){ timerSet('PAUSED_AUTO_CHECK'); }
  var ws=S.widgetState[ex.id];
  var selArr, cor=getCorrect(ex, ws), credit, extraW=0;
  if(ex.type==='terminal'){
    var res=ws.getSelection();
    ws._res=res;
    selArr=res.sel;
    extraW=res.extras.length;
    credit=Math.max(0,(selArr.length-extraW)/cor.length);
  } else {
    selArr=ws.getSelection();
    credit=scoreExercise(selArr, cor);
  }
  if(S.hintUsed[ex.id]){ credit=Math.max(0, credit-0.10); }
  S.credits[ex.id]=credit;
  S.answered[ex.id]=true;
  if(ws.lock){ ws.lock(); }
  $('b-check').style.display='none';
  var bN=$('b-next'); bN.style.display='inline-block'; bN.textContent=nextLabel();
  $('b-hint').disabled=true; $('b-skip').disabled=true;
  renderFeedback(ex, ws, selArr, cor, credit, extraW);
  renderScore();
}
function nextLabel(){
  var rem=0;
  for(var i=0;i<S.order.length;i++){
    var e=S.order[i];
    if(!S.answered[e.id] && S.skippedIds.indexOf(e.id)<0){ rem++; }
  }
  if(rem>0){ return 'Next →'; }
  if(S.skippedIds.length>0){ return 'Review skipped →'; }
  return 'Final Submit ⏭';
}

/* ---------- feedback block ---------- */
function itemRow(status, text){
  var li=el('li');
  var st=el('span','st '+(status==='ok'?'st-ok':(status==='bad'?'st-bad':'st-miss')),
    status==='ok'?'✓ Correct':(status==='bad'?'✗ Wrong':'○ Missed'));
  li.appendChild(st);
  li.appendChild(el('span',null,text));
  return li;
}
function renderFeedback(ex, ws, selArr, cor, credit, extraW){
  var slot=$('fb-slot'); slot.innerHTML='';
  var multi = cor.length>1 || ex.type==='terminal';
  var cls, label, icon;
  if(credit>=0.9999){ cls='fb-ok'; label='CORRECT'; icon='✓'; }
  else if(credit>0){ cls='fb-part'; label='PARTIALLY CORRECT'; icon='✓'; }
  else { cls='fb-bad'; label='INCORRECT'; icon='✗'; }
  var fb=el('section','fb '+cls);
  var fh=el('div','fb-h');
  fh.appendChild(el('span',null,icon));
  fh.appendChild(el('span',null,label));
  fb.appendChild(fh);
  var body=el('div','fb-body');
  if(multi){
    var foundCount = ex.type==='terminal'? selArr.length : (function(){ var h=0; for(var i=0;i<selArr.length;i++){ if(cor.indexOf(selArr[i])>=0){h++;} } return h; })();
    var wrongCount = ex.type==='terminal'? extraW : (selArr.length-foundCount);
    var missedCount = Math.max(0, cor.length-foundCount);
    var cl=el('p','creditline','Credit '+ (Math.round(credit*100)/100).toFixed(2) +' — '+foundCount+'/'+cor.length+' items found, '+wrongCount+' wrong, '+missedCount+' missed.');
    body.appendChild(cl);
    body.appendChild(el('p','mini','Per-item scoring: (correct items − wrong items) ÷ correct items. Wrong selections subtract, so guessing everything gives zero.'));
  }
  var list=el('ul','itemlist');
  fbItems(ex, ws, selArr).forEach(function(it){ list.appendChild(itemRow(it.s, it.t)); });
  body.appendChild(list);
  if(S.hintUsed[ex.id]){
    body.appendChild(el('p','mini','Hint used on this exercise: −0.10 credit (applied before this label).'));
  }
  for(var p=0;p<ex.explain.length;p++){ para(body, ex.explain[p]); }
  if(ex.type==='terminal'){
    var t=ex.term;
    var cw=el('div','canon');
    cw.appendChild(el('div','canon-l','Canonical command:'));
    var pre=el('pre','code'); pre.textContent=t.canonical;
    var cbw=el('div','copybar');
    var cb=el('button','copy-btn','Copy'); 
    cb.addEventListener('click', function(){
      try{ var ta=document.createElement('textarea'); ta.value=t.canonical; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); cb.textContent='Copied ✓'; }
      catch(e){ cb.textContent='Select and copy manually'; }
    });
    cbw.appendChild(cb);
    cw.appendChild(pre); cw.appendChild(cbw);
    body.appendChild(cw);
    var pl=el('ul','itemlist');
    for(var pi=0;pi<t.parts.length;pi++){ var li2=el('li'); li2.appendChild(el('span',null,t.parts[pi])); pl.appendChild(li2); }
    body.appendChild(pl);
    var typedCmd = ws.typedCmd? ws.typedCmd() : (ws._res&&ws._res.cmd? ws._res.cmd : '');
    if(t.bad && typedCmd){
      var lowNc=typedCmd.toLowerCase().replace(/\s+/g,'');
      for(var bi=0;bi<t.bad.length;bi++){
        if(lowNc.indexOf(t.bad[bi].m.toLowerCase())>=0){
          var warn=el('div','banner','⚠ '+t.bad[bi].note);
          body.appendChild(warn);
        }
      }
    }
    if(!typedCmd || !typedCmd.trim()){
      body.appendChild(el('p','mini','You did not run or submit a command. Type it in the terminal, then press Check.'));
    }
  }
  if(ex.study){
    var sb=el('div','studybox');
    sb.appendChild(el('b',null,'What to study next: '));
    sb.appendChild(document.createTextNode(ex.study));
    body.appendChild(sb);
  }
  fb.appendChild(body);
  slot.appendChild(fb);
}

/* ---------- per-item breakdown ---------- */
function inSel(sel, x){ return sel.indexOf(x)>=0; }
function fbItems(ex, ws, sel){
  var out=[];
  if(ex.type==='qcm'||ex.type==='multi'){
    for(var i=0;i<ex.opts.length;i++){
      var o=ex.opts[i];
      var isCor=ex.correct.indexOf(o.k)>=0;
      var picked=inSel(sel,o.k);
      if(isCor&&picked){ out.push({s:'ok',t:o.t}); }
      else if(isCor&&!picked){ out.push({s:'miss',t:o.t}); }
      else if(!isCor&&picked){ out.push({s:'bad',t:o.t}); }
    }
  } else if(ex.type==='dnd'){
    for(var c=0;c<ex.chips.length;c++){
      var chip=ex.chips[c];
      var wantB=ex.sol[chip.id];
      var gotB=null;
      var key=chip.id+':';
      for(var s=0;s<sel.length;s++){ if(sel[s].indexOf(key)===0){ gotB=sel[s].slice(key.length); } }
      var wantL=bucketLabel(ex,wantB), gotL=gotB&&gotB!=='none'? bucketLabel(ex,gotB): null;
      var txt='“'+chip.t+'” belongs in '+wantL+(gotL? ' — you placed it in '+gotL:' — you left it in the bank')+'.';
      out.push({s: gotB===wantB?'ok':(gotL?'bad':'miss'), t:txt});
    }
  } else if(ex.type==='order'){
    for(var i2=0;i2<ex.items.length;i2++){
      var wantP=i2+1;
      var gotP=-1;
      var key2=i2+':';
      for(var s2=0;s2<sel.length;s2++){ if(sel[s2].indexOf(key2)===0){ gotP=parseInt(sel[s2].slice(key2.length),10); } }
      var txt2='“'+ex.items[i2].t+'” — correct position '+wantP+(gotP>0? (gotP===wantP?' (you had it there)':' (you placed it at '+gotP+')'):' (not placed)')+'.';
      out.push({s: gotP===wantP?'ok':(gotP>0?'bad':'miss'), t:txt2});
    }
  } else if(ex.type==='match'){
    for(var l=0;l<ex.sol.length;l++){
      var wantR=ex.sol[l];
      var gotR=-1;
      var key3=l+':';
      for(var s3=0;s3<sel.length;s3++){ if(sel[s3].indexOf(key3)===0){ gotR=parseInt(sel[s3].slice(key3.length),10); } }
      var txt3='“'+ex.left[l].t+'” ↔ “'+ex.right[wantR].t+'”'+(gotR>=0? (gotR===wantR?'':' — you paired it with “'+ex.right[gotR].t+'”'):' — not paired')+'.';
      out.push({s: gotR===wantR?'ok':(gotR>=0?'bad':'miss'), t:txt3});
    }
  } else if(ex.type==='fill'){
    for(var b=0;b<ex.blanks.length;b++){
      var want=normFill(ex.blanks[b]);
      var got=null;
      var key4=b+':';
      for(var s4=0;s4<sel.length;s4++){ if(sel[s4].indexOf(key4)===0){ got=sel[s4].slice(key4.length); } }
      var alts=(ex.alts&&ex.alts[b]||[]).map(normFill);
      var ok=got===want||alts.indexOf(got)>=0;
      var txt4='Blank '+(b+1)+': “'+ex.blanks[b]+'”'+(got? (ok?'':' — you wrote “'+got+'”'):' — left empty')+'.';
      out.push({s: ok?'ok':(got?'bad':'miss'), t:txt4});
    }
  } else if(ex.type==='triage'){
    for(var r=0;r<ex.rows.length;r++){
      var wantI=ex.rows[r].correct;
      var gotI=-1;
      var key5=r+':';
      for(var s5=0;s5<sel.length;s5++){ if(sel[s5].indexOf(key5)===0){ gotI=parseInt(sel[s5].slice(key5.length),10); } }
      var txt5='Item '+(r+1)+' (“'+ex.rows[r].t.slice(0,80)+(ex.rows[r].t.length>80?'…':'')+'”) → '+ex.opts[wantI]+(gotI>=0? (gotI===wantI?'':' — you chose “'+ex.opts[gotI]+'”'):' — no choice')+'.';
      out.push({s: gotI===wantI?'ok':(gotI>=0?'bad':'miss'), t:txt5});
    }
  } else if(ex.type==='branch'){
    for(var st=0;st<ex.steps.length;st++){
      var wantS=ex.steps[st].correct;
      var gotS=-1;
      var key6=st+':';
      for(var s6=0;s6<sel.length;s6++){ if(sel[s6].indexOf(key6)===0){ gotS=parseInt(sel[s6].slice(key6.length),10); } }
      var txt6='Step '+(st+1)+': best call was “'+ex.steps[st].opts[wantS]+'”'+(gotS>=0? (gotS===wantS?'':' — you chose “'+ex.steps[st].opts[gotS]+'”'):' — no choice')+'.';
      out.push({s: gotS===wantS?'ok':(gotS>=0?'bad':'miss'), t:txt6});
    }
  } else if(ex.type==='terminal'){
    var res=ws._res||{sel:[],extras:[]};
    for(var e=0;e<ex.term.els.length;e++){
      var found=res.sel.indexOf(ex.term.els[e])>=0;
      out.push({s: found?'ok':'miss', t:'Required element: “'+ex.term.els[e]+'”'});
    }
    for(var x=0;x<res.extras.length;x++){
      out.push({s:'bad', t:'Unexpected part: “'+res.extras[x]+'”'});
    }
  }
  return out;
}
function bucketLabel(ex,id){
  for(var i=0;i<ex.buckets.length;i++){ if(ex.buckets[i].id===id){ return ex.buckets[i].label; } }
  return id;
}

/* ---------- review skipped screen ---------- */
function renderReview(){
  var root=$('scr-review'); root.innerHTML='';
  var w=el('div','wrap');
  w.appendChild(el('h1',null,'Review skipped exercises'));
  para(w,'These are the exercises you skipped. You can go back to any of them and answer it. The timer is still running. You can repeat this as often as you like until the timer ends or you submit.');
  para(w,'If you submit while exercises are still skipped, they are excluded from your score: they do not count as correct, they do not count as wrong, and they are not added to the total possible score.','mini');
  var hc=$('h-count'); if(hc){ hc.textContent='Review — '+S.skippedIds.length+' skipped'; }
  for(var i=0;i<S.skippedIds.length;i++){
    (function(i){
      var ex=byId(S.skippedIds[i]);
      var row=el('div','review-row');
      row.appendChild(el('span','t', ex.title));
      var b=el('button','btn btn-mini btn-primary','Return ▶');
      b.addEventListener('click', function(){
        var ix=S.skippedIds.indexOf(ex.id);
        if(ix>=0){ S.skippedIds.splice(ix,1); }
        S.current=ex; S.idx=S.order.indexOf(ex);
        T.subActive=!!ex.subTimer; T.subRemaining=ex.subTimer? ex.subTimer:0;
        showScreen('exam');
        renderExercise();
      });
      row.appendChild(b);
      w.appendChild(row);
    })(i);
  }
  var bar=el('div','startbar');
  var fin=el('button','btn btn-danger','Submit final result ⏭');
  fin.addEventListener('click', function(){ finishExam(false); });
  bar.appendChild(fin);
  var note=el('span','mini','Unanswered skipped exercises stay excluded from the score.');
  bar.appendChild(note);
  w.appendChild(bar);
  root.appendChild(w);
  showScreen('review');
}
function byId(id){
  for(var i=0;i<EXAM.exercises.length;i++){ if(EXAM.exercises[i].id===id){ return EXAM.exercises[i]; } }
  return null;
}

/* ---------- results ---------- */
function finishExam(fromTimeout){
  if(S.finished){ return; }
  T.subActive=false;
  document.body.classList.remove('paused-exam');
  $('pause-overlay').hidden=true;
  timerSet('ENDED');
  S.finished=true;
  renderResults(fromTimeout);
  showScreen('results');
  reportScoreOnce();
}
function renderResults(fromTimeout){
  var root=$('scr-results'); root.innerHTML='';
  var cs=creditSum(), n=answeredCount();
  var pct = n>0? Math.round((cs/n)*100) : 0;
  var passed = n>0 && pct>=EXAM.passMark;
  var full=0, part=0, zero=0, partSum=0;
  for(var k in S.credits){
    var c=S.credits[k];
    if(c>=0.9999){ full++; }
    else if(c>0){ part++; partSum+=c; }
    else { zero++; }
  }
  var w=el('div','wrap');
  var hero=el('div','card results-hero');
  hero.appendChild(el('h1',null,'Results — '+EXAM.entityId+' '+EXAM.entityName));
  hero.appendChild(severityBadge());
  var sb=el('div','score-big '+(passed?'pass':'fail'), pct+'%');
  hero.appendChild(sb);
  para(hero,'Answered '+n+' of '+EXAM.exercises.length+' exercises · '+ (Math.round(cs*10)/10) +' credit points · pass mark '+EXAM.passMark+'%.');
  if(fromTimeout){ para(hero,'Time ran out. Exercises you never answered were excluded from this score.','mini'); }
  if(passed){
    var cert=el('div','cert');
    cert.appendChild(el('div','ct','PRACTICE CERTIFICATE'));
    cert.appendChild(el('div','cn',(S.username? S.username : 'Learner')+' — PASS'));
    para(cert, EXAM.entityId+' '+EXAM.entityName+' — '+EXAM.sevLabel+' tier (tier '+EXAM.batch+' of 4)');
    para(cert, 'Score '+pct+'% · attempt '+S.attempt+' · '+new Date().toLocaleDateString());
    hero.appendChild(cert);
    para(hero,'Well done. Move on to the next tier when you feel ready.');
  } else {
    var fp=el('div','banner');
    fp.style.borderColor='var(--red-line)'; fp.style.background='var(--red-bg)'; fp.style.color='var(--red)';
    fp.textContent='✗ Below the pass mark — you must retake this exam. Review the feedback you collected, then try again.';
    hero.appendChild(fp);
  }
  w.appendChild(hero);
  var grid=el('div','res-grid');
  function cell(n_,l_){ var c=el('div','res-cell'); c.appendChild(el('div','n',String(n_))); c.appendChild(el('div','l',l_)); grid.appendChild(c); }
  cell(full,'fully correct (credit 1.0)');
  cell(part, part>0? 'partially correct (avg '+ (part? (Math.round(partSum/part*100)/100).toFixed(2):'—') +')' : 'partially correct');
  cell(zero,'fully incorrect (credit 0)');
  cell(S.skippedIds.length,'skipped, never answered (excluded)');
  w.appendChild(grid);
  var card=el('div','card');
  card.appendChild(el('h2',null,'How your time was spent'));
  para(card,'Manual pauses (your breaks): '+fmtTime(T.manualTotal)+'.');
  para(card,'Feedback review pauses (after pressing Check): '+fmtTime(T.autoTotal)+'. These pauses are unlimited and never cost you score.');
  w.appendChild(card);
  var bar=el('div','startbar');
  var rt=el('button','btn btn-primary','Retake exam ↺');
  rt.addEventListener('click', function(){ S.attempt++; S.reported=false; S.finished=false; startExam(); showScreen('exam'); });
  bar.appendChild(rt);
  var back=el('button','btn','Back to intro');
  back.addEventListener('click', function(){ renderIntro(); });
  bar.appendChild(back);
  w.appendChild(bar);
  root.appendChild(w);
}

/* ---------- website integration (STEP 6) ---------- */
function reportScore(creditSum_, answeredCount_){
  var percent = answeredCount_ > 0
    ? Math.round((creditSum_ / answeredCount_) * 100)
    : 0;
  try {
    parent.postMessage({
      type: 'CYBERPULSE_SCORE',
      topicId: EXAM.topicId,
      batch: EXAM.batch,
      score: Math.round(creditSum_),
      total: answeredCount_,
      percent: percent,
      passed: percent >= EXAM.passMark
    }, location.origin);
  } catch (e) {
    /* Opened directly rather than inside the site. Nothing to report to. */
  }
}
function reportScoreOnce(){
  if(S.reported){ return; }
  S.reported=true;
  reportScore(creditSum(), answeredCount());
}
window.addEventListener('message', function (event) {
  if (!event.data) { return; }
  if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') { return; }
  S.username = event.data.username || '';
  S.country = event.data.country || '';
});

/* ---------- boot ---------- */
var _showScreen = showScreen;
showScreen = function(name){
  _showScreen(name);
  var hdr=$('exam-hdr');
  if(hdr){ hdr.style.display = (name==='exam'||name==='review')? 'block':'none'; }
};
function boot(){
  renderHeader();
  renderIntro();
}
boot();

/* ---------- glue ---------- */
function restoreAnswered(){ /* answered exercises are never re-rendered in this exam flow */ }
function autoCheckOnSubExpire(){
  var ex=S.current;
  if(ex && ex.subTimer && !S.answered[ex.id]){ onCheck(); }
}
