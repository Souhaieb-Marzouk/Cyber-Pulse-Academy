   "Where will you use this in real work? A **SOC analyst** triages its alerts in a SIEM or EDR console. A **threat hunter** looks for quiet log sources and tamper events. An **incident responder** checks which defenses were switched off and how to recover them. A **cyber threat intelligence analyst** maps attacker reports to TA0112 when writing a briefing. A **red teamer** tests whether defenders notice this behaviour. A **detection engineer** writes the rules that catch it. A **GRC analyst or control owner** picks the controls that prevent it, like tamper protection, least privilege, and central log storage.",

swered, it is simply <b>excluded</b> from the score — it does not count as wrong.</p>\n<h3>Retake</h3>\n<p>If you fail, you can retake the exam. Questions and answer options are shuffled again.</p>\n"

    t = t.replace(/(^|[\s(>])\*([^*\n]+)\*(?=$|[\s).,;:!?<])/g, function (m, pre, a) { return pre + '<i>' + a + '</i>'; });
    return t;
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;

  }
  function fmtSecs(s) {
    s = Math.max(0, Math.round(s));

  }
  function fmtLong(secs) {
    secs = Math.round(secs);
    var m = Math.floor(secs / 60), r = secs % 60;
    if (m === 0) return r + ' sec';
    return m + ' min ' + (r < 10 ? '0' : '') + r + ' sec';
  }
  var LOGRE = /(wevtutil|netsh|systemctl|auditctl|bcdedit|bootcfg|certutil|reg add|reg query|reg save|sc config|sc stop|sc query|Stop-Service|Set-Service|Set-NetFirewallProfile|New-NetFirewallRule|Get-NetFirewallRule|Get-WinEvent|Clear-EventLog|Limit-EventLog|DeleteTrail|StopLogging|UpdateTrail|DeleteSink|UpdateSink|DeleteDiagnosticSettings|DisableAntiSpyware|DisableRealtimeMonitoring|safeboot|SafeBoot|HISTFILE|HISTCONTROL|HISTSIZE|HISTFILESIZE|WinDefend|MsMpEng|mpssvc|EventLog|auditd|audisp|rsyslog|journalctl|icacls|takeown|attrib |cacls|mimikatz|dsquery|repadmin|dcsync|sekurlsa|Notepad|PSReadLine|bash_history|sh_history|\.evtx|\.bashrc|audit\.rules|auditpolicies|Cmdlet|wevtutil cl|Set-MpPreference|Add-MpPreference|Uninstall|gpupdate|gpscript|dsmod|net user|net group|net localgroup)/g;
  function fmtLog(text) {
    var lines = esc(text).split('\n');
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      ln = ln.replace(/^(\[[^\]]*\])/,'<span class="ts">$1</span>');
      ln = ln.replace(/^(\d{4}-\d{2}-\d{2}[T ][\d:.Z+-]*)/, '<span class="ts">$1</span>');
      ln = ln.replace(LOGRE, '<span class="hl">$1</span>');
      ln = ln.replace(/(denied|failed|unauthorized|blocked|cleared|stopped|disabled|deleted|deactivated|tamper)/gi, '<span class="warnl">$1</span>');

  /* ---------- state ---------- */
  var S = {
    screen: 'intro',      /* intro | exam | review | results */
    order: [], pos: 0,
    ans: {},              /* per exercise id: current answer */
    flowStep: {},         /* per flow exercise: current step index */
    flowPicks: {},        /* per flow exercise: array of picked option indexes per step */
    credits: {},          /* per exercise id: awarded credit (after hint penalty) */
    checked: {},          /* per exercise id: bool */
    hintUsed: {},
    skipped: [],          /* exercise ids skipped and not yet answered */
    reviewTarget: null,
    timerState: 'IDLE',   /* IDLE | RUNNING | PAUSED_MANUAL | PAUSED_AUTO_CHECK | ENDED */
    remaining: CFG.examSeconds,
    lastTick: 0,
    exRemain: null,       /* per-exercise reduced timer (seconds) */
    pauseManSecs: 0, pauseAutoSecs: 0, pauseMark: null, pauseBeforeManual: null,
    exRemainById: {},     /* per-exercise reduced timer remaining seconds (survives re-render) */
    reported: false,
    username: ''
  };

  /* ---------- scoring ---------- */
  function scoreSet(H, W, N) { return Math.max(0, (H - W) / N); }
  function creditOf(ex) {
    var g = grade(ex);
    var c = g.credit;
    if (S.hintUsed[ex.id]) c = Math.max(0, c - 0.10);
    return c;
  }
  function answeredIds() { return Object.keys(S.credits); }
  function liveScore() {
    var ids = answeredIds(), sum = 0;
    for (var i = 0; i < ids.length; i++) sum += S.credits[ids[i]];
    return { sum: sum, count: ids.length, pct: ids.length ? Math.round((sum / ids.length) * 100) : 0 };
  }

  /* ---------- timer state machine ---------- */
  function setState(st) {
    S.timerState = st;
    renderTimerPill();
  }
  function pauseAutoStart() {
    if (S.timerState === 'ENDED') return;
    S.pauseMark = performance.now();
    setState('PAUSED_AUTO_CHECK');
  }
  function pauseAutoStop() {
    if (S.timerState === 'PAUSED_AUTO_CHECK') {
      if (S.pauseMark) S.pauseAutoSecs += (performance.now() - S.pauseMark) / 1000;
      S.pauseMark = null;
      setState('RUNNING');
    }
  }
  function manualPause() {
    if (S.timerState === 'RUNNING' || S.timerState === 'PAUSED_AUTO_CHECK') {
      S.pauseBeforeManual = S.timerState;
      S.pauseMark = performance.now();
      setState('PAUSED_MANUAL');
      showPauseCover();
    }
  }
  function manualResume() {
    if (S.timerState !== 'PAUSED_MANUAL') return;
    if (S.pauseMark) S.pauseManSecs += (performance.now() - S.pauseMark) / 1000;
    S.pauseMark = null;
    removePauseCover();
    setState(S.pauseBeforeManual || 'RUNNING'); /* returns to RUNNING, or to AUTO_CHECK if paused on top of it */
  }
  function tick() {
    var now = performance.now();
    if (S.timerState === 'RUNNING') {
      var dt = (now - (S.lastTick || now)) / 1000;
      S.remaining -= dt;
      if (S.exRemain !== null && S.exRemain !== undefined) {
        S.exRemain -= dt;
        var exNow = currentEx();
        if (exNow) S.exRemainById[exNow.id] = S.exRemain;
        var pill = $('ex-timer-pill');
        if (pill) pill.style.display = '';
        var pv = $('ex-timer-val');
        if (pv) pv.textContent = fmtSecs(S.exRemain);
        if (S.exRemain <= 0) {
          var ex = currentEx();
          if (ex && !S.checked[ex.id]) { doCheck(); }
          S.exRemain = null;
          if (ex) delete S.exRemainById[ex.id];
          if (pill) pill.style.display = 'none';
        }
      }
      if (S.remaining <= 0) {
        S.remaining = 0;
        setState('ENDED');
        finalizeByTimeout();
        return;
      }
      renderTimerPill();

  }
  function renderTimerPill() {
    var p = $('timer-state');

    var icon = '▶', word = 'RUNNING', cls = 'run', full = 'RUNNING';
    if (S.timerState === 'PAUSED_MANUAL') { icon = '⏸'; word = 'PAUSED'; cls = 'pman'; full = '⏸ PAUSED — manual (press Resume)'; }
    else if (S.timerState === 'PAUSED_AUTO_CHECK') { icon = '⏸'; word = 'PAUSED'; cls = 'pauto'; full = '⏸ PAUSED — reviewing feedback (resumes on Next)'; }
    else if (S.timerState === 'ENDED') { icon = '■'; word = 'ENDED'; cls = 'end'; full = '■ ENDED'; }
    else if (S.timerState === 'IDLE') { icon = '—'; word = 'NOT STARTED'; cls = 'run'; full = 'Timer starts with the exam'; }
    p.className = 'tstate ' + cls;
    p.textContent = full;
    $('timer-val').textContent = fmtSecs(S.remaining);
    $('timer-icon').textContent = icon;
  }

  /* ---------- widgets per type ---------- */
  function buildWidget(host, ex) {
    var d = ex.data || {};
    if (ex.type === 'qcm') return wQCM(host, ex, d, false);
    if (ex.type === 'multi') return wQCM(host, ex, d, true);
    if (ex.type === 'matching') return wMatching(host, ex, d);

    if (ex.type === 'fill') return wFill(host, ex, d);

  function optLetters(i) {
    var L = 'ABCDEFGH';
    return L.charAt(i % 8);
  }

  function wMatching(host, ex, d) {

  function wDragDrop(host, ex, d) {
    if (!S.ans[ex.id]) S.ans[ex.id] = { placed: {}, selChip: null };
    var a = S.ans[ex.id];
    var bank = el('div', 'dragspot');

    var bankLine = el('div', 'slotline');
    bank.appendChild(bankLine);
    var zonesWrap = el('div');
    var chipEls = {};
    function placeOf(cid) { return a.placed[cid] || '__bank__'; }
    function renderAll() {
      bankLine.innerHTML = '';
      for (var z = 0; z < d.zones.length; z++) d.zones[z]._line.innerHTML = '';
      for (var i = 0; i < d.chips.length; i++) {
        var c = d.chips[i];
        var ch = chipEls[c.id];
        var to = placeOf(c.id);
        if (to === '__bank__') bankLine.appendChild(ch);
        else {
          for (var z2 = 0; z2 < d.zones.length; z2++) if (d.zones[z2].id === to) d.zones[z2]._line.appendChild(ch);
        }
      }
    }
    for (var i = 0; i < d.chips.length; i++) {
      (function (c) {
        var ch = el('span', 'chip');
        ch.setAttribute('draggable', 'true');
        ch.setAttribute('tabindex', '0');
        ch.setAttribute('role', 'button');
        ch.innerHTML = md(c.text);
        function chipActivate() {
          if (S.checked[ex.id]) return;
          if (placeOf(c.id) !== '__bank__') {
            delete a.placed[c.id];
            renderAll();
            return;
          }
          a.selChip = (a.selChip === c.id) ? null : c.id;
          for (var k in chipEls) chipEls[k].classList.remove('sel');
          if (a.selChip) ch.classList.add('sel');
        }
        ch.addEventListener('click', chipActivate);
        ch.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') { ev.preventDefault(); chipActivate(); }
        });
        ch.addEventListener('dragstart', function (ev) {
          try { ev.dataTransfer.setData('text/plain', c.id); } catch (e) { }
          a.selChip = c.id;
        });
        chipEls[c.id] = ch;
      })(d.chips[i]);
    }
    function zoneHandler(zid) {
      return function (ev) {
        ev.preventDefault();
        if (S.checked[ex.id]) return;
        var cid = a.selChip;
        if (!cid && ev.dataTransfer) {
          try { cid = ev.dataTransfer.getData('text/plain'); } catch (e) { }
        }
        if (cid) {
          a.placed[cid] = zid;
          a.selChip = null;
          for (var k in chipEls) chipEls[k].classList.remove('sel');

    bank.setAttribute('role', 'button');
    bank.setAttribute('aria-label', 'Item bank — press Enter here to return the selected card to the bank');
    bank.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {

  function wTerminal(host, ex, d) {
    if (!S.ans[ex.id]) S.ans[ex.id] = { typed: '' };

    if (d.syntaxPanel) {
      var sp = el('div', 'synpanel');

      if (d.syntaxPanel.expectedShape) sp.appendChild(el('p', null, '<b>Expected output shape:</b> ' + md(d.syntaxPanel.expectedShape)));
      host.appendChild(sp);

    function run() {
      var v = inp.value.trim();

        var norm = v.toLowerCase().replace(/\s+/g, ' ').trim();

  function wFlow(host, ex, d) {
    if (!S.ans[ex.id]) { S.ans[ex.id] = { picks: [] }; S.flowStep[ex.id] = 0; S.flowPicks[ex.id] = {}; }
    var wrap = el('div');
    host.appendChild(wrap);
    var n = d.steps.length;
    function orderFor(si) {
      var key = 'floworder:' + ex.id + ':' + si;
      if (!S[key]) S[key] = shuffle(d.steps[si].options.map(function (o, i) { return i; }));

    }
    function renderStep() {
      var si = S.flowStep[ex.id];
      wrap.innerHTML = '';

          if (S.flowPicks[ex.id][si] === i) b.classList.add('sel');
          b.addEventListener('click', function () {

  /* ---------- grading ---------- */
  function itG(key, label, text) { return { key: key, label: label, state: 'g', text: text }; }
  function itB(key, label, text) { return { key: key, label: label, state: 'b', text: text }; }
  function itM(key, label, text) { return { key: key, label: label, state: 'm', text: text }; }

  function grade(ex) {
    var d = ex.data || {};
    var a = S.ans[ex.id] || {};
    if (ex.type === 'qcm') {
      var pick = (a.picks && a.picks.length) ? a.picks[0] : -1;
      var correctIdx = -1;
      for (var i = 0; i < d.options.length; i++) if (d.options[i].correct) correctIdx = i;
      var ok = pick === correctIdx;
      return {
        credit: ok ? 1 : 0,
        items: [ok ? itG('q', 'Answer', ex.explain.items && ex.explain.items['q'] ? ex.explain.items['q'] : ex.explain.whyShort || 'This is the correct option.') :
          itB('q', 'Answer', (ex.explain.items && ex.explain.items['q']) ? ex.explain.items['q'] : 'The selected option does not match the evidence in this scenario.')]
      };
    }
    if (ex.type === 'multi') {
      var picks = (a.picks || []).slice().sort();
      var corr = [];
      for (var i2 = 0; i2 < d.options.length; i2++) if (d.options[i2].correct) corr.push(i2);
      var H = 0, W = 0;
      var items = [];
      for (var c = 0; c < corr.length; c++) {
        var inSel = picks.indexOf(corr[c]) >= 0;
        var txt = (ex.explain.items && ex.explain.items[String(corr[c])]) || '';
        if (inSel) { H++; items.push(itG(String(corr[c]), d.options[corr[c]].short || ('Option ' + optLetters(corr[c])), txt)); }
        else items.push(itM(String(corr[c]), d.options[corr[c]].short || ('Option ' + optLetters(corr[c])), txt));
      }
      for (var p = 0; p < picks.length; p++) {
        if (corr.indexOf(picks[p]) < 0) {
          W++;
          var wtxt = (ex.explain.items && ex.explain.items[String(picks[p])]) || 'Not part of the correct set in this scenario.';
          items.push(itB(String(picks[p]), d.options[picks[p]].short || ('Option ' + optLetters(picks[p])), wtxt));
        }
      }
      return { credit: scoreSet(H, W, corr.length), items: items };
    }
    if (ex.type === 'matching') {
      var Hm = 0, Wm = 0, items = [];
      for (var i3 = 0; i3 < d.left.length; i3++) {
        var L = d.left[i3];
        var v = (a.picks && a.picks[L.id]) || '';
        var txt2 = (ex.explain.items && ex.explain.items[L.id]) || '';
        if (v === L.match) { Hm++; items.push(itG(L.id, L.short || L.text, txt2)); }
        else if (v === '') { items.push(itM(L.id, L.short || L.text, txt2)); }
        else { Wm++; items.push(itB(L.id, L.short || L.text, txt2)); }
      }
      return { credit: scoreSet(Hm, Wm, d.left.length), items: items };
    }
    if (ex.type === 'dragdrop') {
      var Hd = 0, Wd = 0, items = [];
      for (var i4 = 0; i4 < d.chips.length; i4++) {
        var ch = d.chips[i4];
        var zone = (a.placed && a.placed[ch.id]);
        var goodZone = false;
        for (var z = 0; z < d.zones.length; z++) {
          if (d.zones[z].id === zone && d.zones[z].correct && d.zones[z].correct.indexOf(ch.id) >= 0) goodZone = true;
        }
        var txt3 = (ex.explain.items && ex.explain.items[ch.id]) || '';
        if (goodZone) { Hd++; items.push(itG(ch.id, ch.short || ch.text, txt3)); }
        else if (!zone) { items.push(itM(ch.id, ch.short || ch.text, txt3)); }
        else { Wd++; items.push(itB(ch.id, ch.short || ch.text, txt3)); }
      }
      return { credit: scoreSet(Hd, Wd, d.chips.length), items: items };
    }
    if (ex.type === 'order') {
      var seq = a.seq || [];
      var Ho = 0, Wo = 0, items = [];
      for (var i5 = 0; i5 < d.items.length; i5++) {
        var it = d.items[i5];
        var at = seq.indexOf(it.id);
        var good = (at + 1) === it.pos;
        var txt4 = (ex.explain.items && ex.explain.items[it.id]) || '';
        if (good) { Ho++; items.push(itG(it.id, 'Position ' + it.pos, txt4)); }
        else { Wo++; items.push(itB(it.id, 'Position ' + (at + 1) + ' (should be ' + it.pos + ')', txt4)); }
      }
      return { credit: scoreSet(Ho, Wo, d.items.length), items: items };
    }
    if (ex.type === 'fill') {
      var Hf = 0, Wf = 0, items = [];
      var nb = d.answers.length;
      for (var b2 = 1; b2 <= nb; b2++) {
        var v2 = (a.picks && a.picks[b2]) || '';
        var want = d.answers[b2 - 1];
        var txt5 = (ex.explain.items && ex.explain.items[String(b2)]) || '';
        if (v2 === want) { Hf++; items.push(itG(String(b2), 'Blank ' + b2, txt5)); }
        else if (v2 === '') { items.push(itM(String(b2), 'Blank ' + b2, txt5)); }
        else { Wf++; items.push(itB(String(b2), 'Blank ' + b2, txt5)); }
      }
      return { credit: scoreSet(Hf, Wf, nb), items: items };
    }
    if (ex.type === 'terminal') {
      var typed = (a.typed || '').toLowerCase().replace(/\s+/g, ' ').trim();
      var Ht = 0, Wt = 0, items = [];
      for (var r2 = 0; r2 < (d.required || []).length; r2++) {
        var rq = d.required[r2];
        var hit = new RegExp(rq.re, 'i').test(typed);
        if (hit) { Ht++; items.push(itG(rq.label, rq.label, rq.why)); }
        else items.push(itM(rq.label, rq.label, rq.why));
      }
      for (var f2 = 0; f2 < (d.forbidden || []).length; f2++) {
        var fb = d.forbidden[f2];
        if (new RegExp(fb.re, 'i').test(typed)) {
          Wt++;
          items.push(itB(fb.label, fb.label, fb.why));
        }
      }
      if (!typed) return { credit: 0, items: [itB('empty', 'Command', 'Nothing was typed, so the command could not be graded.')] };
      return { credit: scoreSet(Ht, Wt, (d.required || []).length), items: items };
    }
    if (ex.type === 'flow') {
      var Hs = 0, Ws = 0, items = [];
      for (var s2 = 0; s2 < d.steps.length; s2++) {
        var st2 = d.steps[s2];
        var pk = (S.flowPicks[ex.id] && S.flowPicks[ex.id][s2]);
        var key = 's' + s2;
        var txt6 = (ex.explain.items && ex.explain.items[key]) || '';
        var lab = 'Step ' + (s2 + 1) + (st2.short ? ' — ' + st2.short : '');
        if (pk !== undefined && st2.options[pk] && st2.options[pk].correct) { Hs++; items.push(itG(key, lab, txt6)); }
        else if (pk === undefined) { items.push(itM(key, lab, txt6)); }
        else { Ws++; items.push(itB(key, lab, txt6)); }
      }
      return { credit: scoreSet(Hs, Ws, d.steps.length), items: items };
    }
    return { credit: 0, items: [] };
  }

  /* ---------- check / feedback / navigation ---------- */
  function doCheck() {
    var ex = currentEx();
    if (!ex || S.checked[ex.id]) return;
    var g = grade(ex);
    var c = g.credit;
    if (S.hintUsed[ex.id]) c = Math.max(0, c - 0.10);
    S.credits[ex.id] = c;
    S.checked[ex.id] = true;
    pauseAutoStart();          /* FIRST action: stop the timer before feedback renders */
    buildFeedback(ex, g, c);
    var ck = $('btn-check'); if (ck) ck.disabled = true;
    var nx = $('btn-next'); if (nx) nx.style.display = '';
    var sk = $('btn-skip'); if (sk) sk.disabled = true;
    disableInputs();
    renderHeaderMeta();
  }

  function disableInputs() {
    var nodes = document.querySelectorAll('#stage select.anssel, #stage .termrow input, #stage .mvbtn');
    for (var i = 0; i < nodes.length; i++) nodes[i].disabled = true;
  }

  function buildFeedback(ex, g, c) {
    var old = $('feedback-box');
    if (old) old.parentNode.removeChild(old);
    var lab, cls, icon;
    if (c >= 0.9999) { lab = 'CORRECT'; cls = 'fb-good'; icon = '✓'; }
    else if (c > 0) { lab = 'PARTIALLY CORRECT'; cls = 'fb-part'; icon = '✓'; }
    else { lab = 'INCORRECT'; cls = 'fb-bad'; icon = '✗'; }
    var fb = el('section', 'fb ' + cls);
    fb.id = 'feedback-box';
    var creditTxt = '';
    var N = g.items.length;
    var H = 0, W = 0, M = 0;
    for (var i = 0; i < g.items.length; i++) { if (g.items[i].state === 'g') H++; else if (g.items[i].state === 'b') W++; else M++; }
    if (N > 1 || ex.type === 'multi' || ex.type === 'matching' || ex.type === 'dragdrop' || ex.type === 'order' || ex.type === 'fill' || ex.type === 'terminal' || ex.type === 'flow') {
      creditTxt = 'credit ' + (Math.round(c * 100) / 100) + ' — ' + H + '/' + N + ' items correct';
      if (W > 0) creditTxt += ', ' + W + ' wrong';
      if (M > 0) creditTxt += ', ' + M + ' missed';
      if (S.hintUsed[ex.id]) creditTxt += ' (includes the −0.10 hint penalty)';
    } else if (S.hintUsed[ex.id] && c > 0) {
      creditTxt = 'credit ' + (Math.round(c * 100) / 100) + ' (hint penalty applied)';
    }
    fb.appendChild(el('div', 'fb-h', '<span>' + icon + '</span> <span>' + lab + (creditTxt ? ' — ' + esc(creditTxt) : '') + '</span>'));
    var body = el('div', 'fb-b');
    var ul = el('ul', 'ilist');
    for (var j = 0; j < g.items.length; j++) {
      var it = g.items[j];
      var ic = it.state === 'g' ? ['g', '✓', 'Correct'] : (it.state === 'b' ? ['b', '✗', 'Wrong'] : ['m', '○', 'Missed']);
      var li = el('li');
      li.innerHTML = '<span class="ic ' + ic[0] + '">' + ic[1] + '</span><span><b>' + esc(ic[2]) + ' — ' + esc(it.label) + ':</b> ' + md(it.text) + '</span>';
      ul.appendChild(li);
    }
    body.appendChild(ul);
    if (ex.explain && ex.explain.why) body.appendChild(el('p', 'why', md(ex.explain.why)));
    if (ex.type === 'terminal' && ex.data.canonical) {
      body.appendChild(el('p', 'why', 'Canonical command (you can copy it):'));
      body.appendChild(el('div', 'canon', esc(ex.data.canonical)));
      if (ex.data.parts) {
        var pt = el('ul', 'ilist');
        for (var p2 = 0; p2 < ex.data.parts.length; p2++) {
          pt.appendChild(el('li', null, '<span class="ic g">▸</span><span>' + md(ex.data.parts[p2]) + '</span>'));
        }
        body.appendChild(pt);
      }
      if (ex.data.dangerNote) body.appendChild(el('div', 'study', '<b>⚠ Safety note:</b> ' + md(ex.data.dangerNote)));
    }
    if (ex.explain && ex.explain.study && c < 0.9999) body.appendChild(el('div', 'study', '<b>What to study:</b> ' + md(ex.explain.study)));
    fb.appendChild(body);
    var act = $('action-row');
    act.parentNode.insertBefore(fb, act);
  }

  function rebuildFeedback(ex) {
    var g = grade(ex);
    var c = S.credits[ex.id] || 0;
    buildFeedback(ex, g, c);
    var ck = $('btn-check'); if (ck) ck.disabled = true;
    var nx = $('btn-next'); if (nx) nx.style.display = '';
    var sk = $('btn-skip'); if (sk) sk.disabled = true;
    disableInputs();
  }

  function goNext() {
    var ex = currentEx();
    pauseAutoStop();           /* timer resumes ONLY here (or on Final Submit) */
    if (S.reviewTarget !== null && S.reviewTarget !== undefined) {
      S.reviewTarget = null;
      renderReview();
      return;
    }
    if (S.pos >= S.order.length - 1) {
      var pending = S.skipped.filter(function (id) { return !S.checked[id]; });
      if (pending.length) { renderReview(); return; }
      renderResults();
      return;
    }
    S.pos++;
    renderCurrent();
  }

  function doSkip() {
    var ex = currentEx();
    if (!ex || S.checked[ex.id]) return;
    if (S.skipped.indexOf(ex.id) < 0) S.skipped.push(ex.id);
    if (S.reviewTarget !== null && S.reviewTarget !== undefined) {
      S.reviewTarget = null;
      renderReview();
      return;
    }
    /* find next not-checked, not-in-skipped exercise */
    var nxt = -1;
    for (var p = S.pos + 1; p < S.order.length; p++) {
      var cand = EXS[S.order[p]];
      if (!S.checked[cand.id]) { nxt = p; break; }
    }
    if (nxt >= 0) { S.pos = nxt; renderCurrent(); }
    else {
      var pending = S.skipped.filter(function (id) { return !S.checked[id]; });
      if (pending.length) renderReview(); else renderResults();
    }
  }

  function renderReview() {
    S.screen = 'review';
    var st = clearStage();
    var pending = S.skipped.filter(function (id) { return !S.checked[id]; });
    var w = el('div');
    w.appendChild(el('div', 'card', '<h1 style="margin-top:0">Review skipped exercises</h1>' +
      '<p>You skipped ' + pending.length + ' exercise(s). You can go back to each one and answer it while the timer is still running. Skipped exercises that stay unanswered are <b>excluded</b> from your score: they do not count as wrong, and they do not reduce your possible points.</p>'));
    var lst = el('div', 'card');
    var ul = el('ul', 'sklist');
    for (var i = 0; i < pending.length; i++) {
      var ex = null;
      for (var q = 0; q < EXS.length; q++) if (EXS[q].id === pending[i]) ex = EXS[q];
      var li = el('li');
      li.innerHTML = '<span class="t">' + esc(ex.title || ex.summary || ex.id) + '</span>';
      var b = el('button', 'btn', 'Return to this exercise');
      (function (id) {
        b.addEventListener('click', function () {
          S.reviewTarget = EXS.indexOf(EXS.filter(function (e) { return e.id === id; })[0]);
          var pos = S.order.indexOf(S.reviewTarget);
          if (pos >= 0) S.pos = pos;
          renderCurrent();
        });
      })(pending[i]);
      li.appendChild(b);
      ul.appendChild(li);
    }
    if (!pending.length) ul.appendChild(el('li', null, 'No skipped exercises left. You can finish.'));
    lst.appendChild(ul);
    w.appendChild(lst);
    var fin = el('div', 'card');
    var fb = el('button', 'btn primary big', 'Final Submit — see my results');
    fb.addEventListener('click', function () { setState('ENDED'); renderResults(); });
    fin.appendChild(fb);
    w.appendChild(fin);
    st.appendChild(w);
    renderHeaderMeta();
    window.scrollTo(0, 0);
  }

  function finalizeByTimeout() {
    /* time over: any exercise not checked is treated as skipped-and-never-answered (excluded) */
    renderResults();
  }

  function renderResults() {
    S.screen = 'results';
    if (S.timerState !== 'ENDED') setState('ENDED');
    var st = clearStage();
    var ids = answeredIds();
    var sum = 0, full = 0, part = 0, zero = 0, partSum = 0;
    for (var i = 0; i < ids.length; i++) {
      var c = S.credits[ids[i]];
      sum += c;
      if (c >= 0.9999) full++;
      else if (c > 0) { part++; partSum += c; }
      else zero++;
    }
    var skippedLeft = 0;
    for (var q = 0; q < EXS.length; q++) if (!S.checked[EXS[q].id]) skippedLeft++;
    var answeredCount = ids.length;
    var percent = answeredCount > 0 ? Math.round((sum / answeredCount) * 100) : 0;
    var passed = percent >= CFG.passMark;
    var w = el('div');
    var cert = el('div', 'card');
    var pctShown = percent; /* same rounded value as posted to the site */
    cert.appendChild(el('div', passed ? 'cert' : 'cert fail',
      '<div class="crest">' + (passed ? '✓' : '✗') + '</div>' +
      '<h1 style="margin:6px 0">' + (passed ? 'PASS — certificate earned' : 'FAIL — retake needed') + '</h1>' +
      '<div class="res-big">' + (Math.round(sum * 10) / 10) + ' / ' + answeredCount + ' · ' + pctShown + '%</div>' +
      '<p style="font-weight:700">' + (passed
        ? 'Congratulations. You reached the ' + CFG.passMark + '% pass mark on this ' + esc(CFG.difficultyLabel) + ' exam for ' + esc(CFG.mitreId) + '.'
        : 'You needed ' + CFG.passMark + '% or more. Study the feedback, then retake the exam — the questions and options will be shuffled.') + '</p>'));
    var grid = el('div', 'resgrid');
    function rc(n, l) { var c1 = el('div', 'rescard'); c1.appendChild(el('div', 'n', String(n))); c1.appendChild(el('div', 'l', l)); return c1; }
    grid.appendChild(rc(full, 'Fully correct'));
    grid.appendChild(rc(part, 'Partially correct' + (part ? ' — avg ' + (Math.round((partSum / part) * 100) / 100) : '')));
    grid.appendChild(rc(zero, 'Fully incorrect'));
    grid.appendChild(rc(skippedLeft, 'Skipped, never answered (excluded)'));
    cert.appendChild(grid);
    cert.appendChild(el('p', null, '<b>Time report.</b> Total time left: ' + fmtLong(S.remaining) + '. Time you paused manually: ' + fmtLong(S.pauseManSecs) + '. Time you spent reviewing feedback (auto-pause after Check): ' + fmtLong(S.pauseAutoSecs) + '.'));
    cert.appendChild(el('p', null, 'Score basis: only answered exercises (' + answeredCount + ' of ' + EXS.length + '). Each exercise counts at most 1.0 credit; multi-part exercises award partial credit.'));
    w.appendChild(cert);
    var acts = el('div', 'card');
    var rb = el('button', 'btn primary big', '↻ Retake exam');
    rb.addEventListener('click', function () { renderIntro(); });
    acts.appendChild(rb);
    w.appendChild(acts);
    st.appendChild(w);
    renderHeaderMeta();
    window.scrollTo(0, 0);
    if (!S.reported) {
      S.reported = true;
      reportScore(sum, answeredCount, percent, passed);
    }
  }

  function reportScore(creditSum, answeredCount, percent, passed) {
    try {
      parent.postMessage({
        type: 'CYBERPULSE_SCORE',
        topicId: CFG.topicId,
        batch: CFG.batch,
        score: Math.round(creditSum),
        total: answeredCount,
        percent: percent,
        passed: passed
      }, location.origin);
    } catch (e) { /* opened directly, not inside the site — nothing to report to */ }
  }

  /* ---------- pause cover (manual pause hides the exercise) ---------- */
  function showPauseCover() {
    removePauseCover();
    var ov = el('div', 'pausecover');
    ov.id = 'pause-cover';
    var inner = el('div', 'inner');
    inner.appendChild(el('h2', null, '⏸ Paused — on break'));
    inner.appendChild(el('p', null, 'The timer is stopped and the current exercise is hidden so you cannot read or answer it while paused.'));
    inner.appendChild(el('p', 'resume-hint', 'Press Resume when you are ready to continue.'));
    var b = el('button', 'btn primary big', '▶ Resume');
    b.addEventListener('click', manualResume);
    inner.appendChild(b);
    ov.appendChild(inner);
    document.body.appendChild(ov);
  }
  function removePauseCover() {
    var ov = $('pause-cover');
    if (ov) ov.parentNode.removeChild(ov);
  }

  /* ---------- header actions (active only during the exam) ---------- */
  $('btn-hint').addEventListener('click', function () {
    if (S.screen !== 'exam') return;
    var ex = currentEx();
    if (!ex || S.checked[ex.id] || S.hintUsed[ex.id]) return;
    S.hintUsed[ex.id] = true;
    renderHintArea(ex);
  });
  $('btn-pause').addEventListener('click', function () {
    if (S.screen !== 'exam') return;
    if (S.timerState === 'PAUSED_MANUAL') manualResume(); else manualPause();
    renderHeaderMeta();
  });
  $('btn-skip').addEventListener('click', function () {
    if (S.screen !== 'exam') return;
    doSkip();
  });

  /* ---------- site handshake (both names accepted; exam also works standalone) ---------- */
  window.addEventListener('message', function (event) {
    if (!event.data) return;
    if (event.data.type !== 'CYBERPULSE_INIT' && event.data.type !== 'CYBERMASTERY_INIT') return;
    try {
      S.username = event.data.username || '';
      var sub = document.querySelector('.hero .sub');
      if (sub && S.username && S.screen === 'intro') {
        sub.textContent = 'Welcome, ' + S.username + '. ' + CFG.introTagline;
      }
    } catch (e) { }
  });

  /* ---------- boot ---------- */
  document.body.className = CFG.sevClass;
  setInterval(tick, 250);
  renderIntro();
})();

</script>
</body>
</html>
