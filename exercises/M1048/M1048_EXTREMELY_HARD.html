  intro:`<div class="intro-prose">
<p>You will learn here what the ATT&CK object <b>M1048 — Application Isolation</b> is, where teams use it at work, and how to reason about it like a professional.</p>
<p><b>What it is.</b> In the MITRE ATT&amp;CK framework, this object is a <b>Mitigation</b>. A mitigation is a defense that you build to stop or weaken a known attack behaviour. M1048 is called <b>Application Isolation</b>. Its idea is simple: run risky code inside a separate, locked-down box, so an attack inside the box cannot reach the real system. People call these boxes <b>sandboxes</b>, <b>containers</b>, or <b>virtual machines</b> (VMs). A VM is a complete computer that lives inside your computer. A container is a smaller box that holds one app. A sandbox is a safe area where untrusted files or programs can run and be watched.</p>
<p><b>Imagine you are a new analyst.</b> An email brings a PDF invoice to your company. The PDF may hide an <b>exploit</b> — code that misuses a bug in a program. If you open the PDF inside a sandbox, the attack can only break things inside that sandbox. When you close the box, the attack is thrown away with it. Your real computer stays clean. That is exactly the behaviour M1048 describes.</p>
<p><b>Where you will meet it at work:</b></p>
<ul>
<li>As a <b>SOC analyst</b>, you triage alerts. Many security tools show messages like “ran in sandbox, blocked”. You must understand what that message means for M1048.</li>
<li>As an <b>incident responder</b>, you contain live attacks. Isolation — for example cutting a container off the network — is one of your main containment tools.</li>
<li>As a <b>threat hunter or CTI analyst</b>, you map attacker behaviour to ATT&amp;CK and brief your team on which techniques M1048 blunts: <b>T1190</b> (exploiting a public-facing app), <b>T1203</b> (exploiting a document or site the victim opens), <b>T1210</b> (exploiting a remote internal service), <b>T1211</b> (exploitation used for defense evasion), <b>T1212</b> (exploitation used to steal credentials), and <b>T1068</b> (exploitation used to escalate privileges).</li>
<li>As a <b>detection engineer</b>, you read the telemetry a sandbox produces — its process, network and registry events — and you tune alerts around it.</li>
<li>As a <b>red teamer</b>, you test whether the box really holds, and you learn which attacks simply walk around it, like tricking a user into typing a password on a fake page.</li>
<li>As a <b>GRC analyst or control owner</b>, you write the rules for its use, map it to frameworks (NIST CSF Protect, CIS Control 10.7, ISO 27001 A.8.7 / A.8.19), and check that teams follow the rules.</li>
<li>As a <b>cloud or platform engineer</b>, you build the boxes themselves: Docker and Kubernetes containers, Windows Sandbox, Microsoft Defender Application Guard, virtual machines, or remote browser isolation.</li>
</ul>
<p><b>What kind of control it is.</b> M1048 is mainly a <b>preventive</b> control: it acts before damage happens. It is not magic. It does not stop a user from typing a password into a fake login page. It does not replace patching (that is a different mitigation, M1051 Update Software, and the two work best together). Rare escape bugs exist, and isolation costs some speed and user comfort. Good teams accept these trade-offs and place isolation where the risk is highest: untrusted files, public-facing applications, and risky web browsing.</p>
</div>`,

 {label:'Identity log',mono:true,text:`09:31 MFA push approved by MF-EKSTRAND from the usual device
09:31 no impossible travel, no new device registrations`},
 {label:'Context (noise)',mono:true,text:`09:40 printer driver update on MF-FIN-WS-22 completed`}
],
steps:[
 {q:'The CISO needs a posture decision in 10 minutes. Choose the best.',opts:[
   {t:'Keep the host in service; open a targeted identity review for the call and coach the user',ok:true},
   {t:'Reset all 4,000 finance credentials tonight as a precaution',why:'No evidence shows any credential was stolen. A mass reset burns money and goodwill and solves nothing the evidence points to.'},
   {t:'Close everything: the sandbox held, so no action is needed today',why:'The endpoint story is contained, but a social-engineering call preceded it. Closing the identity thread ignores the second signal.'},
   {t:'Air-gap MF-FIN-WS-22 and seize it for full forensics now',why:'The containment evidence contradicts a host seizure — you would stop the finance team for nothing measurable.'}
 ]},
 {q:'The CISO asks for the one-line risk position. Which line is defensible?',opts:[
   {t:'Endpoint contained; identity exposure remains — targeted identity review opened',ok:true},
   {t:'Finance floor fully compromised; declare a major incident tonight',why:'No host-side compromise exists anywhere in the telemetry. Declaring a major incident contradicts the containment evidence.'},
   {t:'No incident at all: the sandbox held, so nothing happened today',why:'The call and the partial code read-out are real events. Hiding the identity thread breaks the record.'}
 ]}
],
explain:`<p>Two signals live at two different layers: the exploit is a <b>code</b> story and the box held; the call is a <b>human</b> story and is still open. The senior move resolves the conflict instead of picking a side: accept the containment evidence for the endpoint, and answer the identity exposure with a targeted, proportionate response. Company-wide resets punish everyone for one phone call; seizing the host contradicts your own telemetry.</p>`,
hint:'One signal is about code. The other is about a human being phoned.'},

{id:'X02',type:'terminal',long:true,summary:'Compromised payment container pay-api-7 — sever its network reach without destroying regulator-required evidence.',
kw:['Real-world work tasks','Isolation technologies'],
artefacts:[
 {label:'Runtime and egress log — MF-DOCK-04, 02:44 to 02:50',mono:true,text:`02:44:11 WARN runtime: process injection detected inside pay-api-7
02:45:02 WARN egress attempt 45[.]61[.]10[.]77:443 from pay-api-7 (blocked by policy)
02:47:30 WARN egress attempt repeats every 60 seconds — beacon pattern
02:49:55 INFO service pay-api-7 healthy, customers transacting`},
 {label:'Regulator note — from the last inspection',text:'<p>“Payment segmentation must hold at all times. Volatile evidence must survive scrutiny. We will ask how you contained, in what order, and why.”</p>'}
],
scenario:`<p>02:50. You have a shell on MF-DOCK-04 as <span class="kbd">mfops</span>. The container <span class="kbd">pay-api-7</span> is attached to the bridge network <span class="kbd">prod-net</span>. A full service stop triggers contract penalties, and deleting anything before evidence capture fails the audit. This exercise has a <b>90-second limit</b> once it opens — decide once, type once.</p>`,
question:'Type and run the command that severs the payment segment now.',
prompt:'mfops@mf-dock-04:~$',
termTitle:'mf-dock-04 — containment console',
banner:'containment console — evidence-preserving mode',
expected:'docker network disconnect prod-net pay-api-7',
goodOut:'pay-api-7 disconnected from prod-net\negress to 45[.]61[.]10[.]77 now unreachable from the container\ncontainer process kept alive for forensics',
dangerous:[
 {cmd:'docker rm -f pay-api-7',out:'pay-api-7 removed',why:'You just destroyed the container, its memory and the regulator-required evidence. Removal is the destructive path — disconnect, do not remove.'},
 {cmd:'docker rm pay-api-7',out:'Error: cannot remove a running container',why:'Removal is the destructive intent even when the engine refuses it. Contain first — the audit asks how you contained, not what you deleted.'},
 {cmd:'docker stop pay-api-7',out:'pay-api-7 stopped',why:'Stopping kills the process and throws away volatile memory — exactly the evidence the regulator demands. A network disconnect keeps the process and its memory while cutting reach.'},
 {cmd:'docker kill pay-api-7',out:'pay-api-7 killed',why:'Same problem as stopping, just faster: the process and its memory are gone. Evidence destroyed.'}
],
wrong:[
 {cmd:'docker network disconnect prod-net web-gw-2',out:'web-gw-2 disconnected from prod-net',why:'Wrong target: you severed the healthy gateway and left the compromised container attached. Confirm the container name before you cut.'},
 {cmd:'docker network disconnect prod-net',out:'Error: requires exactly 2 arguments',why:'The engine needs both the network and the container name. Read the error and fix the command.'},
 {cmd:'docker network create quarantine-net',out:'quarantine-net created',why:'Creating an empty network changes nothing for the compromised container. Act on pay-api-7 itself.'}
],
subTimer:90,
parts:[
 {p:'docker',d:'the container engine command-line tool'},
 {p:'network',d:'the object type you are acting on'},
 {p:'disconnect',d:'the subcommand that detaches a running container from a network — the process and its memory keep running'},
 {p:'prod-net',d:'the network to detach from — the path the beacon uses'},
 {p:'pay-api-7',d:'the compromised container — the target, not the healthy gateway'}
],
warn:'A destructive alternative (removing or stopping the container) would have destroyed the volatile evidence the regulator requires and stopped a live payment service. Disconnect is the containment action that keeps both.',
explain:`<p>The correct command severs the payment segment at the network edge while the process and its memory stay alive — containment without evidence destruction, exactly what the regulator note demands. <span class="kbd">docker rm -f</span> or <span class="kbd">docker stop</span> would destroy volatile memory and stop the service: the two things the scenario says you must not do. This is M1048-style isolation applied live under pressure — the business cost (some payment flows disrupted) is accepted because segmentation must hold.</p>`,
hint:'Whatever you type must not destroy the process or its memory.'},

{id:'X03',type:'decision',long:true,summary:'M1048 claims six techniques — find the one isolation genuinely cannot be deployed for at Meridian, then pick the compensating control.',
question:'Find the tier where the claim cannot be deployed, then pick the compensating control.',
kw:['Control design and layering','Techniques mitigated'],
artefacts:[
 {label:'ATT&CK claim list',mono:true,text:`M1048 mitigates: T1068, T1190, T1203, T1210, T1211, T1212`},
 {label:'Meridian estate',mono:true,text:`mf-edge fleet (400 nodes) ... containers everywhere ....... T1190 covered
finance endpoints ........... AppGuard + Sandbox ........ T1203 covered
legacy EDI gateways ......... sealed appliances ......... T1210 — isolation impractical
patch pipeline .............. 14-day cycle .............. T1068 owned by patching
QA lab ...................... sandboxed runners ......... T1211 covered`}
],
steps:[
 {q:'A senior reviewer must find where M1048 is CLAIMED but isolation is genuinely NOT deployable on this estate. Click the technique.',opts:[
   {t:'T1210 — the EDI tier runs sealed appliances; no isolation layer can be installed',ok:true},
   {t:'T1190',why:'The mf-edge fleet is containerised end to end — T1190 is the best-covered technique here.'},
   {t:'T1203',why:'Finance endpoints run Application Guard and Windows Sandbox; T1203 is covered.'},
   {t:'T1068',why:'T1068 is owned by the patching programme by design — a mapping decision, not an isolation deployability failure.'}
 ]},
 {q:'Choose the compensating control for the tier you picked.',opts:[
   {t:'Keep segmentation and add protocol-aware monitoring with vendor containment on the EDI tier',ok:true},
   {t:'Install Application Guard on the EDI gateways',why:'The gateways are sealed appliances that cannot host a hypervisor. Controls must fit the platform they protect.'},
   {t:'Do nothing: the claim list covers it automatically',why:'A claim list is not a deployment. Auditors fail estates that equate the two.'}
 ]}
],
explain:`<p>A claim list describes what a mitigation <b>can</b> do; the estate decides what it <b>should</b> do. The EDI gateways are sealed appliances where no isolation layer fits, so the honest path is segmentation plus protocol-aware monitoring. Note the deliberate contrast: T1068 is also not isolation-covered, but by design — it is owned by patching — which is a different, defensible reason. Reviewers reward exactly this distinction.</p>`,
hint:'Which tier cannot realistically run a box at all?'},

{id:'X04',type:'mcq',kw:['Trade-offs and limitations','Isolation technologies'],
scenario:`<p>Meridian&rsquo;s call-centre estate: 8,000 thin-client VDI seats on hosts without nested virtualisation support. A consultant&rsquo;s deck says: “Enable Application Guard on every call-centre seat — industry best practice.”</p>`,
question:'What is the correct senior assessment?',
opts:[
 {t:'Application Guard cannot run on these hosts; isolate documents at the broker/VM layer instead',ok:true},
 {t:'Enable it anyway — the consultant\u2019s best-practice label is enough'},
 {t:'Disable every isolation control because one feature does not fit'},
 {t:'Move all 8,000 users to Qubes OS workstations before Monday'}
],
explain:`<p>Best practices have preconditions. Application Guard needs Hyper-V capability that these thin clients lack — forcing it breaks seats or silently does nothing. The honest answer adapts the same mitigation (isolation) to a layer that works: the broker VM. Total dismissal of isolation and fantasy rollouts are the two classic overreactions — both are wrong in different directions.</p>`,
hint:'Read the hardware line again before falling in love with the deck.'},

{id:'X05',type:'decision',long:true,summary:'“Contained” — but 40 MB left the finance segment. Resolve the contradiction, then accept a real business cost.',
question:'Resolve the contradiction, then choose the actions, in three steps.',
kw:['Trade-offs and limitations','Real-world work tasks'],
artefacts:[
 {label:'AppGuard telemetry — MF-FIN-WS-31',mono:true,text:`09:14:02 PDF exploit attempt in container ag-441
09:14:07 exploit blocked inside the container
09:14:08 container discarded, host clean`},
 {label:'Egress log — finance VDI segment',mono:true,text:`09:17  40 MB uploaded to fresh domain paste-bin-mirror[.]example
09:18  second upload 11 MB, same domain`},
 {label:'Policy audit',mono:true,text:`platform policy PSD-07: clipboard sync from isolated
sessions must be DISABLED
actual state on MF-FIN-WS-31: ENABLED — drift found`},
 {label:'Calendar (context)',mono:true,text:`treasury closes the books in 3 days;
clipboard flows are heavy this week`}
],
steps:[
 {q:'Two signals contradict. Which conflict must you resolve first?',opts:[
   {t:'“Contained” versus “40 MB left”: containing code is not containing data while sync channels stay open',ok:true},
   {t:'Printer queue drift on the segment',why:'There is no printer evidence here at all — do not resolve conflicts that do not exist.'},
   {t:'Which dashboard shows the nicest graph',why:'Dashboards are downstream. The contradiction lives in the telemetry.'}
 ]},
 {q:'Immediate action on the sync channel?',opts:[
   {t:'Disable clipboard sync from isolated sessions now; accept the three-day treasury friction',ok:true},
   {t:'Keep sync open until after the books close to avoid friction',why:'Every hour of convenience is another hour of an open leak channel from an exploited estate. The cost is real; the leak is worse.'},
   {t:'Rename the policy so audits stop flagging it',why:'Cosmetic policy edits hide the drift instead of fixing it — that is an audit finding, not a control.'}
 ]},
 {q:'Scope of the egress investigation?',opts:[
   {t:'Finance segment first — where both signals live — then expand by findings',ok:true},
   {t:'Entire company immediately, all 40,000 staff',why:'No signal points outside the finance segment. A company-wide freeze costs more than the evidence supports.'},
   {t:'Only MF-FIN-WS-31, because one machine uploaded alone',why:'A 40 MB finance upload rarely belongs to one workstation; the segment shares the channel and the exposure.'}
 ]},
 {q:'The board asks: “Was isolation useless?” Your answer?',opts:[
   {t:'No: the exploit died in the box; a configuration drift let data out — fix the drift, keep the control',ok:true},
   {t:'Yes: remove Application Guard fleet-wide tonight',why:'Removing a working boundary because a policy drifted punishes the control for a human error.'},
   {t:'Partially: blame the user and close',why:'No user action caused this — the drift was platform-side. Blame without evidence destroys the reporting culture.'}
 ]}
],
explain:`<p>Isolation stops code, not configuration mistakes around it. The correct path names the contradiction (code contained, data flowing), pays a real business cost to close the leak (three days of treasury friction), scopes the hunt to where the signals actually live, and defends the control with precise language. This is the exact conversation a senior analyst has when a sandbox fleet leaks through its own plumbing.</p>`,
hint:'The box held the code. Ask what else was allowed out — and why.'},

{id:'X06',type:'rank',kw:['Real-world work tasks','Trade-offs and limitations'],
scenario:`<p>The Meridian board grants one isolation programme per quarter. Rank the four candidates by risk reduction for the company — best first.</p>`,
question:'Rank the candidates by risk reduction (best first).',
items:[
 'Egress lockdown and clipboard denial for isolated finance sessions (closes the live leak)',
 'Containerise the customer tracking portal (T1190, highest external exposure)',
 'Isolated browsing for procurement (invoice-driven T1203 exposure)',
 'Sandbox hardening for the internal analytics cluster (low exposure, internal only)'
],
explain:`<p>Live leaks come before strong front doors, and front doors come before quiet rooms. The finance leak is bleeding today; the portal is the largest external surface; procurement browsing is a real but slower burn; the analytics cluster is internal and low exposure. Ranking “analytics last” is not neglect — it is ordering by exposure × fit, which is the only ranking a board should accept.</p>`,
hint:'One candidate is leaking today. Order matters.'},

{id:'X07',type:'logline',kw:['Isolation technologies','Real-world work tasks'],
question:'Use the filter box if it helps, then click the single line that resolves the conflict in favour of “containment held”.',
scenario:`<p>MF-FIN-WS-45 combined log (AppGuard + Windows + Sysmon style). Two signals seem to contradict: a host Run key EXISTS, and a sandbox write was DENIED.</p>`,
lines:[
 {id:'L1',t:'10:55:01 INFO it-baseline[.]ps1 created Run key OneDriveStandaloneUpdate (planned change CHG-2317)'},
 {id:'L2',t:'11:12:40 INFO user MF-RANTANEN opened carrier_invoice.pdf in Application Guard (ag-502)'},
 {id:'L3',t:'11:14:02 WARN appguard: exploit pattern in ag-502 blocked'},
 {id:'L4',t:'11:14:07 WARN appguard: container ag-502 attempted host-side registry write HKCU\\Run\\update-check DENIED'},
 {id:'L5',t:'11:14:08 INFO appguard: container ag-502 discarded'},
 {id:'L6',t:'11:14:12 INFO edr: no host-side process anomalies'},
 {id:'L7',t:'11:15:00 INFO teams heartbeat ok'},
 {id:'L8',t:'11:15:31 WARN disk latency spike 12s on storage tier'},
 {id:'L9',t:'11:16:10 INFO proxy cert check ok mf-proxy-2'},
 {id:'L10',t:'11:17:44 INFO spool job printed to MF-PRN-04'},
 {id:'L11',t:'11:18:02 INFO windows update search ok'},
 {id:'L12',t:'11:19:11 INFO user MF-RANTANEN locked workstation'},
 {id:'L13',t:'11:20:00 INFO backup agent idle'},
 {id:'L14',t:'11:21:44 INFO netlogon refreshed secure channel'}
],
correct:'L4',
explain:`<p>The DENIED registry write from container ag-502 is the boundary holding: the exploit tried the classic Run-key persistence trick and could not leave the box. The 10:55 Run key is the contradicting signal — and it resolves to benign: a planned IT baseline change with ticket CHG-2317 behind it. Storage latency, print jobs and heartbeats are noise. The senior skill here is letting a benign-but-alarming line fail to change your conclusion.</p>`,
hint:'Two Run-key stories exist: one planned with a ticket, one denied at the box edge.'},

{id:'X08',type:'match',kw:['Techniques mitigated','Control design and layering'],
scenario:`<p>Architecture review at Meridian: match each M1048-claimed technique to the Meridian tier where its isolation actually lives.</p>`,
question:'Match each technique to the tier where its isolation lives.',
pairs:[
 {l:'T1190 — public portal bugs',r:'mf-edge container fleet (internet-facing tier)'},
 {l:'T1203 — document and site exploits',r:'Finance endpoints with Application Guard'},
 {l:'T1210 — internal remote-service bugs',r:'Segmented service tier with a planned VDI jump path'},
 {l:'T1212 — credential-stealing exploits',r:'Isolation plus the identity programme (partial by design)'}
],
explain:`<p>Coverage lives at tiers, not on paper. The container fleet answers T1190, endpoint sandboxes answer T1203, the segmented tier is the honest T1210 answer, and T1212 is only partially addressable by isolation — typed credentials need the identity programme alongside the box. This four-row table is exactly the artefact an architect defends in a design review.</p>`,
hint:'Coverage lives at tiers, not on paper.'},

{id:'X09',type:'mcq',kw:['Real-world work tasks'],
scenario:`<p>A vendor advisory hints at a sandbox escape in a browser component Meridian runs on 400 nodes. No proof-of-concept is public and no exploitation is observed. A director demands rebuilding all 400 nodes tonight.</p>`,
question:'Choose the senior response.',
opts:[
 {t:'Track the advisory, confirm exposure, and request the vendor\u2019s mitigation ETA',ok:true},
 {t:'Rebuild all 400 production nodes tonight as a precaution'},
 {t:'Delete the advisory email — no PoC means no problem today'},
 {t:'Publicly post the vendor bug details to force faster action'}
],
explain:`<p>With no observed exploitation and no public PoC, the proportionate response is tracked exposure plus vendor pressure plus readiness. Mass rebuilds burn a night of change risk for uncertain gain; ignoring advisories is negligence; forced disclosure is legally and ethically wrong. Matching response size to evidence size is the core senior judgement — and the correct answer here is deliberately the “do not act big yet” option.</p>`,
hint:'Match the response size to the evidence size.'},

{id:'X10',type:'fill',kw:['Real-world work tasks','Trade-offs and limitations'],
question:'Pick the word that states the scope boundary precisely.',
scenario:`<p>You draft the one-line executive brief the board will read aloud.</p>`,
text:'Isolation contained the exploit chain end-to-end; the credential risk from the phishing call is {0} by isolation and transfers to the identity workstream.',
bank:['unaddressed','eliminated','inherited','compressed'],
answers:['unaddressed'],
explain:`<p>“Unaddressed by isolation” is the honest scope statement — it hands the risk to a named owner instead of hiding it. “Eliminated” lies, and “inherited” and “compressed” blur ownership. One precise word is the difference between a fundable follow-up and a future breach story.</p>`,
hint:'Which word honestly says: this control does not cover it?'},

{id:'X11',type:'decision',long:true,summary:'Compromised SaaS connector in the payments namespace — choose the blast radius you accept.',
question:'Choose the containment blast radius, step by step.',
kw:['Real-world work tasks','Isolation technologies'],
artefacts:[
 {label:'Runtime telemetry — mf-prod cluster',mono:true,text:`saas-sync-3 (payments namespace): in-container exploitation confirmed
C2 beacon to 185[.]233[.]19[.]42 every 60 seconds
11 sibling services in the same namespace
e-invoicing SLA 99.9 percent`}
],
steps:[
 {q:'Given the beacons, is “watch and wait” defensible?',opts:[
   {t:'No: active C2 from a compromised container requires network severance now',ok:true},
   {t:'Yes: containment might still be true if we wait long enough',why:'Beacons prove active attacker control, not contained noise. Waiting is how lateral movement happens.'},
   {t:'Yes: the SOC enjoys watching beacons',why:'Entertainment is not containment. Beacons mean commands are flowing right now.'}
 ]},
 {q:'Minimum sufficient severance?',opts:[
   {t:'Disconnect the whole namespace: one owned container makes internal spread the real risk',ok:true},
   {t:'Disconnect only saas-sync-3 and hope nothing else is touched',why:'One owned container inside a trusting namespace is a beachhead. A single-container cut ignores namespace-internal trust.'},
   {t:'Delete the entire namespace and its data',why:'Deleting data destroys evidence and the e-invoicing record for no added safety.'}
 ]},
 {q:'The SLA owner asks why e-invoicing is down. Your line?',opts:[
   {t:'Containment cost: we severed the namespace to stop spread; services return from clean images in order',ok:true},
   {t:'The container escaped and we lost the datacentre',why:'Nothing in the telemetry shows an escape, and the datacentre is fine. Do not invent disasters.'},
   {t:'We did it to test the SLA team response',why:'Drills are announced. Inventing a test to cover a decision destroys trust.'}
 ]}
],
explain:`<p>Senior containment weighs blast radius against evidence and service cost. Beacons prove active control; a trusting namespace is the real risk; accepting the SLA hit and restoring from clean images is the honest, proportionate price. This is the blast-radius conversation that separates isolation as a concept from isolation as a decision.</p>`,
hint:'One container is a beachhead, not the whole beach.'},

{id:'X12',type:'decision',kw:['Trade-offs and limitations','Real-world work tasks'],
question:'Answer the board question once for red and once for blue.',
scenario:`<p>The board asks the red team to prove the isolation programme&rsquo;s blind side — then asks blue for the ROI metric. One question each.</p>`,
steps:[
 {q:'RED — most economical path against the isolated fleet?',opts:[
   {t:'Spear-phish platform engineers for cloud console access',ok:true},
   {t:'Chain two hypervisor zero-days to escape the finance seats',why:'Two zero-days is the expensive path isolation exists to make unattractive. Boards fund the cheap path first.'},
   {t:'RF side-channel capture from the datacentre car park',why:'Movie-plot territory: cost and success probability are both terrible.'}
 ]},
 {q:'BLUE — which metric best proves isolation ROI to the board?',opts:[
   {t:'Exploit-block rate and contained-execution counts from the sandbox fleet',ok:true},
   {t:'Number of security PDFs published this year',why:'Vanity metrics measure effort, not risk reduction.'},
   {t:'Count of laptops dusted monthly',why:'Cleaning statistics carry no security meaning.'}
 ]}
],
explain:`<p>Red economics: humans and cloud consoles bypass the boxes cheaply; zero-days are the expensive path isolation exists to make unattractive. Blue must show the metric the control actually produces — contained executions — not vanity numbers. Together the two answers tell the board exactly what M1048 buys and what it cannot buy.</p>`,
hint:'Cheapest door wins for red; the honest metric wins for blue.'},

{id:'X13',type:'mcq',kw:['Trade-offs and limitations'],
scenario:`<p>The regulator&rsquo;s letter: “Explain why the isolated workstation still transmitted credentials to hxxp://evil[.]example after the contained exploit.” Legal needs a defensible technical paragraph.</p>`,
question:'Which statement is accurate and defensible?',
opts:[
 {t:'Isolation contained the code; phished credentials are a threat it does not claim',ok:true},
 {t:'The isolation product failed and is being decommissioned today'},
 {t:'The user is at fault; all controls worked exactly as designed'},
 {t:'The sandbox forwards submitted passwords to attackers by design'}
],
explain:`<p>The defensible line separates what the control claims — containing code — from what happened: a human was phished. Blaming the user, lying about product failure, or inventing design flaws all collapse under scrutiny. Honest scope language wins regulatory arguments, and it is also simply true of M1048&rsquo;s boundary.</p>`,
hint:'Claim boundaries protect you — state the boundary precisely.'},

{id:'X14',type:'order',kw:['Real-world work tasks'],
scenario:`<p>A sandbox-escape CVE in the fleet&rsquo;s browser isolation component is now confirmed: PoC public, no exploitation seen yet. Order the response correctly.</p>`,
question:'Order the response steps (first to last).',
items:[
 'Confirm affected versions across the 400-node fleet',
 'Apply the vendor workaround on the exposed segments first',
 'Complete the full patch as the vendor release lands',
 'Tighten egress rules from isolated segments (lower the escape value)',
 'Add targeted detection for escape attempts and report status to the board'
],
explain:`<p>Confirm scope, protect the hottest edge, complete the patch, then lower the prize — egress lockdown makes an escape far less profitable — and finally watch and report. Leading with a fleet-wide rebuild or a board memo are the classic wrong orders: one acts before knowing, the other reports before acting.</p>`,
hint:'Scope, then stop the bleeding, then finish, then de-value, then watch.'},

{id:'X15',type:'dragdrop',kw:['Control design and layering','Isolation technologies'],
scenario:`<p>Meridian architecture triage. Drag each workload to the right shelf: is it a good home for M1048-style isolation, or should other controls come first?</p>`,
question:'Drag each workload to the correct shelf.',
buckets:['M1048-fit: isolate','Other controls first'],
items:[
 {t:'Customer tracking portal (internet-facing, T1190 magnet)',b:0},
 {t:'CFO laptop browsing (invoice-driven T1203/T1212 exposure)',b:0},
 {t:'Backup server (offline, air-gapped)',b:1},
 {t:'Legacy EDI gateway (sealed appliance, already segmented)',b:1},
 {t:'SOC analyst workstation (opens untrusted samples)',b:0},
 {t:'Core payroll database (no untrusted code, strict ACLs)',b:1}
],
explain:`<p>Isolation pays where untrusted code or content meets the workload: internet-facing portals, risky browsing, and analyst sample handling. Air-gapped backups, ACL-locked databases and already-segmented appliances answer to different controls first — forcing isolation there burns budget and adds fragility without touching the techniques M1048 claims.</p>`,
hint:'Ask: does untrusted content actually run here?'}

function renderIntro(){
  var kw='';
  EX.keywords.forEach(function(k){
    kw+='<div class="kwg"><div class="kwg-t">'+esc(k.t)+'</div><div>'+k.items.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div></div>';
  });
  var types=EX.typesList.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');
  $('intro-body').innerHTML=
    '<div class="badges"><span class="sev '+EX.sevClass+'">'+esc(EX.sevLabel)+'</span> '+
    '<span class="chip">'+EX.exercises.length+' exercises</span>'+
    '<span class="chip">'+EX.estMinutes+'-minute timer</span>'+
    '<span class="chip">Pass mark 70%</span>'+
    '<span class="chip">Hint cost −10%</span></div>'+
    '<h1>'+esc(EX.title)+'</h1>'+
    '<h2>Keywords covered in this topic</h2><div class="kwgrid">'+kw+'</div>'+
    '<h2>About this ATT&amp;CK object — read this before you start</h2>'+
    EX.intro+
    '<h2>How this exam works</h2>'+
    '<div class="notebox">'+
    '<p><b>Severity — '+esc(EX.sevLabel)+'.</b> '+esc(EX.sevMeaning)+'</p>'+
    '<p><b>Exercise types in this file.</b></p><ul>'+types+'</ul>'+
    '<p><b>Timer.</b> You have '+fmt(EX.timerSeconds)+' in total. You can pause the timer for a break; while paused, the exercise content is hidden so you cannot read ahead.</p>'+
    '<p><b>Hints.</b> One hint per exercise. A hint costs 10% of that exercise&rsquo;s points and only nudges you — it never gives the answer.</p>'+
    '<p><b>Skipping.</b> Every exercise has a Skip button. Skipped exercises move to a review pool. Before you finish, a review screen lets you return to them and answer, as long as the timer has not ended. If you submit while skipped exercises are still unanswered, they are excluded from the score: they add no points and cost no points.</p>'+
    '<p><b>Passing.</b> You pass with 70% or more, calculated only over the exercises you actually answered. On a retake, exercises and answer choices are shuffled again.</p>'+
    '</div>';
  $('btn-start').onclick=function(){startExam();};
}

/* ---------- state + timer ---------- */
function buildRuntime(i){
  var e=EX.exercises[i];
  var r=JSON.parse(JSON.stringify(e));
  r.i=i;
  if(r.type==='mcq'){r.opts=sh(r.opts);}
  else if(r.type==='match'){r.col2=sh(r.pairs.map(function(p){return p.r;}));r.assign={};r.pn=0;}
  else if(r.type==='dragdrop'){r.items=sh(r.items);r.place={};}
  else if(r.type==='order'||r.type==='rank'){r.disp=sh(r.items.map(function(t,ix){return {t:t,ix:ix};}));}
  else if(r.type==='fill'){r.bank=sh(r.bank);r.slotVals=[];for(var k=0;k<r.answers.length;k++){r.slotVals.push(null);}}
  return r;
}
function startExam(){
  S.phase='exam';S.attempt++;
  S.order=sh(EX.exercises.map(function(e,i){return i;}));
  S.idx=0;S.cur=-1;S.ans={};S.rt={};S.pool=[];S.earned=0;S.answered=0;
  S.remaining=EX.timerSeconds;S.reported=false;S.timeOver=false;S.reviewing=false;
  for(var i=0;i<EX.exercises.length;i++){S.ans[i]={state:'pending',hintUsed:false};S.rt[i]=buildRuntime(i);}
  var b=$('sev-badge');b.className='sev '+EX.sevClass;b.textContent=EX.sevLabel;
  show('scr-exam');startTimer();renderCurrent();
}
function startTimer(){clearInterval(S.tid);S.tid=setInterval(tick,1000);updateTimer();}
function tick(){
  if(S.paused){return;}
  S.remaining--;
  if(S.remaining<=0){S.remaining=0;updateTimer();onTimeOver();return;}
  updateTimer();
}
function updateTimer(){
  var t=$('timer');if(t){t.textContent=fmt(S.remaining);t.className='tb-timer'+(S.remaining<120?' low':'');}
}
function onTimeOver(){
  S.timeOver=true;clearInterval(S.subTid);
  if(S.cur>=0&&!graded(S.cur)&&!inPool(S.cur)){
    S.ans[S.cur].state='pending';
    S.pool.push(S.cur);updateRevChip();
  }
  openReview();
}
function setPaused(p){
  S.paused=p;
  $('pause-cover').style.display=p?'flex':'none';
  $('btn-pause').textContent=p?'Resume':'Pause';
}

/* ---------- header ---------- */
function updateHeader(){
  var c=$('ex-counter');
  if(S.reviewing){c.textContent='Reviewing skipped — '+S.pool.length+' left';}
  else if(S.idx<S.order.length){c.textContent='Exercise '+(S.idx+1)+' of '+S.order.length;}
  else{c.textContent='All exercises done';}
  var pct=S.answered?Math.round(S.earned/(S.answered*10)*100):null;
  $('score').textContent='Score '+(pct===null?'—':pct+'%');
  updateRevChip();
}
function updateRevChip(){
  var b=$('btn-review');
  b.style.display=(S.pool.length&&!S.timeOver)?'inline-block':'none';
  $('rev-n').textContent=S.pool.length;
}

/* ---------- exercise rendering ---------- */
function renderCurrent(){
  S.reviewing=false;
  S.cur=S.order[S.idx];
  renderExercise(S.cur);
}
function scnHtml(r){
  var out='';
  if(r.artefacts&&r.artefacts.length){
    r.artefacts.forEach(function(a,ix){
      out+='<div class="art"><div class="art-h">Artefact '+(ix+1)+' — '+esc(a.label)+'</div><div class="art-b">'+
        (a.mono?'<pre class="monoblock">'+hl(a.text)+'</pre>':a.text)+'</div></div>';
    });
  }
  if(r.scenario){out+=r.scenario;}
  return out;
}
function renderExercise(i){
  var r=S.rt[i];S.cur=i;updateHeader();
  var prog=S.reviewing
    ?Math.round(((EX.exercises.length-S.pool.length)/EX.exercises.length)*100)
    :Math.round((S.idx/S.order.length)*100);
  var html='<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+prog+'"><i style="width:'+prog+'%"></i></div>';
  html+='<div class="blk scenario"><div class="blk-h"><span aria-hidden="true">▤</span> Scenario</div><div class="blk-b">';
  if(r.long){
    html+='<div class="scn-sum"><span class="sum">'+esc(r.summary)+'</span><button class="btn" id="scn-toggle">Show scenario</button></div>'+
          '<div id="scn-full" style="display:none">'+scnHtml(r)+'</div>';
  }else{
    html+=scnHtml(r);
  }
  html+='</div></div>';
  html+='<div class="blk question"><div class="blk-h"><span aria-hidden="true">?</span> Question</div><div class="blk-b"><p class="qtext">'+esc(r.question||'')+'</p></div></div>';
  html+='<div id="hint-area"></div>';
  html+='<div class="blk answer"><div class="blk-h"><span aria-hidden="true">▸</span> Your answer</div><div class="blk-b" id="ans-body"></div></div>';
  html+='<div class="actbar"><button id="btn-submit" class="btn primary">Submit answer</button>'+
        '<button id="btn-next" class="btn primary" style="display:none"></button></div>';
  html+='<div id="fb-area" aria-live="polite"></div>';
  $('exam-main').innerHTML=html;
  buildWidget(r,i);
  wireCommon(r,i);
  if(S.reviewing){
    $('btn-next').textContent='Back to review';
  }else{
    $('btn-next').textContent=(S.idx===S.order.length-1)
      ?(S.pool.length?'Review skipped':'See results')
      :'Next exercise';
  }
  if(r.type==='terminal'&&r.subTimer&&!graded(i)){startSub(r);}
}
function wireCommon(r,i){
  var st=$('scn-toggle');
  if(st){st.onclick=function(){var f=$('scn-full');var open=f.style.display==='none';f.style.display=open?'block':'none';st.textContent=open?'Collapse scenario':'Show scenario';};}
  $('btn-submit').onclick=function(){var res=gradeWidget(r,i);if(res){applyResult(i,res);}};
  $('btn-next').onclick=function(){afterNext(i);};
  $('btn-hint').onclick=function(){giveHint(i);};
  var sk=$('btn-skip');sk.disabled=graded(i);sk.onclick=function(){doSkip(i);};
  var needsSubmit=(r.type!=='decision'&&r.type!=='terminal');
  $('btn-submit').style.display=needsSubmit?'inline-block':'none';
  $('btn-submit').disabled=needsSubmit;   /* widgets enable it when ready */
  $('btn-hint').disabled=graded(i);
  if(S.ans[i].hintUsed){showHintText(i);}
}

/* ---------- hint ---------- */
function giveHint(i){
  if(graded(i)||S.ans[i].hintUsed){return;}
  S.ans[i].hintUsed=true;showHintText(i);$('btn-hint').disabled=true;
}
function showHintText(i){
  var t=EX.exercises[i].hint||'';
  $('hint-area').innerHTML='<div class="hintbox" role="note"><b>Hint</b> (cost: 10% of this exercise&rsquo;s points) — '+esc(t)+'</div>';
}

/* ---------- skip / navigation ---------- */
function doSkip(i){
  if(graded(i)){return;}
  clearInterval(S.subTid);
  S.ans[i].state='pending';
  if(S.pool.indexOf(i)<0){S.pool.push(i);}
  updateRevChip();
  if(S.reviewing){openReview();return;}
  advance();
}
function advance(){
  S.idx++;
  if(S.idx>=S.order.length){
    if(S.pool.length){openReview();}else{finishExam();}
  }else{renderCurrent();}
}
function afterNext(i){
  if(!graded(i)&&S.reviewing){openReview();return;}  /* leave without answering */
  if(!graded(i)){return;}
  clearInterval(S.subTid);
  if(S.reviewing){
    var p=S.pool.indexOf(i);if(p>=0){S.pool.splice(p,1);}
    updateRevChip();
    if(S.pool.length){openReview();}else{finishExam();}
    return;
  }
  advance();
}

/* ---------- scoring + feedback ---------- */
function submitProg(i,res){if(graded(i)){return;}applyResult(i,res);}
function applyResult(i,res){
  clearInterval(S.subTid);
  var a=S.ans[i];
  a.state=res.ok?'correct':'incorrect';
  a.given=res.given||'';
  if(res.ok){S.earned+=(a.hintUsed?9:10);}
  S.answered++;
  var p=S.pool.indexOf(i);if(p>=0){S.pool.splice(p,1);}
  updateRevChip();
  markUp(r(i),i);
  renderFeedback(i,res);
  updateHeader();
  $('btn-submit').style.display='none';
  var nb=$('btn-next');nb.style.display='inline-block';nb.focus();
  disableWidget();
}
function r(i){return S.rt[i];}
function renderFeedback(i,res){
  var e=EX.exercises[i],a=S.ans[i];
  var head=res.ok
    ?'<span class="mark" aria-hidden="true">✓</span> CORRECT'
    :'<span class="mark" aria-hidden="true">✗</span> INCORRECT';
  var fb='<div class="fb '+(res.ok?'good':'bad')+'"><div class="fb-h">'+head+'</div><div class="fb-b">';
  fb+='<p><span class="corr">Correct answer:</span> '+correctText(e)+'</p>';
  if(!res.ok&&res.detail){fb+='<p><b>Yours:</b> '+esc(res.detail)+'</p>';}
  fb+='<div>'+e.explain+'</div>';
  if(!res.ok){fb+='<p class="study"><b>What to study:</b> '+esc(e.study||'Re-read the “About this ATT&CK object” section on the start screen, then try this exercise again on your next attempt.')+'</p>';}
  if(e.type==='terminal'){fb+=terminalExtras(e);}
  fb+='</div></div>';
  $('fb-area').innerHTML=fb;
  var cp=$('btn-copy');
  if(cp){cp.onclick=function(){
    var txt=EX.exercises[i].expected;
    try{navigator.clipboard.writeText(txt);cp.textContent='Copied ✓';}catch(err){cp.textContent='Select the text manually';}
  };}
}
function disableWidget(){
  var els=$('ans-body').querySelectorAll('button,input');
  for(var k=0;k<els.length;k++){els[k].disabled=true;}
}

/* ---------- per-type correct answer text (authored data) ---------- */
function correctText(e){
  var t=e.type;
  if(t==='mcq'){var o=null;e.opts.forEach(function(x){if(x.ok){o=x.t;}});return esc(o||'');}
  if(t==='match'){return e.pairs.map(function(p){return esc(p.l)+' → '+esc(p.r);}).join(' · ');}
  if(t==='dragdrop'){return e.buckets.map(function(b,ix){
    var its=e.items.filter(function(it){return it.b===ix;}).map(function(it){return esc(it.t);});
    return esc(b)+': '+(its.length?its.join('; '):'(empty)');
  }).join(' · ');}
  if(t==='order'||t==='rank'){return e.items.map(function(x){return esc(x);}).join(' → ');}
  if(t==='fill'){return esc(e.text).replace(/\{(\d+)\}/g,function(m,n){return '<b>'+esc(e.answers[+n])+'</b>';});}
  if(t==='logline'){var ln=null;e.lines.forEach(function(x){if(x.id===e.correct){ln=x.t;}});return '<span class="kbd">'+esc(ln||'')+'</span>';}
  if(t==='spot'){var tk='';e.tokens.forEach(function(x){if(x.ok){tk=x.t;}});return '<span class="kbd">'+esc(tk)+'</span>';}
  if(t==='decision'){var chain=[];e.steps.forEach(function(s){s.opts.forEach(function(o){if(o.ok){chain.push(o.t);}});});return chain.map(esc).join(' → ');}
  if(t==='terminal'){return '<span class="kbd">'+esc(e.expected)+'</span>';}
  return '';
}
function markUp(r,i){
  var ok=S.ans[i].state==='correct';
  var body=$('ans-body');
  if(r.type==='mcq'){
    r.opts.forEach(function(o,ix){
      var b=body.querySelector('[data-ix="'+ix+'"]');if(!b){return;}
      if(o.ok){b.classList.add('good');var l=b.querySelector('.lab');if(l){l.innerHTML+=' <span aria-hidden="true">✓</span>';}}
      else if(b.classList.contains('sel')&&!ok){b.classList.add('bad');var l2=b.querySelector('.lab');if(l2){l2.innerHTML+=' <span aria-hidden="true">✗</span>';}}
    });
  }else if(r.type==='logline'){
    r.lines.forEach(function(ln,ix){
      var b=body.querySelector('[data-ix="'+ix+'"]');if(!b){return;}
      if(ln.id===r.correct){b.classList.add('good');}
      else if(ix===r._selIx&&!ok){b.classList.add('bad');}
    });
  }else if(r.type==='spot'){
    r.tokens.forEach(function(tk,ix){
      var b=body.querySelector('[data-ix="'+ix+'"]');if(!b||tk.nl){return;}
      if(tk.ok){b.classList.add('good');}
      else if(ix===r._selIx&&!ok){b.classList.add('bad');}
    });
  }else if(r.type==='fill'){
    var slots=body.querySelectorAll('.slot');
    r.slotVals.forEach(function(v,ix){
      if(!slots[ix]){return;}
      slots[ix].style.borderBottomColor=(v===r.answers[ix])?'#3ecf8e':'#ff5c6c';
    });
  }
}

/* ---------- review screen ---------- */
function stripQ(q){return String(q).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').slice(0,110);}
function openReview(){
  show('scr-review');updateTimer();
  var list=$('review-list');
  $('review-note').textContent=S.timeOver
    ?'Time is over. Skipped exercises can no longer be answered — finish to see your results. Unanswered exercises are excluded from the score.'
    :'You can return to any skipped exercise and answer it while the exam timer runs. Unanswered skipped exercises are excluded from the score entirely.';
  if(S.pool.length){
    list.innerHTML=S.pool.map(function(i){
      var e=EX.exercises[i];
      return '<div class="rvitem"><div><b>Exercise '+(i+1)+'</b> — '+esc(stripQ(e.question||e.summary||''))+'</div>'+
             (S.timeOver?'<span class="st s">⚠ Not answered — excluded</span>'
                         :'<button class="btn" data-ans="'+i+'">Answer</button>')+'</div>';
    }).join('');
    list.querySelectorAll('[data-ans]').forEach(function(b){
      b.onclick=function(){S.reviewing=true;renderExercise(+b.getAttribute('data-ans'));show('scr-exam');};
    });
  }else{
    list.innerHTML='<p class="muted">No skipped exercises left.</p>';
  }
  $('btn-back').style.display=(!S.timeOver&&S.cur>=0&&!graded(S.cur)&&!inPool(S.cur))?'inline-block':'none';
}
function finishConfirm(){
  if(S.pool.length&&!S.timeOver){
    $('modal-body').innerHTML='<h3>Submit with skipped exercises?</h3><p>'+S.pool.length+' skipped exercise(s) still have no answer. If you submit now, they are excluded from the score: they add no points and cost no points. You can also go back and answer them while time remains.</p>';
    $('modal').style.display='flex';
  }else{
    finishExam();
  }
}
function closeModal(){$('modal').style.display='none';}

/* ---------- results + reporting ---------- */
function dateStr(){try{return new Date().toISOString().slice(0,10);}catch(e){return '';}}
function finishExam(){
  S.phase='done';clearInterval(S.tid);clearInterval(S.subTid);setPaused(false);
  show('scr-results');renderResults();reportScore();
}
function computeScore(){
  var nC=0,nW=0;
  EX.exercises.forEach(function(e,i){
    var a=S.ans[i];
    if(a.state==='correct'){nC++;}else if(a.state==='incorrect'){nW++;}
  });
  var total=nC+nW;
  var pct=total?Math.round(nC/total*100):0;
  return {c:nC,w:nW,t:total,pct:pct,pass:(total>0&&pct>=70)};
}
function renderResults(){
  var s=computeScore();
  var themes={};
  EX.exercises.forEach(function(e,i){
    (e.kw||[]).forEach(function(k){
      themes[k]=themes[k]||{c:0,n:0};
      var a=S.ans[i];
      if(a.state==='correct'||a.state==='incorrect'){themes[k].n++;if(a.state==='correct'){themes[k].c++;}}
    });
  });
  var chips=Object.keys(themes).map(function(k){return '<span class="chip">'+esc(k)+': '+themes[k].c+'/'+themes[k].n+'</span>';}).join('');
  var html='<h1>Results — '+esc(EX.title)+'</h1>';
  html+='<div class="rescard"><div class="bigpct">'+s.pct+'%</div>'+
        '<p><span class="st '+(s.pass?'c':'w')+'" style="font-size:16px">'+(s.pass?'✓ PASS':'✗ FAIL')+'</span></p>'+
        '<div class="pbar"><i style="width:'+Math.min(s.pct,100)+'%"></i></div>'+
        '<p>Score '+s.c+' correct out of '+s.t+' answered. Pass mark: 70%.</p>'+
        '<p class="muted">✓ Correct: '+s.c+' · ✗ Incorrect: '+s.w+' · ⚠ Not answered (excluded from score): '+(EX.exercises.length-s.t)+'</p>'+
        '<div>'+chips+'</div></div>';
  if(s.pass){
    html+='<div class="paspanel"><h2>Certificate of completion</h2>'+
      '<p class="cert-line">This certifies that <b>'+esc(S.user||'the candidate')+'</b> passed the practice exam</p>'+
      '<p class="cert-line"><b>'+esc(EX.title)+'</b></p>'+
      '<p class="cert-line">Score '+s.pct+'% · MITRE ATT&amp;CK mitigation M1048 — Application Isolation · '+dateStr()+'</p></div>';
  }else{
    html+='<div class="rescard"><p><b>You did not reach the pass mark this time.</b> Study the report below, then retake the exam — exercises and answer choices are shuffled again on every attempt.</p></div>';
  }
  html+='<h2>Detailed report</h2>';
  html+=EX.exercises.map(function(e,i){return repRow(e,i);}).join('');
  $('res-main').innerHTML=html;
  $('btn-retake').onclick=function(){startExam();};
}
function repRow(e,i){
  var a=S.ans[i],st,cl;
  if(a.state==='correct'){st='✓ Correct';cl='c';}
  else if(a.state==='incorrect'){st='✗ Incorrect';cl='w';}
  else{st='⚠ Not answered — excluded from score';cl='s';}
  var h='<div class="rrow"><div class="rrow-h"><span class="st '+cl+'">'+st+'</span><span>Exercise '+(i+1)+'</span>'+
        '<span class="muted" style="font-weight:400;font-size:13.5px">'+(e.kw||[]).map(esc).join(' · ')+'</span></div>';
  if(a.given){h+='<p style="margin:8px 0 2px"><b>Your answer:</b> '+esc(a.given)+'</p>';}
  if(a.state!=='correct'){h+='<p style="margin:2px 0"><b>Correct answer:</b> '+correctText(e)+'</p>';}
  h+='<div class="exp">'+e.explain+'</div>';
  if(a.state==='incorrect'){h+='<p class="study" style="margin:6px 0 0"><b>What to study:</b> '+esc(e.study||'Re-read the “About this ATT&CK object” section on the start screen.')+'</p>';}
  h+='</div>';
  return h;
}
function reportScore(){
  if(S.reported){return;}
  S.reported=true;
  var s=computeScore();
  try{
    parent.postMessage({
      type:'CYBERPULSE_SCORE',
      topicId:EX.topicId,
      batch:EX.batch,
      score:s.c,
      total:s.t,
      percent:s.pct,
      passed:s.pass
    },location.origin);
  }catch(e){/* opened directly, not inside the site — nothing to report to */}
}


/* ---------- widgets ---------- */
function ready(){$('btn-submit').disabled=false;}
function buildWidget(r,i){
  var el=$('ans-body');
  if(r.type==='mcq'){wMcq(r,el);}
  else if(r.type==='match'){wMatch(r,el);}
  else if(r.type==='dragdrop'){wDrag(r,el);}
  else if(r.type==='order'||r.type==='rank'){wOrder(r,el);}
  else if(r.type==='fill'){wFill(r,el);}
  else if(r.type==='logline'){wLog(r,el);}
  else if(r.type==='spot'){wSpot(r,el);}
  else if(r.type==='decision'){wDecision(r,el,i);}
  else if(r.type==='terminal'){wTerminal(r,el,i);}
}
function wMcq(r,el){
  el.innerHTML=r.opts.map(function(o,ix){
    return '<button class="opt" data-ix="'+ix+'" role="radio" aria-checked="false"><span class="lab">'+String.fromCharCode(65+ix)+'.</span><span>'+esc(o.t)+'</span></button>';
  }).join('');
  el.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      el.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');x.setAttribute('aria-checked','false');});
      b.classList.add('sel');b.setAttribute('aria-checked','true');
      r._sel=+b.getAttribute('data-ix');ready();
    };
  });
}
function wMatch(r,el){
  var L=r.pairs.map(function(p,ix){
    return '<button class="opt" data-l="'+ix+'"><span class="lab">'+String.fromCharCode(65+ix)+'.</span><span>'+esc(p.l)+'</span><span class="pairn" style="display:none"></span></button>';
  }).join('');
  var R=r.col2.map(function(t,ix){
    return '<button class="opt" data-r="'+ix+'"><span class="lab">'+(ix+1)+'.</span><span>'+esc(t)+'</span><span class="pairn" style="display:none"></span></button>';
  }).join('');
  el.innerHTML='<div class="grid2"><div><div class="mcol-h">Items</div>'+L+'</div><div><div class="mcol-h">Matches</div>'+R+'</div></div>'+
    '<p class="muted" style="font-size:14px">Select an item on the left, then its match on the right. Select a paired item again to undo the pair.</p>';
  var selL=-1;
  function paint(b,n){var pn=b.querySelector('.pairn');pn.style.display='inline-block';pn.textContent=n;pn.className='pairn p'+(((n-1)%5)+1);}
  function unpaint(b){var pn=b.querySelector('.pairn');pn.style.display='none';pn.textContent='';}
  el.querySelectorAll('[data-l]').forEach(function(b){
    b.onclick=function(){
      var ix=+b.getAttribute('data-l');
      if(r.assign[ix]!==undefined){
        unpaint(b);
        var rb=el.querySelector('[data-r="'+r.assign[ix]+'"]');if(rb){unpaint(rb);}
        delete r.assign[ix];selL=-1;check();
        return;
      }
      selL=ix;
      el.querySelectorAll('[data-l]').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
    };
  });
  el.querySelectorAll('[data-r]').forEach(function(b){
    b.onclick=function(){
      if(selL<0){return;}
      var rix=+b.getAttribute('data-r');
      Object.keys(r.assign).forEach(function(k){
        if(r.assign[k]===rix){
          var lb=el.querySelector('[data-l="'+k+'"]');
          if(lb){unpaint(lb);}
          delete r.assign[k];
        }
      });
      r.assign[selL]=rix;
      var lb=el.querySelector('[data-l="'+selL+'"]');
      lb.classList.remove('sel');
      r.pn++;paint(lb,r.pn);paint(b,r.pn);
      selL=-1;check();
    };
  });
  function check(){
    var done=r.pairs.every(function(p,ix){return r.assign[ix]!==undefined;});
    if(done){ready();}
  }
}
function wDrag(r,el){
  var bank='<div class="dzcol"><div class="dz" data-z="-1"><div class="dz-t">Item bank — drag out or select then choose a zone</div><div class="dlist"></div></div></div>';
  var zones='<div class="dzcol">'+r.buckets.map(function(b,ix){
    return '<div class="dz" data-z="'+ix+'"><div class="dz-t">'+esc(b)+'</div><div class="dlist"></div></div>';
  }).join('')+'</div>';
  el.innerHTML='<div class="dzflex">'+bank+zones+'</div>';
  function addItem(t,ix,zone){
    var b=document.createElement('button');
    b.className='ditem';b.draggable=true;b.setAttribute('data-ix',ix);
    b.innerHTML='<span aria-hidden="true">⠿</span> '+esc(t);
    b.addEventListener('dragstart',function(ev){try{ev.dataTransfer.setData('text/plain',String(ix));}catch(e){}});
    b.onclick=function(){
      el.querySelectorAll('.ditem').forEach(function(x){x.classList.remove('sel');});
      if(b.classList.contains('sel')){b.classList.remove('sel');r._selItem=-1;return;}
      b.classList.add('sel');r._selItem=ix;
    };
    zone.appendChild(b);
  }
  function mount(){
    el.querySelectorAll('.dlist').forEach(function(d){d.innerHTML='';});
    r.items.forEach(function(it,ix){
      var z=r.place[ix];
      var zone=(z===undefined||z===-1)?el.querySelector('[data-z="-1"] .dlist'):el.querySelector('[data-z="'+z+'"] .dlist');
      addItem(it.t,ix,zone);
    });
    check();
  }
  el.querySelectorAll('.dz').forEach(function(z){
    z.addEventListener('dragover',function(ev){ev.preventDefault();z.classList.add('over');});
    z.addEventListener('dragleave',function(){z.classList.remove('over');});
    z.addEventListener('drop',function(ev){
      ev.preventDefault();z.classList.remove('over');
      var ix=+ev.dataTransfer.getData('text/plain');
      move(ix,+z.getAttribute('data-z'));
    });
    z.addEventListener('click',function(ev){
      if(ev.target.closest('.ditem')){return;}
      if(r._selItem!==undefined&&r._selItem>=0){move(r._selItem,+z.getAttribute('data-z'));}
    });
  });
  function move(ix,z){
    r.place[ix]=z;r._selItem=-1;mount();
  }
  function check(){
    var done=r.items.every(function(it,ix){return r.place[ix]!==undefined&&r.place[ix]>=0;});
    if(done){ready();}else{$('btn-submit').disabled=true;}
  }
  mount();
}
function wOrder(r,el){
  var label=(r.type==='rank')?'Rank the items — best first. Use the arrows or drag.':'Put the steps in the right order. Use the arrows or drag.';
  el.innerHTML='<p class="muted" style="font-size:14px">'+label+'</p><ol class="olist"></ol>';
  var ol=el.querySelector('.olist');
  function mount(){
    ol.innerHTML=r.disp.map(function(it,row){
      return '<li draggable="true" data-row="'+row+'"><span class="pos">'+(row+1)+'</span><span class="ot">'+esc(it.t)+'</span>'+
        '<span><button class="btn mv" data-mv="up" aria-label="Move up">▲</button>'+
        '<button class="btn mv" data-mv="down" aria-label="Move down">▼</button></span></li>';
    }).join('');
    ready();  /* an ordering is always a complete answer */
    ol.querySelectorAll('li').forEach(function(li){
      var row=+li.getAttribute('data-row');
      li.addEventListener('dragstart',function(ev){try{ev.dataTransfer.setData('text/plain',String(row));}catch(e){}});
      li.addEventListener('dragover',function(ev){ev.preventDefault();});
      li.addEventListener('drop',function(ev){
        ev.preventDefault();
        var src=+ev.dataTransfer.getData('text/plain');
        reorder(src,row);
      });
    });
    ol.querySelectorAll('[data-mv]').forEach(function(b){
      b.onclick=function(){
        var row=+b.closest('li').getAttribute('data-row');
        var d=b.getAttribute('data-mv')==='up'?-1:1;
        reorder(row,row+d);
      };
    });
  }
  function reorder(src,dst){
    if(dst<0||dst>=r.disp.length||src===dst){return;}
    var it=r.disp.splice(src,1)[0];
    r.disp.splice(dst,0,it);
    mount();
  }
  mount();
}
function wFill(r,el){
  var parts=r.text.split(/\{\d+\}/);
  var html='<p class="filltext">';
  for(var k=0;k<parts.length;k++){
    html+=esc(parts[k]);
    if(k<r.answers.length){html+='<button class="slot" data-s="'+k+'">____</button>';}
  }
  html+='</p><div class="bank">'+r.bank.map(function(w,ix){
    return '<button class="wchip" data-w="'+ix+'">'+esc(w)+'</button>';
  }).join('')+'</div>';
  el.innerHTML=html;
  function slots(){return el.querySelectorAll('.slot');}
  function chips(){return el.querySelectorAll('.wchip');}
  function paint(){
    slots().forEach(function(s,ix){
      s.textContent=r.slotVals[ix]==null?'____':r.slotVals[ix];
    });
    chips().forEach(function(c){
      var w=r.bank[+c.getAttribute('data-w')];
      c.disabled=r.slotVals.indexOf(w)>=0;
    });
    var full=r.slotVals.every(function(v){return v!=null;});
    if(full){ready();}
  }
  chips().forEach(function(c){
    c.onclick=function(){
      var w=r.bank[+c.getAttribute('data-w')];
      var k=r.slotVals.indexOf(null);
      if(k<0){return;}
      r.slotVals[k]=w;paint();
    };
  });
  slots().forEach(function(s){
    s.onclick=function(){
      var ix=+s.getAttribute('data-s');
      r.slotVals[ix]=null;
      $('btn-submit').disabled=true;paint();
    };
  });
  paint();
}
function wLog(r,el){
  el.innerHTML='<input class="filter" id="log-filter" type="text" placeholder="Filter lines (plain text)…" aria-label="Filter log lines">'+
    r.lines.map(function(ln,ix){
      return '<button class="lline" data-ix="'+ix+'"><span class="ln">'+(ix+1)+'</span><code>'+hl(ln.t)+'</code></button>';
    }).join('');
  var f=$('log-filter');
  f.addEventListener('input',function(){
    var q=f.value.trim().toLowerCase();
    el.querySelectorAll('.lline').forEach(function(b){
      var txt=b.textContent.toLowerCase();
      b.classList.toggle('hide',!!q&&txt.indexOf(q)<0);
    });
  });
  el.querySelectorAll('.lline').forEach(function(b){
    b.onclick=function(){
      el.querySelectorAll('.lline').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
      r._selIx=+b.getAttribute('data-ix');ready();
    };
  });
}
function wSpot(r,el){
  el.innerHTML='<div class="snippet">'+r.tokens.map(function(tk,ix){
    if(tk.nl){return '<br>';}
    return '<button class="token" data-ix="'+ix+'">'+esc(tk.t)+'</button>';
  }).join('')+'</div>'+
  '<p class="muted" style="font-size:14px">Click one token in the snippet, then submit.</p>';
  el.querySelectorAll('.token').forEach(function(b){
    b.onclick=function(){
      el.querySelectorAll('.token').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
      r._selIx=+b.getAttribute('data-ix');ready();
    };
  });
}
function wDecision(r,el,i){
  r._step=0;r._path=[];
  renderStep(r,el,i);
}
function renderStep(r,el,i){
  var st=r.steps[r._step];
  el.innerHTML='<span class="stepbadge">STEP '+(r._step+1)+' OF '+r.steps.length+'</span>'+
    '<p class="qtext">'+esc(st.q)+'</p>'+
    st.opts.map(function(o,ix){
      return '<button class="opt" data-ix="'+ix+'"><span class="lab">'+String.fromCharCode(65+ix)+'.</span><span>'+esc(o.t)+'</span></button>';
    }).join('');
  el.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      var o=st.opts[+b.getAttribute('data-ix')];
      r._path.push(o.t);
      if(o.ok){
        r._step++;
        if(r._step>=r.steps.length){submitProg(i,{ok:true,given:r._path.join(' → ')});}
        else{renderStep(r,el,i);}
      }else{
        submitProg(i,{ok:false,given:r._path.join(' → '),detail:o.why||''});
      }
    };
  });
}
function wTerminal(r,el,i){
  el.innerHTML=(r.subTimer?'<div class="subtimer" id="sub-timer">Exercise limit: '+r.subTimer+'s</div>':'')+
    '<div class="term"><div class="term-bar"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>'+
    '<span class="term-title">'+esc(r.termTitle)+'</span></div>'+
    '<div class="term-out" id="term-out">'+esc(r.banner||'')+'</div>'+
    '<div class="term-line"><span class="term-p">'+esc(r.prompt)+'</span>'+
    '<input class="term-in" id="term-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type your command"></div></div>'+
    '<div class="actbar"><button class="btn" id="term-run">Run command</button></div>';
  var out=$('term-out'),inp=$('term-in');
  function done(){inp.disabled=true;$('term-run').disabled=true;}
  function run(){
    var cmd=inp.value;
    if(!cmd.trim()||graded(i)){return;}
    out.textContent+='\n'+r.prompt+' '+cmd;
    inp.value='';
    var norm=cmd.trim().replace(/\s+/g,' ').toLowerCase();
    if(norm===r.expected.toLowerCase()){
      out.textContent+='\n'+(r.goodOut||'OK');
      submitProg(i,{ok:true,given:cmd.trim()});
      done();
    }else{
      var d=null,w=null;
      (r.dangerous||[]).forEach(function(x){if(x.cmd.toLowerCase()===norm){d=x;}});
      (r.wrong||[]).forEach(function(x){if(x.cmd.toLowerCase()===norm){w=x;}});
      if(d){out.textContent+='\n'+(d.out||'…');submitProg(i,{ok:false,given:cmd.trim(),detail:d.why});done();}
      else if(w){out.textContent+='\n'+(w.out||'…');submitProg(i,{ok:false,given:cmd.trim(),detail:w.why});done();}
      else{out.textContent+='\nbash: '+norm.split(' ')[0]+': command not found';}
    }
    out.scrollTop=out.scrollHeight;
  }
  $('term-run').onclick=run;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){run();}});
  inp.focus();
}
function startSub(r){
  clearInterval(S.subTid);
  S.subLeft=r.subTimer;
  S.subTid=setInterval(function(){
    if(S.paused){return;}
    S.subLeft--;
    var el=$('sub-timer');
    if(el){el.textContent='Exercise limit: '+S.subLeft+'s';}
    if(S.subLeft<=0){
      clearInterval(S.subTid);
      if(!graded(S.cur)){
        S.ans[S.cur].state='pending';
        if(S.pool.indexOf(S.cur)<0){S.pool.push(S.cur);}
        updateRevChip();
        $('fb-area').innerHTML='<div class="fb bad"><div class="fb-h"><span class="mark" aria-hidden="true">⚠</span> EXERCISE TIME LIMIT REACHED</div><div class="fb-b"><p>The reduced limit for this terminal exercise ran out before you ran a valid command. The exercise moved to the skipped pool — you can return to it from the review screen while the exam timer still runs.</p></div></div>';
        $('btn-submit').style.display='none';
        var nb=$('btn-next');nb.style.display='inline-block';nb.focus();
        disableWidget();
      }
    }
  },1000);
}
function terminalExtras(e){
  var s='<p><b>Canonical command (copyable):</b></p><pre class="monoblock" id="canon-cmd">'+esc(e.expected)+'</pre>'+
        '<div class="actbar"><button class="btn" id="btn-copy">Copy command</button></div>';
  if(e.parts&&e.parts.length){
    s+='<p><b>What each part does:</b></p><ul>'+e.parts.map(function(p){
      return '<li><span class="kbd">'+esc(p.p)+'</span> — '+esc(p.d)+'</li>';
    }).join('')+'</ul>';
  }
  if(e.warn){s+='<p class="study">'+esc(e.warn)+'</p>';}
  return s;
}

/* ---------- grading ---------- */
function gradeWidget(r,i){
  if(graded(i)){return null;}
  var a=null;
  if(r.type==='mcq'){
    if(r._sel==null){return null;}
    a={ok:!!r.opts[r._sel].ok,given:String.fromCharCode(65+r._sel)+'. '+r.opts[r._sel].t};
  }else if(r.type==='match'){
    var done=r.pairs.every(function(p,ix){return r.assign[ix]!==undefined;});
    if(!done){return null;}
    var ok=r.pairs.every(function(p,ix){return r.col2[r.assign[ix]]===p.r;});
    a={ok:ok,given:r.pairs.map(function(p,ix){return p.l+' → '+r.col2[r.assign[ix]];}).join(' | ')};
  }else if(r.type==='dragdrop'){
    var placed=r.items.every(function(it,ix){return r.place[ix]!==undefined&&r.place[ix]>=0;});
    if(!placed){return null;}
    var ok=r.items.every(function(it,ix){return r.place[ix]===it.b;});
    a={ok:ok,given:r.buckets.map(function(b,bx){
      var its=r.items.filter(function(it,ix){return r.place[ix]===bx;}).map(function(it){return it.t;});
      return b+': '+(its.length?its.join('; '):'(empty)');
    }).join(' | ')};
  }else if(r.type==='order'||r.type==='rank'){
    var ok=r.disp.every(function(it,ix){return it.ix===ix;});
    a={ok:ok,given:r.disp.map(function(it){return it.t;}).join(' → ')};
  }else if(r.type==='fill'){
    var full=r.slotVals.every(function(v){return v!=null;});
    if(!full){return null;}
    var ok=r.slotVals.every(function(v,ix){return v===r.answers[ix];});
    a={ok:ok,given:r.slotVals.join(' / ')};
  }else if(r.type==='logline'){
    if(r._selIx==null){return null;}
    var ln=r.lines[r._selIx];
    a={ok:ln.id===r.correct,given:ln.t};
  }else if(r.type==='spot'){
    if(r._selIx==null){return null;}
    a={ok:r.tokens[r._selIx].ok===true,given:r.tokens[r._selIx].t};
  }
  return a;
}

/* ---------- boot ---------- */
window.addEventListener('message',function(event){
  if(!event.data){return;}
  var t=event.data.type;
  if(t!=='CYBERPULSE_INIT'&&t!=='CYBERMASTERY_INIT'){return;}
  S.user=event.data.username||'';
});
function boot(){
  renderIntro();show('scr-intro');
  $('btn-pause').onclick=function(){setPaused(!S.paused);};
  $('btn-resume').onclick=function(){setPaused(false);};
  $('btn-review').onclick=function(){openReview();};
  $('btn-back').onclick=function(){show('scr-exam');};
  $('btn-finish').onclick=function(){finishConfirm();};
  $('modal-ok').onclick=function(){closeModal();finishExam();};
  $('modal-cancel').onclick=function(){closeModal();};
  updateTimer();
}
boot();
