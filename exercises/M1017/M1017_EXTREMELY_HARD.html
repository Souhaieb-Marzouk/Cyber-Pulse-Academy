<script>
var EXAM={"topicId": "m1017", "batch": 4, "title": "M1017 User Training \u2014 EXTREMELY HARD", "severity": "xhard", "severityLabel": "EXTREMELY HARD", "passMark": 70, "minutes": 75, "exCount": 16, "intro": {"entity": "\n<p><b>What M1017 is.</b> M1017 is a <b>Mitigation</b> in MITRE ATT&amp;CK. ATT&amp;CK is a big catalogue that describes how attackers really work. A mitigation is ATT&amp;CK's way of saying: <i>here is how you can stop or weaken this behaviour</i>. M1017 is called <b>User Training</b>. It means teaching employees and contractors to spot, avoid, and report attacks that try to trick people, such as phishing and social engineering. Imagine a coworker gets an email that says &quot;your parcel is waiting &mdash; click here&quot;. A trained coworker sees the warning signs, does not click, and reports the email. That is this mitigation at work.</p>\n<p><b>Why it matters.</b> Many attacks do not break through computers &mdash; they trick people. ATT&amp;CK gives the tricks names like Phishing (T1566), Spearphishing Link (T1566.002), Impersonation (T1684.001), or MFA Request Generation (T1621, when an attacker sends push notifications until somebody approves one). Training turns staff into a &quot;human firewall&quot;: an extra layer of defence made of people.</p>\n<p><b>Who uses it at work.</b> A <b>security awareness coordinator</b> builds the yearly programme, runs fake phishing tests (simulations), and measures click and report rates. A <b>SOC analyst</b> receives what users report and decides what is real. A <b>GRC analyst</b> maps user training to frameworks such as NIST CSF (the PR.AT family), CIS Control 14, and ISO 27001 (A.6.3), and shows evidence to auditors. A <b>threat intelligence analyst</b> reads ATT&amp;CK and tells the trainer which tricks are common right now, so lessons stay current. <b>Incident responders</b> feed lessons from real incidents back into the training. Managers and the CISO use the numbers to decide if the programme works.</p>\n<p><b>What good training includes.</b> Short and regular lessons; role-specific training for people at higher risk (finance staff, helpdesk, executives); phishing simulations with kind, non-punitive follow-up; a one-click report button; onboarding training for new joiners; periodic refreshers; and real case studies.</p>\n<p><b>What it can and cannot do.</b> Training is mainly a <b>preventive</b> control: it lowers the chance that a trick works. It also creates a <b>detective</b> channel, because trained users report attacks fast. But it cannot stop everything. Attacks that need no user action &mdash; for example automatic exploitation of an unpatched server &mdash; are not stopped by training. And some users will still click, even after good training. That is why user training works best <i>together with</i> technical controls such as email filtering, multi-factor authentication, and device protection.</p>\n", "rules": "\n<ul class=\"rules\">\n<li><b>What you do:</b> 16 exercises, one at a time. Types you will meet: scenario choices, multi-select, drag &amp; drop, matching, ordering, fill in the blank, log reading with a filter box, decision trees, and more.</li>\n<li><b>Passing score:</b> you need at least <b>70%</b>. Your score is the sum of exercise credits, divided by the number of answered exercises.</li>\n<li><b>Partial credit:</b> some exercises have more than one correct item. Each correct item gives you a part of the credit. Wrong items <i>subtract</i> from correct ones, so selecting everything is not a good idea. A partly correct answer still earns part of the credit: credit = (correct &minus; wrong) / total items.</li>\n<li><b>Check = free thinking time:</b> when you press <b>Check</b>, the timer stops by itself. The exercise and the feedback stay visible. Take all the time you need to study the explanation. The timer starts again only when you press <b>Next</b>.</li>\n<li><b>Manual pause:</b> the Pause button stops the timer and hides the exercise for a real break. Press Resume to continue where you were.</li>\n<li><b>Skip:</b> every exercise has a Skip button. Skipped exercises wait in a pool and you can return to them as often as you want until the timer ends or you submit. Skipped exercises that you never answer are <b>excluded</b> from the score &mdash; they count as neither correct nor wrong.</li>\n<li><b>Hint:</b> each exercise has one hint. Using it costs 10% of that exercise's credit (never more than the exercise is worth).</li>\n<li><b>Timer:</b> you have <b>75 minutes</b> for all 16 exercises. After Check you cannot change an answer, so read first, answer second.</li>\n</ul>\n\n<p>This tier mirrors <b>senior-level decisions</b>. Scenarios chain several concepts, include realistic noise and missing information, and sometimes contain signals that contradict each other. Sometimes the best action is to wait, gather more evidence, or escalate &mdash; not to act. Accept that some correct actions have a real cost.</p>"}, "keywords": [{"name": "The mitigation itself", "items": ["M1017", "User Training", "Mitigation (Enterprise)", "human firewall", "awareness training", "phishing simulations", "role-specific training", "onboarding", "refreshers", "case studies", "gamification"]}, {"name": "Phishing & social engineering it mitigates", "items": ["T1566 Phishing", "T1566.001/.002/.003/.004", "T1598 Phishing for Information", "T1684.001 Impersonation", "T1657 Financial Theft", "T1667 Email Bombing", "T1189 Drive-by Compromise", "T1204 User Execution", "T1036 Masquerading / .007 Double File Extension", "T1221 Template Injection"]}, {"name": "Credential & session threats it weakens", "items": ["T1557 AiTM / .004 Evil Twin", "T1539 Steal Web Session Cookie", "T1528 Steal Application Access Token", "T1621 MFA Request Generation", "T1111 MFA Interception", "T1056.002 GUI Input Capture", "T1555.003/.005 Credentials from Password Stores", "T1003 OS Credential Dumping (password-reuse habit)"]}, {"name": "Other covered behaviours", "items": ["T1078 Valid Accounts (MFA push abuse)", "T1176 Software Extensions", "T1213.005 Messaging Applications", "T1552/.008 Unsecured Credentials", "T1185 Browser Session Hijacking", "T1072 Software Deployment Tools", "T1547.007 Re-opened Applications"]}, {"name": "Tactics touched", "items": ["Initial Access", "Credential Access", "Execution", "Defense Evasion", "Persistence", "Collection"]}, {"name": "Control design & limits", "items": ["preventive control", "detective reporting channel", "needs user interaction", "non-zero click rate", "training fatigue", "punitive-culture risk", "pairs with technical controls"]}, {"name": "Programme & metrics", "items": ["click rate", "report rate", "time-to-report", "phish-prone rate", "simulation difficulty calibration", "non-punitive follow-up"]}, {"name": "Frameworks & roles", "items": ["NIST CSF PR.AT", "CIS Control 14", "ISO 27001:2022 A.6.3", "awareness coordinator", "SOC triage of reports", "GRC evidence", "CTI input to content", "IR lessons learned"]}], "exercises": [{"id": "X01", "type": "classify", "title": "The green dashboard paradox", "scenario": [{"label": "Artefact 1 \u2014 Awareness dashboard (board pack, Q2)", "kind": "prose", "text": "Completion: 98%. Simulation click rate: 2.1% (best in sector).\nReport rate: 11%. Time-to-report median: 18 min.\nEvery KPI is green for the fourth quarter running."}, {"label": "Artefact 2 \u2014 Incident data (same period)", "kind": "prose", "text": "Real credential-phishing incidents up 40% year over year.\nOf 9 incidents, 7 started with a link click by a trained,\nsimulated, reporting user. 5 of those 7 users had passed\nthe last three simulations without a single miss."}, {"label": "Artefact 3 \u2014 The CISO's 10-minute ask", "kind": "prose", "text": "CISO: 'Board in ten minutes. Dashboard is green, incidents are red.\nWhich do I believe, what do I say, and what do we DO?'"}], "question": "Give the CISO the three answers.", "widget": {"groups": [{"id": "g1", "prompt": "1) The best single next action?", "options": [{"id": "g1a", "text": "Commission a measurement review: compare simulation lure difficulty and delivery paths against the real campaigns that succeeded", "note": "Correct: the dashboard and the incidents measure different things. If simulations are easier than real lures (or only cover mail while attacks arrive via services and voice), green numbers coexist with red reality. You need to know which gap exists before spending."}, {"id": "g1b", "text": "Run the same training again, harder and more often", "note": "A best-practice reflex that presumes the gap is effort. The passing users contradict it: effort is not the missing variable."}, {"id": "g1c", "text": "Declare the dashboard wrong and pause the programme", "note": "The metrics are not wrong, they are scoped differently than the incidents. Pausing destroys the measurement you need."}], "correct": "g1a"}, {"id": "g2", "prompt": "2) Which number misled the board most?", "options": [{"id": "g2a", "text": "Simulation click rate: it measures behaviour on lures YOU chose, delivered when YOU chose", "note": "Correct: it is a practice score, not a defence score. Low click on easy, announced lures says little about a convincing voice-delivered lure on a busy Friday."}, {"id": "g2b", "text": "Completion percentage", "note": "Vanity, yes, but almost nobody makes decisions on it; it does not drive the paradox."}, {"id": "g2c", "text": "Time-to-report", "note": "It is one of the genuinely outcome-shaped numbers; 18 minutes is defensible."}], "correct": "g2a"}, {"id": "g3", "prompt": "3) What does the CISO tell the board?", "options": [{"id": "g3a", "text": "'Practice metrics are green; real-campaign defence has a coverage gap in lure realism and channels. We will re-baseline simulations against CTI-tracked campaigns and re-report in one quarter.'", "note": "Correct: honest, specific, time-boxed, and it names the exact review from answer 1."}, {"id": "g3b", "text": "'Everything is green; the incidents are an industry-wide trend we cannot influence.'", "note": "Defensible-sounding surrender; the board will (correctly) ask why then maintain the programme budget."}, {"id": "g3c", "text": "'We will reach zero clicks next quarter.'", "note": "A promise no measurement can support; it will be used against the programme later."}], "correct": "g3a"}]}, "hint": "The dashboard measures practice on your lures. The incidents measure defence against theirs. Which one did you choose?", "explain": "This is the classic simulation-validity paradox: green practice metrics with rising real incidents usually mean the simulations drifted away from the real threat (easier lures, mail-only channels, announced timing), not that users stopped learning. The passing users are the tell: they optimised exactly what you trained. The action is a measurement review and a re-baseline of simulations against CTI-tracked campaigns, which is the M1017 page's 'emerging threats' refresher loop taken seriously. Telling the board a zero-click promise would set the programme up to fail publicly next quarter.", "study": "Take your last three simulations and score them against the last three real incidents: same channel? same difficulty? same timing?"}, {"id": "X02", "type": "branching", "title": "The payment that almost left", "scenario": [{"label": "Artefact 1 \u2014 Finance chat log, 16:40 Friday", "kind": "prose", "text": "AP clerk: boss on the phone?? no. Mail from 'CFO M. Keller'\n'wire 480,000 to the new logistics vendor today, M&A secrecy,\nconfirm by reply ONLY.' Domain: cfo-office[.]co (new).\nSPF: pass (their own server). Display name: perfect."}, {"label": "Artefact 2 \u2014 Process state", "kind": "prose", "text": "Payment verification policy: 'for amounts above 50k, verify\nout-of-band' \u2014 written in 2019, not enforced in system,\nno second-channel requirement configured, no training\nmodule for finance since 2022 baseline."}, {"label": "Artefact 3 \u2014 The stakes", "kind": "prose", "text": "Year-end: 14 pending wires. Bank cut-off: 17:30 today.\nCFO is on a flight until Monday. You are the deputy CFO."}], "question": "Three decisions, cascading.", "widget": {"steps": [{"id": "d1", "prompt": "1) The 480k wire request sits in the queue. It is 16:45.", "options": [{"id": "fa", "text": "Freeze the wire, demand out-of-band verification on a known number, accept the year-end friction", "note": "Correct: the costly-but-right move. 480k against a same-day delay is the trade a senior owner makes; the flight makes verbal verification impossible, which is itself a red flag."}, {"id": "fb", "text": "Pay it: the display name and urgency look executive", "note": "Every artefact points the other way: new domain, reply-only, secrecy framing, no enforceable policy. T1657 patterns live exactly here."}, {"id": "fc", "text": "Pay half now, half Monday", "note": "Splitting a fraudulent payment still sends the first half to the attacker."}, {"id": "fd", "text": "Reply to the mail asking for a video call", "note": "Reply-only is the attacker's channel; you would be confirming a live target and playing their game."}], "correct": "fa", "after": "Wire frozen at 16:52. Bank confirms the beneficiary account was opened 11 days ago. Two more wires from the same 'vendor' are found in the pending list."}, {"id": "d2", "prompt": "2) Monday. Freeze held. What is the durable fix priority?", "options": [{"id": "ga", "text": "Enforce dual-verification in the payment SYSTEM (two channels, amount-tiered) and rebuild the finance module around T1657/T1684.001", "note": "Correct: process enforcement plus targeted training is the pair that survives staff turnover and pressure; training alone regresses, system alone stays brittle at the edges."}, {"id": "gb", "text": "Training module only, next quarter", "note": "The policy existed on paper and failed without enforcement; content alone repeats that failure."}, {"id": "gc", "text": "Ban executives from being mentioned in mail", "note": "Unenforceable theatre; impersonation moves to phone and chat (T1684.001 variants)."}, {"id": "gd", "text": "Nothing: the freeze worked", "note": "The freeze was luck plus one suspicious clerk; 14 wires remain in play next quarter."}], "correct": "ga", "after": "System rule ships in 3 weeks: any wire above 50k requires a callback on a number from the vendor master file. Finance module rebuilt with this case study."}, {"id": "d3", "prompt": "3) Reporting: how does this event enter the record?", "options": [{"id": "ha", "text": "Log as a successful control intervention (near-miss prevented) AND a control deviation (un-enforced policy), feed both into the programme", "note": "Correct: honest dual recording. The near-miss proves the human layer caught it; the deviation proves the paper control was hollow. Both drive budget and content."}, {"id": "hb", "text": "Log nothing: no money was lost, so there is no incident", "note": "Near-misses are the cheapest lessons an organisation ever gets; discarding them guarantees a repeat."}, {"id": "hc", "text": "Log as a training success story only", "note": "Half-true and self-flattering; it hides the process gap that made 480k one click away."}], "correct": "ha", "after": "The case becomes the finance module's opening scenario; the deviation finding funds the system rule. Next year, two similar attempts die at the callback step."}]}, "hint": "The costs are real in every direction: paying is worst, freezing is friction, silence repeats. The record must show BOTH what worked and what was hollow.", "explain": "Decision 1 accepts a real business cost (year-end wire delay, missing CFO) to avoid a 480k loss: the new domain, reply-only confirmation, secrecy framing, and unreachable executive are the T1657 financial-theft pattern with T1684.001 impersonation on top. Decision 2 pairs system-enforced dual verification with a rebuilt finance module, because either alone regresses. Decision 3 records both truths: the human layer worked, the paper control did not exist in practice. That dual record is what separates a learning organisation from a lucky one.", "study": "Pull one high-value process in your area: is its verification step enforced by a system, or by a policy PDF?"}, {"id": "X03", "type": "classify", "title": "Five artefacts, one spoof", "scenario": [{"label": "Artefact 1 \u2014 Email (hr-lt-22, 11:31)", "kind": "log", "text": "From: 'Chen Wei \u2014 COO <chen.wei@nordwind-logistics[.]com>'\nTo: all-managers@corp[.]example\nSubject: Restructure: action needed on your team's roster\nBody: 'Review the draft roster: hxxp://nordwind-hr[.]co/roster'\nSignature block: correct, with correct phone extension"}, {"label": "Artefact 2 \u2014 Gateway verdict", "kind": "log", "text": "SPF: pass (nordwind-logistics[.]com authorized 45[.]33[.]20[.]7)\nDKIM: pass (same domain)\nDMARC: pass (aligned)\nDisplay-name match to real COO name: YES\nURL reputation nordwind-hr[.]co: unknown -> DELIVERED to 212 mailboxes"}, {"label": "Artefact 3 \u2014 Org chart (pinned on the intranet)", "kind": "prose", "text": "Chen Wei, COO \u2014 based in Hamburg. Secretariat: 2 people.\nThe REAL Nordwind logistics vendor relationship: procurement,\ncontract 2023-114, invoices only, no HR systems."}, {"label": "Artefact 4 \u2014 Timeline", "kind": "prose", "text": "11:31 delivered (212 mailboxes)\n11:47 first user reports 'domain is nordwind-hr[.]co, not ours'\n11:52 purge initiated\n12:05 three credential submissions already recorded on the lure"}, {"label": "Artefact 5 \u2014 Training coverage", "kind": "prose", "text": "Modules: mail attachments, MFA prompts, passwords.\nVendor/impersonation module: none. Simulation lures: mail-only, generic."}], "question": "Answer the four incident-review selections.", "widget": {"groups": [{"id": "g1", "prompt": "1) Why did the gateway deliver this?", "options": [{"id": "g1a", "text": "The attacker sent from their own well-configured domain: SPF, DKIM and DMARC all pass for THAT domain, and the lure URL had no reputation yet", "note": "Correct: authentication proves the sender owns their domain, not that the domain is trusted. Zero-day URLs defeat reputation feeds. Authentication-aligned phishing is the modern baseline."}, {"id": "g1b", "text": "The gateway was misconfigured", "note": "Nothing in the verdict is a misconfiguration; it performed exactly as designed."}, {"id": "g1c", "text": "The COO's mailbox was compromised", "note": "No evidence: the mail originated from the attacker's own aligned domain, not the real nordwind-logistics tenant."}], "correct": "g1a"}, {"id": "g2", "prompt": "2) Which single signal, available to every user at 11:31, betrayed the mail?", "options": [{"id": "g2a", "text": "The link domain (nordwind-hr[.]co) does not match the sender's claimed brand or the corporate domain", "note": "Correct: the trained habit of reading the actual link domain defeats fully-authenticated display-name spoofs; it needed no tooling and no intel."}, {"id": "g2b", "text": "The email's tone was too urgent", "note": "The tone is professional; urgency framing is mild here. Tone alone is a weak signal."}, {"id": "g2c", "text": "The signature block had a wrong phone extension", "note": "It was correct. Style signals were absent by design."}], "correct": "g2a"}, {"id": "g3", "prompt": "3) What worked, honestly?", "options": [{"id": "g3a", "text": "One trained reflex: a user read the link domain and reported within 16 minutes, capping exposure at three victims of 212", "note": "Correct: imperfect but decisive. 16-minute reporting turned 212 exposures into 3 compromises; the reporting channel earned its keep."}, {"id": "g3b", "text": "The gateway: it stopped the campaign", "note": "It delivered to 212 mailboxes; the humans capped the damage."}, {"id": "g3c", "text": "The vendor module: it prepared users for exactly this", "note": "Artefact 5 shows no vendor/impersonation module exists."}], "correct": "g3a"}, {"id": "g4", "prompt": "4) The 30-day change with the highest expected value?", "options": [{"id": "g4a", "text": "Add an impersonation/vendor-lure module AND display-name-spoof simulations, keeping the reporting channel celebrated", "note": "Correct: it addresses the exact uncovered lure shape (aligned-domain impersonation) and reinforces the reflex that worked; the M1017 loop of real cases into refreshers, run properly."}, {"id": "g4b", "text": "Mandate a new mail gateway", "note": "The gateway worked as designed against authentication-aligned mail; a new vendor does not change the physics."}, {"id": "g4c", "text": "Discipline the three users who typed credentials", "note": "Suppresses reporting and misreads the gap: coverage, not character, failed here."}], "correct": "g4a"}]}, "hint": "Authentication signals answer 'who sent this', never 'is this true'. One user's reflex capped a 212-mailbox event. The org-chart artefact is scenery; the coverage artefact is the map.", "explain": "The gateway delivered because the attacker ran their own correctly-authenticated domain: SPF, DKIM and DMARC passing for nordwind-logistics[.]com proves ownership of that domain, not honesty, and the zero-day lure URL had no reputation. The one universal tell was the link domain mismatch, a pure M1017 habit, and it worked: 16 minutes, three victims instead of thirty. The honest review credits the reporting channel, names the coverage gap (no vendor/impersonation module), and fixes coverage with targeted content plus spoof-shaped simulations. Artefact 3 is realistic noise: plausible, detailed, and irrelevant to every answer.", "study": "Check one thing today: does your awareness programme ever show a FULLY AUTHENTICATED phishing mail? If not, users learn that auth headers are safety, which they are not."}, {"id": "X04", "type": "baskets", "title": "One budget, two philosophies", "scenario": [{"label": "Artefact 1 \u2014 The evidence", "kind": "prose", "text": "Last 12 months, 16 credential-phishing incidents: 13 began with a\nlink in mail DELIVERED BY THE GATEWAY as clean (unknown-reputation\ndomains, auth-aligned). Sandbox pilot (8 weeks): caught 2 of 40\nsimulated payload mails; 0 of the 13 link-path incidents would\nhave been caught (links, not attachments)."}, {"label": "Artefact 2 \u2014 The vendor claim", "kind": "prose", "text": "Sandbox vendor: '99% of threats stopped in customer deployments.'\nDeployment cost: one FTE-year plus licences.\nAlternative package for the same money: simulation programme\nre-baselined on CTI-tracked lures + report-button completion\n+ quarterly targeted modules for finance/helpdesk/executives."}, {"label": "Artefact 3 \u2014 The constraint nobody says aloud", "kind": "prose", "text": "Whatever you choose, the board memo must state the residual risk\nyou are ACCEPTING. There is no option that covers everything."}], "question": "Drag each budget line into the right basket.", "widget": {"baskets": [{"id": "f1", "label": "Fund it (measured path)"}, {"id": "f2", "label": "Do not fund (accept as documented residual)"}], "items": [{"id": "m1", "text": "Re-baselined simulation programme on CTI-tracked lures", "note": "Fund. 13 of 16 incidents entered through gateway-delivered links; this is the trained layer plus calibrated practice on the exact path.", "basket": "f1"}, {"id": "m2", "text": "Report-button completion and SOC report queue", "note": "Fund. The human sensor network is the only layer that fired on the link path; completing it is the cheapest capability gain.", "basket": "f1"}, {"id": "m3", "text": "Quarterly targeted modules: finance, helpdesk, executives", "note": "Fund. Role-based content for the exposed groups is the M1017 page's own prescription.", "basket": "f1"}, {"id": "m4", "text": "Attachment sandbox licence expansion (one FTE-year + licences)", "note": "Do not fund. Your own 8-week pilot caught 0 of the 13 link-path incidents; the licence buys depth in a layer the attacks do not use. Document as residual risk with compensating layers (trained users, endpoint AV, EDR).", "basket": "f2"}, {"id": "m5", "text": "A 50/50 split so both teams get something", "note": "Do not fund. Half-funding a programme that needs full funding and buying a tool the data rejects is compromise as theatre; the memo must state one decision.", "basket": "f2"}]}, "hint": "13 of 16 incidents share one path. The pilot measured the sandbox on YOUR traffic, not the vendor's customers. Boards fund named risks, not vibes.", "explain": "The evidence says the bleeding path is gateway-delivered credential links, which attachment sandboxing does not touch; your own pilot confirmed it on local traffic. So the programme lines (simulations, report button, role modules) are funded, and the sandbox expansion lands in the residual basket, documented with compensating layers (trained users, endpoint AV, EDR) instead of a licence. This exercise is the mitigation-analyst's core judgement in miniature: match control to path, accept and document what you do not buy, and never confuse vendor claims with your telemetry.", "study": "Write the one-sentence residual-risk statement for your current security budget. If you cannot, it has not been set."}, {"id": "X05", "type": "ordering", "title": "The audit finding sequence", "scenario": [{"label": "Artefact \u2014 External audit finding (draft)", "kind": "prose", "text": "Finding: 'Awareness training exists (annual, 96% completion) but\nno simulations, no behavioural metrics, no role-specific content.\nCIS 14.3 and ISO A.6.3 objectives not demonstrably met.\nManagement response due in 30 days; evidence in 180 days.'\n\nAvailable actions (shuffled):\nA. Baseline: current click/report behaviour on a real calibrated simulation\nB. Role-specific modules for finance, helpdesk, executives\nC. Monthly simulation programme with calibrated difficulty\nD. Behavioural metrics pipeline (report rate, time-to-report) with quarterly reporting\nE. Evidence pack: policies, metrics, sampling records for the auditor"}], "question": "Order the five actions to satisfy the finding.", "widget": {"items": [{"id": "u1", "text": "A. Baseline behaviour with a first calibrated simulation", "note": "Baseline first: without a starting point, no later number proves anything."}, {"id": "u2", "text": "B. Role-specific modules for the high-risk groups", "note": "Content follows baseline: the baseline tells you which roles bleed first."}, {"id": "u3", "text": "C. Monthly simulation programme", "note": "Cadence comes after content: simulating before fixing content measures the wrong thing."}, {"id": "u4", "text": "D. Metrics pipeline and quarterly reporting", "note": "Metrics formalise what the simulations produce; auditors need continuity, not snapshots."}, {"id": "u5", "text": "E. Evidence pack for the auditor", "note": "Evidence packs assemble everything the earlier steps generated; assembling first would pack air."}]}, "hint": "Auditors fund nothing and measure everything: what must exist before it can be measured, reported, and evidenced?", "explain": "The order is the audit logic itself: baseline (measure reality), role content (fix what the baseline shows), monthly cadence (practice and measure repeatedly), metrics pipeline (turn data into governed reporting), evidence pack (assemble the trail). The wrong-but-tempting order \u2014 buy a generic course, mark the finding closed \u2014 is precisely what the scenario's '96% completion, zero behaviour' finding already tried. Auditors re-test behaviour, not certificates, and the 180-day window exists for the behavioural trend, not the paperwork sprint.", "study": "Map your own programme onto A-E. The stage you cannot evidence is the stage you do not have."}, {"id": "X06", "type": "multi", "title": "The quiet forty-seven minutes", "scenario": [{"label": "Artefact 1 \u2014 Report at 10:07", "kind": "prose", "text": "User (level 2 support staff): 'Clicked a DocuSign-like link at 09:20,\ntyped credentials, approved the MFA push, then realised.\nReported now. I am sorry.'"}, {"label": "Artefact 2 \u2014 Telemetry at 10:09", "kind": "prose", "text": "09:26 credentials submitted to the lure\n09:31 push approved, session created from 203[.]0[.]113[.]99\n09:38 mailbox rule 'RSS Feeds' created (hides security mails)\n09:41 search of mailbox for 'invoice', 'wire', 'password'\n10:05 no further attacker action observed. Session still alive."}, {"label": "Artefact 3 \u2014 Your authority", "kind": "prose", "text": "You may act unilaterally on this account. Host is EDR-managed.\nLegal is reachable in 15 minutes if needed."}], "question": "Select the TWO actions you execute now.", "widget": {"options": [{"id": "a", "text": "Revoke all sessions and reset credentials (accepting the user's 10 minutes of downtime while they re-authenticate)", "note": "Correct: the session at 09:31 is the attacker's live access; revocation plus reset is the minimum full cut-off, and the business cost (brief re-login) is trivially justified by the observed mailbox search."}, {"id": "b", "text": "Remove the 'RSS Feeds' mailbox rule and audit all other rules and OAuth grants", "note": "Correct: the 09:38 rule is persistence that survives password resets; leaving it re-hides future security mails even after recovery."}, {"id": "c", "text": "Purge the lure email from the mailbox first, before any preservation, to stop further clicks", "note": "Wrong order and destructive: purging before preserving destroys the message artefacts legal and IR need; and no further clicks are occurring inside this single compromised mailbox."}, {"id": "d", "text": "Wipe and reimage the workstation immediately", "note": "The compromise path was credentials and a remote session; the workstation shows no execution. Wiping destroys volatile evidence for no capability gain and costs the user their working day."}], "correct": ["a", "b"]}, "hint": "One action cuts live access. One removes persistence that outlives the reset. The other two destroy things you will need or possess for no gain.", "explain": "The evidence chain (creds, approved push, live session, persistence rule, targeted search) says full compromise of the mailbox, not the machine. The two correct actions are the capability-cutting pair: revoke/reset ends live access (accepting minutes of downtime as the cost), and removing the rule plus auditing grants removes the persistence that survives resets. The wrong actions are the classic pair under pressure: purging before preservation destroys evidence, and reimaging spends a day of uptime against a threat that never touched the endpoint. The 47-minute delay (click 09:20 to report 10:07) is exactly the time-to-report metric your programme exists to shorten.", "study": "In your IR plan: which action is authorised WITHOUT approval, and which destroys evidence if done first?"}, {"id": "X07", "type": "branching", "title": "The zero-click mandate", "scenario": [{"label": "Artefact 1 \u2014 Board directive (after one bad quarter)", "kind": "prose", "text": "'Effective immediately: simulation frequency to WEEKLY for all staff.\nClickers to be named to their managers. Target: 0% clicks within\none quarter. Compliance tracked in the board pack.'"}, {"label": "Artefact 2 \u2014 What the data says", "kind": "prose", "text": "Current: monthly, calibrated, report rate 11% and rising.\nPilot of weekly+named (another business unit, 2023):\nreport rate fell to 3% in six weeks, click rate unchanged,\nusers reported gaming the tests (warning each other) instead of learning."}, {"label": "Artefact 3 \u2014 Your position", "kind": "prose", "text": "You own the programme. The directive is signed.\nThe next board pack is due in 20 days."}], "question": "Two decisions.", "widget": {"steps": [{"id": "z1", "prompt": "1) Your response to the directive this week?", "options": [{"id": "ma", "text": "Present the 2023 pilot data and an alternative plan: keep monthly cadence, add CTI-calibrated difficulty, target report-rate growth; ask the board to set the target on behaviour, not on zero", "note": "Correct: you cannot ignore a signed directive, but you can replace an unworkable target with a measurable one backed by your own pilot evidence. Boards amend targets they can see failing in advance."}, {"id": "mb", "text": "Comply fully: weekly for everyone, names to managers", "note": "Executes a measured failure: the pilot predicts report collapse within six weeks, which then gets blamed on the programme, not the mandate."}, {"id": "mc", "text": "Ignore the directive quietly and continue as before", "note": "Openly defying or silently ignoring a board directive burns the programme's political capital for a quarter."}, {"id": "md", "text": "Resign the programme ownership", "note": "Dramatic, and abandons the reporting culture to whoever inherits it."}], "correct": "ma", "after": "The board accepts the amended target: report rate 11% to 15% in two quarters, click-rate band 2-4% accepted as healthy range. Weekly cadence limited to the two highest-risk departments."}, {"id": "z2", "prompt": "2) The amended plan's guardrail against future shaming proposals?", "options": [{"id": "na", "text": "Write the use-limits of simulation data into the security policy (metrics and coaching only), reviewed annually with the board", "note": "Correct: codifying data-use limits makes the next 'name them' proposal a policy amendment, not an email decision; it institutionalises the no-blame contract."}, {"id": "nb", "text": "Trust future managers to be reasonable", "note": "Trust is not a control; the 2023 pilot exists because someone reasonable was not in the room."}, {"id": "nc", "text": "Keep simulation data in spreadsheets nobody audits", "note": "Shadow data has no governance; it leaks, and leaks become shaming lists."}], "correct": "na", "after": "Policy clause adopted; board reviews annually; the 2023 pilot becomes the standing counter-example in the pack."}]}, "hint": "A signed directive is a fact, not a surrender. Your own pilot data is the strongest currency you hold. And culture that lives in goodwill dies with the next manager.", "explain": "Decision 1 converts a mandate into a measurable alternative, using local pilot evidence (report collapse under weekly+named) to argue for behaviour targets over zero-click theatre; total compliance would execute a known failure, and quiet defiance burns credibility. Decision 2 makes the protection durable by writing simulation-data use-limits into policy with board review, so the no-blame contract outlives every individual manager. This is the senior version of the awareness-lead role: half behavioural science, half governance, all evidence.", "study": "Does any written policy at your organisation say what simulation data may NEVER be used for?"}, {"id": "X08", "type": "classify", "title": "Two systems disagree", "scenario": [{"label": "Artefact 1 \u2014 Report-button queue (Monday 08:00)", "kind": "prose", "text": "Since Friday 16:00: 37 user reports of the same mail.\n'Invoice reminder' with link to billing-update[.]top.\nReports from 6 departments, consistent screenshot attached."}, {"label": "Artefact 2 \u2014 Mail gateway (same campaign)", "kind": "log", "text": "billing-update[.]top: reputation NEUTRAL (new domain)\nAuth: SPF pass, DKIM none, DMARC none\nVerdict: DELIVERED to 1,842 mailboxes\nNo rule trigger. No sandbox flag (link-only mail)."}, {"label": "Artefact 3 \u2014 SIEM correlation", "kind": "prose", "text": "14 clicks on the lure recorded by proxy. 2 credential POSTs.\nGateway retro-release function: no re-scoring scheduled\n(license tier limitation)."}], "question": "Resolve the conflict and act.", "widget": {"groups": [{"id": "g1", "prompt": "1) Which signal do you treat as ground truth?", "options": [{"id": "g1a", "text": "The 37 user reports: humans observed the actual content and intent; the gateway's 'neutral' verdict is an absence of evidence, not evidence of safety", "note": "Correct: 37 independent human judgements with consistent artefacts outweigh a reputation system that has simply never seen the domain. Absence-of-verdict is the weakest signal class in the stack."}, {"id": "g1b", "text": "The gateway verdict: machines do not get phished", "note": "Machines also do not read intent; 'neutral on a 3-day-old domain' is precisely the state where human signals dominate."}, {"id": "g1c", "text": "Wait for the vendor feed to update overnight", "note": "1,842 mailboxes are holding a live lure right now; 14 clicks and 2 credential POSTs already happened. Overnight is a strategy for the next campaign, not this one."}], "correct": "g1a"}, {"id": "g2", "prompt": "2) Why did the technical layer miss it?", "options": [{"id": "g2a", "text": "The campaign was engineered for it: brand-new domain (no reputation history), passing SPF on its own server, link-only payload (no attachment to detonate)", "note": "Correct: each miss has a precise technical cause; together they describe the modern baseline campaign that M1017-trained users are designed to catch."}, {"id": "g2b", "text": "The gateway is broken and needs replacement", "note": "It worked as configured; no rule exists that could have fired on this evidence set."}, {"id": "g2c", "text": "Users misconfigured the gateway", "note": "Users have no pathway into gateway configuration; the miss is a coverage and telemetry limit."}], "correct": "g2a"}, {"id": "g3", "prompt": "3) The action set for the next 30 minutes?", "options": [{"id": "g3a", "text": "Purge by sender+URL from all mailboxes, block the domain at proxy and mail, reset the 2 POST users' sessions, and send a 'thank you, this worked' note to reporters", "note": "Correct: containment from human intel, technical blocks to hold the line, credential response for confirmed victims, and reinforcement so the channel keeps firing. Classic human+technical closure."}, {"id": "g3b", "text": "Purge and nothing else", "note": "Leaves two compromised accounts live and the domain reachable from every browser in the estate."}, {"id": "g3c", "text": "Wait for the vendor feed, then act on its verdict", "note": "Concedes the timeline; the verdict may never change for a domain the attacker will abandon tomorrow anyway."}], "correct": "g3a"}]}, "hint": "One signal is 37 humans with artefacts. One is a system that has never seen this domain. Absence of a verdict is not a verdict.", "explain": "Reports are ground truth here: 37 consistent human observations against a reputation system with zero history on a 3-day-old domain. The technical miss decomposes exactly: no reputation (new domain), no authentication to fail (their own SPF), no payload to detonate (link-only). The action set combines everything the scenario taught: purge from the reports' intel, block at two layers, cut the two compromised sessions, and reinforce the reporters, because the M1017 channel just did what its page promises. Campaigns like this are why report rate is a detection metric, not a vanity one.", "study": "Ask your gateway team: what is our retro-action path for domains that turn bad AFTER delivery?"}, {"id": "X09", "type": "fillblank", "title": "The subsidiary with no records", "scenario": [{"label": "Artefact 1 \u2014 Incident scoping call, 09:00", "kind": "prose", "text": "A credential-phishing incident touches subsidiary B (acquired\n8 months ago). IT inherited, no integration yet.\nQuestion to subsidiary IT: 'Training and simulation records?'"}, {"label": "Artefact 2 \u2014 The answer (incomplete)", "kind": "prose", "text": "'There was some onboarding e-learning in the old LMS. We cannot\naccess it since the migration. Some staff say they did training\nlast year. No simulations have ever been run here.'\nNo completion lists. No dates. No scope."}, {"label": "Artefact 3 \u2014 The pressure", "kind": "prose", "text": "The CISO wants the incident scope TODAY: 'Were these users trained\nor not?' The honest answer is: nobody knows."}], "question": "Complete the scoping note with words from the bank.", "widget": {"parts": ["Scoping note: until records arrive, subsidiary B users are treated as ", {"b": "b1"}, " for risk-scoping; we formally request LMS evidence within ", {"b": "b2"}, " days; interim ", {"b": "b3"}, " training starts for the exposed teams this week; and the records recovery and the interim control run on ", {"b": "b4"}, " parallel tracks."], "bank": [{"id": "w1", "text": "untrained", "note": "The conservative default: costs slightly broader monitoring, cannot understate risk. Unknown is not trained."}, {"id": "w2", "text": "five", "note": "A deadline that forces the evidence question; open-ended requests die in vendor queues."}, {"id": "w3", "text": "manual", "note": "Live sessions beat waiting for the LMS: the control gap is closed in days, not after archaeology."}, {"id": "w4", "text": "two", "note": "Records recovery and interim control are independent: neither waits for the other."}, {"id": "w5", "text": "trained", "note": "The optimistic default; assuming trained without evidence is how scoped-down incidents resurface."}, {"id": "w6", "text": "ninety", "note": "Far too slow: the incident clock does not wait for a quarter."}, {"id": "w7", "text": "online-only", "note": "A decoy: the failed channel was exactly the untracked e-learning."}, {"id": "w8", "text": "one", "note": "A decoy: sequencing them serially leaves the exposure open while paperwork resolves."}], "answers": {"b1": "w1", "b2": "w2", "b3": "w3", "b4": "w4"}}, "hint": "Unknown is not trained. Unknown is not untrained either: it is a specific, costly state you must scope around and fix on two tracks.", "explain": "With no records, the defensible scoping assumption is untrained: it widens containment slightly (cheap) instead of understating risk (expensive). The records problem runs on its own track: a deadline-bound evidence request plus interim manual training for exposed teams, so the control gap is closed in days, not whenever LMS archaeology concludes. This pattern, assume-conservative plus fix-interim, is standard for acquired entities, and the M1017 programme owner owns the follow-up: subsidiary B enters the training scope with its own baseline.", "study": "List the populations your programme cannot evidence today. Each one is a silent scoping risk."}, {"id": "X10", "type": "classify", "title": "Capstone: the Friday cascade", "scenario": [{"label": "Artefact 1 \u2014 Mail (11:03, delivered to 96 mailboxes)", "kind": "log", "text": "From: 'Service Desk <servicedesk@corp-support[.]co>'\nSubject: ACTION: your VPN certificate expires TODAY\nBody: 'Renew now: hxxp://corp-support[.]co/vpn/renew'\nGateway: SPF pass (own domain), URL reputation unknown, DELIVERED"}, {"label": "Artefact 2 \u2014 Proxy + IdP", "kind": "log", "text": "11:21 user=g.silva GET the lure, POST credentials\n11:24 push approved (g.silva), session from 203[.]0[.]113[.]140\n11:31 second user (k.osei) POSTs credentials, push DENIED\n11:44 mail rule created on g.silva mailbox, search 'vpn', 'remote'"}, {"label": "Artefact 3 \u2014 Reports and response", "kind": "prose", "text": "11:26 first report ('domain is corp-support[.]co not corp[.]example')\n11:40 22 reports total; purge at 11:47; sessions revoked 11:52;\nrule removed 11:55. k.osei's push DENIAL stopped that path cold."}, {"label": "Artefact 4 \u2014 Programme state", "kind": "prose", "text": "Report rate 9%, time-to-report median 34 min.\nModules: attachments, MFA pushes, passwords. No 'IT urgency'\nimpersonation module. Simulations: quarterly, generic templates."}, {"label": "Artefact 5 \u2014 Noise (real, irrelevant)", "kind": "prose", "text": "Also Friday: firewall firmware window, canteen menu change,\nand a parked domain 'corp-support[.]com' (different TLD,\nregistered 2021, never resolved, reputation clean)."}], "question": "Five selections for the post-incident review.", "widget": {"groups": [{"id": "g1", "prompt": "1) Technique classification for the record?", "options": [{"id": "g1a", "text": "T1566.002 delivery with T1621 push-abuse and T1078 account use; primary ID T1566.002", "note": "Correct: link-delivered lure, then MFA push abuse to complete the login, then live account use. Records that chain and it matches the artefacts exactly."}, {"id": "g1b", "text": "T1190: the VPN was exploited", "note": "The VPN was never touched; a user was. Different tactic, different owner, wrong record."}, {"id": "g1c", "text": "T1684.001 only: impersonation, full stop", "note": "Impersonation flavour is present ('Service Desk'), but the delivery and account mechanics named above are the recordable chain."}], "correct": "g1a"}, {"id": "g2", "prompt": "2) Which layer caught the campaign, precisely?", "options": [{"id": "g2a", "text": "The trained reporting channel: 22 reports starting 23 minutes after delivery drove purge at minute 44", "note": "Correct: gateway delivered, reputation was blind, auth passed; humans were the only firing sensor, and their speed capped the damage to one full compromise."}, {"id": "g2b", "text": "The gateway: it flagged the domain", "note": "It DELIVERED to 96 mailboxes on an unknown-reputation domain."}, {"id": "g2c", "text": "EDR: it stopped the credential use", "note": "No endpoint execution occurred; EDR had nothing to catch."}], "correct": "g2a"}, {"id": "g3", "prompt": "3) What contained the damage to ONE fully-compromised account?", "options": [{"id": "g3a", "text": "The trained MFA-push reflex (k.osei's DENIAL) plus 23-minute first report", "note": "Correct: one user's trained refusal removed a second account from the blast radius, and the fast report started the clock that ended the attacker's access at minute 49."}, {"id": "g3b", "text": "Pure luck", "note": "Luck is not a control; two trained reflexes (deny, report) are documented behaviours with names and timestamps."}, {"id": "g3c", "text": "The purge alone", "note": "The purge started at minute 44; g.silva's compromise and k.osei's exposure both happened before it. The reflexes did the capping."}], "correct": "g3a"}, {"id": "g4", "prompt": "4) The programme gap the review must fund next?", "options": [{"id": "g4a", "text": "An 'IT urgency / service-desk impersonation' module plus simulation coverage of urgency-framed IT lures", "note": "Correct: artefact 4 shows the exact empty slot; the lure shape ('certificate expires TODAY') matched no trained content."}, {"id": "g4b", "text": "A new mail gateway", "note": "Delivery happened on a correctly-authenticated zero-reputation URL: physics, not vendor quality."}, {"id": "g4c", "text": "Discipline g.silva", "note": "The user clicked under a convincing IT-urgency lure the programme never covered, and punitive responses suppress the next 22 reports."}], "correct": "g4a"}, {"id": "g5", "prompt": "5) The parked domain corp-support[.]com in artefact 5?", "options": [{"id": "g5a", "text": "Irrelevant to this incident (different TLD, never resolved, clean history), but park it in the monitoring list as cheap hygiene", "note": "Correct: recognising noise AS noise is the senior skill, while still logging it for cheap watchlist hygiene. Not every lookalike is the attacker."}, {"id": "g5b", "text": "It is the attacker's backup domain, block it as part of this incident", "note": "No evidence connects it: never resolved, older registration, clean reputation. Acting on it would be blocking a stranger."}, {"id": "g5c", "text": "Delete the artefact from the report; noise confuses leadership", "note": "Senior reviews show the noise and label it; hiding data teaches leaders that reports are curated."}], "correct": "g5a"}]}, "hint": "Follow the minutes, not the adrenaline: 11:03 delivery, 11:21 click, 11:24 push approved, 11:26 report, 11:47 purge. One deny, one approve, 22 reports. The parked domain shares a name with nothing else.", "explain": "The recordable chain is T1566.002 (link lure) with T1621 push abuse completing the login and T1078 account use; the VPN itself was never touched. The firing sensor was the trained reporting channel (22 reports, first at minute 23), and containment of the blast radius came from two trained reflexes: k.osei's push denial and the reporting stampede. The funded gap is the 'IT urgency' impersonation module, absent per artefact 4. The parked corp-support[.]com is realistic noise: a different TLD, never resolved, unrelated; the senior move is to label it as noise and add cheap watchlist hygiene, not to escalate it into the incident record.", "study": "Re-watch your last incident timeline for the trained reflexes that fired. Name them in the review; they are the programme's proof of value."}, {"id": "X11", "type": "classify", "title": "The link that went to the real domain", "scenario": [{"label": "Artefact 1 \u2014 The lure (Teams, external tenant)", "kind": "prose", "text": "Chat from 'ProjectVendor Assist' (external tenant, generic avatar):\n'Shared the revised spec with you: hxxps://contoso[.]sharepoint[.]com/:s:/s/Spec_v4'\nThe domain is Microsoft's real SharePoint.\nThe site it points to is an attacker-REGISTERED tenant."}, {"label": "Artefact 2 \u2014 Tooling verdicts", "kind": "prose", "text": "URL reputation: contoso[.]sharepoint[.]com = CLEAN (it is Microsoft).\nSandbox: file-less link, no payload to detonate. PASS.\nMail gateway: not in scope (Teams message)."}, {"label": "Artefact 3 \u2014 User behaviour", "kind": "prose", "text": "User: 'It said shared with me, I clicked, it asked me to sign in\nwith my company account. The page looked like our normal login.\nI typed my password. Then it asked for MFA. I approved.'\nReported 2 hours later after a colleague said 'what spec?'"}, {"label": "Artefact 4 \u2014 Coverage", "kind": "prose", "text": "Awareness modules: mail links (lookalike domains), attachments,\nMFA pushes. Service-delivered lures on REAL cloud domains:\nnot covered. Simulation platform: mail only."}], "question": "Three selections for the review.", "widget": {"groups": [{"id": "g1", "prompt": "1) Why did every tool pass this lure?", "options": [{"id": "g1a", "text": "The domain IS legitimately Microsoft's; reputation and sandboxing evaluate the domain and payload, not which tenant registered the sharing link", "note": "Correct: the technique weaponises a legitimate platform. Domain reputation cannot rate a trusted domain down, and there is no file to detonate. The signal lives in the tenant and the context, which tools here do not read."}, {"id": "g1b", "text": "The tools are misconfigured", "note": "They performed their function correctly; the function itself does not cover this technique."}, {"id": "g1c", "text": "The link was too new for the feed", "note": "Even a mature feed rates contoso[.]sharepoint[.]com clean, because it is clean."}], "correct": "g1a"}, {"id": "g2", "prompt": "2) The technique ID for the record?", "options": [{"id": "g2a", "text": "T1566.003 Spearphishing via Service", "note": "Correct: the lure was delivered through a messaging service, riding the service's own legitimate infrastructure. That is precisely the child technique's scope."}, {"id": "g2b", "text": "T1566.002: it is a link phishing like any other", "note": "The delivery channel is the classification driver here: Teams, not mail. T1566.002 is the mail-delivered child."}, {"id": "g2c", "text": "T1190: the SharePoint was exploited", "note": "Nothing was exploited; a legitimate feature was used as designed by its owner."}], "correct": "g2a"}, {"id": "g3", "prompt": "3) The trained habit that catches this class?", "options": [{"id": "g3a", "text": "Ask 'was I expecting a file from THIS sender?' and check the sharing tenant/site name before any sign-in; unexpected share + sign-in demand = report", "note": "Correct: the domain is trustworthy, the CONTEXT is not. Training must move the checking habit one level up, from domain to context, which is what service-delivered lures demand."}, {"id": "g3b", "text": "Check the domain in the address bar", "note": "The domain check passes here: it is really Microsoft. The habit must extend to tenant and expectation, or it fails this class."}, {"id": "g3c", "text": "Never use SharePoint", "note": "Unrealistic and unenforceable; the platform is core to work."}], "correct": "g3a"}]}, "hint": "Every tool asked 'is this domain bad?'. The right question was 'should this person be sharing with me, and why is a login demanded?'. The user's habit checked the right thing on the wrong level.", "explain": "This lure weaponises legitimacy itself: a real Microsoft SharePoint domain, an attacker-registered tenant, a file-less link, so reputation, sandbox and gateway all correctly report nothing. Classification is T1566.003 because the service carried the attack. The catching habit is contextual, not technical: was I expecting this? who is this sender really? why does a shared file need my password? The M1017 page's line for T1566.003 (train users to identify spearphishing messages with malicious links, including via services) is exactly this upgrade: from domain-checking to context-checking. Coverage artefact 4 shows the module slot that must now be filled.", "study": "Try the two-question habit on your next unexpected 'shared with you' message, whatever the platform."}, {"id": "X12", "type": "ordering", "title": "Sequence under legal hold", "scenario": [{"label": "Artefact \u2014 Situation", "kind": "prose", "text": "A finance director's mailbox was compromised via a service-delivered\nlure (T1566.003). Regulators may inquire (payment sector).\nLegal invokes hold on the mailbox. The attacker session is LIVE.\nThe lure is still in 60 other mailboxes. CFO demands 'wipe it all now'."}, {"label": "The six actions (shuffled)", "kind": "prose", "text": "A. Preserve mailbox state (rules, grants, messages) to the forensic store\nB. Revoke the attacker's session and reset credentials\nC. Notify legal/data-protection that containment is starting (clock awareness)\nD. Purge the lure from the 60 unaffected mailboxes\nE. Audit rules, forwarding, and OAuth grants on the director's mailbox\nF. Deliver the lessons-learned pack, including the training follow-up"}], "question": "Order the six actions.", "widget": {"items": [{"id": "v1", "text": "C. Notify legal/DPO that containment is starting", "note": "First: under hold, the legal clock and preservation duties start with awareness; one call, then you move."}, {"id": "v2", "text": "A. Preserve the director's mailbox state to the forensic store", "note": "Second: the live mailbox holds volatile artefacts (rules, grants, read states) that any destructive step would erase."}, {"id": "v3", "text": "B. Revoke the attacker's session and reset credentials", "note": "Third: evidence secured, now cut live access; the CFO's instinct was right, only the order was wrong."}, {"id": "v4", "text": "E. Audit rules, forwarding, OAuth grants", "note": "Fourth: with access cut, audit at leisure; persistence found here guides scope and regulator answers."}, {"id": "v5", "text": "D. Purge the lure from the 60 mailboxes", "note": "Fifth: the original is preserved and the live session is dead; now protect everyone else."}, {"id": "v6", "text": "F. Lessons-learned pack with training follow-up", "note": "Last: after the dust, feed the M1017 loop; the pack includes what the hold taught you about evidence discipline."}]}, "hint": "One phone call precedes everything. Two things are volatile: the evidence and the access. Which freezes first? And whose mailboxes were never touched?", "explain": "Under legal hold the order is: notify (the clock), preserve (volatile evidence), cut access (now safe), audit persistence, THEN purge the 60 unaffected mailboxes, and finally feed lessons into training. The CFO's 'wipe it all now' executed in that order would destroy exactly the artefacts the regulator may demand. The 60-mailbox purge is safe at position five because the director's mailbox is already preserved and the session dead; purging earlier risks nothing there, but auditing persistence after the cut avoids racing a live attacker. The training follow-up closes the M1017 loop with the strongest case study the programme will get this year.", "study": "Does your IR playbook have a legal-hold variant? If not, today's order is your template."}, {"id": "X13", "type": "multi", "title": "Financial-theft signatures", "scenario": [{"label": "Artefact \u2014 Six signals from six channels (one week)", "kind": "prose", "text": "1. 'CFO' mail: wire 380k today, reply-only, M&A secrecy\n2. Phone call to AP: 'I am the auditor, confirm the bank change code'\n3. Newsletter from a venue the company booked in 2022\n4. Mail: 'your parcel is held, pay 1.99 customs'\n5. Voicemail (spoofed number): 'CEO here, confirm you got my mail, do not loop in IT'\n6. Vendor mail: 'our bank details changed, see attached letter' (domain one letter off)"}], "question": "Select every signal consistent with the financial-theft play (T1657-style).", "widget": {"options": [{"id": "a", "text": "Signal 1: executive-imposed wire with reply-only and secrecy framing", "note": "Correct: urgency plus secrecy plus payment is the T1657 core triple."}, {"id": "b", "text": "Signal 2: phone demand for a bank-change verification code", "note": "Correct: voice-channel financial engineering; codes are exactly what a bank-change fraud needs."}, {"id": "c", "text": "Signal 3: the 2022 venue newsletter", "note": "Plain marketing to a self-inflicted list; no payment or urgency vector."}, {"id": "d", "text": "Signal 4: the 1.99 customs parcel mail", "note": "Small-bait credential/card capture, not a financial-theft operation; different play, different module."}, {"id": "e", "text": "Signal 5: spoofed CEO voicemail steering away from IT", "note": "Correct: 'do not loop in IT' is the isolation instruction of a financial-theft operation (and swatting/doxing pressure sits in the same T1657 family per ATT&CK)."}, {"id": "f", "text": "Signal 6: bank-detail change letter from a one-letter-off domain", "note": "Correct: vendor-impersonation bank-change fraud is the classic T1657 endgame."}], "correct": ["a", "b", "e", "f"]}, "hint": "Ask of each signal: does it move money, or prepare to move money, while isolating the victim? Newsletters and 1.99 baits do neither.", "explain": "Signals 1, 2, 5, and 6 form the financial-theft pattern: payment pressure, verification-code capture, isolation from IT, and vendor bank-change fraud; the M1017 page's T1657 entry explicitly calls for training users to identify exactly these techniques, including the swatting/doxing pressure variants. Signals 3 and 4 are different classes: marketing noise and small-bait credential capture, each deserving their own (lesser) response. Sorting signals into the right PLAY, not just 'phishing or not', is what lets the awareness programme target modules at the fraud team, the AP desk, and executives.", "study": "Walk your AP desk through the four selected signals tomorrow morning; a five-minute drill beats a quarterly module for immediacy."}, {"id": "X14", "type": "multi", "title": "Metrics for the board pack", "scenario": [{"label": "Artefact \u2014 Five candidate metrics (pick what the board pack reports)", "kind": "prose", "text": "A. Simulation completion percentage\nB. Report rate per campaign delivered\nC. Median time-to-report\nD. Number of training slides produced\nE. Percentage of incidents where the first detection was a user report"}], "question": "Select the TWO that belong in the board pack.", "widget": {"options": [{"id": "a", "text": "B. Report rate per campaign delivered", "note": "Correct: the human sensor network's activation rate, per campaign, with a clean denominator."}, {"id": "b", "text": "E. Share of incidents first detected by a user report", "note": "Correct: the direct measure of M1017's detective value: when the human layer is the FIRST sensor, the mitigation is earning its budget."}, {"id": "c", "text": "A. Simulation completion percentage", "note": "Vanity: completion is attendance; it is unauditable as protection and trivially gamed."}, {"id": "d", "text": "D. Slides produced", "note": "Output counting at its purest; no behavioural content whatsoever."}, {"id": "e", "text": "C. Median time-to-report", "note": "A good OPERATIONAL metric (it tunes purge SLAs), but for a board pack the share-of-first-detection and report-rate pair tells the value story more directly; time belongs in the SOC pack."}], "correct": ["b", "e"]}, "hint": "One metric says how often the human sensor fires. One says how often it is the FIRST sensor. The others measure effort or plumbing.", "explain": "The board pair is report rate per campaign (sensor activation) and user-report-first share (sensor primacy): together they state, in two numbers, whether the human firewall fires and whether it is the first line of detection. Median time-to-report is genuinely useful but operational, so it tunes purge SLAs in the SOC pack rather than the board narrative. Completion and slide counts measure effort, and effort metrics invited into board packs eventually replace outcome metrics, which is how programmes decay. Choose board metrics that only behaviour can move.", "study": "Check your last security report: how many of its numbers could a programme inflate without protecting anyone?"}, {"id": "X15", "type": "classify", "title": "The finding you cannot fully fix", "scenario": [{"label": "Artefact \u2014 Auditor's draft finding vs your reality", "kind": "prose", "text": "Finding: 'Organisation complies with CIS 14.1-14.4.'\nYour reality: policy exists (14.1 met); role-based content exists for\nfinance only (14.2 partial); simulations run quarterly, generic\n(14.3 partial); MFA-habit content absent (14.4 gap).\nThe draft finding is WRONG in your favour. Management response due."}], "question": "Two calls.", "widget": {"groups": [{"id": "g1", "prompt": "1) Your response to the draft finding?", "options": [{"id": "g1a", "text": "Request a correction with evidence: partial compliance on 1 id": "cd", "text": "Restrict all 38 mailboxes until week 4", "note": "Collective punishment costs 38 people their productivity and treats the careful 32 as clickers."}], "correct": "ca", "after": "Session runs Thursday; 36 of 38 attend live (2 recorded); the 3 affected users co-present their own 3-minute accounts, anonymised."}, {"id": "y2", "prompt": "2) For the PROCESS, durably?", "options": [{"id": "da", "text": "Gate mailbox provisioning on module completion (access control: no training, no mailbox), with a 48-hour expedited path", "note": "Correct: makes the control self-enforcing at the exact moment risk begins; the expedited path preserves business flexibility so the gate does not breed workarounds."}, {"id": "db", "text": "Send a reminder to HR about scheduling", "note": "Reminders decayed once already; the slip was systemic, not personal."}, {"id": "dc", "text": "Require signed acknowledgements instead of the module", "note": "A signature is not competence; it optimises the paperwork, not the behaviour."}], "correct": "da", "after": "Provisioning gate ships next sprint with the expedited path; week-4 slippage becomes structurally impossible."}, {"id": "y3", "prompt": "3) How do you PROVE the change worked?", "options": [{"id": "ea", "text": "Compare the next intake cohort's 30-day click/report numbers against this cohort's, and report both", "note": "Correct: a natural A/B: same programme, same lure families, gated vs ungated intake. Cohort comparison is the cleanest evidence a behavioural control can produce."}, {"id": "eb", "text": "Report that a gate now exists", "note": "Existence is not effect; the gate could be circumvented or over-harsh and you would not know."}, {"id": "ec", "text": "Survey the cohort on confidence", "note": "Confidence rises after any training; it does not measure behaviour under lure pressure."}], "correct": "ea", "after": "Next cohort (gated): 30-day click rate 2%, report rate 14%, zero credential submissions; the comparison chart enters the board pack."}]}, "hint": "Three different objects: a cohort (people), a process (a gate), a proof (a comparison). One decision each.", "explain": "For the cohort: an immediate, incident-anchored live session closes a proven exposure window, with the affected users co-presenting (anonymised) to convert the incident into curriculum. For the process: gate mailbox provisioning on completion with an expedited path, making the control self-enforcing at the moment risk starts instead of relying on scheduling goodwill. For the proof: cohort-vs-cohort behaviour comparison, the cleanest natural experiment available. Note the MFA detail: users asked a colleague 'which push do I deny?' instead of security, which is what an untaught habit looks like in the wild, and why the gate matters more than the reminder.", "study": "Check your own joiner flow: what can a new employee receive before they complete any security training?"}]};

/* ================= helpers ================= */
function $(s,r){return (r||document).querySelector(s);}
function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmtT(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function byId(arr,id){for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}return null;}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'...':s;}

/* ================= pick & place system ================= */
var PICK={item:null,src:null};
var __justPlacedTick=0;
/* keyboard support: Enter/Space picks an item, or drops the picked item into a focused target (WCAG 2.1 AA) */
function keyInit(root){
  root.addEventListener('keydown',function(ev){
    if(ev.key!==' '&&ev.key!=='Enter')return;
    var t=ev.target;if(!t||!t.classList)return;
    if(t.matches('.dd-item,.word')){
      if(t.classList.contains('locked-out')||t.classList.contains('used'))return;
      ev.preventDefault();
      if(PICK.item===t){t.classList.remove('picked');PICK.item=null;PICK.src=null;}
      else{if(PICK.item)PICK.item.classList.remove('picked');PICK.item=t;PICK.src=t.parentNode;t.classList.add('picked');}
    }else if(t.matches('[data-drop]')&&PICK.item){
      ev.preventDefault();placePicked(t);
    }
  });
}
function placePicked(drop){
  var it=PICK.item;if(!it)return;
  __justPlacedTick=Date.now();
  if(drop.focus)drop.focus();
  it.classList.remove('picked');PICK.item=null;PICK.src=null;
  var ph=drop.querySelector('.ph');if(ph)ph.remove();
  drop.appendChild(it);
  drop.classList.remove('over');
  var empty=drop.getAttribute('data-empty');
  if(empty==='1'&&drop.querySelector('.dd-item,.word'))drop.classList.add('filled');
  document.dispatchEvent(new CustomEvent('placechange'));
}
function pickPlaceInit(root){
  root.addEventListener('click',function(ev){
    var it=ev.target.closest('.dd-item,.word');
    if(it&&!it.classList.contains('used')&&!it.classList.contains('locked-out')){
      if(PICK.item===it){it.classList.remove('picked');PICK.item=null;PICK.src=null;}
      else{
        if(PICK.item)PICK.item.classList.remove('picked');
        PICK.item=it;PICK.src=it.parentNode;it.classList.add('picked');
      }
      ev.stopPropagation();return;
    }
    var drop=ev.target.closest('[data-drop]');
    if(drop&&PICK.item){placePicked(drop);ev.stopPropagation();}
  });
}
/* pointer drag support (mouse + touch) */
function dragInit(root){
  root.addEventListener('pointerdown',function(ev){
    if(ev.target.closest('button'))return;
    var it=ev.target.closest('.dd-item,.word');
    if(!it||it.classList.contains('locked-out')||it.classList.contains('used'))return;
    var startX=ev.clientX,startY=ev.clientY,ghost=null,moved=false;
    var r=it.getBoundingClientRect();
    var offX=ev.clientX-r.left,offY=ev.clientY-r.top;
    var fromDrop=it.closest('[data-drop]');
    var mv=function(e){
      if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>6)moved=true;
      if(!moved)return;
      if(!ghost){ghost=it.cloneNode(true);ghost.classList.add('dragging');ghost.style.position='fixed';ghost.style.zIndex=999;ghost.style.width=r.width+'px';ghost.style.pointerEvents='none';ghost.style.margin='0';document.body.appendChild(ghost);it.classList.add('dragging');}
      ghost.style.left=(e.clientX-offX)+'px';ghost.style.top=(e.clientY-offY)+'px';
      $all('.over',root).forEach(function(x){x.classList.remove('over')});
      var t=document.elementFromPoint(e.clientX,e.clientY);
      var d=t&&t.closest?t.closest('[data-drop]'):null;
      if(d&&d!==fromDrop)d.classList.add('over');
    };
    var up=function(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      if(ghost){
        ghost.remove();it.classList.remove('dragging');
        if(moved){
          var t=document.elementFromPoint(e.clientX,e.clientY);
          var d=t&&t.closest?t.closest('[data-drop]'):null;
          if(d&&d!==fromDrop){
            it.classList.remove('picked');PICK.item=null;PICK.src=null;
            var ph=d.querySelector('.ph');if(ph)ph.remove();
            d.appendChild(it);
            if(d.getAttribute('data-empty')==='1'&&d.querySelector('.dd-item,.word'))d.classList.add('filled');
            document.dispatchEvent(new CustomEvent('placechange'));
          }
        }
      }
      $all('.over',root).forEach(function(x){x.classList.remove('over')});
    };
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
}

/* ================= widget renderers =================
   each returns {collect: fn() -> {H,W,N,items:[{st,label,note}]}} */
function renderWidget(ex,ansBox){
  switch(ex.type){
    case 'multi':return wQcm(ex,ansBox,true);
    case 'classify':return wClassify(ex,ansBox);
    case 'matching':return wMatching(ex,ansBox);
    case 'baskets':return wBaskets(ex,ansBox);
    case 'ordering':return wOrdering(ex,ansBox);
    case 'fillblank':return wFillblank(ex,ansBox);
    case 'branching':return wBranching(ex,ansBox);
    case 'logviewer':return wLogviewer(ex,ansBox);
    case 'matrixclick':return wMatrix(ex,ansBox);
    case 'spotmistake':return wSpot(ex,ansBox);
    default:return wQcm(ex,ansBox,false); /* qcm */
  }
}
function singleAnswerType(t){return t==='qcm';}

/* --- qcm / multi --- */
function wQcm(ex,box,isMulti){
  var w=ex.widget;
  var opts=shuffle(w.options);
  var chosen={};
  var list=el('div','opts');
  opts.forEach(function(o,i){
    var b=el('button','opt');b.type='button';b.setAttribute('data-oid',o.id);
    b.innerHTML='<span class="k">'+String.fromCharCode(65+i)+'.</span><span class="tx">'+esc(o.text)+'</span>';
    b.addEventListener('click',function(){
      if(b.classList.contains('locked-out'))return;
      if(isMulti){chosen[o.id]=!chosen[o.id];b.classList.toggle('sel',!!chosen[o.id]);}
      else{chosen={};$all('.opt',box).forEach(function(x){x.classList.remove('sel')});chosen[o.id]=true;b.classList.add('sel');}
    });
    list.appendChild(b);
  });
  box.appendChild(list);
  if(isMulti){box.appendChild(el('p','mini-note','Select all options that are correct. Wrong selections subtract from correct ones.'));}
  return {collect:function(){
    if(!isMulti){
      var ok=!!chosen[w.correct];
      return {H:ok?1:0,W:ok?0:1,N:1,items:[],correctIds:[w.correct],single:true,selId:Object.keys(chosen)[0]||null};
    }
    var H=0,W=0,items=[],exp=w.correct;
    exp.forEach(function(id){
      var o=byId(w.options,id);
      if(chosen[id]){H++;items.push({st:'ok',label:o.text,note:o.note});}
      else{items.push({st:'miss',label:o.text,note:o.note});}
    });
    w.options.forEach(function(o){
      if(exp.indexOf(o.id)<0&&chosen[o.id]){W++;items.push({st:'bad',label:o.text,note:o.note});}
    });
    return {H:H,W:W,N:exp.length,items:items,correctIds:exp};
  },opts:opts};
}

/* --- classify (several independent mini-choices) --- */
function wClassify(ex,box){
  var w=ex.widget;var picks={};
  w.groups.forEach(function(g,gi){
    var gd=el('div','art');
    gd.appendChild(el('div','art-h','Item '+(gi+1)+' of '+w.groups.length+' &mdash; '+esc(g.prompt)));
    var inner=el('div','art-b');
    var row=el('div','chipgrid');
    shuffle(g.options).forEach(function(o){
      var c=el('button','chip');c.type='button';c.setAttribute('data-gid',g.id);c.setAttribute('data-oid',o.id);
      c.textContent=o.text;
      c.addEventListener('click',function(){
        if(c.classList.contains('locked-out'))return;
        picks[g.id]=o.id;
        $all('.chip',row).forEach(function(x){x.classList.remove('sel')});
        c.classList.add('sel');
      });
      row.appendChild(c);
    });
    inner.appendChild(row);gd.appendChild(inner);box.appendChild(gd);
  });
  return {collect:function(){
    var H=0,W=0,N=w.groups.length,items=[];
    w.groups.forEach(function(g){
      var co=byId(g.options,g.correct);var p=picks[g.id];
      if(p===g.correct){H++;items.push({st:'ok',label:g.prompt,note:(co&&co.note)||''});}
      else if(p==null){items.push({st:'miss',label:g.prompt,note:(co&&co.note)||''});}
      else{var po=byId(g.options,p);W++;items.push({st:'bad',label:g.prompt+' — you chose: '+po.text,note:(co&&co.note)||''});}
    });
    return {H:H,W:W,N:N,items:items};
  }};
}

/* --- matching --- */
function wMatching(ex,box){
  var w=ex.widget;
  var rights=shuffle(w.right);
  var area=el('div');
  area.appendChild(el('p','mini-note','Click a card in the word bank, then click a slot. You can also drag the cards. Click a filled slot to put the card back.'));
  var slotsBox=el('div');
  w.left.forEach(function(l){
    var row=el('div','slotrow');
    var sl=el('span','sl');sl.textContent=l.text;
    var slot=el('div','slot');slot.setAttribute('data-drop','1');slot.setAttribute('data-slot',l.id);slot.setAttribute('data-empty','1');
    slot.innerHTML='<span class="ph">Drop the match here</span>';
    row.appendChild(sl);row.appendChild(slot);slotsBox.appendChild(row);
  });
  area.appendChild(slotsBox);
  area.appendChild(el('h2',null,'Word bank'));
  var bank=el('div','bank');bank.setAttribute('data-drop','1');bank.setAttribute('data-empty','1');
  rights.forEach(function(r){
    var it=el('div','word');it.setAttribute('data-rid',r.id);it.textContent=r.text;
    bank.appendChild(it);
  });
  area.appendChild(bank);
  box.appendChild(area);
  $all('.slot',box).forEach(function(sl){sl.setAttribute('tabindex','0');sl.setAttribute('role','button');sl.setAttribute('aria-label','Drop target for '+sl.parentNode.querySelector('.sl').textContent+'. Press Enter to place the picked card.');});
  bank.setAttribute('tabindex','0');bank.setAttribute('role','button');bank.setAttribute('aria-label','Word bank. Press Enter to take back the picked card.');
  $all('.word',bank).forEach(function(wd){wd.setAttribute('tabindex','0');wd.setAttribute('role','button');wd.setAttribute('aria-label','Card: '+wd.textContent);});
  pickPlaceInit(box);dragInit(box);keyInit(box);
  box.addEventListener('click',function(ev){
    if(Date.now()-__justPlacedTick<80)return; /* this click just placed a word; do not take it back */
    var slot=ev.target.closest('.slot');
    if(slot&&PICK.item&&PICK.item.classList.contains('word'))return; /* placing handled by pickPlace */
    if(slot){
      var wd=slot.querySelector('.word');
      if(wd){
        bank.appendChild(wd);
        slot.classList.remove('filled');
        slot.innerHTML='<span class="ph">Drop the match here</span>';
        document.dispatchEvent(new CustomEvent('placechange'));
      }
    }
  });
  return {collect:function(){
    var H=0,W=0,N=w.left.length,items=[];
    w.left.forEach(function(l){
      var slot=box.querySelector('[data-slot="'+l.id+'"]');
      var wd=slot.querySelector('.word');
      var correctR=w.pairs[l.id];
      var co=byId(w.right,correctR);
      if(!wd){items.push({st:'miss',label:l.text,note:(co&&co.note)||('Correct match: '+co.text)});}
      else if(wd.getAttribute('data-rid')===correctR){H++;items.push({st:'ok',label:l.text+' = '+co.text,note:(co&&co.note)||''});}
      else{var chosenR=byId(w.right,wd.getAttribute('data-rid'));W++;items.push({st:'bad',label:l.text+' = '+chosenR.text,note:(co&&co.note)||('Correct match: '+co.text)});}
    });
    return {H:H,W:W,N:N,items:items};
  }};
}

/* --- ordering --- */
function wOrdering(ex,box){
  var w=ex.widget;
  var list=el('div','ordlist');
  var cur=shuffle(w.items);
  function draw(){
    list.innerHTML='';
    cur.forEach(function(it,i){
      var row=el('div','ord-item');row.setAttribute('data-oid',it.id);
      row.appendChild(el('span','pos',(i+1)+'.'));
      row.appendChild(el('span','txt',esc(it.text)));
      var mv=el('span','mv');
      var up=el('button',null,'\u25B2');up.type='button';up.setAttribute('aria-label','Move up');
      var dn=el('button',null,'\u25BC');dn.type='button';dn.setAttribute('aria-label','Move down');
      up.addEventListener('click',function(){if(i>0){var t=cur[i-1];cur[i-1]=cur[i];cur[i]=t;draw();}});
      dn.addEventListener('click',function(){if(i<cur.length-1){var t=cur[i+1];cur[i+1]=cur[i];cur[i]=t;draw();}});
      mv.appendChild(up);mv.appendChild(dn);row.appendChild(mv);
      list.appendChild(row);
    });
  }
  draw();
  box.appendChild(el('p','mini-note','Put the steps in the right order: use the arrows, or drag a row onto another row.'));
  box.appendChild(list);
  list.addEventListener('pointerdown',function(ev){
    if(ev.target.closest('button'))return;
    var row=ev.target.closest('.ord-item');
    if(!row||row.classList.contains('locked-out'))return;
    var startY=ev.clientY;var started=false;
    var mv=function(e){
      if(!started&&Math.abs(e.clientY-startY)<8)return;
      started=true;row.classList.add('dragging');
      var t=document.elementFromPoint(e.clientX,e.clientY);
      var over=t&&t.closest?t.closest('.ord-item'):null;
      $all('.ord-item',list).forEach(function(x){if(x!==row)x.classList.remove('over')});
      if(over&&over!==row)over.classList.add('over');
    };
    var up=function(e){
      document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
      row.classList.remove('dragging');
      if(started){
        var t=document.elementFromPoint(e.clientX,e.clientY);
        var over=t&&t.closest?t.closest('.ord-item'):null;
        if(over&&over!==row){
          var fi=-1,ti=-1;
          $all('.ord-item',list).forEach(function(x,i){
            if(x===row)fi=i;if(x===over)ti=i;
          });
          cur.splice(ti,0,cur.splice(fi,1)[0]);
          draw();
        }
      }
      $all('.ord-item',list).forEach(function(x){x.classList.remove('over')});
    };
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
  });
  return {collect:function(){
    var H=0,W=0,N=cur.length,items=[];
    var canon={};w.items.forEach(function(it,i){canon[it.id]=i;});
    cur.forEach(function(it,i){
      if(canon[it.id]===i){H++;items.push({st:'ok',label:'Your step '+(i+1)+': '+it.text,note:it.note});}
      else{W++;items.push({st:'bad',label:'Your step '+(i+1)+': '+it.text,note:it.note+' Correct position: step '+(canon[it.id]+1)+'.'});}
    });
    return {H:H,W:W,N:N,items:items};
  }};
}
