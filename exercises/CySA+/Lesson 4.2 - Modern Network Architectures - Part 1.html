    ' &nbsp;·&nbsp; ' + POINTS_EACH + ' POINTS' + (S.hints[id] ? ' &nbsp;·&nbsp; <span style="color:var(--warn)">HINT USED −' + HINT_COST + '</span>' : '') +
    '</div><div class="qtitle">' + ex.title + '</div></div><span class="qbadge">' + ex.badge + '</span></div>' +
    '<div class="qtags"><span class="tag" style="border-color:' + THEMES[ex.theme].color + '55;color:' + THEMES[ex.theme].color + ';background:transparent">' + THEMES[ex.theme].name + '</span>' +
    ex.keywords.map(k => '<span class="tag">' + esc(k) + '</span>').join('') + '</div>' +
    (ex.scenario ? '<div class="scenario"><span class="who">Situation brief</span>' + ex.scenario + '</div>' : '') +
    '<div class="prompt">' + ex.prompt + '</div>';
  card.innerHTML = html;

  if (ex.attach){
    const a = ex.attach;
    if (a.kind === 'log') card.appendChild(buildLogView(a));
    else if (a.kind === 'table') card.appendChild(buildTableView(a));
  }

  const body = document.createElement('div');
  card.appendChild(body);

  const actions = document.createElement('div'); actions.className = 'actions';
  const hintBtn = document.createElement('button'); hintBtn.className = 'ghost warnb';
  hintBtn.innerHTML = S.hints[id] ? '💡 Show hint again' : '💡 Hint (−' + HINT_COST + ' pt)';
  hintBtn.onclick = () => {
    if (!S.hints[id]){ S.hints[id] = true; renderSide(); updateHUD(); }
    if (!$('.hintbox', card)){
      const hb = document.createElement('div'); hb.className = 'hintbox';
      hb.innerHTML = '<b>Hint:</b> ' + hintText(ex);
      card.insertBefore(hb, actions);
    }
    hintBtn.innerHTML = '💡 Show hint again';
  };
  const spacer = document.createElement('div'); spacer.className = 'spacer';
  const submitBtn = document.createElement('button'); submitBtn.className = 'primary'; submitBtn.textContent = '✔ Submit answer';
  const nextBtn = document.createElement('button'); nextBtn.textContent = 'Next exercise →';
  actions.appendChild(hintBtn); actions.appendChild(spacer); actions.appendChild(submitBtn); actions.appendChild(nextBtn);
  card.appendChild(actions);
  const resHost = document.createElement('div'); card.appendChild(resHost);
  host.appendChild(card);

  if (S.hints[id]){
    const hb = document.createElement('div'); hb.className = 'hintbox';
    hb.innerHTML = '<b>Hint:</b> ' + hintText(ex);
    card.insertBefore(hb, actions);
  }

  const update = () => {
    submitBtn.disabled = !!S.res[id] || (API && !API.ready());
    nextBtn.style.display = S.res[id] ? '' : 'none';
    nextBtn.textContent = (S.idx === EX.length - 1) ? 'See final results →' : 'Next exercise →';
  };
  API = mountExercise(ex, body, update);

  submitBtn.onclick = () => {
    if (S.res[id] || !API.ready()) return;
    const g = API.grade();
    S.res[id] = { score:g.score, correct:g.score >= 0.999, correctText:g.correctText, yourText:g.yourText };
    API.reveal();
    showFeedback(ex, g, resHost);
    renderSide(); updateHUD(); update();
    resHost.scrollIntoView({ behavior:'smooth', block:'nearest' });
  };
  nextBtn.onclick = () => {
    if (S.idx < EX.length - 1){ S.idx++; renderQuestion(); renderSide(); updateHUD(); window.scrollTo(0,0); return; }
    const left = EX.filter(x => !S.res[x.id]).length;
    if (left && !window.confirm('You still have ' + left + ' exercise(s) unanswered. They will score zero.\n\nSubmit the exam now?')) return;
    finishExam(false);
  };

  if (S.res[id]){
    const g = { score:S.res[id].score, correctText:S.res[id].correctText, yourText:S.res[id].yourText };
    API.reveal();
    showFeedback(ex, g, resHost, true);
  }
  update();
}

function showFeedback(ex, g, host, replay){
  const pct = Math.round(g.score * 100);
  const cls = g.score >= 0.999 ? 'ok' : (g.score > 0 ? 'mid' : 'bad');
  const verdict = g.score >= 0.999 ? 'FULL MARKS +' + POINTS_EACH : (g.score > 0 ? 'PARTIAL ' + pct + '% · +' + Math.round(POINTS_EACH * g.score) : 'NO MARKS +0');
  const box = document.createElement('div');
  box.className = 'resbox ' + cls;
  let h = '<h5>' + (g.score >= 0.999 ? '✅ Correct' : (g.score > 0 ? '🟡 Almost' : '❌ Not this time')) +
          '<span class="verdict">' + verdict + '</span></h5>';
  if (g.yourText && g.score < 0.999) h += '<p><b>What you answered:</b><br><span class="yourans">' + g.yourText + '</span></p>';
  if (g.correctText) h += '<p><b>Correct answer:</b><br><span class="correctans">' + g.correctText + '</span></p>';
  if (g.detail) h += '<p>' + g.detail + '</p>';
  h += '<p><b>Why:</b> ' + ex.explain + '</p>';
  if (g.score < 0.999 && ex.focus) h += '<div class="focus"><b>Focus on this:</b> ' + ex.focus + '</div>';
  box.innerHTML = h;
  host.appendChild(box);
}

/* --------------------------- attachment builders -------------------------- */
function buildLogView(a){
  const box = document.createElement('div'); box.className = 'logwrap';
  const tools = document.createElement('div'); tools.className = 'logtools';
  tools.innerHTML = '<span>🔎 filter</span>';
  const inp = document.createElement('input');
  inp.placeholder = 'type to filter rows — try: Success, 45[.]155, MFA, MailSync, registered';
  const cnt = document.createElement('span');
  tools.appendChild(inp); tools.appendChild(cnt);
  const sc = document.createElement('div'); sc.className = 'logscroll';
  const t = document.createElement('table'); t.className = 'logt';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr>' + a.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
  const tb = document.createElement('tbody');
  a.rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.dataset.text = r.join(' ').toLowerCase();
    tr.innerHTML = r.map(c => '<td>' + hl(c) + '</td>').join('');
    tb.appendChild(tr);
  });
  t.appendChild(thead); t.appendChild(tb); sc.appendChild(t);
  const bar = document.createElement('div'); bar.className = 'codebar';
  bar.innerHTML = '<span class="dot" style="background:#22d3ee"></span><span>' + esc(a.title) + '</span>';
  box.appendChild(bar); box.appendChild(tools); box.appendChild(sc);
  const apply = () => {
    const q = inp.value.trim().toLowerCase();
    let shown = 0;
    $$('tr', tb).forEach(tr => {
      const hit = !q || tr.dataset.text.indexOf(q) > -1;
      tr.classList.toggle('hidden', !hit);
      if (hit) shown++;
    });
    cnt.textContent = shown + ' / ' + a.rows.length + ' rows';
  };
  inp.oninput = apply; apply();
  return box;
}
function buildTableView(a){
  const box = document.createElement('div'); box.className = 'logwrap';
  const bar = document.createElement('div'); bar.className = 'codebar';
  bar.innerHTML = '<span class="dot" style="background:#a78bfa"></span><span>' + esc(a.title) + '</span>';
  const sc = document.createElement('div'); sc.className = 'logscroll';
  const t = document.createElement('table'); t.className = 'logt';
  t.innerHTML = '<thead><tr>' + a.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
    a.rows.map(r => '<tr>' + r.map(c => '<td>' + hl(c) + '</td>').join('') + '</tr>').join('') + '</tbody>';
  sc.appendChild(t);
  box.appendChild(bar); box.appendChild(sc);
  return box;
}

/* ------------------------------ mount router ------------------------------ */
function mountExercise(ex, body, update){
  switch (ex.type){
    case 'mcq':      return mountMcq(ex, body, update);
    case 'multi':    return mountMulti(ex, body, update);
    case 'place':    return mountPlace(ex, body, update);
    case 'spot':     return mountSpot(ex, body, update);
    case 'terminal': return mountTerminal(ex, body, update);
    case 'branch':   return mountBranch(ex, body, update);
    case 'triage':   return mountTriage(ex, body, update);
    case 'dual':     return mountDual(ex, body, update);
  }
  return { ready:()=>false, grade:()=>({score:0,correctText:''}), reveal:()=>{} };
}

/* ---------------------------- generic option list ------------------------- */
function optionList(opts, order, multi, getSel, onPick){
  const wrap = document.createElement('div'); wrap.className = 'opts';
  const els = [];
  order.forEach((oi, pos) => {
    const o = opts[oi];
    const el = document.createElement('div');
    el.className = 'opt' + (multi ? ' multi' : '');
    el.innerHTML = '<div class="mk">' + (multi ? '' : String.fromCharCode(65 + pos)) + '</div><div>' + o.t + '</div>';
    el.onclick = () => onPick(oi, pos);
    clickable(el);
    els.push(el); wrap.appendChild(el);
  });
  return { wrap:wrap, els:els };
}
function decorateOption(el, o, chosen, locked){
  if (!locked) return;
  el.classList.add('locked');
  const cdiv = el.lastElementChild;
  if (o.ok){ el.classList.add('ok'); el.firstElementChild.innerHTML = '✓'; }
  else if (chosen){ el.classList.add('no'); el.firstElementChild.innerHTML = '✗'; }
  const w = document.createElement('span');
  w.className = 'why ' + (o.ok ? 'good' : 'bad');
  w.innerHTML = (o.ok ? '✓ ' : '✗ ') + (o.why || '');
  cdiv.appendChild(w);
}

/* ------------------------------- MCQ -------------------------------------- */
function mountMcq(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = {});
  const order = S.shuf[ex.id].opts;
  function render(){
    body.innerHTML = '';
    const list = optionList(ex.opts, order, false, () => st.pick, (oi, pos) => {
      if (st.locked) return;
      st.pick = oi; update();
      list.els.forEach((e2, k) => e2.classList.toggle('sel', k === pos));
    });
    order.forEach((oi, pos) => {
      if (!st.locked && oi === st.pick) list.els[pos].classList.add('sel');
      decorateOption(list.els[pos], ex.opts[oi], oi === st.pick, st.locked);
    });
    body.appendChild(list.wrap);
  }
  render();
  return {
    ready: () => typeof st.pick === 'number',
    grade: () => {
      const o = ex.opts[st.pick];
      return { score: o.ok ? 1 : 0,
               yourText: esc(o.t),
               correctText: ex.opts.filter(x => x.ok).map(x => x.t).join(' ') };
    },
    reveal: () => { st.locked = true; render(); }
  };
}

/* ------------------------------- MULTI ------------------------------------ */
function mountMulti(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = { picks:[] });
  const order = S.shuf[ex.id].opts;
  function render(){
    body.innerHTML = '';
    const list = optionList(ex.opts, order, true, () => st.picks, (oi, pos) => {
      if (st.locked) return;
      const i = st.picks.indexOf(oi);
      if (i > -1) st.picks.splice(i, 1); else st.picks.push(oi);
      update();
      list.els[pos].classList.toggle('sel', st.picks.indexOf(oi) > -1);
      list.els[pos].firstElementChild.innerHTML = st.picks.indexOf(oi) > -1 ? '✓' : '';
    });
    order.forEach((oi, pos) => {
      const chosen = st.picks.indexOf(oi) > -1;
      if (!st.locked && chosen){ list.els[pos].classList.add('sel'); list.els[pos].firstElementChild.innerHTML = '✓'; }
      decorateOption(list.els[pos], ex.opts[oi], chosen, st.locked);
    });
    const tip = document.createElement('div');
    tip.className = 'tiny'; tip.style.marginTop = '10px';
    tip.textContent = 'Selected ' + st.picks.length + ' of ' + ex.opts.length + ' — select every statement that is correct, no more and no fewer.';
    body.appendChild(list.wrap); body.appendChild(tip);
  }
  render();
  return {
    ready: () => st.picks.length > 0,
    grade: () => {
      const good = ex.opts.filter((o, i) => o.ok && st.picks.indexOf(i) > -1).length;
      const bad  = ex.opts.filter((o, i) => !o.ok && st.picks.indexOf(i) > -1).length;
      const total = ex.opts.filter(o => o.ok).length;
      const wrongTotal = ex.opts.length - total;
      /* selecting every option must score zero, so the penalty is normalised
         by how many wrong options existed, not by how many were ticked. */
      const score = Math.max(0, (good / total) - (wrongTotal ? bad / wrongTotal : 0));
      return { score: score,
               yourText: st.picks.length ? ex.opts.filter((o, i) => st.picks.indexOf(i) > -1).map(o => esc(o.t)).join('<br>') : 'nothing selected',
               correctText: ex.opts.filter(o => o.ok).map(o => o.t).join('  •  ') };
    },
    reveal: () => { st.locked = true; render(); }
  };
}

/* ------------------------------- PLACE ------------------------------------ */
function mountPlace(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = { assign:{}, sel:null });
  const itemOrder = S.shuf[ex.id].items;
  const itemById = {}; ex.items.forEach(i => itemById[i.id] = i);
  const slotById = {}; ex.slots.forEach(s => slotById[s.id] = s);
  const root = document.createElement('div');
  body.appendChild(root);

  function chipEl(iid, inSlot){
    const c = document.createElement('div');
    const placed = !!st.assign[iid];
    let cls = 'chip';
    if (st.sel === iid && !st.locked) cls += ' sel';
    if (st.locked){
      cls += ' locked';
      if (ex.correct[iid]) cls += (st.assign[iid] === ex.correct[iid]) ? ' ok' : ' no';
      else cls += ' no';
    }
    c.className = cls;
    c.draggable = !st.locked;
    c.innerHTML = '<span>' + esc(itemById[iid].text) + '</span>' + (placed && !st.locked ? '<span class="x">↩</span>' : '');
    if (!st.locked){
      c.onclick = ev => {
        ev.stopPropagation();
        if (st.assign[iid]){ delete st.assign[iid]; st.sel = null; render(); update(); return; }
        st.sel = (st.sel === iid) ? null : iid; render();
      };
      c.ondragstart = e => { e.dataTransfer.setData('text/plain', iid); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); };
      c.ondragend = () => c.classList.remove('dragging');
      clickable(c);
    }
    return c;
  }
  function place(iid, sid){
    if (st.locked || !itemById[iid]) return;
    Object.keys(st.assign).forEach(k => { if (st.assign[k] === sid) delete st.assign[k]; });
    delete st.assign[iid];
    st.assign[iid] = sid; st.sel = null; render(); update();
  }
  function bindSlot(el, sid, allowRemove){
    if (st.locked) return;
    el.ondragover = e => { e.preventDefault(); el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');
    el.ondrop = e => { e.preventDefault(); el.classList.remove('over'); place(e.dataTransfer.getData('text/plain'), sid); };
    el.onclick = e => {
      e.stopPropagation();
      if (st.sel){ place(st.sel, sid); return; }
      if (!allowRemove) return;
      const occ = Object.keys(st.assign).find(k => st.assign[k] === sid);
      if (occ){ delete st.assign[occ]; render(); update(); }
    };
    clickable(el);
  }
  function render(){
    root.innerHTML = '';
    if (ex.layout === 'inline'){
      const box = document.createElement('div');
      box.className = 'pinline' + (ex.monoStem ? ' mono' : '');
      if (ex.monoStem) box.style.fontFamily = 'var(--mono)', box.style.fontSize = '13.4px';
      const parts = ex.stems.split(/\[\[(\w+)\]\]/);
      parts.forEach((p, ix) => {
        if (ix % 2 === 0){ const s = document.createElement('span'); s.innerHTML = p.replace(/\n/g, '<br>'); box.appendChild(s); return; }
        const sid = p;
        const filler = Object.keys(st.assign).find(k => st.assign[k] === sid);
        const holder = document.createElement('span');
        let cls = 'islot';
        if (filler) cls += ' filled';
        if (st.locked){
          const want = Object.keys(ex.correct).find(k => ex.correct[k] === sid);
          cls += (filler === want) ? ' solved' : ' bad';
        }
        holder.className = cls;
        holder.innerHTML = filler
          ? '<span>' + esc(itemById[filler].text) + '</span>' + (st.locked ? '' : '<span class="x" style="margin-left:7px;color:var(--dim2)">↩</span>')
          : '<span class="ph">' + esc(slotById[sid].label) + '</span>';
        if (!st.locked){
          if (filler) holder.title = 'Click to send this keyword back to the bank';
          bindSlot(holder, sid, true);
        }
        box.appendChild(holder);
      });
      root.appendChild(box);
    } else {
      const grid = document.createElement('div'); grid.className = 'slots cols';
      ex.slots.forEach(s => {
        const slot = document.createElement('div'); slot.className = 'slot';
        const occupants = Object.keys(st.assign).filter(k => st.assign[k] === s.id);
        if (st.locked){
          if (occupants.length && occupants.every(o => ex.correct[o] === s.id)) slot.classList.add('solved');
        }
        const lbl = document.createElement('div'); lbl.className = 'slabel';
        lbl.innerHTML = '<span>' + esc(s.label) + '</span><span class="cnt">' + occupants.length + '</span>';
        const drop = document.createElement('div'); drop.className = 'drop';
        occupants.forEach(o => drop.appendChild(chipEl(o, true)));
        slot.appendChild(lbl); slot.appendChild(drop);
        bindSlot(slot, s.id);
        bindSlot(drop, s.id);
        grid.appendChild(slot);
      });
      root.appendChild(grid);
    }
    const bank = document.createElement('div'); bank.className = 'chipbank';
    const rest = itemOrder.filter(iid => !st.assign[iid]);
    if (rest.length) rest.forEach(iid => bank.appendChild(chipEl(iid, false)));
    else { const h = document.createElement('span'); h.className = 'hintline'; h.textContent = 'Bank empty — every item is placed. Click a placed item to send it back.'; bank.appendChild(h); }
    root.appendChild(bank);
    const tip = document.createElement('div'); tip.className = 'tiny'; tip.style.marginBottom = '6px';
    tip.textContent = st.locked ? '' : 'Click a chip to select it, then click a slot. Drag & drop works too. ' +
      (Object.keys(ex.correct).length ? 'A perfect answer needs ' + Object.keys(ex.correct).length + ' items in the right place.' : '');
    root.insertBefore(tip, root.firstChild);
  }
  render();
  const total = Object.keys(ex.correct).length;
  return {
    ready: () => {
      const slotsFilled = ex.slots.every(s => Object.keys(st.assign).some(k => st.assign[k] === s.id));
      if (!slotsFilled) return false;
      /* When the bank contains decoy words, filling every gap is enough to submit:
         the student must judge which words belong, not be blocked by the engine.
         When every item is a real answer (grouping / ranking), all of them must be placed. */
      const hasDistractors = ex.items.some(i => !ex.correct[i.id]);
      if (hasDistractors) return true;
      return Object.keys(ex.correct).every(k => !!st.assign[k]);
    },
    grade: () => {
      let good = 0;
      const detail = [];
      ex.items.forEach(it => {
        const want = ex.correct[it.id]; if (!want) return;
        if (st.assign[it.id] === want) good++;
        else detail.push('<b>' + esc(it.text) + '</b> → you put it in "' + esc(st.assign[it.id] ? slotById[st.assign[it.id]].label : 'not placed') + '"');
      });
      let score;
      if (ex.ordered){
        const seq = ex.slots.map(s => Object.keys(st.assign).find(k => st.assign[k] === s.id) || '');
        const want = ex.slots.map(s => Object.keys(ex.correct).find(k => ex.correct[k] === s.id));
        score = orderScore(seq, want);
      } else score = Math.max(0, good / total);
      const correctText = ex.slots.map(s => {
        const wants = Object.keys(ex.correct).filter(k => ex.correct[k] === s.id);
        return '<b>' + esc(s.label) + '</b>: ' + (wants.length ? wants.map(k => esc(itemById[k].text)).join(' &nbsp;·&nbsp; ') : '—');
      }).join('<br>');
      const yourText = ex.slots.map(s => {
        const occ = Object.keys(st.assign).filter(k => st.assign[k] === s.id);
        return '<b>' + esc(s.label) + '</b>: ' + (occ.length ? occ.map(k => esc(itemById[k].text)).join(' &nbsp;·&nbsp; ') : '—');
      }).join('<br>');
      const d = detail.length ? '<b>Misplaced (' + detail.length + '):</b><br>' + detail.join('<br>') : '';
      return { score:score, yourText:yourText, correctText:correctText, detail:d };
    },
    reveal: () => { st.locked = true; st.sel = null; render(); }
  };
}
function orderScore(seq, want){
  const n = want.length;
  let pos = 0;
  for (let i = 0; i < n; i++) if (seq[i] === want[i]) pos++;
  let pairs = 0, tot = 0;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){
    tot++;
    const a = seq.indexOf(want[i]), b = seq.indexOf(want[j]);
    if (a > -1 && b > -1 && a < b) pairs++;
  }
  return Math.max(0, Math.min(1, 0.6 * (pos / n) + 0.4 * (tot ? pairs / tot : 1)));
}

/* -------------------------------- SPOT ------------------------------------ */
function mountSpot(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = {});
  function render(){
    body.innerHTML = '';
    const box = document.createElement('div'); box.className = 'codebox';
    const bar = document.createElement('div'); bar.className = 'codebar';
    bar.innerHTML = '<span class="dot" style="background:#ef4444"></span><span class="dot" style="background:#f59e0b"></span>' +
      '<span class="dot" style="background:#22c55e"></span><span style="margin-left:8px">' + esc(ex.lang || 'config') + '</span>' +
      '<span style="margin-left:auto">click the line with the flaw</span>';
    const pre = document.createElement('pre');
    ex.lines.forEach((ln, i) => {
      const d = document.createElement('div');
      d.className = 'codeline' + (st.locked ? '' : ' click');
      if (st.locked){
        if (i + 1 === ex.answer) d.classList.add('right');
        else if (i + 1 === st.pick) d.classList.add('wrongpick');
      } else if (i + 1 === st.pick) d.classList.add('pick');
      d.innerHTML = '<span class="ln">' + (i + 1) + '</span><span>' + hl(ln) + '</span>';
      if (!st.locked) { d.onclick = () => { st.pick = i + 1; render(); update(); }; clickable(d); }
      pre.appendChild(d);
    });
    box.appendChild(bar); box.appendChild(pre);
    body.appendChild(box);
    const tip = document.createElement('div'); tip.className = 'tiny';
    tip.textContent = st.pick && !st.locked ? 'Line ' + st.pick + ' selected.' : (st.locked ? '' : 'No line selected yet.');
    body.appendChild(tip);
  }
  render();
  return {
    ready: () => typeof st.pick === 'number',
    grade: () => ({ score: st.pick === ex.answer ? 1 : 0,
                    yourText: 'Line ' + st.pick + ': ' + esc(ex.lines[st.pick - 1]),
                    correctText: 'Line ' + ex.answer + ': ' + esc(ex.lines[ex.answer - 1]) }),
    reveal: () => { st.locked = true; render(); }
  };
}

/* ------------------------------ TERMINAL ---------------------------------- */
function mountTerminal(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = { log:[], cmd:'' });
  const wrap = document.createElement('div'); wrap.className = 'termwrap';
  const bar = document.createElement('div'); bar.className = 'termbar';
  bar.innerHTML = '<span class="dot" style="background:#ef4444"></span><span class="dot" style="background:#f59e0b"></span>' +
    '<span class="dot" style="background:#22c55e"></span><span style="margin-left:8px">' + esc(ex.term.host) + ' — bash</span>';
  const out = document.createElement('div'); out.className = 'termbody';
  const line = document.createElement('div'); line.className = 'termline';
  const ps1 = document.createElement('span'); ps1.className = 'p'; ps1.textContent = ex.term.host + ':~$';
  const inp = document.createElement('input');
  inp.setAttribute('spellcheck', 'false');
  inp.setAttribute('autocomplete', 'off');
  inp.placeholder = 'type the command and press Enter…';
  line.appendChild(ps1); line.appendChild(inp);
  wrap.appendChild(bar); wrap.appendChild(out); wrap.appendChild(line);
  body.appendChild(wrap);
  const checksBox = document.createElement('div'); checksBox.className = 'checks';
  body.appendChild(checksBox);

  (ex.term.intro || []).forEach(l => { const d = document.createElement('div'); d.className = 'o'; d.innerHTML = hl(l); out.appendChild(d); });
  const echo = cmd => {
    const d = document.createElement('div');
    d.innerHTML = '<span class="p">' + esc(ex.term.host) + ':~$</span> <span class="s">' + esc(cmd) + '</span>';
    out.appendChild(d);
    out.scrollTop = out.scrollHeight;
  };
  st.log.forEach(echo);
  const lastCmd = () => (inp.value.trim() || st.cmd || '');
  inp.oninput = () => update();
  inp.onkeydown = e => {
    if (e.key !== 'Enter' || st.locked) return;
    const v = inp.value.trim(); if (!v) return;
    st.cmd = v; st.log.push(v); echo(v);
    const d = document.createElement('div'); d.className = 'o';
    d.textContent = '(command recorded — press "Submit answer" to validate it against the task)';
    out.appendChild(d); out.scrollTop = out.scrollHeight;
    inp.value = ''; update();
  };
  return {
    ready: () => !!lastCmd(),
    grade: () => {
      const raw = lastCmd();
      st.cmd = raw;
      const res = ex.validate(raw);
      const ok = res.checks.filter(c => c.ok).length;
      return { score: ok / res.checks.length, yourText: esc(raw), correctText: res.sample, detail:'', checks:res.checks, raw:raw };
    },
    reveal: () => {
      st.locked = true; inp.disabled = true; inp.placeholder = 'session closed';
      const res = ex.validate(st.cmd || '');
      checksBox.innerHTML = res.checks.map(c => '<span class="check ' + (c.ok ? 'ok' : 'no') + '">' + (c.ok ? '✓ ' : '✗ ') + esc(c.label) + '</span>').join('');
      const d = document.createElement('div'); d.className = 'o';
      d.innerHTML = '<span class="s">model answer:</span> <span class="p">' + esc(res.sample) + '</span>';
      out.appendChild(d); out.scrollTop = out.scrollHeight;
    }
  };
}

/* ------------------------------- BRANCH ----------------------------------- */
function mountBranch(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = { step:0, picks:[] });
  const root = document.createElement('div'); body.appendChild(root);
  function impactPct(){
    const wrong = st.picks.filter((p, i) => p && !ex.steps[i].opts[p.oi].ok).length;
    return Math.round(wrong / ex.steps.length * 100);
  }
  function render(){
    root.innerHTML = '';
    const meter = document.createElement('div'); meter.className = 'impact';
    meter.innerHTML = '<span>IMPACT LEAKED TO THE ATTACKER</span><div class="track"><div class="fill" style="width:' + impactPct() +
      '%;background:' + (impactPct() > 60 ? 'var(--bad)' : (impactPct() > 25 ? 'linear-gradient(90deg,var(--warn),var(--bad))' : 'linear-gradient(90deg,var(--ok),var(--warn))')) +
      '"></div></div><b style="font-family:var(--mono);color:' + (impactPct() > 50 ? 'var(--bad)' : 'var(--ok)') + '">' + impactPct() + '%</b>';
    root.appendChild(meter);

    ex.steps.forEach((step, i) => {
      const done = st.picks[i];
      const blk = document.createElement('div'); blk.className = 'branchstep';
      const sit = document.createElement('div'); sit.className = 'narr';
      sit.innerHTML = '<b style="color:var(--accent)">DECISION ' + (i + 1) + '</b><br>' + step.situation;
      blk.appendChild(sit);
      if (done){
        const chosen = step.opts[done.oi];
        const fb = document.createElement('div'); fb.className = 'fb ' + (chosen.ok ? 'ok' : 'bad');
        let txt = '<b>You chose:</b> ' + chosen.t + '<br>' + chosen.why;
        if (!chosen.ok){
          const right = step.opts.find(o => o.ok);
          txt += '<br><b style="color:#86efac">Correct move:</b> ' + right.t + ' — ' + right.why;
        }
        fb.innerHTML = txt;
        blk.appendChild(fb);
      } else if (i === st.step && !st.locked){
        const stepOrder = (S.shuf[ex.id].steps && S.shuf[ex.id].steps[i]) || step.opts.map((_, k) => k);
        const list = optionList(step.opts, stepOrder, false, null, (oi) => {
          st.picks[i] = { oi:oi };
          if (st.step === i) st.step = i + 1;
          render(); update();
          const nxt = root.querySelectorAll('.branchstep')[i];
          if (nxt) nxt.scrollIntoView({ behavior:'smooth', block:'center' });
        });
        blk.appendChild(list.wrap);
      } else if (i > st.step){
        const lock = document.createElement('div'); lock.className = 'fb warn';
        lock.innerHTML = '🔒 Locked until you finish decision ' + st.step + '.';
        blk.appendChild(lock);
      } else if (st.locked && !done){
        const miss = document.createElement('div'); miss.className = 'fb warn';
        miss.innerHTML = '<b>Not answered.</b> The correct move was: ' + step.opts.find(o => o.ok).t;
        blk.appendChild(miss);
      }
      root.appendChild(blk);
    });
  }
  render();
  return {
    ready: () => st.step >= ex.steps.length,
    grade: () => {
      const good = st.picks.filter((p, i) => p && ex.steps[i].opts[p.oi].ok).length;
      const yourText = ex.steps.map((s, i) => {
        const p = st.picks[i];
        return '<b>Decision ' + (i + 1) + ':</b> ' + (p ? esc(s.opts[p.oi].t) + (s.opts[p.oi].ok ? '' : ' <span style="color:#fca5a5">(wrong)</span>') : 'not answered');
      }).join('<br>');
      return { score: good / ex.steps.length, yourText:yourText,
               correctText: good + ' of ' + ex.steps.length + ' decisions handled correctly' };
    },
    reveal: () => { st.locked = true; render(); }
  };
}

/* ------------------------------- TRIAGE ----------------------------------- */
function mountTriage(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = { seq:[] });
  const byId = {}; ex.alerts.forEach(a => byId[a.id] = a);
  const order = S.shuf[ex.id].alerts;
  const root = document.createElement('div'); body.appendChild(root);
  function render(){
    root.innerHTML = '';
    const head = document.createElement('div'); head.className = 'tiny';
    head.style.marginBottom = '8px';
    head.textContent = st.locked ? 'Your final order and the correct order are shown below.' :
      'Click a ticket to add it to the end of your work order. ' + st.seq.length + ' of ' + ex.alerts.length + ' placed.';
    root.appendChild(head);
    order.forEach(aid => {
      const a = byId[aid];
      const idx = st.seq.indexOf(aid);
      const c = document.createElement('div');
      c.className = 'alertcard sev-' + a.sev + (idx > -1 ? ' ranked' : '');
      if (st.locked){
        const correctIdx = ex.order.indexOf(aid);
        if (idx === correctIdx) c.style.outline = '1px solid rgba(34,197,94,.6)';
        else c.style.outline = '1px solid rgba(239,68,68,.6)';
      }
      c.innerHTML =
        '<div class="ah"><span>' + esc(a.ticket) + ' &nbsp;·&nbsp; <span class="sevtag">' + esc(a.sev) + '</span></span>' +
        '<span>' + (idx > -1 ? '<span class="rankpill">#' + (idx + 1) + '</span>' : 'click to place') + '</span></div>' +
        '<div class="at">' + esc(a.title) + '</div><div class="ab">' + hl(a.body) + '</div>';
      if (st.locked){
        c.innerHTML += '<div class="tiny" style="margin-top:7px;color:' + (idx === ex.order.indexOf(aid) ? '#86efac' : '#fca5a5') +
          '">your rank ' + (idx > -1 ? idx + 1 : '—') + ' · correct rank ' + (ex.order.indexOf(aid) + 1) + '</div>';
      } else {
        c.onclick = () => { if (idx > -1) return; st.seq.push(aid); render(); update(); };
        clickable(c);
      }
      root.appendChild(c);
    });
    if (!st.locked){
      const row = document.createElement('div'); row.className = 'actions'; row.style.borderTop = 'none'; row.style.paddingTop = '6px';
      const clr = document.createElement('button'); clr.className = 'ghost mini'; clr.textContent = 'Clear my order';
      clr.onclick = () => { st.seq = []; render(); update(); };
      row.appendChild(clr); root.appendChild(row);
    }
  }
  render();
  return {
    ready: () => st.seq.length === ex.alerts.length,
    grade: () => {
      const score = orderScore(st.seq, ex.order);
      return { score: score,
               yourText: st.seq.map((aid, i) => (i + 1) + '. ' + esc(byId[aid].ticket)).join(' &nbsp;·&nbsp; '),
               correctText: ex.order.map((aid, i) => (i + 1) + '. ' + byId[aid].ticket + ' ' + byId[aid].title).join('<br>') };
    },
    reveal: () => { st.locked = true; render(); }
  };
}

/* -------------------------------- DUAL ------------------------------------ */
function mountDual(ex, body, update){
  const st = S.ans[ex.id] || (S.ans[ex.id] = { picks:[null, null] });
  function render(){
    body.innerHTML = '';
    ex.parts.forEach((part, pi) => {
      const blk = document.createElement('div');
      blk.style.margin = '14px 0 18px';
      const h = document.createElement('div');
      h.className = 'qbadge';
      h.style.cssText = 'display:inline-block;margin-bottom:8px;' + (pi === 0 ? '' : 'background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.45);color:#fca5a5');
      h.textContent = part.label;
      const q = document.createElement('div'); q.className = 'prompt'; q.style.marginTop = '4px'; q.innerHTML = part.q;
      blk.appendChild(h); blk.appendChild(q);
      const order = S.shuf[ex.id].parts[pi];
      const cur = st.picks[pi];
      const list = optionList(part.opts, order, false, null, (oi, pos) => {
        if (st.locked) return;
        st.picks[pi] = oi; update();
        list.els.forEach((e2, k) => e2.classList.toggle('sel', k === pos));
      });
      order.forEach((oi, pos) => {
        const chosen = cur === oi;
        if (!st.locked && chosen) list.els[pos].classList.add('sel');
        decorateOption(list.els[pos], part.opts[oi], chosen, st.locked);
      });
      blk.appendChild(list.wrap);
      body.appendChild(blk);
    });
  }
  render();
  const label = p => String.fromCharCode(65 + ex.parts.indexOf(p));
  return {
    ready: () => st.picks.every(p => typeof p === 'number'),
    grade: () => {
      const good = st.picks.filter((p, i) => p !== null && ex.parts[i].opts[p].ok).length;
      const yourText = ex.parts.map((p, i) => p.label + ': ' + (st.picks[i] !== null ? esc(p.opts[st.picks[i]].t) : 'not answered')).join('<br>');
      return { score: good / ex.parts.length, yourText: yourText,
               correctText: ex.parts.map(p => p.label + ': ' + p.opts.find(o => o.ok).t).join('<br>') };
    },
    reveal: () => { st.locked = true; render(); }
  };
}

/* ------------------------------- RESULTS ---------------------------------- */
function finishExam(timeUp){
  S.phase = 'results'; stopTimer(); updateHUD();
  const e = earned();
  const pct = Math.round(e / TOTAL_POINTS * 100);
  const pass = e >= PASS_POINTS;
  const full = EX.filter(x => S.res[x.id] && S.res[x.id].score >= 0.999).length;
  const part = EX.filter(x => S.res[x.id] && S.res[x.id].score > 0 && S.res[x.id].score < 0.999).length;
  const zero = EX.filter(x => S.res[x.id] && S.res[x.id].score === 0).length;
  const skipped = EX.filter(x => !S.res[x.id]).length;
  const circ = 2 * Math.PI * 80;
  const off = circ * (1 - pct / 100);

  let themeRows = '';
  Object.keys(THEMES).forEach(k => {
    const list = EX.filter(x => x.theme === k);
    const got = list.reduce((a, x) => a + pointsFor(x.id), 0);
    const max = list.length * POINTS_EACH;
    const p = Math.round(got / max * 100);
    themeRows += '<div class="themerow"><span class="tn" style="color:' + THEMES[k].color + '">' + THEMES[k].name +
      '</span><div class="tb"><div class="bar ' + (p >= 80 ? 'g' : (p >= 50 ? 'y' : 'r')) + '"><i style="width:' + p + '%;background:' + THEMES[k].color + '"></i></div></div>' +
      '<b class="mono" style="min-width:88px;text-align:right">' + got + '/' + max + '</b></div>';
  });

  let report = '';
  S.order.forEach((id, i) => {
    const ex = getEx(id); const r = S.res[id];
    const sc = r ? Math.round(r.score * 100) : 0;
    const cls = !r ? 'bad' : (r.score >= 0.999 ? 'ok' : (r.score > 0 ? 'part' : 'bad'));
    report += '<div class="reportrow ' + cls + '">' +
      '<div class="rh"><span class="tiny">Q' + (i + 1) + '</span><span>' + ex.title + '</span>' +
      '<span class="badge" style="border-color:' + THEMES[ex.theme].color + '66;color:' + THEMES[ex.theme].color + '">' + THEMES[ex.theme].short + '</span>' +
      '<span class="sc">' + (r ? pointsFor(id) + '/' + POINTS_EACH + ' pts · ' + sc + '%' : 'not answered · 0 pts') + '</span></div>' +
      '<div class="rb"><b>Type:</b> ' + ex.badge + ' &nbsp;·&nbsp; <b>Keywords:</b> ' + ex.keywords.map(esc).join(', ') + '</div>' +
      (r ? '<div class="rb"><b>Your answer:</b><br><span class="yourans">' + (r.yourText || 'not recorded') + '</span></div>' : '') +
      (r ? '<div class="rb"><b>Correct answer:</b><br><span class="correctans">' + r.correctText + '</span></div>' : '') +
      '<div class="rb"><b>Why:</b> ' + ex.explain + '</div>' +
      (r && r.score >= 0.999 ? '' : '<div class="focus"><b>Focus on this:</b> ' + (ex.focus || '') + '</div>') +
      '</div>';
  });

  const used = EXAM_SECONDS - S.timeLeft;
  $('#screen').innerHTML =
    '<div class="panel">' +
      '<div class="scorehero">' +
        '<div class="ring"><svg width="190" height="190">' +
          '<circle cx="95" cy="95" r="80" fill="none" stroke="#1e2b45" stroke-width="14"></circle>' +
          '<circle cx="95" cy="95" r="80" fill="none" stroke="' + (pass ? '#22c55e' : '#ef4444') + '" stroke-width="14" stroke-linecap="round" ' +
          'stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle>' +
        '</svg><div class="val"><div class="pct" style="color:' + (pass ? '#22c55e' : '#ef4444') + '">' + pct + '%</div><div class="sub">score</div></div></div>' +
        '<div class="verdictbig ' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'PASS' : 'FAIL') + '</div>' +
        '<p class="muted" style="margin:4px 0 0">' + e + ' of ' + TOTAL_POINTS + ' points &nbsp;·&nbsp; pass mark ' + PASS_POINTS + ' points (80%)' +
        (timeUp ? ' &nbsp;·&nbsp; <span style="color:var(--bad)">time expired, exam auto-submitted</span>' : '') + '</p>' +
      '</div>' +
      '<div class="facts" style="margin-top:18px">' +
        '<div class="fact"><div class="k">Full marks</div><div class="v" style="color:var(--ok)">' + full + '</div></div>' +
        '<div class="fact"><div class="k">Partial</div><div class="v" style="color:var(--warn)">' + part + '</div></div>' +
        '<div class="fact"><div class="k">Zero</div><div class="v" style="color:var(--bad)">' + zero + '</div></div>' +
        '<div class="fact"><div class="k">Not answered</div><div class="v" style="color:var(--dim2)">' + skipped + '</div></div>' +
        '<div class="fact"><div class="k">Hints used</div><div class="v" style="color:var(--warn)">' + Object.keys(S.hints).length + '</div></div>' +
        '<div class="fact"><div class="k">Time used</div><div class="v">' + mmss(used) + '</div></div>' +
      '</div>' +
      (pass
        ? '<div class="cert"><h3>Certificate of completion</h3><div class="name">ZTA-200 Certified Analyst</div>' +
          '<div class="meta">Zero Trust Network Architecture &amp; Hybrid Cloud Security</div>' +
          '<div class="meta" style="margin-top:8px">Score ' + e + '/' + TOTAL_POINTS + ' (' + pct + '%) · ' + full + ' exercises at full marks · issued ' +
          new Date().toLocaleDateString() + '</div>' +
          '<div class="meta" style="margin-top:8px">Certificate ID ZTA-200-' + Math.random().toString(36).slice(2, 8).toUpperCase() + '</div></div>'
        : '<div class="resbox bad" style="margin-top:16px"><h5>❌ Not this time — you must retake the exam<span class="verdict">' + (PASS_POINTS - e) + ' points short</span></h5>' +
          '<p>You needed ' + PASS_POINTS + ' points and scored ' + e + '. Read the full report below, especially the "Focus on this" boxes, then press <b>Retake exam</b>. ' +
          'On a retake every question, every answer choice and every drag item is shuffled again, so you cannot memorise positions — you have to know the content.</p></div>') +
      '<div style="text-align:center;margin-top:20px">' +
        '<button class="primary big" id="retake">⟳ Retake exam</button> ' +
        '<button class="big" id="backtop">↑ Back to the top</button>' +
      '</div>' +
    '</div>' +
    '<div class="panel" style="margin-top:18px"><h2>Performance by theme</h2>' + themeRows + '</div>' +
    '<div class="panel" style="margin-top:18px"><h2>Full report — every question explained</h2>' +
      '<p class="muted" style="font-size:13.5px">Each row shows your score, the correct answer, why it is correct, and — where you lost marks — exactly what to study next.</p>' +
      report + '</div>';

  $('#retake').onclick = () => { examShuffle(); renderExam(); startTimer(); window.scrollTo(0,0); };
  $('#backtop').onclick = () => window.scrollTo({ top:0, behavior:'smooth' });
  window.scrollTo(0,0);
}

/* --------------------------------- boot ----------------------------------- */
$('#resumebtn').onclick = resumeExam;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.paused) resumeExam(); });
renderIntro();
</script>
