<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Scenario-based certification exam for security analysts: system hardening, Windows/Linux/macOS file systems and artifacts, and patch management. 15 hard interactive exercises, 80% pass mark.">
<title>Endpoint Defense &amp; Patch Management — Certification Exam v2.0</title>
<style>
:root{
  --bg:#070d18; --bg2:#0d1526; --card:#0f1a30; --card2:#131f3a; --line:#1e2c4a;
  --text:#dbe4f3; --dim:#8fa3c0; --accent:#22d3ee; --green:#34d399; --red:#f87171;
  --amber:#fbbf24; --purple:#a78bfa; --gold:#f5d178;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 60%,#0a1224 100%);
  color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh; font-size:15.5px; line-height:1.55;
}
code,pre,.mono{font-family:ui-monospace,Consolas,"Cascadia Mono",Menlo,monospace}
#topbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap; padding:10px 18px; background:rgba(9,15,29,.85);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.brand{font-size:.95rem; color:var(--dim)}
.brand b{color:var(--text); font-size:1.02rem; letter-spacing:.4px}
.brand .sub{display:block; font-size:.72rem; color:#5c7191; margin-top:1px}
.hud{display:flex; gap:8px; align-items:center}
.chip{
  display:inline-block; padding:5px 11px; border:1px solid var(--line); border-radius:999px;
  background:var(--card2); color:var(--dim); font-size:.8rem; white-space:nowrap;
}
.chip b{color:var(--accent)}
#timerChip.warn{color:var(--amber); border-color:var(--amber)}
#timerChip.danger{color:var(--red); border-color:var(--red); animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
#progressbar{height:6px; background:#16233f}
#progressfill{
  height:100%; width:0; border-radius:0 4px 4px 0;
  background:linear-gradient(90deg,var(--accent),var(--green));
  transition:width .5s ease;
}
#themestrip{
  display:flex; flex-wrap:wrap; gap:8px 18px; padding:9px 18px; border-bottom:1px solid var(--line);
  background:rgba(13,21,38,.6);
}
.tmini{display:flex; align-items:center; gap:7px; font-size:.72rem; color:var(--dim); min-width:150px; flex:1}
.tlabel{white-space:nowrap; max-width:150px; overflow:hidden; text-overflow:ellipsis}
.tbar{flex:1; height:6px; background:#16233f; border-radius:4px; overflow:hidden}
.tbar i{display:block; height:100%; width:0; transition:width .5s ease}
.tnum{font-variant-numeric:tabular-nums; min-width:58px; text-align:right}
#screen{max-width:1080px; margin:0 auto; padding:22px 16px 90px}
.card, .excard{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px;
  margin-bottom:16px; box-shadow:0 6px 24px rgba(0,0,0,.35);
}
h1{font-size:1.7rem; margin:.2em 0}
h2{font-size:1.25rem; margin:.3em 0}
h3{font-size:1.02rem; margin:.4em 0; color:#cfe0f5}
h4{font-size:1rem; margin:.6em 0; color:#e6eefc}
.lead{color:var(--dim); font-size:1.02rem}
.sc-label{font-size:.7rem; letter-spacing:2px; color:var(--accent); margin-bottom:6px; text-transform:uppercase}
.scenario-card{
  background:#0c1628; border:1px solid var(--line); border-left:4px solid var(--accent);
  border-radius:10px; padding:13px 16px; margin:10px 0 16px; font-size:.95rem;
}
.scenario-card p{margin:.3em 0}
.codeblock{
  background:#05090f; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  font-size:.83rem; overflow-x:auto; margin:10px 0; color:#c9d7ee; line-height:1.65;
}
.codeblock .cm{color:#5c7191}
.btn{
  cursor:pointer; border:1px solid var(--line); background:var(--card2); color:var(--text);
  padding:9px 16px; border-radius:9px; font-size:.92rem; font-weight:600; transition:all .15s ease;
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn-primary{background:linear-gradient(135deg,#0891b2,#22d3ee); border-color:#22d3ee; color:#04141b}
.btn-ghost{background:transparent; color:var(--dim)}
.btn-ghost:hover{border-color:var(--accent); color:var(--accent)}
.btn-check{margin-top:14px; width:100%}
.hint-btn{font-size:.8rem; padding:5px 12px}
.choices{display:flex; flex-direction:column; gap:9px; margin-top:10px}
.choice{
  display:flex; align-items:flex-start; gap:11px; text-align:left; width:100%;
  background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:11px 14px;
  color:var(--text); font-size:.95rem; cursor:pointer; transition:all .15s ease;
}
.choice:hover{border-color:var(--accent); transform:translateX(3px)}
.choice:disabled{opacity:.8; cursor:default; transform:none}
.choice .badge{
  flex:0 0 24px; height:24px; border-radius:50%; border:1px solid var(--accent); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:.8rem; font-weight:700; margin-top:1px;
}
.choice.correct{border-color:var(--green); background:rgba(52,211,153,.10); box-shadow:0 0 12px rgba(52,211,153,.15)}
.choice.correct .badge{border-color:var(--green); color:var(--green)}
.choice.wrong{border-color:var(--red); background:rgba(248,113,113,.08)}
.choice.wrong .badge{border-color:var(--red); color:var(--red)}
.ctext{flex:1}
.feedback{border-radius:10px; padding:13px 16px; margin-top:16px; border-left:5px solid var(--line)}
.feedback.ok{background:rgba(52,211,153,.08); border-left-color:var(--green)}
.feedback.bad{background:rgba(248,113,113,.08); border-left-color:var(--red)}
.feedback.partial{background:rgba(251,191,36,.08); border-left-color:var(--amber)}
.fb-head{font-weight:700; margin-bottom:6px}
.feedback.ok .fb-head{color:var(--green)}
.feedback.bad .fb-head{color:var(--red)}
.feedback.partial .fb-head{color:var(--amber)}
.minifeedback{border-radius:8px; padding:9px 12px; margin-top:10px; font-size:.9rem}
.minifeedback.ok{background:rgba(52,211,153,.08); border-left:4px solid var(--green)}
.minifeedback.bad{background:rgba(248,113,113,.08); border-left:4px solid var(--red)}
.hintbox{
  background:rgba(251,191,36,.07); border:1px dashed var(--amber); color:#fde7b0;
  border-radius:9px; padding:10px 14px; margin:10px 0; font-size:.9rem;
}
.dpool{
  display:flex; flex-wrap:wrap; gap:8px; padding:14px; margin:12px 0; min-height:70px;
  border:1px dashed #2c3e63; border-radius:12px; background:rgba(19,31,58,.5);
}
.pool-label{width:100%; font-size:.78rem; color:var(--dim); margin-bottom:4px}
.ditem{
  display:inline-block; background:#17233f; border:1px solid #2a3b61; border-radius:999px;
  padding:8px 14px; font-size:.86rem; cursor:grab; user-select:none; -webkit-user-select:none;
  touch-action:none; transition:border-color .15s ease;
}
.ditem:hover{border-color:var(--accent)}
.ditem.dragging{opacity:.45}
.ditem.item-ok{border-color:var(--green); background:rgba(52,211,153,.12)}
.ditem.item-bad{border-color:var(--red); background:rgba(248,113,113,.12)}
.ghost{
  position:fixed; z-index:9999; pointer-events:none; opacity:.9; transform:rotate(2deg) scale(1.02);
  box-shadow:0 10px 30px rgba(0,0,0,.55); border-color:var(--accent) !important;
}
.zones{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:12px 0}
.dzone{
  min-height:110px; padding:11px; border:1.5px dashed #2c3e63; border-radius:12px;
  display:flex; flex-wrap:wrap; gap:7px; align-content:flex-start; transition:all .15s ease;
  background:rgba(13,21,38,.55);
}
.dzone.hover{border-color:var(--accent); background:rgba(34,211,238,.06); box-shadow:0 0 14px rgba(34,211,238,.15)}
.zone-head{width:100%; font-size:.8rem; font-weight:700; letter-spacing:.5px; color:#cfe0f5; text-transform:uppercase}
.zone-note{width:100%; font-size:.72rem; color:var(--dim); margin-bottom:6px}
.dorder{display:flex; flex-direction:column; gap:8px; margin:12px 0}
.rank-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px; border-radius:10px;
  background:#17233f; border:1px solid #2a3b61; padding:11px 14px;
}
.rank-controls{display:flex; flex-direction:column; gap:3px; flex:0 0 auto}
.order-btn{
  background:#0f1a30; border:1px solid #2a3b61; color:var(--dim); border-radius:6px;
  font-size:.68rem; padding:2px 8px; cursor:pointer; line-height:1.2;
}
.order-btn:hover{color:var(--accent); border-color:var(--accent)}
.locked .ditem{pointer-events:none; cursor:default}
.term{
  background:#05090f; border:1px solid var(--line); border-radius:12px; margin:12px 0;
  font-family:ui-monospace,Consolas,Menlo,monospace; overflow:hidden;
}
.term-body{min-height:230px; max-height:330px; overflow-y:auto; padding:12px 14px; font-size:.85rem}
.tline{margin:2px 0; white-space:pre-wrap; word-break:break-word}
.tprompt{color:var(--green)}
.tcmd{color:#d7e7c0}
.tok{color:var(--green)}
.terr{color:var(--red)}
.tinfo{color:var(--dim); font-size:.78rem}
.term-inputrow{display:flex; align-items:center; gap:6px; padding:9px 14px; border-top:1px solid var(--line); background:#081020}
.term-input{
  flex:1; background:transparent; border:none; outline:none; color:#d7e7c0;
  font-family:inherit; font-size:.9rem; caret-color:var(--accent);
}
.logwrap{background:#05090f; border:1px solid var(--line); border-radius:12px; margin:12px 0; overflow:hidden}
.log-toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); background:#081020}
.log-filter{
  flex:1; min-width:170px; background:#0d1526; border:1px solid var(--line); border-radius:8px;
  color:var(--text); padding:7px 11px; font-size:.85rem; outline:none; font-family:inherit;
}
.log-filter:focus{border-color:var(--accent)}
.log-chips{display:flex; gap:6px; flex-wrap:wrap}
.log-chip{
  background:var(--card2); border:1px solid var(--line); color:var(--dim); border-radius:999px;
  font-size:.74rem; padding:4px 10px; cursor:pointer; font-family:ui-monospace,Consolas,monospace;
}
.log-chip:hover{color:var(--accent); border-color:var(--accent)}
.log-lines{padding:10px 12px; max-height:300px; overflow-y:auto; font-family:ui-monospace,Consolas,Menlo,monospace; font-size:.8rem; line-height:1.7}
.logline{border-bottom:1px solid rgba(30,44,74,.4); padding:1px 0; white-space:pre-wrap; word-break:break-word}
.logline:last-child{border-bottom:none}
.lt{color:#5c7191}
.lh{color:var(--accent)}
.ls{color:var(--purple)}
.lm{color:#cbd5e1}
.lm.fail{color:var(--red); font-weight:600}
.lm.ok{color:var(--green)}
.lm.warn{color:var(--amber)}
.qblock{margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
.lockedq{opacity:.42; pointer-events:none}
.branch-step{
  border-left:3px solid var(--accent); background:#0e1830; border-radius:10px;
  padding:12px 16px; margin:14px 0;
}
.branch-label{font-size:.7rem; letter-spacing:2px; color:var(--accent); text-transform:uppercase}
.consequence{
  margin-top:12px; padding:11px 14px; border-radius:9px; font-size:.92rem;
  background:rgba(251,191,36,.07); border-left:4px solid var(--amber); color:#fde7b0;
}
.fill-text{font-size:1rem; line-height:2.3; margin:14px 0}
.blank{
  display:inline-block; min-width:120px; text-align:center; margin:0 4px; padding:0 8px;
  background:transparent; border:none; border-bottom:2px dashed var(--accent); color:#e2e8f0;
  font-size:.95rem; cursor:pointer; line-height:1.6; font-family:inherit;
}
.blank.sel{outline:2px solid var(--accent); border-radius:6px}
.blank:disabled{cursor:default; opacity:.85}
.blank.blank-wrong{color:var(--red); border-bottom-color:var(--red)}
.blank-fix{color:var(--green); font-weight:700}
.bank-note{width:100%; font-size:.76rem; color:var(--dim); margin:10px 0 0}
.bank-note.shake{animation:shake .3s; color:var(--amber)}
.wordbank{
  display:flex; flex-wrap:wrap; gap:8px; padding:14px; margin:6px 0 12px; min-height:60px;
  border:1px dashed #2c3e63; border-radius:12px; background:rgba(19,31,58,.5);
}
.bank-word{
  background:#17233f; border:1px solid #2a3b61; color:var(--text); border-radius:999px;
  padding:7px 13px; font-size:.85rem; cursor:pointer;
}
.bank-word:hover{border-color:var(--accent); color:var(--accent)}
.bank-word.used{opacity:.3; pointer-events:none}
.checks{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.check-row{
  display:flex; align-items:flex-start; gap:10px; background:var(--card2); border:1px solid var(--line);
  border-radius:9px; padding:10px 13px; cursor:pointer; flex-wrap:wrap;
}
.check-row input{margin-top:4px; accent-color:var(--accent)}
.check-row .ctext{font-size:.92rem}
.check-row .mark{flex:0 0 auto; font-weight:800}
.check-row .mark.good{color:var(--green)}
.check-row .mark.bad{color:var(--red)}
.check-row .note{width:100%; font-size:.84rem; color:var(--dim); padding-left:26px}
.check-note{font-size:.8rem; color:var(--amber); margin-top:8px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.vuln-table{width:100%; border-collapse:collapse; margin:12px 0; font-size:.86rem}
.vuln-table th{
  text-align:left; color:var(--dim); font-size:.72rem; letter-spacing:1px; text-transform:uppercase;
  border-bottom:1px solid var(--line); padding:7px 8px;
}
.vuln-table td{border-bottom:1px solid rgba(30,44,74,.5); padding:8px; vertical-align:top}
.vuln-table tr:hover td{background:rgba(34,211,238,.03)}
.sev-critical{color:var(--red); font-weight:700}
.sev-high{color:#fb923c; font-weight:700}
.sev-medium{color:var(--amber)}
.fixtag{font-size:.72rem; border:1px solid var(--line); border-radius:6px; padding:2px 7px; white-space:nowrap}
.fixtag.patch{color:#93c5fd; border-color:#3b5a8f}
.fixtag.fw{color:#f9a8d4; border-color:#8f3b6b}
.fixtag.cfg{color:#86efac; border-color:#3b8f5f}
.result-head{text-align:center; margin:26px 0 10px}
.scorebig{font-size:3.4rem; font-weight:800; letter-spacing:1px}
.scorebig.pass{color:var(--green); text-shadow:0 0 30px rgba(52,211,153,.35)}
.scorebig.fail{color:var(--red); text-shadow:0 0 30px rgba(248,113,113,.35)}
.banner{
  border-radius:12px; padding:14px 18px; text-align:center; font-weight:700; margin-bottom:8px;
}
.banner.timeup{background:rgba(248,113,113,.1); border:1px solid var(--red); color:var(--red)}
.failnote{
  background:rgba(248,113,113,.07); border:1px solid var(--red); border-left:5px solid var(--red);
  border-radius:10px; padding:14px 18px; margin:14px 0;
}
.certwrap{display:flex; justify-content:center; margin:24px 0}
.cert{
  max-width:600px; width:100%; text-align:center; padding:38px 30px; border-radius:18px;
  border:2px solid var(--gold); background:
    radial-gradient(circle at 50% -20%, rgba(245,209,120,.12), transparent 60%), #0d1526;
  box-shadow:0 0 40px rgba(245,209,120,.15);
}
.cert-ribbon{letter-spacing:6px; color:var(--gold); font-size:.85rem; font-weight:700; margin-bottom:10px}
.cert h2{color:#fde9bd; font-size:1.3rem; margin:.4em 0}
.cert-line{color:var(--dim); font-size:.95rem; margin:8px 0}
.cert-name{font-size:1.7rem; font-weight:800; color:var(--text); margin:14px 0; letter-spacing:1px}
.cert-meta{font-size:.75rem; color:#5c7191; margin-top:18px}
.theme-grid{display:flex; flex-direction:column; gap:9px; margin-top:10px}
.restable{width:100%; border-collapse:collapse; font-size:.88rem}
.restable th{text-align:left; color:var(--dim); font-size:.72rem; text-transform:uppercase; letter-spacing:1px; padding:7px 8px; border-bottom:1px solid var(--line)}
.restable td{padding:8px; border-bottom:1px solid rgba(30,44,74,.5)}
.restable .ok{color:var(--green); font-weight:700}
.restable .bad{color:var(--red); font-weight:700}
.restable .part{color:var(--amber); font-weight:700}
.result-btns{display:flex; justify-content:center; gap:12px; margin:20px 0}
.rulegrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:16px 0}
.rulecard{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center}
.rulecard .big{font-size:1.5rem; font-weight:800; color:var(--accent)}
.rulecard .lbl{font-size:.76rem; color:var(--dim); margin-top:4px}
.typegrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px}
.typecard{
  background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:9px 12px;
  font-size:.82rem; color:var(--dim);
}
.typecard b{color:var(--text)}
.kwgroups{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:10px}
.kwgroup{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.kwgroup h3{font-size:.85rem; margin:.2em 0 .7em; letter-spacing:.5px; text-transform:uppercase}
.kw{display:inline-block; margin:3px 4px 3px 0; padding:4px 10px; border-radius:999px; font-size:.76rem;
  background:rgba(34,211,238,.07); border:1px solid rgba(34,211,238,.25); color:#a5e8f5}
.intro-btns{display:flex; gap:12px; align-items:center; margin-top:18px; flex-wrap:wrap}
.name-input{
  background:var(--card2); border:1px solid var(--line); border-radius:9px; color:var(--text);
  padding:9px 13px; font-size:.95rem; outline:none; min-width:240px;
}
.name-input:focus{border-color:var(--accent)}
.overlay{
  position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  background:rgba(5,10,20,.65); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.pausepanel{
  background:var(--card); border:1px solid var(--amber); border-radius:16px; padding:34px 40px;
  text-align:center; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.pausepanel .picon{font-size:2.6rem}
.pausepanel h2{margin:.3em 0}
.pausepanel p{color:var(--dim); font-size:.9rem}
.exhead{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap}
.exnum{display:block; font-size:.72rem; letter-spacing:2px; color:var(--accent); margin-bottom:4px}
.exmeta{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.chip.type{color:#c4b5fd; border-color:#4c3d85}
.chip.pts{color:var(--dim)}
.next-btn{margin-top:16px; width:100%}
.errbox{background:rgba(248,113,113,.1); border:1px solid var(--red); border-radius:10px; padding:14px; color:var(--red)}
@media (max-width:900px){
  .zones{grid-template-columns:1fr}
  .rulegrid{grid-template-columns:repeat(2,1fr)}
  .typegrid{grid-template-columns:repeat(2,1fr)}
  .kwgroups{grid-template-columns:1fr}
  .tmini{min-width:120px}
  h1{font-size:1.4rem}
}
@media (max-width:560px){
  .typegrid{grid-template-columns:1fr}
  .rulegrid{grid-template-columns:1fr 1fr}
  .scorebig{font-size:2.6rem}
}
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">🛡️ <b>ENDPOINT DEFENSE ANALYST</b><span class="sub">Certification Exam v2.0 · System Hardening · File Systems · Patch Management · Pass ≥ 80%</span></div>
  <div class="hud">
    <span id="scoreChip" class="chip">Score: —</span>
    <span id="timerChip" class="chip" style="display:none">⏱ 75:00</span>
    <button id="pauseBtn" class="btn btn-ghost" style="display:none">⏸ Pause</button>
  </div>
</header>
<div id="progressbar"><div id="progressfill"></div></div>
<div id="themestrip"></div>
<main id="screen"></main>

<div id="pauseOverlay" class="overlay" style="display:none">
  <div class="pausepanel">
    <div class="picon">⏸</div>
    <h2>Exam paused</h2>
    <p>The timer is stopped and the current exercise is hidden. Take your break — but you cannot read the questions while paused.</p>
    <p class="mono" style="color:var(--amber)">Remaining time: <span id="pausedTime">75:00</span></p>
    <button id="resumeBtn" class="btn btn-primary" style="margin-top:12px">▶ Resume exam</button>
  </div>
</div>

<script>
"use strict";
/* ================================================================
   ENDPOINT DEFENSE & PATCH MANAGEMENT — CERTIFICATION EXAM v2.0
   Single-file exam engine. All exercises are hard, scenario-based,
   and graded live. Passing threshold: 80%.
   v2.0 changes: global drag system (no listener leaks), per-choice
   branch consequences, realistic GPO path, hint locked after answer,
   candidate name kept on retake, guided word-bank interaction,

/* ---------- tiny helpers ---------- */
function $(sel){ return document.querySelector(sel); }
function el2(tag, cls, html){
  const e = document.createElement(tag);
  if(tag === "button") e.setAttribute("type","button");
  if(cls) e.className = cls;
  if(html != null) e.innerHTML = html;
  return e;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function shuffle(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; } return b; }
function scenario(label, html){
  return '<div class="scenario-card"><div class="sc-label">'+label+'</div>'+html+'</div>';
}

function radioGroup(container, options, onPick){
  const opts = shuffle(options);
  const wrap = el2("div","choices");
  opts.forEach(function(o,i){
    const b = el2("button","choice");
    b.innerHTML = '<span class="badge">'+String.fromCharCode(65+i)+'</span><span class="ctext">'+o.html+'</span>';
    b.addEventListener("click", function(){
      if(wrap.classList.contains("locked")) return;
      wrap.classList.add("locked");
      wrap.querySelectorAll(".choice").forEach(function(x){ x.disabled = true; });
      if(o.correct){ b.classList.add("correct"); }
      else {
        b.classList.add("wrong");
        opts.forEach(function(oo,ix){ if(oo.correct) wrap.children[ix].classList.add("correct"); });
      }
      onPick(o.correct, o.why || "", o);
    });
    wrap.appendChild(b);
  });
  container.appendChild(wrap);
  return wrap;
}

function multiCheck(container, items, opts){
  const wrap = el2("div","checks");
  items.forEach(function(it,i){
    const row = el2("label","check-row");
    row.innerHTML = '<input type="checkbox" data-i="'+i+'"><span class="ctext">'+it.html+'</span>';
    wrap.appendChild(row);
  });
  const note = el2("div","check-note");
  note.textContent = opts.note || ("Select exactly "+(opts.min||0)+" item(s).");
  wrap.appendChild(note);
  const btn = el2("button","btn btn-primary btn-check");
  btn.textContent = opts.buttonLabel || "Confirm selection";
  wrap.appendChild(btn);
  btn.addEventListener("click", function(){
    if(wrap.classList.contains("locked")) return;
    const sel = [];
    wrap.querySelectorAll("input:checked").forEach(function(x){ sel.push(+x.dataset.i); });
    if(opts.min && sel.length !== opts.min){
      note.classList.remove("shake"); void note.offsetWidth; note.classList.add("shake");
      return;
    }
    wrap.classList.add("locked");
    let good = 0;
    items.forEach(function(it,i){
      const chk = wrap.querySelector('input[data-i="'+i+'"]');
      const picked = sel.indexOf(i) !== -1;
      const ok = (picked && it.isMistake) || (!picked && !it.isMistake);
      if(ok) good++;
      const mark = el2("span","mark "+(ok?"good":"bad"));
      mark.textContent = ok ? "✓" : "✗";
      chk.closest(".check-row").appendChild(mark);
      chk.disabled = true;
      if(it.note){
        const n = el2("div","note"); n.textContent = it.note;
        chk.closest(".check-row").appendChild(n);
      }
    });
    btn.disabled = true;
    note.style.display = "none";
    opts.onDone(100 * good / items.length);
  });
  container.appendChild(wrap);
}

/* Single global drag & drop controller (mouse + touch).
   Registered ONCE at boot — no per-exercise listeners, no leaks. */
const dragState = { ghost:null, dragEl:null, sx:0, sy:0 };

function initGlobalDrag(){
  document.addEventListener("pointerdown", function(e){
    if(e.target.closest("button")) return;
    const it = e.target.closest(".ditem");
    if(!it || it.closest(".locked")) return;
    e.preventDefault();
    dragState.dragEl = it;
    const r = it.getBoundingClientRect();
    const ghost = it.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.width = r.width + "px";
    ghost.style.left = r.left + "px";
    ghost.style.top = r.top + "px";
    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    dragState.sx = e.clientX - r.left;
    dragState.sy = e.clientY - r.top;
    try{ it.setPointerCapture(e.pointerId); }catch(err){}
    it.classList.add("dragging");
  });

  document.addEventListener("pointermove", function(e){
    const g = dragState.ghost;
    if(!g) return;
    e.preventDefault();
    g.style.left = (e.clientX - dragState.sx) + "px";
    g.style.top = (e.clientY - dragState.sy) + "px";
    const under = document.elementFromPoint(e.clientX, e.clientY);
    document.querySelectorAll(".dzone,.dpool").forEach(function(z){ z.classList.remove("hover"); });
    if(under){
      const z = under.closest(".dzone") || under.closest(".dpool");
      if(z) z.classList.add("hover");
      const it = dragState.dragEl;
      const list = it.closest(".dorder");
      if(list){
        const items = Array.prototype.filter.call(list.querySelectorAll(".ditem"), function(x){ return x !== it; });
        for(let k=0;k<items.length;k++){
          const rr = items[k].getBoundingClientRect();
          if(e.clientY < rr.top + rr.height/2){ list.insertBefore(it, items[k]); return; }
        }
        list.appendChild(it);
      }
    }
  });

  function endDrag(e){
    const g = dragState.ghost;
    if(!g) return;
    const it = dragState.dragEl;
    if(it && e && typeof e.clientX === "number"){
      const under = document.elementFromPoint(e.clientX, e.clientY);
      document.querySelectorAll(".dzone,.dpool").forEach(function(z){ z.classList.remove("hover"); });
      if(under){
        const z = under.closest(".dzone") || under.closest(".dpool");
        if(z) z.appendChild(it);
      }
    }
    if(it) it.classList.remove("dragging");
    g.remove();
    dragState.ghost = null;
    dragState.dragEl = null;
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
}

function buildMatch(container, items, zones, onSubmit){
  const pool = el2("div","dpool");
  pool.innerHTML = '<div class="pool-label">⬇ Drag each item onto the correct zone (you can drag items back too)</div>';
  shuffle(items).forEach(function(it){
    const d = el2("div","ditem");
    d.dataset.id = it.id; d.dataset.answer = it.answer;
    d.textContent = it.html;
    pool.appendChild(d);
  });
  container.appendChild(pool);
  const zrow = el2("div","zones");
  zones.forEach(function(z){
    const zz = el2("div","dzone");
    zz.dataset.zone = z.id;
    zz.innerHTML = '<div class="zone-head">'+z.label+'</div><div class="zone-note">'+z.note+'</div>';
    zrow.appendChild(zz);
  });
  container.appendChild(zrow);
  const btn = el2("button","btn btn-primary btn-check");
  btn.textContent = "Check placement";
  container.appendChild(btn);
  btn.addEventListener("click", function(){
    if(zrow.classList.contains("locked")) return;
    let good = 0, n = 0;
    items.forEach(function(it){
      const el = pool.querySelector('.ditem[data-id="'+it.id+'"]') || zrow.querySelector('.ditem[data-id="'+it.id+'"]');
      const zone = el ? el.closest(".dzone") : null;
      const zid = zone ? zone.dataset.zone : null;
      n++;
      if(zid === it.answer){ good++; if(el) el.classList.add("item-ok"); }
      else if(el){ el.classList.add("item-bad"); }
    });
    zrow.classList.add("locked"); pool.classList.add("locked");
    onSubmit(100 * good / n);
  });
}

function buildRanking(container, items, onSubmit){
  const list = el2("div","dorder");
  shuffle(items).forEach(function(it){
    const d = el2("div","ditem rank-item");
    d.dataset.id = it.id;
    d.innerHTML = '<div class="rank-content" style="flex:1">'+it.html+'</div>'+
      '<div class="rank-controls"><button class="order-btn up" title="Move up">▲</button><button class="order-btn down" title="Move down">▼</button></div>';
    list.appendChild(d);
  });
  list.querySelectorAll(".ditem").forEach(function(d){
    d.querySelector(".up").addEventListener("click", function(){
      const p = d.previousElementSibling; if(p) list.insertBefore(d, p);
    });
    d.querySelector(".down").addEventListener("click", function(){
      const n = d.nextElementSibling; if(n) list.insertBefore(n, d);
    });
  });
  container.appendChild(list);
  const btn = el2("button","btn btn-primary btn-check");
  btn.textContent = "Submit order";
  container.appendChild(btn);
  btn.addEventListener("click", function(){
    if(list.classList.contains("locked")) return;
    const orderIds = Array.prototype.map.call(list.querySelectorAll(".ditem"), function(d){ return d.dataset.id; });
    const pos = {};
    orderIds.forEach(function(id,i){ pos[id] = i; });
    let pairs = 0, ok = 0;
    for(let a=0;a<items.length;a++){
      for(let b=a+1;b<items.length;b++){
        pairs++;
        if(pos[items[a].id] < pos[items[b].id]) ok++;
      }
    }
    list.classList.add("locked");
    onSubmit(100 * ok / pairs);
  });
}

function buildTerminal(container, config){
  const wrap = el2("div","term");
  const body = el2("div","term-body");
  wrap.appendChild(body);
  const inputRow = el2("div","term-inputrow");
  inputRow.innerHTML = '<span class="tprompt">'+esc(config.prompt)+'</span>';
  const inp = el2("input","term-input");
  inp.setAttribute("spellcheck","false");
  inp.setAttribute("autocomplete","off");
  inputRow.appendChild(inp);
  wrap.appendChild(inputRow);
  wrap.addEventListener("click", function(){ inp.focus(); });
  let ti = 0, earned = 0;
  function print(html, cls){
    const d = el2("div","tline "+(cls||"")); d.innerHTML = html;
    body.appendChild(d); body.scrollTop = body.scrollHeight;
  }
  config.tasks.forEach(function(t,i){
    print('<span class="tinfo">Task '+(i+1)+'/'+config.tasks.length+' — '+esc(t.name)+'</span>');
  });
  function run(){
    const cmd = inp.value.trim();
    inp.value = "";
    if(!cmd) return;
    print('<span class="tprompt">'+esc(config.prompt)+'</span><span class="tcmd">'+esc(cmd)+'</span>');
    const t = config.tasks[ti];
    if(t.accept(cmd)){
      earned += 100 / config.tasks.length;
      print('<span class="tok">'+t.ok+'</span>');
      ti++;
      if(ti < config.tasks.length){
        print('<span class="tinfo">Task '+(ti+1)+'/'+config.tasks.length+' — '+esc(config.tasks[ti].name)+'</span>');
      } else {
        print('<span class="tinfo">All tasks complete.</span>');
        inp.disabled = true;
        config.onDone(earned);
      }
    } else {
      print('<span class="terr">'+t.fail(cmd)+'</span>');
    }
  }
  inp.addEventListener("keydown", function(e){ if(e.key === "Enter") run(); });
  container.appendChild(wrap);
  setTimeout(function(){ inp.focus(); }, 60);
}

function buildLogViewer(container, lines, q1, q2, onDone){
  const wrap = el2("div","logwrap");
  const toolbar = el2("div","log-toolbar");
  const fi = el2("input","log-filter");
  fi.placeholder = "Filter the log… (try: failed, accepted, sudo)";
  toolbar.appendChild(fi);
  const chipWrap = el2("div","log-chips");
  ["failed","accepted","sudo","198[.]51[.]100[.]77"].forEach(function(c){
    const b = el2("button","log-chip"); b.textContent = c;
    b.addEventListener("click", function(){ fi.value = c; applyFilter(); });
    chipWrap.appendChild(b);
  });
  const clearBtn = el2("button","log-chip"); clearBtn.textContent = "clear";
  clearBtn.addEventListener("click", function(){ fi.value = ""; applyFilter(); });
  chipWrap.appendChild(clearBtn);
  toolbar.appendChild(chipWrap);
  wrap.appendChild(toolbar);
  const list = el2("div","log-lines");
  lines.forEach(function(L){
    const d = el2("div","logline");
    d.innerHTML = '<span class="lt">'+esc(L.t)+'</span> <span class="lh">'+esc(L.h)+'</span> <span class="ls">'+esc(L.s)+'</span> <span class="lm '+L.cls+'">'+esc(L.m)+'</span>';
    d.dataset.text = (L.t+" "+L.h+" "+L.s+" "+L.m).toLowerCase();
    list.appendChild(d);
  });
  wrap.appendChild(list);
  function applyFilter(){
    const q = fi.value.trim().toLowerCase();
    list.querySelectorAll(".logline").forEach(function(d){
      d.style.display = (!q || d.dataset.text.indexOf(q) !== -1) ? "" : "none";
    });
  }
  fi.addEventListener("input", applyFilter);
  container.appendChild(wrap);

  let e1 = 0, e2 = 0;
  const q1w = el2("div","qblock");
  q1w.innerHTML = '<h4>Question 1 of 2</h4><p>'+q1.prompt+'</p>';
  container.appendChild(q1w);
  const q2w = el2("div","qblock lockedq");
  q2w.innerHTML = '<h4>Question 2 of 2</h4><p>'+q2.prompt+'</p>';
  container.appendChild(q2w);
  radioGroup(q1w, q1.options, function(ok, why){
    e1 = ok ? 50 : 0;
    const f = el2("div","minifeedback "+(ok?"ok":"bad")); f.innerHTML = why;
    q1w.appendChild(f);
    q2w.classList.remove("lockedq");
  });
  radioGroup(q2w, q2.options, function(ok, why){
    e2 = ok ? 50 : 0;
    const f = el2("div","minifeedback "+(ok?"ok":"bad")); f.innerHTML = why;
    q2w.appendChild(f);
    onDone(e1 + e2);
  });
}

function buildBranch(container, scenarioHtml, steps, onDone){
  container.innerHTML += scenarioHtml;
  let earned = 0;
  function renderStep(i){
    const s = steps[i];
    const box = el2("div","branch-step");
    box.innerHTML = '<div class="branch-label">Decision '+(i+1)+' of '+steps.length+'</div><h4>'+s.prompt+'</h4>';
    container.appendChild(box);
    radioGroup(box, s.options, function(ok, why, o){
      if(ok) earned += 100 / steps.length;
      const f = el2("div","minifeedback "+(ok?"ok":"bad")); f.innerHTML = why;
      box.appendChild(f);
      if(o && o.cons){
        const cons = el2("div","consequence"); cons.innerHTML = o.cons;
        box.appendChild(cons);
      }
      if(i+1 < steps.length) renderStep(i+1); else onDone(earned);
    });
  }
  renderStep(0);
}

function buildFill(container, parts, bank, onDone){
  const wordset = shuffle(bank);
  const txt = el2("div","fill-text");
  const blanks = [];
  parts.forEach(function(p){
    if(p.pre) txt.appendChild(document.createTextNode(p.pre));
    if(p.ans){
      const b = el2("button","blank");
      b.dataset.ans = p.ans;
      b.dataset.i = blanks.length;
      b.textContent = "␣␣␣␣␣";
      b.title = "Click to select · double-click to clear";
      txt.appendChild(b);
      blanks.push(b);
    }
    if(p.after) txt.appendChild(document.createTextNode(p.after));
  });
  container.appendChild(txt);
  const bankNote = el2("div","bank-note");
  bankNote.textContent = "Step 1: click a blank space · Step 2: click a word from the bank (double-click a filled blank to clear it)";
  container.appendChild(bankNote);
  const bankBox = el2("div","wordbank");
  const usedWords = new Map();
  let selectedBlank = null;
  function place(blank, wordBtn){
    const prev = usedWords.get(+blank.dataset.i);
    if(prev){ prev.classList.remove("used"); usedWords.delete(+blank.dataset.i); }
    blank.textContent = wordBtn.textContent;
    wordBtn.classList.add("used");
    usedWords.set(+blank.dataset.i, wordBtn);
    blank.classList.remove("sel");
    selectedBlank = null;
  }
  wordset.forEach(function(w){
    const b = el2("button","bank-word");
    b.textContent = w;
    b.addEventListener("click", function(){
      if(b.classList.contains("used")) return;
      if(selectedBlank){ place(selectedBlank, b); }
      else {
        bankNote.classList.remove("shake"); void bankNote.offsetWidth; bankNote.classList.add("shake");
      }
    });
    bankBox.appendChild(b);
  });
  blanks.forEach(function(b){
    b.addEventListener("click", function(){
      if(b.classList.contains("sel")){ b.classList.remove("sel"); selectedBlank = null; }
      else {
        blanks.forEach(function(x){ x.classList.remove("sel"); });
        b.classList.add("sel"); selectedBlank = b;
      }
    });
    b.addEventListener("dblclick", function(){
      const prev = usedWords.get(+b.dataset.i);
      if(prev){ prev.classList.remove("used"); usedWords.delete(+b.dataset.i); b.textContent = "␣␣␣␣␣"; }
    });
  });
  container.appendChild(bankBox);
  const btn = el2("button","btn btn-primary btn-check");
  btn.textContent = "Check answers";
  container.appendChild(btn);
  btn.addEventListener("click", function(){
    if(bankBox.classList.contains("locked")) return;
    let good = 0;
    blanks.forEach(function(b){
      const ok = b.textContent === b.dataset.ans;
      if(ok){ good++; }
      else {
        b.classList.add("blank-wrong");
        const w = el2("span","blank-fix");
        w.textContent = " → " + b.dataset.ans;
        b.insertAdjacentElement("afterend", w);
      }
      b.disabled = true;
    });
    btn.disabled = true;
    bankBox.classList.add("locked");
    onDone(100 * good / blanks.length);
  });
}

/* ---------------- 4 · Terminal lab ---------------- */
{
  id:"e04", theme:"fs", typeLabel:"Terminal Lab", points:100,
  title:"Terminal Lab: Fix the Linux Server",
  hint:"systemd manages services (disable --now). Permission numbers: 4=read, 2=write, 1=execute — three digits for owner, group, others.",
  build:function(host, api){
    host.innerHTML = scenario("CHANGE TICKET CHG-0881 · RED HAT 9",
      "<p>You are logged in as <code>analyst</code> on <code>web01</code>. An audit found two problems: an old Telnet daemon is still running, and <code>/etc/shadow</code> is world-readable (mode 0644). Type the real commands to fix both. Press Enter to run.</p>");
    buildTerminal(host, {
      prompt:"analyst@web01:~$",
      tasks:[
        {name:"Stop the Telnet service now AND make sure it never starts again (one command).",
         accept:function(cmd){
           const c = cmd.toLowerCase();
           return c.indexOf("systemctl")!==-1 && c.indexOf("telnet")!==-1 && c.indexOf("disable")!==-1 && (c.indexOf("--now")!==-1 || c.indexOf("stop")!==-1);
         },
         ok:"Stopped and disabled: telnet.service ✔",
         fail:function(cmd){
           const c = cmd.toLowerCase();
           if(c.indexOf("systemctl")!==-1 && c.indexOf("telnet")!==-1)
             return "✗ telnet.service is still running or still enabled. Stop it AND disable it in one command (hint: --now).";
           return "bash: command not found: "+esc(cmd.slice(0,60));
         }},
        {name:"Fix /etc/shadow — remove read access for group and others.",
         accept:function(cmd){
           const c = cmd.trim().toLowerCase().replace(/^\s*sudo\s+/,"");
           return /^chmod\s+(600|000|go-rwx|go-rw|go=|u=rw,go=|g-rwx,o-rwx|o-rwx|og-rwx)\s+\/etc\/shadow$/.test(c);
         },
         ok:"Permissions of '/etc/shadow' changed to 600 (rw-------) ✔",
         fail:function(cmd){
           const c = cmd.toLowerCase();
           if(c.indexOf("chmod")!==-1 && c.indexOf("/etc/shadow")!==-1)
             return "chmod: invalid mode — group and others can still read the file. Only root may read and write it: mode 600.";
           return "bash: command not found: "+esc(cmd.slice(0,60));
         }}
      ],
      onDone:function(earned){
        api.complete(earned, "<p>Stopping and disabling unneeded services is classic <b>attack surface reduction</b> — <code>systemctl disable --now telnet</code> does both in one move. A world-readable <code>/etc/shadow</code> lets any local user read password hashes, so <code>chmod 600</code> closes a privilege-escalation door. Knowing the Linux <b>directory structure</b> and <b>permissions</b> is how you find and fix these in minutes.</p>");
      }
    });
  }
},

{
  id:"e14", theme:"fs", typeLabel:"Multiple Choice", points:100,
  title:"What Does umask 022 Really Do?",
  hint:"umask REMOVES bits. 022 removes something from group and others.",
  build:function(host, api){
    host.innerHTML = scenario("LINUX BASELINE AUDIT",
      "<p>On a new Linux server you set <code>umask 022</code> in the default shell profile. A user then creates a file and a folder. What does this setting actually do?</p>");
    radioGroup(host, [
      {html:"It removes write permission for group and others: new files get 644, new folders get 755.", correct:true,
       why:"<b>Correct.</b> umask is a mask of permission bits REMOVED from the default. 022 removes write (2) from group and others, so files land at 644 (rw-r--r--) and directories at 755 (rwxr-xr-x). Permissions are the first access control on a Linux system."},
      {html:"It gives every user full read, write, and execute on new files.", correct:false,
       why:"That would be umask 000 — the opposite of 022. 022 makes new files MORE restrictive for group and others, not more open."},
      {html:"It changes the permissions of files that already exist.", correct:false,
       why:"umask only affects NEW files and folders. Existing files keep their permissions — to change those you use chmod."},
      {html:"It applies only to files created by the root user.", correct:false,
       why:"The umask applies to every user whose shell profile sets it — normal users included. It is a default for new files, not a root-only rule."}
    ], function(ok, why){
      api.complete(ok ? 100 : 0, "<p>"+why+"</p><p><b>Keyword:</b> Linux file system permissions — umask and chmod are the two tools that decide who can read or change data on an endpoint.</p>");

      '<span class="tnum" id="tnum-'+k+'">0%</span>';

function paintTimer(){
  const tc = $("#timerChip");
  if(!APP.started){ tc.style.display = "none"; return; }
  tc.style.display = "";
  const m = Math.floor(APP.timeLeft/60), s = APP.timeLeft%60;
  tc.textContent = (APP.paused ? "⏸ " : "⏱ ") + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  tc.classList.toggle("warn", APP.paused || APP.timeLeft < 600);
  tc.classList.toggle("danger", !APP.paused && APP.timeLeft < 120);
}

function updateHUD(){
  const sc = $("#scoreChip");
  if(APP.possible > 0){
    const pct = 100 * APP.score / APP.possible;
    sc.innerHTML = "Score: <b>"+Math.round(APP.score)+"</b> / "+Math.round(APP.possible)+" · "+Math.round(pct)+"%";
  } else {
    sc.innerHTML = "Score: —";
  }
  const done = APP.idx + (APP.exState && APP.exState.done ? 1 : 0);
  $("#progressfill").style.width = (APP.order.length ? 100*done/APP.order.length : 0) + "%";
  Object.keys(THEMES).forEach(function(k){
    const s = APP.themeStats[k] || {e:0, p:0};
    const bar = $("#tbar-"+k), num = $("#tnum-"+k);
    if(bar) bar.style.width = (s.p ? 100*s.e/s.p : 0) + "%";
    if(num) num.textContent = s.p ? Math.round(100*s.e/s.p)+"%" : "0%";
  });
  $("#pauseBtn").style.display = (APP.started && !APP.finished) ? "" : "none";
  paintTimer();
}

function startTimer(){
  if(APP.timerId) clearInterval(APP.timerId);
  APP.timerId = setInterval(function(){
    APP.timeLeft--;
    paintTimer();
    if(APP.timeLeft <= 0){
      clearInterval(APP.timerId);
      APP.timerId = null;
      finishExam("time");
    }
  }, 1000);
}

function togglePause(){
  if(!APP.started || APP.finished) return;
  APP.paused = !APP.paused;
  if(APP.paused){
    clearInterval(APP.timerId);
    APP.timerId = null;
    const m = Math.floor(APP.timeLeft/60), s = APP.timeLeft%60;
    $("#pausedTime").textContent = String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    $("#pauseOverlay").style.display = "flex";
  } else {
    $("#pauseOverlay").style.display = "none";
    startTimer();
  }
  $("#pauseBtn").textContent = APP.paused ? "▶ Resume" : "⏸ Pause";
  updateHUD();
}

/* ---------- exam flow ---------- */

function startExam(){
  APP.order = shuffle(Array.from({length: EXERCISES.length}, function(_, i){ return i; }));
  APP.idx = 0; APP.score = 0; APP.possible = 0; APP.results = [];
  APP.themeStats = {}; APP.timeLeft = EXAM_SEC; APP.exState = null;
  APP.started = true; APP.finished = false; APP.paused = false;
  $("#pauseBtn").textContent = "⏸ Pause";
  renderExercise();
  startTimer();
}

function renderExercise(){
  const ex = EXERCISES[APP.order[APP.idx]];
  APP.exState = { hintUsed:false, done:false };
  const scr = $("#screen");
  scr.innerHTML = "";
  const card = el2("div","excard");

  const head = el2("div","exhead");
  head.innerHTML =
    '<div class="extitle"><span class="exnum">EXERCISE '+(APP.idx+1)+' / '+APP.order.length+'</span><h2>'+ex.title+'</h2></div>'+
    '<div class="exmeta">'+
      '<span class="chip type">'+ex.typeLabel+'</span>'+
      '<span class="chip theme" style="border-color:'+THEMES[ex.theme].color+';color:'+THEMES[ex.theme].color+'">'+THEMES[ex.theme].label+'</span>'+
      '<span class="chip pts">'+ex.points+' pts</span>'+
    '</div>';
  card.appendChild(head);

  const hintBtn = el2("button","btn btn-ghost hint-btn");
  hintBtn.innerHTML = "💡 Hint (−10%)";
  hintBtn.addEventListener("click", function(){
    if(APP.exState.hintUsed || APP.exState.done) return;
    APP.exState.hintUsed = true;
    hintBtn.disabled = true;
    hintBtn.textContent = "💡 Hint used (−10%)";
    hintBox.style.display = "block";
    hintBox.innerHTML = "<strong>Hint:</strong> " + ex.hint;
    const pts = card.querySelector(".pts");
    if(pts) pts.textContent = "max " + (ex.points * 0.9) + " pts";
  });
  head.appendChild(hintBtn);

  const hintBox = el2("div","hintbox");
  hintBox.style.display = "none";
  card.appendChild(hintBox);

  const body = el2("div","exbody");
  card.appendChild(body);

  const fb = el2("div","feedback");
  fb.style.display = "none";
  card.appendChild(fb);

  const next = el2("button","btn btn-primary next-btn");
  next.textContent = (APP.idx + 1 >= APP.order.length) ? "Finish exam →" : "Next exercise →";
  next.disabled = true;
  next.addEventListener("click", nextExercise);
  card.appendChild(next);

  scr.appendChild(card);

  const api = {
    complete:function(earned, fbHTML){
      if(APP.exState.done) return;
      APP.exState.done = true;
      hintBtn.disabled = true;
      const max = ex.points * (APP.exState.hintUsed ? 0.9 : 1);
      const e = Math.min(Math.max(0, earned), max);
      APP.score += e;
      APP.possible += max;
      if(!APP.themeStats[ex.theme]) APP.themeStats[ex.theme] = {e:0, p:0};
      APP.themeStats[ex.theme].e += e;
      APP.themeStats[ex.theme].p += max;
      APP.results.push({ title:ex.title, theme:ex.theme, earned:e, max:max });
      fb.style.display = "block";
      const cls = (e >= max - 0.001) ? "ok" : (e <= 0.001 ? "bad" : "partial");
      fb.className = "feedback " + cls;
      fb.innerHTML =
        '<div class="fb-head">'+(cls==="ok" ? "✔ Correct" : (cls==="bad" ? "✘ Incorrect" : "◐ Partial credit"))+
        ' — +'+Math.round(e)+' / '+Math.round(max)+' pts</div>'+
        '<div class="fb-body">'+(fbHTML || "")+'</div>';
      next.disabled = false;
      updateHUD();
      next.scrollIntoView({behavior:"smooth", block:"nearest"});
    }
  };
  try {
    ex.build(body, api);
  } catch(err){
    body.innerHTML = '<div class="errbox">Exercise error: '+esc(String((err && err.message) || err))+'</div>';
    api.complete(0, "");
  }
  updateHUD();
}

function nextExercise(){
  APP.idx++;
  if(APP.idx >= APP.order.length){
    finishExam("done");
  } else {
    renderExercise();
    window.scrollTo({top:0, behavior:"smooth"});
  }
}

  tbl.innerHTML = "<thead><tr><th>#</th><th>Exercise</th><th>Theme</th><th>Result</th><th>Points</th></tr></thead>";
  const tbody = el2("tbody");
  APP.results.forEach(function(r, i){
    const st = (r.earned >= r.max - 0.001) ? "✔" : (r.earned <= 0.001 ? "✘" : "◐");
    const cls = (r.earned >= r.max - 0.001) ? "ok" : (r.earned <= 0.001 ? "bad" : "part");
    const tr = el2("tr");
    tr.innerHTML = '<td>'+(i+1)+'</td><td>'+esc(r.title)+'</td><td>'+THEMES[r.theme].label+'</td><td class="'+cls+'">'+st+'</td><td>'+Math.round(r.earned)+' / '+Math.round(r.max)+'</td>';
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);
  rt.appendChild(tbl);
  wrap.appendChild(rt);

  const rb = el2("div","result-btns");
  const b1 = el2("button","btn btn-primary");
  b1.textContent = "↻ Retake exam (reshuffled)";
  b1.addEventListener("click", retake);
  rb.appendChild(b1);
  wrap.appendChild(rb);

  scr.appendChild(wrap);
  updateHUD();
}

function retake(){
  APP.score = 0; APP.possible = 0; APP.idx = 0; APP.results = [];
  APP.themeStats = {}; APP.order = []; APP.exState = null;
  APP.timeLeft = EXAM_SEC; APP.paused = false; APP.finished = false; APP.started = false;
  if(APP.timerId){ clearInterval(APP.timerId); APP.timerId = null; }
  $("#pauseOverlay").style.display = "none";
  buildIntro();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- wiring & boot ---------- */

$("#pauseBtn").addEventListener("click", togglePause);
$("#resumeBtn").addEventListener("click", togglePause);

initGlobalDrag();
buildThemeStrip();
buildIntro();
</script>
</body>
</html>
