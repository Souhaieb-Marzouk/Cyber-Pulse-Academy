# Cyber Pulse Academy - the validation gate.
#
# The build tooling is NOT in this repository. It lives in a private repository and is checked
# out into .tooling/ below, which works because every script resolves the project root as the
# parent of its own directory (ROOT = SCRIPT_DIR.parent), so .tooling/validate.py validates
# this repository.
#
# That arrangement exists on purpose: somebody who downloads this project gets the site, not
# the machinery that generates it. The consequence is that the tooling steps need the secret
# TOOLING_TOKEN, a fine-grained token with read-only access to the tooling repository. Without
# it - which includes every pull request from a fork, since forks cannot read secrets - the two
# checks that need no tooling still run and the rest are skipped with a notice, not a red cross.
#
# One rule that matters here: the `secrets` context cannot be used in an `if:` conditional.
# GitHub rejects the whole workflow at validation time with "Unrecognized named-value: 'secrets'".
# So the first step below turns the secret into an output, and every later step tests that
# output instead. The token itself is only ever read in an `env:` or `with:` block, which is
# where it is allowed.
#
# The tooling is Python standard library only, so nothing below installs a package.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing in this workflow writes to the repository, and saying so
# explicitly means a compromised step cannot push.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled: an older push's result is worthless once a
# newer one exists.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema, size, links and generated output
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Is the tooling token configured? One step answers it, and every step that needs the
      # tooling tests steps.tooling.outputs.available. A fork pull request cannot read secrets,
      # so this reports "false" there and the tooling steps are skipped rather than failed.
      - name: Check whether the build tooling token is configured
        id: tooling
        env:
          TOOLING_TOKEN: ${{ secrets.TOOLING_TOKEN }}
        run: |
          if [ -n "$TOOLING_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "The build tooling token is configured; the tooling steps will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build tooling not available::The secret TOOLING_TOKEN is not set, so the private build tooling could not be fetched. The HTML size budget and the four-tier check below still run; the schema, link and generated-output checks did not. This is expected for pull requests from forks, which cannot read secrets."
          fi

      # The private build tooling, fetched at run time. It never enters the repository: the
      # checkout writes into .tooling/, which is ignored.
      - name: Check out the private build tooling
        if: steps.tooling.outputs.available == 'true'
        uses: actions/checkout@v5
        with:
          repository: Souhaieb-Marzouk/cyber-pulse-academy-tooling
          token: ${{ secrets.TOOLING_TOKEN }}
          path: .tooling

      - name: Run the validation gate
        if: steps.tooling.outputs.available == 'true'
        run: python .tooling/validate.py

      - name: Prove data/catalog.json is not stale
        if: steps.tooling.outputs.available == 'true'
        run: python .tooling/build_catalog.py --check

      - name: Regenerate pages and fail on uncommitted drift
        if: steps.tooling.outputs.available == 'true'
        run: |
          python .tooling/generate_pages.py
          if ! git diff --quiet -- topics/ pages/ index.html 404.html; then
            echo "::error title=Generated files are stale::Generated output differs from what is committed. Run the build tooling locally, then commit the result:"
            echo "    python .tooling/build_catalog.py"
            echo "    python .tooling/generate_pages.py"
            echo "    python .tooling/generate_og.py"
            echo
            echo "Files that changed when the generator was re-run:"
            git --no-pager diff --stat -- topics/ pages/ index.html 404.html
            echo
            echo "The ?v= cache-bust stamps and the data-cm-count spans are both written"
            echo "by the generator, so a siteVersion bump in assets/js/config.js changes"
            echo "many files at once. Commit all of them, not just the topic pages."
            exit 1
          fi
          echo "Generated topic pages, count stamps and ?v= stamps are all current."

      - name: Summarise the external URL allow-list decision
        if: steps.tooling.outputs.available == 'true'
        run: |
          python .tooling/validate.py --verbose 2>&1 | tee /tmp/cm-validate-verbose.txt
          echo
          echo "External URL policy from the validation gate:"
          grep -E "external|allow-list" /tmp/cm-validate-verbose.txt || true
          echo
          echo "A host that is not in ALLOWED_HOSTS or NAMESPACE_HOSTS fails the job above,"
          echo "with the offending host and the files that reference it. Hosts are added to"
          echo "that set only as a deliberate, reviewed decision, because each one is a"
          echo "third-party dependency the site then loads or links to."

      # These two checks are inline, so they run for everyone, tooling or not.
      - name: Enforce the 250 KB per-file budget on HTML
        run: |
          python - <<'PY'
          import pathlib
          import sys

          CAP = 250 * 1024
          root = pathlib.Path(".")
          over = []
          for path in sorted(root.rglob("*.html")):
              parts = path.relative_to(root).parts
              if any(part in {".git", "node_modules", "assets", ".tooling"} for part in parts):
                  continue
              size = path.stat().st_size
              if size > CAP:
                  over.append((size, path.as_posix()))

          if over:
              print("These HTML files break the 250 KB per-file budget:")
              for size, name in sorted(over, reverse=True):
                  print(f"  {size / 1024:8.1f} KB  {name}")
              print()
              print("The budget exists so a single page cannot become a slow download")
              print("on a phone. Split the page, or move repeated markup into the")
              print("shared assets, then rebuild with the build tooling.")
              sys.exit(1)

          print("Every HTML file is within the 250 KB per-file budget.")
          PY

      - name: Assert every non-certification topic reserves the four difficulty tiers
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          TYPE_DIRS = (
              "keywords",
              "certifications",
              "tactics",
              "techniques",
              "mitigations",
              "detections",
              "groups",
          )
          TIERS = ("easy", "medium", "hard", "extremely-hard")

          bad = []
          total = 0
          for dirname in TYPE_DIRS:
              for path in sorted((pathlib.Path("data") / dirname).glob("*.json")):
                  topic = json.loads(path.read_text(encoding="utf-8"))
                  # A certification is a syllabus: its exercises live inside its
                  # chapters, so the difficulty ladder does not apply to it.
                  if topic.get("type") == "certification":
                      continue
                  total += 1
                  exercises = topic.get("exercises") or []
                  found = [e.get("difficulty") for e in exercises]
                  if len(exercises) != 4 or sorted(found) != sorted(TIERS):
                      bad.append((path.as_posix(), len(exercises), found))

          if bad:
              print("Topics that do not hold exactly the four difficulty tiers:")
              for name, count, found in bad:
                  print(f"  {name}: {count} exercise(s), difficulties={found}")
              print()
              print("Every non-certification topic carries exactly four exercises, one per tier:")
              print("easy, medium, hard, extremely-hard. A tier whose file does not exist yet")
              print("keeps status 'missing' and renders as 'Coming soon'. The tier itself is")
              print("always present, so the gap is visible. See data/schema/topic.schema.json.")
              sys.exit(1)

          print(f"All {total} non-certification topics hold exactly the four difficulty tiers.")
          PY
