# CyberPulseAcademy statistics Worker - wrangler configuration.
#
# This Worker is the only non-static piece of the project and deploying it is
# optional: the site ships with statsProvider set to "local", so no statistics
# leave the browser until you deliberately turn remote mode on.
#
# Three commands deploy it, in this order:
#
#   1. npx wrangler kv namespace create CM_STATS
#        Creates the KV namespace and prints an id. Paste that id into the
#        kv_namespaces block below.
#   2. npx wrangler secret put IP_HASH_SALT
#        Prompts for a long random string. This is the salt used to hash a
#        visitor's IP address before it becomes a rate-limit key. It is a
#        secret, so it is never written in this file.
#   3. npx wrangler deploy
#        Publishes the Worker and prints its hostname, for example
#        https://cyberpulseacademy-stats.<your-subdomain>.workers.dev
#
# After that, paste the printed hostname into statsEndpoint in
# assets/js/config.js and change statsProvider from "local" to "remote".
# Do not skip that last step: the Worker is inert until the site points at it.
#
# Before switching remote mode on, make sure pages/privacy.html and
# pages/cookies.html are published and describe this collection accurately.
# Collecting statistics without a published privacy policy is a genuine legal
# exposure, not a formality. See cloudflare-worker/README.md.

name = "cyberpulseacademy-stats"
main = "worker.js"

# Pinned to a real, recent Workers runtime date. Bump this deliberately when
# you want newer runtime behaviour; an old date is not deprecated, it is a
# compatibility promise, and this Worker only uses long-stable APIs.
compatibility_date = "2025-01-15"

# Optional. Wrangler usually infers the account from `wrangler login`, so this
# stays commented out. Uncomment it only if you manage several accounts and
# want this project pinned to one of them.
# account_id = "00000000000000000000000000000000"

# The KV namespace that holds every aggregate.
#
#   npx wrangler kv namespace create CM_STATS
#
# prints something like:
#
#   [[kv_namespaces]]
#   binding = "CM_STATS"
#   id = "0123456789abcdef0123456789abcdef"
#
# Replace <your-kv-namespace-id> below with that id. The id is not a secret -
# it is not usable without your account credentials - but it is specific to
# your account, so a fork must create its own namespace rather than copy this
# one.
[[kv_namespaces]]
binding = "CM_STATS"
id = "<your-kv-namespace-id>"

[vars]
# The exact browser origins allowed to POST events and read the statistics.
# A comma-separated list, with no trailing slash and no wildcard: the Worker
# refuses every other origin outright, and a wildcard would let any site on the
# internet use your endpoint as its own free backend.
#
# Replace <user> with your GitHub account or organisation name. The value must
# match the origin the site is actually served from, scheme included.
#
#   GitHub Pages project site:  https://<user>.github.io
#   GitHub Pages user site:     https://<user>.github.io   (same origin)
#   A custom domain:            https://your-domain.example
#
# The origin is the scheme and host only. A path such as /cyberpulseacademy is never
# part of an Origin header, so it must not appear here.
ALLOWED_ORIGINS = "https://<user>.github.io"

# PLACEHOLDER SECRET - DO NOT COMMIT A REAL VALUE HERE.
#
# This is the salt used to hash a visitor's IP address before it becomes a
# rate-limit key, so the raw address is never stored. The value below is a
# visible placeholder so that the file is syntactically complete and a local
# `wrangler dev` run still works. Replace it, and set the real value as a
# secret rather than in this file:
#
#   npx wrangler secret put IP_HASH_SALT
#
# `wrangler secret put` stores it encrypted in Cloudflare and overrides this
# value in the deployed Worker, so the deployed Worker never uses the string
# below. Rotating the salt simply resets the rate-limit counters, which is
# harmless.
IP_HASH_SALT = "replace-this-with-a-long-random-string-set-via-wrangler-secret-put"

# Optional: tail the Worker's logs while you test the deployment.
#
#   npx wrangler tail
#
# Logs contain no visitor identifiers, because nothing in worker.js writes one.
